<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>آلة الزمن</title>
<meta name="robots" content="noindex"><script>
(function () {
  var days = ["20051013", "20051020", "20051023", "20051024", "20051025", "20051126", "20051202", "20051228", "20060215", "20070922", "20071003", "20071005", "20071006", "20071008", "20071009", "20071016", "20081220", "20090219", "20090614", "20090813", "20091111", "20091212"], def = "20091111", q = (location.search.match(/[?&]d=(\d{8})/) || [])[1], best = def;
  var t = function (d) { return Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)); };
  if (q) { best = days[0]; for (var i = 0; i < days.length; i++) {   // the nearest saved day, the earlier on a tie
    var a = Math.abs(t(days[i]) - t(q)), b = Math.abs(t(best) - t(q));

  location.replace("/tm/ramadan/" + best + "/");
})();
</script></head><body><p><a href="/tm/ramadan/20091111/">رمضان</a></p></body></html>
