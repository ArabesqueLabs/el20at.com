[[comments]]
order = 7
subject = "امركم عجيب اتحسدون الناس على ماتهم الله 0"
author = "ابومحسن غربة 25 سنه"
text = "اتحسدون الناس على ماتهم الله 0<br />ذلك فضل الله يوتيه من يشاء<br />ويرزق من يشاء بغير حساب<br />يا عم الناس دي ما نمتش على نفسها زيكم الناس دي صحيا على طول صحيين 24 ساعة<br />علشان خاطر كده وصلت<br />انما انتو فمواركوش غير البص والقر مش عارفين تعملوا حاجه<br />روحوا اشتغلوا يا عم روحوا تاجروا<br />المشكلة ان انتوا متهيألكوا ان الناس دي كبرت مرة واحدة زي الاخ الكاتب ما بيقول طوبة دهب وطوبة فضه<br />لا يا حبيبي الناس دي سهرت كتير اوي كانت الناس نايمة وهما صاحيين بيفكروا<br />حرب زيهم كده حاول تبحث عن البداية<br />احنا عندنا هنا في الخليج نفس المشكلة ناس كلهم جم يشتغلوا في الخليج اللي عمل ملايين عمل واللي نايم على نفسه فضل نايم<br />يعني انا مثلا ضيعتني البنوك كل همي اني احول مرتبي على البنوك المصرية لغاية ما ضيعتني البنوك المصرية كنا بنحول الجنيه المصري بخمس دراهم وهما يخفضوا سعر الجنيه ويرفضوا الاسعار لغاية ما رحت في داهية<br />غيري اشترى اراضي وعمل ملايين وغيري اشتغل في التجارة<br />حظوظ<br />اما انا بقا صاحب الحظ السيء اللي حوشت وحطيت في البنوك لغاية ما رحت في ستين داهية واخر قلم اخذته على وشي<br />الفايدة اللي نزلت من 10% الى 7%<br />دا اخر قلم اخذته على وشي من البنوك المصرية<br />معلش نصيبي كده"
archived = "2008-01-03"
capture_url = "https://web.archive.org/web/20080103111009/http://masr.20at.com:80/newArticle.php?sid=11281"

