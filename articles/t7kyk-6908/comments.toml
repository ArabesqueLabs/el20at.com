[[comments]]
order = 0
subject = "وكلهم ديدان طفيلية"
author = "مصرىمن ولاد البلد"
text = "الاستاذ الكاتب المحترم<br />تحياتى<br />انت عارف مصر عاملة زى اية<br />زى الجسم المريض المنهك المهدود اللى بتركبة الفيروسات والطفيليات والجراثيم وكل شىء كرية<br />وبعدين بيطلع من من طين الارض ولد مصرى ابن مصرى دكر شارب من بز امة بينتفض بيدق بكعبة الارض<br />ويصرخ باعلى صوتة تصحى مصر تنتفض تنطر البلاوى دى من عليها<br />نبدأ نلم النهابة والنصابين وكل اللى سرقوا وكل اللى اشتروا بدون وجة حق<br />كل فلس برة او جوة هيرجع بالمصادرة بالتأميم<br />نامى يا مصر واطمئنى ان كل حرامى هيدفع الثمن غال من دمة ودم عيالة<br />مفيش ثورة بيضة<br />فية انتقام ليوم الغد القادم<br />فية يوم هنضحى فية بالحرامية والكيلوا هيبقى ببلاش<br />يا امة يا بهية يا مصر اطمئنى بييجى الولد بيتولد من رحم العدم اسمة عبد الجبار او عبد المنتقم ولازم يتولد ولازم ترجع فلوسك املاكك وارضك كلها بترجع<br />ولازم ترجع<br />وحتى يأذن اللة<br />سننتظر"
archived = "2008-01-03"
capture_url = "https://web.archive.org/web/20080103111009/http://masr.20at.com:80/newArticle.php?sid=11281"

[[comments]]
order = 1
subject = "لــية المصريين فى انتظار المارد الهيخلصهم من نظام الحكم"
author = "احمد صالح"
text = "موضوع جامد جداااااا وتحية للصحفى الهمام بس كان ينقصك واحد زى طلعت مصطفى صاحب مشروع اسكندرية بلازا ومشروعات اخرى كتير ة لدرجة ان الريس مبارك بنفسة راح يفتتح مشروعة الاخير فى اسكندرية وكمان حسين سالم بتاع شرم الشيخ حبيب الريس بردة ويعتبر محتل شرم السيخ ووزير الاستثمار حبيب جمال مبارك والقائمة تطول<br />بالنسبة للاخ المعلق مصرى من ولاد البلد احنا لية دايما مستنين اليجى يخلصنا من نظام فاسد ولية احنا دايما مستنين المارد الهيجى يخلصنا من الظلم لية المصريين دايما عندهم الصبر عشان حد يجى يخلصنا مش عارف لية تركيبة الشعب دة كدة ومع ذلك محدش جة خلصنا من سننين طويلة وادينا مستنين فرج ربنا.............. وشكراا"
archived = "2008-01-03"
capture_url = "https://web.archive.org/web/20080103111009/http://masr.20at.com:80/newArticle.php?sid=11281"

[[comments]]
order = 2
subject = "مصباح قطب سفرجى اعلامى قبيح"
author = "وجدى عامر"
text = "اين اسم مصباح قطب الصحفى الذى باع تاريخة اليسارى من اجل حفنة دولارات من محمد العبار ، وجهاز محمول من ساويرس ، وفسحة فى دبى على حساب شركة الاتصالات الثالثة ،و.............................الخ<br />واخير تحول الى تابع يلعب دور حقير فى بيع بنك القاهرة بعد ان اختارة احمد عز ليحاور رئيس بنك القاهرة (احمد البردعى) ، بقرار من لجنة السياسات.<br />مصبح هبر لوحدة من العبار فى ازمتة مع شفيق جبر مالايقل عن 2 مليون جبيها،،،،،،،،<br />وسلم لى على القضية ،و يا عمال العالم باى باى كل واحد يشوف اكل عيشة....."
archived = "2008-01-03"
capture_url = "https://web.archive.org/web/20080103111009/http://masr.20at.com:80/newArticle.php?sid=11281"

[[comments]]
order = 3
subject = "جدو على"
author = "ابله فضيله"
text = "جدو جمال عندو عز الكلب وعنده قطه اسمها منصور وزلت قطه وقطه وقطه وجدو جمال قطه وكلب وجدو جمال بيموت فى المغربى<br />وجدو علاى عنده الالفى ؟<br />كل ده يوم الجحمعه فى المزرعه<br />فينك يا ؟"
archived = "2008-01-03"
capture_url = "https://web.archive.org/web/20080103111009/http://masr.20at.com:80/newArticle.php?sid=11281"

[[comments]]
order = 4
subject = "عفوا هذه مصر بتاعتهم !"
author = "شريف الدواخلى"
text = "مش هاقول الموضوع جميل جدا .... لانه جميل فقط صفه اقل من ان تصفه ....<br />بس هاقولك اننا بجد عاوزين موضوعات زى ديه فى الموقع بتاعنا بجد .. لانها فعلا بترفع منه قوى قوى<br />معلومات الموضوع عزيره جدا ... و مرتبه بشكل جميل .... و اول مره اعرف ان فى مصادر فى اصول العائلات \" منك نستفيد والله \" مصادرك اكثر من رائعه ...<br />ربنا معاك ومنور الموقع دايما"
archived = "2008-01-03"
capture_url = "https://web.archive.org/web/20080103111009/http://masr.20at.com:80/newArticle.php?sid=11281"

[[comments]]
order = 5
subject = "تاجر وترزي"
text = "زمان كان فيه بعض الترزية لما بيغتنوا شوية بيستعروا من كلمة ترزي فيعمل فترينة في المحل لبيع الاقمشة وبعد كده يبقى تاجر وترزي<br />في عالم الصحافة فيه بعض العاملين في هذا الحقل قاموا بتقليد تاجر وترزي بس اصبح الموضوع<br />مصمم ومحرر<br />مثل صديقي الاستاذ احمد القطب دا كان مصمم وفوجئت نهج نهج الترزي الغني واصبح مصمم ومحرر<br />وانتشرت هذه القضية الان بين الصحفيين تقرا التصيم الفني فلان الفلاني وتبص تلاقي اسمه مكتوب على موضوع صحفي<br />انا بقول الكلام دا لاني زعلان على مهنة الصحافة نفسي اشوفها مهنة متخصصة زي المحاماه وزي الطب وزي الهندسة<br />مهن ما حدث يقدر ينط عليها<br />لان الصحافة باه مهنة العاطلين اي واحد يشتغل صحفي للاسف<br />وهذا خاطرة وليست اساءة لاحد"
archived = "2008-01-03"
capture_url = "https://web.archive.org/web/20080103111009/http://masr.20at.com:80/newArticle.php?sid=11281"

