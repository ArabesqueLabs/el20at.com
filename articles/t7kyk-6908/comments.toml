[[comments]]
order = 9
subject = "الى بتاع الخليج 25 سنة"
author = "زعبلة"
text = "ما شاء اللة اية يا خويا اللى خلاك فى الخليج بعيد عن اهلك ربع قرن من الزمان<br />علشان ما لقيتش فرصة عمل ذات جدوى فى بلدك<br />علشان البلد مش عايزاك وانت ايش تكون بالنسبة ليها<br />لو البلد لعيالها مش للحرامية كنت عشت فيها<br />انما اتغربت وحطيت فلوسك فى البنك وهم سرقوا البنك وعملوا مشاريع بها واستفادوا وهربوا فلوسهم برة والبنك بتاعك معروض للبيع علشان يكملوا السرقة<br />وبعدين تقولى بلاش حسد وبيشتغلوا ومش عارف اية<br />هات لى شغلة شريفة تخلينى مليونير كبير قوى فى سنتين<br />خليك يا حبيبى هناك وكمل 25 سنة تانية وابقى قابلنى فى المشمش والفايدة بتاع البنوك هتزيد بس فلوسك ها يكلها البنك المفلس قريبا"
archived = "2008-01-03"
capture_url = "https://web.archive.org/web/20080103111009/http://masr.20at.com:80/newArticle.php?sid=11281"

