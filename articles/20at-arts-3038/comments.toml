[[comments]]
order = 6
subject = "الحبيب أبو وليد المكني"
author = "from tunisian"
text = "ذكرتني عديد البيانات التي صدرت بمناسبة تنفيذ حكم الإعدام في صدام حسين بحالي و أنا أجوب شوارع المدينة أحث المواطنين على الانخراط في المسيرات التي كنا ننظمها انتصارا للعراق وتنديدا بالتحالف الدولي ... أعادتني تلك المقالات الباكية إلى حالي و أنا أقتحم الصفوف رافعا لشعار: \"يا صدام يا حبيب ..أضرب، أضرب تل أبيب \" ...\" يا صدام يا بطل ...\" وقد شاركني في تلك الأحاسيس طبعا أهل بلدي صغيرهم وكبيرهم ،نسائهم ورجالهم ، مثقفهم وجاهلهم ، يمينهم و يسارهم ، كانت هناك معلومات كثيفة تختزن في ذاكرتي عن صدام الدكتاتور الذي قتل آية الله باقر الصدر مؤلف اقتصادنا وفلسفتنا و التفسير الموضوعي للقرآن ... وهي المراجع التي تشكل آنذاك جزء ا مهما من زادي الثقافي الذي أنافس به المنافسين لكن الهم الوطني كان أكبر و الانخراط في معركة الوجود الحضاري كان الأولى ومواجهة العدوان الأطلسي كان الأشرف و الأنبل ...<br />لم أكن في ذلك الوقت قد جربت بنفسي كيف يكون التعذيب ، و كيف يمتهن السجين ، و كيف يذل الشريف ، و كيف ينتهك العرض ، و كيف يكون التشفي و الامتهان و التعدي و الإيقاع و الشماتة والإذلال ...<br />وكنت أظن التعذيب في تونس قد وصل إلى منتهاه و أن الغطرسة والظلم قد بلغا مبلغهما و أن أجهزة القمع التونسية التي تدربت في بغداد و القاهرة ودمشق قد حازت على درجة الاحتراف في الهمجية والتنكيل و النذالة حتى جعلني الله ألتقي في هذه البلاد بجموع من الذين فروا من العراق ومنهم من كان ذلك لأسباب سياسية , و أغلبهم لما أصبحوا عليه من ضائقة اقتصادية بسبب الحصار الظالم . كان حديثنا لا يتوقف عن المظالم التي عاشها العراقيون بكل طوائفهم ، كان حوارنا عن جور صدام وأعوانه . وكان نقاشنا عن الأساليب التي يبندعها أعوان صدام للتنكيل بأهل العراق ، كنت أهم برواية قصتي مع التعذيب و المحاصرة و أحفر ذاكرتي لأستحضر كل ما عرفته من قصص تعذيب إخواني و لا أكاد أثير انتباه أحد منهم ... مدني أحدهم بكتيب ألفه أحد أشباه صدام الذي فر إلى الولايات المتحدة كان يروي زيارة له بدلا من صدام الجقيقي في الكويت زمن \" تحريرها من أسرة الصباح \" في أحد أيام سبتمبر من عام 1990 م فيذكر بعض الجثث التي تعلق على أبواب أصحابها لأنهم قاوموا الاحتلال العراقي وتمنع العائلات من دفنها أياما حتى تكون عبرة لمن يعتبر؟؟؟... شعرت عندها بالمهانة وكرهت نفسي التي أجازت لي تلك الأيام أن أتحمس لنصرة ديكتاتور لأنه رفع بعض الشعارات التي وجدت لها صدى في نفسي التواقة لإعادة أمجاد الأمة ومواجهة الاستعمار و الإمبريالية .. و أقسمت على ألا أقع في هذا الخطأ مطلقا مهما كانت الأسباب وجيهة و مهما كانت الشعارات براقة ...<br />وعندما اندحر الجيش العراقي في أقل من شهر و سقطت بغداد وحصلت النكسة الثانية كان التفسير المنطقي الذي يتفق عليه أصحاب العقول هو أن الدكتاتورية لا يمكنها أن تحمي الأوطان و إنها قد تحقق بعض الإنجازات وتبني الطرقات و الجامعات و تصنع الصواريخ و الدبابات ولكنها غير قادرة على الاستثمار في الإنسان و بالتالي فلا معنى لما تبنيه لأنه إلى زوال قريب . حصل ذلك مع هتلر في الأربعينات ورأيناه بأم أعيننا في العراق زمن صدام أ و لن أقنع أبدا أن الحالة الكارثية التي يعيشها العراق اليوم هي فقط بسبب الاحتلال كما يحب الإعلام العربي أن يردد دون كلل أو ملل فقد رأيت الآلاف من أهل ذلك البلد يهاجرون في كل الاتجاهات قبل الاحتلال وليس بسبب الحصار فقط كما بدعي المدعون و لم تكن هناك تدخل إيراني يصلح لتفسير كل الكوارث و النوائب وكان قبل الغزو العراقي للكويت مليونا عراقي خارج بلادهم يفرون من جور صدام وظلمه وهؤلاء اليوم يتوزعون على كل الجبهات وبعضهم يساير الناس فيتحدث ليرضي كل الجهات ...<br />إن تدفق المقالات التي تنعى الرئيس العراقي صدام حسين وتصفه بأجمل النعوت و أحسن الأوصاف وتضيف إلى عهده أكبر الإنجازات، و إن الأطراف التي تنظم مواكب العزاء و المسيرات و ترفع صور الزعيم نكاية كما تزعم في أعوان الاحتلال و انتصارا للمقاومة و تنديدا بصناع الفتنة الطائفية، تقوم بخلط الأوراق على المواطنين العرب بحيث لن يكون من السهل بعد ذلك التفريق بين مشروع قوى الحرية و الديمقراطية و إشراقة الإسلام وبين مشروع قوى الاستبداد و الفاشية و الدمار وهي لعمري خدمة كبيرة يحق أن يفرح بها حكام العرب المستبدين ليواصلوا تلاعبهم كما هي عادتهم بالعقول الساذجة ويعلنون بحق أن الغوغاء لا تصلح للحكم أو المشاركة فيه و أن كل حديث عن التداول على السلطة هو مؤجل حتى يقع التزايل و الفرز بين القوى العاملة لتحقيق الاستقلال الثاني حيث تستعيد الجماهير الواعية والمؤطرة حقوقها المسلوبة وتصبح إرادتها المصدر الوحيد للشرعية وبين قوى الفساد و الاستبداد و من يعاضدها من حملة الشعارات الخادعة و من الشعراء الذين استشكلت عليهم السبل و ظللتهم الأوهام التي لن تحقق ... إن خطاب الحرية والديمقراطية لا يمكن أبدا أن يلتقي مع خطاب الاستبداد و الديكتاتورية والفساد ."
