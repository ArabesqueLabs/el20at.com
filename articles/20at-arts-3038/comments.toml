subject = "صورة لصدام ردا على الاخ مش وائل"
author = "كتكوتة"
posted = "2007-01-17"
text = "عندي صورة هي بحق افضل رد على الأخ وائل اللي مش وائل اولا لابد ان تكون موضوعي في كرهك حتى تحصل على المصداقية<br />ثانيا حتى لو لم تكن كذلك فلابد انت تتمتع بقليل من اخلاق انسانية تجاه شخص اصبح بين ايدي الله وهو وحده اعلم به ان كان افضل مني ومنك ومنا جميعا ام لا<br />لكن للاسف لا اعلم كيف اضعها في هذه الصفحة حتى تشاهدوها جميعا<br />ولو تفضلت الاخت منى بارشادي اكن شاكرة"
