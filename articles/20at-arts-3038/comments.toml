[[comments]]
order = 3
subject = "الصورة ساعات بتكون حقيقية ...وأنا مصدقها"
author = "محمد السيد"
text = "عمر المختار ..... صدام حسين .....<br />تعرفى ساعات .... كنت بأرفض المقارنة .. أو أقله .... إزاي أساوي بين مجاهد ... و سفاح .... (علي الأقل قبل الاحتلال) لكن الصورة دابما كانت بتكدب ده ...<br />بمكن لأننا دلوقتي محتاجين أي حد يقدم لنا صورة راجل؟؟<br />يمكن لأننا (إحنا الجيل الجديد علي الأقل) عمرنا ما سمعنا عن نصر قريب ولا رمز يتقدم لنا زي ما سمعنا عن زمان ؟؟<br />ساعات بأفرض إننا يمكن لأننا متعذبناش منه ... أومشفناش منه اللي شافه العراقيين مثلا .... لكن ..طيب ما العراقيين نفسهم كتير منهم حاسس ده ؟؟<br />لما بأقول ياتري ده لو حصل لمبارك .. إيه رد الفعل ؟؟ بيكون الرد الطبيعي جدا علي السؤال ده: هو إنت متصور إن مبارك ممكن يقف وقفة الرجالة دي؟؟؟<br />من تاني.. عمر المختار ... وصصدام حسين ... الصورة قربت بينهم أوي ....<br />ويمكن الأيام الأخيرة اللي سمعناه فيه عن صدام ... ممكن يكون الحقيقة كمان قربت بينهم ....<br />بس برضه ...اسكت؟؟؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
