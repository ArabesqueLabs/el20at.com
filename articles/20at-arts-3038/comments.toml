subject = "إعدام صدام واختلاط الرسائل"
author = "وسام فؤاد"
posted = "2007-01-17"
text = "أنا أعذر أختنا منى على توجهها لأن الموقف يعمق الالتباس..<br />الشيخ عمر قال لا.. وصدام حسين قال لا.. لكن الولايات المتحدة أرادت في لحظة ما ان تجعل من قال لا بمثابة عبرة.. وهذا ما جعلنا نتعامل مع إعدام صدام بإحساس جرح كرامة الأمة.<br />حاولت كتير أخفي هذا الإحساس لأني حاسس إن المواقف المتعلقة بالمجال العام لا يمكن تكون عاطفية.. وناقشت نفسي ووصلت إلى نتيجة إنه يستاهل.. تخيلوا إن القاعدة السلوكية السياسية إن الأخ يبلغ عن ميول واتجاهات اخوه السياسية.. والأم تبلغ عن ابنائها.. والأب يبلغ عن أبنائه.. ولو لم يفعلوا ذلك يكونوا هم أنفسهم متهمين.. ده يستاهل ونص.."
archived = "2010-03-14"
