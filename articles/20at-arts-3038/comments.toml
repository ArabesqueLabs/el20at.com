[[comments]]
order = 5
subject = "......لشهيد البرص صدام حسين...."
author = "i m not wael 3abbas"
text = "أرسل هذا التعليق بواسطة : وائل عباس<br />إلى الشيطان بصدام المجرم<br />بجد مش قادر<br />برغم كل محاولات الأصدقاء إثنائي عن الكتابة حول موت صدام وطلبهم مني إلتزام الحياد في المسألة وكظم غيظي<br />حاولت وتحملت كل ما يكتب على الإنترنت وفي الصحف إياها من تمجيد للشهيد البرص صدام حسين<br />حتى جاءت القشة التي قصمت ظهر البعير بهذه الرسالة من الصحفية الأستاذة نور الهدى زكي<br />مش عارف بعتتهالي مخصوص ضمن مجموعة من الإيميلات في أول رسالة تشرفني بيها الأستاذة<br />مش عارف ليه<br />مع إني العدو اللدود للناصرية وفي نظرهم واحد مجرد مصوراتي معندوش فكر ولا تاريخ ويمكن يكون أمن وتاريخه غامض وعليه علامات استفهام وبامشي وراهم اصورهم في أوضاع مخلة !!!<br />اه<br />يمكن علشان مصوراتي<br />عاوزينني أروح أصور صلاتهم !!!<br />ولا يمكن أسمعلي هتافين حرق دم من عينة اللي بيشنق الزعامات ... بكره يحصل السادات<br />ماهم مش بيعرفوا غير الهتافات اللي آخرها ...ــات<br />يا عالم<br />أتصلون على رجل أعدم زملاؤه ومن ساعدوه في الإنقلاب العسكري على البكر لأنهم يصلون؟<br />رجل قال لزملاؤه هل ولاؤكم للثورة أم للصلاة؟<br />إلى الجحيم بصدام المجرم الذي قتل من المسلمين سنة وشيعة وكردا وإيرانيين ومصريين مليونان ولم يقتل حتى ولو نفر قليل من الإسرائيليين والأمريكان ويسقط كل الفاشيون المجرمون وأنصارهم من المرتزقة الحنجورية وصحفهم وأحزابهم<br />صدام من جر على شعبه الهوان والغزو بمغامراته وحماقاته الرعناء وشعاراته الجوفاء بلا سند من قوة فكان ألعوبة في يد الأذكياء<br />صدام من كانت كل قوته في حنجرته كغيره من النعاج الذين يحكمون في المنطقة وغيرهم من الفاشيست المرتزقة المتطلعين للسلطة يبكون على أحد مموليهم الرئيسيين<br />هان عليكم الدم المصري دم إخوتكم وابناء شعبكم ممن أرسلهم صدام في توابيت بطلقات في رؤوسهم وكذب علينا نظام مبارك وقال أنهم ماتوا في وباء معدي بالعراق حتى لا نفتح التوابيت<br />صدام من كانت كل حروبه وغزواته ضد من تسمونهم أشقاء ومسلمين سواء في إيران أو الكويت ولم ينب إسرائيل أبدا من الحب جانب حتى عندما ضربته في عقر داره ودمرت مفاعله النووي فلم يصدر عنه نحوها حتى الفساء<br />ياللوقاحة<br />إلى الشيطان يا صدام<br />إلى الشيطان ومعه في حفرة القار المعتمة في أسفل سافلين جهنم إن شاء الله وفي الطريق إليك كل من شابهك وأتمنى أن يكون بيدنا لا بيد عمر هذه المرة"
archived = "2010-03-14"
