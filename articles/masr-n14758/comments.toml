order = 0
subject = "السياسة الفاشلة ستؤدى الى نقل الثقافة من القاهرة"
posted = "2008-03-20"
text = "كانت القاهرة تعتبر عاصمة العرب الثقافية والاعلامية<br />ويبدوا ان غباء المسئولين فى مصر سوف يؤدى بقرارتهم الغبية الى نقلها من القاهرة<br />علشان عندكم النايل سات هتتحكموا فى القنوات بغباء<br />طيب ياروح امك انت وهو دولة قطر هتعمل قمر صناعى وهتجذب القنوات كلها هناك<br />وابقى اعقدوا على تلها لما تخرب"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002936/http://masr.20at.com:80/newArticle.php?sid=14758"
