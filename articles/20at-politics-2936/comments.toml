subject = "ياعم سيبك"
author = "حمدى"
text = "ياعم سيبكم من العك اللى بتقولوة دا<br />بلا اعتصام بلا كلام فارغ<br />زيدان بيقولها صراحة انة مسيحى<br />لكن واللهى العيب مش علية العيب على رئيس الجزاااائر اللى راح يدعية<br />لكى يزور البلاد"
