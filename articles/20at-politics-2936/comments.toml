order = 4
subject = "36 عام على اخر مقال"
author = "سيف عبد اللاه"
text = "على الرغم من ان الموضوعات جميله وتدل على براعه الذين يقومون بكتبت المقالات واننى على علم بان اكبركم سنا لم يتجوز الخامسه وعشرين من عمره الا من يقوم بقراءه اخر تحديث يلاحظ انه مكتوب الاول من يناير 1970 اى ان احدث مقال مر عليه 36 عاما وهذا فى جميع المقالات الاخيره ارجو تفادى هذا الخطا<br />وتفضلوا بقبول فائق الاحترام<br />سيف عبداللاه"
archived = "2010-03-14"
