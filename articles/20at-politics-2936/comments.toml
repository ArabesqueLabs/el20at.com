subject = "ضع عنوان التعليق"
author = "يا رب ارحمنا"
text = "ما تبطلو بقى الكلام ده, مسلم و لا مسيحى ايه يعنى لا الاسلام هينقص و لا المسيحية هتزيد بيه اللى يسلم خير و بركة واللى مش عاوز هوا حر (لا اكراه فى الدين ) خلونا فى خيبتنا التقيييييييييلة<br />مسلمة و محجبة"
