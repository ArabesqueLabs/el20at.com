order = 1
subject = "احلام اوهام"
author = "أرابيسك"
text = "زى ما انا كاتب فى العنوان احلام اوهام ان اعتصام زى ده يحصل فى مصر<br />مش علشان اللى بيحصلل للحريم على سلم نقابه الصحفيين<br />و لا علشان الرجالة اللى بتتقلع ملط فى أقسام الشرطه<br />و لا علشان صناديق الانتخابات بتاعه 99.9%<br />و لا علشان ان عندنا المواطنين بيدخولا لجان الانتخابات من شبابيك الحمامات علشان الامن المركزى قافل الباب<br />بس علشان حاجة واحده بس ان القانون اللى متفصل بلمقاس زى السديرى بتاع الباشا بيقول ان اكتر من 5 اشخاص معا يبقى تجمهر<br />http://arabesq.blogspot.com<br />هاهاهاهاهاهاهاهاااااااااااااااااااااااااااااااااااااااااااااااااااااى"
archived = "2010-03-14"
capture_url = ""

