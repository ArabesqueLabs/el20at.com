subject = "كنت سأبيع الإسلام"
author = "يوسف"
text = "كنت سأبيع الإسلام<br />منذ سنوات ، انتقل إمام إحدى المساجد إلى مدينة لندن- بريطانيا، و كان يركب الباص دائماً من منزله إلى البلد.<br />بعد انتقاله بأسابيع، وخلال تنقله بالباص، كان أحياناً كثيرة يستقل نفس الباص بنفس السائق.<br />وذات مرة دفع أجرة الباص و جلس، فاكتشف أن السائق أعاد له 20 بنساً زيادة عن المفترض من الأجرة.<br />فكر الإمام وقال لنفسه أن عليه إرجاع المبلغ الزائد لأنه ليس من حقه. ثم فكر مرة أخرى وقال في نفسه: 'إنسَ الأمر، فالمبلغ زهيد وضئيل ، و لن يهتم به أحد ...كما أن شركة الباصات تحصل على الكثير من المال من أجرة الباصات ولن ينقص عليهم شيئاً بسبب هذا المبلغ، إذن سأحتفظ بالمال وأعتبره هدية من الله وأسكت.<br />توقف الباص عند المحطة التي يريدها الإمام ، ولكنه قبل أن يخرج من الباب ، توقف لحظة ومد يده وأعطى السائق العشرين بنساً وقال له: تفضل، أعطيتني أكثر مما أستحق من المال!!!<br />فأخذها السائق وابتسم وسأله: 'ألست الإمام الجديد في هذه المنطقة؟ إني أفكر منذ مدة في الذهاب إلى مسجدكم للتعرف على الإسلام، ولقد أ عطيتك المبلغ الزائد عمداً لأرى كيف سيكون تصرفك'!!!!!<br />وعندما نزل الإمام من الباص، شعر بضعف في ساقيه وكاد أن يقع أرضاً من رهبة الموقف!!! فتمسك بأقرب عامود ليستند عليه،و نظر إلى السماء و دعا باكيا:<br />يا الله ، كنت سأبيع الإسلام بعشرين بنساً!!!<br />وبعد<br />تذكروا إخوتي وأخواتي ، فنحن قد لا نرى أبداً ردود فعل البشر تجاه تصرفاتنا ..<br />فأحياناً ما نكون القرآن الوحيد الذي سيقرؤه الناس ..<br />أو الإسلام الوحيد الذي سيراه غير المسلم ..<br />لذا يجب أن يكون كلٌ مِنَّا مثَلاً وقدوة للآخرين<br />ولنكن دائماً صادقين ، أمناء لأننا قد لا نُدرك أبداً من يراقب تصرفاتنا ، ويحكم علينا كمسلمين...<br />وبالتالي يحكم على الإسلام"
