subject = "ألله غالب"
author = "جمال محمود معتوق"
posted = "2007-06-20"
text = "ألله غالب على أمرنا يأخ اذا كان على ألشعب ألمصرى يأخذكم فى حضنه أهلا وسهلا بكم مسلمين ومسيحيين فأما معاملة ألأمن ألمصرى فهو يعامل ألمصريين كذلك فأما ألأوربيين فهم أسياد ألعالم لأنهم ناس ترعب أما نحن ألعرب ألله غالب على أمرنا"
