[[comments]]
order = 2
subject = "لا تشمت"
author = "أحمد المصري"
posted = "2007-06-21"
text = "عند الشدائد تختفي الخلافات الدينية و العرقية و السياسية ويتبقى الإنسان و مراعاته لأخيه الإنسان. الأديان وصتنا بالرحمة و التسامح ليس فقط بالإنسان بل بالحيوان أيضا.<br />و إلي السيد \"محمد المصري بجد\" هذا ليس وقت شماتة و ليس ذنب هاؤلاء الناس أنهم صدقوا أن أمريكا تريد الديموقراطية فعلا و اختارو بحرية \"حماس\" عدوة إسرائيل هاؤلاءالأطفال لم يختاروا حماس.<br />لنسمع العميل عباس يقول عنهم إرهابيين ظلاميين يتلقون تعليماتهم من سوريا و كأننا نسمع أولمرت أو كوندى.<br />بغض النظر عن تأيدك حماس أو لا فهى إختيار شعب لا يستحق العقاب عليه و إن كنت أنا شخصيا لا أؤيده.<br />الكلاب و الحمير تجد من يعطف عليها ساعة الضيق هذه أختك في الإنسانية مسلمة أو مسيحية أو يهودية أو ملحدة. كن متحضر و ساند أخوك الإنسان في محنته و لا تشمت فالشماتة ليست من سمات الرجال.<br />لو أن هاؤلاء وقفوا علي حدود بلد محترمة لوفرت لهم المعونة السريعة و لكنك في بلد الريالة."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "مش بشمت .. بس انا ضد المتاجرة بمعاناة الفلسطينين"
author = "محمد المصرى فعلا تانى"
posted = "2007-06-22"
text = "اللهم لا شماته ابدا انا ضد الانحطاط ضد من يصورون ماساة شعب على انها تحرر ثانى وانسى كوندى شوية لان دى مش طريقة ناس عايزة تتحمل مسئولية ثقة الشعب فيك بتيجى من انجازتك على الارض مش انك تقدم نفسك قربان لاعدائك والناس بتولول عليك بطريقة الجزيرة .. لانك لما تحدد اهميتك من عداوة الاخرين ليك فدهخ بيعكس فى التحليل الاخير احساس بالدونية.. دى طريقة اطفال مراهقين بيتخانقوا مع ابوهم وياخدوا من امهاتهم فلوس فى السر .. حتقولى عباس بيتعاون مع امريكا لا ياشيخ جديدة دى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "لا أتكلم في السياسة"
author = "أحمد المصري"
posted = "2007-06-22"
text = "من فضلك إقرأ تاني أنا لست مع حماس كما إنني شخصيا لي تجارب سيئة جدا مع الفلسطنين حتى إنني أرفض التعامل معهم في عملي لأسلوب أغلبهم الذي هو أسوأمن الصهاينة.<br />و لكن أنا أذكرك أنك إنسان و حق أخوك الانسان عليك نجدته وقت الدين مسلم كنت أو مسيحي أو حتي ملحد و لكن إنسان."
archived = "2010-03-14"
