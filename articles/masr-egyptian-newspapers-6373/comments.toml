subject = "هى مش غزة اتحررت برضه زى ما مكة اتفتحت ولا انا فاه"
author = "محمد المصرى فعلا"
posted = "2007-06-20"
text = "لالا انا شايف ان غزة اتحررت المفروض الناس تكون مبسوطو اول مرة بسمع عن بلد اتحررت لتانى مره والناس فيها زعلانة من جيرانها انهم مبيدوهومش حق اللجوء .."
