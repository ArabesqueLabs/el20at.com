[[comments]]
order = 11
subject = ""
author = "محمد وحيد"
posted = "2010-03-01"
text = "يا مصريين افهموا و يا اصحاب العقول \" مصر لم تخل حرب منذ أكثر من 30 سنة \" ده اكتر من ممتاز و تاني حاجة ان البرادي مثلا الي انتو فكرينوا ملاك ده قضي اكتر من نصف عمره خارج مصر يعني مصري الجنسية و لكن امريكي قالبا و قالبا مثل احمد زويل كده \" مبارك مش حلو و جمال مش حلو بس مفيش احسن منهم \" من رأيي ان الجامعات المصرية و خصوصا عين شمس و القاهرة فيهم من هم احس من البرادعي و موسي 1000 مرة و الاكتر من كده انهم مصريين قالبا و قالبا مش مصري متأمرك و البرادي ده مادرش يحوط رجله في اسرائيل او كوريا لجنوبية و اما كان من اهم اساب دخول العراق الي الغرب اغتصب اردها و نسائها و اطفالها و لو كان فعلا رجل حق كان عمل بمنصبة و دخل فتش في اسرائيل و متنسوش انها منظمة دولية اكبر من اي دولة و في الحق و العدل تذكروا قول رسول الله \" لو أن فاطمة بنت محمد سرقت لقطعت يدها \" لو زويل مصري لاكان ادي علمه لمصر و لو البرادي مصري لاكان ساهم في تطوير المؤسسة النووية في مصر : الله يرحمك يا د/ مصطفي مشرفة و بعيدا عن اي حد \" لو لم اكن مصريا لوددت ان اكون مصريا \" و تاني افتكروا ان الرسول قال ان خير اجناد الارض هم جنود مصر"
archived = "2010-03-14"
capture_url = ""

