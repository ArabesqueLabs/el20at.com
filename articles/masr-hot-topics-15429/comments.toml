text = ":-* حنفترض ان العيب فى الرئيس وان الشعب كلة شريف و عفيف و ان مفهوش حرامية ولا تجار اثار وان مفهوش مرتشين ولا مزورين ولا تجار مخدرات ولا بتوع نسوان ولا تجار عملة ولا خمرجية ولا رؤساء بنوك حرمية وان البلد كلها مشية على الصراط هل لو جبنا البرادعى حيغير كل الناس دى؟ من جهة اخرى لو خدنا الرئيس اللى مش عاجبكم و مسكناة السعودية لمدة سنة مثلا هل الناس حتشتكى ؟لا لية عشان هما كويسين مفيش سرقة محدش بياخد حاجة من حق حد تانى بطريق مباشر او غير مباشر بيتقوا اللة و حاجات كتير......................"
