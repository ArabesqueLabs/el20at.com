text = "والله الشعب المصرى دا شعب غلبان اى واحد يطلع يقول كلمتين فى الهوا يبقى صح التفكير فين<br />مبارك رايس كويس جدا بس كفايه عليه كده<br />جمال مبنشفوش الا فى المباريات مع المنتخب<br />البرادعى واحد منعرف عنه حاجه غير انه اتربى على حجر الامريكان<br />يا جماعه عايزين رايس قلبه على البلد دى<br />الله يرحمك يا جمال عبد الناصر<br />شفولنا جمال عبد الناصر تانى دى مصر 80مليون منلقيش فيهم واحد قلبه على البد دى<br />والله يبقى حراااام"
