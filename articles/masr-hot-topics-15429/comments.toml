text = "التغير يبدا من القاعده للقمه مش ينفع نتكلم عن انتخابات الرئسه واحنا مش بنعرف نعزل رئيس حى او مدينه الديمقراطيه لازم تحدث بالتدريج نبدا بانتخابات لرائساء الاحياء والمدن ثم المحافظين ثم رائاسه الوزراء لابد من القضاءعلى المركزيه لازم تكون كل محافظه فى منافسه مع المحافظات الاخره فى التعليم والصحه والنظافه والشوارع والاستثمار علشان ده يحصل لازم يكون فى رجل قوى يقعد على كرسى الرئاسه وعلشان كده انا برشح محمد حسنى مبارك"
