subject = "رفض شبابي عربي في الداخل لمشروع الخدمة المدنية"
author = "أحمد بلال"
posted = "2007-06-03"
text = "أثار مشروع الخدمة المدنية الذي تسعى الحكومة الإسرائيلية فرضه حاليا على شباب عرب الداخل, حالة كبيرة من الرفض بين الأوساط السياسية و الشعبية في عرب 48, حيث رأوا في هذا المشروع خطرا يهدد وجودهم كمجتمع عربي فلسطيني, و جزءا من جهاز متكامل يصب في نهاية المطاف في المجهود الأمني لدولة عنصرية, بالإضافة إلى اعتباره مقدمة للخدمة العسكرية في صفوف الجيش الإسرائيلي, كما جاء في بيان حركة أبناء البلد الموجه للطلاب العرب في حيفا \"بعد تثبيت مبدأ \"الخدمة المدنية\" يأتي قرار التجنيد وتشغيل المؤسسة العنصرية للمجندين كـ\"سقاة ماء وحطابين\" لكي تتحول \"الخدمة المدنية\" إلى عبودية جديدة تُفرض على الشاب العربي\" و أكد البيان على أن الجيش الإسرائيلي هو نفس \"الجيش الذي ارتكب المجازر بأجدادنا و قام بتشريدنا وباغتصاب أراضي شعبنا عام 48 لتشكيل دولته العنصرية على أنقاض شعبنا\".<br />سياسة العصا و الجزرة, هي السياسة التي تستخدمها الحكومة الإسرائيلية في فرض مشروع الخدمة المدنية, حيث ربطت الحقوق التي يحصل عليها الشاب العربي كمواطن في إسرائيل بالواجبات التي يفترض عليه تأديتها متمثلة في \"الخدمة المدنية\", و هو ما اعتبره الجمهور العربي في إسرائيل محاولة لتبرير سياسة العنصرية و التمييز التي تمارسها السلطات الصهيونية ضده, مؤكدين على أن مصدر التمييز ضد الجماهير العربية لم يكن يوما منوطاً بالواجبات تجاه الدولة, وإنما مصدره هو العنصرية المؤسساتية في جوهر دولة إسرائيل, و في بيانها أكدت حركة أبناء البلد أن \"في الدولة الديمقراطية وبحسب الوثيقة العالمية لحقوق الإنسان، ليس هناك علاقة مباشرة ما بين تنفيذ الواجبات ونيل الحقوق\" و أضاف البيان أن تجربة عرب الداخل مع إسرائيل منذ عام 1948 تؤكد \"أن أي إنجاز لجماهيرنا لم يتحقق إلا بالنضال الجماهيري، و أن واقعنا هو لائحة اتهام وإدانة لدولة إسرائيل بوصفها دولة عنصرية, وطريق النضال الجماعي وتنظيم جماهير شعبنا وبناء المؤسسات الوطنية هو الأساس لأية إنجازات مستقبلية\".<br />و قد أكدت الشبيبة الشيوعية في بيانها الذي حمل عنوان \"أتطوع لبلادي لا لجلادي\", أن الخدمة المدنية لن تعود بفائدة على عرب 48, لأن \"الخدمة ستكون في مؤسسات, وبلداتنا تـفـتـقـر لهذه المؤسسات, وبالتالي, الخدمة ستكون في بلدات ليست عربية\", و أكد البيان أن الخدمة المدنية هي مشروع إسرائيلي لسرقة حقوق العمال \"الوظائف التي يشغلها المتطوع هي وظائف بطبيعتها لها معاش, فمن ناحية, عن طريق مشروع الخدمة المدنية, تسرق الدولة حقوق العمال, وتمتنع عن دفع معاشات, ومن ناحية أخرى تـزداد نسبة البطالة\".<br />و تحت شعار \"لست ساذجا .. لن أخدم ظالمي\" و \"الخدمة المدنية مقدمة لخدمة عسكرية\", تأسس الائتلاف الشبابي ضد الخدمة المدنية, و هو ائتلاف شبابي مكون من مجموعة قوى سياسية واجتماعية, على رأسها الجبهة الديمقراطية للسلام و المساواة, التجمع الوطني الديمقراطي, حركة أبناء البلد, الحركة الإسلامية, الحركة العربية للتغيير و مجلس الطلاب القطري العربي, و يهدف إلى توحيد كل القوى الطاقات من أجل العمل ضد مشروع الخدمة المدنية على الصعيد الشعبي والقانوني والإعلامي و التوعوي.<br />و في بيانه أكد \"الائتلاف الشبابي ضد الخدمة المدنية\" أن المشروع المقترح هو مشروع سياسي, يتعامل مع القضايا الجماعية لعرب 48 من باب الامتيازات الفردية المؤقتة, و ذلك على حساب الحقوق الجماعية للجماهير العربية في الداخل, و وجه الائتلاف نداء إلى كل المؤسسات الجماهيرية, الحزبية و الأهلية العربية, يطالبهم بتحمل مسئوليتهم و الوقوف موقفا موحدا و واضحا ضد هذا المشروع, دفاعا عن الحاضر و المستقبل, كما جاء في البيان.<br />كما طالب البيان الحكومة الصهيونية التي تربط الحقوق بالواجبات بتعويض عرب 48 عما أصابهم من أضرار جراء سياسة إسرائيل العنصرية \"إن شاباَ من قرية غير معترف بها, حيث تحجب عنه كل إمكانيات التطور وكل حقوق الإنسان الأولية وحقوق الطفل والحقوق الاقتصادية الاجتماعية, أو شابا صودرت أراضي عائلته أو هدم منزلها أو أي شاب وشابة عرب ضحايا التمييز, كل هؤلاء أي كل أجيالنا الصاعدة من حقها الطبيعي التعويض على الأضرار\" مؤكدا أن كل \"ما صودر من أملاك وميراث حضاري وثقافي وإنساني منذ 1948 تم استخدامه في مراكمة غنى المجتمع الإسرائيلي, وحرم منه أصحابه\".<br />في مؤتمر رجال الأعمال الإسرائيليين السنوي الذي عقد في هرتزليا في أواخر عام 2003, طرح رئيس الوزراء الصهيوني السابق أرئيل شارون فكرة فرض الخدمة الأمنية على الشباب العرب, و في فبراير 2004 طرح شارون خطته في بيان ألقاه على الكنيست الإسرائيلي, و التي تتلخص في إلزام كل شاب عربي بـ\"أن يساهم عدة سنوات في خدمة المجتمع سواء في الأجهزة الأمنية مثل الشرطة، أو عن طريق العمل في إطار المؤسسات المجتمعية مثل المستشفيات والمراكز الجماهيرية\".<br />و بالرغم من المزاعم الإسرائيلية بأن الخدمة المنوي فرضها على الشباب العرب هي خدمة مدنية, إلا أن اللجنة التي شكلها شارون لإنشاء \"الخدمة الوطنية المدنية\", أوكلت رئاستها لديفيد عبري قائد سلاح الطيران و مدير عام وزارة الأمن سابقا!, و قدمت اللجنة توصياتها في أغسطس 2004 لوزير الأمن!, و جاء في تلك التوصيات \"اللجنة توصي بفتح إطار الخدمة المدنية لأبناء وبنات الوسط العربي... بهدف إيجاد بديل للخدمة العسكرية لهم... بإقامة بديل يسمح للشباب العرب بخدمة الجمهور والمجتمع والدولة معا...بدل إضاعة طاقات اليهود الذين يخدمون في الجيش في الخدمة المدنية كجزء من الخدمة العسكرية"
