subject = "وأكد الجبلى أن مصر لا تستورد ألبان الأطفال من الصي"
author = "اكتب اسمك هنا"
posted = "2009-01-14"
text = "ومصر وفيها نهر النيل تستورد حليب من اصله ليه<br />افهم ليه<br />بأه المصريين اعظم فلاحين في الدنيا مش عارفين يربوا بهايم<br />لا حول ولا قوة الا بالله<br />الله يخرب بيت ابو ثورة 23 يوليو على بيت ابوهم هما اللي دمروا الزراعة في مصر"
