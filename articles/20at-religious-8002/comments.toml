[[comments]]
order = 1
subject = "وينك يا جدي.."
author = "سليمان"
posted = "2008-01-12"
text = "بداية شكرا لأخي قيس على عرض مثل هذا الموضوع، وكم نحن محتاجون إلى عرض لثقافتنا وتاريخ أجدادنا، فهناك القليل من الجيل الشاب اليوم من يدرك الحضارة التي عاشها اجدادنا.. وكيف استطاعوا ان يجدوا لهم في هذه الحياة مكانا يخطون فيه مستقبلهم على الرغم من عيشهم بطرق بسيطه وعلى اشياء بدائية.. لكننا اليوم نمتلك العلم والتكنولوجيا ولا نستطيع ان نخط لنا تاريخ وحضارة .. فيا ترى اين المشكله ... فينا ام في الادوات التي بين ايدينا.."
archived = "2010-03-14"
