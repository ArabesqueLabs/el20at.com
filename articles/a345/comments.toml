[[comments]]
order = 5
subject = "الاستعمار الامريكي والاستعمار الايرني اللا اسلامي"
author = "الماجده الاحوازيه"
posted = "2007-11-07"
text = "لا تستغرب ان كانت امريكا حاولت وتحاول بإسم الديمقراطيه ابادة الهنود والعالم العربي من اجل مصالحها وتريد ان تفرض بجناحيها علي العالم لكن ماذا ان كانت ايران تحاول بإسم الاسلام ان تبيد العرب في الاحواز وتحرمهم من كل حقوقهم علي سبيل المثال تحرمهم من لغتهم العربيه ومن ارتدائهم زيهم العربي تأخذ بثرواتهم كل نفط والغاز الوفير الي شعبها و يحصد شعبنا العربي الاحوازي الفقر والجهل والحرمان ومن تساعد ايران علي افعالها هم اشقائنا العرب بتجاهلم لقضيتنا العادله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "حافه الهاويه"
author = "sayed waheed"
text = "بدون جزور لايمكن ان تنبت النواه واذا تخلى الانسان عن الجذر وقع فى الهاويه فاضحى هشيما لا يقو على هفوة الرياح ولابد للقدر ان يلعب دوره كما شاء رب العباد فى تقدير مصير الناس ومهما طال العمر ولابد له من نهايه فلا نحزن على اللبن السكوب ولكن يجب مشاركه هؤلاء ولو بعتاب القدر لانة تخلى عن مبادئه امام طفيل ضعيف استطاع ان يتغلب عنه فى لحظه انكسار الزمن"
archived = "2010-03-14"
capture_url = ""
