text = "اللهم اهلك الظالمين بالظالمين واخرجنا م بينهم سالمين .<br />رغم انى اعتبر ان هذا لدعاء للضعفاء ؛ لكن هذا هو موقفنا بلا شك .<br />فاليوم اسرائيل تحاول ان تكون قوية باسلحتها لانها جبانة برجالها ؛ واليوم ايضا تحاول ايران الشيعية ان تكون قوية والبلدان يحاولان القضاء علينا نحن المسلمين السنة .<br />انكنتم لاتصدقونى راسلوا المسلمين السنة المقيمين فى العراق واعرفا المذابح التى تعمل فيهم بل واسالو العراقيين المتدفقين على مصر هربا من الجهنم العراقى واعرفوا منهم بل ابثوا فى الانترنت عن المذابح التى يقوم بها الشيعة ضد السنة .<br />وان كنتم لاتصدقون فانتم الخاسرون ."
