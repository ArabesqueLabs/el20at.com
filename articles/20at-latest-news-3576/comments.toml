text = "انتم تشتمون الدروز لماذا لانهم اشرف خلق اللة على وجعه البسيطه انتم لاتلعون من هم الدروز (من حما النبيمحمد عليه السلام منقبيلة قوريش اسالكم ام امه تحاول قتل نبي غير الاسلام ومن حما النبي محمد من القتل ودب الامان بقلبه وق الخليج لب الجماعه والصحابه المرافقه لرسل عليه السلام<br />انتم كفره اولاد قرده لا عرفون الدين ولا اللة انتم فسقه اولا اليهوديه انت اليهود اولاد عمكم انتم تعرفون هذا ان بناتكم تنتاك مع اليهود ويتمنون ان ينتاكو ع دروز ان الدروز شعب طاهر وماصل من جميع الاشياء من جنس وجنسهم خصب وكل مسلمه او نصرانيه تتمنى المنال زب درزي يا اولاد الكب<br />من انتم في السوديه ودول الخليج انتم تبعون عرضكم للغرب وانتم تمارسون الجنس مع الاولاد انتم بلا عرض ولا دين ولا شرف"
