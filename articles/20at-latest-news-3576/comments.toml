subject = "الفاطميون قادمون"
author = "Sllman Alfarrsi"
posted = "2007-12-30"
text = "من إمام دين التوحيد [إمام دين الدروز ]حمزة بن علي بن أحمد الزوزني الفاطمي (((جبريل _ سلمان الفارسي _ مسيح الحق والأمم [ غير عيسى بن مريم ] _ شعيب ..... ))) :<br />• المقام الإلهي [ الحاكم بأمر الله ] الفاطمي ليست له علاقة حتماً بالأنساب البشرية في جميع الأدوار الـ 72 ..... والفاطمي نسبة الى فاطوم .... وفاطوم هو إسم المقام الإلهي الذي تجلى في الدور الثالث من أدوار الحياة الدنيا ( أي منذ 341 مليون سنة ) .... فكان أول أدوار الحياة الدنيا دور المقام الإلهي العلي ( منذ 343 مليون سنة ) ثم الدور الثاني دور المقام الإلهي نيلياس ثم الدور الثالث كان للمقام الإلهي فاطوم .... الى تمام الـ 72 دور ...<br />• إذاً الدولة الفاطمية لا تنسب الى فاطمة بنت محمد ولا لعلي ولا لسلالته ولا إلى عبد الله المهدي [العبيدي]... وإنما إلى المقام الإلهي الثالث [ فاطوم ] الذي تجلى ببلاد ما تسمى مصر حالياً ....<br />• اقرأوا كتب السير والتاريخ جيداً وبروية وتمعن واعرفوا من هو الحاكم بأمر الله ... واعتبروا يا ذوي الألباب وعووا وحاذروا[ بيان للناس لينذروا به ].... أنتم تعرفون نتائج بعض ما جرى لأشخاص أو جماعات .... أما الأسباب والحكمة والعبرة من ذلك فلا علم لديكم بها .... وجميع من كتبوا وتناقلوا الأخبار عن الحاكم بأمر الله أيضاً ليس لديهم علم بالأسباب والعبر وبجميع الأمور المتعلقة بهذه المواضيع... وان الذين قتلوا أشر وأشنع قتله ... نحراً وقطع رؤوس وسلخاً وشواءً وحرقاً وتمزيقاً وجلداً وصلباً ..... جميعهم استحقوا ما تم فعله بهم بعدل وإنصاف وحكمة .... فأنتم لا تعلمون الغيب ولا تعرفون ما معنى العدل والحكمة والإنصاف والعبرة عند المقام الرباني [ الحاكم بأمر الله ] .... ولنذكركم بأننا :<br />• نحن الفاطميون من اقتلع باب كعبتكم من مكة وجعلناه باب للمرحاض الفاطمي العام في قاهرة المعز بمصر ... ونحن أيضاً من أقتلع الحجر الأسود وجعلناه موطئ قدم لنعال الفاطميين والفاطميات في ذاك المرحاض الفاطمي ... وقلنا لكم إن كان لكم إله فليرسل علينا طيراً أبابيل وحجارة من سجيل وليجعلنا كعصف مأكول ...وللتذكير أيضاً لو أردنا فعلاً نبش قبر رسولكم [ وكان ذلك قاب قوسين أو أدنى ] لنبشناه عنوة عنكم [ فليس لنا غاية بذلك ... وكنا لو أردنا ذلك ... وكان مجرد إقتراح ....كنا سنأتي برفاة محمد وعلي والصحبة وندفنهم في ذاك المرحاض الفاطمي ] , فمن اقتلع باب كعبتكم وحجرها الأسود واتى بهما الى قاهرة المعز بمصر لن يعجزه نبش قبر محمدكم وصحبته وجلب رفاتهم الى قاهرة المعز ودفنها في المرحاض الفاطمي ..... لكننا نبشناه حقيقة من خلال ما نعرفه وما قلناه عن سيرته المخزية [ سيرة الإبليس ] ...وبهذا نكون قد أزلنا أستار الكعبة كما أزلناها زمن الدولة الفاطمية ومنعنا كسوتها ......إستنجدوا بمحمدكم وعليكم وصحبتهم وآلهتكم ... يا للعجب إله دين التوحيد [ الذي لا إله غيره ولا معبود سواه ] متجلياً بقاهرة المعز وأنتم تقومون بشعائركم وألحانكم ورقصاتكم لكعبة عليكم ومحمدكم . وللتذكير أيضاً نحن الذين بنينا البيت ( آدم الصفا [ منذ 650 ألف سنة ]) ولصاحب البيت حرية التصرف ببيته , بأمر من إله دين التوحيد مولاي الحاكم بأمر الله .... أبيت من الحجارة تقدسون أم باني البيت إمام دين التوحيد تجلون وإله دين التوحيد تعبدون ....<br />• مجموع ما أمر المقام الرباني المتجلي[ باسم الحاكم بأمر الله ]قتلهم بجميع الأساليب كانوا (32952) كلباً مسعوراً إن كانوا شيوخاً أو قواداً أو غير ذلك ..... من الشياطين المتشيطنة والأبالسة المتأبلسة والعفاريت المتعفرتة والثعابين المتثعبنة والقرود المتقردنة والخنازير المتخنزرة والثعالب المتثعلبة ....والكلاب المسعورة التي تفوح منها رائحة العهر والدنس والقوادة .<br />• نحن الفاطميون [ للتذكير أيضاً ] من هدم كنيسة القيامة وجعلنا سطحها مداساً للأقدام والنعال الفاطمية والكنائس الأخرى أيضاً مثلها.... واحملنا الثعابين المتثعبنة صلبانهم على ظهورهم وألبسناهم زياً يتمايزون به عن غيرهم .... وقتلنا شياطينهم أشر قتله .... وقلنا لهم استنجدوا بيسوع وبرب يسوع والربة المومس مريم.... وإن كان لكم إله حقاً فلينقذكم مما أنتم فيه ....<br />• نحن الفاطميون[ للتذكير أيضاً ] الذين هدمنا معابد اليهود وجعلناها موضعاً وموطئاً لنعال الفاطميين ..... وألبسناهم زياً خاصاً بهم واحملنا خنازيرهم قرامي الحطب في أعناقهم .... وقتلنا أبالستهم وقرودهم أشر قتله ..... وقلنا لهم استنجدوا بموسى اللوطي وإله هارون وموسى وإله بني إسرائيل ....<br />• نحن الفاطميون نقول لكم [لجميعكم ]إن كان لكم إله غير إله دين التوحيد فليجيركم منا وليشفع لكم ولتشفع لكم رسلكم الإبليسية الشيطانية .... أتريدون أن تسير الأمور كما ترغبون وتحبذون وتتوقون ....أأصبحنا وإلهنا علكة تتشدق بها المومسات والهراطقة وأوباش البشر والنعال المتذاكية .... .<br />• ألا تذكرون ما فعل إمام دين التوحيد ( جبريل ) بعاد إرم ذات العماد وثمود وقوم صالح وقوم لوط وقوم مدين وقوم نوح ...... عودوا الى كتبكم وسيركم وتواريخكم .... وأعلموا كم هو شديد بأسنا وبطشنا ..... أتريدون الدين بالإكراه ..... ومن يريد الدين والآخرة ما علاقته بالأديان الأخرى ...تارة مباهاة وتارة قذفاً وتكفيراً ونزاعاً وتحاملاً واستباحة وتقتيلا ....وتتوسمون جنة محمد التي ملؤها الحوريات الشبقات اللاتي لم يمسسهن طمث .... واللاتي ما أن يفضضهن حتى يعدن بكارا وعلى الأرائك جاهزات منتظرات ... والمآكل والمشارب والجواهر والذهب والفضة .. ألدينا بيوت دعارة في الجنة ومحافل لإرواء الغرائز والأهواء ومجالس طرب للغناء والتراتيل والأناشيد والنغمات والتسبيحات والتجويد والغنات والألحان ومراقص وندوات للصلوات والعبادات والدبكات الهرطقية الدينية .....<br />• سجلنا جميع أقوالكم وأفعالكم عبر وحدات الزمن .... وإن هي إلا هنيهة .... وإذ جميعكم لدينا محضرون .... ولسوف نريكم ونذيقكم من صنوف العذاب شتى الأصناف والأنواع والأشكال والشدات وجميع الطعمات والأكلات وجميع الفواكه والحلويات ..... وفاكهة الصيف والشتاء أيضاً ...... ولنجعلنكم آيات بينات وعبر خالدات يتنسك ويرتعب ويرتعد عند ذكرها عتاة وجبابرة الجن والأنس ......فانتظرونا"
archived = "2010-03-14"
