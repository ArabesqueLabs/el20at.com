text = "كاتب هذا المقال والمدعي كونه درزياً هو أبعد ما يكون عن الدرزيه!<br />إنه بالتأكيد شخص من ديانه أخرى حاقد على الدروز لسبب ما ويحاول الانتقام عن طريق التحريف والكذب الهائل.<br />الديانه الدرزيه أبعد ما تكون عن هذا الهراء. الدروز إسلام إن رضيت أم أبيت أيها النذل. لو كنت رجلاً كما تدعي,<br />مكنت ذكرت إسمك الحقيقي يا أيها السافل الحقير!!!"
