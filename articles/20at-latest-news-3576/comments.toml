author = "المسلمه"
posted = "2008-07-15"
text = "اكبروا يامسلمين وين العقل والحكمه وين التفكير الصح<br />كلنا مسلمين اخوان في الله<br />واللي سب نينا وحبيبنا محمد صلى الله عليه وسلم فأقول له<br />مثواك النار باذن الله ياجاهل<br />هذا خلاف بين رئيسين صار بين الشعوب ماأقدر اقول غير وااحسفاااه<br />على كلمة المسلمين على الذين يدعون انهم مسلمين<br />صرنا مسخرة الشعوب يحق لهم يقولوا الاسلام فوبيا<br />عندنا تخلف وجهل لكن مع احترامي للاخوان الشيعه انتم الذين بدأتم بهذه النزاعات وجعلوتنا اضحوكه<br />نحن كنا اساس الحضاره والتقدم ولكن مع هذه الشعوب المتخلفه خذلنا نبينا<br />اكبروا يا(اصحاب العقول النيره)<br />جميعنا نردد كلمة واحده جميعنا نتبع دين واحد جميعنا نصلي الصلاة نفسها<br />ايها الشيعيون تصرفوا بحكمه وعقل ..<br />اضحووووووووكه على الاخر جميع ردروكم بها غباء"
