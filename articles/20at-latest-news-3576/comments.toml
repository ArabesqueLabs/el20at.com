text = "*****من إمام دين التوحيد [إمام دين الدروز ]حمزة بن علي بن أحمد الزوزني الفاطمي (((جبريل _ سلمان الفارسي _ مسيح الحق والأمم [ غير عيسى بن مريم ] _ شعيب ..... ))) :[[[ للمعنيين بالأمر فقط ... ]]]<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />• المقام الإلهي [ الحاكم بأمر الله ] الفاطمي حتماً ليست له علاقة بالأنساب البشرية في جميع الأدوار الـ 72 ..... والفاطمي نسبة الى [[فاطــــــــوم]] .... وفاطوم هو إسم المقام الإلهي الذي تجلى في الدور الثالث من أدوار الحياة الدنيا ( أي منذ 341 مليون سنة ) .... فكان أول أدوار الحياة الدنيا دور المقام الإلهي[ العلي] ( منذ 343 مليون سنة ) ثم بعده الدور الثاني دور المقام الإلهي [نيلياس ] ثم الدور الثالث كان للمقام الإلهي[[ فاطوم ]] .... الى تمام الـ 72 دور ...<br />• إذاً الدولة الفاطمية لا تنسب الى فاطمة بنت محمد ولا لعلي ولا لسلالتهما ولا إلى عبد الله المهدي [العبيدي] ولا لغيرهم ... وإنما حقيقة الأمر{ الانتساب} إلى المقام الإلهي الثالث [ فاطوم ] الذي تجلى ببلاد(ما تسمى مصر حالياً) ....<br />• اقرأوا كتب السّير والتاريخ جيداً وبروية وتمعن وتحسب واعرفوا من هو الحاكم بأمر الله الفاطمي ... واعتبروا يا ذوي الألباب وعووا وحاذروا واحتسبوا [ بيان للناس لينذروا به ].... أنتم تعرفون نتائج بعض ما جرى لأشخاص أو جماعات أو غير ذلك .... أما الأسباب والغاية والحكمة والعبرة من ذلك جميعه فلا علم لديكم بها .... وجميع من كتبوا وتناقلوا الأخبار عن الحاكم بأمر الله أيضاً ليس لديهم علم بالأسباب والعبر وبجميع الأمور المتعلقة بهذه المواضيع... وان الذين قتلوا أشر وأشنع قتله ... نحراً وقطع رؤوس وسلخاً وشواءً وحرقاً وتمزيقاً وجلداً وصلباً ..... جميعهم استحقوا ما تم فعله بهم بعدل وإنصاف وحكمة وعبرة وغاية .... فأنتم لا تعلمون الغيب ولا تعرفون ما معنى العدل والحكمة والإنصاف والعبرة والغاية عند المقام الرباني [ الحاكم بأمر الله ] ....<br />• *** ولنذكركم من خلال التواريخ والسّير بعض ما غاب عن أذهانكم { لعلنا نقدر عليكم ونحاسبكم بالعدل والقسطاط والعبرة ... قد يكون ....ولعل الأمر ....ولنفترض أن الأمر هكذا.... }..... ومن الحقائق التاريخية الفاطمية :<br />• *** نحن الفاطميون من اقتلع باب كعبتكم من مكتكم وجعلناه باب للمرحاض الفاطمي العام( بيت الخلاء ) في قاهرة المعز بمصر ... ونحن أيضاً من أقتلع الحجر الأسود وجعلناه موطئ قدم لنعال الفاطميين والفاطميات في ذاك المرحاض الفاطمي ( بيت الخلاء ) ... وقلنا لكم إن كان لكم إله فليرسل علينا طيراً أبابيل وحجارة من سجيل وليجعلنا كعصف مأكول ...وللتذكير أيضاً لو أردنا فعلاً نبش قبر رسولكم [ وكان ذلك قاب قوسين أو أدنى ] لنبشناه عنوة عنكم [... وكنا ولو أردنا ذلك ... وكان مجرد إقتراح قابل للتنفيذ ....كنا سنأتي برفاة محمد وعلي والصحبة وتراب قبورهم وحجارتها وندفنهم{ جميعهم وجميعها } في ذاك المرحاض الفاطمي العام( بيت الخلاء ) ] , فمن اقتلع باب كعبتكم وحجرها الأسود واتى بهما إلى قاهرة المعز بمصر{ رغم أنوفكم} لن يعجزه نبش قبر محمدكم وصحبته وجلب رفاتهم وتراب قبورهم وحجارتها الى قاهرة المعز ودفنها{ جميعهم وجميعها مع بعضهم } في ذاك المرحاض الفاطمي العام ( بيت الخلاء ) ..... لكننا نبشناه حقيقة من خلال ما نعرفه وما قلناه عن سيرته المخزية [ سيرة الإبليس ] ...وبهذا نكون قد أزلنا ومحقنا أستار الكعبة وبان عريها وما تخبئه هذه الأستار , كما أزلناها ومحقناها زمن الدولة الفاطمية ومنعنا كسوتها واقتلعنا بابها وحجرها ......إستنجدوا بمحمدكم وعليكم وصحبتهم وآلهتكم ...<br />• *** فيا للعجب إله دين التوحيد [ الذي لا إله غيره ولا معبود سواه ] متجلياً بقاهرة المعز وأنتم تقومون بشعائركم وألحانكم ورقصاتكم وولائكم وهرطقاتكم لكعبة عليكم ومحمدكم . وللتذكير أيضاً نحن الذين بنينا البيت ( آدم الصفا [ منذ 650 ألف سنة ]) ولصاحب البيت حرية التصرف ببيته بما يشاء , بأمر من إله دين التوحيد مولاي الحاكم بأمر الله .... أبيت من الحجارة تقدسون أم باني البيت إمام دين التوحيد تجلون وإله دين التوحيد تعبدون ....<br />• *** أنسيتم الوثيقة والعهد التي كتبها إمام دين التوحيد سلمان الفارسي على محمد وعلي وصحبهم ... ومفادها ألا يتعرضوا جميعهم وأمتهم من بعدهم وأنسالها لجماعة سلمان الموحدين وأنسالهم {الفاطميين .... }ومناصرتهم في دينهم وجميع أمورهم ... وحفظ دمائهم ومالهم وعرضهم ومعتقدهم .....وكانت هذه الوثيقة والعهد موجودة ضمن وثائق الكعبة ومخزونة فيها ... وهناك نسخ عنها متوارثة .<br />• *** وللتذكرة فقط هل نسيتم أمر طيران الجبل المقطم بالقاهرة وتدكدكه وسجوده وسجود الطير والحيوان والحجر والشجر والبشر بزمن تجلي المقام الرباني الإلهي [باسم المعز لدين الله] الفاطمي بمصر ( بأمر منه ) .....زمن الدولة الفاطمية [ وهذه ليست خرافة وإنما هي إعجوبة وإعجاز وحقيقة من أقل مقدرات ومعجزات المقام ] .<br />• *** مجموع ما أمر المقام الرباني الإلهي المتجلي[ باسم الحاكم بأمر الله ]قتلهم بجميع الأساليب كانوا (32952) كلباً مسعوراً إن كانوا شيوخاً أو قواداً أو غير ذلك ..... من الشياطين المتشيطنة والأبالسة المتأبلسة والعفاريت المتعفرتة والثعابين المتثعبنة والقرود المتقردنة والخنازير المتخنزرة والثعالب المتثعلبة ....والكلاب المسعورة التي تفوح منها رائحة العهر والدنس والقوادة .<br />• ®®® نحن الفاطميون [ للتذكير أيضاً ] من هدم كنيسة القيامة وجعلنا سطحها مداساً للأقدام والنعال الفاطمية والكنائس الأخرى أيضاً مثلها.... واحملنا الثعابين المتثعبنة صلبانهم على ظهورهم وألبسناهم زياً يتمايزون به عن غيرهم .... وقتلنا شياطينهم أشر قتله .... وقلنا لهم استنجدوا بيسوع وبرب يسوع والربة المومس مريم.... وإن كان لكم إله حقاً فلينقذكم مما أنتم فيه ....<br />• ®®®نحن الفاطميون[ للتذكير أيضاً ] الذين هدمنا معابد اليهود وجعلناها موضعاً وموطئاً لنعال الفاطميين ..... وألبسناهم زياً خاصاً بهم واحملنا خنازيرهم قرامي الحطب في أعناقهم .... وقتلنا أبالستهم وقرودهم أشر قتله ..... وقلنا لهم استنجدوا بموسى اللوطي وإله هارون وموسى وإله بني إسرائيل ....<br />• &--8486;&--8486; نحن الفاطميون نقول لكم [لجميعكم ]إن كان لكم إله غير إله دين التوحيد فليجيركم منا وليشفع لكم ولتشفع لكم رسلكم الإبليسية الشيطانية .... أتريدون أن تسير الأمور كما ترغبون وتحبذون وتتوقون ....أأصبحنا وإلهنا علكة تتشدق بها المومسات والهراطقة وأوباش البشر والنعال المتذاكية .... .<br />• &--8486;&--8486; ألا تذكرون ما فعل إمام دين التوحيد ( جبريل ) بعاد إرم ذات العماد وثمود وقوم صالح وقوم لوط وقوم مدين وقوم نوح ...... عودوا الى كتبكم وسيركم وتواريخكم .... وأعلموا كم هو شديد بأسنا وبطشنا ..... أتريدون الدين بالإكراه ..... ومن يريد الدين والآخرة ما علاقته بالأديان الأخرى ...تارة مباهاة وتارة قذفاً وتكفيراً ونزاعاً وتحاملاً واستباحة وتقتيلا ....وتتوسمون جنة محمد التي ملؤها الحوريات الشبقات اللاتي لم يمسسهن طمث .... واللاتي ما أن يفضضهن حتى يعدن بكارا وعلى الأرائك جاهزات منتظرات ... والمآكل والمشارب والجواهر والذهب والفضة .. ألدينا بيوت دعارة في الجنة ومحافل لإرواء الغرائز والأهواء ومجالس طرب للغناء والتراتيل والأناشيد والنغمات والتسبيحات والتجويد والغنات والألحان ومراقص وندوات للصلوات والعبادات والدبكات الهرطقية الدينية .....<br />• &--8486;&--8486;&--8486; سجلنا جميع أقوالكم وأفعالكم عبر وحدات الزمن .... وإن هي إلا هنيهة .... وإذ جميعكم لدينا محضرون .... ولسوف نريكم ونذيقكم من صنوف العذاب شتى الأصناف والأنواع والأشكال والشدات وجميع الطعمات والأكلات الفاطمية وجميع الفواكه والحلويات الفاطمية ..... وفاكهة الصيف والشتاء الفاطمية أيضاً ...... ولنجعلنكم آيات بينات وعبر خالدات وعجائب وغرائب يرتعد ويتنسك ويرتعب عند ذكرها عتاة وجبابرة الجن والأنس ......فانتظرونا"
