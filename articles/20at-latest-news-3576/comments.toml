text = "&--1645;&--1645;&--1645;<<26 -1 -2008 >;>; [ 10 صباحاً ]<br />الملف الخاص بالموحدين الدروز..... وبلاد الأعراب والبداوى [ الأمة العربية ]<br />Sllman Alffarrisi<br />هذا الملف [ أقصد جميع ما كتبناه في هذا الملف ] هو ملف إرتكازي .... لن يغير ويعدل بمضمونه من اليوم فصاعداً .... لذلك وجب عليك الإحتفاظ به .... وإرساله الى أصحابك وأخوتك وخواتك ... وللآخرين ... وللمرجعيات والخصوصيات الدينية الدرزية ولكل من هو أو هي على دين التوحيد الدرزي .... ونشره وتوزيعه واجب كل موحد درزي [ ذكوراً وإناثاً ] .... ونسخه على أقراص خاصة كمرجعية [ لن يعدل عليه لاحقاً بمضمونه وإنما التعديلات تكون بما يضاف اليه من رسائل ] ... وإرساله عبر الأنترنيت ...الفاكس .... أو أي وسيلة تواصل أخرى ... ومن اليوم فصاعداً جميع ما يصلكم بعد هذا الملف من رسائل ..... تضاف اليه وتلصق به بمواضعها [ الأحدث في المقدمة وبداية الملف وفي أول صفحته]... وكل جديد يلصق بهذا الملف ببداية صفحته [ الأحدث فالأحدث ]..... وكل ما هو جديد من الرسائل التي تصلكم .... ترسل لأخوتكم وأخواتكم ... وأصدقائكم .... والمرجعيات والخصوصيات الدينية .....الذين أرسلتم لهم هذا الملف وهم بدورهم يلصقون كل رسالة حديثة بمقدمة وببدء صفحة هذا الملف .... إذا هذا الملف إرتكازي يضاف اليه الجديد والحديث من الرسائل لبدء صفحته ........إهمل جميع الملفات السابقة لتاريخ هذا الملف وأحتفظ فقط بهذا .. وما سيصلكم بعده ....... صدر وأفهم علناً<br />الحذر.... الحذر .... الى أصحاب المنتديات والمواقع والأشخاص الذين أرسلنا لهم .... والذين هم أرسلوا للآخرين .........<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />قد يستغرب البعض ويقول لماذا هذه اللغة التي خاطبنا بها بلاد الأعراب والبداوى [ وقلنا بجميع ما كتبنا .... لكل مقام مقال... وللمعنيين بالأمر \" أي الموما إليهم وإليهن \" ] .... نقول دين التوحيد عماده على حقيقة التقمص [ للحكمة الإلهية والعدل والإنصاف ... ] .... ولن نتكلم عن العصور والأدوار السالفة وما حصل لكل واحد منكم فيها من بطش الأقوام [ الظاهر والباطن وخليطيهما ] .... وقلنا ومن خلال التقمص أن جميع الأقوام والبشر الذين وجدوا عبر العصور والأزمنة والأدوار الماضية هم أنفسهم الموجودين حالياً على سطح الكرة الأرضية ... بما تحمله نفوسهم من محصلات موازين من آثام وخطايا وذنوب ..... وقلنا كتاب كل شخص [ مكتوب عليه ]منذ خلقته أي منذ 343 مليون سنة ونيف ... وعندما ينتقل بالأقمصة من قميص [ جيل ] إلى أخر [ وكمثال ومنذ خلقة الأنفس البشرية فلو نفس شخص ما وجدت في قميصها [ البدن ] في أول الأجيال أي بالجيل رقم 1 منذ خلقة النفوس البشرية وتقمصها فعندما يتوفى هذا الشخص ويخلق بمكان محدد حسب ما يقدره إله دين التوحيد يخلق في الجيل رقم 2 يكون ميزان أفعاله وأعماله وأقواله [ الظاهرة والمضمرة ] ومحصلاتها كتاباً على نفسه في بدء الجيل رقم 2 ....وفي بد الجيل 3 تكون محصلات موازين كتابه للجيل 1و2 موضوعة ككتاب لنفسه في بداية الجيل 3 .... وهكذا حتى بداية هذا الجيل لكل واحد من البشر في وقتنا وزمننا هذا .... ماذا يعني هذا .... يعني بأن جميع البشر في جيلهم هذا محصلة ميزان كتابهم الكلي عبر جميع أجيالهم عبر السنين والعصور والأدوار موضوعاً ككتاب كلي وكمحصلة على النفس في بدء جيلهم هذا .... ] .<br />اذاً جميع محصلات أفعالهم وأعمالهم وأقوالهم [ الظاهرة والباطنة ] عبر العصور والسنين والأدوار محسوبة وموزونة ومأخوذ محصلتها النهائية وموضوعة كتاباً على النفس في بدء هذا الجيل لكل واحد من البشر .... وهكذا حتى قيام الساعة ........<br />اذاً كتاب كل نفس المكتوب عليها منذ أول جيل من أول دور من أدوار الحياة الدنيا حتى الآن [ أي هذا الجيل ]هو كتاب جاهز وموزون وهو جميع المحصلات ولا نقول إن ميزان كل جيل لوحده بل نقول الميزان هو المحصلات النهائية .... وهو الكتاب المحصلة لجميع الأجيال [ لكل نفس بشرية ] منذ خلقة النفوس البشرية وتقمصها بالأبدان حتى هذا الوقت [ هذا الجيل ] .<br />لن نتكلم عن الأجيال السحيقة والعصور والسنين والأدوار القديمة .... بل سوف نتكلم عن الأجيال من دور المقام الرباني المتجلي الحاكم بأمر الله جل ذكره .... حتى وقتنا هذا .... وبهذا نكون قد أعطيناكم إشارة لما حدث لكم ومعكم عبر السنين والعصور والأدوار منذ تقمص الأنفس البشرية بأبدانها .....<br />ونقول للموحدين الدروز منذ زمن المقام المتجلي الحاكم بأمر الله حتى الآن .... أنتم أنتم ...تتوالدون عند بعضكم البعض وتتزاوجون من بعضكم البعض ولا تخلقون عند الشرائع والأديان والملل والطوائف الأخرى .... إذاً أنتم جميعكم إسرة واحدة ... فهذا أخ هذا في جيل وأبوه في جيل آخر وعمه.... وابن عمه .... وابنه في أجيال أخرى .... وكذلك الأمر للنساء .... فأي بنت موحدة درزية .... كانت إمك ... اختك ....بنتك .... زوجتك .... في الأجيال السابقة من دور الحاكم بامر الله حتى الأن أو بالعصور والسنين والأدوار السالفة ..... إذاً أنتم يا موحدين يا دروز أسرة واحدة .....<br />منذ غيبة المقام الحاكم بأمر الله [ وهذه إشارة لما حدث لكم في الأدوار السابقة قبل مقام الحاكم بأمر الله بالتجليات السابقة عبر الأدوار ومنذ بدء الخليقة وبعد مقام الحاكم بأمر الله ] ... منذ الغيبة ..... قامت بلاد الأعراب والبداوى بسنتها وشيعتها وأقباطها وباقي مسيحييها .... وباقي الملل والطوائف والأديان والنحل .... قاموا جميعاً طالبين دماء الموحدين الدروز .... لماذا!!؟؟ السبب لأن الموحدين الفاطميين الدروز يعبدون الإله الذي لا إله غيره ولا معبود سواه مولاي الحاكم بأمر الله جل ذكره [ ناسوت إله دين التوحيد ] ويقرون بإمامة إمام الزمان حمزة بن علي بن أحمد الفاطمي .... وسنتكلم عن فترة معينة [ وهي إشارة لجميع الفترات بعد مقام الحاكم بأمر الله جل ذكره ... وهي إشارة لما حدث قبله منذ أول الأدوار ] ....فترة علي الظاهرالفاطمي الشيعي الدجال .... وهو لايعرف أنه إبن زنا من شيعي ... وحسب نفسه من السنه لظواهر الأمور .... وجاهد؟؟؟!!! ومن معه لأعادة هيبة السنة والشيعة والإسلام .... فبدأت حملة الإبادة في مصر بالقاهرة والأسكندرية والصعيد وباقي معاقل الموحدين الفاطميين الدروز إبادة ما فعلها الخزر والبربر والمغول والتتر .... من حيث الوحشية والهمجية .... فكانوا يعذبونهم وأسرهم بجميع الوسائل المتاحة والأكثرها وحشية وهمجية ... وكل ذلك نابع من كرههم الشديد وبغضهم وغلهم وخبائث نفوسهم ....ويقصدون بذلك كل الغايات وغاية الغايات مولاي الحاكم بأمر الله جل ذكره والإمام العظيم حمزة بن علي بن أحمد .... وإذا فضعوا وعملوا التباريح بالموحدين الدروز .... يكونوا وحسب إعتقادهم بأنهم إنتقموا من مولاي الحاكم بأملر الله ومن إمام دين التوحيد وملائكة وأنبياء دين التوحيد .... وعملوا فضائع الأمور ... من سلخهم أحياء ....سلقهم .... حرقهم ... أغتصاب أمهاتهم وأخواتهم وبناتهم وزوجاتهم أمامهم ويتداورون عليهن ... وكل ذلك جهاد بأسم الدين ....ويقطعون قضيب الذكر منهم ويضعونه في فرج أخته وأمه وبنته .....وبعد التعذيب والإستباحة والإذلال يقطعونهم تقطيعاً وتمزيقاً وبتر الأطراف وتمزيق الأحشاء وإخراج الأحشاء من أمعاء وكبد وأطحلة ... أو القضيب .... ويطعمونهم لأفراد أسرهم ....وبعد جميع الأفعال والأعمال يذبحونهم ويقطعون رؤوسهم ويعلقونها على عتبات بيوتهم وعلى مساجدهم ودور عباداتهم ... وفي ساحاتهم ومحافلهم ومجالسهم ... ومجالس سلطانهم .....<br />فقد قتلوا [ ونحن نتكلم عن فترة علي الظاهر فقط ] واستباحوا ومثلوا في الأجساد في مصر وحدها [ فترة علي الظاهر ] 3 ملايين موحد وموحدة وأطفالهم وأسرهم وذويهم ... وحرقوا بيوت عباداتهم وبيوتهم وقراهم وممتلكاتهم وهدموها ونقلوا حجارتها ولبنها وطينها الى مكان يسمونه موضع النجاسة ..... وفي المغرب الأعرابي قتلوا واستباحوا ومثلوا في 3,2 مليون موحد وموحدة وأسرهم وأبنائهم وذويهم [ ونحن فقط نتكلم عن فترة علي الظاهر الفاطمي فقط ] .... وفي جزيرة بلاد الشام [ الخرابة ] سوريا ولبنان وفلسطين والأردن والجزيرة الأعرابية قتلوا واستباحوا ومثلوا في أجساد 5,3 مليون من الموحدين الفاطميين الدروز والموحدات وأسرهم وأطفالهم وذويهم .... وفي مقطرة الكفر وحدها [ أقصد حلب ] قتلوا واستباحوا ومثلوا في أجساد 900ألف من الموحدين الفاطميين الدروز والموحدات وأسرهم وأطفالهم وذويهم .... وفي إنطاكية الزاهرة وما يجاورها قتلوا واستباحوا ومثلوا في أجساد 1,2 مليون من الموحدين الفاطميين الدروز والموحدات وأسرهم وأطفالهم وذويهم .... وفي بلاد العراق وما يجاورها قتلوا واستباحوا ومثلوا في أجساد 2,5 مليون من الموحدين الفاطميين الدروز والموحدات وأسرهم وأطفالهم وذويهم .... وفي بلادفارس[ إيران وما يجاورها ] قتلوا واستباحوا ومثلوا في أجساد 2,7 مليون من الموحدين الفاطميين الدروز والموحدات وأسرهم وأطفالهم وذويهم .... ومجمل المقتولين والمذبوحين والمستباحين والممثل بأجسادهم وهم أحياءً وبعد موتهم أيضاً وحرقهم وتعليق رؤوسهم .... 37,8 مليون موحد فاطمي درزي وموحدة . هذا في فترة علي الظاهر الفاطمي فقط .... فكيف الأمر بجميع الأدوار والأجيال قبل مقام الحاكم بأمر الله وبعده .... ولأنكم لاتعلمون الغيب أردنا أن نعطيكم إشارة لحقيقة ما حدث ويحدث من الأمور .... ونقول إن الذين هم الآن بتماسكم في بلاد الأعراب والبداوى إن كانوا شيعة أو سنة أو مسيحيين ... أو غيرهم .... هم هم[ في أجيالهم السابقة قبل وبعد دور الحاكم بأمر الله الفاطمي ] هم قاتليكم ومعذبيكم ومستبيحيكم ومغتصبيكم وممثلي بأجسادكم [ أحياءً وبعد موتكم ] .... وحارقيكم وسالقيكم ...<br />إذاً من هم ألد الأعداء لكم .... وأنتم تتراقصون لهم وتغنون ...... ولو أردنا أن نطلعكم على الغيب لقلنا لكم عن كل واحد منهم إن كانوا رؤساء أو هيكليات حكومات أو هيكليات دينية ... أو غير ذلك ... كنا نقول لكم ماذا فعل كل واحد منهم [ من بلاد الأعراب والبداوى ] ماذا فعل أو فعلوا بكم عبر العصور والأدوار والسنين والأجيال ... ولكان أصابكم الهلع والرعب الشديد وعظيم الإستغراب .....<br />وعندما ننهيكم عن أمور معينة ونأمركم بأمور معينة .... فقراراتنا ليست عبثية ... أو مرتبطة باللحظة الزمنية الآنية ... إنما هي معتمدة على جميع موازين الأعمال والأفعال والأقوال عندكم وعند من هم بتماسكم من بلاد الأعراب والبداوى [ ما ظهر منها وما خفي ] .<br />الحذر .... الحذر .... يجب عليكم معشر الموحدين الدروز والموحدات أن لاتخالفوا أمر إمام دين التوحيد سلمان الفارسي [ حمزة بن علي بن أحمد – جبريل الحق ] بجميع الأمور التي كتبناها من خلال هذا الملف والتي سوف نكتبها لكم من خلال الرسائل القادمة [ التي نريدكم أن تضيفوها الى هذا الملف في مقدمة صفحته] ..... فإمام دين التوحيد لديه علم غيب الماضي والحاضر والمستقبل وما تكنه وتستره النفوس وهو أعلم وأدرى منكم في جميع الأمور في جميع الأزمنة .<br />صدر وأفهم علناً من إمام دين التوحيد حمزة بن علي بن أحمد الفاطمي [ جبريل الحق – سلمان الفارسي ..... ] .<br />تعريف الــــــــــــــــــــوطـــن عند إمام دين التوحيد [بصريح العبارة وحقيقتها وصدقها] هو إله دين التوحيد[ بجميع أموره \"التي نعرفها والتي لانعرفها\"].... وهو رمز تتقدس من قدسيته بلاد الموحدين أرضاً وسماءً.... ولا قدسية للتراب ولا للسماء إذا لم تكن مرتبطة جميع معانيها بهذا الرمز .... فهو ذات القدسية ومنبعها ومعينها ومنهلها الذي لا ينضب ..... إذاً قدسية بلاد الموحدين [ أرضاً وسماءً ] لا تكون إلاّ من قدسية هذا الرمز الخالد القدسي الذي يعيش في ذوات نفوس الموحدين....لأن وطن الموحدين يعيش في ذوات نفوسهم..... أما نعال الموحدين ونعال أجدادهم وأسلافهم وأنسالهم التي داست هذا التراب [ بلاد الموحدين وأماكن سكناهم ]فلا قدسية بهم ولا بنعالهم ولا بترابهم المداس بنعالهم.... ولا بسماء هذا التراب المداس بهذه النعال.... ولا بتراب رفاة أجدادهم ولابعظام أسلافهم... ولا بقبورهم ولابحجارتها ...... فلا قدسية للبشرالعاديين أحياءً كانوا أم أموات ..... قد يقول قائل .... مزار الشيخ فلان الذي ظهرت على يده البركات والمعجزات .... مزار... مقام ... النبي فلان .... ألاّ توجد قدسية لهم؟؟!! .... نقول لهؤلاءالشيخ فلان .... والنبي فلان هؤلاء خصيصة وليسوا بشراً عاديين بل هم من الملائكة والأنبياء .... ولا بد من توضيح أمر مهم بخصوص ملائكة دين التوحيد وأنبيائه وبخصوص الشيوخ الثقاة [ من الموحدين المنتقلين الى الجنة من أزمان سابقة إنما وجدوا على الأرض بخصوص خصوصية معينة ومهمة سرية مكلفين بها] هؤلاء أقصد الملائكة والأنبياء والشيوخ الثقاة الموحدين جميعهم خالدين ..... أي لا يتوفون ... ووجودهم على الأرض وبمكان وزمان معين لخصوصية معينة ولتكليف من إله دين التوحيد ..... وأيضاً كما قلنا عن إله دين التوحيد أنه خالد كما شرحنا لاحقاً بخصوص المقامات الربانية الفاطمية .... وأيضاً كالخالق العظيم إله دين التوحيد ..... عند إشهار وفاة ملاك أو نبي أو شيخ ثقة للملأ [ وكأنهم بشر عادي ]ما أن يغلق التابوت حتى يختفي الملاك أو النبي أو الشيخ الثقة يختفي عن الأنظار ويعود لبلاده الجنة [ والذين يقومون على إغلاق التابوت الفارغ وكأن به جثمان ... ويقوموا بحفل تعزية وتأبين ... يكونوا مطلعين على السر ويدفنوا هذا السر مع دفن ذاك التابوت الفارغ ويكونوا مأمورين بألا يطلع على هذا السر أي شخص ولو كان أقرب الناس لديهم ] ..... والبشر لاتعرف أنهم ملائكة أو أنبياء أو شيوخ ثقاة [ من الجنة ]... ويدفن السر بإختفائهم ... ويبقى الأثر والعبرة والموعظة ... وسيرة حياة ذاك الشخص[ أقصد الذي هو من الملائكة والنبيين والشيوخ الثقاة الموحدين ] والرسالة والمهمة التي كلفه بها إله دين التوحيد لإيصالها الى البشر والمرتبطة بزمان ومكان وأشخاص محددين .... إذاً هناك أسرار خفية بشأن التكليف وبجميع ما يتعلق بهذه المهمات .....<br />هؤلاء[ أقصد الملائكة والنبيين والشيوخ الثقاة الموحدين ] تتقدس الأماكن والتراب الذي داسوا عليه بنعالهم ويتقدس المزار والضريح [ الذي حتماً لايحتوي جثمان أو رفاة لهم ] يتقدس بإنتسابه إليهم .... إنتسابه من حيث الأسم... [ ضريح النبي فلان .. مقام النبي فلان ... مزار الشيخ فلان .... ].... إذاً توضح الأمر .... فالقدسية الحقيقية هي قدسية الوطن الحقيقي [ إله دين التوحيد ]..... ويعيش الوطن الحقيقي في نفوس البشر المؤمنة به ..... أما قدسية التراب والسماء في أماكن سكن الموحدين .... يتقدس التراب وسماءه من دوس نعال إله دين التوحيد وملائكة دين التوحيد وأنبياء دين التوحيد وشيوخه الثقاة ........وكل معنى أو رمز أو مكان يرتبط بأسمائهم بالأماكن التي تواجدوا بها عبر العصور والأزمنة .......<br />قلنا جميع الموحدين ليسوا مسلمين ولا علاقة لهم لابدين الإسلام ولا بالأديان الأخرى.....<br />وقلنا لكم مراراً وتكراراً ما هو معنى الوطن ..... فما بال الموحدين الدروز في جميع معاقلهم يتغنون ويتباهيون ويشمخون بموطن بلاد الأعراب والبداوى [ وطن الأمة العربية ].... سوريا يا حبيبتي... آه يانيالي .... ويركبون على ظهورهم ويسوقونهم كالبهائم من خلال هذه الشعارات الطنانة والرنانة .... ماذا [ لنتكلم عن سوريا مثلاً ... ] ماذا تريد منكم سوريا من خلال هذه الشعارات ..... أنتم عرب .... نعم عرب .... أنتم سوريين .... نعم سوريين .... وهذه ليست مكرمة من أحد عليكم .... لكن العرب السوريين أن كانوا سنة أوشيعة أوغيرها .... يدنسون المعنى والرمزالحقيقي للوطن عندكم ..... وهم أعداء لوطنكم الحقيقي ..... والأرض وسماءها بشعبها .... وشعبها عدو لدود لوطنكم الحقيقي .... إذاً سوريا تراباً وسماءً وشعباً من ألد أعداء وطنكم .... ... وما معنى أنكم تتكلمون اللغة العربية وتعيشون على أرض أجدادكم ولا قواسم مشتركة بينكم وبين باقي شعب سوريا .... اللغة ... الأرض [ أرض أجدادكم ] ... ليست مكرمات من أحد عليكم .... فكيف لو كان هذا الأحد ألد أعدائكم ... وألد أعداء وطنكم الحقيقي [ إله دين التوحيد ]..... والأنكى من هذا وذاك تقوم ثلة من الأقحاب ويختصرون موطنهم [ سوريا] بذواتهم وأشخاصهم .... ويصبح معنى الوطن عندهم ذاك القحب أو النعل ..... وتتغنون للأقحاب والنعال ..... وهم وهيكلياتهم ألد أعداء دين التوحيد ووطن دين التوحيد ..... وعلى المكشوف .... ماذا تريد منكم سوريا.... أتباع ...أزلام ...أدوات ...ذيول ....أذناب ....رقيق وعبيد ... إلخ ... وهم يتاجرون بكم مستبيحين دينكم ومعتقدكم وأماكن سكناكم وأعراضكم... وشرفكم وكرامتكم ... وعزتكم .... وتكلمنا لاحقاً عن الأساليب التي تتبعها بلاد الأعراب والبداوى بخصوص جميع شئونكم .....ونقول بالنسبة لدين التوحيد وفيما يتعلق بأمر العروبة والعرب ... حتى لو كان أخيك الشقيق وعلى دين التوحيد ووجدته ضالاً وخارج عن أسس ومرتكزات ومرموزات دين التوحيد تتبرأ منه وتعتبره ألد الأعداء ...فكيف بأمة قراع الجحش [ أقصد الأمة العربية ] التي هي ألد أعداء دين التوحيد وإله دين التوحيد وإمام دين التوحيد وملائكة دين التوحيد وأنبياء دين التوحيد وجميع الموحدين الذين انتقلوا .... وما همنا أن يتكلم العدو العربية ... أو السنسكريتية .... الهم أنه عدو مهما اختلفت ألسنته ولغاته .... إذا القاسم المشترك هو العداوة وليست اللسان أو اللغة ......<br />وإن كان إمام دين التوحيد ولمعرفته الغيب وأخفى .... هو الذي وضع الجولان خلف الأسلاك الإسرائيلية.... وهذه مشيئته وهو أعلم وأدرى بجميع الأمور .....<br />أمر صادر من إمام دين التوحيد لدروز الجولان ..... كل من يتغنى بمعنى الموطن [سوريا] وذيل وذنب لها ولرموزها .... أعتقد أن المعنى مفهوم .... يطرد من دين التوحيد الدرزي ... ولنجعلنه في إست حافظ الأسد وبشار الأسد وهيكلياتهم .... إلى يوم يبعثون... ويصبحوا هؤلاء المطرودين والمطرودات من دين التوحيد يصبحوا على دين العلوية والشيعة والسنة .... وكل من يعارض أمر إمام دين التوحيد [ حيث أمر أن تقبلوا الجنسية الإسرائيلية ... وتقبلوا تجنيد أولادكم بالجيش الإسرائيلي ]. كل من يعارض أمره [ في الجولان وفلسطين ] حتى ولو كان من كبار المشايخ .... يطرد من دين التوحيد الدرزي ويصبح على دين العلوية والشيعة والسنة ....<br />صدر وأفهم علناً من إمام دين التوحيد حمزة بن علي بن أحمد [ جبريل الحق – سلمان الفارسي .... ] .<br />أخذنا الجولان مثال أو إشارة وهذا ينطبق على جميع الموحدين في جميع الأماكن الأخرى [ في سوريا وغير سوريا ] ..كل حسب هيكلية الزمان والمكان والإمكان والسلطة والسلطان في بلده . أمر الجنسية والتجنيد خاص يتعلق بالموحدين الدروز الذين هم تحت حكم السلطات الإسرائيلية .<br />ــ الحــــــذر الـــــــــــحذر .... فلا تكونن من أخسر الخاسرين<br />من هو إلــــــــــهك؟؟؟ من هو إمــــــــــــــــامك ؟؟؟.... فكر ولا تتسرع وأجبني......<br />أنا أجيبك وأسهل الأمور عليك ... هذه المحافظة الرجسة النجسة العاهرة القحبة أقصد محافظة السويداء [ جبل الذروز والضروط.... بنو مطيز ] ... لهم آلهة وأرباب خاصة بهم تماماً ....فرب الأرباب عندهم حافظ الأسد ونسله وهيكليته ويأتي بعده من حيث درجات الربوبية والأمامة فروع الأمن والمخابرات ... والرب ذو الدرجة الثالثة عندهم حزب البعص وهيكلياته.... والرب المال وتقديسه والوصول لمرضاته بجميع الأساليب والدهاليز ... والرب الشرمطة والكرخنة والممحنة والمنيكة... والرب الكس والقطقوط والقط والفنوش والقطوش والكسكوس [ عند ذكورهم ] ... والرب العزيز والإير والزبر والقراع والحمام والزعنون [ عند إناثهم ].... ثم تأتي بعدها درجات أخرى من الربوبية والإمامة التي هي في موضع العبادة والتقديس .... الربوبية الأهواء .... والربوبية المصالح الطفيلية... والربوبية النفعية .... والربوبية الإنتهازية ....والربوبية التسلقية الوصولية.... والربوبية القوادةوالتقحيب والتعريص .... والربوبية الدياثة والدناسة ... والربوبية الوقاحة والحقارة والجسارة .... والربوبية النذالة والبخاسة والوطاوة .... والربوبية الدناءة والوساخة و الخساسة .... والربوبية العهارة والرجاسة والنجاسة ....والربوبية العلويين وعليهم ... والربوبية السنة ودوحة الإسلام ومحمدهم...والربوبية امة الأعراب والبداوى [ الأمة العربية \"\"الجيفة\"\" ] ... وهذه قواسم مشتركة في محافظة بنو مطيز .... وهناك الكثير الكثير من الأرباب والأئمة الكثر غير الذين ذكرناهم عند [بنو مطيز ] ..... وهي أرباب مشتركة ومقدسة عندهم ... وهي قواسم مشتركة عندهم من حيث الكيفية والنوعية ... إنما تختلف درجاتها من حيث الكمية [ قليلاً – أكثر من ذلك – أكثر – كثيراً جداً – كثيراً جداً بدرجة تفوق التصور..... ] من حيث عبادتهم وإخلاصهم لها... إذاً بنو مطيز السويداء عبيد لهذه الأرباب والآلهة ويقومون بطقوسهم ومناسكهم وصلواتهم وتعبداتهم .... لهذه الأرباب والآلهة لكي تعفو عنهم وتصفح وتغفر وترضى وتكافيء وتثيب ..............<br />ومن كانت هذه الأرباب والآلهة أربابه وآلهته ماحاجته لرب آخر يعبده ويقدسه ويخدم في بيت قرابينه وقدسه ويصلي ويتضرع له في محرابه .... ... فمن يعبد حافظ الأسد فإلهه حافظ الأسد .... ومن يعبد فروع الأمن فإلهه فروع الأمن ... ومن يعبد الكس فإلهه الكس ... ومن تعبد القحبنة والإير فإلهها القحبنة والإير ... وهكذا دواليك ... ودوا لكَ ... ودوا لكِ ......لكن عباداتهم في محافظة وبلاد بني مطيز عبادة جموعية [ من قبل كل فرد أو فردة منهم أو منهن ] لعشرات الأرباب والألهة مع بعضها البعض وبنفس الوقت.... على مر الأيام والليالي والسنين .... اذاً هذه هي أربابهم ... وآلهتهم ... وأئمتهم .... ودينهم ... ورسلهم ... ومعبدهم ... ومعتقداتهم .... فأهلاً وسهلاً والله ببني مطيز .<br />نقول لجميع هؤلاء وهم معروفون لدينا [ بجميع أمورهم صغيرها وكبيرها ... ما خفي منها وستر... وما بان منها وظهر ... ] .... نقول لهم إله دين التوحيد وإمام دين التوحيد هما اللذان يقبلان البشر ويتقبلان منهم..... وليس البشر من يقبل إله دين التوحيد وإمامه أو يتقبلوا منهم ...ويقولون لكم من كانت هذه الأرباب أربابه [ الألهة والأرباب التي تعبدونها ] فحتماً لاإله دين التوحيد يقبلكم ولا يتقبل منكم ولا إمام دين التوحيد أيضاً كذلك... ومكانكم حيث أنتم وما تعبدون .......<br />..... لوهبطت السبع سموات طباقاً على الأرض .... وتناثرت النجوم والكواكب والمجرات والأفلاك ... وتشظت وانمحقت.... وأصبحت جميعها هباءً منثوراً..... كل ذلك لو حدث .... أهون وأسهل على إله دين التوحيد وإمام دين التوحيد من أن يقبل أو يتقبل [ على دين التوحيد ] أحد من هؤلاء [ النعال والنعلات ] ذوي المجمعات المتنوعة من الأرباب والآلهة الخاصة بهم .<br />وحتماً من كانت هذه الأرباب والآلهة والأئمة والأسياد والمعلمين قواسمهم المشتركة .... حتماً لن يهديهم إله دين التوحيد الصراط المستقيم [ دين التوحيد ] ولن يتلقوا مناصرة ومؤانسة وتواصل وتعليم وإرشاد إمام دين التوحيد وملائكة دين التوحيد وأنبياء دين التوحيد ..... ويتوهون [ الغير مقبولين ]في الخيال والأوهام .... ويبنون الأوتوبيات والبروج العاجية الخاصة بهم .... وطبعاً كلها أوهام وتهيؤات وخيالات وتخريفات .... فمنهم ركض الى الهند .... ومنهم عاد لمجالس الصوفية .... ومنهم اتبع غرائب الحركات والوضعيات من اليوغا وغيرها .... وكلها جميعها وجميع ما يصب بمصافي هذه الأمور محض وهم وخيال وتخريف ..... اذاً جميع الأمور تعود الى رضى وقبول إله دين التوحيد وإمام دين التوحيد على الشخص .... ومن يقبلوه ويتقبلوه يتواصلون معه ويهدونه ويرشدونه ويعلمونه الحقائق الخافية عن جميع البشر ..... ولا حقائق إلاّ عندهم وحدهم .... فلا حقائق توحيدية وغيرها إلا من خلال هذا الباب .... ومفتاح هذا الباب القبول .... وإذا كان الشخص غير مقبول .... ليس الأمر لو سافر الى الهند أو غيرها .... بل لوخرمش السماء السابعة لن يأخذ الحقائق ولن يرشد ويعلم .... ولن يحدث تواصل معه ..... فالآخرين[ الغير مقبولين ] يتواصلون مع أوهامهم وشذرات نفوسهم ... وتصورات مخيلاتهم .... وجميع ذلك غير حقيقي وغير صحيح .... فإله دين التوحيد وإمام دين التوحيد صادقين مع العباد المقبولين .... وتوجيهاتهم تكون بصريح العبارة مما لايدعو الأمر للشك والتوهم والتخيل والتصور .... والحقيقة لا تأخذ إلا شكلاً واحداً أزلياً سرمدياً لايتغير .....<br />فجزيرة بلاد الشام وما حولها والجزائر والأقاليم الأخرى ... ومثال على ذلك بلاد الهند والسند .... وجميع باقي المناطق على سطح الكرة الأرضية ... [ وجميع حديثنا عن وقتنا وزمننا هذا منذ تجلي المقامات الفاطمية حتى قيام الساعة ] من لايعبدوا ولايقدسوا ولايؤلهوا مولاي الحاكم بأمر الله الفاطمي جل ذكره والمقامات الربانية الفاطمية الأخرى[ القائم والمعز والمنصور والعزيز ] ولايقرّوا بأن إمام دين التوحيد حمزة بن علي بن أحمد الزوزني الفاطمي ... أنه إمامهم ولا إمام أو معلم .... أو حكيم ....غيره فهم حتماً ليسوا على دين التوحيد .... ولا يوجد توحيد في الأديان والملل والنحل والمعتقدات والمذاهب الأخرى.... إلا من خلال هذا الباب الذي نتكلم عنه ........ فلا فلسفات ولاتفلسفات ولاداي ولا باي ولا حكيم ولا أرسين لوبين ولايوغا ولا كونغ فو ولا كراتيه ولا ساموراي... ولا قراع جحش ..... وللموحدين في الهند وغيرها لهم كتبهم الخاصة بهم وهي تمجد وتؤله مولاي الحاكم بأمر الله الفاطمي وتقدسه .... وتقر بإمامة إمام دين التوحيد حمزة بن علي بن أحمد وتقر أنه لامعلم ولا إمام... ولا حكيم غيره ... ولهم كتبهم الخاصة بلغاتهم حسب مقتضيات الزمان والمكان والإمكان والأشخاص ... فهذه خصوصيتهم وليست من خصوصيات الجزائر والأقاليم الأخرى ... ولكل جزيرة أو إقليم خصوصياته الخاصة به .... وهنا مربط الفرس .... ما بال أبناء جزيرة الشام وما يجاورها يهربون ويحجون الى جزائر الهند والسند وغيرها .... وهل باب ومفتاح إله دين التوحيد موجوداً هناك .... نقول لهؤلاء من هو غير مقبول هنا في هذه الجزيرة .... يكون غير مقبول حتى على الفلك الأطلس وفلك النجوم .... وكتب الجزائر والأقاليم الأخرى غير مخصصة لأهل جزيرة بلاد الشام وما يجاورها ..................<br />قد يقول قائل نحن على دين التوحيد الدرزي [ ومستلمين دينا ] ومشايخ وكل الناس بتسأل خاطرنا.... لماذا لا يتواصل معنا إمام دين التوحيد وملائكة دين التوحيد وأنبيائه ويرشدوننا ويعلموننا ويهذبوننا.... الجواب لا يحتاج لكثير من الذكاء ....أن كنت على دين التوحيد ومستلم وشيخ .... هذا لايعني أنك مقبول من إله دين التوحيد وإمام دين التوحيد ....ومن قلة الجواب جواب ... أي من عدم تواصلهم معكم وعدم تعليمهم إياكم وعدم إرشادكم وتهذيبكم وتوجيهكم من خلال المناهج التوحيدية الخاصة بهم .... معناه وبصريح العبارة وبصدقها أنكم غيـــــــــــــــــــــــــــــــــــــــــــــر مقبولين منهم لأسباب هم أدرى وأعلم بها .<br />.....ونقول لكم من خلال ما كتبناه في جميع ما كتبناه أنتم المعنيين بالأمر وكلامنا موجه لكم ونقصدكم به بشكل مباشر ..<br />وتكلمنا عن محافظة بنو مطيز [ السويدا ياغالي ] .... وهي مؤشر ومثال للأماكن والمناطق الأخرى[ في سوريا ... وخارج سوريا ] حسب خصوصياتها وعمومياتها من حيث هيكلية الزمان والمكان والإمكان والأشخاص ومن حيث قواسمها المشتركة من الأرباب والآلهة الخاصة بكل منها .............<br />صدر وأفهم علناً من إمام دين التوحيد حمزة بن علي بن أحمد [ جبريل الحق – سلمان الفارسي .... ]<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />&--1645;&--1645;&--1645;[ آخر ما وصلني من تعديلات وإضافات إملاءً من إمام دين التوحيد الفاطمي ]<br />فقط إحتفظ بأخر ما يصلك واقرأه ..وانسخه .....وإرساله للأخرين عبر الأنترنيت.. وغيرها... واتبع الأوامر ......<br />Sllman Allfarrsi............ فقط إحتفظ بأخر رسالة تصلك [ إعتماداً على تاريخها وتوقيتها ] لتفادي التكرار لنفس المواضيع [ وانشرها .... وإحفظها وإنسخها على الكمبيوتر... و الى أقراص خاصة .... وارسلها للآخرين على الأنترنيت ... وغيرها ].....[...وتخلص من جميع ما وصلك منا قبل زمن هذه الرسالة وأهمله ]... وفيها تكون أحدث الإضافات الجديدة [ إضافة للمواضيع القديمة المعدلة ] التي نريدك أن تعرفها وتطلع عليها ... ويطلع عليها الآخرين .......ومن أخر رسالة تصلك إعتماداً على تاريخها وتوقيتها.... تكون قد استغنيت عن جميع الرسائل التي وصلتك قبل هذا التاريخ وفيها جميع الإضافات والتعديلات. ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />....هل أتاك حديث الفاطميين... وما توعدون.... هيك بتنحسب....... ومش بس هيك أيضاً غير هيك..... ومش بس هيك أيضاً غير هيك وهيك .....و كذلك.... وأيضاً....... وأيضاً حتى ذلك ... وأيضاً كذلك ... وأيضاً غير ذلك ...... وأيضاً أمورمن غير ذلك وكذالك وأيضاً غير ذلك .. وكذلك ... حتى غير ذلك... وحتى ذلك.... وحتى كذلك.. وحتى أيضاً......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />&--1645;&--1645;&--1645;&--1645;&--1645; بلاغ أمر صادر من إمام دين التوحيد الفاطمي [ إمام دين الدروز ] حمزة بن علي بن أحمد الفاطمي الزوزني [ سلمان الفارسي ... جبريل .... ] :وأمر صادر للذي تصله هذه الرسالة أن يبلغها ويوصلها لأصحابها وللآخرين دون تمهل أو تأخير :-----------------------------------------------------<br />أما أمور مشخخة اللاعقل[ من يدعون أنفسهم شيوخ العقل الدين الدرزي... وعلى رأسهم سكين جربوع ..... ] في محافظة السويداء السورية ومن يحذو حذوهم في سوريا وغيرها....... فنحن نعرف جميع أمورهم [ صغيرها وكبيرها ... ما خفي منها وما ظهر ] ....<br />ياأبناء القحب حافظ أسد وسلالته وهيكليته .... ياأبناء فروع الأمن والمخابرات .... ياأبناء الزعامات والوجاهات والعائليات والمحسوبيات........<br />ما شأنكم بمشيخة الدين الدرزي التوحيدي غير الأسم ... وماذا يريد النظام السوري العميل والعدو لدين التوحيد ورموزه غير ذلك.....وهل يجد النظام السوري من علويين وسنة وغيرهم مركوباً أرخص وأبخس منكم.... ولو كان الأمر يتعلق بكم فقط لألقينا حبلكم على غاربكم حتى حين المآب .... لكنكم يا أذناب ... ويا أزلام ... ويا أقحاب ... ويا كلاب .... تتكلمون بأسم دين التوحيد الدرزي بأكمله والأنكى من ذلك تحللون وتحرمون وترسمون وترسملون وتخرجون بمراسيم ..... وتخططون [ من بعد إلهكم العلوي وإمامكم السني.... ]... وتقبلون وتبعدون .... والأنكى من ذلك كله أنكم تتكلمون نيابة عن إمام دين التوحيد الفاطمي وإخوته .... وأنتم منكرين لهم من خلال أقوالكم وأفعالكم وأعمالكم .... ومتنكرين لإله دين التوحيد الفاطمي مولانا الحاكم بأمر الله جل ذكره .......<br />وتقولون إنا نساتر ونتقي ..... ما معنى هذا؟؟؟؟ .... وهل إله دين التوحيد وإمام دين التوحيد لايعلمون ما تسرون وما تخفون وما تظهرون أوتتظاهرون به في كل زمان ومكان وإمكان .... ومن أمركم أن تساتروا بعد أن إطلع الداني والقاصي على كتب الحكمة وشروحاتها .... وكان زمن المساترة عندما كان الآخرين لايعلمون شيئاً عن الحكمة والكتب التوحيدية .... ومن زمن إبراهيم باشا ... زمن العثمانيين .... انتهى أمر وزمن التقية والمساترة .... رغم أن إمام دين التوحيد يعلم أن ذلك لاتقية ولامساترة ... وإنما هو أمر أخر .... وإن وراء الأكمة ما ورائها .<br />وبناءً عليه ومن جميع الأمور الأخرى ..... أمر صادر من إمام دين التوحيد حمزة بن علي بن أحمد الفاطمي : يطرد شيوخ العقل الثلاثة [ سكين جربوع ولاحق الهجري وإبن محلا الحناوي ]ومن يعاضدهم ويساندهم الخاسئين الخاسرين الناكصين .... يطردوا من دين التوحيد الدرزي الفاطمي ويصبحوا على دين العلويين والسنة .... ونقول لجميع الموحدين الدروز بعدم التقيد بهم ولا بقراراتهم ولا بمراسيمهم [ وأمثالهم مثلهم .... ]. وقد نحاهم إمام دين التوحيد عن مناصبهم ومهامهم ووضعهم جانباً حيث أشار[ وأمثالهم مثلهم .... ] .... ومن يتبعهم من الموحدين الدروز أو يأخذ برأيهم أو يسأل خواطرهم ... أو يستمر بإطلاق لقب شيوخ العقل عليهم ... فله منا أشد وأعظم القصاص والعقاب ويحمل أعظم الذنوب ... بل يطلق عليهم من الآن فصاعداً لقب المشخخة السكينية العلوية والإسلامية ... ومن يصله خبر منا[ من خلال ما أمرنا به ] فليُعلم الآخرين من أبناء دين التوحيد الدرزي في أي مكان من أماكن تواجدهم والمرجعيات الدينية التوحيدية الدرزية أيضاً .... وهذا أمر.<br />صدر وأفهم[ جميعه ] علناً من إمام دين التوحيد الفاطمي حمزة بن علي بن أحمد .<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />©©©©© تنبيه وإبلاغ : مشيخة العقل في دين التوحيد الدرزي<br />... بأمر صادر من إمام التوحيد حمزة بن علي بن أحمد [ جبريل – سلمان الفارسي ]<br />.... شيخ العقل عند إمام دين التوحيد هو الشيخ الموحد الدرزي السيد الثقة الخاتم للحكمة مع شروحاتها[ وأتقى الأسياد وأطهرهم وأقدسهم ....] ... العامل بمقتضاها في شئون الحياة الدنيا والأخرة المتوكل على إمامه في جميع أموره في السراء والضراء .....<br />نقول لشيوخ العقل في دين التوحيد الدرزي مشيخة العقل ليست سلعة لكي تتوارث أباً عن جد... أو عباءة يلبسها خنزير من الخنازير أو يلبسه إياها مسخ من المسوخ ...ولا هي مكرمة من عائلة متنفذة أو من حكومة أو من سلطة أو سلطان ... ولا هي مكرمة من زعامة أو حزب ما ...... إنما هي بالمواصفات التي تحدثنا عنها ... ومن توفرت فيه المواصفات من أسياد دين التوحيد الدرزي .... مع مؤشرات من إمام دين التوحيد لجميع الموحدين الدروز بأن الشيخ السيد [فلان] لايوجد بينهم مثيل له من حيث المواصفات وأمور الدين .... والجميع يقر له عفوياً بالمنزلة والمكانة .. لمجلس مشيخة العقل ......<br />أما المتسلقين السلقلوقيين , المنتفعين , الإنتهازيين , الأزلام , أولاد الحرام , أدوات الحكومات والسلطة والسلطان ,والزعماء ... والوجاهات .. والعائليات .. والبطون والأفخاذ ... , البايعين الدين بسلة تين ,.... وجميع من يصب بمصافيهم ممن هم بمصافي أمور الحياة الدنيا بمختلف مجالاتها وتوجهاتها وعلائقها .... نقول لهؤلاء الذين يجلسون للناس مجلس مشيخة العقل .... إنهم يتطاولون بكل وقاحة وصلف وقلة دين على ظل مجلس إمام دين التوحيد وأخوته على الأرض ....<br />لهؤلاء لنا معهم شأن أخر مختلف عن جميع شئون البشر قاطبة ... إنه إبلاغ ... وإن الغد لمنتظره قريب . أقول لهؤلاء.... وللهيكليات التي تقف خلفهم ..... لأجعلنكم عجائب وعبر وآيات وغرائب يرتعب ويرتعد عند ذكرها عتاة وجبابرة الأنس والجن .... وحتماً سوف تعلمون .... وحقاً لسوف تعلمون علم اليقين ماذا سيحل بكم .... ومما لايخطر على قلب بشر ..... إنتظروني .<br />صدر وأفهم علناً من إمام دين التوحيد الفاطمي حمزة بن علي بن أحمد [ جبريل – سلمان الفارسي ..... ]<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />&--1645;&--1645;&--1645;&--1645;&--1645;ملاحظة وتنبيه وإبلاغ : إلى الذين هم على دين التوحيد الدرزي ... نسخ هذه الرسالة[ على الكمبيوتر على أقراص.... وإرسالها على الأنترنيت .... ] وتوزيعها أمر صادر من إمام دين التوحيد.... وإشهارها ونشرها واجب فيما بينهم وإيصالها لأصحاب الرأي والمشورة منهم.... ولشيوخ العقل والأسياد والمشايخ والأجاويد ... وغيرهم ممن هم على دين التوحيد الدرزي .... وسخط إمام دين التوحيد حمزة بن علي بن أحمد على الذي لا يقوم بما أمرناه به ..... صدر وأفهم علناً من إمام دين التوحيد حمزة بن علي بن أحمد [ جبريل الحق – سلمان الفارسي – سليمان بن داوود – شعيب ....مسيح الحق والأمم ] ... أعذر من أنذر ... والويل ثم الويل للمتهاون والمتقاعس عن ذلك أو الرافض لتنفيذ أمر إمام دين التوحيد .<br />نقاش:موحدون دروز :<br />تعرف على الفاطميين الموحدين الدروز –<br />من هو الحاكم بأمر الله الفاطمي ؟؟؟؟؟<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />ـــــــــــــــــــــــــــــــــ<br />قد يستغرب البعض ويقول لماذا الفلسطينيين .... ولماذا هذا الغضب والسخط العارم عليهم من إله دين التوحيد وإمام دين التوحيد .... ولأنكم لاتعلمون الغيب ... ولأنكم تفسرون الأمور حسب أهوائكم ورؤيتكم المحدودة ..... نقول .... إن الفلسطينيين الحاليين [ في جيلهم السابق ... وأسلافهم مثلهم ] كانوا موجودين في البلدان الأخرى من أمة الأعراب والبداوى[ الأمة العربية ] ... وغيرها .... وكانوا مواطنين في بلدانهم .... لكنهم تجاوزوا جميع الحدود .... وضربوا عرض الحائط جميع التوعدات والوعيد والتحذيرات والإنذارات .... كانوا في بلدانهم أردأ أوباش القوم وأكثرهم فجوراً ودنساً ورجساً .... وكانوا في بلدانهم وعلى مدار الساعة يشتمون ويسبون إله دين التوحيد الفاطمي ويوصموه بأبشع وأقذع الصفات والنعوت .... ويتحدثون إفكاً وزوراً وبهتاناً وأقوال وأفعال هي من عظائم الأمور وكبائرها فيما يخص دين التوحيد ورموزه الفاطمية ...و يقصدون فيها إله دين التوحيد الفاطمي وإمام دين التوحيد الفاطمي ودين التوحيد [ الدروز ] ....فأوجب إله دين التوحيد الفاطمي من عظيم حكمته أن يعذب هؤلاء في الحياة الدنيا ريثما يستكملوا أعمالهم ... ومن ثم في الأخرة جميع ما وعدناهم به هم وأمثالهم .... لذلك كل من تجاوز جميع الحدود بتطاول ما بعده تطاول في جميع الأمور التي تكلمنا عنها .... كلهم خلقهم إله دين التوحيد عند أسر فلسطينية وغيرها.... وأصبحوا أبناء لهذه الأسر الفلسطينية .... وسلط عليهم حكومات بلدان الأعراب والبداوى ... وغيرهم ... قبل أن يسلط عليهم إسرائيل خاصة ويهود العالم عامة والولايات المتحدة ومن بعدهم جميع الدول الأوروبية والأمريكية وغيرها .......اذاً هو سخط وغضب من إله دين التوحيد وإمام دين التوحيد عليهم .... هذه فقط إشارة .... وما يحدث للسنة والشيعة ومسيحيي الأعراب ... ولأمة الأعراب والبداوى[ الأمة العربية ] ... وغيرهم .........هي مؤشرات لغضب وسخط إله دين التوحيد وإمام دين التوحيد عليهم بسبب عدائهم لدين التوحيد [ الدروز ] ... وإله دين التوحيد الفاطمي وإمام دين التوحيد الفاطمي بالدرجة الأولى .... وميزان أعمالهم الرجسة النجسة بالدرجة الثانية ..... وهي مقدمات أعمال وعقاب وقصاص في الحياة الدنيا .... ونعاملهم معاملة الأعداء ... ريثما يوضع الميزان .... ولهم منا ما وعدناهم به .....من معالجات وعذاب وعقاب وقصاص .... وغير ذلك .<br />[[[ والفلسطينيون مثال على ماحدث وما يحدث للسنة والشيعة وغيرهم ... في لبنان والعراق .... وباقي دول الأعراب والبداوى [ الأمة العربية ] ... وغيرها ...ممن هم أعداء دين التوحيد الدرزي الفاطمي ورموزه ]]].<br />من إمام دين التوحيد الفاطمي حمزة بن علي بن أحمد [ جبريل – سلمان الفارسي ...... ] ..... صدر وأفهم علناً .<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />......سأريكم العجب العجاب ... والصيام في الأرجاب وفي كل أيام السنة ... ولا رحمةً ولا شفقة ولا معذرة ولا مغفرة ولا هوادة حتى على الذي تنسك ........وتاب ......<br />SllmanAllfarrsi***Monotheism*Imam<br />........[ جميع ما قلناه فيما كتبناه وما نكتبه .... خاص في المعنيين بالأمر فقط ..... ولكل مقام مقال.... صدر وأُفهم علناً .... ]<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />Sllman@Alffarrisi.com [ هذا البريد غير مخصص أومعتمد للمراسلة]<br />mdfi-ahba1@maktoob.com [ معتمد ]<br />ddrpxyt33005@maktoob.com[ معتمد ]<br />[ هذا البريد خاص و معتمد <<< >;>;>; ... بإمكانك أن تستخدمه \" للاستفسار والمراسلة \" ......]<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />......... هيك بتنحسب .......... ومش بس هيك ...أيضاً......<br />هذه الرسالة.... رسالة إبلاغ وتنبيه وإنذار وتحذير .... ولنا لقاء.... صدر وأفهم علناً .<br />الوطن عند الموحدين الدروز هو إله دين التوحيد والإنتماء للوطن هو الإنتماء والإخلاص لإله دين التوحيد.... ولا قيمة للتراب إذا لم يتقدس ويتطهر من آثار دوس نعال إله دين التوحيد وإمام دين التوحيد وملائكة وأنبياء دين التوحيد .... ومن آثار نعالهم يتقدس أي موضع أو مكان في الكون [ أرضاً أوسماءً] . ومن ذلك يحمل[ الموضع أو المكان ] كل المعاني القدسية الجليلة الطاهرة الخالدة الجميلة.......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />كيف بتنحسب الأمور؟؟؟؟ مش بس هيك بتنحسب الأمور .... ولا هيك ... ولا هيك ..... ولا هيك ...... بتنحسب هيك لأجعل ألله ما خلقك ....و بتنحسب غير هيك أيضاً... وغير هيك ... وأيضاً غير هيك .... حتى كذلك ... وحتى غير ذلك ....<<< للمعنيين بالأمر >;>;>; صدر وأفهم علناً ....<br />أتعتقدون أننا كتبنا كل هذا لنحاوركم ونتناقش معكم .... إن ذلك فقط للتذكير والإيضاح ... فقط ماذا ... فقط مؤشرات للتوضيح والتفسير والتذكير .... لعلها تنفع الذكرى .... ولكم جميع ما وعدناكم به .... صدر وأفهم علناً من إمام دين التوحيد الفاطمي .<br />ملاحظة : نحن الموحدون لا علاقة لنا لا من قريب ولا من بعيد لا بالإسلام ولا بالمسلمين [[[ أن كانوا شيعة وتفرعاتها أو كانوا سنة وتفرعاتها .... فالعلوية والإسماعيلية والرافضة والنصيرية والفرس وباقي ملل وطوائف ومذاهب الشيعة جميعها لا تعتقد[ بما نعتقد نحن به ] بألوهية الحاكم بأمر الله الفاطمي<<< إله دين التوحيد >;>;>; فهم جميعهم[مثلكم تماماً] , ولهم رموزهم الخاصة بهم والتي نحن لا نعتقد بها حتماً وقطعاً وجزماً ]]] . ولاعلاقة لنا بغيرهم من الأديان الأخرى أيضاً ..... فنحن دين مستقل منذ بدء الخليقة .... مستقل عن جميع الأديان في الأرض قاطبة في جميع الأدوار والأزمان . .... إقرأ ما كتبناه تعرف أن ديننا مختلف ومنفرد بذاته عن جميع أديان الأرض قاطبة عبر جميع العصوروالسنين .... والموحدين الفاطميين الدروز هم عرب ومن أعرق القبائل العربية وأيضاً منهم غير عرب ... أما باقي الموحدين فهم من أجناس وملل وأعراق عديدة وأديان ومذاهب وطوائف مختلفة ومتباينة ومتنوعة .... كل ذلك قبل أن يصبحوا موحدين .... ونقول في منهج دين التوحيد ....... لايهم إن كان الموحد[ عربي ... أو غير عربي ]... المهم أنه أصبح على دين التوحيد [ بترشيح من إله دين التوحيد والوثائق والسجل والميثاق بأنه موحد ]وهذه هي الغاية والنهاية والهدف .... وبمجرد أن يصبح الشخص على دين التوحيد فتصبح قبيلته وعشيرته وأهله وأقاربه وعائلته وبلاده أهل دين التوحيد ووطنه إله دين التوحيد ... ويعادي ويقاطع جميع الآخرين الغيرمنتميين ومنتسبين لدين التوحيد ولوكانوا أقرباءه في النسب وحتى لو كانوا من أفراد إسرته[ هذا عند كتابة المواثيق ].. ويتبرأ منهم... أما بعد كتابة المواثيق [ أي من زمن الحاكم بأمر الله الفاطمي ... بالنسبة للدروز ] فالموحدين الدروز يولدون ويخلقون عند بعضهم وهذا شأن جميع الموحدين أيضاً [ منذ أقدم العصور ... حتى الآن ... ]..... ولا يحق للأخرين الدخول والإنتساب لدين التوحيد لأن ذلك غير مسموح به حسب شروطه ومواثيقه [ أي شروط ومواثيق دين التوحيد ]......... صدر وأفهم علناً من إمام دين التوحيد .<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />من إمام دين التوحيد سلمان الفارسي [ جبريل – حمزة بن علي بن أحمد الزوزني الفاطمي ...... ]<br />لنتحدث إشارة فقط عن الجنة [ كوكب سانتا ماريتا ] :<br />قد يقول قائل نحن خلقنا منذ أكثر من 343 مليون سنة وتتبدل أنفسنا وأرواحنا الخالدة في الأقمصة[ أي الأبدان ] البالية عبر العصور والسنين...... فما معنى الحكمة والعدل عند إله دين التوحيد أن يبقي الذين استكملوا أعمالهم ورضي عنهم ... أن يبقيهم بين أوباش"
