text = "السلام عليكم<br />هدا الموضوع مثير للجدل نوعا ما عندما تاتي البنت المغربيةا لى الاردن للعمل تدعي انها لم تكن تعلم ما طبيعة عملها ولا تعلم ما هو الطريق الذي سوف تسلكة هذة رواية جميع البنات الاتي يعملن باليل دون تحديد الجنسيات ولكن عندما تتعامل مع هؤلاء الفتيات تعلم كل العلم بان الفتاة راغبة وموافقة وتعلم كل العلم ماذا تفعل وانها لم تلتي الى العمل الا وهية عالمة كل العلم من صديقة سابقة او اخت او قريبة او معرفة ما هو نوع العمل اما ما تقوم بة من عمل فهو خراب للاسر ودمار البيوت ونشر الدعارة والامراض المعدية وللاسف انهن خبيرات بارعات في تسويق انفسهن بانهن ضحايا وليس جانيات هل يعيش الانسان سعيد على لقمة خبز من يد طفل او طلاق زوجة او او او او من ما شابه بنات اليل كلهن ينقضن على الفريسة دون اي مشاعر حتى يلتهمن رزق اطفالة وخراب بيتة مين البنت التى تقول انها عاشت بالاردن او اي بلد عربي اخر لا تريد ان تجمع المال من دون النضر الى حالة الضحية اما بالاردن تحديدا فتشكل الجنسية المغربية تحديدا اكبر خطر على المجتمع<br />حسبنا الله ونعم الوكيل فيهن"
