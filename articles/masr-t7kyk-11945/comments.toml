author = "عادل منصور الجرجاوى"
posted = "2009-05-03"
text = "ربما كان العميد على حق<br />اذكر انة فى احدى السنوات ايام الستينات فى كلية الهندسة جامعة اسيوط وفى كلية الهندسة واحد الاقسام كتب استاذ المادة فى لوحة اعلانات النتائج - مادة كذا لم ينجح فيها احد هذا العام - نعم كتب هذة الجملة - لم ينجح احد هذا العام فى مادة كذا<br />المشكلة هى مستوى الطلاب ومن هذا نلاحظ مدى تدهور الخريجين وعدم قدرتهم على كتابة جملة مفيدة - العملية مش مجاملة ولا نجاح الطلاب بالكوم والزوفة لافساح مكان لغيرهم قادمون - كلا يا سادة المفروض هناك وقفة - من يستحق النجاح ينجح ومن يستحق الرسوب يرسب وحتى لو كانت النتيجة الاجمالية صفر فى المية<br />انما التساهل فى التعليم والتساهل فى النجاح اوجدنا نفسنا امام خريجين ضعاف جدا<br />نعم ربما كان العميد على حق ويراعى مصالح التعليم ومصالح الطلبة"
