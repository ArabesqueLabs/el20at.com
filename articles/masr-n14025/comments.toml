subject = "رجل و الرجال قليل"
author = "نيفين نيفى نوفا"
posted = "2008-02-04"
text = "على راى مدحت شلبى ابو تريكه تريكه ابو<br />هو مع ان الاتحاد الدولى ده مش الاتحاد الدولى و لا حاجه و لكن يقال انه موقع شبابى مسميين نفسهم كدا<br />مين اللى ميحبش ابو تريكه<br />شوف انت لو قدرت تضحك واحد صاحبك او تخليه يبتسم و تطلعه من مود وحش هو فيه بيبقى شعورك ايه<br />امال ابو تريكه بقى اللى بيفرح ملايين و ينسيهم و لو لثوانى الايام الهباب اللى البلد فيها<br />ربنا يخليه للاهلى و المنتخبب"
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401115245/http://masr.20at.com:80/newArticle.php?sid=14025"

