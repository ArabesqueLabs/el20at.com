text = "اخبار بتتكرر كل اسبوع من 30 سنة فاتت<br />هيتعقلوهم واية يعنى - ما بيخافوش<br />بكرة والا بعدة هيسيبوهم تانى<br />هما اللى خسرانين هيأكلوهم ويشربوهم ويحرسوهم ويصدعوا دماغهم<br />ظز فش حرنكش وفتح عينك تاكل ملبن"
