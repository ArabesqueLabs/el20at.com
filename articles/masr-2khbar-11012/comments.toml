[[comments]]
order = 2
subject = "خلافات نصر وشيرين انتهت بـ2.5 مليون جنيه"
author = "وعدي يا وعدي على ا لخلافات"
posted = "2009-01-25"
text = "خلافات نصر وشيرين انتهت بـ2.5 مليون جنيه<br />انتهت الخلافات العنيفة التي نشبت بين المنتج المعروف نصر محروس والمطربة الشابة شيرين عبد الوهاب على أن يتم فسخ التعاقد بينهما ودفعها للشرط الجزائي كاملاً.<br />وقال مصدر مقرب من محروس وشيرين : \"انتهت الخلافات بين نصر وشيرين مساء يوم الأحد الرابع من فبراير، حيث اجتمع الإثنان في نقابة الموسيقيين بحضور رئيسها حسن أبو السعود لكي يتم إبرام عقد صلح بين شيرين ونصر والنقابة نفسها\".<br />وتابع المصدر : \"انتهى الاجتماع على أن تم فسخ التعاقد بين نصر بشركته \"فري ميوزيك\" وشيرين بشكل نهائي، وبدفع المطربة الشابة له الشرط الجزائي الذي يبلغ حوالي 2.5 مليون جنيه مصري، كما تصالحت شيرين مع النقابة بدفع مبلغ قدره 300 ألف جنيه\". كما أضاف أن شيرين تفاضل حالياً بين عرضين للشركتين \"روتانا\" و\"ميلودي\"، وستقرر أيهما ستوقع معه لانتاج ألبوماتها القادمة خلال أيام. جدير بالذكر أن محروس كان تقدم منذ فترة بطلب إلى نقابة المهن الموسيقية بمنع المطربة شيرين عبد الوهاب من الغناء نهائياً لخروجها عن الشروط المنصوص عليها بين شركته \"فري ميوزك\" للانتاج الفني وبينها كمطربة، مما أتاح له أحقية طلب منعها من الغناء، الأمر الذي تم بالفعل لحين إنهاء الخلافات بينهما"
archived = "2010-03-14"
capture_url = ""
