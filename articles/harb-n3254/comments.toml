text = "السلام عليكم ورحمه الله وبركاته ، ارجو من يعرف عن جامعة أو كلية في السعودية يدرس بها طالب توحدى علماً بان لدى ولد توحدي خريج ثانوية عامة هذا العام 1428/1429هـ الحمد الله ."
archived = "2010-05-31"
