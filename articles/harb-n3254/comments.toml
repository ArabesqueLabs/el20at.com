text = "ابني يبلغ من العمر 3لاث سنوات ونصف اكتشفت جديدا انه مصاب بهذا المرض …بالله عليكم ساعدوني ماذا افعل .ارجوكم ابلغوني هل ان ولذي سيكون معاق طول العمر …والله اتمنى الموت ولا يكون ولدي معاق طول العمر<br />في السابق كنت اتوقع هذا شيئ اعتيادي لكن اليوم انا امام الواقع<br />انصحوني ما علي فعله لانقاذ ولدي فلذة كبدي …ارجوكم"
