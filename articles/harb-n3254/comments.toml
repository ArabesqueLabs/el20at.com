subject = ""
author = "عصام المكينزي"
posted = "2008-06-10"
text = "جزأك الله خير على هذه المعلومات ، بلا شك الوالدين ينظرون إلى الرقي في أمور أبنائهم الذين يعانون من التوحد إلى التطورات الايجابية الاجتماعية والدينية وكفرد له حق في الاندماج مع المجتمع ونظراً إلى غلاء دفع الرسوم المراكز التوحد من الصعوبات التي تعوق إلى معالجة الذين يعانون من التوحد بسبب العجز المادي الذي يعاني منه البعض . وللاعلام دور مؤثر في معرفة دور المركز التوحد في معالجة الوضع الاجتماعي للتوحدى عن طريق المجلات والتلفزيون والجرائد والانترانت . كوني كأب يهمني شأن ولدى وأسعى جاهداً بفضل الله تعالى إي الوصول إلى الطرق الايجابية التي توافق رغبات ولدى بما يوافق دينه ووطنه"
archived = "2010-05-31"
capture_url = "https://web.archive.org/web/20100531153537/http://www.20at.com:80/20at/health/2894.html"

