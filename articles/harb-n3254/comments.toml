text = "اشكرك جدا على هذا المقال الرائع وان تابعنا لكنك لم تذكري شئ غامض كما يوضح عنوانك مع العلم ان هذه الحالات تقع تحت عنوان الحالة الغامضة فعلا لكن المقال مختصر جداا ويحتاج الي بحث اكثر … شكرا لك"
archived = "2010-05-31"
capture_url = "https://web.archive.org/web/20100531153537/http://www.20at.com:80/20at/health/2894.html"

[[comments]]
order = 1
subject = ""
author = "nour"
posted = "1970-01-01"
text = "الف شكر اولا على الموضوع ولكن لي راي اخر بالنسبة للتاخير بالنطق اللغوي هذا لا يعني انه مرض اكثر الاطفال لا ينطقون مبكرا واعتقد هذه وراثة .. وليش مرض .. لدينا بالعائلة الولد لا ينطق جيدا قبل الخمس ستوات وبعدها يتكلم بطلاقة قوية<br />ولو اعتقدنا اي حركة من هذه الحركات هي مرض توحد فلنقل كل الاطفال مرضى بها المرض لان الطفل من الصعب تحديد هويته لانه بطبعه متقلب وفضولي وكل يوم يتغير سلوكه هذا راي عن تجارب بتربية 8 اطفال<br />وشكرا"
archived = "2010-05-31"
capture_url = "https://web.archive.org/web/20100531153537/http://www.20at.com:80/20at/health/2894.html"

