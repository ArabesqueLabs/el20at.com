archived = "2010-05-31"
capture_url = "https://web.archive.org/web/20100531153537/http://www.20at.com:80/20at/health/2894.html"

[[comments]]
order = 4
subject = ""
author = "رشا لطفي"
posted = "2007-04-06"
text = "شكرا جزيلا على هذا المقال المفيد والمبسط ولكني سمعت كثيرا انه يجب على الاهل أن يحالون منع الطفل عن كل الاشياء التي تبعده وتعزله عن البيئة المحيطة مثل مشاهدة الاغاني لفترة كبيرة حتى ولو كان يحبها ويفضلها وهذا يتعارض مع كلام حضرتك فما صحة هذا الكلام أرجو افادتي وشكرا"
archived = "2010-05-31"
capture_url = "https://web.archive.org/web/20100531153537/http://www.20at.com:80/20at/health/2894.html"

[[comments]]
order = 5
subject = ""
author = "سماح يازجي"
posted = "2007-10-17"
text = "انا اخي لديه التوحد؛عمره 17 سنة انا اكبر منه بثلاث سنوات<br />اذكر تماما كل طفولته وكل هذه التصرفات كانت تبدو عليه تماما الان اخي تخلص من الكثير من هذه التصرفات<br />واستطيع القول انه اصبح بعكس ما كان؛فهو الذي كان يخلع كل ثيابه عندما يريد الدخول الى الحمام الان يصرخ بشدة اذا شاهده احدهم نصف عاري اي بثيابه الداخلية وبدلا من انعزاله الشديد عندما كان طفلا حتى انه كان يبعدني عنه بشدة الان لا استطيع ان اتخلص من معانقته وتحرشه بي (عالطالعة والنازلة)لكن مازالت تصرفاته اصغر من عمره بالاضافة الى عصبيته الشديدة<br />اتمنى حقا ان اتواصل مع اي مركز او اي احد لديه حالات مشابهة علنا نستطيع ان نساعد قليلا<br />هؤلاء الذين هم حقا بحاجة لنا بعيدا عن سخافات المجتمع الذي يعتبرهم مختين عقليا<br />اذا لم نقل (مجانين)"
archived = "2010-05-31"
capture_url = "https://web.archive.org/web/20100531153537/http://www.20at.com:80/20at/health/2894.html"

