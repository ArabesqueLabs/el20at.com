text = "أشكر جميع المشاركين في برنامج اليوم العالمي التوحد على جهودهم في رفع قدرات مرضي التوحد ، وأنا عندي أحد مرضي التوحد وهو أبني ، والأن يدرس هذا العامه والحمد لله ، وقد تعلمت من أبني مع استمرار المتابعة ، وشكر"
archived = "2010-05-31"
capture_url = "https://web.archive.org/web/20100531153537/http://www.20at.com:80/20at/health/2894.html"

[[comments]]
order = 32
subject = ""
author = "عصام المكينزي"
posted = "2008-06-04"
text = "أنا لدى خبره عن التوحد خاصة بولدي وذلك لأنني تابعت معه منذ مرحلة الطفولة ، وأما إذا أتاني طفل غريب لا استطيع علاجه إلا بفترة طويلة وذلك لأنني لم أتابع معه منذ الطفولة وأن درجات التوحد مختلفة من شخص إلى أخر فإن ابني حالته من حالات التوحد المتوسط ومع المتابعة والتدريب تحسنت حالته بفضل الله . وأن التوحد بجميع أنواعه الشديد والمتوسط والخفيف جميعهم نفس الشيء ولكن طرق تدريبهم ومتابعتهم تختلف وبالنسبة إلى تناول المهدئات لأبناء التوحد لا أعرف هل هو ضرر نعم أو لا ؟<br />وهذا والله اعلم …"
archived = "2010-05-31"
capture_url = "https://web.archive.org/web/20100531153537/http://www.20at.com:80/20at/health/2894.html"

