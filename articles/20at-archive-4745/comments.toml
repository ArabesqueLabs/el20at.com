subject = "إنهم يتاجرون في لحم المصريين الفقراء ومستقبل مصرأي"
author = "د /محمد حامد محمد حجازي"
posted = "2008-04-23"
text = "إنهم يتاجرون في لحم المصريين الفقراء ومستقبل مصرأيضا<br />كتبه :د /محمد حامد محمد حجازي<br />طبيب مقيم أمراض الباطنة والكلي<br />مستشفي قصر العيني التعليمي الجديد<br />محمول: 0121706170<br />بريد اليكتروني:HEGAZY.MOHAMMAD@GMAIL.COM<br />القاهرة تحريرا في 20 ابريل 2008<br />الأمر أخطر من الجزار المعدوم الضمير الذي أطعم المصريين لحوم الحمير والكلاب إنها جزارة أخري علي أوسع ولكن لإطعام المصريين لحوم إخوانهم المصريين لكن وهم أحياء<br />استغلال حاجة الفقراء لإغرائهم ببيع الكلي بدلا من مساعداتهم بالمال وذلك لحساب زيادة ثروات شرذمة من الأساتذة الدكاترة العاملين بزراعة الكلي صحيح أنهم قلة وأنهم ليسوا القاعدة العريضة بل هناك نماذج مشرفة من الأساتذة الذين يراعون ضمائرهم ولكن هذه الشرذمة لو تركت بدون ردع فقد تؤدي بمصر إلي كارثة محققة ذلك أنهم يقومون برسم صورة وردية لزارع الكلي ولا يتم إخباره مثلا بأن متوسط عمر الكلية المنقولة من خمس إلي عشر سنوات وأن علاجات الزرع سوف تكلفه شهريا حوالي ألف وخمسمائة جنية بصفة مستمرة وأن الدولة ستتحمل حوالي ألف وسبعمائة جنيه إضافية ولا يتم أخباره أيضا بأن مناعته ستكون ضعيفة للغاية تقريبا مثل مرضي الإيدز وأن نسبة تعرضه للأورام السرطانية وغير السرطانية ستزيد بنسبة أكثر من الضعف وأن هناك نسبة فشل للعملية ومعدلات رفض للكلي المزروعة قد تؤدي إلي مضاعفات خطيرة أوالي الوفاة ولا يتم إخبار المتبرع بأن نسبة احتمال إصابته بالفشل الكلوي في خلال عشرين سنة تزيد عن الضعف رغم أن أكثر المتبرعين يكونون من الشباب في العشرينات فمن الذي سيعول أسرهم إذا تعرضوا للفشل الكلوي في الأربعينات ومن المسئول ساعتها عن تحميل الدولة وإرهاق ميزانيتها بمصاريف ونفقات علاجهم إنهم يقومون بزراعة الكلي في أماكن غير مرخصة وغير مجهزة لذلك مما يترتب عليه مضاعفات ووفيات كثيرة أو في أماكن رسمية ومرخصة ولكن بطرق ملتوية وتجاوز للقنوات الشرعية للموافقة بطرق مشبوهة هناك أمثلة كثيرة لمرضي كلي مزمنين كانوا يسيرون بشكل معقول جدا علي العلاج التحفظي بدون غسيل ولما تم زراعة كلي لهم وفشلت العملية أصبحوا معتمدين كليا علي الغسيل الكلوي بانتظام \"يعني مغسلوش إلا بعد ما زرعوا\"<br />والمخالفات تبدأ من أول انتقاء مريض الكلي المزمن للزرع فالمريض يكون أمامه طريق من أثنين إما الزرع وإما الغسيل ولكل منهما دواع مخصوصة علميا ومزايا وعيوب علمية معروفة ولكن الحاصل في مصر هو انه لا يتم تطبيق المعايير العلمية بل كثيرا ما يكون الداعي لأن يتم زراعة كلي للمريض هو فقط كونه غني أو أنه أجنبي أو يمني أو ليبي أو سعودي ورغم أن هذا المتلقي قد لا يكون صالحا للزرع أو بدون أن يتم اختبار آثار أدوية ما بعد الزرع عليه مما قد يؤدي إلي وفاته بعد الزرع بمدة قصيرة بسبب فشل في نخاع العظم أو فشل بالكبد أو التهاب شديد أو تسمم بالدم ثم انتقاء المتبرع ممن ألجأته الحاجة لبيع جزء من جسده ويتم انتقاؤهم من وسط المهددين بالسجن في قضايا الشيكات أو المسجلين أو الفقراء فقرا مدقعا ثم يبدأ السمسار مساومة الضحية تحت إشراف للأسف هذه الشرذمة من أساتذة الجامعة \"المفروض أنهم أقسموا علي توعية الناس والحفاظ علي صحتهم\" ليتم أخذ -ويا للعار -جزء من المال الذي يدفعه المتلقي للمتبرع الذي أضطر أن يبيع لشدة فقره جزءا من جسمه وذلك في حالة السمسار الذي يمكن أن نسميه شريفا أما لو كان غير ذلك فإنه قد يسرق هو معظم ثمن الكلي ولا يدفع للمتبرع إلا القليل وليشتكي المتبرع وليضرب رأسه في الحيط فهو قد مضي\"وقع\" وبصم علي ورقة تفيد بأن كليته تبرع وهبة بدون أي مقابل مادي وتم توثيقها بطريقة ما في نقابة الأطباء ليخرج السمسار والأستاذ عند اللزوم من أي مشاكل محتملة كما تخرج الشعرة من العجين وتلقي المسؤولية علي النقابة أو يتفرق دم هذا المتبرع بين القبائل<br />ثم لجنة النقابة التي تصدر الموافقة علي الزرع المفروض أنها يجب أن تخبر كلا من الزارع\" المتلقي\" والمتبرع [المضاعفات المحتملة لكل منهما بالتفصيل وبما يتماشى مع مستوي الفهم لهذا الغني المريض الذي يتلهف علي شراء صحته بالمال وأيضا هذا الفقير المعدوم المتلهف علي المال الذي قد يحصله ولو ببيع جزء من جسمه والمفروض أن الأستاذ المعالج يكون قد فعل هذا قبلها ولكن هذا إن حدث من جانب لجنة النقابة يكون بشكل عابر فإنه نادرا جدا أن يحدث من جانب الأستاذ المعالج.<br />ثم يجب إخضاع كلا من الزارع والمتبرع قبل العملية بشكل مباشر لفحوصات شاملة للاطمئنان علي كل منهما وهذا لا يحدث بل يتم اختصار هذه التحاليل جدا وكانه يحاول أن يداري أي مرض ممكن أن يعوق عملية الزرع ولذلك يجب حجز كلا من المريض والمتبرع قبل موعد العملية بأسبوع إلي عشرة أيام علي الأقل حتى إذا كانت هناك مثلا حالة إصابة بميكروب ما يتم علاجه بكورس كامل مناسب من المضادات الحيوية ليكون قد تم شفاؤه قبل الدخول للعملية وقبل البدء في تعاطي مثبطات المناعة وهذا مالا يحدث أبدا بل قد يتصل الأستاذ ويقول :هناك حالة داخلة لي اليوم ليلا ليتم زرعها غدا وتحضرني عدة حالات منها حالة تم التعجل في زراعتها وكان عندها ناسور شرجي لم يتم علاجه فنشطت البكتيريا بعنف بعد العملية وتعاطي مثبطات المناعة ومكثت في معاناة شديدة وتهديد لحياتها أكثر من شهرين محجوزة بالمستشفي وتكلفت حوالي خمسة وعشرين ألف جنيه فوق مصاريف العملية الأصلية واضطرت وزوجها للاستدانة والسؤال وحالة أخري دخلت ليلة العملية وبعمل تحليلات لها تبين وجود تثبيطا شديدا لنخاع العظم بسبب أدوية الزرع وكانت ستموت لو أجريت لها العملية<br />ثم يبدأ الإهمال بأشياء تفوق الخيال فمرة يتم زراعة مريض والأستاذ المشرف علي الحالة ليس أصلا في مصر بل في الخارج بتابع الموضوع بالتليفون وكأنه ويطمئن علي قفص عصافيره ومرة شركة تدعو أستاذ لرحلة حج ويذهب ويترك اثنين من مرضاه حديثي الزرع في حالة حرجة و حتى لا يتصل بالتليفون بل يطلب تبادل المعلومات عن طريق الرسائل القصيرة SMS وكأننا في مسابقة من نوع الزيرو تسعماية (0900)مما أدي إلي رفض الكلي في أحدهما ووفاة الأخر بعد ذلك بشهرين بعد أن عجز أهله عن إستكما ل نفقات علاجه.<br />وليس هذا الأستاذ بالمتدين أصلا بل ذهب في تلك الرحلة علي سبيل عدم تضييع العزومة ومرة أخري أستاذ يجري أربعة عمليات زرع في يومين ولا يتم طلب المعامل اللازمة لهم لمتابعة حالة ما بعد الزرع مما يؤدي لمضاعفات خطيرة لحالة ترقد ألان بين الحياة والموت وحالة تم كتابة خروج لها في اليوم الرابع للزرع وذلك لإخلاء مكان لحالة زرع جديدة \"رغم أن المعروف أن أكثر أزمات رفض الجسم للكلي المزروعة تحدث في اليوم الخامس والعاشر \" ليحدث لها مضاعفات خطيرة في البيت والأهل لا يعرفون سوي أنهم سوف يتابعون مع الأستاذ بعد أسبوع لينتهي الأمر بعودة المريض للمستشفي في حالة رفض شديدة للكلي وكثير وكثير من الأمثلة ***** وأيضا إلقاء المتبرع خارج المستشفي بعد يومين من العملية بعد أن انتهوا من غرضهم منه(نظرية فتاة شارع جامعة الدول) بدون أي رعاية أو متابعة والمطلوب منا ألان إن ننقذ مصر من الكارثة الحالية \"النخاسة الجديدة المقنعة\" والكارثة المقبلة وهي تزايد عدد مرضي الفشل الكلوي مستقبلا ويمكنك تقدير حجم تلك الكارثة المتوقعة إذا علمت أن هناك من الأساتذة الدكاترة من يجري أكثر من خمس أو ست عمليات في كل أسبوع ويوزعهم علي مستشفيات ومراكز مختلفة متباعدة لكيلا يتم كشف حجم نشطاته أو رصد فشل الزرع في حالة حدوثه وانتشار سمعة سيئة له فبكم تقدر عدد الأساتذة العاملين بهذا المجال وكم يكون العدد السنوي لتك العمليات) وبالتالي كم يكون عدد المتبرعين المهددين. وأسئلتي للأساتذة الدكاترة هي عبارة عن الاتي:<br />1-ما هو متوسط العمر الافتراضي للكلي المزروعة؟<br />2- كم بالمائة من الكلي المزروعة تعيش خمس سنوات؟<br />3- كم بالمائة من الكلي المزروعة تعيش عشر سنوات؟<br />4-- كم بالمائة من الكلي المزروعة تعيش خمس عشرة سنة؟<br />5-هل تزيد معدلات الإصابة بالأورام فيمن يتلقون أدوية الزرع؟ وكم تبلغ؟<br />6- ما هي نسبة حدوث ضرر للكبد ؟ ونسبة حدوث فشل أو تثبيط لنخاع العظم؟<br />7- ما هي الأضرار الأخرى الناتجة عن الزرع؟<br />8- ما هي نسبة إصابة المتبرع بالفشل الكلوي بعد عشرين سنة ؟<br />9-هل تعتقد أن الذي يأتي ليتبرع بكليته يفهم أن ارتفاع نسبة الكرياتينين إلي رقم خمسة معناه إنه سيصاب بفشل كلوي؟<br />10- هل التبرع آمن تماما ؟<br />11- كم نسبة التبرعات بين الأقارب؟<br />12- هل يتم التبرع نظير مقابل مادي أم لا ؟وإذا كان لا فما الدافع؟<br />13- لماذا إذن لا تتبرعون بالكلي أنتم أو أولادكم؟<br />والمطلوب وضع قوانين رادعة وإجراءات صارمة تتمثل في الآتي:<br />** البدء فورا بإنشاء جمعية أهلية مستقلة لحماية كلي المصريين يمنع تماما من عضويتها أي طبيب أو أستاذ يعمل بزراعة الكلي وتكون مهمتها توعية كلا من المتلقي والمتبرع بكل من فوائد الزرع وأضراره بشكل واضح وصريح غاية الوضوح والصراحة ثم يترك لكليهما الخيار لتقرير مصلحته وتكون موافقتها ضرورية قبل إجراء أي عملية زرع كلي.<br />** يعاقب أي أستاذ أو طبيب بسحب ترخيصه ولقبه العلمي إذا ثبت بأي حال من الأحوال أجراءه أو أشرافه أو اشتراكه في أي عمليات زرع كلي في مكان غير مرخص أو غير مجهز تجهيزا كافيا.أو في حالة كون المكان مرخصا ومجهزا لزرع الكلي وثبت أن هناك أي تلاعب بالإجراءات القانونية<br />** إلزام كلا من المتلقي والطبيب المشرف علي عملية الزرع متضامنين بالتأمين علي المتبرع صحيا وذلك لتجنب إرهاق ميزانية الدولة مستقبلا بعلاج أي متبرع متضرر صحيا نتيجة لتبرعه.<br />** إجراء مراجعة شاملة للمستشفيات والمراكز التي تجري عمليات زرع الكلي ووجوب منحها تراخيص خاصة ولا يسمح لأي مركز أو مستشفي بإجراء تلك العملية إلا بعد استيفاءه لشروط الجودة والكفاءة والتجهيزات اللازمة وأي مستشفي أو مركز يخالف ذلك يتم إغلاقه نهائيا وسحب ترخيصه.<br />** إيجاب دخول كلا من المتبرع والمتلقي للعزل وإجراء الفحوصات اللازمة قبل الزرع بأسبوع علي الأقل مع وجوب تقديم الرعاية الصحية اللائقة للمتبرعين بعد العملية وعدم إهمالهم.<br />**يجرم تماما أي نقل أعضاء من مصريين لغير مصريين إلا في حالات القرابة حتى الدرجة الثالثة والتي يمكن إثباتها بوضوح وبشكل لا لبس فيه.ويعاقب بالإيقاف عن مزاولة المهنة كل من يثبت تورطه في مثل ذلك العمل.<br />** يتم عرض المرضي الذين يتم عمل زراعة كلي لهم علي لجنه طبية تابعةللجمعية الأهلية المقترحة عالية لا يعمل إي من أعضائها بزراعة الكلي ولا بالتجارة في أدوية ما بعد الزرع وذلك دون مقابل مرة علي الأقل كل ثلاث شهور<br />ويتم سحب ترخيص إجراء عمليات زرع الكلي من أي مركز أو طبيب تزيد نسبة الفشل أو المضاعفات الخطيرة في حالاته عن 10% في أول ثلاث شهورأو12%بعد أول ست شهور أو15% في خلال أول تسعة شهور أو 20%خلال أول سنة ويتم منعه من إجراء عمليات زرع الكلي بشكل قطعي لمدة عام لإعادة توفيق أوضاعه وإعادة تقييم كفائتة و قدراته وتجهيزاته مرة أخري.<br />**أي أستاذ يثبت تقصيره ويؤدي ذلك التقصير إلي فشل الكلية المنقولة يكون ملزما كليا لوحده بالتأمين الصحي علي المتبرع دون المتلقي وفي حالة أدي إهماله لوفاة أي من المتبرع أو المتلقي فإنه يلزم بدفع التعويضات اللازمة والمناسبة لأهل الضحية .<br />إلي كل مواطن مصري شريف يحب بلده ويخاف علي الناس فيها ويريد مصلحتها هيا معا ننشر هذة الرسالة وأدعو كل قوي المجتمع الفاعلة إلي المشاركة معي تأسيس الجمعية الأهلية لحماية كلي المصريين .<br />د /محمد حامد محمد حجازي<br />طبيب مقيم أمراض الباطنية والكلي<br />مستشفي قصر العيني التعليمي الجديد<br />محمول: 0121706170<br />بريد اليكتروني:HEGAZY.MOHAMMAD@GMAIL.COM"
