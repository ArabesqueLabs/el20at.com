[[comments]]
order = 3
subject = "الحكومة الرشيدة"
author = "ابو شريف"
posted = "2006-06-13"
text = "في بداية العصر المباركي تم نشر إعلان وتعهد مدفوع الأجر بجريدة الأهرام موقع من أطباء وعلماء بجامعة عين شمس يؤكدون فيه بأنه تم أخذ عينات من مياه النيل من أماكن مختلفة تمثل طول النهر وتم تحليلها وكانت النتيجة أن الكيماويات التي كانت تستخدمها وزير الري في الحكومة الرشيدة في ذلك الوقت - في ذمة الله حاليا - في مكافحة ورد النيل سوف تسبب العديد من الأمراض ولا يتم التخلص من آثارها عن طريق تكرير المياة المتبعة بوزارة الري وطالبوا في التقرير إستخدام الأجهزة التي كلفت الدولة ملايين الجنيهات وتم تخزينها في مخازن الوزارة ويومها دافع وزير الري عن موقفه ... أتقدم للسادة الأطباء الشرفاء المصريين أن يفيدوا الشعب المغلوب علي أمره هل أمراض الكبد والأمراض الأخرى التي تزايدت حاليا بسبب تلك الكيماويات أم بسبب الكيماويات المسرطنه التي سمسر علينا فيها وزير الزراعة السابق المعجزة أم الشعب المصري هو السبب في عدم قدرته علي السيطرة علي صحته ...<br />والي المنتظرين الرد من وزارة الصحة حول تأكيد دواء الطحالب من عدمه أاوكد لهم أن الرد سوف يتأخر لحين حصول السيد وزير الصحة علي الثانوية العامة"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613191504/http://masr.20at.com:80/article.php?sid=478&PHPSESSID=7544a8ad0826c6ed2288a687afead969"

[[comments]]
order = 4
subject = "ارحمونا يرحمكم الله"
author = "احمد عبد المنعم"
posted = "2008-10-01"
text = "السيد الاستاذ الدكتور علاء الدين إبراهيم رئيس قسم الكبد والجهاز الهضمي بطب بنها<br />مقالتك يا سيدى بتاريخ 2006 وها نحن اصبحنا فى 2008<br />ولقد اتى العلاج بالطحالب بنسبه شفاء اعلى من 80 فى المائه وهذا بشهادة من تم علاجهم به وانا منهم<br />وللعلم يا ايها الدكتور ان الذين تم علاجهم استخلصو افرازات الطحالب بشكل يدوى جدا يعنى لا معامل ولا حضانات<br />وتم شفائهم وانا منهم يا دكتور<br />انا بصراحة بقولك يا دكتور وانا قرفان<br />لانك عقليتك لا تصلح بان يطلق عليك سوا بواب لمن يديرك ويدفع لك راتبك ويملى عليك تصريحات علشان تقولها<br />يا عم الحاج اكيد انت درست وتعرف ان العلم اساسه البحث ولذلك سمى بالبحث العلمى<br />فهل بحثت قبل ما تقولى الكلمتين دول<br />اكيد لا والف لا ومليون لا<br />وللعلم يا عم الحاج ان ابوال الابل تشفى بنسبه مائه فى المائه وهذا من واقع اقوال وتقارير المرضى الذين تم علاجهم بابوال الابل وحليبها<br />بس حضرتك ما كنت فاضى للبحث<br />اكيد كنت بتعمل دكتوراة ناقلها من واحد قبلك علشان يزودوك عشرة جنيه فى الراتب بتاعك واتحداك تكون فاكر حاجة منها غير اسمها<br />يا عم الحاج ارحمونا من تصريحاتكم اللى ما لها اساس<br />وال ايه سئل الاساتذة بتوعه<br />يعنى ودن ولسان انما ايدك مشلوله فكرك متوقف<br />تعالى يا جميل نحلل كلامك<br />كلامك<br />ظهر منذ عامين ما يسمي العلاج ببول الإبل، وهناك الآلاف من المرضي يتحملون مشقة السفر للصحراء الغربية لشرب بول الإبل، طمعا في الشفاء، والمشكلة أننا واجهنا حالات كثيرة لمرضي أصيبوا بمضاعفات شديدة نتيجة هذا العلاج<br />يا عم الحاج انت دكتور يعنى مش هيجيلك الا المريض<br />يعنى يا جميل<br />لو راح مثلا 100 شخص للعلاج من الطبيعى هيجيلك منهم على الاقل عشرين واحد لم ينفع معهم العلاج<br />لان اى علاج فى الكون لازم يكون له نسب سلبيه وليس هناك علاج نسبه ناجحة بمائه بالمائه<br />ولكن يا جميل لو نسبه النجاح وصلت ل 80 فى المايه يبقى علاج رائع ونتائجة باهرة<br />صح الكلام دا ولا ما صادفك فى الدكتوراة بتاعتك<br />كلامك<br />ولم نر أي موقف واضح من وزارة الصحة<br />الرد هوة انى ازرغتلك لولولولولولولولولوووووووووووووووووووووووى وزارة الصحه ابقى سلملى على البتنجان<br />يا من تبحث عن وزراة الصحة قل لى بالله عليك اين كانت وزراة الصحة اثناء تفشى المرض واين كانت من المبيدات المسرطنه واين كانت من تفشى السلبيات والفساد فى المستشفيات العامه والوحدات الصحيه على مستوى الدوله<br />واين واين واين<br />فوق يا عم الحاج وما تقولشى ايه اديتنا مصر وقول هندى ايه لمصر<br />كلامك<br />قالوا: ابعدوا عن السنة النبوية ولم نر أي موقف واضح من وزارة الصحة أو نقابة الأطباء، وأنا شخصيا تحفظت في الكلام خوفا من أن يتهمني أحد بالكفر أو إنكار الأحاديث النبوية أو إهدار دمي<br />الرد<br />لا يا عم الحاج ما فى حد هيتهمك بالكفر بس والنبى اللى بتؤمن بيه ابقى قول كلامك بعد ما تنزل وسط المرضى وتعرف كم نسبه الذين تم شفائهم من اللى لم يتم شفائهم<br />كلامك<br />ثم يأتي الآن الحديث عن علاج الطحالب، وقد سألت أساتذتي وزملائي في جامعتي القاهرة والإسكندرية إذا كان هذا العلاج بالطحالب قد تمت تجربته تحت إشراف الأقسام المعينة، فأنكر الجميع معرفتهم، وهذا معناه أن العلاج تمت تجربته في العيادات الخاصة بالسادة المشاركين فيه، وهذا قمة العبث إذا كان الاستنتاج صحيحا<br />الرد<br />يعنى بعد ما شوفت بعينك اكثر من عشرين مركز بحثى كل مركز قام بيه فريق والكل قامو بتجريب العقار وتاكدو من عدم سميته<br />ولو مش مصدق او ما تعرف اصلا ادخل الجوجل وابحث وهتعرف كام مركز بحثى قامو على هذا العلاج قبل نشر الخبر فى الجريدة الرسميه<br />وبعدين يا عم الحاج انت دكتور واستاذ كمان كان على الاقل بدل ما تسئل ناس ما تعرفش شئ كنت اسئل اللى يعرفو<br />واسماء المراكز البحثيه معروف واسماء الاطباء الذين قامو على العلاج منشور ومعروف ولا حضرتك كسلت وقولت اسئل اصحابى وخلاص اهه تريح ضميرك وتقول انك سئلت بدليل انك بتقول اساتذتك واللى تعرفهم<br />كلامك<br />كما ننتظر بيانا من السادة المشرفين علي هذا البحث ليبلغونا فيه وبصراحة أين كانوا يعالجون هؤلاء المرضي الذين تحدثوا عن شفائهم؟<br />الرد<br />اخيرا اعترفت ان فى مشرفين ولكن ما تعرف تتصل بيهم او بالاحرى طنشتهم وقولت تصريحاتك من باب خالف تعرف<br />كلامك<br />من قلوبنا نتمني أن تكون النتائج التي أعلنها السادة المكتشفون حقيقة دامغة، وهي شفاء المرضي بنسبة &--1640;&--1632;% في خلال ثلاثة أسابيع فقط، ونوصي بحصولهم علي أعلي الأوسمة، بل ونرشحهم لجائزة نوبل في الطب إذا كان هذا صحيحا<br />الرد<br />قلبك طيب ايه المشاركه الفعاله دى<br />مستنى يقولولك وتبقى من انصار قالولو - بدل ما تتصل بيهم وتشاركهم وتتفاعل معاهم ولا الدكتوراة بتاعتك كانت تضمن البحث من خرم الباب والتصنت حتى تعرف بيقولو ايه وبعدين تقول بقا اللى بيقولوة وتوحى للمستمعين انك كنت رائيس الباحثين والمشارك الاكبر<br />كلامك<br />إن ما يواجهنا به الناس: هل من المعقول أن يضحك علينا أساتذة من قصر العيني وجامعة الإسكندرية وأكاديمية مبارك ومعهم ابن شقيق الرئيس الراحل جمال عبدالناصر؟<br />بماذا نرد علي أسئلة الناس؟ هل نرد عليهم بأن مرضي الكبد حقل تجارب، من الحمام إلي الجمال، ثم أخيرا الطحالب، وماذا بعد؟ ..عضة الكلب أم رفسة الحمار؟<br />الرد<br />ترد تقول بكل فخر وعزة وانت لابس البالطو الابيض والكرفته ادينى مستنى زيكم على ما يقولو عملو ايه او الافضل تقول ما اعرفش<br />ولا مكسوف تقول ما اعرفش ولازم تعمل فيها الواد عبقرينو المقطع الطب وتغنى على الناس<br />وبعدبن انت شاعر اهه<br />من الحمام للجمال<br />ومن عضه الكلب لرفس الحمار<br />ايه الشعر دا كله شكلك واكل شعرية كتير يخربيت مخك اللى مودينا فى نصيبه<br />مع تحياتى وارجو النشر<br />ورحم الله<br />الاستاذ الكبير والصحفى المرموق<br />مجدى مهنا<br />اسكنه اللة فسيج جناته"
