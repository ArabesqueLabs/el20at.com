[[comments]]
order = 0
subject = "مين هنيدى دة"
author = "رخم بقى"
posted = "2007-10-14"
text = "مين اللى قال ان هنيدى دة ينفع ممثل كوميدى او حتى كومبارس<br />دة انسان عندة سماجة ووش يخللى الفرحان ينغم<br />دة مهرج رخيص بيلبس شوية لبس امرأة ويغنى كلام كلة خبل ويتنطط زى المجانين وبتاع كدة تركيبة على بعضها انة بيستغفلنا ويعطيك احساس ان واحد بيفرض نفسة بالعافية على المتفرج<br />الهنيدى دة رمز واضح للانحطاط الفنى وتضييع وقت المشاهدين فى ما لا اى فائدة<br />اقصى امانى واحد زى دة انة ينفع مهرج فى فرح شعبى فى امبابة او يدخل فى قافية مع واحد صايع على قهوة بلدى<br />هنيدى اية وغم اية وفن اية<br />يا وزارة الثقافة منك للة<br />ارحموا اعصابنا وبلاش هنيدى"
archived = "2007-10-14"
capture_url = "https://web.archive.org/web/20071014234128/http://masr.20at.com:80/newArticle.php?sid=11903"

