[[comments]]
order = 1
subject = "اتقول قاعد في قلبهم"
author = "ريما"
posted = "2007-02-05"
text = "هو فعلا هالخبر قرب يصبح حقيقة و فعلا هي هي ردود الفعل الي رح تكون و ما ظنيت رح تزيد او تقل عن هيك<br />تذكرت لما بدت الانتفاضة التانية بعدزيارة شارون للمسجد الاقصى...يوم ضربت اسرايل غزة عقدمؤتمر قمة عربي.. يوميها روحت بدري من الجامعة عشان اطمن شوطلع معهم لقيت اختب بتحكيلي خلصو القمة و روحو... قمةماخدتش اكتر من يوم و طلعت ببيان مسخرة.. مش عارفة ليش يومها كنت مفكرة انهم رح ياخدوموقف فعلا ؟ غباء<br />بس هلا بعرف انو لو تقصف فلسطين و العراق و لبنان و سوريا نووي العرب برضوما رح يتحركو... لا عفوا رح يعقدو مؤتمر و يصدرو تنديد و استنكار و شجب... مع التبرع بشوية مصاري ما بتوصل<br />بس بالاول يا ريت احنا الفلسطنية نصحا ونبطل اقتتال داخليو نرجع انفكر بقضيتنا<br />يا جماهير شعبنا المناضل بكفي ... فضحتونا... احنا شعب الو قضية هي تحرير وطن.. مش كرسي راسة و لا وزارة.. الي بتعملومش لصلحة قضيتنا .. حولتونا من شعب مناضل لفصائل بتتقاتل بحرب اهلية"
