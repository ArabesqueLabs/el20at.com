subject = "الي صاحب اول تعليق"
author = "سيد مجانص"
posted = "2008-04-26"
text = "ياساتر عليك انت بني ادم حسود وحقود ومليان غل من جواك<br />يعني بتحسد الراجل علي شجاعته وجراته في قول الحق<br />شهرة ايه بس.....هو انت فاكر ان كل الناس واطية ذيك وبتدور علي نفسها بس<br />ياتكم القرف مليتم البلد"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428194650/http://masr.20at.com:80/newArticle.php?sid=15435"

