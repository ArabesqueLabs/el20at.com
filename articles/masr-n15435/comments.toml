[[comments]]
order = 0
subject = "الشهرة هي الحل"
author = "مش رضوه حسن ولا مروة عبدالفضيل"
posted = "2008-04-24"
text = "طبعا الاخ لما قاطع رئيس الوزراء لفت الانظار حوله وكل الجرايد اتكلمت عليه والفضائيات<br />واصبح انسان مشهور زي اسراء تماما<br />وطبعا هو اصبح انسان متميز الان ودي حتفيده اوي اوي في مستقبله الوظيفي<br />يعني ممكن الان فور تخرجه يلاقي وظيفة لانه اصبح الان الواد الفتك اللي قاطع رئيس الوزراء<br />وصورته ملت الجرايد والمجلات ومواقع الانترنت<br />مبروك يا بلال وانا فاكر مرة زمان اول ما طلع شريف الدواخلي عمل تعليق لكاتب في عشرينات اسمه بلال وقالوا يا بلال انت من احسن المحررين اللي عندنا في هذا الموقع<br />وانا اقول لبلال اللي فوق يا بلال مبروك انت عملت حاجه كويسة حتنفعك جدا في مستقبلك الوظيفي<br />انت بلال اللي قاطع رئيس الوزراء والامن حقق معاك واحتجزك ساعتين يا بلال<br />مبروك يا بلال<br />ويا مروة صلاح هي زميلتك دودي ام ننوشه يعني دعاء الشامي ما بتكتبش ليه هي بتولد ولا ايه والنبي طمنينا عليها"
archived = "2008-04-26"
capture_url = "https://web.archive.org/web/20080426023926/http://masr.20at.com:80/newArticle.php?sid=15435"

[[comments]]
order = 1
subject = "شباب الامل"
author = "دقدق"
posted = "2008-04-25"
text = "خلاص معدش احد بيخاف لا من ا لامن ولا من مباحث امن الدولة<br />معندوش حاجة يخسرها<br />هيحبسوة مش مهم -<br />بقت حياة الناس من غير اى امل<br />اسود فترة فى تاريخ مصر<br />لا شقة - لاوظيفة - لا زواج- لا اى امل"
archived = "2008-04-26"
capture_url = "https://web.archive.org/web/20080426023926/http://masr.20at.com:80/newArticle.php?sid=15435"

[[comments]]
order = 2
subject = "لا شقة - لاوظيفة - لا زواج- لا اى امل"
author = "ghgh"
posted = "2008-04-25"
text = "وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه<br />يا حكومة والنبي شوفوا حل لمشكلة زواج الشباب"
archived = "2008-04-26"
capture_url = "https://web.archive.org/web/20080426023926/http://masr.20at.com:80/newArticle.php?sid=15435"

[[comments]]
