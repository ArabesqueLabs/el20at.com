posted = "2010-01-24"
text = "ازهر اية يا ابنى<br />انت بتتكلم عن الازهر القديم<br />معظم خطباء الازهر وخريجى الازهر بيخطبوا خطبة الجمعة من ورقة بيقرؤوها بغباء<br />خطبة مكتوبة من ايام مولانا عز ابن عبد السلام ايام المماليك<br />وفى اخر الخطبة بيدعو للسلطان المظفر امام الدنيا والدين ولى المسلمين<br />عباس محمود العقاد لم يكن ازهريا وكتب كل كتب العبقريات الاسلامية<br />محمد حسين هيكل المفكر الاسلامى كتب كتاب محمد رسول اللة ولم يكن ازهريا<br />السيد قطب الامام الشهيد الذى شنقة عبد الناصر كتب كتاب مرجع فى جميع الجامعات العالمية اسمة التصوير الفنى فى القران الكريم - لم يكن ازهريا ولكن كان خريج دار العلوم<br />الفكر الاسلامى ليس قاصر على الازهرية وعلماء الدين ولكن لكل صاحب عقل<br />ابن سينا الطبيب الاسلامى المشهور لة كتب فى التفسير رغم انة طبيب وكذلك الفارابى<br />فلا يعيب ابدا ان اكون ميكانيكى وعندى فكر اسلامى واكتبة او اشرحة<br />تحية لكل الدعاة الجدد ايا كان تخصصاتهم رغم انف الفشلة من خريج الازهر الذين يرفعون المفعول بة وينصبون الفاعل"
