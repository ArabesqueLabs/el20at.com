text = "فى بلد فية شيخ الازهر لو كان لة كلمة كيف يكون<br />مرتب القسيس 4 الاف جنية شهريا<br />ومرتب الشيخ فى الجامع 120 جنية<br />شنودة بياخد مخصصات الكنيسة من الحكومة ويعطى مرتب محترم للقسيس انما شيخ الازهر ويا عينى علية والا زقزوق روح قلبى - يا عم بلاش تخلينى اتنرفز روح ربنا يسترها معاك"
