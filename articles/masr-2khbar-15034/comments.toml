posted = "2010-01-24"
text = "انا خريج قديم جدا<br />على ايامنا كان يستخرج لكل طالب بطاقة امتحان وعليها صورتة ومختومة بختم الكلية<br />وبعد ان نجلس فى قاعة الامتحانات كان المعيد المراقب يمر ليطابق الصورة التى على البطاقة مع صورة الشخص الممتحن هذا اذا كان المعيد من خارج القسم او من كلية تانية<br />وبالنسبة للبنات المنقبات فمن السهل ان تمر عليهم معيدة وتطابق الصورة مع الاصل وينتهى الموضوع<br />هى اية الحكاية بالضبط<br />هى الجامعة عايزة تحرم النقاب فى المجتمع وتمنعة مثلا<br />تبقى غلطانة وبتسبح عكس التيار<br />لان المجتمع المصرى هيلبس النقاب يعنى هيلبسة غصب عن عين التخين وعجل ابيس والزقزوق والطنطاوى وبتوع السياسات وامثال سويرس وخلافة<br />لماذا ؟<br />لان جداتنا رحمهن اللة كن يلبسن الخمار المشبك واليشمك وحتى ثورة 1919<br />لاننا لا يمكن ان ننفصل عن ما حولنا<br />ولنا 5 ملايين مصرى فى الخارج وفى السعودية<br />انا شفت مصرية محترمة ولانها كانت غير محجبة فقد كان اصحاب البلد المواطنات يطلقن عليها المصرية الفاجرة<br />ولما تلاقوا لقمة عيش كريمة لمواطنيكم فى بلدكم بعيدا عن دول الجيران ابقوا امنعوا لبسهم<br />والا<br />مصرية فاجرة"
