text = "علشان ترتاحوا وتريحوا ولا تلفوا حول نفسكم<br />الموضوع حرية شخصية<br />كل واحد حر يلبس اللى هو عايزة<br />لماذا لا يفتى الطنطاوى والزعبلاوى فى المرأة التى تلبس المحزق والملزق<br />لماذا لا يفتى فى صالات القمار فى الفنادق واخر حادثة عن عضو الوطنى اللى دخل قاعة لعب القمار هو وزميل لة عضو مجلس الشعب<br />هو النقاب بس اللى مؤخر الدين وسبب السيول فى اسوان والعريش وجنوب سيناء<br />كل واحد حر فى لبسة<br />وكل واحد حر مع اهل بيتة يخرجهم محجبين يخرجهم الشارع عريانين - هو حر<br />اية علاقة النقاب بالوهابية<br />كل شعب ولة حريتة<br />وكل واحد حر فى دقنة<br />يعنى دقن شنودة اطول من دقن الطنطاوى وابو الزقزوق عامل خنافس وليس لة دقن خالص ولا اعتراض لان دى حرية شخصية<br />بطلوا هيافات<br />وفكروا لية السكر وصل 5 جنية للكيلو<br />ولية السيول كسرت وخربت الخراب دة كلة"
