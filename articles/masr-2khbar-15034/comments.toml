text = "يا جماعة المسلمين اذا كان احدا نكم عنده قضية لا بد ان يذهب لمحامي خريج كلية الحقوق وعضو نيابة المحامين<br />واذا كان مريض لا بد ان يذهب لطبيب خريج كلية الطب وعضو نقابة الاطباء<br />وهكذا<br />واذا كان الامر يخص الدين فالدين ليس اقل من المحاماه والطب<br />الدين له كلياته التخصصية الا وهي كليات الدعوه واصول الدين<br />فلو سمحتكم لا تأخذوا الدين الا من اهل الاختصاص كالشيخ الشعراوي والشيخ احمد عمر هاشم<br />لا تأخذوا الدين من الوهابية والاخوان<br />لانهم غير متخصصين في الدين<br />والدين ليس اقل من القضاء والمحاماه<br />الا هل بلغت اللهم فاشهد<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
