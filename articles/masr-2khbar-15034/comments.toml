text = "استحلفكم بالله ان تقولوا الحقيقة<br />الشيخ الازهر سيد طنطاوي سيد طنطاوي استاذ دكتور في كليةا اصول الدين افتى بعدم النقاب<br />محمد حسين يعقوب مدرس ابتدائي بحكم مؤهله دبلوم معلمين افتى بلبس النقاب<br />بذمة ابوكم المفروض اصدق مين فيهم<br />انا راضي ذمتكم<br />شيخ الازهر استاذ دكتور محمد سيد طنطاوي ولا محمد حسين يعقوب اللي ما حدش عارفله اي اصول علميه غير انه معاه دبلوم معلمين خمس سنوات بعد الاعداديه<br />مين اللي صح ومين اللي غلط"
