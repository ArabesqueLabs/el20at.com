text = "امام الوهابية في مصر ابو اسحاق الحويني شوفوا السيرة الذاتيه بتاعته<br />ــــــــــــــــــــــــــــــــــ<br />نبذة مختصرة عن السيره الذاتيه للعلامة أبو إسحاق الحوينى ( عالم الحديث الجليل )<br />هو الشيخ :<br />حجازي بن محمد بن شريف ولد<br />تخرج من كلية الألسن قسم الأسباني وكان الأول على دفعته في كل أعوامها عدا السنة الأخيرة<br />حيث كان الثاني.<br />ابو اسحاق الحويني امام الوهابية في مصر خريج كلية الالسن قسم اسباني<br />يا خرااااااااااااااااااااااااااااااااااااااااااااااااااا بي<br />يا خراأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأ بي<br />يا جماعة خليكم مع علماء الازهر وبس ما لكوش دعوه بالاخوان والوهابية<br />كلهم جهله جهله جهله جهله جهله"
