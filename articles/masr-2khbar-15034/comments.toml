text = "الحكومة مش محتاجه فتاوي من حد<br />الحكومة بتحكم بالامن المركزي وقوات الجيش والدبابات<br />الحكومة ليست بحاجه الى فتاوي من احد<br />واخيرا اكرر<br />الدين يؤخد من علماءه المتخصصين وليس من الرؤوس الجهاله<br />سلام<br />واريد ان اقول هنا لو شيخ الازهر افتى بضرورة لبس النقاب للمرأة<br />لاعترض عليه الرؤوس الجهاله وواجهوه بالادلة التي التي تبيح للمرأة الخروج بدون نقاب<br />سلام"
