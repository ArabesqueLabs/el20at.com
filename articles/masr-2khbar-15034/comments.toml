text = "يا اختي الخليج بيعاني الان من قضية النقاب اكثر من المصريين ولدواعي امنية<br />عندهم حاجه اسمها افراح النساء<br />الرجاله بتلبس ملابس النساء وبتلبس النقاب وتدخل تقعد مع النسوان وبتصورهم كمان<br />فاهمه ازاي يا ماما<br />النقاب مرفوض لدواعي امنية في مصر وفي الخليج وفي العالم كله<br />وبعدين حضرتك بتصلي ازاي<br />اذا كان النبي محمد علم المراة الصلاه وخلاها تكشف وجهها في الصلاه<br />والصلاه تكون باطله اذا غطت وجهها<br />ايه رأيك بقا<br />ما تفتيش من غير علم"
