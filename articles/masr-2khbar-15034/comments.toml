subject = ""
author = "المعلق السابق"
posted = "2010-01-25"
text = "المعلقه السابقة<br />فيه يا اخي حاجه في الدين اسمها علامات يوم القيامه<br />من ضمن علامات يوم القيامه<br />قبض العلم وانتشار الرؤوس الجهاله كما هو الحال في جميع القنوات الفضائية<br />بص شوف النبي محمد قال ايه<br />عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ , قَالَ : \" إِنَّ اللَّهَ لا يَقْبِضُ الْعِلْمَ بِأَنْ يَنْتَزِعَهُ انْتِزَاعًا ، وَلَكِنْ يَقْبِضُهُ بِقَبْضِ الْعُلَمَاءِ ، حَتَّى إِذَا لَمْ يَبْقَ عَالِمٌ حَدَّثَ رُءُوسٌ جُهَّالٌ فَسُئِلُوا فَأَفْتُوا بِغَيْرِ عِلْمٍ ، فَضَلُّوا وَأَضَلُّوا \" . هَذَا حَدِيثٌ صَحِيحٌ ثَابِتٌ مُتَّفَقٌ عَلَى صِحَّتِهِ مِنْ حَدِيثِ أَبِي الْمُنْذِرِ هِشَامِ بْنِ عُرْوَةَ<br />ــــــــــــــــــــــــــــــــــــــــــــــــ<br />يعني كل الدعاه اللي انت بتشوفهم في الفضائيات معظمهم رؤوس جهاله وعلامة الجهل ان يتكلم الانسان في غير تخصصه<br />اسحاق الحويني غريب السن اسباني<br />محمد حسان خريج اعلام<br />عمر خالد محاسب<br />معز مسعود خريج اقتصاد جامعة امريكية<br />حسين يعقوب دبلوم معلمين<br />مصطفى حسني ادارة اعمال<br />كلهم رؤوس جهاله"
