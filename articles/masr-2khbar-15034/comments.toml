posted = "2010-01-25"
text = "اذا كان الواحد منا عنده قضية بيذهب الى محامي خريج كلية الحقوق<br />واذا كان مريض يذهب الى طبيب خريج كلية الطب<br />واذا كان عنده قضية حسابية بيذهب الى محاسب خريج كلية تجاره<br />واذا كان عايز يا خد درس رياضيات يذهب الى مدرس متخصص<br />وهكذا<br />الدين ليس اقل من ذلك<br />الدين ليس اقل من ذلك<br />الدين يؤخد من خريجي كليات اصول الدين المنتشرة في البلاد<br />الدين لا يؤخد من الرؤوس الجهاله بتوع الفضائيات<br />الا هل بلغت اللهم فاشهد"
