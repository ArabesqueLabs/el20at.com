posted = "2010-01-24"
text = "الدكتور محمد سيد طنطاوي افتوى في كل شيء ومش كده وبس دا فسر القران كمان<br />بصي شوفي علماء الازهر يا جهله<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />3- عين فضيلته مدرسا بكلية أصول الدين سنة 1968، ثم عميدا لكلية أصول الدين بأسيوط سنة 1976، ثم عميدا لكلية الدراسات الاسلامية والعربية للبنين سنة 1985، ثم مفتيا لجمهورية مصر العربية فى 28 أكتوبر سنة 1986<br />من مؤلفاته:<br />1- التفسير الوسيط للقرآن الكريم<br />فى خمسة عشر مجلدا- وفى أكثر من سبعة آلاف صفحة وقد طبع هذا التفسير عدة طبعات أجودها طبعة دار المعارف سنة 1993.<br />ــــــــــــــــــــــــــــــــــــــ<br />مفسر القران يعني افتى في كل شيء<br />خليكي مع علماء الازهر وسيبي جهلة الوهابية والاخوان<br />وقد كتبه فضيلته فى بضعة عشر عاما، وقد بذل فيه أقصى جهده، ليكون تفسيرا محررا من الأقوال الضعيفة، والشبه الباطلة، والمعانى السقيمة، والآراء التى لا سند لها من النقل الصحيح، أو العقل السليم, وقد كان منهجه فيه:"
