text = "شيخ الازهر - بوضعة الحالى ليس شيخا ولا للازهر شيخا وليست لة مصداقية - ببساطة لانة موظف بدرجة مالية يقبض مرتبة من الصراف ويستطيع رئيس الدولة بكلمة منة ان يقيلة و يقعدة فى البيت عندما لا ينفذ كلامة ويفتى لة بما يريد<br />البابا شنودة لة مصداقية لانة منتخب بعيد عن التعيين واختيارات الامن لة بعكس شنودة<br />نعم للبابا شنودة مصداقية اكثر من شيخ الازهر لانة منتخب<br />ومرشد الاخوان دكتور الجامعة الطبيب البيطرى لة مصداقية اكثر من شيخ الازهر لانة جاء بانتخابات ولا يقبض مرتبة من احد<br />شيخ الازهر مجرد موظف على درجة مالية ليقول ما تريدة ان يقول جهة تعيينة<br />فلا يكلمنا احد كثيرا عن الازهر والازهريون<br />فنحن نرى ادائهم فى الدعوة"
