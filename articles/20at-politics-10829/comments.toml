subject = "مصلحة إسرائيل فى قتل شاليط"
author = "محمد جمال الدين"
posted = "2008-12-30"
text = "الكيان الصهيونى بيتمنى النهاردة قبل بكرة ،موت شاليط لأنهم ماشين بالمقولة الى بتقول فيما معناه .. انى ماروحش أحط صوووووووووباعى تحت ضرس حد .<br />فهما شايفين ان جلعاد شاليط ممكن يخليهم يرضخوا لبعض من مطالب حماس ... فيتمنوا أنه يموت فى القصف دلوقتى قبل كمان شوية .<br />علشان ما يبقاش فيه حاجة لحماس تساوم عليها . وينتهوا من القصة الى قرفاهم دى بقى .<br />دول صهاااااااااااااااااينة ........ والله ما عندهمش عزيز ولا حتى بينهم وبين وبعض... صهاينة ولاد***<br />ربنا يورينا فيهم يوم .<br />بس اليوم ده مش هييجى ألا لما حكام العرب يشيلوا الطرح من على رؤوسهم .. حسبنا الله ونعم الوكيل"
archived = "2010-03-14"
