[[comments]]
order = 1
subject = "فريسكاوي على طوووووووووووول"
author = "battot"
posted = "2008-01-14"
text = "حل مشكلة البطالة والتار والجواز كمان في بيع الفريسكا<br />والله مش هزار الراجل عايش حياه بسيطة ومتكيف معاها وحل معاها مشاكل كتير بيتعرض ليها الشباب وبيحلوها بالقعاد على القهاوي<br />وعلى غرار الفريسكا في حلول كتير لمشاكلنا لو فكرنا وابتدينا بأي حاجه ... متهيئلي كده"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ربنا يبارك له في قليله"
author = "أحمد المصري"
posted = "2008-01-16"
text = "أنا لاحظت الظاهرة دي في مدينة نصر و مصر الجديدة و مرة إتكلمت مع واحد من الشباب دول كان في منتهى الأدب و الاحترام و معلق شهادة صحية كمان.<br />يجب تشجيع هاؤلاء المكافحين فبدلا من السرقة أو البلطجة أو التطرف ده شاب محترم بيحاول يكسب رزقه من عرق جبينه و ربنا حيبارك له في الرزق ده مهما كان قليل إشتري منه عشان تشجع العمل الشريف متحبطهوش عشان الإحباط يؤدي إلي الهلاك.<br />مش كل الناس لازم تبقي أغنياء و لا كل الفقرا لازم يبقو شحاتين الغنا في الرضا المهم الحكومة تسيبه في حاله."
archived = "2010-03-14"
capture_url = ""

