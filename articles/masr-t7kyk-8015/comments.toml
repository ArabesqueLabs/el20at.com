[[comments]]
order = 0
subject = "فريسكا بالازايز"
author = "hk"
posted = "2008-01-13"
text = "واللة مثال طيب للشباب المنتج فى البلد - ما تيجوا كلنا نروح نبيع فريسكا - واية رايكم لما نبيع فريسكا فى ايطاليا -<br />والا نبيع فريسكا فى شرم الشيخ للسياح<br />والا فى الغردقة<br />فكرة رائعة - انا هبيع فريسكا"
