order = 0
subject = "واحنا ذنبنا ايه يا محمد السيد"
author = "مش البراء اشرف ولا شريف الدواخ"
posted = "2008-07-02"
text = "يا محمد السيد فيه ركود في الكافتريات في الجامعات<br />طيب ايه الهدف من المقال<br />والقارىء ذنبه ايه<br />وحنعلق نقول ايه انا دلوقتي عايز اكتب تعليق قريت الموضوع ثلاث مرات وللاسف مش لاقي حاجه اقولها<br />يا محمد السيد اي موضوع تكتبه لازم تدخل فيه الاشياء الاتية<br />1) الاخوان المسلمون<br />2) الاقباط<br />3) وزارة الداخلية المصرية<br />4) الحكومة ومجلس الوزراء<br />5) مجلس الشعب<br />6) الفساد<br />7) احمد عز<br />8) حبيب العادلي<br />9) اسرائيل او امريكا<br />10) معاهدة السلام<br />والموضوع يطول شرحه يا محمد السيد<br />صحصح كده الطبخة لازم يكون عليها شوية ملح وفلفل وبهارات<br />ما ينفعش تطبخ الطبخة تبقى ماسخه كده"
archived = "2010-03-14"
