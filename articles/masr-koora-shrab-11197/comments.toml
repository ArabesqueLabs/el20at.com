subject = "أبو تريكة قام بإجراء اختبارا طبيا الأربعاء من اجل"
author = "مش ضروري"
posted = "2009-02-06"
text = "طبعا ما هو احنا لازم نطمئن لازم لما نيجي نلعب كوره تكون كل حاجه صح ومدروسه<br />امال ايه<br />ولا حنعمل زي عبدالحكيم عامر في الـ 67 دخل حرب من غير اي حاجه<br />لا لازم ناخد بالنا في الكورة لحسن ننهزم وتبقى مشكلة"
archived = "2010-03-14"
