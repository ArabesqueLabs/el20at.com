posted = "2009-02-06"
text = "والدكتور ايهاب دا بقا صايع ومش لاقي شغل وما لقاش غير الهبل ياكل منه عيش<br />قال الدكتور ايهاب رفع توصية<br />جتك خيبه في خبتك"
