subject = "أقراء لروجية جارودى الكاتب الفرنسي"
author = "حسام المصرى"
posted = "2007-05-09"
text = "أستاذ دكتور أسرائيلى عمل بحث موسع فى المدارس الدينية الأسرائيلية للأطفال لنرى كيف يفكر أطفال أسرائيل<br />عن الأساطير العبرية الكثيرة الموجودة فى كتابهم (التلمود) حرق قرى العرب وقتل النساء والأطفال والنبات والحيوان وحتى الهواء كانت ورقة العمل للدكتور تحتوى على كل مالذ وطاب من الأساطير الشيطانية لديهم وكان هناك سؤال واحد موجه للأطفال وهو:<br />هل تئيد حدوث تلك الأفعال فى الفلسطينيين الأن؟<br />أجاب 91% من الأطفال بنعم<br />فيما بعد تم نشر هذة الأحصائية فى أحدى الدوريات العلمية عندهم<br />وحدثت الفضيحة<br />وتم فصل الدكتور من الجامعة بسبب هذة الدراسة"
archived = "2010-03-14"
