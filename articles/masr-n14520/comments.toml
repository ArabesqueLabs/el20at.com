text = "هآآي ..<br />انا ماني عارف ايش اقول انا تعبان عالاخر انا متربي في الخليج لاكن انا فلسطيني الاصل تربيت وكل طفولتي بالخليج طبعا زي ما الكل عارف كيف المراهقة انا بديت بالشذوذ الجنسي وانا اعتبره اكبر عقبة في حياتي الحين انا عمري 19 وانا في الجامعة والعادة السرية يمكن ان تمارس عندي كل شوية لا فرق عندي على حسب الشهوة لاكن انا حابب اقول ان ميولي كلها شذوذ اتمنى امنيتي ان انظر الى اصدقائي نظرة وفاء لا انظر اليهم الا نظرة غدر وشهوة اتمنى ان اعيش طبيعي اكتر مايشغل بالي هو الجنس لا استطيع المذاكرة من التفكير في الجنس الجنس اصبح هوس لدي لا ادري لماذا هادي مشكلة كبيرة وهادا النوع من الجنس منتقد في بلادي اللي اتواجد فيها وهي فلسطين لاكن في الخليج ليست منتقدة مما جعلني افتخر فيها ولاكن لا ادري انا تعبان انا مرهق لا استطيع النوع من غير عادة سرية ممكن امشي احيانا في الشارع ويكون عضوي واضحا للاعمى من شدة الشهوة ولاكن لدي اكثر من مشكلة واتمنى ان تحل هذه المشكلة من اكثر من يعيق حياتي وبناء مستقبلي ..<br />المشكلة الثانية اني متردد دائمة في كل شيء اريد حل ارجوكم انا متعب من كثرة المشاكل<br />ودائما عقلي مشغول"
