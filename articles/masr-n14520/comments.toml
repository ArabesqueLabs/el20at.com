text = "أنا نعرفت على شاب ومن أول يوم عرفته وهو بيقول انه متورط ومحتاج فلوس وطبعا بهبلي انا كنت باسحب من دفتري اللي بابا عملهولي واعطي له الفلوس حتى لما كنا بنخرج مع بعض كنت أنا اللي بادفع حتى فلوس المواصلات ورغم كل ده انا ماشفتش الاستغلال ده لأني كنت بحبه إلى أن تمت الخطوبةوالزواج وفي الفرح انا كنت حاسه اني مش عارفه افرح وكأني حسيت باللي في انتظاري من اول يوم زواج اكتشفت ان زوجي ده ماعندوش حد ينفع يحبه حتى ولو كان الحد ده بيحبه ما لم يكن أمه أو اخواته بمعنى اني كنت باتهان وهو مش بيشوف ده لأن اللي أهانني أمه وأخواته وبالوقت اكتشفت ان اللي ممشي بيتنا هي امه وهو بيحكيلها كل حاجه ومن غير تفكير كلامها لازم يمشي وهي ايضا بتغير مني بمعنى انها بتتجنن لما تعرف انه خرجني ولا لما نزلنا البلد ذهبنا مساءاً لزيارة أهلي فتتمارض واما زوجي يذهب معها للدكتور او كلنا نجلس بجانبها ولا نذهب عند اهلي نفس الشىء يحدث مع زوجة ابنها الآخر المهم انا عندي ولد يعني ماينفعش انهي الزواج لكن اناتعبت ده انا لو تعبت يروح يسألها نذهب للدكتور أم لا وطبعا تقوله لاكي تاخد فلوسه بدلا مني اناوابنه وهي وزوجها ع المعاش ومعاشهم كبير"
