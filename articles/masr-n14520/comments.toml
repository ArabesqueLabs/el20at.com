text = "انا كريم من مصر 22 سنة مريت بتجارب حبمش كتير بس اقدر اققول ان كان منهم حالتين بس هما اللي كانو من طرفين الاولي كنت في سن 19 سنة والتانيه كنت 21 سنة والمره التانيه دية انتهت برضة بالفشل بس مش مني كان الطرف التاني عايز يبقه هو صاحب الراي في كل حاجة يعني من الاخر كده كانت عايزه تبقه هيا الراجل وعلي فكره احنا كنا مخطوبين وطبعا الخطوبه اتفسخت لانها كانت بتعاملني وحش جدا بس المشكله دلوقتي هيا اننا عملنا كل حاجة مع بعض وكنا عايشين شبه حياه زوجية وللاسف دلوقتي بيطاردني شبح والشبح ده هيا بتطاردني في كل مكان كل ما ببص في اي حاجة بفتكرها وافتكر حركاتها وشكلها وردودها انا مش عارف اعمل ايه مش عارف يا تري لو اتجوزت واحدة تانيه هبقه عامل ازاي يا تري هبصلها ازاي هقدر اديها حبي ولا لا هقدر اعشرها ولا لا لان للاسف حتي اللي كان بيحصل بينا بيظهرلي في كل وقت حاسسص اني مش عارف اعيش حياتي مش عشان انا بفكر فيها علي اساس اني لسه بحبها لان هيا ما تستهلش انها تتحب اصلا بس مش عارف اعمل ايه ساعات بيجي عليا وقت بكون عايز اصرخ وببقه عامل زي المجنون وساعات بيجي عليا وقت تاني ببقه عايش حياتي طبيعي ياريت تردوا عليا"
