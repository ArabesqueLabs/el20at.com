text = "انا شب من غزة عمرى 21 وادرس بالجامعة ولاكن اخر 4سنوات من عمرى كانو جحيم والان الامور تتعقد انا ذهبت قبل سنتين لاول طبيب نفسى وحكالى انى بعانى من فصام فى الشخصية لاكن بعد فترة ذهبت لطبيب اخر اثبت انو حالتى وسواس قهرى ولا كن حالتى كما وصفها معقدة وانى بعانى من جميع اشكال الوسواس القهرى لدرجة انى لما بمشى برجع بعيد على خطواتى لاتاكد من انى بمشى صح ولما بشرب اوباكل بضلنى احاول انى اسبت لنفسى انو الاكل انضيف لاكن بكون متاكد انو مش نضيف وصرت احس الحياة كلها مش نضيفة وباى مكان بروحو واى شى بعملو راح اتوسخ وصرت اعيد الكلمات والعبارات كتير وارددها كتير هى نفسها ...اصعب اشى كان على هو انى اتعالج بمستشفى بس فضلت الدواء والجلسات وضليت لفترة طويلة اتعالج وهى سنتين وكان كلو عالفاضى والدكتور حكالى لما خففلى الدواء واطمن على حالتى انى اتعالجت رجعتلى انتكاسة وارجعت اشد من الاول بعد الحرب على غزة......<br />انا مش عارف ارجع اتعالج وانا حاليا محبط من بعد سنتين من العلاج ارجعت من الصفر؟<br />ارجوكو افيدونى عشان حياتى مابتنطاق والله يبعد عنكو شر المرض"
