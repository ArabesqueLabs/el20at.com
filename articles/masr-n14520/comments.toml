text = "بسم الله الرحمن الرحيم<br />تعبت نفسيا وانا ابحث عن طبيب نفساني<br />بصراحه لااعرف من اين ابدأ لذا ارجو منك الرد علي لهذا الموضوع<br />بصراحه ارتبطت مع شخص لي ثلاث سنوات معاه ودايما اقوله اللي بخاطري ومستحيل اخبي عنه شي وصارت علاقتنا كبيرة بالرغم من مشاكلي وضغوطي اللي اواجهه الا اني عطيته كل شي املكه وعطيته كل وقتي فجأة يلعب علي شخص ويفسخ علاقتنا والان احس اني محطمه كليا بالرغم انها المرة الاولى اللي احب فيها انصدمت من طريقة كلامه لي يحتقرني كـأني........وانا الى الان ابغاه واتمنى يرجع بس مافيه امل لاني حاولت ومافيه فايده<br />ماقدرت اتمالك اعصابي لين انفجرت من البكاء وطبعا اهلي مايدرون عن ذا الشي<br />يومي كله في دورة المياه ابكي احس قلبي يعورني<br />والحين بلعت لي حبوب كثيرة وانا جوعانة من الموجودة بالثلاجه ماادري حبوب شنو بس ان شالله تخليني افارق هالهم<br />احس بضيقه ولا احد فاهم اللي فيني غير اني اقضي وقتي بكي<br />تكفى يارب يخليك عطني حل<br />انا ابغاه للحين وهو مايفهم كلامي<br />تكفى امانه عليك<br />ورب خلقني هذا ايميل صديقتي حق صار لي شي قول لها الموضوع<br />ok-150@hotmail.com<br />امانه بذمتك ابي حل<br />تكفى"
