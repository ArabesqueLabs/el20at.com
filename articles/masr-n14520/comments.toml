text = "السلام عليكم ورحمة الله وبركاته انا انسة عندى 31 سنة واحببنى شاب اصغر منى ب7 سنوات من سنة ونص وهو عارف فرق السن ده وانا بعد عنه بسبب كدة بس هو مسمحش بكدة وفعلا رجعت تانى له وانا بحبه قوى وكمان بيحنى قوى واكتر مانا بحبه وعمره ما محسسنى بفرق السن اللى بينا ده ابدا ولا لمح بيه حتى وكأن الموضوع ده مش عادى ومش فرق السن ده كله وشخصيته قويه وفى نفس الوقت طيب وحنين وبيتعامل معايا احباب وبس وبيقولى اهم حاجة الحب وانى بحبك وانتى بتحبينى هو ده المهم عندى وطلب الجواز منى وعرفنى على حاجة خاصه عيلتهم يعنى يعتبر دخلت فى خصوصيات العيلة عن طريق غير مباشر المهم انا قولتله انت تتجوز واحدة اصغر منك وبلاش تظلم نفسك قالى الحب لاقيته معاكى وانا كدة مش بظلم نفسى انا احسن واسعد واحد بيحبك انتى وبالرغم من صغر سنه الا انه كبير العيلة يعنى من اكبر واحد لاصغر واحد بياخد رايه وفى حل المشاكل هو بيكون موجود بس انا ققلقانه من فرق السن ده بعد الجواز مش عارفه اعمل ايه وزى ماحنا عارفين البنت بتكبر بسرعه عن الشاب ارجو الرد على كلامى وكمان فى مشكلة هتواجنا وهى الاهل بس هو قالى ان اهلى واهلك انا هعرف اقنعهم متقلقيش"
