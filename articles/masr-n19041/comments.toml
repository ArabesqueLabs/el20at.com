[[comments]]
order = 0
subject = "الله يرحمه"
author = "حزين"
text = "مات شهيد الواجب--- واجب برضه<br />كان رايح يفتح المعبر------ معبر برضه<br />الغدر كله في حماس --------- وماله يابني<br />والحلاوة كلها في اليهود ----- حلاوة برضه<br />وكان عايز يموت برصاصة اسرائيلي -------- أهي الرصاصة دي سرقاها حماس من اسرائيل -- يعني كله في التمام<br />ياريت بقى نختم بقراءة ما تيسر من بيان خطاب جبهة علماء الأزهر الشريف لروح الظابط الشريف --- اللي مات على الحدود<br />عبوووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووود"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235900/http://masr.20at.com:80/newArticle.php?sid=19041"

[[comments]]
order = 1
subject = "الى روح شهيد مصر البطل(ياسر)"
author = "ممدوح زكى زحارى جرجس_الاسكندرية-مصر"
text = "ايها الشهيد<br />روحك و دمك لن يذهبوا هباء<br />اسرائيل سوف تنتقم لدمك المسكوب من الحثالة ابناء (حماس)<br />انك فى رحاب اللة فانعم بالجنة و النعيم ايها البطل<br />مصر كلها (ياسر)الشهيد البطل<br />كلنا (ياسر)سواء كنا مسلمين او مسحيين"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235900/http://masr.20at.com:80/newArticle.php?sid=19041"
