[[comments]]
order = 1
subject = "الاخوان المسلمين يسمون عام 1928 عام الفيل الصغير ل"
author = "مش ناقص"
posted = "2008-06-24"
text = "اقرؤوا الفقره دي من موقع اخوان اون لاين<br />** العبد الفقير إلى الله علي نويتو من مواليد عام الفيل الصغير وإن شئت قل عام 1928م ميلاد دعوة الإخوان المسلمين،<br />ودا معناه تكفير المجتمع<br />زي ما قال مرشدهم حسن البنا عندما سما المولود الجديد بالاخوان المسلمين<br />وكنتم على شفا حفرة من النار فانقذكم منها فاصبحتم بنعمته اخوانا<br />فاهمين الكلام<br />وكنتم على شفا حفرة من النار فانقذكم منها فاصبحتم بنعمته اخوانا<br />يعني اللي دخل الاخوان قد نجا من النار<br />يعني شبهه دعوة الاخوان بدعوة النبي محمد اللي يدخل فيها نجا واللي ما دخلش فيها هلك<br />وقد افتى اعتى علماء اهل السنه والجماعة بأن جماعة الاخوان المسلمين هم خوارج هذه الامة فلا تنخدعوا بشوية البلطجية بتوع الانتخابات دول"
archived = "2010-03-14"
capture_url = ""

