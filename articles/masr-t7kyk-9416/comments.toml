[[comments]]
order = 3
subject = "ولكن مرغوب ومرغوب جدا من قبل الله،"
author = "مش عبدالله الطحاوي ولا احمد ال"
posted = "2008-06-24"
text = "يا عم دويتو لا تزكوا انفسكم وما تفرحش بنفسك اوي كده بص شوف ربنا بيقول ايه في القران<br />تفسير قوله تعالى ( فلا تزكوا انفسكم هو اعلم بمن اتقى ).<br />قال ابن كثير رحمه الله عند تفسيره هذه الاية فلا تزكوا انفسكم اى تمدحوها او تشكروها وتمنوا باعمالكم هو اعلم بمن اتقى كما قال تعالى : الم ترى الى الذين يزكون انفسهم بل الله يزكى من يشاء ولا يظلمون فتيلا \\\".<br />قال ابن عاشور رحمه الله تعالى:<br />( فَلا تُزَكُّوا أَنفُسَكُمْ ) تحذير للمؤمنين من العُجب بأعمالهم الحسنة عُجباً يُحدثه المرء في نفسه أو يُدخله أحد على غيره بالثاء عليه بعمله ..."
archived = "2010-03-14"
capture_url = ""
