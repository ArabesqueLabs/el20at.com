[[comments]]
order = 3
subject = "اكثر من رائع"
author = "ريما"
posted = "2007-11-12"
text = "فعلا مقال اكثر من رائع... و لفت انتباهي اني انا من هدول الناس... يعني انا ديما بستحي اجادل بالفلوس مع اني احيانا بكون عارفة انوعم بينصب علي... لاني كنت بستحي .. بس هلا انتبهت اني بطريقة غير مقصودة عم بشجع النصب.. يعني الموضوع مش شغلة مصاري ازيادة بدفعهم و خلص... بس من هلا بوعد نفسي ما اسكت على حقي..<br />و شكر"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112212457/http://masr.20at.com:80/newArticle.php?sid=12387"

