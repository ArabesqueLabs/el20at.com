order = 0
subject = "ضع عنوان التعليق"
author = "مهاب"
posted = "2007-11-11"
text = "انا كنت بدفع مخالفات المرور اللى بتيجى على العربيه وانافى اغالب معفش عنها حاجه لقيت امام شباك الخزينة كل واحد مطلع جنيه فوق قيمه المخالفه واى حد يسأل عن السبب يقول اللى بعده وعلى فكره انا الوحيد اللى سألت و فعلا الناس وقفت مع الصراف مش معايا مع انه بيسرقهم ولماتقصيت عن الحكايه عرفت ان قيمه الحيله اليوميه فى حدود300 جنيه حقيقى الشعب ده يموت فى اللى يسرقه فى مقوله بتقول لبنان اللى محليها اهلها وانا بقول مصر اللى موحشها برضه اهلها اللى ملهموش علاقه بالمصريين الحقيقين اللى بنقرأه عليهم فى الكتب صحيح نظام خاى الناس تستعزب الزل و المهاتة 0"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112212457/http://masr.20at.com:80/newArticle.php?sid=12387"

