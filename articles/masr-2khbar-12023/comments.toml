text = "1صحافيون يعاونون خنازير المهجر<br />- ا/ هانى الجزيرى / رئيس جبهة المليون<br />2-ا / عزت ابراهيم / ناشط حقوقى / ومدون<br />3- اشرف فرج محمد الصحفي<br />4- الدكتور حلمي جرجس رئيس هيئة اقباط المملكة المتحدة<br />5- ايهاب عزيز منظمة الصداقة القبطية الامريكية<br />6- ماري عطيه رئيس رابطة المرأة و الاسرة بالنمسا<br />7- ناجي وليم جريدة المشاهير<br />8- مايكل فارس جريدة صوت الامة<br />9- جمال جورج الكاتب الصحفي بجريدة اليوم السابع<br />10- شريف رمزي الباحث و المفكر بجريدة الكتيبة الطيبية<br />11- ا. صفاء ابو الحسن نائب رئيس المنظمة<br />12- ا. حسن اسماعيل الامين العام لمنظمة الاتحاد المصري لحقوق الانسان<br />13- مروة صالح المحامية و المدير التنفيذي لمنظمة الاتحاد المصري لحقوق الانسان<br />14- جوزيف فكري الكاتب الصحفي بمجلة الكواكب و الغد<br />15- ا. حسن عبد الفتاح عضو منظمة حقوق الانسان<br />16- هاني سمير جريدة الدستور"
