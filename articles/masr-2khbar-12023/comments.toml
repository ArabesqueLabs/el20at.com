author = "خنازير المهجر"
posted = "2009-05-11"
text = "العمليات دي تنظيم وتخطيط خنازير المهجر بالتعاون والاتفاق مع الموساد الاسرائيلي<br />الى كل قبطي شريف احذروا خنازير المهجر واعوانهم<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />نجيب جبرائيل رئيس منظمة \"الاتحاد المصري لحقوق الإنسان\"،<br />ونادر فوزي رئيس منظمة \"مسيحيي الشرق الأوسط\"،<br />وحلمي جرجس رئيس منظمة أقباط المملكة المتحدة<br />وبهاء رمزي رئيس الهيئة القبطية الهولندية<br />ونبيل عبد الملك، رئيس المنظمة المصرية الكندية لحقوق الإنسان،<br />ووديع فهمي منظمة أقباط النمسا<br />وخيري مالك رئيس جمعية الصداقة القبطية الأمريكية.<br />بيتر ميخائيل \"هيئة الشاب القبطي الأسترالي\"،<br />وكمال عبد النور رئيس \"منظمة اندماج وصداقة أقباط النمسا\"،<br />ونسيم كامل شحاتة \"هيئة الشاب القبطي الفرنسي\"،<br />وصبحي جرجس \"رئيس جمعية الصداقة القبطية بفرنسا\"،<br />ورمسيس شحاتة رئيس \"منظمة اندماج وصداقة أقباط ألمانيا\".<br />منظمة \"الأقباط متحدون\" التي يرأسها الوسخ عدلي أبادير،<br />و\"التجمع القبطي الأمريكي\" الذي يرأسه كميل حليم،<br />و\"الهيئة القبطية الكندية\" برئاسة سليم نجيب،<br />موريس صادق وعلي أبغدير،"
