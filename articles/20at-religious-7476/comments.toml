[[comments]]
order = 1
subject = "الناس دي تعبانة بدماغها"
author = "زكريا الدرديري"
posted = "2007-11-01"
text = "يا اخواننا مالكو فيه ايه بس ماتروقوا كدة .. ما طول عمر المساجد من أيام الرسول صلى الله عليه وسلم وبيصلي فيها الستات والرجالة.. ومين قال ان المساجد دلوقتي بتتعمل للرجالة بس عشان يبقى فيه مساجد للستات ؟ اذا كان هو ربنا أساساً ماعملش فرق بيت الراجل والست في العبادة والفرائض هاتيجو انتوا تقسموها بمزاجكو؟ \"أهم يقسمون رحمة ربك.. نحن قسمنا بينهم معيشتهم في الحياة الدنيا\" ربنا يهدي الجميع .. ويجعله عامر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "المسجد"
author = "عبد الله"
posted = "2007-11-23"
text = "أصل الصلاه فى المسجد هو للرجال وأصل الصلاه للنساء فى بيتهن ولايعنى ذلك ان المرأه لاتذهب للمسجد بل سمح لها الأسلام بالذهاب للمسجد وحضور الدروس الدينيه الخاصه بها فى المسجد وأنا أختلف مع الأخت الكريمه فى ان يكون هناك مسجد للنساء او مسجد للرجال بل المسجد لجميع المسلمين ذكورا واناثا والله الموفق"
archived = "2010-03-14"
