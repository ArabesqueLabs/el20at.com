[[comments]]
order = 0
subject = "لا"
author = "حمدى"
text = "انا مع السعودية<br />لا لانسحاب الامريكان من العراق<br />واللهى لو حصل السنة هناك هتتقتل وتختفى<br />خليكم يامريكان ياعسل انتم<br />واللهى الواحد لما يشوف شكلكم ونضافتكم بيتف على نفسة وكل اللى يعرفهم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "صبرا يا عراق"
author = "M.S"
text = "حمدي شدتحجي انت !!!اصلا امريكا هي السبب بكل الخلافات بين السنه والشيعه و احنا العراقيين معظمنا نريد الامريكان يطلعون وللعلم اصلا قبل الحرب ما كنا نعرف شنو سني وشنو شيعي وكنا عايشين بامان وعهد صدام احسن من هسى ...والله يسامح كل مسلم وقف مع الامريكان ..((حقك حمدي لان انت ماتعرف الامريكان بيعملوا ايه بالعراق))"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "السعودية ومصر عنوان القوة"
author = "سلمان بن صالح الشادي"
text = "الله ينصر السنة في العراق<br />ودائماً السعودية سباقة إلى دعم المسلمين في العالم أجمع<br />لك منا الشكر يا السعودية ونتمنى دعم جميع الدول الإسلامية للعراق وخاصة الدول الكبرى في العالم الإسلامي<br />وخاصة مصر والسعودية اللتان هما الشريان المغذي للأمة الإسلامية<br />فنتمنى دعم مصر كما دعم السعودية وكذلك جميع الدول الإسلامية<br />فللحقيقة :<br />لو اتحدت مصر والسعودية وباكستان وسوريا<br />لسيطروا على العالم أجمع<br />وهذا املنا<br />والأمل بالله كبير<br />سلمان بن صالح الشادي ـ سلطنة عمان"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الحاضر الغائب"
author = "سيد وحيد"
text = "الشوكه ليس لهاتاسير فى الحصان الجامح ولكن على مر الزمن تستطيع ان تجعله هزيل يكاد ان يتخطفه الموت فامضى فى طريقك لعل الله ان يجعل من الضعف قوة لايستهان بها اللهم قوى العرب على اعدائهم وبارك لنا فيمن يجاهد فى رفع رايه الاسلام والمسلمين وبارك لنا فى السعوديه ومصر لدعم الامه والمسلمين"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "احلى نكته سمعتها"
author = "بيدو"
text = "لا حول ولا قوة الا بالله<br />بجدا والله يعنى امريكا من وجهة النظر السعوديه هى الراعى الاول للسلام فى العراق وهم اللى بيحمو السنه من الشيعه<br />ومش عايزة تخلى امريكا تمشى من العراق بجد دى احلى نكته سمعتها من زمان<br />انا فتكرت مسرحية العالمة باشا وسهير البابلى رجعه لمصر تانى بعد معرفة ان الرساله وصلتها غلط ورايس ديون السعوديه اقصد دولة ذنبو على جنبو ماسك فى ديل الفستان وبيقلها ابوس رجلك ما تمشى"
archived = "2010-03-14"
capture_url = ""
