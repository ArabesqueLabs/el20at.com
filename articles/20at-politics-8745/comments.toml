subject = "الهجرة حل لخروج من ازمة"
author = "سلمى"
posted = "2008-05-03"
text = "الهجرة في لبنان هي حل شو عم تقدم الدولة من 1975 الى 2008 نفس الاشخاص نفس التوارث على الكراسي العالم ما تعلمت من الحرب الطائفية السوال لماذا هذا التقاتل والتنافر شو ذنب الناس بيكفي حرب اهلية وحرب طائفية وكلامية نحن من عاني من مشكلة عدم لانتماء للوطن لو يتركونا السياسيين نعيش بي امان خلص اذا بدك تتعلم او تشتغل او تحلم بي ببكرا ما بخلوك لونو البلد بي الالوان صار بين الشارع والشارع في اشارات عبارات حواجز يافطات شو هيدا انا بكره الحرب لاني عشتا هجرتلي اخواتي وخسرتن وانا هلق بي حاجة الهم شو بيهموني كلنا حرام البلد بيكفي"
archived = "2010-03-14"
