text = "السر كلة فى اوباما فى نظرى اوباما بيحاول يحبب الناس فى امريكا ويحسن صورتها مع الضغط الهائل من الكيان اليهودى الكاره للعرب بيعمل اشياء لا يريد عملها انما تفرضه علية الظروف"
