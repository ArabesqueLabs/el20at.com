[[comments]]
order = 0
subject = "محطة توليد الكهرباء النووية تحتاج الى عشر سنوات من"
author = "بتاع نوى بلح"
posted = "2009-01-22"
text = "يعنى اذا ابتدأ العمل فى عام 2012 سينتهى التركيب وبدأ التشغيل فى فى عام 2022<br />الاساسات الخرسانية محتاجة 6 سنوات على الاقل لعمل قواعد التوربينات البخارية والمفاعل ودورة تبريد المفاعل وتكثيف البخار<br />هذا اذا كانت الامور تمشى زى الساعة من ناحية توفير الفلوس والميزانية وليست هناك ضغوط سياسية<br />وانا اشك فى التنفيذ<br />والفترة التى كانت مناسبة هى فترة الرئيس عبد الناصر حيث كان هناك روسيا تساند وتمنع الضغوط الغربية ولكن الرجل كان مشغول ببناء السد العالى<br />وايا كان الوضع فلا بد ان نبدأ<br />لان تكلفة الطاقة مستقبلا ستكون عالية جدا"
archived = "2010-03-14"
