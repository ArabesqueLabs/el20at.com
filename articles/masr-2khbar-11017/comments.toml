[[comments]]
order = 1
subject = "اللة     احد"
author = "من كتاب الدكتور نديم السيار"
posted = "2009-01-22"
text = "قل هو اللة احد -------------الاخلاص1<br />هذا ما نزل بة جبريل للنبى محمد<br />وهكذا ايضا قال نفس الملاك للنبى ادريس<br />قل هو اللة احد<br />فقال ادريس<br />وقالها معة المصريون منذ اكثر من 7000 سنة<br />فكان اولئك المصريون القدماء اول من قال قل هو اللة احد<br />ولفظ واحد فى المصرية القديمة هو وع<br />ويخفف نطقة فى بعض اللهجات الى وا<br />ومعنى الربوبية كانوا يعبرون عنة باللفظ نب ويعنى رب او سيد<br />وهو فى اللغة القبطية نب بنفس المعنى<br />ولقد كان المصريون القدماء يطلقون هذا اللفظ كصفة على اللة الواحد<br />ففى قاموس د- بدوى وكيس ان ( وع نب ) تعنى الرب الاحد -- اللة الواحد الاحد<br />هذا ما جاء فى القاموس بالحرف<br />د<br />بسم اللة الرحمن الرحيم<br />قل هو اللة احد - اللة الصمد - لم يلد ولم يولد - ولم يكن لة كفوا احد<br />صدق اللة العظيم<br />لهذا اسلمنا نحن المصريون"
archived = "2010-03-14"
capture_url = ""
