[[comments]]
order = 1
subject = "حضرت الصالون اليوم ده"
author = "محمد ممتاز - بيبو"
text = "حضرت الصالون اليوم ده و فعلا الرابج ده رائع بمعنى الكلمة كمية ثقافة هايلة جدا و اجابته على الاسئلة بتدل على احترافه الشديد جدا بالادب بوجه عام و بالنوعية الجميلة اللى هو بيكتبها لدرجة انا عمرى ما انبهرت باى كاتب حضرته زى انبهارى لالدكتور علاء اسوانى<br />فعلا شكرا لعشرينات على الاستضافة الجميلة دى و شكر خاص جدا جدا لدعاء الشامى اللى بصراحة اول مشفتها لحظت فى عيمينها بريق من نوع خاص و هو بريق التحدى انا مش هاطول عليكم والى مزيد من النجاح يا عشرينات<br />و ارجو خلال الايام اللى جاية استضافة حسام البدرى مدرب النادى الاهلى ان امكن و شكرا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120322/http://masr.20at.com:80/newArticle.php?sid=10387"

[[comments]]
order = 2
subject = "عادي"
author = "عبدالله مفتاح"
text = "حضرت ....عادي حرفيه في الرد اه<br />ثقافه ممكن<br />لكن انبهر بيه؟؟<br />خالص عادي جدا شخصيه عادية<br />طبعا شكرا عشرينات على حسن الاستضافه والى الامام دائما"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120322/http://masr.20at.com:80/newArticle.php?sid=10387"

