[[comments]]
order = 0
subject = "الراجل ده رااااائع"
author = "لور دكاش"
text = "د. علاء الأسواني ده واحد من أفضل الكتاب اللي قريت لهم في حياتي، وراجل محترم جدا جدا جدا.. برافو يا عشرينات على اختياركم ليه كأول ضيف في صالونكم"
archived = "2007-10-16"
