subject = "وليه لأ"
posted = "2008-01-15"
text = "اي حاجه بتبدأ هبل وعبط وبعدين بتبقى ليها قواعد<br />يعني مثلا اللغة (أي لغة) الناس بتتكلمها الاول وبعد كده يعملولها قواعد<br />اللغة العربية كان العرب يتكلمون اللغة العربية وبعدين نزل القران وابو الاسود الدؤلي وضع قواعد اللغة العربية<br />وتعالوا شوفوا الكراتيه والجودو اخدوها من صراع الاسود والنمور وبعدين عرفوا قواعدها من الاسود والنمور ولعبوها البشر<br />وكل الالعاب مثل كرة القدم الناس لعبتها الاول وبعدين حطولها قواعد<br />وبصرف النظر عن ان الرقص الشرقي حرام شرعا امام الناس ولكن ممكن يكون ليه قواعد"
archived = "2008-01-17"
