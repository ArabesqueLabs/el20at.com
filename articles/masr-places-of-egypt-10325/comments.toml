[[comments]]
order = 6
subject = "إلى الأسيوطي بيه"
author = "بلاش عقد نفسية"
text = "ممكن نقرا أي تعليق انما قلة الأدب ولعن الميتين دي تدخل ضمن آفات اللسان ن وهذا حرام شرعاً ، تقدر تشيل ذنبك يا أسيوطي بيه وتلعن ميتين الدنيا كلها ، لكن لو سمحت بلاش تؤذينا ونشوف مواهبك الرائعة وقدرتك العظيمة انك تكون سليط اللسان ، عامة انا مش عارف انت كاره الاسم ليه ؟<br />ممكن يكون لك حق في الزعل من الموضوع لو خدته كرامتك كراجل ومش هتقدر تعاكس وتتحرش بعد كدة ، يعني لو الفكرة انتشرت.<br />انما الاسم بقى فانا اطلب من حضرتك توضيح مدى العداء اللي بتكنه للمسكينة فادية ، أنا شخصياً بأرجح انها تكون فرقعتك وادتك بومبة كبيرةةةةةةةةةةةةة طلعت من نافوخك ولا مؤاخذة"
archived = "2008-10-25"
capture_url = "https://web.archive.org/web/20081025201021/http://masr.20at.com:80/newArticle.php?sid=18017"

