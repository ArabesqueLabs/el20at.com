[[comments]]
order = 8
subject = "الكافيه البناتي مرتع للسحاقيات"
text = "عند فصل الجنسين عن بعض تظهر جريمتي<br />1) اللواط<br />2) السحاق<br />وقبل كده قلنا هذا الكلام في موضوع عن شواطىء خاصة بالنساء<br />متهيألي تحرش الرجل بالمرأة افضل بكثير من تحرش المرأة بالمرأة والرجل بالرجل"
archived = "2008-10-25"
capture_url = "https://web.archive.org/web/20081025201021/http://masr.20at.com:80/newArticle.php?sid=18017"

[[comments]]
order = 9
subject = "برضو الاسيوطي"
author = "وراكي وراكي والزمن طويل واهبل يا فادية"
text = "يلعن ميتين اسمك تانى انا مش فاهم بصراحه الست والدتك وهى حبلى كانت بتتوحم يعني على الاسم ده ولا ايه لا والغريب ان ابوكي اسمه عبود فاكر نفسه الناظر عبود عبود ايه الهبل ووجع البطن ده انا كل ما بقرا اسمك بحس انى عايز اv[u ع اللي في بطني جتك داهيه في هبلك وهبل امك ده انتي عيلة عار على الموقع ايه الاسامي الوسخه دي بس يا رب"
archived = "2008-10-25"
capture_url = "https://web.archive.org/web/20081025201021/http://masr.20at.com:80/newArticle.php?sid=18017"

[[comments]]
order = 10
subject = "ليس من الاسلام يا عشرينيات"
author = "أم محمد"
text = "ليس من الاسلام يا عشرينات أن تسمحوا بكل تعليق بالنشر ، فتعليق المدعو الاسيوطي حقير ولا يستحق أن نقرأه ، لانها مسبة علينة لمسلمة وميتين لها ,, اتقوا الله ، أنا لا أألومه فالحرقاء كثير وانما أولموكم ، يعني يستطيع اي حاقد أن يكتب مسبة في الدين أو صحابي أو غيره وينشر لديكم بحجة حرية التعبير وشرف المسلمين لا يقل عن هذا ..اتقوا الله"
archived = "2008-10-25"
capture_url = "https://web.archive.org/web/20081025201021/http://masr.20at.com:80/newArticle.php?sid=18017"

[[comments]]
order = 11
subject = "الى الاسيوطي"
author = "مش مش"
text = "يلعن ميتين اسمك الاسيوطي تانى انا مش فاهم بصراحه الست والدتك وهى حبلى كانت بتتوحم يعني على الاسم ده ولا ايه لا والغريب ان ابوك اسمه السوهاجي فاكر نفسه الناظر السوهاجي ايه الهبل ووجع البطن ده انا كل ما بقرا اسمك الاسيوطي بحس انى عايز اشخ اللي في بطني جتك داهيه في هبلك وهبل امك دا انت معلق عار على الموقع ايه الاسامي الوسخه دي قال اسيوطي قال جتك القرف"
archived = "2008-10-25"
capture_url = "https://web.archive.org/web/20081025201021/http://masr.20at.com:80/newArticle.php?sid=18017"
