subject = "يوم الجمعة يوم الغضب من اجل غزة"
author = "bakryhasan"
posted = "2008-11-22"
text = "يوم الجمعة يوم الغضب من اجل غزة<br />هل تعلم ايها الشقيق في اي قطر عربي ان اخواننا في هذا اليوم الذي نأكل فيها ونأتي زوجاتنا ونلاعب اطفالنا يموتون من الجوع.اتدري يا حفيد رسول الله صلي الله عليه وسلم ان اخوانك احفاد محمد صلي الله عليه وسلم يقتلهم الصهاينة اليوم جوعا وعطشا في غزة.اتدري ان جدكم محمد صلي الله عليه وسلم يري ويسمع ما يحدث اليوم.ايها المسلمون في كل انحاء العالم غزة تموت ونحن نلعب ونمرح ونذهب الي الاسواق.يا احفاد رسول الله صلي الله عليه وسلم.الخير فينا وفي امة محمد صلي الله عليه وسلم.هكذا قال الحق صدق الله العظيم.الخير فينا الي يوم القيامة.ومن يقول لك غير ذلك فقل له هاتوا برهانكم ان كنتم صادقين.هكذا اخبرنا الحق ان الخير فينا وفي امة هذا النبي الكريم.يا كل بني آدم كريم شريف علي هذة الارض.انا لا نرضي لك إلا كل الخير فهل ترضي غير ما نرضاه لك.لم نكن يوم دعاة حرب.لقد ارسل جدنا صلي الله عليه وسلم رحمة للناس وهدي وبشري.والله يعلم انا نحن المسلمون دعاة خير.هكذا علمنا من اتي رحمة للعالمين.نحن احفاد محمد صلي الله عليه وسلم من وصفه ربه بصاحب الخلق العظيم.ان هذا الدين قائم علي الاحسان للناس والرحمة بهم والعفو عند المقدرة.وكل خلق كريم فيه فائدة للخلق اجمعين.ان اهلنا في غزة .اخواننا في غزة جزء منا.اخوة لنا في غزة يقتلون.ادعوكم بدعوة الحق.ان انقذوا اخوة لنا يمنع عنهم ما يقيم حياتهم.ان هذة دعوة لكل من يسمع بها.فلنفعل لاخواننا في غزة اضعف الايمان.فليكن هذا من اجل احفاد رسول صلي الله عليه وسلم في غزة المنكوبة.فليكن هذا من اجل الانسانية التي اتاها هذا النبي الكريم بالخير والعفو والرحمة.فليكن يوم الجمعة يوم الغضب من اجل غزة.فلنكن علي قلب رجل واحد.لعمري لو علم الصهاينة منا موقف جد.لتراجعوا وهم صاغرين.يا احفاد محمد صلي الله عليه وسلم.يا اتباع هذا النبي الكريم.الغضب لله.الغضب لله.الغضب لله.اسألكم الله ألا نكون شر الدواب.الذين يعلمون ان اخوة لهم يموتون جوعا ولا يهتمون.حتي لا نكون من النادمين.يا اتباع محمد.يا احفاد محمد.يا احباب محمد.يا كل من انصفه هذا النبي الكريم صلي الله عليه وسلم.اغضبوا لله.اغضبوا للحق.ان غزة تموت.يا دعاة الخير يا شيوخ الاسلام.الغضب الغضب لله.من لا يغضب لله حين ما يستدعي الغضب.كيف يرجو رحمة ربه. من لا يهتم بامور المسلمين ليس منهم.فلنجعل يوم الجمعة القادم يوم الغضب لله ورسوله ولانسانية البشر.فليكن يوم الجمعة القادم موعدنا جميعا في كل ساحات الوطن العربي.فلنجعله يوم غضب من اجل اخوة لنا في هم وغم عظيم.لا خير فينا ان لم نفعله.اللهم اجعلنا جميعا علي قلب رجل واحد.اللهم وحد صفنا.وانزل علينا رحمتك يا رب العالمين"
