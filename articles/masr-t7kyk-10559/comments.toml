subject = "ابو حصيرة مين ؟ هاتوا اثبات ان ابو حصيرة مات فى ال"
author = "مش فاكر"
posted = "2008-11-20"
text = "البداية كانت مقبرة مهجورة لا تتعدى خمسة امتار فى خمسة امتار<br />تراخى الحكومة وضعفها امام اسرائيل توسعت بالتدريج واصبحت تتوسع سنويا والحكومة اذن من طين واخرى من عجين ولا كان المكان دة تبعها<br />بعد قليل ستتحول القرية كلها الى مزار يهودى<br />وسيتم تحصينها ضد الارهابيين بعمل اسوار وخنادق والغام وتتحول الى مستعمرة اسرائيلية اسمها ياميت دمنوة<br />مين اللى قال ان فية واحد يهودى مات هنا<br />فين الاثبات<br />واذا جابوا الاثبات يبقوا يشيلوا الرفات بتاعتة الى اسرائيل<br />الحكاية هى ضعف وخوف نظام من اسرائيل<br />على فكرة اسرائيل بتزيل مقابر فيها قبور بعض الصحابة من القدس العربية لتعمل حديقة عامة فوق القبور ونحن نعطيهم ارض ليعملوا فندق اسرائيلى<br />اة يا ايام النحس والنكد"
