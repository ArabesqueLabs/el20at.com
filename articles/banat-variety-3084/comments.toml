text = "مره بكلم واحده زميلتي … بس النمره كنت فاكرها بالشبه , فإتصلت مره و إتنين مارضتش .. فبعت لها sms قلت لها أنا أحمد و عاوز منك الورق بتاع الماده الفلانيه .<<<< لغاية كده كله تمااام>;>;>;>;>;>;<br />شويه و لقيت النمره إلي كلمتها إتصلت.<br />البنت : أيوه مين معايا<br />أنا : أنا أحمد<br />البنت : أحمد مين<br />أنا : مش إنتي سالي برضه !<br />البنت : لا<br />البنت : بس ممكن أبقي سالي<br />أنا : آآآآآآآه إنتي منهم , طاب شكراً جداً , لموئخزه النمره غلط يا … سالي<br />و للأسف الشديد كانت النمره إلي أنا كلمتها في الأول غلط"
