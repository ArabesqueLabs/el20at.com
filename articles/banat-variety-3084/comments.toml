posted = "2008-08-10"
text = "لو المعاكسه اعجاب لماذا تعاكس بدل من واحده بتعاكس 75مره فى الساعه انا تزوجت بطريقة المعاكسه بس مشيت وراها لحد المنزل بتاعها وتانى يوم دخلت البيت من بابه واهلها احترمونى جدا والحمد لله انا سعيد اى نعم الشباب يحب الجمال واما عن معاكسة المحتشمه التى لا تظهر اى شىء من جمالها يعتقدون انها اجمل من الظاهر مفاتنها لانها غاليه لاتعرض نفسها برخص للشباب وعن القبيحه فلكل ساقطة لاقطه فرايى ان تدخل البيت من بابه والا ستطحتم امالك فلا تعاكس من الافضل لك ولا ترفع الامال ولا تبادل الثقه فى الفتيات لانه لايوجد اى وجه من الافاده من ذالك ذنوب وخلاص"
