subject = ""
author = "اتقوا الله"
posted = "2007-01-21"
text = "لا طبعا يا هبه انتي ويسر..المعاكسات دي بتبقى حاجة غبية جدا..أكتر حاجة بتضايقني ومبتحسسنيش بالأمان اني اتعاكس<br />لي واحدة صاحبتي بتحب جدا انها تتعاكس..و بتبقى مزهوة بنفسها جدا و فرحانة بكده..لكن معرفش ليه انا بقرف جدا جدا من المعاكسات ..يا هبه يعني مقابلتيش واحدة محترمة بترفض المعاكسة ؟؟ كلهم فرحانين اوي بيها معقول يا جماعة ..مش نتقي ربنا في اللي بيتعرض..يعني انتو كده بتشجعوا الشباب على انهم يعاكسوا البنات<br />يا ناس اتقوا ربنا انتو بتقولوا لهم البنات مبسوطة من المعاكسة …زودوا المعاكسات حبه"
archived = "2011-07-06"
capture_url = "https://web.archive.org/web/20110706135425/http://www.20at.com/banat/variety/3084-2009-11-04-14-17-32.html"

[[comments]]
order = 3
subject = ""
author = "جيل النصر المنشود"
posted = "2007-01-21"
text = "نعم اخواني واخواتي في الله ان مصدر عزتنا وثقتنا في انفسنا تنبع فقط فقط اخواتي من ايماننا وتمسكنا بثوابت ذللك الدين الحنيف..اما المعاكسات للاسف اخواتي فهذا فعل لا يرضاة الله ولا رسوله الكريم صلي الله عليه وسلم ..وأذكر اخواتي التي تستشعر بالثقة في نفسها عندما يعاكسها احد اقول لها مقوله جدها الفاروق سيدنا عمر بن الخطاب حينما قال نحن قوم اعزنا الله بالاسلام فمن اراد العزة في غيرة اذله الله..نعم اخواني ان ثقتنا في انفسنا تاتي فقط من تقربنا الي الله..ولسن حالنا يقول عزي ايماني لفظي قراني وسلوكي ادب رب رباني الصدق شعاري في كل اموري لا ايرضي ابدا بالزور ضميري..نسئل الله ان يجعلنا من الذين يعتزون بدينهم وان يرضي الله عنا جميعا"
archived = "2011-07-06"
capture_url = "https://web.archive.org/web/20110706135425/http://www.20at.com/banat/variety/3084-2009-11-04-14-17-32.html"

