text = "انا مش عارف عن البنات الي بقولو تقة بنفسم عن طريق المعاكسة يعني صحيح انتي بدك شهدة واحد صايع مش مربي يقول عنط حلوة ؟؟ وبعدين الشب الي بعاكس في البنت يعني بدوش يعاكس كل وحدة في طريقوا وازا البنت بتوخد في كلاموا انها حلوة وجميله بتكون معدها شخيصية ونفسيتها مش عبعضا واقسم بالله انوا اغلب الشباب مقرفين بمعني الكلمة وصقايط وهمل عشان هيك بفش الخلل الي في عقلو في البنات والله يعين البنات"
