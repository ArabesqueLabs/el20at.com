text = "كثيرا من البنات يحبوا انهم يبقو واكلين الجو ولافتين الانتباه والانظار الا من ارتضى الله من عباده فهم بذلك يعرضو اجسامهم الرخيصه على انها سلعه فننظر نحن معشر الشباب الى اجسام هؤلاء واؤلائك ونبدى الرئى او العجب او نظهر الدهشه<br />اقول ان الذنب ذنب الاءباء والامهات ففى عصر كعصرنا هذا الرجل الذى عنده بنت حلوه على وش جواز بيبقى طالع بيها السما وكائنهابميت راجل والبنت بتلبس عالموضه بتاعت الغرب لتثير الانتباه وابوها بيشجعها على كده عشان تطلع تصطادله زبون غلبان اباء معندهاش نخوه"
