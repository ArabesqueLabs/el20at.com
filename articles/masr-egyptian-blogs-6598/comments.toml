subject = "بلكونة حبنا"
author = "ابو الدقماق"
posted = "2007-07-08"
text = "البنت سوسة المفروسة بالف راجل من الرجالة المسخرة بتوع دلوقتى<br />بنت بتقول الحق ومش بتنافق علشان سفرية على طيارة الرياسة مع حزنبل القرن العشرين ويلهط ويريل فى خيمة معاة فى رحلة للخليج<br />بس ياسوسة قصر القبة مفيش فية بلكونات صحيح انما فية جبار يبطش بالطغاة والمفترين وولاد الحرام اللى خربوا البلد ونشروا الامراض<br />انما حزب وداد جلبى يا بوى فدا حزب الشيطان بتاع ماما غولة اللى كانت ايام سيدنا سليمان"
archived = "2010-03-14"
