[[comments]]
order = 1
subject = "و هى سوووووسه يا بشر"
author = "نيفين نيفى نوفا"
posted = "2007-07-10"
text = "و الله يا سوسه انتى زى السكر و دماغك متكلفه يا بنتى و ضحكتينا ف ايبام مفيهاش حاجه تضحك<br />الموضوع هاااااايل و السيجمنت الخامس بتاع البلكونه ملوش حل بجد<br />تسلمن ايديكى يا سوسه"
archived = "2010-03-14"
