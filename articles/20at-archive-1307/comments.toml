subject = "الم يأن لنا أن نفرق بين السياسة والواقع"
author = "مسلم"
posted = "2009-01-01"
text = "نلاحظ دائما في بعض المواقع هجوما محموما على رموز الحكم في السعودية ، علما أننا كمسلمين من أهل السنة والجماعة ، في معظم أقطار الأرض ندين بعد الله عز وجل للحكومة السعودية في نشر رسالة الإسلام والتوحيد ومنهج أهل السنة والجماعة في أصقاع الأرض ، كما ندين في ذلك لبعض المؤسسات الشرعية السنية في بعض الدول العربية ، كقطر والكويت ، والأزهر ن وبعض المؤسسات الشرعية الأخرى العاملة في مجال الدعوة والإغاثة .<br />لكن الحكومة السعودية يديرها بعض البشر يخطئون ويصيبون في ما قد تقتضيه الحاجة في السياسة العالمية والمحلية ، ولكنهم في مجتمعهم يطبقون أصل الدين ،وتطبع عندهم وبأموالهم كتب أهل السنة .<br />أمراؤهم ، أغنيائهم ، علمائهم ، فطرتهم جبلت على منهج أهل السنة والجماعة ، وقد يشذ شاذ من الأمراء او الأغنياء او حتى العلماء والشاذ عن الجماعة لاعبرة له ، وشره يقع عليه والحماعة منه براء .<br />أيها الحاقد على الدين وملة الإسلام ، هون عليك وأحتفظ بما يغلي به صدرك فإن المملكة العربية السعودية على مافيها من شر ، فشرها أطيب من خيرك ، وخيرها لست أنت ولا من هو على شاكلتك بأهل له .<br />فخير هذا البلاد الطيبة كثير ولله الحمد والمنة وكله من عند الله جل في علاه ، فقد وفقنا لخدمة الحرمين وطباعة كتاب الله وتعليم الناس عقيدة أهل السنة والجماعة ، وعلمنا الناس من هم أهل البدعة الذين شرهم اعظم من شر اليهود والنصارى وعباد الأوثان .<br />وإذا جاء ذلك اليوم الموعود الذي لابد منه حتى تصفى الصفوف وتنقى ، أخرجناكم من دول اهل الإسلام التي خيم عليها ظلمكم وجهلكم وبدعكم الخفية والمعلومة .<br />لذا اعلموا انا ندين لله جل وعلا بدين الإسلام ونعلم أن السياسة والحرب مع الكفار لها الف سبيل وسبيل ولستم أنتم بالذين تغيروننا على ولات أمرنا ، فالعقد ثابت ، والبيعة منعقدة ، ونحن لكل عدو مثلكم بالمرصاد ، فاربعوا على أنفسكم لاكثر الله بكم الأمة ولا أعز بكم دينه .<br />ومن هذا المنبر ، أشكر الحكومة السعودية على جهودها المبذولة ، في نشر الدين وحفظ أمة الإسلام ، والتخفيف عنهم بكل غاية وطريق ."
