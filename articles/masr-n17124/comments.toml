[[comments]]
order = 0
subject = "التغيير بالقانون مستحيل"
author = "انا"
text = "د-الفوضى فى كل مكان<br />المدارس ونظام التدريس<br />ادخل اى مستشفى حكومى<br />وشوف كم هى قذرة- وضع البلد صعب جدا<br />الشارع فوضى<br />وسيظل فوضى رغم القوانين<br />بلد ملهاش عمدة"
archived = "2008-08-08"
capture_url = "https://web.archive.org/web/20080808013106/http://masr.20at.com:80/newArticle.php?sid=17124"

[[comments]]
order = 1
subject = "مرحبا بكم فى الاسكندرية/كلها بلاد اللة يا عباد اللة"
author = "ممدوح زكى زخارى جرجس/الاسكندرية _مصر"
text = "دعوة و حل بسيط جدا للسادة سائقى النقل بكافة انواعة المختلفة سواء تاكسى-اوتوبيس-ميكروباس او حتى عربة بحمار ضعيف هزيل مريض؟<br />مرحبا بكم بالاسكندرية للعمل تجنبالعقوبات المدعو قليل الحيلة الماسوف على شبابة المرحوم قانون المرور الجديد!!!؟<br />حيث لا يوجد انضباط اة حتى قانون مرور_او حتى ضباط مرور او حتى ادارة مرور ؟او حتى ضباط مرور لديهم الكفائة و المقدرة على تنظيم المرور او حتى تطبيق المرحوم (قانون المرور)رحمة اللة ووئدة فى ادراج الدولة ليلحق باقرانة الاف القوانين التى شرعت و سنت سابقا و حاليا و لاحقا؟؟؟؟؟"
archived = "2008-08-08"
capture_url = "https://web.archive.org/web/20080808013106/http://masr.20at.com:80/newArticle.php?sid=17124"

[[comments]]
order = 2
subject = "هل حقا يوجد قانون مرور جديد بمصر ام انها اشاعة مثل كل الاشاعات اليومية؟"
author = "ممدوح زكى زخارى جرجس/الاسكندرية _مصر"
text = "استحافكم باللة العظيم ان تصدقونى القول!!!!!<br />(هل حقا سن و شرع و طبق قانون مرور جديد بمصر) أم انه أشاعة مغرضة اطلقتها قوى الشر المتربصة بمصرنا الغاليةالمحروسة بأزن اللة جل جلالة عظمت قدرتة"
archived = "2008-08-08"
capture_url = "https://web.archive.org/web/20080808013106/http://masr.20at.com:80/newArticle.php?sid=17124"

[[comments]]
order = 3
subject = "لماذا لا تخصخص ادارات المرور فى مصر؟لضبط المهزل بالشارع المصرى"
author = "ممدوح زكى زخارى جرجس/الاسكندرية _مصر"
text = "لماذا لا تخصخص جميع ادارات المرور بمصر ؟؟؟<br />و اسناد المناقصة بالامر المباشر الى دولة البنجلاديش؟؟؟؟؟<br />كلى ثقة من عودة الانضباط و النظام و الهدوء و القانون الى الشارع المصرى<br />هذة ليست نكتة او ازدراء للدولة او القانون و لكنها للاسف الشديد الحل و الدواء الشافى الترياق<br />و دعوانا نبداء بالاسكندرية دائما مثلما بدئنا بشركات النظافة و الزبالة<br />(مع حفظ كافة حقوقى الادبية و المادية و القانونية)تجاة كل من تستسيغ نفسة السطو على ملكيتى العقلية!)<br />و لآجل العلم قانونا/!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!؟"
archived = "2008-08-08"
capture_url = "https://web.archive.org/web/20080808013106/http://masr.20at.com:80/newArticle.php?sid=17124"

[[comments]]
order = 4
subject = "المصادرة و الحبس و السجن هما الحل"
author = "ممدوح زكى زخارى جرجس/الاسكندرية _مصر"
text = "ماذا لو طبقت الدولة نظام المصادرة و الحبس و السجن لكل مواطن ايا كان لم يحترم القانون<br />مصادرة السيارة و تحويلهل للخدمة العامة طوال فترة سريان عقوبة المخالفة مع عقوبة الحبس الوجوبى للمخالف فى المرة الاولى<br />ثم المصادرة النهائية اذا سنحت للمخالف نفسة بكسر القانون و انتهاكة مع تشديد عقوبة الحبس الى عقوبة السجن المشدد ايضا<br />و لتكون تجربة تستحق التنفيذ و كلى ثقة من نجاحها 100000000000000000000000000%<br />العنف و البطش بمخالفين القانون حلال مليون المائة من اجل القلة المحترمة حافظة النظام و القانون"
archived = "2008-08-08"
capture_url = "https://web.archive.org/web/20080808013106/http://masr.20at.com:80/newArticle.php?sid=17124"
