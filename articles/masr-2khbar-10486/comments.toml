[[comments]]
order = 0
subject = "عايزين نقلب عيشنا بقا"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-11-12"
text = "لما نعمل فلم عن السحاقيات الناس حتجري على الفيلم علشان خاطر تتفرج على المناظر السحاقية والحكاية والرواية<br />والفلم يكسب كام مليون جنيه والمنتج ياخد هبره والابطال كل واحد هبره كويسه<br />والمشاهدين يجري على غرف النوم يمارسوا الجنس من اثر المشاهد المهيجة واللي ما عندهوش غرفة نوم على الحمام عدل<br />يا عيني عليك يا شعب مصر"
archived = "2010-03-14"
