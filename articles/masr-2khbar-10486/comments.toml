[[comments]]
order = 2
subject = "لا حول و لا قوة إلا بالله"
author = "الطير المهاجر"
posted = "2008-11-13"
text = "بالله عليكم يا بني آدمين ياللي قائمين عالموقع لا تتناقلوا مثل هذه الأخبار , و يكفي أن تقرءوا التعليق المكتوب فوقي لتعرفوا ماذا فعلتم ."
