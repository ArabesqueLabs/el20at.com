[[comments]]
order = 1
subject = "يعنى اية سحاقية"
author = "سوسو"
posted = "2008-11-13"
text = "السحاقية اللى بتمارس العادة السرية زى الصبيان ؟ والا لها معنى تانى<br />ابلة كريمة بتاع الفرنساوى بصت لى بقرف لما سألتها عن المعنى<br />اشرحوا لنا الحاجات الغامضة دى"
