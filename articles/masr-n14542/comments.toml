[[comments]]
order = 3
subject = "بروحه كتير"
author = "شخصية"
posted = "2008-03-08"
text = "من أحلى الكافيهات اللي بحب أروحها، ومش حاسة يعني ان الموضوع مستفز ولا حاجة.. يعني حتى لو الحاجات عنده غالية شوية فهي أصلا مغمولة لجمهور عنده فلوس.. طبيعي مش عندهم عربيات يبقى عندهم فلوس.. مش لازم يعني نهاجم كل حاجة لمجرد الهجوم، خلينا نسلم ان كل طبقة ومستوى اجتماعي ليهم طرقهم الخاصة في الترفيه، من أول الناس اللي بيشربوا الشاي على بسطة البيت في أبو قتادة لحد اللي بيشربوه على البلاج في هاواي.. وهنياً يا شباب"
archived = "2008-03-10"
capture_url = "https://web.archive.org/web/20080310192809/http://masr.20at.com:80/newArticle.php?sid=14542"

