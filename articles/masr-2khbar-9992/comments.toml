[[comments]]
order = 9
subject = "البرلمان المصرى فى عصر مبارك فيه ثلاثة أقباط"
author = "الى الدجال زخاري"
posted = "2008-09-03"
text = "البرلمان المصرى فى عصر مبارك فيه ثلاثة أقباط<br />والبرلمان المصري يضم سبعة أقباط فقط بين أعضائه البالغ عددهم 454 عضوا خمسة منهم جرى تعيينهم بقرار جمهوري ولم يصلوا إلى موقعهم بالانتخاب.<br />كما يوجد وزيران قبطيان داخل الحكومة.<br />كما سمح بتعيين عدد من الأقباط في مناصب قضائية<br />غير أنه لا يوجد قبطي يشغل منصب محافظ أو رئيس جامعة.<br />وتتباين التقديرات حول عدد الأقباط في مصر حيث تشير الإحصاءات الرسمية إلى أن عددهم يقل عن 10 ملايين شخص بينما يزعم الناشطون الأقباط، ومن بينهم أبادير، إلى أن العدد يصل إلى 14 مليون أو 20% من إجمالي عدد السكان.<br />وإنتقد أبادير حكم مبارك قائلا إنه تحت حكمه \"يعيش الأقباط أسوأ أيام حياتهم\" منتقدا تصريحات مبارك بأن الأقباط لم يتعرضوا للاضطهاد.<br />وقد ألتقى مبارك بالبابا شنودة مرة واحدة خلال 24 عاما عندما كان يسعى للحصول على دعم الأقباط قبل زيارته للولايات المتحدة.<br />http://news.bbc.co.uk/hi/arabic/middle_east_news/newsid_4573000/4573611.stm راجع موقع وكالة الأنباء العالمية بى بى سى لمزيد من التفاصيل"
archived = "2010-03-14"
capture_url = ""

