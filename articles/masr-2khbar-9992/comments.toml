posted = "2008-09-03"
text = "لا تعليق على قتل المطربة<br />وانما التعليق على قتل المطربة بالطريقة البلدى قوى دى<br />كان ممكن تترمى من بلكونة فى لندن تموت فى حادث سيارة على الطريق الصحراوى - السيارة تقع فى ترعة وهى رايحة راس البر او اسكندرية او طريقة النسوان فى القتل مثلا وهى فى فندق الفورسيسون بتاع الاستاذ طلعت فى الشرم يتحط لها سم فار فى الاكل<br />انما الاخ السكرى قاتل بطرقة اهل اهل جرجا لبد لها فى الدرة وطخها او طعنها بالسكين<br />وصوروة فى دبى وهو خارج من العمارة وايضا وهو مسافر على طيارة مصر للطيران الساعة ثلاثة ونص بعد القتل بساعتين<br />المهم البراءة مضمونة<br />والواد السكرى دة هينقتل فى الحجز او السجن ويقولوا انتحر لان لدية اقوال اخرى"
