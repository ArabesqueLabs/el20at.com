text = "الأول ضابط أمن الدولة السابق محسن منير السكري قام بتسجيل حواراته مع هشام طلعت مصطفى بخصوص الاتفاق على تنفيذ العملية، وأن هذه التسجيلات في حوزة الأمن المصري الآن، وأن موقف هشام طلعت مصطفى سيئ للغاية، ولذا فإن من يسعون لإنقاذه الآن يريدون تسليمه للإمارات العربية حتى تجري المحاكمة هناك، على اعتبار أن قوانين الشريعة المطبقة في الإمارات، تفتح الباب بعد إدانة المشتبه بهم بتهمة القتل العمد، إلى خيارات منها القصاص أو قبول أولياء الدم -أي أهل القتيلة- الدية وبالتالي يتنازلون عن حقهم في القصاص، وهم يراهنون على قبول أهلها بالدية وبالتالي العفو عن المتهمين،"
