text = "حمرمر غبى افندى<br />اية الحكاية معاك بالضبط؟<br />اماذا دائما ما تحاولون تحويل كل صورة جميلة الى صورة قبيحة من صور التطرف<br />و دائما ما تكتب عن اقباط مصر المسحيين الارثوذوكس و كانهم و العياز باللة العظيم شيئى مكروة؟<br />و تتكلم عن اقباط المهجر و كانهم هم الاعداء الخطرين فقط على بلدك الغالية مصر<br />و تتباهى بغبائك التاريخى يا جاهل بابسط امور التاريخ و الجغرافيا و تقول ان الارثوذوكس اقباط مصر الاصليين معظمنا فى خططة انة يهاجر و يروح عند اصولهم الاومانية فى امريكا و استراليا؟ (ياسلام على الجهل المستنير بعينة)يا اغبى ما خلق اللة على و جهة الارضظ<br />اميكاواسترالياو كندا و نيوزيلندا كمان يا روح امك اصولهم و الحمد للة (أوروبية) و ليست(رومابية) و يا ريت تفهم الفرق بينهم و اشك فى انك تستطيع حتى الفهم ؟<br />و يشرف جميع اقباط مصر من (مسيحيين و مسلمين)معا ان يتم تعيين المسحيين فى (البمجلسيين) مجاس الشعب و مجلس الشورى بالتععين بواسطة السيد رئيس الجمهوريةظ فهذا هو نعم الشرف الذى نحظى بة لانة مبنى على الثقة بنا و التى اولانا سيادتة بها؟<br />و ذلك لاننا (أهل كتاب مقدس) اما انتم ياعضاء (الحماعة الموبوئة المحظورة فانكم حقا(اهل رياء و نفاق و جهل و حقد و جهل و غباء و قتل و دمار) انتم اهل الياء بعينة؟<br />و على فكرة تعرف لية مسحيين مصر لا يريدون الانغماس و المشاركة فى الحياة السياسية؟ السبب بسيط جدا الا و هو قرفهم منكم و من غبائكم لدرجة انهم اصبحوا لا يريدون ان يجلسوا بجانبكم على مقاعد المجاسيين الموقرين تاففا من مناظركم القبيحة و رائحتكم النتنة و افكاركم المتخلفة الهدامة الهادفة الى الرجوع بمصر الى عصور الظلام و التخلف و التى انتم تعيشون بها دائما ؟<br />مسحيين مصر اهل عطاء لا يتسابقون للفوز باية مقاعد من مقاعد البرلمان المصرى طمعا فى جاة او مال او نفوز او اية صورة من صور الحماية و الحصانة البرلمانية؟<br />لقد هبانا اللة الاخلاق و العلم و المال و المبادئىء و العقيدة و الايمان فلماذا نتسابق و نجرى و ناهث مثلكم!!!!!!؟<br />اقباط مصر المسحيين هما الخيوط المتشابكة التى صنعت مصر و نسجت تاريخعا و رفعت شانها و علمها فى الداخل و الخارج و على كافة المنابر العالمية؟<br />اما انتم فماذا افرختم سوى قتلةو ارهابيين و متخلفين و حاقدينو طلاب حكم مصر و هذا ابعد عن شعور زقونكم المتشعثة القذرة<br />حكم مصر حلم لا يجب بكم حتى شرف ان تحلمون بة<br />(انة حلم ابليس بدخول الجنة)؟!!!!!<br />فاذا دخل ابليس الجنة ؟ ابقو تعالو انتم و امسكوا حكم مصر؟! ها ها ها ها ها ها ها<br />فى المشمش يا ننوس عين امك؟ على جثتى و حياة ماما<br />و متنساش تبوسهالى بوسة غير بريئة؟؟؟؟؟؟"
