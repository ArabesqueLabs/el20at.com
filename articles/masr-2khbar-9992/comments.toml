[[comments]]
order = 15
subject = "و انت زعلان لية؟ هو كان جوز امك و اللا اية الحكاية"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-03"
text = "اية الحكاية دى يا جماعة<br />هى البلدناقصة تفاهات و الا ايو الموضوع<br />طيب و انت زعلان لية البرلمان المصرى يكون فية 3 اعضاء و لا 7 اعضاء و لا حتى يكون كلة اعضاء اقباط؟<br />هو انت عايز تكون و احد محترم من اعضاء البرلمان؟<br />متهيئلى الموضوع مستحيل يا ننوس عيون ماما<br />البرلمان ينتخب الناس المحترمة مش الناس الزبالة امثالك و امثال العجوز الخرف عدلى ايوب و من على شاكلتة؟!!!<br />و بالمناسبة يا روح مامى ؟ انا ما يهمنيش ان يكون فى البرلمان المصرى اى اعضاء و اللة العظيم؟<br />تعرف لية؟<br />لانهم للاسف الشديد خوافين من هجوم الحثالة امثالك عليهم و من الفثة الضالة الخارجة على سلوك اقباط المهجر؟<br />و بالمناسبة جملة (أقباط المهجر) تشمل اليهودى و المسيحى و المسلم ! الجميع معا؟<br />ولا يعنينى شيئا ان كان قد اجتمع مبارك مع البابا شنودة الثالث مرة او اقل او حتى اكثر من مرة كمان ؟ OK<br />و متنساس تبوسلى -----------------علشان ما تزعلش منى؟<br />و اللة مامى بتاعتك و حشانى جدا ؟ بوسها بوسة تستاهل من البوسات اياها ؟!!!!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 16
subject = "واحد مسلم متقمص اسم مسيحى اسمة زخارى للتضليل"
author = "برضة لا"
posted = "2008-09-03"
text = "اية الحكاية<br />انتم سبتم موضوع سوزان تميم وهشام او طلعت مصطفى ودخلتم فى موضوع المسيحيين الارثوذكس بتوع مصر وما غاظنى ان واحد كاتب بيقول ان عددهم 10 مليون لية كل واحد فيهم بيخلف عشرين - المسيحيين الارثوذكس لا يزيدوا عن 4-5 مليون ومعظمهم فى محافظات الصعيد واعلى نسبة فى محافظة اسيوط حوالى 10% من السكان فى المحافظة<br />انما باقى المحافظات فهى نسبة معدومة<br />وطبعا معظمهم فى خططة انة يهاجر ويروح عند اصولهم الرومانية فى امريكا واستراليا<br />فى حى شبرا وفية نسبة اقباط حواى 4% لم يستطع مرشح مسيحى ان ينجح فى انتخابات مجلس الشعب رغم تكتل المسيحيين لانجاحة<br />يا جماعة دول اقلية ضئيلة جدا فى اى مكان فى مصر ولا يستطيعوا ان ينجحوا اى مرشح مسيحى<br />ولو صحيح انهم عشرة مليون كانوا يقدروا ينجحوا خمسين مرشح مسيحى<br />انما هتعمل اية لدعاية مسيحى المهجر اللى بينفخوا فى قربة مقطوعة وفاكرين انهم هيخوفونا بامريكا - امريكا اللى مشرومة فى العراق<br />كل واحد يبقى واقعى<br />وعلى فكرة كل المسيحيين فقى المجلس بالتعيين بواسطة السيد الرئيس حفظة اللة ورعاة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 17
subject = "و الة العظيم انا مسيحى ارثوزوكسى قبطى لكنى باحب مص"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-03"
text = "عزيزى المعلق<br />و اية الفرق بين المسيحى و المسلم و اليهودى؟<br />مش كلهم و لاد حوا و ادم ؟ و لا انت تفتكر انهم و لاد حاجة تانية<br />و ياخى و انت زعلان لية لما الرئيس مبارك يعينا فى المجلس الوقر(مجلس الشعب او مجلس الشورى)؟!!!!!<br />و اللة هذا شرف لينا جميعا ؟ شرف للمسيحيين و المسلمين معاظ<br />اما بخصوص ما تقولة عن استقواء اقباط المهجر بامريكا ! فهذا شيئى لا نقبلة باى شكل من الاشكالظ<br />و لتذهب امريكا الى الجحيم و تشرب من هوانها فى العراق و انهار الدم التى تجرى هناك ؟<br />و يشرفنى ان يتم تعيينى فى المجلس الموقر سواء كان(مجلس الشعب ) او (مجلس الشورى)<br />هو الواحد فى ذلك اليوم سوف يحظى بثقة السيد رئيس الجمهورية طوال ما حيا؟و هذا شرف للجميع و انت اولهم بالطبع؟؟؟<br />مرة ثانية انصحك؟ اذا كنت بتغار من تعيين الاقباط فى المجالس اياها(اشعب او الشورى)؟ فياخى المناظر ما ترشح نفسك و تورينى شطارتك هتاخد اية؟ و العياز باللة؟<br />انت بالتاكيد سوف تاخذ خازوق مغرى بالضبط على قد مقاسك يا روح ننوس عين ماما<br />و متنساش تبوسهالى بجد و استحلفك باللة العلى العظيم!اوعى تنسى علشان ما ازعلش منك و من ماما امريكا ؟"
