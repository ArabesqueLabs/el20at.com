text = "موتور جبان افندى ننوس عيون مامى يا سوسو!!!!!!!!!!؟<br />و انت زعلان لية؟ازا كنت حاسس ان مصر فيها اضطهاد حقيقى؟ طيب ما تروح تدور لك على بلاعة تلمك و تعيش فيها بعيد عن مصر؟<br />الباب يفوت مليون صرصار و صرصار من امثالك؟<br />و متنساش يا ننوس ماما تسلملى عليها و تبوسهالى بوسة بحق و حقيقى؟!!!<br />و عيب تكلمنى و تكتب لى بالاسلوب القذر دة ياولد؟<br />عيب عليك انا بابا اللى خلفتك من ماما؟<br />ما تنساش تبوسهالى؟ هى و حشانى كتير و و حشانى ايام الانس معاها!!!!!! و اللة كانت ليالى حلوة حميلة مش هاقدر انساها و انسى عيون و حلاوتة امك؟<br />و اوعى تنسى تبوسهالى؟ بعدين مامتك ما تزعلش منى؟ OK!!!!!"
