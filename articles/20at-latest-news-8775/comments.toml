text = "وكانت ليفني قد قالت في حديث لصحيفة \"الوطن\" القطرية عشية الزيارة \"تمثل إيران تهديدا للمنطقة والعالم ولا يمكننا قبول وجود إيران مسلحة نوويا ..أرى فرصة هنا\".<br />وهل يقبل الحكام العرب، بل و الشعوب العربية، وجود إسرائيل المسلحة نوويا منذ أكثر من ربع قرن؟؟؟؟؟!!!!<br />حسبي الله ونعم الوكيل في كل الأبقار ذوات القرون الغربية...آسف، أقصد العربية."
