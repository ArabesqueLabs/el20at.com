text = "بصراحة المسيحيين بيزودوها<br />انتوا بتحربونا حرب نفسية كيديه<br />بمعنى انتوا ايه المبانى اللى انتوا عمالين تبنوها دى<br />انتوا كده بتعملوها فرد عضلات وعلى مين<br />وشوفوا لما المسيحيين يمسكوا دوله بيعملوا ايه ولوا انتوا حاتعملوا مش واخديين بالكوا شوفوا الدول الاوروبيه بتعامل المسلمين ازاى واحنا كنا بنعاملوكوا ازاى وعايزيين تسيطروا على البلد كلها بس اعرفوا اللى ماسكها مش قاعد لها ولو كنتوا بتحضروا للى بعدوا برضوا مش حايقعد كتير واحنا ابتدينا نحس بسياستكم واكيد لو حاييجى يوم واللى حايمسكها مننا وحاتشوفوا الفرق"
