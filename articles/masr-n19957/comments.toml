subject = "اللى عمل الاعلان واحد مخنث وبيمنى نفسة انة يبقى را"
author = "اكتب اسمك هنا"
posted = "2009-02-14"
text = "يعنى تقدر تقول علية اعلان خاص بالمخنثين<br />هو انت لما تشوف نشرة اخبار الصم والبكم الموجهة اصلا للصم والبكم بتهتم بها<br />وكذلك اعلان بيرل هو اعلان للخولات والمخنثين انهم يسترجلوا شوية - فاعتبر الاعلان غير موجة لك"
