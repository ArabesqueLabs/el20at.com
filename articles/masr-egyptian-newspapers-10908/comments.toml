subject = "ضرايب فى المجتمعات الشبعانة - انما واحد جوعان وتسو"
author = "مصرى معدم"
posted = "2009-01-08"
text = "فى جميع دول الخليج مفيش حاجة اسمها ضرايب ولا دمغة<br />رغم ان شعوبها شبعانة ومرتاحة وكويسة<br />انما انا فى مصر ادفع ضرايب علشان الدولة تصرفهم على مليون عسكرى امن مركزى علشان يرعبوا الناس ويضربوا المظاهرات ويسدوا الشوارع لما الريس يمشى فى شارع او منطقة<br />الدول النظيفة بتصرف الضرايب على الخدمات<br />مش علشان تزوير الانتخابات واستئجار البلطجية لضرب الناس والتزوير<br />ضرايب اية"
