subject = "القذارة الفكرية وصلت للدرجادى بقيادة اوسخ شخصية فى"
author = "ابوصالح"
posted = "2008-07-13"
text = "واللة العظيم كاتيب الموضوع دة الدكتور محمود خليل (برنس)لانة جايب لب الموضوع وليس اى شىء اخر لكن بالنسبة للاشكاتل الوسخة بتوع حزب التجمع بقيادة اوسخ واحد فى مصر رفعت السعيد ربنا ياخدها اخذ عزيز مقتدر هما عايزين ايةللدرجادى مش عايزن يكون عندنا دين لاميلم ولا مسيحى اية حكاية الاحزاب القذرة دية ولا صحيح هيجى اية من حزب رئيسة رفعت السعيد البيشتم الشباب المصر وبيقول علية عيالة لاسعة ومروهمش شغلانة انا بصراحة كدة ارفت من البلد دية ومن الاشكال الوسخة السياسية المالية الساحة مترحمونا بقا من الشخصيات السياسية الحقيرة دة |(كتكم الارف مالتوا البلد)"
archived = "2008-07-14"
