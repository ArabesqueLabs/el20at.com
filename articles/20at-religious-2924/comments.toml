text = "الحمد لله أننا أصبحنا نرى رجالا على الفضائيات كانوا من قبل يعتبرون التلفزيون رجسا من عمل الشيطان بل أصبحوا نجوما كنجوم الطرب ، وكنّا نتمنى على هؤلاء النجوم أو الشيوخ أو المشايخ أن يحدثوا الناس عن حياتهم اليومية التى هى فى الأساس دينية سياسية لكن اللافت للنظر فى مثل هذه القنوات أن شيوخها يتحاشون الحديث عن أى شئ فيه سياسة علما بأن ديننا كله سياسة والآيات القرآنية أغلبها سياسة ، لكن حينما يهاجمون الشيعة لحساب السعودية تلميحا أو تصريحا لا تكون سياسة ، وكل مشاكلنا يعلقها مشايخنا على المواطنين الغلابة أمثالنا لكن لا يجرؤ واحد يتكلم عن عودة الملايين المهربة لأن هذا سييمنعهم من النجومية ."
