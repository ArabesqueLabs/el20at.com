author = "موزعاتي"
text = "مبدئيا احب اقولكم ان المشايخ الاجلاء اللي في قناه الناس تاريخهم معروف واللي مش عارفه يبقي بجد عنده مشكله<br />وحاجه بقي حضراتكو مش عارفينها<br />المشايخ دول شغالين لله<br />يعني مبيخدوش مليم احمر<br />اما بقي بالنسبه لدكتور عاطف فلا جدال ان سياسته تجاريه بحته والتحويل اللي حصل لقناه الناس تجاري بحت مفيش فيها كلام بس المهم النتيجه ...... احنا نقدر نستفيد من الحاجه الكويسه وهي ان كم المشايخ دول كلهم موجود في قناه واحده والسلبيات نتغاضي عنها وننفض لها وهما هيلاقوا في الاخر انها مبتجيبش فلوس<br />يا جماعه الفصل في الكلام للقران والسنه والمشايخ دول بتكلموا عن علم واللي مش عاجبه الكلام يجيب الدليل بخطأ كلامهم واتحداكم .... وانا عارف ان كل الناس اللي بتتكلم عن الدين العصري دول معندهمش لا علم ولا بطيخ هما يا دوب كلمتين قروهم في مجله عن الاسلام المودرن وبقي ده هو مصدر ثقافتهم ومرجعيتهم الوحيد<br />تعالوا كده حطوا الاحتمال ده وفكروا فيه<br />ماذا لو ان كلام المشايخ ده صحيح ؟؟؟؟<br />هل هتسيبوا الاسلام؟؟؟؟ ولا هتعملوا ايه بالظبط"
