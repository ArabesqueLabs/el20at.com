text = "الحمد لله و حده<br />أما بعد فللأسف أن يوجد فينا من ينوب عن أعداء الأمة في إلحاق التهم بالعاملين في الدعوة بإخلاص و كذلك الحق لم يسلم من خصوم على مر التاريخ و لكن ينتصر في النهاية<br />و أبشر كل محبي هذه القناة هذا الدعاوى الباطلة هي بداية النصر الذي تحققه القناة التي لم تترك بيت إلا و سمع صوتها فيه في العالم الإسلامي أجمع<br />و لقد النبي عليه السلام إن الله ينصر هذا لادين بالرجل الفاجر<br />و قديما قال الشاعر و إذا الله نشر فضيلة طويت أتاح لها لسان حسود<br />و أقول لصاحب المقال ما قاله الشا عر<br />يا ناطح الجبل العالي ليوهنه أشفق على الرأس لا تشفق على الجبل<br />فرحمة بك أيها الأخ فإن الحسد أول من يهلك صاحبه و يدفعك البغض للحق أن تقول ما ستسأل عنه يوم القيامة فمهلا عليك و اسأل الله أن يبصرك بالحق<br />أما الذين يناصرونك في الرأي فلا تكونوا كمن قال الله فيهم موتوا بغيطكم<br />و لاتكونوا كالذين خبثث نفوسهم فأصبحوا يدافعون عن ظهور المرأة في التلفاز ليس كحق و إنما لميتعوا أعينهم بالوجوه النسائية المزينة المختلفة الأشكال<br />أخيرا فالقناة فهي متنفس للذين كانوا يبحثون عن الحقيقة مند زمان بعلماء يجمعون بين قوة الدليل الشرعي و العقلي و حجج تتهاوى معها كل الشبه الميتة التي يحييها بعض المغرضين<br />و لا شك أن الله سيحميها من كيد الكائدين<br />و أقول لأهل الموقع أخطأتم بمثل هذا المقال الذي كان من الأولى أن ينتقد قنوات المجون و الخلاعة التي تملأ الدش و حتى بعض القنوات التي تريد أن تنصر دينا مميعا ليس له من الحق نصيب<br />الله يهدينا لما فيه صلاح ديننا و دنيانا"
