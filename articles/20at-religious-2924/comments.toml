[[comments]]
order = 92
subject = "تعليق على الردود وتوضيح هام"
author = "مجاهد شرارة - كاتب الموضوع"
text = "بداية جزى الله خيرا كل من علق على هذا الموضوع، فهذه ايجابية تحسب لزوار عشرينات .<br />سأوضح بعض النقاط الهامة .. أولا : أنا احترم العلماء والمشايخ الذين ذكرت أسمائهم في المقال وبالذات الشيخ محمد حسان الذي أحفظ عنه أبيات الشعر لزين العابدين بن علي وشريطه الرائع وفاة الرسول صلى الله عليه وسلم . وما ذكرته من مؤهلات الشيوخ إلا لسرد بعض المعلومات عن هؤلاء العالماء الأفاضل وإن كانت شهادتهم غير ازهرية فهذا مدح لهم لقد اجتهدوا وتعلموا على يد علماء أفاضل وسافروا للعلم فجزاهم الله خيرا ... ما أنقده هو سياسة القناة في أكثر من شكل اولا منعهم ظهور المذيعات هذا حقهم وليس لي دخل أما أن يقال السبب أن صوت المرأة عورة ومع ذلك لا تمنع الادارة صوت المرأة في الاعلانات ( هذا حدث في اجتماع مع جميع المذيعات وذكر ذلك في تقرير لجريدة المصري اليوم ) فهذا تناقض<br />الأمر الآخر ..سعدت بالتعليق الذي ذكر ان الشيخ محمد حسين اعترض على موضوع الرنات فمكانة العلماء والمشايخ لابد ان تتماشى مع مواقفهم ..وهذا يحسب للشيخ يعقوب ...<br />اخواني ازعجني كلام بعض المعلقين واالتهامات بأني كاذب واسير في ركب اعداء الامة وتافه الى آخره ..... ألا ترون أن هذا حكر على ابداء الرأي حتى ولو خطأ .. فيا إخواني الرسول صلى الله عليه وسلم قدوتنا كان ينصح بأفضل الكلمات وأجمل العبارات ويحافظ على الافراد من وسوسة الشيطان فأين نحن منه ومن سلوكه ... اذا اعتبرت نفسي اخطأت فليس بهذا الاسلوب يكون النصيحة ...<br />النقطة الاخيرة .... يا اخواني واخواتي المساحة ما بين الصح والغلط كبيرة فلا تعلقوها على شرط واحد ...<br />قبل ان انسى لست معترضا على الملتحين والمنقبات فانا احترمهم جميعا لكن الملاحظة التي شاهدتها بعيني دون ان يحكي لي احد ان القناة في نشأتها لم يكن هذا هو المظهر العام لكن بعد وجود العلماء حدث ذلك من نفس الاشخاص وربنا يهدي ...<br />الامر الاخير<br />ارفض اتهام القناة بالارهاب وأأسف على بعض الالفاظ التي قيلت في حقها<br />فكما انا ارفض عدم النقد البناء كذلك ارفض ايضا النقد الجارح<br />ولنكنم جميعا موضوعيين"
archived = "2010-03-14"
capture_url = ""

