subject = "كنت احترم هذا الموقع قبل قراءة هذا الموضوع"
author = "اللهم اهدي قومي فانهم لا يعلمو"
text = "تاكيدا للمعني الذي قالة اخي الكريم في كونة كان يحترم ذلك الموقع حتي قراءتة لذلك الموضوع الذي ليس الا طعنا في علماء اجلاء حاملين علي الاقل كتاب الله في قلوبهم لا نساوي بالنسبة اليهم ظفر من اظافرهم الطاهرة وبالنسبة للموجة السائدة في تلك الردود الجوفاء من كونها قناة استهلاكية وقناة متشددة ومن كونها ضربا للاخوان بالسلفين وما عاداها من اقوال جوفاء ليس لها علاقة بالانصاف ولا العدل الذي نبحث عنة في عباءة حكومتنا التي نظلمها دائما بكونها متعدية علي حقوقنا فهل لهم بالفعل ان ينصفونا ويقسطوا لنا ان لم نكن نحن مقسطين وعادلين لانفسنا في البداية فما كان الله مغيرا ما بقوم حتي يغيروا ما بانفسهم وكفاكم اكلا في اللحم المسموم كما اخبرنا نبينا الكريم بان لحوم العلماء لحوما مسمومة<br />والحمد لله وكفي وسلام علي عبادة الذين اصطفي"
