text = "كنت من أوائل من انتقدوا تلك القناة وتصرفها المشين والمهين مع مذيعاتها ، ولا زلت على موقفي من القناة وإتجارها بالدين وأسلوبها الوعظي المباشر..<br />وليست الناس هي الوحيدة التي \"تعمل بيزنس\" في هذا الاتجاه ، فعلى الناحية الأخرى في المحور نجد \"الفنان التائب\" مجدي إمام وبرامجه الصوفية غريبة الشكل على ما يسمى بقناة المحور (وساعات الدائري) ..<br />كل فانلة تحاول التصارع على وهم الزعامة الدينية يكون ربنا مديلها قرشين كويسين تعمل لها قناة ومطبوعة .. ما العالم دي كلها سلفي على صوفي على بتنجاني سابت الإسلام اللي بتدعي الوصاية عليه وشغالة لنا احنا بقى.. ومش عايزة تعترف إن عدد الناس العادية البسيطة اللي بتختلف على أفكار كل الأحزاب الدينية دي أكبر بكتير من عدد أنصار الأحزاب دي كلها على بعضها..<br />حرب على دماغنا ، بتتطبخ ساعات في السعودية ، وساعات في إيران ، وساعات في ليبيا ، وساعات في مشيخة الطرق.. ودقي يا مزيكا.."
