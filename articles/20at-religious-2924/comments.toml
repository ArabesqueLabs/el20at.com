subject = "أفيقوا من غفلتكم"
author = "عبد الله"
posted = "2007-02-24"
text = "يبدو أن كاتب المقال و المؤيدين له كانوا يعيشون تحت الأرض، لأن هؤلاء العلماء بدأوا دعوتهم منذ ما يقرب من ربع قرن و أحبهم الناس و تبنوا دعوتهم و لهم الآن تلاميذ يعملون فى الدعوة و يوجد الملايين تأثروا بدعوتهم. و الحمد لله أصبحت الآن دعوتهم أكبر و أوسع و تصل إلى شتى بقاع الأرض.<br />فأريد أن أسأل هؤلاء هل كنتم تعيشون فى المريخ أم تحت الأرض أم كنتم تعيشون فى مصر و لكن جعلتم أصابعكم فى آذانكم و استكبرتم عن سماع قول الله و رسوله !!!!!!!<br />فيه حاجة حاسس أنى هتخنق إن لم أقلها ، الناس اللى بتقول تشدد هل تعلموا الدين أصلا حتى يحكموا على الناس بأنهم متشددين ، اللى أعرفه أن المتشدد ده واحد بيبالغ فى المسائل زيادة عن اللزوم ، و أنتم أصلا لا تعرفوا هذه المسائل فكيف تحكمون . و لا هو الدين اللى أنتم عايزينه لازم يكون على حسب مزاجكم . لو كان الدين بالمزاج كان بقى عندنا لكل واحد دين على مزاجه، و الغريب أن كل شوية واحد يدخل يقول \"فمن شاء فليؤمن و من شاء فليكفر\" أنا عايز أعرف أنتم بتلمحوا لإيه بالضبط ؟ لو عايزين تكفروا غوروا فى ستين داهية و ريحونا . بلاش وجع دماغ على الفاضى .<br />نأسف لإزعاج المنافقين قاتلهم الله."
