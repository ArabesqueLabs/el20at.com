author = "Drsalah_hanie"
text = "ياإخوانى يجب علينا أن نفيق مما نحن فيه فالاسلام يحارب ليل نهار وكل يوم نسمع عن قناة تنصيرية جديدة واحدة تدعوا المسلمين إلى ترك دينهم صراحة وأخرى تفعل ذلك ولكن من تحت لتحت وغيرها وغيرها وغيرها وكل واحدة تمول بملايين الدولارات ...<br />فيما لايتواجد على الساحة إلا عدد قليل جدا من القنوات الإسلامية بإمكانيات محدودة جدا وهذا نتيجة طبيعية جدا لضعف المسلمين وعدم إهتمامهم بدينهم.<br />ورغم ذلك فعند ظهور أى قناة إسلامية نمعن فى الهجوم عليها وتشويهها وكأننا لانريد لأى قناة إسلامية أن تقوم لها قائمة فهذه قناة مائعة وتلك قناة بأموال خليجية وهذه ليس لها هدف إلا المكسب والشهرة!!!!!!!!!!<br />إذا كنا نحن نفعل ذلك فى ديننا فماذا تركنا لأعدائنا !!!<br />فعلا نحن نستحق ما يجرى لنا على أيدى أعدائنا ورؤسائنا طالما ظللنا نخذل إسلامنا إلى هذه الدرجة طالما بقينا نشكك فى كل من يعمل للإسلام ونصفه بأسوأ الصفات وكأن اى شىء إسلامى أصبح موضع نقد وشك.<br />فالشيخ مايريد إلا التكسب الشيخ تفكيره ظلامى ومنغلق ,<br />القناة الاسلامية هذه تتكسب وتضحك على الناس الغلابة ,<br />ياناس يامسلمون يامسلمون اتقوا الله فنحن هكذا والله نحارب الاسلام من حيث ندرى أو لاندرى .<br />وحسبنا الله ونعم الوكيل فى كل من يظلم الإسلام وأهله."
