[[comments]]
order = 62
subject = "اللهم اهدى جميع المسلمين"
author = "م/ شريف"
text = "السلام عليكم اعتقد ان قناة الناس تحتاج الى بعض الرقابة والتعديل فى منهجها وسلوكها فلابد من الغاء شريط الاهداءات الموجود اسفل الشاشة لكى نبعد عن الشبهات ولابد الاهتمام اكثر بقضايا المسلمين حول العالم لا يجوز ابدا ان نتكلم عن الرقية وتفسير الاحلام وعمل كذا وكذا وننسى ما يحدث للمسلمين من سفك دماء ومن قتل ابرياء ومن زعزعة الامن بين المسلمين وغير ذلك من احداث تهم المسلمين ولم اجد شيخا يتكلم عن المسجد الاقصى وتاريخه واهميته للمسلمين لم اجد ايضا عالم يتكلم فى الفقه او السيرة او الحديث كل ما نراه على هذه الشاشة برامج دعاية للشيوخ ليس الا وما نجده للإعلانات من نصيب مع كثرة انواعها وانتشارها فسياسة هذه القناة كباقى القنوات الفضائية غير ان تجارها علماء من المسلمين وشيوخ ايضا فلابد من ان تقف هذه القناة عند حد معين ولابد ان تكون واقعية وتكون مهتمة بامر المسلمين"
archived = "2010-03-14"
