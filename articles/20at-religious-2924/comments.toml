text = "أنا مش شايفة انها قناة اصلا..دي كلام فارغ وطلع على الهواء مباشرة ..<br />مش دول برضه الشيوخ اللي كفرونا و شتمونا و قعدوا يصرخوا فينامن خلال شرائط الكاسيت اللي بينزلوها ؟ والقناة دي اللي رفدت المذيعات ولم تعطهن أجرهن يا اخي ده النبي (ص)بيقول \"أعط الأجير حقه قبل ان يجف عرقه\"-أو كما قال- يا اخي مش عيب القناة دي تنزل اعلانات منعينة بودرة العفريت اللي تخليك تنجب في 21 يوم ..ونقحم فيها ايات القرأن الكريم و الأحاديث..بقى دي مش اسمه المتاجرة بالدين ؟؟؟؟<br />عموما هي قناة بيئة مش معنى كده ان الرسالةو اقرأ حلوين ..احنا محتاجين لدراسة جيدة للاعلام الاسلامي"
