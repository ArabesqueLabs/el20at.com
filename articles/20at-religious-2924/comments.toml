text = "جميل ان التوجه يكون تعليم الناس مبادئ دينها وجميل ان يكون فيه قناه ده دورها لغايه كده كويس أوى لكن مبدئيا ليا سؤال ليه النظام راضى على قناة الناس واحد هيقولى الامن والنظام مالهومش سلطه على الفضائيات طيب ليا سؤال هل ممكن يسمحو للاخوان مثلا يكون ليهم قناه وفيه سوال كمان مين قال ان ممكن نفصل الدين عن الدنيا والسياسه وعن امور العباد الى هيا فى حاله تدمير منظم وهل يرضى اى صاحب ضمير اننا نحصر الدين الاسلامى فى شوية مواضيع مثل عذاب القبر وعلامات الساعه وتفسير الاحلام واداب الابتسام هل هذا ماارسل الله سيدنا وحبيبنا محمد عليه السلام من اجله ان صدقنا ذلك فعزرا مكاننا بجوار حمار العربجى"
