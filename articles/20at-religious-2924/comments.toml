text = "جزاك الله خيرا ففعلا قناة الناس تزخر بمشايخ أفادونا وفقهونا وعرفونا الاسلام على حق.فجزاهم الله خيرا.وهدا هو طريق الانبياء فالداعي الى الحق يهاجم دائما.و من قال انهم يدعون الى الارهاب فقد كدب فشعارهم هو البسمة والرحمة.اما بالنسبة للوصلات الاشهارية فلا بد منها لتمويل القناة فالبرامج والعاملون عليها يستلزمون تكاليف.وبالنسبة للمشايخ فهم لا يتقاضون فلسا واحدا وقد صرحوا بدلك بانفسهم."
