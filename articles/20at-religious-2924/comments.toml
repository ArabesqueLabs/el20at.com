[[comments]]
order = 69
subject = "قناة الناس تحتاج الكثييييييير"
author = "الحوراء"
text = "بسم الله الرحمن الرحيم<br />اولا اود ان اوضح ان الاخ الكريم مجاهد شرارة لا يقصد الاساءة للقناة .. ومجرد ان تلفت انتباهه اذن فهي جديرة بالنقد وليس جدير بالنقد الا الجيد .. واوضح انه انما اراد رصد السلبيات لتلافيها ليس اكثر ولا اقل ..<br />تابعت قناة الناس لمدة طويلة من بداياتها تقريبا ..<br />مسالة اقالة المذيعات كانت موفقة جدا طبعا لان الكثيرات منهن لا يمتن بصلة للاعلام وعرض ازياء فعلا لعباءات مبهرجة واسلوب غريب جدا .. وهنا النقد الذي وجهه الاخ الكريم واضج جدا ..<br />فكيف اضع سياسة اذاعية ولا اطبقها<br />فامنع المذيعات انطلاقا من صوت المراة عوره وبعدها اسمح به في الاعلانات المختلفة ..<br />اما بالنسبة لخدمة الاس ام اس طبعا مع الاخ مجاهد كل الحق فمن السهل جدا اللعب بنساء المسلمين من خلالها ويبدو انه بلا رقابة مجرد جمع للمال ..<br />بالنسبة للشيوخ الافاضل فقد لاحظت من معظم من رد على النقال هجومه على الكاتب ظنا منهم انه هاجم الشيوخ !!<br />وهذا لم يحدث خلال المقال .. بل هم شيوخ اجلاء نسال الله ان يعز بهم الامة ويرزقنا الفائدة من علمهم الغزير ..<br />الفكرة ان القناة متخبطة ( ككقناة ) وليس كشيوخ اجلاء ..<br />تذكرني هذه القناة بشارع العزيز بالله في القاهرة<br />فتجد في الشارع كل انواع الكتب الدينية والمصاحف بكل طبعاتها والاسدلات والنقابات وكل ما هو اسلامي ولكن بشكل اهوج غيرمنظم .ز طاولات خشبية في الشوارع .. شماعات في كل مكان ..وكل شئ مع كل شئ ..<br />حتى المسجد يعاني من قلة النظافة بسبب مرتادية .. فعلا الاسلام برئ من كل هذا<br />نعم نريد للاسلام ان ينتشر<br />ونحبه ومن منطلق حبنا له لا ارضى ان يمر احدهم بشارع العزيز بالله ليقول ( اهو الاسلام قمة البدائية !! ) وقيلت ولا حرج هذا اضافة للمسجد الذي يصلي فيه كبار مشايخ قناة الناس وهوه يعاااني بشدة خصوصا مسجد السيدات ..<br />يجب ان ندرك ان الاسلام حقا محارب في كل مكان<br />وبالتالي يجب ان ندرك مدى الامانة التي نحملها على اعتااقنا حينما نقرر ان نظهره .. فيجب ان نظهره بصورة حسنة بلا اخلال ولا تشويه ..<br />نعم لن انسى ما سمعت للشيخ الفاضل محمد حسان او الشيخ الحويني او الشيخ خالد الجندي او الشيخ محمد حسان وغيرهم الكثير .. ولكن هنا يجب ان نتوقف ونفكر مليا في القالب الذيوضعناهم فيه<br />والله كلامهم اعز من ان ينشر بهذه الطريقة ..<br />الاسلام جميل جدا<br />راقي جدا<br />عزيز جدا<br />بالله عليكم لا تشوهوه ..<br />وفي النهاية بوركتم اخي الكريم مجاهد شرارة ..<br />ونحتاج المزيد من المقالات التي تظهر لنا العيوب لا من باب التشهير وغيره انما من باب النصح ومحاولة التعديل<br />جزاكم الله خيرا"
archived = "2010-03-14"
capture_url = ""

