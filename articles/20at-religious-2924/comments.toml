text = "والله انا فرجان صحيح في ناس بتنقد وفي ناس بتدافع وحسيت انه ماتش الاهلي والزمالك<br />عادي يا جماعه ناس ليها راي وناس ليها راي تاني زي ما في ناس معجبه بروتانا وناس مش بتعجبها روتانا عااادي خليكو فريش ... المهم قناه الناس<br />انا اذكر الحديث بتاع النبي صلي الله عليه وسلم الي بيقول : ان اول من تسعر بيهم الناس عالم ومنفق ( فلوس يعني ) وقارئ للقران طيب لما ربنا سئل العالم قال ليه قال ( قال الله ألم أتي العلم قال ماذا فعلت قال الرجل بلي تعلمت العلم وعلمته وكذب الرجل بس في كلمه فيك بمعني من اجلك يارب ) المهم ايه المهم ان الرجل علم يعني معني كده كل الي علمهم الرجل دخلوا النار ؟ اكيد لاء ممكن واحد منهم يدخل الجنه<br />طيب دلوقتي لو افترضنا صاحب القناه ده من اهل النار بس ممكن واحد من الي اتفرجوا علي القناه وتابوا يدخل الجنه<br />يبقي احنا ملناش دعوه ربنا هو الي يعلم قلوبهم نيتها ايه لينا الثمرة نيتهم بقا لله للمال ده شيء ربنا يحاسبهم عليه<br />اما التناقد في القناه<br />فالقناه بدءت قناه منوعات وبدءت بالتدريج تترك الحرام واحده واحده ( لله بقا او للناس ملناش دعوه اجنا لينا الثمره )<br />وكمان من علامات حب الله ان ينشر لها القبول<br />طيب الاخ صاحب المقال ربنا يكرمه ويهديني ويهديه عادي هو عايز يكتب موضوع يشد الانتباه عشان يتكتب عنده ويشوف اعلي الردود وعددها فعادي زي قناه دريم لما اتكلموا علي النقاب مثلا فعادي كبروا الكلاب تنبح والقافله تسير ( وطبعا انا مش اقصد صاحب المقال بس ياريت لو عايز يعمل فرقعه بلاش تكون علي الدين<br />وبلاش كمان يدخل في نوايه جد<br />اما بقا عن ذكر التيارات فعادي الاخوان مش عاجبهم السلف والصوفيه عجبهم الاخوان ولا التبليغ عجبهم الاخوان ولا السلف عاجبهم حد خالص<br />بس بالله عليكم ياريت قبل ما حد يتكلم في الدين 1- يبقي عارف بيقول ايه 2- يبقي عارف هو بيتكلم عن مين<br />عادي كل دي مناهج وفرق وربنا سبحانه سيفصل فيما كنت فيه تختلفون ..... وانا علي فكره قرأت كل الردود عشان مكررش الكلام<br />شكرا يا رجاله سي يو ان شاء الله<br />صحيح نصيحه مني للموقع في الدين بالذتت خلوا بالكم كم الفاظكم واذكركم بموضوع علي وفاطمه والعشق المؤدب هذه كلمه سافله لا تليق بمن تتحدث عنهم والكثير والكثير في الموقع لا ذكر ليه بس خلوا بالكم<br />سلام"
