text = "في كل ما قالته. بدءا من رأيها بالقناة وانتهاء بتقييمها لكاتب المقال.<br />انا لم أفهم كيف فهم كثير من الاخوة هنا ان كاتب المقال يهاجم الشيوخ؟!<br />وكيف فهموا انه يقوم بتشويه القناة؟!<br />لم أر اي هجوم من اي نوع هنا لا على شيوخ ولا على قناة وانما المقال هو محاولة لرصد القناة وذكر سلبياتها.<br />نعم يجب ان يهمنا كمسلمين ان نذكر السلبيات قبل الايجابيات لنصبح أفضل.<br />و جزاكم الله خيرا."
