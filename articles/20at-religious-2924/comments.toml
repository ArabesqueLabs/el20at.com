text = "رغم ان انا مسلم واسمى كمان محمد بس بصراحة انا مش بحب القناة دى<br />مع كامل احترامى لكل دعاة الاسلام اللى فيها بس انتم مش واخدين بالكم من حاجة<br />الشيوخ دول مش هما اللى بيدسروا القناة<br />كل شيخ فيهم ييجى يقدم برنامجة ويروح<br />لكن اللعب على الإدارة والإدارة تظهر فى الإعلانات<br />كمية اعلانات رهيبة شفنا مليون اعلان زيها قبل كدة<br />ده غير الخدمات المدفوعة الكتير اللى فيها<br />انا رأيى ان القناة بتتاجر بالدين بتستفيد بس بالفلوس المدفوعة<br />الله اعلم بالأجور بالنسبة للشيوخ او العاملين بها<br />لكن القناة قناة استثمارية استهلاكية<br />ولو خدتوا بالكم ان القناة بتعمل فى تترات البرامج موسيقى ده غير موسيقى المولد الشعبى المصرى<br />اما الشيوخ اكيد بما انهم علماء فى الدين فأكيد كل واحد له طباعة اللى بيحب ينفذها<br />مثلا أكيد شيخ زى محمد حسين او محمد حسان بيقولوا هما عايزين نظام برامجهم ازاى<br />وبالتالى القناة بتنفذ كلامهم<br />وبيتهيألى ان القناة لو جابت حد من المسئولين مثلا وهو ماعندوش اعتراض على ظهور مذيعة تعمل حوار معاه<br />فأكيد القناة هتعمل اللى هو عايزة او طالبة<br />القناة بتعمل المطلوب لتنفيذ المصالح مش اكتر ..........................................................................."
