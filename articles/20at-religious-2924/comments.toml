text = "السلام عليكم و رحمة الله و بركاته<br />أولا يأخذ عليك في المقال أنك لم تبين سوى عيوب القناة مع إن ميزاتها اكتر من عيوبها<br />ثانيا فين مصادرك على كلامك ؟<br />ثالثا إنت عملت كل المجهود دا لمحاربة قناة تدعوا إلى لا إله إلا الله محمد رسول الله بدل من أن تحارب قناة أخرى تدعوا الى العرى لا حول و لا قوة إلا بالله<br />بجد إسلوبك إسلوب تهكم جاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااامد جااااااامد<br />و فعلا انا من مؤيدي عدم وجود المذيعات لأنهم بيبعملوا الكتير من المخالفات الشريعة زي الميك اب و نمص الحواجب و الملابس الضيقة أو صارخة الألوان<br />غير كدا فيها إيه لما تدخل المكتب بتاع القناة و تلاقي ملتحين و منتقبات تلاقي ناس على سنة الحبيب المصطفى صلى الله عليه و سلم ألا تحب المصطفى صلى الله عليه و سلم ؟؟؟؟ جاوبني<br />إنت كنت عايز تدخل القناة و يستقبلك مغني و راقصة ؟؟؟؟؟؟؟؟؟؟<br />انت كمان أشرت لرسايل الإس إم إس إنها فيها طلبات جواز على فكرة مش كلها طلبات جواز و إنت كنت لا أرى فيها شئ طلبات الجواز في منها نصح و موعظة و بعدين فيها إيه لما رنات الموايل يبقى فيها أصوات الدعاة مش أحسن من الأغاني ناخد ذنوب في الناس غيرنا<br />و كمان لو لاحظت حتلاقي إن القناة ليها مشادة عالية جدا ما شاء الله من كافة طبقات الشعب و الحمد لله ما شاء الله لا قوة إلا بالله<br />على فكرة كتابتك للمقال حتخلي الناس اللي ميعرفوش عنها شئ يبحثوا عنها و يتابعوها دايما الممنوع مرغوب و اللهم أجعل عاقبة أمرنا رشدا<br />أخر شئ ممكن بس اعرف بالله عليك كتبت المقال دا ليه ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2010-03-14"
capture_url = ""

