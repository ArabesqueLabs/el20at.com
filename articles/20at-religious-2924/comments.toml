subject = "قناه تحتاج التطور"
author = "عادل طوبه"
text = "قناة الناس قناة جيده عليها كثير من الملاحظات هذا أمر صحيح ولكن هذه القناة وصلت لشيحه كبير من الناس لم تصل أو تتواصل معها كلاً من قناه أقرا والرساله بشكل جيد شريحة البسطاء ولايخفى على أحد من الناس أنهم حققوا نجاح فى هذا الجانب<br />-الا انى ارى انهم ينقصهم وضع هدف وخطه عمل للقناه حتى لاتسير بشكل عشوائى كما هى الان<br />-لابد من قبول عناصر جديدة تدخل فى القناة ولا تكون مقصوره على أصحاب فكر واحد (دخول مجموع من الشباب - والمذيعات الجيدين ) وأن يكون هناك الرأى والرأى الاخر"
