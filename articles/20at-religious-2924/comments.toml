[[comments]]
order = 88
subject = "لا تلبسوا الحق بالباطل"
author = "مسلم يغار على دينه"
text = "اولا\" يا أخ شرارة كنت أـمنى ان يكون الدافع لكتابتك هذا المقال هو الحرص على تحسين إعلام المسلمين \" والله أعلم بالنوايا \" ولكن طريقتك الهجومية التى بدأتها بذكر المؤهلات الدراسية للعلماء الأجلاء وأعتقد \"والله أعلم بالنوايا كما ذكرت\" أن هذا لزعزعة ثقة الناس بالشيوخ فلو كانت نيتك سليمة لكنت ذكرت مؤهلاتهم وشهاداتهم فى الجانب الدعوى أما ان كان هذا جهلا منك بمكانتهم العلمية فى مجال الدعوة أو إن \"كلامهم مش عاجب حضرتك \" فمن الإنصاف أن ترجع الى السيرة الذاتية لهم و أن لا تبخسهم حقهم .<br />ثانيا\" مايحدث فى الشئون الإدارية للقناة وموضوع تسريح المذيعات بعد الوعود بالعمل فى القناة \"وهذا إن كنت صادقا أو كان هذا الكلام من مصدر موثوق \" فهذا من شئون القناة والتى لا دخل للشيوخ فيها .<br />ثالثا أعتقد أن برامج القناة لا يشوبها عيب وأنها أفضل من القنوات التى تخصص حلقات من البرامج للكلام الأجوف والثرثرة وقصة حياة الممثل الفلانى وحكاية فلانة وعلان هذا غير محطات اللأغان والعرى وماشابه أظن أن هذة القنوات أحق أن نشوه سمعتها \"المشوهة أصلا\" وأن نبعد عنها الناس<br />أما الرد على الأخ مصراوى ومن شابهه من أصحاب تيار الإسلام هو ..الحل هل الإسلام عندك هو الحل للوصول الى \" تحت القبة \" وما بعدها ........... يبدو ذلك فإن الكلام عن أساسيات العبادات وكيفية الصلاة وعذاب القبر يعطلك عن تحقيق مبتغاك . انت تريد الكلام كله من نوعية \" يللا إاتحركوا ياشباب و..........كده \" من دون عبادة ولا يحزنون و من دون تحقيق المظهر الإسلامى أولا وتحقيق الإتباع للرسول الذى تريد نصرته \" ولو كلام الشيخ يعقوب والشيخ حسان متشدد ومش عاجبك يبقى راجع نفسك أو شوف شيخ تانى يعملك دين عمولة على مزاجك\"........... ثم مع إحترامى للأستاذ عمرو خالد \" إشمعنى يعنى عايزه هو وللا علشان بيقول الكلم اللى انت عايزه طيب ما هو الشيخ محمود المصرى موقوف وللا ده برضه كخة وبيضربوا بيه الاخوان المسلمين. وبعدين ان فى اراء مش عاجباك من السلفيين ده مش مبرر انك تقول عليهم التيار المتشدد لأن هؤلاء وأمثالهم هم الذين يمثلون الدين .<br />أما حثالة التعليقات التى تقول أنها قناة تنشر الإرهاب والتشدد فهؤلاء لا داعى لتضيييع الوقت للرد عليهم ......... ربنا يهديهم<br />كلمة أخيرة حتى أكون منصفا القناة لا تخلو من العيوب كأى قناة فالإعلانات المذكورة لاتليق وتشوه صورة القناة وبعض الإعلانات تفتقر الى الجودة الفنية<br />هذا بالإضافة الى شريط الsms التى تحتوى على بعض التجاوزات والذى أرجو من القناة إلغاءه<br />فى النهاية أرجو أن نكون أكثر غيرة على كل مايمثل ديننا الحنيف بداية من رسول الله عليه الصلاة والسلام والصحابة والتابعين ومرورا بالعلماء الاجلاء وانتهاءا باقل رمز او مظهر حتى لو كان السواك أو الإبتسام فى وجه المسلم وأن نتناول أى نقد بنية الحرص على هذا الديندون الخوض فى سمعة العلماء وأن يكون همنا هو تحسين الصورة<br />هذا وبالله التوفيق"
archived = "2010-03-14"
capture_url = ""

