text = "مين عادل امام الهجاص ده اللى انت بتاخد منه افكارك يا تافه، عادل امام ده مجرد اراجوز.<br />و بعدين الحقيقة الواضحة زى الشمس أن أحمد زويل اللى أنت بتمجده لم يقدم لنا أى شىء و إنما قدم أفكاره و أبحاثه للأمريكان و مازال حتى الآن ولاءه لأمريكا، و لم نأخذ منه إلا مجرد كلام فى الهجايص.<br />و ما تقولش هى مصر عملت له إيه علشان يديها لأنك بكده بتثبت أنك أنت اللى غرقان فى الجهل و التخلف و اللاوعى، لأنه لو ما كانش اتعلم فى المدارس و الجامعات المصرية ما كانش حد فى امريكا عبره، مش معقول كانوا هياخدوا واحد و يبدأوا معاه من الصفر لأنهم ما دام هيبدأوا من الصفر فعندهم ملايين الأمريكان ممكن يبدأوا معاهم، كل اللى بتعمله أمريكا أنها بتسرق العقول من عندنا و تستفيد بيها بس بعد ما تكون ضمنت أن ولاءهم أصبح لأمريكا مش لبلادهم الأصلية، أرجو أنك تكون فهمت يا حمار."
