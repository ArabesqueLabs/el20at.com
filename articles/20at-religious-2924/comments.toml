subject = "تعقيب"
author = "BATISTUTA"
text = "والله يا اخ مجاهد الواحد احتار معاكم انا بقالى فترة كبيرة مش بعلق عشان اتجنب الصدام مع اى معلق واريح دماغى وكل واحد حر فى نفسه .<br />أنا متفق مع كتير قالوا انك مش محايد اظهرت سليبات وعددتها بدون ذكر ميزة واحدة كأن الناس اللى بتابعها من كوكب تانى .<br />انا شايف ان قناة الناس مجرد بداية لطريق طويل جدا .<br />وبالنسبة لموضوع القناة بتكسب ولا لأ ايه العيب فى كده هو الاسلام حرم المكسب .<br />ومن خلال متابعتى القليلة لها مفيش شيخ سمعته كان بيتاجر فى الدين .<br />نقطه اخيرة هى موضوع sms فى منها مستفز لا يتناسب مع القناة .<br />الصورة الجيدة اللى كانت بتعجبنى الفاصل الطويل بعد الاذان عشان الصلاة .<br />نقدى للقناة انها منفصلة عن المسلمين فى العالم غير العرب وعدم اهتمامها بالاحداث الجارية"
