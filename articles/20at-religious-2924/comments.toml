text = "ممكن تكون هناك سلبيات المسؤال عنها فى النهاية افراد لكن احنا المهم عندنا هو الصالح العام فى النهايه<br />وانا كمشاهد عادى ارى قناة الناس قناة رائعة فى كثير من الامور رغم وجود بعض السلبيات واعتقد انها فى المستقبل سوف تنتهى اذا استمرت تلك القناة على تلك الاهداف اما من حيث اننى متخصص اعمل فى مجال الاعلام فان قناة الناس<br />كانت قادرة على فعل ما لم تفعله اى قناة اخرى دينية وهى بذلك فتحت المجال لقنوات اخرى قد تكون اكثر تقنية من قناة الناس وتسير على نفس النهج بشكل ايسر وافضل وانا فى راى فى النهاية ان الدال على الخير كفاعله"
