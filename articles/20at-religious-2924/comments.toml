[[comments]]
order = 11
subject = "اللهم أخرس ألسنة الطابور الخامس"
author = "عدو المنافقين"
posted = "2007-02-11"
text = "لماذا يكرهون وجود قناة إسلامية واحدة بالرغم من وجود قنوات كثيرة للسفالة .. هل لأنهم يكرهون الإسلام ؟؟!! و سلم لى على الطابور الخامس و المحافل الماسونية و نوادى الروتارى و الليونز و السفلة اللى بيسموا أنفسهم النخبة المثقفة بالرغم من أن هذه النخبة لم ينتخبها أحد من الشعب المصرى فهل هم يقصدون أنهم منتخبين من جهة شمعون و عيذرا و باقى خنازير الصهيونية العالمية و على فكرة هم يقولون ( المصقفة ) بالصاد و تفخيم الفاء و عندهم حق لأن أساتذتهم اليهود ما بيعرفوش مخارج الحروف العربية .<br />و فى حاجة مهمة مكتوب فى المقال أن الشيخ أبو إسحاق الحوينى قال أن صوت النساء عورة و والله الذى لا إله إلا هو سمعت الشيخ يقول بالحرف الواحد ( صوت النساء ليس بعورة ) فما رأيكم أصدق الشيخ نفسه و لا أصدق تلاميذ شمعون و عيذرا .<br />إذا القناة لا تعجبكم عندكم قنواتكم اتفرجوا عليها و اتركوا الناس تتفرج على القنوات النظيفة اللى مش عجباكم ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 12
subject = "اللى عايز يسمع سياسة عنده قنوات كتير بتتكلم فى الس"
author = "عدو المنافقين"
posted = "2007-02-12"
text = "الناس اللى عايزة القناة تتكلم فى السياسية .. طبعا دى ناس بتتستعبط . يعنى مثلا ما شفناش واحد بيطالب قنوات الأغانى و الأفلام أنها تتكلم فى السياسية . و لا علشان قنوات الأغانى و الأفلام بتدخل مزاجكم و ساعة ماحد يتكلم عن الدين عايزين تغيروا الموضوع ... يا مناااااااااااااااااااافقين !<br />فيه ناس بأى ما شاء الله عليهم تقولش بهااااااااااااااااااااااااااااااااااايم فاكرين أن اللى بيهاجم الشيعة بيهاجمها لحساب السعودية . شغلوا مخكم معايا يا ..... هم الشيعة بيقتلوا السعوديين و لا بيقتلوا العراقيين . إذا كان عندكم عقل كنتم عرفتم أن أى حد بيهاجم الشيعة بيهاجمهم لأنهم مجرمين مش لحساب السعودية و الكلام الفارغ ده .<br />و بما أن المنافقين جهلة و لا يقرأون التاريخ أقول لهم أن الفترة التاريخية التى سيطر فيها الشيعة على مكة كانوا يقتلون الحجاج بل بلغت بهم الوقاحة و السفالة إلى أن سرقوا الحجر الأسود .<br />الظاهر أن اللى مخلى الناس الصايعة و بتوع المزاج يحبوا الشيعة أن فيه فرقة من الشيعة اسمها الحشاشين لأنهم مشهورين بتعاطى الحشيش .<br />و الغريب أن فيه بهايم بيتكلموا عن الإرهاب فى القناة .. فين الإرهاب ده.<br />طبعا هم عايزين القناة تتكلم فى السياسية علشان يقولوا إرهابيين عايزين يمسكوا الحكم و يلبسونا هدوم و يغطوا عوراتنا و يعملوا فينا مش عارف إيه .. أنا عايز أسأل سؤال بسيط أنت شغالين لحساب مين ؟ يعنى أنتم شغالين لحساب جهات معادية للإسلام و لا أنتم سفلة كده و خلاص ."
archived = "2010-03-14"
capture_url = ""

