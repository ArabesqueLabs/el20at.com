subject = "أنا ذهبت لمقر قناة الناس وأعرف عنها جيداً"
author = "حازم خالد"
text = "السلام عليكم ورحمة الله وبركاته<br />أنا ذهبت لمقر القناة بالمهندسين (كشركة) وهذا لأني كنت أود المساهمة بما أستطيع لسماعي انها محدودة الدخل<br />ولكن أ/ عاطف رئيس القناة كان كما أتوقع فهو أبرز رفضه مبدأياً ولكن بعد الأصرار وافق رغم أنه قال \"صاحب القناة رجل أعمال ونحن نسعى لتحقيق المكسب له حتى يترك القناة دون التدخل في المحتوى\"<br />وكما تلاحظون فإن أ/ عاطف هدفة المادي فقط لأرضاء صاحب القناو وأبعاده عن المحتوى و التطوير بالقناة<br />والله المستعان على ما تقولون"
