[[comments]]
order = 18
subject = "اللهم لاتجازينا بذنوبنا فأنتى ارحم الراحمين"
author = "فارس القفاري"
text = "السلام عليكم ورحمة الله وبركاته....<br />هذي تحية الأسلام التي يسخرون فيها في فلام(كيف الحال)<br />اما عن رايي في الفلام فأنا لا اغرب من هذه الفلام فرسول الله صلى الله عليه وسلم اخبر عن الفتن في اخر الزمان وانها كقطع الليل المظلمه اما عن سخريتهم في اهل الدين فلا ابراء اهل الدين مافيه انسان معصوم من الخطاء الرسول اخطاء لكن لكن يكفينا منهم انهم يشيلون هم الأمه فليس من العقل ان ينتقد الأنسان شخص افضل منه قبل ان تنتقد اهل الدين اسأل نفسك مذا عملت لدينك امرت بمعروف نهيت عن منكر اتوقع حتى جهاد نفسه مايقدر عليها انا لااوريد ادخل في التفصيل لأن الفلم افكاره واضحه ومايختلف عليه عاقل لكن مذا نستفيد من هذه الأمور...وعمر التطور والرقي ماصار بفسخ الدين والحياء والتبرج بلعكس هذا يعتبر تخلف (ولا تبرجن تبرج الجاهلية الأول)وبالله التوفيق"
archived = "2010-03-14"
capture_url = ""
