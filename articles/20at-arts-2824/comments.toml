author = "اكتب اسمك هنا"
posted = "2007-12-11"
text = "أقسم بالله العظيم بأن هاذا الفلم ادهشني عندما شاهدت تقريبآ نصفه ولم أصدق أن الدول العربية بأمكانها تقديم كهاذا المستوى العالي من الأنتاج السينمائي علمآ بأن الفلم قمت بتحميله عن طريق الصدفة لكن وللأسف الشديد تبين أن الملف الذي حملته من الانترنت هوة نصف الفلم وليس كله وقبل قليل دخلت الى الأنترنت للبحث عن الجزء الثاني أي نصفه الثاني لكن للأسف لم أجده ولكن لن أيئس ولن يهداء لي بال حتى أجد النصف الثاني من هاذا الفلم الذي هوة أكثر من رائع وأن كان الأنتاج الأول بهاذا المستوى الرفيع فما حال الأنتاجات القادمة أحي كل من عمل على أنتاج هاذا الأنجاز الرائع ولهم مني أرق تحية متمنيآ لهم التوفيق والنجاح الدائم بأذن الله."
