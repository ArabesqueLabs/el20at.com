[[comments]]
order = 5
subject = "ربط الحزام - اى حزام - هل هو حزام العفة بتاع الروم"
author = "المنفلوطى بية"
posted = "2008-08-17"
text = "يطلع عليك لوح من بتوع المرور يقول لك مخالفة ياستاذ انت مش رابط الحزام<br />صحيح ربط الحزام موجود فى قوانين المرور العالمية - كلها بلا اثتثناء ولكن فى بلد مثل مصر السيارات قديمة وبدون مكيف وتحس كانك مربوط فى الكرسى بطريقة تضايق - مع ان فائدة الحزام هى ان تحمى جسد الانسان عند الاصطدام بسيارة اخرى وتكون السيارة مسرعةجدا فيطيرالجسم ويصطدم بزجاج السيارة<br />ولكن يا حسرة السرعة داخل القاهرة لا تتعدى 30 - 40 كيلو فى الساعة فما فائدة الحزام ولما التشدد<br />الحزام مطلوب وبشدة على الطرق السريعة والخارجية - ولكن داخل المدن ليس لة اى فائدة<br />وقال خبراء انة فى حالة حدوث حريق فى السيارة او انقلبت السيارة فى حادث فان الهروب يكون اسرع لمن لا يستخدم الحزام وينجو بحياتة - اما الذى يستخدم الحزام فانة على ما يفك الحزام او يغمى علية يكون زمن الهروب منالسيار المنقلبة او المحترقة قد انتهى<br />اخوانا فى المرور بلاش التشدد فى حكاية الحزام داخل المدن"
archived = "2008-08-18"
capture_url = "https://web.archive.org/web/20080818074659/http://masr.20at.com:80/newArticle.php?sid=17255"
