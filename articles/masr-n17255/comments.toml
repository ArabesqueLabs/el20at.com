order = 0
subject = "اعلات بندق بتاع وقفة مصرية - هو فية حاجة فى البلد"
author = "بندق"
posted = "2008-08-15"
text = "بندق بيطلع يقول المشكلة السكانية والاعلان يقول لك عايزين واقفةمصرية طيب يا عم بندق هو فية حاجة مش واقفة ما هو كلة واقف<br />قانون تفيدة بنت المثلث والشنطة دة مش اسمة قانون المرور دة اسمة قانون الارهاب - قانون الارهاب اللى كانوا بيناقشوة فى مجلس الحاج فتحى سرور<br />انا لفيت بلاد العالم كلها بصفتى اعمل فى البحر - فى حياتى كلها مشفتش بلد سواء متقدم او متأخر - شمال الصحراء او جنوب الصحراء - شفت لواء شرطة بينظم مرور فى ميدان - لواء شرطة مساعد وزير الداخلية نازل ينظم المرور فى الشارع - دة يبقى لا مؤاخذة معندوش شغل نازل يشتغل شغلة عسكرى وسايب التخطيط والتنظيم والادارة وجاى يشتغل شغلة عسكرى - خيبة تقيلة<br />تدخل مطار القاهرة تلاقى اللى قاعد بيختم الجوازات مقدم شرطة او عقيد شرطة - لية - ما كل دول العالم بيبقى عسكرى<br />او بعض الدول العربية زى دبى والشارقة والبحرين بيبقوا بنات منتسبات الى الشرطة<br />واحد زميل قال لى عقلية اللواء عندنا بتساوى عسكرى برةمصر وما يغركش شوية الصفيح اللى على كتفة<br />اعلانات خايبة وتدل على التخلف العميق<br />فين اشارات المرور - لمبة صفراء بتضرب فليشر اى بتنور وتطفى ودى معناها هدى شوية<br />فين علامات ممنوع الوقوف او الشارع اتجاة واحد<br />لا علاج<br />الا بتغيير راس السمكة الفاسدة - القيادات الجاهلة"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816003927/http://masr.20at.com:80/newArticle.php?sid=17255"

