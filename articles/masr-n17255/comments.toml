subject = "قانون ضعيف فارغ عبارة عن صورة قذرة من ابشع صور الت"
author = "ممدوح زخارى_الاسكندرية-مصر  (z"
posted = "2008-08-15"
text = "عند تطبيق القانون لصالح الجميع؟<br />الدولة غير محتاجة الى حملات الارشاد و الندوات و المناقشات لترشيد الشعب؟؟؟<br />ليطبق القانون بكل شدة<br />و ليكن شعار الدولة هو(القانون فوق الجميع) دون اى صور من صور الاستثناءات القذرة المقيتة و لنكن دولة متحضرة حقا و ليست دولة شعارات جوفاء؟؟؟<br />مع عميق اعتزارى للفنان عادل امام(بلد بتاعة شهادات) اما الان فاصبحنا (بلد بتاعة شعارات صحيح)"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816003927/http://masr.20at.com:80/newArticle.php?sid=17255"

[[comments]]
order = 2
subject = "المصادرة هى الحل؟؟؟"
author = "ممدوح زخارى_الاسكندرية -مصر"
posted = "2008-08-15"
text = "لبسط سلطة الدولة و لتطبيق القانون لمازا لا تطبق الدولة اسلوب مصادرة سيارات كل من يكسر و يخالف قانون المرور<br />للاسف السديد نحن شعب معقد نفسيا و يخاف و لا يختشى او حتى يستحى؟؟؟؟؟<br />لا يخاف الا باسلوب (سيف المعين و ليس ذهبة)<br />شعب يحب و يحترم و يخاف الحاكم الديكتاتور الظالم الباطش امثال صدام حسين<br />الضرب بيد من حديد و سوف تجدون القانون القانون هو القانون<br />مع الاعتزار للشعار اياة(الاسلام هو الحل) و ليسامحنا اللة جميعا"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816003927/http://masr.20at.com:80/newArticle.php?sid=17255"

