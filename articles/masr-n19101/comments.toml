text = "يا سوسو قلب الاسد ما تتريقيش على الرقاصين<br />احدمي ربنا انك ما طلعتيش رقاصه<br />دول بيرقصوا وهما بيعيطوا<br />بيرقصوا وهما جعانين<br />او بيرقصوا لحساب غيرهم يا سوسو"
