[[comments]]
order = 10
subject = "ما تسمع منهم يا تامر"
author = "غدير (هولي لف)"
text = "يا تامر هدول ناس تافهين اللي كتبولك التعليقات<br />شو دخلهم في خدمتك هيك همه العرب حثالة<br />دايما بدور على الأخطاء بس عشان يقولوها<br />تذكرت جملتك في 90 دقيقة فعلا معك حق الشيء المنيح ما بشكروه وبدورزا على الخطأ<br />مشاعرك وصلت لقلوبنا وأغنيتك حلوة كتير أحلى أغنية تغنت لفلسطين<br />بدون مجاملة<br />إنت إنسان موهوب وحساس<br />الله يحميك ويهديك<br />يا تامر إنت كمان أخونا اللي بنحبه وبندعيله وبنخاف عليه<br />وعن نفسي بقول وأكيد في ناس متلي<br />بخاف عليك من قلبي<br />يا تامر ما تسمع كلام اللي بذموك خلي ثقتك بنفسك أكبر<br />وياخوي الحبيب إلتزم أكثر بالدين لإني انا كمان بتعذب لما اشوفك بتغلط<br />وأنا بقول يا رب مش عارفه أنا أعمل إيه وبعنيها متل ما عنيتها إنت وأنا مقهورة<br />وبقول شايفة أخوي بضل وانا بتفرج عليه مش طالع بغيدي إشي أعمله<br />الا إني أدعيلك<br />يا رب يا حبيبي إهدي تامر غنك سميع مجيب الدعاء"
archived = "2009-03-16"
capture_url = "https://web.archive.org/web/20090316040514/http://masr.20at.com:80/newArticle.php?sid=19101"

[[comments]]
order = 11
subject = "لكل من كتب تعليق لتامر"
author = "غدير هولي لف"
text = "إنما الأمم الأخلاق ما بقيت فإن هم ذهبت أخلاقهم ذهبوا<br />عشان هيك بلادنا مش راضيه ترجع لنه في كتير من أمثالكم الا لا يكتر من أمثالكم<br />الدين خزات العين بشر منكم<br />حوطتكم بالله<br />إشي برفع الراس"
archived = "2009-03-16"
capture_url = "https://web.archive.org/web/20090316040514/http://masr.20at.com:80/newArticle.php?sid=19101"

