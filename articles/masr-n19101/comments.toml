[[comments]]
order = 1
subject = "كداب يا خيشة"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "طيب تقدر تقول لنا لية انت زورت شهادة تادية الخدمة الوطنية العسكرية يا ابن الكلب يا جبان يا خول<br />طبعا علشان انت جبان لتنخرط فى الخدمة الوطنية العسكرية؟<br />تعرف اية؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />علشان انت خول و جبان و ابن مليون و سخة يا مغنواتى يا مشخصاتى<br />اتفوا عليك يا مخنث يا نمرة (9)"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119105708/http://masr.20at.com:80/newArticle.php?sid=19101"

[[comments]]
order = 2
subject = "الاستقلا التام أو الرقصصصص الذؤام"
author = "سوسو قلب الاسد"
text = "انا قرأت فى احدى الصحف ان الراقصه دينا ستقيم حفلة رقص سيخصص ايرادها بالكامل لاهل غزه تضامنا مع المقاومه فياليت كل الفنانين يحذون حذو هؤلاء الابطال والنشامى امثال تامر وروبى ونانسى حتى يتحقق الحلم ونحرر كل فلسطين من النهر الى البحر----- ورقصنى ياجدع"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119105708/http://masr.20at.com:80/newArticle.php?sid=19101"

