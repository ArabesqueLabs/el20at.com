subject = "كلام * كلام*......."
author = "عبد الرحمن الهنداوي"
text = "زى ما الناس بتقول الكلام مش عليه ضرايب ..... وأذا كان الأشخاص اللى بيساندوا فلسطين ويعينوها هم نفس الأشخاص اللى بيهدموا فى بلدنا .... فأكيد النهاية معروفة من غير مبالغة .... وفعلا فلسطين محتاجه اغانى ورقص علشان تتحرر"
