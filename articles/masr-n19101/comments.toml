[[comments]]
order = 6
subject = "التراب واحد، و الموقف مختلف"
author = "أحمد بلال"
text = "ترابنا العربي، تراباً واحداً هكذا أؤمن، أما تامر فيؤمن بالمسألة على طريقته، فالتضامن مع التراب المصري يستوجب الالتحاق بالخدمة العسكرية و عدم الهرب منها سواء بالتزوير كما فعل أو بأي طريقة أخرى، و هو نوع التضامن الذي لم يستهوي تامر بك.<br />أما التضامن مع فلسطين، فلا يستوجب القيام بخدمة عسكرية و لا شيء، فقط يكفي \\\"المتضامن\\\" كلمتين فارغتين من أي مضمون ليعلن تضامنه الحنجوري، و هو نوع التضامن الذي اقتنع به تامر، فالأمر لن يكلفه شيء و لن يحتاج تضحية، بل سيزيده شهرة، و هو ما يسعى أي مؤدي أغاني للحصول عليه."
archived = "2009-02-12"
capture_url = "https://web.archive.org/web/20090212173258/http://masr.20at.com:80/newArticle.php?sid=19101"

