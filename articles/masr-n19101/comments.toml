subject = "نتضامن بس بالكلام والشعور الطيب"
author = "----"
text = "لو كان اقتصادنا كويس<br />وعندنا امكانيات -- كنا ساعدنا اكتر من كدة<br />ولكن<br />ايد قصيرة والعين بصيرة<br />وطالما اسرائيل موجودة فيوم للثور الابيض ويوم للثور الاحمر ويوم للثور الاسود<br />والدور جاى<br />وكل واحد يستعد"
