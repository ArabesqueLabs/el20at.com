[[comments]]
order = 0
subject = "من صدق النبوة مجالسة الفقراء"
author = "مش ححبك"
posted = "2008-07-03"
text = "حامل رسالة النبي صلى الله عليه وسلم الى المقوقس عظيم القبط بمصر لدعوته الى الاسلام فوجىء بالمقوقس يساله اسئلة عن النبي محمد صلى الله عليه وسلم ومن ضمن الاسئلة<br />من يجالس هذا النبي صلى الله عليه وسلم<br />فلما عرف انه يجالس الفقراء تأكد من نبوته صلوات الله وسلامه عليه<br />بلا عبدالوهاب المسيري بلا يوسف القرضاوي بلا ربعة العدوية بلا بطيخ<br />اصحو بقا واعرفوا دينكم بقا<br />اعرفوا حقوق الناس الغلابه اللي مش لاقيه تشتري حتى الدوا<br />فيه ناس بتموت يا اخوانا من الجوع ومن المرض<br />وفيه ناس بتاجر في كل شيء حتى في الدين علشان خاطر يبقوا اغنيا<br />اصحا يا شعب وسيبك من التدين المظهري الخالي من المضمون<br />مضمون الدين هو ان الغني ينصر الفقير القوي ينصر الضعيف اللي معاه يدي اللي ما معهوش<br />بلا رابعة العدوية بلا عمر خالد بلا بطيخ"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182042/http://masr.20at.com:80/newArticle.php?sid=16611"

[[comments]]
order = 1
subject = "الاسلام هو الحل"
author = "مصرى مش شيوعى ولا اخوانى"
posted = "2008-07-03"
text = "الاسلام هو الحل - وليس المعنى قطع يد السارق وجلد الزانى وجماعة الامر بالمعروف التى تضرب من لا يصلى<br />كلا<br />الاسلام هو الحل بمعنى ان للفقير حق التعليم والعلاج والعمل<br />الاسلام هو الحل بحيث يضرب المفسدين والمحتكرين بيد من حديد<br />الاسلام هو الحل - بحيث تحترم ادامية الناس فى اقسام الشرطة ومن يروع واحدا من الشعب يلقى الجزاء القاسى<br />الاسلام هو الحل بحيث يحاسب الذين سرقوا وباعوا ممتلكات وشركات ومصانع وبنوك الشعب الى الشركات اليهودية العالمية<br />الاسلام هو الحل لاختيار الحاكم العادل المخلص للبلد وليس عميل للامريكان<br />الاسلام هو الحل - ليس من بات جارة جائع وهوشبعان<br />الاسلام هو الحل"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182042/http://masr.20at.com:80/newArticle.php?sid=16611"

[[comments]]
order = 2
subject = "مضمون الدين هو نصرة الضعيف"
author = "مس نافص"
posted = "2008-07-04"
text = "مضمون الدين هو نصرة الضعيف والمحتاج والمريض.. الى اخ<br />الجنازة دي جنازة سياسية<br />تدين مظهري<br />لما نشوف الناس اللي تحت قاعدين مع الناس اللي فوق<br />والناس اللي فوق بيساعدوا الناس اللي تحت<br />يبقى فعلا فيه دين<br />المفروض عمرو خالد يدعو الى ذلك<br />بيدعو الى التعايش المسلم مع المسيحي وراح للبابا شنوده<br />لا والنبي يا عم عمور عايزين حته داخلية حته وحدة وطنية بين الاغنياء والفقراء بين اغنياء المسلمين وفقراء المسلمين<br />عمر الد والمرشد العام ومحمد حسان ومحمد حسين يعقوب وشيخ الازهر وكل اللي عاملين نفسهم دعاه الى اله<br />فيه حاجه اسمها نصرةالضعيف<br />وانا سمعت مقولة على قناة الرسالة لشيخ سوري اسمه النابلسي<br />قال امة نصرت ضعفائها فنصرها الله على عوها"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182042/http://masr.20at.com:80/newArticle.php?sid=16611"

[[comments]]
order = 3
subject = "بعيدا عن اوساخ السياسيين"
author = "من الفقراء الشرفاء"
posted = "2008-07-04"
text = "شهد جنازتك افاضل الامة وعلمائها<br />وابتعد عن الجنازة الحرامية واتباع شارون واولمرت وباراك<br />مشى فقراء الناس فى جنازتك<br />من المؤمنين رجال صدقوا ما عاهدوا اللة علية منهم منقضى نحبة ومنهم من ينتظر وما بدلوا تبديلا<br />تحية لشهيد الوطن<br />والموت والخزى والعار لاتباع شارون واولمرت وتوريدالغاز لاسرائيل بالمجان"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182042/http://masr.20at.com:80/newArticle.php?sid=16611"

[[comments]]
order = 4
subject = "مش عارفين"
author = "ابو اسامة"
posted = "2008-07-04"
text = "الظاهر ان الاخوة اللى بيعلقوا مش عارفين هما بيتكلموا عن مين ولا ايه مواقفه عبد الوهاب المسيرى هو<br />من دافع عن الفقراء واصحاب البلد وانضم الى حركة كفاية من اجلهم ثانيا عبد الوهاب المسيرى لم يكن غنيا وكان يعالج على نفقة امير بعد ان رفضت الدولة علاجه وهو كاتب اسلامى ومفكر ومبدع و اخيرا انظروا الى من حضر جنازته<br />فهم اخر الرجال المحترمين وانظروا الى من غاب عن جنازته اهل السلطة وكلابها وذلك لتعرفوا ان الرجل كان فى جانب الحق<br />علشان كدة الظلمة غابوا عن تشيعه ."
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182042/http://masr.20at.com:80/newArticle.php?sid=16611"

[[comments]]
order = 5
subject = "اللهم ارحم المسيري"
author = "من السعودية"
posted = "2008-07-05"
text = "اللهم ارحم عبدك المسيري .. اللهم اجعل قبره روضة من رياض الجنة .. اللهم ارزقه الفردوس من غير حساب ..<br />لا أبالغ إذا قلت أنه من آخر الشرفاء .. اللهم ارحمنا ."
archived = "2008-07-06"
capture_url = "https://web.archive.org/web/20080706193704/http://masr.20at.com:80/newArticle.php?sid=16611"

[[comments]]
order = 6
subject = "رحم الله عبده عبد الوهاب"
author = "محمد عبد المقصود"
posted = "2008-07-07"
text = "موت العظماء أصحاب الرسالات يحي الأمة ويوقظ الهمة في شبابها والمخلصين من أبنائها وصدق الشهيد سيد قطب عندما قال ( ان كلماتنا عرائس من شمع فاذا متنا في سبيلها دبت فيها الحياة ) وهكذا موت العظماء حياة لأفكارهم ورغم ما قدمه المسيري رحمه الله فان لم يمن له من اعمال سوي فضح الصهيونية وكشف سوءاتها خاصة موسوعته الشهيرة كذلك مواقفه الوطنية لجمع الامة ورأب الصدع من اجل الاصلاح لكفته واقول للمغرضين الذين لا يعرفون قدر الرجال اصمطوا حتى لا تفضحوا انفسكم فمن ينكر الشمس في وضح النهار فهو اعمى وحضور كل هذا الحشد من الوطنيين والاسلاميين دليل صدق وشهادة حق للرجل .<br />وانت يا استاذ خباب اوجه لك شكرا خاصا وحارا على وصفك الدقيق ولمحاتك الصحفية الرائعة فقد عشت الجنازة وكأني كنت فيها من خلال كلمات البسيطة والدقيقة المعبرة فهنيئا لك وادعو الله ان يثبتك ويوفقك وان اراك اكبر صحفي في هذه البلاد اللهم آمين<br />وإلى اللقاء يا ابو حبيبة جدو محمد"
archived = "2008-07-08"
capture_url = "https://web.archive.org/web/20080708041502/http://masr.20at.com:80/newArticle.php?sid=16611"
