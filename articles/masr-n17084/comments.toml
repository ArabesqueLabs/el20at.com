[[comments]]
order = 0
subject = "كفى هراء لا و لن تسحب او تسقط جنسية دكتور/سعد الدين ابراهيم"
author = "ممدوح زكى زخارى جرجس/الاسكندرية_مصر"
text = "جنسية دكتور /سعد الدين أبراهيم محمية و مصانة بالدستور و القانون<br />لا يستطيع اى مسئول فى مصر باسقاط او سحب الجنسية من دكتور/سعد الدين أبراهيم<br />كفى مهاترات و أصطناع أدوار البطولة و الوطنية فى قضايا حضارية اصحابها فى غنى عن الخوض فيها<br />و كلى ثقة من هذة العوى القضائية سوف تقبل شكلا من مجلس الدولة و لكنها سوف ترفض قانونا و دستوريا؟<br />و لمازا هئولاء ما يدعون انفسهم بابطال مصر لم يتقدموا أصلا بمثل هذة القضايا سابقا لاسقاط الجنسية مثلا عن كلا من و ذلك على سبيل المثال و ليس الحصر:_<br />عبود الزمر<br />الشيخ /عمر عبد الرحمن<br />أيمن الظواهرى.......................................و مئات أخرين<br />أتقوا اللة فى مصر و دستورها و قانونهو سمعتها و سمعة شعبها"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123301/http://masr.20at.com:80/newArticle.php?sid=17084"

