[[comments]]
order = 2
subject = "الى ممدوح زكى زخارى جرجس/الاسكندرية_مصر"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "يا انكل زخاري جرجس عدد المسلمين في مصر 94% من عدد السكان بشهادة المخابرات الامريكية<br />فلما تيجي تتكلم عن مصر لازم تحط في اعتبارك ان مصر دولة اسلامية<br />وشكرا"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123301/http://masr.20at.com:80/newArticle.php?sid=17084"

[[comments]]
order = 3
subject = "جاهل و غبى و مضلل كل من يثق فى تقارير المخابرات الامريكية"
author = "ممدوح زكى زخارى جرجس/الاسكندرية _مصر"
text = "اننى مصرى قبل ان تكون انت و اسرئك و اجداد اهللك مصريين<br />لا يهمنى ان يكون تعداد المسلمين فى مصر 94% هو حتى 100000000000000000000000000000000%<br />المهم ان يكون المصريين فى مصر سواء مسلمين او مسحيين او حتى يهود مخلصين للوطن و العقيدة ايا كانت<br />و ليكن ولائنا لمصر فوق كل اعتبار رغم اختلاف المذاهب و الاراء<br />(الدين للة و الوطن للجميع)<br />أحبوا و طنكم مصر ستركم و رحكم اللة أيها المئمنون"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123301/http://masr.20at.com:80/newArticle.php?sid=17084"

[[comments]]
order = 4
subject = "نحن وانتم فى قارب واحد ولكن لنا عتاب"
author = "ماشى"
text = "يا اخ زخارى نحن بيننا مودة واحيانا معزة ولكن ما يحز فى النفس هو اقوال لبعض الجهلة من ان الاقباط اصل البلد والمسلمين غرباء وسياتى اليوم الذى تنصروهم كما حدث فى اسبانيا<br />الكلام دة عيب وبيعمل كراهية وبيشحن النفوس بالحقد<br />على العموم مرحبا بك معللقا ونحن نقرأا رايك بكل ثقة<br />المهم تكون مصرى اصيل وولائك لمصر والفقراء من شعب مصر<br />ولك تحياتى"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123301/http://masr.20at.com:80/newArticle.php?sid=17084"

[[comments]]
order = 5
subject = "عيب و احترم اختيار افكارك و كلماتك النابية"
author = "ممدوح زكى زخارى جرجس/الاسكندرية_مصر"
text = "الى الاخ /شايف عديم النظر و اعمى العين و البصيرة<br />لقد اخطات كثيرا فى حق مهاجرى المهجرو اقباط المهجر وطلبت اسقاط الجنسية عنهم و معاملتهم معاملة الكلاب؟<br />باللة عليك الا تستحى من كلماتك السوقية الهابطة المتدنية و التى تعادى بها السامية و التى جميعنا ننتمى اليها<br />ليكن مع8لوما لديك ان :_<br />دكتور احمد زويل مسلم يحمل الجنسية الامريكية؟هل تستطيع ان تطالب باسقاط الجنسية عنة؟او حتى تكون لك الجراءة بوصفة بالكلب؟؟؟<br />انا ثقة من انك حقا اخطات فى حق مئات من ابناء مصر المبدعين امثال زويل-مجدى يعقوب-البرادعىو الاف اخرين<br />و كل من يصف اى انسان بانة كلب لا بد ان يكون هو الكلب<br />(الكيل اللذى تكيلون بة يكال لكم و يزاد)<br />و انتهى الدرس ياغبى"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123301/http://masr.20at.com:80/newArticle.php?sid=17084"

[[comments]]
order = 6
subject = "هل حقا تمتلك الشجاعة بان تصف بنماء المهجر بالكلاب"
author = "ممدوح زكى زخارى جرجس/الاسكندرية_مصر"
text = "يامن تدعى انك/ شايف<br />هل تجروء على و صف اى مصرى سواء كان مسلم او مسيحى او حتى يهودى بانة كلب؟<br />لا اعتقد ذلك؟<br />انك جبان اخطات فى حق زاتك ووطنك و نفسك<br />الادب فضل على العلم<br />انك جاهل و عير متعلم لانك احمق بوصف كافة مهاجرين المهجر بالكلاب سواء كانو مسلمين او مسحيين"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123301/http://masr.20at.com:80/newArticle.php?sid=17084"

[[comments]]
order = 7
subject = "حقا انك الكلب و الخنزير معا"
author = "ممدوح زكى زخارى جرجس/الاسكندرية_مصر"
text = "لا اعتقد انك حقا تدعى /شايف<br />يا من تصف ابناء و طنك بالكرب و الخنازير<br />(اذ لم تستح فقل ما شئت)<br />الكلاب و الخنازير هم الاسرة التى لم تستطع تربيتك<br />ارجوك انظر جيدا فى المراة و قل لى هل انك كلب ام خنزير؟؟؟<br />الكلاب و الخنازير يتبرئون بان تكون واحد منهم ايها الفاشل"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123301/http://masr.20at.com:80/newArticle.php?sid=17084"

[[comments]]
order = 8
subject = "fa.gh254@yahoo.com"
author = "فتحى غريب ابوغريب"
text = "من يطلب سحب الجنسيه عن سعد الدين إبراهيم هو جاهل فى القانون وعديم معرفه بألدستور,ولكن لان دستور بلادنا<br />مهلل ويتم تفصيله حسب الطلب فـأعتقد أن جهبز دستورى سوف يمرره بطلب تفسير ملهم ليصفق المجلس المنكوب ويرقص<br />فاتحاُ فمه لتمريره ,والشعب ملخوم فى لقمه عيشه وعمره ضايع فى الطوابير ,يبقى على بركه الله سعد الدين لو عاوزينه يبقى هندى ماشى."
archived = "2008-10-02"
capture_url = "https://web.archive.org/web/20081002140556/http://masr.20at.com:80/newArticle.php?sid=17084"
