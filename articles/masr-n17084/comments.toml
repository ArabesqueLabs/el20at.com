text = "الراجل دة بيحمل الجنسية الامريكية<br />وانا ارى ان كل من يحمل جنسية مزدوجة تسقط عنة الجنسية المصرية ككلاب المهجر او خنازير المهجر<br />ر"
archived = "2008-08-13"
