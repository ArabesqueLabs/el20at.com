[[comments]]
order = 1
subject = "واين الاقباط الان من الاضرابات ومحاولات تغيير الحكم والغليان فى البلد"
author = "مش سامع"
text = "عندما قامت الثورة لم يشارك ضابط قبطى واحد - كلهم ملتزمون وعندهم طاعة للنظام وولاء للحاكم ايا كان<br />وبعد نجاح الثورة ملئوا الدنيا كلام بان الثورةلم تعطيهم مناصب ولا وظائف مهمة<br />الحراك السياسى الان بين الشعب والنظام - الاقباط ملتزمون بالحياد الكامل ورأيهم مسلمون بياكلوا فى بعض و احنا نتفرج<br />عندما تنجح جماهير الشعب فى التخلص من النظام عليهم الاقباط الصمت - فلا وظائف مهمة لا يحزنون<br />فى حركة كفاية اتنين او تلاتة من الاقباط الوطنيين ولهم كل الاحترام<br />اما الباقى<br />فيا قلبى لا تحزن-"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421195040/http://masr.20at.com:80/newArticle.php?sid=15316"
