[[comments]]
order = 0
subject = "يلا قولوا ورايا"
author = "الله اكبر ولله الحمد"
text = "الله غايتنا<br />والرسول زعيمنا<br />والقران دستورنا<br />والجهاد سبيلنا<br />والموت في سبيل الله اسمى امانينا"
