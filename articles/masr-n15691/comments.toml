[[comments]]
order = 2
subject = "الحكام الفعليون لمصر فى لاظوغلى"
author = "خريج لاظوغلى"
text = "لاظوغلى مقر الحكم فى مصر<br />منة تصدر قرارات اختيار الوزراء والمحافظين وعمداء الكليات وطلبة الكليات العسكرية وحكام المدن ورؤساء الاحياء والعمد<br />انما الجالس فى شرم الشيخ فهذا فسوخة او زر الطربوش<br />كما ان هناك منتجع 5 نجوم فى لاظوغلى زى بتاع الشرم بس على افخم يتم فية عمل مساج للقفا بايدى مدربة جيدا<br />وكذلك تنشيط الجسم بالتعليق من القدمين والضرب بالكرباج واحيانا الصعق بالكهرباء وفى بعض الاحيان ولراحة الزبون يتم اغتصابة وكلة للمصلحة العامة ولامن الشعب<br />فيس بوك اية يا عم انت واية فايدة الكلام فى الفيس بوك<br />دا البلد ممسوكة بايد من حديد<br />وشوية العيال بتوع الفيس بوك هيعملوا اية مع جنرلات الصعق والاغتصاب<br />انت عارف البنت اللى اسمها اسراء عبد الفتاح قالوا لها اية<br />لو فتحتى بقك هنغتصبك<br />هنغتصبك بواسطة العسكرى الجلمف المتخلف عقليا الواقف امامك<br />تخيل بنت زى بالبراءة والنقاء تواجة الاغتصاب<br />ابعد عن الفيس بوك"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510152907/http://masr.20at.com:80/newArticle.php?sid=15691"

[[comments]]
order = 3
subject = "نقلا من مدونة باسم طنطاوى وكلام عن تصدير الغاز وتصريح ل بسلامتة بيقول"
author = "سمارة"
text = "ايها المصريون الزعلانون من مشروع نقل الغاز الى الشقيقة اسرائيل<br />دة تخطيط جامد قوى احنا عاملينة ودة شغل كبير احنا بنعمل كدة علشان لما الانابيب توصل لاسرائيل نروح مولعين فى خط الغاز ونحرق اسرائيل ونخلص - تحيا مصر - تحيا مصر"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510152907/http://masr.20at.com:80/newArticle.php?sid=15691"
