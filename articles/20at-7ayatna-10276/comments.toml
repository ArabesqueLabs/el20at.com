subject = "مصري فى دبي"
author = "أحمد الجن"
posted = "2008-10-17"
text = "أنا مصرى أعيش فى دبي وهذا لايمنع أنى أحب بلدى وبداخلى شوق كبير إليها ولا يمكن أن تحل أى بلد أخرى مهما كانت جميلة أو أحبها مكان بلدى أم الدنيا مصر , وذلك مع عدم رضايا عن معظم الأحوال فى مصر , ومع كل الصعوبات والفقر الذى يعيشه أهلى وأهل الكثيرين بمصر .<br />على الرغم أنى مع كل أجازه لأنزل بلدى الحبيب أحس بهم كبير وإحساس ليس من المفروض أن أحسه وذلك لتركى كل أسليب الترفيه هنا ونزولى الى مصر للفوضى كما قال المراسل !!!!!!!!!!!!!!!!!!!!!!!!!"
