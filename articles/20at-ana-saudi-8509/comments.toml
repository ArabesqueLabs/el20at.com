[[comments]]
order = 2
subject = "انا برضو"
author = "الي الأستاذه الدلوعة مروة هانم"
posted = "2008-03-17"
text = "في شيء محيريني بصراحه هي ليه مروة عبد الفضيل مدلعة اوي في موقع عشرينات من الكل سواء الأستاذ الطحاوي او الأستاذه شيرين وطبعا قبلهم الأستاذ محمد فاروق بتاع الديسك وبينزلها كل يومين تقريبا موضوع ومره فتحت صفحة ولاد البلد لاقيت لها 3 موضوعات مره واحده اه هي شغلها بصراحه نضيف جدا وعينيها بتشوف حاجات ممكن مش اي حد يلاحظها وتعمل عليها موضوع بس في ناس تانية من حقعا الظهور وكفاية على مروة كده اتلمعت بما فيه الكفاية يا ريت تشوفلنا حد تانى تلمعوه اقول هذا ولا اخفي حتى لا اكون متجني علي مروة انها والله يعلم مدى حرصي على متابعة شغلها عشان الأسباب اللي قلت عليها وربنا يوفقك بس عايزين دم جديد ربنا يوفقهم برضو"
archived = "2010-03-14"
capture_url = ""
