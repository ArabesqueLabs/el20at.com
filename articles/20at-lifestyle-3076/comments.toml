subject = "مش بأدينا"
author = "ادم المهدى"
posted = "2007-01-19"
text = "سلام عليكم<br />ساعات كتير الهجران مش بيكون بأدينا ساعات بيكون غصب عننا ، لكن يمكن لو الاجساد تفترق و لكن كما قال الحديث الضريف(الارواح جنود مجندة ما تعارف منا أئتلف و ما مناكر منها أختلف) او كما قال رسول الله (صلى الله عليه و سلم)<br />يعنى عندك الاعتقالات اللى بتحصل للناس كل شويه من حكومتنا كل شويه ، بتفرق الولد عن والده و الوالد عن ولده و الاخ عن اخوه ويمك نبيكون صعب علينا لان الموضوع مش بأدينا لكن مأدمناش حل غير الدعاء و الصبر (وصبر جميل و الله المستعان)<br />اللهم فك اسر اخى (حمد ) و هو من طلاب الازهر المعتقلين و مع العلم انه اول دفعته الثلاث سنوات اللى فاتت ...لكن...حسبى الله و نعم الوكيل..<br />http://ademelmahdy.blogspot.com/"
