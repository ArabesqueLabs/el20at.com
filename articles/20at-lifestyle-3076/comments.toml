subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا   الوهم"
posted = "2007-01-21"
text = "الحقيقه ان الفراق شء اكيد في حياتنا حتي لو كان حلم حيانتا ان احنا ما نفترقش<br />انا عشت اجمل علاقه صداقه كنا اتنين وعملنا جروب فوق العشرين فرد وفضلت علاقاتنا قويه وجميله لاكثر من تسع سنوات بعد التخرج والشغل وكنا بتقابل في كل المناسبات ومتمسكين قوي بدة بس للاسف حصل اني اختلفت مع احدهم وتخيلوا مين مؤسس الشله معايا بس دا لم يكن اختلاف عادي انما حسيت انه خدعني وكدب عليا وشوفت صورة له ما تخيلت انها ليه وكان السؤال ..<br />يا تري هو اتغير للنقيض تماما من الصدق والاخلاص للكدب والغش ولا انا عمري ما عرفته اصلا<br />وكانت صدمه حياتي اللي لسه مأثرة عليا لحد الان ومش قدرة اثق في حد تاني .<br />حتي لما ارتبط فضل عدم الثقه مسيطر علي حياتي وفشلت حتي في جوازي .<br />كنت فاكرة اننا عمرنا ما هنفترق.بس للاسف دلوقتي بقول يا رتنا ما اتقابلنا ......"
