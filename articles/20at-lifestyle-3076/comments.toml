[[comments]]
order = 4
subject = "بس الحمد لله ..قدر ربنا دايما خير"
author = "محمد السيد"
posted = "2007-01-19"
text = "آآآآآآآآآآآآآه .. ليه بس كده با بنتي ؟؟؟؟<br />أظن العنوان ده ..لو طبقتيه عليا ..حيكون الكام سنة بتوع الكلية ...<br />من الأول كنت عارف إن كل الصداقات والمعارف اللي حأكونها هناك حتروح بعد كده ... وعشان كده مهتمتش كتير إني أصاحب أو بمعني أصح ... إني أوطد علاقتي بحد هناك ...<br />كان صعب أوي إنك تعيشي في القاهرة لوحدك .. ويمكن عشان كده كنت أروح وأجي علي طول .. وطبعا كانت النتيجة إني بأدرس لغاية دلوقتي ...<br />في كلمة اتقالت في مسلسل \"حضرة المتهم أبي\" علي لسان طالبة الإعلام اللي جاية من بلدها عشان تتعلم في القاهرة ...<br />\"القاهرة دي وحشة أوي ... متستقبلش الغريب وتحسسه إنه من أهلها أبدا ... وأهلها .... قافلين علي نفسهم أوي ... صعب تتأقلم معاهم .....\"<br />يمكن ...لما أكبر وأحكي لعيالي حأقول لهم ... إن من أكتر الحاجات اللي ندمت عليها في حياتي ..... إني معشتش حياتي الجامعية ... بكل ما فيها ....<br />قلبتي علينا المواااااااااااااجع ..<br />يالا معلش ...<br />بس برضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديسل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2010-03-14"
capture_url = ""

