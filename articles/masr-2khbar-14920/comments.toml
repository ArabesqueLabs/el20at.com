author = "الراجل غلط"
posted = "2010-01-17"
text = "كان مفروض يقول ان شروط اللعيب ان يكون سكرى وبيلعب قمار وبيسهر فى الحانات والمراقص وقليل الادب وسافل وبتاع مشاكل ويتردد على الساقطات<br />والبهايم بتوع اقباط المهجر اللى بيتريقوا فى مواقعهم على كلمة فريق الساجدين وسخروا منة عندما هزم امام الجزائر بعناوين تستهزأ من كلمة الساجدين هم من وراء هذا اللغط<br />للعلم<br />الرياضة اخلاق<br />والاخلاق دين والتزام<br />والكابتن حسن شحاتة لم يخطىء"
