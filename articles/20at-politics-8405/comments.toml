text = "هو طبعا كتر خيرهم انهم بيفكروا فى غزة<br />وان كانت طريقة التعبير عن هذا الاهتمام غير مجدية<br />موضوع الرسائل منتشر كمان فى مصر<br />بس اعتقد الاجدى لو جمعوا تمن كروت الشحن ده واتبرعوا بيها<br />خصوصا ان الرسايل ده نوع من كلامنا مع نفسنا"
