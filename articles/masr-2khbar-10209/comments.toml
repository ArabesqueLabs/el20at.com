order = 0
subject = "وكانت الشرطة تجرى ورائهم وتقول امسك حرامى"
author = "لا لا لا لا"
posted = "2008-10-07"
text = "هو مين اللى حرامى فى البلد دى<br />اللة يرحمة توفيق الدقن اللى كان دايما بيقول احلى من الشرف مفيش<br />ويظهر ان محاصرة الناس فى غزة وتجويعهم وتطليع عين ابوهم وتنفيذ اوامر اسرائيل وامريكا فى حصارهم هو الشرف بتاع الدقن<br />انما اللى عايز يوصل مساعدة للغلابة المحاصرين فيبقى حرامى<br />فى ذمتكم مش ممكن الواحد يخرج عن شعورة ويشتم شتيمة ابيحة قوى فى النظام واللى على راس النظام"
