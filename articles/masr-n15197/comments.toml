order = 0
subject = "شكرا يادكتور على التوضيح والتاكيد ان مصر للكل  وال"
author = "محمدعبالعليم يحى"
posted = "2008-04-15"
text = "انا ساكن فى عمارة معظم سكانها مسيحين وحاسس انة الناس دى اقرب لى من اهلى مثلا بنشوف بعض كل يوم فى النزول والخروج وبنظم رحلات عائلية مع بعض فى الصيف المدام والاولاد مندمجين مع جيرانهم مفيش اى فرق وكل واحد بيحترم معتقد التانى دة الواقع اللى احنا عايشينة \\ تيجى بقى للحكومة يقولك ان الاخوان المسلمين جماعة محظورة هدفها قلب نظام الحكم وتطبيق النموذج الايرانى فى مصر ودة كلام مش مزبوط القصد منة منع الشرفاء والكفاءت من اخد دورها فى تنمية وخدمة المجتنمع"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161109/http://masr.20at.com:80/newArticle.php?sid=15197"
