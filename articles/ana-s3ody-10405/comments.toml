[[comments]]
order = 20
subject = "واقعة يعرفها اهل محافظة جدة"
author = "صبرى المنياوى"
posted = "2008-11-15"
text = "كل اهل جدة وكثير من المناطق الاخرى يعرفون هذه الواقعة<br />جيدا ولا زال الناس يذكرونها وستبقى خالدة الى قيام الساعة.<br />يوجد فى جدة شارع اطلق عليه الناس \\\" شارع المظلوم \\\"<br />قصة هذا المكان انه قام شخص سعودى بقتل شخص اخر اجنبى<br />أى غير سعودى .. وكان هذا الشخص السعودى ذو منصب وسلطة<br />فقامت هيئة الشرطة بالقبض على شخص هندى الجنسية مسلم كان<br />يعمل فى السعودية منذ سنين ويعرفه معظم الناس ومشهود له بحسن<br />الخلق والاخلاق الحميدة, فلفقوا له تهمة القتل واجبروه على الاعتراف<br />ظلما وبهتانا وقدموه الى قاض ظالم حكم عليه بالقتل.<br />ظنا منهم واعتقادا ان يفلت السعودى من الحكم .. لكن هيهات ان يفلت<br />من بطش جبار قهار عادل.. ان لم يكن فى الدنيا فله فى الاخرة عذاب مهين<br />وتم تنفيذ حكم الاعدام فى الهندى المسلم وكانت اخر كلماته مظلوم مظلوم<br />ولما قطعوا رقبته سال الدم وظهرت كلمة مظلوم مكتوبة على الارض بدم هذا<br />الرجل فهلل الناس الله اكبر.<br />واطلقوا من يومها على هذا الشارع \\\" شارع المظلوم \\\" لتبقى وصمة يندى لها الجبين فى حق<br />الظلمة .. وانى لاستغرب كيف لهؤلاء القضاة ان يناموا او يغمض لهم<br />جفن وهم يحكمون ظلما ويتعسفون فى استخدام السلطة.<br />كيف للقاضى ان يخضع لامر سيده ويحكم بغير ما انزل الله من اجل وظيفة<br />يخاف زوالها اتقوا الله وارجعوا وتوبوا انه هو التواب."
