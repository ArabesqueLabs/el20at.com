text = "ياسمير الموقع بتاع الدكتور ، والموقع دا ، تم عمل مذكرة للسفارة السعودية بجلبك أنت شخصياً والدكتور بتاعك صاحب الموقع ، والموقع ده للمحاكمه في السعودية ، ومش في مصر أاقولك في السعودية وحنجيبك أنت والدكتور بتاعك وبتاع الموقع ده وبالقوة الى السعودية وتنفيذ حكم ضرب عنقك بالسيف ، أيه هيا أعراض الناس شخشيخه بأيدك يأبن الكلب ، دا أنت بتتكلم مع أسيادك يابن الوسخة ."
