subject = "رسالة إلى المصري"
author = "أبوتركي حي حطين"
posted = "2008-11-15"
text = "ردي عليك ياأخي حادثة حصلت تدل على أنك ومن استشهدت به القذافي متبرأ ما أنتم فيه !!<br />قبل عدت أشهر رقت في الستشفى 25 يوم مريض بالقلب وأنا من جماعة مسجد يعج بالطاعة والأيمان والحمد لله وعند خروجي من المستشفى وعودتي إلى المسجد الذي أنقطعت عنه بسبب المرض !!<br />تدري من أول نت أحتفى بعودتي ( عمال مصريين ) من جماعة المسجد سباك و مبلط و عامل محارة وعندما سأله الشيخ إمام المسجد ضاحكاً هل تعرفون الشيخ ؟ رد عليه العمال المصريين إزاي منعرفوش الشيخ دا لما يبخر المسجد بالطيب ييقي من أخر المسجد علشان يبخرنا وأحنا عمال مبيأولش دول مش سعوديين أو مش مطاوعة والله كل العمال المصريين وغيرهم بيحبوه وبيسألوا عنه لما غاب !!<br />هذا خلقنا السعوديين مانفرق بين صغير أو كبير سعودي أو مش سعودي ؟؟<br />وردي على كلآمك الذي قلته أنك ستحاسب عليه وسوف ترى عواقبه عاجل غير أجل من غيري أما من جهتي أنا أقول الله يسامحك ويسامح كل واحد أو وحده سبوا السعوديين أو طعنوا في شرف نساءنا ؟؟"
