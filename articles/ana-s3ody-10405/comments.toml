[[comments]]
order = 23
subject = "من مذكرات جراح مصرى"
author = "د. سمير ....."
posted = "2008-11-15"
text = "الى السعوديين ليعرفوا الحقيقة<br />برغم حكم عملى الذى يحتم على كتمان اسرار المرضى<br />وعدم البوح بها مهما كانت الظروف الا اننى لا استطيع ان<br />اقف عاجزا عن اظهار حق زملاء المهنة الشرفاء.<br />اخوانى القراء اننى اعمل فى الجراحة العامة والمسالك البولية<br />منذ سنين طويلة ولى عيادة فى القاهرة معروفة ويأتينى المرضى<br />من جميع دول الخليج.<br />خلال فترة عملى الطويلة جاءنى مئات من السعوديات لعمل جراحة ترقيع<br />البكارة قبل الزواج ومنهن من جاءتنى اكثر من مرة بسبب عدم اتمام زواجها<br />المدهش انهن كن يحضرن بصحبة امهاتهن او اخوتهن او ابائهن فى بعض<br />الاحيان وكانوا دائما الاهل يسردون قصص خيالية لى عن حوادث حدثت لهم<br />فى الطفولة او سقوط من مكان مرتفع وكنت اوافقهم منعا لاحراجهم.<br />وعند الكشف اكتشف انهن عاهرات محترفات يمارسنها منذ سنين وعندما ألمح<br />للاهل بذلك تصفر وجوههم ويموتون خجلا.<br />اذكر لك بعض الاسماء التى اجريت لهن جراحة اعادة البكارة<br />الاسماء من واقع جوازات السفر وعندى صور من هذه الجوازات<br />واقرار من ذويهم باجراء الجراحة<br />حنان بنت مبارك مسفر العتيبى<br />حصة بنت على راشد الشهرى<br />أريج بنت سعد دخيل الله الشمري<br />نجلاء بنت خالد محمد العجلان<br />نوره بنت حجي خليف العنزي<br />ريم بنت فايز عويش العويمري الرشيدي<br />مستورة بنت رحيل كساب الشمري<br />حنان بنت صالح فهد عبد العزيز الخوير<br />دلال بنت حمود سليم جديع السليمي الحربي<br />يسرى بنت فهد مفضي ابن فهد الفهيد<br />غزيل بنت حمود هليل حماد المرواني<br />معالي بنت ثويني عيسى ثويني الحائطي<br />منى بنت منصور عيادة منصور السليطي<br />أمال أحمد علي الشباني المالكي<br />نجلاء عبدالله صقر الحمراني الهاجري<br />مريم يوسف عبداللطيف النعيم<br />عائشة سعود عبدالعزيز ابومريره<br />رحاب ذايب سعدي العضيله المطيري<br />وفاء سعد محمد المسفر<br />جواهر سالم مبارك الحراجين الدوسري<br />نعيمة احمد عبدالله الرميح<br />أسماء سعد مقبل القرني<br />كوثر فهد عبدالله البحراني<br />أضواء احمد احمد الفهمي الزهراني<br />دانة مسفر مبارك آل مهدي القحطاني<br />نوير عيد متعب الصعيبي المطيري<br />فاطمة علي زايد البيشي<br />وما زال هناك الكثير والبقية تاتى فى وقت اخر"
