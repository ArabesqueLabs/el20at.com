text = "الى جميع الأخوة السعوديين نقول لكم شكرا على تعليقاتكم وعلى نعتكم لنا بأشنع الصفات<br />ولكننا نريد منكم الإجابة على هذه التساؤلات<br />نريد من أي عالم إسلامي أو مفتي من أي دولة إسلامية أن يخبرنا عن حادثة واحدة في التاريخ الإسلامي كان فيها حكم التعزير أكبر من حكم الحدود<br />نريد ان يخبرنا القاضي الذي حكم لماذا لم يطبق حد الحرابة عليهم لو كانوا مجرمين فعلا ؟<br />نريد ان تخبرنا وزارة العمل في السعودية عنعدد الشكاوي الحقيقية التي صدرت من مصريين ضد كفلائم لعدم تقاضيهم حقوقهم التي تعاقدوا عليها طبقا لمبدأ الناس على شروطهم؟<br />نريد أن تخبرنا نقابة الإطباء السعودية ( هل هي موجودة أصلا ) عن عدد الإطباء المصريين الفاشلين كما تقولون ؟<br />ولاداعي للسب والشتم<br />نريد حوارا متحضرا<br />وارجو النشر وعدم منعنا من حق التعبير عن الرفض"
archived = "2010-03-14"
