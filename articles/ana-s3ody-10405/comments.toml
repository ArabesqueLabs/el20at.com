text = "سمير انا اخجل من كونك مصري و اشعر بالحنق علي كل طبيب يخون شرف مهنته و كل انسان يتلذذ بفضح من ائتمنه علي سر<br />و اعلم تماما ان من يفضح الناس لا يموت الا بعد ان يرسل الله من يفضحه اما بنفسك او ان احد افراد اهلك يسبب لك الفضيحة و الخزي و العار<br />علي كل ان تفضح هؤلاء فانت بذلك لن تعيد حق مسلوب و لن تنصر حقا ضائعا و لن تثبت انك اشرف منهن بل انك اسود الاخلاق و الضمير و احذر ان تذوق فضيحة كبري تعرفها مصر كلها و بذلك تكون عبرة لمن يتشفي بفضائح غيره و يسعد بها<br />لقد فضحت نفسك انت و طعنت بسكينك قلبك و انتظر الان الرد الالهي العادل<br />((ان الله حليم ستار))"
