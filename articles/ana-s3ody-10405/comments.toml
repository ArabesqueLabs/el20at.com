[[comments]]
order = 38
subject = "إلى نقابة المجرمين المصريين"
author = "همام"
posted = "2008-11-17"
text = "بدأت قوات الأمن المصرية صباح الأحد 16-11-2008 حملة مداهمات على عدد من مستشفيات القاهرة لضبط \\\\\\\"مافيا منظمة\\\\\\\" لبيع الأعضاء فجرتها صحيفة يومية مستقلة على صدر صفحتها الأولى مؤكدة أنها خاصة بأطفال الشوارع.<br />وأوردت صحيفة \\\\\\\"البديل\\\\\\\" اليومية على صفحتها الأولى بالكامل محتوى شريط فيديو مصور قالت إنها حصلت عليه من أخصائيين في مشروع تحسين حياة الأطفال الذين صوروه لصالح المجلس القومي للأمومة والطفولة بمصر يحكي فيه عدد من الأطفال والمراهقين تجاربهم مع بيع أعضائهم لمافيا منظمة تتخذ من مستشفى قاهري مقرا لتنفيذ عملياتها.<br />وعلمت وكالة الأنباء الألمانية أن مستشفى معروف بحي الدقي بالقاهرة تمت مداهمته من جانب قوات أمنية صباح الأحد والقبض على عدد من مسؤوليه بعد العثور على 3 ضحايا جدد كانوا يتم تجهيزهم لإجراء عمليات نقل أعضاء بشرية.<br />كما أجرت قوات أمنية مداهمات لمستشفى آخر بحي مدينة نصر لنفس الأسباب لكن لم يتضح بعد إن كان تم القبض على أحد فيه أو العثور على ضحايا جدد.<br />وصدرت صحيفة \\\\\\\"البديل\\\\\\\" الأحد صفحتها الأولى بصورتين كبيرتين لجروح بارزة بجسد اثنان من ضحايا مافيا سرقة الأعضاء وأوردت في نفس الصفحة شهادات تفصيلية لهما اعترفا فيها ببيع كل منهما إحدى كليتيه مقابل مبلغ مالي لم يتجاوز 10 آلاف جنيه مصري.<br />وقال خالد البلشي رئيس تحرير \\\\\\\"البديل\\\\\\\" إن الموضوع عبارة عن بلاغ صحفي للنائب العام المصري وللمجلس القومي للطفولة والأمومة الذي تشرف عليه سيدة مصر الأولى سوزان مبارك بمناسبة عيد الطفل الذي يحل غدا الاثنين 17 نوفمبر/تشرين ثان.<br />وأكد البلشي أنه علم بمداهمة قوات الأمن لعدد من المستشفيات في الصباح ردا على ما نشرته البديل قائلا إن محرريه ومصوريه شهدوا عملية مداهمة مستشفى الدقي وقاموا بتوثيقها بالصور.<br />وقال أحد الضحايا ويدعى رامي \\\\\\\"17 عاما\\\\\\\" للصحيفة إنه باع كليته عن طريق سمسار مقابل 10 ألاف جنيه وأنهم حصلوا منه على قيمة التحاليل والأشعة السابقة لإجراء العملية وأنه اكتشف أن قدرا كبيرا من المال الذي حصل عليه مزور لكنه تمكن من انفاقه.<br />وأضاف أن السمسار أبلغه بعدها أنهم يشترون أجزاء أخرى من الجسم بينها فص من الرئة بمبلغ 20 ألف جنيه وقرنية العين بـ15 ألف جنيه لكنه رفض بيع أجزاء جديدة.<br />وقال ضحية آخر يدعى محمد عبد البديع إنه تعرض ومعه آخرون لنفس العملية وبنفس المقابل وذكر أسماء عدد من الضحايا قال إنه يعرف عددا منهم جيدا لأنهم أصدقاء له كما حدد أسماء شبكة سرقة الأعضاء ،مشيرا إلى أن السمسار يحصل مقابل كل ضحية جديدة على مبلغ ألفي جنيه.<br />وقال الدكتور لطفي عيسى استشاري القلب للصحيفة إن الأطفال الذين سرقت منهم الكلى سيواجهون مشاكل صحية كلما تقدم بهم العمر بينما أكد الدكتور علاء اسماعيل مدير معهد الكبد أن نقل الأعضاء من الأحياء مقابل مبالغ مالية جريمة قانونية وأخلاقية لأن نقل الأعضاء يكون بالتبرع وليس بالبيع.<br />صورة ناصعة من الإنجازات الطبية المصرية<br />ودليل واضح على نزاهة الأطباء المصريين<br />مع التحية لكل من يهمه الأمر<br />مسلسل الفضائح لا يزال مستمرا<br />دعوهم لنقابتهم ولشعبهم المغلوب على أمره<br />فنحن في غنى تام عن البلطجية وبتوع الكلام<br />فأطباء الفول والطعمية والكارو والأتوبيس لم ولن يضيفوا لنا أي شيء<br />بالعربي مانبيهم<br />فهم والبنقلاديشيين سواء"
archived = "2010-03-14"
capture_url = ""

