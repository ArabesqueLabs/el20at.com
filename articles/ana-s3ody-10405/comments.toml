[[comments]]
order = 71
subject = "الى المدعو ابو النجا"
author = "خليجي"
posted = "2008-11-22"
text = "الى المدعو ابو النجا الي بيته من زجاج لايحذف الناس بالطوب الدعارة اساسها مصر للاسف الشديد فما انتشر البغاء والكباريهات والخمور الى عن طريق مصر ولم تصدر لنا مصر الى 2 مليون فنان وفنانة وراقص وراقصة نشرو العري والتفسخ في المجتمعات العربية فلانضحك على بعضنا البعض فالعاهرات والمومسات في مصر اكبر نسبة في الدول العربية الدول الخليجية ومنها السعودية لها الفظل بعد الله على مصر اقتصاديا واجتماعيا ولم ننكر فظل مصر على الدول الخليجية فهذا من باب العدل والانصاف ولكن في هذه القضية بالتحديد كان الاطباء المصريين من افشل الاطباء الموردين لدول الخليج ومنها السعودية بالذات وقد عانينا الهوايل منهم ومن اضمحلال ثقافتهم الطبية وتزوير شهاداتهم وهناك قضايا كثيرة جدا تم كشفها من تمرجية تحولو بقدرة قادر الى دكاترة واستشاريين يعملون على تشريح البشر .<br />القوانين في السعودية قوانين صارمة تطبق على الجميع وليتكم تستردون جثث جنودكم من اسرائيل ودفنها بمايليق بكرامة القتلى رحمهم الله وليتكم تبحثون مع امريكا عن سبب اسقاط الطائرة المصرية<br />دول الخليج ضمنت اعمال شريفة للمصريين اما دول اوروبا التي تتغنون بها فقد اهدت لكم غسيل الصحون في الفنادق والشحاتة على ابواب السفارات ."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

[[comments]]
order = 72
subject = "الى المسمى المحامى"
author = "اسماعيل ابو النجا"
posted = "2008-11-22"
text = "انت يامن تدعى المحامى انت انسان احمق لا تعرف شيئا جاهل كعادة شعبك<br />انتم ايها السعوديون الانجاس قوانينكم عرجاء بلا عكاز<br />ما تسمونه بالشريعة يطبق بدرجات متفاوته على الناس<br />يطبق على العرب والهنود والباكستانيين والبنجلاديشين بنسبة 300 فى المائة<br />ويطبق على السعوديين غير الاصليين بنسبة 100 فى المائة<br />ويطبق على السعوديين الاصليين بنسبة 50 فى المائة<br />ويطبق على الامراء اولاد واحفاد الملك سعود بنسبة 25 فى المائة<br />ولا يطبق نهائيا على الامراء من اولاد واحفاد عبدالعزيز من غير اولاد الملك سعود<br />ولا يطبق نهائيا على الاجانب من الامريكيين والبريطانيين والاوروبيين<br />لان الامريكيين والاوروبيين اسيادكم وانتم عبيد لهم ولو فكر احد وحكم على اى منهم<br />لاستدعى السفير ملككم عبدالله الى مقر السفارة وضربه على وجهه بالحذاء<br />ايها المحامى ان سفارتكم فى القاهرة لا تساوى اكثر من حذاء قديم لا يصلح حتى ان يلبسه<br />شخص فى قدمه والسفير هشام ناظر مخنث لا حول له ولا قوة<br />انا مع معالى الدكتور سمير لنشر فضيحتكم الكبرى فى المواقع وعلى جميع الايميلات ستصل لكل فرد<br />واذهب انت وشعبك الى الجحيم.<br />لو سفارتك لها سلطة ما كانت اميراتكم العاهرات تاتى لممارسة الدعارة فى فنادق شرم الشيخ<br />والغردقة والقاهرة<br />انظر الى العاهرة سماهر بنت تركى حفيدة الامام عبدالعزيز قبح الله وجهه ماذا تفعل هنا<br />انظر الى الاميرات ثريا وعهود وحصة وغيرهم ممن يواظبن على الحضور الى مصر<br />باستمرار ماذا يفعلون هنا.<br />اين شريعتكم واين قوانينكم ايها السفهاء خسئتم ايها القرود يا حسالة العالم."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

[[comments]]
order = 73
subject = "خمسينيه سعوديه تطلب الطلاق"
author = "بنت القطيف"
posted = "2008-11-25"
text = "طلبت سيدة سعودية الطلاق من زوجها، لأنه كشف برقعها خلال نومها لرؤية وجهها لأول مرة منذ 30 عاماً من زواجهما.<br />فمنذ ارتباط الزوجين، الذين تجاوزا سن الخمسين، لم ير الزوج وجه زوجته، عملاً بالتقاليد المحلية المعمول بها في إحدى قرى جنوب بادية خميس مشيط السعودية.<br />وأدى الغضب بالزوجة إلى مغادرة المنزل، ملقية باللوم على الزوج الذي، \"بعد هذا العمر، يحاول ارتكاب خطأ كبيرا\"، يتوجب عليه تحمل تبعاته، وفق ما نقلت صحيفة \"الرياض\" السعودية الأحد 7-10-2007.<br />وبالفعل، تحمل الزوج وزر \"خطأه\"، ووجه اعتذارات متكررة لزوجته وأم أولاده، مع وعود بعد التجرؤ على محاولة رؤية وجه زوجته الخمسينية مرة ثانية.<br />وسبق أن نشرت \"العربية.نت\" عن حالات مختلفة لسعوديين وسعوديات لم ير أزواجهن وجوههن، رغم مرور سنوات، وحتى عقود، على زواجهم.<br />مثال ذلك حالة محمد، الذي لم يتمكن من رؤية وجه زوجته رغم مرور 40 عاماً على زواجهما، وإنجابهما 3 أولاد. وفي اللحظة التي شاهد وجهها طالبته بالطلاق، معدة ذلك تجاوزا للعادات والتقاليد التي اعتادت وتربت عليها.<br />أما علي القحطاني أكد أنه رغم مرور عشر سنوات على زواجه لم يتمكن لو مرة واحدة أن يرى وجه زوجته فالبرقع لا يفارق وجهها، وأشار إلى أنه ذات مرة هم أن ينزع برقعها عن وجهها فهددته بترك المنزل والعودة لبيت أهلها إن فكر بذلك، ولم يثنيها عن قرارها ذلك إلا بعد أن أقسم بأغلظ الأيمان بعدم التفكير مرة أخرى في فعل ذلك. أما حسن العتيبي فقد حاول الضغط على زوجته الملثمة من خلال تهديدها بالزواج من أخرى إذا لم تكشف له وجهها، إلا أنها فضلت أن يكون لها \"ضرة\" ولم تكتف بذلك بل رشحت إحدى صديقاتها التي لاتتمسك بهذه العادة الصارمة.<br />وتقول أم ربيع الجحدري البالغة من العمر سبعين عاما، وهي أم لشابين لم يرا هما وزوجها وجهها ولو مرة واحدة، إنها اعتادت على ارتداء البرقع منذ أن كنت طفلة معتبرة أن خلعه عيبا كبيرا وخاصة عند عائلتها فقد آلفت أن ترى أخواتها الإناث ووالدتها يرتدنه منذ نعومة أظفارها، مشيرة إلى أن زوجها لم يطلب منها أن تنزعه لأنه يعلم أن ذلك من العادات التي يجب المحافظة عليها، وعن إنجابها دون أن يرى زوجها وجهها أشارت الجحدري إلى أن ذلك لا يعد مهما فقد اعتاد ألا يرى وجه والدته وأخواته الإناث مؤكدة أن الألفة والمودة هما أساس العلاقة الزوجية وليس الوجه.<br />في حين أكدت نوره زوجة ابنها، وهي أم لسبعه أبناء أن من العادات التي ورثتها عن عائلتها ارتداء البرقع حتى في منزلها ومع عائلتها وزوجها، وقد طلب زوجها منها مرارا أن تنزع البرقع داخل المنزل لكنها امتنعت عن ذلك مبينه أنها تنام واضعة البرقع على وجهها مما سبب ضيق لزوجها، والذي حسب حديثها اعتاد على رؤية وجه أمه مرتدية بالبرقع.<br />والله قمة التخلف صرآحهـ .. مسكت على الوجهـ بس هههههههههههههههههه<br />يالله المستعاااان .."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

