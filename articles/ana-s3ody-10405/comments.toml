[[comments]]
order = 26
subject = "فريسيو الماضي وفريسيو الحاضر"
author = "عاقل"
posted = "2008-11-16"
text = "اذا قال أحدهم أن تهمة ترويج المخدرات ثابتة بحق الطبيبين لحيازتهما العقارين المذكورين.. اذ أن هذين العقاران مثبتان في جدول المخدرات الخاص بالمستشفيات..سنفول هذان العقاران ليسا من المجموعة الأولي بالجدول مثل الكوكايين و الهيرويين والمورفين.. ولذلك العقوبة المترتبة علي حيازتهما لاتماثل العقوبة المترتبة علي حيازة عقاقير المجموعة الأولي بالجدول..وهنا تتهاوي تهمة ترويج مخدرات من المجموعة الأولي وبالتالي العقوبة المشددة غير مبررة اطلاقا.. وأهتف في أذن القاضي.. فاتك يا سيدي أن عقاقير مثل الكافيين و النيكوتين مثبتة في جدول المخدرات .. كثير من أدوية البرد و الزكام و المياه الغازية تحتوي علي الكافيين .. السجائر تحتوي علي النيكوتين.. لذلك اذا أخذنا باستدلال القاضي فان الصيادلة و باعة المياه الغازية والسجائر سيثبت في حقهم تهمة ترويج المخدرات وسيتم جلدهم 1500 جلدة وسجنهم 20 سنة مع مصادرة ثرواتهم.. أنا لا أتعجب من أفعال هؤلاء القوم.. فهذه الأفعال تتشابه مع أفعال الفريسيين .. وهي طائفة من اليهود وصفهم المسيح عليه السلام بأولاد الأفاعي.. اذ أنهم يتشددون جدا في أحكام الشريعه ويتشبثون بنصوصها الشكلية.. وتراهم يأتون بالموبقات خارج وداخل الهيكل لاينهاهم علماءهم عن ذلك .. و يأكلون أموال الناس بالباطل اذ يقولون ليس علينا في الأميين سبيل لاينهاهم علماءهم عن ذلك.. وكان من أخلاقهم أنهم اذا انتقموا انتقموا جبارين لاينهاهم علماءهم عن ذلك.. وبصراحة شديدة لاأري فرقا بين فريسيي الماضي وفريسيي الحاضر..اللهم الا الشهادتين وهي مردودة عليهم لأنهم لايأتونها بحقها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 27
subject = "بيان للتوضيح"
author = "عمار السعوديه"
posted = "2008-11-16"
text = "سفارة المملكة في القاهرة: عقوبة الطبيبين المصريين متوسطة القسوة<br />أصدرت السفارة السعودية بالقاهرة بيانا أمس \\\\\\\"الأربعاء\\\\\\\" حول قضية الطبيبين المصريين المسجونين في المملكة وذلك إزالة لما حدث من لبس لدى البعض عند تناولهم لقضية الطبيبين المصريين المحكوم عليهما بالسجن والجلد في المملكة، والتي أثير حولها الكثير من اللغط. وذكر البيان أن هناك خمس تهم موجهة إلى الطبيب الأول شوقي عبدربه إبراهيم وأن هناك اتهامين رئيسيين تم توجيههما لهذا الطبيب الأول هو الإتجار بالمخدرات، والثاني هو هتك عرض مريضاته واغتصابهن دون علمهن.<br />وأشار البيان إلى أن هناك أربع تهم موجهة إلى الطبيب الثاني وهو رؤوف أمين العربي، تتعلق ثلاثة منها في الإشتراك في جلب وبيع وشراء أنبولات من عقاقير طبية تندرج ضمن المواد المخدرة المحظور استعمالها دون استشارة الطبيب، أما الاتهام الرابع فيتعلق بحقن زوجة كفيله بنفس هذه العقاقير بهدف التسبب في إدمانها. وأشار البيان أن العقوبة المفروضة على الطبيبين تندرج ضمن الأحكام متوسطة القسوة، بعد أن اعتبرهما القضاء السعودي مروجين وليس مهربين للمواد المخدرة."
archived = "2010-03-14"
