[[comments]]
order = 61
subject = "جميل هو ضميرك هه إلى أح رؤوف !! : )"
author = "سليمان / السعودية ."
posted = "2008-11-20"
text = "أنت آخر من يحكم علي, وآخر السُذج يقذفون بي فهمت, ومسألة كلامك المُضٍحك السائق وما إلى ذلك<br />هههه لا نعترف ولله الحمد بالسائقين فلدي ولدى أخوتي سيارات, ولا يحتاج منّا سائق خاص لنا وللعائلة .<br />أما أننا ( شعب ) لوطي وزنا .. أعوذ بالله, التعميم لغة الحمقى والجاهل الذي يهذي بما لا يعقل هل تفهم !!<br />تبيّن لي أنك رجل مريض نفسي, ولا تربط بالإسلام بصلة ما دام هذا كلامك وهذه أخلاقك المنحطة .<br />الإمامان السديس والشريم أشرف منك أيها النجس, ولن أتكلم معك بعد ذلك لأنك حاقد على المسلمين<br />وعلى خيرات البلد, ويبدو أن السعوديين مرةً قد ( قاسوا عليك وأدبوك تأديباً ) لأي سبباً كان فلا أستغرب<br />أن سبيتهم أو شتمتهم فهذه فرصتك والمساحة واسعة لك فسب وأشتم إلى يُريح عقلك ( الغير سليم ) .<br />المرة القادمة أذهب إلى أقرب معهد أو مركز لتطوير عقليتك, و بالأخص ( مهاراتك اللغوية في الكتابة )<br />فأخطاء كثيرة شاهدتها في كلامك, وهذا دليل على أن الشخص يفتقد إلى مزايا كثيرة وإيجابيات<br />و بالعامية السعودية ( الله يعين على نفسك ) ههههه .<br />لن أعود, أهرج كثيراً وكثيراً فلن تُسمع .<br />أستاذك / سليمان ."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

[[comments]]
order = 62
subject = "الى الذى طلب العنوان البريدى"
author = "د. سمير ....."
posted = "2008-11-21"
text = "الاخ الذى طلب العنوان البريدى اشكرك لاهتمامك<br />وبريدى الالكترونى هو<br />d.sameer_1961@yahoo.com<br />واهلا وسهلا بمن يريد التواصل معى<br />والى الذى اسمى نفسه المحامى اقول لك لن ادخل فى مهاترات مع امثالك لانك انسان بذئ<br />اتضحت الامور للجميع انت احضرت اسم احد الفتايات من صحيفة عندما اظهروا نتيجتها ما المشكلة؟<br />فتاة كانت بالجامعة واخطأت وجاءتنى مع اهلها لعمل عملية ترقيع.<br />اقول لك اذهب الى الجحيم انا لا اخاف شيئا فلدى المستندات والاقرارات. لا يهمنى سفارة السفهاء<br />لان الموضوع الان تم نشره موثقا على عدة مواقع اجنبية وتم نشره على موقع سى ان ان تحت موضوع<br />كبير عن اهمية غشاء البكارة فى السعودية وقريبا سيناقشوننى على قناة سى ان ان وسترى كم سيكون<br />صدى هذا اللقاء على القناة فى العالم العربى.<br />اما السفيه سليمان فلا تعليق او حوار لى مع الاطفال.<br />تقبلوا تحياتى."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

[[comments]]
order = 63
subject = "إلى الجرّاح الغفلة \\"
author = "سليمان"
posted = "2008-11-21"
text = "خسئِت, والله لا أريد أن أضيّع وقتي معك ومع أشكالك المتأرجحة أيها الفارغ !!<br />أجل ترقيع بكارة لبعض السعوديات, ههههههه ضحكت على كلامك وكشفك الكريم \\\" سعووودي \\\"<br />من خلال الرابط الذي وضعه وهن طالبات في إحدى الكليات بمدينة حائل شمال المملكة , وهالحركات<br />التافههة ما تمشي علينا نحن ( الأذكياء ) حركة طفولية غبية تنم عن جهل صاحبها , يحاول أن يسيء<br />و يُخيِّل للقراء هنا أنه طبيب وجاءته سعوديات ومن هذا الكلام , يالله, تبيّن لي من كلام إحدى الاخوات المصريات<br />الكريمات - من عقلاء مصر - أنك شيعي ولا تمت للإسلام بصلة , تحاول تشويه صورة السعوديات والسعوديين<br />وهم الوهابيين من خلال مشاركاتك بأسماء من موقع سعودي لطالبات أشرف منك خلقاً وعلماً .<br />إلى سمير أجل دخلت على أقرب موقع لك وجمعت لك أسماء طالبات وتبي توهم القرّاء أنه كذا وكذا<br />ههههههههههههههههههه ... بجد تبيّن لي أنك حاقد ومسكين وكل ما هو مرتبط بالأسؤ متصف بك.<br />حبايبي السعوديين والمصريين شوفوا مدونته _ إذا كانت بالفعل تستحق مسمى مدونة - لا يوجد بها سوى<br />موضوع واحد وهو عن ترقيع فض بكارة بعض السعوديات وهو ليس بجرّاح ولا يحزنون, أجل جرّاح ههه حلوة<br />الجرّاحين عُرف عنهم الأحترام والتقدير, والعقل والذكاء, ومدوناتهم تمتلأ بالعقلانية, و بالكتابات عميقة وليست<br />سطحية كما هي في ( دونة سميروووه ههه ) الجرّاح الغــــفــــلة .<br />شكراً للمحترمين العقلاء .<br />في آمان الله وحفظه ."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

