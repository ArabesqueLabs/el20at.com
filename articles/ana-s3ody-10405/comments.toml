subject = "من بلد الحريات والحقوق"
author = "مصرى اعيش فى امريكا"
posted = "2008-11-17"
text = "نحن هنا الجالية المصرية نعيش فى امريكا ام الدنيا بحق<br />لنا ما للامريكان وعلينا ما عليهم<br />لا فرق بين امريكى واجنبى الا بعمله<br />كلنا هنا سواسية كاسنان المشط<br />لم اسمع يوما عن مشكلة ظلم او افتراء حدثت لمقيم هنا<br />او جار امريكى يوما على حقه او افترى عليه او ظلمه<br />كل هنا حسب عمله ومجهوده من يعمل بجد يجد ومن لا<br />يعمل لا يجد.<br />ان ما نسمعه هنا عما يحدث وى السعودية انه شئ رهيب<br />ظلم وافتراء واكل حقوق وكل هذا والدولة تساند المواطن<br />على الغريب الذى تكبد المتاعب ليوفر لنفسه ولاسرته حياة<br />كريمة وعاش مغتربا من اجل ذلك.<br />ان قصة الطبيبين هى واحدة من الاف قصص الظلم الذى يتعرض<br />له المقيمون فى السعودية.<br />ان ما حز فى نفسى هو قرار اصدره القاضى بخلاف الحكم الظالم<br />بالسجن والجلد هو مصادرة اموال الطبيبين.<br />هل وصل الحد الى الطمع فى قوت اسرتين ظل عائليهما يعملان<br />سنين لتوفيره لهما.<br />هل وصل الطمع بالمسئولين بالسعودية لينهبوا اموال اسرتين هم<br />فى اشد الحاجة اليه بعد ان زجوا بالعائل فى السجن.<br />طوبى للرحماء لانهم يرحمون<br />اننى لم انس واقعة الطبيب المصرى الذى اغتصب مدير المدرسة ابنه<br />ولما اشتكاه فبدلا من القبض على الجانى اقتادوا الطبيب الى السجن<br />ونفذوا عليه حكم الجلد ولما عاد الطبيب الا مصر كشفوا على ابنه واثبت<br />الطب واقعة الاغتصاب.<br />ولم يحرك المسئولون ساكنا تجاه الجانى وتجاه القاضى وتجاه اجهزة<br />الامن الخاصة بهم لانهم كلهم متواطئون.<br />اذا كانت هذه هى شريعتكم التى تحكمون بها وتظلم الناس فنحوها جانبا<br />واحذو حذو دول الخليج وطبقوا القانون الفرنسى الذى يعطى كل ذى حق حقه<br />وكفاكم هراء واستخفافا بعقول الناس<br />قوانينكم هوجاء ظالمة وقضاتكم نعال فى ارجل اسيادهم الطبقة الحاكمة<br />السفير السعودى بالقاهرة الذى اصدر البيان لهو احد ادوات النظام الحاكم"
