text = "السلام عليكم ورحمة الله وبركاتهو<br />أنا مصري أعمل في السعودية وشوفت الظلم أحيانا والخير أحيانا ,<br />أنا أريد أن أقول أن أخواننا السعوديين ماهم إلا مسلمون ولا يصح أن نقول عليهم مثل هذه الأشياء فهم إخوان في الدين والعروبة,<br />أما عن الأمثلة السيئة منهم فلهم الله يحكم بما يشاء ,<br />وأما عنا فيجب أن نلتزم بأداب الحديث والحوار النافع وليس السب في الأعراض ,<br />والله علي ما أقول شهيد<br />وربنا يرحمنا كلنا"
