text = "الآن حصحص الحق .. و تأكدنا من التلفيق البين .. فمن حيثيات الحكم المنشورة بالجرائد تبين أن العقارين المستخدمان هما Nalorphine و Midazolam<br />أحدهما Nalorphine<br />وهو مضاد للعقاقير الشبيهة بالأفيون ..ولكنه به بعض من خصائصها<br />أما الثاني Midazolam<br />فهو من المهدئات قصيرة المدى<br />الآن حصحص الحق.. كذبت الرواية السعودية و صدقت الرواية المصرية<br />الطبيب كان يحاول فعلا علاج أحدهم من الادمان.. العقار الأول يقوم بسحب المخدر(الشبيهة بالأفيون) من الجسم و الثانى يعالج الأعراض الأنسحابية .. و لكن للأسف المريض يحتاج الى علاج نفسي أيضا<br />وهذه الأدوية ليست مخدرات بالمعني الدارج عند الناس كالأفيون مثلا .. ولكنها للأسف قد تسبب بعض التعود عليها اذا تعاطاها المريض و لمدة طويلة (و ليست أربعة جرعات والا صار جميع المرضي مدمنين اذ أن لها استخدامات أخرى).. كما أن هذا التعود من المضاعفات المسجلة و المعترف بها في المراجع الطبية.. بمعني أن الطبيب ليس بالضرورة مسؤولا عنها<br />أما القائمة الطويلة و المرعبة من الأعراض الجانبية و اللتي لابد و أنها أرعبت القاضي مما أدي به الي هذا الحكم الغير مسبوق .. فهذه لاتحدث الا في حالة تجاوز الجرعة أو الافراط في استخدام الدواء بجرعات كبيرة<br />أهتف أخيرا في أذن القاضي .. لاتكن كاللذي أفتي من علمائكم بأن الأرض غير كروية اعتقادا منه بأن ما بين يديه من علم كاف .. و خطأه أنه لم يرجع للمتخصصين<br />أيها القاضي الكريم لو أنك قمت بقراءة النشرة الداخلية لأي دواء سيغمي عليك من خطورة الأعراض الجانبية لهذه الأدوية.. و ستعرض حتما عن تناول أي دواء..ولكن هذه الأعراض الجانبية لاتحدث الا في حالة تجاوز الجرعة المقررة أو الافراط في استخدام الدواء بجرعات كبيرة<br />أيها القاضي الكريم تذكر قول المصطفي : قاضي في الجنة و قاضيان في النار<br />أيها القاضي الكريم أعرض الأمر علي أكثر من متخصص وأقرأ بنفسك من المراجع الطبية أو أطلب ترجمة لها<br />أيها القاضي الكريم أعرض عن هذا قبل أن تعرض علي الجبار<br />ملحوظة: لقد قمت بنقل بعض مقتطفات من مرجع مارتن دل طبعة 35 للأدوية عن العقارين المذكورين<br />Nalorphine<br />Uses and Administration<br />Nalorphine is an opioid antagonist with properties similar to those of naloxone (); in addition it also possesses some agonist properties. It reverses severe opioid-induced respiratory depression but may exacerbate respiratory depression such as that induced by alcohol or other non-opioid central depressants.<br />Midazolam (Dormicum)<br />Uses and Administration<br />Midazolam is a short-acting benzodiazepine with general properties similar to those of diazepam (), except that it has a more potent amnestic action. It is mainly used for sedation () in minor surgical or investigative procedures and in intensive care, for premedication, and for induction of general anaesthesia. It is also used as a hypnotic in the short-term management of insomnia."
