text = "اول شئ اخر همنا كلام النااااااااس لان احنا نتعامل مع الرب وليس العباااااااااد يعني مااايحتاج نسوي شي علشاااان نرضيكم !!!!!<br />انتم اشبه بنباااااااح الكلاااااااب لان الكلب ماااايفهم ومايهم؟؟؟يعني ثقتنا بانفسسنا موووجوووووده ؟<br />ولو نرد علييكم مثل اسلووووووووبكم مااااااااخلصنا؟؟؟؟ولو كان ماعندكم عيووووب وهذا شي مستحيييل لان ماااافي شي يتخبى على الناااااس؟ يعني لو بغينا وماعندنا خوف من ربي نستخدم اسلوووووب الفااااشل سميير يعني يااااليته لما كااان بيكذب يقوووول شي يدخل العقل!!!!!!! وااخر شي حبييييت اقووووول سهل تكتب!<br />سهله تكذب!!!!!!!!!!!!!!!1<br />سهله تتبلى على النااااس!!!!1<br />بس مااااااااااافي شي صعب على ربك اذا اخذ بحق كل النااس الي تبليتووووهم وكل بنت عفيفه طاااااهره تحااافظ على سمعته والاخ سمير بكل غباء يتباه بانه الدكتوووور<<<<<حلمه الطب.<br />الي ستر عالبناااات بس في وقته لاحظو في وقتها يعني كاااااااااتم عالسر بس عشااااااان مايرضى بالاهاااانه تبلى خلق ربي ...عموماًكل شعب فيه الصااااالح والطاااااالح ماااافي شعب خااااااالي من العيوووووووووب قمه في الغباء من يحكم على شعب سكانه ملااااييين من خلال تصرف القليل منه<br />وشكراً .........................زززززززز"
