text = "لعنكم الله فوق الارض وتحت الارض ويوم العرض يامن تخطيتوا الحدود لتسبوا محارمنا وتقذفوا شيوخنا وعلمائنا وحسابكم عندالله لا مفر منه لا سامحكم الله ولا غفر لكم ولعنكم الله .<br />نحن لم ننسى أبنائكم الشرفاء الذين كانوا عونا لنا بعد الله في قيام بلدنا وحضارتنا نحن لم ننسى أن من صمم العلم السعودي هو رجل مصري رحمه الله<br />لم ننسى كل هذا ولم نتركهم أو نتنكر لهم بل يوجد لدينا اليوم أكثر من مليونين مصري يعملون في السعوديه بعد أن ضاقت بهم سبل العيش في بلدهم مصر لم ننسى أبنائهم فهم يتعلمون كما نتعلم ويعيشون كما نعيش في رغد ونعيم حيث لم يجدوه في بلدهم مصر<br />مصر والسعوديه أكبر بلدين عربيه ففي مصر القوه البشريه وفي السعوديه قوة المال وهي أخر أمال الامه العربيه أنتم الان<br />تسعون لهدم كل هذا والسبب تافه واهي أطباء خانوا شرف مهنتم فتعاقبوا كما ينبغي<br />يأهل مصر لا تصغوا لم يريد أن يزرع الشقاق"
