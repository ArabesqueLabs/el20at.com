[[comments]]
order = 58
subject = "بدون عاطفة"
author = "مصرى لايرضي بالظلم"
posted = "2008-11-19"
text = "الرواية السعودية ملفقةوذلك للأسباب الآتية:<br />أولا:انتفاء تهمة ترويج مخدرات<br />حسب حيثيات الحكم المنشورة بالجرائد تبين أن العقارين المستخدمان هما: Nalorphine وهو مضاد للعقاقير الشبيهة بالأفيون ..ولكنه به بعض من خصائصها أما الثاني dormicum)midasolam)فهو من المهدئات قصيرة المدى..هذه الأدوية ليست مخدرات بالمعني الدارج عند الناس كالأفيون مثلا .. ولكنها للأسف قد تسبب بعض التعود عليها اذا تعاطاها المريض و لمدة طويلة (و ليست أربعة جرعات والا صار جميع المرضي مدمنين اذ أن لها استخدامات أخرى).. كما أن هذا التعود من المضاعفات المسجلة و المعترف بها في المراجع الطبية.. بمعني أن الطبيب ليس بالضرورة مسؤولا عنها. مرة أخري هذان العقاران ليسا من المجموعة الأولي بالجدول مثل الكوكايين و الهيرويين والمورفين.. ولذلك العقوبة المترتبة علي حيازتهما لاتماثل العقوبة المترتبة علي حيازة عقاقير المجموعة الأولي بالجدول..وهنا تتهاوي تهمة ترويج مخدرات من المجموعة الأولي وبالتالي العقوبة المشددة غير مبررة اطلاقا.. كما أن عقاقير مثل الكافيين و النيكوتين مثبتة أيضا في جدول المخدرات .. فكثير من أدوية البرد و الزكام و المياه الغازية تحتوي علي الكافيين .. والسجائر تحتوي علي النيكوتين.. لذلك اذا أخذنا باستدلال القاضي فان الصيادلة و باعة المياه الغازية والسجائر سيثبت في حقهم تهمة ترويج المخدرات وسيتم جلدهم وسجنهم مع مصادرة ثرواتهم.. أما القائمة الطويلة و المرعبة من الأعراض الجانبية لهذه العقاقير .. فهذه لاتحدث الا في حالة تجاوز الجرعة أو الافراط في استخدام الدواء بجرعات كبيرة.<br />ثانيا: انتفاء واقعة التلبس<br />كيف يستطيع الطبيب أن يختلي بالمريضة في المستشفي حيث تكون ممتلئة بالاطباء و الممرضين و المرضي و يعطيها المخدر ثم يقوم باغتصابها و ينتظر حتي تفيق من تأثير الدواء..و تسير المسكينة مترنحة أمام الحضور دون أن يتساءل أحد عما كان يدور وراء الأبواب المغلقة (هذا ان لم يكن معها محرم من البداية) ..أو تتساءل هي عما كان يفعل بها و خصوصا أنها ستعرف أن الطبيب لم يقم بأي اجراء طبي لها طيلة وجودها بالعيادة..و ستعرف يقينا الوقت الذي قضته بالعيادة ..فضلا أنها سوف تجد بعض مخلفات الطبيب المنوية علي ملابسها أو علي أو بداخل جسدها... لماذا لم يرتاب أحدا في الأمر .. ولماذا لم يتم اقتحام خلوتهم لكشف أمر الطبيب.. أو يتم عمل كمين ليضبط الطبيب متلبسا و هذا لم يحدث في الرواية المزعومة .. لماذا لم يرتاب أحدا من الضحايا..لابد أن ذلك كان بموافقتهن.. واذا لم يكن كذلك وارتابت احداهن حتما..فلماذا لم يتم عمل كمين للطبيب ليضبط متلبسا و هذا لم يحدث مرة أخري حسب الرواية المزعوم<br />الاتهامات مرسلةولاتقوم بها أدلة اتهام قوية ايها العقل"
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

