text = "انتوا لما بتشتموا كل السعوديين معناه انت انتوا بجمعوا عاطل مع باطل وده حرام وهتيجوا يوم الدين ربنا هيحاسبكم وهياخد من حسناتكم للسعوديين الخيريين واللى عددهم اكتر من اللى مش كويسين لحد متخلص وانتوا هتخدوا من سيءاتم لحد ما تخلص من عندهم وفى الاخر انتوا فى النار وهم فى الجنة ودا معنى حديث لاشرف الخلق اجمعينوذنب امام الحرم ايه دا راجل تقى حافظ القرآن والملك فهد رحمة الله عليه اللى كان بيحب مصر جدا تقولوا عليه كدا ده حرام ده حتى الرسول بيقول فيما معنى حديث لحضرته اذكروا محاسن موتاكم ويقول الله تعالى (ايحب احدكم ان ياكل لحم اخيه ميتا فكرهتموه)صدق الله العظيم وفوقوا ياعرب احنا كلنا دين واحد وامة واحدة ووطن واحد ولغة واحدة والله يقول فى كتابه الكريم العظيم الجليل فوق كل شىء وفرض علينا كمسلمين نعمل بيه(واعتصموا بحبل الله جميعا ولا تفرقوا واذكروا نعمة الله عليكم اذ كنتم اعداء فالف بين قلوبكم فاصبحتم بنعمته اخوانا وكنتم على شفا حفرة من النار فانقذكم منها كذلك يبين الله لكم اياته) وحرررررررررررررررررررررررررام اللى انتوا بتقولوا على السعوديين واللى السعوديين بيعملوه فى المصريين وربنا يهدى العرب اجمعين0"
