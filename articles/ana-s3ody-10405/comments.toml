[[comments]]
order = 30
subject = "ضع عنوان التعليق الحدق يفهم"
author = "اكتب اسمك هنا د.سالم من مصر"
posted = "2008-11-17"
text = "الاستاذ اللى بينقل راى السفاره السعوديه فى مصر دا برده بينقل راى الامير والقاضى فى السعوديه<br />وعايزين نناقش الموضوع يا عقلاء بشوية عقل مش سب<br />والاحكام اللى صدرت ضد الاطباء دى لاتستند الى دلائل دى اقوال المجنى عليهم اللى من المحتمل انها تحت تهديد وما ادراك بالتهديد السعودى اشهر من النار على العلم والدليل<br />1-لاتوجد صحافه فى السعوديه(طرد ابعاد مراسلوا قناة الجزيره)اللى كل الناس عارفه مدى مصدقياتها<br />2-(((صحراء الربع الخالى))<br />3_لاتجد ابدا احد بالسعوديه يتكلم فى السياسه اوالحقوق الخاصه به<br />لانه لوحصل يروح لرقم 2<br />وهل يعقل ان دكتور استشارى شغال فى مستشفى كبيره ذى دى ومش فى بلده والناس خارجه داخله فى المستشفى اما اعين الناس هيرتكب اعمال منافيه للاداب فى الظروف دى وهواصلا عنده 52 سنه<br />ليه (مازنجر ولا هرقليز)<br />هو الموضوع متسبك بس كان عايز شوية توابل كمان علشان الناس تصدق الكم الهائل ده من الاتهامات<br />ومعقول واحد دخل بيت الامير وباشر الحاله 3 سنين وسافر معاهم خارج السعوديه كام مره<br />ولسه مكتشفين دلوقت انه دكتور بالسفاله دى ؟<br />ليه؟ هو كان بيدى العقاقير للبيت كله لدرجة ما يكتشفوش حقيقته الا بعد الفتره دى كله كان متخدر كده<br />مش بقولكم هرقليز<br />ويبدو من وجهة نظرى ان فيه شئ تم ومش عايزين الطبيب ده على قيد الحياة لسبب ما<br />فعايزين يقتلوه فمش لاقين طريقه يقتلوه بها تكون مش واضحه انها قتل فقالوا جلد فلو مات يبقى لم يكن قصدهم<br />بس ربنا يستر والقضيه تنتهى بسرعه لان استمرارها اكتر من كده هيسبب كوارث لا يعلمها الا الله<br />واللى اولى الشتايم اللى نزله زى المطر"
archived = "2010-03-14"
