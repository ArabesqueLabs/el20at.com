subject = "ضع عنوان التعليق / كلآم هذا للعقلآء المصريين"
author = "اكتب اسمك هنا أبن السعودية"
posted = "2008-11-15"
text = "أوحه رسالتي للأخوة المصريين العقلآء قلت العقلآء فقط نحن وأنتم نعيش في هذا البلآد الطاهرة بلآد الحرمين الشريفين كم عدد المصريين الشرفاء الذين يعيشون في هذا البلاد أنا متأكد أنهم أكثر من 300 الف مواطن مصري وكم الذين يسجنون ويعذبون على قول البعض !!<br />إذا أخطأ الطبيب أو المهندس أو السباك في بلدكم الآ تحاسبونه فلماذا لما أخطأ أثنين سواء أطباء أو غيره أحدثتهم هذه الضجة اليس في بلدكم سعوديين أخطأو بحق بلدكم ومحبوسين ويعذبون في سجونكم لماذا لآنقول هذا سعودي معصوم !!<br />لالالالا ياأخوان ليس هنا أوهناك أنسان معصوم من أحسن نقول له أحسنت ومن أساء يتحمل نتيجة خطأه لآتأخذكم الحمية حمية الجاهلية الأولى وبسبب 2 قد يحرم الآف لأن حكامنا ليسو كباقي الحكام ليسو كالقذافي الذي يتفاخربه البعض منكم وبسبه حكامنا ولأن حكامنا عقلاء لم يردوا عليه كالك........ ينب...... ويدخل وكره ثانية !!<br />حكامنا عقلاء ولكن إذا وصل الأمر فوق حده قد ينقلب عليكم كل الكلآم الذي يصدر من أناس غير أسوياء !!<br />ولو أخطأ الأمير أو القاضي او الضابط اليس له رب سيحاسبه والمظلوم اليس له رب ينصره &--64831;وسيعلم الذين ظلموا أيَّ منقَلَبٍ ينقلبون&--64830;<br />وأخر كلامي إلى الذين أتهموا السعوديات أقول لهم خافوا الله ولن نرد عليك بالمثل وكما يوجد أناس خبثاء يوجد ناس طاهرين والله مولنا ومولكم وبيننا وبنكم الله !!"
