subject = "مضطر للتعليق"
author = "سعودي مدمن على السفر لمصر"
posted = "2008-11-17"
text = "بصراحة شديدة لم اكن اتمنى التعليق لأني اعلم أن هناك مصريين متدينين وهم من لا اقصدهم بهذا التعليق<br />لكن حين تقلب الحقائق اقول:<br />المصريين يرمون نساء السعودية بالزنا وانا لا ابرئ نساء السعودية لكن الزانيات منهن تعلموا الفساد في بلدكم مصر بلد الانحلال والدعارة وانا من خلال سفراتي التي تعدت العشرين مرة للقاهرة اقول:<br />في مصر اكثر من 3 مليون بنت ليل ومليون ونصف جرار<br />اكرر لا اقصد المحافظين والمتدينين من احبابي في مصر"
