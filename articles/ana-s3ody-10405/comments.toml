subject = "قليلا من الانصاف"
author = "سعودية الهوى والهوية"
posted = "2008-11-17"
text = "لا اعرف لماذا هذه المهاترات والتوقع بان الحكم موجه للمصريين وليس لمجرمين اخلا بشرف المهنة<br />وللتذكير فقط قبل فترة حكم على شباب سعوديين بالسجن لمدة تصل الى تسع سنوات واخر ابتز فتاة لاحظوا ابتزاز وليس هتك عرض بالسجن لاربع سنوات<br />لذلك كبروا غقولكم ولاتأخذكم العواطف على الرايحة والجاية<br />ومابيننا وبين المصريين اكبر بكثير من هذا الشجار المنحط<br />سلام من السعودية الى مصر الحبيبة"
