[[comments]]
order = 51
subject = "الى امراء وقضاة السعودية"
author = "كتاب الله"
posted = "2008-11-18"
text = "الى امراء وحكام السعودية<br />ويوم تقوم الساعه يقسم المجرمون ما لبثوا غير ساعه كذلك كانوا يؤفكون الروم (آية:55)<br />ولو ترى اذ المجرمون ناكسو رؤوسهم عند ربهم ربنا ابصرنا وسمعنا فارجعنا نعمل صالحا انا موقنون السجدة (آية:12)<br />الى قضاة امراء وحكام السعودية<br />قال ادخلوا في امم قد خلت من قبلكم من الجن والانس في النار كلما دخلت امه لعنت اختها حتى اذا اداركوا فيها جميعا قالت اخراهم لاولاهم ربنا هؤلاء اضلونا فاتهم عذابا ضعفا من النار قال لكل ضعف ولكن لا تعلمون الاعراف (آية:38)<br />وقالوا ربنا انا اطعنا سادتنا وكبراءنا فاضلونا السبيلا الاحزاب (آية:67)"
archived = "2010-03-14"
capture_url = ""

