text = "أين الحقيقه للأسف عدم وجود شفافيه و مصداقية في الإعلام العربي هو السبب لما نحن فيه لكن لو ان الطبيبان اجرما وفقا للرواية السعوديه فليعدمو في ميدان عام ليكونو عبره أما لو ان الروايه المصرية صحيحه فعلى الحكومه المصريه ان تتدخل على الفور لتحرير الطبيبان و أيضا المساعده الطبيه لعلاج آثار علاج هذين الطبيبين لزوجة الأمير لكن الفيصل في هذا هو أن تقوم السلطات بنشر تحقيقاتها في هذا الشان عندها يمكننا و بشكل كبير تقييم الموقف لكن على أي حال 1500 جلده عقوبه مبالغ فيها و اعتقد أن المحكوم عليهم لن يتحملو هذا خاصة أنه بواقع 70 جلده كل 10 أيام اعتقد انا هذا موت بطئ و لا يستند للشريعة الإسلاميه و الله اعلم"
