subject = "موعدنا يوم نعرض على الله"
author = "مسلم ينتصر لدينه وعرضه ومشائخه"
posted = "2008-11-17"
text = "......................................................................................كل ما يجب ان يعرفه الناس ان السعوديين خنازير وصدق القائد معمر القذافى حين اسمى المقبور فهد قبح الله وجه بإسم خنزير الجزيرة ومن بعده عبدلله ابن فهدة الشريم الخنزير الديوث<br />اعزائى كل نساء السعودية عاهرات نجسات زوانى انجبن شعبا خليطا من الباكستانيين والبنجاليين والعنود والفليبينين.<br />نساء قذرات اوساخ الزنى يسرى فى دمائهم.<br />اخوانى الاعزاء الذين يقدمون الى السعودية<br />لتادية مناسك الحج او العمرة<br />لا تصلوا خلف امام الحرم المكى لانه لا تجوز<br />الصلاة خلف هذا الكلب الحقير<br />هذا اللوطى الذى يفعل بالاطفال ما فعله قوم لوط<br />ان هذا الخنزير حاول منذ فترة مجموعة من الناس اغتياله<br />داخل الحرم وامام الكعبة بسبب ما اقترفه من فعلته القذرة<br />واغتصاب ابنهم ذو الخمس سنوات<br />هؤلاء الكلاب شيوخ السعودية يبحثون عن اللواط مع الصغار<br />وزوجاتهم تتقلب فى الفراش مع الهنود والفليبيين<br />خسئتم يا مشايخ الوهابية. ................................................................<br />غلى عقلائكم مع الاسف هذا كلام إنما يدل على الحقد الدفين للأسلام والمسلمين سواء كان من السكان أو من المقيمين ليعلم كاتب هذا الكلام أنه سيعرض على الله يوم القيامة وليغمسنه في جهنم غمسه تنسيه النعيم الذي قد كان فيه<br />وستشهد عليه جوارحه يوم القيامه ووالله اني أشكره شكراً على هذا التطاول على حكامنا وأفراد المواطنين لأن هذا فيه محق لحسناته هذا إن كانت عنده حسنات وزيادة للحسنات من تطاول عليهم من المقيمين وليعلم أخواننا المصريين ان هذا يسئ إلى نظرتنا إليهم كشعب محترم ومحبوب لاننا لنرضى على ملوكنا وولاة أمورانا وعلى أنفسنا الطعن في شرفنا وشرف أبائنا وليعلم صاحب الرأي المتخلف ان إخوانه هم عمالة عندنا نعاملهم بإحترام ولو أنه كان أحد هؤلاء العماله لما تطاول على هذه الامه العظيمه ولاتطاول على أأمتنا ومشائخنا الذي والله العظيم أنهم من دعات الحق والناهون عن الباطل وأرجو من الله العظيم أن يرينا فيك يوم أسود كيوم عاد وثمود وان ينكل فيك ويشردك .........<br />أما ماذكُر عن أحد مشائخنا فهو باطل والرجل الذي إعتدى عليه مريض نفسياً"
