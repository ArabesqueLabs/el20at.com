[[comments]]
order = 29
subject = "ضع عنوان التعليق انا لله وانا اليه راجعون"
author = "اكتب اسمك هنا  د.محمد .ا(مصر)"
posted = "2008-11-17"
text = "والذين اذا اصبتهم مصيبة قالوا انا لله وانا اليه راجعون<br />دا الاسلوب اللى نحل بيه المشكله لما نسب فى بعض هتتحل المشكله مالنا ومال نساء السعوديه ولا مصر ولا......<br />والدكتور المحترم اللى ذكر اسماءالبنات اللى عملوا ترقيع للبكاره هل دا اسلوب طبيب وهل بذكرك اسماؤهم الطبيبين هيتخفف عنهم الحكم وهل لما تثبت ان زى ما بتقول اللى ذكرتهم بالاسم دول انهم زى ما بتقول هتثبت ان الاطباء دول ابرياء انت للاسف يا دكتور انت جيت تكحلها عميتها<br />والله اعلم اللى قرا الاسامى دى منهم او اخوتهم حصلوا ايه او هيتصرف اذاى<br />مش اخلاق طبيب دى نهائى ولا غير طبيب وبعدين انت معاك لكل اسم من اللى ذكرته ده اربع شهود ((مش انا اللى بقول )) الدين اللى بيقول<br />انت عارف لو الطبيبين دول كانو عارفين اللى انت هتعملوا ده...هيحصل كانوا فضلوا الحكم اللى صادر عليهم من انك تقول الاسامى دى ...الله يكون فى عون اللى ذكرتهم دول<br />اما موضوع القضيه فواضح زى الشمس<br />وعجبنى جدا راى احد الناس فانا افضل انقله ....<br />السؤال الأول: هل يمكن لطبيب أن يقوم بالكشف علي مريضة دون وجود محرم؟ الأجابة بالطبع لا..لسبب بسيط أنها لاتستطيع الخروج من<br />بيتها أصلا بدون محرم..ولاتستطيع أن تقود السيارة..والا واجهت مصيرها المحتوم....السؤال الثاني: اذا افترضنا أنها أستطاعت<br />أختراق كل هذه الحواجز..فان المنطقي أن الطبيب لن يقوم بالكشف عليها ألا في وجود ممرض أو ممرضتين..حتي لايتهم بالخلوه غير<br />الشرعية....السؤال الثالث: الطبيب استشارى..أى أنه لا يمارس عمله ألا في الصباح أو في الفترة المسائية..أعني أن المستشفي<br />تكون ممتلئة بالاطباء و الممرضين و المرضي..كيف يستطيع أن يختلي بالمريضة دون محرم و يعطيها المخدر ثم يقوم باغتصابها و ينتظر حتي<br />تفيق من تأثير الدواء..و تسير المسكينة مترنحة أمام الحضور دون أن يتساءل أحد عما كان يدور وراء الأبواب المغلقة..أو تتساءل هي<br />عما كان<br />يفعل بها و خصوصا أنها ستعرف أن الطبيب لم يقم بأي اجراء طبي لها طيلة وجودها بالعيادة..و ستعرف يقينا الوقت الذي قضته بالعيادة<br />عن طريق ساعة يدها أو ساعة الحائط أو بسؤال أحد الحضور عن الوقت..فضلا أنها سوف تجد بعض مخلفات الطبيب المنوية علي ملابسها<br />أو علي أو بداخل جسدها....السؤال الرابع: يبدو أن طبيبنا المسكين كان يرتدي طاقية الاخفا..وطبعا هذا مستحيل..اذا لابد أن له<br />شركاء نالوا نصيبهم من التورتة حتما اذا صحت الرواية المزعومة.. فلماذا لم ينالهم نفس العقاب....السؤال الخامس: لماذا لم يرتاب<br />أحدا في الأمر وخصوصا أن أمرا هاما من أمور الشريعة قد استبيح ..فقد تم اقصاء المحرم بعيدا ليلتهموا الفريسة في وقت مزدحم<br />بالحضور.. وأكيد سيرتاب أحد الأذكياء في الأمر.. فلماذا لم يتم اقتحام خلوتهم لكشف أمر الطبيب.. أو يتم عمل كمين ليضبط<br />الطبيب متلبسا و هذا لم يحدث في الرواية المزعومة..بدلا من رمي الناس بالباطل....السؤال السادس: لماذا لم يرتاب أحدا من<br />الضحايا..لابد أن ذلك كان بموافقتهن..حينئذ لم يكن هناك داع لاستخدام المخدر..فلماذا لم يوقع بهن حد الزناه.. واذا لم يكن<br />بموافقتهن وارتابت احداهن حتما..فلماذا لم يتم عمل كمين للطبيب ليضبط متلبسا و هذا لم يحدث مرة أخري حسب الرواية المزعومة..السؤال<br />الأخير: هل العقوبة التي نالها الطبيب انتقامية.. الاجابة بالطبع يقينا.. وذلك للأسباب الآتية:1. يبدو أن القاضي تعامل مع الطبيب<br />المسكين بعقلية سليمان بن عبد الملك حين أخذ يزيد المال المطلوب استرداده من موسي بن نصير مئة ألف في كل مرة يعترض فيها علي كذب<br />الوشاية..فلم و لن نسمع أن الذي يتجرأ علي الاستئناف يزيد له القاضي العقوبة بدلا من اقرارها أو تخفيضها. 2. هل الطبيب زانيا؟<br />فلماذا لم يرجم؟ 3. هل الطبيب من المفسدين في الأرض؟ فلماذا لم يطبق حد المفسدين في الأرض؟ 4. هل 1500 جلدة + 15 سنة<br />سجن.. سبققكم بها أحد من العالمين.. لم و لن نسمع أن هناك جلد في الاسلام الحقيقي أكثر من مائة<br />جلدة.......!!!!!!!<br />وفى النهايه ندعوا الله ان يهدى الطرف السعودى فى القضيه ونقول له اتق الله<br />سواء اكنت اميرا او قاضيا اتق الله وان كنتم ترون انهم مخطئون فلا تؤلفوا فى الحكم فانتم تعيشون فى رحاب الحرمين الشريفين<br />واقول لك ايها الامير اتق الله فمصيرك الى التراب<br />وانك لن تخرق الارض ولن تبلغ الجبال طول<br />ولا تسلك درب فرعون فاستخف قومه فأطاعوه<br />ولا يغرك نفوذك فان كنت تقدر على البطش فهناك من هو اقوى منك بطشا<br />واحكم بكتاب الله فجميعنا يعلم انك انت الذى تحكم وليس القاضى المسكين"
archived = "2010-03-14"
