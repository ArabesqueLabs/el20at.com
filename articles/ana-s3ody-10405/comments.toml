[[comments]]
order = 28
subject = "\" اللهم انصر من ظُلم ، واعفو عن من ظَلم…"
author = "مسلمة مصرية"
posted = "2008-11-16"
text = "إن كلا من سعيد الراوي وأحمد رؤوف ... ليس كلامهم هو كلام مسلمي مصر ... وأهل مصر بريؤن من ذلك والحمد لله،، فاللهم اغفر لنا .. فلا يعتقد أحد من العرب وخاصة السعوديين أن هذا الكلام ممكن أن يجري على لسان إنسان مسلم يحترم الشريعة الإسلامية ويعمل بها .<br />ودليلي على أنهم ليسوا من أهل السنه وأنهم من أهل الشيعة قول أحدهم \" خسئتم يا أهل الوهابية \" وأنا بريئة مما قال ، فلا يقول هذا إلا ناقم على أناس نهجوا نهج الشيخ الجليل عبد الوهاب الذي ما كان نهجه إلا بنهج نبينا الكريم عليه السلام.. والدليل الثاني : هو استشهادهم بقول معمر القذافي الذي أباح دمه مشايخ المسلمين .. فلا أرى فيهم إلا قوم لم يعقلوا ما يكتبون ولم يفهموا ما يقولوا ... لم نعتاد ذلك إلا من الشيعه حفظنا الله وإياكم.<br />ولكن نقول للطبيبين \" إن كنتم مظلومين فنحن قد رفعنا يدينا دعاءا لكم .. وإن كنتم مذنبين فلكم الله في الحكم الذي وقع عليكم ، فنحن لم نعلم أن الرسول صلى الله عليه وسلم قد قام بمثل ذلك من قبل ... فهو خير قدوة ، وكتاب الله الذي أُنزل بين يده لم نقرأ فيه ذلك ، وسنة النبي لم نرى فيها ذلك .. فلا أعرف من أين جاؤوا بهذا الحكم ، وهل يرضى القاضي عن نفسه بعد أن نطق بهذا الحكم المتعنت ؟؟؟؟؟ كل هذه أسأله لا يعرف إجابتها إلا واحد .......... هو الله.<br />وادعوا جميع المسلمين ألا يجمعوا جميع أهل البلد في السب واللعن من أجل فرد أو فردين ... فلم نعرف هذا عن رسول الله ، بل الدعاء الدعاء من أجل رفع الظلم عن المظلومين ، وإبعاد الظالمين عن الظلم ."
archived = "2010-03-14"
