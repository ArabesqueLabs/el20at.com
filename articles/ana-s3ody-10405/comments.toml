subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-11-13"
text = "لا تزال قضية الطبيب المصري رؤوف أمين محمد العربي المسجون بالسعودية تشغل الرأي العام في مصر كما أنها أخذت بعدًا سياسيًا بعد تدخل وزارة الخارجية المصرية لدي المملكة للنظر مرة أخري في الحكم الصادر ضد الطبيب ومحاولة تخفيفه بعد توجيه عدة تهم للطبيب منها تهمة خيانة الأمانة وأنه كان السبب في إدمان زوجة إحدي الشخصيات المهمة في السعودية. لذلك حكم عليه بالسجن سبع سنوات والجلد 1500 جلدة وذلك بعد استئنافه للحكم الاول لمحكمة التميز في جدة والتي حكمت عليه بالسجن ثلاث سنوات ونصف و750 جلدة وتم مضاعفة العقوبة بعد استئناف الحكم من قبل الطبيب والمدعي العام السعودي. هذه القصة فتحت من جديد قضية العمالة المصرية في الخارج والتي تتعرض دوما للإهانة وسوء المعاملة دونما تدخل يذكر من وزارتي الخارجية والقوي العاملة. واستطاعت «الدستور» أن تحصل علي نص التحقيقات التي أجرتها السلطات السعودية مع الطبيب وحيثيات الحكم الصادر ضده من قبل محكمة التميز الجزئية بجدة والحكم الذي أصدره القاضي صالح بن سعيد الزهراني. وقد جاء في لائحة الاتهام والحكم الصادر من المحكمة الجزئية بجدة انه بناء علي المعاملة المحالة من رئيس المحكمة الي القاضي صالح بن سعيد الزهراني بشرح رقم 7802 في 21/7/1428 هم المبني علي خطاب الادعاء العام رقم هـ 24/258 ش وتاريخ 11/7/1428كم المتعلقة بدعوي المدعي العام/ عبد الله بن عبد السلام العسيري ضد كل من:<br />- شوقي بن عبد ربه بن إبراهيم، مصري الجنسية، بالإقامة رقم 2099575702 بتاريخ 21/12/1426م جدة ويعمل طبيب طوارئ وهو إخصائي في الباطنة موقوف بسجون المباحث الإدارية بجدة منذ 28/9/1427م / رؤوف بن أمين بن محمد العربي، مصري الجنسية بالإقامة رقم 2068700471 وتاريخ 13/9/1426م صادرة من جوازات الرياض ويعمل طبيبا إخصائيا في الجراحة ويحمل الشهادة العالمية «الدكتوراه» في إدارة المستشفيات موقوف بسجون المباحث الإدارية بجدة منذ 26/3/1428 هـ متهمين بخيانتهما للأمانة والعمل علي تدمير الصحة العامة واستغلاله صفتهما كطبيبين في نشر وترويج عقاقير طبية خاضعة للرقابة بحقنهما لمرضاهما ومراجعيهما وغيرهم باستمرار وعلي مدي عدة سنوات وترغيبهم في ذلك علي وجه الخديعة والمكروب وباستخدامهما عمداً هذه العقاقير حتي تمكنا من إصابة عدد منهم بالإدمان لابتزاز المزيد من أموالهم جراء ذلك وارتكاب المدعي عليه الأول «شوقي» الجرائم التالية:<br />* الاشتراك في جلب تسعمائة وخمسين أنبوبة من عقار (الدروميكوم) وأربعمائة وعشرين أنبولاً من عقار النالوفين إلي داخل المملكة لترويجها.<br />* سرقة عشر أنبولات من عقار الدروميكوم من مستشفي الأنصاري مكان عمله وحصوله علي كمية من عقاري الناليوم والكيتامين بطريقة غير مشروعة وترويجها.<br />* حيازة أنبولين من عقار الدروميكوم وأربع حقن تحتوي عليه بقصد ترويجها وحيازه كميات كبيرة من الحقن والمستحضرات الطبية لاستخدامها في ترويج العقاقير.<br />* شراء مائة أنبول لعقار (الدروميكوم) من المدعي عليه الثاني لترويجها.<br />* بيع أربعة أنبولات لعقار (الدروميكوم) للمدعي عليه الثاني.<br />* إقامة علاقة محرمة مع عدد من النساء اللاتي كان يحقنهن بهذه العقاقير والاختلاء المحرم بهن.<br />وأشارت المحكمة إلي أن الطبيب رؤوف العربي ارتكب عدة جرائم كالاشتراك في جلب كميات العقار (الدروميكوم) إلي داخل المملكة بقصد ترويجها والتستر علي من يقوم بذلك، وبيع مائة أنبولة من عقار (الدروميكوم) وترويجها حيث قبض عليه في التاريخ المذكور أعلاه بعد توفر معلومات عن الأول تفيد متاجرته في العقاقير الطبية علي نحو غير مشروع وبتفتيش منزله ضبط به مبلغ أربعمائة واثنان وستون ألف ريال سعودي وخمسة وعشرون قرشا ومائة وتسعون جنيها مصريا وخمسة وسبعون قرشا حصريا وستة أجهزة موبايل وأربعة أجهزة حاسب آلي محمول \"لاب توب \"وجهاز حاسب آلي مكتبي (هاردسك) ومجموعة من الأقراص المرنة ومجموعة كبيرة من أقراص الليزر الممغنطة «cd» ومجموعة من الأدوية وأربع آلات تصوير ومجموعة من أشرطة الفيديو وألبوم صور وثمانية وعشرون ساعة يد رجالية ونسائية. وأوضحت المحكمة أنه صدر خطاب مدير مستشفي الصحة النفسية بجدة رقم 1324/781/1م/47ج وتاريخ 2/6/1428م إفادة مدير الرعاية الصيدلية والتموين الطبي بشأن المواد المشار إليها أعلاه وأنها أدوية خاضعة للرقابة دوليا وبعضها يصنف من أدوية المجموعة الثالثة الجدول الثاني والثالث وتمتاز بآثار جانبية متشابهة وهي غالبا كالتالي:<br />أ- الجهاز العصبي المركزي: انتعاش وغبطة غير مبررة، هلوسة، تشويش، جدل، عصبية، قلق هذيان أو هياج، اضطراب نوم، أرق، كوابيس، دوخة، تشنجات، ضعف الأداء الفعلي والطبيعي، تخوف كآبة، مشاعر عائمة، حركات عضلية غير منسقة، اضطراب.<br />ب-ا لقلب والأوعية الدموية: تبرد، صدمة، زيادة خفقان القلب وعدم انتظام النبض، انخفاض ضغط الدم خاصة عند الوقوف المفاجئ، وسكتة قلبية تحدث بعد الحقن الوريدية السريعة.<br />جـ الجهاز الهضمي: جفاف الفم، إمساك، تشنج منطقة الصفراء، شلل لفائفي، فقدان شهية، إسهال، تشنجات، تغيير في حاسة التذوق، يحدث الفتيان والتقيؤ بشكل نادر.<br />د- الجهاز التنفسي: انخفاض وسرعة التنفس (نهجان) مع شعور بالضيق كما أن هذه الأدوية تحدث أعراضا انسحابية مماثلة إلي تلك الملاحظة كحامض البربيتورين والكحل هذه بطنية وتشنجات عضلية وتقيؤ وترق تحدث بعد التوقف غير المتوقع لمجموعة البنزوديازيبين وأعراض الانسحاب الحادة الأكثر عادة حدثت لأولئك المرضي الذين استعملوا الجرعة المفرطة علي فترة زمنية.<br />وأكدت المحكمة أنه باستجواب المدعي عليه الأول شوقي أقر بأنه منذ ثلاث سنوات بدأ في ترويج عقاري (الدروميكوم) والنالفوفين وذلك بحقنها لمتعاطي ومدمني هذين العقارين بطريقة غير مشروعة والدعوة إلي ذلك والترغيب فيه إلي أن يصل المتعاطي إلي مرحلة الإدمان ليحقق زيادة في مكاسبه المادية التي كان يحصل عليها من المتعاطين والمدمنين لهذه العقاقير حتي تمكن من خلال ذلك من جمع مبالغ مالية كبيرة وأقر بأن الأنبولين والإبر الأربع التي ضبطت بحوزته تحتوي جميعها علي عقار الدروميكوم وأنه كان سيحقن بها أحد المدمنين مقابل حصوله منه علي مبالغ مالية وأن الإبر وجميع المستحضرات الطبية التي ضبطت معه وبكميات كبيرة كان يستخدمها في حقن الأشخاص المتعاطين بالعقاقير المشار إليها.<br />كما أكدت المحكمة أن الطبيب المصري أقر بأن إحدي المتعاطات طلبت منه توفير عقار «الدروميكوم» يومياً لذلك قام بسرقة عشرة أنبولات من عقار الدروميكوم من مستشفي الأنصار الذي يعمل به دون علم إدارة المستشفي وقام بحقنها لمتعاطيه بصفة يومية علي مدي عشرة أيام وحصل مقابل ذلك علي مبلغ خمسمائة ريال عن كل حقنة كما أقر بأنه استمر علي هذا النهج لأكثر من ثلاثة أعوام وهو يحضر يوميا إلي منزل إحدي متعاطيات عقار «الدروميكوم» وبحقنها بهذا العقار بمعدل 3سم مقابل حصوله منها علي مبلغ خمسمائة ريال عن كل حقنه كما اعترف بأنه عندما تعذر عليه الحصول علي العقار من مستشفي الأنصار أخذ يفكر في طريقة للحصول من مكان آخر علي هذا العقار وعقار النالفوفين حتي اقنع إحدي العاملات في مستشفي الأنصار تسافر إلي مصر بصفة مستمرة وتدعي «مي بنت عثمان زكريا» بأن تجلب له كمية من عقار «الدروميكوم» والنالوفين من مصر.وقد أوهمها أنه يستخدمها كدواء لمن يشرع لهم استخدام هذه العقاقير من مرضي السرطان فقام من أجل ذلك بجلب تقارير طبية صادرة من مستشفي الملك عبد العزيز للأورام لأشخاص مصابين بمرض السرطان وموصوف لهم عقاري الدروميكوم والنالوفين الموجود بمستشفي الأنصار من أجل تلقي هؤلاء المرضي العلاج لدي مستشفي الأنصار كما أعد تقارير طبية مزودة أصدرها من مستشفي الأنصار تحت توقيعه من ضمنها تقرير طبي بخط يده وتوقيعه وختمه أعده باسم مريضة تعاني من ورم سرطاني بالدماغ وذكر في التقرير الطبي أنها تحتاج لعقار النالوفين برغم أن المريضة لم يوصف لها هذا العقار ثم سلم جميع هذه التقارير للمدعوة «مي» لتقدمها للجهات المختصة في مصر والمملكة لتتمكن من جلب هذين العقارين المخدرين للمملكة وأقر بأن المدعوة مي جلبت له من مصر بناء علي ما تقدم تسعمائة وخمسين أنبولة من عقار «الدروميكوم»، فقام بإبلاغ الأشخاص المتعاطين بذلك وبدأ يذهب يوميا إلي منازلهم ويحقنهم بهذا العقار بمعدل 3سم للجرعة الواحدة مقابل حصوله علي مبلغ خمسمائة ريال عن كل جرعة، كما أقر بأن المدعوة\" مي \"جلبت له عدة مرات متفاوتة ما مجموعه أربعمائة وعشرون أنبولاً من عقار النالوفين المخدر وقد قام بتسليم ما يقارب مائة أنبول من تلك الكمية إلي أحد المتعاطين بناء علي اتفاق سابق بينهما واحتفظ بالباقي في منزله وعندما حقق معه من قبل إدارة مستشفي الأنصار نقل الكمية التي لديه من عقار النالوفين إلي منزل أحد المتعاطين وأضاف بأن جميع الأنبولات التي تحتوي علي عقار الدروميكوم والنالوفين التي جلبتها له المدعوة «مي بنت عثمان» من مصر كان يستلمها منها في مستشفي الأنصار وأنها كانت لحسابه الخاص ولحقن المتعاطين والمدمنين مقابل مبالغ مالية وأوضحت المحكمة أن الطبيب استطاع من خلال اتباع هذا النهج جمع مبالغ مالية تجاوزت المائة ألف ريال بالإضافة إلي السابق تحصيله منذ قدومه من مصر في شهريوليو 2005م وحتي تاريخ القبض عليه علي مبلغ ثلاثمائة وخمسين ألف ريال من المتعاطين والمدمنين لهذه العقاقير المخدرة بالإضافة لأموال عينية،منها ثمان وعشرون ساعة يدوية من مختلف العلامات التجارية وخمسة موبايلات نوكيا من مختلف الأنواع وثلاثة أجهزة حاسب آلي محمول وجهاز حاسب آلي مكتبي ضبطت بحوزته في هذه القضية وهي من نتاج امتهانه لحقن المتعاطين والمدمنين بالعقاقير المخدرة. وقال المدعي العام: أطالب بالحكم عليهما وإدانتهما بما أسند إليهما بعقوبة تقديرية شديدة سجنا وجلدا تزجرهما وتروع غيرهما والحكم بمصادرة ما تم ضبطه بحيازة المدعي عليه الأول من أحوال نقدية وعينية. وقالت المحكمة: بالاطلاع علي اعتراف المتهمين المصدق شرعًا لفه 2 ولفه 1 وجدت المحكمة أنهما مطابقا لما ورد في ذكر المدعي العام، وفي يوم الأربعاء 16/8/1428م حضر المدعي عليهما وبعرض اعترافهما المصدق شرعاً أجاب بأن الاعترافات عليهما بالضغط والضرب فسألتهما عن البينة علي الضرب فأجابا البينة لدينا وهي آثار جسدية فعلية.<br />وجاء في نص الحكم أن المحكمة حكمت علي المدعو شوقي بن عبد ربه إبراهيم بالسجن عشر سنين من تاريخ دخوله السجن وجلده خمسين جلدة مكررة خمسة عشر مرة بين كل مرة والتي تليها عشرة أيام وحكمت علي المدعي عليه الثاني رؤوف أمين محمد العربي بالسجن سبع سنين من تاريخ دخوله السجن وجلده خمسين جلدة مكررة سبع مرات بين كل مرة والتي تليها عشرة أيام ومصادرة المبالغ المالية التي بحوزتهما وما استخدم في الجريمة من وسائل اتصال وسيارات تعود ملكيتها لهما وإبعادها عن البلاد بعد انتهاء محاكمتها وبعرضه عليهما قرار عدم القناعة وقرر المدعي العام عدم قناعته.<br />س / هل ترضي مابدر من الطبيبين علي اهلك او اختك او اي احد من محارمك ؟"
