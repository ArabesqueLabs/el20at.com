text = "الي محمد المعلق السابق<br />انا لا احب اسلوب نقضك لراي حقاني كما كرهت اسلوبه فلا هو كان حقاني في نقضه و لا انت كنت منصفا تقيا في ردك<br />وعلي كل انا مصرية و ان كانوا مجرمين حقا فهم عندي كالسكري في قضية تميم يستحقون شرع الله<br />و ان كانوا مظلومين فيجب ان نهتم في مصر اولا باحكام القضاء و مدي نزاهتها هنا قبل ان ننظر اليها خارج بلادنا<br />علي كل علي راي المثل اللي يقول لمراته ياعورة الناس تلعب بها الكورة<br />لما فقد المصري احساسه بالكرامة و العدل داخل بلده فلاي مدي تتوقعون ان يجدها خارج وطنه<br />و الافضل بني وطني ان تتخذوا من اخلاقكم و سمعتكم وطنا تنتمون اليه و يصفكم الناس بها"
