[[comments]]
order = 17
subject = "فوقوا بقى......."
author = "مسلمة"
posted = "2008-11-15"
text = "بصراحة انا حزينة للكل اللى بيحصل دا وبيتقال<br />قضية الطبيبين دول لو كانت بمصر واتحكم فيها حتى بالاعدام مكنتش اخدت الشكل دا ولا المساحة الاعلامية دى<br />بس كل الحكاية ان القضية حصلت لمصريين مقيمين بالسعودية ..الناس كلها بتتكلم ومحدش عارف فين الحقيقة وكل واحد بيقول كلمة ربنا هيحاسبة عليها مش معنى انى حصلى موقف او بسمع شئ مش كويس عن الشعب السعودى ااقوم اعمم دا على الشعب كله لا ومش كدا اشتم واسب رموز كتيرة احنا بنحترمهم زى علماء السعودية واللى سب وشتم ونصح المسلمين انهم ما يصلوش خلف الشيخ السديس بقوله اتقى الله بكلامك فكل لفظ انت بتقوله عليها رقيب عتيد<br />انتو كدا هتوصلوا القضية الى حرب ومشاحنات اثناء موسم الحج القادم لان اكيد الى هيسافر للحج لو اتعرض لاى حاجة مش عجباه هناك ممكن جدا الخلقية اللى حصلت بسبب القضية هتخلية يثور ويشتم ويسب وبكدا يبقى خسر حجة وياعالم ايه اللى ممكن يحصل بعد كدا<br />مهما حصل حتى لو كان فيه ظلم واقع على الطبيبين دول مش هننسى للسعودية والسعودين مواقف كتير كلها بتنم على وقفة المسلم جنب اخوة المسلم<br />كفاية اللى بيعملوة للحجاج بمكة والمدينة من خدمات وتوفير كل سبل الراحة ليهم<br />وكتير جدا من المصريين عايشين بالسعودية باحترام وامان وتربطهم علاقات طيبة باخوانهم السعوديين<br />ليه علشان قضية او بعض التصرفات الغير محسوبة من قلة من السعوديين ننسى كل دا<br />السعوديين لغاية انهاردة بيعترفوا ان اللى علمهم مدرس مصرى سواء بالمدرسة او الجامعة يعنى مش ناكرين فضل المصرى عليهم<br />ليه احنا نطلع بشكل الناكر وننكر لهم مواقف كنيرة وايادي بيضاء امتدت لينا باحلك ظروف مصر<br />والله يرحم الملك فيصل<br />الناس اللى بتسب وتشتم وماسكة بوق بتنفخ فيه وعماله تحرض وعايزة حريقة تحصل بين الشعبين ماتنسوش انكم بكدا بتدوا لاعداء الامة الفرصة انها تكسركم ..فوقوا دول مستنين لحظة واحدة بس وينقضوا على القصعة ويلتهموها<br />هما عارفين كويس دور مصر والسعودية لحماية الاسلام ونشره<br />وعارفين ان اى مصيبة بين المسلمين وبين الشعبين دول بالذات فى مصلحتهم وتلبية لرغباتهم المريضة<br />بدل ما نفكر بعقل ...مش يمكن للطبيبين دول يكونوا فعلا اخطأو وبكدا يستحقوا العقاب<br />و لو كانوا مظلومين اكيد فيه طرق تانية نقدر نثبت بيهم حقهم ونرفع الظلم عنهم بدل ما بنقطع ببعض بالشكل دا<br />بمهاترات واساليب بتزيد فرقة المسلمين ..فوقوا الله يخليكوا قبل فوات الاولن"
