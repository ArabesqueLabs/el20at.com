subject = "موعدنا يوم نعرض على الله"
author = "مسلم ينتصر لدينه وعرضه ومشائخه"
posted = "2008-11-17"
text = "ليس في المقطع يالحقير مايدل على مصداقية كلامك وإن كان هناك دليل على كلامك فنرجو الإدلاء به ولو كان هناك مقدار شعرة من الصدق في كلامك لما وضع في هذا المكان الشريف الذي يأتون إليه بعض الشرفاء منكم كل سنه ويتمنون العيش فيه ويحبونه ويحبون أهله ومن سعى إلى المحافظة عليه ونظافته وتوسعته<br />هذا هو أدب الحوار الذي تدعون إليه....خسئتم يا من تدافعون عن الشواذ....... فوالله مايوجد في كلامك ولاكلام بعض إخوتك الحمقى شيئا من الادب وإنما يدل ذلك على العقلية والادب فنقول لك سوف يعرض كتابك على الله ...<br />ومامن كاتب إلى سيفنى..... ويبقي الدهر ماكتبت يداه<br />فلا تكتب بخطك غير شيئاً ..... يسرك في القيامة أن تراه<br />قال تعالى (((ويوم يحشر أعداء الله إلى النار فهم يوزعون (19) حتى إذا ماجاؤوها شهد عليهم سمعهم وأبصارهم وجلودهم بما كانو يعملون (20) ........ ))) سورة فصلت<br />وقد قال الرسول عليه أفضل الصلاة وأتم التسليم ((الدواوين يوم القيامة عند الله ثلاثه ديوان لايغفره الله أبدا وديوان لايبالي الله به أبدا وديوان لايترك الله منه شيئا أبدا فالديوان الاول هو الشرك والديوان الثاني هو ظلم العبد لنفسه والديوان الثالث هو ظلم العبد للغيره من المسلمين فكيف بإمام الحرم الشريف<br />أما عقلاء هذا البلد الحبيب فنرجو منكم التعقل والتريث وعدم قذف أحد بالباطل والأنكار على هولاء الفسقه الجهله الذي يقذفون الإسلام بما هو بري منه وعدم السكوت عن هذا الفجور<br />وأدعو الله أن ينتقم من كل فاسق قاذف يسعى بين الناس بالفضيحه والكذب والبهتان"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 42
subject = "الى الكلب/ مسلم ينتصر لدينه وعرضه ومشائخه وحكومته"
author = "احمد رؤوف"
posted = "2008-11-17"
text = "انت دولة تعتيم اعلامى, وشعبكم احمق, هذا الكلام معروف فى كل انحاء المملكة القذرة وقد اخبرنى به مقربون من اسرة الطفل. ولو طبقتم ما تسمونه بالشريعة على هذا الوغد الشيخ اللوطى لافتضح امركم بين العباد ولداستكم الاقدام ولفظكم جميع البشر. ولكنكم اثرتم السكوت خوفا من الفضائح.<br />ماذا فعلتم مع مدير المدرسة الذى اغتصب ابن الطبيب المصرى منذ اعوام وتم توقيع الكشف الطبى عليه وثبتت عملية اغتصاب الطفل وحولتم والده من مجنى عليه الى جانى ووضعتموه بالسجن وجلدتموه.<br />ايام زمان كان السذج فى مصر كثيرون وكانت السعودية لها مكانة كبيرة فى قلوبهم وكان البعض تدمع عيناه عندما يذكر اسم السعودية لهفة وتشوقا اليها والى زيارتها.<br />اما الان فالجميع بمجرد ذكر اسم هذه البلدة النجسة ((السعودية)) يبصق اى فرد يسمع الاسم تلقائيا ولا اراديا من كثرة نجاستكم.<br />لعنة الله عليكم جميعا حكومة وشعبا ومشايخ يا قوم لوط."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 43
subject = "موعدنا يوم نعرض على الله"
author = "مسلم ينتصر لدينه وعرضه ومشائخه"
posted = "2008-11-17"
text = "أولا لم تأتني بدليل واحد سوى حماقات ليس لها أساس من الصحه<br />ثانيا<br />ذُنُوبُكَ يَا مَغْرُوْرُ تُحْصَي وَتُحْسَبُ<br />وَتُجْمَعُ فِي لَوحٍ حَفِيْظٍ وَتُكْتَبُ<br />وَقَلْبُكَ فِي سَهوٍ وَلَهوٍ وَغَفَلةٍ<br />وَأَنْتَ عَلَى الدُّنْيَا حَرِيِصٌ مُعَذَّبُ<br />تُبَاهِيْ بِجَمْعِ المَالِ مِنَ غَيْرِ حِلِّهِ<br />وَتَسْعَى حَثِيْثاً فِي المَعَاصِيْ وَتُذْنِبُ<br />أَمَا تَذْكُرُ المَوتَ المُفَاجِيْكَ فِي غَدٍ<br />أَمَا أَنْتَ مِن بَعْدِ السَّلامِةِ تَعْطَبُ<br />أَمَا تَذْكُرُ القَبْرَ الوَحِيْشَ وَلَحْدِهِ<br />بِهِ الجِسْمِ مِن بعْدِ العَمَارَةِ يَخْرُبُ<br />أَمَا تَذْكُرُ اليَومَ الطَّويلَ وَهُـوَ لَهُ<br />وَمِيزَان قِسْطٍ لِلْوَفَاءِ سيَُُنْصَبُ<br />تَرُوْحُ وَتَغْدُو فِي مَرَاحِكَ لاَهِياً<br />وَسَوفَ بِأشْرِاكِ المَنِيَّةِ تَنْشَبُ<br />تَُُعالِجُ نَزْعَ الرُّوحِ مِن كُلِّ مَفْصِلٍ<br />فَلا رَاحِمٍ يُنْجِي وَلاَ ثُمَّ مَهْرَبُ<br />وَغُمضَتِ العَيْنَانِ بَعْدَ خُرُوجِهَا<br />وَبُسِّطَتْ الرِّجْلاَنِ وَالرَّأْسُ يُعْصَبُ<br />وَقَامُوا سِراعاً فِي جَهَازِكَ أَحْضَرُّوا<br />حَنُوطاً وَأَكْفَاناً وَلِلِمَاء قَرَّبُوا<br />وَغَاسِلُكَ المَحُزُونُ تَبْكِيْ عُيُونُهُ<br />بِدَمْعٍ غَزِيْرٍ وَاكِفٍٍ يَتَصَبَّبُ<br />وَكُلُّ حَبِيْبٍٍ لُبُّهُ مُتَحَرِّقٌ<br />يُحَرِّكُ كَفَِّيْهِِ عَلَيْكَ وَيَنْدُبُ<br />وَقَدْ نَشَرُوا الأَكْفَانَ مِن بَعْدِ طَيِّهَا<br />وَقَدْ بَخرّوا مَنْشُورَهُنَّ وَطَيَّبُوا<br />وَأَلقَوْكَ فِيْمَا بَيْنَهُنَّ وَأدْرَجُوا<br />عَلَيْكَ مَثَانِي طَيَّهُنَّ وَعَصّبُوا<br />وَفِي حُفْرَةٍ أَلْقَوكَ حَيْرانْ مُفْرَداً<br />تَضُمَّكَ بَيْدَاءُ مِن الأَرْضِ سَبْسَبُ<br />إِِذَا كَانَ هَذَا حَالُنَا بَعْدَ مَوْتِنَا<br />فَكَيْفُ يِطِيٍبُ اليَومَ أَكْلٌ وَمَشربُ؟!<br />وَكَيْفَ يَطِيْبُ العَيْشُ وَالقَبْرُ مَسْكنُ<br />بِهِ ظُلُمَاتُ غَيْهَبٌ ثُمَّ غَيْهَبُ<br />وهولٌ وَدِيْدانٌ وَرَوْعٌ وَوَحْشَةٌ<br />وَكُلُ جَدِيدٍ سَوْفَ يَبْلى وَيَذْهَبُ<br />فَيَا نَفْسُ خَافِي اللهَ وَارْجِي ثَوابَهُ<br />فَهَادِمُ لِذَاتِ الفَتَى سَوْفَ يَقْرُبُ<br />وَقُولِي إِلَهي أَوْلِنِي مِنْكَ رَحْمَةً<br />وَعَفْوا فإنَّ اللهَ لِلذَّنبِ يُذْهَِبُ<br />وَلا تُحرِقَنْ جِسْمِِي بِنَارِكَ سَيَدي<br />فَجِسْمِيْ ضَعِيفٌ وَالرَّجَا مِنْكَ أَقْرَبُ<br />فَمَا لِي إِلا أَنْتَ يَا خَالِقَ الوَرَى<br />عَلَيْكَ اتِّكَالِي أَنْتَ لِلْخَلْقِِ مَهْرَبُ<br />وَصَلِّي إلَهِي كُلَّمَا ذَرَّ شَارِقٌ<br />عَلَى أَحْمَدَ المُخْتَارِ مَا لاَحَ كَوْكَبُ<br />فَمَا لِي إِلا أَنْتَ يَا خَالِقَ الوَرَى<br />عَلَيْكَ اتِّكَالِي أَنْتَ لِلْخَلْقِِ مَهْرَبُ<br />وَصَلِّي إلَهِي كُلَّمَا ذَرَّ شَارِقٌ<br />عَلَى أَحْمَدَ المُخْتَارِ مَا لاَحَ كَوْكَبُ"
archived = "2010-03-14"
capture_url = ""

