text = "انا لله وان اليه راجعون<br />هل ضل الناس الى هذا الحد!<br />هل هناك اى دليل شرعى على مشروعيه هذا العقاب الذى وجه الى هذا الطبيب!<br />هل هناك عالم من علماء المسلمين يستطيع ان يفتى بمشروعيه هذا الامر؟<br />ان كان هناك من يستطيع ان يفتى بهذه المشروعيه فلينبرى ليفتى بهذا الذى سوف يسأئل عنه أهل هذا الزمان؟<br />اللهم بلغت اللهم فاشهد.<br />نداء الى علماء الامه<br />عادل عبد الوهاب"
