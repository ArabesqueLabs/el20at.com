subject = "الرواية السعودية ملفقة يقينا!!!!!"
author = "اكتب اسمك هنا"
posted = "2008-11-10"
text = "السؤال الأول: هل يمكن لطبيب أن يقوم بالكشف علي مريضة دون وجود محرم؟ الأجابة بالطبع لا..لسبب بسيط أنها لاتستطيع الخروج من<br />بيتها أصلا بدون محرم..ولاتستطيع أن تقود السيارة..والا واجهت مصيرها المحتوم....السؤال الثاني: اذا افترضنا أنها أستطاعت<br />أختراق كل هذه الحواجز..فان المنطقي أن الطبيب لن يقوم بالكشف عليها ألا في وجود ممرض أو ممرضتين..حتي لايتهم بالخلوه غير<br />الشرعية....السؤال الثالث: الطبيب استشارى..أى أنه لا يمارس عمله ألا في الصباح أو في الفترة المسائية..أعني أن المستشفي<br />تكون ممتلئة بالاطباء و الممرضين و المرضي..كيف يستطيع أن يختلي بالمريضة دون محرم و يعطيها المخدر ثم يقوم باغتصابها و ينتظر حتي<br />تفيق من تأثير الدواء..و تسير المسكينة مترنحة أمام الحضور دون أن يتساءل أحد عما كان يدور وراء الأبواب المغلقة..أو تتساءل هي<br />عما كان<br />يفعل بها و خصوصا أنها ستعرف أن الطبيب لم يقم بأي اجراء طبي لها طيلة وجودها بالعيادة..و ستعرف يقينا الوقت الذي قضته بالعيادة<br />عن طريق ساعة يدها أو ساعة الحائط أو بسؤال أحد الحضور عن الوقت..فضلا أنها سوف تجد بعض مخلفات الطبيب المنوية علي ملابسها<br />أو علي أو بداخل جسدها....السؤال الرابع: يبدو أن طبيبنا المسكين كان يرتدي طاقية الاخفا..وطبعا هذا مستحيل..اذا لابد أن له<br />شركاء نالوا نصيبهم من التورتة حتما اذا صحت الرواية المزعومة.. فلماذا لم ينالهم نفس العقاب....السؤال الخامس: لماذا لم يرتاب<br />أحدا في الأمر وخصوصا أن أمرا هاما من أمور الشريعة قد استبيح ..فقد تم اقصاء المحرم بعيدا ليلتهموا الفريسة في وقت مزدحم<br />بالحضور.. وأكيد سيرتاب أحد الأذكياء في الأمر.. فلماذا لم يتم اقتحام خلوتهم لكشف أمر الطبيب.. أو يتم عمل كمين ليضبط<br />الطبيب متلبسا و هذا لم يحدث في الرواية المزعومة..بدلا من رمي الناس بالباطل....السؤال السادس: لماذا لم يرتاب أحدا من<br />الضحايا..لابد أن ذلك كان بموافقتهن..حينئذ لم يكن هناك داع لاستخدام المخدر..فلماذا لم يوقع بهن حد الزناه.. واذا لم يكن<br />بموافقتهن وارتابت احداهن حتما..فلماذا لم يتم عمل كمين للطبيب ليضبط متلبسا و هذا لم يحدث مرة أخري حسب الرواية المزعومة..السؤال<br />الأخير: هل العقوبة التي نالها الطبيب انتقامية.. الاجابة بالطبع يقينا.. وذلك للأسباب الآتية:1. يبدو أن القاضي تعامل مع الطبيب<br />المسكين بعقلية سليمان بن عبد الملك حين أخذ يزيد المال المطلوب استرداده من موسي بن نصير مئة ألف في كل مرة يعترض فيها علي كذب<br />الوشاية..فلم و لن نسمع أن الذي يتجرأ علي الاستئناف يزيد له القاضي العقوبة بدلا من اقرارها أو تخفيضها. 2. هل الطبيب زانيا؟<br />فلماذا لم يرجم؟ 3. هل الطبيب من المفسدين في الأرض؟ فلماذا لم يطبق حد المفسدين في الأرض؟ 4. هل 1500 جلدة + 15 سنة<br />سجن.. سبققكم بها أحد من العالمين.. لم و لن نسمع أن هناك جلد في الاسلام الحقيقي أكثر من مائة<br />جلدة.......!!!!!!! و لكنها بلاد الظلم و الجور.. بلاد اللئام الذين يجورون علي الغريب و لايعطونه حقه....موعدنا يوم<br />التناد.. يوم يقوم العباد للحكم العدل..سيقف الجميع أمامه أذلاء..ليحكم بينهم في ما كانوا فيه يختصمون"
archived = "2010-03-14"
