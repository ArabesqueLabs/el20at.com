text = "السلاااااااااااااااام عليكم ورحمة الله وبركاته<br />لاصدق ماتراه عيني من القذف والسب وكأن الذي يكتب لن يحااااااسب على ماااااايقوووووووول!!!!!!!<br />كأننانسينا الهدف الذي خلقنا من اجله؟ونسينا تعليم المصطفى صلى اللله عليه وسلم؟؟؟هل نسيناحرمة الميت؟؟؟هل تناسيتوا جزاءمن اغتاااااب اخيه المسلم؟؟نكران وجحوووود المعروووووووف؟؟؟هتك اعراض المسلمين؟ستر اخيك المسلم؟<br />ياااااااويلكم كم من الذنووووووووب كتبت عليكم عند خااااااااالقكم لاجل هذه الدنيا الزائفه<br />اخوااااااني بعد كل هذا مالذي استفدوه هل برايكم تستطيعوووووون اصلاااااح شي!!!!! لا واللله لن تستطيعوووون<br />اخوااااااني المصرين من يقراء ردودكم يقووووول ان الشعب حكم عليه بالتأبيد؟؟؟اوتجنوا عليكم دون ذنب<br />اين عقوووووولكم؟مالذي يحدث؟"
