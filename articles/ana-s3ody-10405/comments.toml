[[comments]]
order = 53
subject = "أهالي الطبيبين «المجلودين يشكون المملكة بالأمم الم"
author = "اكتب اسمك هنا"
posted = "2008-11-18"
text = "أهالي الطبيبين «المجلودين يشكون المملكة بالأمم المتحدة.. ويتهمونها بارتكاب جرائم تعذيب<br />كتب عمرو بيومي<br />أعلن الاتحاد المصري لحقوق الإنسان أنه تقدم بشكوي إلي المجلس الدولي لحقوق الإنسان بالأمم المتحدة ضد المملكة العربية السعودية،<br />لإصرار سلطاتها علي جلد طبيبين مصريين بعقوبة غير مدرجة شرعًا أو قانونًا، مؤكدًا أن ذوي الطبيبين فوضوا المجلس بتصعيد الأمر عالميًا.<br />كان القضاء السعودي قد حكم علي الطبيبين بالسجن لمدة &--1633;&--1637; و&--1634;&--1632; عامًا، مع جلد كل منهما &--1633;&--1637;&--1632;&--1632; جلدة، بواقع &--1639;&--1632; جلدة كل عشرة أيام.<br />وأوضح المستشار نجيب جبرائيل، رئيس المنظمة، أن عقوبة الجلد ألف وخمسمائة جلدة تعتبر من جرائم التعذيب التي لا تسقط بالتقادم.<br />وقال جبرائيل، في بيان أصدره أمس: «قرر الاتحاد المصري لحقوق الإنسان في اجتماع طارئ تقديم شكوي إلي المجلس الدولي لحقوق<br />الإنسان»، متهمًا السعودية بالتستر علي جريمة تعذيب الطبيبين المصريين رؤوف محمد العربي، وشوقي عبدربه، باعتبار أن أقصي عقوبة<br />لجرائم الحدود في الشريعة الإسلامية من &--1640;&--1632; إلي &--1633;&--1632;&--1632; جلدة.<br />وأضاف: «لذلك تعتبر العقوبة ضد الطبيبين بجلدهما ألف وخمسمائة جلدة جريمة من جرائم التعذيب التي لا تسقط بالتقادم».<br />وشدد «جبرائيل» علي أن السلطات السعودية في سكوتها عن معاقبة المسؤولين عن جلد الطبيبين تعتبر مشتركة في هذه الجريمة،<br />وقال: «باعتبار السعودية دولة عضوًا في الأمم المتحدة فعليها الالتزام بالقانون الدولي الإنساني، ومنع انتهاكها حقوق الإنسان».<br />المصرى اليوم"
archived = "2010-03-14"
capture_url = ""

