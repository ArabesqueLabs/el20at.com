subject = "حسبي الله ونعم الوكيل"
author = "ايه"
posted = "2007-10-27"
text = "حسبي الله ونعم الوكيل في كل الناس سببوا الاساءه لناس لا يعرفوهم والله اعلم بالناس واتقو الله حرام عليكم اما عمرو خالد راح نادي الصيد مكان البشوات زي مبتقولو مش عشان منظره ولا يلعب لكن يوصل لكل المستويات علشان عايز مصر والعالم كله باشا او شحات يكونو متقربين لله ويعرفو ربنا ويهدو الناس الزيكو بلاش تحكومو بالطريقه ديدول ناس مفيش زيهم واالله ربنا يهديكو وافتكرو يو ميكونو هما في الجنه وانت بتشوفوهم من النار وتعرفو ان انتو كنتو غلط يارب نكون كلنا معاهم يا رب"
