[[comments]]
order = 4
subject = "ومنهم الداعية عمرو خالد الذي كان متألقا جدا"
author = "البغدادي"
posted = "2007-06-19"
text = "أظن يا جماعة إن الراجل بيورينا درس عملي في التعايش ، بس هي المرادي جت في التعايش مع الأكابر في نادي الصيد ، معلش المرة الجاية هيحاول يعملها في دينة نصر أو مصر الجديدة ، وما تنسوش برضه البرستيييييييييييج بتاع الراجل ، ده راجل بتاع الباشاوات مش بتاعنا ربنا يعييينه عليهم ويصلحهم على إديه ، أصل هو مهتم بالفئة المهمة ديه ( كأن مافيش في البلد غيرهم ) وهو برضه عايز الناس إللي بياكلوا أموال الشعب يرجعوها(لوه) ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "مقال رائع و مجهود مبارك"
author = "shima"
posted = "2007-06-20"
text = "لم اكن اتخيل ان تكون التعليقات بهذا المستوى<br />لا يهمنى مستوى عمرو خالد المادى<br />يهمنى ما يقوله<br />و ليس عيبا ف حقه ان يكون ممن من الله عليهم بسعة ف العيش<br />اما الكلام عن حنان ترك و مصطفى حسنى<br />اعتقد ان صاحبه ادرى منى بمدى وضاعة هذا الكلام و سخافته<br />ثم لماذا لم تنل كل هذه التعليقات الا عمرو خالد و مصطفى حسنى و حنان ترك<br />هناك اسماء كثيرة ذكرت ف المقال لماذا هذه الاسماء بالذات ؟؟<br />طبعا الاجابه معروفه<br />و اعتقد ان من كتب هذه التعليقات شخص واحد<br />اقول له<br />اتقى الله اتقى الله اتقى الله ان كنت من عباد الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "المقوقس والنبي محمد صلى الله عليه وسلم"
author = "مش لازم"
posted = "2007-06-20"
text = "الرسول اللي راح للمقوقس عظيم القبط في مصر يدعيه للاسلام سأل عن النبي محمد صلى اله عليه وسلم ومن ضمن الاسئلة من يجالس<br />فلما عرف المقوقس انه يجالس الفقراء تأكد من نبوته صلوات الله وسلامه عليه<br />اما نادي الصيد دا نادي شبهه لان الواطي عادل امام عضو في نادي الصيد وهذا يكفي ان الوناحد يحرم على نفسه دخول هؤا النادي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "لا والنبي احنا عايزين الناس تبطل شرب الحشيش والبان"
author = "مش مهم"
posted = "2007-06-20"
text = "الموضوع دا يا اخواني وراه فلوس وجمع تبرعات وحنلم فلوس كويسه ونبقى ناس اغنيا والمليون تجري ورا امليون<br />وبعدين السجاير دي امرها سهل<br />الله هو الجماعة بتوع نادي الصيد الهاي هاي هاي هاي ما يعرفوش ان الشعب المصري مدمن حشيش وبانجو<br />ولا هما يظهر ما يعرفوش حاجة عن شعب مصر المسكين المطحون المقهور الاهبل اللي عمال يدفع وبس"
archived = "2010-03-14"
