author = "مش مهم"
posted = "2007-06-19"
text = "دا حتى كمان الداعية مصطفى حسني مع الفنانه حنان ترك<br />يا جميل يا رايق<br />ايه الدعوه الحلوه دي دي دعوه على المزاج خالص<br />يا مصطفى هاشم انت مقالك فضيحة يا ابني ايه اللي انت هببته دا"
