subject = "لك الله يا خيرت الشاطر انت وزملائك"
posted = "2007-06-20"
text = "لك الله يا خيرت الشاطر انت وزملائك المسجونين<br />تركت كل شيء من اجل الدين والله<br />كان ممكن تبقى عضو في نادي الصيد والنادي الاهلي وعضو مجلس الشعب وصديق لجمال مبارك<br />لكن تركت كل هذا من اجل الله ورسوله لك الله وثبتك وربط على قلبك وموعدك الجنة ان شاء الله"
