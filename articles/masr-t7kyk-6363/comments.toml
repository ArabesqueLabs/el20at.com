[[comments]]
order = 0
subject = "الداعية عمرو خالد الذي كان متألقا جدا ولعب مباراة"
author = "مش ضروري"
posted = "2007-06-19"
text = "طبعا يا عم عمر خالد انت عضو في نادي الصيد<br />انت نجم من نجوم مصر<br />انت حاجه تانية يا عمر خالد<br />انت من اكبر 100 شخصية مؤثرة<br />واحنا هنا بناكل بالجذمه على وشنا<br />وبنضرب بالبلغ<br />وانت هايص مع الناس الاكابر في نادي الصيد وبتلعب كوره كمان في نادي البشوات والبهوات<br />خلاص ما هي المليون بتجري ورا المليون والشعب الاهبل بيطبل وبيزمر على اي حاجه<br />روح يا عم الله يسهلك<br />يا مصطفى هاشم<br />روح لعمر خالد وقله ان من صدق النبوة مجالسة الفقراء<br />مش مجالسة البشوات في نادي الصيد<br />البشوات اللي واكلين مال الشعب<br />وقوله يجيلنا عزبة النخل قوله عزبة النخل فيها مسلمين برضه محتاجين حنانك وعظفك"
archived = "2010-03-14"
capture_url = ""

