subject = "الباص ورد مع ....................................."
author = "توتى"
posted = "2007-03-26"
text = "الباص ورد مع خطيبى بتاع الهوت ميل والياهو والميل بتاع الشغل كمان وكل مرة يقولى الا انا عايز اسالك سؤال هو الباص ورد بتاع الهوت ميل يعنى اية اقولو وبتاع الياهو اقولة الشغل وبرضة اقولة والمهم ان كل الارقام حجات خاصة بينا بس<br />وهو مدينى الباص بتاع تليفونة لانة دايما بينساة وننضطر نفرمت التليفون علشان كدة بيدوهونى بس<br />مش عارفة لما اموت هو هايفتح الميل ولا لاء مش عارفة يعنى هايبقى لية نفس يقعد على الكمبيوتر ........."
