subject = "فلترحل معى اسرارى"
author = "نيفين نيفى نوفا"
posted = "2007-03-26"
text = "عجبتنى حكايه فلترحل معى اسرارى<br />بس للاسف مش هترحل اوى لانى عندى دفاتر يوميات من سنين بكتبها و اللى يقراها كانه عايش معايا بلضبط<br />فلو مت فجاه اكيد الورثه هيطلعو عليها و دا عادى<br />لكن لو عرفت هموت امتى اكيد مش هديها لحد لان حتى صاحبتى الانتيم مش هتبقى محتاجاها ف حاجه لانها تعلرف كل تفصيلات حياتى<br />بس الاحلى برده فلترحل معى اسرارى"
