subject = "صحابتي معاها الباسوورد"
author = "نوجا"
posted = "2007-03-27"
text = "انا كتير فكرت بهاي الفكرة لما أموت مين هيفتح اميلي ويقول لكل أصدقائي على النت اني مت، فقلت لازم يكون في حد معاه الباسوورد بتاعي علشان يبلغ الكل بموتي، وكمان لما بكون عندي مشكلة بالنت بخليها تفتح اميلي وتشوف شو فيه وتقولي، ويعني ، انا بغيره من وقت لتاني بس بديهولها كل مرة"
