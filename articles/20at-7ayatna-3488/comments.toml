subject = "محتار"
author = "ياء"
posted = "2007-03-25"
text = "انت كده جيت على الجرح يا محمود<br />انا بقى رايح الجيش كمان اسبوع وطبعا مش ضامن الاجازات وبقالى شهر بدور على حد اديله الـpass word بتاع 3 اميلات وفليكر والمدونه ومش لاقى<br />فى ناس ثقه كتير والحمد لله<br />فى ناس مش عايزهه تشوف مدوناتى اللى انا منشرتهاش فالبتالى مقدرش اديهم الاميل<br />فى ناس لو ادتها الاميل حتدخل عليه مره كل 40 يوم عشان هوتميل ما يحذفهوش لكنى واثق انهم حينسو ويكبروا دماغهمبعد كدخه<br />وصاحبى الانتيم لو اديته الـpass word مش حقولك اللى حيعمله حيدخل ويتصرف كان البيت بيته بالظبط دا ممكن كمان يكتب مدونات وينشرها بالنيابه عنى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/<br />حد ياخد الـpass word بس يحافظ عليه"
