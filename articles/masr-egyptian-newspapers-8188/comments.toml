[[comments]]
order = 1
subject = "إلى الأخ المصري العجوز"
author = "أبو عماد"
posted = "2008-02-07"
text = "الأخ الكريم مصري عجوز ساءني ما كتبت عن تكذيب الأخ ناجح وأحسبه ليس بكاذب ولا متعصب فإني من مواليد سنة الثورة وتربيت كذلك في حضنها وكانت مشاعري تتزلزل كلما سمعت كلام الرئيس عبد الناصر وكنا نهتف من كل قلوبنا ناصر كلنا بنحبك ناصر وحنفضل جنبك وكنا نهتف بكل ما كان يذاع من أناشيد مثل الله اكبر فوق كيد المعتدي وغيرها ومع ما في هذه الحقبة من إيجابيات كالتي ذكرتها إلا أنها ما كانت كلها وردية بل هي كما قال الأستاذ ناجح وكما وصف فعلاً فما كان يصلي الجمعة إلا بعض الشباب وكثير من الشيوخ وما كنا نسمع عن الحجاب حتى في الجامع في السبعينات لما اتحجبت بعض الأخوات كنا نمشي خلفهم بالطبلة ونقول: بتوع البدرة أي تمرجيات الصحة في ذلك الوقت الذين كانوا يمرون على المدارس ويرشون الأولاد ببدرة مبيد الحشرات في قفاهم لمقاومة البراغيث والقمل وخلافه لذا يجب أن نعترف أن كثيراً من المفاهيم وقتئذ تغيرت تماماً كما أراد أن يبين الأستاذ وكما كانت تلك الحقبة بها سلبيات فهذه الحقبة بها بلايا وسيئات وسامحني يا أخي على ذلك الكلام وبارك الله فيك وفي كل من يقرأ هذا الكلام أخوكم أبو عماد"
archived = "2010-03-14"
capture_url = ""

