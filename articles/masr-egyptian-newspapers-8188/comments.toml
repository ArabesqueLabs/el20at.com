subject = "الإسلام كامل"
author = "حاسس جدا  بمصر"
posted = "2008-02-08"
text = "معلش يا أخ ( اكتب اسمك هنا ) أنا عايز أوضح ان الفكرة اللي قلتها دي خاطئة بالمرة ....... يعني الرياضة والسياسة لو ملهاش علاقة بالدين ........ إذاً انت تتهم الإسلام بالنقص......... وحاشا لله طبعا فالاسلام كامل لا ينقصه شيء فالرياضة تكون تبعا للدين والسياسة تكون تبعا للدين مش زي اللي احنا شايفينو اليومين دول .<br />أما عن موضوع الناس زمان ده فأنا عن نفسي اتولدت في عصر حسني وشكلي هاموت في عصر حسني برضه ."
