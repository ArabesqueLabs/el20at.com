[[comments]]
order = 0
subject = "كلامك كدب"
author = "مصرى عجوز"
posted = "2008-02-07"
text = "هو احنا يعنى اتربينا على الالحاد ولا ايه !!!!!!!!؟ هو يعنى الحجاب والدقن والثوب القصير علامه الايمان ! والله كلامك عن فتره الستينيات كله كدب وخداع لانه ظهر الشيخ الشعراوى ايام المحافظ وجيه اباظه .......بس مكنش فيه تعصب ومكنش البنت فيها روج احمر شفايف ومكياج وباروكه زى الايام دى ! ولعلمك مكنش المسيحى يقدر يفتح عينه على اى مسلم ابدا ايام عبد الناصر ويتكلم بطريقه زكريا بطرس الشاذ وكان المجتمع متماسك وقوى ومكنش فيه ميوعه زى الايام دى....للعلم كان فيه وزير اسمه عبد العزيز كامل كان وزير اوقاف وكان اخوانى !! عينه عبد الناصر.......وانت نسيت الشيخ حسن من مشجعى الاهلى خلال تلك الفتره ووراء تدين حبيبى الشيخ طه اسماعيل...وعبد الناصر كان مستقيما مسلما عروبيا حتى النخاع وايه رايك الان فى قصيده تزغيط البط والكتب المسيئه للاسلام وزوجات الرسول ولا تنسى ان عبد الناصر اغلق محفل البهائيه والان ظهروا"
archived = "2010-03-14"
