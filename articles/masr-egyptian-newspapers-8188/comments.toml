text = "انا كل اللى عاوز اقوله ان الدين ثابت لا يتغير ان كان زمان ولا دالوقتى لكن الانسان هو اللى قابل للتغيير<br />وان كل واحد فى مكانه ممكن يغير من اللى حوليه حتى لو كان فى لعب الكورة لان الدين لايترك القلب<br />اثناء العمل فكل انسان فى مكانه يمكن ان يكون داعية الى الله وهذا هو الدين ."
