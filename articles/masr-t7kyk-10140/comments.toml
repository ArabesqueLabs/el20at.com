posted = "2008-09-24"
text = "الله يرحمك ياثوة يلي الهيتيالناس عنسومة<br />الحاية مش حكاية السد الحكاية حكاية اللي ورا السد يحكى أن كان فيه واحد اسس للإستعباد زرع الخوف والتحسس زحول مهمة الشرطي من حماي إلى عسس ياخي زور أي قرية تلقى ليه بوابة وغفير واحنا لسة بناكل رز ولبن لما هنموت لأن فلسفة رجل الشرطة احمي الي اسمه ايه وتتحرق البلد عليه بس يظلوا جالس محلو ويدي تمام للبيه ياخي اخص ومليون اخص على دي شرطة محميش حدوده والضيوف يطيروا يابيه لأن الباشا عل الكماشة بيحرق ابنه لأن أيه ؟؟؟؟<br />ومطولش عليك لكن الله ينتقم من الظلمة ولاد اي÷ اللي بعوها وضيعوها وفنوها بعد الايه ؟؟؟؟؟؟<br />وعجبي عليك يامصر لا الناس عايشه ولا انت ف نصر<br />ربنا ينصرك على نفس أولا ويكفيكي شر الجايين والداخليين"
