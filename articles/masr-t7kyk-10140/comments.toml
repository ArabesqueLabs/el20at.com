subject = "ما بين شرطة مصر من خبرة وعلم وبين شرطة دبى قرنين م"
author = "سوسو العمشة"
posted = "2008-09-24"
text = "الشرطة المصرية بتشتغل بخبرة المماليك وايام الحملة الفرنسية وزى ما الفرنسيون ايام الحملة بتاع نابليون على مصر ما عذبوا سليمان الحلبى علشان يعترف انة قتل كليبر بانهم كانوا بيقعدوة على الخاذوق ويحرقوا ايدة اليمين وبعدين ايدة الشمال - الكلام دة وقريب منة لا زال شغال فى الشرطة المصرية<br />انما شرطة دبى حضارة وانسانية وعلم وما يقلش الكلام دة الا واحد اتعامل معاهم<br />الفرق بين شرطة مصر وشرطة دبى قرنين من الزمان<br />يكفى ان فى دبى ما فيش ولا عسكرى مرور واقف عند اشارة ما تشوفش عسكرى مرور واقف الا لما تحصل حادثة<br />انما الهمج البلطجية بتوع مصر فمحتاجين تاهيل عقلى ونفسى فى مستشفى امراض نفسية"
archived = "2010-03-14"
capture_url = ""

