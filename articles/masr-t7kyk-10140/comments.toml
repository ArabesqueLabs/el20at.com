subject = "يا وزارة الداخلية المصرية روحوا اتعلموا البحث الجن"
author = "محسن منير السكري"
posted = "2008-09-24"
text = "ما حدش عرف يقبض على الخاطفين ولا عرفتوا مكان المخطوفين<br />احسن حاجه وزارة الداخلية المصرية تروح تبيع ترمس لان رجال الداخلية يعرفوش غير حاجتين<br />تفريق المظاهرات بواسطة الامن المركزي وملاحقة الجماعات الاسلامية وتلفيق قضايا لهم بواسطة امن الدولة<br />روحوا هاتوا فرقة من شرطة دبي وهي تعرفلكم مين اللي خطف ومكان المخطوفين في 12 ساعة فقط<br />انا سافرت دبي وقتلت سوزان تميم ورجعت تاني وافتكرت نفسي واحد شاطر<br />ولكن في خلال خمس ساعات فقط اتقبض علي في بلدي وبين اهلي وناسي<br />هي دي الشرطة ولا بلاش<br />يا شرطة مصر روحوا اتعلموا العمل الشرطي والبحث الجنائي من شرطة دبي<br />سلام"
archived = "2010-03-14"
capture_url = ""

