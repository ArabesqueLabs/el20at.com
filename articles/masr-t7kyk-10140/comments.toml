subject = "من شروط اختيار ضباط وافراد الشرطة ان يكون متخلف عق"
author = "الشبراويشى"
posted = "2008-09-24"
text = "شرطة اية<br />دول شطار قوى انهم يروحوا الفجر يهجموا على الشقق والبيوت ويعتقلوا الناس وهم نايمين<br />وكل هم وقلق مباحث امن الدولة انهم يراقبوا خطبة الجمعة<br />لما يبقى امن الدولة كلة بيراقب خطبة الجمعة ويسجل همسة وكل كلمة بيقولها الخطيب وكان كلام الخطبة فى قرية معزولة هيقلب نظام الحكم - لا مؤاخذة تبقى دولة حسب اللة<br />لما الشرطة والامن تحط على بوابة كل جامعة او كلية كتيبة امن مركزى يبقى التعليم اتحول الى معسكر وتبقى دولة زعبلة<br />لما الشرطة تحتضن وتجند البلطجية ليشتغلوا معها تبقى حكومة حرامية<br />لما البنات تغتصب فى الشوارع والسطو المسلح تبقى دولة بنت ك<br />شرطة يا شرطة"
archived = "2010-03-14"
capture_url = ""

