[[comments]]
order = 0
subject = "المحلة البطلة فالوجة مصر"
author = "من هناك"
text = "100 الف عسكرى امن مركزى يحاصرون ويقتحمون المحلة فى سابقة لم تعرف فى تاريخ مصر منذ حادثة دنشواى ايام الاحتلال<br />ويضربون بالرصاص الحى وقنابل الدخان والمدرعات ضرب عشوائى<br />مشاهد تعيد الى ذاكرة المصرى ما يفعلة الاحتلال اليهودى فى الضفة الغربية وغزة<br />ثم لا يدوسون صورتة ويمزقونها<br />هناك صور لم تنشر لاطفال يبولون عليها<br />انها ليست صورة احد الانبياء المعصومين<br />وهو ليس مقدس ولا خليفة اللة فى الارض<br />انة موظف عام فشل فى اداء وظيفتة واوصل البلد الى حافة الهلاك<br />تحية لشباب المحلة الذين دخلوا التاريخ"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705181955/http://masr.20at.com:80/newArticle.php?sid=16563"

