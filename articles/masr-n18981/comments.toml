author = "سامح زينهم عبده"
posted = "2009-12-09"
text = "أنا سامح زينهم عبده نجل الفنان زينهم عبده بقرية الفسطاط والحقيقة ان ما تشهده القرية حاليا من تطور واذدهار هو طفرة نتمنى وأن نستفيد منها وأن نحافظ على قيمتنا الفنية ولذلك اتقدم يكثير من الشكر والتقدير الى الفنان معتز نصر الذى بذل الكثير من الجهد وكان له الكثير من الفضل فيما وصلت اليه القرية الأن وأبارك له أيضا على النجاح الذى حققته معارضه وعلى المساعدات والدعم الذى يقدمه لصغار المبدعين وأتمنى من الله ان يوفقه دائما ليواصل نجاحه كما أتمنى للقرية مزبد من التقدم والتطور .... سامح زينهم عبده"
archived = "2010-03-14"
