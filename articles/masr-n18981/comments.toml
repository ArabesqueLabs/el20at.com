subject = "7 - 18 ثورة الخبز"
author = "-----------------------"
posted = "2008-12-26"
text = "فن اية<br />احنا عايزين فن تكنولوجى يعمل لنا ماكينة تعمل خبز وتعمل عيش للناس<br />رسم صور على الحائط فى منطقة شعبية تعانى من نقص الخبز والجوع والفقر<br />اتقوا اللة يا ناس<br />اعملوا معرض للالات والمعدات وانشروا الفكر التكنولوجى<br />احنا بقينا فى ذيل الامم المتخلفة"
