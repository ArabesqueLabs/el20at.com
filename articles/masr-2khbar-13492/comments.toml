text = "ان شاء الله ناجح<br />لانه عربي وحيخدم القضايا العربية<br />واتذكر بطرس غالي لما راح الامم المتحدة وقالوا عليه انه مسيحي وامه يهودية ومش عارف ايه<br />ولما مسكاهتم بالقضايا العربية واسرائيل وامريكا غضبوا عليه ومشوه من هناك<br />فاروق حسني عربي وحيخدم القضايا العربية<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش رضوى حسن ولا مروى صلاح<br />وسلمولنا على طحطح"
