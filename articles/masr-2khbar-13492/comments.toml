text = "فى مصر عشرات الكفاءات الثقافية المضيئة<br />فى مصر علماء ثقافة افذاذ ملتزمون بقضايا امتهم<br />فى مصر لا نقول مسيحى ولا مسلم ولكن بنقول مصرى<br />ابويا بيقول انة ايام حرب 73 كان معاة زميل فى الشغل وكانوا بيشتغلوا فى مصلحة واحدة فجاء الاستدعاء لوالدى بتسليم نفسة لوحدتة على الجبهة وكان ضابط احتياط ولم يصل استدعاء للنقيب ميخائيل زميلة فى الشغل وفى الوحدة العسكرية فسلم ميخائيل نفسة لوحدتة العسكرية قبل وصول الاستدعاء لة<br />كلنا مصريين<br />وبطرس غالى كان مسيحى صحيح بس مصرى يحمل قضايا امتة<br />انما اخر واحد يصلح فاروق حسنى"
