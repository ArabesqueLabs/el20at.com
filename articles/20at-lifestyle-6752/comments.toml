author = "الاسكندرانى"
posted = "2008-04-17"
text = "لقد اتيحت لى الفرصة لزيارة عدد من مدارس الراهبات و المدارس الخاصة العادية ومدارس الحكومة وراى هو انة بالفعل<br />فى مدارس الراهبات الحل للفشل التعليمى اللى حاصل فى مصر وعلى سبيل المثال مرة كنت فى زيارة لمدرسة نوتردام<br />ووجدت ولى امر تلميذة بيقول للراهبة (انتى فعلا بتربينا واحنا فى بيتنا) ووجدت انة توجد حصة للاخلاق يدرسون يها القيم<br />بطرقة عملية يعنى مثلا عن قيمة الامانة تلقى الراهبة قطعة نقود مثلا فى الفصل وعند دخول الاطفال من تجد النقود وتسرع بتقديمها للراهبة تكون موضوع الحوار (هى دى الاماتة يابنات)ويبدأحوا رناجح وتربوىوياريت نعمل زيهم"
archived = "2010-03-23"
capture_url = "https://web.archive.org/web/20100323022402/http://www.20at.com:80/20at/lifestyle/6752.html"

