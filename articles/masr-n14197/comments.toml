subject = "و لية ماحبش مصر؟ ما احنا احسن مليون الف مرة من الع"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-30"
text = "اذا ما حبناش مصر؟!<br />يبقى ناقص لنا اية نحبة؟اسرائيل!!!<br />طبعا و الف مليون لالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالاولا<br />يبقى لازم نحب مصر بمرها و حلوها؟<br />مش دى بلادنا و لا اية!<br />كل سنة و شعب مصر بخير و عيع فطر سعيد على الجميع رغم اختلاف الاراء الا اننا جميعا مصريين!<br />مش كدة و لا اية؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "زخاري من الخرة (البراز )"
author = "قرفان منكم"
posted = "2008-10-04"
text = "داهية تقرفكوا انتوا واللي شغلكوا موضوعاتكوا كلها هايفة وتافهة وزي الخرة<br />هو حب الوطن فيه استفتاء دا الحب لمصر مولود مع المصري فطرة وموجود في قلب المؤمن عقيد ودين<br />انتوا ايه بالظبط هوعلشان فيه كبوس قاعد على قلبها شوية هنكرهها احنا نكره نفسينا لأننا مش قادرين نغير ونزيح الكبوس من على قلبها<br />احنا بحب مصر وهنحب مصر وخنموت في حب مصر وليم زحاري كمدا"
archived = "2010-03-14"
capture_url = ""

