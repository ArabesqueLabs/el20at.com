[[comments]]
order = 0
subject = "من أغنية بحبك يامصر (فايزة أحمد)"
author = "واحد بيحب مصر"
text = "يا بلادي يا بلادي.. بحبك يا بلادي.. يامصر بحبك.. بحبك يا مصر.. ولو خيروني أقول يحرموني من نور عيوني وأحبك يامصر.."
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195755/http://masr.20at.com:80/newArticle.php?sid=14197"

[[comments]]
order = 1
subject = "كلام بين الشباب فى مقهى فى رمسيس"
author = "قهوجى"
text = "بعد الشعبية الكبيرة التى حققها الكابتن حسن شحاتة وبعد فوزة ببطولة افريقيا<br />الشباب بيقولوا لية الكابتن حسن شحاتة ما يترشحش فى الانتخابات لرياسة الجمهورية<br />طيب ماهو حسن شحاتة كابتن كبير اى نعم مش كابتن طيار ولكنة كابتن جاب النصر والبطولة<br />صحيح<br />اية رأيكم الكابتن حسن شحاتة يحكم مصر<br />يمكن"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195755/http://masr.20at.com:80/newArticle.php?sid=14197"

[[comments]]
order = 2
subject = "وابوتريكة يبقى رئيس وزارة"
author = "مش مهم"
text = "حسن شحاتة يبقى رئيس الدولة<br />وابو تريكة رئيس الوزراء<br />برضة يمشى"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195755/http://masr.20at.com:80/newArticle.php?sid=14197"

[[comments]]
order = 3
subject = "بجد"
author = "هبل"
text = "بجد موضوع ولا اهيف بتحب مصر امتى لما اكون مع مراتى المصريه هيقولها السعودى والليبى والعرب اجمع وتحس بالجوع امتى لما ابقى عايش فى مصر الزيت ب 12 جنيه امتى جوه قلب مصر<br />مش بتحب مصر امتى مفيش حد مش بيحب مصر لان الى بيحب بيحب طول العمر مش بالوقت ولا الزمن ولا المكان"
archived = "2008-04-18"
capture_url = "https://web.archive.org/web/20080418135619/http://masr.20at.com:80/newArticle.php?sid=14197"

[[comments]]
order = 4
subject = "مصرى وافتخر"
author = "محمد عامر"
text = "ياجماعه فرقوا بين مصر الحكومه ومصر الشعب والدوله<br />ممكن ناس متحبش الحكومه بس ده مش معناه انها بتكره مصر كبلد<br />وفيه ناس بتقول هى مصر اديتنا ايه ادينا مش لاقيين شغل و و و بس ياجماعه دى اسمها حكومه مصر مش مصر<br />عن نفسى انا بحب مصر اكيد ومبحبش الحكومه<br />بس انا مصرى وافتخر"
archived = "2008-04-18"
capture_url = "https://web.archive.org/web/20080418135619/http://masr.20at.com:80/newArticle.php?sid=14197"
