subject = "بجد"
author = "هبل"
posted = "2008-02-16"
text = "بجد موضوع ولا اهيف بتحب مصر امتى لما اكون مع مراتى المصريه هيقولها السعودى والليبى والعرب اجمع وتحس بالجوع امتى لما ابقى عايش فى مصر الزيت ب 12 جنيه امتى جوه قلب مصر<br />مش بتحب مصر امتى مفيش حد مش بيحب مصر لان الى بيحب بيحب طول العمر مش بالوقت ولا الزمن ولا المكان"
archived = "2008-04-18"
capture_url = "https://web.archive.org/web/20080418135619/http://masr.20at.com:80/newArticle.php?sid=14197"

[[comments]]
order = 4
subject = "مصرى وافتخر"
author = "محمد عامر"
posted = "2008-02-16"
text = "ياجماعه فرقوا بين مصر الحكومه ومصر الشعب والدوله<br />ممكن ناس متحبش الحكومه بس ده مش معناه انها بتكره مصر كبلد<br />وفيه ناس بتقول هى مصر اديتنا ايه ادينا مش لاقيين شغل و و و بس ياجماعه دى اسمها حكومه مصر مش مصر<br />عن نفسى انا بحب مصر اكيد ومبحبش الحكومه<br />بس انا مصرى وافتخر"
archived = "2008-04-18"
capture_url = "https://web.archive.org/web/20080418135619/http://masr.20at.com:80/newArticle.php?sid=14197"

[[comments]]
