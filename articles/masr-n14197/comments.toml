[[comments]]
order = 8
subject = "بلدي"
author = "ولاء الشملول"
posted = "2008-10-11"
text = "انا دائماً وأبداً أحب بلدي مصر<br />مصر النيل والهرم، وسط البلد، العيون السمراء، حبات العرق على جبين البسطاء الشرفاء الباحثين عن لقمة عيش حلال، مصر اللى حررت العالم العربي من التتار ، مصر خير اجناد الارض، مصر الحضارة الضاربة فى اعماق التاريخ، مصر سلة غلال العالم فى عهد سيدنا يوسف.<br />وقبل كل شيء مصر بلدي، لا بلد لى سواها<br />لا وطن لى غيرها<br />ولدت على ارضها واعيش على ارضها ولا أريد أن أعيش إلا بها<br />وسط كل الضغوط والقهر<br />إلا إنى أحب بلدي<br />لأنها تخصني<br />وانا انتمى اليها<br />فكيف لا احبها<br />وكيف لا ابذل كل ما املك من اجلها<br />حبوا مصر يا شباب<br />تعيشوا سعداء<br />راضين<br />اضافة فى العالم<br />فكونوا كذلك"
archived = "2010-03-14"
capture_url = ""
