subject = "نحن على قلوبكم ؟حتى يقضى اللة امرا كان مفعولالالال"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-04"
text = "طظ و طظظ و مائة الف مليون مليار تريليون طظظظظظظظظظظظظظظظظظظظظظظظظظظظظظ<br />موتوا من الحقد!!! هاااااا هااااا هاااااااااااااااااااااااااااااااااااااا<br />و اشربوا من المجارى اللى مخلية قلوبكم و نفوسكم صدئة<br />و ثقوا اننا على قلوبكم حتى قيام الساعه؟<br />كل سنة و انت طيب بمناسبة (عيد الفطر المبارك)<br />(احبوا اعدائكم و احسنوا الى مبغطيكم و باركوا لا عنيكم)؟<br />و ارجو ان تفهم الدرس يا(غبى)<br />هااااااا هاااا هاااااااااااااااااااااااااا<br />و اللة ضحكتنى يابو شخة؟ يا معفن!!!"
