posted = "2008-02-15"
text = "بعد الشعبية الكبيرة التى حققها الكابتن حسن شحاتة وبعد فوزة ببطولة افريقيا<br />الشباب بيقولوا لية الكابتن حسن شحاتة ما يترشحش فى الانتخابات لرياسة الجمهورية<br />طيب ماهو حسن شحاتة كابتن كبير اى نعم مش كابتن طيار ولكنة كابتن جاب النصر والبطولة<br />صحيح<br />اية رأيكم الكابتن حسن شحاتة يحكم مصر<br />يمكن"
