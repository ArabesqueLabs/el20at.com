[[comments]]
order = 1
subject = "لماذا لا  تكون لديه الشجاعة ليتنحي"
author = "أبو الحمد"
posted = "2008-05-08"
text = "أتذكر عندما خرج علينا البكباشي جمال عبد الناصر في مسلسله الشهير أنه سيتنحي بعد النكبة وأتذكر الفريق حسني مبارك عندما ساءت الأحوال وجاع الناس في المحروسة ونهبت البلد ولعب بمصيرها ومقدرها ولاد الإيه وكم أن الفريق إنسان مش فاهم اي شيء لا في سياسة ولا في اقتصاد ولا حتى في خبز الرغيف، أقارن بين الموقفين فأجد أن الأول البكباشي عبد الناصر كان لديه شجاعة حتى لو في التمثيل أما الثاني فحتى هذه الشجاعة لا يملكها وسلم لي على بطل الضربة الجوية الأولي اللي كان مستخبي تحت كرسي الطيارة"
archived = "2010-03-14"
capture_url = ""
