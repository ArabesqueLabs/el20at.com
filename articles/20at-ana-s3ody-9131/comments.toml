subject = "مبروك لكل اهل لبنان..... وتحية الي قطر واميرها"
author = "محمد سالم --- مصري"
posted = "2008-05-21"
text = "ابارك للاخوة في لبنان علي هذا الاتفاق وادعو الله ان يحميهم من الفتن والمؤمرات وان يديم علي اهلها السلام والمحبة بين كل ابنائها وطوائفها<br />والف الف تحية الي قطر واميرها .... قطر الدولة الكبيرة بافعالها رغم انف الحاقدين.......قطر الحريصة علي وحدة العرب والمسلمين<br />واسال الله ان يحفظ قطر واميرها من كل سوء ..... وان يجنبها سهام الحاقدين .... وخصوصا تلك الدول التي ربما تكون كبيرة في مساحتها وعدد سكانها ... ولكنها صغيرة في افعالها وتصرفاتها وتوجهاتها"
