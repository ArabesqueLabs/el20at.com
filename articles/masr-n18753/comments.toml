[[comments]]
order = 8
subject = "من هم اهل السنة والجماعة ؟ هم المصريون  وعلماء الا"
author = "عجوز"
posted = "2008-12-07"
text = "نحن اهل السنة والجماعة - نحن المصريون - ومهمتنا فى التاريخ هى محاربة اهل البدع والمذاهب الهدامة والبطالة<br />ولعلكم لا تنسون انة حينما استنجد خليفة المسلمين فى استنبول بمحمد على باشا ارسل ابنة ابراهيم للقضاء على تطرف الوهابيون وقتلهم الحجاج اثناء المسير الى مكة المقدسة<br />فالمصريون هم اهل السنة واهل العلم واهل الفقة<br />ولا تنسى ان كل او معظم المدرسين المعارون للملكة لتدريس اللغة العربية كانوا مدرسين مصريين - فنحن الذين علمناكم العربية وعلمناكم الدين<br />وابدا لا يموت العجوز بحقدة<br />انما يموت العجوز واقفا شامخا كنخل الصعيد الضارب فى السماء والممتد جذورة فى اعماق الارض<br />وانما يموت من الحقد الاقزام وادعياء العلم والدين"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "اى امر سامى بسفر الحريم مع محرم - انت لا ترى الواق"
author = "مع العجوز"
posted = "2008-12-08"
text = "امرأة من البلد التى اشترطت المحرم ليرافقها - كانت فى لندن فى الصيف تطوف فى شوارعها وتمرح بحدائقها وتحمل فى يديها وعلى رقبتها اثقالا من الذهب والمجوهرات - والمحرم الذى معها كان فى بيوت الحان ينادم بنات الخمر المعتق وترك حريمتة تجرى فى شوارع لندن<br />وهى فى الاسانسير انفرد بها ولد انجليزى قلعها كل الدهب والمجوهرات واشياء اخرى وهرب<br />محرم اية وامر سامى اية<br />راجع السفارة بتاعتك فى لندن وهتعرف قد اية البلاوى المسجلة على الحريم والرجالة هناك<br />ان اللة حليم ستار"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "يعني نغير الدين عشان حضرتك شفت وحدة سعودية فيها ما"
author = "أبو الحسين السلفي"
posted = "2008-12-08"
text = "كيف حالك يا عجوز مع أني أن مي كلمني طفل صغير فلا أرى منهجية في كلامك مجرد تخب في تخبط يعني أنت لأنك رأيت وحدة سعودية و راقبتها و راقبت زوجها السكران فبالتالي لازم نغير الدين و كأن الدين سعودي أو مصري أو عراقي أخي العزيز كلمة أخيرة أقدمها لك فقد تجد صدى لديك تذكر ان الله مطلع على ما تكتب فلا تكتب شيئاً يغضب الله سبحانه و تعالى و هذا حكم من الله اقصد المحرم...أنلغيه من اجلك ......راجع نفسك فقد يتبين لك شيء اخر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = "حوار الطرشان - لا فائدة"
author = "عجوز"
posted = "2008-12-08"
text = "هدفنا الهداية ما استطعنا سبيلا<br />ان امكنا ان ندفع فتاة ان تزور الحرم بدلا من ان تزور مصيف فى الساحل الشمالى وان نغرس الايمان فى قلبها لتنجب ابنا صالحا امة صالحة<br />ان نفهم سيداتنا ان الطريق الى مكة اسهل من الطريق الى باريس وسويسرا<br />وان التسوق من جدة ومكة مع زيارة الحرم افضل من اوروبا<br />وان نسهل اقامة الشعائر امام الفتيات والنساء<br />هناك قيود واحاديث لها حرمتها ولكن دون المساس باصل الشريعة او اقامة الفريضة ويمكن التساهل فيها<br />ولكن<br />ماذا نجد ؟<br />لا تناقش<br />الموضوع محسوم - منتهى - حيطة سد - من ليس لها محرم تحرم من اداء الفريضة<br />لا فريضة امام من ليس لها محرم<br />هكذا افتى السعوديون - ومفيش تاشيرة للدخول<br />شكرا<br />انتهى معك - حول"
archived = "2010-03-14"
capture_url = ""
