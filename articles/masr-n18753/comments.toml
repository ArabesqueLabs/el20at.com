[[comments]]
order = 0
subject = "يجب الغاء المحرم لان ظروف الدنيا اتغيرت - وهذة وجه"
author = "جل عجوز حج الى بيت اللة"
posted = "2008-12-06"
text = "انا ذهبت الى الحج كبير السن يعنى فوق ال 58 سنة<br />وهناك اثناء تأدية المشاعر والقيام بالحج شعرت بالتعب<br />الحج هو العبادة الوحيدة التى تحتاج مجهود جسمانى ومحتاجة الى القوة - فالسعى بين الصفا والمروة والسبعة اشواط تحتاج الى مجهود وكذلك التنقلات من منى الى عرفات الى المزدلفة الى المسجد الحرام والطواف ورمى الجمرات كلها تحتاج الى قوة البدن<br />اما عادتنا المصريون فاننا نذهب الى الحج ليكون الختام الصالح والرجوع من الحج مغفور الذنب على ما اقترفة من ذنوب طوال عمرة ومقابلة الكريم بصفحة بيضاء عند الحساب<br />ولكن مطلوب ان تؤدى هذة الفريضة ايام الشباب<br />فحينما فرض وجوب المحرم كان السفر على ظهور الجمال والحمير والنوم فى الصحارى والجبال فى طريق الذهاب الى مكة والعودة مع مرعاة اطعام الجمل والحمار وتقديم العلف والماء لة حتى يعيش ويقوى على المسير وهذة مهام لا يقوى عليها غير الرجال فلهذا اشترط المحرم ليحميها ويرعاها فى الرحلة خلال الصحراوات وظلام الليل والشمس والامطار والسيول<br />اما الان فالرحلة بالطائرة والسفر ميسر والامور امان فى امان<br />ولهذا فان المحرم ليس له اى فائدة"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207034013/http://masr.20at.com:80/newArticle.php?sid=18753"

[[comments]]
order = 1
subject = "الى رجل عجوز حج بيت الله اللي فوق"
author = "مش شريف الدواخلي ولاالبراء اشر"
posted = "2008-12-06"
text = "يعني نغير الدين علشان ظروف الدنيا اتغيرت<br />دا انت ظريف اوي ولطيف اوي<br />الست لما يكون ماعندهاش محرم يبقى مفيش حج عليها يعني سقطت الفريضة<br />عايز ايه بقى نلغي المحرم ليه"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207034013/http://masr.20at.com:80/newArticle.php?sid=18753"

[[comments]]
order = 2
subject = "حاشا للة ان نغير فى الدين - ولكن يا سيدى المعترض ه"
author = "رجل عجوز"
posted = "2008-12-06"
text = "لا يا صديقى الفريضة لا تسقط ابدا اذا لم يتوفر المحرم - هناك الرفقة الصالحة - فاذا كانت البنت او المراة مع رفقة صالحة يؤتمن عليها فيها - كان تكون فى صحبة نساء صالحات او مجموعة من الحجاج من مكان سكنها وتؤتمن عليها معهم فلا بأس<br />اما ما نعيب علية هو اشتراط السعودية وجود محرم مع المرأة<br />يعنى تكلفة الحج للفرد الواحد الان فى حدود 40 الف جنية فمطلوب لمن ترغب فى الحج ان تصحب محرما ايضا ب 40 الف جنية - وهذة عراقيل تمنع تأدية فريضة<br />فمطلوب ان نيسر ولا نعسر<br />وانا لست برجل دين<br />ولكن كمسلم من حقى ان اقول رايى فلربما يكون صوابا فاثاب علية او خطا فليغفر لى اللة"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207034013/http://masr.20at.com:80/newArticle.php?sid=18753"

[[comments]]
order = 3
subject = "بل لا يجوز حتى لو ذهبت مع صحابة رسول الله صلى الله"
author = "اكتب اسمك هنا"
posted = "2008-12-06"
text = "بسم الله الرحمن الرحيم<br />الكل يتحجج بأن مع المرأة صحبة آمنة فبالتالي لا حاجة مع للمحرم و كأن المسألة ليست أمر تعبدي أوجبه الله عن طريق سنة نبيه صلى الله عليه وسلم<br />أما الرد على استشكال الصحبة الأمنة فما رأي الأخوة بأن تكون المرأة برفقة الصحابة رضوان الله عليهم لا اعتقد أنه يوجد أتقى و أنقى من هذه الصحبة فهل يوجز للمرأة الذهاب مع الصحابة للحج دون محرم ؟؟؟؟<br />الجواب :<br />عن ابن عباس أن رسول الله صلى الله عليه وسلم قال : { لا تحج امرأة إلا ومعها محرم ، فقال رجل : يا نبي الله إني اكتتبت في غزوة كذا ، وامرأتي حاجة ، قال : ارجع فحج معها } انتهى .<br />و الرجل خارج للجهاد و زوجته مع الصحابة و لكن أمره النبي صلى الله عليه و سلم بالحج معها كمحرم .... ويأتي العض يقول المحرم شكلي أو أنه أي اشتراط المحرم أمر غير منطقي<br />هل يجوز أن أن يقول المسلم لأمر النبي صلى الله عليه و سلم لم يعد منطقياً ؟؟؟!!"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207034013/http://masr.20at.com:80/newArticle.php?sid=18753"

[[comments]]
order = 4
subject = "إلى رجل عجوز"
author = "أبو الحسين السلفي"
posted = "2008-12-06"
text = "اقراء التعليق الذي قبلي و اقراء الحديث جيداً و الحجاج عندما كانوا يخرجون من المدينة إلى مكة في زمن الرسول صلى الله عليه و سلم كانوا يخرجون على شكل قافلة يعني الكلام الذي ذكرته انت من علف الجمال و الامطار و أن المسألة حاجة للرجال فهذا من كيسك و الأولى أن نتبع كلام النبي صلى الله عليه و سلم و لا أن نحاول أن نعلل العبادات ...<br />ثم ذكرت أنه من حقك كمسلم أن تقول رأيك فإن أخطاء فيغفر الله لك و أن أصبت فتثاب أفول أخطأت فليس كل أحد ان يدلي بدلوه في اي مسألة و دون علم ثم يحتج بأنه إن أصاب يثابو إن أخطأ يغفر له<br />بل المجتهد الذي يبحث في المسألة و يتتبع الادلة و يتأكد من أسانيد الأحاديث و يجمع الأقوال المختلفة و يعلم أدلته هذا الذي إن اجتهد فأصاب فله أجران و إن أخطأ فله أجر لقول النبي صلى الله عليه و سلم :<br />إذا حكم الحاكم فاجتهد ثم أصاب فله أجران وإذا حكم فاجتهد ثم أخطأ فله أجر . صحيح البخاري<br />أرأيت إذا اجتهد و ليس إذا قال رأيه هكذا من عنده"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207034013/http://masr.20at.com:80/newArticle.php?sid=18753"

[[comments]]
order = 5
subject = "الم يوقف عمر بن الخطاب الحدود فى عام الرمادة - لما"
author = "عجوز"
posted = "2008-12-07"
text = "خلاص يا بنات ويا سيدات - لا تذهبوا الى مكة والحرم ولكن سافروا الى بانكوك وسيرلانكا وبومباى كما يفعل السعوديون<br />او سافروا الى لندن وباريس وجزر وشواطىء نوادى العراة كما يفعل الخليجيون<br />اذا كنتم متشددون الى هذا الحد فلماذا نرى سعوديات وبنات عذارى يدرسون فى جامعات الغرب الامريكى بدون محرم<br />نعم ما اسهل ان تقابل بنات سعوديات فى جامعة لندن بدون محرم وهى بلاد الكفر فى نظركم ولكن قلب الاسلام واطهر الاماكن فية تحتاج الى محرم و الى صحبة ولى الامر وكان فى مكة خمارات بنى عمار وملاهى ليلية لبنى هلال ونايت كلب لبنى غسان<br />مكة البلد الامن الطاهر الطيب التى تشع منة الرحمة وتلاقى فية المسلمات العفيفات الطاهرات بلا نقاب و عارية الوجة والكفين<br />عند بيت اللة الحرام مطلوب للمرأة محرم يحرسها وكانها فى وسط الذئاب وقطاع الطريق<br />لماذا لا نرضى بالرفقة الصالحة ؟<br />الا نؤتمن لبناتنا فى المدرسة ان يخرجن مع صحبتهن فى رحلة مدرسية مع معلمة ويسافرن الى مدينة ثانية<br />قليل من التفكير فظروف الزمان تغيرت<br />ويجب ان نكون مرنين وخصوصا فى الاشياء البعيدة عن جوهر واصل العبادات"
archived = "2010-03-14"
capture_url = ""

