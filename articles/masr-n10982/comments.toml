text = "الزمالك اصلا توفى من خمس سنوات ومن الصعب انه اصلا يوصل للمحليه يبقى تسيبك بقى من الكلام ده وشجع الحى ... العالمى .. الاهلى العالمى ببطولاتة اللى انتم كنتم بتقولو الحكام..الحكام ..هم اصحاب البطولات ..ياترى الاهلى كان بيأخد معاه 18 لاعب وادارى ومدير فنى وطبيب ....وحكم ... اصحى.....؟ 11 بطوله فى سنتين فيه ايه تانى ...ده ريال وبرشولونه<br />معملوهاش...."
