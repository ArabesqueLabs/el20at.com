text = "قشطة يا أبا .......<br />ايوة كده ..... عايزين حد يرد علي هذه الأقلام المتآمرة .. والأيدي المتشككة ...<br />أهلي إلي الأبد بالعربي .... فور إيفر بالإنجليزي .... \".....؟ بالفرنساوي \" ...<br />ولا عزاء لغير ذلك ....<br />الزمالك لأ ... الإسماعيلاوية لأ ولأ .... قبلي لأ .... وبحري؟ ممكن نشوف .....<br />إنما الأهلي ............................<br />أهلي أهلي ... .أوه أوه ....<br />وعذرا ... فنحن في زمن الأهلي ....<br />ومش حاسكت برضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \"لا جدوي لهذه الكلمة .. فالمشكلة أكبر وأعظم\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />مدونة مش حاسكت ...<br />http://mesh7askot.blogspot.com/"
