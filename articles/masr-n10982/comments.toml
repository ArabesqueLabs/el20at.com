[[comments]]
order = 10
subject = "هو اي كلام و السلام"
author = "مشجع لفريق ناجح"
text = "مش ساعة ما حد يقول فريق عالمي يطلع بتوع حزب اعداء النجاح ليقولوا و مباراة برشلونة , دي مباراة لها ظرفها مباراة ودية ,اللاعبين راهبين الموقف , الحمل كبير و مفيش لياقة كويسة , لكن عندما يلعب الاهلي بلياقة جيدة و بروح الفانلة الحمراء, و بدون خوف او رهبة يتعب اقوى الفرق العالمية.<br />الاهلى فاز بدوري الابطال عامين متتاليين و بالسوبر كذلك و صار اول فريق يتاهل للبطولة عامين متتاليين و يتصدر الان مجموعته الافريقية و يسعى لبث قناة خاصة و انشاء استاد عالمي و ......................<br />و لكن سؤال اخير ماذا فعل الاخرون ليكونوا حاقدين... الاهلي لعب مع انترناتسيونالي و كلوب امريكا و برشلونة و من قبل الريال و الايكس و روما و مع من لعب الاخرون ؟!!!!!!!!!!"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819202207/http://masr.20at.com:80/newArticle.php?sid=10982"

