[[comments]]
order = 8
subject = "ضع عنوان التعليق"
author = "خارج نطاق الخدمة"
text = "أولا عشان ماحدش يفهمني غلط أنا مش زملكاوي لكن مش أهلاوي أنا مجرد متابع لأني توقفت عن متابعة الكرة المصرية ما عدا طبعا مباريات المنتخب<br />مع كل احترامي لإنجازات الأهلي إلا إن الأهلي ما واجهش فرق حقيقية باستثناء ماتش الزمالك اللي كان فعلا يستحق وصف ماتش أوروبي ولما يبقى حال كل الماتشات في مصر وأفريقيا بالشكل ده ساعتها ممكن نقول إن احنا عندنا كورة في مصر<br />لما يكون الدوري لحد آخر ماتش مش محسوم ونشوف ماتشات حقيقية زي اللي بنتفرج عليها في البطولات الأوروبية في الحالة دي يبقى للكورة المصرية وزن حقيقي على مستوى العالم<br />لحد ما نوصل للحالة دي رجاء من أي مشجع لأي فرقة من فرق مصر إنه ما يفرحش زيادة عن اللزوم بالإنجازات المتحققة لأن كتير منها مش حقيقي ما عدا الحالات الشاذة زي كأس مصر الأخير اللي فاز بيه الأهلي بعد فوزه على الزمالك في ماتش فعلا أكتر من رائع"
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150400/http://masr.20at.com:80/newArticle.php?sid=10982"

