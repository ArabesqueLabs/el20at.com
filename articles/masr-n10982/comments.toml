subject = "الله يا عجم"
author = "نيفين نيفى نوفا"
posted = "2007-07-09"
text = "يا سلام قول يا عجم و سمعنا و سكت كل عزالنا<br />لا زمالك و لا غيره الاهلى فرحنا كتر خيره<br />و تحيه اهلاويه لكل اهلاوى و اهلاويه بماتش اسيك امبارح<br />كفايه ان انجازات الاهلى هى الحاجه الوحيده المفرحه ف البلد<br />و مع انى مبحبش الاخ العزيز سعد الصغير لكن علشان الاهلى اقول ابو تريكه طالع لابوه كل الناس بيحبوه<br />عماد متعب عماد متعب اسك برا را را اسك برا را رى<br />و شوقى و شوقى و الحضرى و الحضرى ارقص يا حضرى ارقص يا حضرى"
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150400/http://masr.20at.com:80/newArticle.php?sid=10982"

