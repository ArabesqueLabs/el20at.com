order = 0
subject = "من حق الزوجة ان تدافع عن نفسها"
author = "منصف"
posted = "2008-10-27"
text = "بارك الله في علماءنا الأفاضل الذين لا يخافون في الله لومة لا ئم<br />الحيوان لوهاجمه شخص يدافع عن نفسه فما بالك بالإنسان<br />من حق كل زوجها أن تدافع عن ظلم زوجها إذا جار عليها<br />ولكن في نفس الوقت من حق الزوج ان يؤدب زوجته إن أخطأت"
archived = "2010-03-14"
