order = 0
subject = "ادفنوا الاموات الاحياء قبل الموتى الشهداء"
author = "------------------------"
posted = "2008-12-27"
text = "هناك موتى احياء يجب دفنهم<br />اما الشهداء فهم احياء عند ربهم يرزقون<br />الجزائر تحررت بمليون شهيد<br />وعندما تحررت<br />وقف الناس فوق السطوح يزغردون<br />يا محمد مبروك عليك الجزائر رجعت اليك<br />انها بشرى النصر"
archived = "2010-03-14"
