[[comments]]
order = 1
subject = "كل سنه وانت طيب يا ريس"
posted = "2008-12-28"
text = "كل سنه وانت طيب ياريس<br />كل سنه وانت راكب واحنا مش راكبين<br />كل سنه وانت قالع واحنا مش قالعين<br />كل سنه وانت مفرفش واحنا مش مفرفشين<br />كل سنه وانت شارب واحنا عطشانين<br />كل سنه وانت شبعان واحنا جعانين<br />كل سنه وانت ضارب واحنا مضروبين<br />كل سنه وانت واقف واحنا نايمين<br />انت فاكرنا يا حبيب الملايين<br />فاكر الغرقانين<br />فاكر المعتقلين<br />فاكر المسرطنين<br />فاكر المكسين<br />مسكين يا حبيب الملايين<br />حتفتكر مين ولا مين ولا مين"
archived = "2010-03-14"
capture_url = ""
