[[comments]]
order = 10
subject = "هى البلد بقت عزبة مين ؟"
author = "قرف الزمان"
text = "بقت دولة مسخرة<br />على حساب الحكومة المصرية وعلى حساب المساكين دافعى الضرايب من الفقراء تستضيف الحكومة المسخرة رئيس فرنسا ومعة ساقطة ليبرطع هنا وهناك على حساب المال العام<br />وجة نائب فى البرلمان - او مجلس موافقات العزبة - سؤال - ولكن مين اللى هيجاوب علية - ثم ان ام اهلة وهو مالة<br />ماهى الخزينة بتصرف على الصالح والطالح وفنادق الشرم لكل من هب ودب بدون رقابة او محاسبة على حساب رغيف خبز الغلابة اللى بيقفوا طوابير فى البرد<br />يا دكتور حمدى حسن شكرا لسؤالك فى مجلس الشعب عن تلك المسخرة"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229071634/http://masr.20at.com:80/newArticle.php?sid=13591"

[[comments]]
order = 11
subject = "نسينا أن نذكر أن (صديقة) ساركوزي، هي (الصديقة) السابقة لكل من المغنيين العالميين"
author = "8fab"
text = "ومين يطلع ساركوزي دا راخل<br />ما هو اصله حتت واد صايغ ابن كلب<br />يعني ريجان بتاع امريكا كان صايع وهلفوت وممثل سيما درجة تالته وبقى رئيس جمهورية<br />ولا مين يطلع كلينتون ولا بوش محاميين على باب الله والعملية مشيت معاهم<br />احنا احسن منهم على الاقل اللي عندنا فريق طيار مش صايغ"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229071634/http://masr.20at.com:80/newArticle.php?sid=13591"

