[[comments]]
order = 25
subject = "بلادي شقة مفروشة !!!"
author = "طيف بدر"
posted = "2008-01-12"
text = "مصر بلد الحضارة ... بلد الكرم و الشهامة و على رأي اللي قال : \" كلمة حلوة في كلمتين ، حلوة يا بلدي !!! \" و أنا كنت مش فاهم ليه أغنية حلوة و جميلة زي أغنية \" حلوة يا بلدي \" اتحولت لـ \" مسخرة يا بلدي \" في فيلم (خليج نعمة ) لكن دلوقتي فهمت السبب مع زيارة (ساركوزي ) و الـ (جيرل فريند ) بتاعته لمصرلقضاء أجازة الكريسماس في أحضان (سفنكس ) .... ميري كريسماس (ساركو) !!!<br />أتخيل الآن واحد من إياهم من أصحاب القلوب المصدية و الدماغ الجزمة - المشكلة إنه فاكرها كلاركس – يسألني : \" إنت حتعمل دكر على ساركوزي ؟ ما كل السياح اللي بييجوا مش متجوزين \"<br />ماشي يا راج.... يا راجل - ما علينا ، المصيبة إن هي دي سمعة بلدك دلوقتي . مصر عبارة عن إزإزة خمرة و شقة في شارع الهرم و رقص شرقي و عايزين يقنعونا إن من غيرهم حنموت و مش حنلاقي ناكل ... و كأننا أساسا لاقيين ناكل . ثم إيه لازمة تكون أجازة الرجل و حمايته و إقامته و فطاره و غداه و عشاه و مزاجه هو و \" المزة \" بتاعته يكون على حساب الحكومة المصرية ؟!! هو إنت عارف تتجوز و لا تتنيل ؟ و لو حاولت إنت يا سبع البورومبة تعمل زي ساركوزي و تاخد صاحبتك في أي فندق كبير ... أول سؤال حيسألوه : \" فين فسيمة الجواز يا أستاذ ؟ \" ساعتها حترد يا أبو دماغ جزمة :\" إنت حتعمل دكر عليا ؟ اشمعنى ساركوزي ؟ \"<br />إحنا كدة بنفتح الباب رسميا للسياحة الجنسية في مصر علشان تبقى على عينك يا تاجر و نبقى زي تايلاندا و كمبوديا و الفلبين ... إلا قولي الفلبين عاملة إيه دلوقتي ؟؟<br />يسألني أبو قلب مصدي بطريقة أقرانه الذين يظنون انفسهم يدركون بواطن الأمور : \" مشكلتك إنت و أمثالك إنكم بتنظروا للأمور بسذاجة و بخلفية دينية تبسيطية ، ما حدث كان ضروريا لأن هناك تعاونا مصريا فرنسيا منتظرا خاصة في مجال الطاقة النووية و حتبقى الأشية معدن \"<br />نعم ، أنا أؤمن إيمانا جازما أنه ما جهر قوم بالفحشاء بينهم إلا و عمهم الله بالبلاء و الأسقام و لكن الإسلام ليس قاسما مشتركا بيني و بينك الآن .. ساكلمك بالعقل إن كنتم تعقلون ...<br />لو رخصة عربيتك متعطلة بسبب موظف عاوز منك إكرامية – رشوة يعني ... يبقى إيه رأيك في الموظف ده ؟ طب لو الموظف ده قال لك إنه حيخلص الرخصة بس بعد ما تجهز له شقتك يوم الخميس ييجي يشرف فيها هو و بنت جايبها من كورنيش البحر ، حيكون رد فعلك إيه ؟ ثم هل هذه مدرسة جديدة في العلاقات الدولية تدشنها مصر . قبل ما نعمل أي اتفاقية مع أي دولة نعمل لرئيس الدولة دي جو و مزاج . ده على كدة مش لازم نظلم أصحاب شبكات الدعارة و الشقق المفروشة و المفروض الشرطة متقبضش عليهم لأن دول مكانهم الحقيقي في الوزارات و المصالح الحكومية مادام هذه هي الطريقة المصرية الجديدة في إدارة علاقاتها الدولية .<br />الغريب إنك بتقول عليا إني ساذج ؟! طب يا عم المفتح المدقدق اعتبرني داقق بطتين على دماغي ... هي فرنسا بانية علاقاتها و اقتصادها و اتفاقياتها على أساس انبساط رئيس فرنسا ؟<br />يعني أنا متخيل دلوقتي إن أي مستثمرفرنسي ييجي مصر حيسأل المسئولين المصريين عن التسهيلات المتوقعة لتنفيذ مشروعه فيكون الرد : إحنا جبنا رئيس جمهوريتك مع البنت بتاعته يومين عندنا و حنورد لك مزز، ولا لو جت المؤسسات المتخصصة عن الطاقة النووية تسأل عن إجراءات الأمان حنقولهم عندنا رقاصة مكنة اسمها فيفي عبده .<br />و الله شركة بيجو عاملة واحد من اكبر مصانعها في إيران و مسمعناش إن إيران جابت رئيس فرنسا مع الجيرل فريند في الكريسماس ولا سمعنا إن بوتين جه مع مزة روسية قبل ما يبدأ التعاون الروسي الإيراني في مجال الطاقة النووية .<br />الآن يتمثل هذا الصديق أبو دماغ جزمة دور الرجل السامي المثقف \" إمتى يا مسلمين تتلموا و تتعلموا احترام الآخر و عدم احتقار تقاليده و أفكاره و تعرفوا معنى التعايش البناء ؟ \"<br />إنت بتتكلم عن إيه يا حضرت . صحيح دماغك جزمة !!! ده ساركوزي مهندس قانون حظر الحجاب في فرنسا و واحد من رموز اليمين الأوروبي المعادي للأفارقة و المهاجرين و هو من المعسكر الأمريكي حتى أن بعض الفرنسيين يطلقون عليه \" Tony Blair de France \" . طب في هولندا تعاطي الحشيش و الكوكايين عادي و تقليدي ... نسبهم يحششوا هنا ؟ و لا نروح نحشش معاهم في امستردام ؟ طب إيه رأيك في القات اليمني ؟ و إيه رأيك في عدم قيادة المرأة السعودية للسيارة ؟ و إيه رأيك في نظام الكفيل ؟ ما دي برضه حسب منطقكم الأعور عادات و تقاليد للآخر يجب احترامها ... و لا لازم يكون الاخر ده عينيه خضرا و شعره أصفر ؟؟!!"
