order = 16
subject = "من ديوان اميات"
author = "الشاعر نجيب سرور"
text = "جعان وعريان وعاطل بالسبع صنعات<br />والست تعبت - - ياعم لايمها على الفكة<br />هاتوا المحافظ وايديكوا يالا على الشيكات<br />ونظرة ياللى جايين الليلة من مكة<br />بلد المنايك بلدنا الكل ناك فيها<br />شوف الخريطة تلاقيها فاتحة رجليها<br />ربك خلقها كدة راح تعمل اية فيها<br />وقلنا ننضف بقى قالوا بلا وكسة<br />واللة لا تحصل بدل النكسة ميت نكسة"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229071634/http://masr.20at.com:80/newArticle.php?sid=13591"

