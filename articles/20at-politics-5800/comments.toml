[[comments]]
order = 9
subject = "."
author = "امانى"
posted = "2007-05-31"
text = "ابشع حاجه ممكن انسان يعملها على وجه االارض انه يطلق احكام مسبقه على ناس عمره ماسمع منهم ولا اتعامل معاهم صح؟؟؟ انتوا مش معايا برضو<br />وكل واحد عمل يقول خليه يفرح بالجايزه وان دى مصيده والكلام العجيب ده اكيد انه عرو ماشف ولا حلقه واحده من برامج استاذى أ.عمرو<br />دعوه للتعايش صناع الحياه على خطى الحبيب بأسمك نحيا يا جماعه فى ايه فوقو ده أ.عرو النسان الوحيد الى عرف يفهم الغرب وغير الغرب صوره الاسلام الصح ولا انتوا عاجبكوا انهم يقعدوا ليل نهار يقولو علينا ارهاب وبقر ومبنفهمش اد كده هانت عليكم نفسكم اد كده هان كليكم اسلامكم ان دينك يتشتم قدامق وانت قاعد ومبتعملش حاجه ويوم ماتيجى لواحد الفرصه انو يتكلمو تقولو عليه خاين والكلام الى ملوش لزمه ده<br />يا جماعه انا عوزه اقولوكم ان انا متابعه اخبار استاذ عمرو لحظه بلحظه وهو قال انو ولله مرايح عشان الجايزه بس كان هدفو الاساسى.......<br />التعريف برسول الله والاسلام دى حاجه<br />تانى حاجه بالنسبه للناس الى اتكلمو على موضوع انه مقالش حاجه فى حق العراق وفلسطين _لأ بقى قال وقال كلام شديد كمان_<br />اول حاجه قال فى وشد الجماعه الامريكان ... امريكا يجب ان تخرج من العراق<br />ونبى خليه يجى يقولها فى مصر كده هتلقيه تانى يوم ورا الشمس<br />تانى حاجه لما سألوه على حته التعايش مع اسرائيل قالهم لأ هو انت تحتل ارضى وتقولى نتعايش نحن لا نتعايش مع من قتل محمد الدره ومع من يحفر تحت المسجد الاقصى<br />شفت قوه اكبر من كده<br />شوفتوا بقى الكلام والاحكام المسبقه بتعمل ايه بالله عليكم يا جماعه متتكلموش على حد وانتوا اصلا متعرفوش حاجه عنو لانكم ولله ولله هتتحسبوا عليه<br />وياريت الى عاوز ياخد نظره شامله عن الموضوع يدخل على موقع عمرو خالد .نت<br />www.amrkhaled.net<br />والسلام"
archived = "2010-03-14"
capture_url = ""

