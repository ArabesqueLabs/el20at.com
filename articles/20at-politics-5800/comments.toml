author = "sarah"
posted = "2007-06-07"
text = "انا مع الاخت امانى فى كل الكلام اللى قالتة ودة نفس الكلام اللى منت عاوزة اقولوا لما قرات الكلام الفاضى للناس اللى مش عارفة تقول حاجة فبتبرطم باى كلام وخلاص وفى مثل ما معناة ان اللى يجهل بشىء يبقى عدوة فالناس اللى قعدة بتقول ان عمرو خالد بيدعوا للبرالية وان كلامة عبارة عن فانتزيا فعلا انتوا ينطبق عليكم المثل اللى بيقول الفاضى يعمل قاضى والنبى اعملوا نص اللى عملوة عمرو وبعد كدة ابقوا اتكلموا ,واللة لو اعدت من هنا لبكرة كلامى مش هيخلص على عمرو خالد سلام"
