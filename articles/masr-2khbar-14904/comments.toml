subject = ""
author = "الاخوان خوارج العصر"
posted = "2010-01-16"
text = "الإخوان المسلمين هم خوارج العصر وهذا هو الدليل !!<br />د عبدالله بن المطلق<br />لم تكن رؤية استثمار القرآن الكريم في خدمة الفكر والتوجه لدى جماعة الإخوان المسلمين بدعا من القول بل توارثوه أبا عن جد عن سلفهم الطالح \" ذي الخويصرة وأحفاده \" كيف هذا ؟!!<br />ذي الخويصرة احتج على رسول رب العالمين في قسمة غنائم حنين قائلا \" اعدل يا محمد فإنك لم تعدل \" فاتخذ من المال وقسمته ذريعة في الطعن بأمانة سيد المرسلين صلى الله عليه وسلم بدعوى الإصلاح كما يزعم وقد أجابه النبي عليه السلام بقوله \" ويحك من يعدل إن لم أعدل \"!!.<br />ثم أخبر النبي عليه السلام أنه يخرج من ظئظئ هذا الرجل قوم تحقرون صلاتكم عن صلاتهم وصيامكم عند صيامهم يقرؤون القرآن لا يتجاوز تراقيهم يمرقون من الإسلام كم يمرق السهم من الرمية \" ثم دعا عليه السلام إلى قتلهم مخبرا أن في قتلهم أجر عظيم عند الله تعالى ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-16"
text = "ولئك يا سادتي الكرام هم الخوارج الذين رفعوا القرآن بأيديهم علي الخليفة الراشد علي بن أبي طالب رضي الله عنهم محتجين عليه بأنه حكم الرجال مطالبين بتحكيم القرآن وقد انتدب إليهم علي رضي الله عنه ابن عباس رضي الله عنه حيث جادلهم بالقرآن وأقام عليه الحجة والبيان وهكذا جماعة الإخوان المسلمين يتهمون حكام المسلمين بالجور وعدم العدل بين رعاياهم متهمين إياهم بالاستئثار بالمال دون رعاياهم متخذين من المال فقط وسيلة في تكفير الحكام ولعنهم والطعن في عقائدهم ونواياهم مغفلين ما هو أهم من المال وهي العقيدة وسلامتها من عدمه إذ غايتهم الدنيا والدرهم والدينار بغيتهم إن أعطوا منه رضوا وإن منعوها إذا هم يسخطون أما الدين وأحكامه فهو ذريعة ومطية يدغدغون بها عواطف العامة والبلهاء وبعض البلدان الإسلامية التي تمكنوا من الوصول فيها لمناصب عليا وقيادية خير شاهد حيث لم يقيموا بالقرآن رأسا بل بعضهم أبقى الحكم علمانيا كما كان لئلا يخسر رئاسته ومنصبه وكرسيه ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
