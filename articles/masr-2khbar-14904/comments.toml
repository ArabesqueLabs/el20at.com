posted = "2010-01-16"
text = "ومما يؤكد تحايلهم وكذبهم :<br />قالوا وأشاعوا أعني – رموز الإخوان المسلمين – في مجتمعنا مزيدا في تضليل الأمة وإيهام البشر والتلبيس على الخلق في وصف خوارج مجتمعنا \" الفئة الضالة \" وحقيقة الأمر أنه لا صحة لمسمى الفئة الضالة بيننا والدليل أن هذا الاسم محليا لتفجيري وطننا فقط وليس عالميا لجميع المفجرين في كل قطر مسلم وحقيقة الأمر أن من يسمونهم \" فئة ضالة \" هم الصف الأول من جند الإخوان المسلمين في مجتمعنا وفي كل مجتمع الذين ربوهم على الخروج وسمموا أفكارهم وغذوا عقولهم وباسم الدين والقرآن بمعتقد منحرف ضال حينما يخرجون بهم في خلوات وجلسات واستراحات خاصة ليلقنوهم فنون مخالفة نصوص القرآن وليزجوا بهم وليقدموهم وليضحوا بهم في عدد من أقطار العالم الإسلامي أفغانستان والشيشان والبوسنة والهرسك والعراق وغدا الصومال وغيرها من البلدان الإسلامية المنكوبة سعيا لإقامة خلافتهم الراشدة المزعومة فهم والله شر من وطأ الأرض وهم والله شرمن تحت أديم السماء وهم والله دعاة الفتنة ومشعلوها فحسبهم الله ونعم الوكيل والله غالب على أمره ولينصرن من ينصره وهو جل وعلا من وراء القصد والمستعان على ما يصفون"
archived = "2010-03-14"
