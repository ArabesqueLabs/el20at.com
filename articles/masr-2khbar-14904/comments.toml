subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-16"
text = "ومن هنا يظهر لنا أوجه الشبه بين خوارج القرون الأولى وخوارج القرون المعاصرة \" الإخوان المسلمين \" في ثلاث مسائل:<br />أولا : أنهم يركزون على المال والمادة فقط ويجعلونها ذريعة ومعيارا ووسيلة في التهجم على السلطان وانتقاصه والثورة عليه وإيغار صدور رعيته عليه وإن كان من أتقى الخلق وهل هناك أتقى من محمد عليه الصلاة والسلام ؟!! .<br />ثانيا : الطعن العلني في الحاكم \" اعدل يا محمد ...\" وهكذا الإخوان المسلمين كفروا وفسقوا جميع حكام المسلمين ورعاياهم دون استثناء وإن شهدوا أن لا إله إلا الله ما لم ينتسبوا إلى فكرهم وحزبيتهم المقيتة وجماعتهم \" المؤمنة !! \"<br />ثالثا : إظهار محبة القرآن الكريم والمناداة بتحكيمه لمخادعة العامة وبلهاء الخلق ومخالفته والتحايل على نصوصه وأوامره باطنا ."
archived = "2010-03-14"
