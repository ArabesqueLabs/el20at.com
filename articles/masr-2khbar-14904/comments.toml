subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-16"
text = "حفاد ذي الخويصرة من خوارج سلفهم المشئوم اتخذوا من القرآن وسيلة في الطعن بعدالة إمام المسلمين علي بن أبي طالب رضي الله عنهم متهمين إياه بأنه يحكم الرجال!!.<br />خوارج العصر من جماعة الإخوان المسلمين اتخذوا القرآن وسيلة هامة جدا في الاحتجاج على الحكام فهم يدندنون حول الدعوة بضرورة تحكيم القرآن الكريم وقياداتهم من أبعد الناس عن نصوص القرآن الكريم ولنأخذ سويا بعض الأمثلة من ذلك أن بعضهم يبيح استماع الأغاني ويفتي عبر القنوات الفضائية بجواز ذلك وقد حرم القرآن الكريم استماع اللهو قال سبحانه \" ومن الناس من يشتري لهو الحديث ليضل عن سبيل الله بغير علم ..\" قال ابن مسعود والله الذي لا إله إلا هو إنه الغناء ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-16"
text = "من مبادئ فكر الإخوان المسلمين تكفير حكام المسلمين والخروج عليهم ممتثلين قول أحد مؤسسي فكرهم حيث يقول : «... لعلك تبينت مما أسلفنا آنفاً أن غاية الجهاد في الإسلام هي قواعد الإسلام في مكانها واستبدالها بها. وهذه مهمة إحداث انقلاب إسلامي عام - غير منحصر في قطر دون قطر بل مما يريده الإسلام ويضعه نصب عينيه أن يحدث هذا الانقلاب الشامل في جميع أنحاء المعمورة، هذه غايته العليا ومقصده الأسمى الذي يطمح إليه ببصره إلا أنه لا مندوحة للمسلمين أو أعضاء الحزب الإسلامي عن الشروع في مهمتهم بإحداث الانقلاب المنشود والسعي وراء تغيير نظم الحكم في بلادهم التي يسكنونها» المرجع في ظلال القرآن سيد قطب ج3/ص1451 طبعة دار الشروق."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-16"
text = "أسألكم بالله الذي لا إله إلا هو أليست هذه دعوة خروج وثورة صريحة على ولاة الأمر في كل قطر من أقطار الأرض غير منحصر في قطر دون قطر أصلها وأكدها وقتل من أجلها إمامهم وشهيد فكرهم فما رأي تلاميذ قطب في مجتمعنا وما تأويلهم لهذا النص الكريم للإمام الشهيد ؟!! ألا يعتقدون صحة هذا القول لإمامهم ووجوب العمل به ؟!!.<br />حقا هذه عقيدتهم مخالفين بذلك نصا صريحا في كتاب الله تعالى \" يا أيها الذين آمنوا أطيعوا الله وأطيعوا الرسول وأولي الأمر منكم \" فأين صراخهم بالعناية بكتاب الله تعالى ودعم حفظه أم يؤمنون ببعض الكتاب ويكفرون ببعض كحال أهل الكتاب من اليهود والنصارى الذين ذمهم الله تعالى في كتابه الكريم ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-16"
text = "ثم أليس القرآن الكريم كله دعوة للتوحيد والعقيدة كما أشار إلى ذلكم شيخ الإسلام عبد الرحمن بن سعدي رحمه الله فإما دعوة للتوحيد وتحذير من الشرك وإما ببيان مكلات التوحيد والتحذير من منقصاته وإما ببيان جزاء الموحدين وعقوبة المشركين فأين الإخوان المسلمين من الدعوة إلى التوحيد الذي دعا إليه القرآن بل من أجله أنزل ومن أجل أرسل محمد وإخوانه المرسلين عليهم الصلاة والسلام ؟!! فأين دعوتهم هم للتوحيد وأين نصوص أئمتهم وقياداتهم ورموزهم وأين خطبهم وندواتهم ومحاضراتهم ومخيماتهم ومراكزهم وملتقياتهم الدعوية وجميع مناشطهم من قضية التوحيد التي هي قضية القرآن الكر يم وغايته ؟َ!َ!. هل من مجيب ؟َ!!<br />علم أحفاد الخوارج من جماعة الاخوان المسلمين عظم مكانة القرآن الكريم لدى المسلمين عموما والشعوب العربية خصوصا ومحبتهم الكبيرة لكلام الله وتقديسهم الشديد له دينا وطاعة وقربة لله فاستغلوا القرآن الكريم ورفعوه بأيديهم كما رفعه أسلافهم والكثير منهم والذي لا إله إلا هو من أبعد الناس عن القرآن كما أن الكثير من حفاظهم يقرؤون القرآن لا يتجاوز حناجرهم \" قراء فقط \" كما وصف أسلافهم بذالكم النبي عليه الصلاة والسلام."
archived = "2010-03-14"
capture_url = ""

[[comments]]
