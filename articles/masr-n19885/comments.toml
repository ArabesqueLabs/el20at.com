[[comments]]
order = 3
subject = "الخميرة والزبادي مفيدة جدا للبشرة الدهنية"
author = "نظيف"
text = "الخميرة والزبادي مفيدة جدا للبشرة الدهنية...<br />عزيزتي .. إذا كنتِ من ذوات البشرة الدهنية وتعانين من مشكلة المسامات الواسعة ، وتبحثين عن طريقة سهلة وجيدة لسدها وشد البشرة الدهنية ،<br />فلا داعي للقلق يقدم لكِ خبراء التجميل قناع الزبادي والخميرة الذي يساعدك على حل هذه المشكلة :<br />المكونات : ملعقة خميرة ، علبة زبادي .<br />الطريقة :<br />* امزجي ملعقة خميرة جافة مع مقدار من الزبادي يكفي لعمل خليط خفيف وليس سميك.<br />* ضعيه على وجهك كله أو على المناطق الدهنية منه واتركيه عشرين دقيقة ثم اشطفي وجهك بالماء الدافئ وبعده ماء بارد ."
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215084302/http://masr.20at.com:80/newArticle.php?sid=19885"

[[comments]]
order = 4
subject = "كيفية صنع الخميرة"
author = "نظيف"
text = "كيفية صنع الخميرة<br />السلام عليكم ورحمة الله تعالى وبركاته<br />اول شيء احببت ان اتكلم لكم عن الفوائد العضيمة للبكثيريا النافعة المزجودة بالألبان والأجبان والرائب<br />الجسم بحاجة كثيرة لهذه البكتريات<br />لذا احببت ان احبركم عن طريقة صنع الخميرة عندنا بالمغرب تختلف كل منطقة عندما بالكغرب بصنعها لكن الغالب يستعملوا اللبن فهو من المكونات الأساسية في انجاح الخميرة نحن نسميها الخميرة البلدية بمعني التقليدية<br />مأخد الذقيق ربع كيلوا ثم ضرس من الثوم مجروش شوي ملح واللبن نخلط مثل العجين ونتركها تقريبا 24 ساعة وكل مانحب نعجن الخبز نخلطها مع العجين دون ان نضيف الخميرة الأصطناعية ثم ناخد نفس كمية الخميرة اللتي صنعنا منها الخميرة ونضعها في علبة بلاستيكية من الأفضل ان تكون زجاجية ونغطيها طبعا لازم العلبة تكون كبيرة كثير منشان الخميرة راح تنتفح لاتخافي من هنا را ج تساعدك في كل مرة على انه الخبز يختمر ثم نرجع لخبزنا نضيف اذا احببنا الحميرة الأصطناعية ثم نكمل العجين بالطريقة العادية"
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215084302/http://masr.20at.com:80/newArticle.php?sid=19885"

[[comments]]
order = 5
subject = "ربيت خميرا ما ربتش خميرا كلام اسرائيل حيمشي على التخين"
author = "مش ضروري"
text = "كما تعلمون انه في فترة رئاسة بوش نظمت اسرائيل عملية ضرب البرجين وذلك لتضع امريكا والعالم امام طريق واحد لا ثاني له الا وهو تنفيذ الاجندا الاسرائيلية التي تمثلت باحتلال افعانستان والعراق الى اخره<br />وفي رئاسة هذا الاسود التي جاءت به الصهيونية العالمية بدات اسرائيل بارتكاب نفس سيناريو ضرب البرجين بس باسلوب مختلف وقبل تسلم هذا الاسود مهام منصبه الا وهو افتعال هذه الازمة العالمية لنفس السبب<br />الا وهو وضع امريكا والعالم على طريق واحد لا خيار فيه الا وهو تنفيذ الادجندا الاسرائيلية في العالم<br />وستنكشف هذه الحقائق في الشهور القليلة المقبلة"
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215084302/http://masr.20at.com:80/newArticle.php?sid=19885"

[[comments]]
order = 6
subject = "ديون وحمير وربينا الاخميرا"
author = "ghishan@gmail.com"
text = "طلب من خبير مالي أن يبسط للناس العاديين أسباب الكارثة التي حصلت في أسواق البورصة‏(‏الأسهم‏)‏فقال :<br />إن رجلاً ذهب إلى قرية‏نائية، عارضاً على سكانها شراء كل حمار لديهم، بعشرة‏دولارات.‏ ‏فباع قسم كبير منهم‏حميرهم.‏<br />بعدها رفع السعر إلى 15 ‏دولاراً فباع آخرون ‏فرفع سعره إلى‏ثلاثين، حتى نفدت الحمير من لدى أهل القرية.‏<br />‏عندها قال لهم: أدفع 50 ‏دولاراً لقاء الحمار الواحد.‏ ‏وذهب لتمضية نهاية‏الأسبوع في المدينة………<br />ثم جاء مساعده ‏عارضاً على أهل‏القرية أن يبيعهم حميرهم السابقة بأربعين دولاراً للحمار الواحد، على أن يبيعوها‏مجدّداً لمعلمه بخمسين يوم الاثنين ‏فدفعوا كل مدّخراتهم ثمناً لحميرهم.<br />ومن لايملك مالا اقترض‏واستدان على امل تحقيق مكسب سريع.<br />وبعدها لم يروا‏الشاري ولا مساعده أبدا..<br />جاء الأسبوع التالي، وفي‏القرية ‏أمران:<br />‏ديون،‏وحمير، فقط لا غير."
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215084302/http://masr.20at.com:80/newArticle.php?sid=19885"

[[comments]]
