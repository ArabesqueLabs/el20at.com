subject = "عايزين عمر خالد يراس الحكومة المصرية"
author = "مش حخاف"
text = "حل مشاكل مصر عايزه واحد بيحب ربنا وبيخاف من ربنا وبيحب بلده<br />مصر محتاجه رئيس وزراء زي عمر خالد الشعب كله يسمعله وينفذ<br />زي كده صناع الحياه<br />الشعب عايز صناع الحياه<br />ومن احياها فكأنما احيا الناس جميعا"
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215084302/http://masr.20at.com:80/newArticle.php?sid=19885"
