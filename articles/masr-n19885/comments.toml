[[comments]]
order = 0
subject = "شوية شفافية وصدق يرحمكم اللة"
author = "شلاطة"
text = "الراجل زى ما بيقولوا على القهوة خللى البحر طحينة وان الدنيا هتمطر بيض ورقاق<br />اقتصاد اية يا عم الحاج<br />البورصة -- وفقد السهم حوالى 70 % من قيمتة وحوادث انتحار اصحاب الاسهم على صفحات الجرايد<br />البنوك وربنا يستر - بيحصل عمليات سحب ولا يتم عمليات ايداع واحيانا مفيش سيولة<br />وبعدين انفاق اية على البنية الاساسية - يعنى رصف المرصوف وتبديل التل توار اللى بيتغير كل سنتين<br />يعنى توزيع اموال على شركات الاحباب واصحاب النصيب بدون اى عائد<br />كنت هفرح لو قلت هنعمل 5 مصانع اسمنت وننتج ونصد ونشغل العيال<br />كنت هفرح لو قلت هنرجع لزراعة القطن طويل التيلة وهنشغل المحالج وعصير البذرة وعمل الزيوت والصابون وشغلنا مصانع الغزل ومصانع النسيج من تانى والعيال تشتغل ويبقى فية عائد للبلد<br />كنت هفرحلو قلت اننا هننتج اول سيارة محلية مصرية بعد سنتين بمكونات مصرية<br />انما رصف المرصوف من الشوارع وعمل نل توارات جديدة فدى سوء انفاق وتبذير وسفة فى اموال دافعى الضرائب<br />هنعمل اية<br />لا يبقى غير الدعاء اللهم ولى علينا الصالح منا ولا تولى علينا شرارنا<br />سيادة رئيس الوزراء المبجل - انت لسة محتفظ بالجنسية الكندية ؟"
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215084302/http://masr.20at.com:80/newArticle.php?sid=19885"

