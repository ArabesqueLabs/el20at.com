order = 0
subject = "المستحيل بعينة - رقصة الذبيح قبل الموت"
author = "مصرى"
posted = "2008-05-22"
text = "اوضاع البلد الاقتصادية غير قابلة للعلاج ولا يوجد اى انسان قادر على الحل<br />والمتوقع هو الانفجار<br />قد يأتى الانفجار من الجيش او الشرطة او الامن المركزى او الشعب الجائع<br />هناك انفجار ما سوف يدوى قريبا<br />الدول العربية بدأت تحس بأن هناك شيئا ما<br />الشيخ خليفة بن زايد تبرع بمليون طن قمح ليسد شيئا ما<br />والملك السعودى تبرع بمليارين من الدولارات لشراء قمح<br />وكل ذلك بدون جدوى<br />الجوع ينتشر والغلاء كل يوم يزيد والناس تتذمر اكثر<br />ربما لو جاء جمال قبل 10 سنوات كان ممكن<br />انما الان فذلك هو المستحيل بعينة"
archived = "2010-03-14"
capture_url = ""

