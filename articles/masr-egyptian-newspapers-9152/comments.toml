[[comments]]
order = 3
subject = "الله يخلصنا منكم"
author = "قرفان منكم"
posted = "2008-05-24"
text = "إذا سقطت حشرة في كوب القهوة الخاص بك - فماذا تفعل ؟<br />التحليل:<br />إذا كنت من حزب الوفد فستلقى بكوب القهوة وتغادر المقهى<br />وإذا كنت من الإخوان فأنك ستخرج الحشرة وتشرب القهوة<br />وإذا كنت من حزب العمل أو الشعب فانك ستأكل الحشرة وتشرب القهوة<br />إما إذا كنت من الحزب الوطني فسيكون رد الفعل مختلفا - -!!!<br />ستبيع الحشرة إلى مستثمر..<br />والقهوة إلى مستثمر عربي رئيسي<br />وستصيح - امن الدولة معرض للخطر –<br />وتفرض قانون الطوارئ<br />وسيتهم الإخوان المسلمين بإلقاء الحشرة في القهوة –<br />وستدعى أن حماس والجهاد والقاعدة ساعدوا الإخوان في إلقاء الحشرة في القهوة وان هذه عملية إرهابية<br />وسيطلب من الدولة منع طيران تلك الحشرات الإرهابية<br />وتقبض على عشرين ألف من الإخوان وتقدمهم للمحاكم العسكرية وتصادر أموالهم<br />ويتم رفع أسعار البنزين والديزل والضرائب إلى عشرين ضعفا<br />لتشترى كوب قهوة :<br />غالي ونظيف وتعيش مسرور وحياتك آخر جمال ومبارك عليك يا حبيب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "مصر ايها السادة تحتضر"
author = "مصرى ضرباة البرومة"
posted = "2008-05-24"
text = "حقيقة ايها السادة بلدنا بتحتضر<br />لما تشوف خريطة البلد - تلاقى شوية المثتثمرين عملوا شوية مواخير وشاليهات وقرى سياحية فى الغردقة والشرم والساحل الشمالى مع شوية فنادق لزوم الصرمعة والمزاج العال والطيب وفية فى الاماكن دى شوية حركة وعمران ونسوان جاية من اوكرانيا وروسيا البيضاء واسرائيل والعملية وردى واخر فللى<br />انما انزل بلد زى الزقازيق والمنصورة وطنطا واسيوط وسوهاج وقنا والمدن المصرية والقرى المصرية - اية اللى اتبنى هناك -<br />ماهى المصانع وابواب الرزق التى فتحت فى 26 سنة اللى فاتت - لا شىء - التنمية صفر<br />المدن برتزق من شوية محلات ودكاكين ودة بيبيع لدة ودة بيبيع للتانى - بمعنى ان السلعة بتمر من المستورد الى المستهلك على عشرة بياعين بيبيعوا لبعض وكل واحد بياخد مكسب - وعلشان كدة سعر الفرخة فى مصر اعلى من نيويورك<br />وسعر التلفزيون فى مصر ضعف سعرة فى ابوظبى وثلاثة اضعافة فى بومباى فى الهند<br />مفيش احد فى المدن دى بيشتغل وظيفة انتاجية - وظيفة تعطى عائد مادى تضاف لانتاج البلد<br />البلد اقتصاديا اتكسحت<br />رأس المال المصرى بيهرب الى دبى والخليج<br />المثتثمرين اللى زى الشريف وغيرة انتقلوا الى الخليج<br />القطاع الخاص لة قدرة ومجال للاثتثمار - لما يعجز القطاع الخاص المفروض تخش الدولة تعمل مصانع للتنمية<br />القيادات فى حالة غيبوبة او موت سريرى<br />لما كانت مصر بتحارب كانت عندها فائض غذائى<br />ولما 26 سنة سلام مع اسرائيل وتنتهى بطوابير الخبز وشحاتة مليون طن قمح من الامارات ومليارين من الدولارات من السعودية تبقى فية حاجة غلط<br />ارتفاع الاسعار عالميا دة فى مصر بس - طيب الهند لية لم تتأثر بارتفاع الاسعار العالمية<br />السودان لية لم تتأثر بارتفاع الاسعار العالمية<br />بوركينا فاسو لم تتأثر بارتفاع الاسعار العالمية<br />حجج واهية لنظام حكم فاشل وغبى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "تعقيبا لكلام المحترم  مصرى مش ضرباة البرومة"
author = "حنفى نوكيا"
posted = "2008-05-24"
text = "الصناعة التكنولوجية والثقيلة وزراعة المنتجات الاستراتيجية اولا وبعد كدة نصدرالفائض اونرجع نركز فى القطن وندية شوية اهتمام زى الكنتلوب والفرولة لو وجة جزءبسيط من الناتج القومى لمجال الابحاث بدل السرقة لكان فية بصيص من الامل للمستقبل لكن مع الاسف كل طاقات وامكانات البلد وجهت لبناء مدن سياحية وفنادق الغرض منها جعل البلد ماخور للاجانب بحجة تشجيع السياحة فى الظاهر وفى الباطن نهب اراضى البلد وبيعها على المحظوظين ليبيعوها للمستثمرالاجنبى ويقسموا وطز فى مستقبل مصر ملهاش اى لازمة انة نبقى بلد شبة صناعى مش صناعى ليها لزمة انة احنا نخدم على السياح ونامن طلبتهم وننافس فى جذبهم باى وسيلة ولوعلى حساب كرامتنا مشكلتنا مش جمال اوابوة دول جزء رئيسى من المشكلة لكن المشكلة الاكبر فى النظام اللى بنوة على اسس وقواعد متينة من الفساد فصلوا انظمة وقوانين تحمى النظام وتظمن لة الانفراد بالسلطة لمية سنة قدام ولكم ان تتخيلوا احوال من بعدنا دحنا سبعة وعشرين سنة كل سنة بعشرة ومفيش اى بصيص من الامل او نور فى اخر النفق المظلم"
archived = "2010-03-14"
capture_url = ""

