text = "و مين عارف مش يمكن كمان كام شهر يحضر الى مصر و يدخل من صالةكبار الزوار التي منعوا جيهان السادات من دخولها و سمحوا لنانسي عجرم ، و الناس تشوفه وتحلف ان ممدوح اسماعيل في مصر ، والحكومة تحلف انه لسه ما جاش وان اسمه على قائمة المترقب وصولهم ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
