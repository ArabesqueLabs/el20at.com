text = "1) لو عايزها فلاحة شوفها في الغيط..<br />2) ولم عايزها ست بيت شوفها في البيت..<br />3) ولو عايزها مثقفة روحلها الجامعة..<br />4) ولو عايزها بتشتغل حتلقيها دكتورة ومهندسة ومدرسة..<br />انا عايزهم الاربعة بصراحه"
