[[comments]]
order = 1
subject = "شفتهم فى الغيط يلبسون بناطيل الجينز ويحصدون الارز"
author = "فلاح"
posted = "2009-01-31"
text = "البنات الفلاحات فى القرية حاجة غريبة<br />الاول كانوا محجبات - قلنا ماشى لبس الجدات وجدة الجدات والفلاحة المصرية على مدى التاريخ بالمنديل والطرحة والجلابية<br />الموضة الجديدة هى النقاب<br />تصوروا البنات الجامعيات وبتوع المدارس كلهم لبسوا النقاب الاسود<br />لبس النقاب الذى لا يظهر غير العيون فى ريف الوجة البحرى وعباية طويلة وتحتها بنطلون جينز وبتروح الغيط فى توك توك وتشتغل فى ضم محصول الارز<br />وفية بنات بتتحدى وتسوق الجرار كدة دلع مش للشغل<br />والمصيبة تلاقيهم دكاترة اسنان وصيدليانات وتروح تخبط على دارهم نص الليل تطلع لك الدكتورة وتفتح لك غرفة العيادة فى بيتهم وتقعدك على الكرسى وتخلع ضرسك وتاخد 15 جنية وتقول لك روح وتانى يوم تلاقيها واقفة قدام غيطهم بتتفرج على رى الارض وتشم شوية هواء<br />وفى قريتى كل تخصصات الهندسة البنات اتعلموها وفيهن مهندسات متخصصات فى الالكترونيات والميكانيكا<br />وعشنا وشفنا"
archived = "2010-03-14"
capture_url = ""

