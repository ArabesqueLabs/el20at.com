[[comments]]
order = 0
subject = "الفخرانى - ابوة جزار متواضع فى ميت غمر - درس الطب ايام مجانية ناصر - وهو بعيد عن التمثيل"
author = "عادل حمزة"
text = "عندة ثقل دم مفرط<br />ابوة كان بيأكلة كبدة العجول اللى بيدبحها فما شاء اللة جسمة اشبة ب<br />انما زواجة من مسيحية فهذا هو المقرف - لية - قلة مسلمات - ما المسيحى يتزوج مسيحية والمسلم مسلمة - لية الخليط<br />وبعدين ليس عندة موهبة ولكنة يفرض نفسة برخامة على الناس<br />واذا كان قد فشل طبيبا وفشل ممثلا يبقى يرجع يشتغل جزار فى دكان ابوة"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062515/http://masr.20at.com:80/newArticle.php?sid=17574"

[[comments]]
order = 1
subject = "نجم مصر الأول يا فخراني"
author = "محمد الفرماوي - صحفي مصري"
text = "حبيبي يا فخراني ، ربنا يباركلك ويزيدك حب الناس ، وقمة الأخلاق ما تفعله زوجتك معك والعكس<br />شكراً لعشرينات وللزميله مروة علي هذا اللقاء القوي ."
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062515/http://masr.20at.com:80/newArticle.php?sid=17574"

[[comments]]
order = 2
subject = "خريج كلية الطب ويشتمل ممثل عجيبة والله"
author = "مش شريف الدواخلي ولا البرائ اشرف ولا عبدالله الطحاوي"
text = "خريج كلية الطب ويشتغل ممثل<br />طيب ليه خريج معهد التمثيل ما يشتغلش دكتور"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062515/http://masr.20at.com:80/newArticle.php?sid=17574"

[[comments]]
order = 3
subject = "ليه؟.... ليه؟.... ليه؟......"
text = "ليه الدكتور يشتغل ممثل لكن الممثل ما يشتغلش دكتور؟؟؟؟؟<br />ليه المحامي يشتغل صحفي لكن الصحفي ما يشتغلش محامي.....<br />ليه المحاسب يشتغل واعظ..... لكن الواعظ ما يشتغلش محاسب<br />ليه........ ليه......... ليه......."
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062515/http://masr.20at.com:80/newArticle.php?sid=17574"
