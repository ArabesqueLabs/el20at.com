[[comments]]
order = 0
subject = "صحف الحزب الوطنى وليست صحف قومية"
author = "دكتور كحة"
posted = "2009-03-19"
text = "هى مش صحف قومية - لانها الناطق الرسمى باسم الحزب الوطنى<br />وبعدين مجلة زى صباح الخير او مجلة اكتوير او اخر ساعة او روز اليوسف كل مجلة بتوزع 3 الاف عدد فى دولة 80 مليون<br />تصور لما مجلة بتوزع 3 الاف عدد فى الدولة كلها تبقى لزومها اية<br />اهدار مال الشعب على الفاضى<br />شوية مرتزقة يتعيشون من ورائها<br />ما فائدتها للدولة والنظام والشعب<br />3 الاف عدد بس<br />اغلقوها يرحمكم اللة<br />ولا داعى لاهدار فلوس الشعب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "وزارة وصحافة التوريث"
author = "4-45-67="
posted = "2009-03-19"
text = "تم اختيار الوزارة المناسبة للتوريث - فلا يطمع احد فى اى تغيير - فهم مختارين بعناية فائقة لتنفيذ عملية التوريث<br />وكذلك رؤساء التحرير الجدد فكلهم من الحزب الوطنى وكلهم من دعاة التوريث والمؤيدون لة<br />اكتمل المسرح واطفئت الانوار<br />وستبدأ بعد قليل المسرحية البايخة مسرحية التوريث"
archived = "2010-03-14"
