subject = "بصو في الصورة كويس"
author = "مش لازم"
posted = "2008-04-29"
text = "الراجل من تحت والست من فوق<br />على ما يبدو ان هو دا مستقبل الرجالة في مصر<br />انهم حيبقوا تحت النسوان"
