[[comments]]
order = 1
subject = "شم النسيم عيدالاخوة المسيحيين وبقى جزءمهم من تقالي"
author = "سبيط باشا القرموطى"
posted = "2008-04-29"
text = "اهنى اخواننا المسيحيين فى مصر والعالم كلة بعيد القبامة واهنى كل مصر على التهام الفسيخ وتوابعة ويارب تجعل ايامنا اعياد وافراح وتفرحنا بخلع الحكومة المريضة دى اللى مش قادرة تعمل اى حاجة لمكافحة الغلاءالفاحش وبهدلة الناس وفى الاخر اهدى دكتور نظيف وحكومتة فسيخ مش نظيف"
archived = "2008-05-01"
capture_url = "https://web.archive.org/web/20080501153415/http://masr.20at.com:80/newArticle.php?sid=15490"
