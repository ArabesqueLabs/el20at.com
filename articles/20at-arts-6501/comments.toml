[[comments]]
order = 0
subject = "ما بين القران والأغاني.."
author = "شرين منصور..معلقة دائما.."
posted = "2007-06-30"
text = "السلام عليكم،أستاذة دعاء أنا وحدة كنت عايشة في الامارات وكل اللي كانوا قاعدين واللي قاعدين هناك عارفين مين هو الشيخ زايد رحمة الله عليه كنا بنقول عليه الوالد على فكرة وفاة كانت نكسة بجد لينا فقنا بعد فترة طويلة كان من الطبيعي كل القنوات توقف بثها وتذيع قران لأنو مينفعش لأن الوطن العربي حتى الغربي حزن عليه حزن شديد جدااااااااااااااااااااااا وعلى فكرة قنوات الامارات سواء في حالات الوفاة ولا لأ بيفتحوا قران ده اللي متابع كويس حيعرف اللي بقولو ده أما عن اللي حصل ووقف بث اغاني وافلام قنوات ميلودي ده طبيعي جدااااااا ولو معملوش كدة كنت احتقرتهم وانا على ما أعتقد كنتي انتي برضو حتقريهم لأن اللي مات ده والد الأستاذ جمال مروان مينفعش يفضلو يبثوا أغاني ده والدو يا استاذة دعاء ومعلش الواحد مش حيموت لو القناة وقفت بث الأغاني مهو زي ما الجمهور ليه الحق برضو الوسيلة ليها الحق على الجمهور والمفروض انهم يقدروا ومعلش دي متاجرة بالقران ولا بالله أعوذ بالله اللي فعلا بتعمل كدة هي القنوات اللي اتفتحت باسم المعالجة بالقران ..وبعدين رد فعل طبيعي ان لما حد بيموت بيشتغل القران وخاصة في الزعماء والقادة دي حاجة ،مع احترامي للأخت اللي كان عيد ميلادها كل سنة وانتي طيبة بس يعني وفرتي في الدي جي واعتمدتي على ميلودي مهو اللي خلق ميلودي خلق غيرها مزيكا zoom وقنوات روتانا حتى لو مفيش ما فيه اختراع اسمو كاسيت أو dvd فحاجة غير مقنعة بالمرة مع احترامي للأستاذ الجامعي وليكي دي مش ظاهرة وعلى فكرة الموضوع ده من زمااااااان اويي لما حد من القادة بيموت القران هو بث كل القنوات..واللي حصل مش موضى ده واجب ده وضع من زمااااااااااااااااااااااااااااان اويييييييييييي.."
archived = "2010-03-14"
