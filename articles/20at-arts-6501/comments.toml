[[comments]]
order = 3
subject = "شي طبيعي"
author = "فطيم"
posted = "2007-12-02"
text = "أولاً: ظاهرة الحداد ليست (بالموضه)..<br />ثانياً: طبيعي عندما يتوفى اي قائد عربي يجب ان يذاع القرآن . سؤال: مثلا الدولة كلها حزينه على وفاة القائد و انتي تريدين سماع الاغاني او مشاهدة المسلسلات؟ ..( صدق ما عندج سالفه ) ...<br />ثالثا: صاحب قناة ميلودي من حقه انا يذيع القرآن ، سؤال: لاسمح الله اذا توفي والدك لاسمح الله ، لا سمح الله وكانت لديك قناة اغاني ، ستكملين البث و ترضين المشاهد التافه ، ام تذيعين القرآن و تحترمين الذي توفي و ترضيــن اللـــــه ؟<br />رابعاً: نحن مسلمين يعني اذا توفي شخص يجب ان ندعو له بالرحمه حتى لو انه لا يقرب لنا نحن مسلمين كلنا اخوان بعض<br />يجب ان تقدرون ظروف الشخص و تواسونه ... لكني قرأت العكس تماما ، واحد يقول : ( يفرضوا علينا الحزن ) و الثانه منحرجه امام صديقاتها و الثالث يقول : ( اشركنا معه بالعافيه بحياته الشخصيه و حزنه ) !!!!! كلام غير منطقي كلام ليس له معنى..<br />خامسا: اني اوافق على كلام يوسف علي .. كلامه منطقي قليلا..<br />سادسا:اعقب علا كلام العالم . هـل المشاهد اهم من الله و الاب و الوالدين و الاهل ...! مستحييل ..<br />أخيرا:هذا الموضوع غيرمدروس جيدا ...مع احترامي ... من الافضل انا تاخذي راي الطرفين وبعد ذلك اطرحي الموضوع ..."
