subject = "الى الست علياء ابو شهبة"
author = "سنقر"
posted = "2008-09-11"
text = "هناك فئات كثيرة من الموظفين الغلابة اللى بيخدموا الناس بيفطروا فى مكان عملهم ومعندهمش امكانيات ولا بدلات نجوم ماسبيروا<br />هناك العمال والمهندسين فى محطات المياة ومحطات توليد الكهرباء وبتوع اقسام الطوارىء فى المستشفيات والاسعاف<br />وهناك سائقى المترو والقطارات<br />هناك موظفوا مطار القاهرة والعاملين فى الرادار وتنظيم صعود واقلاع الطائرات وهبوطها<br />هناك الوردية المسائية فى كل المصانع<br />هؤلاء هم شعبنا وهم الذين يسيرون حياتنا<br />انما نجوم ماسبيروا اللى بياخدوا بدلات بالشىء الفلانى وبيصرفوا ملايين على اللبس والمكياج فنحن نعرف انهم يتاولون افطار قادم من فنادق 5 نجوم والا هييجى لها تلبك معوى وهتقعد قدجام الشاشة متيسة"
archived = "2010-03-14"
