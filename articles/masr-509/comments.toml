[[comments]]
order = 25
subject = "انتقام واضعي الأمتحانات من الطلبة المعذبين في الأر"
author = "طالبة مقهورة من الأمتحان و تعب"
posted = "2008-06-10"
text = "الأمتحان كان شديد الصعوبة و رغم أني مكنتش بنقص في أي أمتحان رياضة قبل كدة مقدرتش أحله و الأمتحان كان صعب و غير مباشر و يحتاج وقت طويل و الصفحات اللي مكتوبه فوق دي ملهاش علاقة بالأمتحان علي الإطلاق<br />ليلة الأمتحان لوحدها حليت فوق الـ 300 مسئلة صعبة و سهلة والأمتحان مختلف خالص عنهم<br />هما عايزين يعقدونا ولا يخلصوا مننا ولا إية بالظبط أحنا عملنا إيه في دنيتنا عشان يحصل فينا كل دا<br />حسبي الله و نعم الوكيل فيهم ربنا ينتقم منهم جميعا خصوصا الكائن الحي اللي حط الأمتحان<br />ثم ان السؤال \\\"الخامس ب\\\" شكله ناقص الزوايا أصلا<br />حسبي الله و نعم الوكيل ..... هي موتة ولا أكتر ضيعوا مستقبلنا اللهي يحرق قلبهم علي عيالهم زي ما حرقوا قلب أهالينا"
archived = "2010-03-14"
capture_url = ""

