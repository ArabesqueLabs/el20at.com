author = "الطريق الى الجامعات الخاصة"
posted = "2008-06-10"
text = "لم اشهد من قبل هذا الكم من الاحباط لدى الطلبة ...فى البداية ظننت ان هناك تقصيرا من ابنى ....ولكن بعد مراجعة المدرسين ادركت ان مثل هذا الامتحان هو اعاقة للطلبة ...حتى تقل نسب النجاح ويتجة اولياء الامور الى الجامعات والمعاهد الخاصة....اما الغلابة فليذهبو الى الجحيم....حسبنا الله ونعم الوكيل...كيف يمكن ان تنتج بلادنا نوابغ والحكومة تحاربهم تارة بالدروس الخصوصية ...وتارة بالاستهزاء بهم بهذة الامتحانات الهزلية<br />قولو معى حسبنا الله ونعم الوكيل"
