text = "الحمد للة على نعمة الكثيرة ولا يحرمنا من الهبل والخبل والزهايمر والتوهان<br />تفتح القناة الاولى تلاقيهم بيتكلموا عن الكرة والراقصات والفنانات - تقلب على الراديو تلاقيهم بيتكلموا عن الكابتن حسن شحاتة - تروح دريم تلاقى اهداف حسن شحاتة<br />اصل المنتخب هيكسب كاس الامم الافريقية وبالكاس دة هنحل مشاكل الفقر والمرض والبطالة وكل مشاكل مصر<br />ربنا لا تحرمنا من الهبل"
