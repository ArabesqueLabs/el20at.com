[[comments]]
order = 0
subject = "ضع عنوان التعليق"
text = "بصراحة موضوع اكتر من رائع و جهد مشكور لكاتبة الموضوع اعمالك اكتر من رائعة<br />فهذا الجهد اراه اعز من عيني<br />و على استعداد ان أضحي بسنيني من اجل ابراز نماذج كهذه لتأكل الجو و تلفت نظر الشباب"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707010601/http://masr.20at.com:80/newArticle.php?sid=10916"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
text = "و الله شئ جميل ان واحدة تضحي بعمرها عشان تربي اخواتها بس اكيد احساس صعب انها عاشة من غر جواز"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707010601/http://masr.20at.com:80/newArticle.php?sid=10916"
