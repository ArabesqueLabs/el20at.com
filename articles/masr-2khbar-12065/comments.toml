posted = "2009-05-14"
text = ":lol: :oops: :-x<br />الخبراء عايزين يفحصوا اوباما من انفلونزا الخنازير -- رائع -- هما مين الخبراء دول -<br />الاخ الاصفر اللى عندة انيميا حادة وفقر دم وانكلستوما متوطنة وبلهارسيا مزمنة عايز يفحص اوباما<br />هما الخبراء فاكرين ان اوباما دة مثلا الاخ ابو مازن اللى قاطع اشتراك فى الشرم<br />يقدر الخبراء دول يهوبوا جنب سور السفارة الامريكية فى القاهرة<br />دة لو عسكرى مارين زغر فى وش مصر هتقف مصر كلها على رجل واحدة ووشها فى الحيط<br />تحت الشجر يا وهيبة يا ما كلنا برتقال<br />هو الكلام بفلوس - خليهم يهجصوا وان شاء اللة لو شم خبر ان المصريين عايزين يفحصوة هيبعت القاذفات الاستراتيجية تموت شوية الحشرات دى زى ما عمل فى العراق<br />اصل صدام رسم صورة ابو بوش على الارض قدام الفندق وخللى الناس تدوس علية بالجزمة - والنتيجة انهم علقوة من بيضا_________<br />ابقوا روحوا افحصوا اوباما"
