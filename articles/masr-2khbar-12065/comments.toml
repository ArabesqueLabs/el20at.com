text = "وطبعا لما ييجى فى جو التلوث والسحابة السوداء وياكل لحم الحمير والكلاب والقمح المخصص لعلف الحيوانات - يا خوفى لتيجى عدوى لة فى مخة ويصاب بالتبلد والجمود الحسى ويرجع يودى امريكا فى داهية وبدل الازمة المالية بس هناك يمكن يفكر يبيع مصانع البلد وارضها الصحراوية لمثتثمر روسى رئيسى ويعطى مصانع الحديد لواحد محتكر يوقف حركة العمران فى امريكا<br />نصيحة للاخوة الامريكان يبقوا يكشفوا على مخ اوباما قبل ما يرجع ليكون لقط العدوى من هنا<br />اة يا امة ضحكت من جهلها الامم"
