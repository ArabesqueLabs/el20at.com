author = "اوباما فى القاهرة"
posted = "2009-05-15"
text = "ماذا يقصد اوباما من خطابة بالقاهرة ؟ هل يقصد مصلحة العرب والمسلمين ؟ كلا والف كلا<br />يقصد مصلحة امريكا اولا - واصلاح اخطاء الغبى بوش الذى رفع راية الحرب الصليبية واوقع بلادة فى ازمة مالية طاحنة كادت ان تفكك الولايات المتحدة الامريكية بسبب حروبة الغبية وعدائة المطلق للاسلام<br />كانت فترة حكم بوش فترة ازدهار لدول الخليج اذ انة بتعنتة فى مصادرة بعض رؤوس الاموال بتهمة تمويل الارهاب وامداد جماعات ارهابية بالدعم المالى ان امتنع اهل الخليج عن ايداع اموالهم فى بنوك امريكية وبنوا بها ابراج سكنية فى دبى وابوظبى والرياض والدوحة ابراج اعلى من ابراج امريكا - ويكفى انة اصبح فى دبى اعلى برج فى العالم واعلى من اى برج فى امريكا<br />اوباما يريد ان تعود تلك الاموال الى البنوك الامريكية<br />الطلبة السعوديون والخليجيون تجاوز عددهم فى الجامعات الامريكية اكثر من اربعين الفا طالب كانوا يمثلون الدعامة الرئيسية لتمويل تلك الجامعات بالمصاريف التى يدفعونها لتلك الجامعات تحولوا الى جامعات شرق اسيا واستراليا واوروبا نتيجة التعنت فى التفتيش فى المطارات وتهم الارهاب لاى ملتحى او مسلم<br />اوباما يريد عودة كا اولئك"
archived = "2010-03-14"
