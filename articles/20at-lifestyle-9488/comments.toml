subject = "شكرا فريق عشرينات"
author = "اكتب اسمك هنا"
posted = "2008-07-05"
text = "أولا أنا بشكر كل فريق موقع عشرينات على الموضوعات المتنوعه والمتميزه جدا اللي بيقدموها<br />ثانيا بجد الكتاب رائع جدا وأسلوبه عملي لكي نكتشف قدراتنا وأهدافنا في الحياه<br />ثالثا من فضلكم نريد المزيد من الموضوعات الخاصه بالتنميه الذاتيه لأننا دائما في حاجه لمثل هذه الموضوعات وكمان عرض المزيد من الكتب<br />وبشكركم على كل اللي بتقدموه مع تمنياتي لكم بالمزيد من النجاح"
