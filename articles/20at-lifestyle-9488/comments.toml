subject = "ماهي الدوافع"
author = "natali"
posted = "2008-07-26"
text = "أنبهر كثيرا بكتابات أنتوني روبنز و أحب أن أجربها و أعيشها لكن في كل مرّة أصطدم بالواقع الذي يجعلك رغما عنك تفكر بأشياء سلبية كثيرا ما تدفعك إلى التخلي عن أفكارك الإيجابية التي تطمح لأن تنميها فيك_هناك سؤال آخر ماهي الدوافع الحقيقية التي تجعلك تتغيّر و إذا كانت قوّية و صادقة لماذا نفشل؟"
