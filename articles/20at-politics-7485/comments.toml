subject = ""
author = "egypt"
posted = "2009-05-30"
text = "ليبيا بتكلم عن الرجولة طب حد غيرهم يتكلم عن ذلك<br />اهنا مش حيوانات لو احنا حيوانات مكوناش انقذناقكم من الايطالين و الكويت من العراقيين لكن احنا تعودنا من العرب احنا نحارب و انتم تنسوا الجميل علي العموم احنا اجدع و ده عشان خاطر الاسلام و العروبة مش عشان خاطر الجهلة و اي خطر احنا هنشيل الليلة و شكرا لاي دولة تحتلام المصريين لانهم دولة محترمة مش شبع بعد جوع ما هو تاريخ ليبيا في الحروب و الكويت والله لولا المصريين ما استضفوكم ايام الحروب [الكويت او الفلسطنين او العراق او ليبيا]<br />لكن الكبير الكبير هيفضل طول عمرة كبير حتي لو الصغير خلط عشان كدة هو كبير<br />كبير بالدين بالعلم بالجيش بكل شي بالرجالة<br />يكفي حديث رسول الله لعمرو ابن العاصي ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />ان فتحتوا مصر اتخذوا منها جندا فقال لماذا يا رسول الله قال لانهم في رباط ليوم الدين هذه شهادة من رسول الله صلي الله و عليه و سلم . و الحمد لله بدون فخر احنا اصحاب انصارات عديدة بدون مساعدة من اي ؟؟؟ و التاريخ يذكر ذلك ؟؟؟"
archived = "2010-03-14"
