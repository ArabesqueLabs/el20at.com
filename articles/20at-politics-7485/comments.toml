[[comments]]
order = 6
subject = "يا والله مصريين"
author = "ولد بلادى"
posted = "2008-01-13"
text = "بسم الله الرحما الرحيم<br />والله العضيم عيب عليك انتا وياه<br />اول حاجه المصاروه كلام لا غير والدليل انت وياه قاعد فى بيتك<br />ورا الكيبورد وتسب فى ناس لا تعرفك ولا تعرفها<br />انتو ما تعرفو المصريين فى ليبيا كيف والله فيه مصرين اعرفهم<br />شخصيا هارب من قضيه وجاى لليبيا يعنى مجرم<br />وياكل عيش فى ليبيا وعندما يرجع الى بلده يقول انا اليبيي عاملونا<br />معامله زفته ليش لكى المصرى الى ما يعرف اليبيين ما يفكر يجى ليبيا<br />وياكل عيش والدليل لو المعامل زفته كا كل المصريين رجعو الى مصر<br />والى يقول اضربو اليبين فى الاسكدريه نقوله خودبالك اليبين احرار يمكن يروح فيها راسك<br />والى ما يدر على الشى ما يعمله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "ربنا مايرضاش بالظلم"
author = "احب متغرب"
posted = "2008-02-21"
text = "مين يرضى بالظلم ده<br />مين يرضى بالذل ده انسان كتب له القدر انه يتغرب بعيد عن وطنه واهله وناسه علشان يبحث عن مصدر رزق<br />اللى الدولة وبلده مش مكيفاله شغل او فيه شغل بس شوفه المرتبات بلاش المرتبات شوفوا الاسعار ارتفعت ازاى<br />طيب اييييييه الى بيحصل ده والمصريين هيفضلوا ساكتين لحد امتى بس شاطرين بس يتفرجوا عالكورة وصوتهم يعلى اد كده فين صوتك يارجال وشباب مصر ليه ساكتين على غلو الاسعااار وضعف المرتبات وغير وفرة اعمال كافيه للمصريين<br />ماشى نقول الناس كترت والحوارات بتاعه البلد دى اوكى سيبوهم يشوفوا اكل عيشهم بقا فى اى بلد<br />من غير اهانات وتجريح هما فاكرين اننا مش هنعيش غير بيهم لا لينا رب اسمه الكريم<br />وحسبى الله ونعم الوكيل فى كل ظالم مستعبد<br />ربنا يجيب اخواتنا واحبابنا من كل بلد يعيش هنا بكرامته فين ايامك ياجمال ياعبد الناصر<br />فييييييين مكنش مخلى اى مصرى مهزوز<br />ربنا ينتقم من الظلمة واللى سارقين البلد ومشردين اولادها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "حان وقت القصاص من القذافي جزاءا لاهانته المصريين"
author = "خليل المصري"
posted = "2008-03-04"
text = "من قبل أمر القذافي بقذف العمال المصريين من السيارات القلابة العملاقة خارج الحدود في الصحراء كما تقذف الحجارة دون اعتبار لآدمية المصري مما ادي الي كسر عظام كثسر منهم والله العطيم لو فعلها هذا الوغد الشيطان في كلاب لتحركت جمعيات حقوق الحيوان في المحافل الدولية وللأسف الشديد اكتفت الخارجية المصرية بالصمت المهين ولكن الله عزيز ذو انتقام فسلط علي الشعب الليبي من يقذف الإيدز في دماء اطفالهم , وليعلم القذافي الذي وصفه الملك العظيم ادريس السنوسى عندما تظاهر ضده الغوغاء الليبين المؤيدين لثورة الفاتح المشئومة فقال لهم \" سلط الله عليكم شيطانا \" وقد اقسمت رابطة ضحايا المصريين الذين قذفهم القذافي خارج الحدود يأن يقتلوا هذا الشيطان وقد اقترب أوان تنفيذ هذا الوعيد من مجموعة شاركت في حرب السادس من اكتوبر المجيدة التي ساهمت في ملأ خزائن القذافي التي بعثرها في مغامراته اللعينة وسيأتيه ساعة القصاص بغتة ومن حيث لا يحتسب ولن تستطيع مخابراته ولا مخابرات مصر حمايته من القدر المحتوم جزاءا لاهانته المواطن المصري وترقبوا قريبا جدا"
archived = "2010-03-14"
capture_url = ""

