subject = "من خرج من داره"
author = "hamada"
posted = "2007-10-30"
text = "المفروض المعاملة تكون بالمثل<br />عندنا في إسكندرية الليبيين ليهم حقوق كتيرة و آخرها إنهم بيمشوا بعرباتهم بنمرها الليبية من غير وضع لوحة جمرك عليها<br />و المصريين بيعاملوهم آخر إحترام<br />و محدش منهم إشتكي مننا أبدا هنا في إسكندرية<br />وعايشيين آخر هنا و بيتفسحوا هنا و هناك ولا وراهم حاجة<br />أما بقي المصريين رايحين يأكلوا عيشهم و يبنوا لهم بلد بحق و حقيقي ده جزاتهم يتبهدلوا و يتمرمطوا<br />مكانش العشم يا ولاد الجدافي"
