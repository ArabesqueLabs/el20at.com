subject = "مكنش العشم يا براميل الجاز"
author = "ميدو"
posted = "2007-10-31"
text = "عندك حق يا كابتن ياللى فوقى انا اقعد فى بلدى بكرامتى بعيد عن كلاب ليبيا والخليج<br />ونرجع ونقول اذا كان المصرى ملوش قيمة جوه بلده هيبقى ليه بره<br />ونيبجى على آخر الزمن نتهان من براميل الجاز (البترول) ليبيا والكويت والسعودية وقطر والامارات والاردن بلاد كانت تحت ودلوقت بالبترول والمعونات بقوا فووووووووووق<br />ربنا ينتقم منك يا زعيم انت وحكومتك"
