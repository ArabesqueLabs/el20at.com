subject = ""
author = "ليبي حره"
posted = "2009-05-22"
text = "ايهاء المصريين الحيونات يا من قال فيكم عمر ابن العاص انكم نسائكم طرب ورجالكم مع من غلب طول عمري وانا اعرف ان اصدق مصري كداب وان زبالة الشعوب هي الشعب المصري شعب تعوده علي الخيانه والعش انهم بهائم في كل شي مصر بلد عمادها العش والرشوه والمصرين علي شان الفلوس يفرط حتى في عرضه هذا لو كان عندهم شرف وعرض بصراحه شعب خالي من النخوه والشرف وشعب الاميه تسود معظم افراده وبناتهم اشهر من نار علي علم في الدعره علاش ما تمشوا تكلموا الكويت الدين يعاملوا في المصريين معامله اقل من معاملة الحيونات الي درجة ان الكويتين يعملوا في الهندود احسن من المصريين وصح للكويتين لانهم يعروفوا كيف يعملوا الكلاب المصرين من وين صارت ليبيا وليبيا تقدم في المعونات الماليه لمصر وللمصريين ويريته تامر فيهم صدق من قال اذا اكرمة الكريم ملكته وان اكرمة اللئيم تمردا ..وصدقوني ما في امسخ واحقر وازفت من الشعب المصري الجبان باع كل قضايا العرب والمسلمين تفيه عليكم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
