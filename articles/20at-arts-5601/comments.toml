text = "انا شايفه ان روبى الاحتشلم و روبى التعرى وجهان لعمله واحده و هى انسانه اسمها روبى<br />بمعنى ان روبى ليست و لن تكون مطربه و لكنها مؤديه جيده لا يستطيع احدنا ان ينكر انه رغم تحفظه عليها الا انها اجبرتنا على الاستماع لمعظم اغانيها ان لم تكن كلها لانها فعلا واخده خط معين و بتتعامل مع ملحنين و كتاب معينين تقريبا ثابتين عارفين امكانياتها كويس و موظفينها صح جدا<br />علشان كدا سواء هتستمر ف الاحتشام او هترجع ريمه لعادتها القديمه واحد<br />و ممكن ف حاله عودتها اننا نسمع اغانيها اوديو من غير ما نتفرج على الكليبات"
