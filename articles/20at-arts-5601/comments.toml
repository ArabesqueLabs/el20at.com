text = "اغنية روبى جميلة جدا ولكن ؟؟؟؟؟؟؟؟؟؟؟<br />اية بقى الست روبى صوتها تعبان وفية مواهب اهم من صوتها كتير قوى واغنيتها دى فكرتنى بمحاولة عمرو دياب من شريطين برضة جميلة لكن فاشلة<br />من الاخر ياست روبى انتى مش بتغنى علشان سواد عيونا انتى اساسا بتغنى علشان الشهرة والفلوس عاوز اقوللك انى بحب فيكى ملامحك الشرقية لكن انتى دلوقتى بتاخدى مجهود ناس عندها موهبة مش انتى وبس وكل اللى بيحاولوا زيك الكلام دة غير اللبنانيات العريات دول حاجة تانية العن<br />اية رايك ياست روبى تقدمى برامج ولا تعملى افلام وتسيبى الغناء للاصوات القادرة<br />ولا اقوللك انتى حرة"
