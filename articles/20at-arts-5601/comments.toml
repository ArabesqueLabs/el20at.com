[[comments]]
order = 6
subject = "منهم تأتي الهزيمة !!"
author = "طيف بدر"
posted = "2007-04-27"
text = "أولا : أستغرب من عشرينات تشويهها للعلماء و الفقهاء و الدعاة و اتخاذهم مادة للسخرية بينما في نفس الوقت تعلي من قيم المخنثين و الساقطات<br />ثانيا : أذكر المعلقين بواقعة يذكرها أحد الفرنسويين أثناء غزو الأندلس موجودة في دار المحفوظات الفرنسية بالعاصمة باريس \"ذهبت إلى غرناطة لاستطلاع أوضاع العرب تمهيدا لشن هجوم شامل عليهم فمررت بحديقة وجدت فيها مجموعة من الطلبة يتدارسون الطب ثم وجدت صبيا معه قوس يبكي فسألته ما يبكيك فقال : أبي يستطيع أن يسقط عشرة عواميد بضربة قوس واحدة بينما أنا أسقط أربعة فقط ... فرجعت إلى فرنسا و أقررت بعدم إمكانية غزو الأندلس و محاربة العرب...\" ثم مرت 20 عاما و ذهب الفرنسي إلى غرناطة فوجد في نفس الحديقة عشاقا يتطارحون الهوى و الغرام تحت الأشجار و وجد الصبية و الصبيات يتجمعون حول ضارب للعود و شكله للأنثى أقرب من الذكر \" ... و كانت هذه هي فرصة فرنسا الذهبية...\" و من هنا بدأ ضياع الأندلس إمارة تتلوها إمارة .<br />ثالثا : الأخ مجدي كامل ... إذا كان الأخ عبد الله \"بينرفذك \" فلماذا لا تكون أنت \"تنرفذني \" عندما تقول :\" على فكرة الموضوعات اللى مش عاجبة سيادتك زى رويبى وغيرة اهم مهمة جدا لانها بتشكل وجدان جيل\" ألا تشعر بالعار أن يشكل المطربون و المطربات وجداننا و عقولنا ... أي رقي و تقدم و تحضر نرنو إليه إذا ؟! هل روبي أهم من أقصانا الأسير و العراق المظلوم المحتل و الدم المسلم المسفوك في شرق الأرض و مغربها ؟ إني أتساءل هل نحن أتباع محمد (صلى الله عليه و آله و سلم ) ؟ هل نحن ننتمي إلى أبي بكر و عمر و عثمان و علي (رضوان الله عليهم) ؟؟ إذا اغتصبت أختك و هتك عرض أمك و سرق هاتفك المحمول ... هل تكون روبي اهم من أمك و أختك و تليفونك حينئذ ؟؟<br />رابعا : يقول المستشرق الفرنسي (شاتلي) في كتابه \"غزوالعالم الإسلامي\" صــ 264 بالنص المترجم : \"إذا أردتم غزو الإسلام وتحطيم شوكته والقضاء على عقيدته التي أتت على كل العقائد السابقة واللاحقة، والتي كانت السبب الأول والرئيس لاعتزاز المسلمين وشموخهم وسيادتهم وغزوهم للعالم، فعليكم أن توجهوا جهودكم إلى هدم نفوس الشباب المسلم والأمة الإسلاميّة بإماتة روح الاعتزاز بماضيهم وتاريخهم وكتابهم القرآن، وتحويلهم عن كل ذلك بواسطة نشر ثقافتكم وتاريخكم، ونشر روح الإباحية، وتوفير عوامل الهدم المعنوي\" ... ألا ترى أن( شاتلي ) قد نجح معك فيما أراد ؟<br />خامسا : يقول الله تعالى في كتابه : \" ونفس وما سواها فألهمها فجورها و تقواها . قد أفلح من زكاها و قد خاب من دساها\"<br />سادسا : و الله غني احبك و أتمنى لك الخير و لا احمل ناحيتك أي شر و بارك الله فيك<br />رجاء الاطلاع على سلسلة المقالات التالية بعنوان \"انقلابيات\"<br />http://alayasser.maktoobblog.com/?cat=24705"
archived = "2010-03-14"
