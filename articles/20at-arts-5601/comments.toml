order = 1
subject = "روبي بين البدلة الكلاسيك والمايوه؟؟؟"
author = "شرين منصور"
posted = "2007-04-26"
text = "السلام عليكم روبي انسانة لها صوت قوي جداااا وليها جمهور محدش يختلف على كدة انا عن نفسي بالرغم التحفظات على روبي من كل النواحي الا انني متتبعة لأغاني روبي، اغاني ليها طابع مختلف مميز بالرغم برضو ان ليها اغاني ليها ايحاءات لكن المهم أن اغلب الالبوم بيبقى حلو ،اما يا استاذ محمود عن الكليب اللي نزل هو نزل بالشكل اللي يليق ببرنامج كبير وهو البيت بيتك والاغنية دي مجرد اهداء منو لمحبي روبي اما عن السر الله اعلم بس متهيالي ان رد على ما تردد في الاونةالاخيرة من اعتزالها وارتدائها الحجاب متهيألي انو رد اخرس الجميع وجعل كل من يحاول المزايدة على الشائعة ان يتراجع اما عن الاغنية الاغنية دي قديمة جداااااااا مش جديدة واللي كاتبها تقريبا على ما اتذكر شاعر قديم وهو متوفي وده طبعا باين جدااااا بصراحة دي المعلومات اللي عندي عن الاغنية مش عارفة صح ولا غلط ،اما عن الاحتشام بنقول يارب يكون دايم بس ارجع واقول ان سبب البدلة الكلاسيك هو برنامج البيت بيتك اما عن المايوه برغم اني مش موافقة بس بقول برضو ان طالما ان في نطاق اعلان تسويقي للمصنع او الشركة المصنعة للمايوه يبقى خلاص الاعلان مشروع انما لو كان اعلان حاجة تانية وهي لابسة المايوه يبقى الوضع يتغير على العموم زي ما قال الاستاذ حلمي بكر الايام الايام اللي جاية هي اللي حتثبت صحة الخبر وهي برضو اللي حتثبت هل اتجهت روبي لطريق الاحتشام ومراعاة الشباب ام انها لاتزال مقيدة ومغرومة بفكرة الاغراء؟؟الله اعلم"
