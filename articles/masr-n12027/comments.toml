[[comments]]
order = 1
subject = "هههههههههههههههههههههههههههه .. شلتو الي كتبتو  ؟؟"
author = "انسان .. الاردن"
posted = "2007-10-24"
text = "السلام عليكم ورحمة الله وبركاته ،،،<br />بعد السلام ... ههههه .. يعني انا استغربت لما ماشفت تعليقي ع الموضوع .. ليش شلتوووه .. مش عيب عليكو ؟؟!!<br />ولا لانو الحقيقة بتزعل وبتجرح .. بس هاذ احنا العرب هاذ اللي فالحين فيه . وغيرو لأ<br />ع العموم .. كل الشكر لإلكو ياموقع عشرينات ... انكو مسحتو تعليقي اللي انا كتبتو .. وهذا ان دل ع اشي بدل ع احترامكو<br />.. ولكو ياللي عاملين حالكو ناس محترمين ( موقع عشرينات ) .. والله عيييييييييييييييييب .. ترى هسه انا عرفت .. الظاهر انكو ناس جبنا وقلييلين مروه .. شكراًمره ثاااااااااااااانيه .. والله ونعم الإحترام والتقدير ؟؟!!"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025044127/http://masr.20at.com:80/newArticle.php?sid=12027"

