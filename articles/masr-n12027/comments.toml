posted = "2007-11-02"
text = "انا برضو عم تنشالي تعليقات<br />شو في يا عشرينات مش عوايدكم يا ترى في خلل بالموقع و الا انتو مش حابين مشاركات خارجية؟<br />يا ريت حدا يرد عشان ما نغلبش حالنا بعد هيك<br />و نوفا و النبي لو حيمسحولنا تعلقاتنا ابقى احكيلي اقدر اتواصل معك برة هالموقع كيف؟"
archived = "2007-11-04"
