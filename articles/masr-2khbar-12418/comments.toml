text = "مطلوب تهجير القاهرة نصفها الى سيناء<br />والنصف التانى الى الواحات<br />فيى بلد عاصمتة ربع السكان وتعدادها 20 مليون<br />مطلوب تهجير مصر الى الصحراء<br />فى قريتى وصل ثمن متر البناء فى القرية 7 الاف جنية<br />تصور المتر فى القرية وصل سبعة الاف جنية"
