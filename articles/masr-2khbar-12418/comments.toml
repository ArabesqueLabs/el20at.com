text = "وطبق على نفسك اولا يا نور وكل واحد يرجع الى الخرابة اللى جاى منها<br />ارجع انت يا نور اولا الى بلدك فى المنصورة<br />وكل واحد جاى من مصيبة يرجع اليها<br />واللى هتبقوا كلكم من مصر الجديدة"
