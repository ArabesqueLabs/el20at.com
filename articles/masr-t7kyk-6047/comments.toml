subject = "من حقهم ممارسة شعائرهم في حمايتنا"
author = "مصرية مسلمة"
posted = "2007-06-04"
text = "علي حد علمي: عندما دخل عمرو بن العاص مصر، كان من اول شروطه ان يمارس المسيحيون عقائدهم بحرية في حمايه المسلمين، بل ومشاركتهم في افراحهم واحزانهم لانهم مواطنين،وكل المسلمين يأسف علي ما يفعله الجاهلون،بل ونطالب بمحاكمتهم."
