[[comments]]
order = 4
subject = "ماذا يريد الاقباط"
author = "احدي المسلمات"
posted = "2007-06-04"
text = "ايريد الاقباط ان يرئسوا بلد تعداد مسلمينها اكثر بكثير من الاقباط، اني لا اؤيد ما حدث،ولكن اشعر ان الاقباط يشعللون الموقف لكي يحصلوا علي امتيازات اكثر،مع انهم لهم حقوق المواطنة،وفي نظري ان ما حدث جريمة يعاقب عليها القانون ولابد من القانون يأتي لهم بحقوقهم علي انهم مجني عليهم وليسوا بمضطهدين،ولابد ان كل مسلم يحترم الدين الاخر ويعامله علي انه انسان قد يكون خير او غير ذلك ولا يتدخل في علاقته مع الله.مع باعغ اسفي..........ز"
archived = "2010-03-14"
