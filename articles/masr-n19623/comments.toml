author = "مش انور السادات"
posted = "2009-02-03"
text = "بصو في الصورة<br />انا فاكر انور السادات لما كان في الحكم كان كل ما يروح مشروع جديد يمسك الفاس ويضرب فيه اول ضربه<br />بالضبط زي الواد اللي في الصورة دا<br />يبقى اكيد الواد دا هو انور السادات وهو صغير"
archived = "2009-02-06"
