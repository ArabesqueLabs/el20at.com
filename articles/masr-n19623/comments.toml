[[comments]]
order = 1
subject = "رصيف صراوة.. متهالك!"
author = "مش متهالك"
posted = "2009-01-31"
text = "رصيف صراوة.. متهالك!<br />نحن أهالي كفر صراوة.. التابع لمركز أشمون.. بمحافظة المنوفية.. نعاني من تهالك رصيف السكة الحديد الموجود بالقرية.. الذي أصبح يمثل عذابا لكل من يستخدمه من الركاب.. خاصة المرضي والاطفال وكبار السن.. الذين يعانون الأمرين في صعود وهبوط القطار!هذا العذاب اليومي.. حاول الأهالي الشكوي للمسئولين ليرحموهم منه.. لكن بلا جدوي!<br />نناشد المهندس حمدي الشايب وزير النقل.. سرعة اصلاح هذا الرصيف.. رحمة بالأهالي.<br />عبد الفتاح رفاعي عبد الفتاح<br />كفر صراوة أشمون منوفية"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074913/http://masr.20at.com:80/newArticle.php?sid=19623"

[[comments]]
order = 2
subject = "مؤتمر الوحدة الحزبية بكفر صراوة مركز أشمون"
author = "مش وطني"
posted = "2009-01-31"
text = "مؤتمر الوحدة الحزبية بكفر صراوة مركز أشمون<br />في إطار المؤتمرات للوحدات الحزبية علي مستوي محافظة المنوفية تم عقد مؤتمر الوحدة الحزبية بكفر صراوة مركز أشمون برئاسة السيد/أبو الفتوح شعبان أمين الوحدة الحزبية وبحضور أعضاء المؤتمر حيث تم مناقشة واستعراض بنود جدول الأعمال الخاصة به ، فتم إقرار الموازنة السنوية للوحدة ، ومناقشة خطة العضوية ، وقد استعرض كل من أمين أمانة نوعية خطة العمل الخاصة به في إطار الخطة العامة للوحدة ،وتم إقرارها من المؤتمر . وفي نهاية المؤتمر تم مناقشة القضايا الجماهيرية التي تخص الوحدة وكان على رأسها أزمة رغيف الخبز وعدم مطابقته للمواصفات - إرتفاع الأسعار - إنقطاع التيار الكهربي - قلة الأسمدة ."
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074913/http://masr.20at.com:80/newArticle.php?sid=19623"

[[comments]]
order = 3
subject = "صراوة وطليا في حاجة لمستشفى"
author = "مش كاتب"
posted = "2009-01-31"
text = "كتب: أحمد يوسف<br />تقدَّم أشرف بدر الدين (عضو الكتلة البرلمانية للإخوان المسلمين) بطلب إحاطةٍ إلى د.حاتم الجبلي (وزير الصحة والسكان) حول عدم وجود مستشفى بقريتي طليا وصراوة رغم وجود قرارٍ بتحويل الوحدات الصحية بهما إلى مستشفى.<br />وقال بدر الدين \"لقد تم إنفاق أكثر من مليون جنيه على وحدةٍ صحيةٍ بالقريتين، ورغم ذلك ما زالتا تعملان كوحدةٍ صحيةٍ ولا يقدم فيهما أي خدمة تتناسب مع حجم الأموال التي أُنفقت\".<br />وأكد النائب أن إنفاق مثل هذه المبالغ الطائلة دون تقديم الخدمة الصحية المطلوبة للمواطنين يعد إهدارًا للمال يستجوب المحاسبة عليه."
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074913/http://masr.20at.com:80/newArticle.php?sid=19623"

[[comments]]
order = 4
subject = "وصراوه ليه يا دعاء ما تخليها كفر مصيلحه او ميت ابو"
author = "ابومحسن"
posted = "2009-02-01"
text = "صراوه دي ما حدش يعرفها خالص<br />الناس هنا تعرف ميت ابو الكوم بلد السادات<br />وكفر مصيلحه بلد مبارك<br />وبمناسبة ميت ابو الكوم كان فيه برنامج زمان زمان بيقدمه سمير صبري اسمه النادي الدولي وبعدين استضاف رقاصه نسيت اسمها فاثناء الحمار سمير صبري قالها انتي بلدك ايه<br />فقالتلوا ميت ابو الكوم<br />فقالها بلد الريس يعني وراحوا ضاحكين<br />والبرنامج وقف بسبب ميت ابو الكوم دي"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074913/http://masr.20at.com:80/newArticle.php?sid=19623"

