subject = "صراوة التي اعرف"
author = "واحد"
posted = "2009-02-03"
text = "صراوة من اكثر قرى مصر في عدد حفاظ القران الكريم وهي بلد الشيخ شعبان الصياد رحمه الله .<br />كما ان صراوة غير كفر صراوة.<br />والغريب انه لا يوجد بها أي مسيحيين."
