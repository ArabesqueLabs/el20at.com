text = "اراد الرئيس السادات ايامها عمل حديقة حيوانات جديدة<br />فكلف خبراء عالميون لدارسة الموضوع واستمرت الدراسة للمشروع شهورا ثم عادوا الية بملخص فى سطر واحد<br />اعمل سور حوالين المنوفية"
