text = "توقعت صحيفة هأآرتس الاسرائيلية – في تقرير لها أمس – شروع تل أبيب في بناء هيكل سليمان الثالث وهدم المسجد الأقصى في ال16 من مارس المقبل.<br />وهيكل سليمان هو الهيكل أو المعبد الذي يرغب المستوطنين اليهود في بناءه في نفس الموقع الذي يقع فيه<br />الخبر دا اكيد يا جماعه؟<br />بجد عايزه اعرف"
