subject = "باكورة جهد طيبة أخ إياد"
author = "هبة الأغا"
posted = "2008-06-15"
text = "لعلي لأول مرة أقرأ لتقرير مباشر لعشرينات من غزة ..<br />أخي إياد القرا تحية لك، ولجهدك الطيب، وفي الحقيقة، وضعت يدك على الجرح، وقد كنت في فترة سابقة قد صنعت موضوعا مشابها لجهة أخرى عن الموضوع ذاته، وكانت الأوضاه بالنسبة للمقبلين على الزفاف وأصحاب المصالح المتعلقة أسوأ، فكيف بها الآن .. !!<br />في غزة يوجد المنطق واللامنطق، ولا يوجود معايير ثابتة، فيتزوج أبناؤنا في الوقت الذي تنعدم فيه أسباب الزواج ومقوماته ...<br />تحية لك، ولك أن تكتب عن \" أزواج مع وقف التنفيذ \" فكثير من العرائس في غزة تنتظر المعبر كي يخرجن للالتحاق بأزواجهن ، وعرسان ينتظرن عرائسهن من الخارج ... الخ ..<br />تحيتي مجددا ... وبالتوفيق"
archived = "2010-03-14"
