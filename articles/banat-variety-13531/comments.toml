subject = "جميل و لكن ......."
author = "شيما"
posted = "2008-08-03"
text = "موضوع جميل<br />بس بصراحة انا مش مع تبديل الملابس مش بس للاضرار الصحية اللى ممكن تحدث<br />لا و كمان ان ده ممكن يعمل مشاكل مع البنات و بعضها يعنى افرضى انى عايزة البس طقم معين انهارده و رتبت نفسى عليه و جهزته و جت صاحبتى طلبته اعمل ايييييييييييييييييييييه ؟؟؟؟؟؟؟؟؟<br />غير كده كمان انا لقيت ان فعلا كل ما تطلع طرح جديدة اشترى لغاية ما اتملى الدولاب و لاقيت ناس تانيه مش ف قدرتهم شراء كل ده و ساعتها حسيت بالاسراف الشديد و تذكرت مقولة لاحد الصحابة لاخر عندما وجده كلما اشتهى شيئا اشتراه فقال له \" او كلما اشتهيت اشتريت ؟؟؟؟؟\"<br />فعلا موضوع اللبس و الاكسسوارات ده لازم نعمله كنترول جاااااااااااااااامد حتى لا ندخل ف دائرة المسرفين<br />و ف نفس الوقت نطلع شويه من اللى متكوم عندنا لناس مش عندهم ربع اللى عندنا"
