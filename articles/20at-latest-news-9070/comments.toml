subject = "محمد سالم"
author = "انقلاب علي المشروع الامريكي يا"
posted = "2008-05-14"
text = "لن تستطيع انتم والتكم الاعلاميه الرهيبة وادواتكم الصحفيه وقنواتكم ومواقعكم الاخباريه وصحفيون اشتريتموهم بالمال علي طول الوطن العربي وشيوخ يروجون الطائفيه والتعبئة المذهبية<br />لن تستطيع ان تنتزع حب حزب الله من قلوبنا وقلوب كل الشرفاء في الامة<br />وسيندحر كل اعوان قوي الشر والاستكبار في المنطقه<br />والايام بيننا يا فيصل<br />بالمناسبه ماهي اخر اخبار صفقة اليمامه ..."
