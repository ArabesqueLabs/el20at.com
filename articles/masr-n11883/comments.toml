[[comments]]
order = 0
subject = "هو دة الازهر"
author = "عادل ثابت"
posted = "2007-10-11"
text = "الازهر ومصر العراقة والاسلام<br />طول عمر الازهر بالمسلمين الخييرين بتوع ربنا بيطعم طلابة ويعلمهم وكانوا زمان بيقولوا عليها الجراية<br />فيا اهل الخير فى العالم الاسلامى ودول الخليج اهتموا بطلبة الازهر - ابنوا لهم مدينة جامعية واعملوا وقف لاطعام الطلبة الذين ياتون من افريقيا وكل دول العالم الاسلامى الفقير لتعلم الدين<br />اعملوا خير فى دنيتكم يمكن ربنا يرضى عنكم ويغفر لكم<br />اللهم اننى ادعوا الى الخير"
archived = "2007-10-13"
capture_url = "https://web.archive.org/web/20071013122312/http://masr.20at.com:80/newArticle.php?sid=11883"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "هبه عاشور"
posted = "2007-10-14"
text = "أنا أزهرية .. ولما بأشوف الوافدات عندنا فى الجامعة بأفرح أوى وفى نفس الوقت بأكسف من نفسنا<br />دول ناس جاءوا من آخر الدنيا عشان يدرسوا الدين ويفهمومه .. لا معاهم لغة تساعدهم ولا فلوس ولا ظروف مناسبة ومع ذلك اتحدوا كل ده<br />لكن احنا اللى الأزهر فى بلدنا ولغتنا العربية مسهلة علينا كل حاجة ... مع ذلك بنشد شعرنا من مادة فقه مش عارفين نذاكرها ولا كام جزء قران هنمتحن فيهم واحنا مش حافظين فيهم ءايتين على بعض<br />الناس دى خلت شكلنا وحش أوى ... ربنا يهدينا<br />انتم ما تتصوروش هم بيتعبوا ازاى فى حفظ القران والمذاكرة والمشكلة الأكبر مصاريف الدراسة اللى زادت جدا .. ادعوا ربنا يعينهم ويرزقهم ويهدى لهم بتوع الأزهر اللى غلوا عليهم المصاريف"
archived = "2007-12-13"
capture_url = "https://web.archive.org/web/20071213034723/http://masr.20at.com:80/newArticle.php?sid=11883"
