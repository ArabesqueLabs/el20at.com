[[comments]]
order = 3
subject = "كل رمضان وانتم مدونين:)"
author = "weswes wsz"
text = "كل سنه وكلنا طيبين<br />وياريت مش تكون اخر تجمع لينا<br />انا بجد انبسط جدا من التجمع الرائع ده وكل الناس اللى هناك رائعين بجد"
archived = "2007-10-14"
capture_url = "https://web.archive.org/web/20071014234122/http://masr.20at.com:80/newArticle.php?sid=11869"
