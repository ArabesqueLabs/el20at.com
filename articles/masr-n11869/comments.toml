[[comments]]
order = 0
subject = "بالهنا والشفا"
author = "عمر الهادي"
text = "كل سنة وإنتم طيبين يا ولاد :)))<br />ويارب فطار السنة الجاية يكون رمضان بس من غير مبارك<br />انا اسمي عمر مش عمرو :)<br />و صديقي منظم الإفطار هو محمود صابر ( حرنكش) مش محمد صبري ! مين محمد صبري ده ؟ ههههههههههه"
archived = "2007-10-14"
capture_url = "https://web.archive.org/web/20071014234122/http://masr.20at.com:80/newArticle.php?sid=11869"

[[comments]]
order = 1
subject = "شوية عيال"
author = "عجوز"
text = "شوية عيال انما غيروا وجة الاعلام فى مصر<br />لم يعد احد يصدق جوقة الهتيفة للنظام واصبح كل من عندة كمبيوتر يقرأ دفتر احوال الوطن من خلال مدوناتهم<br />برافو يا اولاد سبقتم الاعلام الحكومى بخمسين سنة<br />وبتعبروا عن امانى واحلام الشعب<br />بتقولوا الوطن بيتألم من اية وفين الوجع<br />تحياتى يا اولاد يا كبار جدا والى الامام"
archived = "2007-10-14"
capture_url = "https://web.archive.org/web/20071014234122/http://masr.20at.com:80/newArticle.php?sid=11869"

