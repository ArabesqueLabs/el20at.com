subject = "احبك ياسيدي نصر الله"
author = "هاروووون ---سوريه المقاومه"
posted = "2007-10-11"
text = "مهما حاولتوا تشويه صورة السيد نحن لانتخلى عنه وننصره كرهكم له يزيدا حبا له وشوقا اليه اللهم اني احبك واحب عبدك السيد حسن نصر الله ووليك فلااطلب منك ياربي الا ان تحشرني معه في جنات الخلد"
