[[comments]]
order = 3
subject = "الله اكبر منككم جميعا يااعداء الاسلام ونصر عبده"
author = "جواااد --------الكويت"
posted = "2007-10-11"
text = "الى هذا المفتري الابله اللي بيقول انوا الشيعه بيتهمون عايشه بالزنا انت كاذب وقدم دليلك والا فاخرس ايها الحطيط الاتستحي من افتراء يا كاذب الا لعنة الله على المفسدين<br />المسلمين شيعه وسنه لايتهمون اي واحده من زوجات الرسول بهذا ان هذا الرجل مفتري وكاذب<br />وبعدين اتهموها مع من انك لاتملك الدليل انما تلهث وخلف اسيادك ابن سلول واتباعه بلا دليل لتشعل الفتن بين المسلمين وتتخلص من الاتقياء<br />اتق الله في نفسك يارجل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "القاهرة"
author = "اسماعيل القاسم"
posted = "2007-10-25"
text = "اذا كان المعلق لديه اثبات على ان سيد المقاومة نصر الله سب أبى سفيان فأتى به على الشاهدين ولكى نثبت صدقك<br />, وأما اذا صدقناك فأن حسن نصر الله لبنانى يقود أروع مقاومة يشهد عليها التاريخ ضد الكيان المحتل الصهيونى,فأين العرب وباقى المسلمين,حيث أن سيد المقاومة ظل يقاتل العدو فى الوقت التى تجلس حثالة سياسية خائنة فى رام الله بفلسطين لكى تتفاوض مع العدو على شراء الوهم منهم .. وشكرا"
archived = "2010-03-14"
