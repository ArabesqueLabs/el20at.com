[[comments]]
order = 0
subject = "السعوديه"
author = "جابر"
posted = "2007-10-11"
text = "ياناس ياعالم ياهو لعن الله من عادى نصر الله عز العرب انتوا ليه بتكرهوه لانه سب معاويه طيب انا اسماعيلي وبقول<br />الله يلعن معاويه معاويه وابناءه لايمتون للاسلام بصله فتحوا عقولكم شويه من امر بسب الامام علي ابن ابي طالب سيد قريش قاتل مرحب من نصر دين الاسلام لا معاويه ولاغيره كفوا ليقتلوا مرحب ما خرج له الا علي كله جبنوا وبعد ذلك ياتي هذا الصعلوك معاويه وابناءه بيسبوا علي بعد موته الاوغاد لوكانوا فيهم ذرة اسلام هولاء منافقين اذا رؤا علي قبلوا راسه خوفا منه واذا توفي سبوه على المنابر فباي ذنب يسب الا لانه نصر الاسلام ادرررررررررررسوا التاريخ الصحيح غير المحرف وبعدين تكلموا يامغفلين<br />اللهم العن معاويه واتباعه واحشرهم معه<br />وانصرنا يالله بجاه المصطفى واهله بيته والعن اعدائهم اجمعين واحشرنا مع سيدنا حسن نصر الله وامه فاطمه وجده محمد ولاتحشرنا مع معاويه واتباعه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "بيروت فى القلب ردا عليك"
author = "محمد"
posted = "2007-10-11"
text = "انت غلطت بكلام كبير على سيدك غصب عنك السيد حسن وعلى امه ولكن اعلم ان خصمك يوم القيامه هو امه فاطمه وجده الرسول محمد وابيه علي ابن ابي طالب وهم من سيقتص منك ويعلمونك كيف تتجرا على اسيادك يافاجر اعلم نسبه ومن هو بعدين اغلط يااااااااااااااااااااالوح<br />انت غبي تلهث وراء اسيادك المنافقون معاويه وابن سلول دون علم ايها الابله"
