[[comments]]
order = 0
subject = "المصريون رجعوا الى اصولهم الاسلامية بعد هزيمة 1967"
text = "بعد هزيمة 1967 ادرك المصريون انة يجب ان يعودوا الى اصولهم الاسلامية لينتصروا<br />فحدثت الثورة او الهبة الاسلامية او الصحوة الاسلامية<br />تستطيع ان تقول ان الاسلام الحقيقى قد ظهر فى مصر بعد تلك الصحوة<br />اذهب الى اى مؤسسة حكومية وقت اذان الظهر<br />كلهم يتركون المكاتب ويصلون فى طرقات المبنى"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327002813/http://masr.20at.com:80/newArticle.php?sid=20404"

