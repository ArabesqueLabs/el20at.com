text = "هو انتم تسمعوا كلمة راقصة ييجى لكم انفلونزا الخنازير<br />الموضوع عمل دوائر الكترونية تحرك روبوت او انسان الى وتجعلة يتحرك فى دوائر واقواس وقفزات اشبة بحركات البهلوان او الراقصة - يعنى دوائر الكترونية تتحكم فى الحركات وخطوات الارجل والاذرع لرجل الى او راقصة الية<br />والروبات مفيش فية اثارة ولا عرى ولا خلاعة دى مصنوع من الحديد والبلاستيك وكلة اسلاك ومسامير وصواميل وطولة 25 سنتيمتر<br />امتى الناس دى هتبطل خبل فى وسائل الاعلام الجاهلة<br />انا جاى من امريكا<br />وفى كلية الهندسة هناك طلبوا من الطلبة عمل مشروع عبارة عن وعاء معدنى تحملة الطائرة الهيلوكبتر وفى داخل هذا الوعاء بقرة حية يتم اسقاطها من الجو للجنود فى جبال افغانستان وتصل البقرة اليهم حية سليمة<br />دى تصميم هندسى<br />فى التصميم تعمل اى حاجة خيالية قابلة للتطبيق والمهم اتباع العلم والامان<br />الموضوع عادى ومفيش فية اى حاجة<br />كلة دوائر تحكم وكنترول فى جسم الى ومش رسم ولا تلوين - لان دول طلبة هندسة وهؤلاء دكاترة هندسة"
