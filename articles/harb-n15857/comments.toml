subject = "يا سلام"
author = "م/محمد احمد عبد القوى"
text = "تخيلو لو دده احمد نظيف اللى كان حيحصل وخدو احدث حته فى بلد زى مصر بالظبط مش عارفيين يجيبو رئيس زى الرئيس بتاعهم ويشاوروه ويشاورهم ويقولهم محدش يقدر يحكم مصر زىى مش شايف حد مناسب لغايه ما واحد عبقرى منهم قال عندى فكره ياريس احنا نعمل رئيس ديجيتال ونسجل عليه كل خطبك ومشاوراتك ومحادثتك امال احنا حكومه الكترونيه ازاى وعملو مناقصه وتقدمولهم عروض كتيره افضلهم وارخصم العرض الصينى وهنا ثار الرئيس وهاج وماج وقال ازاى دا يحصل قاللوله فى ايه ياريس قال حتى الريس من الصين انا راجل بشجع الصناعه الوطنيه وبالفعل اتفقو على عرض مصرى مصنوع بايدى مصريه والمشكله انهم اخنلفةو يسموه ايه لحد ما طلع عبقرى جامد فيهم اسمه ابو حديده قال نسميه جيمى على اسم اعز اصحابه وبالفعل تم اختيار الرئيس جيمى ديحتال خلفا للناشنوال رئيسا ابديا للدوله العظمى (على فكره دى نشره 2015)"
