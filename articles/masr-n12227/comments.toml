text = "عشرينات وقفوا المسخرة دي حالا<br />أستغفر الله العظيم ولا حول ولا قوة إلا بالله ..... لا حول ولا قوة إلا بالله<br />يا ريت تفوقوا شوية آه كويسة فكرة إطلاق حرية التعليقات<br />بس متوصلش للقذارة دي"
