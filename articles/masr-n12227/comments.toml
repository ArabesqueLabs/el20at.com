subject = "الي واحد"
author = "اللي ناك ام واحد"
text = "يا واحد امك فين الرسول قال لازم 5 رضعات مشبعات لازم ارضع من بز امك يا كس امك و هخلي صحابي يرضعوا بزاز الحجه كمان الله مش الرسول قال كده و لا انت كافر و هجيبلك معايا بول رسول تشربوا بالهنا و الشفا يا اهبل يا اهطل يا اللي بتشرب بول رسولك المتناك زيك و زي ابوك و امك الحجه ام بزاز"
archived = "2007-11-04"
