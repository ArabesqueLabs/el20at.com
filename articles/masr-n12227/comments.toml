[[comments]]
order = 0
subject = "شي ... حا ..."
author = "طيف بدر"
posted = "2007-11-02"
text = "روى الشيخان عن أبي سعيد الخدري رضى الله عنه قال: قال رسول الله صلى الله عليه وسلم: \"لتتبعن سنن من كان قبلكم حذو القذة بالقذة حتى لو دخلوا جحر ضب خرب لدخلتموه\"<br />ناس معندهاش شخصية و عاملين زي الحمير يتقالهم شي و حا و يقولوا \"كمان\"<br />حد شاف أوروبي اسمه \"بيتر\" بيحتفل بالعيد و لا حد شاف واحد ياباني اسمه \"شيكوا\" بيصوم رمضان و يتذكر الإسراء و المعراج<br />حد شاف واحد أمريكاني بيحتفل ب 6 أكتوبر<br />http:/alayasser.maktoobblog.com"
archived = "2007-11-04"
capture_url = "https://web.archive.org/web/20071104044421/http://masr.20at.com:80/newArticle.php?sid=12227"

[[comments]]
order = 1
subject = "ولاد الكل...."
author = "قبيح"
posted = "2007-11-02"
text = "اى تيس او حمار بيحتفل باعياد مالوش بيها علاقة ولا فى تراثنا ولا تاريخنا ولا نعرف عنها حاجة<br />فية مولد فى بلدنا بتاع سيدى الطرطوشى والعيال بيلبسوا فية زعابيط وبيبقوا حاجة مسخرة قوى<br />الجماعة بتوع هابى هلوين او هابى حلوين يتنيلوا على عينهم ومدام عندهم فراغ وفلوس كتير يروحوا يحتفلوا بالموالد واهى عادة فرعونية<br />صحيح عالم ماسخين"
archived = "2007-11-04"
capture_url = "https://web.archive.org/web/20071104044421/http://masr.20at.com:80/newArticle.php?sid=12227"

