subject = "ليس بالسعودية فقط"
author = "شريف ف أ"
posted = "2007-06-11"
text = "للأسف إن هذا لايتم في بلد السعودية فقط ولكن في جميع البلاد العربية عامة - ولو يعرف الشباب كم من الأضرار النفسية والإجتماعية والأخلاقية والصحية التي سوف تلحق بهم من جراء مشاهدة مثل هذه الأفلام المدمرة ما شاهدوها إن هذه الأفلام تجارية بعيدة كل البعد عن الواقع - فبها المونتاج والخدع السينمائية والعقاقير المدمرة في المستقبل القريب - والمتابع لهذه النوعية يقول أنه من الصعب وجود نفس الممثل بعد أكثر من سنة في فيلم آخر ويكون ذلك في الغالب بسبب تدمير هذا الممثل نفسيا وبدنيا في أقل من عام - وكم من هذه الأفلام دمرت بيوت زوجية كانت هادئة قبل أن تدخلها !!!!"
