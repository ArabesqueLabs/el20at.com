[[comments]]
order = 0
subject = "الجزاء من جنس العمل"
author = "مش حغتصب"
text = "وعلى كل فتيات مصر الاقتداء بهذه الفتاه<br />لانه ما في شيء بعد الشرف ابدا"
archived = "2008-07-08"
capture_url = "https://web.archive.org/web/20080708112850/http://masr.20at.com:80/newArticle.php?sid=16664"

[[comments]]
order = 1
subject = "ربنا يحميكي"
author = "أحمد المصري"
text = "ربنا يحميها و يحمي كل بنات مصر.<br />جدعة يا بت."
archived = "2008-07-09"
capture_url = "https://web.archive.org/web/20080709183934/http://masr.20at.com:80/newArticle.php?sid=16664"

[[comments]]
order = 2
subject = "يستحق هذا الجزاء"
author = "محمد حمدى"
text = "المغتصب يستحق العقاب ده .. وبصراحه البنت دى جدعه جدا<br />لكن اخر سطر فى الموضوع بيقول انها وجهت له طعنات بسكين كانت معها .. ياترى بنت عندها ستاشر سنه وفى ثانويه عامه تشيل معاها سكينه ليه؟!"
archived = "2008-07-09"
capture_url = "https://web.archive.org/web/20080709183934/http://masr.20at.com:80/newArticle.php?sid=16664"

[[comments]]
order = 3
subject = "قانون الغاب"
author = "أحمد المصري"
text = "يا أ. محمد حمدي دا قانون الغاب لازملك سلاح تدافع بيه عن نفسك.<br />على فكرة أغلب بنات مصر معاها سلاح (على إختلاف المستويات) من رشاش سلف ديفنس لصاعق كهربائي أو cutter أو حتى مطوة قرن غزال."
archived = "2008-07-14"
capture_url = "https://web.archive.org/web/20080714162315/http://masr.20at.com:80/newArticle.php?sid=16664"
