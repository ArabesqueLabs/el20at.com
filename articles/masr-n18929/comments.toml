order = 2
subject = "رمضان مبروك أبو العلمين حموده"
author = "مش تافه"
text = "اختيار اسم الفيلم تافه لاستهياف الشعب المصري علشان خاطر يجري يتفرج على الفلم التافه ويدفعوا للممثل التافه الاجرة التي تقدر بـ 5 مليون جنيه<br />يا بلاش<br />5 مليون في بلد الناس فيها بمتموت لانها مش لاقيه تشتري دوا<br />تخيلوا يا ناس ان فيه ناس بتروح تشتري دوا وتفاصل فيه<br />يعني زمان كانت الناس بتفاصل عند الخضري<br />دلوقتي الناس بتفاصل في سعر الدوا من كتر الفار<br />ولا حول ولا قوة الا بالله العلي العظيم"
archived = "2008-12-25"
capture_url = "https://web.archive.org/web/20081225180008/http://masr.20at.com:80/newArticle.php?sid=18929"

