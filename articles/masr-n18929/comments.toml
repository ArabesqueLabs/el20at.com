order = 1
subject = "هاتقولهم لى نيللى نيللى .... هاعمل هم لك شريهان شريهان"
author = "منقول بواسطة (مش)"
text = "قاموس الروشنة ممكن تحتاجة ياباشا في تطور الذات ................!!!!!!!!1انتظرواني<br />قاموس الروشنة<br />(1) مالوش في اللون او مالوش في النظام<br />وهى عبارة تعنى عدم اعتياد الشاب الدخول في حوارات معينه او فعل تصرفات معينه ، مثال \\\" عندنا ماتش يا كابتن جاى معانا .. لأ ماليش في النظام \\\"<br />(2) مضروبة بالنار<br />عبارة توصف بها الفتاة القبيحة شكلاً وجسداً ومضموناً \\\" بنت مضروبة بالنار \\\" اى لا يوجد ما يشجع الشاب علي التقرب منها<br />(3) معتقه<br />اصطلاح يطلع علي الشئ القديم النادر والخبثاء من الشباب يطلقونها علي السيدات الكبيرات في السن مثال \\\" الست دى معتقه من ايام سفينه نوح \\\"<br />(4) موزه<br />اصطلاح درج ان يطلق علي الفتاة الجميلة جداً في كل شئ ، واتخيل ان اللفظ اتى من كلمه المزمزة بالعامية المصرية وهو التمتع اثناء طعام او شراب ، اى يأكل ببطئ لانه حلو جداً وكذلك الفتاه حلوه جداً<br />(5) مش في الفورمه<br />عبارة تعنى ان الشاب يشغل تفكيره في شئ ما او لا يمارس حياتة الطبيعية او هناك ما يقلق مزاجه<br />(6) مُحوكس<br />لفظ يعنى تصنع الاستهبال او العبط مثل \\\" انت بتحوكس ياض \\\" اى بتدعى العبط<br />(7) مشوار<br />المشوار هو الموضوع \\\" فهمنا ايه المشوار \\\" اى اشرح لى الموضوع او الذى لا اعرفه ،، واحياناً ما نأتى الكلمه بمعنى مثل \\\" مشوار الدنيا محسوب بالثانية \\\"<br />(8) مصلحه<br />والمصلحجى هو الشاب الخبيث همه في الحياة الحصول علي اى فائدة سواء كانت المصلحة نقود او سيجارة وكما يقولون \\\" تعالى نعمل مصلحه من الواد ده \\\" يعنى تعالى نبحث كيف نستغله<br />(9) مأزعر<br />اى قصير ونحيف للغاية لدرجة \\\" المفطفط \\\" والمصطلح ده جاى من فطوطه<br />(10) متخرتق<br />اصطلاح يعنى ان هذا الشاب ليس له حظ في الدنيا .. عليه التزامات عديدة لا يستطيع الوفاء بها كما ان الاصطلاح به استخدامات عديدة مثل \\\" الحياة مخرتقانى \\\" اى ان الحياة تقف ضدى لدرجة البهدلة<br />(11) مُكنه<br />وتعنى البيت الآن بلغة الروشنة وهو البيت او المكان الخاص بتجمع الشلة ، الذى لا يعرفة احد ويمكن ان تكون المكنة طريق او منطقه ، وتقال \\\" لقيت حته موكنة حلوه \\\" اى وجدت منطقه خاليه من البشر<br />(12) ماتسيحش<br />وهى عبارة تحمل تحذير شديد اللهجة لاحد الشباب تفيد عدم نشر معلومات ذات اهمية كبيرة .. و غالباً ما تكون هذه المعلومات خاصة بعلاقة غرامية جديدة للشخص المنزر<br />(13) مرهف<br />وهو شديد الحساسية ومرهف تستخدم بمعنى مرهف او تعبان<br />(14) مسكوبتش<br />لفظ اطلق علي البخلاء او الحريصين علي المادة بصوره قوية ، واللفظ مأخوذ فنياً من مضمون الأزمة<br />الاقتصادية التى لاحقت انهيار الاتحاد السوفيتى ، والكلمة لا تعنى اى دلاله اخرى كما يظن الخبثاء<br />(15) متعه<br />لفظ شعبى قديم يطلق علي الفتاة الجميلة<br />(16) مظلات<br />لفظ يطلق علي الشخص الاقرع وتقال \\\" صباح المظلات \\\" اى القرعة نورت<br />(17) محلى<br />وهو لقب بمعنى نظيف او شريف .. لا تشويه شائبة ، وكذلك يطلق علي الفتاة حسنة السير والسلوك ، والكلمه بالاساس مأخوذه من المنجد الذى يعمل القطن وينظفه<br />(18) محطه العبيط باشا جت<br />عبارة بمعنى توقف عن كلامك الاهبل او الذى يسئ للاخرين او حان الوقت لكى تتراجع عما قلت او ارحل حتى لا تزيد من حده الموقف<br />(19) ممروع<br />لفظ بمعنى مختال بنفسه واخد في نفسة قلم ، واحياناً تأتى بمعنى العشم في كرم شخصاً ما لدرجة كبيرة وتقال \\\" انت ممروع علي ايه \\\"<br />(20) مقطع السمكه وديلها<br />وهو الشخص المحترف في اساليب التعامل مع الفتيات والايقاع بهم في حبالة<br />(21) معاك ع الخط<br />عبارة بمعنى اتبع اسلوبك .. او اوافقك علي ارائك وقرارتك ، وتقال انا معاك علي الخط او اننى اصدقك واوافق علي كل ما تقوله<br />(22) مال الله<br />عبارة متعارف عليها علنياً وتعنى اموال الزكاة ، ولكن العبارة تستخدم بمعنى اخر بالنسبة للشباب المستغل ، حيث تعنى ان كل ما احصل عليه من الاخرين هو ليس لي سأبعثه للزكاه<br />(23) ملزق<br />لفظ له العديد من الاستخدامات ، فأحياناً يأتى بمعنى حلو لدرجة عدم قبوله او تأتى كصفه يتصف بها المهتمين بالمظهر لدرجة لا تطاق ، وحديثه ملزق اى يتكلم بود وحميمية علي غير اساس وتأتى بمعنى \\\" لزقه \\\" اى الشخص الذى يتبعك كظلك اينما ذهبت<br />(24) منخار<br />الشخص الفضولى والذى يضع منخاره في كل شئ ويؤذى شعور الاخرين<br />(25) متودك<br />مصطلح بمعنى فاهم او خبير محنك ، وتقال متودك في الصنعه ، اى يفهم الاسرار الخفية فيها ويمارسها باحتراف<br />(26) ملحلح<br />وهو الشاب الهمام الذى ينفذ الاوامر المطلوبة منه بسرعه ، وتقال \\\" انت شاب ملحلح \\\" اى قادر علي التعرف بسرعه وذكاء<br />(27) نفض<br />لفظ بمعنى تجاهل او عامله لا مبالاله او كبر دماغك او تجاهل وجوده وعامله بقله ذوق .. وتقال ايضاً \\\" نفض لنفسك \\\" وهى تعنى امشى الآن<br />(28) نص لبه<br />بمعنى ان هناك شاب قليل الاهمية او شاب \\\" اى كلام \\\" لا يوفى بميعاد او عمل طلب منه واحياناً تفيد انه غير جدير بالاهتمام اساساً<br />(29) نخع<br />بمعنى كذب او اظهر غير الحقيقة والنخع هم الكذب بطريقة مكشوفة جداً<br />(30) نتفة بت<br />عبارة تطلق علي الفتاة الجميلة ، والنتفه هى المنتقاه بعناية من وسط بنات حواء<br />(31) نأفأفله<br />لفظ بمعنى الضرب علي مؤخرة الرأس \\\" القفا \\\" وهى دلالة علي الاستهزاء والسخرية من الشخص الضعيف او \\\" ارجوز الشله \\\"<br />(22) نحنوح<br />وهو لفظ بمعنى بتاع ماما .. او الدلوع الذى يجب ان يستشير والدته في كل ما يقوم به . والنحنحة هى التظاهر بالدلع والارستقراطية ، ويطلق عليها ايضاً الفرفرة مع اختلاف الاستخدام<br />(23) هارش<br />مصطلح هام جداً اليوم وهو يعنى الفهم والإنتباه \\\" انا هارش الموضوع \\\" اى اعرف ابعاده جيداً ، واحياناً ما تأتى هارش كأسلوب سخرية علي الاخرين ، اما المهروش فهو المجنون ويقال \\\" الواد ده مهروش \\\" اى لا يزن كلامه<br />(24) هوبا<br />لفظ يطلق علي الشاب الخفيف او الهايف مثل \\\" ده واد هوبا خالص \\\" واحياناً ما يأتى اللفظ كاحياء لاشياء اخرى<br />253) هثيا<br />وهو الشخص العبيط او الشخص الذى يتعامل بحسن نيه واستهبال ويقال الواد ده هثيا<br />(26) هرتل<br />اى تعامل بعبط واستهبل في حديثة مع الاخرين وتقال \\\" هرتل في الكلام \\\" اى تكلم بغير علم او في حوارات ليس له فيها شأن<br />(27) هلاهوطه<br />وتشير الى الشخص الاهبل او الذى يتعامل بعبط سواء في تصرفاتة او مع الاخرين واحياناً ترسم صوره البلاهوطه في شكل المعتوه منحنى الظهر والذى يتركز المخاط في انفه بكثره<br />286) هوى له<br />صيغة استهزاء توجه لشخص ما ، عند وقوعه في موقف حرج .. والاحراج يتسبب في احمرار الوجه والاذن مما يتطلب التعرض للهواء حتى لا يحترق الشاب من خجلة<br />297) هتاشا<br />وهو الشاب الذى يكذب ويخترع افلامانات ليس لها وجود لكى يهتم به الاخرين<br />(30) هات فرع نيل<br />عبارة تستخدم عندما تريد كوب من الماء لتشرب<br />(31) هأ وشخاليل يا لعبك<br />عبارة تفيد الرغبة في المرح وهى عبارة عن اختصارات مجمعة ، \\\" هأ \\\" كتابة عن الضحك \\\" الشخاليل \\\" تعنى الصهلله او احداث صوت عالى ، اما \\\" لعبك \\\" يعنى المرح والضحك الناتج من مواقف تسلية جماعية وتصاغ احياناً بمعانى اخرى كثيرة من الصعب الاحاطه بها<br />(32) هشكة<br />وهى المرأة اللعوب او الراقصة في الكازينوهات<br />(33) هاتنبر فيها<br />لفظ يفيد الحسد او تحاشى الحسد والحقد الذى ظهر في ملامح صديق<br />(34) هاتقولهم لى نيللى نيللى .... هاعمل هم لك شريهان شريهان<br />وهو اسلوب مواجهة علي حسب قاموس \\\" اللمبى \\\" في فيلم الناظر . وتقال للشخص الذى يريد ان يتوهك في الكلام او يخدعك .. ويمكن ان تقال في شهر رمضان بدلاً من الالفاظ النابية .. حتى لا تفقد صيامك بسبب شاب بلط<br />(35) هيلمان<br />لفظ يعنى الظليطه او تجمع عدد كبير من الشباب وتقال عامل هيلمان اى عامل دوشه كبيره واحياناً تانى بمعنى التهويل في المواضيع<br />(36) هلف<br />لفظ يدل علي الشاب الضخم والعضلات المفتوله او الشاب السمين الضخم طولاً وعرضاً ويوصف بأنه مثل الحيطه<br />(37) هيفا<br />وهى الفتاة ذات الشعر الطويل الناعم الذى يهفهف او يتطاير مع نسمات الهواء الرقيقة<br />(38) هتفضل<br />لفظ بمعنى الوعد بعلقه ساخنه ويمكن ان تأتى هنفضل الحصول علي كل ما مع الشاب من نقود<br />(39) هشقك<br />لفظ غرضه التهديد بالضرب واللفظ بمعنى اقسمك الى نصفين ، وتقال لو مانفذتش طلباتى هشقك ، اى حاول ان تسرع بإرضائى<br />(40) هازوفك<br />لفظ بمعنى هاضربك او انوى ضربك بشدة مثل هازوفك قلم \\\" اى سوف اصفعك علي وجهك \\\" وتقال من شاب غاضب لاخر اغضبه<br />انتظرو المزيد يا جماعة"
