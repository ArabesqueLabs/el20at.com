subject = "اللي يهمنا في الموضوع (الاجرة) الباشا محمد هنيدي بيلهف كام مليون في الفيلم"
author = "مش ححبك"
text = "أما محمد هنيدي الذي كان تقاضى عن آخر أفلامه \\\\\\\"وش إجرام\\\\\\\" 4 ملايين جنيه فتقاضى من إحدى المحطات الفضائية التي تتولى إنتاج فيلمه الجديد \\\\\\\"عنترة بن شداد \\\\\\\"أجراً قدره 5 ملايين جنيه\\\\\\\".<br />خمسة مليون جنيه في الفيلم<br />يا بلاش على حساب الشعب الاهبل"
archived = "2008-12-25"
capture_url = "https://web.archive.org/web/20081225180008/http://masr.20at.com:80/newArticle.php?sid=18929"

