author = "مفلس"
text = "ايه دا<br />محمد هنيدي بياخد 5 مليون جنيه في الفيلم بس<br />يا عيني عليك يا ابني<br />وخمسة مليون جنيه يعملوا ايه في الايام السودا دي بتاعة لجنة السياسات"
