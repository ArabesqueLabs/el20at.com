[[comments]]
order = 4
subject = "بعدما قدم النائب جمال الزيني طلب إحاطة برفع الفيلم من دور العرض بتهمة الإساءة للمدرسين"
author = "مش كاتب"
text = "النائب جمال الزيني مرة راح لابوه وقالوا يابابا علمني التفاهة<br />قال له يا ابني دايما تيجي في الهايفة وتتصدر<br />يعني النائب جمال الزيني ساب خراب مالطه وزعلان اوي على الاساءة للمدرسين"
archived = "2008-12-25"
capture_url = "https://web.archive.org/web/20081225180008/http://masr.20at.com:80/newArticle.php?sid=18929"

[[comments]]
order = 5
subject = "رد على جمال الزيني"
author = "مش رائص"
text = "من يوم ما فتحت السينما المصرية والمدرسين وعلماء الازهر بيتهزأوا ايه اللي جرى يعني<br />ولا حضرتك مش لاقي حاجه تعملها<br />فؤاد المهندس وعبدالمنعم مدبولي وامين الهنيدي كانوا دايما يطلعوا في ادوار مدرسين وياما هزؤوا المدرسين<br />وياما ناس طلعت في دور علماء دين واتهزؤوا وخصوصا في ادوار المأذونين<br />جتك نيله يا جمال الزيني"
archived = "2008-12-25"
capture_url = "https://web.archive.org/web/20081225180008/http://masr.20at.com:80/newArticle.php?sid=18929"
