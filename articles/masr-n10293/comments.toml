[[comments]]
order = 3
subject = "ادعوا معايا"
author = "المشعوذ"
text = "تركي طول عمره متألق وبصراحه الموضوع ده عجبنى طحن انا كنت طالب طلب صغير منه عايز ايميله يا ريت تبعتهوللى نفسى اتعرف عليك ونصير اصدقاء انا من المغرب وبدي اني يكون لي اصدقاء من مصر نفسي من زمان اوي في كده واول حاجه هعملها مع صديقى الجديد من مصر هبعتله سلامي لامي وياجى يقابلنى في المطار اصل انا جبت الوكمان اللى امى طول عمرها بتحلم بيه نفسها تحط السماعات فى ودنها وهى بتغسل المواعين لكن حقا ليس كل ما يتمناه المرء يدركه . ادعوا معايا تركي يبعتلة ايميله"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064259/http://masr.20at.com:80/newArticle.php?sid=10293"

[[comments]]
order = 4
subject = "مجرد سؤال"
author = "نيفين نيفى نوفا"
text = "سؤال للكاتب او القارء او لاى عشريناتى على ارض مصر و العالم<br />هى كلمه اييييييييييييييييييييييييييييه دى من ابداع شعبولا و لا دى بتبقى جزء من كلمات اسلام خليل البديعه"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064259/http://masr.20at.com:80/newArticle.php?sid=10293"

[[comments]]
order = 5
subject = "تاريخ ايييييييييييييه"
author = "شرين منصور"
text = "السلام عليكم والله يا نيفين كلمة اييييييييه دي موجودة من زمان بس متلحنتش زي شعبولا يعني لما لما حد يفضل ينادي عليكي كتير بتردي عليه بتقولي ايييييييييه لكن شعبولا اخدها لحنها وهي بقت جزء لا يتجزا من أغاني اسلام خليل وشعبولا لو مقلهاش تبقى في حاجة غلط ....ربنا يستر على الابداعات اللي جاية يا نيفين ......مجرد معلقة في عشرينات"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064259/http://masr.20at.com:80/newArticle.php?sid=10293"

[[comments]]
order = 6
subject = "كلمتين و بس"
author = "نيفين نيفى نوفا"
text = "و الله يا شيرين بالنسبه لتاريخ اييييييه كان زمان فيه برنامج للاستاذ اقصد فؤاد المهندس ف الاذاعه كان اسمه كلمتين و بس<br />و كان دايما بيقول ف اخرع مش كده و لا ايييييييه<br />الله يرحمط يا استاذ فرق كبير بين ايييييه بتاعه المهندس و ايه بتاعه شعبولا<br />تعرفى يا شيرين ساعات بقول بلاش نظلم شعبولا لانه هو و امثاله كبعرور و سعد الصغير و غيرهم افراز طبيعى للاوضاع اللى ف البلد"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064259/http://masr.20at.com:80/newArticle.php?sid=10293"
