[[comments]]
order = 1
subject = "أصبحنا نعبر بلأغاني"
author = "شرين منصور"
text = "السلام عليكم عمل حوار مع اسلام خليل هو جراءة من كاتب الحوار لأنني لم ارى ان احد غامر وعمل معاه حوار لأن البعض يقول من هو والبعض يقول كلمات هابطة وبيئة لكن انا ارى العكس كاتب كلمات الاغاني سواء الشعبية او العاطفية او اي نوع من الاغاني هو بيبقى الأساس لنجاح الاغنية مش المغني المغني مجرد مؤدي لها زما شفنا : شعبان نجح بسبب اسلام خليل بالرغم من تحفظي الشديد على شعبان عبد الرحيم واسلام خليل الا انهم ثنائي بسيط أحدهم لم يتعلم القراءة والكاتبة استطاعوا يقولو ا ما لا نستطيع نحن المتعلمون قوله هما عملو بمقولة (أنا حعمل حعمل واللي يحصل يحصل) بس تحفظي على اسلام على باقي أغانيه وبتمنى انو يفضل يكتب أغاني عن السياسة فقط لأنها المنفذ الوحيد لينا بس ياريت تغيرو اللحن باة كفاية اييييييه"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064259/http://masr.20at.com:80/newArticle.php?sid=10293"

