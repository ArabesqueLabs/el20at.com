subject = "انا رحت الاستفتاء"
author = "توتى"
posted = "2007-03-27"
text = "انا امبارح رحت الاستفتاء لازم يكون ليك مشاركة سواء وافقت او رفضت المهم تشارك باسلو محترم ماظانش ان الناس لما تتظاهر وتشتم وتعطل مصالح ناس وتخرب تبقى هى دى الحرية والديمقراطية واحمدو ربنا فعلا ان انتو فى عصر قدرتو تقولو لاء بصوت عالى وتتظاهرو كدة لو كان الموضوع دة زمان او فى عصر غير دة كنت هاتروحو زى ......... تقولو ايوة والف ايوة كمان ياريت نكون قد الحرية حتى لو كانت مساحتها قلية علشان لو اتعاملنا فيها كويس ممكن فى ويوم تزيد انما لو فضلنا نتصرف كدة يبقى فعلا لازم القمع وقانون الارهاب علشان بعض الناس اللى بتتعامل بهمجية<br />على فكرة انا مش من الحزب الوطنى او حاجة بس دة كلام العقل<br />شكرا"
