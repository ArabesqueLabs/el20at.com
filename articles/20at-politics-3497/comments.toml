text = "السلام عليكم قلها من كل قلبك قلها وبصراحه انا مرحتش الاستفتاء يعني انت امام خيارين اما الجدين الدمر واما الحالي المميت والله علي ما اقول شهيد وربنا يكون بعون العبيد والي ساكن بعيد او بيته في الصعيد او حلته حديد او جيبه بينزف صديد او عندو دستور جديد"
