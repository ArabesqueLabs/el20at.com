order = 1
subject = "دور قادة الشيعه بعد البعث"
author = "صلاح الدين"
posted = "2007-01-15"
text = "راح صدام والبعث طلع لنا أجرم من شارون واسرائيل قادة الشيعه مقتدى والحكيم ولائهم لايران وليس لاوطانهم ايران نفس القصة تتكرر ولاء للعدو على حساب الوطن والضحيه هذي المره السنه العراقيين. يا عدو الله مقتضى والذليل الحكيم موعدكم قريب انشاء الله في قطع رؤسكم واخذ ثأر السنه منكم ومن كل شيعي ولن ينسى كل سني ما فعله الشيعه بتحالفهم مع الحرس الثوري الايراني وانشاء الله الثأر قريب ."
archived = "2010-03-14"
