order = 0
subject = "نهاية الظلمة"
author = "مسلم"
posted = "2007-01-15"
text = "صدق الله -جل جلاله - ولا تحسبن الله غافلا عما يعمل الظالمون .<br />بعض الظلمة يعجل الله عذابه في الدنيا ، ولعله يتوب ان كان مسلما كحال صدام ، فيكون ما أصابه كفارة لبعض ذنوبه او كلها ، والبعض الاخر من الظلمة كال سعود وحسنى يوخر ، فيطغى ويتجبر ، ويظن أن الله غافلا عنه وما هو الا امهال ، حتى إذا أخذه لم يفلته.<br />فادعوا الله باسمه الاعظم أن يبتلي ال سعود وحسني والاسد وخائن الاردن كما ابتلى صدام والبندر وبرزان وأن يعذبهم في الدنيا قبل الاخرة وان يجعل ذلك على ايدي المؤمنين لا أيدي الكافرين والمنافقين كحال صدام وبرزان"
