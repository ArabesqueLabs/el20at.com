posted = "2007-10-11"
text = "قناةاسترايك والامارة وسهم كلهم قنوات نصب والاتصالات غير حقيقة حتى قيمة الجايزة من 100000 دولا دة يعنى لو حصل وحلوا السؤال بعد فترة طــــــــــــويـــــــــلة يقولك تتدخل مرحلة تانية ولا تتوقف ناس توقل تتوقف ويفتكرو انهم كسبوا الجايزة كلهل وناس تقول هكمل والى يكمل يبقى هو الى جابه لنفسة ينزلوا سؤال صعب جداا ولو فرض وعرفت الاجابة يقولك مبروك عليك جايزة المرحلة التانية 500$ولو عايز توصل لجايزة الكبيرة تدخل المرحلة التالتة وديه بقى مستحيل تلقى ليها حل كل الى ققدر ققوله حرم عليكم الفلوس الى بضيعوها فى الاتصالت بيتكم ئوالى بيهم وكل ده بيروح لمين(فى بطن واحد لبنانى واسمة نبيل و كرش واحد سورى اسمة فضل القاسم )لاسف خربوا عقول الناس اتقوا الله ."
