text = "السلام عليكم/ وبعد تحياتى الطيبة<br />أولا طريقة نقدك غيلر صحيحة تماما حيث من المفترض أن تنتقد القناه و ليس الفتيات,وذلك لأنهم يعتبرن موظفات مثلهم مثلك تماما و ذلك من أجل كسب العيش,وف مصر معظم الوظائف التى تنال إعجاب الجمهور تحتاج إلى الوسطة!!<br />فعليك أن تنتقد القناة نفسها وليس الفتيات,لأن ذلك عتبر سبا وهذا لا يليق بفتيات مصر ... أشكرك على حسن التفاعل."
