author = "اعلامية"
posted = "2007-07-02"
text = "فعلا الواسطة الان شكلت مشكله كبيرة فى مجتمعنا الحالى وعلشان تشتغل فى مكان كبير وذو مكانه يجب ان تقدم كارت الواسطة قبل شهاداتك وخبراتك والوظائف الان اصبحت معدومه وذلك ماشجع كثير من القنوات التى انعدم فيها المضمون والفكر الى استغلال الشباب بمرتبات زهيده والتقليل من شأنهم ومن امكانياتهم فى كل شئ فالان لايجد الشاب او البنت الا حلين اما عدم العمل فى ظل الغلاء والمسئوليات التى عاتقهم او العمل فى اماكن امثال قناة سترايك وشبيهاتها ويرضخوا لهذه المتطلبات"
