subject = "رفع الآذان بالمكبرات مش ضروري"
author = "من اليمن"
posted = "2007-10-22"
text = "أنا أتفق مع ( مواطن مصري ) يا جماعة عندما تكثر مكبرات الصوت هذا يقول الله أكبر وهذا يقول حي على الصلاة بصراحة إزعاج وبالذات إذا كان هناك بجوار المسجد مستشفى وفي كمان مؤذنين بصراحة أصواتهم مزعجة أو المبكرفون عطلان بيصدر صوت مزعج واللي يريد أن يفعل محاضرة دينية بين المغرب والعشاء يعملها هادئة في المسجد وبلاش يسمع الشارع.<br />إيش فيها لو يخلوها داخل المسجد وبلاش الدعاء بصوت عالي على النصارى وأمريكا يعني المكبرات علشان نسبهم وارى أيضاً أن تلغى مكبرات الأصوات أيضاً في قاعات الأعراس لأنها أيضاً مزعجة وخاصة في آخر الليل ."
