posted = "2007-06-29"
text = "إلي الأستاذ / ملكش دعوة ....<br />قدرة مهووووووووووووولة ... إن حضرتك تقعد تكتب التعليق ده كله ... الصراحة الواحد كده ممكن يحسد أحمد هواري علي صبرك ده كله ....<br />كل ده تعليق ياعم ... أمال لو كان الموضوع عاجبك كنت حتكتب إيه؟<br />الصراحة أنا مقدرتش أقراه كله ... فما بالك إني أكتب تعليق زيه ...؟<br />عمنا هواري .... هاتني أكتب معاك ياريس ...<br />إذا كانت الردود بال\"حجم\" ده .... وأهه بالمرة مع ملف التخااااااااااااااااااان<br />مش حاسكت ...<br />لاللتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \"بس مش كده يعني\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي ....<br />http://mesh7askot.blogspot.com/"
