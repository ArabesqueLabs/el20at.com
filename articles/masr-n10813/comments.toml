order = 0
subject = "هي العباده لازم يكون فيها مكبرات ونعير"
author = "مواطن مصري"
posted = "2007-06-26"
text = "مقارنه ظالمه جدا ان تقارن اصوات الاجراس في الكنائس باصوات الاذان في المكبرات. مثلا اذان الفجر كفيل بان يقلق منام اجدعها انسان ولو علي بعد كيلو من المسجد وذلك بفضل المكبرات.كما اننا وفي المناسبات نسمع ادعيه بواسطة هذه<br />المكبرات تلعن ابو النصاري واليهود وتدعو لتفريق شملهم وترميل نسائهم وتيتيم اطفالهم باعلي الاصوات وانكرها.ثانيا ليس انشاء جرس للكنيسه هو المشكله بل بناء الكنيسه نفسه اصبح شبه مستحيل هذه الايام ويؤدي في اغلب الاحيان الي قتل وحرق منازل النصاري ( المشركين) والي صلح وهمي يسلب حقوق المظلمويين (بمها بالعياط).فعلا لا يستطيع احد ان يمنع الاجراس ان تدق داخل الكنائس وذلك لانه لا يستطيع احد اصلا ان يبني او يستخرج تصاريح بناء كنائس .وبعدين هي عباده الله لازم يكون فيها مكبرات ونعيير ."
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

