[[comments]]
order = 8
subject = "رغم انفهم"
author = "مصرى"
posted = "2007-06-30"
text = "سنبنى المساجد ونقيم الماذن ونركب بدل الميكرفون اربعة<br />وسنسب الكفرة الذين يعرفون انفسهم<br />وسترتفع الماذن عاليا وستشرق شمس الاسلام رغم حقد الكفرة الذين يعرفون انفسهم<br />والاذان الذى يستغرق دقيقتين ليس ضوضاء ياكلاب كما تدعون انة امان ودعوة الى الصلاة<br />الحرامى الذى يسمع الاذان يتوقف لحظتها عن السرقة<br />والفاجر الذى يرتكب الزنى يرتعب حينما يسمع الاذان وهو فى جرمة<br />هذا كلة كلام النصارى<br />ورغم انهم لا يتجاوزوا اربعة ملايين ملئوا البلد بالكنائس وهمهم بناء كنيسة كاملة لكل نفر قبطى واحد بفلوس تاتيهم من امريكا واستراليا<br />ولكن الاسلام ينتشر كالبرق ويفزعهم هذا كثيرا<br />المساجد ستبنى والماذن ستعلوا رغم انف الكبير<br />ونور اللة هو الغالب<br />والنصر للاسلام"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

