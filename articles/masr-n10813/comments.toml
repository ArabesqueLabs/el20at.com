text = "وبعدين هو مش المسيحيين بحسب تقديرات البعض من 2 الى 6 فى المية .. حد يحط فى دماغة نسبه تافهه زى دى .. وبعدين انا عمرى ما سمعت جرس كنيسة .. كل اللى عارفه ان اى مقاول فاسد عايز يتوب يبنى جامع تحت عمارته عشان ميدفعش عليها ضريبة عوايد واى حد معدى يأذن .. والجوامع بقت زى المساجد بقت زى الزوايا .. ناس عشان تاخد حسنة تركبك مليون سيئه وتمارس عليك ابتزاز دينى .. والنبى عشان خاطرى خليكوا امناء مع نفسكوا .. بذمتكوا الموضوع مش بقى مزعج"
