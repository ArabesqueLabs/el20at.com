author = "واحد من الناس"
posted = "2007-07-03"
text = "آدى يا عم أم الفتنة الطائفية اللى بتقولوا إنها مش موجودة ..<br />أى واحد يدخل هنا و يشوف المسلم بيكفر المسيحى و المسيحى بيسب المسلم ..<br />خلينى بقى أقول رأيى ..<br />أيوة .. الأذان صوته مزعج جدا جدا خصوصا لما يكون فيه 20 مسجد بيأذنوا مع بعض بفارق 5 أو 6 أو 10 ثوانى بين كل مسجد و التانى .. و ده بيسبب ضجيج كبير جدا .. دا غير إذاعة الأدعية و المحاضرات الدينية و غيرها .. و كل واحد فى المساجد دى بيقول اللى على مزاجه فى نفس الوقت اللى بيتكلم فيه شيخ تانى فى مسجد تانى جنبه فى حاجة تانية خالص لدرجة إن تداخل الكلام بيخليك مش فاهم أى حاجة من اللى بيتقال ..<br />و الكنايس اللى بيفضل الجرس بتاعها يدق بالعشر دقايق و الربع ساعة بتسبب إزعاج كببير جدا ..<br />أنا عندى طفل فى سن 7 شهور بيقوم من النوم مفزوع فعلا من صوت الأذان فى الفجر أو العشاء - لأنه غالبا هى دى الأوقات اللى بيكون نايم فيها - كما إنه برضه بيقوم مفزوع من صوت الجرس اللى بيفضل يدق بالعشر دقايق ..<br />و على فكرة يا جماعة .. أنا مسيحى .. بس اللى بيحزنى بجد إنى أسمع شتيمتى بودانى من شيوخ الجوامع .. ماهى دى يا جماعة سبب الفتنة اللى بتحصل .. شيوخ جوامع مش فاهمين الإسلام صح أبدا ..<br />و صدقونى و يشهد الله الواحد على كل الكلام اللى هقوله ده .. إنى عمرى فى الكنيسة ما سمعت كاهن بيشتم أو بيتكلم بسوء على إخواتنا المسلمين .. بالعكس .. دايما لما تحصل مشاكل بين واحد مسيحى و واحد مسلم بيقول دايمال للمسيحى : متكبرش الموضوع و صلى و سيب ربنا يتصرف و إسمع كلام الإنجيل : غير مجازين عن شر بشر أو عن شتيمة بشتيمة ...<br />أرجوكم بقى كفاية ..<br />الإسلام مش هينتهى لو الأذان إتوحد أو حتى إتلغى .. ولا المسيحية هتنتهى لو الأجراس إتوحدت أو حتى إتلغت .. الدين أكبر من مجرد أذان أو جرس ......"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 11
subject = "واحد من الناس أحييك"
author = "أحمد عبد الله"
posted = "2007-07-03"
text = "أحييك يا واحد من الناس على الكلام المنطقى الجميل<br />يا جماعة القلة الغبية من الشيوخ اللى مش عارفة أى حاجة فى أى حاجة هى سبب كل البلاوى دى<br />و معاهم القلة اللى مش فاهمة أى حاجة من قساوسة المسيحية زى زكريا بطرس و غيره<br />و الهوارى اللى كاتب المقال ده مجبش جديد<br />دا إنت يا هوارى هايف هيافة . دا بدل ما تتكلم فى موضوع حيوى و يفيد كل الناس تتكلم فى موضوع ممكن يثير فتنة طائفية ؟<br />مرة تانية بحييك يا واحد من الناس و موافق تماما على كلامك<br />الدين أكبر من مجرد أذان أو جرس<br />تحياتى لك"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 12
subject = "اذان بدون مؤذن"
author = "ابو اسامة"
posted = "2007-07-03"
text = "مع انى مع توحيد الآذان وده بسبب الاصوات الفظيعة الى بتختارها الاوقاف الى بتختار المؤذنين بالرشوة والله ما بكدب الى<br />بيدفع اكتر هو الى بيتوظف يعنى الذنب مش الاذان ولكن المؤذن وبعدين المشكلة مش فى الاذان الى الكل شبط فيه وساب المهم وهو بناء الماءذن يعنى شوية غلق المساجد وشوية مفيش ماءذن وشوية بحجة كتر المساجد يبقى مفيش بناء مساجد يا اخونا احنا فى دولة علمانية لايهمها المساجد ولا الماءذن ولكن يهمها ان ميبقاش فيه صلاة اصلا وفيه<br />واحد عملها قبل مبارك وزعل من اذان الفجر ام هد المسجد وعملها دولة علمانية وهو اتاتورك الله يجحمه اما مبارك عاوز يلغى الماءذن والمساجد ونبقى دولة مهلبية لان لقب علمانية بعيد علينا وأخيرا اذكركم بقول الله عز وجل الذى يعلم بوجود مثل هؤلآ (ومن اظلم ممن منع مساجد الله ان ترفع ويذكر فيها اسمه يسبح له فيها بالغدو والاصال)صدق الله العظيم"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 13
subject = "تسلم"
author = "مسلم مصرى"
posted = "2007-07-04"
text = "الله يكرمك يا أخ \"واحد من الناس\" انسان عاقل ومتحضر ... الكلام المستفز عن المسيحيين لم يجرك إلى رد السيئة بالسيئة. من زى ناس .. يا أخى ياللى تهجمت على المسيحيين بدون داعى ، يقول الله تعالى: ((ولا تجادلوا اهل الكتاب إلا بالتى هى احسن)). وانت تقول لأ هانشتمهم من على المنابر وفى الميكروفونات .. وطز فى 2-6 مليون؟؟ جبت منين الرقم ده .. إذا كان الدولة نفسها ما بتعملش احصاء لعدد المسيحيين - لوهذا لسبب غير معلوم -.<br />و الشباب الحلو إللى عمّال يتكلم عن الأسلام ويدافع ، وهو ولا فاهم حاجة فى اى حاجة . والأخ اللى بيقول أن المسيحيين عايزين يبنوا لكل واحد كنيسة ، ده طبعا ينم عن جهل عميق، وتكفيك نظرة واحدة للكنائس فى الأعياد والأحاد علشان تشوف الناس فوق بعضها، وبالرغم من ذلك تمنع الدولة بناء الكنائس إلا بأشتراطات كثيرة ومعقدة.<br />وكمان الأخ الكاتب ده تعبان فى مخه ... طيب انت بتتكلم عن وزارة الأوقاف وقرارتها العشوائية...ليه تجيب سيرة الكنائس فى الموضوع.... يا ريت نعقل شوية .. ونفكر احنا بنقول ايه قبل ما نقوله ... ومش عمّال على بطال نعملها صراع بين الأديان وفتنة ......... الفتنة نائمة... لعن لله من ايقظها"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 14
subject = "أخطاء منطقية فى الحوار"
author = "مواطن مصرى مسلم مفروس من المصر"
posted = "2007-07-06"
text = "السلام عليكم<br />أنا اللى كتبت الرد التالت من فوق , رجعت بأقول بعض الملاحظات الذى قيل فيه تقريباً كل شيء ,<br />الملاحظ فى الموضوع أن الأخطاء النمطقية التالية حدثت و هو شيء ينافى اداب الحوار أولاً و قواعد المنطق ثانياً:<br />1 - واحد داخل يقولك (إيه الموضوع الهايف ده ؟) أو ما معناه كذلك ,<br />يا عم إحنا دلوقت فاتحين نقطة معينة بنتكلم فيها , ما تقوليش إيه الموضوع الهايف ده و تمشى , أنا يا سيدى بكلمك ف أى هيافة , لو مش عاجبك إمشى و سجل إعتراضك بعدم المشاركة ف الحوار , ما تتفهش النقاش كله كدة على بعضه و تقوللى(موضوع هايف).<br />2 - واحد داخل يصرخ (العزة للإسلام و الله أكبر و سبنى المساجد برغم أنوف الحاقدين ) أولاً هذا الكلام كما قال سيدنا على بن أى طالب(حق أريد به باطل) , الكلام ده و الزعيق ده شكل هادم للحوار و يسيء للإسلام بأبشع صورة و لا يفيد فضلاً عن ضرره فى نأليب النفوس و إثارة المشاعر الخامدة , عاوز تناقش ناقش بهدوء و (بالحجة) ,<br />إذا كنا إتعلمنا حاجة من التاريخ فهو إن العنف وسيلة تغيير مؤقتة , لا شيء جذرى فى العالم تم تغييره بالعنف أبداً , و إذا تغير فهو يتغير بشكل مؤقت فقط<br />3- واحد داخل يتريق على كاتب المقال بشكل .........<br />طبعاً واضح جداً جداً جداً إن ده نوع من الحقد الدفين , يمكن هما زمايل أو متنافسين ف مجال معين ( فقط بخمن) و طبعاً أسلوب الكلام مش حلو خالص و حتى لو كانت له وجهة نظر فهو بكل الأشكال ضيعها بأيده ف السخرية الرهيبة و التى أفقدت كلامه معاناه<br />مانا ممكن أقولك \"إيه ده , إنت بتتكلم كدة ليه ؟ إنت سافل و قليل الأدب \" و تشتمنى و أشتمك و يبقي الموضوع بزرميط , ما خذا التخلف العقلى ؟؟؟؟؟؟؟؟؟؟<br />شكلك معبى منه كتير يا (ملكش دعوة) !!<br />4 - النقطة الأكثر أهمية فى النقاط المنطقية , إن إحنا بنتكلم على (الإزعاج الصادر من مكبرات الصوت )<br />اللى مش عارف يضرب ف النقطة دي بالذات تلاقيه بيلوش , فيظهر بقي الكلام عن الأنابيب و الديجيهات و كلاكسات العربيات و عبودة السمكرى و مش عارف إيه و أيه و ايه .........<br />إيه ده ؟؟؟؟؟؟؟؟؟<br />إحنا بنتكلم ف نقطة محددة و واضحة , إنه الخيال العلمى اللى بيطلع ده ؟؟<br />أيوة ماشى السمكرى مزعج و العربيات مزعجة و الانابيب مزعجة و كلام صح , طب و بعدين ؟؟؟<br />النقطة إن مش هوة ده الموضوع و مش هوة ده محور النقاش ,<br />ماجيش أكلمك ف إن المكبرات يساء إستخدامها تقوللى ( يا سلام ؟ طب و السمكرية)<br />يا جماعة الكلام ده حاجة و ده حاجة تانية .<br />الكلام ده وجهة نظر شخصية أرجو التمعن فيها عند مراجعة الحوار<br />و شكراً"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 15
subject = "برضه عجبت لك يازمن"
author = "عجبت لك يازمن"
text = "ممنوع فتح المساجد إلا في أوقات الصلاه-- ممنوع إعتلاء المنابر إلا برخصة- ممنوع الكلام في أمور البلد او في السياسة في خطب الجمعة- ممنوع الخطابة إلا لخطباء الأوقاف- ممنوع الآذان في مكبرات الصوت- ممنوع بناء المآذن فوق المساجد- ممنوع بناء المساجد من أصله- ممنوع التجاوز عن اللذين يطلقون لحاهم- ممنوع التظاهر في دور العبادة\" المساجد يعني\"- ممنوع الشعارات الدينية في الانتخابات ولا في غيرها- ممنوع ختان البنات- ممنوع الاعتراض على تعيين المرأة قاضية وبدون ختان- ممنوع على الأزهر ورجالته الكلام في السياسة ولا حتى الكلام في الدين ولاحتى الكلام من أصله-ممنوع إقامة دولة إسلامية على حدود مصر - ممنوع إعادة فلسطين وممنوع إعادة اللاجئين وممنوع إعادةالأقصى وممنوع بالمردة إعادة الفلسطينين من معبر رفح- ممنوع الكلام مع الإخوان ممنوع الكلام مع حماس ممنوع الكلام مع الجماعات الاسلامية - ممنوع انك تحتج وممنوع انك تحج وممنوع انك تختار وممنوع انك تحتار وممنوع انك تعيش وممنوع انك تموت وممنوع انك تسافر وممنوع انك تقعد وممنوع انك تفرح وممنوع انك تزعل وممنوع انك تتمرد وممنوع انك تمرض وممنوع انك تشفى وممنوع انك تعترض وممنوع انك تفترض وممنوع انك تجزم وممنوع انك تربح وممنوع انك تخسر .......<br />دي إرشادات بتنقال في ودن كل مولود مكتوب في شهادة ميلادة انه مصري......ومسلم"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 16
subject = "ستبقى الله اكبر عالية فى سماء مصر رغم انووووووووووف الحاقدين"
author = "واحد من مصر الاسلامية"
text = "السلام عليكم<br />انا فعلا اتعجب ممن يقول ان صوت الاذان الذى يستمر دقيقتين او ثلاثة على اقصى تقدير يسبب ازعاجا واضطرابا للنائمين؟؟<br />سبحان الله ..<br />وهل اقتصرت الاصوات العالية على الاذان الذى يذكر فيه اسم الله؟<br />الا نبتلى كل يوم بهذا البائع المتجول او اصوات الافراح او حتى البقال اللى تحتنا واللى بيتحفونا كل يوم بمجموعة من الصريخ والاصوات الصاخبة ممن يسمونهم الفنانين والمغنيين!!<br />الا تكفى اصوات السيارات التى تسد الاذان وتصمها؟<br />انا اعلم يقينا ان كلمة \"لا اله الا الله محمد رسول الله\" .....عمرها ما تزعج مسلم حتى لو كان بينه وبين الاسلام عقودا طويلة من البعد والهجر......فقط تزعج كل من لايؤمن بها ممن لايريدون لامسجدا ولاصلاة ولااذانا......<br />نعــــــــــــــــــــــــــــــــــــــــم ينزعج من الاذان من يجرى ويغلقه اذا سمعه فى قناة من القنوات,,,<br />وحتى لو حلف اى شخص بالايمان المغلظة انه مسلم ولكنه ينزعج من الاذان فلن اصدقه,,,لانه ليس هناك مسلم ينزعج من مصدر عزته وفخره حتى لو كانت اصوات المؤذنين على غير مايرام ولكن يبقى الاذان يذكرك بدينك وبعقيدتك كلما سمعته,,,<br />يجعل المجرم يتوقف عن استكمال جرمه والعاصى يتذكر الله وينتفض عند سماع الاذان وربما توقف عن معصيته اجلالا لكلمة الله.<br />نعـــــــــــــــــــــــــــــــــــــم الاذان يجعل الانسان فى حنين وشوق الى العودة الى الدين والالتزام والطهر بعيدا عن المعاصى والذنوب التى تغرقه.<br />انا اكتب هذا الكلام وكلى اخطاء ولكن احب ان اسمع الاذان وكل مايربطنى بالاسلام عسى الله ان يهدينى....<br />حتى ابسط ما يربط الانسان بدينه ويذكره به كل يوم يريدون ان يحرمونا منه....<br />فحسبنى الله ونعم الوكيل فى كل من يحارب شعائر الاسلام فيما غير المسلمين يعملون ما يحلو لهم فى دور عبادتهم ولا ينكر احد عليهم افعالهم.<br />وأشكرررررررررررررررررررررر صاحب الموضوع واقول له \"الله يجزيك الخير\" على اهتمامك بأمور المسلمين...................."
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 17
subject = "ضع عنوان التعليق"
text = "لأ , كدة بقي إحنا بنهبل و بنقول أى كلام , و النبى كل واحد عنده رد على الكلام و الفتاوى اللى ذكرتها يتكلم , و اللى مش عارف يتكلم يخرس خالص مادام هيهطل .<br />هو إنت و هو عشان مش عارفين تردوا ع الحجة بالحجة بتقولوا أى كلام أشعار و خلاص ؟؟؟<br />أى حاجة عن عزة الإسلام ف أى حاجة عن رفعة الأمة ف أى حاجة من هنا و هناك ؟؟؟؟<br />هوة أى بتنجان ؟؟ و كله عند العرب صابون ؟؟؟؟<br />أقولك فتوى الشيخ الشعراوى و بن عثيمين برضه تقاوح بلا حجة ولا أى شيء سوى أنه رأى شخصى و تقوللى (رغم أنوف الحاقدين) يا بنى جحش ؟؟؟<br />الله يخرب بيوتكوا مليتوا البلد<br />ألف حمد و ألف شكر لك يا رب إنكم مش عامة الناس , ربنا يكفينا شرّكوا"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
