[[comments]]
order = 2
subject = "اتكلم عن الاذان احسن من كدة يا مواطن مصرى (حمضان)"
author = "انسان يعرف ربنا"
posted = "2007-06-26"
text = "الاخ البيقول انة مواطن مصرى وبيقول انة ظالمة المقارنة بين اجراس الكنائس والاذان هى طبعا مقارنة ظالمة جداا لان مش معقول هنقارن اذان ربنا البيدعونا للاصلاة بميوسج واجراس وبلاش تدخل عيشة على ام الخير هو ما حادث العياط بالمقال اصلا ولا هو انت بتحب تدخل زيد فى عبيد بلاش وبعدسن محنا طول عمرنا عايشين على مكبرات الصوت واذان الفجر وصلاة الفجر النت مش بتحب تسمع صوتها احنا بقا بنحبها عشان بتصحينا عشان نقضى فرض ربنا بدل النوم والشخير ولا انت عايزهم يئذنولك فى اذنك كل يوم دة اذا اصلا كنت مسلم وموحد باللة ولو انى اشك طبعا مفيش مسلم هيقول الكلام النت بتقولة دة ولو انت مش مسلم يبقى اتكلم على الاذان والمكبرات باسلوب احسن من كدة ولا خلاص طلعلكم صوت اليومين دول اللة يرحمك يا سادات(اعظم من انجبت مصر)"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 3
subject = "أنا بقي مسلم و بقول إن الموضوع بقي متخلف !!"
author = "مواطن مصرى مسلم مفروس من المصر"
posted = "2007-06-27"
text = "فيه نقط أتفق مع مواطن مصرى و اعترض مع الردين التانيين فيها و نقط أختلف معاه و أتفق معاكو<br />النقط اللى أختلف معاه فيها هى خلط الأمور , الحديث هنا عن الميكروفونات و ضجيجها و لا علاقة ببناء الكنائس بالموضوع ده , و بعدين يا أستاذى مفيش داعى للشعور بهذه الإضطهاد , إنتو واخدين حقكوا تماماً ف كل حاجة ودي برضه ملاحظة عابرة للتخفيف من حدة الحوار و برضه مالهاش علاقة بالموضوع.<br />النقطة الثانية هى إنعدام العلاقة بين ما يدعو به المسلمين فى صلواتهم و بين الموضوع(أنا لا أقول امين عندما يدعى على اليهود والنصارى بشكل عام و الرسول عليه أفضل الصلاة والسلام معروف عنه جداً أن هذه الأدعية لم ترد على لسانه قد والباحث فى أدعيته صلى الله عليه و سلم لن يجد لها أثراً حتى فى احلك لحظات القتال و الحرب بين المسلمين و اليهود والله أعلى و أعلم , هذه أيضاً ملاحظة عابرة)<br />أما ما أتفق مع المواطن المصرى فيه هو :<br />1- علو صوت الأذان بشكل مستفز , إن المكبرات الهائلة التى تضعها المساجد يجب أن توضع على إرتفاعات مناسبة حتى لا تصيب الساكنين بجانبها بالصمم كما هو حادث و عن تجربة شخصية من محدثك الذى يقطن بجانب مسجد تحت منزله مباشرةً.<br />2- إذاعة الأذان و الإقامة أمر لن أختلف على ضرورته بالنسبة للمسلمين و لكن هنا هناك وجهان للموضوع:<br />أولاً)أن أصوات المؤذنين (كما هو الحال فى معظم أوجه الحياة فى مصرنا العزيزة!!) أصبح كثيراً منها وجهاً اخر لللقبح و فساد الذوق العام و إنحراف الحس الجمالى , والدى و جدى عندما يتحدثون عن الأذان فهم يتحدثون عن أيام زمان عندما كان المؤذن الوقور صاحب الصوت الجميل يصعد بوقاره المعتاد فى كل صلاة ليؤذن(بلا مكبرات ولا ضجيج) بصوت يذيب الحجر و يلين الحديد فى مناطق مصر الشعبية القديمة زمااااااان , أما الان ..........!!! يا للقبح الذى الت إليه هذه البلدة.<br />ثانياً) المشكلة الحقيقية أننى أستطيع _على أعصابى و مضروباً بالجزمة_ تحمل الصوت الناعق لمؤذن جلف لا يفقه من الإسلام سوى هيئة الصلاة التى يؤديها لدقيقة واحدة أو دقيقتان خمس مرات يومياً بلا مشكلة حقيقية , لكن المشكلة أن المساجد لا تكتفى بإذاعة الأذان ثم إذاعة الإقامة و لكنها تذيع معهما الخطب والدروس و المواعظ و الصلاة نفسها بما فيها الصلوات الجهرية و هلم جراً , فإذا حادثت أحد أفراد الشعب المصرى عن هذا الموضوع إنقلب وجهه إلى خيئة الملائكة و هو يقول لك بسماحة \"يا أخى ألا تتحمل عشر دقائق من أجل الله ؟؟؟\" أو مثلاً \" يا أخى ده كلام ربنا , إنت عاوز تمنع كلام ربنا؟؟\" , وأقول أنا و هل أمر الله بهذا ؟؟؟ أبداً والله , إن الله_عز وجل_ أمرنا بالتخفيف فى الصلاة نفسها مراعاةً لمشاعر سريعى الضجر و مراعاةً للفوارق الإيمانية الطبيعية بين بنى البشر , فكيف يأمرنا سبحانه و تعالى بمثل هذا الإزعاج؟؟؟ هذا لا يعقل بالمرة .<br />الموضوع للحق شغل من عقلى و حياتى حيزاً كبيراً كونى أقطن بجان مسجد تحت منزلنا و مسجد اخر على بعد بضعة عشرات من الأمتار , و هو على النحو التالى فى نظرى :<br />أنه أحد أوجه القبح الذى أبتليت به مصر بسبب شعبها قبل حكامها و طبيعة ناسها قبل أى شيء اخر , فالشعب الذى ينام على (أيظن إنى هلعب بيه ) و يصحو على (أحمر و طعمه خطير , صغير يا ناس و كبير ) لعمرى لا يستطيع التمييز بين الحسن و القبيح.<br />نقطة اخرى أن الشعب المصرى غير متدين بالشكل الصحيح , و لا أدل على كلامى من الحال الذى أصبحنا فيه إقتصادياً و مادياً و أخلاقياً ( و لا أبرىء نفسى بحال ولكنى فقط أقر الحقائق) و حالة الإزدواجية التى يعيش فيها بين إلتزامات دينية غير قادر على التخلص منها و لا على فهمها تجعله كالذى يحمل درعاً و سيفاً عظيماً و هو لا يجبد الضرب به فتجده قد ربط السيف فى ركبته و علق الدرع فى قفاه و مشى أعوجاً ستعثر فى سلاحه !!<br />الأخ( واحد عارف ربنا ) ولا مش عارف إسمه إيه , و مين قالك إن إحنا بنحبها ؟؟؟ هل إنت و إنت قاعد ف بيتك بعد ما خلصت صلاة و عاوز تعمل حاجة و لا تتفرج على تلفزيون و لا تشغل راديو بتحب تسمع صوت الصلاة العالى و هو يخترق عليك بيتك بلا إستئذان ؟؟ الإجابة فى أعماقنا كلنا هى لا و لكنه الجهل المسيطر على حالنا هو الذى يدفعنا للمكابرة و النفاق مع أن هذا _والله_ لم يك هو قصد الله اللطيف الرحمن الرحيم بما أبداً.<br />هذا هو ما فى قلب معظم الناس _و كل واحد فينا فى قرارة نفسه عميقاً يعرف هذا_ ولكن أنا أملك الشجاعة الكافية لقولها , مستغنياً لبضعة دقائق قلائل عن الجبن المصرى المعهود الذى جبلت عليه !!"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 4
subject = "اللى اختشوا ماتوا"
author = "مصراوى"
posted = "2007-06-27"
text = "بون فلسفة وقلة ادب الاذان هو اللى بيعمل ضوضاء يامواطن يامصرى مع انى اشك بقى الاذان اللى مدتة لا تستغرق 3 دقائق هو اللى بيعمل ضوضاء والاخ اللى بيقول ان تحت بيتهم جامع ومنزعج من صوت المكبر !!! سبحان الله اقسم بالله العظيم المكبر بتاع المسجد اللى جنبنا موجه على شقتى مباشرة ومن زمان ومفيش حكاية الصمم دى ابدا واذا كنت عاوز تعرف الصمم بجد تعالى واسمع صوت جرس الكنيسة اللى بجوارنا برضة انا من سكان شبرا وفيها كل حاجة جنب بعض يعنى الجامع جنب الكنيسة ؟؟ انما بقى لو عاوز تعرف الضوضاء اللى بجد يبقى تشوف كلاكسات السيارات اللى على الفاضى والمليان والبياعين اللى فى الشوارع ولا بتوع انابيب الغاز مع ان المنطقة دخل فيها الغاز الطبيعى لكن برضة بتاع الانابيب لسه بيعدى وكلكم عارفين صوت التخبيط على الانابيب ؟؟؟ العملية مش اذان وضوضاء الحكاية ان كله بيتلكك لكله وفى ناس بتعوم مع الموجة ويقولك انا مسلم وصوت المؤذن بيسبب لى ضوضاء يمكن سعادتة مش عايش فى مصر ولا حاجة .. فعلا اللى اختشوا ماتوا .حاجة تقرف"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

[[comments]]
order = 5
subject = "انا مسلم انا مسلم انا مسلم وبطلوا هوس المسيحيين .ي"
author = "محمممممممممممممد مسللللللللللل"
posted = "2007-06-27"
text = "موافق ان الضوضاء ليها اكتر من مصدر .. بس منها الاذان فى الميكرفونات بدعوك بس انك تكون فى حديقة الازهر ساعة ادان العصر مثلا .. مبتسمعش حاجة .. ذبذبات عالية وطنين يعنى لو منتش من مصر مش حتعرف انه ادان ممكن تقول انه اى حاجة تانيه لانك مبتسمعش ادان بتسمع ميكروفونااااااااااااااااااااات طالع منها اصواااااااااااااااااااااااات .. انا جدى طول عمره ساكن فى باب الخلق من ايام ما كان محمد رفعت بيدن بصوته فى الجامع اللى تحتيه .. اقسم بالله ان جدى اللى عنده 85 سنة بيصحى من النوم مفزوع كل يوم لان فيه حوالى 43 ادان بينطلقوا بفروقات زمنية من ثانية لعشرين ثوانى .. بيصحى من النوم بيستغفر ربنا وبيدعى ويقول ربنا ع الظالم والمفترى"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022630/http://masr.20at.com:80/newArticle.php?sid=10813"

