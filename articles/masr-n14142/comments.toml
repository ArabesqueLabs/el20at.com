[[comments]]
order = 0
subject = "عجيبه يا مصر"
author = "مواطن اهبل وعبيط"
text = "انا شايف في الموضوع الرئيسي ان مصر كسبانه في بطولة افريقيا<br />انتو عارفين يا جماعة رحلة المنتخب دي اتصرف عليها كام<br />كان ممكن بالفلوس اللي بيصرفوها على الكورة والكويرة يصرفوها على الناس المنكوبة دي<br />لكن حنعمل ايه بأه في البلد البايظه اللي مالهاش اصحاب"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212054825/http://masr.20at.com:80/newArticle.php?sid=14142"

[[comments]]
order = 1
subject = "طويل التيلة رئيس وزراء مصر"
author = "مصرى"
text = "صرح رئيس الوزراء طويل التيلة نظيف باشا ان احتياطى مصر من النقد الاجنبى 31 مليار دولار - وان الاقتصاد فى ازدهار والمواطنين يعيشون فى رغد العيش والعملية زلال بلال والناس بتفطر رز بلبن ويتغدوا شيش كباب ويتعشوا سندوتشات همبرجر من عند الاخ ماكدولند<br />سيدى رئيس الوزراء المبجل ال 31 مليار دول يمكن يكونوا رأس مال شركة متوسطة فى دبى<br />صحيح طويل واهبل"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212054825/http://masr.20at.com:80/newArticle.php?sid=14142"
