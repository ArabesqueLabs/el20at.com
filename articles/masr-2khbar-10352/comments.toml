[[comments]]
order = 1
subject = "وتلك هى اوضاعنا"
author = "الاستاذ فتح الباب مدرس بالحصة"
posted = "2008-10-30"
text = "لا يوجد تعيينات فى التربية<br />فية مدرس بيشتغل بعقد وفية مدرس بيشتغل بالحصة والراتب لا يتجاوز 95 جنيها<br />كيف يتم انفاق ال 95 جنيها ؟<br />يذهب الى المدرسة فى الصباح بواسطة التوك توك ويدفع واحد جنية ويعود من المدرسة بواسطة التوك توك بواحد جنية ايضا وياكل شقة فول او شقة طعمية بجنية<br />بكدة يبقى راحوا ال 95 جنية<br />يعيش ازاى<br />ازاى يعيش ويبقى عندة متطلبات اليوم الضرورية<br />قالوا الكادر<br />قال لك امتحان ولعب ال 3 ورقات<br />يبقى لازم فية دروس خصوصية<br />يبقى المدرس طول النهار متوتر ومفيش شغل<br />يبقى ما فيش تعليم"
archived = "2010-03-14"
