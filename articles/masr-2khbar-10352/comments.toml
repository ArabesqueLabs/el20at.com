[[comments]]
order = 2
subject = "(الساكت عن الحق شيطان أخرس)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-30"
text = "الى المدعوا يحيى الجمل وزير ما تدعى (وزارة التربية و التعليم)<br />عفوا<br />أقصد وزارة(القتل و التعذيب)<br />ليك يوم يا جمل؟ الذبح حلال لك انت و القتلة اتباعك؟<br />اذا كان الساكت عن الحق شيطان أخرس؟<br />فما باللم يا ساكت عن القتل و التعذيب؟!!!<br />انك حيوان حيوان حيوان يا جمل يا حيوان<br />اتفوا عليك مليون الف مليون مرة يا جمل يا حيوان؟"
archived = "2010-03-14"
capture_url = ""

