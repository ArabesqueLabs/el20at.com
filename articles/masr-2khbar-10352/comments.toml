[[comments]]
order = 0
subject = "وكانت هناك وزارة اسمها وزارة التربية والتعليم - اص"
author = "ابو مخيمر"
posted = "2008-10-29"
text = "لى قريب طالب فى الثانوية العامة - ابتدأ العام الدراسى ولم يداوم حتى الان ولا يوم واحد - وحينما سألتة لماذا لا تذهب الى المدرسة - قال لى انة حينما يذهب الى المدرسة لا يجد احد من الطلبة فى الفصل - وان كل الطلبة يذهبون للدروس الخصوصية ويذاكرون فى البيت وفى اخر العام يقدمون شهادة ويدخلون الامتحان<br />والطلبة الصغار يذهبون الى المدارس ولكن الفصول بدون مدرسون ولا احد يشرح شيئا والكل يعتمد على الدروس الخصوصية<br />المدارس فى حالة تسيب شديد والادارات التعليمية تعبانة اخر تعب والكل ايل للسقوط<br />فى المدارس المصرية الان لا تربية ولا تعليم"
archived = "2010-03-14"
