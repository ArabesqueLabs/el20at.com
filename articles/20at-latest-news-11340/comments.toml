[[comments]]
order = 0
subject = "ياليت والله"
author = "بندر الجني"
posted = "2009-02-19"
text = "انا من المؤيدين لوجود سينما<br />بل واطالب بوجودها على الاقل نقدر نحدد اين نذهب هذا المساء بدل حياة الملل اللي عايشين فيها وحياة التناقض اللي نغش العالم بها<br />اتمنى الاستعجال في هذا الامر ومن يعارض على السينما يلزم البيت<br />مو شرط يشرفنا<br />احنا شعب والحمد لله<br />عندنا ايمان وعندنا دين وناقصنا ترفيه محترم<br />نبغى نقسم وقتنا بين الدين والترفيه<br />واعتقد ان المجموعة المعارضه اعطيت الفرصه سابقا وشفنا النتائج<br />مابين سجن غنتناومو والتفجيرات والتكفير الغير منضبط<br />والله الموفق لما فيه صالحنا"
archived = "2010-03-14"
