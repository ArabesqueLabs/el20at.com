[[comments]]
order = 1
subject = "متى"
author = "سعد نامي القروني"
posted = "2009-02-21"
text = "ننتنظر الساعه اللي نشوف فيها سينما مثل العالم<br />نبغى نشوف اخر الافلام الاكشن نبغى<br />نقول<br />الليله قضيناها بصحبة العائله في السينما وثم ذهبنا للمطعم ثم تمشينا على الكورنيش ثم ثم ثم<br />اما الحين<br />مابوه ياحسره الا الخراط والهرج الممل برعاية جهات ما عرفها اهل السعودية الا من بعد جهيمان وطقته وخلوا حياة اهل البلد مرضى نفسيين وكذابيين ومتناقضين<br />الواحد يسوي فيها فاضل<br />واذا نخلته بغربال<br />يطلع اكبر حرامي متخفي"
archived = "2010-03-14"
