subject = "شكرا لمحرر الخبر"
author = "بعانى من ده"
posted = "2008-12-03"
text = "السلام عليكم ورحمه الله وبركاته<br />شكرا لمحرر الخبر ظاهرة جارية المدير منتشر بشكل قذر فى معظم دولنا العربية واحنا هنا فى مصر ليها بلاوى سودة وتأثير تحت ضغط حاجة البنت أنها تهين كرامتها علشان المدير السيكوباتى ده ميعرضيهايش لترك العمل وهى فى حاجة إليه بس برده<br />الواحدة خوفها وتسترها على أفعال النوعية ديه بيزيدوا من أفعالهم بس هيتفضحوا فى مقابل التشهير بيها ده بيكون الخوف<br />وأنا عن نفسى كان مديرى بيتلذذ زى العبيط أنه يلمس أو يعمل أى حركة لى أو لزملائى ومش بنعرف نعمل معاه ايه غير أننا نتريق عليه وخلاص<br />رحمتك يارب"
archived = "2010-03-14"
