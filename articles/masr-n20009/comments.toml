text = "ايهاب مقلد طول عمده في خدمه اهالي سوهاج وعمره ياسيدي الفاضل منجح علشان الكلام<br />الي سيادتك بتقوله ان حب الناس ليه هوه السبب في نجاحه لانه مكانش ((حرامي)) ولا عمره عمل قايمه فيها تسعيره للوظايف من دم المواطن الغلبان ولاكان مرتشي ولا عمره اخد ارض مش بتاعته بالسلاح وعمل كده احمد ابو حجي مش فدي بس لا في كل الي اتكتب قبل كده وانا مش برمي الناس بالباطل وانت عارف ان الي يفضل متواجد في المجلس 27سنه يبقي اكبر شرف ليه ولما يسقط دوره يبقي فشل زريع الشارع في مصر وفي سوهاج وفي كل مكان محتاج واحد ايده نظيفه مش مخرومه يامحترمين زي<br />ايهاب مقلد وبلاش نجيب في سيره الناس الي سقطت وننسي نجاحها ويايت نتكلم شويه عن الناس الحراميه الي وكلينها ولعه وسيبو الاموات الاشراف الي عمره مدخل ايديه<br />في جيب واحد غلبان وقاله(((دي ضريبه انتخابك ليه))<br />ehab_makled@yahoo.com"
