[[comments]]
order = 2
subject = "من وكالة معاً ومن صوت فلسطين يا ابن شيعة فلسطين وم"
author = "سيرانة"
text = "والله كونك عايش في غزة وما عندك هالأخبار فهاد عار على شهادتك وعلى الحارة قصدي الجامعه اللي خرجتك.<br />وكون واثق انو اللي بيتهم الناس بالصهيونيه والكفر والانقلابية هو يذكر صفاته لا اكثر زي ما قال المثل كل انء بما فيه ينضح<br />وحاول تفهم هاد المثل بطريقة غير معتادة كنوع من تشغيل المخ بعد ما الظاهر حجرولك مخك يا ..... صحافي!!!<br />وملاحظة صغيرة: مستوى كلامك وطريقة ردك بتظهر انك صحفي وناضج فعلا"
archived = "2010-03-14"
