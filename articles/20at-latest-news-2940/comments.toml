[[comments]]
order = 0
subject = "اين الحياد يا عشرينات؟"
author = "سيرانة"
text = "يعني انا بتمنى الموقع يكون حيادي ولو شوي<br />قوات \"ابو مازن\" اصابت 23 شخص في حين مقتل 76 قيادي فتحاوي 60% منهم على يد القوة التنفيذية منذ استلام حماس للحكومة هاد غير ال3 اطفال ونسبة الفقر اللي بلغت 70% وغير انو انجازات الحكومة صفر وغير انو برنامجها السياسي- ان وجد- فاشل على كل الاصعدة وغير انو حماس دايما معها فلوس لكوادرها وباقي الشعب لاء.<br />وهادي هي الاسباب اللي ادت للانتاخابات المبكرة.<br />وتحديدا بسبب نشوء حرب اهلية في غزة وفشل الحكومة من جميع النواحي هو سبب اجراء الانتخابات المبكرة<br />ثم لو كان ابو مازن عزل حماس وحط غيرنا كان قلنا انها التفاف على ارادة الشعب . بس اللي صار انو ابو مازن قرر يرجع للشعب بعد ما صارت المشكلة عويصة وفرص حكومة الوحدة صفر ووضعنا يتجه للحضيض.<br />ازا ما بدها حماس انتخابات ... اعطينا البديل يا حماس؟؟<br />ونعم ابو مازن سلطته تسمحله عزل حكومة حماس. وكل خطوة اتخذها ابو مازن متوافقة تماما مع الدستور الفلسطيني."
archived = "2010-03-14"
