subject = "من وين إشاعاتك يا بنت الصهيونية يا سيرانة"
author = "صادق"
text = "الغريب إنك عم تذكري أرقام وهيّ عارية عن الصحة تماما<br />أنا من قطاع غزة وكاتب صحفي ومراسل وكالة عربية ما عندي من هاذي الاخبار أخبار<br />إلا إذا انا عايش على المريخ<br />اتقوا الله في الشعب المسلم نحنا مش صهاينة يا سيرانة<br />وعيـــــــــــــــــــــــــــــــــب عليك"
