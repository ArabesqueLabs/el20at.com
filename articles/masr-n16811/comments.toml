[[comments]]
order = 0
subject = "جمال الحمار فقهيى"
author = "اكتب اسمك هنا"
posted = "2008-07-16"
text = "جمال البنا حرام عليكم تسمموا عقول الشباب بكلمات هذا الذنديق الكافر فان الا زهر قد كفرة فلماذا تتحفونا بة حسبنا الله ونعم الوكيل"
archived = "2008-07-18"
capture_url = "https://web.archive.org/web/20080718162630/http://masr.20at.com:80/newArticle.php?sid=16811"

[[comments]]
order = 1
subject = "واحدة بنت حاسة باهانة"
author = "اكتب اسمك هنا"
posted = "2008-07-17"
text = "كلمة حق أريد بها باطل<br />كل اللى قاله صحيح .. لكن عايز يوصل به لإيه بالظبط ؟<br />عايز يغير الشريعة كلها مثلا<br />وفين الثوابت وفين المتغيرات .. ومين اللى يحددها ؟<br />أكيد مش معقولة يكون جمال البنا<br />والعدل اللى بيطلبه هل إنه مثلا يرجعنا للجاهلية ويخلينا جوارى عند الرجالة"
archived = "2008-07-18"
capture_url = "https://web.archive.org/web/20080718162630/http://masr.20at.com:80/newArticle.php?sid=16811"

[[comments]]
order = 2
subject = "والعدل اللى بيطلبه هل إنه مثلا يرجعنا للجاهلية ويخ"
author = "الى الاخت اللي فوق"
posted = "2008-07-17"
text = "وايه المشكلة ان النساء يكونوا جواري عند الرجاله<br />ما هما الرجاله كلاب عند النسوان<br />بيشتغلوا زي الكلاب وبيستحملوا الاهانات والؤل في سبيل لقمة العيش والست قاعدة في البيت معززه مكرمه<br />الست مستكتره على الرجل بعد ذل وجري ورمح طول النهار علشان خاطر يكفي بيته<br />مستكتره عليه انها تخدمه<br />اتقي الله يا ست واحمدي ربنا"
archived = "2008-07-18"
capture_url = "https://web.archive.org/web/20080718162630/http://masr.20at.com:80/newArticle.php?sid=16811"

[[comments]]
order = 3
subject = "لاتحاسبوا الناس"
author = "ابو اسامة"
posted = "2008-07-18"
text = "لا تحاسبوا الناس على نواياهم فلا يحاسب على النية الا الله اما هذالكلام فهو صحيح<br />لانه اينما وجدت المصلحة فثم شرع الله ."
archived = "2008-07-18"
capture_url = "https://web.archive.org/web/20080718162630/http://masr.20at.com:80/newArticle.php?sid=16811"
