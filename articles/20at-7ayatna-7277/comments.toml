text = "المسلسل كويس جدا و ان كان اتحرق _كمضمون و سياق احداث_من تانى حلقه تقريبا<br />لان طبعا اتفهم انها قضيه اغتصاب و اتعرف ان الشرطه هتتدخل و يتمسكو الجناه و يتعاقبو و هكذا<br />بس الجميل ف المسلسل الاداء لان فعلا الابطال باداءهم نسونا الجزئيه دى و بعد اداء يسرا الرائع بييجى اداء لقاء الخميسى اللى ميقلش روعه و اللى كان الmaster scene بتاعها لحظه تعرفها على الجناه فى طابور العرض و اللى ابكانى فعلا<br />و على فكره و كالعاده يا جماعه المسلسلت الفتره الجايه هتمشى كلها على غرار قضيه راى عام و ده بيحصل فى معظم مسلسلات يسرا لانها رغم اى انتقاد فنانه بجد<br />وف النهايه وحشتنى موضوعاتك الجميله يا مروه"
