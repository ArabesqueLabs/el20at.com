text = "حقيقة هذه الدونية المرتبطة بالنصارى هى ارث عريق بمعنى أنه عندما كنا مرى أحد يسخر أحد الرعاع أو السوقة أو يعامله بما هو أهل له و يرحمه البعض الآخر فينادى حرام عليك ده نصرانى أى لا حول له و لا قوة و لاكرامة و لاعرض و لا غيرة ( أكل لحوم الخنزير التى بها هرمونات أنثوية أكثر ب50 مرة من اللحوم العادية بالأضافة لللرث التاريخى من الذل و المسكنة و استعمال النصارى بأى شكل ...............هل فهمت يا كلب اسف هل هززت ذيلك<br />تعلق أخير بخصوص ماذكرت أنك لن تفهمه و لن تستوعبه الأ بقراءة منصفة لهذا الزواج بالأضافة الى الحكمة من و راءه"
