text = "والله انت ما تعرف اى حاجه عن الاسلام ويا ريت ما تجرح فى رسول الله لان ده اشرف من وجود على الارض لقيام الساعه وانا امرت من دينى ومن رسولى الى احترام الاديان الاخرى وانا اعترف بها ولكنى متيقن ان الدين عند الله هو الاسلام وانا موسى رسول الله وانا عيسى رسول الله وكلن على الاسلام انا بصراحه كان نفسى امسخرك شويه بس انا حسيت ان انت حيوان المفروض ان الواحد ما يردش عليه بس ده رسول الله اللى انت بتجرح فيه يا حيوان"
