subject = "يا كلب"
author = "الدميرى"
posted = "2008-02-14"
text = "يوم كانت العزه للاسلام ارسل المعتصم بالله لملك الروم رساله ابتداها بقوله(الى كلب الروم......)<br />الرسول اللى انت بتتكلم عنه رجل استطاع ان يؤمن به اكثر من نصف الكره الارضيه فى اقل من25 سنه<br />والدين اللى بتتكلم عنه دين عمر بن الخطاب اعظم 4شخصيه على عمر البشريه كما قال مايكل فى كتابه العظماء مائه<br />والبنت اللى انت بتقول عنها6 و9 سنين عندنا ثالثة الرواه الثقات افضل ان تقرا سيرتها وتفهمها لو كنت بتفهم<br />وبعدين 9سنين عشان هى كانت بلغت واجسامهم غير اجسامنا وسن زواجهم كان هو دا فى تلك الحقبه من الزمن<br />للاسف انت عامل زى الطور الهايج اومثل المثل الذى شبه الله به اليهود فى سورة الجمعه لو عايز تعرف ليه ابأ اسال اى انسان بيفهم يا عم الفليسوف"
