subject = "من الآخر"
author = "محمود"
posted = "2007-10-05"
text = "أحب أقول للي بيشجعوا يسرا إن الله تعالى يقول: {إِنَّ الَّذِينَ يُحِبُّونَ أَن تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ} (19) سورة النــور<br />وهي والممثلين اللي زيها من أمثال اللا (عادل) واللا (إمام) بينشروا الفحش والعري في أفلامهم وخصوصا عادل إمام مع يسرا وأمثالها .. فكيف تكون يسرا هي الشخثية التي تناقش قضايانا .. كفانا خبل .. ورجعية (مظهرها حضاري) ..<br />أما الأخ اللي قال إن يسرا اغتصبت وكمان قال عدد المرات .. مكانش ليها لازمة الكلمة .. لكن انتوا مش شايفين أما عادل إمام يبوس يسرا وينام معاها سرير واحد ملتصقين وعريانين و يقولها زوجتك نفسي .. مش كده يبقى زنوا ؟؟"
archived = "2010-03-14"
capture_url = ""

