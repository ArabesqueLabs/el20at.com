subject = "موجه لرجل واقعي"
author = "مش مهم"
posted = "2007-10-09"
text = "لست رجلا و لست واقعيا. طبعا واضح انك فعلا نصراني,ليه زعلان من اللي رد عليك انت استخدمت اسلوب خبيث فعلا و مستفز لكنه مكشوف. الموضوعيه انك تقرأ الموضوع من وجهات النظر المختلفه و بعدين تحكم. لكن انت قرأته من وجهة نظر مغرضه و حكمت و ده الجهل بعينه . يا اسمك ايه دي كانت حاجه عاديه جدا في وقتهم اذا كان من 20 سنه بس فرق 10-15 سنه عادي بين الزوجين يبقى بالعقل كده من قرون كان الموضوع عامل ازاي؟ ده غير ان نضوج الشباب كان مبكر جدا بالنسبه لمقاييس عصرنا . يعني كان الشاب يقود جيش و عمرة17 سنه! دلوقتي ولا حتى 40سنه يحصل لواء. شفت ان ده منطقي؟ عموما ربنا يهديك و بالنسبه لان دي ارض النصارى فدول شافوا العلم و النور و العدل على ايدي المسلمين لان ببساطه هم ده الاسلام , و متقارنش بعصرنا الحلي المليئ بالظلم و الفساد . اقرأ تاريخ بس يكون كتاب موضوعي يضيف معلومه مش كتب جهل و هجوم على الغير زي اللي بتقرأها."
archived = "2010-03-14"
