text = "السلام عليكم<br />انا قبل ما اعلق على الموضوع مستغربة جدا لطريقة الحوار بين المعلقين ومش عارفة ليه هى متدنية لهذه الدرجة اولا اللى يقول حاجة زى (رجل واقعى) مش لازم نرد عليه كده نفهمه الصح ايه ولا نسبه واحنا مسلمين وعارفين لغة الحوار الراقى بيننا وبين غيرنا حتى رسول الله صلى الله عليه وسلم كان يرد على الكفار بغاية الادب والاحترام وما كان يسبهم انا فاهمة ان الانسان اوقات بيتعصب لكن نحاول ما نغلطش فى حد علشان نتأسى برسول الله صلى الله عليه وسلم<br />اما عن المسلسل فقصته واقعيه جدا وجميل بس حسه بشويت مثالية فى المسلسل"
