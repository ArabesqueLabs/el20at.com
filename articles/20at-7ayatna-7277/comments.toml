[[comments]]
order = 23
subject = "الرسالة موجهة لـــ (مصرى صاحب البلد)"
author = "رجل واقعي"
posted = "2007-10-10"
text = "وحدة وحدة<br />أولاً : (أن النصارى لا حول لهم ولا قوة) أقول لك...لنا الله وإبنه بالروح القدس<br />(أُوْلَئِكَ الَّذِينَ أَنْعَمَ اللَّهُ عَلَيْهِم مِّنَ النَّبِيِّينَ مِن ذُرِّيَّةِ آدَمَ وَمِمَّنْ حَمَلْنَا مَعَ نُوحٍ وَمِن ذُرِّيَّةِ إِبْرَاهِيمَ وَإِسْرَائِيلَ وَمِمَّنْ هَدَيْنَا وَاجْتَبَيْنَا إِذَا تُتْلَى عَلَيْهِمْ آيَاتُ الرَّحْمَن خَرُّوا سُجَّدًا وَبُكِيًّا) سورة مريم - سورة 19-آية 58<br />ثانياً : بالنسبة (لأكل لحوم الخنازير) يبقى أسهل من الإستحمام ببول الإبل.<br />\"عَنْ اَنَسٍ اَنَّ نَاسًا، اجْتَوَوْا فِي الْمَدِينَةِ فَاَمَرَهُمُ النَّبِيُّ صلى الله عليه وسلم أن يَلْحَقُوا بِرَاعِيهِ ـ يَعْنِي الاِبِلَ ـ فَيَشْرَبُوا مِنْ اَلْبَانِهَا وَاَبْوَالِهَا، فَلَحِقُوا بِرَاعِيهِ فَشَرِبُوا مِنْ اَلْبَانِهَا وَاَبْوَالِهَا\" (صحيح البخاري، كتاب الطب)<br />\"إذا وقع الذباب في إناءِ أحدكم فليغمسه كلُّه ثم ليطرحه فإنّ في أحد جناحيه شفاء وفي الآخر داء\". (رواه البخاري في كتاب بدء الخلق).<br />عن أبي هريرة، قال محمد: \"من حق الزوج على الزوجة أن لو سال منخراه دماً وقيحاً وصديداً فلحسته بلسانها ما أدّت حقه!\"<br />ثالثاً : (تصفني بالكلب) ليس غريباً عليك هذا الكلام فهو يعكس مدى الرقي في الإسلام<br />أُهنّئك فأنت تُحاورني و تفهم لُغتي إذا فأنت كلب<br />رابعاً : ما الحكمة في زواج رجل عجوز من طفلة لا يظهر عندها الأعضاء الإنثوية حتى...<br />ألا تسمّي ذلك (شذوذ جنسي) ألا تشبه هذه الحادثة (الزواج من غلام) \"طفل\"<br />(أنار الله عقلك)"
archived = "2010-03-14"
capture_url = ""

