text = "أولاً : عندما تقول عني (نصراني الكلب) هذا دليل على إنفعالك الناتج من صحة كلامي ودليل دامغ عن الدين السيئ والبيئة الأسوء التي تربيت بها. (لن ألومك).<br />ثانياً : أنصحك بقراءة التاريخ جيداً حتى تعلم أن أرض الإسلام التي تتكلم عنها غير موجودة أصلاً , لأن الأرض التي تقف عليها الآن هي أرض للنصارى قبل أن يولدوا أجدادك وأنتم غرباء عليها ومحتلّين لها وستبقى للنصارى مهما فعلت أنت وأمثالك من الجاهلين للتاريخ. ( ربنا لا تؤاخذنا بما فعل السفهاء منا )"
