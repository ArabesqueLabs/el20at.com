[[comments]]
order = 29
subject = "رد لرجل واقعي ومن يرد عليه"
author = "Allah Lover"
posted = "2007-10-19"
text = "مبدئيا السلام عليكم جميعا ... تاني حاجة الأخ رجل واقعي ... حضرتك بترد على موضوع مسلسل وترمي لكلام عن شيء اخر ملوش علاقة .. وسواء الرسول (صلى الله عليه وسلم ) سيرته وحياته عجباك او مش عاجباك فالمفروض احترامك للآخر يمنعك عمن الأسلوب الي اتبعته ... عموما لو تحب ارد على نقطة نقطة من الي حضرتك كتبتهم انا مستعدة ... ولكن لا يليق برسول الله اننا نتكلم عنه بعد كل الأسلوب الغير حضاري الي حضرتك استعملته لو تحب تكتب في مكان لسة متوسخش بالأسلوب ده اهلا وسهلا وانا وكتير غيري نعرف نرد كويس خصوصا انك كتاب كلام اي مسلم بمعلومات سطحية جدا ممكن يرد عليه ...<br />الإخوة الي ردو على الأخ رجل واقعي ... انا اسفة بس لو الواحد تضايق ان في ناس بتتكلم عن رسول البشرية عليه افضل الصلاة والسلام بأسلوب غير مهذب ميتردش عليهم بنفس اسلوبهم احتراما لدين الله ورسوله<br />جزاكم الله خيرا :-) ويا اخ رجل واقعي ... مجددا لو تريد النقاش النقاش ليه مكانه واسلوبه الطيب مش الأسلوب ده"
