order = 24
subject = "للواقعى"
author = "واحد من  الناس"
posted = "2007-10-10"
text = "يا استاذ يا واقعى هوالاستشهاد بدين غير الدين مش كفر بالدين؟هو انت مش بتستشهد بايات القران واحاديث الرسول والقران بيقول (لقد كفر الذين قالو ان الله هو المسيح ابن مريم)وبيقول برضو(وما قتلوه وما صلبوه ولاكن شبه لهم)يعنى انت بتستشهد بجزء من كتاب ربنا اللى بيكفرك طب ازاى؟هو انتو مش فى حاجة عندكو تثبت عقيدتكو وبعدين هو فى كفر اكتر من كفر الجزء اللى بيتكلم عن نبى من انباء الله عليه وعلى سيدنا محمد الصلام والسلام الجزء دا بيقول ان النبى دا اختللى ببناته الاتنين وزنى بيهم وبتتلو الكلام دا عندكو فدور العبادة بكل فخر وموضع كوكى اللى اتنشر بالصور وما خفى كان اعظم بس هاقولك على حاجة فى ايه عندنا بتقول (ولا تهنو ولا تحزنو وانتم الاعلون ان كنتم مؤمنين ان يمسسكم قرح فقد مس القوم قرح مثله وتلك الايام نداولها بين الناس وليعلم الله الذين امنو ويتخذ منكم شهداء والله لا يحب الظالمين وليمحص الله الذين امنو ويمحق الكافرين) طبعا الايات دى مش ليك دى للى بيرد عليك وبيتكلم معاك وبيجيب الاذى للدين على لسان اللى زيك وحسبنا الله ونعم الوكيل"
archived = "2010-03-14"
