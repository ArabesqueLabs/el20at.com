[[comments]]
order = 25
subject = "الرسالة موجهة لـــ ( مش مهم )"
author = "رجل واقعي"
posted = "2007-10-10"
text = "تقول بأنني (لست برجُل ولست بواقعي)<br />أقول لك: أولاً: من أنت لكي تقيّمني...حتى بإعترافك أنت تدّعي أنك(مش مهم).<br />ثانياً: لنفترض أنني إستخدمت (إسلوباً خبيثاً) كما تدّعي, إذاً لماذا كل هذا الإحتقان و الغضب؟ طالما أنكم لا ترونَ في هذه القصة أي شيء مخجل أو مُشين.<br />ثالثاً: أنا من ينصحك بقراءة الكتب الصحيحة والصادقة,وإيّاك وكتب التاريخ المدرسية والجامعية الصادرة من المنهاج الدراسي الخاص بالدول الإسلامية فهي مضللة وتفتقر للصحّة.<br />رابعاً: تقول أنا الزواج المبكّر كان شيئ عادي في ذلك الزمان وكان الفرق ب 15 عاماً بين الزوجين أمر عادي.<br />(أنا موافق على كلامك). لكن رجل عمره 60 عاماً يتقدّم للزواج من فتاة عمرها 6 سنوات ويدخل عليها وعمرها 9 سنوات أي أن الفرق 54 عاماً,<br />هذا أمر غير عادي في أي زمن من الأزمنة وأنا أكيد من أن هذا الشخص مريض نفسي.<br />خامساً: بتقول أتى الإسلام ب (علم و نور و عدل)<br />علم: ألم يكن هناك علم قبل الإسلام؟؟؟ إنت بتستعبط ولا إيه؟, فين راحو الفراعنة؟ و حضارة الأنكا؟, و كل عظمة روما وماكانش فيها علم؟ والله إنت يلي ما عندكش أي علم بلّي حصل.<br />نور: عفواً مفهمتهاش ديه.<br />نجي بئاه للعدل: ـ يقول محمد إنه نُصِرَ بالرعب<br />‏‏قال محمد:‏ ‏ \"أحلت لي الغنائم ولم تحل لأحد قبلي ونصرت ‏ بالرعب ‏‏فيرعب العدو وهو مني مسيرة شهر.. ‏(مسند أحمد)<br />ـ يقول محمد إنه جاء الناسَ بالذبح<br />قال محمد: أتسمعون يا معشر قريش، أما والذي نفس محمد بيده، لقد جئتكم بالذبح (مسند أحمد ـ وصحيح بن حيان)<br />قال‏ محمد:‏ والذي نفسي بيده ما أرسلت إليكم إلا بالذبح.. (فتح الباري شرح صحيح البخاري)<br />ـ إدخال الناس في الإسلام والسلاسل في أعناقهم<br />عن أبي هريرة: كنتم خير أمة أخرجت للناس، قال: [أي كنتم] خيرَ الناس للناس تأتون بهم بالسلاسل في أعناقهم حتى يدخلوا في الإسلام! (صحيح البخاري)<br />ـ القتال هو أمر من الله<br />\"كُتِبَ عليكم القتال وهو كرهٌ لكم وعسى أن تكرهوا شيئاً وهو خيرٌ لكم وعسى أن تحبوا شيئاً وهو شـرٌّ لكم والله يعلم وأنتم لا تعلمون. (البقرة 2 : 216)<br />(لاحظ في هذه الآية أن الإسلام جاء يبدّل طبيعة الإنسان من المسلم إلى طبيعة عدوانية حيث يعلّم الذين يكرهون القتال أن يحبّوه لأنه خير لهم!)<br />ـ اقتلوا المشركين حيث وجدتموهم:<br />\"فإذا انسلخ الأشهر الحرم فاقتلوا المشركين حيث وجدتموهم وخذوهم واحصروهم واقعدوا لهم كل مرصد فإن تابوا وأقاموا الصلاة وآتوا الزكاة فخلوا سبيلهم إن الله غفور رحيم.\" (التوبة 9 : 5)<br />ـ عَنْ اَبِي هُرَيْرَةَ أنّ محمداً قال: ‏\"اِنَّ اَثْقَلَ صَلاَةٍ عَلَى الْمُنَافِقِينَ صَلاَةُ الْعِشَاءِ وَصَلاَةُ الْفَجْرِ وَلَوْ يَعْلَمُونَ مَا فِيهِمَا لاَتَوْهُمَا وَلَوْ حَبْوًا وَلَقَدْ هَمَمْتُ اَنْ امُرَ بِالصَّلاَةِ فَتُقَامَ ثُمَّ امُرَ رَجُلاً فَيُصَلِّيَ بِالنَّاسِ ثُمَّ اَنْطَلِقَ مَعِي بِرِجَالٍ مَعَهُمْ حُزَمٌ مِنْ حَطَبٍ اِلَى قَوْمٍ لاَ يَشْهَدُونَ الصَّلاَةَ فَاُحَرِّقَ عَلَيْهِمْ بُيُوتَهُمْ بِالنَّارِ‏\"‏. (صحيح مسلم، كتاب المساجد ومواضع الصلاة)<br />أنـــتـــبه: الظلم والفساد لم يكن موجود في عهده فقد أتى للناس بالعدل و (المحبة) أيضاً.<br />يا أُستاذ: (مش مهم)<br />أنار الله عقلك."
