[[comments]]
order = 0
subject = "شرطة الحاكم"
author = "ابو اسامة"
posted = "2007-06-11"
text = "يوم بعد يوم تثبت الشرطة المصية انها خائنة بطبعها فهى مع الحاكم ضد الشعب دائما فها هى من عصر حكام<br />الترك ثم الانجليز البوليس السياسى كانوا كلهم مصريين ولكنهم يتعاونون مع الانجليز ثم الثورة وحدث ولا حرج<br />ثم اسوأعهود الحكم فى عصر الطاغية مبارك حيث لا مدراة كله عينى عينك ."
archived = "2007-06-16"
capture_url = "https://web.archive.org/web/20070616231900/http://masr.20at.com:80/newArticle.php?sid=10603"

[[comments]]
order = 1
subject = "مقاطعة الانتخابات"
author = "بنت مصرية"
posted = "2007-06-11"
text = "هنقول اية غير حسبنا اللة ونعم لوكيل على كل ظالم ومفترى وكل من يساندة واقول للاخوان لية شتركوا فى هذة الانتخابات وانتم تعلمون بما سيحدث مسبقا وكان الافضل هى مقاطعة الانتخابات وحتى لاتعطوا شرعية للانتخابات وللتعديلات الدستورية التى طبخت سابقا وانا عن نفسى وكل منطقتنا قاطعنا هذة الانتخابات رغم محاولات انصار الحزب الوطنى للذهاب للجان الانتخابات دون جدوى حتى لانكون محلل لما سيحدث من زوير"
archived = "2007-06-16"
capture_url = "https://web.archive.org/web/20070616231900/http://masr.20at.com:80/newArticle.php?sid=10603"

[[comments]]
order = 2
subject = "الصورة اللى فى اول المقال بتبرهن ان الريس هو محور"
author = "محدش لية دعوة"
posted = "2007-06-12"
text = "العالم كلة تفرج على التزوير عينى عينك فى التلفزيون عموما يابختك ياريس على الحزب اللى انت بترئسة وادى انت شفت الاصوات اللى بتئيد حزب حضرتك بتنزل الصناديق ازى وتقفل وتسود بحراسة الامن والبلطجية وفى الاخر تقولى اغلبية اغلبية اية يابا"
archived = "2007-06-16"
capture_url = "https://web.archive.org/web/20070616231900/http://masr.20at.com:80/newArticle.php?sid=10603"

