[[comments]]
order = 4
subject = "عــــــــــــــورة نـــــــظـــــــــــــــام  مــ"
author = "مصري بن مصري بن مصري"
posted = "2007-06-13"
text = "كل نظم الحكم العربية كلها ديكتاتورية لقد غلبت كل الحكومات الغربية الاستعمارية القديمة<br />لكن نظام السيد الرئيس مبارك فهو الأشد في المنطقة .<br />أين وعودة بالاصلاحات بعد الانتخابات الرئيسية التي وعد بها . ولا إحنا كنا طرش وعمي وبكم<br />نعم كل شيء في مصر مسخر لخدمة الخليفة الأوحد والعائلة الكريمة التي أنعم الله علينا بأن أحدهما سيتنازل ويفكر في أن يحكم هذا الشعب المسكين الذي لولا هذه الأسرة لضاعت مصالحة . نعم هذا صاحب لجنه السياسات ذو العقل المستنير الذي يرى في نفسه أحقيه حكم هذه البلاد بعد تخرج الرئيس من الدنيا ...<br />نعم نحن في عصر أشد ما يكون قريب من عصور الظلام كل وسائل الاعلام في مصر مجيشه لخدمة هذه العائلة التي هى صفوة المجتمع والذي لم ولن يأتي القدر بمثلها فقد أصبحت مصر عقيمه لا ولن تلد بعد اليوم . فالأسرة الكريمة هى أخر شيء . خلاص بح .<br />لكن أقول لن ولن تخضع مصر أبدا فمهما حاول مبارك وزبانيته من قتل افكار الاصلاح فلن يستطيع الشعب المصري معدنه أصيل مهما يجور عليه الزمن فأنه سيعود ويحكم نفسه بنفسه .. ألا يعتبر رئيسنا المبجل ممن سبقوة ومن التاريخ .<br />المهمن<br />لماذا رفض اقامة الجسر بين مصر والسعودية<br />لماذا تجويع الشعب<br />لماذا القهر والظلم<br />لكل ظالم نهايه ..... .<br />لمن يريد معرفة مصير مـــــــــصــــــــــــــــــــــــــر يقرأ كتاب البوابة السوداء لأحمد رائف الذي ألفه قبل 30 عاما ."
archived = "2007-06-16"
capture_url = "https://web.archive.org/web/20070616231900/http://masr.20at.com:80/newArticle.php?sid=10603"

