subject = "صلنع المجد"
author = "اسراء الشناوي"
posted = "2008-06-21"
text = "لقد صنع الاستاذ بصمة ادبيه عربيه ووضع بسمة علي شفاه السينما00 من لم يصنع جدلا ويحرك المياه الراكده فهو لايكون اديبا كما لاتنسوا ان الظروف السلطويه التي ينشر في ظلها اصحاب الرأي افكارهم احيانا تحت القمع والقهر لها دويها المؤثر فكم من كتابات لم تنشر حتي الان برغم مرور زمن علي كتاباتها وكم من صاحب قلم سجن و مات حتي ان مؤيدوه خافوا تشييعه 00التاريخ مليء بالاحداث00احسان عبد القدوس اديب رائع وقد تعلمنا منه الكثير 000 ارفعوا ايدكم عن رموز الاادب"
archived = "2010-03-14"
