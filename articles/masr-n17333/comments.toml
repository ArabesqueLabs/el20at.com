order = 0
subject = "جاسوس بدوى بيعد الغنم فى سيناء - الغنم النووى الخا"
author = "ها ها ها"
posted = "2008-08-24"
text = "بدوى هيتجسس على اية فى سينا هيعد الغنم النووية التى بتاكل حشيش فى المرعى<br />والا يمكن بدوى اركان حرب بمقصين وسيف وجناح<br />اذا كان لدى اسرائيل اقمار صناعية بتصور كل طوبة فى مصر وبتصور مش عارف مين بالمايوة على الشط<br />دى حتى جوجل ممكن تعرف منة كم طيارة واقفة فى مطار الماظة وانت قاعد فى البيت<br />وهتروح بعيد لية فية خبراء زراعة يهود فى مزارع بلبيس وبجوار القواعد الجوية<br />وفية فى كل وزارة مكتب تابع امريكا للتطوير والاشراف على مصاريف المعونة الامريكية وكلهم يهود وعارفين خبايا الوزارات<br />يبقى بدوى هيتجسس على اية<br />كم فى معتقلات مصر من المظلومين الملفق لهم تهم<br />ولكنة الغباء"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060052/http://masr.20at.com:80/newArticle.php?sid=17333"
