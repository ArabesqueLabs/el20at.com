subject = "شوية انصاف لبلدك يا باتيستوتا"
author = "محمد البرادعى"
posted = "2007-06-03"
text = "على فكرة يا باتيستوتا الكاتب مش مصرى الكاتب لبنانى واذا مكنتش شايف ان العرب بيتنططوا علينا لمجرد انك بتكره مبارك يبقى حتروح تقبض من السعودية زى ماناس زمان قبضت من ليبيا القذافى من فرط كرههم للسادات المتصهين .. اللى مش شابف ان العرب مزودينها معانا لما تساعدهم يقولم الفراعنة عايزين يحكومنا ولما تسيبهم يقولك اين الشقيقة الكبرى بتاعه كابريهات شارع الهرم .. اللى ميشوفش ده .. يبقى فعلا نفسيته نفسية مستوطن فى مصر مش مواطن مصرى"
archived = "2010-03-14"
