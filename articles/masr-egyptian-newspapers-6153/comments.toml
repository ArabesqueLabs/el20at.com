text = "مصر التى تتحدث عنها فى نهاية المقال ليست مصر ذات 30مليار دولار وليست مصر المدخرة قمحا لعامين انها مصر مبارك وكفى فلاداعى للتفصيل فكل طفل فى بر مصر يعرف ماذا تعنى مصر مبارك ."
