[[comments]]
order = 0
subject = "جشع غير مبرر"
author = "فالح"
posted = "2008-08-31"
text = "فى دول الخليج لا يوجد رقابة على الاسعار ولكن الجشع غير موجود اطلاقا ولا يقبل اى تاجر ايا كان مستواة ان يزيد ربحة عن عشرة فى المائة<br />ولكن الاستغلال البشع لحاجة الناس وزيادة الاسعار زيادة غير مبررة تستلزم الضرب بيد من حديد على التجار المستغلين ويجب ان تتدخل الدولة لحماية الناس حيث ان الناس اصبحوا مرهقين ماديا ووصل الامر الى الحلقوم"
archived = "2010-03-14"
