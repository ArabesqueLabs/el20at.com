[[comments]]
order = 1
subject = "الى المعلق السابق"
author = "مش فالح"
posted = "2008-09-01"
text = "انت بتقول في تعليقك<br />وزيادة الاسعار زيادة غير مبررة تستلزم الضرب بيد من حديد على التجار المستغلين<br />يا استاذ فالح انت بتقول الضرب بيد من حديد والحديد كله بقى عند احمد عز والتجار المستغلين هما رجال الاعمال والحكومة بتاعتنا زي ما انت عارف حكومة رجال اعمال يبقى مين حيضرب مين ومين حيستنجد بمين<br />كل سنة وانت طيب يا استاذ فالح وربنا مع الشعب المسكين اللي مش لاقي يجيب حق الدوا علشان خاطر يتعالج<br />العلاج في مصر استثمار يا استاذ فالح<br />سلام يا استاذ فالح"
archived = "2010-03-14"
capture_url = ""
