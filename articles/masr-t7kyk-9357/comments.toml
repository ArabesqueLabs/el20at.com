[[comments]]
order = 0
subject = "ولا يعلم احد ماذا تأتى بة المقادير ؟"
author = "شايف"
posted = "2008-06-17"
text = "هل كان فى تخيل اى بشر ان يأتى السادات بعد عبد الناصر رئيسا وهو ما كان يطلق علية عبد الحكيم عامر البربرى ؟<br />اظن ولا فى الاحلام<br />ثم يأتى بعد السادات حسنى مبارك وقد كانت اقصى امانية ان يعين سفيرا فى لندن ويعيش عيشة الاكسلانسات حسب كلامة هو لمدة سنتين او ثلاثة<br />لا احد يعرف<br />ذلك كلة رهن المقادير<br />قد يأتى ضابط من الدولة ويركب الكرسى فامن الدولة اقوى من الجيش<br />وقد يأتى ضابط من الامن المركزى ويحرك القوات ويسد الشوارع ويحاصر المحافظات ويستولى على الحكم<br />على العموم التركة ثقيلة<br />والبلد داخلة على المجاعات والفوضى نتيجة الفقر<br />وسيه جم الفقراء والجوعى المحلات كما حدث فى محلات الدهب وسينهبوت المعارض كما حدث فى بغداد<br />على العموم تنتظر البلد ايام سوداء قادمة<br />ولن ينفع اى امن ولا اى حل<br />والنهب العام قادم<br />والبلد التى فى الفريزر 30 سنة لابد ان تنفجرا"
archived = "2010-03-14"
capture_url = ""

