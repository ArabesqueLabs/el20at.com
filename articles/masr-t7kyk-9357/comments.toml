author = "عامر العبادى"
posted = "2008-06-18"
text = "لمصلحة مين كل هذا الضجيج والتخريب العقلى الاخ كاتب الكتاب مش عجبة حد خالص لا الرئيس جمال ولا الرئيس السادات ولاالقائد الزعيم حسنى مبارك ولا اى حد انت عايز مين بالزبط احكم انت والا خوان وعملاء الصهيونيةوخربو مصر زى العراق مش عجبكو حاجة خالص انت لو رجعت وراء شوية قبل عصر مبارك عصر الحريات كنا معرفناش لك اثر سيبو مصر فى حالها ما تخربوهاش والدليل العراق وافغانستان والسودان وفلسطين بلا اخوان عملاء الامريكان وكل واحد يخلية فى مهنتة بلاش فتنة يامصرى دى برضة بلدنا ام البلدان والى يجىرئيس مكتوب عند الرحمن ارجوكم خليها تعدى بسلام قولو امين امين"
