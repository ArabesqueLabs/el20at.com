subject = "لا الاخوان ولا  الجيش ولا جمال ولا علاء ولا سوزان"
author = "اقول لكم"
posted = "2008-06-17"
text = "الفوضى هى التى ستحكم مصر<br />اسرائيل ستعود الى منتصف سيناء<br />وسيتم ترحيل الفلسطنيين من غزة الى سيناء لتوطينهم هناك فى حاجز بشرى بين مصر واسرائيل<br />وستعين امريكا ضابطا شبية بحكومة المالكى فى العراق وحكومة افغانستان ابو عباية خضراء<br />وسترسل دول الاتحاد الاروبى قوات تنزل من الساحل الشمالى فى مكان مناورات النجم الساطع التى تدربوا عليها معنا فى مناورات مشتركة<br />وسيتم النهب والسرقة والقتل من اجل رغيف الخبز<br />وسيقود عمليات النهب والفوضى مجندوا الامن المركزى<br />انة مستقبل اسود<br />اوصلنا الية شخص متخلف عقليا"
archived = "2010-03-14"
capture_url = ""

