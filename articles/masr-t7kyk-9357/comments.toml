posted = "2008-06-17"
text = "لامحالة النهاية اتية ولكن ان لم يتدخل القادة المخلصين للشعب فسوف تكون نهاية للجميع<br />فسوف يتدخل كل من له شان ومن ليس له فى شؤننا وسعم الفوضى وسيدخل اعدائنا من اليهود<br />بحجة حماية مصالحهم الله يخرب بيته اللى عملهم مصالح وهو الغاز كما تعلمون الذى يمر عبر اراضى سيناء<br />شوفتو ا المصايب اللى اتجمعت على ايد مبارك وحاشيته ."
