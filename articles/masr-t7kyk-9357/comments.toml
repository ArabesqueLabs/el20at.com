text = "اشكر الصجفي احمد البهنساوي علي مجهوده الكبير في عرض الكتاب ، وعرضه يشكل فال حسن وبشري خير في وقت اظن وليس كل الظن اثما ان الايام الخيرة لمبارك هانت جدا ، نظام يقوده رجل بهذه العقلية ، وأفراده علي شاكله احمد عز وحبيب العادلي وجنودهما يؤكد ان النظام لن يستمر طالما استمر أهالي دمنهور يفضحون النظام في الاتخابات وطالما استمر اهالي البرلس ينتفضون من أجل حقوقهم وطالما استمر اهالي المحلة في منهجم المشرف ..<br />مصر قربت من النصر طالما هناك اخوان وكفاية وغد ووفدين شرفاء و تجمعيين احرار ، وصدقوني هانت جدا والايلام بينا والله مع المظلومين دائما ..."
