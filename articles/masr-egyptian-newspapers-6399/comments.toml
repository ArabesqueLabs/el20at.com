text = "مقال طويل ومكنشى له لازمة الشوية الى تحت لان كلام الجرايد الرسمية لا تعبر الا عن راى الحكومة ومردود عليه<br />بحديث عن الرسول بانهم اذا لم ياخذوا على ايدى الخونة والفاسدون لغرق الجميع فلا مانع من قتل عملاءوخونة لكى ينجوا الجميع وكل ما اعجبنى طبعا هو تعليق عظماء الكتاب فى عصر بيع كل شىء وهما فهمى هويدى وابراهيم عيسى.<br />على فكرة يا اخ محمد السيد انا معجب بتعليقاتك ويا ريت تراسلنى على الاميل. OS_MO_6"
