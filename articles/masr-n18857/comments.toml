[[comments]]
order = 0
subject = "اسهم احسن من مفيش"
author = "احمد ابوصالح"
text = "يا استاذ نا اية المشكلة بجانب كل القولتة ان الشعب ياخد ايهم بردة حتى لو كان هيبعها او يستثمرها مش احين من مفيش هو لية لما الحكومة تنوى عمل اى شىء لازم التشكيك على طول واللة انا مش بحب الحكومة وبكرها بس انا شايف مفيش مشكلة ان الناي تحصل على اسهم اية فلوس بردة احسن ميبعوا والشعب يطلع من المولد بلا حمص<br />ليس التشكك فى كل حاجة هو الحل"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218144155/http://masr.20at.com:80/newArticle.php?sid=18857"

[[comments]]
order = 1
subject = "الى احمد ابو صالح"
author = "مش احمد ابو صالح"
text = "انت حضرتك بتشتغل في جرنان ايه<br />وبعدين اللي خلا الناس مش مصدقه اسلوب عرض الموضوع<br />المفروض الحكومة تحضر الموضوع وتقول للناس تعالوا استلموا الاسهم بتاعتكم<br />يعني مثلا لما رب الاسرة يقول في الصيف لاسرته انا قررت اننا نصيف في اسكندرية السنادي<br />فالاسرة فرحت ولاكن ما فيش اي اجراء عمله الاب يدل على صدق كلامه<br />كذلك الحكومة قالت انها حتوزع ا سهم لكن مفيش اي دليل على انها حتوزع حاجه<br />اهو الموضوع بقاله شهر اهو وخلصنا على كده"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218144155/http://masr.20at.com:80/newArticle.php?sid=18857"
