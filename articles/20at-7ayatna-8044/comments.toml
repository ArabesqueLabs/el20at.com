subject = "متفق معاك"
author = "زكريا الدرديري"
posted = "2008-01-17"
text = "أنا متفق معاك جداً على فكرة في مصر يا تحب يا تقب والحياة ليها لون واحد، وعلى شط النيل أصبحت تتكاثر القمامة بعد أن تخلت الدولة عن دورها في حماية المستهلك، ومع ذلك لا زالت الدولة تقوم بإضافة 9 جنيه زبالة على فاتورة الكهربا.. وده شيء زاد عن حجمه.. انا كمان بانصح بالهجرة لليابان..<br />وبعدين يعني ايه \"لا تحمد الله على ما لديك وتجري\" استغفر الله العظيم.. يعني الواحد مايقولش الحمد لله على النعمة اللي هو فيها ؟.. ده غير ان الجري من أفضل الرياضات اللي الواحد ممكن يمارسها في مصر.. وياريت ماحدش يفهمني غلط..<br />سلام بقى.. لحسن ماوراييش حاجة خالص ولازم الحق.. تيك كير"
