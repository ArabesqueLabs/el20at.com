[[comments]]
order = 1
subject = "أمحق تربية"
author = "الديموقراطي"
posted = "2008-11-12"
text = "أنت غانية وممثلة إغراء بكل ما تحمله الكلمة لكن المؤسف ان والدك ديوث فليس منك أو منه رجاء<br />السؤال الأن نوع العلاقة مع والدك هل فيها غواية او تدريب على القبلات<br />لكن الملاحظ أن صفاتك تنطبق على أغلب طلبة وطالبات واساتذة الجامعة الأمريكية<br />تعليم الدياثه فيها بإمتياز الأن"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "يا نهار إسود"
author = "الطير المهاجر"
posted = "2008-11-13"
text = "لم أكن أتوقع على الإطلاق أن يكون هناك بني آدمين بهذه العقلية و بهذا التفكير .<br />ربنا يستر على مصر الأيام القادمة<br />(أنهلك و فينا الصالحون ؟<br />قال : نعم إذا كثر الخبث ).أو كما قال عليه أفضل الصلاة و أزكى السلام"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "بصو في الصورة كويس"
author = "مش ضروري"
posted = "2008-11-18"
text = "فيه واحد ملتحي<br />لحسن يكون من الاخوان<br />اصل الاخوان دلوقتي مودرن خالص وبيحبو التمثيل حتى فيه واحد فيهمي اشاهد بفيلم عمارة يعقوبان<br />والله اعلم"
archived = "2010-03-14"
capture_url = ""

