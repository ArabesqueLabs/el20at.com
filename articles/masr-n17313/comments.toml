[[comments]]
order = 4
subject = "في إطار استعدادات المنتخبين لاستكمال مشوارهما في تصفيات أفريقيا المؤهلة لكأس العالم بجنوب إفريقيا 2010."
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "يا جماعة انتو مكبرين الموضوع ليه<br />دي مباراة ودية علشان خاطر الفريق يعرف اخطائه ويعرف الخلل فين<br />ايه المشكلة<br />ممكن يكون المدرب بيجرب فيها لعيبة مثلا<br />او بيجرب خطة علشان خاطر يشوف حتنفع ولا لأ<br />وممكن وممكن وممكن<br />الاف الاحتمالات"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090630/http://masr.20at.com:80/newArticle.php?sid=17313"

[[comments]]
order = 5
subject = "و لماذا انا اهرب؟"
author = "ممدوح بن زكى حفيد زخارىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىى"
text = "قل لى حقا ؟؟؟<br />انا خائف جدا جدا جدا يا ماما تعالى شوفى اللى جرالى و هيجرالى؟؟؟؟؟<br />هو انا الحرامى اللى سرق فلوس الدعاية لدورة ال 12 صفر بتاعة جنوب افريقيا او انا من الحرامية بتوع بعثة فضيحة بيع كرامة مصر و نشرها على سور الصين العظيم؟؟؟؟؟<br />و لا انا من ضمن الجماعة اللى باعو سمعة و كرامة مصر فى السودان و انهزموا من اجل عيون ال 35 عربية الرشوة اللى تم اهدائهم ليهم اللة يلعنهم فى كل كتاب و اوان و مكان العصابة اللى مصر استئمنتهم على شرفها و اسمهااااااااااااااااااااااااااااااو كرامتهاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا؟<br />باللة قلى اطال اللة فى عمرك و ستركم دونيا و اخرة<br />و سلملى على الرياضة اياهاااااااااااااااااااااااااااااااا ( اللى بالى بالك) ؟<br />مع جزيل احترامى للنجم محمد سعد"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090630/http://masr.20at.com:80/newArticle.php?sid=17313"
