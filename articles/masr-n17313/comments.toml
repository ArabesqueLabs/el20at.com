order = 0
subject = "الفريق بتاعنا كان زعلان على حريقة المجلس"
author = "jh"
text = "استغل السودانيين الموقف وشربوا الفريق بتاعنا حاجة صفراء من قزازة بيضاء حاجة صفرا زى بتوع السيما اللى بتدوخ<br />وبعدين خبطوهم اربعة<br />اربعة بالتمام والكمال<br />ومش عارف هيعملوا اية بعد ما يرجعوا<br />ربنا يستر على ولياة"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090630/http://masr.20at.com:80/newArticle.php?sid=17313"

[[comments]]
order = 1
subject = "الم اقل ان الرياضة فى مصر للاسف اصبحت بيزنس الصيع و النصابين و الحرامية و -----------------------------------و الناس العياذ باللة اياهم؟؟؟"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "اية هزيمة تتكلمون عنها يا عالمظ<br />و اية رياضة هذة التى تتكلمون عنها يا جماعة<br />الم ترون الدورة الالمبية بالصين؟؟؟؟؟<br />الا يوجد عندنا دم انستتر و نختشى و نخلى عندنا شيئى من الكرامة ؟؟؟<br />لقد اصبحت الرياضة فى مصر بيزنس القوادين و الناس العياذ باللة اياهم؟"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090630/http://masr.20at.com:80/newArticle.php?sid=17313"

[[comments]]
order = 2
subject = "لنمنع الرياضة و التمثيل الرياضى فى مصر الى الابد؟ اشرف لمصر و لنا"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "لننمنع التمثيل الرياضى فى مصر على كافة المستويات و فى كافة المجالات ايضا؟<br />و لتحول جميع مخصصات الرياضة اياها الى اية مشاريع انتاجية لصالح ابناء الوطن الباحثين عن عمل يساعدهم على الحياة الكريمة الشريفة<br />و كفى باللة عليكم من بعثات الفضائح المصرية؟؟؟<br />مصر لا تستحق هذة المهانة ؟؟؟؟؟<br />لتكن لنا و ففة شريفة مع النفس و الضمير<br />اتقوا اللة فى مصر سترنا و ستركم اللة دنيا و اخرة يا عباد اللة"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090630/http://masr.20at.com:80/newArticle.php?sid=17313"

