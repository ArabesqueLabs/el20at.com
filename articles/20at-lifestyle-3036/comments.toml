[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "محمد"
posted = "2007-01-19"
text = "اختي..مي<br />بصراحه ربنا يهديه و يعينك...فعلاً هو صعب..<br />ادعيلوا بس الدعااااااااااااااااء الدعااااااااااااااااء الدعااااااااااااااااء (لا يغير القضاء الا الدعاء)<br />و اصبري... ما شاء الله انت فعلاً بنت ناس..مبيصبرش كده غير بنات الناس..<br />ربنا يرزق كل الشباب بواحده في عقلك وأخلاقك و صبرك..<br />\"انما يوفى الصابرون أجرهم بغير حساب\"....<br />و اختلف المفسرين يعني يدخلوا الجنه من غير حساب؟؟؟ ولا ياخدوا حسنات بدون حساب؟؟؟ والإتنين أحلى من بعض..<br />دعائك بس هو اللي هيغيروا.. ولو عرفتي تسافري عمره و تدعيلوا يبقى شيء عظيم..<br />واللي مع ربنا عمره ما يضيع...فمتخافيش..ولا تزعلي<br />أخوكم محمد"
archived = "2010-03-14"
capture_url = ""

