author = "فوق العشرين"
text = "عزيزتي هدى قولي لمي انو في ازواج اقسى من زوجها<br />انا زوجي ضربني مش لاني طلعت من البيت بس لاني فت من عتبة بيتي لعتبة بيت جارتي<br />بقول ضربني وخنقني<br />لم اعد افهم مثلك لماذا يضربني لماذا؟<br />ان يصلوا الى هذه الدرجة من العنف ؟؟؟؟<br />ربنا يعوضنا خير"
