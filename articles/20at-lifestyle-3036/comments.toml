[[comments]]
order = 1
subject = "المرآة"
author = "بنت مصرية"
posted = "2007-01-15"
text = "كثيرا ما نفشل فى رؤية أنفسنا ونحن نتعامل مع الأخرين فلو شاف محمد جوز مى فى مراية ضميره ووجد أنه بهذا الشكل يشجع زوجته على قطيعة رحم ومع من مع أمها وكذلك هلا يمكن أن يتخيل أن زوجته هى الىت تضع العراقيل أمام زيارات مامته أم أن مامته متوفاة وبدلا من أن يستشعر حنان أم زوجته ويتقى الله فيها يقرر أن يحرم زوجته من أمها ، وعلى الجانب الآخر أكيد لو فى تقصير كما يقول محمد فلن تراه مى التى تشعر أنها زوجة مثالية ولا تقصر فى شيئ يا جماعة ياريت كل واحد يضع نفسه مكان الأخرين قبل الحكم على تصرفاتهم ."
archived = "2010-03-14"
