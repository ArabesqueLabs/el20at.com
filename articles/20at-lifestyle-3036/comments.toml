subject = "سؤال"
author = "ريما"
text = "انا بعتقادي دة مرض و عقد نفسية..و الله يكون بعونها<br />بس السؤال الي محيرني يعني مي ملاحظتش وقت الخطبة هاد الجانب من شخصية زوجها؟ انا بعتقادي لشب غالبا ما بعطي مؤشرات على سلوكه بعد الزواج.. اصل صحبتي زوجها من هاد النوع وانا كتشفتومن ايامالخطبةو هي كمان بس تممت الزواج بالرغم من كل محاولات الاهل ومحاولاتنا احنا صحباتها نفركشو وهلا عم تدفع الثمن...دي بتشوف اهلها بالمناسبات السيئة بس.. يعني لو في ميتم<br />و اصلا انا مش فاهمة هلا روحت المول بدها اذن مسبق؟...انا مكنتش بستاذن ابوي عشان اروح المول لاستاذن زوجي و هو كمان ما بحسش نزلتي للمول مشوار بستحق انو اناقشو قبل ما اطلعو... بكفي اني اخبرو انو اليوم انا طالعة وبس<br />بس كلوكومو ان مامتها تيجي عندها باذنو... لا تخنها قوي... عيب... يعتبرها ضيفة<br />و لفوق العشرين ربنا معاكي... ومتستسلميش لهلوضع... انت انسانة و الك كرامتك.. حاولي تغيري بزوجكوبهاي الحالةما الك الا كبير بمون عليه و بسمع كلمتو"
archived = "2010-03-14"
