[[comments]]
order = 4
subject = "لا حول ولا قوة لاا بالله"
author = "شرين (فريدة)"
posted = "2007-03-15"
text = "علي فكرة انا اول ما اتجوزت قابلت مشاكل كتير مع جوزي بسبب الخروج بس انا بصراحة كنت مزوداها شوية انا كنت مرتبطة زيادة عن اللزوم بماما وكنت عاوزة اروحلها كتير وكنت بفضل اعيط انها وحشتني بس هو كان بيقدر ده اوي وكان بيوديني بس المشكلة في ان عندي صاحبات كتير وكلهم عاوزني اخرج معاهم وطبعا ده كان بعدي<br />بس انا لو مكان مي مش حستحمل العيشة ديه خاااااااااااااااااالص ان شاء الله يكون بيننا 100 عيل ربنا شرعلنا الطلاق علشان منعيشش في القرف ده<br />جوزي عارف ان مامتي اهم حد في الدنيا بالنسبة لي وميحطهاش في مقارنة معاه لاني مقتنعة اني عمري ما حفضل زوجي علي امي والحمد لله ماما بتحب جوزي ومتحطتش في المواقف السخيفة ديه ربنا يكون في عونها<br />تصدقي انا حسيت اني حعيط علشان مي"
archived = "2010-03-14"
capture_url = ""

