[[comments]]
order = 0
subject = "اليأس واجرام امريكا هو السئول"
author = "احمد المصرى"
posted = "2008-11-20"
text = "لايحسب هؤلاء على الصومالين الشرفاء الذين ظلمتهم امريكا واعوانها الاشرار ولكن نعود ونقول ماهى الوسيله التى تجعل امريكا تترك هذا الشعب وشأنه يارب انصر المستضعفين من عبادك واهلك من يتكبر على عبادك"
