[[comments]]
order = 2
subject = "من عصا الله فينا لانملك الا ان نطيع الله فيه"
author = "البلقاسى"
posted = "2008-11-21"
text = "الله امرنا الا نبغى على احد ومن عصا الله فينا لانملك الا ان نطيع الله فيه ولكن ننظر لافساد امريكا فى الارض والعالم صامت بين موافق ومستكين لان البطش يتم لبلد ضعيف والذى اضعفها ايضا الامريكان والذى ساعد على ذلك غالبيه العرب سواء بالمساعده او عدم القول لامريكا عودى عن ظلمك فماذا لو فكر بعض الذين لم يجدوا امامهم حلا الا البلطجه والاجرام كما فعل بهم على العالم جميعا ان يقف لامركا حتى تعود عن ظلمها ربما يعود المهاجمين الى رشدهم وتعاليم دينهم وتعالوا جميعا ندعوا للجميع بالهدايه والعوده الى الحق"
archived = "2010-03-14"
capture_url = ""
