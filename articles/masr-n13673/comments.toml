subject = "اريد راى الشرع فى الاتى"
posted = "2008-01-05"
text = "اريد راى الشرع فى الاتى<br />أنا شاب أريد الزاواج وأبحث عن زوجة، وأثناء قيامى باحد الأعمال رأيت فتاة أعجبتنى، ورأيتها أكثر من مره تتردد على هذا المكان، ولكنى لا أعرف كيف أستطيع أن أتعرف عليها وأنا لا أعرف أحدا يعرفها<br />أريد أن أعرف الطريقة التى يجب أن يتبعها المسلم الملتزم فى هذه الأمور؟<br />وشكرا السؤال<br />الحمد لله، والصلاة والسلام على رسول الله، أما بعد:<br />فإن الطريقة التي ينبغي أن يتبعها المسلم في مثل الحالة المذكورة في السؤال هي: أن يأتي البيوت من أبوابها، فيبحث عن أهل المرأة، ثم إذا وثق من دينها وخلقها تقدم لخطبتها عندهم، أما ما شاع في أوساط الشباب في هذا الزمان من محاولة التعرف على الفتاة من غير هذا الباب الذي ذكرناه، فإن له مخاطر على الدين والأخلاق لا تخفى على أحد، والنبي صلى الله عليه وسلم يقول: \" ما خلا رجل بامرأة إلا كان الشيطان ثالثهما\". ويقول أيضا: \" إياكم والدخول على النساء\" فقال أحد الأنصار: أرأيت الحمو يا رسول الله؟ قأل:\"الحمو الموت\".<br />والله جل وعلا يقول: {يا أيها الذين آمنوا لا تتبعوا خطوات الشيطان}. ولا شك أن مقابلة هذا الرجل لهذه المرأة على غير الوضع الذي ذكرناه أولا هي أول خطوة من خطوات الشيطان إلى الفاحشة، نسأل الله السلامة.<br />والعلم عند الله"
