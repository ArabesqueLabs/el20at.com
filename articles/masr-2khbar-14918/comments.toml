text = "فية يافطة مكتوبة على الطريق الزراعى قبل قها مكتوب عليها شانج يانج شن شان بيانج<br />ولما سالت واحد بلدياتى عن معناها<br />قال لى<br />معناها بالصينى<br />طيزك حمراء يا زخارى"
