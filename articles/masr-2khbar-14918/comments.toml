author = "كلة فى غيبوبة"
posted = "2010-01-17"
text = "شركة اجنبية لها كام عامل فى المنطقة بيشتغلوا يقوموا يغيروا علامات الطرق ويكتبوا لغة صينية او عبرية او لغة الواق واق - هو فية احد من المسئولين صاحى<br />كلة فى غيبوبة<br />ويمكن واحد ييجى يحمل تمثال ابو الهول فوق تريلا ويخرج بة من معبر كرم ابو سالم ويركبة فى مدخل تل ابيب<br />كلة فى غيبوبة<br />ويظهر ان نوع البانجو اللى فى السوق مضروب وبينيم الناس وقت اطول<br />يعنى مفيش رتبة من ضباط المرور الاشاوس فات على الطريق وشاف اية اللى علية<br />اة يا بلد"
