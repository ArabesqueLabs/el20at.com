text = "واحد محامي عنده مكتب عايز يحكم مصر<br />دي نصيبة ايه دي<br />وبعدين مزور توكيلات تأسيس الحزب<br />والتهمة ثابته عليه<br />ومراته راحت حضرت مؤتمر منظماه واحدة مشبوهة اسمها وفاء سلطان العلقه بتاعة اقباط المهجر وملحده<br />المهم نرجع لموضوعنا واحد محامي عنده مكتب عايز يحكم مصر<br />امال الجنرالات يعملوا ايه يا ابني يروحوا يبيعوا ترمس بقا"
