author = "المصرى أفندى"
posted = "2008-11-01"
text = "زخارى الخارى بتاع الحزن الواطى رجع تانى. كنا مستريحين من اللى خلفوه ومن ريحته الزنخة. ودايما ييجى يشتم أسياده اللى أشرف من أهله ومن رئيس العصابة بتاعته هو وعيلته. خليها تحرقك وتاكلك يازخارى الخارى. ما أنت عامل زى الخنزير بتكبر على أكل وقول الزبالة.بس الظاهر عشان مؤتمر الحرامية مع شيخ المنصر شغال اليومين دول قالوله يازخارى ياخارى روح هوهو شوية علشان نديلك شوية عضم... هاهاهاهاهاااااااا!"
