text = "منذ انقلاب يوليو والبلد من نصيب اللواءات<br />تيجى يا سى ايمن تقول لى ديمقراطية ومهلبية ودستور وترشيح<br />انت يا ابنى صغير قوى ما بتعرفشى تفرق بين التمثيل وبين الواقع - انت اهبل - رايح ترشح نفسك قدام لواء - يبقى لازم تنفرم<br />واشرب يا حلو"
