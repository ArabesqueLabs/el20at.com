subject = "برضة(موش طالع من السجن) انبحوا يا كلاب و هوهووووا"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-01"
text = "مهما تقولوا<br />و مهما تعملوا<br />برضة (ايمونة بنت نورة)موش طالعة من السجن<br />اشربوا من المجارى يا كلاب<br />و هوهوووووا للصبح<br />الكلاب هتفضل طول عمرها كلاب ياولاد الكلاب<br />هوهوهوهوهوهوهو عليكم و على اهليكم<br />و عجبانى الاهانات اللى هى سلاحكم الوحيد بعيدا عن اية مناقشات<br />معلس الكلب هيفضل طول عمرة كلب و ابن كلبة<br />هوهوهوهوهوهوهوهوهوهو<br />افهموا يا كلاب"
archived = "2010-03-14"
capture_url = ""

