text = "انبحوا يا كلاب و هوهووووا ياولاد الكلاب يا عيلة زخاري جرجس<br />مهما تقولوا<br />و مهما تعملوا<br />برضة (ممدوحة بنت زكية ) داخلة السجن<br />اشربوا من المجارى يا كلابي يا عيلة زخاري الكلاب<br />و هوهوووووا للصبح<br />الكلاب هتفضل طول عمرها كلاب ياولاد الكلاب يا عيلة زخاري<br />هوهوهوهوهوهوهو عليكم و على اهليكم يا عيلة زخاري الكلب<br />و عجبانى الاهانات اللى هى سلا حك الوحيد يا زخاري الكلب بعيدا عن اية مناقشات<br />معلس الكلب هيفضل طول عمرة كلب و ابن كلبة<br />هوهوهوهوهوهوهوهوهوهو يا زخاري الكلب"
