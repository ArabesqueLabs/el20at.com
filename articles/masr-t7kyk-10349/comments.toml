[[comments]]
order = 2
subject = "خطر على مبارك القادم"
author = "المصرى أفندى"
posted = "2008-10-29"
text = "كل من عايش أنتخابات الرئاسة التمثيلية فوجئ أن أيمن نور أكتسح مبارك بقوة مما دعى أقطاب الحزب الوطنى الى أعلان حالة الطوارئ وهاتك ياتزوير وخاصة فى الساعات الأخيرة وذلك بأبطال أصوات أيمن نور وتسويد البطاقات بالجملة لصالح مبارك. وهذا كله معروف لكل من راقب هذه التمثيلية. وهنا بدأ الأنذار بالخطر ليس على مبارك الحالى بل مبارك القادم أو الوريث. أما الأن ومع أرتفاع وتيرة التوريث والتحضير السريع لذلك بدأت حملة تلويث سمعة أيمن نور للقضاء على أى أحترام وأعجاب للناس به ومحاولة قتله ببطأ داخل السجن .والمحور اللأخر هو أرهاب الصحفيين عن طريق القضايا المتتابعة .ثم القبض على الأخوان وأرهاقهم بذلك. بالأضافة ألى محاولات تلميع مبارك الأب ومبارك الوريث. ولكن غاب عن المخططين أن مصر ليست عزبة لعائلة مبارك وليست سبوبة للصوص وقتلة وبلطجية الحزن الوطنى .حتى لو غاب أيمن نور عن المشهد فمصر ولادة وبها الكثير من الشرفاء. مهما طال الليل لابد للشمس أن تشرق .ومهما طال الظلم لابد للعدل أن يسود ولكن السؤال المحزن هو متى وعلى جثث كم من المصريين وكم الضرر لهذا البلد الطيب. أدعوا الله أن يكون الفرج قريب."
archived = "2010-03-14"
capture_url = ""

