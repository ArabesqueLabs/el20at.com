subject = "مزور و نصاب و سجين؟ باللة عليكم هل يصبح هذا رئيس؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-31"
text = "توسل الى اسيادة و قبل اقدامهم و ايديهم بامريكا طالبا منهم النجدة لاخراجة من السجن؟<br />بالذمة دة ينفع يكون رئيس للجمهورية؟<br />بالطبع لالالالالالا و مليون مليون الف لالالالا و لا!!!<br />محامى خيبان<br />عضو مجلس شعب فاسد<br />مزور توكيلات<br />مقبل اقدام<br />مستعطف مراتة لتتسول لة الخروج من السجن<br />بالذمة دة راجل عندة كرامة و لا حمية دم<br />اتفوا عليك يا ايمونة يا بنت نورة؟!!!"
archived = "2010-03-14"
