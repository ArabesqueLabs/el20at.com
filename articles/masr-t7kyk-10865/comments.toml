[[comments]]
order = 0
subject = "يجب ادانة الذين يحاولوا وأد المولود الجديد (دولة ف"
author = "ابومحسن"
posted = "2009-01-03"
text = "كما تعلمون ان تجمع اليهود في فلسطين علامة فارقة من علامات يوم القيامه لا يد ولا دخل لنا فيها ولكنها امر الله وقدر الله وقال الشيخ الشعراوي في تفسيره عند اية حتى اذا جاء وعد الاخرة جئنا بكم لفيفا فقال لفيفا دي معناها ان كل يوم العالم سيحضرون الى فلسطين ولكن يكون هناك يهودي خارج فلسطين<br />يعني الان في اسرائيل 6 مليون واليهود كلهم 15 مليون يبقى ناقص 9 مليون يهودي سيحضرون الى اسرائيل<br />وبناء على هذه الحقيقة داب الحكام مشكورين على انقاذ ما يمكن انقاذه ونخص بالذكر<br />1) محمد انور السادات<br />2) حسني مبارك<br />3) الملك حسين<br />4) الملك فهد<br />5) ياسر عرفات<br />6) الشيخ زايد<br />هؤلاء الحكام بذلهوا جهودا دبلوماسية مضنية الى ان حصلوا على موافقات دولية باقامة دولة فلسطين في الضفة الغربية وقطاع غزه<br />وهذا المولود الصغير (دولة فلسطين) كان يجب الحفاظ عليه حتى ينمو ويكبر في وجه طوفان هجرة اليهود<br />لكن يخساره<br />على مايبدو ان المولود الجديد بيحتضر ولا انعاش له<br />المفروض يكون هناك ادانة للذين يحاولوا خنق المولود الجديد (الدولة الفلسطينية)"
archived = "2010-03-14"
capture_url = ""

