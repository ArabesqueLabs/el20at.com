[[comments]]
order = 4
subject = "who is the main responsible"
author = "aboziad"
posted = "2009-01-03"
text = "السلام عليكم<br />اعلم ان قلوبكم تنزف لما يحدث فى غزة<br />وانكم تشعرون بالخزى من موقف الحكومة المصرية<br />اتعلمون من السبب فى هذا الموقف المخزى<br />نحن<br />نعم نحن<br />الم نكن نحن الدين اعطينا اصواتنا لهذا الحزب الوثنى الذى تمخض فلم ينتج عنه الا بيان ادانه لحماس<br />الا يشعرون بالخزى<br />اليس هدا هو الحزب الذى له الاغلبية فى المجلس والذى شكل هذه الحكومة العميلة<br />الم نكن نحن مشاركين فى هذا<br />اما بعدم النصويت<br />او بالتصويت لاحد الاعضاء ( اما ان يكون شريفا ولكن مغلوب على امره () او مزورا وغير صفته<br />او بعدم الاهتمام بالانتخاب بالاساس<br />اما ان لنا ان نتخلص من هؤلاء<br />اتعرف ما دورك الان<br />ان تنشر الوعى بهذامن الان<br />فلتكن حملة من الان لاسقاط هذا الحزب ورموزه<br />لا احد سيمنعك من التحدث<br />ذكر الناس الان قبل ان ينسوا<br />وعى من حولك<br />ارسيل ايميلات<br />تحدث الى عائلتك<br />اقاربك<br />معارفك<br />حاول بقدر مقدرتك<br />انوى نصرة غزه<br />ليس الان فقط ولكن على المدى الطوبل<br />ان الاوان كى نضغط عليهم بما نملك<br />الا توافقونى ان هذه اسلم وسيلة للضغط<br />ولن يكون هذا لغزه فقط ولكن لانفسنا<br />الم تكون حكومات الحزب المتعاقبة هى التى دمرت مصر<br />هى التى جعلت مصر فى ذيل الامم فى جميع المجالات<br />هى سبب الفقر والحوادث والحرائق<br />تحرك الان<br />اكتب فى المنتديات<br />المدونات<br />ارسل رسائل<br />تعليقات<br />اعذر امرك امام الله<br />فستذكرون ما اقول لكم ان الله بصير بالعباد"
archived = "2010-03-14"
capture_url = ""

