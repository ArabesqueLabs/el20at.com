text = "فمن هو الرئيس الجبان<br />ومن هو الرئيس الشرير<br />ومن هو الرئيس الطيب<br />ومن هم الرؤساء العجزة<br />انا ادعو السيد عمرو موسى للمحافظة على تاريخة الوطنى والمشرف والاستقالة<br />العرب جميعا عاجزون وحتى غير قادرين على اتخاذ قرار وصدروا الموضوع الى الامم المتحدة وهم يعرفون انها لن تفعل شيئا ولكنة هروب من الموضوع<br />الخبراء قالوا ان الهجوم على حماس تم بناءا على طلب الدول العربية وان بعض الدول العربية مولت ب 2 مليار وانهم بعد التخلص من حماس سيرسلون مجموعة دحلان لتحكم"
