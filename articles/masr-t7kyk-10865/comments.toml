text = "برااافو عليهم .. انهم ما نسيوش انهم ليهم دور فى المجتمع<br />ليهم دور فى الادانة .. قادرين على انهم يطلبوا مطالب من الحكومة و مايقولوش مالناش دعوة<br />بس ياريت اوبريت الضمير العربى و الحلم العربى ما يتكررش سيناريوهاتهم تانى<br />لانهم غنوا ساعتها و ماعملوش حاجة .. يعنى عيطوا شوية وخلاص<br />لكن المرة دى ... فئة الفنانين اكثر أيجابية و تعاطى مع الموقف<br />وده تطور كويس جداً تجاه التغيييييييير فى وعى الشعب المصرى<br />يعنى مثلاً ... شوفوا كام شاب بيقلد تامر حسنى مثلاً فى تسريحة شعره او أسلوب اللبس بتاعه<br />فلما الشاب من دول يعرف ان تامر حسنى بيحتج وبيعبر عن رأيه ... لو لقى فرصة بعد كدة انه يعمل زيه<br />مش هيتردد .<br />يعنى الحكاية دى بتزود الوعى ... بطريقة غير مباشرة عند الشباب الى بتحب الفنانين دول ."
