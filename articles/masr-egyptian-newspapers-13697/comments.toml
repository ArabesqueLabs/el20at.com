posted = "2009-10-13"
text = "لا فض فيك أيها الإعلامي وائل قنديل فهناك الكثير من يحب الإصطياد في المياه العكرة<br />مثل المسمى أديب وهو أبعد عن الأدب و الأخلاق فقد خرج علينا في برنامج القاهرة اليوم يسب الجزائريين و كل مرة يرقص رقصة العاهرات بحثا عن الشهرة لما جف قلمه عن الأدب و الحكمة و الله لأظنه عميلا لليهود ، يخدم مصالحهم في زرع الفتنة و الكره بين الشقيقتين مصر و الجزائر ، لو كان أديبا لاستعمل لسانه و قلمه في جمع الأمة العربية على الكلمة الواحدة ضد أعداء الأمة العربية و لايستعمله في السب من أجل جلد منفوخ<br />خلقه اليهود لثقسيم البلاد العربية و زرع الفتنة و الأحقاد و إبعادهم عن هدفهم الأول وهو تحرير المسجد الأقصى و عاشت مصر و الجزائر و تحيا العروبة و الإسلام."
