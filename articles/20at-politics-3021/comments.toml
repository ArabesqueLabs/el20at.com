[[comments]]
order = 35
subject = "صدام لم يكن صلاح الدين في  حروبه ... ولم يكن طومان"
author = "الي نيفين ... نوفا .....من محم"
text = "** انا لم اري في الطريقه التي كتبت بها عن صدام قسوة بقدر ماكان فيها حقائق كادت ان تضيع وسط التعاطف الشديد مع مشهد اعدام صدام ..وكذلك النبره الطائفيه التي ارتفعت وتيرتها ...وهي في رايي اخطر ما يهدد امتنا في الوقت الراهن وتعادل في خطورتها وجود المحتل علي اراضينا...ان لم تكن اخطر في تاثيرها<br />** اما عن التوقيت ... فطرق الحديد وهو ساخن هو افضل الطرق للتاثير فيه.......لوكانت العمليه تتعلق بفرد ..لراعينا المشاعر وانتظرت التوقيت المناسب ولكني اعتقد ان في حالة مصير امة تنقلب عندها الموازين ليصبح الديكتاتور بطلا ...فالوضع مختلف هنا<br />**وازيدك من الشعر بيت ( علشان عارف انك بتحبي الشعر )....... واقولك بصراحه رغم قسوة كلامي ...ان انا كرهت صدام اكتر بعد موته .... لانه افسد الامه في حياته ....وحتي موته كان فتنه وافساد للناس<br />*** فالرجل لم يكن صلاح الدين الايوبي الذي حقق الانتصارات التي تجعلنا نتغاضي عن قسوة حكمه مثلا ...بل العكس الرجل لم يتاسد الا علي الدول الاسلاميه مثل ايران والكويت....وكانت النتيجه حروب عبثيه راح ضحيتها الالاف من المسلمين الذي لم تصورهم الكاميرات عند موتهم حتي نتعاطف معهم.....ولا يغفر له هنا مايقال عن النوايا الحسنه له لان القائد ينبغي ان يتوقع ويحسب ردود الفعل والحسابات الدوليه حتي لا تنتهي الامور ان يستغل اعداء الامه اخطاء الرجل بذكاء بالغ وتكون النتيجه اختلال ارضه وشعبه بعد ان قدم لهم الذريعه والحجه<br />**** ولم يكن ايضا طومان باي عند هزيمته فلقد كان مكروها من شعبه لبطشه وتجبره فانفض الناس من حوله ووجدوا في سقوطه وهزيمته نجاة لهم من براثن الظلم والطغيان .... اما طومان باي هذا الشاب النبيل الذي احبه الناس فلقد التف الناس من حوله لا صراره علي الدفاع عن بلده وقد اسر في ارض المعركه وهو يحارب وليس في حفره...ولذلك بكاه الناس عند اعدامه<br />وتغنو به وبشجاعته رغم هزيمته !!<br />*** بس خلاص..............<br />واما عن حكايه الماجستير وهبهوب كل الحكايه اني حبيت الفت نظرك اني عشريناتي قديم ....لكني كنت بعلق باسم مختلف وكان لنا بعض االمدخلات مع بعض علي راي فيصل القاسم<br />وفي النهايه زي ماقالوا الخلاف للراي لا يفسد للود قضيه<br />وتقبلي تحياتي"
archived = "2010-03-14"
