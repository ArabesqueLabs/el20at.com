[[comments]]
order = 9
subject = "صدام حسين ... نهاية رجل شجاع"
author = "محمد نواف الحمدالله ..."
posted = "2008-02-18"
text = "لاتأسفن على غدرالزمان لطالما رقصت على جثث الأسودكـلاب.<br />لاتحسبن برقصها تعلوا على أسيادها تبقى الأسود أسود والكلاب كلاب.<br />شنقوك غدراَ في صبيحة عيدنا لم يعلموا أن المنايا من الأسود تهاب.<br />غادرتنا جسداً وروحك باقية تسمو إلى العلياء بغير حجاب.<br />نطق الشهادة ثلاث مرات عظام قبل الرحيل إلى العزيز الواحد التواب.<br />إنا ظلمناك جميعاَ ولم نعي بأنك في ظلمة الآفاق كنت شهاب.<br />صدام ياصدام لاتعتب علينا فإننا قمنا نصلي عليك حضورنا وغياب.<br />نرجو الإله أن تكون قد إلتقيت في جنة الفردوس بالأحباب.<br />ونزلت فيها كمارجوت مكرما في زمرة الشهداء بغير حساب.<br />ياشيعة الأنجاس ياأبناالزنا والمتعة يامن لهم في كل دار خراب.<br />ياشيعة الأنجاس ياأبنا الزنا والمتعة فيكم ومنكم ضاعت الأنساب.<br />زرعوا الشقاق بين أبناء العروبة وللفتن قد عينوا العراب.<br />الخاميني إبن متعة ومثله من قد نفق(الخميني) والمالكي إبن زنوه كما حكيم عمامة لغراب.<br />لاتأمنوا شر الكريم إذا أهين ياأحقر الحقراء<br />ياأذناب.<br />ياأهل يعرب عراقنا ينزف دما وأهله في دارهم قد أصبحوا أغراب.<br />ياأهل يعرب حان وقت سيوفكم للثأر منهم والدماء تنساب.<br />قوموا هلموا وإسحقوهم كلهم هاقد عرفتم من هو<br />الكذاب.<br />لاتستكينوا وأنتم أحفاذ لمن خضعت لهم قبل الرؤس رقـاب.<br />لاتأسفن على غدر الزمان لطالما رقصت على جثث الأسود كلاب.<br />لاتحسبن برقصها تعلوا على أسيادها تبقى الأسود أسود والكلاب كلاب. وعاش العراق العظيم .. ولا قرت أعين الجبناء .."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "رحمك الله يا صقر العرب صدام حسين"
author = "عاشق فلسطين"
posted = "2008-06-09"
text = "أسأل الله العظيم رب العرش الكريم أن يرحم الفقيد الحبيب صدام حسين وأن يسكنه فسيح جناته .....<br />إلى كل من يعترض ما فعله صدام حسين , صحيح أن صدام حسين كانت له بعض الأفعال السيئة في حياته وبعض الجرائم ....<br />لكن والله له مواقف مشرفة جدا للإسلام والمسلمين عندما قتل أكثر من مليون شيعي خلال الحرب العراقية الإيرانية وقتل أيضا أكثر من نصف مليون شيعي عراقي , هذا الرجل الذي فعل ما لم يفعله أهل الإسلام للأسف اليوم , أنا أعتقد بأن الله تعالى قد سلط هذا الرجل العظيم المغوار لكي يوقف المد الصفوي الشيعي الرافضي بالعراق الذين يعيثون فسادا في العراق الآن ومنهم مقتدى القذر عليه من الله ما يستحق , هذا الرجل الذي شارون المخسوف بنفسه قال بعد إعدامه : الآن أنا أستطيع أنا أنام على فراشي بكل راحة واطمئنان .... وأنتم تعلمون بأن الشيعة الروافض لعنهم الله جميعا أغلبهم ينكرون بأن رسول الله محمد<br />صلى الله عليه وسلم هو النبي وإنما يقولون علي بن طالب رضي الله عنه هو النبي , وهذا كفر أكبر إذ أن شهادة أن محمداً<br />رسول الله من أركان الإسلام , فما بالكم بهؤلاء المرتزقة السفلة الذين يسبون أبو بكر وعمر رضي الله عنهما ويعتبرون سبهما<br />من أكبر العبادات التي يؤجرونه عليها , تعتبرون صدام حسين مجرما لأنه قتل 2 مليون شيعي يسبون الله والرسول والصحابة !!!<br />فلا حول ولا قوة إلا بالله العلي العظيم , وسيبقى حبيبي صدام حسين غالياً علينا نحن الفلسطينيون والأردنيون , فهذا الرجل<br />لطالما دافع عن الفلسطينيين وضرب إسرائيل بثمان صواريخ باتريون واسكود من أجل ردعهم , ولطالما ساعد الفلسطينيون<br />في سرائهم وضرائهم , سيبقى علينا غاليا إلى الأبد ولتسكت ولتخرس الألسنة التي تطاوله , ولا ننسى موقفه المشرف الذي<br />لم يهزه وكان رافع الرأس ولم يهن ولم يذل عندما وضع بحبل المشنقة عندما قال عاش العراق وعاشت خنساوات فلسطين !!<br />فو الله إني بكيت عليه وأنا أراه يعدم , ويحق له فخرا بأنه قال كلمة الحق والشهادة (لا إله إلا الله) التي من قالها دخل الجنة !!<br />فإلى جنات الخلد يا أشرف الناس ويا أعز الناس يا صقر العروبة , ولا ننسى عندما قال : وليسقط العملاء .......<br />نعم فهو شهيد بإذن الله وإلى الفردوس الأعلى ...<br />واعذروني على الإطالة ولكن ما كان بقلبي أعجز من أن يكتبه القلم ......<br />رحمك الله يا سيد العرب صدام حسين ...."
archived = "2010-03-14"
