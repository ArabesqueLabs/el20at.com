subject = "حقاُ، العرب لا يقرأون!!"
author = "Ami"
posted = "2007-02-17"
text = "ارجو ممن يتحدث عن حروب صدام و دكتاتورية صدام فى الحكم ان يقرأ لماذا حارب صدام إيران و لماذا غزا الكويت؟ و ارجو منه ان يشاهد بعينه ما يحدث الأن فى العراق من انشقاق و طائفية.. اقول لهم جميعاً لولا صدام لضاعت العراق منذ زمن<br />لمن لم يقرأ عن خطر الشيعة فى ايران على الوطن العربى اقول لهم ان صدام كان لهم بالمرصاد سواء فى ايران او داخل العراق -عملاء ايران بالداخل- و كل ما فعل صدام داخل و خارج العراق كان رد لعدوان شيعة ايران على العراق و على الوطن العربى كله و خطر الشيعة فى ايران ما زال قائماً و نسأل الله السلامة بعد وصول ايران الى سوريا و لبنان ..اقرأوا ..اقرأوا رحمكم الله .. فالإسلام دين علم و بينة و ليس دين رجم بالغيب و الأخذ بظاهر الأمور<br />صدام مثله مثل غيره له و عليه و كلنا بشر نخطئ و نصيب و لا يصح ان نحاسب انسان \"بالسمع\" بدون معرفة دوافعه .. من نحن لنحاسب الناس على افعالهم؟؟<br />هو الأن فى ذمة الله ان شاء غفر له و ان شاء عذبه و لا يسعنا الا ان ندعو له بالرحمة و المغفرة"
archived = "2010-03-14"
capture_url = ""

