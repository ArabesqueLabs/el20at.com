subject = "نعم هي حرب على العروبة"
author = "اياد"
text = "أقول لكاتبة المقال: أن الله وحده يعلم مافي الصدور وأن الأعمال بخوتيمها، ولنا ماشاهدنا من الرجل خلال اخر حياته ولاأقصد هنا لحظة الإعدام بل أقصد حربه لأمريكا خلال أخر خمسة عشر عاما من حياته<br />وثانيا: نعم هي حرب على العروبة وحرب على المذهب السني التي تقوم بها أمريكا الأن، فمعظم الشيعة هم ليسوا من العرب، وحذر من ذلك ملكنا المفدى في الأردن منذ أكثر من عام مضى، قام بالتحذير من التخطيط الشيعي في المنطقة وتحالفه مع الإستعمار بالباطن.<br />والى المشككين أقول: إقرأوا التاريخ جيدا واقرأوا مابين السطور في الخطابات العربية وحاولوا أن تفهموا اللعبة، فليس كل مايلمع ذهبا"
