[[comments]]
order = 34
subject = "الى محمد سالم"
author = "نيفين نيفى نوفا"
text = "اولا اسمحلى اعتذر لو كنت اتكلمت بطريقه جافه شويه ف التعليق و صدقنى دا مش اسلوبى بالعكس انا معروفه ف الموقع بالهدوء ف مناقشاتى مع المعلقين<br />و لكن<br />انت معرفتش تختار الوقت اللى تبدى فيه رايك بالنسبه لصدام بمعنى انت لو قرات تعليقى السابق هتفهم انى معاك ف كتير من اللى قلته لكن متجيش ف وسط الحريق و تسكب زيت و تتوقع ان الناس هتتبسط<br />كل ولحد ف قراره نفسه معاك بس توقيت الاعدام جرح الجميع<br />سواء صدام يستاهل او لا هو ف الاخر قائد عربى مشهد اعدامه و توقيته اهانه كبيره مش هتتمحى من ذاكره الجيل<br />و انا يومها مرديتش عليك لان لقيت ناس كتير ردت بالاضافه الى انى مكنتش قلدره اكتب من الصدمه و اكتفيت زى كتير بكلمه مقتضبه لما قلت تصبحون على وطن<br />ارجو تفهم موقفى<br />و صدقنى انا مش متشدده ابدا و بعدين فعلا الاختلاف لا يفسد للود قضيه<br />يس اللى ممكن يفسد للو قضيه سؤاللك على موضوع الماجسير بتاعى سؤاللك عن هبهوب<br />ارجو التوضيح؟؟؟؟؟؟"
archived = "2010-03-14"
