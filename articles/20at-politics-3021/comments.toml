subject = "اه يا وطنى"
author = "نيفين نيفى نوفا"
text = "اه يا وطنى كم من صنم مجدته لم يكن يحمل طهر الصنم<br />صدام ليس شهيدا بالطبعغ و يستحق ما حدث له و لكن ما جعلنا نتراجع و نتراجع ف ردود افعالنا تجاهه هو توقيت الاعدام<br />و ما قيل على لسان الامريكان ان توقيت الاعدام كان هديه بوش للجنود الامريكان بتالعراق ف الكريسماس<br />و انا ضد وجود فريقين فريق مصطفى بكرى اللى جه ف القاهره اليوم بموقفه الغريب لمناصره صدام و كانه مش عايش معانا و عارف الراجل دا عمل ايه ف شعبه و ف المنطقه<br />و فريق صافيناز كاظم اللى جت ع وائل الابراشى ف الحقيقه و شتمت صدام و نظامه و نست التوقيت المهين للاعدام<br />صدام يستحق الاعدام صح انا معاكو<br />بسش العرب ميستحقوش التسيير الامريكى للمحاكمه<br />و المسلمين ميستاهلوش توقيت الاعدام"
archived = "2010-03-14"
