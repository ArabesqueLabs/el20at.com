subject = "( إن الله لا يغفر أن يشرك به , ويغفر مادون ذلك لمن"
author = "أحمد"
text = "حقيقة أنا لا مع أن احنا نرفع من شأنه لدرجة إنزاله منزلة الشهداء ، لأنه ده ظلم للشهداء وانكار لما فعله من أخطاء جسيمة اذا صح ما ينسب اليه .. ولكن فى الوقت نفسه شايف انه مش صح انه نشنع فيه ونغلط ونشتم فيه .<br />واذا كان هنا من تعاطف معه \" رحمه الله \" فبسبب الظروف التى تمت فيها العملية من إعدام بأول يوم العيد ، وتحت عدوان وحكومة عميلة وأيضا كانت عملية طائفية حيث لم يكن هناك سنى واحد ، وبتمنى ان ربنا يغفره بس بسبب ماقيل له من إهانة ودعوات عليه أثناء تنفيذ الحكم من شوية حمقى ومغفلين .<br />ولو عاوزين نبقى فعلا موضوعين هنجد ان تقريبا كل حكامنا يستاهلوا أن يحدث لهم مثل ما حصل مع صدام ، ولا هو بس مفيش غير صدام اللى غلط ؟!! ولا أحد يجرؤ على الكلام ."
