[[comments]]
order = 18
subject = "الحقيقة عن المؤامرة باعتراف أمريكا"
author = "EPS"
text = "صدام شهيد فقط وفقاً للتعريف الديني فقد أعدمه الأمريكان و لو كان الشيعة أداة التنفيذ...<br />ولكن هذا لا يمحو بالضرورة فظائعه التي ارتكبها في الماضي ،،، و لكن قولوا لي من هو الحاكم (العميل) العربي الذي لم يعمل مثل صدام ؟ على الأقل الرجل بنى بلداً و جيشاً و جامعات و مراكز أبحاث فخافت اسرائيل و آل موردخاي ماكرن و صارت المؤامرة الشريرة التي استدرج فيها الأمريكان صدام الى الكويت (سفير أمريكا في بغداد أبريل جلاسبي تصرح رسمياً في يونيو 1990 أن الولايات المتحدة لا علاقة لها بالشؤون المحلية و علاقة العراق بجيرانه في الخليج و أنها لن تتدخل إذا نشب أي صراع ) ، فلما صار الغزو انقلب الرأي 180 درجة و طلع بوش الأب و قال أن أمريكا لها مصالح استراتيجية في الكويت و أنها لن تسمح للعراق بابتلاع الكويت فحدث ما حدث.<br />الكثير يقولون أن صدام أخطأ خطأ حياته بأنه لم يتقدم و يحتل الجبيل و رأس تنورة حيث أكبر المنشآت و المصافي النفطية السعودية لأنه لو أقدم على تلك الحركة (من غير المستبعد أن أمريكا أعطته وعداً كاذباً بالأمان على الكويت الى أن جاءت بكل قواتها للمنطقة) لاستحوذ على 75% من احتياطي النفط العالمي و عندها من الممكن جداً أن يضع الغرب تحت الأمر الواقع لأن اقدام صدام على تدمير كل هذه المنشآت في حال الهزيمة سوف يقفز بسعر النفط الى النجوم لسنوات طويلة و سيكلف اعادة بناء البنية التحتية المدمرة مئات مليارات الدولارات و سنين طويلة من صبر الغرب بدون نفط أي خسارتهم تريليونات من الدولارات...<br />الدرس: المنطقة بأسرها يحكمها عملاء للغرب ، يحركهم الغرب كما يحرك الطفل أذرع و أرجل الدمية لقاء وعود بتركهم مدراء ووكلاء على مصالح الغرب في تلك المنطقة يعيشون في قصور من الخيال و يقبضون نفطنا و دمنا و ديننا و مستقبلنا ثمناً لعمالتهم ندفعه نحن بغفلتنا و ثقتنا بالمنافقين و المطبلين المصفقين و أحذية الأمراء و شعراء السلاطين و أشياخ الجمباز ذوي الذمة الكويتش الذين يقولون بوجوب طاعة ولي الأمر حتى لو أخذ مالك و ضرب ظهرك و تمتع بزوجتك (رواه المطبل ابن عثيمين زوراً و بهتاناً عن الرسول الذي أرسل بالقرآن الذي يتوعد الظالمين بالخلود في جهنم فكيف يقر الرسول هذا الظلم ؟ أنا أتوقع قيام مغفل ما بالرد علي و الدفاع عن ابن عثيمين و التغاضي عن كل ما قلته)<br />لا حول و لا قوة إلا بالله ..."
archived = "2010-03-14"
