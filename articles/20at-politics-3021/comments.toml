subject = "تاريخ دموي لسفاح بغداد اختزل في لحظة الاعدام"
author = "محمد سالم"
text = "الحققيه ان السؤال الذي طرحته الاخت دعاء في نهاية مقالها ...والذي يسال عن اي الفريقين ننتمي ....فريق مصطفي بكري وعبد الباري ....ام فريق المالكي والصدر...هذا السؤال يذكرني ...بما قاله االرئيس الامريكي بوش عقب احدائ 11 سبتيمبر ...من ليس معنا فهو ضدنا ....اي اما ان تكون مع بوش او اتكون مع اسامه بن لادن .... وليس امامك خيار ثالث<br />اما تكون مع فسطاط المؤمنين او مع فسطاط الكفار.......<br />ونرجع لصدام وحكايته لكي نعرف الي اي الفريقين ننتمي .....فلقد اختزلت حياة الرجل وتاريخه الموي في لحظة اعدامه وتوقيتها وما قيل عن ثباته وما قيل عن ان التوقيت المقصود به ا هانة المسلمين......واذا ذكرت لاحد بعضا من فظائعه التي يندي لها جبين اي انسان مسلم كان او غير مسلم.... فانه يرد عليك بان الرجل نطق الشهادتين قبل الموت .. وان الله غفور رحيم<br />...وينسي هؤلاء ان هذا الرجل قتل من المسلمين اكثر مما قتل شارون....ومن اجل تعزيز حكمه وموقعه في السلطه فقط<br />علي مستو ي الصحافه العربيه وخصوصا امثال الاخ بكري ....فلم يعد سرا ان الصحافه العربيه تخضع في اغلبها الا مارحم ربي للانظمه القوميه العربيه وكان اكثرها سخاء نظام الرفيق صدام...ياتري فاكرين هدايا سيارات المرسيدس التي قدمت الي رؤساء التحرير الذين ذهبوا الي بغداد ....هذا طبعا بالاضافه الي كوبونات النفط الشهيره ....وطبعا مايقدم في الخفاء اكثر بكثير ... وليس غريبا عندما سقط النظان السابق انهم وجدوا قوائم كامله باسماء بعض الصحافيين العرب الذين كانوا يتقاضون مرتبات شهريه من نظام صدام...لذلك انا افهم سر تباكيهم علي صدام فلقد اصبحت مصادر تمويلهم محدوده ...<br />اما الطرف الثاني الذي يسيطر علي الصحافه العربيه فهو راس المال السعودي ...والذي مازال يلعب الدور الاكبر ...وطبعا انا لا اتهم الكل فباتكيد هناك من الشرفاء من لا يستطيع اموال الدنيا ان تشتري قلمهم ورايهم الحر<br />اما علي مستو الشعب وعامة الناس كما يقال....فنحن شعوب عاطفيه الي اقصي در جه وياخذها احساس اللحظه بعيدا عن حسابات الماضي والمستقبل ...لذلك فلقد تخيلت لو كل ضحيه من ضحايا صدام كان له شريط فيديو يصور لحظه اعدامه ....اي حوالي من اتنين الي ثلاثة ملايين شريط حسب عدد ضحايا صدام<br />** هل كانوا سيظلون علي تعاطفهم مع صدام ...بالطبع لا والف لا........هل لو راي احدهم قصة المراه التي قتلوا طفلها الرضيع امامها .....فسقطت ميته علي الفور من هول الصدمه...هل كانوا سيظلون علي موقفهم...بالطبع لا والف لا<br />لن نحتاج الي عرض مليوني شريط لكي نغير رايهم يكفي بضعة شرائط وسوف يلعنون صدام<br />*** وان هنا اتكلم عن الناس الطيبه من عامة الشعب واستثني منهم الطائفيين والمتطرفيين الذين ينتمون الي الجماعات السلفيه ....لان هؤلاء تحركهم ايدلوجيه متطرفه مثل فرق الموت الصفويه في العراق ... وان اختلفت العقيده والمذهب ....ولكن الكراهيه واحده والتعصب الاعمي واحد<br />**** يبقي سؤال في النهايه هل ستنجح الاستراتجيه الامريكيه في المنطقه بخلق مايسمي بالفوضي الخلاقه<br />وتنقسم المنطقه الي معسكرات للسنه والشيعه ...ومعسكرات للسلفيين والصفويين.... ومعسكرات لدول الممانعه والدول المعتدله.........ارهابيون او معتدلون موالون لامريكا...هل سنقع في الفخ الامريكي<br />الا يوجد طريق ثالث ....غير طريق صدام ..........وطريق المالكي<br />** ملحوظه :::: الي كل الاخوه الشتا مين والذين اتحفوني بكم هائل من السباب والاتهامات باني عميل للامريكان او صفوبي منحرف وكل هذه الاسطوانات المشروخه .... انا راجل بسيط ومسلم سني ولست عميلا لاحد ....فرجاء فكروا في كلامي قبل ما تتحفوني بشتائمكم ....والي الاخوه المصممين علي السباب سوف اخصص لكم ايميل خاص تستطيعون ان تستعرضوا فيه قدراتكم اللغويه في الشتيمه والسباب والتكفير<br />كل طاغيه وانتم طيبين"
archived = "2010-03-14"
capture_url = ""

