subject = "سيد ابو علي.............؟؟"
author = "المظفر قطز"
text = "السلام عليكم<br />لا ادري ماذا تقصد بمحبي صدام؟؟الرجل اصبح في ذمة الله و هو وحده(عز و جل) القادر على محاسبته,رحمته او لا. ولا يسعنا كمسلمين الا طلب الرحمه لكل مسلم . وهذا الرجل نطق الشهادتين امام الجميع فلا يسنطيع احد ان يجادل في اسلامه , فلنا الظاهر والباطن لله(عز و جل) . اما عن حزننا فهو لعدة اسباب :<br />1.لقد اعدم بطريقه طائفيه تشق عصا الوحده الاسلاميه<br />2.اعدم بامر من المحتل الامريكي<br />3.اعدم في ايام حرم فيها القتل والقتال<br />4.اعدم صبيحة يوم العيد و كان هذا المشهد الذي ألمنا صبيحة هذا اليوم المبارك. و مما يبدو انه كان من المقصود أيلامنا في هذا اليوم حتى لو لم نكن متعاطفين معه لان الطبيعه الانسانيه السليمه تتالم لمشاهد كهذه كما تألمنا لمشاهد العراقيين القتلى في عهده و اثناء الاحتلال كذلك<br />5.أذكروا محاسن موتاكم.<br />6.فلتصب نقمتك على الطواغيت العرب الذين ما زالوا على قيد الحياه<br />اللهم اهدنا سواء السبيل<br />السلام عليكم و رحمة الله"
