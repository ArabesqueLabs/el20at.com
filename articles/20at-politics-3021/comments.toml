author = "مسلمةوافتخر"
text = "سلام عليكم ورحمة الله تعالى وبركاته<br />ولا تحسبنا الذين قتلو في سبيل الله اموات بل احياءا عند ربهم يرزقون<br />رحمك الله وغفر لك ولجميع مسلمين<br />صدام دهب عند ربه هو يحاسبه ان شاء عدبه وان شاء غفر له احنا احتسبناه عند الله شهيدا وسيحشر ان شاء الله مع شهداء وصديقين<br />ولكن ماذا بعد صدام انضلو مكتوفين الايادي ونساء مسلمين يختصبن واظفال يقتلون وقران يدنس ونبينا يسب ويشتم وهو الذي ضحى من اجلنا واجل دعوتنا من اجلنا ليشفع لنا بها عن ربنا<br />اهكدا نخدله وبكل بساطه الي متى يا مسلمين نسكت علي دل ومهانه<br />والله اني العين لتبكي وقلب ليشكي الي ما الت اليه امة الاسلام<br />اللهم اعز الاسلام ومسلمين وانصرهم يارب"
