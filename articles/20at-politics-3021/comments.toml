subject = "قاتل صدام هم طواغيت العرب"
author = "مسلم"
text = "من قتل صدام على وحه الحقيقة هو من سمح لطائرات وسفن العدو أن تنطلق من أجوائه لضرب العراق .<br />فلولا سقوط العراق بيد الصلبيين ، ما كان هذا ليكون.<br />والذي تولى كبر هذا هم ال سعود ومشايخ الخليج وحصني الفاجر العاهر وخائن الاردن -وما أكثر الخونة.<br />لذلك أقول إن من أراد أن يثأر من قتلة صدام -رحمه الله وعفا عنه- فليثأر من ال سعود ثم من ال صباح ثم من حسني مبارك ثم من مللك الاردن ، فلولا خيانتهم لله ورسوله ، ما حدث ما حدث"
