[[comments]]
order = 4
subject = "طبيعـة الإمتحـان و ( المـزاج ) هـي الفيصـل . !"
author = "الأواكـس / محمـد عبدهـ"
posted = "2008-06-24"
text = "عزيزي علي ..<br />وكمـا ذكـرت آنفـًا ..<br />مسألة الطلعات والخروج بعـد الإمتحانات .. مسألة تحكمها طبيعة الإمتحان و ( المزاج ) !<br />وإن كـنا في غالب الأحيـان نتجـه للخروج والتنفيـس عن أنفسنـا حتى وإن لم نـؤدي جيـدًا في الإمتحـان .<br />بسبب رغبـة الأصدقاء والأصحاب .. في مرافقتهـم ..<br />أما عـن الأماكن التي يتوجه إليها الشباب غالبـًا ..<br />فالبحـر هو الإختيـار الاول لمعظمهم ..<br />وتأتي المقاهـي ومحـال الإنترنت في المرتبـة الثانية .<br />ومن ثـم الحدائق - على الرغـم من ندرتها - والملاعـب ..<br />جزاك الرحمـن خيرًا .. وسـدد خطـاآك .. وأعانك ووفقك .."
archived = "2010-03-14"
