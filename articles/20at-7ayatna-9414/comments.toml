text = "انا حاب اضيف رأيي بشكل خااص للأخ وائل جحيدله<br />بالنسبة اخوي وائل لموضوع السفر وماني عارف ايه انتا اتكلم على نفسك لأنه ممكن كنت ما تذاكر اول بأول<br />هذا شي راجع لك تحبس نفسك في البيت شهر او شهرين<br />لكن اش ذنب الي مذاكر اول بأول مدام انه واثق من نفسه ومن مذاكرته ليش يحرم نفسه من السفر يروح مصر يروح الصومال يروح تركيا ان شاء الله يروح الموزمبيق<br />مع خالص تحياتي محسووبك زعبولا الاولى"
