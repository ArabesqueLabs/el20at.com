[[comments]]
order = 8
subject = "بلا اختبارات بلا هم"
author = "hamwdy"
posted = "2008-06-26"
text = "اول شي السلام عليكم ورحمه الله وبركاتو<br />و بعدين بلا اختبارات بلا هم نصيحه للي يبغى ينسى الاختبارات يتبع الخطوات التالية :<br />1- لا تشيل هم الاختبار روح كانك الواثق .<br />2- خلي ايامك كلها ربوع وخميس حتى لو عليك بكرة اختبار نهائي .<br />3-اطلع مــــــصــــــــــر اطلع الحبشة المهم غير جو قبل الاختبارات وبعد الاختبارات.<br />4-بس اهم نقطة انك ما تغش في الاختبار وكله مكتوب عند الله .<br />انا عن نفسي الاختبارات احــــــــلــــــى واروع وقت زي الاجازة تحياتي : hamwdy"
archived = "2010-03-14"
capture_url = ""

