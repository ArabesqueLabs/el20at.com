subject = "موضوع الإختبارات"
author = "وائل جحيدله"
posted = "2008-06-24"
text = "بالنسة لأيام الأختبارات زمان كانت شبح ورعب لأنني كنت أحبس نفسي شهر في البيت عشان أذاكر والحمدلله كانت الحبسة تجيب ثمارها<br />بس دحين الطلاب عندهم أخر هم هو الأختبارات والله تلقاهم 24 ساعة في الشارع وفي الأخير يبغو ينجحو<br />واحد يروح مصر يتمشى قبل الإختبارات قال إيه؟ عشان يغير جو!!!<br />أيامنا كان الواحد عنده هم ولازم يتغلب عليه بس دحين الله يهدي طلابنا وسلامتكم"
