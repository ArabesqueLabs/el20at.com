subject = "كوم الفرج البحيرة"
author = "احمدصلاح عبدالصبور"
text = "يااااااااااسلام على الافلام والتلحينااااات ياااااااااعبدالمنصف اخرهجصصصصصص انتجة السسسسسسبكى واخرجتة سااااااااااندرااااااااااا مع تحيااااااااااات هانى سلامة"
archived = "2008-07-09"
