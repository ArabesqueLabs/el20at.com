[[comments]]
order = 0
subject = "فيلم هندي"
author = "صبري سراج"
text = "يا سلام هو عبد المنصف دلوقتي بيحتفظ بعقود اللاعبين معاه.. والله جديدة وتيتو سعيد أجر بلطجية وعمل له كمين ودار على عقبيه ثم لكمه في مؤخرته ليفوز بالعقود قبل أن يطلق ضحكته الشيطانية \\\" نياهاهاهاهاها \\\"؟.. والله جديد الكلام ده ينفع فيلم جديد للسقا.. لا حول ولا قوة الا بالله"
archived = "2008-07-08"
capture_url = "https://web.archive.org/web/20080708112915/http://masr.20at.com:80/newArticle.php?sid=16677"

[[comments]]
order = 1
subject = "شبرا"
author = "امير سيف الدين"
text = "ههههه والله من امتي اللاعيبه بيشله الوراق اللي المفروض ده من حق الادرين؟<br />هو يعني هاني سعيد كان عارف ان بدر اتصل بي عبد المنصف والورق مع منصف ؟<br />لو الكلام ده صح يعني بالعقل فيه نااااااااااااااااااااااااااااااااس كتير ماشين في الطرق صح ولا ايه؟<br />ليه ما نزلوش علشان يشوفو منصف الحارس الفاشل ؟؟؟ الناس اللي كانو مع هاني بالسنجه ؟<br />من الاخر خلص ده حتي ما ينفعش حتي يكون فيلم هندي ده فيلم مصري ومصري هابط<br />بطولة وتصوير واخراج القاضل (منصف) وانتاج (الزمالك) والله حرام"
archived = "2008-07-09"
capture_url = "https://web.archive.org/web/20080709183956/http://masr.20at.com:80/newArticle.php?sid=16677"

[[comments]]
order = 2
subject = "الفنان المؤلف"
author = "شيكو"
text = "يا سلام على الفن يا جماعه يا سلام على روعه التاليف فين المخرجين يشوفو عبد المنصف بيالف فيلم عالمى مش واخد باله انه بيناقض نفسه وبعدين الراجل عاوز يلعب فى الاهلى سيبوه انتوا مالكو هو يلعب فى المكان اللى هو عايزو اخر زمن"
archived = "2008-07-09"
capture_url = "https://web.archive.org/web/20080709183956/http://masr.20at.com:80/newArticle.php?sid=16677"

[[comments]]
