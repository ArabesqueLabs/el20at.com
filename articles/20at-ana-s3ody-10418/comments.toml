subject = "فوز أوباما الساحق .."
author = "محمد نواف"
posted = "2008-11-05"
text = "فاز أوباما ( الأفريقي الأصل ) ... وهذا جيد !!<br />وهو بالطبع الرئيس الرابع والأربعين للولايات المتحدة الأمريكية ..<br />ونقول - نحن العرب - أن الآمال معقودة عليه ..<br />وبإعتباره مرشح ديموقراطي، على النقيض تماماً بالنسبة لماكين ( مرشح جمهوري ) ..<br />ونحكم على أساس هذا الشيء بــ ( إنشاالله خير ،، وعلى إيدو ،، ونحو مستقبل أحسن ..... وما الخ ) ..<br />لماذا نتأمل خيراً بإنسان ( لا بهش ولا بنش ) ،، لماذا كل هذا التفاؤل ( وصحيح أن الرسول قال تفائلوا بالخير تجدوه ) ..<br />وأنا أعتقد بأن أوباما لن يستمر أكثر من شهر أو شهرين ( وسنة كحد أقصى ) وإلاّ وسوف يغتيل !!<br />نعم سوف يغتيل !!<br />لأن العنصرية مازالت قائمة بين أصحاب البشرة البيضاء وأصحاب البشرة السمراء ..<br />في النهاية لا يسعنا إلاّ أن نقول مبروك يا باراك يا ابن حسين أوباما !!<br />ومن أعلى لأعلى"
