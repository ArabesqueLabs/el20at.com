text = "ممكن تكون بوليتيكا وعايزين يشتموا شوية فى حماس او حزب اللة او يمكن يتهموا جزائرى حاقد على النصر المؤزر اللى حققناة فى انجولا<br />ومصيبة لا يمسكوا واحد كان بيقابل البرادعى فى المطار ويلبسوة التهمة<br />بكرة كل شىء يبان وينعرف"
