author = "المخرج خميس فجلة"
posted = "2010-02-21"
text = "اصل الاستاذ مش مفيد شهاب مطفى فى جنيف هناك بيحضر مؤتمر حقوق الانسان وهناك زنقوة فى موضوع قانون الطوارىء ودور العبادة والمحاكم العسكرية والبية معرفش يرد<br />ويظهر ان المخرج خميس فجلة بتاع الداخلية اراد ان يدعمة فى جنيف فاخترع القنبلة اللى تضحك دى بيقول اربعة جراكن بنزين و4 ليتر حامض كبرتيك علشان يولع وطبعا تلميذ فى الاعدادية ما يعملش كدة"
