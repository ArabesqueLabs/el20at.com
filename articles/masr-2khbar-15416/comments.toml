[[comments]]
order = 1
subject = ""
author = "شرطة دبي"
posted = "2010-02-21"
text = "يا جماعة القضايا اللي من هذا النوع ما يفهمش فيها غير شرطة دبي<br />اللي كشفت محسن السكري بعد ما مشي من دبي<br />اصل الضباط بتوعنا مش فاضيين للكلام دا<br />بيتمنظروا بالبدل بتاعتهم ويتأمعوا بيها ويعاكسوا الستات والبنات<br />الشرطة المصرية حتقبض على اي حد وتلبسه القضية<br />زي قضية ليلى غفران<br />قالوا نجار مسلح<br />ها ها ها ها ها ها ها ها ها ها ها ها<br />يا ترى في القضية دي رجالة حبيب العادلي حيلبسوها لمين<br />مين اللي امه داعية عليه<br />يومين كمان وحنعرف"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = ""
author = "المفتش كرومبو"
posted = "2010-02-21"
text = "حبيب العادلي ندهلي وقالي تعالى يا كرومبو شوف ايه اللي بيحصل دا حصوا قنبلة ادام كنيسة اليهو<br />رحت بسرعة اشوف وشوف الكنيسه والقنبلة وقابلت تلاته اول واحد شفته المرشد العام الجديد بديع قالي يا كرومبو انا كنت معدي بالصدفه بشتري شوية حاجات للعيال وسمعت الانفجار بس ما اعرفش مين اللي عملها وبعدين شفت ممدوح نخلة المحامي بتاع الاقباط قالي يا كرومبو انا ما شفتش حاجه خالص دا انا كنت ماشي في الشارع اللي ورا وجيت اتفرج بس وبعدين قابلت ممدوح زخاري بتاع اسكندرية قالي يا كرومبو انا جالي تليفون من اسرائيل قالولي لازم تروحتسلم على الحاخام بتاع الكنيسه وتديله الشنطه اللي شايلها معاك وانا داخل سمعت صوت انفجار وما شفتش حاجه<br />انا عرفت مين اللي عمل الانفجار ولو انت كمان عرفت اتصل بحبيب العادلي تكسب خمس تلاف جنيه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = ""
author = "معلومات اولية"
posted = "2010-02-21"
text = "هى مش قنبلة ولا بطيخة<br />يعنى البنزين لو اختلط بحامض الكبرتيك هيولع بس من الحرارة ومش ممكن يعمل انفجار وهيطلع شوية دخان وخلاص<br />العملية صدقونى لا تصدق<br />شوية بنزين بيولعوا وخلاص ولا فية اى حاجة خالص ولا فيها اى خطورة ولا اى هدف ولا اى خوف زى ما يكون واحد مولع شوية ولعة وبيدفى عليهم<br />انما بقى الرتب عايزة تظهر فى التليفزيون وهيطلع بكرة بيان من الداخلية للجرايد ووكلات الانباء - انة نمى علم اللواء مساعد وزير الدخلية زعبور بحادث ارهابى فكلف العمداء ترتان وبيدنجان وابو سنة لولى بمتابعة الامر فقاموا بتكليف العقيد ابو رجل والعقيد ابو دراع والعقيد ابو زمور الذين هرعوا الى الموقع ومعهم الرواد فلان وفلان وفلان والنقباء فلان وفلان وفلان وفلان وقوات كثيفة من الخبراء الامنيون ومكتشفى القنابل والالغام وايضا الكلاب البوليسية<br />وتم فحص بقايا القنبلة المزعومة وتصويرها من البر والبحر والجو<br />وجارى مطاردة المجرم الهارب<br />وابلاغ المطارات والموانى باسمة لملاحقتة<br />وتم القبض على امة واختة وخالتة ونسوان جيرانة حتى يسلم نفسة<br />وعمار يا مصر<br />وتعيش اكاديمية مبارك للشرطة"
archived = "2010-03-14"
capture_url = ""

