subject = "افهموا ماتقرأوه"
author = "ياسر محامى شاب"
text = "كاتب الموضوع ده يقصد انه زى مالبنات بتبحث عن الموضه كذالك فى شباب بتابع الموضه واصبحت الموضه للشباب ايضا بعد ان كانت مقصوره على البنات فقط وكان بجانبها ولكن بشكل ثانوى وعلى استحياء عروض الموضه الرجالى الى ان اصبح هناك مصممين ازياء للرجالى واصبحت عروض الازياء الرجالى منتشره واصبح هناك اقبال على متابعتها واخيرا الموضوع مهم جدا ومش لازم نتكلم على الحرب والمشكلات علشان نبقى مسايريين للاحداث العالميه هناك ايضا فن وثقافه وعلم وليس سياسه وبس ((الانسان الواعى يجب ان يكون متابع على كل المجالات والاحداث )) ياسر"
archived = "2010-03-14"
