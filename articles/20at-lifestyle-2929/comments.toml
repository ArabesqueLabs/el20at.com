subject = "الزوج اولا و اخيرا"
author = "ريما"
text = "انا شايفة انو مفتاح القصة كلها بايد الزوج.. يعني ما فينا انغير الحماة هي ست كبيرة و هاد عقلها و بدها هدى تسايرها ومش ممكن انلوم هدى لان ما حدا بطيق يحس حالة مظلوم و متهم بدون سبب... بس تعامل الزوج مع الموضوع هو الي معقدو ... يعني لو هدى حست انو زوجها ما بيعطي دان لحكي مامتو ما كانت اهتمت بتصرفات حماتها وكان اعطتها دان من طين و دان من عجين بس بما ان حضرت ابنها كل ما سمع كلمة من امو بيعمل زلمة على هدى و بتخانق معها اكيد هدى حتحط تصرفات حماتها بدماغها... يعني ما بكفي انو يدافع عنها قدام مامتو...اصلا شو بدو يحكي غير هيك؟ بدو يحكي لامو مزبوط هي هدى ما بتحبك وما بدها تزورينا؟ ..الست لما تحس جوزها ما بتاثر بكلام الناس و بيعمل حدود لحياتو الخاصةمع مرتو ما بتعود تهتم لمهاترات اهل الزوج... بعدين انا انصدمت انو لهلا في ناس بتفكر هالتفكير القديم هادو بتحكي اخدتي من امو عالجاهز... شو يعني اخدتو عالجاهز؟ يا جماعة علاقة الرجل بامو بتختلف كتير عن علاقتو بمرتوما في مجال للمقارنةو الزوجةما بتاخدو من حدا بس هي طبيعة الدنيا ان الانسان بعد زواجو بتصير عيلتوهي ذات الاهتمام الاول خاصة بعدما يصير عندو اولاد... و لو تتذكر الحماةلما كانت هي كنة رح تعرف انها برضة تزوجت رجل طلع من بيت اهلو و اسس معها بيت جديد و اشوي اشوي صار بيتو و هي و اولادها الهم الاولوية بحياتو ... بس مش معنا هاد انو نسي اهلو ولا شو يا متجوزين؟... هي انا تركت اهلي وسافرت مع جوزي لتاني قارة...يعني انا نسيت اهلي وزوجي اخدني منهم؟ لا... صح هلا الاولوية لزوجي و لابني الي جاي بس بضلو اهلي بقلبي و بضل اسال عليهمو احن لوجودي وسطهم بس هي هي سنة الحياة..."
