text = "جيد يا اختي هدى عرفت كيف تستفزين عقول قرائنا الرجال ونحن نرى انهم يتحركون بعاطفتهم وليس من عقلهم<br />\"تكن هذه المشاعر لامي ادن اطلقها\"<br />نسوا ان الزواج ميثاق غليظ<br />وان اباءهم ليسوا ملائكة<br />نسوا انهم حينما دقوا الباب اول مرة وحينما كان اول حوار كانت لديهم احلام مستقبل ..احلام بيت.. واطفال.. وتربية ...وطريقة عيش افضل ..ووو..........<br />الغريب عندما يتزوجون ينسون ذلك ويلتصقون بعائلاتهم وكاننا سنخطفهم<br />ويا ريت لو عاملونا بالمثل \"يكون لنا حق في ان نلتصق باهلنا ايضا\"<br />لا المرة تتبع الراجل<br />صدقيني تعاملي مع واقعة بدون غرابة وكل مرونة لكي لا تصدمي فالاتي انكد والله<br />لاني احب الخير لكل نساء العالم<br />زوجة مجربة"
