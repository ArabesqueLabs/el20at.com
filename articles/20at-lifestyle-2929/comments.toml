[[comments]]
order = 10
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
text = "الغريب أوي انك طنشتي على رده على أمه عنك؟؟؟؟؟؟؟؟؟؟<br />\"بس يا ماما دي كانت في الحمام.\"<br />\"ماما ما تزعليش والله دي كويسة.\"<br />غرييييييييييييييييييييييييببه أوي... مش ده كلامه عنك من وراكي؟؟؟؟؟ ارحموا من في الأرض يرحمكم من في السماء<br />صدقيني لو ده فعلا تفكيرك...قريب هتفقدي جوزك كحبيب و أخ و حضن دافي تترمي فيه ساعة الجد....<br />بعد كده هيعاملك بشكل روتيني-زي أي واحد متجوز و عاوج بوزه- أكتر من كده و هتضطري تضايقيه عشان يحس و هو كمان هيقول هي بتعمل كده ليه....و يضايقك و في الآخر انتي اللي هتخسري...<br />أي معركه انتي في طرف و والدته في طرف انتي اللي خسرانه ...<br />راعي انه هي ربته و اديته كل حاجه و كان حته منها و جيتي خدتيه انتي على الجاهز..لازم تِغير شويه(ماهي ست)...حطي نفسك مكانها...<br />طمنيها من ناحيتك انك مش بتاخديه منها و هي هتعاملك زي بنتها تمام واحتمال هي اللي تقوله متجيش الجمعه الجايه خد \"هدى\" و خرجها...<br />و راعي ان لو ليكي أخ...احتمال والدتك هتعامل مراته زي ما انتي تتكلمي كده ...<br />وادع ربنا كمان انه يهديه ليكي ولأمه.............(اللي مالوش خير في أهله......................في حد)<br />و دمتم في حياه زوجيه سعيده"
archived = "2010-03-14"
capture_url = ""

