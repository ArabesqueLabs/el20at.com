text = "يا اخى حرام عليك , حاطة الست فى دماغها ايه بتقولك سامعاها بنفسها, واحده هى اللى سوء الظن ماسكها من البداية لو هيه فعلا انسانة كويسه ما يجيش فى بالها ابدا ان مرات ابنها مش عاوزة تفتح لها الباب!!! و بعدين الحركات بتاعت حلو قوى دا و بكام و الكلام دا انا عارفاها كويس بررررضه من حماتى العزيزة و بس ما تقلقيش خالص يا هدى انا كنت عبيطة و هبلة زيك كدا تمااام فى الاول بتعامل بكل سلامة نية بس بعد فترة طويلة من المقالب و التنغيص على حياتى من غير ما اعرف مين السبب اتعلمت و فهمت الحركات دى اللى عمرى ما عرفتها فى بيتناو عاوزة تعرفى اعدت اد ايه حمارة (sorry)بس انا بعترف 3 سنين كاملين , على الاقل ادى انتى عرفتيها بدرى"
