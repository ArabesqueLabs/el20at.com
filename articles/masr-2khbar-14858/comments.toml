author = "معنى كلام الفقى"
posted = "2010-01-13"
text = "ان رئيس مصر القادم سوف يتم اختيارة بواسطة امريكا واسرائيل<br />وان 80 مليون مصرى ليس لهم اى لزمة<br />واى تعديل فى الدستور هرطقة وهرتلة وكلام فارغ<br />واى انتخابات هى صورية لاقرار واقع<br />وان رئيس مصر القادم خلاص تم اختيارة من المندوب السامى الامريكى والمندوب السامى الاسرائيلى وهو مرشح الوطنى جمال مبارك<br />فية معنى لكلام الفقى غير كدة<br />الراجل بيقول لكم بصريح العبارة ريحوا نفسكم مفيش فايدة<br />شكرا يا دكتور الفقى<br />والاخ حسنين هيكل هرب من الاجابة بطرح اسئلة على السؤال الموجة الية"
archived = "2010-03-14"
