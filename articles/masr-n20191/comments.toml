subject = "ارجية اية ومخابرات اية - صاحب السفينة دفع فدية قدر"
posted = "2009-03-05"
text = "لا تقولى خارجية ولا مخابرات - خارجية اية يا ابا الحاج ومخابرات مين اللى هتفرج عن سفينة مختطفة دول اقصى حاجة يعملوها انهم يقبضوا على شوية عيال بدقون ويقولوا عليهم اخوان مسلمين وهيقلبوا نظام الحكم<br />الحكاية با اختصار شديد ان صاحب السفينة دفع مليون دولار وهو نفسة قال كدة فى برنامج تليفزيونى"
