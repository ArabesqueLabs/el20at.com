subject = "هو ذلك (الجيش )الذى سوف يحرر فلسطين؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-03-15"
text = "هااا هاا هااا هااااااااااااااااااااااااااااااااااااااااااا هااااااااااااااااااااااااااااااااااااااا<br />هذة احدث موضة هو دة الجيش الديجيتال اياة اللى سوف يحرر (فلسطين)<br />و سلملى على الفقى؟<br />و رقصنى يا جدع على القنوات (المصرية)<br />ها ها هاااا جاى جاى جاى جاى جاى جاى<br />قال (أنس) يأنسى<br />أنسى يأنس من غير فقى بطاقية (أعمى) و (كفيف) و لا( يشوف )و لالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالا (يفهم)؟!!!"
