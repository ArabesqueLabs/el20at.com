author = "تكفير اية وبدنجان اي"
posted = "2009-06-08"
text = "تفكير اية وبدنجان اية<br />احنا لسة بنفكر بعقلية صلاح نصر والتخلفات القديمة والهبل يصدقوا<br />القصة هى البطالة والفقر وناس عندها فلوس كتير قوى وناس مش لاقية تاكل<br />فالناس اللى مش لاقية تاكل بتسرق وتقتل وتحس ان دى فلوسها المسروقة<br />انما نقول تكفير وبشكير وزمهرير فهذا كلام لم يعد يدخل الدماغ<br />هل لو كان لهؤلاء الشباب فرصة عمل كانوا سرقوا - هل لو كانت دخولهم تكفيهم كانوا سرقوا - ابدا<br />فية ناس دلوقتى مستعدة تتجسس للشيطان او اسرائيل بس تاخد فلوس علشان تعرف تعيش<br />لقد فكك المجرمون المجتمع المصرى واضاعوا عملية الانتماء للبلد<br />اللى افقر هؤلاء الشباب وتسبب فى بطالتهم هو الكافر"
