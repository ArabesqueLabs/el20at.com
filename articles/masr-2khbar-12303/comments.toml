author = "محكمة الثورة"
posted = "2009-06-09"
text = "عثرت على كتاب فيها محاكمات الثورة لاعضاء الاخوان بعد حادث المنشية<br />كان اعضاء المحكمة صلاح سالم وانور السادات وضابط تانى وكانوا بيحاكموا اعضاء الاخوان - واحد سمكرى بوابير جاز والتانى مش عارف اية والسادات يسال اسالة كبيرة فى المحكمة<br />وصلاح سالم يسال العضو انت حافظ الفاتحة فيرد عضو الاخوان ايوة فيسالة انور السادات ان يقراها بالمقلوب<br />العملية كلها بوليتيكا وعمل راى عام مضاد لاتجاة معين والموضوع لا اصل لة<br />وفى النهاية تكتشف ان الموضوع هايف وان الناس دى فاضية وملهاش شغل وعايزين يتسلوا - زى الاخ اللى عايز بتاع البوابير يقرا الفاتحة بالمقلوب<br />شعب ضحكت على جهلة الامم"
