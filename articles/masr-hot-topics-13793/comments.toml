text = "هوه محدش عنده شهداء الا فى الجزائر دا احنا مات عندنا 80 مليون غير الموجودين دلوقت<br />بس انا معاهم لازم يحسوا بنوع من الحقد والغيره وممكن توصل ل الكراهيه او وصلت خلاص<br />احنا ابطال القاره النادى الاهلى بيرعب فرقهم شرفناهم هما والعرب وافريقيا فى كاس القارات اسم مصر اللى بيشتموها مذكور فى القرأن مواقفنا معروفه مش بس معاهم مع كل العرب يبقى ازاى ميكرهوناش<br />اللى عامل جروب وبيقول احنا اخوه وعرب اوك بس المعامله بالمثل زى ما عملوا فينا هنعمل فيهم زى ما خلوش لعبيتنا تنام مش هيناموا زى ما عملوا على لعبيتنا ضغظ فى الملعب هيشوفوا يوم مش هينسوه حتى لو خسرنا لاقدر الله بس كل واحد يبقى عرف المصريين ممكن يعملوا ايه و انا متاكد ان بعد يوم 14_11 كل العالم هيعمل حساب لينا<br />ان الاوان ان صوتنا هوه اللى يعلا يعرفوا ان المساله مش سهله اه هى كوره ومش مستاهله بس البادى اظلم واوعوا تفتكروا ان انتوا فى رحله"
