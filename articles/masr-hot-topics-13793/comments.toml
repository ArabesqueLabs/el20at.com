text = "مصر هى الام والراعى للدول العربية وهى سبب من اسباب خروج الفرنسيين وتحملت نتائج هذه المساعده من حروب فلا يجب على الجزائريين اخوانى فى العروبة والاسلام نسيان هذا امجرد كلام من مجموعة من الحاقدين"
