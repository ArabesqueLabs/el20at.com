posted = "2009-11-27"
text = "بسم الله الرحمان الرحيم يا شعب مصر نحن شعب واحد الجزائر مصر و مصر الجزائر هذا عيب كبير العدو الحقيقي يتفرج علينا و هذه اصلا لعبة فيها ربح وفيها خسارة من فضلكم من فضلكم و من فضلكم لا تتركوا الشيطان الحقيقي يتغلب عليكم نحن عرب مسلمين ديننا الاسلام و ربنا واحد هو الله عز وجل فتركوا الرحمة تدحل قلوبكم فذلك هو الفوز الحقيقي و المحتم ذلك هي القوة من فضلكم من فضلكم على وجه الله تعالى لا غير و شكرا نور الهدى من الجزائر."
