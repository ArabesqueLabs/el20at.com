text = "ان شاء الله تكون مباراه تسودها الاخلاق والاحترام المتبادل بين لاعبي الفريقين<br />وخاصه مشجعي المنتخبين لان هذه مباراه مدتها 90 دقيقه وهتخلص اما الشعبين فسيظلو اخوه الي الابد<br />انا مصري واتمني فوز مصر ان شاء الله ولكن ماذا سيحدث اذا لم تتأهل مصر الي المونديال هقول امر الله ربنا مش عاوز مصر تكون في هذا المونديال فهذه اراده ربنا سبحانه ومفيش اي مخلوق يسطيع ان يتحكم في اراده الله ولكن اتمني فوز مصر في المباراه واذا لم يحدث اتمني من كل قلبي ان تسطيع مصر دخول والمشاركه في المونديال القادم ان شاء الله و الان يجب علينا ان ننتظر يوم المباراه ونري من سيفوز ان شاء الله مصر وستكون فرحه ليس بعدها فرحه للشعب المصري باذن الله. (مصري الي الابد)"
