text = "اتمنى فوز مصر والصعودالى كاس العالم والتحليق بامنيات شعبنا وقاره افريقيا كلها الىلفاق جديده فى المونديال والملعب بينا ايها الجزائريون يوم النصر للمصريين بادن اللهوادا لم يكن فنكون اول من يهناكم لاننا شعب يحب الرياضه ويقدر الروح الرياضيه ولن ننساق لسخافتكم هده الحمقاء لاننا اكبر بكثير منغوغاء الصبيه والصحافه عندكم التى تخدع الجماهير عندكموبتسخنهم وكانكم مقبلون على حرب ولاننا دائما على قدر المسئوليه سيكون ردنا يوم المباراه مصر مصر مصرمصر مصر :P"
