[[comments]]
order = 1
subject = "فتش عن عمال الامن"
author = "نيفين نيفى نوفا"
text = "فعلا الموضوع جميل و العنوان اجمل ووصل الرساله<br />و للاسف يا جماعه دره عقد التجسس داخل اى جهاز او منشاه هما العمال سواء امن او غيره لانهم بحكم عملهم بيكون ليهم احقيه التجول فى المكان و بيكون التجسس مش شرط بمعناه الواسع لامن الدوله لا دا ممكن يكون بمعناه المحدود لرئيسك المباشر مثلا و تيجى فى يوم تقول لرئيسك اللى كان كويس معاك امبارح صباح الخير يا فندم تلاقى الابتسامه الصفرا التمام و ساعتها تقول لنفسك و لغيرك و الاعتذار لنابليون (فتش عن عمال الامن)او غيرهم من العمال"
archived = "2007-06-12"
capture_url = "https://web.archive.org/web/20070612151155/http://masr.20at.com:80/newArticle.php?sid=10571"
