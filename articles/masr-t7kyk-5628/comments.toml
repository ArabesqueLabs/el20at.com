order = 0
subject = "تريثووووووووووووووووووو و لا تتسرعو"
author = "نيفين نيفى نوفا"
posted = "2007-04-29"
text = "فكره الفرد اللى بيخرج من الشله او مجموعه الاصقاء و يقلب الترابيزه و هو ماشى دى مشهوره جدا ف السينما العالميه و لكنها نادره المعالجه ف السينما المصريه<br />و سواء دا الموضوع الاساسى للفيلم او لا بلاش نتسرع و نحجر على رار الناس يا جماعه<br />سيبو الفيلم ياخد حقه ف المشاهده الكامله<br />و و كم من افلام ظلمتها دور العرض و حققت نجاح جماهيرى و نسبه مشاهده عاليه لما اتعرضت ف التليفزيون<br />بلاش نتسرع ف احكامنا"
archived = "2010-03-14"
