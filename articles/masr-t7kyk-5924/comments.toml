[[comments]]
order = 4
subject = "حاجه سريعة"
author = "باحث عن العدل"
posted = "2007-05-20"
text = "كم كنت حزين كلما تذكرت احد الاخوان و هو يكلمنى عن دور المرأه فى المجتمع و داخل الصف الاخوانى و انى لا أرى ما يراه و ان هناك حرية كنت انظر اليه من تحت عويناتى متسألا هل ادخل معه فى حوار طويل اكلمة عن دور المرأه فى الجماعة و هل لها دور فى اتخاذ القرار مثل الدخول فى مجلس الشعب او اختيار المرشد او اى قرار سياسى او انتخابى فى الاسر و الكتائب كنت قد احتكيت باخوان كتيييييييييييييييييييييييير لانى كنت منهم و اعلم ما سيصل اليه الحوار مثل ما قيل ان المرشد رشح 25 امراة لم تجيب غير د -مكارم الديرى (طيب فين زوجات الاخوان يعنى كل الاخوان بيفكروا كده طيب العيب كده عند الرجاله ؟؟؟؟و لا التفكير ده صح و أقعدى يا مرأه ... ) و ان المنصب تكليف مش تشريف و غيرها من التبريرات التى اتعجبلها كثيرا فقد اختزل صاحبى دور المرأه السياسى ودافع عن اختزاله بالتبريرات ...فكرت ان اقول له<br />ما المشكله ان تتم انتخابات الشعبه داخل الاخوان و يكون للمرأه صوت هل سيرفض الامن<br />اين المرأه من مكتب الارشاد<br />اين كتب ورؤى الاصلاح لكاتبات اخوانيات<br />اين التثقيف السياسى للاخوة و الاخوات<br />اين المراه فى اتخاذ القرار<br />ابدأ حواره ام لا قررت الصمت فسنبدأ و ننتهى من حيث بدأنا المره السابقه و لكنى اعجبنى جرأة الاخوات فى المقاله<br />فقررت ان اكتب ما جال فى خاطرى بسرعة فى هذه اللحظات وشكرا لكاتبة المقال"
archived = "2010-03-14"
capture_url = ""
