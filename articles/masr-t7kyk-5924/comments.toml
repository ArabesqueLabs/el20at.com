order = 0
subject = "الذكورية السبب"
author = "الهندي"
posted = "2007-05-19"
text = "المشكلة من وجهة نظري ليست بسبب الامن<br />لان الاخوان علي العموم مش بيحبوا انهم يعترضوا علي الامن لا<br />شباب ولا بنات<br />لكن المشكلة الفعلية<br />هو المنطق الذكوري في الجماعة من شخص<br />عاش يفها فترة<br />المنطق الذكور متغلغل في الجماعة<br />بشكل كبير<br />مع ان الجماعة جزء من مجتمع كلة ذكورية<br />فنجد ان هذا طبيعي للغاية<br />وشي عادي<br />يلا خير"
archived = "2010-03-14"
