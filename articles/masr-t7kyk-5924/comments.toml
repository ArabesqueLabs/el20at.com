subject = "اللى بيته من ازاز............"
author = "انا مش معاهم"
posted = "2007-05-20"
text = "هو فى عمل سياسى مسموح بيه للاخوة عشان تقولوا مفيش عمل سياسى للاخوات!!!!!!!<br />ثم ان ايه هو العمل السياسى بتاع اخوات الحزب الوطنى غير رحلات العين السخنة ودريم بارك<br />ثم ان هو فين دور اخوات الحزب الوطنى فى المظاهرات العظيمة اللى بينظموها ده لو كان شباب الحزب الوطنى يعرفوا يعنى ايه حق التظاهر.<br />ثم ان اشهر اتنين ستات خاضوا معارك سياسية حقيقية كانوا جيهان الحلفاوى ومكارم الديرى ودول اخوان.<br />ثم.......ثم اللى بيته من ازاز مايحدفش الناس بالتعديلات الدستورية."
archived = "2010-03-14"
