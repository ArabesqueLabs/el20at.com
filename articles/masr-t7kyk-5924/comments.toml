[[comments]]
order = 1
subject = "والله أغير مني"
author = "الحقيقة"
posted = "2007-05-19"
text = "اولا :تعليقا علي رد اخي هندي<br />اذكره بحديث النبي صلي الله عليه وسلم( أتعجبون من غيرة سعد لأنا اغير منه والله أغير مني )<br />ثانيا: نحن فعلا نتعامل مع نظام غاشم اعمي جاهل<br />يمكنه ان يتعرض بالاهانة او الاعتداء او اي سؤ للاخوات<br />اذا كان عملهم السياسي اكبر مما هو الان<br />واخوات عين شمس ليسوا منا ببعيد<br />واقول ان الاخوان كجماعة او كافرا او كاعائلات<br />غير مستعدين بالمرة لقبول التعرض للاخوات باي سوء<br />لانه فعلا خطا احمرا<br />وتجاوزه قد يؤدي الا ما لا يحمد عقباه<br />واكيد ماحدش هايقبل ان اي اخت تتعرض لسؤ<br />وانتوا عارفين ان ممكن يحدث اي شئ بسبب ذلك<br />وممكن تحدث فتنة واعمال انتقامية<br />وكمان العمل السياسي في الجامعة قد يتطلب الي اعتصامات مفتوحة<br />وهذا ما لا يمكنه ان تفعله الكثير من الاخوات وما لا يقبله اهلهن<br />واخيرا اذكركم برد المرشد لما سئل في جريدة الاهرام عن المشاركة النسائية في المجالس النيابية<br />فقا لقد طلبنا من الاخواة ترشيح 25 اخت ولكن لم تتقدم الا اخت واحدة -د مكارم الديري- لن هذه عقليات الرجال لن تجد من يطيق ان تتعرض زوجته او بنته او اخته لاي اهانة او اعتداء او سوء<br />وهذا طبعا من حقهم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "الا من يتشدقون بالذكورية"
author = "هشام - مصر"
posted = "2007-05-19"
text = "المناصب في الاخوان لست تشريفا ولكنها تكليفا<br />اي اخ في موضع المسئولية فهو في دائرة الرصد لدي النظام الطاغي<br />وهو معرض لاي وقت الي الاعتقال او الفصل او الضرب او الاهانة<br />فالمناصب في الاخوان ليست تشريفا ومفخرة لكنها تكليفا ومسئولية وحمل ثقيل<br />اعان الله من تولاها وقدر علي تحملها وصبره الله عليها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
