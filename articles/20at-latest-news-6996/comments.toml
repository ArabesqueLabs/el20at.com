subject = "هههه علشان نبطل عنجهية سعودية كدابة"
author = "ديموس"
posted = "2007-11-07"
text = "فين الاخوة السعاودة اللى عمالين ليل نهار يسبو المصريين ويقولوا ان السعودية بتصرف على المصريين ييجوا يشوفوا السعوديين اخوانهم بيعملو اية فى مصر<br />والحمدلله الكلام دة جة على لسانكم انتم يعنى وشهد شاهد من اهلها<br />ياريت بقى يا سعاودة تبطلو عنجهية ونعرة كداية ا مصر اى نعم دولة نامية ومش غنية لكن رجالها كرامتهم اغلى عندهم من كنوز الدنيا<br />وسلملى على اغنى دولة عربية هههههههههههههههههههه"
