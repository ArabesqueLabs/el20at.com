[[comments]]
order = 2
subject = "سعودية و افتخر و قبل كدا انا عربية و افتخر"
author = "هدى-السعودية"
posted = "2008-02-17"
text = "انا اتفق مع الاخت سوزي ،، لاني انا ما احكم على الشعب بتصرف بعض افرادة ،، و بعدين مين قال ان كل السعودين بيقولوا الكلام اللي كاتبة يا ديموس ،، انا سعودية و بأحترم مصر كدولة و كشعب و ان كان فيه نماذج سيئة فأنا اعتبرها فردية ،،و باحترم جميع الدول العربية ،،و كثير من صحباتي لهم نفس التفكير، بدليل ان عندي صديقات مصريات في السعودية و في مصر و في امريكا و نتراسل دايما،لكن كل واحد يشوف الناس بعين طبعة"
archived = "2010-03-14"
