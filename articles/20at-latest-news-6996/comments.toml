subject = "الحقيقة المجردة"
author = "سعودي"
posted = "2008-10-21"
text = "هذولا مصريين وليس سعوديين او اذا كانوا فعلا سعوديين فاكيد ان امهم مصريه وطلعوا لخوالهم النصابين الحرامية الشحاذين<br />من امثال ديموس الحقير , ويبغون هؤلا المصارية يتزوجون سعوديات (يخسون).<br />وماذا ترجوا من قوم يجمعهم الطبل وتفرقهم العصا ."
