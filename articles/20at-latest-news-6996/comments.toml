[[comments]]
order = 3
subject = "يبقى لا تعايرنى ولا اعايرك"
author = "ديموس"
posted = "2008-07-07"
text = "يا اخت هدى انا موافقك على كلامك ان تصرفات الافراد لا تمثل مطلقا شعب كامل<br />لكن لو دخلتى الى اى شات عربى او اى منتدى سوف تجدين ما اقصدة وهو تعالى الاخوة السعوديين على المصريين ووصفهم لهم بانهم شعب لا يجد قوت يومة ويصفونهم بالعبيد الذين يخدمونهم فى بلادهم<br />وكمان دليل يؤكد صدق كلامى<br />وهو حظر السلطات السعودية على النساء السعوديات الزواج بمصرى<br />انتى تصفى الحظر دة باية؟؟ انا اصفة بانة قرار عنصرى وفية اجحاف وتعالى من قبل الاخوان فى السعودية بحق المصريين"
archived = "2010-03-14"
