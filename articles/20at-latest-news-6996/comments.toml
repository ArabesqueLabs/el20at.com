order = 1
subject = "ضع عنوان التعليق"
author = "سوزى"
posted = "2007-11-12"
text = "عيب ياجماعه والله كلامكم ده!!قال يعنى إحنا مش عارفين إن فى مصريين بينتحلوا هوية الشيطان نفسه لو ده يساعده على النصب!!!يعنى لما يجوا يعيبوا علينا ندافع ونقول دى حالات فرديه وصوابعك مش زى بعضها و.....؟؟لكن لما يكون الكلام على غيرنا على طول نهاجم ونشمت؟؟الدنيا كلها فيهاكده وفيها كده؟وبعدين مش ح نبطل بقى شغل عيال صغيره؟؟ده سعودى ده مصرى ده ليبى ده نيله!!كفايه بقى بهدله فى بعض فى حاجات اهم بكتير بلاش تفاهه!!!وعلى فكره انا مريص متأصله والله العظيم بس الحمد لله مؤدبه زى كتير غيرى من المصريين والسعوديين اللى ماردوش عليكم!واللى بعتذر لهم عن الكلام ده..وأظن بقى ماحدش يعرفنى عشان نقول تملق ونطول لسانا؟؟؟سلام"
archived = "2010-03-14"
