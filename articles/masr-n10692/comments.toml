[[comments]]
order = 15
subject = "لقرارات العشوائية التى أدت الى الأمية فى التعليم وأفسدتهةة"
author = "عفت جمال الدين أسماغيل"
text = "السلام عليكم<br />الى السيد / أحمد شوبير<br />تحية طيبة و بعد<br />أبعث اليك بهذه الحقيقة التى أدت الى الأمية فى التعليم فى مصر ، وهى العشوائية فى أتخاذ القرار ، فكل وزير يأتى الى الوزارة يصدر القرارات الغير مدروسة ، أو المدروسة بعشوائية ، ويجد المهللين . المتملقين . المشجعين له ، مما أصاب العملية التعليمية فى مقتل ، وأدى الى الأمية فى المرحلة الأبتدئية ، ومن أمثلة القرارات العشوائية . (1) الغاء السنة السادسة ثم رجوعها وما صحب ذالك من تهليل وتأيد فى القرارين .<br />(2) القرار بالغاء معاهد المعلمين و المعلمات ، بدون وجود البديل . وسوف أرصد لسيادتك فى تقريرى بعض الحقائق<br />(3)القرار بالتعين العشوائى لخريجى الجامعات كمدرسين بالمرحلة الأبتدائية دون النظر الى انهم غير مؤاهلين تربويا أوفنيا او نفسيا. مما أدى الى ضعف الملقى للمتلقى ، فانتشرة الأمية بين التلاميذ كالنار فى الهشيم ، فأصبحت الدروس الخصوصية هى السبيل لأنجاح التلاميذ ، وأصبح الغش فى أمتحانات النقل هو المتبع فى المدارس ، لكى ينجح التلميذ وعدم أغضاب ولى الأمر المغشوش فى مستوى ابنه ، وليستمر المدرس فى أستنزافه لأخذ الدروس الخصوصية لكى ينجح .<br />(4) القرار بالتئهيل التربوى للمعلمين اللذى طبق على البعض ولم يطبق على كل المدرسين ، مما أدى الى هروب المدرسين من تخصصاتهم اللأصلية الى تخصصات أخرى بعد أعادت التعين بالموأهل الجديد .<br />(5) القرار بأنشاء الوحدة المنتجة بدون وجود المدرسين الفنيين المتجصصين لأسناد الأشراف لهم .<br />أ - فالوحدة المنتجة أساسا تقوم على التصنيع و الأبتكار فى المجالات الصناعية و الفنية و الزراعية والأقتصاد المنزلى والكشفية الرياضية ، وتعرض فى المعرض الدائم بالمدرسة ، ليتم بيعها بواسطة التلميذ ، لنصل الى الهدف المنشود من أنشأة ،وهو أكساب و تعليم التلاميذ فنون التعاون التجارى والصناعى فى تكوين الفرق التى ستقوم ، بالشراء والتصنيع والعرض والبيع ، تحت أشراف المدرسين كلا فى تخصصة .<br />ب – واللذى أفشل هذا القرار وهو أسناده الى مشرف المقصف التعاونى بالمدرسة مما أفقده الهدف المنشود اللذى أنشاء من أجله هذا المشروع .<br />أبدء تعليقى بسؤال الى اللذين يدعون بانهم مسؤلين بالتربية والتعليم وأخص بسؤالى معالى الوزبر اللذى يعيش على عبارة كله تمام ياريس العبارة التى سببة هزيمة 67، وهى نفسها التى أدت الى الأمية والتخلف فى التعليم. 0 0 هل يعلم السادة المثل القائل أن فاقد الشىء لأ يعطى؟ هل يعلم أن الموجهون الأوائل فى وزارة ينتدبو المدرسين من المدارس للعمل كموجهين بمقابل؟!؟!؟ وذالك تحت بند سد العجز، وكذالك بمباركة الموجهون العموم بالمحافظة متخذين بذالك مبررا بان الوزارةلاتقوم بالترقيات المطلوبة لسد العجز !!!!!!!!!!!!........ فهل يعقل أن يقوم مدرس ليس له خبرة فى التوجيه الفنى بتوجيه زميل له ؟ الرسوب الوظيفى وياله من مساوء . هل يعقل أن يستمر المدرس اكثر من عشرون 20 سنة بدون ترقة مثال أنا شخصيا جلست فى وظيفة مدرس من سنة 75 الى 89 ومن مدرس أول 89 الى وكيل98 ومن وكيل الى موجه 98 الى 2004 !!!!!المدرس خريج 85 لم يرقى حتى الأن لوظيفة مدرس أول(22 سنة) يانون عدم الترقية !!! هل الكادر سوف يورقيهم؟ أسئلة كثيرة نريد الاجابة عليها من جهابزة التربية والتعليم ، وواضعى القوانين سيئة السمعةبتوع كلة تمام ياريس ؟؟؟؟؟؟؟؟؟؟؟؟ .عندما كنا طلبة كانت المدرسة والمدرسين عند زيارت أى موجه (موفتش المسمى الوظيفى سابقا) يكون الظبت والربط والرعب والاحترام سيد الموقف فى المدرسةمن الفراش الى ناظر المدرسة ، والان الأمبالاة هى السائدة لأن الموجهون ليس موجهون !!!!!!!!!!!!!!!! والقيادات فى وادى والأدارات المدرسية فى وادى أخر ، وهو الجرى وراء المجموعات المدرسية . والوحدة المنتجة. التى تدر المال ونسوا أو تناسوا العملية التعليمية وبعدين تقلى جودة التعليم، وتطويره، لكى الله يا مصر . أرجوا نشر هذا فى الجريدة وليس على الموقع لكى يقرأه رئيس الجمهورية، ليكون على دراية للواقع الأليم اللذى تعيشه البلد .ويكفينا عبارة كلة تمام ياريس . لأنه لن ولم ينصلح هذا البلد طالما القيادات ليس فى يدها القرار وتنتظر التعليمات والتوجيهات، لكى تقوم بالعمل للهروب من المسؤلية وفى النهاية لايسعنى الأ قول لكى الله يا مصر<br />ولمذيد من الاستفسار ارجو الاتصال بي علي 33870970 او 0101945322 و شكرا .<br />عفت جمال الدين ."
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022550/http://masr.20at.com:80/newArticle.php?sid=10692"

