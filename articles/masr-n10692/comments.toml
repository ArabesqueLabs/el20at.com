subject = "وايه يعنى"
author = "محمد الحسينى"
text = "انا مش شايف الموضوع مهم للدرجة دى شوبير فى دريم فى التلفزيون المصرى ايه المشكلة ولا حاجه ولا يمثل اى فرق<br />انا مش عارف برضه ازاى الباشا ده وصل لكل ده فى عشر سنين بس يكونش مناسب حد كبير واحنا منعرفش<br />الى عايز اقوله ان شوبير شخصية لا يوثق فيها واعتقد انه شخصية لبلابية متحورة حسب كل لون وحسب المصلحة"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625191442/http://masr.20at.com:80/newArticle.php?sid=10692"

