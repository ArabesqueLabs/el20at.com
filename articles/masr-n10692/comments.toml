subject = "هذههى الأسباب الحقيقية التى أدت الى أغتصاب الأنثى فى الشارع المصرى"
author = "عفت جمال الدين أسماعيل"
text = "السلام عليكم<br />الى السيد / لكل أصحاب النخوة والشرف<br />تحية طيبة و بعد<br />. فالفساد والظلم والأستبداد والمحسوبية والنفاق والرشوة والأحتلال .هذه هى الأسباب التى أدت الى قيام ثورة 23 يوليو,يضاف اليها اليوم البطالة والأنفلات الأمنى والأخلاقى والآه مبالاه والقهر والفقر والأمية وألأرهاب ...ألخ من مساوء الحكومة. هل البلد تحتاج الى ثورة اليوم ؟ نعم و1000 مليون نعم.ثورة للأصلاح وآه ه ه ه .. وأرجوا أن تقتل هذا الموضوع بحثا وتمحيصا ،وأخذ أراء المتخصصين والفنيين وسؤال طلبة وتلاميذ المدارس بمختلف مراحلها ،و بعد أن تقرأ هذا الموضوع لتتبين صدق كل ما جاء به، لتستطيع اتخاذ القرار بتمعن وأقتدار، وهذا ليس بجديد على معاليك ..أرسل لسيدتك هذا الموضوع لانى أتوسم فى معاليك الجدية فى أنتقاء الموضوعات البنائة الهادفة للآصلاح والتطور . وأرجوا أن تهتم بهذه الرسالة ، وتتبني فكرة الأصلاح بنفسك أنت وكل أخوانك الكتاب و المثقفين والنقاد الرياضين وكل من يهتم بالرياضة في مصرنا الحبيبه . اذا أمعنا النظر فيما وصلت اليه الرياضة في مصر من التدني والتدهور العا م علي مستوي الشباب والأطفال ، يرجع الي عدم الاهتما م بالتربية الرياضية في المؤسسات التعليميه لعدة أسباب من أهمها عد م وجود النخبة المتخصصة في الأنشطة التربوية والرياضية ,ولمعالجة ما أفسدتة القيادات في الأعوام البائده يجب أن ننظر من منظور التطورات الحديثة في عالمنا الحاضر التي تشهد أهتماما متذايدا بضرورة عودة الأنشطة التربوية والرياضية لمكانتها حيث أنها الجذء الهام المكمل للتربية المتكاملة ، وأنها التربية الخاصة ضد كل ظواهر . {{ { الأرهاب والتطرف والأنحراف والأدمان والشزوز و الكبت الجنسي والأنفلات الأخلاقى وأغتصاب الأناث المنتشر هذه الأيام فى الشارع المصرى .}}}}}}}} حيث أن التربية الرياضية جزء متكامل ومكمل للعملية التربوية ، تحقق من خلال ممارسة الانشطة الحركية، لتكوين مواطن متكامل بدنيا ومهاريا وأدراكيا ووجدانيا وصحيا ، يستلزم هذا جهود جبارة ، ووضع أسس ومناهج ترتبط بالقيم الفلسفية والوجدانية والاجتماعية والتربوية لتحقيق أهداف المجتمع بالرغم من أن الانشطة الرياضية .تعمل علي بناء الجسم السليم للتلميذ ، فهي أيضا تهذ ب نفسه وتعوده علي روح التعاون بين الزملا ء ، وتعلم القيادة السليمة وأحترام الأخرين ، وتعني باشباع حجاته ورغباته أثناء ممارستها ، كما تحقق أتجاهاته نحو الدقة والنظام والنظافة والعمل علي الحفاظ علي الملكية العامة ، وذلك لآ يتائتي الأ بوجود المعلم التربوي المتخصص ، الذي يقوم بالدور الحقيقي المنوط به في تعليم طلابه ، كيفية الاعتماد علي النفس ،وأيجاد الحلول لمشكلاتهم تحت أشرافه ، وبذالك يكون قد خلق قيادات المستقبل . أين ذهبت الشهامة والشجاعة والمروئة والمروة و الشرف فى رجالات الحكومة؟؟!!. وفى النهاية لآ يسعنى الأ الحسبنة على المقصر فى أخفاء الفساد . ولكى الله يامصر.!!!! من قبل ومن بعد..!!<br />ولمذيد من الاستفسار ارجو الاتصال بي علي 33870970 او 0101945322 و شكرا .<br />عفت جمال الدين ."
