[[comments]]
order = 12
subject = "فضلا - أيها الأخوه الكرام"
author = "مستشار مصطفي عبد الخالق"
text = "يؤسفني حقيقة مايرد من بعض الأخوه من تعليقات يندى لها الجبين وتستهين بالحاكم والمحكوم دون علم بمجريات الأمور ودون أدني مسئولية علي مصالحها أو طوالحها ان صح التعبير .. ولكن ما ورد من بعض الأخوه للدفاع عما يسمي الاخوان المسلمين .. فهو حزب منحل فوضوي ليس له علاقه بالشرع أو منهج الاسلام والمسلمين والدليل يا أخوه ..أن رسول الله وصحابته الكرام - لم يكونوا اخوان .. ولم يكونوا في جماعة الجهاد .. ولم يكونوا .. ما يسمي انصار السنه والجماعة .. ولم يكونوا جمعية السنه المحمديه .. ولا الشاذليه ..ولا احمديه ....الخ .. ولكنهم كانوا مسلمين .. كلهم جمعهم الاسلام تحت راية اسمها \" الاسلام \" هو سماكم المسلمون من قبل .. لذا وقبل أن ننقاد وراء أعداء الوطن وأصحاب الشعارات المزيفه أرجو كما أمرنا الشارع الحكيم رسول الهدي أن نلتف حول القائد وأن ندعمه وأن نؤيده وأن نسانده ونؤازره وأن ندفع عنه كل شبهة تذكروا يا اخوان حديث الرسول الكريم \" عليكم السمع والطاعه ولو تأمر عليكم عبدا حبشيا \" .. ديننا الحنيف لم يعرف خزعبلات الانتخابات ولا خزعبلات الأحزاب ولم يعرف خزعبلات الديموقراطيه التي صنعتها أمريكا وبريطانيا وحلفائهم في العراق وأفغانستان ولبنان وفلسطين .. ثم يريدونها سوداء في السودان ....انتبهوا يااخوه مما هو اخطر من اثارة المشاكل الداخليه فالعدو يترصد بكم ويريدها أرضا محروقه كما فعل في العراق والان نقول أين أنت ياصدام .. أسالكم الله هل ديمقراطية امريكا في العراق افضل أم حكم صدام الشهيد ؟؟؟<br />أخواني الأفاضل أناشدكم الله حب مصر وحب ارضها وحب اخوانكم وحب قادتكم هذا هو ترابطكم للصالح العام وان كان ولا بد وهناك بعض الملاحظات فلنقدمها باسلوب حضاري يناسب مكانة القائد فالقائد هو محل الأمير الذي أمرنا رسول الهدي بطاعته السمع والطاعه يااخوان وادعوا له بالتوفيق والسداد فلن تعرف مقام وقيمة هذا الرجل الا بعد عمر طويل ان شاء الله<br />سامحوني علي الاطاله وفقكم الله جميعا والسلام .."
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625191442/http://masr.20at.com:80/newArticle.php?sid=10692"

