[[comments]]
order = 0
subject = "الف مبروك عليك يا شعب مصر"
author = "مش ضروري"
text = "الف الف مبروك على الشعب المصري الاهبل المسكين العبيط المقهور المغلوب على امره بان المليونير شوبير حيرجع التلفويزن المصري تاني الف الف مبروك<br />وعقبال ابو تريكه وبقية اللعيبه الهليبه<br />لما الحكومة فوجئت بان الاخوان المسلمين نازلين الانتخابات بكل ثقلهم الحزب الوطني عرف انه مهزوم مهزوم هزيمة نكراء لا ريب في ذلك واللي انقذه لعيبة الكوره"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625191442/http://masr.20at.com:80/newArticle.php?sid=10692"

[[comments]]
order = 1
subject = "اثلجت صدورنا يا شوبير"
author = "مش لازم"
text = "يا سلام يا شوبير<br />اثلجت صدورنا بهذا الخبر السعيد<br />فكرتني يا شوبير ايام ما كنت صغير وكنت اهبل وعبيط وبشجع النادي الاهلي وكنت بروح الاستاذ علشان خاطر اتفرج على الماتش قبل الميعاد بخمس ساعات في عز الشمس<br />النتيجة ايه يا شوبير<br />ان انت ساكن في الزمالك<br />وانا ساكن في عزبة النخل<br />بفضلي انا وبفضل الناس الهبل والعبط بقيت يا شوبير انت والخطيب مع الناس الاكابر في الزمالك<br />وانا والناس الهبل والعبط ساكنين في العزب<br />يا جماعة سيبوكم من الكورة والكلام الفارغ حوشوا فلوسكم احسن وما تدوهاش للعيبة الكوره والممثلين والمطربين علشان خاطر يبقوا اسيادتكم ويسكنوا في الزمالك ويركبوا الزلمكه ويطلعولكم لسانهم<br />الناس الزباله بفلوسكم اصبحوا اسيادتكم ونخص بالذكر<br />عادل امام<br />عمر دياب<br />وكتير كتير كتير بفلوسكم بقوا اسيادكم"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625191442/http://masr.20at.com:80/newArticle.php?sid=10692"

[[comments]]
order = 2
subject = "والله رحمتنا"
author = "ابو اسامة"
text = "الحمد لله رحمتنا من سحنتك ورحت للهبل الى لسة بيتفرجوا على تلفزيون الحزب الوثنىانا مش عارف الناس بيتفرجوا فيه على ايه وعلى فكرة يا عم شوبير يالى واخد نصف وظايف مصر التلفزيون بتاع حزبك ده مفيش الا الهبل الى بيتفرجوا عليه<br />بدليل ان الدعايات الى عليه اختفت ما عدا طبعا دعيات الحزب وكدة الواحد يتفرج على الش برواقة ."
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625191442/http://masr.20at.com:80/newArticle.php?sid=10692"

[[comments]]
