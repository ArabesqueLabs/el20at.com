subject = "أرزاق"
author = "جمال محمود معتوق"
text = "أرزاق يادنيا صعلوك فى عشر سنيين يبقى أعلامى رزق ألهبل على ألمتخلفين أولا شرط أن تكون أعلامى أن تكون وسيم وأنت أيها ألصعلوك ألمنافق مافكش ريحة ألوسامة ألشرط ألتانى أن تكون متعلم فى هذا ألمجال بس بلدنا بلد ألكوسة ألشرط ألثالث أن يكون صوتك فيه شوية رقة ولكن أنكر ألأصوات لصوت ألحمير فأما بمناسبة مجلس ألشعب فأنت لاتعلم أى حاجة عن ألشعب وألطنطاوية ألذين أختاروك أكيد أساؤ ألأختيار ,لو سألتك أيها ألمنافق يعنى ايه ديمقراطية أنا واثق أنك لاتعلم عنها شيأ أنت تعلم فقط كيف تكون منافق وقوادااا ولاتعلم من هم ألبيت بيتهم ألا ألمنافقين أمثالك"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625191442/http://masr.20at.com:80/newArticle.php?sid=10692"

