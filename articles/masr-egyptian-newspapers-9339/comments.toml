subject = "عيب والله"
author = "اكتب اسمك هنا"
posted = "2008-06-16"
text = "عيب أوى لما الحكومة تقول اننا بتواجه مشكلة فى السكان<br />شكلنا بقى وحش أمام الصين<br />الصين عرفت قوتها فين .... في الشعب اللى عنده ايدين وفم واحد<br />وبعدين الشعب دلوقتى حاطط كل المشاكل على حرامية الحكومة ، صعب جدا يقنعونا اننا نعمل أى حاجة أو نتعب نفسنا فى أى شئ<br />احنا فعلا زهقنا من كلام الحكومة وبقينا بنعند معاها .. ما هى خربانة خربانة"
