subject = "احنا مش فى حالة سلام"
author = "سين صاد"
posted = "2007-11-30"
text = "سؤال بايخ من شاب رخم شوية<br />مش فية اتفاقية سلام مع اسرائيل وعلاقات حميدة جدا مع امريكا<br />يبقى اية لزمتة التجنيد الاجبارى<br />واجبارى لية ؟<br />ما يخلوة كلة متطوعين زى تركيا والدول الاروبية وامريكا<br />التجنيد الاجبارى لما يكون البلد فى حالة خطر او حرب<br />انما احنا فى سلام وامان فى عصر الرئيس مبارك - ربنا يطول فى عمرة"
archived = "2007-12-11"
capture_url = "https://web.archive.org/web/20071211172521/http://masr.20at.com:80/newArticle.php?sid=12633"

