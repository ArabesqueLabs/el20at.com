[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-12-03"
text = "لامؤاخذة..!<br />* بالتأكيد يؤلمك منظر الشرفاء الذين يقفون ليل نهار لحراسة المبنى الذي يعمل فيه اللصوص !<br />* بعد سنوات من النهب المتواصل قرر هو وعصابته تشكيل منظمة غير حكومية لمكافحة الفساد !<br />* ليس لديه مشكلة أن يدافع عن الحكومة في الصحف والقنوات الفضائية ثم يلعن أبو الحكومة في جلساته الخاصة ؟<br />* في الحوار الإذاعي الذي أجري معه أخيرا كان واضحا أنه أصغر كثيرا من الكرسي الذي يجلس عليه!<br />* فوجئنا بالوزير كبير السن والجثة والمقام يغادر قاعة المؤتمر الذي يمثل فيه بلاده بحثا عن فتاة ليل !<br />* أخذ خازوقا حين سافر للعمل في الخارج وحين اتصل بهم طالبا النصيحة أقنعوه بالبقاء على الخازوق!<br />* كلما شاهدته يتأرجح وراء مكتبه تذكرت كيف كان يأكل الفول والبصل الأخضر على قارعة الطريق!<br />* أطلقوا عليه \"الخرتيت \" لقدرته على تحمل الإهانات وعندما شاهدناه يتحدث في الاجتماع أدركنا أننا في زمن الخراتيت!<br />* أعزب في الخمسين يبحث عن صديقة علما بأنه لا يقرب النساء ولا يمارس العادة السرية ولا يرغب في الزواج !<br />* لإغراء المراهقات ظل يصبغ شعره بالورنيش الأسود حتى أصبح رأسه أشبه بالحذاء القديم!<br />* بمجرد استقالته من عمله احتجاجا على الانحرافات الأخلاقية لرئيسه فتح شركة خاصة لتشغيل الخادمات !<br />* قابلني ثائرا بعد اختيار \"عطوة أبو مطوة \" بدلا منه للعمل في فرع الشركة بالخارج وعندما سألت عن\"عطوة\" تبين أنه قواد!<br />* كان نهداها يشعلان النار في جسده لدرجة أنه أعطاها ذات ليلة أرقام الشفرة السرية لحسابه في البنك الأوروبي!<br />* لم يكن رجلا تقليديا ..ففي زواجه الأول أقام مع زوجته الأولى في بيت أبيها وفي زواجه الثاني أقام مع زوجته الثانية في بيت أمها !<br />* تلتهم الطعام بنهم على جميع الموائد وفي نهاية العام تدخل المستشفى لإجراء عملية جراحية لشفط الدهون!<br />* أنعموا عليه بلقب \"قفة\" لألنه كان يسير ببذلته الوحيدة وراء صاحبنا في كل مكان وعندما أقالوا صاحبنا ترك لنا ورائه تابعه \"قفة\"!<br />* لم تكن ترى مشكلة في أن تمارس الحب كما تمارس الفن طالما أنها تأخذ مستحقاتها نقدا وبالدولار !<br />* بعد زيادة حالات الانتحار بسبب البطالة قرروا مواجهة المشكلة من الجذور بإصدار قانون يعاقب بسجن المنتحرين!<br />* كانت سكرتيرة مخلصة رفضت التخلي عنه عندما حاكموه بتهمة استغلال النفوذ وبعد إعدامه اكتشفوا عند توزيع التركة أنها زوجته !<br />* أصيب بانهيار عصبي حاد للمرة العشرين بعد أن تجاهلوه في التعديل الوزاري الجديد!<br />* عندما رأيته يسير على حبل الغسيل فوق سطح عمارته أخبرني انه يتدرب استعدادا للمنصب الجديد!<br />* بعد مشوار طويل من خيانة زوجته وأصدقائه وأقرب الناس إليه أصبح عضوا في لجنة القيم بالنادي الشهير!<br />* مؤامرات الآخرين هي الشماعة التي يعلق عليها فشله مع أنه خبير سابق في المؤامرات!<br />* عندما ضبطته زوجته في حضن الخادمة الفلبينية لم تطلب الطلاق خوفا من أن تؤثر الفضيحة على العمولات التي يتقاضاها من منصبه !<br />* في طفولته كان يحلم أن يكون مسئولا وعندما كبر وتولى المسئولية مازال يتعامل مع الآخرين كالأطفال !<br />* لعدم إجادته أي لغة أجنبية كان المرشح المثالي لمنصب المندوب الدائم لبلاده في الأمم المتحدة !<br />* أدهشني هجومه الحاد على الفساد في مقالاته لأنه حتى وقت قريب كان من الفاسدين !<br />* الأفاق الذي كان يجري وراء سيارة الوزير من اجل ترقية أصبح الآن وبعد تغيير الحكومة أول من يطالب بشنق الوزير!<br />* الحب عنده أن ينفق من أموالها بلا حساب على سهراته الحمراء مع صديقاتها!<br />* لم يكن الطبيب الكبير يتخيل أن مريضته سوف تنجب بعد كل هذه السنين ..وكانت المفاجأة أنها أنجبت طفلا له نفس ملامح الطبيب !<br />* بعد نصف قرن من الزواج اعترفت له أنها لم تكن تحبه وإنما تحب فلوسه ..فاعترف لها بعلاقته مع صديقتها!<br />* كاتب كبير اعترف في برنامج تليفزيوني أنه لا يقرأ لأنه لا يجد ما يستحق القراءة .. ثم تبين أنه لا يكتب أيضا !<br />* راقصة أسست جمعية لرعاية اليتيمات ثم حولتها إلى مدرسة لتعليم الرقص ورفع الساقين!<br />* طريقته في قيادة سيارته الجديدة تؤكد أنه لم يعد يتذكر الحذاء الممزق الذي دخل به الشركة منذ عامين!<br />* كان يحكي لنا دائما عن حبه لأولياء الله الصالحين ثم فوجئنا به أخيرا متهما في قضية نصب !<br />* عندما خطبها كان فقيرا معدما وبعد الزواج والعمل معها طبالا أصبح من أصحاب الملايين !<br />* مازال يعتبر نفسه محظوظا لزواجه من ابنة المدير بالرغم من أنها كانت حاملا من السفرجي في الشهر الثالث !<br />* ظل يتهمهم بالفساد حتى رشحوه للعمل بالخارج ثم أصيب بالخرس بعد أن أصبح فاسدا مثلهم !<br />* طلبت منه عدم الاتصال بها ثانية لأنها قررت أن تتوب ..وكانت المفاجأة عندما رآها في مكان ما في حضن رجل آخر!<br />* اتهامات العمالة التي يوزعها على الآخرين تذكرك بانتمائه للحزب الذي يصنف الناس إلى عملاء له و عملاء ضده !<br />* عندما رفعوا شعار تشجيع الاستثمار كانوا يقصدون ابتزاز المستثمرين وهكذا لم يعد هناك استثمار ولا مستثمرين !<br />* إذا كان الكلام من فضة .. فالكتابة في مدح المسئولين ورجال الأعمال من ذهب عيار 24!<br />* كتابه عن مشكلاتهم النفسية هو السبب في احتجازه منذ عشرين عاما في مستشفى المجانين !<br />* أغراها بكل الوسائل حتى تجاوبت معه وطلبت الطلاق من زوجها.. ثم تزوج أختها !<br />* بعد سنوات من الوقوف أمام دورات المياه لكتابة أسماء الداخلين والخارجين منها رشحوه لمنصب مهم في المجاري !<br />* في بعض المهن عندما يرحل العمالقة لا يخلفهم سوى الأقزام ..والسؤال من سيخلف الأقزام"
