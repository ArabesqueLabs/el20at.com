subject = "شهداء ولكن"
author = "----"
posted = "2008-03-05"
text = "هذا شيخ اخر تبرع بفتوى لم يطلبها منة احد<br />من خرج يطلب خبزا من المخبز ومات فهو شهيد - ايوة كدة - شهيد الحب الالهى<br />والخوف لا يطلع علينا مفتى النكد بفتوى انة من خرج يطلب خبزا فهو نجس وابن نجس وطماع وجزؤة جهنم وبئس المصير واذا مات - مات موتة فطيس كالحمار والعياذ باللة - وكان من الممكن ان ياكل جاتوة بدل رغيف الخبز ولا يموت<br />المصيبة تاتى من الفتاوى تصدر بدون ان يطلبها احد من الناس<br />المشايخ بيلقوها كدة جزافا وبمزاجهم"
archived = "2008-03-06"
capture_url = "https://web.archive.org/web/20080306021122/http://masr.20at.com:80/newArticle.php?sid=14532"
