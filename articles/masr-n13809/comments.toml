[[comments]]
order = 3
subject = "تهنئه وخلاص انما تحضر !"
author = "من الانترنيت"
posted = "2008-01-13"
text = "معاك تهنى وخلاص انما تحضر وتقف للفطيره دى يعنى تضحك يا سى الداعيه حتى مدونه مشاغبون بلاحدود كتبت<br />شكرا لك يا عموووره كشفت لنا شغل الكهنوت!!! من قلم :الساخر<br />أذاعت فضائيه أوربيت فى برنامج ( القاهره اليوم ) يوم 7-1 تقديم الاعلامى عمرو أديب طقوسا كهنوتيه !؟! من البطرخانه بالعباسيه والذى اِستمر لأكثر من 5 ساعات حتى يتم عمل الفطيره المقدسه؟!؟ ورأينا الكهنه يركعون !!؟ ويسجدون !!؟ للفطيره !!! وفى نهايه البرنامج رأينا الكاهن يضع قطع من الفطيره المقدسه فى الأفواه المفتوحه!! لتسرى دماء الرب يسوع فى عروقهم؟!!!؟<br />فشكرا لك يا عموره كشفت لنا شغل ولعب الكهنه اِنهم حقا يبرشوا الدماغ . وعلامات التعجب !!! تدل أن مارأيناه خارج حدود العقل ؟!؟ ويا مثبت العقل يـــــــــــــــــــــــــارب الواحد الأحد خالق السماوات والارض والذى لم يلد ولم يولد<br />http://tarkalwzer1.maktoobblog.com/"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117115100/http://masr.20at.com:80/newArticle.php?sid=13809"

