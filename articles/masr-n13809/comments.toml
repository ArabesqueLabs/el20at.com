subject = "المحاسب عمرو خالد"
posted = "2008-01-14"
text = "\"إن الله لا يقبض العلم انتزاعًا ينتزعه من العباد، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يبق عالمًا اتخذ الناس رءوسًا جهالاً، فسئلوا فأفتوا بغير علم فضلوا وأضلوا\"،<br />من السيرة الذاتية للمحاسب عمر خالد<br />• عضو جمعية المحاسبين والمراجعين المصرية 1994<br />• بكالوريوس تجارة – شعبة محاسبة – جامعة القاهرة 1988<br />• مؤسس وشريك بمكتب المحاسبون العرب بجمهورية مصر العربية 1998"
