[[comments]]
order = 9
subject = "و إنتم إيه اللى تاعبكم ؟"
author = "sameh"
posted = "2008-01-14"
text = "يعنى أنا نفسى أفهم إنتم إيه اللى تاعبكم ؟؟<br />الراجل بجد عاوز يعمل حاجة صح بعد ما الإخوان طينوا الدنيا ..<br />عاوز يعرف الدنيا كلها إن الإسلام بيتعايش مع الآخر و بيقبله ..<br />و إن المسيحية هى كمان بتقبل الآخر و تتعايش معاه ..<br />إنتم إيه اللى تاعبكم يعنى ؟؟<br />يعنى هو المفروض إنه يعمل زى شوية العيال اللى بشخة بتوع الإخوان و يهاجم و خلاص و فى الآخر يطلع حرامى زيهم و واخد فلوس علشان يهاجم ؟؟<br />يعنى هو إنتم لا بترحموا و لا بتسيبوا رحمة ربنا تنزل ؟؟<br />و عاوز أقول لعمرو خالد : إحنا كلنا معاك .. سيبك من الناس اللى بيشتموا و يشككوا .. زى ما المثل بيقول : القافلة تيسر و الكلاب تعوى .. سيب الكلاب تعوى يا عم عمرو ..<br />و زى ما الشاعر بيقول :<br />لا تأسفن على غدر الزمان لطالما ... رقصت على جثث الأسود كلاب<br />لا نحسبن برقصها تعلوا على أسيادها ... تبقى الأسود أسود و الكلاب كلاب<br />و اللى بيهاجموا و يشتموا دول شوية كلاب ولا فاهمين أى حاجة ..<br />و فى النهاية هقول لكل المهاجمين كلمة واحدة<br />خليها تاكلكو ......."
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117115100/http://masr.20at.com:80/newArticle.php?sid=13809"

[[comments]]
order = 10
subject = "الى sameh"
posted = "2008-01-14"
text = "يا ابني لازم تعرف ان الامر ما يحتاجش دا كله<br />عدد المسلمين 94% وعدد المسيحيين 6%<br />فاهم يا ابني ومسالة التعايش دي يتحملها المسيحيين وحدهم وهما طول عمرهم ناجحين في التعايش مع المسلمين<br />ورافعين شعار لله المجد في الاعالي وعلى الارض السلام وفي الناس المسره<br />لغاية ما جه الضابط شنوده ابو وش عكر واستغل الظروف السياسية السيئة لمصر مع شوية المرتزقه بتوع المهجر مع المخابرات الاسرائيلية<br />فغير المسيحيين رايهم وعدلوا مؤقتا عن لله المجد في الاعالي وعلى الارض السلام وفي الناس المسره وقال ايه عايزين يعملوا ثورة"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117115100/http://masr.20at.com:80/newArticle.php?sid=13809"

[[comments]]
order = 11
subject = "رد على (وانتو ايه اللي تاعبكم)"
author = "اكتب اسمك هنا"
posted = "2008-01-14"
text = "اللي تاعبنا ان الراجل بيشتشغل محاسب<br />ساب شغلته ليه وداير عمال يهجص<br />ومين اصلا اللي نصبحوا على المسلمين وخلاه يتحدث باسمهم<br />عجيبه والله"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117115100/http://masr.20at.com:80/newArticle.php?sid=13809"

[[comments]]
order = 12
subject = "يحكى قصص الدين كانها قصص قبل النوم"
author = "ومن قال انة داعية"
posted = "2008-01-14"
text = "بلسان الدغ يحكى بصبيانية واضحة وسذاجة متناهية قصص الدين كانة يحكى لاطفال قبل ان يناموا<br />للدعوة رجالها الاقوياء المسلحين بعلوم القرأن والحديث<br />نحن لا ننكر فضلة على بعض الاطفال<br />ولكن لبتعد ويكون بعيدا عن الاسلام السياسى<br />فلا يوجد فتنة ولا تناحر طوائف فلا يوجد فى مصر غير طائفة واحدة هى طائفة المسلمين واقلية 4 % ليس لها ذكر ولا تقوى على التناحر ساعة واحدة<br />فى فرنسا خمسة ملايين مسلم<br />وفى بريطانيا اربعة ملايين مسلم<br />وفى المانيا مليونين من المسلمين<br />وعندنا 4 -5 مليون نصرانى<br />فلا يوجد حاجة اسمها طوائف - انما طائفة الاسلام"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117115100/http://masr.20at.com:80/newArticle.php?sid=13809"

[[comments]]
order = 13
subject = "الف مبروك للقس اوالكس عمرو خالد"
author = "ابوبيضة"
posted = "2008-01-15"
text = "عميل المخابرات البريطانية بيمثل نفسة والناس اللى بيشتغل معاها وبلاش حد يجى فى الفارغة ويقول ان دة بيتكلم اوبيمثل المسلمين امابالنسبة للاقباط فهما حرين فى دينهم وطقوسهم طول مهما محترمين الاسلام وعارفين ان مصر بلد دستورة الاسلام اللى يدين بة اكتر من 95 بالمية من الشعب"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117115100/http://masr.20at.com:80/newArticle.php?sid=13809"

[[comments]]
order = 14
subject = "عمر خالد والدعوة"
posted = "2008-01-15"
text = "كون ان عمر خالد بيحب الدعوة الى الله وهو موهوب هذا شيء طيب دا<br />اما كونه انه ينصب نفسه مسئولا عن الدين في مصر هذا مرفوض<br />وبعدين زي ما الاخ قال فوق ان مسئولية التعايش دي مسئولية المسيحيين وحدهم<br />تماما زي المسلمين في امريكا او اوروبا هما اقلية وهما المسؤولين هناك عن التعايش مع المسيحيين<br />الاقلية هي دايما المسئولة عن قضية التعايش"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117115100/http://masr.20at.com:80/newArticle.php?sid=13809"

