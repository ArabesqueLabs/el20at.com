subject = "ضع عنوان التعليق"
author = "واحد من المدونين"
posted = "2007-12-28"
text = "أولا : التدوينة ظريفة و محاولتك للتأمل تستحق الاحترام يا براء<br />ثانيا: كلمة لإدارة الموقع و خاصة الجزء ده : هما ملحوظتين:<br />الملحوظة الأولى : ان القائمين على الجزءده بيجاملوا أصحابهم بقصد أو بدون قصد و مش بيجيبوا فيها غير مدونات ناس أصحابهم حتى و لو كان الكلام لا يستحق النشر و ده مش قصدي على موضوع البراء لكن قصدي على تدوينات أخري<br />الملحوظة الثانية : ان أقل حاجة انهم يحطوا لينك للمدونة أو للتدوينة فوق علشان الناس تطلع على المدونة و تقول رأيها<br />على العموم جهد جيد و نرجو الإستمرار مع محاولة الوصول للأحسن .<br />و شكرا"
archived = "2010-03-14"
