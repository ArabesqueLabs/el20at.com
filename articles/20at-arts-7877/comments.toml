subject = "تسـلم إيـدك"
author = "إبراهيم"
posted = "2007-12-26"
text = "... فعلاً ، رجعت إليسـا لتعريفنـا بها كصوت رااائع وشجي ورومانسي جميل، الفكرة دي لسه جاية لي لما شفت كليب نانسي (آه ونص) واللي الناس هاجت أياميها وماجت عليه ، وتخيل غن رجلها مكنتش باينة فيه ؟!! ، فعلاً نانسي وأليسا صوتين حلوين قووي ، وتسلم إيدك بوست جميل<br />و أكيـد الأغنية تحفــــة<br />بالمناسبة توقعات الفلكيين بتقول إن السنة الجاية 2008 ، هتشهد عودة للطرب الأصيل، والمغنى الحقيقي، وتراجع لكليبات العري، والهيافة ،،، على الله تتحقق ...<br />تحياتي يا بيرو"
archived = "2010-03-14"
