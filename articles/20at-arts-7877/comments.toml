[[comments]]
order = 7
subject = "اليسا هتحرر الاقصى"
posted = "2008-01-12"
text = "السلام عليكم.<br />لقد عهدت الى موقع عشرينيات بإلتزامه وتقديميه لمواضيع ذات هدف وايضا عهدت عليه طابعه الديني فإنني الان عندما قرات هذه المقالة ومثلها من المقالاات فقد انحط من نظري كثيرا هذا الموقع فاين ادارة هذا الموقع من مثل هذه المقالات .<br />اوكي انا متفق معاك يامان ان صوت اليسا جامد فحت مع اني عمرى مسمعتلها بس خد بالك من نقطة ان الوقت اللي احنا فيه ده مش وقت اليسا واللي زيها انت عارف يامان الامة دلوقتي ايوا الامة الامة الاسلامية انت ناسي ولا ايه ان ليك امه عريقة جدا وليها اعداء عايزين يدمرو شبابها عشان هو اساسها فجبولنا اللي زي اليسا وغيرها تورينا ان اد ايه جسم المرأة جميل وحلو واحنا لامؤاخذة زي الامعة نروح زي ميقولنا اعدائنا مختومين على قفانا لامؤاخذة د الواقع واي حد عندو شك في كدة يجاوبن يليه اليسا وغيرها خرجت لينا وفي نفس التوقيت وقعت من ايدينا العراق ولبنان وفلسطين ز.<br />كلمة اخيرة يا رجالة احنا الشباب عندنا طاقات جامدة فحت واعدائنا عرفو ازاي يوجههوها باليسا وغيرها ممن عارضي الاجسام في الوطن العربي .وشكرا"
archived = "2010-03-14"
capture_url = ""

