subject = "اختلف بشده و اوافق بشده"
author = "نيفين نيفى نوفا"
posted = "2008-01-07"
text = "اوافقك انت و مصعب بالتاكيد على ان اليسا الان هى اقوى الاصوات على الساحه و ان اواخر الشتا هتبقى ف الاستفتاء اللى هيتعمل ف اخر 2008 اقولا اغانى العام و ان كنت احب ايامى بيك اكتر و لكن اختلف معك فى موضوع شيرين اللى بتغنى للتحدى و الخصام مع انها لا تمللك ما يؤهلها لاننا لو حكمنا بالمنطق ده مش هنقدر نعتبر السيده فيروز سيده الغناء فى كل زمان و مكان لانها لا تمللك من الجمال ما تمتلكه مطربات لا يرقين الا ربع موهبتها<br />و بالمناسبه كلامك عن عايده الايوبى خلانى اجيب اغانيها و اسمعها و فكرنى كمان باغانى الجميله حنان ماضى"
