subject = "مصر"
author = "البتار"
posted = "2008-01-06"
text = "انا اعتدت حقيقة ان اسمع الفتوي من كل من هب ودب<br />ولكني ما وجدت من يسمي ما يحدث من نانسي وهيفاء واليسا فنا<br />حتي انه يبرر لاليسا تذللها الغنائي في الاغنيه لمجرد امكانياتها الجسديه<br />وينكره علي غيرها<br />سبحانك يا الهي<br />وعلي هذا فانا اهيب بالسيد المدون البراء<br />ان يعيد تشغيل عقله وقلبه وضميره فيما كتب<br />عله يشارك حقا في ترقية اذواق وحس الشباب"
