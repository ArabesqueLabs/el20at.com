text = "بسم الله الرحمن الرحيم امابعد احب ان اعرفكم شيئ بسم شباب الدير عمتن الصرحه العرب عرب والفلاح فلاح واحن نحب نقول الحق والحق حق واليزعل يطق اصلن العرب كان ليهم السياده واكبر دليل ان العرب بيخدو بنتت الفلحين ومبدهمش"
