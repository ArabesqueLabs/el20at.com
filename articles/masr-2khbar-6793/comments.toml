subject = "نعمل ايه عرب ولاد متناكه"
author = "احه يا عـــــــــــرب يا متناك"
posted = "2009-03-15"
text = "ايه يا ولاد المتناكه حلاص فوككم بقى من الحوار الفسدان ده<br />لاجى انيكم دكر دكر ونتايها نتايه يا معرصين يا خوالات ياللى ملكمش عازه فى كس ام الدنيا دى<br />انت ياض يا عربى يا معرص فى مطعم جديد فتح فى قنا<br />اسمه خد فى طيزك يا عربى يا متناك<br />وكس ام الديوشه<br />على كس ام العمده<br />على كس ام الكبير فيكم<br />فوككم بقى وعيشوا اليومين دول<br />لابعتلكم نووى فى كساس حريمكم<br />ولو عايزين شتيمه تانى انا معاكم<br />اصل انا كده<br />طلبت انخج فى كسمين ام عروبتكم دى<br />والعرص اللى بيقول الفلاح يشتغل عند العربى ده<br />تعاله يا كس امك وانا اوريك مين يشتغل عند التانى<br />اللى عايز يقابلنى انا مستعد اطلع دين امه بس راجل لراجل<br />اكتب تعليقك هنا وانا هقرا يا ولاد المتناكه"
archived = "2010-03-14"
capture_url = ""

