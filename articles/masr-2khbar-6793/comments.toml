[[comments]]
order = 0
subject = "انا من البلد اللى حصلت فيها المشكله دى"
author = "صالح خليفه"
posted = "2008-01-01"
text = "انا من البلد اللى حصلت فيها المشكله دى<br />بس الى مكتوب فى الخبر مش كله صحيح واغلبه خطأ<br />هو اللى حصل فى البدايه انه احد الطرفين احتجزو رجل وحلقو له شنبو وحواجبه فقط دون اى شىء آخر<br />والعائله دى أخدت بثأرها من رجل قريب للعائله المعتديه فى البدايه بالرغم ان هذا الرجل ليس من العائله وحلقو له شنبو بس , وطبعا دلوقتى المشكله أصبحت مع 3 عائلات.<br />ولم يتم أى صلح حتى الآن بين العائلات الثلاثه<br />ولم تكتب أية لافته فى أى مكان فى البلد<br />والأمر اللى اخطر من ده كله والموضوع ده يعتبر من الأسرار اللى محدش يعرفها كتير وهو ان اللى ورا المشاكل دى كلها ومن مصلحته إن البلد تبقى غير متفقه هو عضو مجلس الشعب حزب وطنى محمد عبدالفتاح عمر , والغريب انه ماشى فى الصلح بين هذه العائلات ده طبعا فى الظاهر أما الباطن غير كده<br />وهو مش عايز البلد تبقى واحده علشان يلعب براحته أيام الأنتخابات لأن لما البلد قبل كده اتفقت وكان أخوه عبداللاه هو اللى عضو , البلد كلها وقفت ضده وسقط فى الأنتخابات. والله على مااقول شهيد."
archived = "2010-03-14"
capture_url = ""

