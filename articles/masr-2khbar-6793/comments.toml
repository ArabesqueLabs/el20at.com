subject = "تعالا نعرف الفرق بين العرب والفلاحين"
author = "فـــــــــــلاح"
posted = "2008-11-30"
text = "السلام عليكم ورحمه الله وبركاته<br />شباب عرب قريه المحروسه<br />من الواضح عليكم انكم متعلمين ومتنورين<br />بس من الواضح انه مفيش حد فيكم حاول انه يصلح او يكتب كلمه بجد صحيحه<br />يا عرب احنا اكبر من كده بكتير احنا قبل ما نبقى عرب وفلاحين احنا مسلمين<br />وربنا مبيعرفش عربى ولا فلاح ولا هـــــــــوراى (اكبر عائلات الصعيد عراقه)<br />بس بيعرف التقى المؤمن المحافظ على دينه مش اللى بيقتل وييتم اطفال<br />(( لا فرق بين عربى ولا اعجمى الا بالتقوى ))<br />فى حجاه لما قريت الموضوع لحظتها<br />ان معظم اللى كاتبين تعليق شباب من قبائل العرب<br />ففى رساله عايز اوجها ليهم<br />من اخ فلاح لم يتعدى ال 19 من السنين<br />يا جماعه ان كان بينكم فاسد فاصلحه من امره<br />اسف للاطاله<br />تحياتى<br />as7aa cool"
