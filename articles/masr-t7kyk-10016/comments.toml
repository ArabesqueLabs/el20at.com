subject = "رمضان جانا - بأى حال عدت يا رمضان"
author = "رمضان"
posted = "2008-09-06"
text = "تمشى فى الحارات الشبة مظلمة - الناس بتنور فى الشقة لمبة واحدة للتوفير والمحلات مولعة لمبات اشبة بالونسات تعطى اضاءة طشاش<br />ولا واحد بيشترى جريدة الا نادر جدا فثمن الجريدة ممكن يشترى بية ارغفة عيش<br />انة افقار الناس وتجويعهم<br />هل شاهدت حادث الدويقة اليوم فى التليفزيون<br />اكتئاب<br />دالبيوت اشبة ببيوت فى الصومال او افغانستان<br />صحيح عشوائية ولكن هل فى القاهرة هذا الكم من البؤس - هل هذة العشش يقيم فيها مصريون كما يقال اصحاب حضارة 7 الاف سنة<br />اشك<br />اين الحكومة عندما نمت العشوائيات - لا توجد حكومة وفى غياب الحكومة نمت العشوائيات وبطريقة العصور الوسطى ونظام الكفور والنجوع<br />عدت يا رمضان<br />عدت يا رمضان<br />والحكومة مبسوطة بتوزيع الشنط الرمضانية بعد ان افقرت الناس ومشغولة بالقبض على الاخوان من فوق موائد الرحمن<br />ومشغولة يقانون المرور الجديد والقديم<br />ومشغولة بمقابلة ابو مازن<br />ابو مازن وابو قردان وابو فصادة اصفار يلعب بها اسرائيل<br />خلينا نجتمع مع ابو مازن"
