order = 0
subject = "الامن خايف من العراقيين فى مصر -فين صد\\\\ام اللى كا"
author = "مش فاهم"
posted = "2008-08-07"
text = "حجة خايبة قوى<br />يظهر ان الراجل الكبير بيموت او بيطالع فى الروح بعد رحلة جنوب افريقيا الخايبة اللى بيحاول يمثل انة شباب وانة بيسافر اخر الدنيا يبحث عن اى دور سياسى فاشل<br />وطبعا اذا اذيع خبر موتة فى تجمع فية مليون شخص وانتشرت الزغاريد والرقص بعد خبر موتة هتبقى مشكلة امام العالم<br />طبعا حكاية الشيعة دى ملعوب بايخ من بتوع الامن<br />فالشيعة يعرفون جيدا ان الحسين مش مدفون فى مصر<br />ثم ان اغلب العراقيين فى مصر من اهل السنة ولا خوف منىهم سواء شيعة او سنة لانهم منضبطون واى حركة هتعرضهم للترحيل"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123329/http://masr.20at.com:80/newArticle.php?sid=17139"
