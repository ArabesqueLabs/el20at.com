subject = "عاطلون عن العمل - بروحوا يوزعوا ارغفة خبز"
author = "عارف سعود"
posted = "2008-03-13"
text = "العاطلين عن العمل زى البلطجية وقوات الامن المركزى ومخبرين امن الدولة لية ما يشاركوش فى توزيع ارغفة الخبز على الناس اللى بتقف ساعات فى الطوابير<br />مش دى طاقات فى المجتمع عاطلة وبتاخد مرتبات<br />والا هنسلم القط مفتاح الكرار"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003221/http://masr.20at.com:80/newArticle.php?sid=14667"

[[comments]]
order = 1
subject = "هما دول خريجي كلية اعلام ولا لأ"
author = "اكتب اسمك هنا"
posted = "2008-03-13"
text = "الصحفي الحقيقي لازم يكون خريح اعلام وخريج الاعلام عمره ما يعمل الحجات دي ابدا<br />دول صحافيين صيع ومرتزقه وعالة على الصحافة"
archived = "2008-03-16"
