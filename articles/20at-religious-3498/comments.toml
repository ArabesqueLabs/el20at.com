subject = "رسالة المحبة أظهرت لها أنوار اليقين"
author = "الحسين اعميمي"
posted = "2007-03-28"
text = "''أي أنوار في الإسلام و أي إشراقات تظهر لهذا الإنسان الحائر في لجة هذه الحياة يبحث عن الحقيقة''،هذا ما وقع لأختنا اليابانية \"هيروكو ميناساكى\".. التي كانت تحمل في قلبها كل معاني الحب و الشوق و الحنين، بعدما نمت هذه المعاني الجليلة في بلدها اليابان، أو بالأحرى في منظومتها الجماعية البوذية التي عاشت معهم، هذا المذهب الذي يعتمد على إخلاء النفس من كل نواقص النفس البشرية من حسد و كراهية ، حتى تصبح كاملة لتحليتها بعدئد بمعاني المحبة و الشوق و الحنين....حقيقة موضوع رائع ، أحيي أخي ''طه محمد'' على تناوله لهذا الموضوع....."
archived = "2010-03-14"
