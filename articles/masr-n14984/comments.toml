subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-04-27"
text = "اولا انا بحب الاستاذ الكبير ( على )<br />وأنا معجب بة جدا و بتعلم منة كلام كتير جدا<br />و اسلوبة سهل وجميل وسريع الو صو ل الى قلب الشعب والقار ئ العادى<br />و انا حبيت اعرض على حضر تك موضوع على الله يعجبة وياريت يعقب علية<br />لكى استفاد من خبر تة الكبير ة<br />شكرا وتعالوا نشوف أكل الحمير<br />( ر ا ح فيـــــــــــــــــــــــــــــــــــــــــن بـس ا لــضـمـيــــــــــــــــــــــــر )<br />صـا حـبى شـا فـنـى فى و ســط ا لــز حمـــــــــــــة<br />قـــا لــى مــــــــــا لــك<br />قــلـت نـفـسـى فى حـتـتـة لحمـــــــة<br />قـا ل يــا عــم شـا يـفـك لـية مـحـتـا ر<br />قـو لـت ز هـقـت كــــلا م فـى ا لا سعـــــــــا ر<br />أ يـة بـس ا للى جـــر ى لـلـد نـيــــــــــــــا<br />قـا لـى صـا حبـــى د ى قـصــة تـا نيـــــــــة<br />ا لحميـــــــــــر ر ا حـــو ا و جـــا بــو هــا<br />و عينــى عينـك بـيـد بحـــــــــــــــــو هـا<br />قـا لى صـا حبى أ ية ر أ يك فى أ كلت حميـــــر<br />قـو لــت ليــة ر ا ح بــس ا لـــضميـــــــــــر<br />قا لى يـا عـم بــــلا ضـمـيـر بـــلا د يـا و لــــــــــو<br />دة ا لـضـمـيــــر ا لـكـــل شــــــا يــلــو<br />قـو لـت طيــب أ ز ا ى ا لحميـــــــــر بـتـتــا كـل<br />قـا لـى مـفـهـا ش أ ى مشــــا كــل<br />طـيـب أ يـــة طــعـم ا لحـمــيـــــــــــــــر<br />قا لى صا حبـى<br />كـفتـة و كـبـا ب و كـمـــا ن تـحـمـيــــــر<br />و بتتبــــا ع على عينــك يــا تـــــــــا جـــر<br />مــا هــو أ صــل بيعــــهـا ر ا جــــل فـــا جـــر<br />و عــر فـت نــا س كـتـيـــــــــــر<br />من الغـو لـب أ د مـنـت أ كــل ا لحميـــــــــــر<br />مــا هــى بـقــت أ كــل ا لـفـقـــيــر<br />و ا لـنبـى مش حــــر ا م د بــــــح ا لــحـميـــــــر<br />ر ا ح فيـــــــــــــــــــــن بس ا لـضميـــــــــــــــر<br />و لا عشا ن الحميـــــــــــــــــــــر<br />مـلـهـا ش كـبـــــــــــــــــــير<br />( أ شكـــــــر كـم )<br />عادل مندور البو رسعيدى<br />( ا لقبطــــــــــــــــــــــا ن )"
