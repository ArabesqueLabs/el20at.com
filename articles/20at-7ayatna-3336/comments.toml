subject = "جميل"
author = "هبه"
posted = "2007-02-28"
text = "المقال جميل جدا وأسلوبك في الكتابة رائع و واضح انك مثقفة ونفسي نكون اصحاب ممكن ،وأحب أقولك عن نفسي انى مش عارفة صفتى الاولى ممكن تكون ايه واحده من صفاتى بس عموماً أنا بحب القراءة عن أنواع الشخصيات والتنمية البشرية وبتمنى مع كل يوم جديد انى اصلح في شخصيتى مساوئ الامس ,ممكن تكون هى دى صفتى الاولى متطلعة ."
