subject = "بلاش السلفيين والنبي"
text = "للاخوة السلفيين انتو لما بتتكلمو والله بعرف احنا ليه مفشوخين انا مسلم زيكو علي فكرة بس تعالي لواحد زي بتاع تعليق الحجاج......ايه الهلس والكلام اللي ملوش اي معني ده؟؟؟؟ ده الرسول(ص) قال ان اعلي انواع الجهاد كلمة حق عند سلطان جائر تيجي انت تقوللي فتنة؟ هيحصل ايه اكتر من اللي حاصل يعني؟ بالله عليكو انسو فتاوي شيوخ السلاطين من امثال ابن باز اللي كان شايف العائلة المالكة نابة الحجاز وبيقول الدولة السعودية دولة مباركة.....الله يسامحو هو وشيو خ السلاطين اللي زيو في اللي عملوه والله, والسلام عليكم"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 24
subject = "ان الحكم الا لله والكمال لله وحده"
author = "مش ضروري"
text = "الاخوة الثوريين اللي عايزين يثوروا على حسني مبارك احب اقولهم ان الكمال لله وحده ومفيش حاكم حيجعب ابدا<br />يعني مثلا ايام النبي فيه ناس ما كنش عاجبهم حكم النبي ودول نزل فيهم قران<br />وايام ابو بكر فيه ناس ما كنش عاجبهم حكم ابو بكر<br />وايام عمر فيه ناس ما كنش عاجبهم حكم عمر<br />وايام عثمان فيه ناس ما كنش عاجبهم حكم عثمان<br />وايام علي<br />وايام الامويين<br />لان الكمال لله وحده سبحانه وتعالى<br />وايام الملك فاروق عبدالناصر وضباطه الاحرار خرجوا عليه<br />وبعد كده لما جم الضباط الاحرار الاخوان عايزين يخرجوا عليهم<br />وتأكد تماما لما يجي الاخوان يحكموا حتلاقوا اللي عايزين يخرجوا على الاخوان<br />فالكمال لله وحده سبحانه وتعالى"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 25
subject = "رد على افضل الجهاد كلمة حق في وجه سلطان جائر"
text = "الاخ الكريم اللي بيستشهد بهذا الحديث اولا لازم تعرف معنى الحديث ايه والرسول قاله امتى ولمين<br />ولازم الفقهاء الكبار هما اللي يشرحولك معنى الحديث مثل شيخ الازهر او رئيس جامعة الازهر يعني لازم عالم كبير يشرحلك معنى الحديث وامتى تستخدمه<br />والا حتبقى فوضى"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 26
subject = "الله يرحمك يا شيخ شعراوي وينور قبرك زي ما نورت طريقنا"
author = "مش ضروري"
text = "كلمة الشيخ الشعراوي لحسني مبارك<br />وفيها تفسير معنى افضل الجهاد كلمة حق في وجه سلطان جائر<br />هذا المقطع كان لفضيلة الامام الشيخ محمد متولي الشعراوي قبل وفاته بفترة بسيطة كان المعروف عن الشيخ انه لا يخاف سوا الله وجريء ويقول الحق امام الظالم ولو كان فرعون لا يهاب ظلمه وجبروته وانه الوزير الوحيد الذى ترك الوزارة وترك السلطة وكل شيء للتفرغ الى الدعوة وحتى يقع فى دائرتهم المعروفه .<br />فكان هذا الحديث فى مؤتمر القي فيها الرئيس والقي الشيخ كلمته المشهورة والتى ستظل فى مسمع العالم الاسلامي كله والتى لن ينساها مسلم قد سمعها وهى :<br />وانى يا سيادة الرئيس اقف على عتبه دنيايا لأستقبل اجل الله فلن اختم حياتي بنفاق ولن ابرز عنتريتي باكتراء ولكني اقول كلمة موجزة للامة كلها حكومتا وحزبا ومعارضة ورجالا وشعب .. اسف ان اقول سلبي .. اريد منهم ان يعلموا ان الملك كله بيدي الله يأتيه من يشاء فلا تأمر لأخذه ولا كيد للوصول إليه فأن الحق سبحانه وتعالي حينما حكي حوار ابراهيم للنمروز ماذا قال له .. الذى حجا ابراهيم فى ربه وهو كافر قال ان اتاه الله الملك فالملك حين ينزله الله قال يأتي الملك لمن يشاء فلا تأمر على الله لملك ولا كيد على الله لحكم لانه لا يحكم احدا فى ملك الله إلا بمراد الله .. فإن كان عادلن فقد نفع بعدله وان كان ظالما بشع الظلم وقبحه فى نفوس كل الناس فيكرهون كل ظالما ولو لم يكن حاكما ولذلك اقول للقوم جميعاً والحمد لله قد تأكد لنا صدق الله فى كلامه بما جاء من الاحداث فكيف كنا نفسر قول الله ويمكرونا ويمكروا الله فكيف كنا نفسروا انهم يكديون كيدا ونكيدوا كيدا الله يريد ان يثبت - قيوميته - على قومه فانا انصح كل من يجول براسه ان يكون حاكما انصحه بان لا تطلبه بل يجب ان تطلب له فان رسول الله قال من طلب الي شيء اعين عليه ومن طلب شيء وكل إليه .. يا سيادة الرئيس اخر ما احب ان اقوله لك ولعل هذا يكون اخر لقائي انا بك .......... ( ووضع الشيخ يده على كتفي الرئيس وقال) ... اذا كنت قدرنا فليوفقك الله فإذا كنا قدرك فليعنك الله على ان تتحمل .<br />وكان هذا فعلاً اخر لقاء للشيخ فرحمه الله<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />منقول من منتدى سوالف"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 27
subject = "الفقر وتردى الاحوال"
author = "فرقع لوز"
text = "انا شايف انكم كلكم بتخرفوا<br />احنا حالنا اية النهاردة - احنا افضل والا موزمبيق - حالنا اية فى وسط الدول اللى حوالينا<br />طبعا كلكم شايفين<br />من اول طوابير الخبز لغاية ازمة مياة الشرب لغاية البطالة والصياعة<br />واصبحنا اكبر دولة فيها نسبة امية فى وسط العرب<br />واصبحنا اصحاب سمعة هباب فى التعذيب وانتهاك حقوق البشر<br />وعايزين حكومة تصلح الاحوال ويكون عندها شوية ضمير وشوية دين<br />ممكن تكون حكومة حزب الوفد<br />وممكن تكون حكومة الاخوان كلة ماشى<br />انما الحزب اللى باع البنوك والمصانع وباع مصر فدة حزب بتاع شارون<br />خللوا الدين بعيد<br />اتكلموا بواقعية"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 28
subject = "الشعراوى المفترى علية"
author = "مسلم"
text = "الاخ اللى بيتكلم عن الشعراوى كانة نبى مرسل من عند اللة لا ياتية الباطل من بين يدية<br />هو كلام الشعراوى مدكور فى البخارى والا هو عالم دين فلاح يجتهد فى التفسير وقد يعجبك ولا يعجبنى<br />احنا معندناس كهنوت ولا رجل دين مقدس<br />السعراوى يقول زى ماهو عايز هو حر<br />وانا سمعتة فى احد خطبة يقول اللهم ان كان على حق فاعنة وان كان على باطل فابدة"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 29
subject = "لا الشيخ الشعراوي نبي ولا الاخوان انبياء"
author = "مش ضروري"
text = "الى الاخ مسلم<br />الشيخ الشعراوي والحسن البصري<br />فيه تعليق فوق عن الحسن البصري ارجو ان تكون قراته وهو يعضد كلام الشيخ الشعراوي<br />والشيخ الشعراوي قال في وجه حسني مبارك هذه المقوله<br />فإن كان عادل، فقد نفع بعدله وان كان ظالما بشع الظلم وقبحه فى نفوس كل الناس فيكرهون كل ظالما ولو لم يكن حاكما<br />وبعدين الراجل بينصح في الله وبيقول غلط الواحد يسعى لكي يحكم<br />وعندنا درس في التاريخ سيدنا الحسين رغم انه من اهل البيت ولكنه فشلت محاولته في استرجاع الحكم<br />وسيدنا عمر ابن العزيز لم يسعى للحكم اطلاقا ومع ذؤلك جاءه الحكم لغاية عنده واصبح خليفة<br />دا الكلام اللي احنا بنقوله<br />وعلى الاخوان المسلمين ان يدعو الى سبيل الله بالحكمة والموعظة الحسنه فقط لان بسببهم البلد اتملت معتقلات وسجون وزوار الفجر والحاكم قاعد ومش ماشي<br />زي ما حصل في سوريا الاخوان المسلمين عملوا اللي ما يتعملش ومفيش فايدة فضل حافظ الاسد وجاب ابنه يحكم مكانه لان الحكم بيد الله يؤتيه من يشاء من عباده<br />يبقى الاخوان المسلمين تاعبين نفسهم ليه بأه وبيضيعوا وقت كبير في المعتقلات<br />يعني مثلا المرشد اتسجن عشرين سنه ممكن اعرف افاد المسلمين بأيه<br />لكن الشعراوي فسر القران في عشرين سنه وافاد العالم الاسلامي كله في مشارق الارض ومغاربها"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 30
subject = "الفكر الشيعى وحسن البصرى"
author = "واحد"
text = "الاخ اللى فوق يظهر انة متأثر بالفكر السيعى وكل مرة يطلع علينا بالحسن البصرى<br />الحسين مات وهو بيقاوم اغتصاب يزيد للسلطة والحكم<br />يعنى خرج على الحاكم لانة غير سرعى وجلس على الحكم بالعافية<br />نتبع الحسين والا متصوف اسمة البصرى<br />انت بتقبض من الحزب الوطنى بيعطوك حبة الفياجرا اللى بيوزعوها على الهتيفة<br />احنا عايزين سلطة حقيقية منتخبة بدون تزوير<br />ان نجح عمدة كفر البلاموط فى الانتخابات يبقى الريس"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

