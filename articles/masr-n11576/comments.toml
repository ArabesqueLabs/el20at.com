[[comments]]
order = 11
subject = "تساؤلات..وتحيات..واحترام شديد"
author = "محمد القط"
text = "الفاضل عبدالله الطحاوي...<br />تحياتي ليك ..<br />أحب أوضح إن هناك بعض الاشكاليات يعيشها المجتمع المصري حالياً وتغيرات مر بها خلال الأربعين سنة الماضية...<br />منها على سبيل المثال لا الحصر تأثر المجتمعات العربية والاسلامية في عمومها بالمد الوهابي السلفي الأقرب للبداوة القادم من الخليج العربي نتيجة للهجرات المتتابعة للمصريين للجزيرة العربية طلباً للعيش الكريم...<br />وبالطبع منهم إخوان كثر تأثروا بهذا الفكر بصورة أو بأخرى..<br />وبالرغم من انتقادك الواضح والمبرر لبعض بنود المسودة الأولية للبرنامج حزب الاخوان المثير للجدل على أي الاحوال..<br />وبرغم من نظرتك لهذه المسودة ونقدك لها بإعتبارها تقهقر للخلف وردة عن استنارة فكرية تمتع بها الاخوان في فترة من الفترات...<br />إلا أن أحد المعلقين له رأي آخر ..ورجاء مراجعة تعليقات الفاضل \"مش ضروري\" المليئة بتوابل التكفير ..تفوح منها رائحة بارود الاستقصاء والتخلف البدوي القادم من عند آل سعود..<br />المهم..بالطبع هناك من وثق الاخوان فيهم ولم يكونوا اهلاً لهذه الثقة \"شئ طبيعي\"...أو لم تسعفهم مؤهلاتهم وخبراتهم في مجاراة الواقع السياسي وتقلباته ومتطلباته..ممن يتولون ألان بعض الملفات السياسية والإعلامية داخل الجماعة....<br />أمر آخر بالغ الأهمية...وهو مطالبة بعض النخب للإخوان بمطالب غير واقعية ...فالواقع السياسي المتأزم في مصر ..لن يصلحه الإخوان وحدهم ومن يطلب هذا فهو واهم أو على أقل الأوصاف ظالم...وأتسائل هنا حول إشكالية رئيس الدولة مما أثارت تساؤلات وجدل عقيم في دولة قبع على انفاس السلطة فيها فرد واحد وأسرته وحزبه الملاكي ما يقرب من الثلاثين عام...<br />أتعجب ممن يملكون ترف مطالبة الاخوان بالسماح بتولي قبطي رئاسة الدولة \"وهذا لا أمانعه على المستوى الشخصي\"...<br />في حين لما طرح اسم بديل لرئيس الجمهورية ..تمت إضافة \"جمال\" على الاسم القديم...يطالب البعض برئيس قبطي...وأمريكا نفسها دستورها يحصر انتخاب رئيس الجمهورية في طائفة مسيحية إنجيلية واحدة...كذلك فرنسا وعلى دربها بريطانيا...<br />يبقى أمر أخير..وهو ان هذه المسودة ليست برنامج الحزب ..هي صورة أولية..وهناك امل في \"ترميم\" برنامج الحزب كما قلت ...<br />أمر آخر مهم ...<br />في ظني الشخصي ..ان هذا البرنامج ليس معبر عما يمارسه الاخوان من \"حياة\" في واقعهم الاجتماعي والسياسي..وليس معبر عن التيار الأساسي داخل الاخوان أو سلوكيات أفراده وأفكارهم ...<br />وأظن أن هذا البرنامج استأثر بوضعه مجموعة ذات توجه فكري واحد ..دون الرجوع إلى عموم الاخوان..لعله يكون التضيق الامني سبباً لهذا..<br />ولكنه أمر قد يندم عليه الإخوان..فهذه المسودة أثارت عليهم ناهشي الأعراض ومشككي الذمم..كاشفي النوايا ..المتربصين بالحالة الاسلامية في عمومها...على الرغم من ان الامر بسيط ولا يتعدى كونه مسودة برنامج لم يوفق المكلفين بإعداده في صياغته..إلا ان تضخيم الأمر بهذه الصورة فيه نوع من التصيد وعدم الشفافية...<br />لك مني كل التحية والود...ورمضان كريم"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 12
subject = "بتنفخ فى قربة مخرومة يا عبدالله لان معظم القراء عاجبهم البرنامكج اصلا ويمكن كمان يكونوا شايفينه متهاون مع اليهود والنصارى والمجوس"
author = "محمد جنيد"
text = "بصوا الاخوان احسن ناس عملوا برامج معملوش نجحوا فشلوا .. برضوا احسن ناس .. انت بتنفخ فى قربة مخرومة يا عبدالله .. لان معظم اللى بيقرا المقال بشغف حيكونوا اصلا موافقين على البرنامج ده .. واذا كان فيه حد عنده رؤيه تانية فمكنش مستنمى البرنامج عشان يعرف ان الاخوان مع نفسهم .. محدش سل نفسه ايه مسئولية اكبر جماعة واخده مكانة المعارض الرئيسى لمده تزيد عن 30 سنه .. ايه مسئوليتهم عن اللى البلد وصلتله خصوصا ان احنا مش العراق والحكومة مش بتدوب المعارضة فى محاليل ورجال عمال الاخوان ماشاء الله كتار ومرزقين .. خصوصا لما يطلعلى نائب المرشد كل كام برنامج ويضربله رقم ويقول احنا 800 الفولا مليون ونص .. طب فيه فى الدنيا مليون ونص يصبروزا على ده الا لو كانوا مستفيدين او مش فارق معاهم"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 13
subject = "حقوق النساء والاقباط"
author = "عبد الصبور"
text = "انا عايز اعرف اية حقوق النساء فى مصر ؟<br />حقوق المرأة زى المتفلسفات بيقولوا<br />الرجل المصرى بيشتغل ويكد طوال الشهر ويقبض المرتب ويسلمة لمراتة على داير المليم وهى اللى بتعطية المصروف وهى اللى بتأكلة على مزاجها وهى المسئولة عن البيت<br />اية الحقوق اللى تنقصها ؟ مش عارف<br />والاقباط ما هم مواطنين مميزين بنشترى الدواء من الصيدلى المسيحى وهم 65% من الصيادلة وبنروح نتعالج عند دكاترة اقباط وبنشترى ونتعامل معاهم كل يوم فى العمل والسوق والمدارس وبنتخانق احيانا زى اى مصريين بيتخانقوا واحيانا بنت بتحب واحد مسلم -نكبر العملية ونقول اختطاف وكلام فارغ وكل دة حالات فردية<br />ولما الاخوان هيحكموا هيحصل اية ولا حاجة<br />طيب ماهم بيحكموا فعلا هو مين المأمور ومين القاضى ومين النقيب ومين الضابط<br />كلهم مسلمين<br />كبروا مخكم<br />الاخوان قادمون<br />وبمساعدة امريكا وذلك لارساء الاستقرار فى مصر"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

