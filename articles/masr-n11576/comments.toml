[[comments]]
order = 5
subject = "الله يسامحكم في رمضان"
author = "إخواني للأبد.. مكسوف جدا جدا"
text = "يا عم عبد الله<br />يا أيها الكتيب الكبير<br />ممكن تكثر من كتاباتك شويتين<br />راقية وممتعة وإلى الهدف<br />وأهم ما فيها أنك بدأت لا تخشى العوام والدهماء وتقول ما تعتقده بلا وجل أتمنى من كل عشاق وجماهير ومتابعي ومحبي الإخوان ان يناقشوا المقال وغيره من وجهات النظر لان الموضوع بقى يكسف حبتين<br />يا ريتهم لا عملوا برنامج ولا حزب وفضل الكلام في العموميات وخلاص<br />فيه لقطة حلوة قوي إن في 52 أسند الامر للقانونيين فطلع الدستور المشرف أما في 2007 فأسند للكفاءات ثم دلقه المشايخ وبتوع لجنة السياسات الدينية في أقرب مقلب حسبي الله ونعم الوكيل فيمن يقتلون الأمل الأخير للشعوب المقهورة باغتيالهم الإخوان من الداخل"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

