[[comments]]
order = 7
subject = "الفكر البديل/ من حسن البنا الى الحسن البصري"
author = "ابومحسن"
text = "طبعا كلنا نقر ان حسن البنا داعية عظيم ولكن ننتقل الى من هو اعظم منه واتقى منه بشهادة الرسول صلى الله عليهوسلم الذي قال خير القرون قرني ثم الذين يلونهم وننقل لكم من كلام التابعي الجليل الحسن البصري<br />من كتاب التربية الاسلامية للصف الاول الثانوي المقرر على طلبة جمهورية مصر العربية ص 73<br />(وكان يخشى على المسلمين من الفتنة والفرقة (اي الحسن البصري) وتمزيق اواصر المحبة بينهم حتى انه عندما قام ابن الاشعث بثورة على الحجاج الثقفي فزع العلماء الى الحسن وقالوا له: ماذا تفعل وانت ترى الحجاج يسفك دماء المسلمين دون رحمة او شفقة ويقتل اعداءه دون قضاء او محاكمة وينفق ثروات المسلمين فيما يغضب الله؟<br />قال لهم لا تقاتلوه الا اذا اعلن الكفر بالله وانكر اصلا من اصول الدين<br />وان تكن افعاله الان عقوبة من الله فما انتم برادي عقوبة الله باسيافكم وان يكن بلاء فاصبروا حتى يحكم الله وهو خير الحاكمين<br />وكان ينهي عن سفك الدماء والخروج على الحجاج حتى لا تحدث فتنة اكبر تراق فيها دماء المسلمين وكان يرى السلام بين ابناء الامة اغلى نعمة من الله عليهم وعلى هذا النهج سار علماء عصره في الدعوة الى التسامح ولم شمل الامة وتوثيق عرى المحبة بين المسلمين<br />وهذا ما اتمناه لمصر"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

