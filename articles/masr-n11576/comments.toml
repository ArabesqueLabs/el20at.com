text = "الله يسلمحك يا عم....<br />ولولاش إحنا في رمضان....<br />وعلى العموم ...نشهد أن لا إله إلا الله...ونشهد ان محمدا رسول الله....<br />ورجاء من إدارة الموقع...هذه المساحة لتعليقات القراء ..وأظن ما أضافه المدعو \"مش ضروري\"..لا يمت للتعليق بصلة...فرجاء الانتباه لهذا الأمر."
