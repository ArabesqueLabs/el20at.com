subject = "مالكوش دعوة"
author = "هي حبكت"
text = "يعني سيبتو الدنيا كلها ومسكتوا في الإخوان المسلمين وبرنامجهم ، عم الحلو إللي كاتب المقال إللي عاوز واحد ... ، ما يخلي ...بداله ويعد ...، وعم الامور إللي جايبلي فتاوى ابن باز ، والألباني ، أما الراجل بيقولك كنت مشغول ومااطلعتش على كتبهم ( إللي هي فكرهم ) يبقى بيفتي على أي أساس ، وهو فاكر إن دعوة الإخوان المسلمين دي للكفار وبس ، يعني هروح لواحد مسلم أقوله ، وحد الله وماتزورش قبر أبوك ، يا جماعة بالعقل ارجعوا واقرأوا فكر الناس دي كويس وبعدين ابقوا تعالوا اتكلموا . ربنا يهديكوا ياللي في بالي"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

