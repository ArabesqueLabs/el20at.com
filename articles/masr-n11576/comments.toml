text = "العنوان جزء من تعليقك<br />وهذا كلام اقباط المهجر مش كلام مسلمين<br />ولازم تعرف ان النبي محمد صلى الله عليه وسلم جاء من المكان الؤي انت تقول عليه تخلف بدوي<br />لو سمحت والله اقرأ كويس قبل ان تكتب وما ترددش كلام من غير ما تعرف معناه"
