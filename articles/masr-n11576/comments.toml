subject = "مين قال ان الحسن البصري شيعي وصوفي ورينا المصدر"
text = "فين المصدر اللي بيقول ان الحسن البصري شيعي<br />,ومين قال انه صوفي<br />ممكن نشوفه<br />الحسن البصري عند اهل السنه اسمه سيد التابعين"
