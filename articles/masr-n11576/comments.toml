subject = "مش ضروري"
author = "الى الاستاذ محمد القط"
text = "الخلل الإعتقادي عند فرقة الإخوان المسلمين..الأصول والمظاهر والعلامات والنتائج والسمات<br />بسم الله الرحمن الرحيم<br />الخلل الإعتقادي عند فرقة الإخوان المسلمين..الأصول والمظاهر والعلامات والنتائج والسمات<br />الحمد لله وحده و الصلاة و السلام على من لا نبي بعده . أما بعد ،،،<br />فهذه لمحة مختصرة عن الخلل الإعتقادي عند جماعة الإخوان المسلمين ، دعت إليها الحاجة ، و حفّز على انتشارها رواج فكر الجماعة و انتشار انشطتها في العالم ، و قد كتبناها نصحا للجماعة و نصحا منها ، فبقدر ما نحب الهداية لأفراد هذه الجماعة بقدر ما نخاف من انتشار وبائها في أوساط العامة. و الله المسئول أن يكتب فيها النفع لكاتبها و قرّائها .إنه جواد كريم.<br />أصول الخلل الإعتقادي عند الفرقة<br />الأصل الأول : الحساسية المفرطة من العقيدة و ما يرتبط بها من كتب و حلق علم . و منشأ هذه الحساسية إرتباط هذه العقيدة في أذهان الجماعة بمفهوم الفرقة بين المسلمين ، الذي هو أشد ما يكون مصادمة لمنهج جماعة الإخوان . و هذه الحساسية يَستمدّون تبريرها شرعا من ذم القرآن و السنة للفرقة بين المسلمين ، ثم الربط التاريخي و الواقعي بين ما ذمه القرآن و السنة و بين مفهوم العقيدة تدريسا و تأسيسا . و هذا التبرير منتقض من جهتين : الجهة الأولى : أنّ الذم الشرعي لا يلحق المستمسكين بالحق و إنْ تفرق الناس عنهم إلى أودية الضلال ، و إنما يتوجه إلى المفارقين للحق و أهله ، فبهم يُناط وصف الفرقة و عليهم يُسجّل وزرها ، و برهان ذلك قول الحق سبحانه ( يا أيها الذين آمنوا عليكم أنفسكم لا يضركم من ضل إذا اهتديتم ) المائدة 105 . الجهة الثانية: أنّ الإفتراق تاريخيا و واقعيا ليس بسبب تدريس العقيدة الصحيحة من حيث هي ، و إنما بسبب انحياز أهل الباطل عن أهل الحق بعقائدهم و مناهجم و انصرافهم بداعي الهوى عن جماعة المسلمين الأولى و بالتالي فالمحل الصحيح للحساسية هو الحساسية من العقائد الباطلة لتسببها في تفريق المسلمين و ليس العقيدة من حيث هي . و منطق الإخوان المسلمين لو تحاكم إليهم شخصان ، أحدهما يدّعي أنّ الآخر قد سرق ماله ، فإنهم يحكمون بتناسي الحق و التنازل عنه و الرضى بالسرقة و التحفيز عليها ، بحجة أنّ مطالبة صاحب المال بماله تؤدي إلى الفرقة ، و الفرقة مذمومة إذن فلنترك البحث عن الحق و تقريره و الدفاع عنه جمعاَ للكلمة، و هذا المنطق يفتح باباَ للضلال و يهدم أساس الحق . و وجه اللزوم أنّ الأمر كذلك في مسألة العقيدة ، نحن معاشر أهل السنة أصحاب حق ، اعتدى على عقيدتنا أهل الضلال فقاومناهم بالطرق الشرعية و رضينا بحكم الله بيننا و بينهم . بيد أنّ الإخوان يُطالبوننا بتناسي الحق و إهماله دفعاَ للفرقة ، و يعتقدون أن مطالبتنا بالحق هي سبب الإفتراق و إنما سببه اعتداء المعتدين من أهل البدع ، و لم يتوقفوا عند هذا الحد و لم يرضوا بهذا القدر حتى أشاعوا بين أتباعهم أنّ تقرير الحق سبب الفرقة ، و علاج الفرقة الإعراض عن الحق، ثم ما زالوا يُدندنون بهذا المنطق الغريب حتى ألِفه الأتباع و أصبحوا في حساسية مفرطة من تقرير الحق بأي شكل من الأشكال فأصبحت العقيدة الصحيحة في ظل هذا الجو عقدة الأخوان المسلمين .<br />الأصل الثاني : قطع الصلة بعلماء السنة. و هذا الأصل من فروع الأصل السابق ، و لهم فيه مظاهر و طرق . أما مظاهره : عدم العناية بحِلَقِ علماء السنة و الجلوس عندهم لطلب العلم . و منها : عدم الرجوع إلى فتاويهم في النوازل و الملمات . و منها : عدم الإعتداد بنصائح علماء السنة المتوالية . و منها : عدم الإعتناء بمؤلفات علماء السنة تدريساَ و تداولاَ . أما الطرق التي يُقررون بها هذا الأصل : افتراءهم الكذب على علماء السنة أنهم جهلة بالواقع . و منها : رمي علماء السنة بالمداهنة و العمالة للحكام . و منها : رمي علماء السنة بالشدة مع المخالفين و التنطع في الأحكام الشرعية ، و تفسير بعضهم تمسك أهل العلم بالسنة في هدي المصطفى عليه الصلاة و السلام بالتزمت و عدم مواكبة العصر . و منها : تصيد الزلات و العثرات على أفراد العلماء و نشرها في الناس تنفيرا لهم . و هم بذلك كله مرتكبون لعدد من الكبائر وافر ، ابتداءً بالكذب و انتهاءّ بالإفتراء نسأل الله العافية ، أما نسبة الإلتزام بالهدي النبوي إلى التخلف و الرجعية فردة عن الإسلام .<br />الأصل الثالث : فتح نوافذ الضلال بتسييد المبتدعة و تنصيبهم قادة و منظرين. و هذا الأصل ظاهر بين علماء الإخوان ، فهم خليط من الصوفية و الأشاعرة، و معظم المفكرين منهم متأثرون بالنزعة العقلانية في الموقف من نصوص الوحي ، و لكثير منهم نصيب من نزعة عصرنة الدين و تطويره حتى يتوافق مع متطلبات العصر بلا قيود و ضوابط شرعية . و لذا فلا عجب أنْ ترى الضلالات متراكمة في أذهان أفراد هذه الجماعة، قد أخذ الواحد منهم من كل ضلالة سهماَ . نسأل الله العافية . و من فروع هذ الأصل دفاعهم المستميت عن رؤوس البدع بحجج شتى لا تقوم على أساس من العلم ، كاعتبار الضلالات من جنس الأخطاء الإجتهادية ، و خداعهم الناس بذكر فضائل المبتدعة . و هلم جرا . و اتسع الخرق عليهم حتى أصبحوا يدافعون عن المبتدعة باطلاق و إن لم يكونوا من جماعتهم ، طرداَ لقواعدهم و سداَ للطرق المؤدية إلى انتقاد رموزهم . فما أخسر تجارتهم و ما أضل سعيهم .<br />مظاهر الخلل الإعتقادي عند الفرقة<br />و نكتفي بمظهرين : الأول : المقالات الشركية و الضلالية التي تفوّه بها رموز الجماعة و حفظتها مؤلفاتهم فهي تسري في أتباعهم سريان السم في الدم ، و هذا المظهر قد كتبت له الولادة على يد مؤسس الجماعة ( حسن البنا ) الذي اشتهر بالتصوف و التفويض . الثاني : تداول أعضاء هذه الجماعة لأصول فاسدة و قواعد كاسدة من شأنها عدم الدين ، من ذلك قولهم الذي أصبح رمزاَ لهم ( نتعاون فيما اتفقنا عليه و يَعذر بعضنا بعضا فيما اختلفنا فيه ) فهذا الاعذار باطلاق يكون السبب في اسقاط فريضة انكار المنكر، و إقصاء لواجب الحفاظ على الدين، و قعود عن نصرة الحق، و إيغال في إظهار الباطل و ترويجه، و تعمد لغش الناس في اديانهم . فانظر بضاعة القوم .<br />العلامات على وجود هذا الخلل الإعتقادي<br />فمن ذلك استحسان المبتدعة صغاراً و كباراً لمسلك هذه الجمعية ، و احتفاء أهل التصوف خاصة بدعوتهم و رضاهم عنها . و من ذلك نشوء الطوائف الغالية في التكفير ، الرائدة في مجال الفتن في أحضان هذه الجماعة لإنعدام الرادع من العلم المتين و الحق المبين .<br />و من ذلك تَلَوُّن الجماعة في كل بلد باللون المناسب لأهل البلد عقائدياً و سياسياً و اجتماعياً ، فهم في بلاد المسلمين من ذوي الغيرة على محارم الله ( بالجملة) و في بلاد الكفار يدعون إلى التحلل من ثوابت الولاء و البراء و ما ذلك إلا لإنتفاء الهيمنة العقائدية على مناهج القوم .<br />نتائج هذا الخلل الإعتقادي<br />و مع كثرة نتائج السوء لهذا المنهج فإننا نكتفي بالتالي : الأولى : عدم استقرار أعضاء هذه الجماعة على معتقد معين ، فلكل فرد معتقد يخصه بل الفرد الواحد تجد عنده خليط المعتقدات و ما ذاك إلا لتضارب أقوال أئمتهم في جوانب الإعتقاد و فقد الأساس العلمي في التمييز بين الحق و الباطل . الثانية : انفتاح هذه الجماعة على كل مستجد من الدعوات الباطلة ابتداءً بتقارب السنة و الشيعة و انتهاءً بوحدة الأديان. الثالثة : تكريس هذه الجماعة للضلالات الموروثة عن الفرق الضالة باحتواء ممثليها في هذا العصر و استمداد التربية و التوجيه منهم . الرابعة : زج الشباب في فتن الدماء في العديد من بلاد المسلمين لغلبة الجهل في منسوبي هذه الجماعة و قلة الحكمة في قياداتها و تأثير من هب و دَب في مواقفها دون نظر في عواقب الأمور . الخامسة : فرّخت هذه الجماعة فرقة ضالة و منحرفة هي : جماعة التكفير و الهجرة ، التي أسسها الشيخ علي إسماعيل رحمه الله و هو من الإخوان ، إلا أنه رجع إلى رشده وأعلن براءته من تلك الأفكار التي كان ينادي بها، ثم تولى قيادة الجماعة: شكري أحمد مصطفى أبو سعد ( أحد شباب جماعة الأخوان المسلمين ) بعد أن تبرأ من أفكارها الشيخ علي عبده إسماعيل، و هذه الجماعة استحلت دماء المسلمين فعاثوا في الأرض فسادا من قتل و نهب و تفجيرات ... سمات الخلل الإعتقادي<br />يغلب على منسوبي هذه الجماعة التقصير في تطبيق هدي النبوي تحاشياً من مشابهة علماء السنة، و من سمات منسوبي هذه الجماعة قلة الفقه و الدين و التخبط في الفتيا ، لأن جهود التنظيم لم تدع للشباب وقتاً لطلب العلم الشرعي ، و لربما كان ذلك مقصوداً حرصاً على استمرار غفلة الشباب عن أخطاء القادة . و من سمات منسوبي هذه الجماعة التعصب الشديد لشعار الجماعة و تنظيمها و منسوبيها ، لأنهم اُرْضِعوا هذا التعصب من كتابات الجماعة في سن المهد في المراحل الأولى من الإنتساب . و من سمات منسوبي هذه الجماعة التعصب الشديد ضد السلفيين خاصة ، لأنهم بنظر القوم دعاة إلى الفرقة بين المسلمين هذا من جهة ، و من جهة أخرى لأن السلفيين أعلم الناس بما في الجماعة من ضلال . و من سمات منسوبي هذه الجماعة التناقض في طرق الإستدلال و الإحتجاج بالأدلة ، بل حتى في تقرير المسائل الشرعية . و من سمات منسوبي هذه الجماعة استخدام الكذب في سبيل الدعوة إلى الجماعة من منطلق الغاية تبرر الوسيلة .<br />أيها الإخوة الكرام كان ذلك ملخصاً يسيراً عن الخلل الإعتقادي عند جماعة الإخوان المسلمين . و الله نسأله التوفيق و السداد"
