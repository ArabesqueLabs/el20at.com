[[comments]]
order = 1
subject = "كلام على الورق والمهم التنفيذ"
author = "واحد مصرى"
text = "الكتابة على الورق حاجة والتفيذ حاجة تانية<br />المكتوب فى الدستور بتاعنا حاجة والواقع حاجة تانية<br />المكتوب فى القوانين التى تحكم الدولة حاجة والواقع حاجة تانية<br />فى القانون مفيش تعذيب والواقع فية تعذيب<br />فى القانون مجانية التعليم والعلاج وكلنا سواء امام القانون ولكن الواقع ان اللى لة ضهر ما بينضربش على بطنة<br />احنا عايزين ناس تبنى البلد وتشغل العاطلين وتخللىكل واحد عندة كرامة<br />عايزين الاقتصادالمصرى زى اقتصاد ايطاليا او اسبانيا<br />انماتقوللى حقوق النسوان وحقوق الاقباط -هما مش مواطنين والا اية - والا عايزين تميزوهم<br />انما الفعل<br />وليست الاقوال كا الافعال"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 2
subject = "فتوى الإمام العلامة عبد العزيز بن باز في الإخوان المسلمين:"
author = "مش ضروري"
text = "فتوى الإمام العلامة عبد العزيز بن باز في الإخوان المسلمين:<br />س28 : سماحة الشيخ حركة ( الإخوان المسلمين ) دخلت المملكة منذ فترة وأصبح لها نشاط بين طلبة العلم ، ما رأيكم في هذه الحركة . وما مدى توافقها مع منهج السنة والجماعة ؟<br />ج28 : حركة الإخوان المسلمين ينتقدها خواص أهل العلم ؛ لأنه ليسعندهم نشاط في الدعوة إلى توحيد الله و إنكار الشرك وإنكار البدع ، لهم أساليب خاصة ينقصها عدم النشاط في الدعوة إلى الله ، وعدم التوجيه إلى العقيدة الصحيحة التي عليها أهل السنة والجماعة .<br />.فينبغي للإخوان المسلمين أن تكون عندهم عناية بالدعوة السلفية ، الدعوة إلى توحيد الله ، وإنكار عبادة القبور ، والتعلق بالأموات والاستغاثة بأهل القبور كالحسين أو الحسن أو البدوي ، أو ما أشبه ذلك ، يجب أن يكون عندهم عناية بهذا الأصل الأصيل ، بمعنى لا إله إلا الله ، التي هي أصل الدين ، وأول ما دعا إليه النبي صلى الله عليه وسلم في مكة دعا إلى توحيد الله ، إلى معنى لا إله إلا الله ، فكثير من أهل العلم ينتقدون على الإخوان المسلمين هذا الأمر ، أي : عدم النشاط في الدعوة إلى توحيد الله ، والإخلاص له ، وإنكار ما أحدثه الجهال من التعلق بالأموات والاستغاثة بهم ، والنذر لهم والذبح لهم ، الذي هو الشرك الأكبر ، وكذلك ينتقدون عليهم عدم العناية بالسنة : تتبع السنة ، والعناية بالحديث الشريف ، وماكان عليه سلف الأمة في أحكامهم الشرعية، وهناك أشياء كثيرة أسمع الكثير من الإخوان ينتقدونهم فيها ، ونسأل الله أن يوفقهم ويعينهم ويصلح أحوالهم(<br />س29 : تعرفون سماحتكم أن كثيراً من المؤلفات المدرسية ساهم في تأليفها عدد من الإخوان المسلمين منذ الستينات فهل يتوجب إعادة طباعة ودراسة هذه المؤلفات المدرسية ؟<br />ج29 :لا أعرف عنها شيئاً ، ولأنني مشغول لم أقرأها . أسمع عن دعوة الإخوان المسلمين ، وعدم نشاطهم فيما يتعلق بالعقيدة ، ولكني لم أقرأ قراءة كافية في كتبهم وما جمعوا ، لا من جهة الشيخ حسن – – ولا غيره ))() ."
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 3
subject = "فتوى العلامة المحدث محمد ناصر الدين الألباني – رحمه الله -: في الاخوان المسلمين"
author = "مش ضروري"
text = "فتوى العلامة المحدث محمد ناصر الدين الألباني – رحمه الله -: في الاخوان المسلمين<br />قال رحمه الله : (( الإخوان المسلمون ينطلقون من هذه القاعدة ( يقصد : نعمل فيما اتفقنا عليه ويعذر بعضنا بعضاً فيما اختلفنا فيه) التي وضعها لهم رئيسهم الأول ( يقصد حسن البنا) وعلى إطلاقها ( أي حتى في العقيدة ) و لذلك لا تجد فيهم التناصح المستقى من نصوص كتاب الله وسنة رسول الله ؛ ومنها سورة العصر: &--61533; والعصر * إن الإنسان لفي خسرٍ * إلا الذين آمنوا وعملوا الصالحات وتواصوا بالحق وتواصوا بِالصبر &--61531; ؛ هذه السورة كان أصحاب النبي &--61554; إذا تلاقوا ثم أرادوا أن يتفرقوا قرأ أحدهم هذه السورة لأهميتها &--61533; وتواصوا بالحق وتواصوا بِالصبر &--61531; ؛ الحق كما تعلم ضد الباطل ، والباطل أصولي و فروعي ، كل ما خالف الصواب فهو باطل ، هذه العبارة هي سبب بقاء الإخوان المسلمين نحو سبعين سنة عملياً بعيدين فكرياً عن فهم الإسلام فهماً صحيحا وبالتالي بعيدين عن تطبيق الإسلام عملياً لان فاقد الشيء لا يعطيه )) [ شريط رقم ( 356) ضمن سلسلة الهدى والنور ] ."
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

