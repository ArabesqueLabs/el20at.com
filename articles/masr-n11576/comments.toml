[[comments]]
order = 18
subject = "الحكم الدينى"
author = "ضد الاخوان"
text = "الاخوان لازم يحكموا مصر - لية<br />الدولتين اللى فى الشرق الاوسط اللى فيهم ديمقراطية وعندهم تقدم فى كل المجالات عندهم حكم دينى<br />الدولتين دول هم اسرائيل وايران - والاتنين فيهم حكم دينى<br />احنا جربنا الشيوعية وجربنا الاقطاع وجربنا راسمالية احمد عز وسواريس لية ما نجربش الدين<br />لية دكاترة الاخوان ما يحكموش البلد<br />هنشوف التنمية والبناء وهيهرب الحرامية بتوع لجنة على بابا والاربعين حرامى وسياسات التجويع<br />لماذا لا نجرب حكم دكاترة الاخوان ؟<br />اية المانع"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

[[comments]]
order = 19
subject = "الدين النصيحة"
author = "مش ضروري"
text = "يا جماعة دا مش تكفير<br />فسمعت العلامة الشيخ الشعراوي في تفسيره يقول ناطق الشهادتين ليس بكافر ويوم القيادة لا يمكن من نطق الشهادتين ان يكون كالذي جهد بهما ابدا<br />علشان خاطر التكفير انا ما بحبش الاخوان المسلمين لانهم بيقولوا على الحاكم انه فرعون والجيش جيش فرعون وهذا هو عين التكفير لان الحاكم مسلم سني يدافع عن المادة الثانية من الدستور التي تنص على ان الدين الرسمي للبلاد هو الدين الاسلامي والشريعة الاسلامية هي مصدر التشريع وجيش مصر الذي يحمي مصر من اليهود ليس بجيش فرعون<br />فلو سمحتوا والله اللي يعرف حد من الاخوان المسلمين يروح يقولهم خطا يكون الحاكم فرعون وجنوده والاخوان المسلمين سيدنا موسى وبني اسرائيل<br />خطأ خطأ خطأ ورفضها علماء اهل السنة والجماعة<br />علمًا بأنني مسجل في مباحث امن الدولة انني من الاخوان المسلمين"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105249/http://masr.20at.com:80/newArticle.php?sid=11576"

