text = "هل تنجح نصائح البرامج الفضائية في نجاح الإنسان في إنقاص وزنه ؟<br />سؤال طرحته على نفسي عندما شاهدت تنويه عن إذاعة حلقة من برنامج \"يالا نخس\" عبر قناة الصحة والجمال أحد باقات قنوات الناس، التي ستذاع تذاع منه حلقة جديدة غدا الاثنين الموافق 25/2/2008 وستتحدث الحلقة عن كيفية إنقاص الوزن والطرق التي تؤدي إلى ذلك من خلال عمل رجيم يتم إتباعه.."
