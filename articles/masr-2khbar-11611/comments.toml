[[comments]]
order = 2
subject = "خطأ الاخوان الرئيسى والجسيم"
author = "اكتب اسمك هنا"
posted = "2009-03-18"
text = "الحزب الاسلامى فى تركيا تولى الحكم<br />الحزب الاسلامى فى العراق يحكم<br />الحزب الاسلامى فى افغانستان يحكم<br />طيب وما الذى يمنع فى مصر<br />امريكا تنتظر من الاخوان ان يعملوا حاجة واحدة فقط - هى ان يعترفوا باسرائيل كامر واقع ويوافقون على اتفاقية كامب ديفيد<br />لو فعلوا ذلك<br />امريكا هتخليهم يحكموا من تانى يوم"
archived = "2010-03-14"
capture_url = ""

