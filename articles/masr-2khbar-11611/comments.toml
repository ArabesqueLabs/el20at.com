text = "ههههها هههها هااا<br />طبعا هارفض باتاكيد؟<br />لية هو انا و لا المؤاخذة متخلف و لا أرهابى و لا موتور و حقود<br />الف مليون أتفوووووووووووووووووووووا عليكم"
