subject = "عيب كده يا جماعة"
author = "مسلم و بس"
posted = "2008-02-26"
text = "ألف سلامة للخلوق محمد ابو تريكة .. بس كنت عاوز أسأل هو ليه التعليق اللي فات ده لسه موجود ؟؟<br />هو إحنا مش هنعرف نحترم نفسنا شوية .. و الا هنظل طول عمرنا .......... و الا بلاش ؟؟<br />أرجوكم شيلوا التعليق ده .."
archived = "2008-02-28"
