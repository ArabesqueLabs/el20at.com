subject = "ابو تريكه طيزه واجعاه............ يا حرام"
posted = "2008-02-26"
text = "حاسبوا يا جماعة لحسن ابو تريكه يا حرام طيزه واجعاه خالص ومش عارف يعد عليها ولا يخش الحمام<br />يا حرام"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004236/http://masr.20at.com:80/newArticle.php?sid=14369"

[[comments]]
order = 1
subject = "سلاماااااااااااااات"
author = "نيفين نيفى نوفا"
posted = "2008-02-26"
text = "الف سلامه لمحمد ابو تريكه اللاعب و الانسان<br />انا حاسه يا اهلاويه اننا واخدين عين تمام من اخواننا اياهم<br />عارفينهم طبعا<br />اللى اول حرف من اسمهم زملكاويه<br />الاول ابو تريكه و بعدين الحضرى<br />ربنا يستر"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004236/http://masr.20at.com:80/newArticle.php?sid=14369"

[[comments]]
