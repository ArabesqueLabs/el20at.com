[[comments]]
order = 3
subject = "التعليق مش حيتشال"
author = "صاحب التعليق الاول"
posted = "2008-02-27"
text = "التعليق مش حيتشال<br />لان عيب اوي اوي اوي بلد فيها كام مليون مريض بالسرطان والفشل الكلوي تهتم بأبو تريكه<br />عيب اوي الشعب المصري يصرف فلوسه على الكوره والسيما<br />عيب اوي الشعب المصري يعمل عادل امام وابو تريكه ومحمود الخطيب وسعاد حسني وبعد كده ما يلاقيش فلوس يتعالج بيها<br />اصحو شوية يا شعب نايم"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004236/http://masr.20at.com:80/newArticle.php?sid=14369"

[[comments]]
order = 4
subject = "ممتاز يا عشرينات استمري في فضح الخيبه"
author = "ابومحسن"
posted = "2008-02-27"
text = "ممتاز يا عشرينات استمري في فضح خيبة الشعب المصري<br />المهتم بابو تريكه علشان خاطر يشتري المرسيدس ويسكن في الزمالك<br />وسايب المصريين مش لاقيين فلوس يتعالجوا بيها"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004236/http://masr.20at.com:80/newArticle.php?sid=14369"
