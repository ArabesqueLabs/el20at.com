author = "حراميه بالقانون"
posted = "2009-07-04"
text = "الا من رحم ربي<br />ــــــــــــــــــــــــــــــــــــــ<br />المحامي دا يا جماعة حرامي بالقانون<br />يسرق بالقانون<br />ويهبش بالقانون<br />ــــــــــــــ<br />تخيلوا يا جماعة لما واحد يروح لواحد محامي ويدفعله اتعابه ويعملوا توكيل وبعدي كده الجبان يغدر بيه ويبيعه لخصمه<br />اي والله دا بيحصل في عالم هؤلاء الكلاب<br />لعنة الله عليكم ايها الكلام الاوغاد اللي مسمين نفسهم مكامين<br />اتفوووووووووووووووو عليكم من كل قلبي"
