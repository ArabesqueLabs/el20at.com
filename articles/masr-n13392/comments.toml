subject = "ياصباح النووووووووور"
author = "محمد السيد"
text = "إيه ياعم الروقان ده بس؟؟<br />والله تحفةةةةةةةةةةة ......<br />أنا قعدت أبعثه للناس اللي أعرفها ..... صباح المسخرة حقيقي ,...<br />بس مقلتلناش برضه ....<br />جملتك انت ايه ياريس؟<br />يارب أنا كمان .. مش حاسكت<br />تقدروا تنورونا دلوقتي<br />http://mesh7askotbardoh.blogspot.com<br />لا للتمديد .. لا للتوريث ... نعم لتعديل الدستور \"طبعا مفيش داعي أقول إن ملهاش لازمة الكلمة دي\"<br />mohamedmat@hotmail.com"
