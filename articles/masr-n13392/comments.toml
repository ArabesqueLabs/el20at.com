subject = "اسطونات مشروخة"
author = "وسيم gooldenfox60@hotmail.com"
posted = "2007-12-13"
text = "هو فعلا اصبح الكلام والحمل سواء من الشباب او البنات مكرر واصبحت اسطوانات مشروخة وبعدين اة الشباب بتقول جمل كتيرة مكررة لكن الاسوء ان معظم البنات بتكدب كدب بين وواضح جداا ونادرا لما تلاقى واحدة صادقة فى كلامها وشعورها كلهم ملهوفين على الجواز وخلاص مش مهم يقول اية المهم انة يجى يتقدملى وخلاص واهو ضل راجل ولا ضل حيطة انا بتكلم على البنات الخلصوا جامعة يعنى مش فارق معاهم ال30جملة البيتقالوا المهم المضمون وهو هتيجى تتقدملى ولا اشوف واحد واحد جاهز احسن"
archived = "2007-12-13"
capture_url = "https://web.archive.org/web/20071213185727/http://masr.20at.com:80/newArticle.php?sid=13392"

