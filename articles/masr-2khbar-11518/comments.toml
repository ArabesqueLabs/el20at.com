subject = "اعرضوهم على دكاترة نفسيون"
author = "اكتب اسمك هنا"
posted = "2009-03-10"
text = "ناس والعياذ باللة مرضى او يمكن كتر الفلوس مع اهليهم بتخليهم يدلعوا<br />واعتقد ان دى افرازات الغنى الفاحش الناتج من جمع الفلوس من الاحتكارات والسرقة وربنا بيعاقبهم فى اولادهم<br />دى لو ناس بتعرق فى الحصول على رغيف الخبز يبقى مفيش عندهم وقت للمسخرة دى"
