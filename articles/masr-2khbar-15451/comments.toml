text = "المشكلة اللى أحنا مش واخدين بالنا منها أن نسبة كبيرة من سيارات الأجرة والميكروباصات اللى بتعمل مشاكل وبتمارس الجشع على الناس ملك بعض أفراض الشرطة اللى بدورهم بيقوموا بحماية ها الجشع والتسول والبلطجة على الركاب .... حسبنا الله هو نعم الوكيل والمعين على كل فاسد"
