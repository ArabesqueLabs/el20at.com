posted = "2010-02-23"
text = "بتوع المرور عاملين شهرية تندفع على ميكروباص - فاردين فردة على كل سواق - غير المخالفات - وفى بعض المناطق الفردة الشهرية مفروضة على التكتوك واللى ما بيدفعش وبيقول انا غلبان التكتوك بينسحب ويحجز ويغرم صاحبة الف جنية لانة غير مرخص<br />دى امبراطورية فساد داخل الدولة<br />مرور اية يا عم الحاج<br />دة طابونة وبيلهطوا منها وبيشاركوا الناس فى رزقهم وبعضهم بيشغل ميكروباصات على حسابة الخاص وبتمشى من غير فرامل وبعجل ممسوح<br />مش عندنا اكاديمية مبارك للشرطة لنشر الفساد واذلال العباد"
