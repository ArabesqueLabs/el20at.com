author = "ادفع يعنى تدفع"
posted = "2010-02-23"
text = "سياسة الحكومة ( حكومة الاحتلال الداخلى ) هى جباية اقصى ما يمكن جبايتة من الشعب<br />الداخلية تجيب ايرادات للخزانة بالعافية - ازاى - تعمل مخالفات بالباطل والعاطل - وتلم فلوس - سواء السائق مخطىء او غير مخطىء<br />انظر فى اى اشارة مرور - تلاقى عسكرى مرور واقف وماسك دفتر وقلم فى ايدة واى سيارة بتمر علية بيسجل رقمها ويخبطها مخالفة ولما الدفتر يتملى يروح يسلمة والعسكرى اللى ما يكتبش مخالفات بيطلعوا ميتيين اهلة<br />دى سياسة جباية<br />مش مخالفات ولا مرور ابدا<br />امال يوسف بطرس غالى هيصرف على علاج عينية فى امريكا مليون جنية من خزينة الدولة ازاى والتانية هتشد وشها العكر وتظهر نيو لوك ازاى ومن اين"
