subject = "بلاش الروح الانهزامية"
author = "البدراوى"
posted = "2007-06-03"
text = "اولا انا معرفش ابن عثيمين ده ـ ثانيا انت بتقول ان الحاكم معاه الجيش والطيران والـ ................ لكن مننساش ان الجيش والبوليس والطيران دول فى النهاية مصريين زينا يعنى اخواتنا وولاد عمنا وجيرانا وهكذا ................ ثالثا : ان لو استخدم الحاكم الجيش وغيره فى القمع التجارب بتقول ان الانسان عنده قدرة معينه على القمع والقتل لا يمكن ليه الاستمرار الى النهاية فى استخدام هذه القدرة ... ولو تتذكر تجربة شاشيسكوا فى رومانيا ان الجيش والبوليس استمر فى حماية شاوشيسكوا وقهر المظاهر الى ان وصل لمرحلة انتهاء قدرته على القمع والقتل فتركط المتظاهرين يدخلوا قصر شاوشيسكوا وكانت نهايته ( وعقبال نهاية اللى فى بالى يارب )"
