[[comments]]
order = 1
subject = "اممممممم"
author = "ام الثبت"
posted = "2008-05-19"
text = "شخصيا اعجبني جداااا كلام مسفر الغامدي عندما قال \"نحن الرجال لا يدخل الغرباء بيوتنا حتى لو كانوا مسلمين فما بالك بهذا القادم من بلاد جورج بوش وكوندليزا رايس\".<br />فهذه نقطة يجب عدم اغفالها و فعلا انك رجال يا مسفر :-)<br />أما اذا كان يتوفر في المنزل مضافة او غرفة خارجية و بابها يفتح على خارج المنزل و ليس داخله و هو لن يتعامل الا مع الشباب او الرجال من العائلة فقط فارى انه لا مانع من استقباله لانه سيذهب لدراسة اللغة العربية فما المانع ؟ اذا كان محترم و احترم التقاليد و لم يعمل بالتنصير و نشر افكاره فانا مع استقباله ..<br />ليس بغرض تحسين صورة المسلمين فالمسلمين صورتهم جميله<br />و ليست مشكلتنا اذا كان الغرب تعمد تشويه صورة الاسلام امام شعوبهم فنحن لسنا في موقف الدفاع عن النفس .. و لكن استضافته ستكون من قبل انه طلابنا عندما يسافرون فانهم ايضا يفضلون استضافتهم من قبل عائلات لكي يتقنوا اللغة مع الفارق انه يدفع للعائلات الامريكية مقابل مادي لاستضافة اي طالب و ما يستضيفون لله و في الله :-)<br />اما في حال دولة مثل السعودية يواجه طلابها الكثير من المشاكل في امريكا اذا كان يوجد طلاب كثر من امريكا للدراسة او غيره يقدمون للسعودية فيستطيع الشعب بنفسه ان يتخذ موقف و يعممون حركة و يرفضون استقبال اي طالب امريكي حتى تحل مشكلة حميدان التركي .. و خير مثال ما قاله حسين أبو الخير و تفكير جميل منه احساسه بقضايا السعوديين عامة فعلا تفكير ايجابي و جميل ..."
archived = "2010-03-14"
