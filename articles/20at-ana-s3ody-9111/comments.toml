[[comments]]
order = 3
subject = "بيعجبني اللي يخبط في كل حتة اتكلم في الموضوع يا اب"
author = "هههههاي يا جمالك يا محمد احمد"
posted = "2008-05-19"
text = "هههههههههههههه<br />اشمعنا ؟؟؟؟ ضحكتني جداااااااااااااااااااااااااااااااااااااااااا<br />معلش يا اونكل بقى تروح كده تعمل سيرش و تقرا في موضوع حميدان التركي ده عشان شكلك كده مش فاهم بس عاوز تتكلم و السلام ..<br />و بتقول ايه يا روح امك علي صوتك عشان اسمع ؟ مافيش مصري ايه ؟ مافيش مصري اتمسك برة يااا خرااااااااابي<br />انته بتضحك على مين يا عم م/ محمد احمد عبد القوى<br />يا ابني المصريين ممسوكين جوة قبل ما يتمسكوا من الناس برة ،<br />اما ثانيا اللي ممسوكين كتير قويي برضة جوة و برة بس الفرق ايه عارف ؟<br />حميدان التركي لقي صوت يدافع عنه و ينقل قضيته للناس كلها عشان هو مظلوم و ربنا هيقف معاه<br />بس يا عيني المصريين بقى اللي بيتمسكوا في كل حتة و الحكومة مش ساءلة و الناس الغلابى مش لاقيين طريقة يتكلموا و بعدين يا ابني الواد حميدان التركي ده تروح كده تقرا قصته و تروح كمان تقعد شوية مع نفسك تفكر كده اشمعنى اتمسك في الوقت اللي في هجوم من امريكا ضد السعودية اعلاميا و تفكر شوية برضه ليه هو اللي اتسمك و مافيش غيره حالة استسنائية يعني .. .. اوكيه يا بابا .. اصل انا مش هقلك القصة كلها بقى لازم تقرا شوية بنفسك بزمة و ضمير قبل ما تقول حاجة .. و لما تيجي تقول ابقى تكلم كده في الموضوع ماشي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "حق الرد"
author = "م/محمد احمد عبد القوى"
posted = "2008-05-20"
text = "شكر على الاخ اللى رد عليا اللى مكسوف يكتب اسمه مش عارف ليه وعلى فكره ده مش كلام مقدس حق الرد مكفول للجميع سيبك من حمدان التركى اللى كانه بيحضر دكتوراه فى الوقود النووى ده بيحضر فى الصوتيات!!!!! وعلى فكره ربنا معاه اذا كان مظلوم وانا اول واحد اقف معاه فى حاله ظلمه عشان ده اخويا فى الاسلام مش بس فى العروبه والكلام الفاضى اللى بيرددوه وبعدين بتتهمنى انى بخبط فى كل حته لا على فكره انا بخبطش ولا حاجه انت بس اللى الكلام مجاش على مزاجكوبكرره تانى ده واحد مدنى مش عسكرى زى اللى وكليين شاربيين مهييصين معاهم وبرضاهم ويقابلو بوش بالورود والاحضان ومعندهمش مشاكل وان كنت ناسى مادلين اولبريتام رجلين حلوه لسه عيشه وبالتالى بلاه كلام فاضى وحجج واهيه احنا المصريين بتمسك جوه عشان ايه طبعا ظلم وافتراء بس فى الاخر احنا يد واحده فاكر زلزال 1992<br />اما حبابينا ملوك البترول سابو اخوتهم ماتو من البرد فى عز التلج وهم فى سابع نومه ومعندهمش مشاكل حقولك ايه ياسيدى طب ما ردتش على الاخ مسفر الغامد ليه اللى يقولك نحن الرجال لايدخل الغرباء بيوتنا حتى لوكانومسلمين فمابالك بجورج بوش وكونداليزا رايس طب تضحك انتا ولا انا اللى اضحك وجورج بوش اول ما يهب على المنطقه يبدأ بالسعوديه بعد حبيبته اسرائيلعادى وبينام فى بيوتهم وعاه ام اربعه واربعيين كونداليزا ومسمعناش الاخ مسفر المغوار كان له صوت اما احنا فكان فيه مظاهرات واعتقالات محنش يعنى بنشوف ونسكت ثم ان الجواب على اد السؤال الراجل ده امريكى طلب الضيافه ايه ردك وفكرك بالعرب زمان اهل الكرم والمرؤه دلوقت خلاص لا كرم ولامرؤه والدليل غزه وبس خلاص كفايه عليك كده"
archived = "2010-03-14"
capture_url = ""
