[[comments]]
order = 2
subject = "اشمعنا"
author = "م/محمد احمد عبد القوى"
posted = "2008-05-19"
text = "اشمعنا الامريكى الفرادانى الوحيد ده ما الجيش بتاعه قاعد على قلبكم شاربين نايميين مهيصيين معاكم وطبعا برضاكم وغصب عنكم الراجل الغلبان قال لما جرب معاهم الذوق بس الظاهر انه يضطر يلجا للعصا طلما الجزره مش نافعه ويقو ل لام اربعه واربعيين ست الحسن والجمال كونداليزا وطبعا كوندليزا اول ما هتضحك لحد من كبارات القوم عندكم سيسيل لها اللعاب وتوافقكم عليه ومين حمدان التركى ده عشان الهيصه اللى انتو عملنه دى تنظيم قاعده اكيد لا طب اخوان اكيد له امال ايه عشان تقولو ان الامريكان يلفقو التهمه المشكله انكم مصدقين ان انتم ملايكه ومش عاوزكم تنسو دا واحد طول عمره فى السعوديه الوحيده اللى شاف وجهها كانت امه وطبعا لما راح امريكا وشاف الدنيا سداح مداح عقله طار والله اعلم اذا كان دا حصل ولا لابس الامريكان مش زينا لو التهمه ملفقه كانت حتبأ سياسيه يعنى حوزه قنابل خطط تفجير وغيره مش ضرب خدامه ومحاوله الاعتداء عليها الظاهر انو افتكر نفسه له فى السعوديه طالما المجنى عليه غريب مش مهم لو كان سعودى يا خرابى على الللى يحصل للى كلمه او حتى بصله وانتم مش محتاجين توصيه وعلى فكره دا مش اول واحد فيكم يعمل كدهما المصريين المبتعثين بالمئات بره ومسمعناش ان حد اتمسك عشان خدامه ولا حاجه عره ولا مؤاخذه اللى مالوش كبير يشترو كبير وتحيا مصروالسلام ختام"
archived = "2010-03-14"
