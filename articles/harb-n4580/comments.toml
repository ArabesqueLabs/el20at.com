text = "انتو عاملين هيصه على فيستا ليه انتو عارفين ان نظام ميكروسوفت كله فاشل لانه مش بيحترم عقل المستخدم لكن لو فكرتوا شويه حتلاقوا ان نظام ابل ماكنتوش هو الافضل لانه بيحترم عقل المستخدم واخر احصاذيه بتقول انه في عام &--1634;&--1632;&--1632;&--1638; ضرب نظام ميكروسوفت &--1640;&--1636;&--1632;&--1632; فيروس وانه لم يضرب نظام ابل ماكنتوش اي فيروس ( على فكره انا باسعمل ابل ماكنتوش من &--1633;&--1633; سنه) شكرا هذا للعلم فقط"
