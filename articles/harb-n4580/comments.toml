[[comments]]
order = 5
subject = "فيستا"
author = "مختبر برمجيات"
posted = "1970-01-01"
text = "انا عن رأيى انة كعادة ميكروسوفت فى كل برامجها ستقوم بالاهتمام بالمنظر الذى يوحى لك انك تستخدم شئ خيالى ذو امكانيات رهيبة بينما ان الواقع هو ان النظام مثلة مثل سابقة و الاختلاف فقط فى المنظر و بعض الامكانيات عديمة الاستخدام التى يقوموا بالدعاية لها ليجعلوك تعتقد انك لن تستطيع العيش بدون هذة الامكانية بينما هى فى الواقع لا فائده لها.<br />و عند القراءة عن الامكانيات التى تحتاجها اتشغيل فيستا فهى فى الواقع كما قال كاتب الموضوع ولكنه اغفل اهم شئ و هو ان هذة الامكانيات لتشغيل فيستا بدون AERO و الذى يعتبر اهم شئ فى الفيستا و هو نظام نوافذ ثلاثى الابعاد و لتشغيلة تحتاج الى 1جيجا رامات و معالج بينتيوم 4 و هذة الامكانيات ليست متوفرة لاغلبنا بالطبع وبعد كل هذا ستكتشف انة هو نفسة XP و لكن متخفى وراء دعاية و هميه بأسم جديد"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193502/http://www.harb.20at.com:80/newArticle.php?sid=4580"

[[comments]]
order = 6
subject = "Microsoft Certified Professional"
author = "فارس ربيع"
posted = "1970-01-01"
text = "أنا صحيح معايا شهادة من مايكروسوفت بس أنا برضه لازم أقول الحق على حسب معلوماتي<br />الموضوع ان مايكروسوفت عندها من زمان عائلتين من نظم التشغيل<br />1- 9X ودي معمولة لمستخدمي المنازل<br />2- NT ودي معمولة للشركات<br />ميكروسوفت نزلت نظام تشغيل قنبلة من ناحية الأداء والاستقرار والأمان .... النظام ده ويندوز 2000 وطبعا نظام التشغيل ده نجح نجاح ساحق على مستوى الشركات لدرجة ان شركات كتير جدا ما زالت تستخدم نظام ويندوز 2000 بعد 7 سنوات من اصداره<br />الموضوع بقى ان مايكروسوفت كانت عاوزة تستثمر النجاح الساحق لويندوز 2000 وخاصة مع الفشل الذريع لويندوز ميلينيوم في اصدار نسخة ويندوز موجهة لمستخدمي المنازل وتكون في نفس الوقت في نفس قوة ويندوز 2000 من هنا جت فكرة دمج فوة ويندوز 2000 ( أو عائلة NT ) مع سهولة وبساطة عائلة 9X وبدأ العمل في ويندوز اكس بي اعتمادا على النواة الخاصة بويندوز 2000 وتطويرها واضافة شكل جذاب لمستخدمي المنازل.<br />طبعا كل ما كانت واجهة المستخدم فيها مؤثرات أكتر .. كل ما كان استهلاك الموارد أعلى وبالتالي احتياج امكانيات عتاد أعلى لكن في نفس الوقت جذب تسويقي أكبر للمستخدمين المبهورين بالشكل الجديد.<br />اكس بي ... مع شكله الجديد نجح نجاح ساحق بدلالة عدد الأجهزة التي تعمل بنظام ويندوز اكس بي في العالم ولذلك كان لازم ميكروسوفت تركز في النظام الجديد على الشكل لأن الشريحة الأكبر من المستخدمين من غير المتخصصين تبحث عن الشكل بدون الاهتمام بأشياء أخرى ...<br />ويندوز اكس بي تعرض لهجمات أمنية خطيرة جدا قبل اصدار الحزمة الخدمية الثانية ... صحيح معظم الهجمات دي كان الخطأ الأكبر فيها على المستخدمين لكن برضه ده كان لازم يوضع في الحسبان في نسخة الويندوز الجديدة وعشان كده تأجل اطلاقه أكتر من مرة<br />مشكلة ميكروسوفت الأساسية من أول ويندوز 95 لحد النهاردة انها مبتعملش نظام تشغيل من الصفر أبدا ... لازم تبني نظام التشغيل على النظام اللي قبله وده بيعمل تراكم للمشاكل اللي في الويندوز.<br />ده طبعا غير سعر نسخة الويندوز المبالغ فيه.<br />من ناحية تانية أنا شخصيا بعتبر ان برمجيات المصادر المفتوحة أكثر سهولة في الاختراق لأن الهاكر يقدر يشوف الشفرة بتاعت البرنامج ويحللها ويطلع الثغرات الموجودة ويهاجمها. الهجمات كتير على ويندوز وميكروسوفت بسبب نسبة الأجهزة اللي بتشتغل بويندز في العالم ورأيي ان لما لينكس يبقى نسبته في العالم نفس النسبة دي ... هيتعرض لكمية هجمات قد كده و ممكن أكتر. أنا بحب لينكس جدا اشتغلت عليه فترة ... بس عيبه الوحيد انه مش معقول أدوخ السبع دوخات عشان أعرف كارت أو مودم ومش معقول أقعد ربع ساعة عشان أعرف أنزل برنامج.<br />أنا بحترم مايكرسوفت جدا .... بس بيدايقني جدا انهم عندهم كل الامكانيات اللي تخليهم أحسن من كده كتير ومنساش أبدا كنت بتكلم مع واحد من شركة ميكروسوفت نفسها فسألته ميكروسوفت ليه مبتعالجش مشاكل كتير معروفة في الويندوز ؟<br />قاللي : المشاكل كلها ميكروسوفت عارفاها بس لو حليتها مرة واحدة هتبيعلك ايه بعد كده !<br />معلش ... طولت عليكم"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193502/http://www.harb.20at.com:80/newArticle.php?sid=4580"

