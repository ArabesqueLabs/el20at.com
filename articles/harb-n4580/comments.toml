[[comments]]
order = 2
subject = "رأيي في مايكروسوفت"
author = "أحمد القطب"
posted = "1970-01-01"
text = "نحن المتخصصون في مجال تقنية المعلومات نرى مايكروسوفت تماماً مثل الحكومة المصرية، جهة تحتكر القوة وتحتقر الناس.. نحن المصريون لم نثق يوماً في الحكومة المصرية ولا في قراراتها.. وأنا كرجل يعمل في هذا المجال منذ عام 2000 لم أثق يوماً في مايكروسوفت ولا في أي منتج من منتجاتها..<br />وأنا بصراحة باحلم باليوم اللي يبقى عندي فيه كمبيوتر أبل بنظام ماكنتوش.... آاااااااااااااااااه"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193502/http://www.harb.20at.com:80/newArticle.php?sid=4580"

[[comments]]
order = 3
subject = "معلومات اضافية"
author = "علي"
posted = "1970-01-01"
text = "شكرآ للموضوع لكن انبهار الكاتب بغسيل المخ الذي قدمته ميكروسوفت لم بعجب الكثيرين وانا منهم فللمعلومية الاتحاد الاوربي رفع قضية احتكار وعدم مطابقة ضد ميكروسوفت حيث ان الفيستا بشكلها الجديد لا تدعم الا معالجات الثنائية النواة بشكل يجعلها تعمل بكل كفائتها وغير ذلك فالمعالجات القديمة والتي معظم المستخدمين يمتلكونها لا يستطيعون الحصول على كامل مميزاتها فنات تدفع اكثر لتحصل على اقل وهذا غش وتدليس. ومن ناحية أخرى لا يفوتنا خيار الترقية او الابغريد للأكس بي والذي تغافلت عمه ميكروسوفت فالخيار هذا صار شبه غير محسوب وغير متوفر. واخيرآ اتذكر على صدى هذه الضجة الكبيرة ضجة الاكس بي والويندوز 2000 حيث انه ميكروسوفت بالغت بوصف الاكس بي لدرجة انها صارت تبيع الاحلام بينما الواقع يقول ان الفرق بين الاثنين هو الرسومات والثيمات وبعض النوافذ والخيارات الجديدة فقط لا غبر بينما بشتركان بنفس النواة الواحدة.<br />تحياتي للجميع"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193502/http://www.harb.20at.com:80/newArticle.php?sid=4580"

