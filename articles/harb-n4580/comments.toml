text = "المفاجأة التي فجرها كريم رمضان في المؤتمر الصحفي الذي حضرته، هي المواصفات التي يج توافرها في جهازك لتحصل على نسخة \"Vista\"، فالجهاز يتطلب فقط 256 رام، وبروسيسور 800 ميجا.. وهي مواصفات قليلة ومتواضعة جدا بالنسبة لمستخدمي الشرق الأوسط.. خصوصا وأن مظمهم يمتلك أجزة حديثة لأن عمر استخدامهم للكومبيوتر ليس كبيرا!<br />false and in accurate.<br />you need 1 GB cash memory to enjoy good performance with windows vista."
