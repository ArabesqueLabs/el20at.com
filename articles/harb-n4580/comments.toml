subject = "About Apple Ads"
author = "Ahmed"
posted = "2008-09-11"
text = "انا واحد عندى اى ماك امريكانى اصلى وربنا لكن برضه مش سعيد بدعاية ابل عن اجهزتها ونظام او اس بانه الاكثر امنا عشان اصلا عدد المستخدمين فى العالم حوالى 10 او<br />15 فى المية فلازم طبعا الفيروسات تنزل معظمها على الويندوز لان الهاكر مش هيضيع وقته ويعمل فيروس محدش يجربه<br />ثانيا بيقولوا ان مشاكل او اس اكس قليلة -وده فعلا صح و عن تجربة - طب ماهو لازم يبقى مشاكله قليلة لانه النظام مصمم على انه يشتغل على اجهزة محددة و مواصفات لايمكن التغاضى عنها مش زى الويندوز يشتغل على اى جهاز . على فكرة انا عمرى ماستخدمت نظام غير ليوبارد و من قبله تايجر وبانزر لكن بحب اللينكس لانه يونكس واحنا<br />الاثنين ولاد عم"
archived = "2010-03-14"
capture_url = ""
