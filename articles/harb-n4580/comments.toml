order = 0
subject = "الكتابة حلوة، لكن المضمون..."
author = "مصعب"
posted = "1970-01-01"
text = "ماشي يا البراء يا ابني،<br />مش هأخلي منتجات ميكروسوفت توقع ما بيننا<br />بص يا ابني أنا في كام نقطة هأوضحهم هنا، ونقاااااااااااااط أخى كثيرة لا يتسع المجال لذكرها هأحطها في مقال إن شاء الله<br />1) أنا مش متعصب للأوبن سورس أو ضد ميكروسوفت، أنا بأحترم أي حاجة \"محترمة\" سواء كانت تجارية أو مفتوحة المصدر أو أي شكل تاني من أشكال التعامل، المهم تكون محترمة، ودي اللي تاريخ وسلوكيات ميكروسوفت ما حققتهمش على طول الخط..<br />2) أنا بأحترم \"عقلية\" بيل جيتس جدا لأنه قدر يعمل حاجة، بس بأكره \"تصرفاته\" ... بس!<br />دي بس النقط اللي هأقولها هنا، الباقي (وهو كتييييييير أوي) في المقال الجاي بإذن ربك<br />بس كتابتك حلوة جدا :-)<br />بحبك يا صاحبي..."
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193502/http://www.harb.20at.com:80/newArticle.php?sid=4580"

