text = "بسم الله .. والصلاة والسلام على سيدنا محمد وعلى أله وصحبه أجمعيـن ..<br />أولا: أحمد الله بأني سعوديـه .. فأقسم بالله أننا ننعم بحياه سعيده .. وراحـة بال .. وذلك بأحساسنا بالأمن والأمـان والسلام .. تحت ظل حكومتنا الرشيدهـ .. التي تحكمـ بكتاب الله وسنـة نبيـه ..<br />ثانيا : أود الرد على كل من نعت بالقضاء بالتخلف .. وسب في الدوله ..من أنت لتعطي حكما جائر .. ذلك الحكم النابع من جهلك في القضاء التي تحكم به الدوله السعوديـه .. ولما تحمل دولتنا مسئولية تلك أحكام ذلك القضاء .. أأنت ناسي أم متناسي أن الدوله السعوديـه لا تحكم بقوانين وضعيه لتحملها نتائج تلك الأحكام التي في نظرك وفي تفكيرك السطحي بأنها ظلم .. لا ياأخ .. أنت مخطئ .. القضاء القائم بالمملكه العربيه السعوديه ماهو ألا تطبيق لأحكام شريعتنا الأسلاميـه نحن لانحكم بقوانين وضعيه من البشر أنما نحكم باأحكام الشريعه الأسلاميه العظيمه المنزله من الله جل جلالـه .. وأنما نعتك لذلك القضاء بالمتخلف .. فكيف تؤمن بدين وترفض قضائـه ( هذا أذا كنت مسلما حقا !!! ) أو ترفض أحكام شريعة الله ..؟؟؟؟!!! أهناك أحسن من حكمـ الله …؟؟؟ قطعـا ..لا ثم لا ثم لا شئت أيها الجاهل أم أبيت .. قد قال تعالى ( ومن أحسن من الله حكما لقوما يوقنون ) .. أما فعلك هذا وقولك هذا .. فاأنت مثللك كمثل ماذكر الله تعالى ( كمثل الحمار يأخذ أسفارا ) ..<br />وغرضك الخبيث من قولك هذا ظاهر وهو ( تحريض الشعب السعودي على حكومته ) وبئس الفعل مافعلته وبئس القول ماقولته .. ولكن أقول لك نجوم السماء أقرب لك من تحقيق غرضك الدنيء وأسأل الله أن يرد كيدك في نحرك ويشغلك بنفسك …<br />أما بالنسبه للحكم الصادر في قضية فاطمه ..جاءت تفصيلات هذا الحكم في كتاب الله ليبين الله اهمية هذا الحكم ولم يترك تفصيلاتها للسنه المطهرة ممايثبت اهميتها ولولم تكون هذه الاحكام تامه وكامله ومناسبه لكل الازمان لما قال الله تعالى في كتابه بلسان رسوله صلى الله عليه وسلم ((اليوم اكملت لكم دينكم واتممت عليكم نعمتي ورضيت لكم الاسلام دينا)).. أما بالنسبه للحمض النووي فرؤيتي لهذا الأمر .. نحن نحيا في عالم التغير والتحول يتميز بالأنفجار والتسارع المعرفي, وسرعة أنتقال المعلومات في لحظات وجيزه وتفاعل مستمر بين الأطباء والعلماء من جميع البلدان ومن جميع الثقافات وبأجتياز الغلاف الجوي إالى عوالم لم تكن معروفه من قبل , وظهور المشكلات الجديده والمتجدده التي ليس للأنسان حلول سابقه وجاهزه لها ومن هنا للأبداع والأبتكار الأنساني دوره في تشخيص تلك المشاكل وضع الحلول الكثيره لها والتي تتلائم مع تلك التغيرات وقد تكون تلك الحلول صائبه وقد تكون خاطئه ومع ذالك هيه قابله للتغير مع الزمن ومع مرور الوقت ومع ظهور مشكلات أخرى لاتكون مجديه تلك الحلول فوجب تغيرها أو تطويرها وهذا هوواقع الحمض النووي ماهو ألا حل علمي قابل للتغير وقابل لأن يكون صائب وقابل أن يكون خاطيء وقال للتغير وقال للتطوير وقابل لجعله خاطئا وقابل لتبديله بعلم أخر وبأختيار حل أخر غيره .. فلما هالتشنج في المطالبه فيه وماهو ألا علم من نتاج الأنسان (بأذن الله) والأنسان معروف بقصوره ومهما وصل من العلم ومهما تتطور بالعلم فيظل هذا الكون الفسيح يحمل الكثير من الأسرار والعلوم التي يجهلها الأنسان ..قال تعالى (وماأوتيتم من العلم ألا قليلا ) .. وأسأل الله الهدايـه والمغفرهـ للجميع .. وعذرا على الأطاله ولكن الموضوع يستحق التفصيل فيـه .. يالله يـاخــالــق اراضـــيـــن وابـــحـــار<br />الــواحـــد الـمـعـبــود رازق عــبــيــده<br />الـخـالــق الـغـفــار عــــلام الإسرار<br />وفـرق شعـوب الأرض فـي كـل يـده<br />وابدي واسولف من عذيبات الاشعـار<br />أبيات شــعــر والـمـعـانـي وكــيــده<br />اشــري وأبيع واعــرف كـيـف بخـتـار<br />واخـتـار مــن جــزل البـيـوت الفـريـده<br />وذكـرتــراث وعـــز وامـجــاد وافـخــار<br />قـبــائــل تــومـــن بــديـــن وعـقــيــده<br />وصلت حضارتنا على سطـح الاقمـار<br />ابــنــا الـجـزيــر والـجــزيــره مـجــيــده<br />فـي ظـل حكـام لهـم فـعـل واشــوار<br />ال السـعـود الـلـي تـفــك الضـهـيـده<br />نسـل الزعيـم الحـاكـم الـعـادل الـبـار<br />مــجــدد امــجــاد الـجـزيــره بـجــيــده<br />فـي ظـل حكـام لهـم فـعـل واشــوار<br />ال ال سـعـود الـلـي تـفــك الضـهـيـده<br />نسـل الزعيـم الحـاكـم الـعـادل الـبـار<br />مــجــدد امــجــاد الـجـزيــره بـجــيــده<br />حتـى اصبحـت حـره وحنـا لـه انـصـار<br />فـي ظـل اخـو نـوره هنـوف سعـيـده<br />وصـارت لابـو تـركـي بطـولـه وتـذكـار<br />والـفـخـر والامـجــاد تـبـقـى شـهـيـده<br />وخلـف لنـا املـوك لهـم فعـل واخـبـار<br />الـشـعـب واحـــد والـقـيـاده رشـيــده<br />والامـن بانينـه عـلـى ســاس وجــدار<br />وقـرو علـى العابـث عقـوبـه شـديـده<br />وحـنـا حـمـاة الــدار مــن كــل غـــدار<br />ومــا همـنـا بطـشـه وخـبـثـه وكـيــده<br />والـحـمـد لله نـحـمـده ســـر واجـهــار<br />شـعـب تكـاتـف مــن سنـيـن مـديــده"
