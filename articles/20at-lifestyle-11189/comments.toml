text = "السلام عليكم جميعاً,,,,,,,,, ,,,,,,,,,,,,,,, ,,وبعد<br />اكثر الردود تتهم القضاة بالتخلف والرجعية والمزاجية , وهنا أرى من نافلة القول أن من تكلم بهذا القول هو من باب الحماس الغير منظبط والا عقلاني فيم هرب من التكلم عن الواقعة والحدث الي القضاة وكأنهم هم سبب التخلف والرجعية , فمن كان يحكم بكتاب الله وسنة رسوله صلى الله عليه وسلم أهكذا يوصف أين أنتم من حديثه عليه الصلاة والسلام أذا اصاب الحاكم فله اجران واذا أخطاءفله اجر , او كما قال صلى الله عليه وسلم ,<br />متى نتعلم آداب الحوار والنقاش لماذا الهجوم الشرس في الطعن في مثل هذه الأمور للنيل من الاسلام وجعله مادة سهلة لأعداء الدين لجعلها لقمة سائغة للنيل من ديننا بالحكم عليه بالتخلف ,,,,,,, !!!!<br />إخواني لماذا الاستعجال هل تظنون ان المجامع الفقهية لم تبحث مثل هذه المواضيع ؟<br />من يطالب باستخدام الحمض النووي نطالبه بالاثبات بالأدلة القطعية لا الظنية مدى صحته ومدى استخدام جميع العالم لايتخلف احد عن ذلك لهذا الأمر في كل الأحيان<br />الا ترى ان التطعيمات والوقايات التحصينية في كثير من الاحوال لاتجدي<br />ياخي :<br />اعطونا دراسات ابحاث علمية فقهية من مصادر موثوقة أما جعجعة فلا نرضي ان يتكلم في قضاتنا او ديننا الابخير ومن باب التحسين والتطوير<br />وفق الله الجميع ,,,,,,,,,,,,,,, ,,,"
