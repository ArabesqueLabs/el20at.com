text = "قال تعالى في كتابه الكريم بسم الله الرحمن الرحيم( َيا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءكُمْ فَاسِقٌ بِنَبَأٍ فَتَبَيَّنُوا أَن تُصِيبُوا قَوْماً بِجَهَالَةٍ فَتُصْبِحُوا عَلَى مَا فَعَلْتُمْ نَادِمِينَ )الحجرات : 6ولو نوضح هذه الآية الكريمة( يا أيها الذين آمنوا إن جاءكم فاسق بنبأ) خبر (فتبينوا) صدقه من كذبه وفي قراءة فتثبتوا من الثبات (أن تصيبوا قوما) مفعوله أي خشية ذلك (بجهالة) حال من الفاعل أي جاهلين (فتصبحوا) تصيروا (على ما فعلتم) من الخطأ بالقوم (نادمين) وأرسل صلى الله عليه وسلم إليهم بعد عودهم إلى بلادهم خالدا فلم ير فيهم إلا الطاعة والخير فأخبر النبي بذلك…بمعنىيا أيها الذين صدَّقوا الله ورسوله وعملوا بشرعه, إن جاءكم فاسق بخبر فتثبَّتوا من خبره قبل تصديقه ونقله حتى تعرفوا صحته؛ خشية أن تصيبوا قومًا برآء بجناية منكم, فتندموا على ذلكفتصبحون على فعلتكم نادمين انتهى ،،،،أن التكلم في ظهر الغير من أخواننا المسلمين والطعن من ورأيهم والتحدث بالغيبة فيهم هذا والله من إغواء الشيطان إذا لم يكون من أهل الشيطان والعواد بالله منهم فالْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِالحديث فالتكلم وإشهار أمراً وهو ليس على علم به وإسناد بعض الأمور إلي بعض أخوانه بالاتهامات الباطلة ليضر بها أخوانه المسلمين.هذا والله ليس من صفات المسلم الصالح وليس من أهل المسلمين في شي وخارج منهم وهو مع الشيطان إلام يكون هو الشيطان بعينه فأعود بالله منه ومن أعماله الخبيثة قال رسول الله صلى الله عليه وسلم « سِبَابُ الْمُسْلِمِ فُسُوقٌ ، وَقِتَالُهُ كُفْرٌ » فعَنْ عَبْدِ اللَّهِ قَالَ قَالَ رَسُولُ اللَّهِ -صلى الله عليه وسلم- « عَلَيْكُمْ بِالصِّدْقِ فَإِنَّ الصِّدْقَ يَهْدِى إِلَى الْبِرِّ وَإِنَّ الْبِرَّ يَهْدِى إِلَى الْجَنَّةِ وَمَا يَزَالُ الرَّجُلُ يَصْدُقُ وَيَتَحَرَّى الصِّدْقَ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ صِدِّيقًا وَإِيَّاكُمْ وَالْكَذِبَ فَإِنَّ الْكَذِبَ يَهْدِى إِلَى الْفُجُورِ وَإِنَّ الْفُجُورَ يَهْدِى إِلَى النَّارِ وَمَا يَزَالُ الرَّجُلُ يَكْذِبُ وَيَتَحَرَّى الْكَذِبَ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا».وفي حديث آخر بارك الله فيكم إِنَّ مُحَمَّداً -صلى الله عليه وسلم- قَالَ « أَلاَ أُنَبِّئُكُمْ مَا الْعَضْهُ ». قَالَ « هِىَ النَّمِيمَةُ الْقَالَةُ بَيْنَ النَّاسِ ». وَإِنَّ مُحَمَّداً -صلى الله عليه وسلم- قَالَ « إِنَّ الرَّجُلَ يَصْدُقُ حَتَّى يُكْتَبَ صِدِّيقاً وَيَكْذِبُ حَتَّى يُكْتَبَ كَذَّاباً ». فيا أخواني ما أردت في هذا الموضوع هو عدم الإنصياغ وراء الكذاب أو الفاسق والجاهل الذي يأتي بكلام بغرض الطعن بأخيه المسلم بدون دليل أو حجة قد استند عليها فنصبح من القوم النادمين والملومين على تصديقنا وراء الأغوات والأكاذيب الشيطانية من بيني البشر فالكذبُ كالرّمل: يبدو ناعماً عندما نتمدّدُ عليه، وثقيلاً عندما نحملُهُفكم من أخً احتال على الناس وهو ظالمً لنفسه بكذبه لإخوانه ليحتال ويكون فاسقاً جاهلاً بما يقوله وبما لا يعلموكم مسلماً صادقاً قد وقع فريسة لهذا الفاسق الكاذب والجاهل بدون ذنباً افتراه أو عمل به وهو مظلوم …!!وكم أناس صدقوا فاسقاً وكاذباً وهم مصبحين على تصديقهم له نادمينقال تعالى في كتابه الكريم بسم الله الرحمن الرحيم {إنَّ الله لا يَهْدِي مَنْ هُوَ كاذِبٌ كَفَّارٌ}. سورة الزمر، الآية: 3فعلينا أخواني ان لا نتبع الفاسقين الذي يرمون اتهاماتهم جحودا وظلماً على الناس وعلينا ان نصدهم ونوقفهم عند حدودهم الباطلة بدون وجه حق على أخوانهم المسلمين فإذا تجاهلت هذا الفاسق فسوف يأتي لك يوم ويشهد عليك بكلاماً باطلاً أمام الناس بكذبة وأغواه ومكائده المزعومة بالتظليل والكذبأو يكون عليك فاسق أمام الناس وأنت لا تعلم بما يتربص لك ويكيد لك بكذبة وجحوده المغرور فلا يَكْذِبُ المَرْءُ إلاّ مِنْ مَهَانَتِهِ *** أو عادَةِ السُّوءِ أو مِن قِلَّةِ الأَدَبِوشــــك راً ،،،، الله المستعان المفروض الانسان يتأكد بالشهود والأدلة القاطعة ويرجع للكتاب والسنة لكي لا تخرب البيوت"
