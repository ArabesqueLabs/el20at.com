text = "يابنت المملكة تقولين انك ولد المملكة وبعدين تحمدين الله انك سعوديه طيب كلنا نحمد الله على كل حال بس لو تقرأين عندك خطأ في بعض الايات الكريمه فلو سمحتي تقولينها صح بعد الاستغفار وسالفة فاطمة أسال الله العلي العظيم ان اراك يوما قريبا تعيشين نفس وضع امها أساله بوجه العظيم وسلطانه المبين ان كنتي ظلمتي هذه الطفلة ووالدتها ان اراك يوما قريبا في نفس وضعها اللهم ان كنت تعلم بانها ظلمت هذه الطفلة وانت تحرم الظلم على نفسك وحرمته على عبادك اللهم اني صبري قليل وطمعي في كبير بان توفي وعدك الذي وعدت اللهم استجب دعائي اللهم واجعله في اقرب حمل لها اللهم امين اللهم امين اللهم امين سبحانك ربي ان كنت من الظالمين اللهم استجب دعائي الللهم دعوتك ساجده اللهم دعوتك قانته اللهم دعوتك صائمه اللهم دعوتك مظلومه الله استجب دعائي اللهم أطل في عمر والدها وأره الذل بعينه في بناته الذين ايدوه في ظلمه اللهم امين اللهم امين"
