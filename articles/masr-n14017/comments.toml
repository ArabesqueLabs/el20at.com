subject = "كتاب الخفيف فى الحصول على الرغيف"
author = "ها ها ها"
posted = "2008-01-29"
text = "فى عصر الديمخراطية - الخرة - الف احد الوزراء من مزدوجى الجنسية كتاب للفقراء اسمة<br />الخفيف فى الحصول على الرغيف<br />وهذا الكتاب مكون من عشر لقم بتقف فى زور الفقير ونطلع روحة وروح اهلة<br />وهذا الكتاب بيقول للناس كيف تحصل على الرغيف بعد شيل الدعم وبيع اللحم"
archived = "2008-01-30"
capture_url = "https://web.archive.org/web/20080130032615/http://masr.20at.com:80/newArticle.php?sid=14017"
