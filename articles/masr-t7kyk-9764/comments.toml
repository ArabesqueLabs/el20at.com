order = 0
subject = "ميت من زمان"
author = "مش شرشر الدواخلي ولابربر اشرف"
posted = "2008-08-01"
text = "ميت من زمان<br />أو من ميت عام<br />أو من أيام الرومان<br />أو الهكسوس<br />أو أبعد شوية<br />أو من أيام أحمد عدوية<br />أو أحمد عرابى<br />لا من أيام المماليك<br />أو صاحب مدبحة القلعة<br />أو صاحب لولاكى<br />أو صاحب صحبه<br />أو قراقوش<br />يعنى ميت برضه<br />من زمان<br />وموته أصبح موضه<br />أو عادة<br />أو إدمان<br />أو شربه ميه لواحد خرمان<br />واقع من الحراميه<br />اللى سارقين قوته<br />وموكلينه الاونطه<br />علشان تفضل السكينه سرقاه<br />لا طايل يموت<br />أو يعيش<br />تعمل إيه الفلوس<br />لواحد مدبوح<br />عايش حلاوة روح<br />ورايح فى داهيه"
archived = "2010-03-14"
capture_url = ""
