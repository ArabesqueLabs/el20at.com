subject = "الى الحمار اللي فوق"
text = "ما هو انت علشان خاطر حمار قلت الكلمتين دول<br />الصحفي المتمكن يا حمار بيكتب على حسب طلب الجريدة اللي هو بيكتب فيها<br />هو دا اللي طالباه عشرينات<br />لان عشرينات موقع خفيف وعايز لغة واسلوب خفيف وسهل يا خفيف<br />وبعدين ورينا شطارة اهلك<br />يلا اكتب انت عن عيد الام وورينا اسلوب حضرتك يا فظيع"
archived = "2009-04-07"
