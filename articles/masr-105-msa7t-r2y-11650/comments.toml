[[comments]]
order = 31
subject = "أمي الحبيبة"
text = "أمي ياأغلى وأجمل كلمة نطقت بها لساني<br />أمي ياأغلى حب سكن قلبي<br />يامن تعبت من أجل راحتي<br />وتحملت كل الصعاب لتحقيق رغباتي<br />اليوم أفتقدك وأنتِ بعيدة عني<br />اليوم فقط احسست بك وبمشاعرك<br />أمي ياحبي وياأملي من لي غيرك<br />وحشتيني ... وحشتيني<br />أحبك أمي .. أحبك<br />لا اقدر أن أقدم لامي الا هذه الكلمات البسيطة ..<br />والدعاء لله أن يغفر لها كل الذنوب ويدخله فسيح جنانه"
archived = "2009-04-07"
