[[comments]]
order = 41
subject = "أهدي هذه ألابيات أى أمي الغالية"
text = "أهدي هذه ألابيات أى أمي الغالية<br />لماذا إلى حضن إمي أرد ............. إذا ضاع سعي وأخفق كد<br />أما زلت طفلا أم الامُ تبقى ................. ملاذ أخيرا إذا جد جد<br />حنانك أمي فأني تعبت ................. ومن ناظريك القوي أستمد<br />خذيني اليك ولا تسأليني .................. لماذا ؟؟لأن السؤال يهد<br />وحين تضمين رأسي سأبكي .......... فحزني شديد وصبري أشد<br />بربك لا تسأليني لماذا ........................ فأسباب همي أنا لا تعد<br />تعلمت منك الرضى بالقضاء .................. إذا ما أتانا بما لا نود<br />شحذت على صخرة الصبر سيفي ......... ولكن سيف القضاء أحد<br />أُصبت بأكثر من ألف جرح ............... وكنت لأبواب ضعفي أسد<br />وما قلت آه أذا جد جرح"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 42
subject = "أمي الغالية أمي الحبيبة"
text = "أمي الغالية أمي الحبيبة<br />ومن أغلى من الأم في الدنيا<br />أكبر وأنا عند أمي صغير، وأشيب وأنا لديها طفل، هي الوحيدة التي نزفت من أجلي<br />دموعها ولبنها ودمها، نسيني الناس إلا أمي، عقَّني الكل إلا أمي، تغيَّر عليَّ العالم إلا<br />أمي، الله يا أمي: كم غسلتِ خدودكِ بالدموع حينما سافرتُ! وكم عفتِ المنام يوم غبتُ!<br />وكم ودَّعتِ الرُّقاد يوم مرضتُ! الله يا أمي: إذا جئتُ من السفر وقفتِ بالباب تنظرين<br />والعيون تدمع فرحاً، وإذا خرجتُ من البيت وقفتِ تودعينني بقلب يقطر أسى، الله يا أمي:<br />حملتِـني بين الضلوع أيام الآلام والأوجاع، ووضعتِـني مع آهاتك وزفراتك، وضممتِـني<br />بقبلاتك وبسماتك، الله يا أمي: لا تنامين أبداً حتى يزور النوم جفني، ولا ترتاحين أبداً حتى<br />يحل السرور علي، إذا ابتسمتُ ضحكتِ ولا تدرين ما السبب، وإذا تكدّرتُ بكيتِ ولا تعلمين<br />ما الخبر، تعذرينني قبل أن أخطئ، وتعفين عني قبل أن أتوب، وتسامحينني قبل أن<br />أعتذر، الله يا أمي: من مدحني صدقتِه ولو جعلني إمام الأنام وبدر التمام، ومن ذمني<br />كذبتِه ولو شهد له العدول وزكَّاه الثقات، أبداً أنتِ الوحيدة المشغولة بأمري، وأنتِ الفريدة<br />المهمومة بي، الله يا أمي: أنا قضيّتك الكبرى، وقصتكِ الجميلة، وأمنيتك العذبة، تُحسنين<br />إليّ وتعتذرين من التقصير، وتذوبين عليّ شوقاً وتريدين المزيد، يا أمي: ليتني أغسلُ<br />بدموع الوفاء قدميكِ، وأحمل في مهرجان الحياة نعليك، يا أمي: ليت الموت يتخطاكِ إليَّ،<br />وليت البأس إذا قصدكِ يقع عليَّ:<br />نفسي تحدثني بأنك متلفي روحي فداك عرفت أم لم تعرفِ يا أمي كيف أردّ الجميل لكِ<br />بعدما جعلتِ بطنكِ لي وعاء، وثديك لي سقاء، وحضنكِ لي غطاء؟ كيف أقابل إحسانكِ<br />وقد شاب رأسكِ في سبيل إسعادي، ورقَّ عظمكِ من أجل راحتي، واحدودب ظهركِ<br />لأنعم بحياتي؟ كيف أكافئ دموعكِ الصادقة التي سالت سخيّة على خدّيكِ مرة حزناً<br />عليَّ، ومرة فرحاً بي؛ لأنك تبكين في سرّائي وضرّائي؟ يا أمي أنظر إلى وجهكِ وكأنه<br />ورقة مصحف وقد كتب فيه الدهر قصة المعاناة من أجلي، ورواية الجهد والمشقة<br />بسببـي، يا أمي أنا كلي خجل وحياء، إذا نظرت إليك وأنت في سلّم الشيخوخة، وأنا في<br />عنفوان الشباب، تدبين على الأرض دبيباً وأنا أثبُ وثباً، يا أمي أنتِ الوحيدة في العالم<br />التي وفت معي يوم خذلني الأصدقاء، وخانني الأوفياء، وغدر بي الأصفياء، ووقفتِ معي<br />بقلبك الحنون، بدموعكِ الساخنة، بآهاتكِ الحارة، بزفراتكِ الملتهبة، تضمين، تقبّلين،<br />تضمّدين، تواسين، تعزّين، تسلّين، تشاركين، تدْعين، يا أمي أنظر إليك وكلي رهبة، وأنا<br />أنظر السنوات قد أضعفت كيانكِ، وهدّت أركانكِ، فأتذكر كم من ضمةٍ لكِ وقبلة ودمعة<br />وزفرة وخطوة جُدتِ بها لي طائعةً راضيةً لا تطلبين عليها أجراً ولا شكراً، وإنما سخوتِ بها<br />حبّاً وكرماً، أنظر إليك الآن وأنتِ تودعين الحياة وأنا أستقبلها، وتنهين العمر وأنا أبتدئه فأقف<br />عاجزاً عن إعادة شبابك الذي سكبتِه في شبابي وإرجاع قوّتكِ التي صببتِها في قوّتي،<br />أعضائي صُنِعت من لبنكِ، ولحمي نُسج من لحمكِ، وخدّي غُسِل بدموعكِ، ورأسي نبت<br />بقبلاتكِ، ونجاحي تم بدعائك، أرى جميلك يطوّقني فأجلس أمامك خادماً صغيراً لا أذكر<br />انتصاراتي ولا تفوقي ولا إبداعي ولا موهبتي عندك؛ لأنها من بعض عطاياكِ لي، أشعرُ<br />بمكانتي بين الناس، وبمنـزلتي عند الأصدقاء، وبقيمتي لدى الغير، ولكن إذا جثوتُ عند<br />أقدامكِ فأنا طفلكِ الصغير، وابنكِ المدلّل، فأصبح صفراً يملأني الخجل ويعتريني الوجل،<br />فألغي الألقاب وأحذف الشهرة، وأشطب على المال، وأنسى المدائح؛ لأنك أم وأنا ابن،<br />ولأنك سيّدة وأنا خادم، ولأنك مدرسة وأنا تلميذ، ولأنكِ شجرة وأنا ثمرة، ولأنكِ كل شيء<br />في حياتي، فائذني لي بتقبيل قدميكِ، والفضل لكِ يوم تواضعتِ وسمحتِ لشفتي أن<br />تمسح التراب عن أقدامكِ. ربِّ اغفر لوالدي وارحمهما كما ربّياني صغيراً."
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 43
subject = "أمي العظيمة"
author = "adelal_kasyonan@yahoo.com"
text = "أمي العظيمة<br />اماه كيف تركتينى وحدى فى بيداء الحياة وحدى اهيم بلا رفيق كى اسير على خطاه<br />اماه رحلت والقلب الحزين اليك ضامى ابدا يتوق الى الحنان فلا ارى غير الاوهام<br />اماه لو رد البكاء الى الحياة الذاهبين لأذ بت روحى بألبكاء وبالتوجع والأنين<br />ظمأى احن اليك دوما فى سلوتى فى كلامى وبيقضتى طيف الامومة لايفارقنى امامى<br />ويظل وجهك باسما حلوا\" يؤرقه الحنين انا كيف حالى فانظرى لتوجعى لو تسألين<br />يا أم قد قست الحياة على ولدك فأنظريه شبحا يسير الى الزوال ودمعة فى ناظريه<br />لو عشت لى اماه ما كانت تؤرقنى الليالى ولو ارتويت من الحنان لكان حالى غير حالى<br />لا لن ابوح لغير قلبك ما ألاقى من عذاب أحيا وما نفع الحياة مضت كأطياف السراب<br />زورينى يوما فى المنام لعلها تشفى جروحى ولعلنى ان بحت بالشكوى اليك فما تبوحى"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 44
subject = "آه يا أمي"
author = "أشجان الغربه"
text = "إلى من علمتني ابجديات الحياة واغدقتني بحبها وحنانها حتى اشبعتني بعاطفة وددت لو انني اكون مثلك كالنحلة التي تنقل الحب والحنان من وردة لأخرى متنقلة بين بساتين كلها نقاء وصفاء وصبر ووفاء.. لا مكان فيه لحقد وكراهية وجفاء!<br />إليك يا مهجة القلب دون غيرك من الناس اسطر حروفاً من نور.. حروفاً كلها فخر وزهو بك.<br />يا من ألجأ إليها في ضيقتي بعد الله.. وارتمي بين ذراعيها إذا وهنت حيلتي بلا خجل وكأنني طفلتك المدللة كما في الأيام الخوالي.<br />انتِ دون غيرك من الناس كنت معلمتي فلا زلت استقي من نصائحك العظيمة التي هي نبراسي في الحياة.<br />كنت عندما يضيق بي الوجود واتيه في طرقات الحياة وتنطفئ أنوار طريقي ألجأ إليك بعد الله واقترب منك يا سراجي يا من انستي وحدتي وظلامي..<br />لازلت يا حبيبة الروح مثلي الأعلى.. لازلت أروع وأحلى نساء الدنيا.. حتى وان غزتك تلك الخطوط التي زينت وجهك الطاهر الذي وان غزته جيوش الكبر كالبدر المنير الذي أنار حياتي وحياة من ينعمون بقربك.<br />يمه كبرتي صرتي أزين من العام يا زين تجاعيد الزمن في يديك.<br />لازلت اذكر كلماتك الحكيمة (يمكنمك فعل الكثير لجعل حياتك الجديدة أحلى وأروع حياة.. فنحن لا نحيا إلا مرة واحدة فعلاً ما الحزن؟؟ اسعدي نفسك ولا تربطي سعادتك بالآخرين.. تعلمي ان تتواصلي مع الآخرين بحب واحترام). كنت دائماً أردد لك يا نور أيامي (انت يا نبض قلبي دون غيرك من الناس بإمكاني ان اطلعك على سري حتى وان عظم ذنبه)!"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 45
subject = "الله يرحمك يا امي"
author = "غرور سمرة"
text = "اليوم راح شهر من وفاتها..<br />اليوم راح الفرح مع وفاتها..<br />اليوم راح النوم من عيني من بعد وفاتها..<br />اليوم اه على اليوم..<br />اليوم اصبحت مريضه من وفاتها..<br />اليوم ضاع الامل من حياتي لوفاتها..<br />اليوم وكل يوم هي في بالي وعقلي وحياتي بالرغم من وفاتها..<br />اليوم وكل يوم يجيني في منامي يوم وفاتها..<br />كيف انساها وهي الام الحنونة والاخت الرؤوفه والصديقة المخلصة..<br />مستحيل انساها او انسى وفاتها..<br />الله يجمعني فيها في جنات الخلود..<br />اللهم امين.."
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 46
subject = "اهداء الى امي الحبيبه"
author = "غلا"
text = "اهداء الى امي الحبيبه<br />اكتب لك اجمل كلمات معطره باريج من الورد والياسمين والزهر<br />اليك يااغلى من الورد اليك يااجمل من الخلق اليك اجمل ابتسامه احملها لك ياطير الزاجل<br />~&~ احبك واحب قلبك الطيب احبك واحب ابتسامتك الجميله لم تبتسم واحب عينك لما نتاظرني~&~<br />~&~ آه لو قلبي يخطها بقلبي لما بقي جروماً ومابقيت اوراق لكني لم استطيع اكتب حبك على اوراق حبك سهم اصاب اعماقي اصاب تفكري اصابني بكل مااملك~&~<br />~&~عندما ماالقاك ياامي تصفو نفسي وتعذب روحي ويذوب مابداخلي محيط من الكدر وترقص نفسي رقصة نشوان هذا عزف الوتر وتسمر روحي عاليا وتحلق في سماء القمر وتزول الالام التي اورقها انين السهر كأني نبات ذابل احياه هطول المطر والبهاءيتألف في عيني راقصاً كأغصان الشجر ~&~<br />~&~ وعندما ألقاك يزول كل دمع انهمر واكشف عن صرخا في بأسم لايتوخى الحذر ~&~<br />(( وعندما ألقاك ارى الدنيا في احلى الصور حتى القبيح في عين الناس اراه في عيني جميل انني اهيم فيك عشقاً واذوب فيك حباً ))<br />~&~ انت زهر فاقت كل الزهور ........... انت شمعه يشع منك النور.............. انت ازكى من كل العطور ............ انت من انابلك فخور .........انت وسط قلبي البهجة والسرور .................لاجلك تعلمت الكتابة على السطور.........~&~<br />أمي<br />سامحيني لوكان هناك اكثر من الحب لأهديته لكي<br />لكن يكفيكي فخراَ ان الجنه تحت أقدامك<br />سلام من الله يرعاك وعين الله تحماك وإن غاب النظر عنك القلب لن ينساك"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

