subject = "رحمة الله عليكي يا امي"
text = "تصدقون من ماتت أمي ما عرفتك يا لهناء<br />تصدقون من ماتت أمي عيشتي صارت ضنا<br />واليوم جــــــاوزت أربعين والحـــــــزن باقي<br />والحنين وأحس عايش في خـــــــــــــــــــــلا<br />لو أنتحي محـــــــــــــــــــــد فــــزع<br />لو اشتكـــــــي محــــــــــــــــــــــــــــــــــد درا<br />مشـــــــــــتاق أنــــــــــــام بحضنــــــــــها<br />وارجـــــــــــــــــع بأحــــــــــــــــلامي ورا<br />واذكـــــــــــــر ليـــــــــــــالي الزمـــهريـر<br />وأنـــا صغير وبحضنــــــــــــها الــقي دفا<br />وان ســـــولفت رديت على الجــــــــنب اليمين<br />وألصــقت وجــهي بصـــدرها حـــــــــب وفا<br />كانت تحكيني عن الآم الســـنين وبحشرجة<br />صوت حــزين وتنـــهدت وأحيان نتنهد سوا<br />كانت تقـــــــــول إني يتيمـــــــة من زمان<br />واضحــــــــك وأســــــال با زدراء ؟<br />يا ميمــــــــــــتى أنتــــــي كبيرة والكبير<br />ماهــــــــــو يتيم وهــــــذا قضـــــــــــــا<br />واليوم أعيش إحساسها دار الزمن بكأسها<br />واسقاني أحزان اليتيم وشربتها بليا رضا<br />وأحــــــــــــــــــس أنــــــا باقي يتيم<br />رغم السنين..والعمر ولي وانقضا<br />تصدقون المشكلة ما هي فراق اللي تحب<br />المـــــــــــوت حق والدهر عمره ما صفا<br />المشكلة ذيك الجنان التي تحت أقدامها<br />بغيابهـــــــــا غــابت و وراهــــا الثرى<br />وذاك الدعاء اللي كان يرسم لي أمل<br />ما ينقطع صـــــــــبح ومســـــــــــاء<br />كانت أموري ميسرة كانت دروبي مسرجه<br />كان الزمان يطيعني واليوم ينظر لي بجفا<br />عشان أنا عايش يتيم وفاقد الحب والحنين<br />صار الزمان يضدني كني مناصبه العدا<br />حنانها ماله مثيل وحبها ماله بديل<br />حب فطرة الله من عالي سما<br />وارجع وأقول رغم السنين أحس<br />أنا عايش يتيم لكني عايش في رجا"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 36
subject = "أمي ........ هذي ذكري فراقك"
text = "أمي ........ هذي ذكري فراقك<br />منذ زمن لم أراكي..........<br />كان صوتك كل صباح يوقظ أحلامي ..<br />وبلمسة علي وجنتي من عبير يداكي ...<br />تملأ روحي وقلبي بنسيم هواكي ....<br />أمي هذي كلماتي .......<br />نبعت من قلب هواكي...<br />من طفلاتربىبحنانكي ...<br />من أغنية تزدهر بشفاكي..<br />صوتك يدفيء أحلامي ..<br />أمي أمي يا من حملت ألامي ..<br />لم تبكي عيني علي فراق ..<br />ولم ينكسر قلبي أبدا علي غياب..<br />سوا فراق عيناكي ...<br />وغياب هواكي ...<br />أمي أمي حلمي أن ألقاكي..<br />وحتي ذلك أتمني رضاكي .......<br />رأيتك تسقطين أمامي ...<br />فغطت أحزاني روحي..<br />عشت أتمني سنين حياتي ..<br />أن تعودي يوما .. ولو لثواني<br />أمي أمي يا حلم ..يازهرة .. يا ألم ..<br />يا حلم أضاء حياتي ..<br />رغم غيابه عن واقعي ..<br />يا حلم عشت أنتظره<br />كما إنتظرت أن تعود أيامي...<br />يا زهرة في بستان ألامي ..<br />بعبيرها الفواح غطت أحزاني...<br />يا زهرة عاشت تسقي بدموعي ...<br />وربيت بين أحضاني.......<br />يا ألم أشكو منه ولكن....<br />ببعده تنطفأ أنواري ....<br />ببعده تنطفأ أنواري .........<br />أمي أمي<br />لم تنتهي كلماتي ولن تنتهي كلماتي<br />يا ليت الكلام يعيد مراكي ..<br />لكنت كتبت علي ورق الأشجار ..<br />وما أكفاني الحبر بحار......<br />لكنت كتبت ليلا نهار ...<br />أخيرا ..أخيرا ..... ككل حكاية مسااااااء<br />يظهر القمر في السماااء ......<br />ويبل ورقي بدمع عيني ....<br />أمي تأكدي أكن لكي حبي ...<br />ولكي وحدكي هواي ....<br />أمي أمي أمي ............"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 37
subject = "اسف يا امي"
text = "من الجميل أن يكون لديك مرسيدس ومن الرائع أن تكون لديك فيلا عظيمة وزوج وأموال لا حصرلها ولكن الأجمل من هذه كله أن تكون لديك أم تقبلها كل صباح فتقول : الله يرضى عليك يا بنتي ..<br />يخجل الكثير من الأبناء من أمهاتهم ويحسون بالخزي وهم يمشون معها إو يأخذونها إلى مكان ما وعلى العكس تماما تفتخر الأم عندما يأخذها ولدها إلى السوق أو إلى بيت أحد الأقارب … فعلا ما أروع الأمهات وما أقسى الأبناء ..<br />قبل أن تزوجي ابنتك لأحد الشباب المتقدمين لطلب يدها<br />لا تسأل عن أخلاقه ودينه وأصله وماله ووظيفته فقط .. لا تنسى سؤالا مهماً هو : كيف يعامل الولد أمه وأبوه ؟!<br />كل واحد يفكر في إرسال هدية لزوجته أو لصديقة عزيزة الله يخلي المصلحة ولكن هل يفكر أحدنا بمفاجأة أمه بهدية ؟!<br />ربما لا تعرف حجم الحب الذي يكنه قلب أمك لك ولكن عندما تتزوجين وتنجبي الأبناء ستعرفي مقدار الحب الذي يكنه الأمهات لأبنائهم وإذا لم تحسيس بعد ذلك بمقدار الحب الذي أحدثك عنه الآن فتأكدي يا عزيزتي بأن قلبك هو مجرد صخرة صماء !….<br />كل شيء يعوض في هذه الدنيا ، أبنائك ستنجبين غيرهم ، أموالك ستجمع غيرها ولكن أمك هي الشيء الوحيد الذي إذا ذهب لا يعود أبدا !!<br />بعض الأبناء يعتقدون أن الأم مجرد خادمة تطبخ وتنظف وتوقظ في الصباح ، ولكن الفرق الوحيد بينها وبين الخادمة هو أن الخادمة تأخذ راتبا والأم تعمل ليلا ونهارا وببــــلاش!!<br />بعض الأبناء لم يعرفوا قيمة أمهاتهم بعد كما أنهم لن يعرفوا إلا عندما تأتي زوجة الأب أو تنتقل روح أمهم إلى عنان السماء !<br />والآن اسألي نفسك …<br />كم واحدة منا تقبل يد أمها؟ وكم واحدة منا تقبل رأسها؟ وكم واحدة منا تكلمها باحترام وأدب ؟.. لو نظرت كل واحدة منا إلى أسلوب تعاملها مع أمها لوجدت نفسها وجاحدة ومجرمة .. كم هو حقير هذا الإنسان !<br />يشهد التاريخ أن كل من عاق أمه لم يرَ الخير والسعادة في حياته ، كما يشهد التاريخ أن كل من أساء إلى أمه أساء إليه أبنائه ، ويشهد التاريخ أن الأم هي صاحبة أعظم جميل يتلقاه الإنسان كما يشهد بأنها تتلقى أعظم جحود يتوقعه البشر على مر التاريخ !!<br />يقول أحمد شوقي إن الأم مدرسة ويقول بعض الأبناء أن الأم مؤسسة نظافة وخدمات عامة !<br />بعد وفاة الأم وهداية الأبناء يتمنى كل عاق أن تخرج أمه رأسها من قبرها ليقبلها ويقول لها : أمـــاه … سامحيني !!<br />أجمل رائحة هي رائحة الأمهات دهن عود وأول حب هو حب الأم وأحلى ذكرى هي قبلة من شفاه الأم وأطيب لمسة هي مسحة حانية من يديها العطوفتين !<br />أن تفقد والدك فالأمر محزن ومبكي ولكن أن تفقد والدتك فالأمر عاصف ومميت!"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 38
subject = "أمــــــــــي"
text = "أمــــــــــي<br />امي يارمز التفاني والصبر<br />ملحمه عشتي لنا كلك عبر<br />تسعة شهور حملتيني بوهن<br />شفتي ألوان العذاب بكل شهر<br />وبليلة الميلاد كانت فرحتك<br />في مهادي كنت انا لك يانهر<br />انتي ضميتيني في حضنك دفا<br />عن لهيب الصيف أو برد الدهر<br />تكبرين ونكبر احنا بدنيتك<br />كل شيبه في شعر راسك فخر<br />ان بكت عيني بكت عينك اسى<br />وان ضحك سني ضحكتيلي عمر<br />وان طلبتك حاجتن كلك عطا<br />انتي اكرم من على الدنيا ظهر<br />امي يانبع الوفا الله يديم<br />طلتك في ليلنا وانتي القمر<br />في صلاتك ياكثر ماتطلبين<br />ربي يحفظنا من عيون البشر<br />صرتي شمعه تحترق لجلي انا<br />اهتدي فيها اذا طال السفر<br />وعند باب البيت ياما تحترين<br />ان تأخرت بظروفي واعتذر<br />ياحبيبة قلبي يايمه انا<br />ايه ابوس تراب رجلك وافتخر<br />ارفعي راسك مدام اني قدرت<br />لك احقق امنياتك واختصر<br />فاخري فيني يايمه بينهم<br />جعل يفدونك قليلين القدر<br />ياحكاية عز سطرها الزمان<br />كل حرف فيها من دمعك سطر<br />رفرفي يابيرق الحب التليد<br />واقطفي من كل بستاني زهر<br />جعلي لاحجيت للبيت العتيق<br />يقبل الله دعوتي لج معتمر<br />ياسنا الفضه ولمعات الذهب<br />يارحيق المسك ياغيث المطر<br />يا أمان الروح يارجوى النفوس<br />ياشراعي لاانتشى موج الخطر<br />صعب يوصف لك شعوري كم بيت<br />قالهن قلبي بحبك بالشعر<br />بس شوفي يمه لامني طريت<br />اسمك دموعي بخدي تنتثر<br />الشاعر عايد المسيلم"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

