order = 32
subject = "كلمات كتبتها من حر دمعي إلي أمي الغالية"
author = "مش رضوى حسن ولا مروى صلاح/ منقول"
text = "كلمات كتبتها من حر دمعي إلي أمي الغالية<br />ياروحي الغالية .. كم أشتاق لكِ .. كم أحتاجك يـأمي .. كم أحتاج إلي دفئك يـأمي .. أمي من لي سواك في هذه الحياة .. لا توجد في العالم وسادة أنعم من حضن الأم .. ولا وردة أجمل من ثغرها .. كم تمنيت أن اكون حبة رمل تدوسها رجلاك لتنعم بنعومتها .. كم تمنيت أن اكون نسمة هواء .. لتمر بوجهك النضر .. كم تمنيت أن أكون زهرةً في حقل .. لتلامس أنفك العطر .. أنتِ الماء الذي به أشرب .. أنتِ الأبتسامة التي بها أعيش .. أنتِ القلب الذي به أحيا .. أنتِ الروح التي بها أكون .. أمي أنتِ اليد الحانية التي تمسح دموعي .. أمي أنتِ البسمة التي ارتسمت علي وجهي<br />أمي مالي أري السطور تحمر كلما رأتك .. والكلمات تغمض عينيها عند محياك .. والأحرف تنزف عرقاً حتي تصير جافة بلا معني<br />أمي .. ياروحي الغالية .. كم أشتاق لكِ .. كم أحتاجك يـأمي .. كم أحتاج إلي دفئك يـأمي .. أمي من لي سواك في هذه الحياة .. معك كنت أحمل العالم كله بين يدي .. وكانت رمال الصحاري وأشجار البراري تشهد بحبي .. في كل يوم انتظر ذلك النور البعيد لعلي أجد فيه راحة أو سكينة بعدك .. نعم أحبك وسأظل أحبك .. كيف لي أن أنساكي وقد عشقت وجوودك .. كيف لي أن أنساكي وقد تعلق قلبي بصفاء رووحك .. ورقة عبراتك .. كيف لي بالله كيف ؟ .. نعم حائرة هي كلماتي حائرة في وصف شوقي لكِ وحنيني .. لعلي بصبري وقوة حبي يـأمي القاكي .. لا يهمني المكان ولا الزمان .. كل ما يشغل بالي هو نور حبك يانور الكون في عيني<br />أعرف يـأمي .. كم أنا عزيز علي قلبك .. وأعرف أن عينيك لا تغمضان .. قبل أن استسلم لسلطان النوم .. وإذا لم آتِ في الميعاد .. تبحثين عني في كل الطرقات .. وتقرعين كل الأبواب .. وتحققين مع كل الرفاق .. كي تخطفي ولو خبراً بسيطاً عن مكاني .. لعل مساحات قلبك غُمرت بأسمي .. وصورتي .. لعلك يأمي .. تجف عروقك الخضراء .. إن أنا غبت<br />تُميزين صوتي وصورتي .. من بين ملايين الوجوه ولغط الأصوات<br />تُميزين وقع خطواتي علي صدر الأرض .. تتعرفين علي أنفاسي المبعثرة في الهواء<br />مهما كبرت يـأمي في نظر العالم .. أظل طفلاً في عينيك<br />لو كان الماضي يعود ياأماه .. لأبحرت أغترف من حنانك السرمدي .. لو سحقت الجبال وجُبت البحار .. ونصبتُك ملكة الزمان .. لن أقدر أن أرد اليكِ قُبلةً طبعتيها علي طريق حياتي<br />في هدأة الليل .. في غمرة السكون .. في الوجوه العابرة الشاحبة .. في هذا العالم البارد المسكون .. أفتش عن وجه أول أمرأةٍ أحببتها .. تيقظت عيوني ومشاعري .. علي وجهها الملائكي .. وترعرع احساسي بالجمال وأنا بين يديها .. دمعات وقبلات علي اليد الحانية<br />أسير يـأمي .. علي رصيف الغربة .. وأود لو أجد بسمة من فمك .. أو بصمة من ظلك .. أبيع نفسي والعالم .. ولا أشتري غير ودك .. فكيف يـأمي أجدك .. قبل أن تجدني أمراة غيرك ؟ .. فتضم عظامي قبلك اليها .. حنانيك أمي .. حناينك .. ضميني مرةً ثانية إليكِ .. أرجعيني لحضنك طفلاً حديث الولادة .. أغسلي قلبي بينابيع طُهرك .. أضيئيني قنديلاً بدعائك وصلاتك .. وقت العبادة .. وكيف يـأمي الليلة أنام ؟ .. ويدك كانت غطائي ووسادتي .. والسهد منذ أن رحلت .. نام في عيوني .. دام في جفوني .. والشوق ما عاد ينام .. وأسأل نفسي .. هل حقاً أنا في الحضارة ؟ .. ووجهك كان في حياتي .. كل الحضارة !! .. فكيف دونك هنا الحضارة ؟ .. وأنا قارب أبحر بعيداً عن شاطئك .. وما أجد اليوم المنارة !! .. بلغي أمي السلام عني .. قبلي أمي عني<br />هاهو ما كنت أهرب منه يأتي .. أن أقف وجهاً لوجه مع ورقٍ هو لكِ .. وتقاسيم لا تعترف بسواك .. آهٍ يـأمي .. كم أحبك .. ولست تعلمين .. ويارائحة الجنة الموعودة .. وياطيور الفجر .. وكأس الماء البارد .. ياندي الصباح .. ياضؤ الشمس بعد اكتحال السماء .. أحبك .. وأستغرب كيف فقدت لغة الحب في حرفي !! .. كيف فقدتها في ملامحي .. كلماتي .. لمسات يدي<br />متي تعلمت القسوة معكِ ؟ .. وأنتِ الأقرب .. متي تعودت الجفاء ؟ .. وأنتِ الأحن .. آهٍ يـأمي .. ياعبق دهون العود .. من يغفر لي هجري .. وأنتِ أعظم من يغفر علي وجه الأرض .. وتغفرين كعادتك .. ولكني لم أعد أملك العفو .. ولا المغفرة .. حتي لنفسي<br />فبم أعاقبني علي عمر مضي دونك ؟ بمَ ..؟ ولا عقاب يشفي .. لا عقاب يكفي<br />أحسست أنني أراكي علي بعد المسافة .. وعينك بيني كالسحر تطفي النظرات .. لو تري بسمتها تغطي علي كل البسمااااات .. ففي عيني الدموع وكأنها تتكلم بالحسرات .. وتشكو فراقي وتتمني الرجوع لتقول معاني حبي وتوقفت يداي عن الكتابات .. واستحي مدحي لأنه لم يوفي حق أحسن الأمهات<br />إليكِ عبراتي فليتني ألقاكي وأحكي عن حياتي حكايات .. فياليتني لم أقسو لثانية عليكي فهاك مني اعتذار وآهااات .. ليتني أعود فتسامحيني فأنتِ مصيري بأعلي الجنات .. ودعتكي علي فراش موتي فأعذريني بتلك الخطيئات .. ياخير أم أوجدتني في الدنيا وخلقني ربي منكِ بالقسمات<br />لعلكي تبكي عليا فلا تبالي فعند ربي أعظم الرحمات .. فدفئي قلب بدعاءكي لي إن كان لي قلب بعد ذلك الممات .. واذكريني عند أهلي وأخوتي لا تنسني فإن في القبر ظلمات .. ياتري من تفقدني ومن قال كان ومن ترحم علي بالدعوات .. هذه رسالتي اليكِ وصيتي إني أخاف الحساب وأخاف العقبات<br />فأسلكي درب الهداية ولا تحزني سألقاكي غداً عند ربي إليك مني سلامات<br />وفي ظلمة الليل يأماه لا تنسيني من صالح الدعوات<br />الملتقي الجنة"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 33
subject = "الى امي الغاليه التي ليس لها مثيل بهذا العالم"
text = "الى امي الغاليه التي ليس لها مثيل بهذا العالم<br />أمي العزيزه كم أحبك حب لا تتصورينه<br />وكيف لا احبك كل هذا الحب وانتي أول حب طرق باب قلبي<br />أمي يا جوهره حياتي ياما وجدتك معي في كل لحظاتي سواء بالسراء او الضراء<br />لا انسى دموع فرحك لتخرجي ولا انسى دموع حزنك من شده خوفك علي<br />كم احب ابتسامتك التي هي أول حدودي وآخرها في زماني كله<br />ياترى كيف لي ان اجازيك على حنانك وحبك واخلاصك وصبرك علي طول هذه السنين<br />ياما وجدتك تضميني الى صدرك الحنون والغالي من قبل أن اخرج وبعد ما أقبل عليكي<br />اعتز وافتخر بأنني ابنتك يا أمي<br />اطلبي وتمني ما تشتهينه في هذا الزمن فالغالي يرخص لأجل رمشه عينك يا اغلى ما في هذا الوجود<br />يا امي التي علمتني كيف تكون الدنيا جميله حينما تشاركني في أيام عمري<br />مضت علي سنين وانا لم افارقك ولم افارق عينك التي كم اهواها حينما اراه مبتسمه وكم أتألم حينما ارى الدموع تتخللها<br />كل يوم تشرق به الشمس من جديد وافتح عيني لهذا اليوم اقول في نفسي اتمنى بأن تكون امي صاحيه لكي اراها<br />وكم اتضايق حينما ادخل البيت وانادي عليكي ولا اجدك موجوده فيه<br />اركض بسرعه وامسك الهاتف واسألك اين انتي ومتى سوف تعودين<br />وبعد دقائق اسمع صوت اغلاق الباب اركض متوجه الى الباب لكي اراك وأحكي معك عن ماذا فعلته في هذا اليوم من عمري<br />وأجدك ترشدينني وتنبهينني عن تصرف أخطأت به سواء في حياتي او مع تعاملي مع شخص<br />يا امي يا أول حكايه عشتها في عمري وحياتي<br />كم افتخر بأنك موجوده مابين اسطر دفتر حياتي<br />وكم ملأتي بالكلمات العذبه دفتر حياتي لا ولن افكر بأن اطوي صفحتك من حياتي كما فعلت مع بعض من الناس<br />صدقيني يا امي مع انني لم ارى منك الا الخير لكن حتى ولو رأيت منك جروح وعذاب لن اطوي صفحتك<br />فأنتي امي وفضلك علي الكثير .. قولي لي من كان بجانبي في فرحي وحزني غيرك . ومن كان معي في مرضي وصحتي غيرك ؟<br />يا أغلى ما أملك بهذه الدنيا يا امي لا اطلب منك الا شيء واحد في هذا العالم الكبير وهو رضاك عني<br />يا امي انتي سندي في هذه الحياة وهمتي ربي لا يحرمني منك ولا يبعدني عنك<br />ادعو ربي في كل صلاة بأن لا يحرمني منك واطلب رضاك بكل دقه قلب يدقها قلبي<br />يا معنى للوفاء والاخلاص يا امي وفي نهايه كلامي اود ان اقول لك بأنني لم ولن اوفي بكلامي عنك يا غاليتي"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
order = 34
subject = "لا تبخل على والدتك بقراءة هذا الدعاء"
text = "وقضى ربك ألا تعبدوا إلا إياه وبالوالدين إحسانا اللهم يا ذا الجلال<br />والإكرام يا حي يا قيوم ندعوك باسمك الأعظم الذي إذا دعيت به أجبت! ! ! ، أن<br />>تبسط على والدتي من بركاتك ورحمتك ورزقك<br />اللهم ألبسها العافية حتى تهنئا بالمعيشة واختم لها بالمغفره حتى لا تضرها<br />الذنوب , اللهم اكفيها كل هول دون الجنة حتى تبلغها إياها .. برحمتك يا أرحم<br />الراحمين ...<br />اللهم لا تجعل لها ذنبا إلا غفرته ، ولا هما إلا فرجته ، ولا حاجة من حوائج<br />الدنيا هي لك رضا ولها فيها صلاح إلا قضيتها, اللهم ولا تجعل لها حاجة عند أحد<br />غيرك اللهم و أقر أعينها بما تتمناه لنا في الدنيا اللهم إجعل أوقاتها بذكرك<br />معمورة اللهم أسعدها بتقواك اللهم اجعلها في ضمانك وأمانك وإحسانك اللهم<br />ارزقها عيشا قارا ، ورزقا دارا ، وعملا بارا اللهم ارزقها الجنة وما يقربها<br />إليها من قول اوعمل ، وباعد بينها وبين النار و ما يقربها إليها من قول أو عمل<br />اللهم اجعلها من الذاكرين لك ، الشاكرين لك ، الطائعين لك ، المنيبين لك اللهم<br />واجعل أوسع رزقها عند كبر سنها وانقطاع عمرها اللهم واغفر لها جميع ما مضى من<br />ذنوبها ، واعصمها فيما بقي من عمرها، و ارزقها عملا زاكيا ترضى به عنها اللهم<br />تقبل توبتها ، وأجب دعوتها اللهم إنا نعوذ بك أن تردها إلى أرذل العمر اللهم<br />واختم بالحسنات أعمالها ..... اللهم آمين اللهم وأعنا على برها حتى ترضى عنا<br />فترضى ، اللهم اعنا على الإحسان إليها في كبرها اللهم ورضها علينا ، اللهم ولا<br />تتوفاها إلا وهي راضية عنا تمام الرضى ، اللهم و اعنا على خدمتها كما ينبغي<br />لها علينا، اللهم اجعلنا بارين طائعين لها اللهم ارزقنا رضاها ونعوذ بك من<br />عقوقها اللهم ارزقنا رضاها ونعوذ بك من عقوقها اللهم ارزقنا رضاها ونعوذ بك من<br />عقوقهااللهم آمين اللهم آمين اللهم آمين وصل الله على نبينا محمد وعلى آله وأصحابه ومن تبعهم باحسان الى يوم الدين<br />اللهم اني اسألك من خير ما سألك به محمد صلى الله عليه و آله وسلم واستعيذ بك من شر ما استعاذ به محمد صلى الله عليه و آله وسلم اللهم ارزق مرسل و قارىء الرسالة<br />مغفرتك بلا عذاب وجنتك بلا حساب ورؤيتك بلا حجاب اللهم ارزقنا وهو جنانك، وشربه من حوض نبيك واسكنه دار تضيء بنور وجهك<br />اللهم لا تجعل لنا في هذه الدنيا همًا إلا فرجته ولا دينًا إلاقضيته<br />ولا حاجة من حوائج الدنيا والآخرة إلا يسرتها برحمتك يا أرحم الراحمين اللهم اجعلنا ممن يورثون الجنان ويبشرون بروح وريحان ورب غير غضبان .."
archived = "2009-04-07"
