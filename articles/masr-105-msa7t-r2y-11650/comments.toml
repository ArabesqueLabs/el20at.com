[[comments]]
order = 29
subject = "الى الغالية بنت الغالية - انت مالكيش فى الكتابة خليكى فى المطبخ احسن واهتمى بالطبيخ ونظافة البيت"
text = "الموضوع مكتوب باسلوب طالبة فى الاعدادية بتكتبة بمناسبة عيد الام فى جريدة حائط بمدرسة فى كفر الفراخ<br />اظن الواحد ما يحطش نفسة بالعافية فى مكان مش بتاعة<br />اظن من الافضل ان تتفرغ السيدة كاتبة المقال لشغل البيت ورعاية السيد زوجها وان تهتم بطبيخ يفضلة زوجها عن هذ العك الذى نقرأة<br />ارحمونا<br />كان احسن لو نشرتم مكان هذا المقال نشيد عيد الام<br />عيدك يا امى ---------- احلى اعيادى<br />لولاك يا امى ---------- ما كان ميلادى"
archived = "2009-04-07"
capture_url = "https://web.archive.org/web/20090407114846/http://masr.20at.com:80/newArticle.php?sid=20357"

[[comments]]
