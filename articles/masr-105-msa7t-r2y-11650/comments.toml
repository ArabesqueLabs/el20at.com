[[comments]]
order = 7
subject = "أيكفيك دمعة ام نهر دمع"
author = "رائد بغدادي"
posted = "2006-04-06"
text = "اذا ماتت ام العبد صاح ملك من السماء أبن آدم لقد ماتت من كنا نكرمك لأجلها فأعمل عملا صالحا نكرمك لأجله .والله لم استطع ان اكمل المقال فهناك ماسال على الخد وفضحتني هذه الدموع ووجدت نفسي اعيش في بيت دعاء وأقبل جبين امي التي وجدتها دعاء تدعوا والناس نيام وعندما مسحت مابلل جفني حاولت ان اكمل ولكني وجدت نفسي امسك هاتفي واتصل بها من بعد دولتين وبحرا :الو..أمي ..ألو حبيبي مابك صوتك مخنوق ..كيف حالك ياأمي..اقسمي انك بخير ..انا بخير مادام صوتك قربي..دعوت لك في صلاة الفجر ان تعود سالما واراك ..وانا دعوت لكي ان تسألي الله ان يعافي ويشفي ام المصريين كلهم ماما فادية.فمبارك لك على هذه الجنة يادعاء ومبارك لك زواجك ونسأل الله ان يفرحكم في الاخرة كما افرحكم في الدنيا ...<br />يقولون أمي في العراق مريضة ..فقلت لهم كل العراق مريض..جراح وصبر وافتراق وغربة ودمع ولا كل الدموع يفيض..عليك سلام الله امي حبيبتي..فمن مثلك غنى ساهرا ومن مثلك زرع ببابي مهجتي..فكم ضاقت الدنيا علي بأهلها فما اهتز ايماني وما بعت عزتي ..وفي غربتي عنكي فتحت حقيبتي ..وجدت حجابا فوق صورتي..ربطتيه ياامي بشيب مبارك..عليه تراب من ضريح الائمة..آه ..دعاء عظيم كان زادي برحلتي ..فقلبي على البيت الكبير ولوعتي..ولوعتي على والدي الغالي وصحبي واخوتي ..على التاريخ وشطآن دجلتي..ومدرستي الاولى وحناء جدتي..فياليتني امي جالس قربك اقبل كفيك وألعن غربتي ."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205909/http://masr.20at.com:80/article.php?sid=58&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "الأم .. وما أدراك ما الأم .. إنها إحساس ظريف .. وه"
author = "emy_83"
posted = "2009-03-21"
text = "الأم .. وما أدراك ما الأم .. إنها إحساس ظريف .. وهمس لطيف .. وشعور نازف بدمع جارف ..<br />الأم .. جمال وإبداع .. وخيال وإمتاع .. وجوهره مصونة ولؤلؤه مكنونه ..<br />الأم .. كنز مفقود لأصحاب العقوق .. وكنز موجود لأهل البر والودود ..<br />الأم .. تبقي كما هي .. في حياتها وبعد موتها .. وفي صغرها وكبرها .. فهي عطر يفوح شذاه .. وعبير يسمو في علاه .. وزهر يشم رائحته الأبناء .. وأريج يتلألأ في وجوه الآباء.. ودفء وحنان .. وجمال وأمان .. ومحبه ومودة .. ورحمه وألفه .. وأعجوبه ومدرسه .. وشخصيه ذات قيم ومبادئ .. وعلو وهمم .. وهي المربية الحقيقية لتلك الأجيال الناشئة :<br />الأم .. مدرسه إذا أعددتها أعددت شعبا طيب الأعراق<br />الأم .. هي قسيمه الحياة .. وموطن الشكوى .. وعماد الأمر .. وعتاد البيت .. ومهبط النجاة .. وهي آية الله ومنته ورحمته لقوم يتفكرون ..<br />الأم .. صفاء القلب ونقاء السريرة .. ووفاء وولاء .. وحنان وإحسان .. وتسليه وتأسيه .. وغياث المكروب ونجده المنكوب .. وعاطفة الرجال ومدار الوجدان .. وسر الحياة .. ومهاج الغضب .. ومقعد ألألفه .. ومجتلى القريحة .. ومطلع القصيدة .. وموطن الغناه .. ومصدر الهناء ومشرق السعادة ..<br />الأم .. أشد أمم الأرض بأسا .. واسماها نفسا .. وأدقها حسا .. وأرسخها في المكرمات أقداما .. وارفعها في الحادثات أعلاما .. واقرها في المشكلات أحلاما .. وأمدها في الكرم باعا وأرحبها في المجد ذراعا ..<br />الأم .. كوكب مضي ء بذاته .. ويسمو في صورته وسماته .. وأجمل بلسما في صفاته ولها منظرا أحلى من نبراته .. ونفس زكيه طاهرة بصلاته .. وجسما غريباً يبهر في حجابه .. وعيوناً تذرف الحب بزكاته .. جدها عبرة .. ومزحها نزهة .. نخلة عذبة .. وشجرة طيبة .. ومخزن الودائع .. ومنبع الصنائع ..<br />الأم .. نعم الجليس .. وخير الأنيس .. ونعم القرين في دار الغربة .. ونعم الحنين في ساعة القربة"
archived = "2009-03-23"
capture_url = "https://web.archive.org/web/20090323235531/http://masr.20at.com:80/newArticle.php?sid=20357"

