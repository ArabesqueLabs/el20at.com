order = 0
subject = "الي متي"
author = "ياسر حبشي"
posted = "2008-06-30"
text = "اعتقد اننا جميعا نحتاج مراجعة انفسنا من جديد في طريقة تفكيرنا وان نكون مبصرين جيدا الي ما نحن عليه الأن كي نعلم<br />ما نحتاج اليه لكي نتقدم الي الأمام ونري جيدا ما يعوق تقدمنا ونتعامل معه ليس كعدو وانما كحاجز يعوق التقدم فهولاء المفكرين الذين نقف امامهم وكانهم اعدء لنا وللدين هما البوابه التي تساعدنا علي اكتشاف ما غاب عنا لزمن طويل<br />وانا اتمني ان نعطي فرصه لكل باحث ومفكر كي يثبت ما عنده ويظهر دوافعه ان كانت تؤل بنا الي الأمام ام ماذا ولا نقف لهم<br />مشهيرين لهم اسلحتنا المميته التي تقضي علي كل تقدم وصحوه فكريه"
archived = "2010-03-14"
