[[comments]]
order = 1
subject = ": احترام المشاعر والأحكام"
author = "المغترب"
text = "جمع صاحب المقالة جملة من سقطات من سقطوا ليعلل بها حماقة من قالوا بكفرهم ، ولا أريد أن أجادله فيما قال فقط أقول له ، إن كنت متحضرا فإن من التحضر أن تحترم ، وكذلك كان يجب أن يفعل جماعة من ذكرت مشاعر الأكثرية الغالبة من أهل الوطن الذي تقر على أرضه ، ولو كنت ديمقراطيا ، لنزلت وكذا جماعة من ذكرت على رأى الأغلبية التى ترفض سرقات طه ، وأكذوبة لطفى ، واندفاعة نجيب ، وتفلت الحكيم ، وأخيرا الفتى الخائب .<br />ولو كنت ممن يرى للقضاء مهابة لامتنعت عن الاعتراض على أحكام القضاء . مين أنت . قل لى مين . جاتك نبلة"
archived = "2010-03-14"
