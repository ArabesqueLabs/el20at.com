text = "لا أحد ينكر أن ظاهرة التشيع أصبحت شبه موضة في الجزائر خاصة في القري النائية التي لايجد فيها شبابها إلا المقاهي و لا حديث إلا التفلسف بالرغم أن أكثرهم لم يري يوما في المسجد، و لم يشهد له بالتدين. لكن كتابات الكاتب أنور مالك ساهمت بنسبة كبيرة في الترويج للشيعة واصبحت حديث العام و الخاص و جعل من مدين ة الشريعة -تبسة - كانها المقر الرسمي للشيعة . وذكرت أسماء أهل المدينة لا يعرفونهم فالقارئ البعيد عن المدينة يتخيلهم جهامذة .....فنقول لصاحبنا الكاتب كفي تهويلا و أكتب بعقلانية و قدر الأمور بقدرها فربا نافعة ضارة.<br />و ماأردت إلا النصح"
