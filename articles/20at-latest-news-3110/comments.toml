[[comments]]
order = 1
subject = "أقل احوال التشيع النفاق"
author = "مسلم"
posted = "2007-01-25"
text = "من تشيع فأقل احواله النفاق ، فلا أرى مسلما عاقلا يكذب الله ويصدق بمفتريات القوم<br />وهل في التشيع ما يحب .؟؟!!<br />به سب الصحابة الذين هم خير الانام -والحق أن هذا تكذيب بالقرأن الذي طفح بذكر محاسن الصحابة -رضوان الله عليهم<br />به دعاء المخلوقين من دون الله -ياحسين ياعلي - وهلم جرا والطواف بقبورهم<br />به الندب والنياحة على اموات قد صاروا رميما ، وقد نهينا على النياحة على الميت<br />به موالاة الكافرين ومعاداة المؤمنين -انظر العراق مثلا واسأل التاريخ عن جرائم القوم بحق الامة<br />به وبه وما أكثر مابه!<br />هل بعد ذلك يتشيع عاقل ناهيك عن مسلم"
archived = "2010-03-14"
