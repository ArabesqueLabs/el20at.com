[[comments]]
order = 2
subject = "نعم للجدال الاحسن و لا للتازع"
author = "محمد"
posted = "2007-02-03"
text = "القرآن الکر&--1740;م &--1740;عتبر ان المومنون انهم \"&--1740;ستعمون القول و &--1740;تبعون احسنه\" انا کش&--1740;ع&--1740; اعتبر اهل السنة و حتي من يعتبرني منهم \"رافضي\" اعتبره \"اخا في الدين\" و احترمه و اصلي معه و هذا واجب ديني علمناه من مكتب اهل البيت ع و لاننا - بغض النظر عن اكاذيب التي تنشرها اعداء الدين و الجهلة ضد مكتب اهل البيت ع علي اساس \"فرق تسد\" - نشهد بان لااله الاالله و ان القرأن كتابه و محمد عبده و رسوله و ان القبلة و الصلاة و الصوم و الزكاة و .. حق.<br />اذا فالخلاف بين الشيعي مع اخيه السني هو في مسالة الخلافة بعذ الرسول و اخوتنا من اهل السنة يعتقدون ان الخلافة جاءت من انتخابات و نحن الشيعة نعتقد ان الرسول ص لم و لن يترك الامر للانتخابات بل اكد و صرح في مرات كثيره - و احاديثها من روات الموثوقة عند اهل السنة ملئت المصادر السنية اكثر من المصادر الشيعية - بان علي هو خليفته و ولي المومنين بعده و ..<br />اي الاخوة و الاخوات! علينا ان نفهم ان لكل مذهب علمائه و كتبه و مصادره و قناعاته و &--1740;جب احترامها و لايمكن ان نهاجم الشيعة و نعتبر اكثر من 300 مليون مسلم في العالم \"الروافض\" و \"الكفرة\" بدون ان نقرا كتبهم و نستمع قولهم كما تشير الأية القرآنية ...<br />السوال الوحيد في هذا المقال نساله ممن يعتبر الشيعة روافض ان \"هل من المعقول ان من يتبع ائمة مذاهب اربعة اي مالكي و شافعي و حنبلي و حنفي الذين لم يكونوا من الصحابة و لا من التابعين و جاوا بعد قرن من ممات رسول الله ص هم من المسلمين - و الشيعة يعتقد فعلا انهم مسلمون - و لكن من يتبع اهل البيت ع الذي شاء الله ان يذهب منهم الرجس هم روافض؟! علينا ان نفكر قليا و لا نقبل كل من يقال عن الشيعة بل نقرا مصادرهم و نستمع علماءهم.<br />اعلموا ان من تعاليم آل البيت ع انه حرام الدخول في شجار و نزاع و اعلموا انها لاتخدم الا اعداء اللاسلام.<br />علي هذا الاساس ادعوا الاخوة و الاخوات ب\"جدال احسن\" كما يامرنا به القرآن."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "قاتل الله الجهلاء"
author = "جزائري متشيع!"
posted = "2007-02-15"
text = "ما شاء الله ...خائفين من انتشار فكر اهل البيت عليهم السلام ...و غير خائفين على ابنائهم من انتشار الفساد و الاغتصابات و العلاقات الاخلاقية و الجنسية بين بعض المنحرفين من المدرسين ..مع طلبتهم و حتى مع المدرسات اللي معهم..../اتذكر و الله العظيم لما كنت بالمتوسطة رايت بام عيني استاذة العربية (التي كنت احبها و احترمها كثيرا )في حضن استاذ اخر في احدى القاعات ,كنت مع بعض الطلبة .كتبنا رسالة خطية و رمينا ها عند المدير ,و كان يعلم بذلك!!لم يفعل شيء .احد المقربين عائليا له ,قال له حضرة المدير:هي حرة في اخلاقها ,المهم تدرسكم العربي!!!<br />حينها لم يفكر لا هو و لا من يعرف بهذه التصرفات في تاثير ذلك على الطلبة !!<br />مذهب اهل البيت لا يقوم اساسا على سب الصحابة ..و لا يجب تعميمه على الافراد ..كل ما في الامر هو ذكر لاخطائهم و تصرفاتهم اتجاه اهل البيت عليهم السلام و كل المذاهب تعترف بذلك...و القران شاهد على ذكر و لعن المنافقين../اما قولكم التركيز و ذكر ذلك لرغم انه زمن مضى..../اقول :التاريخ هو الذي يبني الحاضر و بذكر ذلك تصحح الكثير من الامور الخاطئة في ما نسلكه من تصرفات و اعتقادات في حياتنا اليومية ......../بناء حاضر الامة مبني على ذكر اخطاء الاسلاف ..حتى لا يقوم ديننا على اشخاص اذوا رسولنا الكريم وحرفوا و زيفوا في سنته الشريفة!!!!<br />من يسب الصحابة او يذكر امور بتعصب من الاخوة المتشيعين فهو ليس الا تعبيرا عن دهشتهم مما وجدوه من حقائق حول هؤلاء الاشخاص ,فاخذتهم الحمية و العصبية في ذلك ,لكن بمرور الوقت ينجلي بعدما يشربون من منبع الاخلاق الحميدة الطاهرة لاهل البيت عليهم السلام...عقيدة المحبة و الاخاء ..و ليست عقيدة الارهاب و القتل و الذبح..(عقيدةالذين تصالحت معهم الحكومة و الشعب !!)...<br />سوف يظهر الحق ..ان شاء الله تعالى."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "اقرأوا في التاريخ وابحثوا بانفسكم"
author = "شيعية جزائرية من بجاية"
posted = "2007-02-25"
text = "اللهم صل على محمد وآل محمد وعجّل فرجهم<br />سبحان الله لقد صار التنصير ينتشر عندنا بمنطقة القبائل انتشار فيروز الكوليرا<br />ولقد صار جيراننا من حولنا كلهم مسحيين عفنين ولا من أحد ينطق وكان الأمر صار عاديا<br />لماذا تخافون انتشار مذهب اهل البيت عليهم السلام ولا تخافون ارتداد الشعب عن دينه<br />باالله عليكم اين السلطات من هذا الأمر الخطير ؟؟؟؟,,,,<br />اقول لمن ادعى على موالين اهل البيت عليهم السلام النفاق<br />ابحث في التاريخ ايها الزميل لترى الحقائق المرّة التي يتقزز منها كل مؤمن<br />نصحتي اليك ان تبحث عن الحق دون انحياز لأي طرف كان<br />وابعد عنك معرفة الرجال قبل معرفة الحق لأن العكس هو الصحيح<br />جاوبني ايها المخالف اين درس الامام مالك ومن كان استاذه ؟؟<br />فابو حنيفة (نعمان بن ثابت بن زوطي الكوفي) (ت150 للهجرة) ما هو الا واحد من الالاف من تلامذة الامام جعفر بن محمد بن علي بن الحسين بن علي بن ابي طالب عليهم السلام (ت في المدينة 148 للهجرة) والذي كان يعرف بالصادق وهو صاحب من اظهر مذهب الامامة كمذهب يستقي مصادرة من الائمة الاطهار عليهم السلام \"عن جدهم رسول الله صلوات الله عليه واله عن جبرئيل عليه السلام عن رب العزة جل جلاله\" كماجاء عن السنتهم، ومن هنا كانت مصادر حديثهم وسنتهم من الوثاقة بمكان حيث لا ينازعهم منازع، فالامام الصادق هو امام و استاذ كل المذاهب التي اخذت عنه ثم ابتعدت عن منهجه الاصيل كما تبتعدون اليوم انتم عن المنهج الأصيل<br />ان اهل البيت عليهم السلام هم معدن الرسالة ونورها ويجب الأخد عنهم أولا تمّ عن غيرهم ثانيا<br />اقرءوا التاريخ وابحثوا ونقّبوا بأنفسكم من دون أي تأثير من اي طرف كان وانفظوا عنكم غبار الجهل والتعصب<br />وابحثوا لما اختلف المسلمون وتفرقوا الى جهات مختلفة وابحثوا عن عنصر الجهة الحقيقية والصحيحة<br />واميلوا مع الحق اينما مال حتى تلاقوا الله سبحانه وتعالى وهو راض عنكم وتلاقوا رسولكم عند الحوض وهو راض عنكم<br />وختاما حاربوا التنصير لا الاسلام اخوتي اخواتي<br />والحمد لله الذي هدانا لهذا وماكنا لنهتدي لولا ان هدانا الله والصلاة والسلام على محمد وآله ماطلع شمس وماغربت"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "المطلوب رفع الضبابية المفاهيمية حول التشيع"
author = "جزائرية شيعية"
posted = "2007-02-25"
text = "...دعنا نتساءل: هؤولاء الناقمين من التشيع، غير السلفية المتخلفة -الحاقدة على كل مختلف عنها و عن الرافضة كما يسمونهم أشد و أطغى-ماذا يعرف هؤولاء المتنطعين في سوق النخاسة التعصبية و رواق العطايا السياسية و المذهبية عن هوية التشيع، هل قرأوا فقه الإمام جعفر الصادق عليه السلام، هل ناقشوا تواريخ الرجال من الطبري مرورا بابن حزم ووصولا إلى العلامة ابن خلدون وزير السلطان أبي عباس بمصر، أين الأدب بكل مصاديقه و أين العدالة في أدنى صورها فقط لا أرقاها؟؟<br />طبيعي جدا أن يلقى خبر كهذا صدى واسعا لدى القارئ الجزائري العامي المحكوم بثقافة الجريدة و المقهور ثقافيا ككل، لان فاقد الحق لا يعطيه، فحتى الشيخ محمد الغزالي الذي أبلى البلاء الأحسن في التقريب بين المذاهب الإسلامية ، و الذي عاش بين أظهرنا سنين و لم يستوعب أهل البيت الجزائري فكره جيدا و هو ابن الإسلام المعتدل ،للأسف لم يقرأوا كتبه ولو قرأوها أنكروا ما فيها من حقائق تشير على صدق الرجل... هذا نموذج علمائي لم يستفاد من فكره الاستفادة السليمة و هو من أواخر المعاصرين (بعد الشيخ شلتوت و عبد الحليم محمود و غيرهم) الذين دعوا لدمج الفقه الجعفري في كليات الفقه بالأزهر لأنه يعتبر أغنى فقه إسلامي...<br />يكفي كلاما غير مسؤول و لا علمي و إنساني، إننا عانينا الويلات في التسعينات و لازال جمر تلك النار إلى الآن يكوينا ، ليحاول هؤولاء النبهاء أن يفرقوا بين ثقافة التشيع و ثقافة الشيعة، إن التشيع كثقافة فرض نفسه عبر التاريخ و هو طيف رسالي حقيقي من عمق الرسالة الإسلامية الرافضة للظلم و الاستبداد و الزيع و النفاق وكل ما يقتل التقوى في النفس المسلمة، فكرا و عملا ، و الحمد لله التشيع كان دوما شعاره اللاعنف المستوحى من الثقلين ...<br />باحث إجتماعي جزائري إسلامي، مقيم بألمانيا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "حزب الله المغاربي"
author = "اكتب اسمك هنا"
posted = "2007-10-09"
text = "أنباء سرية عن حزب الله المغاربي !!<br />باريس – كتب أنور مالك (المصريون): : بتاريخ 8 - 10 - 2007<br />تسربت في الآونة الأخيرة ملفات مثيرة عن حملة واسعة النطاق لتشييع الجزائريين، وقد تم استغلال عدة محطات دولية في هذا المد الجارف، وإن كانت جهات رسمية قد قللت من شأن ذلك وعلى رأسهم وزير الشؤون الدينية الجزائري أبو عبدالله غلام الله، الذي دعا إلى تجنب ما سماه بالتهويل الإعلامي، ورافقه في التفنيد رئيس جمعية العلماء المسلمين الشيخ عبدالرحمن شيبان، إلا أن الواقع عكس غير ذلك وخاصة في بعض المناطق التي تشهد حملة واسعة، كما يحدث بمنطقة الشريعة (ولاية تبسة – الشرق الجزائري) حيث سجلت مصالح الأمن النشاط الواسع لبعض الأساتذة بمختلف المؤسسات التربوية، الذين تربطهم علاقات واسعة مع جهات دينية وسياسية ايرانية، وسبق لهم أن ترددوا مرات متعددة على طهران، فضلا عما حدث من قبل على إثر فتح تحقيق بولاية عين تموشنت (الغرب الجزائري)، في حادثة تدنيس القرآن الكريم، والذي وجهت فيه أصابع الإتهام للمتشيعين، فقد وجدت صفحات بيضاء كتب عليها لفظ \"سورة الولاية\" وأيضا عملية شطب للآيات التي تبرئ زوجة النبي (صلى الله عليه وسلم) من حادثة الإفك...<br />وقد زاد التشيع إمتدادا في وسط الجزائريين منذ الإعتداء الذي شنته إسرائيل على لبنان، وأدى ذلك إلى مجازر مروعة في حق المدنيين وتدمير واسع للبنية التحتية اللبنانية، فالمقاومة التي أداها حزب الله بزعامة أمينه العام حسن نصرالله، دفع الكثيرين إلى إعلان ولائهم المطلق لعقيدته الشيعية، في هذا الإطار سمعنا الكثير من الأصوات تنادي بضرورة إستنساخ هذا الحزب إلى عدة أحزاب تكون ممثلة له، ويوجد من طالب بإعلانه في العراق والسعودية والمغرب العربي، حتى أن بعض المراقبين يرون أن \"حزب الله\" على درب قاعدة أسامة بن لادن، التي تكاثرت وصارت عدة قواعد في المغرب العربي والشام والحجاز والعراق وحتى بلاد فارس... ومما يجب التنويه إليه في إطار موضوعنا هذا، هو ما كشف في إطار حملة التشيع التي تضرب العمق المغاربي بصفة عامة والعمق الجزائري بصفة أخص، في وجود تحركات سرية من أجل إعلان \"حزب الله المغاربي\"، يتزعمه شيعي مغربي يقيم في ألمانيا، هذا ما صرح به البرلماني الجزائري عن حركة حمس سعيدي عبدالرحمن لصحيفة (الشرق الأوسط) والذي نشرته في عددها الصادر بتاريخ 28/03/2007، ليؤكد حسب معلومات لم يكشف عن مصدرها ولا حيثياتها، من أنه \"يتم التحضير في بلاد غربية وفي بلاد الشام لمشروع حزب الله المغاربي\"، ليضيف متحدثا عن شخص لم يذكر إسمه ولا كشف عن هويته، سوى أنه يقيم بشرق الجزائر وزوجته لبنانية، إضافة إلى ذلك أنه يتمتع بنفوذ في الأوساط الشيعية خارج الجزائر، ويدعي أنه من كبار الشيعة في المنطقة المغاربية حسب سعيدي طبعا، وإن كانت مصادر أخرى من حركة \"حمس \" أكدت لنا من أن الحركة تملك ملفا كاملا عن الموضوع، وهو بحوزة زعيمها الحالي الوزير سلطاني بوقرة، وسوف تتركه للوقت المناسب للبت فيه، من دون أن يحدد جدولا زمنيا لذلك، وهي طبعا عادة حركة \"حمس\" التي تستغل مثل هذه الملفات في الإستحقاقات الإنتخابية أو من أجل التهويل الإعلامي الذي يعيد لها بريقها الإعلامي وحضورها السياسي والشعبي، ولكن قد أخذت الدروس والعبر من ما سمي بـ \"إدعاء\" زعيمها سلطاني بوقرة من قبل امتلاكه لملفات وأسماء ثقيلة متورطة في الفساد، فتحت عليه أبواب جهنم حينها وعلى رأس ذلك الهجوم اللاذع الذي شنه عليه الرئيس عبدالعزيز بوتفليقة، جعل الحزب في موضع حرج وتململ داخلي تم إحتواءه في المهد وبدعم من مصالح الرئاسة...<br />مصادر أخرى مطلعة كشفت لنا أن الدكتور محمد التيجاني وهو شيعي تونسي يقيم بأمريكا وتربطه علاقة نسب مع أحد كوادر الشيعة في لبنان، فضلا عما يتلقاه من دعم صقور نافذين في البيت الأبيض، نشر من قبل كتابا مثيرا للجدل عنوانه (ثم إهتديت)، لهذا الأخير الدور البارز والنشيط من أجل إعلان هذا التنظيم، وهو يتلقى الدعم من حسن نصرالله شخصيا، وقد حدثت إجتماعات في الجزائر بين أطراف مختلفة وبسرية تامة، تم إستدعاء بعض الوجوه المحسوبة على التشيع والمقيمة في الخارج، على رأسها لندن وباريس، لوضع الأطر التنظيمية - داخليا خاصة - لهذا الحزب، ومما تسرب هو ما جاء في رسالة التيجاني التي قرئت على الحاضرين من جزائريين وتونسيين ومغاربة... ومما جاء فيها قوله:<br />(... إذا كان للقاعدة الوهابية قواعد في المغرب والشام والحجاز فإنه يجب لحزب الله أن يتوسع لكسر شوكة الوهابيين الإرهابيين وصيانة مكتسبات الأمة التاريخية من الأنظمة الفاسدة والعميلة...).<br />(... حزب الله المغاربي سيكون إمتداد للمقاومة والثورة التي تستمد نورها من جيل صنع المعجزة في إيران ويصنع الكبرياء اليوم في لبنان...).<br />للتذكير أن أحد شيوخ السلفية في الكويت وهو عثمان الخميس ألف كتابا عن التيجاني محمد سماه (كشف الجاني محمد التيجاني)، وسبق له مناظرته في برنامج تلفزيوني على قناة \"المستقلة\" في رمضان 2004، كشف فيه الكثير عن العقائد التي يتبناها التيجاني ويبشر بها...<br />من جهة أخرى علمنا من مصادر موثوقة عن تحركات حثيثة ودورية لجهات شيعية عربية تقيم بباريس تدخل في هذا الإطار، من أجل إعلان مرتقب عن هذه الحركة السياسية الجديدة، والتي أختير لها اسم \"حزب الله المغاربي\"، وان كانت هذه الحركة تستمد فكرها من الثورة الإسلامية الإيرانية ذات المرجعية الشيعية، وهو لا يختلف عن حزب الله الأم في لبنان، إلا أن نشاطه سيكون سياسيا من اجل لم شمل\" شيعة المغرب العربي\" في إطار تنظيمي يخدم مصالحهم ويدافع عن حقوقهم الدينية والسياسية...<br />في إتصال هاتفي بأحد النشيطين بالعاصمة الفرنسية الذي رفض أن نذكر إسمه، فقد إمتنع عن إعطاءنا صورة واضحة عن هذه الحركة، وذلك يدخل في إطار الإنضباط إلى حين الإعلان الرسمي وتعيين ناطق إعلامي، وإن كان تأكيده لوجود هذا النشاط المنظم في كثير من العواصم الغربية واضحا، الذي جاء كإمتداد لخلية تعمل في لبنان وتحت رعاية الأمين العام لحزب الله السيد حسن نصرالله وبدعم من مرشد الثورة الإسلامية علي خامنئي..."
