subject = "لكل من يدعي التشيع"
author = "هازم الكذابين"
posted = "2008-03-09"
text = "جزائري متشيع!// شيعية جزائرية من بجاية // جزائرية شيعية // أقول لكم مشاء الله التقية عندكم شغالة مية مية وأجزم أنكم لستو بجزائرين === المهم أوجه كلامي للبجاوية المتشيعة توجهين لنا دعوة في الإطلاع على التاريخ وهل أمر الدين والعقيدة يأخذ من كتب التاريخ أم من صحاح الكتب التي تعتم على أسانيد وطريقة علمية تثبت صحتها ؟؟؟ وتقولين أنه يجب أخذ الدين من آل البيت ونحن لا نعارض هذا أكيد ...... فأتحداكي أن تخرجي لنا الآن حديثا واحد أصح كتبكم وهم (= الكافي = الإستبصار= من لا يحضره الفقيه=التهذيب) التي هي عماد دين الشيعةوالتي تتعدى أحاديثها عن 44 الف .. حديثا واحدا ترويه الزهراء عن النبي عليه الصلاة والسلام ؟؟؟ ولعلمكي فعلي رضي الله عنه الذي تتبجحون بأنكم اتباعه ومحبيه ماروا عنه أهل السنة يفوق بكثير ما يرويه علمائكي في كتبهم الأرعة إذ بلغت رواياته عند الإمام أحمد لوحده (804) حديثا في حين لو نجمع كتبك الاربعة فلا نجد سوى(690) حديث .. هذا مثال بسيــــــــــط ولو قدمت الإحصائيات كاملتا لوليت خيفتا من المذهب الذي تزعمين إعتناقه وإنتمائه لأهل البيت ...فحينها أقول لكي وبكل بساطة فقد أخطأتي العنوان يا سيدتي فأهل البيت لن تجديهم في الشيعة لأنهم يعتمدون في دينهم سوى الزعم والضن بأنهم اتباع لآل البيت .... وانتي بدون حياء تدعينا لتصفح كتب التاريخ وتتركين القرآن الكريم البينة من عند الله .... آآآآآآآآآآآآآىه نسيت ان القرآن عندكم محرف كما قال الكليني ونعمت الله الجزائري ولكي الدليل :1 - قال الشيخ المفيد :<br />\" إن الأخبار قد جاءت مستفيضة عن أئمة الهدى من آل محمد صلى الله عليه وسلم باختلاف القرآن وما أحدثه بعض الظالمين فيه من الحذف والنقصان \" اوائل المقالات : ص 91.<br />2 - أبو الحسن العاملي :<br />\" اعلم أن الحق الذي لا محيص عنه بحسب الأخبار المتواترة الآتية وغيرها أن هذا القرآن الذي في أيدينا قد وقع فيه بعد رسول الله صلى الله عليه وسلم شيء من التغييرات ، وأسقط الذين جمعوه بعده كثيرا من الكلمات والآيات \" [المقدمه الثانية لتفسير مرآة الأنوار ومشكاة الاسرار ص 36 وطبعت هذه كمقدمه لتفسير البرهان للبحراني].<br />تردين المزيد ؟؟؟؟؟ حااااااااضر ...3 - نعمة الله الجزائري :sad: للعلم فهذا الزنديق ليس بجزائري ولا نتشرف أن يكون كذابا مثله جزائري فهو إسمه فقط هكذا قبحه الله )<br />\" إن تسليم تواتره عن الوحي الإلهي ، وكون الكل قد نزل به الروح الأمين ، يفضي الى طرح الأخبار المستفيضة ، بل المتواترة ، الدالة بصريحها على وقوع التحريف في القرآن كلاما،ومادة،وإعرابا ، مع أن أصحابنا قد أطبقوا على صحتها والتصديق بها \" [الأنوار النعمانية ج 2 ص 357].<br />مشاء الله القرآن عندكم محرف فالملاذ إلى كتب التاريخ ههههههههههههههه<br />وللعلم فمن أراد التشيع فلا بارك الله فيه وهنيئا للشيعة بهاؤلاء المرتدين الذين لا نتشرف بإنتمائهم لأهل السنة والجماعة ............. وفي الختام أقول حاسبو أنفسكم قبل أن تحاسبو فالقضية قضية جنة أو نار وللأبد ليست بالأمر الهين .... الله يهديكم لطريق الصواب ."
