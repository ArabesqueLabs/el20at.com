subject = "وجهة نظر"
author = "عروبة"
posted = "2007-01-25"
text = "عني يا اخي الكريم لازم صحابة رسول الله يشتمو من الشيعه ونصمت حتى لا يكون تعصب<br />نعم قاتل الله التعصب الذي نراه من الشيعه<br />الظاهر يا اخي انت عندك شتم الصحابه والسكوت عليه دليل على دعم التعصب؟<br />شر البليه ما يضحك<br />حياكم الله يا اهل الجزائر الشرفاء"
