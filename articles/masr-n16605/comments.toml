order = 0
subject = "الإسكندرية"
author = "عبدالرحمن"
posted = "2007-05-31"
text = "فى هذا التعليق أقول :<br />المسيرى من الأشخاص الذين يجعلونك فخور بإنك مصرى تتحدث العربية ..<br />المسيرى كاتب و مفكر و فيلسوف موسوعى له قدرة غير عادية على ربط البيانات لإستخراج المعلومات<br />هو علم آخر من أعلام مصر .. و أب روحى و حاسوب آلى طبيعى بين أيدينا و على أرضنا<br />لا تكفى الكلمات لوصف هذا الرجل .. يا لعقل هذا الرجل ... و من هنا أبعث له كل الشكر و التقدير و الإحترام<br />أبا كريماً خيراً وقوراً نتباهى به جميعاً .. أطال الله عمره و شفاه الله و عفاه<br />و شكراً"
archived = "2010-03-14"
