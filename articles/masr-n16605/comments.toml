subject = "الخوارق ليست تعاد"
author = "نيفين نيفى نوفا"
posted = "2007-06-03"
text = "اولا تعليقاتى بتروح فين سا عشرينات<br />انا فاكره انى علقت على الموضوع ده<br />المهم حبيت اقول ان نزار كان قال الخوارق ليست تعاد فى رثاء عبد الناصر<br />و ارى انه من حق الرجل و اقصد بالرجل د.المسيرى هذه الكلمه ايضا لانه مفكرينا الذين قلما ياتى الزمان بمثلهم<br />و كنت بتكلم امبارح مع احد احباء الاستاذ و عرفت كم يحب الناس ةو يقدرون هذا الرجل<br />ادعو الله بالشفاء العاجل"
