[[comments]]
order = 1
subject = "بحبك يا دكتور"
author = "أرابيسك"
posted = "2007-05-31"
text = "شكرا عبد الوهاب المسيرى<br />ربنا يشفيك و يعطيك الصحه و يبارك لك فى عمرك و عملك و صحتك و اهلك و مالك<br />مش بايدينا حاجة نعملها يادكتور نعمل اية بس انا بحبك جدا ما شفتكش و لا عمرى قابلتك و لا شفتك فى التلفزيون انا حبيتك من كتبك و كلامك و افكارك و موسوعه اليهود انا بفتخر بيها جدا و نفسى تترجم لكل لغات العالم<br />احنا امه شبه ميتة يتمر بتشنجات ورعشة اخر نفس الوضع الطيبعى انها تتحول الى جثة بلا حراك بمرور الزمن لكن بعون الله ووجود امثالك رغم قلتهم و ندرتهم وقربهم من قلوب الناس و مشاكل الشعب هوا اللى بيخلى فى امل فى ناس مالهاش امل<br />التوقيع<br />واحد من ولادك<br />http://arabesq.blogspot.com"
