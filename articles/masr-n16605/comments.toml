text = "المسيري بمسيرته العطرة كان رجل عز فيه الرجال كان عملاقا تقازمت تحت قدمية الهامات التي ركعت لاعدائنا وظل هو رافعا راية الحق الذي لا يموت حتى مات فكان ذلك حياة جديدة اضبفت لحياته وعرفه من كان يجهله واصبح المسيري رمزا للوطنية في زمن باع فيه الحماة الوطن وشكرا لك على موضوعك الهايل والى الامام<br />عمك محمد"
