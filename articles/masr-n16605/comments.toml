[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-05-31"
text = "لا ابالغ اذا قلت انه لم يحدث ان قام كاتب او مفكر عربي بخلخلة كل افكارنا النمطية المسبقة كالمسيري، ان موسوعته عن اليهود واليهودية تصدمك في البداية ثم تتابع وتسترسل في الكلمات وانت مشدوه وفاغر فمك مكتشفا انك كم كنت مكبلا وتابعا لكل افكارك القديمة الاختزالية الخاطئة عن اليهود والتي تسربت لخريطتنا الادراكية \"وانا استعير هذا المصطلح من كاتبنا العظيم\" دون وعي ودون تفسير تحليلي علمي لكل الظواهر المحيطة بنا.<br />انا فلسطيني و لا اشعر بعروبتي وانتمائي الكبير الا بين يدي هذا الدون الهاديء<br />انا اعجز عن توصيف فكر هذا الطود العظيم ولا املك له الا بالدعاء من قلبي له بالشفاء العاجل وان يتغمده الله سبحانه وتعالى بواسع رحمته وغفرانه<br />www.nostaliga.blogspot.com<br />وان يكثر الله من قرائه!!!!!!!!!!!!!!!!!!"
archived = "2010-03-14"
