text = "[quote name=\"فلسطينية\"]بداية اشكر من قام بالتدوين ،<br />طبعا نحن لا يحق لنا ان نقوم بالافتاء لأننا على غير علم .<br />ولكن باعتقادي طالما الكلام لم يتجازو الحدود الشرعية والدينية<br />ولم يدخل في باب العواطف والخصوصيات .<br />وكان مجرد تعبير عن الرأي او تبادل أفكار ... لا اجد فيه مشكلة<br />والله أعلم :-)[/quote]<br />انا فعلا كنت محتارة هل كلامى مع الولاد صح ولا غلط ؟! حرام ولا مش حرام ؟! بس اللى انا اكتشفت انه غلط كبير لية نكلم شباب اصلا عشان نتبادل افكار ؛ طب ما فى بنات لية مش نتكلم ماعهم هيكون افضل , وبعدين حتى البنات كمان مينفعش نكلمهم , انت لية تثقى فى افكار ناس اصلا متعرفيهاش خلاص مفيش حد حوليكى تعرفيه تتبدلى معاه الافكار."
