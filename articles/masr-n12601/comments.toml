order = 0
subject = "الدنيا مفيهاش فقر الدنيا فيها قلة رأى"
author = "فلاح مصرى عجوز"
posted = "2007-11-27"
text = "مظاهر الفقر والتشرد والطفولة البائسة هى نتيجة سياسات خاطئة<br />ماذا نعمل فى هؤلاء المشردين ؟ واطفال الشوارع هل نطلق عليهم الرصاص وكأنهم كلاب ضالة كما فعلوا فى البرازيل ؟<br />ترجع الدراسات اسباب الطلاق وتشرد الاسر الى العامل الاول وهو الفقر<br />ولماذا نحن المصريين متخصصين فى الفقر ؟<br />هل الفقر يستطعم دمنا ؟<br />ولماذا نحن خاملون ؟<br />زمان قوى من ييجى خمسين سنة ابويا الحاج عبد الدايم تحت شجرة على الترعة قال لى<br />فية مثل قالوة الاجداد : الدنيا مفيهاش فقر الدنيا فيها قلة رأى<br />وعندما سألتة يعنى اية رأى قال لى فى مفهومة الرأى يعنى سياسة<br />يعنى مفيش سياسة<br />تلك هى مصيبتنا ان مفيش سياسة لاى حاجة<br />الدنيا ماشية معانا استروبيا وايام بتعدى<br />وصدقت يا حاج عبد الدايم"
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204175515/http://masr.20at.com:80/newArticle.php?sid=12601"
