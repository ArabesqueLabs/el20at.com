text = "صفحات من التاريخ عبر قناة الناس الفضائية ويتناول اليوم 17/2/2008 صفحة جديدة من صفحات التاريخ يروي لنا ما حدث فيها بأسلوب الدكتور \"جمال عبدالهادي\" الشيق البسيط .<br />كما تلتقون اليوم مع الدكتور \"صفوت حجازى\" وحلقة جديدة من برنامج \"فضفضة\" وذلك في تمام الساعة التاسعة وخمسة عشر دقيقة مساءًا بتوقيت القاهرة."
