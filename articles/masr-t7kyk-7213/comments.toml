text = "الحمد لله - ربنا حقق املي في انه فعلا المستشفى يتبنى و انا فعلا فخور بيه مش علشان شكله حلو لكن لان فكرته فعلا نابعة من قلب مصريين ربنا وهب في قلوبهم الرحمة و مصريين اتبرعوا لان ربنا وهب في قلوبهم الرحمة - نفسي ربنا يبارك في المستشفى دي و ما يجيش ولاد الحرام يحطو اديهم عليها ويوزعوها على الحبايب و الاقارب و تبقى مال سايب - و اخيرا لو في مصر 10 مشاريع زي دول هانقدر نساعد ناس كثير - كثير قوي"
