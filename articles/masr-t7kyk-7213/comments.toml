subject = "فخورين بكم"
author = "مصرى"
posted = "2007-09-27"
text = "اة من الاحساس بنشوة السعادة لهذا النجاح الباهر - مستشفى فى مصر بهذة العظمة<br />واجمل مافية ان للفقير والمسكين فية مكان ويحترم فية<br />قمة من قمم مصر<br />اشرف علية اولاد من اولاد بلدى<br />ومن الجنية جنب الجنية بنوا هرم صحى يفتخروا بة واولادهم من بعدهم<br />ارفع طقيتى احتراما<br />اما اصطبلات وزارة الصحة المسماة مستشفيات والداخل فيها مفقود وهى مكان لتوزيع الامراض وقتل الناس الغلابة عمدا<br />فاللة هو المنتقم الجبار<br />ويا وزير الصحة يمهل ولا يهمل"
