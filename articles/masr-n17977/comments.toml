order = 0
subject = "التحرش الجنسى فى اقسام الشرطة - والا دة علشان غلبا"
author = "الحكش"
posted = "2008-10-22"
text = "التحرش فى اقسام الشرطة على ودنة<br />الرجالة اللى بيحطوا ايد المقشة فى مكان حساس زى السواق بتاع امبابة<br />والنسوان فى اقسام الشرطة اللى بيهددوهم بالاغتصاب ويمدوا ايديهم عليهم فى التحقيقات<br />يا سيادة القاضى المشكلة بدات من هنا<br />من عند الحكومة - من اقسام الشرطة<br />جايين على الغلبان<br />اذا سرق فيهم الشريف تركوة واذا سرق فيهم الضعيف اقاموا علية الحد"
archived = "2008-10-23"
capture_url = "https://web.archive.org/web/20081023010854/http://masr.20at.com:80/newArticle.php?sid=17977"
