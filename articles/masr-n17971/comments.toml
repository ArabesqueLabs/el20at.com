[[comments]]
order = 1
subject = "السيدة نفيسة رضى اللة عنها"
author = "من البلد دى"
posted = "2008-10-20"
text = "كان احمد ابن طولون حاكم على مصر<br />واستغاث الناس من ظلمة وجورة وتوجهوا للسيدة نفيسة رضى اللة عنها يشكون اليها ظلمة وجورة<br />فسالت الناس<br />متى يركب دابتة ويخرج ؟ قالوا لها --فى غد<br />فكتبت لة رقعة ووقفت فى طريقة وقالت<br />يا احمد ابن طولون<br />فلما راها ترجل -- فناولتة الرقعة من يدها فقراها واذا فيها مكتوب<br />ملكتم فاسرتم -- وحكمتم فقهرتم -- وخولتم فعسفتم - ودرت اليكم الارزاق فقطعتم -- هذا وقد علمتم ان سهام الاسحار نافذة غير مخطئة لا سيما من قلوب اوجعتموها -- وكبود جوعتموها -- واجساد اعريتموها -- فمحال ان يموت المظلوم ويبقى الظالم - اعملوا ما شئتم فانا صابرون -- وجوروا فانا باللة مستجيرون -- واظلموا فانا الى اللة متظلمون وسيعلم الذين ظلموا اى منقلب ينقلبون<br />تلك حادثة من التاريخ<br />وتلك هى السيدة نفيسة رضى اللة عنها"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022003020/http://masr.20at.com:80/newArticle.php?sid=17971"

