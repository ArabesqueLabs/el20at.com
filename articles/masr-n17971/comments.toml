subject = "ونعم الرجال"
author = "مش ضارف"
posted = "2008-10-20"
text = "انا اعرف واحد عريس جديد بياخد 400 جنيه في الشهر<br />وبيدفع ايجار 200 جنيه في الشهر<br />هو ومراته وبنته الرضيعة بيصرفوا 200 جنيه في الشهر<br />والراجل في غاية الشهادة رافض ان زوجته تشتغل خالص<br />يعني 200 جنيه معيشة لزوج وزوته وطفله رضيعة<br />يا سلام"
