subject = "الحكم المأثورة"
author = "عبد الصمد أزروال"
posted = "2008-09-08"
text = "الأمثلة المغربية الماثورة لها مثيلتها في ثافات الأمم الخرى، بمعنى أن الأمثلة المأثورة أو الحكم المتداولة في مضونها هي أمثلة عالمية و موروث انساني عام ، و الأمثلة التي نعتقد انها مغربية هي أمثلة عالمية منطوقة بالدارجة المغربية ليس إلا. وأكتفي بهذا القدر و السلام عليكم."
