[[comments]]
order = 0
subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
posted = "2007-07-09"
text = "هاى يا مروه ازيك و بقالى كتير معلقتش وو حشتينى<br />طبعا مش محتاجه اقوللك الموضوع جميل..عايزه اقول ان رغم التحفظات الكتيره اللى باخدها على بعض مشاهدها فمنه شلبى من عينه الممثلات اللى فعلا لما تشوفها ف دور لا يمكن تتخيل ان حد تانى كان ممكن يعمل الدور زيها كمان بتضيف للدور ابعاد تانيه و مهما كان الدور صغير او تافه بتديله بعد شانها ف ده شان هند صبرى و يسرا و غيرهم من الفنانين اللى رغم اختلافك معاهم لكن فنيا متقدرش تقول حاجه<br />با لنسبه لموضوع ارتباطها بخالد يوسف ده امر شخصى يرجع لها بس انا شايفه ان منه جت تكحلها عمتها فى ردها على سؤال اسائتها للاسلام بارتداءها زى اسلامى تتستر بيه و ده فعلا صح و كان واضح ف الفيلم و ضايقنا"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717193712/http://masr.20at.com:80/newArticle.php?sid=10973"

