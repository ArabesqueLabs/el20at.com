posted = "2007-12-02"
text = "على فكرة انتوا ناس مش محترمة ولا دة موقع محترم اللى يسمح لشوية ناس سافلة يكتبوا كلام زى دة اصلا ويلى بتتكلمو على العيب والحرام والحلال قولوا لنفسكم الكلام دة واعرفوا ان اللى انتوا عاملين تجيبوا فى عرضهم كدة سواء كانت المحررة ولة منة شلبى دول بنات مسلمات وان قذف المحصنات من الكبائر بصوا لنفسكم وحسبوا نفسكم قبل مترموا النس بالكلام علشان بس يطلع شكلكم كويس ومش بتحبوا الغلط"
