[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-07-10"
text = "بصراحة المحررة اختارت نموذج جيدجدا للتحدث عنه<br />و هو نموذج فتاة امها راقصة و هي لا تخجل من ممارسة الجنس العلني أمام الكاميرات و عيون المشاهدين<br />و طبعا منه شلبي ملهاش مثيل كأنثى غير محترمة تبيع جسدها لعيون الناس و أديدي البعض الأخر<br />و عندما نجد كاتب او كاتبة تساعد على شهرة مثل هذه النوعيات القذرة فلابد ان النموذج يشبه صاحب الموضوع خاصة لو تم تقديمه بشكل جيد كمقالنا .... في النهاية احييكم يا موقع عشرينات على تقديمكم مواضيع غاية في الغباء لعقول الشباب ااالعربي و مساعدة الغرب على هدم افكارنا و على الرغم من انكم موقع شبابي الا انكم موقع مشتق من موقع اسلامي"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717193712/http://masr.20at.com:80/newArticle.php?sid=10973"

[[comments]]
order = 4
subject = "فنانه موهوبه"
author = "ايمان كمال"
posted = "2007-07-10"
text = "منه شلبى فنانه بجد موهوبه رغم اى تحفظ على حياتها الشخصيه فى بدايتها لكنها بجد نضجت جدا وتالقت لدرجه انها من اهم الفنانات الموجودين دلوقتى وبالعكس يمكن ناس تانيه واخده وضع اكبر منها زى منى زكى مثلا لكن منه فنانه اكثر موهبه واكثر نضج وعن علاقتها بخالد يوسف مش هى الانسانه الوحيده اللى فى الدنيا اللى زوجه تانيه وكمان الاسلام محرمش ده والزواج افضل من العلاقات المحرمه ومادام هو اختار انه يتزوجها بارداته وهى بتحبه وبالعكس فى ناس بتتجوز واحد متجوز من غير حب وعن موضوع ارتدئها زى اسلامى فى فيلم ويجا انا شاهدت الفيلم اكتر من مره وعلى فكره لو فى اساءه للاسلام يبقى مش من منه يبقى من المجتمع لان فعلا ناس كتير بتلجأ للنقاب والحجاب للسرقه والشحاته ولأى عمل مش كويس كل اللى حصل فى الفيلم انه نقل صوره واقعيه من المجتمع وبتحصل وبدل ما ننكرها وندفن رؤسنا فى الرمل ياريت نواجهها وبدل ما نقول على منه وخالد اساءوا للاسلام نشوف بجد اللى بيهينوا المسلمسن فى كل مكان مش هنسيب الحمار ونمسك فى000000000"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717193712/http://masr.20at.com:80/newArticle.php?sid=10973"

[[comments]]
order = 5
subject = "ردا على اللى مش عاجباه منه شلبي ولا المحرره"
author = "أنا"
text = "ما افتكرشي ان من الاحترام والادب اننا نربط بين النماذج التى تقدمها المحررة وبن اخلاقيتها او انها تشبه النماذج التى تقدمها فعلى سبيل المثال المحامي مثلا يتعامل مع داعرات وفوادين وسوبق مخدرات فهل هذا معناه ان يكون المحامي شبية بالنماذج التى يقدمها قيس على ذلك الكثير يا عم المحترم والمتربي"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717193712/http://masr.20at.com:80/newArticle.php?sid=10973"

[[comments]]
order = 6
subject = "ضع عنوان التعليق"
text = "بصراحة عم الأمور اللي مش عاجبه اني بنتقد منة شلبي و بنتقد المحررة عشان بتكتب عن واحدة زي منة شلبي<br />اولاً احب اوضح انك ترك<br />و حتى لو مش ترك مش مهم<br />احب اقولك اه ان الواحد احيانا كتير بيتأثر بالبيئة اللي حواليه<br />يعني مثلاً الواحد لو فضل يكتب عن داعرات و بين انهم موهوبين فأكيد هو بيتشبه بهم او اتأثر بيهم<br />زي بالظبط مثال المحامي اللي ذكرته يا محترم و بتتهمني اني انا الغير محترم فاه المحامي من كتر ما بيعرف بلطجية بيكون بلطجي زيهم او على الأقل بيتأثر بيهم<br />و لحبي للكاتبه و متابعتي كتاباتها و لرغبتي في ان تتميز لذلك وجهت لها نقد قد يكون عنيف<br />لكني لا أحب الصحافة الصفراء يا متخلف<br />لو كنت تعي ما بين السطور لما اعترضت على ما قلته<br />لكننا نعيب على زماننا و العيب فينا و ما لزماننا عيب سوانا<br />اعلم انك لن تستطيع فهم قصدي و اعلم ايضا انك تحتاج من العمر ما يزيد عن الأربعون ربيعة لتعى ما بين سطوري لكني رغبت في ان اوضح هذا لعلك تستطيع الفهم و ان طال الزمن"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717193712/http://masr.20at.com:80/newArticle.php?sid=10973"

[[comments]]
order = 7
subject = "عااااااااااااو"
author = "العفريت"
text = "انا شايف ان فيه ناس بترد مكان المحررة و واضح ان المحررة بتعرف ترد على التعليقات<br />فبلاش اي عرص متناك يرد مكان حد<br />عشان و الله ههزئ كس امه<br />انا ممكن كمان ارد مكان المحررة و اغلط في اللي بينتقدها<br />بس عايز اقول حاجة الست هانم المحررة لو كانت عايزة ترد كانت ردت هي بنفسها<br />فخليك في كوزك لما نعوزك يا خول<br />و لا انت .... ؟<br />ولا يمكن فيه بينك و بينها حاجة"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717193712/http://masr.20at.com:80/newArticle.php?sid=10973"

[[comments]]
order = 8
subject = "ادي العقد و ادي البروش مبئاش فاضل الا الفنكوش"
author = "الفنكوووووووش"
text = "ايه يا جماعة الهبل اللي انتو عاملينه ده<br />وز ايه قلة الأدب و اغلط اللي ملهوش لازمة ده<br />و انتو ليه تفرعتو عن الموضوع و عمالين تتخانقو مع بعض و كأنه موضوع شخصي<br />بلاش قلة احترام و كل واحد يخليه في نفسه<br />طبعا منة شلبي نموذج غير مشرف لتقديمه بهذه الصورة لكن هذا لا يعطينا الحق في الغلط في شخصيات الكتاب و ان اعطانا هذه الحق بأن ننتقد الكاتب بأسلوب قوي فمن غير المنطقي ان يرد احد على نقد الكاتب نفسه<br />اليست هذه كاتبه و تستطيع ان ترد بنفسها على اي كان؟"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717193712/http://masr.20at.com:80/newArticle.php?sid=10973"

[[comments]]
