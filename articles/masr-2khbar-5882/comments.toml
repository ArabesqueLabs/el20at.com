subject = "اديها كمان حرية"
author = "سيدالخمار"
posted = "2007-05-16"
text = "ياجدعان في عرض النبي سيبو الي يسافر يسافر يعني عصام حيعمل اية لمل يسافر ويرجع ماكل حاجة متراقبة وامن الدولة عارف كل حاجة دا حتي عصام اطيب اخونجي في العلم ومستنير =جدا = واللي يبتعملوة مع الاخوان افضل خدمة وشخصيا شفت وصورت اخر انتخابات وتعامل امن الدولة مع الاخوان خلي الناس تتعاطف معاهم اقسم بالله كانو الناس ياخدوا فلوس مرشح الوطني ويدخلو يصوتو للاخوان ودة اللي حيحصل تاني دة خيرت الشاطر بقي اسطورة بسبب تصرفات غير محسوبة وحتودي البلد في داهية مستعجلة اللي بينجح من الاخوان مش حب ليهم بل كرة وغيظ من الحزب العاكم -بالعين- ع السلطة - انامش عارف لحد امتي اخونا بتوع الامن ياعيني حيفضلو يستحملو ا ليل نهار قلق في قلق -ةالله العظيم ثلاثة كل ما اروح النقابة واشوف لامن قاعد يراقب الصحفيين يصعبو عليا والله شعبنا طيب ياجدعان حلو شوية خلو الامن يرتا والناس ترتاح<br />واخيرا ياريت حد يقرا ويسمع لما منعو عصام العريان من حضور مؤتلامر الحضارات بقت فضيحة بجلاجل لبلد بحالها<br />مش للباشمهندس اللي قررر منع العريان من السفر صورتنا برة بقت طين المؤ تمر تحول للحديث عن مصر والدكتاتورية<br />وووو هيييييية اقولكم منكم للي كلت دراع جوزه وحليت بحماتها"
archived = "2010-03-14"
