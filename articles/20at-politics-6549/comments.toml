[[comments]]
order = 1
subject = "و لكن لا تنتظر من الكلب المسعور إلا العض"
author = "طيف بدر"
posted = "2007-07-04"
text = "حسنا فعلت حماس بالعمل على تحرير المراسل البريطاني فآلان جونستون معروف بحياديته كما لا أجد لخاطفيه عذرا أو سببا لاختطافه بينما أرض فلسطين تعج بملايين الصهاينة اليهود الذين يستحقون الحرق و ليس مجرد الخطف<br />و لكن أقول لرجال حماس و أسود القسام و كافة المجاهدين الشرفاء في أرض فلسطين لا تنتظروا من الكلب الإنجليزي المسعور إلا العقر و قد بدأها وزير الخارجية البريطاني عندما صرح للجزيرة معلقا على إطلاق سراح جونستون : \"نشكر الرئيس محمود عباس على اهتمامه بأمر جونستون !!!\""
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "تثبت الأيام صحة الخيار"
author = "محمد السيد"
posted = "2007-07-04"
text = "نجاح الحكومة في الإفراج عن الصحفي المختطف كفيل بتغيير ولو نسبي في موقف أوربا كلها من حماس والوضع في فلسطين بين عباس ودحلان وبين الحكومة المنتخبة ....<br />وأظن الأيام القادمة حتأكد شيء من هذا التغيير ...<br />بقي شيء ....<br />تسجيل الموقف لحماس ... ومفارنة ما قبل الأحداث ... وما بعدها ...؟<br />هل سؤال ..\" هل أخطأت حماس؟\" ..... سيظل مشروعا ..أو علي الأقل معلقا بدون إجابة ..... \"تعليقا علي موضوع ومن سلطتهم سلط عليهم\" ....<br />يارب مش حاسكت ...<br />تقدروا تنورونا دلوقتي ...<br />http://mesh7askot.blogspot.com/<br />mohamedmat@hotmail.com"
archived = "2010-03-14"
