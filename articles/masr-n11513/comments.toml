subject = "على كل مسلم ان يتعلم دينه فالعلم فرض عين على كل مسلم ومسلمه"
text = "بعد ما قرأت الموضوع لاحظت بعض الاشياء التي تدل على جهل المسلمن بدينه وهذا ليس عيبا في الاسلام ولكن عيب في المسلمين الذين لا يتعلمون دينهم<br />يعني مثلا رائحة الهنود كريهة والاسلام امرنا بالنظامه<br />الايرانيات مش عارف بيعملوا ايه ويسوا ايه<br />والاسلام امرنا بان نتعلم مكارم الاخلاق والسنة النبوية مليئة بذلك<br />فعلى كل مسلم ومسلمة ان يتعلموا اصول دينهم في كل المجالات"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105239/http://masr.20at.com:80/newArticle.php?sid=11513"
