subject = "حق اللا عودة"
author = "ديمة"
posted = "2007-04-25"
text = "ينتهى المقام به فى مصر ... بلا خيبة ده ممكن يتجن ويمشى فى الشوارع يقول جااااى ، ولا العراق ولا مصر ولا الدنيا دى مايرجعش خالص هو ناقص احباط كمان نجيب له سيف دولة منين اخنا.<br />بس الموضوع جميل وانا باحب اقرا شعره بالاساس للانى باحب شخصيته<br />فكرة رفض الاستلاب ـ الاستهزاء بالدنيا ـ الجموح والجنون اللى بطعم الصحرا<br />عجبنى اوى \"كذا انا يادنيا واذا شئتى فاذهبى\" .. شكرا انه كتبها زمان وانك نقلتها عنه النهاردة عشان اقراها دلوقتى لانى كنت محتاجاها اوى"
