[[comments]]
order = 4
subject = "مخيم الفوار _ حارة الامراء"
author = "ماجد رومل الحموز"
posted = "2007-11-03"
text = "لا شك فيه أن المتنبي لن يعود ليعيش في هذا العصر لكن أشعاره التي تحمل من حكم وآراء كأنه يعيش بيننا فهي وثيقة<br />تاريخية وعلمية بما تحمل الكلمة من معنى .<br />فهي تعالج مشكلة نفسية في عصر ساد فيه الجور والظلم ووضع الاشياء في غير موضعها , فيستطيع الإنسان أن ينفس<br />عن مكبوتات النفس و الترويح عنها عند سماع أشعاره التي تعتبر دواءً لكل سقيم.<br />فأشعاره باقية فينا مادام فينا عقول تزدجر وأفئدة تعتبر وأبدان تكفهر فهي باقية فينا لترقي الهمم وترفع الذمم وتجري القمم"
