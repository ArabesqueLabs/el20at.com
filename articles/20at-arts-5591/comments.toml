subject = "الله المستعان"
author = "ayat alla"
posted = "2007-04-25"
text = "وماذا سيقول المتنبى عن كلام العرب اليوم؟<br />وماذا سيقول عما يفعله الشباب بالاستهزاء بالشعر الفصيح وتحويله الى العامية؟<br />أعتقد انه اذا جاء اليوم الى مصر وحاول التحدث مع أحد شبابها الذى لا يتكلم الا باللغة الانجليزية والعامية لن يفهمه أحد وسيطلب مترجم الى اللغة العربية!<br />الله المستعان"
