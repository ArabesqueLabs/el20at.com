[[comments]]
order = 5
subject = "ابو ظبي"
author = "احسان الفقيه"
posted = "2008-06-22"
text = "يا اخي ياعاشق فلسطين ومن منا لا يعشق فلسطين<br />لا اعرف كيف طاوعك قلبك على الحديث بتلك اللهجة القاسية والجارحة<br />نعم هناك الكثيرين من امثال محمد نواف ممن يتحاملون ويشتمون ويجدفون على الغير ويخلطون الحابل بالنابل دون ادنى منطقية<br />اخي الاردن لا علاقة له بالافعال الفردية<br />هناك بالفعل اردنيون مسيؤون كامثالهم من فلسطينيين اساؤا ايضا ولكل عيوبه وخطاياه ولكل طريقه واتجاهه<br />واكرر ان الافعال والاساءات الفردية لا علاقة لها ببلد<br />الاردن قدم بعض الامتيازات للفلسطينيين والقضية الفلسطينية ايضا ساهمت في نهضة الاردن وكلنا يعرف كيف<br />ولكن لا يجوز ان يكون الحوار بهذه الطريقة خاصة وانك شاب جامعي تذكر الله كثيرا ويبدو بانك مثقف ومطلع<br />ارجوك هل تقبل ان يشتم احدهم وطنك لان بعض ابناء وطنك قد اساؤا لك<br />انا اردنية الاصل وزوجي فلسطيني خليلي وصدقني احب حارات الخليل التي لم اتشرف بزيارتها بعد الا انني سمعت عنها من والدة زوجي مثلما احب حقول قريتي الاردنية الوادعة في الشمال<br />اتحدث كثيرا عن اهل زوجي وعن عاداتهم الجميلة واكلاتهم الشهية مثلما استذكر طقوس عائلتي في الفرح والعزاء<br />بلدينا ارفع واسمى من ان ندنسهما بالشتائم ونكران الجميل<br />ارجو المعذرة على التدخل الا انني لا احب ان اقرأ ذلك عنا<br />احسان الفقيه"
archived = "2010-03-14"
capture_url = ""

