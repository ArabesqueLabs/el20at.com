text = "ا ان صدرت الاوامر من الشرموطة رايس بضرورة مسارعة الزعماء العرب لزيارة العراق.. الا وان هب ملك الاردن عبدالله الثاني ليكون اول الذاهبين الى هناك خدمة للاهداف الاميركية والاسرائيلية في المنطقة.. وكونه التلميذ النجيب في مدرسة ابيه واجداده التي سارت على خط العمالة والخيانة منذ حسين بن علي مسقط دولة الخلافة العثمانية الاسلامية ومنذ عبدالله الاول بايع فلسطين مقابل انشاء كيان له ولاولاده في شرق نهر الاردن في منطقة صحراء فلسطين وبادية الشام<br />هذا هو دور هذه السلالة والتي وجدت شعبا اسموه الشعب الاردني وهم من البدو الرحل والسقط وجدوا شعبا تافها لا يفقه ثلث الثلاثة في السياسة بل لا يعرف كيف يخرة وجدوا شعبا كالحمار ان تحمل عليه يلهث وان تتركه يلهث.. فطال بهم الحكم وسيطول ما دام يوجد بين الشعوب العربية شعب اسمه الشعب الاردني"
