subject = "اخوي مشعل الحارثي"
author = "عبدالله السبعاوي"
posted = "2008-08-15"
text = "من سبعان الغلبا القروم لأهل فلسطيني<br />أهل الكرم والجود والأفعال النبيله<br />جيت أمدحكم بالقصيد وادري فيه تقصير<br />لكن خير الكلام ما فـــادك قليله<br />جيت أمدحكم أنتم لأنكم أنتم غيــــــر<br />رجالكم اللي أفعاله مالها حيلة<br />من عرفكم درى الدنيا بهـــــا خيـــر<br />ومن جهلكم راحت حياته فشيله<br />أعرف منكم واحد لكن توه صغيـــــر<br />لكن والله انه يسوى بعيني قبيله<br />لامن جيت أعتزي به فز لي مغيـــــر<br />وجاني كالحصان اللي يسمع صهيله<br />جاني وعلى متنه الغض يسوق التباشير<br />جاني وعيونه السود تقدح كالفتيله<br />أحبه حب الصقارة لمخـــــــاواة الطير<br />وأعشقه عشق الأجاويد راعين الطويله<br />يشوقني له صدق المشاعر والتعابير<br />اللي تدفعني لشوفه وأتعنى وأجيله<br />لبيك ياللي غلاك في داخلــــي بيــر<br />لبيه ياللي القصايد لوصفك جزيله<br />وأنا ولابتي كبير القوم والا صغيــــر<br />نفخر بعرفك ولاندور غيره والا بديله"
