subject = "إلى إدارة الموقع!!!!!!!!!"
author = "مسلم"
posted = "2008-06-07"
text = "بسم الله ،<br />أحببت فقط أن أنوه تنويها بسيطا لإدارة الموقع ، بالتحكم بالتعليقات الواردة على المقالات أو المواضيع المطروحة ، فللأسف ، يوجد الكثير من الإساءات والكلام غير اللائق داخل تلك التعليقات .....<br />أقول : أنه موضوع رائع ، وجاء في وقته ، فإن كثيرا من الشباب يعانون من هذا الفتن التي ابتلينا بها ، فأعان الله الشباب على ما يرونه من مصائب .<br />وأنصح أخواتي الفتيات أن يتقين الله عز وجل ، فتدمير المجتمع ونشر الزنا والرذيلة عن طريق اللباس الفاضح ليس أبدا من الحرية الشخصية ، وإلا فلم حرم الله التبرج والتزين أمام الأجانب ؟؟!!!<br />ولأخي الذي يعتبر أن هذه إساءة للبلد ، فأنصحك أن تقرأ النص مرة ومرتين وعشرا ، لتستنتج أنه طرح لحل قضية ليست في الأردن فحسب ، بل في أغلب البلدان الإسلامية ، وكفاك عنصرية ، فهي لا تليق بشاب مسلم ,,, وأرجو منك تقبل كلامي بصدر رحب وأن لا تفهمه كما فهمت النص المطروح ...<br />أدعو لكم دائما بالتوفيق والسداد...."
