subject = "تصفية خلاف شخصي"
author = "احسان الفقيه"
posted = "2008-06-30"
text = "من الواضح ومن خلال قراءة تعليق كل من الاخ محمد نواف والاخ عاشق فلسطين او فلسطيني او ان كانا اثنان من الواضح ان هناك خلال شخصي<br />الخلافات امر طبيعي وصحي بين كل المخلوقات والشعوب وحتى الاشياء العادية تتداخل فيما بينها تتمازج او تدحض احدها الاخر ولكن في النهاية هناك نتاج حضاري<br />ارجو من الاخين المذكورين اعلاه ان يتنبهان الى ضرورة ازاحة الحديث عن الاردن وفلسطين وسياسة البلدين مادام هناك جدلا قائما اصلا بينهما بفعل خلاف ما لا علاقة به ببلدين<br />علاقة الاردني بالفلسطيني او معاملة الاردن للفلسطينيين مسألة اكثر تعقيدا من كل هذا الكلام السطحي والاحكام الانفعالية التي يطلقها كل منكما لخلاف شخصي<br />ارجوكما لاداعي ان تضحكوا علينا شعوبا اشد سخافة وتفاهة من ان يفتحوا الانترنت ويقراوا ان بيننا هذا الجدل قائم على مسألة حساسة لا داعي لتدخل قليلي الخبرة فيها<br />احسان الفقيه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 13
subject = "إلى الأخت / إحسان الفقيه"
author = "محمد نواف"
posted = "2008-07-05"
text = "إلى سعادة القاضي .. احتراماتي أولاً ..<br />قبل أن تطلق حكم القضية بيني وبين النكرة ( عاشق فلسطين ) .. سوف أوضح لك أمور وأشياء في غاية الأهمية ,, التي تكشف وجهاً آخر لهذا السفيه ,, مزيله بذلك القناع المخملي الذي كان يتكلم من خلفه ،، هو يظن أنه ذكي ،، مراوغ ،، لعوب ،، ولكن أين هو وأين الذكاء ؟؟<br />أنا _ شخصياً _ لم هذا الهجوم الشرس المباغت الذي أعلنه ( عاشق فلسطين ) عليّ !!<br />ولم أنا بالذات !!<br />وفوق كل ذلك يقول لي بتعليقه السابق ( شفت كيف إنو الحقيقة بتزعل ) , أي حقيقة يتكلم عنها هذا المغفل ؟!<br />وهنالك الكثير من المغالطات والتناقضات السلبية العشوائية الرجعية التي لا يتفوه بها إلاّ المجنون ( عافاكٍ الله أختي ) !!<br />أضيفي إلى ذلك الخطاب الموجه لي بألفاظ سوقيّة ,, وكلمات بذيئة تخدش الحياء وتحدث به شرخاً واسعاً كبيراً !!<br />زيدي على ذلك الأسلوب الجنوني الذي يتكلم به !! كأنه يشعرني بأنني قد قتلت له أبيه أو أخيه أو أي أحد عزيز عليه !!<br />أختي ..<br />وليست هي الصفحة الوحيدة ( فتيات الأردن : سامحني يابابا ) التي يضع فيها التعليق السخيف الخاص به ,, هنالك عدة صفحات قمت أنا بالتعليق عليها ,, إلى أن قام هذا الأخير ( عاشق فلسطين ) بوضع تعليقه عليها !!<br />أختي ..<br />أنني أشفق عليه وعلى وضعه \\\" المأساوي \\\" .. يوم عن يوم هو يثبت لي بأنه (( لا زالت الحمير تعيش في وطننا العربي الممتد )) ..<br />أنا أدعوه إلى زيارة أقرب طبيب نفسي لكي يشفيه من مرضه اللعين (( مرض جنون العظمة والإضطهاد )) ..<br />إلى عاشق فلسطين ..<br />أرجو من حضرتكم توضيح مسألة هذا الهجوم علي أنا ( محمد نواف ) لا لسبب يذكر على الإطلاق !<br />قل لي ما الخطأ الذي ارتكبته يا مغفل ,, وسوف نتحاسب بإذن الله ,, أساساًَ لا يوجد خطأ قمت به في حقك ؛ لأنني أعرف ما أقول ,, وأعرف ما أتفوه به ,, وأنا لا أقول قولاً عبثياً ( مثلك تماماً ) ,, ولا أذكر نهائياً إنني قمت بمجاراتك أو حتى التقرب منك في أي موضوع من المواضيع !<br />لنا عودة بحول الله ..<br />من هنا ,, إلى أن نلتقي لكم مني أحر التحايا وأطيبها ...<br />والسلام عليكم ,, محمد نواف"
archived = "2010-03-14"
capture_url = ""

