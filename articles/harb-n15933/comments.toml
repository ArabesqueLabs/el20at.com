[[comments]]
order = 7
subject = "إلى النكرة \" اللاشيء \" : عاشق فلسطين !"
author = "محمد نواف"
posted = "2008-06-23"
text = "إلى عاشق فلسطين ... وخسارة بيك هالإسم !!! أمثالك لا يكونون ولا يتواجدون إلاّ بالمزابل التاريخية لكي يكون التاريخ والبشر شاهدين على نضحهم (( حدّث ولا حرج )) .. على مر العصور والأزمان !!!<br />لقد تفلسفت بجهل طاغي .. ولا أعرف حقةً ما دواك ؟؟؟ أنني لو أردت _ فعلاً _ أن أجرحك وأهينك وأقلل من قيمتك ومقدارك ووزنك لفعلت ذلك من زمان !!! ولكن أخلاقي وقيمي ومبادئي التي نشأت بها ,, وترعرعت عليها ,, لايمكنني نسيانها أو تجاهلها _ بأي حال من الأحوال _ .. أضف إلى ذلك العادات والتقاليد الأصلية التي ورثتها عن أجدادي وأسلافي السابقين _ رحمهم الله أجمعين _ .. وها أنا أكررها أمامك وأمام الكل أنك لست سوى \" حمار ينعق ليل نهار \" !!<br />وللعلمك فقط لاغير كلامك هذا كله ,, لا , ولن , ولم يؤثر بي إطلاقاً .. ولم يهزز لي شعرة نهائياً ,, بل هذا عين التخلف والبلاهه !!<br />ومن الطريف أيضاً أنك تقتبس من أقوالي كثيراً وتضعها في تعليثاتك النتنه \" المتنوعة \" و\" المتعددة \" في كثير من صفحات موقع عشرينات (( وخصوصاً الصفحات التي زرتها أنا ,, وقمت بالتعليق على مواضيعها )) .. وطبعاً هذا إن دل على شيء فإنه يدل على مدى جهلك المدقع ,, وحماقتك العوجاء ,, وغباءك المتزايد ,, وإنحطاطك الدائم !<br />أرجو من حضرتكم .. أن تتكلم بأسلوب حضاري قليلاً \" عشانك من عشاني \" لأن هذا أسلوب أناسّ متخلفين وأخشى أن تكون منهم يا حذق !!<br />وتقول بأنك إنسان جامعي .. أبالله عليك هذا أسلوب إنسان جامعي ,, واعي , مدرك ذا كان هكذا هو أسلوب الجامعيين << فسحقاً له من أسلوب ونمط مغاير للتقافة والمعرفة إذن !!<br />حقيقةً ,, أستغرب وأندهش كثيراً من هذا الطفل البائس ..<br />سلام اللهــــــ عليكم ,,,<br />محمد نواف ,,,"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "تابع لتعليقي السابق ......"
author = "محمد نواف"
posted = "2008-06-23"
text = "... وأيضاً تملك كثير من الأسماء المستعارة يا \" عاشق فلسطين \" ..<br />اسمك الذي تعلق به في كثير من الأحوال ,, هو \" عاشق فلسطين \" ..<br />وأيضاً لك أكثر من اسم مستعار ..<br />في هذه الصفحة على ما أعتقد لك اسم مستعار هو : - (( فلسطيني )) ..<br />يا عاشق .. لعبتك مكشوفة وواضحة !!<br />كفاك خداع على نفسك وعللينا !!<br />وللعم فقط بأنك لك أيضاً أسماء كثيرة مستعارة في (( أرفع رأسك أنت فلسطيني )) ,, و(( هوشات طلبة الأردن )) ,, والكثر الكثير .... فلا تتذاكى علي !!!<br />وهذا أيضاً أمارة من أمارات الغباء والنفاهه التي تسري بدمك يا نكرة !!<br />خسئت أنت ,, ومن معك ,, ومن سار على شاكلتك ,, ومشى مثلك أن تتذاكي على من هو علمك كيف تنطق وكيف تتكلم وكيف وكيف وكيف .. أيس كذلك !!<br />أغرب عن وجهي ..<br />جاهل لا يدري في أي بقعة وضعه الله !!<br />ولي عودة في القريب العاجل ,,<br />تحياتي ,,<br />محمد نواف :-)"
archived = "2010-03-14"
