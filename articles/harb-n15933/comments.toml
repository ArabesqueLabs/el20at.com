text = "السلام عليكم ,<br />والله لما شفت هذا الكلام اتعجبت لانو وين ماتروح على اي موقع او منتدى اردني او فلسطيني بتلاقي هذا الحديث وهوة حديث العنصرية, والله عيب عيب عيب هل تناسى كل من الطرفين انو نحن قبيلة واحدة وانساب ومصاهرة وعشيرة فلانية في فلسطين واخرى بالاردن بالاردن وهل تناسى الطرفين انو بالجيش الاردني وبالامن العام وقطاع التعليم والاجهزة الحكومية بشكل عام اشخاص من الطرفين يعني نحن شعب واحد ,<br />في شخص من المعلقين كاتب يقول احمدالله انو اعطيناكم الجنسية احب اقولك ياقرابة انو اللي تقول عنهم يحملون الرقم الوطني وانت تعرف ايش يعني الرقم الوطني يعني لو بدك تحمل جميلة للفلسطيني رح نمسك اللي هما من اصل شامي ونحملهم جميلة ونمسك اللي هما من اصل سعودي وغيرهم كثير يعني عيب هذا الحكي,<br />لازم نحمدالله اننا شعب واحد تحت قيادة حكيمة بقيادة جلالة الملك المفدى ونبعد عن هذي النعرات العنصرية ونفكر كيف نواجه ازمات الحياة وكيف نعمر ونرفع من شان الاردن مو نخلي الناس تضحك علينا ,<br />ولافرق بينا عربي واعجمي اللا بتقوا الله<br />السلام عليكم<br />اخوكم / محمد الرواجبة"
