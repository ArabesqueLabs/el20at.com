[[comments]]
order = 1
subject = "ولك شو مالك أنت (( تامر الصمادي )) ؟؟؟؟ !!!!!"
author = "محمد نواف"
text = "ولك أنت واحد مابتستحي وشو هاذ اللي كاتبه ؟؟؟؟<br />ولك روح انتحر مشان الله ؟؟؟؟<br />ولك أنت واحد فاظي وماعندك سولافه ؟؟؟<br />ولك روووووووووووووووووووووح<br />انت واحد لا مابهمو إلا نفسو<br />اسمع ؟؟<br />أنت اصلاً مابتشرفنا كونك أردني حيث إنك لاتمت للأردن وشعبها بأي صلة أنت واحد خارج عن الماهية ؟؟<br />وافهمها عاد شكلك من تبعوووووووووووووووووووووووووووون ........................ أنت عارف شو بقصد .. ؟؟ !!!"
archived = "2008-06-22"
capture_url = "https://web.archive.org/web/20080622185231/http://www.harb.20at.com:80/newArticle.php?sid=15933"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "الموضوع ده موجود في كل البلاد<br />ماكانش المفروض تنسبه للاردنيين بس<br />عامة ده جزء من انحدارنا الأخلاقي<br />ربنا يسترها علينا ويهدينا جميعا"
archived = "2008-06-22"
capture_url = "https://web.archive.org/web/20080622185231/http://www.harb.20at.com:80/newArticle.php?sid=15933"

[[comments]]
order = 3
subject = "لا مش كذب"
author = "احمد الســـــيد"
text = "لا مش كذب يا أخ يا أردنى أنا صاحب جروب على الفيس بوك لأجمل بنت عربية وأكتر بنات بتشترك معيا أردنيات ... ولابسين حاجات غريبة .... ماتشوف الأول البنات الى عندكم وتعالا إتكلم ... عيب عليكم بجد !!!!"
archived = "2008-06-22"
capture_url = "https://web.archive.org/web/20080622185231/http://www.harb.20at.com:80/newArticle.php?sid=15933"

[[comments]]
order = 4
subject = "إلى إدارة الموقع!!!!!!!!!"
author = "مسلم"
text = "بسم الله ،<br />أحببت فقط أن أنوه تنويها بسيطا لإدارة الموقع ، بالتحكم بالتعليقات الواردة على المقالات أو المواضيع المطروحة ، فللأسف ، يوجد الكثير من الإساءات والكلام غير اللائق داخل تلك التعليقات .....<br />أقول : أنه موضوع رائع ، وجاء في وقته ، فإن كثيرا من الشباب يعانون من هذا الفتن التي ابتلينا بها ، فأعان الله الشباب على ما يرونه من مصائب .<br />وأنصح أخواتي الفتيات أن يتقين الله عز وجل ، فتدمير المجتمع ونشر الزنا والرذيلة عن طريق اللباس الفاضح ليس أبدا من الحرية الشخصية ، وإلا فلم حرم الله التبرج والتزين أمام الأجانب ؟؟!!!<br />ولأخي الذي يعتبر أن هذه إساءة للبلد ، فأنصحك أن تقرأ النص مرة ومرتين وعشرا ، لتستنتج أنه طرح لحل قضية ليست في الأردن فحسب ، بل في أغلب البلدان الإسلامية ، وكفاك عنصرية ، فهي لا تليق بشاب مسلم ,,, وأرجو منك تقبل كلامي بصدر رحب وأن لا تفهمه كما فهمت النص المطروح ...<br />أدعو لكم دائما بالتوفيق والسداد...."
archived = "2008-06-22"
capture_url = "https://web.archive.org/web/20080622185231/http://www.harb.20at.com:80/newArticle.php?sid=15933"
