[[comments]]
order = 9
subject = "رد على الكلب السلوقي المنحط المنحل الهمجي البجمي ا"
author = "عاشق فلسطين (شكرا للحقيقة , هه"
posted = "2008-06-25"
text = "شفت كيف إنو الحقيقة بتزعل , ما طبعا عاملي حالك هونه كاتب من الكتاب ولا شاعر المليون , ولسة وراك وراك , وأنا رح أحلف<br />وهاد شرف إلي والله إني أحلف بأني هونه ما إلي ولا إسم مستعار , والله طلعت حمار وكلب أبا عن جد , حبيبي , التعليق هاد<br />تبعي بنتشر تلقائيا بأي صفحة بتخشها بواسطة برنامج عندي بنشرها تلقائيا , لا وأزيدك من الشعر بيت البرنامج بتسأدن مني إنو<br />يحط التعليق , وبلاحقك بأي موقع إنتا موجود فيه , وأكبر دليل , لحقك بموقع موالاي لكنو ما قدر يحط الموضوع أو التعليق عشان نفس الموقع مانع يحط روابط بالتعليق , والبرنامج الله يسعدو لحقك بمدونات مكتوب تبعت الشعر المكتوب باسم بنت بلادي وراح حط التعليق لحالوا وأكبر دليل إنو البرنامج هيك عمل مكتوب بأعلى التعليق :<br />@@تم تحديث التعليق بنجاح@@ @@Comment has been Refreshed Successfully@@<br />يعني هيك ولا هيك ملاحق ومطارد , وفوق هاد كلو أمرت البرنامج يبحث عن أسمائك المستعارة بالمنتديات وذلك عن طريق الآي<br />بي تبعك , وصدقني أول ما رح أوصلك بأي منتدى رح أعمل سبامات spam أفضحك فيه يا كلب , بس اصبر علي .......<br />والله لأفضحك بكل موقع يا كلب يا بن الكلب ورح أهينك .......<br />الحمد لله إني شرشحتك , يلا عاد افحمني وقلي وين أسمائي المستعارة بصفحات عشرينات .......<br />والسلام على من اتبع الهدى"
archived = "2010-03-14"
