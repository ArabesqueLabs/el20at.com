text = "سجل ودون أنا فلسطيزي<br />بِعْتُ أرضي و شرفي بالـ Easy<br />وكُل واحد منا يقول زيزي<br />ما راح نرجع و نعود حتى لو ناكونا من طيزي<br />بِعْنا شرفنا و عَرْضنا بحبة موزي<br />لأننا كما قال القذافي شعب حقير و غبي و Crazy<br />نحن شعب الحفارين شعب الله المحتار و شعب Lazy<br />شعب كل رجالنا منايك و كل حريمنا شراميط، شعب اكبر Mazy<br />شعب ما بيستاهل يعيش لأنو شعب Hazy<br />نحن شعب خرة عايش على الرقص و الــ Jazzy<br />شعب عميل و سافل و يستاهل يموت ببندقية عوزي<br />العمليات الانتحارية ما تفيد يا عزيزي<br />حتى لو نكحونا على سجاد كاشاني و تبريزي<br />لؤماء و حقراء نحن بالفطريزي<br />الكل يكرهنا من العربي للماليزي<br />و من الافريقي و الاسترالي إلى الانكليزي<br />والمسلم والمسيحي و اليهودي و الهندوزي<br />مذكورين و معروفين بحقدنا حتى بتاريخ المقريزي<br />من طاح حظنا من الحمار عرفات للكلب حسن اللوزي<br />و من الخصوة أحمد ياسين و الحقير الفطيسة عبد العزيز الرنطيزي<br />و من السافل أبو اللطف القدومي الى الخنزير محمود عبوزي<br />و من اللئيم شعث الى الفاسد احمد قرعوزي<br />و من القحبة سها عرفات و الشرموطة حنان عشروزي<br />و من الشاذ أبو هنية و محمد دحلان القرقوزي<br />و من الملعون كنفاني للراقصة ليلى خالد سوزي<br />شعب خرة كله من الحقراء و السفلة يستاهل ينداس بالصرماية القديمة<br />سجل و دون أنا فلسطيزي حد النخاع<br />كلنا جبناء مثل الخراف عندما تقول ماع ماع<br />أرضنا و كرامتـنا و شرفنا كلها في خبر كان باع باع<br />و طيزنا مفتوح لا يفيد معه حتى اكبر الرقاع<br />نساؤنا شراميط يـبعن شرفهن من اجل النحاس اللماع<br />و هن اكبر مصاصات للأيـر و للخصية بلاع<br />شعب خرة و يستاهل يعيش بس في القاع<br />كل فلسطيزي هو حشرة ضارة بلا نفاع<br />سيأتي يوما و نُـنْـحر أنصاف و أرباع<br />شعب من الأنذال نحن و من إير الحمار لم نصل إشباع<br />و دائما متسولون و شعبا فلسطيزيا منحطا و كلهم جياع<br />يا رب اذبحنا واحدا واحدا بيد شارون الحبيب الشجاع<br />شعب سخيف و حماسنا و جهادنا الإسلامي بلا سماع<br />من الفطيسة احمد ياسين و الجيفة الرنتيسي المُـضياع<br />كل فلسطيزي هو خرة و لا يُـستساغ حتى لو خللوه بالنعناع<br />و يجب أن يكون قـتـلكم و نحركم و ذبحكم حلالاً زلالاً و مُـشاع<br />شعب خرة كله من الحقراء و السفلة يستاهل ينداس بالصرماية القديمة"
archived = "2010-03-14"
capture_url = ""

