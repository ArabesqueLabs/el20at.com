subject = "قريتها قبل كدا وجامدة جدا"
author = "Che The Sad"
text = "جامد جدا البوست دا وبالنسبة للى بتسأل مش فاهمة واحنا مالنا<br />يا ستى دا بوست من مدونة وكل واحد بيكتب في مدونته اللى هو عايزه ومش اللى الناس عايزاه<br />وان الموقع خد البوست دا وحطه هنا دا لأنه حلو وعجبهم ..... بس كدا<br />تشي الحزين"
archived = "2007-10-16"
