subject = "امكانيات الدولة مخصصة للصرف على الامن المركزى"
author = "لية"
posted = "2008-12-21"
text = "طبعا القصر العينى معذور - هيجيب فلوس من اين ؟<br />الدولة شالت ايدها عن كل حاجة وبتصرف فقط على الامن المركزى والقصور الجمهورية والضيوف فى شرم الشيخ<br />فمدير القصر العينى لازم يشوف ايرادات علشان يستمر فى العلاج للمرضى الفقراء<br />انا اجد لة العذر<br />والمفروض القصر العينى يجمع تبرعات زى مستشفى السرطان بتاع الاطفال<br />طبعا المركب لازم تمشى<br />ربنا يقوى دكاترة القصر العينى المكافحين"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223152248/http://masr.20at.com:80/newArticle.php?sid=18905"
