text = "الجزائر يقولون عنها عاصمة لثقافة العربية ولكن هيا لاشيئ بين الدول الاخرى بالنسبة الى الثقافة فالاكثرية من شعبها جاهل لايعرف شيئ شعب الجزائر شعب في الحقيقة يحب المصالح كثيرا في كل سواء في الزاج او الشغل او اي شيئ لكن الحمد لله مازال فيهم درة الكرام والنبل اتمنا ان يغفر الله لقونا ويهديهم طريق الخير يا رب امين مرسل من امير من عنابة"
