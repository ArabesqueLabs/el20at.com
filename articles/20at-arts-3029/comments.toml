[[comments]]
order = 2
subject = "الجزائر"
author = "عبد القادر"
posted = "2007-12-13"
text = "اية ثقافة تتحدثون عنها، الجزائر اصبحت تعاني من الإنسلاخ الثقافي والجزائر عاصمة الثقافة العربية ما هي الا محاولة يائسة من طرف بعض الأطراف لتبييض صورة الجزائر امام الامة العربية فقط، الجزائر عاصمة للثقافة الفرنسية بإمتياز فالفرنكوش تمكنو من دواليب السلطة في الجزائر بمساعدة ابناء فرنسا ولامكان بعد ذلك للمعربين، فيكفي ان تكون معربا حتى تتعرض للإقصاء والتهميش.<br />لقد كان وما يزال المعيار الوحيد للوصول الى مناصب عليا في الدولة مقصور في غالب الاحيان على المفرنسين واكثر من ذلك المتشبعين بالثقافة الفرنسية، والعمل جاري اليوم لتقويض كل محاولة لإعادة الجزائر الى الطريق الصحيح في ركب الأمة العربية والحديث اليوم عن اصلاح المنظومة التربوية بالجزائر حيث تم تغيير التعليم الاساسي بالتعليم المتوسط وفي الحقيقة هو القضاء على كل ما يشتم فيه رائحة الإسلام والعروبة بحجة ان المدرسة الاساسية كانت وراء الإرهاب الذي تعاني منه الجزائر، وهي كلها افتراءات ليس لها اساس من الصحة بل القصد من وراء كل هذا هو التمكين اكثر لحزب فرنسا بالجزائر واسألوا وزير التربية الجزائري حول محاولة وزارته تعليم ابنائنا اللغة الفرنسية في السنة الثانية من التعليم الإبتدائي وإلغاء مادة الشريعة الإسلامية من مقررات التعليم الثانوي،وتغيير المناهج التربوية والتعليمية وإدخال اللغة الفرنسية في تدريس المواد الأساسية بعدما كانت معربة 100%، وانتظروا ما سيحل بالمنظومة التربوية في الجزائر في ظل سلطة تحتكم في قراراتها الى الإليزي..."
archived = "2010-03-14"
