subject = "ثقافة أم ما هدا"
author = "هاجر"
posted = "2007-02-10"
text = "في الحقيقة أنا جزائرية و تابعت مجريات هده الثقافة رغم أني أعتز بانتمائي كجزائرية و عربية الا أني لما رأيت الثقافة التي يتحدثون عنها خجلت هل الثقافة رقص و غناء وطرب فقط ؟؟؟؟؟؟؟؟؟؟؟؟؟وا أسفاه على ما آلت اليه أحوال الأمة نجح الغرب في تخديرنا وتشغيلنا بالتفاهات لينالوا من أقصانا من عزنا و مجدنا اللهم اغفر لقومي فانهم لا يعلمون"
