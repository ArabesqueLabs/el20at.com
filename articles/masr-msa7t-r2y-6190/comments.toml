subject = "اجيال الوكسة"
author = "ابو اسامة"
posted = "2007-06-16"
text = "جيل ايه يا استاذ قول اجيال فمنذ ان حكم العسكر ومصر فى وكسة لم تخرج منها الى الان بس دالوقتى الوكسة<br />بقت عريانة يعنى عينى عينك ايام جمال كانت مدارية فى القومية العربية والمساواة والسادات كان مدارى فى حرب اكتوبر<br />ولو انه باع كل الشهدا وعمل صلح مع الخنازير انما حسنى الاهبل واللهى انا اما بشوفه بحس بكده انه راجل غبى واهبل<br />بيحكم ناس اهبل منه وسابوه ينهب ويحكم الىما شاء الله ووكستنا معاه بقت على عينك يا تاجر وطبعا كلكم مش عاوزين<br />تعرفوا الوكسات بتعته لانكم كلكم مجربينها يا شعب جبان وعبيط"
