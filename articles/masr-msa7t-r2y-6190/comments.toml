[[comments]]
order = 12
subject = "النكسة"
author = "راجل عجوز"
posted = "2007-06-09"
text = "النكسة حصلت وانا شاب<br />لم نبكى ولم نصرخ كلنا رحنا الجبهة وكلنا حاربنا من ابن الغفير لابن السفير لان ايامنا كان فية مساواة<br />فى الجبهة كنت جامعى وكان معايا الفلاح والصعيدى والبحراوى والمسيحى واللى معاة دكتوراة<br />وكان فية وظائف لكل خريج<br />وكان المرتب بيكفى تحوش شبكة محترمة ومهر وتدفع ايجار شقة وتتجوز وتعيش مستور<br />كان كل اللى فى بيوتنا انتاج مصرى مصنوع بايدى مصرية التلاجة ايديال والتلفزيون تليمصر او فليبس والاتوبيس اللى بنركبة مصنوع فى النصر للسيارات<br />كان عندنا عزيز صدقى وصدقى سليمان وعثمان احمد عثمان<br />وكان فية مصانع بتتبنى فى البلد لتشغيل الشباب<br />وكان المصرى لما يسافر بلد عربى بيقابلوة فى المطار ويحترموة<br />انما انتم عملتم اية<br />بعتم البلد لليهود والعرب<br />واجرتوها مفروشة للغرب والعرب<br />وعايزين اية غير الفقر والصياعة والضياعة<br />كفاية عليكم انتاج البانجو وشرب الحشيش<br />انتم جيل موكوس ومفروس ومش فاهم اى حاجة لانة لا يوجد احد يخطط فى مستقبل هذا البلد<br />المصير هو الضياع ومزيد من الفقر<br />ولا ارى لكم اى امل قريب"
archived = "2010-03-14"
capture_url = ""

