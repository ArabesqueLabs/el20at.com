subject = "من جيل النكسه لجيل الوكسه"
author = "نيفين نيفى نوفا"
posted = "2007-06-14"
text = "تعرف يا استاذ احمد (و الموضوع جميل طبعا)اكبر دليل على كلام حضرتك انى كنت دخلت محل و لقيت واحد بيقول لصاحبه اانهارده كام قاله 5 قال ياه ده انهارده ذكرى النكسه فالتانى قاله نكسه ايه قاله متعرفش النكسه و التانى رد لا نكسه ايه و مكملتش الحديث لانه ف العاده كان هينتهى بان الصديق الجاهل هيقول ف النهايه نكسه ايه بلا وكسه<br />still فرق كبير بين جيل النكسه (اللى كانت الكلمه الصحيحه ليها الهزيمه و لكن عدلت لتخفيف الذنب عن صاحبنا)و جيل تائه يبحث عن معتقدات او قضايا يعيش من اجلها"
