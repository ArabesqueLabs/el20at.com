posted = "2007-06-05"
text = "فعلا فرق كبير بين شعب كانت فيه نكسه وكان عايز ينهض بامه وشعب حياته تدور حول الوكسه ززالوكسه المنزليه في الشار والشغل<br />بس انا منت بفكر زيك كدا استاذ احمد ولسا عندي حبه احباط من الوض بس بصراحه معنجيش يأس قررت وانا لسا في تانيه كليه حاليا اني اعمل مشروع صغير وانا كل اللي محوشاه 300 جنيه متستغربش ممكن يمون المبلغ قليل بعد عصير مخ عملته لنفسي هحك رجلي علي اول طريق حياتي اني اعمل مشروع ضغير علي ادي وهقول رزقي علي الله وهتوكل عليه اهو هو بس اللي معندوش وكسه لحد بيشتغل وبيتعب ولا عنده توريث ولا عنده حاجه غلط مش مكن مش ممكن مش ممكن ربنا هيضع شغلك صدقني لو حتي ال 80 ميليون اللي في بلدنا فاسدين تلاقي مكانك ...وبلاش بقي نقول بلا وكسه"
