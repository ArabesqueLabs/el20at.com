subject = "جيل مقهور"
author = "جاسي"
posted = "2007-06-06"
text = "على فكرة يا أستاذ أحمد انت واقعي اوي وبصراحه الموضوع هايل في ظل الحياة الموكوسة اللي بلا معني التي نعيشها وكإننا في دوامه لن نعرف متى نفيق منها ده إذا كانت في إفاقه وانا عايزه اسألك سؤال انت ليه مبتكتبش كتير بصراحه انت بتعبر عن جيل وبنعتبر ان قلمك ده ناطق بلسان جيل مقهور فارجوك لا تتوقف فانا إنسانه حقا أشعر بالضياع حياة رتيبة وتفتقد لادني مفاهيم السعادة التي حاولت ابحث عنها كثيرا لكني فشلت في ان انولها وكإنها حلما بعيد المنال حلم اقسم لن لا يتحقق حلم بات محكوما علية ان يظل حلما ليس إلا .<br />الحياه كما قيل في احد الافلام هل هي حقا منتهي اللذه تعرف ان منتهى اللذه عندي حينما اعمل اجتهد لكنى فجأه افيق على كابوس وحلم يتحطم في ظل الواسطة والبراطية والشللية التى باتت في غمضة عين جزأ لا يتجزأ من حياتنا فما فائدة العمل إذم وما فائدة ان انحت في الصخر حتى اظل على صلة ولو ادنى صلة من بعيد مع الحياة .<br />ارجو ان تقول لي كلمات اشفى بها مما انا فية فقد اصبحت ضائعة هائمه في دنيا المستحيل وعلى رأيك انه حقا جيل لا يملك من الدنيا سوى ان يظل موكوس ومنكوسفي ذات الوقت."
