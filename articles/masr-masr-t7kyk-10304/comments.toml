text = "ترخص لية ؟<br />وهل حدث سابقا ان فية حاجة رخصت<br />البترول سعر البرميل كان ب 150 دولار الان البترول بسعر البرميل 60 دولار هل لتر البنزين هيرخص ؟<br />ها احلق شنى والبس طرحة زى النسوان لو لتر البنزين رخص"
