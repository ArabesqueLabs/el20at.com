[[comments]]
order = 10
subject = "0104803263"
author = "محمد عل الحداد"
posted = "2008-10-31"
text = "تعددت الاراء ولكن من هى البنت المؤدبه ؟؟ سؤال سيعتمد اجابته على نوعيه المتحدث وبيئته وثقافته وديانته كل شئ فيه سيحدد ما هى البنت المؤدبه .<br />يعنى عندنا فى ناس تقول البنت المؤدبه هى اللى مابتكلمش ولاد ولابسها كويس يعنى مش ضيق بقى وكده وتقوله بس يقولك اه طيب والصلاه اخبارها ايه مش مهمه ولا ايه يبقولك اه دى اه برده طيب وكذا يقولك اه برده صحيح<br />هى تختلف من نوعيه لأخرى انا عندى البنت المؤدبه هى التى لا تتجمل لرضاء عامه الناس ولا اقصد المظر اقصد الجوهر يعنى ما تعملس فيها مكسوفه وهى اصلا بتتكلم عادى يعنى دى حاجه تدل على انها على استعداد تخدع فى اى حاجه تانيه تبقى مش مؤدبه موضوع الصلاه والاخلاق دى حاجه منطقيه لازم تبقى فى كل الناس المحترمين<br />انا ضد التجمل من اجل ارضاء غرور الاخرين"
archived = "2010-03-14"
capture_url = ""

