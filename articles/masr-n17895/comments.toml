[[comments]]
order = 3
subject = "ما يقع الا الشاطر"
author = "meda"
text = "مفيش بنت مؤدبة ولا مش خبررة<br />كلهم زي بعض<br />اول لما تتعرف عليها تبقي المودبة المحترمة وبعين تحاول تدبسك في الجوازة من غير حتي متتعرفو علي بعض كويس"
archived = "2008-10-17"
capture_url = "https://web.archive.org/web/20081017091922/http://masr.20at.com:80/newArticle.php?sid=17895"

