subject = "عن الموضوع"
author = "محمود عبد الله"
posted = "2008-11-13"
text = "ما أعرفش لأني ما إتعاملتش مع بنات سواء في الشغل أو في الكلية أو في المدرسة<br />كله هيبان في حالة واحدة وبس لو إتعاملت مع البنت دي فترة طويلة من الزمن أكيد كل يوم هتكتشف حاجة<br />وتعرف إذا كانت هي مؤدبة ولا لأ بس حبيت إني أقول إنه موضعكم جميل جدا وشكرا"
