subject = "موضوع مختلف علية"
author = "لية"
posted = "2008-10-13"
text = "يعنى اية بنت مؤدبة ؟ كل بناتنا مؤدبين والحمد للة<br />الا طبعا اعداد فى الفئات تكون منحرفة<br />والمثل البلدى بيقول كل فولة ولها كيال وكل حلة ولها غطاء<br />وفية واحدة خجولة جدا بتتجوز واحد جرىء جدا واحدة جريئة جدا بتتزوج واحد خجول جدا<br />كل فولة ولها كيال<br />وكل واحد بياخد الواحدة اللى تكملة<br />يعنى انا مثلا وشخصيا ضعيف الجسم وعدمان العافية ومتجوز واحدة كمال اجسام وبتاع كراتية وبتضرب بالروسية وتعمل مقصات وشقلباظ فى الهوا - يعنى حاجة كدة دفاع عن النفس وحاجة تكمل حاجة مش عندى"
archived = "2008-10-17"
capture_url = "https://web.archive.org/web/20081017091922/http://masr.20at.com:80/newArticle.php?sid=17895"

