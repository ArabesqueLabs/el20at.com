text = "عندك حق مش باللبس االإسان يحكم على سلوك البنات او الولاد برضو الدين والأخلاق من جوه الانسان مش من براه وانا بشكر مروة لان الموضوع مهم والتناول كان مرن وعميق في الوقت نفسه"
