[[comments]]
order = 12
subject = "الموضوع كبير"
author = "الطير المهاجر"
posted = "2008-11-06"
text = "الحكم على أدب البنت( طبعا من غير الاختلاط بها) يأتي من شيئين:<br />الأول:-المظهر الخارجي بما يشمل الملابس و وضعها للمساحيق العجيبة أو المكياج من عدمه و شكل الحجاب و طريقة كلامها مع زميلاتها و الحدود التي تتكلم فيها مع زملائها من الشباب على قدر الضرورة أم لا و طبيعة زملائها أو الجروب الذي تنتمي إليه من الأصدقاء . و أعتقد كل هذه المؤشرات معا , غالبا و ليس دائما تقود لاستنتاج صحيح .<br />الثاني:-القيم الداخلية أو القواعد التي تضعها الفتاة لنفسها و تسير عليها في حياتها سواء في المنزل أو في مكان تحصيل العلم أو في العمل و هذه القواعد لا يعرفها إلا المقربين منها غالبا و لكن معظم هذه القواعد و ليست كلها تنجلي في السبب الأول.<br />و في النهاية أحب أن أوضح أنه إذا صارت أو كانت معظم البنات مؤدبات فإن هذا يصلح حال المجتمع بأكمله لأن أعداء الأمة إذا أرادوا النيل منها أفسدوا بناتها لأنها هي الأم و هي الزوجة ..<br />فاللهم احفظ بنات المسلمين و ارزقنا الزوجة الصالحة التي تكون خير متاع الدنيا كما قال الحبيب عليه الصلاة و السلام"
archived = "2010-03-14"
capture_url = ""

