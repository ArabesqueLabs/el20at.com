subject = "ربنا يهدى"
author = "ريهام"
posted = "2008-10-16"
text = "الموضو ده حلو اوى ومهم جدا اصل دلوقتى بقى صعب اوى تتاكد ان البنت مؤدبة ولا لا بس اعتقد ان اللبس عليه عامل كبير اصل البنت اللى ماتتكسفش انها تلبس لبس مش حلو تبقى فقدت جزء مهم جدا من صفات البنت المؤدبة انها تكون بتتكسف شوية دى راييى وربنا يكون فى عون اللى بيدور على عروسة لانى مش لاقية لاخويا بس برده فى بنات كتير اوى محترمة"
