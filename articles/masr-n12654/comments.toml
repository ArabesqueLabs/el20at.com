subject = "اكل الاسود مشكلة"
author = "معيط"
text = "الاسود محتاجة كل يوم 9 حمير للاكل<br />طيب ومالة - عندنا حمير كتير قوى فى البلد - بتوع الامن المركزى ومباحث امن الدولة<br />طيب فين بتوع تحديد النسل وحاجة كدة ببلاش اللى قرفونا فى عيشتنا<br />طبعا الاسد كل يوم بياكل لحمة ولا شغلة ولا مشغلة غير انة يخلف اسود صغيرة وبعدين التنمية بتاع البلد هتقف والسبب زيادة السكان مش قالوا كدة<br />اما اسد بصحيح بس امة لبوة"
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204131548/http://masr.20at.com:80/newArticle.php?sid=12654"
