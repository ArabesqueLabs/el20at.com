order = 0
subject = "معرض الزهور الدولي الاردن2008"
author = "شركة باسل شحادة لتنظيم المعارض"
posted = "2008-04-08"
text = "بسم الله الرحمن الرحيم<br />تحية طيبة وبعد،،<br />أرجوا إعلام معاليكم بأنه وانطلاقاَ من مبدأ الشراكة لتحقيق التنمية الإقتصادية والإجتماعية وانسجاماَ مع رفع وتشجيع السياحة والاهتمام بالبعد الحضاري فإن مركز زها الثقافي/أمانة عمان الكبرى سيقيم وبالتعاون مع رئيس اللجنة المنظمة لمعرض الزهور الدولي 2008-الأردن/مؤسسة باسل شحادة لتنظيم المعارض والتسويق معرضاَ للزهور على مستوى دولي بهدف تقديم الدلالات والمفاهيم الإبداعية لما يشتمل عليه المعرض من موجودات وذلك تحت الرعاية الرسمية،<br />علماَبأن المعرض سيقام خلال الفترة الواقعة ما بين 31/8/2008 ولغاية 10/9/2008 أرجوا معاليكم التلطف بالاطلاع والإيعاز لمن يلزم للمشاركة في هذا المعرض توافقا مع مشاركة الجهات المعنية من أجل تحقيق كافة المساهمات لإنجاح هذا المعرض.<br />واقبلوا فائق الاحترام،<br />0096265151264<br />00962796823456<br />Malek2006727@hotmail.com"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "المعرض الدولي الأول للأغذية والمأكولات"
author = "مؤسسة باسل شحادة للتنظيم المعا"
posted = "2008-06-08"
text = "المعرض الدولي الأول للأغذية والمأكولات<br />The First International Fair For food and Eatables<br />مهرجان تذوق صيف 2008<br />من 31/7 ولغاية 4/8<br />دعوة للمشاركة والزيارة<br />تتشرف المجموعة السورية للإعلان بالتعاون مع شركة آفاق للمعارض بدعوتكم للمشاركة في معرضها السنوي الأول للأغذية والمأكولات والذي سوف يقام في مدينة حلب على أرض سوق الإنتاج الصناعي والزراعي على مساحة / 000 22 متر مربع / والذي يضم العديد من الفعاليات التجارية والصناعية المهتمة بعالم الأغذية والمأكولات بمشاركات من داخل سوريا وخارجها ( تركيا – السعودية – الإمارات – الأردن – مصر ) .<br />الجهات المدعوة للمشاركة :<br />1- شركات تصنيع واستيراد وتعبئة المواد الغذائية .<br />2- المطاعم الشرقية والغربية والوجبات السريعة .<br />3- الآيس كريم – المشروبات الساخنة والباردة .<br />4- شركات تجهيز المطاعم والفنادق والتجهيزات المنزلية .<br />5- منتجي الحلويات الشرقية والغربية والمعجنات<br />6- شركات الدواجن والأسماك واللحوم ومشتقاتها .<br />7- شركات إنتاج الشوكولا والضيافة والراحة .<br />8- كافة الشركات والفعاليات المهتمة بعالم الأغذية والمأكولات .<br />السعر والتجهيزات :<br />سعر المتر المربع الواحد الخارجي = 200 دولار أمريكي .<br />سعر المتر المربع الواحد الداخلي = 250 دولار أمريكي ( صالة الشهباء المكيفة ) .<br />أقل مساحة في المعرض هي : 9 متر مربع .<br />تجهيزات الستاند :<br />قواطع خشب وألمنيوم – برجكتور إنارة استطاعة 500 واط عدد2 – رفوف حسب الحاجة – مأخذ كهربائي رباعي – موكيت للممرات بعرض 2م – موكيت على كامل الستاند – كراسي بلاستيك<br />عدد2 – طاولة ألمنيوم – أراتي طاولة – سلة مهملات – منفضة سجائر زجاجية – كتابة واجهة<br />الستاند / عربي – إنكليزي / - نظافة – حراسة – صفحة في دليل المعرض .<br />الحملة الإعلانية المرافقة للمعرض<br />1- إعلان طرقي بواسطة :<br />أ‌) شركة كونكورد عدد / 5 / شبكات .<br />ب‌) شركة الأفضل / 2 / شبكة .<br />2- إعلان إذاعي لمدة شهر يسبق المعرض + تغطية يومية مباشرة ( إذاعة عدد 2 ) .<br />3- مقروءة :<br />&--61550; جريدة الوسيلة حلب / صفحة / عدد 2 .<br />&--61550; جريدة الدليل حلب / صفحة / عدد 2 .<br />&--61550; جريدة بلدنا صفحة ( يوم الافتتاح ) 31 / 7 / 2008<br />&--61550; مجلة ليالينا 2 صفحة .<br />&--61550; مجلة / TV Guide / 2 صفحة .<br />4- إعلان تلفزيوني فضائي :<br />تلفزيون الدنيا – قناة مسايا – قناة الديرة – قناة شام<br />5- بطاقات دعوة / VIP / عدد / 000 10 / بطاقة .<br />6- بطاقات دخول معرض / 000 100 / بطاقة .<br />7- بوستر إعلاني قياس / 35 × 50 سم / عدد 2000 .<br />8- فلاير إعلاني عدد / 000 50 / فلاير .<br />9- حملة إعلانية على أهم المواقع الإلكترونية السورية .<br />10- رسائل / SMS / عدد / 000 100 / رسالة .<br />لمزيد من المعلومات ( الأردن )<br />مؤسسة / باسل شحادة لتنظيم المعارض والتسويق<br />هاتف : 5151368 – 5151264 / 6 / 00962 & موبايل : 56 34 682 79 00962 Website : www.vip2marketing.com<br />E-Mail : vip2marketing@yahoo.com<br />E-Mail : vip2marketing@hotmail.com<br />E-Mail : vip2marketing@vip2marketing.com<br />E-Mail :basel@vip2marketing.com"
