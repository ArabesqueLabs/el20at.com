[[comments]]
order = 4
subject = "المباحثات تتناول كيفية رفاهية المواطن الاسرائيلى بمدة بالغاز المجانى والبترول واسمنت سيناء وماء النيل"
author = "ابو خشبة"
text = "كما جرى بحث امكانية تجنيد 5 مصريين لكل اسرائيلى يخدموة ويمسحوا خراة ويشتغلوا عبيد عندة فى البيت<br />مباحثات فى اية<br />ماهو بيعمل مباحثات من 27 سنة واية النتيجة - اتحررت القدس<br />لا شىء<br />كلة كلام فى الطراوة<br />وفود جاية ووفود رايحة<br />وبوش فى الشرم<br />وبلير فى الشرم<br />لغاية ما انا خايف لا الشرم يتشرم"
archived = "2008-07-01"
capture_url = "https://web.archive.org/web/20080701201045/http://masr.20at.com:80/newArticle.php?sid=16444"
