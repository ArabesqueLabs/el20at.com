text = "موضوع ممتاز جداً يدل على وعى واطلاع من كتبه على تفاصيل حياة المجرمين المنحطين المسمين كذباً ضباط مباحث امن الدولة ، وهم في الحقيقة كلاب امن المجرم الكبير حسنى مبارك وحاشيته اللئام .<br />إن شاء الله سينتقم منهم و يسلط عليهم الشعب الذى ذاق الأمرين على ايدى هذه الكلاب المسعورة ، وسيمكننا الله من ذبحم و سحلهم في الشوارع و الطرقات هم وسادتهم الجبناء ."
