author = "امن الدولة  الكلاب"
posted = "2010-03-10"
text = "لم أدخل في حياتي أي مقر لأمن الدولة ولا أي من عائلتي، وما حدث أنه في يوم الأحد ليلا حضر شخص قال أنه من أمن الدولة وطلب مني الحضور للمثول أمام النقيب محمد عبد التواب، سألته عن السبب فلم يخبرني فطلبت منه المغادرة على أن أذهب بنفسي بعد انتهاء مواعيد عيادتي التي زارني فيها.<br />توجهت إليهم بعد صلاة العشاء وصعدت للنقيب محمد عبد التواب الذي لم يعطني أي فرصة للكلام فقط ردد عبارة \"وأنت بتأيد البرادعي بقى؟\"، بعدها انهال عليّ بالضرب من كل جانب وشتمني بكلمات وألفاظ قبيحة وجارحة وغاية في الدونية ولم يمهلني أي فرصة حتى للرد.<br />ظلوا يشبعونني ضرباً حتى بعد منتصف الليل تقريبا وبعدها حبسوني وأعتقد أنهم فعلوا ذلك لتختفي آثار الضرب، وبالفعل بقيت لديهم حتى بعد الفجر وخرجت على مستشفى سنورس بالفيوم وكنت في حالة إعياء شديدة."
archived = "2010-03-14"
