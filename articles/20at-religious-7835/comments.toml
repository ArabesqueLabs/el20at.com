text = "يا اخ طحاوي الموضوع دا ينفع لمساحة للراي<br />مش من الكرباج<br />يا ريت والله عشرينات تنقله الى هناك لان موضوع الكرباج دا ما يصلحش للمناقشة الطويلة على الاطلاق<br />والموضوج جميل اوي يا اخ طحاوي اسمحلي اعملوه مطوية واوزعها على المسلمين"
