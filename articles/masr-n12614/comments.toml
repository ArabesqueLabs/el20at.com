[[comments]]
order = 9
subject = "الفسده"
author = "ابراهيم"
posted = "2007-12-29"
text = "ما زال يوسف شاهين يتفنن في افساد شباب مصر ففي فلمه الجديد استطاع و لا اعرف كيف في ادخال مشاهد لم نكن نراها اللا في الافلام الجنسيه فقط و ايضا سبابات بغيضه جدا ننهر اولادنا اذا سمعوها فقط فكيف اربي ابني و فاسد مثل هذا يضع له هذه السبابات في فيلم يدخل كل البيوت فما هي فائة تلك المشاهد الساخنه و تلك السبابات القذره فارجوكوم ارحمونا من هذا الفاسد و ايضا الفاسد الاخر الذي يدعى خالد يوسف فهم ينشروا الفساد باسم الواقعيه و لكنهم فاسدين و اقسم بلله اذا فكرنا بتفكير سليم بعض الشيء فسنراهم مفسدين لابنائنا فاجوكم تعاونوا لمنعهم من ذلك و تقولوا على افلامهم انها جميله كي لا يتفننوا في اظهار المفاسد اكثر من ذلك و ربنا ياخدهم هم الاثنين"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025039/http://masr.20at.com:80/newArticle.php?sid=12614"

[[comments]]
order = 10
subject = "تغير اسم الأمين"
author = "جون"
posted = "2007-12-30"
text = "أنا من رأي تغيير اسم امين الشرطة كمسمى وظيفي لأن كلمة الأمين اصبحت بعيدة عن هذا المسمي الوظيفي بسبب الأفعال المشينة التي يقوم بها رجال الشرطة<br />فأرجو أن نجد اسم اخر غير الأمين - يعني فتوة مثلا - فياريت الاقي رد فعل على تعليقي بأسماء تنطبق بالفعل على مستر أمين الشرطة<br />أنا حزين جدا لما بلاقي المثل الأعلى للأولاد دلوقتي أمين الشرطة وسواق الميكروباس<br />في يوم ابني وهو صغير باقوله تحب تطلع ايه قالي سواق ميكروباس، قلت له ليه قالي علشان بيلموا فلوس كتير<br />طبعا هذه الأمنية جعلتني اعيد ترتيب اوراقي وتربية ابني من جديد لتغيير المفهوم من رأسه والحمد لله اتجه رأسه لشئ آخر واحمد الله على ذلك وهو الآن جرافيك ديزينر<br />وشكرا على قرآة تعليقي"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025039/http://masr.20at.com:80/newArticle.php?sid=12614"

[[comments]]
order = 11
subject = "أولاد الناس"
author = "جون"
posted = "2007-12-30"
text = "معلش انا لي تعليق اخر على كلمة أولاد الناس اللي بعض الناس بيقولوها على امين الشرطة - صحيح المجموع بتاعه في الثانوية العامة هو سبب انه خلاه أمين شرطة<br />لكن للحق - الساكت على الحق شيطان اخرس - وأمين الشرطة ابن الناس مش قادر يثبت نفسه في هذا المجتمع القذر بتاع السادة الأمناء والضباط - فهل له ان يتجرأ ويتكلم ويبعد هذه الشبه عن نفسه بأي صرخة او اي تصرف<br />فلابد أن يبدأ واحد ابن ناس منهم حتى تستيقظ الضمائر الغافلة ونحافظ على مصر<br />لابد أن يكون هناك ضحايا لإنقاذ مايمكن انقاذه - فأولادنا وأجيالنا القادة لاحول لهم ولا قوة - ونظرتهم للأسف للقدوة الحسنة ضاعت - فالسادة الضباط وأمناء الشرطة ليس لهم هم - غير فرض الاتاوة والبحث عن طريقة لكسب الرزق الحرام ، وكما قال الدين الاسلامي - الحلال بين والحرام بين - فجميع السادة الضباط وأمناء الشرطة يعلمون تماما من أين يأكلون<br />أما بالنسبة لموضوع المخرج العبقري يوسف شاهين وابنه خالد يوسف<br />وأن رأيهم أن الواقع يفرض عليهم عرض المواضيع الساخنة<br />فلو نظرنا للأفلام القديمة كم كانت تعرض القضية بكل احترام وتترك للمشاهد تخيل الدراما كما يحلو له وأظن أن لغة الخيال افضل بكثير من لغة الواقع الذي يفرضونها علينا وعلى أولادنا من مناظر ومساخر<br />فزمان كان الفيلم يصور لنا الشرير ونعلم انه شرير، وكان الخيل أجمل بكثير من الواقع<br />وبعدين ربنا قال الستر يعني الواقع اللي انت بتعرضه بهذه الطريقة شئ مقزز<br />للأسف الحياة تمشي كما يحلو لها<br />وشكرا"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025039/http://masr.20at.com:80/newArticle.php?sid=12614"

