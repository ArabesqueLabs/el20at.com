[[comments]]
order = 1
subject = "مصر دوله امناء الشرطه والمخبرين والفسادين"
author = "خالدالامير"
posted = "2007-11-28"
text = "مصر اصبحت دوله امناء الشرطه الذين يتحكمون في كل شئ حتي الظابط فهم والمخبرين في ايديهم جعل الظباط الفلاني او العلاني يظبط ظبطيه كبيره او ترقيه فهم ملوك الشارع وكم ذكرتم فكل شئ يصل اليهم ال بيوتهم ويتحكمون في خلق الله لم لهم من سلطه وهم صنفان صنف معقد وصنف بيفتح دماغه وكل بيهلب من الشعب المغلوب علي امره ولكن العيب فينا نحن ونحن جعلنا هذه ابلد بلد امناء الشرطه والمخبرين والفسادين"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202151933/http://masr.20at.com:80/newArticle.php?sid=12614"

[[comments]]
order = 2
subject = "عشان انت مصرى"
author = "منقول"
posted = "2007-11-29"
text = "عشان انت مصرى<br />عشان انت مصرى لازم تعانى<br />وتفقد كرامتك بكل المعانى<br />وتحرق فى دمك سنين مش ثوانى<br />واوعى تصدق كلام الاغانى<br />بتاع الحضاره وكانى ومانى<br />ده كله هجايص مايدخل ودانى<br />عشان انت مصرى العذاب بيناديك<br />بتبدا فى يومك حاجات بترازيك<br />فى نومك فى قومك تعكنن عليك<br />تضايقك ولسه العماص فى عينيك<br />مافيش ميه تشطف صابونه فى ايديك<br />وجسمك ملزق وريحتك عاديك<br />فتلبس وتنزل وفيك اللى فيك<br />ورايح لشغلك حتحتاج مواصله<br />ادى المترو واقف وكهربته فاصله<br />وفى الميكروباص خناقه وحاصله<br />اوتوبيس فرامله عايزالها وصله<br />وتوك توك ده تايه ومحتاج لبوصله<br />بتوصل لشغلك بدم اتحرق<br />فى زحمه وكتمه وحر وعرق<br />رئيسك سايبلك كومه ورق<br />ده غير دمغه ضايعه وملف اتسرق<br />وفى كام مواطن عامللك قلق<br />بيشكى تقول له روح اندعق<br />وعركه وهوجه وشاى اندلق<br />ومخك خلاص من الصداع اتفلق<br />هترجع لبيتك ده لو كان فى بيت<br />هتوصل هتندم ياريتك ماجيت<br />مراتك بتصرخ خلاص استويت<br />عيالك بتطلب وهات كيت وكيت<br />تزعق تهاتى ياناس اتهريت<br />ولاحد سامعك مهما هاتيت<br />عشان انت مصرى وده للاسف<br />فلازم تاسى تعيش تتقرف<br />وكل الاساسى فى حياتك ترف<br />فتنسى الكرامه وتنسى الشرف<br />وتسرق وتنصب او تنحرف<br />ودمعك بيجرى وجرحك نزف<br />مش انت اللى مصرى؟؟؟ جتك القرف"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202151933/http://masr.20at.com:80/newArticle.php?sid=12614"

[[comments]]
order = 3
subject = "واحد ذكي كان معاه ربع جنيه.."
author = "اكتب اسمك هنا"
posted = "2007-11-29"
text = "واحد ذكي كان معاه ربع جنيه..<br />ففكر يعمل بيه إيه..<br />يشرب عصير قصب و لا يركب الأتوبيس فقال :<br />أنا لو ركبت الأتوبيس هيبقي في حل من إثنين:<br />يإما هقف أو هقعد<br />لو وقفت مش هيبقي في أي مشكلة<br />لكن لو قعدت هيبقي في حل من إثنين:<br />يإما هيقعد جنبي راجل أو تقعد جمبي ست<br />أنا لوقعدت بجانب راجل مفيش مشكلة<br />لكن لو قعدت بجانب ست هيبقي فيحل من إثنين:<br />لإما هنعجب ببعض يإما مش هنعجب ببعض<br />لو مأعجبناش ببعض مفيش مشكلة<br />لكن لو أعجبنا ببعض هيبقي في حل من إثنين:<br />يإما هنتجوز يأما مش هنتجوز<br />لو مإتجوزناش مفيش مشكلة<br />لكن لو إتجوزنا هيبقي في حل من إثنين:<br />يإما هنخلف يأما مش هنخلف<br />لو مخلفناش مفيش مشكلة<br />لكن لو خلفنا هيبقي في حل من إثنين :<br />يإما هنخلف ولد أو بنت<br />لو خلفنا بنت مفيش مشكلة<br />لكن لو خلفنا ولد هيبقي في حل من إثنين:<br />يإما هيستقيم أو هينحرف<br />لو إستقام مفيش مشكلة<br />لكن لو إنحرف هيبقي في حل من إثنين:<br />يإما يدمن أو مش هيدمن<br />لو مأدمنش مفيش مشكلة<br />لكن لو أدمن هيبقي في حل من إثنين:<br />يإما هيبقي معاه فلوس أو معهوش<br />لو كان معاه فلوس مفيش مشكلة<br />لكن لو كان عايز فلوس هيبقي في حل من إثنين:<br />يإما هيسرقني أو هيقتلني<br />لو سرقني مفيش مشكلة لكن لو قتلني ..<br />... يقتلني ؟؟!!!!!!!!!<br />لا ياعم أنا أشرب عصير قصب أحسن"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202151933/http://masr.20at.com:80/newArticle.php?sid=12614"

[[comments]]
order = 4
subject = "كلام سمعتة على القهوة"
author = "سمير الفار"
posted = "2007-11-29"
text = "اتنين قاعدين بيشتكوا لبعض من الاتاوة او الفردة المفروضة على اصحاب المحلات والورش وسواقى الميكروباس من السادة امناء الشرطة والمساعدين والكادر اياة من مخبرين ومباحث وخلافة وقال احدهم فى كلامة ان هذا الطاقم اشتكى لوزارة الداخلية من ضعف اجورهم وعدم مناسبتها للحياة فجاءتهم التعليمات كملوا مرتباتكم من برة يعنى ياخدوا من الناس فلوس باى طريقة ليعيشوا وكل واحد وشطارتة<br />والامر ليس فى الداخلية فقط جميع مؤسسات البلد نخر فيها السوس والفساد والمحسوبية والرشاوى عينى عينك والمثل المصرى بيقول اذا اردت ان تنجز فعليك بالونجز ( وطبعا الوينجز هو علبة السجاير )<br />فأساس المشكلة هو ضعف او انعدام المرتبات - بمعنى ان المرتب لا يكفى والاسعار تتزايد كل يوم<br />فا الامناء ليسوا فاسدين بالفطرة ولكن الظروف هى التى اجبرتهم - فالدولة تسرق مرتباتهم وهم يسرقون الناس<br />وبعدين يا اخت دعاء انتى مركزة فى تحقيقاتك على الداخلية لية<br />ربنا يكفيكى شرهم"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202151933/http://masr.20at.com:80/newArticle.php?sid=12614"

