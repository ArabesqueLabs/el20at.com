[[comments]]
order = 13
subject = "عينى عينك"
author = "جمال محمود معتوق"
posted = "2008-01-04"
text = "بمناسبة امناء ألشرطة وألمخبرين ------ ليه واحد صاحبى أسمه طلعت كان عليه عدة قضايا وسافر الى دولة عربية ولما رجع لمصر مخبر منطقته عرف برجوع طلعت ونده عليه ياطلعت ---- ياطلعت رد طلعت عليه وقال اتفضل قال ألمخبر أنزل عايزك نزل طلعت المخبر قال له عليك قضية --- قال طلعت للمخبر دقيقة واحدة أطلع لغاية فوق وانزلك طلع طلعت ونزل للمخبر وقال له ألقضية محكوم على بكام شهر قال ألمخبر ستة شهور ----- قال طلعت للمخبر خد مائة جنيه ويبقالك ثلاث شهور ----- أما بالنسبة لحاتم وغيره فأمهم غسالة"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025039/http://masr.20at.com:80/newArticle.php?sid=12614"

