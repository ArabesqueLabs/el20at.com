[[comments]]
order = 15
subject = "ضع عنوان التعليق"
author = "جاسر"
posted = "2008-04-18"
text = "نحن دائماً نتحدث على السلبيات ولماذا لا نذكر الأيجابيات مثال لماذا لم تتحدثو عن مافعله امين شرطة (شهيد) تعرض للقتل اثناء عملة بسبب انة قام بالدفاع عن فتاة وأنقذها من الأغتصاب هل هذا هوة امين الشرطة الذى تتحدثون عنة لماذا لم تذكرو امناء الشرطة فى الأماكن الخطرة للدفاع عن الوطن من دخول المخدرات وانتشار الأرهاب فى مصر والأخ الفاضل الذى تحدث عن الأمناء بأنهم لا يملكون التعليم لماذا لم يتحدث عن امناء شرطة معم دكتوراة فى القانون وماذالو يعملون امناء شرطة دون ان يتدقمو للألتحاق بأكديمية الشرطة وفى النهاية اقول حسبى الله ونعم الوكيل فى كل من قال وجمع امناء الشرطة بسوء"
archived = "2010-03-14"
capture_url = ""
