subject = "إذا صعبنا الحلال صار الحرام سهلاً"
author = "T.R"
posted = "2007-05-09"
text = "أخواني الكرام أخواتي الفاضلات<br />أكتب لكم تعليقاً على هذه المقاله التي تعبر فعلاً عن مدى عمق المآساه التي نعيشها .... فعلاً صار الحلال صعباً على الشباب والشابات .... صار الزواج حلم يقارب المستحيل لأي شاب الآن .... هل تدرون لماذا ؟ لأن القلوب الآباء والامهات لم يعد فيها اي رحمه بحال الشباب العربي ... فهم لا يقدرون ظروف الشباب من حيث صعوبة الحصول على وظيفه وإن وجدها سيكون راتبها أن لم يكن ضعيفاً فهو أحسن الاحوال متوسط !! ولكن هل سيرحم والد العروس هذا المسكين الذي لا يرجو من الله إلا ان يكمل نصف دينه ويعف نفسه ويعف أنسانه بيحبها ؟؟ يا ساده لم يعد هناك اي قدر من التراحم بين الناس ، فبالبرغم من ذلك تجد اهل العروسه ...عاوزين شبكه للبنت ما تقلش عن كذا ، أشمعنى يعني اختها جالها وجالها وبنت عمها جالها وبنت خاة اللي جابوها جالها وجالها..... طيب يا هم وأنا مال أهلي بالعائله الكريمه ؟ لا يا حبيب قلبي هي مش اقل منهم !! ولو وافق المسكين وعرف يدبر فلوس الشبكه يقعدوا يبكتوا فيه ...هي دي شبكه دي اللي انت جبتها !! عاوزين نعمل حفلة خطوبه ( يا نهار ابيض ) منين ياعمي أحنا أولى بالفلوس دي ؟؟ لا يا سكر أشمعنى فلانه !! وهكذا دواليك ودواليك ..... لغاية ماتكره نفسك ....لو قدرك ربنا وجيبت شقه ....برضه ينزلوا تبكيت في اهلك ...ايه الشقه دي وايه المكان البلدي ده ....دي امكانياتي ياعمي..... عمى الدبب ....ماتقولشي ياعمي ..... ولوشاء المولي ونفسك كان طويل وقدرت تكمل ....هاتسمع المسلسل ده طول عمرك .... مسلسل المعايره والمقارنه ...... بينك وبين جوز اختها .....بين امكانياتك .... وامكانيات جوز بنت خالتها ..... وجوز جارة بنت عمها .....دوامه ياصاحبي مالهاش نهايه ..... ولو فضلت متنح وعامل فيها انك شاري البنت ......ومع قرب الزفاف اكتب قائمه منقولات فيها كل الأشياء من اول دبابيس الطرحه بتاعة العروسه لغاية جلدة محبس حنفيه المياه ياحلو ( وأمضي قيس على القايمه ) ماشي وكمان مؤخر 50الف جنيه علشان انت شكلك كده مش مطمنا .... وهكذا تخرج من حفره ....إلي جب (بئر ) ولا اللي اترمى فيه سيدنا يوسف ... بس ربنا سبحانه وتعالى نجا سيدنا يوسف من الجب ؟؟<br />وتقولي واحد مأذون مستغرب ليه الشباب عازف عن الزواج .... لازم يعزف .....ويعزف على أوتار قلة الحيله وضعف الامكانيات وفقر الحال ..... والعنوسه بتزيد مابين الشباب والبنات ولا حياة لمن تنادي ...شاطرين بس نعمل مشاريع سياحيه ومهلبيه واستهلاكيه .... لكن حد فكر يتبرع بتزويج الشباب أو يعمل صندوق لدعم الشباب الراغبين في الزواج ..... تصدقوا بالله ان شفت جامع بيتبني في احدى محافظات الوجه البحري ( الدلتا) بمصر .... ماشاء الله متكلف ملايين الملايين ...... تصدقوا اني قلبي اتفطر عارفين ليه ؟ لأن ربنا مايرضاش بأن الملايين تهدر في مسجد فخم ومكيف ومفروش بالسجاد الايراني والمنبر ممعمول من ايه والزخارف منقوشه بأيه !!! وفي نفس الوقت الشباب مش عارفه تتجوز !! هل ربنا سبحانه وتعالى محتاج لجامع 5 نجوم علشان يعبد فيه (حاشا لله ) كان فيها ايه لو فلوس الجامع دي اتصرفت على الشباب أو حتى نصف الفلوس دي ...كانوا جوزوا بيهم 50 شاب وشابه.....أقسم بالله في مشاريع جواز علشان تمن ثلاجه أو غساله أو بوتجاز .... أحنا خلاص عليه العوض فينا .... وشاطرين بس ندعي على الغرب ... أن ربنا يهلكهم كما أهلك عاد وثمود..... طيب الغرب بيتجوزوا بخاتم بس ( مش طقم وشبكه و سوليتير ) وبيعيشوا في شقق 40 متر أو استوديوهات يادوب اوضه بحمام .... وبيعملوا كل حاجه بالتدبير والترتيب ...لكن هنا اهل العروسه عاوزين يحققوا اكبر مكاسب من صفقة الزواج الجاري التفاوض عليها ( طيب سمعتوا عن ظاهرة ان أهل العروسه بيكتبوا العريس دلوقتي شيك على بياض ؟؟ قال ايه علشان نطمن على بنتنا ... يعني لو زعلتها ياحلو ... الشيك طلع وأهلا بيك في ابو زعبل أو ليمان طره شديد الحراسه ) شوفتوا القبح اللي بقينا فيه ؟<br />أخيرا أوعوا حد يقولي اني متشائم أو بأفكر بطريقه سوداء- بالعكس والله وانا باحكي لكم على حالي وحال ملايين الشباب لأني مريت بتجارب مؤلمه جدا في سكة الارتباط دي ومازلت والحمد لله عازب وحر ( ومافيش عليا شيكات )<br />ياأخواني وضع رسول الله صلى الله عليه وسلم معايير أختيار الزوج في معيارين الدين والخلق حيث قال \" إذا جاؤكم من ترضون دينه وخلقه فزوجوه ، إلا تفعلوا تكن فتنة في الارض وفساد كبير\"<br />ترضون دينه وخلقه ..... مش ترضون شبكته ومهره وموديل سيارته ....أو موقع شقته .... والشاليه بتاع مارينا ..... وترضون بحسابه البنكي من قبل ومن بعد<br />فهل هذا مايحدث ؟؟ إذا فلتكن فتنة في الارض وفساد كبير"
