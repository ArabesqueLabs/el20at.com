[[comments]]
order = 8
subject = "المرجعيه الدينيه..كلاكيت عاشر مره"
author = "نيفين نيفى نوفا"
posted = "2007-04-13"
text = "تانى و تالت و عاشر المرحعيه الدينيه<br />و اقصد بكلاكيت عاشر مره تاكيدى لراى كنت بناقشه مع احد المعلقين الزملاء على الموقع من فتره و هو ان سبب اقبال الناس على قناه الناس و غيرها من القنوات الدينيه هو المرجعيه الدينيه بمعنى ان ف مصر مثلا المؤرجعيه للناس هى المرجعيه الدينيه و هو دا نفس السبب لاقبال الناس مؤخرا على ترشيح اللاخوان المسلمين ف الانتخابات البرلمانيه<br />الناس مرجعيتها د<br />ينيه و بتثق ف اى حد يلتزم بالدين و بتتبعه عمياء<br />و ده ف حد ذاته مش غلط بس الخوف و الخطر لو فعلا فيه ناس بتستغل الدين و بتتاجر باسم الدين علشان يعملو بيزنس<br />وفعلا كل الشيوخ و الدعله حاليا بيروجو لقناه الخليجيه و بيبشرو الناس بيها من فتره و بيقولو انها تؤام قناه الناس<br />عموما فعلا لايام هى اللى هتبين نوايا بن كدسه"
archived = "2010-03-14"
capture_url = ""

