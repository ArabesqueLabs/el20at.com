text = "سيبكوا بقى من قناة الناس و قناة خليجية و غيرهم ..... و فكروا فى قناة السويس لانها فى الحقيقة محتاجة انكوا تفكروا فيها شوية .... بدل ما تشوفوا مين ممول قناة الناس ولا مين بيتفرج على قناة خليجية ... فكروا ازاى تحرروا قناة السويس من الضياع الاقتصادى اللى هى فيييية .... المفروض ان حصة كل مواطن مصرى من قناة السويس أسبوعيا حوالى 0.83 دولار .. و يرجعوا فى الاخر يقولوا ان قناة السويس بتخسر و انها مديونة للدولة ... الى اخرة . طب الفلوس بتروح فيييييييييييييييين .... أكيد على رأى العبقرى عادل امام أن الفلوس بتروح لملاجأ الايتام اللى فى سويسرا"
