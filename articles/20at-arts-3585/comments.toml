subject = "خدعوك فقالوا: متاجرة بالدين!!!"
author = "مسلم"
posted = "2007-04-12"
text = "يحاول الكثيرين الطعن في أي جهود لنشر الدعوة الإسلامية...<br />فمن لا يجرؤ على مهاجمة الإسلام...يستعيض عن ذلك بالطعن في حملته او العاملين له...<br />ومن ذلك مقولة: \"المتاجرة بالدين\"...هذه العبارة التي تستخدم الآن في لمز القنوات الإسلامية الصاعدة...<br />ولو أنصفوا لقالوا: متاجرة لـلـدين!...فما دامت مكاسب هذه القنوات تصب في خدمة الدعوة فما الضير أن يتربح العاملين عليها من الاعلانات ورسائل الـ إس إم إس؟؟<br />أم ينبغي أن تعيش الدعوة الاسلامية عالة على الصدقات دون موارد متجددة؟؟<br />أم لا ينبغي للدعاة أن ينشروا العلم والوعي بأمور الدين الا على المنابر -المكممة أصلا!- ؟؟؟<br />أم لا ينبغي للقنوات الفضائية أن تخرج عن حدود الفسق والخلاعة والمجون؟؟؟<br />مبارك \"توبة\" هذه القناة...وعقبال باقي القنوات \"الفضائحية\"!!!"
