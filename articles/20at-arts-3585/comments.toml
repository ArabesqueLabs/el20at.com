text = "يا جماعة \"إن غدا لناظره قريب\"....<br />ننتظر شوية و نشوف!!! لو القنوات دي بدأت مترجعش عائد قوي,, أو تشيل نفسها على الأقل..<br />في الوقت ده,, هيبان صدق النوايبتاع أصحابها و هيبان اذا كان قصدهم يتاجروا بشيوخنا الأفاضل و بحب الناس لهم..<br />ولا فعلاً,, هم قدصهم التوجه الى الله و مساعدة أهل الصحوة؟؟؟<br />و القنوات الاسلامية يا جماعة عشان تظهر بمظهر جذاب و منافس ملكفة جدا جدا جدا..<br />خصوصا انهم مش بيقبلوا كل الاعلانات و مش كل الشركات بتكلم جمهور القنوات الاسلامية..<br />ربنا يجزي أصحاب القنوات الاسلامية خير و خصوصا الكبرى لانهم بيصرفوا جامد جداً و العائد المادي قليل..(نسبياً)"
