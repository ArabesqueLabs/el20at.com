text = "الي حاب يعرف ايش السبب في هذا التحول<br />ياجماعة السالفة او القصة انه فيه شركاء في قناة الخليجية<br />اختلفوا مع شريكهم وقرروا تحويلها الى قناة دينيه<br />والاخ الي كان وراء قناة الخليجية وادرتها السابقة قرر يتنازل عن الشعار والقناة للشركاء الي صحوا من نومهم<br />وقرروا \" الله يهديهم\" انهم يقلبوها دينيه والاخ الي استلم هبشة فلوس على قوولتنا - استلم شويه وشويات وفتح<br />قناة عربدة بنفس المضمون للخليجسة سابقا تحت اسم الذهبية وعاش الذهب وعاشت العربدة<br />سبحان الله العقل زينه صحيح اجل من ما ايصطلح عليه بالذعارة الفضائية الى ***** دينيه وعذار اذا ضايقنا احد<br />بكلامنا<br />اخوكم لا يشاهد القناة سابقا ولا حاليا لكن قراءة الخبر من احدى الجرائد وحبيت افيدكم"
