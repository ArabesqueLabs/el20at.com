[[comments]]
order = 10
subject = "المصداقية....!"
author = "مسلم"
posted = "2007-04-13"
text = "قالوا: \"مش مشكلة المرجعية الدينية...المشكلة في البيزنيس من وراء الدين\"!!!!!<br />وهل هناك أطيب وأطهر من الأموال التي تأتي من خلال أعمال تخدم الدين والدعوة؟؟!!<br />هل هناك مال أبرك ممن يوجه استثماراته ...\"بيزنسه\"...بما ينشر الدعوة وينفع الناس في دنياهم وآخرتهم؟؟<br />أم أن الاقتصاد والاستثمار محصور في الطعام والشراب والملذاتهم ولا يسعه أن يكون في دعم الصحوة الدينية؟؟<br />وقالوا: \"فلان الذي يمول الناس هو الذي يمول الخليجية قبل توبتها...هذا يقلل من مصداقية الناس\"!!!<br />هل لكي يحقق صاحب الخليجية المصداقية...عليه ان يجعل كل قنواته ماجنة؟؟؟<br />وهل لكي تحقق قناة الناس المصداقية عليها أن ترفض التمويل والدعم من العصاة ؟؟!!!!<br />وما هي المصداقية؟؟؟<br />هل المصداقية هي أن الذي يعصي الله في أمر محظور عليه أن يطيعه في أي أمر آخر؟؟ وأن أي محاولة منه للطاعة هي نفاق وعمل مردود؟؟؟<br />مالكم كيف تحكمون؟؟؟!!!"
