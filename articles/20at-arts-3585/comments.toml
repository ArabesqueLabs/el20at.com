[[comments]]
order = 11
subject = "ضع عنوان التعليق اصبحنا نحاسب على النوايا"
author = "اكتب اسمك هنا نهى جمال"
posted = "2007-04-13"
text = "بصراحة أنا مقتنعة طالما تم تغيير القناة بهذا الشكل سواء لهدف ديني بحت أو المتاجرة بالدين كما يقول البعض فهي في النهاية ستفيدنا لن تضرنا وحتى لو لم يعحبني ما يُثار فيها من برامج فلن يكون أياً منا سواء الأب أو الأم أو الأخ أو ....إلخ خائفا على نفسه وبيته من فتحها بخلاف عندما كانت تذيع فيديو كليبات لا يقال عنها إلا سافرة وبعد ذلك ما العيب في أن نتربح من قنوات دينية أستغربها بصراحة هل يعني أن أكسب من إنشاء بار شيء عادي لكن حرام لو أنشأت محل لبيع المصاحف حلال بس غلط التربح منه بالثلث نظرة استعجبها من بعض المعترضين الرافعين شعار لا للمتاجرة بالدين<br />وبعد ذلك يا أخي الكريم أنا معك في نقطة الموقع الذي لم يتم تغييره لكن القناة أُنشأت قريبا لم لا ننتظر لفترة ونرى هل سيتغير الموقع أم لا وحتى لو لم يتغير هل ما يهمني ما يُعرض في القناة أم ما يوجد في خلفيتها الالكترونية هل لو قام احد الشيوخ بعمل حلقات على قناة من قنوات تعرض مسلسلات وأفلام سافرة كالـ إم بي سي ودريم وغيرهم هل سنترك القناة والشيخ وهل يعني ذلك ان البرنامج سيء وعلى الرغم من أن هذا القنوات تعرض أنواعا مختلفة من البرامج هل عندما نسمع برنامج ديني عليها نهاجمها بالمتاجرة الوقتية بالدين ، أم هل ما يهمني مضمون وما يعرض باستثناء غرضه أو سبب الذي من أجله قام صاحب القناة بعرضه أم المهم ما وصلني منه وهل هو جيد أم سيء هل أصبحنا نحاسب الناس عن النوايا دون علم لمجرد عبارات تم تداولها<br />أصبحنا نحاسب على النوايا على الرغم من عدم وجود صلاحيات لنا بهذا الشيء<br />فلندع القناة تعرض ديني باستثناء نوايا صاحبها ولندع عبارة المتاجرة بالدين هذه جانبا أصبحت أسطوانة مكررة لا تعني شيء<br />تحياتي لك"
archived = "2010-03-14"
capture_url = ""

