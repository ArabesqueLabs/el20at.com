subject = "انا مش عارف"
author = "محمد يس"
posted = "2007-10-06"
text = "الحقيقه انا مش عارف هو عمرو خالد ايه حكايته مع المشبوهين من لبن فاروق الفيشاوى الى تامر حسنى ، هما المغنيين خلسو من البلد ، اصل ما اعتقدش ان عمرو خالد مستنى يتشهر على حساب تامر ، مش عارف ياريت هوا يوضح بنفسه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "الدين صار تجارة"
author = "محمد الحربي"
posted = "2007-10-06"
text = "لماذا ياعمرو خالد دائما تتقرب الى شرذمة القوم وشرهم . هل ضاقت مصر العروبه مصر الجهاد بالشباب الإسلامي فاصبح الدين بحاجة ماسة الى فنانين وممثلين يمثلوا إسلامك العصري المتطور , إذا كنت داعيا فأمر بالمعروف وأنه عن المنكر حارب الفن واهله , إنك رجل تبحث عن الشهره والدعوة منك براء . مبروك عليك هداية تامر الذي لايشق له غبار في الرأي والمشورة والشجاعة والحنكة فمبروك لنا أيها الأخوان بهذا التامر الذي سوف يعز الإسلام بصوته الشجي وشكله الأنثوي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "جزاك الله الفردوس أخ أشرف كردي"
author = "سمية"
posted = "2007-10-13"
text = "السلام عليكم ورحمة الله وبركاته<br />أود أن أشكر الأخ أشرف على اختياره الموفق لتامر حسني<br />اختيار موفق فعلا من وجهة نظري لأن الأ/ عمرو خالد داعية إسلامي يعني يدعو غير المسلمين إلى الدين الإسلامي فما بالنا بالمسلم حتى وإن كان عاصي. فتقرب ا/ عمرو من تامر بإذن الله يؤدي\" لهداية تامر وليس لفساد عمرو\"<br />كلنا خطاءون وخير الخطائين التوابين . اللهم تب علينا جميعا. والعبرة بحسن الخاتمة!!! (هناك من فازوا بالفردوس الأعلى ولم يركعوا ركعة والأمثلة كثيرة في السيرة النبوية ... اللهم ارزقنا حسن الخاتمة)"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "بعيدا عن البرامج"
author = "غاضب"
posted = "2007-10-25"
text = "ما الذى غيرك يا عمرو ؟ حائر والله جدا ما سبب التغيير هلا انت نفس الداعية الذى رأيتة وسمعتة فى قصص الصحابة وشديتا بكلامك وكنت تقول رسول الله قال هذا الشئ , رسول الله فعل كذا . رسول الله حبيبنا محتاج يحبك رسول الله اتبع سنتة وافعل وافعل . والله لم اجد منك هذا الغضب عند اساءة الرسول لم ارى وجهك يغضب وينفعل وما فعلتة إلا انك ذهبت لهم فى ديارهم لتفعل ماذا ؟ ولماذا لا تنصح وانت فى بلدك وترد الاساءة وتدعو الشباب لمقاطعتهم . والان توافق على مغنى قام بأدوار الرزيلة والمجون والفسق وتقول اسمعوا ياشباب هذا محب لله ورسوله شاهدوا كيف يقول المقطع حقيقة انت لم تقل ذلك بالكلام ولكن الفعل انك وافقت على ان يغنى والموافقة دليل القبول . ان اردت ان يتوب فاصطحبة فى جلسة لوحدك او شدة الى المسجد بعيدا عن البرامج التى نأمل ان نستشعر بها الروحانيات وتقربنا من الله . كلنا خطائ<br />بالفعل انا اذنب ومن منا لا يذنب ولكن لا آتى براقصة ترقص والبسها عباءة واقول سبحان الله سترتها العباءة واعلم تماما انها عنما ستخرج من الباب ستخلعها . والله ثم والله اتمنى ان يهدينا الله جميعا واتمنى لة الهداية لان عملة فى هذا الجو الموبؤ لا اصدقة لا اصدقة لا اصدقة عنما ينشد فى البرامج الدينية ويقول حب الله ولكن اقول له!! كذبت لو صدق قولك لصدق عملك"
archived = "2010-03-14"
capture_url = ""
