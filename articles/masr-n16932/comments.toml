[[comments]]
order = 0
subject = "نأكدو تماما ان هذا الرجل اسعد من حسني مبارك"
author = "مش كاتب"
text = "تأكدوا تماما من ذلك وهو ينام نوم عميق لانه ليس لديه ما يخسره<br />ليس لديه ما يخاف عليه<br />لا يخاف من شيء ولا يخاف على شيء<br />فهو نائم نوم عميق وتأكدوا انه يعيش حياة افضل من حياة رئيس الدولة"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727125006/http://masr.20at.com:80/newArticle.php?sid=16932"

[[comments]]
order = 1
subject = "النوم على الفرن فى وسط البراغيت قبل النوم فى القصر"
author = "صحيح"
text = "عجبت لك يا زمن<br />من النوم وسط البراغيت والبهايم واقراص الجلة فى الكفر - كفر خرابة الى النوم فى القصر الملكى<br />زمن عجيب<br />قصة المماليك الجدد<br />المعفنين فى القصر"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727125006/http://masr.20at.com:80/newArticle.php?sid=16932"

[[comments]]
order = 2
subject = "المنظر دا موجود في امريكا يا جماعة"
author = "8f6e"
text = "فيه حي اسمه حي الزنوج في نيويورك<br />حتلاقوا هذا المنظر"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727125006/http://masr.20at.com:80/newArticle.php?sid=16932"

[[comments]]
order = 3
subject = "من غير فزلكه"
author = "ياسمين مدكور"
text = "هذا المقال .. جردني من أفكاري ..<br />هذه الصوره .. و كلام المصور عنها .. جعلني أتحسس الكاميرا<br />أعشق التصوير<br />و لكن أن تصور الآلام كما هي<br />بدون فلسفه و لا فذلكه<br />فهذا هو السبب الرئيسي لفوز<br />أحمد عبيد<br />مصور<br />بمسابقة عشرينات لأحسن صوره<br />http://noteandpen.blogspot.com/2008/10/blog-post_13.html<br />تستحق .. فقط تستحق<br />تحياتي للألم<br />ياسمين"
archived = "2008-12-30"
capture_url = "https://web.archive.org/web/20081230000353/http://masr.20at.com:80/newArticle.php?sid=16932"
