[[comments]]
order = 1
subject = "بيان عن معرض الكتاب الدولي بالرياض"
posted = "2007-03-07"
text = "الحمد لله والصلاة والسلام على رسول الله ، وبعد :<br />فإن مما استفاض أمره في هذه الأيام معرض الكتاب الذي تشرف عليه وزارة الثقافة والإعلام ، حيث اشتمل على كثير من المخالفات الشرعية ، وجاء مصادماً للسياسة الإعلامية . ويمكن إجمال المخالفات على المعرض فيما يلي :<br />1- فتح الباب لجميع دور النشر العربية والعالمية ، وفيها دور تروج للرذيلة ، ودور لا تفرق بين حق وباطل وغايتها المال من أي طريق فتنشر الغث والسمين وما يحارب دين الإسلام ودور أخرى لطوائف من المبتدعين كالرافضية ، والإباضية والزيدية التي تروج لمذاهبهم .<br />2- رفع الرقابة عن الكتب فتجد في بعض مكتبات المعرض كتب الديانات المنسوخة كالتوراة والإنجيل وكتب الوثنين كالصابئة والهندوسية وكتب الانحراف الفكري والأخلاقي ككتب الحداثة والجنس .<br />3- عدم اعتبار المشرفين على المعرض لجهود المحتسبين وعدم الالتفات للشكاوى من المخالفات .<br />4- حصول الاختلاط في كل يوم في المعرض بين الرجال والنساء لا سيما مع الزحام وضيق الممرات .<br />لذلك نذكر القائمين على الثقافة والإعلام أن يتقوا الله فإنهم مسؤلون عن كل ما يجري في ولايتهم وعليهم أن يعيدوا النظر في سياسة المعرض فلا يفتحوا الباب على مصراعيه في الكتب والمكتبات وأن ينتقوا من دور النشر ويمنعوا من الكتب ما يضر بالعقائد والأخلاق .<br />كما نذكر أصحاب دور النشر والمرتادين للمعرض أن يتقوا الله ويراقبوه فيما يبيعون ويشترون ، ومن المعلوم أن ما يضر بالدين والأخلاق أخطر مما يضر بالأبدان . والمكاسب الحاصلة من التجارة المحرمة مكاسب خبيثة لا تقبل الصدقة منها ولا يبارك فيها وما يبذل من المال في كتب الضلال هو من التبذير والإسراف الذي نهى الله عنه .<br />نسال الله أن يوفق الجميع لما يحب ويرضى وأن يجنبنا أسباب سخطه إنه سميع الدعاء .<br />وصلى الله وسلم على نبينا محمد وعلى آله وصحبه أجمعين .<br />الموقعون<br />الشيخ العلامة/ عبد الرحمن بن ناصر البراك<br />الشيخ العلامة/ عبد العزيز بن عبد الله الراجحي<br />أ.د. ناصر بن سليمان العمر<br />الشيخ محمد بن أحمد الفراج<br />د. سعد بن عبد الله الحميد<br />الشيخ عبد العزيز بن سالم العمر<br />د. عبد العزيز بن محمد آل عبد اللطيف<br />الشيخ خالد بن عبد الرحمن العجيمي<br />الشيخ ناصر بن عبد الله الجربوع<br />الشيخ عبد الله بن محمد الريس<br />الشيخ سعد بن ناصر الغنام<br />د. يوسف بن عبد الله الأحمد<br />الشيخ عبد الرحمن بن عبد العزيز أبانمي<br />الشيخ عبد الرحمن بن رشيد الوهيبي<br />فهد بن سليمان القاضي<br />د.عبد العزيز بن عبد المحسن التركي<br />الشيخ عبد الله بن عبد الرحمن الوطبان<br />د. محمد بن عبد الله الهبدان"
archived = "2010-03-14"
