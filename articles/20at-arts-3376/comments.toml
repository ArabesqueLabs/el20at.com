subject = "موضوع جميل وشكرا وزير الأعلام"
author = "سعودي يتوق للحرية"
posted = "2007-03-07"
text = "شكرا عبدالله عما عبرت به عن معظم السعوديين التواقين للحري، والله ما يزيدني هذا المنع إلا إصرار على شراء الكتب<br />ومن منا عندما لا يسافر إلى أي دولة يأتي وفي جعبته الكثير من الكتب الممنوعة في بلادنا<br />نعم الفعل ما فعلته وزارة الأعلام هذا العام، ونتمنى أن يتم فسح هذه الكتب في المكتبات أيضا<br />وأرجوكم يا غيور أنت وأمثالك كفوا أيديكم عنا -----------------------------------------"
