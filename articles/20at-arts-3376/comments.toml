posted = "2007-03-07"
text = "أتعجب منك يا أخ عبدالله، كيف لك ان تصف هذا الا نحلال وعرض كتب تدعو للإلحاد والكفر بمعرض الكتاب<br />وتسميه حرية<br />أي حرية هذه<br />هناك بيان موقع من عدد من العلماء لاستكار هذه الحرية المزعومة أرجو الإطلاع عليه"
