subject = "القرآن واغتيال الفصاحة ( العقل والبيان)"
author = "المهند"
posted = "2008-02-11"
text = "اغتيال الفصاحة والعقل والبيان، بآياتٍ محكمات من القرآن<br />تتضمن الآية المعروفة من سورة النساء \"وإن خفتم ألا تقسطوا في اليتامى فانكحوا ما طاب لكم من النساء مثنى وثلاث ورباع فإن خفتم ألا تعدلوا فواحدة أو ما ملكت أيمانكم ذلك أدنى ألا تعولوا\" مسائل خلافية كثيرة منها ما هو لغوي ـ نحوي ومنها ماهو منطقي ـ عقلي ومنها ما له صلة بالتشريع وحقوق الانسان، نوردها هنا بشئ من الإجمال:<br />1 ـ اللغة والنحو:<br />تبتدئ الآية بالشرط \"إنْ خفتم\"... والشرط يقتضي جواباً أو جزاءً أو نتيجة تتفق معه كي يكتملَ ويتحقق المرادُ منه ففي قولك: ـ إن جئتني أكرمتك ـ يكون الإكرامُ جزاءَ المجئ، فلو لم يُذكرِ الإكرامُ هنا لبقي الشرط ـ إنْ جئتني ـ معلقاً ناقصاً ليس فيه تمامُ المعنى. وقد لاحظ علماءُ المسلمين سقوط الجزاء من الجملة الشرطية في الآية، فانبروا يتمحّلون له وجوهاً من التفسير والتخريج والتأويل، كان من أبرزها هذا التفسير: \"وإن خفتم ألا تقسطوا في زواج اليتيمات فدعوهن، وانكحوا ما طاب لكم من النساء سواهن\" وهو قول لم يستطع رغم التكلف أن يردَّ للشرط جزاءه العادل، فما أهونَ أن يقوم الاعتراضُ عليه بالتساؤل: وكيف صحَّ أن يكون الحثُّ على نكاح الحرائر جواباً صحيحاً مناسباً لشرط الخوف من عدم القسط في نكاح اليتامى؟<br />ومن جانب آخر فإنَّ عدم العدل في نكاح اليتامى إثمٌ والإثم معنى يستوجب النهيَ والردع، ولا تناسبه صيغة الشرط التي دلّت على تهاون وتقصير في احتساب الإثم.<br />وقد نجدُ في الآية فضلاً عما ذكرنا مفرداتٍ قلقة في مواضعها مبهمة تفتقر إلى الدقة في تحديد مدلولاتها. فلفظة اليتامى على سبيل المثال مبهمة لايُعرف المقصودُ منها على وجه اليقين: هل هي للأيتام من الذكور؟ أم هي لليتيمات من الإناث؟ أم هي للاثنين معاً؟ فإذا احتُجَّ بذكر ما يُسمى بسبب نزولِ الآية الذي رُوي عن السيدة عائشة دليلاً على إرادة الإناث، قلنا: كيف نزلت الكلمة من دون إشارة واضحة إلى مدلولها ولو بقرينة بعيدة فاحتاجت أن تفسرها لنا السيدة عائشة؟ ماذا لو أنَّ السيدة عائشة لم تُسأل عنها؟ فهل كنا اليوم علمنا المقصودَ منها؟ ثمَّ هل السببُ الذي ذكرته عائشة صحيح بالضرورة؟ ألا يحتملُ الشكَّ؟ فأين اللفظ الذي يشيرُ صراحة إلى القسط في \"نكاح\" اليتامى ويزيلُ اللبسَ عن إرادة القسط في \"أموال\" اليتامى؟<br />وقد جاء استخدام \"ما\" في الدلالة على النساء شاذاً عن القاعدة، فـ \"ما\" موصولة لغير العاقل والنساءُ عاقلاتٌ وقد ذُكِرن في الآية باللفظ والمعنى، ولسنا نعلم سبباً وجيهاً لاستعمالها بدلاً مِنْ \"مَنْ\" التي للعاقل إلا أن يكون الله أراد أنهن لا يعقلن؟<br />أما مثنى وثلاث ورباع فألفاظ معدولة عن ثنتين وثلاث وأربع، وهذه الألفاظ تصف حالة متكررة من حالات المعدود وتفيد الترتيب. فحين أقول: جاء القوم مثنى أعني أنهم جاؤوا في ترتيب خاص قائم على ثنائية أي اثنين اثنين. وقد يكون عددهم اثنين أو ألفاً أو مئات الألوف. وقد عدل\"الله\" عن صيغة اللفظ الحقيقي هنا وهي كما ذكرنا اثنان ثلاث أربع، فأدى عدوله عنها إلى الاشتباه باحتمال أن يكون المقصودُ نكاحَ النساء على ترتيب ثنائي أو ثلاثي أو رباعي من دون تقييد للعدد. والأخطرُ من هذا هو ما جاء من ربط الأعداد بحرف الواو التي تدلُّ على الجمعِ بدلاً من مجئ \"أو\" التي للتخيير أو الإباحة فأشكلَ ذلك على طوائفَ من الشيعة، فذهبت إلى جواز نكاح تسع نساء لأن حاصل جمع ثنتين وثلاث وأربع هو تسعة. كما جاء العطف بالحرف \"أو\" من قوله: \"... أو ما ملكت أيمانهم\" محيّراً للمفسرين فذهب بعضهم إلى وجوب عطفه على \"النساء\" ليكون التقدير \"... فانكحوا ما طاب لكم من النساء أو ما ملكت أيمانكم\" وذهب آخرون إلى ربطه بـ \"واحدة\"، \"... فواحدة أو ما ملكت أيمانكم\"<br />واختلف المفسرون في معنى الفعل \"تعولوا\" فمنهم من قال أنَّ المقصود \"لاتميلوا ولا تجوروا\" ومنهم من زعم أنّ المقصود \"لا يكثر من تعولون\" ومنهم من قال \"ألا تضلّوا\".<br />2 ـ المنطق<br />يعتمدُ \"الله\" على منطق لا يتقبله إلا عقلٌ مريض في تبليغ رسالته للناس. إنه يطلب من عباده المسلمين الذكور أن ينكحوا ما طاب لهم من النساء الحرائر مثنى وثلاث ورباع ومن الإماء ما ملكت أيمانهم إذا خافوا ألا يعدلوا في نكاح اليتامى، فجعل نكاحَ الحرائر أوالإماء مشروطاً بخوفهم من عدم القسط في نكاح اليتامى وكأنما خفيَ عليه أنّ الرجل إذا لم يقسط في اليتامى فلن يقسط في الحرائر أيضاً.<br />ومن غرائب هذا المنطق أنه يبيح للذكور من المسلمين أن ينكحوا ماطاب لهم من النساء ثم يشترط عليهم العدلَ وهو يعلم أنّ العدل فيهم لا يكون ولو رغبوا.<br />وربما تبادر إلى الذهن سؤالٌ: كيف يذكر نكاح اليتامى؟ واليتيمة لاتكون يتيمة إلا إذا كانت دون سن البلوغ، لأنها متى بلغت سن البلوغ انتفت عنها صفة اليتم ؟ فأما زعمهم بأنه من باب \"تسمية الشئ باسم ما كان عليه\" فهو متكلّف مصنوع. كما أنّ اليتم لم يكن حالة عامة تفرض سَنَّ قانون شرعي يباحُ بموجبه الزواجُ من الحرائر والإماء بدعوى الخوف من الجور على اليتامى. لقد كان في عدد محدود من البيوت لأنه لا يعقل أن يكون في كل بيت من بيوتهم أيتام. ومع ذلك يتخذ \"الله\" من هذه الحالة سبباً لإصدار قانون شرعي يبيح لجميع عباده من الذكور في كل مكان وزمان أن ينكحوا ما طاب لهم من النساء...<br />كان المنطقُ وسببُ النزول يقتضيان أن يجعل النكاحَ من الحرائر والإماء مقيَّداً محصوراً في الأوصياء على اليتامى مادام هؤلاء هم أصحاب القضية. إلا أنه لم يراعِ لغة المنطق وسمح بالنكاح المتعدد لجميع الذكور من المسلمين مع أنهم لا يملكون وصاية على يتامى؟<br />ويجدر بنا أن نذكر هنا أنّ الوصاية وحضانة اليتيم كانت تتمُّ عادة بكفالة ذوي القربى كالجد والعم والخال.مما يدفع إلى التشكيك في صحة الرواية المسندة إلى السيدة عائشة ويضعفها إلاَّ أن يكون زواجُ المحارم في ذلك الوقت شيئاً مألوفاً لدى العرب؟<br />3 ـ حق المرأة<br />المرأة إنسان وهي مساوية للرجل في الحقوق والواجبات، ولكن الآية تجرّدها من إنسانيتها وقد ظهر ذلك جلياً في أسلوب التعبير عنها بما الموصولة الدالة على ما لا يعقل. كما تجرح حياءَها بلفظ النكاح وهو من الألفاظ الجنسية الصريحة القبيحة التي يمجُّها الذوق المتحضر ـ ولو لم تكن كذلك لما جاءت في حديث له \"لعن الله ناكحَ البهيمة\" ـ وفي اللفظ \"طاب\" ما لا يخفى من الإيحاء بأنَّ المرأة إنْ هي إلا مجرد متعة من متع الحياة المادية.<br />أما التعدّدُ الذي تبيحه الآية فهو إهدار لكرامتها وأذى بالغ يصيب مشاعرها وقسوة لا يبررها شئ، وهو في كثير من الحالات يجرَّ خلفه مشكلات عائلية واجتماعية شديدة التعقيد.<br />ومما يدعو إلى الدهشة أن نرى \"الله\" وهو الخالق العادل يأذن للرجال أن ينكحوا ما ملكت أيمانهم من الجواري والإماء من غير إلزام بالقسط والعدل فيهن، وكأنّ الإماء لسن بشراً من خلقه.<br />4 ـ طائفة من التفاسير:<br />نضع في خاتمة المقال بعض التفاسير والشروح للإيضاح والاستئناس.<br />تفسير القرطبي<br />وروى الأئمة واللفظ لمسلم عن عروة بن الزبير عن عائشة في قول الله تعالى: \"وإن خفتم ألا تقسطوا في اليتامى فانكحوا ما طاب لكم من النساء مثنى وثلاث ورباع\" قالت: يا ابن أختي هي اليتيمة تكون في حجر وليها تشاركه في ماله فيعجبه مالها وجمالها فيريد وليها أن يتزوجها من غير أن يقسط في صداقها فيعطيها مثل ما يعطيها غيره، فنهوا أن ينكحوهن إلا أن يقسطوا لهن ويبلغوا بهن أعلى سنتهن من الصداق وأمروا أن ينكحوا ما طاب لهم من النساء سواهن.<br />تفسير الطبري:<br />قال أبو جعفر: اختلف أهل التأويل في تأويل ذلك، فقال بعضهم: معنى ذلك: وإن خفتم يا معشر أولياء اليتامى ألا تقسطوا في صداقهن فتعدلوا فيه، وتبلغوا بصداقهن صدقات أمثالهن، فلا تنكحوهن، ولكن انكحوا غيرهن من الغرائب اللواتي أحلهن الله لكم وطيبهن من واحدة إلى أربع. وإن خفتم أن تجوروا إذا نكحتم من الغرائب أكثر من واحدة، فلا تعدلوا، فانكحوا منهن واحدة، أو ما ملكت أيمانكم<br />الدر المنثور في التفسير بالمأثور للإمام جلال الدين السيوطي<br />\"كان أهل البيت يكون عندهم الأيتام في حجورهم، فيكون لليتيم الصرمة من الغنم ويكون الخادم لأهل البيت، فيبعثون خادمهم فيرعى غنم الأيتام، أو يكون لأهل اليتيم الصرمة من الغنم ويكون الخادم للأيتام، فيبعثون خادم الأيتام فيرعى غنهم، فإذا كان الرسل وضعوا أيديهم جميعا أو يكون الطعام للأيتام ويكون الخادم لأهل البيت، فيأمرون خادمهم فيصنع الطعام ويكون الطعام لأهل البيت، ويكون الخادم للأيتام فيأمرون خادم الأيتام أن يصنع الطعام فيضعون أيديهم جميعا، فلما نزلت هذه الآية \"إن الذين يأكلون أموال اليتامى ظلما...\" (النساء الآية 10) الآية. قالوا: هذه موجبة فاعتزلوهم وفرقوا ما كان من خلطتهم، فشق عليهم ذلك، فشكوا ذلك إلى رسول الله صلى الله عليه وسلم فقالوا: إن الغنم قد بقيت ليس لها راع، والطعام ليس له من يصنعه. فقال: قد سمع الله قولكم فإن شاء أجابكم. فنزلت هذه الآية {ويسألونك عن اليتامى} ونزل أيضا \"وإن خفتم ألا تقسطوا في اليتامى...\" (النساء الآية 3) الآية. فقصروا على أربع فقال: كما خشيتم أن لا تقسطوا في اليتامى وتحرجتم من مخالطتهم حتى سألتم عنها، فهلا سألتم عن العدل في جمع النساء.\"<br />تفسير الجلالين للإمام جلال الدين المحلِّي وجلال الدين السيوطي<br />\"ولما نزلت تحرَّجوا من ولاية اليتامى وكان فيهم من تحته العشر أو الثمان من الأزواج فلا يعدل بينهن فنزل: \"وإن خفتم\" أن \"لا تقسطوا\" تعدلوا \"في اليتامى\" فتحرَّجتم من أمرهم فخافوا أيضا أن لا تعدلوا بين النساء إذا نكحتموهن \"فانكحوا\" تزوجوا \"ما\" بمعنى من \"طاب لكم من النساء مثنى وثلاث ورباع\" أي اثنتين اثنتين وثلاثا ثلاثا وأربعا أربعا ولا تزيدوا على ذلك \"فإن خفتم\" أن \"لا تعدلوا\" فيهن بالنفقة والقسم \"فواحدة\" انكحوها \"أو\" اقتصروا على \"ما ملكت أيمانكم\" من الإماء إذ ليس لهم من الحقوق ما للزوجات \"ذلك\" أي نكاح الأربع فقط أو الواحدة أو التسري \"أدنى\" أقرب إلى \"ألا تعولوا\" تجوروا\".<br />مختصر تفسير ابن كثير ـ اختصار الصابوني<br />\"وإن خفتم ألا تقسطوا في اليتامى فانكحوا ما طاب لكم من النساء مثنى\" أي إذا كان تحت حجر أحدكم يتيمة وخاف أن لا يعطيها مهر مثلها فليعدل إلى ما سواها، فإنهن كثير ولم يضيق اللّه عليه، وقال البخاري عن عائشة: أن رجلاً كانت له يتيمة فنكحها وكان لها عذق، وكان يمسكها عليه، ولم يكن لها من نفسه شيء فنزلت فيه \"وإن خفتم ألا تقسطوا\" أحسبه قال: كانت شريكته في ذلك العذق وفي ماله، ثم قال البخاري: عن ابن شهاب قال: أخبرني عروة بن الزبير أنه سأل عائشة عن قول اللّه تعالى \"وإن خفتم ألا تقسطوا في اليتامى\" قالت: يا ابن أختي هذه اليتيمة تكون في حجر وليها تشركه في ماله ويعجبه مالها وجمالها، فيريد وليها أن يتزوجها بغير أن يُقْسط في صداقها فيعطيها مثل ما يعطيها غيره، فنهوا أن ينكحوهن إلا أن يقسطوا إليهن، ويبلغوا بهن أعلى سنتهن في الصداق، وأمروا أن ينكحوا ما طاب له من النساء سواهن، قال عروة: قالت عائشة: وإن الناس استفتوا رسول اللّه صلى اللّه عليه وسلم بعد هذه الآية فأنزل الله: \"ويستفتونك في النساء\" قالت عائشة: وقول الله في الآية الأخرى: و\"ترغبون أن تنكحوهن\" رغبة أحدكم عن يتيمته إذا كانت قليلة المال والجمال، فنهو أن ينكحوا من رغبوا في مالها وجمالها من النساء إلا بالقسط من أجل رغبتهم عنهن إذا كن قليلات المال والجمال. وقوله \"مثنى وثلاث ورباع\" أي انكحوا ما شئتم من النساء سواهن إن شاء أحدكم ثنتين، وإن شاء ثلاثا، وإن شاء أربعا، كما قال اللّه تعالى: \"جاعل الملائكة رسلا أولي أجنحة مثنى وثلاث ورباع\" أي منهم من له جناحان، ومنه من له ثلاثة، ومنهم من له أربعة، ولا ينفي ما عدا ذلك في الملائكة لدلالة الدليل عليه، بخلاف قصر الرجال على اربع فمن هذه الآية كما قال ابن عباس وجمهور العلماء، لأن المقام مقام امتنان وإباحة، فلو كان يجوز الجمع بين أكثر من أربع لذكره، قال الشافعي: وقد دلت سنّة رسول اللّه صلى اللّه عليه وسلم المبينة عن اللّه أنه لا يجوز لأحد غير رسول اللّه صلى اللّه عليه وسلم أن يجمع بين أكثر من أربع نسوة، وهذا الذي قاله الشافعي مجمع عليه بين العلماء، إلا ما حكى عن طائفة من الشيعة أنه يجوز الجمع بين أكثر من أربع إلى تسع، وقال بعضهم: بلا حصر وقد يتمسك بعضهم بفعل رسول اللّه صلى اللّه عليه وسلم في جمعه بين أكثر من أربع إلى تسع كما ثبت في الصحيح، وهذا عند العلماء من خصائصه دون غيره من الأمة لما سنذكره من الأحاديث الدالة على الحصر في أربع، ولنذكر الأحاديث في ذلك. قال الإمام أحمد عن سالم عن أبيه: أن غيلان بن سلمة الثقفي أسلم وتحته عشر نسوة، فقال له النبي صلى اللّه عليه وسلم: \"اختر منهن أربعا\"، فلما كان في عهد عمر طلق نساءه، وقسم ماله بين بنيه، فبلغ ذلك عمر فقال: إني لأظن الشيطان فيما يسترق من السمع سمع بموتك فقذفه في نفسك، ولعلك لا تلبث إلا قليلا، وأيم اللّه لتراجعن نساءك ولترجعن مالك أو لأورثهن منك ولآمرن بقبرك فيرجم كما رجم قبر أبي رغال (رواه الترمذي وابن ماجة والدار قطني) إلى قوله: \"اختر منهن أربعاً\" والباقي من رواية أحمد. وعن ابن عمر: أن غيلان بن سلمة كان عنده عشر نسوة، فأسلم وأسلمن معه فأمره النبي صلى اللّه عليه وسلم أن يختار منهن أربعاً، هكذا أخرجه النسائي في سننه. فوجه الدلالة أنه لو كان يجوز الجمع بين أكثر من أربع لسوّغ له رسول اللّه صلى اللّه عليه وسلم سائرهن في بقاء العشرة وقد اسلمن، فلما أمره بإمساك أربع وفراق سائرهن، دل على أنه لا يجوز الجمع بين أكثر من أربع بحال، فإذا كان هذا في الدوام، ففي الاستئناف بطريق الأولى والأحرى، والله سبحانه أعلم بالصواب. (حديث آخر) قال الشافعي في مسنده عن نوفل بن معاوية الديلي قال: أسلمت وعندي خمس نسوة، فقال لي رسول اللّه صلى اللّه عليه وسلم \"اختر أربعا أيتهن شئت وفارق الأخرى\"، فعمدت إلى أقدمهن صحبة، عجوز عاقر معي منذ ستين سنة فطلقتها، فهذه كلها شواهد لحديث غيلان كما قاله البيهقي."
