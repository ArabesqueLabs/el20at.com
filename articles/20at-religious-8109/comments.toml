subject = "سورو من مثلها!   وهنيئاً لك بالضلال يا (روتأبا)  و"
author = "مصطفى"
posted = "2008-02-11"
text = "سورة الحياة<br />34 آية<br />(1) نون حاء ميم. (2) هل أتاكُمُ حديثُ الخلقِ يومَ خلقَ اللهُ الأرضَ ثم خلقَ الحمارَ خدمةً للعالمين (3) وإذْ قال الله للحمارِ أنِ اِكْدَحْ إن اللهَ مع الكادحين (4) لا يستوي القاعدون من الحميرِ مع الكادحينَ إنّا فضّلنا الكادحين منهم على القاعدين درجةً ولهم من عندنا أجرٌ عظيم. (5) ولسوفَ تعملُ من الصباحِ حتى العشيّة تنيءُ ظهرَكَ الأحمالُ لا تتذمّر من لكزٍ ولا ضربٍ مُهين. (6) وخففنا عنكَ بأن حرمناكَ من التفكير فإن قيلَ لكَ \"حـا\" مشيتَ وإن قيلَ \"هش\" توقّفتَ دونَ أن يُجرَحَ إحساسُكَ إنّ في ذلك لآياتٍٍ لحميرٍ صابرين. (7) وخصصنا لك الأعشابَ طعاماً وجعلنا صوتك أنكر الأصواتِ لا يبُزُّهُ إلا صوتُ مؤذّنٍ يدوي في آذانٍ النائمين. (8) وقدّرنا لك أن تعيش من السنينِ خمسين. (9) قال الحمارُ ربّي أنّى لي أن اعترضَ على قدرٍ كتبتَه لي إني قبلت بما كتبتَ فاقبلني مع القانتين (10) إنما لي من لدنكَ رجاءٌ أن تَختزِلَ حياتيَ الزفتَ فلا تزيدنّ سنينها عن العشرين. (11) قال الله للحمارِ لكَ ما طلبتَ إنّ اللهَ لا يخيّب رجاء حمارٍ سيخرج من صلبه رفيقٌ لخير المرسلين. (12) وإذ يعلم الله حاجة الإنسان لحيوانٍ وفيّ أمين (13) خلقَ الكلب له وأمره أنْ كُنْ ما أردنا لك أن تكون (14) كنْ للإنسانِ صديقاً وحارساً لا يخافُ ولا يخون (15) تعملُ بما يأمرك به ولصغارِه ترضخُ وتستكين (16) تنبحُ ليلَ نهارَ محذّراً من ساعي بريدٍ أو زبالٍ أو عابرِ سبيلٍ أو لصٍ أو متلصلصٍ إن الله لا يحبّ المتلصلصين. (17) وتأكلُ من فضلاتِ طعامه التي يرميها لك إلاّ إذا اسعدَ الحظّ أولادك فولدوا خارج كوريا أو بلاد المسلمين. (18) وقدّرنا لك أن يطول عمرك حتى الثلاثين (19) وقال الكلب ربّي أنّى لي أن اعترضَ على قدرٍ كتبتَه لي إني قبلتُ بما كتبتَ فاقبلني مع القانتين (20) إنما لي من لدنكَ رجاءٌ أن تَختَزِلَ حياتيَ الزفتَ ولا تزيدنّها عن خمسة عشر من السنين. (21) قال الله للكلبِ لكَ ما طلبتَ إنّ اللهَ يستجيب لمن يشاء وهو أعدل العادلين (22) ثمّ خلقَ الله القرد للترفيه عن عباده الصالحين (23) وقال للقرد إنّك ستقضي جُلَّ حياتِكَ على الأشجارِ تقفز من غصنٍ إلى آخرَ تبعثُ السرورَ في قلوبِ الناظرين. (24) وقدّرنا لك أن تعيش إلى العشرين. (25) قال القردُ ربّي أنّى لي أن اعترضَ على قدرٍ كتبتَه لي إني قبلت بما كتبتَ فاقبلني مع القانتين. (26) إنما لي من لدنكَ رجاءٌ أن تَختَزِلَ حياتيَ الزفتَ ولا تزيدنّها عن عشر سنين. (27) قال الله للقـــردِ لك ما طلبتَ وقد أحسنتَ طلباً ولستكوننّ من الرابحين. (28) ثمّ خلقَ اللهُ الرَّجُلَ وسوّاه في أحسن تكوين (29) وقال للرجلِ أن تكاثرْ على الأرضِ وَلِيَكُنْ لكَ فيها ما شئتَ من بناتٍ وبنين (30) إنّا جعلناكَ سيداً على خلائقنا ومتّعناكَ بذكاء مبين (31) وقدّرنا لك من سنواتِ العمرِ عشرين (32) قال الرجلُ ربّي أنّى لي أن أعترضَ على قدرٍ كتبتَه لي إني قبلتُ بما كتبتَ فاقبلني مع القانتين. (33) لكن لي من لدنكَ رجاءٌ أفتجعلني أفضل الخلائق وتنعم عليّ بالذكاء والسلطان ولا تمنحني من سنين العمر إلا عشرين؟ (34) ربّي أعطني الثلاثين عاماً التي رفضها الحمار والخمسة عشر التي رفضها الكلب واحسِن إليّ بالعشرةِ التي رفضها القرد تجعَلْ حياتي ذات قيمة وانت أعظمُ المحسنين. (35) قال الله للرجلِ لك ما طلبتَ فاحمِل وزرَ ما طلبتَ ولا تَلُمْ غيرَ نفسِكَ إنّ اللهَ يعرفُ ما تَحْمِلُهُ الأيامُ وهو أعظمُ العارفين. (36) وكان للرجلِ ما سَمَحَ اللهُ بِهِ ومُنذئذٍ وحتى اليومَ وهو يعيشُ أعوامَهُ العشرينَ صاحبَ سلطانٍ عزيزَ النفسِ شامخَ الهامةِ عالي الجبين (37) ليتزوّجَ بعد ذلك فيعيشَ ثلاثين أخرى كالحمارِ، يكدحُ وتقصمُ ظهرَهُ الأحمالُ من شروقِ الشمسِ حتى غيابِها ليسَ مَنْ يقدّرُ له جهداً ولا مَنْ يُعين. (38) وإذ يكبرُ الأولادُ يعيشُ كالكلبِ خمسةَ عشر عاماً يحرسُ البيتَ راضيَ النفسِ قانعاً ببقايا طعامِ الآخرين. (39) ثم يشيخُ ليعيش أعوام القردِ العشرةَ يقضيها قافزاً بينَ بيوتِ أبنائه يرفّه عن أحفاده بحركاتٍ كحركاتِ السعادين. (40) وللذين آمنوا وعملوا الصالحات من حديث الخلق هذا ثلاثُ حِكَمٍ لعلّكم تتذكّرون. (41) أنْ تقنَعوا بما قدّرَ اللهُ لكُمُ ولا تَطلبوا زيادةً ولا إنقاصاً إنه أعلمُ بحاجاتِكُمْ وأنتم لا تعلمون. (42) وأنْ إذا عِشْتُمُ عِشــــرينَ عاماً بعزٍّ خيرٌ لكم من حياةٍ طويلةٍ تقضونَها كالحميرِ والكلابِ والسعادين. (43) وأن إذا استجاب الله لما تطلبون فليس كل ما يَسْتجيبُهُ خيراً لكم ولا تنسوا إنه أمكرُ الماكرين.<br />سورة الأفضال<br />(10 آيات)<br />(1) يا أيها الذينَ آمَنُوا إنّا خَلَقْناكُمُ مِنْ تِبْرٍ خَالِصٍ وَخَلَقنا الكُفّارَ مِنْ طينٍ فَفَضّلناكُمُ عليهمُ أجمعين. (2) ثمّ جعلناهمُ سُخْرِيّاً لَكُمْ على أن لا تَلْمَسَ أياديهُمُ مُطهّراتِكُم إنّهمْ لأعظمُ رِجْساً من الشياطين. (3) فإذا لَمَسَ أحدٌ مِنهُمُ ثِياباً لَكُم فاغسُلوها سَبْعَ مرّاتٍ أوِ احرُقُوها ثم اقطعُوا أنامِلَهُ واجلدُوه ولا تُحصوا إلى أن يشاء الله لكمُ أن تتوقفوا، إنه حسَّابٌ عليم. (4) وإذا شَرِبَ أحَدٌ مِنْهمُ مِنْ كوبِ ماءٍ لكُمْ فاكسِروا الكوبَ واضرِبُوهُ واخْلَعوا كَتِفَيْهِ كيْ لا تُنَجِّسَ يدٌ لَهُ مِنْ بَعْدُ مشرباً لكم إنَّهُ كان البادِئَ بالعُدْوانِ واللهُ لا يُحِبُّ المُعْتدين. (5) وإن صنَعَ واحدٌ مِنْهُمُ صَنيعاً حَسناً فلا تَأمَنُوا لَهُ أوْ لِصَنيعِهِ إنَّهم يُريدُونَ أنْ يَصدّوكُمُ عَنْ سَبيلِ اللهِ بِمَكْرِهِم واللهُ لهمُ بالمِرصادِ وَهُوَ أمْكَرُ المَاكِرِين. (6) لو شاءَ ربّكُم لَجَعلَ الناسَ سَواسِيةً لكنَّهُ مَيَّزَكُمُ عَنْهُمُ لِمَا أدّيتُمُ وَمَا سَتؤدّونَهُ مِنْ أفضالٍ للعالمين (7) فَسوّاكُمُ فَوقَهُمُ وجَعلَهُمُ الأسفلين. (8) فَلا تَظنّوا إنْ رأيتُم مُخْترَعاتِهِمْ وَاكْتِشَافاتِهِمْ أنَّهُم قَدْ سَبَقوكُمُ إلَى عِلْمٍ إنّا وَضَعنا العِلْمَ بَينَ أيديكُمُ قرآناً يَنْهَلُونَ مِنْهُ وَهُم لا يَعرفُون. (9) فافْتَحوا القرآنََ عندََ كلِّ اختراعٍ يَدّعون أنَّهُ من عِنْدِهِم وَبَحْبِشوا فيه تَجِدُوا كَذِبَ دعواهُمُ واللهُ يُرْشِدُكم إلى ما فيه لِتُظهِروه للكافرين. (10) ألمْ نَقُلْ إنّا جَعَلْناهُمُ سُخرِيّاً لَكُمْ فإنْ ينسَ أحدٌ مِنْكمُ وَعْدَ اللهِ يُذَكِّره اللهُ بما نسى وَيَغْفر لهُ إنّهُ غفارٌ رَحيم.<br />سورة الأمم<br />(15 آية)<br />(1) الله الذي خلق السماوات والأرض وخلق الإنسان (2) خلقَ الناس شعوباً ليتعارفوا لا ليتناطحوا وميز كُلاً منهمُ بلسان (3) خلق الأمريكانَ وأعطاهم الصولجان وخلق الألمان فجعل سياراتهم أحسنَ بنيان (4) وللطيبين من عباده خلق كوريا واليابان وجعل سياراتِهمُ بأرخص الأثمانِ إذ خصّهما بالهوندي والنيسان (5) رب المشرقين ورب المغربين فبأي آلاء ربكما تكذبان (6) خلق العربانَ وأعطاهُم الجِمالَ والألبان (7) فبأي آلاء ربكما تكذبان (8) خلق الأتراكَ والأفغان وميَّزهم بالتنباك والدخان (9) فبأي آلاء ربكما تكذبان (10) كلُّ من عليها فان (11) لهُ الملكُ والسلطان (12) فبأي آلاء ربكما تكذبان (13) يقبضُ الرزقَ عمَّن يشاءُ ويؤتيه من يشاءُ بغير حسبان (14) فصَلَ بني آدم عن الزعران فكان بينهما محيطان شاسِعان (15) فبأي آلاء ربكما تُكَذِّبان.<br />سورة عَرَجَ<br />(30 آية)<br />(1) الف حاء نون ضاد (2) وإذ قال النبيُّ ربّ اجعلْ لي من أمري مخرجاً فقد أخفيتُ عن أزواجي فِعْلَةً أخشى إن عَرِفنَ بها أن يُقِمنَ الدنيا ويُقعِدنها عليّ (3) فجاءهُ جبريلُ يقولُ نحنُ أعلمُ بما أتيتَ وقد رأيناكَ طيلةَ الليلِ مع أعرابية (4) ولا تخشَ أن يفتضحَ أمرُك فينفكَّ الناسُ عنكَ بعد أن يجدوك منافقاً شقيا (5) واذكرِ اللهَ الذي وعدَ أن يغفرَ ما تقدمَ وما تأخَّرَ من ذنْبِكَ قد كان وَعدُهُ أمراً مَقضيّا (6) عَلِمَ ربّكَ بما أتيتَ وبما ستأتي فحصّنَكَ تحصيناً قويا (7) قلْ للذين يستنطقونك سبحان الذي بعث إليَّ بحمارٍ اسمُه البُراقُ فأسرى بي على ظهرهِ إلى بيت المقدسِ عشيا (8) فحطَّ بي بمسجدٍ لم يُطْلِعْ ربُّكًمُ عليه من قبلُ أحداً لا إنساناً ولا جّيّا (9) وحشدَ لاستقبالي فيهِ إبراهيمَ وموسى وعيسى في نفرٍ من الأنبياء فرحَّبوا بي أخاً ونبيا (10) فصليتُ بِهمُ إماماً أوتيتُ بعدها بإنائين في أحدِهما خمرٌ وفي الآخرِ لبنٌ فاخترتُ اللبنَ وكان مذاقُه عذباً شهيا(11) وأوتيتُ بالمعراجِ فأُصعِدتُ فيه وجبريلَ حتى انتهيتُ إلى بابٍ من أبوابِ السماءِ الدنيا (12) فرأيتُ عليه مَلَكاً قال من هذا قال جبريلُ هذا محمدٌ قالَ أوَقد بُعِثَ قالَ نعم قال فلِيَدخلْ قد جعلَ الله لهُ السبيلَ سهلاً سويا (13) ودخلتُ السماءَ الدنيا فرأيتُ رجلاً تُعْرَضُ عليه الأرواحُ قلتُ من هذا قالَ جبريلُ مازحاً مالي أراكَ لا تعرفُ وقد حسبتكَ من قبلُ نبيا (14) هذا أبوكَ آدمُ يصنِّفُ الأرواحَ فيرى في بعضِها خبثاً ويرى الأخرى زكية (15) ورأيت رجالاً لهم مشافرُ كمشافرِ الإبل في أيديهم قطعٌ من نارٍ كالأفهارِ يقذفونها في أفواههم فتخرجُ من أدبارهم فقلتُ من هؤلاء قال جبريل أكَلةُ أموالِ اليتامى يعذبُهم ربُّهم عذاباً جهنميا (16) ورأيتُ نساءً معلقاتٍ بثُديهِنَّ قلت من هؤلاء قال نساءٌ فاحشاتٌ خَدَعْنَ رجالهنّ يعذبهنّ الله بما عملنَ عذاباً سرمديّا (17) وأُصْعِدْتُ السماءَ الثانية فإذا فيها ابن الخالةِ عيسى بن مريمَ وابنُ الخالة يحيى بن زكريا (18) وأُصْعِدْتُ السماءَ الثالثةَ فإذا فيها رجلٌ صورته كصورة القمرِ ليلةَ البدرِ جميلُ المحيا (19) قلتُ من هذا قال جبريلُ هذا أخوك يوسف بن يعقوبَ تُفرِدُ له في كتابِكَ فصلاً سخيّا (20) وأُصْعِدْتُ السماءَ الرابعةَ فإذا فيها رجلٌ قلتُ من هذا قال هذا إدريسُ وقد أسكنه الله مكاناً عليَّا (21) وأُصْعِدْتُ السماءَ الخامسةَ فإذا فيها كهلٌ أبيضُ الرأسِ واللحيةِ عظيمُ العُثْنونِ لم أرَ أجملَ منه قُلتُ من هذا قــالَ هوَ هارونُ بنُ عِمرانَ ذو الطَّلعةِ البَهيَّة (22) وأُصْعِدْتُ السماءَ السادسةَ فإذا فيها رجلٌ أسودُ طويلٌ أقنى قلتُ من هذا قالَ هذا أخوكَ موسى الذي أنقذَ شعبَه من العبوديَّة (23) وأُصْعِدْتُ السماءَ السابعةَ فإذا فيها رجلٌ كهلٌ على كرسيٍّ إلى بابِ البيتِ المعمورِ قُلتُ من هذا قالَ هذا أبوكَ إبراهيمُ المُسْلِمُ الحنيفُ بِئسَ من قالَ عنه أنه كان يهوديا (24) وأُدخلتُ بعد ذلكَ الجنةَ فرأيتُ جاريةً لَعْساءَ فسألتُها لمن أنتِ وقد أعجَبَتْني حينَ رأيتُها قالتْ لزيدِ بن حارثة تعويضاً لهُ منَ اللهِ عن زينبَ ومنَ السماءِ هَدية (25) وإذ قادني جبريلُ إلى سدرةِ المنتهى جلستُ وربي يلقّنني الصلاةَ فأُمِرتُ بخمسينَ ركعة من الصباحِ وحتى العشيَّة (26) ثم عدتُ أدراجي إلى السماءِ السادسةِ وإذ أخبَرتُ موسى بما أُمِرتُ قال فارجعْ إلى ربِّكَ واطلُبِ التخفيفَ منهُ إنه لم يبخلْ من قبلُ في أمرٍ عليَّ (27) وعدتُ إلى اللهِ أطلبُ التخفيفَ فحطَّ خمساً فقال موسى عدْ إليه واطلبِ التخفيف أيضاً ولا تخشَ شيّا (28) وعدت إلى الله ثانية أطلب التخفيف فحطَّ خمساً فقال موسى عد إليه واطلبِ التخفيف أيضاً ولا تخشَ شيا (29) وأخذت أصعد وأنزل ما بين الله وموسى حتى أُمِرْتُ بخمس ركعاتٍ رضيتُ بها وأرضيتُ موسى عليَّ (30) فسبحانَ من أسرى بي إلى بيت المقدس، آمِنوا بما سردتُ يدخلْكُمُ اللهُ جناتِ نعيمٍ ويرزق كلاً منكم أربعين حورية.<br />سورة المقاطعة<br />(26 آية)<br />(1) نحم (2) ونضرب الأمثالَ للجُهّال لعلّهم يَعقِلون (3) مَثَلُ الذين يَدْعونَ إلى مقاطعةِ الغربِ والأمْريكانِ وما يُنتِجون (4) كَمثَلِ الذين يَبغونَ غيظَ الطهارةِ يُبَوِّلون في ثيابِهم ويَتَغوّطون (5) لا يَتَجَمَّرون ولا يغتسِلون (6) أولئكِ على عمىً من أمرهِم وأولئكَ همُ الجاهلون (7) أبغيرِ آلاء الغربِ يَتَنَّعمون (8) وما أدراكمُ ما يقاطعون (9) هو الَّذي فجّرَ من الأعماقِ نُفايةً فجعلَ من النُّفايةِ زيتاً وجعلَ من الزيتِ تِبراً لهم لعلّهم يَشكرون (10) أبغيرِ آلاءِ الغربِ يَتنعَّمون (11) هوَ الذي نثرَ الأقمارَ في السَّماواتِ تنقلُ الأخبارَ لهم والأفلامَ والأنغامَ وكلَّ ما يَشتهون (12) ولولا ما أفاء بهِ عليهمُ لما برِحوا تحت الخيامِ قابعين (13) ألم يخلِقْ لهمُ الأسبرينَ والبنسلين وكلَّ دواءٍ ينتهي بِئِين (14) وكانوا من قبلُ ببولِ النوقِ وبسبعِ تمراتٍ دواءً لهُمُ قانعين (15) أبغيرِ آلاء الغرب يتنعمون (16) أليسوا على ورقٍ من صنعِه يكتبون وقرآنَهُم يطبعون (17) ومن ميكروفوناته يكبّرون ويرتّلون (18) خرّب الشيطانُ عقولَهم فصوّر لهمُ الغربَ شيطاناً وإن أصابتْهم من الشيطانِ بليّةٌ فإلى الغربِ يفزعون (19) أبغيرِ آلاء الغرب يتنعمون (20) أفليسوا على طياراتٍ وسياراتٍ من صنعه يتنقَّلون (21) فلينظرِ الذين كفروا إلى ما حولَهم وما بين أيديهمُ لعلّهمْ يعقلون (22) فلينظروا إلى البرادِ والغسالةِ والنشافةِ والتلفونِ وآلة غسلِ الصحون (23) ولينظروا إلى المذياعِ والكاميراتِ والحاسوبِ والتلفزيون (24) يريدون للغرب كيداً وما يكيدون إلا لأنفسهم عميٌ جهْلٌ لا يفقهون (25) هو الغرب الذي لا حول لهم إلا بِهِ وإليه أينَ توجّهوا يرجعون (26) وإنْ مِنْهُمُ من يقرّ بفضلِه فأولئك همُ على علمٍ بما هو خيرٌ لهم وأولئك همُ المفلحون.<br />سورة النبي<br />(21 آية)<br />(1) حومذ (2) واذكُرْ في الكتابِ يومَ أنْعَمْنا فيهِ على الأعرابِ بنبيٍّ من بينِهِمُ ورسولٍ من لدُنّا كريم (3) يومَ أضأنا بِمَولدِه الحجازَ وأرضَ المقدسِ والشامَ لنجعلَ منهُ فيما بعدُ نوراً للعالمين (4) ولقد خلقنا الخَلْقَ فجعلناهُ في خيرِ خَلقِنا وجَعلنا الناسَ فِرَقاً فجعلناهُ في خيرِ فِرقةٍ وجعلناهمُ قبائلَ فجعلناهُ في خيرِ قبيلةٍ وجعلناهمُ بُيوتاً فجعلناهُ في خيرِ بيتٍ فهو خيرُكُمُ بيتاً وخيرُكُمُ نَسَباً وللَّهِ ربِّكُمُ في خَلقِهِ شؤون (5) وقائداً حكيماً محارباً حُنُكاً مقاتلاً عنيداً ورهبةً للكافرين (6) ووكّلنا به قِساً كريمَ الأصلِ ومن العارفين (7) يلَقِّنه ما أوحينا بهِ من قبلُ إلى الأنبياء الأولين (8) ويعلِّمهُ الكتابَ يتلوه عليكُمُ دون لحنٍ نغَماً عذباً للسامعين (9) وميَّزناهُ بلسانٍ مُبين (10) أفيفترون عليه بعدَ هذا كذباً ويقولون هو من الأميين (11) لا وربُّكُمُ هو الأصدقُ ما كانَ أُمِّياً بل قارئاً كاتباً حصيفاً فصيحاً ومن البارعين (12) وإن همُ ألحنوا في قراءتِه من بعدِهِ فالإثمُ إثمُهُمُ ما كانَ لهُ من حيلةٍ في ما سيفعلون (13) ولقد أطلعناهُ على ما في خزائِنِنا وعلَّمناه ما لا تَعلمون (14) أطلعناهُ على ما في سبعِ تَمَراتٍ من شفاءٍ وما في العسلِ وبَوْلِ النُّوقِ من دواءٍ للمُبْتَلين (15) وأريناهُ دون غيرهِ من الخَلقِ كيف تطلُعُ الشمسُ وتغرُبُ على قرونِ الشياطين (16) فجعلناهُ في علومِ الحياةِ والطِبِّ قبلةً للسائلين (17) لا يَعصى عليه أمرٌ ولا يَخفى عليه سِرٌّ دفين (18) وأذِنَّا لهُ بما لم نأذَنْ لغيرِه من الرجالِ وميَّزناه في الْجِماعِ بقوةِ أربعين (19) وزوجاً صالحاً يعدِلُ بين أزواجِه بالقِسطاسِ وإن أولى الواحِدةَ منهُنَّ دون الأخرياتِ معروفاً إنْ هُوَ إلا بشرٌ كالآخَرين (20) وإن هفا غَفرَ اللهُ لهُ ما هَفا وما سيَهْفو إذْ جعلَه من المفضَّلين (21) وإذ قالَ الكافرونَ ما هذا إلا ولعُ والعٍ وأشاعوا عنهُ كل قولٍ أثيم (21) فللنبيِّ الأمرُ فيهم إن شاءَ أن تُحصَدَ رؤوسُهُم حُصِدتْ أو تُحْرَقَ بيوتُهم حُرِقَتْ وهذا جزاءُ المُعارضين.<br />سورة الكتاب<br />(99 آية)<br />(1) امذ (2) قل يا أيُّها المُضَلَّلون انظروا في ما بين أيديكمُ من كتابٍ والتمسوا عونَ اللهِ إن كنتم إلى الله راغبين (3) يفتح الله بصائركم وَيُرِكُمْ ما فيهِ من إفكٍ مبين (4) واقرأوا الفلقَ والهُمَزَةَ والفيلَ والعادياتِ والنازعاتِ والفجرَ والغاشيةَ والطارقَ والبروجَ والشمسَ والمُطَفِّفين (5) وعشراتٍ أُخرياتٍ لا نفعَ فيها ولا سمين (6) واقرأوا سورةَ الدخان فهل ترون فيها إلا الهذر الهجين (7) وهل ترون في الكوثر واللهبِ إلا شتماً لا يليق بالمرسلين (8) واقرأوا النساءَ والتحريمَ والأحزابَ وما حوتْهُ أخرياتٌ مِمَّا يندُّ لهُ مِنَ الخجلِ الجبين (9) واقرأوا ما حَوَتْهُ المُلْكُ ولقمانُ وأخرياتٌ من خرافاتِ الأولين (10) وإنْ وجدتم فيه من القول الصالحِ قليلاً فإنْ هو إلا نقلٌ عن لسان الصالحين (11) أفتجدونَ فيه بعدَ ذلك كتاباً يُنسَبُ حقاً إلى ربِّ العالمين (12) إن هو إلا قولُ شيطانٍ لَعين.<br />سورة \"المسلمون\"<br />(13 آية)<br />(1) الصم (2) قُل يا أَيُها الْمُسلِمُونَ إنَكُم لفي ضَلالٍ بَعِيد (3) إنَّ الَّذِينَ كَفَرُواْ بِاللّهِ ومسيحهِ لَهُمْ فِي الآَخِرَةِ نَارُ جَهَنّمَ وعَذَابٌ شَدِيدٌ (4) وجوهٌ يومئذٍ صاغرةٌ مكفهرةٌ تلتمسُ عفوَ اللهِ واللهُ يفعلُ ما يريد (5) يومَ يقولُ الرحمنُ يا عبادي قد أنعمتُ على الذينَ من قبلِكم بالهدى منزّلاً في التوراةِ والإنجيل (6) فما كان لكم أن تكفروا بما أنزلتُ وتضلوا سَوَاء السبيل (7) قالوا ربنا ما ضَلَلْنا أنفُسنا بل أضلنا مَنْ ادّعى أنه من المرسلين (8) وإذ قالَ اللهُ يا محمد أغويتَ عبادي وجعلتهُم من الكافرين (9) قالَ ربِّي إنما أغوانيَ الشيطانُ إنهُ كانَ لبني آدمَ أعظمَ المفسدين (10) ربي اعْفُ عني واغفرْ لي واقبلني معَ التائبين (11) إني بمسيحِكَ لَمُؤمنٌ وإني لَهُ لَساجدٌ مع الساجدين (12) ويغفرُ اللهُ للذين تابوا مِمَّن أغواهُمُ الإنسانُ ويبعثُ بمحمدٍ إذ كانَ للشيطانِ نصيراً إلى جهنّم وبئسَ المصير (13) وإذ قضى اللهُ أمراً فإنه أعلمُ بما يقضي وقضى وهو على كلِّ شيءٍ قدير.<br />سورة التجسد<br />(15 آية)<br />(1) سبحانَ الذي خلقَ السمواتِ فلم يجعلْ لها حدّا (2) وخلقَ الأرضَ وكوّرها وجعلها ماءً وجلدا (3) قُل للذين خُدعوا بدعوةِ الشيطان عَمِيَتْ بصائرُكُم فافتريتم على الله كذباً وكنتُمُ للشيطانِ سنَدا (4) إن الشيطانَ كان للإنسانِ عدواً ألدّا (5) لو شاءَ ربكم لاتّخذَ من الحجارةِ أولاداً له إذ هو الذي قال للكونِ كُنْ فكانَ وسبحانه أن يستشيرَ في أمرِه أحدا (6) سبحانه رب العالمين أن يتَّخذ من خلائقه ولدا. (7) قل للذين يمترون فيما أٌنزِلَ من قبلُ ليسَ المسيحُ خليقةَ اللهِ إذ كانَ مع اللهِ قبلَ البِدْءِ وهو معه أبدا (8) فيه وَمِنْهُ كانَ معَ روحِ قُدْسِهِ إلهاً سرمدياً واحداً أحدا (9) وإذْ بعثَ بهِ الآبُ للعالمين كما وعدَ (10) حلَّ في بطنِ عذراء كلِمةً، وخرجَ منه جسدا (11) عاشر الإنسانَ، علّم الإنسانَ، ماتَ عَنِ الإنسانِ فِدى، وكالإنسانِ رقدَ (12) وإلى أبيه السماوي بعدَ ثلاثةِ أيَّامٍ صعدَ (13) إن الذين كفروا بآياته وقالوا قولاً إدّا (14) لن يجعل اللهُ لهم من أمدهِ بدّا (15) أما الذين آمنوا بالله ومسيحِه فلهم مغفرةٌ وجناتُ نعيمٍ خالدينَ فيها أبدا.<br />سورة الإيمان<br />(10 آيات)<br />(1) واذْكرْ في الكتابِ الحواريينَ إذ عصفتِ الرياحُ بهم ليلاً وهم يُبحرون (2) إذ تراءى لهمُ على المياهِ طيفُ المسيحِ يمشي فقالوا أهوَ ربُّنا يهزأُ بنا أمْ قدْ مسنا ضَربٌ من جُنون (3) فجاءَهُمُ صوتُ المُعَلِّمِ أن لا تخافوا إني أنـــا هوَ أفلا تُبصِرون (4) فهتفَ هاتفٌ منهمُ يقولُ ربّي مُرْني إن كنتَ حقاً هوَ آتي على المياهِ إليكَ عسى أن يُبدِّلَ اللهُ شكِّي بيقين (5) قالَ فاسعَ إليَّ ولتكنْ للناسِ آيةً لعلَّهم يتذكَّرون (6) وإذ طفِقَ الحواريُّ يمشي رأى شدَّةَ الريحِ فخافَ وبدأ يغرقُ فصاحَ بربهِ يستعين (7) فمدَّ بيمينهِ لهُ فأخذهُ بها وقالَ يا قليلَ الإيمانِ هذا جزاء المُمْتَرين (8) وإذ ركِبَ السفينةَ معهُ سكنتِ الرياحُ لتوّها فسبَّحَ الحواريونَ بحمدهِ وهتفوا لهُ قائلين (9) أنتَ هوَ ابنُ اللهِ حقاً بكَ نحنُ آمنا وأمامَكَ نخرُّ ساجدين (10) قالَ طوبى للذينَ آمنوا ولم يَلبِسوا إيمانهمُ بشكٍّ فأولئك همُ المفلحون.<br />سورةُ العصفور<br />(19 آية)<br />(1) ونضرِبُ الأمثالَ للناسِ لعلَّهم يتذكَّرون (2) فمَثَلُ عصفورٍ ذكيٍّ كعصفورٍ ذكيٍّ رأى تباشيرَ الشتاءِ فرحلَ جنوباً ينشدُ الدفءَ وفيرا. (3) ومَثَل عصفورٍ غرٍّ غبيٍّ كعصفورٍ غرٍّ غبيٍّ رأى تباشيرَ الشتاءِ فأغمضَ عينيهِ ونامَ قريرا. (4) وإذ أمَرنا الرياحَ تعصِفُ والرعدَ يقصِفُ وجعلنا حولَه زمهريرا. (5) طارَ يَنْشُدُ دِفءَ الجنوبِ لكنَّ ربَّكَ كانَ أعظمَ تَقْديرا. (6) وأمْطرْنا عليهِ مِنْ فوقِهِ ماءً غزيرا (7) وحَكَمْنا عليهِ من بَعْدُ ألاَّ يطيرَ (8) فهَوَيْنا بِهِ أرْضاً وآتينــاهُ منْ لَدُنَّا قَشعَريرة. (9) هَوَى وربُّكَ أعْلَمُ أيْنَ هَوَى هَوَى إلى قُرْبِ ناقــــةٍ أتخَمنَاها كَثيرا. (10) فأفْرَغَتِ النَّاقةُ ما في بَطْنِها فنزلَ عليهِ وصارَ تحتَ روثِها مَغمورا. (11) قالَ أمّي لمْ تَرْضَ عليَّ، ولَو رَضِيَتْ لما انتهتْ حياتي على هذهِ الصُّورة. (12) ولكنْ ما أنْ بعثَ روثُها الدِّفءَ في جسمِه حتى انتفضَ فرَحاً وحُبورا. (13) وأخذَ العصفورُ يغنِّي فسمِعَ صوتَه هِرٌّ بعثَ بهِ ربُّكَ ليُتِمَّ أمراً كانَ مقدورا. (14) فرفع عنه الروثَ فسُرَّ العصفورُ سرورا. (15) لكِنَّ الهرَّ التهمَهُ وكانَ عقابُ ربِّكَ كبيرا. (16) وللَّذين آمنوا وعمِلوا الصَّالحاتِ مِمَّا سَرَدْنا ثلاثُ حِكَمٍ لعلَّكُم تتذكَّرون. (17) أن لا تَحسَبوا الَّذين يقذفونكم بالروثِ أعداءَ لكُم إذْ قد يكونُ في روثهِم نَفْعاً لكُم وأنتُم لا تَعْلَمون. (18) أن لا تَحْسَبوا الَّذين يَرْفَعونَ الروثَ عنكُم أصْدقاءَ لكُمُ إذ قدْ يكــونُ في ذلكَ أذىً لكُم وأنتُم تَعْمَهون. (19) وأنْ إذا كُنْتُمْ في مكانٍ دافئٍ ولو كانَ غطاؤكُم من الروث فاقنَعوا بِمَأواكم ولا تَنْطِقُوا ولا تَمْشُوا في الأرضِ مَرَحاً لعلَّكُم تَسْلَمون."
