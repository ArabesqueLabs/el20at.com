[[comments]]
order = 0
subject = "الدكتور بطرس  ابن بطرس غالى"
author = "محتار"
posted = "2008-10-18"
text = "الغالى بيقول ان الناتج القومى زاد 7 % وهذا هو معدل التنمية<br />طيب الناتج القومى السنة دى زاد 100 %<br />بمعنى اننى فلاح - كنت انتج 5 كيلو بامية - السنة اللى فاتت كان سعر كيلو البامية 5 جنية والسنة دى اصبح 10 جنية<br />هل معنى هذا ان الناتج القومى من البامية زاد 100 %<br />يا عم غالى قيمة الناتج القومى زادت لان تكلفة الانتاج زادت 100 %<br />انما الانتاج ثابت<br />هم ال 5 كيلو بامية<br />انا مش عارف الناس دى اللى عمالة تكذب وتقول زيادة الناتج والتنمية 7 %<br />طيب بيحسبوها ازاى<br />زيادة سعر البترول زود الدخل شوية - انما الانتاج ثابت<br />طيب البترول انخسف بية الارض يبقى النمو بتاعهم ينخسف بية الارض<br />فية واحد يشرح لنا - احنا مش فاهمين حاجة<br />المانيا بتقول ان معدل عندها نصف فى المية واحنا الاشاوس 7 فى المية - ازاى"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022002944/http://masr.20at.com:80/newArticle.php?sid=17940"

[[comments]]
order = 1
subject = "وقفة مصرية - قتلنا ورمينا من البلكونات بس اللى عاي"
author = "واحد"
posted = "2008-10-18"
text = "قصة هذا الرجل - هى عنوان مرحلة من الحكم فى مصر<br />عنوانها الكبير الفساد<br />ومن كتر ما كتب فيها جالنا غممان نفس<br />وقربنا نطرش اللى فى بطننا<br />ولازمنا قرف واكتئاب<br />الناس دى عايزة محاكمة قصيرة وحكم اعدام"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022002944/http://masr.20at.com:80/newArticle.php?sid=17940"

[[comments]]
order = 2
subject = "محسن منير السكري اعدام ان شاء الله علشان خاطر يبقى"
author = "واحد وخلاص"
posted = "2008-10-18"
text = "يا محسن يا منير السكري موضوعك في دبي بالصوت والصورة والدليل القاطع والبرهان الساطع<br />وخلص الامر<br />الانكار مش حيفيد يا ابني<br />وانت اللي اعترفت على سيدك وولي نعمتك<br />كان المفروض تشيل القضية لوحدك<br />لكن خنت الايد اللي عطفت عليك واتمدلتك"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022002944/http://masr.20at.com:80/newArticle.php?sid=17940"

[[comments]]
order = 3
subject = "ملياردير ومعفن هشام طلعت مصطفى"
posted = "2008-10-18"
text = "يعني يا معفن<br />خلاص لما لقيتها هربت منك<br />خلاص بأه شوف غيرها يا رمه<br />لكن اخدتك العزة بالاثم<br />فرحت في ستين داهية<br />ووقعت مع ناس كبار اوي شرطة دبي<br />تستاهل المشنقه"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022002944/http://masr.20at.com:80/newArticle.php?sid=17940"
