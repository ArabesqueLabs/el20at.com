subject = "الى المصري ابن المصري"
author = "سعود"
posted = "2007-10-21"
text = "اللي مسمي نفسه بالمصري ابن المصري<br />عندكم وعندكم<br />انت تضحك على نفسك؟<br />انت تعمل من نفسك شيء وانت لاشيء<br />اقمار صناعيه ايه يابابا.....انت بهيم ولاتفهم....اعرف من اللي مساهمين في اطلاق الاقمار ياراعي الجواميس<br />يبدو ان معاشرتك للجواميس اثرت على فهمك<br />اسرائيل خايفه من اننا نتجسس عليها.ههههههههههههههههه<br />مالعلم بتاعها بيرفرف ياجاموسه في احسن شارع في القاهرة<br />اما الدكاتره المصريين فللاسف نعم هذه حقيقه واقعه...وغلطتنا اننا نبحث عن كل ماهو رخيص<br />نعمل ايه<br />ارخص الموجود"
