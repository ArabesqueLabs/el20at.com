subject = "فلسطين والاسلام اهم من السيكس"
author = "سلمى"
text = "لا حول ولا قوة الا بالله يعني كل التعليقات مسكت في السكس وهات يا نقد ويا اراء مفيش حد يا جماعة اخد باله من مووضع السيرش على الاسلام اللي منعدم في الغرب ولا حد ركز ان المقال فيه معلومات تودي في داهية عن فلسطين والمسلمين السيرش عن فلسطين بيحصل في المستوطنات الاسرائيلية وما شابه وطبا السيرش عن السلمين كثير في بريطانيا علشان الارهاب وكله كوم وموضوع اليسرش بالحرب على الارهاب كوم احنا اكثر ناس بندور على امركيا طبعا ماهي الكل في الكل<br />ربن يعافينا واتمنى الا تكون هذه الاحصائية صحيحة"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193528/http://www.harb.20at.com:80/newArticle.php?sid=4998"

[[comments]]
