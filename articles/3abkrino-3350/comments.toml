subject = "موجود بكثرة فعالا"
author = "خالد حسن"
text = "ياجماعة الموضوع فعلا مهم والمقال لم يؤلف نتائج انا خلت بنفسي على موقع وجل ترند ووجدت نتائج افظع من هذه والادهى انها تتغير كل يوم وما يحدث بين الشباب كثير فالشباب العربي كمتعب فعلا الانترنت نافذة هامة ومفتوحة للجميع وانا بنفسي كنت اقوم بالسيرش عن هذه الاشياء عشرات المرات يوميا لم اكن اعلم يومها انها تضر بي وبديني ولان بعد ما هداني الله اندم كل دقيقة على كل لحظة ضيعتها في هذا الهباء ولكن هذا موجود وبكثرة بين فئات الشباب هدانا الله وهداكم<br />اما الاخ الذي شتم الكاتبة فلا اقول له الا ان يتلق بخلق الاسلام الحميد ولا يتسرع في الحكم على الناس بلا داعي فلاسلام دين حميد"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193528/http://www.harb.20at.com:80/newArticle.php?sid=4998"

