text = "ياجماعة تقوم الساعة على شرار اهل الارض وها نحن قد اقتربنا اللهم ارزقنا قبل الموت توبة وعند الموت شهادة وبعد الموت جنة ونعيما . المهم الشباب الصالح يحافظ على نفسه وان يدعى الله بالزواج . يا قوم انى داعا فامنوا على الدعاء<br />اللهم عليك بالذين يريدون فتنة فى الارض وفساد كبير. اللهم عليك بمن ساهم معهم . أمين أمين<br />مع تحيات السامبو السفيانى"
