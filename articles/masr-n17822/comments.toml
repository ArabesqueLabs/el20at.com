[[comments]]
order = 2
subject = "يا معارضة يا معارضة -- مين اللى هناك يسمع -- بتنفخ فى قربة مقطوعة"
author = "مش لاعب"
text = "حبس المعارضين زى ايمن نور بعد تلفيق تهمة لة<br />المحاكمات العسكرية للمدنيين<br />17 الف معتقل سياسى بدون اى محاكمة او جريمة<br />تدمير التعليم والصناعة والزراعة والجيل الحالى والقادم فى مصر<br />المعارضة فى نظام بوليسى قمعى يؤمن بالتصفية الجسدية والمعتقلات والتعذيب فى اقسام الشرطة وسحل الناس واغتصابهم والاستيلاء على اموال الدولة<br />معارضة يا عم ابراهيم عيسى من 20 سنة الناس بتنقد وتقول وتعارض وكل دة فى الهواء الطلق<br />اتكتبت ملايين المقالات المعارضة ولم ينظر فى احداها<br />طلعت الاف المظاهرات ولا فائدة<br />جميع النقابات المهنية حلت او وضعت تحت الحراسة او الوصاية ولا حس ولا خبر<br />الجامعات اصبحت تدار بامن الدولة وعلى باب كل كلية كتيبة مسلحة من الحرس امن مركزى<br />انصحك يا ابراهيم يا عيسى نصيحة لوجة اللة - تعمل زى ممتاز القط وابو حديد والفلوس هتنزل عليك زى المطر<br />هتركب طيارة الرياسة فى كل سفرية للريس وهتشترى بالبدلات فيلا بجانب نادى الجولف فى القاهرة الجديدة وسينعم عليك بارض وشاليهات فى الساحل الشمالى ويمك يمسكوك رئيس تحرير الاهرام على نفس الكرسى اللى قعد علية محمد حسنين هيكل<br />معارضة اية يا راجل<br />خليك حبوب"
archived = "2008-12-08"
capture_url = "https://web.archive.org/web/20081208065021/http://masr.20at.com:80/newArticle.php?sid=17822"

[[comments]]
order = 3
subject = "(العفو عند المقدرة)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "مبروك يابو خليل عفو السيد (الرئيس)<br />موش كل مرة تسلم الجرة<br />شكرا للسيد الرئيس و مبروك لابراهيم عيسى<br />أبراهيم يا عيسى نحن نقراء لك و لكن احيانا نختلف كثيرا<br />الحمد للة ربنا ستر؟!!!"
archived = "2008-12-08"
capture_url = "https://web.archive.org/web/20081208065021/http://masr.20at.com:80/newArticle.php?sid=17822"

[[comments]]
order = 4
subject = "لماذا قرروا ان يحاكموة اولا فى امن الدولة ثم قالوا جنح ومخالفات واستمرت القضية سنة او اكتر وحضور جلسات ومحامين ومذكرات ثم ييجى عفو رئاسى -"
author = "مش فاهم"
text = "برضة مش فاهم<br />ما كان من الاول<br />والا فية ظروف دولية وخارجية اتغيرت<br />والا يمكن الوضع الداخلى والحرايق والكوارث ومصائب رجال الاعمال وتذمر الشعب<br />فية حاجة مش قادر افهمها ولا استوعبها<br />اتركوا موضوع شفقة وديمقراطية الرئيس والكلام اللى لا يودى ولا يجيب<br />فية احد منكم فاهم حاجة من الكلام دة<br />وخصوصا ان ابراهيم ابو عيسى كان هيسلم نفسة ولم يكتب عريظة او عريضة استرحام لولى النعم يطلب العفو والصفح ويغلط نفسة ويقول فيها انة غلط وانة يستحق ضرب الصرم القديمة"
archived = "2008-12-08"
capture_url = "https://web.archive.org/web/20081208065021/http://masr.20at.com:80/newArticle.php?sid=17822"

[[comments]]
order = 5
subject = "كلنا بنحب مبارك وعلشان بنحبة لازم يحترم الحب دة ويسمعنا كشعب ولو شويا لانة خلاص الامورتتجة لطريق اللاعودة"
author = "فريدالاطرش"
text = "لومبارك دة جاى من الفضاء يعنى مش مصرى واتحدف علينا من السماء وبقى قدرنا وحكم اكتر من ربع قرن مع رفاهية ومساوة وتكافؤ فى الفرص ونهضة زراعية وصناعية غير مسبوقة مع قليل من السرقة والتجاوزات كطبع من اطباع البنى ادميين -غرورالدنيا مثلا - اسرةمحمدعلى حتى الملك فاروق -عصر عبدالناصر -السادات -لم يشهد هكذا تجاوزات -وبعدكدة معتقدش انة انا او اى واحدمصرى اوبيحب مصر الالما يقولك مبارك راجل خدم مصر لحد ما ويجب علية ليكسب احترام وقلوب وعقول المصريين ان يعدل القوانين والانظمة المقيدة للحريات وانظمة الانتخابات الفريدة من نوعها فى العالم ليتمكن الشعب باكملة من المشاركة بصوتة وراية وعقلة وفكرة لخدمت بلدنا لانها غالية علينا اغلى من اى رئيس اوملك حكم اوحيحكم وياريت لويتكرم سيادة الرئيس بعد اجراء التغيير والتعديل على بعض الانظمة والقوانين ان يعتزل الحياة السياسية بكل فخر وعز واحترام من شعب وفى حيسهر على خدمتة لغاية مايلاقى ربة وان شاء اللة يبقى راضيا مرضيا"
archived = "2008-12-08"
capture_url = "https://web.archive.org/web/20081208065021/http://masr.20at.com:80/newArticle.php?sid=17822"
