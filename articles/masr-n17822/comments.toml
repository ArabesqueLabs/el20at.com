order = 0
subject = "هنعارض"
author = "مش لازم"
text = "المفروض المعارضة تكون بناءة ومبنية على اسس متينة<br />ما تكنش هبل وعبط<br />الحكومة والمعارضة شركاء في هذا الوطن<br />لا بد من التعاون للنهوض بالوطن اما الصراع على السلطة فسيؤدي بالوطن الى الحضيض كما هو حاصل الان"
archived = "2008-12-08"
capture_url = "https://web.archive.org/web/20081208065021/http://masr.20at.com:80/newArticle.php?sid=17822"

