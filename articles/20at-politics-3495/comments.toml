text = "أختي أضع كلامك تاجا مشرفا على راسي والله يسعدك ويحفظك ويكتر من أمثالك الطيبين الطاهرين ويبارك فيكي ولكي وعليكي ..<br />ونسيت أحط إسمي بالتعليق قبل الأخيرة وهي بعنوان : دعوة للجميع لقراءة تعليقي كاملا لفضح المنافق الحقير محمد نواف<br />وشكرا لكم .....<br />عاشــــــــــــــــــــــق فلسطين : أعشقك يا فلسطين وأعشق ترابك ...."
