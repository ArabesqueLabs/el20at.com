posted = "2007-03-27"
text = "ليس هذا فقط ..<br />اضيفي الى ذلك ان الفلسطيني اللاجئ في لبنان لا يحق له بالعمل الا نادرا لدى من يشفق عليه<br />ولا يحق لمن تعب وتخصص في كلية الطب ان يعمل في اي مشفى غير مشفى فتح الفلسطيني او المراكز الصحيه المخصصه لهم<br />الغريب في الموضوع اننا كل يوم نبكي وننتحب على امجادنا المسلوبة في القدس<br />ونجمع التبرعات لاخواننا في فلسطين وندعو في خطب الجمعه ان يفك الله اسرهم ويخفف كربهم ونحن على الطرف الاخر نضيق عليهم الخناق ونعاملهم كأنهم مجرمون لان لا هوية لهم ولا وطن يرجعون اليه<br />لم يكفيني ان نحقر انفسنا بسؤ تعاملنا مع الفلسطيني فقط بل اننا اضفنا الى قائمة جرائمنا بؤس احتوائنا للعراقي ..<br />الم يقل رسولنا صلى الله عليه وسلم ( لا فرق لعربي على اعجمي الا بالتقوى ) ( من رضيتم خلقه ودينه فزوجوه )<br />وها نحن ما ان نسمع بخطيب لبناتنا يحمل احدى الجنسيتين العراقيه او الفلسطينيه حتى تنتابنا نوبات الصرع والغضب ونسال انفسنا كيف تجرء هؤلاء لطلب مصاهرتنا<br />عار علينا ان نسمى امة عربيه ونحن نقطع بعضنا في اروقة الشوارع اضطهادنا وعنصرية ..."
