subject = "لا إله إلا الله"
author = "عاشــ الحور والجنان ــق"
posted = "2008-07-01"
text = "أخي عاشق فلسطين دخلت على الرابط لكن والله ضيعت وقت كبير جدا في قراءة تعليقات الإخوة الأردنية والفلسطينيين لكني<br />اندهشت , تعليقات قذرة جدا والله وخارجة عن نطاق الأدب والفكر الطبيعي العقلاني , وأنا متأكد بأن الكاتبين لهذه التعليقات مش عرب ولا مسلمين , لكن مفترض عليك أخي الله يهديك إنك تصلح وتوقف المشكلة , بالعكس هيك والله رح تزيد المشكلة , لكن أسأل الله الهداية والصلاح للجميع واتقوا الله في كلامكم المكتوب فإنكم محاسبوووون والله حساب عسيراً , ألم تتذكروا قول النبي صلى الله<br />عليه وسلم : وهل يكب الناس في النار على وجوههم إلا حصاد ألسنتهم , اتقوا الله فإن القيامة قربت يا جماعة ...."
