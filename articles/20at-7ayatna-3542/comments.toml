[[comments]]
order = 1
subject = "السلام عليكم"
author = "atat_atat40@hotmail.com  عبدال"
posted = "2007-04-05"
text = "السلام عليكم2 والله حاجه تحير انا ممكن لو عندي وقت اتكلم حتي الشهر المقبل يعني شعرات وخيارات وحاجه تحير انت مثلا ايوة انت (انت انت ولانتش داري) ومحدش داري بالي بيحصل خالص (الباب الي يجيلك منه الريح سده واستريح) وحتي لو قفلته بالطوب مش هتستريح (الطيور علي اشكالها تقع )والله حاجه غريبه يعني انت رقبت الطيور كلها انت حتي متعرفش اليمامه من الحمامه (امشي عدل يحتار عدوك فيك)عدوك مش هيحتار انت لو مشيت عدل هيقتلك ويقلك (مبتصدقش ليه انت يهودي)مش عارف انا ملهم اليهود يا خويا ناس كويسين لا يقتلو ولا بيعملو حاجه وبيقولو(ان كبر ابنك خويه )يعني ايه اجبلو اخ من فين ولا اصغر انا و تصبح سلطه بص نصيحه (لاتمشي جنب الحيطه )عشان ممكن تقع لي رأسك ويلهوي علي أسك وهز وسطك والله هزار وكلام محتار ومفيش منشار والجو نار وروح لعبد الجبار وخد معاك حبه ازهار وليلك هيبقي نهار ومتحولش الانتحار وسيبك من الحمار وادخل جوه الدار وصلي علي المختار ووحد الواحد القهار وسلام عشان عايز اروح قندهار قبل ميطلع النهار"
archived = "2010-03-14"
capture_url = ""

