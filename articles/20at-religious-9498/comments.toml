text = "الموضوع كتير بايخ و تقريبا ما في موضوع لانو هادا ايشي بصير دايما مش بس من المسيحية للاسلام والعكس كمان حتى بكون من الاسلام للمسيحية اكتر لانو المسلمين اغلبية و عندهم طرق كتير لحتى يسيطرو و يدخلو المسيحين بالاسلام و للاسف اوقات كتير المسيحيين الي دخلو الاسلام بكتشفو انهم غلطو بعد فوات الاوان ..... يعني هادا مش موضوع مهم<br />و هادا رأيي بصراحة ..... شكرا الكم و شكرا للي كتب الموضوع :-)"
