text = "إذا كان الدين بالنسبة لهم عبارة عن أكل وشرب وشغل وفلوس يبقى الدين في غنى عنهم<br />يعني هم خرجوا من الاسلام عشان الفلوس ولما ماخدوش حاجة رجعوا تاني ... يا سلام<br />ربنا اعلم باللى في قلوبهم ... لكن عامة ديننا مش محتاجهم أصلا<br />حسبنا الله ونعم الوكيل<br />ربنا يغفر لهم ويحسن خاتمتنا"
