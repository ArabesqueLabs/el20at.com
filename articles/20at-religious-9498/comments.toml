[[comments]]
order = 5
subject = "الاسلام هو الحق"
author = "محمد"
posted = "2008-07-20"
text = "الانسان خطاء ولله غفور رحيم الا يتساءل اصحا ب الديانات الاخري عن تعدد طرقهم وانقسامهم زي المسيحيه كاثوليك وارثوذكس وهكذا اي مذهب هو الصحيح لكن الاسلام دين واحد ولله قال انا نزلنا الذكر وانا له لحافظون والحمد لله لا يستطيع شخص ان يحرف ولو حرف واحد فيه اما الديانات الاخري فافعل كما شئت ولن يكتشف والايه التي تقول غلبت الروم وهم من بعد غلبهم سيغلبون وتحققت بعدها بسنوات وايه اقتربت الساعه وانشق القمر فاثبتالعلم الحديث وجود انشقاق للقمر في عصر الرسول ص والاذان سمعه رواد الفضاء والغواصون تحت الماء مع اعترافنا بسيدنا عيسى عليه السلام ولكن المسيحيه تم تحريفها بواسطه التباع علي اهوائهم وكيف ان المسيح ابن الله ويتركه يصلب والرجل هنا يضحي بنفسه من اجل ابنه افلا تعقلون ارجوا ان يهديكم الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "هذا هو الفرق"
author = "طيف بدر"
posted = "2008-07-21"
text = "هذا هو الفرق بين دعوة الإسلام و دجل التنصير ... المنصرون يذهبون إلى مناطق الفقر و الجهل و الحاجة في العالم الإسلامي لاستغلال حاجة المسلمين لتحويلهم إلى النصرانية ... لكن قارن بين ذلك و بين إسلام الصحفية البريطانية إيفون ريدلي أو العالم الفرنسي موريس بوكاي أو الكاتب الفرنسي روجيه جارودي أو دخول آلاف الأوروبيين سنويا في الإسلام دون أن يصرف لهم لقمة واحدة أو قرش واحد من جيوب المسلمين<br />أنظروا إلى السيرة النبوية المباركة ... إن رسول الله (صلى الله عليه و آله و سلم) كان يختار لدعوته الفطناء النجباء في مجتمعاتهم ... أبو بكر الصديق ، عثمان بنةعفان ، وجهاء المدينة ... لم يطعم رسول الله أحدا ليستغله مثل المنصرين المفلسين<br />http://alayasser.maktoobblog.com"
archived = "2010-03-14"
capture_url = ""

