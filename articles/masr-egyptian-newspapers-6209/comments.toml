subject = "صوره صوره صوره..كلنا كده عايزين صوره"
author = "نيفين نيفى نوفا"
posted = "2007-06-09"
text = "الناس اللى ف الصضوره دول هم اعضاء السلام اليومى ليا مع واحده زميلتى ف الشغل ..كل يوم الصبح مثلا بقولها صباح شريف تقوللى صباح نظيف اقولها صباح جمال تقوللى صباح الحزب الوطنى اليمقراطى<br />بالنسبه للموضوع فالغريب و المثير للجدل ان الفرق بين مسئولينا و اى مسئولى بلد تانى ان عندنا بيتبعو نظام ودنك منين يا جحا<br />طيب ما تروحو من الطريق الاسهل علشان بتيجو تكحلوها بتعموها و الناس بقت بتفهم<br />الرساله واضحه"
