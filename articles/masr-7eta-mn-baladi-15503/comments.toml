author = "الكتابة بالحجر"
posted = "2010-02-27"
text = "البناء العربى المسلم الراقى اللى بيعمر الارض<br />دائما كانت الفتوحات العربية مرتبطة ببناء المدن<br />فى مصر تم بناء الفسطاط والقاهرة<br />وفى تونس القيروان<br />وفى المغرب طنجة والدار البيضاء<br />وفى العراق الكوفة والبصرة وبغداد<br />دين بناء مدن وتعمير<br />وليس هروب فى اديرة فى الصحراء<br />دين حضارة"
