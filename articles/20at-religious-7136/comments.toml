subject = "حرااام عليكو"
posted = "2007-10-12"
text = "واضح ان الاستاذة دعاء الشامي متعبتش نفسها واخدت اراء الناس كويس ...وبعدين اشمعنى اخدتي اراء الناس اللي مبيتفرجوش عالبرنامج او اتفرجو على 3حلقات او حلقتين ...يا استاذة دعاء لو حضرتك اتكرمتي ودخلتي موقع الاستاذ عمرو خالد ..هتلاقي انو كل يوم بيستقبل 1000 مشكلة او رسالة من الناس ..وبعدين انا هقولك عن زملائي اللي اصلا مبيتبعوش الاستاذ عمرو خالد ولا من متابعي البرامج الدينية اصلا البرنامج غير فيهم جدا ..ياريت بقى كفاية كره وحقد لكن من بيحاول يبذل مجهود انو ينظف عقول الناس من الفساد والتفاهه..وزياده على كده الاستاذ عمرو خالد هيتكرم ويعمل بعد العيد حلقات بتعرض مشاكل الاسرة بالتفصيل كل حلقه بتعرض مشكلة ...مش هقولك ولا هقول لعشرينات غير حسبي الله ونعم الوكيل"
archived = "2010-03-14"
