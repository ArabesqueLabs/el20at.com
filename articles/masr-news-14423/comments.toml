posted = "2009-12-16"
text = "قانون الطوارىء موجود علشان البية الكبير يقعد فى الشرم ياكل جمبرى وكباب - والشعب ينضرب بالجزمة القديمة - طيب ياريت يطبقوا قانون الطوارىء كما هو مكتوب - دول بيحكمونا بقانون المماليك اضرب المربوط يخاف السايب - قانون الطوارىء ليس فية محاكم امن دولة ولا محاكم عسكرية ولا تعذيب فى اقسام الشرطة"
