text = "كل الكلام خير يا عشرينات ولكن حتى المذيعة الحجبة والمحترمة لا تسلم من اقرب شخص لها وقد ذكرتم ان مذيعة تطلقت بسبب عملها وانا اضيف معلومة جديدة ان ابتسام الحبيل التي كانت مذيعة بالاقتصادية وانتقلت الآن لقناة الجزيرة الرياضية كأول اعلامية سعودية بالجزيرة وتضعون صورتها بالموضوع قد تطلقت من زوجها ايضا والله حسافة عليها ناجحة بالعمل وفاشلة بالزواج ..."
