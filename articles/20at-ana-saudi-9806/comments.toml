order = 0
subject = "إلى الأمام"
author = "محجبة سابقة"
posted = "2008-08-09"
text = "((كما تعرضت أخرى للضرب من قبل زوجها الذي طلقها أخيرا بسبب عملها في التلفزيون،)) قمة التخلف و الحجر على حرية المرأة<br />(( تعرضت الزميلة ريما الشامخ في قناة الإخبارية إلى جلطة وتم نقلها إلى خارج الوطن لتتلقى العلاج.<br />وقالت مصادر مقربة منها إن سبب ذلك أصابتها بعين مشاهد. )) تخلف و لكن من نوع آخر<br />(( أما عائض كثيم فقد عارض بشده ظهور الفتاة السعودية في التلفزيون، ويرى أن ذلك مدعاة للاختلاط وبالتالي حدوث ما لا يحمد عقباه. )) و ما الذى يمكن أن يحدث بين مزيعة فى التليفزيون و شاب جالس أمام التليفزيون ؟؟ هل سيمد الشاب يده و يلمس جسد المذيعة فيحدث ما لا يحمد عقباه ؟؟؟!!!!!!!!!!! تخلف و غباء<br />(( وكانت قناة \"المجد\" الإسلامية رفضت عمل المرأة بالقناة، ومنعت ظهور الفتاة في برامجها عامة،كما تمنع القناة كذلك استخدام الموسيقى في تترات برامجها. )) إلى الأمام يا أمتنا الإسلامية .. إلى الأمام يا أمة أشرف الخلق .. إلى الأمام يا شيوخنا الأجلاء .. زيدوا فى قهر و قمع المرأة أكثر و إظهروا فى الإعلام متشدقين بحرية المرأة و بأن حقوقها محفوظة .. و لكن و الله الذى لا إله إلا هو ستحاسبون على ما تفعلونه بنا يوم لا ينفع مال ولا بنون<br />محجبة سابقة"
