subject = "معاهدة كامب زفت بتقول تصدر غاز يعنى تصدر غاز"
author = "بنيامين بن جزمة"
posted = "2009-01-07"
text = "ياريت محكمة القضاء الادارى تصدر حكم نهائى غير قابل للطعن فى الغاء معاهدة كامب ديفيد من اساسة لو من اختصاصها لانة فية بنود فى المعاهدة تضر مصر اكتر من نفعها وياريت لو فية حد من حكومة الوطاويط يبقى عند اهلة شوية شفافية ويشرح او يشرح لنا بنود المعاهدة وينورنا بتقول اية فى الاقتصاد واية فى الثقافة واية واية واية اللة يخرب بيوتكم زى ماخربتوا بيوتنا"
