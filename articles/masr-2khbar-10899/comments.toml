[[comments]]
order = 3
subject = "الى المعلق السابق -- اتفاقية كامب ديفيد - اتفاقية"
author = "عيدى متنور من دشنا"
posted = "2009-01-08"
text = "معاهدة استسلام بيشرحها ابويا الشيخ الدرديرى على المصطبة<br />لما تستسلم لعدوك - من حق عدوك ييجى يلاعب مراتك فى البيت لعبة التورة<br />لما تستسلم لعدوك من حقة يضربك على قفاك فى وسط اجدع فرح او مجلس عزاء وتسكت<br />لما تستسلم لعدوك يبقى من حق عدوك يبعبصك فى اى حتة على مزاجة<br />دى كلام ابويا الدرديرى<br />على المصطبة القبلية فى عزبة ابو شومة قبلى دشنا"
archived = "2010-03-14"
