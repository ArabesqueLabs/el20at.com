subject = "حكم ادارى للحكومة - حكومة مين اذا كانت الحكومة بتا"
author = "مش قايل"
posted = "2009-01-07"
text = "يا ابويا انت بتنفخ فى قربة مقطوعة<br />حكم اية ولمين<br />دى قرارات عليا<br />فرمان همايونى اتخذ بعد استشارة المستشار الاسرائيلى<br />طيب واذا كانت الشركة اللى بتطلع الغاز اسرائيلية<br />بطلوا احلام يقظة<br />حكم ادارى قال - يا حللولى<br />ابقى سلم لى على الحكم الادارى بتاع اخراج الامن من حرس الجامعة<br />يا اخى قحة على الحكم الادارى<br />على فكرة الناس فى الشارع مش لاقية انبوبة غاز يطبخوا بيها"
archived = "2010-03-14"
