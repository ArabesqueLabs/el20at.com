subject = "عيد فرعونى قديم بمناسبة مولد الالاة حورس فى ديانة"
author = "مصرى فرعونى موحد باللة من ايام"
posted = "2008-04-27"
text = "دة عيد ليس علاقة بالدين المسيحى - انما عيد الربيع الذى يبدأ الفلاح المصرى القديم يشاهد اكتمال نمو محاصيلة زى البصل ونبات الحمص اللى هو الملانة ثم الخس ويرمز لة بالذكورة والنسل<br />وهذا عادة يأتى فى الشهر الفرعونى برمهات<br />والاجداد المصريين القدامى الموحدين بيقولوا فى امثالهم اذا اتى برمهات فروح الغيط وهات<br />والمعنى انك تروح الغيط فى بداية برمهات تلاقى سنابل القمح قد اكتملت والفول ممكن تجيب منة قرون الفول والشعير اكتمل والبصل رؤوسة كبرت وبقى ممكن يتاكل<br />فالمصرى بيحتفل بقدوم رزقة من الارض وخصوصا ان اعمال الزراعة فى تلك الفترة تكون قليلة<br />اذن هو عيد بعيد عن اى مفهوم دينى<br />اللى اخوانا بيحتفلوا بعيد ميلاد حورس فهذا موضوع تانى"
archived = "2010-03-14"
