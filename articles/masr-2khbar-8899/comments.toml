[[comments]]
order = 1
subject = "انا عايز اعرف هما مسميين نفسهم اقباط ليه"
author = "مش عارف"
posted = "2008-04-28"
text = "حد يقولي الجماعة المسيحيين دول مسمين نفسهم اقباط ليه وعلى اي اساس<br />طيب احنا المسلمين اصبحنا عرب لان القران مكتوب باللغة العربية فحبا بالقران اصبحنا عربا مثل القران<br />المفروض بقا المسيحيين دول اتولدوا لقوا نفسهم بيتكلموا عربي ولقوا الانجيل بتاعهم بالعربي المفروض يبقوا عرب زينا لان<br />الانجيل بالعربي<br />وبعدين مصر طول عمرها عربية حتى قبل الفتح الاسلامي والدليل على ذلك فرعونين<br />فرعون موسى كان اسمه الوليد بن مصعب<br />وفرعون يوسف كان اسمه الريان بن مصعب<br />وبعدين مستحيل مصر دي تكون كانت بتتكلم لغة غير اللغة العربية قبل الفتح الاسلامي لان المصريين دول صعب يغيروا لغتهم يعني الانجليز احتلوا مصر 70 سنه وخرجوا والمصريين هما هما بعكس الجزائر والمغرب وتونس فرنسا احتلتهم نسيوا اللغة العربية ويتكلمون الفرنسية افضل من اللغة العربية"
archived = "2010-03-14"
capture_url = ""
