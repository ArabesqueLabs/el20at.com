posted = "2009-05-17"
text = "يا خوفى يا بدران<br />السيد وزير المالية الموقر بطرس ابن بطرس غالى اعلن امام مجلس الشعب ان كل مداخيل الدولة من قناة سويس وبترول وسياحة وعاملين بالخارج 230 مليار جنية مصرى وان اجمالى المطلوب للصرف للوزرات يبلغ 310 مليار جنية مصر ى بعجز حوالى 100 مليار جنية الحكومة هتستلفهم من البنوك<br />يبقى بسلامتة هيجيب 10 % من اين ؟<br />هنا الخوف<br />مفيش مصانع باقية للبيع ولا بنك فية الطمع<br />يبقى يرفع اسعار حاجات تجيب دخل زى السجاير واسعار الكهرباء والمياة ورفع اسعار صفيحة زيت السيارة وحاجات كتير تعوض 10 % وتعمل دخل للخزانة اكتر من 20 %<br />يا خوفى يا بدران<br />لترتفع الاسعار وتولع نار علشان يعوضوا ال 10 %<br />ربنا يصبرنا على بلاوينا<br />ربنا لا نسألك رد القضاء ولكن نسألك اللطف فية"
archived = "2010-03-14"
capture_url = ""

