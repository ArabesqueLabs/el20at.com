text = "10 % زيادة<br />يعنى الموظف هيحصل على 20 جنية زيادة فى مرتبة<br />يعنى نصف كيلو لحمة<br />يا اخى احة<br />وبتمتطع وتقول 10 %<br />كان الموظف هيشترى يخت وسيارة وفيلا<br />ال 10 % تساوى نصف كيلو لحمة فى الشهر<br />المقدم جمال عبد الناصر والنقيب السادات واللواء حسنى خربوها يا رجالة<br />مستقبل اسود ينتظر الجميع<br />والجيل القادم يستعد لايام الجوع والهجامة والخطف والنهب والسلب<br />يا ولاد الكلب خربتم البلد"
