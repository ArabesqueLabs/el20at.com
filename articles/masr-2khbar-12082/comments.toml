author = "انا بردانه اح"
posted = "2009-05-17"
text = "ازاي حيزود العلامه في ظل الازمة المالية العالمية الطاحنة<br />يا شعب يا اهبل يا عبيط ما تصدقوش الكلام دا ما فيش حاجه اسمها علامات في مصر منذ ان حضر الشيطان اللي اسمه جمال عبدالناصر ومعاه بقية زبانية جهنم اللي بيسمو نفسهم اعضاء الثورة<br />في سنه من السنين كان معاش والدتي 30 جنيه مصري وكان بيكفي وبيزيد عليها<br />بعد حوالي 10 سنين ارتفع المعاش الى 300 جنيه بعد عدة زيادات طبعا<br />وما بقاش يكفي عشرة ايام في الشهر<br />يبقى فين الزيادات بقا<br />يا شعب يا اهبل ما تطلبوش زيادات مفيش حاجه اسمها زيادات<br />ما لوش لزمه<br />الحكومة بتضحك عليكو يا بهايم<br />البلد بتنهار<br />البلد بردانه اح<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــت<br />مش احمد الهواري ولا عبدالله الطحاوي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
