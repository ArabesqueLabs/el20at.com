author = "100 جنيه ما بتكفيش"
posted = "2009-05-17"
text = "علاوة ايه وبطيخ ايه وحتعمل ايه العلامه<br />دا الـ 100 جنيه ما بتكفيش النهار<br />100 جنيه دلوقتي بقت عامله زي الجنيه بتاع زمان<br />اي والله بس الجنيه بتاع زمان كان ليه قيمه<br />كان ممكن اسرة تصرفه في يومين تلاته<br />ايام ما كان بيتفك خمسينات وعشرات وشلنات وقروش وتعريفات<br />يا خسارة يا مصر<br />ضيعنا اعز سنوات العمر<br />وخليتي ولاد الكلب اليهود يضحكوا عليكي يا مصر<br />يا حبيبتي يا مصر<br />اصله ما عداش على مصر<br />مصر هي امي<br />نيلها هو دمي<br />شمسها في سماري<br />يا خسارته يا مصر في ادين ولاد الكلب<br />معرفناش نقف قصاد اليهود<br />ضحكوا علينا اليهود"
archived = "2010-03-14"
