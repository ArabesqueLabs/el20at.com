text = "دي باين عليها فوازي<br />مداخيل الدولة 230 مليار<br />الوزارات عايزه 310 مليار<br />وعايزين نزود عشرة 10%<br />يبقى ما فيش غير حل من تلاته<br />1) نزود اسعار السلع<br />2) او نزود الضراؤب<br />3) او نزود الجمارك<br />واللي يعرف الحل يتصل على رقم 009000000 من اي تليفون ارضي<br />او على رقم 1700 من اي محمول<br />يكسب 5000 جنيه اسبوعيا<br />وابقوا قابلوني في الحلقة الجاية"
