[[comments]]
order = 0
subject = "ثم إلي الوزير المهندس ماجد جورج"
text = "طيب ما هو فيه وزير مسيحي اهه اسمه ماجد جورج<br />امال الاقباط قالبين الدنيا ليه وبيقولوا انهم ما بياخدوش مناصب في الدولة"
archived = "2008-03-08"
capture_url = "https://web.archive.org/web/20080308110457/http://masr.20at.com:80/newArticle.php?sid=13719"

