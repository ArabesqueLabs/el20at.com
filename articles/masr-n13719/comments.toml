[[comments]]
order = 2
subject = "كل سنه وانت طيب يا ريس"
text = "كل سنه وانت طيب يا ريس<br />كل سنه وانت شبعان واحنا جعانين<br />كل سنه وانت نايم واحنا صاحيين<br />كل سنه وانت متجوز واحنا مش متجوزين<br />كل سنه وانت مبسوط واحنا زعلانين<br />كل سنه وانت مكسي واحنا عريانين<br />كل سنه وانت راكب واحنا ماشيين<br />كل سنه وانت سليم واحنا عيانين"
archived = "2008-03-08"
capture_url = "https://web.archive.org/web/20080308110457/http://masr.20at.com:80/newArticle.php?sid=13719"
