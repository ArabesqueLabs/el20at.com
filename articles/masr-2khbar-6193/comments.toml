subject = "الاقباط افضل اقلية في العالم"
author = "مش ضروري"
posted = "2007-06-06"
text = "لازم يعرف الاخوة الاقباط انهم افضل اقلية في العالم واللي مش مصدقني يشوف الاقليات المسحية في العالم عايزين ازاي وعلى سبيل المثال لا الحصر (المسيحيون في الهند) اعملوا مقارنة بين المسيحيون في الهند والمسيحيون في مصر وبعدين ابقوا تعالوا اتكلموا<br />ثانيا: الاقليات الاسلامية اتعس اقليات في العالم اتعس من الاقليات المسيحية يعني المسيحيين في الهند 30 مليون فقط المسلمون في الهند 150 مسلم لان المسيحيين افضل منهم بكثير ونشوف على سبيل المثال لا الحصر المسلمون في الفلبين اعملوا بينهم وبين المسيحيون في مصر مقارنة وشوفوا ايه النتيجة<br />وعايز اقول هنا حته صغيره<br />رئيس الولايات المتحدة لازم يكون بروتستانتي لماذا<br />لماذا الكاثوليك والارتدكس في امريكا ما يطالبوش بحكم الولايات المتحدة لماذا لا يطالبون بحق المواطنه هناك<br />مرة واحد كاثوليكي كسب الانتخابات الامريكية اعتقد اسمه كندي (اليهود حشه رقبته) على طول<br />فيرجى من الاخوة الاقباط عدم الخروج على النظام الموجود في مصر تماما كالولايات المتحدة الامريكية"
