text = "تتركونه بلا إجابة على كثير من المسائل التي يؤمن بها بعد أن ثبتت له بأدلة نقلية وعقلية. تتركونه وسط خلافاتكم وفقهكم المتخم وتفاسيركم المتناقضة وكراهيتكم فيما بينكم. وحين يرتد لن يلتقي معكم إلا في الكفر بالمسيح الموعود عليه السلام، أما ما تبقّى فلا يمكن أن تتفقوا معه بشيء عليها، لأنكم –أيها الخصوم- مختلفون فيها أشد الخلاف.. أي أنكم تطالبونه بالردّة"
