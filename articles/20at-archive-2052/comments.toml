subject = ""
author = "اسامة"
posted = "2009-05-20"
text = "يبذل كثير من الناس قصارى جهدهم ليردوا الأحمديين عن إسلامهم الحق من خلال تشويه سيرة المسيح الموعود عليه السلام وآيات صدقه. ولطالما اصطدمتُ بهؤلاء..<br />كل أحمدي يؤمن أن القرآن الكريم منزه عن أي نسخ ونقصان، فهل يترك هذا ليقول إن القرآن فيه تناقضات بين أحكامه، وأن هناك أحكاما فيه تلغي أحكاما أخرى؟<br />من دون بديل.. أي أنكم لا تحملون أي رسالة بناء، بل رسالة هدم. وما أسوأ الهدم! .<br />الأحمدي الجديد لا يحمل حقدا على ماضيه، بل شفقة ورحمة ورغبة عارمة في هداية معارفه وأصحابه.. لا يعرف المقت والكراهية والقسوة والشدة.. بل لسان حاله يقول: اللهم اهد قومي فإنهم لا يعلمون.<br />الأحمدي الجديد يعرف أن الطريق صعب طويل، وأن التشويه كبير، وأن إبليس بذل جهودا جبارة، لكنه يعلم أن الإيمان يتفوق على هذا كله، وأن الله يهدي من يشاء.<br />فيا محترفي التشويه، لن نتردد في البناء مهما هدمتم.. لن تضعف شفقتُنا مهما قسوتم.. لن نتوقف عن الدعاء لهدايتكم مهما كفرتم. والعاقبة للمتقين.<br />هاني طاهر 1-11-2008<br />أضف الى مفضلتك<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــ"
archived = "2010-03-14"
