subject = "واأسسسفاه"
author = "أم أحمد الأحمد"
posted = "2007-11-21"
text = "أخي طارق لقد ابتدأت حديثك بالسلام على القارئ وأنهيته بالحرب علي نفسك , فلا تعليق على هراء وتخاريف من نسخ الخيال ,والله سيعلق بنفسه آجلا أم عاجلا على كل ماتقول ويقولون وفى به هاديا ونصيرا . ونصيحتي لك أن تصلي لله ركعتين كل يوم صلاة إستخارة طالبا منه أن يهديك إلى الحق ويسامحك على ماأوردت من أكاذيب وإفتراآت..... والله المستعان على ما تصفون"
