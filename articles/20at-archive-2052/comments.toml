[[comments]]
order = 7
subject = ""
author = "اسامة"
posted = "2009-05-20"
text = "كل أحمدي يؤمن أن سيدنا محمد صلى الله عليه وسلم أفضل البشر، وشريعته آخر الشرائع، وأنه أكمل الأنبياء، فهل يترك هذا ليقول إن المسيح سينزل من السماء لينسخ الحرية الدينية؟<br />كل أحمدي يؤمن أن الرسول صلى الله عليه وسلم لم يُبِح زواج المتعة ولا رضاع الكبير ولا قتل الأسرى ولا قتل غير المقاتلين، فهل يترك هذا لينسب إلى أكمل البشر وخير الرسل هذه الفظائع<br />كل أحمدي يؤمن أن الأنبياء معصومون عن الخطأ، وأن أيوب عليه السلام لم يُقسم على أن يضرب امرأته مائة جلدة لمجرد أنها نصحته بأن يتوجه إلى الله بالدعاء، وأن داود عليه السلام لم يتزوج تسعا وتسعين امرأة ثم طمع بامرأة قائد عسكري فعمل على قتله ليتزوجها، وأن سليمان عليه السلام لم يَسْهُ عن الصلاة وهو يتفقد خيوله، فغضب عليها فقتلها، وأن لوطا عليه السلام لم يعرض بناته على الشواذ للزنا ولا للزواج، وأن إبراهيم عليه السلام لم يكذب أي كذبة… فهل يترك هذا كله وينسب لهؤلاء العظماء خطايا كبيرة؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = ""
author = "اسامة"
posted = "2009-05-20"
text = "كل أحمدي يؤمن أن الصحابة حفظوا الأمانة وصانوا وصايا رسول الله صلى الله عليه وسلم، وأنهم ظلوا على العهد، ونقلوا لنا القرآن بالتواتر كما نزل. فهل يترك هذا ليؤمن بأنهم خانوا وأضاعوا من القرآن ما أضاعوا؟<br />كل أحمدي يؤمن أن المسيح عليه السلام قد مات بعد أن نجا من الصليب، فهل يترك هذا ليؤمن أنه جالس في السماء عاطلا بلا عمل، أم يؤمن بأنه مات وسيحييه الله ثانية، أم ينكر أحاديث النزول المتواترة، أم يستخف بالأحاديث ويقول إنها تتحدث عن فترة انقطاع التوبة وعدم قيمة الإيمان؟<br />كل أحمدي يؤمن أن سليمان عليه السلام لم يكن يتحدث مع الحشرات والعصافير، فهل يترك هذا ليؤمن أنه كان يضيع وقته في الحديث مع النملة والنحلة والدبور؟ أم يؤمن أنه كان يسجن الجن الشبحي؟ أم يؤمن أنه أقسم أن ينتف ريش الهدهد إن لم يأته بحجة ساطعة؟<br />كل أحمدي يؤمن أن الكذب على المسلم وغير المسلم حرام، ومثله الغدر بهما وخيانتهما. فهل يترك هذا ليجيز الكذب على غير المسلم والغدر به؟"
archived = "2010-03-14"
capture_url = ""
