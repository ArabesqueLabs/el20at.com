text = "حسبي الله ونعم الوكيل<br />قال تعالى ( ومن يبتغ غير الاسلام دينا فلن يقبل منه وهو فى الأخره من الخاسرين)<br />قال خاتم النبيين محمد ابن عبدالله عليه افضل الصلاة واتم التسليم(ستفترق أمتي على ثلاث وسبعين فرقة، فرقة ناجية والباقون في النار) فلتتبوئي مقعدك في النار يامرأة ان لم تتوبي وتعودي لدين الله وهو الإسلام"
