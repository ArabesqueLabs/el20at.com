text = "السلام عليكم ورحمة الله وبركاته.الم تقرأ قول الله سبحانه وتعالى {يَا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءكُمْ فَاسِقٌ بِنَبَأٍ فَتَبَيَّنُوا أَن تُصِيبُوا قَوْماً بِجَهَالَةٍ فَتُصْبِحُوا عَلَى مَا فَعَلْتُمْ نَادِمِينَ }الحجرات6 وقوله {وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ }الملك10,سامحك الله,تصفَح موقع الجماعة على العنوان:www.islamahmadiyya.net"
