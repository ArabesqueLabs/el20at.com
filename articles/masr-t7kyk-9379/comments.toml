subject = "نظام الحكم لا يصلح لادارة دولة تعدادها 75 مليون ان"
author = "السيد الغول"
posted = "2008-06-20"
text = "نعم - الدولة تدار كانها معسكر قوات امن مركزى<br />يوجد قائد للمعسكر - يهتم بالبروجى اللى بيضرب تعظيم سلام لة عند دخولة من باب المعسكر<br />والمعسكر مكون من كتائب كل كتيبة او كل محافظة لها لواء قائد محافظ<br />اما الطعام للمعسكر فبييجى او يأتى من خارج المعسكر سواء بالشحاتة او بالقروض<br />الذين فى المعسكر ليست لهم وظائف ولا عمل وليس مطلوب منهم اى انتاج<br />فى هذا النظام الفاشل لا خطط ولا تنمية غير فتح المواخير واماكن المسخرة والفنادق والشواطىء فى شرم الشيخ والغردقة والساحل الشمالى<br />كل شىء فى المعسكر يدار بواسطة الامن<br />وعايز تنزل اجازة تدفع للصول رشوة اى ان الفساد يملىء المكان<br />وانهار كل شىء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "كما تكونوا يولى عليكم شعب زبالة"
author = "حسين كامل"
posted = "2008-06-20"
text = "يا عمي الشعب المصري مدلع نفسه أوي ... محافظ الاسكندرية مثلا قال ان المحافظة ارادت حل مشكلة الزبالة فتعاقدت مع شركة اجنبية لجمع القمامة ... الشركة وزعت الاف الحاويات في الشوارع ... المصريون سرقوا اكثر من سبعة الاف حاوية وحولوها الى ثلاجات وخزانات ملابس ... المحافظة وزعت اعمدة الانارة على طول الكورنيش لتجميل المدينة ... المصريون يقلعون يوميا ما بين 200 الى 300 عمود ويبيعون الاعمدة في سوق الخردة ... ولما قررت وزارة السياحة تشجيع السياحة الداخلية بتخفيض اسعار الفنادق للمصريين في شرم الشيخ .... هجم المصريون على الفنادق ... نزلوا فيها ... وقبل ان يغادروها خلعوا الاسرة وكراسي الحمامات واخذوها معهم .... وفي طول مصر وعرضها لن تجد غطاء بالوعة واحدة في مكانه ... سرقوا الاغطية وباعوها في سوق الخردة .... ولما قرر مطار القاهرة بناء اعمدة انارة في مطاره الجديد لارشاد الطائرات في حالة وجود ضباب قام الحراس - حراس المطار - بفك الاعمدة ونقلها على الحمير وبيعها في سوق الخردة ايضا<br />ايه الدلع ده ؟ ... شعب مدلع نفسه أوي ... ويوم امس طالعتنا الصحف المصرية باخر اخبار امتحانات الثانوية العامة ... رئيس لجنة في احدى المحافظات يبيع الاسئلة بثلاثمائة جنيه لكل مادة .... وامهات مصريات يطلبن مهن الرئيس مبارك التدخل شخصيا لان اسئلة الفيزياء كانت صعبة أوي والعيال يا عيني اغمي عليهم في قاعات الامتحان<br />وتضيف احدى الصحف المصرية :بعد هدنة مؤقتة، عادت الدموع من جديد لتنساب من عيون طلاب الثانوية العامة. شهدت لجان امتحان مادة الفيزياء أمس، حالات إغماء وسط شكوي جماعية من صعوبة الامتحان،وفي الوقت الذي أكد فيه رئيس عام الامتحانات أن الامتحان جاء في مستوي الطالب المتوسط، اعترف مدرس أول للفيزياء عضو بلجان تطوير المناهج، بأن الامتحان طلب إثبات قانون من خارج المقرر بآخر من الكتاب المدرسي، ودعا بعض أولياء الأمور الرئيس مبارك للتدخل لإنهاء مأساة الثانوية العامة - حسب وصفهم -.وشهدت معظم لجان الجمهورية حالات إغماء وانهيار وتمزيق لأوراق الإجابة، وشكا طلاب من عدم كفاية زمن الامتحان للإجابة، وأكدوا أن الامتحان يفوق مستوي الطالب المتميز"
archived = "2010-03-14"
capture_url = ""

