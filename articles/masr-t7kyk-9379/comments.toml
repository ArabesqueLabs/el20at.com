[[comments]]
order = 32
subject = "طبعا ده رأي ثلاثة أو أربعة من المصريين على الأكثر"
author = "خحمش"
posted = "2008-07-16"
text = "الإستطلاعات الحقيقية أن 83 % من الشعب المصري لا يثق في حسني مبارك و السبعة عشر الباقين ، إما هم مخدوعين لا يعلمون مهمة رئيس الجمهورية و حقوق الشعب في الوطن أو أنهم مستفيدين من الوضع و هم غالبية السبعة عشر بالمائة ، أعرف مثلا مدير في الضرائب راتبه 900 شهريا و هو مليونير و إبنه يتعلم في أمريكا بمليون جنيه في السنة تقريبا ، هذا المرتشي لم يتعرض له أحد في عهد حسني مبارك أنا أعتقد أنه من أشد مؤيدي الرئيس و هو طبعا ممن يثقوا فيه ، الحقيقة أن الشعب المصري مغلوب على أمره تماما و إجتمع عليه الفقر و الجهل و المرض و حسني مبارك و نظامه فكانت المحصلة النهائية شعبا أقل كثيرا لما نتمناه لمصر. . القادم يتأرجح بين سيناريوهين الأول أي يموت الرئيس ( و هو بالمناسبة مآله الموت كغيره من البشر و إن بدا لنا غير ذلك) و يأتي بعده من يحترم إرادة الشعب و ساعتها سيعلم الشعب ماهي أبعاد مآساته في ظل حكم حسني مبارك و السيناريو الآخر و هو السيناريو الحكومي أنا يحكم جمال مبارك كما هو مخطط له من عدة سنوات و يكون خير خلف لخير سلف و بالروح و الدم نفديك يا فلان و عندها سوف يكفى على المرحلة المباركية ألف ماجور و سوف يخسر الشعب البقية ا لباقية من وعيه و إرادته ."
archived = "2010-03-14"
capture_url = ""

