[[comments]]
order = 13
subject = "المهانة والشللية والاولاد الهواة فى الحكم اضاعوا ا"
author = "wvn"
posted = "2008-06-21"
text = "انا يهمنى التنمية والبناء فى البلد<br />ما يوجع قلبى - هو النتيجة صفر فى التنمية<br />كم مصنع ينتج وبنى فى الفترة الحالية او العشرين سنة الماضية فى الزقازيق - او طنطا - او سوهاج<br />البلد تدار وتحكم باسلوب العزب او الابعديات الخاصة<br />ابن صاحب العزبة بيروح الفلاحين لعزبة ابوة يركب حصان ويتمشى شوية على الترعة وخلاص<br />انما الفلاحين عايشين ازاى - مش مهم - لا تعنية<br />سكان احياء العشوائيات حول القاهرة بيشتغلوا فين او بينتجوا اية - لايهم - مش شغلتة<br />اذا كانت البلد بدون اى تنمية ولا مصانع<br />وفقط باعوا الارض للشركات الخليجية لتبنى عليها قصور وفلل للسعوديين والخليجيين ليقضوا فيها الليالى الملاح مع البنات الصبايا الصغار الذين يتزوجوهم بعقد عرفى وعند نهاية الصيف يتركونهم حوامل ويعودوا الى بلادهم<br />هل هذا هو الاثتثمار<br />احدكم يذكر لى مصنعا كبيرا بنى فى طنطا فى العشرين سنة الماضية او مصنعا فى قنا او اسوان<br />احنا اصبحنا عزبة<br />حسب اللة<br />مصر تموت<br />اليس هناك ولد يقوم لينقذ ما يمكن انقاذة"
archived = "2010-03-14"
capture_url = ""

