[[comments]]
order = 17
subject = "الذى كان والذى سيكون - مستقبل اسود ينتظر الجيل الح"
author = "منتهى"
posted = "2008-06-21"
text = "اللواء مبارك عايش فى قصر القبة بأى حق<br />الذى قام بالثورة وطرد الملك من قصر القبة اللى هو البكباشى جمال ظل فى بيتة فى منشية البكرى ولم يفكر ان يعيش فى قصر او فيلا او بيت كبير<br />والذى تلاة فى الحكم النقيب اشارة انور السادات بعد تولية الحكم جلس فى بيتة فى الجيزة ولم يفكر ان يسكن قصرا من القصور الملكية رغم انة صاحب الحرب والسلام<br />اما اللواء حسنى فمن السكن فى كفر مصيلحة بالمنوفية الى القصر الملكى مباشرة وعلى سرير الملك فؤاد والملك فاروق<br />ماهذة الابهة<br />هل الشعب الذى تسول مليون طن قمح من دولة الامارات ويقف شعبة بعد الاصلاحات الاقتصادية الكلامية اقتصاد الحرامية يقف فى طوابير الخبز<br />مصر لم يحدث لها فى التاريخ القديم ولا الحديث ان وقفت فى طوابير الخبز<br />كنا نقف فى طوابير الفراخ - نعم - اما الخبز فلم يحدث ابدا<br />والان وبعد الزيادات فى الوقود والبنزين وفرض الضرائب على الناس واخذ الضريبة العقارية على الشقق والبيوت وكل عشة فى البلد - علشان ندفع المرتبات ونجيب تموين لقوات الامن المركزى - وهتعدى السنة دى<br />السنة الجاية هنعمل اية<br />هنجيب موارد للخزينة من اين ؟<br />الناس خلاص معندهاش تدفع<br />الدولة خفضت ميزانية التعليم والصحة والثقافة والزراعة وزودت ميزانية الداخلية وفية عجز<br />السنة الجاية اية الموقف<br />الانهيار<br />الانهيار"
