subject = "فليحيا الرئيس حسني مبارك"
author = "أحمد عبدالله"
posted = "2008-07-17"
text = "لماذا نحن هكذا !! وبالمثل الشعبي : مش عاجبكم العجب ولا الصيام في رجب.<br />هل قمتم فعلا بمقارنة رؤساء الدول العربية باستثناء دول الخليج حيث أنهم في واد اخر<br />ان أفضل قائد هو حسني مبارك رجل سياسه واقتصاد ونحن فعلا أصبحنا ننكر الجميل.<br />الكل يشكو ويبكي حاله ما نريد وما نطلب نريد كل شيء الطمع أعمى قلوبنا أصبحنا مضحكه ونكته نعم جبنا لنفسنا الهم<br />بدلا عن النظر والفلسفه الفارغه واستفتاء اراء المهمشين ومن ليس لهم رأي في موضع الرئاسه لننظر لأعمالنا ولقمة العيش<br />مثل هذه المواضيع تدل على تخلفنا وفراغ انيتنا.<br />يجب أن نتناقش في مواضيع زيادة الدخلوالسماح بمزاولة الانشطة التجارية لكافة الفئات وأيضا تطبيق النظام الخليجي في التجارة من حيث فتح باب الاستثمارات لاي نشاط تجاري للاجانب شريطة أن يكون الشريك مصري الجنسية وتسهيل حركة الاستيراد والتصدير .<br />الخوف أن يأتي اليوم ويقول شعب مصر لماذا نعبد الله!!!!"
