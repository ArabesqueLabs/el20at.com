subject = "حسني مبارك ومن وراءه الطوفان"
author = "مش عميل للموساد"
posted = "2008-06-04"
text = "حتعملوا اذاعة 6 ابريل حتعملوا اضراب حترقصوا عشرة بلدي في ميدان التحرير<br />المنطقة هنا دخلت في الحيازة الامريكية ونخص بالذكر العراق وسوريا ومصر لاجراءات حل مشكلة امن اسرائيل حلا جذريا من وجهة نظرهم<br />فحسني مبارك (رغم كل مساوئه) من ورائه الطوفان في حالة نزع السلطة منه<br />طوفان حيغرق مصر كلها زي ما غرقت العراق<br />وبعدين ما تتهموش الناس بالعمالة كده جزافا فيه حاجه اسمها خبرة فيه تجربه فيه فراسة<br />الوقت غير الوقت يا حبيبي انت وهو امريكا خنقه المنطقة كلها"
