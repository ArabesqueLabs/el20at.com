subject = "خيبة 6 ابريل"
author = "مش بحبك"
posted = "2008-06-03"
text = "فيه ناس فاشلة وبتدور على فكره تخرجها من مشكلتها وتنقلها الى عالم المجد والشهرة<br />زي اخينا اللي في الصورة دا تحين الفرصة وما لقاش غير هذه الفكره ليحل بها مشكلته انه يستثمر الاضراب اللي حصل لصالحه فعمل راديو 6 ابريل<br />يا فرحتي راديو التغيير ومش عارف ايه<br />لا وايه البيه دكتور<br />اكيد دكتور فاشل ومش لاقي حاجه يعملها ويا ترى دكتور في ايه ان شاء الله... اكيد في الخيبه<br />قال دكتور قال<br />والنبي يا ست مروى صلاح ابقي اعملي معاه تحقيق عن موضوع الدكتوراه اللي واخدها وواخدها في ايه بالضبط ويا حبذا لو اعطاكي صورة منها علشان خاطر نتأكد انه دكتور<br />اللي يفكر في فكرة زي دي واحد صايع مش لاقي شغل خالص خالص خالص<br />وكفاية بقى زعزعه في امن واستقرار البلد<br />كله على دماغ الشعب لان الانفاق على الفرق الامنية من قوت الشعب من رغيف الخبز يا شوية .............."
archived = "2010-03-14"
