[[comments]]
order = 7
subject = "نحترم الرأى الاخر وكل واحد حر فى رأية وقناعتة السي"
author = "من دشنا"
posted = "2008-06-04"
text = "فية ناس بتأيد حسنى - دة من حقها<br />فية ناس ضد حسنى - برضة من حقها<br />فية ناس بتحب مصر وخايفة عليها - ودول نشجعهم<br />وفية ناس عملاء وبتبيع البلد لامريكا واسرائيل - وهؤلاء يجب القضاء عليهم<br />فية ناس لها مصلحة فى خراب البلد واعطائها لقمة سائغة لاسرائيل<br />وفية ناس بتحب اسرائيل اكتر من المصريين<br />وتبقى مصر<br />تتسرق شوية - تتنهب شوية - تنضرب على قفاها شوية - انما فى الاخر بتدوس على رقبة التخين المفترى بالجزمة<br />مصر كبيرة جدا<br />وفيها رجالة عظماء<br />بيظهروا لما تقع مصر<br />بييجوا من الكفور والنجوع شباب رجال وكل واحد يشيل بكتفة ويرفع كبوة البلد<br />عظيمة يامصر"
archived = "2010-03-14"
capture_url = ""
