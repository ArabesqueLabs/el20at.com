subject = "مغلوبين مغلوبين لسة عاوزين تفضحوا مصر كمان و كمان"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-04"
text = "مفيش فايدة؟<br />الظاهر التبلد و التناحة اصبحو من صفات مدعى و مسترزقى الرياضة فى مصر<br />احترموا بلدكم و احترموا كرامتها ايها الحثالة و اللصوص<br />الهزيمة النكراء فى الانتظار!!!<br />بلاش سفر و بلاش فضائح كمان و كمان<br />فضحتونا فضحتونا فضحتونا(مع الاعتذار للفنانة وردة الجزائرية عن اغنية(و حشتونا)"
