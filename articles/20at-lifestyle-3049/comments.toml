text = "السلام عليكم ياشباب بصو احنا مش هنهاجم الكاتب لهذا الموضوع فعلا الحب احسن شئ في الوجود وجميل ان نهادي بعض بس فعلا مش لازم في نفس اليوم ده عشان منبقاش متشبهين بلكفار دي ليه احنا بنحب كل حاجه بيعملوها الكفار ليه منتمسكش بمبدئنا احنا يعني نشوف الحاجه الي نحس انها كويسه ونعملها مش لازم ده يقولك عيب وحرام انت اسال نفسك وبعدين احنا بجد محتاجين وقفه مع النفس شويه اننا نتراجع عن اي خطئ بنعمله لازم نكون متفهمين كتاب ربنا وسنه رسوله محمد صلي الله عليه السلام يعني عرفنا ان الحاجه دي غلط منعملهاش ونكسب الثواب من حاجه صغيره اوي ونطيع ربنا ورسوله بلحجات البسيطه دي ومع انها متجيش اي حاجه من الي ربنا سبحانه وتعاله بيقدمهولنا ))))اسال الله بلهدايه لكل مسلم ومسلمه وان يرزق كل منكم بلصواب دئما ويرزققم بلخير دئما."
