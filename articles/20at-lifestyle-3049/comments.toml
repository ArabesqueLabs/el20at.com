subject = "أحقاً أم زوراً وبهتانا........."
author = "أبو ثـائر"
posted = "2007-01-20"
text = "هل حقا ما أقرأ ام أنه اختبار,حتى ولو كان اختبار هل تعلمون عدد الشباب والفتيات الذين سيقعون فيه .<br />ويا لها من زحطة سوف يكسرون رقبتهم فيها أن يطلعوكم على قصصهم ومغامراتهم.<br />ترى إسلامنا يشجع إلى هذا الشيء لا والله ......ما أنزل الله بهذا من سلطان وهو سبحانه الذي علّمنا أن نسرّ الخطبة ونعلن النكاح.فكيف بك بنشر ما هو محرّم أصلاً.نحن لا نقول الحب في الاسلام حرام ولكن له ضوابطه الشرعية وأصوله وليس من أصوله المحادثات الخفية والوعود والأكاذيب بل تحت ضابط الخطبة وعفّ النفس بالزواج.<br />هذا هو الحب الحقيقي الأصيا أصلا المودة والعشرة الحسنة والرفق بمن هم أهلك هذا حب أبدي لا يحصر بيوم واحد في العام ليعم فيه الفسق والفجور.<br />توبوا إلى الله توبة نصوحا صادقة واستغفروه على ما بدا منكم من خطأ تجدوه غفارا.<br />وإني لكم من الناصحين استبدلوا دنياكم بأخراكم والحب الحرام التافه بالزواج والعفة......وكونوا أولياء الله الصادقين عسى أن يغفر لكم ذنوبكم ويعينكم على تقواه......<br />الله إني بلّغت اللهم فاشهد........."
