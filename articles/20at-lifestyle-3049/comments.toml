text = "نصحا للأمة وأداء لواجب الأمر بالمعروف والنهي عن المنكر<br />كان حري بكم أن تقوموا في هذه الأوقات بالذات بتعريف شباب المسلمين بقصة الحب وعيده ودعوتهم للكف عن تقليد الغرب خاصة بهذه \"الأعياد\" فلابد من تحصين الأبناء وتوعيتهم وبيان ضرورة تميزهم بدينهم ومحافظتهم على العقيدة... وتذكيرهم بمخاطر التشبه بالكفار<br />عار علينا وعليكم كمسلمين إدراج مواضيع كهذه وأن توجهوها لفئة تعيش مرحلة خطرة... تذكروا كيفية سقوط الأندلس وتذكروا قوله تعالى (وما كان ربك ليهلك القرى بظلم وأهلها مصلحون) تذكروا أيضا أنكم ستلاقون الله..<br />أسأل الله تعالى أن يحفظ المسلمين من مضلات الفتن، وأن يقيهم شرور أنفسهم ومكر أعدائهم إنه سميع مجيب"
