text = "بعد مالناس التقية اللى فوق شتمت فيكو لانهم كلهم بقو ملايكة فانا قررت اكون مع الشياطين معاكو<br />انا بقى قصة حبى ابتديت ازاى يوم 6/4/2006 كان يوم خميس وكنت رايحة الشغل متاخرة 9.3 ووانا داخلة لقيت لية قمر كدة وواية حاجة كدة طول بعرض ببدلة جى لاروش بنت لذينا ببرفان جامد اووى وبعدين دوست على الاسانسير بصلى كدة يعنى منا اهو اكيد هو دايس يعنى المهم الاسانسير جة استنيتة يفتح الباب يعنى اتيكيت وكدة برضة الواد مطنش طب خلاص خليك فتحت انا وقفلت الباب ورايا وعلقت الاسانسير يعنى لا يطلع ولا ينزل المهم صعب عليا فتحت بقى دخل وبصلى كدة بقرف وانا مطنشة برضة دوست على الدور داس هو على دور تبع الشركة اللى بشتغل فيها افتكرتة مهندس جديد قولت طب وحياتك لاطين عيشتك المهم بقى بعدها بشوية هل القمر كدة لا قيتة هو بقى انا مهندس ....... من ال iT يعنى مهندس كمبيوتر طنشتة برضة جة جنبى قالى ممكن اشوف الجهاز بعد اذنك قولتلة لاء سورى قالى نعم انا كان اول مرة حد اصلا يزعق فيا فى حياتى قولتلة يعنى اتفضل بعد ماتنحت كدة مش عارفة ازاى ولية وهو كمان برضة تنح تتنيحة عسل كدة فضل قاعد قاعد كدة وبعدين بصلى وقالى هو مش انتى اللى كنت معايا فى الاسانسير قولتلة اسانسير اية امتى قالى النهاردة الصبح قولتلة مش فاكرة قالى لاء انتى وماتعمليش كدة تانى قولتلة وانت مش المفروض تفتحلى الباب قالى وانا افتحوهولك لية قولتلة وانا امسيكلك الباب لية برضة المهم قاعد يناقر فيا واناقر فية لحد ماقلى انتى زعلتى حئك عليا وادانى بنبونى -- عايزة اقولكو ان الناس فى المكتب فعلا كانو بيتفرجو علينا فعلا --- المهم دخل عند المدير المدير قالة ماتتجوز البت اللى برة قالة دى شكلها مجنونة قالة شوية بس طيبة قالة لاء برضة دى مجنونة وتنكة اووووووووى قالة بس بنت ناس تعال اصالحكو على بعض صالحنا واتبديلنا الاميلات واتكلمنا شوية على النت واتقبلنا مرة واتخطبنا<br />بجد هو احلى صدفة فى حياتى<br />هو مش احلى حاجة فى الدنيا هو احلى الدنيا<br />هو مجنون وعصبى اووووووووووووووووووووووووووووووووووووووووووووى علشان ابن 7 بس طيب اوووووووووووووووووى<br />هو برج السرطان<br />قائد<br />مودى<br />عصبى<br />بيتوتى<br />غيور<br />شكاك شوية<br />بس ماحبتش حد غيرة<br />راجل بيتقى ربنا فيا فعلا<br />عيد الحب اللى فات عملت نفسى ناسية<br />بس بعتيلة هديتة ب DHL كانت