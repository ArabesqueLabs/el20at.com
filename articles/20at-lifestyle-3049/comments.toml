[[comments]]
order = 22
subject = "8اش محمود فهمي المعماري      الظاهر        القاهره"
author = "عمار عز الدين"
posted = "2007-11-22"
text = "كيف سأروي لكم عن قصتي؟؟؟ و هي قصة قدرها أن تكتب بدمع العين بل و دم الوريد؟؟؟ هي قصة صاغ الأنين حروفها بمداده السامي و بالالام!!! قصتي هي قصة أمة!!! أمة حكمت العالم مئات السنين بنت صرحا وأي صرح هو أسمى من صرح قام على كتاب الله و سنة النبي محمد, أمة من رجالها أسامة بن زيد و القعقاع و المثنى, إنما لم يصنها أحفادها و لم يحفظوا الأمانة. أمة لم يعد يهمها سوى التقيد بالغرب الكافر و كأنهم لم يسمعوا بسيد البشر يقول من تشبه بقوم حشر معهم! كيف يحلو لكم أن تقومو بهذا الموقع ذات المبادئ الهدامة و بث السم بين أوساط الأمة و إثارة الفتن و الشهوات؟؟؟<br />إعلم بأن الغراميات و الشهوات هي أمور الإسلام منها براء ما دامت خارج النطاق الشرعي. و اعلم يا هذا بأن المصاب شديد و الخطب جلل و ما تقوم به لا يزيد النار إلا اشتعالا و لا يزيد البيت إلا خرابا. أسالكم الله أن ترفقوا بهذه الأمة و الله يكفيها ما يكفيها ما نزل بها من بلاء. إتقوا الله !!! ماذا سيكون موقفك أمام الله أم حين يأتيك ملك الموت؟؟؟<br />يجب تغيير فكرة هذا الموقع الهدامة سريعا و إبدالها بما يرضي الله و ما فيه الخير. أسأل الله أن يهدينا جميعا."
archived = "2010-03-14"
