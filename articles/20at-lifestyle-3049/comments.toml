subject = "شكرا على هذا المفوضح؟؟؟؟؟؟؟؟"
author = "nawwar"
posted = "2007-01-20"
text = "السلام عليكم ورحمة الله وبركاته..<br />لا أدري لماذا يهاجم البعض هذا الموقع الجميل الذي يتعهد لنا بنشر الفضائح وترويج الحب سواء كان ماجنا أو محرما أو مخربا....يعني إذا كان الكل مثلكم يا مهاجمين لديهم الفضيلة وتطبيق تعاليم الدين الحنيف ونصرة المسلمين.ألا تتركوا للبعض يعبر عن آرائه الفاضحة والهاتكة للستر والأسرار... صحيح انكم أمة تتحلون بالفضيلة (والله اللي اختشوا ماتوا)...<br />ما المشكلة اذا احتفل البعض بعيد الحب؟وبعدها بعيد صلب المسيح؟وبعدها يدخل الكنيسة ويصلب ويخربش شوية على وجهه برماد الصلبان........يعني اتركوهم لكفرهم وما يعدّون له...........<br />لكم إسلامكم ولهم كفرهم وتنطّعهم.........وشكرا لأنكم أيقظتم إسلامنا وجعلتمونا نذكر الله..........<br />حقيقة أسأل الله الهداية لأصحاب هذا الموقع,وأن يخرب على العلمانيين المتنطّعين دنياهم..........<br />ذكرتموني بالنكتة.........امرأة كلما تزوجت رجلا وعطس ابنها مات زوجها ,في آخر مرة تزوجت عطس ابنها فمات جارهم؟؟؟؟؟؟؟؟؟<br />هذا ما يشجع إليه هذا الموقع وأمثاله؟؟؟؟؟؟؟<br />والسلام على من اتّبع الهدى...."
