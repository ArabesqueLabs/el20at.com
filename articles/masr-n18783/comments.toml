[[comments]]
order = 1
subject = "خرج ولم يعد"
author = "باع"
posted = "2008-12-14"
text = "هو موضوع توزيع الاسهم والصكوك وصل لفين ؟<br />يعنى الموضوع فجاة جالة سكتة قلبية ومحدش بينكلم علية من المسئولين لية<br />والا الزفة بتاع الوطنى السنوية خلاص خلصت - وزى موضوع الدعم النقدى قبل كدة - وفين كلام فرقع لوز<br />انا عايز حقى علشان اشترى موبايل نوكيا ان 70 بكاميرا"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103110/http://masr.20at.com:80/newArticle.php?sid=18783"

[[comments]]
order = 2
subject = "مدون حبس او اختطف علشان غزة ومحدش يعرف مكانة"
author = "لية"
posted = "2008-12-14"
text = "تصدقوا باللة<br />لما با اشوف غزة فى التليفزيون وهى تحت الحصار والعربيات ماشية فيها واشوف حالة المستشفيات والاجهزة المتوقفة فيها علشان مفيش كهرباء - اتحسر على حالنا فى مصر<br />فين الاجهزة اللى زيها فى مستشفياتنا وفين شوارع غزة النظيفة من شوارعنا اللى مليانة زبالة ومواسير مجارى منفجرة<br />حال غزة تحت الحصار احسن الف مرة من حال مصر<br />دا احنا اللى عايزين معونات وعايزين مساعدات<br />دا حالنا بقى زى الصومال<br />يقوم السيد المدون عايز يخترق الحدود ويروح الى غزة<br />اهم بتوع مباحث امن الفقر قبضوا علية وحطوة وراء الشمس<br />مدونون ال<br />انتم ها تحاربوا الموساد فى مصر بالكلام - مفيش فايدة<br />اتلم يا مدون انت وهو واسكتوا خالص لغاية ما تخرب ونقعد على تلها<br />على فكرة رغم الحصار على غزة من مصر واسرائيل - غزة مفيش فيها طوابير عيش"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103110/http://masr.20at.com:80/newArticle.php?sid=18783"
