posted = "2008-05-28"
text = "ألا دونا ياجدعان .. حد عايز مؤتمر.. حد عايز دافوس ياجدعان .. حد عايز يشرمنا في الشرم ياجدعان.. 34مليون جنيه تكاليف للمؤتمر الواحد يابلاش.. علشان الناس تنبسط وتهيص ياجدعان.. أوعى ياجدع ..وسع واسمع وطرطق دماغك.. جرجس المنجوس هايقولك ويشرحلك الهنا اللي نعيشه من المؤتمر ياجدعان.. قول ياجرجس متعنا.. دا كلامك حلو وشبعنا..<br />ياحلاوة ع المؤتمرات ياولاد.. قال وإيه.. مصر بقى اللي هي مصر .. النبيهة الذكية الواعية الفاهمة .. هي اللي نبهت العالم الغافل لأخطر قضية حب في دنيا الهوى .. والعالم كله اتكلم عن نباهتها وشطارتها .. والمؤتمر الجاي برضه في مصر بتلاتين أربعين مليون كمان علشان العالم يرمي علينا خيار الاستثمار ..وإديله استثمار .. ياسلام ع الخير اللي هايغرقك يامصر ..<br />نفسي بقى يكون شعار المؤتمر اللي جاي ..روًح ياعازر- أمك اصطلحت"
archived = "2009-03-06"
capture_url = "https://web.archive.org/web/20090306173439/http://ana.20at.com:80/20at/masr/t7atuf/9298-16001.html"

