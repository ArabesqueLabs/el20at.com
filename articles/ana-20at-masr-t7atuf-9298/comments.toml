text = "اللي بيرتكب الجرائم دي اكبر واغنى دولة في العالم مين حيحاسبها ولا حيحاسبهم<br />وبعدين ايش انت تساوي عندهم<br />نحن ناس لا قيمة لنا في نظرهم ولا نستحق الحياة<br />والعودة الى كتاب الله وسنة رسول الله صلى الله عليه وسلم هي الحل السريع"
