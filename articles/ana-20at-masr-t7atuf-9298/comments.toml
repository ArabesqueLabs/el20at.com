posted = "2008-05-26"
text = "انا مش شايف ان فية اى مشكلة ان شعب يحول منتجات ارضة الزراعية الى وقود<br />كل شعب مسئول عن تجهيز طعامة وانتاجة وليس تسولة<br />مصر مثلا تصنع من روث البهايم وقود قوى جدا اللى هو الجلة ومحدش اعترض<br />دى ثروتنا الوطنية واختراعنا المصرى وعما قريب سيطور مهندسينا القطارات والسيارات لتمشى بوقود الجلة ولا داعى لبنزين الحكومة الغالى<br />مصر بقى لها 26 سنة على لسان رئيسها عايزة العالم يعقد مؤتمر للارهاب ومحدش عبرها<br />مصر بقالها سنتين بتبوس ايدين اسرائيل تعمل تهدئة مع الفلسطنيين ومحدش عبرها<br />مين اللى هيعبر الواد خ0يشة الكداب يا ابن عازر روح اتغطى ونام — كل كلامك مفتعل وكداب"
archived = "2009-03-06"
capture_url = "https://web.archive.org/web/20090306173439/http://ana.20at.com:80/20at/masr/t7atuf/9298-16001.html"

