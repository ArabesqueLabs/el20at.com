[[comments]]
order = 6
subject = "قاطعوا"
author = "سعودى أصيل"
posted = "2008-08-09"
text = "تقرأون موضوعات إمرأة بدلا من قراءة كتب الدين و الإستفادة من كتب العلماء ؟؟<br />و الله ستحاسبون يوم القيامة على قراءتكم لمواضيع إمرأة و صاحب هذا الموقع سيحاسب أيضا بشدة يوم الدين لسماحه لإمرأة بالعمل فى هذه الشركة<br />قاااااااااطعوا عمل المرأة فالمرأة مكانها البيت منعا للإختلاط و منعا لحدوث ما لا يحمد عقباه فحتى تلك الكتابات ممكن أن تثير خيال أحد الرجال ليتخيل شكل هذه المرأة التى تكتب الموضوع<br />قاطعوا عمل المرأة و كل ما ينتج عن عمل المرأة<br />(( و تعاونوا على البر و التقوى ))"
archived = "2010-03-14"
capture_url = ""
