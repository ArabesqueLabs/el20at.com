[[comments]]
order = 1
subject = "اللهم ارزقنا الشهادة"
author = "عادل عودة"
posted = "2008-02-02"
text = "في كل مرة تفاجأنا أستاذنا الاستاذ علاء بإبداع جديد, يظهر مدى قوة القل إذا كتبت به اليد الصحيحة.<br />,., اقتبس من كلام حفيدة الشهيد القسام جمعنا الله معه في أعلى عليين,.,<br />\"\" المقاومة هي باستمرار توجهنا بأدواتها، وتوجهنا بصبرها وبصواريخها وبالشهداء والمجاهدين الذين يعبّدون طريق المقاومة وطريق التحرر بإذن الله، وبكل خجل أقول للمقاومة أن صابروا واصبروا، ومن يصبر سيكون منصوراً بإذن الله.<br />و يا شباب أمتنا, و الله الطريق ليس طريق التقليد الأعمى للغرب,,, لكنه طريق هؤلاء الشبان الذين يحملون أرواحهم على أكفة أيديهم ليهبوها رخيصة لخالقهم.<br />مرة أخرى بوركت أستاذنا."
archived = "2010-03-14"
