[[comments]]
order = 0
subject = "\"أصول الوصول\" إلى الله"
author = "محمود"
posted = "2008-01-29"
text = "إذا أردت أن تعرف سبل وطرق الوصول إلى الله فشاهد اليوم الأربعاء على قناة الناس حلقة من ضمن حلقات سلسلة \"أصول الوصول\" للشيخ \"محمد حسين يعقوب\".<br />وإذا أردت التعرف على أخطاء الصيادلة من خلال قيامهم بإعطاء أدوية بدون وصف الطبيب، والمخاطر التي تنجم عن إعطاء دواء عن طريق الخطًا تابع اليوم أيضا برنامج \"المحكمة\"<br />الذي يقدمه د. عاطف عبد الرشيد ويستضيف في الحلقة د. \"جمال المراكبي\" داعية إسلامي، ود. \"محمود عبدالمقصود\" ـ الأمين العام لنقابة الصيادلة، وا. \"حمدي خليفة\" نقيب المحامين بالجيزة"
archived = "2010-03-14"
