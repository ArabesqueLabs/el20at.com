subject = "ياليت قومى يعلمون"
author = "الدميرى"
posted = "2008-02-13"
text = "رحم الله زمنا كانت العزة فيه للاسلام يوم صعد عمر معلنااسلامه قائلا بعلو صوته(من اراد ان ييتم اولاده او ترمل امراته اويرى فى نفسه الشجاعه فليصعد لى)وما جرا شخص ان يفتح رغم الشجاعه والقوه التى يتمتع بها العرب وقتها......<br />فمن كعمر التى وصلت الفتوحات فى عصره الى حدانه حكم اكثر من نصف الكره الارضيه<br />انه الذى جلدابنه لانه شرب الخمر ومات ولده وهو يجلده ولا زال يجلده وهو يقول(لئن يعذب فى الدنيا خير من ان يعذب فى الاخره) اه.....اه.....ه...."
archived = "2010-03-14"
