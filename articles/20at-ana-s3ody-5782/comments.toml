[[comments]]
order = 2
subject = "مهرجانات منزليه"
author = "لينا عبود"
posted = "2007-05-09"
text = "والله لا تعليق سوى أن الله جميل يحب الجمال ...<br />وأن الملائكة تنفر مما ينفر منه الانسان<br />ماالمشكله ان نعرف بيئتنا الصحراويه على الزهور وان ونغير القليل من القلق والتوتر الساكن في النفوس ببعض من جمال الزهور ورائحتها<br />بصراحه لم اسمع الفتوى ولم اقرأ نصها ولكن بناءا عما تناقل بين الجميع استغرب كيف ان هكذا مهرجان يندرج تحت بند ( غير جائز شرعا)<br />والآن بما ان مهاداة المرضى بالورد لا تجوز ، والمهرجانات لا تجوز ، فهل يجوز ان نزرعها في بيوتنا ؟<br />اذا كان هذا الامر مازال جائزا ،، خلاص المشكله انحلت كل واحد يسويله مهرجان زهور امام بيته<br />لله في خلقه شؤن"
archived = "2010-03-14"
capture_url = ""

