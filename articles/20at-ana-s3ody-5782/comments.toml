subject = "لما الكذب !!!"
author = "ابو عبدالعزيز"
posted = "2007-05-08"
text = "أستغرب من الكاتب كيف يتجرأ على الكذب الصريح والفج بهذه الطريقة .. ولماذا لا يذكر الحقيقة في هذا الفتوى وسبب صدروها ولماذا يزور على القراء !!!<br />ولمن يبحث عن الحقيقة بعيدا عن كذب الكاتب فعليه أن يراجع الفتوى التي صدرت من هيئة كبار العلماء في بلاد الحرمين وبعدها له أن يحكم بعيدا عن التدليس ومغالطة الحقائق ..<br />أبو عبدالعزيز<br />الرياض .."
