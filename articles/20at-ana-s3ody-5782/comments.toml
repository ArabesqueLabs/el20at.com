[[comments]]
order = 4
subject = "بالله ركزوا وانتم تقراون"
author = "احمد"
posted = "2007-05-19"
text = "يا جماعة كفو عن المغالطات<br />العلماء لم يحرموا الزهور وانما حرموا الاحتفال بما يسمى عيد الزهور الذي يقابل عيد شم النسيم في مصر وعيد النيروز في ايران وهي كلها اعياد وثنية فعلا وجاهلية<br />اكرر العلماء لم يحرموا الزهور وانما حرموا اتخاذ احد الايام عيدا للزهور<br />زي مثلا تحريم عيد الميلاد يبقى ده معناه تحريم التوالد سبحان الله !!!!!!!!!!!!!<br />وبعدين اللي بيقول قتلوا الفرحة والبهجة ومش عارف ايه<br />عايز اقله لا بارك الله في بهجة وفرحة لا ترضي الله ورسوله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-05-29"
text = "يا ناس أتقوا الله ..<br />لا تذبوا في أعراض العلماء .. لا تفروا فيهم ..<br />العلماء أفهم مني ومنك أعلم مني ومنك مايصدر الشي إلا بعد تتدقيق وتأني ودراسة .. ليه نتكلم عليهم ونقول كذا وكذا ..<br />شوفوا الأسباب إقرأوا الفتوى أعيدو النظر فيها ..<br />الذي أصدر الفتوى ليه عالم واحد إنما عدة علماء ..<br />حكموا عقولكم ولتكونوا من اهل الإنصاف والتمعن .. ولا تتخبطوا وتتكلموا من غير علم ..<br />شهادة سادس أو ثانوي ويمكن جامعي .. ويتكلم على علمائنا ..!!!! والله شي .."
archived = "2010-03-14"
capture_url = ""

