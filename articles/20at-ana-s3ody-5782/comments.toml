subject = "نعيش في مجتمع طالباني متخلف للأسف"
author = "saudi"
posted = "2007-05-09"
text = "قتلوا الفرحة فينا وقتلوا كل شيء مبهج في الحياة لابارك الله فيمن ولاهم .. كل شي جميل في حياتنا اصبح حرام كأنه نزل عليهم قرآن ودين آخر غير مايدين به المسلمون .. الانسان اصبح عايش في جحيم من هالفتاوى الطالبانية .<br />والفتوى صحيحة .. اصبحوا حتى يحاربون الورود أجمل وكل مايدخل البهجة على الناس .."
