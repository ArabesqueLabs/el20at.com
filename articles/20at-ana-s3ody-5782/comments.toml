[[comments]]
order = 7
subject = "أين أنتم من فهم دينكم"
author = "من الجزائر"
posted = "2008-07-22"
text = "لماذا كل هذا التدليس و الإفتراء و التعدي على علمائنا الفضلاء حفضهم الله و رعاهم و رحم الله الأموات منهم<br />ليكن في علمكم أن علم الله نور و لا يأتى نور الله عاصي و قال رسول الله صلى الله عليه و سلم من يرد الله به خيرا يفقهه في الدين .<br />لم و لن تفهوا دينكم مادمتم تأخذونه من السفهاء أعداء الدين و السنة هؤلاء لا هم لهم سوى إتباع أهوائهم و الإنقياد إلى الشيطان و توحيد مايسمونه بتوحيد الأديان و الإحتفال بكل مهو في الدنيا حتى الطماطم و ضعو لها عيد و كل شئ و ليس هذا إلا من السفه و قلة العقل.<br />أما من يقول أن فضيلة علمائنا الكرام حرموا الورد فله اللعنة من الله لكذبه على من هو أفضل و أعلى منه عند الله بطاعته و عبادته و حبه و علمه لله عودو إلى رشدكم و أفيقو من هذه الغيبوبة أنعشو أنفسكم بعطر التوبة و خذو دينكم على من هو تقة ليس كل سفيه يحمل شهادة و يدعي التدين يعني خلاص عالم و له أن يتصدر للفتوى ألس يقول المثل أعط القوس باريها لا تضلوموا أنفسكم و عودو إلى رشدكم بارك الله فيكم و كفو عن محاربة دينكم إنكم لا تجنو من الشوك عنبا و العكس و أخيرا أقول أحب علمائكم و فهموا الفتوى سوف لن تضلوا أبدا بإدن الله لا تكونو كمن جمع بين خصلتين رديأتين سوء فهم و تعدي على عالم أحشف و سوء كيلة لن تضلوا أبدا إذ أنتم فهمتم دينكم بفهم الكتاب و السنة."
archived = "2010-03-14"
capture_url = ""
