subject = "فار على الطيارة السعودية المتجهة الى الرياض"
text = "قرأوا تعليقات الأخوة المصريين ..<br />ومحتوي الخبر الطريف يقول:<br />القاهرة - هذا الفأر ليس مصرياً .. بهذه العبارة التي تحمل نفيا قاطعا، رفض اللواء عبدالفتاح بدران نائب رئيس شركة ميناء القاهرة الجوي، اتهامات شركة الخطوط الجوية السعودية بأن ميناء القاهرة الجوي هو الجهة المسؤولة عن الفأر الذي تم اكتشافه علي إحدي طائراتها الجامبو خلال رحلتها يوم الجمعة الماضي من القاهرة إلي جدة، والتي حملت رقم 302، موضحا أنه لا يمكن بأي حال من الأحوال أن يكون هذا الفأر مصرياً.<br />وقال بدران من الصعب، بل ومن المستحيل أن يستطيع أي فأر الصعود أو التسلل لأي طائرة موجودة علي كوبري التحميل بالمطار ) وهي المنطقة التي كانت تقف فيها الطائرة السعودية (، لأنها منطقة حركة الركاب، لذا فإن مطار القاهرة غير مسؤول عن هذا الفأر وعن الخسائر التي سببها للخطوط السعودية] حسبما ذكرت جريده المصري اليوم[ .<br />ومن جانبه، أكد الدكتور سامي البساطي، رئيس الجمعية المصرية لعلم الحيوان، أنه لتحديد الجهة المسؤولة عن الخسائر لابد من تحديد جنسية الفأر، وهذا يتم من خلال معرفة السلالة التي ينتمي إليها .<br />وقال البساطي: من المحتمل أن يكون الفأر سعوديا أو من أي دولة أخري، وقد يكون موجوداً علي الطائرة منذ 15 يوما دون أن يكتشفه أحد، ولمعرفة ذلك يمكن فحص الفأر من خلال المواصفات البيئية التي اكتسبها من البيئة التي يعيش فيها.<br />وكان فأر قد أثار الذعر علي رحلة الخطوط الجوية السعودية رقم 302قبل إقلاعها بربع ساعة، عندما صرخت راكبة بعد أن اكتشفت أن فأرا يسير علي جسد ابنها الذي يجلس بجوارها، الأمر الذي تسبب في وقف تشغيل الطائرة لأكثر من 24 ساعة، وإلغاء رحلتها وعودتها من علي ممر الإقلاع وعلي متنها 368 راكباً، وحدوث خسائر للشركة- التي اتهمت سلطات مطار القاهرة بالإهمال والتسبب في هذه الخسائر- بلغت نحو 3 ملايين جنيه لقيام الشركة باستدعاء طائرة أخري .<br />لكن الاظرف كانت تعليقات المصريين علي الخبر ومنها :<br />1- حتى الفيران عايزة تهاجر وتسيب البلد .<br />- الفار مصرى ابن مصرى ،بس زى حالة كتير من المصرين زهقوا من وضع البلد فكر يسافر يلقط رزقة فى السعودية، الله يعينة عندة اسرة وعياااااااااااال مش لاقى يأكلهم<br />2 - الفار ده جامد قوى .<br />3 - يا جماعه انا الى عرفتوا عن الفار ده انه ابوه سعودى وامه مصريه وبعدين الفار المصرى اخره يوم ميكون فار صايع قوى كبيره يطلع ماسوره مجارى ده لو قلبه ميت<br />4- اهم حاجة اوراق الفار سليمة ولا لا ؟<br />5 - مش يمكن الفار دة كان بيفكر يسافر على ايطاليا بس خاف ليموت والمفتى يقول علية مش شهيد فقال اركب طيارة احسن , و ا سافر على بلد عربى وربنا يفتحها فى وشى واسيب البلد دى , ويمكن ارجع بعد 50 سنة والاقى السيد الرئيس زى ما هوة اسلم علية وارجع على هناك تانى .<br />6 - يا بخت الفار دة والله العظيم انا بحسدة انه فكر يسافر السعودية , بس كان من الافضل بالنسبه للعملة انه يسافر الكويت او الامارات .<br />7- حتى الفئران عايزة تهاجر كتنا نيلة فى حظنا الهباب والنبى لو تعرف يا سيد فار تجبلى عقد عمل ابعت لى .<br />8 - مالهاش حل, انا رأيي يسيبوه لغاية ماتش مصر مع السعوديه.. ويقولوله يومها ان مصر كسبت ونشوف رد فعله.. لو فرح يبقي مصري.. ولو اتضايق يبقي برضه مصري بس نفسه حسن شحاته يمشي..."
