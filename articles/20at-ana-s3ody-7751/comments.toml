text = "مهما يكون في بلادي من مشاكل مهما يكون فيها من أخطاء أبفتخر فيها واعتز<br />إنت يالي تسأل كم دفعوا .. السفارة السعودية في بريطانيا ووزير الداخلية السعودي ووزير الخارجية ووزارة التربية والتعليم كلهم هبوا يسألوا ويتصلوا بالمواطن السعودي الي انضرب في بريطانيا .. لو أحد من بلدك صار له الي صار كان أحد عبره .. مجرد لفته بس عشان تعرف قدر حكومتنا بقلبنا ماجا من نفاق ومجاملة"
