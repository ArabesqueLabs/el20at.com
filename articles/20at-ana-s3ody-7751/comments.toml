subject = "شئ جميل"
author = "خالد الامير"
posted = "2007-12-19"
text = "ارتبطت كلمه المخابرات في عالمنا العربي بالفزع والرعب البفعل لانه من المفروض اقوي جهاز في البلدان ويعرف كل شئ ويحمي الوطن داخليا وخارجيا وافراد المخابرات لايعلمهم احد فخطوة تحسب للمملكه ولخادم الحرمين الشريفين وارجو ان تكون هذه البدايه من قبله المسلمين وان تتعلم الدول العربيه واحسب ان المخابرات السعوديه قد كشفت العديد من الخلايا الارهابيه بالسعوديه وبذك تكون قد ضربت عصفورين بحجر اكتسبت ثقه الناس وفي نفس الوقت تؤدي عملها المناط بها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "الباحه"
author = "سعيدابو محمد"
posted = "2008-02-05"
text = "لكل قطاع ايجابيات وسلبيات ولكن قطاع كقطاع الاستخبارات يجب عليه ان يختار عناصره بكل دقه وحذر فان لما هذا القطاع من سلطه تخوله الى ان يدور في كل فلك وبكل حريه فعليه مسؤليه كبره تجاه الوطن والمواطن فالعدل فيه مطلب ومخافة الله من اولى المطالب ونحسبهم كذلك انشاء الله وتحري الدقه والحذر في كل الامور ولست انا من يدلي بدلوه في هذا المجال المعقد ولكن اجتهادا مني في ذلك فاليوم دنيا وغدا اخره اعان الله الجميع قي خدمة الدين ثم المليك والوطن والمواطن"
archived = "2010-03-14"
