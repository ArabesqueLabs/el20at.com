[[comments]]
order = 0
subject = "والله بخير يا مصر"
author = "سما"
text = "جميل اوى المقال بجد وعجبنى اوى كلام اولاد الحاره عن مدى التالف الى كان بينهم وبين جارتهم اليهوديه<br />ودا بيدل على ان روح ولاد مصر بخير وهتفضل بخير لان مش معنى انها يهوديه او مسيحيه نقاطعها<br />لازم نكون فى علاقات كويسه بينا دينا بيقولنا كدا ولكم دينكم وليا دينى وميرسي ليك"
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107053333/http://masr.20at.com:80/newArticle.php?sid=12251"

[[comments]]
order = 1
subject = "المقال ظريف"
author = "السيد العجان"
text = "فية عظة انة لا يدوم غير وجة اللة وكل ما عليها فان<br />بس فية حاجة يا استاذ احمد<br />اننا شعب ساذج وبنحب بعفوية وبنحترم الجيرة حتى لو كانوا تعابين وعقارب سامة ولهم اهدافهم السرية وخططهم الجهنمية<br />المهم حارة اليهود اتقفلت وعقبال اللى بالى بالك ويغوروا كلهم يروحوا عند بتوع المهجر<br />ولا تنسى ابدا انهم كانوا بيرسموا الهدف ونجمة داوود على ابواب البيوت حتى يظل هدفهم امام اعينهم<br />عموما التحقيق بتاعك جميل<br />بس الجاليات دى زى احنا ما بنتعامل معاهم ياترى هم كانوا بيشتروا منا والا بيستغلونا بس<br />ولا دايم غير وجة اللة"
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107053333/http://masr.20at.com:80/newArticle.php?sid=12251"

[[comments]]
order = 2
subject = "نبذة عن قصة اليهود المصريين"
author = "محمد ابو العطا"
text = "هو بس محدش متخيل انه كان فيه يهود فى مصر.. الحركة الصهيونية نكدت على كل اليهود اللى مش صهاينه لان فيه يهود كتير فضلوا فى مصر لحد اخر الستينات ومقدروش يكملوا لان الجو كان مفزع ومكنش ينفع يكملوا عادى بس الحقيقة ان معظم اليهود المصريين هاجروا فرنسا والحقيقة المرة اللى مش حيصدقها حد ان عدد المصريين سواء مسلمين او مسيحيين اللى بيشتغلوا فى اسرائيل وواخدين فيزات عمل اكتر من اليهود المصريين اللى هناك بسبب الهجرة ويالا العجب .. على فكرة يهود مصر كانوا حوالى 90 الفى 70 الف منهم يهود مصريين اقحاح وكان الباقى مهاجرين من ايطاليا وفرنسا وكانوا فاتحيني بيزنس واغنيا وكان مركزهم اسكندرية"
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107053333/http://masr.20at.com:80/newArticle.php?sid=12251"

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
text = "مركز قوي انت علي ان أد ايه اليهود والمصريين كانوا متحابين وكل شوية تقعد تقول فقرة بتبين مدي الصلة الروحية والاجتماعية العميقة والتسامح بين الشعبين عشان في الآخر تقولي \"حيث انتقلت لتكون في قلب العالم العربي بسكان من مختلف جنسيات العالم، ولتحمل يافطتها اسم .. إسرائيل \" !!!!!<br />ياخي أحه !! أنت يا إما مريض يا إما عميل ..."
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107053333/http://masr.20at.com:80/newArticle.php?sid=12251"

[[comments]]
order = 4
subject = "لا مش معقولة يبقى فيه جهل وكراهية بالمستوى ده"
author = "محمد ابو العطا"
text = "يا بنى ادم ياللى مش كاتب اسمك ولا حاطط عنوان للتعليق مكنش فيه علاقة محبة بين اليهود والمصريين .. لان اليهود اللى بيتكلم عنهم كانوا مصريين فعلا انا عارف ان خيالك مش جايب ان ده كان موجود بس دول كان اسمهم يهود مصريين زى منتا مسلم مصرى .. والعبارة اللى انت قلت عليها اححححه فى الاخر وتسالت هو مريض ولا ميل احب اقولك لا انت اللى جاهل لان طرد اليهود المصريين فى حارة اليهود هو اللى اسس الدولة الشاذة اللى اسمها اسرائيل مش طبعا حارة اليهود فى مصر بس لكن فى يهود العراق والمغرب وبعدين نتسائل زى نسوان الفسحات طب نوقف الاستيطان ازاى .. طب منت واللى زيك بجهلهم اللى بعتوهم هناك"
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107053333/http://masr.20at.com:80/newArticle.php?sid=12251"
