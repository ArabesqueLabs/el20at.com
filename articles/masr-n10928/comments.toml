[[comments]]
order = 0
subject = "والله حرام"
author = "رامي"
text = "اللي بيتقال ده حرام.. يعني ايه -تقليد الداعية الإسلامي عمرو خالد في أحداث ومشاهد الفيلم لتحقيق ربح وزيادة توزيع للفيلم- ايه مصلحه سعد او المنتج في اثاره قضيه ذي دي .انا مش قصدي اني انفي الاتهام ..لا طبعا.. الناس تعتقد الي هي عايزاه لكن متسندش اتهامها علي ادله غير منطقيه ! يعني بالزمه<br />منطقي ان ده يكون مقصود بسبب الشهره ؟ محمد سعد مش محتاج يتشهر !<br />منطقي ان محمد سعد يقصد الاساءه للدين او للداعيه عمر ؟ وهيستفاد اييه!!<br />هل محمد سعد يسخر من الداعيه عمرو بتقليده في الدعاء؟ هل الدعاء يجلب السخريه!<br />في النهايه بقول ليه محدش قدر يتكلم بالطريقه دي علي الزعيم في سخرياته بجميع المواضيع مع العلم بانه يقصد السخريه فعلا ..من الدين والسياسه والناس وكل شئ ..وبكل جراه..لا تتهموا الناس بالباطل فامامكم امثله عديده امامكم تستحق هذه الاتهامات وهذه الوقفه الجاده.."
archived = "2007-08-18"
capture_url = "https://web.archive.org/web/20070818212419/http://masr.20at.com:80/newArticle.php?sid=10928"

