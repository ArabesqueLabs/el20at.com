author = "ماتا هارى"
text = "اول الكلام سلام كبييييييييييييييير اوى للفنان النجم الاسطوره الاكسبرس البلدوزر محمد سعد وعايزه اقول اننا كلنا عارفين مين ورا الاشاعات السخيفه على حبيب قلبنا كلنا محمد سعد وعارفين ليه بيعملوا كده اصل الغيره والحقد يعملوا اكتر من كده الله يكون بالعون يا محمد وينصرك عليهم ,, اما انا بقى فا كالعاده بدخل افالامك وانا بضحك مقدما من اول حجز التكت لحد ما الواد بتاع السينما يقعدنى فى مكانى وانا تلاقينى مبسوطه وبضحك فما بالك لما اشوف الفيلم وعموما محمد سعد جمهوره كبيييير جدا حتى الاطفال اللى عندهم سنه زى ابن زميلتى فالشغل بيضحك لما يشوف اعلان كركر وبيعط لما الاعلان يخلص وانا نفسى بمووووت فيك وكل زمايلى فالشغل عارفين كده وانى بحفظ سيناريو اى فيلم الاسطره بيقدمه وحلمى انى اشوفك ولو لدقيقه انت فنان كبيير ومليان طاقات لسه مدفونه ونفسى اشوفك فى اكشن كوميدى او تراجيدى لايت كوميدى انت نجم فى اى حاجه هتقدمها و محمد سعد انسان محترم ومتدين وكريم واصيل مع كل اللى بيشتغلوا معاه وشخصيه صبوره جدا فالنهايه حب اقول ل محمد ا اوعى تشغل بالك بالناس اللى بتتكلم عليك لان دى ضريبه الشهره والنجاح وحب الناس ليك وانا والله بدعيلك فى كل فيلم ان ربنا يكرمك وينجحك لان اولا فاتح بيوت ناس كتيير وثانيا لانك تستاهل النجاح واكتر من كده...... بحبك جدا وبحلم انى اقابلك ولو لدقيقه"
archived = "2007-08-18"
capture_url = "https://web.archive.org/web/20070818212419/http://masr.20at.com:80/newArticle.php?sid=10928"
