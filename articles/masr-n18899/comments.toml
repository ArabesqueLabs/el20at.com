subject = "الجمل والحمار وبينهما حمل وديع"
author = "مش قايل"
posted = "2008-12-22"
text = "الجمل حبسوة فى مخزن فخار - مطرح ما بيد رجلة بيكسر فى الفخار - جمل وغشيم<br />والتعليم فى مصر اصبح لعبة عيال - كل واحد بيعدل وكل واحد بيحط مناهج وكل واحد بيشيل من المقررات ويضيف للمقررات<br />انا كنت فى الهند من فترة<br />فى الهند المقررات التعليمية فى المدارس والجامعات زى بريطانيا تماما<br />ان بريطانيا غيرت فصل فى كتاب الهند تغيرة<br />مفيش وزير عندهم بتفلسف ولا بيقول لك كادر ولا دركسيون - اية الجهل اللى ماشى فى الوزراء دول<br />ازاى اختار موظف واعينة ثم بعد فترة من شغلة اشوفة يصلح للعملية التدريسية والا لا<br />المفروض انة اختبر وحدثت معة مقابلة قبل تعيينة<br />علشان التخبط والتسيب والانهيار العام - التعليم باظ<br />لية منعملش زى الهند ونطبق المقررات البريطانية فى كل المواد ما عدا اللغة العربية والدين<br />علشان كدة اطفالنا الصغار اللى مثل الحمل الوديع اتفعصوا بين الجمل والحمار"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223152240/http://masr.20at.com:80/newArticle.php?sid=18899"
