subject = "طب شوف حاجة تانية"
author = "ابو اسامة"
posted = "2008-05-05"
text = "يا اخى عاوز تنافق ولا بلاش اخى اصل انا مش منافق شوف حاجة تانية<br />يعنى تبقى منافق واهبل جاى فى الحاجة اللى ظاهرة زى عين السمسقصدى الشمس<br />وتقول عدالة اجتماعية طيب اسال اللى اشتروا البلد واحنا مش لاقيين خرم ابرة ده<br />الفقير ذاد فقر والغنى ذاد مليارات خلى فى عينك حصوة ملح .<br />جتكوا الآرف مليتوا البلد."
