[[comments]]
order = 1
subject = "واحد شاي في التمانين"
author = "قهوجي في غرزة مصر"
posted = "2008-05-04"
text = "وداعا لاصطلاح المزاجاتية والصنايعية والعمال والمثقفاتية اللي لما كانوا بيقعدوا في غرزة مصر وبينادوا \" هات لنا يابني واحد شاي في الخمسين أو في الخمسينه\" علشان يعدل الدماغ .. دلوقتي الشاي علشان يعدل الدماغ الخربانة ويجيب إصلاح ماركة أبوالحديد لا بد يكون في \"التمانين \" الشاي أبو الخمسينة راحت عليه ..أحنا بقى عايزين الزبد ..قولت لي لييييه . أقول لك.. لأن الحياه تبدأ في التمانين آه والنعمة الشريفة.. ولأن المواطن المصري باعتبار غن النيل رواه والخير جواه يعتبر بيرضع وبيعملها على روحه حتى سن الأربعين .. وبعد كدة يبدأ مرحلة الصبا ثم اليفوعة وشدالحيل والاعتماد على النفس في الخمسن والستين والسبعين.. وبعد كده يبدأ بقى الإصلاح الجامد أوي ويقبل على الحياة ويتحمل الأمانة في التمانين .. وفي التمانين بقى ياعزيزي تبدأ الحياة تضحك لنا بعد ما يخرطها خراط البنات وتبقى طالبة جواز بقرار جمهوري ..أو طالبة هتك عرض عند سينما روكسي ..أو طالبة علاوة تلاتين في المية عند عيشة بنت أبويا محمد عبدالهادي .. أو طالبة ربعميت عربية أمن مركزي يكسروا عضم اللي خلفوكوا .. علشان قاعدين صيع على غرزة مصر ولسة بتطلبوا واحد شاي في الخمسين .. واحنا عمالين نقول لأبوكم من الصبح إن الشاي أصبح في التمانين ومافيش فايدة فيكم .. قول يابو الحديد .."
archived = "2010-03-14"
