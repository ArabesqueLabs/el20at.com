text = "بكل امانه ولا ازكى على الله احد اشهدكم اننى احب لرئيس العظيم القائد الشهيد محمد انور السادات رحمه الله رحمة واسعه وياليت العرب والزعماء يتعلمون من هذا القائد العظيم الذى اثبت للعالم اجمع ان السادات هو فعلا بطل الحرب والسلام اللهم اغفر له وارحمه رحمة واسعه امين امين امين ياسر حسن<br />مواطن مصرى من عشاق انور السادات"
