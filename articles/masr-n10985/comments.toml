order = 0
subject = "استاذ منير ..الموضوع جميييييل"
author = "نيفين نيفى نوفا"
posted = "2007-07-10"
text = "استاذ منير فعلا شكرا على الموضوعة دخ اللى فكرنا بالرئيس الراحل انور السادات الذى احبه بقدر ما احترمه<br />و فعلا السيده رقيه السادات لاتقل سموا و ترفعا و ذكاءا عن والدها و عن السيدهجيهان السادات وده واضح ف كل مقابلاتهم الاعلاميه و يبدو ان ها عدوى ف عائله السادات<br />و ربما لا يخلو حديثى من التحيز و انا اعلم هذا و لا انكره كما انى لا انكر حبى الشديد للسادات<br />و طبعا انا و زيى كتير ف انتظار المذكرات"
archived = "2007-07-11"
capture_url = "https://web.archive.org/web/20070711120512/http://masr.20at.com:80/newArticle.php?sid=10985"

