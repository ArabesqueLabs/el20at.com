subject = "ده انتو بقى بقى عندكم ذهان رسمى"
author = "وامى انضمت للاخوان برضه"
posted = "2007-07-10"
text = "تانى السادات من الاخوان ومعاه ابو تريكه وعمرو دياب و واحمد زويل وقريبا شنودة التالت وده مش بعيد اذا كان بابا الفاتيكان اسلم قبل ما يموت .. استغفر الله العظيم فيكم ... لا امل .. اوفففف"
archived = "2007-07-11"
capture_url = "https://web.archive.org/web/20070711120512/http://masr.20at.com:80/newArticle.php?sid=10985"

[[comments]]
order = 2
subject = "خلينا في اقباط المهجر"
text = "خلينا في اقباط المهجر شوفو بيقولوا علينا ايه<br />أرسل هذا التعليق بواسطة : مش ضروري<br />ولكي نختصر الطريق نقول ان هناك كاتبة تدعي زينب عبد العزيز كتب في هذه الصحيفة بتاريخ 8 يوليو 2007 تحت عنوان (ويبقي الحوار الديني الامين هو السبيل للتعايش) كتبت هذه الكاتبة مقال لا نعرف اذا كان شتائم ام اكاذيب ام اوهام ام خرافات ام ازدراء بالديانة المسيحية ام ماذا المهم انه مقال موقع ادناه بلقب دكتورة زينب عبد العزيز وواضح انها من حملة الدكتوراة اياها بتاعة الازهر او بمعني ادق بتاعة رضاعة الكبار وشرب بول كل الحيوانات وايضآ بول الرسول ..... الخ ولم اجد ترابط في هذا المقال لكن للحق فأنه مقال اسلامي لايكتبه الا داعية اسلامية لما فيه من الاسس والقواعد التي تبيعها الكتاب والدعاة الاسلامية من كذب وتضليل وتهجم علي العقائد الصحيحة والتمجيد في العقيدة الكاذبة .... الخ<br />تتصوروا يا جماعة ناس مسيحيين عايشين في اكبر دولة اسلامية ما يقولوش عن الاسلام الا الكلام الفارغ دا<br />الاسلام اللي حكم نصف الكرة الارضية الف سنه"
archived = "2007-07-11"
capture_url = "https://web.archive.org/web/20070711120512/http://masr.20at.com:80/newArticle.php?sid=10985"

[[comments]]
order = 3
subject = "الى نفين نيفي نوفا/ اللي يحترم واحد لازم يحترم اختياره"
author = "مش ضروري"
text = "في تعليق حضرتك قلتي ان حضرتك بتحترمي السادات<br />اذن اللي يحترم السادات لازم يحترم اختياره<br />مالسادات اختار حسني مبارك حاكما لمصر من بعده<br />يبقى لازم تحبي حسني مبارك وتدعي الناس انهم يحبوا حسني مبارك ويحبوا جمال مبارك"
archived = "2007-07-11"
capture_url = "https://web.archive.org/web/20070711120512/http://masr.20at.com:80/newArticle.php?sid=10985"

[[comments]]
order = 4
subject = "لكل جواد كبوه"
author = "نيفين نيفى نوفا"
text = "صدقنى مش ضرورى يا مش ضرورى ان علشان انا بحترم شخص ما انى اقر ليه كل شىء على طول الخط<br />كتير من القاده و الزعماء اللى بيشهد لهم التاريخ بالكفاءه وقعو ف اخطاء و صدقنى انا اعلم جيدا ان غلطه الزعيم بالف غلطه و لكن الا تتفق معى ان لكل جواد كبوه<br />و اكيد السادات كان شايف وقتها حاجات الزمن ما اثبتهاش و انا منكرش انى مستغربه ده من السادات علما بانه كان ليه نظره مستقبليه مشهور بيها<br />بس معلش السادات عمل لمصر كتير برده فممكن نغفر له غلطه..<br />بالنسبه لمحمد السيد انا عارفه ان موقف زى ده مش بعيد عن اخ فاضل زيك بس صدقنى انا مكنتش هرد على الاستاذ مطفش رواد الموقع لسببين الاول انى و الحمد لله مخطوبه و مرتبطه عن حب و لست فى حاجه الى زوج و الثاتى علشان المقوله اللى بنقوللك :<br />اذا نطق السفيه فلا تجبه ..فافضل من اجابته السكوت"
archived = "2007-07-11"
capture_url = "https://web.archive.org/web/20070711120512/http://masr.20at.com:80/newArticle.php?sid=10985"

