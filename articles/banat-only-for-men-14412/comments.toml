text = "ويعدين انت مالك لبسة اية المهم تصرفها كان عامل ازاى اتصرفت باحترام ولا لا ودة مش يعنى انها بتديعى الاحترام ما ياما ناس لبست حجاب لكن مش محترمة وياما ناس مخمرات بيتصرفوا ولا كانهم مش عارفة اية الكلمة المفروض تتقال لكن البس حرية شخصية مش معناها ان البنت دية مش محترمة \"قرفت من المواصلات\"]دلوقتى كل الشباب بيبص<br />المحترم بيبص بس<br />واللى مش محترم بيتعمد يلمس البنت اللى جنبة سواء بايدة ولا رجلة<br />ولا ينام على كتفها ويعمل نفسة مش واخد بالة اصلة نايم<br />او بردو يمسك رجلها وقال اية نايم<br />ولا وهو بيقرأ الجرنال يفتحة على الأخر قال يعنى مثقف اوى<br />ويعمل اللى هو عايزة من تحت الجرنال<br />هو الواحد كرة الموصلات من شوية<br />دة انا ست سنين خبرة مع المواصلات<br />والله قرب يجيلى الخفيف منكوا ببقى قاعدة على الكرسى وكل شوية ابص ورايا احسن حد يمد ايدة ويعمل حركة مش كويسة<br />حسبى الله ونعم الوكيل فيكوا يا رجالة يا اللى بتعملوا كدا فى البنات[/"
