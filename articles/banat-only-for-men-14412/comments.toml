text = "السلام عليكم ورحمة الله وبركاته<br />اول حاجة احب اقولها<br />قال صلى الله عليه وسلم (لأن يطعن في رأس أحدكم بمخيط من حديد خير له من أن يمس امرأة لا تحل له)<br />الراوي: معقل بن يسار المحدث: المنذري - المصدر: الترغيب والترهيب - الصفحة أو الرقم: 3/89<br />خلاصة الدرجة: رجال الطبراني ثقات رجال الصحيح<br />ده بداية الكلام<br />ثانيا<br />فين غض بصرك يارب لو واحده ماشية من غير هدوم(ع قول عادل امام) ماتبصيش<br />ثانيا من حقي شرعا احط حاجة بيني وبينك الحديث امامك<br />ثالثا انا محجبة لامن المتشديدين ولا اللي لبسها سبور(محزق وملزق)او (حجاب الغطس) ولله الحمد شفت بلاوي قليل وكتير<br />احنا عارفين ربنا ولو الوحده ماشية صح بردة بيتحرشوا بيها"
