text = "انا مرة كنت راكبة الميكروباص جنبي راجل فوق الاربعين من الجيش وشايل كرتونة ع رجلة وانا ع الطرف ونازل بكوعه تحسيس ع صدري اعمل ايه بعدت هاقع ع رجل التباع والله قلت ادب نزلت من الميكروباص وركبت واحد تاني<br />في يوم ركبت اتوبيس نقل عام واحده مختمرة قاعدة ع كرسي من المفرد والراجل اللي وراها ع مشارف الخمسين بيمد ايده من تحت الكرسي شوف انت بقى وانا لسه راكبة الاتوبيس وتصوت وتنادي ان الناس تحس ماعدش في رجولة ولا نخوة انا طلعت من الباب نزلت من التاني ان الرجاله لاقاموا ولا عملوا حاجة مافيش نخوة ولا رجولة نعمل ايه"
