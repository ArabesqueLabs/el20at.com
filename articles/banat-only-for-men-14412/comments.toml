text = "وبعدين انت فاضى تبص على الناس فى الميكروباص وتفسروتحلل نظرااتهم وتبص على اللى نازلةواللى طالعةوتقيس المسافةاللى بيترفع بيهاالبادى ايه دا؟؟ياريت تخليك فى حالك وغض بصرك مهماكانت البنات لابسةوبعدين ياريت كل واحدفعلا يبص لنفسه الاول قبل ما يعلق على اللى حواليه كل الشباب بيسئطو بناطيلهم على الاخر وبيعملو نفس الحركةاللى بتعملها البنت اللى بتنزل البادى وهما طالعين ونازلين داحنا بنتحرجلكو والله وبنغض بصرنا ياريت كل واحد يتقى ربنا فى نفسه وفى اللى حواليه اكيد الحياة هتكون افضل وساعتها يمكن نحسن الظن بالناس اللى حوالينا زى مابتقول<br />وشكرااا :sad:"
