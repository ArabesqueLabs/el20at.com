subject = ""
author = "ranran"
posted = "2010-02-14"
text = "وشكرا يا Nounna0 على دفاعك<br />وانا رأيي بقى ماتتعبوش نفسكوا ولا تحرقوا دمكوا معاه ومع اللي زيه .. الناس دول صدقيني عمرهم ماهيتغيروا حتى لو قعدتي تقنعيهم من هنا للسنة اللي جاية ..<br />دي مواضيع مطروحة لينا احنا بس وخلينا نتكلم مع بعض كلنا و ناخد من خبرات بعض وسيبوكوا منهم ولا كأنهم موجودين أساسا<br />وشكرا ليكي تاني"
archived = "2010-02-27"
