text = "طب هو الكاتب لية زعلان ان البنت بتضع الشنطة بينها وبين اللى قاعد جنبها بتامن نفسها هى اية اللى عرفها ان اللى جنبها دا محترم وبعدين انا اعرف واحدة صحبتى اخوها بيوصها انها تضع الشنطة حنبها اذا كان اللى قاعد جنبها ولد مع العلم ان اخوها دا محترم جدا سعنى كمان الولاد عارفين اية اللى بيحصل من بعضهم وبيخافوا على اخواتهم منة"
