text = "حسن ظن ماشاء الله قال حسن ظن قال على ايه طيب هات اى دليل على اننا نحسن الظن بيكم عايزاك تتخيل مقدار اللى بيحصل لاى بنت خارجه لكليتها ولا لمدرستها ولا لشغلها انا مش هقول ان كل صنف الرجاله كبار ولا صغيرييين ولاد ........... ولا بلاش هوه فى ناس كده وناس كده بس الاغلب مش كويسين يعنى مثلا لو فى ميكروباص واقف والناس اتلمت عليه زيى ماالكل عارف وواحده واقفه تلاقى واحد بيحشر نفسه وعامل نفسه انه هيركب علشان يقرب من واحده ولا يعمل اى حاجه وعامل مش واخد<br />باله<br />على اساس انه هوه الوحيد اللى هيركب من اللى واقفين دول<br />بجد حاجه اخر سفاله<br />انا عن نفسى بقيت على قد ماقدر اخد الكورسيين اللى جنب السواق واريح دماغى مع انه ده مشكله تانيه واحد يقولى حرام فى ناس عايزه تركب وبتاع واللى يرمى كلام وحاجه اخر قرف يعنى ولا بعدنا عنهم نافع ولا بقينا زينا زبهم نافع ربنا ياخد كل اللى مش كويسين<br />اه نسيت بالنسبه للبس اللى انت ماعلقتش الا عليه وكانكو ملايكه لا حول لكم ولا قوه واحنا اللى بنغرغر بيكم وبندلكم على الفساد<br />فى ناس والله لو البنت اللى قدامهم لابسه ايه بردو بيبصوا وبيقول ادبهم<br />ربنا يريحنا من اللى ذى دول يارب"
