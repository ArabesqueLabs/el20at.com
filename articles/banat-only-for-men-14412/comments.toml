text = "[quote name=\"جيمس\"]لا بصراحة البنات هى الا بتتكسف من المناظر المرعبة الا الشباب بيعملوهايعنى ممكن تلاقى شاب لابس بادى كده قصير ومفتوح من على الصدر وجيبة تمام قصيرة كدة لغاية قبل الوسط ويركب الاتوبيس يعد يدارى كده فى كل جسمه الا ظاهر مكسوفين يابنات عيب عليكم دانتم بقيتم حاجة فظيعة لبسكم بيخلى الشباب الطايش فقط يتهوروترجعم وتجيبوا العيب على الشباب يعمل ايه شاب امام جسد عارى حتى لو دارا وجهه هيلاقى ورا منه بنت تانية عريانة كاسية[/quote]<br />أدي عينة أخرى من الشباب زي مانتو شايفين !!!<br />وانت مال **** تلبس اللي تلبسه انت مين عشان تدعي انك لازم تعاقب البنت اللي نازلة من بيتها بلبس معين .. ماتخليك في حالك ولما تبقى تتجوز ابقى افرض واحكم واتحكم وطلع عقدك زي مانت عايز في بنتك ومراتك ..<br />ربنا بالينا بشباب كل اللي هامه يبص على دي و يلمس دي وما خفي كان أعظم وكلنا عارفين الشباب بينهم وبين نفسهم بيفكروا وبيعملوا ايه !!!!<br />روح اعرف ربنا الأول و التزم بتعاليم دينك قبل ماتعمل فيها محلل نفسي و تدي لنفسك الحق في حاجة انت أبعد ماتكون فيها عن الحق"
