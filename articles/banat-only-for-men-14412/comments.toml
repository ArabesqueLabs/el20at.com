text = "انا معااك ان شكلك وحش يعني فالموضوع داا ! بس اشطه يعني مكنش موقف اوي يعني .. طب ماكل واحده مننا بتتعرض لوقف اكتر من داااا بكتيــــــــر ! وانا والله العظيم بمشي فالشارع وانا خايفه مالصغير والكبير وانت لو كنت من اي واحده كان زمانك قلت اللي اكتر من كده و كلمه كل واحده من البنات اللي ردوا وكل موقف اتعرضوا ليه يعمل مليوون كتاب .. لازم كل مره اركب فيها الموصلاتــ ادعي ربنا يبعد عني كل واحد مش سليم .. وبعدين انت لوشفت بعينك اللي بيحصل في الشارع عيني عينك اودام كل الناس هتقوول ( هما الرجاله ماتوا ولا ايه ) ايه قله الادب دي,, مش بس كدا دا انت هتحمد ربك و تبوس ايدك وش وضهر ان اختـك ولا امك و اللي يهموك مش فالموقف دا , وان الدنيا (( مش لسه بخير ) اللي بنسمعها فالمسلسلااان علي فكره . الدنيا كلها قرف . ماهي دنيا واللي يعيشياما يشووف ..<br />اما عن موضوع اللبس دا (( غضوا ابصاركم))<br />مانت اكيد لو رحت بلاد برا مش هترفض كل واحده لابسه عريان ولمجرد انها لابسه كده هتتحرش بها وتستحلها لانها مش محترمه(مين قالك انها مش محترمه يعني ) هي دي طبيعه اهل بيتها زي فمصر بردوا.هتقول في نفسك( وانا ماااال اللي جابوني )"
