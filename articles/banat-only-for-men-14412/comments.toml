text = "واحد زميلي حكيت له موقف الميكروباص قال ببساطة شديدة قولي لسواق انا مش مرتاحة في مكاني عاوزة اغير مكاني وشوفي هايحصل ايه لراجل بدل ما تنزلي وتركبي تاني او تصوتي<br />انا ركبت السيتي ايه وقعدت انا في اول الخط تخيل واحد جيه يقعد جنبي عادي الاتوبيس اتملى وسعت له دخل جوة وانا ع الطرف حركة سيئة بيقوم بيها الشباب والرجاله (يقعد ويفتح رجليه هو انت في بيتكم ماتلم نفسك) اخينا فتح رجليه ابعد يقرب ايده تيجي ع رجلي وقفت في الطرقة السواق قالي نازلة قلت له لا انا رايحة الجامعة قال وقفت ليه؟؟؟؟؟؟<br />قلت انا مش عارفه اقعد عاوزة مكان تاني اللي جنبي مش مرياحني في القعده وماعدش في احترام او ادب<br />ثانية واحده وقف الاتوبيس وهزق الراجل ونزله"
