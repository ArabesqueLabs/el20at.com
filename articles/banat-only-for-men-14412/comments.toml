text = "ع فكره حركه البادى دى مش استفزازيه ولا حاجه صدقنى دى حركه لا اراديه انا واحده من البنات بلبس محترم وطويل لما بركب ميكروباص وانا نازله من تلقاء نفسى بحط ايدى ع ظهرى عادى يعنى<br />وبعدين طنط الحاجه اللى حطت الشنطه بينكو صدقنى متقصدش انك مش محترم بس هى بتحمى نفسها من ان جسمك يبقى لازق ف جسمها انت ليه اخدت الموضوع بحساسبه كده وانا مش شايفه ان دى حاجه تسببلك الاحراج :oops:<br />اما الموقف التانى ده اكيد اكيد الولد عمل حاجه وانت مش اخدت بالك<br />مش معقول تعمل كده لوحدها ولو كان معملش حاجه يبقى عندها الخفيف بعيد عنك وعن السامعين وجتلها عقده منكو فطلعتو عليه مش مشكله بقئ مانتو من جنس واحد وهو كان كبش فدا ليكو :D :D :D :D"
