text = "[quote name=\"قرفت من المواصلات\"]دلوقتى كل الشباب بيبص<br />المحترم بيبص بس<br />واللى مش محترم بيتعمد يلمس البنت اللى جنبة سواء بايدة ولا رجلة<br />ولا ينام على كتفها ويعمل نفسة مش واخد بالة اصلة نايم<br />او بردو يمسك رجلها وقال اية نايم<br />ولا وهو بيقرأ الجرنال يفتحة على الأخر قال يعنى مثقف اوى<br />ويعمل اللى هو عايزة من تحت الجرنال<br />هو الواحد كرة الموصلات من شوية<br />دة انا ست سنين خبرة مع المواصلات<br />والله قرب يجيلى الخفيف منكوا ببقى قاعدة على الكرسى وكل شوية ابص ورايا احسن حد يمد ايدة ويعمل حركة مش كويسة<br />حسبى الله ونعم الوكيل فيكوا يا رجالة يا اللى بتعملوا كدا فى البنات[/quote]<br />عندك حق والله الرجالة ما يتضمنووش حركاتهم قذرة وتقرف بيستغل اى حركة عشان يلزق وياخد رحته<br />ولما الواحدة تتكلم يبقى مظلومين ومعملش حاجة<br />ده اقل شىء ان الواحدة تحط الشنطة جنبها"
