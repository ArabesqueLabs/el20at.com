text = "ما اهو انا على ما افترض حسن النية هيكون حصللي حاجات تحرق الدم انا في غنى عنها من الاول والشنطة دي هي اضعف الايمان<br />ويا استاذ كده وللا كده لازم يكون في فصل بين اي راجل وست غريبة عنه مش كفاية انهم قاعدين على كنبة واحدة جنب بعض<br />لو في واحد راجل محترم هيبقى في 99 واحد مش محترم وده مش سوء ظن ده عن تجربة سنين في المواصلات بسبب الشغل مع العلم اني منتقبة وملتزمة في لبسي جدا<br />وانا باحمد ربنا الف مرة اني اتجوزت وبطلت اركب اي مواصلات<br />اناشفت بعنيا واحد راجل والله العظيم فوق 70 سنة وقعدت جنبه بنت في العشرين طبعا هو بالنسبه لها جدها والله العظيم الراجل ده عمل حاجات ولا اي واحد صايع وشفته هو مرة تانيه مع واحدة تانية ولما البنت شتمته قالها كلام قذر جدا والناس مش مصدقة ازاي الراجل العجوز ده يعمل كده؟؟؟<br />وحضرتك بتقول ماتحرجوش الرجالة ..!!!!!!!!!!!"
