text = "اولا انا عنيت من الموضوع ده كتير لاننا مواصلاتنا صعبه ومفيش غير الميكروباصات بص ..... :oops: :oops:<br />وكمان فيه زحمه فالسواقين بيحملوا الركاب اربعات يعنى كل كنبه بدل تلاته اربعه<br />انا لما بلاقى كده بعمل حاجتين لركب جنب السواق بس جنب الشباك<br />ولو ركبت على الكنبه والسواق هيحمل اربعه بريح نفسى وادفع الرابع<br />:sad: :sad: :sad:<br />اول موقف بقا حصلى مع رخامه الرجاله وقله ادبهم كنت لسه فى اولى جامعه مش لازم احكيه لانى لما بفتكره بتخنق جدا<br />الموقف كان رخم وسافل بس من بعدها اركب اى مواصله وشى يقلب خشب واحط سماعه الموبيل ومعايا كتب الدراسه وابدا اذاكر وطبعا عينى على كل راجل جنبى ليعمل حركه كده ولا كده .........<br />بس تعروفوا انا بجد بدى احترامى لسواقين الميكروباص بتوعنا لو حملوا اربعات فى الكنبه بيخلوا البنات جنب بعض والرجاله على الطرف<br />ولو لقوا الموقف زحمه بيحملوا بنات بس وينفضوا للرجاله<br />مش دى برضوه رجوله :P :P :P :P :P<br />بس يابنات والله ما بلبس ولا التحشم<br />خير الامور الوسط لان المتنقبه بتتعاكس<br />فياريت لبسنا يكون متوسط<br />لان الزنقه والمعاكسات بقيت عاده فى الرجال"
