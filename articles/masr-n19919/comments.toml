subject = "اخوان اية بس"
author = "اكتب اسمك هنا"
posted = "2009-02-16"
text = "يعنى الدولة لو بتسهل تكوين الاحزاب الحقيقية المدعومة والتى تمثل مصالح الشعب هل كان ظهر حاجة اسمها الاخوان<br />ابدا<br />اظن الاخوان والجماعات هى افرازات النظام الديكتاتورى<br />وحتى ايام الملك لما كان بيخللى احزاب الاقلية هى اللى تحكم كان بيعمل ديكتاتورية تفرز نظام مثل الاخوان<br />لو الانظمة المتحجرة فتحت الشبابيك للشمس هتختفى كل التنظيمات دى لان الكل عايز يشتغل فى النور - هو فية احد غاوى اعتقالات وسجون"
archived = "2010-03-14"
