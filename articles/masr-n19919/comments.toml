[[comments]]
order = 4
subject = "مؤتمر اعادة اعمار غزة --- ها ها ها ها هاها ها ها"
author = "شفت"
posted = "2009-02-14"
text = "الحبيب بوش بعد احتلال العراق عمل مؤتمر لاعمار العراق<br />وراحت الدول كلها مكرهة او راغبة الى المؤتمر لتتبرع<br />وما رايناة على شاشات التليفزيون كان رائعا<br />حوالى 28 مليار تبرعات للعراق اللى اتبرع بمليار واللى بمليارين واللى ب 200 مليون وكان مهرجان رائع وتناول الجميع العشاء الفاخر على حساب صاحب المخل وساروا الى بلادهم فى امان اللة<br />وبعدها شفنا<br />ولا دولار واحد راح العراق<br />الكل بيتحجج بحجج بعدها ويتهرب<br />وكذلك سيحدث<br />الكل هيتبرع لغزة فى الكويت او قطر او القاهرة او شرم الشيخ والكل هيتعشى عشاءا رائعا فاخرا فية بطارخ واستكاوزا وجمبرى وهينام يتمتطع مع بنات الحان ليلة من ليالى الف ليلة فى الشرم ويسير الى اهلة يتمطى<br />وبعدين الدفع يا عمنا<br />يقول لك ابدا واللة اصل احنا عندنا عجز فى الميزانية<br />ودائما ميزانيات دول الخليج فيها عجز<br />الراجل اللى كان بيدفع الوحيد هو الشيخ زايد رحمة اللة<br />انما"
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215010115/http://masr.20at.com:80/newArticle.php?sid=19919"

[[comments]]
order = 5
subject = "تقليل رواتب الموظفين فى مصر"
author = "موظف"
posted = "2009-02-14"
text = "لتحسين الاقتصاد فى مصر - رجال الاعمال تنادى وسيتم تخفيض رواتب المصريين<br />ازاى<br />زمان كان الجنية المصرى بيساوى دولار<br />يعنى الموظف اللى بياخد 100 جنية فى الشهر كانة بياخد 100 دولار فى الشهر والقوة الشرائية تعادل 100 دولار<br />لما بتوع السياسات حرروا الجنية واصبح الدولار ب 5 جنية<br />اللى كان بياخد 100 دولار نزل وكان مرتبة اصبح عشرين دولار بس والقوة الشرائية لل 100 جنية اصبحت عشرين دولار<br />ودلوقتى فية دعوة لتخفيض قيمة الجنية امام الدولار<br />ولاد الكلب عايزين ينزلوا بمرتب الموظف لاسفل السافلين<br />فاذا الدولار اصبح ب 7 جنية معتاها كان اى موظف بيقبض 700 جنية يصبح مرتبة 100 دولار بس وبقوة شرائية 100 دولار فقط<br />يموت الشعب كلة فى ظل مصلحة رجال الاعمال"
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215010115/http://masr.20at.com:80/newArticle.php?sid=19919"

[[comments]]
order = 6
subject = "الحكومة دى بتاع مين"
author = "بسة العجلاتى"
posted = "2009-02-14"
text = "الحكومة دى بتمثل مين اذا كانت<br />عاملة مشاكل مع سواقين القطارات وبتوع الاشارات الاسبوع اللى فات<br />وعاملة مشاكل مع المدرسين علشان موضوع الكادر<br />وعاملة مشاكل مع اساتذة الجامعة برضة علشان الكادر الخاص باساتذة الجامعات<br />وعاملة مشاكل مع القضاة فى اختيار قادة لنوادى القضاة<br />ومشاكل مع العمال فى المحلة وكفر الدوار<br />ومشاكل مع نقابة المحامين وفرض الحراسة على نقابة المهندسين<br />وفى الاسبوع الماضى اضراب سواقين الميكروباص واغلاق الشوارع<br />وامس مع اصحاب المقطورات وسيارات النقل وعملوا اضراب وعطلوا نقل البضائع<br />ويوم الاثنين اضراب الصيادلة<br />اية اللى بيحصل<br />هى العملية بظوتت والا اية<br />الامن هيقدر على اية والا على اية<br />هاتوا حكومة تمثل الشعب"
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215010115/http://masr.20at.com:80/newArticle.php?sid=19919"

[[comments]]
order = 7
subject = "تقسم يا كابتن (حكومة ـ اخوان)"
author = "مش ضروري"
posted = "2009-02-14"
text = "التقسيمة المصرية الداخلية التي ابتلانا الله بها والتي يصرف المصريين عليها ما في جنوبهم هي تقسيمة<br />الحكومة ـ الاخوان<br />الملك فاروق ـ حسن البنا<br />جمال عبدالناصر ـ حسن الهضيبي<br />السادات ـ عمر التلمساني<br />مبارك ـ مهدي عاكف<br />ولسه الماتش الوسخ مش عايز يخلص<br />بسبب الماتش تجرعت مصر هزيمة نكراء عام 67<br />وبرضه مش عايزين يبطلوا الماتش<br />الشعب المصري جاع بسبب الماتش الوسخ دا"
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215010115/http://masr.20at.com:80/newArticle.php?sid=19919"

[[comments]]
