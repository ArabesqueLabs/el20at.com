subject = "الايام السوداء قادمة"
posted = "2009-02-17"
text = "اليوم رئيس الوزراء صرح ان الجنية المصرى يتعرض لضغوط وقال ان دخل القناة قل بنسبة 20 % فى يناير<br />وقال انة لا مفر من بيع اصول الدولة علشان نشترى اكل ونصرف على مليون عسكرى امن مركزى<br />تتوقع هيبيعوا اية السنة دى<br />بنك القاهرة باى سعر<br />شركة التليفونات الارضية<br />هيئة السكك الحديدية<br />غزل ونسيج المحلة<br />على فكرة الجنية المصرى غير معترف بة فى السودان<br />فين بتوع الاصلاح الاقتصادى ولاد الكلب"
