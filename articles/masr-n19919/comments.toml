[[comments]]
order = 1
subject = "هذي بلاد لم تعد كبلادي"
author = "منقول"
posted = "2009-02-13"
text = "هذي بلاد لم تعد كبلادي<br />كم عشت أسأل‏:‏ أين وجه بلادي<br />أين النخيل وأيـن دفء الــوادي<br />لاشيء يبدو في السمـــاء أمـامنـا<br />غير الظـلام وصــورة الجــلاد<br />هو لا يغيب عن العيــــون كأنــــه<br />قدر‏..‏ كيوم البعــث والميــــلاد<br />قـد عشت أصـرخ بينـكـم وأنــادي<br />أبني قـصورا من تـلال رمـــاد<br />أهفــو لأرض لا تـســــاوم فـرحتـــي<br />لا تـستبيح كـرامتي‏..‏ وعنــادي<br />أشتــاق أطـفــالا كـحبــات النـــــدي<br />يتـراقصون مـع الصباح النـادي<br />أهـــفـــــو لأيــام تــواري سحــرهــا<br />صخب الجـياد‏..‏ وفرحة الأعياد<br />اشتـقـــــت يومـا أن تـعـــود بـــــلادي<br />غابت وغبنـا‏..‏ وانـتهت ببعادي<br />في كـل نجــم ضــل حلـم ضائــــــع<br />وسحابــة لـبســت ثيـــاب حداد<br />وعلـي الـمدي أسـراب طـيــر راحــــل<br />نـسي الغناء فصار سـرب جراد<br />هذي بلاد تـاجـــرت فـــي عرضهـــــا<br />وتـفــرقـت شيعا بـكــــل مـــزاد<br />لم يبق من صخب الجياد سوي الأسي<br />تاريخ هذي الأرض بعض جياد<br />في كـل ركـن من ربــــوع بــــــلادي<br />تـبدو أمامي صـورة الجـلاد<br />لـمحوه من زمن يضاجع أرضهـــا<br />حملـت سفـاحا فـاستباح الـوادي"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213212834/http://masr.20at.com:80/newArticle.php?sid=19919"

[[comments]]
order = 2
subject = "ما نراة الان من انقسام هو العودة الى ما يسمى حلف ب"
author = "عجوز"
posted = "2009-02-13"
text = "امريكا فى هذة المرة اكثر ذكاءا<br />حلف بغداد التى حاربتة مصر فى الخمسينات والستينات ايام عبد الناصر رافضا سياسة الاحلاف والتمسك بالحياد الايجابى<br />عاد بقوة<br />تحت اسم جديد - دول الاعتدال او دول الاعتلال<br />والحزب المسمى بحزب بغداد قديما كان يضم على الورق تركيا والعراق وسوريا ومصر واسرائيل والاردن وسوريا واسرائيل<br />عاد حزب بغداد بصورتة الجديدة القديمة<br />وامريكا ستضع على قيادتة تركيا واسرائيل<br />اما الخلاف او القشور اياها فقل عنها ما شئت<br />الم تجتمع كونداليزا رايس بوزراء الخارجية لدول الاعتلال العربى مرتين فى سنة واحدة - لماذا ؟<br />بشراكم بقيادة تركيا واسرائيل فى حلف بغداد"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213212834/http://masr.20at.com:80/newArticle.php?sid=19919"

