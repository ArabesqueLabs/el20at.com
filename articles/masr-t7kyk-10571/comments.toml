subject = "الاصلاح الاقتصادى ولا رجعة عنة ابدا"
author = "البيك"
posted = "2008-11-23"
text = "الاصلاح الاقتصادى<br />بنصلح اية عطلان وواقف حالة - مفيش حاجة تتصلح - غير عند عم سعيد القهوجى - اللى بيقول عندك واحد شاى وصلحة<br />وعم سعيد القهوجى واقف فى القهوة بقا لة 25 سنة بيقول واحد شاى وصلحة<br />ولم افهم ازتى واحد شاى هيصلحة<br />هيعدل دماغة والا الشاى عايز يصلح ويتزود سكرة او ينظبط شاية<br />وعندك واحد شاى وصلحة<br />كل واحد بيقول انا بصلح<br />واية اللى بيصلحة محدش عارف وفى انهوا ورشة بيصلحوة<br />وهل الاصلاح محتاج قطع غيار والا اصلاح كدة بالكلام<br />اصلاح واصلاح واصلاح واصلاح"
