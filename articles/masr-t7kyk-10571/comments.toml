subject = "بعد الانهيار الاقتصادى الجنية المصرى يعادل مليم سن"
author = "فريكيكو"
posted = "2008-11-23"
text = "مهاجر فى الخارج<br />انا فى السعودية من 1982<br />فى سنة 1981 حينما تولى هذا النظام الحكم كان الريال السعودى يساوى 17 قرش صاغ احمر اليوم الريال السعودى يساوى 150 قرش صاغ احمر<br />وكان الريال السعودى يساوى 10 روبيات هندية و11 روبية باكستانية اليوم الريال السعودى يساوى 11 روبية هندية و 12 روبية باكستانية<br />يعنى الدول اللى فى المنطقة زى الهند وباكستان عملتها ثابتة واحنا حصل انهيار<br />ورغم الانهيار بيتكلموا عن الاثتثمار ومعدل التنمية واننا واننا واننا وكاننا شعب من البلهاء او المغفلين<br />ربنا يشفيهم يا رب"
