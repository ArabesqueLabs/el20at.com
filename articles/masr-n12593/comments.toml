order = 0
subject = "وزارة الصحة رفعت أسعار 70 نوع دواء بينها 47 مضادا"
author = "اكتب اسمك هنا"
posted = "2007-11-27"
text = ": وزارة الصحة رفعت أسعار 70 نوع دواء بينها 47 مضادا حيويا<br />القاهرة- قررت وزارة الصحة زيادة اسعار 70 نوعا من الادوية دفعة واحدة تراوحت الزيادة بين 20% و50% وشملت 47 نوعا من المضادات الحيوية وأربعة أنواع من مضادات الالتهابات والروماتيزم وخمسة أنواع لمطهرات الجروح..<br />ونوعين لكل من الحساسية وأدوية الضغط والقرحة وثلاثة أنواع للكحة والسخونة للاطفال تنتجها 15 شركة-حسبما ذكرت الوفد.<br />من بين الادوية التي شملتها الزيادة المضاد الحيوي »ابياموكس 500 وارتفع سعره من ستة جنيهات الي ثمانية جنيهات للعبوة 12 كبسولة.<br />ويوناسين 375 جم ملل من 35 جنيها الي 40 جنيها ويوناسين 250 مللي من 5.27 الي 33 جنيها وفيبرايسين 100 مللي من 18 جنيها الي 24 جنيها وسليبريكس 200 مللي من 25 جنيها الي 40 جنيها.<br />كما شملت زيادة اسعار المطهرات اورالدين من اربعة جنيهات الي خمسة جنيهات وبيتادين من 4 الي7 جنيهات ونولفاديكس من 27 الي 32 جنيها وباريتس 20 ملل من 32 جنيها الي 40 جنيها."
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128044102/http://masr.20at.com:80/newArticle.php?sid=12593"

[[comments]]
order = 1
subject = "الا المرتبات والاجور"
author = "سعيد"
posted = "2007-11-27"
text = "كل حاجة سعرها بيزيد<br />وتباع داخل البلد بأعلى من الاسعار العالمية<br />المأساة انك تجد المسؤول يقول ارتفاع الاسعار العالمية هى السبب<br />طيب يا اخى المسؤول لماذا لا يكون الاجر والمرتب مثل بقية العالم<br />فية موظف راتبة الشهرى بعد عشر سنين خدمة 300 جنية يعنى 50 دولار<br />وتقولى الدواء والاكل قد ارتفع سعرة"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128044102/http://masr.20at.com:80/newArticle.php?sid=12593"
