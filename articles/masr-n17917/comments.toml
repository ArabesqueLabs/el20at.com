[[comments]]
order = 1
subject = "نعمتان"
author = "ولاء الشملول"
text = "قال رسول الله صلى الله عليه وسلم: نعمتان مغبون عليهما ابن آدم، الصحة والفراغ. أى الوقت<br />والشباب الذين أسسوا وانضموا لهذه المجموعة لديهم وقت لا يعرفون كيف يستغلونه، ولا يعرفون قيمته اصلا، فكل ثانية من عمرنا نحن محاسبون عليها، ودول ييجوا يوم القيامة يقول من الساعة كذا للساعة كذا كنا بندور على القرد، والله حاجة تحزن وتكسف وتغيظ"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070738/http://masr.20at.com:80/newArticle.php?sid=17917"

