[[comments]]
order = 4
subject = "انا وشركات التليفونات والراسمالية المنحرفة وتشبيهنا بالقرد لغبائنا"
author = "منغاظ"
text = "انا فى دولة خليجية<br />فيها شركة تليفونات<br />هذة الشركة عبارة عن نسبة للمالك 20 % من راس المال و 80 % من رأس المال اسهم لمن هم فى حوذتة<br />كيف تحاسب هذة الشركة من قبل الدولة ؟<br />60 % من ارباح هذة الشركة تدخل الخزينة العامة للدولة<br />باقى الربح يوزع على حملة الاسهم وبعائد مجزى جدا بحيث ان بعض الاسر التى عندها عدد كاف من الاسهم يعتبر دخلا اضافيا لها<br />انما عندنا<br />صاحب الشركة بيعمل مليارات كل سنة وكلها من نصيبة هو وبيحول فلوسها لبنوك الخارج وبيضحك علينا بالقرد وكاننا قرود<br />هذة الشركات التى تربح من الكلام ولا تحتاج الة خامات ولا تصنيع ولا خلافة وبتلم فلوس بالمليارات وبدون حسيب او رقيب<br />اين الدولة لتعدل التشريعات لتاخذ نصيبها من الارباح<br />والا الدولة شاطرة تعمل ضرايب على الشقق وكل حاجة وسايبة المليارات يلهطوها"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070738/http://masr.20at.com:80/newArticle.php?sid=17917"
