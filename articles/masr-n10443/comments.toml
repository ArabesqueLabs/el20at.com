subject = "نقطة واحدة"
author = "ابن همام"
posted = "2007-06-01"
text = "اود ان اعقب على نقطة واحدة فقط وهى استغرابك من هذا الشكل الذى تظنة جديد للسلفيين ولكن اقول انهم هم السلفييون انفسهم ولكننا لم نكن نعرفهم من قبل على حقيقتهم الا من خلال اعلام يقصد تشويههم دائما واظهارهم بصورة متخلفة ولكن فى الحقيقة هم اصحاب فكر وعقول واراء سديدة ومن العجب ومن الخسارة لنا ان نضيع تلك العقول او ننكرها ولا نستفيد منها ولا نجعلها عضو مشارك فعال فى حياتنا اليومية حتى لو اختلفنا معهم<br />اخوك ابن همام<br />http://ibnhammam.blogspot.com"
archived = "2007-07-02"
capture_url = "https://web.archive.org/web/20070702092234/http://masr.20at.com:80/newArticle.php?sid=10443"
