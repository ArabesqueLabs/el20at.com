[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-06-16"
text = "المصريون : بتاريخ 15 - 6 - 2007<br />لم يكتف لاعب الكرة الكبير المحترف باستعلائه على زملاءه وعلى المدير الفني للمنتخب ولكن واصل تكبره وأودى بمستقبل لاعب كرة بنادي الإعلاميين..<br />تبدأ القصة عندما لعب المنتخب القومي مباراة ودية مع نادي الإعلاميين وفي اشتباك بين اللاعب الكبير ولاعب نادي الإعلاميين قرر اللاعب الكبير أن ينهي مستقبل لاعب نادي الإعلاميين كرويا وقال له بالحرف الواحد \" أنا هبطلك كورة\" وحدث ما حدث وقفز اللاعب المتعجرف على اللاعب متعمدا أصابته في فخذه الأيسر..<br />تحولت المباراة إلى مأساة للاعب نادي الإعلاميين حيث تحولت الإصابة إلى عاهة مستديمة حاول بعدها استرضاء اللاعب ومطالبته بتكليف علاجه ولكنه رمى له بمبلغ ضئيل وقال له \"ما تسمعش كلام المحامين وتحاول تبتزني\"."
archived = "2007-07-18"
capture_url = "https://web.archive.org/web/20070718003358/http://masr.20at.com:80/newArticle.php?sid=10612"
