text = "من عشرييييييييييين سنه انا كنت بلعب كورة فى نادى المصانع الحربية وانا عندى 13 سنة وكنا بنلاعب الترسانة واد دخل جامد عليا وقصبة رجلى حصل فيها شرخ .. من يقتص لى .. اين انتم يا مسلمين .. اين انتى يا امة محمد"
