[[comments]]
order = 3
subject = "التعليق الاول مش بتاعى"
author = "نيفين نيفى نوفا"
posted = "2007-07-09"
text = "ايد ده احنا فينا من كده<br />احب اوضح لعشرينات و كا العشريناتيه و لمروه عبد الفضيل ان التعليق الاول اللى فوف مش بتاعى و ان فيه واحده ظريفه او واحد ظريف انتحل اسمى ان صح التعبير<br />و اللى ياكد كلامى ان ده مش اسلوبى فى التعليق<br />المهم<br />الموضوى برده جميل و جديد يا مروه<br />و هو ده يا جماعه المصرى<br />الدم الخفيف و الثقافه و الاطلاع و سعه الافق اللى مبتتقيدش بدراسه او بمركز مهنى<br />و مصر مليانه بمليون عم محمد وده اللى مميز الشخصيه المصريه<br />اذكر ف الاقصر كان فيه برده واحد من حراس احد المعابد و بتظهر صورته ف برومو القاهره اليوم و كنت ف الاقصر من كذا سنه و قابلته و هو برده من هواه مراسله الؤساء و مشهور بكده<br />مش بقولكو يا جماعه هو ده المصرى"
archived = "2010-03-14"
capture_url = ""

