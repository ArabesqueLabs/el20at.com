[[comments]]
order = 1
subject = "حسبنا الله و نعم الوكيل"
author = "أبوعبدالرحمن"
posted = "2008-01-27"
text = "الأستاذ الفاضل علاء عواد جزاك الله خيرا و بارك الله فيك..<br />الحقيقة أن الشعوب تنتفض و تتحرك لكن تبقى سياسات الانظمة التي وقعت عشرات الاتفاقيات و المعاهدات مع الكيان المغتصب هي ما يُلجِم الشعوب لأن أول من يمنعها عن التحرك بخطوات عملية الانظمة الحاكمة..<br />و حسبنا الله و نعم الوكيل.."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "لا تخافي غزة"
author = "محمد سنجر"
posted = "2008-02-04"
text = "سكن الليل<br />و في جوف السكون<br />تكثر الآلام<br />غرب البدر<br />و للحق عيون<br />ترقب الأيتام<br />فتعالوا<br />يا باغي الحق نزور<br />غزة الأطفال<br />علنا ننعي<br />بذياك السواد<br />نخوة و رجال<br />اسمع البومة<br />ما بين الضباب<br />تلعنك صهيون<br />في فضاء<br />ضربت فيه الذئاب<br />سورك الملعون<br />لا تخافي<br />يا فتاتي<br />فاليهود تكتم الأخبار<br />و صقيع الليل<br />عرايا بين بيوت<br />تحولت أطلال<br />لا تخافي<br />لا تخافي<br />فملوك العرب<br />قد صادروا الأفكار<br />تركت غزة<br />و باتت تكتفي<br />بشجب و استنكار<br />و مليك الروم<br />قد جاء يزور<br />قاتلك يحميه<br />فهو مثلي<br />خائن<br />كيف يزيل<br />دمك من أياديه"
archived = "2010-03-14"
capture_url = ""
