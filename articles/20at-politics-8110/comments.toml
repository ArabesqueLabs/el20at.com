subject = "اقل الواجب"
author = "طارق"
posted = "2008-01-26"
text = "تقرير طيب<br />الاستاذ علاء عواد قواد صحفي متميز تمنياتي بالتوفيق<br />ما تقوم به النقابات وغيرها هو اقل الواجب تجاه الصامدين في غزة"
