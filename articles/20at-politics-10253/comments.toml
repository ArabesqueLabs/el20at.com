subject = "لعنة الشهيد صدام"
author = "الحشاش"
posted = "2008-10-27"
text = "ان مايحدث لامريكا والغرب بل للعالم ليس الا تأكيدا على ان الله عز وجل المنتقم الجبار من الظالم ..للمظلوم<br />والعراق الحر ظلم ظلما لم تشهده البشريه من قبل .. وانتهكت اعراض وسلبت ثرواته وفرق وهجر شعبه<br />وظلم رئيسه الشرعي الشهيد صدام بعد أن رفض الخيانه لوطنه وشعبه .ان الله عز وجل انتقم للشهيد ولابناءه الشهداء ولرفاقه وللشعب العراقي قبل أن تنتهي ولايه المجرم بوش ليراء بأم عينه انتقام الجبار من خلال اهم قوة اعتمد عليها في سفك دماء الابرياء<br />قالها الشيخ عايض القرني حفظه الله ..ابشر بها صدام ,,الف شكر"
