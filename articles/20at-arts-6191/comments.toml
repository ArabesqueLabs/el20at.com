[[comments]]
order = 7
subject = "الرفيقة الفنانة تيريز سليمان من اجمل من يمكن ان يح"
author = "رانية.رفيقة من الشبيبة-فرع حيف"
posted = "2007-07-08"
text = "اسمي رانية, رفيقة في الشبيبة الشيوعية فرع حيفا, تربطني بتيريز علاقة رفاقية سطحية لا اكثر, ولكن محبتي وتقديري لشخصها الرائع وفنها المميز والراقي يجعلني اهتم في متابعة كل اخبارها الفنية عن كثب والتنقل من موقع انترنت الى اخر لمعرفة كل جديد, وهذا ما اوصلني الى هذا الموقع القيم,فوجئت من التعليقات \"الغير بناءة\" (بارقى عبارة ممكنة) التي قللت من شأن تيريز(ابنة بلدي)لذا شعرت انه من واجبي الرد والتعقيب.<br />بداية, تضحكني التكنولوجيا التي تمكّن اي انسان من تقمّص شخصية آخر والتعليق باسمه(ولكن ما اروع الدنيا اذا اقتصرت على هذه العلّة فقط)!, بما انني عضوة في الشبيبة (البيت الذي عرّفني بتيريز ) واتابع كل البرامج التي يرتبها الحزب والجبهة فقد حالفني الحظ وحضرت اغلب البرامج التي شاركت فيها الرفيقة تيريز سليمان والرفيقة رنا نعرة, وسمعت اغنية \"لو رحل صوتي \" بصوت رفيقتي وتمتعت باداء كل منهما كل بطابعها الخاص,يؤسفني بل ويستفزني كل ما صدر من تسخيف ومزاودة من قبل \"ياسر\" او أيا كان/كانت, وكلمة حق يجب ان تقال الاسلوب المميز الذي تؤدي فيه تيريز هذه الاغنية بمرافقة الايقاع لم ارى احدا يتقنه غيرها, لذا, عزيزتي تيريز, اشد على اياديكي, والعزيزة هناء الرملة (تمتعت كثيرا بمشاهدة الفيلم) وبوركت على اختيارك لصوت واحساس وانسانية تيريز الرائعة (والله يهدي الجميع)<br />ارجو نشر التعليق..بالرغم من انني اسهبت فيه!"
archived = "2010-03-14"
capture_url = ""

