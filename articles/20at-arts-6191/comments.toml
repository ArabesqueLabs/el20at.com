text = "في البداية اشكر الاخ عاشق فلسطين الرد علي هذا الكلب الواطي الفاسق لعنه الله<br />واود ان اقول لكل من كتب كلمة واحد تمس فلسطين او شعبها ان يسحب ما كتبه , اللهم ادخل شهداء فلسطين في الجنة اللهم اخسي من يمس فلسطين بكلمة سوى وادخله نار جحنم يوم العرض عليك يارب العلمين<br />انا للاسف لم اشترك في خدمة الانترنت الا مخرن واعرف انا هذا الكلام قديم ولكن ضميري و حبي لهذا الوطن وشعبة<br />لم يتركاني امر مرور الكرام دون تعليق علي الموضوع<br />اما بنسب للي \" محمد نواف الحمدالله \" فقول نعلك الله والملائكة والناس اجمعين<br />وخسرة في الحياة الدنيا وادخلك الله النار آمين<br />اما نسبه للموضوع الاساسي الذي كتبه \" عمرو حسين \" فهو موضوع جميل اشكرك يا اخي \" عمرو \" علي هذا الموضوع<br />واتمنا منك وجميع من اطلع علي ردي هذا ان يزور هذا الرابط : وهو اهراء مني اليكم<br />http://najialali.hanaa.net/naji_toonss1.html<br />واهديكم هذه الكلمات للفنان الكاريكاتير الفلسطيني \"ناجى العلي \" رحمه الله<br />ارسم شجرة ... ارسم عشرة<br />ارسم بستاناً .. لون ثمره<br />ارسم خوخاً .. ارسم عنباً<br />ارسم نخلاً يحمل ثمراً.... ارسم ازهاراً وسنابل<br />ارسم اغصاناً وبلابل.... خفف من جوعك وتسلى<br />لون بستاناً يتجلى<br />لاتتخلى ... بالصبر تحلى<br />بالعزم تشكل وتوكل.....بالدمع لا تتوسل<br />لاتتشاءم ... لاتتشاءم<br />لون وتفائل<br />لون بستانك بلأخضر ..<br />لون رمانه بالاحمر لون بالاصفر ليمونه<br />لون بالزعتر زيتونه<br />لون بالعنبر والحنة ...لونه بالوان الجنة<br />لاتساوم .. ارسم وقاوم<br />فان منعوا عنك الغذاء ارسم بستاناً<br />وان منعوا عنك الدواء ارسم وطناً<br />وان منعوا عنك الهواء ارسم فلسطين"
