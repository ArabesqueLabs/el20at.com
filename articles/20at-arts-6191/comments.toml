[[comments]]
order = 5
subject = "الرجاء عدم حذف الرد مرة أخرى"
author = "هناء الرملي ... مخرجة الفيلم"
posted = "2007-07-08"
text = "في البدء اقدر واشكر السيد عمرو حسين على ما كتب ونشر عن فيلم \" الايقونة \" ..\"حنظلة \" ..وقد وصلني العديد من ايميلات الشكر ممن حاز الفيلم على اعجابهم من مشاهدي الفيلم من خلال موقع عشرينات ..<br />وكذلك أشكر الاخت الكريمة نيفين على رايها بالفيلم ..<br />و لفناننا القدير سميح شقير ..كل الحب .. أتمنى أن تكون قد استلمت رسالتي عبر الايميل .حتى تتضح لديك الصورة حول الفيلم دون أي لبس او سوء فهم ..واعذر اي لبس وتقصير قد برد منا..<br />وللجميع هذا التوضيح :<br />فيلم الايقونة هو فيلم قصير و الفيلم النهائي اعمل عليه ليخرج بشكل لائق ومتكامل الى حد ما .. يتضمن عناصر الفيلم الوثائقي ..<br />الاخ الكريم ياسر .. شكرا لاضافتك هنا ..ومع محبتي واحترامي الشديد للفنانة رنا نعرة .. وبعد أن قرات ما كتبت عن تيريز سليمان يتوجب علي توضيح أمر هام ..<br />الفنانة الرقيقة والجميلة تيريز سليمان من حيفا قد قدمت هذه الاغنية في حفل عام هناك ، والمقطع من الاغنية بالفيلم لم يكن الا جزء من تسجيل للحفل .. وحين تواصلت معها اوضحت لي ذلك ، كما انها احبت ان تتاكد باني على علم ان الاغنية للفنان الكبير سيمح شقير وليست لها واكدت لي ذلك باصرار شديد منها عدة مرات ، واخبرتها بمحاولاتي في البحث عن اي معلومات للتواصل مع الفنان سميح شقير .<br />كما ان تيريز سليمان ـ لمن لم يعرفها ـ فنانة شابة و مبدعة ولديها اغانيها الجديدة الخاصة الراقية ..وتملك صوت رائع واحساس مميز .. أتمنى أن نشد على ايدي من يتمسك بالفن الراقي في هذه الايام ، فكم نحن واجيالنا القادمة بحاجة ماسة له .. وهذه التوضيح للاخ ياسر والجميع ..<br />لنتمسك بالحب كما احبنا ناجي العلي .. وبالتسامي كما يتسامى.. حنظلة ..<br />دمتم بخير وعطاء جميعاً ..<br />تحياتي للجميع ..<br />هناء الرملي"
archived = "2010-03-14"
capture_url = ""

