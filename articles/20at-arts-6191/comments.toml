text = "الى الرائعة هناء الرملي-استطعت ان المسك واان المس بعدك عن كل ما هو عادي..لكن لا انكر خيبة املي لعدم معرفتك حقيقة اغنية الرائع سميح شقير..واليك والى رانيا توضيح اخر لتعقيب الاخ ياسر :<br />لم يكن تعليق ياسر الا توضيحا بنائا وكلمة صادقة تقال بحق سميح شقير والفنانة الرائعة ذات الصوت الفلسطيني المقاوم رنا نعرة..ان الاغنية مؤثرة وعظيمة كما كتبها ولحنها واداها سميح شقير..لكنها ازدادت تميزا وقوة حين اضافت رنا نعرة لمستها وجعلتها كما نسمعها بالفيلم (ملاحظة : لقد قدمت رنا نعرة الاغنية بهذا التجديد في مهرجان يوم الاسير سنة 2002) لهذا برأيي ان صاحبة الفكرة تستحق هي ايضا الاعتذار..ومع هذا صوت تيريز سليمان جميل والفيلم صادق ومعبر<br />شكرا"
