text = "الف تليار مليار بليون مليون زب في كل فلسطيزي أخو قحبة<br />اضحك مع الفلسطيزي<br />فلسطيزي راح عند الحكيم يشكو من مرض فسأله الحكيم عن حالته الجنسية فرد الفلسطيزي متعجباً: شو حكيم ما هو أنت عارف أنا ما عنديش جنسية، تفيدك وثيقة سفر مصرية........................<br />....................ها ها ها ها ها............ ما أغبى الفلسطيزيين............<br />في فلسطيزي بعد زواج 15 سنة فحصوا زوجتو لقوها ما مفتوحة و غشاء البكارة لسة موجود سألوه ليش يا زلمة لسة ما فتحت زوجتك، رد عليهم و بثورية و رافعاً يده بإشارة النصر ان شاء الله راح نفتحها ... شاء من شاء و أبى من أبى و اللي مش عاجبو يجي يفتح بكارة زوجتي ..<br />....................ها ها ها ها ها ............ ما أغبى الفلسطيزيين............<br />عن البخل الفلسطيزي - في فلسطيزي عايش في عمان – الاردن قال لابنو اذا نجحت بالامتحان راح اخليك تشوف سيارة البوظا.<br />....................ها ها ها ها ها ............ ما أبخل الفلسطيزيين............<br />المستحيلات الاربعة : الغول و العنقاء و الخل الوفي و الفلسطيني الشريف و النزيه.<br />....................ها ها ها ها ها ............ ما أغبى الفلسطيزيين............<br />تعريف للفلسطيزي: هو حيوان لكنه بروح حشرة القرادة يحب أن يعيش على دم الآخرين و يريد أن يسمن مثل البغال و من صفاته الحقد (إسألوا الكويتيين عن حقدهم) و الحسد (إسألوا الأردنيين عن حسدهم) و الجبن (إسألوا المصريين عن جبنهم) و الأنانية (إسألوا العراقيين عن أنانيتهم) و اللؤم (إسألوا اللبنانيين عن لؤمهم) و السفالة (إسألوا السوريين عن سفالتهم) و الطمع (إسألوا السعوديون عن طمعهم) و الصفاقة (إسألوا القطريين عن صفاقتهم) و البخل (إسألوا الإماراتيين عن بخلهم) و الغباء (إسألو الليبيين عن غباءهم) و النذالة (إسألو البحرينيين عن نذالتهم) و الفلسطيزي ما عندو مانع أن يحصل على النقود باي طريقة حتى و لو بالقوادة على زوجتو"
