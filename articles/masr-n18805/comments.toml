[[comments]]
order = 1
subject = "انا موافق"
author = "محمد الحسينى"
text = "بصراحة انا موافق على منع المواقع الجنسية فى مصر لان اللى بيقول ان المنع يبقى من الداخل واللى مش عايز يتفرج ما بتفرجش اقوله هو انت ملاك ولا نبى احنا شباب وفاهمين بعض وخلينا صرحاء مع بعضنا احنا كلنا بنشوف البلاوى دى واللى ربنا بيحبه بيندم شويه على انه اتفرج ولكن بيرجع تانى اصل الشيطان شاطر وبرضه النفس وحشه والممنوع مرغوب وبعدين ما يبقاش انا جوه بيت دعارة وتقولى لا ما تزنيش لا احنا نهد بيت الدعارة ومفيش حد هايعمل زنا وبعدين ايه فايدتها دا بالعكس بتفتح مخنا على حاجات مكنش الواحد بيحلم بيها زى ايه؟ اقولك زى زنا المحارم اللى كل المواقه الجنسية ماليانه بيه وكأن ده امتع انواع الجنس ليه مش عارف واقولك ايه كمان الجنس الجماعى وايه كمان تبادل الزوجات كل ده عرفناه منين الا من المواقع دى وبعدين بأ تاثيرها يبان ولا احنا نسينا قضية تبادل الزوجات وان الكلب اللى اتقبض عليه قال ان فيه 40 اسرة وافقت على الموضوع يعنى ايه 40 اسرة يعنى 40 ذكر (مش هاقول راجل) و40 ست دا غير الاولاد اللى ها يشوفوهم او يحسو بيهم وشوف بقى المستقبل المشرق ليهم وتخيل انت بقى انا من موقعى هذا وباعترافى اننى اشاهد هذه المواقع القذرة اؤيد وبشده منع هذه المواقع واللى معاه برامج بروكسى بقى يبقى هو اللى عايز يخربها على نفسه"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103125/http://masr.20at.com:80/newArticle.php?sid=18805"

[[comments]]
order = 2
subject = "مؤيد ولكن"
author = "محمد جمال الدين"
text = "طبعاً انا مؤيد للحملة برمتها لأنها بتظهر لنا ان لسة فيه شباب صاحى و مسقطش البنطلون بتاعه<br />بس مش شايف ان ده هو حل المشكلة : ليه ؟<br />لأن قبل ما يكون فيه انترنت كان فيه افلام بورنو مغرقة الدنيا و الانترنت ما هو الا وسيلة سهلت الحكاية دى .<br />وفى حال تنفيذ حجب المواقع الاباحية فسوف ينتعش سوق السى ديهات فى الشوارع و سوف تظل تتداول<br />فالحل فى الشخص وليس الموقع .. الموقع موجودعايز تشوفه شوفه مش عايز خلاص كل واحد وفيه مخ لازم يفكر<br />وماتتفرضش عليه حاجة لأنه فيه الاف البدائل غيرها .. و الشباب مش هتغلب يعنى فى انهاتجيب حاجة زى دى<br />دى ممكن تكون اشطر حاجة بيجيدوا أيجادها بكل سهولة زى المخدرات<br />و موضوع جميل اوى اوى ."
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103125/http://masr.20at.com:80/newArticle.php?sid=18805"

[[comments]]
order = 3
subject = "الموضوع دة مش هيتم فية حاجة - لان الحكومة عايزة كدة"
author = "مش لاعب"
text = "الاغلاق لن يتم<br />لان الموساد والحكومة عايزة كدة - عايزة تشغل الشباب بالجنس والكرة والاهلى والزمالك علشان محدش يفكر فى الاوضاع الاقتصادية ولا السياسية ولا البطالة والوضع المزفت بستين نيلة<br />وبعدين لما يشوف مواقع اباحية مش هيعمل تنظيمات للاضرابات على الفيس بوك زى بتوع 6 ابريل<br />خليكم حلوين<br />وحلوين قوى<br />ولو عايزين يمنعوا المواقع دى كان من غير ما حد فكرهم<br />لكن<br />زى الحكومة ما سمحت باستيراد المبيدات المسرطنة<br />وزى ما سمحت باستيراد القمح بتاع علف الحيوانات لعمل خبز للشعب<br />وزى ما اكلت الشعب لحم الحمير<br />وزى ما استوردت اكياس الدم الفاسدة علشان تخلص من كل مرضى الفشل الكلوى دفعة واحدة<br />كمان الحكومة بتسمح بدخول مواد مسرطنة من على النت لعقول الشباب<br />اسمع يا حبيبى انت وهو<br />الحكومة بتسمع دبة النملة وعارفة القرد مخبى ابنة فين<br />سلام"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103125/http://masr.20at.com:80/newArticle.php?sid=18805"
