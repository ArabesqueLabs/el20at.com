text = "المهم ان الاخوان بتوع الاصلاح واللى مديين نفسهم الحقوهما على النت انهم يتكلموا ن فلسطين والعراق والشيشان وكوسوفو لو امكن .. عمرى ما شفتفيهم حد بيتكلم عن السعودية واستبداد السعودية وقمع اى راى ايا كان فى السعودية او الجنون المطبق فى السعودية اللى مبتسمحش للست تسوق عربية .. الطناش الاخوانى ده له عندى تفسيرين .. يا اما سياسات السعودية عجباكوا ( يا نهار اسود يعنى ) او الموضوع هو فلوس السعودية وفى الحالى دى يبقى ( اخص واخخخىى ويععععع )"
