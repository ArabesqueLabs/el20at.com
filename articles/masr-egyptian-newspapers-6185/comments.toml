subject = "الى الاخ اللي فوق"
author = "مش مش"
posted = "2007-06-09"
text = "يا اخي الكريم انا عايز مع الدكتور يوسف القرضاوي وغيره في الخليج وبرضه الدكتور يوسف القرضاوي ما يقدرش يفتح بقه هنا في الخليج الدكتور يوسف معاه جنسية قطرية هل هو يقدر يوجه اي انتقاد لحاكم قطر<br />كلا والف كلا<br />وانا هنا عايش في الخليج منذ فترة طويلة الغريب ان الاخوان المسلمين بيجو من مصر وسوريا مولعين الدنيا في بلادهم وهنا الحكام يقولوا يمين يبقى يمين والحكام يقولوا شمال يبقى شمال الامر الذي يؤكد ان المسالة مسالة مادية اول ما جم الخليج واستريحوا ماديا خلاص نسيو كل حاجه"
