subject = "وما قدروا النبي محمد صلى الله عليه وسلم حق قدره"
author = "مش مهم"
posted = "2007-06-05"
text = "والله ليهم حق بتوع الدنمارك يسيئوا للنبي اذا كان المسلمون هم الذين يسيئون لنبيهم ودينهم<br />يا اخواني اوصيكم كلما سمعتم اساءة للنبي محمد صلى الله عليه وسلم افحموهم بهذه العبارة<br />اذا كان النبي محمد صلى الله عليه وسلم جاء وجلس مع العرب في جزيرة العرب 23 سنه وبعد ان انتهت مهمته صلى الله عليه وسلم وفي اقل من 100 عام صارت دولتهم من اسبانيا الى الهند<br />هذا هو النبي محمد صلى الله عليه وسلم الذي علم وادب وربى<br />وهذا لا يمنع ان بول النبي صلى الله عليه وسلم به اثر في السنه<br />ولكن في حالات خاصة جدا"
archived = "2010-03-14"
