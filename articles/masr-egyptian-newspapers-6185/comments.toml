[[comments]]
order = 7
subject = "الازهر يوقف صاحب فتوى رضاعة الكبير عن العمل"
author = "اكتب اسمك هنا"
posted = "2007-06-09"
text = "صورة أرشيفية لـ د. عزت عطية<br />دبي، القاهرة- العربية.نت وسيد زايد<br />قرر المجلس الأعلى للأزهر ايقاف رئيس قسم الحديث بكلية أصول الدين بالقاهرة الدكتور عزت عطية عن عمله وإحالته إلي مجلس التأديب للتحقيق معه حول فتواه \"جواز إرضاع الموظفة لزمليها في العمل لمنع وجودهما في خلوة شرعية\". وجاء القرار في وقت شنّ وزير الأوقاف المصري محمود حمدي زقزوق هجوماً عنيفاً على فتوى أخرى لمفتي مصر الدكتور علي جمعة، أكد فيها أن الصحابة كانوا يتبركون بشرب \"بول\" الرسول صلى الله عليه وسلم.<br />وأصدر المجلس الأعلى للأزهر -وهو أعلى جهة إدارية تابعة لمشيخة الأزهر في مصر- بيانا نقلته صحيفة \"الشرق الأوسط\" الثلاثاء 22-5-2007، اعتبر فيه أن ما جاء على لسان عطية \"يتنافى مع مبادئ الدين الإسلامي الحنيف ويخالف مبادئ التربية والأخلاق ويسيء إلى الأزهر كمؤسسة إسلامية مرموقة\". وأجرت \"العربية.نت\" اتصالا هاتفيا بالدكتور عزت عطية بعد قرار الإيقاف وإحالته إلي لجنة التحقيق المشكلة من علماء بالأزهر"
archived = "2010-03-14"
capture_url = ""

