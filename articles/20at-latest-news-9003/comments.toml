order = 0
subject = "ناجى العلى"
author = "نيفين نيفى نوفا"
posted = "2008-05-07"
text = "عشريناااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااات<br />اولا وحشتونى جدا<br />مش عارفه ليه لما قرات المقال استحضرت جمله سمعتها منذ قليل فى فيلم ناجى العلى اللى كان بيتعرض على روتانا لما سالوه يحب يسيب لبنان و يروح فين فى الوطن العربى الممتد من المحيط الثائر الى الخليج الغادر على حد تعبيره و قال ناجى انه يفضل يروح لندن و و هنا قالت له احدى الموجودات بس فى لندن انت مش محمى و مش امن فقالها و مين فى الوطن العربى كله محمى او امن<br />حصار و غربه و ضياع<br />كلنا هؤلاء النسوة الفلسطينيات<br />كلنا ام حمزه<br />الجرح واحد"
archived = "2010-03-14"
