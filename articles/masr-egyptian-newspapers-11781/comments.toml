text = "صدقت ياأستاذ عبد البارى. أول ما سمعت تهمة قلب نظام الحكم عرفت أنهم كاذبون ومفبركون. الراجل قالها صريحة أنهم يساعدون المقاومة وهذا شرف لهم ولكل العرب. ولكن منافقين السلطة وكلاب السلطان والغوغاء أستغلوا الموقف وفتحوا باب الشتائم البذيئة وهذا والله عيب فى حق الشعب المصرى الأصيل. عيب يامحسوبين على الصحافة المصرية وأنتم من الرعاع ومرتزقة النظام...."
