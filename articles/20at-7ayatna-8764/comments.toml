posted = "2008-04-16"
text = "ان الاعمال العظيمة لم تكن في يوم من الايام سوى افكار واحلام عكف الكثير على تحقيقها وتفانى من اجلها، ومن الجميل أن نرى مجموعة القدس تتميز في تقديم الخدمة التطوعية والحهد المميز في تنشئة جيل يحمل هم امته وهم مجتمعه، فهي نبت جميل زهى واثمر، غرست بذوره ثلة من اصحاب الهمم، وهي كغيرها من المجموعات غايتها غرس بذور الخير في نفوس منتسبيها وتربيهم على القيم والأخلاق الاسلامية، ويمكن زيارة موقع المجموعة على الانترنت لمتابعة اخبار وانشطة المجموعة.<br />www.alqudsscouts.com info@alqudsscouts.com"
