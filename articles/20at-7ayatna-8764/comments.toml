subject = "إضافات"
author = "خالد العالم"
posted = "2008-04-16"
text = "أود الإضافة هنا أن الحركة الكشفية حسب اعتقادي أنها الطريقة الأمثل للتربية لأنها تجمع بين التثقيف والممارسة ، ففيها يتلقى الفرد مجموعة من المعلومات والمهارات ومن ثم يقوم بممارستها فعليا ضمن البرامج العملية الكشفية كالمخيمات والمسيرات والرحلات وأيضا في احتكاكه المباشر مع المجتمع المحلي . وأيضا لأن الحركة الكشفية تهتم بمعظم جوانب الشخصية مثل الجوانب الدينية والوطنية والعلمية والرياضية والصحية ... ، وهي تحتاج ليشع بريقها كما تستحق إلى رعاية رسمية وشعبية تعينيها على القيام بأنشطتها وبرامجها ."
