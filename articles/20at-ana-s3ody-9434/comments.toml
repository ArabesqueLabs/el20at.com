[[comments]]
order = 1
subject = "القانون هو \\"
author = "شادي الألحان"
posted = "2008-07-01"
text = "إن نظرة الشاب السعودي للزواج أصبحت مرعبة ، وقد لا يخفى عليكم الأمور المتعلقة برسومات الزواج في المملكة العربية السعودية إذ أن مقدمات الزواج قد تصعِّب على الشاب السعودي الزواج من سعودية ، فلو نظرنا للأجنبية فإن رسومات زواجها ميسرة قد لا تتعدى في نظري 30 ألف ريال سعودي شامل المهر + مصاريف الزواج + جهاز العرس ..<br />وبما أن القانون هو الحل .. فإذاً لا بد للقانون أن يوقف الأباء من بيع بناتهن بغالي الأثمان ، والتكليف على ذاك الموظف السعودي \\\" الغلبان \\\" الذي لا يتعدى مصروفه الشهري عن ألفين ريال ، أو شروعه للزواج من أجنبية فذاك هو الحل الوحيد كي يعيش سعيداً معافى من مرض \\\" هَلِكتُ وربِ الكعبة \\\" .. !!<br />وأود هنا أن أشكر الأستاذة \\\" هلا \\\" على طرح مثل هذه المواضيع المميزة .. شكراً لكِ أستاذة هلا والشكر أيضاً موصولٌ لأصحاب هذا الموقع الرائع .."
archived = "2010-03-14"
capture_url = ""

