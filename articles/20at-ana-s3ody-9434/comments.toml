order = 5
subject = "ناتنا مرفهين ولا يقبلن إلا بشروط وأولها لا يكون مت"
author = "كشكول حجازي"
posted = "2008-08-10"
text = "&--65533;&--65533;&--65533;&--65533; &--65533;&--65533;&--65533; &--65533;&--65533;&--65533;&--65533;&--65533;&--65533;&--65533; &--65533;&--65533;&--65533;&--65533;&--65533;&--65533; : كشكول حجازي<br />طبعا اتحدث عن تجربة : لي رغبة بالزواج من أخرى ولما بدأت بالبحث وجدت أن كل الأبواب مؤصدة أمامي حتى المطلقة رفضت وطبعا ما بقي إلا النطيحة والمتردية وهذا لا يقبله أي رجل خاصة أنها الثانية يعني لازم تغطي على الأولى من حيث الجمال والاخلاق والنسب ولما فكرت من الخارج لقيت الابواب أشد صلابة فالحكومة مانعة الزواج من الخارج إلا بشروط طيب ايش ذنبي لازم تكون زوجتي معاقة أو مريضة , ياناس كل شيء مقفل في وجه الرجل السعودي , سؤال أليس لي حرية إختيار من أرغب في الزواج بها أو حتى هذا يتحكوموا به , ياناس الواحد إن ولد حر , حتى هذا ( ؟؟ ) وضعلوا له منع , سبحان الله والشيء الغريب لو إني أحمل الجنسي ( مثلاً ) الإماراتية كان تزوجت من أي جنسية ودخلت فيها السعودية واشغلت في أي شغل حالي حال المواطن يعني السعودي صارت جنسيته كإنها لعنة الفراعنة حتى أن زواجه من المغربية أو اليمنية أو الإندونسية ممنوع إلا شروط وموافقة من الحكومة .. والله قهر , وتحياتي للجميع"
archived = "2010-03-14"
capture_url = ""

