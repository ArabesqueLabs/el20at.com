subject = "تزوج من الخارج اذا تعسر من الداخل"
author = "ناصر ال الشيخ"
posted = "2008-09-20"
text = "يا أخوان ترا واللة الشغلة صحيح معقدة وصعبة لكن الخيرة فيما أختارة اللة لا يمللك أحد في الدنا بأن يفرض عليك شريكة حياتك هذى مجرد قوانين وضعية زائلة انا متزوج أجنبية والحمدللة عايش ومرتاح وما كنت أمللك الموافقة قدمت 6 مرات وأخذتها في الأخيرة ثضيف فتفرج لا تضيعون اوقت في التفكير تزوج بمن تحبه وترضاة ودمتم"
