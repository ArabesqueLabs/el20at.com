subject = "ش محمود رشوان خلف بريد خزان باسيوط"
author = "lamy"
posted = "2008-03-17"
text = "مسلسل الدالى قصة كويسة والمثيلين كويسين الاستاذ نور الشريف والاستاذة سوسن بدر والوجة الجديدة منهم دنياكان دورها مهندسا ومجوزها ابنى عمها لهو المثل احمد صفوت والمثل حسن الرارد كان دور ى مهندس وبشتغل فى شركة مع بيها بدل اخوه التوفى وهو المثل محمد يوسف كان دورى طبيى وكان مجوزى كان زميلى فى جامعة واحدة وكان بيحبة بعض جدا وهى المثلة مها نور الشريف والمثلة اتين عامر كان دورها معهد فنون جميلة وبتعرف على صحفى فى زروفى مش كويسة فى المستشفى وبعد كيدة حب بعض وطلبى ايديها من بيها سعد الدالى وكان بيكتب عن قصة حياة."
