author = "مصر فقر شاسع"
posted = "2009-10-04"
text = "هكذا جاء فى التقرير<br />مصر فيها فقر شاسع ------- والفقر حضانة جيدة لافكار التطرف والارهاب والسرقات والقتل والتحرش والاغتصاب وكل الموبقات<br />ما هى اسباب الفقر فى مصر ؟<br />انعدام وجود اى تنمية او مصانع انتاجية<br />فرئيس الدولة لا يفتتح مصانع انتاجية وانما يفتتح محطة مجارى وميدان فى شارع وكوبرى ورصيف على ميناء وكلها حاجات خدمية لا تعطى انتاج ولا توظف عمالة<br />وشوية مصانع الانتاج باعوها<br />يبقى الفقر هينتشر وبينتشر كل يوم<br />والبطالة بتزيد<br />وبكرة هتسمعوا ان الناس هتخطف السندوتشات من بعض والسرقات فى عز الظهر وعينى عينك<br />مصر فى حاجة الى الانتاج وليس الخدمات<br />فعمل مليون عيادة لاطباء تعالج مرضى لا ينتجون لا تضيف لاقتصاد البلد اى شىء<br />ومليون مكتب محامى لا تضيف للانتاج ولا الاقتصاد اى شىء<br />انما مصنع العاب اطفال باع مسدسات وبنادق بلاستيكية بتضرب الخرز باع لاطفال مصر فى عيد الفطر 3 ملايين لعبة وهو انتاج صينى اضاف لاقتصاد الصين عائد<br />لمحاربة الفقر لابد من الانتاج<br />انما يبقى الحال على ما هو علية<br />فكل سنة يضاف الى الفقراء اتنين مليون فقير مصرى<br />الفقر يخطط لة فى البلد دى"
archived = "2010-03-14"
