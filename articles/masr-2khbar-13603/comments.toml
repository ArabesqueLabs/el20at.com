posted = "2009-10-04"
text = "اي واحد في مصر عايز يعمل مشروع بتكون الفكرة الاساسية للمشروع ازاي تمص دم الشعب<br />يعني انا ممكن اعمل مشروع اكسب منه وافيد الناس<br />لا<br />المشاريع في مصر ازاي تمص دم الشعب وانت تبقا غني من دم الشعب<br />امثله<br />الاطباء<br />لما الطبيب يعمل مشروع بيفتح عياده او مستشفى خاص علشان خاطر يمص دم العيانين وهذا هو السبب لدخول كلية الطب<br />المحامين<br />بيفتحوا مكاتب يستغفلوا فيها زبائنهم ويضحكوا عليهم ويورطوهم<br />المدرسين<br />بيشتغلوا في الدروس الخصوصية ومص دم اولياء الامور<br />الممثلين<br />كل افلامهم ازاي الناس تيجي تتفر على الفيلم وتكسر شباك التذاكر لاكن الافلام هابسه وقائمة على الجنس<br />وعادل امام ومنى ذكي واحمد حلمي خير شاهد على ذلك<br />التجار<br />لحاجه اللي تمنها جنيه بتتباع بعشرة ناهيك عن الغش في المواد الغذائية<br />شركات المقاولات<br />قائمة اساسا على ازمة الاسكان واستغلال العباد ومص دمهم<br />الشركات العقارية والسماسرة<br />نفس الشيك<br />،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،<br />الموضوع طويل ويطول شركه"
archived = "2010-03-14"
