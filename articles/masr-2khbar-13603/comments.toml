author = "مش ححبك"
posted = "2009-10-04"
text = "مصر بلد فيه فقر شاسع<br />هكذا يقول المتحدث في المقال<br />لان الشعب المصري يعيش على بعضه او بعضه يعيش على دم بعضه<br />يعني في الخليج الناس عايشه على البترول<br />لكن في مصر مفيش غير دم الشعب المصري يعيش عليه الناس<br />فالناس يأكل بعضها بعضا في مصر<br />والفئة الغنية في مصر هي الفئة المنتصره وتعيش على دم المهزومين<br />الناس بتصحا كل يوم الصبح تنزل الغابه تعيش بعضها على دم بعض<br />فكما يقول الكاتب مصر بلد فيه فقر شاسع<br />لان الناس دول اصلا مهضوم حقهم الدولة واكله حقهم والناس واكلين وشربين دمهم<br />فمعندهمش اي امل للخروص من دائرة الفقر<br />لانهم متكتفين والطبقة الكبرى عايشه على دمهم"
archived = "2010-03-14"
