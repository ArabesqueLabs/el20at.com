text = "تجذبك الى الواقع الذي لا ندركه .. كثيرة هي حالات الخلط بين الحب والاعجاب باحترام<br />عادة حواء عاطفيه وكل شيء يؤثر بها حتى النظره والاهتمام<br />ولكن مالم افهمه هو لماذا كان ينتظرها ان تأخرت ويبادلها النظرات ان كانت مثل اخته<br />ام هي حالة الرجال ان ادرك ان الفتاة اهتمت له ادر موليا معتقدا انه محققا انتصارا بجذبها اليه؟؟<br />هاله .. اظنك وصلت لنقطه تمثل الواقع ولكن قلة قليله تفهم ماقصدتي ...<br />جميلة وبداية موفقه"
