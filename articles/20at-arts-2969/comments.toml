text = "بسم الله الرحمن الرحيم<br />اعتقد ان القصة فعلاً بسيطة جداً وارئعة جداً، نجد انها تمثل شئ واقعي وحدث بالفعل وهذا ما استشفه من القصة،<br />ومع الأسلوب البسيط وجدنا ان القصة هي كبداية للكاتبة شيء طيب ونروجوا مزيداً من التوفيق للأخت الكاتبة<br />مع مزيد من القصص التي تمس الحياة الواقعية."
