text = "البدايــــــة<br />***أحبت ولكنها لم تُصرح حتى لم تحدثه ولو لمرة..ولكنها تذوب فيه عشقا وهياماً..وهو أيضا كلما رآها صدفة نادتها عيناه..ونطقت بشوق وحنين<br />النهــــــاية<br />***أحمد : تعلمين أني أحترمك بشدة..وتعلمين أني كنت أعامل الجميع من أصدقائي وصديقاتك كأخوتي .<br />وفاء : أخوتك<br />أحمد : نعم<br />وفاء : ماذا تقول؟<br />أحمد : هذه هي الحقيقة .. وحتى أثبت لكِ، أنا كنت مرتبط بفتاة قبل أن أراكِ .. ومازالت علاقتنا قائمة .. يرضيكِ أن أتركها<br />هذا كان تعليقى على القصة<br />كيف احست به من قبل ان تعرف وتتاكد من مشاعره لفترة ليست بقليلة بتهيالى انها غلطانة وربنا معاها بقى"
