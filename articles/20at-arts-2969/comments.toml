subject = "قصة ضعيفة"
author = "ريما"
text = "اسفة يا هالة بس قصتك ضعيفة كتير... اولا الموضوع مكرر وتانيا انت اسلوبك بالكتابة ما بشدش وما شعرتش باي تعاطف مع البطلة اي اني محسيتش اني مندمجة مع هالقصة<br />اذا بدك نصيحتي حاولي تقراي اكتر.. اقراي اي قصص قصيرة او روايات بتقع تحت ايدك حتحسي لحالك باماكن الضعف بكتاباتك و على المدى الطويل بتقدري تكوني مخزون من الجمل و التعبيرات الي ممكن تفيدك بكتاباتك الي جاي<br />وهي نصيحة مجرب ..انا كنت قوية بكتابة القصص القصيرة و الخواطر ايام المدرسةو الجامعةوكانت مدرسات العربي بشجعوني كتير انمي هالهواية و السبب الرئيسي اني كنت قارئه نهمة بس للاسف بعد التخرج و صرت نادرا ما اقرا و شوي شوي بديت افقد قدرتي على الكتابة و هلا معنديش قدرة اكتب سطرين على بعض...فاذا كنت عندك رغبة اكيدة انك تكوني كاتبة قصة متمكنة ولو على سبيل الهواية حاولي تقراي كتييييييييييير<br />و بالتوفيق يا هلو"
