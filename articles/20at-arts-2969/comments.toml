subject = "شكرا"
author = "فيفي"
text = "عزيزتي هالة .. شكرا علي هذا الأسلوب الحيوي النابض بالحياة في توصيف مشاعر أبطال القصة ، و حسن اختيارك سواء للكلمات السهلة المعبرة ، والتي نقلت لنا بسلاسة ووضوح وصدق مشاعر كلا الطرفين بسكناتهم وحركاتهم وتعبراتهم . وصحيح القصة لها رسالة كبيرة جدا ، وهي أن اي انسانة لا يجب أن ترهن مشاعرها للمجهول ، أو للتمنيات ، كذلك أي انسان ، وإن داعب الوهم خياله فيجب أن يجعل في إطار الأمنية وليس قصة يعيش بها بكل وجدانه ولحظاته حتي تنقلب عليه عندما يكتشف الحقيقة نارا وندما لا يفيد .<br />ولا تزعلي من أي تعليق انتقد قصتك ، فكل تعليق ونقد مفيد ، والإنسان يظل يتعلم بالقراءة المكثفة وبآراء الناس الكثير والكثير ."
