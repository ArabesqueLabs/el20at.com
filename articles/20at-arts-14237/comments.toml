text = "مش فاهمة اية الضحك فى كدة<br />انا شايفة انة شئ جميل انهم يتجهوا فى اعلامهم نحو الاحتشام ولا هو العرى والابتذل اصبح اساس من اساسيات الاعلام<br />ياريت كلنا تتجة بأعلامنا نحو الاحتشام لان الاعلام دة هو اللى بيعبر عننا كبلد ومجتمع اسلامى<br />ومع احترامى لكاتب الموضوع (عمر ما كان الاحتشام والاتجاة الى الدين سبب للسخرية والضحك)"
