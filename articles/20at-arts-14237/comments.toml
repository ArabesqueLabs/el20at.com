author = "واحد وخلاص"
posted = "2009-12-03"
text = "سبحان الله<br />وايه المشكله ان الراجل عايزيهم يلموا نفسهم بدل العري واللبس اللي قالعينه ليل نهار دا<br />اينعم انا لا احب ايران<br />بس برضه الحق حق ولو عمله يهودي<br />بس طبعا بما ان الجريدة فرنسيه فعندهم دا صعب اوي انهم يحتشموا<br />طول عمر الغرب مبيفكرش غير باعضاءه التناسليه فقط<br />مش عارف ليه هو لازم عشان نتقدم نقلع المرأة هدومها<br />مينفعش نتقدم وهيه لابسه<br />سبحان الله<br />وشكرا لخفيف الدم اللي بيتريق وعامل عنوان الموضوع امنعوا الضحك<br />بس لو سمحت لو حضرتك بتأيد اختلاط النساء بالرجال وعري المرأة فلو سمحت اديني نمرة اختك .."
