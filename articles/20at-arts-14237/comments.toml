text = "عنوان المقال مستفز للأسف<br />كل ما ذكر من قرارات حسنة وجميلة ويا ليتها تتكرر فى كل برامجنا وقنواتنا<br />أنا بقترح عنوان امنعوا المسخرة<br />والمسخرة بالمناسبة كلمة فارسية معناها فوضى"
