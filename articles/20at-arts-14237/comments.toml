posted = "2009-12-03"
text = "بالرغم من أنا لاأحب إيران لأن فيها بعض الأنتهاكات لحقوق الأنسان<br />لكن بحترمها فى رغبتها بإنها تكون بلد قوية صاحبة سلاح نووى<br />وبحترمها بردك لأنها برغم أنهم شيعة بس عندهم الألتزام بمبادىء الأسلام جامدة أوى<br />حتى لو فى الأعلام ولايخافوا فى ذلك من الله لومة لائم<br />وفى الأخر يتكلم واحد زى صاحبنا ده ويشبه الالتزام والأحتشام ومنع الأختلاط كإنه منع للضحك ومنع لسعادة الناس.<br />وفعلا لوترضى الأختلاط لأمك أو أختك أو مراتك فياريت تبقى دتى المعلق الأولانى طلبه ومتنسنيش ان برده بنمرة"
