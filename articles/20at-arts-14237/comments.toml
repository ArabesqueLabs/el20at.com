text = "يعني عشان تحب الاحتشام وتشوف برنامج برائيك يكون(محتشم)لازم الناس الباقية تقعد قرفانة؟؟؟<br />لو مش عاجبك المسخرة اقفل التلفزيون او اتفرج على قناة الناس وغيرها من القنوات الدين<br />مش لازم تكون كل حياتنا كدة<br />لازم شوية حرية<br />شوفو الغرب وصلو لفين وعايشين حياتهم بفرح وحرية وسعادة ازاي<br />ليه ما نكون مثلهم؟؟؟<br />عجباكم ايران؟؟؟ روحو عيشو فيها بس بلاش رائيكم المتعصب دة"
