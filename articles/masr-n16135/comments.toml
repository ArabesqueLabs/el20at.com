[[comments]]
order = 0
subject = "علموهم سور القرأن القصيرة تدخل البركة بيوتكم"
author = "راجل محترم"
posted = "2008-06-04"
text = "تعليم البنات الرقص ولو حتى على سبيل المزاح والمرح - غير مقبول فبناتنا لسن غوازى<br />الغوازى والغجر هم من كانوا برقصون فى الافراح والموالد<br />المصريات لا يعرفن الرقص اطلاقا<br />زمان زرت قرية سنباط مقر الغوازى واظن انكم تذكرون فيلم غازية من سنباط فوجدت الغوازى ليسوا من سنباط وانما من كفر صغير بجوار سنباط يسكنة بعض الغجر ممن كانوا رحل واسمة كفر العرب<br />البنات الصغار لها العابها وعروستها وترسم وتلون وتلعب الحجلة وتنط الحبل وتحفظ ايات القرأن<br />علموا البنات الجدية واشغال الابرة"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091631/http://masr.20at.com:80/newArticle.php?sid=16135"

[[comments]]
order = 1
subject = "رقص الزوجة امام زوجها واهميته فى الحياة الزوجية"
author = "مش البراء اشرف ولا عبدالله الط"
posted = "2008-06-04"
text = "رقص الزوجة امام زوجها واهميته فى الحياة الزوجية<br />الهدف من رقص الزوجة اما زوجها تحقيق الاثارة الجنسية للزوج وأمتاعه عن طريق النظر إلى مفاتن زوجتهفى البداية هناك بعض الأمور المتعلقة برقص الزوجة لزوجها وسوف نناقشها جميعاً : أولاً : الهدف من الرقص أمام الزوج والفائدة التى تعود على الزوج والزوجة ؟ الهدف من الرقص : هو تحقيق الاثارة الجنسية للزوج وأمتاعه عن طريق النظر إلى مفاتن الزوجة<br />الفائدة التى تعود على الزوجين من الرقص : تحريك الدورة الدموية وذلك يرجع للحركة النشطة الناتجة عن الرقص<br />2- الاحساس بالبهجة والسعادة<br />3- الاحساس بالانوثة والثقة خصوصاً أمام الزوج ورؤية الزوج فى حالة الاستمتاع بالنظر إليها<br />- بالنسبة للزوج :1- الاستمتاع بالنظر إلى جسد الزوجة ومن ثم الاثارة<br />2- زيادة المحبة والرغبة فى الزوجة ذلك ناتج عن أظهار الزوجة لمفاتنها أمام زوجها أثناء الرقص<br />ثالثاً : المتطلبات التى يجب أن تراعيها الزوجة قبل رقصها لزوجها ؟بالنسبة للزوجة:1- اختيار الملبس المناسب للرقص : وضحنا من قبل الهدف من الرقص فى حد ذاته لذا يجب على الزوجة اختيار ملبس مناسب للرقص ليحقق الفائدة من ذلك، ويمكن للزوجة اختيار الالوان المناسبة وذلك يرجع لذوق الزوج والزوجة ولكن على العموم ينبغى أن يتوفر فى الملبس الذى سترقص به الزوجة شرطين هامين هما : 1- التجسيم : من المهم إظهار جمال الجسم أثناء الرقص ولذلك أحرصى أيتها الزوجة على تجسيم محاسنك والظهور بشكل مغري<br />2- وضع مكياج يحبه الزوج : وهذا ليس شرطاً للرقص ولكنه مفضل لإظهار الجمال العام<br />3- وضع عطر يحبه الزوج : وهذا ليس شرطاً كذلك للرقص ولكنه مفضل خصوصاً إذا كانت الزوجة ترقص بالقرب من الزوج (مسافة متر) فيشم الزوج الرائحة الطيبة للزوجة ويزيد من إثارته تجاها<br />وفى النهاية نوجه الحديث للزوجة ونقول:عليك بالاهتمام بموضوع الرقص أمام الزوج خصوصاً إذا كان زوجك يحب أن ترقصى له ويجب عليكى إجادة فنون الرقص المثير أثناء الرقص بشكل مميز ومثير للزوج"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091631/http://masr.20at.com:80/newArticle.php?sid=16135"

