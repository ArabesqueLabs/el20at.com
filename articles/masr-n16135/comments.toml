author = "مريم فتحى المسلمى"
posted = "2008-06-11"
text = "شى جميل ان المراة ترقص لزوجها ولكن مش من حقها ان ترقص لشخص غريب وان تظهر مفتنها امام الكثير من الرجال فهذا محرم وكيف يتركها زوجها تتعرى امام الكثير من الرجال وانها لا تكون لة لوحدة واعترض على ان لااب ان يشترى لابنتة بدلة رقص لغرض ان تكون راقصة فى يوم ما فهذا بدلا من ان يحفظها القران الكريم وان يحثها على لااخلاق الحميدة ان هذا الرجل جاهل دين وعقل ندعوا من اللة ان يهيدية هو زوجتة التى تطوعة فى هذا ربنا يهديك يارب ويسترها على اولادك وان تكون من هذة البنت البريقة من الزرية الصالحة قول امين"
