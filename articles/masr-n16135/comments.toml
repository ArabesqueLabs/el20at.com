subject = "النهاية"
author = "واحد"
text = "لما نزل الموت بالعابد الزاهد<br />عبد اللة بن ادريس اشتد علية الكرب<br />فلما اخذ يشهق - بكت ابنتة<br />فقال : -<br />يا بنيتى لا تبكى فقد ختمت القرأن فى هذا البيت اربعة الاف ختمة كلها لاجل هذا المصرع"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091631/http://masr.20at.com:80/newArticle.php?sid=16135"

