author = "اهم من الاعدام"
posted = "2009-06-24"
text = "يعدم او لا يعدم - مش مهم<br />المهم انة لم يقل لنا احد كيف كون هذة المليارات فى سنوات قليلة<br />لو كان هذا الهشام مصطفى دخل مغارة على بابا ومعاة اشولة وزكايب يعبى فيها الفلوس بكوريك لم يكن يستطيع ان يعبى المليارات دى فى السنوات دى<br />مفيش احد قال لنا كيف جمع تلك المليارات وازاى - مش نق ولا عايزين نبقى زية ولكن لان فية فى الشعب نصف الفتيات عوانس ونصف الشباب حتى سن 30 سنة بدون زواج والبطالة فى وسطهم اربعون فى المية<br />عصابة على بابا كانت عصابة ساذجة وطيبة وهبلة وبتسرق الياقوت والمرجان<br />انما عصابة الوطنى سرقت مستقبل الشعب المصرى"
