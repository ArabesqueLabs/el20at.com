subject = "الحسد"
author = "عادل"
posted = "2008-01-25"
text = "ومن شر حاسد اذا حسد<br />الحسد موجود فى القرأن وفى كل الكتب السماوية<br />انما اللى باقى من عصر الفراعنة ومنتشر من زمان فى الريف المصرى قبل الصحوة الاسلامية الحديثة - هى الخرزة الزرقاء اللى بتحطها المرأة الحامل على قورتها لاتقاء الحسد وابعاد الشياطين والعفاريت عن الجنين<br />وكمان النصابين اللى بيكتبوا احجبة لمنع الحسد والقر<br />ربنا يبعد عنكم جميعا الحسد والقر<br />لكن دلوقتى بعد الصحوة الاسلامية الحالية العملية دى انقرضت"
