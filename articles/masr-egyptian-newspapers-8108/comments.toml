subject = "أريد مزيد من المعرفة"
author = "SB"
posted = "2008-01-27"
text = "أرجو من يعلم بما سأقول أن يرسل لي المعلومة لإفادتي لو سمحتم وهي كالآتي<br />في القديم كانت لغة اهل مصر هي الفرعونية - هل كانت لغة منتشرة في جميع الأرجاء المحيطة مثل فلسطين والسودان وليبيا على الأقل - وكيف اندثرت هذه اللغة تماما - وهل معني ذلك أنه من الممكن أن تندثر اللغة العربية أيضا وهل من الممكن أن يكون سبب اندثار اللغة العربية مايتعامل به بلداننا العربية من لغات أجنبية واستخدامها معظم الوقت في كلامهم<br />أفيدوني لو سمحتم eg_honest@yahoo.com"
