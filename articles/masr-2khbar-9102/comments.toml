text = "يا ريس زودت المرتبات 30% يا ريس<br />والاسعار زادت 200$ ياريس<br />متاسفين يا ريس<br />بطلنا نعمل اضرابات يا ريس<br />خلاص حرمنا يا ريس<br />انت عارف يا ريس ان فيه ناس ما عندهمش دخل خالص يا ريس<br />زي الارامل والايتام والعجزه والمكسحين والخرص والصم والعمي والطرش<br />يا ه يا ريس<br />والمشردين واللي قاعدين في المقابر<br />مسكين يا ريس<br />حتفتكر مين ولا مين ولا مين"
