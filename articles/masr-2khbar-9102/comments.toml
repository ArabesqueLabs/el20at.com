subject = "حكمك تأبيدة"
author = "دينا خيرى"
posted = "2008-05-18"
text = "تأبيدة .............. تأبيدة ............... حكمك عدى التأبيدة<br />طهأنا خلاص م الحاشية خلاص والسنيدة<br />بعنا هدومنا ............ بعنا عيالنا ........بعنا كمان الحديدة<br />شد رحالك .......... لم جمالك ....... لم الاسرة السعيدة<br />امشوا وفارقوا ....... روحوا لديار تانية بعيدة<br />نشفت مصر ............ وغطى الفقر عهدى ومحسن وتفيدة<br />دقنا فى عهدك كل المر ..... واتغنى فى كل قصيدة<br />كل وعودك كدب فى كدب ما صدقت فى كلمة وحيدة<br />محروق وغريق بيدعوا عليك كل شهيد وشهيدة<br />فين العدل .. فين الانصاف قول ياكتاب قولى يا جريدة<br />مصر الحلوة عايزة تفوق .... تبدأها صفحة جديدة<br />ما فيهاش ظلم ولا استعباد ولا ايام سودة اكيدة<br />ولا فرعون .... يخلف فرعون ..... ننهى حكم التأبيدة"
