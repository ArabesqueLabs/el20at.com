subject = "رئيس الوزراء ووزير الاثتثمار والكل كليلة بيهيص ويق"
author = "محلل اقتصادى من منازلهم"
posted = "2008-05-18"
text = "فى مؤتمر مخفوس او دافوس او عريان بلبوص طلع علينا الكبير بيقول ان الاصلاح الاقتصادى جذب اثتثمارات ب 11 مليار فى السنين اللى فاتت<br />يا حلولى يا حلولى هيصوا يا عيال<br />برج من ابراج دبى بيتكلف ال 11 مليار<br />شركة طيران الامارات حققت ارباح 4 مليارات<br />انتم عارفين ال 11 مليار استثمارات دول فين<br />بعنا بهم ارض بناء فى المقطم لشركة اعمار واراضى فى الساحل الشمالى<br />وبعنا شوية بنوك ابتداءا من بنك الاسكندرية وانتهاءا ببيع مصانع الاسمنت<br />وبعنا شوية مصانع نسيج فى المنوفية لشركة هندية<br />وبعنا غاز لاسرائيل<br />مش هى دى الاثتثمارات<br />الشعب استفاد اية من كل دة<br />ولا حاجة<br />فية احد يعرف المليارات ال 11 دى اتصرفت فى حاجة تانية<br />يا حللولى يا حلاوة"
archived = "2010-03-14"
capture_url = ""

