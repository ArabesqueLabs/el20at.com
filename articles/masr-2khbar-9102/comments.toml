[[comments]]
order = 1
subject = "كلنا بنحبك يا ريس"
author = "منقول منتدى هريدي"
posted = "2008-05-18"
text = "حـاجــة جـمـيـلـة جــــدا<br />مــن الـريـس عايـزيـن ايــه<br />وبتنـهـشـو فلـحـمـه لــيــه<br />لــو واحــد منـكـم مـكـانـه<br />ينتـحـر م الـلـي هــو فـيــه<br />هــوا احـسـن ولا الاغـــراب<br />كلـه ياسيـدي خـراب فـخـراب<br />لـكـن حـايـش الـحـرب عـنـا<br />ومريحـنـا وعـيـشـة هـبــاب<br />سيبـو الريـس وراعـو ظـروفـو<br />ليـه حوالـيـه دايـمـا بتطـوفـو<br />دي كــل الامــراض مـسـكـاه<br />رعشـة وقلـب بيسـكـن خـوفـو<br />ووجـع الضهـر وذبحـة صــدر<br />و الـسـن اعــذرو و شـوفــو<br />لسـه لسانـكـو طـويـل وعنـيـد<br />و طــوارؤه بـايـن مــا تفـيـد<br />طـب استـنـو علـيـه واتـهـدو<br />هيدخـلـو حـديــد ف حـديــد<br />مـش خايفـيـن يــا ولاد الايــه<br />ومفـيـش حــد بتبـكـو علـيـه<br />طــب ابـنـي جـمـال ورايــه<br />شوفـو بـقـى هاتـقـدرو علـيـه<br />هـاورثــلــو هـاورثــلــو<br />لـو بسـتـو رجـلـي ورجلـيـه<br />هاتحبوني<br />==ولا لأه<br />علـى راسـكـو راح ادق الـدقـة<br />قـلـتـو انتـخـابـات وعمـلـنـا<br />ليـه واخداكـم تـانـي الحـرقـة<br />يـالــلا راح اولـــع فـيـكـم<br />حرقـة بحرقـة وغرقـة بغـرقـة<br />هاتحبوني<br />==ولا لآه<br />مـع الاعتـذار للشعـب المطحـون<br />انـا بـارضـه بامـثـل الشـعـب<br />بس اللي واخد قرشين او وظيفة حلوة<br />والـلــي عــلــي عــلــي<br />وجــزاكـــم الله خــيـــارا<br />مـــعـــذرة خـــيــــرا"
archived = "2010-03-14"
capture_url = ""

