[[comments]]
order = 3
subject = "الجواز هو الحل"
posted = "2007-12-17"
text = "طالما ما فيش جواز يبقى حنفضل كده على طول واتذكر هنا ابيات شعر اخذتها من مقال للاخت الفاضلة روضة عبدالحميد بتجسد الماساه ماساة عدم الزواج<br />وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه<br />يا حكومة والنبي شوفوا حل لمشكلة زواج الشباب<br />لان حراس الامن هما اللي سرقوا المبلغ علشان خاطر يتجوزوا بيه<br />عايزينك ترجعي تاني يا اخت روضة عبدالحميد"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214414/http://masr.20at.com:80/newArticle.php?sid=13461"

[[comments]]
order = 4
subject = "هو فية غيرهم"
author = "معاشر الحرامية"
posted = "2007-12-18"
text = "اللى سرق المليون من بيت الاخ بتاع الاخوان اللى جوة الحرز<br />واللى سرق الونش من ميدان التحرير<br />واللى سرق مليون البنك الاهلى<br />هيكون مين ؟<br />كبير قوى من بتوع مباحث امن الدولة ودى باينة لاى عيل صغير<br />لو واحد تانى زى الواد بلية وابو مطوة ودنجل والواد طفاشة واخوة الهجام وابن عمة عنتر وابو السباع<br />كانت نص بيوت القاهرة اتفتشت<br />وجابوا الحرامى فى اربعة وعشرين ساعة<br />وجابوا واحد يعترف انة هو اللى سرقهم<br />وانة صرف المليون على بنت رقاصة فى شارع الهرم<br />طبعا عندهم مؤلفين زى خميس فجلة فى الداخلية بيألف لهم مسرحيات وقصص ينشروها عند ابو حديد وابو صفيح وكتاب الحزب اياة<br />اللى سرق معروف وهو واحد من مباحث امن الدولة"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214414/http://masr.20at.com:80/newArticle.php?sid=13461"

[[comments]]
order = 5
subject = "الكبير مش دايما كبير"
author = "اكتب اسمك هنا"
posted = "2007-12-23"
text = "هذا التحقيق يثبت لنا أن بعض الشركات الكبيرة فى أى مجال أحيانا ما تتستر وراء اسمها دون التأكد بإستمرار من نزاهة العاملين بها و هذا ييؤكد مسئولية القائمين عليها سواء من ناحية إختيار العاملين بها أو توفير الظروف المادية المناسبة لهؤلاء الأشخاص ودورها فى الرقابة عليهم وكشف الإنحرافات البسيطة حتى لا يصل الأمر إلى سرقة بنك وانهيار سمعة شركة أمن كبيرة كما هو معروف عنها."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "مين سرق مين"
author = "dodo_speed"
posted = "2008-01-11"
text = "اولا كل الكلام ده كدب وغير صحيح لان فتحى التهامى كل عمله فى الشركه هوه تواجده داخل الخزنه الرئيسيه لاستلام وتسليم الشحنات ومش بيطلع من الخزنه تانى حاجه هوه لو كان عايز يسرق كان سرق ال50مليون كلهم مش مليون واحد وللاسف ان الكلام ده بيقولوه علشان يدارو على خيبتهم فى انهم مش عارفين يجيبو الى سرقو المليون و الاخ المحترم فتحى التهامى هوه مش اكتر من كبش فدى وده للاسف<br />انا كنت بشتغل فى شركه امانكو علشان كده اعرف كل الى شغالين هناك وللاسف برضه عارف ايه الى بيحصل فى الشركه كفايه ان اغلبيه المسئولين عن نقل الاموال مش معاهم سلاح يبقى ازاى ممكن يدافعو عن نفسهم مش هقول عن الشحنه الى بينقلوها يعنى مثلا فرع المنصورة وده الى كنت شغال فيه دلوقتى كل الى معاهم سلاح فى الفرع هما 5 افراد 3 سائقين وهما 1-محمد راضى 2-درويش عبداللطيف 3- ناصر فتحى فتوح<br />و1مشرف وهوه وائل معوض<br />و1 ادارى وهوه جمال هانى<br />مع العلم ان الفرع فيه 7 عربيات يبقى ازاى هيبقى فى كلعربيه على الاقل سلاح واحد ياجماعه ولله العظيم كنا ماشين بستر ربنا مش اكتر وده الى خلانى اقدم استقالتى لان مفيش امان فى الشركه دى ومجرد ان يحصل حاجه يبقى الى بينقل هوه الى حرامى وهوه الى خطط لسرقه الحاجه ولله العظيم ده حرام لو كان حد عايز يسرق يبقى هيسرق الفلوس كلها مش مليون واحد هل فى عقل يصدقحتى استخفاف بعقول الناس ال ان واحد معاه 50 مليون هيسيب ال50 ويسرق مليون ده ى بتقرء"
archived = "2010-03-14"
capture_url = ""
