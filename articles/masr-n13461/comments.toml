[[comments]]
order = 0
subject = "هو مين اللي سرق الونش"
author = "مش"
text = "انتو فاكرين الونش بتاع ميدان التحرير بتاع زمان ايام ما كانوا بيعملوا مترو الانفاق<br />ونش عملاق اتسرق من ميدان التحرير في وضح النهار<br />هو مين اللي سرق الونش"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214414/http://masr.20at.com:80/newArticle.php?sid=13461"

[[comments]]
order = 1
subject = "والمليون جنيه بتوع حسن مالك بتاع الاخوان"
text = "وفيه واحد من الاربعين اخوانجي اللي مع خيرت الشاطر المباحث لقت في بيته مليون جنيه وحرزتهم<br />وفي المحكمة جم يفتحوا الحرز ما لقوش المليون جنيه<br />مين اللي سرقهم"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214414/http://masr.20at.com:80/newArticle.php?sid=13461"

[[comments]]
order = 2
subject = "معزورين حراس الامن"
author = "ffeb"
text = "لازم تعرفوا ان فرد الامن دا انسان وعايز ابسط حقوقه الا وهي انه يكون عنده بيت ومتجوز"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214414/http://masr.20at.com:80/newArticle.php?sid=13461"

[[comments]]
order = 3
subject = "الجواز هو الحل"
text = "طالما ما فيش جواز يبقى حنفضل كده على طول واتذكر هنا ابيات شعر اخذتها من مقال للاخت الفاضلة روضة عبدالحميد بتجسد الماساه ماساة عدم الزواج<br />وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه<br />يا حكومة والنبي شوفوا حل لمشكلة زواج الشباب<br />لان حراس الامن هما اللي سرقوا المبلغ علشان خاطر يتجوزوا بيه<br />عايزينك ترجعي تاني يا اخت روضة عبدالحميد"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214414/http://masr.20at.com:80/newArticle.php?sid=13461"

[[comments]]
order = 4
subject = "هو فية غيرهم"
author = "معاشر الحرامية"
text = "اللى سرق المليون من بيت الاخ بتاع الاخوان اللى جوة الحرز<br />واللى سرق الونش من ميدان التحرير<br />واللى سرق مليون البنك الاهلى<br />هيكون مين ؟<br />كبير قوى من بتوع مباحث امن الدولة ودى باينة لاى عيل صغير<br />لو واحد تانى زى الواد بلية وابو مطوة ودنجل والواد طفاشة واخوة الهجام وابن عمة عنتر وابو السباع<br />كانت نص بيوت القاهرة اتفتشت<br />وجابوا الحرامى فى اربعة وعشرين ساعة<br />وجابوا واحد يعترف انة هو اللى سرقهم<br />وانة صرف المليون على بنت رقاصة فى شارع الهرم<br />طبعا عندهم مؤلفين زى خميس فجلة فى الداخلية بيألف لهم مسرحيات وقصص ينشروها عند ابو حديد وابو صفيح وكتاب الحزب اياة<br />اللى سرق معروف وهو واحد من مباحث امن الدولة"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214414/http://masr.20at.com:80/newArticle.php?sid=13461"
