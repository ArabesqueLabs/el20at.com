subject = "لما كل حاجة تبقى صح .."
author = "محمد جمال الدين"
posted = "2008-12-20"
text = "عايز ارد على الجملة دى \\\"مع أنى بدرس لغات زى الايطالى والانجليزى علشان أشتغل فى الإرشاد بس لازم أعمل دبلومة بعد التخرج، وده يعنى مصاريف تانى طب ليه الكلية متعملش فيها قسم للإرشاد السياحى \\\" .<br />مهو لما الحكومة تحط كل حاجة فى مكانها الصحيح .. يبقى هتستنزف فلوسك ازاى .. اعتقد ان الحكومة مش تايهة عن فين الصح وفين الغلط .. ولكنها بتبص لحاجة واحدة بس .. تجمع فلوس من العملية التعليمية ازاى .<br />وعلى لسانها كلمة واحدة \\\" مش أنت عايز ترتقى بمستواك التعليمى .. خلاص .. يبقى ادفع \\\"<br />مع ان المفروض ان الى عايز يرتقى بمستواه التعليمى الحكومة تساعده ولو بدعم مصاريف دراسته ."
