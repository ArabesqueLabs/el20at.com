subject = "فكرة رائعة - ولكن التطبيق صعب"
author = "ابو سعاد"
posted = "2008-10-26"
text = "موضوع التحرش لن ينتهى فى المستقبل القريب<br />لان جيل تربى وكبر فى المدارس بعد ان تم تهميش مادة الدين واختزلت محتويات المادة بحيث اصبح الجيل ذو مفاهيم خاطئة<br />لان الاباء والامهات يفرحون جدا عندما يتكلم طفلهم با الانجليزى ويحفظ الاناشيد الانجليزية ولا يحفظ ولا يعرف قراءة الفاتحة او قصار سور القران - عندما يكبر هذا الطفل سيضع ابوية فى ملجا العجزة كما نسمع او يكون عاقا او يطردهم من الشقة ليتزوج فيها<br />علموا اولادكم الكمبيوتر والانجليزى واتركوا تعليم الدين بعد ان ضحك عليكم الامريكان وقالوا لكم ان تعليم الدين يخرج ارهابيون<br />اشربوا تحرش واشربوا عدم تربية الاولاد"
