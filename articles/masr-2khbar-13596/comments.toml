text = "كل تصريحات السيد الوزير وردية<br />والسيد رئيس الوزراء تصريحاتة حمرا<br />وتصريحات الموميات والمحنطين معروف<br />انما الواقع حاجة تانية<br />بيتكلموا عن النظافة ومفيش حنفيات فى دورات مياة المدارس والعيال بتشخ على الارض<br />والزبالة اكوام امام سور المدرسة<br />بيتكلموا عن صابون ومواد نظافة ارسلت للمدارس ومفيش اى حاجة<br />بيتكلموا عن ملايين الكمامات ومفيش لها اى اثر<br />كلة كلام فى كلام<br />وكلة تصريحات فى تصريحات<br />مفيش اى حاجة خالص<br />يا هما بيضحكوا علينا يا اما بيضحكوا على نفسهم"
