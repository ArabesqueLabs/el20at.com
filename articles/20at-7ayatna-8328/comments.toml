text = "كالعادة .... مسلسل تسفيف شكل الملتزمين و جعلهم عبارة عن غوغاء لا يجيدون إلا المنظرة و لا يوجد عندهم أي آليات فكرية عقلانية<br />كل اللي بيربي دقنه و بيسمع محمد حسان و محمد حسين يعقوب بيتحول إلى كائن غبي , أو أنه كائن غبي و لذا سمعهم<br />هو ده تقريبا اللي عايزين تقولوه ...... مش كده ؟؟؟<br />على أي حال ولا بيهمنا ...... اللي عايز يعرفنا يناقشنا و يتكلم معانا<br />مش يتخيل خيالات زيه زي ( يوسف ) و يصدقها<br />ده ممكن نسميه ( العادة السرية الفكرية )<br />و حسبي الله و نعم الوكيل"
