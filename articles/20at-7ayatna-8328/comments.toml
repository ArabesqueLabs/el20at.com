text = "والله شعب معقد نفسيا يا عم انت وهو بصوا للمشكلة نفسها وبلاش شتيمة وبلاش كل واحد يعمل نفسه المدافع عن امة الاسلام يقول كلام ملوش فايدة<br />بصوا لأصل المشكلة ودوروا ع الحل مش كلام مفرغ من معناه وملوش لازمة<br />والاخين بتوع المبشر النصراني والملحد<br />جاتكوا نيله بليتوا البلد بتفكير عقيم<br />ايدكوا حمراااااااااااااااااااااااااااااااااااااااااااااا"
