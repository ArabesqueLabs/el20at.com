[[comments]]
order = 4
subject = "الحق والعتب على مدرس الدين ذاته !!!"
author = "محمد نواف الحمدالله ..."
posted = "2008-02-27"
text = "العتب على مدرس الدين نفسه .. يعني واحد كبير .. فاهم .. وواعي .. (( وناضج * )) .. وملتحي (( ولونو إنو اللحية مش أساس لكل واحد بدو يتطوع يعني بس يلا خلينا نوخذ المدرس الأهبل على قد عقلو الصغير التافه * )) .. المهم ..<br />وحكالهم للطلاب (( طبعاً طلاب الأول الإعدادي يعني صف سابع فقط !!!!!!! يعني مش بالغين أو ما اتحتلمو * )) .. وكمان شغله ثانية إنو المقرر اللي معطيهم إياه مش موجود من الأساس بالكتاب مش موجود بالأصل !!!!! فكيف بعطيهم إشي مش داخل منهم وولا هوه مطلوب منهم وولاحتى مقرر منهم .. شو ذنبهم . ذنبهم إنو المختل عقلياً استاذهم .. هوه المذنب الأول والأخييييييييييييييييييييييييييييييييييييييييييير وبس !!!! ...<br />يعني الغلط كلو من الشيخ !!!!!! .. قال شيخ قال . وبفهم قال .. ومطوع قال .. وملتحي وبخاف ربو قال .. أنا بقولو يا أخي خاف ربك عن حق وحقيق .. فا يعني الطالب صغير هاذ أولا ً .. ثانياً أكيد بدو يفكر بهيك شغلات مش منيحه ولا كويسه .. مادام مافي رعاية ونصح وإرشاد من قبل ذويه اللي همه أهلو (( أبوه أمو أخوه الأكبر منو عمو خالو خالتو عمتو .. المهم إنو يكون واحد كبير وفهمان وواعي صح يا أخوان .. والأفضل والأحسن إنها تكون من قبل الوالدين اللي همه زي ماحكيت أبوه وأمو اللي همه خلفوه وهمه قادرين على إنهم ينصحووووووووووووووووه )) .. فا المسكين قعد يفكر ويفكر ويفكر .. الخ<br />لحتى وصل لهاي المواصيل .. وصار يمارس العاده السرية .. وكان عندو خلاف مع واحد من زملائو .. (( على سندويشة طعمية * )) .. وعلى أثر هذا الخلاف راح بلغ المدرس (( اللي هوه من المفترض مايكون بسلك التعليم نهائياً أو حتى مايكون تبع دين وإسلام وشريعة .. لأنو ديننا الإسلامي ماحث على التعصب والغباء والضرب الغير مبرر من دون سبب !!! ))<br />فا المدرس (( الله يهديه فرجاه نجوووم الظهر والعصر كمان !!! * )) ... هاذ بدل ماينصحو ويخبر أهلو .. إنو صار كذا كذا مع ابنكو .. ولازم تتدخلو !!!<br />والله إنو المدرس حماااااااااااااااااااار وابن حمار كمان .. شو بدنا نسوي هاي هيه الدنيا فيها الحمير وفيها اللي بفهموووووووو ..<br />وياحسرة عليهم اللي بفهمو معدودين على الأصابع .. أما الحمير (( اللي زي المدرس * )) .. فاا هههههههه راحت عليهم وهمه كثار في واقعنا اللي بنعيشو ... أخ بس أخ يلا (( الله كريم ! )) والله يثبت علينا العقل يارب !<br />الله يهدي الجمييييييييييييييييييييييييييع .. آمين يارب العالمين<br />تحياتي ،،،"
archived = "2010-03-14"
capture_url = ""

