[[comments]]
order = 0
subject = "هذا كلام غير مقبول"
author = "علي"
posted = "2008-02-25"
text = "الانبياء عليهم جميعا الصلاة والسلام معصومون من الخطأ ومن الذلل ....هذه واحدة<br />الثانية أننا مأمورون أن نتأدب مع الانبياء ....<br />ونبي الله يوسف عليه السلام لم يفعل ما كتبه الكاتب ( يتراجع في آخر لحظة ) معنى هذا الكلام انه بدأ يخطو نحوها او يمسك يدها ولكنه قبل ان يقع عليها تراجع وحاشا لله ان يكون هذا سلوك نبي مرسل من عند الله ....<br />واقرأوا الآية كويس (ولقد همت به وهم بها لولا أن رأى برهان ربه ) ورد في تفسير ابن كثير: اختلفت أقوال الناس وعباراتهم في هذا المقام، وقد روى عن ابن عباس ومجاهد وسعيد بن جبير وطائفة من السلف في ذلك ما رواه ابن جرير وغيره، والله أعلم.<br />وقيل: المراد بهمه بها خطرات حديث النفس، حكاه البغوي عن بعض أهل التحقيق، ثم أورد البغوي ههنا حديث عبد الرزاق عن معمر، عن همام، عن أبي هريرة رضي الله عنه قال: قال رسول الله- صلى الله عليه وسلم-: يقول الله تعالى: \"إذا همَّ عبدي بحسنة فاكتبوها له حسنةً، فإن عملها فاكتبوها له بعشر أمثالها، وإن همَّ بسيئة فلم يعملها فاكتبوها حسنة، فإنما تركها من جرائي، فإن عملها فاكتبوها بمثلها\"، وهذا الحديث مخرَّج في الصحيحين.<br />وقيل: همَّ بضربها، وقيل: تمناها زوجةً، وقيل: همَّ بها لولا أن رأى برهان ربه أي فلم يهم بها.. حكاه ابن جرير وغيره.<br />فاتقوا الله في الانبياء<br />واعصموا السنتكم من هذا الذلل<br />وكلمة لادارة عشرينات<br />مش علشان اخلي ناس تقرأ اكتب الكلام ده ..... طب ايه رأيكم اكتبوا ازاي الشباب والبنات بتعمل العادة السرية وكمان الشذوذ والسحاق وجيبوا صور وهايكون الموقع ناااااااااااااااار<br />حررررررررررررررررررامى عليكم"
archived = "2010-03-14"
capture_url = ""

