text = "لا مش منصر<br />أنا شفت ليه كزا رد علي منتدي للملحدين<br />ورأيت كزا رد فيه علي مدونة شخص ملحد من الخليج وكان واضح من الرد انه صديقه جدا وواخدين علي بعض<br />وأنا متابع مدونته من فتره كبيره وكلمته مره ع الايميل وكان بادئ الكلام كويس وبعدين بدأ ياخدني براحه لبوابة الالحاد واللادين<br />بجد خلوا بالكم يا جماعه ده مش سهل"
