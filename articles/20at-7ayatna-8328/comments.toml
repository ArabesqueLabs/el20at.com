[[comments]]
order = 7
subject = "ما هذا؟!!!!"
author = "نورة"
posted = "2008-02-27"
text = "لا اعرف ما الفائدة من هذا المقال او المدونة ...<br />كيف سمحتم بهذا المقال بالمرور على موقعكم؟ أيعقل ان موقع عشرينات الذي هو جزء من اسلام اون لاين الذي من المفروض انه موقع اسلامي يسمح بمثل هذا التطاول على الانبياء أولا ثم على شخصية المعلم ومدرس التربية الدينية؟!<br />يعني هل كل مدرسي التربية الدينية بمثل هذا المظهر الموجود في تلك القصة الغريبة؟ أي تطاول هذا على المتدينين؟ !!<br />وبعد كل هذا نعتب على الغرب الذي يسيء للإسلام ونغضب من الرسوم المسيئة للرسول الكريم؟<br />ماهذا الذي فعلتوه بأنفسكم يا موقع عشرينات؟<br />كنت من أشد المتابعين لكم ولكني انقطعت بسبب تردي مستواكم وانسلاخكم عن الإسلام . وقد قلت لنفسي اليوم ارى ما اخبار عشرينات فإذا بي أفاجأ بهذا المقال!<br />فالأعد الى المقاطعة اذن.<br />يا خسارة عليكم."
archived = "2010-03-14"
capture_url = ""

