author = "محمد ممتاز - بيبو"
posted = "2007-05-24"
text = "النادى الاهلى بمقدوره ان يتوج بلقب اكثر اندية العالم فى التاريخ حصدا للبطولات فهو فى المركز الثانى الان خلفا لرينجرز الاسكتلدنى الحائز على 106 بطولة و الاهلى بمقدوره خلال عامان ان يدمر هذا الرقم كما اعتدنا من الاهلى<br />و على الزملكاوية انهم يشيلوا اللى وقع منهم اصحاب ال 58 بطولة منها 11 دورى .. روح يا شيخ اللهى يسترك ده احنا 32 بطولة دورى"
