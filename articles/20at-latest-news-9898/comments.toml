text = "صحيح، وكما يقولون بان الجمال جمال الروح والقلب، ولكن أيضاً الشكل الخارجي يلعب دوراهام كما يفعل الروح والقلب ..<br />على الأقل ( للإناث فقط ) ، أما بالنسبة للذكور فهم بلا شك عقولهم هي التي تحدد كل شيء بهم وغير ذلك لايهم إطلاقاً .. لأن الرجال مخابر مو مناظر !! وإن الله جميل يحب الجمال !!<br />شكراً"
