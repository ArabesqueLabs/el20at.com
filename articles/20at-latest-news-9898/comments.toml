order = 0
subject = "وما الجمال الا جمال الروح"
author = "هايدي"
posted = "2008-08-19"
text = "ولدت وهي مهضومة الحقوق فهل ستموت وهي مهضومة الحقوق...رسول انصفها ...وحقوقها منحها ...فلماذا تعودون بتلك الاله التي تهضم الحقوق لا بل تسحقها نعم لنا الحق بان نتعايش الحياة مع من هم مثلنا (بشر )فلا فرق بين عربي ولا اعجمي الا بالتقوة....وليس لذي لون حق على ذي لون انما نحن اخوة ...انعم الله علينا فما الجمال ما لم تكن هناك نعمة العقل ...من منا يرضى بأن تكون هنالك مدينة لبعض النساء منعزلات عن غيرهن بحجة الجمال ...وما الجمال الا نعمة من الله ولكن ما من مخلوق كامل ..ليس الجمال وحده يدل على الكمال فما الكمال الا لله وحده لا لاحد من عباده..(والقلب وما يعشق)..ما اجمل هذه العبارة التي تتردد على السنتنا فما من احد لا يدرك معناها ...<br />والسلام عليكم ايها الكرام<br />مع تحياتي:هايدي"
archived = "2010-03-14"
