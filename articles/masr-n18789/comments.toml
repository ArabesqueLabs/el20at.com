subject = "والله حرام"
author = "مونى"
text = "يعنى ده لما يقف قدام ربنا ويحسبه يكون اخر حاجه عملها ف حياته والحاجه اللى مات بسببها هو ماتش كوره والله حرام<br />اللهم احسن خواتيم اعمالنا"
