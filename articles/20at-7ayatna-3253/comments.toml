text = "السلام عليكم<br />شباب المغرب ربما كباقي الشباب العربي<br />يتحدثون عن الحب وقرناؤهم امام البرلمان يتضورون جوعا فأي حب في زمن البطالة؟<br />الطرح والاسلوب موفق ولكن نريد مواضيع اكثر التصاقا بهمومنا نحن الشباب"
