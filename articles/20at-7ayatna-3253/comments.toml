[[comments]]
order = 2
subject = "الحب لا يتغبر"
author = "احمد اسعد"
posted = "2007-09-26"
text = "الحب لا يتغير بتطر التكنولوجيا من حيث الجوهر لان المشاعر الحقيقة لا يمكن التلاعب فيها كالعضلات الارادية ولكن بحكم الظروف الاقتصادية الصعبة والاجتماعية المعقدة وغالبا التخلف والموقف السلبي من علاقة المراة عاطفيا في المجتمعات العربية التخريم والتخليل للرجل نجد البعض بسبب هذه الظروف يلجا للتكنولوجيا من اتصال وانترنت وغيرها بهدف التسلية وتضيع الوقت ويلاحظ ان الذين يعانون من البطالة ولطلبة هم الاكثر توجه نحو اقامة هذه العلاقة الالكترونية ولانه اساسا غير جاد تنتهي التجربة بالفشل لانها غالبا ما تكون قائمة على معايير ومواصفات عن بعد غير صحيحة فلا تصمد العلاقة امام الواقع العملي اما التجارب النابعة من الاعماق والصادقة فغالبا ما تنج والشواهد كثيرة على ذلك."
archived = "2010-03-14"
capture_url = ""
