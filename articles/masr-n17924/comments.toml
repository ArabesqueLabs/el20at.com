[[comments]]
order = 14
subject = "لامعونه ولايحزنزن"
author = "عاطف محمود"
posted = "2009-01-11"
text = "الى متى نمدايدينا ونقول لله يامحسنين لله امتى نعتمدعلى قدراتنا نحن اغنى من امريكا واوروبا واسرائيل ارضنا كلها خير بس للاسف مافيش ضمير وكما قالوا فى الامثال بتاعة زمان من لم يمتلك قوته يستاهل موته او من اعتمد على غيره يستاهل اللى يجراله نحن دوله زراعيه يجب ان نعود للزراعه تانى وخاصه القمح لاننا كن اكتر دوله فى العالم فى زراعة القمح الله يرحم زمان وايام زمان ولايوم من ايامك يابسطويسى افندى"
archived = "2010-03-14"
capture_url = ""
