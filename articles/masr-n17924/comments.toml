[[comments]]
order = 0
subject = "موافق جدا"
author = "واحد من الناس"
posted = "2008-10-16"
text = "طبعا أوافق على المعونة الأمريكية لمصر فهذه النقود ليست معونة كما نسميها و إنما هى حق مصر بعد أن كلفتها السياسة الأمريكية الكثير من نفوذها و قوتها و حضورها فى الشرق الأوسط .<br />و فى رأيى أن المعونة إنخفضت لأكثر من سبب أهمها عدم إلتزام النظام المصرى بالديموقراطية و تقلص مساحة الحرية بشكل كبير بعد صدور قانون الإرهاب و ترسانة القوانين المقيدة للحريات"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070757/http://masr.20at.com:80/newArticle.php?sid=17924"

[[comments]]
order = 1
subject = "اوافق على استمرار المعونة الامريكية - لماذا ؟ لان"
author = "انا"
posted = "2008-10-16"
text = "صدقونى<br />كل مدرسة تبنى فى اى قرية فى مصر بفلوس المعونة الامريكية<br />وكل محطة مياة تبنى فى اى مكان فى مصر معظمها من المعونة الامريكية<br />وكل الطرق التى ترصف وبالذات فى الصعيد هى معونة سعودية وكويتية<br />وكل محطات الكهرباء بتبنى بقروض من طويلة الامد من البنوك العربية الخليجية<br />دور الحكومة عندنا بس ان الريس وابن الريس بيروحوا يفتتحوها<br />للاسف دى حقائق اى طفل عارفها<br />يبقى نعرف حجمنا - شحاتين وعايزين نتعنتظ على اية<br />احمدوا ربنا"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070757/http://masr.20at.com:80/newArticle.php?sid=17924"

[[comments]]
order = 2
subject = "اوافق ولكن .."
author = "مواطن مصري"
posted = "2008-10-17"
text = "يجب ان يشعر المواطن المصري بهذه المعونه في اي شيء مادي ومحسوس وليس في التصريحات والجرائد"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070757/http://masr.20at.com:80/newArticle.php?sid=17924"

[[comments]]
order = 3
subject = "بالمعونة نحيا وبالمعونة نموت"
author = "بتلمونى لية"
posted = "2008-10-17"
text = "عشانا عليك يارب<br />اللة يرحم ايام زمان وليالى زمان لما كنا فى مصر بنعطى مساعدات<br />انما ببركة بتوع الضربات انضربنا فى مقتل واصبحنا نتلقى المساعدات والقروض والهبات<br />وانا اقترح ان يكون عندنا وزير لوزارة اسمها وزارة المساعدات والهبات والمنح وشعارها واحد شحات وماسك عصاية"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070757/http://masr.20at.com:80/newArticle.php?sid=17924"

[[comments]]
order = 4
subject = "الحكومة بشحت ولا بتترشى عشان تسمع كلام امريكا حتى"
author = "ياسر الامين"
posted = "2008-10-24"
text = "المعونه بقالها اكثر من ثلاثون عام ولم نتعلم شئ فمنذ ثلاثون عاماً والحكومة بتشحت على الشعب والشعب لا حول له ولا قوه فماذا فعلت الحكومة خلال الثلاثون عاما سوى المطالبه بزيادة المعونه بفكر اعطنى سمكة بدلا من ان تعلمينى اصطاد فهل هذا من اجل الشعب ام من اجل انفسهم وامريكا تعطينا هذه المعونه ليس لسواد اعيننا بل لكى نسمع الكلام ونبقى فى تخلف وجهل حتى نظل اجيال واجيال تشحت من امريكا وهى تفرض علينا ما تريده فمتى نتعلم ان نصطاد السمك فمن ليس بيده طعامة فليس بيديه قراره"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103035/http://masr.20at.com:80/newArticle.php?sid=17924"

[[comments]]
order = 5
subject = "معونة اية اللى انت جاى تقول علية"
author = "تحتمس"
posted = "2008-10-27"
text = "المعونة دى بتتصرف بقالها اكتر من تلاتين سنة فى منتجات امريكية باسعار مضاعفة وجودة سيئة للغاية خد عندك مثلا مية مليون دولار لتنمية الريف ومكافحة الخلفة ومية مليون لمكافحة حرق القش وذلك بانشاء مكابس ومصانع لتوضيب القش وحرقة مجددا ومية كمان يجيبوا فيها ادوية لعلاج مرضى حرق القش وشوية سلاح قديم الانتاج المصرى افضل منة والمقابل ياسادة باكرام هو تحجيم دور مصر واضعافها بالمعونات لانة كل حاجة بيوصل ليها لدعم بتبوز يعنى النسل والخلفة بتزداد كل سنة عن اللى قبليها وهلم جرة على بقية بنود صرف المعونة المشؤمة وفى الاخر عاوز اقول واللة العظيم انة مصر فى غنى عن المعونة دى بالذات لانها متبوعة بمن واذى علينا اكتر من نفع"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103035/http://masr.20at.com:80/newArticle.php?sid=17924"

[[comments]]
order = 6
subject = "اوافق وبكل مااوتيت من قوة على المعونة"
author = "كوسة"
posted = "2008-10-27"
text = "لانة بكل بساطة كل دولار مصروف على مدرسة اوطريق اوغيرة هما اللى بيشرفوا على التنفيذ وبيستلمواالمشاريع ويدفعوا للمقاول بدون فرض اتاوة اورشوة لتسليك المسائل اواخلال بالمواصفات لتوفير قرشين من المصلحة"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103035/http://masr.20at.com:80/newArticle.php?sid=17924"

[[comments]]
order = 7
subject = "المعونة الاميريكية لمصر حق لنا و ليست هبة؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-30"
text = "اوافق على المعونة الاميريكية لمصر<br />انها حق اصيل لنا<br />أشمعنى اسرائيل يعنى؟<br />هى أسرائيل احسن من مصر ولا اية؟<br />ما بلاش تلاعب و رقص على الوتيرة المريضة(وتيرة الشيوعية الغير مأسوف عليها)<br />يا عالم افيقوا رحمكم اللة؟"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103035/http://masr.20at.com:80/newArticle.php?sid=17924"

[[comments]]
order = 8
subject = "اوافق و اوافق و اوافق و لية ما اوافقش؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-10"
text = "حقا اوافق على اللى تسمى معونة؟<br />و لية ما اوافقش<br />و اللة لو كنت مسئول لقبلت اية معونة من اى دولة او نظام؟<br />ولا يهمنى سواء كانت معونة من امريكا او اوروبا او حتى (أسرائيل)<br />طالما كانت من اجل مصلحة الشعب المصرى؟!<br />فسوف أقبلهاااااااااااااااااااااااااااااااااااااااااااااااااو لية لا اقبلها؟<br />من من اجل مصر و رخاء شعب مصر فانى اقبل اى مساعدة حتى و لو كانت من الشيطان؟<br />ما كل العالم المتحضر بيتقبل المساعات؟و لية لالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالا نتقبلها نحن كمان و كمان!!!"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103035/http://masr.20at.com:80/newArticle.php?sid=17924"

