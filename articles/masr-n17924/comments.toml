text = "ومفيش مانع انة جمال يدى المدعو حسين كامل شوية فكة من المعونة لزوم سداد فواتير موبايل وانترنت علشان يبقى مدافع صلب ولعيب كبير وفنان فى الدعاية والبكش يمكن يبقى محظوظ فى يوم من الايام ويبقى نصيبة فى المعونة دى وغيرها محفوظ"
