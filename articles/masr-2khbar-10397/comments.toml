[[comments]]
order = 4
subject = "الجلد عقيدة القضاة السعوديون"
author = "ضحية الجلادين قضاة السعودية"
posted = "2008-12-15"
text = "جلد الاطباء الاجانب عقيدة القضاء السعودي<br />قضيتي ظلمت ولم أجد من يقف بجانبي لأني لست في بلدي هذه هي الحقيقة ولا غير ذلك وإذا ثبت أن ما أقوله غير صادق فيه وغير صحيح استحق كل ما حدث الظلم الذي لحق بي على يد الشرطة والقضاء السعودي امر عظيم<br />أنا طبيب أردني الجنسية تعاقدت مع وزارة الصحة السعودية بتاريخ 1980ـ ومنذ ذلك التاريخ وأنا اعمل في مستشفى الأطفال في محافظة الطائف ولدي أحفاد وأبناء معظمهم ولد وتربي وتعلم في المملكة<br />منذ 12 عام عملت الطبيبة هدى علي دحلان معنا في مستشفىالاطفال بالطائف حضرت الي مكتبي بالمستشفى في قسم الحضانة وبكت وقالت اريد اطلب منك مساعدة لأني اعرف انك إنسان تخاف الله واخ كبير لنا في المستشفى وإذا لم تساعدني لن تضرني وطلبت مني مساعدتها في عمل عملية ترقيع بكارة في مصر ( طلبت مني لاني أعيش في مصر وزوجتي وابنائي مصريون) وقالت لي أنها غلطت مع زميلها حين كانت طبيبة تدريب في مستشفى الهدا العسكري بالطائف وحكت لي قصتها معه بالتفصيل واستمرت معه في علاقة سيئة ثلاث سنوات وقالت لي عن اسمه وهو ألان يعمل في مستشفى الرياض العسكري استشاري قلب ثم حكت لي عن غلطها مع زميل أخر في الرياض عندما ذهبت للدراسة العليا وحكت قصتها معه وعملت معه علاقة سيئة فترة طويلة وهو الأن في منصب كبير في وزارة الصحة واعرف اسمه وأعطت أدلة على علاقتها معه وعادت للطائف وما زالت على علاقة معه ولدي الدليل وعملت علاقة مع زملاء آخرين هذا اقسم بالله العظيم اعترافها بلسانها والله شاهد على ما أقول ولدي ادلة ثم قالت تريد أن تتزوج ولا تستطيع الزواج لأنها ليست عذراء وقالت سوف تذهب مع أبوها لمصر عندها قلت لها أرجوك أنا لا استطيع مساعدتك في شيء وقالت انت عرفت سرى والحت في طلبها لكني رفضت ووعدتها بالستر إلى يوم الدين وهذا ما حدث لم افتح فمي عنها لأي بشر طوال 12 عام ولم اخبر احد بما قالته واقسم بالله زوجتي لم اخبرها بذلك لأني أردت الستر عليها والله شاهد على ذلك حتى زوجتي وابنائي لم يعرفوا عنها شىء لاني رجل كبير ولدي بنات وأحفاد وبعدها نقلت لمستشفى الملك عبد العزيز التخصصي بالطائف قسم الحضانة حيث تعمل حاليا<br />1- مسك الختام وجزاء للاحسان تقدمت الطبيبة التي كانت تعمل معي وهي سعودية جاوية الأصل بشكوى ضدي تتهمني بإرسال رسائل جوال ورسائل خطية اشتمها وأشهر بها فوجئت بشكواها ضدي بعد 12 عام لا اعلم من أرسل لها الرسائل ومعارفها كثيرون جدا وكلهم سعوديون تخاف أن تتهم احد منهم وهي ليست سعودية أصلية وكانت تقول لي انا اخاف اكلم احد منهم او اطالبه بالزواج وقال لها العشيق الثاني عندما طالبته بالزواج انت 110 فولت يعني غير سعودية الاصل ورفض الزواج منها وبقية من عرفتهم عاملوها بنفس الطريقة 2- تم توقيفي في مركز شرطة النزهة وعوملت بطريقة سيئة الواسطة كانت كبيرة من أهل الشاكية أخوها أنس علي دحلان يعمل في وزارة الداخلية فني تحاليل مخبرية وأخوها صيدلي نائل علي دحلان مساعد مدير الشئون الصحية للتموين الطبي بالطائف وغيرهم الكثير وأنا أجنبي اخبرت محقق الشرطة ورفض الاستماع لي ورفض تسجيل اي كلمة في المحضر عن علاقاتها وهددتي بالموت ولم يسأل الطبيبة حرف واحد عن الحقائق التي اخبرته بها شفويا وذكرت له اسماء الذين مارست معهم ورفض المحقق تسجيل ذلك في محضر التحقيق ولم استطع أن أضع هذه الحقائق امام القاضي لآنه رفض الاستماع لي ومستعد لكشفها ألان كان المحقق يكتب ادانة قذف ضدي فقط ولا يهمه أي شيء اخر لا يريد ان يسمع الحقيقة لان الامور سوف تنقلب عليها وعلى من مارس معها وهم في مراكز هامة في وزارة الصحة. 3- وتحت التهديد والوعيد وبعد إن أصبت بنوبة قلبية أثناء التوقيف من سوء المعاملة ورميت في غرفة مع عدد كبير من الموقوفين لا نعرف كيف ننام وحمام مكشوف وقذارة وأدخلت العناية المركزة في مستشفى الملك فيصل بالطائف وانأ أعاني من مرض بالقلب وملفي موجود في المستشفى أجبرت على التوقيع علي محضر الشرطة الملفق ولم أقراء ماكتب فيه ولم يسمح لي بالقراءة وقلت ذلك للقاضي ولم يهتم .<br />4- تم تفتيش شقتي من الشرطة وتحطيم محتوياتها والعبث بها ودس لي رسائل مطبوعة تتهم الشاكية بالعلاقات السيئة . الأمر مرتب له تماما من الضابط المحقق الذي كان متامرا معها بدون ادنى شك وهو الذي لفق القضية كلها ضدي من اولها لاخرها كل هدفه التغطية عليها ومارس ضدي كل انواع الاسائة وكانت تحضرله المكتب وتم تزويجها بسرعة حيث لم يسبق لها الزواج وعمرها 50 عام والهدف اخفاء الحقيقة خوفا من الكشف الطبي عليها إذا ذهبت للمحكمة التي اعدوا لها<br />5- ومنعت من التحدث لأي شخص طوال أربعة أيام مدة توقيفي الأولى في مركز شرطة النزهة وأهلي وزملائي وأقاربي لا يعرفون عني شيئا لو كنت إرهابيا ما عوملت بهذه الطريقة البشعة التي تتنافي مع ادني حق من حقوق الإنسان .<br />6- أنا بريء مما نسب إلي من تهمة وما جاء في ملف التحقيق من اعترافاتي لا تمت إلى الحقيقة بصلة وقهرت على التوقيع وأنا أجنبي ورجل كبير ومريض لم استطع الرفض وعدم التوقيع وخفت على حياتي المذهل في ماحدث لي ليس تجنيها علي فحسب بل الالم الاعظم ما فعله المحقق والادهى والامر القاضي<br />8- أطلق صراحي بكفالة سعودي وبتحريض من شقيق المدعية نائل علي دحلان الذي يعمل مساعد مدير الشئون الصحية للتموين الطبي نقلت من مستشفى الأطفال بالطائف إلى مستشفى السحن بني سعد على بعد70 كم<br />9- أحيلت القضية إلى المحكمة الجزئية بالطائف بعد خمسة أشهر وحددت جلسة الحكم يوم 18/8/1427هـ قضية رقم 120/2 والقاضي لا أقول فيه إلا حسبي الله ونعم الوكيل إلى يوم الدين كان خصما وليس قاضيا . ونسي أن الظلم ظلمات يوم القيامة لم يكلف نفسه سؤال الشاكية سؤال واحد لانه يعرف الحقيقة ويريد تغطيتها . كان والد الشاكية وزوجها يجلسون ساعة كاملة في غرفة المدعي العام قبل الجلسة فهو صديق لهم وفي الجلسة كان يهاجمني وهدفه الحصول على حكم يخدعون الناس به وتلبيس القضية لي وكنت كبش الفداء لأني اجنبي واذا استطاع أهل هذه الطبيبة وهم يعلمون كل شيء عنها خداع الشرطة او تواطئوا معهم وخداع القاضي أو تواطىء معهم فإنهم لن يخدعوا الله عز وجل<br />10- أحضرت الشرطة شاهدات زور صديقات للشاكية دون علمي ولم اخطر بهن وفوجئت اثناء الجلسة بقول المدعي العام ان هناك شهود زميلاتها قلت للقاضي احضرهن ولم يلتفت لي ولم يستدعيهن لسماع شاهدتهن بنفسه ورفض احضارهن وبني حكمه على شهادتهن واعترافي القهري وأخبرته بأني اعترفت تحت التعذيب فما كان منه إلا الاستهزاء بي وحين خرجت سالت احد الشاهدات بالتلفون لماذا شهدت زورا قالت جضرت لي المدعية وهي صديقتها واخذتها من العمل في مستشفى الاطفال في سيارتها الى قسم الشرطة وسالها المحقق سؤال واحد ولم تجب عليه وسكتت وخوفوها بترحيلها لا نها اجنبية فهزت رأسها فقط وقالوا لها اياك ان تخبرني وفعلا خافت ولم تخبرني<br />11 – حكم القاضي علي حكما كان وباعتراف الكثيرين من أهل الخبرة والقانون حكم مجحف وجائر في حقي وانصب على التغطية على الحقيقة لصالح الطبيبة اعتمد القاضي على كتابته الضابط المحقق الباطلة و حكم بالجلد 80 جلدة بحد القذف والسجن سنة والجلد مائة جلدة على دفعتين وترحيلي من المملكة وعدم دخول المملكة كل هذا حق عام وقال للخصم أنا أعطيتكم كل شيء القاضي لم يسالني حرف فقلت له انت لم تسألني ولم تستمع لحرف مني فقال تكلم ودار نفسه واخذ يقلب اوراق على مكتبه قلت له انا في ذمتك الى يوم الدين والله يعلم خائنة الاعين وما تخفي الصدور فرد فورا وقال بس بس ومنعني من الكلام قلت ان الشرطة اجبروني على الاعتراف تحت التهديد ورموني على البلاط اريعة ايام دون اكل اوغطاء فقال مستهزءا تريد يحطولك سرير ثم نطق بحكمه المعد مسبقا وقال موافق هزيت راسي بلا وقلت بصوت عالي يا الله وطلب من العسكري اخذي لقسم النزهة وقال لي سوف نبعث القضية لمحكمة التميز هل تريد لائحة ام لا قلت له نعم قال تقدمها غدا وانا بعد غد اجازة 50 يوما واذا لم تحضرها سوف نرفعها بدون لائحة وهذا كان مخطط له ان لا استطيع تقديم لائحة وتذهب القضية للتمييز بدون لائحة حتى يصدق عليها التمييز<br />13- إعدت اللائحة الاعتراضية من المحامي في اليوم التالي لجلسة الحكم يوم 19/8/1427هـ ذهب اخي في صباح اليوم التالي بها للقاضي رفض استلامها كنوع من التعطيل وقال له أين المحامي ذهب اخي واحضر المحامي فقال له اين التوكيل لك من المتهم فطلبوا منه احضاري من القسم لعمل توكيل واحضروني وعملت توكيل له وقال المحامي للقاضي لماذا سجنته اولا الحكم ابتدائي ورفضه ولم يرسل الى التميز بعد ولديه كفيل قال له مصلحة القضية قال له اخي اذا رفضت محكمة التمييز الحكم ما الموقف فقال القاضي لاخي انا لو اعرف ان التمييز سوف يرفض الحكم 1% كنت ماحكمت في ذلك قال له اخي افرض قال القاضي ضعوني في السجن مكانه حاول المحامي لاطلاق صراحي فاذا القاضي يقول له اسكت والا وضعتك معه .ولو لم اقدم اللائحة في ذاك اليوم لخرج القاضي في اجازته ولن استطيع تقديمها لاي قاضي اخر وسوف ينتهي مدة الشهر المسموح به بتقديم لائحة الاعتراض وسوف ابقى في السجن لمدة سنة كاملة وهذا ما خطط له القاضي والشرطة لكن الله خيب تخطيطهم ورفعت القضية للتمييز في مكة المكرمة ونقضت القضية لكني بقيت في السجن 50 يوما حتي عاد القاضي من اجازته ورفض رئيس المحكمة الامر بخروجي وقال هذا اختصاص القاضي الذي اصدر الحكم ورفعت برقية لوزير العدل فرد متأخرا<br />14- تقدم المحامي بمذكرة لإخلاء سبيلي بكفالة ورفض القاضي وقال المحامي للقاضي أن الحبس جاء مخالفا لما نص عليه النظام والاجراءات الجزائية في الباب التاسع تحت عنوان (الأحكام الواجبة التنفيذ ) حيث جاء في المادة 215 من هذا النظام ما نصه ( الاحكام الجزائية لا يحوز تنفيذها الا اذا اصبحت نهائية) وأن الحكم ابتدئي ولم يكتسب حق التمييز النهائي والحبس ليس له مبرر اطلاقا طالما أن لي كفيل حضوري وجواز سفري محجوز لدى وزارة الصحة ومعروف بانه لا تصبح الاحكام الجرائية نهائية الا اذا اكتسبت القطعية باقتناع المحكوم عليه او تصديق الحكم من محكمة التمييز او مجلس القضاء الاعلى إذا اعترض عليها والحكم الذي أصدره القاضي كان ابتدائيا غير نهائي إذن فان الحبس يتنافى ويتعارض مع صحيح الشرع والنظام وأضاف المحامي في مذكرته مخاطبا القاضي .من كل ما ذكر من اسباب وما لم اذكر ولما كنت يا فضيلة القاضي مناط بكم تطبيق النظام ومراقبته وحفظ حقوف المسلمين ولما كان هذا النظام هو الذي على اثره القى القبض على موكلي وحوكم بموجبه ولما كان من حقه الاستفادة مما خصه به النظام ولما كنا كلنا نحتكم للنظام لذا التمس منكم الافراح عن موكلي والسماح له بتقديم لائحته الاعتراضية إحقاقا للحق ودفعا للظلم . ورغم ذلك أصر القاضي على حبسي دون وجه حق واستمر حبسي خمسون يوما من 18/8/1427هـ حتى7/10/1427هـ وهذا يفسر أن حكم القاضي كان مدبرا وتابع المحامي في اللائحة قائلا ان القذف حد من الحدود وان الحدود كما هو معروف تدرأ بالشبهات وقال رسول الهدى صلى الله عليه وسلم (ادرؤوا الحدود بالشبهات ) لكن القاضي أقام حكمه على الشبهات شهادة الزور واعتراف قهري وهذا يؤكد أن حكم القاضي كان مدبرا وهدفهم في اضعف الأحوال أن احبس مدة اجازة القاضي وهو يعلم انه لا يستطيع احد إطلاق سراحي غيره وهذا يرضي الخصم<br />15- أرسلني القاضي مع مذكرة توقيف وعسكري إلى شرطة النزهة أوقفت هناك عشرة أيام من يوم18/8/1426هـ حتى يوم 28/8/1426هـ في ظروف غير إنسانية وهدفهم اهانتي بكل صنوف المهانة وهذا ما فعله بعض المسئولين في الشرطة ومنعت من التحدث مع أهلي ثم رحلت إلى السجن العام بالطائف يوم 28/8/1426هـ حتى يوم 7/10/1426هـ مدة 50يوما<br />15-رفعت القضية التمييز يوم 20/8/1426 وعادت يوم 7/9/1426 بنقض حكم السجن والترحيل وعدم دخول المملكة وكان القاضي في اجازته وذهب اخي الى رئيس المحكمة لاحالة القضية لقاضي اخر فرفض وقال انه لايملك ذلك والمحافظ لديه الصلاحية وذهب اخي للمحافظ اعطاه خطاب لآحضار الملف وذهب للمحكمة فقالوا له الملف في قسم الشرطة وذهب لقسم الشرطة فقالو له سوف نرسل الملف رسمى مع عسكري ضابط الشرطة في قسم النزهة المسئول عن القضية وهوملفق القضية لا يريد ارسال الملف للمحافظ حتى لا يطلق سراحي ولم يرسل الملف إلى حين عودة القاضي من إجازته يوم 7/10/1426 استدعاني. وأطلق صراحي بكفالة حضورية وقال لي القاضي بعد ان نقضت محكمة التميز الموقرة الحكم قال لي والله شاهد انا اخطأت واعتقدت ان عليك سجن ويمكنك ان تشكيني عند ديوان المظالم او وزارة العدل<br />16- أبنائي أرسلوا برقية استرحام لخادم الحرمين ويبدو أنها لم تصلله او اهملت ولم يستطع احد إطلاق سراحي حتى معالي وزير العدل الذي أرسلت له زوجتي برقية استرحام .<br />17- اعترضت على الحق الخاص وأعيدت القضية إلى محكمة التميز (الغريب ان القتضي نفسة قال ارفض الحق الخاص ) يوم 9/10/1427هـ ثم أعيدت القضية برقم 4/5/687ج بتاريخ 24/10/1427هـ بتصديق الحق الخاص وتم تنفيذ الجلد يوم 4/12/1427هـ وكنت صائما أمام مستشفى الملك عبد العزيز حيث تعمل الطبيبة في حضور ملأ 18- تم نشر الخبر من قبل صحفي في جريدة الوطن وقام بتشويه الحقيقة وذكر أن القضية تحرش جنسي والقضية مسجلة في الصك الشرعي قضية قذف وأنا عمري 60 عام وعندي عدد من الأحفاد وهذا التحريف المقصود دليل قاطع على قلب الحقيقة وإظهار الباطل على الحق والهدف خداع الناس كلمة قذف لها معنى مختلف عن كلمة تحرش 19- صدر قرار طي قيدي من العمل وتاريخ 19/12/1427هـ قامت مديرية الشئون الصحية بحرماني من مكافئة نهاية الخدمة وغادرت المملكة نهائيايوم24/12/1426هـ خالي الوفاض تعب العمر 28 عام ضاع من اجل إنسانة الله يعلم حقيقتها . سوف اخذ حقي من الطبيبة ولن اتركه حتى لو فقدت حياتي ولن اكل او امل وهناك ألف طريقة للوصول إلى حقي سوف اخذه حتى لو كان اخر يوم في حياتي<br />دكتور / نبيه عبد الرحمن أسعد عثمان"
