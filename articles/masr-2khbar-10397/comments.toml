subject = "دعوة المظلوم لا ترد"
author = "ضحية الجلادين قضاة السعودية"
posted = "2008-12-15"
text = "دعوة المظلوم لا ترد ليس بينها وبين الله حجاب<br />دعوة مظلوم طبيب ظلم وجلد من قضاة السعودية الجلادين من اجل طبيبة الله اعلم بها<br />الى منظمات حقوق الانسان الى علماء الاسلام ممن يعرفون الله حقا قضيتي لفقت ضدي وانا طبيب اجنبي غير سعودي من اجل التغطية على طبيبة سعودية ( جاوية الاصل) واتهمت بارسال رسائل جوال لها اشهر بها واقذفها وانا بريء نماما من ذلك والحقيقة ان الطبيبة طلبت منى مساعدتها في عمل عملية ترقيع بكارة في مصر لانها غلطت مع زميلها ( زايدي ) حين كانت تعمل طبيبة تدريب منذ 15 عام في مستشفى الهدا العسكري بالطائف واستمرت معه في علاقة سيئة 3 سنوات ورفض الزواج منها وخافت تشتكية لانه قبيلي وهي جاوية الاصل وخافت قبيلته يذبحوا اهلها ثم ذهبت للرياض وعملت علاقة مع زميل اخر يعمل في منصب كبير في وزارة الصحة ( منصور ) واستمرت معه في علاقة سيئة فترة طويلة وهو قبيلي ورفض الزواج منها ثم عادت للطائف وعملت علاقات مع بعض الزملاء ما قلته هو اعترافها بلسانها والله شاهد على ذلك وحين سمعت قولها وعلاقاتها رفضت مساعدتها والحت على فرفضت اساعدها في عملية غش وتدليس على رجل تريد الزواج منه وقالت لقد كشفت لك سري فحلفت ان استر عليها الى يوم الدين وهذا ما حدث لم اخبر احدا بما اعترفت به حتى زوجتي واولادي كانت تتصل بي احيانا وتقول لي انت سيف على رقبتي وبعد 12 عام فوجئت انها تشتكيني اني ارسلت لها رسائل جوال وتم القبض علي وأقفت في قسم الشرطة ولم اواجه بها ابدا وعذبت ولفقت لي القضية ورفض المحقق السماع لاي كلمة اقولها واجبرني على التوقيع على المحضر تحت التهديد والوعيد والتعذيب وحولت القضية للمحكمة والقاضي لعنه الله دون ان يسألني حرف واحد ومنعني من الجديث ورفض الاستماع لي حكم علي بالجلد 80 جلدة ثم 100 جلدة وسجن سنة وترحيل وعدم دخول المملكة وجلدت امام المستشفى وحرمت من جميع حقوقي المادية التي عملت بها طوال 28 عام وغادرت المملكة خالي الوفاض من اجل طبيبة الله اعلم بها هذه حقائق عن القضاء السعودي امام العالم هولاء هم الجلادين الذين يحكمون بالشرع والدين منهم بريء هولاء من توهم العالم انهم في ظل راية التوحيد والراية منهم براء لقد ارسلت شكاوي رسمية من خلال السفارة وبرقيات الى كل المسئولين السعوديين من خادم الحرمين الى مسئولي الطائف دون جدوى واخبرتهم اني املك الادلة الكاملة على اعترافاتها وعلاقاتها السيئة ومستعد ان اكشفها لهم لكني توصلت ان الامر عنصرية متأصلة في هذا البلد وان تلفيق القضايا للاجانب واكل حقوقهم المادية والتعدي على حقوقهم الادبية والانسانية وشهادة الزور امر طبيعي والدليل ملايين حالات الاجانب التي نسمع عنها سلبت حقوقهم وتعذبوا وهاموا في الشوارع دون رحمة او ضمير كل هذا ونسمع اعلامهم وخطب ائمة المساجد لديهم ينادون بمباديء الاسلام السمحة واذا بكل ذلك هراء اين هولاء الائمة مما يحدث من ظلم للاجانب حولهم اين المسئولين الذين يتشدقون بالعمل بدين الله لا يجيب احد منهم حين يواجه بحالات الظلم التي يتعرض لها الاجانب .<br />معجزة العصر رؤيا حقة اعلنها الى الملآ اني وقفت عند الملتزم مابين باب الكعبة والحجر الاسود ساعات طويلة أدعوا دعوة واحدة اتضرع بها لله عز وجل لم اطلب غيرها وهي ان يحرم الله نعمة البترول الذين ظلموني حتى يعودوا حفاة عراة لانهم طغوا في البلاد وهاهو الله القاهر فوق عباده عالم الغيب والشهادة وناصر المظلومين تجلت عظمته . هاهو سعر البترول قد تهاوى الى الحضيض وهى بداية النهاية لكل الظلمة الذين تكبرو في تعاملهم مع الاجانب في السعودية وغيرها واستبدوا وطغوا واهانوا وذلوا الاجانب وسلبوهم حقوقهم وحرموهم مستحقاتهم وعرق جبينهم . وقد جاء انتقام الله العلي العظيم سريعا لقد جائتني رؤيا ثلاث مرات هي من عند الله انشاء الله لقد رأيت عقدا ثمينا جدا في عنق امرأة سعودية منقبة وهذا العقد اخذ بالانفراط والتحلل وهي تستغيث تحاول الامساك به لكنه يتحلل بسرعة من بين يديها ثم انهارت واختفت انا افسر ذلك ان الله لهم بالمرصاد ان شاء الله وسوف نشهد نهاية الظلم قريبا لانهم تكبروا واكلوا حقوق الضعفاء ونسوا ان الله طرد ابليس من الجنة بسبب تكبرة وانه اباد قوم عاد ارمذات العماد لطغيانهم وخسف الارض في قارون واغرق فرعون لكبرهم وطغيانهم والاتحاد السوقياتي فرط عقده وانهار وتهاوى لكفره وجبروته وغيرهم الكثير هل اعتقد الظلمة الجلادون قضاة السعودية ان اكل حقوق الناس بالباطل امر سوف يتركه الله لا والله ان الله لهم بالمرصاد سوف تشهد السنين القريبة القادمة عدل الله وسوف يذهب البترول متبخرا مع طغيان الظلمة ويبقى عالم الحق والعدل وتبقى الحقيقة الظلم ظلمات يوم القيامة والظالم سوف يحيط به ظلمه مهما غوى وتجبر هل نسوا ان كل من عليها فان ويبقى وجه ربك ذو الجلال والاكرام<br />ضحية الجلادين القضاة السعوديون<br />كتاب البكارة عفة وطهارة ام تدليس وقذارة<br />انا اتفق مع مذكرات الجراح د سمير فهو ذكر عشرات اسماء البنات اللواتي عمل لهن عمليات ترقيع بكارة وهذا صحيح انا اعرف طبيبة سعودية ( جاوية) طلبت مني مساعدتها في عمل عملية ترقيع بكارة في مصر وهي طبيبة اطفال تعمل في مستشفى الملك عبد العزيز التخصصي بالطائف وعملت العملية ثم تزوجت مغفل بعد ان مارست فترة طويلة مع عدة رجال انا اعرفهم واعرف مكان عملهم ولدي ادلة وتفصيلات دقيقة بلسانها عن علاقاتها وذكرت لي اسماء عدة طبيبات زميلاتها عملن عمليات ترقيع كارة ثم تزوجن بعد ان مارسن مع رجال فترة طويلة وبعضهن ما زالت لم تعمل ولدي اسمائهن واماكن عملهن وهذا على ذمتها امام الله"
