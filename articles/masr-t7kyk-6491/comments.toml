subject = "اه يا لندن"
author = "نيفين نيفى نوفا"
posted = "2007-06-30"
text = "انا شايفه ان لندن مقبره الاحباب و عاصمه الموت<br />من عبد الحليم لنزار قبانى للسندريلا زوزو<br />اما بالنسبه لمروان انا مقدرش افتى لان معلوماتى عن الرجل لا تتيح ليا الكلام و ان كانت الشبهه الجنائيه ف الوفاه واضحه و لكن ما استطيع ان اؤكده ان طالما اللى هيتولى التحقيق اسكتلاند يارد فطريقك مسدود يا ولدى"
