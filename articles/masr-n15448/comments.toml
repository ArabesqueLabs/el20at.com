[[comments]]
order = 0
subject = "مصير بنك القاهرة اية ؟ مش هيتباع علشان تشتروا دقيق لرغيف الخبز والا زيادات الموظفين"
author = "سائل رخم"
text = "الحكومة بترفص علشان تسد عجز الموازنة<br />تصوروا ميزانية وزارة الداخلية اكثر من 9 مليارات وطالبين زيادة<br />9 مليارات جنية يعملوا 50 مصنع كبير يشغلوا فية نصف مليون شاب وشابة - مصانع اسمنت - مصانع حديد - قطع غيار سيارات - مصانع سكر - عربات سكة حديد<br />تعمل تقدم فى البلد ويحدث استقرار<br />انما مليون ونصف عسكرى امن مركزى يصرفوا 9 مليارات فى الهواء علشان يفرقوا مظاهرة او يضربوا الناس فهذا اسلوب فاشل لحكومة فاشلة<br />شغلوا الاولاد والبنات ومش هيبقى فية مظاهرات ولا داعى للامن المركزى<br />يبقى هنبيع اية علشان نغطى الميزانية<br />بنك القاهرة<br />الضرائب العقارية الجديدة<br />هتعملوا اية"
archived = "2008-04-30"
capture_url = "https://web.archive.org/web/20080430221834/http://masr.20at.com:80/newArticle.php?sid=15448"

[[comments]]
order = 1
subject = "اوعى حد يشترك فى الفيزا او الماستر"
author = "طارق توفيق"
text = "نصيحه لكل اخ مسلم او مسيحى فى مصر او فى اى مكان فى العالم اوعى حد يشترك فى الفيزا او الماستر لانها يهوديه وخراب بيت مستعجل ومن الاخر الفلوس فى اخدها سهل وردها صعب جدا"
archived = "2008-04-30"
capture_url = "https://web.archive.org/web/20080430221834/http://masr.20at.com:80/newArticle.php?sid=15448"
