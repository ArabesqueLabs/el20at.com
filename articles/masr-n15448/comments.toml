[[comments]]
order = 4
subject = "من ينقذنى من هذا الزواج الباطل"
author = "حمدى المكاوى"
posted = "2008-05-22"
text = "تزوجت من فتاه تعمل فى التدريس وفوجئت ليلة الزفاف انهاليس بكرا<br />والاسوء من ذلك ان اهلها يعلمون بالامر ويؤيدونة وصرفون الاف الجنيهات ليسدو على الزوج ان يأخذ حقة وهو ابطال العقد<br />والكارثة ان تأخذ احكام فى النفقة وتاجل قضية بطلان عقد الزواج سبعة مرات دون سبب دون اجراء كشف طبى يوضح الحقيقة انكار او تأييد دون سبب يذكر والعجيت فى قضية ضرب كيدية تحكم المحكمة بشهر حبس و100 ج غلرامة رغم ان التقرير الطبى بدون اصابات ودون شاهد واحد فى القضية ودون اى دليل مادى يذكر فبأى قانون تحكمون - واى عدل ترسخون<br />الحقوووووووووووووووووووووونى مش لاقى قانون امضاء موظف على وش حبس"
archived = "2010-03-14"
capture_url = ""
