text = "ومالة خليهم يتكيفوا واكنها بلد ابوهم<br />ما بروحوا فى ستين داهية عند اقاربهم الرومان فى امريكا واستراليا<br />احنا مستحملينهم ازاى<br />دى حاجة قرف وريحة زفرة وزناخة خنازير"
