[[comments]]
order = 0
subject = "توبوا لله يا نصارى فلن ينفعكم رهبانكم يوم الدين"
author = "ذابح الخروف"
text = "نار جهنم أشد حرا لو كانوا يفقهون"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509000053/http://masr.20at.com:80/newArticle.php?sid=15672"

[[comments]]
order = 1
subject = "اية"
author = "مصرى"
text = "ان الذين كفروا ينفقون اموالهم ليصدوا عن سبيل الله فسينفقونها ثم تكون عليهم حسرة ثم يغلبون والذين كفروا الى جهنم يحشرون"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509000053/http://masr.20at.com:80/newArticle.php?sid=15672"

[[comments]]
order = 2
subject = "تأتيهم مليارات الدولارات من اقباط المهجر وتدعهم السيدة التى من اصول مسيحية يهودية"
author = "بيرقص"
text = "ومالة خليهم يتكيفوا واكنها بلد ابوهم<br />ما بروحوا فى ستين داهية عند اقاربهم الرومان فى امريكا واستراليا<br />احنا مستحملينهم ازاى<br />دى حاجة قرف وريحة زفرة وزناخة خنازير"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509000053/http://masr.20at.com:80/newArticle.php?sid=15672"

[[comments]]
order = 3
subject = "احنا ملناش حد لية"
author = "واحد حران اوى"
text = "هما ليهم اللى بيسال فيهم واحنا ننسلخ من الحر<br />عشان احنا يتامى من القيادات"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509000053/http://masr.20at.com:80/newArticle.php?sid=15672"
