posted = "2008-05-12"
text = "لو كنت بتعرف تقرا كنت عرفت ان اصل المصرين هم اقباط ومسيحين وانتم جيتو واحتاليتونا ولولا الغرب يا ذكي ماكنتش هاتلاقي كمبيوتر ولا نت تكتب عليه فلم لسانك واعرف مين اللي ادالك الحرية وبعد كدا ابقي اتكلم"
