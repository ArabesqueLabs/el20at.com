text = "السلام عليكم ازيك يا اسامه يارب تكون بخير انا بحاول اتصل بيك كتير جدا بس الخطوط مشغوله<br />المهم انا بحب انسانه وبحبها جدا انا كنت اعرفها من عالنت وقابلتها كذا مره وحبتها بجد من 3 سنين وجت فى الفتره الاخيره تقولى انا مش حاسه من نحيتك بحاجه ليه عشان انت فى حاجات فى شخصيتك عاوزاها تتغير غيرمن نفسك هاديك فرصه انا بعترف انى كنت ضعيف جدا معاها بس ده غصب عنى مش عاوزها تضيع منى وجت فى اخر مره كنت بقابلها قالتلى ياهيثم مفيش امل انى احس معاك بحاجه مش حاسه بيك وانا مش عارف اعمل ايه نفسى ارجعلها حاولت كتير خسرت عشانها حاجات كتير اوى وعندى استعداد اخسر تانى بس ارجعلها لانى بجد بحبها جدا اعمل ايه يا اسامه عاوز حل نهائى غير انى انسى"
