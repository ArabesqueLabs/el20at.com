[[comments]]
order = 1
subject = "شائعات في كل مكان"
author = "شرين منصور"
posted = "2007-04-25"
text = "السلام عليكم بصراحة انا من مجرد ما قرات المقدمة بصراحة ضحكت لأن ازاي يعني حيجيلي تليفون باللون الاحمر ههههههه معلش اعذروني بس حاجة مضحكة يمكن خدمة جديدة نزلة كل واحد وبلونو المهم وبعيد عن التنكيت ،كل مكان فيه شائعات احيانا بعضها يأخذ اهتمام اعلامي زي ما عملتو وبعضها لأ ده على حسب الموضوع او الشائعة انا من وجهة نظري ان لواحد طلع شائعة بيبقى نفسو يعمل الحاجة دي يعني واحد مثلا عايز ونفسو يتجوز حيطلع شائعة انو اتجوز وهكذا اما المستفيد من الموضوع ده هو طبعا شركات الاتصال وصاحب الشائعة نفسها اما عن الاستفادة مش عارفة يمكن نوع من الاحساس بحاجة غير الروتين لان كل واحد منا بقى يعيش في روتين للاسف ممل والشائعات مش حتنتهي الا اذا الناس بطلت كذب ومتهيالي ده صعب ،ام عن النكتة دي يمكن اللي طلعها مش عجباه حياتو وعايز يتخلص من الناس اللي فيها يمكن ..وتظل الشائعات لغز لا حل ولا تاريخ لها..."
archived = "2010-03-14"
capture_url = ""

