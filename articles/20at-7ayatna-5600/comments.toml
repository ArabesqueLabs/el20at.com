text = "والله يجب محاكمة مروجو الشائعات ،لما يسببونه من أضرار نفسية ومعنوية مادية للكثيرين، عندما وصبت شائعة البنقالى استفزيت جدا، وكنت أود أن أطرد جميعهم من بلادنا"
