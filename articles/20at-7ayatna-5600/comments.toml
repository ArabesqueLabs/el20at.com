[[comments]]
order = 3
subject = "كذبة إبريل بدعة نصرانية"
author = "فهد السبيعي"
posted = "2007-04-25"
text = "وصلتني رسالة الموجات القاتلة هذه من صديق مؤكدا على أن أحذر منها وحاولت إقناعه بأن هذا المر كذبة ولكن لاحياة لمن تنادي، وهذا الشهر انتشرت به كثير من الشائعات العض سامحهم الله يقلدون النصارى في كذبة إبريل، فيروعون ويخيفون الاخرون<br />وشركات الاتصالات المستفيدة في النهاية من ترويج هذه الإشاعات حيث تجني الملايين دون أن تتدخل لمعرفة الفاعل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "برامج الواقع والشائعات"
author = "برامج الواقع والشائعات"
posted = "2007-04-25"
text = "يبدو أن برامج الواقع وحدها لم تعد تكفي شهية شركات الاتصالات حتى تلجأ إلى هذه الوسائل الرخيصة حتى ولم تكن مسئولة بشكل مباشر عنها، ربما لن تكون هي من وراء هذه الئعات ولكنها على الأقل تغاضت عن الأمر<br />أم الشعب الشعودي فيجب عليه أن يتقن من الرسالة التي يقوم باستقبالها قبل أن يقوم بنشرها، ويتعبوا نسفم شوية ويشغلوا عقلهم"
archived = "2010-03-14"
