[[comments]]
order = 0
subject = "ابدا الى الامام يا مصر"
author = "مش كاتب"
text = "ابدا ابدا لن نياس<br />الى الامام يا مصر<br />الى الامام بالقران والسنة<br />الى الامام بالنبي محمد صلى الله عليه وسلم<br />الى الامام باهل السنة والجماعة<br />الى الامام بعمر بن العاص وصلاح الدين الايوبي"
archived = "2008-04-24"
capture_url = "https://web.archive.org/web/20080424011602/http://masr.20at.com:80/newArticle.php?sid=15353"
