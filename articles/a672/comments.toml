posted = "2008-03-07"
text = "اليك ياامير الأنسانيه وصاحب القلب الرحيم ابث رسالتي هذه والتي فيها من الشوق لرؤيتك في البدايه الجزء الاكبر وانا ياسيدي استرحمكم واستعطفكم ان تنظروا الي بعين الشفقه فانا ياسيدي احد جنود الوطن واتقاضى راتب مجزي لكن واقسم لك برب الكعبه ان الدين اللذي انهكني لا يجعلني ارى من راتبي ولا هلله فلدي ياسيدي كشوفات حسوبات تثبت مااقول فأنا ياسيدي مطلوب للبنك العربي مبلغ وقده 200 الف ريال على فترة سداد 12 سنه مضى منها سنتين وبقسط شهري قدره 2500 ريال وعلى ظهري ايضا بطاقات فيزا بمبلغ 40000 ريال اخذتها لحاجتي الماسه لهاومطلوب لشركة عبداللطيف جميل مبلغ 25000 ريال بقسط شهري قدره 1305 ريال ولحاجتي الماسه اقترضت من شركة بندر المطيري مبلغ 15000 ريال بقسط شهري وقدره 1500 ريال وعلي مبالغ متفرقه للناس وقدرها 100000 ريال ولدي ياسيدي مايثبت جميع ذلك وما تراكمت على الديون الا لان راتبي لا يغطي مصاريف الحياه التي اجهدتني واخبرك ياسيدي بأني رب لأسره واسكن في شقه اجار ولم يتبقى ياسيدي الا ان اشكرك لما عملته مع جميع الناس وان اذكرك كل خير وارجوك ياسيدي ان تقضي عني دين الدنيا اللتي لا اقدر على مسايرتها وادعوا الله ان بوفقك ويفتح لك في كل ثانيه باب رزق لا يؤصد ابدا .. خادمكم/نواف الثبيتـــي 0567266336"
