text = "السلام عليكم .. انت يللي تقول فلوس الأمير حرام ياخي انت وش درااااك ؟! الله اعلم حرام ولا حلال بينه وبين ربه مالنا شغل واذا كان عالقنوات اللي تقول عنها ياخي لا تشوفها وشيلها من تلفزيونك و فك عمرك وابغى اقولك كل انسان عنده ذنوب وكلامك هذا ممكن يخلي ذونبك اكثر من ذنوب الوليد وممكن انه ياخذ كل حسناتك<br />واقول كلامي للناس اللي يلهثون ورا الفلوس خصوصا السعوديين انتوا تبغون الدوله توظفكم وتعطيكم بيت وسياره بدون مقابل منكم وتتحجون بإن الدوله غنية جدا .. هو صحيح الدوله غنيه ولله الحمد لكن اشتغل سوي مجهود ياخي ادرس سوي اي شي ممكن يطلعك بدل الشحته قدام العالم .. وهذي رسالتي للأخوه العرب اللي يقولون لو ماكان الوليد فاسد كان ماراح يكون في بطاله في العالم العربي !! ياخي وانتوا مالكم هو خلفكم ونسيكم وروحوا قولوا هالكلام لمسؤولييكم الحراميه والمشكله انكم تحشتون من السعوديه وانتوا اصلا ما تحبون السعوديين وانا عارفكم"
