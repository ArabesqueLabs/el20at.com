text = "الى أمير القلوب ورجل الخير والله ان سمعته تسبقه والدليل انا اسكن في احد الاحياء السبه فقيره ولا فيه اي جار لي ماساعده الامير (( ياسبحان الله)) وهذا بحد ذاته معجزه الله يوفقه ويجزاه خير لاكن انا عطلب مساعده منه انا سعودي ابن عن جد ومن اهل البلد الطيب بلد الخير والنماء ولازدهار وانا متزوج واب لثلاثة اطفال واسكن في شقه اجار انا واب وامي واخاواني وانا طالب في معهد صحي تمريض واب متسبب عاطل واخي الكبير مفصول من عمله واب لخمسة اطفال واخي العائل المادي لنا توفي بحادث سير رحمه الله ولحقه بعد فتره اخي الصغير بحادث سير رحمه الله واختي مطله ام لسبعة اطفال رماهم ابئهم لاراعي ولا مرعى وكل غرفه بالمنزل يسكنه مايقارب خمسة اشخاص علمنا باننا مهددين بطرد ووووووووووووووووووووووووووووووو * المعهد اللي ادرس فيه واتمنى شهادته يبغى فلوس* صاحب العماره * امي علاج *الوالد علاج * وووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووو ومعي بالمستندات مايثبت ذالك وهذا اميلي ياهل الخير ياسمو الامير romnsiea@hotmail.com"
