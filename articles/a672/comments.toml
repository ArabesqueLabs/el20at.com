posted = "2008-01-15"
text = "ياناس ياعالم سيبوكم من الشحت من عند اصحاب النفوس الضعيفة؟ انتم بحاجة ؟كلامكم صح؟ بس خالوا اعتقادكم بالله العظيم؟الوليد هذا انسان مثلكم ابن تسع شهور مخلوق من طين,مش زايد عليكم بشيئ؟انتوا فكروا وهتكتسبوا افضل منه بس الله ليش خلق العقل الا لتفكير؟ انتم يمكن عندالله افضل من الوليد بس الحاجة جابتكم الى الموقع هذا تطلبوا مساعدته؟ طيب الوليد الناس بيحكوا عن ثرواته؟ بس ماسمعنا احد يحكي عن كرمه؟هذولاء اصحاب الفلوس ضعفاء نفوس افهموا ياعالم يعني لاتطلب شخص مثلكم اطلبوا الكريم المنان ؟ واريد يقراء الوليد هذي الرسالة (لو دامت لغيرك ماوصلت اليك)شف يالوليد انت لو تأتي الى عندي وتطلب مساعدتي مابساعدك؟ ولو جاني مسكين كنت البي دعوته لوكنت في لحظاتي الاخيرة؟انت وكل الاغنياء ماتساوي جناح بعوضة الا الطيبين منهم أنا باأفتخر بنفسي وانت تعرفني زين ؟؟؟ اذكرك من اكون (أنا من عرفك على حقيقتك)اكيد فهمت الكلام والاشارة اخر مرة تقابلنا في بريطاني واعطيتني رقم جوالك الشخصي ؟ بس اريدك تفهم شي لافلوسك ولاتجارتك ولاكنوز الدنيا تقدر تجيبني ؟ انا مخترع الذرة ؟ انا قادر اجيب اي شخص بالدنيا في لحظة ؟ وتفهمني كويس يابو خالد وريم alpashk3000@yahoo.com ملك الجان متواجد في كل الاحين ارقص مع الالحان هذهي كلامات لايفهمها الا انت ؟؟؟؟؟؟؟؟؟؟؟؟؟"
