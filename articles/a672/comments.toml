text = "اتقدم الي الله ثم الي سيدي حيث انني مواليد هذا البلد الحبيب الذي حباها الله بنعم كثيره واعزها بوجودكم لذا التمس من الله ثم من سموكم الكريم بالنظر علينا بعين العطف والرحمة حيث اننا اعتبر نفس من ابنا هذا البلد المعطاء الذي تربينا علي ترابه الغالي وانني متزوج ولدي ابناء عددهم ثلاثه حفظهم الله من مواليد الرياض . واعوال والدي ووالدة اطال الله عمرهم .ارغب بالجنسية السعودية ومساعدة لشراء منزل ونطمع في كرم سموكم المعهود.<br />صــــــــــــــــامــــــــــل الــفــــزعــــات<br />والله مايفتح مغاليق الضماير كود تل الجيب والموقع محدد<br />لا كفخ بينةالحتيفه والزباير كفخ شيهان علي الصيد يتهدد<br />والحصي مثل الفشق التوابر وعجها مثل الغثير الياتبدد<br />نحره معطي علي الضيف الشاير عن مواجيب النشامي ماتصدد<br />ذاك ابوخالد حمال الخساير صامل الفزعات روقي مردد<br />يوم كلمته وجور الحمل جاير قال انا ابن روق قول و لا تردد<br />قلت كفوو وهلت العين العباير لعن ابو قلب بحبك ما تجدد<br />جعلها يمنا ماتلمسها الجباير اليمين اللي تطش ولا تعدد<br />جعل يفدونه مجمعة التجاير شلة عنوانها قيد وسدد<br />عكس ابو خالد حمال الخساير صــــــــــامــل الــــفـزاعـــات<br />مقدم الطلب : احمد عبدالله بشري<br />الجنسية : سوداني<br />العمر : 31 سنة<br />المدينة : الرياض_ العليا<br />جـــوال 0504160406<br />هاتف 4822009<br />أميلAhmadabdolla_01@hotmail.com"
