author = "عبدالرحمن العزاوي من العراق"
text = "اقولها وبكل صراحة لقد عمل الرجل وسهر ونال المال الكثير والشهرة ولكن كيف الله اعلم ؟؟؟<br />هل هي بسبب ال 100 الف ريال التي اعطاها اليه ابوه ام ارتباطه بالماسونية العالمية التي تهدف الى خلق جيل فاسد<br />يتبنى خلقه الامير المغرور الذي بفضل جهوده القيمة اصبح للشاب المراهق اكثر من قناه للاغاني الماجنة التي تذهب بالاخلاق الاسلامية . وهذا مايريده اعدء الدين , فليفرح الامير بالمليارات التي عنده وليتمتع بها عدده سنوات ولكن بعد ذلك<br />ماذا يقول لربه ؟؟؟؟ يقول افسده جيلا كاملا لكي اصبح ملياردير<br />امتلك الوثائق الاصلية التي وقعت بين عدي صدام حسين والامير الوليد بن طلال والماسونية لاجل افساد الجيل العربي الجديد حيث ان عدي مات فلم يبقى امام الماسونيه سوى الوليد الذي اصبح في هذة المكانه الان لآجل انهاء الامل العربي بأن تكون هنالك دوله اسلاميه ؟ فليفرح الامير وليعيش عدد سنين ولكن بعد ذلك الموت والحساب فماذا يقول لربه"
