text = "بداية انا اب لثلاثة اطفال 9 شهور و 10 سنوات و 6 سنوات و لا اطلب دعم مادى بقدر ما اطلب مساعدة سمو الامير فى ايجاد وسيلة تؤمن إقامتى فى السعودية بجانب زوجتى التى تعمل ممرضة باحد المستشفيات<br />.فقد حاولت الحصول على فيزا بكل الفلوس التى ادخرناها الا انه نصب علينا و الان انا كاسر فيزا الزيارة و احتاج الى دعم سمو الامير فى هذا الشان خصوصا ان الغرامة المطبقة فى حالة القبض على هى 10000 ريال و ترحيل لى ولزوجتى و من ثم تشريد لاسرة كاملة .انا محاسب و كنت اول الدفعة فى كلية التجارة- قسم الاقتصاد- جامعة الاسكندرية .و قد بخس حقى فى تعيينى كمعيد فى الكلية من ادارة الجامعة فقد عينوا الرابعة لان لها واسطة و لم اعين وكنت الاول و حرمت من اكمال الدراسات العلياعلى حساب الدولة ولم استطع اكمالها بسبب العامل المادى. أثق فى الله أولا ثم فى سمو الامير بأنه سوف يساعدنى و جزاكم الله خيرا ....بريدى الالكترونى هو : candy_bar_to_u@yahoo.com و انا مازلت فى المملكة الى هذه اللحظة ."
