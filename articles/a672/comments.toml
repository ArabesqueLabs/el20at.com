text = "لا اعلم ان كان هذا البريد حقيقتا خاص الامير والمليونير الوليد بن طلال<br />ام لا ولاكنى سوف احاول ويكفينى شرف المحاوله فى كيان هذة الحيرة التى<br />تمتلكنى<br />انا انسان مصرى لدى مبدىء فى الحياة وقرأت كتاب المليونير وقصته لانى<br />مشغوف بهذا الرجل كثيرا ولانى ايضا انا الاخر اميرا ولكن اميرا من الفشل<br />وليس من النجاح ههههه<br />وتشرفت بالعمل فى احدى المؤسسات التى يمتلكها الرجل الفاضل الذى كان<br />يترك للعاملين الوفير من المال<br />واننى كونت اعمل فى فندق الفور سيزونس النيل بلازا<br />وكان لدى الطموح فى الترقى واكن للاسف ظليت لمدة عاميين اعمل كفرد امن<br />وماتت الطموح تحت بوابات العمل وكونت فخور لانى اعمل فى هذا المكان<br />ولكن المديرين لم اكن محظوظ معهم لانى صاحب طبع فريد فأنى فارس حر لا<br />املك النفاق الذى بندرج تحت ستار كلمه ظريفه مسمها ( الزكاء<br />الاجتماعى)والحمد لله الذى لايحمد على مكروة سواة<br />وتركت العمل فعليا فى شهر اغسطس 1006 وحتى الان لا يمكنى العمل وتراكمت<br />الديون والناس مع عليها سوة ان تدعى الى<br />وانا اعول اسرةههههههههههههههه وكونت اتمنى ان اكون لاعب كرة او مطرب<br />حتى تشملنى الرعايه الملوك والامراء العرب<br />وجاء يوم جميل فى شارم الشيخ كونت ذاهب للبحث عن عمل ورأيت سمو البرنس<br />الذى كدت ان احفظ كتابه الذى يعطينى امل فى الحياة<br />واتصور بجوارة وسط حشود من رجال الامن فى احدى المقاهى المفضله لديه<br />على ما اظن انك مليت من التفخيم ولكنك حقا سموا الامير جدير بهذا<br />التفخيم فأنا فقير ومعدوم الدخل والديون سوف تزج بى الى السجن ولاكنى عزرا لست<br />بحقود هذة قدرة الله سبحانه وتعالى وانا اعترف بهذا<br />لا اعرف ما اريد منك اريد ان تقرأ خواطر شاب يعانى من الفشل (امير<br />الفشل) يخاطب امير النجاح<br />انا عمرى 30عام<br />ليست عندى خبرة سوة فى مجال الامن و اللغه الانجليزيه تحدثا<br />متزوج وابنى يسمى عبد العزيز<br />اسكن : 6شارع يعقوب لاظوغلى .السيدة زينب .القاهرة<br />رقم جوال:0020168968632<br />zizoforever@yahoo.com<br />اننى اتوجه الى انديه النت لان حياتى اوشكت على الدمار والله لو انى ما<br />بكرة المخدرات والخمور لتجهت اليهاولكنى والحمد لله مؤمن بالله سبحانه<br />وتعالى<br />ارجو ان تصل اليك هذة الرساله التى ليس بها اى تزيف وكلمها بسيط لانى<br />افتقد التعبير الجيد<br />واذا كان احد يعبث بهذا البريد الاليكترونى فارجوك اننى لست عندى<br />القابليه لاى عبث ( وارحموا قوما عزيز زولوا) ولعل وعسى ان اتكون سندى او<br />وسيله دناياويه مرسله من الله لحل مشاكلى الماديه وسداد دينى<br />محمد عبد العزيز محمود محمد عيسى"
archived = "2010-03-14"
