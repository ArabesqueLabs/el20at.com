posted = "2008-01-24"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته وبعد:<br />إلى صاحب اليد الكريمة البيضاء السخية صاحب السمو الملكي الأمير الوليد بن طلال ( ابوخالد وريم ) أطال الله في عمره وأعطاه من واسع كرمه ما يرضيه.<br />يا صاحب السمو لا ادري كيف ابدأ ولا أين انتهي فانا أمراه لي من الأولاد ثمانية أولاد وليس لهم من ولي سواي بعد الله عز وجل خير ولي لي ولهم.وأنا يا طويل العمر سمعت انك تمد يد العون والمساعدة لمن يحتاجها وأنا امرأة محتاجة جدا لمن يمد لي يد العون بسبب ضروفي المادية الصعبة التي لا أستطيع بها مواجهة متطلبات الحياة الضرورية من لباس ومواد غذائية ومستلزمات مدرسية وغيرها الكثير من الأشياء التي لا يمكن الاستغناء عنها وأنا والله العظيم لم أرسل إلا لما اشتدت حالتي سواء. وكلي أمل بأن تصلك الرسالة في أسرع وقت وأن تكون لي يا أبو خالد سبب في تحسين حالتي المعيشية أنا وأولادي بما يمليه عليه ضميرك ولو بشيء بسيط جزاك الله خيرا.<br />أناشد بالله من تصله الرسالة أن يساعدني بإيصالها لصاحب السمو الأمير الوليد بن طلال في أسرع وقت ممكن فهذه الرسالة هي السادسة ولا اعلم هل تصل أم لا أو هل من تصل له يوصلها للأمير أم لا فقد ضاقت بي الأرض بما رحبت فساعدوني وفقكم الله.<br />أم عبد الله<br />من المملكة العربية السعودية<br />h-s-666@hotmail.com"
