[[comments]]
order = 153
subject = "اميرة باريس تبحت عن عمل مع الامير الوليد بن طلال ا"
author = "اميرة باريس"
posted = "2008-03-09"
text = "السلام عليكم و رحمة الله تعالى و بركاته<br />يوم الاحد و كعادة الفرنسيين رحت اخد قهوه بالشانز و لو تكلمنا عن المقاهي الكلاس بالشانز اكيد في اول الائحة بتطلع مقهى الاوتيل جورج سانك<br />و المعروف انا صاحب هذا الاوتيل الرائع الامير الوليد بن طلال اطال الله بعمره<br />و انا في شقتي و كالعاده وحيده دخلت الانترنيت و بدات ابحت عن معلومات عن شخص الامير الوليد بن طلال فاثار انتباهي مقطع فيديو يتكلم عن المجهودات التي يبذلها هذا الامير للدفاع عن المراه و من تم حوار بين عدد من النساء المثقفات اللائي يشتغلن مع الامير الوليد بن طلال فقررت ان ابحت عن اي موقع يساعدني على ان اقدم اوراقي و اطلب ان اعمل مع هذا الشخص الذى ما في اذاعه او برنامج الا و تكلم عن شخصيته الرائعه و عن مجهوداته و اعماله المتميزه و عن حسن اخلاقه و طيبته و مساعدته للفقراء فسموه يزائر الليل نظرا لزيارته لكدا عائله فقيره بالليل قصد مساعدتهم كما كان يقدمه الاولون من كرم و مساعده ايام رسول الله صلى الله عليه و سلم و كذلك اتار انتباهي علاقته الحميمه بابنته البنت الرائعه و الجميله من جد اتمنيت ان اكون مكانها يوم تخرجها و هو يحملها بين يده من فرحته بها الله احساس رائع تتمنى اي بنت يتيمه او محرومه من الاب متل حالتي ان تعيش هذه اللحظه خصوصا و انا في الغربه وحيده<br />المهم انا طالبه هندسة كمبيوتر بباريس و عندي خبره في مجال الاستقبالات و المبيعات والكل يراني متفوقه في الاستقبالات و المبيعات او السكريتاريا بفضل جراتي الفريده من نوعها و ذكائي و الحمد لله لجمالي<br />اتمنى اليوم ان تتحقق امنيتي و اصير ساندريلا باريس و اشتغل مع الامير الوليد بن طلال<br />للمزيد من المعلومات راسلوني على البريد الالكتروني التالي<br />E mail: njila2006@hotmail.com"
