subject = "alabd-alfker@hotmail.com"
author = "ابو عبيدة"
posted = "2008-03-26"
text = "السيدالوليد بن طلال راعي الفساد العربي المحترم<br />مالك قنوات المجون مش حتقدر تغمض عنيك<br />انت ترعى الفساد العربي بكل المقاييس<br />وكل هذا ماجور انت عليه وان شاء الله سوف توفى اجرك يوم القيامة<br />فبدلا من المساهمة في نشرالوعي ولادراك في عقول الشباب العرب<br />تساهم في نشر المجون والبعد عن تعاليم الدين الحنيف اريد ان اسالك سؤالا واحدا يا ابن المجتمع السعودي المحافظ<br />هل تسمح لابنتك وابنك ان يشاهدو قنوات المجون التي ترعاها وهل يسعدك ذالك فانت ياسعادة الاميلربما هذا الامر اصبح عاديا عندك فبعد ان تخليت عن قيمك العربية والاسلامية ولبس عبائة الماسونية والصهونية اصبح الامر عاديا فلربما غدا افقنا على احدى محطاتك الاباحية التي تبثها على اقمار اروبا وانت قد قررت ضمها الى روتانا الفساد هذا ليس ببعيد عمن امتنع عن مد يد العون الى المقاومين والمساكين وبسطها للماجنات والماجنين وكل من يقول ان الوليد بن طلال جمع ثروته بل الحلال فقد كذب واكبر دليل المجون الذي بث لتهديم الشباب المسلم فوالله يا سيادة الوليد بن طلال كلنا رفعنا يدنا في خطبة الجمعة لندعو عليك خاصة وعلى امثالك عامة لما تقدمه لامتنا الاسلامية فان استمريت على هذا النهج من بيع الخمور والمجون في فنادقك<br />وبث السموم في عقول الشباب المسلم مخلال مجموعاتك الاعلامية التي لو اغلقت لافلس قمر اروبا والنايل سات ودعمك للربا من خلال مجمعاتك الربوية المتمثلة بل البنوك الصهيونية والخ من الفساد والتعطيل لكنا دائما من الداعين عليك وعلى امثالك<br />والمؤسف ان هنالك من الاخوة من يشببه بحاتم الطائي وعثمان بن عفان خسؤو والله لان الغبار الذي على نعل سيدنا عثمان بن عفان اشرف من الوليد بن طلال وكل امثاله عليهم من الله ما يستحقون حسبنا الله ونعم الوكيل فامة الكفر تدعم التنصير وبناء الكنائس وتنشر حملات التنصير وتسعى الى هدم الامجتمع الاسلامي ومن امثالهم بيل غيتس الذي تبرع لبناء الكنائس بمبلغ ميلر دولار في سنة واحدة ورجل أعمال هولندي تبرع بمبلغ 114 مليون دولار دفعة واحدة وقيل بأن هذا المبلغ كان كل ما يملكه، وفي أحد الاحتفالات التي أقامها أحد داعمي العمل التنصيري في نيويورك قرر أن يوزع نسخة من الإنجيل على كل بيت في العالم وكانت تكلفة فكرته 300 مليون دولار حتى ينفذها، ولم تمر ليلة واحدة حتى كان حصيلة ما جمعه أكثر من 41 مليون دولار<br />فماذا انت قدمت ياسعادة الامير ورسول الله صلى الله عليه وسلم يقول (لدال على الخير كفاعله \" ... وهذا الحديث في البخاري ومسلم ) وانت تندرج في هذا الحديث ام الدال على الشر كفاعله لماذا لاتكون مثل الدكتور عبد الرحمن السميط الذي اسلم على يديه خمس ملايين انسان وهو الى المزيد بارك الله له اين انت من لبيك افريقيا انظر في موقعها على شبكة الانترنت ماذا تقول ا هنالك ملايين من المسلمين يموتون جوعا والوليد بن طلال يرصع طائرته الخاصة بل الذهب غزة تحاصر ويموت شعبها جوعا واميرنا يشتري سيارة بات مان كفاك مهزلة وعد وتب الى الله حتى لاتصيبك دعوة مظلوم من اباء وامهات فقدو ابنائهم من المجون الذي تبثه وتغذي به عقولهم هداك الله وكل الضالين امثالك ولا انسا نفسي الخطائة اللهم اني استغفرك واتوب اليك<br />وصلى الله على سيدنا محمد وعلى اله وصحبه اجمعين<br />اصحى ياغافل وكفاك استمرارا في محاربة الاسلام"
archived = "2010-03-14"
