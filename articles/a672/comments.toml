text = "الى امير الانسانيه الوليد بن الوليد اكتب لك الان وانا ابكي يااميري العزيز انا لاريد مالا او جاه انا امرأة مطلقه عمري 30 سنه وعندي بنت واعاني من حالة نفسيه نتيجة القمع والظلم الاسري والاجتماعي والقانوني تقدم رجل مسلم غير سعودي لخطبتي ولكن القانون ليس بصالحي واصبح الموضوع شبه مستحيلا تسكرت كل الابواب بوجهي الا باب ربي العالمين الذي وضعك في طريقي ارجوووووووووووووك ساعدني ياسمو الامير انا لاكل ولا انام جيدا انهارت قواي والمجتمع ظالم اعيش على المهدئات وفكرة الانتحار تراودني كثيراولكن عندما افكر بوجود امثالك يسطع الامل بنفسي من جديد دمعتي لم تجف انا لم اطلب سوى حقي الشرعي النبي الكريم قال انا اكل واشرب وانكح فمن رغب عن سنتي فليس مني انا لااتمنى من هذه الدنيا الا ان ارتبط بالرجل الذي احببت واحصن نفسي بالحلال وابتعد عن الحرام ارجووووووووووك انا اكثر الطامعين بمساعدتك انا لااستطيع كتابة رقمي لاني لااعرف هل ستصلك رسالتي ام لا ارجوك فرج عني نور الله لك قبرك وجعلك من اصحاب جنة النعيم"
