text = "انا موطنه سعوديه ارمله ولدي 4اطفال كان زوجي رحمه اله يعمل في احد المؤسات الملوكه للدوله ويساهم فيه الامير الوليد باقل من النصف توفي زوجي ولم يترك لنا سوا راتب تقاعد لايكفي اجار المنزل ونفقات التعليم والنقل ولايوجد لدينا اي دخل اخر كل امنيتي منزل ملك يحميني انا وابنائي من ظلم الناس واهانتهم ارجوا من سموكم الكريم النظر في طلبي فانا لااريد سوا الحياه بكرامه لاريد تجاره ولاغنى فقط منزل جميل اعيش فيه مع ابنائي يكون ملك لن وانتم خير من يحفظ لنا كرامتنا بعد الله وسوف ندعو لك بطول العمر والصحه انا وابنائي الايتام ارجو من اي مسؤل يرى طلبي ان يبلغه الامير الوليد وله الاجر والثواب ويكون مسؤل امام اله يوم القيامه عن رسالتي ولكم جزيل الشكر"
