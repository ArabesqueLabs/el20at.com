text = "كل مال الوليد بن طلال حرام لأنه لم يجمعه من الخير وان كان هناك بعض ماله حلال فان وجود المال الحرام بجانب الحلال يجعله حراما وهذا في اصح اقوال العلماء لو كان الوليد رجل خير لوجدنا الكثير من شباب العرب يعملون ويتزوجون ولكن انتشر الفساد في العالم العربي والاسلامي بسبب قنواته القذرة التي تثير غريزة الشباب عموما كل ال سعود قذرون الا من رحم ربي انا لا احسده علي ماله ولكن اغلبه مال حرام الوله تصرف علي آل سعود بالآلآف وهناك فقراء في السعوديه والعالم العربي لا يجدون لقمة العيش وكما نعرف أغلب بترول العالم موجود في السعودية والتي لا تحسن استخدامة او استغلاله لصالحها بعكس الشركات المسيطرة علي بترول العالم فلو استغل بترول السعوديه والعالم العربي استغلالا جيدا لن نجد عربيا محتاجا وكما نري زادت البطالة بشكل كبير مما يؤرق الجميع الا يستطيع امراء السعوديه واغنيائها ان يصححوا من وضع العرب ويساعدوا علي توفير الوظائف للشباب ويساعدوا في تزويج الشباب بدلا من افسادهم وكما نعرف ان العنوسه في السعودية بلغت حدا كبيرا هؤلاء هم أمراء السعوديه وأغنياؤها الذين يدعون التقوي وعمل الخير انا لا احسد المير علي ماله ولكنه كسبه بطريق غير مشروع علي الاقل اغلبه فمثلا هناك أغنياء غيره مثل بيل غيتس الذي يملك علي الاقل ثلاثة اضعاف ما يملك الأمير ومع ذلك يصرف الكثير من ماله لعمل الخير وخاصة في بلاده ولشعبه فرجل مثله وهو اعني شخص في العالم وصل لثروته من خلال علمه ونجاحه في استثمار ثروته صحيح ان الامير استثمر ثروته ولكنه استثمرها في الحرام اما بيل غيتس استثمر ثروته من خلال شركته مايكروسوفت التي لا يستغني عن منتجاتها احد في العالم وهو لم يفعل حراما علي الاقل في دينهم اما الوليد فعل اقذر ما نتوقع لا يغرنا ما يقال عنه ليس غريبا ان يضم قناة اخري لسلسلة قنواته روتانا تعرض الافلام الاباحيه علنا وان رجلا مثل بيل غيتس فعل اكثر مما فعل الوليد لشعبه العربي المسلم فقد وظف الكثيرين من العرب المسلمين وفعل لهم اكثر مما فعل الوليد هذا بخلاف ما فعله لشعبه ووطنه وأ{جوا من الله ان يهديه للاسلام وارجوا من الله ان يعيد الامير الوليد لطريقة المستقيم ويهديه الي الحق لكي لا يسألأ يوم القيامة عن السعب العربي المسلم الذي افسده بقنواته والتي تعتبر اكثر القنوات مشاهده في العالم العربي . أ{جوا من الله لهم جميعا الهدايه . والسلام عليكم ورحمة الله وبركاته"
