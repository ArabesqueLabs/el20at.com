[[comments]]
order = 4
subject = "الليلة الكبيرة"
text = "اوبريت<br />الليلة الكبيرة<br />بنات:<br />قبة سيدنا الولي دول نوروها .<br />محلا البيارق والناس بيزوروها .<br />قبة سيدنا الولي في الجو عالية.<br />محلا البيارق لما نوروها.<br />بائع:<br />حمص حمص<br />تل ما ينقص<br />عالنار يرقص.<br />يرقص يرقص<br />ويقول .<br />اللي شاف حمص ولا كلش .<br />حب وتلوع ولا ولا طالش.<br />فتاة:<br />يسترك هات حبه بقرش.<br />الجميع: هاهاهاها.!<br />بائع:<br />حمص حمص ....الله<br />طعمية ,<br />الله ... الله... باللوز,<br />الله ...عجمية الله....<br />اراجوز ,<br />الله ....<br />المجموعة:<br />الليلة الكبيرة ياعمي والعالم كتيرة.<br />ماليين الشوادر يابه<br />م الريف والبنادر.<br />دو فلاحين ودول صعايدة<br />دول من الكانال ودول رشايدة.<br />الليلة الكبيرة ياعمي والعالم كتيرة.<br />العمدة:<br />ياحضرة الاراجوز قول لي ,<br />الاراجوز:<br />نعم ياعمدة عاوز ايه .<br />العمدة:<br />منين يروحوا لمتولي ؟<br />الاراجوز:<br />امدح نبينا وصلي عليه .<br />العمدة:<br />اللهم صلي عليه.<br />الاراجوز:<br />تمشي كده على طول على طول .<br />لحد ماتلاقي عمارة.<br />تدخل يمين تسأل بتاع فول<br />دكانته على ناصيه حارة.<br />المجموعة:<br />دكانته على ناصيه حارة.<br />تدخل يمينك في شمالك..<br />شارعين وفي التالت تفتر<br />على اليمين واخد بالك<br />وتمشي على طول تتمخطر.<br />العمدة:<br />وامشي على طول واتمخطر!,<br />الاراجوز:<br />تفضل كذا تمشي وتدب ..<br />وتخش من مطرح ما طلعت<br />ولما تلقى مقلب لب .<br />العمدة:<br />ولما القى مقلب لب .<br />يارب انك تهت وضعت !<br />العمدة:<br />دي وصفه هايله , دي وصفه سهله .<br />المجموعة:<br />مع السلامه , مع السلامة ,<br />مع السلامة يابوعمة مايله .<br />مع السلامة يابوعمه مايله<br />لاعب البخت:<br />فتح عينك , تاكل ملبن .<br />فينك فينك , تاكل ملبن.<br />اوعى لجيبك .. لاالعيب عيبك<br />, قرب ... جرب ... نشن<br />وسطن ايدك وسطن.<br />إضرب..<br />(البندقية: طاخ!<br />اللاعب:<br />يحميك يابني تبقى غالبني.<br />قرب خد لك حتة ملبن.<br />بائع:<br />فريرة للعيل..<br />يابو العيال ميل.<br />خد لك سبع فرارير..<br />زمارة.. شخليلة..<br />عصفورة ياحليلة..<br />طراطير ياواد طراطير!<br />المعلن:<br />الليلة السيرك تعالوا دي فرجة<br />تساوي جنية . قولوا هيه..<br />بمناسبه هذا المولد يوجد<br />برنامج سواريه... قولوا هيه .<br />في السيرك شجيع يهجم ع السبع<br />ويركب دغري عليه ...قولوا هيه ..<br />وبنات قمرات زي الشربات<br />حلوين مش عارف ليه... قولوا هيه.<br />بائع:<br />سمك مقلي كل وبرق لي! صنف زي اللوز.<br />بائع:<br />استخار واختار<br />فشه أو ممبار .<br />يالله سمي وكل.<br />عجوز:<br />اسعى , اسعى , اسعى .<br />مصوراتي :<br />خد لك صورة سته ف تسعه .<br />العجوز:<br />اسعى , اسعى , اسعى.<br />قهوجي:<br />يا سي عجورة النار خسعة!<br />فلاح:<br />ناس من بلدنا هناك اهم.<br />روح يابراهيم انده لهم.<br />سلامات سلامات سلامات ..<br />سلامات ع البلديات.<br />فلاح:<br />دي الحضرة والذكر انجلى.<br />يالله بنا نذكر ياوله.<br />المنشد:<br />شفت ف منام صاحب المقام .<br />ده ابهه.<br />المجموعة: ده ابهه .<br />المنشد:<br />ويمامه حايمه عليه تسبح ربها .<br />المجموعة:<br />يانور النبي ...يانور النبي.<br />المنشد:<br />ميلت فوق يده وجيت احبها .<br />المجموعة:<br />أحبها .<br />المنشد:<br />صحوني م النوم<br />خدت بعضي وتني جي<br />تني جاي... تني جي.<br />الجميع : الله حي.<br />زفة المطاهر.<br />نساء:<br />يأم المطاهر رشي الملح سبع مرات .<br />في مقامه الطهر خشي وقيدي سبع شمعات.<br />أطفال:<br />ياعريس ياصغير .<br />علقة تفوت ولاحد يموت .<br />لابس ومغير وح تشرب مرقة كتكوت.<br />في القهوة<br />المعلم:<br />بالذمة دا سابع عيل.<br />مزفوف من وقت قليل.<br />القهوجي:<br />مولد شيلالاه يامعلم . عقبال اولادك.<br />المعلم:<br />كلمِ.<br />نداءات:<br />واحد مضبوط واتنين مصري.<br />القهوجي :<br />ع النار حاضر جايلك دغري.<br />يوزع تحيات:<br />مسا التماسي يا مسا التماسي<br />ياورد قاعد على الكراسي.<br />نداء:<br />هات شاي يا دقدق .<br />القهوجي:<br />عيني وراسي.<br />يدخل الريس حنتيرة مغن القهوه الصعيدي.<br />الجميع:<br />سمعنا ياريس حنتيرة ..<br />للصبح معاك السهيرة.<br />سمعنا.... سمعنا .<br />حنتيرة:<br />ياغزال ياغزال<br />ده العشق حلال<br />دوبتني دوب<br />خلتني خيال<br />ياشفتك فص فراوله<br />وانا لاقوه ولا حوله<br />شقلبتني عقلي علاولة<br />اه ياغزال<br />يارب ياعلم بالحال<br />تهدي حبيبي ويصبح عال<br />واغني وارقع بالموال<br />آه يا غزال<br />المعلم:<br />وقف ياريس حنتيرة .<br />في ناس هنا قاعدة كتيرة .<br />ولاحد قال هات تعميرة<br />ولاواحد شاي ,<br />المجموعة:<br />ولاحد قال تعميرة ولا واحد شاي .<br />المعلم:<br />اللي حيطلب رح يقعد.<br />والل ما يطلبش يبعد .<br />زبون:<br />يالابنا نخرج يامسعد شارع الترماي.<br />يخرجان!<br />في السيرك<br />المدرب :<br />انا شجيع السيمة .<br />ابو شنب بريمة .<br />اول ما قول \"عالي هوب\"<br />واصرخ لي صرخة<br />السبع يتكهرب ويبقى فرخه!<br />حالا بالا سأصارع .<br />اسد انما ايه؟ متوحش .<br />وح خلي في وجهه شوارع .<br />المجموعة: لا لا لا ما يصحش .<br />المدرب :<br />اهه جه اهه جه! تسقيفة بأه.<br />تسقيفه امال ,<br />تشجيعه اما ل .<br />تعالى لي يا حبيبي تعالى لي .<br />خارج القهوة.<br />الاخر :<br />اوعد يارب اوعد<br />آدي كمان قهوة .<br />الاول :<br />يللا بنا يامسعد ,<br />ندخل على سهوه!<br />في القهوة الثانية<br />الغازية:<br />طار في الهوا شاشي<br />وانتى ما تدراشي .<br />طرفه شاوري عليك ,<br />حكم الهوا ماشي .<br />حكم الهوا ماشي.<br />هوا العصاري . ياواد<br />على سطح داري ياواد .<br />خدني ورماني رماني<br />عليك هوا العصاري.<br />آهين ياناري ..منك ياجاري<br />خدني ورماني رماني عليك هوا العصاري.<br />صاحب القهوة:<br />اللي حيطلب راح يقعد<br />واللي ما يطلبش يبعد.<br />الزبون:<br />يالللا بنا نخرج يا مسعد شارع الترماي.<br />لعبه زق الطارة<br />صاحب اللعبة:<br />ورينا القوة .<br />يابني انته وهوه .<br />مين عنده مروة<br />وعاملي فتوه .<br />يقدر بقداره على زق الطارة ويفرقع بمبه.<br />شاب:<br />وسع وسع وسع .<br />انا ازق الطارة<br />واضرب ميت بمبه .<br />دنا الاسطى عمارة<br />من درب شكمبة .<br />صيتي من القلعة<br />لسويقة الللا لا<br />انا واخد السمعه.<br />الجميع:<br />طب يالله تعالى<br />الشاب:<br />لاياعم سعيدة .. دي البدلة جديدة.<br />الجميع:<br />ها هاهـئا سعيده .. يابو بدله جديدة ..<br />سيدة:<br />ياولا د الحلال<br />بنت تايهة طول كده<br />رجلها الشمال<br />فيهاخلخال زي ده .<br />رجل:<br />زحمة ياولداه .<br />كام عيل تاه .<br />بائع:<br />فريرة للعيل<br />الجميع:<br />دي الليلة الكبيرة ياعمي والعالم كتيرة .<br />ماليين الشوادر يابا م الريف والبنادر."
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401071405/http://masr.20at.com:80/newArticle.php?sid=14288"

