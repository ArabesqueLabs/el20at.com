subject = "طاطى طاطى علشان يركب الواطى"
author = "ابو اسامة"
text = "انصحك يا ابنى متتفرجشى على القنوات المصرية احسن هتجبلك شلل انا فعلا شوفت الاعلان ده<br />وضحكت زيك كده برده وافتكرت اغنية (علشان منعلى ونعلى ونعلى لازم نطاطى نطاطى نطاطى)<br />معلش الواطى هيفضل طول عمره واطى علشان كدة عوزينا نطاطى ونشتغل اى حاجة علشان<br />يكسروا نفسنا .بس ياريت يكملوا الاعلان ويقولوا لنا احنا هنعلى ازاى نمسك شىء مهم فى البلد<br />واحنا زبالين مثلا . طاطى طاطى علشان يركب الواطى"
archived = "2008-02-28"
