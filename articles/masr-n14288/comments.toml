text = "رضوى مبروك علىالمدونة ومبروك على الجواز لانى رغم انك كنت زlيلة لى فى احدى المطبوعات لكن اخبارك انقطعت يمكن انتى ما تفتكرنيش لكن علىالعموم مبروك الجواز انتى وعمرو وعلشانكم انا هعمل موضوع عن امبابة واسمحولى انى اعمل معاكم حوار بمناسبة انكم من سكان امبابة رضوى هحاول اسال شمس عن تليفونك عشان اوصلك انتى وعمرو واعمل معاكم الحوار ولو ياريت موافقين تبقوا تكلمونى على الموبايل 0112829576 عيسى جاد الكريم<br />J________________________________________<br />يا اخي واحدة ومتجوزه انت مالك ومالها"
