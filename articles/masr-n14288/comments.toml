[[comments]]
order = 10
subject = "حوار طرشان"
author = "انا"
text = "هو الموقع تحول الى شات والا اية<br />وكل واحد بيدور وبينشر رقم تليفونة وعامل نفسة حاجة محصلتش<br />هو كل واحد كتب سطرين فى مدونة افتكر نفسة صحفى<br />ما تتلم يا خويا انت وهو<br />وبعدين هو كل واحد اتخرج من قسم صحافة يبقى صحفى<br />امال مين يبيع طماطم وبدنجان<br />ويمكن كل اللى هيتخرج من قسم العلوم السياسية هيبقى سفير والا قنصل<br />انتم بتفكروا ازاى"
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401071405/http://masr.20at.com:80/newArticle.php?sid=14288"

