text = "انتي ازاي صحفية ومش عارفة تكتبي يا رب<br />الواحد لما يمد في الدعاء يا رب يقول يااااااااااااااااااااااااااااااااا رب يعني يمد الالف<br />مش يمد الراء يا رررررررررررررررررر ب ما ينفعش<br />علشان خاطركده انتي مش لاقيه شغل"
