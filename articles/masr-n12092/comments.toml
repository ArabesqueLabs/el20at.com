subject = "النقابة فى المصيدة"
author = "عكروت"
text = "نقابة اية واهميتها اية كل دة كلام فى الطراوة - الجماعة الصحفيين دول يتنيهم رجالة للاخر ويدخلوا السجن وبرضة السجن للرجالة<br />هيطلعوا من السجن ومعاهم شهادة موثقة من الداخلية يظهروها فى الحكم القادم والدولة الجديدة القادمة انهم وطنيون مقاومون وقفوا فى وجة الظلم<br />وهيعينوهم فى مناصب اعلى ويمكن واحد منهم يبقى وزير<br />نقابة اية<br />خللى النقابة تنقب على خراب عشها"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090713/http://masr.20at.com:80/newArticle.php?sid=12092"
