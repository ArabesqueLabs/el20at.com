author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-04"
text = "انا و اللة العظيم موش عارف الناس مخنوقة لية؟<br />المرور بايظ و كلة سلطة؟<br />النظام بقى اكتر من فوضى<br />الاخلاق انعدمت<br />عدم تطبيق القانون بقى هو القاعدة<br />رئيس مجلس الوزراء راجل محترم جدا و سايب الناس عايشة تعمل الى هى عايزة تعملة مفيش اى مشاكل<br />دكتور مهندس أحمد نظيف راجل ابيض زى الهواء؟! ليس لة(طعم و لا لون و لا رائحة)<br />ساكتين لية ؟ ما تروحو تتخنقوا و لا تروحو فى ستين داهية و تموتوا<br />(الشكوى لغير اللة مزلة)"
