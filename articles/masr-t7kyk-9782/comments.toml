order = 0
subject = "مصادرة السيارات المخالفة للمرحوم قانون المرور الجد"
author = "ممدوح زكى زخارى/الاسكندرية_مصر"
posted = "2008-08-03"
text = "للاسف نحن شعب لا يلتزم باى قانون مهما كان و لكن الحل الوحيد لعلاج الشعب المصرى من امراضة النفسية المعقدة تجاة ارغامة على احترام القانون هو كسر انفة بواسطة تطبيق العقوبات الرادعة و ليست الغرامات المالية<br />لماذا لا تتم مصادرة السيارات المخالفة لقانون المرور رحمة اللة و تحويل هذة اتلسيارات الى الخدمة العامة فى تخصيصها كاداة لحل ازمة المرور مثلما فعل عبد الناصر مندما صادر الاف السيارات النقل و خصصها للمجهود الحربى اثناء حرب الايام الستة اللعينة من شهر يونيو 1967م؟<br />و لماذا لا تنشر صورة المخالف فى الصحف الرسمية لمدة 3 ايام مع ملخص للفعل الذى ارتكبة المخالف و على نفقة المخالفليكون عبرة و قدوة لغيرة من المستهترين ذوى النفوس المريضة معتادى مخالفة القانون؟؟<br />حقا لو كنت انا فى مكان المسئولية لعرفت و علمت هذا الشعب ما هو القانون و كيف لنا جميعا احترام القانون و الذى لا يقل شانا عن احترام النشيد الوكنى و احترام العلم المصرى ايضا؟<br />ليس حراما استخدام العنف تجاة فئة مريضة من الشعب بمرض امتهان القانون و عدم احترامة<br />(المصادرة من اجل الصالح العام)خير علاج"
archived = "2010-03-14"
capture_url = ""

