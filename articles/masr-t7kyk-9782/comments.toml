subject = "يارب خلينى رئيس لمجلس الوزراء لمدة عام و بعدين موت"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-03"
text = "انا بصراحة اصبت بمرحلة احباط و قرف من تكاسل و بلادة هذا الشعب المسمى الشعب المصرى؟<br />اقسم باللة العظيم ان هذا الشعب قد اخطاء فى حق نفسة و حق الوطن بسبب كميات الحرية و الديمقراطية التى اعطيت لة<br />و اقسم باللة العظيم من اننى كفيل بتعليم هذا الشعب الادب و احترام القانون و النظام<br />و سوف يكون مبدئى الذى لا و لن احيد عنة(سيف المعز و ذهبة)<br />0صحيح شعب يخاف و لا يختشى)؟"
archived = "2010-03-14"
