[[comments]]
order = 5
subject = "غريبة قوى ازاى الناس مخنوقة و جالة المرور  كلها تس"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-26"
text = "خدعوك فقالوا انة يوةجد قانون مرور؟<br />و ان الانضباط و الالتزام اصبحوا الان سمة الشارع المصرى<br />و اللة هذا الكلام كلة كذب فى كذب<br />تعاوا الى الاسكندرية لتروا عجب العجاب و كلة مولد بلا صاحب؟<br />اولا قبل ان تفكروا بتطبيق المرحوم على شبابة المغفور لة قانون المرور ؟<br />تعالوا اولا و ازيلوا كافة اشغاللات الطريق على كافة اشكالها و صورها دون اية استثناءات لاى من يدعى انة كبير او مسئول او مسنود او و اصل او او او او من الحاجات الكتير اللى بنشوفها هذة الايام العجاب؟<br />اقسم باللة اذا طبق القانون بكل شدة و صرامة و بلا اية تجاوزات و تم توقيع الغرامات الفورية على الجميع بنص القانون و ليس روحة فسوف يكون لدى الذولة من المصادر المادية ما سوف يسدد الدين الذى عليها<br />المهم تطبيق القانون و القانون و حدة و ليس تطبيق الاستثناءات ايها السادة الافاضل<br />و للة الامر من قبل و من بعد"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "و زارة مرور ووزير مرور     (صدقونى) اننى لست امزح"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-26"
text = "اقسم اللة العظيم باننى لا امزح و لا استخف بعقولكم<br />لمازا لا تنشاء فى مصر و زارة للمرور اسوة بوزارة الداخلية<br />و يسند منصب و زير و زارة المرور الى لواء من ادارة الشرطة العسكرية بالقوات المسلحة المصرية التى اراهن عليها بانها كفيلة بضبط الشارع المصرى من الانسشياب اللاحضارى و اخلاقى<br />مسئولية تللك الوزارة هى تنظيم المرور عملا و ليس ادعاء و قولا<br />ازالة التعديات على الرصيف و الشارع معا دون اية استثناءات لاى فئة ايا كانت؟؟؟؟؟(اية كانت بمعنى الكلمة)<br />يجب ان يطبق قانون المرور على الجميع بم فيهم المواطن الذى يسير بنهر الطريق ايضا<br />للاسف الشعب المصرى اصبح معقد و مريض نفسيا بمرض اسمة (الجدعنة)و هو فى الواقع الاسم العملى لهذا المرض هو(التناحة و قلة الادب و التربية و الزوق)<br />التباهى و التفاخر بمخالفة القانون اصبح ظاهرة يجب الا تفوتنا حيث ظاهرها و باطنها هو اظهار عوامل النقص و الحقد و التباهى بما اعجز عنة الا هو التباهى و التفاخر و اظهار عن عير حق بانة من النخوة المحظوة الواصلة بالمجتمع و انهم من زوى الواسطة الكبيرة المهمة الا و هى (الكعب العالى) اياة كارت النساء اياهم اللى المجتمع بثقهم و تبولهم فى بلاليع الاحتقار؟<br />و زير مرور يراس و زارة مرور عملها الاساسى هو عودة النظام للشارع المصرى بكا السبل و الكرق و تطبيق القانون بلا اية استثناءات للا شفقة او رحمة و حتى لو اقتضى الامر الضرب بالجزم على راس اى مواطن او مسئول ايا كان يعتقد نفسة انة مسنود او فوق القانون<br />القانون هو القانون؟<br />و للحديث بقية لاحقا و شكرا على تصديقى حقا اننى اقول الحق و لا اكذب"
archived = "2010-03-14"
capture_url = ""

