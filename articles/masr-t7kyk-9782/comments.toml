[[comments]]
order = 8
subject = "حبيب قلبى  ------------------معلش احنا بنتكلم"
author = "ممدوح زكى زخارى جرجس-الاسكندري"
posted = "2008-09-03"
text = "حبيب قلبى<br />اقسم بجلال اللة ما انا باهزر او حتى بادجل!!!!!!<br />و اللة العظيم لا بد من انشاء و زارة مرور و يراسها لواء من ادرة (الشرطة العسكرية) التابعة للقوات المسحة المصرية؟<br />لواء شرطة عسكرية ابن ابوة و امة و شارب من لبنها؟ لواء قوات مسلحة راجل بمعنى الكلمة لا يعرف المجاملات و المحسوبية و لا الوسائط كمان؟<br />و معلش احنا بنتكلم؟!!! يا حبيب قلبى (مع الاعتذار للفنان أحمد ادم)<br />و ياريت يكون دكتورنا نظيف صاحى علشان يفهم الرسالة بحق و حقيقى؟<br />و (معلش احنا بنتكلم) ها ها ها ها ها ها<br />و رمضان كريم و كل عام و مصرنا بخير و رفاهية و تقدم!!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "ما تيجوا نخصخص المرور بمصر    (فكرة للمناقشة و الت"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-03"
text = "خدعونا و قالوا انة يوجد قانون مرور جديد فى مصر<br />هى المسئولين عندنا موش ناوية تبطل خترفة ؟ (فاقد الشيئى لا يعطية)<br />اقتراحان لا ثالث لهما:_<br />1- خصخصة جميع ادارات المرور فى مصر و اسناد الادارة الى عساكر مرور ما تسمى جمهورية البنجلاديش؟<br />أو<br />2-تسريح جميع ضباط المرور بمصر و اعطائهم اجازة مفتوحة و باجر كامل كمان؟<br />و كلى ثقة من ان هذا سوف يكون افضل من هذا البلاء المسمى ادارات المرور بمصر المحروسة؟؟؟؟؟<br />و حقا اتحدى؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
