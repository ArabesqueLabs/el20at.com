subject = "ربنا ينتقم منكم"
author = "باسم"
posted = "2006-06-23"
text = "يارب خلصنا من العالم الجهله المتخلفه اللى زينا احنا عارفين ليه علشان احنا بنمشى وراى كلام القوى وبنبعد عن الحق يعنى بالله عليكم يطلع ايه تامر حسنى ده من الراجل اللى وقفلنا كلنا علشان مصالحنا وهو يا عينى عليه محطوط فين محطوط فى مكن مش مكانه اللى هو ايمن نور الراجل كان قادر يعيش ملك ولالا كان ليه فى كل ده بس هو فضل انه يتهان بسببنا بس ياريت الناس تفوق من الوهم اللى هما عايشين فيه كام سنه سكتين على الظلم ومبنتكلموش عايشين كالبهيمه بال اضل يا ناس فوقوا بقى حرام عليكم الساكت عن الحق شيطان ارس ربنا يوفقنا لما يحبه ويرضاه اخوكم باسم"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161619/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 320
subject = "متي تنتهي المهزلة"
author = "احمد عبد العزيز"
posted = "2006-06-24"
text = "انا مش عارف أمتي هتنتهي المهزلة دي محسسني ان تامر دة استغفر الله العظيم ( رسول ) اية ياجماعة هو تامر دة اية انسان مجرم وزور عاوزين اية تاني امال لو ماسك منصب في الحكومة كبيركان عمل اية ارحمونا بقي ياتري لو راجل من رجال السياسة او الدين كنتوا هتعملوا اية المشكلة احنا بلد بندور علي التفاهه ياريت نفوق من الوهم اللي احنا فية. انا معاكوا ان تامر طيب وصوته حلو بس اية لزمة ان واحدة ترفع يافطة وتقول خرجوا تامر من السجن تامر مظلوم مع انوا ارتكب جريمة زي اي واحد ارتكب جريمة والسؤال هو لو تامر دة زي اي واحد كان حصل اللي حصل دة. لو رديتوا علي السؤال دة هتفهموا التعليق دة !!!!"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161619/http://masr.20at.com:80/article.php?sid=316"

