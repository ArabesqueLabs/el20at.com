subject = "المغلوب على أمره"
author = "عبده"
posted = "2006-05-18"
text = "بجد مش عارف اقول ايه بس اللى هقوله هخاطب فيه القلوب اللى بتحب الدين وبتغير عليه مش القلوب اللى بتب تامر ولا غيرهيقول رسول الله صلى الله عليه وسلم (يحشر المرء مع من احب)صدق رسول الله انا بحب رسول الله وان شاء الله هكون معاه وهيفتكرنى يوم الحشر مش عارف بقى الناس اللى بتحب تامر دى هيفتكرها وهيكونو معاه كل واح يجاوب على نفسه وتانى امر من حق الدنمارك تسب رسول الله ما دامت امته تحب اشياء تافهه امت رسول الله خير الامم بيحبو راجل عادى وياريت يكون راجل حته وعايزيين نخلى الدنمارك تعتزر على الاسائه بس الدنمارك مش سبت الرسول صلى الله عليه وسلم دول شتمووووووو امته وداسو عليها بالنعال اما رسول الله فلو اراد الله ان يرد عليهم لفعل فيهم ما اراد لصخطهم قرود او صلط عليهم القمل والضفاضع واحنااااا بنحب تامر طيب لو تامر ده دخل النار والعياذ بالله منها احنا نروح معاه سيدنل عمر بن الخطاب يحب رسول الله اكتر من نفسه التى بين جنبيه واحناااااا للاسف نحب تامر وعمرو وهانى وهيفا وروبى طيب هنحرر القدس ازاى بدول مش عارف ولا لما يخرج تامر يروح يغنى عن القدس ويعمل حفله كويسه يخلى الخنازير يرجعو القدس للمسلمين... كنت مغلوب على امرى وانتو اخباركم ايه دلوقتى اميلى للرد المباشر ellool_201020202005@yahoo.com"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

