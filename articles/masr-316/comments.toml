posted = "2006-07-13"
text = "ياناس والله تامر اتنصب عليه عيزاكم تعرفو ان تامر جواه طيب جدا ومسامح بس انتم لازم تلومو الي خدعوه مش الي اتزلم ياناس تارم مضلوم . فكرين لما غنى حبيبي وانت بعيد كل العالم ارتحتلو لانو صادق في كلامو وفي غناه واهو لس موجود. يبقا ليه لان الانسان الطيب بيفضل ديما بس لو سمحتم تامر مرة بازمة واحنا بشر ومسلمين لازم نساعد بعض .ولو بقلوبناوالي مش بيحب تامر ميقلش عليه كلام وحش .وانا اتحدى كل من يشتم تامر."
