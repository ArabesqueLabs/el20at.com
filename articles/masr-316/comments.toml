text = "تخيلوا معي موظف بسيط اكتشف انه مزور شهادة الخدمة العسكرية ومزور شهادة الكلية تخيلوا بقة حكم المحكمة ح يبقى عامل ازاي ..<br />الواحد مش عايز يشمتم في واحد تافهة وفاشل زي تامر حسني ده علشان ماياخدش على قفانا حسنات ..<br />وبعدين الناس متغاظة لية من البنات اللي بتحب تامر انتو لو تبصوا كويش شوقوا البنات دي بتلبس اية في الشارع الضيق والمفتوح وكل واحدة فرحانه ببزازها وطياظها دي بقت بلد شراميط ومنايك<br />والمصيبة انهم بيقولوا على نفسهم محترمين دول مخرومين ولا مؤاخذة<br />كس ام اي بنت علقة ومتناكة<br />جاتنكوا القرف"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

