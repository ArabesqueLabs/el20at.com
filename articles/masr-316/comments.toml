text = "انابحب تامر حسنى وهواتنصب عليه وبصراحه انتوا بتكتبوا كلام جارح صحيح ان الفنان لازم يكون قدوه بس مين عالم مش يمكن يكون مظلوم هو انتو شفتوا وهو بيزور. ربناهو اللى شايفو ولو كان غلط عقابه عند ربناولو كان مزورش صحيح ربنا مش ممكن يظلمه.انا كل اللى عايزاه اننا مانظلموش عشان هو ممكن يكون فعلا حد ضحك عليه زى مابيقول."
