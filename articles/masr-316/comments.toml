subject = "المطلوب تعليق على الصور مش نشتم في بعض؟؟"
author = "nile lover"
posted = "2006-05-26"
text = "يــــــــا جماعه<br />اعتقد انوا المطلوب في الصفحه ديه انوا انتوا تعلقوا على صور تامر حسني ...مش تشتموا في بعض..<br />ولا انا غلطانه؟؟؟<br />وبعدين انا بطلب من المسؤلين على الصفحه ديه ..يا ريت ما تعرضوش الا المواضيع المتعلقه بالموضوع نفسه...<br />عشان ما يكنش الموضوع سلطه<br />بعدين الي عاوز يعلق على الصور يا رييييييييت يا جماعه please باحترام شويه<br />وبعدين انا كلامي ده لكل إلي كتب كلمه وحشه في حق تامر<br />اهو احنا كده ما نصدق نلاقي حد نشمت فيه ....هو ده الي مودينا لورى<br />وبعدين ما تنسوش انوا تامر اخونا في الاسلام..والاخوات بيحترموا بعضهم..ويقفوا مع بعض في المحن..هو ده الي وصانا بيه دينا ...ما تنسوش ده يا جماعه ارجوكوا<br />وبعدين...كلامي دلوقتي للبيشتموا في مصر<br />هو ده لي قدرتوا عليه....وبعدين انا نفسي افهم...هو يعني احنا عملنلكوا ايه .زعشان تشتمونا بالكلام الجارح والقذر ده<br />يا جماعه كل الكلام الي بتقلوه ده بيدل على اخلاقكم الي ماشاء الله شيفاها راقيه جداونعم التربيه والله<br />وفي النهايه .ماتنسوش انوا احنا عرب يعني في وطن عربي واحدولازم نحط ادينا في ادين بعض مش نعقد نشتم بعض نشتم الناس ونشتم امهاتهم."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

