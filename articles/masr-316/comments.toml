subject = "بنت فلسطين بتحبك وشعب الفلسطيني بحبك"
author = "رناد"
posted = "2006-10-06"
text = "تامر احنى كلنا كنا معاك كان قلبنا موجوع عليك اكتير بس احنى كنا عرفين انك ملكش دعوه بلحكايه دي وكنا وثقين ببرئتك وانا بقول للي تكلمو عليك بلهجه مش كويسه الله يخدهم ومين ما كانو يكونو انا بعشقك وبحس بيك وانا بدرس دراما وتمثيل نفسي اجي مصر امثل معاك وشوفك اقدامي مش على التلفزيون ونا بتابع اخبارك دايمن الف الحمدالله على سلامتك بحبك اوي اوي مش عارفه اعبرلك بس بجد بحبك نفسي تيجي على فلسطين وسدقني ان جيت مش رح تندم ابدان بلعكس رح تروح وانت مبسوط لانو جمهورك كبير بفلسطين بحبك بنت فلسطين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062241/http://masr.20at.com:80/article.php?sid=316"

