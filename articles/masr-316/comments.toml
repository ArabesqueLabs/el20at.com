[[comments]]
order = 200
subject = ".حبيبي يا تيمو"
author = "مريوم"
posted = "2006-05-25"
text = "يا كويتي يا ابن الوسخة.بلدك من غير المصريين تتمسح من عالخريطة.<br />والله هيلعنك انت.بتلف وترجع.<br />وبشكر اللي بيدعو اننا نحشر مع تامر.لأنو ان شاء الله هيدخل الجنة.لأنو تاب.يعني ربنا هيغفرلو وانتو لأ.<br />(ان الله يغفر لعباده ويعفو عن كثير)<br />بحبك بحبك موووووووووووووووووووت يا تامر.يا عمري."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 201
subject = "أنا مريوم.رجعت عشان الكويتي"
author = "مريم"
posted = "2006-05-25"
text = "ونسين أقولك يا الكويتي يا حقير.المصريات أشرف من الشرف ذات نفسة يا ابن الزانية.<br />ولا أعمى مش بتشوف الكويتيات العاهرات يا وسخ يا جزمة يا خرى.يا رب ما تدخل الجنة.<br />وان شاء الله باذنه واحد أحد هيعذبك في جهنم يا أسفل السافلين يا واطي .<br />كس على أمك انت يا ابن الوسخة يا عاهر يا حقير يا حثالة العرب"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 202
subject = "ياكويتي"
author = "عاشقة تامر"
posted = "2006-05-26"
text = "يا كويتي يا تافه انت مصر حتفضل ام الدنيا مش مثل الكويت اللي ماشية بصيطرة احتلال وبتبيع الدول العربية لمصلحتها<br />لوكانو المصريين باهلشكل ليه يروح ولادكوا يدرسو بمصر يا متخلفين<br />وعلى فكرة انا مش مصرية بس الحق ينقال<br />وهم على راسك فاهم"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

