text = "السلام عليكم يا تامر ربنا معاك فى هذه المحنه و ان شاء الله ترجع اللى اعمالك و دة يعتبر اختبار من ربناو ان شاء الله ترجع اقوى من الاول لانك انسان كويس جدااااااا و انا بحبك و بحترمك ونفسى تكون احسن الناس انا بكتب شعر و نفسى انك تقرا اللى انا بكتبه ة تقولى رايك فيه ايه و يا ريت تراسلنى على الايميل بتاعى لانى مش عارفة اوصلك بقالى خمس سنين بحاول اوصل ليك او اجيب تليفونك و ايميلك و مش عارفة خالص ارجوك يا تامر نفسى انك ترد عليا ترجع بالسلامة ان شاء الله"
