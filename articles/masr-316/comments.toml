[[comments]]
order = 53
subject = "والله عيب عليكم كلكم"
author = "ساره"
posted = "2006-05-18"
text = "أنامستغربه اوى اللى زعلانين على مصر و على بنات مصروحال مصر و عمالين شتايم فيها و فى أهلها,عيب أوى الأسلوب ده يا محترمين با شباب الجامعات يا مثقفين ,انا بنت و بحب تامر وبحب أغانية وتعاطفت معاه علشان بحبه وأى حد بيحب أى حد بيدافع عنه حتى لو غلطان لكنى مكنتش over كده و نزلت الشوارع ولبست t-shirt i love you tamer والحاجات دى بالنسبه لى over و ده مش معناه أنه مغلطش هو غلط واتحاسب و يجماعه خلونا نفترض انه فعلا مش عارف المتهم برىء حتى تثبت أدانته غير كده ما فى الاف غير تامر بيتهربوا من الجيش سواء أعفاء أو وسطى اللى محمؤين كده لو كانت جتلهم الفرصه دى كانواهيقولوالا والنبى عايزين نخش الجيش يا ريت كل واحد يبص لنفسه وكمان الطريقه اللى بنتكلم بيها هى اللى بتدل على خلفيتناعيب أوى الشتايم دى سواء على تامر أو مصر أو بنات مصر زى ما كل حاجه فيها الوحش و الحلو كمان تامر كده و مصر كده و بنات و ولاد مصر كده وكل واحد عليه أنه يختارو ياريت على الsiteدى يكون فى رقابه على الحاجات اللى تخدش الحياء العام.(بالمناسبه يعنى المحاكمه كانت كوميدى وفنيه جدا واضح أنه كله متئبك جامدكانت عامله زى الreal tv لما هيقولوا ال nominee , وقررت هيئةالمحكمه الحكم على الفنان تامر سنه مع الشغل و النفاذ ويسكتوا شويه وبعدينsurprise مع أيقاف الحكم.فنيه مش كده)"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

