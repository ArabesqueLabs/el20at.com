subject = "شرط اضافى"
author = "أمير"
posted = "2006-05-14"
text = "شرط اضافى سوف اضعه فيمن ابحث عنها لتكون شريكه لحياتى<br />الا تكون بتحب الندل اللى اسمه تامر<br />و حسبى الله و نعم الوكيل<br />ياناس فوقوا البلد بتغرق وانتوا عاملين من الفسل ده بطل<br />ده مزور شهاده الجيش و هربان من التجنيد و كمان شهاده الجامعه مفيش حاجه تبرر كل الغش ده<br />بدل ما تتحمقوا علشان الكائن ده فيه رجاله فى مصر بيدافعوا عن كرامتها و مستقبلها هما دول اللى لازم نهتف لهم زى القضاه الشرفاء و الصحفيين الشرفاء و كتير مظلومين بجد و مش علشان مكاسب شخصيه ده عشان كل واحد فينا يبقى حر و يبقى له كرامه مش عشان أاا أااا<br />جتكوا خيبه!!"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
