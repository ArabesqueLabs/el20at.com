order = 349
subject = "حبي تامر"
author = "بحبك يا تامر"
posted = "2006-07-03"
text = "لو سمحتوا كل واحد يحط لسانوه في زفت بئوه عشان لو كل واحد حصل كده لابنوه او اخوه مكنش هيحصل كده وبعدين كل واحد بيتفلسف واللي يشتم في تامر انته ايه عرفك انه مفتكرش ربنا غير دلوقتي وبعدين احنا اللي مضيعنا مش التفاهه اللي مضيعنا هو ان كل واحد بيفكر في نفسوه<br />ولا مكتفوش بكده بس كل واحد عمال يشتم في تامر وكأنه اجرم مع ان البلد كلها عايشه على التزوير وبعدين ازاي واحد بيتكلم عن<br />واحد مفتكرش ربنا وهو اصلا عمال يقول كلام<br />مش معفول ... لما كل واحد من اللي اتفلسفوا دخل وشاف ودرس القضيه مكنش هيقول كده طيب تامر ذنبوه ايه عشان الاخوه المحترمين اللي بيشتموا مش بيحبوه<br />هل ده سبب عشان يقولوا كده انا معرفش الناس ديه بتفكر ازاي .. انا صحيح مش كبيره عشان اتكلم او اغلط في حد كبير زي اللي شتموا بس انا كبنت في سني اقل حاجه تقولها عن الناس اللي شتموا دول ان هم معندهمش دين يخليهوم يحفظوا لسانهوم<br />... ارجو من اللي يقرأ التعليق ده يشوف التعاليق السلبقه عشان يفهم انا بتكلم في ايه وان يحاول معايا انه ينضف البلد من انثالهوم انا مكنتش هتكلم خالص لولا اني شوفت تعليق واحد نرفزني .... واتمنى ان كل واحد ينق بكلمه غلط يفتكر ان هفي رب هيحاسبوه على كل كلمه ... وشكرا"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074750/http://masr.20at.com:80/article.php?sid=316"

