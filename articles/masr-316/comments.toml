[[comments]]
order = 195
subject = "اتقوا الله"
author = "علا"
posted = "2006-05-25"
text = "انا بحكي لكل واحد شتم بالالفاظ الدنيئة الا كنت تحكوا فيها انكم متخلفين وهدا المتخلف الا بيحكي عن العدوان الثلاثي انو واحد اهبل وما بفهم شي ويارب تموت وبحدكي للبنت الا بتحكي ان الرسول بيغلط انا بحكيلها كلامك غلط لان الرسل معصومين من الغلط وكل انسان في الدنيا بيغلط وكل الا قال كلمة مش منيحة بتكون فيه هو وفي مثل اذا طلعت العيبة من اهل العيبة ما تكون عيبة واتقوا الله الكلاب تعوي والقافلة تسير وكل انسان متاكد انه يدين للاسلام بصلة يراجع نفسه لانو الا بتغلطوا عليه بيفضل مسلم التوقيع فتاة الساحل فلسطين التاريخ 25 -6 -2006"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

