[[comments]]
order = 214
subject = "كويتية جربة متخلفة"
author = "فلسطينية"
posted = "2006-05-26"
text = "يا كويتية يا معفنة كل خرة انت ولك يا عبيطة فلسطين بتشرف انت وكل الا جابوكي لولا الفلسطينية كان ما عمركم صرتم دولة كان زمانكم بترعوا غنم هههههههه يا جواسيس يا خدامين اميركا ابوكم بوش وسيدكم شارون واميركم هو الا باعكم وسلم بترولكم للامريكان وبعدين انتي شو بتفهمي في الدنيا غير تطفحي كبسة هههه وتلبسي دراعات يا هبلة انا متاكدة انو انت اصغر منك في السن لكن اكبر منك بالعقل يا خلل يا عبيطة انا عمري 17 وانت 73 يا تيتة احترموا التيتة يا اطفال هههههههههههههه وفلسطين حب وامل الجميع وما تردي افضل الك اذا رديتي مش حيحصلك خير تامر حبيب الشعب الكويت فيها فجور اكتر من مصر بس انتم من تحت لتحت يا حلوة"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 215
subject = "كويتيه وارفع راسي"
