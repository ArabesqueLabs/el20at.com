subject = "المحكمة كوسة"
author = "علاء"
posted = "2006-06-25"
text = "تامر مين و بتع مين اية البنات بقة تافهه اوى كدة لية انتم فعلا الواحد ما يفكرشى يتجوز اى بنت عربية لانكم بقيتة هبل و تافهين و معلومة ليكم القضاء المصرى معرص يعنى القضية اتكوست و مش بعيد تكون مشيت برشاوى و احب اقولكم انة تامر مش مظلوم الجاهل و العبيط هو اللى بيقوول انة مظلوم او اللى يصدق الكلام الفارغ دة هو فعلا هربان من الجيش و ممعهوش غير ثانوية و مزور شهادة بكالوريس"
