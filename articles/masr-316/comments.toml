subject = "بحبك يا تامر يا حسني حب محبوش انسان"
author = "مغرومه في تامر حسني"
posted = "2006-07-18"
text = "حرام هذه كله يصير في تامر انسان رقيق ورومنسي ومايتحمل كل هذه وتامر انسان طيب وحسبي الله علي الي كان السبب والله يطلعك لنا بسلامه والله لك وحشه يا تيمو وكانت لي معاك احلي ذكريات ومنها لم عزمتك علي المطعم وتغدينه مع بعض وصورت معاه واخذة عنوان بيتهم واخذة رقم الموبايل وكنا انا وتيمو علي اتصال علي طول وامانه هذه ذكريات تنسي مع تامر حسني وراح اروح باجر ازوره في المحكمه توصون اوصل ليكم سلام واذا حد عايز حاجه اقول لتامر يقول لان انا بعرف تامر عدل بحبك ومعنديش كلام اقول اكتر من كده وكل الكلام الي حقوله عن تامر شويه في حقه مع السلامه"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124718/http://masr.20at.com:80/article.php?sid=316"

