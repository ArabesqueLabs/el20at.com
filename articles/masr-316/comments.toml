text = "شو هالكلام يا جماعة حرام عليكو هلحين تامر بطل كويس<br />طب والله تامر زي النسمة لذيذ كتير وعسل ومؤدب ومحترم وحرام هيك تحكو عنو<br />ربنا يوفقك يا تامر وتخرج من السجن واحنا مستنينك ع نار يا قلبي<br />حتى لو احتجت اكتر من سنة برضو احنا منحبك ومهما يقولو عنك احنا عارفينك<br />تجنن يا عسل تجنن<br />ربنا يخليك النا يا تيموووووووو<br />انا بحبك مووووووووووووووووووووت"
