text = "ما تهتم والحبس للرجال شو يعني انتا انحبست مش في قضية شرف علشان تحرجك او توقف مصيرك احنا بنحبك وراح نضل معك حتى لو على الموت اطلع وارجع احسن مما كنت واحنا وراء بندعم خطاكوالله يوفقك<br />واعرف انو احنا عرفنا انو انتا الى سلمت حالك لأنك شريف ومعدن نظيف<br />والي بحكي عنك غير هيك بكون مش طبيعي<br />وطنشوا لانو جاهل صاروا يفتوا على حمل المصحف كمان والله زمن العجايب ولو ما ضل حدا يحبك احنا الفلسطينية بنضل وراء وان شاء الله بطلع عن قريب الله يوفقك"
