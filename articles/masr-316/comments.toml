text = "الحياة تجارب و الذكي هو اللي يبص للتجارب دي بنظرة ايجابية و يتعلم منها مهما كانت قاسية و تامر حسني اخطأ و احنا ملناش الحق في محاسبته لأنه ممكن يتجاهل كلامنا ونبقى بنرمي كلام في الهوا ملوش فايدة بس المهم انه يحس بخطؤه و يحاسب نفسه و ارجو من الولاد اللي بيشتموا بنات مصر انهم ميعمموش الكلام لان امك و اختك وبنتك من بنات مصر اللي انت بتشتمهم و مش كل بنات مصر اشتركوا في المظاهرات اللي انتوا انتقدتوها و انا واحدة من اللي معجبين باغاني تامر بس ما عملتش اللي عملوه دة و عايزة اوجه رسالة لتامر يا ريت ما ترجعش للغنا تاني"
