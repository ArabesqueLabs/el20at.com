subject = "استفر الله يارب"
author = "naya"
posted = "2006-10-26"
text = "السلام عليكم ورحمة الله<br />كل اللي عايزة اقووله ربنا معاك ياتامر حسني<br />لأنك بجد فنان مش بصوتك بس....لا بإحساسك ومشاعرك كمان<br />وعاايزة ارد على الردوود الزبالة اللي فووقي<br />على فكره انتو نااس بس بدووروا على جنازة وتشبعووا بيهاا<br />وانتوو بس غيرانين مش اكتر<br />اصل الانسان لما ينجح عندكم كأنه اجررم<br />وكل وااحد يبص في عيووبة قبل مايبص لعيووب النااس<br />وعلى قلتهم ياماا في الحبس مظاليم<br />تامرر خد ذنب ملووش يد فيه<br />لأنه انساان ومش ممكن يعمل كده<br />كلمه اخيررة ليك ياتامرر<br />انت حبيب الكل ولايهمك من الكلاب اللي قاعده تتكلم وتهوهوو عليك وحش<br />بحبك بحبك اووووووي<br />ناياا من مصرر<br />13 سنة<br />funky.girl0@hotmail.com<br />وسلام عليكم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062241/http://masr.20at.com:80/article.php?sid=316"

