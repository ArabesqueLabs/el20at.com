[[comments]]
order = 433
subject = "ليه كده"
author = "زعلانة منكم"
posted = "2006-07-20"
text = "مش عرفة اقول ايه للشباب الي مش متربي وعمال يشتم في تامر ومصر.وياريت المسؤلين عن الصفحة يتصرفو كده غلط وبعدين تامر فنان موهوب ومغني حساس وباحساسو وصل لقلوبنا.وانا عندي ادلة تاكد ان تامر اتنصب عليه.وياريت بلاش تشتمو في تامر تامر اتنصب عليه وكل الشباب الي بيشتم تامر غيران منو لان حلو وصوتو حلو.ايوة بنحب تامر بس سيبوه في حالو مش كفاية الي حصلو تشتموه ليه هو كان عملكم ايه.لو كان متهم كا اتحبس مكنشي طلع.والي حضرتكم مش عرفينو ان الاخ هيتم شاكر خدع تامر وقلو انا بعرف اشخاص حيعفونا من الجيش بس عشان شغلنا ميسمحش وتامر فكر اكتر من مرة ولقى انو لو راح الجيش ممكن جمهورو يتخلى عن مغني كتير حبوه.وعشان كده وافق مش عشان يزور لا لانو افتكر ان في طريقة ممكن تعفيه عن الجيش وتامر بيحب مصر ولا يمكن يخنها انتم مش عرفين مجال الفن ده صراع وفي نقاد كتير لو الفنان غاب فترة قصيرة بتصرفو بيحولو يمحوه من الساحة الفنية وده الي خلى تامر ميرحش الجيش خاف على فنو .والله تامر مضلوم"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090819/http://masr.20at.com:80/article.php?sid=316"

