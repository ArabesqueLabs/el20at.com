author = "حازم"
posted = "2006-07-04"
text = "والله بجد مستغرب مش عارف الدنيا قامت وقعدت لية علشان تامر ياجماعة نفرض اللى زور دة ابن نا فقراء او غلابة كانت الدنيا هتقوم وتقعد كدة والبنات اللى بتعيط دى بتعيط على اية وبسالهم انتوا عيطم مرة من خشية الله ياجماعة فوقوا دة مزور وكونة انة بيقول مظلوم لالالالا مش مظلوم دة انسان حب ياخد كل حاجة ونال جزاة والمفروض لما يخرج ما نصدقهوش تانى والبنات دى تشوفلها مصحف وتقراة والشباب اللى لابسين تشيرتات مكتوبة عليها انا بحب تامر قولهم اية الخيبة التقيلة دى عملت اية فى قضية المسلمين ياترى البنات والشباب بيعيطوا على الشهداء والمجاهدين كدة ولا هيعيطوا لية كفاية عليهم يشوفوا تامر وهو نايم بين القلب وحاضن واحدة وبيقولها عنية بتحبك؟ بجد مستغرب ؟"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074750/http://masr.20at.com:80/article.php?sid=316"

