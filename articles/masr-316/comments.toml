text = "انتوا بتتكلموا عن واحد يما رافع راس مصر كتير بتشكروه كده .<br />و اتحدا اي واحد يجبلي انسان بشفافيه تامر بس نعمل ايه انت ناكرين للجميل و المعروف مش هاقول الا حسبي الله و نعم الوكيل فكل الظلم تامر و ربنا يسامحه و كمان بقول لكل الوقف معاه الف الف الف شكر لاني صدقت تامر من الرسايل الي عندي و ربنا مع المظلوووم و فووووق كل ظاااالم فهمتوا يا ناس خيخه."
