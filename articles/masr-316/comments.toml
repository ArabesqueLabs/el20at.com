[[comments]]
order = 337
subject = "يا ولاد البلد و لاد خيخه"
author = "محبه لتامر و ماما فاطمه"
posted = "2006-06-26"
text = "بس كلام صح ؟ انتو مش و لاد مصر انتوا موقع بيشوه صوره مصر افلوه احسن ليكم و من اهم الاسباب الي خلتني اقول الاكلام ده ان كل مصري يساعد اخوه المصري في محنته ، لكن انتو خيخه مهما تحولو الي اتكلك على تامر بشكل ده انسان حقير بذئ واطي و حقود و اخيرا و ليس اخرا بيغير من تامر اكمنوا واحد معجبينوا في الدنيا منتشرين في الخليج و علشان تتاكدوا كنت في الكويت بدرس في الجامعه الامريكيه و في اول يوم دخلت الجامعه شفت مجموعه كبيره متكونه من 18 ولد و 20 بنت في الجامعه بيحبوا تامر و طبعا الجنسيات متعدوش السوري و اللبناني و على راسهم المصرين و علشان كده لازم تعرفوا انكم غيرنين مش اكتر و ان حقدكم ده مش هيعمل حاجه مهما زاد حقكم و لمعلوماتكم عيزين تشوفوا الجروب ادخلوا ايجا فيلم في 1000000000000000000000000000000محب و انتو و لا حاجه و الي في الكويت و نفسوا يشفني في الجامعه الامريكيه في الكويت فاحنا جروب tamer lovers باي يا حصاله المصرين و المجتمع."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626150903/http://masr.20at.com:80/article.php?sid=316"

