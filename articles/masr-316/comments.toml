text = "يا كلاب ليش تجيبون سيرت الكويت ومصر مالت عليكن وعلى تامر وعقبال عندكم جميع ويا نوسه لا تجيبي كلمة الصلاة ويا عشقة تامر يا بنت الشرموطه ان تجيبي كلمه كويتي على لسانك ياويلك ميته لتكوني زوجة كويتي او ميته لتشتغلي بالكويت يابنت القحبه"
