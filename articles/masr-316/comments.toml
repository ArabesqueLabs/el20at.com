subject = "البلد دى بنت وسخه"
author = "المختل عقليا"
posted = "2006-05-14"
text = "البلد دى بتن وسخه وانا كرارت اسرق فيها علشان انا مش عارف لحق فين فيه يارب الامريكان يدخولو فيه على الاقل نعرف ال نحربه ونقتل الخونه ال اكلو البلد انا زهقت خلص مصر بلد المنيك الكل فيها نيك احلا حاجه فى البلد دى كل البنات لنيك والشباب كمان متنك اوى احه احه كسمك يمصر انا مصرى ولهى مصرى وزعلان عليها من الفتنه الى البهائيه ال النيك فى الشارع علنى ده النيك وصل خمسة جنيه لجعنه المحرومه من الاكل وكسمك يمصر ايم الخولات"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 14
subject = "آه يا بلد يا وسخة عمرك ما ح تنضفى"
author = "واحد من البلد الوسخة"
posted = "2006-05-15"
text = "يا نحنيح و يا نحنوحات يا أوساخ يا بتوع المسخ المخنث المزور اللى اسمه تامر حسنى 00<br />ألم يسمع أحداً منكم أن فى نفس يوم الشحتفة والمناحاة اللى عملتوها للوسخ تامر حسنى كان هناك شباب وشابات زى الورد بيطحنوا بهراوات أمن مركزى الوسخ \" حسنى \" لا لشئ إلا دفاعاً عنكم وعن مستقبلكم ومستقبل أولادكم يا أوساخ يا معفنين 00<br />شباب وشابات زى الفل يقبعون الأن وراء قضبان الوسخ \" حسنى \" لأنهم بيحبوا مصر اللى الوسخ تامر حسنى أتهرب من الانضمام لجيشها 00<br />أفيقوا شوية يا ولاد الكلب البلد بتضيع وانتم السبب بسلبيتكم وغباوتكم وغيبوبتكم اللى مش عايزين تفوقوا منها 00<br />أفيقوا أو موتوا يا أوساخ ياولاد الوسـ ,,,<br />وعلى رأى عمنا نجيب سرور<br />مصر بلد المنايـ ,,, والكل نا,,, فيها وحتى على الخريطة تلاقيها فاشخة رجليها"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

