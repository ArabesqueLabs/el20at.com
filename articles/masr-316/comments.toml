[[comments]]
order = 429
subject = "اللى مش بيحب تامر يبقى ولا بيفهم فى فن ولا حاجه وتامر خليفه حليم وازمه"
author = "كريم كامل"
posted = "2006-07-19"
text = "تامر مطرب محصلش زيه الا حليم وكل الناس بتحبه وعارفين انه مظلوم واللى بيقول غير كدا يبقى بيكلم نفسه ويا ريت ميكتبش كدا علشان محدش يضحك عليه ولازم كل الناس تعرف ان تامر اتضحك عليه مش كان عاوز يضحك على الحكومه يا ناس يا مفتريه وعلى فكره بقى الراجل ده كان رافع اسم البلد اللى هى هى مصر هتقولوا ليه علشان شوفوا مألف لحد دلوقت 3 افلا وغير الاغانى اللى كاتبها وملحنها واغانى تحتاج موهبه ولا تقوللى عمرو دياب ولا محمد فءاد تامر طلع غطى على ناس كتيييييير غير انه بيكتب اغانى وبيلحن لفنانين عربيين مثل حسين الجاسمى رزان نيكول سابا وغيرهم وفى الاخر احب اقول هنفضل معاك يا تامر وهترجعلنا بالسلامه انشاء الله وكل الناس عارفه انك هترجع اقوى من الاول بكتير و اللى بيحبوك واكيد ناس كتير اوى عارفين انك مظلوم وربنا معاك"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124718/http://masr.20at.com:80/article.php?sid=316"

