subject = "لماذا"
author = "محمد حافظ الحسيني"
posted = "2006-11-02"
text = "من هو تامر حسنس حتى يتم له كل الضجة الاعلامية والاهتمام واخذ الأراء مثل أي قضية تمس الامة الأسلامية المنهزمة والعربية الغير منظمة ولاتعرف أين هى من الأعراب ، من الاهتمام الاعلامي الذى رأيته على الشاشات والاعلام المقروء والمسموع بان الجنرال / تامر حسني قد جهز جيش من الفتايات والشباب المنحل لتحرير القدس والعراق ووقف الحرب الاهلية بالصومال ووالحفاظ على الامن القومي المصري بجنوب السودان وغربه ووقف الحرب الاهلية بالجزائر المسماه أرهاب وتحرير الجنوب البناني والجولان التي لم تطلق الحكومة السورية بقيادتها ذات الألفاظ العنترية بالتلفزيون فقط ووقف المد الأمريكي الصهيوني الماسوني بالمنطقة<br />يا أخوتي افيقوا من الغيبوبة التي يمر بها الوطن العربي والاسلامي وهذا ليس عيب من المجتهدين والشباب المظبوط ولكن من أنظمة الحكم التي تمارس حرب على الأسلام اخطر من امريكا والغرب المسيحي<br />أخر الكلام افيقوا من الوهم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062241/http://masr.20at.com:80/article.php?sid=316"

