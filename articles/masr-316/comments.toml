[[comments]]
order = 36
subject = "مبروك لحركة \\\"مُزز من أجل التغيير\\\""
author = "أسامة صابر مصطفى"
posted = "2006-05-17"
text = "أبدأ حديثي بسرد لتاريخ حركة سياسية وهو معروف للجميع ولكن لمجرد الذكر فقط، إن حركة \"كفاية\" المصرية وهي حركة سياسية شعبية نشأت بهدف إنهاء حكم الرئيس المصري حسني مبارك ومنع انتقال السلطة لابنه جمال، هذه الحركة التي اعتقل منها الكثيرون وسحل منها العديد، لا فرق بين شاب أو فتاة أو معوق أو حتى كبار السن المنتمين إليها.<br />هذه الحركة السياسية الشعبية التي تضم بين صفوفها شخصيات لها باع سياسي كبير مثل منسقها العام السيد جورج إسحق وأيضاً تضم أكاديميين من أمثال الدكتور عبد الوهاب المسيري.<br />أذكر كل هذا لسبب واحد هو أن أقول لحركة كفاية: \" للأسف، ظهرت حركة منافسة لكم عمرها أقل من شهرين ولكن تأثيرها أقوى منكم بكثير، ويبدو أنها ستقود النضال السياسي بدلاً منكم في المرحلة القادمة التي تعتبر من الفترات الحرجة التي تمر على البلاد.<br />حركة نضالية جديدة، أعضاؤها شباب كله حماسة، والفتيات فيها أكثر من الشباب، شباب ممتلئ قوة ورغبة في التغيير، يعني باختصار شباب يفرح القلب، شباب يجعلني أنام مستريح البال وقرير العين مطمئناً على حال البلد!<br />ما هي هذه الحركة الشبابية؟ وكيف تشكلت؟ ومن المناضل الذي أشعل فتيلها؟<br />\"حركة مُزز من أجل التغيير\" هي حركة شبابية تشكلت بعد اعتقال المناضل السياسي، البطل \"تامر حسني\"، هذا المناضل الذي تم اتهامه بعدة تهم، الواحدة منها هي تهمة تخل بالشرف، أورد عليكم تحقيقات النيابة كما جاءت بالمحضر، والتهم الظالمة الجارحة التي وجهت للبطل الثوري:<br />1- تزوير شهادة الخدمة العسكرية.<br />2- تقليد بواسطة الغير أختام شعار الجمهورية الخاص بكلية الآداب، جامعة حلوان.<br />3- تزوير شهادة انتساب لكلية التجارة، جامعة المنصورة.<br />4- استخراج جواز سفر، بمستندات مزورة.<br />ولكن يا فرحة قلبي بشباب مصر المحرو<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

