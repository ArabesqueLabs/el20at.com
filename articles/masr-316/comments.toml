[[comments]]
order = 83
subject = "حرام عليكو والمسامح كريم"
author = "ENGY"
posted = "2006-05-19"
text = "ربنا مش هايسيب اللى نصبوا عليه ان شاء الله. حطوا نفسكوا مكانوا هتقدروا تستحملو الاهانات دى ده لو كان قتل حد ولا حتى زنا ماكتوش تقولو كده . تامر مهما كان فنان ولو معجبينه برده حتى لو كان غلط سامحوا ده ربنا المسامح الكريم واللى بيقول ان اللى بيحب حد هيتحشر معاه احب اقولو ان تامر مش مجرم لو قاصدك ع الغنى الغنى مش حرام ولو قصدك على الغلطه يعنى ربنا يسمحه هو مهما كان مسلم زينا واخونا فى الاسلام ربنا مايرضاش بكده هو يعنى انتو ملائكه كل واحد بيغلط وانتو بقى اللى بتقلوه ده هو اللى حرام الاهانات والشتائم دى هاتتعاقبوا عليها انا مش بدافع عن تامر انا بدافع عن الحق"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

