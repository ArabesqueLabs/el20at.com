text = "تامر موهوب وهو اتنصب عليه وانا متاكدة ان تامر لايمكن يعمل حاجة غلط صدقوني ياعالم تامر اتنصب عليه وهو اتخدع بس مكنتش يعرف وتامر انسان طيب جداا وهو دخل يغني مش يزور صدقوني ياعالم تامر انسان كويس وهو اتنصب عليه."
