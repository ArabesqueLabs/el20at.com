[[comments]]
order = 142
subject = "عيب عليكم"
author = "sho sho"
posted = "2006-05-22"
text = "عنجد عيب عليكم ايش الكلام دا الي انتو بتكتبو يا ناس خلي عندكم شويه زوق بس ذرة احترام ايش الاسلوب دا يعني عشان خلاص ضامنين انو مافي احد حيعرف انتو مين ومين الي كاتب الكلام دا نازلين سب وكلام وسخ لو انت انسان محترم حتحترم نفسك حتى لو كنت مع ورقه وقلم او مع شاشة كومبيوتر وكي بورد<br />ترةة مره عيب الي انتو كاتبينو<br />وخير ان شاء الله تامر حسني ايش عامل لكم في حياتك مافي احد يطيقو من اولاد ان كان من اولاد السعوديه او اولاد مصر او خارج انحاء العالم ليش ان شاء الله صارق مالكم ولا اتجوز امك ولا قتل اهلك ولا ايش سوا فيكم ترى مره عيب مره عيب عيب الكلام الي انتو شغالين تكتبوه دا والشتم الي ماشاء الله عليكم لسانكم يمسح وراكم<br />مافي انسان مايغلط واناما بقول انو تامر ملاك لا طبعا ولا هوا كامل لاطبعا الكمال لله عز وجل<br />اذا رسول الله الي هوا رسووووول الله مو اي احد غلط فما بالكم انسان<br />تامر زينا زيو مافي فرق عندو عين واحنا كمان عندنا عين عندو رجل واحنا كمان عندنا رجل الخ**<br />sooooooooooooooo<br />انتو كده بتجبورو نفسكم على انو الناس تتكلم عليكم<br />عنجد انتو تافهين تافهين تافهين لابعد درجه ممكن تتخيلوها<br />ايش الهبل دا الي انتو عايشين فيه سيبو الانسان في حالو ايش عمل فيكم؟؟؟؟<br />ولا عشان لذوذ وكل البنات معجبين فيه انتو يا حرام سارلكم عقده نفسيه..؟؟؟ ومقهورين؟؟<br />لا طبعا اكيد هوا دا السبب<br />بس بصراحه في دكاتره نفسيين كتير مرره يمدحوهم<br />وبطلو الهبل دا وكبرو عقلكم شويه وعيب عليكم وعنجد كل الي بيكتب الكلام دا من اولاد مو رجاااااااااااااااال<br />والي من بنات مو بنت امها وابوها وياسلام على التربيه الشريفه العفيفه الي اتربتها<br />عنجد ونعم التربيه الي متربينها<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

