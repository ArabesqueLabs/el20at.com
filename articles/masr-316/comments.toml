[[comments]]
order = 16
subject = "أين المبدأ"
author = "أنا من البلد دي"
posted = "2006-05-15"
text = "أولاً بخصوص قضية تامر حسني لا أريد أن أخوض فيها لأنها قضية محسومة من قبل القضاء وأنه مثل أي إنسان يخطئ فلابد من عقابه وأن يأخذ الحق مجراه.<br />فالفنان إذا أراد أن يكون فناناً ذا إحساس وشعور فعليه أن يكون إنساناً أولاً وصادقا في كل شيئ لأنه يمثل نفسه وعائلته وبلده ولكن هذا الذي يسمى نفسه فناناً أين الفن وهو كاذب أين الإبداع من صدق الإحساس فهذا كله زائف في نفس لا تريد أن تقنع فأراد لها الهلاك أولاً بتزييفه في أوراق رسمية ثانية في دوره كونه مواطناً مصرياً وعليه حقوق تجاه بلده مثله مثل أي رجل مصري ولكنه أراد أن يرتقي فوق هذا كله بهذا العمل الدنيء.<br />إنني لا أعترف بك فناناً أو مطرباً فأين الطرب وأنت تستعرض بعضلاتك وغمزاتك وتتراقص كمثل أي راقصة فأين الفن مع الرجولة فأنت شبه رجل وشبه فنان .. إنكم أهدرتم الفن بإقتنائكم حسالة الكلمات وللأسف الإعلام يسلط الضوء الشديد حتى تتصورون أنكم فوق مستوى البشر رب عامل نظافة أو مجاري أفضل منكم بكثير لأنه ينظف ويترك المكان نظيفاً ولكنكم تملئون آذاننا بقذارة الكلمات والإيحاءات الغير محترمة."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

