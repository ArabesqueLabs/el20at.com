text = "انا مش عارفه اقولك ايه يعنى بتتكلم عن تامر حسنى ومحدش رضا يرد عليك وكمان بتغلط فى المصرين دا انت مش بس حيوان وسافل انت حقير كمان يلا مهى سفاله بسفاله واحنا مش بس احسن من الكويت لا احنا احسن بلد كمان وتامر حسنى الي انت بتتكلم عليه ده لوحده بس احسن منك ومن الي تعرفهم ومن الكويت كلها فهمت ..<br />وبعدين ادام انت مش بتحب تامر الي مدخلك على الموقع ده دا انت بارد صحيح .................<br />اه نسيت طظ فيك وعلى الله اعرف انك دخلت الموقع ده وكتبت اى حاجه حتى ولو الوووو اوكى"
