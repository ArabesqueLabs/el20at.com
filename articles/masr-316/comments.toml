[[comments]]
order = 296
subject = "حموت علشانك"
author = "ميدو الرومانسى"
posted = "2006-06-05"
text = "عنيا بتحبك<br />كلمات .. نصر محروس<br />الحان .. محمد يحيى<br />توزيع .. امير محروس وطارق حسيب<br />عنيا بتحبك ......... وقلبى بيحبك<br />وحضنى بيضمك ...... ده يبقى إيه<br />معايا ووحشنى ..... بعيد بتوحشنى<br />حبيبى طب قولى ده يبقى إيه<br />يعنى إيه لما كلامى ..... كلة يبقى فى سيرتك<br />يعنى إيه لما ابقى عايش مش شايف غير صورتك<br />لأ وصوتي يا حبيبى ..... ماينطقش إلا اسمك<br />يعني إيه كل أما اروح مكان ...... أشوفك جمبي<br />يعني إيه حبك واخدني ...... قلبى روحي وعقلى<br />لأ وعمري ما ألاقي نفسي ..... إلا وإنت في حضني<br />بعيش<br />كلمات .. محمد حامد<br />الحان .. تامر على<br />توزيع .. احمد عادل<br />بعيش على ذكرى كانت ما بيننا من سنين<br />وبنادى بأعلى صوت ليا أنت فين<br />حبيبى إرجع<br />أنا بناديك<br />وبخاف يتغذب قلبى أكتر من كدة<br />وأعيش عمرى اللى جاى بالشكل دة<br />حبيبى ارجع<br />انا بناديك<br />بتغيب وأنت الى على بالى<br />وإن كنت مش غالى يبقى مفيش غاليين<br />وتسيب يا حبيبى جوايا.... اشواقى وهوايا وتروح لناس تانين<br />ودة ده مين يعوض قلبى ... عن لحظه لقٌاك<br />وإيه معنى الحياه لو مش ... معاك<br />ولية قولى أنا هونت عليم<br />أيام .. حبيبى لا يمكن أوصفهالك بكلام<br />أيام .. متعرفشى ليه فاتتقوام<br />يا ريت أنسى .. وأعيش بعديك ...<br />الوحيدة<br />كلمات .. تامر حسنى .. اشرف الالفى<br />الحان .. تامر حسنى<br />توزيع .. مجدى داوود<br />انتى الوحيده اللي أنا حبيتها من كل قلبى بجد<br />لا عمري شكيت فيها ولا غيرها حسيت حد<br />دا أنا كنت فاكرها ليا و أتاريها لأي حد<br />فهمتها غلط يا قلبى واللوم مش عليها<br />دا اللوم عليك إنت يا قلبي إنك صدقت عنيها<br />قال وأنا بخاف عليها ....... قال وأنا بغير عليه<br />اقرأ بقية التعليق .."
