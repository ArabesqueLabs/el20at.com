subject = "كسفتونا"
author = "سيندريلا"
posted = "2006-05-17"
text = "يخرب بيت البنات ..علي هبل البنات ...علي عبط البنات<br />يا بت يا هبلة منك ليها ردودكم مستفذة ....ايه الهبل ده ايه اللي انتوا فيه ده...ما بتبصي انتي بتقولي لمين الكلام ده<br />ده لو جوزك ولا خطيبك حتتكسفي تقولي كده قدام الناس<br />وبتقوليه لمين ؟<br />لواحد ..بيغني هشك هشك<br />قال ....\"تامر استحمل يا حبيبي:\" قال<br />طب روحي شوفي البنات اللي زيك اتبهدلوا ازاي وقولي ليهم كلمة حق ....ولا قولي الكلام ده لشاب زي تامر بتاعك ...قال صلي في الجامع ....كام مرة ودخل السجن علشان صلي<br />اكمن البنات في مصر متخلفة وهبلة من دون كل البنات....اللي في الدنيا<br />ووحشين كمان......هه<br />الامضاء<br />بنت مصرية .."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

