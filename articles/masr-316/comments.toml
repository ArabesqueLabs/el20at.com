[[comments]]
order = 366
subject = "ردا علي الكويتي المطيري"
author = "يا مطيرى، أولا انا عايش في الكويت و كل اللي اقولهولك ان انت عارف كويس المطيري في الكويت يعني ايه: نسوان متناكة ببلاش و رجاله معرصه و ملهمش سعر."
posted = "2006-07-08"
text = "كما انك بتدل علي الغباء اللي ملوش وصف لأن يا حمار الموضوع اللي مطروح للتعليق ملوش دعوه اطلاقا بالرساله اللي انت بعتها.<br />كل الموضوع انك شكلك طيزك بتكلك و نفسك في مسله فرعوني تفشخ طيزك، و انا متأكد ان انت اصلا بدون لأن انا اصحابي الكويتيين كلهم شباب زي الورد انما انت واضح انك بدون و بتتلزق في الكويته.<br />و عدوان ثلاثي ايه يابن الجزمه دول مدخلوش أصلا يا غبي متتكلمش في اللي يبين غبائك اكتر، و متزودش الحمريه بانك تدي عن بلدك صوره وسخه زيك بكلامك الغبي، بلدك من احسن دول الخليج يا حمار متنزل صورتها اما الدنيا يا غبي، كل واحد بتصرفاته بيعكس طبيعه و اخلاق بلده و شعبه و لكن كما هي حالتنا هنا يبان بان لكل قاعده شواذ زيك يا..... مطيزي<br />هذا هو تعليق الخنزير الذي ارسله و ملووووش اي دعوه بموضوع تامر او غيره:<br />أرسل هذا التعليق بواسطة : كويتي مطيري<br />كس ام مصر وشعب مصر شعب الدعاره والحراميه والمنافقين والكلاب اوصخ شعب على الارض<br />للبيع مصريه شريفه لم يدخل في طيزها سوى الف زب وهذه اشرف مصريه بالنسبه للمصريين الكلاب وقد تم رفع المزاد ووصل 20 جنيه وهذه اغلى مصريه من يشتري يا شباب<br />مطلوب مصري يكون حارس للكلب بتاعي بس يكون المصري ريحته نظيفه عشان الكلب بيقرف من ريحة المصريين العفنه الزباله<br />يعيش العدوان الثلاثي الذي دمر المصريين وناك المصريات وجعل كس المراه المصريه 20 متر كم اتمنى لو كنت مع جيش العدوان الثلاثي لكي انيك المصريات وافك بكارتهم"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124718/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 367
subject = "الي الكويته"
author = "الي الكويته اللي بعتوا كلام وسخ عن مصر:"
posted = "2006-07-08"
text = "يا منايك مصر اللي بتشتموها دي ذكرت في القرآن اكتر من ماذكرت مكه المكرمه.<br />ثانيا لما المصريين بيمسحوا جزم و بيحرصوا الكلاب و وو ووو امال مين اللي رجعلكوا بلدكوا يا منايك لما العراقيين دخلوا الشرق جريتوا من كبيركوا ليصغيركوا من الغرب.<br />و بلدنا هي اللي شلتكوا يا منايك لما كنتوا مشردين في الأرض مش احنا اللي اتكب علينا الذله و المسكنه و التشرد يا بهايم راجعوا التاريخ القريب جدا لما اتشردتوا يا بهايم مش كليوبترا اللي من الاف السنين.<br />اكبر دليل علي غبائكوا انكوا بتفتكروا التاريخ اللي من سبه الاف سنه و نسيين اللي لسه كان حصلكوا بسبب وسختكوا ربنا سلط عليكوا اللي يربيكوا.<br />و بعدين اللي حارئكوا اوي من مصر يا أحايب و دي عقده بسبب اننا طوووول عمرنا اسيدكوا و بنعلمكوا و عليكوا و وو ووو<br />و يعني امريكان اللي يتلحسوا جزمهم دلوقتي زي الكلاب العطشانه هما االي نسيتوا تذكروهم بصوا لنفسكوا ابل ما تبصوا لسيدكم.<br />و صدقوقني لو كان فيكوا راجل واحد مكنش ده بأه حالكم.<br />أهي السعوديه اللي ظفرها برقابيكوا طردوا الأمريكان و اللي فاضلين فيها خلاص كلها أشهر و يخرجوا و ده لأنهم شعب رجاله مش زيكوا خولات لازم حد يحميهم و حد يأكلهم و حد يعلمهم و حد يشخخهم."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124718/http://masr.20at.com:80/article.php?sid=316"

