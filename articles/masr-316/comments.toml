text = "أرسل هذا التعليق بواسطة : كريم محمد محمد خضير<br />\\علشان الواحد غلط كأنه كفر مش هو بس غلط كل البشر بتغلط يعني المسامح كريم<br />وشد حيلك ياتامر وكلنا معك وشد حيلك<br />شــــــــــــــــد حيلك<br />29/05/2006<br />كيمو امير الاحزان والحب<br />أرسل هذا التعليق بواسطة : كريم محمد محمد خضير<br />يا جماعة حرام عليكو ممكن اي شخص فيكو انو يوقع بالغلط و حرام الي بتعملو ده و تنشرو صور محزنة لفنان بنموت عليه الفنان ده عظيم وكلنا بنغلط<br />وحشتنا موووووووووووت يا احلي تامر في الدنيا ولا يهمك من الناس اللي كتبينه انشاء الله ترجعلنا بالسلامه والشريط بتاعك وهمي يا تامر انا بحبك مووووووت ومستنياك ياتوتي ترجع KEMOLOVEMER@YAHOO.COM<br />29/05/2006<br />مظلوم والله مظلوم<br />أرسل هذا التعليق بواسطة : خالد بوب<br />كلنا متاكدين انك مظلوم وان دى محنة وستزول<br />29/05/2006<br />tamer fe alsegn<br />أرسل هذا التعليق بواسطة : ahmed<br />ya3eny 3leh<br />29/05/2006<br />المنوفيه معك يا تامر<br />أرسل هذا التعليق بواسطة : هشام السيد<br />احنا بقلوبنا وراك يا تامر ربنا يجازى اللى كانو السبب ان شاء ربنا هيكرمك وطلع منها باذان الله تعاله انا بحبك اوى يا تامر بموت فى صوتك وصورتك ان شاء الله هطلع منها والمنوفيه كلها بتقولك شد حالك هطلع ان شاء الله تعاله الجماهير عوزك فى الساحه الغناء<br />29/05/2006<br />عنوان التعليق<br />أرسل هذا التعليق بواسطة : الاسم<br />بحبك يا تامر<br />29/05/2006<br />حراااااام<br />أرسل هذا التعليق بواسطة : باهى ممدوح عبد الشافى السيد االشربينى<br />بصراحة انا بحب تامر حسنى جدااا وبصراحة انا مش شايف انه عمل حاجة غلط انا لو غنى ومعاية فلووس ادفعها ومخشش الجيش هدفعها وانا زعلان عليه جداا والانسان بيغلط وبيتعلم وارجو الرد على كلامى<br />29/05/2006<br />الى الكويتة الرفاعة راسها<br />أرسل هذ<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
