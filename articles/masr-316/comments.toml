[[comments]]
order = 300
subject = "الى الفلسطنية والكويتة"
author = "لولو العراقية"
posted = "2006-06-07"
text = "اول شي السلام عليكم ثانيا يا فلسطنية انا عراقية بنت عراقي ومن اشهر العوائل بالعراق من علم وادب واخلاق والي يمر بي بلدي ازمة وتعدي وبعدين بلدك مو احسن من بلدي نصيحة مني مع انو انا وانتي نفس السن شويا خلي تكون طريقتك بالكلام حلوة انت مش بتقولي انحنا ناس معروفين خلينا انشوف اخلاقك او طريقة كلامك الجيدة وبعدين انت تعرفين شنو يعني العراق من كان صدام شو كان بيعمل او شو بيعطي للفلسطنين يا بنتي كان ياخذ من عدنا عشان يعطيكو مع انو انا اكثر وحدة تكره صدام و لولا الخليج مكان عشات فلسطين والله غصب عني انا حكيت معكي بهذه الطريقة بس انتي خلتيني احكي اما الكويتة واضح انك بنت خير وبنت عائلة الله يحفضك لهلك باين عليكي اخلاقك حلوة من طريقة كلامك واتمنى اتعرف عليكي مع انو ما عطتني ايميلك بس انا حعطيكي ايميلي white_cat479 حاولي تكلمني انا نفسي اتحدث معاكي"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

