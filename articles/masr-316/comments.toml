posted = "2006-07-13"
text = "اصبح المزور الهارب من الخدمه العسكريه تصفقون له وتهتفون بأسمه وكأنه بطل لمازا وشعب مصر شعب عظيم ومنهخرج ابطال حقيقيون لم نسمع بهم ولا بأعمالهم واما الشرزمه المزورون يهتفون لهم وكئنهم جائو لمصر ببطوله عالميه وهل لو كان اللزي فعل هذا العمل انسان بسيط من اغلبيت الشعب العظيم كانو تركوه لا والله كانو حكمو عليه بأقصا العقوبه والله مظلوم يا ايها الشعب العظيم"
