author = "حسام عتريس"
posted = "2006-05-22"
text = "مبروك يا تامر البراءه وعقبال لما اشوفك ميت يا رب انت والى بيحبك وعلى فاكره البنات الى بتحبك دى عندهم نقص فى الشباب يعنى من الاخر بتوع دعاره وبيحبو النيك بيحبو التلزيق فى الزحمه مشيين على مثل فى الزحمه تحلى اللحمه وكمان يا عم تامر شكلك حلو وانت اقرع بتفكرنى ببتاعى وانا بضرب عشره يا تامر يا رب اى بت تحبك تموت ويجلها شلل ويطلعلها شنب وتبقى زيك قرعه"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 129
subject = "عقبال الى بيحبوك"
author = "حسام عتريس"
posted = "2006-05-22"
text = "بيقولو مافيش فراخ فى البلد وانا اتاكد ان مصر بتحبنا لما عرفو انك عندك انفلونزا الدجاج خافو على الفراخ بتاعه مصر فقامو وحبسوك وحلقولك ريشك بعد كده هنقولك يا عم الفرخه بتهرب من الجيش احه ماتجيش انيكك ياض واحه ثم احه على البنات بنات متناكه مش عارف فى ابهاتهم اظاهر ابهاتهم فى الجيش على فاكره انت صعبان عليا يا تامر عشان شكلك دا بصراحه انا اتعوت اتف عليك بس خلاص كده هرجع يلا يا بنات اتشرمطو على حس ابن المتناكه بنات بنت متناكه فعلا بنات مصر متناكين اه على فكره انا مصرى ومن امبابه يعنى بقول ان البنات الى بتحب تامر بنات شراميط ودى شهادة عوليا ومبروك على كل بنت الشرمطه الجديده واخر كلامى كس ام تامر حسنى ابن الشرموطه ويا رب الى يحبو يجيلو استكوبا فى بضانو او استحنا فى كسو وشكرا كان معكم حسام من امبابه واليكم خبر وفاه تامر حسنى يا رب قولو امين"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 130
subject = "مصر بلد الحراميه"
author = "كويتي مطيري"
posted = "2006-05-22"
text = "كس ام مصر وشعب مصر شعب الدعاره والحراميه والمنافقين والكلاب اوصخ شعب على الارض<br />للبيع مصريه شريفه لم يدخل في طيزها سوى الف زب وهذه اشرف مصريه بالنسبه للمصريين الكلاب وقد تم رفع المزاد ووصل 20 جنيه وهذه اغلى مصريه من يشتري يا شباب<br />مطلوب مصري يكون حارس للكلب بتاعي بس يكون المصري ريحته نظيفه عشان الكلب بيقرف من ريحة المصريين العفنه الزباله<br />يعيش العدوان الثلاثي الذي دمر المصريين وناك المصريات وجعل كس المراه المصريه 20 متر كم اتمنى لو كنت مع جيش العدوان الثلاثي لكي انيك المصريات وافك بكارتهم"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

