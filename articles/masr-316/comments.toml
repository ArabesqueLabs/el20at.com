subject = "اميرة الحب"
author = "فاطمة"
posted = "2006-07-09"
text = "ربنا معاك ياتامر وصدقني حتفضل ديماموجود كفنان لانك موهوب بصوتك واوع تعتزل ياتامر احنا محتجيين صوتك لانك بتريحنا بكلامك بس ياتامر انا لما شفت صورك اتقطعت متياشي ياتامر انت فنان وموهوب وطيب ولااتمنى لك الا ان تكون الافضل دائما.ومرة اخرى لا تترك معجبينك وجمهورك الدي احبك واحب صوتك.وانت موجود حتى عندنا في المغرب المغاربة كلهم معاك ويدعون لك بالتوفيق وبالنجاح الدئم."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124718/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 378
subject = "حرام ياشباب مصر"
author = "فاطمة"
posted = "2006-07-09"
text = "اسمحولي ياشباب مصر ان اقول ان ماكتبتمونه عن وطنكم وعن تامر ليس من اخلاق ابناء مصر.مصر ديما كانت ام الدنيا والام عمرها مزعلت من ابنها يبقا الابن يزعل من اخوه. تامر اتنصب عليه او حتى غلط ومااداش وجبو. ولو ده انسان مش ملاك واحنا بشر وبنخطا في اي شاب منكم مااخطاش الجدع فيكم عمل اكتر من كده والدليل كلامك الوقح عن بلدكم وعن واحد من بلدكم .هو ده الي علمهولكم الي سبقوكم والي قالو ديما مصر حتفضل ديما ام الدنيا تزعلو مصر ليه. انا مش مصرية مغربية وكلامكم عن مصر زعلني لان مصر هي امنا . وحتى لو بنات مصر معجبين بتامر انا معاهم تامر صوتو حلو ومش بنات مصر العالم العربي كلو بيحب تامر.صدقوني انا تهت فيكم ياشباب مصر انتم بقيتو من صنف تاني صنف مليان هزار وتريقة. ربنا يهديكم ."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124718/http://masr.20at.com:80/article.php?sid=316"

