subject = "كسم تامر حسنى"
author = "محمد"
posted = "2006-06-25"
text = "تامر حسنى مين يا خولات و يا بنات يا شراميط انتم يا اللى بتقولة ياريتكم كنتم مكانة تلاقيقة نفسكم تتناكة و مش لاقيين اتلمة بقى فضحتونة ربنا يخدكم يا ولاد الشرموطة يا حريم يا شراميط انتم تامر دة جبان هو الجيش مش حلو و اى حد يتمنى يخرج منة بس هو ادام هربان منة ما كنشى يقول بقى لو كنا بنحبها المعرص دة كفايكم هبل بقى و فوقة شوية"
