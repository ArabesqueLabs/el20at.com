text = "السلام عليكم ورحمة الله وبركاته اولا من حقنا كشعب مصرى وجمهور تامر اننا نزعل منه وعليه لكن ده مش مبرر للغلطة ال ارتكبها وبررها بجهله للقانون واعتقد عند محامين كتير فى البلد اصغر واحد ممكن يفهمه يعنى بلاش حجج انت غلطت ولازم تتعاقب ولا احد يعلو فوق القانون التهرب من الجيش جريمة فى حقك (الراجل ال يتحمل المسؤلية وميتهربش)الجيش للرجالة اخلاق ورجولة وتادية واجب يحتم عليك تنفيذه وانا سعيدة بلحكم على تامررغم انى من جمهور تامر ال بيعترف بموهبته الفنية ولكنى بحترم دينى وبلدى ونفسى اكتر من حبى لتامر واعترافى بموهبتهوبطلب من كل الشباب ال بيعلقوا على حصل لتامر انهم يكونوا قدوة للشباب ومستخدموش الفاظ خارجة وجزاكم الله كل خير"
