[[comments]]
order = 77
subject = "عيب يا جماعه"
author = "nile-lover"
posted = "2006-05-19"
text = "احب اقول..لبعض الجماعه الي قلبوا بطننا من كتر تعليقاتهم السخيفه .او بالاصح..القذره...او المشينه...<br />عيب يا جماعه مهما كان تعيلقاتكم ديه..ناس كتير بتقراها...<br />ويعيني هو فيه ايه يعني<br />مالكلم عاملين بوليكا على الراجل الغلبان ده..<br />وبعدين كتر الف خيره انوا اعترف بغلطته .واعتذر<br />وبعدين على حسب تصريحاته الاخرانيه..انوا بيقول(انوا واحد فهمه انوا هيخلصلوا شهاده الخدمه العسكريه بطريقه قانونيه)يعني بكل بساطه.تامر الي نازلييين عليه شتايم ده..اصلي الظاهر انتوا مش لاقين حد يلمكم...<br />كان ضحيه نصب...وانا في وجه نظري انوا فعلا كان معرض للنصب من النوع ده<br />لأنوا ي ماالكل عارف نوا باباه..مسافر امريكا..بقالوا سنين كتيره..وما رجعش الا بعد حوالي عشرين سنه..يعني ماكانش بالبلدي كده(متفطم على الحاجات ديه)<br />فيعيني ادحك عليه....<br />وبعدين هو يعني هو اولحيد الي في البلدعامل كده<br />طب ما قالوا كمان هيثم شاكر..عمل نفس العمله<br />بس الي انا مش فاهماه؟؟ايش معنى يعني تامر هو الي الاضواء اتركزت عليه وسابوا الاخ التاني؟<br />المهم...انا مش محل اني ادافع عن حد..<br />وفي النهايه بتمني..انوا اي حد عاوز يبدي رأيوا حتى ل كان عاوز يهاجمه..يا ريت يكوننن باحترام يا جماعه..<br />عشان الي بتقولوه ده قيقي عيببببببب"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

