author = "ابن مصر"
posted = "2006-05-18"
text = "لك الله يامصر ، ماذا حدث لشباب وشبات مصر. مع أحترامي لكل الشباب الذين يهاجمون المخنث المدعو تامر حسني و اتباعه أقول لهم توخوا الموضوعية وابتعدوا عن الشتائم و السباب ، فهو أقل من أن تكترسوابه وأمثاله فهو لا يستحق لقب فنان كغيره من محترفي الدعارة التي يدعونها غناء شبابي ، يعيشون في وهم كبير وضعناهم نحن فيه بعد أن دعونا هم فنانين ونفخنا فيهم حتى أنفجروا فيناوفي جميع قيم المجتمع وتقاليده وعاداته فلم يراعوا قيمه دينية ولا أخلاقية فقد أصبحوا فوق الجميع وفوق القانون نسوا الله وتذكروه وهم في الزنازين بأيديهم المصحف نفاقاًوأستعطافاًونسوا مصر وتذكروها فقد في أغانيهم نفاقاًوتلميعاًلاسماءهم،لماذا توجوا نجوم مجتمع لانهم يساعدون الذمرة الحاكمة في تنويم المجتمع وألهاءه بتوافه الامور وزخارفها ومنه الفن الهابط الذي لايسمن ولايغني من جوع أقصد الجوع الفني والثقافي والأبداعي ،وكمايقول الشاعر:<br />وكم ذا بمصر من المضحكات ولكنه ضحك كالبـــــــــــــــــك<br />نحن نسأل ببساطةاين د. أيمن نور الان أنه في غيبات السجن مع القتلة وتجار المخدرات لا لشئ سوا أنه ناطح الرئيس وتحداه في أنتخابات قيل أنها ديمقراطية وهي مزورة بشهادة القائمين عليها المنكل بهم حالياًلانهم لم يرضخوا لسيف الحاكم ولمعان ذهب المعزأنهم القضاة الصفحة الوحيدةالتي لم تزل بيضاء في مصر حتى الان وندعو الله أن تبقى كذلك لانها أملنا في التغيير.والا سنغادر جميعاًخذا الوطن ويبقى النظام وحدة دولة بلا شعب ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

