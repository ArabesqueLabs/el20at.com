subject = "وحشتنا يا تامر"
author = "عاشق وشبيه تامر حسنى"
posted = "2006-05-14"
text = "وحشتنا يا تامر ووحشنى صوتك الحساس الرقيق الجميل وبعدين انا مش مصدق ان دى صورة تامر حسنى ابدا وصدقنى مش هاننساك والصعب يهون وما يقع الا الشاطر وانا عايزك لما تخرج من السجن يكون ده موقف ايجابى معاك وتواصل نجاحك اكتر واكتر وبين لمصر ولجمهورك ان انت استفدت من الحركه دى وان انت مش عملت حاجه غلط يعنى هو فيه حد بيحب يخش الجيش ما كلما بنكرهه جدا من اللى بيعملوه مصر شبه مصيدة فئران كبيره شويه واحنا الضحايا ربنا يعينك<br />من رابطة مشجعى تامر حسنى<br />مع حبى كبير المشجعين<br />(المجهول )"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
