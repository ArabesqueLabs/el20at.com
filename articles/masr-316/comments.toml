subject = "اللة يلعن شرين احمدو الى عايزنها"
author = "منيرفا"
posted = "2006-05-20"
text = "انا عايزة اقول الى محدش قالةالى ضيع تامر هى شرين و بنت كان مرتبط بها تامر فاتحدت شرين مع اهل البنت الى كان مرتبط بها تامر روح قلبىو قرارو انهم يضيعو تاملر بعد ان وصل الى النجومية شرين اندل انسانة عرفتها وعايزة كل الناس يعرفو ندالة شرين فاول من انتج لهاشريطها محروس و عندما وقع فى احدى المشاكل التى يقع فيها اى رجل ناجح ففى الوقت و الحال تخلت عنة عكس تامر نهائيا فتامر اول من ظهرها للجمهور وهو الشريط التى نعرفة جميعافهى نكرت جميل تامر الت حب يخدمها و بدل من ان تعترف عن هذا الجميل بل بالعكس نكرتة و اتحدت مع اعداء تامر فلا نستعجب من اعداء تامر فكل شخص ناجح لة اعداء لعنتة اللة عليكى ياشرين"
