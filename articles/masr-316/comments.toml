text = "إحصائية يعلمها الجميع وهي وجود 9 مليون عانس في مصر وهذا الرقم لا يثير قلق أكبر {اس في مصر اللي هوا الريس وواضح ان هناك حريق مشتعل ومشكلة جنسية حقيقية لا تستطيع الكثيرات السيطرة عليها بسبب من قلة الرباية وتكميم أفواه الدعاة وطردهم من البلاد وتأميم المساجد والفراغ الديني والخواء الروحي الذي ترتب علي ذلك .. أقول للبنات اللي فضحوا مصر بهذا الهيجان الجنسي الفاضح علي تامر حسني ومثلهم المخنثين من الشباب .. العيب ليس فيكم فقط بل في اسركم المنحلة التي لم تستطع أن تربيكم وملعون أبوشراميطك يا مصر"
