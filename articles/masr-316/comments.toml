text = "استحمل يا نانوس عين أمك و عسى أن تكرهوا شيئا و هو خيرا لكم يمكن يطلع راجل يا ناس من الحبس عموما صور المحكمة شكلة فيها أرجل من ألأول ربنا يكون فى عون أمة بس لأزم نعلم ولأدنا أن يكون عندهم ضمير مش بس علشان البلد علشان حياتهم كلها كفاية استهتار ويا جماعةبلاش شتيمة بالشكل دة أشتموا بس بلاش كلام جارح لازم برضة يكون فى شيء من الحياء"
