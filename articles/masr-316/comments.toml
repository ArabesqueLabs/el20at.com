author = "هيثم محمد خضير"
posted = "2006-05-27"
text = "انا هيثم محمد خصير من الزقازيق عاوز اقول انى بعت الرسالة دى مخصوص لئنى الشهر دوت بسمع فية انا هخش الجيش ولا لئة عاوز اقول لتامر مش معنا انا فى ازمة انك خلاص هتنهزم بسهولة وكمان عايز اقلك انك تحافظ على صوتك على ئد متقضر عشان مش تحرمنا منه اوكى يا حبيبى انا نفسى اكون صديق ليك بس مش عارف اوصلك ياريت تكون بخير على طول يا تامر وكبر ومتخدش الكلام بناع الناس الى مش بيحبوك وتزعل منهم هما عيزين مصلحتك ونفسهم يفرحو فيك لئنهم بيغيرو منك وعلى فكرة عاوز اقلك انك عملت لنفسك صيت والناس الى مش تعرفك عرفتك من كافة انحاء العالم من الى انتا عملتو ههههههههههههه مش حاجة تدحك والله حافظ على نفسك يا تامر اخوك هيثم محمد خضير من الزقازيق وعاوز ابعت تحية لكل من هيقرة الرسالة ديت لكل اصحابى الى كانو معاية فى الجامعة العمالية فرع الزقازيق يعنى عم طلبا ولى بعملو هههههههههههههههه ؟؟ وعايز اقول قدام العالم كلو حاجة جواية ياريت توصل للى فى بالى واول حرف من اسمة hعايز اقلو انا ظلمتك معاية ونا هحبك للئبد وعاوز اقلك انتى اول واخر حب فى حياتى حتا لو مش كنتى لية وعاوز ابعت سلامى لكل اصحابى فى الجامعة العمالية هيثم محمد خضير \\الزقازيق \\ يعنى شارع فاروق يعنى ابراج زهرة النحال \\هيثمكوووو الرهيب الى تامر حسنى هيثم"
