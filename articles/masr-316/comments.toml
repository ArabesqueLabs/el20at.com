subject = "بلاها تامر هات شعبان"
author = "ابو الدهب"
posted = "2006-05-16"
text = "تامر مين يا عم اكبر بقي واتلم<br />زمان كان اسمه زمن فيفي عبده والان زمن شعبان<br />راحت عليك يا اهلي وزمالك زماننا مش زي زمانك<br />سبنا الحريه وجرينا وراكي يا بهيه خبرينا مين واكلها مين بعد موت ياسين<br />لا عدل ولا انصاف بعد جواز طنط انصاف<br />كانوا زمان يزرونا في الفجر<br />دلوقتي صبح وضهر.. ولحد العصر<br />سبعين مليون في مصر كل واحد فينا دوله<br />فيها مبارك ريس لسبعين مليون دوله<br />يا عيني يا حرام ريس غلبان<br />نفسي اتسدت مش هاكمل<br />اه لواعرف اتجمل<br />يلعن ابوكو والي حطوكو والي رسموكو علي الكراسي<br />اه يا راسي اه يا راسي<br />مش قلت مش هاتنيل اكمل<br />طيب تلاته بالله العظيم يمكن اكمل<br />بلد فاضيه عقول خاويه بطون جافه<br />نيجي في الهايفه ونعملها زفه<br />اصحي يا مصر و يا ولاد المصريين<br />ييييي نفسي اتسدت<br />سلامو عليكم<br />خرابها علي اديكم<br />الله يرحمك يا حريه نفسي اتسدت<br />هارجع تاني ليكم<br />واكتب لما تكونفي حاجه هايفه<br />ولا اقولك لما تزرنا هايفه<br />وتغنيلنا عل الهيافه الهايفه<br />مش هيه بنت الضييعه<br />بس كده كفايه علشان<br />انا بحب اكتب كلمتين<br />من طيز مين<br />اخوكم<br />اللي مش فاهم حاجه خالص<br />ابو الدهب"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

