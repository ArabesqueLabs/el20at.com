posted = "2006-10-26"
text = "ثلاثة اشياء في الحياة تذهب بدون عودة ( الكلام – الفرصة - الوقت) ثلاثة أشياء في الحياة غير متأكد الحصول عليها ( الاحلام – النجاح – الثروة) ثلاثة أشياء في الحياة تجعلك شخص عظيم ( العمل الدؤوب – الاخلاص – النجاح) ثلاثة أشياء في الحياة ذات قيمة عليا ( الحب – أحترام الذات – الاصدقاء) ثلاثة أشياء في الحياة من الضروري عدم فقدانها ( السلام – الامل – الشرف) ثلاثة أشياء في الحياة تحطم الشخص ( الجشع – الغرور – الغضب) اذا كنت صديقي"
