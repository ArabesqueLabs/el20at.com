subject = "الكلاب لما بتهوهو"
author = "مجهولة"
posted = "2006-05-24"
text = "شكرا قوي على الكلام إلى بتقولوه يا ولاد البلد ده انتو المصريين بتشتموا في بلادكم أمال عايزين الناس التانيين يعملوا ايه يانااااااس حرااام عليكم إلى بتعملوه فينا وفي تامر أنت كدة بتجرحوه امتر ماهو مجروح وبتقتلوه اكتر ماهو مقتول أيه خلو عندكوا دم صحيح ما حدش في الدنيا بقى عنده احساس ولا حد بقى عنده دم بس انا مش عايزة اطول لأن لو طولت هتسمعوا كلام مش كويس وأنا مش هرد على الكلام إلى بتقولوه لأن الكلاب لما بتهوهو محدش بيرد عليها والحمير لما بتنهق محدش بيرد عليها ولما البهايم بتنعر بردو محدش بيرد عليها وعلى كل الكلام إلى قلتوه دة أحب أقولكوا حاجة تحطوها حلقة في ودانكم دا غذا كان عندكم ودان من اصله((الكلمة لما بتتقال بتلف بتلف وترجع لصاحبها))<br />فاهمين ولا تحبوا أفهمكم تاني أعتقد إن كلامي مفهوم جدا مش كدة؟وإلى ميفهمهوش يبقى حماااااااار<br />كفاية قوي دوشت دماغكم بما فيه الكفاية بس يا ريت تستفيدوا من الكلاام ده ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

