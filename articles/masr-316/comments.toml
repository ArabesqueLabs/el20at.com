text = "سلام..<br />اوجه كلامى لكل انسان هنا ضد تامر حسنى<br />مع الاسف مافيش حد منكم صادق مع نفسه..<br />فى الاف غير تامر بيعملوا نفس اللى عملوا تامر ويمكن اكتر ـ بس طبعا لانه مشهور واحسن منكم بكتير بتقولوا عليه كل الكلام ده ، تزوير شهادة الجيش مش معناها انه قتل حد ويستوجب الموت ، طبعا لا .. بس حياخد جزاؤه ويرجع احسن من الاول بكتير ، فخلوا فى قلوبكم صدق ورحمة ،((( ربنا وحده هو الديان العادل))) فياريت لو كل واحد يكون حاكم لتصرفات نفسه وبس"
