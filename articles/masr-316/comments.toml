subject = "يلا يا عالم يا هايفة"
author = "راجل"
posted = "2006-05-14"
text = "والله انا مستغرب الواحد كل ما بيقول خلاص الاحوال قربت تتصلح نلاقي الهيافة وقلة الادب في دم ناس تقريبا اخدوا عليها ومش عارفين يغيروها بس انا عاذرهم لو كان المثل الاعلى في البلد دي واحد محترم او عالم او سياسي محترم مش عيل بايظ مزور وكداب ومنافق لو كان المثل راجل محترم مش \"الفنانين\" و \"لاعيبة الكورة\" كان زمانا حاجة تانية انا والله مشفق عليهم العيب على اللي خلى دول المثل العليا<br />صلاح الامة بصلاح الحكام<br />وصلاح الحكام بصلاح العلماء<br />ومادام العلماء طنطاوي ومن على شاكلته سواء كان<br />جمعة أو<br />الطيب<br />أو الشرس<br />أو الشرير<br />وكله عند العرب صابون"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

