[[comments]]
order = 313
subject = "كس ام تامر حسني وكس ام مصر بلد المعرصين"
author = "هيفا المغربية"
posted = "2006-06-15"
text = "هاي انا هيفا من المغرب<br />كل مصر بلد متناكة ومعرصين وشحاتيين وحصني مبارك وتامر حسني اكبر خول متناكيين واكبر خونةمفيهومش رجولةلانهم متناكين<br />وعمرو دياب المعرص البخيل الحرامي ريحتو عفن زي القرف وكل الشعب المصري عفن اكييد ميتسبحوش<br />مصر بلد الفساد والدعارة والقاهرة هي العاهرة هههه<br />مصر خدت كاس الامم الافريقية بالغش والحرام كالعادة لعنهم الله ليوم الدين وانشاءالله تنسخو لقرود زي القرد تامر حسني الخوله<br />مصر بلد الرقاصات حتى اسرائيل اشرف من مصر بمليون مرة<br />عاش العدوان الثلاثي اللي ناك مصر كلهااااااااا عاششششششش ولولا اسرائييل لاتناكت مصر مرة تانية من الهند<br />يلااااا سي يووو"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616152801/http://masr.20at.com:80/article.php?sid=316"

[[comments]]
order = 314
subject = "كده كتير"
author = "nile lover"
posted = "2006-06-18"
text = "لا لا لا لا الي بيحصل ده كتيرررر اوي,,اوي اوي,,,<br />ايه يا جماعه ما فيش احترام للبلد ولا ايه..<br />انا كلامي دلوقتي للأخت الي نازله شتيم في بلدي... بصي يا ماما انا مش هرد عليكي بنفس طريقتك الي واضح لكل العالم انها محترمه جدا جدا جدا...<br />بصي بقى يا ماما...انا سكت كتير على الكلام الي انتي كاتباه ده..<br />اظاهر انتي بتجري شكل وخلاص,.....بس انا بقى مش هحط عقلي من عقلك..<br />انا مش هقلك..عيب ولا هقولك...هل ترضي حد يشتم بلدك بنفس الاسلوب بتاعك ده...لانوا اظاهر انك ممكن عاادي جدا تقبليه على بلدك...زي ما قبلتيه على بلد عربي أخر الي هو (مصر) والي متعارف عليه.انوا احنا بلاد عربيه وحده.يعني كلنا بلد واحد..زي ما عندنا وفاء ووطنيه لبلدنا..نفس الشعور للبلاد العربيه الاخرى<br />وازا كنتي مش معتبره المغرب بلد عربي..انتي حره<br />وفي النهايه ..احب اوصل كل احترامي وتقديري وحبي لبلاد المغرب العربي ككل<br />وشكرا...."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623144455/http://masr.20at.com:80/article.php?sid=316"

