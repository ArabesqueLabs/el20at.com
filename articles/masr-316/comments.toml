posted = "2006-05-25"
text = "اناانصح كل واحد فيكم ان يحترم نفسه وما تتغاوبش لانو الرسول عليه السلام قال وهل يكب الناس في النار علي مناخرهم الا حصائد السنتهم فلسانك حصانك ان صنته صانك فحفظوا السنتكم من الشتم وانا ما احب ولا فنان ولا فنانة لان كل انسان احب امرؤ يحشر معه فانا ما بدي الا ان احشر مع الرسول فاستحلفكم بالله ان لاتسبوا لاننا نبقي مسلمين وعرب وديانة واحدة والسلام عليكم ورحمة الله وبركاته"
