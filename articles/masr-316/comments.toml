[[comments]]
order = 662
subject = "والله العظيم عيب"
author = "صحفية"
posted = "2006-11-28"
text = "اولا موضوع تامر حسني بقى قديم اوي وماحدش عارف ان كان بريء ولا مش بريء ولكن يفضل اننا نقول الحق انه فنان بجد صوته جميل وكلماته جميله لكن ده مش موضوعي أظن أن كده كفايه بأه وعيب أوي الألفاظ الدونية الحقيرة البذئية اللي بتتقال عيب أوي علينا وعليكم يا شباب وانا متأكده إن كل الكلام القذر ده غيره مش أكتر وده عشان كل البنات معجبين بتامر اعجاب جنوني أنا كبنت برضه معترضة عليه لإنه زيادة عن اللزوم ويعتبر هيافة ولكن ماحدش فيكم يرضى انه يتهان بكلام يسيء لأمه بالألفاظ اللي بتتقال ولا تسيء للرجولته زي مابتقوله لبعض عيب أوي أما تجريحكم في مصر بغض النظر عن اللي بيحصل فيها فهي هاتفضل زي ماهي أم الوطن العربي ولو ان المصطلح ده اتلغى خلاص وأم الدنيا بشعبها وحضارتها وعلمائها وثقافتها والتاريخ يشهد على كلامي والقرآن قبله ده احنا البلد اللي ذكرت في القرآن وده دليل على عراقتها ده وكلنا عارفين بس في ناس من غيرتها وحقدها على مصر لإنهم كانوا في مستوى دوني كانوا متخلفين وبيمشوا حافيين مش لاقيين حاجه يلبسوها ولا حتى يركبوها فبدل مايحترموها ويقدروا فضلها عليهم لإنها اللي علمتهم وعملتلهم البلد اللي هما عايشين فيها بيشتموا فيها عشان هي فيها أحسن شعب وهي أحسن دولة وبلادهم دي لا تذكر في التاريخ وعشان يحاولوا يبقوا زينا صنعوا لنفسهم تاريخ بعد ماكانوا مشردين في الصحرا اخس عليكم يا شباب مصر بأه هي دي المعامله اللي بينكم وهي دي التربية والأخلاق على الأقل راعوا ان في بنات في المنتدى اللي عمالين تقولوا فيه ألفاظ يخجل البني آدم المحترم بجد انه يقراها ياريت نرقى بنفسنا وبألفاظنا أكتر من كده وتامر حسني شاب زي أي شاب واعجاب البنات بيه ده مش بإيده وحسبي الله ونعم الوكيل"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073104/http://masr.20at.com:80/article.php?sid=316"

