[[comments]]
order = 588
subject = "كس دين ام تامر زبي ....."
author = "زانجييف الجمحشري المبضون"
posted = "2006-10-19"
text = "ياخي ايه البيضان ده . نسوان وسخه عاوزه الرقع و شباب متناكه عاوزه ميه نار تندلق في طيازهاأما بعد..<br />كل الناس بتجري ورا زب عيره قال تقولك معلهش ياتامر ياحبيبي ولا اللي تقولك ياحرام ده حرام على كس امك يا مره ياعايبه يامشرومه هو انتي عمرك شوفتيه ولا هو كل النسوان هتفضل مقضياها تخيلات و أحلام انهم بيتناكوا من الزب الوهمي تامر ابو طيز كبيره الخول ابو لباس باين. وانت ياد انت و هو يلعن دين ابوكوا شباب وسخه عاوزين الواد يفضل يشخر لكوا ليوم الدين . ما تسترجل ياكس اكم منك ليه و كل واحد ياريت يخش الكنيف يشوف عنده زب ولا ضمر من كتر حبكوا في عيل ملزق ابن مره وسخه.. بزازي بتحبك و طيازي بتودك في حد يقول كده و النبي . ياناس ركزوا شويه في دين ام الناس اللي طلعان ميتيين ابوها في الشوارع و المعتقلات و في كل حته .. وبعدين هو طلاما دخل الحبس يبقى اكيد اتقلب و اتعلم على طيزه زبليار علامه و دي حاجه اكيد هتبصتكوا ياشوية منايك و شراميط ياشواذ يا ولاد الكلاب ..<br />ويلعن ميتيين ابوكوا نرفزتوا الناس و طلعتوا دين ابونا بريحة النيك و الشرمطه اللي مليتوا بيها البلد الوسخه اللي احنا عايشين في خراها. كس امين تامر حسني اللي امه كتبت على كسها يوم مااتخطبت الأفتتاح قريبا .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062241/http://masr.20at.com:80/article.php?sid=316"

