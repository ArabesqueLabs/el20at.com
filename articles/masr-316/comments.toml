text = "الدنيا دى صغيرة ليها سعات وياك ويا بخت من كان ورا وجابة الزمان قدام ان كنت فى الاول او كنت فى الاخر مهما الطريق طول مهو بردة لية اخر على اية بتحسبها مهو كلة هيسيبها ويتوة وسط الزحام ويا بخت من كان ورا وجابة الزمن قداااااااااااااااااااااااااااااام<br />مش حرام شاب زى الورد يروح كدل مش حرام كل واحد يتحرم من حبيبتة او حبيبة مش حرام انك تحب واخر متحب تتجرح لية الدنيا بتعمل كدا لية ان كنت فى الاول او كنت فى الاخر مهما الطريق طول مهو بردة لية اخر على اية بنحسبها ما الكل هيسبها ويا بخت من كان ورا وجابة الزمان قدااااااااااااااااااااااااااااااااااام<br />فى النهاية الحب المستحيل؟"
