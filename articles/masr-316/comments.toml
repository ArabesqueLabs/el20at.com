text = "احنا نحب تامر حسني حتى لوكان سفاح<br />وان شاء الله يطلع بسلما لانو انسان محترم<br />وهدا الشي الي<br />سار محايثر في حب الناس لي واطلب من<br />الناس انو يدعولوا لانومايستاهل كل دا احسن واحد في المصاريا تامر ورامزجلال ولوسمحتولاتغلطوعلى تامر لانو اشرف منكم"
