[[comments]]
order = 375
subject = "عيب يا أخواننا و بلاش صغر نفس و كلام فاضي"
author = "مخلص أمين"
posted = "2006-07-09"
text = "إلي كل الأخوة المصريين و العرب اللي كاتبين تعليقات<br />سواء ضد مصر أو ضد تامر حسني<br />أخوكم مصري و أعمل بأمريكا ، و بصراحة ما كتبتوه من ألفاظ مش محترمة يعكس الكثير مما تحملونه من مشاعر متضاربة و ربنا يشفيكم و يسامحكم.<br />بالنسبة للأخوة الذين يقومون بشتمية مصر أو رجاله أو أبنائها أقول ربما لم تتعودوا علي الأدب و الأن تنكرون أن مصر ربتكم و علمتكم و صرفت عليكم و خلتكم بني أدمين.<br />مهما تكن توجهاتكم مع أني أعلم أن كل التعليقات التي كتبتوها لا تصدر إلا من شوية عيال ليس لهم أي توجهات و أنما أنتم ترون بعض الكبار (سنا) يكتبون أي حاجة و أنتم عايزين تبقوا زيهم فبتكتبوا أي حاجة. و الدليل أنكم ترفضوا كتابة أسمائكم في خانة مرسل الرسالة.<br />عيب جدا بعد أن تعلمتوا (ويظهر أنكم و لا أتعلمتوا و لا نيلة) عيب أن تلعنوا بناتنا و أخواتنا و أمهاتنا و رجالنا إللي هم أمهاتكم و أخواتكم و أخوتكم و أبائكم ، هذا إن كنتوا مصريين من الأساس. أما إن كنتوا عرب من دول أخري فالعتب علي بلادكم اللي معلمتكمش من هي مصر و أولياء أموركم معذورين برضه لأن هم برضه ممكن ميعرفوش من هي مصر.و لكم جميعا أقول عيب و بلاش كلام فاضي و شغل عيال صغيرة و قلة أدب.<br />بالنسبة لمن يسبون و يشتمون تامر حسني أقول لهم ، أنه علي الرغم من أني لا تربطني بتامر أي علاقة و لكن يكفي أن أقول لكم – ليس دفاعا عن تامر- أن كلنا بشر و كلنا لنا أخطاء و كلنا لنا سقطات. و من يقرأ تعليقاتكم يعتقد أنكم ما عملتوش حاجة وحشة في حياتكم خالص و مكانش قدامكم غير تامر حسني علشان تنتفوا ريشه. الولد مسجون دلوقتي علشان خطأ أرتكبه و هذا يرجع له هو و هذا خطأه. و هو الأن يدفع ثمنه و لستم أنتم من يدفع معه ثمن خطأه علشان تقفوا ضده بهذا الشكل. كلنا لنا أخطاء و هي مستترة لأن الله غفو<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124718/http://masr.20at.com:80/article.php?sid=316"

