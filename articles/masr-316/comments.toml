text = "تامر بجد ميهمكش حد الكلام الى فى التعلاقات دى يعنى مش كل واحد مة بيغلط بس لازم توعد جمهورك انك تعدى الازمة دى وتبقى احسن من الاول وكمان انك تقرب من ربنا بجد انتة مفيش زيك علشان كدة الكلام دة ميهمكش واحلفك بغلة حاجة وهى ربنا طبعا انك تبعد عن اى حاجة مش ترضى ربنا وتبعد عن الغرور ومحدش عارف انة فى كدة خير ليك ارجوك لما تطلع طمنا عليك ولو يريت تكلمنى على الاميل بتاعى \"نصك التانى \""
