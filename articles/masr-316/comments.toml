posted = "2006-05-20"
text = "حراام والله العظيم الكلام الي انتم كتبينه عن تامر والله حرام ابن بلدكم يضيع بكلمكم يمكن يكون تامر غلط لكن مفيش حد بيغلط وهو دة المفروض ان الموقف دة الي تقفوا مع ابن بلدك فيه والله عيب عليكم المفروض ترفعوا معنوياته وبعدين دة انسان مشصنم حراام عليكم دة انسان حساس وله مشاعرة حسوا بيه كل اليحصل دة فيالمحكمه وكمان انتم عليه على العموم تامر افضل مطرب لعام 2005 وهيفضل احسن مطرب وفنان وممسل لكل الاعوام حتى 2010 وفي ختامي بنموووت فيك ومش بس هنكتب على تيشارتتنا we love tamerلكن هنطبع على قلبنا ربي وقلبي معااك يا تامر يا عسل بنا عاااك وبنموت فيك حتى ولو كنتفين انشاءالله لو كنتفي اخر الدنياوشيلوا الحقد اليجواكم دة من نحيتوا ربنا يوفقك تامر."
