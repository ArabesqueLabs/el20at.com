text = "ياحيوانات افهمو حراااام عليكو تامر مظلوم ربنا ينصره والمسلم يحب لاخيه ما يحب لنفسه تمنو له الخير مش الشر انا بحبه ..أماالسب وشتم في تااامر ليه؟ مش هو اول واحد ولا آخر واحد عمل كدا<br />يااااه فيه ناااس كتير عملو أكبر من كدا وحتى لو كان صحيح الكلام بني آدم مش معصوم من الخطأ ولو افترضنا ان تامر أخطا بنقول اخطا وتاب وخير الخطائون التوابون يعني مش نفاق وزندقه واطلاق على المسلم كلمةالنفاق والزندقه دا كفر نفسي اعرف ليه اصابع الاتهام على تامر وهو مظلوم وسايبين الباقي اصل<br />..معروفه مصر ببلد النصب والاحتيال والمكروالحراميه بالرغم من<br />انها شعب متعلم لكن علم ضايع (علم بلاعمل)؟؟!وتامر<br />المفترض تساندوه ,,وتصبره على مصيبته<br />لكن كدا بتجرحوه وكلا م قلة أدب فعلا شعب زليل مع احترامي لوالدتي واخوالي ..<br />كمان كلام نجس ايه دا شعب نجسه بلد السكس !!ايه اللي حصل؟؟<br />فعلا مصر تغيرت حتى كلامهم بقى في السكس كأنهم الغرب في نجاستهم<br />اي مصري هتلاقيه في الشارع حتى لوبتتكلمو فى السياسه او الاقتصاد برضو هيدخلك في موضوع السكس بقى الحاجه (دي آفه اجتماعيه)لكن كل دا تحت تأثير الفول والطميه هههههههههه مع تمنياتي لك ياتامر انك تخرج بالسلامه ويوفقك ولا تسمع كلام حسالة المجتمع لانهم اصلا غيرانين منك انا بحبك بجنون .اوضتي كلها صور بتاعتك تامر بحبك مووووت واللهي اني حزينه عليك لكن اصبر واحتسيب وعليك بالدعاءعلى من ظلمك<br />انا بحبـــــــــك مووت وربنا يفك سجنك"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062241/http://masr.20at.com:80/article.php?sid=316"

