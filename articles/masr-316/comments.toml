[[comments]]
order = 39
subject = "رحمة الله عليكي يا دنيتنا"
author = "واحد و خلاص"
posted = "2006-05-17"
text = "أولا بقول حسبي الله و نعم الوكيل بدال ما كل واحد و واحده من إللي دماغهم فاضية و مفيش فيها إلا الررقص و الرقاصين و الفن و الفنانين يمسك كتاب و يعرف دينه و يحاول يدافع عنه و يثقف نفسة و يحاول يبتكر و يبقى شخص كويس علشان يمكن كمان كام سنة يقدر يعيش . و بالنسبة للموضوع إللي ردوده سخيفة جدا ده أقول تامر حستي ده يا عين أمه واحد زي مليون واحد و كمان إن كان مشهور فمن وجهة نظري إن مش كفايه الحكم إللي خده دا و الله يستاهل أكتر منه بكتيييييييييييير<br />وإلى كل فاضي و فاضية و فارغ و فارغة و هايف و هايفة بصوا حواليكوا هتلاقوا حاجااااااااااااااااات كتييييييييييير أوي أهم من تامر و لا فايزه .<br />و في النهاية علشان مطولش عليكوا هاقول<br />إتقوا الله فيما بقي لكم من عمر و عحسبوها تاني قبل ما تطلع في الآخر خسرانه و تعبانه معاكوا و سلام"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

