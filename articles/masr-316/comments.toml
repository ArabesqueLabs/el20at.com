posted = "2006-05-26"
text = "يا فلسطينيه اول شي ههههههههه وثاني شي روحوا عمرو فلسطين بعدين عمرولكويت ههه وبعدين مايتكلم على الأكل غير الجوعان وما يتكلم على البس غير العريااااااان ههههههههههههههههههههههه وحياتك إلي يغسل سيارتي فلسطيني بقا اكلي خرى ونطمي ملاحظه ادري اني حلوه"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025501/http://masr.20at.com:80/article.php?sid=316"

