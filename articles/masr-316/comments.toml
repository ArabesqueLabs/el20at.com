text = "ديه بلد فاضية بدل مبيتكلموا فى كلام فارغ يشوفوا البلد البعد شوية حتغرق و هو يعنى تامر اول واحد يعمل كده كل الليهم شأن فى البلد بيعملوا اكت من كده و تامر زى غيره و اتحاكم و خلاص عملين حكاية ليه و بصوا للبلد عشان هيا بلد متخلفة ده احنا بعد شوية دخلين على حرب المياه اصحوووووووووووووووواااااااااااااااا ارجوكوا و متكبروش الحكاية كده و كل انسان غلطان بياخد جزاءة و خلاص مفيش مانع نحب انسان بس مش لدرجة ان احنا نلبس اسود و انسانة تطلق و تخرب حيلتها و هو مش حيستفيد حاجة حيخرج و حينجح اكتر من الاول بس حيبقى اسمه رد سجون"
