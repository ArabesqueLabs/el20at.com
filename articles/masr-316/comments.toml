posted = "2006-06-25"
text = "كس امك تامر حسنى على كسم البنات الهبلة الجاهلة اللى بيقولة اننا بنحقد علية نحقد على مين اقسم باللة العظيم انا شكلى احسن منة مليون مرة و فى كتير جدا احلا منة مليون مرة شوفوا شكلة على طبيعتة و هو معفن و فى السجن هو دة اصلة الزبالة هههههه و اللة فعلا لايق على شكلة انة يكون حبسجى و بتاع سجون بص على الصور و انتم تعرفوة شكلة زبالة ازاى و تلاقى الشرموطة زينة بتاعتة زعلانة اوى علية"
