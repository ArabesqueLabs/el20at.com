text = "والله معروف مين الارهابيين الاصليين<br />الحرب الصليبية المقدسة اللي امر فيها البابا حرب ومقدسة شفت ارهاب زي كذا!<br />وقتل خلال اسبوع واحد فقط طبقت تعليمات يسوع 70 الف مسلم قتل وطبعا كان الحكم السائد هو حكم الرب يسوع رب الرحمة فقد وصلت الدماء للركب في الحرب المقدسة<br />قال رب المحبة يسوع !<br />واما من لم يؤمن به فأذبحوه قدامي<br />( لاَ تَظُنُّوا أَنِّي جِئْتُ لِأُلْقِيَ سَلاَماً عَلَى الأَرْضِ. مَا جِئْتُ لِأُلْقِيَ سَلاَماً بَلْ سَيْفاً. فَإِنِّي جِئْتُ لِأُفَرِّقَ الإِنْسَانَ ضِدَّ أَبِيهِ وَالاِبْنَةَ ضِدَّ أُمِّهَا وَالْكَنَّةَ ضِدَّ حَمَاتِهَا وَأَعْدَاءُ الإِنْسَانِ أَهْلُ بَيْتِهِ )) ( متى 10 : 34- 35-36 ).<br />((ومَلعونٌ مَنْ يَمنَعُ سَيفَهُ عَنِ الدَّمِ. )) ( ارميا 48 : 10 )<br />قالَ الرّبُّ إلهُ إِسرائيلَ على كُلِّ واحدٍ مِنكُم أنْ يحمِلَ سيفَه ويَطوفَ المَحلَّةِ مِنْ بابٍ إلى بابٍ ويَقتُلَ أخاهُ وصديقَه وجارَهُ(خروج32:27)<br />وكلَّمَ الآخرينَ فسمِعتُهُ يقولُ: إِذهَبوا في المدينةِ وراءَهُ واَضربوا لا تُشفِقوا ولا تَعفوا اَلشَّيْخَ وَالشَّابَّ وَالْعَذْرَاءَ وَالطِّفْلَ وَالنِّسَاءَ اقْتُلُوا لِلْهَلاَكِ (حزقيال9: 5-6)<br />كُلُّ إِنْسَانٍ يَعْصَى قَوْلَكَ وَلاَ يَسْمَعُ كَلاَمَكَ فِي كُلِّ مَا تَأْمُرُهُ بِهِ يُقْتَلُ. إِنَّمَا كُنْ مُتَشَدِّدًا وَتَشَجَّعْ»(يشوع18)<br />فالآنَ اَقْتُلوا كُلَ ذَكَرٍ مِنَ الأطفالِ وكُلَ اَمرأةٍ ضاجعَت رَجلاً وأمَّا الإناثُ مِنَ الأطفالِ والنِّساءِ اللَّواتي لم يُضاجعْنَ رَجلاً فاَسْتَبقوهُنَّ لكُم ( عدد 31 : 17-18 )<br />كل هذي محبه حتى الاطفال يقتلوا<br />هذا مو كلام الانجيل ولا مألفينه على رب المحبة<br />ذبح اطفال وبهائم ونساء وبقر بطون حوامل<br />قال ارهابيين قال<br />ومن حرق الحوامل والمصلين في المساجد في تيمور الشرقية<br />ومن أهلك العراق كما قال بوش حروب صليبيه او زلة لسان!<br />ومن قتل اطفال ونساء افغانستان<br />ومن احرق مدارس الاطفال المسلمين في الفلبين<br />وفكر في هذه البلدان تعرف القصد<br />الهنود الحمر<br />مجزرة روندا<br />افعانسان<br />العراق<br />فلسطين<br />احتلال مصر<br />الجزائر<br />المغرب<br />تيمور الشرقية<br />احتلال اندونيسيا<br />هيروشيما<br />البوسنة والهرسك<br />الشيشان<br />الجولان<br />الاندلس<br />السودان<br />فلبين<br />مذابح التوتسي والهوتو<br />وغيرها الكثير ماراح ننتهي من مجازركم فهي إلي هذه اللحظة مستمرة<br />ولاننسى هتلر موسيلينى ترومان بوش الاب والابن قاده الحرب العالميه الثانيه ميلوسوفيتش والراهبة إلي حوكمت في مجزرة التوتسي والهوتو<br />يعني اسماء قمة في الارهاب والدموية وهم ( مسيحين )<br />انت مصدق كلامك<br />اكثر من قتل من البشر هم من يعتنقون المسيحية<br />معظم من احتل الشعوب الاخرى على مدى التاريخ الدول المسيحية<br />المسيطر على عالم الجريمة و الدعارة فى العالم مسيحيون<br />المسيطر عالميا على تجارة المخدرات مسيحيون و يهود طبعا<br />المسيطر على تجارة الأسلحة الغير شرعية يهود و مسيحيون<br />الذى يعمل دائما على تطوير ترسانات أسلحته خصوصا أسلحة الإبادة الشاملة مسيحيون<br />الدول التى استخدمت فعلا اسلحة الدمار الشامل دول مسيحية"
