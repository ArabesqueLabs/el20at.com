subject = "سؤال للصليبيين"
author = "مش لازم"
posted = "2008-04-05"
text = "لماذا يستحق الصليب هذا التعظيم والعبادة ولا يستحق الاهانة لانه كان الاداة في صلب الهكم كما تزعمون ( علما ان السيد المسيح عند رجوعه قبل قيام الساعة كما اخبر القران والحديث اول ما يفعله هو تكسير الصليب والدعوة الى الاسلام ) فان قلتم لانه لامس جسد المسيح , قلنا لكم صليب واحد لمس جسد المسيح ؟ وهل ملايين الصلبان الحديدية التي تصنعونها اليوم لمست جسد المسيح ؟ واذا كانت الامانة التي هي جوهر عقيدتكم تنص على ان الاله مات ثلاثة ايام فمن الذي احياه بعد ذلك ؟ واذا كان المسيح بيده ارزاق العالم فمن تولى شؤون العالم خلال مدة موته ؟ انه يوجد لدينا العديد من الاسئلة لا يجاب عنها الا بالفرار منها والغاء العقل نهائيا ولنا سؤال اخير هل اليهود صلبوا الرب برضاه ام بغير رضاه ؟ فان كان برضاه فيجب ان تشكروهم لانهم فعلوا ما يرضي الرب , وان كان صلبوه بغير رضاه فاعبدوهم لانهم غلبوا الرب وصاروا اقوى منه لان القوي احق بالعبادة من الضعيف , كما قال الشاعر :<br />عجبا لليهود والنصارى والى الله ولدا نسبوه<br />اسلموه لليهود و قالوا انهم من بعد قتله صلبوه<br />فلئن كان ما يقولون حقا فسلوهم اين كان ابوه<br />فاذا كان راضيا باذاهم فاشكروهم لاجل ما صنعوه<br />واذا كان ساخطا غير راضي فاعبدوهم لانهم غلبوه"
