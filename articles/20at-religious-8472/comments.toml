posted = "2008-04-02"
text = "أي حرية ؟<br />المسيحين اساس دولتهم ان تقام على لادين<br />الله يخليكم يامسلمين<br />والله مضحوك عليكم بكلمات الحرية والتطور<br />حرية في سب والاستهزاء بنبينا<br />وبالمقبال إن اتيت بفتح موضوع عدد ضحايا الهولوكست لسجنت اسبوعين<br />انت يامسلم مهما تطورت<br />ومهما مشيت خلف الغرب<br />بتظل يعفور<br />تعرفون معنى الكلمة<br />اخوانكم المسيحين يسمونك يعفور<br />دور على المعنى<br />قال احد المستشرقين<br />لن يدمر الاسلام إلا الايادي المسلمة من الداخل<br />قلدوهم واتبعوهم<br />واظهروا انكم متحررين وانكم ناس كول وانكم متطورين<br />وبتظلون في نظرهم البربر الخارجين من الصحراء<br />الغير متحضرين والارهابيين<br />مهما فعلتوا شوفوا دول اوربا وقت الرسوم تضامنت كلها واعادت رسم الصور<br />وقالت لكم ماراح تترك الدنمارك وحدها<br />وين فلسطين ياعرب<br />وين غزة؟<br />وين أرض العزة<br />تخالفون امر النبي صلى الله عليه وسلم صراحة<br />يقول اطردوهم تقولو نستقبلهم<br />يقول لايجتمع في الجزيرة دينان تقولون الا يجتمع<br />حرية يارسول صلى الله عليه وسلم وتطور<br />الفاتيكان مابنى ولا بيبني مسجد فيه ولو اتقطعتم وانتم تقولون حرية<br />والنعم فيكم يامسلمين<br />قال عمر رضي الله عنه<br />نحن قوم اعزنا الله بالاسلام نحن قوم اعزنا الله بالاسلام فإذا ابتغينا العزة بغيره أذلنا الله<br />مافي مثل مذلتكم<br />لاصرتم مسلمين ولا غرب<br />بين بين"
