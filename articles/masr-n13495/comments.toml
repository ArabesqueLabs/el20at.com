[[comments]]
order = 0
subject = "البقاء للة - احذروا السواق صعيدى"
author = "واحد من البلد"
text = "العملية مهزلة - سواق موقف عربية وفيها ركاب على المعدية من غير ما يشد فرامل اليد<br />طبعا المعدية ماشية على المية وفية امواج بتحرك المعدية واتحركت العربية اللى من غير فرامل ونزلت تحت المية والكل غرق<br />هنقول اية ؟<br />سواق بلدياتى - مخة عشوائى<br />وانا احذر الجمهور من اى سواق صعيدى - رغم اننى صعيدى من فرشوط"
archived = "2007-12-25"
capture_url = "https://web.archive.org/web/20071225234523/http://masr.20at.com:80/newArticle.php?sid=13495"

[[comments]]
order = 1
subject = "الى حسام الزمر"
text = "كيف يجمع بين حديث: ( من قتل دون ماله فهو شهيد ) وحديث: (اسمع وأطع وإن ضرب ظهرك وأخذ مالك)؟<br />كيف يجمع بين حديث: ( من قتل دون ماله فهو شهيد ) وحديث: (اسمع وأطع وإن ضرب ظهرك وأخذ مالك)؟<br />س : أحسن الله إليكم ؛ يقول السائل : فضيلة الشيخ : كيف يجمع بين حديث: ( من قتل دون ماله فهو شهيد ) وحديث: (اسمع وأطع وإن ضرب ظهرك وأخذ مالك فاسمع وأطع )؟<br />ج : (اسمع وأطع وإن أخذ مالك وضرب ظهرك ).هذا في ولي الأمر، أما المدافعة عن المال فهذا مع غير ولي الأمر.<br />لو جاء ظالم ،أو سارق ،أو لص ،أو قاطع طريق يريد أخذ مالك ،فإنك تدافع دونه ولو قتلت ، فإن قتلت فأنت شهيد ،أما ولي الأمرفلا تدافع ،لو أخذ مالك لا تدافعه ؛ بل اصبر على ذلك دفعا لأعظم الضررين ،فرق بين ولي الأمر وبين آحاد الناس ،الظلمة من آحاد الناس .<br />ــــ<br />المصدر :<br />كتاب : شرح حديث (إنا كنا في جاهلية ) للشيخ صالح الفوزان - حفظه الله تعالى -<br />منقول"
archived = "2007-12-25"
capture_url = "https://web.archive.org/web/20071225234523/http://masr.20at.com:80/newArticle.php?sid=13495"

[[comments]]
order = 2
subject = "غرقى فى النيل وغرقى على شواطىء اليونان"
author = "قرفان"
text = "الكل بيغرق<br />ناس بتغرق فى النيل وناس بتغرق على شواطىء تركيا واليونان وايطاليا<br />وناس بتغرق فى العبارة فى البحر الاحمر<br />اية الحكاية<br />النحس ركب البلد والا اية<br />عايزين التلفزيون يذيع اغنية انى اغرق تحت الماء -- انى اغرق -- اغرق<br />اة يا بلد بتغرق كل يوم"
archived = "2007-12-25"
capture_url = "https://web.archive.org/web/20071225234523/http://masr.20at.com:80/newArticle.php?sid=13495"
