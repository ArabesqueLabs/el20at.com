posted = "2007-03-21"
text = "واضح ان الفيلم يروج عن الفكر اليهودى الذى يشكك فى نبوه سيدنا عيسى عليه السلام وده مش من دلوقتى طبعا ده من اول نبوه عيسى ومن الطبيعى انهم يعتقدوا بفكره ان هناك قبر للمسيح حتى يشككوا فى نبوه عيسى ويقوموا بالترويج والاثاره حتى يجنوا من زلك بالدولارات ليس الا …واليهود باريعيين جدا فى الكسب المادى حتى لو كان على حساب الدين لو تابعتوا ان الاسرائليين ازاعوا شريط يوضح عمليه روح شاكيد التى كانت مقامه لقتل اسرى مصريين و جنود اعزل من السلاح… وجنوا اكثر من مليار ونصف شيكل قيمه بيع هذا الفيلم بعد ان اثار الرأى العام المصري وبيعه للفضائيات وبذلك حققوا العائد المادى"
archived = "2010-11-22"
