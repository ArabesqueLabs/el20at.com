text = "أختلف مع الأخ الذي قال أن القرآن لم ينقل أن المسيح لم يتزوج و لم ينجب ليثبت أن ذلك لم يحدث ذلك لأن عدم النقل ليس نقلا للعدم .<br />ثانيا يكفينا الكثير من الأخبار التي نقلت التي تدل على أن المسيح لم يُقتَل و لم يُصلب<br />يدعي الخبر أنهم وجدوا بقايا جثة اليسوع و هذا كلام غير سائغ لأنه من المعلوم أن الأرض لا تأكل جثث الأنبياء<br />و السلام"
