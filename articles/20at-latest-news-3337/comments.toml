[[comments]]
order = 6
subject = ""
author = "kerellos_kkk"
posted = "2007-03-26"
text = "المجدلية تلك المرأة الخاطئة التى كان بها سبعة ارواح نجسه وتحنن عليها المسيح بعد ان قدمت توبتها زوجة المسيح؟؟؟؟<br />لو كان المسيح قد تزوج الا يوجد ولو اشارة واحدة لزوجته على لسان تلاميذه؟؟؟ الا يذكرون موقفها واعمالها وهو مقبوض عليه ؟؟ وهو يجلد؟؟؟ وهو معلق على الصليب؟؟؟ الا يوصى احدا بها؟؟ الا تتسلم جسده ؟؟؟او يتسلمه ابنه؟؟لقد اوصى يوحنا على امه الا يوصيه على زوجته وابنه ؟؟المسيح الذى تم اعداد امه اعدادا خاصا لتستحق مجيئه منها فقد فضلها الله واصطفها وطهرها واصطفاها على نساء العالمين …بل ان طعامها كان طعاما سماويا من عند الله …انها بدع وافكار ان دلت فهى تدل على شئ واحد صدق كلام كتابنا المقدس الذى حذرنا فيه السميح قائلا ::<br />( انظروا لا يضللكم احد)) وقال ايضا (( ان الشيطان سيصنع ايات وعجائب لو امكن لضل المختارون ايضا ولكن من اجل المختارين تقصر تلك الأيام)) كما قال (( ان قيل لكم ان المسيح هنا او هناك فلا تصدقوا لأنه سيأتى ابن الأنسان من المشارق فى مجده ومجد ابيه وتراه كل عين وتنوح عليه كل الأمم)) كفى المتسفهين سفاهة فمن ذا الذى يستطيع ان يهدم ايمان يؤرخ به لكل البشرية جمعاء …ليعيد كل انسان حساباته قبل ان يأتى اليوم الذى لن ينفع فيه ندم النادمون…"
archived = "2010-11-22"
capture_url = "https://web.archive.org/web/20101122134503/http://www.20at.com:80/20at/latest-news/3337.html"

