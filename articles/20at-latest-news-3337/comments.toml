text = "الكلام دا كله غلط وسيدنا عيسى عليه السلام لم يدفن تحت الارض اصلا بل رفعه الله عز وجل عنده ونزل الارض انسان الذى صلب وشبه لهم انه سيدنا عيسى عليه السلاام ولا جدال فى ذلك فالقراءن دلنا على كل صغيره وكبيره فى حياتنا الان والماضيه ومافى المستقبل ولم يترك شىء صغير بدون تفسير فاذا اعيدوا قراءه القراءن سيجدوا ان كل هذا هراء"
