[[comments]]
order = 10
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-06-01"
text = "أنت هكذا تفعل بالتدقيق ما قاله المسيح في الكتاب المقدس \"الذي تدعيّ تذيفه\" فأنت بهذا تضربني على خذي الأبمن، لأن الضرب على الخذ الأيمن لا يتم إلا بظهر اليد اليمنى ومعناه الأهانة، وها أنا أحول لك أليسر أيضاً فلا تعود تهني لأنك تضربني على خذّي الأيسر ولكن أقول لك أنك لا تستطيع أهانتي. فالكتاب المقدس لديه من الأثباتات العلمية التي تمتلئ بها المتاحف في العالم كله التي تدل على إستحالة تحريفه، والني يعود تاريخها إلي القرن الأول الميلادي، إلا إذا كان تم تحريفه قبل ميلاد المسيح. ثم أين هذه النسخة الأصلية التي تدعي أنها حرفت؟ وكيف عرفت بها أنت ولم يعرف بها كل المسيحين في العالم؟ هل لديك هذه النسخة؟ وإلم يرجع تاريخها؟ ومتى تم العثور عليها؟ هل قارنتها بالمخطوطات الموجودة في متحاف العالم أجمع؟<br />أرجوك أن تسأل نفسك قبل أن تضربني على خذي الأيمن مرة أخرى،\" هل أنا واثق من كلامي؟\" \"لو كنت واثق، فهل يحق لي أن أهين الناس كلما أتيحت لي الفرصة؟\" وبعد ذلك أفعل ما شئت"
archived = "2010-11-22"
capture_url = "https://web.archive.org/web/20101122134503/http://www.20at.com:80/20at/latest-news/3337.html"
