subject = "اتنيل على عينك يا فندى واخرس !!!"
author = "مصرى عجوز وبيحب مصر"
posted = "2008-01-21"
text = "بطل هجص يافندى ولم نفسك !!!!!كل كلامك عك فى عك !! الّلى انت كتبه دا تضليل ومن توجهات صهيونيه وسرد تاريخ باسلوب كدب فى كدب !!!!!!!!!!!! وانت الان امريكى الجنسيه والولاء للصهاينه ويستخدموا امثاللك فى بث الاكاذيب والاوهام للشعب المصرى ! واسألك ماذا فعلت اسرائيل بعرض المبادره العربيه للسلام ؟ ؟؟؟اخرس يافندى !!!وانت وامثالك انكشفتم !!!وبنطرطر على مقالاتكم لانه ببساطه فيها ارهاب صهيونى مسيحى وتدمير العراق تم بغزوها وما كتابالتكم الا لتفكيك الانتماء الوطنى لمصرنا وهى من ثوابت ديننا الاسلامى الذى منه الوطنيه وهيهات ان تنالوا منا يا خنازير البيت الاسود ! اخرس يا فندى"
