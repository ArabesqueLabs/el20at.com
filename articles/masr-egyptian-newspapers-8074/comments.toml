subject = "باتنين ونص وتعال بص"
author = "مأمون فندي"
posted = "2008-01-21"
text = "على الرغم من قراءتي للمقال على الشرق الاوسط<br />لكن لم يهمني ساعتها التعليق على المقال<br />ذلك بحكم ان الشرق الاوسط جريدة لندنية تتحمل كافة وجهات النظر<br />ولا يقرأها الا القارئ المهتم بوجهات النظر المختلفة<br />اما وقد نشرت هنا فيهمني توضيح نقطاط هامة<br />اولا انا من اشد المعجبين بمقالات فندي من الناحية الحرفية ككاتب صحفي فهو غالبا يحمل دوما الجديد في كتاباته سواء في الشرق الاوسط اللندنية او جريدة الجريدة الكويتيه<br />ثانيا والاهم حتى الان لا استطيع ان احدد توجه فندي في تناوله للموضوعات مما يشعرني احيانا بأنه عروس ماريونيت جميلة تتحرك حسب ماسك الخيوط<br />رأيناه في بداية تعارفنا عليه على قناة الجزيرة القطرية ولسبب لا نعلمه رأيناه يهاجمها بشدة<br />رأيناه يؤيد وبقوة الغزو الامريكي للعراق وهو الان يدافع عن الشعب العراقي في وجه الغزو<br />رأيناه يتغنى انه اصبح كاتبا بالاهرام العريقة وفي نفس المكان الذي ملاءه يوما هيكل ثم رأيناه يكتب ان صحافة مصر همجية زي مصر<br />رأيناه ناصريا وقد كان احد مروجي حزب التجمع واستقبل الثوري خالد محي الدين بمنزله في انتخابات 86<br />ورأيناه يهاجم السادات حين كان احد قادة مظاهرات الطلبة في بداية الثمانينات<br />ورأيناه يؤيد السادات عندما تذوق البرجر الامريكي على شواطئ هونولولو<br />رأيناه يهاجم مبارك في الكرستيان ساينس مونيتور<br />ورأيناه يؤيد مبارك على صفحات الاخبار المصرية وهاجم صديقه توماس فريدمان بضراوة<br />محصلة الكلام<br />رأيناه يقول نعم لمن يدفع اكثر<br />وقرب قرب يا جدعان<br />المقال باتنين ونص وتعال بص"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "السلام والحجاب - ملوخية او بدنجان"
author = "مأمون ابو مخ مسطح"
posted = "2008-01-22"
text = "انا اذكر انة فى شبابى كانت البنات بتلبس مينى جيب وميكروجيب فى الجامعة - وفى ايامنا كان الهيبز فى اوروبا<br />وكان عندنا كتاب علمانيون ينكرون وجود اللة جهارا عيانا وكانوا فى مناصب عليا<br />ثم فى ظل كل ذلك الانحلال والعرى حدثت لنا اكبر نكسة واكبر وكسة فى تاريخ مصر كلها<br />ورجعت مصر الى اللة<br />والفضل كل الفضل للجماعات الدينية والشباب المتدين وليس الاخوان ابدا<br />وكانت صيحة النصر فى حرب اكتوبر هى اللة اكبر<br />كان الكل يصرخ مسلمين ومسيحيين على الجبهة اللة اكبر<br />ونصرنا اللة عندما عرفنا طريق ربنا وتحشمت بناتنا ونسائنا<br />وكانت غلطة السادات الكبرى هى الانفتاح او الانفشاخ كما اطلقنا علية وقتها الانفتاح الغير مخطط<br />وركب كراسى الحكم الحرامية والمهلباتية<br />وضاعت البلد"
archived = "2010-03-14"
