text = "السلام عليكم ورحمة الله و بركاته اولا تحية و تقدير للأخ الكريم على هذا الطرح الأكثر من رائع .<br />و الذي شدني اليه رغم انه كان لي نفس الشعور تجاه شعبنا في مصر اقول شعبنا نعم لأننا كلانا جزاً لا يتجزء من العروبة .<br />واقول انا في الأول كنت مدمن على الكره المستديرة اكثر ادمان لكن حينما تدخل البغض و الحسد عن الحب و الاخوة . تراجعت عن اتباعي لهاته الرياضه التي اصبح شأنها الدنيوي اكثر منه رياضي . هل من اجل جلدة (قطعة من الجلد ) مكورة يتخاصم الأخوة . اضن ان في الأمر دس يهودي لقد انشغلنا بالكرة عن قضيتنا فغزة تدمر و قانون العقوبات على اسرائيل يؤجل نحن نسفق و نرقص اسف علة العبارات ....... لا يهم من سيفوز في المباراة القادمة المهم انه فريق عربي في المنديال سواء الجزائر او مصر في الأخير اقول من الجزائر نرسل حبنا مع لاعبينا الى كل قلب مصري فان قبلتموه فرحنا وان رفضتموه تمنينا القبول ونضن خيرا باشقائنا اخواننا احبتنا في الله وشعبنا في مصر لكم مني افضل النمى اخوكم من الجزائر حامد"
