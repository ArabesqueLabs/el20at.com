order = 0
subject = "المقال فاشل - انت تتحدث عن رجال اعمال ولكنهم ليسوا رجال اعمال بل حرامية ورجال النظام الحرامية"
author = "مصرى"
text = "لو انفتحت مغارة على بابا الحقيقية بتاع السينما واحمد عز لم يشتغل -بل اخد حميرة وذهب الى المغارة ليحمل الذهب والياقوت والمرجان من المغارة كل يوم ويبيعها - هل تعتقد ان مغارة على بابا تعمل لة 60 مليار جنية فى 3 سنوات<br />اشك<br />اى ارباح تعمل 60 مليار فى 3 سنوات<br />العملية نهب منظم واحتكار وسرقة بلد عينى عينك<br />احمد عز شريك جمال مبارك وعلاء مبارك وبيبرطع فى البلد كانها وسية ابوهم<br />لية ما يبقاش فية طيارات خاصة وقصور وحريم وشعب مطحون بيقف طوابير خبز كل يوم 3 ساعات<br />اى شرعية للنظام<br />شرعية خالتى فكيهة بتاعة البدنجان<br />شرعية راجل كان بينام على الفرن وسط البراغيت فى بلدهم لينام على سرير الملكة فريدة<br />صح النوم يا شرعية"
archived = "2008-04-14"
capture_url = "https://web.archive.org/web/20080414141549/http://masr.20at.com:80/newArticle.php?sid=15180"
