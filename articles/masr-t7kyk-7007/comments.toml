text = "محكمة الجنايات ترد على «رسالة تطمين أيمن عبدالمنعم» إلي فاروق حسني وفريد الديب يفشل في تحريره من سجن طرة<br />نقلا عن جريدة الجمهورية 10/10/2007<br />أيدت محكمة جنايات القاهرة أمس قرار الكسب غير المشروع بمنع أيمن عبدالمنعم محمود مدير صندوق التنمية بوزارة الثقافة وزوجته وأولاده القصر من التصرف في أموالهم السائلة والمنقولة والعقارية.<br />صدر الحكم برئاسة المستشار محرم درويش بعضوية المستشارين حسين الحداد وعبدالسميع شرف الدين.<br />وكانت الجلسة قد بدأت امس بتعقيب الدفاع علي ماورد من جهاز الكسب غير المشروع بخصوص المستندات التي احالتها له المحكمة في الجلسة السابقة والتي قدمها الدفاع لاثبات ان أموال موكله أيمن عبدالمنعم مشروعة.. طلب من المحكمة استبعاد جميع الاوراق التي تم استخراجها من مصلحة الضرائب استنادا الي أنها لاتخص هذه القضية وليست ردا علي ماقدمه من مستندات طلب دراستها ورأي الكسب غير المشروع فيها وما اذا كانت صحيحة او غير ذلك.<br />اضاف ان عضو الرقابة الادارية توجه الي مصلحة الضرائب بالسنبلاوين لاستخراج شهادات لاعلاقة لها بالقضية واستخراجها بدون اذن صاحبها او اذن محكمة الاستئناف ممنوع قانونا ويرقي الي الجريمة استنادا الي قانون الضرائب علي الدخل.<br />سلم الدفاع الي المحكمة مستندات اخري في جلسة أمس من مصلحة الضرائب بموقف موكله منها وانه سدد جميع مستحقات الضرائب.<br />قال اننا قدمنا مستندات من جهة عمل ايمن عبدالمنعم بأن راتبه شهريا يصل الي 23 الف جنيه وشهادات اخري بأن ارباحه من شركة واحدة 25 مليون جنيه وقدمنا صورتين لاقرارات الذمة المالية الخاصة به وتتضمن جميع ثروته ونشاطه ولم يقل الجهاز كما اكد الدفاع انها مستندات غير صحيحة وطلب في نهاية مرافعته الغاء امر التحفظ.<br />كانت وزارة الثقافة قد اسندت الي أيمن عبدالمنعم ادارة صندوق التنمية وقع في اختصاصه الاشراف علي كافة المشروعات واعمال التطوير الخاصة بالاثار والمتاحف والمعارض الاثرية واعتماد مستخلصات المقاولين وصرف مستحقاتهم والموافقة عليها وانهاء الاجراءات واعتمادها. تم القبض عليه في قضية رشوة واحالته الي جهاز الكسب غير المشروع الذي اصدر امرا بمنعه من التصرف في أمواله استنادا الي تحقيقه ثروة لاتتناسب مع دخله منها شقة بروكسي وشاليه بمارينا و594 متر أرض بسيدي كرير و537 قيراطا بقرية الرول بالسنبلاوين ونسبة الربع في شركة خدمات نقل ومجموعة سيارات وحسابات بالبنوك."
