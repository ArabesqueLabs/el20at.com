text = "عامين بالتمام و الكمال على طرح هذا الموضوع .. عشرة سنوات سجن للواد أيمن بتاع الوزير .. إقالة الوزير من منصبة .. و بين السجن و الإقالة حكايات مصرية خالصة من الفساد و الإفساد تحتاج عشرات السنين لإصلاح ذات البين، أه يا مصر يا منكوبة بأبنائك و مفيش مخرج لنكبات شعبك من قبضة العصابة الحاكمة.. مسنتين ايه يا ناس بعد كده لما تيجي أمريكا بجيوشها بحجة مساعدة الشعوب للتخلص من دكتاتوريتها كفاية عراق واحدة.."
