[[comments]]
order = 3
subject = "الى الاخ واحد من الناس"
posted = "2008-01-13"
text = "يا أخ واحد من الناس انت كده حليت المشكلة لما ضربت المثل بفرق الكره<br />شوف الاهلي والزمالك والاولمبي والاتحاد والمصري لما بيتطاحنوا في الدوري وخناقات ومشاكل وبلاوي وبعد كده لما بيعملوا منتخب مصر وبيطلع منتخب خيخه وفشنك وبيتغلب على طول<br />shujih بنفتكر الدوري العام والخناقات اللي بتحصل والانتصارات الزائفة لبطل الدوري والكاس لاننا (اتمسخرنا) دوليا<br />كذلك الفرق الدينية جمعية شرعية وجمعية انصار السنه واخوان مسلمين وصوفية و...... و......... وبقية الفرق<br />كلها بتتطاحن مع بعض وبتتقاتل وخلافات مع الاجهزة الامنية وكل ده على كل مستوى العالم الاسلامي<br />وبعدين لما المسلمين بيدخلوا حرب بيتمسخروا تماما كمنتخب مصر يبقى لزوموا ايه بقا الفرقة والتعصب والخيبة<br />هو دا المقصود وحضرتك افدتني كثيرا بالفرق الكروية<br />وسلامي لك"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116085154/http://masr.20at.com:80/newArticle.php?sid=13782"

[[comments]]
order = 4
subject = "رصيف نمره خمسه"
author = "نيفين نيفى نوفا"
posted = "2008-01-13"
text = "عندك حق يا استاذ احمد<br />فعلا منظر المترو بقى مقرف<br />العجيبه ان كل ما نتكلم يقولولنا و القنوات هتصرف على نفسها منين<br />و مسئولى ال FM لما تسالهم عن كثره الاعلانات يقولو نعمل ايه ما احنا خايفين نرفض الاعلانات لا اصحاب الشركات يقولو اننا لما نتشرنا اتغرينا عليهم<br />و على راى عمرو دياب تمزمز تعيش لاخر حياتك و لو باعوفرخه هتاخد عموله"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116085154/http://masr.20at.com:80/newArticle.php?sid=13782"

[[comments]]
order = 5
subject = "تليفاز المترو  بقى محل الاعلانات"
author = "محمود عبد الجليل"
posted = "2008-01-15"
text = "اولا فى البدايه احب اشكر كل من شارك برايه فى الموضوع الهام ده عن نفسى انا وبعض اصحابى يوميا فى المترو بسب موقع مكاننا التعليمى كل يوم فى نفس المعاد فى كل المحطات بنلاقى نفس الاعلانات ونفس التعليقات وانا وصحابى نرجو من مسؤلى الاعلانات بالمترو بايفادة الناس فى الاعلانات الوجوده على تليفاز المترو لان معظم الاعلانات دى موجوده فى الدش والتليفاز العادى"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116085154/http://masr.20at.com:80/newArticle.php?sid=13782"

