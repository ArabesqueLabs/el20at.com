[[comments]]
order = 0
subject = "فاعتزل تلك الفرق كلها"
author = "مش ضروري"
posted = "2008-01-12"
text = "كان الناس يسألون رسول الله صلى الله عليه وسلم عن الخير ، وكنت أسأله عن الشر ، مخافة أن يدركني ، فقلت : يا رسول الله ، إنا كنا في جاهلية وشر ، فجاءنا الله بهذا الخير ، فهل بعد هذا الخير من شر ؟ قال : ( نعم ) . قلت : وهل بعد ذلك الشر من خير ؟ قال : ( نعم ، وفيه دخن ) . قلت : وما دخنه ؟ قال : ( قوم يهدون بغير هديي ، تعرف منهم وتنكر ) . قلت : فهل بعد ذلك الخير من شر ؟ قال : ( نعم ، دعاة على أبواب جهنم ، من أجابهم إليها قذفوه فيها ) . قلت : يا رسول الله صفهم لنا ، قال : ( هم من جلدتنا ، ويتكلمون بألسنتنا ) . قلت : فما تأمرني إن أدركني ذلك ؟ قال : ( تلزم جماعة المسلمين وإمامهم ) . قلت : فإن لم يكن لهم جماعة ولا إمام ؟ قال : ( فاعتزل تلك الفرق كلها ، ولو أن تعض بأصل شجرة ، حتى يدركك الموت وأنت على ذلك ) .<br />الراوي: حذيفة بن اليمان - خلاصة الدرجة: صحيح - المحدث: البخاري"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116085154/http://masr.20at.com:80/newArticle.php?sid=13782"

