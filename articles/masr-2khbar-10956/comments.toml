subject = "اية التخلف دة - اليهود حبايبنا ونسايبنا"
author = "لية"
posted = "2009-01-15"
text = "ما تخلوا المولد شغال<br />انتم ما شفتوش فيلم مولد يا دنيا<br />هو شيخ الازهر مش كان بيسلم على شمعون بريز بحرارة واخوية زايدة<br />ووزير الخارجية ابو الغيط كان بيمسك ايد الست ليفنى بحنية واتيكيت وقرابة اخوية نادرة<br />يبقى تمنعوا المولد لية<br />خلونا نتفرج على النسوان اليهود الحلوين وبطلوا غلاسة بقى<br />والا انتم اخوان مسلمين عايزين تتأدبوا زى بتوع حماس"
