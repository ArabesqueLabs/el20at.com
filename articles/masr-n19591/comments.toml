capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 6
subject = "أرباع الرجال"
author = "المصرى أفندى"
posted = "2009-01-29"
text = "اليوم وقف الناس أحتراما لطيب أردوغان رئيس وزراء تركيا فى دافوس بعد رد موجز فى دقيقة أخرس فيه شيمون بيريز أرهابى أسرائيل الأول بعد كلمته التى حاول فيها الأحتيال على المؤتمر حتى أن عمرو موسى وقف وصفق له طويلا. أصبح هناك رجال ترفع الهامات مثل شافيز وأردوغان . و أصبح زعماء العرب من الخصيان وخاصة رئيسنا وأبنه الذى يحبى للطلوع على كرسى بابا. يمكنهم ألقاء الخطب أمام كدابين الزفة من منافقين الحزن الوطنى لكن الحقيقة المرة أن أنحيازهم لأسرائيل كان مفضوح وغير مفهوم . وأصبح دور مصر التاريخى دور مهمش وعبارة عن سكرتارية ومطيباتية. وسلم لى على أحمد أبو الغيط سنيد الست ليفنى.. والله حاجة توجع القلب فعلا.. حسبنا الله ونعم الوكيل..."
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 7
subject = "مصر ستبقي الملجا"
author = "محمدعبدالله"
posted = "2009-02-02"
text = "رغم كل ما قراته في هذه المقاله الا انني اذكر السيد الاستاذ الكاتب الموقر بدور مصر مع القضيه الفلسطينيه منذ نشوءها والدور السياسي لمصر منذ عبد الناصر الي مبارك والمساعدات الماليه والمعونات التي تصل للفلسطينيين واقول لسيادتك انه بالفعل الذي حققه القائد المنتصر السادات واكرر القائد المنتصر لو ان 5% منه عرض علي حماس او سوريا الداعمه لحماس كما يزعم البعض لقبلت به وسوريا تدعم حماس لمصلحتها ومصلحه ايران لولا ذلك ما كانت المساعده مصر التي تتحدث عنها كانت ومازالت سيده الدول العربيه كلها لانه بدونها لن يكون هناك شئ يسمي العرب .<br />واود ان تعرف ان قطر وسوريا شئ واحد يسعي لمصلحه ايران واسالك سوال لماذا تريد ويريد البعض من مصر ان تتحرك عسكريا بمفردها ؟ كان ياسيدي من الاولي ان تتحرك سوريا باعتبار ان لها ارض محتله او حزب الله بقائده المغرور السيد نصر الله واذا كانت حماس تري ان مصر ليست الطرف الوحيد تمتنع عن المجئ الي مصر وتحل قضاياها بعيد عنا واسال سيادتك سؤال اخر من من العرب فعل ما فعلته مصر ؟ لم يفعل احد ما فعلته مصر من مسانده للقضيه من مساعدات سياسيه ومؤن عيب اننا نبخس الناس اشياءهم مصر موجوده فا العرب موجودين تذكر ذلك جيد واللي مش مقتنع هناك جدران كثيره"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 8
subject = "الحاكم ؛مصر"
author = "ابو اسامة"
posted = "2009-02-08"
text = "ارجوا من الاخوة الذين يتكلمون عن مصر وعن دور مصر ان يفصلوا بين دور مصر كدولة وشعب وبين دور الحكام فلا يجب ان نجمع بينهم لآن مصر لايمثلها حاكم لم ينتخبه احد ولا يمثل دور مصر التاريخى من قريب او بعيد . وليتذكر الآخ الذى يمدح فى الحكام اين كان شعب مصر بآرائه وتوجهاته واين كان الحاكم بآ رائه وتوجهاته بل ولينظر الى توجهات الآمة بأسرها اين كانت<br />واين كان هو . وللاءذكره بقول المصطفى عليه السلام(ان امته لا تجتمع على زور) فهل كان رأيه يمثل راى الناس او ما قاله الرسول ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "نظام حسني مبارك"
author = "اكتب اسمك هنا"
posted = "2009-02-09"
text = "نظام حسني مبارك ( لا علاقة له بالشعب المصري العزيز ):<br />1 منع وفود من محكمة الجنايات الدولية من عبور معبر رفح للتحقيق في جرائم العدوان الصهيوني.<br />2 منع وفود من منظمة حقوق الأنسان للدخول لغزة لدراسة الأعتدءات الصهيونية.<br />3 منع دخول الأطباء و المساعدات الطبية لمساعدة اهل غزة من دول متعددة.<br />4 استجواب المصابين من اهل غزة و تعذيبهم اثناء دخولهم للعلاج في مصر لجمع معلومات عن حماس .<br />5 منع الأعلامين مثل الجزيرة و غيرهم من دخول غزة لتغطية الدمار الذي احدثه العدوان الصهيوني.<br />6 منع رسو السفينة الأيرانية في الموانئ المصرية لمساعدة اهل غزة.<br />7 مصادرة الأموال بحوزة اعضاء من حماس اثناء التوجه الى غزة.<br />8 تضييق الخناق مرة اخرى على غزة عبر معبر رفح.<br />9 تدمير الأنفاق بين غزة و مصر و التي من خلالها يتم نقل الأدوية و الطعام الى غزة.<br />10 تجنيد الأعلام الحكومي و الموالي للنظام من شن هجوم عقائدي و سياسي على ايران و قوى المقاومة الشريفة و سوريا.<br />11 دعوة اعلام الدول المعتدلة ( القنوات المصرية الحكومية و الموالية لها, جريدة الأهرام وغيرها, قناة العربية, جريدة الشرق الأوسط و الحياة اللندنية والنهار و المستقبل اللبنانيتيين و من لف لفهم ) لشن هجوم اعلامي ضد ايران وتصويرها بأنها العدو للعرب و المسلمين و ليس اسرائيل.<br />12 السماح للأسرائليين بدخول المياه المصرية لأعتراض اي سفينة مثل ما حدث لسفينة الأخوة اللبنانية.<br />و اخيراً نتسائل, هل بضع الملايين التي تمنحها امريكا لمبارك و رجاله كل عام كافية و مجزلة للمساعدة في قتل شعب اعزل؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
posted = "2009-02-14"
text = "كل من عارض السيد جمال مبارك هم من الاخوان المتأسلمين الطامعين فى الحكم وما اكثرهم على الانترنت !! هولاء المرضى من الاخوان المتأسلمين يريدون تقليب الشارع على الشيد جمال مبارك لان خيالهم المريض خيل لهم ان مرشدهم العام مهدى عاكف سوف يصل الى السلطة ولكن العقبه هو جمال مبارك !! وهنا اقول لهم اين مهديكم عاكف من جمال مبارك !! مهدى عاكف مرشد الاخوان المتأسلمين مدرس العاب ابتدائى سابق فهل يعقل ان يكون مدرس العاب منافس لجمال مبارك الذى دخل قلوب جميع المصريين ."
