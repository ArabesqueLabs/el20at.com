[[comments]]
order = 11
subject = "فوق ياحمار"
author = "الشيشتاوى"
posted = "2009-02-17"
text = "أرد على الحمار الشهير بحسين كامل أن سيدك جمال مبارك اللى أنت عاوز تبيعه لنا فى الضلمة ممكن يكون جوز أمك عشان تقولله ياعمى. وممكن يكون رئيس لحزنكم الوطنى. لكن يكون رئيس لمصر أهو ده اللى مش ممكن أبدا ولا تفكر فيه. لأنه مصر كلها بتكرهه هو وأبوه وأمه حتى لو عصرتوا عليه مائة لمونه. بص حواليك وأنت تعرف ليه .كابة وفقر ووساخة وتلوث وناس بتموت وشباب بيغرق وهو بيهرب من البلد وأضرابات فى كل مكان وحكومة غبية بتحكم شعب وهمى فى خيالها و.. و.. و.. حنقول أيه ولا أيه بس. قارن الدلوع ده برجالات مصر اللى قلبهم على البلد أمثال الدكتور البرادعى والا الدكتور جويلى والا الدكتور زويل وغيرهم كتير من الشرفاء فى وخارج مصر. مصر تستاهل أحسن من كده. مصر أكبر بكتير من أل مبارك وسيبك من قصة الأخوان والأقباط وقنابل الدخان اللى بتضربوها لغاية ما نلاقى البلد سرقها واحد تانى من النسل الوسخ ده. مش كده برضه ياحمار.."
archived = "2010-03-14"
capture_url = ""
