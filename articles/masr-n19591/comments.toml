[[comments]]
order = 1
subject = "انتهى دور مصر تماما والمبادرة المصرية رمتها اسرائيل فى الزبالة واوقفت النار من طرف واحد ولم تفتح اى معابر"
text = "عشرات اللقاءات تمت بين السيد الرئيس وعرفات فى الشرم وفى القاهرة<br />ومثلها مع ابو عباس وابو قردان<br />عشرات المؤتمرات اعتبارا من كامب ديفيد واوسلو واللجنة العربية<br />كل يوم لقاءات<br />وتنتهى بوجبة ساخنة فى فنادق الشرم الساحرة وكل واحد يروح بعد بقين كلام هايفين لا يستحقوا قرائتها<br />كلام فى كلام فى كلام فى كلام لمدة 26 سنة<br />والنتيجة صفر<br />النتيجة صفر<br />منذ موت السادات والقضية كما هى<br />منذ موت السادات بنلف حول نفسنا<br />قيادات ضعيفة<br />وضعيفة جدا<br />والان دخلت تركيا<br />المبعوث الامريكى هيروح تركيا لان تركيا بتتفاهم مع حماس وسوريا ومصر راحت عليها<br />مصر سياسيا بتعمل وجبات سخنة ولذيذة بس فى الشرم للوفود ويروحوا<br />يبقى خيار المقاومة لتغيير الوضع<br />ولا شىء غير المقاومة<br />وحديث الرسول علية السلام<br />ايما قوم تركوا الجهاد الا واذلهم اللة عز وجل"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 2
subject = "اذا مصر قالت نعم ايدوها"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "اذا مصر قالت نعم ايدوها<br />وان اعلنت لاءها فاسمعوها<br />ومصر منزهة في العرب<br />ومصر العلا وضمير العرب<br />الى بيتها لجأ الانبياء<br />وفرعون معجزة في البناء<br />وأوصى الاله بها العالمين<br />وقال ادخلوا ارضها امنين<br />حمى الله نيلها من كل عاد<br />وجنب شعبها غزو الطغاه<br />فيا رب بارك في مصر الحبيبة<br />وكن معها في الليالي العصيبة"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 3
subject = "قالولي بتحب مصر فقلت مش عارف"
author = "مش رضوى حسن ولا مروى صلاح"
text = "قالولي بتحب مصر فقلت مش عارف<br />المعنى كعبة وانا بوَفْد الحروف طايف<br />وألف مغزل قصايد في الإدين لافف<br />قالولي بتحب مصر فقلت مش عارف<br />أنا لما اشوف مصر ع الصفحة بكون خايف<br />ما يجيش في بالي هرم ما يجيش في بالي نيل<br />ما يجيش في بالي غيطان خضرا وشمس أصيل<br />ولا جزوع فلاحين لو يعدلوها تميل<br />حكم الليالي ياخدهم في الحصاد محاصيل<br />ويلبّسوهم فراعنة ساعة التمثيل<br />وساعة الجد فيه سخرة وإسماعيل<br />ما يجيش في بالي عرابي ونظرته في الخيل<br />وسعد باشا وفريد وبقيّة التماثيل<br />ولا ام كلثوم في خِمسانها ولا المنديل<br />الصبح في التاكسي صوتها مبوظُّه التسجيل<br />ما يجيش في بالي العبور وسفارة اسرائيل<br />ولا الحضارة اللي واجعة دماغنا جيل ورا جيل<br />قالولي بتحب مصر أخدني صمت طويل<br />وجت في بالي ابتسامة وانتهت بعويل<br />قالولي بتحب مصر فقلت مش عارف<br />لا جيتها سايح ولاني أعمى مش شايف<br />ولاني هايف اردّ بخفّة وبسرعة<br />وكل من رد يا كذاب يا هايف<br />أصل المحبة بسيطة ومصر تركيبة<br />ومصر حلوة ومُرَّة وشِرْحة وكئيبة<br />دا نا اختصر منصب الشمس وأقول شمعة<br />ولا اختصر مصر وانده مصر يا حبيبة<br />يا أهل مصر اسمعوني واسمعو الباقيين<br />إن كنت انا رحّلوني كلنا راحلين<br />يا أهل مصر يا أصحابي يا نور العين<br />يا شنطة المدرسة يا دفتر العناوين<br />يا ضغطة البنت بلكراسة ع النهدين<br />ترقص قصاد المراية، واحنا مش شايفين<br />يا صحن سلطان حسن يا صحن كحك وتين<br />يا ألف مدنا وجرس، لألف ملّة ودين<br />يا أهل مصر اسمعوني، والكلام أمانات<br />قلتولي بتحب مصر فقلت مش عارف<br />روحوا اسألوا مصر هيّه عندها الإجابات"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 4
subject = "نتظرنا سنوات عجاف وايام سودة"
text = "طوابير الحديد وازمة فى الحديد<br />طوابير العيش وازمة الخبز<br />طوابير البوتاجاز وازمة البوتاجاز<br />انقطاع الكهرباء 5 مرات فى اليوم<br />مشكلة مياة الشرب<br />مشكلة العشوائيات<br />حوادث الطرق وغرقى العبارات<br />البطالة الشاملة لكل الشباب<br />الاضرابات<br />مشكلة التعليم والدروس الخصوصية<br />انعدام الرعاية الصحية وتدهور المستشفيات الحكومية"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 5
subject = "الى الاستاذ الهوارى ممكن تسأل الاستاذ جمال مبارك عن الاسهم والصكوك اللى وعدنا بيها اخبارها اية"
text = "الى الاستاذ الفاضل جمال مبارك<br />اية اخبار الاسهم والصكوك اللى وعدت بها الغلابة فى مؤتمر الحزب الوطنى - احنا فى انتظار شوية حنية - عايزين نبل ريقنا<br />اهو برضة النواية تسند الزير - وكل واحد لما ياخد الفين جنية اهو كويس برضة<br />سايق عليك المشايخ والست زينب تخلصوا الموضوع بدرى وتقبضونا لحسن الحال مايل قوى<br />وربنا يخليكوا لينا دى احنا غلابة يا بية"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 6
subject = "أرباع الرجال"
author = "المصرى أفندى"
text = "اليوم وقف الناس أحتراما لطيب أردوغان رئيس وزراء تركيا فى دافوس بعد رد موجز فى دقيقة أخرس فيه شيمون بيريز أرهابى أسرائيل الأول بعد كلمته التى حاول فيها الأحتيال على المؤتمر حتى أن عمرو موسى وقف وصفق له طويلا. أصبح هناك رجال ترفع الهامات مثل شافيز وأردوغان . و أصبح زعماء العرب من الخصيان وخاصة رئيسنا وأبنه الذى يحبى للطلوع على كرسى بابا. يمكنهم ألقاء الخطب أمام كدابين الزفة من منافقين الحزن الوطنى لكن الحقيقة المرة أن أنحيازهم لأسرائيل كان مفضوح وغير مفهوم . وأصبح دور مصر التاريخى دور مهمش وعبارة عن سكرتارية ومطيباتية. وسلم لى على أحمد أبو الغيط سنيد الست ليفنى.. والله حاجة توجع القلب فعلا.. حسبنا الله ونعم الوكيل..."
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"

[[comments]]
order = 7
subject = "مصر ستبقي الملجا"
author = "محمدعبدالله"
text = "رغم كل ما قراته في هذه المقاله الا انني اذكر السيد الاستاذ الكاتب الموقر بدور مصر مع القضيه الفلسطينيه منذ نشوءها والدور السياسي لمصر منذ عبد الناصر الي مبارك والمساعدات الماليه والمعونات التي تصل للفلسطينيين واقول لسيادتك انه بالفعل الذي حققه القائد المنتصر السادات واكرر القائد المنتصر لو ان 5% منه عرض علي حماس او سوريا الداعمه لحماس كما يزعم البعض لقبلت به وسوريا تدعم حماس لمصلحتها ومصلحه ايران لولا ذلك ما كانت المساعده مصر التي تتحدث عنها كانت ومازالت سيده الدول العربيه كلها لانه بدونها لن يكون هناك شئ يسمي العرب .<br />واود ان تعرف ان قطر وسوريا شئ واحد يسعي لمصلحه ايران واسالك سوال لماذا تريد ويريد البعض من مصر ان تتحرك عسكريا بمفردها ؟ كان ياسيدي من الاولي ان تتحرك سوريا باعتبار ان لها ارض محتله او حزب الله بقائده المغرور السيد نصر الله واذا كانت حماس تري ان مصر ليست الطرف الوحيد تمتنع عن المجئ الي مصر وتحل قضاياها بعيد عنا واسال سيادتك سؤال اخر من من العرب فعل ما فعلته مصر ؟ لم يفعل احد ما فعلته مصر من مسانده للقضيه من مساعدات سياسيه ومؤن عيب اننا نبخس الناس اشياءهم مصر موجوده فا العرب موجودين تذكر ذلك جيد واللي مش مقتنع هناك جدران كثيره"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074907/http://masr.20at.com:80/newArticle.php?sid=19591"
