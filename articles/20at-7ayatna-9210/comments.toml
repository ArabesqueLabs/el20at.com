[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-05-29"
text = "السلام عليكم، شكرا للأخت الكريمة على هذا الموضوع المتميز.<br />طبيعي أن لكل شخص مهضوم الحقوق، الحرية في التعبير عن احتجاجه و رفضه للظلم و الحيف ولكن الشيء العجيب و المؤسف بالنسبة لي هو أن تكون طريقة هذا الاحتجاج متأثرة أيضا بالثقافة الغربية. والسؤال المطروح هنا هل تعتبر هذه الطريقة في الاحتجاج تعبيرا جادا عن الدفاع عن الحقوق أم مجرد وسيلة لتناسي الأمر و الترويح عن النفس ليس الا ؟؟؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "لا تعليق"
author = "ايات الحبال"
posted = "2008-05-29"
text = "اعتقد يا ليلى ان البطاله اصبحت فى كل الدول العربيه واحنا فى مصر عندنا نفس الاسلوب والاكثر سوء ان اصحاب الشهادات العليا مش بيلاقو الى اقل الاشغال وباقل المرتبات ولو اتعينو فى مؤسسه حكوميه مرتباتهم بتلاقيها قليله اوى فى النهايه الموضوع عندنا وعندكم بس انتم اتعاملتو باجابيه ربنا مع المغاربه"
archived = "2010-03-14"
