subject = "موضوع في الصميم"
author = "خالد"
posted = "2008-05-29"
text = "نعم صحيح هذا ما يعانيه الطلبة المغاربة وهم الذين افنوا أعمارهم طلبا في التحصيل نراهم كل يوم يعانون الامرين ويضربون من طرف الجلادين على مرأى ومسمع من الحكومة والبرلمان نسال الله لهم النصر ونسال الله تعالى أن يقطع الايدي التي تؤذيهم وكل من سلطها عليهم أمين أمين أمين"
