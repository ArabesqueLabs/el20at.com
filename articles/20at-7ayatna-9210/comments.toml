[[comments]]
order = 3
subject = "هناك فرق بين احتجاج واحتجاج"
author = "عادل المغربي"
posted = "2008-05-31"
text = "بداية اسجل شكري الخاص للزميلة ليلى على موضوعها الجميل والملفت لهذه القضية التي اصبحت موضة العصر<br />نسمع اليوم شباب يعبرون عن رفضهم للواقع بالرقص وشعارات الحمار ولست ادري لائحة الاحتجاج القادمة كيف ستكون.. لكني اخشى ان يصبح ذلك بمثابة ميوعة لمفهوم الاحتجاج كوسيلة للضط للحصول على الحق<br />فالذي يرقص في الشاعر او يصنع في راسه شكلا غريبا كوسيلة للتعبير فهذا يغالط نفسه ويغالط مجتمعه وانما هو ينتقم من نفسه.. ولذلك علينا ان نحرص على بقاء مفهوم الاحتجاج نقيا من اي مفاهيم دخيلة والاحتجاج سيبقى احتجاجا .<br />مع خالص شكري"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "على أي إيجابية تتكلمين أختي؟"
author = "نادية العربي"
posted = "2008-06-01"
text = "أعتقد أن الأخت آيات لا تحس بخطورة الموضوع فكون طالبا أو طالبة يتحولان من حملة علم إلى راقصين ليس ايجابيا البتة<br />هذه عادات دخيلة على المجتمع المغربي نسأل الله أن يحفظ أبناءنا من هذه الفتن التي تكرس لها الحكومة كل مجهوداتها وتسخر لها جنود الجن والانس سعيا منها لتدمير كل ما هو جميل في في هذه الفئة المهمة من المجتمع شكرا ليلى على إثارة الموضوع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "لا للصمت"
author = "سعيد اسكموني"
posted = "2008-06-18"
text = "السلام عليكم اخواننا العرب<br />انتم تعلمون ان جل البلدان العربية تعيش تحت قبضة جلاد لا يرجم لا ضعيف ولا قوي السلطة اقتصرت على اصحاب المال والجاه اخواني نحن نضطهد في ابسط حقوقنا انا افرح عندما ارى الطلبة والطالبات يحتجن عن حقهن من منكم قرا التاريخ العربي الاسلامي من منكم لا يعرف السيرة الداتية لصحابي الجليل عمر بن الخطاب القاسط والعادل نحن مسلمون بلا اسلام لان الاسلام شيئ وما نعيشه في حيلتنا اليومية شيئ اخر واقول لكل من قرأ هدا التعليق لمادا نصمت امام طغاة عصرنا ونحن شباب هدا البلد لا للصمت اخواني الكرام وشكرا لكل من اراد تجاوز الصمت"
archived = "2010-03-14"
