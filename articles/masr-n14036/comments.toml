[[comments]]
order = 12
subject = "مساحة للرأي"
author = "ابومحسن"
posted = "2008-02-08"
text = "يا اخواني هذا الموضوع ما ينفعش في هذا المكان مساحة للرأي<br />وقبل كده قلنا هذا اكلام<br />هذا الموضوع ينفع ليوم واحد فقط<br />يعني انا شفت موضوعات في غاية الاهمية تنفع في مساحة للراي واتشالت على طول<br />زي مثلا موضوع عيد الحب دا في غاية الاهمية والمرأة اللي اشتغلت مأذون وغيرها من الموضوعات المهمة اللي ممكن القراء يتحاوروا فيها ويتناقشوا عن طريق التعليقات<br />لا مؤاخذة دا موضوع ميت تماما زي موضوعات نزلت قبل كده (الكرة اجوال والاهداف خيرية) موضوع ميت<br />ورجعت من السفر يا زول موضوع ميت ومن الكرباج الى عشرينات موضوع ميت وكثيرا من الموضوعات اللي ما تصلحش انها تستمر فترة طويلة<br />فنرجو من الاخوة المسئولين عن الموقع الانتباه الى هذا لان جمال الموقع في حوار القراء بعضهم ببعض عن طريق التعليقات"
archived = "2008-03-12"
capture_url = "https://web.archive.org/web/20080312155606/http://masr.20at.com:80/newArticle.php?sid=14036"

[[comments]]
order = 13
subject = "هيجرى ايه"
posted = "2008-02-08"
text = "هيجرى إيه لونتفق<br />مع بعضنا؟<br />الحلم مهما بنفترق<br />هيضمنا<br />ننسج بإيدنا توب خضار<br />على أرضنا<br />نزرع أمل نجني العمار<br />في قلبنا<br />نرويه أمل في كل لحظة<br />في وقتنا<br />هيجرى إيه لونتفق<br />مع بعضنا؟<br />الحلم مهما بنفترق<br />هيضمنا<br />الإختلاف في الرأي ميزة<br />في شرعنا<br />ده خلاف تنوع بيه نكمل<br />بعضنا<br />وماهوش تطوع إنه نقتل<br />يأسنا<br />نغزل لحاف نتغطى بيه<br />من بردنا<br />هيجرى إيه لونتفق<br />مع بعضنا؟<br />الحلم مهما بنفترق<br />هيضمنا<br />نسمع خواتنا ونصغي لولاد<br />عمنا<br />الفتنة بتفرقنا والوحدة تجمع<br />شملنا<br />أبيض وأسود أم واحدة<br />أمنا<br />هيجرى إيه لونتفق<br />مع بعضنا؟<br />الحلم مهما بنفترق<br />هيضمنا<br />هانخلي بكرة يبقى أحلى<br />بعزنا<br />خلوها فكرة تقوى تعلا<br />بصرحنا<br />هيجرى إيه لونتفق<br />مع بعضنا؟<br />الحلم مهما بنفترق<br />هيضمنا<br />نقرا اللي فات نقدر نصلح<br />نفسنا<br />والذكريات بيها نفتح<br />عقلنا<br />هيجرى إيه لونتفق<br />مع بعضنا؟<br />الحلم مهما بنفترق<br />هيضمنا<br />فكر براحتك كيف هننفع<br />أهلنا؟<br />عاوز صراحتك تبقى مدعاة<br />فخرنا<br />هيجرى إيه لونتفق<br />مع بعضنا؟<br />الحلم مهما بنفترق<br />هيضمنا<br />أمراضنا يامة مين يداوي<br />جرحنا؟<br />يوم القيامة الحبيب<br />يشفع لنا<br />لو احنا بنداوي جراحنا<br />بنفسنا<br />هيجرى إيه لونتفق<br />مع بعضنا؟<br />الحلم مهما بنفترق<br />هيضمنا<br />لو كنا"
archived = "2008-03-12"
capture_url = "https://web.archive.org/web/20080312155606/http://masr.20at.com:80/newArticle.php?sid=14036"

