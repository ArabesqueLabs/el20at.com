[[comments]]
order = 0
subject = "الشاب عندة حق"
author = "عادل"
posted = "2008-01-29"
text = "انتم عايزين اية بالضبط ؟<br />المترو مترشق بمباحث امن الدولة - الشاب اذا تكلم فى الدين يبقى اخوان وبيثير الراى العام وخطر على امن الدولة وعلى كرسى الحكم ويتم القبض علية<br />واذا تكلم فى الاقتصاد والوضع الزفت اللى احنا فية يبقى بيهاجم لجنة السياسات ويتم القبض علية وارسالة الى معتقل الواحات<br />واذا تكلم فى السياسة والوضع على الحدود فى غزة يبقى بيتعاطف مع حماس وينضرب بخيرزانة الامن المركزى<br />يبقى يتكلم فى الكورة وابو تريكة ومحمد سعد واللنبى وكل الهيافات قدام الجمهور - ولما يقعدمع اصحابة يقولوا اللى هم عايزين يقولوة ضد الجميع<br />سيدى المعايش - اغنة حكم امنى بوليسى ولا رجعة عنة"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201021620/http://masr.20at.com:80/newArticle.php?sid=14036"

[[comments]]
order = 1
subject = "حكايتي مع مترو الانفاق حكاية طويلة"
author = "فاطمة"
posted = "2008-01-29"
text = "من ساعة ما دخلت الجامعة في 2000 و لغاية دلوقتي و المترو مواصلتي الاساسية ، المفروض انه اكتر مواصلة عملية ، شبكته بتغطي مناطق كتير من العاصمة ، مواعيده مضبوطة ، ما بيتاثرش بزحمة الشوارع ، في عربية سيدات ترحم البنات و لو لفترة بسيطة من سخافات كتيرة ، و الاهم ان سعر تذكرته بسيط، اسعار التذاكر كانت بتتراوح من 50 قرش لغاية 75 قرش و كانت بتختلف باختلاف المسافة ، و بعدين اتوحدت تذكرة المترو و بقت ب 75 قرش بعد حادثة قطار الصعيد ، بعد اضافة تأمين علي المواصلات ، و لكن الزيادة دي ما عالجتش اي مشكلة من مشاكل المترو ، المترو لسة بيتأخر و كتير اوي بيوقف بين المحطات عشان صيانة القضبان و لسة نظام التهوية سيئ جدااااااااا ، دة طبعا غير الزحمة البشعة اللي بقت السمة الاساسية للمترو، ، دة غير غياب الميزة اللي كانت دايما بتميز المترو عن اي مكان تاني في مصر ، و هي التطبيق الفوري للقانون و احترامه ، دلوقتي من العادي جدا ان اي حد يرمي ورق في المترو و محطاته و كمان عادي قوي ان اي حد يزوغ و ما يدفعش تذكرة<br />و اخيرا زادت التذكرة و بقت بجنيه ، و برضه الوضع لسة سيئ و المستفز ان المترو بقي له موارد اخري غير التذاكر زي الاعلانات اللي بتلصق علي المترو كله و كمان الاعلانات اللي بتشتغل في اذاعة المترو و الاعلانات الموجودة في المحطات ، كل دة و يقولوا ان هئية المترو بتخسر 60 مليون جنيه في السنة ، طب ازاي؟<br />كمان ازعجني اوي توقيت زيادة اسعار التذاكر ، لانه جاء بعد رفض البرلمان لقانون خصخصة السكة الحديد، يعني من الاخر وزارة النقل كانت عاوزة فلوس و سلام تزود التذاكر علي الناس ، تبيع السكة الحديد ، المهم تجيب فلوس و السلام مش فارق الفلوس دي من اللي دافعها المستثمرين اللي ها يكسبوا و يرجعوا اللي دفعوه الطاق طاقين و لا من الطلبة و الموظفين<br />انا ما عنديش مشكلة ان هيئة المترو تكسب ، بس في المقابل يبقي في خدمة جيدة ، مش لازم المترو يبقي مكان للعذاب و المعاناة اليومية"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201021620/http://masr.20at.com:80/newArticle.php?sid=14036"

[[comments]]
order = 2
subject = "امتداد الخط الثانى لمترو القاهرة الكبرى"
posted = "2008-01-29"
text = "امتداد الخط الثانى لمترو القاهرة الكبرى<br />أثبتت الدراسات المرورية الحديثة أهمية امتداد الخط الثانى لمترو الأنفاق إلى المناطق عالية الكثافة السكانية. و بناءا على ذلك تقرر مد المترو إلى الجنوب بطول حوالى 2.60 كم. و يتضمن إنشاء محطتين سطحيتين هما محطتى ساقية مكى والمنيب و يتوقع الانتهاء من العمل فى أوائل عام 2005."
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201021620/http://masr.20at.com:80/newArticle.php?sid=14036"

[[comments]]
order = 3
subject = "الخط الثالث لمترو القاهرة الكبرى"
posted = "2008-01-29"
text = "الخط الثالث لمترو القاهرة الكبرى<br />لقد تم تحديد مسار ومواصفات وخصائص الخط الثالث لمترو أنفاق القاهرة وفقاً لمتطلبات النقل حتى عام 2022 ولقد قدمت الدراسة عدة توصيات منها تحديد مسار الخط الثالث ليربط بين شرق وغرب إقليم القاهرة الكبرى مروراً بمنطقة وسط المدينة ليبدأ من مطار القاهرة شرقاً وينتهى فى إمبابة غرباً ماراً بمناطق \" مصر الجديدة – إستاد القاهرة – العباسية – شارع الجيش – العتبة – الزمالك – إمبابة \" بطول يبلغ حوالى 30 كم"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201021620/http://masr.20at.com:80/newArticle.php?sid=14036"

[[comments]]
order = 4
subject = "عاجل - إختطاف مترو الأنفاق"
posted = "2008-01-29"
text = "عاجل - إختطاف مترو الأنفاق<br />بعد غرق البواخر والعبارات وبعد سقوط الطائرات وانقلاب القطارات مفاجأة جديدة يفاجئنا بها مترو الأنفاق<br />اليوم حوالي الساعة 5.30 مساءً كنت بداخل مترو الأنفاق رقم ( 5701 ) المتجة الى المرج وبعد توقف المترو مدة لاتقل عن 15 دقيقة بمحطة سعد زغلول بدأ المترو في السير بسرعة لا بأس بها ولكن المفاجأة ان المترو لم يتوقف نهائياً في المحطات اللتي في خط السير وهذا ما سبب بعض الهرج والمرج بين رواد المترو الراكبين او المنتظرين على المحطات مما أثار الشك بداخل قلوب الركاب على ان المترو قد تم أختطافة من أحد العناصر الأرهابية وهذا بناء على عدم توقفة أكثر من 9 محطات متتالية وسيره بسرعة رهيبة مما جعل بعض النساء يسرعن في القاء الصرخات المدوية وبكاء بعضهم<br />وبعد ذلك تم أيقافة بين محطتي حمامات القبة وسراي القبة وبعدها علمنا ان المترو كان يسير بدون فرامل فبعد التوقف أسرعت الناس في فتح الأبواب يدويا بالقوة والنزول على القضبان مما حول شريط مترو الأنفاق الى طابور جمعية وفي نفس الوقت خرجت بعض الهتافات التلقائية اللتي تندد بإدارة المترو والسكك الحديدية ومنهم من هتف ضد النظام ككل ومنهم من أصر على سباب رئيس الجمهورية لانة السبب في الغلب اللي احنا فية على قول أحدهم فكانت شبة مظاهرة عفوية أمام قصر القبة ولكن داخل أسوار مترو الأنفاق فمن المسئول عن ذلك"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201021620/http://masr.20at.com:80/newArticle.php?sid=14036"

