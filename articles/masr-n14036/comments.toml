text = "مدير شركة مترو الانفاق لواء سابق - واقصى مؤهلاتة وخبراتة ان يدير مركز شباب ابو النمرس - او الساحة الشعبية فى دكرنس - انما جهاز زى مترو الانفاق وادارة تشغيلة وصيانتة فعايز متخصصين وناس بتوع ادارة وخبرة عملية<br />انما سبب بلاوينا ان كل حتة فيها لواء على المعاش بيخرب فيها"
