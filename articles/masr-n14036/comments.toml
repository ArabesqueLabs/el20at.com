[[comments]]
order = 16
subject = "فَرِق..تَسُدْ..!!"
posted = "2008-02-11"
text = "فَرِق..تَسُدْ..!!<br />مبدأ صهيونى قديم اوى..قدم اليهود نفسهم..<br />مبدأ سهل فى تطبيقه..<br />متدارى فى هيئته..<br />خبيث و لئيم و بيجيب من الآخر..<br />لكن زى الشيطان..ما لوش سلطان الا على ضعاف النفوس و المختلين من المختالين بشبابهم و ذكائهم و رؤياهم الثاقبه اللى غالبا ما بتكون اوهام جهل و غباء كبيران..<br />لكن زى ما الوحش له وجود..الفريسه كمان لازم يبقالها وجود..<br />و عشان كده اسرائيل موجوده و بتتغذى زى الوحش من اجساد الفرائس السهله من العرب..<br />اللى نفسهم يتخانقوا و خلاص..مش فراغ و لا حاجه لكن تفانى فى خدمة الوحش الكبير الصهيونى و خدمة اسياد السلطه من العرب نفسهم..<br />لسه بعد آلاف السنين مش فاهمين ان اليوم اللى حنبطل نختلف فيه و حنبطل لعبة الضحيه هو يوم تحررنا من سطوة الطغاة و من حكم نفسنا المتخاذله..<br />امتى حنفهم يا سُنه؟؟<br />امتى حنفهم يا شيعه؟؟<br />امتى حنفهم يا معارضه؟؟<br />امتى اليمين و اليسار و الديمقراطى و البتنجانى حيفوقوا و يقولوا..المهم الامه..المهم الطريق الواحد..؟؟<br />المهم النجاه..بما تبقى من عزه!!<br />اذا كان منها ما يمكن ان يُرى تحت المجهر..<br />امتى حنسند بعض و احنا واقعين...؟؟<br />امتى مش حنفرق و مش حيهمنا نسُد..؟؟<br />امتى؟!!!"
archived = "2008-03-12"
capture_url = "https://web.archive.org/web/20080312155606/http://masr.20at.com:80/newArticle.php?sid=14036"

