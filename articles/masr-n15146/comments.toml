[[comments]]
order = 6
subject = "عشان ربنا هيسألنا يوم القيامة"
author = "ابومحسن"
text = "ربنا حيسالنا يوم القيامه عن منهج النبي صلى الله عليه وسلم وليه ما اتبعنهوش<br />لاننا لو اتبعنا سنة النبي محمد صلى الله عليه وسلم لا يمكن الامر حيوصل الى هذا الحد<br />وحتى كمان النبي محمد صلى الله عليه وسلم حدثنا عن (ظلم وجور الحكام) وقالنا نعمل ايه في حالة حدوث الظلم والجور<br />ارجوا الى السنة النبوية الشريفة وعلماء اهل السنه"
archived = "2008-06-11"
capture_url = "https://web.archive.org/web/20080611191321/http://masr.20at.com:80/newArticle.php?sid=15146"
