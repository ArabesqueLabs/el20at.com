subject = "مرعوب يا حـــــستــي"
author = "أبن البلد"
text = "فعلا الرئيس ده وشلة الحرامية بتوعه .... يـخـافــو ولا يـختـشـو ...بس أنا بقترح ان الأوغاد دول لو ننتقم منهم بضرب الجزم أفضل ..........................لانهم مايستهلوش أفضل من كدة ينضربوا بيه"
archived = "2008-04-12"
