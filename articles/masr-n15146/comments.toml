[[comments]]
order = 0
subject = "حكومة مبتخفشى الا بعنيها"
author = "ابو اسامة"
text = "فعلا حكومة مبتخفشى الا بعنيها و اثبتت ان اللى عاوز ياخد حقه يخده بدراعه<br />وها هم اهالى المحلة يعبرون عن رايهم بجراءة يحسدون عليها فى وسط شعب<br />طال صمته وكاءنه يرضى بما يحدث له فذهب اليهم رئيس الحكومة الفاشلة ليسترضيهم<br />كما فعل مع كل من طالب بحقه بصوت مرتفع فيا شعب مصر لن تنال حقك بالصمت."
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073442/http://masr.20at.com:80/newArticle.php?sid=15146"

[[comments]]
order = 1
subject = "عملوها الوحوش"
author = "اسم النبى حرصة"
text = "بصراحة بتوع المحلة طلعوا رجالة بس للاسف خربوا المحلة واعتقالات وخبس وتخريب للمتاكات وضحايا كنت اتمنى اعتصام واضراب بدون نقطة دم بس بصراحة عملوها الوحوش لذلك زيادة المرتبات وزيادة الدقيق وزيادة البدلات نزلة عليهم ماشاء اللة زى الفل بس يخرجوا منها على خير وربنا يسترها من عندة..... قولوا امييييييييييييين"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073442/http://masr.20at.com:80/newArticle.php?sid=15146"

[[comments]]
order = 2
subject = "المحلة بروفة مصغرة للقادم المرعب"
author = "مصرى من ولاد الارض"
text = "ليست المحلة نهاية المطاف - بل البداية<br />من الذى قام بالاضراب والاعتصام والاشتباك مع امن الكرسى او امن من يجلس على الكرسى ؟<br />انهم شباب مابين الخامسة عشر والخامسة وعشرون<br />شباب عاطل عن العمل لم ينل قدر من التعليم وصايع على المقاهى ويؤدى اعمال هامشية وفاقد الامل فى مستقبل<br />لا امل فى الزواج ولا تكوين بيت ولا وظيفة او عمل<br />هؤلاء فى كل شوارع وحوارى مصر<br />واى شرارة ستطلق النار فى اوساط هؤلاء وسيحدث الحرق والضرب والتخريب وفى وقت<br />الحكومة الغبية تظن ان المشكلة طوابير الخبز وبمجرد انتهائها العملية هتبقى سهلة والدنيا ربيع<br />لا يا سادة هناك الان جيل على الخريطة الاجتماعية عاطل وجائع ومنفجر ولا شيئا عندة ليخسرة<br />انها الحرب الشعبية<br />حزب الجائعين والعاطلين والمهمشين وهم الان الغالبية لشباب مصر<br />فلتنتظروا الايام السوداء القادمة"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073442/http://masr.20at.com:80/newArticle.php?sid=15146"

[[comments]]
order = 3
subject = "الحبيب العادلى هو سبب مظاهرات المحلة وسبب الخراب فيها"
author = "السيد السعيد المحلاوى بطاقة قومية رقم 234598765"
text = "العمال فى المحلة وانا منهم كنا نريد اعتصاما سلميا داخل المصنع زى كل مرة<br />داخل اسوار المصنع تستطيع ان تسيطر على الناس وتتحكم فى تصرفاتهم او زى ما بيقولوا بالانجليزى بتاع مرسى under control<br />الاخ الحبيب طيب اللة ثراة ارسل مباحث امن الدولة واحتلوا المصنع وطردوا العمال فى الشوارع ومنع العمال من الدخول<br />وانتقلت المظاهرات الى الشورع والحوارى<br />هنا لك لا تستطيع اى قوات ايا كان عددها رغم الامدادات من طنطا والمنصورة ان تتحكم فى شىء رغم وصول عددها الى 60 الف جندى وضابط واستخدموا الزخيرة الحية للارهاب والتخويف واستخدموا الطلقات المطاطية وقنابل الدخان تمام زى اسرائيل فى الضفة والقطاع مع الفلسطنيين<br />يعنى لو الحبيب ترك العمال يعتصمون داخل المصنع ما كنش حصل حاجة<br />ولكنة غباء النظام الذى يعتمد على القوة لارهاب الشعب<br />ولكن سقط حاجز الخوف<br />ومطلوب من مبارك ان يقيل العادلى فورا والا"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073442/http://masr.20at.com:80/newArticle.php?sid=15146"

