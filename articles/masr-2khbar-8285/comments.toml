[[comments]]
order = 0
subject = "لا مكان للاخوان فى انتخاب المحليات"
author = "مراقب"
posted = "2008-02-22"
text = "سيادة جناب المرشد - روح العب بعيد<br />ولا واحد من الاخوان هينجح فى المحليات - ومستعد احلق شعرى اللى فوق واللى تحت ومن على شنبى ومن على دقنى اذا نجح اخوانى واحد<br />لية يا فصيح<br />اقول لك<br />اى مرشح قادم لرياسة العزبة واللى هيقعد على كرسى التكية وعلى حسب ما تم تعديلة فى دستور خالتى سنية<br />اى مرشح لازم يحصل على عدد معين من اصوات المحليات علشان يقبل ترشيحة<br />وعلشان كدة لازم بتوع المحليات يبقوا من الحزب الوطنى علشان يرشحوا جمال<br />يبقى الاخوان لازم ياخدوا سكة - يغوروا فى ستين داهية - ازاى - شوية اعتقالات<br />وشوية تزوير - وشوية بلطجة<br />وعلشان الصورة تبان ان الواد نجح بالانتخاب<br />فيا سيادة المرشد<br />العب بعيد المرة دى"
archived = "2010-03-14"
