subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-02-22"
text = "أولا أحب اوجه كلمة بسيطة للأستاذ اللى كتب قبلى معنى انى باأكتب بحرية انى أحترم غيرى فى طريقة تعبيرى أيضا أما عن دخول الاخوان الانتخابات المحلية فهذا من باب اعذرا النفس امام الله تبارك وتعالى (( وقالوا معذرة الى ربكم )) وده علشان لما نقف امام الله تبارك وتعالى وديما خلى أملك فى ربنا كبييييييييييير"
archived = "2010-03-14"
