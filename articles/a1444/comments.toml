[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-07-19"
text = "آسف أود التعليق على النقطة : ( وتوزيع الحوار على كل شخص منهم، وترتيب الأحداث بشكل منطقي، بحيث لا يصلح مثلا أن يظهر مشهد عزاء قبل أن يموت الشخص الذي يتم العزاء فيه. )<br />ينقسم السيناريو عن هذه النقطة إلى قسمين :<br />سيناريو تسلسلي وسيناريو غير تسلسلي<br />السيناريو التسلسلي هو كما ذكرت حيث يكون ترتيب الأحداث مرتبا منطقيا مثل سرد حياة شخصية من الولادة وحتى الممات ..<br />والسيناريو الغير تسلسلي وهو قد شااع ونمى في الحقبة الأخيرة وهو وضع المشاهد بطريقة غير مرتبة كالبدء من النهاية أو غير مرتبة بطريقة عشوائية ومن أهم الأفلام ذات السيناريو الغير تسلسلي Pulp Fiction - Reservoir Dogs - memento<br />والسيناريو الغير تسلسلي أو المميز مقارنه بالسيناريوهات التقليدية أصبح محبوب جدا من قبل الجماهير والنقاد .."
archived = "2010-03-14"
