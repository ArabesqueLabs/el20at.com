text = "مش عارفه احنا ليه بنحب نستعمل كلام و مصطلحات كبيره اكتر من اللازم دعاه جدد و متدينين جدد و بعدين باى منطق اننا نحمل عمرو خالد او اى شخص لوحده مسؤولية اتجاه كامل و بعدين بدل ما نقعد ننتقد و نتصيد اخطاء يا ريت كل واحد يحاول يبقى فعلا مؤثر زى عمرو خالد او غيره او حتى ننتقد و نواجه مسح المخ اللى جاى لنا من كل حته سواء اعلامنا العربى العظيم !!!!!! او اللى بيسموا نفسهم فنانين و قال عندهم رساله اما اللى بيقولوا عن عمرو خالد انه نرجسى فمع احترامى ليهم دى غيره"
