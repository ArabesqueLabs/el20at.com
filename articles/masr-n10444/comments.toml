text = "مقال مهم وينقل الحوار الى افاق ارحب ومن ثم ضروروة ان يهتم باحثو بفكرة الدبلوماسية الدعوية وبالفعل انا ارها طرحا مهما وهل ننسى خطابات الرسول او رحلات الدعاة وهجرات الاخوان واخيرا فكرة تصحيح الصورة مقال جميل واضاف والحوار مستمر"
