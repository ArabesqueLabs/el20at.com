subject = "أخطأ بن تمام عندما أشهر الحسام"
author = "اني صلاح الدين"
posted = "2007-05-30"
text = "اسمح لي كاتبي العزيز بتفنيدوالرد علي كاتبنا الهمام حسام حتي نخرج من دائرة اللاعمل<br />أخطأ بن تمام عندما أشهر الحسام<br />زميلي العزيز حسام تمام في البداية دعنا نتفق علي أن الأمة في وضعها الحالي فى أمس الحاجة للمصلحين مهما اختلف لونهم السياسي كما أنها في حاجة ماسه للتحلي بأدب الخلاف بين أبنائها خاصة من أصحاب الفكر والقلم كما دعنا نتفق علي أن أولويات المرحلة محاربة الفساد والمفسدين فهم أولي بالحرب وإشهار السيوف في وجوهم الكالحة لكني يازميلي العزيز عجبت كل العجب عندما وجدتك تشهر سيفك بهذه الصورة التي لم نتعودها منك علي داعية شاب بكل المقاييس نجح في دعوته ونشر الفكرة الإسلامية بين طبقة كان من الصعب علي الدعاة العاديين اختراقها زميلي العزيز ليس من الحكم في شيء افتعال معارك مع إصلاحيي فى حين أننا نترك المفسدين يهربون بفريستهم من دماء فقراء هذا الشعب المطحون الغارق في الظلم والاستبداد من حكامه .<br />أنا أعلم جيدا انك ليس من النوعية التي تسعي للشهرة علي حساب الأخريين لكن اندهشت انك دخلت هذه المعركة وجعلتها لك قضية حياة أو موت وكأنك لم تجد أحد تشهر حسامك سوي عمرو خالد الذي نعلم أنة مجرد داعي مجتهد يحاول يؤسس لمنظومة قيمية في نوعية من الشباب الغارقين الرفاهية .<br />كما أنك استخدمت في مقالك الأول عبارات وكلمات من العيار الثقيل علي الرجل وكأنك بينك والرجل (تار بايت ) ماتعودت منك تسليط قلمك بهذه الصورة علي أى إنسان .<br />أحباب عمرو خالد لم ينزلوه منزلة المقدس لكن استشعروا أنك ظلمت الرجل مع العلم بأنني رغم متابعتي وتأثري بهذا الداعية الاأنني أتحفظ علي بعض مواقفه الدعوية بل كنت من أشد الرافضين للرحلتة للدنمارك لكن الكل يؤخذ منه ويرد علية إلا الحبيب صلي الله عليه وسلم .<br />ا/حسام لقد جانبك الصواب عندما أشعلت هذه المعركة بينك وبين الرجل الذي لم يرد عليك حتى ولا بكلمه متحصنا بحسن الخلق وآداب الاختلاف فعليك أن تكون رجاع للحق فظروف المرحلة تحتم علي المخلصين الوقوف بقوة للنهوض بالأمة لا ندخل في معارك جانبية لايبني عليها عمل"
