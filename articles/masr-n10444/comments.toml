subject = "من جريدة المصريون"
author = "اكتب اسمك هنا"
posted = "2007-05-30"
text = "حسام تمام : بتاريخ 29 - 5 - 2007<br />\" من الممكن أن نسمع أخطأ عمر بن الخطاب وفي هذا الزمن من المستحيل أن يخطأ عمرو بن خالد!\"<br />كان هذا أكثر التعليقات التي جذبتني وأثرت فيّ من سيل التعليقات المتدفق ردا علي مقالتي: عمرو خالد ..في مديح \"مكرمة\" التايم و\"متعة\" الجلوس مع كيسنجر!<br />لقد احتار أمري مع إخواننا الإسلاميين؛ يقبلون- بل ويرحبون- أن يخطأ عمر بن الخطاب ولا يتخيلون أن يخطأ عمرو خالد! حتى ولو حاكمناه إلي كلامه الذي قاله ولم ينفه أو يكذبه.<br />يروون بجذل وإعجاب واقعة الصحابي الذي قال لعمر لو وجدنا فيك اعوجاجا لقومناك بسيوفنا..ويثنون علي عمر ترحيبه وقوله: الحمد لله أن جعل في رعيتي من يقومني بسيفه..ثم هم يثورون حين يتعرض باحث أو صحفي مثل العبد الفقير لداعية شاب مثل الأستاذ عمرو خالد لو أنفق مثل جبل أحد ما بلغ معشار بن الخطاب ..رغم أنني لم ولن أرفع عليه سيفا قط!<br />أسوأ شيء أن تكتب عن الإسلاميين أفرادا وجماعات وأنت مستقل أو لديك نية أن تكون مستقلا، وتجربتي في الكتابة في شئون الحركات الإسلامية أورثتني ألما لا أجد ما يذهبه أو يخفف منه إلا رجاء أن يعيذني الله من عمل قصدت به وجهه فخالفني فيه إلي غيره..وأن يشملني قوله \" يخشونه ولا يخشون أحدا إلا الله\".<br />في كل مرة أكتب فيها عن كل من سمي نفسه أو سماه الناس \" إسلاميا \" تصبّ علي اللعنات صبا وأتعرض لحالة من الابتزاز أقلها سوءا الشتم والتشكيك في النوايا والاتهام في الدين والخلق مما أستغربه من قوم أعلنوا أنفسهم ممثلين حصريين للإسلام والإسلامية!..أما أقسي ألوان هذا \" الابتزاز\" علي القلب فهي رسائل من أناس مهذبين غاية في الرقة والخلق تظن بي الخير ولكنها تستحلفني بالله أن أكفي قلمي الخوض في أهل الدعوة!<br />لم أعد القي بالا بسيل السباب والشتائم التي تفتقد للياقة والأدب أو التي يرميني صاحبها بدائه ثم ينسل..ولكن ما يؤثر في مشاعري تلك الرسائل التي تحمل رجاء حارا من أناس أشعر في قلوبهم الصدق والغيرة علي الدعوة وعلي كل ما ومن يتصل بها بسبب...كثيرا ما ترددت بسببها عن الكتابة في هذا الملف بل وربما اعتكفت رجاء دعوة صالحة أو خوف فتنة أتسبب بها لأقوام قلوبهم أصفي من اللبن..غير أنني أعود لأنتفض إما لهول الكارثة أو تمردا علي مبدأ الابتزاز العاطفي.<br />أقرأ الكم الهائل الذي تعرضت له من نقد أو سباب لو شئنا الدقة لمجرد أنني انتقدت حواره الذي بدا فيه منبهرا بالغرب مستسلما له وأسال جمهور الأخ عمرو خالد ( والغصة في حلقي من أن يصير للدعاة جمهور كجمهور السينما ): هل من المروءة أن يقرأ غيور علي دين الله ما يقوله الأستاذ عمرو خالد من أن رحلته للدنمارك نجحت بدليل احتفاء مجلة التايم الأمريكية بها ثم لا يتنفض محذرا ومنبها؟ ..وهل من العقل أن يسكت المسلم علي استخفاف الأخ عمرو بالناس حين يقول أنه ومن غير مبالغة وفي ثلاث دقائق فقط ( غيّر أمريكا ) أو أن هنري كيسنجر فهم الإسلام علي حقيقته من مائتي كلمة تحدث بها عمرو في حفل التايم؟.. وهل من عزة المسلم أن يفرح وهو يري داعية يذهب ليبلغ رسالة الله ثم يرجع جذلا من أنه جلس علي مائدة واحدة سكرتير الأمن القومي الأمريكي السابق؟....إلي آخر ما ارتكبه عمرو خالد في حواره الذي أراه أكثر ما كشف عن رؤيته ومشروعه.<br />ثم ماذا يريد الإسلاميون وخاصة أتباع الأخ عمرو خالد منا معشر الصحفيين والباحثين؟ هل تراهم يريدوننا جزءا من الديكور البشري الذي يستعين به في دروسه الدعوية سابقة التجهيز؟ أم لابد لنا أن نصطف معه صفا واحد لأداء مناسك الحج التفاعلي الذي امتلك الأخ عمرو براءة ابتكاره حصريا مع قناة اقرأ لصاحبها الملياردير السعودي صالح كامل والسيدة حرمه الفنانة صفاء أبو السعود؟ ..شخصيا لا أتمتع بنفس مستوي الوسامة أو بالطلعة البهية التي يمتاز بها جمهور دروسه الدعوية سابقة التجهيز..وربما لا تسمح مهنتي كصحفي يقتات من سن قلمه لكي أشترك في الحج التفاعلي حيث يدفع فيه الموسرون آلاف الدولارات ليحجزوا أقرب موقع للتغطية الحية لوقائعه!<br />ثم من قال إن عمرو خالد أو غيره من الدعاة أو القادة الإسلاميين أوصياء علي أقلامنا وعقولنا أو رقباء علي ضمائرنا يحددون لنا ما ومتى وكيف نكتب عنهم؟ ثم لماذا يطلبون منا أن نلوذ بالصمت فلا نعلق علي الكوارث التي يرتكبونها سدا للذرائع ولا يلتزمون هم بالحق الذي طالب به عمر بن الخطاب الأمة منذ فجر الدعوة: لا خير فيكم إن لم تقولوها ولا خير فينا إن لم نسمعها؟ ولماذا لا يعتبرون نقدنا لهم هدايا تستوجب طلب لنا من الله الرحمة أن بيّنا لهم بها عيوبهم..وهي تجاوزت في بعض الأحيان العيوب إلي المصائب! هل يعقل أن يقول الإمام الجليل مالك بن أنس: إن من شيوخي من استسقي بهم الغمام ولا آخذ عنهم الحديث! ثم يطلب منّا أن نسمع ولا نعقب علي أحاديث عمرو خالد وغيره . وهل يتكلم بعض رواة الحديث عن شيخه فيقول: يوهم في الحديث أو يدلس ..أو كان – رحمه الله- مغفلا! ولا يمكن أن نراجع الأخ عمرو في نقله وكلامه؟ ..سبحان الله..هل تتقدم الأمة خطوة أم تتأخر أميالا؟!<br />ثم أين صدي \" الدعوة للتعايش \" التي أطلقها عمرو خالد وهو يربي لنا جيلا يكاد يفتك بكل من تسوّل له نفسه مجرد الاقتراب من نجمه الأوحد!..وهل هذه \" صناعة الحياة \" التي يدعو إليها الأخ عمرو أم أنها دعوة للتعصب للرأي والضيق بالاختلاف والتناصح؟ ثم أتساءل: هل من حق عمرو خالد أن يحلل ويفكك حياة الرسول وأهل بيته وصحابته؛ فيقيّم ويقوّم، ويصوّب ويخطّأ، وينتقي ويستبعد، ويعدّل ويجرّح حتى يخرج علينا قائلا وبجرأة عن دعوته إنها دعوة محمد !( كما ورد بحديثه مع هنري كيسنجر ).ثم يرفض أن يتعرض الناس لصنيعه بشئ من تحليل أو دراسة أو حتى نقد ..ثم هو يبتزنا دينيا وأخلاقيا ويهددنا باستمطار دعاء السيدة والدته علي كل من ينتقده ( كما جاء في حواره مع صحيفة الدستور)!<br />الغريب أن هذا الجمهور الذي يملأ الشبكة عويلا وصراخا ويطيح بالاتهامات يمينا ويسارا كلما تجرأ كاتب علي نقد نجمه لم نسمع له حسا حين تجرأت أقلام السوء علي زوجات رسول الله الأطهار وصحبه الأخيار..فهل الانتصار لعمرو خالد أهم من الانتصار لعائشة أو لأبي هريرة ..أم أن كلام أراذل الكتاب في حق الصحابة وآل بيت الرسول مغفور لهم وكلامي-أنا العبد الفقير- في حق عمرو خالد لا يرجي له غفران؟<br />المفزع في كل مرة اقترب فيها من الجناب السامي لعمرو خالد وغيره من نجوم الدعوة والحركة الإسلامية ..أنني أجد نفسي بإزاء جماهير لا ترحم؛ تشحذ سيوفها للذبح حتى قبل أن تقرأ ودون أن تنطق بالبسملة..فتستبيح الأعراض وتشكك في الذمم وتتهم الضمائر وقلبها مطمئن بالإيمان كأن الأخ عمرو وجماعته مسلمون ونحن عياذا بالله من أتباع أبي لهب!<br />يتهمني بعضهم أنني علماني معاد للدعوة أو أنني كاتب للسلطة أتزلف بها أو متكسب أتربح مما أكتبه في نقد أعلام الدعوة والحركة الإسلامية المباركة..فأراجع نفسي الأمارة بالسوء واسترجع تاريخي المتواضع في الكتابة لعلني أجدني ولو بطريق الخطأ نزلت ضيفا علي نفقة رجل أعمال فاسد أتمتع بمصايفه ومشاتيه؛ أو استضفت في برنامجي مسئولا هاربا من القضاء لأغسل عنه عار الفساد ونهب ثروات المؤسسة التي امتص دماء أهلها؛ أو أفتيت لمحتكر جشع فتوي تعطيه حق اكتناز ثرواته من أموال البسطاء وحرمانهم من أبسط وسائل الترفيه في زمن عشش البؤس علي قلوبهم والنفوس، أو أنني- معاذ الله-حوّلت الدعوة إلي الله إلي بيزنس ألاحق في المحاكم كل من يقترب منه بدعوي حقوق الملكية الفكرية..ولما لا أجدني فعلت شيئا من هذا أستغفر الله من الزلل وأقول : ولو! ثم أردد قول أم المؤمنين عائشة رضي الله عنها: بذنبي وما يغفر الله أعظم!..<br />أعتقد أن مفهوم كاتب السلطة صار بحاجة إلي مراجعة وتعديل في ضوء ما نعيشه الآن من سعار وحملات إرهاب علي كل من يجرئ علي الكلام ..فكاتب السلطة لم يعد- فحسب - ذلك المنافق التافه المتذلل للمسئول والمستجدي لعطاياه المستعد للدفاع عنه بالحق والباطل، بل هو- أيضا- ذلك التافه النصاب المرتزق أيضا ولكن من الجماهير..فهو يستطيع أن ينتقد أصنامها التي تعكف عليها ولا يجرؤ علي الاقتراب منها، وهو الذي يسكت عن الحق خشية أن يتهم في دينه أو تشوه صورته لدي محبيه ومريديه حتى ولو كان بالباطل، وهو الذي يكتب للناس ما يريحهم ويعدهم ويمنيهم وهو ما يعدهم إلا غرورا وكذبا وادعاءا..وهو لا يستحي من الله أن يلقنهم الخرافات والأساطير التي لا تصمد أمام النقد والتحقيق...كاتب السلطة هو الذي يرضي أن يكون منهجه مع الناس هو منهج النجم مع الجماهير يتعامل معها بمنطق: الجمهور عايز كده!..ويري أن الأفضل أن يسوقهم هو إلي ما يظنه الحق بدلا من أن يسوقهم مطرب أو راقصة..<br />يا أخوتي: لقد مضي زمن النضال..ولم يعد هناك كاتب تعتقله السلطة أو تضيق عليه، بل صار هناك كاتب يبتزه المتلاعبون بالعقول وهواة الكهنوت وأنصاف الآلهة الذين يرحبون بأن يخطأ عمر بن الخطاب ..ثم ينزهون أنفسهم عما رضوا به لعمر..رضي الله عن عمر بن الخطاب وسلفه أبي بكر الصديق وهو القائل: رحم الله إمرءا أنصف من نفسه وأعطي كل عامل ما يستحقه وأقام الشهادة لله<br />كاتب مصري"
