author = "سوسن المومني واسلام القيسي"
posted = "2008-05-20"
text = "الى كل العاملين في قناة طيور الجنة الأعزاء تحية طيبة ،<br />هناك قاعدة معروفة لدى الجميع (مشوار الألف ميل يبدأ بخطوة) وهاأنتم بدأتم بشيئ رائع وكبير رغم كل الصعوبات والتحديات التي واجهتموها في بداية هذا الطريق فأنه انجاز رائع للغاية بأن نربي ابناءنا على القيم والأخلاق الحميدة منذ نعومة أظفارهم بأسلوب راقي ومميز"
archived = "2009-11-09"
capture_url = "https://web.archive.org/web/20091109184333/http://www.20at.com:80/20at/lifestyle/8615.html"

[[comments]]
order = 14
subject = "الاردن-عمان-جبل النصر"
author = "فاديا زيادة"
posted = "2008-05-21"
text = "بكل صدق...لقد كانت قناة طيور الجنة مشروع مفتقد ...والان هي صرعة باذن المولى لن يأتي يوم تنتهي فيه هذه الصرعة..<br />كما أن القناة هادفة بطريقة ذكية جدا...فنحن الكبار يمضي الوقت بنا دونما ملل ومن غير أن نشعر به...فما بالكم بصغار؟؟؟؟<br />وأخيرا أشكر جميع العاملين بالقناة وأتمنى لهم دوام التقدم...كما اسمحوا لي أن أوجه أنقى وأرقى باقات الورد والياسمين الى حبيبتي وصديقتي وزهرة حياتي...الى أجمل ما أنبتت الأرض...تسنيم مخيمر..."
archived = "2009-11-09"
capture_url = "https://web.archive.org/web/20091109184333/http://www.20at.com:80/20at/lifestyle/8615.html"

[[comments]]
order = 15
subject = "رفعتوا راسنا والله"
author = "رانيا البشيري من قطر"
posted = "2008-05-28"
text = "يا سلام عليكم..والله قناة واااااااايد حلوة...لفت نظري تميز فريق العمل كله شباب بالعشرين عمر نبيل ومجاهد هشام وسعد وربيع واللي فاجأني اكثر تسنيم مخيمر<br />فعلا بنت رائعة قدرت تتجاوز كل صعوبات العمل والدراسة وكونها صبية صغيرة بالعمر ...نصيحتها بمحلها يا ريت نقدر نشوفها عالقناة..<br />كنترول كيف بقدر اتواصل معها؟؟"
archived = "2009-11-09"
capture_url = "https://web.archive.org/web/20091109184333/http://www.20at.com:80/20at/lifestyle/8615.html"

