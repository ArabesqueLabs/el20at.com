author = "الملاك البريء"
posted = "2008-05-20"
text = "ملاكي الصغير تسنيم اشكرك جزيل الشكر على ما أبدعته وأحرزته من تطورات في كل ما يهواك.واصلي العمل والكفاح لتحقيق مرادك في خلق جيل المستقبل الذي سيحررنا من كل القيود.آمل من الله عزوجل ان يوفقك لكل الخير.انتبهي صغيرتي للدراسه فهي بوابة الدخول للمستقبل.أتمنى لك التوفيق وللقناه كل النجاح وتوصيل الفكره الهادفه للأطفال."
