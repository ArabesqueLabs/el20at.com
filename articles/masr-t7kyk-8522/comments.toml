order = 0
subject = "الجيش هيعمل اية - والخزينة خربانة ومسروقة"
author = "متشائم"
posted = "2008-03-17"
text = "قارئة الفنجان<br />ماذا تفعل يا ولدى اذا كان طريقك مسدود ومسدود ؟<br />زمان كنا بنسلك حالنا ببيع بنك او مصنع او مؤسسة ونشترى بثمنها قمح وندفع مرتبات الامن المركزى ومباحث امن الدولة<br />ولما تزنق نبيع ارض الدولة باسم مثتثمر رئيسى لشركة خليجية او يهودية - المهم يدفعوا كاش ونمشى المسائل كام شهر<br />الدولة تدار باسلوب ولد عبيط مبيشتغلش وبيفرتك فى ميراث ابوة لغاية ما بقى على الحديدة<br />عملنا رخصة المحمول الثالثة بكام مليار وصرفناها فى الهلس السنة اللى فاتت<br />مفيش فاضل حاجة تنباع<br />لا الجيش ولا الشرطة هيقدر يحل مشكلة من غير فلوس وميزانية<br />والجهابزة هيعتمدوا على جباية الضرائب من ناس معدمين<br />ضرايب اية ومن مين ومين اللى هيدفع<br />راحت البلد يا اولاد<br />البلد انسرقت<br />وجاعت وهتجوع"
archived = "2010-03-14"
