subject = "ياناس ياهوة فية خلل كبير فى الحكومة الفاسدة وصراع"
author = "فينو"
posted = "2008-03-18"
text = "علشان الباشوات والبهوات والكروسان والعيش الفرنساوى علشان الغلابة من الوزراء ونواب الوطنى ومحاسيبة من عمد وشيوخ بلد ونواصى لضمان تقفيل وتسويد صناديق الانتخابات علشان الغلبان احمدعز بدل ماياكل سيخ حديدمن الجوع ولا مغربى بتاع الاسكان مش فاضى للوزارة فاضى للتصدير وابرام العقود لحسابة واستغلال كل امكانيات الدولة من قروض ومنح واراضى بتتزرع وبتتصدر انا دخلت مزرعة للوزير مغربى على طريق اسكندرية افتكرت نفسى فى مستشفى اجنبى يعنى بلدنا مش حيتعدل حالها مدام النماذج دى من الوزرا وبعض النواب موجودة ومفروضة بالعافية علينا وطبيعى حيكون عندنا ازمة رغيف وازمة كهرباء وازمة مية لان التخطيط السليم والواقعى بعيدكل البعد عن بعض وزراء الحكومة انما فى شغلهم الخاص الوضع مختلف حيث النجاح تلو النجاح والارقام القياسية فى الارباح والسبب ان وزراء البزنس نمت ثرواتهم بمعدل عشرة اضعاف على الاقل من دخلوا الوزارة نتيجة استغلال كل الفرص المتاحة وغير المتاحة لشفط اكبر قدر ممكن من رغيف الشعب الغلبان اللى قاعد يتفرج وحيموت من الجوع والمرض والعوز والباشوات مش عاوزين شوشرة وازعاج عاوزين يئمنوا حشيش بدل العيش علشان الناس تنسى نفسها وتبقى مسطولة لغاية مايخلصوا على اخر رغيف فى الفرن او اخر جنية فى البنك المركزى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الرئيس كان فى اجازة مفتوحة فى منتجع الشرم الشيخ لم"
author = "مش لاعب"
posted = "2008-03-18"
text = "الناس قاعدة فى منتجع شرم الشيخ فى اجازة مفتوحة ياكلوا سمك ومشويات وسايبين مقر عملهم اللى بيديروا منة مصالح الناس اللى هو القصر الجمهورى - لغاية ما حال البلد وقف<br />بلد بدون رئيس لمدة 20 سنة<br />عايزين اية<br />لازم تجوع ويبقى فية فساد وبطالة وافترى وناس مش لاقية تاكل عيش واقلية عندها طيارات خاصة ويخوت<br />شوف واحد زى فاروق حسنى لما دخل الوزاغرة كان عندة اية ودلوقتى عندة اية<br />وغيرة وغيرة<br />كلهم فى النار من اكبر راس الى اصغر واحد فى الحزب الوطنى<br />كلهم اشتركوا فى تدمير مصر<br />لا احد يمكنة انقاذ اى شىء<br />فات وقت الانقاذ<br />اصبحنا شعبا من الاجئين المعتقلين داخل معسكر النظام الفاسد الايل للسقوط"
archived = "2010-03-14"
capture_url = ""

