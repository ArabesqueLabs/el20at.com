subject = "الى وائل عباس وعموم المدونين"
author = "مش لازم"
text = "نشكركم شكرا جزيلا على ما فعلتموه في فضح ضباط الداخلية من خلال نشر افلام التعذيب ونخص بالذكر الضابط اسلام نبيه الذي تم الحكم عليه بثلاث سنوات سجن<br />المهم الان الجمهور عايز يشوف صورهم جوا السجن<br />يا ترى هما دخلوا السجن فعلا ولو دخلوا السجن هل يعاملون معاملة المساجين<br />هذا ما نريد ان نراه في مدوناتكم وخصوصا الضابط اسلام نبيه<br />ولكم جزيل الشكر"
archived = "2007-12-17"
capture_url = "https://web.archive.org/web/20071217233938/http://masr.20at.com:80/newArticle.php?sid=13422"
