subject = "نفسي اشوف الكعبة"
author = "etho"
text = "رغم ان عمرى صغير لسة ما جبتش ال21 سنة الا انى نفسي احج اوى اوى ومش عارفة ازاي ممكن يكون في مسلم صغير او كبير مش نفسه يشوف الكعبة الى مكانها تحت عرش الرحمن بالظبط مش عارفة ازاي الموضوع دة مبين ان في شباب كتير مش بيفكروا في الحج ومأجلينه لسن ال50 كأن حد ضامن عمره ربنا يزقنا كلنا بالحج يا رب ويتجاوز عن سيئاتنا"
