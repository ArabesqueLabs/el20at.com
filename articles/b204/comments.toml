order = 7
subject = "يارب أحج"
author = "مسلمه بردوا"
text = "مفيش شك ان كل مسلم يتمنى انه يزور النبى ويتغفر له ذنوبه علشان يتحمس يعمل اعمال صالحه منغير مايحط فى باله ذنوبه اللى بتيأسه<br />ورغم انى مش عندى عمل ولا بمتلك مال للقيام بالحج بس لما بشوف منظر حجاج بيت الله اتمنى لو اكون هناك معهم<br />وعلشان كده امر الحج مش بيتعدى عندى حاليا اكثر من دعاء الله تعالى انه ينولهالى قبل ماقابله ان شاء الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "اللهم إرزقنا جميعاً بحجه قريبه"
author = "مُعلمة شباب المستقبل"
text = "ليه نفكر إننا منحجش غير فى الخمسين والستين من عمرنا .. وإيه اللى يضمنلنا إننا هنعيش للخمسين أصلا<br />غير كده الحج ليه مشقته وتعبه وانا افضل انى احج وانا لسه عندى صحه بدل ما استنى لحد ما حد من ولادى يحججنى وانا ماشيه على كرسى متحرك ...<br />أنا 19 سنه وبفكر طبعا فى الحج بس عايزه أحج لما أتزوج إن شاء الله عشان أكون أديت ركن وعباده عظيمه كده مع زوجى<br />عشان ربنا يباركلنا فى حياتنا ..."
archived = "2010-03-14"
capture_url = ""

