text = "ورقة التوت في عيد الميلاد<br />في مصرنا رجل و أي رجل<br />من فرنسا أتانا و معه العاشقة...<br />هي للأزياءِ في بلادها عارضة<br />هو حبيب إسرائيل<br />يحبها كما تحبه العارضة...<br />أراد توازناً لعلاقة مع العرب عادلة<br />فمنح مصراً شرف ليالٍ حمراء يقضيها على شواطئ النيل برفقة العارضة...<br />سألت نفسي ، هل مازالت مصر حقاً أرض الكنانة<br />أم أنها أصبحت أرضاً للمهانة<br />كأني و النيل ، يشهد الفحش في عيد الميلاد و يرثي الكرامة...<br />في مصرنا رئيس عاشق ، و عارضة للأزياء عاشقة<br />و الناس فيها بين نادب للحال .. و نادبة<br />و عيد الميلاد أضحى جريحاً<br />إذ رحبت مصر بشهوة العاشق الجامحة...<br />فداك مصرُ ، هبَة الكبرياء لشعب ينتظر الفرصة السانحة ..."
