subject = "تفاصيل مثيرة لمحاولة اغتصاب مذيعة فضائية المحور ريهام سعيد داخل فيلا في مارينا"
author = "منقول"
text = "تفاصيل مثيرة لمحاولة اغتصاب مذيعة فضائية المحور ريهام سعيد داخل فيلا في مارينا<br />سيناريو مرعب عاشته المذيعة.. والممثلة ريهام سعيد في أجمل مكان في الساحل الشمالي.. استيقظت فجرا في فيلتها بمارينا لتجد اسفل فراشها شخص غريب. التحفز واضح علي ملامحه .. ويشرع في الفتك بها.. قاومت ريهام بعنف.. وهرب المتهم قبل ان ينجح في مهمته في اغتصابها أو سرقتها.. او قتلها فلا أحد يعلم هدفه الحقيقي.. وأثناء هروبه اكتشفت المذيعة انه يرتدي ملابس أمن القرية السياحية!<br />تتوالي المشاهد المثيرة في القضية التي لم تستمر أكثر من ساعات.. ولكنها كانت حديث أهالي القرية من أصحاب الصفوة!<br />\\\\\\'جرس الموبايل أنقذ حياتي\\\\\\'..<br />بهذه العبارة بدأت ريهام سعيد المذيعة بقناة المحور والممثلة حديثها لرجال المباحث.. كان يقف أمامها طابور مكون من 20 شخصا يرتدون ملابس أمن مارينا!<br />بدأت المذيعة تتفرس وجوههم وهي دامعة العين.. لاتنسي تفاصيل المشهد المؤلم الذي عاشته منذ ساعات في فيلتها بمارينا.. توقفت ريهام امام شاب في بداية العقد الثاني من عمره بدا علي ملامحه التوتر حينما انقضت ريهام عليه تحاول ضربه!<br />طلب منها العقيد هشام خطاب رئيس فرع البحث بالحمام أن تهدأ .. وظلت ريهام تصرخ.<br />هوه ده المجرم.. شوفوه كان عايز ايه.<br />وبهدوء أصطحب المقدم أحمد عمارة رئيس مباحث مارينا المتهم إلي غرفة مجاورة لمناقشته.. وبدأت ريهام تتمالك أعصابها.. ودارت عقارب الساعة ولكن إلي الوراء.. وبالتحديد إلي الرابعة فجرا!<br />كانت ريهام تستعد للسفر للقاهرة في اليوم التالي لاستكمال تصوير فيلم درامي.. طلبت من أقاربها أن يوقظوها في الرابعة فجرا للاستعداد للسفر.. وبالفعل في الموعد المحدد بالضبط دق جرس هاتفها المحمول!<br />بصعوبة تمكنت ريهام من فتح عينها.. ولكن فجأة.. ألتقطت أذناها حركة مفاجئة اسفل فراشها.. انتفضت من فراشها.. وفي نفس التوقيت ظهر شخص غريب.. حاولت ريهام أن تصرخ ولكنه كتم فمها.. كان يستعد لضربها بجهاز اللاسلكي الذي يحمله ولكنها قاومته بعنف.. في هذه اللحظات استمدت قوة خارقة.. كانت تدرك انها خط الدفاع الاول والاخير عن طفليها يوسف.. و اللذين يرقدان في الغرفة المجاورة إليها!<br />انتهي المشهد الذي لم يستغرق سوي دقائق.. وهرب المتهم.. ولكن ريهام تمكنت من تحديد شخصيته!<br />خطة بحث!<br />استجمعت شتات نفسها.. ارتدت<br />ملابسها بسرعة .. اسرعت إلي مدير أمن القرية.. قصت عليه ماحدث.. وأكدت له انها تشتبه في شخصين فرد الأمن!<br />طار البلاغ إلي اللواء علي متولي مدير أمن مطروح.. وقاد اللواء علاء المناوي فريق بحث للوصول إلي المتهم. حددت ريهام شخصية الجاني.. ولكن رجال المباحث فضلوا ان يعرضوا عليها جميع العاملين في أمن مارينا لقتل اي شكوك في شخصية المتهم!بسهولة تمكنت من الوصول للمتهم.. قصة شعره.. والدبلة الفضية في يده المميزة بحجمها الكبير.. وطوله.. كل هذه العلامات ميزت المتهم عن الباقين.. وبكل هدوء أنكر الأتهام.. ولكن ريهام سعيد أكدت إنها لاتشك لحظة واحدة في شخصيته.. وبتضييق الخناق عليه أكد أنه شاهد نافذه الفيلا مفتوحة فأراد أن يتفقدها .. ولكن أكاذيبه لم تنطل علي رجال المباحث.. فعاد ليغير اقواله مؤكدا وجود صداقة بينه وبين الخادمة الفيلبينية التي تعمل عند المذيعة!<br />لكن المذيعة تدخلت مؤكدة كذب هذا الأدعاء ايضا لان الخادمة ترقد في الطابق الأول.. بينما تجاوز المتهم جميع غرف الطابق الاول للوصول لغرفة نوم ريهام سعيد في آخر الطابق الثاني!<br />تراجع المتهم مرة ثالثة عن أقواله مؤكدا انه أراد مشاهدتها فقط.. ولم يكن ينوي الاعتداء عليها.. او سرقتها.. ولم يقنع كلامه النيابة خاصة ان ريهام سعيد أكدت انه ربما يكون قد قضي وقت أطول في منزلها!<br />وجهت النيابة لفرد الأمن تهمة دخول مسكن بقصد ارتكاب جريمة.. وأخلت سبيله بكفالة!<br />هتك .. عرض!<br />تقول المذيعة والممثلة ريهام سعيد :<br />\\\\\\'كان من الممكن أن أفقد كل شجاعتي حينما استيقظت من نومي لأجد هذا الشخص تحت فراشي.. كان من الممكن ان يصيبني الانهيار.. ولكنني تجرأت.. واجهته بشجاعة.. وانا ادرك نواياه.. فهو لم يتواجد في منزلي للنزهة .. فوجوده فيه هتك لعرض.. لانه وصل لغرفة نومي.. وقد يكون في نيته اغتصابي.. وهو في النهاية حاول قتلي بكتم أنفاسي ومحاولة ضربي باللاسلكي.. ولكنني تذكرت أولادي الذين ينامون في الغرفة المجاورة.. فهذا الشخص لو تمكن مني فقد قتل اولادي!<br />دافعت عن نفسي باستماتة.. وحينما شاهد جرأتي لم يجد أمامه سوي الهرب.!<br />ماذا كان سيحدث لو لم يدق جرس المحمول؟<br />هذه المكالمة أنقذت حياتي.. وهي من إحدي صديقاتي.. كنت قد أتفقت معها علي ان تتصل بي في تمام الرابعة فجرا لايقاظي حتي أتمكن من التواجد في القاهرة في الثامنة صباحا لتصوير مشاهد فيلم القاهرة .20 ودق جرس الهاتف في الوقت المناسب تماما.. وجدت المتهم أمامي!<br />هل تعتقدين انه خطط لأرتكاب جريمة؟<br />لايوجد مشكلة في أن يتابعني .. لأنني اراه في الشارع الذي تقع فيه الفيلا منذ 5 سنوات.. ولكنني لا اعرف اسمه.. لم اتوقع مطلقا ان تأتي الجريمة من الشخص المسئول عن حمايتي!<br />من الواضح أنه يخطط لدخول منزلي منذ فترة.. فهو يعلم انني في هذا اليوم طلبت من الخادمات الفلبينيات ان يذهبن إلي الشقة الاخري التي امتلكها في مارينا.. ووالدتي لم تكن موجودة معي.. ولم يكن هناك سواي.. وطفلاي في الفيلا.. ولهذا اختار هذا اليوم لارتكاب جريمته!<br />تكمل ريهام :<br />\\\\\\'الحمد لله نجوت من حادث لايعلم مداه إلا الله\\\\\\' ولكنني كنت أرغب ان يكون القانون أكثر حزما مع هؤلاء .. فهل ينتظرون سقوط قتيل حتي يتم حبس المتهم؟!<br />المصدر : صحيفة دنيا الوطن"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918104556/http://masr.20at.com:80/newArticle.php?sid=17605"

[[comments]]
order = 1
subject = "مصر"
author = "ابتسام محمد عبد السلام"
text = "أنا مش بحبها بصراحة و مش بحب أسلوب السهوكة بتاعها ، ده غير انها عايزة تعمل لنفسها شهرة بأي طريقة و هي ماعندهاش حرفية خالص ، يعني لما جابت بوسي سمير و لو ان انا مش بطيق بوسي سمير و اللى بتعمله لكن اتضايقت من طريقة كلامها معاها ، المفروض لما تجيب ضيف تحترمه و تحترم الجمهور اللى بيتفرج مش تقعد تقولها : هو انتى فيه حد يرضى يتجوزك ؟؟ و انتى ما بتتجوزيش ليه ؟؟ و طريقة غير مهنية خالص في الحوار و بتتعمد تتحاور مع الراقصات علشان تعمل لنفسها شو زي اللى كانت عاملاه المذيعة اللى كانت في اقرأ اللى اسمها بسمة و هبي و كانت بتجيب الراقصات تهزئهم و تخليهم يعيطوا و بعدين هي نفسها خلعت الحجاب<br />ده غير انها بتقعد تدي حكم و مواعظ زي ما تكون هي منزهة عن النقائص و العيوب و هي مش أهل لكده<br />الحاجة الوحيدة اللى كويسة في برنامجها موضوع الأطفال الى بتحاول تساعدهم و دي حاجة كويسة منها بردو ما ننكرش لكن كمذيعة انا شايفة انها غير جيدة على الإطلاق"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918104556/http://masr.20at.com:80/newArticle.php?sid=17605"

