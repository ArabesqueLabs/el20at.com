text = "اية الحكاية دى حتة مذيعة موظفة مش من اولياء اللة الصالحين -هتعملوا منها شخصية عامة - انا عن نفسى معرفشى اى اسم لاى مذيعة واحدة واقفة بتقدم برنامج وخلاص<br />اية القرف دة"
