subject = "صراع الخير والشر"
author = "ابومحسن غربة 26 سنه"
posted = "2007-10-06"
text = "خلاصة الموضوع ان اصالة مغنية ماجنة متبرجه كانت عندها حفلة عناء في الجزائر في رمضان وتأخرت عن موعد الحفل من اجل صلاة الترايج.<br />وتذكرت هنا مرة لقاء تلفزيوني قديم قبل ان ابدأ سنوات الغربة الستة وعشرين الفنانة سهير ذكي كانت في لقاء تلفزيوني عن الرقص وذكرت انه عائدة من العمرة وحكت في البرنامج ماذا فعلت في العمره وبعد ذلك قدمت للمشاهدين رقصة<br />وغيرهم كثير من الفنانات المطربات والراقصات اللاتي تمتن مهنة الرقص والغناء التي هي ضد التدين اصلا وضد الالتزام الديني بعكس التمثيل فالرقص والغناء مفتن للرجال<br />وهذا يبرز ان في نفس كل انسان منا صراع بين الخير والشر الخير الذي تمثل في حرصها على تأدية الصلاة والشر انها محترفة الغناء<br />كما كان في سهير ذكي الخير في انها ذهبت الى العمره والشر انها تعمل راقصة<br />وهناك فنانين كثيرين كانوا يعملون بالرقص والغناء واعتزلوا من اجل الدين يعني الخير انتصر على الشر<br />وعلة سبيل المثال وليس الحصر الراقصة سحر حمدي وكثير من المغنيات والمطربات<br />المهم ندعو للفنانة اصالة ان ينتصر الخير على الشر وتعتزل الغناء"
