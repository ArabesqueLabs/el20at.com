text = "اتق الله يا سليمان جودة انت و جريدة المصرى اليوم المضللة<br />فالصيادين المصريين الثلاثة والثلاثين قد اعلنوها صريحة مدوية<br />فور عودتهم الى مصر انهم هم الذين حرروا انفسهم بأنفسهم ، وانهم لم يتلقوا اى مساعدة لا من حسنى مبارك ولا من مخابراته ، التى حاولت ان تدعى لنفسها بطولة كاذبة عن طريق وسائل إعلامها الخائبة<br />فالناس صرخوا بكل صراحة ووضوح امام جميع وسائل الإعلام ومنها المصرى اليوم بتاعتك الكاذبة ، بأنهم هم من حرروا انفسهم وليس لأحد فضل عليهم إلا الله سبحانه وتعالى .... فلا داعي للدجل على الشعب يا صحافيو السلطة ."
