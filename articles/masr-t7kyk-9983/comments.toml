subject = "الله محبة"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-06"
text = "ابتسامة على و جهة يتيم؟<br />وووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووو<br />دعوة من قلب محتاج<br />ووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووو<br />عمل خير فى الخفاء<br />سوف تضحك اللههههههههههههههههههههههههههههههههههههههههههههههههه و تسعدنا<br />و طاعة اللة و الصلاه لله فى الخفاء و من القلب<br />كمااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااان؟"
archived = "2010-03-14"
