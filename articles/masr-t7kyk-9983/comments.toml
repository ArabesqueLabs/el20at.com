[[comments]]
order = 3
subject = "الحمد للة و المسحيين كمان بيصلوا خمسة مرات فى اليو"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-09"
text = "اخى الفاضل العزيز<br />تعرف لية نحن نحب ان نصلى فى الخفاء؟<br />(لان اياك الذى فى السموات سوف يجازيك علانية)؟!!!<br />و ايضا لاننا لا نريد المنظرة و التفاخر و التباهى باننا متدينون امام الناس؟<br />المهم ان نكون فعلا متدينون فى القلب و بكل طهارة و ايمان حقيقى و ليس تباهيا و استعلاء و تفاخر و احيانا اظهر عكس ما اضمر؟<br />و هذة و جهة نظر<br />و كل عام و انتم بخير و (رمضان كريم)"
archived = "2010-03-14"
capture_url = ""
