subject = "لا بلاش كده"
author = "مش ضروري (واحد بيعشق كريم عبد"
posted = "2008-08-12"
text = "علي فكره المقاله دي فيها جمله عجيبه وغريبه قوي ..بتقول قال ايه سبب اعتذار منه عن بطوله امام كريم عبد العزيز انها فضلت حلمي لانه (بيتمتع بشعبيه اكتر )كلام مش منطقي ابدا احب اقوللك ان كريم عبد العزيز ميتقارنش ابدا بحلمي لانه احسن منه 6000مره وانا واحد من الناس بقوللك ان لو اتعرض عليا احضر فيلم لحلمي ولا لكريم هروح لكريم وبدون ما افكر وده حالي وحال غيري كتير كمان<br />وكمان مين اللي قاللك ان منه شلبي محتاجه شعبيه او شهره انت بتتكلم ولا كانها سنيده للبطل او نجمه درجه تانيه اللي في وضع منه شلبي او مني زكي او غاده عادل بيدوروا علي الفيلم الكويس واللي يضيف لرصيدهم انشالله حتي لو مجابش مليم وناهيك عن الكلام ده كله بتاعي وبتاعك احب اقوللك ان وضع منه شلبي مع كريم عبد العزيز اقوي بكتير من وقوفها امام حلمي ده في وجهه نظري ...انا عندي الدور اللي لعبته منه شلبي في واحد من الناس العشر دقايق دول عندي بافلام منه شلبي كلها القديم والجديد خلاصه الكلام انا عمري ما هصدق الكلام اللي اتقال عن منه شلبي ده ابدا<br />ومسير الايام تثبتللك ان منه هترجع تقف قدام كريم ...ولا تقوللي حلمي ولا غير حلمي يقدر ينافس كريم......... المقامات محفوظه يا ريس"
