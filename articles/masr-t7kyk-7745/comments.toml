subject = "القصة باختصار،"
author = "مش ضروري"
posted = "2007-12-09"
text = "القصة باختصار، أن رجلاً متشدداً لم يدرس علوم الدين، تخرج في كلية الطب، ثم بدأ مسيرة الابتعاد عن الصراط المستقيم، ثم قاده الصراط الجديد إلي أفغانستان، وهناك أتم رؤيته المتطرفة.. وقد خطا وراءه آلاف الرجال قتلاً وتدميراً وتخريباً، ثم كان أن غير الرجل من رأيه، ليأتينا اليوم بكتاب جديد يحمل خلاف ما كتب في السابق.. إنه الدكتور سيد إمام الشريف، الأستاذ السابق للدكتور أيمن الظواهري.<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />نقلا عن موقع المصريون"
