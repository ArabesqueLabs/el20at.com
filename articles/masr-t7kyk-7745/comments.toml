[[comments]]
order = 5
subject = "إرحمنا يا \"مش ضروري\" وروح إتعالج"
author = "قطقوط"
posted = "2007-12-09"
text = "يا حبيبي<br />إنت فعلاً مريض بالهوس ...وعندك قصور شديد في قواك العقلية وبالتالي تحليلك للأشياء أعوج ومكسور...ورؤيتك للأحداث مختله...<br />والدليل إستخدامك للأحاديث النبوية في غير موضعها...ولي عنق الآيات ووضعها في غير محلها...<br />يا بغل...<br />البلد بتغلي يا حمار...وحالها من سئ لأسؤ...وانت عمال تقولي الشعراوي ومش عارف إيه ..وبتدعي ربنا إنه يهدي حسني مبارك...ربنا ينتقم منه ومنك...قادر يا كريم...ويبتليك بالي تنشغل بيه عن تثبيط همم الناس وإحباطها...<br />بمرض عضال بقى ولا بمصيبة تشغلك ولا بلوى تصيب عزيز عليك ...يا رب...وري المدعو مش ضروري أي ما كان إسمه هو وحسني مبارك عجائب قدرتك ...واسقيهم من إلي حسني مبارك موريه للمصريين ..أمراض وذل وقهر وفقر...آمين !<br />باين عليك مجنون ولا بتستهبل ...<br />أنت مريض ...مريض ...مريض..."
archived = "2010-03-14"
