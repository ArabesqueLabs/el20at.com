[[comments]]
order = 6
subject = "الى كلمنجى اونطة"
author = "مش ضروري"
posted = "2007-12-09"
text = "اولا انا مش بتاع الحزب الوطني ولا اي حزب والحمد لله وما عنديش بطاقة انتخابية والحمد لله<br />ثانيا الشيخ الشعراوي ما قلش ان الحاكم ابن ربنا<br />ثالثا انا انا علقت على هذا الموضوع وجبت ادلة قوية جدا ومهمة ولكن حصل عطل في الموقع والموضوع كله راح وراحت التعليقات معاه ولكن حديث رسول اله يكفي اقرأ الحديث القادم وانت تعرف كل مشاكلنا جاءت من ايه<br />وربنا يهدينا جميعا وربنا يهدي حسني مبارك ومجلس الوزراء والجيش والشرطة والامن المركزي وربنا يهدي الجميع الى ما يحبه ويرضاه<br />أقرأ الحديث<br />\"إن الله لا يقبض العلم انتزاعًا ينتزعه من العباد، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يبق عالمًا اتخذ الناس رءوسًا جهالاً، فسئلوا فأفتوا بغير علم فضلوا وأضلوا\"،<br />يا رب الناس تفهم"
archived = "2010-03-14"
capture_url = ""

