subject = "برافوا بتوع الوطنى"
author = "كلمنجي اونطة"
posted = "2007-12-09"
text = "العيال بتوع الوطنى اللى اعطوهم خط نت سريع adsl علشان يدخلوا المواقع ويكتبوا احاديث فى غير اماكنها زى الاخ مش ضرورى والتانى بتاع حديث الشعراوى اللى بيقول ان الحاكم ابن ربنا راحوا فين ما يدخلوا يعلقوا والا النهاردة اجازة فى امن الدولة<br />موضوع حلو اهوة وسخن وعن الاخوان والجهاد يا للة قولوا الخارج على النظام كافر وكام البق كلام اللى بتطلعوا بيهم"
