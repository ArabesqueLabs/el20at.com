[[comments]]
order = 2
subject = "بتوع الوطنى اللى بيتكلموا فى الدين"
author = "زعبلة كسر القلة"
posted = "2007-12-09"
text = "واللة كلامكم كلة عن العلماء والسلطان مسخرة<br />فايام الرسول ما كنش شخص ما يطلق علية عالم<br />واسمع يا سيدى رأى مفتى سلطان المغول اللى خرب العالم وقتل العباد وحرق العباد مفتى السلطان الملاكى بيقول<br />قال الامام البربهارى<br />اذا رايت الرجل يدعو على السلطان فاعلم انة صاحب هوى واذا رأيت الرجل يدعو للسلطان بالصلاح فا علم انة صاحب سنة ان شاء اللة ..............<br />ماشاء اللة<br />خللى كل زعبور يقول زى ماهو عايز كلامة مش ملزم الا لنفسة<br />وبعدين عصر السلاطين انتهى<br />وبعدين موظفين مباحث امن الدولة زى الاخ مش ضرورى حركاتكم واضحة قوى وجهلكم فى الدين واضح انما اكل عيشكم عايز كدة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "كيفما تكونوا يولى عليكم"
author = "عن مدونة ادي حال الدنيا"
posted = "2007-12-09"
text = "كيفما تكونوا يولى عليكم<br />الأول : فى آية قرآنية بتقول ان الله لايغير مابقوم حتى يغيروا مابأنفسهم<br />التانى : ايوة عارفها<br />الاول : وفى كمان حديث بيقول فيما معناه كيفما تكونوا يولى عليكم<br />التانى : تصدق فعلا حديث صحيح<br />الاول: طب ماتيجى نغير نفسنا صحيح يمكن تفرج<br />الثانى : نغير ازاى طيب قوللى مثال<br />الأول : اول حاجة نقرب من ربنا ونراعي ربنا فى كل حاجة<br />التانى : دة كلام عام ياعم<br />الأول : شغلك مثلا تعرف ماتاخدش رشوة ولا فلوس لزوم المصلحة<br />ولا ابتزاز وخلافه<br />التانى : حاضر لما اشتغل مش هاخد رشوة<br />استنى استنى طب على كدة بقى المسألة هتدخل فى مستحيلات<br />الأول : زى ايه<br />التانى :عندك المدرسين اكيد مش بيراعوا ربنا والا مكانش حد اخد دروس خصوصية<br />الاول: دة غير اللى بيسرق على صغير وعلى كبير واللى بينصب واللى بيهلب ويجرى<br />التانى : دة غير اللى بيدعوا للمفاسد<br />الاول : كدة يبقى نبطل نتفرج على الاغانى بتاعة ميلودى ومزيكا والحاجات دى<br />التانى: ايه دة نبطل نسمع اغانى انت بتخرف والا ايه ناقص تقولى نبطل نشيش<br />الاول : ايوة نبطل نقعد ع القهوة اصلا لزمتها ايه يعنى<br />التانى : طب ولو مقعدناش على القهوة هنقعد فى الدنيا نعمل ايه<br />هنمشى فى الشارع وخلاص ؟<br />الأول : لا طبعا لان لو مشينا كدة مش حلو خالص عشان لازم نبطل نعاكس البنات<br />ونبطل نضايق الناس<br />التانى: امال هنعمل ايه يافالح كدة هيبقى عندنا وقت كبير اوى فاضى<br />الأول : نشوف اى حاجة مفيدة نعملها نشتغل طيب<br />التانى: ماانت عارف يعنى انا وانت وكل اصحابنا وجيراننا واخواتنا دوخنا ولفينا البلد وبرده مافيش شغل دة اسمه ذل مش شغل<br />الاول: كدة هتدخلنى فى دايرة مفرغة<br />التانى: هى فعلا كدة<br />الأول : طب تعالى الاول نغير نفسنا يمكن ربنا يرضى عننا وحظنا يفتح ونلاقى شغل<br />ماهى الحكاية مش مستحيلة اوى برده فى ناس معانا وفى عمرنا واشتغلوا<br />التانى : خلاص تعالى نبتدى دلوقتى لما العشا تأدن نروح نصلى فى الجامع<br />الأول : بس انا وانت بس اللى هنتغير مش هينفع كدة<br />التانى : امال هنعمل ايه<br />الأول: نكلم الشلة كلها<br />التانى : بعد صلاة العشا هنعمل ايه<br />الاول: نروح للشلة نقنعهم<br />ـــــــ<br />الاول : شفت بقى اد ايه احساس حلو اننا نصلى جماعة انا بفكر كمان احفظ قرآن فى الوقت الفاضى دة<br />التانى : وممكن نعمل مسابقة ونحفظ مع بعض كلنا<br />بس هنتعاهد من دلوقتى ماحدش فينا يضعف وكل واحد يحاول يغير سلوكه<br />والتانى يساعده ولو ماقدرش يبقى زيه على الاقل مايهبطوش<br />الأول : انا موافق<br />التانى : العيال اهم قاعدين ع القهوة<br />الأول : اه صحيح دة فى ماتش النهاردة مهم جدا دة نهائى الدورى<br />التانى : تصدق نسيت خالص<br />الاول يسأل احد الجالسين على القهوة<br />كام كام ؟<br />الجالس : ايه دة انتوا كنتوا فين اقعدوا بسرعة الماتش حلو اوى<br />التانى وهو يشير للاول ثم يسحب كرسى ويجلس عليه<br />اقعد اقعد بسرعة<br />الثالت: 2 شيشة ياله للناس الجدعان دى عشان كدة الاهلوية زادوا اتنين<br />الاول ينظر للتانى فجأة وهما ماسكين الشيش والدخان يتصاعد من افواههم<br />الاول : شيشة تانى احنا مش قلنا مش هنشيش ومش هنقعد على قهاوى ؟<br />التانى : وانت مش قلت لى لازم كلنا نتغير مع بعض يلا بقى ياعم غير"
archived = "2010-03-14"
