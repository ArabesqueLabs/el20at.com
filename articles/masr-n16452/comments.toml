subject = "ايران تعداد سكانها 70 مليون وفيها 70 جامعة لانها ح"
author = "مصرى حزين"
posted = "2008-06-26"
text = "تعداد مصر 80 مليون انسان وفيها 17 جامعة لان الحكومة تكرة التعليم<br />وتعداد ايران 70 مليون انسان وفيها 70 جامعة - نعم فى ايران 70 جامعة<br />لماذا الفرق ؟<br />لان هناك حكومة اختارها الشعب<br />التكالب على مكان او كرسى فى احد الكليات جعل الثانوية العامة معضلة لقلة الجامعات<br />هل الفاشلون فى حكومتنا يرون ما تفعلة الشعوب حولنا<br />هل يعرف حسنى مبارك ذلك"
