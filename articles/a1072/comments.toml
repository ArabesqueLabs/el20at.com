subject = "لا يوجد"
author = "اسراء"
posted = "2008-07-05"
text = "مش عارفة موضوع غريب انك تسأل الناس هما لابسين الاسدال ليه<br />مالنا احنا ومال نوايا الناس مهو ممكن الف بنت تقول لابسة التزام ويكونوا كدبين اشققت عن قلوبهم اخوتى فالله الزى لله والدين لله دعوا الخلق للخالق الى يلبس يلبس لنفسة قبل متسألو هو موضة ولا التزام اسألوا انفسكم كل حد يسئل نفسة هل انا عملت كل الى عليا عشان ادور على نوايا الناس لاحول ولا قوة الا بالله اخاف يجى يوم حد يسألنى انتى بتصلى لله ولا موضة لكل امرأنا يومئد شئنا يغنية والله الى الناس بيعملوة ده هو الى جيبنا ورا سيبوا كل حد يعمل الى هو عاوزة ودوروا على انفسكم انتم دوروعلى الى ناقص فى دينكم وكملوة اكيد كلنا لسة موصلناش لدرجة اننا رضينا ربنا منتهى الرضا فبدل منسأل بعض على نوينا نسأل انفسنا والى عامل الموضوع ده هل سألت نفسك انت بتسأل البنات دول ليه هل نيتك انك ترتقى بدينك وهل الرسول امرك انك تسأل المؤمنين والمؤمنات عن نواياهم فى اعملهم؟ عجبى على كل من ترك عيبة وانشغل بعيوب الناس"
archived = "2010-03-14"
capture_url = ""
