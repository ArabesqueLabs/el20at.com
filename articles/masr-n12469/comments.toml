[[comments]]
order = 0
subject = "دولة بنت...."
author = "سالم طه"
posted = "2007-11-16"
text = "والله العظيم انت شجاعة ولو كم واحد عملوا زيك كده وسالوا عن حقهم وبطلوا خوف الدنيا هتتظبط والبني ادمين دول هيعرفوا انهم بيحكموا بني ادكمين مش حيوانات يشارورا لهم يمشوا ويترعبوا من اقل عسكري<br />ي دولة بوليسية ومحتاجة تتعامل مع مجرمين مش مع مصريين غلابة"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015210/http://masr.20at.com:80/newArticle.php?sid=12469"

[[comments]]
order = 1
subject = "خللي بالك م العيال يا دعاء"
author = "أحمد محمد علي"
posted = "2007-11-16"
text = "خللي بالك م العيال يا دعاء انت في السابع، وعاوزين نشوف براء وهو أب، الله يسترك يا شيخة<br />وبعدين قالك دواعي أمنية، حبكت يعني تنط الصحفية من دماغك وتعمل تحقيق، وبعدين المشئ والسلالم بالنسبة لك مفيدة الأيام دي، ويمكن لو جه ولد سميه عمران تيمناً بالقسم الكريم بتع العمرانية، بس الحقيقة لو ربنا رزقكم ببنت مش عارف تسموها إيه، أو سموها عمرانية .. صحيح شقاوة شعب"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015210/http://masr.20at.com:80/newArticle.php?sid=12469"

