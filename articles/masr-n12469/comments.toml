[[comments]]
order = 3
subject = "قوات تسد عين الشمس على خساب صاحب المخل"
author = "سعيد الدمياطى"
posted = "2007-11-17"
text = "فى الدول اللى بيقولوا عليها دول - الشرطة بتحمى المظاهرات وبتمشى معاها تأمنها وتحرسها<br />انما الهمج اللى بياكلوا فى ميزانية محلولة هدفهم قمع الشعب<br />ويطلع ابو جاموس يقول لك الحفاظ على المكتسبات<br />زمان كان مخبر بيروح يقبض على واحد الشرطة عايزاة<br />دلوقتى بتتحرك كتيبة من الهمج ويسدوا الشوارع علشان يقبضوا على واحد علية مخالفة<br />كل دة ارهاب للناس<br />عملية تخويف<br />قوات ضخمة جدا لموضوع هايف جدا"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015210/http://masr.20at.com:80/newArticle.php?sid=12469"

[[comments]]
order = 4
subject = "الحكومة خلاص وقررت تربينا"
author = "حسام علي"
posted = "2007-11-17"
text = "ياجماعة الموضوع فعلا اصبح مهزلة الظاهر الحكومة خدت قرار خلاص بمنع المظاهرات وتربية حركة كفابة من اول وجديد ، وعلى فكرة كل اللي كان بيصل عشان منع مظاهرة كفاية فعلا وقبضوا على ناس منهم ومحدش عارف راحوا فين اللي اتقبض عليهم<br />وكانها بتقول لنا بقى خلاص اللي فات مات والوقفات والمظاهرات كانت زمان يا حلوين دلوقتي المقشةوالامن المركزي واللي مش عاجبه يوح قسم العمرانية يتروق"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015210/http://masr.20at.com:80/newArticle.php?sid=12469"

[[comments]]
order = 5
subject = "احنا اصلنا شعب ..."
posted = "2007-11-17"
text = "يابنتي تقول لنا ازاي بس هو احنا بني ادمين زيهم، لو فاهمة كده تبقي غلطاة هم بيعاملونا زي الحيوانات روحوا كده نروح تعالوا كده نيجي، واصلا تلاقي مفيش حد سال غيرك لان الناس اتعلمت تخاف كويس وتطنش كل اللي بيحصل<br />قال الحكومة تقول لنا ليه بتعمل فينا كده ما تبقاش حكومة مصر العربية<br />ربنا يتوب علينا منهم مفيش غير حسبي الله ونعم الوكيل<br />واصبر على جار السو يايرحل يا تجيله رصاصة تخلصنا منه"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015210/http://masr.20at.com:80/newArticle.php?sid=12469"

