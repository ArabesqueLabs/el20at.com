[[comments]]
order = 0
subject = "حرامية بس"
author = "محمد عبدالعاطي"
text = "بما ان كلية اعلام مؤسسة خاضة لدولة يجب انت تنافق الدوله.. ونسي وتناسي اساتذه الجامعه مادرسوه عن حرية الصحافة وصصدق الكلمة ..وحتي في تبريرهم لقصف الاقلام الشابه جائو باسبب غير حقيقة ..<br />وأتسال هل من الشرف والحرية الحجر علي افكار الشباب وقصف اقلامهم وتقليمها في مهدها ..<br />وهل من المهنية ممارسة القمع والحجر الفكري بتلك الطريقة ..<br />وهل من المهنية التغزل في الحزب الوطني علي حساب المصداقية .. والماده الصحفيه .."
archived = "2007-06-16"
capture_url = "https://web.archive.org/web/20070616231645/http://masr.20at.com:80/newArticle.php?sid=10621"

[[comments]]
order = 1
subject = "بتتكلمي جد؟"
author = "محمد السيد"
text = "الجديد عليا في الموضوع ... .إني كنت مفكر إن الطبيعي في بلدنا إن الإدارة تتدخل في مشاريع التخرج ... والحاجات دي ...<br />لكن فوجئت علي كلامك .. إن ده جديد ... وإنه مكنش في تدخل زمان ....<br />والله الواحد كان ظالم الناس دي معاه ...<br />الله عليكي يا بلد ....<br />وبرضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com<br />تقدروا تورونا دلوقتي<br />www.mesh7askot.blogspot.com"
archived = "2007-06-16"
capture_url = "https://web.archive.org/web/20070616231645/http://masr.20at.com:80/newArticle.php?sid=10621"
