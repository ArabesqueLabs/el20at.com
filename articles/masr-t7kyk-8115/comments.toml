order = 0
subject = "المؤامرة على القضية الفلسطينية بدأت بعد زيارة بوش"
author = "مصرى"
posted = "2008-01-25"
text = "ملخص التمثيلية التى حصلت على الحدود - ان دى خطة مرسومة بين الحبيب بوش والانظمة العربية - هى تصفية القضية الفلسطينية - يعنى العودة بالقضية الى 50 سنة فاتت<br />قطاع غزة يتم ضمة الى مصر اداريا وامنيا وازالة الحدود بينهما<br />وضم الضفة الغربية الى الاردن بتمثيلية مكررة تجويع وحصار وتكسير حدود<br />وبذلك ينتهى الصداع لاسرائيل وتحمى الدول العربية حدود اسرائيل<br />وسلم لى على كل السذج العرب<br />اقرأوا اسلام ان لاين"
archived = "2010-03-14"
capture_url = ""

[[comments]]
