[[comments]]
order = 2
subject = "العملاء والوطنيين"
author = "من حزب الوفد"
posted = "2008-01-25"
text = "فرق كبير بين الشخص الوطنى مثل الزعيم سعد باشا زغلول واى رئيس عميل لحكومات الخارج<br />تروى الوثائق التى افرجت عنها الحكومة البريطانية صفحة قد تكون مجهولة من تاريخ مصر وفيها ان لويد جورج رئيس وزراء بريطانيا حاول احتواء ثورة 1919 فارسل ضابط مخابرات بريطانى ليقابل سعد باشا وهو ذاهب الى المنفى<br />وعرض الضابط البريطانى استعداد الحكومة البريطانية لتنصيب سعد باشا ملكا على عرش مصر فى مقابل بقاء الحماية البريطانية على مصر<br />نعم تقول الوثيقة انهم عرضوا على سعد باشا الجلوس على عرش مصر ملكا ان انهى الثورة وقبل الحماية البريطانية<br />ولكن الزعيم الوطنى الكبير قال لهم - انة يفضل ان يعيش خادما فى بلدة المستقل عن ان يكون ملكا تحت حماية حراب الاحتلال<br />سعد الوطنى يقول انة يفضل ان يعيش خادم فى بلد مستقل صاحب قرارة على ان يكون ملكا تحت حراب الاحتلال<br />فهناك فرق بين الوطنيين ومن سلموا القرار للبنك الدولى وامريكا<br />فرق كبير بين العملاء والوطنيين<br />تحية لك سعد باشا زغلول<br />تحية لقائد الثورة العملاق"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "عزاء لمصر"
author = "مصرى"
posted = "2008-01-26"
text = "توفى الى رحمة اللة تعالى رجل من رجال مصر العظام المخلصين<br />توفى رجل بناء الصناعة المصرية الثانى بعد طلعت حرب<br />توفى الدكتور عزيز صدقى وزير الصناعة فى حكومة عبد الناصر وبانى مصانع مصر كلها ورئيس الوزراء الاسبق فى عصر الرئيس السادات قبل حرب اكتوبر وكانت وزارتة هى الوزارة التى جهزت للحرب وتحمل القطاع العام كل اعبائها<br />تحية لكل بان وضع حجر فوق حجر فى ارض الوطن<br />تحية لكل المخلصين البنائين ورمزهم عزيز صدقى<br />ابكى يا بهية ابنك البار والمخلص<br />ابكى للذى لم يكن يتكلم ولكنة كان يبنى<br />ان للفارس ان يستريح<br />ابونا عزيز صدقى فى زمة اللة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "كلنا فداء مصر"
author = "eman"
posted = "2008-01-26"
text = "كل مرة الفلسطينيين يحصل ما بنهم انقسامات داخلية او خلافات مصر هى اللى بتتحمل نتيجة هذا الانقسام .الشعب الفلسطينى لا يستطيع ان يحل قضايا وطنة بنفسة و فى كل مرة دائما هو المتسبب بمشاكلة مع العدوان الصهيونى هم اللى اختاروا حكومة حماس التى لاتريد التعامل او فتح باب للحوار مع اسرائيل ضاربة بذلك عرض الحائط بكل القرارات الدولية .ممكن يكون من وجهة نظر البعض صحيح لكنهم فى نفس الوقت لم يحددوا موقفهم من اسرائيل فى كيفية التعامل معها اما الحرب او الحوار .و فى ظل هذا الانقسام و الصراع على السلطة الذى ذهب ضحيتة الشعب الفلسطينى الاعزل تتحمل مصر المنهكة اقتصاديا و امنيا مشاكل ليس لها بها يد ولم تصنها للشعب الفلسطينى ابدا .و بعد كدة جايين نقول نحيى الحكومة على هذا الموقف و لا لأ .من رايى اننا لا حنسقف للحكومة ولا حنقولها ان دة كان من الواجب .لكن ابسط الحقوق اننا نقف مع الحكومة فيما سوف تتخذة من اجراءات مهما كانت لقطاع غزة لانة على الاقل الحكومة اكيد حريصة على امن مصر القومى اللى هو فوق كل اعتبار ."
archived = "2010-03-14"
capture_url = ""
