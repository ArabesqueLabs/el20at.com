subject = "الى الاخ مصري اللي فوق"
posted = "2008-01-25"
text = "معذرة<br />احنا دايما العرب والمسلمين نكشف الخطط ونكشف المؤامرات لكن مش عارفين ازاي نتصرف<br />زي خرفان العيد اللي كشفت مؤامرة ذبحها يوم العيد ومع ذلك تساق الى المذبح"
