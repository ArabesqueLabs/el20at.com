text = "طبعا الكل هيلبس الكمامة<br />واول ناس لبستها هن السيدات المنقبات -- هو النقاب مش فلتر وكمامة بتنقى الاتربة والجراثيم اللى بتدخل الى الفم<br />القاهرة كلها ملوثة بغازات عادم السيارات ونسبة الكبريت فى بنزين السيارات المصرية عالى جدا والاكاسيد الكبرتيية بتاثر على الجهاز التنفسى والرئتين<br />نعم النقاب افضل من الكمامة ميت مرة"
