[[comments]]
order = 3
subject = "حماس اعترفت باسرائيل ضمنيا"
author = "سيرانة"
posted = "2007-05-23"
text = "يا جماعة الخير الي عم بيصير لعب بالمصطلحات<br />حماس لو معنية باخراج نفسها من الازمة كان اعترفت بمنظمة التحرير كممثل شرعي ووحيد للشعب الفلسطيني وما حدا راح يجيب سيرة الاعتراف باسرائيل مع العلم انو حماس بمجرد ما اعلنت التزامها بالاتفاقيات الموقعه فهي ضمنيا اعترفت باسرائيل.<br />ومجرد الترشح لحكومة \"اوسلوية\" هو اعتراف ضمني باسرائيل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "حماس لا تتخلا عن مبادئها"
author = "قيس حيدر"
posted = "2007-05-31"
text = "حماس ام المبدىء ... مهما صار حماس مستحيل تتخلى عن مبادئها اللي التزمت فيها طول العمر ... حرام عليكم تتهموا حماس بهدا الشي ..... المشكلة انه في وقتنا الحال انقلبت الموازين وصار الشريف خائن و الخائن شريف مكة ... كل اللي بعملوا محمود عباس بالشعب الفلسطيني ولسه ما حكيتوا عنه خائن بس ليش حكيتوا عن حماس هيك هدا اللي نفس كل انسان بزور هدا الموقع يعرفه... وعلى فكره ما رح ادخل هدا الموقع بعد هالمرة ....."
archived = "2010-03-14"
capture_url = ""

