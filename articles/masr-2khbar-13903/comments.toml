text = "بامارة تعويم الجنية وخسف الارض بة وبدل ما كان الدولار بجنية الدولار بقى ب 6 جنية وهذا يعنى تخفيض الرواتب الى السدس كقيمة شرائية<br />ثانيا بامارة ضريبة المبيعات ال 35 % على كل حاجة وعلى اى فاتورة حتى فاتورة التليفون وهذا رفع الاسعار 35 %<br />با امارة ضريبة العقارات اللى هتخرب بيوت الناس<br />با امارة اية<br />هلك الناس فى الدروس الخصوصية بعد افشال التعليم<br />والفقير اللى بيموت على ابواب المستشفيات لقذارتها وعدم وجود ادوية فيها<br />هو المواطن مش شايف وبيعانى<br />هو الكلام هيحل المشكلة<br />اتكلموا<br />اتكلموا"
