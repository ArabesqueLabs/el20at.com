text = ":- اولا احنا شعب مش مغرم قوى بالنظافة والزبالة تملىء الشوارع ومياة المجارى تطفح فى كل مكان والزحام الشديد فى وسائل المواصلات والحارات والشوارع والاسواق وبمعنى اصح لو بدأ هذا الوباء فى هذة الظروف هتبقى مصيبة كبيرة قوى وهيموت عشرات الالوف وحركة السياحة هتنضرب جامد لان الدول هتمنع رعاياها من الحضور الى مصر وكذلك لن نستطيع ان نصدر اى شىء وسنصبح دولة محاصرة والبلاوى هتزيد<br />ولهذا فا انا انصح بترك العمل للقضاء على تلك الخنازير للقوات المسلحة لقتل تلك الخنازير ودفنها فى مدى 10 ساعات وانتهى الامر<br />اضربوا الخنازير بالمدافع الرشاشة واحفروا خنادق باللودر وادفنوها وبطلوا هيصة<br />البلد ممكن تضيع فى شربة مية"
