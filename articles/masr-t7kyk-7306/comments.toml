subject = "حزلقة"
author = "قرفان"
posted = "2007-10-09"
text = "تقديم الخير فى فنادق 5 نجوم للدعاية والبروباجندة ونقل بضعة اطفال فقراء الى حبث بتواجد هؤلاء الفنانين لانهم ياى يقرفون من الذهاب الى دور الايتام المعفنة والحارات التى يتواجدون فيها<br />ما ينفق على بضع اطفال فى وجبة فى فندق 5 نجوم يكفى مصاريف دار ايام شهور ويكفى لشراء ملابس للنزلاء تكفيهم سنة<br />ويا ايها الفانون بطلوا حزلقة<br />واماكن الصدقات ليست الفنادق ولا صالات الديسكوا وانما فى اماكنهم وفى بيوتهم"
archived = "2010-03-14"
