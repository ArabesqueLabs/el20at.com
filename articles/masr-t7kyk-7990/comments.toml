posted = "2008-01-11"
text = "انا اقولك عمور راح الكنيسة ليه يا نجم عمور لقى البريق الاعلامى اختفى والشباب مش زى الاول والمعجبيين يوم عن يوم بيقلوا فقلك نعمل فرقعةجديدة حاجة شاذة نروح الكنيسة نحتفل معاهم قال ايه ده هيقضى على الفتنه الطائفية .<br />انت لو مصدق الكلام ده والمثالية اللى فيهاعمرو خالد ومثالية الكنيسة تبقى راجل اهبل وعبيط واهو بتكتب كلام وخلاص صحافة واكل عيش بقى.<br />عمرو خالد من يومه بيخاطب الطبقة الهاى كلاس وعمره ما حس بمشاكل الشباب ولا المصريون عموما ما عمارة الاسكتندرية وقعت ولا حتى العبارة حد سمع له صوت .<br />عموما هو ده عمرو خالد من يومه اى حاجة مختلفة وشاذة وصادمة للمجتمع يجرى ويعملها لزوم الشو الاعلامى ،تروح الدانمرك -امريكا- الكنيسة انت حر عقبال ما نشوفك انشاء الله فى تل ابيب من اجل التعايش بين المسلمين واليهود واهو كل بثوابه كام جايزة كده من بتوع الخواجات ربنا يهديك ."
