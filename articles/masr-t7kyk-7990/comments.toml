subject = "مبارك شعب مصر"
author = "مسلم و كلى فخر"
posted = "2008-01-08"
text = "السلام عليكم و رحمة الله و بركاته<br />فعلا أسلوبك مبهر يا أستاذ عبد الله و تجبرنا على التلهف و إنتظار مقالاتك<br />أقولها من كل قلبى كل عام و شعب مصر بخير مسلمين و أقباط<br />لأننا فى رباط إن شاء الله إلى يوم الدين<br />و كعادته عمرو خالد يبهرنا دائماً بمبادراته الخلاقه<br />و لو قام بمبادرة الحوار الأسلامى المسيحى سوف أكون من اول المنضمين إليها إن شاء الله لأننى على قانعه أن الموكل بحساب العباد هو رب العباد و كلُ حر فى معتقده الدينى<br />تعالوا نحب بعض و ننسى خلافتنا العقائديه هذه رسالة عيسى بن مريم و محمد عليهم صلوات ربى و سلامه<br />ختاما أكرر كل سنه و شعب مصر كله بخير"
