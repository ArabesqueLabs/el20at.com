[[comments]]
order = 0
subject = "مقال أكثر من رائع"
author = "شريف الدواخلى"
posted = "2008-01-08"
text = "تعرف يا استاذ عبد الله ، انا طلعت من الصحافة كلها بحضرتك وحد تانى من روز اليوسف \" على المستوى الانسانى \" قبل كل شئ و هذا يكفينى ... بجد بجد ما شاء الله أكاد أجن وأن أقرأ كلماته وهى تتراقص أمامى لتنسج أسلوباً يجمع بين الاصالة والحداثة ، حتى أن أشعر وكأنه الله عز وجل حباك بلغة عير التى نعرفها وكأننا كصحفيين نسبح فى بحر 28 و أنت تملك معجماً خاصاً بك ،،،<br />ماشاء الله مرة تانية .. بس فعلا عمرى ما قريتلك مقال وعشش فى دماغى كده ...<br />تسلم أيدك يا زعيم<br />بالنسبة للموضوع نفسه بقى ..... انا بجد شاكر ليك إنك أعتمدت على الخبر الموثق وهو أن عمرو خالد جاء بمبادرة شخصية منه وليس بدعوة من أحد .. بحسب تصريحاته لـ \" اسلام اون لاين \" وكما نشرت الدستور والمصرى اليوم ...<br />وهو بصراحة أوقع جدا لان البابا لو كان وجه الدعوة لعمرو كان شكره زى ما الورقة الجاهزة اللى حضرتها ليه السكرتارية لانه شكر الناس اللى تلقت الدعاوى وقالت جيه من جمال مبارك لحد اسامة الباز<br />وكمان الاولى انه كان يدعو شيخ الازهر \" لان الموضوع كان رسمى قوى \" و كمان عمرو نفسه لما الناس شافوه ذهلوا ... وقال انها اول مرة يجى فيها الكاتدرائية فى عيد الميلاد ... وأكد انه جاى من نفسه<br />الجميل كمان فى مقالك الرائع<br />انك فكرتنا بموضوعك الاجمل عمرو خالد وسامح موريس صاحب ال 4000 تعليق ... فاكره<br />كل سنة وانت طيب بمناسبة العام الهجرى الجديد أعاده الله عليكم بالخير واليمن والبركات والعزة والتمكين للاسلام"
archived = "2010-03-14"
capture_url = ""

