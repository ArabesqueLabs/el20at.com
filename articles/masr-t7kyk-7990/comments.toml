text = "مفيش تعليق على واحد جاهل بأبسط امور عقائده الدينية وهي عقيدة (الولاء والبراء ) ولاء ايه بس ياعم وبراء مين انت شكلك كده ارلهابي وشكل كده القران بتاعكم ده ارهابي عشان مكتوب فيه ان لن ترضى عنك اليهود ولا النصارى حتى تتبع ملتهم يبقى نشيل بقا كل اية في كتاب ربنا بتقول ان المسيحي واليهودي كافر عشان نعرف نعيش مع الاخر على منطق ال........ اللي راح للكنيسة ويتبارك بعم شنودة اللهم اهدي المسلمين يارب وانا لله وانا اليه راجعون<br />(ملحوظة) عمرو خالد بينافس على ان تكون لديه قبول كبير في الوسط المسيحي والوسط اليهودي انا عايز اعرف حاجة هو بكده هيفتح القدس"
