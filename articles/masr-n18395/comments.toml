[[comments]]
order = 0
subject = "بياع البيبسى الاهلاوى"
author = "سماسم"
posted = "2008-11-17"
text = "كنت مسافرة فى قطار اسكندرية - وعند توقف القطار فى محطة طنطا - جرى على الرصيف بياعين البيبسى والكولا فى جرادلهم الحديدية - بيبسى يا بية - كوكاكولا يا هانم<br />وعندما اعلن المذيع فوز الاهلى<br />حلف بالطلاق احد بياعى البيبسى ان يوزع جردل البيبسى على الركاب بالمجان<br />ومن حماقتة وزع زجاجات البيبسى على الناس ببلاش وهو ماديا حالتة مزرية ويلبس شبشب ويكاد يكون حافى ولا علاقة لة بالرياضة من قريب او بعيد فمنظر وجهة علية علامات فقر الدم<br />ولكنة جنون الكرة<br />وتعصب الاوباش<br />وصبية المدارس والعاطلين عن العمل"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201040354/http://masr.20at.com:80/newArticle.php?sid=18395"

[[comments]]
order = 1
subject = "الى سماسم ما هي دي خيبة الشعب المصري مع الممثلين و"
author = "مش كاتب"
posted = "2008-11-17"
text = "احنا نتفرج عليهم<br />وهما يسكنوا في الزمالك ويركبوا سيارات فارعة وهما ماشيين في الشارع يبصوا للشعب المصري باحتقار وازدراء<br />زي عادل امام كده ابنه موت واحد بالسيارة اللي دفع تمنها الشعب وراح طلعوا منها زي الشعرة من العجين"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201040354/http://masr.20at.com:80/newArticle.php?sid=18395"

[[comments]]
order = 2
subject = "ليس بالكورة(يحيا الانسان)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-17"
text = "ماذا حدث لك يا مصر<br />انقلب الحال و سقط الميزان؟<br />العاهرات و الساقطات و الراقصات و الراقصون و الفشلةو الممثلون و المغنون و اللعيبة الفاشلين الغير متعلمين؟و نواب القروض و لصوص المجتمع من رجال فن و سياسة و اقتصاد و صناعة و ثقافة و اعلامو--------------------------!!!!!!<br />هؤلاء اصبحوا صفة مصر<br />لك اللة يا مصر"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201040354/http://masr.20at.com:80/newArticle.php?sid=18395"

[[comments]]
order = 3
subject = "ياه كل دة علشان(الاهلى)كسب؟!!!"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-17"
text = "امال هنعمل اية عندما نحرر(فلسطين)؟!!!<br />ليس با(الكرة)يحيا الانسان؟!!!<br />لك اللة يا مصر<br />امال فين باقى افرع انواع الرياضة الاخرى؟<br />الرياضة المحترمة ؟ و ليست الرياضة الرخيصة الى خاربة عقولنا الصدئة؟<br />يا بهايم حرام عليكم هذا النفاق الرخيص!<br />صحيح(شعب)تجمعة طبلة و (شعب)يفرقة كرباج"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201040354/http://masr.20at.com:80/newArticle.php?sid=18395"
