subject = "زرت احد هذة المراكز مرة من المرات"
author = "شهبور بختيار"
posted = "2008-10-18"
text = "شرحت حالتى المنيلة للدكتور النفسانى بعد ان اخد فى الكشف 200 جنية وبعدين كتب لى 3 حبوب زرق وقال سكتك خضراء ودلع نفسك<br />وليلتها الست لمت هدومها وراحت عند امها وعلى الباب حلفت ما هى داخلة البيت دة تانى الا لما ابقى انسان<br />وكل ما اتصل بيها تقول لى ان هناك فرق بين الانسان والحمار<br />وانا مش فاهم<br />يمكن علشان حبوب الدكتور النفسانى الزرقاء"
