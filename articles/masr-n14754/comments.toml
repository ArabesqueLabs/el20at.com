[[comments]]
order = 8
subject = "رئيس مصرالقادم بالعافيةلسدة الحكم المريض بالكدب على الناس"
author = "قارون"
text = "ويستمر مسلسل التخديربالوعود الهلامية والتدليس المكشوف وعلى فكرة ياجمال افندى الكلام دة ياريت تسمعة جمهور غبى اومنافق اومغلوب على امرة وفى الحالة دى يبقى اتكلم براحتك لان الناس ومشكلهم فى واد وانت وبابا والمشرعتية ونواب التزوير ووزراء البزنس فى واد تانى او فى كوكب تانى خالص"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002931/http://masr.20at.com:80/newArticle.php?sid=14754"

[[comments]]
order = 9
subject = "مش عاوزين زيادة عايزين انتخابات حرة ونزيهة ياخلق اللة"
author = "حاتوتى الامانة"
text = "انتخابات حرة بدون كوسة علشان تيجى ناس منتخبة انتخاب حقيقى وعبرصناديق الاقتراع كفيلة انها تحل مشاكلنا المتراكمة والمستحدثةبطريقة نحس بيها ان احنا بنى ادميين وفى القرن الواحد والعشرين بغض النظر عن مين فاز لانة مادام لية ناخبين ومحبين بيثقوابقدراتة واكيد حيسعدوة لتنفيذ برنامجة اللى وعد بية الناس انما اللى بنشوفة وعايشينة سببةعدم نزاهة الانتخابات ومن هنا تبتدى مشكلة الفساد من الاول وتكبر ويتفرع منها المشاكل وفى الاخر اللى يضيع فيها المواطن اللى ضاع صوتة ادى ام المشاكل والمعوقات اللى بتعيق نمو وتقدم البلد وتخلينا مكانك سر بين الامم ومشاكل بطالة فقر غلاء فاحش وانعدام الرغيف اخيرا بسبب السياسات الحكيمة للحزب الفلتة وهلم جرا"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002931/http://masr.20at.com:80/newArticle.php?sid=14754"

