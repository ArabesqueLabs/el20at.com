[[comments]]
order = 0
subject = "جحا وحمارة"
author = "جحا"
text = "اراد جحا ان يعلم حمارة<br />فذهب بالحمار الى معلم حمير فى الاسطبل وقال لة - يا معلم انا عايز اعلم الحمار واخلية دكتور قد الدنيا<br />المعلم قال لة - خلاص يا جحا - ان شاء اللة اخللى الحمار لك يبقى دكتور بعد 6 سنوات<br />جحا - عظيم - واية المطلوب<br />المعلم قال لة تدفع 100 الف جنية<br />دفع جحا 100 الف جنية وكتبوا شروط وعقد ان جحا يستلم الحمار بعد 6 سنوات دكتور<br />وانصرف جحا - والتف الناس حول المعلم - ازاى هتوفى بالعقد وازاى الحمار هيبقى دكتور<br />ضحك المعلم وكركع وقعد وانجعص وقال لهم يا ناس يا جهلة<br />بعد 6 سنوات يا يموت الحمار - يا اموت انا - يا يموت جحا"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002931/http://masr.20at.com:80/newArticle.php?sid=14754"

[[comments]]
order = 1
subject = "هتلغوا المقال كالعاده"
author = "الاسم مصريه"
text = "موتوا بقى مع بال ماال6 سنين مايعدوا ... وست سنين ليه؟<br />وبعدين هى الحكومه والحزب الحاكم هيغلب هما كالعاده هيتبعوا خطه 4 2 4 بتاعة الصهاينه<br />يعنى يزودوا المرتب 10 جنيه ويقولوا احنا زودنا اهوه ونفذنا برنامج الريس<br />ومن ناحيه تانيه يزودوا الاسعار<br />على بلاطه كده يدولك 10 جنيه باليمين ويخدوا منك 100 جنيه بالشمال<br />شكرا ياريس شكرا ياحكومه شكرا ياحزب ياحاكم احنا اللى نستاهل"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002931/http://masr.20at.com:80/newArticle.php?sid=14754"

[[comments]]
order = 2
subject = "بالذمة دة كلام ياناس جمال بيحلم وهو صاحى"
author = "بون بون"
text = "سيبك من زيادة الرواتب والبكش اياة لكن انا عاوزك يارئيسنا المنتظر شئنا ام ابينا ان تنزل للشارع وتشوف زحمة السير واحترام الناس للطريق وبعد كدة كلمنا عن تلوث البيئة اللى سببة توقف الطرق بشكل تام بسبب عدم احترام قواعد السير والمرور واللى بينتج عنة تلوث الهواء بدخان العربيات وتعطل الطريق للاسعاف او المطافى والسبب الرئيسى والمهم واللى بيشغل بال كل مصرى انة لازم نتعلم ازى نحترم الطريق انكان للعربيات او للمشاة على الرصيف وبعدين تعال كلمنا عن الصحة والتدخين مع انى مبدخنش بس اسكر احيانا"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002931/http://masr.20at.com:80/newArticle.php?sid=14754"

[[comments]]
order = 3
subject = "نعم الراكب"
author = "مركوب"
text = "الأخ العزيز مهيب الركن جمال عدي قصي مبارك<br />تحية طيبة معطرة بالأشواق لرؤياكم الغالية<br />أما بعد<br />لعلكم والأسرة الغالية بخير وبأتم الصحة وأحسن حال .. والله ياسيدي نحن مشتاقون لأن تركبونا اليوم قبل غد . نعم الراكب وبئس المركوب ..وعذرا إذا كانت الركوبة ومش ولا بد أو أنها ( بتحرن) لكن عصاية أو عصايتين من إيدك الشريفة تنخزها في عجزها( يعني مؤخرتها ) فلسوف تهرول تحت منك مثلما كانت ولا زالت تهرول من تحت السيد الوالد والسيدة الوالدة والسيد أخوك وكل الأسياد والبهوات اللي راكبين ومدلدلين رجليهم . ولا يمنعها وليس بعذر لها من الهرولة فتك السرطان بها ولا كبدها المهري ولا جوعها ولا عطشها ولا عرجها وفضيحتها بين جميع الركايب العربية اللي بتجري وترمح ولا المهر تحت الركيبة العرب والعجم وبني الأصفر. لكن ولا يهمك.. ركوبتك العرجا تغنيك عن سؤال البنك اللي كنت شغال فيه في انجلترا ..<br />بس أنا ليا عندك طلب وبس وحياة النبي ما تزعل مني ولا تفهمني غلط لأن أنا عارف . زعلك وحش . ولو انت زعلت يبقى الدنيا كلها هاتزعل .الجيش والشرطة وأمن الدولة والمخبرين والمرشدين وبتوع المحليات وكل ولاد الدايرة بتوع الشعب قصدي مجلس الشعب وابوالحديد بتاع الجمهورية دا غير بتاع الحديد وبتاع طشة الملوخية وبتاع جبر الخواطر وبتاع الجهاد عودة وبتاع البيض بيضك وغيرهم وغيرهم كل دول هايمسكوا في هدومي علشانك.. وأنا مكسوف منهم لإن ما فيش حته في هدومي تتمسك ..<br />أنا يابيه ومنذ ميعة الصبا ( حلوة ميعة دي) وحتى بلوغي من العمر أرذله ( طب عليا النعمة إن أرذله دي أنقح من ميعة الصبا) بأشوف وأشاهد برامج اتحاد الإذاعة والتلفزيون من أول برنامج الغلط فين؟؟ بتاع على فايق زغلول الله يرحمه..اللي مات وهو بيدور على الغلط فين؟؟ وما عرفشي إن الغلط عندنا وراكبنا( دا الغلط مش انت يا معالي الباشا) من ساسنا لراسنا.. ومرورا ببرامج ساعة لقلبك وهمسة عتاب وما يطلبه المستمعون وعلى الناصية وماما نجوى وبقلظ و اليوم المفتوح ونادي السينما وبعدين صباح الخير يامصر وتسعين دقيقة والبيض بيضك والعاشرة مساء وغيرها وغيرها.. وكان أتخن برنامج فيهم يعني قول نص ساعة .. ساعة.. ساعتين.. قول حتى تلات ساعات<br />ودي بصراحة ربنا كانت برامج عيالي قوي .ونفسها قصير وبتنهج ( من النهجان) واحنا بصراحة عشنا واترعرعنا على برامج السيد الوالد ربنا يخليه ويفضل راكبنا حتى آخر العمر ولو حتى ضاع العمر ياولدي .. ودي برامج سيادتك ما شوفتهاش لأنك كنت بسلامتك في شغلك في البنك الانجليزي .. وكنا إحنا هنا بنتقلب على أحلى برامج إيشي برنامج الصحوة الكبرى اللي أطلقها السيد والدك وأتاريها كانت ( صحوة الموت ما أرى أم أرى غفوة الحياة تررلم لم) إلى برنامج الألف خطوة خطوة وبرنامج تسديد ديون مصر وبرامج الخطة الخمسية والخطة العشرية والخطة الخمستاشرية وبرنامج القاهرة 2050سنة وهلما خطة وأخيرا برنامج السيد الرئيس دا غير برنامج عنق الزجاجة وبرنامج فلة الزجاجة وبرنامج قعر الزجاجة .. وأخيرا برنامج الخطة السداسية بتاع سيادتك دلوقتي وده بصراحة برنامج صح الصح.. ألا قول لي يابيه.. انجليزي ده يامرسي؟؟"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002931/http://masr.20at.com:80/newArticle.php?sid=14754"

