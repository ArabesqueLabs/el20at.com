[[comments]]
order = 5
subject = "مسمرلنا الاسعار ومش عايزين زيادات"
author = "مواطن زى اى مواطن"
text = "مش عايزين زيادة مرتبات يارئسنا القادم اخنا بس عايزن تثبيت الاسعار او انخفضها ولو ان دة مستحيل يبقى على الاقل تثبيت الاسعار هو دة شىء صعب اوى كدة الباشا الكبير لو حل يوقف الاسعار ممكن جداا يرف سماعة التليفون على احمد عز ويقولة بمنتهى الشكيمة عارف لو رفعة تانى طن الحديد عن 3000او4000حتى عارف هعمل فيك اية هعلقك انت ومرطاطك الاربعة انت عارف منين وهخلى الشعب المصرى كلة يمشى عليك وانت عارف بقا قلة ادب الشعب المصرى من الاخر كدة الناس المساكة الاقتصاد زى الحديد والاسمنت والمواد الغذائية لو حبوا يلجموهم واللة لاخلهم يمشوا على العجين ميلخبطهوش لكن للاسف هما سيبناها كدة لغرض فى نفس يعقوب واما نشوف اخرتها كتكم الارف مالتوا البلد"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002931/http://masr.20at.com:80/newArticle.php?sid=14754"

[[comments]]
order = 6
subject = "كلكم بمرتبة غشيم - احمد عز يا جهلة وكيل اعمال جمال مبارك"
author = "ابو بصلة"
text = "انتم فاكرين احمد عز دة حاجة فوق القانون دا وكيل اعمال العائلة الحاكمة<br />الفلوس دى كلها لهم<br />واحمد عز وغيرة من رجال السياسات مجرد اراجوزات لجمال وعلاء مبارك<br />البلد بلدهم<br />خليهم يطلعوا الجرب على جلدكم"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002931/http://masr.20at.com:80/newArticle.php?sid=14754"

