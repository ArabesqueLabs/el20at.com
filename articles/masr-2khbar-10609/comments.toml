subject = "القاضى وضع يدة على سبب خراب مصر"
author = "مفيش لزوم"
posted = "2008-11-26"
text = "القاضى وضع يدة على سبب خراب مصر - وقال الناس دى تطلع برة الجامعة - دول اعداء العلم واعداء الثقافة - دول بتوع معسكرات وهب يمين وهب شمال وللخلف در -- يقوم الزمان يلف ويدور ويخللى بتوع الامن هم اللى يختاروا العمداء ورؤساء الاقسام والمصيبة يحددوا مواضيع البحث العلمى<br />امن اية<br />اللة يرحم ايام ناصر الديكتاتور<br />كان شعار الفترة - جامعة بلا اسوار - والجامعة منارة لكل الشعب - واى واحد كبير كان بيدخل مكتبة الجامعة ويقابل الاساتذة ويعرض المشاكل الفنية فى شركتة<br />انما دلوقتى - الامن عمل الجامعة حصن بابليون وممنوع الاقتراب والتصوير والدخول<br />واذا طالب اظهر بعض الاراء يقرر الامن فصلة وطردة من الجامعة<br />والامن بيحدد المرشحين للانتخابات الطلابية وبينجحهم بالتزوير<br />لغاية ما وصلت الجامعة انها اصبحت معسكر امن مركزى زى معسكرات الدراسة<br />القاضى كان رائع<br />خللى العيال بتوع النظارات البيرسول يطلعوا برة الحرم الجامعى وخللى الجامعة تنضف من الوساخة"
archived = "2010-03-14"
