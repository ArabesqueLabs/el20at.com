[[comments]]
order = 8
subject = "قارئ له قلم و الكثير من ال !!!"
author = "محمد عيسى"
posted = "2007-06-04"
text = "بسم الله و الصلاة و الصلاة على اشرف خلق الله سيدنا محمد عليه الصلاة و السلام<br />قرأت جميع المقالات الخاصة بالمعركة الفكرية كما تسمونها !!<br />لم أرد ان أكتب في جميع المقالات فأنتظرت ان يتم نشر موضوع يلم بكافة المشكلة و يكون النهائي و قد حدث ما توقعت<br />نعم .. قرأت و لفت نظري الكثير و اتفقت في الرأي و تعجبت ....<br />1- قرأت المقالين الخاصين بحسام تمام و قرأت مقال مصطفى عاشور .... أتضح لي ان حسام تمام قام بانتقاد عمرو خالد نقد بناء بعيدا كل البعد عن اي هجوم شخصي .. و هذا عكس ما قاله مصطفى عاشور في مقالته .. فمصطفى قال في العنوان ( نرجسية كاتب ..... ) المقال واضح من عنوانه انه هجوم شخصي واضح على حسام تمام و ليس نقد لمقال حسام انما هجوم على شخص حسام .. على مصطفى عاشور ان يكون حياديا و ليس ان يظهر حقده علانية !! هذا بغير ان في الاساس نقده كان ان يأتي في موقع اسلام اون لاين الذي يعمل فيه . و لكن يبدو انه عالم ان معركته على حسام ستنتهي بالفشل فلهذا توجه الى عشرينيات الذي رواده من الشباب الذين اذا وجدوا اي نقد في اعمال عمرو خالد سيوجهوا النقد لحسام حتى لو على صواب .. و نسوا ان عمرو خالد مجرد بني آدم يخطئ و ليس ملاك .. ( ده حتى النبي اخطأ ) .. و لن اطيل في ردي على هذه النقطة لان مقال حسام تمام رد عليها بالتفصيل ( أخطأ عمر ولم يخطئ عمرو! )<br />2- لفت نظري ردا كتب في موضوع ( أخطأ عمر ولم يخطئ عمرو! ) كان صاحبه ميدو .. لا اعلم لماذا التخفي وراء اسامي و ليس هذا فقط انما خفي الشخصية كلها .. الرد كان يحتوي على ذكر ( صلاح عيسى - اسلام أون لاين ) و بالتأكيد صاحبه ليس مجرد قارئ انما هو شخص قريب ل حسام تمام أراد ان ينتقم منه في رده .. فكيف له ان يعلم عن ( صلاح عيسى ) أليس صلاح يساري و رأيه هذا يجب ان يؤخذ في الاعتبار نظرا لاختلاف افكار بين اليساريين و الاخوان ؟ .. كيف لصاحب الرد ان يعلم بمشاكل تدور في أروقة اسلام اون لاين .. الا اذا كان يعمل هناك و صديق ل مصطفى عاشور الكاتب الذي نقد حسام تمام بكل حقد و تهجم على شخص حسام .. !! علامات كثيرة من التعجب يجب ان توضع هنا<br />3- أتفق في الرأي مع ما قاله الأخ LG في عنوانه محكمة<br />4- و تعجبت أشد العجب من أدارة عشرينيات التي استضافت تلك المعركة مع ان المقالات لم يتم نشرها على موقعها ..<br />و شكرا"
