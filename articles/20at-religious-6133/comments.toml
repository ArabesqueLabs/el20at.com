[[comments]]
order = 2
subject = "محمكة"
author = "I.G"
posted = "2007-05-31"
text = "لقد فكرت مرارا وتكرارا قبل أن أكتب هذا التعليق لأني لا أؤمن بفكرة الاهتمام بأشياء لا تضر ولا تغني عن شيء حتى لو كان الإعلام كله مركز على تلك الأشياء, ولكن هنا اختلف الأمر حتى أنني بدأت أشعر أن الكتاب و القارئين ينشغلون بأتفه المواضيع عن المواضيع الأكثر أهمية. فنجدهم ينشغلون بقضية الإساءة للرسول (ص) و ينصرفون عن ما يحدث في البوسنة والهرسك, أليس سفك دم المسلم أشد عند الله من هدم الكعبة. ولكن للأسف كثر الغافلون. ونجد كتاب يهدفون في كتابتهم أن ينصحوا أو يوضحوا رسالة معينة و آخرون يكتبون من أجل الشهرة فتدفعهم أغراضهم إلى كتابة أكاذيب عن حقائق وبديهيات مسلم بها لإثارة الضجة فيصبحوا \"كالذي بال في بئر زمزم ليذكره الناس\".<br />هنا في هذه القضية أجد نفسي ألعب دور القاضي \"كأي قارئ قرأ الموضوع والمداخلتين\" بين المدعي العام \" حسام تمام\" , محامي عمرو خالد \" مصطفى عاشور\" و الشاهد اللي ما شفش حاجة \" البراء أشرف\" . ولا تتوقعوا مني أو من أي قارئ آخر أن يكون محايدا, لأن كل ما يصل للغرب عنا ينعكس على كل فرد منا. \" وأطرش يحكي للسامع\"<br />أبدأ بما كتبه حسام تمام,: أنا تماما في جانب من يؤمنوا بأن عمرو خالد أصبح \" أو في طريق لكي يصبح\" لا يصلح إلى مهمة الداعية, لأنه بدأ في التوغل في فكرة الانتقال من داعية إلى محلل سياسي بحت ومن ثم إلى \" نجم هوليوود أمة الإسلام\" , لذلك أتفق مع حسام تمام فيما ورده عن عمرو خالد وأضف تلك النقاط:<br />1- مسابقة التايم لم تكن عادلة لأنها تجاهلت رموزا كثيرة و اختارت رموزا \"بصفة أو بأخرى\" بطريقة عنصرية, فنجد أكثر شخص هتف باسمه ورفعت صوره على الأعلام , حسن نصر الله, قد أستبعد تماما و أشخاص آخرون بالكاد نسمع عنهم نجد أسمائهم في المقدمات. وأيضا نجد العنصرية واضحة وضوح الشمس فيما كتب عن عمر البشير وما كتب عن تسيبي ليفني من قبل كونداليزا رايس, وما كتب عن رايس نفسها. لذلك إذا كان عمرو خالد يهتم بالمسلين, لم يكن ليذهب إلى تلك \"المكرمة\".<br />2- عمرو خالد ظاهرة كأي ظاهرة, تصل إلى القمة ثم تندثر: بدأ عمرو خالد قمته في برنامج \"على خطى الحبيب\" وبدأ في الإندثار عندما ترك المصائب التي تحيط بالأمة و اهتم بما يلقى عليه الفلاشات وكاميرات التلفزيون. والدليل على ذلك أنه كان في غاية الاهتمام بصناع الحياة عندما كان مشروعا فريد من نوعه و كانت كل وسائل الإعلام تتكلم عنه , وكان يسافر اخر بلاد العالم, لندن, لحضور افتتاح شركة \" رايت ستارت\" الذي كان يذاع على قنوات الفضائية, ولكن الآن لم يعد يلقي بالا لصناع الحياة ولم يعد يتكلم عنها البتة لأنها أصبحت ظاهرة عامة لا يكترث بها صحفي أو مذيع.<br />3- نموذج عمرو خالد الإسلامي أثبت فشله بجدارة لأنه يأخذ ما يحلو من الإسلام للشباب ويترك الشدة والصعاب بعيدا, بدليل أن شباب صناع الحياة لم يصنعوا شيئا يذكر حتى الآن وقد فات 4 سنوات من المدة الزمنية التي وضعها عمرو خالد لذلك المشروع وذلك لأن شباب عمرو خالد هم ضعاف الإيمان و ما يدل على ذلك هو \" أحمد الفيشاوي\" الذي كان يظهر لنا بالعباءة البيضاء في برنامج \"يلا شباب\" ثم ينصرف إلى هند الحناوي ليلا, وقد شاء الله أن يفضحه حتى يكف عمرو خالد عن قول: \" أحمد الفيشاوي ده نموذج لأي فنان شاب بيحب دينه, يا جماعة ده إن شاء الله هيعمل وهيساوي و....و....<br />4- يعاني عمرو خالد الآن من \"مرض العظمة\" حيث أنه يظن أنه هو حلقة الوصل الوحيدة السليمة بيننا وبين الغرب, والتي يمكن منها بناء مصلى في البيت الأبيض, حيث أنه أصبح على فهم بخفايا التفكير الغربي.<br />أما الكاتب \"مصطفى عاشور\" فلا أريد إلا أن أذكره بالاتي:-<br />1- نحن لسنا في معركة شخصية بل فكرية, و الأمر واضح وضوح الشمس, وهو أن عمرو خالد لا يذهب إلا حيث الفلاشات و الأضواء والدليل الآخر على ذلك هو برنامج \"بك نحيا\". لم يكترث به عمرو خالد كما اكترث ب \"على خطى الحبيب\" لأن الكاميرات لم تسلط عليه, فأصبح الحلقات تعاد مرة واثنان.<br />2- اتهاماتك لحسام تمام ليس لها أي أساس من الصحة وبدلا من أن تبني اتهاماتك على مصادر و معلومات بنيتها على استخدامات و تعبيرات لغوية لتخفي بها حاجاتك إلى دلائل.<br />3- أنت مؤمن تمام بما قاله حسام تمام ولكن نيتك في الدفاع عن عمرو خالد بمبرر أو بدون طغت عليك وإلا ما قلت \" إن لك عتاب على عمرو خالد لإسرافه في الحديث عن نفسه\".<br />4- ما كتبه حسام تمام ليس إلا تأنيب لعمرو خالد وإنما هو نقد بناء ولا أحد يستطيع أن يحكم إذا كان ذلك بالنفي, ولكنك كي تحول رسالة تمام إلى هجوم ذكرت في نهاية مداخلتك أنه دائم التخبط والهجوم على الظاهرة الإسلامية.<br />و أخيرا الشاهد الذي زاد الأمر سواء , البراء أشرف:<br />* مجلة التايم أعطت لأسامة بن لادن مركز من 100 مركز وهو الشخص الذي يرتدي \" الجلباب وحين يتأنق يلبس الجاكيت\" لأنه من الشخصيات المؤثرة , ولكنها لن تعطيها لمحمد حسان لأنهم لو أعطوها له لما جاء للتكريم لأنه يعرف الطريق المستقيم, وبالتالي فهو لا يؤثر على \" الضالين\" الذين لا تملكهم سوى شهوتهم لإرضاء أنفسهم بالظهور للملأ أو في \" الصورة\" على الأقل.<br />* طبعا أنا لم أفهم شيئا من مداخلتك المشفرة التي لا تحمل جديد سوى إعتذار أحمق في اخر المداخلة."
