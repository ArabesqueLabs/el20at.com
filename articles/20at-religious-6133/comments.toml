text = "التعليقات بتتحذف لانها لا تليق بالمعركة الملتهبة بين الاستاذ الفزيع البراء وبين غيره من الاخوة الموجودة صورهم لجوار صورته<br />والذين لم نعرفهم من شدة الضوء الذى تنتجه صورة اخونا البراء<br />انا شخصيا اتحذف لى تعليق<br />على العموم هذا ما عهدناه على الاسلاميين بكافة انواعهم<br />وانا مع عشرينات فى معركته الوهمية<br />واود ان اجد اجابة على سؤالى<br />هل كتب عندكم حسام تمام؟<br />لماذا اذا افتعلتم معركة وهمية"
