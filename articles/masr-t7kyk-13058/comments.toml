text = "ماشاء الله تطلع فتوى بايجاز افطار الاعبين لجلب الفورز لمصر مهم جيل الالفية بقى<br />فى حين ابطال اكتوبر طلعوا الجبهة وحابوا وهما صايمين فى محاربة اليهود ومن اجل استرداد الارض والكرامة<br />مجبتش مثل من ايام الرسول الكريم علية افضل الصلاة والسلام مثلا لان دول ابعد من اننا نشبهم بحالنا ولبعد الفترة الزمنية ولبعد حاجات كتييييييييييييييييييير قوى<br />لا بس برافوا على الازهر والله ماشاء الله بيبيح مايتماشي مع روح العصر<br />ويااااااااااااااااااارب النصر لمصر (فى المشمش)"
