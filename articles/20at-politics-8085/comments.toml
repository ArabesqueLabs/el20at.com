order = 1
subject = "أسأل الله أن يعيد اللحمة إلى شعبنا الحبيب"
author = "فلسطيني وبفتخر"
posted = "2008-02-04"
text = "أسأل الله العلي العظيم أن يعيد اللحمة إلى شعبنا , وأنا أنصح فتح وحماس بأن يتصالحوا خاصة في هذا الوقت , وأن يدوسوا على<br />كل خلافاتهم وأن يبدأوا صفحة جديدة , على فكرة أنا بحب أهل الضفة كتير والله , مع إني مش من أهل الضفة , أنا أصلا من القطاع<br />لكن والله بحب أهل الضفة كتير , والله يخلي فلسطين ويحفظ الفلسطينيين ويهديهم ويصلح بالهم ويرفع عنهم ويرزقهم من حيث<br />لايحتسبون وأن يعوضهم خيرا كثيرا بإذن الله (النصر قادم بإذن الله)"
archived = "2010-03-14"
capture_url = ""
