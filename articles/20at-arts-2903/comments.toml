author = "علا سالم"
posted = "1970-01-01"
text = "ماركيز الرائع الساحر الاتينى يتوقف لتوقف إبداعه هذا هو الأديب يحترم القلم والكلم ،وبعيدا عن تمنياتى فى أن يتراجع عن قراره ألا أن أعظم روايه قرأتها كانت One Hundred Years of Solitude للأسطورة Gabriel García Márquez والتى ستظل عالقة فى رأسى ولن أنسى منها حرفا وإن نسيت من أكون .. و توقعت لصديقى أحمد ندا أن يتحدث عن الأمر لهوسه بالأدب وأتوقع أن يكتب عنه فى الأمد القريب.<br />تحياتى وتمنياتى بالتوفيق"
archived = "2011-07-05"
capture_url = "https://web.archive.org/web/20110705185313/http://www.20at.com/20at/arts/2903.html"

