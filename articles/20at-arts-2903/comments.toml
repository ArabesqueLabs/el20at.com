text = "الموضوع حلو اوي يا ندا..بس خف علينا شوية..كلمنا الكلام السلس بتاع الشيعب ده<br />ان شاء الله هيرجع يا ندا…عشان انت بتحبه هدعيلك…وممكن نعمل اعلان في الجرايد على غرار\"عودي يا بلية\""
