author = "اكتب اسمك هنا"
posted = "1970-01-01"
text = "المقال اكثر من رائع<br />وبصراحة اكتر حاجة عجبتني انك استخدمت الاسلوب الغير مباشر وفي رايي انه الاسلوب الاقوي تاثيرا،ولم تقدم المعلومة مجردة ولكنك حللتها وربطتها بأشياء أخري مما يدل علي ثقافتك الادبية الواسعة<br />تحياتي لك استاذ احمد ندا ودمت في رعاية الله"
archived = "2011-07-05"
capture_url = "https://web.archive.org/web/20110705185313/http://www.20at.com/20at/arts/2903.html"

