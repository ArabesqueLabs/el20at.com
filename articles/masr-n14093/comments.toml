subject = "الف مبروووووووووووووك لمصر"
author = "محمد فتحي"
text = "تتقدم قناة الحافظ بالتهنئة للمصريين جميعا على الفوز الغالي على انجولا وتتمنى ان تصل مصر للمباراة النهائية عبر الفوز على الكوت ديفوار<br />الف مبرووووووووووووووووووووووووووووووووووووووووووووووووووووووووووك"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043932/http://masr.20at.com:80/newArticle.php?sid=14093"

[[comments]]
order = 1
subject = "مبروك على اللي قبضوا"
text = "مبروك على اللي قبضوا يا حبيبي<br />اما الشعب المصري اهبل وعبيط وبيدفع بس يتقاله مبروك على خبتك يا شعب مصر"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043932/http://masr.20at.com:80/newArticle.php?sid=14093"

[[comments]]
order = 2
subject = "مبروك عليك يا ابو تريكااااااااااااااااااااا خد جوائز انت وزملائك من فلوس الشعب"
text = "مبروك عليك يا ابو تريكا وبقية لعيبة الكورة مش كفاية الامن واكل البلد ... لا دا لعيبة الكورة كمان: اقر,ا هذا الخبر علشان خاطر الكويرة يتبسطوا<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />وكشف النائب في سؤال برلماني عاجل عن مهزلة وفضيحة جديدة للوزارة داخل مستشفى التأمين الصحي بحلوان يأتي في مقدمة تلك الفضائح فساد الأجهزة التي يتم الاستعانة بها لفحص المرضى، خاصةً جهاز الصدمات الكهربائية، والذي ثبت بالاستخدام عدم كفاءته؛ حيث أكد الجهاز المركزي للمحاسبات أن هذا الجهاز يعمل لكنه يوجِّه الصدمات الكهربائية للقائم بتشغيله بدلاً من المريض، علاوةً على وجود أدوية منتهية الصلاحية بمستشفى النصر بالمخالفة لقرار وزير الصحة، الذي أكد إعدام جميع الأدوية والمستلزمات الطبية والكواشف المعملية فور انتهاء صلاحيتها، بالإضافة إلى عدم وجود بنك للدم بالمستشفى.<br />ـــــــــــــــــــــــــــــــــــــــــــ<br />يلا بقا اسبكم تشغلوا ابو تريكه وتدولوا جوائز من فلوس الشعب الغلبان"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043932/http://masr.20at.com:80/newArticle.php?sid=14093"

[[comments]]
order = 3
subject = "محمد ابو تريكه ................... ومحمد زيدان"
text = "الناس بتسمي محمد ليه<br />المفروض اسوة بالنبي محمد صلى الله عليه وسلم حتى يطلع الولد مقتديا بخاتم الانبياء والمرسلين صلى الله عليه وسلم<br />دلوقتي بقوا لعيبة كوره يدخل الجون وياخد شقة تمليك من فلوس الشعب ويدخل جون وياخد عربية<br />يعني بأه اسمه محمد علشان خاطر يعيش سفلقه على حساب الشعب الغلبان الكفران<br />اللي الامن المركزي مطلع ميتين اهله"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043932/http://masr.20at.com:80/newArticle.php?sid=14093"

[[comments]]
order = 4
subject = "مبروك يا شعب مصر ....... ابو تريكا جاب جون"
text = "مبروك يا شعب مصر ابو تريكا جاب جون يا شعب مصر يلا بأه شوفوا ابو تريكا بيحبكم ازاي<br />يلا بقا ادفعوا يا شعب مصر فلوس كتير علشان خاطر يسكن في الزمالك ويركب المرسيدس<br />وانتوا خليكم جنب صناديق الزباله فرحانين بابو تريكا<br />ومرضى السرطات والفشل الكلوي ليهم ربنا سبحانه وتعالى"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043932/http://masr.20at.com:80/newArticle.php?sid=14093"

[[comments]]
order = 5
subject = "الحكم تجاهل استفزازات فلا فيلو المتكرره"
text = "ياه دا حكم وحش خالص<br />حكم قليل الادب<br />ازاي يتجاهل استفزازات فلافيلو المتكرره<br />لا ما تزعلوش يا كويره الحكم غلطان وان شاء الله المرة الجاية مش حيتجاهل استفزازات فلافيلو المتكرره<br />وعلى اتحاد الكرة المصرية تقديم احتجاجات شديدة اللهجة الى مجلس الامن الكروي"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043932/http://masr.20at.com:80/newArticle.php?sid=14093"

[[comments]]
order = 6
subject = "العبارة مصر بتغرق يا جماعة ..... نص انت وهو بسرعة"
text = "ابو تريكا جاب جون<br />عمر خالد راح الكنيسة<br />دينا رقصت في الشارع ادام السيما وهيجت الناس<br />الاقباط عايزين امريكا تمنع المعونة<br />حسني مبارك عايز يقلبها ملكية<br />نظيف عمال يبيع في ممتلكات الدولة<br />الامن المركزي عمال يقفل في الشوارع<br />العبارة مصر بتغرق يا جماعة<br />نط يا ض انت وهو بسرعة في الميه قبل ما تغرق...."
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043932/http://masr.20at.com:80/newArticle.php?sid=14093"
