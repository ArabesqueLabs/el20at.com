subject = "هل تعرف ان جميع الناس او اغلبيتهم فى جميع الدول ال"
author = "مواطن"
posted = "2008-06-22"
text = "لو كان عندنا اعلام محترم<br />لماذا لم تذاع حلقات هيكل على فضائية مصرية<br />الراجل يقول التاريخ من وجهة نظرة هو ونحن نحترم رأية - واى واحد تانى يقول رأية بلا اسفاف برضة نحترمة<br />لماذا لا نتعلم احترام رأى الاخر حتى ولو كان مخالف لنا<br />المصريون للاسف يتفرجون على اخبار قناة الجزيرة فى كل بيوتهم<br />واللى عايز يتابع اخبار الراقصات والالبومات الغنائية ومصر بتتقدم بيهم يتفرج على التخلف فى القنوات المصرية"
