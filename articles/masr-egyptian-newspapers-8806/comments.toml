[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-04-17"
text = "نعم الاسلام هو الحل ولكن كيف ؟<br />فى تطبيق العدل اولا ولاعدل فى كل شيئ واولها توزيع الثروة ,<br />فلو تم تطبيق قيم الاسلام السمحة فى هذة الظروف لنجونا ونجي الجميع مما يحاد لنا .<br />العدل التسامح التكافل المساواة احترام الاخرين كلها اشياء من الدين الاسلامي لو تم تطبيقها لتغيرت الاحوال ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "الي حنفي نوكيا"
author = "مفكر حر"
posted = "2008-04-17"
text = "ماذا تعلم حتى تقسم ان الأسلام هو الحل؟ ثم الحل لماذا؟ لنقص الموارد التي تهدد مصر بمجاعة قريبا لندرة المياه؟ ام الحل للحاق بركب التطور العلمي الذي تشهده الدول غير المسلمة؟ حتى الدول المسلمة التي بها تطور علمي مثل ماليزيا يحتكر هذا التطور غير المسلمون من الشعب (40% صينيين). ارجو ان تدرس جيداً حالة الدول التي طبقت مصطلح الأسلام هو الحل مثل ايران، افغانستان، قطاع غزة، السودان (والذي اشرف على الأنفصال بسبب رفض الجنوبيين لتطبيق الشريعة). الأسلام ليس الحل، الحل في نظام علماني يحمي الحريات الدينية للجميع ويمنع فرض المعتقدات وتطبيقها بالقوة، ويتبنى النهضة العلمية والشفافية ومحاربة الفساد طريقاً للنهضة."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "إلى من يظن نفسه مفكرا"
author = "طيف بدر"
posted = "2008-04-17"
text = "من أين أتيت بأن من حمل لواءالنهضة العلمية في ماليزيا هم غير المسلمين ؟ أعطني كلاما موثقا ... هل الجامعة الإسلامية في ماليزيا لم تساهم في هذه النهضة ؟<br />أما عن إيران فتقدمها العلمي و التقني و لا سيما في مجالات البحوث الذرية و البيولجية فهي واضحة كوضوح الشمس... كفاني أن أقول أن مصر اليوم تركب سيارات إيرانية ؟<br />و أخيرا أتنكر أن الإسلام هو الذي قدم الفارابي و ابن الهيثم و النهضة العلمية الأندلسية التي بعثت أوربا من ثباتها و لكن لما ظهر أمثالك من الذين اعطوا ظهرهم للإسلام و حكموا هواهم تقهقرنا ؟<br />حقا لا تعمى الأبصار و لكن تعمى البصيرة<br />http://alayasser.maktoobblog.com/666018/ماذا_قدموا_؟_و_ماذا_علينا_؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "الاسلام هو الحل لشعب تسعة اعشار ة مسلمين  من الاخو"
author = "حنفى نوكيا"
posted = "2008-04-21"
text = "الاسلام هوالحل لشعب معظمة مسلم ومضيع طريقة فى الزراعة والصناعات الثقيلة والتكنولوجية مع العلم انة الكفاءت والخبراء والعلماء عندنا كتير بس للاسف الفرصة رايحة لناس غيرهم مش مؤهلة ودة سبب تخلفنا عن الامم التانية \\ اناعاوز حد يفهمنى ازاى لغاية دلوقتى واحنا بلد بيجرى فية نيل من اولة لاخرة ومعندناش اكتفاء ذاتى من القمح والسلع الاستراتيجية ولافالحين نصدر كنتلوب وشوية بكش علشان نرجع ونشترى بيهم قمح \\ الاسلام هو الحل والعلاج لمستقبل مصر"
archived = "2010-03-14"
