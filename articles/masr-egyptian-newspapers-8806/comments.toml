subject = "الحكومة وحكمها على قيادات الاخوان زى اللى بتدعوهم"
author = "حنفى نوكيا"
posted = "2008-04-17"
text = "اقسم برب السموات السبع ان الاسلام هو الحل واللة الذى لاالة الاهو ان الاسلام هو الحل اللهم اجعل سجن عبدك الفقير اليك خيرت الشاطر واخوانة كافة من المعتقلين ظلما وجورا نقمة على من ظلمهم ياحى ياقيوم اللهم وادر علية الدوائر اللهم وارنا فية عجائب قدرتك انك سميع مجيب الدعاء ايها الاخوة والاخوات الدعاء ان اللة سبحانة وتعالى يقول ادعونى استجب لكم"
