[[comments]]
order = 2
subject = "جميل يا عجم"
author = "نيفين نيفى نوفا"
posted = "2007-02-13"
text = "الموضوع حلو يا عجم و اللى احلى اختيارك لقصيده الصلوات<br />غكرتنا بالروائع<br />بس انا ازعم ان اجمل قصيده منذ بدايه الشعر العاظفى هى قصيده الحصرى اللى مطلعها:<br />يا ليل الصب متى غده<br />اقيام الساعه موعده<br />رقد السمار فارقه<br />اسف للبين يردده<br />و اللى عمل شوقى على غرارها:مضناك جفاه مرقده<br />و بكاه ورحم عوده<br />و اللى متقلش عنها روعه<br />و فيه حاجات سعاد الصباح و كامل الشناوى<br />و اكيد نزار<br />الموضوع جميل يا عجم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "عادى"
author = "آيه- السويس."
posted = "2007-02-13"
text = "الموضوع عادى جدا ومفيهوش اى حاجه غريبه علينا وعموما انا من رأيى ( ان هناك مشاعر تقال وهناك مشاعر تتسرب الينا من دون كلمه واحده واحيانا تكون الثانيه هى الاصدق) فنصيحه منى بلاش كلمة (بحبك ) كل شويه من غير اى داعى."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "هو لازم عنوان يعني؟ إيه الغتاتة دي؟ مش كفاية ام ال"
author = "معاذ محمود عامر"
posted = "2007-02-14"
text = "لأا موضوع لذيذ فعلا<br />بجد يعني<br />أنا شخصيا لما أجي أهدي حبيبتي كلمات من قصيدة هاختارلها المقاطع الأربعة الأولى من قصيدة أحلام الفارس القديم للأستاذ صلاح عبدالصبور أو يمكن كمان أكتفي بالمقطع ده<br />لو أننا كنا بشط البحر موجتين<br />صفيتا من الرمال والمحار<br />توجتا سبيكة من النهار والزبد<br />أسلمتا العنان للتيار<br />يدفعنا من مهدنا للحدنا معا<br />في مشية راقصة مدندنة<br />تشربنا سحابة رقيقة<br />تذوب تحت ثغر شمس حلوة رفيقة<br />ثم نعود موجتين توأمين<br />أسلمتا العنان للتيار<br />في دورة إلى الأبد<br />من البحار للسماء<br />من السماء للبحار"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "ليس للحب عيد"
author = "طارق ابو عبد اللهِ"
posted = "2008-08-21"
text = "جميل جداً ان يكتب الانسان لمن يحب ومن المحزن ان يضع لهذه الكتابة يومًا معيناً .<br />ألا تعلم يا صاح أن نظرة المحب لمن أحب تفوق كتاب كلمات .<br />أم انك لست تدرِ أن بسمة المحب لمن أحب تعادل كل الهدايا في كل الاوقات ."
archived = "2010-03-14"
