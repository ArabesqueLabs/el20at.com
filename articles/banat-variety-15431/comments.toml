text = "حلو اوى بس عارفه يزيد من صعوبة الموقف لما تبئى انتى مجبره على كدا يعنى انا شفت الدكتوره لما جاتلنا البيت علشان اختى الكبيره كنت انا فى 5 إبتدائى وسمعتها وهى بتصرخ اترعبت اوى وبعدين خالتو جاتلى الاوضه وئالتلى تعالى كنت سمعت مامتى بتئول انوا انا كمان وبعدين رجعت فى كلامها ئالت لما تكبر شويه وبعدين الدكتوره بصتلى كده ومشيت بجد الدكتوره دى لما بشفها بحس ناحيتها بحاجز نفسى فظيع وببئا عايزه ائلها ياغبيه<br />بس عارفه كمان لما رحت انا الصف الثالث اعدادى كنت فهمت شويه وكنت عارفه مامتى غلطانه واهلى بس كنت ئلت مش هتعرفى تعملى حاجه لوحدك ومش عرفت اجيب حد يقنعهم مكانى وبعدين مامتى اخدتنى ورحنا للدكتور وبعدين هو حطلى مخدر وبعدين عمل الى عمله بئا وبعدين طبعاً حسيت بألم بس مش اوى علشان المخدر عارفه زى الى تكونى بتعملى باديكير وفيه جلد مغطى ظفرك ميت وبتئصيه وشويه بعد لما حطلى المطهر وطبعاً حطلى لزق طبى علشان مش يكون فى تلوث افتكرت اختى واد ايه<br />تعبت<br />يلا بينا نئول<br />حرام نعمل فى بناتنا كده<br />ميرسى ياقمرات فضفضنا شويه سوا"
