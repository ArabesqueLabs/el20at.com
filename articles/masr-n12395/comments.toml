[[comments]]
order = 0
subject = "ضع عنوان التعليق"
text = "هو انتو مصادركو الوحيدة في الطب النفسي د.محمد المهدي و كتور أحمد عبد الله وبس؟ يعني انتو مبتاخدوش غير دكاترة اسلام أون لاين علشان توفروا؟ ايه الكسل ده ؟"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113113732/http://masr.20at.com:80/newArticle.php?sid=12395"

[[comments]]
order = 1
subject = "فيه واحد بيدور على شقة"
author = "صاحب صاحبه"
text = "فيه واحد اعرفه بليدور على شقة بقالة فترة علشان هو مش من هنا<br />تقترح يا عماد بك ممكن ياخد شقة فين بمناسبة موضوعك الهايل ده<br />ارجوك لا تاخذ الموضوع بشكل شخصي<br />بس الموضوع تحفة يا عمدة أشاوس وطب يا خويا روح اكتب"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113113732/http://masr.20at.com:80/newArticle.php?sid=12395"

[[comments]]
order = 2
subject = "فبركة"
author = "محمد حسن"
text = "مع إحترامي الموضوع مفبرك<br />عمر ما الفشل في الحياة الدراسية او كده يؤدي للجنون وفقدان العقل ، قد يؤدي إلى إكتئاب شديد ورغبة في ترك الحياة وما إلى ذلك لكن المرض العقلي اسبابه تختلف تماما عن المرض النفسي<br />المكتئب اياً كانت درجة إكتئابه لا يفقد عقله ، ولا يفعل الأشياء العبيطة اللي ذكرها كاتب المقال ، لكن الجنون او امراض العقل نتيجة لخلل في كيمياء المخ وافرازاته<br />رجاء بلاش فبركة"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113113732/http://masr.20at.com:80/newArticle.php?sid=12395"

[[comments]]
order = 3
subject = "للأخ محمد حسن"
author = "واحد"
text = "الاخ محمد حسن رجاء انت الاول اذهب لمستشفى الامراض النفيسة وتأكد بنفسك أولا ثم ادعي إدعاءاتك<br />ومن الظلم أن نطق أحكام على أشياء لا نعرف عنها شيئا وكلها مجرد ظنون وتخمينات عقلك<br />احترم الاخرين لكي تجبرهم على احترامك"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113113732/http://masr.20at.com:80/newArticle.php?sid=12395"

[[comments]]
order = 4
subject = "..."
author = "..."
text = "حلو اوي والله الموضوع وفكرته حلوه اوى يا استاذ عماد ومتحطش في بالك كلام المجانين اللى زي ما انت شفتهم في المصحه فهم برضو موجودين في المعلقين الظرفاء المملين دول ويا ريت متبطلش كتابة ومتبعدش كتير ربنا يوفقك"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113113732/http://masr.20at.com:80/newArticle.php?sid=12395"

[[comments]]
order = 5
subject = "يا جهلة"
author = "محمد حسن"
text = "السادة الجهلة اللي معلقين فوق ده كلام قائم عن معرفة وعن متابعة للمرض النفسي ، فبطلوا تستهبلوا ، وإن كنت اظنكم المفبرك اللي فوق كاتب المقال فوق ، شتان يا اغبياء بين المرض النفسي والمرض العقلي"
archived = "2008-01-13"
capture_url = "https://web.archive.org/web/20080113040256/http://masr.20at.com:80/newArticle.php?sid=12395"

[[comments]]
order = 6
subject = "يا أهبل يا محمد يا حسن"
author = "برضوا"
text = "والله يا محمد حسن ما في أجهل منك ، بس انا مصدقك لما بتقول ان كلامك عن متابعة للطب النفسي علشان انت اكيد بتتعالج عن طبيب نفسي يا مجنون يا متخلف يا جاهل"
archived = "2008-01-13"
capture_url = "https://web.archive.org/web/20080113040256/http://masr.20at.com:80/newArticle.php?sid=12395"
