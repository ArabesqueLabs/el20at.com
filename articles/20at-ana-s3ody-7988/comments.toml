subject = "لا حول ولا قوة إلا بالله"
author = "سعاد"
posted = "2008-01-10"
text = "للأسف مجال المرأة السعودية محصور وضيق جداً وبيعتمد على شروط بغض النظر عن حالاتها المادية<br />دا اللي خلى المفترشات يتوسعوا بالظاهر دي أملاً في إيجاد دخل يساعدهم .. ويمكن لو ما كتشفوها .. كان حيكونوا متسولات"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "وهناك ماهوه أسواء"
author = "خالد المطرفي"
posted = "2008-01-10"
text = "ملامح الصوره تصف تعبير الحال .. والواقع اشد مرارة من عرض المقال<br />مثل هؤلاء نجدهم مراراوتكرار .. ولكن من ينقال حالهم واحوالهم<br />الكل ينظر الينا من الخارج اننا اغنياء ...!<br />وفي الداخل ننظر إلي انفسنا اغنياء من التعفف<br />طرح يلامس الوجه الأخر من جراح مجتمعنا الغامضه تحت ستار الثراء<br />ويضمدها لا بمساعده ... و لا بمال انما بيدٍ تنقل الحال وعين تصوره<br />وقلب يخشي الله فينظر لنفسه كأنه في حالهم فلا يأبي السكوت الا بطرح قضيتهم<br />آنسة زين العلوي<br />القلم هو ذاته بين يديك<br />والعين هي عين الواقع<br />والقلب هو ذاك الذي يخشى الله<br />شكرا لك"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "وماذا لو000"
author = "كاسترو"
posted = "2008-01-11"
text = "عمل شريف يحفظ لها كرامتها وماء وجهها ويظمن لقمه دافئه في بطون الصغار في ليالي الشتاء او اسباغ ماء بارد في صدورهم في نهار يوم قائض 0<br />اني لا ارى هاؤلا النسوه الا عصاميات مكافحات صامدات في وجه تقلابات الزمن كفانا الله وأياكم شر الزمن اذا تقلب 0<br />اروع ملاحم الاصرار والتحدي تتجلى في تلكم النسوه<br />كم هن رائعات<br />وما اروع ما عملتي استاذه زين العلوي"
archived = "2010-03-14"
capture_url = ""
