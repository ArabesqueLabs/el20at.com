subject = "متبقوش انتو والبلد علينا"
author = "بسلة مسلمة مصرية"
posted = "2007-03-06"
text = "نداء على جميع اعضاء الجمعية . يا ريت تفعلوا دوركم وتنشروا مبادئكم وتبدئو فى نشاطكم بقى عشا نستفيد منكم .<br />اذكر حديث للرسول عليه الصلاة والسلام قال فية ( من سؤل عن علم فكتمة ألجم بلجام من نار يوم القيامة ) فاختاروا يا اعضاء جمعية منسا .<br />ولنا الله بنى ادم ...........لا الله بنى ادم ...................لنا الله بنى ادم ."
