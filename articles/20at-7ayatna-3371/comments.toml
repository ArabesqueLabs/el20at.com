[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "المحرر"
posted = "2007-03-08"
text = ".. من المعروف أن متوسط الذكاء العادي والطبيعي يتراوح بين 90 إلى 110 درجات حسب تصنيف عالم النفس (تيرمان)، وهذا الهامش يندرج تحته معظم الناس ويشكل القطاع الأكبر في أي مجتمع، أما أقل من ذلك فيأتي قليل الذكاء بين 90 - 70 درجة، ثم المتخلف والمعتوه دون الـ 70 درجة.. .أما أكثر من ذلك فيعد ذكياً من يحصل على هامش 110 - 120 درجة، وذكياً جداً حين يحصل على هامش 120 140 _درجة، وعبقرياً إذا حصل على أكثر من 140 درجة _وهي الدرجة المؤهلة للانضمام إلى<br />منسا ."
archived = "2010-03-14"
