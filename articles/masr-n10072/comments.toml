subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
posted = "2007-05-06"
text = "الافكار ليها اجنحه محدش يقدر يمنعها توصل للناس<br />الكلمه دى اتقالت ف فيلم المصير<br />و متهيالى افضل شىء يحصل لاى مبدع لما افكاره سواء ليها قيمه او حتى تافهه توصل لاكبر عدد من الناس<br />و ساعات كتيره بيبقى تفاهه العمل الابداعى سر من اسرار انتشاره و اعجاب الناس بيه و الامثله كتيره على اعمال تافهه و حبيناها و هنفضل نحبها<br />بالمناسبه شكرا جزيلا يا اميره على القصيده<br />حلوه بجد"
