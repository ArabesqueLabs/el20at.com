[[comments]]
order = 4
subject = "الى زخاري"
author = "اكتب اسمك هنا"
posted = "2008-09-10"
text = "اللي بيحب رمضان ينطق الشهادتين<br />ويقول اشهد ان لا اله الا الله واشهد ان سيدنا محمد رسول الله واشهد ان سيدنا عيسى عبدالله ورسوله<br />خلاف ذلك يبقى انت ما لكش علاقة برمضان<br />واذا ايقنت بالشهادة عاليه<br />تقيم الصلاة وتؤتي الزكاه<br />يعني تلت حاجات قبل رمضان<br />الشهادتين<br />الصلاة<br />الزكاه<br />ربنا يهديك وتسلم يا زخاري<br />اسلم يا زخاري وما تخفش<br />اسلم وتوكل على الله طالما بتجب رمضان يبقى ما تضيعش وقتك اسلم يا زخاري انا اعرف مسيحيين كثير اسلموا<br />اسلم يازخاري قبل ما تضيع الفرصة منك ويجيك ملك المؤت"
archived = "2010-03-14"
capture_url = ""

