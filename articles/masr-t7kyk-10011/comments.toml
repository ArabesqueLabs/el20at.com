[[comments]]
order = 2
subject = "بنحبك يا رمضان رغم انف الاعداء طول عمرك شهر كريم"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-06"
text = "انها ليست ازمة اقتصادية او اى شيئىء؟<br />انها ازمة ادارة و ترتيب و تنظيم مصاريف البيت؟ ليس الا!<br />و تنظيم كيف يكون تناول الغذاء الصحى خيرا من ملئء البطون دون داع؟<br />(جوعوا تصحوا) يعنى بالعربى الفصيح انتظموا و اقتصدوا و اعتدلوا فى الاكل و المشرب و الكساء<br />و برضة بنحبك و هنحبك يا رمضان<br />و كل عام و الجميع طيب و بخير<br />كل سنة و انتم طيبين<br />رمضان كريم ابن كريم"
archived = "2010-03-14"
capture_url = ""

