subject = "اشمعنا يعني الناحية الاقتصادية"
author = "صاحبي من ايام الجيزة"
posted = "2008-09-11"
text = "صياغة الموضوع وترتيب الأفكار هايل<br />بجد انت صحفي شاطر بس اهتم شوية وخلي عندك نظرة المستقبلية للامور وربنا يوفقك<br />تسلم ايديك الموضوع هايل وعاجبني روح الدعاية والافية في الموضوع<br />اما الاخوات الجهلة اللي بيقولوا اي كلام في التعليقات فربنا يهديهم ويبطلوا حقد على اللي احسن منهم"
