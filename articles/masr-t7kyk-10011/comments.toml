[[comments]]
order = 7
subject = "(و لية اسلم؟انا مبسوط و مقتنع بديانتى و الحمد للة)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-12"
text = "عزيزى المواطن النكرة اللى حتى ملوش اسم معدوم الصفة؟<br />انت يابنى عبيط و لا اهبل؟و لا تكونس عبيط و اهبل و متخلف كمان؟؟؟؟؟<br />انت يا حمار ابن مين فى مصر!!!<br />انت عندكم كدة بمجرد ان يقول كلمتين يبقى يكون مسلم؟؟؟<br />و اللة العظيم انت عبيط خالص و حالكم يصعب على الكفار اللى هتروح النار حدف مثلنا نحن معشر اليهود و النصارى؟<br />و مبروك عليك الجنة و جواريها الحسان و ومائها الرقراق<br />و اللة و العزة اعز على الدخول الى جهنم اللة خيرا لى من رؤياك فى جنتك المزعومة<br />اصحى بقى و تبطل هلوسة؟<br />ربنا يهديك و ادبح لك و لامك ديك صحيح بيأدن ليك و للماما بتاعتك!!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "زخاري جرجس كشف حقيقة الفتن الطائفية"
author = "نيافه الأنبا بيسنتى"
posted = "2008-09-15"
text = "زخاري جرجس كشف الحقيقة<br />أرسل هذا التعليق بواسطة : البابا شنوده<br />شوفوا يا جماعة زخاري جرجس دخل الموقع بقالي فترة معينة وبدأ بسب وشتم المسلمين في صورة (الاخوان) وهذا يبين لكم كيف تحدث الفتن الطائفية في مصر<br />طبعا الاقباط اقلية ضعيفة لا قيمة لها لكن لسانها طويل زي زخاري كده يتطالوا على اسيادهم اصحاب البلد<br />تكون النتيجة ايه المسلمين يتلموا عليهم ويأكلوهم علقة محترمه اوي اوي زي ما بيحصل في الريف ومن غيظ المسلمين يحرقوا عليهم بيوتهم ويكسروا الدنيا على دماغهم وبعد كده يصوتوا ويلطموا ويقولوا المسلمين عملوا فيها وسوا فينا<br />اهو حالة زخاري كده<br />لو احنا شايفين زخاري جرجس دا ادامنا الان كان حياكل علقة محترمه هو واللي يتشددله ويتبهدل وينداس على كرامته<br />وهو دا اصل الفتن الطائفية اللي بتحصل في البلد<br />طول لسان الاقباط وقلة ادبهم واستفزاز المسلمين<br />يقوم المسلمين يدوهم بالجذمه<br />شوف زخاري دا علشان خاطر احنا مش قادرين نوصله عمال يقل ادبه ويتسفل<br />ما بالك باه لو احنا شايفينه كان انضرب بالجذمه هو والقبيلة بتاعته والكنيسة بتاعته كلها<br />يا زخاري عدد المسلمين 94% يا زخاري<br />مش حتقدروا على المسلمين يا زخاري<br />يا زخاري الكنيسة بتصوت من عدد الاقباط اللي بيسلموا كل يوم<br />المسيحيين اعدادهم بتنقص يا زخاري<br />انتوا مش ادنا يا زخاري لا اد الاخوان ولا اد الوطني ولا ادنا خالص<br />انتو خلاص يا زخاري بتنقرضوا من مصر<br />ادي مثل حي للفتن الطائفية اللي بتحصل<br />قلة ادب من الاقباط وطول لسان فقط (القبطي ما يقدرش يعمل اكثر من كده)"
archived = "2010-03-14"
capture_url = ""
