author = "أسامة"
posted = "2008-06-05"
text = "لا تفووت خميسك ولو تبيع قميصك..مثل سوداني ولكني أجيب على سؤال كاتبنا الرشيق..<br />يوم الخميس يعني فرصة ثمينة لصلة الرحم .<br />مساء الخميس (ليلة الجمعة) تعني ليلة مباركة .<br />ويعني تغيير من روتين بقية ايام الأسبوع<br />وينشد صاحب الكسرات الزميل دلمبخ قائلا:<br />وإن أتى الخميس****كأنني عريس<br />أما بيوم الجمعة ****تسيل مني دمعة<br />لفقدي الإجازة****غدوت كالجنازة"
