subject = "انتبه"
author = "عبدالله أبوبلال"
posted = "2008-06-05"
text = "الكلام السابق على العين والراس ومن طبيعة البشر أن يروحوا عن أنفسهم بعد( العمل والتعب ) ... لكن أنا أسأل سؤال وأريد الجميع يجاوبه بينه وبين نفسه بكل صراحة : إذا لم يمتلئ أسبوعك بالعمل والجد والاجتهاد هل ستستمتع بخميسك ؟ للأسف الكثير منا خميسه طوال الأسبوع ، كل يوم يعتبر خميس لأن مليئة بـ ( الونسة والترفيه ) بالتالي يـا ( حبايب ) استغلوا أوقاتكم في الأسبوع بالجد سواء في الدراسة أو في العمل ، عندها سيكون كل خميس أجمل من الذي قبله .<br />أتمنى للجميع حياة حلوة وسعيدة ."
archived = "2010-03-14"
