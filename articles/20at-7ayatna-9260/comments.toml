text = "الخميس هو الونيس من باقي أيام الأسبوع، يبدأ من الصباح الجميل بنصف داوم مريح جعل الله كل الأيام نصف داوم، و ينتصف الخميس نشاط أو برنامج إجتماعي مع الشباب جعل الله كل الأيام أنشطة و برامج اجتماعية، وينتهي الخميس بجلسة حميمة مع الأهل، جعل الله كل الأيام جلسات حميمة مع الأهل. و دمتم سالمين و جعل الله أيامك عامرة بالخير و الطاعة."
