text = "عادة ما تكون ليلة الخميس ليلة ( فضاوة) لأنها تسبق يوم العيد الأسبوعي الجمعة.<br />أنا أقترح أن تكون هناك طلعات مرتبة ومنظمة ومجدولة وتكون مفيدة بالطبع .<br />ومهما كان موضوع الطلعة فلن تخلو من (الوناسة).<br />أهم شيء لا تنعسوا في خطبة الجمعة .<br />والسلام"
