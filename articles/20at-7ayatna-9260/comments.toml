[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-06-05"
text = "الخميس يعني لنا الشيء الكثير فهو اليوم الذي ينتظره كل شخص في نهاية كل اسبوع ليكون يوم الانجازات حيث يجد الشخص فيه مساحة من الوقت ليضع له خطة متنوعة يستمتع فيها بوقته ويضيف شيئا جديدا لحياته وينجز عملا يكون له اثره ويرسم الفرحة والبسمة على شفاه اهله واطفاله وقد يكون فرصة لتلاقي الاهل والارحام في زمن تقطعت فيه الروابط من خلال رحلة عائلية تجمع الأهل والأحباب كم أنه فرصة للقراءة والاطلاع او احياء ليلة الجمعة المباركة بذكر الله والصلاة على رسول الله صلى الله عليه وسلم او زيارة بيت الله<br />ما أجمل أن تتنوع خميساتنا بين يرامج فيه المتعة والترفيه والعمل والانجاز والتمية والتطوير وزيادة الصلاة برب هذا اليوم واذكر فأقول لن تزولا قدما عبد يوم القيامه حتى يسأل عن عمره فيما أفناه وعن شبابه فيما أبلاه فلننظر لأعمارنا وأوقاتنا أين نقضيها ."
archived = "2010-03-14"
capture_url = ""

