text = "السلام عليكم اخويا علي والله الله يوفقك لانك اخترت موضوع جيد جدا لنا الشباب والله نحنى في الحاره نقول خميسك ونيسك فلازم طلعه كل خميس طلعه لانه هو يعتبر يوم الاجازه العربي المدارس اجازه والموضفين اجازه هو يوم الاجازه فلازم طلعه مزبوطه لين صلاه الفجر وبعدين هو يوم في الاسبوع الشباب يتجمعوا فيه ويطلعوا ويفلوا والله يوفقك و تكون اعلامي خطير وناجح لانك ماشاء الله تختار مواضيع حلو جدا .... والسلام عليكم"
