subject = "جميلة ولكن ينقصها القليل الحبكة .."
author = "محمد نواف الحمدالله ..."
posted = "2007-12-09"
text = "رائعة هذا البوح .. مكتملة فيه جميع عناصر البناء الفني .. ولكن ينقص هذا البوح القليل من الحبكة الفنية التي لها أثر كبير في دقة المعنى والكلام المكتوب للقارئ قبل السامع .. ولكنها بحق جميلة جداً، أهنئ كاتبتها .<br />وإلى الأمام .. وبالتوفيق والنجاح ،،،"
