subject = "رجال بلطجية الدولة"
author = "ashraf hasan"
posted = "2009-03-03"
text = "شىء غريب فعلا أن يعتبر هؤلاء ( رجال أمن الدولة ) أن مهمتهم هى الحفاظ على أمن البلد بالرغم من أن كل تصرفاتهم و آلياتهم تتعارض فى معظم الأحوال مع القانون نفسه , و تتشابه و تتطابق مع أعمال البلطجة و فرض القوة !!!<br />سؤال ...<br />هل يقوم رجال الأمن بتنفيذ القانون ؟<br />أم يقومون بتنفيذ الأوامر ؟<br />عن \" عبد المأمور \" نتحدث ...... عفوا ..... أقصد عن \" العبيد \" نتحدث"
