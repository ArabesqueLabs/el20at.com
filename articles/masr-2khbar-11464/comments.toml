[[comments]]
order = 1
subject = "ولزمتة اية الاضراب من اصلة"
author = "مصرى"
posted = "2009-03-03"
text = "يا جماعة الخير هتعملوا اضراب لية - هتقدروا تعملوا اية<br />صدقونى ولا حاجة<br />مفيش فايدة<br />هما ضباط امن الدولة دول مش مصريين برضة والا من بلد تانية وتهمهم مصر - يبقى خلاص<br />ريحوا نفسكم<br />هى كانت بلد ابوكم لوحدكم<br />ان شاء اللة تولع والا تروح فى داهية - انتم مال اهاليكم - انتم هتعرفوا اكتر من بتوع امن الدولة<br />اذن فلا داعى للاضرابات ويتبعها اعتقالات والنتيجة صفر<br />كل واحد يظل فى حالة ويهتم بنفسة ويسيب الامر لربنا -<br />وعزرائيل احيانا ياتى بحلول لكل المشاكل<br />هدوء يا شباب"
archived = "2010-03-14"
capture_url = ""

