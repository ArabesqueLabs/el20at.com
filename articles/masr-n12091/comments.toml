subject = "لعبة قديمة"
author = "ابو العريف"
posted = "2007-10-25"
text = "دى يا استاذ لعبة قديمة قوى وبتتعمل مع جميع الانظمة والحكومات فى مصر<br />كلما وقعنا فى ازمة اقتصادية او زاد الغلاء على الناس وضجوا من عدم قدرتهم على الشراء<br />يطلع لنا مبشر الخير وزير البترول يقول لنا اسكتوا اكتشفنا بترول وحقول وخزان تحت الارض والخير جاى والفلوس هتبقى زى الرز ومش هنعرف نعمل بيها اية وانسوا اللى انتم فية وفكروا هنصرف فلوس البترول اللى اكتشفناة دة فى اية وكل واحد يسرح فى احلامة زى ماهو عايز<br />دى لعبة علم النفس<br />تروح لشخص معدم مش لاقى علبة سجاير يعدل مزاجة يقعد قدام واحدة بتضرب الرمل وتوشوش الودع وتقل لة يا بختك خير كتير قوى جاى لك فلوس ملهاش عدد وهتعيش فى هدوم حرير وقصر ولا قصر التين<br />وهيمشى قدامك موتوسيكلات<br />ياعم الوزير يارسم بسمة الامل بوهم كذاب روح يا شيخ اللة يصلح حالك ويصلح حالنا وابقى شارك فى كتابة البخت بتاع الاهرام وابقى اعطى امل لمواليد برج الحمار او البقرة الضاحكة"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027143717/http://masr.20at.com:80/newArticle.php?sid=12091"
