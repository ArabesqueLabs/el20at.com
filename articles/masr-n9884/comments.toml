subject = "قلولي بتحب مصر قلت مش عارف"
author = "هووووووووبه"
posted = "2007-04-28"
text = "معلش انا ابويا بيحب مصر موووووووووووووووووت وراح من نيويورك لواشنطن امبارح عشان المظاهره اللي هناك كان نفسي ابقي هناك بس هل معني كل الللي يسيب البلد يبقي بكرها لا طبعا , انا بعشق مصر عشق رهيييييييييب وبكرها كره رهيب علي العموم قلولي بتحب مصر قلت مش عارف لا عارفه دلوقتي لما ابويا كان بيموت وملقاش علاج في مصر وهاجر واتعالج ببلاش علي الرغم من انه مش ابن البلد دي , علي العموم سمعنا شعر كتير عن حب مصر وقصص وحبنها فيها ايه لما نهاجر نشرف بلدنا واللي يبقي دكتور واليي مدرس عربي فيها ايه سافر ياعم ابراهيم , الحكايه اكبر من بنت لعوب او امراه عاهره حلوه عاهره دي الموضوع دا رزززززززززززززززق وسلام يا عم ابراهيم ."
archived = "2007-04-29"
