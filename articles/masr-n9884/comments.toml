order = 1
subject = "قلولي بتحب مصر قلت مش عارف    ( فعلا مش عارف )"
author = "عاشق لارضها وبرضه بكرها"
posted = "2008-01-06"
text = "مش عارف ادا اكتب ازاى اول مرة اكتب انما عشق مصر ماله حدود انا مغترب ومش عايز ارجعلها عشت مع جنسيات عربيه كتيرة كلهم يتمنو يزورو مصر لان مصر كانت ام الدنيا ( كانت ) انا زى هوبوووووبه بحبها بعشقها بعشق ترابها ونيلها بعشق شعبها بعشق القعده على النيل وقت الغروب بعشق شوارعها وزحمتها تعبها مشاكلها انما بحزن عليها لما تشوف حالها اه بقينا تابعين كنا الكبير والكبير لما بيقع بيطلع صبيانه يدعسوه انتهينا بس لسه الامل موجود مصر مالهاش نهايه اكيد فى يوم هاتثور مستحيل تفضل نايمه للابد بجد مش عارف اقول ايه لما بشوف اخبارها على التليفزرون بيكون نفسى ابكى مش هى دى البلد متغرب من 5 سنين ومش عايز ارجع مش بكرها بس عايز تفضل صورتها جوايا الصورة الى بحبها فيها خايف لو رجعت اكرها مافيش ارض فى الدنيا زى ارضها فين تلاقى مكان ترتاح غير ارضها عارفين نفسى فى ساعه جنب مقام السيدة زى زمان اشكيلها همى وتعبى فى حاجات فى مصر مايعرفهاش غير المصريين ليها طعم ولون ليها ريحه نفسى ارجع بلدى بس خايف مش عارف اكمل بس اعتقد كلامى وصل مش هاقول الحل لان الحل اكيد موجود وفى يوم هايكون تترد فيه المظالم مصرى كاره مصر"
archived = "2010-03-14"
