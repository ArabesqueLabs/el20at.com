author = "باب زويلة"
posted = "2010-02-23"
text = "خرج الجيش المصرى لقتال العثمانيين وصدهم فى الشمال تحت قيادة الغورى وكان الجيش المصرى بضباطة المماليك يعتمد على الفرسان والكر والفر بينما جيش العثمانيين يعتمد على المدفعية التى لا يعرفها المصريين<br />وتركوا ضابط مملوك ليدافع عن القاهرة ان حدث مكروة للجيش وكان مع هذا الضابط قوة صغيرة تحمى القاهرة<br />هزم الجيش المصرى وقتل قائدة تحت سنابك الخيل ووصلت طلائع الجيش العثمانى الى القاهرة - وخرج الضابط الذى ليس مصريا ولا من اصول مصرية ليدافع عن القاهرة باستبسال لان مصر علمتة الدين وعلمتة العسكرية والقتال واصبحت وطنا لة - لم يسلم القاهرة للاتراك ويخون المصريين - قاتل حتى اخر طلقة واخر رجل وتم القبض علية وحكم علية بالشنق وتعليق جثتة على باب زويلة 3 ايام<br />باب زويلة - مشنقة طومان باى - تاريخ طويل"
