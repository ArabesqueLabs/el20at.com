subject = "الدكتور الجمل بيقارن مصر بالهند --------- يا دكتور"
author = "اكتب اسمك هنا"
posted = "2009-02-25"
text = "احنا ما بيننا وبين الهند 10 الاف سنة<br />انت نسيت ان احنا فى افريقيا وان الجهل عندنا معشش فى كل حتة وان اللى فى الهند ناس وبشر واحنا شوية حيوانات"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203715/http://masr.20at.com:80/newArticle.php?sid=20109"

[[comments]]
order = 2
subject = "التعاون المصرى الهندى فى صناعة الطائرات سنة 1962"
author = "محرك"
posted = "2009-02-25"
text = "عقدت مصر والهند اتفاقا لتصنيع طائرة مقاتلة سنة 1962 وكان يحكم الهند الرئيس نهرو وفى مصر البكباشى عبد الناصر<br />وكان تقسيم العمل بين الدولتين كا التالى<br />الهند تصمم وتصنع هيكل وجسم الطائرة كاملا الجسم والاجنحة والذيل<br />ومصر تصنع محركات الطائرة<br />وعملنا مصنع الطائرات ضمن مصانع الانتاج الحربى<br />ومن الغريب - ان كل طرف قد صنع الجزء الخاص بة<br />وتم تركيب محركات الطائرة صناعة مصرية على جسم الطائرة الهندى وطارت الطائرة فعلا فى سماء القاهرة فى عيد الثورة سنة 63 او سنة 64 وبنجاح ساحق<br />ثار غضب الولايات المتحدة الامريكية على الطائرة وعقدوا اجتماعات مكثفة مع الروس لتضغط روسيا على مصر والهند لايقاف انتاج الطائرة المشتركة فى الحال وتعهدت روسيا ان تصدر روسيا لمصر طائرات بسعر مخفض بحيث لا يتعدى ثمن الطائرة الروسية المقاتلة ثمن اتوبيس تشترية مصر<br />وتم ايقاف انتاج الطائرة<br />واخذت التصميمات شركة مارسيل داسو الفرنسية وانتجت منها الطائرة الميراج اللى اصلها مصرى هندى<br />والان وبعد 50 سنة<br />الهند انتجت القنبلة النووية<br />ومصر تستورد التوك توك من الهند<br />اة يا زمن الغم"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203715/http://masr.20at.com:80/newArticle.php?sid=20109"
