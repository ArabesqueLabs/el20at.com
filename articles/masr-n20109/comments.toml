[[comments]]
order = 0
subject = "صحيح يا دكتور جمل - هى المدرعات والمصفحات منتشرة ح"
author = "اكتب اسمك هنا"
posted = "2009-02-25"
text = "يكونش داخل الجامعة مقر قيادة الرايخ التالت او عش النسر مقر المرحوم هتلر<br />والا يمكن يكون اسامة بن لادن قاعد فى مكتب احد الاساتذة فى الجامعة بيشرب شاى معاة<br />صحيح كلامك غريب<br />مصفحات حول الجامعة<br />يا ساتر يا رب<br />يظهر ان الخوف قد ملىء قلوبهم والرعب يسيطر عليهم"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203715/http://masr.20at.com:80/newArticle.php?sid=20109"

