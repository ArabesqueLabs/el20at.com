[[comments]]
order = 0
subject = "ولا اى طفل فى مصر يعتقد ان المظام حاليا يقدر حاليا"
author = "اكتب اسمك هنا"
posted = "2009-02-01"
text = "ماما امريكا واقفة لة<br />وهيطلعوا عين امة<br />امبارح فى الجرايد كاتبين ان سبب ازمة البوتاجاز ان الدولة المصدرة للبوتاجاز وهى السعودية والجزائر اوقفت الامداد لانهم لم يأخذوا ثمن ما تم توريدة لنا السنة اللى فاتت وانهم عايزين الثمن مقدما<br />يبقى العيال المحامين بتوع الوطنى ينهدوا شوية وما يشغلوش المحاكم فى مواضيع هايفة هتنهى بلا شىء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "النظام يقدر يحبس الاخوان بس"
author = "المتولى"
posted = "2009-02-01"
text = "يعمل لهم محاكمات عسكرية<br />يحبسهم ويعتقلهم<br />بضوء اخضر اسرائيلى وامريكى<br />لغاية ما الاخوان يعترفوا بوجود اسرائيل<br />اذا اعترف الاخوان بوجود اسرائيل - امريكا هتخليهم يجلسوا على كراسى الحكم تانى يوم<br />دى حقيقة<br />وطالما المرشد دة بيحقق اهداف الحكومة - يبقى الحكومة هتحبة على الاخر<br />انما لو اتى واد مرشد فاهم واقر بوجود اسرائيل ولاعب امريكا - يمكن ساعتها الحكومة تموتة او تغتالة"
archived = "2010-03-14"
capture_url = ""

