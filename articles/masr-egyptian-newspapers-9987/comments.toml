[[comments]]
order = 1
subject = "اشرف زكى وتفكير الجهل والانغلاق"
author = "شايف"
posted = "2008-09-02"
text = "زمان ايام الملك فاروق كان يطلق على السينما المصرية السينما العربية وكان يوجد فى كل فيلم تقريبا ممثل عربى او مطرب عربى زى اسمهان وفريد الاطرش وصباح وفايزة احمد وعبد السلام النابلسى وانور وجدى واغانى لفيروز ومناظر من جبال لبنان وبيروت والشام ووردة الجزائرية وكل هذا يفتح اسواق ويحقق مبيعات فى الدول العربية<br />الاستاذ اشرف زكى الناصح اصدر فرمان بعدم مشاركة الفنانين العرب فى الافلام والمسلسلات<br />طيب يا استاذ اشرف خليك براحتك<br />اتفرج عليها لوحدك يا اخويا<br />العرب مش عايزين منك حاجة<br />محدش هيشترى<br />والمليار جنية اللبى انصرفوا كانوا يبنوا 3 مصانع اسمنت ويشغلوا 5 الاف خريج<br />خلينا فى المسلسلات والرقص"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ما بلاش تتكلم عن النصارى ظعلشان النصارى ازا اتكلمن"
author = "ممدوح زكى زخارى جرجرجس_الاسكند"
posted = "2008-09-05"
text = "انت عارف انتم بتعملوا اية فى الزار و الموالد؟<br />طيب روح قسم الاداب بمديريات الامن و انت تبقى تتكلم بالحق عن اسيادك اقباط مصر؟<br />و عيب علشان اللى بيوتهم من زجاخ تبقى تبطل ترمى اسيادها بالطوب؟<br />و كفاية عليكم اسرائيل و امريكا اللى ممرمغينكم فى الوحل ظ<br />و ابقى اتشطر و روح حارب مع المؤمنين امثالك و حرر اسرائيل و العراق<br />و معلش كلة فى المشمش؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الى(اشرف غبى)نقيب الفنانيين"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-05"
text = "أشرف يا غبى _يا نقيب الفننانين<br />الفن ليس حكرا عليكم يا مدعى الفن؟<br />ما انتم الا عصابة من مدعى الفن و التشخيص و الرقص<br />اغلبكم من باطن المجتمع يا احفاد الغوازى و المشخصاطية<br />عليكم لعنة اللة فى كل زمان و مكان؟"
archived = "2010-03-14"
capture_url = ""
