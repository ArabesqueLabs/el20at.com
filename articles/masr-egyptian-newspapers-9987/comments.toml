subject = "المسلمون يحتفلون برمضان كما يحتفل النصارى بعيد ميل"
author = "مش لازم"
posted = "2008-09-02"
text = "كما يحتفل النصارى بعيد ميلاد المسيح بالخمر والزنا والفسق والفجور<br />تحول رمضان من موسم للعبادة والطاعة والخيرات الى موسم للفن والسهر<br />تتصوروا ان في شارع الهرم بعد انتهاء السهرة يقدمون وجبة صحور<br />ها ها ها ها ها ها ها ها ها ها ها ها"
