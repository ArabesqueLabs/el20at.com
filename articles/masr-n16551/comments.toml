[[comments]]
order = 0
subject = "فيلم بايخ قوى وقديم"
author = "ع بع مين هناك"
text = "اتعودنا على الافلام البايخة قوى قبل كل تجديد لقانون الطوارىء<br />المرة دى متأخرين لبعد التجديد<br />يمكن الزهايمر شغال معاهم<br />او يمكن المواطنين اللى اتقبض عليهم فجروا شوية غازات سامة فى مكان عامة من نوع جيص ارض ارض او فاسية معفنة شوية<br />واللة اذا كان الموضوع تفجيرات ضد النظام فنحن نؤيدهم والى الامام<br />واذا كان تغيير الحكم فأظن 75 مليون من الناس ستقف ورائهم بكل قوة<br />النظام المعفن ريحتة بقت وحشة قوى والناس جاعت"
archived = "2008-07-03"
capture_url = "https://web.archive.org/web/20080703075727/http://masr.20at.com:80/newArticle.php?sid=16551"

[[comments]]
order = 1
subject = "وأشارت إلي أن أحد المتهمين بقيادة المجموعات، هاربا إلي دولة الإمارات قام بتحويل أموال خلال الشهور الماضية لشراء أسلحة ومتفجرات"
author = "من الامارات"
text = "هذا الكلام غير صحيح ومبهم وواضح قوي انه تلفيق في تلفيق<br />لان انا من الامارات وما ينفعش واحد يهرب الى الامارات<br />الامارات مش الصعيد حيروح يستخبه في مزارع الدره<br />علشان واحد يجي الى الامارات لازم يكون جاي يشتغل ولازم الجهة اللي حيشتغل فيها تعمله تاشيرة عمل وحكاية ورواية طويلة جدا جدا جدا<br />وبعدين الامارات فيها امن دولة زي مصر بالضبط واشد من امن دولة مصر يمكن بميت مرة<br />ولا يمكن هذا الكلام الفارغ دا يحصل في الامارات ابدا<br />واحد هرب على الامارات ولقى الشوارع مليانه فلوس فراح يحول للارهابيين علشان خاطر يشتري مش عارف ايه<br />الامارات بعد ضرب البرجين بتوع امريكا مفيش حاجه فيها بهذا الكلام ابدا ابدا ابدا<br />لو فيها ارهابي واحد من الناس الشغالين فيها امن الدولة بيركبوا الطيارة على طول<br />وهما مفهمنا كده انتوا جايين تشتغلوا وبس ممنوع ممارسة اي نشاط سياسي ممنوع الكلام في السياسة والدين نهائي الا في الحدود التي تقررها الدولة<br />ففعلا زي ما الاخ المعلق السابق قال الكلام دا فيلم بايخ اوي اوي اوي وقديم ومكرر<br />بس والنبي شوفلكم دولة تانية مالكوش دعوة بالامارات لان هنا فيه جالية مصرية كبيرة اوي بتشتغل والكلام دا ممن يؤثر عليها"
archived = "2008-07-03"
capture_url = "https://web.archive.org/web/20080703075727/http://masr.20at.com:80/newArticle.php?sid=16551"

[[comments]]
order = 2
subject = "الامن في الامارات بشهادة العسكريين المصريين"
author = "ابومحسن غربة 27 سنه في الامارات"
text = "في زيارته لشرطة أبوظبي<br />الوفد العسكري المصري يشيد بالمنظومة الأمنية لشرطة أبوظبي<br />اللواء بن نصره العامري :<br />\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" الزيارة تؤكد التعاون الأمني بين الأمارات وجمهورية مصر العربية\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"<br />اللواء تيسير رئيس الوفد المصري:<br />\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ما شاهدناه في شرطة أبوظبي يعكس التطور العلمي في القيادات الشرطية \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"<br />أكد سعادة اللواء اركان حرب تيسير محمد مكرم مدير كلية الحرب العليا بأكاديمية ناصر العسكرية العليا رئيس الوفد العسكري المصري الذي يزور دولة الأمارات العربية المتحدة خلال الفترة من 15/3 إلى 21/3/2008م بأن ما شاهده والوفد المرافق خلال زيارتهم للقيادة العامة لشرطة أبوظبي يعكس لتطور العلمي في القيادات الشرطية والعمل الشرطي – وذلك من خلال الأجهزة الأمنية التي تواكب آخر ما توصل إلية العلم في مجال العمل الأمني- حيث شاهد الوفد جهاز بصمة العين الذي يعتبر الوحيد في العالم الذي تستخدمه دولة الأمارات العربية المتحدة والذي يعطي مثالاً جيداً عن الاستخدام الأمثل للتكنولوجيا في أمن وسلامة المجتمع.<br />كما أطلع الوفد والذي يضم اللواء أركان حرب وصفي محمود حسن عرفة ويرافقهم العقيد أركان حرب طارق محمد الظاهر ملحق الدفاع بالسفارة المصرية في الدولة على برنامج الأمن الجنائي الموحد المطبق على مستوى دولة الأمارات في جميع مراكز الشرطة وإداراتها المختلفة والمرتبط بقاعدة البيانات الموجودة في وزارة الداخلية، وأبدى اللواء تيسير إعجابه بهذا النظام والوفد المرافق من حيث أنه يسهل عملية إدراج المطلوبين والممنوعين من السفر المحجوز جوازات سفرهم في أي مكان بالدولة من الجهات التي تستخدم هذا النظام – ثم قام الوفد بزيارة لغرفة العمليات أيضاً في الأدارة العامة للعمليات الشرطية وناقشوا أسلوب العمل فيها وأثنوا على التعامل الحضاري والحديث في استلام البلاغات وتوجيه الدوريات في حالة أي حادث أو اختراق أمن في أي مكان بإمارة أبوظبي.<br />وصرح سعادة اللواء محمد بن نصرة العامري مدير إدارة العلاقات العامة والتوجيه المعنوي بوزارة الداخلية في ختام الزيارة بإنها تؤكد الترابط الكبير والمتميز بين دولة الامارات وجمهورية مصر العربية في جميع المجالات خاصة الأمنية منها وأشاد بالعلاقات الإماراتية المصرية والتي تعتبر من العلاقات المتميزة لإجيال بعيده وتأتي زيارة اليوم التي قام بها الوفد المصري للقيادة العامة لشرطة أبوظبي لتكمل أواصر تلك العلاقة وتؤكد ما فيها من تقارب وتعاون.<br />وأكد اللواء بن نصرة على أن هناك تعاون كبير من خلال الإستراتيجية التي تنفذها شرطة أبوظبي والتي يتم من خلالها تبادل الخبرات والمعلومات الأمنية التي تعود بالنفع على المجتمع سواء في الامارات أو في جمهورية مصر العربية.<br />يذكر أن سعادة اللواء محمد بن نصره العامري والعقيد أحمد محسن الحامد مدير شرطة مطار أبوظبي والرائد ناصر الكعبي مدير إدارة الإعلام والعلاقات العامة بالقيادة العامة لشرطة أبوظبي وعدد كبير من الضباط كانوا في استقبال الوفد المصري حيث رافقوهم في جولتهم التعريفية بالأدلة الجنائية وإدارة العمليات الشرطية.<br />في ختام الزيارة تم تبادل الهدايا والدورع بعدها قام الوفد بزيارة إلى ميدان الرمايه بنادي ضباط الشرطة بأبوظبي."
archived = "2008-07-03"
capture_url = "https://web.archive.org/web/20080703075727/http://masr.20at.com:80/newArticle.php?sid=16551"
