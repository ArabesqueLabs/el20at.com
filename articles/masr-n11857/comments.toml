[[comments]]
order = 0
subject = "الشرفاء والارزقية والهتيفة"
author = "احمد حسين"
text = "القضاة وامستشارين ناس عظماء وهم ضمير الوطن<br />فى الحرب العالمية الثانية دخل الجنرالات على تشرشل رئيس وزراء بريطانيا يقولون لة ان الطائرات والصواريخ الالمانية دمرت لندن ولم يعد فيها جدار بجانب جدار والدمار فى كل مكان<br />قال لهم تشرشل - اريد ان اطمأن على ثلاث اشياء<br />هل لا زال عندنا قضاء عادل ؟ وهل عندنا تعليم جيد ؟ وهل عندنا رعاية صحية جيدة ؟<br />قالوا نعم - عندنا<br />قال لهم رغم كل التدمير لا خوف على بريطانيا<br />بعض القضاء عندنا تابع للنظام ويحكم بالتزوير وحبس الصحفيين ومعظمهم شرفاء<br />بعضهم هتيفة وارزقية<br />والغالبية مصريون شرفاء"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016041817/http://masr.20at.com:80/newArticle.php?sid=11857"

[[comments]]
order = 1
subject = "جرايد الحكزمة"
author = "abu osama"
text = "انتوا لسة بتقرؤا الجرايد الحكومية سيبوكوا بقى من التخلف ده الجرايد دى زيها زى التلفزيون المصرى<br />شوية منافقين على شوية هتيفة على اعلانات الحزب الوثنى يا ريت ترحمونا من اخبار هذه الجرائد<br />لأنها بتصيبنى بالقرف."
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016041817/http://masr.20at.com:80/newArticle.php?sid=11857"
