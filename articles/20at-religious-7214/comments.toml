subject = "مدينة فاس المغرب"
author = "حنان المغربية"
posted = "2007-09-28"
text = "حاولت قدر الامكان<br />السلام عليكم و رحمة الله تعالى و بركاته ...فكرة جميلة جدا ان يتم فتح بوبة للاعتراف بما قمنا به في شهر الغفران فشكرا<br />بالنسبة لي انا فتاة في 25 من عمريالحمد لله حاولت قدر الامكان ان اجمع بين القيام و قراءة القرآن الكريم و القيام بعملي الدي يتطلب مني الغياب عن بعض الصلوات و خاصة صلاة العصر و التراويح التي اعتبرها مهمة -بسبب العمل - و هدا هو التقصير الوحيد و الدي غالبا ما اقع فيه لكن الحمد لله على كل حال اشعر اني قمت بالواجب لكن للاسف ليس بما فيه الكفاية و ان شاء الله ساحاول ان لا اقصر في الايام الباقية لان الكمال لله وحده و اطلب الله ان يوفقني و إياكم لما يرضاه و يحقق لنا الغفران في شخر التوبة هدا و السلام عليكم و رحمة الله<br />أختكم في الله"
archived = "2010-03-14"
