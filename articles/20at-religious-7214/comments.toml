order = 1
subject = "الراجيه رضاء ربها"
author = "ادعولى بظهر الغيب"
posted = "2007-09-30"
text = "انا مش عارفه الايام اللى فاتت من رمضان ربنا قبلها منى ولا لا انا بجد خايفه اوى ويارب يرزقنا بلذه الطاعه بس انا حاسه ان رمضان اللى فات كان احلى مع انى ختمت رمضان اللى فات مره واحده ورمضان ده ختمت مره وبدءت المره التانيه والحمد لله بروح التراويح بس حاسه انى مضايقه اوى يارب تب علينا لنتوب واخذ بايدينا لنصل اليك والله انا بحب ربنا اوى وربنا بيحبنا عشان خلقنا مسلمين تخيلو لو كا مش مسلمين ممكن تدعولى اللهم اغفر لى وللمؤمنين والمومنات والمسلمين والمسلمات الاياء منهم والاموات فى حديث عن الرسول عيه الصلاه والسلام معناه ان لوحد دعا للمسلمين بياخذ بعدد كل مسلم حسنه مع السلامه بس متنسوش تدعولى"
archived = "2010-03-14"
