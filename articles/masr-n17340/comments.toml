subject = "الفكرة حلوة ولكن العملية مبنية على خطأ"
author = "عادل"
text = "بحكم الخبرة اشتغلت مع شركات وجنسيات كتيرة جدا فى مصر وخارج مصر - كيف يعدون شبابهم ويكسبونهم خبرة ؟<br />لنفترض اننى خريج تجارة او خريج هندسة او صحافة واريد ان اشتغل وابدأ حياتى العملية<br />اول خطوة لا بد ان قدم اوراقى وهى شهادة تخرجى الى احد المؤسسات او الشركات او المصانع لتضمنى الى طاقمها وبعد التحاقى بالعمل يسمى الخريج<br />مهندس مبتدأ - او محاسب مبتدأ - او صحفى تحت التدريب<br />الشركات الكبرى فى الخارج عندها مراكز تدريبية تلحق الخريجين الذين التحقوا بها فى تلك المراكز وتعطيهم دورات تدريبية وعملية لمدد مختلفة وتدربهم فى مواقع عمل الشركة وبين المهندسين القدامى والمحاسبين القدامى والصحفيين القدامى<br />واقرب مثال على ذلك مراكز تدريب شركة المقاولين العرب ايام مجدها<br />بعد انتهاء الدورات التدريبية والعملية يلحق بالعمل بالمواقع كمساعد لمهندس قديم او محاسب قديم يكتسب منة الخبرة ويؤهلة لان يعمل منفردا ومعتمدا على ذاتة بعد مدة لا تقل عن خمسة اعوام<br />انما تدريب فى قاعة زى ما شفنا فى المقال دة كلام نظرى<br />العمل فى المواقع والشركات والمصانع تحتاج الى تدريب ميدانى وعملى ومواجهة مشاكل<br />لا بد من الرجوع الى توظيف الشباب فى الشركات الحكومية وتدريبهم وكذلك شركات القطاع الخاص وتدريبهم<br />ومن هنا يكتسبوا الخبرة والا من اين يكتسب الخريج خبرتة الا بالممارسة العملية<br />الاخ بتاع الفريق دة بيهرج<br />وبيهرج جامد<br />العملية شغل شركات ومصانع مش شغل عيال"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060102/http://masr.20at.com:80/newArticle.php?sid=17340"

