text = "فكرة معا تعتمد فى الاساس على التعاون والمشاركة بين كل اعضاء الفريق بل هى تنمى لدينا ثقافى التطوع والعمل الخيرى ايضا كما اننا نعتمد على مساعدة انفسنا فى تعليم بعض الكورسات مصل مذاكرة cma ومذاكرة الانجليزى ومعرفى كل الاخبار المتعلقة بالمنح والدورات التدريبية فى كل انحاء مصر والوظايف ايضا ولو اردت اى معلومة ما عليك الا ان تسال اى فرد من معا ولن يتاخر ابدا فى تعريفك بكل ما تريد لان المعلومة فى معا هى ملك للجميع معى تحياتى مشروع مهندس معمارى محمود عطية"
