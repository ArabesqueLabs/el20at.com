[[comments]]
order = 3
subject = "الكلام دا للخاصة من الناس وليس كل الناس"
author = "مش كاتب"
text = "الكلام دا واضح انه للخاصة من الناس<br />سكان الزمالك والاهلي والمعادي وجاردن ستي والشباب الهاي هاي هاي هاي بتوع الانتر Interview<br />اما الناس اللي زينا لما بيشتغلوا ما بيعملون انتر فيو مع انهم خريجي جامعات برضه<br />لكن يخساره احياءهم التعيسة جعلتهم في الخلف ونخص بالذكر المرجع وعين شمس والمطرية وعشرات من احياء القاهرة اللي اصبحت عار على سكانها بفضل التخطيط السير لمصر من الف سنه<br />مفيش بلد في العالم فيها فرق خطير بين احياءها زي ما هو موجود في مصر<br />وحكممة رايحة وحكومة جاية والامر بيزداد سوءا والاغنياء يزدادون غنا والفقراء يزدادون فقرا<br />واملنا في الله كبير"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060102/http://masr.20at.com:80/newArticle.php?sid=17340"

[[comments]]
order = 4
subject = "مش صح أبداً اننا نقفل الأبواب المفتوحة"
author = "Al-Rayeg"
text = "اللي عايز أقوله ان الناس ديت بتكمل النقص في مجال التعليم واللي مفروض يكون معانا من أول المرحلة الإعدادية<br />وحتى المرحلة الجامعية في شكل مناهج علمية تطبيقية كما ذكر في أحد التعليقات عن نموذج من الغرب<br />وحتى لو ده مش الهدف، ليه مانتعلمش حاجة جديدة ماتعلمنهاش في المدارس، وبعدين المقال بيدل على ان في البلد<br />ناس عايزه تعمل الخير للغير بدون مقابل (ببلااااااااش ) ؛ فيها حاجة دي؟؟!!<br />في رد غريب شوية بيقول انو لناس مخصوصة ... ، طب حضرتك جربت تنضم ليهم ورفضوك؟؟!!<br />قبل ماتقول كلام زي ده اتأكد بنفسك وروح شوف شروطهم ايه ومين الناس اللي بتستفيد هل هم فئة معينة من المجتمع؟؟!!<br />بيتهيأ لي انهم ماقاموش إلا عشان يصحوا النايم ويوعوا الغافل ويعلموا الجاهل،مش بس إزاي تكتب سي في، لأ ده<br />كل حاجة مفيدة روح بص وطل وشوف... باختصار، الفايدة ليك إنك بتضيف لنفسك حاجة جديدة.<br />ربنا يكرمهم ويوفقهم ويجزيهم عنا خير الجزاء."
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060102/http://masr.20at.com:80/newArticle.php?sid=17340"
