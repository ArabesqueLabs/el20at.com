subject = "يا جماعة لازم نحسبها كدة : 1+1=3"
author = "محمود حجازى"
posted = "2008-08-27"
text = "سلامو عليكم ورحمة الله وبركاته<br />بجد بجد بجد فكرة راااااااااائعة<br />وانا أينعم مش حضرت فى ساقية الصاوى خاااااااااالص للمهندس أسامة<br />ومش شفته غير مرة واحدة بس<br />لكن بأمانة أسمع عن فريق ومجمعوته كل خييييييييييييييييير<br />قصص نجاح راااااااااااااااااائعة<br />فبالنسبة للأخ اللى دخل وشتم ::<br />مش فاهم هتفضل بالعقلية دى لحاد امتى ؟؟<br />فوووووووق بأة من النوم اللى انت فيه دا<br />دول شباب صحيوامن التوهان اللى انت فيه<br />شباب بيحب التغيير بجد<br />شباب بيبنى مش بيهد<br />شباب بيتعلللللللللللللللللللللم صح<br />ودا هيدخلنا فى مشاركة أخونا التانى اللى قال :<br />ان التعليم بالطريقة دى غلططططططططط<br />مين قال انناا اكتفينا بالكلام دا خل القاعات<br />لا<br />لا<br />لا<br />احنا بنعمل كدة علشان نعرف نوصل للطريق الصح اللى ناخد بيه الخبرة العملية الجيدة<br />ياااارب يكون كلامى خفيف عليك<br />تقبلوا تحياتى"
