subject = "ضع عنوان التعليق"
text = "ليه بس كده يا أخ عادل؟؟!<br />طاب ولو مفيش الفرص اللى انت بتقول عليها<br />يبقى نحط ايدنا على خدنا وننقعد نعيط<br />بما اننا كشباب لا نملك اى مهارات تؤهلنا حتى للتدريب .. يبقى لازم نحاول نحصل عليها<br />مين فين يعرف يكتب سى فى أو يقدم عرض لمشروع بشكل سليم<br />مين يعرف هو عايز ايه أساسا ....<br />حضرتك بتتكلم عن خبرة كل واحد فى مجال تخصصه .. ومعاك حق فى اللى قلته ... لازم طبعا الممارسة العملية<br />لكن هم شغالين على المهارات الأساسية اللى المفروض اننا كنا ناخدها فى المدارس.. وأعتقد اننا لن نختلف فى انها مهم لاى بشر<br />فى الخارج الولد بيتعلم ازاى يبدأ فكرة مشروع .. ويقدم فكرته أمام الفصل والمدرسة ويمكن كمان مدرسته كلها ... ويقوم حوار بينهم فيرد عليهم ويردوا عليه<br />ده مثال صغير .. فين احنا من ده كله ؟<br />سيبهم يساعدونا نعدل مهاراتنا شوية ... ربنا يكرمهم"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060102/http://masr.20at.com:80/newArticle.php?sid=17340"

