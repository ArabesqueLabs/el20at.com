text = "بالنسبة للاخ اللي بيقول :<br />اول خطوة لا بد ان قدم اوراقى وهى شهادة تخرجى الى احد المؤسسات او الشركات او المصانع لتضمنى الى طاقمها وبعد التحاقى بالعمل يسمى الخريج<br />مهندس مبتدأ - او محاسب مبتدأ - او صحفى تحت التدريب<br />الشركات الكبرى فى الخارج عندها مراكز تدريبية تلحق الخريجين الذين التحقوا بها فى تلك المراكز وتعطيهم دورات تدريبية وعملية لمدد مختلفة وتدربهم فى مواقع عمل الشركة وبين المهندسين القدامى والمحاسبين القدامى والصحفيين القدامى<br />انت ازاى هاتقدم ورقك من غير ما تعرف ازاى تكتب ال سى فى بتاعك اصلا الشركة مش هاتقبلك بالشهادة بتاعتك بس<br />ولا ازاى هاتعمل مقابلة شخصية من غير ماتستعد ليها<br />كل دة بنتعلمه فى معا<br />انت اصلا مش هاتقبل فى الشركات الكبيرة اللى بتقول عليها الا اذا اتعلمت كويس من فريق معا<br />ثم اية الشركات الكبيره فى الخارج دى .. احنا فى مصر<br />يظهر انك عندك عقدة الخواجه و يظهر كمان انك غيران من نجاح الفريق و الباشمهندس<br />انت اكيد من حزب اعداء النجاح<br />باختصار كدة معا=نجاح لازم تعدي علي معا عشان تعدى لمستقبلك المشرق باذن الله<br />و اخيرا ربنا يبارك فى كل فريق معا وعلي راسهم م/ اسامه"
