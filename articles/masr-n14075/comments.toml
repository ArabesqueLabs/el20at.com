[[comments]]
order = 4
subject = "افرجوا عن غزة"
author = "علي عبده"
posted = "2008-02-04"
text = "تدعو قناة الحافظ المسلمين أن يقفوا بجوار إخوانهم في غزة لفك الحصار عنهم ونذكر المسلمين بحديث رسلو الله صلى الله عليه وسلم : مثل المؤمنين في توادهم وتراحمهم وتعاطفهم كمثل الجسد الواحد إذا اشتكى منه عضو تداعى له سائر الأعضاء بالسهر والحمى"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043922/http://masr.20at.com:80/newArticle.php?sid=14075"

[[comments]]
order = 5
subject = "الى peace_lover"
author = "واحد وخلاص"
posted = "2008-02-05"
text = "شوف يا ابني ما كان لنا ان نتذل ابدا من اجل لقمة العيش<br />ولكن نحن نتذل من اجل الفرقة<br />الفرقة القومية<br />والفرقة الدينية<br />الفرقة القومية يعني الاحزاب القومية اللي انت عارفها<br />الفرقة الدينية يعني الفرق الدينية اخوان وسلفيين ووهابيين وغيره<br />وطالما نحن متفرقين ومصرين على الفرقة<br />يبقى ناكل عيش احسن"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043922/http://masr.20at.com:80/newArticle.php?sid=14075"
