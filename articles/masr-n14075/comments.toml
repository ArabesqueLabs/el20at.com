text = "الذل أكتر حاجه تخلي الانسان مننا يخاف ونفس الوضع بالنسبه للدول بالرغم من أننا دوله حرة لكن لقمتنا في ايد ماما أمريكا يبقي لازم نبيع اخواتنا علشان لقمه عيشنا .............................................عمار يا مصر يا أم الدنيا والله وجالك يوم تتذلي"
