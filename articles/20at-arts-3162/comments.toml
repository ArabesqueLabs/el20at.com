text = "أحلى حاجة عجبتنى فى المعرض هو الإقبال الشديد على الكتب والشرائط الإسلامية كما بهرنى الالتزام بالصلاة فى المسجد وفى غير المسجد.<br />مااضحكنى وتعجبت منه جدا هو إعلانات \"دار الكتاب المقدس\" وغيرها من دور النشر النصرانية أن الإنجيل ب\"جنيه\".<br />اعتقد ان هذا فيه تقليل كبير وتحقير لكتابهم الذى يدعون أنه مقدس وكأنهم يعلنون عن كتاب \"بائر لايجد من يشتريه\" ."
