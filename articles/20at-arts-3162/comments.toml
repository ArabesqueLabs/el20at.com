[[comments]]
order = 3
subject = "المعرض غرق"
author = "eslam"
posted = "2007-02-06"
text = "السلام عليكم<br />بالنسبة للمعرض فأنا رحته يوم السبت و الصراحة كان يوم ما يعلم بيه الا ربنا وصلت المعرض حوالى الساعة 11 و ماشاء الله شفت أمة لا اله الا الله هناك كأنهم رايحين يفتحوا عكا و قفت فى طابور قطع التذلكر و اللى كان شبه تعبان طوييييييييييل كان طويل قوى لدرجة اننا عشان اقف وصلت لاخر الشارع المهم بعدها وقفت فى طابور الدخول حاكم المعرض كان عبارة عن طوابير طوييييييييييييييييييييييييييييييلة جدا و المضحك انه رغم الاعداد الكبير اللى كانت واقفة كانوا فاتحين خرمين مش بابين للدخول و طبعا عقبال ما دخلت المعرض كانت الساعة 12 ما علينا دخلت اول صالة اللى كان فيها الجناح الالمانى الصراحة عجبنى تنظيمها و اللى عجبنى اكتر انها كانت فاضية من الناس؟؟كأنها مرض بعد كده جيت اخرج من الصالة لقيت الدنيا بتمطر فضلت الف فى بقية الصالة لغاية ما بطلت خرجت و لقيت الكارثة الشوارع كلها كانت غرقانة و مفيش مكان تتصرف فيه المية و كمان عند صالة الاهرام اللى هية الحتة بتاعت المطاعم كان السقف بيخر مية من فتحات الكهرباء يعنى اللى مستغنى عن عمره يعدى من تحتها ده غير ان الصالات نفسها كان السقف بيخر مية نيجى بقى لحكاية الاكل الصراحة الزحمة على المطاعم كانت اكتر من الزحمة على الكتب لا واصحاب المطاعم كانوا حرامية طلبت من الراجل سندويتشين شاورما خد 5ج و ادانى سندويتشين بصل ههههه ما علينا الخلاصة ان التنظيم كان وحش خالص حتى الندوات ملقتش غير ندوة واحدة كان ضيفها واحد ايطالى و المضحك ان اللى كانوا قاعدين حبة عيال فى ابتدائى و الناس الكبار مش لقيين مكان يقعدوا فيه اما الحمامات فهى من المحظورات فى المعرض معلش امسك نفسك احسن بخصوص الكتب الدينية لاحظت ان الاخوة المسيحيين كانوا ظاهرين فى المعرض معظم الصالات كان فيها مكان للكتب المسيحية و جنبها الاسلامية"
archived = "2010-03-14"
