[[comments]]
order = 6
subject = "الناس تعبانه ....حتى في المعرض"
author = "أحمد عبد اللطيف"
posted = "2007-02-12"
text = "نزلت هذا العام مرتين المرتين كان الهدف ليس شراء الكتب فقط و لكن لأنني أمارس العمل التطوعي<br />حيث كان هناك في المعرض حملة للتوعية عن السرطان و أخطاره و طريقة مواجهته و كنت أحد العاملين بهذه الحملة و بالطبع تعرضت لكثير من المواقف الغريبة فمع بداية كلامي لأي فرد كنت ألاحظ أنه يظن أنني جئت لأعرض عليه نوعا من السلع<br />لذا فقد كانت أول كلمة أقولها بعد السلام هي<br />( أنا مش جاي أبيع حاجة )<br />و بالطبع لم يكن هذا كافيا فردود الفعل و إن كانت إيجابية من معظم الناس إلا أنني كنت أواجه أحيانا بالبرود أو الرفض و كم من المرات ظن الناس أنني طبيب لذا فقد كانوا يحكون لي عن أمراضهم و أمراض ذويهم<br />الغريب أن بعضهم استوقفني ليحكي لي عن مشاكل حياته و عائلته و كأن الناس تبحث عن أي شخص ....أي شخص لتتحدث معه<br />فعلا أحسست بأن الناس متعبة ..... شاكية ....... تكاد تنفجر<br />و ما أرقني و كاد يفجر الدم في رأسي أنني لم أكن أدري أن السرطان منتشر إلى هذا الحد<br />فمعظم من قابلتهم كانوا دائما ما يقولوا لي<br />أخي مات بالسرطان<br />أبي مات بالسرطان<br />أمي ماتت بالسرطان<br />و هكذا<br />و دائما كنت أواجه بالاستغراب عندما يعلم أحد الناس أن هذا العمل تطوعي بدون أجر<br />لكنهم ما كانوا يعلموا أن دعواتهم كانت تهبط على أذنني بردا و سلاما فتزيل التعب و الملل<br />الموقف الثاني<br />لم أكن أعلم أنني حين سأرى الشيخ أبو إسحق الحويني سأفرح إلى هذا الحد<br />كنت في سرايا السعودية و فجأة وجدت تجمع على شخص<br />توقعت أنه أحد مشاهير المشايخ<br />عندما رأيت الشيخ لم أكد أصدق<br />لم تكن هناك زحمة كبيرة حوله فقد كان في بداية مجيئة و هممت بالفعل أن أذهب إليه لأسلم عليه و لكنني لاحظت أن وجهه متعبا أو غير راضيا عن الوضع المحيط به<br />لذا اكتفيت بالنظر إليه من بعيد ثم انصرفت<br />و لكن ما تعجبت له حقا هو تصرفات الإخوة من حوله<br />فكل من كان معه كاميرا في هاتفه الجوال صور هذا الموقف كأننا في مؤتمر صحفي<br />فالإخوة يتعاملون مع المشايخ كأنهم نجوم سينيما<br />بعد صلاة العصر فوجئت بمعلومة جديدة لم أكن أعلمها بعد<br />أعلم بالتأكيد أن السلفيين يعرفوا الشيخ لذا فإنه من الطبيعي أن أراهم حوله ليسألوه أو ليسلموا عليه<br />و لكن الجديد أنني رأيت الكثير من الناس العاديين بل و المتبرجات حوله ليسلموا عليه و يسألوه و أخبرني أحد أصدقائي أنه رأى سيدة متجهة بعيدا عنه إلى أبنائها و قد قالت بصوت عالٍ<br />( سألتهولكوا .... سألتهولكوا )<br />أحد رفاقي الذين كانوا معي في التوعية أخبروني بشيء عكر مزاجي و حرق دمي<br />بينما هو يمارس التوعية فإذا بأحد مستمعيه يسأله سؤالا<br />ماذا تعرف عن الشيعة ؟<br />ثم دخل معه في حوار عن الشيعة و و الصحابة و طبعا كان المحاوار شيعي رافضي يهدف إلى تشكيك زميلي في عقيدته<br />لذا فقد ظن زميلي أنه منصر لأنه ما كان يدري الخبر التالي<br />بعد تحذيرات من خطورة عمليات الدعوة للتشيع في العواصم السنية .. اشتباكات شيعية سنية في معرض القاهرة الدولي للكتاب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "تجربة فى معرض الكتاب"
author = "طارق"
posted = "2007-02-13"
text = "كل عام أذهب إلى معرض الكتاب وفى رأسى توجه معين ، أقصد أنى بأركز البحث فى فرع من فروع المعرفة ،<br />هذا العام بقى ، وبما أنى مهتم بالموسيقى منذ 5-6 أشهر كده ، فأحببت أن أشترى كتب عن الموسيقى ، سواء صولفيج ، أو عن تاريخ وفلسفة الموسيقى وخلافه يعنى .<br />المهم ، نظرا لضيق الوقت ، كنت أسأل البائعين فى كل مكتبة عن إذا كان عندهم كتب فى الموسيقى ، وكان يتكرر الحوار التالى :<br />أنا : عندك كتب فى الموسيقى ؟<br />البائع : أفندم ؟؟؟؟ ( بيطرقطق ودانه علشان يسمع كويس ويتأكد أنه سمع صح )<br />أنا : بأقول كتب موسيقى<br />البائع : ( يصمت لحظة ترتفع فيها حواجبه دليل الإندهاش والتعجب مع بوادر إبتسامة خفيفة ) ممممم فيه هناك كتب الفنون والأثار ، شوف هناك يمكن تلاقى .......<br />أنا : شكرا .... ( وأتوجه ناحية الرف المقصود )<br />البائع : العفوا ( ويتبعنى بنظرة من إثنين ، إما نظرة التعجب والفرجة على شكل اللى جى يشترى كتاب موسيقى ده ، أو نظرة إزدراء وإحتقار ، مع الأسف على حال الشباب المصرى اللى مش فى دماغه غير الموسيقى والكلام الفارغ)<br />بس كده<br />ملاحظة تانية بقى - هو سور الأزبكية غالى السنادى ولا أنا مش بعرف أفاصل ؟؟ مش عارف"
archived = "2010-03-14"
capture_url = ""
