[[comments]]
order = 0
subject = "النهاردة 15 ابريل موعد النطق بالحكم في القضية العسكرية"
author = "مش مش"
text = "طبعا الاستاذ عبدالمنعم عبدالمقصود منسق هيئة الدفاع حيروح المحكمة علشان خاطر يسمع النطق بالحكم<br />مش حيلاقي محكمة ولا بتاع وحيلاقي خبر مع بواب المحكمة ان القضية اتأجلت الى 15 مايو<br />يا عيني عليك يا استاذ عبدالمنعم عبدالمقصود<br />,وبعدين طبعا حيفرقغ تصريح للصحافيين وحيقولهم ان القضاء في مصر اثبت انه قضاء تابع للسلطة وغير مستقل"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161144/http://masr.20at.com:80/newArticle.php?sid=15200"

[[comments]]
order = 1
subject = "نزاهة المحاماه"
author = "مش مش"
text = "كما اننا نطالب بقضاء نزيه نطالب ايضا بمحاماه نزيهه شريفة تقول الحق من اول ما تعرض عليها القضية<br />لكن للاسف الشديد محامين مصر هما سبب تعاسة الشعب المصري لانهم احسن ناس تاكل عيش بالام الشعب المصري<br />وناخد مثلا قضية الاخوان المسلمين المحالين عسكريا اللي المفروض النطق بالحكم يكون النهاردة<br />طبعا الاخوان دول مش متهمين باي شيء هما متهمين سياسيا فقط تهمة سياسية وهي زعزعة كرسي الحكم<br />فهو ما فيش قضية اصلا دول ناس معتقلين خلاص انتهى الموضوع ولن يفرج عنهم الا بعد تغيير النظام<br />وطبعا المفروض هيئة الدفاع عنهم تكون عارفة كده وتصرح بكده من اول ما عرضت عليها القضية<br />يعني انا مثلا مش محامي ولا بتاع بس بقول الحقيقة<br />وانا ادعو الاخوة في نقابة المحاميين لزاهة المحاماه<br />عيب اوي الواحد يمشي في قضية وياخد فيها اتعاب وهي خسرانه خسرانه خسرانه<br />تماما زي القضية العسكرية اللي المفروض يكون النطق بالحكم فيها اليوم كان المفروض المحامي يكون عارف ان المحكمة العسكرية دي شوية طراطير وان المتهمين معتقلين لا محاكمة لهم<br />بلا منسق هيئة الدفاع بلا بطيخ"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161144/http://masr.20at.com:80/newArticle.php?sid=15200"

