[[comments]]
order = 4
subject = "اضراب..عن حياتنا الفاسدة"
author = "أميمة الشاذلي"
posted = "2008-04-15"
text = "بالنسبة للاضراب انا كنت قلت وجهة نظري قبل كده في مقال اخر برضه للاستاذ خباب وهو ان الاضراب لا يعني اننا نريد قلب نظام الحكم<br />الاضراب يعني رسالة بنوصلها للمسئولين ان في بني آدمين هنا ليهم مطالب ومحدش سامعهم..<br />اننا مش هنفضل ساكتين كده وراضيين باللي بيحصل حتى لو مكنش بسبب الدولة او الحكومة لكن الحكومة لازم تكون حاطة خطة لكل حاجة ولازم تعمل حسابها على كل حاجة..واضرابنا ده لازم يدفعهم انهم يدورولنا على حل قبل ما الواحد يضطر يبيع اعضاؤه عشان يحسن مستواه المعيشي"
archived = "2010-03-14"
capture_url = ""

