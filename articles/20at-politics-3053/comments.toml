text = "جالاوي وتشافيز .. انا معك بأنهم معنا ..<br />أما نجاد فإنه قائد الخطر الصفوي على الأمة ..<br />والدليل الأكبر على ذلك ما تفعله مخابراته و عملاءه في إخواننا السنة في العراق من تقتيل وتشريد واغتصاب ..<br />إذا نجاد ليس صديقنا مثل جلاوي وتشافيز بل هو العدو الأكبر .. وهو يتدثر بالتقية (( وهو النفاق الصريح ))"
