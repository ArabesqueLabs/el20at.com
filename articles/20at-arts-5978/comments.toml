text = "أنا معك فى هذا الكلام فكثير من الناس يعيش لا يعلم لماذا يعيش؟ وما الغاية التى يعيش من أجلها ؟<br />بل كثير من الناس يعيش ويعمل كرجل واحد وقليل من تجده يعيش كألف(1000) رجل بل تجد أحدهم يستهزئ بكلام موزون ومعقول فهذا يعيش بأقل من ربع رجل<br />وأخيراً جزاك الله خيرا على ما كتبت ........"
