text = "اخي جزاك الله كل خير على ماكتبت ............. فالكثير من المسلمين اليوم اصبح لديه كسل فكري فهو يقلد دون ان يسال وويقوم باعمله التعبدية او الاخلاقية بالوراثة لا بالابداع الذاتي او بالمبداء الديني ؟؟؟؟؟؟؟؟؟؟؟؟؟ ان استضار النية في كل عمل اقوم به هو الكفيل بان نكون ايجابيين في كل تصرفاتنا ؟حيث ان النية محلها القلب وهو محط نظر اله سبحانه ؟"
