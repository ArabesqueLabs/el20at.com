text = "لقد ابدعت فى هذا........امه باسرها بحاجه الى شحن<br />تخلف فاق التصور.........لدينا فى هذه الامه معاتيه واكبر مثل صاحب التعليق السابق الذى لم يضع اسمه<br />اشكرك........واستمر فى الكتابه ولا تلتفت الى زباله الامه انها بحاجه الى اعاده تأهيل<br />سامحونا"
