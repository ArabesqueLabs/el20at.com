subject = "الادوار القذرة"
author = "ابو اسامة"
posted = "2007-06-23"
text = "نحن فى زمن الادوار القذرة من حكام كل همهم السلطة دون النظر الى مصلحة شعوبها وهى نظرة غبية لانه سياتى اليوم الذى ستسقط فيه وسيكون مصيرهم القتل ولن تحميهم امريكا وانظروا الى كل من تبع امريكا من الشاه فى ايران الى<br />صدام حسين ويوما ما سياءتى السقوط لكل هذه القذرات والرهان على الشعوب."
