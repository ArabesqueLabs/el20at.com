subject = "مبن قال ان الشغل عيب ... ؟"
author = "Abdulelah"
posted = "2007-12-19"
text = "شئ جميل جداً عندما نرى الشاب السعودي يتخلى عن كبريائه و يتوجه الى الحج لكي يعمل حلاق في المشاعر<br />واتمنى ان يطول الامر هذا الى جميع الحرف اليدوية<br />نشكر المعهد المهني على التشجيع<br />و المكافئه التي تصل الى 800 ريال يأخذ مثلها طالب جامعي في جامعه الملك عبدالعزيز يدرس اداره و اقتصاد و غير شامله ملابس و ادوات و كتب !"
