[[comments]]
order = 1
subject = "علماء على مائدة القرآن"
author = "علي"
posted = "2007-12-27"
text = "السلام عليكم ورحمة الله وبركاته<br />تخيلوا قناة فيها كل هؤلاء العلماء<br />الدكتور عبد الحي الفرماوي<br />الدكتور عبد الستار فتح الله<br />الدكتور أكرم رضا<br />الدكتور شوقي إبراهيم<br />الاستاذ حازم صلاح أبو إسماعيل<br />الفنان القدير وجدي العربي<br />كلهم جمعهم حب القرآن والرغبة في أن يكونوا ضمن حديث رسول الله صلى الله عليه وسلم \"خيركم من تعلم القرآن وعلمه<br />كل هؤلاء العلماء على قناة الحافظ والتي تهدف لخدمة القرآنوتقديم<br />علومه بطريقة سهله وبسيطة<br />قناة الحافظ طريقك لحفظ كتاب الله بيسر وتيسير"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ما شاء الله"
author = "حبيبة القرآن"
posted = "2007-12-30"
text = "يا رب بارك في كل القائمين على هذه القنوات الهادفة، وأكرم بفضلك القرآن وأهل القرآن، وربنا يبارك للأمة كلها في قناة الحافظ ويحفظها من كل مكروه وسوء، صحيح تردد قناة الحافظ هو 12360 أفقي، أخبر أصدقاءك، حتى يكون لك الأجر إن شاء الله، فالدال على الخير كفاعله"
archived = "2010-03-14"
