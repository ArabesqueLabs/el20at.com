subject = "ده دليل على ايه؟؟؟"
author = "محمد"
posted = "2008-06-02"
text = "أنا شايف ان الكلام اللى بتقوله صح يا فوزى<br />بس ده دليل على انتشار التخلف و التطرف فى الشعب المصرى كله مسلمسن و مسيحين<br />و ده دليل على ان تفيسير الدين و اختزاله فى صورة طقسية مش حاجة فينا احنا المسلمين بس<br />طمنتنى و الله و انتو كمان الحمد لله اللى جمع بينا مسلمين و مسيحين فى كل حاجة<br />حتى التخلف<br />اللهم أقل مصر من عثرتها بمسلمها و مسيحها"
archived = "2010-03-14"
