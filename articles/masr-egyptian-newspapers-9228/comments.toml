order = 0
subject = "يا سامح فوزى يا نصرانى دى ثقافة اصلها فرعونى ومفيش"
author = "مخيمر الصعيدى"
posted = "2008-06-01"
text = "انت مسيحى مصرى - اسف الصح مصرى مسيحى<br />انت عارف انة من ييجى كدة 70 - 80 سنة كان هناك رواق فى الجامع الازهر لتعليم اطفال الاقباط القراءة والكتابة ومبادىء الحساب وبعيد عن الدين وبدون اى حساسية<br />انت عارف ان الكتاب فى القرية بتاعتى بتاع تعليم مبادىء القراءة والكتابة وابجد هوز وحطى وكلمن كان فية اطفال اقباط وبدون اى حساسيات وكانوا يسمعوننا نحفظ قل هو اللة احد اللة الصمد بدون حساسيات<br />وفى الكتاب بتاع تحفيظ القرأن فى القرية من خمسين سنة كانت زوجة سيدنا تجىء الى الكتاب لتضع الكحل فى عيون الاطفال وكان الكحل بيحرق ويقولوا لنا دة سبت النور ويوم الاحد ونحن مسلمين بجيب السعف من النخيل وشم النسيم نحط بصلة خضراء تحت المخدة ونصحى من الفجر نرميها فى النيل<br />دى ثقافة مشتركة<br />المرأة فى الصعيد كانت بتلبس العباية الخيمة ومتشفش صابع من صوابع ايدها ومنكشفش على جنس مخلوق<br />ماتت صناعة الحجر فى المعابد والمسلات وظهرت فى العصر المملوكى<br />اللى بنى معبد الاقصر حفيدة هو اللى بنى جامع السلطان حسن<br />اللى بنى الهرم حفيدة هو اللى بنى قلعة صلاح الدين<br />دى ثقافة مصرية<br />مفيش حاجة اسمها قبطية<br />احنا مصريين<br />غصبا عن عينك هتسمع الاذان وقل هو اللة احد وهتتقبل بصدر طيب وهاسمع جرس الكنيسة واقول لكم دينكم ولى دين<br />زى زمان<br />ايام الفراعنة<br />ناس بتعبد رع وامون وهم اغلبية<br />وناس بتعبد حورس وازوريس وايزيس<br />طوال عمرنا ثقافتنا واحدة وديانتنا مختلفة<br />اوعى تقول فية فرق"
archived = "2010-03-14"
capture_url = ""

