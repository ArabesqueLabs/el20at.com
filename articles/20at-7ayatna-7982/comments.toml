[[comments]]
order = 1
subject = "هكذا هو الليل دائما"
author = "نيفين نيفى نوفا"
posted = "2008-01-13"
text = "نجلاء لا اخفيكى سرا اذا قلت انه مع السطور الاولى من هذا المقال او فلنقل هذه الخاطره وجدتنى اردد داخليا ابيات نزار فى مذكرات عاشق دمشقى حين قال:<br />سقوا فلسطين احلاما ملونه.. و اطعموها سخيف الاقوال و الخطبا<br />عاشو على هامش الاحداث ما انتفضوا..للارض مسلوبه و العرض مغتصبا<br />ثم اعجبنى جدا انتقاللك من العام للخاص و من الخااص للعام والتواصل بين الاحزان الشخصيه والحزن العام<br />و ذللك الشجن الذى يغلف الخاطره خاصه حين الكلام عن الليل<br />الليل<br />تللك المعزوفه اليوميه المتكرره<br />هذا الزائر اليومى الجميل الحزين<br />هذا الضيف المعتاد الذى ياتينا بمعطفه الاسود مع رحيل اخر خيوط الشمس<br />هذه الكلمات من خاطره لى عن الليل كنت قد كتبتها منذ فتره بعنوان هكذا هو الليل دائماو تذكرتها الان<br />نجلاء عبد ربه الخاطره رائعه"
archived = "2010-03-14"
capture_url = ""

