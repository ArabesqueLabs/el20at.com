subject = "انا كمان ليا طلب .. طلب صغير اوى"
author = "اى حد والسلام ( بنت مصرية )"
posted = "2009-03-16"
text = "زى ما طلبوا ان اليوم ده يتعمل اجازة<br />ويتوزع فيه هدايا وورد<br />وكل الكلام العجيب ده<br />انا بقى مش عايزة حاجة من دى<br />انا باطلب حاجة صغيرة اوى<br />مايقتلوش للست الفلسطينية ابنها الوحيد<br />ويهدوا بيتها على دماغها هى وعيالها<br />بعد ما يكونوا قتلوا جوزها واخوها وابوها<br />بزمتكو .. مش دى احق واحدة نقدملها كدة ف يوم عيدها ؟!"
