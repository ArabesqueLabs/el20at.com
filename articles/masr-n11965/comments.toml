[[comments]]
order = 0
subject = "لا توريث ولا ملكية تانى"
author = "مالك الحزين"
posted = "2007-10-18"
text = "احمد فؤاد يرجع تانى - اة - يرجع كمواطن مصرى من حقة ان يعيش فى بلدة وهو مصرى ابن مصرى<br />توريث الحكم - لا - مستحيل - ولا فى الاحلام ان يتم ذلك<br />التجويع للشعب الى حد ما وبعد ذلك ستنفجر الامور ولن ينفع مليون وربع عسكرى امن مركزى ولا غيرة<br />الانفجار قادم<br />قادم<br />والحرامية يبيعون ويهلبون اكبر قدر ممكن سرقتة ويستعدون للهرب من مصر<br />صدقون النهاية قريبة جدا لان الناس جاعت<br />والحكومة فى وادى والشعب فى وادى اخر"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025042005/http://masr.20at.com:80/newArticle.php?sid=11965"

[[comments]]
order = 1
subject = "السخافة بتبان من عنونها"
author = "صريح أوي"
posted = "2007-10-18"
text = "انا شفت الموضوع من بره قولت شكلة موضوع سخيف ملوش لزمة كاتبة واحد زيه<br />وسبحان الله لسه ببص لقيت اسم شريف الدواخلي مضلم الموضوع وعامل نفسه بيفهم زي العادة<br />صحيح الصحافة مهنة من لا مهنة له والا مكنش واحد زيه دخلها<br />سؤال للموقع مفيش حاجة غير الملك فروض تتكلموا عنها ولا ايه؟؟"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025042005/http://masr.20at.com:80/newArticle.php?sid=11965"

[[comments]]
order = 2
subject = "الموضوع جميل جدا"
author = "حسن ابراهيم"
posted = "2007-10-18"
text = "فكره الموضوع ما شاء الله تحفة ... وعلى فكره ديه يمكن احلى من موضوعك فى الدستور بتاع ديمقراطية الملك فاروق لانى حاسس انه لايت قوى ومناسب للموقع ... وانا هادلى بدلوى فى الموضوع ده<br />انا موافق فعلا على اللى انتا قولته .. توريث بتوريث ييبقى الملك فاروق واحفاده احق بالملك"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025042005/http://masr.20at.com:80/newArticle.php?sid=11965"

[[comments]]
order = 3
subject = "يا جماعة النقد يكون بادب وبعدين انتوا بنتقدوا المو"
author = "واحد فاهم"
posted = "2007-10-18"
text = "نفسى بقى نبقى محترمين و نرقى شوية عن الضغائن النفسية التى تظهر وراء اسماء مستعاره لكى نصف ما فى داخلنا من حقد وكره للاخرين ... فواضح وضوح الشمس ان كاتب التعليق الثانى احد العاملين فى الموقع وان حاول نفى ذلك والذى يريد ان يسئ لزميلة فى العمل ويقلل منه أمام الاخرين ليشجع الاخرين على سبابه \" بيفتح القعده يعنى \" و بعدين عاوز تعرف الفرق بين النقد وقله الادب اقرأ التعليق لو كان النقد للموضوع فهو الاولى وان تطرق الامر لمحرره فتكون الثانية ..<br />انا بدخل على مواقع عالمية كثيره فيها مئات التعليقات لم اجب فى موقع واحد مثل ما يحدث هنا ...<br />وبالمناسبه يا عم شريف اعرفها كده عشان ترتاح طول ما انتا بتتشتم اعلم ان الاعداء لم يستطيعوا ان يتحكموا فى اعصابهم من حقدهم على جمال موضوعك ولذا يحاولون تثبيط همتك ... فلا تنظر اليهم ... لانك بصراحة من احسن الناس اللى بتكتب فى الموقع"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025042005/http://masr.20at.com:80/newArticle.php?sid=11965"

[[comments]]
