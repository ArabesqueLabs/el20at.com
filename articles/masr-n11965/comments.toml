[[comments]]
order = 13
subject = "مواطن مصرى محب لمصر ويأمل أن يكون مستقبل مصر مشرقا"
author = "اكتب اسمك هنا"
posted = "2008-08-08"
text = "إنى أرحب جداً بفكرة عودة الملك أحمد فؤاد إلى مصر لأنه برغم مرور كل هذه السنوات منذ خروج الملك فاروق من مصر لم ينقطع عن حبه لمصر وشعب مصر وإن حياته فى الغرب خلقت منه إنساناً مكتمل الفكر ويستطيع أن يخلق التغيير فى المفاهيم السائدة ويكفى إحساسه بالفخر وفرحته العارمة عندما إنتصرت مصر فى السادس من أكتوبر وبالرغم من إمكانياته المادية المتواضعة خاطب الرئيس أنور السادات وتبرع بالمال وقد أقر بذلك الرئيس السادات فى خطابه أمام البرلمان المصرى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 14
subject = "صراحه"
author = "فريده"
posted = "2008-09-04"
text = "بصراحه انا اجد ان الحكم الجهوري غير شرعي<br />وبصراحه ارى لو ان الحكم كان ملكي لما وصلت مصر لدرجه من الانحطاط الخلقي<br />صحيح اني لم اعش في مصر لكن لكل بدل مراه ومراه مصر لكل الدول هي الفن<br />ومما ينشره الفن سواء في الافلام او المسلسلات نرى الواقع غالمر الاليم الذي تدحرجت اليه مصر<br />لقد كان القاروق ملكا بكل مافي الكلمه من معنى وقد اخذ عرشه منه بغير شرعيه<br />كما ان الرئيس سيحول الرئاسه لابنه بغير شرعيه ايضا<br />ارى انه من الاحسن تغير اسم الجمهوريه المصريه للمملكه المصريه<br />لان هذا مصيرها ...................................."
archived = "2010-03-14"
