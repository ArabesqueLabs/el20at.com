[[comments]]
order = 7
subject = "ربنا ما يقطع لكو عادة"
author = "واحد من الناس"
text = "هو احنا خلاص اتعودنا نرضى بالموجود؟؟؟؟؟ هو مش فى حاجة اسمها انتخابات؟؟؟؟ ولا احنا قلنا ان الكل وحش فكل اللى قدامنا اننا نختار احسن الوحشين لان مش فى بديل؟؟؟؟؟؟ لا فى بديل وبدايل كمان مش بديل واحد (الانتخابات) وساعتها كل واحد هايقدر يختار ويروح ويدى صوته( بس س س س س س س س س س س )عايز اقول حاجة (ان الله لا يغير ما بقوم حتى يغيرو ما بانفسهم) ومن اعمالكم سلط عليكم"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025042005/http://masr.20at.com:80/newArticle.php?sid=11965"

[[comments]]
order = 8
subject = "شريف تاني"
author = "أبو شريف الحقيقي"
text = "عشان بس اوضح للساده القراء اد ايه البتاع اللي اسمو شريف ده ..اولا كتب رد علي اساس انو واحد من القراء باسم مستعار واحد فاهم و بعد ما اتهزء تاني قام كاتب رد قال باسم واحد يعني حتي مفكرش يجيب اسم جديد و في الردين نفس الاسلوب المتعالي و الغرور علي ايه مش عارف مع انك في سوق البهايم متسواش تعريفه بجد انت يا شريف عندك نقص نصيحه لوجه الله شوفلك دكتور نفساني بدل ماانت عمال ترد علي القراء باسم مستعار يا ......"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025042005/http://masr.20at.com:80/newArticle.php?sid=11965"

