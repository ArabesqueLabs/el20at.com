[[comments]]
order = 10
subject = "فليقررالشعب مصيره"
author = "خالدالامير"
text = "اعتقدانه ليس من حقنا ان نتكلم نيابه عن شعب مصر فاذا كان الشعب يريدالعوده للملكيه فليقرر ذلك ولا يفرض علينا احد رايه او يمهد لذلك لاجمال ولا احمد نحن نريد ان يختار المصريين جكامهم ولان ريد وصايه ولا عرش ولا رئيس يحك من خلال الامن او الحاشيه الشعب هو الذي يقرر وهناك طرق كثيره لذك بدون تزوير او تزييف"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112214531/http://masr.20at.com:80/newArticle.php?sid=11965"

[[comments]]
order = 11
subject = "انفاذ مايمكن انقاذة الابتعاد عن مبارك واسرتة والملك فاروق واسرتة احنا عاوزين الاخوان نجرب ونحكم انما ملكية او جمهورية شبة ملكية زى ماهو حاصل دلوقتى"
author = "حلاب النمل"
text = "الاوضاع تتدهور من يوم ليوم والشعب بقى دلوقت تحت خط الفقر بمية دور تحت الارض وحسبى اللة ونعم الوكيل على كل ظالم"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112214531/http://masr.20at.com:80/newArticle.php?sid=11965"
