subject = "بلاها ناديه بلاها سوسو"
author = "نيفين نيفى نوفا"
posted = "2007-10-19"
text = "فكره المقال تحفه بصراحه<br />بس لا احمد فؤاد و لا جمال ينفعو و الاسباب معروفه و قتلت بحثا<br />انا وا كيد كل الناس معايا عايزين حد يحب البلد دى بجد و يحقق و لو قدر معقول من التنميه و ميسرقش موارد البلدو يحفظ لكل مصرى حقوق المواطنه<br />بس"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025042005/http://masr.20at.com:80/newArticle.php?sid=11965"

