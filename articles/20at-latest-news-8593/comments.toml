subject = "يقال بإنه يشوه صورة الإسلام ووسطيته .. ويحرف في بع"
author = "محمد نواف الحمدالله ..."
posted = "2008-03-26"
text = "إن عمرو خالد .. ليس سوى إنسان أراد أن يعمل من نفسه شيئاً كبيراً، وهو في الواقع ليس إلاّ قزماً .. لإنه ينتهج أسلوباً وطريقةً تكاد تكون غبية ..<br />إنننا لانتهمه زوراً وبهتاناً .. ولكن الأدلة والبراهين والحجج تقول كل ذلك ..<br />ثم يعني أيعقل أن نقارن المدعو بـ ( عمرو خالد ) بشيوخ الإسلام _ حفظهم الله ورعاهم أجمعين _ .. كفضيلة الشيخ الدكتور / عمر عبد الكافي هو إنسان واعي ومثقف ومدرك وملم لأمور دينه ودنياه، وكذلك فضيلة العلامة الشيخ الدكتور / عبدالرحمن السديس، فهو أيضاً إنسان يمتلك الكثير من الخبرة في مجال الدين والإسلام ويساهم بحفظ هذا الدين القويم، وفق أسس متينة وقوية .. ولاننسى فضيلة الشيخ الدكتور / أحمد الكبيسي .. والكثير الكثير منهم .<br />فمن أين هذا (عمرو خالــــــــــــــــــــــــد ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ )<br />أمركم عجيب ياناس .. تصدقون كل شيء .......... ؟؟؟ !!! ؟؟؟ !!! ؟؟؟ !!!"
archived = "2010-03-14"
