subject = "اتقوا الله في أنفسكم"
author = "عاشق فلسطين"
posted = "2008-03-26"
text = "السلام عليكم ورحمة الله وبركاته , أولا , أنا لا أصدق كل ما سمعتو عن الشيخ الفاضل الداعية عمرو خالد , شوفوا يا جماعة ,<br />كل بني آدم خطاء , سيبوا الشيوخ في حالهم , كل الناس بتخطئ , خلي عمرو خالد يعصي , هدا الإشي بينو وبين رب العالمين سبحانه وتعالى , بس ما داموا خدم الإسلام , وقف عند حدك سيعتها , روح يا محمد نواف الحمد الله يا حقير اخدم الدين الإسلامي الحنيف متلو , الله ياخدك يا بعيد , وتاني إشي هو خدم الإسلام خدمة عظيمة وتأثيرو على الشباب كتير منيح , فرجائي عدم سب هدا الرجل لأنه خدم الدين الإسلامي في كل أنحاء العالم بصراحة , ولا الحيوان محمد نواف الحمد الله , برضوا في كل مكان ما بتسيبش أحد في حالو , بتمدح شيوخك هدول بس عشانهم يا حقير أردنيين زيك خرة , والنعم بالمصريين وبالشعب المصري الشقيق<br />(والله يلعن الأردن ويخسفها وياخدها أخد عزيز مقتدر)"
archived = "2010-03-14"
capture_url = ""

