[[comments]]
order = 7
subject = "رد خاص على ( عاشق فلسطين )"
author = "محمد نواف الحمدالله ..."
posted = "2008-03-30"
text = "إلى المدعو ( عاشق فلسطين)،،، مابك يا عزيزي ؟؟؟ أهنالك من أدخل في مؤخؤتك عصا أو سلك كهربائي فتكهربت به أو دودة دخلت في مؤخرتك أم ماذا يا هذا ؟؟؟ أقولها / وبكل صراحة وشفافية ونزاهة / بأن هذا الشخص المريض نفسياً، والذي<br />يعاني من إضطراب داخلي ( نفسي )، والذي لا أدري سببه ؟! .. والذي إذا ما رأئ شيئاً خطأً أقام من مكانة كأن صاعقة صعقته في عضوه الذكري، ليقوم هذا الكلب الجائع .. اللاهث .. السكران .. المسعور بالرد على ماكتب من تعليقات على أي موضوع من مواضيع موقع عشرينات ( الذي أكن له وافر الإحترام والتقدير ) ليعلق بعدها بكلامٍ بذيء .. يخدش بالحياء، منافٍ للأداب العامة، ومخالف للنظام العام في المجتمع العربي، وأيضاً تجاوز للعادات والتقاليد الذي نشأنا عليها كإخوان عرب مسلمين كنا أو مسيحيين فهذا لا يؤثر على الإطلاق !!! إن القول بأن هذا الشخص ( عاشق فلسطين ) بأنه إنسانٌ طبيعيٌ لايشكو من علةٍ أو ماشابه,,, فهو قولٌ مغلوطٌ مائة في المائة، لأنني وبصراحة تامة أرى في عينيّ هذا المخبول، المعتوه، المشطوب، الذي لايفقه بالحياة شيئاً سوى النوم، والأكل، والشرب، وغير ذلك من تلك الأمور .. إنني أنصح هذا المغفل بالإبتعاد عن الشعب المصري لإن هذا ليس من شأنه ولا هو من شغله أن يدافع عنهم وأن يجلّهم ويحترمهم شديد الإحترام ,,, فالشعب المصري ليس بحاجة إلى أناسٌ قد خرجوا عن سُلم الإنسانية، ونسوا في يومٍ ما بأنهم مخلوقون من طين ( تراب ) .. قكما قال الشاعر اللبناني الكبير : إيليّا أبو ماضي :<br />نسي الطين ساعةً أنه طينٌ حقيرٌ .. فصال تيهاً وعربد<br />وكسا الخز جسمه فتباهى .. وحوى المال كيسه فتمرد<br />يا أخي ,, لاتمل بوجهك عني .. ما أنا فحمةٌ ولا أنت فرقد<br />إلى هنا أنصح // عاشق فلسطين // بأن يذهب إلى أقرب طبيب نفساني لكي يعاجله من مرض فقدان الهوية، وإضطراب الشخصية، وتكبر الذاتية العليا، وجنون العظمة والإضطهاد .. وإنشالله سوف يُشفى من تلك الأمراض .. ففي حالة عدم الفلاح .. فلا يوجد حل آخر سوى الإنتحار من أعلى قمة في العالم ( قمة إيفرست ) لكي يريح نفسه، ويريح الناس معه، فهو شرٌ وبلاءٌ لذاته، وللناس ممن حوله، يارب لاتؤاخذنا إن نسينا أو أخطأنا .. ربنا أنت الغفور الرحيم ..<br />إلى السيد ( عاشق فلسطين ) إذا كان هناك عنوان للجهل والتفلسف والتحجر والتخبط في أمور الدين والدنيا فهو أنت بلا شك .. إذا كان هناك رمزٌ للغباء والتفاه والسفه والجنون فهو أنت بلا منازع .. إذا كان هناك موسوعة تتحدث عن أكبر وأعظم معتوه في العالم أجمع فهو أنت لا محالة .. إذا كان هناك للمتخلفين رئيس لهم فأنت هو ذاك الرئيس بمرتبة الشرف والإمتياز ..<br />أيها الشعب المصري الشقيق أنتم أخوة لنا وأحبابٌ لنا .. كلنا سواءٌ كأسنان المشط وليس منا من هو أفضل من الآخر ..<br />وليس منا من على رأسه ريشة .. وليس منا من هو أذكى وأعلم من الثاني .. كلنا أبناء تسعة ( كما يقولون ) ..<br />والشيخ ( عمرو خالد ) قد ذاع سيطه كثيراً _ أقصد في الآونة الأخيرة _ هو رجلٌ خدم الإسلام والمسليمن شدد .. ومتزن .. وخلوق .. وأنا من أشد الناس إعجاباً بفكره وشخصيته المرنه .. وفقه الله تعالى وأمد الله في عمره وفي عمر شيوخ الإسلام جميعاً بلا تمييز .. فمصر كما هو معروف عنها من أكثر الناس حفاظاً لدين الله ( الإسلام ) ..<br />ولكن دعونا ننظر قليلاً إلى أعماق هذا الشيخ الجليل .. يقولون عنه الكثير ( والله تعالى وحده أعلم بمايقولون ) ..<br />دون ذكر ماقال وما عمل .. فالحجج كثيرة وعديدة لمن أراد أن يعرف .. فهنالك مواقع كثيرة تكلمت عنه وأنه أمره مشكوك _ شيئاً ما _ وأنا لا أقول أو أفتي به .. ولكن من كلام أناسٌ هم أهلٌ للثقةولا غبار عليهم .. ومعروفون جداً ..<br />أرجو من الجميع أن يسأل جيداً ((((( وجيداً )))))) عن هذا الرجل .. لإن إن بعض الظن إثم .. وأنا أعرف هذا الشيء وأعييه جيداً<br />وليست هي المرة الأولى .......... بل هي مراتٌ كثيرة لاتعد ولاتحصى ..<br />وها أنا، وللمرة الثانية أكرر أسفي من الشعب المصري .......................................................<br />وحما الله الإسلام والمسلمين ..<br />وتحيا أمة الإسلام دائماً وأبداً ..<br />ولتحيا الشعوب العربية والإسلامية ..<br />ولــ ( عاشق فلسطين ) كلٌ يعمل بأصله .. أنت شتمتني وسببتني أمام الملأ .. وقللت من قيمتي أمام الجميع .. وههززت من كياني .. وضربت بـ شخصيتي بعرض الحائط .. والطامة الكبرى في تعليقك أنك سببت على بلدي ( الأردن ) وعملته بأنه لايسوى شيئاً .. وكأن شيئاُ لم يحدث نهائياً .. فهذا أمر ليس بغريب عليك يا فلسطيني ..<br />ومع ذلك كله ..<br />لا أقابلك بالمثل لأنني إنسانٌ محترم ،، وواثقٌ من نفسي،، ولا أخاف من أحد إلاّمن خالقي،، وأنا إنسان عاش وتربى في بيئة كلها أدب واحترام وأخلاق عالية ( الأردن ) التي هي بلدي وحياتي وروحي وكل شيء .. ولا أنسى بأن أهلي علماني بأن أحترم آراء الناس بغض النظر إن كانت آرائهم ووجهات نظرهم صحيحة أم خاطئة .. فكل إنسان يخطىء وخير الخطائون التوابون .. أليس كذلك يا عاشق فلسطين ؟؟؟؟؟؟؟ !!!!!!!!!!!<br />ومع هذا .. لن أرد عليك لا والله لست براد عليك !!!<br />وذلك لأسباب عدة >;>;>;>;>;>;<br />أولاً : كرامة لنفسي ..<br />ثانياً : من أجل سمعة أهلي ( والدي، أخوتي وأخواتي، عائلتي، عشيرتي، أصحابي، ناسي ..... الخ ) ..<br />ثالثاً : من أجل بلدي العزيز والغالي على قلبي ، والتي من أجله نموت ليحيا ( المملكة الأردنية الهاشمية ) .. لشعب الأردن .. ولحكومته الرشيدة .. ولملكه المعظم ..<br />رابعاً:للشعب المصري الشقيق والعزيز الذي أكن له كل الإحترام .. ووافر المحبه والشكر .. فهم خير أجناد الأرض ..<br />خامساً وأخيراً : للشعب الفلسطيني الذي أعشقه وأحبه كثيراً . والذي يربطنا به علاقات وطيدة ومتينة .. ففلسطين حرة بإستثناء الحثالة ( عاشق فلسطين ) ........<br />وشكراً للجميع .. وللعشعب المصري ( على راااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااسي )<br />والسلام عليكم ورحمة الله وبركاته ،،،"
archived = "2010-03-14"
