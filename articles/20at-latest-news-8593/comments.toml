subject = "بلد اسلامي"
author = "باحثة_عن _الحقيقة"
posted = "2008-03-26"
text = "السلام عليكم:<br />لن أعلق على تكفير الشيخ السلفي و لكني أعترض على عدم تحريه أن الأستاذ الكريم عمرو خالد قد قال هذا الكلام عن ابليس الملعون, مشكللتنا كمسلميين أن أي معلومة تأتينا من أحد لا نستطيع سوى تصديقها , من غير البحث فيها أو حتى السؤال عن مدى صحتها, أنا لم أسمع ولا في أي من أشرطة عمرو خالد أنه قال هذا عن ابليس, و حتى لو قال فمن الممكن أن يكوون ربط كلامه بحديث آخر , يفسر ما يعنيه, الأستاذ ليس تلميذا و لا صغيرا لعدم<br />اتقوا الله في الدعاة, ما دمنا غير قادرين على احترام العلماء و الدعاة فمتى سوف يتحسن حالنا, ان الحيتان و النمل في الجحور تستغقر لمعلم الناس الخير.<br />( أليس منكم رجل رشيد)"
archived = "2010-03-14"
