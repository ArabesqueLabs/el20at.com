subject = "وفق الله الجميع لخدمة دينه"
author = "اخوكم فى الله ياسر"
posted = "2008-03-26"
text = "السلام عليكم ورحمة الله وبركاته<br />أحبتى فى الله لا تنفقوا اوقاتكم هباء فى مهاجمة الدعاة بل عليكم الأجتهاد فى توصيل هذه الدعوة الغالية للناس<br />أما عن الأستاذ عمرو (أبا على) فالعبد الفقير أخوكم كانت هدايتى على يديه جزاه الله خير الجزاء<br />سامحنى يا أستاذ عمرو سامحينى يا أختى الباحثة عن الحقيقة لقد تأخرنا كثيرا<br />أخى الفلسطينى رعاك الله بث أخيك محمد مشاعر الحب يهنأ هو فى حب عمرو يفرح عمرو بنقد الجابرى تحيا الأمة فى سلام والله أكبر ولله الحمد"
