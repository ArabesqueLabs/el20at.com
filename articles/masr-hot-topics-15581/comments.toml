text = ":cry: :cry: :cry: اولا انا عوذ اقول انى مصر لسة بخير خلو بلكو انى اى حد هيمسك البلد من برة مصر هيكون طمعان فى خرها لسة البلد بخير انا بتفاقيل انى مصر حلها هيتعدل والحاجة هترخص وهترجع احسن من الاول انا بتمنا انى كل شباب مصر تقف مع رائس محمد حسنى مبارك بس اهم حاجة يغير الوزارة بتاعتو كلها<br />:sad: :sad: علشان دول اوسخ وزارة على وجة الارض انا بقول الكلام دة مش خايف انا بحب مبارك وجمال مبارك ولو الريس تعب يسيب الرئسة لبنوة بس يارب يبوس للشباب وللبلد ولاغالبة شوية وهتم بلبد شوية ويعين الناس الى بقلها سنسن متعينة بعقد وربنا معاك يا رايس وفيش حد هيخد الرئسة منك ابدااا ولا تقلى بقا البردى ولا تقلى غيروة الرئيس حسنى مبارك لا بلش وكلنا معاك يا رئيس بنحبك يا رئيس"
