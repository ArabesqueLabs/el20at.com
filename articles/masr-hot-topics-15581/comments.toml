text = "على فكرة لو كل واحد هيدخل يقول هو مع مين او ضد مين او مين وحش او حلو يبقي مصر هتفضل على حالها و هتفضل كده<br />بس ربنا ميزنا بالعقل و طالما في عقل يبقي ندور بينا في اللى هيقيم العدل لانه اساس الملك<br />مش لازم كل مرشح يقول هو هيعمل ايه لمصر<br />المهم احنا دورنا ايه نعمله و نغيره في نفسنا و في البلد<br />العيب مش من حاكم مافيش حاكم هيشوف بلده بتضيع و يسيبها<br />لاء العيب فينا احنا مش فالحين غير في الكلام و بـــــــــس عمرنا ما قولنا و عملنا كل واحد يدخل يقول تعليق ياريت يبقي رئيس جمهورية نفسه يفكر هو هيعمل ايه عشان يغير مصر و يبداها من بيته و جيرانه و حارته و هكذا<br />يارب حد يوافقنى :-) انا عموما بغير مصر و بداتها من شارعنا و ان شاء الله هتوصل للمحافظة و كان الله في عون الجميع من حكام و محكومين"
