order = 7
subject = ""
author = "mas3ood"
posted = "2009-08-17"
text = "بسـم اللـه الرحمـن الرحيـم<br />{إِنَّ اللَّهَ لا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنْفُسِهِمْ}<br />إضراب 10 سبتمبر من أجل لا لجيمي<br />بالتـأكيـد كلـنا نعـلم أن مصـر تسـتحق أن يحكمها من هم أفـضل من هؤلاء الأفاقيـن, مصـر لم تصـاب بالعقـم ولم يمـت رجالـها في الـحرب لكـي لا يبقـى غيـر هؤلاء ليحكموها.<br />دعوة لشـعب مصـر الخانع الخاضع لعمل إضراب يوم الخميس 10 سبتمبر بالبـقاء في المـنازل لكـلا من القـطاع العـام والخـاص. إننا لن نخـرب بلـدنا ولكنـنا سنـرسل رسالة لجيـمي وأعوانه أننا نريد اختيار من يحـكمـنا وأننا لا نسـاق كالأنعـام.<br />إنهـا دعوة للحـفاظ علـى ما تبـقى من كرامة هذا البـلد المدحور المـنهوب. إنها دعوة لك أخي تسـتنـفر ما تبـقى من كرامتـك لتبـقى في بيـتك يوم 10 سبتمبر.<br />أنشـر هذه الرسالة لكـل معـارفك واشرح هذه الرسالة للبسطاء من شعبنا لنـجمع هذا الشعب تحـت راية لا للتوريث.<br />{إِنَّ اللَّهَ لا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنْفُسِهِمْ}<br />صدق الله العظيم"
archived = "2010-03-14"
