text = "اي واحد او واحدة فشل في تجربة يتم تدوينها في مجموعة مدونات الفاشلين<br />يعني فشلا عاطفيا يكتب التجربة<br />فشل دراسية يكتب التجربة<br />فشل عسكريا يكتب التجربة<br />فشل امنيا يكتب التجربة<br />فشل اقتصاديا يكتب التجربة<br />وبالتالي الشباب الجديد لما يقرأ هذه المدونة يبقى عنده حصانة ضد الفشل"
