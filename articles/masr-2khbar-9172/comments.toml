[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-09-17"
text = "لا أعرف إن كان النائب العام قد فتح تحقيقا في قضية اختفاء وفاء قسطنطين أم أنه لم يتحرك حتى الآن في البلاغ الذي تقدم به الأستاذ نجيب جبرائيل المحامي ضد الدكتور زغلول راغب النجار الذي اتهمه فيه بتكدير السلم العام وإثارة الفتنة بحديثه عن مقتل وفاء قسطنطين داخل دير وادي النطرون الذي خطفت إليه بعد أزمة إشهار إسلامها والمظاهرات التي أعقبتها ، حتى الآن الاتهام راسخ لم يتغير عن قتل وفاء قسطنطين ، حتى الآن لم يتراجع الدكتور زغلول النجار عن كلامه ، وهو أمر خطير جدا ، لأننا أمام مواطنة مختفية يتحدث الناس عن مقتلها بفعل فاعل ، دون أن تتحرك أجهزة الدولة الأمنية أو القضائية ، وهذا ما يضعف الثقة بالدولة ذاتها ، وبالقانون وبالأمن وبالنيابة العامة ، ولقد نشرت أمس تصريحات لأحد رهبان دير الأنبا بيشوي يقول فيها أن وفاء مريضة منذ دخلت الدير ، وأن حالتها الصحية سيئة ، وأنها ممنوعة من مقابلة أحد أو الحديث إلى أحد إلا بإذن البابا شخصيا ، وأنها مقيمة في إحدى الحجرات الخاصة بالبابا وهناك مشرفة تمر عليها كل أسبوع لتنظر في احتياجاتها ، وبأمانة شديدة هذا المشهد يعطي انطباعا بحالة احتجاز وسجن قسري ، كما أنه يزيد من الشكوك حول حياة هذه السيدة بالفعل ، وقد يفهم على أنه تمهيد من جانب الكنيسة لإعلان نبأ وفاتها بعد معانات طويلة مع المرض ، ولا يعرف أحد إن كانت مريضة بشكل عادي أم أنه مرض ناتج عن ضغوط من أي نوع أو سوء تغذية أو سوء رعاية صحية ، كما لم يبين المصدر الكنسي أي معلومات عن طبيعة وكيفية الرعاية الصحية التي تلقاها ، خاصة وأنه يقول بأن حالتها سيئة ، لماذا لا تنقل إلى إحدى المستشفيات الخاصة تحت حماية عالية ، هل يمكن تصور أن أمن الكنيسة أكثر دقة وقوة وهيمنة في الحماية من أمن الدولة ذاتها ، وهو الأمر الذي سيستدعي الحديث عن مصادر هذه الدقة والقوة والهيمنة وآليات الحماية وأدواتها ، كما أن المسألة غريبة جدا أن يمنع مواطن من الكلام أو الاتصال أو الحركة بأي جهة أو شخص إلا بتصريح من رجل الدين ، أيا كان منصبه ، مع وافر احترامي لمكانة وشخصية البابا شنودة ، ولكن المبدأ في حد ذاته خطير جدا ، خاصة إذا تأسس كسابقة تتيح لغيره ذات الحق ، وهو ما يعني انقلابا دستوريا لإلغاء عشرات المواد الدستورية التي تضمن حرية الحركة والانتقال والسفر وغيره للمواطنين كافة ، لا أعرف لماذا أشعر بأن هناك منطقة فراغ مقصودة في واقعة وفاء قسطنطين ، بين الدولة وبين الكنيسة ، وكأن الطرفين يملكان معرفة مشتركة بحقيقة واحدة ، وأن هناك اتفاقا ضمنيا أو شفاهيا أو بالإيحاء ، بأن تبقى تلك المعرفة سرا بين الطرفين ، لأن كل ملابسات الواقعة غير منطقية على الإطلاق ، ولا يمكن تصور حدوثها في \\\"دولة\\\" ، قد يمكن تصورها في علاقات ميليشيات مثلا في العراق أو لبنان أو أفغانستان ، ولكن تصور حدوثها بتلك الغرابة والغموض واللامبالاة واللاقانون واللا أمن ، بين الدولة وبين بعض مؤسساتها الدينية أو أحد رعاياها ، فهو خارج حدود المنطق والعقل ، أي عقل ومنطق يقول بأن المواطنين يطالبون الكنيسة بمعرفة مصير مواطنة مختفية في حين أن الدولة ذاتها تعتبر أنها غير معنية بالمواطنة حتى لو قالوا أنها الآن \\\"قتيلة\\\" ، هناك سر ما ، تتكتمه أطراف كثيرة ، وأخشى أن يفضي في النهاية إلى كارثة"
archived = "2010-03-14"
