[[comments]]
order = 0
subject = "خط الصعيد"
author = "بدران"
text = "واللة انا فى بداية حياتى اشتغلت مدرس ابتدائى فى بلد الخط - واعرف الخط جيدا<br />انما يرحمة اللة - كانت حياتة قصيرة ومرة اتغديت وياة فى جنينة شجر جوافة على شط ترعة الابراهيمية - وقال لى<br />الشجاع بيموت مرة واحدة والجبان بيموت كل يوم مرة او مرتين"
archived = "2007-12-25"
capture_url = "https://web.archive.org/web/20071225234517/http://masr.20at.com:80/newArticle.php?sid=13487"

