[[comments]]
order = 0
subject = "البكاء على المليارات المسكوبة"
author = "مصرى"
posted = "2009-02-15"
text = "لو المليارات التى انفقناها على مواخير وحانات وفنادق الشرم انقناها فى بناء مصانع انتاجية فى الزقازيق وطنطا واسيوط وسوهاج وقنا لتغير وجة مصر الحضارى ولما كان عندنا بطالة ولا فقر ولا عشوائيات ولا جوع ولا مرض<br />ولكن للاسف<br />كانت حقبة سوداء فى تاريخ مصر وهتمر كفترة حالكة السواد<br />وماذا يجدى البكاء على اللبن المسكوب ؟<br />العوض على اللة"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218123942/http://masr.20at.com:80/newArticle.php?sid=19985"

[[comments]]
order = 1
subject = "سلامتك يا ريس"
posted = "2009-02-16"
text = "ألف سلامة لضهر سعادتك<br />إحنا فداه وف رهن إشارتك<br />كل الشعب بتاعنا بحاله<br />نسي أحزانه وخيبة حاله<br />وبيتمنى شفاك وسعادتك<br />ترجع لينا بألف سلامة<br />ويسلم لينا ضهر سعادتك<br />الأسعار راح نتحملها<br />والأوضاع مش ح نعدِّلها<br />والتغيير ماحناش عايزينو<br />إحنا هدفنا خلاص عارفينو<br />ترجع لينا بألف سلامه<br />ويسلم لينا ضهر سعادتك<br />كرسي سعادتك جوّه عنينا وفوق الروس<br />مين يستجري يقرِب جنبو .. أو يتّك عليه ويدوس<br />الرجلين ح نمددهالك وبعون الله القاعدة كمان ح نجِّددهالك<br />وتعيش مرتاح العمر عليه من غير ماتحس بأى آلام<br />فـ الفقرات أو فـ العصعوص<br />بس انت كمان ماتغيبش علينا الله يخليك وتسيبنا نلوص<br />دى الأيام من غير تصريح من فم سعادتك ماتعديش<br />والأحلام من غير ماتعيشها معانا سعادتك تبقى كابوس<br />ألف سلامة لضهر سعادتك<br />إحنا فداه وف رهن إشارتك"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218123942/http://masr.20at.com:80/newArticle.php?sid=19985"
