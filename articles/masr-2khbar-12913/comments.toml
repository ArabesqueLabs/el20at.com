posted = "2009-08-12"
text = "فين الوزير بتاع الجودة فى التعليم<br />وشهادات الاوزو<br />وتطوير التعليم والكادر<br />واجتماع ماما مش عارف مين وغيرة وغيرة<br />هى الناس بتحب تعمل مؤتمرات للتعليم علشان يتصوروا فى التليفزيون وخلاص<br />صحيح<br />الراجل الصعيدى اللى شاف مؤتمر تطوير التعليم فى التليفزيون وقال لى<br />يا ابنى كلة بكش<br />صحيح يا عم<br />كلة بكش"
