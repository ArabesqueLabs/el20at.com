subject = "العبارة"
author = "بدران"
posted = "2008-08-08"
text = "نظام حكم فاسد ومعفن ويجلس على قمة السلطة فية شخص متخلف عقليا دمر البلد وخلاها راحت فى ستين داهية<br />دمر الزراعة بدعوى تحريرها حتى جاعت الناس ووقفت فى طابورالخبز<br />دمر الصناعة المصرية تحت دعوى الخصخصة واصبحنا فى زبالة العالم<br />دمر القضاء المصرى واصبح-نا نرى تبرئة الفساد والمفسدين كحادث العبارة وبتاع اكياس الدم<br />الجديش منخصص لحماية اسرائيل وتدمير انفاق على الحدود وقتل الافارقة الذين يعبرون الى اسرائيل"
archived = "2008-08-12"
