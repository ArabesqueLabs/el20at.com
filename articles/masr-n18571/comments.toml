[[comments]]
order = 3
subject = "على الزنوج المصريين عدم الياس"
author = "مش اوباما"
text = "امريكا كانت مليانه سود<br />والحمد لله ربنا نصرهم وجابلهم اوباما<br />وممكن السود يعملوا حزب سياسي اسمه حزب اسمه (اسمر.. حبيبي الاسمر...) ويرشحوا واحد من اعضاء الحزب ضد جمال مبارك في الدورة القادمة<br />وان شاء الله حيكسب زي اوباما ما كسب<br />يعني اوباما كسب ادام واحد ابيض وكل البيض انتخبوا اوباما"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 4
subject = "صحيح واله (قضية مهمة) كام ضابط اسود في الجيش والشرطة المصرين"
author = "مش كاتب"
text = "فعلا يا اخي ملاحظة مهمة جدا<br />وزارة الدفاع المصرية يا ترى فيها كام ضابط اسود متهيألي ولا ضابط<br />ووزارة الداخلية فيها كان ضابط اسود<br />فعلا ملاحظة مهمة جدا اللي يعرف يقولنا"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 5
subject = "الله يخرب بيوتهم (هما دول الخراب)"
author = "مش الانبا بيشوي"
text = "1-المؤسسة القبطية لحقوق الإنسان (سويسرا)<br />2-الأقباط متحدون (إنجلترا)<br />3-الهيئة القبطية الهولندية<br />4-الهيئة القبطية الأوربية الفرنسية<br />5-منظمة أصدقاء الأقباط (فرنسا)<br />6-هيئة الشباب القبطي الفرنسي<br />7-الهيئة القبطية النمساوية بجراتس<br />8-جمعية الاندماج القبطي النمساوي<br />9-المركز الثقافي القبطي (اليونان)<br />10-الهيئة القبطية (السويد)<br />11- ألمانيا الهيئة القبطية الألمانية<br />12-ايرلندا الهيئة القبطية بايرلندا<br />13-المجر هيئة أقباط المجر<br />المنظمات المتعاونة مع الاتحاد<br />1-المؤسسة القبطية للمساعدة القانونية (أمريكا)<br />2-منظمة مسيحي الشرق الأوسط (كندا) بتقديم كل تسجيلات وقائع الاعتداء<br />3-الموقع الإلكتروني الأقباط الأحرار"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 6
subject = "اتجاهات خبيثة يغذيها اقباط المهجر عن النوبة"
author = "مصرى"
text = "اولا النوبيون مسلمون سنة 100 % ومتمسكون بدينهم ويعتزون ببلدهم مصر<br />كون بعض مرضى النفوس استغل لهجتهم النوبية ويريد عمل انفصال بينهم وبين بقية المصريين فهو واهم لان التعليم انتشر هناك وتحسنت لهجتهم واصبحت عربية مصرية<br />بل ان بعض النشطاء الخبيثون راح يحى اللهجة النوبية على اساس الوهم انها اصل اللغة القبطية ولكنة خاب املة وظنة وارتد حاسر القلب واصبح يائس<br />النوبيون جنودا وضباطا يحرسون حدود مصر كلها على سواحل البحر الاحمر او ليبيا او الجنوب وهم الحزام الاسود الذى حمى مصر وقال عنهم موسى د\\\\\\\\يان الحزام الاسود او الرادارات المتحركة<br />لم يتم تهجيرهم قسريا ولكن بنى لهم قرى نظيفة مزودة بالماء والكهرباء فى الوقت الذى لم يكن فى قرية مصرية كهرباء<br />وعندما استقرت البحيرة - بحيرة ناصر - سمح لهم بالعودة<br />النوبيون سعداء بجنستهم المصرية ومتعصبون لدينهم الاسلامى ضد اى منحرف يريد استغلال لونهم او لهجتهم<br />معظم النوبيون يتبعون السودان والقليل منهم داخل الحدود المصرية يعنى اغلبية النوبيون ومدنهم تقع فى السودان<br />شكرا لاخواننا النوبيون حرس الحدود المصرية"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 7
subject = "أيه الحكاية"
author = "الأسوانى"
text = "أيه الحكاية ياجدعان؟ كل واحد عامل نفسه وطنى أكثر من التانى.. وكله هاتك ياتصنيف.. ده أنفصالى وده مسيحى من بتوع المهجر... المطلوب أن كل الناس أمام مصر سواء .. مش ناس واكلين الخير كله ..لأ هابرين الكل .. وناس واكلين ... لا مؤاخذة.. القاهرة والأسكندرية مستوليين على أكثر من 60% من ميزانية البلد.. رئيس الجمهورية والمسئوليين المؤثرين كلهم من محافظة واحدة ولا أثنين.. روحوا شوفوا بلد كمال الشاذلى شكلها أيه.. مفيش مسئول مهم أختير من أسوان أو من النوبة.. والعنصرى اللى سمانا زنوج مصر.. زنوج مصر بيدوك المية والنور يا معفن.. المواطنة مش بس مسلم ومسيحى .. يعنى أى حد .. بدون تصنيف للبشر.. وبعد كده ييجى الأنتماء.. فهمتوا يابشر ...!!!"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

