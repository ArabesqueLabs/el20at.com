[[comments]]
order = 10
subject = "وكان النبى ادريس نبى المصريين القدماء واول الموحدين فى مصر نوبيا من اعالى مصر"
author = "مهتم ببلدى"
text = "واذكر فى الكتاب ادريس انة كان صديقا نبيا ------------ مريم<br />يذكر ابن خلدون - ادريس هو اقدم الانبياء<br />ويذكر القرطبى - وكان ادريس اول من اعطى النبوة<br />يذكر الاستاذ عبد الحميد جودة السحار -- ولد ادريس قبل عصر الاسرات<br />ويذكر ايضا بعث اللة ادريس فى مصر قبل عصر الاسرات<br />يذكر المؤرخ انطون زكرى فقرات مما ورد فى متون الاهرام<br />ان الخالق لا يمكن معرفة اسمة لانة فوق مدارك العقول<br />ثم يعلق قائلا<br />ولقد استعملوا فى هذة المتون الفاظا عامة كا الالوهية وبعض الفاظ تدل على الخالق مثل المالك لكل شىء - وانة - لا نهاية لة ولا حد لة<br />ويذكر ايضا<br />فقام ادريس يدعو الناس الى عبادة اللة الذى لة ما فى السموات والارض - فامن المصريون باللة وان ادريس عبدة ورسولة وقد عرف منة المصريين التوحيد الصحيح قبل اخناتون بالاف السنين<br />اذن المصريين يكنون كل محبة للنوبيين ارض سيدنا ادريس ونبى التوحيد ولا يعرفون فرقا فى الالوان او اللون او الجنس<br />بل تذهب بعض الروايات ان سيدنا عثمان كان لونة اسود<br />اما مصطلح الزنوج فلا يعرف الا فى الغرب وامريكا<br />كل الاحترام لاهلينا فى النوبة فهم اصل التوحيد وارضهم ارض سيدنا ادريس"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 11
subject = "مصر هبة النيل واسرائيل مش حتسيب النيل ابدا"
text = "باختصار يا جماعة علشان خاطر اسرائيل تعيش لازم مصر تموت مصر المسلمة لازم تموت<br />واسرائيل ليها ادجندا في مصر تماما مثل اوباما ليه ادجندا فاسرائيل ماشية مع مصر بسياسة الادجندا<br />وهي تعلم ان تدمير مصر لازم ياتي من الجنوب مرة من النوبة ومرة من السودان ومرة من الحبشه ومرة قريت على النت انهم عايزين يعملوا دولة النوبة اصل النوبة دي نصها مه السودان ونصها مع مصر فعايزين يعملوا دولة نوبية<br />لتفتيش مصر دولة قبطية ودولة نوبية وهكذا"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 12
subject = "سيدنا ادريس نوبي وسيدنا محمد صلى الله عليه وسلم عربي"
author = "مش بحبك"
text = "الى الاخ الفالح اللي عايز يأصل للنوبة ويقول ان سيدنا ادريس نوبي<br />وسيدنا محمد صلى الله عليه وسلم عربي ونسخ كل الاديان التي قبله والكل لازم يتبعه حتى لو سيدنا ادريس عايش لازم يتبع النبي محمد صلى الله عليه وسلم<br />فاهم يا ابني<br />حتى كمان سيدنا موسى وسيدنا عيسى لو كانوا عايشين الان لاتبعوا محمد صلى الله عليه وسلم<br />محمد خاتم الانبياء والمرسلين وقال صلى الله عليه وسلم ديني كسفينة نوح من تركه غرق او كما قال صلى الله عليه وسلم"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 13
subject = "الوزراء ورؤساء الدول والموضة"
author = "مش كاتب"
text = "كونداليزا رايس اول وزيره سودا لاكبر دولة في العالم<br />وتبعها اوباما اول رئيس اسود لاكبر دولة في العالم<br />يبقى الموضة الان ان المسئول يبقى اسود<br />واحنا في مصر لازم نتبع الموضة<br />عايزين وزيرة خارجية سودا وعايزين رئيس جمهورية اسود"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 14
subject = "بلاش كلمة اسود خليها كلمة قمحى واسمر او نيلى"
author = "مصراوى"
text = "انت عايز رئيس لونة قمحى او اسمر يعنى امة مصرية ابا عن جد<br />يبقى انت ضد الوطنى والاخ زخارى هيشتمك"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 15
subject = "وكان سيدنا لقمان ايضا نوبيا"
author = "فالح"
text = "نعم سيدنا لقمان كان نوبيا من اقصى جنوب مصر<br />وكون هؤلاء الانبياء ارسلوا الى المصريين لهدايتهم وارشادهم الى طريق الحق والتوحيد قبل بعثة خاتم النبيين وذكرهم اللة تعالى فى القران لا يعنى اننا نقلل من عظمة خاتم الانبياء<br />فرسول اللة فى سويداء القلب ورسالتة خاتمة لكل الرسالات<br />انما يجب ان نثبت لاصحاب الملل الكاذبة واهل الضلال والتثليث ان مصر كانت موحدة باللة<br />واستكملت التوحيد بهداية خاتم الانبياء<br />فرجاءا لا تفهمنا خطأ<br />واللة من وراء القصد"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 16
subject = "واستوطنت بطن من بطون قريش اسوان"
author = "برضة فالح"
text = "فى اسوان استوطن احد بطون قبيلة قريش واختلطوا بالسكان وتزوجوا منهم وتناسلوا<br />فاسوان فيها الدم العربى والمصرى والنوبى فى وحدة دينية متأصلة<br />ولا مكان للمروجين والذين يعيشون فى احلام الماضى السحيق<br />اقراوا كتاب هجرة القبائل العربية الى مصر"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 17
subject = "رئيس أسود"
author = "الأسوانى"
text = "بالنسبة للأخ أبو دم خفيف بتاع الموضة والذى يتندر أنه ممكن يكون رئيس أو وزير أسود حسب الموضة. أفتكر أنه لو حدث هذا ستكون مصر تقدمت جدا ووصلت لمرحلة نضوج سياسى شديد وهذا مستحيل فى جو الخراب الذى تعيشه مصر وفى وسط البلطجة والسنج والبيروسول الحارق. وعلى فكرة أن انتخب رئيس من أسوان سواء كان أسود أو أصفر أو أى لون سيكون فخر لنا لأنه سيكون أمينا على هذا البلد لحبه الشديد للنيل والأرض وحرصه على العرض وكرامة الوطن. ولن يبيع الأرض لمن يدفع أكثر ويروح يقعد فى شرم الشيخ. ولن يفرط فى العرض وكرامة الأنسان كما يحدث الأن. ولن يقتل المواطن فى الشارع برصاص الأمن اللى كان مفروض يحافظ على أمنه. أما قصة أسرائيل وحدود مصر والأمن القومى المصرى فمصر مخترقة أصلا وبمساعدة الحكومة المصرية جهارا نهارا. أما توزيع الأتهامات والتخوين والتخويف وأدعاء الوطنية فغير مقبول. أمن مصر القومى أساسه الأحساس بالأنتماء والعدالة لأن الخيانة تظهر بوضوح فى الذين باعوا الأرض والبلد كلها وفتحوها للأسرائيليين وغيرهم مش فى الغلابة اللى بيطلبوا العدالة والحياة الكريمة... أخيرا ندعوا جميعا أن يأتى لنا (أوباما مصرى) أسود أو أحمر أو أى لون ..."
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 18
subject = "الى الاسوانى -- يبنى رئيس دولة اسود اية - هو هيبقى فية دولة - انت مسمعمتش عن بيع اصول الدولة - يعنى مش هيبقى دولة لما تنباع اصولها"
author = "برضة لية"
text = "اية هى الاصول اللى هتنباع - لم تحدد - لو كانت المصانع - كانوا قالوا بيع المصانع - انما دى كلمة خطيرة بيع اصول الدولة - يعنى مش هيبقى فية مقومات للدولة - زى اصدقائنا الصوماليين فية شعب انما ما فيش دولة<br />ثم ان موضوع رئيس اسود دى سهلة خالص<br />لو اجمع الشعب على رئيس اسود - تبقى سهلة خالص ومفيش اسهل منها وتريح كل اخوانا السمر واصدقاء اوبوما<br />نعمل اية<br />المزين اللى بيصبغ الشعر اسود يصبغ الوش كمان ويبقى زى فريد شوقى فى فيلم عنترة بن شداد اسود غطيس<br />سهلة يا اخى هتعقد المسائل لية<br />انت جيت فى جمل"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 19
subject = "الى الاستاذ برضه فالح"
author = "مش فالح"
text = "احب اضيف لحضرتك معلومة عن مصر ان مصر اصلا عربية وعمر بن العاص عندما فتح مصر كانت دولة عربية ومنذ قديم الزمن<br />والدليل على ذلك ان فرعون موسى اسمه ((( الوليد بن مصعب )))<br />وفرعون يوسف اسمه ((( الريان بن مصعب )))<br />وشكرا"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 20
subject = "وهجرة القبائل لم تتوقف بين دول المنطقة وكلامك اكيد بهجرة بعض القبائل العربية الى مصر قبل الفتح العربى"
author = "برضة فالح"
text = "نعم يا صديقى<br />كانت المنطقة مفتوحة امام الجميع ولم يكن يعرف حدود او قومية او عصبية بل ان اى فرد يستطيع ان يركب حمارة ويسوق غنمة من اقصى الصعيد الى شمال العراق او جنوب اليمن<br />وكانت الطبيعة قاسية جدا<br />احيانا كانت المجاعات تحصد المصريين فيهاجروا الى الشام او العراق واخر ما وصل الينا فى الكتب عن المجاعات فى مصر هى الشدة المستنصرية ايام المماليك وطفشان المصريين من البلد<br />واحيانا كانت الاوبئة والكوليرا تصيب المصريين وتقتل الملايين فيهربوا الى الصحراء والحجاز وما يعرف الان بالسعودية<br />وكذلك العكس كانت تاتى هجرات من الشام والجزيرة والعراق الى مصر<br />بل ان الفرس استوطنوا على ضفاف النيل حتى ان المؤرخون يقولون ان الحصن الذى حاصرة عمرو بن العاص الذى اسمة حصن بابليون - فكلمة بابليون هى كلمة فارسية ومعناها الحصن القريب من الماء وربما بناة الفرس ايام غزوة قمبيز الفارسى لمصر<br />ولماذا نذهب بعيدا<br />عالم اللغة الفرعونية الاستاذ سليم حسن رحمة اللة ذكر ان حوالى 100 الف كلمة مشتركة بين العربية واللغة الهيروغلفية<br />وعلى سبيل المثال كلمة موت هى نفسها فى العربية وفى الهيروغليفية وفى العبرية<br />وتقبل احترامى"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

[[comments]]
order = 21
subject = "الى مهتم ببلدى ومش بحبك"
author = "مصرى"
text = "يا ريت يا اخونا اللى عايز يفتى ويول يكون على دراية مش كدة وخلاص والمهم الدليل .. اللى انا عارفه من كتاب ابن كثير<br />البداية والنهاية ان اب لقمان كان نوبيا ولكن لم اجد عن سيدنا ادريس اى شىء من هذا .. فأرجوا التأكد ...<br />أما عن الرئاسة والحكم فكفى أن وزير الحربية نوبى وأسألوا أهل عابدين عشان اخته ساكنة هناك .."
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"
