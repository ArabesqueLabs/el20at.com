[[comments]]
order = 1
subject = "مصر فى دمى"
author = "الأسوانى"
text = "أنا أسوانى والنيل فى دمى والشمس سقف بيتى. أريد أن أسأل سؤال بسيط هل رأى أحد مزيعة تليفزيون سمراء؟ هل رأى أحد أى شخص يستضاف فى الأعلام المصرى أسمر اللون. هل رأى أحد مسئول مهم من أسوان؟ أبدا ....مصر Blondy ياعبله... يعنى بالعربى شقراء .. حتى المذيعات بيصبغوا شعرهم الأسود أصفر.. دليل الغباء.. الصعيد مهمش؟ النوبيين مهمشين أكثر (ماعدا محمد منير) لهم حق يفكروا فى الأستقلال... طردوا من قراهم فى الماضى .. والأن بيسكنوا فى أراضيهم بتوع وجه بحرى .. وهى أصلا أراضى النوبة..."
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103050/http://masr.20at.com:80/newArticle.php?sid=18571"

