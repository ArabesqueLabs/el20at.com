subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-02-27"
text = "مش عارف ليه حاسس ان الموضوع متفبرك ..بس لطيف<br />بس ابقى احبكها يا براء الله يكرمك<br />يعني مش معقول ايمان، 25 سنة، تقول أن أكثر اللحظات المخجلة في حياتها كلها، لحظة أن أخبرت زوجها أنها \"حامل\"، وكان خجلها يتكرر مع كل شخص جديد تخبره بحملها، تقول: أفكر في الصور والخيالات التي تمر برأس الشخص الذي أخبره، وأفكر أنني لن أكون سعيدة حين يفكر في أحدهم بهذه الطريقة<br />يعني ايمان اتكسفت من جوزها ومن اصحابها وقرايبها علشان ولامؤاخذة الصور و الخيالات بتاعة طريقة الحمل ..و متكسفتش تقولك انت؟؟ يا بجاحتها يا اخي !!!"
archived = "2010-03-14"
