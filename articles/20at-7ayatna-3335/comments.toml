subject = "ربنا يهدي النفوس"
author = "سلمى"
posted = "2007-02-28"
text = "والفكرة حلوة قوي يابراء عود حميد، الموضوع فعلا غريب مهما الواحد كبر او صغر بيتكسف من حاجات تكشفه قدام الناس وتخليه في نص هدومه انا عن نفسي باتكسف قوي لو حد شكرني على حاجة عملتها ومبقاش عارفه اقول ايه واقول يا ارض اتشقي وابلعيني<br />والاخ اللي بيقول ان الموضوع متفبرك لا أبدا انت شكلك متغاظ من براء قوي<br />وليه متفترضش ان ايمان قريبته ،أخته،خالته،بنت عمه، مرات أخوه يعني هي جت على براء مافيه موضوعات كثير البنات بتقول فيها اكثر من كده وبتبقى واضحة قوي ومفيش حد بيعلق<br />عموما ربنا يهدي النفوس"
archived = "2010-03-14"
