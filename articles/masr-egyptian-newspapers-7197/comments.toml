subject = "الرجل دة لسة عايش"
author = "واحد"
posted = "2007-09-27"
text = "الراجل دة بتاع العفاريت والالحاد والفلسفة الكدابة لسة عايش<br />عمال يخرف ويقول اكل مش عارف اد اية<br />يا عم هو فية حد لاقى رغيف العيش<br />انت بتتكلم على الاكل فى انهو عصر<br />العصر بتاعنا اسمة عصر تجويع الشعب المصرى وتطليع دين امة<br />روح موت يا انيس ربنا يا خدك"
