subject = "الى التلميذه اللا دوده"
author = "مش بحبك"
posted = "2007-11-20"
text = "حضرتك بتقولي للطحاوي<br />(احيانا كثيرة يعجز اللسان عن النطق بلكلمات لانك فوق اي كلام)<br />ليه ياختي الطحاوي فوق اي كلام<br />نبي هو ولا نبي ولا يمكن يكون نبي واحنا مش عارفين<br />وما الطحاوي الا صحفي قد خلت من قبله الصحفيين"
archived = "2007-11-21"
