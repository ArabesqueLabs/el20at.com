[[comments]]
order = 1
subject = "محسن راضي مدرس فيزياء ايش دخله في الصحافة"
author = "اكتب اسمك هنا"
posted = "2007-11-18"
text = "تردد اسم محسن راضي كثيرا في الموضوع<br />وانا اللي اعرفه ان محسن راضي كان يعمل معنا هنا في الخليج مدرس فيزياء لمدة طويلة ايش علاقته بالصحافة<br />وهذا هو من وكسة المهنة ان اي حد ممكن يبقى صحفي<br />لازم الصحفي يكون خريج كليات الصحافة والاعلام تماما كالمحامي لازم يكون خريج حقوق وغيرها<br />وانا اناشد الاخوة الصحفيين خريجي كليات الاعلام والصحافة ان يطالبوا بذلك لان المتطفلين دول واكلين حقوقهم"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015451/http://masr.20at.com:80/newArticle.php?sid=12489"

[[comments]]
order = 2
subject = "فشل مخطط التزوير"
author = "هاني صلاح الدين"
posted = "2007-11-18"
text = "اختلفت مع الزميل الطحاوي كثيرا ولكن اعترفت له دوما علي ابداع قلمة وروعة عباراتة لكن اريد ان اعلم الجميع انة كان هناك مخطط لتزوير الانتخابات وقمت بالفعل بضبط احد الموظفين يحاول الهروب بورق الفرز من خارج النقابة واستطعنا ان ننقذ 10 صناديق من التهريب للمجهول في حين فشلنا ان نرد الصناديق العشرة الاخريين التي تم تهريبها لنية مبيتة للتخلص من مرشحي الاخوان والناصريين وبذلك تصبح هذه الحادثة الاولي من نوعها في تاريخ نقابة الصحفيين ان تحاول الحكومة تزوير انتخابات الصحفيين ولكنها ارادة الله التي انقذت النقابة من جريمة الاغتيال السياسي لها ولكن سيبقي صوت اصحاب الاقلام دائما وابدا صخرة تتحطم عليها كل مطاعم حكومة المفسديين في اغتيال نقابة الحريات ."
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015451/http://masr.20at.com:80/newArticle.php?sid=12489"

[[comments]]
order = 3
subject = "تلميذة استاذ عبد الله اللدودة"
author = "مروه عبد الفضيل"
posted = "2007-11-18"
text = "استاذ عبد الله احيانا كثيرة يعجز اللسان عن النطق بلكلمات لانك فوق اي كلام ولست بحاجه الي شهادتى او شهاده احد من تلاميذك لانك فوق التقيم كثيرا لذا لن استطيع ان اقول لك سوى ان موضوعاتك بجد رغم جديتها الا انها تدور في قالب تشويقي وكأننى امام مسرحية او عمل جميل اتمنى ان لا ينتهي ويسدل الستار مع اخر سطر تكتبه وان كان بداخلك لا زالت تحمل اكثر واكثر فلم اعرف الا معك ان الصحافه موضوع قوي في قالب رشيق هكذا انت تفعل فتجذب العيون قبل العقول بس كده مش عارفه اقولك ايه تاني بس بجد موضوعك تحفه مووووووووووووووووووت"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015451/http://masr.20at.com:80/newArticle.php?sid=12489"

[[comments]]
order = 4
subject = "طز في النقابة وطز في الصحافيين وطز في الانتخابات"
author = "اكتب اسمك هنا"
posted = "2007-11-18"
text = "عملوا ايه الصحفيين يعني<br />كام جاهل اتعلم<br />ولا كام مشكلة اتحلت من مشاكل البلد<br />شوية مرتزقه<br />البلد بتنهار"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015451/http://masr.20at.com:80/newArticle.php?sid=12489"

[[comments]]
order = 5
subject = "الى المتخلف الفوقى (تحياتى)"
author = "صحفى"
posted = "2007-11-18"
text = "عيب الكلام النت بتقولة عن النقابة والصحفيين دة وبلاش قلة ذوق فى الحوار الصحفيين المحترمين هما البتعرف منهم حجم الفساد ومحربتة واى معلومة اكيد هتعرفة عن طريق الصحافة وانا فى حل ان اعرفك مين هما الصحفيين واضح انك انسان ناقم على الصحفيين والمجتمع واكيد شخصية متخلفة زيك لا يمكن الكلام معها وعيب تغلط وتجرح فى السادة الصحفيين"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015451/http://masr.20at.com:80/newArticle.php?sid=12489"

[[comments]]
order = 6
subject = "رد على (الى المتخلف الفوقى (تحياتى)"
author = "مش ضروري"
posted = "2007-11-19"
text = "اولا اشكر موقع عشرينات والقائمين عليه لانهم خلو امثالنا يتكلموا ويبقى ليهم صوت مسموع لكم الف شكري<br />بالنسبة للاخ الصحفي اريد ان اقول ان فيه موضوع نزل من يومين عن مجلس الشعب فيه صورة حسني مبارك وصورة رئيس مجس الشعب ممكن ترجعه لاني اللي كتبت معظم التعليقات بتاعته شرشحت فيها مجلس الشعب وفتحي سرور بكلام حق وليس باطل<br />بالنسبة للموضوع اللي فوق انت شايف التعليقات كلها الموضوع جميل الموضوع لذيذ<br />لكن انا لما قرأت الموضوع وموضوعات سابقة وجدت ان اعضاء النقابة كلهم بياكلوا في بعض وبيقطعوا في بعض<br />(لطفا يرجى مراجعة جميع الموضوعات اللي انكتبت عن النقابة في الاسبوع الاخير)<br />وانا مش انسان متخلف<br />التخلف هو اللي انا قرأته في تغطية انتخابات نقابة (الصحفيين) اللي المفروض هما المثقفين بتوع البلد"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015451/http://masr.20at.com:80/newArticle.php?sid=12489"

