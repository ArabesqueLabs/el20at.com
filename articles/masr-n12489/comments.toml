posted = "2007-11-19"
text = "الاستاذه مروه بتقول انها تلميذه الطحاوى اللدودة وعلى فكرة هى بتعمل كده بس عشان موضوعاتها تكتر في عشرينات وولاد البلد وعماله توطد علاقتها بكل عشريناتى عشان خاطر موضوعاتها تنزل ولغريب انها شغاله في مواقع كتير اوى بس تقول ايه بئه طمع ..."
archived = "2007-11-20"
