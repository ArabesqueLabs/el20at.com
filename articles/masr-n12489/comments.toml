[[comments]]
order = 8
subject = "إلى الأخ مش ضروري"
author = "محمد"
posted = "2007-11-19"
text = "رجاء يا اخ مش ضروري..<br />حاول تنفس عن ما يكن في صدرك من زبالة وأوساخ ..عند أي طبيب نفسي ...<br />لعلك تلاقي حد عنده علاج لما أصابك من مرض عضال أصابك بلوثه عقلية ونفسية...<br />واضح إن معدلات الزبالة في نافوخك تجاوزت الحد غير المسموح به ..<br />وبلغت مداها حتى أنك من فرط ما أثرت فيك تحاول جاهداً التخلص منها بإلقائها على من تقدر من المعلقين...<br />إنت بجد مريض نفسياً ومحتاج رعاية وعلاج ...أنا بتكلم جد ..إنت محتاج علاج نفسي مكثف !!"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015451/http://masr.20at.com:80/newArticle.php?sid=12489"

