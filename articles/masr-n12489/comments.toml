subject = "بره بره"
author = "مش فاكر انا ممكن اكتب ايه هنا"
posted = "2007-11-20"
text = "والله عشرينات دى بقت مسخه ولا ايه كل شويه لازم نضحك عليهم استاذ عبد الله فعلا موضوع مفيد وفعلا فى مضمون مميز بس ياريت تشوف الكارينه والهوا عاملين فى عشرينات انتم اسمكم ولاد البلد يعنى لازم تعرفو ان القارىء بتاعكم ابن بلد مش من جاميكا ولا ايه والنبى لتركزوا شويه وبلاش هيافه"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121124201/http://masr.20at.com:80/newArticle.php?sid=12489"
