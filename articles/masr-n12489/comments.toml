subject = "الى الاخ محمد"
author = "مش ضروري"
posted = "2007-11-19"
text = "فعلا يا اخ محمد الانسان المصري بيتنفس زبالة واوساخ اثرت على عقلية اللي بيحب بلده وخايف عليها<br />اما اللي مش خايف على مصر وبيحب نفسه مبسوط وفرحان وعمال يرشخ نفسه في الانتخابات ويروح ويجي ولا على باله اي حاجه<br />لكن اللي امثالنا اصبحنا مرضى نفسانيين<br />ادعيلي يا اخ محمد"
