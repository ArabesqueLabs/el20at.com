posted = "2007-11-08"
text = "طبعا الدولة بفلوس الدعم لا زم تغذيهم كويس جدا<br />كفتة وكباب وسمك<br />علشان يعرفوا يصفقوا بحرارة<br />ويتكرعوا ويقولوا موافقين من القلب<br />مش مجلس بقى<br />واطعم الفم تستحى العين"
