subject = "المحافظ عندة حق - فية مخطط ما لحرق تاريخ البلد"
author = "سكسوكة الحلاق"
posted = "2008-11-06"
text = "يا استاذ جلال المحافظ عندة حق<br />من تسلسل الحرائق واماكنها وتكرارها الكل بيستنتج ان هناك خطة لحرق تاريخ هذا البلد<br />فية ايدى بتعبث فى الظلام<br />وبما ان البلد مخترقة - ممكن يكونوا بتوع الموساد ممكن يكون الامريكان<br />المهم فية مخطط للحرق ماشى وبينفذ برنامجة<br />معلهش اسمع كلام المحافظ<br />اخلى المسرح<br />فية اثر بجانبة اسمة معهد الموسيقى العربية ممكن يولع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "معهد الموسيقى العربية والماس الكهربائي القادم"
author = "مش ماس كهربائي"
posted = "2008-11-08"
text = "ندائ عاجل الى المسئولين في هذه البلد المنكوب<br />ممكن تعملوا عمله لكهرباء معهد الموسيقى يعني تغيروا جميع الاسلاك الكهربائية وتركبوا اسلاك جديدة وتعملوا تابلوه جديد للمعهد<br />لحسن انا شامم ريحة ماس كهربائي على وشك الحدوث"
archived = "2010-03-14"
