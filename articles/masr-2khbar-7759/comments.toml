subject = "سيدى ابا الزهراء"
author = "عبد اللة"
posted = "2007-12-09"
text = "سيدى رسول اللة - مررت على المقالة التى تذكرك - فوجب على التحية والسلام<br />الست خير الخلق كلهم ؟<br />الم تقابل اعرابيا فى شوارع المدينة عندما شاهدك ارتجف وخاف فقلت لة هون عليك انما انا ابن امرأة من قريش كانت تأكل القديد<br />انا ابن امرأة من قريش كانت تأكل القديد اى الخبز الجاف - يا لة من حقيقة - وما محمد الا رسول افا ان مات اوقتل انقلبتم على اعقابكم<br />محمد انسان بشر وليس ابن اللة ولا الجالس الى جنب عرش ابية فى السماء<br />قيرك هناك فى المدينة يزورة القاصى والدانى فاين قبور الاخرين<br />امنت برسالتك التى صححت اوهام المعتقدات السابقة<br />سيدى رسول اللة سلاما وتحية"
archived = "2010-03-14"
