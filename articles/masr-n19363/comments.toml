[[comments]]
order = 6
subject = "الفلسطينيون لا يصلحون لاقامة دولة بل هم شوية منظمات فاشلة"
author = "مش حمساوي"
text = "انا عايز اعرف فيه حاجه اسمها دولة فلسطينية زي مصر كده دولة مصرية او اي دولة اخرى<br />زي ما مصر كده ليها رئيس بيحكمها المفروض فلسطين يبقى ليها رئيس بيحكمها وكل الفلسطينيين ياتمرون بامره<br />المفروض الدولة الفلسطينية مدن الضفة الغربية وقطاع غزه<br />ازاي بقا دولة واحدة وكل منظمة عندها جيش وعندها سلاح<br />يعني حماس عندها صواريخ وهي مسيطرة على غزه ومحمود عباس لا يحكم غزه<br />دا اسمه كلام فاضي وفارغ وتضييع وقت ومسخره وقلة ادب<br />بالضبط زي افغانستان فضلنا عايشين في مسخرة المجاهدين يمكن عشرين سنه يتخانقوا ويتصالحوا جتهم نيله<br />دلوقتي كل شوية حماس وفتح يتخانقوا ويتصالحوا يعني ما فيش دولة<br />المفروض الدولة ليها رئيس زي حسني مبارك كده الكل يأتمر بأمره<br />يبقى كده مش حنخلص بقا كل شوية حمال تتخانق وتضرب بوذ<br />لغاية امتى طيب حنفضل في العذاب دا"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 7
subject = "الىالاخ بتاع العمالة والجبن"
author = "مش عميل"
text = "عمالة ايه وجبن ايه يا اخينا انت<br />حرام اللي بيحصل دا فيه نساء واطفال وشيوخ ومرضى لازم نحافظ عليهم<br />ايه شوية الهبل والعبط اللي بيحصل في غزه دا<br />فيه واحد اسمه محمود عباس الكل يأتمر بأمره ولازم يبقى فيه دولة فيها قوات امن تسيطى على مدن فلسطين وتأتمر بأمر رئيس الدولة<br />هو دا الكلام المضبوط<br />مش حماس وصواريخ"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 8
subject = "على الفلسطينيين ان يعيشوا كبقية الدولة العربية والاسلامية"
author = "مش حعارض"
text = "كل الدول العربية والاسلامية فيها نظام وليها رئيس بيحكم والكل بيأتمر بأمره سواء كان ظالم او فاجر<br />على اهل غزه والفلسطينيين يحذروا حذو زملائهم من الشعوب العربية يسمعوا ويطيعوا لمحمود عباس علشان خاطر المركب تمشي<br />زيهم زي المواطنين في كل الدولة العربية والاسلامية من المغرب الى باكستان<br />هو دا حل المشكلة<br />حل المشكلة انهم ينسوا شغل المنظمات والبلطجه ويعيشوا مجتمع الدولة<br />وزي ما الاخ قال في مقاله 44% تحت خط الفقر خلاص بقينا على الحديده<br />كان مرضى السرطان اولى بالفلوس دي ومرضى الفشل الكلوي وفيروس الكبد الوبائي<br />سلام يا صاحبي"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 9
subject = "هو فين الرئيس؟"
author = "محمد جمال الدين"
text = "الاخ الى كاتب اخر 3 تعليقات بتاع هناك رئيس يؤتمر بأمره<br />اولاً سواء هنا فى مصر او فى فلسطين هو فين الرئيس ده ؟<br />الرئيس / محمد حسنى مبارك .. لم يعد له شرعية حقيقية فى مصر كونه رئيساً .. لأنه كما يقول ان الحكومة تستمد شرعيتها من الشعب .. طب يا عم الحج مهو الشعب بقى مش راضى عنك وعن حكومتك و عن نظامك .. ألا برده هو قاعد<br />وده لا يعنى انى بكره لأن مافيش مسلم يكره مسلم ... ولكنى مختلف معاه تمام فى النظام بتاعه وبتمنى انه يمشى النهاردة قبل بكرة بالنظام كله مش هو بس .<br />أما عباس .. فبلاش ننشر غسيلنا الــ *** قدام الاجانب ... فعباس كلنا عارفين هو جه السلطة أزاى .. عن طريق تزوير الانتخابات بعدما فازت حماس بتأييد من الشعب ولكن الحكومة الامريكية ولى امر المنطقة كانت قاعدة فى مجلس الاباء وما عجبهاش الكلام .. راحت خلت الانتخابات تتعاد و زورت و نجح الى ما يتسمى ... الواد ابو نضارة<br />فهمت يا بتاع الرؤوساء"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 10
subject = "بتوع الجروب دول مغيبيين .. وألا كانوا عرفوا كام بذرة فى البطيخة"
author = "محمد جمال الدين"
text = "بتوع جروب حملة المليون مصرى للثأر للرائد المغدور .. اولاً ده كلام فاضى<br />ثانياً : انا ما اقدرش أتهم حد بالعمالة .. بس اقدر أقول انهم مغيبين تماماً .. وفيه بعضهم من الليبرالين .. عارفين بقى هما واخدين من الليبرالية البوس و الاحضان وعيش يا معلم .. وكدة يعنى .. وسايبين اى مبادئ تانية ليها .. مع ان الليبرالية فى الاساس .. نشأت على انها تيار دينى .. مافهوش لا بوس ولا بتاع<br />بس الظاهر ان فى مصر كل حاجة بتتبل فى البحر ععقبال ما تييجى وبناخد الى على مزاجنا و نسيب الباقى<br />لكن فعلاً ده كلام فارغ بتاع الجروب ده ... و أقل من ان الواحد ينزل بمستواه الثقافى المتواضع جداً جداً \\\\\\\" أن صح التعبير\\\\\\\" لمستوى .. كلام لا يرقى فوق انه كلام ناس مغيبيين الى حد ما .. كتييييييييييييييييير<br />وده رأيي فى الاول والاخر .. ولكل الاراء احترامها .. بس بدون تزييف"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 11
subject = "أغيثونا"
author = "جهاد الفلسطينى"
text = "إلى كل الإخوة العرب<br />من إخوتكم الفلسطينيين فى غزة<br />نحتاج إلى كل دعمكم و عونكم فى مواجهة الجيش الصهيونى المحتل و نحتاج أكثر لجهودكم و دعمكم و دعم كل دولكم فى مواجهة حماس التى تتسبب كل يوم فى موت و قتل المئات منا عن طريق الإحتماء ببيوتنا و أبنائنا أثناء إطلاقهم لصواريخ القسام برغم رفضنا ذلك إلا أنهم يجبروننا على ذلك و يحتلون بيوتنا بالقوة ليطلقوا منها صواريخهم على اليهود الملاعين ثم يختفون تماما و المصيبة الأكبر أنهم بدأوا يستخدمون باحات المدارس لهذا الغرض أيضا وتكون النتيجة أن طائرات المحتل الغاشم تقصف بيوتنا و مدارس أولادنا و تقتل أبناءنا و نحن لا حول لنا و لا قوة بينما حماس مختبئون فى مخابئهم آمنين من الهجمات و كل القتلى مدنيين لا ذنب لهم.<br />نرجوكم نرجوكم نرجوكم بإسم كل الشعب الفلسطينى أغيثونا من سيطرة حماس على القطاع المنكوب بسيطرتهم عليه<br />نرجو كل الدول العربية التدخل لإغاثتنا من حكم حماس لقطاع غزة"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 12
subject = "الى الاستاذ محمد جمال الدين"
author = "مش كاتب"
text = "يا استاذ محمد جمال الدين انا اد والدك وعشت تاريخ طويل مع المجاهدين والمناضلين<br />بالنسبة لحسني مبارك فحسني مبارك ومن ورائه الطوفان وخلي بالك اللي بيقولك الكلام دا واحد ما فيش في راسه شعره سودا من بلاوي الزمن<br />حسني مبارك ومن ولائه الطوفان رغم كل مساؤئه<br />العراقيين كانوا بيكرهوا صدام حسين وبعد ما مشي صدام حسين فهموا ان صدام حسين كان حايش عنهم بلاوي كتيرة وبيترحموا عليه دلوقتي وشيعه وسنه والله<br />الوقت غير الوقت يا استاذ محمد جمال الدين الدنيا اتغيرت واسرائيل بتستعد للانطلاق من اسرائيل الصغرى الى الكبرى<br />محمود عباس اذا كان خيال مأته لكنه احسن الف مرة من حاكم عسكري اسرائيلي زي زمان<br />على الاقل بيتكلم عربي<br />اما حماس والاخوان المسلمين مش دا وقتهم<br />المفروض يفهموا ان وقتهم لسه ما جاش<br />واريد ان الفت نظر حضرتك ان اليهود دول بيخططوا للعودة الى فلسطين من 2000 سنه وفضلوا صابرين 2000 سنه لما جه الوقت جم فلسطين<br />جماس والاخوان والتيار الاسلامي مش دا وقته<br />عليهم الانتظار لما يجي وقتهم لانهم بيضيعوا وقتهم في كلام فارغ وبيضيعوا الممكن في سبيل المستحيل<br />مستحيل تقيم دولة اسلامية في هذا الوقت لكن ممكن تعمل حاجات اصلاحية كتيرة اوي فهما بيضيعوا الممكن في زمن المستحيل<br />الاقباط طول عمرهم عايشين معانا زي الفل من 1400 سنه<br />لما جه الوقت اصبحوا هما اصحاب الارض واحنا غزاه محتلين<br />سلام يا استاذ محمد جمال الدين<br />ولازم نستنى لما يجي الوقت"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 13
subject = "انا مش اخوان"
author = "محمد السعداوى"
text = "اول الكلام انا مش اخوان والمرشد بتاعهم له اراء تودى فى داهية حاجة صغيرة حق المسلم على المسلم نصرته بغض النظر عن كونه اخوان او شيوعى او حتى مسلم بالبطاقة وبعد مالغمة تروح خلاص متتعاملش معاه انما اسرائيل تضرب غزة وتدمرها ويطلع معاتيه يقولوا يستاهلوا اصلهم من حماس والاخ اللى اسمه جهاد الفلسطينى انت حاجة من اتنين يا اما من بتوع الحزب الوطنى وكاتب اى اسم يا اما من فتح وفى الحالتين يبقى سكت الكلام لانه مفيش فايدة مع امثالكم من حزب طاطى لاسرائيل وامريكا عشان متنضربش زى غزة .<br />ويعنى ايه لازم عباس يرجع يحكم زى ما حسنى بيحكم ايه الهطل والتفاهه دى بجد يا بخت مصر بيكم اول الشعب الفلسطينى اختار حماس بانتخابات ديمقراطية نزيهة شهد بها العالم- مش زى نظام قفل الصناديق اللى انت عارفينه - نيجى احنا نقول لأ مفيش احسن من التزوير والوصاية على الشعب وحلوة حكاية لازم لكل دولة رئيس هى فين الدولة الفلسطنية الاول اساسا<br />والرئيس ده بيجى باى نظام بالانتخابات الحرة ولا اوامر ماما امريكا ولا التزوير"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 14
subject = "التتويه"
author = "احمد المسلم"
text = "الناس اللي مش متضامنين مع غزة يقومون بنعملية تتويه للحق !!!!<br />وهذه طريقة معروفة لأغراض يعلموها جيدا<br />الحقيقة انهم ايضا غير متضامنين مع الفقراء المصريين ولكنهم يستعملونهم كحجة<br />الفريد ان هؤلاء الفقراء اكثر المتضامنين مع اخوانهم<br />نعلم جيدا ان فشل اسرائيل في القضاء على حماس والمقاومة اثار حنق وهلع الكثيرين<br />لأنهم يخشون امتداد الخط الاسلامي الذي سمتد رغم انوفهم لانه وعد الله"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 15
subject = "بعد حسنى مبارك سيظهر الخراب الشامل ايا كان الحاكم"
author = "مش لاعب"
text = "لية<br />لان البلد بقت على الحديدة<br />لا فية قطاع خاص ولا قطاع عام<br />فية شلة منتفعين ومحتكرين ومستوردين وكل حاجة فى البلد بتنتج بيعت<br />عندك حق بعد حسنى ايا كان الحاكم ستظهر الارض المحروقة ويظهر مدى الخراب ويظهر ان كل شىء اصبح عشوائيات<br />انتهى كل شىء"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

