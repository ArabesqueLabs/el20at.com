subject = "حصدنا ما زرعناه"
author = "الشرق /كُتاب الشرق /فهمي هويدي"
text = "حين فشلوا في تركيع غزة بالسلاح، لجأ الإسرائيليون إلى التدليس، لكي يحققوا بالحيلة والخداع ما عجزت عن بلوغه طائرات أف 16 والقنابل الفسفورية والانشطارية.<br />(1)<br />في البدء قالوا إن معركتهم ضد حماس وليست ضد مقاومة الشعب الفلسطيني واستعصائه على الإخضاع. إذ تصور خبراء وحدة الحرب النفسية في المخابرات العسكرية الإسرائيلية التي يشار إليها باسم (أمان) أن الدس والتحريض ضد حركة حماس يمكن أن يؤدي إلى إعلان التمرد عليها وإسقاط سلطتها. لذلك أصبح المتابعون لفضائية الأقصى التابعة للحركة يفاجأون بين الحين والآخر باختراق ترددها وبث مواد دعائية ضد قيادات حماس، تخلع عليهم مختلف الصفات السلبية، وتتهم بالجبن والاختفاء عن الأنظار في الوقت الذي تتعرض فيه غزة للقصف. وذكر زميلنا صالح النعامي الصحفي الفلسطيني في رسالة بعث بها من داخل غزة في الأسبوع الماضي أن خبراء الحرب النفسية في الجيش الإسرائيلي لجأوا فضلا عن ذلك إلى دس مواد دعائية لتثبيط معنويات مشاهدي فضائية الأقصى. منها مثلا صورة مرسومة لأحد مقاتلي القسام وهو يرتجف من الخوف والفزع، ثم يفر هارباً من ساحة المعركة. كما لجأوا إلى استخدام تفوقهم التقني لاختراق إذاعة \\\"صوت الأقصى\\\" التابعة لحماس، وتقديم مواد إذاعية أخرى تتهم الحركة بأنها \\\"إرهابية\\\"، لاتعنيها مصلحة الشعب الفلسطيني وأنها أداة في يد إيران وعدوة للسلام.<br />إلى جانب عمليات اختراق البث المرئي والمسموع، قام الجيش الإسرائيلي بإنزال عشرات الآلاف من المنشورات والبيانات المكتوبة باللغة العربية على التجمعات السكانية الفلسطينية، وتحديداً المناطق التي تشهد مواجهات في بلدتي بيت لاهيا وبيت حانون ومخيم جباليا، والضواحي الشرقية والجنوبية لمدينة غزة ... إلخ. هذه المنشورات دعت الفلسطينيين إلى عدم التعاون مع حركة حماس، وعدم مساعدة أو إيواء مقاتليها. بعض تلك المنشورات ركزت على الحجة التي تلح عليها إسرائيل في مختلف وسائل الإعلام، والتي تدعي فيها أن حماس هي العقبة الحقيقية في سبيل تحقيق السلام الآن، وأنه لولاها لكان حلم إقامة الدولتين قد تحقق. ولكان قطاع غزة قد أصبح يرفل الآن في الازدهار الاقتصادي.<br />في نفس الوقت فإن إسرائيل لجأت إلى استخدام وسائل إعلامها الرسمية الناطقة باللغة العربية والتي يتم التقاطها في الضفة الغربية وقطاع غزة وبعض الدول العربية في محاولة تشويه حركة حماس. فالتلفزيون والإذاعة الإسرائيلية باللغة العربية عادة ما يمنحان معلقين يهود يتحدثون اللغة العربية بطلاقة مساحة كبيرة لمهاجمتها ويتهمون قيادتها بأنها تتخذ من مستشفى \\\"دار الشفاء\\\" في غزة ملجأ لها وأن مقاتلي حماس يرتدون زي العاملين في القطاع الطبي، وأن كثيراً من الوحدات في \\\"كتائب القسام\\\" انهارت، وأن نشطاء \\\"الكتائب\\\" خلعوا زيهم العسكري وباتوا يختبئون وسط الناس.<br />(2)<br />ليس جديداً ذلك الأسلوب في الحرب النفسية الذي يسعى إلى إثارة الفتنة وتهوين العزائم. ومع ذلك لم تتردد إسرائيل في استخدامه إلى جانب وسائلها الأخرى، التي كان من أحدثها الإعلان على الملأ عن أنها أوقفت الحرب من جانب واحد. وهو إعلان خبيث أرادت به إسرائيل أن تضرب أكثر من عصفور بحجر واحد. فمن ناحية هي أرادت امتصاص الغضب والسخط الذي شاع في مختلف عواصم العالم بعدما ظهرت صور الجرائم البشعة التي ارتكبها وهتكت بها كل الأعراف والقوانين، الأمر الذي فجر مظاهرات التنديد العارمة، وأدى إلى تراجع صورة إسرائيل وفضح حقيقتها التي ظلت طوال الوقت تحاول إخفاءها تحت أقنعة عدة. وتمثل هذه الخطوة احتيالاً من جانب إسرائيل يحاول أن يعطي انطباعاً بأنها ليست راغبة في استمرار الحرب وساعية إلى إحلال السلام.<br />من ناحية ثانية فإنها أرادت أن توقف مسلسلاً طال منها بأكثر مما قدرت، ولاتكاد ترى له نهاية. ذلك أن التقارير الإسرائيلية تجمع على أن الخطة العسكرية الإسرائيلية بنيت على تقدير يعطي استسلام غزة فترة تتراوح بين ثلاثة وعشرة أيام. وكانت المفاجأة أن الاشتباك استمر طوال ثلاثة أسابيع، ظلت صواريخ المقاومة تطلق خلالها كل يوم على المستوطنات الإسرائيلية. وظلت عناصر المقاومة تتحدى على الأرض محاولات التقدم والاختراق. وهو ما أقنع القيادة الإسرائيلية بأن الحرب يمكن أن تطول بما قد يرهقهم ويحملهم بأعباء لم تكن في حسبانهم (تكلفهم 200 مليون دولار يومياً) مثل استدعاء الألوف من قوات الاحتياط، وتوفير الذخيرة والعتاد اللازمين لحرب طويلة لم تعتد عليها. إضافة إلى ذلك، فإن إسرائيل أرادت حسم الأمر وفرض واقع جديد قبل أن تباشر الإدارة الأمريكية الجديدة مهامها. حيث يفترض أن يتولى الرئيس أوباما منصبه رسمياً من اليوم (الثلاثاء 20/1). ثم لا تنس أن ثمة انتخابات إسرائيلية في العاشر من شهر فبراير القادم، ويريد القادة الإسرائيليون الذين سيخوضون تلك الانتخابات (ليفني وباراك اللذان يمثلان حزبي كاديما والعمل) أن يجنوا ثمار المعركة التي رفعت من أسهمهم في مواجهة منافسهم الذي يزايد عليهم في قمع الفلسطينيين وسحقهم (بنيامين نتنياهو مرشح الليكود).<br />وجه الخبث في القرار الإسرائيلي أنه في حين يحاول امتصاص الغضب في الخارج فإنه ينصب كميناً للمقاومة الفلسطينية في الداخل ويظل شاهراً سيف الاحتلال فوق رقابها. ذلك أن وقف إطلاق النار لم يقترن بانسحاب القوات الإسرائيلية من القطاع. وهو ما يعني أن هذه القوات ستظل قابعة في مواقعها داخل القطاع، الأمر الذي يجعل الوضع الراهن أسوأ مما كان عليه قبل الاجتياح حين كانت القوات ترابط خارج القطاع. ولأن قرار وقف إطلاق النار لم يتم بالاتفاق مع الطرف الآخر (الفلسطيني)، فليس فيه أي إلزام. بمعنى أن الذي أوقف الإطلاق بإرادته يستطيع أن يستأنف الحرب في أي لحظة بقرار يصدره من جانبه.<br />من ناحية أخرى فوجود قوات الاحتلال داخل القطاع يسبب حرجاً للمقاومة ويشكل مصيدة لعناصرها. فهي إذا مارست حقها في الدفاع الشرعي واشتبكت مع تلك القوات فسيقال على الفور إنها بادرت إلى خرق قرار وقف إطلاق النار، الأمر الذي يوفر للإسرائيليين ذريعة للقيام بعمليات القمع والتأديب، ومواصلة \\\"الهولوكوست\\\" الفلسطيني. وإذا ما ظهرت عناصر المقاومة في ظل وقف إطلاق النار فإن ذلك سيكشف أمرها ويسهل رصدها، وبالتالي يمكن الإسرائيليين من تصفيتهم واحداً تلو الآخر.<br />بسبب كل ذلك فإن إعلان إسرائيل للقرار من شأنه أن يحقق لها مكاسب متعددة، ويضع المقاومة في موقف حرج. ولايقل عن ذلك أهمية أنه يؤدي عمليا إلى الإطاحة بالمبادرة المصرية وتجاوزها. رغم إعلان رئيس الوزراء الإسرائيلي أن القرار \\\"يتجاوب\\\" مع المبادرة. وهو تجاوب لا يخلو من خبث، لأنها دعت حقاً إلى وقف إطلاق النار، لكنها اشترطت بعد ذلك الانسحاب الكامل من القطاع. وعلى طريقة \\\"لاتقربوا الصلاة\\\"، فإن القرار الإسرائيلي، تجاوب مع الدعوة إلى وقف إطلاق النار، إلا أنه أبقى على قوات الاحتلال في المواقع التي تمركزت فيها داخل القطاع.<br />(3)<br />بعدما فشلت إسرائيل في القضاء على المقاومة وإسكات صواريخها، فإنها لجأت إلى محاولة تعجيزها وتجفيف منابع قوتها، من خلال الاتفاق الذي وقعته في 16/1 مع الولايات المتحدة لمنع تهريب السلاح إلى غزة. وهو من أغرب الاتفاقات التي يمكن أن توقع بين الدول. ذلك أن موضوعه الأساسي هو كيفية تجنيد الإمكانيات الأمريكية والأوروبية لمنع تسلح المقاومة في بلد واقع تحت الاحتلال. الأمر الذي يعني شيئاً واحداً هو أن إسرائيل أرادت حشد الأمريكيين والأوروبيين إلى جانب بعض الدول الإقليمية (؟) ليس لضمان أمن إسرائيل المدججة بمئتي قنبلة ذرية، ولكن لضمان استمرار احتلالها القطاع بتكبيل المقاومة وشل قدرتها على الحركة. وهي حالة غير مسبوقة في التاريخ المعاصر.<br />غرائب الاتفاقية لا تنتهي، فطرفاها هما إسرائيل والولايات المتحدة، لكن موضوعها يتعلق بشأن مصري فلسطيني حيث ذكرت الديباجة أن السيطرة على حدود غزة أمر لا يمكن الاستغناء عنه لضمان وقف القتال في القطاع. ولتهدئة خاطر مصر وتمرير هذه النقطة عليها، فإن الديباجة عبرت عن التقدير لموقف الرئيس مبارك ( وليس الحكومة المصرية) الذي تمسك فيه بتأمين حدود غزة (المقصود التزامه بإغلاق معبر رفح).<br />من غرائب الاتفاقية أيضاً أنها نصت في ديباجتها على أن تسلح المقاومة في القطاع هو السبب المباشر لاجتياحه بواسطة الجيش الإسرائيلي، معتبره أن الحرب جاءت رداً على \\\"الإرهاب\\\" الفلسطيني. وبناء على ذلك التشخيص رأى الطرفان أنه لا سبيل إلى حل مشكلة \\\"الإرهاب\\\" إلا بسد منافذ تهريب السلاح إلى القطاع بكل السبل المتاحة.<br />وبعد أن قلب الوضع على هذه الصورة، واعتبر الاحتلال هو الوضع الذي يحتاج إلى استقرار وتأمين، وأن مقاومته هي المشكلة التي ينبغي القضاء عليها قرر الطرفان ما يلي:<br />* أن يتعاون الأمريكيون والإسرائيليون مع الجيران (؟؟) ومع المجتمع الدولي، أي أن يستنفر العالم بأسره، لمنع السلاح عن المنظمات الإرهابية (منظمات المقاومة)، خصوصاً حركة حماس.<br />* إلى جانب التوافق على هذا الموقف فإن الطرفين الأمريكي والإسرائيلي، سيعملان بالاشتراك مع حلف الأطلنطي (الناتو) على مراقبة وضبط كل مظان توصيل السلاح إلى فلسطينيي القطاع، عبر البحر سواء في مياه البحر المتوسط وخليج عدن والبحر الأحمر وشرق إفريقيا.<br />* تبادل المعلومات الخاصة بتهريب السلاح للمقاومة من خلال التنسيق بين أجهزة المخابرات التابعة لدول المنطقة (؟) وبين أجهزة ومؤسسات الحكومة الأمريكية، وفي مقدمتها القيادة المركزية وقيادة القطاع الأوروبي، إلى جانب قيادة إفريقيا وقيادة العمليات الخاصة.<br />* تلتزم الولايات المتحدة بتقديم كافة صور الدعم المعلوماتي والفني لإسرائيل، كما تلتزم بتدريب الطواقم الفنية التي ستشارك بها الحكومات المحلية في العملية (الحكومات لم تحدد).<br />* فيما يخص التعاون العسكري بين البلدين لتنفيذ التزامات الاتفاق فإن مجموعة مكافحة الإرهاب الأمريكية الإسرائيلية ستنهض به، وكذلك المجموعة السياسية العسكرية المشتركة، كما أنه سيخضع للتقييم السنوي في الاجتماعات العسكرية التي تعقد بين الطرفين لبحث مختلف الأمور التي تهم كلاً منها.<br />(4)<br />ما فعلناه بأنفسنا في التعامل مع المذبحة لا يقل تعاسة عما فعلوه بنا. ذلك أن أبواقنا السياسية والإعلامية فشلت في تشخيص المشهد منذ اللحظة الأولى. فتجاهلت على نحو كارثي حقيقة استهداف المقاومة والسعي الإسرائيلي لإخضاع القطاع وتركيعه. حتى استحيي أن أقول إن المنشورات التحريضية التي ألقتها الطائرات الإسرائيلية على أهالي قطاع غزة، تبنت نفس الخطاب الذي عبرت عنه كتابات عديدة ظهرت في الصحف المصرية والعربية الصادرة في لندن. وهي التي شغلت باتهام حماس وتصفية الحسابات معها عبر تحميلها المسؤولية عما جرى، ولم تنشغل بتبصير الرأي العام بحقيقة أن المقاومة هي المستهدفة والمحتل هو الجاني وهو العدو. ولا أريد هنا أن استعيد تصريحات مخجلة صدرت عن بعض كبار المسؤولين وأعلنت أن حماس لم تستمع إلى النصيحة، وتستحق ما جرى لها، في تجريم مدهش للضحية وتبرير مقزز للعدوان. صحيح أن هذا الكلام المسموم تراجع (خجلاً ربما) حين صمدت المقاومة ولم تتعرض للانهيار الذي توقعه المعتدون (تماماً كما حدث مع حزب الله في حرب لبنان عام 2006م)، وحين تكشفت حقيقة الجرائم البشعة التي ارتكبها الإسرائيليون حيث حولوا القطاع إلى شلال من الدماء تطفو فوقه جثث وأشلاء الفلسطينيين.<br />لقد خذلنا المقاومة منذ اللحظات الأولى للاجتياح، وإذا ادعى بعض المسؤولين أنهم لم يكونوا ضدها، فالقدر الثابت الذي لا يستطيع أحد أن ينكره أنهم لم يكونوا معها. كما أن أغلب أنظمتنا خذلت شعوبنا أيضاً، حين تقاعست عن إعلان موقف حازم ضد العدوان منذ بدايته، الأمر الذي اعتبره الإسرائيليون ضوء أخضر يسمح لهم بمواصلة المذبحة، حتى شجع السيدة ليفني وزيرة خارجية \\\"العدو\\\" على أن تعلن صراحة أنها الآن \\\"تمثل العرب المعتدلين\\\"(!!) – (نيوزويك العدد الأخير الصادر في 20/1).<br />لقد احتموا بالتقاعس العربي، وفي الفراغ العربي تقدموا وعربدوا كيفما شاءوا، حتى أهانوا أصدقاءهم المعتدلين بوقف إطلاق النار الذي فصلوه على هواهم، وذهبوا في الاستهانة إلى حد أنهم اتفقوا على ترتيبات لخنق المقاومة على حدودنا. ولا تثريب عليهم في ذلك، لأننا حصدنا ما زرعناه."
