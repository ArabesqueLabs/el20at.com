[[comments]]
order = 0
subject = "جهل مطبق للاسف"
author = "محمد السعداوى"
text = "اى كلام وحسبى الله ونعم الوكيل .سؤال للجهلة وهل ذنب حماس ان اختارها الناس بديمقراطية يعنى لو الريس بتاعنا ده جاى بالديمقراطية وجت اسرائيل عشان تشيله نقول للريس اتنازل عن الحكم عشان اسرائيل تبطل ده استسلام .<br />بطلب من سيادتك يا مش متعاطف -ياخى حتى لو من باب الانسانية - تعيش تحت الحصار فترة طويلة ايه شعور حضرتك هل من حقك تقاوم الحصار باى وسيلة ؟<br />يعنى ايه عودة عباس الشعب فى غزة والضفة مختارش عباس ولا دحلان الفاسد العميل يعنى بطلب منكم تحترموا الديمقراطية اللى انتم متعرفوش عنها حاجة .<br />الحرب دى بيتخطط لها من 6 شهور يعنى حجة ان صواريخ المقاومة استفزت اسرائيل حجة بايخة وخايبة<br />حوار الشعب فقير والعنوسة و....الخ ده خلط للامور بدون اى منطق مصر طول عمرها تاريخيا حصن للعرب والمسلمين وده شئ يشرفنى كمصرى وهو ده قدر مصر جغرافيا وتاريخيا"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 1
subject = "العيال بتوع عزبة الوطنى مش متضامنين - فى ستين كسحة لان ولائكم يهودى زى خنازير المهجر اللى شاركوا فى مظاهرات تاييد لاسرائيل فى امريكا ضد غزة"
author = "مصرى"
text = "كل الشعب المصرى ما عدى اقلية لا تتعدى 5 % مع مقاومة حماس<br />الموضوع مالوش علاقة بالاخوان<br />دى مقاومة فلسطينية شريفة<br />والانسان وقت الحرب بيستعين باللة ليرفع معنوياتة<br />معنى كدة ان الجيش المصرى وهو بيعبر القناة سنة 73 ويصرخ قائلا اللة اكبر -- اللة اكبر --- اللة اكبر ----------- انة كان جيش اخوان<br />العيال بتوع الوطنى ومصر اولا يروحوا فى ستين داهية"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

[[comments]]
order = 2
subject = "لما المصريين يتضامنوا مع بعض الاول نبقى نشوف غزه"
author = "مش ححبك"
text = "بلاش مسخرة فاضيه<br />احنا بناكل في بعض وبنسرق بعض وبنقتل بعض وبنغتصب بعض احنا المصريين<br />غزه ايه اللي حنتضامن معاها<br />وايه اللي عمل كده في غزه اصلا<br />شوية عيال بلطجية وخوارج عاملين فتوات واحنا مالنا<br />خلينا في خيبتنا الاول لما نتعلم نتضامن مع بعض نبقى نتضامن مع غزه"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061909/http://masr.20at.com:80/newArticle.php?sid=19363"

