[[comments]]
order = 17
subject = "!"
author = "جهاد الفلسطينى"
text = "هكذا ؟؟<br />كل التهم أصبحت جاهزة ؟؟<br />نطلب أن تغيثونا فيكون ردكم بأننا خونة أو عملاء ؟؟!!!!!!<br />لهذه الدرجة لا تريدون سماع الحقيقة ؟؟!!<br />عقولكم مغيبة إلى هذه الدرجة ؟؟؟!!!!!!!!!!!<br />فعلا و الله لكى الله يا مصر بل أقول لك الله يا وطن يا عربى<br />حسبنا الله و نعم الوكيل فى حماس<br />حسبنا الله و نعم الوكيل فى حماس<br />حسبنا الله و نعم الوكيل فى حماس<br />و إنا لله و إنا إليه راجعون"
archived = "2009-01-21"
