text = "اولا السلام عليكم يا دكتورة ....<br />انا زي اي وحدة وقعت في خطأ العادة , ولكن انا نفسي لا اعرف اذا كنت الذي افعله عادة سرية ولا لا<br />انا بضم رجلي اليمين فوق الشمال كاني قاعدة وحاطة رجل على رجل وبقوم بالضغط على رجلي الى ان اشعر باللذة (انا اسفة على كلامي ده والله انا مكسوفة جدا من نفسي على اني قدرت اقول كلام زي ده) سؤالي هو :<br />1-هل ده يعتبر عادة سرية ؟ والاهم<br />2- هل ممكن يهددني ويفقدني عذريتي؟؟؟ وفعلا ان العذرية لايمكن فقدها إلا عند حدوث علاقة زوجية حقيقية ؟؟؟<br />وكمان عندي سؤال اخر ...<br />ربنا بيقول في كتابه العزيز:(إنالصلاة تنهى عن الفحشاء والمنكر)إلخ<br />3-هل معنى كده اني صلاتي مش مقبولة لانها لم تنهاني عن فعل المنكر (العادة) ؟"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142941/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

