posted = "2010-01-05"
text = "[quote name=\"مها\"]السلام عليكم ورحمه الله وبركاته<br />انا بوجه كلامي للبنوتان اللي حصل وفقدوا عذريتهم سواء عن طريق الغلط بممارسه العاده السريه او عن طريق انها حبت ولد وانخدعت بحبها فيهوخصوصا للبنوته اللي قربت تتخطب وصرحت حببها انها مش عذراء اولا<br />انتي غلطانه انك قولتيلوا مهما كان بيحبك ده رجل في الاول او الاخر يعني ممكن في لحظه غضب يقول كلمه تجرحك او لقدر الله يفكر فيكي تفكير مش كويس وميصدقش انه حصل عن طريق العاده السريه.وكمان ربنا سترك لية انتي تروحي تحكي عن كدة<br />ثانيا لو اي بنت عندها المشكله دي ممكن تروح عن دكتور يعلاج ده بس بشرط قبل جوزها ب 3 ايام او لو بتتحرج تروح عند دكتوره و بالطريقه دي تبقي قدرت تصلح غلطه ربنا شاء انها تتستر وتتعالج وانصح اي بنت تاخد بالها من نفسها لان حاجة زي دي بتفضل سيبه اثر مدمر نفسيا<br />وربنا يهدينا جميعا[/quote]<br />دكتوره بليز انا مارسته العاده بقالى 6 سنين تقريبا بس انا الحمد لله دلوقتى بطلتها بس جت فتره كنت بحس ان عندى زى حساسيه كمان بتنزل من افرزات كتير وخيفه انى اكون فقد عذريتى لان ساعات بلقى حاجات شفافه موجوده بعد ما بقوم بعمله التشطيف بليززززززز ساعدينى"
