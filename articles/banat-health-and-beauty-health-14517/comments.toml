text = "[quote name=\"help urself\"][quote name=\"smsm85\"]أنا عندي 24 سنة ومشكلتي إني عرفتها بالصدفة من وأنا في KG ومن ساعتها كل ما أحاول أبطل بفشل مع إني متدينة وبصلي قيام ومواظبة على صلاة الفجر وبصوم إتنين وخميس أنا مخطوبة كمان الحكاية دي ضعيفة أوي قدام شهوتي وإبتدا إنه يحصل بيني وبين خطيبي حاجات كده بس مش علاقة كاملة أنا بجد تعبت<br />أرجوووووووووكو ساعدوني أنا ضعيفة أوي قدام الموضوع ده مش قادرة استحمل :sad: [/quote]<br />لازم تحطي قدامك حافز قوي يخليكي تبعدي عنها<br />لازم تاخدي وقفة مع نفسك<br />تخيلي لو خطيبك عرف<br />احساسه هيبقى ايه<br />اكيد انتي بتحبيه وبتخافي عليى مشاعره<br />واكيد حاسة انك بتاعته<br />مش من حقك ان تعملي كدا في حاجة مش بتاعتك<br />ربنا يقويكي ويقوي كل اللي عندهم نفس المشكلة[/quote]<br />يا ريت بجد أقدر أبطلها خصوصا إني تقريبا بعملها طول عمري بجد محتاجة دعواتكو معايا<br />يا رب خلص كل البنات اللي عندهم نفس مشكلتي منها يا رب<br />ويا ريت محدش يعملها خاااااااااااااالص"
