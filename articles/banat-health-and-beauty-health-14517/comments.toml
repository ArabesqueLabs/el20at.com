text = "انا بقول وجهة نظر بالنسبة لاى راجل ولو انا غلطان قولولى انى غلطان انا بقول ان اى راجل فى العالم لو بيعاشر بنت لاول مرة هيعرف ازاى انها مش بنت بنوت طبعا مش هيلاقى غشاء البكارة فطبعا هو مش دكتور طب شرعى علشان يعرف ان البنت ماكانتش فى حالة معاشرة مع رجل وانه من حاجة تانية وبقول للدكتورة ممكن توجهى احسن من كدة لو انتى دكتورة وبتكلمى صح مش تقولى الزوج مش هيعرف ان غشاء البكارة مش موجود يابنات انا رجل وبقولكم الرجل اول حاجة بيدور عليها هى الدم ومالقاش الدم بتبقا فيه مشكلة ولو كان عنده صبر بياخدها ويروح لدكتورة تكشف عليها لانه بيقول ممكن الدم يكون هربان منها علشان مثلا خايفةوالدكتورة هى بقا وحسب مايحس ضميرها ياتفضح البنت ياتستر عليها لو كلامى غلط ياجماعة قولو"
