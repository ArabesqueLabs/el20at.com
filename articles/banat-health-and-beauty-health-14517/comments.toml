[[comments]]
order = 40
subject = ""
author = "طماطم العسولة"
posted = "2009-12-24"
text = "السلام عليكم يابنات احب ان اوضح لكم احكام الطهارة<br />اولا الجنابة(اى انزال المنى عن طريق الجماع اوغيره كالعادةالسريةوالاحتلام)<br />فالأمر الأول:لإنزال والمقصودبه إنزال المني دفقاًبشهوة وهذا هوالذي يوجب الغسل سواء بالجماع أو غيره.وهذا واضح ومعلوم ،فيجب على البالغين أن يتعلمواذلك لأن بعض الفتيان يبلغون ويحتلمون وربمالايعرفون أن الغسل واجب عليهم،فالواجب أن يتعلم هذاالفتى إذا بلغ وأن يتفقه في الدين ولا حياء في الفقه .<br />والأمر الثاني:الاحتلام والإنسان في الاحتلام إما أن يذكر احتلام في نومه فإذا استيقظ رأى بللاً في ثوبه فهذايغتسل ولاإشكال فيه.فهذه هي الحالة الأولى<br />الحالةالثانية:أن يرى احتلاماًفي نومه ولايرى بللاًولايرى أثراًإنماهو مجرد خيالات فقط فهذا ليس عليه شيء<br />الحالة الثالثة : أن يرى أثرالماء في ثوبه ولا يذكر احتلاماً فهذا يغتسل<br />يعنى يابنات اللى تصحى تلاقى هدومهاالداخليةفيها افرازات اومش نضيفه سواء احتلمت او مارست العادة اولا لازم تغتسل<br />كمان فى ايضا امور اخرى توجب الغسل مثل الحيض والنفاس عند المراة/وموت الغير شهيد اذا مات الانسان يجب تغسيله الاالشهيد/كمان الكافر اذا اسلم لابد وان يغتسل"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224100644/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

