text = "[quote name=\"رد على ahmed mac\"]في ظل الظروف الراهنه<br />خطر على الشباب عدم ممارسة العادة السرية<br />لان الشعور بالكبت الجنسي ممكن ان يؤدي الى حدوث جرايم جنسية<br />يعني ممكن ان يؤدي الى ممارسة الشذوذ الجنسي<br />وهذا شيء ابشع من ممارسة العادة<br />وممكن يؤدي الى ادمان التحرش والاعتداء والاغتصاب[/quote]<br />ص هيه فعلامشكله كبيره<br />بس ده كله انتشر بسسب حجات كتر اوى اوى<br />ومنها البعد عن الصلاه فى وقتها<br />والكسل اللى بقا موجود عند معظم الشباب<br />والافلام اللى فى السينما اللى بقى معظمها قلت ادب<br />بصراحه انا مش عارف اقول ايه :-|<br />بس اللى يبعد العاده السريه دى والله ليرتاح :-)"
