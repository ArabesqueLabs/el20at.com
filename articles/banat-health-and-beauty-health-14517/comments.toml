posted = "2009-12-28"
text = "بجد يا جماعة مش قادرة اوصف احساسي<br />كان نفسي من زمان الاقي حد اتكلم معاه في الموضوع ده<br />حد نفسه يتغير بس مستني الفرصة<br />مستني حد يشجعه<br />لما اتكلمت مع ماما في الموضوع ده، ومع انها طبيبة، الا انها اول مرة تسمع ان البنات ليهم عاده هما كمان واقترحت عليا اننا نروح لدكتورة بس انا رفضت عشان الموقف محرج<br />قالتلي طيب ماتعمليش حاجة تانية وقعدت تتكلم معايا عن خطورة ده<br />بس انا كنت عارفة وفاهمة خطورتها ومع ذلك ماكانش عندي اراده اني ابعد عنها<br />كنت كل ما اشوف حاجة تثيرني، وبدون تردد، بمارس العاده<br />ومع الوقت تطور الموضوع اني اتفرج على افلام عشان اوصل بسرعة<br />وتطور اكتر ان بقا فيه ايام مش بعمل حاجة خالص وايام تانية بعملها اكتر من 5 او 6 مرات في اليوم الواحد<br />لأ ده في اقل من 6 ساعات كمان<br />قريت كتير في الموضوع ده عشان اعرف ابطل<br />وبجد اول مرة احس اني عندي ارادة اوي كدا اني اعمل حاجة<br />يلا نشجع بعض ونبعد عن العاده دي خالص<br />ونقرب من ربنا<br />ونشغل فكرنا بحاجات مفيدة<br />انا قريت كل ال130 تعليق<br />وكنت فرحانة اوي لاني حسيت اني مش لوحدي<br />انا اخدت قرار اني ابطل العاده دي<br />وانتوا السبب في كدا عشان تعليقاتكوا الجميلة دي<br />ربنا يكرمنا كلنا"
