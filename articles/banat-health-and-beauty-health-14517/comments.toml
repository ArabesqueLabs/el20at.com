text = "يا جماعة انا طالبة في كلية الطب و عايزة ااكد على حاجتين<br />أولا صعب اوي غشاء البكارة انه يتعورلانه بيبقى مدفون لجوه ميتخدش غير باتصال جنسي فعلا<br />ثانيا انا اعرف ان العادة السرية بتسبب احتقان في الجهاز التناسلي كله من المهبل للحوض كله<br />و من اعراض الاحتقان زيادة الافرازات و زيادة كمية الدم و الم زيادة على الم الدورة و ممكن تلخبطها او تسبب الم اثناء الاتصال الجنسي<br />بس كل الحاجات دي reversible_يعني بتروح لو السبب زال و يا ريت حد يسال دكتورة نسا<br />يا ريت البنت اللي قالت عن الكتب تكتبها على الموقع احسن من ايميلها للان معظمنا فعلا ميعرفش اي حاجة و انا مش بتكلم عن العادة بس"
archived = "2009-12-25"
