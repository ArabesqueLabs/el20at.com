text = "حبيبي انا بشرح ان العادة السرية دي مش صح عارفين ليه ؟؟ لانها هتأثر على علاقتك بجوزك لعدين عمرك ما هتوصلي للمتعة الجنسية الكاملة ، لاتن المتعة دي هي عملية برمجة للجهاز العصبي فساعتها اعرفي انك بتتعسي نفسك بنفسك و ساعتها حتى مش هتقدري تتكلمي عارفة ليه علشان دا هيكون اختارك الي جر عليكي السعادة ، بالنسبة لجيمس كلامك مش مضبوط يا حبيبتي ، تمام و بعدين بالنسبة للبنت بتاعت مية الشطاف حبيبتي انتي ليه بتحقري من مشاعرك و رغباتك بالطريقة دي انت خايفة تكوني فقتدي عذريتك في حين انك مش خايفة على تقدير الناس ليكي يا روح قلبي الي بتعمليه دا خطر جدا جدا على نفسيتك قبل جسمك يا حبيبي خلونا نتفق على التالي كل وحدة هتقول لنفسها الاحساس الي بحسة و انا بمارس الذفت دا احساس كداااااااااااااااب و بيحرمني من احساس اجمل و اعمق و اناكدا بضحك على نفسي تاني حاجة كل وحدة لما يجلها شعور انها عايزة تمارس الزفته دي تقول لنفسها لا انا هخلي الاحساس دا لبعدين لما اتجوز محدش هيدحك عليا انا بقدر اتحكم في نفسي و تفكري في منظرك و انت عاروسة و فرحانة و لابسة فستانك الابيض"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142941/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

