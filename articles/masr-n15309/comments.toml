[[comments]]
order = 3
subject = "ازمة الخبز ازمة مصطنعة صنعها الولد من غير علم ابوة"
author = "اللواء المصيلحي"
posted = "2008-04-29"
text = "اجتمع جمال ابن حسنى مع رئيس الوزراء ، وقال لة احنا عايزين نشيل الدعم طلع رئيس الوزارة وقال كلام فى الجرايد عن رفع الدعم وان الدعم لا يصل لمستحقية وان الدولة تفكر فى صرف بدل نقدى للدعم للمستحقين والحكومة بدأت تقلل كميات الرغيف المدعم ابو شلن والجرايد تكتب عن الخبراء اللى بيدرسوا مقدار الدعم العينى وازاى هيوزعوة وبتوع لجنة السياسات قالوا لابد من رفع الدعم عن البترول والبنزين والديزل او السولار وتحريك سعر رغيف الخبز وانفجرت الازمة وبتوع الامن - امن الدولة راحوا للرئيس وقالوا لة الحق المحروس هيولع فى البلد الناس مش لاقية تاكل وبعدين الراجل نزل الدقبق تانى اللى كانت الحكومة منعاه على المخابز المخابز كانت بتشتغل ساعتين فى اليوم بس على قد الدقيق البلد مش حقل تجارب للمحروس هو وشوية العيال بتوع السياسات البلد بقت على كف عفريت لا الامن المركزى نفع فى المحلة ولا امن الدولة نفع البطالة الحقيقية فى مصر اكثر من 50 فى المية بلاش نضحك على بعض البلد عايزة حكومة انتقالية من رجال الاقتصاد"
archived = "2008-04-30"
