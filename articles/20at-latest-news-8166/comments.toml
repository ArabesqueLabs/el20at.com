text = "اول شي : القصة مسروقة من قصة يابانية<br />ثاني شي : رجاء لها سـوابق في سرقة قصص اجنبية وتعـريبها دون الاشارة للمصدر الاصلي<br />الشي الثالث : رجاء الصانع تنقلت بين ثلاث دول .. عائلتها بالاصل عـراقية<br />لم يعـودوا بعد التحرير للكويت بسبب اصولهم العراقية استقرت في الرياض<br />حتى تدمج نفسها حبت تسرق رواية وتضع عليها اسم البلد الثالث الذي تستقر فيه حاليا"
