text = "مش عارف يا احمد كنت خايف منك اول ما شفتك كنت حريص من الكلام معك وهي دي طبيعتي لكن بعد العشرة والمعاملة بالاكل والطعام والشراب والهزار تبينت لي الشخصية وعرفت أنها ولا نزيكيك على الله انها لانسان خلوق مؤدب ومهني وشاطر ..وحاسيت اننا يمكن نكون اصدقاء ..الغريب اننا لانعرف قيمة الاشخاص الا عند النهاية والفراق ..وتبقى الذكرى دواء للعليل وللمحب ..حاسس يا احمد انك هتنتجح وتبقى حاجة حلوة..اللي مزعلني في الموضوع كله ..انك هتسيب الاخ محمد المعتصم ..هو المكان اللي انت ذاهب ليه عاوز واحد بس ..ربنا يوفقك ..لغاية ما تشوف حبيبة صحفية عشرينانتية الواحد مش عوز يبطل كلام بس ربنا يسهلك"
