text = "أنا عرفت امبارح من ناجي إنك ماشي.. وساعتها استأذنته أنزل أسلم عليك لقيتك جيت الاجتماع بتاع امبارح..<br />ومن امبارح لغاية دلوقتي لم أكن تمالكت نفسي بعد وجمعت شجاعتي لأقرأ مقالك..<br />كنت بأفتح الصفحة أبص على صورتك ومكتوب جنبها إلى اللقاء وأخاف أدخل على الموضوع..<br />قطوووب<br />بجد أنت إنسان نادر،<br />وأكثر designer شفته في حياتي بيحب شغله وبيعمل حاجة مختلفة بجد<br />قطووووب<br />أنت لاتدري كمية ما بقلبي من أسى منذ سماعي الخبر<br />وافتكرت على طول :<br />أحبب من شئت فإنك مفارقه<br />قطوووب<br />ربنا يوفقك يارب ويكتب لك كل ما فيه الخير لك ولأسرتك الجميلة<br />قطوووب<br />أنا فعلا بأحبك جدا"
