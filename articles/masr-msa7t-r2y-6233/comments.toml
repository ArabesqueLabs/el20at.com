subject = "جارى العزيز"
author = "منى سليم"
posted = "2007-06-13"
text = "انا تقريبا آخر واحدة عرفت خبر انك هتمشى من الموقع، بس او لما فكرت فيه انك طموح ومخلص ومثقف وصوت اذاعى مميز وعندك زوجة وبنت احلى من بعض فربنا يوفقك لكل شىء فيه مصلحتك وتقدر نفيد به<br />وما اظنش حتى لو مش بقيت معانا كل يوم هينفع نقول سبت عشرينات لأن ماحدش بيسبها مهما بعدت ومهما اشتغلت لأن عشرينات دى حالة بتفضل جوه الواحد وبترجع لها كل فترة لو بزيارة او مقال<br />لكن بشكل شخصى بقى زعلانة عشان انت جارى فى الجهاز اللى جنبى ومع انى فى الاول كنت متاخدة منانك تبقى جارى وقلت وده هاتكلم معاه ازاى ده احنا بنقول لبعض صباح الخير من بعيد<br />بس اول مرة شغلت فيروز وقلتلى عليها وقعدنا نتكلم عنها، قلت هذا هو الجار المناسب، اعمل ايه دلوقتى تخيل هييجى اليوم اللى اسمع فيه مع محمد المعتصم محمد محيى بس بلاش نظلم الولد عموما هافوله كلا م كويس عن ذوقه السمعى لما هو كمان ييجى يمشى<br />ما احنا هنطفش الناس كلها، ربنا يوفقك ولازم تيجى تزورنا وتجيب حبيبة .. وانت السابقون ونحن اللاحقون .. سلام"
