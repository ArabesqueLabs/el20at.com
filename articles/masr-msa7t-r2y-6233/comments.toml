[[comments]]
order = 0
subject = "لا الة الا الله"
author = "دنيا"
posted = "2007-06-11"
text = "استاذ احمد لك كل التوفيق والخير في حياتك مع زوجتك وابنك لكنى اعترض على قولك بترك المكان لان بصماتك ستظل دائما شاهد على تواجدك عبر السنوات الاربع وفقك اله واهداك الى صالح سبيلة وامد الله فى عمر القائمين على هذا الموقع الرائع لانه كل يوم حقا فى ازدهار والروح الشبابية تكاد ان تنطق عبر صفحاتكم احبكم لانكم عرفتوننى يعنى اية قضايا شبابية ويعنى اية نركز على الصغيرة قبل الكبيرة يعنى اية حب بين فريق العمل يعنى اية حياة يعنى اية احمد قطب مع حفظ الالقاب يترك المكان دامعا يعنى اية كل هذا الاخلاص للمكان فكم من مكان يتركه الانسان يتنى ان لا يعود له لكن حزن كلماتك ورحيق حبر سطورك يدل على مدي تعلقك بهذا الموقع لكن اطلب منك طلب اخير لا تحرمنا من مقالاتك ولو مقال واحد فى الشهر حتى نشعر انك لازلت معنا تدب الحماس فينا وتنتقدنا باسلوب جميل ارفع له قبعتى تحياتى وسلماتى الى كل من ساهم فى اخراج عشرينات الى النوى وكل من صنع بها حرفا واشاد فى تعليق او حتى انتقد بلزعه<br />استاذ احمد وفقك الله .<br />لا الة الا الله"
archived = "2010-03-14"
capture_url = ""

