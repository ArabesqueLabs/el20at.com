posted = "2007-06-11"
text = "كم سيتأثر عشرينات بترك شخصية مهمة مثل حضرتك له يا أستاذ أحمد، لن ننسي نقاشات حضرتك التى كنت تفتحها ونستزيد فيها من ثقافة حضرتك، لن ننسي تصميماتك وبانراتك، لكننا لا نتوقع ان حضرتك ستودع عشرينات لان من يعمل بعشرينات من الصعوبة ان يتركه، سواء بمشاركة حضرتك بالموضوعات او اقتراحات لتطوير الموقع.<br />وفقك الله الى ما يحبه ويرضاه وبارك لك فى حبيبة وفى المولد القادم باذن الله."
