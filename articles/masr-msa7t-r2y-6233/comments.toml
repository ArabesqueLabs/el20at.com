subject = "هافتقد موجيتوس"
author = "مجاهد شرارة"
posted = "2007-06-12"
text = "أخي وحبيبي أحمد القطووووووب ( كما أحب ان أناديك )<br />رغم ولوجي يوميا للموقع إلا أن هذه المرة لن أغادر قبل أكتاب تعليقا على كلماتك ،<br />تعلم اخوي أن هذه الدنيا التي نعيشها قصيرة تمر سريعا ولا تترك لنا الفرصة أن نتعايش مع من نحب ،<br />أشهد الله أني احبك في الله<br />أتمنى لك التوفيق والفلاح في الدنيا والآخرة<br />وبالطبع يا بطل احنا مع بعض لن تتخلى اذاعتنا الموقرة عن هذا الصوت الجذاب<br />وأذكرك بكلمة للمخرج محمد البحراوي عندما جاءت اذاعة امواج لزيارة اذاعتنا الجميلة فقال لك : صوتك جميل وانا حابب اسمع صوتك وانت بتتكلم<br />لقد عبر بتلقائية شديدة عنك يا قطووووووووووووب ...<br />أتمنى ان نجتمع سويا في عمل إعلامي له رسالة نبيلة"
