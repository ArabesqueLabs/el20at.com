subject = "تستحق كل خير"
author = "دعاء الشامي"
posted = "2007-06-11"
text = "مممممممممم مش عارفه اقول لك ايه اي استاذ احمد يمكن علاقتنا مش قوية ولا نعرف بعض من زمان بس بجد انا باحترم حضرتك جدا من اول يوم دخلت المكان فيه صحيح في الاول كنت حذرة جدا في التعامل معاك لانك تبدو غامض شوية وحذر لكن فعلا بعد كده اكتشتفت فيك صفات هايلة اهمها احترام الناس واهتمامك بهم جدا<br />ده بقى في الشغل لكن في الحياة طلعت انسان رائع جدا وبدات اعرف ده من موافقك مع براء ومن تعليقاتك على الحاجات في الحياة عموما وتتمتع بخفة دم هائلة لا يمتلكها غيرك الكثيرين<br />اما بقى القمر حبيبه فدي اجمل هدية من ربنا لحضرتك بعد امها الجميلة طبعا ربنا يحميهم لك ويخليك لهم دوما<br />موضوع العلاقة وانقطاعها انا مش عارفه ايه اللي ممكن يحصل في ظل الدنيا اللي عايشينها وظروف الناس اللي كل شوية تسوء اكثر من اللي حصل قبل كده بس ان شاء الله العلاقة تدوم<br />ربنا يوفقك تستحق كل خير"
