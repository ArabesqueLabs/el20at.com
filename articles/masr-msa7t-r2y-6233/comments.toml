text = "بجد ياابو قطب هتوحشنى وهتوحشنى بنتك حبيبه وربنا يشهد أنى أحبك فى لله ومما لاشك فيه أن عشرينات هتفتقدك وهتفتقد أبداعاتك الواضحه على الموقع وفعلاً انت غيرت فى جمال الموقع كتير فى الفترة الأخيرة بشكل مفيش حد يقدر ينكرة ونتمنا انحنا نشوفك وتكون على تواصل معانا وربنا يوفقك ويقدر لك الخير حيث كان ويرضيك به<br />ويعين ابو معتصم على النفخ الى جااااااااااااااااااااااااااااااااااى<br />ولازم تجيب حبيبة نسلم عليها قبل ما تمشى"
