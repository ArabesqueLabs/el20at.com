[[comments]]
order = 12
subject = "كاس وداير يا قطب"
author = "أحمد حمدي"
posted = "2007-06-12"
text = "فى البداية يا احمد الله يخليك حلو مشكلة الكود دي بقالى ربع ساعة بعمل رفرش عشان السكرت كود اكيد الحج مصعب والحج معتصم حد فيهم السبب اكيد مش انت طبعا :-) ،<br />المهم سيبك انت،، انا عندي كلام كتير فعلا عايز اقوله ،، انت عارف انا راجل بياع ونصاب اى نعم بس مش بعرف اقول اللى جويا كويس<br />انا معرفتكش كل الاربع سنين حتى السنه اللى كانت مكتبنا قريبه من بعض مكنتش اعرفك كويس بارضو لغاية ما اندومي عملت عميلها وكنت فى الاول قلقان منك حكم انت بارضو ساعات عليك ردود تخوف وتقلق يعنى مرة بهزر معاك قولتلى \" هتصاحبنى \" :sad:<br />حد يقول لحد كده يا مفتري<br />المهم مامحبه الا بعد عداوه زى ما بيقولوا<br />عارف ومن ضمن الحاجات اللى اشهدلك بيها يا قطب علاقتك بربنا سبحانه وتعالى فدائما ما كنت اراك قانط تدعوا الله بعد الصلاه او قائم تصلى السنن والنوافل حتى انى قولت فى نفسي اكيد ده بيـأثر على ابداعك بشكل كبير ماشاء الله<br />اى نعم انت سوحتينى فى الحوار اللى كان بني وبينك وبوظتلى المشروع بس المسامح كريم يا سيدى والجيات اكتر من الريحات :-)<br />مرحبا بك في عالم مابعيد عن اسلام اون لاين وعشرينات ودائما على تواصل<br />هو صحيح انت رايح فين يا قطب<br />اوعي تكون رايح بلاد الصحراء والبترول خاليك هنا فى مصر عالاقل هنعرف نشوفك فى المناسبات"
archived = "2010-03-14"
capture_url = ""

