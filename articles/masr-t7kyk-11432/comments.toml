subject = "Interview with Meligui"
author = "Manal Sorour"
posted = "2009-03-05"
text = "What I love about this man , Maamoun el Meligui that he is a believer. Believing in his country, beliveing in his words, believing in the message he transmit to the publci becuase its coming out of his soul and heart, beliveing in his music which interpret what he feels, and beliveing in the young artist and offers them all the support and opportunities. I admire his words and his love story with his country Egypt. I do agree with him that we , i mean the artist and the art provided is what shapes the public taste, and i want to tell him to keep on shouting out his warm voice and never give-up. I give thank you note to Maamoun el Meligui."
