text = "و الله في الحقيقة....التحليل الرياضي راح عليه الزمن....اليوم و مع تطور وسائل الإتصالات السمعي البصري ، أصبحت هذه المهمة الصحفية الشريفة ملوثة بدماء البحث عن الشهرة و النجومية و جمع الأموال الطائلة من وراء ذلك، إنه أصبح \"صناعة الأبطال\" أو صناعة الفريق الرياضي\" داخل مصانع لا تتقن إلا لغة الصورة ببراعة المحترفين و بلاغة المموهين....مذيع مفوه مدرب أحسن تدريب من جهة ، و الصورة الديجتال من جهة أخرى ، و الإعلانات من جهتين...و هلم جرة....الله يكون في عون المشاهد، و بس....."
