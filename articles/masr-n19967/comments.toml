order = 0
subject = "التوك توك اسمة الحقيقى الركشة انتم جبتم التوك توك دة منين"
author = "جاى من الهند حالا"
text = "اسمة فى بلدة الاصلى الركشة<br />والهند بدأت تستغنى عنة وصنعت سيارة محلية رخيصة بسعر لا يتجاوز 15 الف جنية - يعنى ارخص من الركشة فى مصر<br />هو احنا فى مصر بنرجع لوراء والا بنطلع لقدام<br />احنا رجعنا لعصر الركشة الهندى"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218023236/http://masr.20at.com:80/newArticle.php?sid=19967"
