[[comments]]
order = 0
subject = "ضع عنوان التعليق"
text = "حكمت فعدلت فأمنت فنمت يا عمر"
archived = "2007-11-17"
capture_url = "https://web.archive.org/web/20071117052331/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 1
subject = "كداب يا خيشة"
author = "خيشة"
text = "وقال ان مصر هى العرض وهى الارض<br />وطبعا الارض للمثتثمرين والاجانب<br />والعرض ينتهك كل يوم فى اقسام الشرطة<br />والامان ان المواطن يدخل اقسام الشرطة يطلع جثة هامدة<br />فهمنا الخطاب كويس من غير ما تقولة"
archived = "2007-11-17"
capture_url = "https://web.archive.org/web/20071117052331/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 2
subject = "فتحي سرور المسأفاتي"
text = "بصوا في الصورة كويس<br />عم فتحي سرور عمال يسقف<br />بذمتهم ايه لزمة مجلس الشعب دا حتى ولو فيه 88 نائب من الاخوان المسلمين"
archived = "2007-11-17"
capture_url = "https://web.archive.org/web/20071117052331/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 3
subject = "فتحى موافقات"
author = "كككككككك"
text = "مجلس شعب - شعب مين<br />دا مجلس التصفيق والنفاق وبتوع الحشيش ونواب سعدية<br />حد منهم يقدر يسأل نفقات رياسة الجمهورية ميزانيتها اد اية والسفريات والاقامة فى شرم الشيخ على حساب مين<br />فتحى سرور اللى كل ماحد يقابلة فى حتة يلاقية بيسقف<br />بتسقف لية يا فتحى<br />يقول خايف لا الريس ييجى فجأة فى خيالى<br />خليهم يسقفوا لما نشوف اخرة التسقيف اية"
archived = "2007-11-17"
capture_url = "https://web.archive.org/web/20071117052331/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 4
subject = "88 نائب من الاخوان المسلمين في مجلس الشعب"
author = "مش ضروري"
text = "طبعا كلنا شايفين الصورة كويس<br />ارجو ان الكل يبص في الصورة ويحدق فيها علشان خاطر نعرف ان مجلس الشعب دا ما هو الا تهريج لا يصح للمسلم الصادق ان يضيع وقته في ترشيحات وانتخابات لا قيمة لها ولا وزن لها"
archived = "2007-11-17"
capture_url = "https://web.archive.org/web/20071117052331/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 5
subject = "بصور في الصورة كويس تاني وتالت"
text = "الباشا كبير اوي اوي اوي<br />والخدام اللي بيمسحله الجذمه واقف يسقف"
archived = "2007-11-17"
capture_url = "https://web.archive.org/web/20071117052331/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 6
subject = "مقابر الفغفير"
author = "تربى"
text = "وبص فى الصورة عاشر مرة<br />رغم صبغ الشعر وانتهاء العمر الافتراضى للاتنين والمفروض انهم يكونوا فى ترب الغفير من بدرى<br />الا انة تقدم الطب الحديث<br />وانك ممكن تعيش ناس على الاجهزة والمقويات"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116175040/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 7
subject = "بصو في الصورة كويس هو مين اللي المفروض يخاف من التاني"
text = "طبعا المفروض لما حسني مبارك يروح البرلمان يبقى خايف لان البرلمان هو السلطة اللي ممكن تعزل رئيس الجمهورية<br />لكن اللي حصل العكس البرلمان هو اللي خايف من الرئيس لان الرئيس هو اللي من حقه يعزل البرلمان<br />وعجبي"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116175040/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 8
subject = "بصو في الصورة كويس مين يقدر على مبارك ها ها ها"
text = "كان فيه زمان فيلم في السيما من 30 سنه تقريبا بتاع حسين فهمي وممثلة لا اتذكر اسمها كانت متجوزه سيد متولي الحرامي بتاع بورسعيد الفيلم كانت اسمه مين يقدر على عزيزه<br />الفيلم دلوقتي اسمه مين يقدر على مبارك<br />بصو في الصورة كويس وشوفوا مبارك عايز يقول ايه<br />عايز يقول الراجل يوريني نفسه اللي عندو شنف فيكم يطلعلي<br />ها ها ها ها"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116175040/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 9
subject = "الصورة خطيرة جدا"
text = "الصورة خطيرة جدا<br />لانها جسدت مشكلة الشعب<br />80 مليون بيخافوا من واحد<br />و واحد مش خايف من 80 مليون<br />سبحان الله"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116175040/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 10
subject = "الحمد لله ان انا مش رئيس مجلس الشعب ولا عضو فيه"
author = "مش لازم"
text = "البعيد عن الملك ملك<br />الحمد لله ان انا مش رئيس مجلش الشعب كنت وقفت اسقف زي الاهبل اللي في الصورة دا ولا كنت قاعد على الكراسي حعملها على نفسي لحسن الرئيس يحل مجلس الشعب<br />انا راجل حر بقعد على القهوة (مجلس الشعب الحقيقي) باقول اللي انا عايزه واشتم في الحكومة ولا يهمني اي حد وباكل من عرق جبيني<br />الحمد لله على هذه النعمة"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116175040/http://masr.20at.com:80/newArticle.php?sid=12463"

[[comments]]
order = 11
subject = "حل مجلس الشعب هو الحل"
author = "مش ضروري"
text = "يا ترى نواب الاخوان عاملين ايه دلوقتي لما ترددت اشعة ان مجلس الشعب سيتم حله في يونيو على حسب ما قرأت في احدى صحف المعارضة<br />هما رفعوا شعار الاسلام هو الحل<br />وحسني مبارك رفع شعار حل مجلس الشعب هو الحل<br />ها ها ها ها"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116175040/http://masr.20at.com:80/newArticle.php?sid=12463"

