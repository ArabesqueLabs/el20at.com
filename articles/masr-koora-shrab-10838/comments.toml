subject = "انا اهلاوى متعصب"
author = "حسين كامل"
posted = "2008-12-31"
text = "انا اهلاوى متعصب ومع ذلك اطالب النادى الاهلى بأن يهزم فى مبارة القمة المقبلة من اجل ابقاء الزمالك على قيد الحياة ( سؤال ,, هل سيقال عن المبارة المقبلة مع الزمالك مبارة القمة !! اعتقد ان الاسم اصبح غير واقعى لان الزمالك اصبح لا يمت بصله من قريب او بعيد عن كلمة قمة ) عموما يحى العظام وهى رميم وربما يعود الزمالك الى الحياة مره اخرى ."
