subject = "شرارة"
author = "هاها ها ها"
posted = "2008-01-05"
text = "نشرت جريدة الجمهورية اليوم ان اول حفار بترول تم تصنبعة محليا اطلق علية اسم -- مبارك 1<br />ابقوا قابلونى لو طلع نقطة بترول واحدة فى حياتة"
archived = "2008-01-08"
capture_url = "https://web.archive.org/web/20080108074937/http://masr.20at.com:80/newArticle.php?sid=13694"

[[comments]]
order = 3
subject = "حسن البنا"
author = "مش ضروري"
posted = "2008-01-05"
text = "جزاكي الله خيرا يا اختي ...<br />و رضي الله عنك<br />يا امامي يا اعز معلم .. يا حامل المصباح في زمن العمي<br />يا مرشد الدنيا لنهج محمد .. يا نفحة من جيل دار الارقم<br />حسبوك مت و انت حي خالد .. ما مات غير المستبد المجرم<br />من شعر يوسف القرضاوي"
archived = "2008-01-08"
capture_url = "https://web.archive.org/web/20080108074937/http://masr.20at.com:80/newArticle.php?sid=13694"

[[comments]]
order = 4
subject = "لا حول ولا قوة الا بالله"
author = "sara"
posted = "2008-01-05"
text = "هى البلد ده ماشية ازاى<br />ناس فى البرد وحجاج وسنهم كبير<br />وعشان تدخلهم المساعدات بالفياجرااا<br />ولا النقيب اللى كسر كلام اللوا ده كمان<br />والله السؤال بجد<br />الاخوة بتوع امن الدولة دول مصريين ؟؟<br />وخلوقات حية بتشعر وتحس وتتألم وكدة ولا ايه ؟؟؟<br />مجهود رائع<br />بالتوفيق"
archived = "2008-01-08"
capture_url = "https://web.archive.org/web/20080108074937/http://masr.20at.com:80/newArticle.php?sid=13694"

