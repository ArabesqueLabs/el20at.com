[[comments]]
order = 0
subject = "نقيب امن دولة ولواء امن مركزى"
author = "فريكوكو"
posted = "2008-01-04"
text = "ما فهمتة من سياق الحديث ان حتة نقيب امن دولة رفض طلب لواء امن مركزى واخرجكم برة المعسكر<br />يعنى الدولة كلها بلوائتها اصحاب السيوف والمقصات والنجوم والنسور تدار بواسطة امن الدولة<br />ونقيب امن دولة سنة 23 سنة يقول لسعادة لواء اسف مع السلامة<br />وهذا يحدث فى الجامعات والمصانع وكل ارجاء المحروسة<br />ومش عايزين الفقر يركبنا<br />وسلم لى على الديمخراطية والشفافية ومجلس البامية والملوخية"
archived = "2008-01-05"
capture_url = "https://web.archive.org/web/20080105002709/http://masr.20at.com:80/newArticle.php?sid=13694"

[[comments]]
order = 1
subject = "بلد فوضى"
author = "جمال محمود معتوق"
posted = "2008-01-04"
text = "بلد فوضى بلد صحابها معروفين ألأمن أمن بلدهم وألأمن هو سرقة ألبلد حاميها حراميها ماتفرقش أمن دولة وأمن مركزى لا فرق فى ألرتبة كلهم ممكن أن يدخلو بيتك ويختصبو زوجتك أمام عينك ونحن نستاهل اما موضوع حجاج بيت ألله ألحرام أن يمنعهم ألأمن دخول بلدهم هذا شىء عجيب من ألمفروض أنك مسلم وناوى ألحج لاعلاقة أمن جميع ألموانى بك ولا علاقة لهم بأى جنسية فلسطينى أو صينى لأنك ناوى على فريضة ألحج وعبادة ألله وعبادة ألله لن يددخل أحد فيها أبدا أقول لكم أتحايلو على اسرائيل فى أيديها ألموضوع"
archived = "2008-01-05"
capture_url = "https://web.archive.org/web/20080105002709/http://masr.20at.com:80/newArticle.php?sid=13694"

