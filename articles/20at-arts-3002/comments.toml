subject = "أجمل بقعة على الأرض"
author = "أمجد من غزة"
posted = "2007-12-16"
text = "غزة زهرة حتى لو كانت ايش ماتكون والله بلدك فيها الخير يكفي انك لما بتنظر للبحر وقت الغروب بتنسى حالك والله اللي بيحكي عن غزة هيك بيكون لسى مش عارف قيمتها والله ينصرنا على اليهود وعملائهم وكل واحد بدو يضيع القضية تحياتنا لموقع العشرينات وللجميع أخوكم أمجد"
