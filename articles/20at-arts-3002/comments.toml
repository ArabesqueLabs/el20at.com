[[comments]]
order = 1
subject = "لاحول ولا قوة إلا بالله"
author = "لا إله إلا الله"
posted = "2007-12-19"
text = "بقول للغزاوي اللي ما يستاهل أيكون من غزة ، غزة عند الشرفا بتساوي باريس ونيويورك بلاد الكفر والمهانة ، غزة أهل الكرم والبساطة والجهاد و الصمود ـ، غزة بلد المرابطة والكرامة بلد العز رغم الحصار بلد الكرامة رغم المهانة بلد الخير رغم الاحتلال بلدي بلدي بلدي بلد الأجداد وما بنقارنها بباريس ولا نييورك إذا مش عجباك روح على باريس أجسلك بكفي أنها بشرفنا أمام الله أحسن من باريس ونييورك بلاد المهانة والكفر اللي ما بتشرف إلا كل عميل خاين لوطنه ودينه<br />الله يهديك."
archived = "2010-03-14"
