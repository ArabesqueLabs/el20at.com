text = "تعليق على أبو قتادة ( كلامك كلو هااااااااااااااااااذ على بعضو تأليف بتأليف يا مزور التاريخ لاتخاف عين عمك ترانا مو مثلك متخلفين .. لاعمي ,, حنا نسواك ونسوى كل بلدك )<br />بالنسبة لأحداث أيلول الأسود .. واحد إن هذه الأحداث لم تأتي محض الصدفة أو شيء من هذا القبيل ثم أن قتل وذبح أكثر من 30 ألف فلسطيني أو أكثر من ذلك ( لا أذكر بالتحديد ) كان بمثابة دفاع عن الأردن ,, نعم كان بمثابة دفاع عن الأردن ..<br />لأن الفسلطينيون ومقاومتهم الركيكة ( الضعيفة ) ظنوا بانهم أذكياء وحذقيين جداً حينما قاموا أول ما أدخلوا إلى الأردن بعمليات القرصنة والإرهاب الغريب جداً .. كان الفلسطينيون ومقاومتهم الغبية يسرقون وينهبون وينشلون خيرات الأردن ..<br />كان الفلسطينيون ومقاومتهم المهزومة بالنصب والإحتيال والسرقةوالقتل في الأردن .<br />كانوا ماخذين راحتهم في الشرمطه ( واسمحولي بالهلكلمة ) لأنو فاض الكيل نهائياً ..<br />واستمر هذا الحال على ماعليه لأشهر لا وبل لسنين طويلة .. بعدما تدخل جمال عبد الناصر وقال للملك حسين ( طيب الله ثراه ورحمة الله عليه ) أن يصبر على الفسلطينيين ومقاومتهم الغبية ولكن الملك رد بكل غضب : أنه صبر صبر أيوب ولكن دون أي جدوى وفائدة منهم !!! إذن ما الحل الأمثل لكي يسكتو هؤلاء الكلاب الجائعة ؟؟؟؟<br />فقام بقتلهم وذبحهم لكي يتعلموا ويفهموا جيداً ما هو الأردن أولاًَ ؟؟؟<br />لكي لايضعون في بالهم مرة أخرى أن حتى يفكرو ( مجرد تفكير ) بالإقدام على الأردن أولاً ؟؟؟<br />ولكن هذا هو الحل لهم<br />الدفاع عن النفس ..<br />ونحن لها ..<br />30أف فلسطيني أو أكثر ذهبوا إلى نار جهنم وغير مأسوف عليهم البته !<br />فلتذهب يا أبو قتادة للجحيم أنت وتاريخك الكاذب المزور الذي لا يقبله لا عاقل ولامجنون ..<br />فلتحيا الأردن أولاً .............................................................. وأولاً شئت أم أبيت يا مزور ياكاذب !!!!<br />هذا القليل القليل من الكلام الذي سوف أتبعه بكلام آخر كثير جداً جداً جداً جداً<br />نلتقي ,, وسلام وتحية للأمة الأردنية ..<br />سلام اللهـــــــــــــــــ<br />محمد نواف الحمدالله ( الشرارات )"
