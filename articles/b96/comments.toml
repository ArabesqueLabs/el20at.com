[[comments]]
order = 226
subject = "عليم الله .. إنو كل واحد سب ع كلا البلدين بسواش قش"
author = "محمد الحمدالله"
posted = "2007-10-30"
text = "فعلاً اللي اختشوا ماتوا ... بس إحنا (( العرب )) ولا بعمرنا رح نصير بشر .. لأنو وبكل بساطة عايشين عيشة البهايم .. يعني بهايم العاده .. والله مني عارف ع إيش قاعدين عم بختلفووو .. ياناس .. ياعالم .. يابشر .. بدي افهم .. مشان الله ..<br />ولكو .. والله لو إنو إشي مستاهل كنا بنحكي الشغله فيها ومافيها .. بس ع شووووو ؟؟!! والله عيب عليكو .. أنا الصراحه لا مع الأردن وولا مع فلسطين .. أنا مع الحق .. والحق بنقال لو ع قطع رقبه .. يعني هسه ياأردني ويافلسطيني .. اختلفتو مع بعض .. طيب وبعدين يعني ؟؟؟؟ شو صار ؟؟؟؟ شو هو اللي استجد بالموضوع ؟؟؟؟ شو عملتو لبعضكو؟؟؟؟ .. يعني إنتو هيك حليتو مشكلة الشرق الأوسط ولا شو بالضبط ..ههههههههههه .. ههههه والله ( بكسر الهاء ) إنو وضعنا ببكي .. ولكووووووووووووووووووووووووووووووووووووو .. بكفي .. خلص .. زمن الأوليين ولى من زمان .. نحنا ولاد اليوم .. وكلنا أهل وحبايب .. واللي بيجي من الله حياه الله .. وهونه بدي أذكر حديث الرسول (( صلى الله عليه وسلم )): \" لافرق بين عربي ولا عجمي الإ بالتقوى والعمل الصالح \"... بتنمى إنكو تفهمو لأنو وبكل صراحه يعني الناس قرفت وزهقت من هاذ الإشي يعني أنا والله بحكي هالكلام وقلبي يعني مش مطاوعني إني أكتبو .. بس يلا .. مثل مابحكو أضرب هالعجينه بالحيط لزقت لزقت .. مالزقت .. برضو أحسن .. وشكراًً ... بس بالأخير ..(( نحن العرب هكذا وسوف نبقى هكذا .. وسنستمر هكذا .. وسوف يأتي أبنائنا ليكملو هذا المسير من بعدنا .. )) بالعامييييييييييييييييييييه عشان اللي بفهمش .. ذنب الكلب بظلو أعوج حتى لو حطو بالقالب أربعين سنه (( وأنا هونه بحكي 40مليون سنه )) .. وشكراً ع واقعنا الحقير الواطي المذلول المندعس ع شرفو وشرف كل واحد عربي اللي .. واللي .. واللي ........ الخ (( آآآآآآآآآآآآآخ )) الله يهديكووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووو"
