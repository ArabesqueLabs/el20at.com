[[comments]]
order = 350
subject = "يتهم زوجته الأردنية ب «الخيانة»"
author = "شلاش"
posted = "2008-06-06"
text = "اتهم كويتى زوجته وهي من اردنية ومن عشيرة العجارمة سكان منطقة ناعور بغرب عمان بأنها قامت بخيانته وقال في شكوى تقدّم بها الى السلطات الأمنية الكويتية «انها تخرج من المنزل يومياً من دون علمه» واتهمها بالزنا.<br />وذكرت جريدة «الرأي العام امس «ان قضية سجلت في حق الزوجة بعد ان تقدم زوجها وهو كويتى ببلاغ زنا ضدها الى مخفر السالمية».<br />واضافت: «ان الزوج اتهم زوجته بأنها تقوم بادخال أشخاص الى منزله في اثناء غيابه، وانه كان يراقبها واكتشف أنها تخرج من المنزل من دون علمه». وتابعت: «ان السلطات الأمنية استدعت الزوجة للتحقيق معها في تلك القضية حيث اعترفت لاحقا بانها كانت تتقاضى مبالغ من المال مقابل الترفيه عن زبائنها الذين كان اغلبهم من الجاليتين الفلسطينية والمصرية\"."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 351
subject = "الى اسامة الزواهرة المطايزة وقصي السعيدات الهريقات"
author = "علي الزبيرات الفلسطيني"
posted = "2008-06-06"
text = "من حسن حظي انني اريد ان ارد عليكم بصفتكم تعرفون في اولاد الحرام واولاد الحلال.. حيث انني في الزمانات نكت بنت من الزواهرة في منطقة الكمشة-الزرقاء وشاءت الاقدار ان تحبل مني من كثرة منكتها وجوزها المنيك دايما في الجيش بنيكوه طبعا الفلسطينية اللي في الجيش.. المهم ولدت المرة ولد واكتشفت انها سمته اسامة.. طبعا ان شفته الولد وهو صغير بجوز الولد الان صار ضابط في الجيش او صار طالب في الجامعة وعلى الاغلب انه يعلق في هذا الموقع.. اما الحادثة الثانية فبالنسبة للعجرميات الحاميات اللي وحده منهن دخلت تحت الحمار وحطت زب الحمار في كسها ففلقها من كثر ما هي ممحونة.. المهم اتعرفت على وحدة من قرية العال قرب الروضة حسبان وظليت انيكها كل ليلة تجيني على المزرعة وفي يوم قلتلها ولك روحي جوزك اليوم بروح اجازة من الجفر قالت اصلا جوزري بعرف اني بحبك قلتها بس قالت والله بشرفي انه بعرف انك بتنيكني وكس اخت احسن اردني واحسن عجرمي انا ما بدي الا انت يا حبيبي يا فلسطيني لانه ما رواني في حياتي الا الفلسطينية في النياكة.. المهم حبلت الثانية وخلفت ابن حرام زي الاولى تبعت بني حسن وصار الها اولاد مني اعتقد انه واحد منهم اسمه قصي اخو الشرموطة ابن المنيوكة"
archived = "2010-03-14"
capture_url = ""

