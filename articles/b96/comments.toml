text = "اتعرف لماذا لا توجد جامعة اردنية محترمة.. لان الطلاب يا عزيزي يعينون تعيين من قبل الديوان الملكي ومن قبل الاجهزة الامنية والمخابرات والاستخبارات.. هؤلاء الطلاب ياتون بهم من البادية والارياف وهم رعيان ولاد رعيان بعطوهم مقاعد في الجامعات من شان يتجسسوا على الطلاب الفلسطينيين وعلى الاسلاميين.. فيمكثوا في الجامعات اربع سنوات تجسس ثم يعطوا شهادة جامعية مجانية وبعد ذلك يعينوا في اجهزة الدولة المختلفة.. فيما الطالب الفلسطيني يتخرج بذراعه وهو قد حصل على معدل في التسعين فما فوق ثم يقضيها رايح جاي من دائرة مخابرات لاخرى بحجة انه يعمل ضد الدولة ويكره هذا النظام حيث هكذا كتب الرعيان في تقاريرهم وبعد ان يتخرج الطالب الفلسطيني تغلق كل الابواب في وجهه فبقضيها عاطل عن العمل مع انه كان من المتميزين في الجامعة اكاديميا ثم بعد ذلك يصبح هذا الشاب اما مدمن مخدرات او ان يصبح ازعر شوارع او ان يزج في اقبية المخابرات او ان يكره الدنيا ويحقد على نفسه ثم ينتحر<br />اما الشراميط الارادنة الذين تخرجوا زورا وبهتانا من الجامعات فالسفارات الاردنية تنتظرهم والسلك الدبلوماسي والطيران واجهزة الامن والمناصب الحساسة وسرعان ما يصبح الواحد منهم بسرعة البرق اما نائبا او وزيرا او رئيس وزراء وهو ساقط ابن ساقط<br />ولكن هكذا يساس الارادنة بعد ان عرف ملوكهم كيف يحكمونهم.. كان كلوب يتعرص على نسوانهم بكيلو زبيب او بعلبة حلاوة او بقطعة حلوى نابلسية كانوا لا يعرفون ما هي الحلوى<br />والله يخلف على الفلسطينية اللي علموهم الكنافة النابلسية والبقلاوة والوربات والبلورية ومختلف انواع الحلويات النابلسية الشهيرة وعلموهم المسخن والمقلوبة والمفتول بل وعلموهم كيف يروحوا على الحمام يخروا ويشخوا بعد ما كانوا يعملوها في البراري وهم ونسوانهم مطيزات للرايح واللي جاي.. كس اخت هيك شعب اخو شرموطة لا وبعايروا الفلسطينية بالملوخية اللي اول ما عرفوها فكروها نعناع حجم عائلي واكلوها نيئة.. ايري في هيك شعب اخو شرموطة ما شفت واحد منهم مليح لانهم كلهم انذال اولاد قحبات"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 440
subject = "مغامرات نوال العجرمية وحبيبها الفلسطيني وليد"
author = "نوال العجرمية"
posted = "2008-06-27"
text = "بعد مضي حوالى خمسه ايام على اخر لقاء لي مع حبيبي الفلسطيني وليد بسبب الامتحانات.. اتصلت بهاذا الاخير وطلبت منه ان ياخذني لبيته ويضاجعني لاني لم اعد استطع الكبت.. اخذني الى منزله.. اشلحني ثيابي باكملها.. وضع حلمه بزي اليمين في فمه وصار يمصها لدرجه انها انتصبت في فمه.. وضع يده على كسي.. وصار يلعب بالشعرات.. ثم اخل اصبعه الوسط باكمله في كسي.. وقال.. اووووه.. كسك مبلل يا نوال.. بدك نيكه غير شكل... جلس على الكرسي منتصب الاير مثل الحجر.. وقال... بدي علمك يا نوال على وضعيه اسمها وضعيه الخازوق... بدا كياني يرتجف من كلماته المثيره.. وصار كسي يتبلل اكثر واكثر... وضعت راس زبه تحت كسي.. وما ان دخلت حتى ارخيت وزني.. فغاص زبه في صميم كسي... حملني على ايره واكمل.. في وضعيه الخازوق يا نوال.. تجلس الفتاه على زب حبيبها ليغوص في عمق كسها... حملني وصار يمشي في الغرفه... وبدا ينيكني بشكل.. غاص زبه بشكل مفرط في كسي.. ارتخيت عليه وصرت انمحن وامص عنقه واتشنج.. فقدت الحياء كليا.. فم! ا معنى الحياء عتدما يكون زبه غائص في صميم كسي.. ينيكني للبيضات.. قال لي.. وين ايري يا ممحونه.. قلت له.. في كسي.. قال.. وين كمان.. قلت في عشي.. قال.. اكملي.. قلت.. في كسي.. وعشي.. وقطوشي .. ورحمي.. ومهبلي.. وقطي.. بدك كمان.. في شختورتي.. وهني.. وحري.. وفتحه نيكي... وبيت ايرك.. عندما سمعني اتكلم بهذه الطريقه جن جنونه.. وقف.. باعد ما بين افخاذه.. وامسكني من راسي بطريق فهمت انه ممنوع ان اتزحزح من تحته.. ادخل ايره في فمي.. امسكني من راسي وكبسه على ايره فغاص هذا الاخير في اعماق كسي.. وصرت اسعل.. كبسه اكثر.. وصالر ينيكني بقوة احبها في الفلسطينية.. انهم عنيفين في النياكة وليسوا كالاردنيين تحس انهم مخانيث .. وعند لحظه الرعشه.. كبس زبه في كسي كبسه جعلت راسه باكمله يدخل في كسي.. وصار يكب الحليب اللزج والساخن... جاعلني ابلع كل ما خرج من ايره.. بعد الانزال ابقى على ايره في فمي لمده عشره دقائق.. فهو معتاد ان ينقع زبه في فم زوجته لفتره بعد الانزال.. بعد ان انتهى اخذني المرحاض ليريني الماده اللزجه التي تخرج من ايره بعد الانزال وقبل التبول.. قال امسكيه وحلوصي به.. بدا يخرج سائلا لزجا.. م! اده صمخيه مثل الخيط.. صرت العب به.. تعومت يدي.. ففركتها على وجهي .. صار يضحك.. ثم بدا يتبول.. امسكت بايره واحسست باثار بسبب احساس ضغط المياه التي كانت تتدفق من ايره.. تحول السائل اللزج الى مياه نقيه.. صرت اوجه ايره وكاني العب بفرد مياه.. بدا يقهقه عاليا.. ضحكت معه.. شعرت وكاني اسعد فتاه في الدنيا للذات التي اختبرها يوميا.. استحمينا سويا.. صرت اغسل ايره بالصابون.. وصار هو بدوره بليف كسي بيده.. ويفركه بالصابون حتى الزوايا الداخليه.. ارتدينا ملابسنا وذهبنا الى حدائق الحسين في منطقة المدينة الطبية.. لنفرح ونمرح ونلعب.. في الطريق.. ادخل يده تحت تنورتي وهو يقود.. ادخل اصبعه الوسط في كسي.. وابقاه في الداخل طول الطريق.. قلت له انتبه لئلا يحصل لنا حادث.. قال .. اموت اجمل موته.. اصبعي في كسك.. صار يضحك.. ضحكت لدرجه الغشيان ذلك اليوم.. فوليد ليس فقط نييكا ممتازا.. بل رجلا مرحا يحب اللعب والمرح والفرفشه... وصلنا حدائق الحسين.. كانت مكتظة بالناس.. و امضينا ليله من العمر معا"
archived = "2010-03-14"
capture_url = ""

