[[comments]]
order = 354
subject = "الى يهود العرب"
author = "الباشق الفلسطيني"
posted = "2008-06-06"
text = "مفكرة الإسلام : [ خاص ] قبيلة بو نمر تعد من القبائل ذات النفوذ القوي في غرب العراق في منطقة الأنبار، ويعد شيخها من أبرز مشايخ القبائل بالعراق وله نفوذ قوي يشبه نفوذ رؤساء الدول، وقد كان لهذه القبيلة كما يقول مراسل المفكرة في منطقة الأنبار قصة بطولية في محاربة الغزاة، فقد ذكرنا قبل يومين خبر الإنزال الفاشل في منطقة الأنبار وقلنا في حينها أنه تم أسر سبعة عشر جندياً ولكن تبين لنا بعد ذلك أن العدد وصل لعشرين أسيراً ولم يكن هذا العدد هو المفاجأة التي هزت هذه القبيلة ولكن المفاجأة الحقيقة أن شيخ القبيلة لما أُحضر له هؤلاء الأسرى شاهد معهم أشخاصاً عسكريين لهم نفس سحنة البشرة العربية، فلما تم التحقيق معهم تبين أن هؤلاء هم من الضباط الأردنيين، وأنهم مشاركون في هذا الغزو بشكل أساسي كأدلة يستدل بها الأمريكان بحكم معرفة الأردنيين كثيراً للأرض العراقية، ولم يتمالك شيخ قبيلة بو نمر هذا الخبر، فقال لهم : يا كلاب تخونوا أمتكم لأجل هؤلاء الأمريكان الملاعين فاستل خنجره وذبحهم ذبحاً وهو يصيح يا كلاب .. يا ملاعين ... تخونوا أمتكم لأجلهم. حتى فصل رؤوسهم عن أجسادهم، ثم أمر بهم حتى يكونوا عبرة لغيرهم، فطلب من أفراد قبيلته حمل هذه الرؤوس وإلقاءها في الجزء الأردني، وقال: حتى يعلم هؤلاء الخونة ما هو مصيرهم .<br />ويقول مراسل مفكرة الإسلام: ولعل هذا يفسرقيام الحكومة الأردنية بطرد خمسة عراقيين قبل أمس رغم تعهدها قبل ذلك بيوم واحد بعدم اتخاذ أي قرار سلبي باتجاه العمل الدبلوماسي العراقي على الأراضي الأردنية ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
