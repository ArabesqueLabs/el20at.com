subject = "من انتم يا خدم اليهود والانجليز؟؟؟؟"
author = "الى الزواهرة الكلب ابن الكلاب"
posted = "2008-06-06"
text = "من انتم يا انذل شعب في العالم.. انتم السقايط يا عديمي الشرف.. لانكم ببساطة خدام للانجليز وكلاب حراسة على نهر الاردن حماية لاسيادكم في تل ابيب.. ولك يا زواهرة يا ابن العاهرة.. انت لو قرات تاريخك وتاريخ بلدك.. لعرفت انك ابن حرام مصفى.. ولعرفت ان دمائك تتكون من العمالة والخيانة وقلة الشرف يا عديم الاحساس يا صاحب المشاعر المتبلدة كتبلد ابناء شعبك الواطي.. الذين لا يفقهون الخمسة من الطمسة يا تبع بوش ونتنياهو وشارون يا اولاد القحبات.. ولك الفلسطينية نظفوكوا من القمل يا وسخين وجعلوا منكوا نواب واعيان وشيوخ وانتوا خرة في خرة كس اختك على كس اخت السعيدات على كس اخت كل اردني منيك بجيب سيرة الفلسطينية اللي هموا تاج على روسكوا يا خونة يا عملاء يا منايك يا اولاد نسوان الظراط على البلاط كس امياتكوا واحد يقول للثاني"
