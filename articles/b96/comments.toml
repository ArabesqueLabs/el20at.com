order = 438
subject = "الى كل الارنيين ، مهم جدا !!!!"
author = "فلسطيني"
posted = "2008-06-24"
text = "انا فلسطيني واستغرب من كل الارنييي الي يكرهونا، ولكم شو عملولكم الفلسطينية حتى تكونو حاقدين عليهم لهدرجة؟ والله مرة سمعت شلة شباب اردنية كانو يسبو الطفل الشهيد محمد الدرة !!! والله انو اليهود يستحو يسبو طفل ميت !!<br />ولكم الفلسطينية خسرو بلدهم بسببكم انتو العرب، وكل ماكانو بدهم يحاربو اسرائيل يفشلو بسبب خيانة العرب، ايلول الاسود وحرب لبنان و مصر عملت اتفاقية السلام وتبرت من الموضوع كله!! مين اللي ضحك على الفلسطينية وباع ارضهم ؟ مو العرب اللي كل واحد صار يساوم على القضية؟ وبعد ماخذ اللي بدو اياه راح لف طيزو وقال انامالي دخل؟ مين هذولا الهاشميين؟ مين جاب الامير عبدالله ومقابل شو حطو امير على الاردن ؟ ومقابل شو ساعدته بريطانيا عشان يعمل مملكة الو ولاحفاده؟<br />ولكم الفلسطينية شعب منكوب بطالب بارضه بوطنه مابدو ينساه ، روح الافتخار اللي موجودة فينا هدفها انو ماننسا فلسطين، مو لانو احنا نكره الاردنية او اي جنسية عربية .<br />عيب عليكم عيب والله، ولكم لو انتو رجال ماترضو انو بريطانيا تحط عليكم واحد غريب يحكمكم خاوة عنكم، اقول لكل اردني يسب ويكره الفلسطينية: انت رجل ؟ من عشيرة نشامة وشجعان ؟ روح ورجينا رجولتك وشجاعتك على العيلة المالكة (الهاشميين) اللي حاكمينك خاوة وراكبيين على ظهرك انتا وجدودك !!! مو تروح تتشاطر وتتمرجل على الفلسطينية !!! مابدك تشوف فلسطينية بالاردن ؟ روح اطلب من الملك او اقتلو وخذ الحكم لو انت رجل !!"
archived = "2010-03-14"
