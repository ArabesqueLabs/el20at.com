subject = "شعب القمل والبراغيث"
author = "طائر فلسطين الحر"
posted = "2008-06-11"
text = "ما هو الشعب الاردني اصلا قبل مجيء الفلسطينيين وفقا لمؤامرات ملوكه الذين خططوا ورتبوا مع الصهاينة لاحياء الصحراء المقفرة صحراء فلسطين واسموها زورا وبهتانا بالاردن.. كان الشعب الاردني - هذا اذا جاز ان نطلق عليه اسم شعب - كان هذا الشعب الساقط ميكله القمل والسيبان والبراغيث.. بل كان يدور على البراغيث من شان يوكلها.. اكثر عشائر الاردن الان التي يموت ابنائها من التخمة بملايين الشعب الفلسطيني الذي باعوا ارضه وقبضوا ثمن دماء ابنائه كان اكثر عشائر الاردن مش لاقيين يوكلوا فما بالكم بالبدوان العربان الاشد نفاقا.. هذا الشعب حثالة وهو لمم ومجموعة من المقطعين المنايك"
