text = "الحمدلله رب العالمين الذي قال في كتابه الكريم \"كنتم خير امة اخرجت للناس تأمرون بالمعروف وتنهون عن المنكر\"وقال ايضا\"ان اكرمكم عند الله اتقاكم \"فالمسلمون كلهم امة واحده فرقنا عندما قسمونا وسمونا عربا بقياده الخائن جمال عبد الناصر الذي اطلق القوميه العربيه وبالنسبه لاردني وفلسطيني فقد كنا شعبا واحدا لكن الكلاب زرعوا هذه الفتنه والتي يجري ورائها خنازير .<br />ثم اريد ان اقول لك هل تعلم اصل الزواهره والسعيدات واغلب العشائر الاردنيه من اين يا مشم<br />اصبر على كيد الحسود فان كيدك قاتله فالنار تأكل بعضها ان لم تجد ما تأكله.<br />والصمت عن جاهل او احق شرف وفيه ايضا لصون العرض اصلاحو اما ترى الاسد تخشى وهي صامته والكلب يخزى لعمرو الله نباحو"
