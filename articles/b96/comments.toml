[[comments]]
order = 212
subject = "فلسطين ام الدول"
author = "ابراهيم الفلسطيني"
posted = "2007-09-30"
text = "لسلام عليكم للجميع الاردنية والفلسطينية وانا اسمي ابراهيم من فلسطين ومعظم اهلي بلاردن احنا المفروض انو نكون ندعم بعض ونحب بعض لانو احنا الدولتين الوحيدتين لئراب عبعض وما في فرء كتير بين الاردنية والفلسطنية لانو كل اردني ولا حد بفلسطين وكل فلسطيني والو حد بلاردن يجب ان نكون يد واحد والغلاط مش منيح منمرة يا جماعة الخير بس يعني لو بدك تيجي للحئ كل الاردنية او معزمهم هم بكونو فلسطنية فبترجى من الجميع يمسك اعصابو انا بقصد شباب الاردن يعني ما تغلاطو على الخوات والاميات لانو كل واحد وغلاطيتو بترجعلو والفلسطينية هم امة الاسلام هم شعب الصابرين هم مجاهدين وليس انهم دايرين بساحة الهاشمية يعني الساحة الهاشمية اسمها نسبة لبني هاشم والرسول صلى الله عليها وسلم كان من بني هاشم وانتو مسمين اكبر ساحة شرمطة وطعرصة وتجمع وتحنا للشرموطات من كل جميع انحاء العلم نسبة لبني هاشم فيا شباب الاردن فكرو فيها مزبوط مين هم ابنا الشرموطة واخوات الشرموطة دون تفكير بتطلعو انتو فلمستسن انكم تختصرو وما تفضحو حالكم لانو شباب فلسطين هم رجال الوطن العربي والكل بحسب حساب للفلسطينية وباي دولة عربية انا روحت سوريا ومصر والاردن ولنان ومعزم الدول الكل بس يسمع انو انا فلسطيني يعد للمية ئبل ما يحكيلي كيف حاللك فانتو ياشباب الاردن يعني 10 دئايئ ما بتقعدو معنا مننفيكم عن وجه الارض ورح يجي هاد اليوم الي نخليكم تحكو مشان الله يا فلسطينية وتيجو تبوس كندرة كل واحد بحكي عن حالو فلسطيني واحلى عالم والله وهي يميلي الي بحب يراسلني وانا بدي اجي على الاردن عن قريب وبدي اوجه الاردنية وعندي جماعتي عندكم والزلمة الي بفتح ثمو بدي اقل قيمتو انا الفلسطيني وافتخر انا مش دهب ولا ماس انا فلسطيني برفع الراس هي يميلي www.aboras.com@hotmail.com المسنجر massari_forlove@yahoo ياهو انتو هيك بدكم بس حد يمسح بكرمتكو الارض يا الاردنية اخوكم ابراهيم وما تزعلو مني وانا بصلي بس ولكن هاي الحقيقة"
