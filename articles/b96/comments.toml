text = "لم اندهش من خيانه ملوك الاردن فهم سليل اسرة تجرى الخيانة فى عروقها<br />ولم نسى خيانه والده الملك حسين وعمالته التى كشفتها المخابرات الاسرائيليةى حيث قام بابلاغ اسرائيل بموعد حرب اكتوبر صباح السادس من اكتوبر 1973 بل وقام بقيادة طائرته وتوجه الى روما لمقابلة مدير المحابرات الاسرائيلية ليؤكد له الخبر بنفسه وقبلها نتذكر جميعا خيانه جده للجيوش العربية فى حرب 1948<br />انها اسرة تجرى الخيانه فى عروقها"
