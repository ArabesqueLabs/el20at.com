subject = "درس في الحياة"
author = "زعيم غرب كفرنجه"
posted = "2008-04-30"
text = "لمََّا أنذر النمل وحذر ودعا بني جنسه .. سطرت في حقه سورة في القرآن.. تتلى بإسمه..<br />فخذ من النمل ثلاثا :<br />1- الدأب في العمل .<br />2- محاولة التجربة .<br />3- وتصحيح الخطأ .<br />أكل النحل طيبا ..ووضع طيبا .. أوحى الله إليه .. وجعل له سورة تذكر بإسمه ..<br />فخذ من النحل ثلاثا :<br />1- أكل الطيب .<br />2- وكف الأذى .<br />3- ونفع الآخرين .<br />علت همة الأسد .. وظهرت شجاعته .. فسمته العرب 100 اسم ..<br />فخذ من الأسد ثلاثا :<br />1- لاترهب المواقف .<br />2- لاتتعاظم الخصوم .<br />3- لاترضى حياة الذل .<br />سقطت همة الذباب .. فذكر في القرآن على وجه الذم ..<br />فأحذر ثلاثا في الذباب :<br />1- الدناءة .<br />2- والخسة .<br />3- وسقوط المنزلة .<br />لما هزلت العنكبوت .. وأوهنت بيتها ..فضرب بيتها مثل الهشاشة ..<br />فأحذر ثلاثا في العنكبوت :<br />1- عدم الإتقان .<br />2- وضعف البنيان .<br />3-وهشاشة الأركان .<br />حمل الهدهد رسالة التوحيد .. فتكلم عند سليمان وأعطي الأمان .. وذكره الرحمن ..<br />فخذ من الهدهد ثلاثا :<br />1- الأمانة في النقل .<br />2- سمو الهمة .<br />3-وحمل هم الدعوة .<br />من الإيميلـ ..<br />همسه لكمـ :<br />العبـاد يتقلبون بين أحوال ثلاثه :<br />1 ) النعمه<br />2 ) البـلاء<br />3 ) الـذنب<br />فـ النعمه تحتـاج إلى شـكر<br />و البـلاء يحتـاج إلى صبـر<br />و الذنب يحتاج إلى إستغفار<br />فـ من شـكر وصبر وإستغفر<br />' فـ قد نـال السـعادهـ '"
