text = "اخوتنا الفلسطينيين والعرب الشرفاء من دون الاردنيين الاراذل<br />هذه بعض الصور التي تحكي مأساة شعبنا العزيز واهلنا المظلومين على ايدي الصهاينة والصليبيين الجدد واعوانهم من الارادنة المرتزقة الحقراء عبيد الصهاينة السفلة الذين خرجوا علينا من قاذورات المارينز من عرب الهوية خونة الشرف والانتماء..<br />وبرغم ايماننا بوحدة الامة العربية وحريتها وتقاسم الخبز وشرب الماء مع اخوتنا العرب, الا اننا لا زلنا ننزف بمرارة من خيانة وغدر الغالبية العظمى منهم افرادأ وشعوبأ وتجمعات حزبية وتنظيمية هذا بغض النظر عن خيانات وغدر وتآمر جميع الحكومات العربية علينا وعلى نظامنا الوطني القومي الاصيل, والاصطفاف مع الصهاينه على تدمير عراقنا وذبح اهلنا وشعبنا"
