subject = "حيكم"
author = "زعيم غرب كقرنجه"
posted = "2008-05-24"
text = "سُـئل حكيم : من القوي من الناس ؟<br />قال : هو من يستطيع أن يكبت جماح نفسه<br />ومن الضعيف ؟ قال : هو من تسمع صوته مدويا .<br />ومن هو العبقري ؟ قال : هو من يختلف عليه أثنان<br />ومن هو العادي ؟ قال : هو من يتفق عليه أثنان<br />ومن هو العاقل ؟ قال هو من ينحني للعواطف<br />ومن هو المجنون ؟ قال : هو من يدعي العقل .<br />ومن هو التافه ؟ قال : هو من يتصور أنه أذكى الناس .<br />ومن هو الثرثار ؟ قال : هو من يتحدث دون معنى<br />ومن هو الفصيح ؟ قال : هو من يوجز في حديثه<br />ومن هو العالم ؟ قال : هو من تجد عنده المعرفة<br />ومن هو الجاهل ؟ قال : هو من يدعي المعرفة دون إدراك .<br />ومن هو البخيل ؟ قال: هو من يعيش على أرزاق الآخرين باستغلال وتطفل .<br />ومن هو الكاتب ؟ قال : هو من يكتب بإحساسه.<br />ومن هو الصادق ؟ قال : هو من يصدق أولا مع نفسه<br />ومن هو الكاذب ؟ قال : هو من غره الشيطان بنفسه<br />ومن هو الناقص ؟ قال : هو كل إنسان<br />ومن هو الكامل ؟ قال :<br />هو من بعث رحمة للعالمين نبينا محمد صلى الله عليه و آله وسلم"
