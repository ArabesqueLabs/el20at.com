text = "اخي محمد نواف الحمد الله الشرارات.. اذا كنت من الشرارات فيجب عليك ان تعرف ان هذه القبيلة التي اتشرف بالانتساب اليها هي إحدى القبائل العربية المشهورة بالكرم والنخوة والشجاعة، وهي عربية الخلق والعادة، ويرجع نسبها إلى قبيلة كلب بن وبره القضاعية القحطانية المشهورة .. انا لا اعرف كيف تعتقد ان الفلسطينيين كانهم جنس اخر من البشر.. جميع عشائر وعائلات فلسطين هي من اصول حجازية او نجدية او يمنية.. تماما مثل القبائل والعشائر في الاردن.. لا فضل لاحد منهم على الاخر الا بالتقوى.. واذا كنت تعتقد ان الدم الفلسطيني دم رخيص والدم الاردني دم غالي فانت واهم..<br />وعليك ان تعرف ان الفلسطينين في غالبيتهم شعب مؤصل ينتمي في جله الى قحطان وعدنان وكذلك في الاردن هم ناس اهل اصالة ومعدنهم ثمين.. وانا كوني من الشرارات لا ارى فرقا بين شراري في الاردن او في السعودية او في اي دولة عربية مصداقا لقول الشاعر<br />طلبتهم ميه و صيدي حبارات ودي لبن لا جاهم السيل iiبدري<br />عسى الحيا يروي ديار الشرارات حلابتن للضيف من قبل iiيدري<br />انا مثلا يعود نسبي ونسب عائلتي الشراري في بئر السبع اصلا الى الشاعر محارب بن جديعان وهو<br />من الحلسة - السعودية من الشرارات عاش في القرن الرابع عشر الهجري واورد له هذه الابيات<br />ياراكباً حمرا ردوماً رهيفه … ترعى ثمر إديارنا خط نيله<br />مدت من الخنفة على نجد معباه … واحذر عليها عن مراتع بقيله<br />الخنفه الخفره كما البنت بخباه … بأيام عرس وطايباً له حليله<br />إن أخصبت أسامره مع دحاياه … تلقا منازلنا مفايظ دبيله<br />فرن بنا فرة قطاناً عن مدحاه … وتسابقاً به موميات الجديله<br />اقول يا اخ محمد على رسلك فكلامك على النت سوف تسال عنه يوم القيامة فماذا ستقول لرب العالمين حين الموقف العظيم.. انت تعمم على كل الفلسطينيين واغلبهم له اخ شهيد او ابن شهيد او اب شهيد.. ستقف بين يدي الحق ويقول لك لم كتبت عن عرض هذا ولم شتمت هذا وانت لا تعرفه احذرك واحذر نفسي من يوم لا ينفع فيه مال ولا بنون الا من اتى الله بقلب سليم وقد اعذر من انذر"
archived = "2010-03-14"
