text = "اول شي شكرا على كل تعليق على الموضوع ومافي تعليق الا بدل على شخصيه صاحبو وانا اردني ومن قبيله بني حسن ومن ومعروف من غير ماحكي امتداد القبيله بالاردن وفلسطين وبالذات القدس ولاصولهم البدويه لسه الاقصى صامد مابمثل برايي الا نفسي وذكر اسم عشيرتي مابدل الا اني بفتخر فيها بس والي بدو يرد على واحد مش يرد عليه بالتعميم الاردنيه او الفلسطينه وبعدين مالهم البدووووووووووووو بدك مليون سنه لما تتعلم شو يعني البداوه يعني فروسيه يعني شهامه يعني غيره يعني شجاعه بدك مليون سنه لما تستوعب شو بحكي لانو الي مثلك مابيعرف شو بحكي بالخليج بحطو ملايين عشان بس يعيشو لحظه بداوه مع الخيل والصيد ..الخ بس انا شايف مثلك كثير ومارق علي من امثالك انا درست بالجامعه وبعرف الي مثلك يفوت على الحمام عشان يعبر عن راييو او من ورى جهاز كمبيوتر والمرجله يالي تسب البدو مو هيك سب على بدوي بوجهه وبعدين انتو الي علمتونا يالله دنيا طيب سوال قديش في بفلسطين عملاء لاسرائيل واولهم حركه فتح اعطيني اردني انمسك بعمالتو لاسرائيل بالعكس اغلب الي استشهدو من الجيوش العربيه على اتراب فلسطين من ابناء العشائر الاردنيه لانو عندهم نخوه للاقصى بس الي مثلك ريحتو طالعه ومفكر حالو اشي كثير انو فلسطيني وانا بالاول وبالاخير قبل ما اكون اردني انا مواطن عربي ومسلم وبتهمني قضيه فلسطين بس العيب انك تتنكر لبلد فتح الك ذراعو وعلى قد ماتحكي عن البدو البدو استحملوك عن طيب مش عن خوف بسوريا وهيا بعثيه حاطين الفلسطينيه باشياك عازله وبلبنان مخيمات مابيقدر يتساؤ بادنى حقوق لبناني وبليبيا طردوهم بس بالاردن الك حقوق اكثر من ابن البلد بس الحق مش عليكم .الله بلا الاردنيه بعيله تدعي نسبها للنبي وهيا بالاصل عيله سكناجيه ماشيه على خطط الصهيونيه العالميه والاردن رح تلحق فلسطين يابياع الترمس يامقلعط لانو الاراضي الاردنيه قاعده تنباع لليهود وعن طريق مين سماسره فلسطينيه وهالبلد بوجها على الخراب مادام الي مثلك ومثل غيرك مابتكون نظرتهم الا بس لحد انفهم بس انا بعرف هالحكي بياع ترمش مالو شغله ولا عمله وكل جبان مثلك الا يفرغ بسمو على بلد ماقصرت معو بس مثل ماقال الشاعر ( لاتصنع المعروف في غير اهله ) انا مابعمم على الفلسطينيه كلهم بس كل كلب مثل هالواطي وانا بحكي بكل اسلوب فكري مع كل حر بشارك بهالموضوع بس عيب ياعرب اكبرو اطلعو للايام الجايه شو رح يصير بالبلاد وبلا عنصريه ومادامكم هيك رح تتحقق (ارضك يا اسرائيل من الفرات الى النيل ) بهمه كل كلب عميل وكل متعنصر تافه يتنكر لمعروف او مابقدر الواجببس سوال ؟؟وين رح نصفي احنا وانتو ؟؟؟؟؟؟؟؟؟؟"
