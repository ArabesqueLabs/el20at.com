subject = "الاهم فلمهم"
author = "امراه تحب العرب"
posted = "2008-06-24"
text = "السلام عليكم يا معشر العرب انا بدى اقول كلمه لو البنادم عرف حجمه فى الدنيه ما كان يتشاجر عليها لو هو فهم انه ضيف لو طال بيه الزمن ولا قصر هو ضيف وهيسبها اجالا او عاجلا لو يهتم الانسان بما يعنيه فقط ويحدد الاهم فالمهم كانت الدنيا ما تلاقى فيها شجار ولا خلافات ولو يعلمو العرب كلهم انهم عرب جنسيه وديانه واحده ما كانو يتشاجرو على ما يسموه اهلى واهلك بدل منحارب بعضينه نحاول نعدل بعضنا نحاول نوحد كلمتنا الشباب بدل ميقتلو بعض على تفهات يحولو ينمو بلادهم بكل الطاقه الى عندهمبدل ميشغلو عضلتهم فى مسك السك السكين يشغلوها فى بنا اى مشروع يهتمو بيه بكده نحصل على التقدم والرقى ويكونو العرب يد واحده لا يقدر عليهم احد يارب وحد كلمة العرب اجمعين مسلمين منهم ومسيحين وابعد عنهم الشيطان الرجيم الى بده يفرقهم اجمعين ويضعهم فى اسفل السافلين"
archived = "2010-03-14"
