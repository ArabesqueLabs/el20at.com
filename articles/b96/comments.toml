text = "السلام عليكم ورحمة الله وبركاته ..<br />لعنة الله على كل من شتم عربي مسلم من غير حق الى يوم القيامة التي اقتربت يا معشر المسلمين ..<br />للاسف يوما عن يوم اعرف اننا لا نستحق العيش بهذه الدنيا ولا بهذا البلد الطهور فالعنصرية اصبحت بدمكم يا كبار العقول<br />ويا صغار التصرفات او يا اطفال , اللي بشتم فلسطين شو سوتلك فلسطين وشو في بينك وبينها علشان تصير لهالدرجة الكره لهذا البلد ولماذا لا تكون رجل وتقول هذا الكلام في الشارع ولكن لانك مراة مش زلمة ونازل بتكتب سمومك هون يا زواهرة ويا سعيدات بقص ايدي اذا ما انتم عملاء لان كلامكم وقح ووسخ , ليس مشكلتنا ان ديانا كرزون من اصل فلسطيني فهي لا تمثلنا ولا نعترف فيها ومتبريين فيها ليوم الدين اما واحد عديم الشرف يشتم فلسطين فهذا مراة مش زلمة , بدل ما انوا نوقف ايد واحدة فلسطيني واردني مع بعض ونبني البلد قاعدين بنهدم بافكارنا الهدامة العنصرية , فلسطين بنفتخر فيها وبنموت عليها والاردن بنعتز بكل رملة فيها والجوز بلد واحد مش اثنين لولا اليهود الانجاس لكنا نعيش في بلد واحد تحت مسمى واحد ولما كان في سوري فلسطيني اردني ولبناني بس اليهود لعنة الله عليهم ليوم القيامة فرقوا بينكم وانتوا اطفال عقولكم صغيرة , الشغلة مش بالعمر بس لانكم كنادر , نعم كنادر وعنصريين وهذا الكلام موجه لكل من يحب العنصرية , هذي بلد ابو حسين واللي علمنا فيها نكون واحد مش اثنين ,, يعني مش ملك الك يا اردني ولا حتى الك يا فلسطيني , هي بلد العرب جميعا شئتم ام ابيتم وبدل ما تشتطروا على بعض قاطعوا المنتجات الدنماركية اللي بشتموا بديننا دايما واليهود اللي بقتلوا باخوانكم الفلسطيننين والامريكان اللي دمروا العراق واللي فرقوا بين الشيعة والسنة بالعراق وزي ما سووا اليهود هون وفرقوا بين الفلسطينين واليهود , المشكلة ان كل سموم العنصرية موجودة في مكانين وهي الانترنت ومباريات الوحدات والفيصلي التافهة لان الفريقين اتفه من بعض وهم اللي مخربين البلد وبنتشر بالهملاعب اوسخ الناس وسموم العنصرية بتطير من هون لهناك حتى توصل للحقد , انا صحيح فلسطيني وبعتز فيها بس ما بنكر فضل الاردن الكبير علي وعلى اهلي وهاي حقيقة يا اولاد بلدي شئتم ام ابيتم الاردن لها افضال كبيرة علينا ولنعطي صاحب الحق حقه والى الزواهرة اذا حصلت معك مشكلة مع فلسطيني واصبحت تحقد عليهم جميعا فاذهب لمكان اخر حبيبي لاننا ولاد بلد واحد خاوة عنكم وعن غيرك اللي شتم هون , اصحوا يا عالي والله انكوا مشاطيب واحد يقول للثاني , قال اردني وفلسطيني , لا حول ولا قوة الا بالله بس ..<br />تعيش المملكة الاردنية الهاشمية وملكنا المفدى عبدالله وعاشت فلسطين حرة ابية .."
