text = "لم تعد رحلة الملك حسين قبل حرب اكتوبر تشرين بطائرة هليوكوبتر خاصة الى تل ابيب لاخبار القيادة الاسرائيلية عن نية الجيشين السوري والمصري بالهجوم على اسرائيل فالملك نفسه اعترف في مقابلة بثها التلفزيون الاسرائيلي بهذه الرحلة وظهرت المقابلة في برنامج خمسون عاما على الصراع وقد غضب الملك في حينه من محطة ام بي سي التي عرضت البرنامج ومقابلة الملك بعد ترجمتها الى العربية<br />الجديد في الموضوع حول خيانة الملك هو تفاصيل هذه الزيارة ... فقد صدر كتاب في اسرائيل لضابطين من الموساد كشفا فيه النقاب عن ان الملك وصل الى منزل رئيسة الوزراء غولدامائير بطائرة هليوكوبتر ومعه شخص واحد فقط وانه انتقل معها الى مقر الموساد<br />وقال المؤلفان - وهما عملاء للموساد - ان الانذارات والاخباريات في حينه تواردت بغزارة و”حرب الغفران”، كما تطلق عليها “اسرائيل”، لم تهبط فجأة على غولدا مائير وموشيه ديان، بل عرف الاثنان ان الحرب وشيكة وكل ما أطلق حول مفاجأة الحرب كانت فرية ابتدعت في وقت لاحق لتمكين المسؤولين من التملص من تهمة الفشل.<br />ويقول الكتاب ان الانذار الأول صدر عن قائد المنطقة الشمالية في حينه، اسحاق حوفي، الذي قال في جلسة القيادة في 24 سبتمبر/ أيلول ان الجيش السوري موجود في حالة استعداد هجومية، الأمر الذي يمكنه من شن هجوم مفاجئ، وقد رد عليه ديان قائلاً: “ان السوريين لن يخرجوا الى الحرب في التوقيت الحالي<br />في اليوم التالي وصل إنذار من الحسين ملك الاردن ووصل الملك بنفسه في رحلة سرية الى تل ابيب بطائرة هليوكوبتر وطلب لقاء مع القيادة “الإسرائيلية” ووصل مع اثنين اخرين يعتقد انهما زيد الرفاعي وطياره الخاص وقد عقد اللقاء مع غولدا مئير في مقر الموساد. وحسب الكتاب فإن الملك اوضح لمئير أن المخابرات الاردنية وجواسيسها في دمشق تشير الى أن السوريين يستعدون للحرب. وقال الملك للاسرائيليين ان تحركات الجيش السوري تتم على انها مناورة مع انها في الواقع استعداد لشن الهجوم على اسرائيل<br />الانذار الثاني، الذي يتحدث عنه الكتاب، ورد من وكالة الاستخبارات المركزية الأمريكية في الليلة الفاصلة بين 29-30 سبتمبر/ أيلول. تقرير ال “سي. آي. ايه” تحث عن ان الجيش السوري قد دخل في أهبة الاستعداد للقتال ووفقا للمصادر فان الاستخبارات الامريكية التي كان يعمل الملك فيها موظفا براتب سنوي تلقت هذه المعلومة ايضا من الملك حسين الذي تفرغ يومها فيما يبدو للتجسس على سوريا لصالح اسرائيل<br />الكتاب يتحدث عن انذارين آخرين وردا من مصر من مصادر بقيت أسماؤها سرية ودعمت أقوال “كورت”. ثم أكثر الانذارات ثقة وصلت من رجل استخبارات من مصر أطلق عليه “بابل”.<br />زيارات ملوك ال هاشم السرية الى اسرائيل ليست جديدة فقد بدأها الامير عبدالله مؤسس امارة شرق الاردن وفي اول زيارة له اصطحب معه حفيده حسين الذي اصبح ملكا ... والملك التقى عشرات المرات باسرائيليين في عيادة طبي الاسنان الانجليزي ... وابنه الملك عبدالله التقى سرا اكثر من مرة بشارون كان اخرها قبل 24 ساعة من اغتيال الشيخ ياسين قائد حماس ولو لم تقم الاذاعة الاسرائيلية بتسريب الخبر لما عرف العرب به"
