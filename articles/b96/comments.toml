text = "السلام عليكم ورحمة الله وبركاته ,إخوتي الكرام أريد أن أذكركم فقط بأن محمد نواف الحمد الله هو أردني أصل , ولكن أريد أن أثبت لكم فقط بأن أسفل شعب بالعالم كلو هم الشعب الأردني , مع إني أنا أردني من أصل فلسطيني , لكن لا ننسى بأن هناك تمييز وعنصرية كبيرة ورهيبة جدا بالأردن , وهي التمييز بين الأردني الأصل والأردني من أصل فلسطيني ...............<br />إخوتي أريد أن أثبت لكم فقط بأنو الأردني لا يمكن أبداً بأن يحب الفلسطيني , فهما شعبان متضادان ولا يمكن أن يلتئمان لماذا؟ كله بسبب أفعال وأخلاق هذا الشعب الحقير المشين بقيادة ملكهم المخنث الحقير السافل العميل , ولا تنسوا إخوتي الكرام<br />ما فعله الكلب القرد المخسوف بقبرو الملك حسين الله لا يرحمو البعيد في قبرو عندما قتل 33 ألف فلسطيني بالضفة الغربية<br />في أحداث أيلول الأسود , وشربهم من الشخ وأكلهم الخرا وكان محوط وحايط الضفة الغربية في جحيم وعذاب , والحمــــــد لله الفلسطينيين داعسين على رقاب الأردنيين في الأردن كلها حيث نحن 3 مليون فلسطيني بالأردن و400 ألف أردني معفن مش كلهم برضوا ... إخوتي الكرام : لولا الله العظيم ثم وجود الفلسطينيين الآن بالأردن ولا كانت الآن الأردن هي أخزى دولة على وجه الأرض , إخوتي الكرام : أريد فقط بأن أريكم نموذجا من نماذج الحقير السافل المنحط الواطي الساقط محمد نواف الحمد الله الذي قام بسب الفلسطينيين سباً قوياً وشتمنا بكافة أنواع الشتائم , ووصل به أن يعاتــــــب الله سبحانه وتعالى وحاشاه بأن الله هـــــــو الذي جمع كل أوساخ الدنيا وأنجاسها ووضعها بالفلسطينيين لكي يبتلي الأردنيين وهذا مقتطف صغير وبسيط مما قاله<br />على الله عز وجل وحاشاه سبحانه عندما قـــــــــــال :<br />(يعني الله سبحان الله ( لا إعتراظ على حكمو ) بس هو جبلنا مجموعة من الوسخ والعفن والقذارة والحقارة والسفالة والنذالة والحيونه والهمجية والنورية والبجمية اللي مش طبيعية وكل إشي زفت ولا يطااااااااااق بالمره ونهائي !! وراح حاطو فينا وعطينا إياه .. وعلى مين راحت ؟؟؟ أكيد راحت علينا حنا الأردنيين .. وإجوا الفلسطيزية القواديين القحاب على بلدنا وخربوا فيها ونشروا فيها وسخهم وعفنهم بمختلف مناطة المملكة) .... انظروا كيف وصلت به السفالة والحقارة الفظيعة اللامتناهية وكأنه يعاتب الله تعالى<br />على مجئ الفلسطينيين للأردن الخــــرة , حيث أن له تعليق آخر يقدم فيه الأردن على الله عز وجل في علاه .....<br />إخوتي الكرام : لا أريد أن أتحدث كثيرا , ولكن لكي أثبت لكم ذلك , أرجو منكم كل الرجاء وبخالص وصادق الرجاااااااء بأن تدخلــوا<br />على هذا الرابط : http://www.20at.com/newArticle.php?sid=12273<br />وهي بعنوان : ارفع راسك أنت فلسطيني على الفيس بوك (يمكن كتابتها بالبحث للعثور على الصفحة او استخدم الرابط) ...<br />والمصيبة والطامة الكبرى بأن الموضوع كله يتكلم عن ذكريات فلسطينية وعن أيام النكبة وما حصل لفلسطين الحبيبة من مجازر<br />ونكبات على يد الإحتلال الصهيوني الآثم الغاشم , فجأة ونلقى محمد نواف الحمد الله وعلى من حذا حذوه من الأردنيين السفلة بأول تعليق وهو مسمي نفسو الأردني وله أسماء أخرى سأذكرها الآن وقام بالسب والشتم الفظيع التي تدل على أنه رجل (شبه رجل والله) منحل وساقط أخلاقياً , والذي يقول ليس بيننا وبين الشعب الفلسطيني فرق , ويقوم بالمدح وبعدها يقوم ويسب كالكلب المسعور الــــــــــــذي صعقته صاعقة قوية ............<br />لقد وجدنا أذىً رهيبا والله بالأردن من قبل الأردنيين , وأن أساس العنصرية والفلتان التربوي الفظيع هو نابع من أخلاق هذا الشعب السافل الحقير , وانظروا من الذي جعل للأردن سمعة على الساحتين العربية والعالميـــــة في نفس الوقت , وأن جامعات الأردن الآن من أقــــــوى جامعات العالم كلها , لماذا ؟ لأن كل العاملين فيها فلسطينيين وكل مدراء الجامعات ووكلائها وأساس قوتها ومتانتها وصلابتها وسمعتها هـــــم الفلسطينيون .. ومن الذي بنى الصرح التعليمي والعسكري والأمني والجغرافي للأردن ؟ من<br />الذي جعل الأردن الآن مثل أوروبا بعد أن كانت صحراء قاحلة طاحنة ؟؟! إنهم هم الفلسطينيون بدون أي شك ......<br />فـللفلسطينيين أفضال كثيرة جداً على الأردنيين , بعد أن كانوا مجموعة بدو حثالة مشردين , وتذكروا بأن أغلب أصحـــــــــاب<br />الشركات والمؤسسات والبوابات السياحية هم فلسطينيون بالأساس , وهذا شئ لا يمكن إنكاره أبداً أبداً , لكن ادخلوا على<br />الرابط , وانظروا أول تعليق , فالسافل الخسيس محمد نواف الحمد الله له أربع أسماء ولا تؤاخذوني على بعض أسمائه النتنة :<br />(الأردني , وأردني من السلط , ومشتهي نيك الفلسطينيات , نياك الفلسطيزية من الأردن) , وأنا قد قمت بتهكير كمبيوتره واكتشفت كل هذه الأسماء , لذلك هو الآن قد حظر نفسه من الدخول بعد أن قمت أنا بتهديده , انظروا كيف قام بالسب والشتم الفظيع التي تدل على أنه حيوانا لا يفهم ولا يتفاهم , وأنه قد نشأ وترعرع على قمة السقاطة والوطاوة والنذالة , ولم يكتف بذلك فقط , ولكن أنتم تعرفون بل وأعرف مني بأن أهل الأردن 98% من أهل البادية , وأهل البادية كما قال الله سبحانه وتعالى عنهم :<br />{الأعراب أشد كفراً ونفاقاً} فلا تستغربوا من هذا الحقير وغيره من الأردنيين السفلة بأن يقولوا لكم مثل هذه الأقاويل , فقد<br />سمعناها كثيرا منهم , فهم يتكلمون بمعسول الكلام , وهم أنفق ناس على وجه الأرض , أرجووووووووووووو من الجميع الدخول على الرابط واحكموا بأنفسكم , فأول تعليق وااااااضح وكافي على قمة الخنزرة والوقاحة التي وصلوا إليها من خلال تعليقاتهم ...<br />وهذا الحقير الذي يقول بأنه ليس هناك بين الأردنيين والفلسطينيين أي تمييز , لكن كل كلامو كذب بكذب لأني أنا عايش بالأردن<br />ووجدت هذه العنصرية البجمية الهمجية السفلية .... وللعلم أيضا من الذي يقوم باختلاق وافتعال العنصرية والمشاكل بالجامعات الأردنية ؟!! إنهم هم الأردنيون أنفسهم , وأنا بنفسي بدرس بالجامعة الأردنية ووجدت كثيرا من الإهانات والأذى , ولكن الحمد لله أدبت الكثيرين منهم ................<br />فلتعلموا بأن الشعب الأردني شعب سافل سافل ومنحط وحقير إلا من رحم الله تعالى منهم , ما بحط برقبتي إنهم كلهم حوَش وبجم وسقايط لأنو فيهم محترمين لكنهم قلللللللللللللللة وبنعدوا على الأصابع , وآسف على إطالتي للموضوع , وشكرا جزيلا لكم ولا تنسوا الدخول على الرابط لكي أثبت لكم كيف يستخدم الشباب الأردنــــــي الإنترنت ...................<br />للأسف بأن المنافقين كثروا , وأولهم هذا الكلب السافل المنحط الساقط الواطي المنحل محمد نواف , هنا يسب ويدعي ولكن ادخلوا على الرابط وانظروا كيف هي التعليقات التي كتبها وتجرأ وتتطاول بها على الله عز وجل في علاه وحاشاه سبحانه , وأريد التذكير بأن هناك شخص عليه لعنة الله قام بوضع ما يسمى بسورة الفلسطيزيون وكما يقول آياتها تسع عشرة وانظروا إلى الكفر الشديد والرهيب التي وصل إليها هذا الشخص الساقط المنحل لكي يقهر الفلسطينيين , ولكن بالمعنى العام هو اللي :sad:ماكل مليون خرة بإذن الله بنار جهنم وبئس المصير) ..........<br />أرجو الدخول على الرابط لكي أكون صادق معكم وأنتم ستكونون لجنة التحكيم , وشكرا جزيلا لكم وآسف كتير على الإزعاج .....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ :::: ملاحظة خاصة :::: ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />يا محمد نواف الحمد الله , يا شيخ والله لأشرشحك وأخلي الكل يتف عليك , كفاية إنك أصلاً متفوف عليك ومدعوس عليك بالجزمة وعلى كل الأردنيين تبعونك يا بن الكلب , لسة والله لأخلي اللي بسوى واللي ما بسواش يدعس على رقبتك غصبا عنك يا كلب<br />يا واطي , ولأفضح بعرضك وشرفك يا شراري يا أردني يا معفن , وأخليك فرجة للكل ولبانة وعلكة بتم الجميع , ورح أخليك توكــل<br />خرة بالملعقة والشوكة والسكين لما تشبع وتطفح يا كلب , واحد بـــــــــــــــــــــــــــدوي منافـــــــــــــق .........<br />:::البدو أنذال شُعث غبر الوجوه ان أمنتهم خانــــــــــوا:::<br />:::وإن شبهتهم بالكلب صاح الكلب لا بشعرة في ذيلي بألف ألف ترباني ...... :::<br />الشعب الأردني شعب كلو خرا من السفلة والعملا والحقرا بستاهل ينداس بالصرماية القديييييييييييييييمة (مش كلهم برضوا)<br />وعلى العموم أنا فلسطيني وبحكيها بكل فخر , واللي مش عاجبو بعرف أتفاهم معو بعدين إن شاء الله ..<br />واعذروني يا إخوة على الإطالة ولكن ما كان بقلبي أعجز من أن يكتبه القلم !!!!!!!<br />وللحديث بقية ودمتم بـــــود .....<br />مع أطيب التحايا وأعذبها .......<br />:::: عاشت فلسطين : من الفاء للنون , ومن النهر للبحر ::::<br />أفضل الذكر : ((لا إلــــه إلا الله))"
