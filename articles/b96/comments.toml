subject = "فعلاً عيب ..."
author = "محمد نواف الحمدالله ..."
posted = "2007-12-16"
text = "الظاهر أنو مافي فايدة .. بعدنا متخلفيين وهبايل ومساطيل وماكلين خرا من تحت رجلينا وعايشين عيشة الهندي الأجرب ..<br />وبدناش إشي اسمو تطور أو تكنولوجيا .. عايشين عيشة السبهللي \" الناس اللي عايشة على البركة، أو في رواية أخرى كيف ماتيجي تيجي .. !! \".. لما الواحد يشوف اللي قاعد بصير بكلا البلدين ( الأردن وفلسطين ) من مشاكل عنصرية أو أي اشي بدخل تحت مفهومها .. بصير يقول ليش حنا هيك دايماً داقين ببعض .. عمري ماشفت واحد أردني بحب فلسطيني والعكس صحيح بالنسبة للفلسطيني .. أنا إنسان عايش بإحدى دول مجلس التعاون الخليجي ( الإمارات العربية المتحدة * )، وعنا الناس هونه بعرفوش اشي اسمو عنصرية وعندهم كل الناس مثل بعض، فش حدا أحسن من حدا، وأنا أتحداكو إنكو تجيبولي إماراتي \" ابن البلد \" بحكيش عن مشاكلنا وعنصريتنا اللي لاقدمت ولا أخرت إشي بالعكس قاعدة عم تتطور وبتكبر المصيبة، وقاعدين عم بنعلم أولادنا وأولاد ولادنا وأولاد وأولاد أولادنا \" جيل بورث جيل \" .. طيب ليش هك !!! .<br />وعلى سبيل المثال لاالحصر، مرة واحد إماراتي بسألني أنتا من وين ؟؟ قلتلو أنا من الأردن .. خير إنشالله ؟! .. قام ظحك وقلي أنتو ليش بتكرهوا الفلسطينية ؟؟؟! .. صفنت فيه وقلتلو بالعكس مسن حكالك هاذ الحكي، وأنا ...... : ولسه بدي أكمل كلامي \" قام قاطعني وقلي عيب عليكو أنتو أخوة ولازم كل واحد يساعد الثاني على عدوه وأنو القدس والأقصى مش بس للفلسطينية بل لألنا كلنا وقلي أنا مستعد أروح أعيش بفلسطين وأوكل تين وزيتون وأعيش عيشة الفلاحي وأرفع راسي أني عايش ببلد حلو زي فلسطين .. طبعاً أنا مع عرفتش شو بدي احكي .. وقلتلو كلامك صحيح وأنا معك ميه بالميه .. يعني شوفو لوين ؟! إذا ع مستوى واحد إمارتي بقول هالكلام وهوه ماإلو خص بينا ( الأردنية والفلسطينية )..<br />يعني وين مابتروحوا بتلاقوا سيرتنا ع كل لسان .. طيب ليش !! وبتحكوا الناس ليش هيك علينا وبتحطوا الحق ع الناس كأنهم الناس إلهم دخل باللي قاعد عم بصي ؟؟؟ .. يا أخوان لولا تخلفكو وهبلكو وعصبيتكو اللي لاودت وولا جابت ولولا كمان همجيتكو وجحشنتكو وغجرنتكو .. ما كان الناس حكو عنكو ؟؟؟!!! وهاذ جوابي \" معلش إذا كانت ألفاظو وسخة .. بس شو اسوي ! \" وجواب كل واحد بفهم ياللي قاعد عم بصير .<br />روحوا شوفوا دول الخليج .. ولا الدول الغربية \" الإتحاد الأوروبي \" .. ولا دول المغرب العربي الكبير ..<br />ليش مانصير زيهم ليش ؟؟؟ شو ناقصنا ؟؟؟ إيد ولا رجل ولا لسان حتى نحكي فيه ؟؟؟ ولا حنا ناس بنبقلناش نصير آوادم وولاد ناس وعالم .. نتحظر ونتطور ونواكب العصر ؟؟؟ ليش ما نتوحد ونصير شعب واحد الألم واحد الحزن واحد الجرح واحد الدم واحد الأمل واحد الكفاح والنضال واحد ؟؟؟إذا صار إشي للواحد منا يقوم الثاني ويوقف معاه يساندو يساعدو يعطيه إذا احتاج ؟؟؟ ليييييييييييييييييييييييييييييييييش ؟!<br />ليش كل واحد منا دافن راسو بالأرض .. وكل واحد فينا بحكي اللهم نفسي .. ليش لما بتحكي للواحد عن اللي بصير بالعالم .. بحكيلك وأنا شو دخلني \" أو بمعنى أنو شو طالع بإيدي \" ؟؟!<br />وكلمة أخيرة لأحلى بلدين بالدنيا ( الأردن وفلسطين ) . عشان نعيش مع بعض إخوان كل واحد بحب الثاني وبتمنالو الخير والتوفيق .. نعيش بمحبة وسعادة .. ننسى اللي راح .. نفتح صفحة جديدة .. وهون عندي سؤال كبير جداً وعليه علامتين كبار كثير وحده استفهام والثانية نعجب .<br />* متى رح نشوف الأردني والفلسطيني أخوان ؟!<br />شكراً لكل إنسان بفهم وبس ،،،"
