[[comments]]
order = 530
subject = "الاردن اولا"
author = "حمود المحيسن"
text = "هيك حكي ما بمشي معنا شباب الاردن اولا وانا بدي اقول انه الكلام الي قلته في التعليق الاول ليس عن الفلسطينيين عامة بل عن اشخاص معينه وهي الي سببة هاذه المشاكل الي مات من وراها اكثر من طالب بالجامعه الاردنيه لاكن العنصريه نلاحضها عند عدد كبير من الفلسطينيين الي عايشين بالاردن ليش ؟ سؤال يطرح نفسه ؟؟؟؟.... ومابدنا ندخل شؤون سيأسيه بالحدث الي صار بالجامعه وبدي اقول اني مو عنصري ولا احب العنصريه لاننا احنا والشعب الفلسطيني نعتبر شعب واحد لاكن الي يقهرك العنصريه الشديده بين الطرفين الاردني والفلسطيني وبعدين هاذا مكان تتعلم وهاذا المكان هو الي يحدد مستقبلك اذا فلا ارا داعي اصلن لكل هذه المهزله ....... حسبنى الله ونعم الوكيل"
