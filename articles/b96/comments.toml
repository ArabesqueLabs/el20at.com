subject = "الأردن وفلسطين"
author = "محمد العدوان"
posted = "2008-06-08"
text = "بعد التحية والتقدير،،،<br />أنا أردني من أصل أردني، ولكن حالي كحال الكثير من الأردنيين الأحرار ومن باب الانتماء الحقيقي لوطني ولأمتي العربية ككل، القضية الفلسطينية تأخذ حيزا كبيرا بل عظيما من اهتمامنا ورفضنا ليس لما يقترفه الصهاينة بحق إخوتنا الصامدين في القدس والخليل ونابلس ورام الله وجنين الصمود وقلقيلية وغزة هاشم وفي مناطق الـ 48 فحسب، بل نرفض أيضا هذا التقصير الفاضح والفاحش من العرب تجاه القضية الأم، وعليه فإني مع احترامي للأخ الكاتب لا أعترض على ما قدمه المطرب الأردني العبداللات، ومن حق كل إنسان سواء مواطن أو غيره أن يعبر عن انتمائه لبلده وولاءه لقيادته، وإن كانت هذه الأغنية قد جاءت بعد مسلسل طويل للعبداللات تغنى فيه بقيادته ووطنه فلا خير في الإنسان تجاه الآخرين إن باع وطنه، ومن يأخذ من الكرة عبرة للعنصرية وذريعة للكره فلا أعتقد أنه من الوعي بمحل.<br />وإذا قال الأخ الكاتب أن العبداللات وربعه قد رفضوه في يوم من الأيام، فهذا لا يمت للصدق بصلة، فقد فتح الأردنيون بيوتهم لإخوتهم سواء لاجئي الـ 48 أو نازحي الـ 67، ولكن على القراء أن يدركوا أن أحداث أيلول 1970 هي السبب الرئيسي للعنصرية القذرة والتي جاءت بعد أخطاء من الطرفين إلا أن الجزء الأكبر منها يتحمله قادة المقاومة الفلسطينية حينها (الفدائيين).<br />وحتى العنصرية لها جانب واحد إيجابي يكمن في تذكير الإخوة الفلسطينيين بحقهم في العودة إلى فلسطين وكذلك الوقوف في وجه التوطين.<br />واقبلوا تحياتي ..."
