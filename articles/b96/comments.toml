text = "تقول ان كلام ابو فتادة تزوير وقلب للحقائق.. هذا غير صحيح.. التاريخ لا يكتب مرتين.. التاريخ هو التاريخ.. ولا يمكن لواحد مثلك امي ان يكتب التاريخ او حتى ان يحاول ان ينتقد المؤرخين.. ما فعله الاردن اكبر بكثير مما كتب عنه في خانة الخيانة وهو لا يزال على نفس النهج وعلى نفس الطريق.. لا تعتقد انني لا احب الاردن الارض والتاريخ والشعب.. ولكن حب الاردن شيء وما تفعله الدولة الاردنية والحكومات المتعاقبة شيء اخر.. لانها للاسف تصطف دائما في موقع الاعداء الاميركان والصهاينة والغرب بشكل عام.. وقفنا ضد صدام وقتلناه عينك عينك وجنودنا ذهبوا وقاتلوا مع المحتل.. ونصبنا الباتريوت على ثرى الاردن خوفا على اسرائيل من صواريخ صدام.. قاتلنا المقاومة الفلسطينية باوامر من تل ابيب وواشنطن ولندن.. ثم وقعنا اتفاقيات الخزي والعار مع الصهاينة واجرنا ارضنا لتسع وتسعين سنة غصبن عنا.. واليوم تباع البلد عينك عينك وبكرة بسلموك المفاتيح يا الحمد الله تلحس طيزي وسبعك وسبع اللي ما يسبعك"
