[[comments]]
order = 180
subject = "الأردن"
author = "حسني مقدسي فلسطيني"
posted = "2007-03-11"
text = "يا إخواني اللي علقتوا على الموظوع كنتوا فلسطينيين الأصل أو أردنيين ... لا داعي لهذا العراك ... و هذا هو أنا أول واحد بيعرف إنه الأردنية أهل نخوة و أصالة و لا داعي للعنصرية و ما في فرق بين الفلسطيني و الأردني ... و الله اللي بقرا كلامكو بيقول قاعدين بنحارب دولة غربية ... و لا فرق بعيدها من جديد و هذا هو أنا أكبر مثال ... حسني لاكني من بني حسن فلسطين ... و كما الأردنيين أهل نخوة هم الفلسطينيون أيضا ... و الفلسطيني اللي بيجيب معدل أردني بالعاطل أو الأردني اللي بيجيب معدل فلسطيني بالعاطل شخص جاااااهل و لا يقدر قيمة الطرف الأخر ...<br />إلى إخواني الأردنيين : الفلسطينية ما عمرهم كانوا أنجاس كما تقولون ،،، هم أهل نخوة و أصالة و تاريخ ... لاكن ربما أنتم ترون بعض الفلسطينيين عديمي المبادىء و المتعصبين كما يوجد أردنيين متعصبين كما رأيت في التعليقات أعلاه ...<br />أنا لا أقول هذا الكلام خوفا من فلسطيني أو أردني و الأصيل ما عمره هاب منية ... إنما أقوله للعقلاء ...<br />لماذا نرى دول الخليج تتوحد و تتعاون و نحن الأشقاء و ربما أكثر من أشقاء فهناك بعض العشائر من نفس الأصل موجودة في كلا البلدين و انا أولهم ... لماذا نرى أنفسنا متعصبين و متخالفين ...<br />دول الخليج تتعاون ... و دول المغرب تتعاون ... إلا الفلسطيني و الأردني ما زالوا (نقرهم من نقر بعض) ...<br />أنا أدعوا كل أصحاب النخوة و الشهامة بأن يجيبوني و يفهمونني لماذا ما زلنا نتخالف ...<br />أتدرون في الخليج ماذا يقولون عن الفلسطيني و الأردني ... إنهم يشمتون بنا نحن الشعبين لكثرة و إستمرار خلافتنا ...<br />فإستيقظوا من غفوتكم قبل أن تغرقوا في النوم ... و خوفي أننا غرقنا !!!<br />أخوكم : الحسني الفلسطيني ..."
archived = "2010-03-14"
capture_url = ""

