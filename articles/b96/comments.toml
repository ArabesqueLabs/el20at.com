text = "اعتقد ان كل خطا يا بنى هاشم يغفر الا الخيانة الملك حسين بشهادته على نفسه اكثر من مرة اعترف انه ذهب ليحذر اسرائيل وجولدمائير من ان سوريا ومصر على شك شن الحرب فاى مبرر دفعه الى ذلك اى شى يبرر فعلة سيئة ولكن لحسن حظ العرب ان الرئيس السادات وحافظ الاسد اتقفا على عدم اشراك الملك حسين معهم وكذلك استخفاف جولدمائير بكلام جاسوسها الملك بالملك حيسن بن طلال والاخذ براى قادتها ورجال الجيش فيها بعدم التحرك<br />واليوم ابنه يعيد نفس التاريخ فقد ذهب الى واشنطن واجتمع مع زعماء اسرائيل وحذرهم من ان حزب الله وسوريا يعدان خطة لشن الحرب.. مما جعل اسرائيل تسارع في شن حرب تموز على لبنان وضرب المفاعل النووي السوري في الشمال<br />خيانة التاريخ ام تاريخ الخيانة هذا هو تاريخكم الاسود ايها الاردنيين الكلاب"
