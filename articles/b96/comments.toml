text = "الله لا يوفقكوا.. ولكوا انتوا منايك شراميط.. على الظمان انكوا بتنتاكوا يا اخوات القحبة.. ولكوا انتوا اللي بلشتوا في الفلسطينية تنهم جابوا خميرنا يا اخوات الشرموطة.. مش عارفين انتوا شو حكامنا وشو احنا.. ولكوا اللي لا يوفقكوا الفلسطينيية ناكونا نيك.. مش عارف حضراتكوا انه الفلسطينية بنيكوا قاعدين في الجامعات في احسن بنات العشائر ومطلعين على كل شيء ولكوا يا اخوات القحبة انا من خلال عملي في الامن بعرف نسوان الزواهرة بنتاكن بخمس ليرات والعجرميات بنتاكن قاعدات من الحمير يا اخوات الشرموطة شو الداعي تجيبولنا الكلام الوسخ يا وسخين يا معفنين<br />كس امياتكوا واحد واحد"
