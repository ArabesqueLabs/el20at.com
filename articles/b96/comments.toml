subject = "الاردن اولا"
author = "ابو رستم"
posted = "2008-06-28"
text = "الاردن اولا في خدمة الصهيونية العالمية ................ الاردن اولا في خدمة الكيان المسخ اسرائيل.. الاردن اولا في خدمة الانجليز والاميركان وكل زب غريب........... الاردن اولا في التامر على شعب فلسطين وعلى القضية المركزية للامة العربية.......... الاردن اولا في التامر على العراق وشعب العراق وعلى الرئيس الراحل العملاق صدام حسين التكريتي.... الاردن اولا في التامر على سوريا وعلى حزب الله في لبنان................... الاردن اولا في التامر على حماس والجهاد الاسلامي وكل فصائل المقاومة الفلسطينية.............. الاردن اولا في التخطيط مع الصهاينة والانجليز لاحداث ايلول الاسود وتمهيد الطريق امام حشر المقاومة الفلسطينية في الزاوية الضيقة وابعادها عن خط المواجهة مع اسرائيل.. الاردن اولا في التخطيط والتامر مع الموارنة في لبنان ضد الفلسطينيين في المخيمات وارتكاب المجازر القذرة في تل الزعتر والبداوي وصبرا وشاتيلا.. الاردن اولا في الاصطفاف مع كل ما هو ضد العروبة والاسلام......... الاردن اولا في الحج الى البيت الابيض ولعق الاحذية والبساطير الاميركية............ الاردن اولا في اذكاء العنصرية والاقليمية في البلد كرمال عيون اعداء الامة<br />الاردن اولا في حراسة دولة اسرائيل القذرة............ الاردن اولا في تادية الادوار المشبوهة والعميلة وعلى كل المستويات"
