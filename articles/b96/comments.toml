text = "بسبب انني عشت في الاردن اكثر من عيشتي في سوريا حيث اعمل في القصارة في عمان وضواحيها تعرفت الى الشعبين الاردني والفلسطيني.. بصراحة وجدت ان الشعب الاردني بغالبيته شعب غبي وتافه وهو شعب خانع ولا اقول سرا اذا قلت انهم يهود العرب بالفعل.. اما الفلسطينيين فهم شعب متحضر واعتقد انهم سبب تطور هذا البلد المصطنع المسمى الاردن الذي هو اصلا جزء لا يتجزا من سوريا الكبرى او بلاد الشام يعني صحراء بلاد الشام والتي تضم مجموعة من البدو الرحل الذين كان ياكلهم القمل والدود"
