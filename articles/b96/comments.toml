[[comments]]
order = 290
subject = "كفر نجه ( هههههههههههههههههههههههههههههههههههههههه"
author = "محمد نواف الحمدالله ..."
posted = "2008-03-31"
text = "كفرنجة هي بلدة تقع في محافظة عجلون في شمال غرب الأردن، توجد فيها العديد من المساجد وأقدمها مسجد عثماني في وسط البلد. وهي مركز اللواء وتعداد السكان يبلغ 30000 نسمة ومع الضواحي 40000 نسمة، وتقع إلى الغرب منها بلدة كريّمة في الغور وإلى الشرق منها عجلون وعنجرة و عين جنا وإلى الشمال الشرقي قلعة عجلون التاريخية التي تسمى بعدة أسماء كقلعة الربض نسبة لعشيرة الربضي وقلعة صلاح الدين الأيوبي نسبة للقائد التاريخي الذي أمر عز الدين أسامة ببنائها، لصد خطر الصليبيين وهي تربط الضفة الغربية بعمّان بطريق جيد، سكانها يعملون في الزراعة والوظائف الحكومية والقوات المسلحة الأردنية، فيها العديد من مدارس الذكور والإناث منها مدرستان ثانويتان وواحدة ريادية وأبرزها هي مدرسة كفرنجة الثانوية وهي ثاني أقدم مدرسة في الأردن بعد مدرسة السلط الثانوية. يمر شمال البلد وادي الطواحين حيث يبدأ من عين القنطرة وعين أبو الجود وعين الفوار في عين جنا ويصب في نهر الأردن.<br />تشتهر أراضي لواء كفرنجة الخصبة بزراعة الزيتون الرومي وأشجار العنب والتين والجوز الرمان والحمضيات، ويصنف تواجد شجر الجوز في اللواء هو الاكثر على مستوى المملكلة وطبيعة الأرض جبلية وتغطيها أشجار حرجية مثل البلوط والبطم والسنديان والقيقب والزعرور والملول، والطبيعة باهرة الجمال خاصة في فصل الربيع، والطقس فيها يتوسط ما بين برد عجلون ودفء الغور، تنتشر فيها نباتات طبية كثيرة جداً. تتوفر في كفرنجة ينابيع وجداول مائية مثل: عين كفرنجة، مشرع الزيتون، الزغدية، عين فلاح، عين البستان وعين المشرع. وتعد كفرنجه هي أكبر تجمع للسكان في المحافظة وتشكل نسبة السكان فيه حوالي 30% من عدد سكان محافظة عجلون. وطبيعة الأرض ومعالمها غريبة نوعا ما حيث يوجد فيها كهوف واهمها مغارة عراق الوهج وهو كهف يمتد تحت الارض لمسافة 13 كيلو مترا تقريبا وهو يربط عجلون بكفرنجة. واكتشفه الحاج عبدالله العيسى الغريز وذلك اثناء قيامه بحفر اساس بيته عام 1932). سبب التسمية بهذ الاسم (كفرنجة) يقال أنها كانت كفراً للفرنجة الذين احتلوا المنطقة آنذاك (أي مزارع يزرعها الفرنجة) وذلك زمن صلاح الدين الأيوبي حيث كان يرسلهم للعمل في كفرنجة ويعودون للقلعة وبذلك يؤمن المواد الغذائية لمن في القلعة وللأسرى أنفسهم من الفرنجة، فسميت (كفر الفرنجة) وتطور الاسم باختصار إلى (كفرنجة).ولقد كانت مراع خصبة لأهالي خربة الوهادنة وبلدة عنجرة،وثمة معركة شهيرة طاحنة دارت رحاها بين العشيرتين في منطقة البحر(شمالي كفرنجة) على حجر يسمى(البـد) ويذكر المؤرخون أنه قد قتل في هذه المعركة حوالي ستين زوجا من الأخوة، علما بأن هذا الحجر لا يزال موجودا حتى الآن في منطقة البحر في كفرنجة. وقد كانت هذه البلدة تشتهر بالغابات الكثيفة المحيطة بها وبوجود الحيوانات المفترسة وخاصة الضباع،ومن الحيوانات التي كانت تزعج اهالي البلدة وتخرب مزروعاتهم الذئاب والخنازير والواويات. كانت كفرنجة هي مركز حكم الأتراك في تلك الفترة وكان راشد باشا الخزاعي هو والي المنطقة الكبيرة التي امتدت من إربد وعجلون وجرش حتى نابلس غربا. العشائر التي تسكنها هي القعاقعة وآلصباغ وكانوا أول من سكنها والغريزات ،رشايدة|الرشايدةالفريحات،الخطاطبة، العنانبة، العنانزة، الشويات، الهزايمة، بني نصر، بني سلمان، الرشايدة، العريقات، العبايلة، ، ال شعبان، الجبالية، النواطير، الطلالزة، الخطيب . و يوجدعدة مراكز ثقافية متنوعة ومركزاً للشرطة ومركز للشباب ونادي رياضي لكرة القدم واليد والسلة ويلعب فريق كرة اليد في الدرجة الأولى.<br />وبدك استقلال وحرية وسيادة وسلطان يا ساقط ياابن الساقطه .. يلعن أبوك على أمك هبت حريقا بطيز أمك أجت المطافي تطفيها لقت أبوك بلعب فيهااااااااااااااااااااااااااااااااااااااااااهههههههههههههههههههههههههههههههههههه"
