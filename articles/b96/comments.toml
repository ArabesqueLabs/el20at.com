text = "اخواني اسامة وحمود والله عيب تري الفاظنا ادل علينا انا ادرس علةم سياسية في امريكا اردنية لي هنا اصدقاء فلسطنيين فلا داعي ان نغمض عيوننا عن ما عملوه الفلسطنيين في الاردن من اعمار اكبر الشركات واصحاب الاموال فلسطينية احنا واطيفنا كانت مقتصرة على الجيش هما شعب مكافح ولا تنسوا ان زوجة المللك عبد الله ابو حسين فلسطينية يعني كنا بنسب........عافا لله<br />وببصراحة عمري ما اسمعت ان اسرئيلي لمس امرة فلسطينية زي الامريكان في العراق هم شعب جبار وقوي وبينا وبينك الاردن مستفيدة جدا من وجودهم في الالردن بسبب التعويض الذي تحصل على عن كل فرد فلسطيني مقيم في الاردنيقدر بملالايين وين الامزينة اسئلوا الحكومة ... وسعوا تفكيركم شوي ابحثوا في النت وما داعي للعنصرية شلون بدنا نتطور وحنا هيك تري انا انحرق لما اشوف شباب الاردن هيك .. عيب يا اسامة وعيب يا حمود ديانا كرزون نجحت من تصويت الجيش الاردني بالمجاني على جميع الشبكات الاردنية يعني احنا خلينها تمثل الاردن ... نشوفكم على خير<br />soso_allahmad@yahoo.comلارسال اي رد"
