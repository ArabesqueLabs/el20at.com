[[comments]]
order = 387
subject = "مـــــرافعــــــة"
author = "يوسف عبيدات - القدس"
posted = "2008-06-10"
text = "بسم الله الرحمن الرحيم<br />حضرة القاضي<br />إن هذه القضية التي أحاكم فيها أمامك قضية سياسية وليست قضية تتعلق بالجرائم , وهي قضية تتعلق بمصير هذا البلد لا قضية نقد سياسي أو كشف مخطط عادى لذلك فانه فوق ما لي من حق الدفاع عن نفسي فانه فرض على أن أبين للمحكمة واقع هذه القضية المصيرية وما ترتب عليها من كوارث وفواجع وما سيترتب عليها من مصائب ومحن فوق ما نشاهده وما سنشاهده من تدمير البلاد وإهلاك العباد , لهذا فاني اطلب أن يسمح لي بالمرافعة عن نفسي وألح بهذا الطلب واعد المحكمة أن أوجز كل الإيجاز ومحذرا إياها بأنها إذا لم تسمح لي بالمرافعة والدفاع عن نفسي فسأستنكف عن الإجابة عن اى سؤال وعن التكلم مع المحكمة بأية كلمة وسأدير لها ظهري واجلس متطلعا إلى الحضور لا للمحكمة ولتفعل ما تشاء ولتحكم بما أوحي به إليها الحكام.<br />ايها القاضي ـ ان التهمة التي قدمت الى المحكمة بموجبها هي الانتماء الى حزب التحرير وتوزيع نشرات وتحضير نشرات, اما تهمة الانتماء الى حزب التحرير فلا ارد عليها لان الاكثرية الساحقة في هذا البلد اما اعضاء في حزب التحرير واما سائرون بكل جوارحهم وقلوبهم مع حزب التحرير, ولا توجد دائرة من دوائر الحكومة في هذا البلد ولا وزارة من الوزارات حتى قصر الملك ورئاسة الوزراء الا وهي اجمالا مع حزب التحرير او من حزب التحرير, لذلك لا اجيب عن هذه التهمة لانها ليست تهمة وانما هي شرف كرمني الله به ونعمة حباني بها تعتبر بحق اعظم نعمة في الوجود بعد نعمة الاسلام.<br />اما المنشور المتهم بتوزيعة فان المنشور اى منشور لا يحاكم احد على توزيعه بوصفه منشورا وانما يحاكم الموزع على المادة التي يحويها المنشور لذلك فان التهمة ليست توزيع المنشور بل توزيع المادة التي حواها المنشور, فدفاعي انما هو عن مادة المنشور الموزع وكلامي انما هو في مادة المنشور. ومادة هذا المنشور ـ والمفروض ان يكون الان موجود في القضية ـ تكشف ما فعله الملك حسين من التامر مع اسرائيل على تسليمها الضفة الغربية وبيان كيف قام بمسرحية تسليمها. وتسليم الملك حسين للضفة الغربية امر يعرفه اهل الاردن قاطبة ويعرفه السياسيون بشكل عام ويعرفه جميع حكام الدول العربية ويعرفه اكثر الناس في سائر الدول العربية, فهو امر مشهور شهرة اسخريوط اليهودى وشهرة ابي رغال فليحاكم جميع الذين يعرفون ذلك وجميع الذين ينشرونه.<br />نعم ان هذا الامر المشهور , واقعه الحقيقي انه خيانه , ونحن في المنشور اتهمنا الملك حسينا بتسليم الضفة الغربية , اى اتهمناه بالخيانه, فربما يقال أنكم تحاكمون على قذف الملك حسين بالخيانة وأنكم لا بد ان تقدموا للمحاكمة , اذا كان هذا هو ما قدمت فيه الى المحكمة فان جوابي عليه هو ان هذا قدح وليس بذم , والقدح هو الاتهام بتهمة معينة وهذه يجوز اثباتها واذا اثبتت فانه يسقط جرم القدح لانه يكون حينئذ صحيحا فلا يعاقب فيه القادح, وأنا اعترف باننا اتهمنا الملك حسينا بتسليم الضفة الغربية اى اتهمناه بالخيانه , ومستعد ان اثبت هذه الخيانه وعندى شهود التواتر على ذلك فاطلب تكليفي باثبات هذه الخيانة بشهود التواتر .<br />على ان الملك حسينا الذى تدافعون عنه وتقدمونا للمحاكمة لاننا وصمناه بالخيانة هو نفسه لا يبالي بالخيانات يرتكبها كل يوم , فهاهو ذا بالامس ومنذ اسبوع تقريبا قدم للجامعة العربية مذكرة لتعميمها على الدول العربية يقول فيها بان هنالك احتمالا لسقوط الضفة الشرقية من الاردن, وانه لا يستطيع تحمل مسؤولية الضفة الغربية والشرقية معا , ولهذا يطلب منهم الموافقة له على عقد الصلح مع اليهود لارجاع الضفة الغربية . هذا الكلام قدمه الملك حسين صراحة للجامعة العربية ولجميع الدول العربية , وهذا الكلام يعني ان الملك حسينا يهدد الدول العربية بانه اذا لم يوافقوا له على الصلح المنفرد مع اسرائيل فانه سيسلم الضفة الشرقية كما سلم الضفة الغربية , فهل من يكتب هذا صراحة يبالي بالخيانات ?<br />فهذه خيانه جديدة لا تزال في دور محاولة الارتكاب , فهل بعد هذا يجوز ان يقدم احد للمحاكمة بتهمة انه يوصم الملك حسينا بالخيانة . لهذا كله فاني اطلب تكليفي باثبات خيانه الملك حسين بشهود التواتر حتى يقنع جناب القاضي بصحة ما قدحت به الملك حسينا من تهمة الخيانة وبالتالي يرد الدعوى ."
archived = "2010-03-14"
