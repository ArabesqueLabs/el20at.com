[[comments]]
order = 381
subject = "اصول الاردنيين"
author = "باحث في العشائر والانساب"
posted = "2008-06-10"
text = "اعجب للارديين كيف ينسون اصولهم.. فحسب كتب الانساب والاحساب.. فلقد تبين ان 65% من عشائر الاردن اصلها من فلسطين.. بل ويوجد لهم اقارب حتى الان في فلسطين.. في مختلف المحافظات والاقضية الفلسطينية.. اما ما تبقى من الاردنيين يعني نسبة 35% فهم من الشركس والشيشان والدروز ومن الاصول الشامية والحجازية.. يعني بصراحة لا يوجد عشيرة اردنية سكنت هذه المنطقة من مئات السنين .. كل هذه التوليفة جاءت بعد تاسيس امارة شرق نهر الاردن.. ولا اعرف مثلا ما علاقة هذا النهر الذي يسمى الاردنيين على اسمة لا اعرف ما علاقة مثلا عرب الحويطات بالاردنية او عشائر الجنوب بشكل عام كذلك في الشمال هم حورانيين وخصوصا القرى الشمالية من الاردن هم تبع للعائلات السورية.. يعني باختصار شديد هذا الكيان المسمى الاردن هو كيان مصطنع.. وفي التاريخ لا يوجد اسم للاردن كدولة او ككيان فهي طول عمرها معروفة ببادية الشام او صحراء فلسطين حسب كتب التاريخ والجغرافيا.. ولكن الانجليز عرفوا كيف يستغلون هذه المنطقة الخالية من السكان الا من البدو الرحل الذين كانوا يجوبون المنطقة شمالا الى الديار الشامية وغربا الى فلسطين وشرقا الى العراق وجنوبا الى تبوك والقريات.. اسس الانجليز هذا الكيان المسمى الاردن لكي يمهدوا الطريق لانشاء ما يسمى باسرائيل.. ووفق مراسلات سابقة بين الحسين ومكماهون ومن ثم الخطاب الشهير الذي ارسله الملك عبدالله بن الحسين الى بريطانيا والتي يطلب فيها تاسيس امارة شرق الاردن واخلاء يد العرب والمسلمين من فلسطين واعطائها لليهود وهكذا كان"
archived = "2010-03-14"
capture_url = ""

