text = "اولاً مرحبا ... كيفك ؟؟؟ وشو أخبارك ... ؟؟ ( انشالله تمام ) ... ثانياً انا بحب أحكيلك شغله بسيطه أنتا نسيتها ... أو تناسيتها ... اللي هيه ... اه ... صحيح ... قبل ما أعلق ع كلامك ... انتا كلامك عال العال ... ووالله ع قلبي زي العسل وأزود كمان ... وانتا ع راسي وكل الاردنيين النشامى ... بس ... أنتا شايف أنو الكل مفتنع بكلامك هاذ ... أنا الصراحه من جهتي ... وتيجي للحق ... كلامك زينة العقل ... بس الصراحع في فئه من هالناس ... مش قابلين يفهموا الموضوع ... او همه قاعدين عم بتخوثوووووو ... المهم ... ومع احترامي إلك ... وثالثاُ أنا مابحب العنصريه ... لأنها اشي شنع وملوش فايده غير المصايب والمشاكل ... اللي إلها أول ومالها آخرررررر ... كلنا أولاد ناس ووعالم ... ويامحلاهم الناس الطيبه ... هههههههههه ... وع عيني كل الاردنيه والفلسطينيه ... وانشالله الله يحرر فلسطين ويفك قيوووووود الاأسرى ... وانشالله يعم السلام والخير ... بالعالم أجمع ... وأخيراً ... ياأخ طلال أنتا اصيل ابن أصل وكلك أدب واحترام ... والله يسرلك امورك ؟؟!!<br />... تحياتي<br />وسلااااااااااااااااااام ..."
