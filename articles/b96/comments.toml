text = "لو كان صحيحا ما قلته لما ذهب الملك حسين مستنجدا باسرائيل وبريطانيا لانقاذه من الفدائيين الفلسطينيين .. مذكرات احمد الطراونة تقول كانت معظم وحدات جيشنا العربي على وشك الاستسلام نتيجة شراسة الفدائيين الفلسطينيين في المعارك.. مما استدعى اجتماعا عاجلا لجلالة الملك الحسين مع هيئة اركان الجيش ثم طار بعدها الى اسرائيل ومن ثم الى بريطانيا طلبعا للمساعدة العسكرية وبالفعل قالت بريطانيا للملك لا استطيع ان ارسل لك طائرات في هذه المدة البسيطة فاسرائيل اقرب منا اليك.. وهذا ما كان.. لم يكن الاردن يملك طائرات من طراز فانتوم كان لدينا طائرات هوكر هنتر وسوبر فايتر وطلب جلالة الملك من اسرائيل ان تضع العلم الاردني على مقدمة طائرات الفانتوم حتى يقال انها طائرات اردنية وبالفعل جاء الطائرات الاسرائيلية على اسراب وقصفت معسكرات الفدائيين الذين تجمعوا في دبين بعد ان اوهمناهم بعقد صلح.. ولم يكن في الحسبان ان يستعمل الطيارون الاسرائيليون قنابل محرمة دوليا في هجومهم العنيف على الفدائيين سيما وان منطقة دبين وجرش وعجلون بقيت لعدة سنوات بعد العام 1970 ارضا سوداء في الاماكن التي وقع فيها الهجوم الاسرائيلي.. وبعد ذلك كانت الهدنة وترحيل الفدائيين عن الاردن وهو هدف سعينا له منذ البداية وكانت هدفا مشتركا ايضا مع حلفائنا في المنطقة وفي الغرب"
