text = "مع انك حكيتي حكي كله تخبيص بتخبيص.. بس بحب اقولك شغلة وحدة وانا من اعرق عشائر الكرك.. عندي حبيبي الفلسطيني بسوى كل الاردنية المعفنين.. لاني ما شفت واحد اردني نظيف وبعبي كاسة.. كلهم على الله الجبر يعني على السكين.. لا محضر ولا منظر وفوق هذا كل واحد منهم بسطاره في ظهره شاطرين في هز الذنب والنفاق للحكومات والانظمة العربية الرجعية والتجسس على غيرهم من احرار العرب.. يعني بصراحة انذال.. وبشرفي عندي حذاء حبيبي ونور عيني الفلسطيني بتسوى الاردن وما حوت.. واما انت يا بنت الجنوب فما تتحدثين عنه من عز وكرم.. كان الفلسطينية ناسيونه قبل ما نعرف احنا شو الاكل وشو الطعام يا اللي بتتحالي في المنسف يا هبلة يا بنت الهبلة"
