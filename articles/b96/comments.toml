subject = "إلى شريدة وبس !"
author = "تركي الصوافطة ,,,"
posted = "2008-06-05"
text = "شريدة ... أطلع من هالأبواب واعترف بأصلك ,, لأنو (( آل شريدة )) معرفين إنهم من فلسطين ( أي أنهم فلسطينيو أقحاح ) .. ولا تكذب علينا الله يرضى عليك ماشي !<br />شريدة ... عيب عليك تنسى أصلك ... أصلك فلسطيني مليون بالميه .. ولاتحاول تسوي حالك أردني ماشي !<br />شريدة ... اللي زيك كثير حاولو وحاولو وحاولو لزهقو حالهم على أساس إنهم أردنيه !! ولكن أصلهم الأصيل فلسطينيين !! وأنت منهم بلاشك !!<br />شريدة ... بكفي تمسيح جوووووووخ على الفاضي وتعملي حالك أردني .. !!<br />كلنا عارفين حالنا .. وأنت فاهم قصدي<br />أنا بتمنى إنك توخذ تعليقي على محمل الجد شوية .. لأني بحكي الحقيقة (( والحقيقة فقط لاغير )) ,, فشكراً للحقيقة ...أبوي (( الله يرحمو )) كان دايماً يحكيلي الإنسان بلا أصل وفصل بسواش اشي .. وبصير علكة بثم اللي بسوى واللي مابسوى .. لأنو أصلنا حنا مابننساه .. واللي ما إلةو ماضي يعترف فيه ويفتخر ويعتز بيه .. مالو حاضر ولا مستقبل<br />افهم !!<br />تركي الصوافطة"
