text = "الكلام موجه الى كل اردني اخو شرموطه سواء كان مطايزه ولا زبابره ولا كساكسه ولا مخانثه ولا اي عضو تناسلي لانو اسماء عائلاتكم هيك عموما انا درست في الاردن وهاي قصه حصلت فعلا انا شخصيا وكمان واحد كويلي وواحد سوري نكنا جارتنا وبنتها الى هما من عائلة العبادي من السلط وتحديدا في ابو نصير واسم الام منال وبنتها نجوى بس ايش غنج عالاردنيات بهد الحيل اما الكلام عن اسيادكم نايكين بناتكم الفلسطينيه فهو مش بحاجه الى رد لانكم بتعرفو يا اولاد كلوب باشا اننا اشرف البشر بعدين من وين هالكذبه مصدقين انو في اشي اسمو اردن ولكم هاي كلها فلسطين والاكمن واحد الى بقولوا عن حالهم اردنيه هذول اجو مع العميل العربي الاكبر مؤسس الاردن وعموما الفلسطينيه داعسين على روسكو وعلى روس وكساس خواتكو وامياتكو وفاضحين عرضكو وعرض كل ابن شرموطه بقول انا اردني"
