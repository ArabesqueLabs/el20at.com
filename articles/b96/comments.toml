text = "ارجو من الجميع فلسطينيين واردنيين ان لا ينزلوا الى هذا المستوى من الانحطاط الفكري.. ياتي شخصان همل من امثال اسامة الزواهرة وقصي السعيدات لينضحا بما في صدورهما من حقد ضغين ونحن ننجر ورائهما كالببغاوات.. يا عيب الشوم.. فلسطين الرجال الرجال صارت مسخرة.. والاردنيون مغلوبون على امرهم.. يعني شعب بحب ينعلف ولا بحب يعمل مظاهرة.. يعني شعب خانع وهيك الله خالقوا.. فيا جماعة بكفي طحن في بعضكوا البعض وعيب شو خليتوا لزعران الفيصلي والوحدات"
