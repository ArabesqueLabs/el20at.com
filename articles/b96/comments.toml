text = "الأدوار السريّة للملك حسين لم تنته مع حرب 67، وكما ذكر الأخ الظاهر بيبرس كان له دور أسود في حرب أكتوبر لكن استخفاف الإسرائيليين به واحتقارهم له جعلهم يغمضون أعينهم عن التحذيرات التي أطلقها لهم،،،وكلّنا نتذكر كيف وهو على فراش الموت يعود من أمريكا لتنفيذ طلب أخير من الأمريكان بوضع ابنه عبدالله وليّا للعهد بدلا من أخير الأمير حسن الذي لا يعجب أمريكا والتي تتخوّف من ميولاته العروبية وصراحته التي تقلق إسرائيل...<br />للأسف هناك كثير على شاكلته، والأردن من المفروض أن يكون مثل الثغور الإسلامية في مواجهة العدّو الإسرائيلي المتأهب للابتلاع، لكنّه الأن خارج دائرة الصراع وتمّ ملئ أدمغة أهله بشعارات جوفاء مثل \"الأردن أوّلا\" وكان من الأفضل وضع الشعار الحقيقي \" فلسطين وقضايا العرب والمسلمين اخر شيء يمكن أن نفكّر به\"..."
