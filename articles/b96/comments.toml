text = "أنا أعتقد أنه حقيقى لأن العائلة دى مشهورة بالتأمر على العرب والمسلمين من أيام جد جد الملك عبدالله .... ولاننسى تأمر الملك حسين مع جده عبد الله على ابو الملك حسين وأيداعه مستشفى الأمراض العقلية لأنه كان يعمل لصالح المسلمين وليس لصالح اليهود... وأيضا لاننسى للملك حسين أنه أول من حذر أسرائيل بموعد حرب أكتوبر وهى حقيقة لم ينفيها الملك حسين ذاته كما أنها تأكدت من كتاب عرب وأسرائليين كما تأكدت من ضباط مخابرات أسرائيليين سابقين.<br />ولا يسعى المرء منا ألا أن يبكى أو يضحك من حكام أقسمت فى قسم تولى الحكم على رعاية مصالح البلاد والعباد ... وأقترح أن يتم تعديل القسم ليكون قسم لرعاية مصالح الدولة اليهودية والأمريكية وأى دولة يحب يقسم لها سيادته الملك أو الرئيس أو الأمير أو أى حد من البلاوى التى تحكم أمة من المتخاذلين..."
