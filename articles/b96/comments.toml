subject = "فى كتاب بريطانى جديد"
author = "محمود القاضي"
posted = "2008-06-10"
text = "فى كتاب بريطانى جديد<br />الدور الخفى للملك حسين فى نكسة 1967<br />من أهم الجوانب المجهولة فى حرب يونيو 1967 ذلك الدور الذى قام به الملك حسين لحماية عرشه فى وجه العواصف القادمة، ومن أهم الكتب التى صدرت حديثا وألقت الضوء على دور الملك حسين أثناء حرب يونيو 1967 ذلك الكتاب الذى صدر حديثا عن دار نشر بالانتاين بوكس الإنجليزية تحت عنوان 6 أيام من الحرب: يونيو 1967 وتشكيل الشرق الأوسط الحديث. ومؤلف الكتاب هو مايكل أوبراين وهو باحث إنجليزى متخصص فى دراسات الشرق الأوسط، وحاصل على الدكتوراه من جامعة برنستون، ومن كتبه الأخرى جذور الحرب العربية الإسرائيلية الثانية، ورغم أن المؤلف يعبر عن انحيازه الصريح للمواقف الإسرائيلية فإنه يأتى بالعديد من الأسرار التى يتم الكشف عنها لأول مرة، ومن هذه الأسرار دور الملك حسين والوضع الذى وجد نفسه فيه بينما عواصف حرب يونيو على وشك أن تهب على الجميع.<br />فى الفصل الرابع المعنون العد التنازلى الذى يحكى قصة الأيام الخمسة قبل الحرب أو الأيام من 31 مايو إلى 4 يونيو يتحدث المؤلف عن أوضاع الملك حسين والمأزق الذى وجد نفسه فيه، يقول أوبراين: عندما بدأت نذر الحرب تلوح فى الأفق وجد الملك حسين نفسه فى موقف لا يحسد عليه، وجد الملك حسين نفسه محاصراً بالعرب الثوريين من كل جانب بينما العرب المعتدلون فى السعودية والخليج كانوا منصرفين عنه، أما الولايات المتحدة التى طالما التزمت بالحفاظ على عرشه من السقوط فقد وجد رئيسها ليندون جونسون منحازا تماماً لإسرائيل ومستعدا لفعل كل ما هو ممكن وغير ممكن للخلاص من عبدالناصر، هكذا وجد الملك حسين نفسه فى أزمة حقيقية، فهو الوحيد الذى يقف على أرض هشة بينما كل الدول المجاورة حوله يساندها حلفاء أقوياء، فإذا استمر الحال بالملك حسين على هذا الوضع فإن الحرب قد تكلفه انهيار مملكته وعرشه وربما حياته هو نفسه<br />ويقول أوبراين:إنه منذ أن سطع نجم عبدالناصر وتتويجه بطلا للقومية العربية والملك حسين يشعر بالخطر خصوصاً أن أكثر من نصف مملكته من الفلسطينيين المؤيدين لعبدالناصر واتجاهاته القومية العربية، منذ أن أدرك الملك حسين خطورة عبدالناصر عليه وعلى عرشه قرر فتح قناة مخابرات سرية مع إسرائيل يتم من خلالها تبادل المعلومات مع تل أبيب سواء فيما يخص نفوذ عبدالناصر أو حول الفلسطينيين الفدائيين ووصفهم الكتاب ب الإرهابيين<br />عندما جاءت الأخبار بأن هناك حشودا إسرائيلية على الحدود مع سوريا لم يصدق الملك حسين نفسه لأن الأردن كان يمتلك محطة رادار قوية فى عجلون وهذه لم تلتقط أى إشارات بوجود حشود إسرائيلية على حدود سوريا، وعندما أخبر الملك حسين الإسرائيليين بمعلوماته عن الحشود طلب منه ليفى أشكول رئيس الوزراء الإسرائيلى أن يصمت بل إنه طلب منه أيضا أن تكف الأردن عن انتقاد عبدالناصر وأن تنضم للدول العربية التى تصفه بأنه بطل العرب الأوحد، وأطاع الملك حسين الأمر فى الحال<br />كان الملك حسين يرى الأمور وهى تخرج عن نطاق السيطرة ويحاول مراجعة جميع الخيارات وتحديد خطرها على مملكته، لو قام عبدالناصر بالضربة الأولى ثم نجحت إسرائيل فى صدها فإن عبدالناصر قد يستخدم الأردن ككبش فداء مما سيجعل الفلسطينيين يثورون وقد ينضم لهم الجيش الأردنى أيضا وعندها تنهار المملكة أو يتم استبدال الحكم الملكى بحكومة جمهورية يرأسها أحد زعماء منظمة التحرير<br />من ناحية أخرى، رأى الملك حسين أنه لو قامت مصر بالهجوم ونجح هذا الهجوم، فعند ذلك قد تقوم القوات المصرية باقتحام صحراء النقب وقد يصل بها التيه إلى الانطلاق نحو عمان وإسقاط نظام حكمه، هكذا رأى الملك حسين أن أغلب البدائل سوف توقع الأردن فى ورطة وأزمة حادة، إذا لم يشارك الأردن فى الحرب فإن اللوم سيقع عليه فى حالة تعرض العرب للهزيمة أما إذا حقق العرب النصر فإن الأردن سيصبح معزولاً أى فى كلتا الحالتين، الأردن خاسر خاسر، هكذا رأى الملك حسين نفسه ومملكته، ومن هنا بدأ الملك حسين يتحرك سريعاً قام بإرسال رسالة مطولة لواشنطن يطلب منها ضمانات بأن يتم المحافظة على سلامة أرض بلاده فى حالة اندلاع الحرب، وفى نفس الوقت أعلن الملك حسين عن نيته الطلب من القاهرة إعادة إحياء بنود اتفاق الدفاع المشترك ضمن القيادة العربية الموحدة وكان حسين يريد أن يلعب على الطرفين حتى لا يغضب أى جانب وينجو الرجل بمملكته<br />بالنسبة لواشنطن أعلنت التزامها فى خطاب للملك حسين بضمان أمن الأردن واستقلاله ولكنها رفضت أن تعلق هذا الالتزام على الملأ نظراً لاعتبارات من الكونجرس، أما القاهرة فقد قامت بإبلاغ عامر قماش رئيس أركان الجيش الأردنى بأن ما يسمى القيادة العربية الموحدة قد انتهى ومات<br />وإزاء هذا حسم الملك حسين موقفه، سوف يقف ويساند عبدالناصر فى العلن بينما سيقوم فى السر بمواصلة اتصالاته المخابراتية مع إسرائيل خوفا من انتقامها، وهكذا قام الملك حسين فى يوم 31 مايو بعمل استعراض عسكرى فى شوارع عمان وهو يرتدى ملابس عسكرية، كان الغرض هو القيام باستعراض قوة بينما كان يعرف فى قرارة نفسه أنه لن يستخدم هذه القوة أبدا، وقد حدث فى يوم الاستعراض أن قرر عبدالناصر إغلاق مضيق تيران، وعندما علم الملك حسين بهذا القرار ازداد غيظا من عبدالناصر لأن الرجل حرمه حتى متعة الانتشاء بالعرض العسكرى حتى ولو كان عرضا مزيفا، هكذا تعود عبدالناصر أن يخطف الأنظار من الملك حسين دائماً، وفى الحال قام الملك حسين بارسال برقياته لإسرائيل وللدبلوماسيين الأجانب فى الأردن: هذا القرار قرار مجنون سيؤدى لكوارث لأنى أعرف أن العرب ليسوا مستعدين لخوض الحرب وقال الملك حسين فى برقياته: إن عبدالناصر رجل مجنون لا يقدر العواقب ويعتمد على دعم وهمى من السوفيت، أما فى العلن فقام الملك حسين بإصدار أوامره للمتحدث باسمه بأن يمتدح قرار عبدالناصر وأن يعلن عن استعداد الأردن لتقديم الدعم الكامل له، وفى نفس الوقت أيضا التقى الملك حسين بيرنز السفير الأمريكى فى عمان وطلب منه ضرورة أن يحث الرئيس جونسون إسرائيل على مهاجمة تيران ولكن واشنطن لم تستمع له<br />كان حسين يشعر بتجاهل واشنطن له وانحيازها أكثر من اللازم لإسرائيل، أما إسرائيل فرغم معلومات التجسس التى تأخذه منها قد تجتاح مملكته فى أى لحظة لو أحست بأنه يخدعها، هنا أدرك الملك حسين أنه يجب أن يلجأ لعبدالناصر فى النهاية ويقنعه بإخلاص الأردن لقضية الحرب بينما هو يضمر شيئاً آخر فى الخفاء، وبسرعة قرر الملك حسين اتخاذ عدد من الخطوات التى يمكن أن تنال رضاء عبدالناصر، أولا قام بعزل وصفى التل رئيس الديوان الملكى ثم قام بتحريك بعض قواته لعبور نهر الأردن والوصول إلى اريحا وثالثا قام بارسال رئيس الأركان قماش للقاهرة للاجتماع مع عبدالحكيم عامر بينما رفض عبدالناصر استقباله، وبعد القيام بهذه الخطوات قام الملك حسين بالاتصال بالأمريكان من خلال السفير بيرنز وأخبرهم أن هذه الخطوات هدفها فقط اتقاء شر عبدالناصر ولكنه لا ينوى القيام بأية أعمال عدوانية ضد إسرائيل وطلب منهم أن يبلغوا الإسرائيليين بذلك<br />فى هذه الأثناء قام الملك حسين بدعوة عثمان نورى سفير مصر فى الأردن يوم 28 مايو، كانت الدعوة أصلا لمقابلة رئيس وزراء الأردن سعد جمعة فى منزله الخاص وعندما وصل السفير المصرى هناك أصيب بالذهول لأن الملك حسين نفسه هو الذى كان فى استقباله، وقام الملك بإخبار السفير بأنه يريد القيام بزيارة سرية لمصر خلال ال48 ساعة المقبلة، كان الحسين يريد كسب اطمئنان عبدالناصر تماماً بينما يخبر الأمريكان والإسرائيليين بكل ما يفعله حتى لا يشكوا فى نواياه<br />وبسرعة قام السفير المصرى فى الحال بالاتصال بالقاهرة وعاد بالإجابة بعد منتصف الليل، كانت للقاهرة اشتراطات لاتمام الزيارة، أن يعد الملك حسين بمقاومة أى محاولة إسرائيلية للهجوم على سوريا عبر الأراضى الأردنية وأن يسمح للقوات العراقية بدخول الضفة الغربية عبر الأردن وان يعترف الأردن بأحمد الشقيرى رئيس منظمة التحرير الفلسطينية وان يعترف بالمنظمة وهى الممثل الشرعى الوحيد للشعب الفلسطينى وأن ينضم للمقاطعة العربية لألمانيا الغربية، فإذا استجاب الملك حسين لكل هذه الشروط فإن القاهرة ترحب به، ورغم صعوبة هذه الاشتراطات على الملك حسين إلا أنه قبلها جميعها، ومن ثم رحبت القاهرة به وسافر فى فجر اليوم التالى فى 30 مايو، وقام الملك حسين بقيادة طائرته كارافيل الخاصة إلى مطار ألماظة العسكرى قرب القاهرة وهناك استقبله وزير الخارجية محمود رياض ورئيس الأركان للقوات العربية الموحدة عبدالمنعم رياض وأمين عام مكتب الرئيس عبدالمجيد فريد، أما من كان يقف على رأس كل هؤلاء فكان عبدالناصر نفسه، تقدم عبدالناصر وأخذ بيد الملك حسين قائلاً له ما لم يتصوره عقل طالما أن هذه الزيارة سرية ماذا يمكن أن يحدث لو اعتقلناك الآن؟ وسرت رعشة مخيفة فى جسد الملك حسين متسائلا بينه وبين نفسه هل يعرف عبدالناصر بعلاقاته السرية مع الإسرائيليين؟! تمالك الملك حسين نفسه وابتسم خفيفا قائلا سيدى الرئيس لم يخطر ببالى قط أن يحدث مثل هذا الأمر، ثم تقدم الموكب نحو قصر القبة وانضم لهم هناك المشير عبدالحكيم عامر، ثم قرر عبدالناصر والملك حسين والمشير عامر عقد اجتماع اقتصر عليهم الثلاثة فى حجرة منفصلة وامتد الاجتماع لفترة أطول من المتوقع، قام الملك حسين بوضع اللوم فى تدهور العلاقات المصرية الأردنية فى الفترة السابقة على سوريا لكنه قال إنه مستعد للدفاع عن السوريين كجزء من جهد عربى شامل يهدف لحماية الأردن أيضا وكان رد عبدالناصر يجب أن نتوحد الآن أمام أزمة نواجهها نحن العرب جميعا، لقد كان تقديرى الأول أننا لن ندخل الحرب قبل 3 أو 4 سنوات لكن الأحداث داهمتنا، ثم قال الملك حسين لعبدالناصر إنه يريد توقيع معاهدة دفاع مشترك مع مصر مثل اتفاق الدفاع الموقع بين مصر وسوريا وأنه يمكن بموجب هذه المعاهدة السماح بقوات عربية من العراق والسعودية وسوريا وحتى مصر لدخول الأراضى الأردنية<br />ويواصل مايكل أوبراين كشف الدور الخفى للملك حسين فيقول: نجحت إسرائيل فى التلاعب بالملك حسين فقد حصلت منه على معلومات سرية مخابراتية وبنتائج اتصالاته مع عبدالناصر لكنها خدعته فى النهاية وقامت باجتياح الضفة الغربية ورغم مناشدات الأمريكان لها، كان الملك حسين يستغيث بالأمريكان مما فعلته إسرائيل به، وكان رد الإسرائيليين على الأمريكان أنهم بعد اكتمال جميع انتصاراتهم على الجبهة الشرقية والأردن وسوريا سوف يقومون بحوار مع الملك حسين لإعادة أرضه، بشرط أن يقوم بطرد رياض وكل الضباط المصريين فى الأردن، اقترح ديان دعوة الملك حسين لاجتماع سرى ولن تتعهد فيه إسرائيل بأى شيء وكان الإسرائيليون يعرفون أن الملك حسين لن يستجيب. بعد ظهر اليوم الثالث 7 يونيو كان الملك لا يصدق ما حدث له، كان قد فقد نصف مملكته وتحطم جيشه وأصبح الحسين على اتم استعداد لقبول أى شيء وأولها طرد المصريين من الأردن وانقاذ مملكته<br />ويعود المؤلف ليكتب من جديد عن الأوضاع التى وجد الملك حسين نفسه فيها ويقول: لقد لعب الملك حسين منذ بداية الأزمة على كل الحبال، اتصل سراً بالإسرائيليين وكان تدفق المعلومات المخابراتية معهم لا يتوقف وفى الوقت نفسه طمأن عبدالناصر وخدعه بالتحالف معه وكان أمله أن يخرج سالما بمملكته فى النهاية، لقد ضاعت منه الضفة الغربية بكل ما فيها من أماكن مقدسة لكن مملكته ظلت صامدة وسط العواصف الهوجاء لذلك وقف الملك حسين أمام شعبه بعد نهاية الحرب وقال يبدو اننى انتمى لعائلة كتب عليها المعاناة وتقديم تضحيات فإذا لم يكن الأردن قد خرج رابحا المجد من هذه الحرب فذلك ليس لأن الأردنيين لا يمتلكون الشجاعة، لكن لأن تلك كانت إرادة الله، لقد اقتنع الملك حسين بضياع الضفة الغربية واعتبرها ثمنا لبقاء مملكته وعرشه واعتبر ذلك ارادة الله لكنه لم يأبه لحجم الكوارث التى تسببت فيها ألاعيبه وخداعاته ومغامراته الخفية مع الإسرائيليين وأدت فى النهاية لجزء من كارثة 67"
