[[comments]]
order = 463
subject = "يتحدث الارادنة عن الخيانة وهم روادها ابا عن جد"
author = "علي العكاوي"
posted = "2008-07-25"
text = "عندما اغتيل عبدالله كان حسين في السادسة عشر من عمره وقد شاهد بأم عينيه منظر دماغ جده القذر منتورا على ارضية المسجد الاقصى فكان ذلك من أكثر المؤثرات في حياته وجعله أكثر خبثا وسرية في التعامل مع اليهود . وقد تولى والده طلال الملك بعد اغتيال جده وكان طلال على خلاف شديد مع الانجليز ويكره حياتهم ويكره كلوب باشا بشكل كبير ولم يرق له مسلسل الخيانات التى قامت بها الاسرة هذا في الظاهر ولكن الحقيقة أن طلال كان يكره الانجليز وكلوب باشا تحديدا لانه أطبق على زوجته زين مع كلوب باشا في وضع غير اخلاقي فقام باطلاق النار على كلوب باشا فاصابته الرصاصة في فكه لذلك كان يطلق عليه افراد وضباط الجيش الاردني لقب (( ابو حنيك )) ولكن مما زاد من حنق طلال وكرهه للانجليز أنه لم يستطع اقالة أو طرد كلوب باشا حيث كان كل شىء بيد الانجليز وعندما حاول طلال القيام بتجميع الضباط المخلصين من حوله واعادة ترتيب امور مملكته عاجله الانجليز بانقلاب أبيض بالتعاون مع زوجته زين حيث أعلن الديوان الملكي في أغسطس 1952م أن طلال بن عبدالله بن حسين رجل مختل عقليا ويعاني مصاعب نفسية وعليه فقد تم تعيين ابنه حسين ملكا على الاردن وتم نفي طلال الى استانبول ليعيش بقية حياته هناك منفيا الى أن مات هناك ولكن المشكلة أن حسين لازال صغير السن ولم يكمل تعليمه العسكري في بريطانيا وفي سانت هيرست لذلك قرر الديوان الملكي تعيين خاله ناصر وصيا على العرش الى أن يتم حسين تعليمه ويبلغ السن القانونية التى تسمح له بادارة الملك أو بمعنى اصح حتى تكمل بريطانيا تربيتها له على اكمل وجه . ومنذ ولد حسين بن طلال في 14/11/1935م تولت أمه زين والانجليز تربيته وادخل الى مدرسة مسيحية تبشيرية في عمان وكان طلال والده متعلقا به ويحاول جاهدا تربيته على الاخلاق العربية وابعاده عن تربية الانجليز ولكن دون جدوى فلقد كانت زين وبدعم من جده عبدالله و الانجليز الاقوى دائما والاكثر تأثيرا على حسين حيث فضلت أن يتربى الولد على التربية الانجليزية وبعد مقتل جده عبدالله وتولى أبيه الملك ارسل حسين الى كلية سانت هيرست في بريطانيا لاكمال تعليمه وقد ظهرت جليا مواهب حسين بن طلال للمخابرات البريطانية فلقد كان الملك الشاب زيرنساء ومولعا بالسيارات السريعة والنوادي الليلية شأنه في ذلك شأن جده عبدالله بن حسين . وبعد تخرجه من سانت هيرست عاد حسين الى الاردن في عام 1953م وتم تتويجه ملكا على الاردن .<br />(( مجزرة قبية أولى الخيانات الحسينية ))<br />في اكتوبر من عام 1953م هاجمت وحدة كومندز اسرائيلية بقيادة ارئيل شارون قرية قبية الفلسطينية الواقعة تحت سيطرة الجيش الاردني وقتلت 66 شخصا معظمهم من الاطفال والنساء وفجر المهاجمون أكثر من اربعين بيتا فلسطينيا على رؤس اصحابها وثار الفلسطينيون على الملك وجيشه فماكان من الملك الا أن أقال قائد القطاع المسؤل عن القرية العميد البريطاني (( أشتون)) بتهمة الاهمال ؟؟؟ ولكن الشارع الفلسطيني ظل يغلي وكذلك الشارع الاردني فما كان من الملك وبالتنسيق مع المخابرات البريطانية الا أن اعلن تعريب الجيش الاردني وطرد جميع القيادات الانجليزية في 1956م ارضاءا للمطالب الشعبية وخوفا من ثورة عارمة ضده وضد حكمه .<br />(( الاضطرابات تجتاح عمان 1958م ))<br />في ظل الغليان الشعبي العارم تجاه مايقوم به حفيد الخيانة اجتاحت الضفة الغربية والتى كانت تحت الحكم الاردني انتفاضة كبيرة مالبثت ان انتقلت الى عمان واصبحت المنطقة تغلى ضد حكم حسين بن طلال الذي لم يكن سوى امتداد لحكم عبدالله ولكن بشكل اكثر سوء وخيانة فما كان من حسين بن طلال الا ان استعان عبر اسرائيل ومباشرة من القوات الخاصة البريطانية نزلت الى شوارع عمان دعما للملك وقمعت مع الجيش الاردني كل مظاهر المعارضة لنظامه الهش .<br />(( تأسيس منظمة التحرير الفلسطينية ))<br />((كان عبدالكريم قاسم قد دعا عام 1960م الى اقامة كيان فلسطيني وفي عام 1964م انشأت الجامعة العربية بدعم وضغط من مصر منظمة التحرير الفلسطينية وتم تأسيس جيش فلسطيني )) وكان الهدف من ذلك من وجهة نظر مصر هو كبح جماح حسين بن طلال من التحدث باسم الفلسطينين والدخول في مشاريع سلام مع اسرائيل وتعطيل خططه للتسوية مع الاسرائيليين .<br />((لقاء حسين الاول بغولدا مائير1965م ))<br />بطلب من حسين بن طلال وبتنسيق مع الدكتور هيرتسوغ أحد زعماء الحركة الصهيونية التقى حسين بن طلال مع وزيرة خارجية اسرائيل ان ذاك غولدا مائير في شقة في باريس ويصف الكاتب اللقاء بما يلي (( عندما دخل حسين الغرفة وتقدمت غولدا نحوه لم يخف الملك انفعاله وتصافحا بحراره وتبادلا الذكريات عن عبدالله وتحدثت الوزيرة عن انطباعاتها وذرياتها عن لقائاتها بجده عبدالله )) ص91 وفي ذلك الاجتماع وحسب الكاتب طلب حسين من اسرائيل مسانتده ضد التيار الناصري وضد التنظيمات الفلسطينية وضد سوريا وطلب ايضا ان توافق اسرائيل على السماح له بشراء اسلحة امريكية مع تعهد الملك بعد استخدام تلك الاسلحة ضد اسرائيل وأنه سوف يقدم وعدا خطيا للولايات المتحدة بذلك ص 91 .<br />(( النكســــة 1967م ))<br />في الخامس من يونيو 1967م اجتاحت اسرائيل أجزاء واسعة من مصر وضرب طيرانها جميع القواعد الجوية المصرية وشل حركته تماما وكذلك فعلت في الجبهة السورية فشلت حركة البلدين تماما وبعد اثني عشر ساعة على بدء الهجوم الاسرائيلي وبعد أن تأكد للملك حسين سوء الوضع على الجبهة المصرية بداء الجيش الاردني باطلاق المدفعية على طول الحدود ويقول الكاتب (( لقد تأكد لدى الملك حسين بأنه اذا لم يفعل شيئا فسوف يوصم بالخيانة مدى حياته ففضل أن يشارك في الحرب ويفقد احدى الضفتين بدل من لايشارك ويفقد كلا الضفتين )) ص 95 وفعلا ماهي الا ساعات معدودة حتى سقطت القدس وجميع انحاء الضفة الغربية وبعض اجزاء من الاراضي الاردنية – الباقورة – ولقد كانت الاوامر للجيش الاردني بالانسحاب الاأن بعض ضباط الجيش وخصوصا في مدينة القدس ابدوا مقاومة عنيفة حيث تمردوا على اوامر الانسحاب وكذلك بعضا من كتائب ودبابات الجيش العراقي صمدت لساعات طويلة في قتال شرس حول مدينة قلقيلية واستشهد كافة افراد تلك الكتيبة العراقية ولازالت دباباتهم منكسة الى اليوم في منطقة جنين حيث نكسها الاسرائيليون ووضعوها كتذكار لانصارهم وهكذا سقطت كامل فلسطين وسيناء والجولان السورية خلال ساعات ودحرت اسرائيل اربعة جيوش عربية وقتلت عشرات الالاف من افراد الجيش المصري في ظل ظروف اقل مايمكن وصفها بانها خيانة لهذه الامة من قبل ساستها .<br />(( معركة الكرامة 1968م ))<br />تزايد نشاط المقاومة الفلسطينية عبر نهر الاردن مما شكل تهديدا مباشر لكلا الطرفين الاسرائيلي والنظام الاردني حيث أنه كلما تزايدت نشاطات المقاومة الفلسطينية كلما زادت شعبية هذه التنظيمات في الاردن وفي فبراير 1968م هاجمت اسرائيل قرية الكرامة الواقعة شرقنهر الاردن موجهة ضربة شديدة للمقاومة الفلسطينية ودمرت مراكزها وبدأت القوات الاسرائيلية في التغلغل فما كان من قائد الجيش الاردني في الاغوار اللواء مشهور الحديد الا أن أصدر أوامره دون الرجوع للملك بصد الهجوم الاسرائيلي ونشبت معركة حقيقية استبسل فيها افراد وضباط الجيش الاردني وكبدوا القوات الاسرائيلية خسائر فادحة ، بعدها يأيام وفي لندن العاصمة البريطانية التقى اللواء الاردني عامر خماش مع الاسرائيلي حايم بارليف وابلغ حاييم بارليف نظيره الاردني أن هناك افراد وضباط في الجيش الاردني يقدمون المساعدات للمقاومين الفلسطينين دون علم قيادتهم بذلك وأكد حاييم بارليف لرئيس الاركان الاردني أن اسرائيل لاتريد الحاق الضرر بالنظام الهاشمي ولكنها تستهدف التنظيمات الفلسطينية .<br />(( احداث ايلول 1970م ))<br />تصاعدت وتيرة المقاومة الفلسطينية وزادت شعبيتها حتى بين افراد البادية الاردنية المشهورة بولائها للملك ويقول الكاتب ((ان عددا ليس بقليل من افراد وضباط الجيش الاردني تركوا الخدمة العسكرية والتحقوا بتنظيمات المقاومة الفلسطينية لدرجت ان قبائل بنى صخر في جنوب الاردن ايدت ودعمت المقاومة الفلسطينية ودعمتها ووفرت لها التسهيلات )) ص 118 وبالطبع فان ذلك بات يشكل تهديداخطيرا للنظام الاردني ويقول الكاتب في ذلك (( اقلق التهديد لحكم حسين بريطانيا والولايات المتحدة لقد كانت المملكة الاردنية الموالية للغرب احدى دعامات الدول الغربية على مدى 20 عاما وخشي السياسيون في لندن وواشنطن أن يؤدى انهيار الاردن الى اختلال الامن في المنطقة – الاسرائيلي – فلقد كان الملك حسين يلقب في جميع المراسلات بلقب -ملك ذكي شاب- او B.Y.K.- )) ص 116 فما كان من الملك واجهزت مخابراته الى ان سعت وبشكل دؤوب الى افتعال احداث سبتمبر 1970م والتى أدت الى اخراج المقاومة الفلسطينية من الاردن ولكن النظام السوري في تلك الاثناء دخل على الخط واحتل اجزاء من شمال الاردن ظاهريا بغرض دعم الفلسطينين ولكن فعليا سعيا منه الى اسقاط النظام فما كان من الملك الى استعان بسلاح الجو الاسرائيلي ويقول الكاتب في ذلك (( طلب الملك من اسرائيل أن تامر سلاحها الجوي بمهاجمة ارتال الدبابات السورية فما كان من اسرائيل الا ان نفذت ذلك الطلب وقامت ايضا بنقل لواء مدرع كامل من الحدود المصرية الى اغوار الاردن استعداد لأي طارىء ودعما لنظام الملك حسين )) ص 121 . بعد الانتصار على المقاومة الفلسطينية التقى الملك حسين في اكتوبر 1970م بايغال ألون ويقول الكاتب (( كان فحوى المحادثة التى دامت ساعتين عاديا بيد أنه جرى فيها تعبير عن المشاعر لقد تعانق حسين وألون طويلا وكأنهما صديقان حميمان لم يلتقيا منذ امد بعيد وبارك الوزير الاسرائيلي للملك انتصاره في الصراع ضد المنظمات الفلسطينية وشكر الملك من صميم قلبه اسرائيل على الدعم السياسي والعسكري الذي وفرته له )) ص 125.<br />(( الملك حسين في تل أبيب 1972م ))<br />وافق الطرفان على عقد اجتماع سري بينهما ولكن المشكلة في المكان وبعد مداولات بين الجانب الاسرائيلي والخارجية الامريكية التى ايدت فكرة اللقاء اقترح الامريكان ان يكون اللقاء في تل أبيب فخشي الاسرائيليون أن يرفض الملك ذلك ولكن عندما عرض عليه الامر وافق على الفور (( وافق الملك على القدوم الى تل أبيب وقامت هليكوبتر عسكرية بنقله الى مكان قريب من متسادا بجوار البحر الميت حيث كانت في انتظاره طائرة هليكوبتر عسكرية اسرائيلية وكانت الشمس توشك على المغيب عندما مرت الطائرة في سماء القدس )) ص 127 ودار الاجتماع حول النقاط التالية وهي اقتراحات جولدا مائير :<br />1) اقامة ادارة اردنية في معظم مناطق الضفة الغربية 2) يسمح للاردن بتواجد قوات شرطة الى الضفة الغربية لحفظ الامن 3) يمنح سكان قطاع غزة الجنسية الاردنية 4) يسمح للاردن بادارة المسجد الاقصى من الناحية الادارية كتعيين الامام ومسؤلية الاوقاف ...الخ .<br />ولكن كانت أهم نقطة في هذا اللقاء والتى لم يشر اليها الكاتب بوضوح هو تحذير الملك حسين لغولدا مائير بخطورة الوضع على الحدود السورية والمصرية وأن مصر وسوريا قد تقدمان على خطوة دخول حرب جديدة مع اسرائيل ولكن الذي حصل فعليا هو ان اسرائيل لم تأخذ تلك التحذيرات على محمل الجد فكانت حرب اكتوبر 1973م والتى تم فيها ولو جزئيا سحق الجيش الاسرائيلي وهزيمته على يد الجيشين المصري والسوري .<br />الغريب أنه في عام 1967م وعندما تأكد النظام الاردني من هزيمة الجيش المصري والسوري دخل الجيش الاردني الحرب وانتهت بتسليم الضفة الغربية وفي عام 1973م وعندما تأكد النظام الاردني من انتصار الجيش المصري والسوري المحدودين على الجبهة لم يطلق النظام الاردني طلقة واحدة تجاه اسرائيل في وقت كانت فيه الحدود الاردنية مع فلسطين تخلوا من أي وجود عسكري اسرائيلي فهل هذا كان مصادفة أم ماذا؟؟؟؟؟.<br />مقتبسة من كتاب تواطؤ عبر الاردن كتاب الفه اثنان من الصحفين والكتاب الاسرائيلين هما يوسي ميلمان ودان رفيف يوضح علاقة الاسرة ((المنسوبة الى بني هاشم ظلما وزورا وبهتانا)) باليهود وزعماء الحركة الصهيونية"
