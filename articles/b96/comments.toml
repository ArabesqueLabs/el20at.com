text = "نعم مسخرة ومهزلة اسموها مملكة الاردن.. شعبها متخلف.. اشبعه رز وشربه شنينة بكيف وبصير يرقص ويغني حنا الاردنية بنرفع الراس اكلنا مناسف وما بنحب الملوخية.. واذا جاعوا بزعلوا وبصيروا يتمرغوا في الشوارع زي الحمير..<br />الفلسطينية ناكوهم في حرب ايلول وصاروا يقودوا على نسوانهم.. من شان الله ومن شان عبدالله.. وبعد ما اكلوا خرة راحوا استنجدوا باعمامهم واولياء نعمتهم بني صهيون وجابولهم طيارات مقاتلة وعملوهم جسر جوي واوهموا الفدائيين انهم خلص بدهم يعملوا معهم صلح.. طبعا الاسرائيليين ما قصروش ضربوا دبين والكتة وجرش وسيل الزرقاء وعجلون بقنابل النابالم المحرمة دوليا... كرمال عيون سليل الدوحة الهاشمية.. اللي لقي شعب ساقط زي الشعب الاردني اللي حاط عليه السكة زي الحمار وهو بغني ملكنا الغالي.. كس اخت هيك شعب على كس اخت الانجليز اخوات المنيوكة اللي خلوا شعب واطي زي الشعب الاردني يتطاول على اسياده الفلسطينيين اللي لما كانوا عاملين حضارة كنعان قبل 10 الاف سنة كان الاردني يشتغل قطروز في بيارات الفلسطينية وكان ما بعرف يمسح طيزه"
