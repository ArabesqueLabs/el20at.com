[[comments]]
order = 450
subject = "سبب كره الفلسطيني مع توضيح بعض الفروق الشاسعه"
author = "بنت الجنوب"
posted = "2008-07-07"
text = "كونا اردنيا فهذا يعني كرم وجود ونخوى وحميه فمن قال عنا نشاما ما غلط وهدا السبب الي طمع الشعب الملعون (الفلسطيزيه) فينا<br />يكره الشعب الفلسطيزي الاردني<br />1 لانوا لو يموت وبيعيش الف مره مصاروا زينا ولا تشرفوا باحترامنا<br />2 لانوا منوا علينا بتعليمناعلى الملوخيه التي هي عشب بعشب بس نسيوا انا علمناهم المنسف بلحمه البلديه الي بشوفها فقط بعيد الاضحى في حالة كان الهم جار اردني بعتلهم حسنه وبس تعلموا المنسف الشرش الوسخ نقح عليهم واشتهوا المسخن فصاروا يطبخوها عجاج ولما يرجعوا بلقلعه ع بلادهم رح يطبخوها عبساس<br />3 لانوا اذا فكر يتشرف ويناسبنا وطلب بنت اردني منرفض لانوا بكره بتخلف اطفال حجاره بيفولوا سيدوا وستوا ونعنيع ومكاتل وبيضلوا طول عمرهم يتفشخروا بعشيرتة امهم ويستحوا بيقولا اسم عيلتهم وياحبيبي لو كانوا من بيت الخروف او ابوا خنانه ولا صرصور ولا احمد حتى اسامي العيل الاردنيه هيبه<br />4 ولما تصير هوشه بالجامعات الاردنيه وينحبسوا شبابنا بتليفون بيطلعوا وبينام بين اهلوا وهم بياكلوا شلاليت لصبح لبين ما ابوا ولا اخوا يعرفلوا واحد اردني ابن عشيره يتوسط يطاعوا<br />5 لما الفلسطيني يراجع لمعامله بيطاع ريتوا بدور والاردني بخمس دقائق بيخلص<br />6 بيدفعوا الي فوقهم والي تحتهم عشان يدرسوا واحنا مقاعد المكرمه بتستنانا<br />7 الاردني بيمشي راسوا مرفوع بشوارعنا ولما يشوف شرطي بيسلم بكامه هلا يالاخوا بس هم يشوفوا الشرطي وبعد ما يقرا اسم العاله بيشخ على حالوا هلا سيدي ماشي يا سيدي بتامر<br />8 اغاني الفلسطيزيه اموا ياموا ؛_روح سوق البنضوره ياحبابه_وجاجتنا وجاجاتكم يرعن سوا ههههه اغاني ناس جوعانه<br />بصراحه مساكين بدهم يقنعوا حالهم بوطن بديل بس الي مالوا خير باهلوا ماالوا خير بناس لوفيكوا خير ماهربتوا من المواجه وجوبنتوا ونزحتوا الواحد يموت ع ارضوا وهو بدافع ولا ذليل للناس حويناكم وسربتوا من بير شهد ورميتوا في حجر لانكم ملعونين في لبنان محوطينكوا بشيك بعد الساعه 9 المسى بياكل خره الي بره المخيم<br />بليبيا رموكوا بصحرا ورجعنا حويناكم<br />الكويت شغلت بناتكم وبعد ماهربتوا واجيتوا بناتكم وسخ بلدنا ووسخونا<br />بالسعوديه بعاملوكوا متل الهنود والبنغاليه وبس يعرف السعودي انا اردنيا اول كلمه بيقولها اشوا فكرناكم فلسطينيه<br />كل الشعب العربي غلط وانتوا الصح بلا شو شوعوركم بنكتت ملوخياتك وعجسر عادي مهيه الكرامه ماتت حبيت احكي بمنطق وواقيه عشان الاردنيه يووقفوا مسبات ويحكوا كلام يحجموكوا في<br />الحمدلله اني اردنيه وعايشه بلدي معززه مكرمه حره وعيني قويه ولو اسمع فلسطيني اطاول علي بشارع ولا جامعه وراي ناس وحموله بتودي ورا الشمس<br />واي تعليق على ردي من اي فلسطيني او فلسطينيه رح اعرف اني كبست على الجرح وكلامي كلوا صح<br />وانعم حنا اردنيا"
archived = "2010-03-14"
