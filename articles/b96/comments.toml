subject = "ابن الجرايدة"
author = "الأردن أولا المشاقبة عشيرتي ال"
posted = "2008-05-22"
text = "استغفر الله العظيم من كل إنسان ظلـمـتــــه ... استغفر الله العظيم من كل صالح جـفــوتــــه<br />استغفر الله العظيم من كل ظالم صاحـــبتــه .... استغفر الله العظيم من كل بـــر أجـــــلتـــــه<br />استغفر الله العظيم من كل ناصح أهنــتـــــه ... استغفر الله العظيم من كل محمود سئـمــتـــه<br />استغفر الله العظيم من كل زور نطقت بــــه .... استغفر الله العظيم من كل حق أضــعــتـــــه<br />استغفر الله العظيم من كل باطل اتبعــتـــــه ... استغفر الله العظيم من كل وقت أهــــدرتــــه<br />استغفر الله العظيم من كل ضمير قـــتلــــته ... استغفر الله العظيم من كل سر أفشـــيـــــتـــه<br />استغفر الله العظيم من كل أمين خدعــتـــــه ... استغفر الله العظيم من كل وعد أخلــفـــــتـــه<br />استغفر الله العظيم من كل عهد خــــــنتــــه ... استغفر الله العظيم من كل امرئ خذلــــــتـــه<br />استغفر الله العظيم من كل صواب كتمــــته ... استغفر الله العظيم من كل خطأ تفوهــت بـــه<br />استغفر الله العظيم من كل عرض هتكتــــه ... استغفر الله العظيم من كل ستر فضــــحـــتــه<br />استغفر الله العظيم من كل لغو سمعــــتــــه ... استغفر الله العظيم من كل حرام نظرت إليـــه<br />استغفر الله العظيم من كل كلام لهوت بـــه ... استغفر الله العظيم من كل إثــم فـعـــــلتــــــــه<br />استغفر الله العظيم من كل نصح خالفتـــــه .... استغفر الله العظيم من كل علم نـســيــتـــــــــه<br />استغفر الله العظيم من كل شك أطعـــــتـــه ... استغفر الله العظيم من كل ظن لازمــــتــــــــه<br />استغفر الله العظيم من كل ضلال عرفتـــه ... استغفر الله العظيم من كل ديــن أهمــلــتـــــــه<br />استغفر الله العظيم من كل ذنب تبت لك به ... استغفر الله العظيم من كل ما وعــدتـــك بـــــه<br />ثم عدت فيه من نفسي ولم أوفى به<br />استغفر الله العظيم من كل عمل أردت به وجهك فخالطني به غيرك<br />استغفر الله العظيم من كل نعمة أنعمت على بها فاستعنت بها على معصيتك<br />استغفر الله العظيم من كل ذنب أذنبته في ضياء النهار أو سواد الليل في ملأ أو خلا أو سراً أو علانية<br />استغفر الله العظيم من كل مال اكتسبته بغير حق<br />استغفر الله العظيم من كل علم سُـئـلـت عنه فكتمته<br />استغفر الله العظيم من كل قول لم أعمل به و خالفته<br />استغفر الله العظيم من كل فرض خالفته ومن كل بدعه اتبعتها<br />اللهم أني سامحت كل من أخطأ في حقي فأغفر لي أنه لا يغفر الذنوب إلا أنت<br />وصلى الله على سيدنا محمد وعلى آله وسلم تسليماً كثيرا<br />لا إله إلا أنت سبحانك إني كنت من الظالمين"
