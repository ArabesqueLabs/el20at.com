[[comments]]
order = 471
subject = "الى الكلبة بنت الخنزيرة بنت الجنوب"
author = "جميلة العبيدي"
posted = "2008-07-27"
text = "فقط اقول لك: نحن شعب العمالقة والمناضلين والشرفاء يكفينا فخرا اننا قدمنا مئات الالاف من الشهداء ومئات الالاف من الجرحى وعشرات الالاف من المعتقلين لاجل تحرير ارضنا وحرية شعبنا.. فماذا قدمت انت ايتها الكلبة القذرة يا ابنة الخنزيرة وابنة ابوك القرد كحال كل الاردنيين.. ارضكم دنست من قبل الصهاينة فلم يعرف عنها احد حتى جاء ملكك الانجليزي واعلن عنها محتلة عند توقيع اتفاقيات الخزي والعار في وادي عربة.. قلتم انكم رجعتم ارضكم بعملية السلام ولم تطلقوا طلقة واحدة لاستعادتها بل كنتم تطلقون النار على من في طريقه الى غرب النهر ليقوم بعملية استشهادية ضد العدو فتطلقون عليه الرصاص ليقول لكم الصهاينة عفارم عليكوا.. وبعد كل هذا لم تستطيعوا استعادة ارضكم يا يهود العرب.. بل قمتم بتاجيرها 99 سنة للصهاينة والباقورة تشهد يا حقيرة.. من يؤجر ارضه يؤجر عرضه.. ولكن انتم اجرتم عرضكم منذ زمن طويل.. لان من يقبل على نفسه الخيانة والعمالة للانجليز والصهاينة والامريكان من اجل المصاري يقبل على نفسه كل شيء.. يا حثالة الشعوب.. كوني على ثقة بان هذا الزمن الرديء لن يطول.. واما الزبد فيذهب جفاء واما ما ينفع الناس فيمكث في الارض.. وان شاء الله الطوفان قادم.. لان دولة اليهود لن تطول.. وبالتالي دولتكم التي اوجدهما الاستعمار وقصها من بلاد الشام لتصبح كيانا يسمى شرق الاردن.. هذه الدولة المسخ لن تطول ايضا لان بقائها من بقاء دولة اليهود في فلسطين.. وعليه يجب ان تعرفي ايضا انه لن يذهب ما فعلتموه سدى.. ولن يذهب كرهكم للشعب الفلسطيني كرمال الصهاينة والامريكان ونظامكم العميل الخائن لن يذهب السدى .. فانتم من زرعتم العنصرية والاقليمية العفنة وانتم من زرعتم الحقد والكراهية وعليكم ان تجنوا ثمار حقدكم ولو بعد حين.. والزمان قادم ان شاء الله لان دولة الباطل ساعة ودولة الحق الى قيام الساعة.."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 472
subject = "يا عيب الشوم"
author = "الفلسطيني الاصيل"
posted = "2008-07-27"
text = "يا عيب الشوم.. الهذا الحد وصلت بنا القذارة والانحطاط الفكري.. هل يعقل ان يكون المعلقين السابقين من البشر ومثقفين ويتابعوا الانترنت.. والله ان ما اراه مأساة.. هل وصل الحال بالشعبين الفلسطيني والاردني الى هذا الحد من الانحطاط والرذيلة.. الاعداء يتربصون بنا الدوائر وانتم ماسكين في بعضكوا مثل الكلاب الجيعانة.. الله اكبر عليكوا.. وين الشرف العربي وين الانتماء لامة الاسلام خير امة اخرجت للناس.. يا عيب الشوم.. هل هذه هي الوحدة .. هل هذا هو الاتحاد.. ان كل انسان سواء اكان اردنيا او فلسطينيا او عربيا يقوم ببث هذه النعرات وهذه الاقليميات البغيضة وهذه العنصريات العفنة هو شريك كامل وحقيقي شاء ام ابى للصهاينة.. بل هو اشد منهم لان الفتنة اشد من القتل.. عيب عليكم<br />ان كان لديكم بقايا من ايمان بالله وان كان لديكم بقايا من دين او ضمير اتركوا هذه العصبيات المتخلفة ولا فرق بين فلسطيني او اردني او اي عربي الا بمقدار ايمانه بخالقه وبقضايا امته واخلاقه.. وثقوا تماما ان الله سيحاسبكم عن كل لفظة او قول فان لديه قريب عتيد...."
