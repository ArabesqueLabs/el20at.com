[[comments]]
order = 304
subject = "فاذا نفخ فى الصور فلا انساب بينهم يومئذ ولا يتساءل"
posted = "2008-04-30"
text = "يجمع الله الاولين والاخرين ثم ينادى مناد : الا من كان له مظلمه فليجىء فلياخذ حقه -فيفرح المرء ان يكون له الحق على والده او ولده او زوجته وان كان صغيرا = فاذا نفخ فى الصور فلا انساب بينهم يومئذ ولا يتساءلون<br />يوم يفر المرء من اخيه وامه وابيه وصاحبته وبنيه<br />يفر هابيل من قابيل<br />وابراهيم عليه السلام من ابيه<br />ولوط عليه السلام من صاحبته<br />ونوح عليه السلام من ابنه<br />اذا طلب الى كل من اولى العزم ان يشفع عند الله فى الخلائق يقول : نفسى نفسى -- لا اسالك الا نفسى<br />حتى عيسى بن مريم يقول : لا اساله اليوم الا نفسى لا اساله مريم التى ولدتنى<br />لكل امرىء منهم يومئذ شأن يغنيه"
