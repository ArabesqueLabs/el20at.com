text = "اول شي السلام عليكم تاني شي لكل اردني بحكي مع الفلسطينية بحترام وبحبهم اتركو المشاكل التافهه على جهه واتحدو مع اخوانكو الفلسطينية على تحرير القدس والاقصى لانهم لحالهم ما بيقدرو وهاد الشي معروف وما تنسو معروف الفلسطينية معكو عشان اذكركو في معروفهم طول عمركو عايشين في الخيموبتربو الغنم وعمركو ما اعرفتو اشي اسمو تعليم وهاد الشي معروف وواضح هاد تالت شي للفئة الساقطة من لاردنية (اخوات الشرموطة) بحب احكيلكو اول شي كس كوس اختو الي بحكي عن الفلسطينية بالعاطل اوكى او بغلط عليهم لانا يا اخوات الشرموطة طول عمرنا امبغيين خواتكو للعاطلين فيكو طبعا ولو انتو ازلام ابتغلطو على اي فلسطيني في وجهو مش وراه بظن اني وصلت الرسالة الي بدي اوصلها يا محترمين وتحية كل التحية للفلسطينية في كل مكان على وجة الارض ولكو احنا خلقنا ازعرنة والنمردة والسلام عليكم .."
