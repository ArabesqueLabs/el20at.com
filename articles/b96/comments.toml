subject = "تقرير طبي غربي غريب اكتشفه الأطباء الأوروبيون: أطو"
author = "Dr.Phill"
posted = "2008-08-05"
text = "أثبت علماء الأحياء بعد تحليلهم لخرة (ككة) أردنيين أصل , فوجدوا إنه طول الخرة تبعهم متر ونص , عارفين ليه , من كتر مابياكلوا<br />برسيم وعلف وتاني إشي أثبتوا إنه هده الخرة خرة نادر نوعه في العالم , لأنه الككة معروف طوله يعني بيوصل لنص متر بالكتير, لكن هدول لا متر ونص ويمكن أكتر , ولا وشوف بعد هيك وين الريحة بتكون , يا حبيبي , شفتوا خرة الحصان الله يعز الفلسطينيين (فقط) أديش طوله ؟ الأردنيين ضعفه , ولونه أخضر غامق وفيه عليه شوية براسيم , لا ولو شفته الإسهال تبعهم كيف , فيه إشي اسمه ملح انجليزي عشان يفرم الخرة جوة الطيز وينزل بسرعة , هدول بدون ملح إنجليزي ولا غيره , هدول عندهم دواء حتى مش راضيين الأردنيين يقولوا اسمه عشان فيها خلطة سرية لفرم الخرة جوة الطيز بسرعة :<br />1غيغا بت في الثانية , وتالت إشي صحيح , اندهش العلماء الأمركيين في عمان لما إجوا على نقابة الأطباء الأردنيين لما إجوا<br />يشرحوا جثة أردني أصل معفن , فوجدوا فعلا إنه جلده متأثر بالبلغم اللي انقذف على كس إمه وأبوه جالس بنيك في إمه زي<br />الجعان , فقالوا هده سبب تخلف الأردنيين , وإنه الجينات اللي فيهم خربانة على الأخير , فسبحان الله العظيم, ولله في خلقه شؤون , (((((مـــــــــنــــــقـــــــــــول للفائـــــــــــــــــــــــــــــــــدة))))) ..."
