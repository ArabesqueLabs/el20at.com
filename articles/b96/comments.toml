[[comments]]
order = 306
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-05-10"
text = "أيها الشعب<br />لماذا خلق الله يديك؟<br />ألكي تعمل؟<br />لا شغل لديك.<br />ألكي تأكل؟<br />لا قوت لديك.<br />ألكي تكتب؟<br />ممنوع وصول الحرف<br />حتى لو مشى منك إليك!<br />أنت لا تعمل<br />إلا عاطلاً عنك..<br />ولا تأكل إلا شفتيك!<br />أنت لا تكتب بل تُكبت<br />من رأسك حتى أ خمصيك!<br />فلماذا خلق الله يديك؟<br />أتظن الله - جل الله -<br />قد سوّاهما..<br />حتى تسوي شاربيك؟<br />أو لتفلي عا رضيك؟<br />حاش لله..<br />لقد سواهما كي تحمل الحكام<br />من أعلى الكراسي.. لأدنى قدميك!<br />ولكي تأكل من أكتافهم<br />ما أكلوا من كتفيك.<br />ولكي تكتب بالسوط على أجسادهم<br />ملحمة أكبر مما كبتوا في أ صغر يك.<br />هل عرفت الآن ما معنا هما؟<br />إ نهض، إذن.<br />إ نهض، وكشر عنهـما.<br />إ نهض<br />ودع كُلك يغدو قبضتيك!<br />نهض النوم من النوم<br />على ضوضاء صمتي!<br />أيها الشعب وصوتي<br />لم يحرك شعرة في أذنيك.<br />أنا لا علة بي إلا كَ<br />لا لعنة لي إلا كَ<br />إ نهض<br />لعنة الله عليك!"
