posted = "2008-07-23"
text = "انت ولك يا مقملة معززة مكرمة.. الله يرحم ايام القمل اللي كان ماكلكوا.. ولكوا طول عمركوا تجروا والبراغيث وراكوا.. والثوب اللي كانت تلبسه امك وجدتك كان اذا حطيناه في ثم كلب رح الكلب يقذف من العفن والوسخ.. اه يا مدودة يا بنت المدودين.. زمن اخو شرموطة اللي خلا اشكالك يحكوا.. ولك صرماية الهامل في فلسطين بتشرف كل عيلتك واهلك وشعبك اللواطي القذر الحارس الامين للصهيونية لانكوا طول عمركوا مجرد كلاب ضالة بتلحق اللي بطعمها.. ولك انسيتوا كلوب باشا اللي كان ينيكوا بسطل حلاوة وبقطرميز طحينية.. الله يرحم.. ازعم شيخ عندكوا برتشي بحبة كرشلة.. واللي كانوا ناسيونه الفلسطينية في بلادهم من خيرات بدكوا مليون سنة تتلحقوه.. يا جماعة فت العدس والهيطلية.. اخص على شرفكوا لانوا ما عندكوا شرف واكثر واحد بحكي عن الشرف هن الشرموطات.. روحي شوفي بنات العشاير الجذابة في الكرك والطفيلة تجيف بنتاكن من المصاروة قبل الفلسطينية يا وسخين يا زبالة الشعوب.. لكن الزمن جاي.. وان شاء الله رح نحط العصي في طيوزكوا بعد ما يتخلى عنكوا اسيادكوا اللي داعسين في طيازكوا طول العمر"
