subject = "سلملي على البيتنجان"
author = "مصري مقيم في الاردن"
posted = "2008-06-07"
text = "انا اشتغلت مع اردنيين في البلد ده وبصراحة تلتين اللي اشتغلت وياهم كلوا حقي.. الاردنيين دول بدو مقطعين.. ولولا موجود عندهم شعب متحضر زي الشعب الفلسطيني كان دلوقيت ماشيين مع الغنم لانه الغنم والمعز انظف منهم .. وانا اشتغلت في الغور في الشونة الجنوبية ودير علا والمشارع ومعدي ولقيت النسوات بتوع الاردنية مولعين على الاخر واني واللي معاياه من المصريين العمال علشان من برة البلد كانوا ييجولنا المزارع وانيك فيها نسوان الغورانية اللي هناك وكمان الفلسطينية اللي في الغور بنيكوا بنات الغور"
