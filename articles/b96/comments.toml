text = "الأردن بلد الحريات<br />أود ان انقل اليكم ما حدث في الجامعه الأردنيه<br />في الظهر خرجت مسيرة سلميه في الجامعه نظمها الاتجاهالاسلامي في الجامعه<br />الاردنيه حيث كان المتظاهرون يمشون في الشوارع داخل الجامعه حاملين الأعلام<br />الفلسطينيه والاردنيه ولما وصلت المظاهره الى منطقة كلية العلوم حوصر<br />المتظاهرون بالأمن الجامعي ولا أدري بالضبط ما حدث هنا ولكن بعد قليل وجدنا ان<br />جزءاًًَ من المتظاهرين ذهبوا الى شعبة الأمن وبدأوا الضرب بينهم وبين رجال<br />الأمن الجامعي ، ولقد رأيت رجلاًُ من رجال الأمن ورأسه يقطر منه الدم لكني لم<br />أعرف التفاصيل بعد . هنا سمعنا رجال الأمن يقولون ( لقد حشرناهم عند كلية<br />العلوم اذهبوا واضربوهم ولن يقع على أي منكم أي مسؤوليه ). وهذا بالضبط ما حدث<br />فأصبح رجال الأمن والطلاب الأردنيين الأصل يضربون كل من لديه لحيه من الشباب<br />حتى لو لم يكن له دخل في شيء وهذا ما رأيته بأم عيني. في القرب من كلية العلوم<br />يتم بناء كلية الملك عبدالله الثاني للتكنولوجيا فأخذ الطلاب الأردنيين يأخذون<br />الأخشاب الطويله ويضربون بها كل من لا يعجبهم وبهد ذلك أخذو (U.S.A) يمشون في<br />شوارع الجامعه وهي يهتفون<br />ويهتفون للأردن وكاننا كنا نهتف ضد الأردن والأردنيين<br />حتى أن احد المتعصبين الأردنيين خرج الى مكان عال وأخذ يكفر ويشتم فلسطين وكأن<br />الدين للفلسطينيين وذلك أمام الأمن الجامعي ودون ان يتدخل في ذلك حتى انه كان<br />يمسك(بالشيوخ) أي من يطلقون لحاهم من الشباب ويتركوا الأردنيين يضربونهم<br />بالأخشاب والأحزمه الجلديه دون رحمه<br />هذا والله ما حصل امام عيناي ودون مبالغه والله على ما أقول شهيد<br />والسؤال الآن الى متى سيظل الأردنيون يتغنون بالحريات وخاصة المسؤولين منهم وهم<br />في داخلهم هذا الحقد غير العادي على الفلسطينيين الذين هم عصب الإقتصاد الأردني<br />طالب فلسطيني - الجامعة الأردنية"
archived = "2010-03-14"
capture_url = ""

