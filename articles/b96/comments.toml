order = 436
subject = "المانيا"
author = "خرة على العرب"
posted = "2008-06-23"
text = "انا تخرجت من احدى الجامعات الاردنية قبل عشر سنوات وذهبت لاكمل تعليمي بالمانيا لارى الفرق الكبير بين مستوى التعليم وقررت بعد تخرجي عدم العودة ابدا للاردن. قبل عشر سنوات لما كنت طالب بالاردن والله العظيم نفس الشيء دايما طوشات عشائرية على حكي فاضي، مين مخاوي على مين ومين الزلمة ومين المرة :/<br />يعني انا مو قاعد بتفلسف عليكم بس اللي بدي اقلقم اياه انو الاردن موقعها صفر بالعالم، مافي شيء تنحسدو عليه بهاذ البلد، لابترول لازراعة لاصناعة مشاكل على مستوى المياه والتدفئة، حتى الطبيعة صحراوية خالية، طيب يعني على الاقل خلي علاقاتكم ببعض كويسة عشان تعيشو شوية مبسوطين، الاوروبيين قتلو الملايين من بعض وكانو عنصريين مع بعض بس اليوم عملو اتحاد لانهم اكتشفو بالاخير انو مافي حد احسن من الثاني وهالشغلة ماجابت همها، شوفو بالجوجل في ترتيب عن احسن الجامعات بالعالم ، ولاجامعة اردنية موجودة باللائحة ليش ؟ لاتقولو امكانيات مادية لانو في جامعات فقيرة وموجودة مع افضل الجامعات، السبب انكم مشغولين بالكلام الفاضي وبقلة الحيا، اصلا اغلب الطلاب مو جايين يدرسو ، جايين يتسلو ويتباردو ، وقال شو الطوشات سببها انو مافي اتحاد طلبة، وشو رايكم انو بالجامعات الاوربية والامريكية اصلا ممنوع اي نشاط سياسي طلابي ومافي اتحادات من هاذ النوع.<br />العرب كلهم سقايط والولاية احسن منهم، دايما مسخرة العالم والكل يجي يحتلكم ويهتك عرضكم ويوسخ شرفكم ونتو زي البهايم، في تقرير عن صندوق النقد الدولي ومنظمة التطوير بقولو فيه انو الدول العربية راح يسير فيها مجاعات ومشاكل بمياه الشري، احسن شيء انكم تموتو من الجوع والعطش ياحوش ياكلاب.<br />والسلام عليكم !"
archived = "2010-03-14"
