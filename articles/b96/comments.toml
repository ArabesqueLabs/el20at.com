text = "ولك يا ابن القحبة كس اختك على كس اخت احسن واحد في الشريدة.. يا قحاب يا منايك.. ولك صرماية اي فلسطيني بتشرف الشيخ فيكوا يا حثالة يا سقايط.. والجبناء هم من امثالك الجبناء شعبنا اللي الطفل فيه مستعد يواجه دبابة.. والضفة بتشهد وغزة بتشهد وجنوب لبنان يشهد.. وفي حرب ايلول نكناكوا ونكنا نسوانكوا وخواتكوا ورحتوا استنجدتوا باسيادكوا في تل ابيب ولندن من شان يجيبولكوا طيارات وسلاح يا بجم.. لانكوا شعب ساقط.. ولا يوجد اصلا في التاريخ شعب اردني انتم شعب لمم مسخ سولكوا دولة مسخ مثلكوا انتوا مجرد كلاب في حراسة اسرائيل ولا تزيدوا عن ذلك اي شيء واميركا بتدفع رواتب المخابرات عندكوا مش من شان سواد عيونكوا بل لانها وجدت فيكوا اخس شعب وانذل شعب<br />ولك صرمايتي تاج على روس الشريدة كلهم وعلى راس اتخن واحد اردني.. يا لمم يا حوش يا اصحاب القمل والبراغيث يا معفنين يللي الشعب الفلسطيني علمكوا كيف تخروا لانكوا كنت تخرو قدام بعضكوا بالوديان وتبغوا بعضكوا لانكوا شعب تافه.. اما حديثك فانا اكتب اسمي كاملا وان كنت زلمة زودني برقم تلفونك واذا كنت زلمة اكثر حدد موعدا للقائك بشرفي وعهد علي ما اوسخ ايدي بواحد ساقط رخيص مثلك بس لاحشي العصاة في طيزك وفي طيز الزعيم في عيلتك"
