text = "أين أنتم يا موقع عشرينات حتى تسمحوا بمثل هذه التعليقات ؟ أين هو محرر الصفحة ؟ وبالنسبة للمدعو الخرة ميكا أنا يا كلب يا بن<br />الكلب إنتا واستاذك الساقط رابسو عليه من الله ما يستحق ما حطيت ما يسمى بسورة الفلسطيزيين , والله أنا مش حكفر بس<br />عشان أقهر الأردنيين , ما أنا فشيت غلي فيهم وأكلتهم وطفحتهم ودحشت الخرة بتمامهم مضبوط , جاي تقولي , حبيبي , صدقني<br />رح أوصلك وأهكر كمبيوترك , ولما تشوف إشي لونو أحمر يا حبيبي بالشاشة مكتوب عليه : I Love you فمعناها إنو كمبيوترك ودع<br />وما رح يرجع عشان تعرف تطلع قيمة الكلمة اللي من تمك , والله لأخليك تعيط وتبكي وكل شي بس اصبر علي ........<br />وسلامي لكل عربي مسلم وللفلسطينيين شعب الأحرار والوطنيين والشرفاء والكرماء ........"
