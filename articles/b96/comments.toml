posted = "2008-03-24"
text = "فعلا انكم زي ما حكا عنكم دكتور من دار البطاينة انكم بقر و غنم وما بتنفعو الا للجيش واحسن واحد فيكم يا اردنية هوا اكبر اخو شرموووووووووطة ،صرماية شحاد فلسطيني بتسوى اكبر راس اردني ،ليش ؟؟؟ لانو انتو بجم وبقر وعندكم التخلف بالكيلو بينباع ولكو اذا الملوخية بتفرموها مع السلطة ،يفضح عرضكو ،فوق ما انتم السبب الاول بضياع فلسطين بلد الناس الفهمانة والعقول النيرة بتيجي يا ابن الستين شرموطة يا اسامة الزواهرة والسعيدات ابن الزنى ،وانتو كلكو ولاد زنى لانكم الاسلام مش سامعين فيه،والكم عين تحكو يا ولاد القحبات،ولكم احمدو الله انو جابلكم الفلسطينية لانو والله لولا الفلسطينية عمركم ما بتصيرو بشر لتضلو بقر،ولكم الملك حسين الله يرحمه قسم الاردن قسمين جماعة الجيش والامن اردنية ( لانكم بقر طبعا ) والاقتصاد والمراكز العلمية تسلمت للفلسطينية ( لانهم عباقرة وعندهم شرف ) اخزى على حالك انتا واياه يا اخو الستين منيوكة"
