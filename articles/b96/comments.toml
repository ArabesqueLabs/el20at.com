author = "yvf ;tvk[i"
posted = "2008-04-29"
text = "لا تنسوا إخوانكم في فلسطين والعراق وفي كل مكان بالدعاء<br />رب اغفر لي ولوالدي رب ارحمهما كما ربياني صغيرا<br />عَنْ مَعْقِلِ بْنِ يَسَارٍ، قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ:\"لأَنْ يُطْعَنَ فِي رَأْسِ أَحَدِكُمْ بِمِخْيَطٍ مِنْ حَدِيدٍ خَيْرٌ لَهُ مِنْ أَنْ يَمَسَّ امْرَأَةً لا تَحِلُّ لَهُ\". أخرجه الطبرانى (20/212 ، رقم 487) ، والروياني في \" مسنده \" ( 227 / 2 ) ، وصححه الألباني في \"السلسلة الصحيحة\" (1 / 395). وعَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا زَوْجَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَتْ: \"لَا وَاللَّهِ مَا مَسَّتْ يَدُ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَدَ امْرَأَةٍ قَطُّ\". رواه البخاري (6674)، ومسلم (3470)، والترمذي (3228)، وابن ماجة (2866)، وأحمد (23685)، وغيرهم. قال الإمام المُجَدِّد مُحَدِّث العصر محمد ناصر الدين الألباني طيب الله ثراه في \"السلسلة الصحيحة\": وفي الحديث وعيد شديد لمن مس امرأة لا تحل له, ففيه دليل على تحريم مصافحة النساء لأن ذلك مما يشمله المس دون شك, وقد بلي بها كثير من المسلمين في هذا العصر وفيهم بعض أهل العلم, ولو أنهم استنكروا ذلك بقلوبهم لهان الخطب بعض الشيء, و لكنهم يستحلون ذلك بشتى الطرق و التأويلات."
