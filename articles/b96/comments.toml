posted = "2009-03-22"
text = "هذه المعلومات من معجم بلدان فلسطين(3)----------- لمن يريد التاكد ادخل هذا المعجم<br />(((العمريون)) في قرية((يازور)) هم اردنيون يعودون الى قبيلة - عمرو= من الكرك<br />عشائر (( الدراغمة )) و الصوافطة واغلب سكان طوباس اردنيون من السلط-<br />(( الجربان)) والعمارنه في قرية ((يعبد))) من شرق الاردن<br />في قرية (( ابروقين)) من قرى نابلس قسم من سكانها من الاردن<br />وحمولة (((ال جابر))و ((العريقات)) الموجودون في قرية ((ابو ديس)) هم اردنيون من الحويطات من الجنوب<br />في قرية ((اليامون)) قسم من سكانها من الاردن<br />في قرية(((يتما))) جنوب نابلس قسم من سكانها اردنيون وانتقل عائلة(( مرار)) الاردنية من(( يتما ))) الى الخليل<br />هذه قسم بسيط من الاردنيون النازحين لفلسطين راجعوا اسماء القرى والمدن والعائلات اعلاه<br />فكلنا اخوان واهل"
