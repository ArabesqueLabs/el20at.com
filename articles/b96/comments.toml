text = "عزيزي امجد الشريدة.. تحية العروبة والاسلام.. يا عزيزي اعتقد انه لا يجوز باي حال من الاحوال التعليق الذي اوردته والاساءات والكلام غير الاخلاقي والكلام عن الشرف وانه لا يشرفك الانتماء الى فلسطين ولا الى اهلها وان كنت اعتقد ان فلسطين واهلها لا يشرفهم انتساب امثالك ممن يحملون هذا الحقد الاسود اليهم..<br />على العموم هذه الامور نتركها الى عالم الغيب والشهادة الذي سيحاسب كل نفس عما تحدثت وفيما تحدثت ومن هتك الاعراض ومن ومن ومن..<br />ولكن بالنسبة لحديثك عن ال الشريدة فاحب ان اقول لك ان الشريدة من الحماد من الدروع من بني خالد<br />والشريدة عشائر منطقة محافظة اربد و الرمثا و شمال فلسطين منهم و كذلك الخالدي وبني خالد المنتشرين في شمال فلسطين و جنين و منهم آل شاهين وال قدورة وغيرهم كثير و هم يقرون بذلك و معروف عنهم أنهم قرشيون من بني مخزوم<br />اما عائلة الشريدة فهي معروفة في جنين وهي حمولة كبيرة ولكن يعرف منها الان العائلات اي افخاذ الحمولة<br />والسلام"
