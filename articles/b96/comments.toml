text = "يلاحظ اي انسان عاقل ذلك الحجم الهائل في اغاني الاردنيين التي يسمونها بالوطنية.. عنقر بوريتك وابو شماغ احمر وحنا اردنية واردنيين رافعين الراس ويا ويلي اللي عاديته ومن هذا الكم الهائل من المفردات حتى يظن المرء ان الاردن والاردنيين في حرب شرسة ضارية ضد العدو الصهيوني..<br />اعتقد جازما ان هذه اسقاطات نفسية سوداء حيث ترى الاذاعات الاردنية والتلفزيونات الرسمية والخاصة تبث هذه الاغاني وكانها مورشات عسكرية لشعب ساقط عرف عنه النذالة والخسة والجبن امام العدو الصهيوني بل هم الحراس عليه المؤتمنين على احاطته كاحاطة السواء بالمعصم من اي انسان مقاوم يريد ان يعمل عملية فدائية او حتى تهريب سلاح لمقاوم في الضفة يطعنونه في ظهره مباشرة بالرصاصات الغادرة هذا دورهم.. ولذلك اقترح ان يغيروا هذه الاغاني ويعلنوها بصراحة ويغنوا مثلا نحن كلاب اليهود النشامى نحن ابناء بوش وشارون واولمرت نحن احفاد كلوب باشا ونحن بغال الانجليز وجحوشهم"
