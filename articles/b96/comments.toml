[[comments]]
order = 358
subject = "هيا بنا نُسَبِّحُ"
author = "ابن ادم"
posted = "2008-06-07"
text = "التسبيح كما عَلَّمنا الله تعالى بكتابه الكريم هو فعل له مواقيت محددة، وكيفية محددة أيضًا، يقول من أعبده وحده:<br />\" وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا وَمِنْ آنَاء اللَّيْلِ فَسَبِّحْ وَأَطْرَافَ النَّهَارِ لَعَلَّكَ تَرْضَى \".<br />\" وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ الْغُرُوبِ &--9679; وَمِنَ اللَّيْلِ فَسَبِّحْهُ وَأَدْبَارَ السُّجُودِ \".<br />وقد بين سبحانه أن التسبيح يسبقه تفكر في الملك والملكوت، وعظمة الحيّ الذي لا يموت، فقال:<br />\" إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالأَرْضِ وَاخْتِلاَفِ اللَّيْلِ وَالنَّهَارِ لآيَاتٍ لِّأُوْلِي الألْبَابِ &--9679; الَّذِينَ يَذْكُرُونَ اللّهَ قِيَامًا وَقُعُودًا وَعَلَىَ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَاوَاتِ وَالأَرْضِ رَبَّنَآ مَا خَلَقْتَ هَذا بَاطِلاً سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ \".<br />فهيا بنا نسبح الله تعالى وننظر في بعض بعض بعض ملكه، لنتدبر كيف هو إلاهنا إله عظيم ولنتدبر كيف خلق سبحانه هذا الكون الذي لم نحط إلا بالقليل منه بالحق، ونطالع لمسات الجمال في هذه الصور البسيطة:"
archived = "2010-03-14"
capture_url = ""

