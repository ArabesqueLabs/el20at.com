subject = "الفرق بين الفلسطيني والاردني"
author = "الصقر"
posted = "2008-06-06"
text = "الفلسطيني احتلت ارضه في العام 1948 بتامر الانجليز مع اليهود وقاوم وناضل وحاول استردادها ثم احتلت ارضه في العام 1967 بتامر عربي وعلى الاخص اردني بعد ان سلم الجيش الاردني الضفة الغربية تسليم اليد للعصابات الصهيونية وقام الفلسطيني وحاول بشتى الوسائل استعادتها وهو لا يزال حتى اليوم..<br />الاردني احتلت ارضه من الباقورة الى وادي عربة.. لم يعرف احد في العالم وخصوصا من يسمون انفسهم بالاردنيين ان ارضهم محتلة.. ولم يعرف العالم ان للاردن ارضا محتلة الا عند توقيع اتفاقيات وادي عربة.. الاردنيون لم يطلقوا طلقة واحدة على اسرائيل لاستعادة ارضهم المحتلة.. ليس هذا فحسب بل الادهى من ذلك كله انهم بعد توقيع الاتفاقيات المشؤومة قاموا غصبن عنهم والصرامي فوق رؤوسهم بتاجير اراضيهم المحتلة الى 99 عاما.."
