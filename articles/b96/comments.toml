text = "لا يوجد شيء في التاريخ اسمه الاردن... هناك نهر الاردن الذي هو جزء من فلسطين على مر التاريخ.. اسس الكيان الاردني نسبة الى نهر.. وسبب تاسيس الاردن التي هي صحراء بلاد الشام.. هو ما سيحل بعدها بفلسطين حيث كان الانجليز والصهاينة يؤسسون للدولة المسخ اسرائيل.. وكان لا بد من وجود كيان شرق هذه الدولة المسخ يحميها من المناضلين والمجاهدين والثوار.. فاوجدوا الاردن.. وعندما جاءت الثورة الفلسطينية الى الاردن بعد نكبة 67 استطاعوا بالتامر مع النظام الاردني ايجاد الفتنة السوداء بين من يسمون انفسهم بالاردنيين والثورة الفلسطينية حيث كان يقوم الجيش الاردني بلبس لباس الفدائيين والقيام باعمال لااخلاقية ضد المدنيين الاردنيين او حتى ضد العسكريين وذلك لتحريض الاردنيين على الثورة الفلسطينية خصوصا انها وجدت ترحيبا منقطع النظير في اوساط بعض العشائر التي تحترم نفسها كعشيرة بني صخر الضاربة في جذور التاريخ.. ولهذا فالكيان الاردني سيبقى ما دامت اسرائيل قائمة والعكس صحيح"
