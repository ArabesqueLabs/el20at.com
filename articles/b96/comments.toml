capture_url = ""

[[comments]]
order = 408
subject = "مجلة أمريكية : مرتزقة امريكيون يستغلون صلاتهم بالع"
author = "ابن اريحا"
posted = "2008-06-14"
text = "السبت, 14 جوان/يونيو 2008 14:54<br />كشفت مجلة امريكية رائجة في عددها الاخير ان شركة أمريكية في مجال الامن والإستخبارات حصلت على عقود امنية كبيرة مع الاردن وافق عليها العاهل الاردني الملك عبدالله الثاني لوجود صلات شخصية له مع عميل سابق لوكالة الاستخبارات الامريكية المركزية، يعمل الآن كرئيس تنفيذي لإحدى شركات الأمن الخاصة.<br />حيث كشفت مجلة ذي نيشن الامريكية، المحسوبة على التيار الليبرالي واليسار الامريكي، في عددها الاخير، ان ضابط استخبارات امريكي بارز اسمه روبرت ريتشر، كان يترأس عمليات وكالة الاستخبارات الأمريكية السرية في العالم العربي بين 1999 وعام 2004 وان جزءا من مسئولياته الرسمية كانت ان يكون \"نقطة الوصل لوكالة الاستخبارات الأمريكية مع ملك الاردن عبدالله، وهو حليف امريكي رئيسي\".<br />وكشفت المجلة الأمريكية ان بعد خروج ريتشر من الخدمة قام بتأسيس شركة امن واستخبارات اسمها \"توتال انتيليجنس\" مع عميل الاستخبارات الامريكية المخضرم كوفر بلاك كوفر بلاك، المسئول البارز سابقا في قسم مكافحة الإرهاب في جهاز الاستخبارات المركزية الامريكية بعد احداث 11 سبتمبر/أيلول، وهو من عرف عنه إعلاميا وعده للبيت الابيض انه سوف \"يأتي برأس اسامة بن لادن (زعيم تنظيم القاعدة) عل طبق من الثلج الجاف للبيت الابيض\".<br />وقال تقرير المجلة، الذي أطلعت عليه وكالة أنباء امريكا إن ارابيك، ان علاقة الملك عبدالله مع ريتشر المباشرة ضمنت لشركتة الحصول على عقود تدريب للاستخبارات الاردنية وعلى عقود لصالح شركة بلاكووتر للمرتزقة، التي تقدم لها شركة \"توتال انتجلينس\" المشورة، في الاردن بحسب المجلة الامريكية.<br />يذكر ان مجلة امريكية أخرى هي ماذر جونز الامريكية، المتخصصة في الصحافة التحقيقية المطولة، قد قالت في شهر مارس/أذار ان شركة بلاك ووتر، الشركة الاشهر للأمن الخاص في العراق، على الرغم من اتهامها مؤخرا بتعمد قتل بعض المدنيين العراقيين بدم بارد، قد حصلت على عقد تدريب قوات خاصة في المملكة الأردنية الهاشمية.<br />غير ان تقرير مجلة ذي نيشن الصادر هذا الاسبوع يعد الأول الذي يفصل طبيعة العقد وعلاقة ريتشر الخاصة بالملك عبدالله.<br />وقال تقرير مجلة ذي نيش:\"عمل ريتشر لسنوات عديدة بالقرب من الملك عبدالله كنقطة الوصل مع الاستخبارات الامريكية\".<br />وقالت :\"لقد قامت الاستخبارات الامريكية بالانفاق بسخاء على الإستخبارات الاردنية وارسلت ملايين الدولارات في السنوات الاخيرة من اجل التدريبات الاستخباراتية هناك. لكن بعد ان تقاعد ريتشر قالت المصادر انه ساعد شركة بلاك ووتر في الحصول على عقد سخي مع الحكومة الأردنية لتقديم نفس التدريب الذي كانت تقدمه الاستخبارات الامريكية\".<br />وقال التقرير ان وكالة الاستخبارات الامريكية غاضبة نتيجة استمرار صلات العاهل الأردني بريتشر حتى بعد خروج الاخير من منصبه فقالت :\"ما زال يتحدث عبدالله مع ريتشر بانتظام وهو ما زال يعتقد انه يتحدث الينا (اي الحكومة الامريكية). مازال يعتقد ان ريتشر هو الرجل (اي نقطة الوصل للحكومة الأمريكية)\"."
archived = "2010-03-14"
