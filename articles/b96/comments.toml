posted = "2008-06-12"
text = "عزيزي انا الذي اطالبك بان تحكم عقلك.. هذا الكلام ليس لفوزي فقط.. بل انا درست في الخارج وقرات عشرات الكتب التي تتعلق بحكام الاردن.. ولكن نحن فقدنا البصيرة وفقدنا البوصلة .. لاننا شعب ادمن على التخاذل والخنوع واشترونا بثمن بخس دراهم معدودة.. كل الشعوب تجد انها حرة ابية الا نحن يجيء اي من كان فيحكمنا.. اقتطعوا لنا ارضا هي جزء لا يتجزا من بلاد الشام (بادية الشام) او قل صحراء فلسطين كما كانت تسمى في بعض الكتب التاريخية ثم حكموا علينا ملوكا وامراء.. فاذا كان هناك بالفعل شعب اسمه الشعب الاردني فاين هو ليحكم بلده واين هي الحكومة الوطنية التي تسوس البلد هي حكومات متخلفة فاسدة مفسدة ينخر فيها السوس حتى العظم.. فاصبح الوزراء والمسؤولين مصابون بالتخمة فيما الجوعى في البوادي والقرى والمخيمات بمئات الالاف لا يجدون رغيفا او ثمن علبة دواء.. ثم ناتي لنتكلم عن اطهر شعوب الارض قاطبة الشعب الفلسطيني المجاهد الذي قدم اكثر من 300 الف شهيد منذ العام 1948 وحتى الان ومئات الالاف من الجرحى والمعتقلين في سجون العدو الصهيوني وفي سجون بني يعرب وعلى الاخص في سجوننا نحن..<br />ازجيها تحية عربية كركية خالصة الى شعب فلسطين المرابط في بيت المقدس واكناف بيت المقدس رغم حقد الغالبية منا على هذا الشعب النبيل لانه ببساطة شعب حضاري ثوري لا ينسجم مع خطابنا نحن العربان الذي كان كلوب باشا يشتري ازعم شيخ في البلد بتنكة حلاوة او زبيب.."
