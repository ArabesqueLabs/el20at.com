[[comments]]
order = 362
subject = "الى 90% ممن يسموا بالاردنيين"
author = "الحارث الفلسطيني"
posted = "2008-06-07"
text = "ممكن يكون 10% ممن اسماهم الانجليز واليهود بالاردنيين ممكن يكونوا ملاح ويمكن النسبة اقل من ذلك بكثير.. المهم نسبة 90% من الاردنيين هم نعاج وماعز وخرفان. اي واحد بيجي من برة بقودهم.. حتى كلوب باشا عمل عليهم حاكم ونيك الانجليز ثلثين نسوان البدو في الاردن.. الاردنيين بحبكوا ينتاكوا كثير من الانجليز علشان يحسنوا النسل.. ولذلك تجد ان بدو الاردن في منهم شقر وعيونهم زرق نسبة الى ابائهم واجدادهم الانجليز.. والله يرحمك يا سعد صايل ويا ابو علي اياد اللي خليت العسكري الاردني مجرد خنثى في حرب ايلول لولا انهم راحوا يترجوا اليهود والانجليز ويطلبوا منهم المدد والاغاثة وكل جماعة اربد اللي عاصروا الوضع بعرفوا كيف جاءت طائرات الفانتوم الاسرائيلية وهي ترفرف بالعلم الاردني وتقصف الفدائيين في سهل حوران وفي دبين بعد ان اوهمهم الملك حسين بالصلح واخذهم غدرا وحرقهم بقنابل النابالم الاسرائيلية التاريخ لن ينسى ولن يغفر وكل شيء بحسابه والطوفان قادم ان شاء الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 363
subject = "فزعة الانجليز واليهود"
author = "ناصر العلي"
posted = "2008-06-07"
text = "يا اردنية يا منايك يا بغاوغة ولكوا مين فزعتكوا طبعا معروف اليهود والانجليز واليوم اولاد العم سام.. يا من تامرتم على الثورة الفلسطيينة في 1970 بعد ما ناكت الثورة خواتكوا ونسوانكوا وبناتكوا لانكوا بتستاهلوا اكثر من هيك.. وكنتوا بدكوا تسلموا ورفعتوا الرايات البيض لولا ان استنجدتم بقرايبكم اليهود والانجليز ورحتوا تتوسلوا من شان الله خلصونا من الفلسطينية ناكونا على الاخر.. طبعا الجماعة ما قصروا معاكوا لانهم عارفين انكم كلاب حراسة للكيان الصهيوني.. والفدائي اللي كان يعمل عملية فدائية استشهادية من الاردن كان الرصاص يجيه من الخلف من الاردنية مش من الاسرائيلية يعني كان هموا اولاد الصرامي حراس اليهود واليهود مرتاحين ومكيفين على الاخر من كيانكوا التافه لانهم مش رايحين يلقوا شعب في العالم كله اتفه من الشعب الاردني.. ولكوا الشعب اللبناني اللي ثلثينه طنطات طلع عنده شرف اكثر منكوا.. شعب الصومال اللي مش لاقي يوكل طلع ازلم منكوا وقاوم الاميركان شعب افغانستان اللي داير في الجبال طلع اشهم منكوا والادهى انوا مسميين حالكوا نشامى مزبوط نشامى في انكوا شاطرين تنتاكوا من ازباب الغربى كس امكوا واحد يقول للثاني يا كلاب يا صرامي"
archived = "2010-03-14"
