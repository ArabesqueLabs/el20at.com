text = "هذه المعلومات من منتدى((دبورية))) ابحثوا به (((العائلات في دبورية))<br />العائلات الاردنية في دبورية<br />**عائلة الاكتيلات - اكبر واقدم من سكن دبورية وهم اردنيون من قرية بشرى اربد<br />**عائلة البياطرة اردنيون من الطفيلة<br />**عائلة ججيني وهم من قرية ججين غرب اربد= جاؤا 4 اخوه اثنان سكنا في دبورية (احمد واسماعيل) و2 تفرقوا في فلسطين<br />***عائلة السموعي وهم اردنيون من قرية ((السموع)) غرب اربد جاؤا من الاردن ايام الانتداب البريطاني<br />رية ((<br />***عائلة ((الشحبري))) اتوا من قرية((كفراتا في حيفا واصلهم اردنيون من ((كفرنجة)) في عجلون<br />***عائلة عوض = اتى عوض الى دبورية من الناصرة وكان مسيحي اصلة اردني من جرش الاردنية<br />***عائلة ابراهيم === وهم اردنيون من بلدة المزار في اربد -- اتى اثنان الى دبورية واتجه 2 الى قرية (نحف) في الجليل ويطلق عليهم ((عائلة عبد الغني))<br />هذه دراسة من دبورية نفسها اعدها باحثان افتحوا ع ((العائلات في دبورية)) وتعرفوا ع المزيد"
