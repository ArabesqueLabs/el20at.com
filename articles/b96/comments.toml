subject = "الهاشميون والنساء"
author = "ابن الكرك"
posted = "2008-06-10"
text = "* يصدر قريبا للزميل أسامة فوزي كتاب \\\" الهاشميون والنساء \\\" الذي قضى في تأليفه عامين كاملين دخل خلالهما عبر الوثائق والروايات وقصاصات الجرائد وسطور الكتب إلى غرف نوم ملوك وأمراء العائلة الهاشمية التي حكمت في الحجاز والعراق والأردن وسوريا .* وعن ظروف وملابسات تأليفه لهذا الكتاب يقول الزميل في المقدمة :\\\" كمواطن أردني لم اكن اعرف شيئا عن ملكات وأميرات العرش الأردني ... كنت اسمع باسم \\\" الملكة زين \\\" دون أن اعرف شيئا عنها اللهم إلا كونها أم الملك حسين وكان عبد الناصر في خطاباته يشير إليها ساخرا في معرض نقده لنظام الحكم في الأردن ... كنت اسمع باسم الملكة دينا- زوجة الملك حسين الأولى - دون أن اعرف شيئا عنها ... وبعد تصالح الملك حسين مع عبد الناصر في منتصف الخمسينات وزواج الملك من ابنة ضابط إنجليزي نشرت مجله \\\"آخر ساعة المصرية\\\" تحقيقا مطولا بالصور الملونة للملك وزوجته الإنجليزية الحسناء وهما يقضيان رحلة استجمام على شاطئ العقبة ... كانت الصور الملونة الكبيرة التي غطت صفحات المجلة وتصدرت الغلاف مثيرة فعلا فقد سمح الملك لمصور المجلة أن يلتقط له ولزوجته صورا بالمايوه ... ثم سمح للمجلة بدخول الأردن وكنت أرى الناس يتخاطفون أعداد المجلة من الأسواق للنظر إلى صورة الزوجة الجديدة للملك وهي بالمايوه \\\" .* يضيف الزميل فوزي في المقدمة : \\\" كانت إشارات عبد الناصر إلى الملكة زين تحمل في طياتها إدانة لدور الملكة في سياسة ابنها وكانت هذه الإشارات الناصرية تثير لدى المواطن الأردني العادي الذي كان آنذاك ممنوعا من الاستماع إلى إذاعة صوت العرب تساؤلات حول مدى وحقيقة نفوذ الملكة زين على ابنها الملك ... لكن أحدا لم يكن يجرؤ على طرح مثل هذه الأسئلة أو حتى مناقشتها ... والصورة الوحيدة التي كانت تنشر للملكة ألام زين في الصحف الأردنية هي صورتها وهي تضع الحجاب الذي كان يظهرها بوقار يتعارض أحيانامع ما كان يشاع عنها ... بل ويختلف عن صورها بلا حجاب التي كانت تنشر لها في الصحف الصادرة في أوروبا\\\" .* يضيف الزميل فوزي : \\\" قراري بالتوقف طويلا أمام دور النساء في العرش الهاشمي ليس في الأردن فحسب وانما في الحجاز وبعد ذلك في سوريا ثم العراق اتخذته بعد قراءة رسالة \\\" الإقالة \\\" و \\\" التوبيخ \\\" التي وجهها الملك حسين لاخيه وولي عهده الأمير حسن ... ففي هذه الرسالة المفتوحة التي نشرتها الصحف الأردنية وعرضها التلفزيون الأردني ندد الملك بدور الأمير في التشكيك بالملكة نور ... ثم ما نشر بعد ذلك من دور للأميرة ثروت زوجة الامير الحسن في تغيير ستائر القصر قبل موت الملك الأمر الذي فسر على انه بداية لتوريث العرش قبل الإعلان عن موت الملك \\\" .* يضيف الزميل فوزي : \\\" وجاء كتاب ماري ويلسون عن الملك عبدالله وعشيقته العبدة \\\" السوداء \\\" ناهدة التي أقام لها معسكرا في منطقة ماركا وسلمها إدارة أراضيه وتأجيرها للوكالة اليهودية ... ثم الإعلان عن خروج زوجة الملك فيصل ملك العراق وابن عم الملك حسين من السجن الأمريكي ... ثم صدور كتاب افي شاليم وعنوانه : collusion across the jordan والذي كشف فيه المؤلف وثائق صهيونية تؤكد أن الملك عبدالله تقاسم مع اليهود فلسطين بناء على اتفاقات سرية مسبقة ... كل ذلك جعلني اقرر كتابة تاريخ العائلة الهاشمية من خلال دور النساء في قصور الملوك والأمراء والأشراف \\\" لان النساء هن اللواتي كتبن تاريخ المنطقة سواء في الاردن او العراق .* يضيف الزميل فوزي : \\\" قررت أن ابدأ من الحجاز ... من قصور الشريف حسين الذي علمونا في المدارس انه بطل الثورة العربية الكبرى ... ثم الانتقال إلى قصور سوريا والعراق والأردن ... وكانت المهمة صعبة وشاقة بسبب ندرة وقلة المصادر التاريخية في هذا الموضوع \\\" .* كتاب الزميل أسامة فوزي يعتبر بحق أول محاولة من نوعها لكتابة تاريخ الحجاز والعراق وسوريا والأردن من خلال غرف نوم حكام هذه المنطقة من ملوك وملكات وامراء وأميرات يزعمون انهم أحفاد الرسول ... ومن يبدأ بقراءة كتاب الزميل أسامة لن يتمكن من التوقف عن القراءة ... فأسلوبه شيق ومثير ... والمعلومات التي يثيرها ويردها إلى مصادرها في الكتب أو المجلات أو الصحف كثيرة ... جمعها ضمن سرد تاريخي شيق يعتبر نوعا جديدا من كتابة التاريخ .* كتاب الزميل فوزي \\\" الهاشميون والنساء \\\" الذي يتضمن صورا تنشر لاول مرة لملكات واميرات وشريفات من العائلة الهاشمية سيثير الكثير من ردود الفعل ... وربما الكثير من \\\" وجع الرأس \\\" للمؤلف ... قلت لأسامة : هل لموقفك الشخصي وعدائك للنظام الاردني علاقة بما أوردته في هذا الكتاب ؟أجاب : ربما كان موقفي من النظام هو الحافز في انكبابي على ... لكن محصلة الكتاب قطعا ليس لها علاقة بموقفي من النظام لاني هنا مجرد مؤرخ لوقائع اعترف بها الهاشميون أنفسهم .* سألته : هل من أمثلة ؟أجاب : الأمثلة كثيرة ... ففي يونيو حزيران الماضي نشرت الأميرة بديعة بنت الملك علي بن الشريف حسين بن علي وهو أمير الحجاز ومفجر ما يسمى بالثورة العربية الكبرى وهي كما تعلم ابنة عم الملك حسين ملك الأردن ... أقول نشرت هذه الأميرة التي تعيش الآن في لندن وتبلغ من العمر 83 عاما وابنها الشريف علي يطالب حاليا بعرش العراق ... نشرت مذكراتها ... وفي هذه المذكرات قالت صراحة أن عمها الملك فيصل الأول ملك العراق كان سكيرا عربيدا ونسونجيا وان ابنته الأميرة عزة هربت مع عشيقها الطباخ اليوناني وان الملك غازي كان سكيرا متهورا وان أختها – زوجته عالية – اتهمت بأنها هي التي قتلته بالتعاون مع أخيها عبد الاله الذي اصبح وصيا على عرش العراق بل واعترفت بأن عمها الملك عبدالله جد الملك حسين كان يعاشر عبدة سوداء اسمها ناهدة وانه تزوج من عبدة أخرى انجب منها ابنه الأمير نايف ... مذكرات هذه الأميرة الهاشمية مليئة بالفضائح التي طالت جميع ملوك وامراء واميرات العائلة الهاشمية وما انشره في كتابي لا يصل إلى عشر البذاءات والفضائخ التي تعترف بها أميرة هاشمية لم تخجل في مذكراتها من التهجم على الفلسطينيين والتهجم على نصارى العراق ... وكيل المديح للعائلات العراقية اليهودية المقيمة في لندن ... وبعد ذلك يطالب ابنها بعرش العراق!! بل اكثر من هذا اعترفت الأميرة بان قصور ملوك وامراء الهاشميين في الحجاز والأردن والعراق وسوريا كانت تغص بالخصيان الذين يسمون \\\" اغوات \\\" وكان للخصيان سطوة على نساء القصور ؟ كتاب الزميل أسامة فوزي الذي سعدت بقراءة مسودته الأولى يجيب عن الأسئلة التالية :* ما حقيقة انحراف الشريف حسين بن علي بطل الثورة العربية الكبرى جنسيا وهل صحيح انه أقام علاقة جنسية آثمة مع الأميرة \\\" أسماء \\\" أخت زوجته الملكة \\\" عبدية \\\" التي ماتت من القهر عام 1877 بعد ان اكتشفت العلاقة الآثمة بين زوجها \\\" الشريف \\\" و \\\" أمير مكة \\\" ... وبين اختها ؟* كيف دخلت الأميرة الشركسية \\\" مديحة \\\" قصر الشريف حسين وبأي صفة ؟* من هي الملكة \\\" عديلة \\\" وما علاقتها بالأمير زيد بن رعد المقيم الآن في عمان والذي كان وزيرا للشباب والذي يطالب بعرش العراق ؟* لماذا اجبر الأمير عبدالله جد الملك حسين ابنة أخيه الأميرة \\\" عبدية \\\" على الزواج من رجل من عامة الشعب ؟* لماذا انتحرت الأميرة جليلة ابنة الملك علي حرقا وهي لم تتجاوز من العمر 33 سنة ؟* ما هو السر في إصابة أفراد العائلة الهاشمية بالجنون ... فالملك طلال كان مجنونا ... والأميرة جليلة التي انتحرت كانت مجنونة ... والأمير محمد شقيق الملك حسين عزل من ولاية العهد لانه مجنون ...الخ .* لماذا اجبر الشريف حسين شريف مكة ولديه فيصل وعبدالله على الزواج من أختين توأم هما الأميرتان \\\" حزيمة \\\" و \\\" مصباح \\\" ؟* هل تورطت الملكة \\\" حزيمة \\\" في قتل ابنها الملك غازي كما ذكر جمال عبد الناصر ... ولماذا ؟* هل كانت الملكة مصباح زوجة الملك عبدالله جد الملك حسين سببا في العداء الذي وقع بين زوجها عبدالله وابنه البكر منها طلال - والد الملك حسين - والذي انتهى بوضع طلال في مستشفى للمجانين في تركيا ؟ * لماذا حول الملك فيصل الأول ملك العراق قصر \\\" الحارثية \\\" في بغداد إلى قصر للتعريص والليالي الحمراء ؟* الحكاية الكاملة لفضيحة الأميرة \\\"عزة\\\" بنت الملك فيصل الأول وعشيقها اليوناني الذي كان طباخا في قصر والدها ولماذا هربت معه وكيف عادت إلى عمان لتعيش رغم الفضيحة في كنف الملك حسين وكيف ماتت عام 1960 ؟* ما وجه الشبه بين ما فعلته الأميرة عزة ابنة الملك فيصل الأول ... والأميرة هيا ابنة الملك حسين التي هربت مع عشيقها الإيطالي وتقيم الآن في باريس ؟* لماذا اجبروا الأميرة راجحة ابنة الملك فيصل الأول على الزواج من تاجر عراقي وليس من أمير ؟* لماذا اجبر الملك حسين الأمير غازي راكان ابن عم أمه الملكة زين و أحد كبار ضباط الجيش الأردني على الزواج من الأميرة نفيسة ؟* لماذا رفض الملك عبدالله جد الملك حسين تزويج ابنه طلال من الأميرة عالية ابنة الملك علي رغم أنها كانت تحبه وفرض عليها الزواج من الملك غازي بينما فرض على ابنه طلال الزواج من المصرية التركية زين التي أنجبت الملك حسين والتي ظلت تتحدث التركية حتى يوم وفاتها ؟* ما هو الدور الذي لعبته الأميرة صالحة بنت الحسين بن علي أمير الحجاز واخت الملك عبدالله جد الملك حسين ولماذا استقرت في عمان ؟* ما هو حقيقة البزنس التي كانت الأميرة نافعة أخت الملكة زين وخالة الملك حسين تديره في عمان ؟ * لماذا طلق الضابط تيمور غازي الداغستاني الأميرة بسمة شقيقة الملك حسين رغم انه انجب منها الأميرة فرح ولماذا تزوجت الأميرة بسمة من خالد الكردي الذي اصبح مليونيرا رغم أن أباه كان سائقا عند الملك طلال وهو بالمناسبة ابن عم اللواء عبد الإله الكردي أحد ابرز المتهمين بفضيحة مجد الشمايلة ؟* ما هو الدور الذي لعبته \\\" تمارا غازي الداغستاني \\\" شقيقة تيمور في تهريب احمد الجلبي بسيارتها إلى دمشق بعد فضيحة بنك البتراء ولماذا سجنها الملك حسين ؟ * من هي المذيعة اللبنانية التي تزوجت أحد الأشراف واصبحت وزيرة أردنية؟* كيف نجحت ليزا نجيب الحلبي في السيطرة على جهاز المخابرات ورئاسة الأركان من خلال العلاقة التي أقامتها مع جنرالين هما سميح البطيخي والكعابنة ؟* لماذا طرد الملك حسين الشريف محمد ابن الأميرة بديعة ابنة عم أبيه الملك علي من وظيفته في الجيش الأردني ؟* لماذا تزوج زيد بن شاكر من \\\" نوزت \\\" وما حقيقة القصر الذي تمتلكه نوزت جنوب فرنسا ولماذا أمر الملك عبدالله الثاني اعتقال ابنتها نسرين على هامش فضيحة مجد الشمايلة ؟* كيف تحول الشريف ناصر بن جميل خال الملك حسين من مجرد ضابط في الجيش العراقي إلى اكبر مهرب للحشيش في الأردن ؟* لماذا طلق الشريف فواز زوجته الأميرة نافعة أخت الشريف ناصر بن جميل والملكة زين أم الملك حسين ؟* كم مرة تزوج الملك فيصل الثاني ملك العراق وما حقيقة زواجه من كل من ملك فيضي و فائزة الطرابلسي وهيام الحبيب والأمريكية جنيفيف التي خرجت مؤخرا من أحد السجون الأمريكية بعد ان سجنت مع عشيقها ثلاث سنوات ؟* من يمتلك قصر ستانويل في لندن ؟* لماذا رفض الأمير زيد بن الحسين والد الأمير رعد وزير الشباب الأردني السابق التحدث باللغة العربية طوال مدة إقامته في الأردن والى يوم وفاته ولماذا كان يحتقر الأردنيين بشكل خاص والعرب بشكل عام ويقدم نفسه لزواره على انه أمير تركي ؟* ما هو نفوذ عمات الملك حسين الأميرتان \\\" مقبولة \\\" و \\\" منيرة \\\" في الجيش الأردني ؟ ولماذا كان لحابس المجالي حظوة عندهما ؟* من هي الأميرة صالحة بنت الحسين ؟ وما حقيقة الخلاف الذي وقع بينها وبين الشاعر عرار والد وصفي التل ؟* من قتل الملكة علياء بهاء الدين طوقان الزوجة الثالثة للملك حسين ولماذا ومن لفق لابنها علي تهمة تعاطي المخدرات لحرمانة من خلافة أبيه باعتباره الابن الوحيد من أم عربية ؟* لماذا حاول شريف مكة حسين بن علي إخفاء حقيقة أن أمه \\\" بزميجان \\\" شركسية ؟* من هي الملكة \\\" نفيسة \\\" وما حقيقة البزنس الذي كانت تمتلكه في شارع اوكسفورد في لندن ؟* من هي الأميرة الهاشمية \\\" خان زادة \\\" ؟* لماذا أصرت الأميرة \\\" فخرية \\\" على تطليق ابنتها الملكة \\\" دينا \\\" من الملك حسين ؟ ولماذا تزوجت الملكة دينا من صلاح التعمري أحد قادة حركة فتح ولماذا أنكرت الأميرة بديعة ابنة الملك علي في مذكراتها هذا الزواج وزعمت أن دينا متزوجة من صلاح صلاح أحد قادة الجبهة الشعبية وليس من صلاح التعمري أحد قادة فتح ؟* ما هو الدور الذي لعبته الجارية العبدة الصومالية \\\" فريدة \\\" التي كانت تعيش في قصر الزهور في بغداد ؟* كيف تستر عبد الإله الوصي على العرش في العراق على فضائح أخته الملكة عالية وابنها الملك فيصل في لندن ؟ * لماذا زوج الأمير زيد شقيقته لسفير العراق في باريس ؟* لماذا اتهمت الأميرة بديعة بنت الملك علي الحاج أمين الحسيني بالتآمر على العائلة المالكة في العراق ؟* هل قبضت الشريفة \\\" فخر النساء زيد الحسين \\\" أم الأمير رعد بن زيد وزير الشباب السابق في الأردن رشوة مقدارها خمسة عشر ألف دولار نظير شهادة زور في محكمة أمريكية لصالح جنيفيف جاكسون التي ادعت أنها كانت زوجة للملك فيصل ملك العراق ؟* لماذا رفضت أم كلثوم استقبال الأميرة عبدية بنت الملك علي رغم أنها صديقة حميمة لها ؟* من هي الملكة نفيسة ؟* لماذا اتهمت الملكة نور \\\" ليزا نجيب الحلبي \\\" الأميرة ثروت زوجة الأمير حسن بالتآمر عليها ؟* من زود عرب تايمز بصور الملكة رانيا زوجة عبدالله الثاني وهي بالبكيني – الصور وصلته بالبريد المسجل من لندن - ولماذا هدد محامي الملكة رانيا في نيويورك هدد عرب تايمز بالمقاضاة أمام المحاكم الأمريكية ؟* لماذا بعث الشريف علي بن الحسين الذي يطالب بعرش العراق ويقيم حاليا في لندن بأول بيان يصدره ضد صدام حسين للنشر في عرب تايمز وليس في صحف لندن العربية ؟* لماذا اجبر الملك حسين شقيقه الأمير محمد على تطليق زوجته الأولى الأميرة الفلسطينية فريال ارشيد ابنة جنين ... ولماذا فرض عليه الزواج من ابنة هزاع المجالي ؟* لماذا منع الملك حسين ابنته الأميرة عالية من رؤية أمها الملكة دينا ؟ ولماذا أمر بتغيير اسم شركة الطيران عالية إلى اسمها الجديد \\\" الملكية الأردنية \\\" ؟* كيف ماتت الأميرة هيا عمة الملك حسين ؟* ما هو الدور الذي لعبته الجارية التترية \\\" سزديل \\\" التي عاشرها الملك عبدالله جد الملك حسين وانجب منها أولاده الثلاثة الأمير نايف والأميرة مقبولة والاميرة منيرة ؟* لماذا تزوج الملك حسين من الإنجليزية اليهودية انطوانيت ابنة العقيد الإنجليزي توني غاردنر وغير اسمها إلى \\\" منى \\\" بعد أن أنجبت له عبدالله – الملك الحالي – وفيصل والتوأم زين وعائشة ؟ ولماذا طلقها ؟* من هي الجارية \\\" ماهيتاب \\\" ومن تزوجها وما أسماء الأميرات اللواتي أنجبتهن ؟* لماذا رفض محمد الخامس ملك المغرب تزويج ابنته الأميرة عائشة أخت الملك الحسن الثاني من الملك فيصل ؟ * لماذا يمتنع أمراء الأردن من الزواج من أردنيات ؟ ولماذا اتهمت الأميرة بديعة ابنة الملك علي في مذكراتها نساء واميرات وملكات الأردن بأنهن لا يتحدثن في قصورهن إلا باللغة الإنجليزية ؟ قد تكون هناك منعطفات كثيرة في تاريخ الحجاز والأردن والعراق وسوريا غير مفهومة وغير مبررة للباحثين والسياسيين ... لكن من يقرأ كتاب الزميل أسامة فوزي عن دور النساء في هذه القصور وبالتالي تأثيراتهم على هذه الأحداث سيفهم الكثير من الأحداث ... ويحل الكثير من الألغاز .الكتاب في مسودته الأخيرة التي اطلعت عليها اصبح جاهزا للنشر ... لكن الزميل فوزي يقول انه ليس في عجلة من أمره وان هناك عدة فصول جديدة يشتغل عليها وانه يتوقع ان يطبع الكتاب في لندن في تموز يوليو القادم حيث تغص لندن بالعرب الباحثين عن المتعة والتسلية .... والممنوعات ... وهذا الكتاب قطعا سيكون من الممنوعات العربية التي لن يسمح بتداولها في أي قطر عربي لاسباب لا داعي لذكرها الآن .أما لماذا سمح لي الزميل الاطلاع على مسودة الكتاب ... بل والكتابة عنها رغم أن هذا قد يحرق الموضوع عليه كما قال له زميل ثالث فأمر لم افهمه إلا قبل يومين حين أطلعته على مسودة هذا المقال ... فالزميل فوزي كما قال لي يرغب بإعطاء فرصة للراغبين بتمويل طبع الكتاب أو تحمل نفقات نشره المبادرة إلى الاتصال به ... والسبب كما يقول أن سعر الكتاب سيكون فيما لو تولت نشره دور النشر اللندنية مرتفعا ... وهو كما يقول يرغب بطرح كتابه في الأسواق مجانا أو بسعر رمزي حتى يكون بإمكان الجميع الحصول على نسخ منه .أما لماذا اختار الزميل صور الملكة رانيا لتكون موضوعا للغلاف رغم أن ما كتبه عنها لا يزيد عن صفحتين فقد اخبرني أن اختيار الصور قد تم لاسباب فنية تتعلق بالإخراج لا اكثر ولا اقل وهو تبرير بصراحة لم يقنعني كثيرا ."
