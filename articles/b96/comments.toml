text = "رب اغفر لي ولوالدي رب ارحمهما كما ربياني صغيرا<br />عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا، أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: \"الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرُبَاتِ يَوْمِ الْقِيَامَةِ وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ يَوْمَ الْقِيَامَةِ\". أخرجه أحمد (2/91 ، رقم 5646) ، والبخاري (2/862 ، رقم 2310) ، ومسلم (4/1996 ، رقم 2580) ، وأبو داود (4/273 ، رقم 4893) ، والترمذي (4/34 ، رقم 1426) وقال : حسن صحيح غريب . والنسائي فى الكبرى (4/309 ، رقم 7291) ، وابن حبان (2/291 ، رقم 533) . وأخرجه أيضًا : القضاعي (1/132 ، رقم 169) ، والبيهقي (6/201 ، رقم 11908). قال الإمام النووي في شرح صحيح مسلم: قَوْله : (لَا يَظْلِمُهُ) هُوَ خَبَرٌ بِمَعْنَى الْأَمْرِ فَإِنَّ ظُلْم الْمُسْلِمِ لِلْمُسْلِمِ حَرَام, وَقَوْله : \"وَلَا يُسْلِمُهُ\" أَيْ لَا يَتْرُكُهُ مَعَ مَنْ يُؤْذِيه وَلَا فِيمَا يُؤْذِيه, بَلْ يَنْصُرُهُ وَيَدْفَعُ عَنْهُ, وَهَذَا أَخَصّ مِنْ تَرْك الظُّلْم وَفِي الْحَدِيثِ حَضّ عَلَى التَّعَاوُنِ وَحُسْن التَّعَاشُر وَالْأُلْفَة, وَفِيهِ أَنَّ الْمُجَازَاةَ تَقَعُ مِنْ جِنْس الطَّاعَات. انتهى كلامه رحمه الله، ولقد أدرك ابن عباس فضل قضاء الحوائج فترك اعتكافه في المسجد ليمشي في حاجة أخ له، ويذكر ابن رجب عن بعض السلف فيقول: كان أبو وائل يطوف على نساء الحي وعجائزهن كل يوم فيشتري لهن حوائجهن وما يصلحهن. وقال مجاهد: صحبت ابن عمر في السفر لأخدمه فكان يخدمني. وكان كثير من الصالحين يشترط على أصحابه أن يخدمهم في السفر.<br />جديد الموقع: يمكنكم الآن مشاركتنا بأجر الأحاديث ومن يعمل بها كاملا إلى يوم القيامة عبر التبرع للموقع في \"الوقف الخيري الالكتروني، للراغبين زيارة صفحة الوقف:<br />من لم تدمع عينه لسماع القرآن بعد فليستمع إلى هذه التلاوة العذبة بصوت الشيخ عبد الله البريمي<br />تلاوة عذبة ونادرة جدا ومبكية من سورة الروم لفضيلة الشيخ أبي إسحاق الحويني<br />انشرها ولك أجرها وأجر من عمل بها إلى يوم القيامة إن شاء الله..<br />رسالتنا: يصل الكثير من الناس بعض الرسائل الالكترونية عن الإسلام ويقومون بحذفها أو تجاهلها بحجة أنها طويلة ويثقل عليهم قراءتها. لذلك خصّصنا هذه الصفحة للاشتراك في عظة يومية قصيرة أو حديث شريف أو آية تصل إلى بريد المشترك بحيث لن يصعب قراءتها والاستفادة منها راجيا من المولى عز وجل الأجر والثواب.قال رسول الله صلى الله عليه وسلم: \"من سنّ في الإسلام سنة حسنة، فعمل بها بعده، كتب له مثل أجر من عمل بها. ولا ينقص من أجورهم شيء... الحديث. فاحرصوا يرحمكم الله على نشرها فكل من يزور الموقع ويستفيد منه عن طريقك تكسب من الأجر الكثير وإن قام بدوره بالعمل بها ونشرها أيضا فكلنا نكسب أمثل أجورهم ولا ينقص من ال<br />لإلغاء الإشتراك، أرسل رسالة فارغة إلى:"
