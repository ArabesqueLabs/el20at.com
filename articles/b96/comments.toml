[[comments]]
order = 307
subject = "وصايا لقمان الى ابنه"
author = "زعيم غرب كفرنجه"
posted = "2008-05-10"
text = "يا بنى : إتخذ تقوى الله تعالى تجارة يأتيك الربح من غير بضاعة<br />يا بنى : احضر الجنائز ولا تحضر العرس فإن الجنائز تذكرك الآخرة والعرس يشهيك الدنيا<br />يا بنى : لا تكن اعجز من هذا الديك الذى يصوت بالأسحار وأنت نائم على فراشك<br />يا بنى : لا تؤخر التوبة فإن الموت يأتى بغتة<br />يا بنى : لا ترغب فى ود الجاهل فيرى أنك ترضى عمله<br />يا بنى : اتق الله ولا ترى الناس أنك تخشاه ليكرموك بذلك وقلبك فاجر<br />يا بنى : ما ندمت على الصمت قط فإن الكلام إذا كان من فضة كان السكوت من ذهب<br />يا بنى : اعتزل الشر يعتزلك فإن الشر خلق<br />يا بنى : عليك بمجالس العلماء واستمع كلام الحكماء فإن الله يحيى القلب الميت بنور الحكمة<br />كما يحيى الأرض بوابل المطر وإياك والكذب وسوء الخلق فإن من كذب<br />ذهب ماء وجهه ومن ساء خلقه كثر غمه<br />ونقل الصخور من موضعها أيسر من إفهام من لا يفهم<br />يا بنى : لا ترسل رسولك جاهلا فإن لم يكن حكيما فكن رسول نفسك<br />يا بنى : يأتى على الناس زمان لا تقر فيه على حليم<br />يا بنى : اختبر المجالس على عينك فإن رأيت المجلس يذكر فيه الله عز وجل فاجلس معهم<br />فإن تكن عالما يزداد علمك وان تكن غبيا يعلموك وان يطلع الله عز وجل عليهم برحمه تصبك منهم<br />يا بنى : لا تجلس فى المجلس الذى لا يذكر فيه الله عز وجل فإنك إن تكن عالما<br />لا ينفعك علمك وإن تكن غبيا يزيدك غباء وان يطلع الله عليهم<br />بعد ذلك بسخط يصبك معهم<br />يا بنى : لا يأكل طعامك إلا الأتقياء وشاور فى أمرك العلماء<br />يا بنى : إن الدنيا بحر عميق وقد غرق فيه الناس كثيرا فإجعل سفينتك فيها تقوى الله وحشوها الإيمان<br />به وشراعها التوكل على الله لعلك تنجو<br />يا بنى : إن حملت الجندل والحديد فلم تجد شيئا أثقل من جار السوء<br />وذقت المرارة كلها فلم أذق اشد من الفقر<br />يا بنى : إن الحكمة أجلست المساكين مجالس الملوك<br />يا بنى : لا تتعلم ما لا تعلم حتى تعمل بما تعلم<br />يا بنى : إذا أردت تؤاخى رجلا فأغضبه قبل ذلك فإن أنصفك عند غضبه وإلا فأحذره<br />يا بنى : إنك منذ نزلت الى الدنيا استدبرتها واستقبلت الآخرة<br />فدار أنت إليها تسير اقرب من دار أنت عنها ترتحل<br />يا بنى : عود لسانك إن يقول :اللهم اغفر لى فإن لله ساعات لا ترد<br />يا بنى : إيالك والدين فإنه ذل بالنهار بالليل ‏"
