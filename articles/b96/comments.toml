subject = "فضائح في القصر الملكي الاردني"
author = "صالح النعيرات - جنين"
posted = "2008-06-07"
text = "فوزى<br />..فلسطينيو الاردن سفلة كانوا يسرقون ويغتصبون ويرتكبون الجرائم وينشرون الفوضى في المدن الاردنية وهو السبب الذي دفع الملك حسين الى قتالهم وحربهم في ايلول \" و\" الجيش الاردني هو الذي خاض معركة الكرامة وانتصر بها لكن عرفات وجماعته سرقوا النصر ونسبوه لانفسهم \" .<br />هذه فقط عينة مما ورد في كتاب يوزع اليوم على نطاق واسع في الولايات المتحدة ومؤلفته ليست يهودية او صهيونية ولا تعمل في المخابرات الاسرائيلية مثلا ولا هي طابور خامس يهمها تشويه صورة الشعب الفلسطيني وقضيته العادلة ... وانما هي ببساطة \" الملكة نور \" وهو الاسم الحركي الذي اطلقه الملك حسين على مهندسة امريكية اسمها \" ليزا \" دخلت قصره كعشيقة قبل ان يتورط الملك بالزواج منها فتتورط في كل الفضائح التي عرفناها عن القصر الملكي وتكون السبب المباشر مع صديقها سميح البطيخي في الانقلاب الذي وقع داخل القصر قبل موت الملك حسين بأيام ... لتنتهي \" مؤرخة \" للاردنيين تكتب عن عاداتهم وتقاليدهم وتفضح اسرارهم وتنهش في اعراضهم دون ان تعرف كلمة واحدة باللغة العربية...<br />ما فعلته وتفعله المذكورة يعتبر وفقا للقانون الاردني اساءة للوحدة الوطنية وهي جريمة يعاقب عليها بالسجن خمس سنوات ... لكن \" ليزا \" لن تدخل السجن ولو لساعة واحدة ... لا بل ان من يتجرأ من الاردنيين مثلا ان ينتقد كتابها المسخرة سوف يدخل السجن ثلاث سنوات لان عمله يعتبر \" تطاولا على الذات الملكية \" وهي التهمة التي الصقت بالزعيم السياسي الاردني البارز ليث شبيلات الذي انتقد فيما نقد بكاء \" ليزا \" الحار في جنازة رابين ناسية او متناسية انها زوجة لملك عربي \" هاشمي \" احتل رابين ولا يزال نصف مملكته وقتل الاف الاردنيين ولا يزال يعتقل المئات منهم .... نور وزوجها بكيا وذرفا الدموع وانتحبا في الجنازة اكثر من زوجة رابين نفسها .<br />الكتاب صدر باللغة الانجليزية بعنوان \" Leapof Faith\" والترجمة بالعربية قد تكون \" قفزة عقيدة \" أو \" نفحة ايمان \" وهي الترجمة التي اختارتها جريدة الحياة اللندنية التي نشرت فصولا من المذكرات ونطت عن الكثير من الفضائح الواردة فيها .<br />يقع الكتاب في 467 صفحة وتجده معروضا للبيع هذه الايام في المطارات والمكتبات والاكشاك في طول امريكا وعرضها وهو ما لم يتوفر حتى لكتب مسئولين وصحفيين امريكيين كبارا مما يشير الى ان هناك جهة ما - غير دار النشر - دعمت هذا الكتاب ولها مصلحة في توزيعه على نطاق واسع بين الامريكيين ... بخاصة في هذا الوقت بالذات الذي تتعرض فيه القضية الفلسطينية الى مفترق طرق ... وتتكالب المصائب على الامة العربية .<br />لن تجد الكثير في المقدمة عن سيرة الملكة نور الشخصية اللهم الا اشارتها الى ان قاريء فنجان بشرها بأنها ستتزوج من عربي ارستقراطي ... هذه \" القدرية \" تتكرر كثيرا في كتابها ربما لتفسر الكثير من الاحداث او تبررها ... فهي اصبحت زوجة لملك عربي ليس لانها \" دست \" الى غرفة نومه من خلال \" علي غندور \" المتخصص بهذه القضايا وانما لان قاريء فنجان بشرها بذلك !!<br />ليزا تزوجت الملك وهي في السادسة والعشرين من العمر وكان يكبرها بستة عشر عاما ... هذه الى 26 سنة لا تكاد تجد لها ذكرا في الكتاب الذي يفترض انه \" مذكرات \" وادب المذكرات له اصوله طبعا ... ومع ذلك اشارت نور من بعيد الى احدى اهم المرويات عنها في الشارع الاردني بعد الاعلان عن زواجها من الملك وهي حكاية علاقتها بمحام امريكي افريقي وانجابها ولدا \" اسود \" منه ... وهو ما اوردته من ضمن مجموعة \" اشاعات \" قالت انها اطلقت عليها من قبل خصومها !! المهم ان نور لم تؤكد في كتابها انها كانت \" بنت بنوت \" ولا اظنها ستقنع احدا انها كفتاة امريكية بلغت سن السادسة والعشرين دون ان يكون لها \" بوي فرند \" !!<br />تعترف \" ليزا \" انها التحقت بالعمل في شركة عالية للطيران كمهندسة وكان ابوها نجيب الحلبي قد عين كمستشار لهذه الشركة بعد طرده من رئاسة شركة \" بان امريكان \" بعد اتهامه بالفساد والتسبب بانهيار الشركة ماليا ... ومن خلال صديقه علي غندور تمكن الحلبي الذي مات مؤخرا في واشنطن من زرع ابنته في قصر الملك ... نور تعترف ان \" الاشاعات \" ذكرت ان ام الملك زين قتلت زوجة الملك الفلسطينية \" علياء \" وان زرع فتاة امريكية كزوجة في القصر كان مخططا امريكيا الا انها تنفي هذا الاتهام بروايات عن علاقات حب صامتة ربطت الملك بها الى ان قال لها يوما \" انا مش قادر اتحمل ... اريد التحدث مع ابيك \" ... ثم تقول ان الملك وقع في غرامها عندما نظر في عيينيها لاول مرة الى اخر هذه المرويات التي تريد \" ليزا \" ان تضحك بها علينا لتبرر دخولها المشبوه الى القصر ناسية فيما يبدو ان الملك الذي تتحدث عنه ليس \" مراهقا \" وانه \" نسونجي \"معروف دوب قبلها ثلاث زوجات وعشرات العشيقات منذ ان كان طالبا في مدرسة \" هارو\" في لندن الى ان اصبح ملكا يبدل العشيقات اللواتي يوظفهن علي غندور في شركة عالية للطيران كما يبدل جواربه .... الملك حسين ليس من النوع الذي يحب من اول نظره<br />الامر الذي لم توضحه \" ليزا \" في كتابها هو السر في دخولها الى قصر الملك ومعاشرتها له ومخالطتها لاولاده الصغار ... فهي كما تقول مهندسة معمارية ولكن مروياتها تؤكد انها كانت تعمل \" بيبي ستر \" للملك واولاده وانها كانت تعيش مع الملك في قصره وتعد طعام الافطار له ولاولاده الخ .... الذي لا تعرفه \" ليزا \" هو ان علاقتها غير الشرعية بالملك كانت معروفة انذاك لرجل الشارع الاردني ... وان الملك اضطر الى اعلان الزواج بها للخروج من هذا الحرج ... فهو كملك عربي مسلم يزعم ان النبي( محمد)(صلى الله عليه وسلم ) هو جده لا يستطيع ان يتخذ \" جيرل فرند \" على هذا النحو .. وكان الامير حسن ولي العهد.هو..<br />اول من لفت نظر الملك الى هذه المسالة ... ولعل هذه تكون اول مواجهة او بداية للمواجهات فيما بعد بين \" نور \" و \" والحسن ؟ وهي المواجهات التي انتهت بطرد الحسن من ولاية العهد بمعاونة قوادين لنور هما قائد الجيش \" عبد الحافظ الكعابنة \" ورئيس المخابرات \" سميح البطيخي \" الذي كانت زوجته الانجليزية \" جيل \" تعمل كوصيفة لنور .... الطريف انك لن تجد في كتاب نور اية تفصيلات عن علاقتها بالبطيخي ربما لان الاعلان عن تورط البطيخي بسرقة ثلاثة بنوك اردنية قد تم في الوقت نفسه الذي دفعت فيه نور بكتابها الى النشر الامر الذي وفر لها - كما يقال - الوقت الكافي لحذف فصل كامل كان مكتوبا عن البطيخي وكرمه وحسن سيرته وولاءه واخلاقه العالية وفضله عليها وعلى اولادها .....الخ .... كما انك لن تجد اشارة واحدة الى الفريق عبد الحافظ الكعابنة الذي لعب دورا في عزل الامير حسن لان هذا ايضا تورط بفضيحة بيع اسلحة الكلاشنكوف الفلسطينية الى تجار المخدرات في كولومبيا؛؛<br />تعترف \" ليزا \" انها رأت الملك وزوجته الملكة علياء اول مرة في المطار حين طلب منها ابوها ان تلتقط له صورة مع الملك والملكة ... ثم تحاول ان توهم القراء انها كانت تعيش حياة عادية بعيدا عن القصر.. وتوحي للقاريء انها هي التي ربت اولاد الملكة الراحلة علياء علي وهيا مع ان الشارع الاردني يعلم ان نور هي التي اتهمت بتوريط الامير علي بقصص لها علاقة بتعاطي المخدرات حتى تحرمه من ولاية العهد لانه اكبر ابناء الملك من ام عربية مسلمة... وانتهى الامر بعلي ان اصبح مجرد \" بودي غارد \" لاخيه عبدالله مع انه وفقا للدستور الاحق بالعرش .<br />اعتراف الملكة بعلاقتها وصداقتها برامي خوري - الشاب الاردني الاصل الذي يحمل الجنسية الامريكية - فسر لي \" لغزا \" طالما ورد على خاطري .... ففي مطلع التسعينات نشر رامي خوري في جريدته \" جوردان تايمز \" مقالا تحدث فيه عن مرض الملك حسين وعن ضرورة التساؤل عن مستقبل المملكة في ظل غياب مفاجيء للملك ... كان المقال مثيرا للتساؤل فعلا بخاصة وان الملك لم يكن يومها مصابا بالسرطان او لعله اخفى المرض عن الناس والصحافي لم يعتقل او يطرد من عمله بسبب هذا المقال حتى بعد ان ردت عليه ابنة الملك \" عالية \" من زوجته الاولى \" دينا \" واعتبرت مقاله غير لائق ... هذا التحرش بالامير حسن وولاية العهد تجد له ذكرا في صفحة رقم 417 من الكتاب ... ففي هذه الصفحات تزعم نور ان الملك واثناء تلقيه العلاج في مايو كلينك اطلع على مقال نشرته نيويورك تايمز مؤكدة انها حاولت حجب الجريدة عن الملك وان شخصا ما مررها اليه وان الملك غضب كثيرا مما ورد في مقال الجريدة<br />.... الجريدة نشرت لقاء مع الامير حسن تحت عنوان \" الملك يموت والامير حسن ينتظر \" وجاء فيه كلاما منسوبا الى الحسن ان اخاه الملك حسين هو رمز ... اما هو - اي الحسن - فهو الاقرب الى المطبخ اي انه هو الذي يدير شئون البلد واكد وزير الاعلام ناصر جودة الذي هو زوج لابنة الحسن هذا الكلام الامر الذي دفع الملك الى التحدث عن هذا الامر في التلفزيون الاردني .<br />بعد ان تفرش \" ليزا \" لكتابها بمقدمات من هذا النوع ... تبدأ بالتمهيد للتهجم على الفلسطينيين في الاردن ... ففي صفحة 54 وما بعدها تتحدث \" نور \" عن مدينة عمان قبل عام 1948 وكيف انها كانت مدينة جميلة تقع على سبعة تلال يتوسطها القصر ... الى ان جاء الفلسطينيون فبنوا العشوائيات بلا نظام فخربوا شكل المدينة وجمالها ... وتضيف ان الملك صاحب القلب الرحيم كما تصفه سمح لهم ببناء هذه البيوت التي غطت جمال القصر والمدرج الروماني الذي يطل عليه .... وحتى تكتمل الصورة الميلودرامية تزعم نور ان القصر تعرض لقصف بالصواريخ خلال مجازر ايلول وانه تبين ان طباخ الملك وهو فلسطيني كان يعطي احداثيات المكان للجهة التي تقصف القصر .<br />يبدو ان نور لم تقرأ لا كتب التاريخ ولا كتب الجغرافيا وبعضها صدر عن محافظة عمان ... وكلها تعترف بأن عمان لم تكن قبل عام 48 اكثر من قرية تنتشر على ضفاف \" سيلها \" خيم البدو وبعض البيوت العشوائية للشركس ... ولم تتحول عمان الى مدينة الا بوصول الفلسطينيين اليها فهم الذين بنوا عمان ... ومعظم قصور المدينة وفللها مملوكة لعائلات فلسطينية فكيف \" خرب \" هؤلاء المدينة الجميلة التي تتحدث عنها \" نور \" وعن اي قصر تتحدث ... الملك عبدالله نفسه - مؤسس الامارة - كان يسكن مع عشيقته \" ناهده \" في مخيم قرب قرية \" ماركا \" الى ان بنى له مهندس فلسطيني قصر بسمان.<br />و..يبدو ان الحديث عن معركة الكرامة ... وكيف ان الفلسطينيين سرقوا النصر من زوجها الملك اريد به ان يمهد لما هو اهم في كتابها وهو الحديث عن الوضع في الاردن قبل مجازر ايلول ... وفي هذا المجال لم تترك الملكة جريمة سرقة او قتل او اغتصاب الا ونسبتها الى الفلسطينيين مبررة بذلك للمجزرة التي ارتكبت بحقهم فيما بعد .... ومرة اخرى تتجاهل الملكة ما كشف عنه لاحقا من ان معظم جرائم السرقة وقطع الطرق والاعتداء على الجنود كانت تقوم بها عناصر من المخابرات الاردنية بقصد تاليب رجل الشارع على الوجود الفدائي بخاصة بعد التعاطف الكاسح مع الفدائيين عقب معركة الكرامة .<br />... فدور الملك حسين في هزيمة حزيران يونيو بدأت تكشفه الوثائق ومنها مثلا تهريبه لطائرات الفانتوم الاردنية الى تركيا حتى لا يستخدمها عبد الناصر مع ان الملك دخل قبل ايام من الحرب في اتفاقية دفاع عسكري مع مصر بل وسلم قيادة الجيش لجنرال مصري هو الشهيد عبد المنعم رياض الذي استشهد بعد ذلك في معارك الاستنزاف ... كما ان الوثائق الاسرائيلية كشفت عن العلاقات والاتصالات السرية التي تمت مع الملك قبل الحرب ... ونشرت من قبل فى الصحف جانبا من الاعترافات التي ادلى بها المقدم غازي ربابعة قائد الكتيبة الاردنية في القدس والتي اعترف بها انه وجنوده لم يقاتلوا وانهم غيروا ملابسهم بملابس مدنية وهربوا من القدس بعد ان دفنوا اسلحتهم في بيت مهجور لتحتل اسرائيل الضفة الغربية كلها دون قتال .<br />ليزا ... في صفحة 72 وما بعدها من الكتاب تستحمر القراء ... فتروي لنا ان الملك ذهب بنفسه خلال الحرب الى النهر للاشراف على القتال ... وتضيف ان غيمة سوداء ظهرت في السماء فوق الملك لتغطي تحركاته عن اعين الطائرات الاسرائيلية ... وظلت الغيمة تسير فوق الملك الى ان وصل الىالجبهة ... ثم عادت معه الى قصره في عمان قبل ان تختفي !!<br />بهذا الاسلوب الساذج تحاول \" ليزا \" ان تختصر هزيمة حزيران يونيو ونجاة الملك من القتل ليس لانه لم يكن يوما من الايام على قائمة المطلوب قتلهم اسرائيليا لانه عميل لهم وانما لان ربنا خبأ الملك تحت غيمة سوداء !!<br />يبدو ان \" ليزا \" سمعت بحكاية الغيمة التي ظللت الرسول عليه السلام فحورت القصة ونسبتها الى الملك استحمارا لعقلية القاريء ... ثم حتى تذكرنا بين فقرة واخرى ان زوجها هو حفيد النبي بل وتنشر صورة لها ولابنتها وهي في لباس الاحرام ... بل وتقول ان المطر لم ينزل في عمان الا في يوم عودة الملك من مايو كلينك .<br />اعتبارا من صفحة 92 من كتابها ... تبدأ الملكة \" ليزا \" بضرب العرب تحت الحزام ... ففي هذه الصفحات تتحدث عن محاولات الاغتيال التي تعرض لها الملك ... فتتهم المصريين في اكثر من موقع ... ثم تقول ان معمر القذافي طلب من الرئيس حافظ الاسد اسقاط طائرة الملك بصاروخ ارض جو ودفع مقابل ذلك ملايين الدولارات.... اما محاولات الاغتيال بالرصاص التي تعرض لها الملك مرتين وهو بصحبة خاله الشريف ناصر بن جميل فالذي لا تعرفه الملكة فيما يبدو ان الشريف ناصر هو الذي كان مستهدفا من العمليتين وان الذين اطلقوا عليه النار هم شركاء له في تجارة المخدرات لان الشريف الملقب بين الاردنيين باسم \" ابو شوال حز احمر \" كان مشهورا عنه انه اهم واكبر مهرب مخدرات في المملكة..<br />في صفحة( 118 )تعترف \" ليزا \" بالعلاقات السرية التي ربطت الملك باسرائيل وتحاول الايهام ان هذه العلاقات بدأت بسبب التواجد الفلسطيني غير الشرعي والمكثف في عمان!!<br />ما كتبته \" ليزا \" عن مجزرة ايلول يعتبر بحق مسخرة المساخر ... وتبسيطها للاحداث وتصويرها لزوجها الملك بانه كان ضحية تطاول الفلسطينيين عليه ... وتجاهلها لعدة الاف من الضحايا سقطوا في المخيمات والشوارع والاحياء الفقيرة برصاص الجيش عدا عن عمليات القتل بالبلطات التي تمت في مستشفى البشير وعمليات الاغتصاب والقتل في مدينة الزرقاء ومخيمها ... هذه صور لم ترها الملكة نور التي اكتفت بمرويات الامير علي ابن نايف والشريف زيد بن شاكر والاميرة وجدان ... هؤلاء هم شهودها على ما وقع في ايلول ... ومنها مثلا ان عرفات انذر الملك 24 ساعة لمغادرة الاردن ... وان الملك القى القبض فعلا على ياسر عرفات خلال معارك ايلول ولكنه اطلق سراحه لانه - اي الملك - رحيم القلب ... وان عدة قادة فلسطينيين وقعوا في الاسر واحضروا الى الملك فارتموا على رجليه وقبلوها فاعفى الملك عنهم الى اخر هذه القصص والحكايات التي فبركتها خيالات الملكة نور والتي لا تجد لها اي ذكر في اية وثيقة اردنية بخاصة القول ان عرفات وقع في اسر الملك خلال مجازر ايلول وان الملك اعفى عنه مع ان اي \" حمار \" قرأ وقائع ما جرى انذاك يعلم كيف خرج عرفات من عمان في طائرة( النميري) بعد ان تخفى بدشداشة كويتية .... \" ؟<br />يبدو ان واضع الكتاب للملكة نور كاتب سيناريو لافلام هوليوود لان الملكة تنط في كتابها من لقطة الى لقطة غير مرتبطة بها ... فبعد اسطر فقط من حديثها عن مجرزة ايلول وكيف تدخل الجيش السوري ... نطت الملكة - في صفحة 124 - الى لندن حيث زارت مع زوجها واولادها قصر \" ام قابوس \" الفخم الذي يطل على نهر التايمز والذي تصيف به ام قابوس التي استقبلتها وهي تضع الكثير من الحلي الذهبية وذكرت الملكة جانبا من اوصاف \" أم قابوس \" وكيف انها كانت تسأل عن اسماء اولاد الملك واحدا واحدا وكيف وزعت عليهم الهدايا وكيف انها تحدثت معهم بالشأن السياسي والشأن العام الى اخر هذا المديح لام قابوس فيما بعد من ... وكانت \" القصة \" ستكون اكثر تشويقا لو روت لنا الملكة نور حكاية قابوس والاميرة عالية التي رفضت الزواج منه..!.<br />الحديث عن قابوس وامه تجده في مكانين ... ففي صفحة رقم 124 كتبت عن زيارتها الاولى لقصر ام قابوس في لندن ... ولكنها وفي صفحة رقم 242 تطنب الحديث عن ام قابوس بشكل لافت للنظر ربما لان قابوس يأتي من ضمن القادة العرب الذي كانوا يسددون الفواتير الشخصية للملكة نور كما تعترف هي صراحة بل وتؤكد انها وزوجها كانوا \" عالة \" على الحكام العرب .<br />ومع ان \" ليزا \" تشتم معظم الحكام العرب وتحقرهم وتسخر منهم الا انها تكتب عن قابوس باعجاب شديد ... في حين تتهجم على والده السلطان سعيد ويبدو انها استقت المعلومات من زوجته \" ام قابوس \" التي لعبت دورا مشابها للدور الذي لعبته الملكة زين ام حسين ... اي اسقاط الزوج بالتعاون مع الانجليز لصالح الابن البكر ... واذا كانت الملكة زين قد اسقطت زوجها طلال بحجة انه مريض عقليا وحبسته الى يوم وفاته في مستشفى للمجانين في تركيا ... فان \" ام قابوس \" اسقطت زوجها سعيد بحجة انه بخيل وانه حجب سلطنة عمان عن العالم رغم ثراء البلاد<br />ليزا تزعم ان السلطان سعيد وضع ابنه قابوس قيد الاقامة الجبرية لمدة ست سنوات كاملة قبل نجاح قابوس في الانقلاب على ابيه ونفيه الى الخارج ... ومن الواضح ان هذه المعلومات مستقاة من \" أم قابوس \" التي تقول الملكة نور في مذكراتها انها فعليا هي التي تحكم في سلطنة عمان .... ثم تضيف ان اخت قابوس - بعد موت امه - هي التي تحكم البلاد وتشير اليها صراحة في صفحة رقم 408 والاميرة العمانية اسمها \" امية بنت سعيد \" ... وتكشف ليزا جانبا غير معروف من حياة قابوس وهي ان السلطان يعزف الاورغ !! لكنها لا تتطرق الى طلاقه من ابنة عمه ... ولا الى بقاءه عازبا .حتى الان.. ولا الى الاشاعات عن شذوذه الجنسي ... وهي معلومات معروفة..للعامة...<br />ليزا جعلت الحديث عن قوة وسطوة \" أم قابوس \" مدخلا للحديث عن الدور الهام الذي تلعبه النساء في القصور العربية وتقول ان هذا الجانب غير معروف للاجانب خارج البلاد العربية لان النساء لا يظهرن الى الجمهور وفي الحياة العامة..<br />بل وليزا نفسها لعبت دورا بارزا في تغيير خريطة الحكم في الاردن وضمنت لابنها ولاية العهد بعد ان خوزقت عمه.<br />تعترف الملكة نور ان ام قابوس اغرقتها هي وزوجها بالهدايا ولكن من الواضح انها لم تخصص كل هذه الصفحات عن ام قابوس بسبب هداياها او بسبب قوة شخصيتها وانما بسبب دور قابوس في تغطية المصاريف الشخصية للملكة نور حيث يقول الاردنيون ان فواتير الملكة من مشترواتها في باريس تذهب مباشرة الى الديوان السلطاني وتسدد من حسابات \" ام قابوس \" بخاصة بعد ان هاجمت الصحف الكويتية الملكة نور ... وظهرت جريدة السياسة بعد حرب الخليج بمانشيت كبير يقول : الملك يتسول والملكة تتسوق ... ويبدو ان عدم تطرق الملكة لشيوخ الكويت ونسوانهم ارتبط ايضا بالسبب نفسه الذي جعلها تغير في كتابها او تحذف فقرات او صفحات عن البطيخي ... اي انها حاولت مراعاة تطور الاحداث في القصر الملكي قبل صدور الكتاب ... وكان الملك عبدالله قد حرص وتحت ضغط زوجته رانيا المولودة في الكويت ان يعيد العلاقات مع الكويتيين حتى ان رانيا وبعد اول زيارة لها الى الكويت كملكة قالت للصحف الكويتية :\" انا كويتية \" .<br />صحيح ان الملكة نور تركز في طيات كتابها على انها فقيرة الحال وان زوجها كان يعيش على تبرعات القادة العرب الا انها تنسى احيانا هذا الامر فتصف لنا جانبا من حياة البذخ التي تعيشها مع زوجها الذي ينفق الملايين من اموال الشعب الاردني على مناسبات لا علاقة للشعب الاردني بها..."
