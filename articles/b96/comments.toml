subject = "تعليق على كلام المخنثيين الأردنيين"
author = "أحمد عبد الكريم عرفات العبادي"
posted = "2008-08-05"
text = "قبل ما تحكوا انه الفلسطينية انهم هم يلي باعوا ارضهم<br />اسألوا ملككم مين باع اللد والرملة واللي لهلا عم يساومو كانها ارض يلي خلفوا وخلف ابوه<br />وقبل ما تسيروا ترمو حكي على الفلسطينين روحو شوف بيوت الدعارة يلي منتشرة عندكم<br />طبعا كل فلسطيني لازم يوصل للاردن لازم يتفتش كانه شايفينه ارهابي اما لما يوصل يهودي متل اشكالكم بتبوسوا رجليه<br />وبعدين تعال هون يا عسل بتقول احنا اتهجرنا عن ارضنا برغبتنا<br />وين كان جيشكم ايام ال48 وايام ال67<br />اعملتوا انكم نازلين على الحرب وقعدتوا كم يوم بالحرب بعدين اعلنتوا انهزامكم طبعا مهي كانت مدروسة الشغلة بنضحي بكم جندي عشان نرضي تاج راسكم اليهود وحبايبكم<br />وعفكرة معظم المجمعات عندكم اصلها لليهود روح شوف الصويفية وعبدون<br />ولك بكفي انهم الفلسطينية لهلا بحترموكم اما لما نوصل الاردن كل المخابرات بتشتغل علينا<br />عالاقل بندافع عن بلدنا بشرفنا بكرامتنا بدمنا<br />انا بعرف وانت بتعرف انه نص اراضي الاردن صارت للحريري بعد لعبة قماار وابصر مين ابصر لاعب قمار وخسران فيها<br />وبعدين ما بنعزم اشكالك عشان نطلب منهم مصالح لانها اصلها اشكالك من كلامك واضح كيف انك وطني وبتحب الاردن<br />فما تعمل زعرنجي زمانك وانك بتعرف كلشي وانك ازعر<br />ولك اصغر طفل عنا بضيعك بشربة مية<br />لا عامل حالك فهلوي<br />صحيح انك عليوة ههههههههههه<br />باين عليك بتضحر مسلسلات الاردن كتييير يا اموور<br />نام بضحن ماما وبابا واتغطى بالليل عشان تبرد وخليك بايا يحكيلك قصة اجدادك كيف باعوا فلسطين عشان النسوان<br />اموووت فيك يا اردني<br />ودشركم من شعار الاردن اولا<br />بتحب تعرف شو صفاتكم<br />1.<br />2.<br />3.<br />4.<br />يفضح عرضكم ولا صفة فيكم<br />بعدين قبل ما تحكي عن رؤسائنا شوف كلابكم وين بتسهر كل ليلة<br />لا احلى ما فيكم هو كتب التاريخ يلي عندكم عم بتغنوا بالنصر انكم حققتم اشي وانو ملكم حرر فلسطين<br />اصلا اول من سلم فلسطين لليهود هو انتوا يا كلاب<br />ولما يسير تقدم بقولوا انه الاردن ساهمت بتقديم خدمة للشعب الفلسطيني<br />مش بدكم ما نحكي عنكم<br />حط كندرة بتمك وبتم كل واحد بيدخل في قضيتنا<br />ولكوا لولا ملككم الكلب القحبة كان من زمان اتحررنا بس انتوا المستفيدين يا كلاب<br />شوفوا كيف عماراتكم صارت<br />سنة ال99 كانت الاردت صحرا وهلا صار متل امريكا كل هاد عشان عم بتبيعوا بدم شعبنا<br />روح لماما يا روح ماما وقلها يا ماما بدي تفطميني من اول وجديد عشان افهم القضية صح<br />بس مش عارف ليش انه عم تحكي وانت نايم في بيت دعارة<br />ولك اول بلد عربي بينتشر في الزنا وبكل فخر هو بلدكم<br />ضبوا بناتكم في بيوتهم وبكفي ترموهم بالشارع عشان يزنوا ويجيبوا مصاري ولما تنكشفوا بتسير بتخافوا على شرفكم وبتقتلوها<br />ومتل ما قلتلك خلي ماما وبابا يحكولك قصة سيدو الملك يلي ربنا ريحنا منه كيف باع فلسطين هو واخوته واولادو<br />صحيح متل ما قالت ليلى .........."
