text = "نعم المهم انه لم يخن شعبه.. ولكنك لا تعرفين ما هي الخيانة يا عزيزتي.. ما دمت تعتقدين ان الخيانة للدين والامة والتاريخ العربي والاسلامي ولمقدسات المسلمين التي باعها الملك الخائن كل ذلك ليس خيانة.. المهم انه لم يخن شعبه.. هل تعتقدين انكم شعب اصلا لكي يخونه.. انتم مجرد قطيع من الاغنام والخراف لا اكثر ولا اقل ولا يصح ان يطلق عليكم لقب شعب.. لان اغلبيتكم من البدو الرحل.. وعادة فان البدوي يعطي الولاء لمن يطعمه.. يعني بصريح العبارة انتم كالكلاب الجائعة ولائها لمن يطعمها ولا يهمها شيء اخر في هذه الدنيا.. انتم شعب امعة ومثل الببغاوات واي شخص داعر يستطيع ان يحكمكم والبسطار فوق رؤوسكم المهم ان يعطيكم العجوة والزبيب والحلاوة ويحطلكم نجوم على اكتافكم الصدئة.. لم يبق هناك نجوم في السماء كما قال الراحل جمال عبدالناصر للملك حسين.. لان النجوم كلها على اكتاف ضباط الجيش الاردني الذين لم يخوضون في حياتهم حربا حقيقية الا الحروب اياها لخدمة اسيادهم الصهاينة كحرب ايلول الاسود ومشاطرهم في قمع المظاهرات والمسيرات المؤيدة لفلسطين وشعب فلسطين ولكل قضايا الامة.. اسمحي لي يا عزيزتي ان اقول لك انكم لم تصلوا بعد الى درجة شعب.. انتم قطيع عفن من الابقار والاغنام الجرباء وصدق حسني مبارك عندما قال موجها كلامه للملك حسين: الملك وكم مليون جحش اللي حاكمهم.. انتم جحوش بكل معنى الكلمة وستبقون كذلك مهما حاولتم التظاهر انكم بنيادمين.. والخيانة في دمكم منذ فجر التاريخ منذ الحسين بن علي الذي هدم دولة الخلافة الاسلامية العثمانية الى الملك عبدالله بن الحسين ربيب الانجليز وعميلهم الاول والى الملك حسين الموظف النشيط في المخابرات البريطانية واجهزة الموساد والى الجديد الموظف لدى المخابرات الاميركية.. يكفي ان رواتب مخابراتكم التي تتجسس على حماس والجهاد الاسلامي وحزب الله وكل حركات المقاومة الفلسطينية والعربية والاسلامية تاخذ رواتبها مباشرة كمخصصات من السي اي ايه.. انتم خونة حتى العظم ووالله لو كتبت مجلدات في خياناتكم وعمالاتكم لما وسعت هذه المجلدات لانكم في كل يوم جديد تسجلون خيانة جديدة فانتم انتم كما هو مرسوم لكم كلاب حراسة لا اكثر ولا اقل للصهاينة واعتقد ان هذا لا يضيركم ابدا لانكم شعب سافل منحط قذر لا يصل حتى لو تطاول الى كعب فلسطيني او اي عربي .. انتم نشامى نعم ولكن في التجسس والعمالة والخيانة وقلة الحياء بل صدقيني ان اليهود اشرف منكم وعندهم كرامة اكثر منكم.. ان ما حصل للشعب الفلسطيني جراء خيانة حكامكم له وما لقيه الشعب الفلسطيني من دماء سالت بتواقيعكم وبعلمكم وبتنسيقكم الامني مع اجهزة الامن الصهيونية وما تقومون به من سب الفلسطينيين وكراهيتكم لهم وتسطير المقالات والكتب عبر اقلام مسمومة حاقدة لهم اكبر دليل على انكم احقر بني البشر بل لا يمكن ان تكون بشرا انتم قطعان من الخنازير والقردة كابناء عمومتكم الصهاينة مع الاعتذار من الخنازير والقردة لانها اطهر منكم واجل قدرا"
