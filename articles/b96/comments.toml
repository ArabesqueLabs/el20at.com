subject = "الاردن اولا في ماذا؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
author = "علي نزال"
posted = "2008-06-13"
text = "الاردن اولا .............. فيماذا يا هل ترى الاردن اولا؟؟؟؟؟؟؟؟؟؟؟<br />نعم.............. الاردن اولا في خدمة اسيادكم يهود خيبر وبني قريظة............ الاردن اولا في خدمة اسرائيل.......... الاردن اولا في خدمة بوش وتشيني ورايس ........... الاردن اولا في خدمة مشاريع البيت الابيض في المنطقة......... الاردن اولا في التامر على قضية وشعب فلسطين............ الاردن اولا في التامر على نظام صدام حسين وذبح الشعب العراقي.............. الاردن اولا في الاصطفاف الى جانب الموارنة في لبنان........... الاردن اولا في الاصطفاف الى جانب المشروع الاميركي الاسرائيلي في لبنان............ الاردن اولا في توطيد العلاقات مع اخس النظم العربية المعينة من الغرب الصليبي وعلى راسها نظام حسني مبارك الكلب وانظمة الخليج... الاردن اولا في التبشير بالعنصرية والاقليمية وترسيخها في البلد بعدة اساليب اقلها اللعب على وتر اردني فلسطيني في مباريات القدم وحدات وفيصلي وعمل ملفات امنية خاصة للمباراة ودعم الهتافات النشاز بحضور ضباط مخابرات وامن.. الاردن اولا سيفا مسلطا على رقاب حركات المقاومة الفلسطينية واللبنانية والعراقية.. الاردن اولا في حصار الشعب الفلسطيني في قطاع غزة.. الاردن اولا في قتل ابو مصعب الزرقاي كرمال عيون اسياده الاميركان... الاردن اولا في التامر على حزب الله اللبناني والتنسيق مع اجهزة الموساد والاستخبارات الاسرائيلية في كل صغيرة وكبيرة..<br />هل يوجد شيء اخر تريدونه من الاردن اولا يا احفاد ابي رغال وابي جهل.. مع الاعتذار منهما لان ابو رغال وابو جهل وابو لهب عندهم شهامة اكثر منكم يا سفلة"
