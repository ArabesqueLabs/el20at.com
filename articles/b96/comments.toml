text = "الى الاردنيين السفلة.. الى اكثر الشعوب انحطاطا في العالم.. كس امياتكوا على كس خواتكوا يا اولاد الزنا يا اولاد<br />اللواطيين يا مخنثين يللي شارون وبوش وبلير اصابعهم سداسية وخزق طيازكوا سداسية يعني لصم في طيازكوا يا عديمي الشرف والذمة.. ولكوا بتسووا عالكوا شجعان وابطال ونشامى وانتم والله مسخرة.. بتسزلموا على فتى او شب فلسطيني مسخم واذا ناك عرضكوا بتروحوا بتلفقوله تهمة عند المخابرات يا اخوات القحبة لانكم بلا شرف فمن كان ابنا للواط والزنا فماذا سيخرج من فمه المعفن سوى الخرة والفسو والظراط يا من كلوب باشا ناك خواتكوا ونسوانكوا وامهاتكوا فخرجتم انتم برد الوجوه على شاكللة الانجليز مع الاعتذار للانجليز لانهم اكثر شرفا منكم"
