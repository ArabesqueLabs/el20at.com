text = "احسنت يا ابو رستم بالفعل هذا هو الاردن اولا.. وانا بالرغم من ان حكومتي ونظامي العميل للاميركان على علاقة وطيدة بنظام الاردن لانهما يسيران في نفس الركب الخياني والتامري.. اقول لك ان لدينا في السعودية ايضا شعب هامل يطبل ويزمر لحكومته ونظامه العميل وهذا داب كل زمان ومكان في تاريخنا العربي والاسلامي فالمنافقين موجودون دائما وابدا بين ظهرانينا. ولذلك انا لا استغرب ان اجد ان اكثر من 70% من الشعب الاردني سحيج وطبيل لان مثل هذه الشعوب لا تهمها مبادىء ولا قيم ولا اخلاق ولا مثل كل ما يهمها الاكل والشرب والنوم لا اكثر ولا اقل"
