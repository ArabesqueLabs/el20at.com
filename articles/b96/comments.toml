text = "انا كنت طالب جامعي ولم احصل ع اي انذار او تنبيه طيلت سنوات الدراسه ولكن في الحقيقه كنت من اكثر الطلاب الذين يفتعلون المشاكل والتحريض عليها فلم يكن علي سوى ان اخطط وان احمي الجو لما لي من سيطره ع الطلاب او البنات فلو ان الاداره الجامعيه استطاعة الوصول الينا نحن هذه الفئه من الطلاب لما حدثة هذه المشكلات الكبيره ومع العلم ان اكثر هاولاء الطلاب من الذين يملكون الاسلوب السياسي في التعامل مع الدكاتره فلو ان الجامعات تبنتهم ليصبحوا قيادين لكانوا خير سند للوطن"
