text = "محمد نواف بدي أبشرك بأني شرشحتك بكل صفحات موقع عشرينات بكل صفحة دخلتها شرشحتك وفضحتك وكل شي , وفي<br />بعض الصفحات كان ما إلها داعي إني أروح أشرشحك فيها , وبدي أذكرك عندي برنامج براقبك وبوريني أي موقع دخلت اليوم وامبارح وكل شي , ومنها موقع موالي تبعت الخرة عمر عبد اللات الزفت , خلاص , يعني وراك وراك والزمن طويل , وصدقني ما رح أسيبك إلا لما تنجن ونتبح زي الكلب , وخلي بالك كمان عندي برنامج بكشف كل الأسماء المستعارة بالمواقع , وأنا كشفتك<br />كتير وفيه برضوا كمان إلك إسم بتكلم في صفحة بتحكي عن حاتم علي تبعت الدارما المصرية فيه إلك تعليق اسمو :<br />((آه مكسيم , أنا سوري آه يا نيالي)) مش هيك ولا لا , كشفتو وفضحتك بالصفحة كلها , صدقني رح أدخش الخرة بتمك لما<br />ينفجر خدك يا كلب , عشان تعرف قيمة الكلمة اللي بتطلعها من تمك المعفن الأجرب ...<br />شوف محمد >;>; بدك ياني أوقف عن الشرشحة وغير هيك اعتذر لكل الفلسطينية وبوس رجولهم وإلا إنتا حر , على فكرة صدقني يا محمد نواف أنا على فكرة إذا إجتني فكرة ومسكت براسي ما بسيبها , صدقني إن ما اعتذرت لأسيادك الفلسطينية بالموقع كلو صدقني رح أعمل صفحة أو موقع كمان وأشرشحك فيه وأحطو بغوغل وياهو وأعمل بنرات بالمنتديات بس عشان تعرف تطول لسانك , ماشي .... انتبه لحالك وتشوفش حالك على الفاضي ......."
