[[comments]]
order = 429
subject = "الى الاردنيين مزابل التاريخ"
author = "النورس الفلسطيني"
posted = "2008-06-20"
text = "أبول على الاردنيين جميعا.. انه زمن البول<br />فوق المناضد والبرلمانات والوزراء<br />أبول عليهم بدون حياء فقد خانوا بدون حياء<br />سارع بالحل السلمي قليلا<br />اولاد القحبة, كيف قليلا ؟ نصف لواط يعني<br />اتهمكم جميعا يا ديوسي العرب<br />اللاعبين باطيازهم في اربد والكرك<br />الماصين الازباب اللاعبين بساطير الاميركان<br />الجرذان اكثر نظافة منكم ايها المتخمون بالاوساخ<br />ايها القاعدون تحت الجذر التكعيبي<br />يا عاشقي ابناء القردة والخنازير<br />يا كلاب الحراسة لليهود والحمران<br />يا معوجو الرقبة يا اصحاب الكساس الملتوية الى الرقبة<br />انتم بعران وستبقون بعرانا الى اخر الزمان<br />يا ابناء ابي رغال وابن العلقمي<br />يا مسامير بسطار كلوب باشا<br />انتم الشفة السفلى الهابطة كالبعران القذرة<br />لن نرحم منكم احدا سنضعكم في النار ببطء قردة<br />سلطات القردة , احزاب القردة , اجهزة القردة<br />يا شيوخ التعاريس يا حثالة هذه الامة<br />استغفر الله ان تكونوا من هذه الامة<br />فانتم مصرف الامة ومزبلتها<br />تخفون ذويلا ارفع من ذيل الفار<br />هاتوا ملك السفلس هذا ملك يستأنس بالخازوق<br />ولا يشرب الا بجماجم اطفال البقعة<br />اولئك اعداؤك يا وطني! من باع فلسطين<br />سوى هؤلاء القردة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 430
subject = "حماس والاردن"
author = "رمزي البنا"
posted = "2008-06-20"
text = "قضية تهريب الأسلحة التى يدعيها النظام الأردنى على حماس ما كانت لتحظى بكل هذا الإهتمام والتوسع الإعلامى لو لم يربطها النظام الأردنى بجرائم أخرى مثل محاولة استهداف بعض الشخصيات والمنشآت الأردنية، وهذا يعد من قبيل ذكاء الشياطين عند تخطيط جرائمهم وحبك أكاذيبهم، أن العالم لن يلتفت إليهم إذا أعلنوا عن قضية تهريب الأسلحة ولم يقرنوها بقضايا أخرى تجعل القضية قضية أمن أردنية وإرهاب دولى وعالمى، لأننا إذا أخذنا جدلا بصحة الشق الأول من الاتهام ـ الخاص بتهريب الأسلحة فإن ذلك فى حد ذاته لا يعيب المقاومة، فكل مقاوم يعمل جاهدا على استجلاب السلاح ونقله وتهريبه داخل حدوده، وقضية تهريب السلاح داخل فلسطين قضية صعبة وشائكة لأن الواقف على منعها حكام العرب وليسوا أجانب، وتلك هى الكارثة، ولقد ظلت قضية تهريب الأسلحة إلى فلسطين بمثابة الشغل الشاغل لكل رجال المقاومة وكل من يتعاطف معهم من الإسلاميين والوطنيين، فالسلاح المستخدم فى المقاومة الفلسطينية لا يهبط عليها من السماء، وإنما يتحتم على المجاهدين إدخاله عبر حدودهم مع كل من مصر وسوريا والأردن، وتمر هذه العملية بمراحل متعددة من الإجراءات تبدأ بالشراء ثم النقل والتخزين ثم إدخالها للأرض المحتلة، ومن الطبيعى أن يفصل بين كل مرحلة وأخرى فاصل زمنى يجعل العمل يتم خطوة بعد خطوة فى مأمن وحيطة يضمن له النجاح وتحقيق الهدف، وتهريب السلاح إلى المقاومة يعد من الأعمال المشروعة التى لا غبار عليها حتى لو تمت عبر الأراضى الأردنية أو المصرية أو السورية، فالأرض العربية كلها أرض واحدة لا يفصل بينها سوى الحكام، والشعوب العربية تكون دائما حيث تكون المقاومة، وعندما يدخل السلاح المهرب إلى أى من الدول المجاورة فإنه لا يدخلها بغرض الاستخدام المسلح فى هذه الأرض وإنما يدخلها بغرض التهيئة لنقله إلى الأراضى الفلسطينية فى أوقات لاحقة، وكل ذلك يتم فى أحوال بالغة الخطورة والتعقيد تكون أصعب مراحلها وأكثرها حساسية هى تلك المتعلقة بعملية التخزين فى الأراضى العربية المجاورة التى يضيق صدر حكامها بالمقاومة وأعمال الجهاد.<br />والمتابع لما عرضه التليفزيون الأردنى لنوعية الأسلحة التى يدعى النظام أنه قد تم ضبطها يمكنه أن يعلم دون جهد أو عناء طبيعة الاستخدام لهذه الأسلحة، فأغلب المعروض كان لبنادق آلية ورشاشات قتالية، وهذه النوعية من الأسلحة لا تستخدم أبدا فى أعمال الاغتيالات التى تتم لمسئولين ـ كما تدعى الأجهزة الأمنية الأردنية ـ فالاغتيالات يلزمها أسلحة أقل حجما وصوتا حتى يسهل حملها وإخفائها عند التنقل والحركة، وهذا ما لا يتوفر فى المعروض من هذه الأسلحة التى لا يمكن استخدامها إلا فى أعمال المقاومة.<br />من أجل ذلك ربطت السلطات الأردنية ما بين هذه الأسلحة وبين الإدعاء بأنها كانت ستستخدم فى اغتيال بعض المسئولين الأردنيين وتفجير بعض المنشآت الحيوية فى الأردن، وذلك لكى تعطى الانطباع الذى يخدم مخططها فى النيل من سمعة حماس، أن كل إعلان أردنى يشير إلى إحباط قوات الأمن الأردنى لمحاولة تهريب الأسلحة إلى فلسطين يعقبه نفور واستياء شعبى واسع النطاق ليس فى الأردن وحسب وإنما على المستوى العربى والإسلامى فى كل أنحاء العالم .. من أجل ذلك كان لابد من ربط إحباط محاولات تهريب الأسلحة بأعمال إرهابية تدعى السلطات الأردنية بأن حماس كانت ستقوم بها داخل الأردن معتمدة فى ذلك على اعترافات من تدعى بأنها ألقت القبض عليهم... ولقد أعجبنى تعليق أحد كوادر حركة حماس على هذه الاعترافات قائلا : ( أن لدينا أنظمة عربية قادرة على أن تستنطق الأخرس وتجعله ينطق بما تريد أن يقوله تحت وقع التعذيب ).<br />لقد أرادت السلطات الأردنية أن تستحوذ على استعطاف المجتمع الدولى فى عمل كانت تستحق عليه التأنيب والإدانة.. لقد دأبت السلطات الأردنية على الكيد للمقاومة ومن يناصرها داخل وخارج الأردن وهى تفخر دوما بعملياتها الأمنية التى تحرم المجاهدين من تهريب السلاح عبر حدودها، وكم قتلت وكم اعتقلت وكم حاكمت وسجنت، ولم يغير من سلوكها المعيب والمشين ما وصفتها به بعض لجان المقاومة من أن السلطات الأردنية صارت أقرب إلى شركة أمنية تعمل على الحدود لحساب إسرائيل...<br />وفى هذه الأيام تحديدا تحاكم السلطات الأردنية خمسة من أبناءها حاولوا التسلل إلى فلسطين عبر حدود الأردن للمشاركة فى أعمال الجهاد والمقاومة..<br />ومنذ فترة وجيزة أعلنت عن إحباطها لمحاولة ناجحة لتهريب كميات كبيرة ومتنوعة من الأسلحة والصواريخ والمتفجرات بعد أن تمكن المجاهدين من عبور الحدود فعلا وإدخالها للأراضى الفلسطينية إلا أن السلطات الأردنية تعقبتهم وقتلتهم بعد اجتياز الحدود!!<br />لو تعلم هذه السلطات مدى المعاناة التى يلقاها هؤلاء الأبطال فى شراء ونقل وتخزين وإدخال هذه الأسلحة إلى فلسطين ما أقدموا يوما على مواصلة أفعالهم .<br />لقد سبق وكتبت فى إحدى مقالاتى السابقة أن أمن إسرائيل الفعلى والحقيقى يقوم فى الأساس على خيانة حكامنا العرب للأمانة التى حملوها أمام الله والشعب، وهذا العمل يعد أحد المهام الرئيسية التى ينوط بها للحكام العرب، ولو أخلص الحكام العرب للقضية لتحررت فلسطين فى بضع سنين.. كل ما عليهم ألا يعملوا حراس حدود لإسرائيل وأن يفتحوا الحدود أمام كل مقاوم وناقل للأسلحة، فالحدود طويلة وشاسعة ولا يمكن السيطرة عليها بحال من الأحوال، وإسرائيل تبدو فى المنطقة كالمجرم أو اللص المحاصر من كل الاتجاهات، ونجاحها فى كسر هذا الحصار عن طريق الحكام العرب هو الذى مكنها من البقاء طيلة هذه المدة.<br />الحاكم العاقل المدرك لحقائق الأمور والمبصر لخطورة إسرائيل على كل دولة تعيش فى المنطقة يمكنه إغماض العين قليلا على عمليات تهريب الأسلحة إلى فلسطين حتى لو فرض عليه منع ذلك يظل بإمكانه إغماض العين بين الوقت والآخر أمام عمليات المجاهدين الخاصة بنقل الأموال والأسلحة والعتاد إلى المجاهدين، فلا ضرورة لكل هذا الإخلاص فى الغدر، ولا حاجة لكل هذا التوغل فى الخيانة، ولا ضرورة فى الوفاء لليهود فى السر والعلن!!<br />إن كل حاكم مسلم فى قلبه مثقال ذرة من إيمان بالله وجب عليه مناصرة ودعم رجال المقاومة الإسلامية فى كل مكان فى العالم، ويزداد هذا الأمر أهمية بالنسبة لدول الجوار..<br />لماذا لا يقصر حكامنا فى حق إسرائيل مرة واحدة، وهى التى ليست لها حقوق؟!!<br />كثيرا ما يكون الإنسان مقصرا حتى فى علاقته مع ربه، فكيف يكون جادا ومخلصا فى علاقته باليهود... الإنسان بطبيعته كثيرا ما يكون مقصرا حتى مع أهله وأحبابه ومقصرا حتى فى حق نفسه، فكيف لا يكون مقصرا مع أعداءه؟!!<br />كيف نتعامل بكل هذا الجود والكرم مع العدو ولا نتعامل بأى قدر من هذا الإخلاص مع قضايا أمتنا؟!!<br />عجيب أن يعمل الخونة بكل هذا الجد والإلتزام فى خدمة الشيطان وعجيب أكثر أن يقصروا كل هذا التقصير فى حقوق أوطانهم!!<br />إن كل الأسلحة التى يقاتل بها المجاهدين فى فلسطين الآن هى أسلحة مهربة، فهل يمكن للعدو معرفة من أين أتت هذه الأسلحة وكيف دخلت؟!!<br />هل يستطيع أن يجزم بدخولها من أى الحدود المجاورة؟!!<br />ولو أجزم بذلك فما الذى يمكن أن يفعله؟!!<br />لماذا يخاف حكامنا من إسرائيل أكثر من خوفهم من الله، ولماذا يحافظون على المعاصى أكثر من محافظتهم على الطاعة، ولماذا يكذبوا علينا ويصدقوا مع العدو؟!!<br />إن فى إسرائيل نفسها من يمد المقاومين بالأسلحة فما بالنا نحذر من فعل ذلك ونحن أحق بإمداد المقاومة بالعون والمساندة من اليهود والملاحده!!<br />إن الحاكم الخائن أشبه إلى حد كبير بالزوجة الخائنة التى تخلص لعشيقها أكثر مما تخلص لزوجها، وقد يأتى اليوم الذى يتفق فيه الطرفان ـ العاشق والعاشقة ـ على قتل الزوج وحرقه، وهذا ما يفعله الحكام فى أوطاننا..<br />إن المصيبة الحقيقية التى تواجه الأمة الآن تكمن فى انتشار وشيوع الخيانة بين كل حكام العرب للدرجة التى صار الأمين فيهم مكروه ومنبوذ، وهذا ما يفسر موقف الحكام الشاذ من المجاهد صدام حسين...<br />قديما كانت الخيانة فى المنطقة مجهولة ومستترة، وكان الخائن يعيش وحيدا ومنبوذا ومستترا كانت المؤامرات تحاك فى الخفاء ضد الشرفاء، وكانت الخيانة تبدو كالطفل اللقيط الذى لا يتبناه أحد ... خيانات الحكام اليوم صارت تنفذ على مستوى جماعى وفى العلن وفى مؤتمرات القمة، وصار للخيانة قرارات وتوصيات يصدرها الحكام دون خوف أو حياء بعدما تفشت ظاهرة الخيانة وانتشرت بين حكام العرب مما جعلهم يستقوون بأنفسهم على الشعوب ويتعاونوا فيما بينهم على الإثم والعدوان فيجتمع وزراء داخليتهم بصورة دورية لوضع القرارات الخاصة بمكافحة ما يسمى الإرهاب وسد الثغرات وإبرام الإتفاقيات الخاصة بتسليم المشتبه فيهم والتعاون الأمنى بين أجهزتهم الأمنية وتبادل الخبرات فى مجالات مكافحة الشغب وبناء السجون والاعتقالات .. فى حين لا نرى مثل هذا النشاط والحيوية فى التعامل مع باقى قضايا الأمة مثل مشاكل البطالة والفساد والرشاوى والمخدرات وانحدار الأخلاق وسقوط القيم وفساد الذمم وانتشار الاباحية حتى صارت الأمة كلها من مشرقها إلى مغربها تعيش الفشل فى كل شئ...<br />خيبة فى الزراعة..<br />ووكسة فى الصناعة..<br />وسقوط فى الإعلام..<br />وضياع فى التعليم..<br />وتطور فى الجرائم..<br />وانتكاسة فى الحريات...!!<br />لقد جمعت الخيانة بين الفرقاء العرب، والخيانة وحدها هى التى وحدت بين القاده العرب وجمعت شملهم وجعلتهم يعيشون على قلب شيطان واحد، وبسبب ذلك تنعم إسرائيل بالإستقرار والتنمية وبكل وسائل العيش الرغد ونعيش نحن على المطاردة والقهر والتخلف والفقر!!<br />من أجل ذلك لابد من العمل على إعادة صياغة الفكر القيادى وإقامته على ثوابت إيمانية وعقائدية يلتزم بها الحاكم والمحكوم فمثلما فسد الحاكم فسدت من حوله النخبة المثقفة، فهل يعقل أن نجد من بيننا من يصف الفلسطينيين بالكلاب؟!! ... هذا ما فعله أنيس منصور وكتبه على صفحات جريدة الأهرام حيث وصف الزعماء الفلسطينيين بالكلاب وقال عنهم : ( إنهم كلاب ينبحون ) واختتم سلسلة من مقالاته بقوله : ( نراكم فى المشمس إن شاء الله ومنكم لإسرائيل ).<br />هل هذا كلام؟!! ... إنه نوع من التبجح والمجاهرة بالعمالة والخيانة، ونوع من الفكر الذى لا يحتوى على أى قدر من الأدب!!<br />ومن العجب أن يُحترم هذا الكاتب الصعلوق ويحتفى به فى إعلامنا ويقدره حكامنا أعظم ما يكون التقدير!!<br />إبراهيم سعده نادى بأعلى صوته مطالبا بتقسيم العراق وقال : ( ما العيب فى تقسيم العراق إذا كان هذا مطلب أهله )!!<br />هؤلاء عربجية وليسوا كتاب، ولو كان النظام طاهرا ونقيا ما ظهرت هذه النفايات على الساحة المصرية.<br />إبراهيم نافع قبل الاعتداء الأمريكى على العراق ظل يكتب على صفحات الأهرام مقالات طويلة يمهد فيها لضرب العراق مبررا لهذه الحرب القذرة ومؤيدا وجهة النظر الأمريكية بعد أن استضافه بوش فى أمريكا قبل الحرب بأيام ليعود إلينا ويكتب طالبا منا أن نساعد أمريكا على تحرير العراق من صدام ونظامه!!<br />\"مخرف\" فى مصر يدعى عبد العظيم رمضان يكتب أسبوعيا فى الأهرام السم الزعاف تحت عنوان \"خواطر مؤرخ\" وهو فى الحقيقة خواطر مخرف... فى واحدة من شطحاته يقول : ( لقد ارتكب أسامه بن لادن وأبو مصعب الزرقاوى من الجرائم والمذابح ضد المسلمين ما هو بعيد كل البعد عن الدين وعن الإسلام ) ثم يصف حماس بأنها ستكون السبب فى ضياع فلسطين قائلا : ( فليمت الشعب الفلسطينى جوعا ولتضيع الأرض الفلسطينية وتذهب سدى مادامت المبادئ النضالية سليمة )!!<br />إننا نواجه جيش من الأفاكين والمرتزقة والسفلة ممن تربوا على موائد الحكام وعاشوا فى أحضان حكام فسقة بحثوا عن من يؤيد فكرتهم ويتبنى مخططهم إلى أن وجدوا ضالتهم فى تلك الفئة القذرة والمنحطة التى انتشلوها من الوحل ووضعوها فى الصدارة!!<br />كان من المفترض أن نرقى فى صراعنا مع الصهاينة إلى أساليب أجدى وأنفع، وأن نتقدم فى العلوم لا أن نتراجع ونتقهقر..<br />كان من المفترض أن يرقى القذافى لا أن يسقط ويهوى بعد أن رفع العمر شعارات الوحدة والجهاد حتى أصيب باليأس والجنون فرفع الراية البيضاء لأمريكا فنقلت إسمه من قائمة الإرهاب ووضعته فى قائمة العبيد والعملاء... التائبون الراكعون الساجدون لأمريكا!!<br />كان من المفترض ألا نترك ياسر عرفات محاصرا فى مقاطعته إلى أن يسمم وتنتقل راية الجهاد من يد الشرفاء إلى يد العملاء..<br />كان علينا أن نفرح لحماس وأن نعمل على دعمها وتمكينها من قيادة كفاح الشعب الفلسطينى بدلا من قيادة الخونة واللصوص ممن أفرغوا خزائن المال الفلسطينى وجعلوا الشعب يتسول الطعام والغذاء..<br />كان على مصر ألا تجعل حدودها مع غزة ـ وهى حدود عربية عربية ـ خاضعة لقوات دولية ولا أن تسمح بتعليق كاميرات مراقبة إسرائيلية تراقب حركتنا وحركتهم صباح مساء..<br />إننا نعطى إسرائيل دوما أكثر مما تريد، ونكافئها على جرائمها بمزيد من التنازل والتفريط، وتلك هى ملامح الفلسفة الخاطئة التى أسس لها السادات فى اتفاقيات كامب ديفيد المشئومة التى أعطت لإسرائيل كل شئ وتركت للسادات \"خازوق\" كبير كان هو الإرث الباقى للأمة حتى الآن.<br />لقد أضاع الحكام قيمتنا...<br />وإذا ضاعت القيمة ... فلا شئ فى الحياة يكون له قيمة، ونحن نعيش اليوم من غير قيمة فى أوطان ما عاد لها قيمة بسبب حكام ما لهم أدنى قدر من الوزن أو القيمة.<br />كلمة أخيرة :<br />مصر فى خطر... خطر حقيقى، وأرجو من كل مسلم أن يدعو لها ونسأل الله السلامة والعافية"
