[[comments]]
order = 383
subject = "البعير الجرب في خدمة رايس"
author = "صائد الصقور الفلسطيني"
posted = "2008-06-10"
text = "نعم الاردنيون هم مسيلمة العصر في الحرب على المجاهدين والاستشهاديين<br />حكامهم الخونة من جماعة الاعتلال ليسوا ظلاميين , بل هم طباخون في مطبخ رايس الذي آل إليها من السيد سايكس وشريكه بيكو , في هذا المطبخ تعمل كل آلة الهندسة الوراثية الأمريكية .<br />رايس تجمع الأبل من الاردنيين لتردهم إلى أصلهم كل منهم بعير أجرب لا حول له ولا قوة سوى جرح ظهره ,<br />هل غاب أحد من الابل عن دعوة رايس ؟<br />الكل مشارك في الثورة الأعرابية الثانية لتقسيم بلاد الشام بعد الرافدين وسيصبح البعير الجديد ملك العرب<br />هذا الوعد الأمريكي له ألم يف سايكس بوعده مع البعير الأول ؟؟؟<br />يقولون طفل عد الابل من بعيد أنها ثلاثة ملايين كلب وحمار وخنزير.<br />ويقول آخر , و زيدوا كلبا معتدلا لا ينبح ,<br />راعيتهم زنجية وهم طويلو عمر . اسمعوا , سمعنا وأطعنا عمنا بوش وراعيتنا رايس ,<br />رؤوس سيكتب عنها التاريخ إنها حاملة راية الثورة الأعرابية الثانية التي سلمت ما تبقى من أرض العرب لعدو الله ,<br />وسيظل حفظة القرآن في قطيع رايس يرددون ( أطيعوا الحاكم ولو كان كافرا) فهم يعلمون أنه كافر وفاجر وديوث .<br />المشركون ليسوا في جزيرة العرب ورايس ليست مشركة , وهذا خليج , فتشوا عن جزيرة العرب ,<br />ليس هناك عرب وليس هناك جزيرة وليس هناك سوى ما يسمى بالاردن نسبة الى النهر الفلسطيني الخالد<br />وأعلن الكفيل وهو يناول رايس الفنجان عن هروب مكفوليه الخلفاء الراشدين وعن قطع رأس هارون الرشيد في ساحة المدينة , وتلا براءة مسيلمة ,<br />والارادنة يحملون دكتوراة الاعتدال كسيرة ذاتية دمغها ألمرت وليفني وحبرها عصير صنعوه من دماء غزة ,<br />ترقبوا شراب دم الشام اللذيد , ثم اشربوا بنا أنابوليسنا لذيذا من دلال الاعتدال ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 384
subject = "الخونة"
author = "اشهل الاوسي"
posted = "2008-06-10"
text = "الخيانة العربية الكبرى ، أو ما أطلق عليها في وقتها \"الثورة العربية الكبرى\" التي قادها فيصل ابن الحسين شريف مكة ، أسست لعهد جديد من الخيانة العربية ، ولا تزال آثار تلك الخيانة ماثلة وتؤتي أكلها كل يوم. كان للانجليزي المدعو مكماهون الدور الاعظم في تحريض الشريف حسين بن علي على الخروج على حكم الاتراك.. بعد أن بذل له الوعود الكاذبة مكافأة له على خيانته... وبعد أن نجح فيصل بن الحسين في اخراج الاتراك من الدول العربية لم يكن يدري أن الانجليز إنما أخرجوا الاتراك ليحلوا محلهم... اجتمع الانجليز والفرنسيين وعقدوا ما عرف باتفاقية \"سايكس بيكو\" التي تم بموجبها تقسيم بلاد المسلمين بين الدولتين.. وذهبت وعود مكماهون أدراج الرياح....وحظي المسلمون ببركات خيانة الشريف حسين وابنه فيصل ، بأسياد جدد هذه المرة من النصارى بدل الاسياد المسلمين الاتراك.<br />تمددت دولة آل سعود واستولت على الحجاز والمدينة المنورة وقبلها كان الانجليز قد خططوا لانشاء أمارة صغيرة للشريف حسين بن على على قطعة من أرض فلسطين وسميت الاردن فارتحل الشريف حسين اليها مع ذريته وقد حرص الانجليز على عدم منح الشريف دولة فلسطين التي كانت تحت انتدابهم لانها كانت قد خصصت لليهود الذين تم جلبهم من كل بقاع الارض ....<br />عمد الانجليز الى ارضاء فيصل بن الحسين الذي كان ذراعهم في اخراج الاتراك من دول المسلمين ، فأرسلوه الى سوريا ليكون ملكا عليها ولان سوريا كانت من نصيب فرنسا رفض الفرنسيون تنصيب فيصل ملكا عليها لانه عميل الانجليز فقرر الانجليز تنصيبه ملكا على العراق الذي كان ضمن نصيبهم من دول المسلمين... في العراق فعل هذا الرجل ما فعل من تقريب لليهود بل وبدأ يشكك حتى في رسالة الرسول الكريم صلى الله عليه وسلم... وقد بلغ حدا من الوضاعة جعله يقيم المظاهرات تأييدا لليهود في العام 1948م..وقد كان للملك عبدالله الذي خلف والده الشريف حسين بن علي القدح المعلى في مساندة توطين اليهود في فلسطين ... نشر آل سعود وثائق تؤكد الخيانة التي ارتكبها أبناء الشريف حسين في حق فلسطين عندما ساءت العلاقة بين آل سعود والملك المرتشي حسين بن طلال بعد غزو العراق للكويت...<br />قتل الفلسطينيون الملك عبدالله في القدس ثم هلك بعده ابنه طلال الذي خلفه أسوأ زعيم عربي في هذا العصر الحزين وهو الملك حسين بن طلال الذي أرضعه الانجليز لبن الخيانة منذ نعومة أظفاره وأحاطوه بالرعاية التامة لضمان عدم خروجه عن طاعتهم وقد جعلوا منه أول زعيم يقبل الرشوة ليعمل جاسوسا لحساب النصارى واليهود ضد المسلمين...وعلى الرغم من أن دويلة الاردن يشكل الفلسطينيون الغالبية العظمي من سكانها إلا انهم يعيشون هناك كمواطنين من الدرجة الثانية، رغم ذلك عمد الملك حسين المرتشي الى إبادتهم في واقعة أيلول الاسود الشهيرة...<br />استمر الملك حسين في التجسس لصالح النصارى واليهود وقد كان لخيانته الاثر الاكبر في استيلاء اليهود على أرض فلسطين بداية من حرب 1948 مرورا بنكسة 1967 وحتى محاولة العرب استعادة جزء من كرامتهم التي مرقها اليهود في الوحل في العام 1973 (أكتوبر) حيث أن الملك حسين أوحى لليهود بما تنوى مصر القيام به فكان الانتصار المصري رمزيا في تلك الحرب بسبب خيانة الملك حسين المرتشي.<br />بعد العام 1975 عمل الملك حسين جاسوسا رسميا للولايات المتحدة مقابل أجر شهري قدره مليون دولار... وهكذا توالى مسلسل خيانة هذه الاسرة حتى إذا شارف هذا الملك المرتشي على الهلاك أوحى له اليهود بضرورة أن يخلفه ابنه عبدالله \"ابن الانجليزية\" فتم احضاره من الولايات المتحدة وهو يحتضر لاكمال هذه المهمة... وحرم أخيه الامير الحسن الذي انتظر ان يكون ملكا لمدة 35 عاما... تم إزاحة الامير الحسن ونصب عبدالله ملكا وعين أخاه المسمى حمزة وليا للعهد وبذا ضمن اليهود جانب هذه الدويلة المريضة...<br />وهكذا جعل اليهود والنصارى من أسرة ترجع بنسبها الى رسولنا الكريم أحد أهم عملائهم وجواسيسهم على المسلمين.....<br />وما تواطيء الملك عبدالله بن الحسين مع اليهود والنصارى في غزو العراق والتمكين لليهود الا حلقات صغيرة في مسلسل الخيانة التي تربى عليها أفراد هذه الاسرة.<br />أما دور \"القواده\" الذي قام به نظام الاردن وأدى الى استشهاد المناضل/ أبو مصعب الزرقاوي فلن يكون آخر الخيانات ... الايام حبلى بمزيد من الخيانة والخيانة....<br />اللهم أرحم أبا مصعب الزرقاوي واسكنه فسيح جناتك واكف المسلمين شر الخونة والمرتشين أبناء الزانيات..."
