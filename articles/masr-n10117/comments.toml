[[comments]]
order = 0
subject = "مافيش فايدة ؟"
author = "مصرى حتى النخاع"
text = "ياجماعة الموقع دة كان متنفس كويس اوى لكن فية مشكلة ؟<br />الكلام دة كلة متلفق مفيش اى اثبات علية ومع احترامى لكاتب المقال عمرو دياب مين اللى مستنى دعم من حد علشان عرض اغنية وبعدين لو حضرتك متابع تعرف انة متعاقد حصريا مع روتانا وممنوع يعرض اغانية برة القناة دى<br />ياجماعة اتقوا اللة مش معنى انى بكرة جمال مبارك ولا حسنى مبارك اقوم االف كلام فارغ مفيش علية اى دليل لمجرد انى الم الناس ورا قصص فارغة وكاننا رجعنا لعصر ابو زيد الهلالى والحكايات المضروبة يقوللك كوندالذا رايس اعتذرت لانها مشغولة ؟ طب فين الدليل روح اسال كونذاليذا رايس<br />عاوز اطمن موقع عشرينات ان الشعب عارف مصلحتة ومالوش لازمة المواضيع المضروبة دى"
archived = "2007-05-10"
capture_url = "https://web.archive.org/web/20070510021318/http://masr.20at.com:80/newArticle.php?sid=10117"

[[comments]]
order = 1
subject = "انت عبيط ياض"
author = "محمد"
text = "هو ايه الاخ اللي فوق تعليقي ده يا عم انت مبتعرفش تقرا مالهم عشرينات ومال الموضوع مكتوب فوق \"القدس العربي والنبي روح اتعلم القراءة الاول وتعالى علق بعد كده حاجة مالهاش وصف يا اخي"
archived = "2007-05-10"
capture_url = "https://web.archive.org/web/20070510021318/http://masr.20at.com:80/newArticle.php?sid=10117"

[[comments]]
order = 2
subject = "التطور الطبيعى للحاجه الساقعه"
author = "نيفين نيفى نوفا"
text = "لقيتنى بعد المقال ده بغنى زى شاديه و عبد الحليم (حاجه غريبه..حاجه غريييييييبه)<br />اولا عايزه اقول لكاتب المقال حراااااااام عليك ..تراجع ايه اللى البومات عمرو دياب فيه ..من زمان و لدلوقتى عمرو ظاهره و صوت نادر و البومه الحدث الفنى الاوحد اللى الكل بيستناه<br />ثانيا عمرو مش محتاج فرح جمال او غيره علشان يضيف لشهرته و ان كان هو اللى أحيا الحفل فعلشان دا التطور الطبيعى للحاجه الساقعه ..اقصد دا الطبيعى..الطبيعى ان النجم الاوحد و الاشهر ف العالم العربى مش مصر بس هو اللى يحيى حفل زفاف ابن البيج البوس<br />ملحوظه:الكلام السابق و الله مش نابع بس من اعجابى بالفنان عمرو دياب و لكن لان فعلا الكاتب غير منصف تماما"
archived = "2007-05-10"
capture_url = "https://web.archive.org/web/20070510021318/http://masr.20at.com:80/newArticle.php?sid=10117"

[[comments]]
order = 3
subject = "الاخ محمد .......... السافل"
author = "مصرى حتى النخاع"
text = "مش عارف اقول عليك سافل ولا ابقى بشتم الناس السافلة عموما يابنى جهل تبنى موقع ما مقالة ما حتى ولو كان لها مصدر<br />زى القدس العربى لاينفى انة غلط وخصوصا الكلام مالوش اى دليل او منطق يبقى بنعيدة تانى لية ؟<br />يعنى لو قلت ان الاهرام بيقولوا انالاهرامات اللى بناها اليهود معناها انى متفق مع صاحب المقال او بروج لة لية<br />لانة سعادتك مافيش دليل مادى ملموس<br />واتنى مرة اتعلم الادب وانتا بتتكلم"
archived = "2007-05-10"
capture_url = "https://web.archive.org/web/20070510021318/http://masr.20at.com:80/newArticle.php?sid=10117"

[[comments]]
order = 4
subject = "حرام عليكم"
author = "خيرى عاطف"
text = "اولا انا متفق مع كل التعليقات التى هاجمت هذا الموضوع .. وخلاف ذلك اتمنى ان يتعلم الكاتب هذة المرة من القراء.. لانه افتقد المحايدة.. واعلن عن شعورة تجاة اشخاص باعينهم سواء كان جمال مبارك او عمرو دياب .. كما ان الكاتب افتقر للجانب المعلوماتى.. واظهر جهله ببراعه شديدة..كما ان الموضوع كه عبارة عن استنتاجات شخص.. وهو كاتب المقال.. ارجوك فكر قبل كا تكتب.. ارجوك اتعب ما تمسك القلم..ارجوك حاول تتقمص شخصيه الصحفى..ارجوك حاول تتعلم من تانى يمكن يقولوا عليك صحفى.........."
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125358/http://masr.20at.com:80/newArticle.php?sid=10117"
