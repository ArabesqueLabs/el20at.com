subject = "بشبه على القصة الأولى...!!!"
author = "English Youth"
text = "القصة الأولى دي بالذات بشبه عليها أوي، على العموم ساعات التقارب النفسي والعاطفي بين الإتنين بيكون حقيقي ومش لازم حد يحاول يجذب التاني بإنه يبين له إن إهتمامتهم مشتركة ... ممكن كده بس بدون مبالغة علشان كده يبقى البنت أو الولد بجد معندهمش أي شخصية وكل واحد بيحاول يلغي شخصيته علشان خاطر التاني والجواز ما بيكونش قائم على وجود إهتمامات مشتركة حقيقية لأن كل الطبائع والعادات الحقيقية بتبان بعد الجواز...<br />لكن أنا شايفة إن مش حرام إن الواحدة تحاول تجذب واحد وتلفت إنتباهه لها لأنها عايزة تتجوزه، بس بأساليب مفيهاش كذب أو إغراء وقلة أدب أو إرتكاب معاصي وذنوب تخللي ربنا يوقفلك خط الجواز كله...<br />وحلوة أوي بجد لو فيه وسيط كويس بين الإتنين ده ممكن يظبطهم جامد بجد... يللا وأهو كله بثوابه...<br />على العموم الموضوع لطيف أوي وطبعاً هبة ويسر شغالين حريقة مع بعض في موضوعات البنات السخنة... نهراكوا فل يا جماعة ومستنيين موضوعاتكم المشتركة دي دايماً..."
archived = "2010-03-14"
