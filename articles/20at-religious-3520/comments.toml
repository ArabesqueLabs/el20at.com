posted = "2007-04-30"
text = "بسم الله الرحمن الرحيم<br />أحب أشكركم على الفكرة الجميلة دى<br />وعندى فكرة لأدارة الموقع هو أن أحنا نعمل دعاية للفكرة دى وندعمها بتوقيعاتنا أو بأى أقتراح جديد من زوار الموقع أو المشرفين على الموقع الرائع دة<br />وأنا عن نفسى أحب أرشح الناس دى وهى كالتالى<br />أ/ أبراهيم عيسى (ممكن يبقى ثقافة أو مالية أو أعلام)<br />الشيخ حسن نصر الله (ممكن دفاع أو خارجية)<br />أ/ أسماعيل هنية (رئيس الوزراء)<br />أ/ عمرو خالد و ال د/ أبراهيم الفقى (أقتصاد وتنمية بشرية)<br />د/ فاروق الباز د/ أحمد زويل د/ مصطفى محمود (لتنمية الأمة علمياً وتكنولوجياً)<br />طبعاً لايسعنى أدراج المزيد لأن بجد هذة الأمة بها من أساطين العلوم والسياسة والطب والتكنولوجيا والذرة ما يفوق الشرح أو سعة هذة الصفحة منهم المشاهير جداً ومنهم للأسف من لم نسمع عن أنجازاتهم بالخارج بسبب أعلامنا الذى لايهتم الأ باللاعب الفلانى أو الفنانة الفلانية أو المطرب الفذ<br />ثم يأتى حلمى وحلمنا جميعاً بكل تأكيد<br />-:sad:(((أ---------------ع--------------م)))):-<br />أمــــــــــــــــــــة عـــــــــــــــــربـــــــــــــيــــــــــــــة مـــــــــتــــــــــــحـــــــــــــــــــــــدة<br />قوة عظمى نسيطر على نصف الكرة الأرضية الشرقى بالكامل قوة عسكرية وقوة تكنولوجيا يهابها الجميع يخاف منها الكبير قبل الصغير أمة قوامها مليار وثلاثمائة مليون مواطن ويزيد حيث لن يجروء أحد أن يسئ الى نبينا بالرسوم لن يجروء أحد على أقتحام أراضينا دون أن ندمرة بالكامل لن يجروء أحد على وصمنا بالتخلف والرجعية وتسود اللغة العربية لغة أولى للأمة وثانية فى باقى بلاد العالم بسبب أننا تحكمنا فى التكنولوجيا وجعلها عربية المنشاء والصنع سيتفاخر الغربي بمعرفة اللغة العربية كما نتفاخر الأن بمعرفة الأنجليزية سيلهث العالم ورائنا كى يلحق بالتقدم الذى نصنعه<br />هل يأتى هذا اليوم بأذن الله"
