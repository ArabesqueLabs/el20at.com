subject = "أراهم في نظري كالتالي"
author = "محمد السيد"
posted = "2007-03-30"
text = "نيجي بقي لأسماء ......... وأظن معظم ترشيحات حتكون مصرية ....<br />أبدأ بالدكتور يوسف القرضاوي ... بمنهجه الوسطي المعتدل<br />عمرو خالد ...بقدرة هائلة علي تجميع الشباب والـتأثير فيهم ... بشعاره التنمية بالإيمان<br />إبراهيم الفقي ... وطارق السويدان في إدارة الذات والتنمية البشرية<br />الدكتور محمدعمارة في الفلسفة ...<br />المستشار العلامة طارق البشري في القضاء ...<br />سياسيا ... خالد مشعل ... عصام العريان ...<br />ثقافيا: الأستاذ/فهمي هويدي ...<br />عبد الوهاب المسيري ... ومش عارف يكون تحت أي مجال هذا الرجل<br />كنت بأدور علي حد من الشباب ....بس مش عارف حسيت بغياب رموز ..ياتري ايه السبب؟؟؟<br />يا ريت لو حد قدم لنا رموز من الشباب ...<br />وإن كنت أجد في مصطفي حسني مثلا .. مشروع داعية عالمي ....<br />وأحمد الشقيري ... من يلا شباب ..برضه يمثل جيل قادم ...<br />مين تاني ........... ممممممممم<br />أظن كده كفاية...<br />يالا بس برضه ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \" بس مكن قصدي يغروه كده و الله\"<br />mohamedmat@hotmail.com"
