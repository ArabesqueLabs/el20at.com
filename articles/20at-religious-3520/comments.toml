subject = "فكرة ممتازة"
author = "Romantic Rose"
posted = "2007-04-07"
text = "بجد انا سعيدة جدا بالموضوع ده .. و فكرت فيه من منطلق ايماني بقدرة كل شخصية من اللي هسردهم علي أداء الدور اللي ف خيالي من أجل بناء أمة جديده .. هتاخد منهم شغل 10 سنين علي الاقل لو بدءوا من النهاردة لحد ما يحققوا احلامهم .. بس هيكون فيه شوية أحلام موازية مع حلم مجلس الحكماء اللي بتقترحوه ده .. من اهم الاحلام الموازية دي حل مجلس الامن علشان امريكا ما يبقالهاش \"حق الفيتو\" و نبدأ الشيزوفرينيا و ازدواجية المعايير .. و حلم تاني .. ان فريق الحكماء ده ينبذ كل الخلافات الطائفية و العقائدية و الفكرية و يشتغلوا لهدف واحد و هو \"نهضة الامة العربية بكاملها\" و ان محدش فيهم يسعي للزعامة و السيطرة أو لبناء شللية أو مركز قوة .. و هم - مع كامل الاحتفاظ بالالقاب - بدون ترتيب الا الترتيب الابجدي كالأتي ..<br />1- ابراهيم الفقي - اداره<br />2- ابراهيم عيسي - صحافة<br />3- الوليد ابن طلال - اموال<br />4- أيمن نور - سياسة<br />5- حسن نصر الله - اقدام و شجاعة<br />6- عمرو أديب - اعلام<br />7- عمرو خالد - فكر و رؤية و فهم للمشكلة<br />8- عمرو موسي - دبلوماسية<br />9- محمد بن راشد ال مكتوم - تخطيط<br />10-يوسف القرضاوي - افتاء"
