text = "مبادرة صعبة جدا ..........<br />بس مش عارف ..في ملاحطة ؟؟؟<br />غلبة التوجهات االإسلامية علي اختيارات الشباب ؟؟<br />ياتري دي صدفة ... ولا تقدر نعتبره توجه حقيقي ؟؟<br />ولا الرموز الإسلامية هي الأكثر مصداقية في الشارع ... وبأقول \"الأكثر وليست الوحيدة\"؟؟<br />ولا هي الأكثر عرضة للتضييق والاضطهاد...؟ ورغم ذلك استمر وجودها بدون تنازلات أو محاباة للأنظمة ؟<br />أم اختلاطها بهموم الناس ومشاكلهم, وبل وتعرضها معهم لنفس الهموم والمشاكل ؟؟<br />أو إنها الأكثر تعبيرا عن مشاعر وأفكار الناس الحقيقية؟؟<br />تراثه ...عاداته ... تقاليده ... حتي طبيعته المتدينة التي من الممكن أن تكون عامل قوة لهذا المجتمع \"وليس تدينه عيب فيه\" ؟؟؟<br />يالا ....مش حاسكت برضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2010-03-14"
