text = "اولا السلام عليكم ورحمة الله وبركاته<br />طبعا انا لن أتي بجديد ولكن احاول اضافة الي ما كتبتوه ايها الافاضل<br />انا رأيي ان الامة مازالت عليها ان تعطي الكثير من القدوات وايضا تسليط الضوء على خير ما فيها لانها بها علماء مخلصون و سياسيون حقيقيون غير مزيفيين وبها الخير كثير ولكن لا تسلط الاضواء عليهم بل على غيرهم مما تعرفون انتم وما يظهر من المخلصين لهذه الامة الا النذر اليسير من العلماء والحكماء والفلاسفة و السياسيون قليل جدا ما نعرفهم وان كان لابد ان نختار لنا مجلس حكماء فنحاول معكم بإذن الله وان كانت الامة العظيمة لا تدار ايضا الا بمجلس عظيم سواء في المضمون والقيمة او العدد ايضا المهم نحاول<br />1- الدكتور يوسف القرضاوي يكون العالم الرباني المصاحب للحاكم ومعه جمع ممن في مجلس علماء المسلمين العالمي كالكتور سليم العوا و الاستاذ هويدي وغيرهم من علماءنا الافاضل<br />2- رثيس الامة المختار احبذ بعد الانتخابات يكون الدكتور عصام العريان رجل السياسة الملتزمة والوعي الرائع و التقوى - نحسبه والله حسيبه او من على شاكلته حتى لانظلم احد قد يكون في امة محمد من هو افضل<br />3-رئيس الحكومة الاستاذ المخلص - نحسبه- الاستاذ اسماعيل هنية ومعه من الوزراء المخلصين و يكون على رأس الوزراء<br />0 وزير الخارجية الفاضل الاستاذ عمرو موسى ربنا يعطيه الصحة فهو نقطة شرف في بحر ذلتنا<br />4-الاستاذ عمرو خالد و محمد حامد وغيرهم من شباب الدعوة الان وايضا الشيخ المجتهد 0 محمد حسان والشيخ البسام 0 محمود المصري<br />4- الدكتور طارق سويدان لصناعة رجال الامة ومن يختار من المخلصين والراشد في البرمجة اللغوية والعصبية<br />5- للطب الدكتور محمود الزهار ومن يتخذه من الاطباء الحاذقين المخلصين<br />6- الاستاذ الراشد \"العراق\" للثقافة اعطاه الله الصحة<br />7- الاستاذ الضاري و غيره من هيئة علماء المسلمين في العراق للتوعية السياسية في الامة وبعض وزراء حماس<br />8- رجب اردوغان كرئيس للبرلمان<br />9- للجهاد نريد كامثال احمد ياسين رحمة الله او الرنتيسي او احد قيادات حماس الان او ممن رحلوا<br />-نحن نريد مزيدا من الشخصيات في جميع المجالات ما زالت الامة امامها دور كبير لتتبوأ مكانتها بين العالمين<br />طبعا اعتذر عمن ذكرته من العجم فلم اجد مثلهم من العرب او لااعرف حتى لا نظلم احد<br />آسف للاطالة ولكن الهم مركب لا نستطيع ان نبسطه جدا ونحن قبل ذلك لنفرز قيادات رائدة قائدة نريد امة واعية مخلصة وقاعدة قوية من الشعب الذي يعرف ما له وما عليه<br />دمتم مبدعين والسلام عليكم ورحمة الله وبركاته"
archived = "2010-03-14"
capture_url = ""

