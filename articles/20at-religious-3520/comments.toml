text = "إن حكيم الامة وأميرها بلا منازع ولا مدافع هو شيخ المجاهدين -نصره ربي وحرسه - الشيخ أسامة بن لادن ثم نائبه ألدكترور أيمن ، ثم أمير المؤمنين \"الملا عمر \" حفظه الله وحرسه الذي ضرب مثلا لن ينساه التاريخ ابدا في العزة والكرامة ، فلله درة ، وكل اخواننا من المجاهدين الذين أذلوا الكفرو وأعزوا الاسلام . هم -والله حكماء الامة ، وهم الذين ينبغي أن يقتدي بهم الشباب ويتخذوهم قدوة واسوة ؛ ليذل الكفر ويعز الاسلام ، فالاسلام دين الجهاد"
