text = "انا ارشح للمجلس هذ كل من الساده المدرجه اسماءهم ادناه لانهم اشرف من اشرف حاكم او وجه سخيف يكذب علينا بسماحته في النهار ليشرب نخب دماءنا في الليل مع عاهراته التي ليس لهن عدد<br />1- هيفاء وهبي - رئيسة لمجلس الحكماء<br />2- فيفي عبدو - نائب للرئيس<br />3- نجوى فؤاد -<br />4- سهير زكي<br />5- نانسي عجرم<br />ولاباس ان تكون هناك برلمان عربي لشرفاء العرب يتكون من جميع المنتميات الى معهد الرقص الشرقي<br />.....هؤلاء هم حكاء العر ان كان لدى العرب حكماء وانا اشك بوجودهم بالاصل ياامة ضحكت من جهلها الامم"
