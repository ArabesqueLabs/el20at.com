[[comments]]
order = 0
subject = "خللى السلاح صاحى"
author = "واحد"
text = "يا زمن الغم والهم - لما نخاف من اسرائيل ونرتعب ونقول - تهمنى علاقاتى بكم اولا - لما تعليمات اسرائيل تبقى اوامر<br />لما نخاف وننهز لما تكشر اسرائيل فى وشنا<br />لما سلاحنا صدى وباظ فى المخازن<br />لما ارتكنا على وهم اسمة السلام<br />لما بعنا مقدرات البلد ومصانع قوتها<br />لما فتحنا الحدود لاسرائيل يسرمحوا ويبرطعوا<br />نسينا عبد الحليم حافظ لما غنى خللى السلاح صاحى - خللى السلاح صاحى"
archived = "2008-01-01"
capture_url = "https://web.archive.org/web/20080101095000/http://masr.20at.com:80/newArticle.php?sid=13602"
