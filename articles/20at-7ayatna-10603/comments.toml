subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-11-26"
text = "والله حرام عليهم البنات<br />حد في الدنيا يسمس عمشا ولا مشينة<br />مين يرضى يشتم بنته بالشكل ده<br />الرسول حتى وصى باختيار أسماء جميلة لاولادنا مش نشتمهم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ana"
author = "ana"
posted = "2008-11-26"
text = "و الله انا مع الاخ الي فوق في رايه<br />و اول حقوق الابناء على اهلهم ان يختاروا لهم اسم جميل حتى النبي عليه افضل الصلاة و السلام غير اسماء الكثير من الصحابة<br />اما كاتبة المقال ن الغريب انه تقول ان البنات غروا اسمهم رغبة في جلب الحظ او في متابعة التطور و الموضة ؟؟!!!! و هذا يناقض كثيرا باقي المقال ، باين جداا انه كل الذين غيروا اسماءهم غيروها لانها اسماء قبيحة مع الاحترام و لن ترضى مثلا كاتبه النقاش ان يكون اسمها احد هذه الاسماء فيا ترى ماذا ستفعل ؟؟<br />هذا ليس مشيا وراء الموضه يا اختي هذا حق من حقوقهن و غيروها ليس لجلب الحظ او الزواج و لكن لان الاسم يسبب احراج ، الي يقرا مقدمة المقال ثم يقرا صلب الموضوع يظن انك كانك انت نفسك لم تقرئي مقالك !!!<br />شكرا على المقال"
archived = "2010-03-14"
capture_url = ""
