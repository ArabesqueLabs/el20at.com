[[comments]]
order = 8
subject = "ازاى"
author = "سامح"
text = "الاخوة الافاضل اللى بيتكلموا على الريحة و الزناخة طيب يا اخونا متشكرين بس حد يقولى هوة انت لما بتروح البحر فى الموسم بتبقى ريحته وحشة برضه ولا المسيحيين ما بيرحوش البحر فى الموسم . طيب انت لما بتسلم على مسيحى بتشم ايدك بعد كدة!!!! طيب سوال تانى طيب ما نسال شركة الميه عن كمية الميه المستهلكة فى بيوت المسيحيين والمسلمين ونشوف بيستحموا وبيغسلوا هدومهم ولا لا؟؟ طيب هو المسيحيين عندهم سخانات برضة ولا لا !؟ طيب لو عندهم يصرفوا ليه فلوسهم على حاجة مش بيستخدموها لية؟؟؟ سؤال اهم هوة فية طهارة عند المسيحيين برضه ؟؟ طيب ما تسال الاول عندهم ولا لا ؟؟؟؟؟ أهم سؤال ولو انى طولت عليكم هوة ربنا سبحانه وتعالى مش يقدر يريح عبيدة المسلمين علشان يرتاحوا من روايح المسيحيين ولا انتو عندكم شك فى حكمة ربنا؟؟ مش عارف حد عندة اجابة من غير شتايم ولالا؟"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

