[[comments]]
order = 2
subject = "تقرير الخارجية الامريكية بخصوص حرية الاديان فى مصر من يومين تلاتة فاتوا"
author = "احمد السيد رمضان"
text = "ارثوذكس المهجر عاملين هيصة جامدة فى امريكا علشان الغاء خانة الديانة فى البطاقة الشخصية وبيشتكوا للكونجرس والخارجية الامريكية وبيشجعهم يهود صهاينة علشان يودوهم فى ستين داهية<br />اولا الارثوذكس فى مصر عاملين تمييز وعلامة بيعرفوا بعض بيها وهى ان كل واحد بيدق صليب على ايدة ودى المفروض الشرطة تمنعها حيث انها تمييز عنصرى لفئة من الناس تميزهم عن بقية الشعب المصرى<br />ثانيا لو الغينا خانة الديانة من البطاقة الشخصية - ما هى الفائدة المرجوة او الفائدة لطائفة الارثوذكس - وهم لهم اسماء تعرفهم انهم مسيحيون من غير بطاقة ولا خانة البطاقة التى يريدون حذفها فاذا سالت واحد منهم اسمك اية وقال لك جورج او حنا صليب او مينا او مجلع او زخارى وكنت مسلما متعصبا هتقول لة روح روح يا ابنى مش عايزين<br />اسمة بيقول انة من الاقلية الارثوذكس وليس خانة البطاقة<br />الصليب المدقوق على ايدة بيقول انة ارثوذكس وليست خانة البطاقة<br />هدف الدعوة دى اية مش فاهم<br />دايما الاقلية دى بتعيط او بتخوفنا بامريكا<br />احنا مش بنخاف من امريكا<br />امريكا انشرمت فى العراق وافغانستان واقتصادها تدمر وان شاء اللة باقى القليل لتتفكك<br />اما الارثوذكس عندنا فنحن نراقب تحركاتهم وهجرتهم الى كندا واستراليا وامريكا وان شاء اللة اخرتهم قربت"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 3
subject = "عدد المسلمين في مصر 94% من عدد السكان علىالنحو الثابت بتقارير امريكية"
author = "الانبا بيشوي"
text = "الى المعلق السابق<br />اقباط مين وبطيخ مين دا اكل عيش يابا بيعيطوا في امريكا علشان خاطر يجمعوا تبرعات<br />تفتكر القبطي دا يهمه ايه غير رصيده في البنك<br />القبطي دا انسان ما عندهوش دين ولا مله<br />ملة ابوهم جمع الاموال وبس اوعا تصدق غير كده<br />اقباط المهجر بيجمعوا تبرعات من الغربيين وعلى رأسهم مايكل منير وعدلي ابادير<br />افتح مواقعهم على النت حتلاقي خانه مكتوب فيها (كيف تساعد، ادعم مجهوداتنا) ومرسوم صور بطاقات الائتمان<br />يعني عايزين فلوس وبس الدين عندهم شغل بزنس<br />مرة رحت ازور واحد قبطي في البيت كان زميلي في الشغل بصيت لقيت عنده ازازة خمرا حجمها عجيب كبيرة جدا علشان خاطر تصب الخمرا في الكباية عايزنلها اثنين يشولوها<br />اهما دول الاقباط فلوس وخمرا<br />انا كنت بحب الاقباط لغاية ماجه اليوم الاسود اللي كتبت فيه على محرك بحث جوجل كلمة (الاقباط)<br />وكان يوم اسود فعلا لما طلعلي موقع الاقباط متحدون واقباط الولايات المتحدة والهيئة القبطية الكندية<br />كان يوم اسود ومنيل خلوني كرهت كل ما هو مسيحي وقبطي<br />ربنا يحرقهم بجاز يا رب والنهاردة ليلة القدر"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 4
subject = "الى المعلق السابق - ليس عندتا اقباط - عندنا اقلية ارثوذكس"
author = "شايف"
text = "اخى الكريم - الاقباط هم المصريون جميعا وغالبيتهم مسلمون<br />اما الاقلية اياها فليسوا اقباط ولكن من اصول يهودية ورومانية والتسمية الصحيحة لهم هى الاقلية الارثوذكية<br />رجاءا لا تستخدم كلمة قبطى كناية عنهم"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 5
subject = "موش معفنين و لا ريحة بقهم خرة من الصيام الوسخ"
author = "محمد رسول اللة"
text = "انا الرسول اياه<br />هم فعر بيشربوا خمر علشان ربى و ربكم اعطاهم من الاخلاق و العلم و الحضارة و الاموال ما نحن نفتقدة بانفسنا ايها المؤمنون<br />هيا بنا نمتنع عن لبس الخمار و الحجاب و النقاب لانة بيخلى ريحة النسوان بتاعتنا معفنة و سخة و مقرفة خالص خالص خالص<br />و بلاش نصوم رمضان كمان علشان ريحة نفسنا و ريحة بقنا(افواهنا)بتكون كلها زى ريحة الخرة الوسخ يا عرب يا معفنين يا و لاد الكلب<br />الحمد للة امريكا و اسرائيل مطلعة دين اللى جاب ملة ابوكم<br />اتفوووووووووووووووووووووووووووووووووووووووووووا عليكم جنس قذر متخلف حقود<br />يلعن ملة دين ابوكم<br />امييييييييييييييييييييين"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 6
subject = "عيب يا شباب"
author = "سامح"
text = "يا شباب ارجوكم ما تعموش عنيك وتسمعوا بلاوى من برة . بالعقل كدة لا ابادير ولا منير بيمثلوا حد من الاقباط واحسبوها صح مثلا زى ما بعض المتطرفين اللى كانوا فى التسعينات بيضربوا الحكومه فى التسعينات هما كانوا يعنى بيمثلوا المسلمين فى مصر , يا شباب احنا بيوتنا جنب بعض و معظم الاماكن فى مصر مختلطه وهادى عشرة جنيه لكل واحد لو عرف يفرق بين المسيحى والمسلم وبعدين الاخ اللى بيقول على قزازة الخمرة يا اخونا الخمر محرمة بالثلث فى المسيحية ومستعد اجيب لكم الدلائل على كدة والاخ اللى بيتكلم عن امريكا باقوله يروح يتنيل على عينه وعين امريكا . مصر بلدنا كلنا ولا احنا عايزين امريكان ولا حتى حد من السودان . انا لا يهمنى الا بلدى فى المقام الاول مصر , مصر بلد المسلم والمسيحى والاخوة لمتعصبين من الجهتين يرحوا ينيلوا على عينهم باقولها ورزقى على الله"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

