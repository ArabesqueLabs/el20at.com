subject = "المدعو محمد اللى يدعى انة رسول اللة و لد بعد موت ابية باربع سنوات؟ (ازاى دى تحصل)"
author = "الراهب بحيرة ابو محمد اللى بيسموة رسول اللة1"
text = "هدية العيد للكلاب المسلمين المعفنين؟<br />اللى يحب يعرف محمد ابن عبد اللة حفيد عبد المطلب مين ابوة الحقيقى يجب ان يحسبها بالعقل؟<br />محمد اتولد بعد موت عبد اللة باربع سنوات؟<br />ازاى جت كدة؟<br />نسال امة بنت الشرموطة و الراهب المشلوح من المنيسة اللى اسمة (بحيرة)<br />و نعمل ليهم تحليل ال (الحامض النووى)<br />يا مسلمين يا و لاد المرة المنيوكة ام النصاب محمد اللى بيقول انة نبى و رسول اللة<br />دهة زعيم عصابة من اتلحرامية و المخنثين و قطاع الطرق"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 15
subject = "من اجل اللة و المحبة ايها المسلمين و المسحيين تجنبوا الاتهامات و الادعاءات القذرة من اجل اللة و من اجل الوطن و من اجل الاحترام و المحبة اللى لازم تكون حقيقة فى قلوبنا و نفوسنا"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "ما الذى يحدث<br />لا اصدق ما اقراء<br />من اجل اللة و من اجل العقائد المسماوية التى جميعا نؤمن بها؟<br />لنترك الدين اللة و اللة هو الذى سوف يحاسب الجميع<br />نحن بشر؟ لمازا نصنع من انفسنا قضاة و حكام على الاخرين<br />للمسلمين و المسحيين جميعا؟ هذا الذى يحدث ما هو الا انحطاط ثقافى و اخلاقى للجميع<br />الدين اللة و الوطن للجميع<br />(لا فرق لعربى على اعجمى الا بالتقوى)؟!<br />من اجل الوطن و الدين و الاخلاق انتسامى فوق مواطن الشبهات و حرام عليكم جميعا مسلميين و مسحيين و اتقوا اللة فى قلوبكم و نفوسكم و ضمائركم!<br />و اشكركم"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 16
subject = "الى منتحل اسمى و الذى سوف ادعية (مسيلمة الكذاب)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "شخص جبان معجب بما اكتبة بداء ينتحل اسمى ؟<br />جبان و يخشى مناظهارا سمة الحقيقى انهة (مسيلمة الكذاب)<br />هل حقا اسمك عورة تخاف ان تكشفها للجميع؟<br />عفوا كلماتك و احقادتك كشفت ريائكم و حقدكم الاعمى<br />(اذا لم تستح فاكتب ما شئت ) و (انتحل اسم ما شئت)"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 17
subject = "شفتوا يا اخونا"
author = "سامح"
text = "اولا انا مش سامح حنين اللى كاتب المقال هوة تشابه اسماء , ثانيا والاهم هوة لية محدش بيدقق فى معانى الكلمات والاسئلة . انا سالت اسئلة ومفيش غير شتايم من الطرفين . لا كل المسلمين هايسببوا البلد ولا المسيحيين هايهجوا منها. خلونا نشغل ادمغتنا ونفكر بيها مفيش غير ان احنا نعيش فيها سوا طبعا هايبقى فيه مشاكل بس نتغلب عليها من غير ما نشتم بعض ونسب الانبياء والمرسلين. اعقلوها وماتمشوش وراء غربان الخراب سواء كان مسيحى او مسلم اللهم بلغت اللهم فاشهد"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 18
subject = "ديانة ايزيس الام والاب ازوريس والابن حورس وبقايا الوثنية فى مصر"
author = "مفتى الفقر المعفن"
text = "الخنازير القذرة اللى بتاكل زبالة من زبالة القاهرة والخرة والقرف الكاثوليك المعفنين بياكلوها - ولحم اجسامهم القذر من الخنازير دى<br />انا لما اسلم على واحد منهم با اتقزز با اتخيل الخنزير قدامى<br />تخيل شنودة وهو حاطط كم راس خنزير وبيمصمص فيهم هتبقى ريحة امة اية<br />لحوم اجسام الناس دى نابتة من لحم الخنزير القذر<br />وبعدين هاتوا تشريع واحد فى ديانة ايزيس وابنها حورس<br />بيحطوا نفسهم فى قلايات فى الدير وينطوا على بعض زى الخنازير<br />وناس منهم يقولوا ان يسوع ابن يوسف النجار<br />وان ليسوع اخ مش عارف اية اسمة جورج على حسب الانجيل الانجليزى<br />وكل بلد ولها انجيل"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

