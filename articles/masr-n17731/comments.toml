[[comments]]
order = 20
subject = "البابا يعتذر عن التحرشات الجنسية للكهنة بالراهبات"
author = "ممدوح ذكي زخاري جرجس يعقوب ـ اسكندرية مصر"
text = "البابا يعتذر عن التحرشات الجنسية للكهنة بالراهبات<br />البابا يوحنا بولص الثاني<br />قدم البابا يوحنا بولص الثاني اليوم اعتذارا لضحايا التحرشات الجنسية للكهنة وغيرهم من رجال الدين المسيحي في أول رسالة مباشرة يوجهها للعالم عبر الإنترنت. وكانت تقارير صحفية ذكرت أن تحرشات جنسية للكهنة والأساقفة بالراهبات وغيرهن من النساء تجري في أنحاء مختلفة من العالم وهو أمر أقر به الفاتيكان.<br />وقال البابا في جزء من الوثيقة المؤلفة من 120 صفحة \\\"التحرشات الجنسية من بعض رجال الدين سببت معاناة هائلة وضررا روحيا للضحايا\\\". وشدد البابا على القول \\\"آباء المجمع الكنسي يودون الاعتذار دون تحفظ للضحايا عن الألم وخيبة الأمل التي أصابتهم\\\". وأشار إلى أن الكنيسة في الأوقيانوس تسعى لما وصفه بأنه \\\"إجراءات صريحة وعادلة\\\" للرد على الشكاوى في هذا الشأن.<br />وجاء الاعتذار الموجه لراهبات في العالم النامي في وثيقة مسهبة أصدرها البابا مستعرضا الموضوعات التي تناولها مجمع كنسي عقد في الفاتيكان عام 1998 للأساقفة من منطقة الأوقيانوس التي تتألف من أغلب الجزر الصغرى في المحيط الهادي ويضم لها أحيانا أستراليا ونيوزيلندا.<br />ولأول مرة منذ تولى منصبه قبل 23 عاما أرسل البابا الوثيقة إلى الكنائس في مختلف أنحاء العالم بالبريد الإلكتروني عبر الإنترنت.<br />وفي مارس/ آذار الماضي نشرت مجلة ناشيونال كاثوليك ريبورتر الأسبوعية ومقرها الولايات المتحدة سلسلة من الموضوعات عن تقارير داخلية في الفاتيكان بشأن التحرش الجنسي للكهنة والأساقفة بالراهبات وغيرهن من النساء في مختلف أنحاء العالم، واعترف الفاتيكان بوجود المشكلة.<br />وقالت التقارير الداخلية إن بعض الكهنة والمبعوثين أجبروا الراهبات على ممارسة الجنس معهم وفي بعض الحالات اغتصبوهن وأجبروهن على إجراء عمليات إجهاض. وأشارت التقارير إلى حالات في 23 دولة بينها الولايات المتحدة والفلبين وإيرلندا وبابوا غينيا الجديدة."
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 21
subject = "النبي محمد صلى الله عليه وسلم"
author = "ومبشرا برسول يأتي من بعدي اسمه احمد"
text = "علشان خاطر نعرف النبي محمد صلى الله عليه وسلم نتبع الخطوات الاتية<br />1) نقرأ كتاب عن حال الجزيرة العربية قبل الاسلام وكيف كان يعيش العرب الهمج<br />2) نقرأ سيرة النبي محمد عليه الصلاة والسلام 23 سنه لدراسة المنهج الذي جاء به النبي محمد عليه الصلاة والسلام<br />2) نقرأ بعد كده كتاب يوضح كيف انطلق تلامذة النبي محمد صلى الله عليه وسلم الى فتح الشرق والغرب وفي اقل من 100 عام كانت دولتهم من اسبانيا الى الهند وكيف دخل الناس في الاسلام افواجا<br />اللهم صلي على محمد وعلى ال محمد كما صليت على ابراهيم وعلى ال ابراهيم وبارك على محمد وعلى ال محمد كما باركت على ابراهيم وعلى ال ابراهيم في العلمين انك حميد مجيد<br />وبعدين الاخ اللي شتم في النبي محمد صلى الله عليه وسلم النبي محمد لم يخسر شيئا انت اللي خسرت واخر واحد دخل في الاسلام اشهر قسيس امريكي اسمه<br />يوسف استس<br />يا اللي شتمت النبي محمد اكتب على محرك بحث جوجل يوسف استس وشوف لماذا القسيس الامريكي الشهير دخل في الاسلام وشوف كام واحد اسلم على ايده<br />واقول حاجه كمان ارجو ان تدرسوا كيف تحول اهل مصر من الوثنية والمسيحية الى الاسلام واصبحوا 94% من عدد السكان<br />وربنا يهديكم وتسلموا"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

[[comments]]
order = 22
subject = "اتهام القسس بالاعتداءات الجنسية باطل - لية"
author = "شلضم بلضم"
text = "لان القسيس لا مؤاخذة ما لوش فى اللون دة<br />دى بيعمل توكيل لواحد مسلم يقوم بعمل اللازم مع زوجتة وبناتة وشوفوا قضية زوجة القسيس بتاع البحيرة اللى اسلمت وحبسوها فى الدير<br />والبنات عارفين سكتهم كويس كل بنت بتتعرف على واحد مسلم وبتتزوجة وينتهى الامر وبعدين ييجى خنازير المهجر يهللوا فى امريكا - الحقونا دى المسلمين بيخطفوا البنات - المسلمون بيخطفوا البنات - طيب لو البنت لقت واحد راجل فيكم كانت راحت او هربت مع واحد مسلم<br />المسلمون بيخطفوا ويغتصبوا بناتنا - جملة تقرأها فى كل موقع قبطى<br />ماهى البنات مش لاقية راجل فيكم يا مخنثون يملىء عنيها فلجات للاستعانة بصديق<br />65 الف قضية طلب طلاق امام المحاكم للجالية النصرانية فى مصر والسبب عدم قدرة الزوج الجنسية وعدم قدرتة على اداء الواجب الزوجى وعايشين مع بعض زى الاخوات<br />عدد كبير من النصارى عارف ان لزوجتة رفيق وعشيق وبيطنش لانة مش قادر وبيقول على العشيق او رفيق زوجتة لقب ماشية مع ولد مسلم صايع"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"
