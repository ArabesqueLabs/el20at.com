[[comments]]
order = 10
subject = "الى سامح حنين"
author = "مش الانبا ويصا"
text = "لكل فعل رد فعل مساو له في المقدار ومضاد له في الاتجاه<br />كل اللي انت بتقرأه دا رد فعل للي بنقرأه في موقع عدلي ابادير ومايكل منير<br />وحوريك حته من مواقع الاقباط شوف بيقولوا ايه على النبي محمد صلى الله عليه وسلم<br />اقرا يا سامح يا حنين شوف بيقولوا ايه على النبي<br />ما ورد بسيرة بن هشام واضح<br />فعلا واضح لانه ما اتى به النبى من هتك العرض فى حديثه هو الكلام<br />وبالنصر الى الايات القرانية والاحاديث المختلفة نجد ان هتك عرض محمدك هو امر متوقع من رسول عديم الشرف مخنث شاذ لوطى يحب الفحشاء قذر فتارة نجد ان محمد يحتضن من زاهؤر من الخلف وتارة نجد انة يستقبل الرجال عريانا كما ولدتة امة لدرجة ان عائشة قالت والله ما رايت رسول الله عريانا من قبل ولا من بعد كهذا ومص الاعضائ الذكرية ومصة للالسن بنجاسة وجعل عائشة تخرج ثدييها وترضع الكبار ونرى ان محمد كان يشم رائحة الجنة بين ثدى فاطمة والعد والعديد من القاذورات التى يقشعر لها البدن<br />ايه رأيك يا سامح حنين قولنا ايه رأيك<br />صدقني يا سامح حنين انا نفسي ادخل حرب ابادة مع الاقباط يا هما يخلصوا علينا يا احنا نخلص عليهم<br />وخلي بالك امريكا على وشك الانهيار شفت الاعصار اللي جه دا اسمه ايك وبعدين ازمة مالية عالمية طاحنة<br />فقول لاقباط المهجر ما يفرحوش كتير العملية قربت اوي اوي اوي"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233544/http://masr.20at.com:80/newArticle.php?sid=17731"

