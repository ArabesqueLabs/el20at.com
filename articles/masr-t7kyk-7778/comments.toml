text = "سأحكي لك يا حائط الصمت انت تصغي الي وبي لا تشمت سأحكي لك الحقيقة التي صروا عنها اذانهم فصمت ولم تعد تسمع<br />سأحكي واقع دفن تحت التراب ونحن عليه نركع لكننا لا نراه ولسنا الا بالذي نراه نقنع<br />سأدلي بعبارتي الدفينه فالحق لا بد سيسطع<br />يا حائط الصمت<br />قد قال ربك انه منزل الملائكة على من تاب وآمن وعمل صالحا واستقام فهل انت بكلمات ربك القدسية لا تؤمن ولها تنكر وعنها تصدع<br />قد قال ربك ومن يتق الله يجعل له مخرجا وكانت مخرجي وعذري الذي به راسي ارفع<br />يا حائط الصمت لو كنت تسمعني لكان من قولي عليك نهر ا به ترتوي وتشبع<br />تفكر بكلامي ولا تكن عنه لاه لا تسمع<br />الحمد لله الذي يستحق الحمد و يضاعف الحمد وبه ينفع<br />الحمد لله لا ما قالت سطوري ولا ما توارى في قلبي فليس قدر ربي ولا ما يستحق بل اكثر واكبر<br />من كلام قلب مبدع<br />وبعد يا رب ان الامر لك فإبعث الحقيقة في سطري وعلها بعونك تقنع<br />اما بعد سأحمد ربي واسرد قولي يا حائطي فالوقت بعد قليل عني سيمنع<br />جلوسي هاهنا فأطوي الحقيقة في قلبي وامنع"
