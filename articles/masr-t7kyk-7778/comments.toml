text = "لااملك لنفسي نفعا ولا ضرا الا من خط علي قدر من زمان<br />وقال له الرحمن كن فكان<br />ما اتكالي الا على بارئي الولي ذو الجلال والاحسان<br />وما ابث شكواي الا لقلب طواني بين ضلوعه بحنان<br />قلب اكبر من كل ما يجول في الفكر والوجدان<br />قلب الهي الاعظم الرقيق الحنان<br />لا ما مسني من عيشي لغوب ولا حرمان<br />ما دمت ذاكره في خلدي فضل ما مس انسان<br />توال افضال علي لا احصي ثناء ولا شكران<br />مالعيشي انا انا ذات خافق لا يتوقف عن شوق وتحنان<br />لربي وماولائي ابدا لإنسان<br />ولا اعد غايتي مطلبا لأسعى اليه وما اسلمه الا لمالك الملك المهيمن الرحمن<br />احبكم نعم لكني احبكم بالله لا بفضل منه عليك المنان<br />ولا بظاهر لاا جد له تفسيرا وعرفان<br />وانما تجتاح في مشاعري وتنصب كنهر ريان<br />كل حاجة تخص الرحمن<br />ونوره من وراء الاحجب لي بان<br />لااعلو عليكم انا ضعيف غلبان<br />انا مجرد انسان"
