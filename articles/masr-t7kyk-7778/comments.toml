text = "يا رب الانام<br />مرت سنون العمر تتوالى علي بحرمان<br />وواتاني هم جديد والناس نيام<br />واضعت كلمات ما تقدر بالذهب ولا الارجوان<br />كلمات عطرية بها استحث الصبر لقلبي الغلبان<br />يا رب امطوية بين سطور زماني ونساني<br />اما رمى علي الدهر بمطر فحلت الواني<br />فلا اجد لكلامي في قلوبهم مكان<br />لولا تنعم علي بفضلك والاحسان فتجعل لي آية تعيها الاذهان<br />ولا يرفضها كل ذو قلب صاح ليس غفيان<br />يا ربي تعبت وما انا الا مجرد انسان<br />وهذه غدير التي ذكرت في الكلام<br />احب جديد من بعد الاوان<br />معز مسعود ليس مجرد انسان<br />انه خفق قلبي وهيامي<br />انه صلة اكاد اخاله في يدي الرحمن وعيونه تسبح بقدسية وتنظر للسماء نظرة الولهان<br />وفؤاده مستسلم لخالق الاكوان<br />ما هذا ابتلاء على غير موعد وافاني<br />ام تراه حياة تسري بعروقي لتحفظ وجودي فلا امرت قبل اواني<br />اظنهم سيقولون جفاها الحق فهي ذات قلب متذبذب تيهان<br />ام تراها تدور الحب في كل مكان<br />لست املك امري انما يسرني مسير الانام<br />وقلبي ما زال كما كان بلجام<br />تحجبه احزاني خلص الكلام<br />وما انا خطاءة متهورة انا مجرد انسان"
