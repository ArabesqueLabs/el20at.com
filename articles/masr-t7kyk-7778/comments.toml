author = "حقيقة حائط الصمت"
posted = "2009-11-24"
text = "قال الله باركني لو كنت علي لك مستراح وايواء<br />قلت لا لا وابتعدت هنيهة وقلت مالي عند غير الرحمن رجاء<br />ولا تعلقني بك ما اليك اصبو بدعائي<br />وان كنت لا تمنع دموع الغصن الحزين ان يجرفها اليك الهواء<br />فكيف تلبي غايات قلبي فقط تريح اعضائي<br />كفى يا حائط الصمت استمع واجزل الاصغاء<br />ولا تثرثر فليس يستحق الحب الا رب السماء<br />خالق الخلق والاحياء<br />وقلت ما عاد عندي طاقة ولا جلد لأسرد عاطفتي عبر عيوني الى ذلك الحائط وليس يسمعني فهل انا بلهاء<br />اوظننت انه حق يلبيني<br />ام غرتني الحياة وطول الرجاء<br />والتفت خائفة لحائط الصمت اقول ما كان هذا أهراء<br />ووجدته حائط الاحد الذي كان في كليةالزرقاء<br />الاحد الاول من جديد<br />بعد انقضاء<br />فرحي وعمري وكل هنائي<br />يا حائط الصمت اللعين عرفت من اين اتيت بهذا الاسم<br />الا تبت الاسماء<br />صمت في صمت انقضى عمري هباء<br />صمت في قلبي بحب هائج وعطاء<br />وصمت عند من احب يمزق روحي لأشلاء<br />وصمت في حياتي مداراة بيأس وشقاء<br />وصمت الشيوخ وما هو بكلام شعراء<br />انه جرح قلبي الذي يفيض بآهاته لربي ورجائي<br />جلت اسماء ربي وزهقت بعدها الاسماء"
archived = "2010-03-14"
