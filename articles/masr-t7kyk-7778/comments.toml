text = "لما بدك ترجع لربنا وتمشي على الطريق الصح<br />استغفر لأ<br />طب اتوب لأ<br />طب اتصدق صدقة خفية الصدقة الخفية بتكفر السيئات لألألألأ<br />طب احج لأ<br />طب شو اعمل الزم المسجدلأ<br />طب اصوم الصوم لله وهو يجازي به لأ<br />طب انتحر اذا شو بدي اعمل<br />كل اللي انت ذكرته هوه جدران البناء ما تصلح جدران بناءك<br />صلح القاعدة علاقتك بربنا حبك اله تعامله معه كيف ظنك فيه احساسك فيه<br />والباقي كله بصلح لحاله<br />انا عشانك ما تضيع وقتك وتتعب على الفاضي"
