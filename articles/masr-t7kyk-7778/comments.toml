text = "سطور اخطها لااعرف ان كانت ستعبر عما اريد<br />الحق ربنا فالحب الحق هو متعلق به حب فيه وما دونه باطل والحب هو الدين والحب هو القرب من رب العالمين والحب هوالقرءئان كلام ربي والحب هو الرسالة المقدسة كلام ربي والحب هو معز مسعود مادام مرضيا لربي طائعا قريبا منه<br />فدع الباطل واذهب للحب فكم عطاك الله حبا<br />احسن خلقك وهذا حب<br />جعلك ذكيا وهذا حب<br />جعل قوامك رشيق متناسب وهذا حب<br />وعلمك وهذا حب"
