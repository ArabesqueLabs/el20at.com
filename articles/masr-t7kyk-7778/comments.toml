text = "لنحل 2<br />ينزل الملائكة بالروح من أمره على من يشاء من عباده ان انذروا انه لا اله الا انا فإتقون<br />جبريل عليه السلام هذه عن الرسل لينذروا لكنها ايضا ليس فيها حصر<br />القدر 4<br />تنزل الملائكةوالروح فيها بإذن ربهم من كل امر<br />ماذا ماذا تنزل الملائكة الله اكبر كل عام تنزل الملائكة وتقولون انقطع الوحي مننذ وفاة الرسول اوليس الملائكة هم الوحي<br />طه 38<br />ولقد مننا عليك مرة اخرى اذ اوحينا الى امك ما يوحى<br />مرة اخرى يوحي الله لبشر عادي ولأنثى<br />القصص 7<br />وأوحينا الى ام موسى ان ارضعيه<br />مرة اخرى يوحي الله لبشر عادي ولأنثى"
