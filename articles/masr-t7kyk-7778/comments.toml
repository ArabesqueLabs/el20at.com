text = ":zzz سورة فصلت آية 30<br />إن الذين قالوا ربنا الله ثم إستقاموا تنزل عليهم الملائكة الا تخافوا ولا تحزنوا وأبشروا بالجنة التي كنتم توعدون – نحن أولياؤكم في الحياة الدنيا وفي الآخرة ولكم فيها ما تشتهي أنفسكم ولكم فيها ما تدعون<br />ان الذين وليس ان الانبياء ان الذين هذه عامة تضمن الجميع لكل الناس قالوا ربنا الله أي تابوا ثم استقاموا تنزل عليهم الملائكة تنزل عليهم يطمئنوهم لاتخافوا ولا تحزنوا أي اطمئنان ولا اسف على ما فات أي راحة ثقة بالله ودعم لهم استمروا وابشروا بالجنة<br />نحن اولياؤكم ما معنى ولي نصير مؤيد محب وفي الاخرة اذا تتحدث عن الدنيا ايضا في الدنيا وفي الاخرة كيف يتولونهم لو قلنا يستغفرون لهم<br />قالها الله في بعض المواقع لولو كانت القصد لقالها ثم لم لا يستغفرون من السماء لم يتنزلون ثم ان الآية التي فيها ان الملائكة يستغفرون لنا هي انهم في السماء يستغفرون لنا<br />اذا ماذا يفعلون يحفونهم وماذا استفادوا من هذا<br />اذا ربي الله ثم استقم وستتنزل عليك الملائكة وليس تنزل اذ تتنزل أي بالتدريج والله اعلم<br />لماذ يتنزلون ليطمئنوك ويؤيدوك ويبشروك بالجنة<br />نزلت على غير الانبياء"
