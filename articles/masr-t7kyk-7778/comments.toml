text = "أحتازت مشاعري الحدود وفاض نبعي الصغير عليكم من قلبي بجود<br />إشراقة الشمس تبعث الحياة والنور يحطها رقة تجعلها سلام من كل حر ومن حولها طيف عبق وعطور<br />سبحان الذي ليس كمثله شيء ونوره نور على نور<br />آية الله في خلقه تتبدى لنسبحه ويدرك جماله عجز العقول فهذا معز مسعود<br />وباطنه حب كبير طهارة قلب ما تكتفي ولا تمنع بقيود فتظل تزيد ولربها ترتقي روحه الشفافه فالحق على قلبي تعيد الا ان في الكون آيات شديدة الوضوح فسيرو ا فيها وتاملوا آية الله في معز مسعود وقلب مسكين خاضع باللوم الكبير كلماته بلسم لكل قلب ضائع او مريض ماذا أقول سبحان الذي أتقنت يداه وقال له كن فكان رب الكرم والجود<br />؟"
