text = "اكرهها واشتهي قتلها وانني احب كرهي لها<br />احب هذا اللؤم في عينها وازورها لو زورت قولها اكرهها<br />عين كعينالذئب محتالة طافت اكاذيب الهوى حولها<br />اكرهها هكذا سيقول معز مسعود<br />آه ياقلب<br />طوى سنين عمري مثل فكرة<br />وجاء يسقيني بعد غياب مرا<br />ضحكة ترتسم علىمحياه قهرا<br />ويد تعد البسالة غدرا<br />وبريق في عيونه يلمع جمرا<br />وجفون يبدو عليها ارقا وسهرا<br />اذهب لا التمس عندك عذرا<br />كفاني من عبارات ربي سطرا<br />مجدا ابديا شرفا وفخرا<br />اذهب فان قلبك مثل صخرة<br />بر ربي لا ارجو منك برا<br />اصمتفي عيونك دراا<br />حقيقة يخفيها كبرياؤك حب مدرا<br />اقولولا اخفيك اليوم سرا<br />بت عندي ماضي ولى وفر<br />وحنين الامس قد امسى ذكرى<br />خانتك عيناك .اممممممممم..خانتك عيناك اممممممممم انا بحكي في زيف وفي صدق وغرك البهرج الخداع خادمتي"
