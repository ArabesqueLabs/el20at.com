posted = "2009-11-24"
text = "عدت ادراجي من بعد رحلة عمري المثقلة بالاعباء<br />وجعلت اخلع عباءة التعب وانفضها<br />ثم رميتها على فرع شجرة فاجهشت بالبكاء<br />قالت في غياهب الصمت ياللعناء<br />انها مضرجة بالدماء<br />فقلت وقد تنفست الصعداء<br />جراح قلبي الذي تصدع من ندائي<br />وضاعت الاسماء فبماذا انادي وهل يجدي ندائي<br />قالت بلا ريب تحتاجين لطبيب ودواء<br />كيف كان لك بعد هذا النزيف بقاء<br />قلت وقد تصعدت روحي من الآه للسماء<br />كفى رياء<br />اواتحسين من بين الاحيان<br />لا غير حائط الصمت يسمع او يشعر بدائي<br />وركزت ظهري على الحائط وقلبي مستاء<br />فقال مابك ان ظهرك صار الى انحناء<br />قلت تثاقلت علي هموم الحياة ولا اعرف لهذا الحال فناء<br />قال ان حالك بحق يا غدير ساء<br />فقلت اخرس انت ايضا ما عاد يجدي حديثي اليك وما عاد لي عندك رجاء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 60
