text = "الانعام 121<br />وان الشياطين ليوحون الى أوليائهم ليجادلوكم<br />وسوسة الشيطان ايضا وحي لذا فلربما نصيب ونخطئ لذا لا بد ان نستخدم عقولنا في تحليل ما عندنا وفي تحري الحق في كل امر نظن انه قد يكون وحيا<br />الكلام نزل وانا غائبة البال عنه كنت استبعد ان يتكون منه جملة مفيدة واحسست بشيء تصعد مني للسماء حين انتهى وعلي قسم على كتاب الله انه الحق والكلام يصف الحال ولساني عجز عن ذلك .... الخ نبحث هذا فيما بعد<br />الأنعام 121<br />يوحي بعضهم الى بعض زخرف القول غرورا<br />وسوسة الشيطان وحيا لكنه بائن انه يخالف الحق واين مخالفة الحق فيما أقول<br />الأنفال 12<br />اذ يوحي ربك الى الملائكة اني معكم<br />الملائكة يوحى اليهم اذ كلام الله المباشر يسمى وحيا ايضا"
