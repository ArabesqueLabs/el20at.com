text = "لأنعام 93<br />ومن أظلم ممن إفترى على الله كذبا او قال اوحي الي ولم يوح اليه شيء ومن قال سانزل مثل ما أنزل الله<br />أعلم هذا وما يكون لي ان افتري على الله الكذب وأقول اوحي الي ولم يوح الي شيء الني أخاف الله رب العالمين<br />ولا أقول لكم الا كما قال نوح لقومه يا قوم ان كنت افتريته فعلي اجرامي وانا بريء مما تجرمون<br />ما جرى وأخبرتكم به حين اوحى ربي الي بخصوص تلك المغلوطات<br />في منتصف اليل حين قال اصبري ثم قال اولا تريدين ان تصبري وفي النهار حين نزل الملائكة يردون ويدحضون كل حجة باطلة<br />وفي امر انبائي بالغيب ماذا تقولون وكم الف مرة تكرر ذلك<br />لولا تصدقون لم ساكذب عليكم<br />ثم لو كانت كلمات مقدسة فإنها ستجلب الخير على الجميع لو تتجاوبون معي ربما هناك الف الف حجة لا تحضرني الآن لكن ربي سيظهر الحق ويزهق الباطل ان الباطل كان زهوقا<br />ثم انه لما كان عهد سيدنا موسى عليه السلام كليم الله ذهب به الى بين السدين ليقابل الخضر ومن الخضر رجل عادي انزل الله عليه الوحي او اوحى اليه بصوته فأمره باشياء ليطبقها وما كان يعلم سيدنا موسى عنها اذا لو كنتم في ذلك العصر لكذبتم ان الخضر اوحي اليه وأنه يعمل بأمر ربه"
