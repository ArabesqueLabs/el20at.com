text = "انا يا شيء من الدنيا<br />مجرد عاشقه لله قلبها قبل اعضائها يركع<br />انا يا حائط الصمت فتاة اعيش بلا هدف ولا انفع<br />فلم اجد غير ربي يعترف بوجودي وبي يقنع<br />جافني قول لساني فإحتبس كلامي وليس يطلع<br />فلا أجد دفاعا به عن نفسي وعن كل شيء من عملي يتبع<br />قد اوحى ربي الى ام موسى ان القيه في اليم ان خفت عليه<br />ولا تحزني انه لك سيرجع<br />لم تكن نبية ولا وليه من اوليائه الذين بهم الحق يرفع<br />قد اوحى ربي الى مريم العذرية انه ملق عليها معجزة ولم تكن بالحق بعثت للناس رسولا يامر ويردع<br />قد قال ربي انه يكلم الناس من وراء حجاب او وحيا او يرسل رسولا به الحق يسمع<br />ما قال رسلي فقط اكلمهم والخير هذا عن غيرهم امنع<br />ماقلت قديسة ولا نبي ارسل بالحق<br />وانما اختارني ربي بفضل منه ولست له احجب او اياه عن الناس امنع<br />هذا شرف شرفت به فلتتشرفوا معي ولله نشكر ونسجد ونركع<br />هذا تأييد كلمة حق ادلت اليكم عن طريقي بها تعلمون ان الحق ملازم لكم وليس فضله عنكم يمنع فتقربوا اليه انه مجيب لكل من يطلب وليس يعبأ الا بما يسمع<br />ماذا اقول وهل وصل قولي الى قلوبكم ام لم يتجاوز اذهان تسمع<br />ربما لكلامي ملحق يتبع"
