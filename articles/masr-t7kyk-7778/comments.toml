text = "اآل عمران 42<br />واذ قالت الملائكة يا مريم ان الله اصطفاك وطهرك<br />نزلت على غير الانبياء<br />آل عمران 45<br />واذ قالت الملائكة يا مريم ان الله يبشرك بكلمة منه<br />الشورى 51<br />وما كان لبشر ان يكلمه الله الا وحيا او من وراء حجاب او يرسل رسولا فيوحي بإذنه ما يشاء انه علي حكيم<br />طرق تكليم الله للبشر لالبشر من البشر وليس الرسل<br />وحيا كلام مباشر او من وراء حجاب أي يضع الفكرة كاملة في عقلك دون ان تسمعا بكلمات لكنك تدرك انها قيلت لك او يرسل رسولا أي ينزل ملكا<br />قال الله او يرسل رسولا لم هل يخطئ الله حاشاه وهو يتكلم عن البشر العادي قلنا اذا ينزل ملكا على البشر العادي ثم ايهما اعظم ان يكلمك الله ام ان يرسل رسولا والله قال انه يكلم البشر البشر ليس الرسل والله يختار الفاظه بدقه في هذا القرءان المعجز"
