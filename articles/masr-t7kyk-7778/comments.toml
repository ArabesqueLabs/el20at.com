text = "راحتي ان اكون....مجرد انسان<br />اتجرد عن الهموم وعن الاحزان<br />اتجرد عن كل تفكير بالغد واتركه للأوان<br />اتجرد عن حب الدنيا والولهان<br />اتجرد عن التعلق في كل زيف واصحو من غفيان<br />اتجرد عن التكلف بدعائي ونظم الكلام<br />وادعو ببساطة بين يدي الرحمن<br />راحتي بساطتي وان اكون مجرد انسان راحتي تواضعي ان اقف بمكاني<br />لست خير الناس ولو آثرتني يد الحنان<br />بكرم وفضل ما كان الا من زمان<br />بكلمات تساوي القرءان<br />كلمات الرحمن<br />حروف قدسية خطتها يدا انسان بوحي من رب الانام<br />لا اعلو عليكم فلا تظلمون وصدقوني انا مجرد انسان"
