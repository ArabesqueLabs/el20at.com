text = "حين تجمع يدي بديع السماوات والرض الرقة فوق الرقة وتجعل الباطن عذبا نقيا فإن نظرة اليه تحيي روحي وتروي ظما عروقك وغن كلمة منه تفوح عبقا طيبا على قلبك فتنظفه وتهدئه وتريحه وتبعث فيه سعادة طويلة الأمد<br />حين تضحك فتبعث امواجا عذبه عبر الاثير فتجعل الدنيا ترتئي كلوحة ذي الايدي الطاهرة الذي خلق الوجود بعد ان ينزل الغيث فيجلو صفحه الكون وترتاء بوضوح للناظرين<br />وتبعث الفرحة لتزيل كل هم راسخ عميق من كل قلب مسكين<br />وجب الشكر علينا بك يا معز ما تم كلامي لكن تالكلام المسموح هنا جدا قليل<br />الحمد لله أكرم الأكرمين"
