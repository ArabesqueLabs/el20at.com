text = "آهات أبعثها لكم عبر السطور تنهيدات لقلب مولع غريق لكن المل له مفارق فأنتم عني بعيد وفي يدكم قيود فماذا أقول روحي شريدة حولكم تجول وقلب عندكم بتضرع منيب لربي اللطيف ان يحفظكم من كل شر وسوء وان يظل الخير عليك يزيد<br />لكن شوقي ليس يرويه كلمات تنتقل عبر الجهاز الصغير وعقلي شريد فكيف أعيش<br />ما انا رهن لحب بشر وما انا الا ذات قلب عنيد متكبر الا على ربي العظيم له يرضخ وينيب لكنكم لمستم قلبي بكلمات في اعماقه فظل لكم ينحني بسجود تواضع ومن قبل كانت حاجتي فقط لرب الوجود فكيف الطريق الا شفاء او الى اتواء وانت بعيد<br />عاشقىة الرحمن أضحت لرضوخ لشخص جديد وماذا بعد يا قلب افلا تتوب أقاتلي يا قلب ما كفاك ما كان منك يضيم لأتبعن عقلي وتبوء بذل ترتجي وتعيد وما البيك انك عنيد<br />وتقودني لجرح جديد<br />كفا من ينفع القول وليس الا ما قدر الله وخطت يداه فله عود وتضرع عسى مخرجك من عند العلي الودود<br />عيش بجوار الرحمن في جنة الدنيا هذا مطلب كبير لا يقبل بك معز مسعود أظنك تجاوزت الحدود<br />فتوب تب من قريب لئلا لا يقبل الرحمن توبتك من بعد هذا فتمسو حسير<br />اعد روحي الي يا معز مسعود اعيش بها عيشا حقيقي او عد الي بها فتظل قريب"
