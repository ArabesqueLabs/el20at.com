subject = "الى الاستاذ مش فاهم"
author = "مش لازم"
posted = "2008-02-02"
text = "اعمل ايه يا استاذ مش فاهم بعد كل البلاوي اللي في البلد البابا شنده طلع عنده شذوذ جنسي وبيتعالج من مرض ناتج عن ممارسة الشؤوؤ<br />وبعدين الاقباط سايبيله وعمالين هارين المسلمين رضاة الكبير وبول الابل والتبرك ببول الرسول<br />طيب ما يشوفوا الزفت اللي عندهم ويسبونا في القرف اللي احنا فيه"
