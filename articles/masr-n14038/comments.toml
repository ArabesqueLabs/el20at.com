subject = "400 الف طفل فى سن الالزام لم يدخلوا المدارس"
author = "جريدة المصرى اليوم"
posted = "2008-02-02"
text = "وجع فى قلب الوطن واخبار تصيب بالاكتئاب وتجعلنا نسير فى الطريق المشابة للصومال ودارفور<br />نشرت المصرى اليوم ان 400 الف طفل لم يلتحقوا بالمدارس لعدم وجود مدارس حسب افادة التربية وسينضموا الى طابور الامية والجهلة<br />فين الدولة ؟<br />الكبير قاعد فى الشرم ياكل هو والحاشية جمبرى واطفال البلد فى الشوارع ومفيش حد بيحاسب حد<br />واللى يغيظ انة بيتكلم عن المنجزات والمكتسبات بعد ما خربت"
archived = "2010-03-14"
