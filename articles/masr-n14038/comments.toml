[[comments]]
order = 3
subject = "تعلموا من الحمار يا حمير"
posted = "2008-01-30"
text = "شوفو الحمار الذكي؟؟؟؟؟؟<br />في أحد الايام وقع حمار في بئر غائر. أخذ الحمار يصرخ لساعات بينما كان الفلاح يحاول التفكير في طريقة لتخليص حماره. أخيرا قرر الفلاح أن الحمار صار عجوزا وليس بحاجته وأن البئر لابد أن يدفن على اي حال. لذلك فلا فائدة من إنقاذ الحمار.<br />قام الفلاح باستدعاء كل جيرانه لمساعدته في دفن البئر. فأمسك كل منهم معول وبدأ يسكب الرمل والوسخ في البئر. عندما استنتج الحمار ما يحدث بدأ يرسل صرخات عنيفة. وبعد لحظات هدأ الحمار تماما.<br />حدق الفلاح في أسفل البئر فتفاجئ مما رآه. ففي كل مرة ينسكب فيها الرمل من المعول يقوم الحمار بعمل شيء مدهش. كان ينتفض ويسقط الوسخ في الاسفل ويأخذ خطوة للاعلى فوق الطبقة الجديدة من الوسخ.<br />بينما الفلاح وجيرانه يلقون الرمال والوسخ فوق الحمار كان ينتفض ويأخذ خطوة للاعلى. وبسرعة وصل الحمار لحافة البئر وخرج بينما انصدم واندهش الفلاح وجيرانه.<br />الفائدة المستفادة الحياة سوف تلقي عليك بالاوساخ، كل أنواع الرمل الوسخ، وفكرة الخلاص من البئر هي أن لا تدع الاوساخ تدفنك ولكن تنفضها جانبا وتأخذ خطوة للأعلى. كل مشكلة تواجهنا في الحياة هي حجرة يجب أن نخطوا فوقها. نستطيع الخروج من أعمق بئر فقط يجب أن لا نتوقف ولا نستسلم أبدا، وتذكر انفضه جانبا وخذ خطوة فوقه."
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

