[[comments]]
order = 6
subject = "جحش عنابى"
author = "ى"
text = "المليارات اللى بتتصرف على الامن المركزى ومباحث امن الدولة والمعتقلات - لية ما بنحسنش بها اجور الناس ونحسن الخدمات ونخللى الناس ترتاح فى عيشتها<br />غزة محاصرة والناس اللى فيها كسرت الحدود وهربت على جيرانها<br />ومصر جوعوها الكلاب وشبابها هرب من الحدود وبيغرق فى البحر على شواطىء اوروبا<br />اية الفرق بين حصار غزة وتجويع شعب مصر او تجويع وتشريد شعب العراق<br />ابحثوا عن عملاء امريكا"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 7
subject = "الى المحامي ممدوخ نخله مخلص الاقباط"
text = "الاقباط بيدعوا ان سوزان مبارك كانت مريضة بالسرطان وشفيت بشفاعة الباباوات الشواذ والماماوات السحاقيات<br />وهنا نتسائل لماذا الباباوات والماماوات لم يشفوا البابا شنوده الكبير اللي رايح جاي على بلاد الغرب يتعالج من مرض الهربس اللي جالوا من ممارسة الشذوذ الجنسي ومش عارفين يعالجوه<br />بصوا شوفوا غجر الاقباط بيقولوا على سوزان مبارك ايه<br />ونرد ونقول ان سودان مبارك وحسني مبارك هما اللي حمينكوا ولو تخلوا عنكم المسلمين حيخلصوا عليكم في 12 ساعة بالضبط يا شوية 6% من عدد السكان<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />انا سمعت ان سوزان كان عندها سرطان فى الدم والعدرا وابو سيفين وامنا ايرينى عملوا معجزة<br />ياريت كانوا سابوها<br />بس ده اللى سمعته من ناس هنا<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــتتت<br />الغريب يا جماعة ان الام الفاضلة جدا سوزان مبارك المفروض هي اول واحدة تدافع عن حقوق المسيحيين هي وباقي عائلتها المباركة وده لأن اله النصاري ده هو اللي انقذها من الموت وشفاها بشفاعة القديس العظيم ابي سيفين والقديسة تاماف ايريني .. وهي عارفة كدة كويس .. لكن هنقول ايه زي القطط ياكلوا وينكروا ... خوفهم علي كراسيهم اعمت قلوبهم ... فليكون الله مع اولاده ماريو واندرو وينقذهم من اعدائهم ... فلا يحتاجوا لزراع بشر .. امين"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 8
subject = "الاخ اللى فوق"
author = "لب"
text = "ولية التلبيخ والكلام اللى مالوش لزمة عن النصارى والست سوزان - انت محروق لية - ما يعالجوها يا اخى - طيب ماهم اولى من الغريب ثم ان السيدة الكريمة ام الست سوزان كانت بريطانية ومسيحية زيهم<br />يعنى مش غريبة<br />زيتنا فى دقيقنا - وبارك اللة فى النصارى اللى عالجوها<br />وربك يشفى الجميع"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 9
subject = "فليكون الله مع اولاده ماريو واندرو وينقذهم من اعدائهم"
text = "دا تعليق مأخوذ من احد المعلقين المسيحيين<br />فليكن الله مع اولاده<br />ايه هو ربنا سبحانه وتعالى عنده ولاد تاني غير المسيح مش قلته عنده ابن واحد طلعله اولاد كمان<br />استغفر الله العظيم (سبحان ربك رب العزة عما يصفون)"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 10
subject = "الى الاستاذ لب"
text = "يا استاذ لب انا ما تدخلتش في مسالة سوزان ولا يعنيني اي شيء كونها كانت مسيحية او غير ذلك<br />اقرأ تعليقي كويس<br />انا بقول اذا كانوا هما اللي خفوا ماما سوزان<br />امال ليه البابا شنوده رايح جاي على اوروبا للعلاج من مرض الهربس اللي جالوا من ممارسة الشذوذؤ الجنسي<br />كان الاولى ان اللي بيقولوا عليهم القديس العظيم ابي سيفين والقديسة تاماف ايريني<br />ييشفوا البابا شنوده من سوزان<br />دا اللي انا قلته<br />وبعدين كون ان سوزان مبارك امها انت مسيحية بس سوزان اسلمت ودخلت في الاسلام وانخرطت في صفوف المسلمين"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 11
subject = "ورهبانية ابتدعوها ............. فما رعوها حق رعايتها"
text = "بدل رضاعة الكبير وبول الابل<br />شوفوا خيبتكم التقيلة فضايح الرهبان اللي زي برسوم المحرقي واللي طالت البابا شنوده<br />وسلمولي على عدلي ابادير"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 12
subject = "نموذج من كتابات اقباط المهجر فضحهم الله"
text = "لا للإسلام.. لا للظلم .. لن نحنى رؤوسنا للكفر ولعبادة الوثنية..لن نخضع لممارسة فحشاء وتعاليم الإسلام .. لن نخضع لفتاوى الإسلام الكافرة الساذجة..لن نتبع ملة الشيطان الشرهة لإراقة الدماء ..لن نخضع لدين رضاعة الكبير وشرب بول البعير والتبرك ببول الرسول.<br />________________________________________<br />ونضيف نحن المسلمين ونقول<br />لا لدعارة برسوم المحرقي<br />لا لشذوذ البابا شنوده"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"
