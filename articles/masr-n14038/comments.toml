text = "لا للإسلام.. لا للظلم .. لن نحنى رؤوسنا للكفر ولعبادة الوثنية..لن نخضع لممارسة فحشاء وتعاليم الإسلام .. لن نخضع لفتاوى الإسلام الكافرة الساذجة..لن نتبع ملة الشيطان الشرهة لإراقة الدماء ..لن نخضع لدين رضاعة الكبير وشرب بول البعير والتبرك ببول الرسول.<br />________________________________________<br />ونضيف نحن المسلمين ونقول<br />لا لدعارة برسوم المحرقي<br />لا لشذوذ البابا شنوده"
