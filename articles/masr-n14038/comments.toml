[[comments]]
order = 0
subject = "اى حكومة فى العالم تشبة حكومتنا"
author = "حمار"
text = "الكمسارى بيقول انة بيشتغل من 30 سنة وراتبة 250 جنية ودى مرتبات الموظفين ايام الجنية الجبس او الجنية الدهب على ايام لاظوغلى والرئيس قلاوون<br />250 جنية ثمن قميص وبنطلون وتمن 5 كيلو لحمة - ازاى يعيش هو واسرتة<br />لا - وفية واحد اسمة احمد عز كسب 60 مليار جنية فى خمس سنين<br />وبما انى مش عارف البلد دى ماشية ازاى اعترف انى اكبر حمار لانى مش عارف الشعب عايش ازاى"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 1
subject = "الى الاستاذ حمار اللي فوق"
text = "طبعا الحمار دا رمز للعمل والتعب وتحمل المشاق بقليل من الاجر وهو شوية البرسيم اللي بياكلهم يعني بيشتغل شغل كتير اوي كل يوم بقليل من الاجر الا وهو شوية البرسيم<br />كذلك الكمسري مهنة الكمسري دي عايزه واحد حمار من الشعب يشتغل زي الحمار وياخد راتب يا دوب ياكل بيه فقط والجهة اللي بتشغل الحمير ما لهاش دعوه ا نت حتنام فين حتدفع كهرباء زهيه حتروح تتعالج عايز تتجوز كل دي اشياء ما لهاش دعوه بيها الجهة المشغلة للكمسرية<br />هي عايزه حمار ومش مسئولة الا عن حمزة البرسيم بتاعته فقط<br />اما حينام فين حيلبس ايه حيتعالج فين كل دي اشياء خارج الاتفاق<br />الاتفاق على حمزة البرسيم فقط"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 2
subject = "الحمار"
text = "قال بصراحة انا أحسن منكو<br />أحسن من ملايين فـ زمانكوا<br />مش شرَّاني ولَّا لئيم<br />ولا بتملَّق عند زعيم<br />واحسن ماكُل حق الناس<br />بقعد آكل في البرسيم"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 3
subject = "تعلموا من الحمار يا حمير"
text = "شوفو الحمار الذكي؟؟؟؟؟؟<br />في أحد الايام وقع حمار في بئر غائر. أخذ الحمار يصرخ لساعات بينما كان الفلاح يحاول التفكير في طريقة لتخليص حماره. أخيرا قرر الفلاح أن الحمار صار عجوزا وليس بحاجته وأن البئر لابد أن يدفن على اي حال. لذلك فلا فائدة من إنقاذ الحمار.<br />قام الفلاح باستدعاء كل جيرانه لمساعدته في دفن البئر. فأمسك كل منهم معول وبدأ يسكب الرمل والوسخ في البئر. عندما استنتج الحمار ما يحدث بدأ يرسل صرخات عنيفة. وبعد لحظات هدأ الحمار تماما.<br />حدق الفلاح في أسفل البئر فتفاجئ مما رآه. ففي كل مرة ينسكب فيها الرمل من المعول يقوم الحمار بعمل شيء مدهش. كان ينتفض ويسقط الوسخ في الاسفل ويأخذ خطوة للاعلى فوق الطبقة الجديدة من الوسخ.<br />بينما الفلاح وجيرانه يلقون الرمال والوسخ فوق الحمار كان ينتفض ويأخذ خطوة للاعلى. وبسرعة وصل الحمار لحافة البئر وخرج بينما انصدم واندهش الفلاح وجيرانه.<br />الفائدة المستفادة الحياة سوف تلقي عليك بالاوساخ، كل أنواع الرمل الوسخ، وفكرة الخلاص من البئر هي أن لا تدع الاوساخ تدفنك ولكن تنفضها جانبا وتأخذ خطوة للأعلى. كل مشكلة تواجهنا في الحياة هي حجرة يجب أن نخطوا فوقها. نستطيع الخروج من أعمق بئر فقط يجب أن لا نتوقف ولا نستسلم أبدا، وتذكر انفضه جانبا وخذ خطوة فوقه."
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

[[comments]]
order = 4
subject = "الى نيرة الشريف"
text = "كويس خالص<br />انتي عملتي تحقيق مع اضعف خلق الله في مصر الا وهو (الكومسري)<br />ايه رأيك لو تعملي تحقيق مع النقيض تماما<br />ضابط امن دولة<br />ونشوفوا عايش ازاي وبياكل ايه<br />والله لو عملتي التحقيق دا يبقى خبطه صحفية هايله"
archived = "2008-02-01"
capture_url = "https://web.archive.org/web/20080201230158/http://masr.20at.com:80/newArticle.php?sid=14038"

