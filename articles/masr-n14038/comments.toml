[[comments]]
order = 21
subject = "كبروا دماغكم بقى"
author = "اكتب اسمك هنا"
posted = "2008-02-02"
text = "تعتقدوا يا جماعة المشكلة فعلا فى الحكومة ... ولا فى الأدمغة الغريبة اللى وضحت فى أجاباتكم<br />يا جدعان الناس مش لاقية تاكل .... الفول غلى ورغيف العيش مستحيل تشتريه إلا باعجوبة<br />وانتم اللى شاغلكم هو البابا والاسلام والمسيحية<br />ربنا يهديكم ويهدينا ..... نفسى نركز ونفهم ونعرف مين المستفيد الحقيقى من النقاش \" البناااااء \" اللى دار بينكم والمعلومات \" القييييمة \" اللى انتم ذكرتوها ...<br />خلوا بالكم من بلدنا لأحسن عيها الدور ، ولو حصلها حاجة هنتأذى كلنا مسلم ومسيحى .. والصهاينة بس هم اللى هيكسبوا وهيبنوا دولتهم اللى بيحلموا بها من مئات السنين ..... من \" النيل \" للفرات ، الفرات خلاص اخدوه ومش باقى غير النيل ... ربنا يستر ."
archived = "2010-03-14"
capture_url = ""

