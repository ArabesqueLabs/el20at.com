subject = "المحتجين والوقفة الاحتجاجية لكل طلبة مصر الوطنيين وليس الاخوان فقط"
author = "مش فاهم"
text = "كان الاخوان هم فقط حملة لواء الوطنية والدفاع عن مصر<br />هناك قطاع كبير من الطلبة الوطنيين يحتجون على الاوضاع وعلى الحصار سواء من ناحية مصر او ناحية اسرائيل والحصار الموجع هو من ناحية النظام المصرى<br />بلاش تلمعوا فى الاخوان قوى - كل شباب مصر ضد الظلم والشباب بكل اطيافة"
archived = "2008-12-06"
