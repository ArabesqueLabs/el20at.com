author = "باحثة عن الحقيقة"
posted = "2008-04-03"
text = "السلام عليكم :<br />قمتي الحقيقية الحالية في حياتي هي المركز اللذي احفظ به القرآن الكريم<br />ففيه ارى الصغير و الكبير, بنات مدارس و جامعات يشاركون و ينظمون اوقاتهم في سبيل نيل طاعة الله عز وجل من خلال الحفظ .<br />انصح الجميع بان يجعل من أول القمم في حياته حفظ القرأن, لن تعرف مقدار الرضا و الفرحة و البركة التي سوف تغمر حياتك الا قبل ان تجربها ."
