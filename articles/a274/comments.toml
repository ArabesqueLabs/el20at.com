[[comments]]
order = 7
subject = "بيرو مرة قرد من الفراعنة"
text = "مرة قرد من الفراعنة حب قردة من اليهود<br />حب ملهوش اي معني بس هتقول ايه قرود<br />اليهود فرحوا وهاصوا وعملوا حفلة علي الحدود<br />والفراعنة صبوا لعنة هو ده طبع الجدود<br />قالولوا يأما تيجي تعيش معانا يأما تغور واياك تعود<br />واللي تخسر نور عنيها مدياه حبة وعود<br />خلته يقول موش هسيبها ولو هتبلعني الاسود<br />ولو تهاجمني المدافع والبنادق والبارود<br />دق بابها قام فتحله قرد من ايام ثمود<br />قرد عرض النيل وطوله تقول يقارب للعمود<br />سالها مين ده ؟ ردت رد من اوطي الردود<br />هو جوزي ونور عنيا واللي ليا في الوجود<br />طب ساكت ... لكن للاسف جريمة ومن غير شهود<br />ودي اخرت اي قرد مصري يروح يأمن لليهود !!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034423/http://www.20at.com:80/article.php?sid=274"

