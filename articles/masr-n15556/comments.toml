text = "صحيح ان الغلا في كل الدنيا وحتي لو الخوان متاسلمين لكن خوفك من الكلام والتعبير عن رايك وقهرك مش محتاج معارضه محتاج كرامه وعزه نفس الظاهر انها مش متوفره فينا يا مصريين انا مثلا ممكن اكون مابشاركش في اي حاجه لكن احساسي بالخنوع وكسرة النفس قاتلني ونفسي اعيش في حريه وما اخفش اتكلم نفسيييييييييي في الحرييييييييه"
