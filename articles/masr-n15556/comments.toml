subject = "حسين كامل كلامه مظبوم 100%"
author = "مش هو ولا هي"
posted = "2008-05-04"
text = "كلامك 100% يا حسين كامل<br />وبعدين يا جماعة الاضراب لازم يكن ضد التجار<br />يعني مثلا اعملوا اضراب على الجزارين ما حدث يشتري لحمه لمدة شهر حتلاقوا الاسعار نزلت النص<br />واي سلعة تانية غالية اعملوا اضراب عليها<br />يبقى كده احنا ماشيين صح<br />لاكن تعملوا اضراب والامن ينزل ويتكلف في اليوم الواحد 50 مليون جنيه<br />ما هو كله على دماغ ابوكم<br />يبقى الفلوس اللي المفروض يزود بيها الرواتب حتتصرف على الامن"
archived = "2008-05-08"
capture_url = "https://web.archive.org/web/20080508145008/http://masr.20at.com:80/newArticle.php?sid=15556"

