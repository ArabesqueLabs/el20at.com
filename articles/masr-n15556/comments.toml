[[comments]]
order = 0
subject = "سؤال !!"
author = "حسين كامل"
posted = "2008-05-04"
text = "سؤال !!<br />حسين كامل<br />سؤال , هل غلاء الأسعار يجتاح مصر فقط بل يجتاح جميع دول العالم !! غلاء الاسعار يجتاح جميع دول العالم ومع ذلك لم نشاهد شعب من شعوب تلك الدول ارتدى الملابس السوداء او نظم اضراب !! الدول الاوروبية تعانى من ارتفاع الاسعار , الدول العربية بدون استثناء تعانى من الغلاء , دول الخليج شهدت ارتفاع جنونى فى الاسعار شمل كل شى لدرجة ان العاملين بتلك الدول قاموا بترحيل اسرهم حتى يتمكنوا من العيش وسط الارتفاع الجنونى للاسعار !! اذن مصر كغيرها من الدول تعانى من ارتفاع الاسعار العالمى ولكن لماذا نسمع اصوات المعارضة فى مصر بينما لا نراها فى باقى الدول !! السبب ان الحكومة تراخت فى مواجهة الاخوان المتأسلمين والعملاء والخونة فهولاء يتربصون بمصر وشعب مصر وامن مصر وينتظرون الفرصة لكى يغرسوا خناجرهم فى صدر الوطن . هولاء يتمنون الفوضى والدمار والتخريب والسرقة والقتل والنهب والدليل حينما فشل اضراب السادس من ابريل اصيبوا بخيبة امل وخرجوا على مواقع الانترنت يسبون الشعب الذى رفض الاضراب ولكن فى اليوم التالى تبدل الحال وانتشوا حينما عم الخراب والدمار مدينة المحلة الكبرى فهذا هو املهم وهذا هو حلمهم ان تحترق كل مصر مثلما احترقت المحلة الكبرى !! لذلك اتمنى من الحكومة المصرية واتمنى من الرئيس مبارك ان يقدم كل من شارك او حرض على الاضراب الى المحاكم العسكرية , اتمنى ان تتم معاملة مهدى عاكف الذى قرر المشاركة فى الاضراب معاملة تلك الفتاة التى تدعى اسراء والتى نظمت الاضراب السابق واتمنى من الحكومة ان تنتزع الريشة التى وضعتها على راس مهدى عاكف فلا فرق بين عاكف واسراء امام القانون .. واخيرا تحية من القلب الى رجال الدين اللذين حرموا الاضراب , تحية الى اقباط مصر وكنائسهم التى رفضت الاضراب , تحية الى كل صحفى حر وشريف كتب كلمة يحارب فيها الاضراب , تحية من القلب الى كل مصرى شريف سوف يخرج اليوم ويظهر فى شوارع القاهرة ليكون ظهوره فى شوارع القاهرة هو خير دليل وخير شاهد على فشل الاضراب ."
archived = "2008-05-08"
capture_url = "https://web.archive.org/web/20080508145008/http://masr.20at.com:80/newArticle.php?sid=15556"

[[comments]]
order = 1
subject = "مبارك فوق الثمانين"
author = "أحمد لطفي- صحفي"
posted = "2008-05-04"
text = "لا أجد مبررا لما تنجرف وراءه تلك الحفنة من الذين يطلقون على أنفسهم معارضين لحكم الرئيس مبارك، فتعطيل عجلة العمل والإنتاج لن تضيف جديدا لهم، فإذا كانوا يعارضون النظام، فهم أحرار فيما ذهبوا إليه. أما أن يحرضوا الشعب على العصيان والامتناع عن العمل، فتلك محاولة لاستعراض القوة، لن يقبلها النظام بأي حال، لأنها قد تثير الفوضى في الشارع. والحق يقال أنني كتبت العديد من المقالات، التي انتقدت فيها بعض قرارات الرئيس مبارك، وبعض سياسات أعوانه في المواقع التنفيذية وغيرها، وكنت في كل مرة أتوقع أن يزورني بعضهم فجرا، لأجد نفسي في أحد السجون المصرية، ولكن توقعاتي مع كل مقال باءت بالفشل، فلا أنا دخلت معتقلا ولا تعرضت لأي أذى من أي نوع.. بل إن بعض أقاربي كانوا يتوقعون أن تعرقل مصالحهم أو يرفض قبول أبنائهم في الكليات العسكرية مثلا، ولكن ذلك لم يحدث على الإطلاق طوال عهد مبارك. وإذا كان للرئيس أن يفخر بحكم أكثر من 80 مليون مصري- لا يعجبهم العجب ولا الصيام في رجب كما يقول المثل الشعبي- فإنني أنتهز هذه الفرصة لأعلن بكل شجاعة أن مبارك الثمانين عاما هو تاج على رؤوس المصريين، وهو فخر لنا جميعا. إن ما سردته إنما هو الحق، فكثير من المعارضين كتبوا وانتقدوا، بل وأقاموا الدنيا ضد النظام المصري دون أن يلحق بأحدهم أي أذى، إلا من أحيل للجهات القضائية لخروجه على القانون. وربما يقول قائل- وما أكثرهم في مصر- إن هذه السطور مشبوهة. ولكن أود فقط أن أشير إلى أنني أعمل خارج مصر منذ أكثر من 14 سنة، ولست في حاجة للتزلف أو النفاق. كما أنني لست من موظفي الدولة ولا تربطني بأي مسؤول أي علاقة أو مصلحة. ويبقى أن أضيف سطرا واحدا أختم به هذا التعليق: لقد اكتشفت طوال عملي في الصحافة على مدى نحو ربع قرن، أن كثيرا من المعارضين يعارضون لمصالح شخصية ليس إلا، وأن بعضهم يبتز المسؤولين من أجل تحقيق أغراضهم. ولدي حصيلة وفيرة من الوقائع التي تؤكد ذلك. أما عن الفساد الذي يتهمون نظام مبارك بالوقوف وراءه، فهو موجود منذ بداية تاريخ مصر وفي كل عهد، حتى في عهد عبدالناصر والسادات. ولست أدري لماذا تجاهل الأخوة حملة مشاعل المعارضة أن نفس النظام هو الذي أحال وزراء ورؤساء هيئات وشركات بل وقضاة ومسؤولين كبار للقضاء عندما ثبت فسادهم، ومازال بعضهم قابعين داخل السجون بعد صدور الأحكام القضائية ضدهم. وأخيرا أقول لهؤلاء: انظروا إلى تاريخكم ومواقفكم، فالمصريون ليسوا سذجا لتتلاعبوا بمشاعرهم."
archived = "2008-05-08"
capture_url = "https://web.archive.org/web/20080508145008/http://masr.20at.com:80/newArticle.php?sid=15556"

