text = "التاريخ يقول ذلك<br />كثيرون جدا جلسوا على اريكة الحكم من المماليك الى المرتزقة والحرامية ولكنهم كانوا يسقطون بعد مدة<br />الاقتصاد<br />تقوم الدول على الاقتصاد<br />لم تقم دول على الجوع والتسول<br />الاقتصاد الان اقتصاد تسول<br />اصبروا سوف يسقط"
