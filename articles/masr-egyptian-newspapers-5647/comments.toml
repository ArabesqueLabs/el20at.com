[[comments]]
order = 1
subject = "الباز الكداب يقدم اعتذاره ولا يقبل لانه كاتب وصحفى"
author = "خبر من الانترنيت"
posted = "2007-04-30"
text = "فوجئ المشاهدون بالكاتب محمد الباز ، الذي نشر مقالات بذيئة ضد الصحابي الجليل في صحيفة الفجر يتصل على الهواء مباشرة بالشيخ صفوت حجازي مبديا أسفه واعتذاره عن أي إهانة تكون قد فهمت من كلامه وأنه يحترم الصحابة ولا يقصد الإساءة إلى أي منهم ، غير أن الجمهور الأوسع الذي اتصل بالبرنامج أبدى رفضه الشديد لمثل هذا الاعتذار ، معتبرا أن حجم التطاول والبذاءة لا يمكن \"التطهر\" منها بمثل هذه الأقوال \"المجانية\" واعتبر البعض الآخر أن اعتذار \"الباز\" أتى نتيجة خوفه من الاتهامات القضائية التي تلاحقه وتلاحق الصحيفة التي كتب فيها ، إضافة إلى فزعهم من حملة المقاطعة التي تبناها الشيخ صفوت حجازي وبعض علماء الأزهر ، يذكر أن الدعوة إلى مقاطعة صحيفة الفجر حققت نتائج مثيرة ، ووصلت إلى حد أن الكثير من بائعي الصحف والأكشاك رفضت عرض الصحيفة للبيع ابتداءا ، استجابة للفتوى ، باعتبار أن عرضها للبيع \"حرام شرعا\" ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-04-30"
text = "مش فاهم انتم متعاطفين مع الباز ليه بقدر يشكك فى بولس الرسول مثلا كانت الكنيسة قامت ولم تقعد بس احنا شاطرين نشتم فى الصحابة الاطهار وخلاص عشان نعمل فرقعة ونبيع اكتر وخلاص واسالوا عادل حمودة اللى كل شوية يمسك جريدة وبيلعب على كل الحبالو احب اوجه رسالة لكل اللى بيسىء للصحابة الاطهار من قريب او بعيد ان احنا موجودين ولن تموت ذكرى الصحابة الاطهار مهما فعلوا بس زى مقلت انا من الاول هى بقت هيصة وانا انصحة يشوفوا دينا يكتبوا عنها احسن زى الاول وهيه تشترى جريدتهم وتدلعها وانصحه ياخد كورس فى الصحافة من المصرى اليوم واوصى عليه الاسناذ مجدى الجلاد وعجبىىىىىىىىىىىىىىىىىىىىىىىىى"
archived = "2010-03-14"
