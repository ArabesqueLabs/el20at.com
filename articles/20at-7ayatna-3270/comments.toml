order = 0
subject = "اتق الله يا اخ سالم"
author = "عبود المصرى"
posted = "2007-02-19"
text = "انق الله يا اخ سالم حتي لو الكلام اللي انت بتقوله صحيح فلا يصح ان تنشره (((إِنَّ الَّذِينَ يُحِبُّونَ أَن تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ)) سورة النور - سورة 24<br />هتقولي ان انا اناقش موضوع مهم وموجود فعلا و شوية كلام كبير من النظام ده واحنا عاوزين نعالج هذه المشكلة هاقولك ان ده مش المكان اللى هيتعالج فيه المشكلة لو انت عاوز تعالج المشكلة بجد روح للمسؤلين_لجنة الامر بالمعروف والنهي عن المنكر_وهما هيحلوها<br />اما بقى لو انتي عاوز شهرة والكلام ده اكلم اكلم في اي حاجة تانيه<br />بص هاقولك اشتم في العائلة المالكة وللا بتخاف<br />واخيرا اتق الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "اتق الله"
author = "مسلم"
posted = "2007-02-19"
text = "لو افترضنا ان ما تقوله صحيح يا سالم و انا لا اعتقد ذلك فكان من الاولي توفير مجهودك بكتابه ذلك المقال الذي لا أشعر من سياقه بحسن النيه منك بأن تقوم بأبلاغ السلطات عن ما تدعي أنه يحدث داخل أطهر مكان علي الارض. أرجو منك ان تتفهم لما أعني و أسأل الله ان يهديني و أياك لما يحب و يرضي"
archived = "2010-03-14"
