[[comments]]
order = 2
subject = "أنا معترض على المعلقين !"
author = "خضر الجنايني"
posted = "2007-04-02"
text = "أنا معترض على اللي بيقول \"إن الذين يحبون أن تشيع الفاحشة\" ويسوقونها على هذا المقال، وأرى أنه مقال طيب، وأرى أيضا أن أهم مشاكل السعودية إنهم بيكفوا على الخبر ماجور وبكده يعبتروا المشكلة اتحلت!!<br />بلاش سلوك النعام (مع إنه علميا النعام ما بيعملش كده)، بس نقول ايه بقى، ربنا يهدينا جميعا، مش معنى كده إني بأقول إن بلدي نضيفة والسعودية لا، كله فيه بلاوي،ولكن بلوة السعودية الرئيسية إنه كله بيكدب على كله!"
archived = "2010-03-14"
