[[comments]]
order = 4
subject = "انتظر لحظة من فضلك يا صاحب المقال"
author = "رامى بدر"
posted = "2008-04-05"
text = "السلام عليكم ورحمة الله وبركاتة<br />اولا وان كان كلامك صحيح اية الهدف من كتابة موضوع زى دة والله ملهوش لازمة لان ممكن حد غريب يخش على المقالات دى ويكون مسيحى ويقولك بص المسلمين بيعملة اية فى مقدساتهم هتقولى قصدك انك تناقش الموضوع او تحلة مفيش اداة تقدر تحكم بيها على حد او تعاقب حد اتق الله وبعدين جاى تقول ان الاية مش على الموضوع دة لا طبعا الاية مناسبة جدا على الموضوع دة لان الواضح انك عايز تشوة الصورة العامة للمقدسات الاسلامية ثانيا البنت اللى بتقول ا راحت تعمل عمرة وتقول انة بيحصل الكلام دة طبعا من نفس الصنف اللى عايزين يشوة الصورة العامة للمقدسات الاسلامية اتقو الله وفاية نفاق وكذب"
archived = "2010-03-14"
