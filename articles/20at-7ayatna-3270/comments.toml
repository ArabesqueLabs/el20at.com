[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-04-15"
text = "انا عايزه اقول ان المقالة صح و انا روحت عملت عمرة و شوفت الوقاحة اللي بتحصل دي و كنت مستغربة إن دا بيحصل و مش شايفة ان كاتب المقال غلطان في حاجة بس ممكن لو في غلط ان الموقع دا مصري يعني مش سعودي يعني ممكن الناس مش هتصدق الكلام دا او شايفين ان غلط يقول الكلام دا بس دا شئ بيحصل فعلا و معروف في السعودية او اللي بيروح عمرة او حج بيشوف و الراجل مقالش حاجة حرام هو قال حاجة فعلا حقيقية و موجودة اتكلم عن ظاهرة موجودة و انشاالله تختفي في الحرم طبعا و في كل مكان"
archived = "2010-03-14"
