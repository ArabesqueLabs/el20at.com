text = "جوزها مسميها ام 44 وهي مسميا جوزها مباحث وعملالو رنة بوليس النجده ولا الاسعاف<br />لماذا؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />لان هدي النبي محمد صلى الله عليه وسلم غير موجود بينهم<br />اللي بينهم التلفزيونات وافلام السينما<br />اما هدي النبي محمد صلى الله عليه وسلم فقد قال القران هو الذي خلق لكم من انفسكم ازواجا وجعل بينهم مودة ورحمة<br />ومنهج النبي محمد صلى الله عليه وسلم يرد ويفند ما تضمنه المقال بالكامل لانه حث على حسن العشرة بين الزوجين<br />يا جماعة اقرؤوا في منهج النبي يا جماعة صحيح من علامات يوم القيامة قبض العلم ونحن نعيش هذه العلامة الان<br />فقد قبض العلم وانتشر الرؤوس الجهالة ولكن هذا لا يمنع ان نحاول"
