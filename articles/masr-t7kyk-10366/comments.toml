subject = "من وحي حديث أم زرع"
author = "د: عثمان قدري مكانسي"
posted = "2008-10-31"
text = "بعض الأزواج يدخلون البيوت ، فيسكن من فيها بعد حركة ، وتجف قلوب الزوجات والأولاد من غوائلهم . وجوههم عابسة ، أجبُنُهم مقطّبة ، تنخلع القلوب لمرآهم ، وتنقبض النفوس حين تقع العيون عليهم .<br />ولا أعتقد هذا إلا جهلاً منهم بدورهم في الحياة الأسريّة ، وقوامتهم فيمن ولاّهم الله عليهم .<br />وكأنهم لم يقرأوا سيرة الرسول الكريم في بيته وبين أهله ونسائه ، ومعاملته إياهم بلطف المعشر وبشاشة الوجه وطيب الكلام .<br />فقد كان صلى الله عليه وسلم يبادر فيتقرب من نسائه ، ويمازحهن ، ويتباسط معهنّ ، فيدخل السرور إلى قلوبهنّ .<br />من هذا قوله لعائشة رضي الله عنها :<br />\" كنت لك كأبي زرع لأم زرع \"<br />وذلك حين حدثته السيدة عائشة رضي الله تعالى قائلة :<br />إنه اجتمع في الجاهلية إحدى عشرة امرأة في جلسة سمر ، فقلن بعضهُنّ لبعض :<br />تعالَين نتحدث عن أزواجنا ، دون أن نكتم من أخبارهم شيئاً مدحاً أو ذمّاً ، وأن نكون صادقاتٍ في وصفهم ، على ألاّ يصل هذا إليهم ...<br />فقالت الأولى : إن زوجي متكبر سيء الخُلُق ، لا أصل إلى رضاه إلا بشق النفس وبذل الجهد ، وشبّهته في رداءته بلحم جمل غثٍّ شديد الهزال على رأس جبل وعر لا يوصل إليه إلا بعسر ومشقّةٍ .<br />وقالت الثانية :لا أستطيع ذكر زوجي بسوء – وكله مساوئ – فقد يصل إليه ما قلت فيطلقني ، فأضيّع أطفالي ، وأخسر بيتي .<br />وقالت الثالثة : أما زوجي فهو سفيه أحمق ، عقله في لسانه ، لا يرعى لي ذمة ، ولا يحفظ لي مكانة ، أتحمله على مضض ، فلا أستطيع مجابهته فأطلَّق ، وإن سكتُّ فلا يأبه لي .<br />وقالت الرابعة: إن زوجي معتدل الأخلاق ، متوسط في رضاه وسخطه، وشبّهتْه بليل تهامة ( وتهامة مكةُ وجنوبُها ، والنسبة إليها تهاميّ) لا تجد فيه حراً ولا برداً ، ولا تخافه ولا تسأمه .<br />وقالت الخامسة : زوجي كريم جواد ، لا يسألني ما أفعله في البيت ، فإذا خرج فهو أسد في الحروب ، بطل في القتال .<br />وقالت السادسة : أما زوجي فإن أكل أو شرب لم يترك لعياله شيئاً ، فإذا نام لم يشعر بما حوله . أنانيٌّ لا يهتم بحال أهله إن مرضن أو اشتكين . شديد الرغبة في النساء .<br />وقالت السابعة : يا ويلي ، إن زوجي عيِيٌّ لا يحسن تدبير الأمور ، فيه غيٌّ وضلالة ، أحمق لا يهتدي للتصرف الصحيح ، يتخبط في أعماله ، سريع إلى الضرب ، فإما أن يشُجّ من خاصمه ، أو يكسر له ضلعاً من أضلاعه ، أو يجمع بين الشج والكسر ، فأنا منه على أسوإ حال .<br />وقالت الثامنة : أما زوجي فناعم الملمس ، كالأرنب لِيناً وعطفاً ، شديد الاعتناء بمظهره وطيب رائحته .<br />وقالت التاسعة : زوجي أصيل المنبِت ، فارع الجسم ، كريم اليد ، سريع إلى إغاثة الملهوف ، عظيم في قومه ، قريب إلى نفوسهم ، له الصدر في مجالسهم .<br />وقالت العاشرة : إن زوجي – مالكاً- له إبلٌ كثيرة باركة في فِناء منزله ، لا يوجّهها للكلإ والمرعى إلا قليلاً ، فهو لم يقْتَنِها لينمّيَها ، إنما جعلها للضيفان ، فيقريهم من ألبانها ولحومها . وقد عهِدتِ الإبل منه ذلك ، فإذا سمعن صوت المزاهر وآلات الطرب علمْنَ أنّ أجلَهنّ قد اقترب .<br />وقالت الحادية عشرة : أما زوجي أبو زرع – وما أدراك ما أبو زرع ؟- فقد انتزعني من بيت فقير وحياة بائسة إلى غنىً واسع وحياة رغيدة ، وأكرمني أيّما إكرام ، طعام كثير ، وخير وفير .. وذهبٌ ملأ يديّ ، ففرحت بما أُلْتُ إليه من نعمة ، وعظّمني فعَظُمَتْ نفسي عندي ، فقولي عنده القول الفصل ، والخدم من حولي يأتمرون بأمري ، ويسعَوْن إلى رضاي ... أم أبي زرع : تمتلك الكثير من المال ، وبيتها واسع رائع .... ابن أبي زرع : نشيط جميل المنظر ... بنت أبي زرع : من أجمل الفتيات ، ذات خلق رفيع ، تغار منها الأتراب ...حتى الخادمة : فإنها أمينة تكتم السر وتحافظ على البيت ، وتعتني به .<br />إلا أن هذه النعمة لم تدُمْ لي .. فقد خرج زوجي في بعض أعماله فرأى امرأة جميلة في مقتبل العمر ، تلاعب ولدين لها ، وتسقيهما من ثدييها لبن الأمومة اللذيذ ، فأعجَبَتْه ، فطلّق أم زرع ، وتزوّجها .<br />ولم تلبث ام زرع أن تزوّجت رجلاً أصيلاً غنيّاً ذا همّة عالية ، فأغدق عليها خيراً كثيراً ، وأمرها بصلة أهلها وإكرامهم . . إلاأن قلبها لم يكن له ، بل كان لأبي زرع ... ألم يقل الشاعر :<br />نقّل فؤادَك حيث شئت من الهوى *** ما الحبّ إلا للحبيب الأوّل<br />كم منزلٍ في الأرض يألفه الفتى *** وحنينه أبـداً لأوّل منـزل ؟<br />فكانت تقول : فلو جمعْتُ كل شيء أعطانيه ما بلغ أصغرَ ما أعطانيه أبو زرع .<br />فلما قال لها النبي الكريم صلوات الله تعالى وسلامه عليه :<br />\" كنت لك كأبي زرع لأم زرع \" .. قالت :<br />يارسول الله ، بل أنت خير من أبي زرع .<br />قال صلى الله عليه وسلم :\" نعم ، فقد طلّقها ، وإنّي لا أطلقك .\"<br />وتسـارع بنت الصدّيـق *** بكـلام حلـو ورقـيــق<br />بـل أيـن أبـو زرع أينـا *** من زوج بـر ورفيـق؟<br />أرسـول الله يشـابهـه الـ *** أغـيار بخلـق موثـوق ؟<br />قد صاغك ربي من نور *** وحباك بكـل التوفـيـق<br />أنت العـليـاء وذروتهــا *** وسواك بوهد التضييق"
