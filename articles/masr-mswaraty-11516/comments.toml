subject = "كل سنة وانتم طيبون"
author = "مصرى"
posted = "2009-03-09"
text = "كل سنة وانتم طيبون واعاد اللة عليكم ذكرى المولد النبوى الشريف<br />وادعوا جميعا لشفاء مرضى المسلمين وان يفك اللة اسر الاسير والمعتقل فى السجون<br />وان يرفع عنا البلاء<br />ويبعد عنا اولاد الحرام<br />ويخرب بيت المفترى وابن الحرام الذى يروع بنات المسلمين فى انصاص الليالى<br />امين يارب"
