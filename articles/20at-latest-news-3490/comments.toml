text = "فيه اصوات من المفضل لاى مطرب او مطربه ميقربوش منها و ان قربو يحاولو يغنو باسلوبهم و على قائمه الاصوات ست الكل فيروز احلى صوت بشرى على وجه الارض<br />و اللى بيحصل ف برايمز استار اكاديمى او ف سوبر استار دا دعم منا للمواهب مش تقييم لان محدش هيبقى فيروز تانى حتى المطربين الكبار لحد فيروز و استوب"
