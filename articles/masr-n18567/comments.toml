subject = "دة رأى الأغبياء"
author = "بسلة مصرية مسلمة"
posted = "2008-12-23"
text = "يعنى مش كفاية عبىء غبائكم وجهلكم وسلبيتكم على البلد لاء وعلى العالم كله لاء كمان فكرين نفسكم بتفهموا وبتهجموا كمان زخارى بكل ادب وبدون ما اعدى حدود اللياقة احب اقولك اتلهى على عينك الف مرة<br />ربنا يفك اسرك يا محمد"
