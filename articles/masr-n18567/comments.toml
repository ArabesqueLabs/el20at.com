[[comments]]
order = 5
subject = "(خلى حماس تنفعك يا محتاس)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "ورينا شطارتك يا فالح<br />طيب خلى حماس تنفعك يا محتاس<br />جاتك مليون خيبة و نيلة ياهبل ياعبيط<br />اتلهى و شوفلك شغلة تاكلك عيش يا مغوار !!!<br />هااااااااهاااااااااهااااااااااااااااااااااااااااااهاااهاااااها<br />بلاش لعب مع (الكبار) يا عبيط !!!!!"
archived = "2008-12-21"
capture_url = "https://web.archive.org/web/20081221215622/http://masr.20at.com:80/newArticle.php?sid=18567"
