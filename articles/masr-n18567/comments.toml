[[comments]]
order = 1
subject = "(يستاهل)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "هذا نتيجة اللعب (بالنار)<br />الف مليون مرة (يستاهل)<br />اكل العيش مسئولية ملحة<br />و السياسة مسئولية للى يفهم<br />و لا خلط بين اكل العيش و السياسة<br />فهناك فرق شاسع بينهم<br />لكن من لة عقل فليفهم<br />بلاش لعب (بالنار)"
archived = "2008-12-21"
capture_url = "https://web.archive.org/web/20081221215622/http://masr.20at.com:80/newArticle.php?sid=18567"

[[comments]]
order = 2
subject = "المذكور فى رحلة ترفيهية فى فنادق الخمس نجوم تبع الداخلية"
author = "س بس"
text = "الخدمة 5 نجوم وكل شىء تحت تمرة ابتداء من تليفزيون البلازما وشبكة النت السريع وافطار من هيلتون وغداء من الشيرتون<br />اما الفسح فعلى قمم جبال ابو زعبل اليانعة<br />انتم عاملين هيصة لية<br />الداخلية عايزة تكرمة وتقوم بالواجب - ناس لها بخت"
archived = "2008-12-21"
capture_url = "https://web.archive.org/web/20081221215622/http://masr.20at.com:80/newArticle.php?sid=18567"

[[comments]]
order = 3
subject = "اكل العيش مسئولية ملحة و السياسة مسئولية للى يفهم"
author = "ممتاز"
text = "اكل العيش مسئولية ملحة و السياسة مسئولية للى يفهم<br />في دي عندك حق يا زخاري<br />ممتاز ممتاز ممتاز"
archived = "2008-12-21"
capture_url = "https://web.archive.org/web/20081221215622/http://masr.20at.com:80/newArticle.php?sid=18567"

