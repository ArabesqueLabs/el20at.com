order = 1
subject = "الكيان الصهيونى على رأس مجموعته الاوروبية"
author = "محمد ممتاز - بيبو"
posted = "2007-06-20"
text = "بصراحة انا مش فاهم انت عايز تقول ايه يعنى رياضة و لا سياسة و لا ايه و لازم تعرف ان الاتنين مش بيتقبلوا بالطريقة دى<br />اولا فى مجال الرياضة الكيان الصهيونى للاسف فى تقدم مستمر و هم رأس مجموعتهم فى اوروبا و يكفيهم فقط 6 نقاط من اصل 12 نقطة قادمة يعنى فوزين فقط و يسافروا على النمساو سويسرا و يلعبوا هناك ...للاسف"
archived = "2007-08-25"
