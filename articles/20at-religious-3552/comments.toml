subject = "الحلقة الأولى: عندما تتكلم التقنية عن نفسها....."
author = "حـــ اااااــــاضر يا فندم...."
posted = "2007-04-06"
text = "Update...Data base...Fatal error...error on line :256....phpleafe....كلمات تقنية محضة لا يفهمها و لا يدري معناها إلا من إحترف البرمجة و استمر في جهده الجهيد، و سهر الليالي يصل الليل بالنهار، فجره كيومه، فهو في طرطقة دائمة للكيبورد بتاعو…يغالب النوم تارة ، و يغلبه النوم تارة أخرى، و تارة أخرى يذهب يعمل Pause عشان يستريح شوية.... منها يأكل سندويتش بالمرة علشان يرجع البروكرامور بتاعنا للعمل و لكن هذه المرة بتركيز جيد و جامد....أنا عارف يا مصعب إنتا بتقول دي الوقت و أنت بتقرأ التعليق دا :\" التعليق ده يا فندم زي إبني و أكثر....فليه أتعب...مش بيقولوا إني الأم راحتها في تعب أولاده...؟ ....أيوه يا مصعب أنا عارف كــولي ده....مممم....لكن......مممم.....حــــ ااااااااـــــاضر يا مصعب....\"رحتك في تعبك\"...على العموم ربنا يكرمك و يكون في عونك.....و عون كل فريق عشرينات محررين و تقنيين و مبرمجين و مراسلين...<br />كل سنة وانتم طيبين يا عشرينات<br />كل سنة وانت طيب يا فندم عشرينات<br />يارب،إن شاء الله، نشفكم على طول في<br />الأوائل على كتاب غينيس لتحطيم الأرقام القياسية<br />إن شاء الله، يارب.<br />أخوكم...إنتوا عارفينوا....<br />من المغرب<br />حاضر يا فندم...."
archived = "2010-03-14"
