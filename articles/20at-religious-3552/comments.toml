subject = "الحلف الإليكنروني الفظيع.. وأشياء أخرى"
author = "بيرو"
posted = "2007-04-07"
text = "إيده يا ولد يا مصاعيبو، أزاي تكتب مقال باسمك الحقيقي مش باسمك الاليكتروني..<br />أنا هرفدك من الحزب.. صحيح.. هو آخر مرة كان مين رئيس الحزب أنا ولا أنت..<br />خليني أقول للناس على سر المقال التحفة ده.. شيرين طلبت مني كتابة موضوع عن التعليقاتز. قعدت يوم كامل أكتب بلا أي نتيجة، كل ما كتبته كان يجد طريقه لسلة المهملات.. حتى دخلت أنت المكتب ومررت لك دعوة شيرين.. وكم كان ما كتبته جميلا.. أشكرك عليه..<br />يا ابني انت خسارة في البرمجة.. اكتب يا عم.. صحيح الكتابة مش بتأكل عيش.. بس ده برضه حال البرمجة..<br />سلام يا مصاعيبو"
