[[comments]]
order = 1
subject = "الشات أضر الفلسطينيين وبنات العالم العربيم معهم(كل"
author = "محمد نواف الحمدالله"
posted = "2008-08-29"
text = "ول شئ اود ان اقوله مع كامل احترامي للشعب الفلسطيني ولمحنته ولكل الضغوط والاكراهات التي يعيشها بشكل يومي الا انني اود ان انبه قراء هذا الموقع المحترم ان الشباب الفلسطيني اضره الانترنت اكثر مما افاده فالشاب الذي سيقاوم وسيضرب بالحجارة مشغول بمحادثاته ادن ضاعت القضية وضاعت المقاومة. هناك امر اساسي يجب ان يعلمه الكل الشباب الفلسطيني الان اصبح يتلاعب بمشاعر بعض الفتيات والشابات من البلدان العربية الاخرى غير فلسطين على سبيل المثال اعرف فلسطينيا يكلم مغربيتين من اميلين مختلفين الاولى يتحدث معها بالنهار اما الليل فيخصصه للفتاة الاخرى التي تعمل والمشكل ان كل واحدة من هولاء البنات تعتقد انه يحبها هي فيتفنن هو بكلامه المعسول وبتلاعب بمشاعرها كماشاء ووصل به الامر ان يتوصل بمبالغ مالية طائلة من احداهن. المهم اخواني هناك قصص كثيرة عن الشبان الفلسطينين المستعملين للانترنت لكن اخواني ارجوكم القضية الاساس لاتنسوها واتركو الانترنت بعيدا."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "اين محرر الصفحة ؟"
author = "مسلمة"
posted = "2008-09-02"
text = "السلام عليكم<br />لم لا تفعلون خدمة الابلاغ عن مشاركات سيئة؟<br />الاخ محمد نواف شتم وسب وتهجم على الفلسطينيين جميعاً ولم يحذف كلامه ولم يعدل! فهل هذه ديمقراطية ام حرية ام ماذا؟<br />اتق الله يا اخي الكريم،، فالله وحده يعلم حالهم هناك، ان ذكر التقرير صور للزواج او التعارف على الانترنت فهذا لا يعني ان هذا جل اهتماهم، ثم لتعلم ان الفلسطينيين اكثر العر ب تعليماً وعلماً وثقافة! الا ان لا عمل في الاراضي المحتلة فاتق الله فيهم وفي نفسك!"
archived = "2010-03-14"
