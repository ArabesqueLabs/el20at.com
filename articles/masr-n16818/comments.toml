subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-07-17"
text = "أنا بصراحة مش فاهمة الموضوع<br />يعني هل يعقل انه بقى ... عااااااااااااادي<br />انها تمسح نمرته من التليفون<br />وانها تكدب على أهلها عشان تقابله<br />هل ممكن واحد من الشباب يتجوز واحدة بتعمل كده ؟<br />والصورة اللى محطوطة دى .. هل معقولة بقت شئ عادي<br />قاعدين في جنب . وحاطط ايد عليها بالشكل ده ... ازاااى !!!<br />ليه يا بنات ترخصوا نفسكم بالطريقة دى<br />وأعجب شئ هو الجملة الأخيرة دى<br />يعني بدل ما نصلح الغلط ... نخليه صح وخلاص<br />فالولد يشرب سجاير ادام ابوه احسن مايشربها من وراه ... ايه الفرق ؟!! مش عارفة<br />والحبيبة يتقابلوا ادام الناس ويقعدوا يحبوا في بعض ادام الناس احسن ما يعملوا كده من وراهم .. يا سلااااااام<br />فين الحيااااااااااااء يا نااااااااااااس !!!!!!!!!!!!"
archived = "2008-07-18"
capture_url = "https://web.archive.org/web/20080718162652/http://masr.20at.com:80/newArticle.php?sid=16818"

