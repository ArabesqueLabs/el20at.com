[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2009-01-13"
text = "إن كثرة خروج المرأة من منـزلها يلزم منه كثرة تعرضها لأعيـن الناس المحيطيـن بها وإن كانـت عفيفة ، ومن ثم تعلقهم بها ومعرفتهم لها كلما دخلت وخرجت ، ونـزلت من السيارة أو ركبت ، وهذا من أعظم أسباب تعرض النساء للشرور ، لا سيما المرأة المتصفة بالزيـنة الظاهرة كالطول ونحوه ، هذا إذا افترضنا أنه لم يظهر منها شيء من زيـنـتها الباطنة كالوجه والكفيـن والقدميـن ونحو ذلك ، فكيف إذا ظهر ؟<br />إن في كثرة خروج المرأة من بيتها إذهاباً لحياء المرأة وأنوثتها ، وخروجاً لها عن طبيعتها ، فإنك ترى المرأة الخرَّاجة الولاَّجة قليلة الحياء ، عالية الصوت ، لا تشبه بنات جنسها في حيائها وعفتها ، بخلاف المرأة القليلة الخروج من بيتها ، القليلة الاحتكاك بالرجال ، فإنك تراها حيـية ، خافضة الصوت ، قاصرة الطرف ، ولهذا قرن الله العفاف بالقرار في البيت في سورة الأحزاب في قوله تعالى &--61565;وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الأولى&--61563; ، لأنه لا يحصل هذا إلا بهذا .<br />اللهم احفظ نسائنا ، وارزقهن العفة والحياء ، وأعذهن من مضلات الفتن ونزغات الشيطان ، وهب لنا من أزواجنا وذرياتنا قرة أعين ، والله أعلم ، وصلى الله على نبيـنا محمد وعلى آله وصحبه وسلم ، ولا حول ولا قوة إلا بالله العظيم ."
archived = "2010-03-14"
