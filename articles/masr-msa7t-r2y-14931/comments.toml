text = "ايوه يا عم<br />اخذتو تاكسي<br />من أمام سينما جلاكسي بالمنيل وطلبنا من السائق أن يوصلنا إلى ميدان لبنان.<br />وطبعا ميدان لبنان دا بالمهندسين<br />من المنيل للمهندسين حته واحده والمرة اللي فاتت من ميدان التحرير الى شارع جامعة الدول العربية<br />حسره علينا احنا يا دوب علينا من المرج للمطرية للطالبيه<br />معلش بقا حظنا كده ناس هايصه وناس لايصه"
