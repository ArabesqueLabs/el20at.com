text = "من قال أن هذا فيلم الأذكياء, فيلم تجارى بحت وحتى القصه تتسم بالسذاجه ولهذا لسهولة ولفكرة القريبة من فنتازيا الأطفال حقق أنتشار.<br />ما العمق العبقرى فى نظرية البطل الأمريكى الذى ينقذ الكوكب؟ أو لم نكتفى من أبطال أمريكا الخارقين؟.<br />أشعر بأنه الجزء الثانى للراقص مع الذئاب.<br />جميس كاميرون مخرج ترمينتور وتيتانيك ليس سوى صنايعى لأفلام تجاريه بحته تصرف عليها هوليولود الأموال لصناعة الأبهار ويتلاقها السذج لسهولتها.<br />هناك أفلام أكثر عمقا من هذا ولكننا نتاج لصناعة المواطن الأستهلاكى العالمى سهل التوجيه."
