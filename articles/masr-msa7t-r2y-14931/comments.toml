author = "افلام الزمن الجميل"
posted = "2010-01-17"
text = "افلام الستينات - فترة قمة العطاء المصرى الثقافى والفنى والسياسى<br />افلام الرومانسية الحالمة التى يسخر منها شباب الجيل الحالى لما كانت البطلة تنادى على البطل احمد وتكرر احمد احمد ويرد عليها نادية نادية<br />كان السيناريو يكتبة ادباء درجة اولى مثل عبد الحى اديب ونجيب محفوظ وغيرهم باسلوب راقى ليس فية اسفاف ولا كلمة خارجة او خادشة لانة يعرف ان اسر محترمة وبنات اسر محترمة وشباب واطفال سوف يرونة<br />سألوا احد المخرجين ايامها واظنة سيد بدير عن الفرح والامل والمرح والرقص فى افلامة<br />فقال<br />الناس البسطاء والعمال والفلاحين والموظفين بعد يوم عمل شاق وكفاح على لقمة العيش يأتون لمشاهدة الفيلم ولابد ان اعطيهم جرعة فرح وسعادة فى الفيلم لينسوا حياتهم الشاقة ساعة او ساعتين<br />كان الفيلم فية قصة حب عفيف رومانسى واغنية جميلة ورقصة لراقصة فى فرح واغنية شعبية لمحمد طة<br />اما الان تدخل السينما فيكلمك الفيلم عن العشوائيات والانحرافات والشذوذ والسحاق وتخرج من الفيلم مغموم ومهموم وقرفان<br />كمية عرى رهيبة<br />والفاظ سوقية منحطة لا حد لها فى سيناريو الفيلم<br />هبوط فى هبوط فى هبوط"
archived = "2010-03-14"
