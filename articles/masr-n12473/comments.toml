author = "هم يا هم"
text = "اقرأوا كتاب يوميات نائب فى الارياف لتوفيق الحكيم<br />فى الرواية اللى انكتبت سنة 1936<br />المأمور بيقول لتوفيق الحكيم - وحياتك انا راجل ديمقراطى با اخللى الناس تنتخب اللى هى عايزاة بدون اى مشاكل ولا تدخل ويحطوا اصواتهم فى الصناديق بكل حرية<br />انما انا مجهز صناديق هتتحط قدام لجنة الفرز فيها اللى انا عايزة<br />والصناديق اللى انتخبوا فيها هتترمى فى الترعة<br />سلام للتاريخ ولعمنا المرحوم توفيق الحكيم"
