[[comments]]
order = 3
subject = "لمن يجرؤ على الكلام"
author = "نقلا عن مدونة وانا مالي"
text = "لمن يجرؤ على الكلام<br />إذا كانت الصحافة في أبسط تعريف لها هي \"فن مراقبة السلطة\" كما يقول الصحفي الأمريكي روبرت فيسك في كتابه الأخير، وإذا كانت السلطة قد استطاعت أن تقيد الصحافة وتمنعها من مهمتها في المراقبة.. وإذا كانت الأمور لا تستوتي في أي بلد كان دون أن تكون هناك رقابة على السلطة.. تمنعها من أن تطلق يدها لفعل ما تريد وقت ما تريد وكيف تريد.. فإن الحاجة ماسة لطرق بديلة في المراقبة..<br />ويبدو أن تجربة المدونين في مصر كانت موحية لأخوة في الأردن لمحاولة تكرراها، وهو ما يبدأ اليوم في مدونة جديدة على \"blogspot\" تحمل اسم \"من يجرؤ على الكلام؟\" وهي امتداد لمدونة قديمة بنفس الاسم على \"مكتوب\"..<br />شخصياً، استفزني النداء الذي وجهه القائمون على أمر المدونة – وهم أكثر من شخص في تقديري – للمدونين المصريين بمد يد العون لهم، سواء بالأفكار أو النصائح على أقل تقدير.<br />أشعر بالفخر الآن، لكوني مدون مصري ساهم ولو بالقليل في إعطاء هؤلاء بعض الأمل في أن يصنعوا شيئاً ما لأنفسهم ولبلدهم..<br />على كل حال \"كفاية رغي\"، ومن رأى منكم إمكانية عمل أي شيء يمكنه التواصل معهم على مدونتهم.. والسلام ختام.. والأجازة لازالت قائمة.."
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015425/http://masr.20at.com:80/newArticle.php?sid=12473"

