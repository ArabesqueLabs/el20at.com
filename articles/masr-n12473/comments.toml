subject = "هي فين الصحافة؟"
author = "مراد منير"
text = "الأساتذة الأفاضل شغالين نقد وانتقاد لحال الصحافة والصحفيين بعد قدوم العم مكرم، وكأن الصحافة أساسا كلها زي الفل ومفيهاش مشاكل، المصيبة أني عارف إن كل الناس اللي معلقة على الخبر من بلاطات صاحبة الجلالة يعني صحفيين ودي في حد ذاتها أكبر دليل على إن الصحافة ماتت بالسكتة الدماغية يوم ما أمثال هؤلاء المعلقين دخلوها من أقذر أبوابها!!!!<br />عجبي على ناس كل همها النقد والانتقاد... أنظروا لأنفسكم أولا يا متاعيس الصحافة المصرية، والأعجب والأكثر غرابة هو إن الموقع الموقر اللي المفروض إنه موقع (صحفي) للأسف مفيهوش ريحة الصحافة، نقدر نقول عليه موقع \"أباحة \" فقط"
archived = "2007-11-20"
