posted = "2008-06-06"
text = "ويا ترى مين اللى فى الصورة بيسوق العربية الحلوة دى - قائد المسيرة<br />بتاع احنا اللى اختارناك<br />هو بقى بيشتغل عربجى<br />ربنا يستر"
