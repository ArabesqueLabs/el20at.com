subject = "مين اللى بيقود"
author = "بقرة من البقر"
posted = "2008-06-07"
text = "اللى بيشد العربية هو قائد المسيرة فى الصحراء<br />والا اللى قاعد فى العربية وراء<br />هل الصورة معبرة<br />بتقول ان بقايا العربية دى هى مصر<br />وان القائد بتاعها اللى قدام<br />او ان لجنة السياسات هى اللى بتسوق<br />هذا التركيب الهزلى بيصور وضع البلد<br />مش عارف اية قصد ناشر الخبر"
