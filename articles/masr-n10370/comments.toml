subject = "الف مليون رحمه تنزل عليك ياجمال عبد النصر وانور السدات"
text = "انا مش عاوز اطول بس اقول فى جمله وحده هما كانو ثلاث عبد النصر والله يرحمه والسدات والله يرحمه وصدام وبرده الله يرحمه @@@@ يعنى الرجاله ماته الى كانه فى العرب كلاهم دول وبس والباقى دول شواية ر ا ب ش هههههههههههه صح صح يا رجاله هو الراجل طبعان هيكول فعلان كلامك صح يامان لكن الى يكول غير كدا يكون فعلان ابن ناس من الى وكلين البلاد فى بطنهم وبرده صح صح"
