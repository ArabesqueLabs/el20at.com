[[comments]]
order = 1
subject = "مبارك اول ريس مصرى يستقيل بمزاجة وهوعلى قيدالحياة"
author = "فرعون"
text = "حيكسب احترام العالم كلة لية ولمصر واحنا حنحبة ونحترمة طول عمرنا وهنا بس نعرف ان الرجل دة ادى اللى علية ولازم كل شعب مصر يعرف انة علامة فارقة بالتاريخ المصرى الحديث"
archived = "2007-06-11"
capture_url = "https://web.archive.org/web/20070611183641/http://masr.20at.com:80/newArticle.php?sid=10572"

[[comments]]
order = 2
subject = "طيب ومالة"
author = "على السمان"
text = "حسنى مبارك صلى اللة علية وسلم - لا لا لا دى كبيرة قوى والا اقول لك دى نكتة الزمان الراجل الصعيدى بتاع الامتحان حب ينافق شوية يمكن ياخد ترقية والا علاوة والا سفرية وفكرنى بالراجل اللى كان فى مظاهرة وبيهتف عاش حسنى مبارك موحد الاديان رد علية واحد مسيحى يعنى اية موحد الاديان هل يعنى كلنا دين واحد<br />رد الراجل بتاع الهتاف حسنى مبارك كفرنا كلنا مسلمين ومسيحيين وبقينا كلنا طالع دين امنا<br />صعيدى ساذج بصحيح ربنا يشفى الكلاب ويضرة"
archived = "2007-06-11"
capture_url = "https://web.archive.org/web/20070611183641/http://masr.20at.com:80/newArticle.php?sid=10572"

[[comments]]
order = 3
subject = "خطأ اثناء الطباعة"
author = "ابومحسن"
text = "ياجماعة صلى الله عليه وسلم الموجدة دي في الجواب اصلا ليها زر في الكمبيوتر تضرب زر معين مع الشفت يطلع صلى اله عليه وسلم وعلى ما يبدو ان طابع الكمبيوتر او الموضع الذي قام بكتابة هذا الخطاب على الكمبيوتر قد اخطأ وهذا معروف لكل من يعمل في حقل الطباعة والصحافة الاخطاء المطبعية وما ورد في الخطاب خطأ من الاخ الطابع او الاخت الطابعة التي قامت بكتابة هذا الجواب"
archived = "2007-06-11"
capture_url = "https://web.archive.org/web/20070611183641/http://masr.20at.com:80/newArticle.php?sid=10572"

[[comments]]
order = 4
subject = "طويل العمر يطول عمره و يزهزه عصره و ينصره على مين يعاديه هاى هى"
author = "نيفين نيفى نوفا"
text = "فكرتونى يا عشرينات لما كنت ف المدرسه و طلبت مننا مدرسه اللغه العربيه كتابه موضوع تعبير عن حرب اكتوبر و اكيد كلنا و كل طفل مصرى كتب موضوع عن اكتوبر سواء ف الابتدائى و الاعدادى او الثانوى و كنت ساعتها ف اعدادى و ازعم ان موضوعات التعبير خاصتى كانت مميزه او هكذا كانو يقولون<br />و كالعاده قومتنى المدرسه اقرا الموضوع و فى الختام كنت بقول شكرا لقواتنا المسلحه و شكرا للرئيس الاب محمد حسنى مبارك قائد سلاح الطيران و هنا لقيت المدرسه قاطعتنى على غير العاده و قالت اقعدى يا بنتى اقعدى الشكر لله و ضحكت ضحكه لم افهم مغزاها الا فيما بعد<br />عارفين انتو امتى طبعا فيما بعد دى<br />فيما بعد بقى"
archived = "2007-06-11"
capture_url = "https://web.archive.org/web/20070611183641/http://masr.20at.com:80/newArticle.php?sid=10572"

[[comments]]
order = 5
subject = "فعلا هو خطأ مطبعي"
author = "مش ضروري"
text = "فعلا انه خطأ مطبعي اثناء الطباعة وفعلا لان صلى الله عليه وسلم على الكمبيوتر بتبقى حرف مع الشفت فاثناء الطباعة السريعة ممكن يقع خطأ مثل هذا<br />كلامك صحيح يا ابومحسن<br />وشكرا لك"
archived = "2007-06-11"
capture_url = "https://web.archive.org/web/20070611183641/http://masr.20at.com:80/newArticle.php?sid=10572"
