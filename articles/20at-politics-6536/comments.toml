text = "يبدو ان اولى تحديلت براون هي خطر الهجمات او المحاولات التفجيرية المتكررة التي تستهدف البريطانيين المدنيين قبل حكومتهم<br />وقعت حكومة بلير في اخطاء فادحة لما قررت الانسياق وراء استراتجيات بوش الابن الرعناء خصوصا تجاه القضايا العربية والاسلامية<br />ويبدو الان ان الشعب البريطاني الذي يعاني خطر الارهاب هو الذي سيدفع ثمن تصرفات حكوماته المتعاقبة<br />فهل يعي براون الدرس هذه المرة؟"
