subject = "رمضان كريــــــم"
author = "محمد نواف"
posted = "2008-09-02"
text = "كل عام والجميع بألف خير ..<br />وأعاده الله على الجميع بالخير واليمن والبركة ..<br />ورمضان كريم على الأمتين العربيبة والإسلامية .. ونسأل الله أن يكون هذا الشهر المبارك شهر مغفرة وغفران وتوبة ..<br />وشهر مليء بالأعمال الصالحة ..<br />رمضان كريم ,, وتسلمي يا أخت شرين مجدي على الموضوع لأنه موضوع في غاية من الروعة والجمال ..<br />وكل عام وأنتي قريبة إلى الله ,, وإلى الجنة أقرب ..<br />رمضان كريم على الجميـــــــــــــــــــــــــــــــــــــــع .."
