subject = "اوباما يعد الشعب الامريكى بالفكر الجديد وتغيير الد"
author = "طز"
posted = "2008-11-05"
text = "صرح مصدر مسطول ان اول شىء سيفعلة ابوما هو تعديل الدستور ليسمح لة بالترشيح مدى الحياة وانة لا يمكن ان يترك الكرسى الذى جاءة كدة فجأة لغيرة وقد هلل وصفق اعضاء الكونجرس الامريكى<br />كما صرح بانة سيضع قانون جديد للمرور يشمل الشنطة والمثلث وذلك بهدف زيادة انتاج القمح فى بلادة والوصول الى الاكتفاء الذاتى"
archived = "2010-03-14"
