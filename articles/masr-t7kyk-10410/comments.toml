[[comments]]
order = 0
subject = "كانت الثورة بتوزع على الفلاحين فدادين خمسة -- ونتي"
author = "اى واحد"
posted = "2008-11-03"
text = "الساعة العاشرة صباحا<br />امشى فى شارع - فى اى مدينة فى مصر<br />تلاقى الشوارع زحمة - الكتف بالكتف - ومفيش مكان تقدر تمشى فية من غير الزحام<br />الناس دى بتشتغل فين وامتى<br />واحد صاحبى راجع من المانيا<br />نزل فى احد شوارع المدينة الالمانية فى العاشرة صباحا - لم يجد ولا صريخ ابن يومين - الناس كلها فى العمل ولها شغل<br />انما عندنا الناس كلها بتصيع فى الشوارع<br />مؤتمر اية وعلشان اية ولمين<br />السنة دى بيوزعوا 5 ارغفة بعد 26 سنة اصلاح<br />اللة اعلم السنة الجاية هيبقوا كم رغيف"
archived = "2010-03-14"
