[[comments]]
order = 1
subject = "نجاح اوباما رئيسا لامريكا - اعلن وزير الداخلية الا"
author = "من البلطجية"
posted = "2008-11-05"
text = "بعد محاصرة لجان الانتخابات فى امريكا بواسطة الامن المركزى واعتقال 2 مليون امريكى تابعين لجماعات محظورة ووضع الاتباع من البلطجية بالسنج والجنازير على ابواب اللجان لضرب اتباع ماكين المتشدد الذى لا يفهم فى السياسة<br />كما تلاحظ ان قوات مباحث امن الدولة الامريكى قد منع المرشحين من التقدم للترشيح بحجة عدم ادائهم الخدمة العسكرية فى العراق<br />نجح اوباما مرشح الحزب الوطنى الديمقراطى<br />واول قرار اصدرة اوباما هو اعتقال المرشح ماكين بتهمة تزويرة اشارة مرسومة على قميص يلبسة عبارة عن بادج الحزب الجمهورى - هذا وقد اوصى اوباما القاضى الامريكى باعطاء مكين خمسة سنوات سجن علشان يتربى هناك ويندم على ترشيحة امام اوباما"
archived = "2010-03-14"
capture_url = ""

[[comments]]
