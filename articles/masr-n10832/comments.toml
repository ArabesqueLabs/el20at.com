[[comments]]
order = 4
subject = "واحد شرم ...واحد شرم و نطلع علطول"
author = "SHERIO"
posted = "2007-07-01"
text = "و الله انا شايف ان احنا بنحمل الامور اكتر مما تحتمل و بنستخدم كلام كبير اوي ..الموقف المصريمن القضيه و حاجات كبيره اوي ...صراحه بقيادة الزعيم صاحب الضربه الجويه الاولي ...انا شايف ان الموقف المصري ميفرقش كتير عن موقف أحمد حلمي زمان قبل ما ينقلوه .... و ان سألت الريس فطرت ايه الصبح مش هياخد باله ...و اساسا الريس مش عارف مين مع مين و لا منين يودي علي فين و سيبها لله ثم جمال ابنه ثم عز اللي راكبه ...و يجعله خراب اكتر و اكتر علي ايامهم السودا"
archived = "2007-07-01"
capture_url = "https://web.archive.org/web/20070701151139/http://masr.20at.com:80/newArticle.php?sid=10832"
