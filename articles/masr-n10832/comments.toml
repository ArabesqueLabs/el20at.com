subject = "الشرم وسنينة"
author = "البطل"
posted = "2007-06-29"
text = "الشرم والبرم والفرجة على مايوهات السياح<br />اصل العواجيز قوى اللى بيحبوا يتفرجوا على المايوهات المسخسخة بيخرفوا كتير<br />مين اللى وقع حماس فى فتح غير صاحبنا ساكن الشرم هو ومخابراتة<br />وبعدين عامل مصلح زمانة"
archived = "2007-07-01"
