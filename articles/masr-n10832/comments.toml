[[comments]]
order = 0
subject = "راجل خرفان"
author = "ابو اسامة"
posted = "2007-06-28"
text = "يبدوا ان السيد الرئيس كبر وخرف واراهن انه مش عارف فتح من حماس ويبدوا ان السيد زير الخارجية انا مش اسف على الواو لانه لا يعرف الا ما يملا عليه كلام لارضاء امريكا واسرائيل لانه لما عرف ان خطر الاسلاميين اقرب اليه من امريكا واسرائيل ابتدى يغير فى اللهجة ودى هى سمة النظام الحاكم الجبن امام اى خطر يهدد عرشهم."
archived = "2007-07-01"
capture_url = "https://web.archive.org/web/20070701151139/http://masr.20at.com:80/newArticle.php?sid=10832"

[[comments]]
order = 1
subject = "يا ابو اسامه"
author = "ابو الافكار"
posted = "2007-06-28"
text = "انت باين عليك صليبى من اللى عاوزين يولعوها !!!!!!!!!!!!!!!!!وحكايه خطر الاسلاميين دى من الغباء والضلال اللى انتم فيه وافهم وشغل مخك واعرف ان حماس ارسلت وثائق وشرائط لمصر ففهمت حقيقه دحلان والعملاء !!!وافهم شويه وبطل تعبد شنوده وشغل مخك شويه قبل ماتكتب دا احنا فى الانترنيت والرئيس مبارك عنده اجهزه قدمت له تقارير ومش مخرف ولا حاجه دا انت اللى مبرشم اساسا ومن طائفيه تكتب"
archived = "2007-07-01"
capture_url = "https://web.archive.org/web/20070701151139/http://masr.20at.com:80/newArticle.php?sid=10832"

