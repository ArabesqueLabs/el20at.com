subject = "سى شنودة"
author = "واحد"
text = "الخزعبلات بتاع الناس اللى بيبوسوا الارض اللى بيمشى عليها سيدهم<br />طيب يا سى شنودة حمد اللة على السلامة - جاى تعمل اية متخليك هناك مع اقباط المهجر يونسوك شوية<br />حمد اللة على السلامة"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 2
subject = "الف مليون حمد على السلامه يا بيبو .... الموقع نور والله"
author = "ميرو"
text = "بجد بجد نورت الموقع ... والله كان واحشنى انا اقرالك اوى يا جميل ... انا قولت الدستور اخدتك من الناس بتوع عشرينات ولا ايه .... عاوزين نشوف موضوعاتك على طول يا دواخلى"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 3
subject = "ايه يا عم دواخلى الشغل الجامد ده"
author = "شيرين"
text = "ولو انى مش بحب اقرا فى الملف القبطى بس لما يكون الكاتب هو بيبو \" دلع شريف يعنى مش عاوزين نسيح \" يبقى الواحد لازم يقرا عشان يتعلم ويستمتع ... اى خدمه ياعم ... بس بجد الموضوع مكتوب حلو جدا جدا و اسلوب فعلا اكثر من رائع بس تفتكر ها يدخلوك الكاتدرائيه يا جميل بعد كده"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 4
subject = "لقطات الموضوع ولا اروع يا بيبو"
author = "ندى"
text = "انا ما يهمنيش البابا رجع ولا ولع حتى ... انا قريت خبر انه رجع فى 10 جرايد بس ايه الابداع واللقطات التحفه ديه يا بيبو ... ما شاء الله عليك \" الله اكبر \" رائع بجد مش ممكن شويه لقطات تحفه فعلا انتا حد موهوب جدا جدا وكله كوم ولقطه انه الوحيد اللى كان قاعد على كرسى ديه كوم تانى .... لا بجد ما شاء الله و عقبال لما اشوفك هيكل التانى يا روح قلبى"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 5
subject = "عارف ايه احلى ما فى الموضوع يا بيبو"
author = "نانى \" البديل \""
text = "ثاني المفاجآت كانت عدم دخول البابا من الباب الرئيسي للكاتدرائية، فبعد مسيرة من السيارات وعزف السلام الوطني فوجئ الجميع أن السيارات لا يركبها البابا، فقد دخل من باب سرى \"أو خلفي\" بالكاتدرائية ليخرج على الناس من المقر البابوي.<br />المفاجأة الثالثة هي وقوف أعضاء المجمع المقدس حوالى 10 دقائق كاملة فى انتظار البابا حيث لم يوجد سوى كرسى واحد في الكرنفال كله وهو مخصص للبابا، ويبدو أن المقصود من هذا هو تأكيد أن شعب الكنيسة لا يمكن أن يتساوى بالبابا فى المقام، فليكن الكل قيام والبابا هو الجالس الوحيد! .<br />بجد لقطتين تحفه"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 6
subject = "ايه ياعم كل البنات ديه"
author = "واحد منقوط"
text = "الموضوع حلو ايوه ماشى ,.... بس ارحم نفسك شويه بنات ياعم .... احنا شباب تعبان برضه"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 7
subject = "بيبو بيعلق لنتفسه يا عشرينات الواد ده معقد نفسيا والنعمة"
author = "باينة موووووووت"
text = "بيبو بيعلق لنفسه باسامي بنات وبيشكر في موضوعه اوي الواد ده معقد نفسيا والنعمة وكمان في الاخر باعت تعليق بيقول لنفسه كفاية بنات يا عم احناشباب تعبان برضوا .. بجد الموضوع باين اوي مش محتاجة ذكاء يعني لو انتم محتاجين مرضة نفسيين روحوا مستشفي الامراض العقليه ..<br />بيبو روح اتعالج يعلن ابو ام العقد"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 8
subject = "إلى الاخ باينه موووووووت اللى علق قبلى"
author = "واحد فاهم"
text = "ايه ياعم الكره و الحقد على نجاح زملائك ديه ... طيب خليها فى نفسك انتوا مهما كان زملاء فى مكان واحد ... يعنى عندك كلمه حلوه فى حق \" زميلك \" قولها لو هو عقدك للدرجه ديه يبقى اكتم فى نفسك و اسكت بدل ما ترمى بلاويك على الناس انها معقده وانتا اللى معقد<br />و بعدين انتا مالك بنات ولا ولاد يعلقوا افرض يا اخى اصحابه كلهم بنات متضايق انتا ليه ....<br />بطل عقد انتا يا استاذ<br />على فكره والله انا مش اعرف بيبو ده خالص ولا اعرف اللى كاتب بس باين قوى انك بتكرهه و هو بجد حد محترم قوى انه ما ردش عليك"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 9
subject = "ده اول موضوع ليك من فتره قد كده انتا حارق دمهم"
author = "رشا"
text = "الموضوع مركز قوى يا استاذ شريف وانا متابعه كتاباتك من فتره .. ولكن على ما يبدو ان هناك قله تحقد عليك ... لا تنظر لهم و امضى ..فى نجاحك لانك فعلا من افضل الناس اللى بتكتب فى الموقع"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 10
subject = "الى الاستاذ شريف الدواخلي"
author = "مش ضروري"
text = "انا المعلق الاولاني بتاع اقبا؛ المهجر<br />انا مرة شفت حضرتك معلق في موقع (الاوغاد متحدون) وكتبت شريف الدواخلي صحفي معارض<br />والله عايزين حضرتك بصفتك صحفي كبير تساهم في كشفهم وكشف مخططاتهم وتعاونهم مع اليهود وتعاونهم مع اعداء الوطن<br />واظن موقع الكلب عدلي ابادير فيه الكفاية"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819050756/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
order = 11
subject = "ضع عنوان التعليق الصليب إهانة وتكريم"
author = "d.jan"
posted = "2008-03-07"
text = "الصليب أكبر دليل على قمة التمجيدلأنه إنتصرلسيدنا عيسى فى أن رب العالمين حفظه من عدوه ياهوزا الذى خطط لصلبه ولا يحيق المكر السئ إلابأهله وسيظل هو رمز إهانة يهوزا على الصليب الى أن يظهر الحى القيوم الحقيقة بأن المصلوب والموجود على الصليب صاحب فكرة الصلب يهوذا وكان لايصلب فى بنى إسرائيل إلا السارق والزانى ليكون عبرة ويظل يهوذا عبرة على مر العصور والسنين والله يحفظ أنبيائه ورسله ولا يمكن أن يهان نبى أو رسول تحت عرش ومملكة الواحد القهار فالله غالب على أمره ولكن أكثر الناس لايعلمون"
archived = "2010-03-14"
capture_url = ""
