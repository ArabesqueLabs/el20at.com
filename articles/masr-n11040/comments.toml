[[comments]]
order = 0
subject = "على ذمة اقباط المهجر المسلمين يشربون بول كل الحيوانات"
author = "مش ضروري"
text = "من موقع الهيئة القبطية الكندية بقلم الاب بوتا لعنه الله<br />ولكي نختصر الطريق نقول ان هناك كاتبة تدعي زينب عبد العزيز كتب في هذه الصحيفة بتاريخ 8 يوليو 2007 تحت عنوان (ويبقي الحوار الديني الامين هو السبيل للتعايش) كتبت هذه الكاتبة مقال لا نعرف اذا كان شتائم ام اكاذيب ام اوهام ام خرافات ام ازدراء بالديانة المسيحية ام ماذا المهم انه مقال موقع ادناه بلقب دكتورة زينب عبد العزيز وواضح انها من حملة الدكتوراة اياها بتاعة الازهر او بمعني ادق بتاعة رضاعة الكبار وشرب بول كل الحيوانات وايضآ بول الرسول ..... الخ ولم اجد ترابط في هذا المقال لكن للحق فأنه مقال اسلامي لايكتبه الا داعية اسلامية لما فيه من الاسس والقواعد التي تبيعها الكتاب والدعاة الاسلامية من كذب وتضليل وتهجم علي العقائد الصحيحة والتمجيد في العقيدة الكاذبة .... الخ<br />الاسلام الذي حكم نصف العالم الف سنه والاقباط الذين يعيشون في اكبر دولة اسلامية لم يجدوا في الاسلام الا رضاعة الكبير وشرب بول كل الحيوانات وخلافه"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131939/http://masr.20at.com:80/newArticle.php?sid=11040"

[[comments]]
