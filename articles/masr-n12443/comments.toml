[[comments]]
order = 0
subject = "اخبار بلدكم فريدة فى الغباء"
author = "مش مصرى"
text = "كانت مصر مركز للتنوير والثقافة وكانت تخرج منها اخبار طيبة وتبعث الامل فى شعوب العالم الثالث<br />الان نسمع الاخبار الاتية من الجزيرة والعربية<br />القاء مواطنين من البلكونات وقتلهم بواسطة جهاز الامن<br />اسبوعيا القبض على شباب معارض بحجة انتمائهم لجماعة الاخوان<br />ضرب الشباب فى الجامعات اثناء الانتخابات<br />غرق الشباب فى البحر اثناء هروبة من البلد على شواطىء اوروبا نتيجة البطالة والفقر<br />تزوير الانتخابات فى مجلس الشعب والرياسة<br />الفساد والرشاوى وتردى حالة الناس<br />حبس الصحفيين والجرايد تغلق<br />نسمع ان البلد مليانة اشاعات فيمن يحكم ومن على فراش الموت ومن سيورثة<br />القليل من الثروة البترولية الغاز تصدرونة الى اسرائيل<br />نصف مليون مصرى تجنسوا بالجنسية الاسرائيلية<br />القرى بدون مياة شرب والناس تظاهرت من قلة المياة وكانكم لستم بلد النيل<br />بيع فى ممتلكات الدولة وتاجيرها مفروشة وكانكم ستغادرون البلد فى هجرة جماعية الى القمر وحتى الهنود اشتروا مصانعكم ( الدولة ناوية تعزل بشعبها وتروح القمر والا ايش )<br />انتم كشعب مصر سايرين لوين<br />وين مصيركم<br />الهجرة والغرق على شواطىء اوروبا<br />بدنا نسمع اخبار طيبة عنكم --- اللة يستر<br />ملاحظات من شخص مب مصرى"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116014250/http://masr.20at.com:80/newArticle.php?sid=12443"

[[comments]]
order = 1
subject = "على اسم مصر يكتب التاريخ مايشاء انا عندى مصر احب واجمل الاشياء"
author = "احمد ابوصالح(صحفى مصرى )ويشرفنى"
text = "الاخ الى مش مصرى مايشرفناس انك تكون مصرى وعدم ذكرك لبلدك ووطنك دليل قوى على عدم انتماءك للبلد انت منها واكيد زبالة زيك لما مؤخذة لانك مستعر منها ولم تقول انت منين وبعدين السلبيات البتحصل فى مصر بتحصل فى كل دول العالم وخصوصا الدول العربية بس الفرق اننا بنحاول نلقى الضوء على مشاكلنا بدل مابغرس رؤسنا فى التراب زى النعام<br />واخيرا مصر هتضل قوية عزيزة والكل يغار منها بشبابها وناسها المحترمين الطيبين وجيشها واعلامه وصحفتها"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116014250/http://masr.20at.com:80/newArticle.php?sid=12443"

[[comments]]
order = 2
subject = "إلى ؟؟؟ اللي مش مصري"
author = "أنا مصري"
text = "الي الاخ مش مصري بالنيابه عن 70 مليون مصري احب اقولك انت عربي جربان متحشرش نفسك في اللي ملكش فيه كل العرب غايرنين من المصريين عشان احنا عندينا تاريخ و حضاره اي نعم الحكومه بس كل الحكام العرب كده عشان انت طولت لسانك علي مصر علي موقع مصري و كمان عشان انت جبان و مقولتش انت من انهي بلد احب اقولك اشهر و احلي تحيه من شب مصري و انا متاكد انك لو نزلت مصر مصر كلها هتقولك نفس الكلمه ؟؟؟"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116014250/http://masr.20at.com:80/newArticle.php?sid=12443"

[[comments]]
order = 3
subject = "مرض نفسى عضال اسمه العرب المشاركة .. تعبتونا معاكوا بس نعمل ايه انتو زى الوحمة فى الضهر"
author = "محمد المصرى"
text = "الى اللى مش مصرى .. ابقى خللى الجزيرة والعربية ينفعوك لما بلدك تتقسم عشرين حته لكل طايفة وعرق .. كلكم حترجعوا قبايل تمص فى دم بعض ومفيش استثناء الا المغرب العربى .. المشرق العربى المتعالى الاعمى فى النظر اللى خطاياه سيدفع ثمن غرورة وتكبره على مصر .. خللى الجزيرة والعربية ينفعوك .. .. الغريب بقى ان المعفنين دول لو حصلتلهم مصيبة تلاقى نفس المعفن اللى كان بيشتم فينا ويرثى احوالنا هو اول واحد يعيط ويقوق ويقول راحت فين مصر واين الدور المصرى .. ايها العرب المشارقة ... انتو تقرفوا"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116014250/http://masr.20at.com:80/newArticle.php?sid=12443"

[[comments]]
order = 4
subject = "الى اللى مش مصرى بس اكيد عربى"
author = "محمود المصرى"
text = "حاجة تانية للشاب الكتيان اللى كان بيتكلم عن مصر وبيسمع الاخبار من الجزيرة والعربية .. فى حقيقة انتو مش بتحبونا اعترفوا بالحقيقة دى نعرف نتعامل مع بعض انتو بتكرهونا واحنا مش واخدين بالنا لاننا مش مهتمين بحبكم او كراهيتكم نفس اهتماممكم انتم .. مصر بلد كبيرة يعنى اليوم اللى تسمع فيه ان فيه شبكة دعاة اطفال هو نفس اليوم اللى بياخد فيه واحد مننا جايزة نوبل . لاننا بلد كبير .. انت بلدان مملة وفى انتظار ان تسمحوا للنساء بقيادة السيارات .. او لو كنت اردنى فحذار فتنة جديدة بينكم وبين فلسطينيي الداخل ولو كنت سورى فربنا يستر عللى سوريا لاننا بنحبها .. اما لو كنت عراقى فربنا يصبرك"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116014250/http://masr.20at.com:80/newArticle.php?sid=12443"

[[comments]]
order = 5
subject = "اللي اللي مش مصري"
author = "مصري ابن مصري"
text = "تقريبا الحمار اللي مش مصري من الخليج لان كلمه مب مصري اللي استعملها في اخر سطر خليجي مش بعيد تكون سعودي عشان كده قلت عربي عشان متنشتمش<br />المهم انت طلعت خليجي يعني ابوك نايم مع الخدامه و امك نايمه مع السواق الهندي و اختك نامت مع نص البلد اللي انت مستعر تقول اسمها<br />شوف يا سيدي اسال اي مصري حتي لو كان جعان و نايم في الشارع ايه رايك في الخلايجه و هيؤلك نسوانهم شرشر ( عشان الرقابه) و رجاله هلس روح موقع )youtube.com) و بس اكتب سعودي و انت تلاقي بلاوي اشي بنات سكرانه و اشي بنات بتت ان ان واللبيب مش الاشاره يفهم طبعا انت مش فاهم حاجه لان ابوك الحقيقي هوا الخدام الهندي اللي نام مع امك زمان و انت وارث التياسه منو"
archived = "2008-01-15"
capture_url = "https://web.archive.org/web/20080115203603/http://masr.20at.com:80/newArticle.php?sid=12443"

