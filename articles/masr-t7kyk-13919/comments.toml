text = "دى حاجة متوقعة .. وقلتلكم قبل كدة<br />وأخدنا حوادث القطارات الى قبل كدة كمثال .. فبعد حادثة قطر الصعيد بقت نشرات الأخبار عندها اهتمام غير عادي برصد أتفه حادثة قطر حصلت في اى دولة تانية وممكن تكون الدولة دى شخصياً مش مهتمة بيها .. وده علشان نوصل للناس أن الحوادث بتحصل فى كل حتة مش في مصر بس .<br />طب بلاش دى .. نروح لحادث غرق العبارة السلام ... بعدها شوفنا عشرات حوادث الغرق والأنقاذ حول العالم لسفن كانت معظمها تجارية .. وبرغم كدة أصرت نشرات الأخبار انها تجيبها وبرده علشان تقولنا أن السفن و العبارات بتغرق فى كل بحور الدنيا .<br />وأدي الجاموسة أهى آخرة المطاف .....<br />أهتمام غير عادي بحوادث فردية .. علشان نقول أن الجاموسة مش بس تقدر توقف قطر .. لأ .. دي كمان بتعمل خناقات كبييييرة اوي .. ويصاحب ذلك صوت فى الخلفية .. أنها أكثر من مجرد جاموسة ."
