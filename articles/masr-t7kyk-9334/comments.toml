[[comments]]
order = 0
subject = "طابور العيش - رمز مصر الحديثة"
author = "من هناك"
posted = "2008-06-16"
text = "بعد اداء العمرة واثناء العودة كان فى وداعى فى مطار جدة صديق سعودى ومعة اخ سورى هى مجموعة العمل فى مكتبنا فى السعودية - وكان وداعهم حار ومؤثر<br />وفور نزولى من الطائرة فى القاهرة قررت ان اتصل بيهم لاطمنهم على سلامة الوصول<br />وهتف السورى ضاحكا<br />اية الدوشة اللى حواليك دى انت واقف فى طابور الخبز<br />اما السعودى فقال ضاحكا<br />صحيح فية طوابير خبز قريبة من المطار - ابعت صور بالموبايل"
archived = "2010-03-14"
