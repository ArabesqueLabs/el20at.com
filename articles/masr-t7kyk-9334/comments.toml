[[comments]]
order = 2
subject = "احنا أقوى منهم"
author = "اكتب اسمك هنا"
posted = "2008-06-16"
text = "وهو يعني لما الشتايم دى موجودة بين فئة سيئة فى المجتمع يبقى نعلمها للمجتمع كله<br />حسبى الله ونعم الوكيل<br />نفسى الناس تعرف اننا احنا اللى بنجحهم<br />بلاش ندخل الأفلام دى أساسا ولا نتابعها وهى هتقع لوحدها<br />لكن نتفرج عليها وبعدين نقعد نشتم فيهم .. يبقى ايه الفايدة<br />نفسى مفهم اننا أقوى من كل الفساد ده اصلا"
archived = "2010-03-14"
