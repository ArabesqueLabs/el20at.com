text = "[quote name=\"ممدوح زكى زخارى جرجس\"][quote name=\"ممدوح زكى زخارى جرجس\"]اقتراح يجب ان يدرس بجدية و عناية و تفهم و تقدير :eek:<br />لماذا لا يجب عرض جميع ضباط الشرطة على اطباء الطب النفسى و الامراض العصبية مرة كل ثلاث أشهر للفحص الطبى و النفسى؟<br />النتيجة معروفة مقدما؟ :lol: :P :roll:<br />جميعهم مرضى السلطة و العنترية و الديكتاتوريةو السادية!!!<br />و من ثم فسوف تفتح ابواب اكاديمية الشرطة لطلب دفعات جديدة كل 3 أشهر؟<br />و تحويل السجون و المعتقلات الى مستشفيات لعلاج هؤلاء الباشوةات الكبار و الصغار من الامراض المزمنة المتاصلة فيهم :lol:<br />و الدليل هذا الكم الهائل من الاحكام التى صدرت ضد تجاوزات هذة الفئة الضالة من السادة حكام مصر الصغار و الكبار الضباط باشوات الشرطة :P[/quote]<br />و ليفهم الجميع (نحن جميعا نعيش فى عصر ديمقراطية مبارك)<br />و ليست عصر ديكتاتورية صلف و غرور و استبداد الشرطة<br />(نحن دولة مؤسسات و قانون)و<br />( لسنا دولة سلطة شرطة مستبدة؟ ;-)[/quote]"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527211507/http://www.20at.com:80/t7atuf/12186-2009-05-26-07-40-24.html"

