subject = "مدرسة \"الإمام العلامة\" تفتح أبوابها للمر"
author = "محمود"
posted = "2008-07-25"
text = "\"اجتمعت الجهود، وتضافرت الخبرات، وتوجَّهت النيَّات المخلصة -بإذن الله تعالى&--1648;- لتدشين موقع (الإمام العلامة) ليلة السابع والعشرين من رجب ، وهو يعد أول موقع على الإنترنت يُمثل مدرسة مميزة فريدة ذات فكر راقٍ، وعلمٍ منير غزيرٍ حيث يجمع أعمال علماء وآئمة مميزين؛ فهنا ستجدون أعمال كاملة لفضيلة الإمام العلامة \"علي جمعة\" مفتي الجمهورية ورمز من رموز الأمة ودرة تاج علمائها"
