text = "يعني لو عنا شباب الهم فكر وعقل كان ما نضحك عليهم بس هم مخهم فاضي بس بدهم يحبو وينحبو مفكرين حالهم بدهم ياخدو شهادة الحب بهيك علاقات ولكو صحصحو بلالكم هاد الهبل يعني كيف بدكو تحبو هيك بنت يعني فكرو فيها الي بتحكي معك بتحكي مع عشرة غيرك...<br />مع تحياتي..."
