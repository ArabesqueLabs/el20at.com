text = "يااااااااااااااااااه أخيرا بعد كل العمر ده حد هايفتح عيون الناس على الحقيقه ..... نحن أمه لا تنكسر و شعب لا يركع إلا لله رب العالمين مهما تكالبت علينا الأمم و الطواغيت<br />الحرب لم تكسرنا ولكنها زادت من عزمنا و أنتصرنا على الرغم من أقمارهم الصناعيه و دبابتهم ............... ولكن مهلا هناك جوله أخرى بدأت من كامب ديفيد<br />أستعدوا يا شعب مصر العمليه قربت أوى .............. و أن شاء الله ديه نهايتهم فى المنطقه و يمكن فى العالم كله ..... أمريكا عينها على مصر"
