[[comments]]
order = 3
subject = "لا تعليق ... الواقع تعليقه أكبر وأعم"
author = "محمد السيد"
text = "توفي إلي رحمة الله السائق إسلام أمس... تأثرا بالحروق... وشيعت الجنازة في حراسة أمنية كالعادة مشددة ..<br />ياتي ..إيه شعور أبوه ..وهو طالع الصبح بالتوك توك يجيب له قرشين يرجع له جثة علي مشرحة علي مقبرة ... من غير حس ولا خبر؟<br />مش حأعلق كتير ...<br />لكني كنت واحد من الوافقين ... وكنت واحدمن أهل الشارع .. وواحد من اللي شافوا الاف الجنود من االمن المركزي والرتب والقيادات .... كل همهم ...... إسكات الصوت والفعل ... صوت وفعل الناس ..وبس<br />مش .... حأسكت ... أكيد"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218095244/http://masr.20at.com:80/newArticle.php?sid=18871"
