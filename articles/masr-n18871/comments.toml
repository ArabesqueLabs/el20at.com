[[comments]]
order = 0
subject = "دخلنا مرحلة الخطر - اشتباكات بين الحكومة والشعب"
author = "المفتش كرومبو"
text = "فى اسيوط حدثت مواجهات بين الشرطة والشعب<br />وفى اسوان حدث مواجهات بين الشرطة والشعب<br />وفى كل مكان وكل يوم تقريبا مواجهات ومعارك واستخدام قنابل الدخان<br />وفى سينا اشتباكات بين المواطنين والشرطة وقتلى وقنابل دخان<br />هل ستتطور الامور الى حرب عصابات واغتيالات - اللة اعلم<br />الواضح ان الناس فاض بها - ومعندهاش حاجة تخسرها - التهمة جاهزة التجمهر ومقاومة السلطات وتعطيل المرور<br />الشرطة بتستفز الناس<br />والناس ضاقت وضاق خلقها<br />وبداية ونهاية<br />لا الجيش ولا الشرطة هيقدروا على الشعب اذا فلتت الامور<br />على رئيس الدولة تغيير وزير الداخلية وتغيير سياستة اللى هتودى البلد فى داهية"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218095244/http://masr.20at.com:80/newArticle.php?sid=18871"

