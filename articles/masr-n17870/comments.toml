order = 0
subject = "كان مسلسلا ناجحا بكل المقاييس وكان يناسب  رمضان فل"
author = "واحد مصرى من مصر"
posted = "2008-10-11"
text = "كان مناسبا جدا لاسرتنا ان تتفرج على مسلسل محترم ونظيف فى رمضان فليس فية دينيا ما يخدش الحياء وكان يتكلم عن جيل الاباء المناهضين للاستعمار<br />ايا كان موقف الاخوان فطبيعى ان يسير عبد الناصر ضد اتجاههم<br />اولا الاخوان يؤمنون بالاقتصاد الحر مثل الحزب الوطنى واحتكار السوق وهذا يصلح لامريكا ولا يصلح لمصر القليلة الموارد الضعيفة الامكانيات<br />نحن الفقراء وعامة الشعب المصرى نختلف مع الاخوان على سياستهم الاقتصادية المشابهة للحزب الوطنى الفاشل<br />اما عبد الناصر فكان يؤمن بالحل الوسط بين الشيوعية والراسمالية الوطنية<br />كانت الارض ملك الفلاحين وكانت الدكاكين والعمارات ملك الناس<br />نعم كان مسلسلا ناجحا ومن احسن المسلسلات فى رمضان وليس فيها خيال غير واقعى زى الدالى وغيرة"
archived = "2008-10-14"
capture_url = "https://web.archive.org/web/20081014020216/http://masr.20at.com:80/newArticle.php?sid=17870"
