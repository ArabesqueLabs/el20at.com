author = "الحل بسيط جدا"
posted = "2009-12-09"
text = "زمان قوى لما كان فية حكومة - كان ضابط الشرطة ومعة اتنين مخبرين بيمر بجانب مدرسة البنات فى الصباح والبنات رايحة مدارسها - ولما كان بيشوف اى شاب بيقرب بس من بنت او يعلق بكلمة اثناء مرورها كان المخبر بيجيبة من قفاة على البوكس وكان داخل البوكس عسكرى حلاق يحلق لة ظلبطة من جنب واحد ويسيبة طليق<br />طبعا الشارع والحارة كلها بتعرف ان فلان اتمسك واتحلق لة شعرة<br />لو فية ضباط بتمر وتتصرف كان العملية انتهت من زمان"
