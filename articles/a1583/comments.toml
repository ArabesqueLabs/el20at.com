[[comments]]
order = 1
subject = "مغربى"
author = "دى هلا اتحدث عن ها الحالة الكتير غريبة"
text = "شاب متل محمد واكرر(محمد) لما تذهب لايطاليا وانت تعرف انك غير مرغوب هناك انت ومن متلك<br />ليش ماتحترم نفسك وتصير ببلدك<br />بدى اعرف ليش ها المهانة وليش بدك تتعرض لهيك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143058/http://www.20at.com/article.php?sid=1583"

[[comments]]
order = 2
subject = "إلى من يلوم محمد"
author = "دابة ذى بدء اكتب لاول مرة تعليقا"
text = "ولكن<br />ارسل الى من يلوم محمد<br />شاب اراد السعى الى حياة لا يلام على سعيه ولكن يلام على اسلوب السعى ولا تشد عليه اللوم فما هو الا شاب اراد ان يعمل ويجد فى العمل<br />للوم درجات وأراك تقرعه ولا تلومه<br />جزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143058/http://www.20at.com/article.php?sid=1583"
