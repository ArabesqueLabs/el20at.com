order = 0
subject = "ولم يذكر الكاتب انة يجرى عملية تبنيهم من قبل العائلات لتنصيرهم"
author = "قرفان على الاخر"
text = "من الذى تسبب فى خروج هؤلاء القصر الذين لم يبلغوا سن الحلم غير نظام حكم فاشل<br />يعتمد على البلطجة فى ادارة شئون الدولة<br />هؤلاء الصغار يتعرضون للتنصير ولبس الصليب من اجل الاقامة والاعالة ولقمة العيش<br />تفقير الشعب واذلالة وجعلة يهرب من وطنة من حفنة من المتخلفين عقليا يجلسون على الكراسى ومالهمش دعوة بأى حاجة فى اى حاجة<br />ويقعون ايضا تحت ايدى العصابات التى تتاجر فى الاعضاء البشرية<br />وبعضهم يتم سرقة كليتة<br />وبعضهم يستخدم فى تجارة الجنس وبيوت الدعارة"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003141/http://masr.20at.com:80/newArticle.php?sid=14609"
