[[comments]]
order = 0
subject = "الحمد للة الذى لا يحمد على مكروة سواة"
author = "واحد"
text = "الناس كلها مبسوطة وبتشكر ربنا - واهو السواق اللى ركبت معاة بيبوس ايد الحكومة وش وظهر - علشان مش هيتحاسب يوم القيامة - ماهو خلاص عايش فى جهنم - يبقى دنيا فى جهنم واخرة فى جهنم -<br />الحمد للة وشكرا للحكم الديمقراطى الشفاف - بتاع المكتسبات التى لا تراجع عنها<br />وشكرا للجنة السياسات لتخطيطها الرائع فى جعل حياة الناس جحيم على الارض وتخللى السواق يدخل البيت وعيالة نايمين ويخرج منة وعيالة نايمين<br />شكرا حكومة الحزب اللى محصلشى"
archived = "2007-12-30"
capture_url = "https://web.archive.org/web/20071230141216/http://masr.20at.com:80/newArticle.php?sid=13589"

[[comments]]
order = 1
subject = "يا حكومة خلى عندكم شوية دم (حسرة عليكى يا مصر)"
author = "مواطن زى اى مواطن"
text = "انا دايما اسئل نفسى هى الحكومة مش حسة بالشعب لية واخيرا فهمت لية الان السادة المسئولين من الرئيس لاصغر وزير بيمشوا بمواكب ويتقفلهم المرور وهكذا اذا مش هيحسوا بالزحمة ولا ركوب المواصلات والا المترو وهكذا ثانيا عمرى محد فيهم وقف فى طابور عيش وقعد بالساعات مستنى الرغيف المدعم الزلنا بية عشان هما بياكلوا عيش السرايا<br />وعايشن فى مناطق راقية لا زحمة ولادوشة ولا اى شىء وعندهم من الفلوس ما يئمن احفاد احفادهم وحاجت تانية كتيرة توجع قلبنا من البذخ الهما فية واللة انا لااحقد على احد بي نفسى يكون عندهم شوية دم ويحسوا بالناس فى معانتهم فقط لاغير صعب دية ... واضح ان انها صعبة على الحكومة"
archived = "2007-12-30"
capture_url = "https://web.archive.org/web/20071230141216/http://masr.20at.com:80/newArticle.php?sid=13589"

[[comments]]
order = 2
subject = "بشرى لمن يريد الفوز"
author = "علي"
text = "بشرى للجميع<br />إلى كل من أراد الدنيا<br />وإلى كل من أراد الآخرة<br />وإلى كل من أرادهما معا<br />إلى من يبحث عن النجاة وراحة القلوب<br />إلى كل من سعى إلى مرضاة الله<br />إلى كل من حاول أن يحفظ القرآن ولكنه توقف<br />إلى كل من أراد أن يكون من حملة القرآن<br />إلى كل من أراد أن يتعلم أحكام التجويد<br />تعالى إلى قناة الحافظ<br />بشرى لكم جميعا<br />انطلقت قناة الحافظ (إحدى قنوات باقة الناس)<br />وهي تعنى بالأساس بالقرآن<br />مهما كان سنك أو تعليمك أو وقتك ستجد عندنا ما يعينك على حفظ القرآن<br />سطر كل يوم حفظ لن يكلفك الكثير وستأخذ الأجر الجزيل<br />القناة على تردد 12360<br />هيا جميعا إلى مأدبة القرآن"
archived = "2007-12-30"
capture_url = "https://web.archive.org/web/20071230141216/http://masr.20at.com:80/newArticle.php?sid=13589"

[[comments]]
order = 3
subject = "الشعب عمره ما كان مبسوط"
author = "نيفين نيفى نوفا"
text = "سالت نفسى هل هيتغير الوضع ف السنه الجديده<br />هل هيتغير للاحسن و نستريح ام للاسوا علشان الكبت ينفجر و نخلص بقى<br />و قبل ما اجاوب جانى الرد لما فتحت التليفزيون و شفت بيان الدكتور احمد (نظيف)و حسيت بالاحباط و يمكن ده شعور حسه اللى شاف البيان<br />تقريبا يا جماعه يبقى الحال على ما هو عليه و على راى محمد صبحى ف تخاريف عمر الشعب ما كان مبسوط الشعب عمره ما كان مبسوط و انا بقول الشعب عمره ما هيكون مبسوط"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102084118/http://masr.20at.com:80/newArticle.php?sid=13589"

[[comments]]
order = 4
subject = "مطحون زيك تمام"
author = "وقال العقاد"
text = "المقالة دى بتفكرنى بكلمة كانت دايما على لسان العقاد كان ديما بقول (افعلو ما شئتم ما دمتم فى عهد عبد الناصر )<br />يعنى كل اللى عاش فى عهد عبد الناصر مش هيتحاسب لان اللة كريم ولا يجمع بين نارين على مخلوق............<br />يعنى احنا رايحين الجنة حدف ومن غير حساب كمان لاكريم هنا هو كريم هناك ولا اية"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102084118/http://masr.20at.com:80/newArticle.php?sid=13589"
