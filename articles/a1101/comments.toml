[[comments]]
order = 3
subject = "عروس الجنوب"
author = "مصراوى"
posted = "2008-07-25"
text = "اخى احمد انا مثلك تماماً من معجبى وعاشقى عروس الجنوب كم فكرت بهذه الشجاعه التى كانت تمتلكه<br />رغم انه كانت فى السابعه عشر من عمره وكم فكرت كيف اساعد فى تكريمه الشهيده سناء كنت اتمنى ان اكون فى عنقون اليوم لاشارك فى تكريم الشهيده البطله لاكان كنت هناك فى عنقون بقلبى نعم شاهدت هذ التكريم الكبير عبر التلفاز والذى كان ينقله اغلب الفضائيات اللبنانيه (تلفزيون المنار تلفزيون الجديد وقناه nbn )<br />اخى احمد لكم فكرت فى اطلاق موقع خاص للشهيده يحمل اسمه لاكان المواد والمعلومات التى عندى عن الشهيده لاتكفى لانشاء الموقع واقترح عليك اطلاق موقع مشترك ان وانت وكل من يريد المساهمه فى هذا الموقع حتى لو بمعلومه بسيطه عنه وهذا اميلى masrawy202@hotmail.com للناقش الامر سوياً"
archived = "2010-03-14"
capture_url = ""

