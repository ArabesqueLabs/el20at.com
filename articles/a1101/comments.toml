author = "amal"
posted = "2008-06-03"
text = "السلام عليكم جميعا انا لسه عارفة مين هى سناء والحقيقة انا خجلانة من نفسى ومن كل اللى ماتكلم عنها ولا خلد ذكراها اكتر من كده هى وكل الشهداء بس فى الاخر هقول كله ربنا يجازى كل من ينشر حكايتها كل خير"
