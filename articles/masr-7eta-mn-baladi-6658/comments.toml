[[comments]]
order = 0
subject = "مش حلوة خالص"
author = "مصرى"
text = "مطروح مش كدا يا جماعه مطروح حاجة تانية خاااااااااااااااااااااااااااااااااااااااااالص<br />متهيالى لو كانت الصور دى من شلالات عجيبة او اى قرية سياحية فى مطروح كانت تبقى اروع<br />سورى الصور مش حلوة خالص خالص خالص"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820154536/http://masr.20at.com:80/newArticle.php?sid=11023"

[[comments]]
order = 1
subject = "مش أى حد مسك كاميرا بقى مصور"
author = "محمد"
text = "مع ان الكاميرا بتاعتى الديجيتال نص بل ربع كم انما ممكن أوريكم صور مطروح اللى بجد . طبعا ده مش تكسير مجاديف ولا غرور منى لا سمح الله ولا حتى باعتبر نفسى محترف فى التصوير بل بالعكس انا اقل من هاوى أو تقدر تقول مبتدئ لكن الصور هى اللى تحكم لو مستعدين للمنافسة علقوا ع التعليق ده وانا ابعتلكوا الصور ونشوف"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820154536/http://masr.20at.com:80/newArticle.php?sid=11023"

