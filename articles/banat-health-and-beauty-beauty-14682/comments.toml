posted = "2010-01-18"
text = "اقتباس shazarose:<br />بصراحة واااو حلوين جداااااا انا بدور على الاستيل ده بالمول بس مش بلاقى ستايل لو حد يعرف محل بالاسكندرية يقولى<br />في محلات كتير في محطه الرمل في اسكندريه و مولات زي جرين بلازا في اكتر من محل كويس و هتلاقي عندك في محطه الرمل بالذات في سنتر الفلكي في الدور التاني محل حلو اوى مش فكره الاسم بالظبط بس هو تقريبا تاتو او تيتو حاجه كدة و في محل اسمو ادم حلو اوى و بالي في سموحة و في محل تاني مش فكره اسمو في شارع مصطفي كامل في سموحه قبل التقاطه بتاع ستودرو فرح<br />في اماكن كتير حلوة"
archived = "2010-02-06"
capture_url = "https://web.archive.org/web/20100206160552/http://www.20at.com:80/banat/health-and-beauty/beauty/14682--2010.html"

