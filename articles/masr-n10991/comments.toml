subject = "استهتار"
author = "محمد بدر"
posted = "2007-07-10"
text = "فعلاً قمة الأستهتار بالناس يعني انا واحد معرفتش بموضوع التخير دا الا لما تعبت فدوست علي الرقم المسجل في الاتصال السريع بالمستشفي برقم الطوارئ.. طبعاً متصلش وفي حالتي معرفتش اركز اعمل ايه.. ولالا وصول اختي بعدها بدقائق مكنتش قدرت اكتب السطور دي .."
archived = "2007-07-12"
