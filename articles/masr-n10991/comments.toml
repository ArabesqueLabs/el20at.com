subject = "السلام عليكم"
author = "ايمان كمال"
posted = "2007-07-10"
text = "موضوع هايل بجد لسبب مهم جدا ان معظم الارقام اللى اعرفها باظت لانى لما بطلبها بتكون مش موجوده بالخدمه وببقى مش عارفه ازود 2 ولا 4 ولا ايه وفعلا الواحد حاسس بغربه مع رقم بيته لما حد بيسالنى عن رقمى بلخبط دايما وبكون محرجه طبعا بس لان الواحد اتعود المهم ياريت دايما موضوعاتك الحلوه يا مروه"
