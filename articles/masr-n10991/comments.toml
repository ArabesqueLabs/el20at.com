[[comments]]
order = 4
subject = "حق المشترك"
author = "محمد عبد العاطي"
posted = "2007-07-10"
text = "بالطبع دب مشكلة كبيرة ان يكون في مشتركين تتغير نمر تيلفوناتهم من غير ما يكون في اخطار ليهم او موافقتهم علي التغير دا وفي نفس الوقت التغير لما تم متمش بطريقة منطقيةيعني ميبقاش مناطق ومناطق علي الاقل كان يبقي القاهرة والجيزة كلهم رقم واحد<br />المفترض ان جهاز خدمة المستهلك يدخل ويعترض علي اللي حصل لان التعدي دا زيه بالضبط ويمكن ابشع من زيادة الأسعار وغش المنتجات<br />طبعاً الموضوع دا مهم جداً واي حد يشوف غير كدا يبقي مش فاهم يعني ايه حقوق للمواطن والمستخدم ومش فاهم يعني ايه انسان عنده كرامه وعادي جداً انه ياخد علي قفاه وهو نفسه ممكن يقول كمان<br />التحقيق فعلاً رصد مشكلة ممكن الناس السطحية التافة متقدرش تقدر خطورتها انما هو بالفعلبيبرز مشكلة كبيرة جوا بيت كل واحد فين<br />ا موضوع هايل يا مروه"
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150416/http://masr.20at.com:80/newArticle.php?sid=10991"

[[comments]]
order = 5
subject = "موضوع مش حلو"
author = "عادي"
text = "فعلا موضوع غبي أوي يا مروة ..ايه يعني يزيد رقم أو ينقص.. ولاالأخت بتاعت زحمة المرور..اظن ان مش مشكلة لو طلبت رقم غلط في الاول ورجعت طلبته تاني..ايه الصعب في كده..يومين وهتتعودوا عادي يعني ...ما انتو متعودين ع الهم 25 سنة ...تعبتوا من رقم زيادة؟<br />عيب يا مروة مش دي موضوعاتك الحلوة"
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150416/http://masr.20at.com:80/newArticle.php?sid=10991"

[[comments]]
order = 6
subject = "ضع عنوان التعليق"
text = "خلينا في اقباط المهجر شوفو بيقولوا علينا ايه<br />أرسل هذا التعليق بواسطة : مش ضروري<br />ولكي نختصر الطريق نقول ان هناك كاتبة تدعي زينب عبد العزيز كتب في هذه الصحيفة بتاريخ 8 يوليو 2007 تحت عنوان (ويبقي الحوار الديني الامين هو السبيل للتعايش) كتبت هذه الكاتبة مقال لا نعرف اذا كان شتائم ام اكاذيب ام اوهام ام خرافات ام ازدراء بالديانة المسيحية ام ماذا المهم انه مقال موقع ادناه بلقب دكتورة زينب عبد العزيز وواضح انها من حملة الدكتوراة اياها بتاعة الازهر او بمعني ادق بتاعة رضاعة الكبار وشرب بول كل الحيوانات وايضآ بول الرسول ..... الخ ولم اجد ترابط في هذا المقال لكن للحق فأنه مقال اسلامي لايكتبه الا داعية اسلامية لما فيه من الاسس والقواعد التي تبيعها الكتاب والدعاة الاسلامية من كذب وتضليل وتهجم علي العقائد الصحيحة والتمجيد في العقيدة الكاذبة .... الخ<br />تتصوروا يا جماعة ناس مسيحيين عايشين في اكبر دولة اسلامية ما يقولوش عن الاسلام الا الكلام الفارغ دا<br />الاسلام اللي حكم نصف الكرة الارضية الف سنه"
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150416/http://masr.20at.com:80/newArticle.php?sid=10991"

