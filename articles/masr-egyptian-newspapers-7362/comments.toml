subject = "الهرم"
author = "ياسمين"
posted = "2008-09-26"
text = "انا معك ان القاهرة تحتاج الى ان تغسل وجها ومعك ان القاهرة تعد من اجمل المدن وليست القاهرة فقط بل الاسكندرية ايضا وان الخديوى اسماعيل من اعظم حكام مصر ولكن هناك معلومة احب ان اصححها لك وهو ان مبنى البريد بالعتبة بناه الملك فؤاد 1931 ليكون المقر الرئيسى للبريد بمصر موجود بالقاهرة بدلا من الاسكندرية وبنى الطابق التانى والثالث فوق مكتب البريد الرئيسى بالقاهرة وكان قبل ذلك مقر البريد الرئيسى يقع بالاسكندرية بشارع الفريد كليار ولكن مؤسس البريد المصرى هو الخديوى اسماعيل 1865 حينما اشترى شركة البوستة الاوربية من صاحبها جاكو موتسى أول مدير لمصلحة البريد المصرى والمبنى يحتوى على متحف البريد او متحف فؤاد الاؤل كما كان يطلق عليه امر بانشائه الملك فؤاد عام 1934 وافتتحه للجمهور الملك فاروق عام 1940 والمتحف يحتوى على مجموعة رائعة من الطوابع القديم وكذلك التحف البريدية الثمنية"
