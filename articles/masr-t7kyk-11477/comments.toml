text = "لان المنتجين بيستهبلوا عايزين يأكلوني البلوظه ويدوني 5 مليون بس وانا طبعا ما اقدرش اخر اقل من 10 مليون<br />5 مليون يعملوا فيه في الايام لاسودا دي<br />هو ابو تريكا احسن مني ابو تريكا لما بيعطس بيروح المانيا يتعالج هناك"
