[[comments]]
order = 0
subject = "لماذا اخترت أن تكون انطلاقتك السينمائية من مصر ولي"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-03-05"
text = "اخترت مصر<br />لان المصريين ناس هبل وبيدفعوا فلوس كويسه والشعب اهبل وعبيط وبيسقف على اي حاجه وبفضل الشعب المصري العالم الصيع والاونطجية والحرامية اصبح لهم شأن عظيم زي عادل امام كده واحد صايع وجربان وحافي مش لاقي شغل اصبح اكبر فنان في مصر وغيره وغيره كتير من الصيع والحوش اللي اصبح لهم شأن عظيم بفضل الشعب المصري الفاشل اللي بيستهبلوه وبيقولولوا اتصل على رقم 0900490 علشان خاطر حتكسب شقه او حتكسب الف دولار في الاسبوع<br />هو فيه زي مصر يا دعاء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "يا دعاء حسن"
author = "مش لازم ولا ضروري"
posted = "2009-03-05"
text = "لما تيجي تعملي تحقيق صحفي مع اي ممثل لازم تسالي سؤالين مهمين<br />1) انت خريج ايه بالضبط علشان تثبتي انه صايغ وضايغ<br />2) هي الاجرة او (الهبرة) كام بالضبط لان انتي عارفه بيهبروا بالملايين دلوقتي مش زي زمان<br />شكرا يا دعاء حسن وسلميلي على دعاء الشامي"
archived = "2010-03-14"
capture_url = ""

