text = "يتم الان تجهيز بنك القاهرة للبيع وذلك باتباع نفس الخطوات التى تمت مع بنك الاسكندرية (فتح المعاش المبكر بمميزات كبيرة / خطوة غريبة وهى قيام بنك مصر بشراء مديونيات بنك القاهرة فى خطوة غريبة وغير مفهومة ربما لتنظيف محفظة بنك القاهرة قبل البيع للمستثمر الذى تتردد اشاعات انه عربى الجنسية) برجاء التحقق و نشر ما يتم التوصل اليه 0"
