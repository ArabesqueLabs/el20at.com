order = 0
subject = "الضرب على القفا"
author = "مش فاهم حاجة"
posted = "2008-01-06"
text = "حينما يعيش شخص بجانب جار بلطجى ويقول هذا الشخص للبلطجى انا مسالم انا مش معايا سلاح انا ضعيف وجوعان<br />البلطجى مش ها ياخدة بالحضن ويطبطب علية - البلطجى هيضربة على قفاة<br />البلد بتنضرب على قفاها لانها نزعت سلاحها والحكومة خافت من جيشها<br />القوة هى الاساس<br />نحن نجوع من اجل ان يكون لنا جيش قوى<br />لما يموتوا لنا عسكرى على الحدود نموت لهم اربعة<br />انما يموتوا عسكرى على الحدود ومحدش من القيادة يتنفس ويقول موتوة لية<br />دة اسمة ضرب على القفا"
archived = "2008-01-07"
capture_url = "https://web.archive.org/web/20080107231139/http://masr.20at.com:80/newArticle.php?sid=13721"

