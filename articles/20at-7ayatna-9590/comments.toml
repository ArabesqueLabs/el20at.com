subject = "أرقص الصحابة أو لم يرقصوا"
author = "يوسف"
posted = "2008-12-01"
text = "أرقص الصحابة أو لم يرقصوا غير مهم لأنه إذا قيست صلاحية الأعمال بما فعل الصحابة أو لم يفعلوا لبقي العالم كما كان في أيامهم! الصوفية تقوم على محبة الجمال في كل شيء وليس على القشور اليابسة للعقيدة."
