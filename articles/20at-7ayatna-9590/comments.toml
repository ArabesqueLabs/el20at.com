[[comments]]
order = 1
subject = "جهل طبق و لا حول و لا قوة إلا بالله"
author = "أبو الحسين السلفي"
posted = "2008-11-15"
text = "هل رقص الرسول صلى الله عليه و سلم كما يفعل هؤلاء الجهال (إن كان فن كما يحبون أن يسمي البعض الرقص والأغاني فلا يحاول كائنا من كان كالفرنسية التي ذكرت في الموضوع ربط هذه الخرفات بالإسلام ...<br />الموسيقى حلال ام حرام و الرسول صلى الله عليه و سلم يقول : ليكونن من أمتي أقوام يستحلون الحر والحرير والخمر والمعازف . صحيح أخرجه البخاري<br />معنى يستحلون أي كانت حرام<br />ثم الرقص هل رقص النبي صلى الله عليه وسلم هل رقص صحابته هل رقص تابعيهم لم يرقص إلا هؤلاء الذين يصدق فيهم قوله تعالى :الَّذِينَ اتَّخَذُوا دِينَهُمْ لَهْوًا وَلَعِبًا وَغَرَّتْهُمُ الْحَيَاةُ الدُّنْيَا فَالْيَوْمَ نَنْسَاهُمْ كَمَا نَسُوا لِقَاءَ يَوْمِهِمْ هَذَا وَمَا كَانُوا بِآيَاتِنَا يَجْحَدُونَ."
archived = "2010-03-14"
