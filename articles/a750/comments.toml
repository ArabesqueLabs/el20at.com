subject = "مصـ( الخير )ـعب"
text = "السلام عليكم وكل سنة وانتم طيبين ,<br />أنا بقى وصلتني الرسالة دي :<br />\"كعادتي كل عام<br />يرسل سـموي -حفظني الله-<br />برقية تهنئة بالعيد<br />لعامة الشعب!!\""
archived = "2005-04-06"
capture_url = "https://web.archive.org/web/20050406083246/http://www.20at.com:80/article.php?sid=750&mode=&order=0"

[[comments]]
order = 18
subject = "مصـ( الخير )ـعب"
text = "و جائتني هذه أيضا:<br />\"اللهم هؤلاء أحبتي فيك ,<br />اللهم فثبتهم على دينك و طاعتك بعد رمضان<br />و أعد عليهم هذا العيد بالبشر والسرور<br />و بلغهم رمضان القادم<br />واجمعنا في الجنة\""
archived = "2005-04-06"
capture_url = "https://web.archive.org/web/20050406083246/http://www.20at.com:80/article.php?sid=750&mode=&order=0"

[[comments]]
