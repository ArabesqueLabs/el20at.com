text = "اولا والحمد للة احنا معندناش مال علشان تحصل فية ازمة<br />احنا عايشين على شوية المساعدات وقناة السويس وشوية الغاز والبترول والعاملين فى الخارج<br />فمصر والحمد للة على نعمة ليس لها اثتثمارات فى الخارج لتضيع<br />ونحمد اللة على نعمة الفقر<br />ونحمدة على الستر<br />احيانا بيكون الفقر نعمة من اللة<br />وتخللى الفرعون يكش ويقعد متلهى فى حالة<br />وفى الحديث او الاثر ----- وان من اغنيتة لفسد حالة"
