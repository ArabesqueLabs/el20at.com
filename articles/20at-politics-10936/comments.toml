[[comments]]
order = 1
subject = "هو انت سعودي من القمر ولا سعودي من المريخ"
author = "ياسر فتحي محمد"
posted = "2009-01-13"
text = "عجيب اوي سعودي اللي من المريخ او من زحل .... تصدق ان المقاومة بستخبي ورا الاطفال .. تصدق ان الصواخ ورا الاطفال ومضادات الدرو ورا الاطفال وبرده الجندي شليط الاسير برده ور الاطفال وكمان الكمائن اللي وقعوا فيها اليهود برده ورا الاطفال ...<br />تصدق كمان ان الجيش المصري في حرب الاستنزاف كان بيستخبي ورا مدرسة بحر البقر<br />وتصدق برده ان المقاومة الجزائرية برده كانت بتسخبي ورا الطفال والنساء .. وتقريبا برده عم المختار ..<br />اللي انا مسغربه بقه هو لو همه بيستخبوا ورا الاطفال ميين اللي بيافع عنهم .. وحضرتك من المريخ عملت اييه للاطفال اللي حماس بتستخب وراهم"
archived = "2010-03-14"
