order = 0
subject = "حمساوية جبناء"
author = "سعودى للأبد"
posted = "2009-01-12"
text = "و الله الحمساوية الجبناء يحتمون بالأطفال فى تنقلاتهم و هروبهم من الشيطان الأكبر إسرائيل و رأيناهم بأم أعيننا فى أكثر من مقطع يصورهم يقومون بالإحتماء بالأطفال و المدنيين و سيارات الإسعاف و يطلقون من ورائهم صواريخهم .<br />هاذى موب رجولة يا حمساوية يا جبناء يا أخساء و أنا أدعو كل الشعب الفلسطينى الحر أن ينتفضوا ضد الحمساوية أولا"
