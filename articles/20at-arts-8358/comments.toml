[[comments]]
order = 4
subject = "سيكولوجيا الحرب و الفقد قراءة في رواية حجر الضحك"
author = "كوثر خليل"
posted = "2009-01-05"
text = "سيكولوجيا الحرب و الفقد: قراءة في رواية \\\"حجر الضحك\\\"<br />لهدى بركات<br />\\\"كل الأيام التي تشطف المدينة تذهب إلى البحر (..) كل ما خلفته الحرب، ما هدمته وحرقته وقطعته (..) وبان البحر ممتلئا ويطفح بأشياء المدينة بأشلائها الـ .. (..) ثم البحر يردّها إلينا بخارا و أمطارا ثم تعودو...ننظف بها و نسقي بها الزرع . نظر خليل بفزع الى خضاره الملتمعة بشحوم المدينة وألقى بها إلى كيس النفايات أطفأ موقد الغاز ووقف قبالة نافذته الوحيدة...<br />أين نذهب بكل ما رأينا و... سمعنا و.. عرفنا؟.. أين تذهب المدينة من بحرها؟\\\"<br />حجر الضحك ص 40/41<br />في مسرح الحرب اللبنانية تقدم الرواية للعام و تشرح و تقيم و لكنها تمر بالتفاصيل مرور الأنثى فتسلط الضوء على زواياها المظلمة و تصبغ باللون آثارها الرمادية ...الرواية مسرحة للتفاصيل، تفاصيل المعمار و تفاصيل الشخصية و هندسة الشعور إنها طريقة بلزاك الفريدة في رصد التمفصلات التي يدل فيها الخاص على العام و العام على الخاص.<br />من المعاناة إلى المعرفة يتشكل النص/الكاتب عبر شخصية تبدو لوهلة بلا ملامح و لا تحديد و تقارنها بأترابها فلا تقف لها على مزية. و لكنها ثمرة من ثمار الزمن الرهيب زمن الحرب و العولمة هذا الديكور ألعجائبي الذي يبدو فيه كل شيء بلون الظلال يفضي بتفاصيله إلى خلاص ما و لكن الرواية تبقى رواية الانتقام و هاجس التجربة الروائية لدى هدى بركات يتلون بسواد منزلة المرأة و منزلة الإنسان زمن الحرب و في كليهما لا قيمة للذات و لا أهمية.<br />تخلع الحرب السياسية ثوبها على الحرب الاجتماعية فتصير الحرب قضية تسوية ( féministe) بالأساس لا في اختياراتها واتجاهاتها الأصلية وإنما في تفاصيلها اليومية ( المرأة / الرجل.البنت /الأب.المرأة /المجتمع ) و تصير المدينة رمز المرأة و صورتها في الذهنية الاجتماعية اللبنانية بجمالها و نفورها من جهة و سلسلة الموانع التي تواجهها ( الشارع /الشرفة/ النفق/ الليل/ المساء/ الصباح ) \\\"القصف السعيد يرد إليك الوقت الأصلي و يعيد التماسك الأول إلى المدينة. الموت هو غراء المدنية الوحيد و هو الذي يستجمع شظاياها الصغيرة الكثيرة الموت هو ذكر المدنية الوحيد حين تستغرق في غواياتها و ألعابها يلوي ساعدها و يشدها في نتفة واحدة إليه فتركن و تهدأ و تنتظم أنفاسها\\\" ص 162<br />حجر الضحك رواية البطل الواحد لكنها رواية \\\"اللابطل\\\" رواية يكون بطلها حاملا لقضية أو مفهوم دون أن تكون له ألاستقلالية و القدرة على صناعة مصيره هو ظل الراوي ليس إلا. يحمل خليل (الشخصية الرئيسية) هموم المثقف و يمثل صورة للعجز و عدم مجاراة الواقع لكن قضيته الرئيسية هي قضية المرأة صاحبة الكتاب فهو يمثل صورة رجل مخصي يستهدفه حب الرجال يراهم من خلال شهوة المرأة و يستهوى الرجال فيبادرونه، يتجاوزه ركب أترابه فيصير وجوده إلى الميوعة و التلاشي يوما بعد يوم بسبب الحرب و بسبب تسارع الأحداث و تفاقمها \\\"وأتراب خليل هم في الحقيقة مجموعتان الأولى التي تناسبه شكلا و التي تتألف من شبان هم دون سنه بكثير قد خلعت باب الرجولة خلعا و دخلت إليها من بابها العريض أي من باب التاريخ و راحت تصنع يوميا مصير منطقة بائنة الأهمية بالنسبة لخارطة العالم و تدير حياة الناس العامة و الخاصة حتى مسائل المياه و الخبز والأحلام و الهجرات في حين أن المجموعة الثانية و هي التي تخالفه شكلا و تتألف من رجال هم في مثل سنه قد أمسكت بناحية الأمور الكبرى أي بأدوات العقل و الفهم والإدراك و التنظير ووضع الخطط لضبط ضابط الحياة العلوي .. في السياسة والقيادة و الصحافة وال ........\\\" ص17<br />تلون الحرب كل شيء بالجفاف بالخراب بالرعب بالبتر و لكن الذكريات تبقى نابضة بتفاصيل الحياة الحية قبل أن يغادر متساكنو البناية و الشارع و النفق يغادرون موتا أو نفيا أو بسبب اللا جدوى التي تلتهم كل شيء ... و خليل كمن يخفى كاميرا ينظر منها إلى كل شيء من حوله ناجي السليم جسديا الذي يختلف عنه في كل شيء و مع هذا فهو يحبه كثيرا و يصفه كما تصف المرأة حبيبها بتفاصيله الجسدية و بتفاصيل الغياب و الحضور ناجي ابن السيدة ايزابيل تلك التي تحمل شقتها كل اختيارات الأنوثة الذكية من ستائر و شراشف و نباتات وأثاث و حين تكشر الحرب عن أنيابها يُقتل ناجي من قبل بعض الفصائل و يظهر الجانب الآخر الذي كان يتجاهله خليل و هو أن ناجي لم يكن سوى عميل و تغادر السيدة ايزابيل البيت و لا يبقى من البيت إلا الألم وخيانة الغياب \\\"شربوا القهوة وخرجوا، تركوا الفناجين بثمالاتها.. كانت القهوة ما تزال دافئة حين خرجوا.. تعمّدوا ربّما ألاّ يغسلوها لكي.. لكي تبقى أياديهم ملتصقة بها.. لكي تبقى كعين زرقاء تردّ الشرّ عن سكان جدد (..) تركوها لكن تقول لهؤلاء القادمين أننا نتشابه كثيرا .. وإننا سنهرب إلى...و ستهربون إلى .. وإن الدوائر التي ستخطها حركة هروباتنا سوف تتطابق كما كانت نتطابق حركة طيران اليعاسيب في طقوس هياج العواطف والتزاوج\\\" ص 25.<br />يعيش خليل حالة العزلة التامة ولا نراه يتحرك إلاّ في ذهن الكاتبة فالرواية غرفته وغرفته ليس إلا عالم هدى بركات الكاتبة /المرأة والكاتبة/ الإنسان المفجوع بشبح الحرب فيصنع له حياة في تلك الغرفة من خلال المذياع ويرى أهل مدينته من خلال تلك الآلة الصغيرة \\\"ألِف خليل ناس إذاعة الأف إم لأنهم كانوا مثله يسهرون طيلة الليل (..) ومثله كانوا يتصلون ببعضهم بدون معرفة احدهم للآخر (..) هم أناس المدينة يعيشون تحت. خارجها.في ليلها الداخلي.ناس مثله لم يعرفوا الدخول فيها ولا في ممراتها العمومية ولا في شوارعها (..) شبكة من الناس التي تحكي بأسماء مستعارة مع مذيع له اسم مستعار ولو كان حقيقيا تحكي كلاما مستعارا لأنها تلعب حلم الاستعارة وتنفذه (..) حلم أن تفك الأزرار في الليل وأن تخلع عنك نفسك ومعانيك إلى الاستعارة التي تضرب الأصل \\\"ص 79/80.<br />إزاء حرب مأجورة وحياة مستعارة تفقد الأصول إحداثياتها وتنقلب المفاهيم وتعم الفوضى حتى الأشياءَ الحيوية فيتعرف خليل على يوسف احد أبناء عمه الأصغر الذي قدم مع عائلته من القرية واستغل شقة السيدة ايزبيل فيكون له الضد الذي يبحث فيه عن نفسه (كما كان ذلك مع ناجي) ولكن الوصف يتعدى وصف الرجل للرجل انه وصف المراة في أعمق طيات شعورها فكل حبيب هو يوسف \\\"ماذا أريد من يوسف؟ سأل خليل نفسه \\\"إنني أطوق يوسف كما طوقته زليخة (..) ادفعه لكل ما هو كريه وفاسد ومسموم وأروح ألطم واجمع نسائي اجمع نسائي والطم مشيرة إليه وهن لا يرينه ولا يتقطع سوى يدي وتبقي برتقالات شهوتي كاملة ومستديرة وحمراء مئات المرات آلاف المرات اجمع نسائي ليرين فلا يرين ولا يعرفن ولا اقطع سوى يدي كلما لا مست طرف ثوبه شققته من دبر شققته آلاف المرّات من دبر لكنه لم يرني ولم يستدر ولم ينشق له ثوب..شققت ثوبي وصرخت انظروا إلى الفاسق انظروا إلى ما يفعل بي يوسف (..) فما نظر أحد وما سمع \\\" ص 137-138 تشعرنا الحرب برعب الفراغ ولهذا تروح الكاتبة تملأ الرواية بالتفاصيل تكدس الأثاث حتى تتقيأه الجدران، تملأ الشارع بالمقاتلين والعزّل والسيارات المفخخة وأكوام الزبالة تملأ المستشفيات بالمرضى و الأطباء و الأمصال ودورات المياه بالحشرات والديدان. وإذا رحل احدهم أو قُتل تبقى ذكرياته حاضرة بقوة \\\"فوضى غرفة ناجي أشبه بالديكور المسرحي كل غرض كان يمثل إفصاح ناجي عن رسالته بالإصرار على عودة سريعة لذا اجتهد الممثل حتى خرج عن الدور لشدة ما صرخ عدم اقتناعه ووشى بيأسه العميق ولذا لم تكن لا بيجامته ولا القمصان المتراكمة على السرير ولا الجوارب المتروكة على المكتب الصغير ولا المشط على الكرسي ولا حتى باب الخزانة المفتوح بدلالات مقنعة على عودة صاحبها إلى مكان غادره عرضا\\\" ص 24/25 يتعرف خليل فيما بعد على \\\"الأخ\\\" فيطلعه على عالم المال والمضاربات والأسلحة ولكنه يواجهه بحقيقة الرغبات الجنسية المثلية ويضعه في صراع مع نفسه فلا يستطيع الجزم في الأمر وتتدخل الكاتبة لتختلق عملية اغتصاب قام بها للمرأة التي تسكن في شقة السيدة ايزابيل بعد أن غادرتها عائلة عمّة لتثبت دخوله في زمرة الرجال وكأنّه يكتشف أعضاءه للمرّة الأولى وتتحقق هي ككاتبة امرأة بعد أن استطاعت أن تخرج من جلد الرجل ..هل هي سلطة الحلم تفجر مجموعة السلطات الاجتماعية والسياسية والاقتصادية وتسقط حواجزنا؟ نتحدث عن الحرب والحرب في داخلنا، حرب التحقق على المستوى الاجتماعي والجنسي والإنساني ،نختلق خصوما لنا ونتسلق جبالا وهميّة ويبقى داخلنا حطاما وهباء، هذه الحرب اللبنانيّة كما يصفها النصّ المنشور بتاريخ سنة 1990 تقدم جغرافية جديدة للمدينة وللعلاقات علاقتنا بالآخر وعلاقتنا بالذات (الجمعية والفردية) لا يغدو فيها أهل الأرض سوى ظلال عابرة وان تشبثوا بما لهم فهم إلى القرصنة سائرون فإما قاتلون وإما مقتولون ولكن يبقى مع كل هذا جمالية التفاصيل تصوغ القبح القاتم والنقطة المضيئة من تاريخ الذات التي تتبدل وتتغير حتى وان كانت تقبع بين أربعة جدران فلكل شيء روح في هذه المدينة حتى الشبابيك المضيئة بقنابل الفصائل الصغيرة والتي نعيد ترميمها وكأننا نرمم تماثيل الأصل الذي لا يموت في داخلنا حتى الأنفاق الضيعة التي تستوعب ضجيجنا واختلافنا وخوفنا وأيام الجوع والموت نحن اليه في لحظات يغيب فيها القصف ويصير كل شيء في المدينة متشابها روتينيا كأيام الخريف تخرج الرواية عن وظيفة التأريخ للحرب فتؤرخ للتفاصيل مقارنة بعضها ببعض تاريخ الأتراب وتاريخ المدينة والشقق يمرّ الزمن على هذه العناصر فتتبدل في نفس الوقت متخذة اتجاهات مختلفة فمدينتنا المتوسطية الجميلة قد تضخمت على نحو مبالغ فيه في تلك السنوات الأخيرة وهي مدينة صغيرة لم تكن على الأرجح مهيأة لأن تكبر على هذا النحو وذلك الإيقاع فقد غزتها القرى الصغيرة المطرودة من أماكنها لأسباب شتى والقرى الواقعة في غواية المدن وهواها الأسر. وكان من جراء ذلك أن فرّخت تلك العمارات وبالتالي تلك البيوت أو بالأحرى الشقق وجاءت متشابهة حدّ الكوابيس. أنا غادرت لأنني لم أرض أبدا عما يحدث ولم أجد طرفا انخرط فيه ...إمّا تنتظر أن تعود وإما تيأس من العودة وفي هذه الحالة تكون إنسانا يائسا لا إنسانا مقيما حيث تكون... لم تكن بلادك فارغة حتى تخترعها في الخارج ولم تكن ممنوعا عنها حتى تحتج عليها بالنفي والحنين الكهرباء ممكن أن تعود بثانية في رأسك والزبالة أيضا ترفع بساعة وتجارتك تزدهر في اليوم التّالي.. يلزمك أسباب للإقتناع حتى تتخلى وحتى تسلك في الخارج حتى تجد صيغة للبقاء بعيدا ثم تعتقد أن حمولتك الثقافية سوف تسمح لك بالعيش .. تهرب من فساد هنا إلى هواء الديموقراطية العالمي تعمل ما تأنف أن تعمله هنا.. هنا تحتج وتزعل على الخطأ.. هناك تمارسه وتدخل في شبكته وكل ما يهمك هو أن تستمرّ بالعيش حتى لا تجبر على العودة إلى الخطأ فضيحة..\\\" ص 20/112/113.<br />أيام الحرب يصير الضحك جوهرة حجرا ثمينا انه جوهرة الوعي يصقلها الألم و يلمّعها الفهم. انه الحياة الحقيقية في وجه الموت القريب \\\"بلد يضحك.. بلد لا يكف عن الضحك لأنّ سلطة الحروب العليا تعكر صفو هنائه. شعب حي يعارض السلطة.. لا يعترض على المجارير المفتوحة التي تعزق البلد لا يعترض على القصف أو الموت أو التحقير أو انعدام الكهرباء أو الماء أو الطحين لأنه يريد مزيدا من التوريط لسلطة الحرب، يريد مزيدا من الاحتقار والاتهام فيسكت من اجل مزيد من الضحك بلد يضحك ويلعب معتقدا أن سلطته لا تضحك ولا تلعب وانه يخدعها. بلد غريب 148/149.. تعتمل الرواية بالعديد من القضايا الاجتماعية والسياسية المرتبطة بزمن الحرب والسلم ولكنها تبقى رواية الذات حرب الذات على الذات حرب الذات على الآخر (الرجل، الأجنبي، السلطة) والإبداع سلما نصعده في سبيل التحقق رغم ضرورة التعايش مع الآخر في كل أشكاله.<br />كوثر خليل"
