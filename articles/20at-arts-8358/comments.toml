subject = "المنفى بالنسبه لها لحظه لا مكان"
author = "نيفين نيفى نوفا"
posted = "2008-03-01"
text = "اولا تحياتى يا منى<br />الموضوع جميل و بيلمس مشاعر ما<br />اعتقد ان اصدق الكتابات هى كتابات شخص مغترب يحكى غربته<br />و مش عارفه ليه تبادر الى ذهنى و انا بقرا الموضوع كلمات نزار عن المنفى حين قال:<br />يا رب لكل جرح ساحل و انا جراحاتى بغير سواحل<br />كل المنافى لا تبدد وحشتى ما دام منفاى الكبير بداخلى<br />و طبعا مش محتاجه اقول انى اتمنى قراءه مثل هذا الكتاب"
