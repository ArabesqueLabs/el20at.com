[[comments]]
order = 2
subject = "غربة ذلتها بإدمان الهروب"
author = "وسام"
posted = "2008-03-03"
text = "جميل يا منى.<br />ليس من إبداه هدى رسم صورة المغترب، فهذه الصورة تستهلك الأدب منذ بدايات الرومانسية وتمردها على أطر الرضا المازوخي في الإنتاج الكلاسيكي. لكن جمالها في أنها لمست انعكاسات جدسدة في سلوكنا عندما نغترب. المغترب لا ينتج مؤسسة بل حالة فردية، ولا يحتفظ بإطارات للصور، بل مجرد ظرف يحوي أهم الذكريات وأنكدها في آن.<br />ما لفت انتباهي أكثر هو سبب تطرفها في الإحساس بهذا الاغتراب، ولعله ما قادني لاعتبرها مغتربة أدمنت الهروب. لم يعد لبنان فظا كما كان. الحرب الأهلية لا تصنع شرا، بل كل منتجها خير؛ وإن أريقت بعض الدماء هنا وهناك، ففي النهاية ينتج لنا وطن صحي؛ يعلم أن عواقب تكرار الأخطاء وخيمة بدلا من أن يسكن الأخطاء ويستعذبها.<br />أنا أرثي لها.. لا لدواعي غربتها بل لدواعي إدمانها الهرب.<br />عافاكم الله من تلكم الجراح."
archived = "2010-03-14"
capture_url = ""

[[comments]]
