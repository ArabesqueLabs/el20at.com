subject = "الى حبيبتي هدى بركات"
author = "بنت ال20"
posted = "2008-06-04"
text = "لا أعرف كم بالمائه هي نسبة وصول كلماتي هذه الى الكاتبه هدى بركات، قد تصل يوما.. .<br />لقد تسنى لي حتى الآن قراءة روايتي سيدي وحبيبي واهل الهوى، وقد بحثت طويلا جدا عن باقي الروايات الصادره للكاتبه ولم يتسنى لي ان اجدها حتى الان.(أنا أعيش في اسرائيل).<br />عزيزتي الكاتبه لساني وكل ما أعرفه من كلمات بالعربيه يعجز عن وصف التأثير الذي أحدثته في روايتك، لا تتخيلين كم شدتني من أعماقي الى ما بين سطورها والى ذلك العمق الخاص الخاص بكل معنى الكلمة، حتى أنني بكيت عندما اختفى البطل في النهايه. عزيزتي أهنئك من أعماقي على جرأتك وشفافيتك وإتقانك لكتابة روايات تحمل أبعادا حتى الما لا نهاية. يسرني أن أعبر لك بصدق عن شديد إعجابي برواياتك وبأسلوبك وبك انت كإمرأه مبدعه مثقفه وخلاقه بكل معنى الكلمة ."
archived = "2010-03-14"
