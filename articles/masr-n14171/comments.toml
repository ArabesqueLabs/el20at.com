[[comments]]
order = 0
subject = "البركة في جمال وعلاء وسيدنا .. وسيبنا"
author = "يا شعب يا .."
posted = "2008-02-12"
text = "وانتو تطلعوا مين بقى بسلامتكم علشان حسن شحاتة والبهوات اللاعيبة يعملوا لكم حساب .. البركة في البيه جمال والبيه علاء .. وسيدنا الكبير حسني ربنا يخليهم لينا يارب.. هما اللي راحوا وهما اللي شرفونا واتقابلوا مع الافندية اللاعيبة الغاليين .. واتصوروا معاهم .. واللاعيبة أهدوا الكأس لسيدنا وعيال سيدنا .. علشان اللاعيبة كسبوا بنفس وتشجيع ومكالمات سيدنا وعياله .. أما الشعب الجربوع . الشعب الفقران اللي ملطوع على رصفة المطار في عز البرد وريحته وحشة .. ولا معاه مليون يتبرع بيه لحسن شحاته واللاعيبة زي ناصر الخرافي ولا زي الوليد بن طلال ولا حتى زي عز استيل بتاع الحديد .. اللاعيبة هايقفوا ليهم ليه بالذمة .. أهم البهوات ركبوا الاتوبيس الفاميه ومرقوا بعد ماخدوا البركة من سيدنا وعياله .. والشعب من هطله فاكرهم ولاده وفاكرهم بتوعه هوة مش بتوع سيدنا وولاده .. شوف الهبل .. قال إيييه .منتخب الساجدين.. قال إيييه منتخب مصر.. مصر مبارك وجمال وعلاء.. حتى المذيع في ماتش ساحل العاج أهدى الفوز لمبارك وجمال وعلاء .. والنبي أجدع سلام على طول السلام للأخ أبوتريكة المؤمن الساحر الفنان أبو الأتوبيس الفامييية ..أجدع سلام للرجالة اللي عملوها علينا وعلى الشعب المرمي في عز البرد علشان يمني نفسه برؤيتهم وبطلتهم عليه..طول عمرك هفية .. طول عمر أمك في الأحزان مدعية وفي الأفراح منسية.."
archived = "2008-02-17"
capture_url = "https://web.archive.org/web/20080217152102/http://masr.20at.com:80/newArticle.php?sid=14171"

[[comments]]
order = 1
subject = "من باعك بيعه ..."
author = "إقلب الصفحة"
posted = "2008-02-12"
text = "طبعا لازم من هنا ورايح نحافظ عليهم00 همه دول شوية.. دول أبطال أفريكيا.. وفيها إيه لو الاتوبيس الفامية دهس له عشرة ولا عشرين أجرب من المرميين قدام المطار .. فداهم يابيه ..إحنا كلنا فداهم.. أهم جابوا الكاس.. وإدونا بالمداس..مش همه اللي أرتموا في أحضان الأسيباد .. ورفضوا يروحوا للشعب في الاستاد.. طب خد عندك بقى: طز فيك ياحسن ياشحاتة .طز فيك يابوتريكة ياسكاك .طز فيك ياحضري يامتغندر...وافتكروا إن تبرعات عز والخرافي وراشد المكتوم وابسامة ومصافحة جمال وعلاء وأبوهم تغنيهم عن حضن الشعب ..لا حبيب قلبي انت وهوه .. لا..أقل واحد من طلعوا يقابلوكم في المطار من أبناء هذا الشعب أنضف منكم جميعا ومن أسيادكم ..وطز في الكاس بتاعكم .إشربوه ... بس وحياة اللي فات . واللي أصبح ذكريات .. عمري ما حسيت إني بعت غيرك انت غيرك انت يا فريقي.. قال أبطال أفريكيا قال؟؟ .."
archived = "2008-02-17"
capture_url = "https://web.archive.org/web/20080217152102/http://masr.20at.com:80/newArticle.php?sid=14171"

