subject = "يمكن يكون اجراءات امنية"
author = "يمكن"
posted = "2008-02-12"
text = "وعلشان ابو تريكة كتب على الفانلة جملة تعلطف مع اهل غزة وبقى مطلوب للموساد<br />يمكن الامن خاف على الفريق ويمكن احد من الموساد يغتالة لا قدر اللة مثلا فلغوا الاحتفال<br />وبعدين الجماهير زعلانة لية - ما الكبير وعيالة وعيال عيالة قاموا بصفتهم الشعب المصرى بعمل اللازم"
archived = "2008-02-17"
capture_url = "https://web.archive.org/web/20080217152102/http://masr.20at.com:80/newArticle.php?sid=14171"

[[comments]]
order = 3
subject = "يا عريس الدولة"
author = "زب الارض"
posted = "2008-02-12"
text = "خدوا القصيده دى علشان الرئيس القادم لمصر<br />بعنوان عريس الدوله<br />مبروك يا عريسنا<br />يا أبو شنه ورنه<br />يا واخدنا وراثه<br />أطلب واتمنى<br />وأخرج من جنه<br />أدخل على جنه<br />مش فارقة معانا<br />ولا هارية بدنا<br />ولا تاعبه قلوبنا<br />ولا فاقعة بيضاننا<br />يا عريس الدولة<br />أفرح وأتهنى<br />ما أحناش كارهينك<br />لكن هارشينك<br />ح تكمل دينك<br />وتطلع دينا"
archived = "2008-02-17"
capture_url = "https://web.archive.org/web/20080217152102/http://masr.20at.com:80/newArticle.php?sid=14171"

