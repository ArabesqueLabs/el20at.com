[[comments]]
order = 0
subject = "فساد ضابط نصرانى"
author = "iu"
posted = "2008-06-29"
text = "وعايزين يخلوا النصارى تمسك مناصب فى البلد<br />الهارب اختار اسم نصرانى فقام الضابط النصرانى بتهريبة بعد ان قبض الشىء الفلانى<br />ومن التصارى الضباط جواسيس لاسرائيل وامريكا<br />ما قلنا انهم طابور خامس فى البلد"
archived = "2008-07-01"
capture_url = "https://web.archive.org/web/20080701002146/http://masr.20at.com:80/newArticle.php?sid=16519"

[[comments]]
order = 1
subject = "بلاش سذاجه"
author = "انصاري"
posted = "2008-06-30"
text = "مع كامل احترامي للشخص اللى معلق وقايل ان الظابط هربوا علشان نصراني<br />لو صدقنا التفسير ده هنبقى فعلا هبل وقمه في السذاجه<br />طيب على كده بقيت الناس اللى هربوا كمان عملوا كده<br />الفساد مالى البلد بس ملهوش علاقه بموضوع الديانه بدليل ان غالبية البلد مسلمين ومع كده مليانه فساد<br />وغاليبة الموظفين مسلمين والوزرا كلهم مسلمين تقريبا الا بتاع الماليه ومع كده معروف انه حكومه فاساده<br />ده النظام نفسه بيحكمه شخص مسلم وم كده نظام فاسد<br />مع اضافة ملاحظتين<br />ان التحقيقات لسه مخلصتش يعني ممكن الظابط يكون برئ<br />وكمان امين الشرطه بتاع الجوازات مسلم"
archived = "2008-07-01"
capture_url = "https://web.archive.org/web/20080701002146/http://masr.20at.com:80/newArticle.php?sid=16519"

[[comments]]
order = 2
subject = "ارهابى محمدى ام متخاف عقليا؟"
author = "اكتب اسمك هنا"
posted = "2008-07-05"
text = "الشىء المدعو iu فضح قلبه الاسود وطبعه الاسلامى الارهابى ، وطبعا عشان حقده طغى على عينيه فلم يستطع ان يقراء اسم امين الشرطة المتهم والذى يتوسط اسمه لقب ارهابى محمدى، وبعد عن موضوع الخبر وعندما اراد التعليق فلم تخرج من عقله الدنس الغبى غير احقاد على اسياده، اما عن الجواسيس لامريكا واسرائيل فواضح تن عقله ومستوى تفكيره لم يتعدى قصص ارسين لوبين واجاثا كريستى، واخيرا لا نستطيع ان ندعو له بالهداية بل ندعو الله ان يقلل من امثاله ويبيد كل من على شاكلته عشان البلد تنضف لان مازالت اهم مشكله فى مصر هى تكدس الزباله"
archived = "2008-07-06"
capture_url = "https://web.archive.org/web/20080706193606/http://masr.20at.com:80/newArticle.php?sid=16519"
