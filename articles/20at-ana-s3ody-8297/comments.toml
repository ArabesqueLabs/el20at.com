text = "السلام عليكم:<br />الله ايبارك بجميع القائمين على تحسين صورة المسلمين و الإسلام . و نشد على الأيادي<br />اولله يا جماعة رب ضارة نافعة هم توقعوا أن نثوووور و نصوووول و نطلع فقط مظاهرات و لا يريدون منا أن ننشر أي شي عن ديينا لأن أعداد المعتنقين للإسلام في ازدياد<br />و حسبنا الله و نعم الوكيل<br />اللهم صلي و سلم بارك و أنعم على سيدنا محمد<br />\"انهم يشتمون مذممَ و أنا محمد \""
