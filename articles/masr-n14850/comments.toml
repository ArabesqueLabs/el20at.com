[[comments]]
order = 0
subject = "ضلم واللة الناس دى اتحبست ومازلت لغاية دلوقتى"
author = "حرنكش"
text = "ياسيدة الريس مبارك ارجوك ان تنظر فى امر هؤلاء المظلومين وتطلق سراحهم لكى لايضاف اليك ذنوب لم ترتكبها شخصيا بل ارتكبت بااسمك من شلة منافقين وحرامية ضد مصلحة البلاد والعباد والغريب انة ثقتك بيهم بتزداد وهما همهم الوحيد مصالحهم الشخصية على حساب شعبك الغلابان غلب مايعلم بية الاربنا والسبب الثقات من المقربين انا بدعوك لوجة اللة تعالى انك تعدل بين الناس لان العدل اساس الحكم"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"

[[comments]]
order = 1
subject = "أكَّد عبد المنعم عبد المقصود منسق هيئة الدفاع عن المحالين أن قرار التأجيل يُثبت بكل الأدلة عدم استقلالية القضاء العسكري،"
author = "مش رايح"
text = "ما شاء الله<br />ما شاء الله<br />وعدي يا وعدي على التحليلات<br />عرفتها لوحدك دي يا عم عبدالمنعم مقصود ولا حد قالهالك"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"

[[comments]]
order = 2
subject = "وتمَّ إبلاغهم بالحكم عن طريق المحضر،"
author = "مش حيحصل"
text = "كويس والله المحضر<br />التأجيل الجاي ان شاء الله عن طريق فراش المحكمة"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"

[[comments]]
order = 3
subject = "معتبرًا قرارَ التأجيل للمرة الثانية تبعيةً صريحةً للسلطة التنفيذية"
author = "مش لاعب"
text = "يا صلاح عبدالمقصود انت محامي مصري ولا محامي جاي من كوكب تاني ولا محامي انجليزي ولا امريكي<br />انت محامي مصري يا حبيبي والمفروض الكلام دا انت واحنا فاهمينه ما تعمليناش فيها محلل"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"

[[comments]]
order = 4
subject = "ويُثبت كذب كلِّ الدعاوى التي كانت تشير إلى استقلاليته،"
author = "مش مهم"
text = "ويثبت ويثبت ويثبت<br />خلاص يا عم صلاح عبدالمقصود اثبت اللي انت عايزه خلاص<br />هما ناس بلطجية وصيع ومش لاقيين شغل وما يهمهمش الكلام دا وكل اثباتاتك دي مكانها صفيحة الزباله<br />اخبط دماغك في الحيط"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"

[[comments]]
order = 5
subject = "بصو في الصورة كويس"
author = "مش كاتب"
text = "بصو في الصوة كويس<br />ناس سياسيين كبار اوي<br />كلهم بيضحكو<br />عارفين طريقهم كويس عارفين انهم ماشيين صح<br />عارفين ان الصعود السياسي ما ينفعش من غير سجون ومعتقلات<br />بصو كويس في الصورة"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"

[[comments]]
order = 6
subject = "\"العسكرية\" و\"المحظورة\""
author = "مش لازم"
text = "المحظورة لا تعترف بالعسكرية<br />والعسكرية لا تعترف بالمحظورة"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"

[[comments]]
order = 7
subject = "دعاء"
author = "دعاء"
text = "دعاء<br />اللهم آمننا في أوطاننا وادم نعمة الأمن والاستقرار في بلادنا اللهم من أرادنا وبلاد المسلمين بسوء فشغله بنفسه واجعل كيده في نحره يا حي يا قيوم برحمتك نستغيث اللهم فك أسرانا واسري المسلمين وارحم موتانا واقبل شهدائنا اللهم اعصم أسرانا من الفتن والدنايا اللهم احقن دمائهم وثبت قلوبهم على طاعتك اللهم إنهم جياع فأطعمهم وعراة فاكسهم ومساكين فارحمهم اللهم من أرادهم بسوء فاقلب سوءه على نفسه يا ارحم الراحمين يا غياث المستغيثين يا ذل جلال والإكرام اللهم عليك بمن إذانا وأذاهم اللهم عليك إنا نجعلك في نحورهم ونعوذ بك من شرورهم يا قوي يا عزيز<br />اللهم أمين اللهم أمين"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"

[[comments]]
order = 8
subject = "الظلم ظلمات يوم القيامه"
author = "مش ضروري"
text = "وعن أبي موسى الأشعري رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إن الله ليملي للظالم، حتى إذا أخذه لم يفلته، ثم قرأ: {وكذلك أخذ ربك إذا أخذ القرى وهي ظالمة إن أخذه أليم شديد} »<br />(رواه البخاري ومسلم)<br />قال الشاعر العربي المسلم<br />لا تظلمن اذا ما كنت مقتدرا .. فالظلم آخره يفضي الى الندم<br />تنام عيناك والمظلوم منتبه .. يدعو عليك وعين الله لم تنم<br />وقال الشاعر أبو العتاهية<br />الا والله ان الظلم شؤم .. ومازال المسئ هو الظلوم<br />الى ديان يوم الدين نمضي.. وعند الله تجتمع الخصوم"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174842/http://masr.20at.com:80/newArticle.php?sid=14850"
