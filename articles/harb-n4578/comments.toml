[[comments]]
order = 7
subject = "ليا سؤالين"
author = "كتكوتة"
posted = "2007-05-28"
text = "انا باستعمل الفاير فوكس من اول مانزل وبجد اللي يجربه مايفكرش انه يدور على انترزفت اكسبلورر ده خاااالص وكل المميزات دي موجودة في فاير فوكس 2 والاحسن منه انه اسرع بكتير وفي مزاياكتير جدا اكبر من اننا نحصرهامثلا اذا ضغطت زر (الكونترول ) في لوحة المفاتيح وحركت زر الماوس الاوسط ( العجلة ) يكبر لك حجم الكلام اللي في اتلصفحة اللي مرات لامتناهية والعكس ودي حاجة اكتشفتها صدفه<br />بس انا ليا سؤالين عند الاخوة اللي ليهم خبرة هو اصله ايه يعني منين اصله مين صاحبة السؤال التاني اني لما بافتح بعض الصفحات بيكون جزء منها مختفي على جمب ومش قادرة اعرف العيب فين ياريت حد يجاوبني"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193457/http://www.harb.20at.com:80/newArticle.php?sid=4578"

