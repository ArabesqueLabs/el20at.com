[[comments]]
order = 9
subject = "تعليق"
author = "kebboud"
posted = "2008-01-02"
text = "يا أخوة قبل الحديث عن فاير فوكس أو الأنترنت أكسبلورر إنتبهوا إلى هذا المستوى الضعيف للعربية التي تتكلمون بها<br />يا اخوة كفاكم ابتعادا عن لغتكم العربية الجميلة التي تتسع لكل العلوم والمعارف والتقنيات ، يا اخوة حان الأوان للتصالح مع لغتكم العربية المقدسة والرجوع إليها .... أما الفاير فوكس أو الأنترنت أكسبلورر فهذه برامج صنعها الغرب أما نحن العرب المساكين الجهلة فنتنافس بيننا في وصف و ومدح هذا البرنامج أو ذاك ...لماذا لا يكون عندنا نحن العرب برنامج متصفح عربي مئة في المئة هل هم أذكى منا ؟ هل الله سبحانه وتعالى خلق لهم عقلا ليس لدينا ؟ يجب الرجع إلى لغتنا العربية الجميلة أقوى و أقدم لغة في العالم و الرجوع إلى العلم والبحث و الإستفادة من الآخرين كما استفادوا هم منا من قبل<br />و في الأخير أرجو المراسلة على kebboud@maktoob.com"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193457/http://www.harb.20at.com:80/newArticle.php?sid=4578"

