text = "زى الشباب ما قالوا الفاير فوكس احسن بكتير<br />وبعدين انا اعرف واحد جرب الاكسبلورر ده وضرب له نسخه الويندوز<br />يعنى برنامج فااااااااااااااااااااااااااشل<br />ودمتم بود :-)"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193457/http://www.harb.20at.com:80/newArticle.php?sid=4578"

