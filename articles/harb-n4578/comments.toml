subject = "ضع عنوان التعليق"
author = "واحد معدي صدفة"
posted = "2007-01-20"
text = "انترنيت أكسبلورر ايه .. اطلع ليكم أكثر من 30 ثغرة أمنية في المتصفح الجديد ، كمان ده مسروق عيني عينك من فايرفوكس ، يعني مش كفاية انه محتكر كمان .. حرامي ههههه ، و زي مقال الأخوة اللي علقوا قبلي مالوش لازمة"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193457/http://www.harb.20at.com:80/newArticle.php?sid=4578"

[[comments]]
order = 2
subject = "لسه بدري عليع قوي علي ما يحصل فاير فوكس"
author = "م/كريم منير"
posted = "2007-01-28"
text = "بالفعل فاير فوكس اكتر من رائع<br />انا جربت اكسبلورر 7 قلت يمكن بقي فيه الخير<br />مالقتش اي ميزة زادت عن فاير فوكس لكن العكس فاير فوكس اقوي واسرع وفي تابس وفيع ريستور للصفحات اللي اتقفلت بشكل غير شرعي وخاصة مع واحد زيي بيفتح اكتر من 15 صفحة مع بعض وفيه انتي بوب وبيقلص حجم الصور عشان يفتح اسرع واقوي مع اللغة العربية وأأمم ميت مرة<br />بعد كل الميزات دي اروح لاكسبلورر<br />مستحييييييييييييييييل"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193457/http://www.harb.20at.com:80/newArticle.php?sid=4578"

