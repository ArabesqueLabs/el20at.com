[[comments]]
order = 0
subject = "لا حول ولا قوة إلا بالله"
author = "عمرو الشرنوبي"
posted = "2007-01-18"
text = "إيه يا جدعان؟ هوا أنتم مايكروزفت دافعالك رشاوي؟ وللا بيل جيتس كان قريب حد فيكم؟<br />يا جماعة بجد حرام عليكم ... أنتم عارفين كويس جدا أن الفايرفوكس أفضل ...<br />وعارفين برضه أن سياسات مايكروزفت القذرة لا هي في صالحنا كشعوب ... ولا حتى في صالح التقدم التقني بوجه عام<br />يعني موضوع ويندوز فيستا ... وقلنا الراجل اتعمل له غسيل مخ في المؤتمر اللي راحه<br />لكن إنترنت زفتلبورر كمان؟؟؟؟ دا كتير قوي بصراحة"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193457/http://www.harb.20at.com:80/newArticle.php?sid=4578"

