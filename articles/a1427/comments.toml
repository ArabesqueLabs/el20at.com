text = "الحمدالله الذي لا يحمد على مكروه سواه والصلاة والسلام على خير الخلق أما بعد يا أخي الكريم ومع إبداءناا لكامل مرارتنا وحزننا لحال البؤس والذل والهوان والرذيله والإنحطاط الذي وصلت اليه النساء والفتيات المسلمات في المغرب وغيرها من بلاد المسلمين فوالله رغم الوزر الكبير الذي يتحمله الحكام الطواغيت العرب في حدوث تلك الفظائع المهينه من تشجيعهم لها بإسم تشجيع السياحه وجذب الاموال والعملات الصعبه للبللاد حتى تنتفخ جيوبهم من عرق وكرامات مسحوقه من الشعب البائس فإنني لا أعفي كافة مؤسسات المجتمع المدني المغربي عن مسؤوليتها من سكوتها عن تلك الكوارث الأخلاقيه أين دورها في توعية الاسر والفتيات خاصة بضرورة عدم إرتكاب هذه المعاصي وجلب غضب الله عليهم وخسارة أنفسهم وكراماتهم للابد من أجل أموال ملوثه حقيره لا تجلب لهم سوى العار دنيا وآخره0 قالت العرب قديما تجوع الحره ولا تأكل بثدييهافلا تكونوا عبيدا للحاجه المصطنعه واحتسبوا وارضوا بما قسمه الله لكم من رزق لكم قال تعالى وما من دابة الا على الله رزقها 0 وفي الاخير لا نقول الا حسبنا الله ونعم الوكيل ولا حول ولا قوة الا بالله العلي العظيم 0"
