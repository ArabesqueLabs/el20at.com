[[comments]]
order = 1
subject = "اية اللى هجمات وحارس"
author = "تاجر قطع خيار ولمون مخلل"
posted = "2009-02-02"
text = "محدش قال لحسنى مبارك ولع حرب فى المنطقة ولاحد قالة افتح معبر رفح للجيوش والمتطوعين ومحدش طلب من ملك السعودية انة يفتح باب الجهاد للقدس للناس اللى عاوزة تروح النقمة الشعبية على القادة الرئيسين والمؤثريت عربيا ودوليا يعنى كنا عاوزين موقف حازم يردع اسرائيل ويخليها توقف عدوانها فمثلا دعوة لموتمر قمة عاجل وتحريك الجهودالديبلوماسية والاعلامية فى كل مكان لتاليب الراى العام العالمى ضد اسرائيل وفضحها وفى نفس الوقت ارتجال رحلات مكوكية لتقريب وجهات النظر العربية علشان يعرفوا اليهود والعالم كلة انة احنا مهتمين للموضوع بغض النظر عن التصرفات الطفولية من بعض القادة العرب والدور دة محدش يقدر يلعبة غير مصر يعنى تقولى محدش شتم الجزائر او البحرين اوالسودان او اليمن لان البلدان دى مع بقية الدول العربية لاتملك تاثير مصر والسعودية على القضية الفلسطينية"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "خرابة"
author = "اكتب اسمك هنا"
posted = "2009-02-02"
text = "ما فيش لا هجمات ولا بطيخ<br />هو صحيح نجح فى تشتيت الهجمات على اسرائيل<br />تسبب هو والفاشل السعودى فى تأجيل القمة العربية لغاية ما اسرائيل خلصت اغراضها فى الحرب وانتهت من الضرب تماما<br />وحتى لما عقدت القمة فى الكويت بعد الحرب حرجت باحة كبيرة قوى ( قحة )<br />وبعدين دة صحفى منافق ارزقى<br />ثم ان مين اللى بيشترى الوفد اصلا"
archived = "2010-03-14"
