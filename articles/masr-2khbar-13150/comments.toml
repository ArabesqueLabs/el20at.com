text = "وبدل السخاميط دى مش ليالى رمضان اولى بقراءة القران<br />بدل مشاهدة الرقص والتنطيط والكلام البايخ مش ليالى رمضان اولى بسماع التلاوة والذكر الحكيم<br />بتجذبوا الشباب الى اماكن اللهو لية"
