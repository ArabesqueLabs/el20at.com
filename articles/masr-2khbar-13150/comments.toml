posted = "2009-09-03"
text = "وانت مالك يا عم الخنيق ما يعرضوا الى يعرضوه<br />والحياة متنفعش تمشي علي نهج واحد<br />انت و الى زيك الى كرهتوا الناس في الدين بافعالكم المتشددة دي<br />ماتسيبوا كل واحد براحته مادام كدة كدة هيرجع لربه<br />ناس معندهاش دم"
