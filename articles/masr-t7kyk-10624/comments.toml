subject = "أعلن المعتصمون أنهم سيجددون اعتصامهم لحين معرفة حق"
author = "مش مدون"
posted = "2008-11-29"
text = "أعلن المعتصمون أنهم سيجددون اعتصامهم لحين معرفة حقيقة اختفاء المدون، ورددوا بعض الهتافات: \\\"ودة بيصلي الوقت بوقته.. يلا بسرعة هات لي بطاقته\\\"، و\\\"ودة بينادي بالحرية علِّي الفولت خلية مية\\\"، \\\"وإنت يا عامل مصر يا مجدع.. افهم دورك في القضية.. مهما تتعب مهما تشقى.. تعبك رايح للحرامية\\\"، \\\"الله قادر الله قادر.. مش هنسيبك يا عادل\\\"."
