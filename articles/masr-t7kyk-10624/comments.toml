subject = "طالما مفيش حرية رأى - وفية حكم ديكتاتورى - يبقى ال"
author = "مش فاهم"
posted = "2008-11-27"
text = "احنا مش فى الهند ولا فى لبنان ولا فى موريتانيا ولا بنجالاديش - الناس اللى بيحترموا الكلمة وبيحترموا الرأى وبلاش نجيب سيرة اوروبا وخلينا فى الناس اللى كانو ا زينا<br />يبقى يا مدون ويا اصحاب المدونات استخدموا اسماء وهمية<br />انا سمعت انهم قبضوا على هذا المدون لانة كتب فى صدر مدونتة - انا با اكرة اسرائيل"
