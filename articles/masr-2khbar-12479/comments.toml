text = "لسه نقض ولسه تصديق رئيس الجمهورية<br />طالما فيه رئيس الجمهورية لا يمكن اصدق الا اذا شفت الجثة بعيني<br />ممكن يكون كل دا تمثيل وارضاء لدولة الامارات<br />وبعد كل الاحكام يختفي طلعت مصطفى<br />لا لا لا يمكن اصدق الا اذا حضرت الاعدام بنفسي وشفت الجثة بعيني"
