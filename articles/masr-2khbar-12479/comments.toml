text = "أعتقد إن إعدام هشام مصطفى لن يكون بسبب ثبوت التهمة عليه وإنما بسبب مرافعات فريد الطاووس أقصد الديب الذى يترافع بعيداً عن الموضوع ويريد أن يجعل من القضية أدة إعلانية يستعرض فيها مرافعاته التى لن تفيد المتهمين فهو فى كل مقابلاته التليفزيونية يقول أنا أنا أنا وعندما يسأله أحد هل تتستطيع أن تتوقع أن تقتنع المحكمة ببراءة المتمين فإنه يهرب من السؤال ويعود فيقول أنا 000أنا 0000أنا إرحموا هذين المتهمين منهذا الطاووس الذى سوف يجعل المحكمة تؤيد الحكم بسبب حديثه عن نفسهأكثر مما يتحدث عن القضية"
