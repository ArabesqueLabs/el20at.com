text = "من الافضل لكم ان تقولو انظر المصري اليوم او الشروق ص 2<br />لقد ضيعت المواقع الالكترونيه اخلاق المهنه ,<br />كل ذلك اقوله لاني اري في الموقع موضوعات متميزه<br />وان ما تقومون به من اقتباس من الغير هو تقليل من شأنكم ان كنتم تعقلون"
