subject = ""
author = "يا حلاوتك"
posted = "2009-06-27"
text = "يا حلاوتك فى البدلة الميرى<br />لما تحب وتعشق غيرى<br />دة انت مطلوب حيا او ميتا<br />فية ناس كتير تتمنى موتك النهاردة قبل بكرة لانك تعرف حاجات كتير قوى عنهم وهذا مكمن الخطر عليك<br />نراك فى محكمة الاستئناف<br />وبعد محكمة الاستئناف تصديق السيد رئيس الجمهورية على الحكم<br />ثم انتظار الاخ عشماوى<br />يعنى قدامك سنتين تلاتة على تنفيذ الحكم يكون فية ناس ماتت وناس عاشت وما يقدرة اللة سيكون<br />وهذة اخرة المشى وراء الشهوات واللذات<br />فيها اية لو نمشى فى الحلال<br />مراتك مش مكفياك اتجوز واحدة تانية وبرضة فحولتك زايدة قوى اتجوز تالتة ورابعة - انما قتل ومشى بطال فهذة هى النتيجة<br />مبروك البدلة الحمراء"
archived = "2010-03-14"
