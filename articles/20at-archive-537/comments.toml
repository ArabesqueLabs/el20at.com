subject = "لماذا ننسى اننا في ذيل العالم"
author = "احمد نجم"
posted = "2007-04-16"
text = "لماذا لا يرى المنتقدون للمسلمين الحقيقه وهي ان الغالبية العظمى من سكان مصر مسلمين ابا عن جدا منذ ما يقرب من 1400 عام بكامل ارادتهم نل وساعد سكان مصر الأصليين المسلمين على فتح البلاد لما رؤوه من ايام سوداء في ظل الحكم الرومان(الاقباط) اننا مازلنا نسعى وراء العالم حتى يعطينا اي شيء نقتات عليه لاننا لا نملك الوقت لكي نصنع لابناء هذا الوطن الذين عندما يصلون لمرحلة الجوع القاتل سيلعنون من كان السبب في الفتن التي تشهدها مصر بسبب الاقليه التي تريد ان تتمتع برؤية الغالبيه تتعذب لمجرد انهم مسلمون -المسلمون ياساده امه وسطيه آمنت بكل الانبياء والدينات"
archived = "2010-03-14"
