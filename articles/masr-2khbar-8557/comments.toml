[[comments]]
order = 0
subject = "ملحق لقانون المرور"
author = "ماهر بك غازي"
posted = "2008-03-23"
text = "ليت القانون يسمح أيضا باحتجاز المركبة التي تتسبب في حدوث تلفيات لمركبة أخرى لحين قيام المتسبب في التلفيات بإصلاح المركبة الأخري التي تسبب في إتلافهاو على نفقته وفورا وأن يتم ذلك بمعرفة رجال الشرطة طالما أثبتت المعاينة خطأ طرف وتسببه في التلفيات . وليس كما يحدث الآن من تبجح من السائقين المهنيين الذين يعتبرون أنهم مالكوا الشوارع وأن الآخرين دخلاء عليهم . ويجب أن تضاعف العقوبة على السائق المهني الذي يفترض فيه أن القيادة هي مهنته الأساسية. ولكن للأسف الشديد فإنهم جميعا لا يعرفون كيفية السير على الطرق و لا ماهو معنى الخطوط البيضاء بأشكالها المختلفة على رصف الطريق بالإضافة للاستهتار الكامل بالوقوف على مداخل الكباري العلوية مما أصبح مع الوقت قاعدة نافذة وعدم استخدام الإشارات الضوئية عند الانحراف بل الانحراف المفاجئ اعتامدا على حجم المركبة وهم على ثقة تامة بأنك لن تنال معهم أو منهم حقا ولا باطلا. مع الاعتذار ل 0.5 % من السائقين الذين قد يراعوا الله في قيادتهم."
archived = "2010-03-14"
