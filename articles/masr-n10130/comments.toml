[[comments]]
order = 0
subject = "مصر هبة الجيش"
author = "مش لازم"
posted = "2007-05-09"
text = "انا قرأت عبارة مصر هبة النيل قلت لازم اصحح<br />والصحيح هو مصر هبة الجيش<br />لولا الجيش ما كانت مصر<br />احنا عايشين في خير الجيش"
archived = "2007-05-12"
capture_url = "https://web.archive.org/web/20070512000550/http://masr.20at.com:80/newArticle.php?sid=10130"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-05-09"
text = "عجبتني اوي حكايه مصر هبه الجيش دي بس اللي عجبني اكثر حكايه ابلغ عن هذا التعليق<br />هههههههه هبلغ عن التعليق ليه هو الموقع مش متراقب ولا ايه<br />انا كنت هكتب تعليق بس رجعت في كلامي احسن حد يبلغ عني بعدين يشيلو العده"
archived = "2007-05-12"
capture_url = "https://web.archive.org/web/20070512000550/http://masr.20at.com:80/newArticle.php?sid=10130"

[[comments]]
order = 2
subject = "المشكلة مش فى الشعب"
author = "واحد من الناس"
posted = "2007-05-11"
text = "تحية طيبة الى مى كامل مقاله جميلة لكن انا مختلف مع حضرتك و مع ناس كتير اوى فى موضوع ان شعبنا شعب سلبى العيب مش فى الشعب العيب فى القيادة يعنى اى شعب فى العالم بيطلع منهم مجموعة (حزب جمعية اى حاجه) بافكار جديده مختلفة بيطرحوها على الشعب بيتفاعل الشعب و يلتف حولين الناس و الافكار دى و تتولد المعارضة و يبدأو يطوروا مع بعض لكن ايه اللى مطلوب من الشعب انه يطلع يقول لأه لوحده طيب ازاى طيب حصل فى انهى شعب فى العالم انه يطلع كده من غير قيادة او طلع كده يصلح لوحده من غير جبهة او منظمة او حركة او جمعية ..<br />شعبنا مش سلبى و انتخابات مجلس الشعب ووقفة الناس مع الاخوان و المعارضه خير دليل على كده (العدد اللى راح الانتخابات كان اكبر من الانتخابات اللى قبلها بكتيييييير..فى ناس ماتت فى الانتخابات دى و ما كنوش من اى جبهة كانوا ناس عادية خرجوا عشان يأيدوا مرشحين من المعارضة)الاعتصامات فى المصانع من العمال ...<br />المشكلة فى المعارضه اللى عايشه فى حته و المجتمع فى حته تانيه و بدل من ان المعارضه تقرب للشارع عايزاه هو اللى يقربلها ..يعنى مثلا على مر العصور كان الشعب بيطلع عشان يقول لأه زى ما طلع ضد الفرنسيين و كان القيادة الازهر و لما طلع ضد الحاكم العثمانى عشان محمد على .<br />فى ناس فى شعبنا نفسهم بلدهم تبقى اجمل بلد بس مش لاقيين الايدين اللى تتشبك فى بعضها عشان كده مستعدين انهم يموتوا بس يكونوا عارفين ان بموتهم ده فى فايده للبلد البلد دى شعبها عظيم بس المشكلة ان بره فى الدول المتقدمة فى معارضات بتعلمهم بتفهمهم و ده طبيعى لكن هنا المعارضه عندها اورام...................."
archived = "2007-05-12"
capture_url = "https://web.archive.org/web/20070512000550/http://masr.20at.com:80/newArticle.php?sid=10130"

[[comments]]
order = 3
subject = "أضم صوتى الى صوت واحد من الناس"
author = "نبضة قلب"
posted = "2007-05-15"
text = "يامى أنتى عسل<br />وواخده بالك انك كتبتى المقال بنفس منطق ((حاكم احنا مبنفتريش ولا بنيجي غير ع الضعيف اللى زينا<br />إنما الأقوى مننا نكش ونتلم قدامه ))<br />نفس المنطق اللى خلاكى تقولى العبر فى الشعب<br />وماتقوليش مين السبب اللى وصل الشعب الى هذه الحاله من اليأس والاستسلام<br />هو هو نفس المنطق اللى خلاكى لم تحددى فى النكته حكومه انهى بلد؟<br />بس احنا اجدع شعب يحل الكلمات المتقاطعه<br />حقيقه المقاله حلوه تسلم الايادى"
archived = "2007-06-13"
capture_url = "https://web.archive.org/web/20070613180206/http://masr.20at.com:80/newArticle.php?sid=10130"

[[comments]]
order = 4
subject = "ميه  ميه   والله"
author = "انا  محمد"
posted = "2007-05-15"
text = "يعنى كل اللى الراجل عايزه يا مى انهم يكتروا اللى بياخدوا الضرايب<br />طب والله فيه الخير<br />ما شاء الله عليكى<br />فعلا شعب غريب وضرايب غريبه وحكومه غريبه<br />وربنا يستر بقى"
archived = "2007-06-13"
capture_url = "https://web.archive.org/web/20070613180206/http://masr.20at.com:80/newArticle.php?sid=10130"
