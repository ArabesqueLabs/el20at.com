[[comments]]
order = 8
subject = "الامن بيصرف مصاريف باهظة والنتيجة حالة الشعب زي ما هي موصوفة في المقال"
author = "مش مهم"
text = "كاتبة المقال وصفت الحالة البائسة اللي وصل اليها الشعب المصري<br />وكل دا بسبب ان اغلب ميزانية الدولة بتتصرف على الامن<br />اي والله شوفوا بس ميزانية الامن المركزي لوحده فقط بتتكلف كام مليون في اليوم<br />والحالة اللي احنا فيها دي منذ ايام الساعات وكامب ديفيد يعني اكثر من 30 سنه<br />30 سنه الامن بيصرف مصاريف باهظة لازم تكون النتيجة زي ما الكاتبة كاتبه في المقال"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

[[comments]]
order = 9
subject = "هو الناس بتعلق على تعليقى وسابت الموضوع .. للدرجه ديه انا مهم"
author = "شريف الدواخلى"
text = "\" فهمك كويس \"<br />ايوه كده يا عم شريف خلي عندك شخصية وما تخفش<br />ما قلتليش باه مؤهلك ايه ضروري اعرف<br />والاستاذه مي والبراء اشرف وكلهم عايزين يعرفوا مؤهلك ايه تجارة ولا حقوق ...<br />sheref el dawa7'y<br />sheref el dawa7'y deblome sanaye3 kesm ne2asha we beshta3'al ba3d el dohr ra2asa<br />لا حول ولا قوه الا بالله العلى العظيم<br />مين الاخ فاهمك كويس اللى ساب الموضوع كله و مسك فى تعليق كتبته سطرين \" انتا قارش ملحتى ليه كده ياعم \" و يعنى ايه اخلى عندى شخصيه ومش اخاف .... وايه ياعم شريف الدواخلى ... ايه الاسلوب ده انتا تعرفنى عشان تقولى عم .. فى حاجه اسمها استاذ شريف لو متعرفش الشخص اللى بتكلمه !<br />وبعدين انتا مين عشان تعرف مؤهلى .... جايبلى عروسه مثلا ... ريح نفسك انا الحمد لله مرتبط الحمد لله ... و غريب قوى قوى ان واحد بيعلق يسال عن مؤهل واحد علق قبله ... سبحان الله ..... و ضرورى تعرف بتاع ايه ان شاء الله !<br />وبعدين \" والاستاذه مي والبراء اشرف وكلهم عايزين يعرفوا مؤهلك ايه تجارة ولا حقوق ... \" ايش عرفك هما قالولك كده .... بالمناسبه التلاته زملائى فى 20 وعارفين مؤهلى كويس \" و مين بقى كلهم .... يعنى واللى عاوز يعرف حاجه من الموقع معاه تليفوناتى ...ممكن يسألنى يعنى !<br />وعلى فكره انا مش هاريحلك واقولك انا خريج ايه ولا دفعه كام ....<br />كفايه ان الاماكن اللى شغال فيها عارفين كويس قوى سواء الدستور او الجمهوريه او عشرينات او حتى بص وطل ... وكفايه تعرف دول .. وعلى فكره ايه المشكله فى خريجين التجاره او الحقوق ...<br />مش احسن من فاشلين كليه الخدمه الاجتماعيه اللى كانوا بياخدوا السنه فى 3 سنين ... معلش جيت على الجرح ... خلينى ساكت احسن !<br />اما التانى اللى بيقول انى دبلوم صنايع .... ولنفرض ,... انك مش اخ فهمك كويس \" وعامل واحد تانى بيعرف يكتب فرانكوا اراب \" باعتبار اننا عبط<br />يعنى .. للدرجه ديه انا حارق دمك .... قل موتوا بغيظكم !!<br />شفت بقى ان انا اللى فاهمك كويس"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

