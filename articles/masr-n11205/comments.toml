[[comments]]
order = 11
subject = "جنيه في اليوم يا راجل يا مفتري"
author = "مش لازم"
text = "طيب يا اخي لما هو الجنيه بسيط كده<br />خلي الحكومة تبطل امن مركزي وتتبرع بجنيه واحد كل يوم لكل واحد مش لاقي ياكل<br />دا زمان ايام الملك فاروق اللي الثورة قالت عليه انك ملك فاسد<br />كان فيه حاجه اسمها التكيات<br />مكان اللي مش لاقي ياكل يخش ياكل فيه<br />وكان اللي بيخش ياكل فيه لازم يغطي وشه لحسن عيب انه ما يبقاش معاه فلوس<br />دلوقتي الشعب لازم يتبرع للحكومة الغلبانه المسكينه بجنيه في اليوم علشان خاطر تبني متحف<br />الحكومة نفسها متحدف<br />تتصور لما رئيس الوزراء ينزل الفايده الي الناس عايشه علينا من 10% الى 7%<br />وهو ما يعرفش انه خرب بيوت ناس كتيره جدا لان فيه ناس كانت حطه فلوسها في البنك وعايشه من الارباح<br />وعايزنا نتبرع بجنيه في اليوم بس<br />يا اخي روح اتنيل جتك نيله او روح اتجوز بدل الشذوذ بتاع امك اللي انت عايش فيه دا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

[[comments]]
order = 12
subject = "ايه الحلاوة دى"
author = "جمال محمود معتوق"
text = "ايه ألحلاوة دى نتبرع أيه ألجمال ده نتبرع أيه ألوطنية دى نتبرع لاالاه الا ألله ألبلد هاتشحت يارجالة صحاب ألبلد يسخرو من عبيد ألبلد يسلام سلم ألفاروق حسنى لايعلم أن عبيد ألبلد مفلسين مفيش فى جيوبهم جنيه عبيد ألبلد أغنياء وهم ألفقراء تبرعو أنتم أيها ألسفاحين سويسرا تشكركم الفقراء يتبرعون مش لما يلاقو يأكلو أولا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

[[comments]]
order = 13
subject = "عظمة علي عظمة"
author = "احمد سابق"
text = "عظمة علي عظمة يا مي !<br />بجد مقال جامد اوي و في بشرة امل ان في لسة ناس موهوبة زيك و قادرة علي تصوير واقعنا المؤلم و التعبير عن الام<br />و هموم الناس الغلابة و ولاد البلد . بجد استمري انت كاتبة عظيمة و ناقدة ساخرة جداااا جداااا ."
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

[[comments]]
order = 14
subject = "وزير الشواذ فى حكومة شاذة"
author = "مش مهم"
text = "مين يتبرع يا فاروق ابو خاذوق الغلابة يتبرعوا علشان بتوع الساحل الشمالى ييجوا يتفرجوا على المتحف واحنا نعدى علية نخاف نييجى جنب الباب<br />يا فاروق ياللى بقى لك فى الوزارة عشرين سنة لية علشان الالية بتعجب بعضهم<br />خليك فى الخوازيق وزعازيع القصب انت والولد اياة لما ربك يجيب الفرج"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

[[comments]]
order = 15
subject = "راحة الشباب ولا راحة الجماد"
author = "مواطن بيحلم"
text = "طيب نتبرع بالمبلغ ده لتزويج الشباب لمساعدة الناس البشر اللحم والدم اما للجماد فمليون لا والبشر مش لاقى ياكل ربنا يهدى الجميع حاجه تجن فيها ايه لو ريحونا نحن الشعب بدل ما بيجملو فى الجماد جملونا نحن الذين اصبحنا بقايا بشر الواحد بيشوف الدنيا بره عايشه ازاى بيحزن انه موجود فى مصر اسم وبس ام الدنيا خلوها بنت الدنيا بس نعيش"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

[[comments]]
order = 16
subject = "ايه يا مي مالك اخذتي معالي الوزير على الحامي كده"
text = "يا جماعة الوزير فنان اولا واخيرا<br />الفنان دايما بيحلم<br />فهو بيحلم بمتحف كبير وعلشان خاطر يحل مشكلة التمويل تمنى ان كل مواطن يتبرع بجنيه<br />سيبوه يحلم<br />مش احسن ما يحلم بالامن المركزي وامن الدولة<br />وبعدين انتي اخذتي التصريح بتاعه ونطيتي في مشاكل البلد<br />ايش دخل الحلم بتاعه في مشاكل البلد<br />وعم شريف الدواخلي بيقول<br />soooooooooo great<br />انجليزي دا يا مرسي"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

[[comments]]
order = 17
subject = "مش مشكلة"
author = "مصري"
text = "الوزير يمكن يتذكر مشروع حملة سداد ديون مصر و الحمد لله نجحت نجاح باهر و سددنا ديون مصر كمان حملات كثيرة فعلا اددت نتائج باهرة ربنا يوفقه و فعلا يقدر يبني المتحف و ياريت يعمل لن فيه مدفن صغير علشان بالمرة لما ربنا يسهل و يستجيب يعني لما يموت ندفنه فيه"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"
