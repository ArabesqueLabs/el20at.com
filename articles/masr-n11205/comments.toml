[[comments]]
order = 1
subject = "soooooooooo great"
author = "شريف الدواخلى"
text = "الله ادى مقالات الرأى ولا بلاش .... تسلم ايدك يا مى والله<br />لقطة الموضوع اكثر من رائعه بجد .... ومعالجه جديه تميل للسخريه ...<br />و تحسنى ان بتحكى حكايه \" سرديه للقراء \" يعنى الله اكبر سرقتى عين القارئ من اول الموضوع لاخره .... وربط طلب الوزير بالحاله الرائعه التى نعيشها كمصريين اروع ما فى الموضوع ..<br />والعاميه بتاعتك ليست مبتذله اطلاقا ...<br />ربنا يكرمك على امتاعنا بالمقال التحفه ده"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

