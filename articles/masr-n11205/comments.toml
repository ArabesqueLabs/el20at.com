[[comments]]
order = 3
subject = "موضوعين حلوين في يوم واحد يا عشرينات ......."
author = "محمد السيد"
text = "ده كده كتير اوي والله علينا ....<br />الواحد مش عراف يعلق علي إيه ولا إيه؟<br />بجد جميل أوي .... وأحلي حاجة هنا اللغة ......... شكلك عاملة دماغ جامدة جدا وانت بتكتبي ........<br />أنا الموضوع بقى؟؟<br />ده لو ربع جنيه مش حأطلعه ... محتف؟؟<br />متحف مين ياعم فاروق؟؟<br />إحنا اأي نعم بيضحك علينا كتييييييييييير .. وشفنا من وزارتك انت بالذات الكتير .. إيشي مونديال كورة .. وإيشي احتفال ألفية .. وإيشي نقل تماثيل .. ده غير اكتشافات الهرم الكبييير العظيمة .... في عهد معاليك ومعالي زكي بك حواس ....<br />إنما توصل . لأنا فاروق وعمدي متحف .... وتعاطفك لوحده مش كفابة ..........<br />لا بقي ... لا ومليون لأ..... إحنا إيه ؟؟ ده إحنا بشر يا أخي......<br />ياسااااااااااااااااااااااااااااااااااااااااتر ..... يارب<br />مش قلت لكم . ..مش حاسكت؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \"لا جدوي لهذه الكلمة .. فالمشكلة أكبر وأعظم\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي في مدونتا المتواضعة مش حاسكت ...<br />http://mesh7askot.blogspot.com/"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105219/http://masr.20at.com:80/newArticle.php?sid=11205"

