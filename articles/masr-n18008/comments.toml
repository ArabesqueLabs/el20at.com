subject = "مجرد رأي"
author = "مش لازم"
posted = "2008-10-24"
text = "مجرد راي او اجتهاد من عندي<br />اذا كنت عايز ربنا سبحانه وتعالى ينيجيك من مرض معين روح ساعد اي انسان مريض بهذا المرض<br />يعني شوف مرض السرطان دا فظيع اد ايه فالواحد بيستعيذ بالله العظيم من شر ذلك المرض وفي نفس الوقت يذهب لمساعدة المصابين بهذا المرض ربنا مساعدتك للمصابين بهذا المرض لوجه الله ربنا يرحمك ولا تصاب بهذا المرض<br />وكذلك الفضل الكلوي<br />لو عايز ربنا سبحانه وتعالى يرحمك وينجيك من الاصابة بهذا المرض مع الاستعاذة الشفوية منه لازم تساعد مساعدة مادية لهؤلاء المرضى<br />وكذك السكر<br />وكل الامراض المشابهة لها<br />اللي عايز ربنا سبحانه وتعالى ينجيه من هذا المرض لازم يروح يساعد مريض بنفس المرض<br />وهذا مجرأي رأي واجتهاد من عندي لا اعلم مدى صحته<br />سلام"
archived = "2008-10-25"
capture_url = "https://web.archive.org/web/20081025200932/http://masr.20at.com:80/newArticle.php?sid=18008"
