[[comments]]
order = 0
subject = "اعد ذكر مصر"
author = "ابومحسن غربة 25 سنه"
text = "بعد ما قرأت الموضوع تذكرت بيت شعر اخذناه في المدرسة زمان يقول<br />اعد ذكر مصر ان قلبي مولع بمصر ومن لي ان ترى مقلتي مصر<br />احنا باه هنا عندنا في البلد اللي انا عايش فيها يا اخت مروه صلاح جماعة المصريين عندهم نادي صغير بيتقابل فيه المصريين مع بعض من وقت لاخر وفيه عندنا محل اسمه الامور بيبيع اكلات شعبية والنهارة حنتغدى كشري من عنده وفيه مقهى بيقعد عليها العمال المصريين وعندنا القنصلية المصرية بس ما عندناش حاجه شعبية مصرية"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222063207/http://masr.20at.com:80/newArticle.php?sid=11531"

[[comments]]
order = 1
subject = "نسيت حاجه"
author = "ابومحسن"
text = "فيه عندنا معارض منتجات مصرية كل فترة بتتعمل وبتبقى فرصة اننا نقابل تجار جايين من مصر وكل المصريين تقريبا اللي في البلد<br />ادعولنا يا جماعة"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222063207/http://masr.20at.com:80/newArticle.php?sid=11531"

[[comments]]
order = 2
subject = "اديها شعبي يا نظيف في عرض النبي"
text = "يا عم نظيف شوية شعبي علشان خاطري<br />شوية اكل شعبي<br />شوية مساكن شعبية<br />شوية جواز شعبي<br />شوية وظايف شعبية<br />لحسن يا عم نظيف العملية بقت متنيلة اوي يا عم نظيف والشباب ماشي في الشارع عمال يبص لبعضه وهو مش عارف ايه اللي بيحصل دا يا عم نظيف<br />يا عم نظيف عايزين نتجوز يا عم نظيف شعبي شعبي زي بعضه البنات والصبيان عايزين يتجوزوا يا عم نظيف<br />بلاش عم نظيف خليفة مع عم مهدي عاكف بتاع الاسلام هو الحل<br />يا عم مهدي عاكف قلتلنا الاسلام هو احل انتخبناكم وبقيتو 88 عضو في مجلس الشعب<br />فين بقى الحل يا عم مهدي عاكف<br />يلا يا عم مهدي قولنا على مشروعك لتزويج الشباب واحنا راضيين باقل حاجه يا سيدي<br />فزواج السيدة فاطمه الزهراء وسيدنا علي ابن ابي طالب مثال لكل الشباب<br />علمنا يا عم لحسن خلاص الواحد بقا على اخره"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222063207/http://masr.20at.com:80/newArticle.php?sid=11531"

[[comments]]
order = 3
subject = "فينك يا دمور واين اراضيك يا كستور"
author = "ابو على"
text = "انت بتتكلم عن الشعبى --- دى مصيبة وفيها امن دولة<br />الحكومة مش بتاع الشعبى ولا لها دعوة بقرف الناس وريحة الغلابة المعفنة<br />الحكومة بتاع مارينا والساحل الشمالى<br />بتعمل محطات مياة 5 نجوم فى الشرم والغردقة وبتدى الناس هناك مية معدنية<br />انما الشعب يشرب من المجارى دى حاجة متهمهاش<br />الحكومة باعت المصانع اللى كانت بتنتج الدبلان والدمور والكستور باعتها للهنود وناس بيقولوا عليهم مثتثمرين او مستعمرين مش فارقة<br />يا عم شعبى يعنى اية<br />مثل الحكومة بيقول -- ان قابلك مسكين حط راسة فى الطين<br />زمان كان فية البطل الشعبى<br />دلوقتى فية الهليبة وخطافة المليارات وفرارة على اوروبا<br />والنتجة<br />لا زواج ولا طلاق<br />سبع ملايين بنت عانس<br />نصف الشعب تحت خط الفقر<br />ولا الاخوان ولا لجنة السياسات ولا عفريت من تحت الارض يقدر يمنع الانهيار القادم<br />السنة دى هنبيع بنك القاهرة نسلك بة حالنا والسنة الجاية هنبيع اية اللفة اعلم"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222063207/http://masr.20at.com:80/newArticle.php?sid=11531"

[[comments]]
order = 4
subject = "الامثال الشعبية"
author = "هووووووووووووبة"
text = "ازيك يا حاجه مروة الموضوع لذيذ ولايت , بس عايزة اضيف ان اكتر حاجه بنحبها بالنسبه للشعبي او انا بحبها هي<br />الامثال الشعبيه . حديكي شويه ولاه اقولك في موقع لذيذ اوي اهو شوفي فيه الامثال الحلوه كلها وسلام يا جميل<br />http://amthal.m3loma.com/index.html"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222063207/http://masr.20at.com:80/newArticle.php?sid=11531"

[[comments]]
order = 5
subject = "أحب الشعبي ..وأموت ف الشعبي ...."
author = "محمد السيد"
text = "أنا مش حأعلق ......<br />بس الموضوع .. عجبني ودخل دماغي اوي الصراحة .....<br />رغم إنك نسيبي أهم حاجة شعبية عندنا ....<br />رئيس الشعب ...<br />إلهي يارب .ـــــــــــــــــــــــــــ ولا بلاش ....<br />وملقتش حاجة اقولها لك .... غير تسلم إيدك يا مروة ....<br />بجد حاجة شعبي موت .....<br />اه صحيح ..... الموت ده حاجة شعبية خالص ...... \"كلمة مقتبسة من ملف لعشرينات زمااااااااااااااااااان\"<br />تحياتي يا أفندم ....<br />وياااااااااارب ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \"إيه الحل؟\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي في مدونتنا المتواضعة<br />مش حاسكت ...<br />http://mesh7askot.blogspot.com/"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222063207/http://masr.20at.com:80/newArticle.php?sid=11531"
