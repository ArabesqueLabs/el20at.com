text = "الدنيا لسه بخير يا جدعان<br />لسه فى ناس كويسه فى العالم ده<br />تخيلوا معايا 21 رساله خلت الحرامى الطيب يرجع 630 دولار<br />يعنى الشعوب العربيه محتاجه كام رساله عشان الحكام الطيبين يرجعوا اللى سرقوه<br />انا عن نفسى حبعت 2784 رساله يمكن يرجعلى كام مليون<br />Yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/<br />الجمهور اللى معانا النهارده سواء كان جالس على يمين الكمبيوتر او على شماله المشهد واحد"
