text = "الكلام ده فى الصين اكيد مش فى القاهره ولو فى مصر بالحسنى وبالبوليس عمر ما فى حاجه هترجع ولو بعد عشر سنين وده عشان الظروف اللى الناس عايشنها بتجبرهم يسرقوا عموما ربنا يهدى كل الحراميه."
