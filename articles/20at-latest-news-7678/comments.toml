subject = "حتى لا تتكرر الماساه"
author = "اكتب اسمك هنا"
posted = "2007-11-29"
text = "قصة مشرف هي قصة الجنرال ضياء الحق<br />والراجل كان يعرف قصة ضياء الحق جيدا<br />فضياء الحق عندما عمل انقلابه العسكري على ذو الفقار علي بوتو اعدمه على الفور<br />مشرف غير السيناريو عندما عمل انقلاب على نواز شريف نفاه من البلد<br />وعندما انتهى دور ضياء الحق تم اغتياله<br />ومشرف يعلم تماما ان دوره انتهى فتنحى اختياريا افضل من ان يرى نفسه مثل ضياء الحق"
