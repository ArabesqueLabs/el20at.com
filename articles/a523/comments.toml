subject = "نهاية كلب"
author = "القاضي جلاد منتقم"
posted = "2009-01-16"
text = "الحق يقال في صالح هذا الرجل الصعلوك النتن ( الحقير محمد يوسف شاكر دحلان ) الذي خدم حركة حماس بكل قوة دون ان يعلم والسبب انه غبي بتفوق ، وقدم لها على طبق من ذهب الوجه الحقيقي لما يسمى حركة التحقير الفلسطينى ( فتح ) ومن يعمل في ظلها من الخونة والمرتزقة ممن كانوا لا بفارقون بارات وخمارات بيروت ومصر وتونس وغيرها ، واظهرت اعوانك من العملاء في الداخل والخارج ، وتم توثيق كل ذلك للوقت المناسب ، نحن لسنى قتله او لصوص مثلك ،<br />قبل ان ازودكم بحقائق موثقة ( مستندات ومكالمات وافلام ) تظهر لا حقا ، اود ان ابلغ دحلان ان ينتبه لمن حوله ، واقرب الناس اليه الذين يعيشون على فتات موائدك ، الذين سعملون على خلعك نهائيا ليخلو الجو لهم ، بعد ان انفضح امرك ( من يضع العقرب في جيبه ، لا بد ان يلدغه ) .<br />في السرقه : المبالغ التي استوليت عليها انت لوحدك لتاريخ 14-1-2009 وصلت الى 129 مليون دولار في حسابات سويسرا ، ( التفاصيل لاحقا ) ، لم تعطي من يخدمك ويقوم على حراستك سوى الفتات .<br />المخدرات : ان اخر شحنة تمت من اليونان عبر قبرص ، تل ابيب ، رام الله بوزن 25 كيلو هيروين ، و 75 الف حبة كروكس 20 كيلو كوكايين التي تمت بتاريخ 17-12-2008 ولم يعلم عنا الرئيس ام مازن او النذل الرجوب وحصيلة ذلك ورد الى حسابك في اسرائيل حاليا اضافة لرصيك البالغ 56 مليون دولار ( الصور والتسجيلات لاحقا )<br />الابتزاز : حدث بلا حرج ، ان تجار رام الله والقدس ، ونابلس يعلمون الكثير ، الاهم ان ابلاغك عن ان جنين بها مسلحين ليس الا من قبيل الانتقام ، لعدم الاستجابة لك بالدفع ، ولكن سيتم تحصيل ذلك منك قريبا<br />الاغتصاب : ارجو ان لاتكون قد نسيت بنت الحسيني ذات 18 عام او الطالبة من جامعة النجاح 22 سنه ام بنت عريات وغيرها وغيرها ، والسبب للاسكات بعض الاصوات من ان تتدخل في ما تقوم به ( على فكره يوجد فلم كامل عنك وبنت عريقات سيوضع على الانترنت قريبا )<br />الدعارة : ان شاكتك انت و 3 ضباط من الشين بيت في فندق ايلات اكبر شاهد على ذلك لنشر الرذيلة بن حراسك ومن حولك للارضائهم ، وماذا عن 2 من حرسك الشخصي الذين اعدموا قبل ستة شهور للاتهم اصيبو بمرض الايدز<br />( سيتم نشر الفلم لاحقا على الانترنت )<br />ان الحيث طويل والمستندات كثيرة ولكن لك الحكم النهائي<br />لقد صدر الحكم الشرعي بحقك ومن حولك من الاعوان الخونة بالاعدام ، والتنفيذ قريبا ضمن الاحداثيات التالية<br />17 ش 3 ق 22 -09\\واي ( 349950-439958-22 )<br />نهاية المجرم الموت او التوبه ( اما الاستقالة او الاعتراف ) ولنا لقاء ،<br />لقد فاتني اذكر جميع من يقرأ ان دحلان لوطي رقم واحد ( مدعما بالصور )"
