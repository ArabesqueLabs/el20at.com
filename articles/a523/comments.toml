subject = "التعليق عميل الي بحكي عن محمد دحلان"
author = "محب محمد دحلان"
posted = "2008-01-25"
text = "هدول ناس سفلة اينضفو حالهم الي عملين فيها اسلام يرجعو لماضيهم ومن اسس حركة زفت حماس محمد دحلان اشرف منهم كلهم وكندرته احسن من اجعيص واكبر راس في حماس نسيوا انفسهم ومن كانو ولا الكلاب محمود الزهار ولا اسماعيل هنية نسيو انفسهم من كانو ومن عملهم الذي عمل هذي الأشكال هي اسرائيل مثل الكلاب الزهار واسماعيل هنية وهم الذين دبرو عملية اغتيال الرنتيسي لكي تفتح لهم طريق الدنيا وهم الذين دبروا عملية الشيخ احمد ياسين وانا بقول لهم انتم العملاء يا حركة حماس ومن والاكم ف محمد دحلان هو النسر الجارح لكم ولغيركم من عملاء حماس الي هنا"
