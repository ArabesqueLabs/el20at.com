text = "لعنت الله عليكم ومن والاكم ايها الكلاب من حركة حماس انتم الذين دمرتوا الشعب الفلسطيني وانتم الذين قتلتم ابناء شعبكم ولمصلحة من ايها الخونه والمأجورين من حركة حماس فا والله اانه محمد دحلان هو النسر الجارح لكم ولاامثالكم ايها العملاء من حركة حماس اقول لكم خسئتم ايها الماجورين ف والله انا محمد دحلان اشرف منكم جميعا وكندرته هي تاج علي رأوس وكيبار حركة زفت الطين حماس ايها العملا ء لا تنسوا انفسكم<br />فعاش الاخ القائد الرمز محمد دحلان فدمت ذخرا لنا ولشعب فلسطين 000 المحب لك \"ابنك ابن قوات ال17 امن الرئاسة الجريح"
