[[comments]]
order = 0
subject = "اذا سجن الاخوان فكلنا اخوان"
author = "مش ساكت"
text = "اذا سجن الاخوان فكلنا اخوان<br />يلا يا جماعة بلاش نضيع وقت<br />يلا على القران والسنه<br />يلا على الدعوة الى الله سبحانه وتعالى مش حنسيب بيت لما ندخله وندعيه مش حنسيب قهوة لما نعد عليها وندعي الناس اللي قاعدين عليها<br />مش حنسيب شارع ولا حاره ولا دكان<br />يلا يا جماعة بلاش بكاء كلنا رجاله ونساءنا رجاله<br />يلا على الدعوة في المدارس والجامعات والمقاهي والنوادي والحواري<br />يلا يا جماعة<br />الله غايتنا<br />والرسول زعيمنا<br />والقران دستورنا<br />والجهاد سبيلنا<br />والموت في سبيل الله اسمى امانينا<br />اصرخوا يا جماعة في الشوارع<br />الله اكبر ولله الحمد<br />الله اكبر ولله الحمد<br />الاسلام هو الحل<br />الاسلام هو الحل<br />مش عايزين نشوف حد بيبكي مش عايزين نشوف حد بيعيط<br />حسن البنا حي معانا<br />حسن البنا تلميذ سيدنا محمد صلى الله عليه وسلم<br />يلا ما تضيعوش وقت<br />في كل مكان الاسلام هو الحل"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420231523/http://masr.20at.com:80/newArticle.php?sid=15267"

[[comments]]
order = 1
subject = "حكم اثلج صدرى"
author = "حسين كامل"
text = "حكم اثلج صدرى مع انى ارى ان الحكم غير عادل وكنت اتمنى ان تصل العقوبة الى الاعدام او على اقل تقدير السجن المؤبد لكن عزائنا الوحيد ان سنة السجن فى الاحكام العسكرية تعادل 12 شهرا بعكس الاحكام المدنية السنه تعادل 9 اشهر والافراج بعد نصف المدة , اى ان الشاطر سيبقى مسجونا لمده 7 سنوات بالتمام والكمال وهو زى الشاطر !! واخيرا 7 سنوات هو حكم غير عادل وغير كاف لمن يخونوا اوطانهم واتمنى من القضاء العسكرى فى المستقبل ان يكون اكثر حزما تجاه اعداء الوطن من الاخوان المتأسلمين ومن هم على شاكلتهم ممن خربوا ودمروا البلاد"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420231523/http://masr.20at.com:80/newArticle.php?sid=15267"

[[comments]]
order = 2
subject = "الوصايا العشر للإمام الشهيد حسن البنا"
author = "مش ساكت"
text = "الوصايا العشر للإمام الشهيد حسن البنا<br />اقرأ. وتدبر. وأعمل.<br />* قم إلى الصلاة متى سمعت النداء مهما تكن الظروف .<br />* اتل القرآن أو طالع أو استمع أو اذكر الله ولا تصرف جزءاً من وقتك في غير فائدة .<br />* اجتهد أن تتكلم العربية الفصحى فإن ذلك من شعائر الإسلام .<br />* لا تكثر الجدل في أي شئن من الشئون أيا كان فإن المراء لا يأتي بخير .<br />* لا تكثر الضحك فإن القلب الموصول بالله ساكن وقور .<br />* لا تمزح فإن الأمة المجاهدة لا تعرف إلا الجد .<br />* لا ترفع صوتك أكثر مما يحتاج فإنه رعونة وإيذاء .<br />* تجنب غيبة الأشخاص وتجريح الهيئات ولا تتكلم إلا بخير .<br />* تعرف إلا من تلقاه من إخوانك وإن لم يطلب إليك ذلك , فإن أساس دعوتنا الحب والتعارف .<br />* الواجبات أكثر من الأوقات فعاون غيرك على الانتفاع بوقته وإن كان لك مهمة فأوجز في قضائها ."
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420231523/http://masr.20at.com:80/newArticle.php?sid=15267"

[[comments]]
order = 3
subject = "عَشْر همسات لأهل المِحَنِ والبلاء"
author = "عبد الرحمن بن محمد السيد"
text = "يا أصحاب الحاجات .. يا أهل الفِتن والابتلاءات .. يا أرباب المصائب والكُرُبات .. أُشهِد الله على حبِّكم فيه .. ثمَّ أهدي إليكم هذه الهمسات ..<br />الهمسة الأولى : أيها المصاب الكسير .. أيها المهموم الحزين .. أيها المبتلى .. أبشر .. وأبشر .. ثم أبشر .. فإن الله قريبٌ منك .. يعلم مصابك وبلواك .. ويسمع دعائك ونجواك .. فأرسل له الشكوى .. وابعث إليه الدعوى .. ثم زيِّنها بمداد الدمع .. وأبرِقها عبر بريد الانكسار .. وانتظر الفَرَج .. فإنَّ رحمة الله قريبٌ من المضطرِّين .. وفَرَجه ليس ببعيدٍ عن الصادقين ..<br />الهمسة الثانية : إن مع الشدة فَرَجاً .. ومع البلاء عافية .. وبعد المرض شفاءً .. ومع الضيق سعة .. وعند العسر يسراً .. فكيف تجزع ؟<br />أيها الإنسان صبراً إنَّ بعد العسر يسراً<br />كم رأينا اليوم حُرَّاً لم يكن بالأمس حُرَّاً<br />الهمسة الثالثة : أوصيك بسجود الأسحار .. ودعاء العزيز الغفَّار .. ثم تذلّل بين يدي خالقك ومولاك .. الذي يملك كشف الضرِّ عنك .. وتفقَّد مواطن إجابة الدعاء واحرص عليها .. وستجد الفَرَج بإذن الله .. ( أمَّن يجيب المضطرَّ إذا دعاه ويكشف السوء ) ..<br />الهمسة الرابعة : احرص على كثرة الصدقة .. فهي من أسباب الشفاء .. بإذن الله .. وقد قال النبي صلى الله عليه وسلم : ( داووا مرضاكم بالصدقة ) .. حسَّنه الألباني وابن باز .. وكم من أناسٍ قد عافاهم الله بسبب صدقةٍ أخرجوها .. فلا تتردد في ذلك ..<br />الهمسة الخامسة : عليك بذكر الله جلَّ وعلا .. فهو سلوة المنكوبين .. وأمان الخائفين .. وملاذ المنكوبين .. وأُنسُ المرضى والمصابين .. ( الذين ءامنوا وتطمئنُّ قلوبهم بذكر الله ألا بذكر الله تطمئنُّ القلوب ) ..<br />الهمسة السادسة : اعلم أنَّ اختيار الله للعبد خيرٌ من اختيار العبد لنفسه .. والمنحة قد تأتي في ثوب محنة .. والبليَّة تعقبها عطيَّة .. والنبي صلى الله عليه وسلم يقول : ( ما يُصيبُ المسلم من نَصَبٍ و لا وَصَبٍ و لا همٍّ و لا حَزَنٍ ولا أَذىً و لا غَمٍّ ، حتّى الشوكة يُشاكُّها إلاّ كفَّرَ اللَّهُ بِها من خطاياهُ ) .. فياله من أجرٍ عظيم .. وثوابٍ جزيل قد أعده الله لأهل المِحن ِوالبلاء ..<br />الهمسة السابعة : احمد الله عز وجل أن مصيبتك لم تكن في دينك .. فمصيبة الدين لا تعوَّض .. وحلاوة الإيمان لا تقدّر بثمن .. ولذة الطاعة لا يعدِلُها شيء .. فكم من أناسٍ قد تبدَّلت أحوالهم .. وتغيَّرت أمورهم .. بسبب فتنةٍ أو محنةٍ ألمَّت بهم ..<br />فلا تكن ممن تعصف بهم الأزمات .. وتموج بهم رياح الابتلاءات .. بل كن ثابتاً كالجبل .. راسخاً رسوخ البطل .. أسأل الله أن يُثبِّتني وإياك ..<br />الهمسة الثامنة : كن متفائلاً .. ولا تصاحب المخذِّلين والمرجفين .. وابتعد عن المثبِّطين اليائسين .. وأشعِر نفسك بقرب الفَرَج .. ودنوِّ بزوغ الأمل ..<br />الهمسة التاسعة : تذكر - وفقني الله وإياك - أناساً قد ابتلاهم الله بمصائب أعظم مما أنت عليه .. ومِحن أقسى مما مرت بك .. واحمد الله تعالى أن خفّف مصيبتك .. ويسَّر بليَّتك .. ليمتحِنك ويختبِرك .. واحمده أن وفّقك لشكره على هذه المصيبة .. في حينِ أن غيرك يتسخَّط ويجزع ..<br />الهمسة العاشرة : إذا منَّ الله عليك بزوال المحنة .. وذهاب المصيبة .. فاحمده سبحانه واشكره .. وأكثِر من ذلك .. فإنه سبحانه قادر على أن ينزِع عنك العافية مرة أخرى .. فأكثر من شكره .. وفقني الله وإياك ..<br />المصدر : موقع صيد الفوائد"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420231523/http://masr.20at.com:80/newArticle.php?sid=15267"

[[comments]]
order = 4
subject = "الأول كنت رافض رأي الإخوان بس الأحداث أثبتت صحته"
author = "محمد السيد"
text = "ردود غاية في الدقة والاتزان ..<br />وتبقي النقطة الأساسية في إضراب 6 إبريل بالنسبة لمشاركة الإخوان فعلا إن الجماعة عيل الأقل هنا في اسكندرية لم تمنع ولم تأمر ... بمعني ترك حرية المشاركة لأفرادها ...<br />واظن ده الفعل السليم بشهادة الدكتور المسيري اللي قال لو نزل الإخوان في الإضراب رسميا لعلقت لهم المشانق في الشارع وكنتو حتلاقوا اللي حصل في الحلة بيتتكرر أبشع منه عن طريق استجار البلطجية ومسجلين الخطر والإعلام حيشتغل علي ده بصورة تخوف الناس وتشوه صورة أي مظاهرة أو حركة من النوع ده في الشارع ممكن تتكرر مرة تانية ..."
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420231523/http://masr.20at.com:80/newArticle.php?sid=15267"

[[comments]]
order = 5
subject = "غباء القيادة السياسية وشعرة معاوية"
author = "ممتاز القط والفار"
text = "لم يشارك الاخوان فى اضراب 6 ابريل - المرشد اثر السلامة ربما ولعلى<br />ولكن الاحكام العسكرية الغت كل ربما وكل لعل<br />الاضراب القادم سواء قال المرشد نعم او لا - فكل شباب الاخوان 0سيشاركون وبالعنف ان لزم الامر<br />لذلك فان تلك الاحكام اشعلت غضب قطاع من الناس لا بأس بة ويستطيع التأثير ويستطيع الفعل فى الشارع المصرى<br />لذلك فاضراب 4 مايو سيكون عنيفا جدا<br />وستشتعل فية نيران كثيرة<br />وعلى العادلى ان يستورد من اسرائيل كثير من الطلقات المطاطية وقنابل الدخان<br />لم يراعى الغبى الكبير شعرة معاوية بينة وبين الناس<br />والنتيجة ما سنرى"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420231523/http://masr.20at.com:80/newArticle.php?sid=15267"

[[comments]]
order = 6
subject = "إلى المدعو حسين كامل"
author = "أحمد"
text = "أنت إما يهودي حاقد أو صليبي موتور أو ومنافق تدعي الإسلام<br />إليك وإلى أمثالك أهدي هذه الآية القرآنية: { إن تمسسكم حسنة تسؤهم وإن تصبكم سيئة يفرحوا بها وإن تصبروا وتتقوا لا يضركم كيدهم شيئا } وكذلك: { إن تصبك حسنة تسؤهم وإن تصبك مصيبة يقولوا قد أخذنا أمرنا من قبل ويتولوا وهم فرحون }<br />من الخائن لوطنه أيها المنافق<br />من الذي خرب البلد ودمرها أيها الأحمق<br />أيها الموتور: قل ما شئت فإنك محاسب عليه<br />لقاءنا أمام الله لنأخذ حقنا منك"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420231523/http://masr.20at.com:80/newArticle.php?sid=15267"
