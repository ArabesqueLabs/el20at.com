text = "أقول حسبي الله و نعم الوكيل في العملاء العلمانيين اللي إتدخلوا في كل حاجة في دينا حتي الأزهر فيها أيه لو كان الأزهر بيدعم و لو معنويا الأقليات المسلمة في الدول الكافرة؟؟؟؟ هما مش عاوزين لا فلوس يبنوا بيها مسجد ولا فلوس يطبعوا بيها كتب هما كل اللي عاوزينه ان يكون ليهم مرجع ديني يلجأوا ليه و يتحاموا فيه زي م الأقليات النصرانية بتعمل ..... أدعوا لهم يا اخوانا ربنا يثبت الأقليات المسلمة اللي بيتعرضوا لتيار رهيب من الإضطهاد و المساومة علي الدين<br />خلوا بس العملاء حكامنا يسيبوا الحملات التبشيرية شغالة عيني عينك في بلادنا و يمنعوا أي داعية مسلم يفتح بقه حتي لو كان بيتكلم جوة بلده (يريدون ليطفأوا نور الله بأفواههم و الله متم نوره و لو كره الكافرون)"
