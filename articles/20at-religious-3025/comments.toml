subject = "يالله"
author = "رنا"
text = "لم استطع منع عيوني من الدموع عند قراءة كيفية تحوله الى الاسلام ومن ثم تحول امه الى الاسلام.<br />بارك الله فيك الاخ مجاهد شرارة على هذا المقال فقد لفت انتباهنا على مدى تقصيرنا بالدعوة في امريكا اللاتينية مع انهم بالفعل من اشد الناس حاجة للمعرفة عن الاسلام خصوصا بالاوضاع الاقتصادية والاجتماعية المأساوية التي يعيشونها.<br />جزاك الله خيرا ونرجو منك زيادة الكتابة عن مقالات تلفت انتباهنا الى تقصيرنا في اي ناحية من نواحي حياتنا."
archived = "2010-03-14"
