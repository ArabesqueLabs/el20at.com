subject = "ضع عنوان التعليق"
author = "ابو شامل"
text = "سيبك من شادي احمد شارب عصير خيار بايت لمده اربعه ايام في الصيف<br />لكن انا من خبرتي بقول لو خصصنا 15 دقيقه من وقتنا كل يوم في النت مثلا والتحدث مع واحد كل يوم لمده 15 دقيقه عن الاسلام الحال هيتغير كثير<br />صدقوني هيتغيييييييييييييييييييييييييييييييييييير كثير ممكن لا يسلم لكن هيتصحح عنه كثير مفاهيهم عن الاسلام"
