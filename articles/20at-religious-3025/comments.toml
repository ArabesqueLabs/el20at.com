[[comments]]
order = 10
subject = "الله متم نوره"
author = "بنت الشام من بلاد العم سام"
posted = "2007-02-12"
text = "السلام عليكم ورحمة الله وبركاته<br />| English انجليزي |<br />From the Churches to the Mosques!!!<br />من الكنائس الى المساجد<br />قبل الاسلام *<br />بحثي عن الحق *<br />اعلان اسلامي *<br />بعد الاسلام *<br />لقد ولدت في الدنمرك، وتربيت في عائلة أردنية مسيحية في الأردن (التفاصيل). كان أبي قسيساً (رجل دين مسيحي) لأربعة كنائس وتعتبر أمي من أكبر القادة النساء المسيحيات في مجتمع الشرق الأوسط. وقد كنت قائدة شبيبة وأطفال في الكنيسة، ومرشدة مسيحية في المجتمع المسيحي فأنا لدي المعرفة الكافية عن التوراة والأنجيل. لقد اتخذت المسيح مخلص شخصي لحياتي عندما كنت الثامنة من العمر، وتعمدت بالماء في الثانية عشرة، ثم تعمدت بالروح في الرابعة عشر من العمر. ولكني لمم أغلق عقلي في يوم من الأيام للتعرف على الحقيقة، والبحث عن المعرفة حيث أنني لم أجد السلام في داخلي الى أن أصبحت مسلمة، وقد اتخذ الكثير من الوقت حتى اقتنعت بالاسلام ديناً.<br />ابتدأت القصة عندما كنت صغيرة، لقد كرهت الاسلام كرهاً شديداً، وعندما كنت في الصف العاشر، رأيت فتاة مسلمة تصلي فركلتها بقدمي ودفعتها وهي ما زالت ساجدة على الأرض. ولقد تشاجرت مع الكثير من البنات في المدرسة الاعدادية الحكومية، وأردت أن أريهم كم أنا مثقفة، لذلك كنت أحضر الكتاب المقدس (التوراة والانجيل) معي كل يوم، وأقرأ بصوت مرتفع، أو أكتب نصاً منه على اللوح كحكمة اليوم. وأذكر عندما كان شهر رمضان، اعتدت أن آكل أمام البنات المسلمات الصائمات (وأسأل الله أن يرحمني ويغفر لي)، لقد كنت صاحبة مشاكل خطيرة.<br />في الصف الحادي عشرة (قبل التخرج)، أذكر أنني قررت أن أحضر درس الثقافة الاسلامية وأستمع لما يقوله البنات عن الدين المسيحي. وقالوا أن الانجيل محرف ومغير، فغضبت كثيراً وشرحت لهم أن الانجيل اعجازي وقد كتب في أربعة كتب مختلغة من أربعة أشخاص مختلفين في نفس الوقت ولكن في أماكن مختلفة (متى، مرقس، لوقا ويوحنا). فاستضطردت إحدى البنات وقالت: \"إذاُ فإنك تقولين أن الجن كتب هذه الكتب\" انزعجت كثيراً وخرجت من الصف ولم أكن أريد أن أناقش مع البنات أكثر من ذلك.<br />تساءلت البنات عني وأردن معرفتي أكثر، لذلك أتين وبدأن يطرحن علي الأسئلة عن ديني حياتي وكنت أنا أجيبهن وأريهن الكتاب المقدس ودلائله لمحاولة اقناعهن بدين المسيحية. حتى أنه في يوم من الأيام نادتني معلمة اللغة العربية وقالت لي أنه يجب علي التوقف من التحدث مع البنات عن الدين المسيحي لأن القانون لا يسمح بذلك، فقلت لها أن هذا لا دخل لي في الموضوع، فقالت: \"إن لدي شريط مسجل بصوتك وأنت تتحدثين مع البنات عن دينك\" حقاً جعلني هذا غاضبة جداً، وأصبح لدي الحقد والكره للمسلمين والإسلام. فزادت خدمتي التبشيرية وأردت من الاسلام أن تتحول الى مسيحية، حتى أنني عزمت بعض صديقاتي المسلمات أن يأتين الى الكنيسة لإقناعهن بالدين المسيحي.<br />وبعد تخرجي من المدرسة ذهبت الى جامعة مؤتة في عام 1999 ولكني لم أكمل السنة من دراستي وخرجت منها بإذن الله وكنت عالمة أن أوراق هجرتي للولايات المتحدة قريبة جداً<br />وها أنا قد هاجرت الى ولاية تكساس في الولايات المتحدة الأمريكية في عام 2002، محاولة بداية حياتي من الصفر، وكنت أذهب الى كنيسة دالاس المعمدانية العربية، وكان عمي هو قسيس هذه الكنيسة. في الحقيقة لم أحب العيش هناك فاتصل أهلي مع عائلة مسيحية في ولاية أريزونا لأذهب وأعيش عندهم وأبدأ حياتي مرة أخرى، ولكن عندما لم أجد من يدعمني مالياً سألتني عائلتي أن أرجع الى تكساس وأبقى مع أخي وأختي وكنت أنا أكبرهم، أما باقي العائلة فرجعوا الى الأردن كي ما يكمل والدي خدمتهما التبشيرية في الشرق الأوسط. وهكذا وجدت عملاً وبدأت دراستي في الكلية وأنا ما زلت أذهب الى الكنيسة أعمل نشاطاتي المسيحية المعتادة، حتى أني كنت أبعث بعض البرامج والمناهج الجديدة للكنيسة في الأردن وأساعد في تدريس الانجيل مع الأطفال.<br />في ديسيمبر عام 2003 انتقل أبي الى رحمته تعالى مصاباً بمرض السرطان (نسأل الله أن يرحمه)، ولكن هذا لم يوقفني من متابعتي في الحياة.<br />أقول لك في التحقيق أني أتيت الى الولايات المتحدة لأبشر عن المسيحية وأكمل خدمتي التبشيرية، وكان هدفي وصول العرب المسلمين ومحاولة ارتدادهم للمسيحية، لأنني أعتقد أن امريكا هي دولة حرة فيها حرية الفكر والتعبير والكلام.<br />وهكذا تقابلت مع مجموعة من الأصدقاء المسلمين، وبدأنا التحدث عن الديانات المسيحية والاسلامية، فأنا أعلم التوراة والانجيل حق المعرفة، كنت أناقشهم بحدة وأحاول اقناعهم للارتداد.<br />وهكذا أحضر أصدقائي شاباً اسمه المصطفى بالحور – الذي هو زوجي الآن – ليكمل في النقاش معي. وكانت بالنسبة لي كالسباق، فعلاً كان لديه المعرفة الواسعة في القرآن والسنة، لذا لم أحببه أبداً. وكنت معظم الوقت أحاول اضافة الكاز على الدخان لتضخيم المسائل الدينية، وأحياناُ نصل الى نهاية عقيمة مغلقة، فأنا كنت عنيدة جداُ حتى أنني بدأت أحس بالارهاق.<br />على كل حال، كانت أمي قادمة في أيلول 2005 واعتقدت أن هذه حجة مناسبة لتجنب النقاش والذهاب بسبيلي، لأنني كنت أشعر بالضيق.<br />كنت أعتقد أنها ستكون اهانة لي لو خسرت النقاش، لذلك قلت لأصدقائي أن علي الذهاب، ولكن مصطفى ناداني باسمي وقال: \"أريد دليلاً\" فسألته عما يتحدث، قال: \"اذهبي فتشي الانجيل بكامله، لن تجدي آية واحدة تفصل أن المسيح قال عن نفسه هو الله، لم يقل أبداً: أنا الله\" لقد وجدت هذه الفرصة المناسبة لدعوته للمسيح (الذي كنت أعتقد أنه المخلص الشفيع وأنه ابن الله)<br />فقلتها بسخرية: \"ما الذي تقوله، إنه من المؤكد أن هناك أيات كثيرة تقول أن المسيح هو الله!\" قال مصطفى: \"أرني الدليل\" ذهبت للبيت وهذا السؤال عالق في عقلي يؤنبني\"<br />فتحت الانجيل وبدأت البحث، وبعدها ذهبت الى الانترنت للبحث، ومن ثم الى الكتب ولم أجد شيئاً.<br />وبعدها سألت أمي وبدأ نقاشي معها. قالت لي: \"في الحقيقة لا يوجد هناك آية حقيقية تصرح أن المسيح قال عن نفسه أنه هو الله، ولكنه قال؛ من رآني فقد رأي الآب\" فأجبت: \"ولكن الآب والابن ليسوا متشابهين؟\" قالت: \"ولكنك تعلمين أن لهم نفس المستوى في القوى، وهم واحد في الثالوث الأقدس (الآب والابن والروح القدس)\"<br />لذا فإن القضية الأولى فاشلة ولا يوجد لديها أي دليل، والآن لنذهب للقضية الثاينة ألا وهي: المسيح هو الابن (ابن الله)<br />بدأت بالبحث أكثر، ووجدت أن هناك معادلة مكتوبة في الانجيل، انجيل يوحنا 1:1 \" في البدء كان الكلمة والكلمة كان عند الله\" حسناً؟ اذاً فان الكلمة هي المسيح الذي خلق من بدء الخليقة وهو كان عند الله<br />ولكن في نفس الآية أو العدد يقول: \" وكان الكلمة الله\" فتعجبت أن الله=المسيح وأن الله مع المسيح في نفس الوقت! كيف يكون هذا؟<br />هذه معادلة رياضية باطلة، كيف يمكن أن يكون المسيح الله وهو معه في نفس الوقت، هل هو مفصوم الشخصية؟ هذا شيء غير واقعي ولا يمكن أن يتخيله العقل<br />لذا فقد تركت هذا النص وتوجهت الى نص آخر، الى رسالة يوحنا الأولى الاصحاح الخامس وعدد 7 يقول: \" فان الذين يشهدون في السماء هم ثلاثة الآب والكلمة والروح القدس وهؤلاء الثلاثة هم واحد\" فرحت جداً لأنني اعتقدت انني وجدت الحل؛ الآب=الابن=الروح القدس (هم واحد)<br />ولكن العدد الذي بعده مباشرة 8 يقول: \" والذين يشهدون في الارض هم ثلاثة الروح والماء والدم والثلاثة هم في الواحد\" الروح=الروح القدس، الماء=الآب، والدم=الابن. فكيف يمكن أن يكون الثلاثة=(هم) واحد والثلاثة (في) واحد في نفس الوقت، هناك فرق بين المعنيين.<br />ثلاثة (هم) واحد معناها أنهم الثلاثة في نفس المستوى في كل شيء حتى في القوى والمكونات (مثال: الماء تتشكل الى ثلاثة أشكال السائل، الصلب والغاز، ولكنها لا تتأثر كيميائياُ فهي تحتوي على الهيدروجين والاوكسجين). أما الثلاثة في (واحد) فانها تشبه ثلاثة اخوان لهم نفس اسم العائلة، ولكنهم ثلاثة شخصيات مختلفة.<br />بالاضافة أنه اذا فعلاً اعتقدت أن الله ثلاثة، فلِمَ لدينا خليقة واحدة وليست ثلاثة؟ فعلى سبيل المثال لو أحضرنا ثلاثة رسامين ليرسموا لنا شجرة معينة، كل واحد منهم سوف يرسمها بأسلوبه الخاص تبعاً لطريقة تفكيره، وحتى إذا كانوا الثلاثة في الواحد يخلقون الخليقة، فإن كل واحد منهم سوف يخلقها بطريقة مختلفة عن الأخرى، حتى لو كانت بنفس الهدف ولن ستكون بأسلوب كل واحد منهم الخاص.<br />وهنا بدأت أرى التناقض في الكتاب المقدس، فمن أين حصلت بهذا الكتاب؟ أنا أعلم أن المسيح قال عن نفسه ابن الله ولكني أعلم أن جميع اليهود يطلقون على أنفسهم أولاد الله وهم ناس بشر مثلنا، فهذا التعبير كان دارجاً في ذلك الوقت.<br />المسيح كان نفسه يجلس لوحده ويصلي، فلمن كان يصلي؟ كان يصلي لنفسه؟ كان يدعو الله، حتى أن الكتاب المقدس يثبت ذلك: \" في ذلك الوقت اجاب يسوع وقال احمدك ايها الآب رب السماء والارض لانك اخفيت هذه عن الحكماء\" متى 11:25 \" ثم تقدم قليلا وخرّ على وجهه وكان يصلّي قائلا يا ابتاه ان امكن فلتعبر عني هذه الكاس .ولكن ليس كما اريد انا بل كما تريد انت\" متى 26:39 \" فمضى ايضا ثانية وصلّى قائلا يا ابتاه ان لم يمكن ان تعبر عني هذه الكاس الا ان اشربها فلتكن مشيئتك\" متى 26:42 \" وبعدما صرف الجموع صعد الى الجبل منفردا ليصلّي ولما صار المساء كان هناك وحده\" متى 14:26 \" وفي الصبح باكرا جدا قام وخرج ومضى الى موضع خلاء وكان يصلّي هناك\" لوقا 1:35 \" وبعدما ودعهم مضى الى الجبل ليصلّي\" لوقا 6:46 \" ولما اعتمد جميع الشعب اعتمد يسوع ايضا .واذ كان يصلّي انفتحت السماء\" لوقا 3:21 \" واما هو فكان يعتزل في البراري ويصلّي\" لوقا 5:16 \" وفي تلك الايام خرج الى الجبل ليصلّي .وقضى الليل كله في الصلاة لله\" لوقا 6:12 وغيرها من الأمثلة الأخرى.<br />بالإضافة الى أن هناك ذاكرة أخرى لمعت لي أنه عندما كنت أدرس اللاهوت (العقيدة) المسيحية، جاء أحد الدكاترة البريطانية الكبار، وكان يعلمنا عن تاريخ الكتاب المقدس، وأذكر أنه قال حرفياً: \"حسناً .. لقد ذهبت الى المعرض في بريطانيا لأرى نصوص الانجيل الأصلية المكتشفة، ولم أجد غير أوراق محروقة، وممزقة وضائعة\" فنظرت الى الكتاب بين يدي وسألت في نفسي ما هذا الكتاب؟؟<br />من أين جاءت كل هذه الكلمات في الكتاب؟<br />اذا كنت أعبد اله كاملاً ليس فيه عيباً واحداً، فكيف يمكنني بالايمان بكتاب غير كامل أو غير محفوظ؟ هذا ليس صحيحاً<br />وبدأت التفكير والتأمل، لو أننا أخذنا كل الكتب السماوية التي على الأرض ورميناها بعيداً، ثم سألنا الناس ليحضروا كتاب آخر مطابقاً للكتب الأولى، فلن أجد مسيحياً واحداً يحضر لي إنجيلاً مطابقاً له، بينما سأجد على الأقل مليون مسلماً حافظين القرآن ظهراً عن قلب لأن المسيحيين لديهم نسخ كثيرة مختلفة عن بعضها البعض، وما زالوا يكتشفون نصوصاً انجيلية جديدة الى حد الآن، أليس هذا عجيباً؟<br />وبعد ذلك بدأت أدرس لاهوت صلب المسيح، فهل مات المسيح حقاً؟<br />وبدأت بالتفكير بهذا الانجيل الذي بين أيدينا، هل هو حقيقياً؟ الأشخاص الذين كتبوا الأناجيل هم يهود تبعوا المسيح وراقبوه وكتبوا سيرة حياته .. لقد رأوه يموت على الصليب .. ولكن هل من الضرورة أنهم رأو نفس الشخص المسيح الذي يصلب؟؟<br />في القرآن الكريم يقول الله عز وجل: \" وَقَوْلِهِمْ إِنَّا قَتَلْنَا الْمَسِيحَ عِيسَى ابْنَ مَرْيَمَ رَسُولَ اللّهِ وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَكِن شُبِّهَ لَهُمْ وَإِنَّ الَّذِينَ اخْتَلَفُواْ فِيهِ لَفِي شَكٍّ مِّنْهُ مَا لَهُم بِهِ مِنْ عِلْمٍ إِلاَّ اتِّبَاعَ الظَّنِّ وَمَا قَتَلُوهُ يَقِينًا (157) بَل رَّفَعَهُ اللّهُ إِلَيْهِ وَكَانَ اللّهُ عَزِيزًا حَكِيمًا (158)\" فإذاً الناس الذين رأوا المسيح يقتل، رأوا شخصاً مشابهاً له.<br />فإذاً ما هذا الذي بين أيدينا؟؟ سيرة المسيح وأكثر من 75% ملقحة.<br />والآن ها قد حصلت على النتيجة بين يدي: المسيح هو ليس الله، ولا حتى ابن الله .. خفت كثيراً وقلقت لدرجة لا تصدق.<br />كل هذه السنوات؟ 24 سنة من حياتي وأنا أدرس نظريات غير معتمدة من الانجيل والتوراة.<br />24 سنة من حياتي أعبد الإله الخاطئ<br />24 سنة من حياتي ذهبت سدى، كذبة محققة.<br />أردت الانتحار، شعرت أن الأرض تهتز من تحت قدمي، وأصابني الرعب.<br />أردت أن أرجع الى بداية المطاف وأبحث من جديد لأثبت العكس، ولكني صمت قليلاً، لا أعرف ما الذي سيحدث بعدها .. شعرت أنني أدمر حياتي.<br />وصرت أفكر .. أنا أؤمن أن المسيح الآن هو انسان نبي مرسل من الله سبحانه وتعالى، وأنا أؤمن بجميع الأنبياء الذين قبله .. ولكن كانت لدي هناك مشكلة بسيطة مع النبي محمد (صلى الله عليه وعلى آله وأصحابه وسلم)<br />في الحقيقة لم أتعلم شيئاً عن حياته، وكل ما أعلمه هي معرفة بسيطة عن طريق المسيحية الذين زرعوا في داخلي هذه الأفكار عنه (صلى الله عليه وعلى آله وأصحابه وسلم)، ولكن كيف يعظموه الناس المسلمين طوال الوقت؟؟<br />قلت، كيف يمكن أن تكون هذه مشكلة والقرآن الكريم أتى من الله من خلال النبي محمد صلى الله عليه وعلى آله وأصحابه وسلم؟ إنه حقاً لرجل متميز .. أعظم الخلق (صلى الله عليه وعلى آله وأصحابه وسلم) إذاً فهي ليست مشكلة أبداً أن أؤمن بنبي آخر وهو خاتم الأنبياء صلى الله عليه وعلى آله وصحبه وسلم.<br />بالاضافة أنني أعلم أن هناك إنجيل خامس غير قانوني أو شرعي لدى المسيحية إسمه (برنابا) لأن هناك الآية التي يقول فيها المسيح (سيأتي بعدي نبي اسمه أحمد) ويحدثنا أيضاً أن المسيح عليه السلام شبّه به ولم يمت على الصليب بل ارتفع قبل امساكه.<br />تركت غرفتي بعد تأمل طويل وتفكير عميق في البحث، واتصلت مع أصدقائي المسلمين الذين لم أرهم منذ شهرين على الأقل. وذهبت لرؤيتهم. فعلاً كنت أصلي الى الله وأبكي: \"إذا كان هو الطريق الصحيح، فغير حياتي، وإذا لم تكن فاجعلني أموت في حادث سيارة قبل أن أصل أصدقائي واجعلني أدخل الجنة .. فكل ما أريده هو الحقية ومرضاتك يارب، وكل ما أبغيه هو الجنة\"<br />وهكذا وصلت الى أصدقائي ودموعي تذرف من عيني، فاعتقدوا أن شيئاً مكروهاً قد حدث لي، وكان هناك زوجي الحالي مصطفى، وكان الجميع ينتظر مني أن أتكلم ليعلمون حقيقة أمري، ثم استضطردت:<br />أشهد أن لا إله الاّ الله .. وأشهد أن محمد رسول الله<br />عم الصمت لعدة دقائق والجميع يرمقني باندهاش، ثم قال مصطفى ساخراً: \"أسكتي .. ولا تكذبي\"<br />أذكر أنه كان الثالث من أكتوبر.<br />قلت له: \"أنا لا أكذب، وبدأت بالبكاء والشهيق\"<br />قال: \"لي مستغرباً، لقد قلت المرة الأخيرة في نقاشنا أنه لو قلت الشهادتين وأنت لا تؤمني بها فهذا لا يعني أنك أصبحت مسلمة! فكفى كذباً\"<br />قلت له: \"أنا لا أكذب، غداً سيكون أول يوم في رمضان، والآن ستعلمني كيف أفعل الوضوء وكيف أصلي وكل شيء\"<br />عندما سمعني أقول ذلك ورأى الاصرار في عيني، وقع باكياً من الفرحة والانفعال الشديدين ورحّب بي في الاسلام ترحيباً حاراً<br />وفعلاً تعلمت الصلاة وكل التقاليد والسنة في ليلة واحدة، واشتريت حجاباً وبدأت أمارس عقيدتي الجديدة. ولكني أخفيت اسلامي عن العائلة لمدة أسبوعين.<br />في ذلك الوقت، ذهبت الى الإمام وأعلنت إسلامي، وبدأت أتعلم القرآن، وأفعل المقارنات ما بين الانجيل والكتاب المجيد القرآن الكريم، وكان من الصعوبة علي في البداية من التخلص من الرجوع الى الانجيل، ولكن الحمدلله فقد تغلبت على هذه العادة، وبدأت أتعلم سيرة النبي صلى الله عليه وعلى آله وصحبه وسلم والقرآن.<br />وكما قلت سابقاً فقد أخفيت اسلامي عن العائلة في البداية، وكنت أصلي الساعة الثانية أو الثالثة بعد منتصف الليل حتى لا يراني أحداً أو يشك بي.<br />وفي يوم من الأيام كنت ذاهبة من البيت الى الكلية وكان معي حقيبتي التي تحتوي على القرآن والحجاب، ولكن فجأة، وقع الحجاب على الأرض ورأته أختي ولكنها لم تعلم ما الأمر الى أن جاء الليل واستيقظت لتراني أصلي، فعلم أعضاء العائلة عن اسلامي، وبدأ الابتلاء.<br />رفعوا صوتهم علي وصاحوا، واعتدوا علي نفسياً وعاطفياً، نعتوني بجميع الكلمات القذرة وغير الملائمة. ضربوني الى أن وصلت للموت وهددوني بالقتل، ومع ذلك فقد كنت هادئة ولم أحاول مناقشتهم في شيء، ولكني تركت البيت داعية من الله أن يهديهم.<br />بقيت مع صديقتي المسلمة لمدة شهرين قبل أن أتزوج بمصطفى .. الحمدلله .. لقد فقدت عائلتي، ولكني كسبت عائلة مسلمة أخرى في المسجد فقد رعوني رعاية رائعة لا مثيل لها وجازاهم الله كل خير.<br />وبعد ذلك انتابتني الكثير من الضغوط النفسية بسبب الاعتداءات التي حصلت معي، وما زلت لحد الآن أستلم على الأقل 25 مكالمة وايميلات يومية من كل أنحاء العالم، يسبون علي ويهددوني وما الى غير ذلك<br />وغير المكالمات الهاتفية، فقد اتصل معي أكبر العلماء والدكاترة المسيحيين من الأردن والولايات المتحدة، يناقشون معي الدين المسيحي ومحاولتهم لإعادتي لدينهم.<br />سبحان الله .. لقد اعتدت أن يكون معي الانجيل دائماً في الحوارات الدينية وكان الاتجاه المعاكس هو القرآن، والآن فقد انقلبت الطاولة وأصبح القرآن معي دائماً وأبداً<br />ومع كل هذا، فقد تعلمت الدروس المهمة في ذلك الوقت القصير، تعلمت أن أكون صبورة ومتواضعة، وأتأمل الآن في قصة الرسول محمد صلى الله عليه وعلى آله وصحبه وسلم، وكيف أهين من أهله وضرب، وهذه قصتي لا تساوي شيئاً بالنسبة له صلى الله عليه وعلى آله وصحبه وسلم، حقاً لقد تعلمت الكثير.<br />ولربما فقدت شرف اسم عائلتي في أعين الناس، ولكني فخورة أني اكتسبت أعظم شرف من الله سبحانه وتعالى ألا وهو الاسلام. وفعلاً إنك لا تستطيع أن تتخيل السعادة والسلام اللذان غمراني منذ أن أسلمت بالرغم من كل هذه الاهانات<br />وفي الحقيقة أني تغيرت كثيراُ كما كنت عليه في الأول، حتى أن زوجي لاحظ هذا التغيير الشاسع، فقد تعلمت كيف أكون هادئة مع الناس الذين يعتدون علي، وتعلمت كيف أبتسم لهم رغم وجودي في أصعب الأوقات، ورغم فقداني وظيفتي لكوني مسلمة محجبة، ولكن الله عز وجل يعوضني بما خسرت بأضعاف وبغير احتساب .. الحمدلله<br />فكل الاسلام هو وجود السلام الداخلي الحقيقي، فإنك بالتحقيق لا تستطيع أن تجد هذا السلام من اللذين هم حولك، ولا حتى في البيئة التي أنت تعيش فيها، يجب أن تكون اقتناع داخلي منك عن طريق محبتك لله وارضائه وتسليمه قلبك له. واذا كانت عبادتك حقيقية لله واتبعت طريقه فبالطبع ستكون سعيداً في حياتك لأن الخطيئة تحرمك من هذا السلام وتعكر مزاجك وهي ألم أكثر من سعادة دنيوية.<br />وها أنا أنظر الى وجوه الناس وأرى الكثير من الحزن والدموع لأنهم بعيدين عن الله الحي الخالق عز وجل، وأحياناً أرى قلوبهم المظلمة ولا يريدون اضاءة شمعة الرجاء فيهم ويلتهون بمشاكلهم ومشغولياتهم ويتمسكون بالدنيا بدل الآخرة.<br />كل ما أعرفه الآن، هو أن هدفي في الحياة عبادة الله وارضاءه وصلاتي له واتباع سنة رسوله صلى الله عليه وعلى آله وصحبه وسلم والعمل من أجل الجنة .. الحمدلله<br />أنا أرجو أن تكون هذه القصة حافزاً لك وتشجيعاً لروحك وايمانك بالله فقد سمحت لنفسي بنقلها لكم عن الأخت العزيزة .. عند قرئتهافي موقع اسلامي فتشت في قوقل عن هاتفهاوجدت أن من واجبي أن أحدثها وحدثتها لساعة من الزمن والله لم أجدها الافتاة ناضجة ذكية فرحت باتصالي وقلت لي كأني أحدث صديقة لي أعرفها من زمن بعيد وكنت قد أخبرتها في بداية اتصالي بأنني بعمر أمها وأن لي ولد بعمرها .. سرت نفسي بمحادتثها لأنها تعرضت لأذى كبير من الجميع ولكن الحمد لله علاقتها بوالدتهاأحسن وطلبت مني الدعاء لوالدتها واخوتها ..... اللهم ثبت ربى اللهم ثبت ربى اللهم ثبت ربى وأرفد أهلها بها واهدي أولادي وشباب المسلمين وانصر الاسلام في ديار الكفار ..... والمسلمين انك مجيب الدعاء"
