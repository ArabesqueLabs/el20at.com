[[comments]]
order = 27
subject = "ممكن تقول على نهج سيدنا سلمان الفارسي"
author = "شادي أحمد"
text = "يعني باتساءل اللي كتب عنوان الموضوع ده شارب ايه ؟ بقى بالذمة يا محترم يا اللي عايز تكتب عنوان لموضوع هدفه دعوي و إيماني تشبه شخص مهما بلغ بأحد الصحابة الكبار الذين قال فيهم سيدنا المصطفى صلى الله عليه و آله و سلم \" سلمان منا آل البيت \" .. اختيار العنوان له أصوله و آدابه ( و ذوقه ) مش دايما ينفع نختار اسم مثير و خلاص .. و الكلمة دي موجهة لصاحب اختيار العنوان الله أعلم اذا كان صاحب الموضوع نفسه و لا محرر تاني ."
archived = "2010-03-14"
