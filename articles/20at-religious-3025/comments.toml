[[comments]]
order = 29
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
text = "بسم الله الرحمن الرحيم الحمد لله رب العالمين والصلاة والسلام على خير المرسلين محمد وعلى آله وصحبه أجمعين<br />السلام عليكم<br />بارك الله فيك أخي مجاهد<br />لقد أعجبتني هذه الوصلة الكتابية جدا<br />ظلت نفس محمد تهفو لزيارة البيت الحرام والوقوف أمام مقام سيد الأنبياء والمرسلين، حتى أتت الفرصة للحج عام 1993 ووقف يصلي أمام الكعبة معلنا أنه لا يسجد للكعبة ولا يعبد الحجر الأسود بل يسجد ويعبد الله وحده، وبعد الحج قدم محمد أوراقه في جامعة أم القرى وكان لزاما عليه أن يتدرج من معهد لتعليم اللغة العربية لغير الناطقين ثم الالتحاق بكلية الدعوة وأصول الدين، خلال هذه الفترة ارتبط محمد عاطفيا بسيدنا أبو هريرة رضي الله عنه واختار التخصص في علم الحديث.<br />الله أكبر ..<br />تحياتي"
archived = "2010-03-14"
