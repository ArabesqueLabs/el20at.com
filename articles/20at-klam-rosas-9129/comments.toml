author = "المغربية"
posted = "2009-11-24"
text = "السلام عليكم<br />بلد المغرب اضاعو شبابه وجعلوه مغيب ضاع الدين وضاع معه كل شي وسيضيع ماتبقى يصرف ملايين على الفجور والتفسخ والمهرجانات وتمجيد الفاسقين الغربيين من فنانون وغيرهم وانتشر الزنا والربا والعقوق والفسوق وعصيان ربهم علانية ويعلمون ان هذا حرام وان الله سيسلط عليهم كل ضيق وكل فقر وكل هم ومرض اللهم اعذنا من كل بلاء وكرب ووصب ومرض وقسوة في القلوب, اللهم اهدى المغرب لتباع القران والسنة النبوية الصحيحه وفتح دور القران والسنة التي اغلقت بتدبير من شياطين الانس في المغرب اللهم اهدهم قبل قيام الساعه او ان يحل عليهم غضب من الله فيندمون على مافعلوه في عصيان ربهم وصلى وسلم على محمد وعلى اله وصحبه اجمعين"
archived = "2010-03-14"
