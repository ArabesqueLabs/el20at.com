subject = "الهلوكوست"
author = "بنت عربيه"
posted = "2008-03-01"
text = "يجب على كل عربى الوقوف بجانب فلسطين وعمل موقف ايجابى جماعى على كل عربى منا البحث عن ايملات البيت الابيض والكونجرس الامريكى وجميع السفارات الامريكيه فى كل الدول العربيه وكل السفارات الاجنبيه مثل فرنسا وانجلتر المدفعين على حقوق الانسان والمدافعين عن اسرائيل والمنددين للهلوكوست لليهود او المحرقه النازيه واليوم تتعرض فلسطيين لمثل هذه المحرقه ولكن فى صمت جميع الشعوب يجب علينا عدم الصمت على تهديد اسرائيل للفلسطيين بالمحرقه يجب علينا الرسال اعتراضنا وتنديدنا على كل الاميلات لعلا الدول تستيقظ وتدافع عن فلسطين كما دافعوا عن اليهود."
