[[comments]]
order = 2
subject = "---"
author = "doooda"
posted = "2007-11-13"
text = "بجد بجد انا عنيا دمعت و انا بنقرأ المقال ده<br />لو كان يونس شلبي بتاع رقص و هلس و مسخرة كانوا عملوا حكايات و الفنانين يحضروا العزا و صاحبنا أبو الشعب كله كان حيبعت مندوب للتعزية أو يمكن يحضر العزا بنفسه<br />رحم الله يونس شلبي طالما كنت بحس بالبراءة و الطيبة في أسلوبه و معاملاته<br />ربنا يرحمك يا (إبن ناظر المدرسة) لعل حبك لرسم البسمة علي وجوه الجميع كبارا و صغارا يغفر لك و يمكن إبتعاد زمرة الفنانين عنك في أواخر أيامك ده فضل من عند ربنا<br />و آخر الكلام سلام"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116123923/http://masr.20at.com:80/newArticle.php?sid=12421"

[[comments]]
order = 3
subject = "قدوة هشة ومثال لايصلح"
author = "كتكوتة"
posted = "2007-11-13"
text = "اكبر دليل على زيف الحياة داخل الوسط الفني موت هذا الطفل الكبير وحيد فقير بهذا الشكل نسال الله القدير ان يكون بهذا المرض قد طهره من خطاياه وغفر له<br />ولكن الصور المرسومة المفروضة علينا كالزعيم الهش عادل امام سفير الامم المتحدة صديق عمرة الم يكن يستطيع التخلي عن جناح ارنب من ارانبه الكثيرة ليعالج بها انسان فقير كان يوما ما صديق له<br />صحيح حياة مزيفة ورموز ورقية هشة مفروضة علينا كقدوة وهي لاتصلح وعشان كدا طالع الجيل هايف وفاضي عشان هما دول القدوة والمثل لينا<br />رحم الله الطفل الكبير واعان اسرته على مصابها واحسن الله خاتمتنا جميعا"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116123923/http://masr.20at.com:80/newArticle.php?sid=12421"
