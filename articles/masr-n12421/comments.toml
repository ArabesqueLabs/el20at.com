text = "allah yr7AMAK YA ACHRAF WE AKFAA MOMATEL FE DONYA<br />WA LAZEM EL INSAN YAKHOD 3EBRA MEN HAD ZAMAN WE ASS7AB HADA ZAMAN ALLAZIN LA TO7AREKOHOM ILLA AL MASALE7<br />RA7EMA ALLAO EL FA9ID WA ASKANAHO FASSI7A JANNATEH<br />WA INNA LILAH WA INNA ILAYH RAJE3ON"
