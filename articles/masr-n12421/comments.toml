subject = "طططططططط"
author = "زززززززززز"
posted = "2007-11-13"
text = "ربنا يحسن ختامنا جميعا<br />ويرحم اموات المسلمين<br />وسبحان من لة الدوام<br />كل من عليها فان ويبقى وجة ربك ذو الجلال والاحسان<br />رحمتك لنا يا رب"
archived = "2007-11-16"
