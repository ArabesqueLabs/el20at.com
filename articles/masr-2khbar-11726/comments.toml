[[comments]]
order = 0
subject = "الحيطة المايلة فى الشرق الاوسط"
author = "اكتب اسمك هنا"
posted = "2009-03-28"
text = "ما هى بقت هيصة والكل عايز يستغل الضعف الاقتصادى للبلد وعارف ظروفها المقندلة وانها بتجرى وراء طوابير الخبز وازازة الزيت المدعم وكيس الفول - يعنى اقتصاد ما يقدرش يمول حرب او يصمد فى حرب<br />الحرب يعنى اقتصاد قوى - علشان تقدر تشترى ذخيرة وتشترى سلاح وتعوض خسائرك - انما ظروف مهببة - وحتى لو توفرت الفلوس مين من دول العالم هتبيع لنا سلاح وذخيرة نحارب بها حليفتها اسرائيل<br />الاتحاد السوفياتى وانتهى دورة<br />وامريكا والغرب مش هيبيعوا طلقة واحدة لنا لو عرفوا اننا هنستخدمها ضد اسرائيل<br />يبقى مفيش غير اننا نتمسك بخيار السلام وحتى لو ضربونا على قفانا نطنش ونقول لهم بلاش هزار بايخ<br />فية حل تانى<br />مفيش<br />بس اسرائيل مش هتعدم تلكيكة علشان تضربنا - زى تهريب سلاح لغزة من مصر جاى من السودان وانها عايزة تامن حدودها<br />اى تلكيكة وتفتعل معركة وتاخد سينا زى ما هم بيخططوا<br />هنا بقى يظهر دور الشعب والكفاح المسلح وحرب العصابات وعندك حزب اللة كمثال<br />فيا اسرائيل<br />الشعب المصرى كاتم غيظة واى حماقة هتكون النهاية لدولتك الغبية حينما تبدأ مصر الحرب الشعبية لو حصل اعتداء من ناحيتك"
archived = "2010-03-14"
