[[comments]]
order = 1
subject = "هل نعد الشعب لمثل هذة الحماقات الاسرائيلية"
author = "من زمان"
posted = "2009-03-28"
text = "زمان كان كل الشباب فى المدارس الثانوية بيدرس مادة اسمها الفتوة - وفيها يتم تعليمهم مبادىء العسكرية واطلاق النار<br />وكانت هذة المادة تدرس فى الجامعات - معسكر تدريبى فى اجازة السنة اسبوعين لكل شاب<br />هذة تجعل الشباب اكثر خشونة ومهيئين للخدمة العسكرية ولا يجدون صعوبة عندما يلتحقون فى الجيش<br />وكانوا مدربين بحيث يصلحوا للدفاع الشعبى عند حدوث خطر على البلاد<br />الا نفكر فى اعادتها بعد ان الغاها السادات بعد كامب ديفيد"
archived = "2010-03-14"
