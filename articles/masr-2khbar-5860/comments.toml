[[comments]]
order = 1
subject = "الاقباط أفضل اقلية في العالم"
author = "مش لا.م"
posted = "2007-05-14"
text = "الاقباط افضل اقلية في العالم بلا منازع واللي مش مصدقني يشوف الاقليات المسيحية في العالم عايشين ازاي وعلى سبيل المثال لا الحصر المسيحيين في الهند مثلا ومن جهة اخري يشوف الاقليات المسلمة كيف تعيش في البلاد المسيحية وعلي سبيل المثال لا الحصر المسلمون في الفلبين<br />والمسيحيون في مصر محتاجين النصيحة الا وهي<br />ابعدوا عن اسرائيل<br />ابعدوا عن اسرائيل<br />ابعدوا عن اسرائيل<br />النصيحة التانيه<br />التزموا بموعظة الجبل<br />التزموا بموعظة الجبل<br />التزموا بموعظة الجبل"
archived = "2010-03-14"
capture_url = ""
