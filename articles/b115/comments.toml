[[comments]]
order = 6
subject = "يتنوع الحريق و الدافع واحد"
author = "كريمة"
posted = "2007-02-08"
text = "قد لا تشرق شمس الحقيقة ابدا فوق بلد يتقن قواده فن تسليط الضوء على تسطيح الواقع، فلو انك ترى نشرة اخبار المغرب يظهر لك الوزراء بابتساماتهم العريضة و بطونهم الاعرض و هم يو’كدون ان البلد بخير و ان ما يروج عن الحريق و الاضراب عن الطعام ما هو الا اشاعات من الجيران اعداء السيادة الوطنية، و ان المشاريع في نمو و البلد في ازدهار و ان الرقم قياسي مقارنة مع العام المفرط ، نعم فنحن نسمع نفس الشيئ و لا شيئ يتغير اللهم و جوه تدهب و اخرى تاتي و في الغالب فهم من نفس الطبقة و حتى الاسم العائلي في الغالب ما يتشابه.<br />أناس لم يزورو (البرارك)او دور القصدير و لم يقضو حتى ساعة فيها، اناس لم يجوعو، لم يشعروا بالبرد أو بالحر او بقسوة الحياة، اناس يعيشوا من اجل الوطن في شيئ واحد وهو ارسال ابنائهم الى جامعات دوليه لاخد احسن المراتب في الدولة و بدلك يقولو مادا يريد المغاربة فقد خدمنا الوطن.<br />إن بقوارب الموت او بالدعارة المتفشية في كل امحاء البلاد او بحرق الدات و هو اسمى مظاهر التعبير عن السخط و رفض الواقع المتنكر، كلها اشكال ناتجة عن الاستغلال و مص دماء المغاربة و ان نطقت فسكوتك اما بحلوى عبارة عن عمل في الارشيف او في ادنى سلم الادارة و ان رفضت فالعصا لمن يعصى...<br />املي ان ارى بلدي كالعديد من البلدان التي بدات من الصفر و بامكانيات طبيعية اقل مما لدينا في المغرب ووصلت الى تحقيق الكرامة لمواطنيها لكن بالطبع لان زعماءها تنكروا لدواتهم و اعلنوا مصلحة الوطن فوق كل الاعنبارات ، اما نحن هما زال كل منا يمسك بكرسي السلطة بالايادي و الاسنان و لا يريد لا التنحي و لا حتى التنازل عن بعض ما يعتبره هو حق لا و بل ان حقه هدا لا يكفيه و اظن ان منهم من يسن لنفسه بين الفينة و الاخرى قرارا في زيادة الراتب ناهيك عن المجاملات و التي تصل الى ان يجامل بالملايين...و ابناء البلد من ملت فقد ترك المكان لأخر على راي تاكدة(مات الاول خلى الحليب لخوه و مات التاني نقى حجر امو)."
