text = "السبب فى حريه الشيوخ هى الطياره إللى عماله تروح ماليه جردل الجاز ورمياه على الولعه ,والتاس حاجه تفرح عماليه يهللوا ولاد الايه وفاكريت إن صفوت جوه وكل الناس إللى قرفونا,وحبه ولقيت أبو سيخ ومعاه كام واحد من إللى تاهبينها تازلين تصريحات بأن أم برعى بتاعه الدره هى سبب الحريه ,وتم أخد إعترافها بألصوت والماسوه والفلكه كمان.<br />وعقبال ماتولع كلها ,بس بعيد عن الغلابا باوع الطوابير."
