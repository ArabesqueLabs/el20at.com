[[comments]]
order = 6
subject = "الحشيش"
author = "السياف"
posted = "2008-08-20"
text = "كان فية شوية اعضاء فوق سطح المجلس بيشربوا حشيش وهما بيولعوا الحجر شرارة نطت من الجوزة ومسكت فى السقف الخشبى وانتشرت الحريقة - محدش يجيب سيرة الماس الكهربى - اصل الحشيش غبارة نمرة واحد رجالة الداخلية بيجيبوة من سينا ويوزعوة على الاعضاء علشان يمخمخوا فى قوانين تسد نفس ام الشعب<br />وتسالنى عن اكبر مزور ومحترف تزوير انتخابات فى مصر -هقول لك العادلى - اجدع واحد فى العالم يزور انتخابات ولو واحد مكانة يرمى نفسة من فوق كوبرى قصر النيل<br />حريقة 9 ساعات يا مفترى<br />وعربيات مطافى مفيهاش مية وفيها زمارة بس وسارينة تقلب الدنيا<br />يا عادلى عربيات المطافى تروح عند الحريقة ويكتشفوا ان نصها فاضية ومفيهاش مية يا فضيحتك يا ابلة ظاظا<br />مرفق المياة بعت سيارات تناكر فيها مية<br />وبتوع البترول بعتوا بدل الفوم اللى بيطفى بنزين شعلل الحريقة وعمل انفجارات<br />ياللة خليها والعة علشان العادلى يشوى ذرة - حمام يا مشوى"
archived = "2010-03-14"
capture_url = ""

