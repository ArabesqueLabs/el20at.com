[[comments]]
order = 1
subject = "الاطفاء صورة لاداء الحكومة السىء جدا"
author = "شايف"
posted = "2008-08-20"
text = "هاتوا الجيش وطيارات القوات الجوية والكهرباء ومرفق المياة ورجال الدفاع المدنى واللواءات وكان الاداء قريب من الصفر - النار بترعى الدور التالت وتنزل على الدور التانى ثم الاول - لا احد يهتم - هى كانت بلد ابوة - الدولة اكتر من 6 ساعات عربيات مطافى تخرج وتدخل والنار ترعى براحتها لغاية ما لقتش حاجة تحرقها - وامنيات الناس ان تمتد الى مجلس الشعب المجاور وياريت يكون الاعضاء والحكومة داخلة يولعوا بجاز وسخ مع بعض<br />اداء دولة منهار ورئيس دولة بيحشر اسمة فى كل حاجة كانة بيعمل دعاية لنفسة وسط المصيبة ومذيع قناة النيل يذيع كان الحرب العالمية التالتة هناك عند مجلس الشورى بطريقة دراماتيكية وطيارة جايبة كوزين مية بترميهم من بعيد بعدم احترافية ومن ارتفاع عالى وضغط المياة فى الخراطيم ضعيف جدا<br />صورة مثالية لاداء دولة منهارة وكان ناقص يستعينوا بمثتثمر رئيسى يطفى لهم الحريقة<br />فهم قرفوا الناس بحكاية المثتثمر الرئيسى وياريت وزير المالية او الاثتثمار يفكر يبيع جهاز الدفاع المدنى وبتوع المطافى لخواجة اسرائيلى لتحسين ادائة<br />مهزلة يا بلد"
archived = "2010-03-14"
capture_url = ""

