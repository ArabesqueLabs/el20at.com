[[comments]]
order = 3
subject = "الطيارة ام جردل وسوزان تميم"
author = "بقلظ"
posted = "2008-08-20"
text = "9 ساعات واربعين عربية مطافى وزبابيط وطيارة بترش مية من جردل فوق الناس على الرصيف مش على الحريقة والجيش ومرفق المياة والكهرباء والبترول بعت سيارات ترش فوم وكلة فشل فشلا زريعا لغاية النار ما وقفت لوحدها لما لم تجد حاجة تحرقها<br />وكان هناك الحاج فتحى سرور وصفوت الشريف واحمد عز<br />وعسكرى المطافى اللى من الفجر شايل السلطانية وواقف فى طابور العيش ساعتين علشان يجيب بجنية فول وخمسة ارغفة للعيال ومهدود الحيل هيطفى اية ولية وعلشان مين<br />مش هو دة المبنى اللى بيولع اللى كان بيقعد فية عضو مجلس الشورى هشام مصطفى بتاع سوزان تميم - خلية يولع هنطفية لية - ييجى هشام مصطفى يطفية<br />البلد دى مش بتاع عسكرى المطافى دى بتاع الحرامية يبقوا يطفوها يولعوا فيها علشان يشغلوا الناس عن قصة سوزان والبورصة والفرصة - كلة وارد"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "الداخلية مشغولة بالشنطة والمثلث"
author = "سواق"
posted = "2008-08-20"
text = "الداخلية مشغولة بالشنطة والمثلث ومش فاضيين للحراي9ق والدخان والقرف دة<br />مبنى مكون من 3 ادوار والعسكرى بيوجة المياة من الخرطوم على الحيطة كانة عندة حول وسايب النار ماسكة فى الشبابيك وبيقول لك بيبرد جدار الطوب وسايب الخشب يولع<br />الناس دى اتدربت على اطفاء حريقة قبل كدة والا جايبنهم من وراء الجاموسة مجندين امن مركزى علشان يطفوا حرايق<br />هى كمالة عدد<br />هى مظاهر<br />نفسى اتف فى وش اللى قال حكاية المثلث والشنطة - طيب مين اللى هيعرف يعمل رباط صليبى فى حالة الحوادث<br />يمكن يعدلوا فى قانون المرور ويطلبوا مع المثلث والشنطة كفن لثلاثة افراد علشان يسهلوا عملية الدفن<br />يا داخلية يا داخلية جتك ستين رزية"
archived = "2010-03-14"
capture_url = ""

