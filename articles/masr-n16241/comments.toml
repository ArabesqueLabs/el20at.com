[[comments]]
order = 0
subject = "حراام"
author = "dina"
text = "بما انى خبيره ثانويه عامه لانى دلوقتى فى طب و على الرغم من انى جبت مجموع عالى فى الثانويه العامه الا انى شفت فيها اسوء ايام حياتى ولذلك اؤكد لكم مدى سؤء حاله طالب ثانويه عامه فى الشارع والامتحان شغال و مدى الانهيار العصبى اللى بيبقى فيه"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144157/http://masr.20at.com:80/newArticle.php?sid=16241"

[[comments]]
order = 1
subject = "فال سىء على العيال"
author = "شرارة فى المدينة"
text = "مش مهم سنة<br />يعوضوا السنة الجاية فى الاعادة ان شاء اللة<br />هو بيتحرك كتير اليومين دول لية<br />عايز يبين انة شباب وصحتة زى الفل<br />واللة عارفين<br />بس اقعدوا فى البيت<br />علشان مصالح الناس<br />على فكرة رؤساء المانيا والنرويج والسويد بيلفوا فى الشوارع بعجلة<br />ورؤساء الدول فى الخليج بيمشوا فى الشوارع بيسوقوا عربياتهم بنفسهم ومفيش غير عربية حرس واحدة ماشية وراة وعمرهم ما قفلوا شارع<br />اية عزرائيل يتجول فى المدينة"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144157/http://masr.20at.com:80/newArticle.php?sid=16241"
