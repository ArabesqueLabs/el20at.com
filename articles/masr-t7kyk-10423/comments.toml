[[comments]]
order = 5
subject = "ياريت ناخد العبرة من الانتخابات الديمقراطية"
author = "ترمس العشاق"
posted = "2008-11-06"
text = "لاحسنى مبارك ولا حزبة -- &&& ولاجمال ابتة من بعدة ولا بقايا حزب ابوة && يقدروا يعملوا 1% من حرية الراى والاختيار وفق نظام ديمقراطى بعيد عن الهلس والتزوير المقرونة بالبلطجة والترهيب @ الامريكان السود قبل 30 سنة كان ممنوع يركبوا مواصلات مع البيض او المطاعم بتمنع دخول السود والكلاب ---- انا وجهة نظرى انة رئيس امريكا دة منصب شكلى لانة اللى بيخطط ويدير الاقتصاد والسياسة فى امريكا هما اليهود وبكدة اى حد حيوافق على الاجندة اللى هما عاملينها حينتخبوة رئيس وحيبقى الاداة اللى بتنفذ السياسة اللى هما عملينها بخصوص الاتحاد السوفيتى والعراق وايران وافغانستان @ واقتصاديا تجاة اوروبا واليابان والهند والصين ^^& اما بالنسبة لاسرائيل فخط احمر لكائن من كان انة تسول لة نفسة المساس بامنها اوحدودها من قريب اوبعيد ! والف فيتو وفيتو ولاتنحرج اسرائيل قدام العالم وتبقى غلطانة بعد كل مدبحة او تصرف همجى بعيد عن الانسانية تعملوة فى فلسطين او لبنان @ يعنى بالعربى جية اوباما روح بوش السياسة الامريكية هى هيا لمصلحة اسرائيل دة بالنسبة لمنطقتنا العربية ! اما بالنسبة ليهم انتخاب رئيس اسود معناة انهم دفنوا التفرقة العنصرية فى امريكا للابد وبقوا قدام العالم زى مايقولوا انة امريكا بلد الحريات والفرص والديمقراطية والمساواة"
archived = "2010-03-14"
