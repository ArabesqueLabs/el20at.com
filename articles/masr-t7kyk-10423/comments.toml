subject = "عمل حرية علم مساواة"
author = "أحمد المصري"
posted = "2008-11-06"
text = "مسلم إيه بس!!!<br />ده راجل مسيحي و قالها 7000 مرة.<br />مش دي الحكاية. الحكاية إنه مثال حى على أنه لا يوجد مستحيل (أسود مضطهد في أمريكا من أب مسلم يصبح رئيس لأكبر دولة في العالم).<br />الأمل هو إنه يتجه للسلام عشان الحمار الاسمو بوش دمر إقتصاد العالم كله مش أمريكا بس. أما حكاية فلسطين فدي إنسوها تماما في المشمش لازم يؤدي فروض الطاعة لإسرائيل.<br />عندما نقدر قيمة العمل و الحرية و العلم كما أمرنا الإسلام سوف نتفوق عل أمريكا نفسها أم إسرائيل.<br />لاكن دلوقت طالما نقدر هز البطن و الجهل و التعصب خلينا في طابور العيش و نتنيل."
