subject = "مبروك اوباما حسين اوباما لرئاسة امريكا  - ووضع الا"
author = "بريم"
posted = "2008-11-05"
text = "هل قرأتم التاريخ ؟<br />هولاكو لما غزى بغداد ودمرها واكتسح الشرق الاسلامى<br />اية اللى حصل<br />اسلم كل التتار وكونوا اكبر جيش اسلامى وفتحوا الهند وكونوا اكبر حكومة اسلامية<br />وعندما غزى بوش بغداد<br />اتخرب بيت امريكا<br />وهاهو ابن مسلم كينى يجلس على كرسى الحكم فى اكبر دولة صليبية فى العالم<br />هل اقترب اليوم الذى سيحكم المسلمون فية امريكا ؟"
