text = "انا فعلا رحت صوت لصالح بارك اوباما بصرف النظر عن اللي حصل او السايسه عامه انا فرحت اوي لما حسيت ان الامريكي العادي فرح بفوز شخص اسود المدرسه بتاعت الفصل بتاعي سمراء البشره كانت بتتكلم عن يوم الانتخابات وازاي انها قعدت ساعه ونص مستنيه كل دا عشن تحددد من ريس بلادها ونا لما رحت صوت حسيت ان المسلمين لازم يكون ليهم دور في البلد دي كل واحد مش يتكلم عن نفسه بصيغه me ., I , my myself خلينا نتحرك اكتر المهم لما صوت كان لريس البلديه بتاعت بروكلين ورريس البلاد اللي لفت انتباهي المكنه بتاعت التصويت ازي الازار بتاعتها بتشتغل عشان تمنع الغش ماكنيه مش غاليه الواحد بيفكر لو نزلت مصر حتحل مشاكل كتير من ناحيه التزوير علي العموم الناس كلها هنا فرحانه جدا بفوز اوباما وتنوعت اساليب تعبيره مثللا انلهارده وانا راحيه الفصل الناس عامله تصوت اوباما اوبما yeah ف يكل حته لما جابتلي صداع ...."
