posted = "2008-11-05"
text = "جاى علشان تصلح الاقتصاد اللى خربة الصليبى بوش بتاع حرب العراق<br />جاى تعدل الحال المايل بعد ما خربها اللى قبلك<br />كان مغرور بقوتة لغاية ما قلع هدومة ملط فى العراق وافغانستان وخسر الاف المليارات وضيع امريكا وضيع اقتصاد العالم معاة<br />هتصلح اية<br />وازاى<br />كنا عايزين ماكين ينجح علشان يكمل مسيرة بوش ويجيب عاليها واطيها ويكمل خرابها"
