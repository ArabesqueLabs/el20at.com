author = "اكتب اسمك هنا"
posted = "2007-10-14"
text = "أجمل شئ فى رمضان الدعاء<br />الواحد لما بيدعى لوحده أحيان كتيرة مش بيتأثر وبيكون الدعء معظمه طلبات دنيوية<br />لكن الدعء مع الأمام فى المسجد له طعم تانى خاصة لو كان صوته وأدعيته حلوة ومؤثرة<br />ويا سلام بقى لو كان اللى حواليا بيعيطوا .. ساعتها الجو بيكون حاجة تانية خاااالص<br />ربنا يهدينا جميعا ويتقبل منا... وأكتر دعاء أنا باحبه هو \" رب لا تجعلنا ممن ضل سعيهم فى الحياة الدنيا وهم يحسبون أنهم يحسنون صنعا \""
