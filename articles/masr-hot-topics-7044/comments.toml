subject = "حرام عليكو"
author = "سمر"
text = "حرام عليكو اللى انتو بتقولوة دة على احمد عز انا مش من معجبينة لكنى اكرة ان تتهموا انسان بانة تافة و زانى و بيشرب الخمر على حساب مين الكلام دة بيتقال اتهام الناس بدون و جة حق اتهام باطل انتوا الاول عارفين اية عقاب اللى يتهم انسان بانة زانى و فاسد من غير وجة حق فى الاسلام عارفين يعملوا فية اية ! و قال عاملين نفسكو بتوع ربنا ! سواء كن مع الفن او ضدة ياريت منرميش كلام على الناس اى ناس من غير وجة حق ."
