text = "نفسى اقولك حاجة وتفهمها بجد مش عرفة اتكلم لانى مش عرفة اقلك ايه بس فعلا انتت بجد انسان لا يوجد لك مثيل وانا فخورة جدااااااااااااا ااااااااااااااا ااااااااااااااا اااااااااااا بيك وياريت تشوف رسالتى وتعرف بجد اللى فى قلبى وشكرا وانا من كثيرا من معجبينك وكل سنة وانت طيب برمضان يا مهندس احمد عز"
