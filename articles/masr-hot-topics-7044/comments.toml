[[comments]]
order = 6
subject = "على الرغم من ان مصر بلد فقير لكن سهل الناس الوسخه تعمل فيها ملايين"
text = "على الرغم من ان مصر دولة فقيرة ومن افقر دول العالم لكن سهل الواحد يعمل مليون ورا ملين فيها<br />اهو احمد عز دا واحد من هذه النوعية دخل البزنس من باب السينما وسبقه على سبير المثال لا الحصر الواطي عادل امام<br />كان جربوع وصايع ومش لاقي شغل ومش لا قي ياكل اصبح الان من اكبر بشوات مصر وبعد ما ابتدى يضحك الناس دخل<br />في افلام حقيره وقذره هو ويسرا طبعا التي هي احقر منه<br />الاخ احمد بز دا يبدو انه من نفس النوعية واحد صايغ وهلفوت مثله وهب اتفتحتله طاقة القدر ودخل عالم البزنس السينمائي<br />والمليون حتجري ورا المليون وحيركب عربيات فخمه وحيفتح الشباك ويقول للشعب المصري (وسعوا يا زباله لاحمد عز بيه)<br />تماما زي الكلب عادل امام لما ابنه موت واحد بحادث سياره وطلع منها لانه راجل باشا واللي موته دا مش بني ادم لانه مصري فقير.<br />وانا اشكر موقع عشرينات لانه بيكشف الناس الوسخة باسلوب صحفي ذكي"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023247/http://masr.20at.com:80/newArticle.php?sid=11418"

[[comments]]
order = 7
subject = "أنا عايز أعرف اتجاه الموقع ده بالضبط"
author = "قارئ متغاظ جدا"
text = "أنا لا عارف الموقع ده أخوانى واللا علمانى واللا شبابى والا شيوعى والا والا .. مين بقى ان شاء الله أحمد عز ويحيى الفخرانى وغيرهم االى يتفردلهم كل المساحة دى واللا حتى تكلفوا نفسكم مشقة وتعملوا معاهم حوارات لا طائل منها ولا هدف .. حرام عليكوا اتقوا الله وميزوا موقعكم بقى وخلوا فيه السمة اللى بدأتم بيها من غير (.............)<br />وبالنسبة للى بيقولوا ما حدش يتهم حد بالزنى بدون دليل (امال اللى كان أحمد عز بيعمله فى فيلم مذكرات مراهقة دا كان اسمه إيه \"جهاد\" وما خفى كان أعظم ده اللى بترصده الكاميرا بس قدام الناس أمال فى الكواليس النظام عامل ازاى وما خلف الكواليس أيضا ايه اللى بيحص) استغفر الله العظيم إن بعض الظن إثم"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023247/http://masr.20at.com:80/newArticle.php?sid=11418"

