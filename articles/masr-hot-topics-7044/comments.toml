text = "انا لا اقصد الإساءة للصحفية ولكن فعلا والله شيء مقرف، هذا شخص ما عنده ذرة حياء ولا خجل، ولو تابعناه لوجدناه يشرب الخمر ويزني ومع ذلك يتم تقديمه على انه نجم وقدوة للشباب وعلى انه مليء بالمشاعر والأحاسيس!!!!؟؟؟<br />ولا حول ولا قوة إلا بالله"
