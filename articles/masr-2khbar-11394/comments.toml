order = 0
subject = "مفيش تعليم فى المدارس اطلاقا -- واهالى الحى ناس غل"
author = "من الوراق"
posted = "2009-02-24"
text = "الناس غلابة يا بية<br />بالعافية يقدروا يشتروا الاكل والشرب ومفيش فلوس لعيالهم ياخدوا بها دروس خصوصية<br />فاتورة المية بقت عشر اضعاف سعرها الاول وفاتورة الكهرباء بتشفط فلوس الناس والاكل والشرب ومفيش فلوس للدروس الخصوصية<br />والمدارس زى ما انت عارف<br />مدرس الالعاب بيدرس انجليزى ومدرس معاة دبلوم زراعة بيدرس رياضيات ومدرسة خريجة تجارة بتدرس رياضيات<br />كلة هيصة<br />والواقع مؤلم جدا<br />يعنى تقدر تقول مدارس بيكانوفاسا احسن من مصر"
archived = "2010-03-14"
