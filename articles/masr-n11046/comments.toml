[[comments]]
order = 0
subject = "طيب ادوني عنوانها ورق تليفونها"
author = "مش لازم"
text = "هي بتقول المعاسكات لا تضايقني<br />لان مفيش واحد زيي عاكسها لحد دلوقتي<br />ادوني عنوانها ورقم تليفونها وانا افرجها المعاكسات بصحيح"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821124504/http://masr.20at.com:80/newArticle.php?sid=11046"

[[comments]]
