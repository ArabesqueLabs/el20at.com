[[comments]]
order = 2
subject = "يا حبيبتى يا مصر"
author = "ارابيسك"
text = "ههههههههه<br />يعنى جت على نظرة المعجبين الغلابة تضايقهم<br />ما هى الهانم فى السينما الكل نازل فيها تفعيص و مش بتضايق<br />جرى اية يا بشر"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821124504/http://masr.20at.com:80/newArticle.php?sid=11046"

[[comments]]
order = 3
subject = "بابا جه"
author = "خايفة من بابا"
text = "الى موقع عشرينات بصراحة انتم عملتولى مشكلة جامده جدا فى البيت وبابا افتكر انى دخلت على موقع اباحى اصلة مر من جانبي بالصدفه وانا فاتحه التعليقات فوجد الفاظ بصراحة صعبة جدا فأرجو من موقع عشرينات ان يفعل مثل اى موقع اخر وتمر هذه التعليقات على رقيب بصراحه لان لو استمريتوا فى كده هتخسروا قراء كتير ولما بابا سألنى هو مش ده برضو موقع عشرينات قلتله اه فقاللى خلاص متفتحوش تانى خالص والنبى والنبى خلى التعليقات تمر على رقيب الاول لانى بحب عشرينات اوى ومش هقدر مفتحوش"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821124504/http://masr.20at.com:80/newArticle.php?sid=11046"

[[comments]]
order = 4
subject = "الى الامورة الحلوه اللي فوق"
text = "خلاص يا حلوه يا اموره ما تفتحيش عشرينات تاني وحد في البيت<br />لما بابا وماما يخرجوا من البيت او ينامو ابقي افتحيه<br />لحسن موقع عشرينات دا عيب خالص<br />المعلقين اللي فيه اولالات الادب بيقولوا كلام عيب خالص كل كلامهم للكبار فقط"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821124504/http://masr.20at.com:80/newArticle.php?sid=11046"

[[comments]]
order = 5
subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
text = "انا شايفه ان سميه نجمه تمثيليا اما ف الغناء و ف الازياء انا بقول تدى العيش لخبازه احسن<br />مفيش شك كمان ان جمالها ليه دخل كبير ف نجاحها و حب الناس ليهاو انا منهم بس ف الاونه الاخيره لاحظ الجميع عليها الغرور و لو بكلم سميه هقولها بلاش لان الغرور بيقتل حب الناس"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821124504/http://masr.20at.com:80/newArticle.php?sid=11046"

[[comments]]
order = 6
subject = "لما المواقع المحترمة بيحصل كدة امال الاباحية بيحصل اية؟"
author = "الفارس الشجاع"
text = "الى الاخت الخايفة من بابا لما تدخلى الموقع هنا ابقى غمضى عنيكى وانتى داخلة وكذلك بابا لحسن قلة الادب بقت على ودنة اليويمن دول انتى جاية على موقع محترم زى عشرينات وتقولى علية هيعمللك مشكلة امال المواقع الاباحية هتعملك اية بقااااااااااااااااااااااااااااااا؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821124504/http://masr.20at.com:80/newArticle.php?sid=11046"

[[comments]]
order = 7
subject = "سمية الاسكندرانية"
author = "شرين منصور..معلقة دائما."
text = "السلام عليكم ..سمية خشاب بنت اسكندرانية جميلة بجانب انها ممثلة ممتازة خاصة انها ابدعت في فيلم خيانة مشروعة ومشوارها الفني حافل بالأعمال اللي كانت بتضيف لتاريخها غير انها انسانة رقيقة جدا ..الموضوع رائع يا استاذ محمود ..اما بالنسبة للبنت اللي خايفة من باباها انا مش عارفة اقولك ايه يعني باباكي قرا الشتيمة ومقرأش الموضوع ويحكم على الموقع انو اباحي من شتيمة على رأي اللي كتب التعليق لما بابا وماما يناموا تبقي تفتحيه ..وعلى فكرة القراء عارفين عشرينات وموضوعات عشرينات حيبدؤا ميفتحوش الموقع لما يلاقو المواضيع بتاعتهم هايفة وهما الحمد الله مواضعهم جامدة جدااااا وبتكتب باسلوب محترم وحنفضل نفتح عشرينات مهما اتكتب في التعليقات.."
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821124504/http://masr.20at.com:80/newArticle.php?sid=11046"
