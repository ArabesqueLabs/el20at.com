[[comments]]
order = 0
subject = "الحكومة مش نايمة دى تخطيط حكومى يا جاهل"
author = "جار سوزى"
posted = "2008-06-08"
text = "الحكومة عايزة تشغل الناس بقضايا بعيد عن طوابير الخبز وغلاء الاسعار وتوريث السلطة<br />تقوم تبعت شوية بلطجية يضربوا شوية نصارى واهى فرصة ويقبضوا على شوية اخوان والجرايد تكتب والرأى العام ينشغل بقضايا جانبية<br />الدولة عارفة دبة النملة ومين اللى بيكح من البرد واللى بيكح من شرب الجوزة<br />بس برضة الناس مش اغبية"
