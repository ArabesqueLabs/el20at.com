[[comments]]
order = 1
subject = "الاقباط دول طايفة فاشله وطمعهم هو اللي وداهم في دا"
author = "مش ححبك"
posted = "2008-06-08"
text = "الاقباط دول شوية حمير وطماعين وما يهمهمش غير الفلوس<br />يعني مثلا كل الناس عرفت الاقباط في مصر محلات الدهب ومحلات عصير القصب<br />فاصبحوا في المرمى اي حد عايز يعمل حاجه ي الاقباط على طول على محلات العصير ومحلات الدهب<br />ودا دليل على ان الاقباط دول ليسوا مصريين دول من اصول غربية<br />ما يحبوش يبقوا فقرا ابدا لازم تلاقيهم اغنية زي الغربيين تماما<br />يشتغلوا في اي حاجه تجيب فلوس<br />حتى في المدرسين يشتغلوا مدرسين رياضيات وانجليزي<br />عمرك شفت واحد قبطي مدرس جغرافيا ولا تاريخ<br />دايما تلاقيهم في الشغل المظبوط علشان خاطر يبقوا اغنياء مثل الغربيين تماما وهذا يدل على عروقهم تنتمي الى اصول غربية<br />انتهى"
archived = "2010-03-14"
