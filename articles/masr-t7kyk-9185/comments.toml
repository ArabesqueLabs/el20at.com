[[comments]]
order = 1
subject = "أنتشار متنوع"
author = "محمد عبد العاطي"
posted = "2008-05-28"
text = "النوع المختلط دا من المكتبات بداء في الأنتشار .. بدايته كانت من أكتر من سنتين مع كتب خان في المعادي وديوان في الزمالك وبعدهم زين في المعادي..<br />وخرجت المكتبات من كونها مجرد مكتبات لبيع وشراء الكتب او حتى المكتبات العامة للأطلاع ..<br />أنما تنوعت ودخل عليها متطلبات ترفيه أخري .. زي الاكلات السريعه والمشروبات أو مكان لعقد الندوات والهويات .. في وقت مفيش مكان مناسب لأي من الأشياء دي<br />ونلاقي دا يقترن مع فكرة عامة إن القرأه في حد ذاتها ضمور وأنقراض نلاقي المشاريع والأفكار النابعه للشباب وحتى إن كانت بهدف شبهة أستثماري للربح من نشاط محبوب بالنسبة ليهم فهو في أتساع .. ودا بيعكس بعد لأتجاه شريحة واسعه من الشباب ليه بس بشكل مختلف<br />الموضوع مهم جداً إلقاء الضوء عليه يا أميرة"
archived = "2010-03-14"
capture_url = ""

