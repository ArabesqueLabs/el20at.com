text = "فتحها عمر .. وحررها صلاح الدين .. فمن لها الآن ؟؟؟<br />إنه لمن سابع المستحيلات .. بل، إنه معجزة بأن ترى شخصاً يضاهي قوة وبسالة القائد صلاح الدين الأيوبي ..<br />هذا لا، ولن، ولم يحدث لافي زماننا الذي نعيشه .. ولاحتى بعد أن نموت !! لإنه وبكل بساطة \" أصبحنا ضعفاء وأغبياء بنفس الوقت \" ..."
