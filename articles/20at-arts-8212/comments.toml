subject = "انهض ياصلاح"
author = "M.H"
posted = "2008-02-19"
text = "انهض يا صلاح انهض يابن الايوبيين انهض من نومتك هذة لقد طالت علينا غيبتك متى ستنهض وتفيق من هذة الغيبة فكم نحن محتاجون اليك في تلك الايام كم هانت انفسنا على اعدائك انهض فلقد ضاع كرامتنا وقل عزنا واهنا في بلدنا انهض نحتاج يا بن الايوبي نحتاج الى البطل فلينهض الان او نموت الى الابد فلم يتبقى لنا شئ بعد هذا الذل والضعف والهوان انهض وخذ بايدينا فنحن محتاجون اليك الم يان الوقت لكي ينهض بيينا الايوبي لابد وان ينهض فليقم كلا منا بالاستعداد لنهضتة فلقد اوشك الوقت عن قريب عن قريب عن قريب فلنستعد"
archived = "2010-03-14"
