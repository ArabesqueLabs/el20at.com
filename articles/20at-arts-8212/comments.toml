subject = "الجنرال غورو : عدنا ياصلاح الدين"
author = "عابرسبيل"
posted = "2008-02-10"
text = "عندنا احتل الفرنسيون سورية بعد الحرب العالمية الأولى بفترة قليلة ركل الجنرال الفرنسي غورو قبر صلاح الدين بقدمه قائلاً: \"هاقد عدنا ياصلاح الدين .\" ثم رحل الصليبيون الجدد بحمد الله ولكن هذا الموقف تذكرة بأن الغرب صليبي ولو سمى نفسه علمانياً ."
