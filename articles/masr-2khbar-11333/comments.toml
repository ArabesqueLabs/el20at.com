subject = "شباب ضايع بيبحث عن دور لغياب المشروع القومى"
author = "اكتب اسمك هنا"
posted = "2009-02-18"
text = "دى افعال شباب بيشعر بالضياع<br />فقدان الامل والمستقبل والحلم - بيخلية يدور على اى بطولة خارج الحدود - واللى بيعملوة العيال دول انهم بيطلعوا لسانهم لبتوع امن الدولة - هية هتعملوا اية ؟ احنا هنا اهو<br />هو اسبوع شباب الجامعات وبتوع لجنة السياسات للحزب الوطنى كانوا هناك الاسبوع اللى فات<br />طيب عملوا اية"
