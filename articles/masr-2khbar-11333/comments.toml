order = 1
subject = "هكذا الإخوان"
author = "خادم الدعوة"
posted = "2009-02-18"
text = "هؤلاء الشباب وليسوا العيال .. هؤلاء الرجال نعم رجال فهم من تكلموا قبل غيرهم وما ادخروا جهدا يوما ما لنصرة الإسلام فى أى مكان إلا وفعلوه وحاولوا أن يشاركوا فى أسبوع شباب الجامعات ولكن أبت القيادات الأمنية ذلك ورفضوا أن يشارك أى طالب من الإخوان فى أى فاعلية من فاعليات ذلك الأسبوع ..... إنه فعلا ليس بشباب ضائع ولكنه عرف منهجه وطريقه وبدأ يتحرك بوضوح وثبات مهما كانت العقبات التى تواجهه"
archived = "2010-03-14"
