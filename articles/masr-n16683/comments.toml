subject = "لا ايران"
author = "فهد"
text = "بسم الله مع ان نختلف مع السادات كثيرا ولكن لا نرضى بايران ولا اى دولة تسى الية وايران بلذات دولة الشيعة الذين يكرهون مصر واهلة كرة عظيماء"
