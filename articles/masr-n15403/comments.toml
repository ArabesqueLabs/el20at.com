subject = "ابو لهب مبارك"
author = "انسان"
posted = "2008-04-23"
text = "قلة ادب<br />قرأت فى القرأن<br />( تبت يدا ابى لهب )<br />فأعلنت وسائل الاذعان<br />( ان السكوت من ذهب،)<br />احببت فقرى - لم ازل اتلو<br />(وتب )<br />ما اغنى عنة مالة وما كسب<br />فصودرت حنجرتى<br />بجرم قلة الادب<br />وصودر القرأن<br />لانة حرضنى على الشغب"
archived = "2008-04-26"
capture_url = "https://web.archive.org/web/20080426023857/http://masr.20at.com:80/newArticle.php?sid=15403"
