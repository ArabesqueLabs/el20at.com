[[comments]]
order = 1
subject = "اين عقول هئلاء الفتيات"
author = "يسرا"
posted = "2008-02-29"
text = "اطن ان الله ميز نا عن حيوانات بالعقل و العقل يستعمله انسان ليميز صح من خطأ يعني ان هؤلاءفتيات ليس اضحياء ما حدث لهم لقد استسلم الي امر بكل قواهم عقلية وبمنتهي رضاهم يعني عليهم تسحمل مسؤوليتهم اما اضحياء هم دالك اطفال الدين يولدون وهم ليس معترف بهم مما يجعله يتحمل مسؤولية اخطاء امهاتهم وتاكد لو طلبتم ابن ان يسامح امه علي فعلتها لن يسامحها بما يعني حتي ام عليها ان تحاسب قانونية علي فعلتها ليس ان تاخد لقب ام عازب وصرف دول مبلغ لاعالتها انكم تساعدنا علي انتشار فاحشة وسط دولة العربية واسلامية."
archived = "2010-03-14"
