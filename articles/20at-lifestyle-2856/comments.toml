subject = "الأسرة و الشهوة هم السبب الرئسي"
author = "youssef"
posted = "2008-04-26"
text = "في نظري أن السبب راجع إلى التربية الأولية , و هي التربية الأسرية بحيت إذا كانت الأسرة محافظة فالبنت ستكون محافظة ,و أما إذا كان العكس فسوف تتعرض البنت إلى مثل هذه المواقف ,صراحه شباب اليوم لا يهمه سوى شهواته و رغباته , و في هذه الحالة ستكون البنت هي الضحية رقم 1 , و لكن بنية تلبية رغباته و ليس الوقوع في مثل هذه الأشياء."
archived = "2010-03-14"
