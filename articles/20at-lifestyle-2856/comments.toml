[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-04-25"
text = "السلام عليكم ورحمة الله وبركاته: أنا أظن أنهم لا ضحايا ولا مذنبات أي أن المتعمدات للخطيئة لا يمكن اعتبارهن ضحايا واللاتي أخطأن لا يمكن اعتبارهن مذنبات فكل واحد منا يخطئ وأنا - أعوذ بالله من كلمة أنا- ورغم أن البعض لن يوافقني أرى أنه من الجيد جيدا أن تتكقل الدول بهذه الشريحة المهمشة في المجتمع فمن غير المعقول أن نتهم كل الفتيات ونغاقبهم فكل واحدة ولها ظرف منها الجتماعي- النفسي والاقتصادي وحتى أن بعضنا -أي انني أجمع نفسي مع كل الفتيات- قد نسقط في مثل أخطاء كهذه -و العياذ بالله- نتيجة الثقة فيمن نحن معهم فلا يجب اتهام اي احد بل يجب نشر التوعية واصلاح من أخطأوا وأرجو ان لا نحكم عليهن قبل النظر في قضيتهن وان كنت انحاز قليلا في رايي لهؤلاء فمعذرة ولكنني مكلفة بتقديم بحث لمثل هؤلاء الامهات وحسب ما علمته هناك من كانوا ضحايا ليس الا فمنهن من تمادت في خطئها وهي هنا ليسة ضحية ومنهن من حاولت الاستغفار والتوبة رغم خطيئتها الاولى وارجو معذرتي لإطالتي الا انه ومتل مابنقول في مثلنا الجزائري - مـا يحس بالجمرة غير اللي كواتو- والسلام عليكم ورحمة الله تعالى وبركاته أختكم ميمي امولة من الجزائر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
