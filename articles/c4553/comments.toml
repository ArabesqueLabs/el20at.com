[[comments]]
order = 0
subject = "إلي مني سليم"
author = "محمد السيد"
text = "لو كل مرة حتكتبى بالأفكار والروح ... و الإسلوب ده ....<br />يبقي مش حنعرف نكلمك بعد سنة ولا اتنين ........<br />من زمان أوي ...مستوقفنبش موضوع للتفكير ... سواء لربط الأفكار .. أو للخيال اللي فيه .... أو إني أعيد قرايته أكثر من مرة ... أو حتي إني أفكر في اللي سمتيه \" لحظة خاصة\"بتمر بكل واحد مننا .<br />أهنيكى علي اللحظة ...<br />أهنيكي .. عاي إسلوب الكتابة ....<br />أهنيكي علي الاقتراح الرائع .. وإن كان عايز شوية توضيح ....<br />أهني عشرينات علي وجود الأفكار دي ... والشخصيات والأذهان دي فيها ..<br />وبرضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707211323/http://www.20at.com/newArticle.php?sid=4553"

[[comments]]
order = 1
subject = "العكس هو الصحيح.."
author = "وسام"
text = "عندما قرات مقالك وجدت إن فلسفة زكريا ومنطق تفكيره كان أعلى من موقف خالد وليس العكس..<br />زكريا خد قرار التصوير بناء على حس رسالة وموقف مسؤولية حيال هدى.. أما موقف خالد فكان انتهازي..<br />طبيعي بعد كده إن خالد يشعر بتأنيب الضمير فيساعد الولد.. وأن يشعر زكريا بالفخر فيهدي الصورة..<br />لكن لحظة التلاقي بين النموذجين الحقيقي والافتراضي كشفت إنك مش بس مشروع صحفية شديدة.. إنتي مشروع روائية أشد..<br />مبروك على هذا المقال"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707211323/http://www.20at.com/newArticle.php?sid=4553"

[[comments]]
order = 2
subject = "ارحمينا يامنى"
author = "طارق"
text = "انا بصراحة مش عارف منى سليم دي ايه والله العظيم انا مبفهمش اي حاجة من موضوعاتها متفلسفة كده وعايزة تعمل نفسها بتفهم وبتحط كلام ورا بعضه وخلاص ربنا يستر علينا والنبي ياست منى ترحمينا من مووضعاتك الرخمة دي<br />اما بقى الاخ محمد السيد فالظاهر انه صاحبها ولا يعرفها مبنشفش تعليقه يعني الا على مووضعاتها<br />ايه الكوسة دي حتى هنا كمان الواحد يطفش يعني ولا يعمل ايع"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707211323/http://www.20at.com/newArticle.php?sid=4553"

[[comments]]
order = 3
subject = "معاااااااايا"
author = "منى"
text = "ياجماعة انا معايا موبايل تااااااااااااااااااااااامر حسنى<br />قلبى وروحى وعقلى وكلى<br />واللهى العظيم معايااااااااااااا<br />واللهى لو تامر شافنى هيتجوزنى انهاردا قبل بكرة"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707211323/http://www.20at.com/newArticle.php?sid=4553"

[[comments]]
order = 4
subject = "قارئة"
author = "قارئة"
text = "بجد برافو مقال جميل ومتميز ، وفيه حس أدبي واضح ، أنا أنصحك إنك تكتبي قصص ولو قصير كبداية ثم تنتقلي لكتابة الراوية،<br />وعلي فكرة أجمل حاجة في الصحفي كتابتة بحس أدبي ، وإنتي أسلوبك راااااااااااااااااااااااائع، انتي دائما متجددة في أفكارك ، وبتعرفي تعرضيها صح ، وفقك الله إلي الخير دائما ، رفع من شأنك ويسر لكي الخير حيث كان ، وأرضاكي به.<br />برااااااااافو بررررررررافو بررررررررررررررافو.................. قارئة"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707211323/http://www.20at.com/newArticle.php?sid=4553"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "الطحاوي"
text = "اود ان اسجل اعجابي الشديد بالموضوع فهو من المقالات النادرة التي يجد فيها العمق الممتزج بالتشوق والجراءة مع نزعة عالية نحو التصوف مع الاشياء تصوف بطعم التوحد من الظاهرة وليس الابتعاد بادعء الموضوعية وما اعجبني وقلمك الوقاع والرصاد وعباراتك المشدودة لاسيما في المقدمة ...عموما ان سعدت بالموضوع والى الامام"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707211323/http://www.20at.com/newArticle.php?sid=4553"

[[comments]]
