subject = "انت الاصل اسفه اني شكيت فيكي"
author = "بسمه بجد"
posted = "2008-04-23"
text = "مني انا بحب فلسفتك جدا لانها عميقه وده من زمان يمكن مكنتش اقدر اميز زمااااااااااااااااااااااااااان اذا كنتي انتي الاصل بس انا الوقتي متاكده تماما من انك الاصل<br />يا ريت تفهمي اد ايه انا معتزه بمقالاتك وكتاباتك يا واحده من أرق أوراق الشجر واسرعها ذوبانا في الطبيعه<br />سلاااااااااااااااااام"
