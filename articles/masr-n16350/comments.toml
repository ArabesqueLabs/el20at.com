author = "هع"
posted = "2008-06-19"
text = "اللى اختشوا ماتوا<br />وانا ارشح بطاطا ابو زعزوعة رئيسا لمنظمة الشذوذ العالمى كى يرتقى باسلوبها وطرقها<br />وبعدين انا خايف ليروح اسرائيل ويرجع حامل"
