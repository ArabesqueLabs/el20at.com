[[comments]]
order = 0
subject = "رئيس منظمة الشذوذ العالمية"
author = "هع"
text = "اللى اختشوا ماتوا<br />وانا ارشح بطاطا ابو زعزوعة رئيسا لمنظمة الشذوذ العالمى كى يرتقى باسلوبها وطرقها<br />وبعدين انا خايف ليروح اسرائيل ويرجع حامل"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151051/http://masr.20at.com:80/newArticle.php?sid=16350"

[[comments]]
order = 1
subject = "نكته"
author = "مش رضوى حسن ولا مروى صلاح"
text = "واحدة سألت واحدة<br />هي فاروق حسني تبقى اخت سعاد حسني<br />قالت لها لا<br />دي واحدة ودي واحدة تانية خالص"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151051/http://masr.20at.com:80/newArticle.php?sid=16350"
