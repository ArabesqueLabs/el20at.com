subject = "سيأتى يوم الخلاص"
author = "المعتصم بالله"
posted = "2008-04-18"
text = "سيأتى يوم الخلاص ، هكذا يقول التاريخ فأن دوام الحال من المحال و ما طار طير و ارتفع الا كما طار وقع فقد وصل النظام الفاسد الى اعلى منحنى الفساد و البطش بالشعب المصرى الفير المطحون البائس العاطل الضائع احلامه المنهوبه ثرواته فى بطون اللصوص رجال السلطه و رجال الاعمال فقد حدث زواج غير شرعى بين السلطه و المال انجب سفاحا هذا الفساد الذى فتك بنا و بقدراتنا و أصبح المناخ ملائم لقيام ثوره شعبيه و التغيير قادم مهما ابى الظالمون فالى متى سننتظر بعد كل ما أصابنا من كوارث فى العبارات و قطارات تنقلب و مسارح تحرق و عمارات تنهار و امراض و فشل كلوى و سرطانات فلا أكل نظيف و لا مياه أدميه و لا سكن متوافر و لا عمل موجود و أن وجد لا تكفى مرتباتنا نصف الشهر فى ظل الغلاء و جشع التجار و فساد موظفى التموييتن المرتشين و فساد المحليات فكل شىء فى هذه البلد أصبح مؤلما موجعا فمعا نحن شباب مصر للتغير و ما اخذ بالقوه لا يسترد الا بالقوه فقد اخذوا حريتنا و ثرواتنا و كرامتنا و آدميتنا فماذا ننتظر ؟"
archived = "2010-03-14"
