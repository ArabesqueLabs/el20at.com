order = 0
subject = "وكنت سعيدة منذ البداية لترشيحي لتمثل أمام نجم بحجم محمد سعد،"
author = "مش كاتب"
text = "ايش يطلع محمد سعد دا راخر<br />واحد صايع وجربوع ومش لاقي شغل وكل راس ماله شوية حركات بشفايفه وجسمه<br />وطبعا الشعب المصري بيحب التفاهة والهيافة نجح محمد سعد واصبح مشهور<br />تماما مثل عادل امام خريج زراعة فاشل وعلشان خاطر بيعرف يعمل شوية حركات نط على التمثيل ومشيت معاه زي الاسهال<br />وخلي الشعب المصري كده عمال يتفرج ويتفع لشوية الصيع والحرامية دول<br />والله يكون في عون المعتقلين والمسجونين والمضروبين والمسرطنين والمكسحين وبقية الشعب"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030839/http://masr.20at.com:80/newArticle.php?sid=17196"
