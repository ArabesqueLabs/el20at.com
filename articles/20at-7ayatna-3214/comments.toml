text = "مهما اختلف الزمان<br />يبقى الحب كما كان<br />تعاد قصة قيس وليلى<br />ولكن اختلفت الأسماء<br />للأحبة لغة في العيون<br />تبرق فتضيئ المكان<br />تعزف القلوب الحان<br />لايسمعه إلا شخصان<br />ينطق الفم بأحلى الكلام<br />لأنه قرأه في العينان<br />ترتجف الأبدان<br />لأنها لامست دفء الأحضان<br />صمت وحنان<br />مع سمفونيت دقات القلبان<br />الحب عنوان<br />لايقيده زمن ولا مكان<br />الحب قوة مغنيطيسة<br />لا يفهمها إلا الحبيبان"
