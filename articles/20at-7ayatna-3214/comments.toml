[[comments]]
order = 67
subject = "احلى نكت ليبيه"
author = "رائف محمد"
posted = "2008-06-29"
text = "1 - سكران صلي بروحه فاتته ركعة .<br />2 – واحد خاطم من الشارع يسمع في التخبيط طاق طيق واصل لي راس الشارع القي الجماعة يلعبو في كارطة بالزينقو .<br />3 – واحد سكران طينة امعكس في الشارع في الليل القي سوداني شاد شكاير كناسة قاله ربي يصون .<br />4 – في شيباني ليبي مشي من سيربح المليون مشي سأله جورج قرداحي قاله من حاي معاك .... الشيباني قاله أمي ... مشي قاله جورج قرداحي عنجد أمك ... ( يعني بجديات ) قاله الشيباني عنجد بوك .<br />5 – واحد طاح من فوق الحيط قالوله جاتك سليمة قاللهم قوللها اتخش المربوعة توا انجي .<br />6 – سكران طاح من فوق عمارة قالولله لابس شنو صار قاللهم و الله ماني عارف حتى اني كيف واصل .<br />7 – واحد قالت له الابلة ارسم فيل مشي ارسملها نقطة قالت له وين الفيل يا فرخ .. قاللها ما تشوفيش فيه جاي من بعيد .<br />8 – في واحد مصري مشي للجزار قاله اعطيني لحمة بجنيه قاله الجزار هاك الحس الشيتة .<br />9 – واحد ماشي في الطريق و عنده بيجو القي واحد عنده مكسمة مشي قاله شنو رايك انديرو افاري .. قاله صاحب المكسمة تي شنو تحسابني خروف انبدل مكسمة بي بيجو .. قاله صاحب البيجو هادي فيها سر مشي ضرب علي الكوفني طلع مارد قاله برا جيب شاهي و كاكوية ... مشي صاحب المكسمة فرح .. بدلو لي بعضهم .. روح صاحب المكسمة بالبيجو قالوله اهله يامهبول اتبدل مكسمة بالبيجو .. قاللهم هاذي فيها سر ضرب علي الكوفنو جاه المارد قاله جيبلي 2 ليبو و 1 مكسمة .. قاله المارد أسف اختصاصي شاهي و كاكاوية بس .<br />10 – مراءة ليبية مشت من سيربح المليون مشي علقت في سؤال طلبت استعانة بصديقة .. اتصل جورج قرداحي : الوو أخت فاطمة .. معاك جورج قرداحي من برنامج من سيربح المليون .. قاتله و النبي سكر من غير تسهويك .<br />11 – فيه ابلة تشرح للطلبة درس الاتحاد قوة مشي نوضت طالب اسمه ابو عجيلة .. قالت توا بنعطو لي ابو عجيلة عصا وحدة بكسرها .. طربق ابو عجيلة العصا .. قالت توا بنعطوا ابو عجيلة عصاتين مع بعض .. طربق ابو عجيلة العصاتين .. بعدين قالت توا بنعطوا ابو عجيلة الحزمة كلها مايقدرش يكسرها .. مشي طربق ابو عجيلة الحزمة كلها .. قالت له فلقت الدرس يا ابو عجيلة<br />انشاء لله ما دهشتو من ضحك<br />السلام عليكم ورحمة الله وبركاته،،"
archived = "2010-03-14"
capture_url = ""

