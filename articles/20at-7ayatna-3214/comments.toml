[[comments]]
order = 71
subject = "تلات فتيات يدخلن المسجد بملابس السباحه"
author = "رائف محمد"
posted = "2008-07-03"
text = "ثلاث فتيات يدخلن المسجد بملابس السباحة أنضروا ماذا حصل<br />ثلاث فتيات دخلن المسجد بملابس السباحه انظروووو ماذا فعل الامام !<br />وقد حدثت تلك القصة فى احدى المدن الامريكية<br />قبل عدة سنوات<br />أما البداية فكانت كالآتي:<br />ثلاث بنات أمريكيات طائشات يظنن أنهن يتمتعن بحياتهن وحريتهن ومراهقتهن ويفعلن كل ما يحلو<br />لهن بدون أي رادع أو وازع سواء أكان ديني أو اجتماعي فبالنهاية هن يعشن في مجتمع غريب<br />الأطوار فاسد إن لم يكن للفتاة صاحب أو إن لم تخرج للملاهي الليلية وتشرب الكحول وترافق<br />الشباب وكل ما هب ودب ، إن لم تكن الفتاة تفعل ذلك فاسمع أقاويل الناس عنها وذمهم لها وبأنها<br />غريبة الأطوار وأنها ليست طبيعيه<br />فعلا مجتمع غريب<br />وفي يوم من الأيام كانت هذه الفتيات الثلاث كالعادة ------ كانوا يريدون الذهاب للبحر وقد لبسن<br />ملابس السباحة الخليعة وفي طريقهم إلى البحر كانوا يتسكعون في الشوارع من شارع إلى آخر حتى فجأة دخلوا شارعا ووجدوا فيه؟<br />احزر يا عزيزي القارئ ماذا وجدوا؟<br />وجدوا مسجدا ولكنهن استغربن ولم يعرفن ما هذا فسألوا من حولهم في الشارع فقالوا لهن هذا مسجد للمسلمين<br />ولكن ذلك لم يكن ليغري فضولهن بعد فنزلوا من السيارة وقرروا الدخول إلى داخل المسجد ليروه<br />من الداخل ويروا ماذا يفعل المسلمين داخله<br />وبالفعل فقد دخلن المسجد الآن يا إلهي كانت الناس داخل المسجد تصرخ !<br />ما هذا ثلاث فتيات بملابس السباحة داخل المسجد! يا للهول<br />وثارت الضجة داخل المسجدأما الفتيات فلم تكترثن فقد كن تربين هكذا على عدم الاكتراث<br />واللا مبالة<br />أما بالنسبة لإمام المسجد فقد اشتظ غيظا فكان يحاول ويحاول أن يطرد الفتيات من المسجد ويهدد<br />بأن يتصل بالشرطة لطردهم ولكن لا حياة لمن تنادي<br />فالفتيات ما زال الفضول يأكلهن ويريدون أن يبقوا في المسجد ليروا المسلمين كيف يصلون<br />ما الحل الآن؟ ماذا يفعل الإمام؟مع العلم بأن الإمام كان من النوع المتزمت جدا<br />أما الإمام فقد رفض أداء الخطبة ورفض أن يصلي بالناس ما دامت هذه الفتيات شبه العاريات هنا<br />في المسجد وترك المسجد بالذي فيه بالمصلين الذين لم يؤدوا الصلاة والفتيات الثلاث وذهب إلى البيت<br />وزادت المشاحنات الآن ما الحل؟<br />الإمام تركهم وذهب ،هل يستطيعون عمل أي شئ فالإمام نفسه لم يستطع حل المشكلة وذهب وتركهم لحلها<br />وفي هذه الأثناء خرج من المصلين رجل عاقل فصار يتحدث مع الفتيات ويريد أن يحل المشكلة لا أن يعقدها أكثر مما هي معقدة0فأقنعهن بالرجوع إلى الوراء والجلوس وراء المصلين في آخر المسجد لأنهن لم يرضين أن يخرجن فهن يريدون أن يشوفوا كيف يصلي المسلمين وماذا يفعلوا وماذا يقولوا<br />وبالفعل رجعن إلى الوراء أما هو فأخذ يخطب بالمصلين ومن ثم أقاموا الصلاة وصلوا<br />أما الفتيات اللواتي ظنن بأنهن سينتهي فضولهن بانتهاء رؤيتهم الصلاة فكن مخطئات فعلى<br />العكس فقد زاد فضولهن وصرن متشوقات ليعرفن المزيد عن الاسلام فكان هذا الرجل العاقل في<br />مكان المناسب وفي الوقت المناسب فتحدثوا مع بعض وكانوا يسألوه ويرد عليهم فإذا بهن يسلمن<br />نعم لقد أسلمن !!!! يا سبحــــــان الله لقد أسلمن و من الله عليهن بنعمة الاسلام ويسر في طريقهن ذلك الرجل الذي حل المشكلة بعقله وتفكيره السليم فلم يكن متزمتا عصبيا"
