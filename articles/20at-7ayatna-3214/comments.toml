text = "فقدنا شوفتك .....سكتنا<br />فقدنا صوتك ...... تحملنا<br />بس نفقد رسايلك ما تعودنا<br />أبنتظر يوم وشهر أبنتظر عام ودهر أبنتظر كل العمر<br />لاجل اشوفك يا قمر<br />اقول : اللي خلقك خلق مليون غيرك<br />بس والله كلهم<br />ما يسوا رمش عينك<br />لحبك في قلبي ثلاث جبال<br />جبل شوق جبل لهفة جبل ارميك منو لو تنساني<br />لا تحسب كل من غاب عن العين غاب عن الخاطر والله وحشتونا والقلب صابر<br />لو تسمح قبل ما تنام اعطي للقمر خبر عشان يطلع وينور بدالك يا قمر<br />اذا بتحس انو رجليك بوجعوك!!!!! هدا من كتر ما بتروح وتيجي على بالي<br />لو حبك تجارة كان العالم خسران<br />تدري ليش ؟؟؟؟؟<br />لان من يشتريك ما يرضى يبيعك<br />الحب لا يقتل ولكنه يعلق بين الحياة والموت"
