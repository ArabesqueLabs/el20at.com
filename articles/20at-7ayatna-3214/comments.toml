author = "سنو"
posted = "2008-08-26"
text = "انا مشكورة على الموضوع انا بس اقول ان الشباب مو فاهمتهم اذا البنت ضحكت او كلمت يسموها قليلة التربية واذا تحتشم يقلولها هذه البنت مو استايل طبعا انا مع البنات في الجهتين اقول بس سؤال هذا تقبلوه في اختكم ؟<br />انتم اصلا انانيين ماتفكرو كان مرحكم ولا في شرف البنت"
