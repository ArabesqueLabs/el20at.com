text = "انا شايف يا اخوانى اننا كلنا شعب اسلامى واحد ويجب اننا ما انضيعش وقتنا فى كلام يا اخى عن البنات فى مصر او فى ليبيا ان كنت تنظر الى ما حرم الله الله فانت وشانك ولا داعى بان تتنشر هذا الموصضوع على صفحات الانترنت الا اذا كان هذا الموضوع به فائده تفيد العالم الاسلامى باجمعه وتذكر دائما بانك ستحاسب على ما تقوله. انا مصرى احترم كل فتاه مسلمه محترمه فى نفسها فى دينها ويكفى ان اليبيات لم تصل الى ما وصله المصريون من انحراف اننى اعيش فى منطقه فى مصر اتخيلها بانهاواحده من مناطق الفسق وبالرغم من ذلك بانها لا توجد بها اى فسق فالفسق الذى اقصده هو الملبس اصفه بانه شاز مما يوحى بحزن شديد فى نفسى باننا نذداد فقرا يوم بعد يوم مما يحدث من هؤلاء رحمنا الله من هؤلاء فى مكان فى العالم"
