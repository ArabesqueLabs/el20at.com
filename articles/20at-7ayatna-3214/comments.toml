subject = "من سبب فى معاكسة بنت ام شاب ؟؟؟"
author = "رائف محمد"
posted = "2008-06-29"
text = "نحن نعاني في مجتمعاتنا مشاكل كثيرة ومن أهمها مشكلة المعاكسة...<br />هذه المشكله التي نعاني منها في مجتمعاتنا وبالذات في الفترة الاخيره<br />حيث اصبح الشباب يهتمون بالمظاهر الخارجيه الكاذبه التي بعضها تدل<br />على عكس امكانيات الشاب ولكن يتعمد هذه المظاهر للفت انتباه الفتيات..<br />هذا غير تعمد بعض الفتيات ان تبالغ في زينتها عند ذهابها للمحلات التجاريه و الاسواق<br />ومنهم صغيرات السن التي لم يتجاوز عمرها الرابعه عشر ولكن اصبحت تنتبه<br />لهذه الامور لما تشاهده وتسمعه سواء من قريبات او من زميلات و صديقات ...<br />اخواني لو ان الشاب راى فتاتا محترمة محتشمة مؤدبة ..........<br />هل يستطيع ان يضايقها أو يعاكسها ؟؟؟؟؟؟؟<br />من السبب في المعااكسه البنت ام الشــــــاب ؟؟؟؟؟؟؟<br />سؤال يسئل نفسه وارجوا منكم ان تردوا عليه"
archived = "2010-03-14"
capture_url = ""

