[[comments]]
order = 70
subject = "قصة حب ابكت العالم بأسره"
author = "رائف محمد"
posted = "2008-06-30"
text = "بسم الله الرحمن الرحيم<br />اسعد الله ايامكم بكل خير .......! ! !<br />اضع بين ايديكم هذه القصه الواقعيه والتي ابكت العالم :<br />وركزوا وعيشوا اللحظات لانها قصه اروع من الخيال ..<br />== دارت احداث هذه القصه باليابان بين كل من شاب وفتاه يعشقان<br />بعضهما عشقا رهيب لم يكن له مثيل ولا شبيه ..<br />== وكان هؤلاء العشيقان يعملان في استديو لتحميض الصور<br />((هذه البدايه والآن تابعوا القصه ))<br />كان هاذان الشابان يعشقان بعضهما الآخر لحد الموت وكانوا دائما<br />يذهبون سويا للحدائق العامه وياخذون من هذه الحدائق ملجأ لهم من<br />عناء تعب العمل المرهق في ذلك الاستديو ..وكانوا يعيشون الحب<br />باجمل صوره ..فلا يستطيع احد ان يفرقهم عن بعضهم الا النوم ..<br />وكانوا دائما يلتقطون الصور الفوتوغرافيه لبعضهم حفاظا على ذكريات هذا<br />الحب العذري ..<br />وفي يوم من الايام ذهب الشاب الى الاستوديو لتحميض بعض الصور<br />وعندما انتهى من تحميض الصور وقبل خروجه من المحل رتب كل شيء<br />ووضعه في مكانه من اوراق ومواد كيميائيه الخاصه بالتحميض لان حبيبته<br />لم تكن معه نظرا لارتباطها بموعد مع امها ..<br />وفي اليوم التالي اتت الفتاه لتمارس عملها في الاستوديو في الصباح<br />الباكر واخذت تقوم بتحميض الصور ولكن حبيبها في الامس اخطأ في<br />وضع الحمض الكيميائي فوق بمكان غير آمن ..وحدث مالم يكن<br />بالحسبان بينما كانت الفتاه تشتغل رفعت رأسها لتاخذ بعض الحوامض<br />الكيميائيه وفجأه..وقع الحامض على عيونها وجبهتها وماحدث ان اتى<br />كل من في المحل مسرعين اليها وقد راوها بحاله خطره واسرعوا<br />بنقلها الى المستشفى وبلغوا صديقها بذلك عندما علم صديقها بذلك<br />عرف ان الحمض الكيميائي الذي انسكب عليها هو اشد الاحماض قوه<br />فعرف انها سوف تفقد بصرها تعرفون ماذا فعل ؟؟!!لقد تركها ومزق كل<br />الصور التي تذكره بها وخرج من المحل .. ولا يعرف اصدقائه سر هذه<br />المعامله القاسيه لها !!ذهب الاصدقاء الى الفتاه بالمستشفى<br />للاطمأنان عليها فوجدوها باحسن حال وعيونها لم يحدث بها شيء<br />وجبهتها قد اجريت لها عملية تجميل وعادت كما كانت متميزتان بجمالها<br />الساحر ..خرجت الفتاه من المستشفى وذهبت الى المحل نظرت الى<br />المحل والدموع تسكب من عيونها لما رأته من صديقها الغير مخلص الذي<br />تركها وهي باصعب حالاتها ..حاولت البحث عن صديقها ولكن لم تجده<br />في منزله ولكن كانت تعرف مكان يرتاده صديقها دائما ..فقالت في<br />نفسها ساذهب الى ذلك المكان عسى ان اجده هناك ..<br />ذهبت الى هناك فوجدته جالسا على كرسي في حديقه مليئه<br />بالاشجار اتته من الخلف وهو لايعلم وكانت تنظر اليه بحسره لانه تركها<br />وهي في محنتها ..وفي حينها ارادة الفتاه ان تتحدث اليه ..<br />فوقفت امامه بالضبط وهي تبكي ..وكان العجيب في الامر ان صديقها<br />لم يهتم لها ولم ينظر حتى اليها .اتعلمون لماذا ؟؟هل تصدقون ذلك<br />ان صديقها لم يراها لانه اعمى فقد اكتشفت الفتاه ذلك بعد ان نهض<br />صديقها وهو متكأ على عصى يتخطا بها خوفا من الوقوع ....<br />اتعلمون لماذا ؟؟..اتعلمون لماذا اصبح صديقها اعمى ؟؟اتذكرون عندما انسكب الحامض على عيون الفتاه صديقته ؟؟اتذكرون عندما مزق الصور التي كانت تجمعهم مع بعضهم ؟؟؟<br />اتذكرون عندما خرج من المحل ولايعلم احد اين ذهب ؟؟؟..لقد ذهب صديقها الى المستشفى وسال الدكتور عن حالتها وقال له الدكتور انها لن تستطيع النظر فانها ستصبح عمياء ...اتعلمون ماذا فعل الشاب؟؟!!! لقد تبرع لها بعيونه.!!. نعم ...لقد تبرع لها بعيونه وفضل ان يكون هو الاعمى على ان تكون صديقته هي العمياء لقد اجريت لهم عمليه جراحيه تم خلالها نقل عيونه لها ونجحت هذه العمليه ...<br />وبعدها ابتعد صديقها عنها لكي تعيش حياتها مع شاب آخر يستطيع<br />اسعادها فهو الآن ضرير لن ينفعها بشيء !!! فماذا حصل للفتاه عندما<br />عرفت ذلك وقعت على الارض وهي تراه اعمى وكانت الدموع تذرف<br />من عيونها بلا انقطاع ومشى صديقها من امامها وهو لا يعلم من هي<br />الفتاة التي تبكي وذهب الشاب بطريق وذهبت الفتاة بطريق آخر ..<br />يا الهي !!!هل من الممكن ان يصل الحب لهذه الدرجه !!!!!!!!"
archived = "2010-03-14"
