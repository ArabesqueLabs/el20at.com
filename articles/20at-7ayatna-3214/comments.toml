text = "1- كل ما تذكرت ... عمري ما ذكرت الا وفاك...<br />ولو ادون ذكرياتي... ما طبع فيها سواك...<br />انت<br />اوفى من لقيته زدت عن هذا وذاك....<br />لا تقول اني نسيتك او افكر في جفاك...<br />لو تمنيت الاماني ما طلبت الا لقاك<br />2- رجواي ....يظل وجودي بقلبك مثل ما كان<br />و مناي .... احيا معك رفيق لاخر العمر<br />3- شفت المطر افتح ايدك واجمع اللي تقدر عليه<br />وشفت اللي جمعته هذا شوقك لي<br />تبي تعرف شوقي لك باقي المطر<br />هي كل اشواقي لك<br />4- ان كان كل الكون له( شمس ) تضويه ...<br />انت ضيا دنياي يا كل كوني !!!<br />5- عقبك الدنيا عساها ما تكون ...<br />واشحلاها غير شوفك يا غرااام..<br />يشهد الله مسكنك وسط العيون ...<br />وانك اول من صحي فيها ونام..<br />لو تبي من عمري ايامه تموون ...<br />فدوتك عمري ولا فيها كلام..<br />0922516002/0917546002/0217243944"
