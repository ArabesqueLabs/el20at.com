text = "0922516002 0 امسيك بريح الورد والوانه واحبك بقلب أنت عنوانه و اغليك بروح لك ولهانه<br />· أرسل حمامة سلام بفمها وردة غرام من الولهان لاغلى واعز إنسان<br />· صباح الغلا والمعزه صباح الحب في كل حزه يا أغلى وأحلى من أعزه<br />· يا عيون المها عيونك ذبحتني نظرة فيها على طول هدتني و للطبيب عدل ودتني<br />· أسامر فيك أفكاري ويطري بالهوى طاري و أقول : مساء الخير يا غالي<br />· أحبك وأفهم ظروفك وأنا عيني تبي شوفك أحبك لو تجافيني ونار الشوق تكويني<br />· صباحك نرجس وعنبر صباح أحلى من السكر صياح العطر والكادي صباحك مسك ومبخر<br />· احبك موت يا لغالي احبك بكل ما فيني احبك دون كل الناس وغيرك ما تهيالي<br />· وشولن أبحب غيرك و أنت تدري بي لا قالوا أسمك أشوف الموت و أحيابك احبك يا زهر عمري يا عطر الورد في لونه احبك ليش ما تدري وحبي ليه تخونه ·0m217243944"
