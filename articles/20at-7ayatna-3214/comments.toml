posted = "2009-10-10"
text = "تتميز لبنان وكما يعتقدون بأنها البلد المتحضر عن غيره من الدول العربيه ..<br />وعرض المايوه اصبح سمه من سمات هذا البلد ... فكل يوم جمعه .. تطل علينا اجمل وانعم الفتيات بلباس المايوه .. الذي يظهر الكثير من اجزاء جسمها ان لم يكن كامل الجسد ..<br />الغريبه في مسابقة جمال لبنان ان الاب والاخ هم من يشجهون بكل قوه ويحضرون الحفل لرؤية ابنتهم بذلك اللباس الخليع ..<br />سؤالي ... هل تعتقدون انه سوف يأتي يوم من الايام وتقام مسابقة في احدى دول الخليج والملكات خليجيات وعلى نفس النظام من لبس مايوه والرقص باحضان الرجال ؟؟؟؟<br />ولاسيما ان اكثر جمهور تلك المسابقات هم من الخليج ... والذين ينفقون الكثير في التصويت ...<br />تحياتي للجميع ... كتبت هذا الموضوع وانا اشاهد هذا البرنامج ...<br />__________________"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203025126/http://www.20at.com:80/20at/lifestyle/3214.html"

