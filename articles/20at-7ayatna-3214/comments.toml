posted = "2010-01-18"
text = "6- إيه احبك ..<br />من حكى لك ..<br />انك انت في حياتي ...<br />شخص عادي لا تصدق يا حياتي..<br />من حكى لك ..<br />اني لوساعه نسيتك في غيابي ....<br />لا تصدق يا عذابي ..<br />لو زعلنا من بعضنا وكنت انا قاسي بعتابي...<br />ومن عنادي قلت انك شخص عادي ...<br />قولي كذاااب ما تقوى بعادي ....<br />7- الطيب بين الناس كاسب ومكسوب ...<br />وانا الذي من طيب حظي كسبتك...<br />اهل الخليج واحد وعشرين مليون ...<br />و انت تساويهم ولو كنت وحدك !!!<br />8- مثل ما يموت الليل في مشرق الصبح ...<br />يموت همي لا سرحت وذكرتك!!!<br />9-الصاحب اللي له في ضميري محبه ...<br />ارسله الاشواق جمله وتفريق ..<br />الله ينور له حياته ودربه ...<br />و يسقيه مما ن حلو العسل صافي الريق ...<br />تشتاق له عيني و قلبي يحبه...<br />وله منزلهمن دون كل الخلايق"
