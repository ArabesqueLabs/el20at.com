text = "مــــــــــــــ ــرحـــــــــبـ ـــــا<br />حبت انقل لكم هذه الشعر واتمنى انها تنال لاعجابكم<br />ربما عجزت روحي ان تلقاك<br />وعجزت عيني ان تراك ولكن لم يعجز قلبي ان ينساك.<br />اذا العين لم تراك فالقلب لن ينساك .<br />احبك موت… لا تسألني ما الدليل<br />ارايت رصاصه تسأل القتيل .<br />ربما يبيع الانسان شيئا قد شراه<br />لكن لا يبيع قلباً قد هواه .<br />لا تسألني عن الندى فلن يكون ارق من صوتك<br />ولا تسألني عن وطني فقد اقمته بين يديك<br />ولا تسألني عن اسمي فقد نسيته عندما احببتك.<br />كنت انوي ان احفر اسمك على قلبي<br />ولكنني خشيت ان تزعجك دقات قلبي.<br />أن يأست يوما من حبك وفكرت في الانتحار<br />فلن اشنق نفسي او اطلق على نفسي النار ولن القي نفسي من ناطحة<br />سحاب لاني اعرف وباختصار ان عينيك اسرع وسيله للانتحار."
