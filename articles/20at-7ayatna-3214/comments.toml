[[comments]]
order = 77
subject = "مشاكل عطيفيه"
author = "امحمد"
posted = "2008-07-13"
text = "مــــــــــــــــرحـــــــــبــــــا<br />حبت انقل لكم هذه الشعر واتمنى انها تنال لاعجابكم<br />ربما عجزت روحي ان تلقاك<br />وعجزت عيني ان تراك ولكن لم يعجز قلبي ان ينساك.<br />اذا العين لم تراك فالقلب لن ينساك .<br />احبك موت.... لا تسألني ما الدليل<br />ارايت رصاصه تسأل القتيل .<br />ربما يبيع الانسان شيئا قد شراه<br />لكن لا يبيع قلباً قد هواه .<br />لا تسألني عن الندى فلن يكون ارق من صوتك<br />ولا تسألني عن وطني فقد اقمته بين يديك<br />ولا تسألني عن اسمي فقد نسيته عندما احببتك.<br />كنت انوي ان احفر اسمك على قلبي<br />ولكنني خشيت ان تزعجك دقات قلبي.<br />أن يأست يوما من حبك وفكرت في الانتحار<br />فلن اشنق نفسي او اطلق على نفسي النار ولن القي نفسي من ناطحة<br />سحاب لاني اعرف وباختصار ان عينيك اسرع وسيله للانتحار.<br />لا ثقه لدي الا عينيك فعيناك ارض لا تخون<br />فدعني انظر اليهما دعني اعرف من اكون.<br />لماذا لماذا طريقنا طويل مليء بالاشواك<br />لماذا بين يدي ويديك سرب من الاسلاك<br />لماذا حين اكون انا هنا تكون انت هناك.<br />لو كان لي قلبان لعشت بواحد وابقيت قلبا في<br />هواك يتعذب.<br />انا احبك حاول ان تساعدني<br />فإن من بدأ المأسا ينهيها<br />وإن من فتح الابواب يغلقها<br />وإن من اشعل النيران يطفيها.<br />تحياتي للجميع الرقم 0925288043"
archived = "2010-03-14"
capture_url = ""

