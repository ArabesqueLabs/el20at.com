text = "لا ثقه لدي الا عينيك فعيناك ارض لا تخون<br />فدعني انظر اليهما دعني اعرف من اكون.<br />لماذا لماذا طريقنا طويل مليء بالاشواك<br />لماذا بين يدي ويديك سرب من الاسلاك<br />لماذا حين اكون انا هنا تكون انت هناك.<br />لو كان لي قلبان لعشت بواحد وابقيت قلبا في<br />هواك يتعذب.<br />انا احبك حاول ان تساعدني<br />فإن من بدأ المأسا ينهيها<br />وإن من فتح الابواب يغلقها<br />وإن من اشعل النيران يطفيها.<br />تحياتي للجميع الرقم 0925288043"
