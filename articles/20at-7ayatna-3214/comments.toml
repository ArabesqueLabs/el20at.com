text = "الحب<br />تجربه وجوديه عميقه تنتزع الانسان من وحدته القاسيه البارده لكي!!!<br />تقدم له حرارة الحياه المشتركه الدافئه<br />تجربه انسانيه معقده وهو اخطر واهم حدث يمر في حياة الانسان!<br />لانه يمس صميم شخصيته وجوهره ووجوده فيجعله يشعر وكانه ولد من جديد<br />هو الذي ينقل الانسان الى تلك الوحدات الضائعه من!!<br />الطهارة والنضاره والشعر والموسيقى لكي يستمتع<br />بعذوبة الذكريات الجميله<br />وهو كالبحر حين تكون على شاطئه يقذفك بامواجه بكرم فائق يستدرجك<br />بلونه وصفائه وروعته<br />ولكن حين تلقي بنفسك بين احضانه لتبحث عن درره يغدر بك ويقذفك<br />في اعماقه ثم يقذف بك وانت فاقد الاحساس …<br />واخيراا…<br />فالحب اسطوره تعجز البشريه عن ادراكها الا لمن صدق في نطقها ومعناها<br />الحب يقراء والحب يسمع والحب يخاطبنا ونخاطبه ويسعدنا ونسعده<br />وهو عطرا وهمسا نشعر بسعادته اذا صدقناه في اقوالنا وافعالنا<br />بالحب تصبح الحياه جميله لكي نحقق اهدافا قد رسمناها ولكن !!!!<br />مايقلق العاشقين فقط هو احتمال ان تكون الاقدار تخبىء لهم فراقا<br />لم يكن في حسبان اي منهم<br />انا احب ممكن حل انا غير قدر علي الكلام مع البنت الي احبه ممكن حال 0925288043"
archived = "2010-03-13"
