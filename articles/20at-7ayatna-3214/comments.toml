posted = "2009-10-01"
text = "السلام عليكم جميعا......أنا مجدي فيتور، 27 سنة من بنغازي.....نبي انقول ان الأسباب الرئيسيه للمعاكسه هي : ( قلة الدين - قلة الأدب - قلة إحترام النفس - قلة احترام الغير) وإن الشخص العربي المسلم اللي ينابش _ في نظري_ قد إنسلخ من هويته العربيه المسلمه وأصبح (شيء آخر)....وهابا عالمتزوجين................وأنا نزعل واجد لما إنحق بنت تتجاوب لما ذئب ينابشها، لأنها حتى هي أصبحت أنثى ذئب وهذا بسبب قلة الأشياء المذكورة أعلاه.....و أظف عليها قلة الوفاء للأشخاص المتزوجين.......لحظة،،،عندي تصحيح: نبي نستخدم مصطلح ( إنعدام) بدل من (قلة) مع الأسباب المذكورة آنفا........................الله يهدي الجميع"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203025126/http://www.20at.com:80/20at/lifestyle/3214.html"

