[[comments]]
order = 103
subject = "جهلة ومغرورين وكسالي"
author = "واحد من اسيادكم"
posted = "2008-08-07"
text = "انتم يا شعب ليبيا مجرد شوية بقر تنتقدوا المصريين فقط لحاجتهم وقبولهم العمل معكم وتنسون انهم هم اللي وقفوا معكم في الحصار الأمريكي وتحدوا الأمريكان وكانوا يهربوا البضائع والمواد الغذائية لكم ولما حد يسألكم تقولو بفلوسنا -شوية بقر-وتقولوا نحب التوانسة اكتر طبعا ما انتم ماتعرفوش منهم غير الحريم التونسيات اللي ماليين الشوارع وتقولوا المصري ما لوش اصل مع إن تركيبتكم فيها اصول مصرية كتيير واسالوا اهل بنغازي وفيه كمان ليبيين كتير من اصول افريقية<br />اثيوبيين واريتريين وسودانيين »أسيادكم« وصوماليين »الطوارقة« مع انكم انتم اللي تزعلوا لما نقول احنا فراعنه وتتصيدوا لنا الاخطاء وما تعرفوش من الحضارة المصرية غير شارع الهرم والنساء وفرغلي بتاع العصير ..<br />صدقت كلمة أم كلثوم لما جت غنت بليبا وقالت لكم : » فاضل لكم &--1633;&--1632;&--1632; سنة عشان تتساووا ببقر مصر «<br />عموما هانت فات خمسين سنه وباقي خمسين تاني عشان نقدر نقول لكم يا شوية بقر أبيض"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221010/http://ana.20at.com:80/20at/7ayatna/3304-4858.html"

[[comments]]
order = 104
subject = "الى المصري الي مداير روحه من الاسياد"
author = "امورة بنات ليبيا"
posted = "2008-08-18"
text = "الى واحد من اسيادكم والله حني العرب كلنا زي بعضنا وين ما مشينا زي بعضنا فابلاش من هي كلمة اسيادكم في النهاية نحن مسلمين وتجمعنا كلمة الاسلام وتعبير علي كلمة بقر هده كلمة مش في قاموس العرب الاخوة المسلمين حسب فهمي نعرف الكلمة هادي بس لما نمشي لي حديقة الحيوان وكان انتو يامصريين ساعدتونا ايام الحصار الامريكي فانتو جايكم الدور من امريكا فاحني ياسر متحملينكم بي جميع اخطائكم في بلادنا ليبيا ولو انها زي ماتقول بلد المنحطين<br />علاش انتو تسافرولها وتشتغلو فيها قعدتو في بلادكم الحلوة في جنب الناس الطيبة ههههههههههه.كلمة اخيرة مرة تانية اعرف علي من تتكلم واوزن كلامك لان لو تقدر في نعمة ربي مفروض اتقول الحمد لله ومتنساش بناتنا احسن واشرف بنات<br />مش زيكم الجواز العرفي بدي زي السلام عليكم عندكم يامصرين ومتنساش من اختك المسلمة في اي مكان في الصالح وفي الطالح وحسب كلامك نعتبرك من طالحين بلادك يامصري!!!!!!!"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221010/http://ana.20at.com:80/20at/7ayatna/3304-4858.html"

