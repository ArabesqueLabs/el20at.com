[[comments]]
order = 109
subject = "مفيش  داعي"
author = "ليبي  غيور"
posted = "2008-08-26"
text = "السلام عليكم يا شباب ليبيا ويا اخواننا العرب والمسلمين<br />وشكر خاص الى اختنا هبة على موظوعها القيم والدي يبحت عن مناقشة هده الازمة وحلها او تقليصها<br />احب ان اقول ان الاخت هبة قالت جانب سيئ عن شباب ليبيا وهده الصفة توجد في كل الشباب في العالم<br />وعن ليبيا احب ان اقول تعالو وشوفو كرم وطيبة اهلها واصالتهم نحمد الله ونشكره لأننا مجتمع محافط وتقل فيه الرديلة بعكس المجتمعات الأخرى وهدا الشيئ لا ينكره احد .......<br />والزين والشين في كل مكان يا عني كل بلد فيها الصالح والطالح<br />وعن نفسي اقول لكم اني احب مصر وكل بلاد العرب لأنني احس بلأنتماء لهم وهدا ليس غريب لأننا اخوة في الاسلام<br />ولا يوجد داعي للمشاحنات ولا نكترت لما يقول من بعط السفهاء<br />اسف للأطالة عليكم<br />تقبلو مروري وتحياتي<br />ليبي غيور"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221010/http://ana.20at.com:80/20at/7ayatna/3304-4858.html"

