posted = "2010-02-11"
text = "ياخاطري غلطان في تفكيرك تحساب يرجوا فيك دارو غيرك.ياخاطري ضنك خايب.ناسك جفو دارو خلاص حبايب.خساره سنين الشوق فيهم ذايب وخسارة الكلام الحلو في تعبيرك.<br />ما يوجعك جرح الغريب تنساها وألا ترده.أللي يوجعك جرح الحبيب وقسوته ملامه وصده والدنيا أيقولو مكاتيب مرات يسر ومرات شده وماعيب خاطي العيب هو خونت أصحاب موده<br />خليك بين الناس فاعل خير والعمر مهما طال راهو قصير..خليك ديما صافي كيف العسل للناس حلو وشافي..لاتهين غيرك لاشر أتكافي مهما حصلك من أقليل الخير..ولا أتبع من باعك ولا تتكبر وللقول الصايب دوم حضر..وخليك للمحتاج حاضر كيف الزهر في موسمه يتناظر.<br />خارج نطاق التغطيه ياساده عزيز باعني ومارن في ميعاده..ليش رخاني..وخارج نطاق التغطيه خلاني.<br />أيقول نتركه أيعاود حنيني ثاني..نلقاه منشغل كالعاده خارج نطاق التغطيه ياسده.<br />العظم ينكسر ويعيب لاكن يبره ألا كسرة الخاطر مصيبه غبره..العظم ينكسرويعيب ويجبر ويبره علي أيدين طبيب ألا كسرة الخاطر أدير الشيب..تخلي كبير القدر يبكي بعبره.<br />ساكن خاطري وأحساسي ياما ورد عطشان قاصد كاسي ومن بئر حبه بالحنين سقاني ومازال عطفه في الغرام أساسي ومازلت ألغيره مانوالف ثاني"
archived = "2010-03-13"
