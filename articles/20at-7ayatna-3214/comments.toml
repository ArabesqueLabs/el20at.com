text = "يا جماعة الخير كل بلد فيه زين وفيه شين<br />بس احب اقول ان ليبيا بلد معروف بكرمه واخلاقه<br />بلد العروبة والاصالة , وبناته معروفات بالحشمة وشبابه عروبي وكله شهامة<br />وانا معجبة بالشعب الليبي الكريم , عسى الله يوفقكم يا احلى ناس<br />تحياتي لكم<br />الاماراتية"
