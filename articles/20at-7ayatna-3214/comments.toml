text = "لا تبكي ولا تشكـي أبـد ولا تنـوح<br />تـرى مـا كـل الخطـى مسـمـوح<br />أخطي علـى كيفـك لاكـن شـوف<br />مـن بيعـدك فــي يــوم صـديـق<br />ويـوم أنجـرف فيـك الأحـسـاس<br />لـيـه تتهمـنـي بـعـدم وجـــوده<br />لا تبلـى عـلـي والبـلـى فـيـك<br />وترى الحس من عرفتك وهـو جافيـك<br />الخطـى مـنـك فـيـك ومتبلـيـك<br />عفـانـا الله مــن شــر بـالاويـك<br />مرتاح أنـا قـد مـا يطـول غيابـك<br />لا تحسبنـي مشغـول أفـكـر فـيـك<br />أبـد مـا جيـت عـلـى بـالـي الا<br />فــي الشيـنـه صــدق أطـريـك<br />ما كذبت هاذي وصوفك مـو خيالـك<br />ولا تحسبني لفرحك فرحان حتـى لـو<br />تبسمتلك البتسامه في وجه أخيك صدقه<br />ونت يمكن الصدقه مـا تجـوز عليـك"
