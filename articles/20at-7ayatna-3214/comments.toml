text = "نسأل الله ان يدوم علينا بالنعمة والعافية في مدينة مصراتة والحمد لله احني مازلنا محافضين علي عاداتنا وتقاليدنا وعرفنا وهدا ايضا ينطبق علي بقية المدن الليبية الحبيبة والبنت الليبية والحمد لله مزالت بخير ويجب علينا انا انحافظ علي بناتنا زي ما الواحد يحافظ علي قنينة الزجاج وكان الزجاج تكسر شنو يصلحه خلاص تفسد الحكاية كلها"
