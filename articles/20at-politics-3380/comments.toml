subject = "هى إيه الدول أصلا"
author = "أيمن"
posted = "2007-03-08"
text = "معلش يا براء، أعذر جهلى وأعتقد جهل أغلب اللى حيقروا المفال، هو إيه مؤتمر باريس تلاتة ده أصلا وأنهى دول شاركت فيه، وهل نفهم من اسمه إن كلن فيه باريس 1 و 2 كمان؟<br />أنا رغم إنى بتابع الأخبار مرة كل يوم ولا اتنين لكن يا إما أنا جالى زهايمر، يا بث قناة الجزيرة عندنا تايوانى"
