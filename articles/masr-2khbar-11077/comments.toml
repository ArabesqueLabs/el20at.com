text = "عارفين مين بطل هذه المسيرة الاخ الركن رفعت السعيد رئيس حزب التجمع والذى أخذ يتملق مبارك وعبقريته التى انقذت حدود مصر الشرقية وأمن مصر من التيارات المتأسلمة قليلة الادب وحمى مصر من الخوض فى معارك مع الصهيونية بسبب الرعاع الفلسطينين .. وزاد من التملق الى حد اثار غيرة اعضاء الحزب الوطنى وكرهوا رفعت الذى حاول ازاحتهم من فوق الحجر الاعظم ليتربع هو"
