text = "القرضاوي دا عايز يركب طيارات وينزل في الفنادق الخمس نجوم وبس<br />هو دا اللي يعرف يعمله<br />وحسني مبارك يقابله ليه وحسني مبارك حيعملوا ايه<br />فيه عقد بينه وبين اسرائيل بخصوص سيناء ما يقدرش يتجاوز بنوده<br />حيعملوا ايه يوسف القرضاوي"
