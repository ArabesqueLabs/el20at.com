text = "هاذا اللي فلحتو فيه .. إنكو تطلعو أفلام ورابات بدل ما إنتو قاعدين ماكلين خرا وهوا من اليهود .. والله عالم فايقه ورايقه ..<br />ع العموم .. انا ما بتمصخر عليكو .. لأنو المصخره أحسن منكووووووو ..روحوا شوفو شعبكو ماكل خرا .. وأنتو قاعدين هونه .. راب وأغاني ومابعرف شو ؟؟؟<br />تحياتي ،،،<br />محمد نواف"
