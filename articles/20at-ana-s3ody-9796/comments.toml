subject = "لوين رايحين"
author = "عربي"
posted = "2008-08-06"
text = "لا يوجد حتى الان اية فرقة لاغانى الراب فى نابلس<br />تنظمه مؤسسة صابرين الفنية الفلسطينية بتمويل من الممثلية الدنمركية لدى السلطة الفلسطينية.<br />وهذا نوع من النضال السلمي.\"<br />وابدى سامح زقوت مغنى الراب من الرملة إعجابه بالمواهب وقال هناك مواهب كثيرة وطاقات بحاجة الى من يفجرها.<br />وقالت يانا اندرسون المراحل اللاحقة للمشروع تشمل تنظيم مسابقة على تلفزيون فلسطين لغناء الهيب هوب مثل البرنامج الشهير سوبر ستار،<br />والله شي بقشعر البدن يعني الواحد ما بيعرف كيف يعبر او كيف يبدا ما بدي احكي عن الراب والهيب هوب اللي كلنا منعرف انو طلع من الشوارع الامريكية وانو لازم ييكون فيه كلمات بزيئة وخلينا بموضوعنا الاساسي,<br />انو امتى بدنا نصحى ونفهم انو المدسوسين هالايام مو بس من برى بيجوا وكمان عم ينشوا من جوا.<br />انو اذا الفلسطيني في الداخل اللي موجود بخط الهجوم الاول تارك ونسيان او متناسي النضال لكن شو العتب على اللي برى ان كان فلسطيني او عربي.<br />شو العالم هالايام مصاب بالزهايمر لحقو ينسوا سياسة الدنمارك وشو عملت بالمسلمين وهلا صرنا نتبع عاداتهم.<br />وصار بدهم يعلمونا كيف النضال وكيف لازم نحرر بلدنا وسموا نضال سلمي.<br />وانو هاد سامر ابدا اعجابه بالمواهب والطاقة اللي بدوا يفجرها على طريقة الغرب وحمار اللي بيفكر انو الغرب سال عن عربي او مسلم (اسف للسب).<br />وطبعا لانو الغرب بهموا قضيتنا بس طبعا على طريقتهم صار بدهم يدعموا هي المواهب يا استاذ سامر وبدهم يساوو سوبر ستار .<br />طيب هي الشعب الفلسطيني عندوا سوبر ستار وفرق فيها شباب وبنات ومبسوطين بيغنو وبيرقصوا والله مو مصدق انو هالشعب ملعون ابوه من ستين سنة حتى الان.<br />متى بدنا نفهم انو هالمنضمات الغير حكومية هية للوبية صهيونية بتاخد الشباب من المنضمات الفلسطينية اللي صرلها عم تهري نفس اليهود من ستين سنة ولهلا وبضل هالمنضمات الاوربية توعد الشباب بالشغل والمصاري بدل السكون في المنضمات الفلسطين حتى يحين وقت العاصفة والعمليات الاستشهادية وبالنسبة لاخواتنا في فرق الهيب هوب مين قالهم انو صوتهم مو مسموع ليش قليل العمليات اللي ساوتها اخواتنا الفلسطينيات او ممكن بهم يقدمو مفاجئة او هدية للشهيدة سناء محدلي؟"
