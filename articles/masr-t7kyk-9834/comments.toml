subject = "بتغنى لمين ولمين ياحمام - بتغنى للمصريين فى الطواب"
author = "سلطان الطرب"
posted = "2008-08-10"
text = "مشكلة الناس انها عايشة فى افكارها فى دولة ناصر والا دولة السادات لما كانت الحكومة لها مصانع وشركات وبتعمل دخل للخزينة العامة تقوم الدولة القادرة تزود المرتبات وتعطى علاوات وتعمل دعم للاسعار وتشترى سلاح للجيش وتعمل خدمات للناس<br />انما دولة مبارك باعت كل حاجة واى حاجة تجيب ايراد للخزينة العامة<br />يبقى الدولة هتصرف على الخدمات منين - قالوا علاوة المدرسين ورجعوا فيها واساتذة الجامعات ومفيش زيادة فى المرتبات<br />قالوا الدولة هتبيع المصانع والشركات وتعتمد على الضرائب والجباية من الناس - المصريين بصراحة ما بيحبوش يدفعوا ضرايب<br />تبقى الحكومة تعتمد على المساعدات من الخارج وكمان من التسول من دول الخليج<br />نظام الدولة اختلف تماما عن الاول<br />حكومة ليس لديها اى مدخول مالى محترم<br />مع ارتفاع الاسعار الحكومة قللت الاعتمادات للتعليم والصحة وزودتة للداخلية علشان الامن المركزى وامن الدولة لقمع الشعب<br />يبقى الناس تسكت<br />مفيش زيادة فى المرتبات ولكن سيقترحوا نظام جباية زى المماليك زمان<br />ضريبة على الزواج<br />قانون المرور الجديد للجباية<br />بيع مبنى التلفزيون للوليد بن طلال وبنك القاهرة<br />الدولة فى وكسة<br />واصبح اصحاب رؤس الاموال يحكمون مع لواءات امن الدولة<br />والحالة بدون خطط للتنمية انها رايحة فى ستين داهية<br />وربنا يستر"
