[[comments]]
order = 0
subject = "الاستاذ احمدعدوية جزءمهم منتاريخ الاغنية الشعبية"
author = "سيدقرارة"
text = "عدوية حيتكرم برا مصر زية زى الشيخ امام وبقية اعلام الغناء الشعبى وسلملى على دفن المواهب وتهميش الفنانين"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 1
subject = "ولأنه ابن بلد من الطراز الأول"
author = "مش كاتب"
text = "مين اللي قالك الكلام الفارغ دا<br />ابن البلد المحترم ما يغنيش في شارع الهرم يا ........ استاذه<br />معرفتش اقول انسة ولا مدام فقلت استاذه"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 2
subject = "الأسيوطي بك"
author = "الاسيوطي"
text = "عدويه أكيد حد ظريف جدا وتخرج على اييه اجيال كتير حلوة بس هما الوقتى بيتنكروا ليه مش عارفين ليه ومفيش اغنية شعبيه خالص الايام دي وغابت مع غياب,<br />اللقاء ده لذيذ بجد والأسئلة متنوعه ولا اعرف لماذا تهاجمون كاتبة الموضوع والضيف؟"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 3
subject = "وحشتنا يا عدوية"
author = "دودي"
text = "وحشتنا جدا يا عدوية ياريت ترجع تغني تاني في ناس كتير بتحبك ونفسها تسمع اغانيك القديمة من تاني وعلي فكرة انا متابعة الموقع يوميا وبحب موضوعات مروة عبد الفضيل"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 4
subject = "واللة ولعب الهوى وحنا قاعدين سوى الورد راح هنا والفل جية هنا وبقيت من دة ودة سلطان اهل الهوى"
author = "ام سي هامر"
text = "فيها اية ياناس لما نسمع نجاة وعبدالحليم والست وعبدالوهاب وعدوية دة لون ومزاج لوحدة صوت مصرى بلدى بيتسمع فى كل البلدان العربية ولية جمهورة اللى عتبان علية انة سبنا فترة طويلة من غير مايعمل حاجة تفكرنا باالسح دح وسقف سقف للتورتة وعيلة تايهة ياولادالحلالوغيرة وغيرة"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 5
subject = "احمدعدوية نكهة مصرية سبايسى وفاكهة الفن المصرى"
author = "سعودى"
text = "فية عندنا مثل يقول اللى مايعرف للصقر يشوية واستاذالفن الشعبى احمدعدوية اللى مايبغى يسمع لة يتركة لنا احنا نحبة ونحب اغانية كلها وبعدين انا مستغرب من بعض اللى علقوا على الموضوع وقاموا بطرح مقارنة بين مايقولة احمدعدوية وعمالقة الفن الاصيل لان كل واحد ولة لونة وللمعلومية جمهوراحمدعدوية فى السعودية من جميع فئات المجتمع وكبيروصغير يسمع احمد عدوية وياريت الاستاذاحمد يفاجئنا بشريط جديد على بداية الصيف علشان نسمعة ونستمتع بية واحب اقول للاستاذاحمد لك جمهورك اللى يحبك ويتابع اخبارك فى صحف اومجلات اوتلفزيون اونت وبيدافع عنك وبيدعمك فى كل وقت وزمان لانك اسعدتنا وادخلت البهجة والسرور لقلوبنا باغانيك الجميلة وبنحبك ياعدوية وبنحب اللى يحبك"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 6
subject = "ضربة زى لكشة - نكشة كرمش - عكشة طنش - قلشة اقلش"
author = "قرقشنجي"
text = "اللة على جمال الكلمات ورقتها تيجى اية جنب كلمات اغنية عبد الحليم لست قلبى والا نجاة ايظن - وساكن قصادى وبحبة شفتم رقة كلام عدوية - وخصوصا لما يبدأ الاغنية بذبح الخروف والمرقة ونكشة وكرمش - عدوية وشارع الهرم والسكارى واللى حصل لة مع الكوايتة، المرة الجاية ابقى اعملى تحقيق عن المعددة والولية القرشانة اللى بتقعد على راس الميت وتقول ياسبعى يا جملى وتلطم وتغنى اغانى شعبية حزينة على راس الميتين علشان ما يصحوش تانى ."
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 7
subject = "احمدعدوية اشرطتة معى طول فترة دراستى فى امريكا وكندا"
author = "طارق فهد السويلمى"
text = "عدوية فنان ماراح تعرفونة وتعرفون اغانية ومعانيها الجميلة الا لما تكونوا فى بلد اجنبى وتزهقون من سماع الاغانى الاجنبية والثقافة الاجنبية وتبغوا ترجعوا للاصل انا عن نفسى كل السى دى والاشرطة اللى كانت معاى فنانين شعبيين من السعودية عيسى الاحسائى وبشير شنان ومن مصر الاستاذ الكبير احمد عدوية وحسن الاسمر وشعبولا وعبدالباسط حمودة ومن اليمن الفنان فيصل علوى والفنان ايوب طارش هذول كانوا الحاجة الوحيدة اللى بتخلينى احن واعد الايام والساعات متى الرجوع فاارجو من المحترمين اللى يبغوا يعلقوا على الموضوع ان يستوعبوا ان عدوية تراث حى عايش ربنا يعطية طولت العمر والصحة ويمتعنا بفنة اللى من جد وحشنا كثير كثير"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 8
subject = "احمدعدوية لازم يسوون لة تمثال وشارع باسمة"
author = "واحديحب مصر"
text = "بعض الاخوة المصريين مايعرفوا قيمة الشىء الالما يروح عدوية تاريخ ومشوار صعب لغاية ماصار عندة قاعدة جماهيرية بطول الوطن العربى وعرضة وصارنجم بفنة بدون منافسة من اى فنان لفى الفترة الماضية ولا الان بعد ماتوقف الاستاد لسبب نجهلة كجمهور ونتمنى انة نشوف عدوية على شاشات التلفزيون وفى حفلاتة لانى كواحدمن جمهور هذاالفنان مستعد احضر لحفلة عدوية فى اى مكان واشترى اشرطتة ولو فية بوستر اوتى شيرت وكاب عليهم صورة بشتريها لانى بكل بساطة بحب احمدعدوية وياريت اى حد يعطينى الايميل حقة او عنوانة اكون لة من الشاكرين"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 9
subject = "اول مرة ادخل الموقع هذا صديقى قال لى انة كاتبين عن عدوية"
author = "مستعجل"
text = "احمد عدوية خط احمر يعنى علشان مانغلط على حد قل خيرا او اصمت احسن مانسمعة موال خسيس قال للندل كنت فين"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"

[[comments]]
order = 10
subject = "عطشان عطشان عطشان .. عطشان وأنا البر ده عمي وده خالي"
author = "حبيب عدوية"
text = "عطشان عطشان عطشان .. عطشان وأنا البر ده عمي وده خالي .. وأفوت على بحركم .. أنا أفوت على برحكم لم حد يملأ لي لم حد يملأ لي هو نصيبي كده .. هو نصيبي كده .. أجيب لناس الدواء وأنسى دواء حالي .. ياللي معاك القرش والأيام ضحكت لك .. حبيت جديد يا عيني علشان القديم باعني لبس هدوم السفر وجاني البيت يودعني .. ربيت ولاد وربنا عني .. ولما كبرت محدش سأل عني .. حرام عليكم يا جماعة عدوية ده حاجة كبيرة قوي"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084748/http://masr.20at.com:80/newArticle.php?sid=14672"
