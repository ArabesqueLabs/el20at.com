subject = "خمس اخبار عن حسام الهندي في مدونة واحدة"
posted = "2007-12-17"
text = "Wed 28 Nov 2007<br />عاجل : إعتقال حسام الهندي وخمسه من طلبه حلوان<br />Posted by العميد ميت under سياسه<br />إعتقلت قوات أمن الدوله والحرس الجامعي الصحفي والمدون حسام الهندي صاحب مدونه غلابه ، أثناء تغطيته أحداث العنف التي شهدتها جامعه حلوان اليوم علي يد بلطجيه إتحاد الطلبه “المعين ” ، كما إعتقل مع حسام الهندي 5 طلاب الجامعه و الذين تم الإعتداء عليهم من قبل قوات الأمن وأغلبهم من الإشتراكيين الثوريين والإخوان<br />وقد إعتدت قوات إتحاد الطلبه علي الطلاب بعد إقامتهم ندوه عن الإتصالات ، وإعتدت عليهم بعد خرجوهم من المدرج ، وفي وجود رئيس الجامعه كما يوضح الفيديو و الصور التالية<br />0<br />عدد الأصوات<br />تصويت حسام أخد إفراج … كفاره ياحسام<br />أخلت نيابة حلوان الجزئيه سبيل الزميل حسام الهندي الصحفي بجريده الدستور وصاحب مدونه الغلابه ، و8 أخرين من طلاب جامعه حلوان ( 4 من طلاب حركة مقاومه ، و 4 من طلاب الإتحاد المعين ) من سراي النيابة ، وذلك بعد أن طلب طلاب الإتحاد الصلح مع زملائهم من حركه مقاومه . يذكر إن طلاب الإتحاد [...]المزيد...<br />0 تعليقات تنبيه مدونة : مدونه ميت — أضيفت منذ 17 يوم<br />0<br />عدد الأصوات<br />تصويت تأجيل عرض حسام الهندي وطلاب حلوان لصباح الخميس<br />قررت نيابة حلوان بتأجيل عرض حسام الهندي ألصحفي بجريده الدستور وصاحب مدونه الغلابه و 8 أخرين من طلاب جامعه حلوان إلي غدا الخميس باكر ، وفور علمنا بالتفاصيل علمنا الأتي ندوه عن الإتصالات في كليه تجاره ، حاول بعض الشباب أن يأخذوا الكلمات ولكن المنصه رفضت إعطائهم فرصه للتكلم ، ، فتكلموا غصب عن المنصه ، [...]المزيد...<br />0 تعليقات تنبيه مدونة : مدونه ميت — أضيفت منذ 18 يوم<br />0<br />عدد الأصوات<br />تصويت عاجل : إعتقال حسام الهندي وخمسه من طلبه حلوان<br />إعتقلت قوات أمن الدوله والحرس الجامعي الصحفي والمدون حسام الهندي صاحب مدونه غلابه ، أثناء تغطيته أحداث العنف التي شهدتها جامعه حلوان اليوم علي يد بلطجيه إتحاد الطلبه “المعين ” ، كما إعتقل مع حسام الهندي 5 طلاب الجامعه و الذين تم الإعتداء عليهم من قبل قوات الأمن وأغلبهم من الإشتراكيين الثوريين والإخوان وقد إعتدت قوات [...]المزيد..."
archived = "2007-12-18"
capture_url = "https://web.archive.org/web/20071218074622/http://masr.20at.com:80/newArticle.php?sid=13453"

