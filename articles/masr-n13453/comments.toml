subject = "رائع يا هندى تسلم ايدك"
author = "شريف الدواخلى"
posted = "2007-12-17"
text = "الموضوع اكثر من رائع كالعادة يا سيدى الفاضل ... تسلم ايدك \" اللقطة اكثر من رائعة \" فعلا الاعتصام بات هو الحل الوحيد أمام الجميع ، بعد ان اغلقت كل السبل ، وللاسف الحكومة تغض الطرف عن آلام الناس واوجاعهم ومن ثم فالخيار السلمى لم يعد مطروحاً<br />الاستاذ الجميل اللى سأل عنى .. .اشكرك بشدة وبقولك معلش كنت مشغول فى الدستور الفترة اللى فاتت دية جدا بس اوعدك انى راجع للموقع بقوة لانى فعلا مقصر فى حقه قوى ... بس ربنا يكرم بقى ونبدع مع استاذنا الجميل الطحاوى<br />سلام عليكم وكل عام وانتم بخير"
archived = "2007-12-18"
capture_url = "https://web.archive.org/web/20071218074622/http://masr.20at.com:80/newArticle.php?sid=13453"

