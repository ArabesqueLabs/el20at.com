order = 0
subject = "اللى رماك على المر"
author = "المعتصم باللة"
posted = "2007-12-17"
text = "من ساعة شرارة ما مسك البلد والخير والمكتسبات مغرقة الناس<br />الناس بتعمل اعتصام من فرحها ومن كتر الفلوس معاها ودة بطر والعياذ باللة - تبص تلاقى المعتصمين موقفين العربيات بتاعتهم وراهم والسندوتشات بتجيلهم من البيتزا ان ومعاهم فلوس مش عارفين يصرفوها فين<br />الخير كتير وكلة بفضل شرارة<br />والناس مبسوطة على الاخر وفى العيد اللى جاى كل اسرة محضرة خروفين هتدبحهم وربنا يخللى المسئولين ويمد فى اعمارهم لغاية الفين وخمسين علشان الناس تتمرغ فى الخير"
archived = "2007-12-18"
capture_url = "https://web.archive.org/web/20071218074622/http://masr.20at.com:80/newArticle.php?sid=13453"

