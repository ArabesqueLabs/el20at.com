subject = "لاتحزن"
author = "محمد"
posted = "2008-04-23"
text = "كل كلامك صحيح اخى وانا اوافق عليه مليون المائه وعلى فكره الى بيحصل ده مش جديد وحصل قبل كده افتكر معايا مجازر الصليبين فى القدس ومجازر التتار فى بغداد واكيد كان فى مجازر كنير بس احنا معرفنهاش دى سنه الحياه انا مش بدعوا للتخاذل والسلبيه انا عاوز بس نتعلم من التاريخ ومتقلقش هيجى يوم فيه هيظهر صلاح الدين جديد وقظز جديد بس السؤال انت عملت ايه وانا عملت ايه علشان نساعد صلاح الدين الجديد انه يظهر النصر مش هيجى كده النصر عاوز رجاله تقف وراه سيبك من الواقع الاليم الى احنا فيه وانسى الامراء والملوك والرؤساء العرب لان مفيش فايده منهم الفايده فينا احنا الشباب القادم اشتغل واتعب وقوى نفسك وقوى اسرتك وقوى ابنائك وقوى مجتمعك وقوى اقتصادك علشان لما ربنا يئذن نكون جاهزين القوه هنا بمفهومها الشامل والكلام كتير بس المهم الفعل"
