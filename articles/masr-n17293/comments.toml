subject = "حكومة على حجر عزو"
author = "واحد من الناس"
posted = "2008-08-20"
text = "الكاتب - كأي مثقف مصري - يتسم بالسذاجة لكونه يتصور أن الحكومة لديها استعداد للعمل لصالح أحد غير شخوص الوزراء.<br />الحكومة ما تقدرش تفتح عينيها في أحمد عز بعد ما مول المسيرات المليونية والتلاتينية، وبعد ما دفع من جيبه عشان يسكت العمال اللي بيعملوا إضراب.. خاصة وإن الحكومة وعدته بمكافأت متتالية سخية.. وكلكم عارفين.<br />الحل إن واحد من الجيش يكون بيحب مصر يقوم يغتال العائلة المالكة، ويحاكم كل المفسدين محاكمة عسكرية بعد ما يعمل انقلاب. وساعتها لابد نستعد عشان نتسرق من أول وجديد."
archived = "2008-09-04"
capture_url = "https://web.archive.org/web/20080904083925/http://masr.20at.com:80/newArticle.php?sid=17293"
