subject = "ابو الحديد الكذاب المنافق"
author = "حسونة"
posted = "2007-12-13"
text = "كل كلمة بتنقط كذب<br />بعد قراءة السطر الاول تشعر بالمهانة من العقلية المسطحة والتى كانها فى مركز تخلف عقلى<br />من اين اتوا بهؤلاء الصحفيين المنافقين<br />الا ينزل ولا يشعر ما يقولة رجل الشاعر<br />الم يفتح النت ويبحث فى جوجل عن النكت السياسية ويقرا نكت سياسية عن ما يمدحة<br />ظز فى ابو حديد وابو صفيح"
