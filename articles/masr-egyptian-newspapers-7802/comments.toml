subject = "سؤال لابو خرية"
author = "مش ضرورى"
posted = "2007-12-24"
text = "انت عابش فى الزمن بتاعنا والا عايش فى زمن ولى النعم مولانا حفظة اللة<br />انت بتتكلم بلغة ولاناس انقرضوا مع الطربوش والبلغ<br />اللى انت بتمدحة دة مجرد شرابة خرج - متخلف عقليا - واربعة بيسندوة علشان يدخل الحمام<br />دة عمرة الافتراضى انتهى من قبل ما يمسك الحكم<br />انت عارف ان الشعب كان مسمية<br />البقرة الضاحكة من ايام السادات<br />بقرة فى برسيم ربنا"
