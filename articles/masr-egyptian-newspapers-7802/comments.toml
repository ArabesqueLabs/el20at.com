[[comments]]
order = 5
subject = "رد ( بالملاوينة) على أبوالحديد ( الزرجينة)"
author = "عيب عليك يا (سيخ)"
posted = "2007-12-22"
text = "يبدو أن ابوالحديد من النوع ( المصدي) الذي فقد القدرة على التوصيل الجيد للضمير قصدي للحرارة . وللتعامل مع هذا النوع \" المصدي\" أي الذي علاه الصدأ أو الصمم أو الصديد أو الصرم أو الصرف الصحي سوف نشغل له \"العبيطة \"ونرد عليه بنفس منطقه:<br />(1) إحنا مافهمناش حكاية ( التحول الآمن) دي التي قادها قائدك المفدى بدون أي خسائر في الأرواح أو المعدات زي ما حصل في الدول اللي حوالينا التي لم تسعدها \"الصدفة \" التاريخية بقائد مثل قائدك يقودها برخصة تالتة أو من غير رخصة خالص.<br />يعني هل قصدك التحول من الإقتصاد الاشتراكي إلى الاقتصاد الحر ؟<br />أم التحول من الدولة المتبوعة إلى الدولة التابعة الراكعة الخاضعة؟<br />أم التحول الرائدة المادة يدها لأشقائها بالحماية والرعاية إلى الدولة الرابضة المنبطحة علىبطنها المادة يدها لتشحت من هنا ومن هنا مرة معونة ومرة منحة ومرة مساعدة ومرة قرض ومرة سلب ونهب من عيالها الفقرا والمرضى؟<br />أم التحول مثلا من دكر إلى نتاية ؟ باعتبار النعومة والليونة والمياصة في المواقف التي تتطلب وقفة الرجولة اللي قال عنها عمك محمد أبو سويلم في فيلم الأرض هذه المياصة جعلت الدول التانية تبص لنا بصة مش مظبوطة وتتحرش بينا؟<br />على العموم يا عم ( السيخ) أبوالحديد إحنا لا إتحولنا ولا نيلة ولا حتى فضلنا بدون تحويل .. يعني بالعربي كده ( إذا كنت لسة بتعرف عربي) إحنا رقصنا على سلم التاريخ بفضل قائدك المفدى ..ليه بقى ؟؟ صحصح كده وإدعك نفسك دعكتين علشان تفهم:<br />إقتصادنا يا أبوالحديد لم يعد إقتصادا إشتراكيا وبالطبع لايعتبر إقتصادا حرا عارف ليه ؟ الإجابة بسيطة جدا جدا جدا .. علشان مافيش إقتصاد عندنا أصلا يا أهبل.. دولة باعت مصانعها وخربت مزارعها وبوظت بنيتها الأساسية والاحتياطية وشردت عمالها يبقى فين الاشتراكية بقى؟ ومن الناحية التانية رجالتها المعتبرين شغالين يعملوا سيراميك ويهربوا فيه الفياجرا ويسقعوا الأراضي ويقطعوها ويبيعوها ويردموا النيل علشان يعملوا جراج لفندق الخلايجة وبيبيعوا البنوك وكل ما يتزنقوا ( بيع يا لطفي) أو بيع يا ( صدقي) أو بيع يا ( نظيف) أو بيع يا أي زفت الطين باعوا بنك الاسكندريةو وباعوا بنك القاهرة وباعوا عمر أفندي وبيبيعوا جامعة الاسكندرية وبيبيعوا أكبر مستشفى فيها بعد ما هايهدوها وبيبيعوا مطار إمبابة و باعوا الجلابية والصديري والفانلة واللباس .. وبيقول لك إحنا بنتحول .. وفعلا إتحولنا إلى بلابيص أو بلاليص بفعل قائدك المفدى الذي أتحفتنا به الصدفة التاريخية"
archived = "2010-03-14"
capture_url = ""

