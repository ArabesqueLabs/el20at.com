subject = "بطلوا نفاق بقى"
author = "ابو اسامة"
posted = "2007-12-13"
text = "الاخ المنافق ده بيتكلم فى التلفزيون المصرى ولا مفكر ان القراء متخلفين زيه<br />اولا بيستشهد بدول كل دولة لها ظروف مختلفة عن التانية وعوامل ادت الى ما حدث فيها<br />وهى لا يمكن ان تنطبق على دولة مثل مصر ثانيا هو فين التغيير اللى عملوا الاخ حسنى<br />بتاعك علشان ينقذ مصر اذا كان هو سبب الكوارث اللى فى البلد وماسك فى الحكم باءديه وسنانه<br />يا ريت الموقع يرحمنا من المنافقين دول علشان بقوا فى كل مكان<br />(جتكوا الأرف مليتوا البلد)."
archived = "2010-03-14"
capture_url = ""

