[[comments]]
order = 0
subject = "الشيخ"
author = "محمد الحسينى"
text = "الشيخ المحترم ميعرفش ان غزة محاصرة امال الحديث اللى معناه بيقول من لم يهتم بامر المسلمين فليس منهم انا.......انا مش فاهم الراجل مستحمل نفسه ازاى دا حتى مش بيعترف انه غلطان وكانه نبى مش بيغلط ..... وبيقول ايه المشكلة لما اسلم على بيريز (اللى مكانش يعرفه فى الاول زى ما كان بيقول) لا مفيش مشكلة يا عم الشيخ فى انك تسلم على قتال قتلة قتل الاف من اخواننا المسلمين فى فلسطين وفى لبنان وفى ارض سيناء لا مفيش اى مشكلة فى انك تسلم على نفس اليد اللى شربت من دم المسلمين والعرب مفيش اى مشكلة عادى جداً ........ربنا يحميك وينصرك على مين يعاديك اللهم جازه بعدد من مات من المسلمين على سلامه لهذا الصهيونى القاتل اللهم امين"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133726/http://masr.20at.com:80/newArticle.php?sid=18795"

[[comments]]
order = 1
subject = "تنتاوى ميعرفش انة غزة محاصرة وممنوعة من كل حاجة"
author = "خيال الماتة"
text = "الفرق بين الشخ والشيخ انة الشخ شوية يوريا وحتروح لطريقها او مكانها انما الشيخ فيفترض انة صاحب علم غزير وحافظ للقران وملم بالحديث والفقة واصول الدين وعلى اطلاع كامل على مجريات الاحداث وبالذات اللى تهم المسلمين وتحديدا القدس وفلسطين مش يقولى معرفش انة غزة محاصرة لكن الاعتراف بالحق فضيلة يافضيلة المفتى اعترف وقول انى غلطت ولا انتا نبى مرسل لامؤخذة يعنى"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133726/http://masr.20at.com:80/newArticle.php?sid=18795"
