subject = "كل الناس كدابة"
author = "bebo"
text = "اولا .. مش هاقول ان الموضوع جميل جدا ..بس هاقول انه العنوان الوحيد اللى شدنى انى اقراه من كل العناوين اللى فى الصفحة الرئيسية .. بجد والله ده اولا<br />ثانيا بقى ... انا جربت الموضوع ده لاقيت تلت تربع الناس اللى حواليا كذابين والحمد لله وخصوصا مبارك والحكومة !!<br />ثالثا : نصيحة بلاش تطبقوا الكلام ده على الاشخاص اللى انتوا مرتبطين بيهم .. النتيجة مش هاتكون حلوة<br />سلام"
