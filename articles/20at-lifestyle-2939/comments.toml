subject = "مهم جدااا"
author = "منارة الاسكندرية"
text = "بصراحة موضوع الكدب بقى منتشرا جدا الايام دية الان الناس دلوقتى بتحب المظاهر وتبان بشخصية غير شخصيتهم وبتعتمدعلى الكدب فى كدة.....وسعات الكدب بيفيد فى امور السياسة لان مش كل حاجة بتحصل الازم تتعرف للشعب<br />والا كنا حنعيش فى حرب بنا وبين الحكومة وكل حاجة حتبقى على المكشوف و الكدب بيهون علينا حجات كتير بتحصل....<br />و شكرا على الموضوع ."
