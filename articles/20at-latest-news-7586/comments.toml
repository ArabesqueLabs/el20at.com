subject = "اموال حرام"
author = "حرام كدة"
posted = "2007-11-16"
text = "الن يموتو هولاء الاغنياء الطمع والجشع يعمي عيونهم . في وسائل الاعلام تجد هناك حملة يقولون فيها للغلابة تبرعو للمستشفى الفلاني للاورام تبرعو للقدس تبرعو للفقراء تبرعو مش عارفة من اجل ايه وطبعا مين بيطالبو بالتبرع بطالبو غلابة يعني ناس مش لاقية تاكل والاغنياء ياحبة عيني عمالين يشترو طيارات ويعملو افراح فخمة بملايين الدولارات اليس ب300مليون دولار دي حيدفع اجور ورواتب سنوات لموظفين حكوميين في اي دولة من الدول العربية كفاية كدة طمع وجشع بكرة حتموتو وحيتلف جسمكم بكفن يمكن من ارخص انواع الثوب النهاردة الدنيا بس لامفر من الاخرة يالله كدسو الاموال ولموها عوض ان تعمل شركة تشغل بيها ناس عاطلين وتفتح بيها بيوت عامل لي شركة روتانا للرقص والعري عشان تبين لي اشكال متل هيفا وماشابهها بكرة بتتحاسبو على كل قرش صرفتوه في الحرام."
