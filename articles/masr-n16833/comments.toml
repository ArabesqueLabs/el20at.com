subject = "يا ترى اللي داخلين كلية الطب ناويين على ايه"
author = "مش ححبك"
posted = "2008-07-19"
text = "طبعا اللي داخلين كلية الطب وهرو نفسكم في المذاكرة هدفهم انهم يبقوا دكاترة مستثمرين ويبقوا اغنيا على حساب العيانين الغلابة والناس تشحت وتبيع هدومها وعفش بيتها علشان خاطر تدفعلهم الاتعاب بتاعتهم<br />والدكتور اللي اسمهم ملاك الرحمة حيبقوا جلادين ووحوش ونهيبه وشفيطه (الا من رحم ربي)"
archived = "2008-08-03"
