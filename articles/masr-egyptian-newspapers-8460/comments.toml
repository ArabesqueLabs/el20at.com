order = 1
subject = "هذا شيء طبيعي"
author = "سيف الحق"
posted = "2008-03-12"
text = "هذا الرجل رئيسنا ورئيس الشعب المصري وليس الحكومة هو رجل مناضل من اجل الحق مكافح من اجل الشعب حتى لو نزلت الشارع القريب من منزله تلاقيه يقف في الطابور \" ليس طابور الصباح \" لاكن طابور الخبز هذه هي المواطنة عايز اكثر من كدا ايه ديمقراطية ثم اخواننا الاسرائليين لازم نساعدهم اذا كان كل العالم الغربي يقدم لهم المساعدة فنحن نبخل عليهم بالإضافة إلى أن النفط والغاز اللي بتتكلم عنه ده يخص الحكومة ليس الشعب \" الجبان \" بس بجد انا رأي الشخصي هو من يرضى أن يعيش جبان يستحق المذلة ، ونحن شعب أصبح اغلبه في حالة الرعب الخوف التنازل من اجل العيش هو الناس مفكره نفسها عايشه ، اذا لم نصلح ديننا لا إصلاح في أمرنا اذا لم نلغي ملاهي العاهرات بالهرم وجميع انحاء مصر كيف نطلب من الله أن يحقق العدل ونحن يوجد منا الفاسد والضال فيجب أن نصلح حالنا وديينا وسوف يصلح الله أمرنا إنشاء الله إنه على كل شئ قدير"
archived = "2010-03-14"
