order = 0
subject = "عصابة على بابا والاربعين حرامى"
author = "سكران"
posted = "2008-03-11"
text = "انت يا صديقى تعيش فى احلام وخيالات مرضية تستدعى دخولك مصحة طب نفسى حيث انك تعانى من وساوس قهرية<br />انت عايز اى حد يتصل بك ويقول اية اللى حصل<br />انت بتقول ان الحكومة بتدعم المواطن الاسرائيلى<br />طيب -هذا هو واجبها<br />اذا لم يتم ذلك سوف يبلغون الامريكان بغضبهم من النظام وامريكا هتشيلهم من على الكراسى<br />هذا النظام لم يختارة الشعب - وهو عدو الشعب<br />واللى اختار هذا النظام امريكا واسرائيل<br />يبقى لازم يخدم اسيادة وطز فى امثالك وامثال الجريدة بتاعتك"
