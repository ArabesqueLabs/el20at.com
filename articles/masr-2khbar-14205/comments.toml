author = "رحمهم اللة"
posted = "2009-12-01"
text = "فى مذكرات اللواء محمد نجيب انة قال لاعضاء مجلس الثورة<br />والان طردنا ملك ليجلس مكانة 100 ملك<br />كان مالك دستور بمعنى انة يملك ولا يحكم<br />وكانت كل السلطات فى يد رئيس الوزراء تماما مثل بريطانيا فيها ملك ولكنة لا يحكم ولكن رئيس الوزراء عندة كافة الصلاحيات وياتى بالانتخاب<br />الان السادة اللواءات ابتداءا من رئيس الحى الى البية المحافظ الى البية الوزير اللواء الى اللواءات رؤساء مجالس الشركات القابضة والقطاع العام - كلهم ملوك<br />اخدوا البلد غنائم حرب لانهم قاموا بالانقلاب<br />فين ايامك يا ملك"
archived = "2010-03-14"
