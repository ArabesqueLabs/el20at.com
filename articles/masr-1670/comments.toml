subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2009-02-21"
text = "لماذا يستهان بصحه الشعب المصرى وبصحه اطفاله شباب الغد والمستقبل لماذا وهل من مجير من هذه الشركات الظالمه التى تقوم بضرب كل القوانين عرض الحائط الحقونا يا اهل البلد من الخراب اللى ها يعم من شبكات التقويه التى تنشاء فى الارياف ومنها قريتى التى يحاول شركه من شركات المحمول انشاء برج فيها ولا نعرف نعمل ايه علما اننا تلكلمنا مع المسئولين فردو بانهم جايبين تصريح من البيئه فما الحل لهذه لمشكله الخطيرة افيدونا افادكم الله"
