subject = "الانضمام الى الوزارة"
author = "أحمد رجب على"
posted = "2007-11-04"
text = "ليس الغرض من الاعتصام هو الحافز المادى فقط انما هو المساواه بين جميع الموظفين داخل المصلحة الواحدة بالله عليكم كيف يعامل اثنين من العاملين فى مصلحة واحدة باجرين مختلف فانا مامور ضرائب ومرتبى لا يتعدى335جنية وزميلى فى المصلحة يتقاضى 1500جنيه اى ان حوافزه اكثر منى 300/100 رغم اننى انا الذى اقوم بالتحصيل والعمل وقرار رئيس الجمهوريه رقم 159 يقر بمساواة جميعفى نفس المصلحة دون تميز طلبنا هو الرجوع الى الوزارة الام"
