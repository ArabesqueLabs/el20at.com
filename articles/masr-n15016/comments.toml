subject = "المحمول"
posted = "2008-04-03"
text = "المحمول<br />انا خلاص شلت المحمول<br />انا من بكره هاكون مسئول<br />هأكل لحمه وهارمى الفول<br />انا من بكره انا هأبقى البيه<br />والبس بدله بألف جنيه<br />واقعد بقى ويا البهوات<br />واقعد بقى ويا البشوات<br />وان سئلونى هقول شملول<br />انا من بكره هأربى فراخ<br />انا من بكره هأربى طيور<br />هأكل بط ووز ولحمه<br />بدل يا عم ما أعيش مسلول<br />انا من بكره هأروح على لندن<br />بعد بكره هأزورها باريس<br />هأعمل جوله فى كل اوروبا<br />وبعد بعده هأطير على سول<br />وارجع مصر راكبها الجامبو<br />وانام فى فندق ست نجوم<br />اقعد اكلم هذا وذاك<br />فى مشاريع تصنعها عجول<br />وان طلبونى فى المؤتمرات<br />وان سئلونى فى الاجتماعات<br />هأعمل ناسى كانى بفكر<br />كده او كده هيقولوا مسطول<br />بكره انا هاطلع فى الجرانين<br />ويعزمونى فى التلفزيون<br />وادخل بنك باسمى ورسمى<br />اطلب طبعا كام مليون<br />آخد القرض اهرب على بره<br />يقوم ماسكنى الانتر بول<br />يا حالولى يا حالول"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406214735/http://masr.20at.com:80/newArticle.php?sid=15016"
