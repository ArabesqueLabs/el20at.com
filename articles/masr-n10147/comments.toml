order = 0
subject = "تماااااام"
author = "نيفين نيفى نوفا"
posted = "2007-05-10"
text = "على فكره يا جماعه احنا لو بصينا على اجمل الافلام سواء المصريه او الاجنبيه اللى حقتت اعلى ايرادات و اعلى نسبه مشاهده هنلاقى انها الافلام اللى ليها بعد سيكولوجى و اللى فيها البطل او الابطال بيعانو من عقد نفسيه بنسب مختلفه<br />التدخل النفسى ف اى عمل بيدى الدور ابعاد كتيره و بيخلينا نتوحد مع الابطال لاننا بنحط نتفسنا مكانهم و بنشفق على انفسنا من الوقوع ف نفس ادوارهم و دا بنسميه ف الدراما sympathy and fear<br />اعذرونى المششتيير على راى هووووبه ماثر عليا ..اعمل ايه موضوع رسالتى نفساوى حبتين و شكلى هركز مع افلام الصيف السنه دى"
archived = "2007-06-13"
capture_url = "https://web.archive.org/web/20070613132213/http://masr.20at.com:80/newArticle.php?sid=10147"

