[[comments]]
order = 2
subject = "عقد ....ولكن"
author = "مرقس موريس"
text = "الافلام في مجملها جميله كقصه ..لكن هناك مشكله حتميه الحدوث وهي المواجهه بين الافلام فالافلام اخذت طابع التكرار لدي المشاهد فنجد مثلا ان المواجهه مميته بين الافلام الثلاثه :كركر,كده رضا,عندليب الدقي.لان الثلاثه نفس القصه من حيث العقد النفسيه والتواءم -وان اختلف وانفرد كركر بعض الشئ-في الاسلوب والاداء ..فالصيف كله ضعيف للفنان وايراداته .اما بالنسبه للزعيم فيالاسف وقع في تلك البؤره التي تجمع بينه وبين الشباب الصاعد فنجاحه الوحيد سيبقي الايرادات شانه كاي فنان مهتم بالشباك لا الفن الذي يتميز بالجراه علي المستوي العربي والعالمي فمرجان احمد مرجان لا يهتم به كبار المشاهدين الا في مواضيعه السياسيه والحاليه والتي افتقدت العمق ما عدا قضيه التعليم للكبار التي اخذت الطابع الشبابي المبتذل الذي لا يليق بفنان كبير الوضع التقينا به في رائعه السينما العربية(عماره يعقوبيان).مارك"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819050750/http://masr.20at.com:80/newArticle.php?sid=10147"

[[comments]]
order = 3
subject = "في قصص التوائم سعد الاقوي"
author = "رامي"
text = "طالما الهدف الاساسي والمحرك لاي سيناريست لتقديم التواءم هوتفجير مساحات أوسع من الضحك عن طريق الافيهات والمواقف الكوميدية الناتجة عن تعدد الشخصيات فبالتالي اؤكدان محمد سعد هو الاقوي لانه الوحيد القادر علي اضحاك الجمهور بهذا الاسلوب وله خبره طويله بهذا المجال والاهم انه الوحيد القادر علي اداء الشخصيه او الشخصيتين بشكل غير تقليدي واسلوب مضحك وجذاب انا اؤيدمحمد سعد في براعته في اتقان الشخصيه بجميع جوانبها حتي ولو كانت شخصيات غريبه الاطوار انا اناصر فيلم كركر كاقوي فيلم كوميدي هذا الصيف لاني اتوقع ان هناك طاقات كوميديه هائله ستتفجر من محمد سعد"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819050750/http://masr.20at.com:80/newArticle.php?sid=10147"
