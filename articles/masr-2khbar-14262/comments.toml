text = "اصل مفيد شهاب دة واحد من أخلص جنود النظام الفاسد اللى ربنا ابتلى مصر بيه فلازم طبعا ( امعانا فى اثبات اخلاصه) يقلل من قيمة وقدر أى حد لية قيمة فعلية زى الدكتور محمد البرادعى او غيره. الشوشرة الاعلامية اللى بيقوم بيها هو و اللى معاه حوالين كل حد بيفكر يترشح هى حرب نفسية لدفع افكار الناس بعيدا عن مميزات المرشحين(الكويسيين) وصب افكارهم على المميزات (الوهمية) االئيس وابنة اللى عندهم الخبرة (الوهمية) فى كل حاجة العمل السياسى والادارة الحزبية و........ والسرقة طبعا<br />للاسف كل المنابر الاعلامية الفاسدة زى برنامج البيت بيتك وغيره كتير بتلعب على جانب اللاوعى عند الناس لتوجيه افكارهم ناحية جانب واحد واظهار الباقى وكأنهم دواب لا يفقهون شيئا"
archived = "2010-03-14"
