author = "الزبالة تسكت"
posted = "2009-12-06"
text = "لما البرادعى كخة<br />وعمرو موسى كخة<br />وايمن نور كخة يبقى مفيش غير جمال جميل ننوس عين امة<br />اصل اللواء طيار حسنى مبارك لما مسك الحكم كان خبير سياسى<br />وقبلة البكباشى السادات كان خبير سياسى<br />وقبلة البكباشى جمال عبد الناصر كان بيرضع سياسة من صدر امة<br />كلهم كانوا بهايم<br />يبقى واحد زى البرادعى اللى كان بيتعامل مع رؤساء الدول العظمى وبيحترموة اكتر ما بيحترموا رئيس مصر يبقى كخة وغلطان علشان جمال وعلاء<br />البرادعى مواطن مصرى نظيف ومن حقة ان يترشح<br />وامثال شهاب زبالة الاتحاد الاشتراكى سابقا ان يسكتوا"
