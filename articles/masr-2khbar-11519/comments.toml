subject = "فى بلدى - العيال لا تذهب الى المدرسة"
author = "شايف"
posted = "2009-03-10"
text = "مصيبة سوداء<br />كل العيال بتوع الثانوية العامة وكذلك الاعدادية لا يذهبون الى المدرسة اطلاقا - بيروحوا الدروس الخصوصية بس ويرجعوا البيت يذاكروا<br />يعنى المدارس الاعدادية والثانوية فاضية من التلاميذ<br />بس بتوع الابتدائى اللى بيحضروا والمدرسة منتظمة<br />اية بقى مشكلة الاداريون والمدرسون - ناس بتاخد مرتبات وقاعدة فى البيت<br />يا جماعة فية انهيار فى منظومة التعليم فى البلد او يمكن فى البلد كلها - النظام الادارى فى البلد انهار"
archived = "2010-03-14"
