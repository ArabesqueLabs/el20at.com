subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-05-09"
text = "الفارق كبير جدا بين أن يدعوا الاخوان الشعب لأضراب يخططون له وبين أن يشاركوا غيرهم ، ما تم هو أن الأخوان شاركوا في هذا الاضراب ولكنهم لم يدعوا إليه ، كما أن قوة الأحزاب السياسية وجماعات الضغط لا تقاس بأعدادهم ولكن تقاس بمدى تأثيرهم التفاف الناس حولهم"
