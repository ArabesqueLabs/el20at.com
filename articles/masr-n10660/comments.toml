[[comments]]
order = 0
subject = "كنت موجود فى الصالون"
author = "محمد ممتاز - بيبو"
text = "الى مزيد من النجاحات و لكنى مازلت مصر على استضافة اى شخصية رياضية مثل حسام البدرى او ابراهيم سعيد او مترجم مانويل جوزيه المدير الفنى للنادى الاهلى"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201548/http://masr.20at.com:80/newArticle.php?sid=10660"

[[comments]]
order = 1
subject = "منور الصالون يا بيبو"
author = "محمود مهدى - مودى"
text = "ربنا يوفقكم وياربت تستضيفوا ممثلين ومغنيين ورياضيين ....<br />وانا عارف يا بيبو انك عاوز مترجم مانويل جوزيه عشان تقوّى لغتك ! ابغاك تكثف التقارير"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201548/http://masr.20at.com:80/newArticle.php?sid=10660"
