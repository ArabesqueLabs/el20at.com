posted = "2007-11-17"
text = "إخوان اوف لاين .. و انقلب السحر على الساحر<br />from gemyhood.com on Sun, 2007-11-11 22:49<br />استعباط | التدوين و سنينه | شباب ماوكوس | صباحك زى وشك يا مصر | Probably Arabic<br />لم يكن المقال الذى كتبه فاروق الجمل فى المصرى اليوم طلقة بداية لصراع داخلى بين شباب الأخوان و قيادات التنظيم ، ففى الوقت الذى تصور البعض ان الازمة فى البدايات بعد كتابة مقال فاروق الجمل و تصدره الصفحة الأولى للمصرى اليوم كانت الأزمة تتخذ منحنيات أخرى فى تطور سريع أشك ان فاروق او اى صحفى يعلم او سيعلم فصوله مستقبلا.تبدأ الأحداث بأطلاق موقع صادم للجميع تحت مسمى اخوان اوف لاين حمل فى تنويه قبل بداية صفحته الرئيسية ان القائمين على هذا الموقع و مؤسسيه غير راضين عن سياسات الموقع الرسمى للأخوان و ما يقتبسه من مواد اعلامية خاصة بهم و ينسبها لنفسه متجاهلا الحق الفكرى لهؤلاء المدونيين المنتمين لجماعة الأخوان أتبعوه بانتقادواضح للسياسة العامة للأخوان بعد ان طرقوا العديد من الأبواب حتى يصل صوتهم للقيادات ، اتبع اطلاق الموقع العديد من الأتهامات لبعض من مدونى الأخوان المعروفين امثال محمد عادل و عبد المنعم محمود و غيرهم بأعتبارهم ايقونات تدوينية اخوانيه فى عالم الأنترنت و المدونات.و ما هى الا ايام حتى عرف جميع قيادات الأخوان مؤسسى هذا الموقع بعد ان وشى بهم احد المدونيين المتهمين بأنشاء الموقع و الذى فقد مصداقيته عندهم على حد قولهم بعد ان كتب تغطية لأجتماع الدكتور محمد مرسى ببعض شباب الاخوان على صفحات جريدة الدستور و الذى جاء مخالفا للحقيقة على حد قولهم ايضا ،و رغم كل هذا جاء تعليق بعض قيادات الأخوان فى الخارج صادما لذلك المدون حيث اعتبروه خائنا لأصدقائه و أخوانه فى الجماعه خاصة بعد اتصال هاتفى بأحد المدونيين الأخوان و ذكره بأنه رمز كبير فى عالم التدوين و لا يصح ان يتم الزج به فى مثل هذا التفاهات على حد زعمه.لن اعلق على الاحداث سوى بتعليق حد المدونيين الاسلامين من أصدقائى المقربين و الذى قال فى استياء منكوا لله اليسار لمعه و نفخ فيه و اول ما هبش هبشكوا و قال التدوين بدأ علمانى و اوهم الجميع فى احد البرامج الفضائية ان الاخوان جم ينضفوا التدوين و اهو ثانى ما هبش هبش اخوانه فى الجماعة و فتن عليهم.و بغض النظر عما سبق و اللى برضو مش هاعلق عليه علشان ما تصدرش منى اصوات تخدش الحياء العام ، فان مدعى و انصار حرية الرأى لمدونى الأخوان مطالبين بتقديم تفسير واضح المعالم عما حدث لشباب وجد اخيرا متنفسا للتعبير عن آرائهم الحقيقية فى الجماعة حتى و ان كان بدأه بعض من الشباب العلمانيين"
