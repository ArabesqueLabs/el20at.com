[[comments]]
order = 0
subject = "ضع عنوان التعليق"
author = "ام طارق"
text = "و الله انا شايفة ان الموضوع دة لو انتشر اكتر من كدة بجد حيشوه صورة الجماعة بجد يعنى حيقولوا ان الجماعة اصلا بينها و بين بعض مشتتين....بس حقيقى الله ينور عليك يا ابن عمى السيد بينت للناس الموضوع بزاويتين و دى حاجة كويسة يمكن تصحح للناس من صورة الاخوان شوية"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116123929/http://masr.20at.com:80/newArticle.php?sid=12427"

[[comments]]
order = 1
subject = "البطيخ والسمك الفسيخ"
author = "مراقب من على مقهى فى سوق السمك"
text = "يعنى اية جماعة الاخوان والمحظورين والمفكوكين<br />هل الجماعة دى فية لها تسجيل وقائمة بالاعضاء ومنظمة ولها مقرات مثلا زى الحزب الوكنى والا اهى حاجة استروبيا وبنعرف اعضائها كدة بالوايم واحد مربى دقنة واحد بيروح الجامع واحد نشط سياسيا نبقى نقضى علية ونقول اخوان ان كان مسلم او شيوعى اذا كان مسيحى<br />العيال بتوع الجامعة دول عمرهم ماكانوا اخوان حتى ايام حسن البنا<br />دول اولاد بتوع الجماعات الدينية ودى حاجة تانية خالص واللى عملها المرحوم السادات ايام ماكان بيحارب الناصريون فكريا<br />بالعربى مفيش حاجة اسمها اخوان مسلمين<br />الموجودين سواء فى المدونات او فى الشارع دول شباب تبع الجماعات الدينية وبتنظم عشوائى ولها انصارها<br />انما بقايا الاخوان بتوع مكتب الارشاد والمرشد فدى بقايا شكلية لحاجة ماتت قوى من زمان<br />فمفيش مدونون اخوان وغير اخوان<br />والموضوع كلة بيتكلم على صراع واختلاف فى الوهم"
archived = "2007-12-23"
capture_url = "https://web.archive.org/web/20071223175051/http://masr.20at.com:80/newArticle.php?sid=12427"

[[comments]]
order = 2
subject = "كفايه كلام فى الموضوع ده"
author = "محمود حسين"
text = "هو فيه ايه يا جماعة الموضوعه انا علقت عليه ولم ينشر<br />المهم بقول تانى<br />يا جماعه الى حصل ده فى موضوه اخوان اف لان فرقعه اعلاميه ارادة به المصرى اليوم كالعادة تفجير مشكله فى وسط الجماعة . الموضوع بالفعل حصل ولكن ليس بالصور التى تم تناول الموضوع بها<br />وبقول لعادل انا من الناس الى شايفه انا موقع اخوان اون لاين محتاج شويه تطوير وانه لا يتناسب مع متغيرات الأحداث الدوريه التى نحياها ويفتقد الى التطوير والتجديد وتغطية الأحداث . ولكن الطريقة التى تم تناول الموضوع به لعلاج هذه المشكله كانت طريقه من وجهة نظرى الشخصيه سيئة للغايه حتى ولو لم يستمع اليه المسئولين عن الموقع لوجهة نظره ومقترحات كان ينبغى له الذهاب الى من هو اعلا منهم حتى يصل الى مكتب الأرشاد . أما عن وجهة نظر محمد السيد فأنا اتفق معاه تماما . وبالفعل ميقال عن شباب الأخوان المدونيين معظمه غير صحيح والبعض الأخر محرف . فمعظم التصرفات ناتجه عن تصرفات فرديه ناتجه عن عدم العلم والوعى بالأمور المحيطة فالمدون يتحدث من موجهة نظر قد تكون محدوده<br />وذلك الكلام ليس لكل المدونيين . وفى النهايه لابد ان يعلم كل فرد فى الجماعة ان هناك امور لابد من مناقشتها داخل الجماعه لأيجاد حل لها . وهناك امور لا مانع من تناولها على الملاء لأخذ الأراء فيها ومناقشتها .<br />أبن اسكندريه<br />http://alex-bigboss.blogspot.com/"
archived = "2007-12-23"
capture_url = "https://web.archive.org/web/20071223175051/http://masr.20at.com:80/newArticle.php?sid=12427"
