subject = "ضعف الازهر"
author = "ابو اسامة"
posted = "2009-02-08"
text = "ان الضعف الذى عليه الازهر لايعطيه الثقة او المصداقية فى الرأى بل لم يعد لدى الناس اى احترام لدوره على الاطلاق<br />ولم يعد له ذلك الشأن الذى كان فى ايام شيوخ الاسلام العظام لآنه اصبح منقادا ورا الحكام منحازا لآرائهم<br />دون الاهتمام اذا كان هذا الرأى صوابا ام خاطأ . رحم الله شيوخ الآزهلر العظام الذين اعطوا الا زهر هذا الدور الكبيير على مر التاريخ وهد الله علمآ الآزهر الآن الى ما يحبه ويرضاه."
