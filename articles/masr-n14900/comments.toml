[[comments]]
order = 0
subject = "معضلة الرئيس القادم"
author = "اسامه صلاح"
text = "السلام عليكم ورحمة الله وبركاته<br />لي راي شخصي بحت يتلخص في ان السنوات القادمة وعلي الاخص الخمس سنوات القادمة ستكون من اصعب واخطر الفترات التي مرت بها مصر منذ حكم اسرة محمد علي وستكون تلك الفترة من اصعب الفترات علي الحاكم والمحكوم في نفس الوقت فلن ينجح حاكم في الاصلاح او السيطرة علي الاوضاع باي صورة او وسيلة من الوسائل المعروفة في السابق مهما كان من الذكاء والقدرة القيادية ومهما كانت دافعيته قوية في هذا الاتجاه ومهما اتحد مع الشعب في اهدافهم وكذا ايضا لن ينجح المحكوم او الشعب من تحقيق اهدافه وسيواجه فترة عصيبة من التخبط والعصيان والاحباط القاتل وربما النزاعات التعصبية والاحداث الشبه دموية ............ولن يفوز في تلك المرحلة او يخرج منها بدون جروح الا الصفوة والحاشية المضللة للحاكم والمحكوم والقادرة علي الاستفادة من اللام الاخرين ( الوصوليين والمتسلقين رغم البدل ورباط العنق الجميل) ...............وهذه الرؤية وهذا الكم من التشاؤم ليس رجم بالغيب وانما هي الظواهر الاجتماعية المشاهدة ......<br />فالرئيس القادم مطلوب منه زيادة الدخل الفردي (للشعب) لينال رضاهم وهذا حق لهم ومهمة اساسية للرئيس القادم الا ان هذا الرئيس ستقابله عقبة عدم كفاية الدخل القومي لسداد هذه الفاتورة الكبيرة والدائمة حيث اجمالي متوسط انتاجية الفرد المضافة ( اجمالي الانتاج علي عدد السكان او العاملين) لا يتناسب مع هذه الزيادة المطلوبة حتي ولو تم اضافة القيمة المضافة من استخراج الثروات الطبيعية للبلاد الي هذه المعادلة بالكامل سيعجز اي رئيس قادم عن الالتزام بزيادة الاجور ( وبالطبع تلك الثروة الطبيعية من اراضي وغاز ومعادن الخ تكاد تنتهي او قد بيعت بالفعل )<br />فماذا سيواحه الرئيس القادم سيواجه موجه عالمية من الغلاء مع دخل محدود سيعجز في ظل السياسات والمؤامرات الدولية عن توفير الغذاء للشعب الا بقبول تنازلات للقوي العظمي لن يقبلها الشعب او ستثيره عليه<br />ماذا سيواجه الرئيس القادم سيواجه موارد بشرية (ثمينة جدا) ولكنها عاطلة اما لعدم توافر مستلزمات الانتاج واما لفساد تأهيل تلك الموارد البشرية واما للفساد الاخلاقي وفقد المواطنة لتلك الموارد البشرية سيواجه شعب تعدلت سلوكياته فتحول الي فنانيين ومبدعين كلام او مرشدين سياحة او مدمنين كسل وحتي يسيطر علي هذه الموارد ويعيد تأديبها وصياغتها وتأهيلها يلزمه قوة جبرية للسيطرة علي سلوكهم ولن يتمكن ايضا من ذلك لانه ببساطة سيستخدم مساعدين او وزراء او مسؤؤلين متشبعين بهذا السلوك ورافضين للتغيير فاما ان يخضع لهم ويتماشي مع الركب واما يصتدم بهم<br />ماذا سيواجه الرئيس القادم ................. (سيواجه اثار فترة طويلة من العشوائية في التخطيط والادارة نتج عنها تعديل سلوك شعب بكامل قواة وفي فترة من اصعب الفترات العالمية من مؤامرات ومجاعات واصعب الفترات الداخلية حيث البطالة والكسل ورغيف العيش والعدو علي الحدود )<br />سيواجه قوة راسمالية من شأنها تدمير البلد ككل وافساد اقتصادها اذا ما تعرض لمصالحها المتعارضة مع مصالح الشعب<br />سيواجه تعليم منتهي الصلاحية وقضاء طويل الاجل توصلت قاعدته العريضة لمناصبها فيه بالمحسوبية والقرابة و...<br />سيواجه مشكلة المياة سيواجه مشكلة المرور والاسكان والعشوائيات..........سيواجه مشاكل لا حصر لها تستلزم الحل الجذري والصحيح والفوري في الوقت الذي نفذ فيه صبر الشعب ولن يتمكن من ربط الحزام مرة اخري ولن يؤمن بغير الحلول المشاهدة والفورية ............. وبالطبع الرئيس الجديد ليس نبي ولا يحمل عصاة سحرية لتحقيق المعجزات وهنا تكون (قفلة الدومينو ) ولا حل .....................................................<br />ومن تلك المقدمة فلا عمر سليمان ولا الميسيري ولا موسي بهذا الجهل حتي يقبلوا تحمل تلك المخاطرة والمسؤلية العظيمة وايضا لن يقبل تلك المخاطرة الا واحد من الصفوة القادرين علي تحقيق مكاسب من اللام الاخرين<br />ومن ثم فكل من يظهر في الاعلام وله تواجد علي الساحة السياسية والاجتماعية والاقتصادية خلال الفترة من حكم محمد علي الي الان يعتبر من الصفوة الذين تسببو وساهموا بصورة او باخري عن هذه الفوضي فاين كان عمر سليمان او موسي عند توقيع اتفاقية الجاز وبيع الارض وخروج العلماء خارج البلاد وفساد التعليم وطوابير القضاء فمن لم يكن له يد في هذا فله قدم في ذاك ......... وحسبنا الله ونعم الوكيل"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174909/http://masr.20at.com:80/newArticle.php?sid=14900"

