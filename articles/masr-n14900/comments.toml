subject = "عليه العوض ومنه العوض"
author = "عفروتو"
text = "منكم لله ياعشرينات سيبو الراجل فى حاله ولا عايزينه يركب الموجه ويحصل ايمن نور ! انتو ايه ؟ مافيش فى قلوبكم رحمه ؟ الدكتور المسيرى صحته لا تتحمل البرش ولا زنازين مزرعة طره ! بلاش تكبروا الحكايه فى دماغ الراجل اتوسل اليكم؟؟؟ عشان كله وقت الجد بيجرى ويقول وانا مالى انا عندى عيال عايز اربيهم -- سيبوه فى حاله احسن---------"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174909/http://masr.20at.com:80/newArticle.php?sid=14900"
