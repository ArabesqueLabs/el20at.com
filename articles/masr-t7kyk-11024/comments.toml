[[comments]]
order = 1
subject = "مفيش مهندسين فى البلد دى -- والا فية لواءات بس"
author = "مش قوى كدة"
posted = "2009-01-22"
text = "السكة الحديد والقطارات كانت تعمل زى الساعة ايام زمان - وكان الناس تظبط ساعتها على مرور القطار وكان سعر التذكرة رخيص<br />الى ان<br />حدث العدوان الثلاثى على مصر سنة 1956<br />وتم حصار مصر اقتصاديا -- وتم منع الفحم من انجلترا لمصر<br />وطبعا كانت الجرارات بتشتغل بالفحم وكلنا بنشوف المداخن بتاع القطار فى الافلام القديمة - واغنية الاطفال يا وابور يا مولع طش الفحم<br />واغنية المرحوم عبد الوهاب يا وابور الساعة اتناشر يا مجبل على الصعيد واغنية يا وابور رايح على فين وكلمة وابور فرنسية الاصل vapour اللى هو المحرك البخارى<br />المرحوم عبد الناصر ووزير النقل ساعتها غيروا السكة الحديد وغيروا الجرارات بدلا من البخارية الى الجرارات التى تعمل بمحرك الديزل والات الاحتراق الداخلى<br />وهو تطور رائع وقتها انتقلنا من البخار الى الات الاحتراق الداخلى وكان هذا سنة 1960 تقريبا<br />ثم كان من المفروض ان نتطور<br />كان من المفروض ان نبدل الجرارات الديزل ذات التكلفة العالية جدا الى الجرارات التى تعمل بالكهرباء زى المترو<br />مشروع كهربة خطوط السكك الحديدية<br />ولكن السادة اللواءات قالوا لنا لا صوت يعلوا على صوت المعركة ايام السادات<br />ولكن الان<br />ومن 35 سنة ونحن ننعم بالسلام<br />لماذا لم نطور السكك الحديدية ونكهرب خطوطها وتبقى القطارات تعمل زى المترو وزى قطارات انجلترا وامريكا وفرنسا وكل دول العالم<br />ماذا استفدنا فى السلام 35 سنة ؟<br />لماذا لم نطور السكة الحديد ؟<br />احنا كنا فى غيبوبة ال 35 سنة الماضية<br />احنا كنا ولا زلنا فى فريزر تلاجة<br />اين المهندسين فى مصر ؟<br />يا خوفى لا يكونوا ماتوا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "واغنية المرحوم عبد الوهاب يا وابور الساعة اتناشر ي"
author = "مش كاتب"
posted = "2009-01-24"
text = "فكرتنا بمحمد عبدالوهاب سمعته في التلفزيون بيحكي مذكراته وقال ان اول مرتب اخذه في القاهرة كان اربعة جنيه ونص وراح اجر شقه بخمسين قرش<br />اي والله زمان في القاهرة المرتب كان اربعة جنيه ونص وايجار الشقة خمسين قرش<br />لغاية ما جه الحرامية بتوع ثورة تلاته وعشرين يوليو المرتب كان 17 جنيه وما فيش حاجه اسمها شقق<br />اختفت الشقق على وشهم النحس وذا كان فيه شقة تبقى بخلو اد كده<br />ودلوقتي الشقق كتير بس تمليك او ايجار جديد سنه سنتين يعني الواحد يتجوز بايجار جديد وكل سنتين يغير الشقة<br />كل دا علشان خاطر العيال الحرامية والمجرمين بتوع 23 يوليو اللي زي جمال عبدالناصر وصلاح سالم وجمال سالم وصلاح نصر وعبدالحكيم عامر<br />طبعا شوية المجرمين دول بريطانيا اللي دخلتهم الجيش المصري لان ايام الملك فاروق كان ممنوع الزبالة دي تدخل الجيش اللي كان يدخل الحربية كان لازم يبقى ابوه باشا او من الاعيان فبريطانيا هي اللي ساعدت الحوش دول على دخول الجيش وعملتلهم تنظيم الضباط الاحرار<br />عز على بريطانيا انهم يشوفوا المسلمين في مصر بيتطهروا وبيصلوا وبيقولوا اللهاكبر وهما القساوسة في الكنائس البريطانية بيعتدوا على نسائهم<br />فانتقموا مننا بالضباط (الاحرار)<br />والذين جائوا من بعدهم خير خلف لخير سلف قضو على البقية المتبقية ودخلت السيارة المصرية في طريق مسدود<br />الله يفرجها"
archived = "2010-03-14"
capture_url = ""

