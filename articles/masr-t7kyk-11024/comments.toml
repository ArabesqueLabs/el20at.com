subject = "الحراميه الهجامين بتوع ثورة 23 يوليو هما السبب في"
author = "مش ثورجي"
posted = "2009-01-25"
text = "اي والله<br />دول شوية هجامين<br />هجموا على مصر<br />عايز اعرف هما عملوا ثورة على ايه بالضبط<br />ايه اللي كان غلط في مصر وهما صلحووووووووووه<br />اهم كلهم اموات عند الله بقى ربنا ينتقم منهم على تخريب اقتصاد مصر<br />المثل بيقول تذكروا محاسن موتاكم<br />ودول للاسف ما فيش حاجه ممكن نفتكرهالهم حسنة ابدا"
