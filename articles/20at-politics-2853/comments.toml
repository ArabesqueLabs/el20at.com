text = "السيد كاتب المقال...مقالتك لللأسف تحرض أيضا على الطائفية والفرقة بين أبناء الوطن الواحد..فقد ذكرت فيها كلمتي السنة والشيعة بشكل تكراري..كما أنك أيضا تهزأ من سيد مقاومة لم ولن تنتج منه بلدك الاتي منها حضرتك...وماهو مقرف أيضا في مقال حضرتكم انكم بكلماتكم الثميتة هذه تحاولون زرع الفتنة بين بلدين جارين..كفوا عن هذه المقالات المغرضة المدفوعة التي لا تفيد أحد في وقت عصيب كهذا ووجهوا أقلامكم الى أعداء الأمة الحقيقيين...صحيح..اللي اختشواماتوا"
