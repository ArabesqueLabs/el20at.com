subject = ""
author = "مستشار وزير المالية"
posted = "2009-05-07"
text = "مكتوب في المقال ممتاز السعيد مستشار وزير المالية<br />طيب يا اخي لما وزير المالية مش عارف حاجه وجايب مستشار<br />طيب ما نمشي دغري والمستشار يبقى هو وزير المالية<br />يعني الاخوة اللي حيبقوا رؤساء وزارات في المستقبل<br />ما يجبوش اصحابهم وحبايبهم يعملوهم وزرا وهما ما بيعرفوش حاجه يقوموا يجيبوا مستشارين<br />يجيبوا المستشارين على طول يعملوهم وزرا<br />لو سمحتم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = ""
author = "سمير محمود"
posted = "2009-05-08"
text = "فية استجواب فى البرطمان الى وزير المالية الغالى -- لان بند الموازنة فية بند سفر الوزراء وكبار المسئولين الى الخارج - فقد كلفت خزينة الدولة فى العام المنصرم 92 مليون جنية<br />تخيل جنابك ان السيد رئيس الوزراء والسادة الوزراء والسادة رئيس الجمهورية واسرتة نكاليف زيارتهم الى اوروبا فى عام واحد 92 مليون جنية - طبعا الوزير مش بيسافر لوحدة - لا - دى البرتيتة كلها وتلاقيهم رايحين يحضروا مؤتمر فى فن تصفيف الشعر او تكنولوجيا المركبات الفضائية - يعنى مؤتمرات يصيفوا فيها وليس فيها اى فائدة للشعب المصرى<br />92 مليون جنية سفريات - دة احنا حاجة فخمة قوى<br />لا - وال اية الاستاذ غالى بيعمل اعلانات للغلابة اللى زينا يدفعوا ضرايب علشان يصيفوا بها"
archived = "2010-03-14"
capture_url = ""

