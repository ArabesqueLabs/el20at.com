author = "بندارى السيد رجب"
posted = "2009-05-06"
text = "5% كتير جدا<br />انتم قرأتم الموازنة بتاع الاستاذ غالى<br />بيقول لك جميع مداخيل الدولة من ضرايب وقناة السويس واثتثمار وبترول كلة على بعضة 210 مليار جنية ----------- يعنى 80 مليون مصرى كل دخلهم 30 مليار دولار<br />يعنى دخل زى دولة تشاد او بوركينا فاسو<br />كل اقتصاد مصر اللى واجعين دماغنا علية من اصلاح وانفتاح ومش عارف اية 30 مليار دولار<br />دولة تعدادها 80 مليون انسان مداخيلها 30 مليار دولار بينما اسرائيل مداخيلها 1500 مليار دولار<br />يعنى مفيش اقتصاد خالص ومطلقا ومفيش انتاج<br />يعنى 5 % كتير جدا جدا جدا<br />ما تشوفوا دولة تحتلنا وتصرف علينا<br />خربوها ولاد الكلب"
archived = "2010-03-14"
