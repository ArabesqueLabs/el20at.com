text = "30 مليار دولار بعد الخصم مش قبل الخصم<br />يعني بعد ما كل واحد في الحكومة ياخد حقه تالت ومتلت<br />بيرمولنا العظمة 30 مليار دولار<br />وكباية الشاي بدولار<br />يعني دخل مصر 30 مليار كباية شاي<br />،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،<br />مش رضوى حسن ولا مروى صلاح"
