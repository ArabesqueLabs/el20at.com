subject = "* الإخوان المسلمون أول من سنوا الاغتيال باسم الإسلام في العصر الحديث :"
author = "منقول"
text = "* الإخوان المسلمون أول من سنوا الاغتيال باسم الإسلام في العصر الحديث :<br />يقول محمود الصباغ في ص 264 وما بعدها من كتابه المذكور \" حقيقة التنظيم الخاص في شأن قتلهم القاضي الخازندار \"<br />\" وعقدت قيادة النظام الخاص محاكمة لعبد الرحمن السندى ( قائد التنظيم السري للإخوان) على هذا الجرم المستنكر وحضر المحاكمة كل من فضيلة المرشد العام الشهيد حسن البنا وباقي أفراد قيادة النظام بما في ذلك الأخوة صالح عشماوى والشيخ محمد فرغلى والدكتور خميس حميدة والدكتور عبد العزيز كامل ومحمود الصباغ ( المؤلف ) ، ومصطفى مشهور ( المرشد العام للإخوان المسلمين الآن)، وأحمد زكى حسن ، وأحمد حسنين ، والدكتور محمود عساف ، وقد أكد عبد الرحمن في المحاكمة أنه فهم من العبارات الساخطة التي سمعها من المرشد العام ضد أحكام المستشار الخازندار المستهجنة أنه سيرضى عن قتله لو أنه نفذ القتل فعلا وقد تأثر المرشد العام تأثرا بالغا لكلام عبد الرحمن لأنه يعلم صدقه في كل كلمة يقولها تعبيرا عما يعتقد ... وقد تحقق الإخوان الحاضرون لهذه المحاكمة من أن عبد الرحمن قد وقع في فهم خاطئ في ممارسة غير مسبوقة ... فرأوا أن يعتبر الحادث قتلاً خطأ ... ولما كانت جماعة الإخوان المسلمون جزءا من الشعب وكانت الحكومة قد دفعت بالفعل ما يعادل الدية إلى ورثة المرحوم الخازندار بك ... فإن من الحق أن نقرر أن الدية قد دفعتها الدولة عن الجماعة، وبقى على الإخوان إنقاذ حياة الضحيتين الأخريين : محمود زينهم وحسن عبد الحافظ (اللذان قاما بتنفيذ عملية القتل) حيث قد تم القبض عليهما من قبل الشرطة … وفى ص 267 يقول المؤلف: كما تحملت بنفسي وضع خطة لخطف الأخوين عبد الحافظ ومحمود زينهم من سجن مصر ؟!! .<br />ويروى محمود عساف صاحب الكتاب المذكور سابقاً\" وقائع هذه المحاكمة بصورة أوضح في ص 147 وما بعدها حيث يقول:<br />\" قتل المستشار الخازندار وأنا مستشار لمجلس إدارة النظام (التنظيم السري للإخوان) ولم يكن مجلس الإدارة يعلم شيئا عن هذه الواقعة إلا بعد أن قرأناها في الصحف وعرفنا أنه قد قبض على أثنين من الإخوان قتلا الرجل في ضاحية المعادى ومعهما دراجتان لم تتح لهما فرصة الهرب حيث قبض الناس عليهما ، وفى ذات اليوم طلب الأستاذ الإمام عقد اجتماع لمجلس الإدارة بمنزل عبد الرحمن السندى .... ودخل الأستاذ وهو متجهم وجلس غاضبا ، ثم سأل عبد الرحمن السندى قائلا : أليست عندك تعليمات ألاَ تفعل شيئا إلا بإذن صريح منى ؟ قال : بلى ، قال : كيف يتسنى لك أن تفعل هذه الفعلة بغير إذن وبغير عرض على مجلس النظام ؟ فقال عبد الرحمن : لقد طلبت الإذن وصرحتم فضيلتكم بذلك . قال الإمام : كيف؟ قال عبد الرحمن : لقد كتبت إلى فضيلتكم أقول ما رأيكم دام فضلكم في حاكم ظالم يحكم بغير ما أنزل الله ويوقع الأذى بالمسلمين ويمالئ الكفار والمشركين والمجرمين فقلتم فضيلتكم : إنما جزاء من يحاربون الله ورسوله ويسعون في الأرض فسادا أن يقتلوا أو يصلبوا أو تقطع أيديهم وأرجلهم من خلاف أو ينفوا من الأرض ، فاعتبرت ذلك إذنا…\" !!!.<br />قال الإمام : \" إن طلبك الإذن كان تلاعباً بالألفاظ فلم يكن إلا مسألة عامة تطلب فيها فتوى عامة أما موضوع الخازندار فهو موضوع محدد لابد من الإذن الصريح فيه ثم إنك ارتكبت عدة أخطاء :لم تعرض الأمر على مجلس النظام ولم تطلب إذنا صريحا وقتلت رجلا يقول لا إله إلا الله محمد رسول الله واعتبرته يحكم بغير ما أنزل الله وهو يحكم بالقانون المفروض عليه من الدولة ولو افترضنا أنه كان قاسيا فإن القسوة ليست مبرراً للقتل .<br />وأثناء حديثه كانت الدموع تنساب من عينيه … ثم قال إن كان قتلك للخازندار قد تم بحسن نية فإن علينا الدية !!!! ولكن الحكومة دفعت تعويضا كبيرا لأسرة الخازندار فأسقطت الدية عن الإخوان!!<br />ويقول محمود عساف في ص 157 وما بعدها :<br />\" ألتقيت بالأخ المهندس السيد فايز بشارع العباسية أمام مكتبة المطيعى وجده غاضبا على النظام الخاص ( التنظيم السري ) …<br />في اليوم التالي ـ وكان ليلة مولد النبي صلى الله عليه وسلم ـ ذهب شخص ما بصندوق من حلوى المولد (حلوى البدعة) وطرق باب بيت السيد فايز في شارع عشرة بالعباسية وسلم صندوق الحلوى إلى شقيقته قائلا أنه لا يجب أن يفتحه إلا السيد وبالفعل حضر السيد فايز وتسلم الصندوق وبدأ يفتحه وإذا بالصندوق ينفجر ويودى بحياته…!!!! .<br />تلك جريمة رهيبة لا شك عندي أنها من فعل النظام الخاص لمجرد أن السيد فايز يعارض وجوده …\" !!! .<br />سألت الشيخ سيد سابق عن هذه الواقعة فقال إن رئيس النظام هو الذي خططها ونفذها أحد معاونيه بناء على فتوى نسبت للشيخ سيد سابق وهو برئ منها وقال لي: أنه يعرف الشخص الذي قام بتك الفعلة النكراء ..\"!!! انظر المصدر .<br />بعد هذه الحادثة بحوالي الشهرين وكنت آنذاك أعمل في الفترة المسائية سكرتيرا لتحرير مجلة الاقتصاد … وكان معي موظف للكتابة … اختلى بي بعد انتهاء العمل وقال : هناك شيء أحب أن أبلغك به فأنا أعمل موظفا بالمباحث العامة ومهمتي كتابة التقارير على الآلة وقد ورد تقريران أحدهما عبارة عن تحريات لأحد المخبرين يفيد أنك (محمود عساف ) كان في دار الإخوان بالأمس ... ما التقرير الثاني فهو عبارة عن كشف وجد مع أحد الإخوان الذين قبض عليهم مؤخرا وفى هذا الكشف اسم السيد فايز تحت رقم (1) واسمك تحت رقم (3) ولما قرأت خبر جريمة اغتيال السيد فايز ، رأيت أن أحذرك . وهذا الكشف يحتوى على عشرة أسماء يبدو أنه يراد اغتيالهم ، وفيهم الشيخ السيد سابق … \"!!! .<br />الإخوان والجاسوسية :<br />يقول محمود عساف ص 152 وما بعدها من كتابه المذكور:<br />\" سألت الشيخ سيد سابق … حيث أن الشيخ سيد علم من أحد الإخوان انه كان يجمع معلومات عن أحمد ماهر باشا رئيس الوزراء حين ذاك وبنى على هذه المعلومة أن النظام الخاص للإخوان متورط في هذه الجريمة ( مقتل أحمد ماهر باشا ) . أوضحت للشيخ سيد أن جمع المعلومات شئ وجريمة الاغتيال شئ آخر ذلك أننا كنا نجمع معلومات عن جميع الزعماء والمشاهير من رجال السياسة والفكر والأدب والفن سواء كانوا من أعداء الإخوان أو أنصارهم وهذه المعلومات كانت ترد لي لأحتفظ بها في أرشيف !.<br />أما حقيقة علاقة الإخوان بحادث اغتيال أحمد ماهر فهي كالآتي :<br />\"… دعا عبد الرحمن السندى لاجتماع وقال: إنه ينبغي أن نفكر في خطة لقتل أحمد ماهر قبل أن يعلن الحرب على المحور ، وقال : إنه وضع خطة أولية تقوم على تكليف أحد الإخوان بالمهمة ، فيزود بمسدس ، وينطلق إلى مزلقان العباسية ( مكان نفق العباسية الحالي) وينتظر هناك مرور سيارة أحمد ماهر ، حيث إن السيارات تبطئ كثيرا من سرعتها عند المزلقان ، ثم يطلق الرصاص عليه ، ويكون هناك شخص آخر منتظرا بموتوسيكل ، يحمله معه ويهربان0 تلك هي الخطة البدائية التي أثارت الاستياء من جميع الحاضرين ، لذلك سألته : هل هناك فتوى شرعية بقتل رجل مسلم يقول لا إله إلا الله محمد رسول الله ؟ فقال: إننا نعد مجرد خطة ولكن لن تنفذ إلا بعد الفتوى . قلت : ولنفرض أن هذا الشخص قبض عليه ، فماذا يكون مصير دعوة الإخوان كلها بعد ذلك ؟ قال: لا لن يقبض عليه . أحسست أن المسألة لعب بالنار ، واستجابة للهوى الشخصي وليس مصلحة الإخوان 0 ثم قال: لقد اخترت احمد عبد الفتاح طه لهذه المهمة ، وهو ينتظر خارج الغرفة ثم استدعاه وشرح له الخطة ، وقال : غدا إن شاء الله نكمل دراستها في وجودك .. !!! .<br />وفى ص 27 يقول عساف :<br />\" وجدنا أنه من بعد النظر أن نعلم ماذا يدور في أدمغة قادة مصر الفتاة فكلفنا أحد الإخوان بالانخراط في الجمعية هو المرحوم اسعد احمد الذي انضم إليها وبرز فيها سريعا ، لما كان له من نشاط..\"!.<br />قـلت : الكلام السابق واضح في الضلال والإضلال ولا يحتاج لمزيد تعليق لنتعرف على طبيعة هذا الفكر لمن كان له قلب أو ألقى السمع وهو شهيد .<br />فالإخوان يطلبون بيعة لمرشدهم مع وجود حاكم مسلم لمصر سادت له البلاد فكيف يتأتى ذلك شرعاً؟ اللهم إلا إذا كان هذا من مفاهيم الخوارج .<br />وبالنظر لطريقة هذه البيعة وترتيب العقوبات على مخالفتها في الدنيا والآخرة لهو اعتداء صارخ على الشرع وإحداث في الدين واضح وإيجاد إرهاب نفسي وفكري وبدني على الأتباع فهل من مدّكر؟!!<br />بل وصلت حدة السيطرة على الأتباع وإلغاء شخصياتهم بتوقيع العقوبة على المخالفين منهم للأوامر وعدم الإقدام على أخص الخصوصيات للمسلم كالزواج والطلاق إلا بعد الرجوع إلى القيادات فهل هذا منهج شرعي؟<br />إن الرسول صلى الله عليه وسلم أسلم من أسلم من كبار الصحابة ولم يطلب منهم ما طلبه قادة الإخوان من أتباعهم .<br />وها هو أمين تنظيم الإخوان للمعلومات د. محمود عساف يعترف هو و د.عبد العزيز كامل بعد ما انتهت بيعتهم فيصفونها بعدم الشرعية من جانب ومن جانب آخر يشبهونها بالطرق الماسونية والبهائية !<br />فهل هذه منهجية شرعية لتنظيم يفرض نفسه بالقوة على المسلمين في العالم ؟ .<br />وبعد ما ساق كل من محمود الصباغ ومحمود عساف وهما من كبار قادة التنظيم السري قصة قتل الخازندار المستشار من خلال المحاكمة الهزلية البدعية والتي ترأسها حسن البنا نفسه يظهر لنا الآتي:<br />1- فكر الإخوان يؤدي إلى التطرف والعنف .<br />2- فكر الإخوان يؤدي إلى التكفير والتقتيل .<br />3- تعدى حسن البنا حدود الدعوة وتقلده ولاية القضاء بلا سند شرعي .<br />4- تحريف الكلم عن مواضعه وكذلك قلب الحقائق بزعم أن قتل المستشار قتل خطأ وتتجلى مظاهر الاستخفاف في مسألة الدية التي ذُكرت ودفع الحكومة لها.!!!!<br />5- إصرار الإخوان على السرية والعنف بإبقاء قائد التنظيم بعد هذه المصيبة والتي تكررت بعد ذلك .<br />6- وأين الزعم بأن التنظيم السري كان موجهاً للإنجليز؟! فإن ذلك من الاستخفاف بالعقول لأن مقتل المستشار الخازندار تبعه أعمال قتل أخرى ستأتي .<br />7- ومن هنا نستطيع القول بأن الإخوان أول من سنوا الاغتيال باسم الإسلام فى هذا العصر والإسلام من فعلهم برئ .<br />8- كما تبرز هذه المحاكمة البدعية خطورة استخدام المنابر والخطابة لإثارة العامة و الخاصة بدون ضوابط شرعية .<br />9- هذا الأسلوب الذي عبرت عنه المحاكمة الهزلية هو نفس الأسلوب الذي اتبع بعد ذلك في الاتجاهات الدينية الأخرى في قتل السادات وغيره.<br />10- مسئولية حسن البنا التامة عن تصرفات التنظيم السري لأنه هو رئيسه العام والمؤسس له .<br />أما قولهم في قتل أحد أتباعهم على يد التنظيم الخاص فلا يحتاج لتعليق فإن كل بدعة ضلالة وهل مخالفة السنة تأتي بخير ؟ فها هو التنظيم السري الذي قيل أنه موجه للإنجليز يتوجه للمسلمين بل لأحد أتباع الإخوان فيقتل المهندس فايز بطريقة في منتهى الخسة والنذالة والدناءة فلم يراعوا في ذلك ديناً أو خلقاً أو حتى عواقب الأمر فهل من عاقل يبقى يناصر فكر الإخوان بعد هذه الأدلة الدامغة فضلاً عن انضمامه لهم ؟<br />اللهم لا إلا صاحب هوى وصاحب فتنة.<br />يعترف محمود عساف وهو المسئول عن المخابرات الإخوانية أنهم كانوا يجمعون المعلومات عن المشاهير ويتجسسون على الناس ويضعون الخطط لمن ناوءهم فهل بعد اعترافاتهم من مكابر يرد مثل هذا الكلام الذي لا دخل فيه لحكومة أو غيره أو يزعم وجود إكراه ، فقد كتب كل من الصباغ وعساف كتبهم وهم أحرار وغير أتباع إلا للإخوان فهل من معترض ؟!!.<br />ويؤكد اتهامهم بالتجسس على المسلمين ما جاء على لسان محمود عساف في ص27 من كتابه المذكور سابقاً .<br />إن الجماعات التي جاءت بعد ذلك ما هم إلا ضحايا فكر هذه الفرقة المبتدعة ، حيث يجتمع نفر من الرجال أو الشباب بحجة نصرة الإسلام ويقررون هذا كافر حلال الدم وهذا معاد لله ورسوله وهذا يقتل وهذا يضرب ويتحقق فينا ما نهانا عنه الرسول صلى الله عليه وسلم (لا ترجعوا بعدي كفاراً يضرب بعضكم رقاب بعض…) الحديث أخرجه البخاري ومسلم .<br />منقول للاهميه"
