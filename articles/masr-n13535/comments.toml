subject = "فاعتزل تلك الفرق كلها ولو أن تعض بأصل شجرة حتى يدركك الموت وأنت على ذلك"
author = "مش ضروري"
text = "عن حذيفة رضي الله عنه قال كان الناس يسألون رسول الله صلى الله عليه وسلم عن الخير وكنت أسأله عن الشر مخافة أن يدركني قال قلت يا رسول الله إنا كنا في جاهلية وشر فجاءنا الله بهذا الخير فهل بعد هذا الخير من شر ؟ قال نعم قلت وهل بعد ذلك الشر من خير ؟ قال نعم وفيه دخن . قلت وما دخنه ؟ قال قوم يستنون بغير سنتي ويهدون بغير هديي تعرف منهم وتنكر . قلت فهل بعد ذلك الخير من شر ؟ قال نعم دعاة على أبواب جهنم من أجابهم إليها قذفوه فيها . قلت يا رسول الله صفهم لنا . قال هم من جلدتنا ويتكلمون بألسنتنا . قلت فما تأمرني إن أدركني ذلك ؟ قال تلزم جماعة المسلمين وإمامهم . قلت فإن لم يكن لهم جماعة ولا إمام ؟ قال فاعتزل تلك الفرق كلها ولو أن تعض بأصل شجرة حتى يدركك الموت وأنت على ذلك"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229131000/http://masr.20at.com:80/newArticle.php?sid=13535"

[[comments]]
order = 5
subject = "الى الذى يدعو الى حزب صلاة الجمعة والجماعة"
author = "واحد"
text = "طيب يا ناصح ما هو نص المعتقلين مش اخوان ولا يعرفوا حاجة عن الاخوان واعتقلوهم علشان بيواظبوا على صلاة الجماعة والا الحكاية شوية كلام بتقولوة وخلاص<br />واية رايك فى اللى بيتحال على التقاعد قبل التلاتين سنة من عمرة علشان بيصلى<br />انتم فاهمين الامور غلط<br />العملية مش اخوان وهباب<br />العملية ضد الدين"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229131000/http://masr.20at.com:80/newArticle.php?sid=13535"

[[comments]]
order = 6
subject = "حزب طز فى مقابل حزب وداد قلبى"
author = "سلكاوى"
text = "الغالبية العظمى من الشعب مع حزب طز<br />اما الحرامية والنهابة فعملوا لنفسهم حزب قاصر عليهم اسمة الحزب الوطنى لعموم حرامية مزدوجى الجنسية الديمقراطيون<br />اما الاخوان فبيعملوا حزب اسمة على حسب وداد قلبى يا بوى"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229131000/http://masr.20at.com:80/newArticle.php?sid=13535"
