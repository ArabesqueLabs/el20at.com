[[comments]]
order = 0
subject = "امريكا والشيعة"
author = "مش لازم"
posted = "2008-05-21"
text = "طبعا كما تعلمون ان من اسباب غزو امريكا للعراق هو تسليمها للاغلبية الشيعية وتحويلها الى دولة شيعية مثل ايران تماما وذلك لتحويل المنطقة من صراع عربي اسرائيلي الى صراع سني شيعي<br />وكل ما تظهره امريكا من عداء لايران ما هو الا خداع استراتيجي<br />والخطوة القادمة هي تشييغ السعودية<br />لان كل ذلك في مصلحة تهويد القدس لان القدس والمسجد الاقصى ليس لهما اي رصيد عند الشيعة<br />المهم في الموضوع اوعوا تصدقوا ان فيه خلافات بين امريكا وايران على العكس واحد ايراني مهم صرح بأن امريكا تساعد ايران في انتاج قنبلة ذرية"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "مصر والسعودية والاردن دول الموالاة لامريكا وعملائه"
author = "عبولا"
posted = "2008-05-21"
text = "تسمى امريكا وكونداليزا رايس مصر والاردن والسعودية دول الاعتدال فى المنطقة وامريكا تعتبرهم حلفائها<br />وامريكا ليس لها صديق - ويظن بعض الاغبياء فى مصر من السياسيين ان امريكا فى جيوبهم<br />واعتقد ان امريكا قد اصابها الاحباط من النظام الحاكم الفاشل فى مصر بعد ازمة الجوع الطاحنة وطوابير الخبز التى لم تحدث فى مكان فى العالم ولا حتى فى بوركينا فاسة او موزمبيق رغم ارتفاع الاسعار العالمية كما يتشدق بها الفاشلون الحكام المصريون<br />امريكا اعطت الضوء الاخضر للتخلص من النظام الفاشل فى مصر<br />وكلام بوش البارد فوق رأس القيادة المصرية فى شرم الشيخ اعلان بذلك<br />ويستطيع اى ضابط صغير فى الحرس الجمهورى القيام بانقلاب وسيحظى بتأييد الشعب وامريكا<br />النظام الفاشل فى مصر بيطالع فى الروح"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-05-26"
text = "الحكاية مش بوش ولا هيلارى ولا أوباما<br />دول مجرد عرايس بتحركهم الصهيونية العالمية اللى بتسعي لتأسيس دولة اسراءيل من النيل للفرات وبتتحكم في اقتصاد وإعلام العالم<br />والخطين الزرق اللى في العلم الإسرائيلى هم النيل والفرات<br />أما النجمة اللى في النص ففيها ست خطوط والمقصود بها البلاد العربية الموجودة بين النيل والفرات"
archived = "2010-03-14"
