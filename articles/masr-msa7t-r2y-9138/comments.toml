[[comments]]
order = 3
subject = "الى الاخ اللي فوق"
author = "اكتب اسمك هنا"
posted = "2008-05-27"
text = "رغم انك مش كاتب اسمك<br />لكن ممتاز ممتاز ممتاز<br />هي دي الحقيقة المرة اللي كل العرب بيتجاهلوها والتي وضحت تماما بعد غزو العراق<br />واللي الشعوب وخصوصا سوريا ومصر لم يتخذوا اي اجراء داخلي بشأن مواجهة هذه الحقيقة للاسف"
archived = "2010-03-14"
