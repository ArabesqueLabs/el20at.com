[[comments]]
order = 1
subject = "بتوجيهات من الرئيس"
author = "ابو جلمبو"
posted = "2008-08-10"
text = "نشرت جريدة الاخبار بقلم السيد رئيس التحرير ان الهواء هب امس عليلا من الجهة البحرية وذلك بفضامل توجيهات سعادتة واصبح المواطن والحمد للة ينعم بشم الهواء بالمجان وبدون اى حدود وذلك حسب البرنامج الانتخابى لسيادتة<br />هذا وهناك توجة عام ادلى سيادتة بة بان كل مصرى من الحزب الوطنى يقتل اكثر من الف مصرى من العالم الزيادة سواء بقتلهم بالمبيدات المسرطنة او اغراقهم فى البحر بعبارة او حرقهم بقطار الصعيد او تسميمهم باكياس الدم الملوثة سوف ينال البراءة ووسام الرئاسة وكل هذا حسب البرنامج الانتخابى لسيادتة"
archived = "2010-03-14"
