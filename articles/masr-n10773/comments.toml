[[comments]]
order = 8
subject = "محمد القط"
author = "يا عبد الرحمن"
text = "بصراحة انا شايف ان كلامك هو الي كله عنصرية واسبعاد واستقصاء..مع حبة ضيق افق..<br />وراجع كلامك عن الاخوان وتحليلاتك الفذة حوالين عنف الاخوان الي هياكل الاخضر واليابس وكأنك منجم ولا عراف...<br />زائد كمان انت مال اهلك ..ما يتجوزوا من بعض ولا مايتجوزوش...أمال هيتجوزا منين !!<br />أهو ينضفوا المصريين شوية من البلاوي إلي في دماغهم وضمايرهم !!<br />ومتقلقش ..الإخوان مش هيمسكوا البلد ..لإنها بصراحة ماتستهلش الاخوان...<br />وأمثالك مينفعش معاهم غير ناس من عينة مبارك والعصابة بتاعته...ويناسبك قوي العادلي ولا عز ولا حتى فتحي سرور...<br />ومتستعجلش جمال مبارك جايلكوا في السكة...هو وشلته....والعالم دي مبترحمش ...أهو إلي قبليهم كانو ناس جاعوا شوية فحسيين نسبياً بالشعب إنما جمال وعز وكمال وشلة لجنة السياسات...مش هيرحموكو !!!<br />وبالنسبة للجهل والتخلف...براحة مش شايف ...ولا بلاش !!<br />أصلي راكن الجمل بتاعي علر باب الشغل !!!<br />صحيح...صفايح زبالة !!"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

[[comments]]
order = 9
subject = "عيب اوي"
author = "مصري وبس"
text = "عيب اوي الاسلوب المتدني دا من الحوار والالفاظ اللي بتطلع من واحد المفروض انه بيكلم علي اساس انه اخوان<br />فين بقي ياسر ابو العلا والناس اللي بتتحمق علي اي ربع كلمه تمس الجماعه<br />يشفوا اللفاظ والاخلاق اللي بتتقال<br />ممكن تبقوا اخوان<br />انما مينفعش يتقال عليكم مسلمين"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

