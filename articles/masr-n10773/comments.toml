[[comments]]
order = 14
subject = "الاخوان اتخانقوا"
author = "المواطن مصرى"
text = "مشكلة الاخوان المسلمين الازلية<br />انهم اسقطوا من حساباتهم ركن مهم الشعب المصرى<br />بص ياعم الامور منك لة<br />الشعب المصرى كارة حسنى مبارك وتجاربة المستمرة اللى جابت الفقر والاهانة لكل مواطن مصرى ونفسة يشوف ناس محترمة عندها تجربة عريضة تحول مصر لدولة اوروبية فى الرخاء والتنمية والرفاهية علشان المصرى يقدر يفكر تانى فى فلسطين وحماية اخوانة العرب<br />النموذج دة مش موجود فى الاخوان المسلمين لية بقى<br />اولا الاخوان ليس لديهم اى فكر عملى على الارض لرفعة مصر اقتصاديا فكل كلامهم من نوعية المقالة دى امتى حنشيل السلاح ؟<br />سلاح اية اللة يحرقك احنا عاوزينكم تنموا البلد مش تحرقوها ولو كان الاخوان عندهم برامج جاهزة للتنمية يبقى معندهمشى وسائل اعلامية كافية<br />ثانيا ارتباط الاخوان بالدين وغموض مستقبل مصر يعنى بالعربى اية اللى يمنع انكم تحولوا مصر الى سعودية تانية او ايران تانية وخد باللك ان المصرى عمرة ماحيقبل كدة لان جزء كبير من التدين الشديد والتعصب الدينى للمصرريين حاليا راجع لحالة الفقر الشديدة التى لم تمر على مصر على الاقل من الماضى القريب"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"
