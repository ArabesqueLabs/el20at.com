[[comments]]
order = 0
subject = "القتل من حق الحزب الوطنى"
author = "ابو اسامة"
text = "هل معنى ذلك ان الحزب الوطنى هو الوحيد الذى من حقه ممارسة القتل والتعذيب من اجل البقاء فى الحكم وبعدين انت ناسى ان كل الانظمة العربية هى التى مارست القتل والتعذيب ضد معارضيها هل استخدام السلاح حكرا عليهم وبعدين<br />الاخوان عمرهم ماهيستخدموا السلاح لان كل هدفهم السلطة ومن كان همه السلطة فلا يهمه التحرر هما هيفضلوا فى المركز الثانى حتى تحدث لحظة الانفجار ليستلموا السلطة على الجاهز ويكون حزب وطنى آخر اما بالنسبة لحماس<br />فقد فرض عليهم الخونة القتال وهو امر معد له مسبقا من امريكا واسرائيل.ويا شعب موت او عيش بكرامة"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

[[comments]]
order = 1
subject = "بالطبع هناك فرق"
author = "محمد السيد"
text = "الموضوع أكثر من رائع ..<br />مع تغطية وطرح محايد يستحق خلع القبعة :D ...<br />لتكون الإجابة في النهاية ...<br />أن الطرح العسكري أساسا لا يمكن بأي حال من الأحوال حصره في الإسلاميين ... وفقط ...<br />والنتيجة الأخري وهي الأهم ... أنه ليس من أدبيات ولا من منهج الإخوان المسلمين كجماعة ومبادئ وأفكار فكرة التغيير بالعنف أو انتهاج الوسائل الغير شرعية من أجل التغيير ...<br />حماس تبقي حالة استثنائية ... فتحت الاحتلال لابمكن الحديث بتاتا عن عدم حمل السلاح هناك أولا .. وثانيا .... لا يمكن تجاهل حالات الخيانة والعمالة المنتشرة داخل فصيل محمد دحلان في فتح ... الذي طور الأمر حتي وصلنا إلي هذه النقطة ..<br />مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\"بس مش كده يعني ...ده كتيييير... كتير أوي علينا ياريس\"<br />تقدروا تنورونا دلوقتي لو حبيتوا<br />http://mesh7askot.blogspot.com/"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

[[comments]]
order = 2
subject = "نفهم الأول وبعد كده نتكلم"
author = "محمد القط"
text = "إلي بيحصل في فلسطين بيفكرني بمثل شعبي بيقول \"كلم القحبة تلهيك ..واللى فيها تجيبو فيك \" !!<br />هي مش حماس دي حكومة منتخبة ..<br />والمفروض أجهزة الدولة تكرس لتنفيذ برنامجها إلي الناس انتخبوها على اساسه..<br />أول مرة أشوف مثال فج وقبيح من التسلط بالشكل النجس إلي في مصر وفلسطين وواضح إن فتح هي امتداد للحزب الوطني في فلسطين ..وإلي اعرفه إن القيادات المسيطرة في فتح تم تدريبها وتأهلها في مصر في مباحث أمن الدولة على إيد لوا إسمه صلاح سلامه من أوسخ خلق الله.<br />منين الناس انتخبت حماس ومنين فتح عايزة حماس تلتزم ببرنامج فتح !!<br />حاجة وسخة..<br />أول امبارح فتحي شرور بيقول \"يرضي مين إن حماس تقتل أحد أفراد أو زعامات فتح العسكرية ب30 طلقة\"<br />وبصراحة أول ما سمعته كنت عايز أشخر بس قلت حرام الشخير ..زائد كمان أنا بطلت قباحة من زمان ...<br />يا دكتور ..ويا عالم ياالي مبتحبوش الاخوان ومبتحبوش حماس..إلي بيته من إزاز ميحدفش حماس بالطوب...<br />الوضع في مصر ازفت وأضل..والناس إلي قتلهم أمن الدولة والداخلية في التعذيب دلوقت وخلال المواجهات في التسعينيات بالآلاف..والمعتقليين بالآلاف...والي ماتو بالتعذيب وقتها بالآلاف !!<br />إلي عملته حماس هو مواجهة لإنقلاب على الشرعية مش انقلاب ...<br />الناس انتخبت حماس وحماس مقلتش إنها هتخلي البحر طحينة ..ولا قالتلهم إنها هتعوم الفلسطينيين على وش الفته ..<br />حماس معروف عنها إنها هتكون سبب لمزيد من الشقاء والعنت ومعروف إن برنامجها نضالي برنامج مقاومة ..ليه ضريبة ومبيجيش من وراه مصلحة ولا رز ولا دقيق ولا زيت ولا سكر...هو ممكن يجيب سكر وضغط !!<br />والناس اختارت على هذا الاساس ..<br />وبقول للمصريين \"أجدع ناس تتفرج وتمصمص شفايفها\" سيبوا الفلسطينيين في حالهم وهي هتعمر...<br />ووفروا مشاعركوا الرهيفه لوضعكوا إلي زي الزفت واللي مش واضح إنه هيتحسن خلال ال100 سنة الي جاية !!<br />الله يحرقوا بجاز وسخ حرقتوا دمي !!!"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

[[comments]]
order = 3
subject = "معلش نسيت حاجة"
author = "محمد القط"
text = "معلش نسيت الموضوع الأساسي..<br />بالنسبة للإخوان...<br />أعتقد غن الاخوان جماعة عارفة هي عايزة إيه كويس وليها مشروعها وأهدافها القريبة والبعيدة ..وعلى الاساس ده بتوازن الجماعة تحركاتها وردود افعالها...<br />والجماعة والعنف ..مفيش علاقة بينهم من أيام الحرب بتاعة الانجليز والقنال وفيلم \"في بيتنا رجل\" و\"شروق وغروب\"و\"الموت التام أو الاستقلال الزؤام\" !!<br />ورجاء محدش يراهن على النقطة دي لإنه هيكون رهان خسران..والي يعرف الاخوان كويس بيستبعد الموضوع ده من اساسه !!<br />والي عايز يعمل حاجة يروح يعملها ...وميستناش الاخوان لامؤخزة \"يعملوله\" !!<br />عايز تروح تفجر مباحث أمن الدولة روح..في 6 اكتوبر والتجمع الخامس وشارع جابر ابن حيان في الجيزة ولاظوغلي..<br />وقريباً بجميع دور العرض !!<br />ومش عارف الناس عايزة إيه من الاخوان يعملوه أكتر من كده...والي على اساسه نص الجماعة محبوس والنص التاني مطارد...<br />ومع ذلك مشاريع الجماعة مستمرة وبتحقق نجاح في جميع القطاعات الخدمية والدعوية والاصلاحية ...<br />والنبي بس شوية \"زلطحجية\" الكتابة والنقاد من الوضع مدلدلي الرجول \"مدلدل الرجلين\" ينقطونا بسكاتهم وينتبهو شوية لنفسيهم ولحياتهم !!<br />بس خلاص"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

[[comments]]
order = 4
subject = "هيترفع السلاح"
author = "عبدالرحمن"
text = "الأخوان هيفعوا السلاح هيجلهم وقت وهيرفعوه بالفعل بس المهم هيرفعوه ازاي وأمتي وليه<br />السبب اللي يخليهم يرفعوه هو ان الحقد والكراهية اللي جواهم توصل لابعد حد فتحركهم عشان الانتقام يعني مش هريفعوه الا عشان نفسهم لا عشان اصلاح ولا حرية ولا دعوة<br />ولما يستخدموا السلاح هيكون الدم للركب وهتبقي مجزرة كبيرة واي حد مش هيعجبهم هيدبحوه ويدسوه بشكل ابشع من الثورة الفرنسية واللي حصل فيها طبعاً الشعارت بتاعتهم والتهم هتبرر اي دم يراق علي اديهم مهم بيدافعوا عن الدين يجماعه<br />ولو مسكوا الحكم هيبقي ابشع حكم استبدادي موجود كل المواطنين درجة تانية وتالتة وهما بس اللي درجة ولي لانهم بالفعل بيعتبروا نفسهم من الجنس السامي او فوق السامي كمان ميشغلوش حد في مكان ليهم الا اما يكون اخوان ميجوزش بناتهم الا لحد اخوان الاخ ميجوزش الا اخت زيه<br />شوية وهنلاقي نسل وسلالة موجوده كلهم شبة بعض من كتر ما بجوزا من بعض ومنغلقين علي بعض<br />فتخيلوا بقي دول هيعملوا غيرهم ازي<br />مش بعيد نشوف السيدات وكبار السن بيجلوا في الشوارع علي اديهم لاي سبب او لمجرد ان الاخ حاجمم المنطقه معجبوش شكلهم<br />ربنا يستر علي البلد بجد لاني خايف عليها من اليوم اللي الاخوان يرفعوا في السلاح في وشها وعلي ولادها"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

[[comments]]
order = 5
subject = "نقطة مهمة"
author = "عبدالرحمن"
text = "مفيش مقارنة بين اخوان مصر واخوان فلسطين<br />حماس حكومة شرعية منتخبة بأردة شعبية حقيقية ومن حقيهم يرفعوا السلاح في وش الخونة والصهاينة يمكن انا شايف انهم اتاخروا اوي في القضاء علي الخونة انما كان لازم يكون في حل نهائي للوضع عشان يتفغوا لبناء فلسطين من الداخل وتحرير ارضها<br />انا اخون مصر هداهم الله"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

