[[comments]]
order = 11
subject = "أى خدمة يا عمى المصرى وبس!"
author = "ياسر أبو العلا"
text = "أعلق بناء على استدعاء من جانب الأخ \" مصري وبس\" الذى تساءل عن الذين يدافعون حين يظلم الإخوان ، وأقول : يا جماعة عبر شاشة الإنترنت إياكم أن تحكموا على انتماء ، ليه بقى ؟؟؟<br />لأنه لا يدرى أحد من يكتب ؟ هل هو بالفعل كما يقول أم يدعى شيئًا غير الذى يقول ، أظن كلامى مفهوم .<br />ولكن أرى أنه من اللازم أن أدعو كل من يتحدث باسم المصلحين والشرفاء أن يكون مثلهم ، يعنى ليس مقبولا أن أدعو الناس إلى الصلاح وأنا غير صالح ، أو أحث البنى آدمين على عفة اللسان وأكون أكثرهم بذاءة .. أظن كلامى مفهوم أيضًا .<br />ولكن غير المفهوم أن يدعى الأخ \" مصري وبس\" ما ادعاه فى سطره الأخير حين قال :\"ممكن تبقوا اخوان انما مينفعش يتقال عليكم مسلمين \" فهذا حكم غريب وغير مقبول ، والصراحة غير مفهوم أصلا .<br />وبعدين يا أخى هما الإخوان وحدهم اللى لازم يبقوا عفيفى اللسان ؟<br />لا طبعا .. المفروض كلنا كده .<br />أى خدمة يا عمى المصرى ، أظن كده أنا قمت بالواجب .. ولا إيه ؟"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

[[comments]]
order = 12
subject = "إزيك يا قط"
author = "أحمد عواد"
text = "بصراحة وبالرغم إني أعرف عن محمد القط إنه لسانه طويل وحمقي حبتين إنما لقيت إن عبد الرحمن مستفز وبيقول حاجات مش عارف جايبها منيين وكمان القط مقلش حاجة غلط قوي ولا عيب وده لو قارنها بالي بيتسمع وبيتشاف على الموقع وأظن إن تعليقاته وضح حاجات كتير"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201057/http://masr.20at.com:80/newArticle.php?sid=10773"

