[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "عماد الدين"
posted = "2007-05-09"
text = "وجدت أنه يتوجب علي الرد على الكلمات الغير مسئولة التي وردت بتعليق المدعوة ميادة لأنه لا أرى أي وجه شبه بين الإخوان وما تسميه \"الجماعات الوهابية الأصولية\" على حد ما تدعي لأنه ليس للوهابية دخل بالسياسة ولا يتخذون من الإسلام واحهة لنشاطاتهم كما الإخوان بل يجعلون من الدعوة إلى الله بالحكمة والموعظة الحسنة أولوية قصوى كما أنه ليس لهم أنشطة سياسية<br />وهذا إنما يدل على جهل عميق وضحالة معرفة عند هذه المدعوة<br />وحتى ولو سلمنا بخطر الإخوان على الأمة فإن الأدعية التي أوردتها كدعاء عليهم ليست في محلها بأي شكل من الأشكال فهم ليسوا بكفار حتى ندعو عليهم بمثل هذه الأدعية التي ساقتها.<br />ولعل أفضل ما قرأته في التعليق هو الدعاء لولاة الأمور فهذا الدعاء يحمل معان شتى منها تثبيت السمع والطاعة للولاة حتى وإن كنا لسنا براضين عن أعمالهم"
archived = "2010-03-14"
