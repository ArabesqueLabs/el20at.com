[[comments]]
order = 0
subject = "واللة برافو عليهم"
author = "ميادة محمد عامر"
posted = "2007-05-09"
text = "اخيرا مجلس الشعب تدخل لؤاد وكبح جماع التنظيم الاخطر فى مصر وهو تنظيم الاخوان المسلمين يتمسحون فى الاسلام والاسلام الحقيقى منهم براء كما واتمنى ان يقع الملعون مهدى عاكف زعيم هذا التنظيم الارهابى الذى يمتد من الجماعات الاصولية الوهابية فى السعودية ثم يمر من مصر الى تنظيم القاعدة والعالم<br />اللهم احمى مصلر واحمى ابنائها<br />اللهم وفق ولاة الامر لما فية خير هذة البلاد وابعد عنا يارب العالمين هذة الثعابين التى تسعى فى الارض متخذة من الاسلام العظيم دينك يااللة وسيلة لبث سمومهم<br />اللهم ارنا فيهم عجائب قدرتك اللهم شتت جمعهم وفرق شملهم واجلهم فى حيرة من امرهم ياارحم الراحمين"
archived = "2010-03-14"
