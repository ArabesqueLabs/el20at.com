subject = "موضوع لطالما أثار الجدل .. فأين الرادع  ؟!"
author = "محمد نواف الحمدالله ..."
posted = "2008-04-01"
text = "المشكلة يا أخواني أن الإنسان الذي يعاني من أمراض نفسية ( وخاصة الأمراض النفسية الجنسية )، هي التي تؤدي به إلى القيام بهذا العمل الشنيع القبيح الذي لايقبله لاعقل ولا دين .. لاشرع ولا قانون ..<br />هذه المشكلة ( ولكي أكون محايداً ) لا مع الشبان ولا مع الفتيات .. إنها مشكلة نفسية موجودة في إحدى نفسيات الشبان أو الفتيات ..<br />فمن الممكن أن ترى قتاة تحب ممارسة الجنس ( علنا أو سراً )، فغايتها المتعه والترفيه عن نفسها فقط لاغير ..<br />والأمر سيان بالنسبة للشاب فهو أيضاً يحب ممارسة الجنس ( علناً أو سراً )، فغايته المتعه وقضاء وقت يكبح فيه نشوته ورغبته الجنسية ، ويفرغ كامل طاقته ليغرغها بعد ذلك بالقتاة .. وعلى آآآآآآخر انبساط و يـ ( عيني !!! ) ..<br />إذن المشكلة نابعة من كلا الجنسين معاً ..<br />فالفتاة الخلوقة المهذبة المحتشمة الورعة التي لاتلبس لاباساً لافتاً يشد العينين ويلفت الإنتباه .. فحمت نفسها من بلية التحرشات والمعاكسات والمغازلات التي غالباً ما تؤدي بها ( في أقل الإحتمالات والإمكانات ) فضيحة معتبرة ومرتبة _ نوعاص ما _ .. غير أنها بعات شرفها بأبخس الأثمان ( سواء أكانت مكره أم راغبة ) ..<br />فالشب لايأتيه شيئاً ولا يفقد شيئاً من كيانه وذاته .. على النقيض تماماً بالنسبة للفتاة ..<br />فرد الإعتبار قائم بحد ذاته على صون المرأة لعفتها وحشمتها وإتزانها .. لأنه من سابع المستحيلات بأن يقرب الشب منها ويتحرش بها .. فأقل ماتفعله بهذا الموقف المشين ( الصراخ عالياً . وعالياً جداً )، فإن لم يجدي ذلك نفعاص فبأي شيء ثقيل وعلى رأسه أو أي مكان من أماكن جسمه المختلفة .. ففي هذه الحالة هو دفاع عن النفس .. وحماية لشرفها وعرضها من الهتك.<br />أشكر جزيل الشكر كاتب هذا الموضوع المميز، والذي هو إن دل على شيء فإنه يدل على حرص واهتمام الكاتب من ناحية، ومن ناحية أخرى حتى يكونوا الفتيات على علم ودراية وبينة في مثل هذه المواقف الحرجة ...<br />تحياتي لك ( اسماعيل دبارة ) ..................... وإلى الأمام دائماً وأبداً ووقفك الله تعالى لكل ماهو خير ومفيد ونافع لأمتنا<br />وتحياتي للجميع ،،،"
