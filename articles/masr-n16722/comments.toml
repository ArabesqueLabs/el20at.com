السعودية) 08:15 مساءً (جرينتش)<br />هع...والله شي يضحك!!ويييين الشجاعه ياشعبولا<br />54 - مصرى صميم<br />مصرى صميم|08/07/2008 م، 11:20 مساءً (السعودية) 08:20 مساءً (جرينتش)<br />الى موناليزة سلمتك يمينك<br />55 - الاخوان لا يعرفون التزوير يا سحس وللامانه انا بحبك في لله<br />كمال كحيل فلسسسسسسسسسطيني|08/07/2008 م، 11:32 مساءً (السعودية) 08:32 مساءً (جرينتش)<br />اولا تحيه طيبه لك يا اخ حسين كامل // وللامانه انا بحبك في لله واحترمك جدا رغم انك واطي ونفسي اشوفك علشان تاخذ علي قفاك هههه ويعجبني فيك يا سحس انك بتشد انتباه القارئ لتعليقاتك ويعجبني اكثر اخلاصك وبجنون لشئ احببته هو الحزب الحاكم فهذا ان دل يدل علي انك مخلص له بكل كيانك وجروحك وتدافع عنهم بكل قوه اتمني ان يقدروك ويخلصولك هم ايضا لانك تستاهل اكثر لك مني اطيب تحيه ومن كل قلبي // واليك يا سحس اقول أنا عرفت الاخوان يا سحس و أبناء حماس عن قرب، واذكر لك بعض صفاتهم، أسجلها شهادة للتاريخ، ولكي يبقى الأبناء والأحفاد على درب الآباء والأجداد. * إنهم يرتادون المساجد، ويؤدون الفرائض، ويخشعون في الصلوات، ويتقربون إلى الله بالنوافل والطاعات، ويكثرون من الذكر والتسبيح والصدقات، ولا يغفلون عن الصيام والقيام والدعوات، ولا يهجرون كتاب الله تعالى، فلا يمر عليهم يوم دون أن يقرءوا منه جزءاً، وهم يتلونه بتدبر وخشوع، ويحرصون على العمل بآياته، إذ يعتقدون أنه دستورهم، وأنه لا صلاح لأمتهم إلا إذا تمسكت به، واحتكمت إليه. * وإنهم يفهمون كتاب ربهم وسنة نبيهم ويتمسكون بهما، ويتخذونهما منهجاً يبنون عليه عقيدتهم وفكرهم وقيمهم وأخلاقهم وسلوكهم وجوهرهم ومظهرهم، فلا يضلون ولا ينحرفون، ولا ينخدعون ولا يفتنون ولا ينبهرون ببريق الباطل مهما تضخم وانتفش. *وهم ربانيون مخلصون يتوجهون بأعمالهم كلها إلى الله تعالى، ولا يسعون إلا إلى كسب رضاه، وقد هاجروا إلى الله ورسوله، وليس إلى دنيا يصيبونها، أو شهوة يقضونها، أو شهرة يحققونها، أو مال يكسبونه، وأسمى أمانيهم أن يخرجوا من الدنيا وقد رضي الله عنهم، يرددون بصدق شعارهم الخالد(الله غايتنا، والرسول قدوتنا، والجهاد سبيلنا، والموت في سبيل الله أسمى أمانينا)، ويقتدون في ذلك برسولهم الكريم صلى الله عليه وسلم، وأبيهم إبراهيم عليه السلام الذي قال:\\\" قل إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين* لا شريك له، وبذلك أمرت وأنا أول المسلمين\\\". * وهم قرآنيون في أخلاقهم لا يكذبون ولا يغشون ولا يغدرون ولا يسرقون ولا يرتشون ولا يخونون، ولا يخلفون وعداً، ويتجنبون الخمر والميسر والمخدرات والسجائر، يعيش واحدهم عمراً مديداً دون أن يدخل جوفه شيء من هذه السموم التي ابتلي بها أبناء الحضارة الغربية، فجعلت معظم شبابهم مدمنين تقتلهم الأمراض والأوجاع، وهم أطهار مطهرون يغضون أبصارهم عن ما حرم الله، ولا يقربون الزنا وإن دعتهم إليه ذات منصب وجمال، لأنهم يخافون الله الذي حرمه عليهم، خلافاً لغيرهم من شباب وشابات الغرب ومن فتن بهم، الغارقين في الفواحش والشذوذ بشتى صوره، والذين يفتك الإيدز بالملايين منهم كل سنة. * وهم أمناء يؤدون الأمانة ولو كانت قناطير مقنطرة من الذهب والفضة، ولا يمدون أيديهم إلى مال حرام ولو غاب الرقيب، أو كانت بهم فاقة، ولا يسرفون في المال العام عندما ينفقون على أعمال يكلفون بها، أو مؤسسات للحركة يديرونها، قدوتهم في ذلك سيرة نبيهم وتاريخ أجدادهم الحافل بالنزاهة والورع والحرص على أموال المسلمين، فقد كان عمر بن عبد العزيز-رضي الله عنه- يطفئ سراج بيت المال ويشعل سراجه الخاص عندما ينهي عمله الخاص بالدولة، وخفض راتبه عندما صار خليفة إلى أربعمائة دينار سنوياً، وكان راتب الخليفة السابق له أربعين ألف دينار، وكتب إلى والي المدينة الذي طلب منه ورقاً يكتب فيه أمور الولاية:\\\"أَدِقَّ قلمك وقارب بين أسطرك، فإني أكره أن أخرج من أموال المسلمين ما لا ينتفعون به\\\". * وهم متواضعون يحبون الناس ويحبونهم، ويحسنون إليهم ويسهمون في حل مشكلاتهم، ويتقربون إليهم، ويبشون في وجوههم مهما كانت أحزابهم وتوجهاتهم، ويحاولون أن يقربوهم إلى الله بالكلمة الطيبة، والابتسامة الصادقة، والحجة الواضحة، والقدوة الحسنة، والمعاملة الجيدة، ولا يتكبرون عليهم مهما علت مناصبهم، ولا تزيدهم المناصب إلا تواضعاً، لأنهم يعتقدون أنه لا يدخل الجنة من في قلبه مثقال ذرة من كبر، وهم رحماء ترق قلوبهم للأيتام والمساكين والأرامل والمحتاجين، وكرماء يجودون بأموالهم في سبيل الله. وهم يصلون أرحامهم، ويبرون بأمهاتهم وآبائهم، ويحافظون على أبنائهم وبناتهم وزوجاتهم، ويحسنون رعايتهم وتربيتهم، تقرباً إلى الله تعالى الذي جعلهم أمانة يسألون عنها يوم القيامة. * وهم متعلقون بالآخرة، وهي أكبر همهم، زاهدون في الدنيا لا ينافسون عليها، ولا يلهثون خلفها، ولا يتصارعون فيما بينهم على زعامة أو أمارة أو منصب، لعلمهم بأنها أمانة وأنها يوم القيامة خزي وندامة، وإذا ما كُلِّفوا بها من غير مسألة، عدُّوها تكليفاً لا تشريفاً، وقاموا بها خير قيام، وسخروها في خدمة دينهم ودعوتهم، قدوتهم في ذلك الصحابة الكرام أمثال عمير بن سعد الذي عزله عمر بن الخطاب عن ولاية حمص وضمها إلى معاوية، وعندما وصل إلى المدينة وذهب إليه عمر وأخذ يبرر له عزله ويُطَيِّب خاطره، قال له:\\\"والله يا أمير المؤمنين ما سرني توليتك ولا أحزنني عزلك\\\". * وهم مبادرون إلى الخير، لا ينتظرون الأوامر لفعله، مبدعون في التخطيط، متقنون للعمل، يملكون إرادة تزيل الجبال، وتخرق المحال، تؤرقهم مصلحة دينهم وأمتهم ودعوتهم ووطنهم أكثر مما تؤرقهم قضاياهم الخاصة، يأتمرون فيما بينهم بالمعروف، ويتناهون عن المنكر، ولا يتحرجون من تقديم النصح لإخوانهم وأمرائهم، جريئون في قول الحق، لا يخشون في الله لومة لائم، يجاهدون في سبيل الله بأوقاتهم وأموالهم وألسنتهم وأقلامهم وأنفسهم، يعملون أكثر مما يتكلمون، أكبر همهم إصلاح الناس وتعبيدهم إلى الله، وتحرير الأوطان من الاحتلال وحكم الطواغيت وإقامة منهج الله. * وهم يحفظون ألسنتهم، فلا يغتابون ولا ينُمُّون ولا يثرثرون ولا يفشون سراً ولا يسخرون من مسلم، ولا يفحشون ولا يَسُبُّون وإن استفزوا أو شُتموا، ويغضون أبصارهم فلا ينظرون إلى حرام، ولا إلى صور خليعة أو أفلام، ويحفظون أسماعهم من الموسيقى والغناء واللهو الحرام. *وهم يطيعون أمراءهم في المنشط والمكره، وفي اليسر والعسر<br />56 - لا فض فوك<br />د.منير|08/07/2008 م، 11:36 مساءً (السعودية) 08:36 مساءً (جرينتش)<br />يسلم فمك ياحسن - باين عليك فنان فعلا - رغم كل المعاناه التى نعيشها فى مصر انما نموت فى ترابها - شوفوا المصرى بعد الغربة ينزل من الطائرة يقبل الارض وتراب الوطن فى المطار - بينما مثلا مثلا يعنى - الخليجى المنعم فى خيرات الله لا يكف عن الشكوى - وغلاء الاسعار - لك الهه يا شعب مصر<br />57 - القرموطى رقم24<br />AHMED IRELAND|08/07/2008 م، 11:38 مساءً (السعودية) 08:38 مساءً (جرينتش)<br />انت تقصدنى أنا يا قرموطى أم تقصد من ؟<br />58 - الاخ حسن فنان<br />ادهم االبداري|08/07/2008 م، 11:45 مساءً (السعودية) 08:45 مساءً (جرينتش)<br />اولا ,, نشكر شعورك الجميل نحو الشعب المصري ,,, وانا مش هقول انت منين ,