لمحمول، وتم تركيب صوته وصورته بحرفيه على كلمات أغنية بعنوان \\\"أنا بأكره الرئيس\\\"،لتظهر علي شكل فيديو كليب. اكيد راح يسهل الله يسهل اموره ff2ff40@hotmail.com<br />11 - شعبولا الجبان<br />مصري قرفان|08/07/2008 م، 07:06 مساءً (السعودية) 04:06 مساءً (جرينتش)<br />هيييييييييييييييه<br />12 - الإجابه الصحيحه<br />المسحراتي المصري|08/07/2008 م، 07:08 مساءً (السعودية) 04:08 مساءً (جرينتش)<br />كلا لا أريد التعليق على الموضوع انشر ياجدو<br />13 - لايهمني<br />مغربي انا |08/07/2008 م، 07:09 مساءً (السعودية) 04:09 مساءً (جرينتش)<br />مشاكل مصرية داخلية لا تهمني ولا اعرف من هو شعبولا او بعبولا<br />14 - كما قال إنه أعد أغنية خصيصا لجمال مبارك، أمين لجنة السياسات بالحزب الوطني الحاكم، ليغنيها له في حفل زواجه، لكن لم توجه له دعوة لحضور هذا الح?<br />كما قال إنه أعد أغنية خصيصا لجمال مبارك، أمين لجنة السياسات بالحزب الوطني الحاكم، ليغنيها له في حفل زواجه، لكن لم توجه له دعوة لحضور هذا الح?/div> |08/07/2008 م، 07:14 مساءً (السعودية) 04:14 مساءً (جرينتش)<br />كما قال إنه أعد أغنية خصيصا لجمال مبارك، أمين لجنة السياسات بالحزب الوطني الحاكم، ليغنيها له في حفل زواجه، لكن لم توجه له دعوة لحضور هذا الحفل.<br />15 - مطلوب<br />موناليزا|08/07/2008 م، 07:14 مساءً (السعودية) 04:14 مساءً (جرينتش)<br />مطلوب شعبولا (مزيف ) لكل بلد عربي ...<br />16 - من تكون<br />علاء واصحابو |08/07/2008 م، 07:16 مساءً (السعودية) 04:16 مساءً (جرينتش)<br />لا ادري من يكون هدا الشخص والدي صار في في زمن التفهات شي في نظر البعض فلا صوت ولا كلمات ولا شكل<br />17 - يمكنني فقط أن أقول أن من قام بصنع الشريط المزيف من الجبن بما كان أن لايقول أنا فعلتها ....فعلا طيور ظلام !<br />محمدع.الأسكندرية|08/07/2008 م، 07:16 مساءً (السعودية) 04:16 مساءً (جرينتش)<br />يمكنني فقط أن أقول أن من قام بصنع الشريط المزيف من الجبن بما كان أن لايقول أنا فعلتها ....فعلا طيور ظلام !<br />18 - التزوير<br />حسين كامل|08/07/2008 م، 07:20 مساءً (السعودية) 04:20 مساءً (جرينتش)<br />لم تجد المعارضة والمتأسلمين من وسيله غير التزوير !! والتزوير يعنى ان الشعب المصرى ملتف حول الرئيس مبارك فلم تجد المعارضة غير التزوير الرخيص .. واخيرا تحية من القلب الى الرئيس والزعيم والحكيم حسنى مبارك وتحية الى المطرب البسيط شعبان عبد الرحيم الذى قال (( وقد أكدت في الخطاب للرئيس أن روحي فداء الرئيس وأنني أعد الآن لأغنية (أنا بحب الرئيس ) تعبيرا عن حبي وإخلاصى لكبير البلد \\\".. المطرب الشعبى الامى البسيط يتكلم عن الاخلاص للبلد الكبير مصر بينما المعارضة والمتأسلمين ينهشون فى جسد هذا البلد الذى قدم لهم الكثير بينما هم ينكرون كل ذلك ويحدثون عن الفساد والفقر من داخل قصورهم وفللهم .<br />19 - ههههههههه<br />خالد|08/07/2008 م، 07:21 مساءً (السعودية) 04:21 مساءً (جرينتش)<br />ههههههههه ياجبان يا شعبولا<br />20 - اسهاااااااااااااااااااااااال مره وحده<br />مجرد رأي |08/07/2008 م، 07:21 مساءً (السعودية) 04:21 مساءً (جرينتش)<br />تذكر يوم الحشر وأنت بين يدي رب الملوك ورب كل شئ<br />21 - هلا عمي شعبولا<br />وهيييه|08/07/2008 م، 07:24 مساءً (السعودية) 04:24 مساءً (جرينتش)<br />سبحان الله زمن ينطق فيها الرويبضه<br />22 - شعبان عبد الرحيم -----والنعم<br />ماجدة العراق|08/07/2008 م، 07:30 مساءً (السعودية) 04:30 مساءً (جرينتش)<br />ما دام شعبولا يعيش في مصر فسيصسبه الف اسهال ------مو اسهال واحد ------فلتحيى حرية الرأي في امصر وجميع البلدان العربيه<br />23 - دع الكلاب تنبح<br />على عطيوه|08/07/2008 م، 07:34 مساءً (السعودية) 04:34 مساءً (جرينتش)<br />الرئيس مبارك شامخ وايه يهزك يا جبل.<br />24 - كأنه يقول هذا ليس تعليقي<br />القرموطي|08/07/2008 م، 07:42 مساءً (السعودية) 04:42 مساءً (جرينتش)<br />موقف شعبولا هذا يذكرني ببعض الأخوة المعلقين عندما ينفوا تعليق ما من خلال العبارة الشهيرة ( هذا ليس تعليقي ) -- وخاصةً هؤلاء الذين يكتبون التعليق وعندما لا يعجبهم لسبب ما يسارعوا بنفيه ( وهم كاذبون بالطبع ) -- فأنا أعتقد ( حسب ما فهمت من الموضوع أعلاه ) أن هذه الأغنية من أداء شعبولا -- وواضح أنها أغنية جميلة -- فلماذا ينكرها !!!!<br />25 - و ايييييييية<br />Realman208|08/07/2008 م، 07:47 مساءً (السعودية) 04:47 مساءً (جرينتش)<br />هو شعبولا جالة اسهال لية ؟؟؟ و ليييييييييييييييييية<br />26 - سيدي الرئيس واني احبك.<br />احمد سمير|08/07/2008 م، 07:48 مساءً (السعودية) 04:48 مساءً (جرينتش)<br />ايها الساده ليس هذا الشعبان من يحب سياده الرئيس حفظه الله بل نحن