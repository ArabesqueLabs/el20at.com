text = "لا رحمة بالمخطئ يا اخت دعاء لو ان فاطمة بنت محمد سرقت لقطع محمد يدها كما قال الرسول عليه الصلاة والسلام وفى القران جزاؤهم ان يقتلوا او يصلبوا او ينفوا من الارض وفى حالة الشاب هو ان ينفى من الارض طالما لم يؤدى احدا وعلى الاقل يتجنبهالناس و>;للك لكى لا تشيع الفاحشة بين الناس والله اعلم<br />وفقك الله الى ما يحبه ويرضاه ومبروك"
