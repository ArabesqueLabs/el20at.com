text = "انا ضد موقف اسرته تمام بانقطاعهم عنه ونفورهم منه .. لان ده خطأ جسيم .. اى نعم هو غلط لكن دفع تمن غلطه كبير قوى وهو ان ربنا بلاه بمرض ربنا يحمينا منه جميعآ وهو مرض \" الايدز \" .. يعنى خلاص بقي مش هانبقي احنا والزمن كمان عليه ..<br />المفروض ان كل اللى حواليه يساعدوه ويحسسوه انه مش لوحده .. لان الوحده بالنسبه لشخص زى ده هاتزيد من المشكله مش هاتحلها ابدآ .. !<br />ده رب البشر بيغفر ويرحم .. احنا مش عارفين نرحم .. ده ايه ده ؟؟!!"
