[[comments]]
order = 8
subject = "حتي لا تختلط الامور"
author = "الاسمر ابن النيل"
posted = "2007-05-28"
text = "السيدات و السادة ... السلام عليكم<br />اولا يجب التفرقة بين مريض الايدز و الانسان الشاذ (الشاذة)<br />فاذا كان مرض الايدز اصاب الانسان من جراء التلوث سواء دم او حقن او حشرات او حيوانات... فهذ ابتلاء من الله عز و جل و يجب ان نقف بجانب هذا الشخص و ان يتم علاجه بقد المستطاع مع كثير من الشفقة لان في معظم الحالات ان لم يكن كلهت يكون العلاج لا رجاء منه<br />اما اذا كان الانسان شاذ(ة) فلا يجوز ان نقول انه مريض و يجب علاجه و مساعدته و ذلك ليبب بسيط جدا و هو ان الله سبحانه و تعالي لا يمكن ان يخلخ داء ثم يجعل له ذنب او عقاب...ايا كان هذا الداء نفسي او عضوي او عقلي... فهل سمعنا ابدا عن عقاب لمريض القلب او الكلي او المريض النفسي او العقلي.. و ذلك لان الله ابتلاه بهذا المرض فمستحيل ان يعاقبه عليه.. فاذا كان الشذوذ او المثلية مرض كما يقول البعض... فكيف يشرع المولي عز و جل عقابا له.<br />و ايضا في حالة اصابة الشاذ بمرض الايدز فيجب ايضا ان نوفر له العلاج... اما عقابه علي كونه شاذ... فهذه متروكة للمولي سبحان يغفر لمن يشاء... و لكن لا يصح ان نتعطف معه من باب ان مريض بهذا الداء... فهذا غير صحيح... والله اعلم"
archived = "2010-03-14"
capture_url = ""
