[[comments]]
order = 4
subject = "الرحمه فوق كل شىء"
author = "نيفين نيفى نوفا"
posted = "2007-05-19"
text = "زى ماقا ل او قالت not important فعلا ان لما اكتشف ف التمانينات ف امريكا كان الاعتقاد السائد انه بين الشواذ و لكن بعد كده كلنا عرفنا انه بالدم و بحاجات تانيه كتير و ان كان ساد ف بعض الوقت اقوال انه انتقل ف الاصل من الحيوان للانسان ف البلدان الافريقيه الاستوائيه<br />و احب اوضح ان دعاء مذكرتش ارتباط بين كونه gay و كونه مصاب بالايدز<br />و ف كل الاحوال الفيلم فعلا معبر و من نوعيه افلام احنا مفتقدينها فعلا ف الفضائيات و ف التكثيف الاعلامى مع انها كتير بتبقى زى كبسوله تلخص بيها ف 5 دقايق فيلم مدته ساعتين و هنا بيظهر الابداع لان التركيز بيبقى على الكيف مش الكم<br />اما لو جينا بقى لبيت القصيد و هو رايى ف التسامح مع انسان زى بطل الفيلم فعايزه اقول عيب يا جماعه<br />من غير سؤال طبعا نتسامح<br />التعليقات الللى فوق اللى بترفض التسامح مع انسان وحيد انا بجد مش فاهمهاها<br />ايا كان المه فالم الوحده اصعب ف ظل مرض الموت مبيجيش فيه بسرعه..يا جماعه ده ربنا من اسماؤه الحسنى الرحمن الرحيم...يا ريت نفكر ف الموضوع ده شويه<br />الرحمه فوق كل شىء<br />كل شىء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "الموضوع مش موضوع شفقة"
author = "بنت مصر"
posted = "2007-05-19"
text = "أولا : أنا شايفة ان معالجة أهل الولد للموقف كانت غلط لأنه على اي حال ده مريض .. ومش هي دي الطريقة اللي المفروض يتعامل بيها ..<br />لكن في نفس الوقت يا جماعة الموضوع مش موضوع شفقة ولا موضوع مرض في حد ذاته ... الموضوع ان من الناحية الشرعية الولد ده حكمه زي ما قال كل العلماء المووووت لأن بيفعل فاحشة وهي فاحشة أهل لوط ... وحكم ربنا فيها ايه ؟ ان البلد كلها جه فوقيها تحتيها ... ده مش مسالة ان واحد مختلف , لا ربنا خالقنا كلنا على الفطرة لكن هو اللي خلى نفسه مختلف .. وكمان مش مسالة انه مش بيأذي حد , لأنه وجوده بالشكل ده في حد ذاته أذية للمجتمع بنشر فاحشة<br />ممكن يكون رأي يضايق ناس كتير ويقولو من غير قلب ... لكن حكم ربنا فوق راسنا ... وشكرا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "ليه مش نعالج ؟!!!!!!"
author = "شرين منصور"
posted = "2007-05-20"
text = "السلام عليكم الفيلم قوي جداااااا واحنا اهو بنعرف نعمل حاجة امال ايه السينما اللي بنشوفها دي ،المهم أولا الفيلم اتعرض لقضيتين أخطرمن بعض (المثلية)(الايدز) اولا المثليية ،ده مرض ليه اسباب اجتماعية وأسرية من الدرجة الاولى يبقى ليه طالما البيت مذنب يبقى نتعامل معاه على انو مريض وانو مختلف عننا المفروض البيت في المراحل الاولى من مراحل الطفل ان يبقى في اهتمام من الاب والام خاصة زي ما شفنا خالد الصاوي في فيلم عمارة يعقوبيان،اما مرض الايدز هو مرض مش بيتنقل بس عن طريق العلاقة الحميمة بس لكن ممكن برضو عن طريق الحقن وهو مرض لابد انا نقف جنب المريض بخلاف الأسباب اللي نقلتلو العدوى ... ليه دايما بنبقى احنا والمجتمع عليهم انا على فكرة بيصعبوا عليا جدااااااا عشان بدل ما ننور ليهم الطريق للعلاج بنبقى اصعب من الجلادين نفسهم هما في الاول والاخر بشر كانو كويسين في يوم من الايام وبقوا مرضى بسبب المجتمع برضو .....لو قالولي اتمني حتمنى ان اعمل عيادة تعالج المثليين بالطرق الطبية والنفسية والاجتماعية اللي تؤهل المريض للرجوع لحياتو الطبيعية ...الحمد الله الذي عافانا من كل مرض"
archived = "2010-03-14"
capture_url = ""

