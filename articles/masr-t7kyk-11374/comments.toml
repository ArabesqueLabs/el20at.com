text = "والله برافو عليك يا أستاذة لا تحرمينا من أفكارك الجميلة ألله يرحم والديك ويبارك في زوجك ، تعيشي يا ستي وتدبري ، على وزن:sad:( انتي اللي طلبتي تطلقي)) ، ،،،وتوكليني البايت ، والبارد، وأكل القطط ،والله أنت ممتازة ، القطط أخدوها بتوع المطاعم وحطوها في السندوتش للغلابة اللي نفسهم في اللحمة ، والله عال بايت بارد حمضان نشفان مصوف مخوخ كله بثوابه والمعدة المصرية حديد في (حديد عز ) لا مؤاخذة الفكرة حلوة وضرورية في ظل المعيشة اللي انتي عارفاها مشكورة وسيبك من الواد اللي كاتب قبلي"
