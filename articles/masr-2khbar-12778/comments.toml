text = "الاختراعات اللى بيتكلم عليها الاخ تدل على انة مخبول او عندة زهايمر بدرى<br />هيشغل السيارة بالمياة من تحليل الماء الى هيدروجين واوكسجين وعمليا هذا الجهاز وزنة ضعف وزن السيارة وهناك تجارب للشركات العالمية مثل فورد ومرسيدس وبتصرف ملايين الدولارات على وحدة خلية الهيدروجين والموضوع تجارب وفشلت احيانا ونجحت فى احيان اخرى وقيد الدراسة فى المعامل<br />وبعدين ييجى واحد مصرى بيتعلف فول كل يوم وقاعد على المصطبة ويقول اختراعات<br />بطلوا خبل بقى"
