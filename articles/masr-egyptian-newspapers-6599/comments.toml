subject = "محفوظ عجب 2007"
author = "زكى الدبور"
posted = "2007-07-09"
text = "مسكين حمدى رزق ، يعيش مأساة حقيقية ، قال على الاخوان ما قالة مالك فى الخمر,ولكن الحكومة خذلتة وجائت بعبداللة كمال ( للنباح ضد اعدائها رغم ان حمدى قادر على النباح للصبح) ، وعمل سفرجى لمكرم لمدة 10 سنوات واكثر ولكن مكرم استخسر فية الكواكب او الهلال وجاء مجدى الدقاق، وعاش حمدى رزق دور انة يحمل تكليفات من الامن القومى فى ملف السودان الذى يغطية فى مجلة المصور ولكن لم ينفعة الامن القومى حتى برئاسة تحرير المصور( قال يعنى المشرحة ناقصة قتلى) وجاء عبد القادر شهيب، وجرى حمدى رزق وراء كل البرامج التليفزيونية و الفضائيات ووصل بة الامر الى انة يذهب الى التليفزيونات اكثر مما يذهب لجريدتة ، ومرة ثالثة تخذلة الاسياد ويخرج حمدى بخف حنين، ولعب خمدى رزق على وتر طائرة الرئاسة ولكن خد صابونة ولم يعيرة احد اى اهتمام.<br />حمدى رزق ظاهرة صوتية ،يجيد اللعب على كل الحبال و استغلال الظروف ، وزرع الاحقاد والكراهية، ولكن للاسف جاء متاخرا فقد سبقة عبداللة كمال وقش الورق بلبصرة ، وصار حمدى رزق مثل شايب الكوتشينة لامعنى لة و اى فائدة ولكن دورة مطلوب على الاقل كاكمالة عدد.<br />واليوم يلعب حمدى باخر اوراقة وهى سفرجى مكرم محمد احمد فى الانتخابات القادمة ،ولكن هل يضمن حمدى اى شيى من وراء مكرم؟؟؟؟؟؟؟؟؟؟؟<br />وماذا لو سقط مكرم؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />تطهر ياحمدى من داخلك اولا، وانزع من دمائك تاريخ (محفوظ عجب) الذى تفتخر بانك تحفظ فصول كاملة من هذة الواية عن ظهر قلب !@!!!!!!!!!!<br />طبعا لانها قصة حياتك الحقيقية؟<br />وربنا يشفى الكلاب و.................................<br />زكى الدبور"
