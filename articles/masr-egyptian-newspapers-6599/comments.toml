text = "برغم إني كتير بأحاول أعصر علي نفسي غيطان ليمون عشان اصرف عن فكري اني أتعامل مع حمدي رزق باعتباره صحفي وبس ...<br />لكن الي بيطرحه غالبا بيدفعك دفع إنك ..... ولا بلاش ...<br />حارد رد لأول مرة أتعامل بيه مع حد صحفيا ...<br />غفر الله له ولنا .....<br />بس خلاص<br />يارب مش حاسكت<br />لا للتمديد ...لا للتوريث ... نعم لتعديل الدستور المصري \"أظنه الشعار غير المناسب .. لمشكلة أكبر من هذه الكلمات\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي ...<br />http://mesh7askot.blogspot.com/"
