[[comments]]
order = 2
subject = "ماذا فعلوا بك"
author = "hasan"
posted = "2007-11-05"
text = "بعد أن تعبت من كثرة التفكير في موقف الاستاذ الموقر المبجل المحترم الفذ المخضرم خمدي زرق وبعد قراءتي المتعددة للحالات المشابهة وبعد اسئلتي لعلماء النفس والاجتماع والطب النفسي جاءني الرد التالي :<br />كل من حدث له اعتداء جنسي وهو صغير مسكين _ اذا لم يعالج نفسيا _ يتحول الي شخصية سيكوباتية مخضرمة فذة ناهشة لاعراض الناس وهو في كل مرة يتذكر الاعتداء ولحظات الاعتداء ولحظات الاعتداء ولذة الاعتداء !!!!!<br />فعلا فعلا اقنعني هذا التفسير ولكن اعتقد انه في حاجة الي بعض التبسيط للقراء الاعزاء فكثير من مصطلحات الاطباء ليست سهلة فما معني لحظات الاعتداء ولذة الاعتداء . هذا كلام معقد المعني يا سادة ان السيد المخضرم هو بالفعل مخضرم في اصول الدق نعم دق يدق دقا اي انه دق برفع الرجلين الي اعلي عفوا برفع الدال . ولكني ايضا متشكك في هذا التفسير فما اعلمه عن الاخوان انهم مؤدبون ولا يدقون أحدا ولكني تذكرت انه ليس بالضرورة ان يكون قد دق ( برفع الرجل )<br />بالفعل ولكن هذه كلها أعراض معروفة ومسجلة في المراجع الطبية لمرض اسمه madooa men el ehkwan وهذا مرض بسيط جدا والشفاء منه مضمون جدا يتلخص في اسلوب المحاكاة الفعلية وانا علي استعداد تام في مساعدة الاخ خمدي دق برفع القاف اقصد برفع الرجلين ويمكن الاكتفاء بواحدة اي برجل واحدة لان الغرض سيتم وهو الاكتفاء التام والشفاء التام ودمتم"
archived = "2010-03-14"
