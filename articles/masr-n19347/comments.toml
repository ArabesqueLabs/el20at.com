[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "قل خيرا أو اصمت"
posted = "2009-01-19"
text = "عادل إمام طول عمره رجل النظام الذي يستخدمه بأعماله للضحك على الشعب المصري الذي يثور ويكره بس في الآخر لاشىء ى تغيير- وعدين ماله ومال المقاومة ولا هي عايز بس يرضى سيده النظام المصري هلا سكت أفضل"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192649/http://masr.20at.com:80/newArticle.php?sid=19347"

[[comments]]
order = 3
subject = "انتم خليتوا لهم قيمة"
author = "محمد"
posted = "2009-01-19"
text = "للاسف تنظيم القاعدة بيدى للبهلوان ده قيمة والله بجد حرام عليكم الكلام ده بيديله شهرة ويعمل لنا فيها شهيد الكلمة ومحارب قوى الظلام وهو انسان وصولى قذر زى شخصيات الحزب اللى ربنا ابتلانا به"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192649/http://masr.20at.com:80/newArticle.php?sid=19347"

[[comments]]
order = 4
subject = "موتوا بغيظكم"
author = "أبو حميد"
posted = "2009-01-19"
text = "عادل إمام من أنجح و أعظم الممثلين فى العالم<br />و مش هييجى شوية إرهابيين و متخلفين زى اللى بيقولوا عنه إنه عميل و بهلوان و حاجات زى دى علشان يقللوا من قيمته عندنا<br />عادل إمام أكبر من كل تفكيركم المغيب المسطح يا حمار منك له<br />إستمر يا أستاذ عادل ولا تلتفت لقوى الإرهاب و الظلام فى العالم العربى<br />حفظك الله لنا جميعا يا زعيم<br />ولكل اللى كاتبين تعليقات مش كويسة عن النجم الزعيم عادل إمام أقول : موتوا بغيظكم"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192649/http://masr.20at.com:80/newArticle.php?sid=19347"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2009-01-19"
text = "خليك نايم في العسل<br />وخليك قاعد في العمارة اللي فيها السفارة<br />وانت ولا زعيم ولا حاجة<br />وانت ما شفتش حاجة ولا بتعرف حاجة<br />وانت من الاخير خارج الدائرة"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192649/http://masr.20at.com:80/newArticle.php?sid=19347"

[[comments]]
order = 6
subject = "الزعيم البهلوان"
author = "محمد"
posted = "2009-01-19"
text = "لا مش هنموت بغيظنا هنعيش عشان نضحك على التافهين اللى زيكم والاسطوانه المشروخة بتاعه الارهاب وقوى الظلام دى فكك منها يا امور"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192649/http://masr.20at.com:80/newArticle.php?sid=19347"

