[[comments]]
order = 0
subject = "عادل امام ------ ابن عسكرى درك من اصل وضيع - اتعلم"
posted = "2009-01-18"
text = "ممثل صعد بالتهريج<br />وظهر فى ادوار مشبوهة زى كوهين ومرقص<br />وهو فى النهاية ابن وسخة ارزقى ومتسلق وعايز يظهر فى الصورة باى طريقة"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192649/http://masr.20at.com:80/newArticle.php?sid=19347"

