subject = "دعونا من العنصرية"
author = "محمد عبدالله"
posted = "2008-10-26"
text = "إلقاء اللوم على الأجانب أمر مستغرب . هل ضرب أحد على يد هؤلاء الشباب السعوديين ليقعوا في الزنا؟؟ الذنب ذنبهم أولاً وآخراً اتهام \\\"الأجانب\\\" هي عادة سعودية عنصرية كريهة شفاهم الله منها ."
