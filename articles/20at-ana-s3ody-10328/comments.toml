subject = "وساء سبيلا"
author = "أحمد سلامة"
posted = "2008-10-27"
text = "هذا ابتلاء وعقاب من الله عزوجل على من انتهك حرماته ولا نحمل شماتة (لاسمح الله)ولكن ندعوا لهولاء بالهدايه والتوبه النصوح والندم على الذنوب اكا بالنسبه لضحايا نفل الدم الملوث فنقول لهم اصبروا واحتسبوت فاجركم على الله"
