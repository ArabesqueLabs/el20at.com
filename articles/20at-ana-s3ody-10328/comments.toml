[[comments]]
order = 2
subject = "وأنفسهم كانوا يظلمون ..."
author = "محمد نواف"
posted = "2008-10-27"
text = "الذنب الذي يقترفه الإنسان في حياته بملئ إرادته .. هو ذنب - بلاشك - يتحمّل تبعاته، وآثاره، ونتائجه عليه لا على غيره ..<br />لذلك لا يجوز إلقاء اللوم والعتاب على الأجانب ( الغربيين ) .. صحيح، قد يكون لهم يد بذلك، ولكن لمذا نستضيفهم إذاً ؟؟ ولماذا نقوم بجلبهم إلى بلد عربي مسلم ( كالممكلة العربية السعودية أو أي بلد عربي آخر ) ؟؟ أليس من المفترض قبل أن ندخلهم إلى بلادنا أن نقوم بعمل فحوصات طبية شاملة لهم ( كما يوجد الآن بالإمارات منذ فترة من الزمن ليست بقصيرة ) !!<br />دعونا من كون أن الحكومة لا تفعل شيئاً حيال ذلك !! المشكلة تكمن في أنفسنا عندما نقوم بعملٍ فاحش ما ( كالزنا مثلاً ) .. نزني .. ونزني .. ونزني !! قم نقول (( أليس الله بأرحم الراحمين )) .. كلا، إطلاقاً الإنسان الذي يفكر بهذه الطريقة العوجاء الغبية، إنسان واسمحو لي بهذا اللفظ ( بهيمي ) لانه لا يُدرك، ولايعي، ولا يفقه بأن المداومة والإستمرارية في فعل تلك الأعمال الشنيعة هي مخالفة صريحة وواضحة للمنهج الرباني، والتشريع السماوي .. بالعكس إصراره على فعل ذلك الشيء قد يزيز من عذابه يوم القيامه، وسيندم ندماً لا مثيل لهُ .. هذا عداك عن عذاب وألم ومعاناة الدنيا، من إصابته بالإمراض الجنسية الفتاكة ( كالإيدز، والسيلان، والزهري .... والقائمة تطول ) الله يعافي الجميه .<br />هذه فرصة لا يمكن تفويتها على أنفسنا - نحن الشباب والشابات - .. لأن إذا وقع الفأس بالرأس .. لا يوجد ساعتئذٍ من يُشفي !!<br />كل الشكر //"
archived = "2010-03-14"
