subject = "كل شىء هادىء فى الميدان الغربى"
author = "مغاورى"
text = "سألت الشيخ الدرديرى شيخ زاوية الحاج غريب - يا عم الشيخ اية حكاية الفقر والقحط والضنك دة والناس مخنوقة ومش عارفة تعيش - الحل اية - لا معيشة مريحة - لا زواج ولا ستر للبنات - الناس بتكلم نفسها<br />سكت<br />الشيخ شارك فى حروب مصر فى سيناء ايام شبابة<br />قال لى - لما كنا بنحارب وبنقول لا صوت يعلوا على صوت المعركة - كانت الناس عايشة كويسة- ماكنش فية طوابير عيش<br />كانت فية شقق للايجار وكانت البنات بتتزوج وتتستر<br />كان فية ديكتاتورية - اة - كان فية -لكن حياة الناس لم تمس<br />انما دلوقتى القحط والفقر موجود لان عصابة على بابا بتشفط فلوس البلد وتحطها فى المغارة<br />مفيش امل<br />ولا ادنى بصيص للامل<br />طيب يا عم الشيخ اية رأيك فى الاسلام هو الحل - هل هو الحل فعلا<br />قال<br />لا تحملوا الدين اكثر مما يتحمل<br />لا الاسلام هو الحل ولا الشيوعية هى الحل ولا يوجد اى حل الا من عند اللة سبحانة وتعالى<br />ثم اردف<br />الحرق هو الحل<br />احرقوا كل حاجة - ولعوا فى كل حاجة - وبعدين ابنوا على نظافة"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915031722/http://masr.20at.com:80/newArticle.php?sid=17567"
