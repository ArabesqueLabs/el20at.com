author = "أُختــك في الله .  ."
posted = "2009-12-07"
text = "السلام عليكم . .<br />قال النبي صلى الله عليه وسلم (( لأن يطعـن في رأس أحدكم بمخيط من حديد خيرٌ له من أن يمس إمرأة لا تحل له ))<br />و هذا هو حال \" أبو زهرة \"<br />و قال النبي صلى الله عليه و سلم (( العين تزني و زناها النظر و الاذن تزني و زناها السمع و اللسان يزني و زناه الكلام و اليد تزني و زناها اللمس و الرجل تزني و زناها المشي و القلب يشتهي و يتنمى و الفرج يصدق ذلك كله أو يكذبه ) أو كما قال النبي صلى الله عليه و سلم<br />أما بخصوص العريس الذي يبعث بعروسه إلى (( رجـــــــل )) ليُزينهــا له فهـــو (( دَيُّــــــــوث )) يقــر الخبث في أهله .. أين غيرة هذا العريس على عروسة ؟ الحيــوانات الذكور تغــــــار على إناثهـــا<br />فأين ذهبت غيــرة و نخــــوة الرجـــال ؟<br />كان سيدنا علي بن أبي طالب رضي الله عنه يغــــــــار من عود الســـواك التي تضعه السيدة فاطمــــــة بنت النبي صلى الله عليه و سلم في فمهـــا<br />أيــــــــن الرجــــــــال . . !!<br />اما بخصوص مكسب \" أبو زهرة \" و من على شاكلتهِ فهو مــــال حــرام ."
archived = "2010-03-14"
