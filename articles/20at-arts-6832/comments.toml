subject = "بلا تعليق"
author = "فوق العشرين"
posted = "2007-11-07"
text = "سر نجاح سلسلة هاري بوتر هو اختلافها التام عن أي أدب خيالي قرأناه من قبل , نحن لا نعرف أدب الخيال بمعناة الحقيقي في مصر او الوطن العربي , صحيح أن هناك محاولات نشأت مثل محاولات د. نبيل فاروق في ملف المستقبل او د. أحمد خالد توفيق في ما وراء الطبيعة و طبعا كلنا عشقناها و أحببناها و لكن تلك الروايات اعتمدت على أساس علمي و تحليل علمي و تفصيلي لكل موقف فيها و محاولة و ضع تبرير لكل حدث كأن الخيال يجب أن يكون معتمدا على واقع !!!! و اهتمت بأحداث القصة على حساب ثراء الحوار و الشخصيات , سر نجاح رولينج و اسمحوا لي بقول هذا هو انطلاقها الى الخيال اللامحدود و تجديدها في كل تفاصيل قصتها و ثراء شخصياتها سواء تلك الرئيسية او حتى الفرعية , فهي اهتمت بكتابة قصة رائعة الحبكة , بشخصيات عميقة ثرية الحوار تحتوي على فلسفة عالية المستوى , صحيح أنها اعتمدت في روايتها على القتال ما بين الخير و الشر التقليدي و لكنها انفردت بتقديمة في حوار عالي المستوى في قصة للأطفال .... و اختلف مع من ينسبون نجاح القصة الى الأفلام , لأن ( و كل من قرأ القصص سيوافقني ) القصص أكثر ثراء من الأفلام وهي الكاتبة الوحيدة و الفريدة التي استطاعت فعل ذلك ... لكن .... وآ آه من لكن ... نحن في أدبنا ما زلنا نخاطب الطفل بقصص لولو و توتو وما شابه ذلك ... رغم اختلاف نوعية الطفل و ذكاءة الآن عما نشأنا عليه نحن."
