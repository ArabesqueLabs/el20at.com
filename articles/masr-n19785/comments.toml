[[comments]]
order = 0
subject = "ممكن شراء شاسية رقمى لنفس التليفزيون وبالريموت وب"
author = "فنى تليفزيون"
posted = "2009-02-05"
text = "ادعوا ان ربنا يطول عمر حكومة الصين الشعبية راعية الانسان الفقير فى مصر<br />فجميع ملبوساتنا واحذيتنا وقطع كمبيوتراتنا والمكائن البسيطة من الصين الشعبية<br />وانا اتابع اخبار حكومة الصين اولا باول ولا شان لى بالحكومة المنظر"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074929/http://masr.20at.com:80/newArticle.php?sid=19785"

[[comments]]
order = 1
subject = "مما يجبر المواطنين على شراء أجهزة جديدة تتضمن وحدة"
author = "مش رجل اعمال حرامي"
posted = "2009-02-06"
text = "انا اقولكم الحكاية<br />الحرامية الكبار رجال الاعمال عايزين يكسبولهم كام مليار لكل واحد ففيه حاجه اسمها الافكار الاقتصادية<br />يعملوا ايه<br />يعملوا شاشة رقمية علشان خاطر 80 مليون مصري ينزلوا يجروا يشتروا الشاشة الرقمية دي<br />وطبعا فيه واحد من الحرامية الكبار حيحتكر استيراد الشاشات او التلفزيونات الرقمية وحتدخل البلد عن طريقه<br />وبالتالي حتنزل عليه المليارات وعلى رجال اعمال مصر حفظهم الله<br />والشعب المصري المسكين حيدفع ورجله فوق رقبته"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074929/http://masr.20at.com:80/newArticle.php?sid=19785"

