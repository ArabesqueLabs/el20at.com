text = "يا ريت كمان نستغنى عن الحكومة القديمة وتبقى حكومة من غير شفرة ومتاحة للجميع ويا ريت لو ممكن رئيس جديد بالمرة و يكون بلالوان مش ابيض واسود من ايام نجيب الريحانى."
