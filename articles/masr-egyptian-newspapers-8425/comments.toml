[[comments]]
order = 0
subject = "منين نجيب مياه؟؟"
author = "د. أحمد عزب"
posted = "2008-03-06"
text = "الي السيد محمد ابو حديد سؤال واحد: منين نجيب مياه نزرع قمح كفاية للأفواه الزيادة اللي بتزيد 2 مليون كل سنة؟ مصر ليس لديها اي مياه فائضة وعلى فكرة، السعودية السنة الجاية هتدخل سوق استيراد القمح كمستورد رئيسي لـ 3,8 مليون طن سنوياً. ساعتها طن القمح هيوصل بسهولة الي 500 دولار ... هنعمل ايه ساعتها؟؟ ده كله بسبب التزايد السكاني الرهيب. اقترح تفعيل سياسة قومية لمواجهة الزيادة السكانية تتضمن تعقيم اجباري لمن ينجب الطفل الثالث."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "بلاش ححج فاضية بقا"
author = "ابوصالح"
posted = "2008-03-06"
text = "للاخ الفوقى لما الناس تزرع القمح والدولة مترضاش تشترية يعمل اية الفلاح بالمحصول وهو ماكان يحدث فى الاعوام السابقة وبداءت تنتبة الدولة هذا العام لذلك واخيرا رضيت تشترى محصول القمح من الفلاحسن بسعر معقول هذا العام ولو كنا بنشجع الفلاحين على زراعة القمح من سنوات كنا اصبحنا لاتوجد عندنا مشكلة قمح ولا ديولة لكن نعمل اية فى المسئولين الماشين بودن من طين وودن من عجين ومش عايزين حجة الزيادة السكانية والكلام الفاضى البيرددوة دايما دة فكل دب على الارض ولها رزقها وبلاش حجج فاضية بقا البلد دة لو كنا بنصلح فيها بجد من 25سنة كنا زمان من احسن دول العالم اقتصاديا وسياسيا ومالى ذلك ... وشكرا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ممكن الاكتفاء من القمح ذاتيا بعد سنة واحدة"
author = "ابو حديد والحمار اللى مشغلة"
posted = "2008-03-07"
text = "ابو حديد - حمار حصاوى زى البقرة اللى مشغلاة الشغلانة دى<br />سوريا ليس فيها انهار وبتزرع قمح وبتصدر منة جزء لمصر<br />فية حاجة يا جهلة اسمها الزراعة على ماء المطر<br />والقمح من المحاصيل اللى بتنجح على المطر - لانة يحتاج انة يشرب مية مرتين فى حياتة وعمرة 3 شهور<br />يعنى ممكن نزرع الساحل الشمالى كلة قمح<br />وممكن نزرع شمال سيناء قمح على ماء المطر<br />بس نعمل اية لثلاثة او اربعة مستوردين للقمح ومحتكرين استيرادة علشان يكسبوا ملايين من جوع الشعب<br />وللاسف المستوردين الكبار للقمح والمحتكرين لة اعضاء فى لجنة السياسات<br />حسبنا اللة ونعم الوكيل"
archived = "2010-03-14"
capture_url = ""

