subject = "نابليون مجرم حرب انضرب بالجزم فى مصر وهرب بالليل و"
author = "مصرى"
posted = "2008-10-18"
text = "مش هو نابليون المجرم اللى دخل الازهر بخيولة<br />مش هو اللى ضرب القاهرة بالمدفعية من جبل القلعة<br />مش هو اللى قتل 3 الاف شاب من غزة بالسلاح الابيض<br />مش هو اللى حرق قرى فى الصعيد<br />بيحتفلوا بية لية ولاد الك<br />هذا شخص صليبى حاقد جاء فى حملة صليبية على مصر انتهت بالفشل والهرب<br />مش نابليون دة اللى فكر من بدرى يعمل لاسرائيل دولة فى فلسطين<br />يبقى بيحتفلوا باية<br />يلعن ابوهم كلهم"
