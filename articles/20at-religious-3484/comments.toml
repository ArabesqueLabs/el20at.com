[[comments]]
order = 7
subject = "(وقرن فى بيوتكن)"
author = "ayat alla"
posted = "2007-04-17"
text = "من احترام الرأى ألا ارغم احد على عدم التعبير عن رأيه كل انسان يعطى رأيه باحترام ولا يحجر على رأى أحد هذا ما اردت ان اقوله للأخوة الذين كتبوا تعليقات.أما عن رأى فأنا كفتاة لا أقبل ابدا بمثل هذه المسابقات كما قالت الدكتورة ثريا البدوى كما انه من الطريف ان نمتحن درجة بر الوالدين كيف لنا بشىء كهذا! هذه اشياء نتعلمها ونشيد بها لكن لا نختبرها كيف يكون لمثل ذلك مصداقية؟ البر والطاعة وكل تلك العبادات التى نحن مكلفين بها الله وحده الذى يعلمها وهو وحده الذى يجازى بها! وليس البشر من يفعلون ذلك؟ كل تلك المسابقات تجارة خاسرة لفتيات الله فضلهن بنعم خير من ذلك. ولا بد للرجوع لكتاب الله عز وجل عندما قال (وقرن فى بيوتكن ولا تبرجن تبرج الجاهلية الاولى)<br />وانا اريد ان اطرح سؤال لمن توافق على تلك المسابقات(ما رأيك لو كان بيننا رسول الله صلى الله عليه وسلم وذهبت اليه لتأخذيى رأيه فى مثل تلك المسابقات برأيك هل كان سيوافق؟"
archived = "2010-03-14"
capture_url = ""
