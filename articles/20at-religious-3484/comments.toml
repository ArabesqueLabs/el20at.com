[[comments]]
order = 4
subject = "إرحموا الناس"
author = "كفايه"
posted = "2007-04-10"
text = "عندك حق والله يا محمود....الناس لما بتنتقد حد كاتب موضوع و تعبان فيه بغشومية زي ما بتقول كأنها بالظبط ضربته بسكينة ملتهبة في صدره .<br />أنا كنت عايز أقولك حاجة يا مصطفي إنت كنت المفروض قولت إنهم منعوك من مكالمة المتسابقات علي الأقل عشان تدينا إيحاء إن في حاجة ميش مظبوطه ولا إيه وتلعب علي النقطة دي."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "ضع عنوان التعليق  تقليد اعمى"
author = "اكتب اسمك هنا سعيد"
posted = "2007-04-13"
text = "صدق رسول الله عندما قال و لو دخلوا جحر ضب لدخلتموه ....يعني نحن كمسلمين ليس لدينا القابلية<br />لابداع برامج مخالفة للبرامج التي يسبقنا اليها الاوربيون و الامركان ؟؟؟<br />فكرة ملكة الجمال فكرة مادية جنسية سطحية لا علاقة لحضارتنا بها...المرأة عندنا أكثر من أن تكون فرجة لعيون<br />الناس..<br />لماذا التقليد في المظاهر و الماديات...لماذا لا نفكر في برامج لها علاقة بعالم الافكار...<br />افضل كاتبة، افضل رسامة، افضل معلمة، افضل طبيبة...الخ<br />انا ضد تسمية ملكة جمال اعتبرها تسويقية و تقليد اعمى للغرب"
archived = "2010-03-14"
capture_url = ""

