subject = "يا ناس"
author = "محمود مهدى"
posted = "2007-03-25"
text = "ياريت من فضلكوا تردوا ردود ما تثبطش عزيمة حد عمل جهد فى موضوع<br />الذوق و الرحمة فى الحوار والتعامل<br />ده انا قربت اسجل نظرية الغشومية فى الشهر العقارى<br />الناس بترزع كلام بشع"
