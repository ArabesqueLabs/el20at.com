[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "مصطفى هاشم"
posted = "2007-03-24"
text = "بالفعل اتصلنا بكثير من المسئولين في قناة اقرأ في القاهرة لنعرف معلومات أكثر عن المسابقة ولكنهم أكدوا أنهم لا يعرفون شيئا عنها وأن كل المعلومات وكل شيء يصب عند مكتب قناة اقرأ في الكويت فاتصلنا بمكتبهم في الكويت ولكنهم قالوا لنا ابعثوا لنا كل شيء تريونه عن طريق الإيميل ومن ضمن أسئلتنا التي بعثناها لهم أننا نريد أن نتكلم مع بعض المتسابقات ...ولكن للأسف لم يكونوا متعاونين معنا ولم يردوا علينا"
archived = "2010-03-14"
