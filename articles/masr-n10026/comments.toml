[[comments]]
order = 1
subject = "تصحيح للتعليق الأول ونرجو من إدارة الموقع حذفه"
author = "صابر مره أخرى"
posted = "2007-05-01"
text = "فعلا الاضرابات كانت مفاجأه لكن المفروض ما تكونش مفاجأه فى ظل الوضع السئ الذى تعانى منه الطبقه العامله<br />المصريه منذ بداية فترة الرئيس الراحل )الله يرحمه( أنور السادات, تمثلت الاوضاع السيئه فى الخصخصه, وبيع<br />القطاع العام إلى آخره............<br />ومع تصريحات الاستاذ محمود أمين العالم, ولو كان فيه فعلا تنظيم مسؤل عن الاضرابات دى فده يبقى شئ كويس<br />ومكسب للحركه العماليه المصريه, وإن كنت لا أرى ذلك, فالاضرابات نتيجه عاديه جدا لاوضاع العمال المذكوره<br />فى المقال.<br />إن أنتصار العمال فى الاضرابات الاخيره يبعث الامل فى إمكانية قيام حركه عماليه قويه تناهض الاستغلال.<br />وتحيه للعمال فى عيدهم!!!"
archived = "2007-05-04"
capture_url = "https://web.archive.org/web/20070504022417/http://masr.20at.com:80/newArticle.php?sid=10026"

[[comments]]
order = 2
subject = "ننتظر المزيد من الوعى"
author = "عمرو المنسى"
posted = "2007-05-01"
text = "الى كل من دافع عن حقوقه التى اخذت امام عينيه واخذت بالقوه كل الاحترام والتقدير اتمنا ان يذيد هذا الوعى الى مالانهاية حتى يعرفون هؤلاء الديكتاتوريين اننا نعرف الى اين نسير ونعرف اين حقوقنا التى تسلب منا بالقوه ففى كل اعتصام او اضرابات او مظاهرات يلبون كل متطالباتنارغم انفهم فاذا استمر بنا الحال الى ان نظل صامتين عن حقوقنا او اى شئ ياخذ منا بالقوه فنحن جميعا نعرف النتيجه جيدا كل الاحترام والتقدير لكل صوت وكل مناضل ارتفع صوته فى وجه الفساد والاستغلال من اجل حق كل عامل مصرىو كل فلاح مصرى احترام وتقدير الى كل صرخه من اجل استرداد الحق شكر وتقدير الى كل العاملين بالموقع وننتظر المزيد"
archived = "2007-05-04"
capture_url = "https://web.archive.org/web/20070504022417/http://masr.20at.com:80/newArticle.php?sid=10026"
