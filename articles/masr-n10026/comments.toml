subject = "ضع عنوان التعليق"
author = "صابر"
posted = "2007-05-01"
text = "فع&--65275; ا&--65271;ضرابات كانت مفاجأه لكن المفروض ما تكونش مفاجأه فى ظل الوضع السئ الذى تعانى منه الطبقه العامله المصريه منذ بداية فترة الرئيس الراحل )الله يرحمه( أنور السادات, تمثلت ا&--65271;وضاع السيئه فى الخصخصه, وبيع القطاع العام إلى آخره............<br />ومع تصريحات ا&--65271;ستاذ محمود أمين العالم, ولو كان فيه فع&--65275; تنظيم مسؤل عن ا&--65271;ضرابات دى فده يبقى شئ كويس ومكسب للحركه العماليه المصريه, وإن كنت &--65275; أرى ذلك, فا&--65271;ضرابات نتيجه عاديه جدا &--65271;وضاع العمال المذكوره فى المقال.<br />إن أنتصار العمال فى ا&--65271;ضرابات ا&--65271;خيره يبعث ا&--65271;مل فى إمكانية قيام حركه عماليه قويه تناهض ا&--65271;ستغ&--65275;ل.<br />وتحيه للعمال فى عيدهم!!!"
