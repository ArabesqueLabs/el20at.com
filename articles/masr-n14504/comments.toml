order = 0
subject = "سؤال سخيف"
author = "oiu"
posted = "2008-03-04"
text = "هو مبارك رئيس دولة مصر ولا رئيس المنتخب القومى<br />هى الحكاية بقت لعب فى لعب<br />والا جد ولعب وحب"
archived = "2008-03-06"
