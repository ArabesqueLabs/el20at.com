[[comments]]
order = 1
subject = "ارحمونا"
author = "ابو اسامة"
posted = "2008-03-04"
text = "ارحمونا بقى يا عالم الناس مش لاقية تاكل منتخب ايه وزفت ايه<br />الشباب عاطل عن العمل وهم ياخذون الملايين لماذا بماذا افادونا<br />يا ناس ارحمونا الله يخرب بيوتكم وحسبى الله ونعم الوكيل"
archived = "2008-03-06"
capture_url = "https://web.archive.org/web/20080306021051/http://masr.20at.com:80/newArticle.php?sid=14504"

[[comments]]
order = 2
subject = "اووووف"
author = "الاسم مصريه"
posted = "2008-03-04"
text = "ريسنا ياريس الهيافه .. بتتبع سياسه الهاء الشعب بالكوره<br />والناس تعبت خلااااص هتنفجر من بطاله وغلاء وعنوسه وفساد ومحسوبيه<br />ياريت ذى ماتدخلت بسرعه واصدرت قراراتك بحل مشكله الحضرى<br />ياريت تتدخل وتصدر قراراتك السريعه فى حل مشاكل غلابة الشعب المصرى"
archived = "2008-03-06"
capture_url = "https://web.archive.org/web/20080306021051/http://masr.20at.com:80/newArticle.php?sid=14504"
