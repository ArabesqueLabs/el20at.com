[[comments]]
order = 1
subject = "ابراهيم السباعي"
author = "شاب مصري ....جاهل"
posted = "2007-02-21"
text = "تحية عظيمة لهذا الكاتب العظيم ورحمة الله وعفا الله ، وتحيه لكاتب المقال لتعريف الجاهل بهذا الكاتب العظيم وتذكير العالم بهذا الكتاب بذكرى هذا الكاتب العظيم الذي ربما لا يعلم كثير من جيلنا ( الذى لا يقرأ ) اي معلومات عن هذا الكاتب ....اهدي لك يا يوسف اسمى معاني الحب - وان اختلفت معك في بعض مواقفك- لكنى اظل احرتم ادبك وسنظل نذكرك يا يوسف كلما غابت الشمس كما كنت تقول . وان كنت تبصق على الدنيا وقد فارقتها عام 1978 فماذا كنت ستفعل لو عشت معنا الى يومنا هذا ؟؟!! دعني يا يوسف ابصق معك على قبر كل عظيم مزيف وكل خائن وكل ما وأد الادب في هذا الوطن وبصقة على كل من غيب جيلنا وبصقة على الدنيا التي يغيب منها الشرفاء ويسود فيها الاقزام . تحية ليوسف السباعي وتحيه لكاتب المقال الذي ذكرنا بماضى جميل"
archived = "2010-03-14"
capture_url = ""

