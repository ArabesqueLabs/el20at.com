text = "شكرا لعشرينات (الموقع المتميز) وشكرا لياسر (كاتب المقال)لتذكيرنا بذلك الكاتب العظيم الذي يجهله كثير من شباب عصرنا لا لاننا لم نكن معاصرين له بل لجهل هذا الجيل بهذا الرجل .<br />رحم الله ابراهيم السباعي وكل من اضاف الى البشرية"
