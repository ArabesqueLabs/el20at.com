subject = "ربنا يرحمنا"
author = "ديمة"
posted = "2007-02-21"
text = "كويس ان اننا نفتمر ذكرى كل حد اصر فينا، وانا عن نفسى عمر ما قريت حاجة وعشت معاها وتأثرت بها كل ها التأثر كما حدث مع رواية \"السقا مات\" وانصح كل منكم بقراءتها<br />ولكن انا بجد باحاول على قد ما اقدر افصل بين تقييمى لادبه وتقييمى لشخصه وان كانوا الاتنين هيتداخلوا بعض الشىء فى مساحة افكراه .. بحب فى يوسف السباعى سيد الولد الصغير ابن السقا وواخدة موقف بلا حدود من الاستاذ الكبير الفارس الشاعر اللى خذلنا وراح يود الاسرائيليين ، يمكن لو كان عاش ومش قضوا عليه بعملية اغتيال يمكن كانوا اعطوه الفرصة وحتى آخر يوم فى عمره للتراجع لكنه مات وجاء قدؤه ولم يحدث وواخدة منه موقف لغاية ما يعتذر يوم القيامة"
