[[comments]]
order = 0
subject = "اضغاث احلام"
author = "السوهاجى باشا"
posted = "2007-10-19"
text = "اللى ينفع يحكم البلد مجلس من الراسخين فى العلم<br />دكاترة الاخوان - عمرو موسى - والاخوان المسلمين احسن حزب لة شعبية فى مصر<br />ولازم يحكموا وامريكا عايزاهم<br />طيب ما هم اصحاب العمم بيحكموا العراق باسم امريكا<br />اللى بيخوفوا امريكا من الاخوان بتوع الحزب الوطنى واهمين<br />لان امريكا عايزة الاخوان<br />والتلكيك بحماس وشوفى يا امريكا حماس بتوع الاخوان اخدت غزة وبتوع مصر عايزين يحموا<br />لا امريكا عايزة كدة عايزة الاخوان لان كل العالم بيتكلم عن الفساد والفقر فى مصر"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027143657/http://masr.20at.com:80/newArticle.php?sid=11969"

