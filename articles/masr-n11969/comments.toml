subject = "جروب جديد على الفيس بوك خاص بالملك فاروق"
author = "ياسر البارودى"
posted = "2008-05-06"
text = "شاهدت جروب جديد على الفيس بوك خاص بالملك فاروق يدعى فاروق مصر<br />ويشير صاحب الجروب الى موقعه عن الملك فاروق<br />وهو يعرض به صور للملك فاروق فى شكل منظم وجميل ويعتبر اول موقع يحمل اسم الملك فاروق<br />وعنوان الموقع هو<br />www.faroukmisr.net<br />اتصور انه جدير بالمشاهدة"
archived = "2010-03-14"
