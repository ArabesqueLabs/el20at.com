[[comments]]
order = 0
subject = "طيب كويس ---------- بطرس غالى هيعوضهم ضرايب وهيخترع ميت ضريبة على الناس"
text = "بسيطة خالص<br />عند بطرس غالى الحل الساحر<br />هيعمل ضرايب جديدة على الناس - والناس تعمل اضراب - وما يدفعوش - والحكومة تحبسهم - والسجون هتزيد ويزيد الانفاق عليها<br />وهنخش فى الدوامة<br />ومفيش استقرار<br />واللى هيصحى بدرى هو اللى هيكسب<br />ومزيد من البيع لاصول الدولة<br />امال البهوات الكبار هيصرفوا من اين ؟"
archived = "2009-02-20"
capture_url = "https://web.archive.org/web/20090220151200/http://masr.20at.com:80/newArticle.php?sid=20025"

[[comments]]
order = 1
subject = "وكان الفريق احمد علي فاضل رئيس هيئة قناة السويس"
author = "مش شغال"
text = "هي دي المشكلة<br />الفريق واللواء<br />هي دي مشكلة مصر اللي ودتنا في ستين داهية<br />عربجية الجيش والشرطة ماسكين البلد<br />والاقتصاديين الكبار قاعدين على القهاوي مش لاقيين شغل"
archived = "2009-02-20"
capture_url = "https://web.archive.org/web/20090220151200/http://masr.20at.com:80/newArticle.php?sid=20025"
