subject = "من روائع الشاعر العراقي احمد مطر \" اعمي العمي"
author = "احمد - مصر"
posted = "2008-01-02"
text = "قال لنا أعمى العميان:<br />تسعة أعشار الإيمان<br />في طاعة أمر السلطان.<br />حتى لو صلى سكران<br />حتى لو ركب الغلمان<br />حتى لو أجرم أو خان<br />حتى لو باع الأوطان.<br />أنا حيران!<br />فإذا كانْ<br />فرعون حبيب الرحمن<br />والجنة في يد هامان<br />والإيمان من الشيطان<br />فلماذا نزل القرآن؟!<br />ألكي يهدينا مسواكا<br />نمحو فيه من الأذهان<br />بدعو معجون الأسنان؟<br />أم ليفصل (دشداشات)<br />تشبه أنصاف القمصان؟<br />ألذلك قد أُنزل؟ كلا..<br />ما أحسبه أنزل إلا<br />ليحرم شرب الدخان<br />قلم: أحمد مطر"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104034758/http://masr.20at.com:80/newArticle.php?sid=13669"

