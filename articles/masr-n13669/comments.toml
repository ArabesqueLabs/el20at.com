text = "وها هو هارون الرشيد - لما حضرتة الوفاة - وعاين السكرات -<br />صاح بقوادة وحجابة<br />اجمعوا جيوشى<br />فجاءوا بهم بسيوفهم ودروعهم لا يكاد يحصى عددهم الا اللة تحت قيادتة وامرة فلما رأهم --- بكى ثم قال<br />يا من لا يزول ملكة -- -- ارحم من قد زال ملكة<br />ثم لم يزل يبكى حتى مات<br />يامن لا يزول ملكة -- ارحم من قد زال ملكة<br />فهل يتعظوا ؟<br />لعل وعسى \""
