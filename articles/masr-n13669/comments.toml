subject = "من التاريخ ( الازهر الذى كان شريفا )"
author = "ازهرى صميم"
posted = "2008-01-04"
text = "الازهر الذى كان شريفا كان لة مشايخ عظام كتبوا صفحات بيضاء فى العزة والكرامة<br />فى سنة 1882 واثناء انحياز الخديوى توفيق للانجليز ضد عرابى باشا<br />اصدر مشايخ الازهر ( مشايخ بحق مش مشايخ تايوانى ) اصدر الشيوخ<br />الشيخ محمد عليش<br />والشيخ حسن العدوى<br />والشيخ الخلفاوى<br />اصدر كبار شيوخ الازهر قرارا دينيا ( فتوى ) باعتبار الخديوى توفيق مارقا وذلك لانحيازة للانجليز ضد المصريين"
