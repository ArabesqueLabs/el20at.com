text = "(بالحمـد) نبـدأ كـل فـعـل طـيـبٍثم الصـلاة علـى ابـن عبـد منـافِ<br />(بقـرٌ) (لعمـرانَ) وبعـض (نسـائـهِ)و(موائـد) (الأنـعـام) (بـالأعـراف)<br />يـا ربّ (أنفلنـي) (بتوبـة) (يـونـسٍ)(هود) و(يوسـف) طاهـرا الأطـراف<br />(بالرعد) (إبراهيـم) خـاف (بحجـره)و(النحل) (أسـرى) (للكهـوف) يوافـي<br />و(بمريـم) العـذرا و(طــه) بعـدهـاأكـرم بـكـل (الأنبـيـا) الأشــراف<br />(للحـج) يرنـو (المؤمنـون) (لنـوره)و(الذكـر) و(لأشعـار) فـي إلـحـاف<br />و(النمل) (تقصص) و(العناكب) حولهـاو(الـرومُ) يـا (لقمـانُ) وهـنَّ تلافـي<br />لـم (يسجـد) (الأحـزاب) مـن (سبـأ)ولم يحن الوجـوه (لفاطـر) الأسـلاف<br />(يس) و(الصافات) و(صاد) و(الزمر) ويا(غافـرٍ) (فصلـت) لــي أوصـافـي<br />و(تشاوروا) في زينـة مـن (زخـرف)(بدخانهم) و(جثـوا) علـى (الأحقـاف)<br />و(محمـد) (بالفتـح) جــاء مبـشـراًفـي (حجَـرِه) ألقـى عليـه (بـقـاف)<br />(بالذاريات) (الطـور) أشـرق (نجمـه)(قمرا) مـن (الرحمـن) ليـس بخـاف<br />(وقـع) (الحديـد) ببـأسـه فتسمـعـوافي (الحشر) (يمتحن) الـورى ويكافـي<br />(بالصف) صف (المؤمنـون) (لجمعـة)وأخـو (النفـاق) (لغبـنـه) متجـافـي<br />قـد (طلـق) الأخـرى (فحـرّم) ربـه(ملـك) الجنـان عليـه دون خــلاف<br />(قـلـمٌ) بــه (حـقّـت) (مـعـارجٌ)(نوحنـا) و(الجـن) فـي استـشـراف<br />و(تزمـلـت) و(تـدثـرت) (لقيـامـة)(الإنسان) تدعـو (المرسـلات) عـراف<br />(نبـأ) عظيـم زاد فـيـه (نزاعـهـم)(عبسـوا) لـه (متكـوري) الأطـراف<br />و(تفطـرت) أجسامهـم مــن هـولـهقـد (طففـوا) المكيـال فـي إسـراف<br />و(انشقت) (الأبـراج) بعـد (طـوارق)(سبـح) فـإن (الغاشـيـات) تـوافـي<br />(فجرٌ) تألـق فـي (البـلاد) و(شمسـه)نوَّرا مـن بعـد (ليـل) فـي اختـلاف<br />أضحى (الضحـى) (فاشـرح) فـؤادكدائما (بالتين) و(اقرأ) ذاك (قـدر) كـاف<br />(بالبيـنـات) (تزلـزلـت) (عـاديـة)(بقـوارعٍ) (ألهـت) عـن الإسـفـاف<br />(بالعصـر) جـاء (يهـمـز) (فيـلـه)و(قريش) فـي صخـبٍ وفـي إسفـاف<br />من يمنـع (الماعـون) (ينحـر) نفسـهو(الكفـر) ولـى بعـد (نصـرٍ) شـاف<br />(تبـت) يـدا مـن لا (يوحـد) ربــه(فلـق) الصبـاح وجـاد بالألـطـاف<br />(عـذ) بالإلـه مـن الوسـاوس وادعـهيغـفـر لنـاظـم هــذه الأصــداف"
