subject = "الشيخ الازعر"
author = "حزنبل"
posted = "2008-01-02"
text = "انظر الى الصورة - ترى الشيخ الذى كان شيخا للازهر - اصبح شيخا مفتيا لحزب الفقر الوطنى الديمقراطى<br />افتى للحكومة بجلد الصحفيين وحلق نصف شواربهم وتركيبهم الحمير بالمقلوب وتجريسهم فى الشوارع ابتداءا من العتبة الخضراء وحتى الموسكى والازهر<br />والحكومة طنشت فتواة<br />وارسلت الية عكمة او صرة من النقود لهطها مولانا جزاءا وفاقا ويقال انة يبنى فيلا وجارى تشطيبها فى القاهرة الجديدة<br />وانا ضد سياسة التعكيم بتاع الحزب<br />فعضو الحزب فى البرلمان يحكم اكرامية كبيرة قوى علشان لزوم التصفيق<br />وكل واحد عمال يعكم<br />الا الشعب النكدى سىء الحظ اللى الكل بيمن علية برغيف الخبز والدولة كلها بكامل اجهزتها الالكترونية بتدرس ازاى تشيلة بدون ما يثور او تحدث انتفاضة او مظاهرات تحت بند ترشيد الدعم او توصيلة لمستحقية"
archived = "2008-01-04"
