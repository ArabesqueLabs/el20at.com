[[comments]]
order = 5
subject = "أ. د. محمد سيد طنطاوي"
posted = "2008-01-03"
text = "تاريخ ومحل الميلاد: 8 / 10 / 1928 ، بجرجا محافظة سوهاج.<br />درجة الإجازة العالية:<br />عام 1958 من كلية أصول الدين جامعة الأزهر.<br />درجة العالمية (الدكتوراه):<br />عام 1966 في التفسير والحديث من كلية أصول الدين جامعة الأزهر بتقدير ممتاز.<br />سنة: 1960 بوظيفة: إمام وخطيب ومدرس بوزارة الأوقاف.<br />سنة: 1968 بوظيفة: مدرس تفسير وحديث بكلية أصول الدين جامعة الأزهر.<br />سنة: 1972 بوظيفة: أستاذ مساعد بقسم التفسير بكلية أصول الدين بأسيوط.<br />سنة: 1976 بوظيفة: أستاذ بقسم التفسير بكلية أصول الدين بأسيوط.<br />سنة: 1976 بوظيفة: عميد كلية أصول الدين بأسيوط.<br />سنة: 1984 بوظيفة: أستاذ بقسم أصول الدين بكلية الدراسات الإسلامية والعربية بنين بالقاهرة.<br />سنة: 1985 بوظيفة: عميد كلية الدراسات الإسلامية والعربية بنين بالقاهرة.<br />سنة: 1986 بوظيفة: مفتي جمهورية مصر العربية.<br />سنة: بوظيفة: شيخ الجامع الأزهر."
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104034758/http://masr.20at.com:80/newArticle.php?sid=13669"

[[comments]]
order = 6
subject = "أ د محمد سيد طنطاوي"
posted = "2008-01-03"
text = "محمد سيد طنطاوي (28 أكتوبر 1928 - ) هو شيخ الأزهر الحالي. ولد في قرية سليم الشرقية في محافظة سوهاج. تعلم وحفظ القرآن الكريم في الاسكندرية.<br />حصل على الدكتوراة في الحديث والتفسير عام 1966م.<br />عمل كمدرس في كلية أصول الدين، ثم انتدب للتدريس في ليبيا لمدة 4 سنوات.<br />عمل لمدة 4 سنين في المدينة المنورة كعميد لكلية الدراسات العليا بالجامعة الإسلامية.<br />عين مفتي للديار المصرية في 28 أكتوبر 1986.<br />اختير شيخا للأزهر في 1996."
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104034758/http://masr.20at.com:80/newArticle.php?sid=13669"

