subject = "توضيح المقاله فى الرد على المعتوه الزباله"
author = "رد على قصيدة احمد مطر والخدام"
posted = "2008-01-02"
text = "حكم الخروج على الحاكم *<br />بقلم - سيد إمام الشريف<br />سيد إمام قبل المراجعات يمينا وبعدها يسارا<br />النهي عن الخروج على الحكام في بلاد المسلمين:<br />تطلق كلمة الحاكم في نصوص الكتاب والسنة على القاضي، كما في قوله تعالى... (وَتُدْلُوا بِهَا إِلَى الْحُكَّامِ...) (البقرة:188)، وكما في الصحيح (إذا حكم الحاكم فاجتهد...)، وكما في كتاب (الطرق الحكمية) لابن القيم، وكتاب (تبصرة الحكام) ابن فرحون. ولكن شاع استخدام هذه الكلمة (الحاكم) في هذا الزمان كمرادف لكلمة (السلطان) وهو الرئيس أو الملك أو الأمير ونحوه.<br />وقد وقعت في صدر الإسلام حوادث خروج على السلطان بسبب المظالم، وقد نجم عن الخروج مفاسد كثيرة، والذين خرجوا كأهل المدينة في الحرة (61هـ) والحسين بن علي رضي الله عنهما (64هـ) وابن الأشعث (81هـ) وغيرهم أخذوا بعموم أحاديث تغيير المنكر باليد كحديث أبي سعيد مرفوعًا (من رأى منكم منكرًا فليغيره...) وحديث ابن مسعود رضي الله عنه مرفوعًا (فمن جاهدهم بيده فهو مؤمن...)، وهذا خطأ لأنه إذا جاز تغيير المنكر باليد عند القدرة بين الرعية فإنه لا يجوز مع السلطان للنهي الخاص الوارد في ذلك وهو مقدم على الأمر العام الوارد في الأحاديث السابقة.<br />ومن النهي الخاص الوارد في المنع من الخروج على السلطان قول النبي صلى الله عليه وسلم: (من رأى من أميره شيئًا يكرهه فليصبر، فإنه من خرج من السلطان شبرًا مات ميتة جاهلية) متفق عليه عن ابن عباس رضي الله عنهما. ولم يرخص النبي صلى الله عليه وسلم في الخروج إلا إذا كفر السلطان لحديث عبادة بن الصامت مرفوعًا، وفيه (وأن لا ننازع الأمر أهله، قال النبي صلى الله عليه وسلم: (إلا أن تروا كفرًا بواحًا عندكم من الله فيه برهان) متفق عليه.<br />وقد جمع البخاري هذا كله في الباب الثاني من كتاب الفتن في صحيحه. وفي كلامه عما حدث في صدر الإسلام من حوادث الخروج على أئمة الجور قال ابن تيمية في كتابه (منهاج السنة النبوية): (إن الخروج على أئمة الجور كان مذهبًا قديمًا لأهل السنة ثم استقر الإجماع على المنع منه) أ.هـ، رحمهم الله ورضي عنهم أجمعين.<br />كفر السلطان والخروج عليه<br />فإذا كفر السلطان (إلا أن تروا كفرا بواحا) فقد نقل ابن حجر في هذه المسألة (في شرحه لكتابي الفتن والأحكام بالبخاري) عن شراحه السابقين رحمهم الله قولهم: (إنما تجب مجاهدته على من قدر، ومن تحقق العجز لم يجب عليه القيام في ذلك) أ.هـ، فهناك فرق بين العلم بكفر السلطان وبين وجوب الخروج عليه، فلا يجب عند العجز أو إذا غلبت المفسدة في الخروج. خصوصا إذا كانت المفاسد جسيمة أعظم وخارجة عن المألوف في الجهاد.<br />وقد تكررت حوادث الخروج على الحكام في بلاد المسلمين خلال العقود الماضية باسم الجهاد في سبيل الله من أجل تحكيم شريعة الإسلام في تلك البلاد، وقد أدت هذه الحوادث إلى مفاسد عظيمة على مستوى الجماعات الإسلامية وعلى مستوى البلاد التي وقعت بها هذه الأحداث والقاعدة الفقهية أن (الضرر لا يُزال بمثله) ومن باب أولى (لا يُزال بأشد منه).<br />والجهاد ليس هو الخيار الشرعي الوحيد لمواجهة الواقع غير الشرعي وإنما هناك خيارات أخرى كالدعوة والهجرة والعزلة والعفو والصفح والإعراض والصبر على الأذى وكتمان الإيمان، والفقيه هو من يختار الخيار المناسب من هذه لواقع معين، وقد عمل بها كلها رسول الله صلى الله عليه وسلم وكثير من أصحابه رضي الله عنهم بحسب الاستطاعة وظروف الواقع وبما ينفع الدين وأهله ولا يعود عليهما بالضرر أو المفسدة، وقد سبق بيان ذلك، وقد قيل: ليس الفقيه من يميز بين الخير والشر فهذا يدركه كثير من الناس، وإنما الفقيه من يختار أهون الشرين وأخف الضررين.<br />وقد ذكر ابن تيمية رحمه الله قاعدة في الموازنة بين المصلحة والمفسدة فقال (فتبين أن السيئة تحتمل في موضعين: دفع ما هو أسوأ منها إذا لم تدفع إلا بها، وتحصيل ما هو أنفع من تركها إذا لم تحصل إلا بها. والحسنة تترك في موضعين: إذا كانت مفوتة لما هو أحسن منها، أو مستلزمه لسيئة تزيد مضرتها على منفعة الحسنة، هذا فيما يتعلق بالموازنات الدينية) أ.هـ.<br />وفي خرق الخضر عليه السلام للسفينة دليل على احتمال أخف الضررين.<br />للجهاد مقدمات ومقومات<br />وسواء كان ترك الحكم بالشريعة كفرًا أو كفرًا دون كفر أو معصية،.. فإننا لا نرى أن الصدام مع السلطات الحاكمة في بلاد المسلمين باسم الجهاد هو الخيار المناسب للسعي لتطبيق الشريعة، فالجهاد لا بد له من مقدمات ومقومات تعتبر من شروط وجوبه فإذا انعدمت سقط الوجوب، ومنها دار الهجرة والنصرة (كالمدينة) أو دار الأمن (كالحبشة بالنسبة للصحابة) أو القاعدة الآمنة (كأبي بصير)، والنفقة اللازمة للجهاد، وتأمين ذراري المسلمين (نسائهم وعيالهم) والتكافؤ في العدد والعدة بين طرفي الصدام، والفئة التي يمكن التحيز إليها، وتميز الصفوف حتى لا تنتهك دماء المعصومين وحرمتهم، كل هذه المقومات مفقودة بما يجعل الجهاد لا يؤدي إلى النتيجة المرجوة من إظهار الدين وتحكيم الشريعة، وهذا هو الواقع فعلاً في معظم البلدان، فلم تفلح في ذلك معظم الجماعات الإسلامية رغم التضحيات الجسيمة التي قدمتها، ولهذا لم يفرض الله سبحانه الجهاد على المسلمين وهم مستضعفون بمكة قبل الهجرة لعدم توفر مقومات نجاحه، وبعض الذين حاولوا الالتفاف على نقص المقومات في عصرنا الحاضر وقعوا في محظورات شرعية، منها:<br />• قتل معصومين بدعوى التترس في غير موضعه، وسيأتي الكلام فيه إن شاء الله.<br />• استحلال أموال لا تحل بالسطو والخطف بدعوى تمويل الجهاد، وقد سبق بيان فساد ذلك.<br />• الغدر ونقض العهد ممن دخل بلاد الكفار بإذنهم فخانهم، وسيأتي بيانه إن شاء الله.<br />• العجز عن تأمين ذراري المسلمين وقت الصدام بما يعرضهم للتلف والفتن.<br />• تلقي أموال والاستعانة بأنظمة حكم في دول أخرى ليست بأفضل من بلدانهم لقتال أهل بلدهم بما أوقعهم في فخ العمالة وحروب الوكالة، فيبدأ شأنه مجاهدًا ويصير عميلاً مرتزقًا، ولو شئت أن أقول منهم فلان وفلان لقلت.<br />• اضطرار البعض إلى عمل لجوء سياسي لدى الدول الأجنبية (بلاد الكفار الأصليين) فيكون بذلك قد دخل تحت حكم الكفار وقوانينهم باختياره، في حين أن القوانين المخالفة للشريعة تجري عليه في بلده بغير اختياره، وقد حذر فقهاء السلف من ذلك وقالوا إن من دخل من المسلمين دار الحرب (دار الكفر) لحاجة لا يجوز له أن يعزم على الإقامة بها لأنه يكون بذلك قد رضي بجريان أحكام الكفار عليه طواعية، وبذلك يرتد عن الإسلام، ذكره ابن قدامه وغيره.<br />وليس اللجوء السياسي اليوم كالدخول قديمًا في جوار ذي منعة كما دخل النبي صلى الله عليه وسلم في جوار المطعم بن عدي، وكما دخل أبو بكر رضي الله عنه في جوار ابن الدغنه، إذ لم يترتب على الجوار جريان أحكام الكفار عليهم بل مجرد الحماية، ولما أراد ابن الدغنه أن يشترط على أبي بكر رضي الله عنه شروطًا رد عليه جواره، وحديثه بالصحيح.<br />ومع ذلك فإنني لا أرى أن طالبي اللجوء السياسي بالبلاد الأجنبية اليوم مرتدون، ولا أقول بذلك للفارق بين الحال الآن وما كانت عليه قديمًا من وجود دار الإسلام التي تقبل بهجرة أي مسلم إليها وتؤمنه فهذا متعذر الآن. ولهذا فإن اللجوء السياسي اليوم يشبه الهجرة إلى دار الأمن(كالحبشة في أول الإسلام) أو هو من باب (اختيار أخف الضررين). وقد صرح ابن حزم رحمه الله في (المحلي ج11) أن الإقامة بدار الحرب للمضطر جائزة وليست ردة بشرط ألا يشاركهم في محاربتهم للمسلمين، وذكر في ذلك خبرًا نسبه للزهري (محمد بن شهاب) رحمه الله. هذا حاصل كلامه أ.هـ.<br />معاندة السنن<br />وقد كانت هذه أمثلة لبعض المحظورات التي ارتكبوها، وبهذا يفعل المسلم ما لا يحل له شرعًا (كهذه المحظورات) للقيام بما لا يجب عليه شرعًا (من الجهاد العاجز عنه)، وإنما ألجأهم إلى هذا معاندة السنن وتكليفهم أنفسهم بما يعجزون عنه، والتكليف بما لا يطاق لا يجوز شرعًا بإجماع أهل العلم، كما هو موضح في كتب (أصول الفقه).<br />ولهذا فإننا نرى أن الصدام مع السلطات الحاكمة في بلاد المسلمين لأجل تحكيم الشريعة في مصر وما يشبهها من البلاد لا يجب في ضوء الظروف السابقة سواء كان هذا باسم الجهاد أو باسم تغيير المنكرات باليد، كل هذا لا يجوز ولا يجب، ولا يجوز التعرض لقوات هذه الحكومات (من الجيش والشرطة وقوات الأمن) بالأذى لما في ذلك من المفاسد الكثيرة، وننصح بذلك جميع المسلمين، ونرى أن الاشتغال بالدعوة الإسلامية وتقريب المسلمين من دينهم بما يؤدي إلى تقليل المفاسد الشائعة أجدى نفعًا للإسلام وللمسلمين والذين خالفوا في ذلك ولجأوا إلى الصدام لا هم أقاموا الدين ولا أبقوا على أنفسهم وأهاليهم ولا حافظوا على بلادهم من المفاسد والخراب، وفي القاعدة الفقهية (من استعجل الشيء قبل أوانه عوقب بحرمانه) أو (التعجل علة الحرمان) ومن عجز عن الدعوة والتغيير باللسان أنكر بقلبه، وقال تعالى (لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا...) (البقرة:286)، وسيأتي كلام آخر في هذا الموضوع بالتنبيه الثاني بآخر هذه الوثيقة إن شاء الله.<br />وبعض من رأى أن يصطدم بالسلطات في بلاد المسلمين وعجز عن ذلك لجأ إلى مسالك جانبية لإزعاج السلطات وذلك بضرب المدنيين أو الأجانب والسياح ببلاد المسلمين، وكل هذا غير جائز شرعا كما سنذكره في البنود التالية إن شاء الله وإنما ألجأهم إلى ذلك تكليفهم أنفسهم بما لم يوجبه الله عليهم فعالجوا الخطأ بخطأ ثان.<br />وأنبّه هنا على أن تقسيم الناس إلى مدنيين وعسكريين هو تقسيم مُحدث، ولكنا سوف نستعمله لشيوعه لتقريب الفهم في البنود التالية، والمقصود بالمدنيين في بلاد الكفار: غير المقاتلة منهم، والمقصود بالمدنيين في بلاد المسلمين: عامة الناس.<br />عمليات تنظيم الجهاد في مصر: أول عملية انتحارية... والطفلة شيماء الضحية الأشهر<br />في 18 أغسطس من عام 1993 أصدر الظواهري تكليفا لعناصر التنظيم بتنفيذ عملية اغتيال تستهدف وزير الداخلية آنذاك حسن الألفي، وهدد من خلال بيانات أرسلها بالفاكس حينئذ لوكالات الأنباء بالمزيد من عمليات العنف الأخرى ضد عدد من كبار المسؤولين المصريين.<br />ووصفت هذه العملية بأنها أول عملية انتحارية تشهدها مصر في تاريخها الحديث في أغسطس، حيث فجّر القيادي نزيه نصحي راشد وزميله ضياء الدين محمود حافظ دراجة بخارية ملغومة في موكبه أثناء مروره بشارع الشيخ ريحان بميدان التحرير، وهو ما نتج عنه مقتلهما، بينما نجا الوزير بعد إصابته في ذراعه اليمنى، في حين قتل كل من منصور عبد الفتاح منصور وإبراهيم يونس الشرفا ومحمد أحمد قطب، وإصابة بعض المواطنين وإتلاف عدد من السيارات.<br />عقب الحادث اكتشفت أجهزة الأمن أن تنظيم الجهاد وراء الحادث، بعد الكشف عن شخصية (نزيه نصحي) وتم القبض على 18 متهماً من أعضاء التنظيم، وتم إحالتهم إلى المحكمة العسكرية التي عاقبت خمسة منهم بالإعدام، بينما عوقب باقي المتهمين بالسجن. ومع الضغط على عناصر التنظيم حدث خلل كبير في بنية الجماعة، أدى إلى اعتقال أعداد كبيرة منهم، وفي أكتوبر من عام 1993، اكتشف 800 عضو في التنظيم، على رأسهم مجدي سالم رئيس الجماعة في القاهرة بسبب فشل محاولة سرقة سيارة نقل لاستخدامها في نقل أسلحة عسكرية كان يخطط للاستيلاء عليها، نتيجة تراجع الموارد المالية للجماعة وانقطاع السبل بهم.<br />من أجل عاطف صدقي<br />كانت الحصة الأخيرة في مدرسة المقريزي بمصر الجديدة قد انتهت، وبدأ التلاميذ في الخروج من باب المدرسة... عندما استقرت شظايا الانفجار في جسد نحيف يحمل اسم (شيماء)... تلك الطفلة التي راحت ضحية محاولة أعضاء من تنظيم (الجهاد) اغتيال الدكتور عاطف صدقي، رئيس الوزراء الأسبق في 26 سبتمبر 1993.<br />بعد سلسلة من عمليات تنظيم الجهاد في مصر، جاء الدور على الدكتور عاطف صدقي، رصده أعضاء التنظيم، وكانت تحركاته تحت منظار التنظيم. خط سيره من مجلس الوزراء إلى منزله بشارع الخليفة المأمون بمصر الجديدة كتاب مفتوح لهم.<br />زرع المتهمون متفجرات وأنابيب غاز داخل سيارة كانت تقف أمام المدرسة، التي يمر من أمامها موكب رئيس الوزراء، وما إن مر الموكب حتى انفجرت السيارة، دون وقوع إصابات في الهدف أو حراسه، فقد أخطأ المتهم في تقدير الموعد وكان الضحايا ممن لا ذنب لهم، حيث لقيت الطفلة (شيماء) مصرعها، متأثرة بجروحها من شظايا الانفجار، وأصيب 14 آخرون من زملائها بالمدرسة والمارة في الشارع.<br />الجميع عرف بالحادث وظهرت صورة السيارة المفخخة على شاشات التلفزيون، وكان من بين المشاهدين صاحب معرض سيارات، فزع عندما شاهد السيارة، فهي تلك السيارة التي باعها قبل أيام من الحادث لشخصين، أبلغ المشاهد المباحث بأوصافهما، وبعد أيام شاهد أحدهما يستقل (تاكسي)، فتعقبه وأمسك به، ليدخل الحادث في سلك القضاء، ويترك الأحزان والألم لأسرة الطفلة (شيماء"
archived = "2008-01-04"
