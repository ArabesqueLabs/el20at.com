subject = "رأى صائب للمشايخ"
author = "عادل"
posted = "2008-01-02"
text = "رأى صائب - ما فائدة ان يخرج لقيط ابن زنى الى الحياة والكل يهرب منة - بالاضافة الى الالام النفسية التى يعانيها ومن سخرية المجتمع منة<br />الافضل ان يوقف هذا من الاول<br />ولكن يجب ان يؤخذ رأى المغتصب اذا كان معروفا فلربما اصلح الامور وتزوج منها ونسب الجنين الية<br />ويا دار ما دخلك شر"
