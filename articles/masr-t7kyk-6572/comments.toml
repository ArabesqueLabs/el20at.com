subject = "ألأزهر"
author = "جمال"
posted = "2007-07-07"
text = "من ألمفروض أن ألأخ ألمسيحى يحب أن يسلم با ألطبع يتوجه الى ألازهر ليشهر اسلامه ويكون فيه مكتب سجل مدنى داخل ألأزهر ليخرج ألأخ ألمسيحى سابقا من ألأزهر ألشريف يكون مسلما مؤمننا بقلبه ويكون ضامنا انه عبد الرحمن او يكون عمر معقول انا أعلم ألعلماء"
