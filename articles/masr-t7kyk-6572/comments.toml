order = 0
subject = "ببلاش"
author = "عبد السلام"
posted = "2007-07-05"
text = "انا فية بنت حلوة قوى وامورة فى الشارع بتاعنا والعيب انها مسيحية وعايز اتجوزها والبنت تستحق التضحية والسؤال هو هل من الممكن ان اتحول الى مسيحى شهرين تلاتة كدة حتى انول المراد ثم ارجع تانى مسلم<br />العملية سهلة خالص والضحك فيها للركب والشيوخ بتوافق وكلة بيراضى كلة والحمد للة كل حاجة فى بلدنا سهلة وجميلة والجو بديع وقفل على كل المواضيع<br />وبعدين انتوا زعلانين لية<br />ماهى ياسيد افندى بقت حرية وممكن تبقى جرجس ثلاث شهور ومحمدين سنة وبعدين يهود اولمرك سنة واهو شوف مصلحتك يا مواطن"
archived = "2010-03-14"
