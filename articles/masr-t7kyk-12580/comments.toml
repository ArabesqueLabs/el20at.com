author = "احمد محمد"
posted = "2009-07-07"
text = "1- الدعاء لها بظهر الغيب ان تكون من اهل الجنان برحمة الله سبحانه وتعال ويتغمدها رحمته<br />2- لابد من موقف عربى ومسلم موحد لان المسلمين فى كل مكان كالجسد الواحد اذا اشتكى منه عضو تنادى له باقى الاعضاء<br />3- ندعو لزوجها الشغاء ولا اهلها الصبر والسلوان وان يحفظ طفلها .<br />4 - ان نعى ونعرف ان الكفر ملة واحده فى اى مكان وزمان<br />5- ان نرجع الى ديننا الحنيف وان شاء الله مروة تكون ذكرتنا بالرجوع الى الله ."
