order = 8
subject = ""
author = "اخو مروة ولى الشرف"
posted = "2009-07-15"
text = "حاربوهم بالمقاطعة..اشعلوها عليهم وكونو رجالا<br />قال رسول الله(ص)من لم يهتم بأمر المسلمين فليس منهم.<br />حملة المقاطعة مع المنتجات الالمانية تضامنا مع الاخت الحبيبة مروة (شهيدة الحجاب)<br />تخيل ان هذه الشهيدة هى اختك او زوجتك او ابنتك الن تدافع عنها حتى بالمقاطعة نحن لا نريد مظاهرات يوم وتنتهى والله سلاح المقاطعة هو الحل عندما يكون حكامنا جبناء وغيرو اصحاب قرار وهذه بعض المنتجات الالمانية.<br />سيارات مرسيدس وشيفروليت وجاجواروبورش ودانلوب<br />كريم نيفيا للبشرة وبرفانات هوجو وجميع منتجات اديداس<br />منتجات بوش الكهربائية مثل الشنيور وصواريخ الحدادة<br />وهذه بعض المنتجات وليس على سبيل الحصر<br />وارجو من اخوانى الاهتمام بالمقاطعة وتحرى المنتج وتحرى بلد الصنع<br />صدقونى والله والله والله ان سلاح المقادعة يضرب اقتصاد الدول فى مقتل<br />وتذكرو اختكم مروة اللتى ماتت بابشع الظرق وهى تحمل طفلها 3سنوات بين يديها وكانت حامل فى الشهر الثالث وتذكرو الهلع اللذى كان فى اعين الطفل البريئة اللتى شاهدت مقتل امه ونور عينيه وامله فى الدنيا وتذكرو لوعة الزوج المسكين على زوجته وهى تطعن ب18طعنة"
archived = "2010-03-14"
capture_url = ""
