text = "-المطالبة بمحاكمة قاتلها بمصر والاصرار علي القصاص<br />- إقامة صلاة الغائب يوم الجمعة على روحها<br />- إخراج صدقات جارية على روحها<br />- إرسال خطابات احتجاج إلى السفارة الألمانية بالقاهرة<br />- منع السائحين الألمان من دخول مصر"
