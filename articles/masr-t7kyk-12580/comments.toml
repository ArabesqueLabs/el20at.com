[[comments]]
order = 6
subject = ""
author = "معندناش كرامة"
posted = "2009-07-07"
text = "كل اللي اقدر اقوله إننا بقينا ماعندناش اي نوع من الكرامة<br />بلدنا راميانا برة نتبهدل ونشحت لقمة العيش ولو جرى لنا حاجة<br />مالناش دية للأسف !!!!<br />أنا شايف إنه لا تراجع عن قتل القاتل وليس سجنه مدى الحياة<br />لأنه لا يستحق الحياة حتى ولو كان مسجونا<br />وما أدرانا قد يقوموا بتهريبه أو حتى ادعاء موته<br />لابد من وقفة من حاكمنا الموقر<br />يا حاكمنا حرام عليك اعمل لنا سعر بقى<br />ده احنا بقينا أرخص من التراب<br />يا ترى لو ألماني مات في مصر في خناقة (مش اغتيال في محكمة) ايه اللي ممكن يحصل لنا؟؟<br />تطبيق قانون الطوارئ على الشارع المصري..<br />اعتقال كل المشتبه فيهم..<br />تقديم الجاني للانتربول وهو يتصرف معاه..<br />تقديم اعتذار رسمي من أعلى مسئول..<br />تقديم تسهيلات اكثر للألمان في مصر..<br />تشغيل اكبر عدد من المصريين في خدمة رضا الأفواج الألمانية (بس يرضوا عنا)..<br />لو حد ربنا كتبله زيارة السفارة الألمانية علشان ياخد تأشيرة..<br />هايعرف إن احنا فعلا حثالة مالهاش تمن..<br />حسبي الله ونعم الوكيل فيك يا .......<br />حاكمنا..<br />ظلمت فنهبت فأمنت فنمت (وفي بطنك بطيخة صيفي)..<br />رحمك الله يا عمر..<br />رحمك الله يا معتصم..<br />وربنا يخدك بقى ياللي في بالي"
archived = "2010-03-14"
capture_url = ""

