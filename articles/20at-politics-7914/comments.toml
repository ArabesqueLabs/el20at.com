[[comments]]
order = 1
subject = "ليس كل المقال صحيح"
author = "إسلام"
posted = "2007-12-31"
text = "للعلم هناك من النساء فى باكستان من غير المحجبات وليس الأمر فرضا وليس هناك قانون يفرض الحجاب فى باكستان وأعنقد أنه كان يجب عليك أن تتحرى الدقة فى هذا الأمر ومع إحترامى لتحليلك أرى أن الأمر أكبر من حجاب بوتو فموت بوتو يدعم عدم إستقرار باكستان وقد يؤدى إلى تأجيل الإنتخابات وأيضا قد يؤدى للتدخل الأجنبى وهو ما قد يرغب فيه الكثيرين"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "الرجاء تحري الدقه"
author = "نسيبة"
posted = "2007-12-31"
text = "لا اعلم لما تطالعنا عشرينات دائما بموضوعات فقط للفت الانتباه دون الدقه لا اعلم اين هي الامانه الصحفيه يا استاذه دعاء حضرتك رحتي عشتي في بكستان وشفتي انه الحجاب فرض علي كل السيدات ؟ يا ريت نبطل نبقي لسان للاعلان الامريكي اعتقد الكل يعلم انها كانت ذريعه فقط لامريكا لاقتحام افغتستان حضرتك الان طالعتينا بنفس الذريعه . انا عشت في بكستان 7 سنوات رائيت من حجابهم نفس حجاب بوتو وهو كثر وايضا من اهم اجمل منها بكثير وايضا رائيت الكثير ممن لا يرتدون الحجاب فا لو سمحتي الموضوعيه .. الاستخفاف بعقول القراء ومواضيع التيك اوي الي في ثواني دون معرفه المصدر اصبحت سمه في عشرينات وعلى كلام حضرتك يبقي الجماعه الاسلاميه هناك هتقتل اكثر من نساء شعب باكستان لانه هذه سمه الحجاب عندهم غير الامر في افغنستان الي شكل الحجاب عندهم يختلف ايضا"
archived = "2010-03-14"
capture_url = ""

