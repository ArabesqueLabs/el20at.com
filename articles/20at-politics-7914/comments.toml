subject = "لاأظن"
author = "لميس"
posted = "2007-12-30"
text = "لا أظن يا دعاء بعيد جدا هذا الأفتراض خصوصا الأتهامات التى طالت بنظير بوتو على مر السنولت لا تتعلق على الأطلاق بحجابها بل بسيرتها المالية وسيرة أسرتها كذلك علاقتها مع الولايات المتحدة الأمريكية و السياسة التى أنتهجتها لا يمكن أن ينحصر الأمر فى حجاب ينزلق من على الرأس"
