posted = "2008-01-03"
text = "\"فهل كان هذا الشال \"المتزحلق\" سببا في قتلها، خاصة مع اتهام الجماعات الإسلامية المتشددة بالضلوع في قتلها؟<br />المشكلة دلوقتي إن أي واحد عايز يعمل نفسه مثقف و جورنالجي يروح يقول \" الجماعات الإسلامية المتشددة \" ، إذ كان طالبان و القاعدة نفوا علاقتهم بالموضوع ؟!! و حزب الشعب نفسه اتهم الحكومة بتدبير عملية الاغتيال<br />قرفتونا يا أفاكين !!!"
