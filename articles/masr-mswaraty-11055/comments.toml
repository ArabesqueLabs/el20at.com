[[comments]]
order = 1
subject = "الى المعلق السابق"
author = "مروة عبدالله معيدة بقسم حضارة"
posted = "2009-01-26"
text = "بالنسبة للعنوان الخاص بالموضوع لا داعى للإعتذار عنه لأنه يعبر عن واقع إنتشار ظاهرة الملازم والأوراق الخاصة بمكتبات عديدة لا مجال لذكر أسمها والتى تقوم بتوزيع مثل هذه الملازم<br />أما مسالة إنتشار الدروس الخصوصية وما يحدث من قبل بعض الزملاء ( المعيدين ) فده شىء مؤسف جداً ومخجل فى ذات الوقت فانا كلما رأيت أو سمعت عن هذه التصرفات أشعر بالخجل الشديد وأشعر أن هذه المساله تؤذى الجميع بما فيهم أنا<br />لانى أنتمى إليهم ولأن المعظم يتبع مبدأ الحسنه تخص والسيئه تعم فعندما يذكر موضوع الملازم والمعيدين والدروس الخصوصيه يظن الغالبية خاصة الطلاب الجدد أن كل المعيدين على هذه الشاكله ويقومون بمثل هذه التصرفات<br />أما انت انا أعلم انك تقصد فئه أو مجموعة معينه ولانك طالب بالفرقة الرابعة فأنت على علم بهم<br />أسأل الله أن يهدى هذه المجموعة لان هذه التصرفات تسىء لنا جميعاً<br />فنحن لسنا باعة متجولين نعرض علمنا على كل من يطلب شرائه<br />هذه المسأله تستفزنى بشدة<br />وأرجو بالفعل من إدارة الكلية أن تجد حل جذرى لهذه المسألة لانها تفاقمت بشكل أكثر من اللازم .<br />وأنا بأيدك فى كلامك على فكرة ومش شايفه انه فيه أى تجاوز<br />فهو حق للطلاب من حيث توافر مبدأ تكافؤ الفرص بحيث أن الفيصل يكون مجهود الطالب وبس مش اعتماد على ملزمه أو درس دون أى مجهود<br />وحفاظ على سمعة وصورة المعيد اللى مفروض يكون نواة صالحة لعضو هيئه تدريس فى المستقبل لانه مش معقول يكون قدوة سيئه من وهو معيد أمال لما يبقى أستاذ إيه اللى هيحصل !!!!<br />أتمنى يكون فى حل قريب<br />مع الشكر"
