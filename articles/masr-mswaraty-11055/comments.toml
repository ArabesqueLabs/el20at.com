subject = "مافيا الدروس و المكتبات"
author = "fagomi"
posted = "2009-01-26"
text = "بل أي شيء أود أن أعتذر عن العنوان لكنه بحق أقل ما يجب أن نصف به ما يحدث منذ بداية العام الدراسي حتى الأن .<br />فقد أنتشرت الدعاية و الكروت و المذكرات التي تحمل من كل شكل و لون من الدعاية للمدرسين و المكتبات ، و الأغرب من فيهم يدعي أنه مُعين من الكلية و يمارس الدروس و للأسف الطلاب يستمعون اليهم بل و الأخطر أنهم بدأوا بالفعل في مجموعات الدروس و شراء المذكرات فلابد من وقفة حاسمة لهذا الموضوع لأننا إذا نظرنا الى نتائج الأعوام السابقة عرفنا سببها و هو بالفعل تلك المذكرات التي يعتقد الطالب أنها مثالية لكنها و بحق لا تنفع بل تضر .<br />أرجو من إدارة الكلية أن تتخذ اللازم نحو القضاء على تلك الظاهرة و التي من الممكن بمرور الوقت أن تصبح واقع مفروض على الطالب ، كذلك أين أمن الكلية و هؤلاء يبعثرون دعايتهم داخل المدرجات و ينشرون أتباعهم و للأسف يكونوا من طلاب الكلية المأجورين لتلك المهمة .<br />كذلك هناك ظاهرة - و أنا أسف في تجاوزي هذا - أن بعض المعيدين يقومون بنفس الأفعال بل و أنهم يتصيدون الطلاب من أمام باب القسم و أن أختلف معي أحد فأنا لدي الورق الذي يدرسون منه و كذلك معي أسمائهم بأرقام تليفوناتهم الخاصة سواء تليفون منزل أو تليفون محمول فمن غير المعقول أن يقوم السادة المعيدين بتوزيع أرقامهم لكل من هب أو دب كذلك تعاونهم مع المكتبات .<br />أنا أسف لما طرحته و للأطالة لكنني مُستفز جداً ."
