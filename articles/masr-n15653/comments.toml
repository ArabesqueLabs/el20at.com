[[comments]]
order = 0
subject = "الزيادة لن تكون الاخيرة وهناك زيادات اخرى قادمة وج"
author = "محلل داخلى"
posted = "2008-05-07"
text = "الموضوع مش موضوع 30 %<br />لا<br />الموضوع هو خواء الخزينة العامة والبلد على شفا افلاس<br />كانوا بيحلوا المشكلة بشركة تنباع<br />بنك ينباع - يبيعوا شركة خطوط محمول لاتصالات ب 12 مليار<br />وبتمشى العملية<br />الزراعة وقضوا عليها ودمروا دورة الزراعة القديمة والانتاج راح فى خبر كان<br />والفنادق والقرى السياحية وباعوها للعرب والخواجات وعائدها يسافر اليهم فى بلادهم<br />والمصانع وبيعت للايطاليين واليهود والهنود وغيرهم<br />ومطلوب التزامات واجور ووقود وعربات وملابس ل 750 الف عسكرى امن مركزى لضرب الشعب<br />تجيب الحكومة منين<br />قلصت مصروفاتها على التعليم والجامعات والصحة والمستشفيات ومياة الشرب<br />كا الانفاق على مباحث امن الدولة والامن المركزى<br />هتجيب منين الحكومة<br />لازم الجباية<br />رفع الاسعار<br />عمل حريقة فى الناس وجلدهم<br />والناس معندهاش<br />الخطوة الجاية الضريبة العقارية وكل واحد يدفع على الشقة اللى ساكن فيها<br />المهم تمويل الامن المركزى<br />ينحرق الشعب ويتولع فية بجاز وسخ انما يبقى ميزانية الامن المركزى<br />والنتيجة<br />لا شىء<br />انهيار كل شىء<br />والحكومة مش هتلاقى فلوس<br />ببساطة لان الشعب معدم"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509000048/http://masr.20at.com:80/newArticle.php?sid=15653"

