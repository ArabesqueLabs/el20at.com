subject = "جمال وخبرات بنك اوف امريكا لاادرة ونهب اقتصاد مصر"
author = "سحس كينوود"
posted = "2008-05-07"
text = "بلد كبير زى مصر واقتصادة ضخم وعندة امكانات صناعية وزراعية وخبرات متراكمة فى جميع المجالات لم تستغل بعد بسبب مصالح كبار الحرامية فى البلد وفى الاخر يدو من هنا وياخدو من هناك الضرايب على شركات ومصانع شركاء جمال فى الحكم والبزنس ممنوعة بفرمان من الموميا"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509000048/http://masr.20at.com:80/newArticle.php?sid=15653"
