[[comments]]
order = 0
subject = "اللى شغالين فى القرية الذكية - هنود بتوع كمبيوتر"
author = "لوى بوزو"
text = "الحكومة الذكية<br />اللة يصلح حالكم جميعا - يا حبيبى دول شوية فنيين ومبرمجين هنود شغالين وحولهم شوية اداريين مصريين<br />بينما بتوع كليات واقسام نظم المعلومات المصرية قاعدين فى بيوتهم تحت شعار البطالة والفقر لكل مواطن"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203847/http://masr.20at.com:80/newArticle.php?sid=19281"

[[comments]]
order = 1
subject = "الحكومة الذكية بتتلاعب بالشعب"
author = "مش حمار"
text = "هل علينا ولي العهد في الحكومة الذكية وقال ان الدولة قررت توزع اصولها على الشعب بشكل اسهم<br />وبعدين انكفا على الخبر مجور"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203847/http://masr.20at.com:80/newArticle.php?sid=19281"
