text = "تعليقك ممتاز ممتاز ممتاز<br />واضيف الى تعليقك ان كفاية و6 ابريل والاخوان وبقية الشله دول اسمهم الخوارج<br />اللي مش عاجبهم حاجه ابدا<br />مش عاجبهم الا نفسهم وبس<br />اللي قتلوا عثمان<br />وخرجوا على علي<br />عايزين يخرجوا على النظام وبس<br />عايزين يحكموا وبس<br />عايزين يظهروا وبس<br />مش فاهمين اي حاجه في مصلحة الدولة<br />كل اللي يعرفوه في السياسة انهم يعارضوا وبس<br />يعني النظام يقول يمين هما يقولوا شمال<br />النظام يقول طيب شمال هما يقولوا يمين<br />هو دا كل هدفهم<br />اخلف تعرف<br />يقوموا يشتهروا ويظهروا وبالطريقة دي يوصلوا<br />سلام يا صاحبي<br />_____________________________________________<br />مش شريف الدواخلي ولا البراء اشرف<br />ولا رضوى حسن ولا مروى صلاح<br />ولا عبدالله الطحاوي ولا احمد الهواري<br />ولا دعاء الشامي ولا دعاء حسن"
archived = "2010-03-14"
