posted = "2009-06-09"
text = "هى امريكا دى كوريا الشمالية<br />والا امريكا دى ايران والا الصين الشعبية بتاع الفكر الشيوعى الشمولى<br />مش هى دى امريكا اللى نظام الدولة بيتلقى منها المعونات وبيعمل على ارضائها اناء الليل واطراف النهار وبيقبل الاعتاب لينال الرضى ويحظى بالقبول ويطوف اشياعة بالبيت الابيض لينالوا الغفران<br />يبقى غباء حركة كفاية و6 اكتوبر والاخوان لية واضح وشديد لما يمتنعوا عن الاتصال بامريكا<br />اتصلوا با امريكا جاتكم ستين نيلة - لية تحرم عليكم وحلال على التانيين<br />والا انتم لسة عايشين الفترة الناصرية ومعاداة امريكا ولما صحفى اسمة مصطفى امين اتصل با امريكا حبسوة<br />مش معنى اعباط المهجر بيتصلوا با امريكا ومحدش يقدر يكلمهم<br />كلموا امريكا واعملوا اتصالات مع كل دول العالم"
