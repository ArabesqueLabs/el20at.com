text = "السلام عليكم اسال الله تعالى ان يمن على المسلمين جميعا بنعمة الايمان والتمسك بقواعد الاسلام وزيادة ترسيخه قى قلوبنا وان يجعل القران ربيع قلوبنا بالله عليك يااخ مصطفى انا اريد ان اتعلم عن دينى كل شئ وان كنت لا اعرف من اين البداية عندى 21 سنة ومش عاوزة باقى العمر يضيع من غير مااخد خطوة صح انا بالفعل بدات والحمد لله وبفضل الله تعالى حفظ القران وبدات اتابع برامج دينية كتير على قد مقدر ومنها برنامجك الرائع خدعوك فقالوا ولكن جوايا احساس بالذنب ان اللى فات كله مستغلتهوش صح عشان كده عاوزة اعوض كل اللى فات واجمع واعرف واتعلم كل شئ عن دينى لانى وبصراحة كانى لا افقه شئ عنه سوى الفروض بالله عليك تقولى ابدا منين عشان باذن الله تكون بداية صحيحة ومتهش فى النص او ايأس ارجو منالله عزوجل ان يوفقك فى الرد على على وجه السرعةعلي الايميل<br />the_sniper264@yahoo.com وفى النهاي ادع الله ان يوفقك الى الامام دائما"
