text = "السلام عليكم<br />الحمد لله و الصلاة و السلام علي رسول الله صلي الله عليه و سلم<br />مصطفي حسني<br />Moi je suis une fille qui vit en France,je pris ,et je mais le voile.Grasse à tes émission tous les vendredi .<br />اللهم بارك لنا فيه وادخله الجنه لانه كان سبب توبتي بفضل الله سبحانه و تعال<br />j'ai envies que tu parle sur les musulman qui habite à l'étranger parce que il y'en a plein qui enlève le voile par ex: quant on pars à l'école et quant on travail ces interdit de rentrer avec le voile si on rentre avec le voile on sera virer. ils pense que on mais le voile pour rien j'aimerai que tu leurs explique que il mette pas le voile pour rien je t'en suplie de aider ces musulman il y'en a plein qui sont perdu je sais que tu peu les aiderمصطفي انت حد ماشاء الله عليه ربنا يبارك لك في كل شئ في حياتك و يدخلك الجنة ان شاء الله<br />CES URGENT MERCI"
