subject = "التعديل"
author = "ابو الافكار"
posted = "2007-04-27"
text = "منظر الموقع حلو لكن ناقص بس انكم تظبطوا المسافه الافقيه ودى بتقرف للتحريك لاكمال قراءه موضوع يعنى مفروض يظهر اللى فى الويب بدون تحريك افقى ..فقط راسى يعنى وانا باكتب الان لا استطيع قراءه ما بالجانب الايسر مساحه راى مثلا...ولعلمكم كان موقع مصراوى كان كده الاول والان ميه ميه ظبطوه و اصبح حلو ! ومنتظرين"
