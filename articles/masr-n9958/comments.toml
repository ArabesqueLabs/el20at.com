[[comments]]
order = 1
subject = "انا عمر قفايا"
author = "ديمة"
posted = "2007-04-26"
text = "ازيكم .. قال فقا قال<br />بطلوا شغل الكلاب والقفا واللى معرفش ايه اللى بتشتغلوا فيه ده .. هو انتوا دماغكم ناقصة بوظان<br />نا بصراحة صعقت يا جماعة .. انا فعلا عمرى مااضطربت على قفايا .. حتى فىلعبة صلح لم يكن ضرب على القفا<br />لكن فى موقف مش بنساه ابدا .. اللى حصل:<br />ان بابا حبيبى رمز كل حاجة حلوة<br />كان بيذاكر لى انا واخويا التوأم .. محمد كما يقولوا له او حمادة بالنسبة لى .. المهم الاخ حمادة ده عسل كنا نقعد نذاكر كل يوم وهو يا عينى ياربى تهذيق على ضرب على شتايم منيلة<br />وانا قاعدة برنسيسة وذالين نفس الولا بى .. انا شاطرة باعمل الواجب بقى ..<br />كنت باستغرب قدرته على الاستهزاء من كل ده .. بجد ماكنش فارق معاه خااالص .. ضحك وتريقة على باب عشان عيته بتحمر ويبولى شفايافه ومش بيقول غير يابن ال ..<br />لغاية ما تطور الحساب وبقت مذاكرة رياضة<br />هنا وقع المحظور، وبدأت لاول مرة فى حباتى استدرج لخانة الاهانة والمهزئة<br />كنت فى خامسة ابتدائى وعملت النظارة من اسوبع واحد، وقاعدة قدام مسالة هندسة باحاول اقلد محمد ومش يهمنى من التهذىء والتبريق واصحك فى سرى<br />لغاية مابابا حط الكراسة قدامى ورسم المثلث اللى فى المسـالى بشكل كبير، وقالى المثلث قائم يبقى الضلع ده طوله كام، شكت وقعدت ابص للرسمة اوى ومافيش حاجة راضية تيجى، وهنا تلقيت خبطة مفاجـاة على رأسى ـ كانت الاولى والاخيرة من نوعها ـ لم تكن على قفايا لكن كان وقعها اقوى لانها ادت الى اسقاط النظارة من على عينى .. فضحك محمد<br />لم اجد ما افعله ظللت انظر للورقة ثم بدـا كل شىء فى التلاشى النظارة المثلث يد بابا قلم محمد وطفى سيل من لآلىء جميلة مبهجة لكن موجعة .. دموعى طبعا<br />قفاية بقى .. سلام ومبروك ياولاد وبنات البلد"
archived = "2007-04-28"
capture_url = "https://web.archive.org/web/20070428025101/http://masr.20at.com:80/newArticle.php?sid=9958"

