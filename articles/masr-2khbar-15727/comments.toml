author = "مصرى"
posted = "2010-03-13"
text = "مرسى مطروح تؤكد:<br />• الأحداث جرت في كنيسة الملاك بالريفية – مرسى مطروح.<br />• عدد المصابين يصل 27 قبطي حتى الآن منهم ثلاثة في حالة حرجة جدا.<br />• تأكيدات عن اعتقال عدد كبير من شباب الأقباط، منهم من تم اعتقاله من داخل الكنيسة أثناء تهريبهم بعربة الترحيلات.<br />• عدد الخسائر لا يقدر حتى الآن ولكنه كثير من سيارات ومنازل وممتلكات الأقباط.<br />• مازال هناك محاصرون داخل الكنيسة من الأقباط منذ أمس وقت اندلاع الأحداث."
