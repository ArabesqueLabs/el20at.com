text = "مش علي بونجو بس<br />زمان كان فيه واحد اسمه معاوية ابن ابي سفيان طلع في دماغه انه يورث ابنه الحكم بعد ما كان بالشورة ايام الخلفاء<br />القصة طويلة<br />المهم مات معاوية واستلم يزيد<br />اتورط في قتل الحسين يا عين امه واتجنن ومات بعد 3 سنين فقط<br />يعني معاوية ورط ابنه وضيع ابنه وقضى عليه<br />ونحن ندعو حسني مبارك ما يغلطش غلطة معاوية وبونجو<br />اللي بيحب ابنه يبعده عن النار وحكم مصر في الايام الجاية نار<br />سلام<br />،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،<br />مش شريف الدواخلي ولا البراء اشرف"
