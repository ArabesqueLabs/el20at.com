subject = ""
author = "جمال مبارك"
posted = "2010-02-02"
text = "جمال مبارك ليس اقل من<br />ابن ملك المغرب الذي تولى بعد وفاة ابوه<br />ابن ملك الاردن الذي تولى بعد وفاة ابوه<br />ابن ملك البحرين الذي تولى بعد وفاة ابوه<br />ابن ملك الامارات الذي تولى بعد وفاة ابوه<br />ومصر طول عمرها منذ 7000 سنه الحكم فيها وراثي<br />حتى ايام جمال عبدالناصر جاب السادات وفرضه على الناس كولي عهدـ<br />والسادات جاب حسني مبارك كولي عهد<br />اكبروا بقا وبلاش شغل عيال<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش دعاء الشامي ولا دعاء حسن<br />بلاش المرادي مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
