text = "معاوية حينما نازع الخلافة سيدنا على رضى اللة عنة الخليفة المختار من المسلمين<br />استند الى جملة من اختراعة هو - روجها الذين اسلموا كرها من اليهود والعرب - هذة الجملة هى<br />خياركم فى الجاهلية خياركم فى الاسلام<br />يعنى اللى كان قائد وزعيم ورئيس قبيلة فى الجاهلية ومن خيار الناس مالا وجاها يبقى بعد الاسلام برضة هو الزعيم والرئيس والخليفة<br />خياركم فى الجاهلية هم خياركم فى الاسلام<br />وعلشان كدة طلعت اغنية احنا اخترناك ايام حسنى مبارك<br />وابو حسنى مبارك لم يكن من خيار القوم ولا زعيم ولا من الكبار - بل حتة موظف من الدرجة العاشرة فى وظائف الخدمات فى احدى المحاكم وهذا ليس عارا بل شرف كبير لة<br />ولكن العار ان يحس انة ملك هذة البلد وتلك الدولة ويورثها لابنة<br />كان مجرد لواء طيار مثل الاف اللواءات من ابناء الوطن فلماذا يحتكر تلك الوظيفة فى عائلتة ويريد ان يورثها لابنة وحفيدة<br />هل يتبع مقولة معاوية<br />خياركم فى الجاهلية هم خياركم فى الاسلام"
