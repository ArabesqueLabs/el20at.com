text = "ابن عائلة المليونيرات اللى جدة كان رئيس وزراء وعمة وزير الخارجية<br />مش بيقولوا لما نجيب وزير مبسوط وغنى وابن ناس مش هيمد ايدة على فلوس الغلابة لانة مش محتاج والولد جيمى او كيمو لما يحكم مصر عندة 750 مليون دولار ومش هياخد حاجة من فلوس الشعب لانة شبع خلاص<br />طيب الشبعان يوسف بطرس غالى راح عالج عينية بمليون جنية على حساب الدولة لية<br />يعنى الشبعان يتعالج فى عينية بمبلغ يساوى علاج محافظة كاملة زى محافظة قنا<br />امال لو كانت طيزة بتوجعة زى وزير الثقافة كان اتعالج بكام<br />العملية عايزة بلدوزر يشيل النظام دة من جدور ابوة ويرمية فى البحر<br />العملية بزرميط<br />دى مش حكومة<br />هو الوزير بعد رحلة العلاج ما بيظهرش لية<br />مكسوف<br />حاطط على وشة منخل<br />بيفكر يعمل اعلانات وينزلها فى التليفزيون زى اعلان يا عبد القوى لتشجيع الناس على دفع الضرائب"
