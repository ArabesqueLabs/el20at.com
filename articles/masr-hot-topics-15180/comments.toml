[[comments]]
order = 12
subject = ""
author = "رئيس يعمل اية ؟"
posted = "2010-02-05"
text = "احنا عايزين رئيس يعمل اية ؟<br />ما هى الواجبات الوظيفية لرئيس الدولة ؟ بمعنى يصحى من النوم يعمل اية ويشتغل كم ساعة ويشتغل فى اية ومين يحاسبة ومن هى الجهة المخولة بالرقابة علية ؟<br />نفترض اننا اخترنا رئيس منظر واختار احد البلاجات وقعد هناك يصطاد سمك وياكل جمبرى ويضحك ويناغش فى الحاشية بتاعتة<br />مين اللى هيسألة - انت بتعمل اية - انت سايب شغلك لية<br />مطلوب لجنة من 100 شخصية كبيرة تكتب الواجبات الوظيفية لرئيس الدولة وتكتب لة البرنامج التنفيذى اللى هيعملة واللى هينفذة - مش برنامج يحطة هو من دماغة وبمزاجة<br />تماما زى المانيا او انجلترا<br />ميركل بتعمل اية<br />ماشية على برنامج مكتوب بالمسطرة وبتنفذة حرفيا<br />وبيغيروا المستشار كل اربعة سنين<br />مفيش حاجة اسمها رئيس مؤبد ولا بيسندوة علشان يمشى لانة من ال البيت ومن السلالة العلوية للحسن والحسين ولو ترك الحكم الحسن والحسين هيسخطوة ويحولوة فار والا كلب<br />كل العالم تقدم<br />وحتى الوثنيون فى كوريا واليابان والهند<br />وبقيت امة محمد فى زبالة التاريخ بسبب رؤسائها المتخلفين"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205173927/http://www.20at.com:80/masr/105-msa7t-r2y/15180-2010-02-02-18-07-33.html"

[[comments]]
order = 13
subject = ""
author = "قمة التخلف الحضارى"
posted = "2010-02-06"
text = "قال لى رجل كبير تخطى الستين انة نزل الى عواصم احدى المحافظات لقضاء مصلحة - وهو رجل كان ذو مكانة وعلم ومحترم<br />بحكم الشتاء وبحكم كبر السن - الراجل اتزنق وعايز حمام<br />المحافظة بتغير حجارة الارصفة الجديدة كل سنة وعاملة تماثيل صناعية للفراعنة فى الميادين وبتصرف بدلات وحوافز وبتصرف ملايين على علاقات عامة ودعاية<br />ولا يوجد دورة مياة بسيطة عامة فى الشوارع والميادين<br />وببساطة يمكن عمل مبولة فى كشك صغير ونظيف فى نهاية كل شارع - فى مساحة متر فى مترين وبالخشب - صعبة - ابدا<br />الراجل الكبير المحترم وقف خلف كشك كهرباء فى الشارع وتبول خلفة باحتقار شديد لنفسة<br />ماذا يصنع ؟<br />ماذا يصنع الاف الناس فى الشوارع ؟ يتبولون تحت الكبارى وخلف الجدران وبجانب شجرة<br />هل سيادة اللواء المحافظ بيفكر فى الحاجات البسيطة دى - ابدا<br />دى لواء اركان حرب كبير بتاع عمليات وتكتيك ومناورات وجاى يشتغل الوظيفة دى ابهة<br />اناس فى الوظائف للمنظرة والبرستيج ويقعد على الكرسى وترابيزة الاجتماع يناقش فى ارسال برقية تعزية او تهنئة لواحد تانى فى وضع اعلى<br />مفيش احد بيهتم بالناس<br />اتركوا الكلام جانبا<br />المهم الكاس والكورة"
