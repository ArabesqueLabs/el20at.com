text = "ومتفرقش<br />ولا نقاش مع الجهلة<br />الطيارة كانت طيارة نقل وكان فاكر ان مطارات الصعيد امنة<br />والمطارات يا ابو جهل لم تضرب فى غارة واحدة بل فى تلات غارات متتابعة من الساعة السابعة صباحا وحتى الثانية عشر ظهرا فى موجات متتابعة وفية طيارين طلعوا وحاربوا وقاتلوا واستشهدوا<br />وفية ابطال كتير فى الطيران قاتلوا ببسالة بطيارات روسية متخلفة لا تصلح للقتال مع مقاتلات امريكية<br />وهناك ابطال كثيرون بنوا سلاح الجو ومنهم مدكر ابو العز وغيرة وغيرة<br />الجيش المصرى مملوء بالابطال والشجعان والمقاتلين وممن يعطون فى صمت رغم ضعف الامكانيات وضعف المعدات"
