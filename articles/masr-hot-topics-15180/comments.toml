text = "طبعا انت عارف على بونجو<br />ابوة غير الدستور<br />وعزل القضاة بعيدا عن الانتخابات<br />والنيجر اصبحت عزبة وابوة مات وخلفة ابنة على بونجو وتولى الحكم بالوراثة وتم ارسال برقية تهنئة من ابوك بتولية مقاليد الحكم<br />صورة بالكربون من اللى انت بتخطط لة<br />ولكن من يومين قام الجيش بانقلاب ضد على بونجو ابن بونجو الكبير ولم يستمر فى الحكم اكثر من 4 شهور<br />وقبض الجيش على على بونجو ووضع فى المعتقل وتولى ضابط منهم الحكم<br />وماسكين على بونجو وبيكهربوة فى الاماكن الحساسة<br />يعنى بيحطوا سلك الكهرباء على بتاعة وعلى صرصور ودنة<br />نصيحة - خد فلوسك واهرب<br />البرادعى وصل<br />سلموة البلد وهو يضمن لكم خروج امن<br />والا<br />على بونجو قصتة هتكرر"
