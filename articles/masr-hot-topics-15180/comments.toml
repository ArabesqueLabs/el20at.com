text = "لان البرادعى نفس مؤهلات واخلاق سعد باشا زغلول ومصطفى باشا النحاس<br />امتداد للحركة الوطنية المصرية المثقفة التى ئؤمن بالديمقراطية والتعددية طريقا<br />لم نسمع عن باشا فى زمن الملك اغتصب ارض الدولة او وزعها على المحاسيب والقرايب كما فعل وزير حسنى مبارك للاسكان محمد سليمان<br />ولم نسمع ان الامن حاصر شارع الازهر ومنع المصلين من الصلاة لمجرد ان تظاهرة صغيرة ستقف لتعبر عن رأيها<br />ولم نسمع ان الامن اغلق الشوارع وركب فوق اسطح البيوت بالرشاشات وعملوا حيطان من جنود الامن المركزى لان الملك فاروق رايح يفتتح طرمبة مجارى او كشك سجاير او ميدان فى شارع كما نرى الان<br />نريد البرادعى فى وسطنا غير محاط بجيوش الامن وحيطان الامن المركزى<br />عايزين رئيس يروح الديوان الساعة تسعة صباحا ويرجع اتنين الظهر مش رئيس فى اجازة مفتوحة لمدة 30 سنة فى شرم الشيخ وسايب الامن يحكم البلد<br />عايزين رئيس يخطب من غير ورقة ويقول كلام من قلبة مش كلام كتبة صحفى مغمور من ايام الاتحاد الاشتراكى<br />عايزين حكم محلى مدنى<br />مش حكم محلى تبع وزارة الحربية - المحافظ ورئيس الحى وحاكم المدينة لواء اركان حرب"
