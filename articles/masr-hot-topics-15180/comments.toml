author = "الفيصل في الرئاسه"
posted = "2010-02-07"
text = "سواء كان الرئيس حيبقى جيمي او طنطاوي او سهير ذكي<br />الفيصل في عملية الحكم هو قيادة الجيش والسيطرة على القوات الامنية<br />يعني اذا كان جيمي مسيطر على قوات الجيش والشرطه وحيعرف يتحكم فيهم وحيعرف يغير القيادات من وقت لاخر<br />والقيادات حتدين له بالسمع والطاعة يبقى هو رئيس مصر القادم<br />لكن اذا كان يجهل هذه الناحية وانا اشك في هذا لانه غير عسكري على الاطلاق<br />فانصحه بالابتعاد عن هذا الموضوع لانه سيتعرض لانقلاب عسكري والقتل<br />اما اذا كان بيفهم في الجيش وعنده القدرة على السيطرة على القوات الامنية وتغيير قيادتها كلما شاء وكيفيما شاء فمرحبا به<br />________________________<br />مش شريف الدواخلي ولا البراء اشرف"
