order = 0
subject = "أخر الرجال المحترمين"
author = "المصرى أفندى"
posted = "2009-02-16"
text = "أحيى الدكتور البرادعى على رأيه الجرىء. قال قول الحق واللى زعلان يشرب من البحر. اللى بيحب مصر يقول الحق ولو على رقبته لأنه بيخاف على البلد. لكن الجبان اللى بيخاف على مصلحته الشخصية زى عمرو موسى بيدارى ويتكلم كلام هلامى علشان ما يزعلش اللى فى القصر. بأحلم بيوم أشوف الدكتور برادعى يرشح نفسه ليكون رئيس لمصر علشان نخلص بقى من قصة أل مبارك ومن الأخوان والحزن الوطنى. قادر ياكريم.. نريد أن نرى أخر النفق ياناس.. دا كابوس والله.."
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218023600/http://masr.20at.com:80/newArticle.php?sid=20007"

