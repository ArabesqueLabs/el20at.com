order = 0
subject = "(قانون مرور اية؟)مابلاش تفاهة"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-02-11"
text = "اى قانون مرور هذا الذى تتحاكون عنة؟<br />الاول يجب تطبيق القانون بحذافيرة دون اية مجاملات؟<br />و من ثم دعونا نتكلم عن هذا القانون المشبوة؟<br />الاول عندما نتخلص من المجاملات على كافة اشكالها و انواعها و من ثم نبقى نتكلم على القانون و تطبيق القانون<br />صحيح بلد بتاعت تصاريح؟"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213172211/http://masr.20at.com:80/newArticle.php?sid=19865"
