[[comments]]
order = 0
subject = "نيلسون مانديلا المناضل الافريقى خرج من السجن بعد 30 سنة وطلق زوجتة التى ناضلت معة"
author = "سعيد"
text = "كل بيت فى مصر وكل اسرة بيحصل فيها خلافات - والزوجة بتاخد هدومها وتروح تقعد عند امها شوية لغاية ما تهدى النفوس ويتخل الناس ولاد الحلال وينهوا الخلاف<br />والشرع بيقول حكما من اهلها وحكما من اهلة - يعنى كبار العيليتين بيقعدوا ويحلوا المشكلة<br />اما اذا كان فية احد عايز يشوة سمعتة الشخصية والعائلية لاغراض سياسية فالناس مش جهلة قوى وعارفة اية اللى بيتم وراء الكواليس<br />وانا اعتقد انة خلاف عائلى سينتهى قريبا اليوم او غدا - فزوجتة كافحت معة اثناء سجنة وكانت بنت ب 100 راجل"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408073016/http://masr.20at.com:80/newArticle.php?sid=20539"

[[comments]]
order = 1
subject = "طارق نور الحرامي بالنصب والدعارية العليا انكشف يا رجاله"
author = "مش ححبك"
text = "محامي فاشل يدعي الاصلاح<br />اذا كان لم يستطع المحافظة على بيته<br />اذا كان لم يستطع تحمل زوجته<br />اذا كان لم يستطع حل مشكلة اسرته<br />بالله عليكم كيف سيتحمل مشكلة شعب مثل الشعب المصري<br />وكيف سيحقق وعوده الكاذبة<br />الحرامي بالنصب والدعارية العليا انكشف يا رجاله<br />وانا ارجو من الشعب المصري ان يأخذ من درس جمال عبدالناصر ورجال الثورة عبره لهم<br />مش اي واحد كداب كده يطلع نصدقه<br />وفي الاسلام طالب الامارة لا يولاها<br />واذا كان فيه واحد يستحق ان نوليه علينا هو عمر خالد<br />لانه انسان مصلح من غير ما يطلب سلطه ولا منصب"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408073016/http://masr.20at.com:80/newArticle.php?sid=20539"

[[comments]]
order = 2
subject = "بعد خروج ايمن نور من السجن"
author = "متفرج"
text = "كنا نحن القراء نتابع خروجة من السجن وما تم بعدها من قيام شخصيات من الحزب الوطنى والمطيباتية بتوع النظام بزيارتة فى منزلة وتقديم باقات زهور وهدايا<br />وكنا نستغرب ازاى الناس دى تزورة بعد اللى عملوة فية - وطبعا على القهوة تسمع الناس على قعدة الشيشة بتعلق بمفهومنا المصرى البسيط - الناس راحوا يزوروة مش محبة ولكن علشان يفطموة ويقولوا لة خلاص انت خرجت من السجن ومطلوب منك تلم الدور وتسيب السياسة وتشوف مصلحتك - ممكن نساعدك فى شغل البزنس وتبقى مليونير - ويا عم سياسة اية - سيب السياسة للكبار هو انت هتعمل راسك براسهم - اتلم يا عم نور واعرف حجمك وخد بالك المرة اللى فاتت اتسجنت وجت سليمة المرة الجاية اللة اعلم هيجرى لك اية<br />يعنى ايمن نور تعرض لضغوط رهيبة<br />ولكنة صمد ويظهر ان عنادة بدأ يضايقهم فبدأوا يلاعبوة الحنجلة<br />وكان اللة فى عونة<br />وعمار يا مصر"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408073016/http://masr.20at.com:80/newArticle.php?sid=20539"

[[comments]]
order = 3
subject = "ايمن نور وامثالة هم الامل الوحيد الباقى لمصر"
author = "وبرضة هحبك"
text = "هؤلاء الشباب هم امل الامة<br />وهم سوف يخرجونها من ظلام الاستبداد والفساد وحكم المحنطين الى مصر الفتية العفية<br />وبعيدا عن الاخوان الذين غدروا بجماعة 6 ابريل امس وساعدوا الحكومة فى افشالة - يبقى ايمن نور الامل"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408073016/http://masr.20at.com:80/newArticle.php?sid=20539"

