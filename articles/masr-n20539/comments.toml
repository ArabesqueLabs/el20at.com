[[comments]]
order = 5
subject = "عمرو خالد"
author = "عمرو خالد"
text = "عمرو خالد مين والناس نايمين الى يمسك البلد ده وايمن نور مين واخوان مين<br />محدش ينفع فيهم والى يفكر بالمنطق فى حد فيهم هايمسك البلد وهايمشى ويبقى ديمقراطى ادى دقنى لو حصل كلهم زى بعض هو اه الى هيهجى هايعمل شويه تنظيم وسبحان الله يعنى خلال 4 سنين هايبقى مصر عمرو خالد مثلا زى مصر مبارك كدة ويمكن يطلع حارب برده وهو الى كانو ملبسينه ساعه الصفر فى الحرب<br />ارحمونا بجد ولا واحد فيهم ينفع<br />ومتسالونيش عن حل لان حاليا مافيش حل"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408073016/http://masr.20at.com:80/newArticle.php?sid=20539"

[[comments]]
order = 6
subject = "لا يجب ان يسمح المصريون بالحكم الفردى الفرعونى مرة اخرى - مش عايزين انا فرعون ربكم الاعلى"
author = "مصرى"
text = "ما نريدة نظام زى نظام اسرائيل او الهند او بنجالاديش<br />رئيس تستدعية الشرطة وتستجوبة زى ما بنشوف مع اولمرت وشارون وغيرة ويكون انسان عادى مش فرعون بيمشى بعربية مدرعة وتغلق لة الشوارع والمدن علشان هيمر<br />نظام انتخابى زى الهند والحزب اللى ينجح هو اللى يشكل الوزارة والنجاح يكون بنزاهة وشفافية والوزير اللى يغلط يروح ويحاسب امام مجلس الشعب<br />مطلوب نظام حكم زى بقية الدول ومش مهم مين لانة هيتغير ومش هيركب على انفاس البلد لغاية ما يموتها<br />عايزين نسيب النظام الفرعونى فى الحكم الى النظام الذى يعتمد على الشورى وراى الناس<br />ما عملتة ثورة العسكر سنة 1952 هى انها الغت الملكية واحيت الفرعونية فى الحكم<br />مفيش احد يقول عمرو خالد احنا مش عايزين امير للمؤمنين ولا ايمن نور - احنا عايزين موظف بدرجة رئيس الجمهورية يحاكم امام مجلس الشعب"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408073016/http://masr.20at.com:80/newArticle.php?sid=20539"

