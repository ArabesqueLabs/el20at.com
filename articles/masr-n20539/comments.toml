subject = "منظمة أقباط الولايات المتحدة - رسالة عتاب إلى د/ أيمن نور"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
text = "منظمة أقباط الولايات المتحدة - رسالة عتاب إلى د/ أيمن نور ممدوح زكى زخارى جرجس_الاسكندري. 23-08-2008 10:08. للاسف اللذين يتحدثون عن الخطاب باعتباره استنجاد باوباما لم يقراوا الخطاب فالخطاب من رجل سياسى من الطراز ...<br />www.copts.com/arabic/index.php?option=com_content&task=view&id=3019&Itemid=28 - 47k - نسخة مخبأة - صفحات مشابهة"
archived = "2009-04-08"
