author = "مواطن غلبان"
posted = "2010-02-06"
text = "تحية وشكر وتقدير لرجالامن الاسكندرية الذين طهروا مدينة المحلة من هذا الشخص البغيضلكم كل التقديروسحقا للمتخاذلين من امن المحلة الذين لا يقومون بدورهم الا علي المواطن الغلبان والذي يسير جنب الحيط وهات بطاقتك ويمسك الطلاب هذا امن المحلة شاطر علي الغلابة وطلبة المدارس اما البلطجية المنتشرين في المحلة فشكرا ولا يعرفوهم رغم ان الرجل الغلبان يعرفهم جيدا ولكن بقدرة قادر رجال الامن في المحلة لا يعرفونهم شئ مبكي مضحك لم تنتهي المشكلة في المحلة ولا واحد يطلع ويقول تنسيق مع امن المحلة والكلام دة طيب في داخل مدينة المحلة عائلات بأكملها مثل عادل عفيفي ياريت نسمع انة تم قتلهم او اعتقالهم لما لهم من خطورة علي الغلابة امثالي ولكن طبعا الناس دي لها السطوة والباقي معروف يعني ازاي يدخل ويموت واحد قلنا ماشي التاني كان الامن فين التالت كان الامن فين الرابع كان الامن نايم وبيقفش في العيال ويفتش الميكروباصات ادي اللي هما شطار فية البلطجة تعبس في الارض فساد في المحلة وعادل عفيفي ماهو الا شخص وهناك اكثر من الف عادل عفيفي ارجوا من رجال امن الاسكندرية ان تأتي للمحلة وتخلصنا من هؤلاء جميعا"
archived = "2010-03-14"
capture_url = ""

