posted = "2010-02-06"
text = "يا عم قول يا باسط امن اية اللي في المحلة الامن بيرعي البلطجية مهو الامن اللي ساب عادل عفيفي لحد ما اصبح سفاح اد الدنيا يعني لما قتل واحد واتنين وتلاتة واربعة مهو كان بيحصل القتل في المحلة لكن الامن نايم اما رجال الاسكندرية اصطادوة زي الفيران رجالة رجالة ياضباط امن اسكندريو والله لومكان حبيب العادلي والله لكان ترقية لكل ضابط وعسكري ونوط الواجب كمان ومش شوية عليكم يا حماة المواطن الغلبان انا لا اعرف عادل عفيفي ولكن سمعت العجب ويعني استفساروالله برئ هوكان فين امن المحلة ؟؟؟؟ مهو من المحلة وكل مرة يقتل داخل مدينة المحلة واتكرر المشهد اربع مرات غير تجارة المخدرات اللي كان يمارسها كل دة والامن في المحلة ولا يعرف حاجة ههه شكرا رجالة اسكندرية ياريت تعلموا بتوع المحلة اصول الشغل وهو حماية الفقير مش عمل محاضر للفقراء لمجرد اثبات شغل شئ مخجل للمحلة وامتياز لرجالة الاسكندرية والكبير كبير ارجوا من وزير الداخلية تكريم ضباط الاسكندرية علي براعتهم وياريت عملوا مسح بسيط في المحلة وتخلصوها من كام عادل عفيفي منتشرين في المحلة واهو تخدوا ثواب تخلصونا منهم"
archived = "2010-03-14"
