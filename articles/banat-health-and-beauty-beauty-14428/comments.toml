[[comments]]
order = 39
subject = ""
author = "د/ندى"
posted = "2009-12-20"
text = "السلام عليكم...على فكرة يابنات ...كتير بننسى ان الحجاب أصلا أمر من ربنا...فرضه لحماية المرأة من عيون الرجال ونظراتهم الغير بريئة أحيانا وحماية لنا من الاذى(ذلك أدنى أن يعرفن فلا يؤذين)....المشكلة اننا أصبحنا نعتبره زينة وموضة ووسيلة لجذب الانظار....الحجاب هو الحجاب في أي زمان ومكان وعلى من ترتديه أن تعلم انها لوخدعت كل أحد فلن تستطيع خداع ربها الذي وضع الحجاب لصيانتها ووضع لها شروطه...تستطيعين ان تلبسي حجابا أنيقا لكن يتوفر فيه الشروط الشرعية...<br />1-لا يظهر من جسدك شيئا الا الوجه والكفين (على القول الراجح)<br />2-لا يصف (ليس ضيقا مثل البدي والبنطلون)<br />3-لايشف<br />4-لا يكون زينة في نفسه(بدون مكياج ولا الوان مبهرجة)<br />5-لا يكون معطرا ولا به طيب<br />6-الا يكون لباس شهرة(يعني غير ملفت للنظر سواء بالوانه او شكله الغريب)<br />ومن أجمل وأستر أشكال الحجاب ماتلبسه الفتيات في فلسطين وسوريا والاردن من بالطو او تونيك او عباءة وعليه ايشارب من لون واحد...وانا شخصيا ارتدي هذا الحجاب وكثيرا ما توقفني فتيات ليسألنني عنه اعجابا بشكله وفي نفس الوقت اشعر براحة كبيرة للالتزامي باوامر ربي"
archived = "2010-03-14"
capture_url = ""

