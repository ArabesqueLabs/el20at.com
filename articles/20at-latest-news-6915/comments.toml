subject = "بديل إسلامي مقنع"
author = "عبدالرحمن نجم"
posted = "2007-11-28"
text = "نظراً لإنهماكي الشديد في العمل الصحفي فإني لا أتابع الأناشيد الجديدة غير أن الصدفة حدت بي إلى أن أستمع إلى أنشودة مالك غير الله، فأحدثت وقعاً عظيماً في نفسي فكأني أنا هذا الشاب الذي عاد إلى الله بعد أن كان برفقة رفاق السوء والذي وقع له حادث الدراجة الذي كاد يودي بحياته وقد تجلى مدى تأثري بالأنشودة إلى درجة جعلت الدموع تحتشد في عيني وأنا أرى الشاب بعد كل هذه المصائب وحادث السير يرفع يديه متضرعاً إلى الله.<br />أشكر القائمين على العمل الإسلامي الهادف الذي يوقظ في الأمة قلبها النائم ، كل الشكر والإحترام"
archived = "2010-03-14"
