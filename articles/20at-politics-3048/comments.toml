[[comments]]
order = 3
subject = "انا معاك فى رايك"
author = "مصرية"
posted = "2007-03-08"
text = "انا معاك يا الفاتح فى الكلام اللى انت بتقوله انى كل الاوطان العربية بقت سجن للمواطنين والسجان الحكومة ومدير السجن امريكا واسرائيل لكن اللى بتمر بيه الدول العربية انا حاسة انها هتعدى كانها زوبعة فى فنجان بس زوبعة قوية شوية بس ان شاء الله كلنا هنحطم قيود السجن لانى اى حضارة عظيمة لازم تمر بشوية ضعف او شوية خمول . بس ان شاء الله كلنا هنطلع من الزوبعة بخير لكن الحكام العرب فانشاء الله ربنا هيورينا فيهم يوم لانى ربك ميرضاش بالظلم واحنا اتظلمنا كتير"
archived = "2010-03-14"
