[[comments]]
order = 2
subject = "أسير أنا فى داري"
author = "الفاتح"
posted = "2007-02-19"
text = "طالما طال الصمت فلن يتوقف الأمر عند هذا الحد ، لكن قبل النظر لما يفعله اليهود بإخواننا فللنظر إلى ما تفعله بنا حكوماتنا التى أضحت لا هم لها إلا قمع كل فكر وصوت ولسان معارض ، حتى أصبحت بلادنا العربية والإسلامية بكل وضوح و صراحة معتقلا كبيرا بكبر الوطن الذى كان يوما كبيرا و لكن عسكر المعتقل فى داخل الوطن هم أبناء الوطن الذي ناهن جميعا علي أنه قد لفظهم من قلبه ، و ينتظر الوقت الذى يلفظم من مساحته وليبحثوا لهم إذا عن أرض بغيضة مثلهم لتظلهم بسمائها<br />أما وطننا نحن فسيبقى أبدا حرا وقويا وكبيرااااااااااااااااااااااااااااااااااا"
