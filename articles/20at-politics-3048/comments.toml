order = 0
subject = "كان الله فى عونهم"
author = "بسلة مسلمة مصرية"
posted = "2007-01-24"
text = "الله معهم واتمنى لو كنا كلنا معهم لكن انا متاكدة انهم شجعان والله سوف يجعل هذا فى ميزان حسناتهم<br />رغم انى متاكدة ان مفيش واحد من الرؤساء او اصحاب الفخامة والسمو والعلو والارتفاع يقدر يستحمل قلم واحد لكن حقول اية ربنا يورينا فيهم<br />وانا مقتنعة تماما الاقتناع ان موقف الشعوب العربية غير موقف حكامها"
