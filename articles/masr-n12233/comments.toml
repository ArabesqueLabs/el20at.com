[[comments]]
order = 0
subject = "ابن مين يبقى مرتبة قد اية"
author = "حمد السيد النجار"
text = "ضحكتنى من قلبى بجد - تعليم اية وهباب اية<br />العملية الواد ابوة مين فى الدولة يبقى مرتبة كام<br />تمشية مسائل وتسليك امور<br />شركة استيراد وتصدير بتتعامل مع الجمارك يبقى ابن مدير الجمارك اللواء فلان يتعين عندهم بخمسين الف جنية فى الشهر علشان ابوة يفوت الجمل من خرم الابرة<br />والامثلة كثيرة جدا ليس بينها ابدا جودة تعليم ولا نوعيتة ولا الخزعبلات اللى بيضحكوا بيها على الناس<br />ابن مدير فى بنك مركزى ابنة يتعين فى بنك استثمارى بخمسين الف جنية علشان ابوة يعمل تسهيلات اتمانية لحرامى تبعهم<br />بعبارة واضحة شيلنى واشيلك<br />كلة بيسرق<br />وكلة حرامى<br />وكلهم هيروحوا النار"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102120251/http://masr.20at.com:80/newArticle.php?sid=12233"
