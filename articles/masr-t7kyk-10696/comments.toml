subject = "عيدكم سعيد"
author = "من البراجيل"
posted = "2008-12-08"
text = "كل عام ومصر الاسلامية وكل المسلمين بالف خير وسعادة واعادة اللة عليكم عيدا سعيدا ونصر المسلمين فى مشارق الارض ةمغاربها ورفع راية الاسلام والتوحيد عاليا واذل المشركين والضالين<br />عيدكم سعيد<br />ودعواتكم لاخوتكم المسلمين المحاصرين والمقبوض عليهم خلف قضبان السجون ان يفك اللة اسرهم وان يهلك الظلمة والجبارون بفضل صباح هذا العيد يارب العالمين<br />وكل عام وانتم بخير"
