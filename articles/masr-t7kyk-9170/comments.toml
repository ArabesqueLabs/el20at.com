order = 1
subject = "الدولة فى حالة كوارث عامة - حسب المادة الاولى من ق"
author = "عتريس المحامى ( تخصص كوارث )"
posted = "2008-05-26"
text = "قانون الطوارىء<br />المادة الاولى فى قانون الطوارىء<br />مادة 1<br />يجوز اعلان حالة الطوارىء كلما تعرض الامن او النظام العام فى اراضى الجمهورية او فى منطقة منها للخطر سواء كان ذلك بسبب وقوع حرب او قيام حالة تهدد بوقوعها او حدوث اضطرابات بالداخل او كوارث عامة او انتشار وباء<br />هذا نص المادة واحد لتطبيق قانون الطوارىء<br />وبما البلد ليس فيها حرب او قيام حالة تهدد بوقوعها فانها يبقى اسباب كوارث عامة او انتشار وباء وراء اعلان رئيس الدولة قانون الطوارىء<br />يعنى النظام يعترف بأن البلد فى حالة كوارث عامة منذ 26 سنة هى فترة حكمة<br />اذن نحن نقبل قانون الطوارىء ما دام رئيس الدولة يعترف ان البلد الذى حكمها 27 سنة فى حالة كارثة عامة واضطرابات بالداخل<br />شكرا للحزب الوطنى<br />لا احد يتكلم عن انجازات - نحن فى حالة كوارث عامة ولذلك طبقنا قانون الطوارىء الذى لم يأتى اى ذكر للارهاب الذى تتشدقون بة اى ذكر<br />فلم يكن قد اخترعت كلمة ارهاب ايام عمل هذا القانون الشهير ولكن كان هناك كوارث<br />اذن نحن نقبل قانون الطوارىء لاننا فعلا فى حالة كوارث مستمرة ولا يوجد اى كلمة ارهاب فى مفردات هذا القانون"
archived = "2010-03-14"
capture_url = ""
