subject = "اليوم تمديد قانون الطوارىء للسنة السابعة والعشرين"
author = "دافوس"
posted = "2008-05-26"
text = "انا مصرى ما لوش اى لزمة فى نظر الحكومة<br />باشوف الدنيا حواليا والدنيا ماشية ازاى واية اللى بيجرى فى بلدنا<br />شفت لبنان<br />اغتيل الرئيس الحريرى رئيس وزراء لبنان ولم يعلن قانون الطوارىء او الاحكام العرفية<br />وحدثت موجة اغتيالات للشخصيات المهمة والصحفية ولم يعلن قانون الطوارىء<br />قامت حرب بين حزب اللة واسرائيل لمدة شهر والقت الطائرات الاسرائيلة قنابل قدر ما القى على الدول العربية مجتمعة فى جميع حروبها ولم تعلن الطوارىء<br />انسحب وزراء حزب اللة من الحكومة واصبحت حكومة عرجاء ولم يعلن احد قانون الطوارىء<br />ظلت لبنان بدون رئيس بعد لحود واصبح الكرسى خاليا والدولة بدون رئاسة ولم تعلن قوانين الطوارىء<br />وفى مصر<br />منذ ان كان حسنى نائبا واغتيل السادات بجانبة واستخبى تحت الكرسى وهو عندة هيستيريا خوف من الشعب<br />نعم خوف فظيع من الشعب المصرى<br />وربما عداء ايضا<br />27 سنة متصلة حكم طوارىء<br />هل نفسية هذا الرجل سوية<br />ماذا سيكتب التاريخ عن هذا الرئيس الطوارىء<br />سيموت تحت الطوارىء<br />والطوارىء لم تنفع احدا فى المحلة رغم القنابل والرصاص الحى وكان اهل المحلة فلسطنيين والامن من اسرائيل<br />تسلم يا لبنان<br />شعبك صح<br />تعيش جمهورية لبنان"
archived = "2010-03-14"
