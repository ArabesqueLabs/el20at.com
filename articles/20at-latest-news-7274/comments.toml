subject = "سؤال كل سنه"
author = "نيفين نيفى نوفا"
posted = "2007-10-05"
text = "مع ان الواحد بيحاول يجتهد العشره الاواخر كلهم بس انا عن نفسى فيه عاده مش قادره ابطلها مع ان اصحابى نصحونى كتير و هى انى بحب جدا اعرف توقعات كل من اقابله عن ليله القدر و طبعا التوقعات بتختلف<br />مش عارفه ليه بصر انى اعرف الترجيحات بتاعتها مع ان على راى اخويا حتى لو عرفتها و كنت اجتهدت فيها جدا هل ربنا قبل و لا لا<br />و ده صح فعلا بس هى عاده"
