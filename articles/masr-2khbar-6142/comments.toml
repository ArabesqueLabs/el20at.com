subject = "مفيش بابا من غير ماما"
author = "اكتب اسمك هنا"
posted = "2007-06-13"
text = "مرة زمان واحنا صغيرين من حوالي اربعين سنه النصارى طلعوا اشعة ان العذراد مريم بتظهر على كنيسة الزتون بالليل<br />والناس يا عيني كانت تروح من العشاء تفضل واقفه لحد الفجر علشان خاطر تشوف العذراد مريم ومفيش حاجه كانت بتظهر<br />فواحد طلع نكته وقال والناس ان المسيح بتاع النصارى ظهر وقالهم ماما زمانها جايه ها ها ها ها ها ها ها ها ها ها ها ها<br />ـــــــــــــــــــــــــــــ<br />طبعا يا اخونا عندنا نحن المسلمين من اعظم رسل الله وامه الصديقة مريم سيدة نساء العالمين عندنا<br />حاشاهم ان يكون هذا حالهم<br />وما المسيح ابن مريم الا رسول قد خلت من قبله الرسل وامه صديقه كانا يآكلان الطعام<br />عليهم وعلي نبينا الصلاة والسلام"
archived = "2010-03-14"
