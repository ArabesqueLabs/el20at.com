subject = "رضاعة الكبير وبول الرسول واقباط المهجر"
author = "مش ضروري"
posted = "2007-06-09"
text = "اريد ان اسجل هنا بخصوص الفتاوي المسيئة للاسلام من المعلمين الكبار بتوع الاسلام<br />ان هذه الفتاوي اول ما ظهرت ظهرت في مواقع اقباط المهجر من سويسرا وكندا وامريكا وخلافه وهاتك يا ضحك وتريقة على الاسلام والمسلمين<br />الامر الذي يؤكد ضلوع هؤلاء الاقباط في اصدار هذه الفتاوي<br />وياما ناس كبار باعوا اوطانهم مش باعو دينهم"
archived = "2010-03-14"
