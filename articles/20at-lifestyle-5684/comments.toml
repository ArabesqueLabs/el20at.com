[[comments]]
order = 1
subject = "كالعادة ...... يسر والدنيا الجميلة"
author = "محمد السيد"
posted = "2007-05-02"
text = "والله يا يسر مواضيعك ... بتقتح دنيا تانية خالص محدش بيعرف يكتب فيها أساسا وده أجمل حاجة بتعمليها ...<br />المهم بس متتقليش علي الناس اللي هنا وتقدمي حاجات كتير من كده .... مش لازم يعني كل شهرين موضوع ...<br />خااااااااااااااالص تهانينااااااااااااااااااااااااااااااااااا ...<br />وعقبال كل بدلة ياستي<br />بس برضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\"لا..... بس مش بالشكل ده يعني\"<br />تقدروا تتفضلوا هناك دلوقتي<br />www.mesh7askot.blogspot.com<br />mohamedmat@hotmail.com"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120157/http://www.20at.com:80/7ayatna/5684.html"

[[comments]]
