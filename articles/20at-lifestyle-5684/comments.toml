subject = "شكرا على الموضوع"
author = "فاعل مرفوع"
posted = "2007-05-02"
text = "عودة والعود أحمد يا يسر ياريت متحرميش الصحافة المصرية والعربية من كتاباتك والهي ما يقطعلك مواضيع خالص ، بجد يا يسر الموضوع جميل جدا .<br />بس فعلا كنت محتاجة تكلمي عن اختيار الالوان شويه بين القمصان والكرفتات والبدل علشان بيحصل مجازر في المواضيع ديه .<br />شكرا جدا"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120157/http://www.20at.com:80/7ayatna/5684.html"
