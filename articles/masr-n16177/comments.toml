[[comments]]
order = 3
subject = "انا مش بحب عادل امام"
author = "فلاح من مصر"
posted = "2008-06-09"
text = "يا جماعة يموت يعيش كلنا هنموت مش عاوزيين نعمل زي الخبر اللي فات امممممممم واخدين بالكم هو في ناس بعيده عن الموت دا مش موضوعنا اللي عاوز اقوله ان فعلا ناس كتير مش بتحب عادل امام في تمثيله من 50 سنه وهي نفس حركاته اللي مش بتتغير حتيو لو مثل الف شخصيه فين دا من الناس اللي كانت بتمثل بجد (دا من وجهه نظري ) انا شخصينا بحب احمد ذكي جدا ومحمود عبد العزيز وعلي المسرح محمد صبحي مش عيب ان الواحد يقول رايه بصراحه عادل امام نشر افلامه بالتلميحات المثيرة والقبلات الساخنه وربنا يجعله عامر فلااااح من مصر"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144125/http://masr.20at.com:80/newArticle.php?sid=16177"

