[[comments]]
order = 0
subject = "يغور فى ستين داهية"
author = "شرفنطح"
posted = "2008-06-08"
text = "دة مش ممثل - دة مهرج او اراجوز - وبنى ادم من اصل وضيع ابوة عسكرى درك - ولكنة يتشبث بالناس اللى فوق ويهاجم المتدينيين والمسلمين<br />وهو لا يقارن بعبد المنعم مدبولى ولا حتى عبد المنعم ابراهيم<br />هذا شخص وصولى افاق<br />ناسب الطبقة السياسية وهاجم اضرابات الشعب وتمحلس فى السلطة<br />يموت فى ستين داهية"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144125/http://masr.20at.com:80/newArticle.php?sid=16177"

