author = "ااتعلم الادب"
posted = "2009-07-19"
text = "اظن الكام يوم اللى اتحبسهم فى السجن قبل حكم محكمة النقض واللى شافة فيهم هيخلوة يمشى دة اذا قدر يمشى جنب الحيط طول عمرة<br />اظنهم عملوها معاة شامى ووضبوة وطلع مستوى على الاخر واذا عاش لة شهرين يبقى كرم من عند ربنا بعد النفخ اللى شافة"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720134046/http://www.20at.com:80/masr/2khbar/12692-2009-07-19-06-50-41.html"

[[comments]]
order = 4
subject = ""
author = "زغلول المزغلل"
posted = "2009-07-19"
text = "قرات المقال فى موقع العربية وقرات الشعر او الزجل المنحط اللى كاتبة فى العربية ايضا<br />اولا هذا الشخص الذى يظهر فى الصورة صاحب الاسنان المكسرة والتى تظهر انة تزوج بعد ان بلغ من العمر ارزلة كاتب كلام كلة هرتلة وتخلف عقلى ولم يذكر مبارك لا من قريب ولا من بعيد<br />اطلاقا لا يوجد ولا حتى بالاشارة اى ايحاء لمبارك<br />ورايى ان القاضى يطسة عشرين سنة سجن علشان انحطاط الكلام اللى بيسمية زجل ويروح يزغلل هناك فى ابو زعبل<br />وبعدين بسلامة مخ اهلة الوسخ كاتب الزجل فى اوراق نسخها وبيوزعها على العاملين فى الادارة التعليمية واللى بلغ عنة ظابط الامن واتهمة بتوزيع منشورات<br />الموضوع مفيش فية اى اشارة لمبارك اطلاقا<br />وهل يجرؤ<br />هو وامثالة<br />ومن فى طائفتة"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720134046/http://www.20at.com:80/masr/2khbar/12692-2009-07-19-06-50-41.html"

