[[comments]]
order = 2
subject = "نظام الشرطة الفاشل بجدارة وطريقة تحقيقاتة من عصر ا"
author = "مجرب"
posted = "2008-05-27"
text = "حدث هذا واللة العظيم<br />كنت اسير على الطريق ومررت بحادث فظيع سيارة ميكروباص محطمة وامرأة تحمل طفلا مغطى بالدم وتصرخ<br />بدون ادنى تفكير حملتها والمصاب فى سيارة التاكسى وجريت الى اقرب مستشفى - ولكن المستشفى رفضوا استلامة<br />وجريت الى مستشفى اخر ورفض ايضا بحجة عدم وجود دم لنقلة الية وانة اذا احضرت متبرعين بالدم فقد يقبلونة<br />وعندما وصلت الى المستشفى الثالث وبمجرد فحص الطبيب لة مات او اخبرنى انة ميت واستدعى الشرطة<br />واحتجزونى فى الحجز بالقسم لحين قدوم ضابط المباحث فى الصباح للتحقيق معى<br />وعندما اخبرتهم باننى يمكن ان اتى فى الصباح للتحقيق رفضوا واصروا على مبيتى بالحجز لحين حضور ضابط المباحث<br />فى صباح يوم منيل بعد ليلة منيلة حكيت لضابط المباحث ماحدث بالضبط ولكنة لم يصدق ابدا واشر على محضر التحقيق باستمرار احتجازة للتحرى ومعرفة الاسباب<br />وبقيت فى الحجز حتى حضر اهل الطفل واعترفوا ان ولدهم اصيب فى حادث وانة ليست لى علاقة بالموضوع فافرج عنى رئيس المباحث وهو يقرش على اسنانة كيف فلت من التهمة الجاهزة وهى اننى الذى دهستة<br />بعدها لا انقذ انسان ابدا حتى ولو كان ينزف دما"
archived = "2010-03-14"
capture_url = ""

