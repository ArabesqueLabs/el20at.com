subject = "انت مرة مقرفة"
author = "emad hamdy"
posted = "2008-05-26"
text = "ربنا ينتقم منك مرة وسخة فعلا الاسعاف وصل متأخر الناس لاتساعد بعضها ومشاكل كثيرة ذكرتيها ورغم ذلك زعلانة من يفط مكتوب عليا اسماء الله الحسنى عموما كما قالت الاخت السايقة خسارة فيكى ان نقول ربنا يهديكى ولكن نقول ربنا يريحنا من امثالكم"
