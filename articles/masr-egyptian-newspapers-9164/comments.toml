order = 0
subject = "والله العظيم انتي ولية تعبانة"
author = "قرفانة منك"
posted = "2008-05-25"
text = "طبعا مع الاتفاق على ان الناس ناقصة شهامة ومروئة، وإن تعامل الشرطة والإسعاف مع الحالات دي كثيرا ما يكون متخلف.. لكن أنا مش فاهمة يعني انتي ايه اللي فارسك قوي كده من لافتات ذكر الله، يعني هي دي اللي بتؤجج الفتنة ولا هي دي اللي بتخلي الناس تعمل حوادث، ولا انتو ما بتصدقوا تلاقوا اي مناسبة علشان تهاجموا أي شكل للالتزام الديني .. بجد بجد أنا بكره قوي كل الناس اللي من عينتك، ومش قادرة حتى أدعي لك ان ربنا يهديكي"
