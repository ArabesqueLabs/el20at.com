author = "مسلم مثلكم"
posted = "2009-09-30"
text = "في أي حوار متحضر لا يحق لأي إنسان أن ينعت الآخر بألفاظ مثل \"مرة وسخة\" والله يأخي أنت اللي وسخ طالما تخرج هذه الألفاظ لأن \"الاناء ينضح بما فيه\" يارب بس تفهمها. على فكرة أنا لاتربطني أي صلة بكاتبة المقال ولكني أحزن علي المستوي المتدني للنقاش. ماهو لما نرفع شعارات الدين ولا نعمل بها نبقى منافقين ... ونسيئ للدين ... صح ؟ لما واحد زيك يدافع عن الدين بوصفه لسيدة بأنها \"مرة وسخة\" تبقى هي دي أسوأ إساءة للدين ... والأمثلة كثيرة ...<br />حسبي الله ونعم الوكيل."
archived = "2010-03-14"
