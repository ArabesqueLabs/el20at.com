author = "واحد عادى"
posted = "2007-06-21"
text = "أولا انت ما ينفع تكونى من الاردن العتيقة ..... لا و الاسو ا انك من الزرقاء ... مع ان المفروض تكونى من الحمراء او الخضراء ... انتم كدة تحبوا اللى يعريكم و تكرهوا من يستركم ... علشان كدة ربنا غير راضى عنا و هيفضلوا اعداء الله يقتلوا فينا حتى نغير انفسنا و نرجع الية تائبين راغبين فى جنته .... و انتى يا من تتخذين جاد مثلك الاعلى ابحثى فى حياتة ماذا سيقول لربه يوم العرض و ماذا ستقولين انتى و انت تقفين خلف جاد ..... انصروا دينكم ينصركم الله و اعملوا له يوفقكم الله و حافظوا علية يحفظكم الله .... أما انت فلا وفقك الله و لا حفظك و لا نصرك ..."
