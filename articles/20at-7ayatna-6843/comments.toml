text = "لما لا والبلاد في قطيعة مستمرة مع أبعادها التاريخية والجغرافية منذ ما يزيد عن الخمسين سنة. لما لا والسادة الموجهون غارقون في حب الحضارة الغربية. لما لا وشبابنا يموت في في ملح البحر لأبيض المتوسط حبا وعشقا لأوربا.<br />لابد أن نسمي الأشياء بأسمائها وكفانا ازورارا عن واقعنا الغريب المغرب. ليست مجرد مصطلحات أو تقليعات إنها ثقافة لقيطة، وعجز عن البناء السليم، إنه النيه عن الماضي والحاضر وزيف الإبداع. دعونا نتلمس زادنا المعرفي في زمن النقل عن الدول \\\\\\\"المتحضرة\\\\\\\" هل كان إلا تقليدا أعمى!"
