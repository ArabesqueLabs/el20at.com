subject = "المرحوم"
author = "ومات"
posted = "2007-07-05"
text = "ومات الرجل اللى قعد يسب الثورة وعبد الناصر ويتقرب من الحكومة علشان تغدق علية ببعض المناصب<br />والمرحوم كان فى بداية حياتة معدم وبيشتغل عامل فى مصنع نسيج واتعلم مسائى فى المدارس المجانية على كبر وحصل شهادات<br />وبعدين ركب الموجة وقعد يشتم فى العهد البائد لغاية ما قالوا علية مؤرخ<br />مؤرخ لاية معرفش<br />هل شغل منصب سياسى برضة لا<br />يعنى المرحوم كان افاق<br />ومن الوصوليين<br />ومات مات كلنا هنموت وهنلبس القطنة ولا يبقى غير الذكر الطيب"
