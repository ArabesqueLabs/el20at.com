order = 0
subject = "اشار سيادتة - ان الاكاديمية المصرية للحام تعد هى الوحيدة فى منطقة الشرق الاوسط وافريقيا"
author = "بطلوا كذب"
text = "يعنى اية اكاديمية لحام - بتخرج رجل اكاديمى بتاع ابحاث فى اللحام مثلا والا اية بالضبط<br />انا كنت اعمل فى احد دول الخليج وطلبت الشركة منى ان انزل الى القاهرة لاختيار لحامين ضغط عال للعمل فى مد خط<br />انابيب طولة 300 كيلوا متر وكانوا قد عملوا اعلان واختاروا المرشحين للاختبار<br />كان العدد 50 لاختار منهم عشرة<br />وللاسف والامتحان الرئيسى يكون عملى وعلى الطبيعة لم اجد اى واحد منهم يصلح ولا واحد مع انى قبلها ب 10 سنوات اخترت 30 لحاما كفؤا للعمل فى نفس الشركة من المصريين لما كانت لسة عمالها لم يخرجوا معاش مبكر<br />وسافرت الى الهند لنفس الغرض - ما شاء اللة<br />علم وكفاءة<br />عندهم معهد لحام الضغط العالى مدة الدراسة فية 3 سنوات بعد دبلوم الصنايع او الثانوية العامة ثم يدفعونهم الى موانىء صناعة السفن فى بومباى ليمارسوا الخبرة العملية ثم يعطوة شهادة لحام ضغط عال محترف<br />وبعضهم يقوم باللحام تحت الماء<br />واجرة فى الساعة الواحدة بما يعادل 200 جنية<br />انما اكاديمية<br />احنا بنمثل على بعض<br />بنخترع اسامى غليظة اكاديمية<br />اة يا بلد<br />خلاص راحت علينا<br />خلينا فى المعاش المبكر"
archived = "2009-02-14"
capture_url = "https://web.archive.org/web/20090214125611/http://masr.20at.com:80/newArticle.php?sid=19889"
