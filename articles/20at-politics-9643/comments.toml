subject = "مبروك النصر للعرب"
author = "داني"
posted = "2008-07-18"
text = "ارفع أغلى التحيات والتباريك الى جميع العرب وفي مقدمتهم سيد المقاومه سماحة السيد حسن نصر الله أعزه الله ونصره وهزم أعداءه وأبارك للشعب اللبناني الحر بعيد المقاومه بتحرير الأسرى وأقول لهم الف الف مبروك وانشاء الله عقبال مانبارك لكم بأسترجاع مزارع شبعا والله يديم افراحكم ويحمي لبنان ويبعد عنها كل مكروه ."
