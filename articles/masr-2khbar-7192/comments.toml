[[comments]]
order = 0
subject = "بنك يا مفترى"
author = "السيد"
posted = "2007-09-25"
text = "بنك الطعام المصرى وصك الطعام؟<br />يا فرحة ابلة ظاظا<br />هيبيعوة يا ناصح زى بنك القاهرة<br />يبقى ناكل الفقراء احسن<br />ومش عايزين صكوك ولافلسفة ولااقتراحات غبية<br />اللى عندة حاجة للفقير يعطية وخلاص"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "الى الاستاذ اللي فوق السيد"
author = "اكتب اسمك هنا"
posted = "2007-09-25"
text = "يا استاذ سيد دول جماعة مش عارفين يعملوا ايه ولا ايه بنك الطعام صك الطعام المهم اي فكرة تجبلهم فلوس افكار غريبة وحجات ما حدش سمع عنها الا اليومين دول"
archived = "2010-03-14"
