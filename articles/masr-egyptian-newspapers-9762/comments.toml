subject = "الترابي و الحجري"
author = "مسلم متغرب و بيتعجب"
posted = "2008-07-31"
text = "الآنسة/السيدة سحر الجعارة<br />تحية طيبة و تهنئة حارة على المقال العميق. كن التشبيه بالتيواني مضى عليه الزمن لأن تايوان أصبحت من الدول المتقدمة و الصناعة التايوانية يشهد لها بالدقة و يكفي أن شركات عالمية طبعا صناعية و لها أسماء و شهرة عالية بتنتج اليوم في تايوان بالذات الإليكترونيات من الشيب إلى الكمبيوتر مرا بالجوال و صناعات الفضاد كلها مرعرة في تايوان ده بعكس إنحطاط الفتوات التايوانية كما لقبتيها. ما علينا فهمنا المقصود كل واحد همه اليوم مش رضاد ربه بل رضاء بوش و كوندي ماهم دول بقوا الحاكمين بأمر الله و ظله في أرضه أستغفر الله العظيم بس سيادتك نسيتي تبهجي الترابي المصري بذكر مجهوده في مقالك و نرجوا تكملة المقال بفتوات العليم العلامة و البحر الفهامة شيخ الإسلام الأعظم و إمام الأولين و الأخرين فضيلة المفكر الإسلامي الأعظم و إمام العصر و العصور السابقة و اللاحقة جمال البنا شقيق حسن البنا و اللي مش عاجبة ينفلق. و السلام"
archived = "2010-03-14"
