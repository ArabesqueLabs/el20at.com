order = 0
subject = "لية يا مولانا"
author = "ضد الفتوى"
text = "يظهر فية واحد من المشايخ عايز يترقى وبقرع للحكومة وبيطلع فتاوى جاهزة ترضى الحكومة<br />يا مولانا هل هذا الخبز صالح للاستخدام البشرى ام مصنوع من الذرة بتاع الطيور والدواجن مخلوط بقليل من القمح وبعد خروجة من الفرن بساعة زمن بيجلد ويتفتت وما ينفعش للاكل اطلاقا ويعنى الناس مش عارفة مصلحتها فين<br />واذا كان خبز جيد هيرموة لية<br />يا مولانا يا حريص على مصلحة الرعية- اللة يصلح حالك- وحالنا- خللى الحكومة تحسن رغيف الخبز ويخلوة يليق بالبنى ادمين مش رغيف 60% ذرة صفراء و 40% قمح وبعدين تقوللى الطيور والدواجن<br />يا مولانا خليك فى حالك<br />والناس ادرى بشئون دنياهم حسب الحديث الصحيح"
archived = "2007-10-31"
capture_url = "https://web.archive.org/web/20071031232455/http://masr.20at.com:80/newArticle.php?sid=12179"
