author = "ابن سرحان"
posted = "2009-05-26"
text = "اولاً اشد على ايدي الأساتذه الذين تعهدو هذا العمل وائيدهم وكذلك اشكرهم .<br />وأقول لأخواني الشباب مثل مصري يقول ( مين فات قديمه تاه ) والي ماله اول شي اكيد ماله تالي هذا مفهمتوه سوف تعود الحضارة لنا كما بدائة من العصر الإسلامي الأول الى العصور الوسطى وصدر الإسلام وكنا في عهد قريب يذكر الأباء كل غريب عليكم ويجب علينا ان نعيد كل عام هذه المناسبة ونسميها مثلاً يوم الاباء او الأجداد واترك التسميه لكم ايها الشباب الواعد لنصرة الدين وعز القبيلة مع العلم كل قبائل الجزيرة تنتمي إلى فرعان اساسيان هم عدنان وقحطان وجاء الإسلام ووحد المسلمين تحت كلمة لافرق بين عربي ولا عجمي الابالتقوى وجائت العولمة ويجب ان توحدنا على القيم العربية الأصيلة لكي نقوى كمسلمون كما كانو السلف الصالح دمجو القيم مع الدين او العكس هو الصحيح واسف لو اخفقة...............<br />ابن سرحان الهاشمي الشريف"
archived = "2010-03-14"
