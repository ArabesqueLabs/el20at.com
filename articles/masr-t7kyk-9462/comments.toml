order = 0
subject = "واعدوا لهم ما استطعتم من قوة ومن رباط الخيل"
author = "عبد الجبار"
posted = "2008-06-28"
text = "لا - تفكير بعيد خالص يا استاذ هوارى<br />العدد الكبير دة واللى كاميرة التلفزيون كل شوية تجيبة امام المشاهدين لارهاب الشعب وترويعة وتخويفة فى البيوت والمقاهى اذا فكر يعمل مظاهرة او شغب<br />القوة جاهزة ليس لاعداء اللة ولكن لقهر الشعب وتكميمة ومنع حرية التظاهر والتعبير السلمى<br />انت ناسى ان المحلة حوصرت وانضربت بمائة الف جندى عسكرى امن مركزى واستخدم الرصاص الحى وقنابل الدخان والمدرعات تماما زى ما عمل الاحتلال الامريكى فى مدينة الفلوجة<br />العدد الكبير دة اللى قارب المليون عسكرى هو اللى بياكل ميزانية وخزينة الدولة وياكلوا وينعروا زى البهايم<br />لا يا استاذ هوارى - الموضوع غير كدة خالص<br />كرة اية<br />مال البصمجية ومال الكرة<br />دة حتى الجمهور العادى اللى عايز يروح المباريات دى بيشوف الاشكال الغلط دى بيرجع تانى"
archived = "2010-03-14"
