order = 1
subject = "ترفيه ايه بس   بلا ارف"
author = "للاسف مصري"
posted = "2008-06-29"
text = "الباهوات اللي بيقولو انه واجب قومي يجو يشوفو الاسلوب الحضاري اللي بيتنقل بيه الجنود من الوحدات للاستاد وطبعا ده اسلوب يناسب ان من الجنود دول ناس جامعين اهلهم صرفو عليهم لحد ما بقو مهندسين ومحاسبين و غيره ولا التنظيم اللي حصل عان يعدو بشكل يناسب ادميت الناس دي وطبعا ده كله عشان خاطر مصر وطبعا ده كله ترفيه يا بيه ياللي بتتكلم عن الترفيه كان المفروض تيجي تشوف الفرحه والشموخ اللي كان فيها الجنود دول وهما بيشجعو مصر سيبك من جنود الامن المركزي االي هما اصلا مش فاهمين اي حاجه غير انهم يمشو زي ال تييييييييييييت عشان كده مكانهم كان ورا المرمى في اقرب مكان للحضري عشان عارفين انهم زي احمد سبع الليل حاول تسال اي جندي في الجيش راح هناك وهو هايقولك على الفرحه اللي مكنتش سايعاه وهو بيشجع مصر وساعتها هاتقول هاتعرف انك اكيد اكيد في مصر جتكو الارف مليتو البلد مش ليك يا هواري ده للبهوات الي بيتكلمو عن الترفيه القومي<br />بالمناسبه يا هواري انت دخلت الجيش ياريت بس تجاوب عشان هايفرق معايا جدا اني اعرف ؟"
archived = "2010-03-14"
capture_url = ""
