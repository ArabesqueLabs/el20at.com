[[comments]]
order = 0
subject = "من الذى سرب الامتحان وهو فى حراسة الامن والشرطة"
author = "مين هناك"
posted = "2008-06-15"
text = "انا اظن ان الشيخ المستكاوى قد سخر الجن عفركوش ابن برطكوش الخبير فى امور التجسس واللطش وعمل الاسكانر لورقة الامتحان للقيام بتلك المهمة<br />وحيث ان الجن عفركوش لة ولد فى الثانوية وبيعيد فيها اربعة مرات فقد بذل جهدا جبار فى الحصول على الامتحان<br />وبما انة جن طيب وفاعل خير فقد عمل على نشر الخير بين الطلاب وتوزيع الامتحان من المكتبات<br />وعلية من يقبض على عفركوش لة مكافأة كبيرة جدا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "جزا العفريت عفركوش خيرا"
author = "اسلام عبده"
posted = "2008-06-21"
text = "والله اللي عمله العفريت ده احسن خير اصل العيال ماكنوش بيذكروا خالص وكانوا دايما في النت كافيه<br />انا لو اطول العفريت ده حاديله مكافأه<br />والود ودي اعمله فيزه مزوره واهربه بره مصر لما الاوضاع تهدي وبعدين يرجع بعد خمس سنين لما اخويا التاني يخش الثانويه"
archived = "2010-03-14"
capture_url = ""

