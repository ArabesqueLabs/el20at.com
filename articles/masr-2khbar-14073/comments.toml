text = "هى مباراة والا معركة حربية<br />دى ناقص يطلع اركان حرب الجيش ويعلن الحرب على الجزائر<br />الخبل بتاعكم والجهل جعل وزير العمل الجزائرى امس يلغى 20 الف تصريح عمل للمصريين فى الجزائر وهيرجعوا صايعيين فى الشوارع<br />لية التعصب المقيت دة<br />فيها اية لو كان الرئيس مبارك زار بعثة منتخب الجزائر قبل المباراة فى القاهرة زى ما زار المنتخب المصرى<br />لية ما نلطفش الموضوع ودى حتة مباراة لهتودى ولا هتجيب"
