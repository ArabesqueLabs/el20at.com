text = "من الواضح يا شباب انكم مش متابعين الوضع كويس<br />زي ما وزير العمل الجزائري لغي تصاريح عمل تعسفيا تم اتنهاك حرمة مصريين مقيمين بالجزائر وتدمير ممتلكاتهم واتهجمو على مقار شركات يعني هما اللي عاملوها معركة ومستمرين فيها واحنا كمصريين بنحتفل بطريقتنا وكمان بنشجع بطريقتنا وهي الفرحة ما فيش مصري عمل زي الجزائريين ما عملوا من هجوم على السفارة الجزئرية مثلا .<br />عموما ربنا يستر بكرة على المصريين المقيمين في الجزائر لو مصر صعدت لكاس العالم انشاء الله"
