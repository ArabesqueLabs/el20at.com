text = "فعلا كانها حرب مش كورة الناس بتلون العربيات وشادية شغاله 24 ساعة فى المترو<br />طيب هما متخلفين وولعو فى العلم ليه نبقى متخلفين زييهم ممكن نكسبهم وبكده نسبتلهم اننا الافضل بدون اى تعصب ولا كلام كلنا عرب واللذى منه ده شغل مسئولين وبرامج<br />والمصريين اتضربو فى الجزائر واللى شغلين هناك رجعو واوراسكوم و المقاولون اتضربو<br />مفيش اى تفكير"
