posted = "2009-11-17"
text = "بكرة بعد هزيمة الجزائر ستفيض الانهار عسلا ولبنا<br />بكرة بعد النصر العوانس هيتجوزوا والعاطلين هيلاقوا شغل<br />بكرة بعد النصر الاسعار هترخص والشقق هتبقى على قفا من يشيل<br />بكرة بعد النصر هتختفى انفلونزا الخنازير والطيور وفيروس الكبد سى<br />بكرة<br />بكرة كل المعجزات هتتحقق<br />بس نكسب بكرة<br />بعد بكرة مفيش حوادث قطارات ولا عبارات<br />ولا هنشرب من المجارى<br />اطلعوا بكرة بالاعلام والرايات فى الشوارع وافرحوا وهيصوا"
