text = "أنا أرى قمة الحكمة أن تتنازل مصر عن هذه المبارة بالأنسحاب ــ وهذه أكبر أهانة وعار على منتخب الجزائر وشموخ وعزة لمصر حيث أن هذه الصغائر لاتعنيها فليس لمبارة قدم تحدث كل هذه الغوغاء ــ وهل لو فازت مصر أو الجزائر غدا ماذا سيفعلون بالمونديال سيرجع كل منهم بخفى حنين فالأكرام والأفضل الخروج من الأن بكل كرامة وبدل ماننفضح على مستوى العالم ."
