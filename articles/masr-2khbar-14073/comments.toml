text = "بجد شئ يحزن اللى بنسمعه عن المصريين فى الجزائرواللى بتعمله فى المصريين هناك<br />مفروض الرئيس يتدخل الموضوع بقى اكبر من الكوره والتشجيع الجزائرين محاصرين المصريين فى بيوتهم ولومصر كسبت ان شاءالله بكره الله اعلم هيجرى ايه للناس دى<br />ياريت ياجماعه نناشد حكومتنا تتدخل عشان تحمى الناس اللى هناك ولا احنا ارواحنا بلاش :sad:<br />والجزائريم اللى فاكرين ان التعصب شطاره بالعكس دول كل مدى بيسيئوا لواحهة بلادهم<br />بجد ربنا يكون فى عون الجاليات المصريه بالجزائر"
