author = "ابومحسن غربة 28 سنه"
posted = "2009-11-17"
text = "انا كراجل غريب عشت اكثر من نصف عمري في الغربة زعلان جدا جدا على اللي حصل للجالية المصرية في الجزائر<br />ربنا سبحانه وتعالى يعلم المصري الغريب دا عايش ازاي ومستحمل ازاي ذل الغربة علشان خاطر يوفر لاسرته الحياه الكريمة<br />انا زعلان من الحكومة المصرية انها لم تراعي ظرزف الجالية المصرية في الجزائر<br />الناس اللي سافروا ومش عارفين يرجعوا<br />او بمعنى اخر كل ما يرجعوا يلاقوا الاسعار ارتفعت<br />انا ادعو الحكومة المصرية للانسحاب من هذه المباراه من اجل الجالية المصرية في الجزائر"
archived = "2010-03-14"
capture_url = ""

