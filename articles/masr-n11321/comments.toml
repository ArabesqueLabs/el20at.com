[[comments]]
order = 4
subject = "مش وحش"
author = "واحد من الناس"
text = "انا الصراحة رغم اني لسة صغير ع الحاجات دي كما يعتقد معظم الاباء ف الوطن العربي فانا اعتتقد اصلا ان فكرة الحاج متوللي جاءت لتقضي على ظاهرة تعدد الازواج لان الراجل ده كان بيتجوز لمجرد الشهوة او السلطة او المال لان اي رجل ف العالم مادام وجد الحب الحقيقي واحس بالامان فيه فانه لم ولن يدخل نفسه ف ورطات ورغم شخصية الحاج متوللي التي اظهرها المسلسل الا انه ليس الا شارلوك هولمز او هاي بوتر الذي لم يتخطى الابداع الفني والكومدي والاكشن ايضا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
