subject = "ياكايدهم ... يا أبو العلا"
author = "خضري"
text = "بصراحة ينصر دينك يا أستاذ ياسر .. ردك كفاية .. وأظن والله اعلم إن الزبون اياه دمه تحرق بما فيه الكفاية .. ده لو كان عنده دم ...<br />أما الموضوع فانا عندي اقتراح تاني ... كل واحد من الإخوان يفكر يجوز تاني .. يوفر فلوسه ويديها لشاب أعزب غيره وكده برضه حنحل مشكلة العنوسة .. أما لو حاسس ان عنده رغبة في الزواج لإشباع رغباته وهو حق مشروع فيجب أن يمهد لذلك .. واعتقد ان الجماعة محتاجة تشرح فقه الزواج لأفرادها من الرجال والسيدات"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 19
subject = "ذق انك انت ياسر أبو العلا"
author = "الطحاوي"
text = "طبعا انا فرحان فيك شوية من عمايلك هو انت عتقت حد وانت وهاني الوحد فرحان جدا بس عموما احييك على الفكرة وعلى الاسلوب وعلى الجرأة التي اتمنى ان تستمر مش نزوة قلم او طيش موس عابر ..حلوة المغامرة في الجديد .. تحية لك ولكل زملائي في افاق الذين يضربون في ارض الصحافة ولهم في كل فن سهم ومهما اختفنا حول الاداء تبقى الذكرة .. والذكرى دواء للعليل ..تحية ليك ولكل زميل"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 20
subject = "الى محمد (وانكحوا ما طاب لكم من النساء)"
text = "يا اخ محمد الاية اللي فوق دي وانكحوا ما طاب لكم من النساء نزلت في ناس ما كانوش لاقيين ياكلوا اصلا<br />فالصحابة كانوا فقراء لا يملكون شيئا ومع ذلك قال لهم ربهم وانكحوا ما طاب لكم من النساء مثنى وثلاث ورباع<br />وشوف سيدك النبي قال ايه على موضوع الاكل<br />5255- طعام الاثنين كافي الثلاثة، وطعام الثلاثة كافي الأربعة<br />- مالك ‏(‏ق ت‏)‏ عن أبي هريرة<br />- ‏(‏صح‏)‏<br />5256- طعام الواحد يكفي الاثنين، وطعام الاثنين يكفي الأربعة، وطعام الأربعة يكفي الثمانية<br />- ‏(‏حم م ت ن‏)‏ عن جابر<br />- ‏(‏صح‏)‏<br />5257- طعام الاثنين يكفي الأربعة، وطعام الأربعة يكفي الثمانية، فاجتمعوا عليه ولا تفرقوا<br />- ‏(‏طب‏)‏ عن ابن عمر<br />- ‏(‏صح‏)‏<br />وبعدين انت مع الاخوان ولا ضد الاخوان<br />وبعدين انت بتقول ان فرعون كان راجل محترم امال ربنا اغرقه في البحر ليه طالما هو راجل محترم<br />فرعون قال ما علمت لكم من اله غيري<br />حسني مبارك ما قالش كده والعياذ بالله<br />حسني مبارك بيدافع عن المادة التانية من الدستور التي تنص على ان الدين الرسمي للبلاد هو الاسلام والشريعة الاسلامية هي مصدر التشريع ضد اقباط المهجر اللي في امريكا اللي بيحرضوا امريكا علشان خاطر تخير حسني مبارك اما ان يلغي المادة دي من الدستور او امريكا تقطع المعونة عن مصر<br />فلو سمحت ما تقلش ان فرعون كان راجل محترم وما تعييبش على الناس وانت كلامك كله جهل"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 21
subject = "طالما الكلام عن افاق عربية يبقى لازم نذكر الاستاذ عادل الانصاري"
text = "تحية للصحفي الكبير المجاهد عادل الانصاري مدير تحرير افاق عربية<br />وهو كان عامل شركة اسمها شروق برس وجاءتلنا اخبار سيئه ان امن الدولة اغلقها<br />والنبي يا استاذ يا سر الصحاوي تبلغه سلامنا<br />هو كان زميلنا هنا في دبي في مجلة الاصلاح<br />بلغه السلام وقوله مجلة الاصلاح كلها بتسلم عليك"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 22
subject = "ضع عنوان التعليق"
author = "واحد بيحب افاق"
text = "وطالما ذكرت الاستاذ عادل الانصاري أذكركم بالاستاذ بدر محمد بدر مدير التحرير وصاحب النقلة في التوزيع والمهنية الطيب والكريم صاحب الايادي على كل الصحفيين تحية له ونحن نعرف كم الظلم الذي تعرض له ليس فقط بل كل الصحفيين الذين كيلت لهم التهم حتى من اقرب الناس لهم حيث راهن عليهم الجميع انهم فشله ولكنهم نؤكد ان من هؤلاء المفكر والمبدع والمهني والاديب ولا علة بقلة منحرفة تتحين الفرص والوسائل القذرة فالقران كل ان البقاء للنافع فقط"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

