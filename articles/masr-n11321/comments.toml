[[comments]]
order = 0
subject = "لو حد قاللك كده تانى .. قوللة عقبال بوك لما يتجوز على امك"
author = "هريدى نفادى مجلع عتريس الدندراوى الجهينى"
text = "زى بالظبط ما لو حد شاف عيل صايع فى الشارع بيعاكس واحدة فتقوله ترضاها لاختك .. بالظبط بقول لاى واحد حيضرب شقلبظت ويبرر الدناوه اللى اسمها الزوجة التانية واقوله ترضاها لاختك .. ده على اساس انك مستحيل ترضاها لامك ولو كانت حصلت فاكيد مرتبطة فى ذهنك بذكريات طفولة حزينة جدا .. انا هنا بخاطب بنى جنسى الرجال .. اما الستات اللى من النادر النادر النادر انك تلاقى حد مكن يوافق على الفكرة الشاذة دى ... فللى يوافقك عليها منهن نفسى فعلا اتعرف عليهم لانه فعلا يبقى شيئ جدير بدراسة النفوس البشرية دى"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

