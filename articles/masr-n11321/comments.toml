[[comments]]
order = 13
subject = "مصر"
author = "بنت القرية"
text = "rدخلت عش الدبابير يا أستاذ ياسر ، ولن يصدقك أحد أنك تحب زوجتك ،لأن تلك اللغة مفقودة فى عموم العلاقات الزوجية لدينا ، وعندما يقبل أحد على الزواج الثانى فآخر شىء يفكر فيه هو إحساس وعاطفة الزوجة الأولى ، وكذلك عندما يتقدم لعروسه الجديدة فإنه إخر شىء يتحدث عنه هو حرصه على تطبيق شرع الله ، وإنما الغالب هو أنه يذكر عيوب الأولى مؤكدا انه يهرب من تلك العيوب ، وغالب هؤلاء ليسوا رهبان الشرع والشريعة ، وإنما هم متباكون على شباب ولى لايريدون أن يعترفوا برحيله ، غير محاولين عيش مسئوليات المرحلة الجديدة ،، ليس هذا فحسب ، وإنما أجدنى وأنا مهتمة بدراسة وتحليل تلك الظاهرة أن معظم هؤلاء يتمردون على شكل الزوجة \" الأخت \" ويريدون حاجة فريش ، ذات حجاب يمثل واجهة إجتماعية شيك ، مش خيمة متنقلة بجواره \" أقصد الخمار \" ، والاختيار على هذا الشكل يفتن الزوجة فى دينها ، ولدى نماذج كثيرة أحدث فيها الزواج الثانى نوعا من الردة الدعوية لدي الزوجة الأولى ، نتيجة إختياره لزوجته الثانية على أسس غير دعوية أو دينية ، وكله أيضا تحت زعم الحق الشرعى ، ولعلنا نتناسى عند الحديث عن الحق الشرعى للرجل أن الرسول لم يتزوج على خديجة ، لن أقول لشدة إحترامه لها فقط ، ولكن مسئولية تربية الأبناء كانت هاجسا فى هذا الموقف ، وكان ذلك فى مجتمع الكل يساعد الأبوين فى التربية، فالأب يربى والجد يربى والعم يربى والخال يربى والجار يربى والصديق يربى ، لكن الآن يترك الحمل كله للمراة ولاأحد يساعدها فى تلك التربية ، ويقف دور ديك البرابر فى تقسيم الليالى على زوجاته ، وتقسيم المصروف ، ولاعزاء للأبناء .<br />وفيما يخص معايير إختيار الثانية فلايجوز أن تكون فتنة دينية للمراو وهنا يحضرنى قياسا موقف رسول الله صلى الله عليه وسلم حين صعد المنبر معلقا على محاولة سيدنا على الزواج من ابنة أبى جهل حيث قال صلى الله عليه وسلم : لايرضى الله بأن تكون ابنة عدو الله فوق ابنة رسول الله \" وأعوذ بالله أن يكون فى ذلك تمييزا لابنة رسول الله على سائر المؤمنات ، وإنما هى معايير العداله ، وهى أن يكون الدين هو الأعلى ليس فوقه من هو دونه ، ومن ثم فانه لايجوز أن تكون غير المتدينة فوة المتدينة لأن فى ذلك تقليل للدين ، ومن هنا تكون الفتنة \" إلا تفعلوا تكن فتنة فى الأرض وفساد كبير \""
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 14
subject = "ياس أبو العلا..رجب الباسل..هاني صلاح"
author = "محمد"
text = "مشكلة التلاته إنهم اخوان او على الأقل كانو إخوان في فترة طويلة من حياتهم..وبالتالي مشاكلهم لسة في إطار محدد من التوافه والسفاسف...عالم لا اشتغلت ولا تعبت في حياتها والإخوان وفروا ليهم كل حاجة.. على ضعف إمكاناتهم وقلة مهارتهم..لحسابات شخصية جوه الاخوان وبس..فمشاكلهم على قدر عقولهم...وده حاجة خطيرة بيعاني منها الإخوان ...في قطاعات منهم المفروض إن الاخوان يقدموهم على انهم عالم بتوع فكر وكتابة.. وفي الآخر خالص نلاقي دماغ فاضية ..وجو مشحون بالدسائس والمؤمرات ..زي إلي الجو إلي في آفاق عربية وإخوان أون لاين"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 15
subject = "تأييد لكلام المعلق السابق محمد"
author = "مش كده"
text = "صح يا اخ محمد<br />عقولهم فاضيه<br />لان المرشد بتاعهم مخه فاضي<br />تصور يا اخ محمد علشان خاطر الاخوان يرشحوا عشرين واحد في مجلس الشورى وولا واحد فيهم كسب قصاد دول 500 معتقل يا اخ محمد لا العشرين كسبوا ولا الخمسماية حيخرجوا<br />بذمة ابوك دا كلام<br />وبعدين عندهم 88 عضو في مجلس الشعب<br />قصادهم 5000 معتقل يا اخ محمد خمسة الاف معتقل بخمسة الاف اسره من غير عائل<br />يبقى دا اسمه كلام<br />وهو 88 واحد عملوا ايه يعني انت عارف ان المجلس كله ما يساويش جذمه عند حسني مبارك<br />وادي الشرطة ضربت نايب وراحوا استدعو حبيب العدلي في البرلمان ما عبرهمش بالجذمه<br />يبقى لزمته ايه الترشيخ في مجلس الشعب ودخونل الالاف الى المعتقلات<br />دا عقل دا بيفكر<br />انا عايز اعرف يعني ايه مرشد كلمة مرشد دي يعني ايه<br />يعني مثلا زي الربان بتاع المركب اللي بيوصل المركب الى بر الامان<br />طيب الاخ المرشد العام المفروض يقود مركب الاخوان المسلمين الى بر الامان<br />مش الى السجون والمعتقلات والمفروض ما يعاديش حد<br />المفروض الانسان المسلم ما يعاديش حد<br />دول عمالين يقولوا ان الحاكم فرعون والجيش جيش فرعون وكلام فارغ في فارغ قاد البلاد الى قعر الهاوية<br />المفروض هما يدعو الى الالتزام بالاسلام وبس ما يقولوش فرعون ومش فرعون علشان خاطر دعايا انتخابية"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 16
subject = "إعتذار"
author = "محمد"
text = "بالنسبة لتعقيب الاستاذ \"مش كده\"...<br />هو أنا مكنتش أقصد أي حاجة من إلي إنت قلتها بالمرة...تعليقي كان على نقطة محددة وهي إن أغلبية القضايا والإشكاليات إلي بيثرها كتير من شباب جماعة الاخوان كلها مشاكل جدلية ومحصورة في إطار معين من القضايا إلي خارج إهتمامات الناس ...يعني مثلاً قضية زي تعدد الزوجات والي بيقول رجب الباسل وهاني صلاح إنهم المقصودين في الموضوع إلي كاتبه ياسر أبو العلا ...أساساً الثلاثة مش لاقين ياكلو ولا يأكلو عيالهم وبيوتهم ...\"زي أغلبية المصريين\"..ولولا التسهيلات الإخوانية سواء في إجاد فرص عمل إضافي.. أو تسهيل لسفر للخارج ...كان العالم دي عاشت مأساة حقيقية في دنيا أكل العيش...على الرغم من ضعف المهارات الفردية والمهنية للسواد الاعظم منهم..ولولاش العاطفة إلي بتجمع الاخوان وانهم في ظهر بعض ...ودي حاجة تتحسب ليهم من وجهة نظر تانية...كان أغلبية الشباب دول في الباي باي...<br />وقضايا كتير على نفس المنوال...<br />بالنسبة لكلامك أنا مختلف معاك فيه بالمرة...لإن بالرغم من إلي أنا قلته في تعليقي الأولاني وتعليقي ده...إلا إني مقدرش أنكر جهود الاخوان إلي بيقدموها للمصريين في مجالات الصحة والتعليم والرعاية الاجتماعية...وبالنسبة لموضوع الاعتقالات والكلام ده ..فأعتقد إن الامر ده شئ طبيعي في ظل جو الاستبداد والفساد إلي في مصر...ده مش ذنب الاخوان...وأعتقد إن الاعتقالات دي بالنسبة لأي حد في أي حته في الدنيل بالرغم من آلامها إلا إنها شرفية ووسام لأي حد مهما كان فكره أو توجهه إتعرض ليها ...مادام لم يخرج عن القانون ولم يلجأ للعنف وفي الاطار الدستوري...<br />وبالنسبة للحاكم والكلام الفارغ إلي إنت قلته ...وجهة نظري إن حسني مبارك والمحيطين بيه تجاوزوا ما بعد \"الفرعونية\" بمحطتين...يعني زمانهم وصلوا المنيب ولا يمكن على مدخل الحوامدية دلوقت !!!<br />يا راجل ...ده فرعون كان راجل محترم !!!!!"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 17
subject = "مع اعتذارى للقراء الأعزاء"
author = "ياسرأبو العلا"
text = "كنت في البداية غير راغب في التعليق على الموضوع لأني الذي كتبته ، وأعتقد أنى قلت رأيي في المقال ، ولكن ... مضطر أن أرد الآن بعد أن بلغ الكذب والافترا ء مبلغه ، من جانب أحد المعلقين والذي \" جبن \" عن أن يذكر اسمه الحقيقي ، وهذه أولى العثرات - الكثيرة - في كلام هذا المعلق الذي لا يعرفه أحد ، ولكن نتغاضى عن هذه النقطة لندخل في الجد .<br />* يا سيدي أحب أعرفك بس معلومة صغيرة في أبجديات التعليق على الموضوعات - في أي مكان – وهى إن التعليق بيكون على الكلام المنشور ورأيك فيه ، إنما الخوض في المسائل الشخصية فالمكانين اللي يمكن الحديث فيهما عن تلك الأمور هما على المصاطب أو أثناء نفث دخان الشيشة على أحد مقاهي شارع فيصل ، ورغم أنى لا أجلس على المصاطب أو على مقاهي فيصل فسأرد عليك ، راجيًا أن تتعلم الدرس .<br />*أولا يا سيدي أنا متأكد إنك كنت شغال معانا في أفاق وحد مشاك علشان شغلك أي كلام مثلا ، أو كان نفسك تشتغل ، أو انك فعلا كنت شغال معانا بس ربنا كرمنا وانت اتكلت على الله.<br />المهم عندى كام نقطة هارد عليهم باختصار :<br />* مين قالك يا سيدى إنى أنا ورجب وهاني مش لاقيين ناكل ؟ إلا لو كنت شغال فى مكان بيعرف حاجات كتيرة عن الناس ومش بعيد بصراحة انك تكون شغال معاهم - واحب يا سيدي أطمن سيادتك إننا لاقيين ناكل كويس قوى ، وكمان بنروح نصيف ، وناويين نشترى عربيات كمان ، إيه رأيك بقى ؟؟<br />* أظن الحمد لله أنا مش فى حاجة للحديث حول مسألة الكفاءة المهنية لأننا - بفضل الله - معترف لنا بتلك الكفاءة التي تفتقدها سعادتك ، وإحنا مش في انتظار تقييمك لأنك أصلا خفت تقول اسمك .<br />* أما مسألة إن الناس بتوع افاق كانوا بيشتغلوا فى الجريدة جدعنة يعنى من الإخوان ، فأظن إن ده كلام - لا مؤاخذة فارغ - لأننا - والحمد لله - منذ أن كنا فى أفاق - وبعد إغلاقها - نعمل فى أماكن كثيرة جدا غير آفاق وأنا مش مضطر أعطل نفسى وأقعد أرصلك الأماكن دى ، ويكفى إن عدد كبير من صحفيي آفاق مسئولين عن مواقع إنترنت وصحف ومجلات ، سواء فى مصر أو خارجها ، وهى وسائل ناجحة بفضل الله ثم جهود وكفاءة هؤلاء الزملاء.، ويجب أن تعلم أن عملنا في آفاق ضيع علينا - عكس ما تقول - فرصًا كثيرة في العمل ، فقط لأننا من صحفيي آفاق عربية .<br />فالمسألة مش كانت وسية - سعادتك - بالعكس كان عملنا في آفاق مضيعًا لفرص كثيرة سواء فى التليفزيون المصري أو القنوت الفضائية أو الصحف والمجلات وغيرها ، وهذا لا يقلل بالطبع من حبنا واعتزازنا بجريدتنا الحبيبة .<br />*أما إذا كنت تقصدنا نحن الثلاثة بالتحديد بقولك \"على الرغم من ضعف المهارات الفردية والمهنية للسواد الأعظم منهم..ولولاش العاطفة إلي بتجمع الإخوان وإنهم في ظهر بعض ...ودي حاجة تتحسب ليهم من وجهة نظر تانية...كان أغلبية الشباب دول في الباي باي...\" فأعتقد إنك جافيت الحقيقة وبعدت عنها كثيرا .. فنحن الثلاثة بالتحديد كل منا يعمل فى مكان لا يستطيع مثلك - والله أعلم - أن يعمل فيه ، لأنه يحتاج كفاءة وتميزًا ، وتقدر تسأل براحتك .<br />*أما مسألة إن الموضوع تعبير عن العقول الفاضية والكلمتين الفارغين دول، فأعتقد إنه من القصور إن واحد يتكلم بالطريقة دي عن قضية اجتماعية مهمة وبتأرق ناس كتير .<br />وبعدين إحنا يا سيدي - والحمد لله - بنتكلم في قضايا كتير ، تمثل مصلحة الأمة وكيفية خروجنا من المأزق الحضاري اللي عايشاه أمتنا ، وكل القضايا التي تهم العرب والمسلمين والمصريين ، ونعتقد - يا سيدي - إن أي أمر مفيد للناس من أولويات شغلنا - كصحفيين تناوله ، سواء على المستوى السياسي أو الدعوى أو الاجتماعي أو الثقافي أو الرياضي حتى . ومش ذنبنا إنك مش فاهم القصة دي .<br />*عموما أنا حاولت أكون هادى فى الرد بس كان نفسي تفهم المكتوب وتقول رأيك فيه أحسن من الخوض فى أمور بعيدة تماما عن الموقع والمقال والقراء ."
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
