subject = "التعدد والجواز من الاصل"
author = "بنى آدم"
text = "التعدد حلال طبعا مفيش حد يقدر يقول فيه حاجة ولكن أدعو كل من يريد أن يعدد أن ينظر حوله ليرى كم شابا يريد الزواج ولا يستطيع بسبب الأعباء المادية الرهيبة ، ممكن أطلب من كل من يريد التعدد إنه يجوز أو يساهم فى اتمام جواز واحد من الشباب دول ، إيه رأيكم مش أفيد بكتير ؟؟؟"
