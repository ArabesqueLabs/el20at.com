[[comments]]
order = 26
subject = "الفشل"
author = "علي الجعدي"
text = "الراجل اللي عايز يجوز الثانية هو في الأصل فاشل لأنه لو كان ناجح في حياته مع زوجته الاول مش حيحتاج للزوجة الثانية بس هي المسئلة فلوس زايدة وعين فارغة إذا كان عايز شكل ثاني يقدر يخلي زوجته تغير شكلها كل شهر مرة تصبغ شغرها أصفر ومرة أحمر وكدة ومرة تلبس قصير ومرة طويل ومرة تخفف وزنها ومرة تدخن مرة تقص شعرها ومرة تتطولة مادام عنده فلوس اللي تخليه يتجوز مرة ثانية يقدر يصرف الفلوس دي في تشكيل زوجته مادام شكلها مش عاجبه وبتكون زوجته هي المستفيدة , ويقدر كمان يعلمها الفرنساوي عشان ترطن فرنساوي إذاكان عاجبه الفرنساويات. المراءة ممكن تضحي علشان إرضاء زوجها بس للاسف أغلب الأزواج لا ينظرون إلى إستعداد المراءة لأي شيئ ."
archived = "2007-12-16"
capture_url = "https://web.archive.org/web/20071216021432/http://masr.20at.com:80/newArticle.php?sid=11321"
