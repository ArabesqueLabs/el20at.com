subject = "ياسر ابو العلا الغير مزيف"
author = "ياسر ابو العلا الحقيقي"
text = "اولا احب ان اوضح انى لست بالتفاهه التى بها ارد على تعليقات احد ولا يهمنى رأى احد في لانها غيرة مهنيه ليس اكثر فقط احب ان اوضح ان التعليق الذي نزل باسمي ليس تعليقي بل ان هناك خص نتحل اسمي لا اعرف لماذا لكنها عقدة نقص تراوض الكثيرين وانا ياسر ابو العلا عايزين امارة؟"
