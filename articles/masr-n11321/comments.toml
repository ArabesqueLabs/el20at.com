subject = "ضع عنوان التعليق"
text = "على فكرة يا استاذ ياسر دي فيه ترقية في البيت دي يعني سمية وعمار هيفرحوا أو ي أوي بأبوهم الموحد ...... شيء طبيعي جدا الأولاد خايفين على وبيحبوها فلازم يفرحوا لرأيك ........ بس خليك على كدة علاطول أحسن تلاقي عمار كالأسد وسمية كالوحش وهيفضلوا معاك لما ترجع لرأيك القديم"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 6
subject = "أنا المقصود اعلاه"
author = "رجب الباسل"
text = "شكرا يا عم ياسر على تشبيهك لى الجميل \"النموذج الثاني\"ودي اكيد رد على اللى كتبته لك على مدونتك \"ورقة وقلم \" انتقد فيها مقولتك \"اعشق زوجتى\" انت تعرف موقفى وموقف هاني صلاح \"النموذج الثالث\"من تعدد الزوجات وان اختلفت تبريرات كل منا .<br />موقفى الذى لن يتغير يا عمنا ان التعدد حق اصيل للرجل منحه الله اياه له الحق ان يستعمله او يدعه وفق ضوابط بعينها يضعها هو هلى نفسه وليس احد اخر ويكفى انى املك الشجاعة ان اقول هذا الكلام بدل من اغطى على خوفى واتستر على قناعاتى بمقولة \"اعشق زوجتى \" (طيب ما الناس كلها بتحب زوجاتها وبرضه ممكن تتزوج عليها مالها دى ومال الحب ..ارحمونا ..)<br />على الفتاة ان تقبل ان تكون زوجة ثانية خير لها من ان تكون عانسا وعلى الزوجة الاولى ان تتقبل ان يتزوج عليها زوجها -ان لم يكن من قبيل العين الفارغة -طالما رات انه يسنحق ان يتزوج فهذا افضل لها قبل ان يكون افضل له من ان يقيم علاقات خارج نطاق الاسرة وهذا ما تشجعه الامم المتحدة وغيرها الان ."
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 7
subject = "بين هذا وذاك"
author = "صلاح جلال"
text = "السلام عليكم يا حاج ياسر<br />في الحقيقة أنا أعلم تماماً أنك شخصياً صادق فيما قلت يعني انت بجد حاسس بالسعادة والاستقرار في بيتك ، علماً بأن هذا لا يعني انك تعيش في جنة رضوات ، فلا بأس بملح الحياة الزوجية ، يعني شوية شد وجذب وخناقة صغنطوطة واختلاف في وجهات نظر .. لكن كله في إطار سيرك الحياة الزوجية .. لكني أختلف معك في كون هذا هو النموذج الصحيح وإلا فلا .. فكم من زيجة ثانية كانت ناجحة وأقامت حياة البائسين .. وكم من قلوب منكسرة أصلحها الله بالزواج الثاني .. لكن دعني أقول إن الزواج الثاني في كثير من الأحيان شر لا بد منه .. وهو أحياناً خير لا سبيل إليه .. بالتوفيق يا أبو عمار"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 8
subject = "هنا نختلف ياعم ياسر"
author = "هاني صلاح الدين"
text = "اختلف مع الزميل العزيز ياسر ابو العلا الصحفي المتميز لان فكرة المقال تختلف مع الواقع فكلمنا يعلم ان التعدد اباحة اٌلإسلام لحكم عظيمة منها مانعيشة الأن من حل لمشكلة العنوسة والعفة لبعض الأشخاص الذين في أحتياج لأكثر من زوجة بالطبع التعدد سيكون له دوافع عند الشخص المقبل علية خاصة في ظل ظروفنا الأقتصادية الصعبة التي يعيشها المجتمع المصري المنهوب ثرواتة من ولاد ... المهم لاتضيق واسع وانا ارى من لدية قدرة مالية وصحية فعلية بالتعدد حتي لاتتفشي ظاهره العنوسةاو حتي لاتترك مطلقة فريسة لنظرات المجتمع الظالمة لذا هنا نختلف ياعم ياسر رغم اتفاقنا في كثير من القضايا الفكرية"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 9
subject = "أخشى ما أخشاه"
author = "محمد عبد الرازق"
text = "أخشى ما أخشاه ان يكون كاتب المقال يعبر عن مكبوتات داخليه و هو اللي نفسه يجوز تاني رغم كل كلامه هذا ، و هذا ما احدث صراعات الاقدام و الاحجام تزداد عنده ؛ فعبر عنها بذلك المقال ليعبر عن شئ دفين لا يحب التصريح بيه لانه اتخذ موقف الرافض لهذه الفكرة ، و لذلك اود من الكاتب ان يقرا كلامي بعاطفته قبل قلبه ، و ربنا يجوزنا واياكم"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 10
subject = "معترض بشدة"
author = "المعتصم بالله حسين."
text = "يا عم ياسر ..قرأت موضوع الحاج متولي<br />ومعترض جدا، كأن التعدد مصيبة وكارثة وكأنه ليس حلا لمشكلات كثيرة في المجتمع<br />واضح إن من كثرة الضغط العلماني والحكومي بدأنا نكش ونخاف من التدين والمتدينين<br />مثل الإسلام فرض الجهاد للدفاع عن الدين فقط، وأصبحت كلمة الجهاد غير محبوبة عند البعض<br />وأين التعدد من حل مشكلة العنوسة،ومشكلة الأرامل، وغيرها من المشاكل الاجتماعية التي لن تحل إلا بالدين<br />تذويب هوية الأمة يبدأ بالنبش في قضايا فرعية ، ثم تسليط الضوء على جانب منها<br />وهلم جرا ، وعلى الأمة .<br />وبعدين لما أكون متدين ومقتدر فلم لا أعدد<br />ما يضير الغير<br />التعدد أفضل أم الحليلة في تونس<br />والزواج العرفي بالجزائر<br />أم الزنا في كثير من البلاد<br />ما ترد علي يا متعلم يا بتاع المدارس<br />ما هي دي المشكلة<br />وضعوا في أذهاننا أن الزواج التاني مصيبة ويهدم البيت الأول<br />وأن كله مشاكل، ثم تشريعات بعدم الزواج الثاني لا بعلم الأولى وقصص بايخة تحاد الشرع<br />وتعطل نواميس الكون"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

[[comments]]
order = 11
subject = "لتعمللهم سندوتشات بالقشطة لتوفرولهم الكلة"
author = "صلاح الدين حسن"
text = "مقالك يا استاذ ياسر رائع ... والقضية اللى تحدثت فيها بمقالك تعتبر مجرد افراز ضمن افرازات نتجت عن وجود معتقد مقدس كامن غائب وحاضر فى نفس الوقت هذا المعتقد المقدس يتصادم لحد كبير مع واقع بعدته العصور والسنون ... التيار السلفى يجد الحل فى القفز على الواقع والرجوع مباشرة للاصول ولذلك فالسلفيين اكيد هيزعلوا منك يا اخ ياسر لان التعدد سنة وحضرتك عايز تحرم حلال بشكل غير مباشر ... العلمانيين حلهم فى دماغهم تعدد مش تعدد مش قصة المهم واقعنا يمشى بشكل جيد ... لكن الغريب هو موقف التيار الاسلامى المعتدل اللى حتى الان لم يجد حل للاشكاليات الصغيرة دى حتى ولو من الناحية النظرية ... اسلام بيقول عددوا مفهاش حاجة وواقع ما يعلم بيها الا ربنا .. والغريب انك يا استاذ ياسر تكلمت عن الموضوع بشكل بعيد عن الجو الاسلامى مع ان حضرتك منتمى لمدرسة الاخوان ...ده ممكن لان الجماعة سابت لقضية دى لاجتهادات الافراد ودا كويس لحد ما لكن كان لابد من خط فكرى اصلاحى وتجديدى ينير طريق لتلاميذ مدرسة الاخوان بدل ماهمه تايهين كده ... أما رأيى الشخصى فى قضية التعدد هو ان النظام الاسلامى لم يطبق الا على بيئة اسلامية متكاملة ... وفر البيئة الاسلامية وبعدين بعد كده طبق احكامها هتلاقى المسائل ماشية معاك زى السكينة فى الحلاوة لكن هتطبقلى نظام اسلامى على بيئة بعدت عن الاسلام بألف سنة هتلاقى السكينة بدل ما تمشى فى الحلاوة هتخبط فى الصخر ."
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105228/http://masr.20at.com:80/newArticle.php?sid=11321"

