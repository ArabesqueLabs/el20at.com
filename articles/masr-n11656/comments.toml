[[comments]]
order = 0
subject = "مفيش"
author = "محمد ابوحسين"
text = "حبيبى انت وهو - افهموا بقى<br />وزارة الداخلية ميزانيتها ربع ميزانية الدولة يعنى اكبر من ميزانية وزارة الدفاع<br />الميزانية فى حدود 15 مليار جنية يعنى بتاكل الاخضر والناشف بتاع دخل البلد<br />وكل دة لقهر الشعب وضرب المظاهرات<br />الحكومة بتحس انها مكروهة وان الشعب مبيحبهاش<br />وشوف تحركات الوزراء والكبار والمواكب الامنية وحصارات الشوارع والاحياء ولبس الاقمصة الواقية من الرصاص وهم حتى فى الحمامات<br />كل دخل الدولة وامكانيته لحماية الكرسى<br />اتلم يا حبيبى وبلاش مظاهرات<br />الحل هييجى من فوق من عند ربنا<br />فلكل ظالم نهاية"
archived = "2007-10-05"
capture_url = "https://web.archive.org/web/20071005223834/http://masr.20at.com:80/newArticle.php?sid=11656"

[[comments]]
order = 1
subject = "الى محمد ابن ابو حسنين"
author = "ابو محمد عوضين -الفلاح الفاهم"
text = "ياسلام ياولاد واللة العلم نورن شوفوا ازاى الواد محمد ابن ابو حسنين بيفتى وبيقول ميزانية الداخلية ربع ميزانية الدولة يعنى 15 مليار بس ياواد يامحمد دى معلومات جامدة قوى هل بت ابوك الفلاح عرف المعلومات دى وهوا بيقرا الجرايد مع الفلاحين على القهوة ولايمكن تكون عرفت الحاجات دى وانتا راجع باليل من القطر ولايمكن تكون زى بقيت الشعب المصرى عمالين تحلموا وتانى يوم تصدوقوا الحلم<br />ومين اللى جاى هناك دة دة الواد ابن مكرم المجنون والنبى الواحد دة كلامة حكم<br />اة بابلد مرض وانتشر"
archived = "2007-10-05"
capture_url = "https://web.archive.org/web/20071005223834/http://masr.20at.com:80/newArticle.php?sid=11656"

[[comments]]
order = 2
subject = "الى الاخين الفوقى .... ياريت نبطل نفتى بقااااااااااااااااا"
author = "ابو صالح.... وبس"
text = "ياريت نبطل نتفى بقا فى كل حاجة ميزانية اية البتقول عليها هما ظباط الداخلية لاقين ياكلوا دة مرتباتهم ضعيفة ولا هى ربع ميزانية الدولة ولا حاجة من الكلام دة والاخ الاسمة ابو عوضين الفلاح الفصيح انت تروح تمثل احسن باللهجة الفلاحى دى<br />وطول منت فى مصر يا ما هنعيش ونشوف"
archived = "2007-10-05"
capture_url = "https://web.archive.org/web/20071005223834/http://masr.20at.com:80/newArticle.php?sid=11656"

[[comments]]
order = 3
subject = "الموضوع أثارة فتن"
author = "واحد"
text = "ماهو لما الجرايد تطلع تقول الريس عيان الريس هايموت المفروض يعني الريس يعمل ايه يقولهم لا انا كويس - الموضوع الجرايد خلته خل و طرشي و الريس زي ما انتم شايفين رايح جاي، على العموم الاخوة الصحفيين همه كمان محتاجين يعرفوا انه الحرية مش سبهللة و مش انا حر اقول اللي انا عايزه وظهور حرمه في التلفزيون طبيعي جدا و انساني جدا<br />يا ريت تعملو حسبة صغيرة و هي مش ظالمة ولا حاجة بس محتاج افهمها<br />الشعب المصر - المتخلفين - الجهلة - الاميين - المحسوبين على المتعلمين بس همه موتهم احسن = ؟؟ كام ؟؟؟<br />و شكرا"
archived = "2007-10-05"
capture_url = "https://web.archive.org/web/20071005223834/http://masr.20at.com:80/newArticle.php?sid=11656"

