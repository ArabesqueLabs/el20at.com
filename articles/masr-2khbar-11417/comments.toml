[[comments]]
order = 1
subject = "شيخ الازهر اصاب كبد الحقيقة"
author = "الى المعلق اللي فوق"
posted = "2009-02-26"
text = "شيخ الازهر اصاب كبد الحقيقة<br />رد باية قرانية وحديث شريف<br />الاية القرانية بتقول<br />ومن لم يجد نكاحا فليستعفف<br />الحديث بيقول<br />من لم يستطع فعليه بالصيام<br />والمشكلة هي هي وموجودة ومطروحة من ايام النبي محمد صلى الله عليه وسلم حتى وصلت الى شيخ الازهر<br />والنبي محمد سئل نفس السؤال<br />ونزلت الاية القرانية ترد على السؤال ومن لم يجد نكاحا فليستعفف وقال لهم الرسول عليهم بالصيام<br />هذا هو العلاج<br />ان يستعفف الانسان سواء كان رجل او امرأة والصيام خير معين على ذلك<br />اما بأه كون البلد بتتسرق<br />كون البلد بتتنهب<br />المسئولين في البلد بيبيعوا فيها<br />شيخ الازهر مضرور مثله مثل اي مواطن مصري<br />شيخ الازهر موظف وبياخد مرتب مش مكفيه<br />وكل واحد في مصر حيشتغل لازم ربنا حيعطيه<br />ومصر فيها خيرات كثيرة<br />والدليل على ذلك ان الصينيين ملوا البلد<br />الشعب المصري هو اللي اخد على التنبله<br />المحلات بتفتح الساعة اثنين الظهر<br />واخيرا<br />كيفما تكونوا يولى عليهم<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""

