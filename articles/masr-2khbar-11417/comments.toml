[[comments]]
order = 3
subject = "كلام الاباء على القهوة"
author = "واحد"
posted = "2009-02-26"
text = "من الشكاوى اللى با اسمعها من الاباء على القهوة<br />اب بيشتغل وعيالة اتخرجوا من الجامعة وقاعدين فى البيت ولدين وبنت<br />طول الليل سهرانين قدام التليفزيون والنت ويروحوا يناموا عند خروج الاب للعمل الصبح ويصحوا العصر ياكلوا ويناموا تانى<br />فين فرص العمل<br />كلة قاعد فى البيت - مفيش شغل<br />يبقى الجواز من اين - وفين فرصة الجواز<br />الصبر ممكن يبقى شهر او سنة - انما يا عم الشيخ مفيش امل<br />البلد كلها عنست"
archived = "2010-03-14"
capture_url = ""

