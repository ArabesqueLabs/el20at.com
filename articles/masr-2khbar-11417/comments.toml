text = "ادى احنا صابرين لغاية عزرائيل ما ياخد اجلة واجل اللى عينة فى الوظيفة دى<br />عزرائيل هو الحل<br />هو يا شيخ الصبر هيجيب فرص عمل للشباب علشان يشتغلووا ويتجوزوا ويفتحوا بيوت ويقضوا على العنوسة<br />انت شيخ ابن ------------------ لا تقول الحق ------- يلعن ------------"
