[[comments]]
order = 5
subject = "ثورة 23 يوليو  قضت على الاقطاع والزواج في مصر"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-02-26"
text = "المشكلة مش في شيخ الازهر<br />المشكلة ان ثورة 23 يوليو بعد الظهر<br />قضت على الاقطاع وقضت ايضا على الزواج في مصر<br />ايام الملك فاروق ما سمعناش ان فيه حد ما كنش لاقي يتجوز<br />بعد ما ولاد الفرأرية دول جم بقيادة المجرم جمال عبدالناصر وهاتك يا سرقه في البلد اطلت علينا اول مشاكلهم الا وهي ازمة الاسكان بدأت عام 66 وجاءت النكسة كملت على البقية الباقية<br />والذين جاءوا من بعدهم كانوا خير خلف لخير سلف كملوا الرسالة بصحيح<br />فشيخ الازهر ما لوش دعوه<br />شيخ الازهر رد على قضية سئل فيها النبي محمد صلى الله عليه وسلم ورد بنفس الرد اللي رده النبي محمد صلى الله عليه وسلم<br />يا شباب حقهم عند ربنا سبحانه وتعالى من اللي سرقوا بلدكم"
archived = "2010-03-14"
capture_url = ""
