text = "مرحبا رنا ... يعني ما قلته وقاله الاخرين صحيح وواقع غزة واقع مرير والكل يعرف ولكن اصحاب القرار وهم من يستطيعوا ان يحلو الخلاف والمعاناة في غزة لا يريدون ماذا نفعل ... الشعب الفلسطيني غير راضي وهو الا في حالة احباط كامل ولا يستطيع ان يعمل شئ ... نتمى ان يعرف الفريقين المتصارعين ان مصلحة الشعب فوق كل شئ ..."
