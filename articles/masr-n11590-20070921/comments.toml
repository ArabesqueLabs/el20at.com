[[comments]]
order = 7
subject = "تابعت والكثيرون بغيظ شديد علي مدار الأيام الماضية قضية المصريين اللذين تم تعذيبهما في الكويت،"
author = "مش لا.م"
text = "اه يعني لما المصريين يتعذبو بره اجه تغيظ<br />لكن لما المصريين يتعذبو جوه في بلدهم وعلي يد اخوانهم حاجه كويسه وما تغظش<br />يا اخي ةا انت كلامك سخيف ا،ي<br />دا بس الواحد يمشي جنب اي قسم شرطة في مصر ويلاقي الصريخ طالع من القسم<br />والله يا اخي حاجه تكسف<br />طيب لما غير المصريين يعذب، المصريين معقوله<br />لكن اللي مش معقول ان المصريين يعذبو بعض<br />يا ابني اللي واخد السنوية وبيجري علي كلية الشرطة بيبقي نفسه يدخل كلية الشرطة علشان خاطر يعذب ويضرب ويغتصب<br />ضباط الشرطة في مصر مرضي نفسانيين يا ابني<br />كلية الشرطة ما بيرحاش الا المرضى"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 8
subject = "التعذيب"
author = "زعبلة كسر القلة"
text = "يعنى اية تعذيب يا غجر<br />عاملين هيصة علشان واحد زابط علق واحد فى الفلكة وضربة علقة علشان يهذب اخلاقة<br />واية يعنى علقة تفوت ولا حد يموت<br />والا امين شرطة رمى مواطن من البلكونة علشان يموت ويدخل الجنة<br />والا الزابط اللى ضرب المواطن بخشبة علشان يفوقة من الهم اللى عايش فية قام لما فاق طلع السر الالهى<br />فيها اية دى<br />طيب ماهم فى امريكا ام الديمقراطيات بيعذبوا فى جوانتيمالا<br />وفى اسرائيل كل يوم بيموتوا فى الفلسطنيين<br />فيها اية يا غجر لما تتعذبوا شوية<br />اتعذبوا تصحوا<br />ازيك يا امينا"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 9
subject = "الي (مش لا.م)"
author = "مواطن"
text = "يعني ايه....... يتعذبو بره اه وجوه لأ<br />المسألة تكمن في نفسية هذا المواطن في الخارج وشعورة بالوحده في الغربة<br />وشعوره بالاهانة بها .....<br />وبعدين الموضوع ده يرمز لمدي احتقار الشعب المصري في بلاد العرب والتي لا اعتبر مصر منهم<br />يا جماعه احنا عندنا مشكله برة ومشكلة جوه<br />مش لازم يعني نختار مشكله منهم لازم نعترف بالاتنين<br />...وانا بشكر الاخ هواري علي الموضوع الجامد..."
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 10
subject = "متهان متهان"
author = "احمد ابراهيم محمد"
text = "اللى بيكلم غير اللى شاف انا رحت لبيا 4 ايام سمعت وشفت غير كل اللى انتو بتكتبو سب دين وشتيمه وقله ادب فوق ما تتخيل من اول ما تدخل لحد ما تطلع ممنوع من الكلام لان هم عرفين الفرق بنا وبنهم مع الاسف احنا نسناة وبعدين مكفايه اوى ان اى مصرى معاه جنسيه تانيه بيفضل التعامل بيها دى فى حد زاتها نصيبه حسبنا الله ونعم الوكيلا"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 11
subject = "الحفاة العراة"
author = "سيد بيومي"
text = "دون أن نسب هذا السب المخزي (الذي يستحقون أكثر منه)، أدعو كل قارئ لأخبار هذا الأدمي المصري أن يكتب بضمير هنا أو هناك، فالكتابة دون مقابل و لا تدفع شيئا و لكن كي يعلم هؤلاء الحفاة العراة الذين يبولون علي أعقابهم أنهم عالة علي المصريين الذين أصبحوا كالمرض بالنسبة لهم و لن يمكنهم الشفاء منه. نسي بغال البلد و حفاته من المصري؟ و من بني لهم صحراواتهم العراقية التي سلبوها من أرض التاريخ الأصيل و الشيم الشريفة أرض الرافدين (ألا رحم الله صدام) كان يعرف قدر هؤلاء البغال الخصيان اللواطيين. و أدعو كل مصري أن يتحرك للانتقام من تلك القرية الظالم أهلها، أن يثأر من هؤلاء الخصيان و يعلمهم أنهم تيوس فقط، و ليعلم من بالشام و العراق (أرضي الحضارة الحقيقة و التاريخ) أن هؤلاء عمرهم قصير يعودون بعده رعارع عراة يسألون الناس و يسعون وراء الكلاء تكل أقدامهم و تضمر أجوافهم. و ليعلم الكويتيون أنهم مهما بنوا فلن يبنوا إلا عجول العلف. و لم لا؟ فالكويتيون يسعون وراء نساء الهرم تحت حماية شرطة الدياسة في أرض المحروسة، فليتحرك أهل أسيوط إلي شارع الهرم يتصيدون نساء الكويت و رجاله و أهل أسيوط أهل حرب و نزال و عيب عليهم ترك ثأرهم و لو في الصين الشقيق."
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 12
subject = "حبيب العدلي يحتج لدى السفير الكويتي"
text = "ايه سا سفير الكويت دا<br />ايه اللي انتو عملتوه دا<br />كده برضه تضربوا المصريين<br />امال احنا شغلتنا ايه<br />فهمني<br />احنا نروح بقي نبيع بطاطا<br />لما انتوا تضربوا المصريين<br />دا احنا عندنا اكاديمية شرطة مخصوصة بتعلم الضباط فيها ضرب المصريين<br />حتي اسأل استاذ دكتور عميد حمزة البسيوني دا استاذ ورئيس قسم الفلكه في كلية الشرطة<br />بيضرب الضباط علي احدث وسائل التعذيب بالفلكة<br />ولا استاذ صلاح استاذ عصا المؤخرات اللي الضابط اسلام نبيه خريج من عنده<br />وغيره وغيره<br />ولا استاذ دكتور جمال عبد الناصر رئيس قسم التعليق في السقف والجلد<br />احنا ما قصرناش مع المصريين<br />علشان خاطر انتو تضربوهم<br />اوعوا تتعدو علي اختصاصاتنا تاني<br />فاهمين ولا ل<br />انصراف يا سفيرأ"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 13
subject = "ان لم اكن مصريا لا وددت ان اكون مصريا"
author = "احمد شاهين"
text = "انا شايف ان الموضوع مهم جدا وفى ناس كتير جهله علقو على الموضوع بسلبيه بل بانحطاط<br />انا كمان شايف انى المصرى دلؤتى بئه تمنو رخيص بره وجوه يعنى<br />يمكن تعليقى مفيهوش حاجه جديده<br />بس اللى عايز اقولو ان الحكومه بتعتنا ادام طووووووول عمرها هما الفلوس والسياحه واحترام السائح الاجنبى لانو معاه فلوس وحيدفع سواء كان عربى او من الغرب<br />طالما مصر وصل هما كلو فى جمع المال لدرجة انها بتبيع فى جميع ما تملك الدوله من مؤسسات وشركات واموال هى فى الاصل اموال عامه<br />ويصبح بعد هذا وذاك المصرى لا يملك اى شئ لا فلوس ولا كرامه ولا اى حاجه<br />بيتهيئلى ان المصرى مهااااااااااااان بدرجه لا يقبلها عقل البشر<br />وانا مش شايف فيها اى استغراب الصراحه من ساعه ماسمعت الخبر<br />ادام اصلا انا مهان فى بلدى ومليش فيها حق ولا احترم فيها عايز ازاى الاحترام ده يجيلى من بره اما حكومتى مش محترمانى الصرراحه شئ مؤسف<br />السادات بعد نصر اكتوبر قااااال حكمه عجبانى اوى :"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 14
subject = "اللي مش محترم في بلده مش محترم في اي مكان"
text = "تأكدوا تمام يا جماعة اللي مش محترم ف ي بلده لن تحترمه اي دولة في العالم<br />وكل الدول عارفين وخصوصا الدول العربية ان المصري مش محترم في بلده وانه وانه مش لاقي ياكل في بلده علشان كده سافر علاوة علي اخبار اهانة المواطن المصري داخل مصر تملأ كل الدول العربية"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

