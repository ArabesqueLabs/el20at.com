[[comments]]
order = 20
subject = "اية يبنى انت وهو"
author = "عاشق السادات"
text = "اخوانى اراكم تضحكون على كلام الهوارى انا اقيم بلكويت واعمل بمجال الاعلام الى حصل بلمصريين هنا يا بابا انت وهوا<br />حقيقة احد الزملاء لقط الخبر من قسم الشرطة ولولا هذا الشاب ما كانت الخارجية المصرية علمت الى بعد وصول المصريين لمصر الهوارى يعبر عن غضبة زى اى مصرى حر انتو شكلكم ضغار لا تدركو اهانت انسان ببلد غير بلدة يمكن عندنا تعزيب بمصر لكن لم يسب ضابط شرطة او عسكرى مصرى مصر او الرئيس كما يحدث هنا لكن اقول ليكم اخوانى المعلقين ان شباب مصر يعرف ياخد حقة زين على راى الكوايتة او الخليجيين لو فيكم حد متغرب كان عرف يعنى اية مصر"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090419/http://masr.20at.com:80/newArticle.php?sid=11590"
