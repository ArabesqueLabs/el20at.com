[[comments]]
order = 16
subject = "إضرب المربوط"
author = "الناى الحزين"
text = "يا جماعة تعلموا من دروس الماض هل تريدون ان يحدث لكم ما حدث لصدام و بلده ..... صدام عندما داس بإحذيته وجوه رعاة الغنم من الكوايته لأنه احس انهم اهانوه هاج و ماج و جعل اتخن شنب فيهم يقول انا \"مره\" و يكفى ان الجيش بظباطه بعساكره \"فلق\" و ترك البلد نهبا لصدام و جنوده \"بذمة فى عسكرى يجرى و يبسيب سلاحه الا لا مؤخذاة اللى ممكن يسيب اللى بالى بالك \" و بعدين ايه اللى جرى؟ ... راحوا جابوله بلطجى العالم مفتول العضلات رامبو الكره الارضية بوش و عائلته الغجرية و بهدلوا امه ... يعنى عاوزينا نتبهدل علشان جوز مصريين غرق زيهم 1000 و لا شعره من قفا اى مسئول اتهزت؟ .. ما يولع الـ 75 مليون و فوقيهم الــ 75 مليون اللى هيتولدوا فى الخمسسين سنة اللى جايه ..... و عجبى على قيمة الانسان اللى قال عليها واحد من رعاة الغنم الكوايته لا تساوى ثمن غسالة كورية"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 17
subject = "عيب بلاش تجريح"
author = "دموع التوبة"
text = "جزاكم الله خيراا اخونا الكريم على الموضوع<br />الموضوع فى غاية الأهمية<br />ورجاء من الأخوة الكرام الذين علقوا بالسلب اللاذع<br />دعوا الخلاف جانبااا<br />وتفهموا القضية بعقل واسع<br />ودعوكم من الخلاف لنفسه<br />شكراااااااا جزيلاااااااااا"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 18
subject = "جربوا مرة دور شقيقة كبري لا تتردد في استخدام عصي التأديب مع أشقائها الأصغر"
author = "رامي"
text = "مقال جميل .. أنا بس مختلف معاك في كلمتين هما انبطاح وانحناء<br />احنا لا بننبطح ولا بننحي .. الحقيقة اننا الوحيديين اللي لسه عايشين في ثقافة وطني العربي وطني الأكبر<br />في الخارجية ماشيين بمبدأ المحافظة علي العلاقات مع الأشقاء رغم كل شئ<br />السادة في الخارجية هما اللي أضاعوا هيبة مصر بداعي العلاقات مع الأشقاء لما سكتوا علي اهانة رموزنا علي لسان صغار العرب وفي وسائل اعلامهم ومردوش عليهم<br />احنا اللي سكتنا علي أذية فرقنا الرياضية عشرات المرات في ملاعبهم لدرجة وصل اللعيبة فيها لحالات ارتداد في المخ بايد لعيبتهم وجماهيرهم وبحراسة رجال أمنهم!<br />احنا اللي أهنا المصريين في الخارج لما قفلنا أبواب السفارات في وشهم وفي وش شكاويهم .. معملوش وزن للمصري لا بره ولا جوه في زمن حكومتنا الرشيدة<br />احنا اللي مطبقناش المعاملة بالمثل لما كان المصري هو الوحيد دوناً عن جنسيات تانية اللي لا يسمح بدخوله بعض البلدان العربية الا بتأشيرات مشروطة<br />احنا اللي سكتنا علي نظام الكفيل القذر وكل اللي جيه من وراه<br />احنا اللي سكتنا علي أمراء قطر والسعودية في مصر<br />زهقنا يا حكومة يا ضعيفة .. زهقنا يا حكومة زبالة الزبالة من ارتداء ثوب الشقيقة الكبري حمالة الأسية اللي بتضحي علشان شقيقاتها ولا تلقي في النهاية الا نكران الجميل والجحود<br />جربوا مرة واحدة بس انكم تعملوا من بلدكم شقيقة كبري تحظي بمحبة مع مهابة .. شقيقة لا تتردد عند اللزوم في استخدام عصا التأديب<br />بخصوص اللي قولته عن عبد الناصر لما رجع المصريين .. ياريت تفيدني وتذكر لنا الحادثة بالتفصيل"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023000/http://masr.20at.com:80/newArticle.php?sid=11590"

