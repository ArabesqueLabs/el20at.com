author = "ناس بتعرق"
posted = "2009-10-07"
text = "اللى قال<br />فية ناس بتعرق على الرغيف وناس بتعرق فى لعب التنس<br />يعنى العلم اضاف اية وشوية الناس اضافوا اية للبلد<br />كان من الممكن يشتروا بتمن العلم دواء لمستشفى حكومى او مستشفى السرطان<br />كان من الممكن يشتروا عربية جمع قمامة ينضفوا بها شوارع مليانة زبالة<br />كان ممكن يشتروا كمامات لاطفال مدرسة فى حى عشوائى<br />انما عملوا الوطنية لعبة يتسلوا بها ويفرحوا اطفالهم<br />ويعنى لو علم طولة شبر او طولة 100 متر هيفرق اية<br />انما هنقول اية - سفاهة وفراغ وكتر فلوس"
