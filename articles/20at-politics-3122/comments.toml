[[comments]]
order = 1
subject = "فتش عن الشيعة"
author = "عبدالله"
posted = "2007-01-27"
text = "إذا اردت أن تعرف سبب أي مشكلة فابحث عن الشيعة فهم سبب كل توتر ، كأنهم اليهود<br />وفي رأي أن ايران تريد أن تصنع حربا في لبنان لتشغل العالم عن جرائمها القذرة ضد أهل السنة في العراق<br />أو لعلها تهدف من هذه الحرب التي تريد اشعالها في لبنان صرف أمريكا عن حربها ضدها.<br />ايران لا يهمها أن تجعل من بلاد العرب ساحة حرب إذا كان ذلك في مصلحتها.<br />العجب أن شيعة العرب يجعلون من أنفسهم وبلادهم أدوات للاجنبي الذي لا يهمه مصلحتهم و مصلحة بلادهم.<br />ثم لا أدري ما سبب هذه العجلة في اسقاط الحكومة ، وما بقي لها الا سنتان في الحكم ثم تجرى انتخابات لاختيار حكومة جديدة ، هل إذا اجريت الانتخلبات الان سيصير لبنان من الدولة المتقدمة ؟؟!!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "نصر الله السبب الرئيسى للمشكلة لكن هذا لا يعفى الا"
author = "BATISTUTA"
posted = "2007-01-28"
text = "ارجو من الاخوة المعجبين بحسن نصر الله ان يعجبوا به بعقلانية بعيدا عن العواطف .<br />ماذا تنتظر فعلا من حزب تكوينه طائفى لا يقبل الا الشيعة فى عضويته ؟<br />انا لا اهاجم حزب الله ولا ادافع عن السنيورة ولكن ما مأخذ نصر الله على حكومه لبنان هو نفس ما يفعله حزب الله فاذا كان السنيورة ياخذ اوامر من كوندى فان نصر الله ياخذها من خامنئى .<br />ولنفكر ماذا فعل حزب الله باسرائيل هل احتل اجزاء منها هل قتل عدد وفير منهم فى مقابل تدمير وقتل من ارهاب صهيونى معتادون عليه .<br />رغم ان مصر لم تحارب اسرائيل فى ارضها فى 73 لا انها قتلت من جنود اليهود الكثير والكثير ودمرت لها معدات ودبابات وطائرات لم يستطيع حزب الله فعلها كذلك قدم المصريون تضحيات جمة فى حرب 67تدمير جيش كامل وقتل واسر الالوف من الجنود المصريين فياتى حسن نصر الله ويمن علينا بان حزبه ضحى بكذا وكذا وانه حقق نصر كذا وكذا ويأتى اخرون ممن عمتهم عاطفتهم ليقول ان الشيعة ابطال والسنة جبناء وخونه وهل كان مصريو 1973 شيعة . الان يأتى حسن نصر الله ليطالب بأشياء مقابل منجزات حزبه فى حرب يناير التى اضرت بلبنان وخرج حزب الله سليما, أنا متفق معه ان حكومة السنيورة لا تصلح لحكم لبنان ولكن هل ما يفعله من ابتزاز للحكومة يرضى احد هناك طوائف اخرى فى لبنان غير حزب الله وحركة امل ارجو منه ان يفهم ان لبنا ليست ملكا لحزب الله بل ملك اللبنانين جميعا"
archived = "2010-03-14"
capture_url = ""

