subject = "سعد الحريري تاج راسك وابو لهب جهنم وبئس المصير"
author = "محمد"
posted = "2008-02-03"
text = "الذي يريد ان يشعل الفتنة هو من توجه من الضاحية الى طريق الجديدة . هو من افتعل الحواجز المذهبية في سليم سلام . من يو جه الشتائم لعمر وعثمان و ابو بكر في كل تحرك له . هو من يقول جمهوره ( خلينا نشوف مين اقوى نحنا الشيعة او السنية ) في مار الياس . هو من مشروعه الغاء الطائفة السنية . لكن هيهات هيهات من الذلة ."
