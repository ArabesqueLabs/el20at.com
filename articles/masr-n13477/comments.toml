order = 0
subject = "كل عام والجميع بخير وصحة وعافية ..."
author = "محمد نواف الحمدالله ..."
posted = "2007-12-19"
text = "كل عام والجميع بخير .. كل عام والأردنيين بخير وصحة وعافية .. تحية إلى آل الحمدالله بالأردن وفلسطين وبالسعودية وبدول المهجر .. وتحية خاصة من القلب للقلب إلى الأستاذ الأخ / تيسير الحمدالله ومبروك وانشالله من مشروع لمشروع أنجح .. وتحية لرئيس جامعة النجاح الوطنية _ نابلس الأستاذ الدكتور / رامي الحمدالله وانشالله موعدنا قريب ..<br />وكل عام والجمييييييييييييييييييييع بخير . حبيبي أبو معاذ ع راسي أنتا وغزوان ومحمد وأبو موسى والجميع .. وعساكم من عواااااااااااااااااااااااااااااااااااااااااده !!"
archived = "2007-12-21"
capture_url = "https://web.archive.org/web/20071221183236/http://masr.20at.com:80/newArticle.php?sid=13477"

[[comments]]
order = 1
subject = "وسلام مربع وكبير"
author = "الريس متقال"
posted = "2007-12-19"
text = "وتحية للعريس وكل سنة لام الواد المتطاهر ومن نجاح الى نجاح وعقبال العيد الجاى والمعتقلين فى الضفة وغزة وابو زعبل يطلعوا برة وان شاء اللة يكون شارون فطس واللى فى بالى مات بمرض الزحار وسلام من الريس متقال للريس زعبور ومن المعلم ابو رجل مسلوخة الى الست ام اربعة واربعين<br />اى كلام فى الهجايص - عيد بقى واللحمة كابسة على المخ"
archived = "2007-12-21"
capture_url = "https://web.archive.org/web/20071221183236/http://masr.20at.com:80/newArticle.php?sid=13477"

[[comments]]
order = 2
subject = "كل عام والامة كلها بخير"
author = "د.عمرو العنانى"
posted = "2007-12-19"
text = "كل عام وانتم بخير والامة كلها بخير باذن الله. مع دوام التوفيق والنجاح باذن الله<br />(يرفع الله الذين امنوا منكم والذين اوتوا العلم درجات)<br />لذا ارجو منكم حث الشباب على التمسك بالايمان والعلم لرفعة الامة وجزاكم الله خيرا وكل عام والجميع بخير"
archived = "2007-12-21"
capture_url = "https://web.archive.org/web/20071221183236/http://masr.20at.com:80/newArticle.php?sid=13477"

[[comments]]
order = 3
subject = "عيد سعيد علينا يارب"
author = "خاالد الامير"
posted = "2007-12-19"
text = "عيد سعيد علي الامه الاسلاميه والعربيه بجميع طوائفه مسلمين ومسيحين ويارب السنه جايه تيجي ونكون في مصر في احسن حال وتنزاح الغمه والبلد تبق عال العال واحزبنا تكون ف احسن حال ويكون فيه ديمقراطيه وحريه حقيقيه ويكون الوطن العربي اتخلص من انانيته ونساعد بعضنا كعرب يارب وعيد سعيد علي جميع محرري ومتابعي واداري وكل مشارك في الموقع وكل سنه وانتم طيبين"
archived = "2007-12-21"
capture_url = "https://web.archive.org/web/20071221183236/http://masr.20at.com:80/newArticle.php?sid=13477"

