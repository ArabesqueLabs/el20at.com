[[comments]]
order = 6
subject = "لحمة راس وفتة"
author = "عادل"
posted = "2007-12-20"
text = "امبارح اكلت لحمة راس وفتة وشربت شوربة كوارع فى الحسين ومشيت من الحسين للسيدة زينب علشان اعيد على اختى المتزوجة هناك وجوزها قابلنى بوش خشب مش مهم<br />الشيخ فى صلاة العيد كان بيخطب من ورقة مكتوبة فى ايدة وانا ما بحبش الشيوخ اللى بيقروا من ورقة كاتبها بتوع الاوقاف وبتقول ان الناس يعطفوا على الفقير<br />اصل كل اللى بيصلوا كلهم فقراء - انا عايز اعرف الناس بتوع الساحل الشمالى بيصلوا فين ؟ والشيخ فى خطبتة بيقول ليهم اية<br />اصل التليفزيون بيجيب ناس بتصلى من الكبار وهم مرعوبين من الشعب وبيصلوا وحطين وراهم حيطة حديد تفصلهم عن الناس اللى فى الجامع هى الحيطة الحديد هتحميهم من اية ولما هم خايفيين من الناس بيروحوا يصلوا لية<br />ولما هم عارفين ان الشعب بيكرهم قاعدين لية<br />انا بشوف الرئيس جمال عبد الناصر فى الصور ماشى فى وسط الناس وبيصلى فى وسط الناس ومفيش حيطة وراة ولا حصار من الشرطة للمنطقة اللى ماشى فيها وكذلك السادات<br />هو حصل اية<br />بلاش تعملوا حيطة فى الجامع يستخبى وراها<br />بلاش يصلى احسن ما دام خايف<br />على السيد ابو دومة<br />دبلوم تجارة 1985 وعاطل عن العمل"
archived = "2007-12-21"
capture_url = "https://web.archive.org/web/20071221183236/http://masr.20at.com:80/newArticle.php?sid=13477"

[[comments]]
order = 7
subject = "بصو في الصورة كويس"
posted = "2007-12-20"
text = "هذه الصورة تدخل في باب الاستهزاء بالدين<br />ان عيد الاضحى عند المسلمين ليس جزار يجري وراء الخروف<br />ولاهمية الموضوع نبدأ من الاية (واذن في الناس بالحج يأتون رجالا وعلى كل ضامر يأتين من كل فج عميق)<br />الايام دي ايام المؤتمر العالمي للمسلمين وبهذا يكون للاسلام فضل السبق في عمل المؤتمرات العالمية<br />كل واحد قاعد في بلده وليه مندوبين في هذا المؤتمر العالمي والاجتماع الدولي المنعقد في عرفات<br />والموضوع يطول شرحه (لطفا يرجى مراجعة تفسير فضيلة الشيخ محمد متولي الشعراوي في تفسير ايات الحج)<br />عيب لما نكون في اكبر دولة اسلامية في العالم على الاطلاق (مصر) وكل المسلمين في جميع انحاء العالم بتنظر الينا هذه<br />النظرة ويكون معلوماتنا عن عيد الاضحى جزار بيجري ورا خروف"
archived = "2007-12-21"
capture_url = "https://web.archive.org/web/20071221183236/http://masr.20at.com:80/newArticle.php?sid=13477"

