[[comments]]
order = 11
subject = "الى دعاء الشامى"
author = "واحد"
posted = "2007-12-21"
text = "واللة فى صلاة الفجر انا دعيت ربنا انة يقومك بالسلامة<br />ويرزقك الذرية الصالحة<br />ويبعد عنك الحاسدين والحاقدين وولاد الحرام<br />ومتنسيش تعملى السبوح بتاع بلدنا وترشى السبع حبوب وتحطى المولودة فى الغربال وتغربيليها فى السبوع<br />وتحطى فى السبوع فاسوخة وعين العفريت وتنفذى كل عادات جدنا منقرع وخوفو<br />ومتنسيش واحد ساعة الولادة يؤذن فى اذن المولودة<br />وتدقى الهون النحاس<br />وتطردى ابوها من البيت خلال الاسبوع دة - يروح ينام عند امة وييجى الصبح من الفجر"
archived = "2007-12-21"
capture_url = "https://web.archive.org/web/20071221183236/http://masr.20at.com:80/newArticle.php?sid=13477"

