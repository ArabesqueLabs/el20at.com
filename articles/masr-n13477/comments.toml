subject = "الى الاخت دعاء الشامي"
author = "اكتب اسمك هنا"
posted = "2007-12-21"
text = "يا رب تولدي ونغنيلك اغنية<br />السح الد امبو<br />ادي الواد لابوه<br />يا عيني الواد بيعيط<br />اكمنوا شبه ابوه<br />وخلي بالك ابوه صحبي ودمه زي السكر"
archived = "2007-12-21"
