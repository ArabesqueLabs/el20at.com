subject = "شهر زبال فى مصر..خريج كلية العلوم ويكسب مليون جنيه سنوي"
author = "للامانة منقول/مش شريف الدواخلي ولا البراء اشرف"
text = "شهر زبال فى مصر..خريج كلية العلوم ويكسب مليون جنيه سنوي<br />شرف امام سلامة 31 سنه هو أشهر زبال فى مصر حاليا تخرج فى كلية العلوم قسم ميكروبيولجى عام 1999من جامعة الازهر عمل بعد تخرجه فى هيئة المصل واللقاح لمدة عام ورغم نجاحة بها الا انه لم يقنع براتبة القليل داخل الهيئة.<br />وشعر أن بداخله احلاما وطموحات أكبر بكثير من الوظيفة الحكومية وعلى الفور ترك شرف هيئة المصل واللقاح وانشأ جمعية أهلية لحماية البيئة ونظافة المجتمع ثم اشترى سيارة نصف نقل وقرر تجميع القمامة من منازل قرية البراجيل مقابل 3 جنيهات شهريا.<br />لكنه لم يتوقف عند ذلك فجمع مجموعة من الشباب وبدأوا فى فرز القمامة التى يجمعونها يقسموها حسب طبيعتها وبيعها للمصانع التى تقوم بتدويرها وحقق شرف المليون الاول فى خمس س<br />سنوات بعدها تضاعفت أرباحه بشكل كبير وتوسع مشروعه وعمل معه عشرات الشباب واقترب ربحه السنوى من مليون جنيه.<br />واجه شرف فى بداية المشوار كما هائلا من الانتقادات خاصة من اسرته وعائلته فكيف يقوم خريج الجامعة بتجميع القمامة تحمل شرف كل الانتقادات وكان يدرك جيدا انه سينجح لانه اعتمد فى مشروعه على الاسلوب العلمى.<br />واستفاد من دراسته فى كلية العلوم يؤكد شرف ان القمامة من اغنى الموارد التى يمكن استغلالها خاصة قمامة القرى والقاهرة مشيرا الى أن الدراسات أكدت ان ارباح طن القمامة 6 الاف جنيه وتنتج القاهرة 15 الف طن ويمكن ان توفر 120 الف فرصة عمل للشباب.<br />شرف يسعى الان الى انشاء اكبر شركة قمامة فى مصر وان يتوسع فى عمليات جمع وفرز القمامة"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 1
subject = "مصري يقاضي محافظ القاهرة ليتسعيد لقبه كـ [زبال]"
text = "مصري يقاضي محافظ القاهرة ليتسعيد لقبه كـ [زبال]<br />بسبب عدم الاعتراف به (زبالاً رسمياً) أو جامع قمامة أقام مصري دعوى قضائية أمام محكمة القضاء الإداري المصرية يطالب فيها بإصدار حكم قضائي بأحقيته في الحصول على التعويض المناسب عن الأضرار المادية والأدبية التي لحقت به من نزع هذه المهنة منه.<br />الدعوى أقامها أحمد ضد محافظ القاهرة القاهرة ورئيس مجلس إدارة الهيئة العامة لنظافة وتجميل القاهرة ورئيس حي جنوب القاهرة.<br />جاء في الدعوى أنه في عام 1957 أسندت الشركة المصرية للتعمير والإنشاءات السياحية إلى والده مهمة جمع القمامة من المنازل والمحال العامة في مدينة المقطم ونقلها إلى خارج المدينة، وفي يوليو عام 1958 أسند لوالده جمع القمامة من جميع مدينة المقطم.<br />وعلى أثر وفاة والده استمر هو في أداء العمل لسنوات طويلة حتى فوجىء بهيئة النظافة تعهد بهذه المهمة لأشخاص آخرين ثم قام حي جنوب القاهرة بإصدار ترخيص موقت لشركات الخدمات والنظافة.<br />مؤكدا أن الهيئة خالفت القانون الذي ينص على أن الاختصاص بإصدار ترخيص جمع القمامة معقود للمجلس المحلي وحيث إن هذا القرار أصابه بأضرار مادية وأدبية جسيمة فإنه يحق له المطالبة بالتعويض."
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 2
subject = "الرسول ( ص ) كان يعمل راعيا للغنم ولم يخجل يوما من عمله طالما كان يعمل عملا شريفا،"
author = "ابومحسن"
text = "الكلام دا غلط من وفيه وصف للنبي محمد صلى الله عليه وسلم بغير ما يليق به صلوات الله وسلامه عليه<br />النبي محمد صلى الله عليه وسلم اشتغل راعي غنم وكل الانبياء اشتغلوا برعي الغنم لحكمة يعلمها الله ويطول شرحها<br />دايما اي واحد بيشتغل شغلانه ضعيفة يجري ويقول النبي محمد كان بيشتغل راعي غنم<br />وبصوا في الفتوى دي<br />رقـم الفتوى : 76600<br />عنوان الفتوى : الحكمة في إلهام الأنبياء رعي الغنم قبل النبوة<br />تاريخ الفتوى : 29 رجب 1427 / 24-08-2006<br />السؤال<br />في الأثر أو الحديث النبوي: ما من نبي إلا ورعى الغنم.<br />سؤالي النبي صلى الله عليه وسلم ( رعى الغنم ) أسال عن نوع الغنم هل هي الماعز أم الضأن ؟ وما الحكمة في ذلك ؟ أثابكم الله<br />الفتوى<br />الحمد لله والصلاة والسلام على رسول الله وعلى آله وصحبه، أما بعـد:<br />فقد روى البخاري في صحيحه أن النبي صلى الله عليه وسلم قال: ما بعث الله نبيا إلا رعى الغنم. فقال أصحابه وأنت؟ فقال: نعم، كنت أرعاها على قراريط لأهل مكة.<br />والغنم والشاة اسم للجنس فيشمل ذلك الضأن والمعز، ولم نقف على رواية تحدد أحدهما دون الآخر.<br />وأما الحكمة في ذلك فقد ذكر الحافظ ابن حجر في الفتح طرفا منها عند شرحه للحديث المذكور فقال:<br />قال العلماء: الحكمة في إلهام الأنبياء رعي الغنم قبل النبوة أن يحصل لهم التمرن برعيها على ما يكلفونه من القيام بامر أمتهم، ولأن في مخالطتها ما يحصل لهم الحلم والشفقة.. لأنهم إذا صبروا على رعيها وجمعها بعد تفرقها في المرعى، ونقلها من مسرح إلى مسرح أحسن، ودفع عدوها من سبع وغيره كالسارق.. وعلموا اختلاف طباعها وشدة تفرقها مع ضعفها واحتياجها إلى المعاهدة.. ألفوا من ذلك الصبر على الأمة، وعرفوا اختلاف طباعها، وتفاوت عقولها، فجبروا كسرها، ورفقوا بضعيفها، وأحسنوا التعاهد لها، فيكون تحملهم لمشقة ذلك أسهل مما لو كلفوا القيام بذلك من أول وهلة..<br />وعلى هذا فالحكمة من رعي الأنبياء للغنم حكمة تربوية، كما أنها اقتصادية أيضا.<br />والله أعلم."
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 3
subject = "الدنيا فى العالم تطورت والزبالة والنظافة بقت لها الات ومعدات نظافة متقدمة والحكاية مش مقشة وجردل"
author = "فاهم"
text = "اصحوا يا عالم من النوم<br />اعمال النظافة فى المطارات زى ما انتم شضايفين فى مصر واحد ماسك مقشة ومعاة جاروف وجردل - لا -دة قمة التخلف<br />دى النظافة الات - يعنى تلاقى واحد سايق عربية صغيرة حجمها صغير جدا وبتشتغل بالبطاريات وما بتعملش اى صوت وبيمشى بها فى صالات المطار تشفط الورق والتراب واى وساخة وتجمعهم فى كيس داخلها وفية عربيات ضغيرة بطول متر وعرض متر برضة بتغسل رخام الارضيات او السيراميك وتخلى الارض تبرق وتشوف وشك فيها<br />انما بتاع مطار القاهرة فهذا قمة التخلف الزبال ابو مقشة ويقابلة مسافر او عائد يمد ايدة ويقول لة حلاوة السلامة يا بية<br />ومنظرهم كئيب وفية ستات رابطة منديل على رأسها وعاملة عقدة كدة بطريقة تحسسك مدى بؤس الشعب المصرى<br />800 جنية اية - دول يدوبك يصرف نصهم مواصلات<br />لية الراتب ما يكونش 2000 جنية"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 4
subject = "القضية مش كده القضية لو جه لبنتك عريس جامعي وزبال حتعمل ايه"
author = "مش زبال"
text = "هي دي المشكلة<br />الواحد بيشتغل علشان خاطر يروح يخطب ويتجوز<br />فبعد ما خريج الجامعة يحصل وظيفة على طول عايز يخطب<br />لو راح يخطب بنت وقال لابوها انا بشتغل زبال في المطار يا ترى ابوها حيعمل فيه ايه"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 5
subject = "انا بشتغل cleaner في المطار يا عمي"
author = "مش رضوى حسن ولا مروى صلاح"
text = "دايما احنا المصريين لما نحب نحسن صورتنا ادام الناس نقول الكلمة بالانجليزي<br />يعني مثلا (كبانيه) نقول عليها تواليت<br />وهكذا<br />فلما واحد يروح يخطب واحدة يقوله انا بشتغل cleaner يا عمي في المطار<br />طبعا ابو العروس مش فاهم يعني ايه كلينر حيقولوا اهلا وسهلا يا ابني حصلنا الشرف<br />اهو هوا دا النسب اللي يشرف صحيح<br />ويدخل على بنته ويقولها<br />مبروك يا بت جالك (كلينر اد الدنيا في المطار)"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 6
subject = "الموضوع دة من 25 سنة تنبة الية المثقين وعملوا فيلم انتبهوا ايها السادة"
author = "ابوعلى"
text = "انتم عارفين فيلم انتبهوا ايها السادة اللى عملة حسين فهمى بعد السادات ما عمل سياسة الانفتاح<br />الفيلم بيقول اية<br />مدرس شاب فى الجامعة خاطب بنت كويسة تناسبة لكن مش قادر يجيب شقة يتجوز فيها<br />خطفها منة معلم زبال عندة فلوس<br />واتجوزت الزبال وسابت استاذ الجامعة<br />وطلع الفيلم يحذر انتبهوا ايها السادة فية حاجات فى البلد بقت مش طبيعية<br />مين ابتدأ الفساد مش السادات دى جيهان بنت الانجليزية<br />ومين كملت برضة بنت الانجليزية<br />وازواجهم طراطير<br />ودى كلام بقولة من غلبى ويأسى من اى اصلاح"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 7
subject = "الى الاخ ابو علي المعلق السابق"
author = "مش ابو علي"
text = "انا فاكر الفيلم دا كويس يا اخ ابو علي ولكنه كان مبالغ فيه بشكل ملحوظ وفاكر بعد انتهاء عرض الفيلم فيه واحدة مذيعة تقصت الحقيقة عند معلمين الزباله في القاهرة وجابتهم على الهوا وطلع الكلام اللي في الفيلم غير حقيقي<br />ولكن الفايدة من لم الزباله ان بيبقى فيها خرده والخرده دي بتتجمع وبتتباع<br />يعني مثلا حديد خرده<br />صفيح خرده واشياء من هذا القبيل<br />لكن قضية استاذ الجامعة وكل موظفين البلد موضوعهم واحد<br />الا وهو بدأ مع ثورة 23 يوليو<br />يهمي مثلا سمعت مرة في التلفزيون برنامج لواحد كاتب كبير اخد الابتدائية ايام الملك فاروق واتوظف بيها واخد 5ر4 جنيه<br />يعني اربعة جنيه ونص وراح اجر شقة في القاهرة بخمسين قرش<br />ايه اللي حصل بقا للموظفين بعد الثورة فضلوا محلك سر 50 سنه وبعد كده بقا الان من محلك سر الى للخلف در<br />يعني تخيل الكومسري بياخد 200 جنيه وغيره وغيره<br />خلاص مفيش امل في حل مشكلة الموظفين على الاطلاق حالهم بقا في النازل ومفيش فايدة<br />ولا نملك شيئا الاالدعاء لله سبحانه وتعالى ان يولي علينا من يصلح<br />اللهم ولي علينا خيارنا ولا تولي علينا شرارنا"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 8
subject = "تعليقا علي رد الكلام دا غلط من وفيه وصف للنبي محمد صلى الله عليه وسلم بغير ما يليق"
author = "محمد الحنفي"
text = "أولا هو ليس وصفا ولكنه استشهاد بالمهن الشريفة التي أمتهنها الرسل عليهم السلام بمعني أن العمل ليس حراما طالما كان عملا شريفا فلا يجب أن يخجل منه المرء ويكون راضيا عنه أيا كان نوع هذا العمل ولا أعتقد أننا نستطيع أن نستغني عن عامل النظافة في أي مكان فهل أنت أو غيرك تستطيع الاستغناء عنه ؟؟!!<br />نحن في زمن إنقلبت فيه المعاني ومن كان اليوم معك أصبح غدا ضدك ومن لا عمل له فهو عاطل في مجتمع مليء بهم فدعنا لا نذيدهم عاطلا وليفخر كل منا بما يعمل لنرقي"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 9
subject = "الزبال التقليدى بتاع عصر المماليك انتهى"
author = "مش عارف"
text = "يا جماعة زبال اية وبلدية اية - الكلام دة انتهى فى العالم المتقدم والمتخلف من زمان<br />دلوقتى فية شركات نظافة فيها موظفين ومعاهم معدات وبيشتغلوا على معدات - انما الزبال اللى شايل مقطف على كتفة وطالع يفضى الزبالة من الصفيحة قدام الشقق فى العمارات وبعدين ينزل يركب عربيتة الكارو المكسرة اللى بيجرها حمار اعرج - - زى ما بنشوف فى مصر - الكلام دة خلاص من العصور الوسطى<br />الناس فى العالم دلوقتى - غير مصر بيجمعوا الزبالة فى كيس بلاستيك اسود وبعدين وهما نازلين يرموة فى صندوق البلدية وبعدين بتيجى عربية مخصصة لتفضية الصناديق بطريقة الية والسيارة تروح على مقلب الزبالة خارج المدينة وهناك يتم فرز الحديد والبلاستيك والورق ويتم تدوير معظم الزبالة وترجع تانى جيدة بعد ارسالها الى المصانع<br />انما زبال فى المطار - دة عامل نظافة<br />بمعنى اصح كناس<br />بس مش كناس شوارع - لا دة بيكنس رخام وسراميك وداخل الصالات وداخل مبنى مكيف ونظيف<br />الوظيفة عامل نظافة<br />مطلوب واحد معاة اعدادية وعندة قوة حسمانية علشان هيقف 8 ساعات على رجلية وهيرجع مهدود الحيل ونفسيتة فى الارض<br />الجامعى لو اشتغل يوم واحد كناس فى بلدة هيكرة نفسة وبلدة وحكومتة<br />دى تدمير لنفسيات الناس وزرع الكابة فيهم<br />وبعدين الطالب هيقول لزميلة - يا عم هنذاكر لية - ما اخرتها هنشتغل زبالين زى فلان<br />هذا الاعلان خطير على المجتمع وعلى طموحات الشباب<br />امنعوا هذا الاعلان"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"

[[comments]]
order = 10
subject = "الى الاخ محمد الحنفي"
author = "ابومحسن"
text = "يااخي الانبياء كلهم عملوا برعي الغنم والسبب واضح في تعليقي<br />اما واحد يجي بيشتغل زبال ويقول وايه يعني ما هو النبي صلوات الله وسلامه عليه كان يغمل راعي غنم هذا وصف النبي صلوات الله وسلامه عليه بغير ما يليق به<br />وقد نهى السادة العلماء عن ذلك<br />والله على ما اقول شهيد"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090641/http://masr.20at.com:80/newArticle.php?sid=17320"
