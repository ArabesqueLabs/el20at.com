subject = "يا شريف درش بتاعك اول ما شطح نطح"
author = "مش رضوى حسن ولا مروى صلاح"
posted = "2008-12-24"
text = "يا شريف درش اول ما شطح نطح<br />الراجل عنده 21 سنه يعني على ما يبدو لسه ما خلص جامعة ويمكن اول مقال يكتبه في حياته ويظهر انه زي اي شاب عايز يوصل بسرعة زي اسراء عبدالفتاح كده وزي منتظر الزيدي عايز يعمل حاجه جامدة يخلص بيها الموضوع<br />فاول ما كتب كتب انا والقرضاوي على طول<br />يعني تقولش القرضاوي دا واحد صحبه كان بيلعب معاه حكشه في الحارة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "صدقت يا مصطفى"
author = "kombota"
posted = "2008-12-24"
text = "ماشاء الله عليك يا مصطفى<br />وفعلا لآ أحد يشعر بمشاعر الحب أو العشق الخالصة التي تبدأ أولا و أخيرا من حب الروح للروح لا بحب الجسد للجسد الا من ذاقها و عرفها .<br />وبما اننا مسلمين ولنا في رسول الله اسوة حسنة ، فحينما نتذكر زيجاته صلى الله عليه و سلم نجد أن أكثر زوجاته قربا الى قلبه و عقله و أم أبناءه و التي سمى عام و فاتها بعام الحزن هي أم المؤمنين خديجة التي كانت تكبره بعدة أعوام ، و التي أحبها بقلبه و عقله على حد سواء و بادلته أسمى أنواع الحب وهو الحب الروحاني . واذا كان العكس هو ما حدث مع الشيخ الجليل فالأصل واحد و هو امتزاج المشاعر بالتفكير العقلاني .<br />و آه ثم آه لو أن ماحدث هو العكس<br />كثير من المثقفين سمعوا و قرأواو كتبوا عن\" العشق الالهي \" ولكن كم منهم آمن به ووصل لهذه الدرجة التي لا يصل لها الا من ذاقه فمن ذاق عرف .<br />لا اقصد التشبيه و لكن التذكير بأن كثيرين يتحدثون و يدافعون بضراوة عن أفكار أدعي انهم لم يؤمنوا بها حق الإيمان .<br />و صدقت حين قلت أن كثيرين يفتقرون و يفتقدون لشجاعة الشيخ الحكيم ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = "زواج دكتورة علوم سياسية من شيخ ازهرى - هل وراء الا"
author = "مش فاهم"
posted = "2008-12-24"
text = "دعونى اذكركم<br />طة حسين الاديب المصرى اعمى القلب واعمى النظر كان يدرس الدكتوراة فى باريس<br />وكلنا يعرف قصتة ابتداءا من طردة من الازهر الى دخولة الجامعة الاهلية - اللى هى جامعة القاهرة الى سفرة الى باريس لتحضير الدكتوراة فى باريس<br />فى باريس دفعوا فى طريقة امرأة متعصبة ابنة كبير قساوسة فرنسى اوقعت الاعمى فى حبائلها وتزوجها واظن انة بعماة لم يرى جمالها ولا قبح وسواد قلبها - فالقت امامة وقرأت لة كتب المستشرقين الذين يشككون فى الاسلام ويهاجموة وما اكثرهم فى الغرب وقتها<br />واهتز ايمان الرجل الصعيدى الازهرى الاعمى نتيجة قراءاتة المنحرفة بتوجية زوجتة<br />وعاد من باريس بالدكتورة وبالفرنسية<br />وساعدوة حتى وصل الى عميد كلية الادب<br />وخرج علينا بكتاب<br />الادب الجاهلى وكلة طراش المستشرقين واحقاد الصليبيين على الاسلام وكلة تشكيك وكفر صريح فتصدى لة العلماء وقدموة الى المحكمة وحدثت معركة كبيرة فى مصر<br />ما يعنينى قولة<br />لماذا لا تكون تلك الزيجة للشيخ القرضاوى من امرأة دارسة للعلوم السياسية مخططة من جهة ما بهدف دفع تفكير الشيخ الى الانحراف وهو فى هذا الوضع الروحى فيكون تأثيرة المدوى بين اتباعة من الشباب<br />من يدرى ربما كانت تدفعة الى كتب كتاب عن حبة للصهيونية مثلا او كتاب لمهاجمة الاسلام كما فعل طة حسين<br />اظن ان الموضوع ليس بريئا ولا ساذجا<br />ابحثوا عن ثقافة تلك السيدة ومن تكون"
archived = "2010-03-14"
capture_url = ""

