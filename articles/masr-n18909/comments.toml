text = "دكتورة علوم سياسية ايه وبطيخ ايه وباذنجان ايه<br />دا الشيخ يوسف القرضاوي اتجوزها وهي لسه طالبة في الكلية وتعرف عليها وهي طالبة في ندوة عن الحجاب الاسلامي فشغب بها حبا وطلبها من والدها رفض في البداية لفارق السن لكن انت عارف بقا ان الدولار يكسب دايما والشيخ يوسف خليجي قطري مش مصري<br />وفيه مواقع على النت بتؤكد انها لم تأخذ الدكتوراه ولكنهم يقولون لها دكتورة مجاملة لانها مرات القرضاوي<br />سلام يا اخ مش شايف"
