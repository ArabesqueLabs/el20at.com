subject = "اذن فالشيخ وقع فى صبابة الحب  وكانت عينية زايغة وب"
author = "فهمت"
posted = "2008-12-24"
text = "انتم فاكرين اغنية ليلى نظمى - ماخدش العجوز انا<br />ولكن فعل الصبابة والهوى<br />ولعلة انشد لها<br />ان العيون التى فى طرفها حور------------------------- قتلننا ثم لا يحيينا قتلانا<br />او لعلى الشيخ غنى لها اغنية عبد الحليم حافظ على حزب وداد قلبى يابوى<br />كنت اظن ان الشيخ الحاصل على دولارات البترول سيبنى دارا لنشر الكتاب الاسلامى او دارا لرعاية الايتام او مركزا لعلوم القران ولكن الشيخ بحث بدولاراتة عن الصبايا الملاح وعاد الى زمن الجوارى والقيان وليالى الف ليلة وليلة ولعلة كان يخلع طاقم اسنانة ويضعة تحت المخدة وهو ينام بجوار الصبية<br />لماذا لم يتزوج عجوزا مثلة ترعاة ان كان فى حاجة الى الرعاية ؟<br />كنت فى دبى<br />وكان لى صديق سورى يحضر الى العمل متأخرا كل يوم فسالتة انت بتيجى متاخر لية يا صفوان كل يوم<br />قال لى - با اشترى اغراض بيت الشيخ فلان - والشيخ فلان عالم دين تعطية السعودية مرتب كداعية<br />ولما ابدى اعجابة المبهر بالشيخ لدرجة انة يذهب بسيارتة يوميا الى بيتة ليشترى لة من السوق كل احتياجات بيتة<br />وعرفت ان الشيخ السورى متزوج من اربعة نسوان<br />والمصيبة ان واحدة منهن شابة مصرية جامعية وهبت نفسها لة<br />وكنت لا ادرى معنى ان تهب امرأة نفسها<br />حتى فهمت انة زواج بدون مهر ولا تكلفة ولا اى حاجة خالص<br />قلت يا نهار اسود<br />هل هذا الشيخ الفحل يصلح للدعوة - اى دعوة<br />انة يتلقى المرتبات فقط من السعوديين ويقوم بعمل اللازم فى غرفة النوم ثم ينام مرهقا حتى اليوم التنالى<br />اين التقوى<br />اين العفاف<br />الدين اعطانا رخصة للزواج باكثر من واحدة بشروط قاسية جدا<br />ولكن"
