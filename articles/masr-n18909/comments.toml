subject = "ممكن لو سمحتوا نتعلم الأدب؟!"
author = "علي أمين"
posted = "2009-01-07"
text = "أشكرك يا أستاذ مصطفى على أسلوبك الجميل والمنطقي في الوقت نفسه<br />أغلب التعليقات حادة ولا تعرف أن التأدب مع العلماء مهما اختلفنا معهم هو من أخلاق المسلمين الراسخة فضلا عن كونه من المروءة وتمام الرجولة.<br />أغلب التعليقات لو عرضت على واحد متخصص في الاجتماع حللها هيطلعنا مجتمع مش متربي، والمصيبة أننا نرى هذا في فئة شبابية ومتعلمة في الأغلب، ولم يفيدها تعليمها في إدارة حوار كهذا حول رمز من رموزها..والذي لا يحترم رموزه لن يحترم نفسه ولن يحترمه أحد.<br />لا أقول بقدسية القرضاوي أو غيره ولكن أقول بالتأدب!!<br />فتعالوا معي نرى أسلوب الأستاذ المتنور الذي رمز لاسمه بـ(_) حين يبدأ تعليقه ((القرضاوى شيخ محدود التفكير وكل الكتب المذكورة عالية منقولة من كتب مشايخ السلف الصالح وهو فقط قد جمع ابوابها ولم يؤلف شيئا)) وأسأله هل قرأت كتب القرضاوي كلها حتى تعمم هذا التعميم الجائر الخايب الضحل وإن كنت أشك أنك لمست كتابا واحدا منها أو انك لا تقرأ ولا حتى الجرائد الصفراء لأنك لو فعلت لما بدأت تعليقك بياعم قرضاوي مين إلى آخر تعليقك.. لأنك ببساطة لو كنت قرأت كتب القرضاوي أو أي كتب إن شاالله كتب الوزارة لأثرت على لغتك وعبارتك وذوقك.<br />على فكرة أنا لا أهاجمك شخصيا.. أن مستاء من جيل رافض لكل شيء ساخط على كل شي فقد كل شيء حتى احترامه لنفسه أو لأي أحد حتى لعلمائه ومفكريه!!<br />يعنى بقينا شوارعيه ولا مؤاخذة<br />وعاوز تتأكد راجع أغلب التعليقات وستجدها ما بين السطحى الساذج الذي لا يلق بطالب الجامعة أو سيء الأدب.<br />تحياتي للجميع متمنيا لكم احترام الذات واحترام الآخرين أيا كانوا<br />شكرا"
archived = "2010-03-14"
