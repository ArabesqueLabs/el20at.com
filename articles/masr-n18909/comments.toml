posted = "2008-12-23"
text = "يا عم قرضاوى مين<br />كل الكتب دى عبارة عن نقل ابواب كاملة من كتب العلماء المسلمين وهو مجرد ان يقوم بتجميع ابوابها ووضع اسمة عليها<br />هو الشيخ فاضى<br />دى الرجل قلبة اخضر وعمال يحب فى النسوان وهو فى الثمانين<br />خلوة فى حالة<br />يكسب شوية فلوس من البترودولار ويكبر رصيدة فى بنك قطر الوطنى"
