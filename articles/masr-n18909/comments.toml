text = "علماء الدين والدعاه لما بيظهروا الناس بتفرح بيهم اوي<br />بس لما بيغتنوا الناس بتكرههم اوي<br />ونصيحة لكل علماء المسلمين<br />النبي محمد هو اللي علمنا الدين وكان بيصرف على الدين وكذلك ابو بكر وعمر وعلي والحسن والحسين وبقية الصحابة كلهم كانوا بيصرفوا من مالهم الخاص على الدين والدعوه الى الله<br />محدش فيهم استغل الدين في الثراء ولذلك انا لا اتبع الا علماء الدين الموظفين في الحكومات الاسلامية<br />اما علماء الدين والدعاه القطاع الخاص دول لازم يتعملهم (استوب) كفاية كده بقا<br />عيب لما يبقوا زي عادل امام ومحمد هنيدي<br />رحمة الله عليك يا فضيلة الشيخ كشك كنت داعية وعشت فقيرا ومت فقيرا<br />يا جماعة العلماء عيب لما الجرايد تفضحكم بهذه الطريقة بصوا شوفوا مكتوب ايه في مجلة اسمها (فوربس) العربية<br />،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،<br />وحسب المجلة التي تشتهر بنشر قوائم سنوية بأثرياء العالم، فقد بلغ الدخل الصافي لعمرو خالد العام الماضي 2.5 مليون دولار. وجاء في المرتبة الثانية الداعية الكويتي طارق سويدان بدخل صافٍ بلغ مليون دولار، ثم الداعية السعودي عائض القرني مؤلف الكتاب الشهير «لا تحزن» بدخل وصل إلى 533 ألف دولار. وحلّ في المرتبة الرابعة الداعية المصري عمر عبد الكافي المقيم في الإمارات بدخل صافٍ بلغ 373 ألف دولار، ثم الداعية السعودي سلمان العودة بـ267 ألف دولار.<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />عيب كده بأه ريحتكم فاحت<br />واذكر هنا موقف للدكتور يوسف القرضاوي واذكره بنية (وما اريد الا الاصلاح ما استطعت وما توفيقي الا بالله<br />الشيخ يوسف القرضاوي كان بيسجل حلقة اسبوعية في تلفويون ابو ظبي اسمها الشريعة والحياه<br />المفروض تلفزيوني ابوظبي هو اللي يروح عند يوسف القرضاوي علشان خاطر يسجل<br />لا دا يوسف القرضاوي كان بيروح ابوظبي يسجل يركب الطياره وينزل في الفنادق ويروح يسجل الحفله<br />وفي احد المرات نزل يوسف القرضاوي مطار ابوظبي كالمعتاد فوجد نفسه ممنوع من دخول الدولة<br />فهذه الواقعة هانة شديدة للعلم والعلماء اللي بيجروا ورا الفلوس<br />ـــــــــــــــــــــــــــــــــــــــــــ<br />الاية القرانية واضحة وصريحة<br />اتبعوا من لا يسألكم اجرا وهم مهتدون<br />سلام"
