subject = "الشيخ كشك خطيب وداعية والدكتور الاستاذ عبد الحليم"
author = "برضة لية"
posted = "2008-12-24"
text = "الشيخ كشك رحمة اللة كان داعية بيقول الحق فى وش التخين وكانوا بتوع امن الدولة بينتظروة يخلص خطبتة وياخدوة السجن<br />مش بينافق ولا بيجرى وراء منصب فى قصور الحكام ولا بيقف فى الصف خمس ساعات فى المطار علشان يسلم على سيادتة لما يهل من الطيارة<br />المنافقين اللى بيقفوا فى الصف علشان يسلموا على اولمرت ورابين وبيبقوا مزنوقين فى طرطرة شوية مية ومع ذلك بيقفوا علشان يطلعوا فى التليفزيون ويقولوا للحكام كلام نفاق زى ربنا يطول فى عمرك يا افندينا - انت ولى النعم - انت اللى فيهم والكل ركش ويطلع على المنبر يقول لنا اطيعوا اللة واطيعوا الرسول واولوا الامر منكم - ويركز قوى على اولى الامر منكم ولو الود ودة يقول لنا لا تطيعوا اللة ولا تطيعوا الرسول ولكن اطيعوا اولى الامر منكم والشيخ اكل خمسة كيلو كباب وخمسة كيلو كفتة على مائدة اولى الامر<br />احنا معندناش قدسية لرجل الدين ولا فية فى الاسلام رجل دين ولكن فية الامام الفقية وقاضى المسلمين<br />الشيخ كشك كان فى امس الحاجة الى اى قرش لان عندة ابن مصاب بشلل الاطفال وطاف بة الكرة الارضية بحثا عن علاج ومع ذلك لم ينافق حاكم ولا سلطان<br />والدكتور عبد الحليم محمود رحمة اللة من الشيوخ العظام والاممة الكبار<br />انما الطنطاوى والقرضاوى والمفتى وشوية الزلنطحية بتوع الهبر والفتة وادام اللة دولة مولانا سيادة الرئيس او سيادة الامير فالناس عرفاهم كويس وكويس جدا"
