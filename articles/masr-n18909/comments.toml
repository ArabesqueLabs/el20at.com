[[comments]]
order = 20
subject = "صة أهولة و أختها أهوليبة. في حزقيال ( 23 : 22 ) يق"
posted = "2008-12-25"
text = "صة أهولة و أختها أهوليبة. في حزقيال ( 23 : 22 ) يقول :<br />أرسل هذا التعليق بواسطة :<br />قصة أهولة و أختها أهوليبة. في حزقيال ( 23 : 22 ) يقول :<br />يا ابن آدم :<br />كان هناك امرأتان ابنتا أم واحدة وزنتا بمصر في صباهما ،<br />هناك دغدغت ثدييهما ،<br />وهناك تزعزعت ترائب عذريتهما.<br />واسمهما اهولة الكبيرة وأهوليبا أختها.<br />وزنت أهولة من تحتي ولم تترك زناها من مصر أيضًا لأنهم ضاجعوها في صباها.<br />وزعزعوا ترائب عذريتها وسكبوا عليها زناهم.<br />لذلك سلمتها ليد عشاقها الذين عشقتهم.<br />هم كشفوا عورتها.<br />فلمّا رأت أختها أهوليبة ذلك أفسدت في عشقها أكثر منها وفي زناها أكثر من زنا أختها.<br />عشقت بني أشور فرسانَا راكبين الخيل كلّهم شبّان شهوة.<br />وزادت زناها.<br />ولمّا نظرت إلى رجال مصورين على الحائط عشقتهم عند لمح عينيها إياهم.<br />وأرسلت إليهم رسلاً فأتاها بنو بابل في مضجع الحبّ ونجّسوها بزناهم...<br />وأكثرت زناها بذكرها أيّام صِبَاها الّتي فيها زنت بأرض مصر.<br />وعشقت معشوقيهم الذين لحمهم كلحم الحمير ومنيهم كمني الخيل.<br />وافتقدتِ رذيلة صباكِ بزغزغة المصريين ترائبك لأجل ثدي صباكِ.<br />الله هو من يعاقبهم فيوقعهم في الزّنا :<br />حزقيال ( 23 : 22 ) لأجل ذلك يا أهوليبة ،<br />قال السّيّد الرّب :<br />ها أنذا أهيج عليك عشاقك ،<br />ينزعون عنك ثيابك...<br />ويتركونك عريانة وعارية ،<br />فتنكشف عورة زناك ورذيلتك .<br />تمتلئين سكرًا وحزنًا كأس التّحيّر والخراب...<br />فتشربينها وتمتصّينها وتقضمين شقفها.<br />وتجتثّين ثدييك لأنّي تكلّمتُ.<br />فهوذا جاءوا.<br />هم الذين لأجلهم استحممتِ.<br />وكحّلتِ عينيك وتحلّيت بالحليّ.<br />وجلستِ على سرير فاخر...<br />فقلت عن البالية في الزّنا الآن يزنون زنًا معها.<br />(عامو 7: 16) وقال الرّبّ لمصيا: أنت تقول لا تتنبّأ على إسرائيل. لذلك قال الرّبّ: امرأتك تزني في المدينة وبنوك وبناتك يسقطون بالسّيف.<br />أبلغ عن هذا التعليق<br />لماذا لانرمي هذه الكتب ياقداسة البابا ونحتكم للقرآن<br />أرسل هذا التعليق بواسطة :<br />لماذا لانرمي هذه الكتب ياقداسة البابا ونحتكم للقرآن<br />http://popekirillos.net/ar/books/pernaba/5.gif<br />[align=right]<br />المسيحيين لايعترفون بإنجيل برنابا لأنه يتكلم وبكل وضوح عن نبوة الرسول الكريم محمد . ونحن كذلك لانؤمن به لأن الله أبدلنا خير منه<br />وهو القرآن الكريم بالإضافه لوجود الكثير من التحريفات والتغييرات . قداسة البابا يرفض إنجيل برنابا ويحاول في هذه المره أن يبرر<br />السبب الرئيسي لرفض هذا الإنجيل . يقول قداسة البابا كلام مهم جـــــــــــــــــــداً<br />يقول قداسة البابا :- أو ماكان يمكن أن استخدام لفظة أخرى غير البراز ؟وهل هذا يمكن اسلوب يقوله المسيح ؟ لو أخذنا كلام البابا وجعلناه مقياس<br />على الكتاب المقدس لحذفنا الكتاب المقدس بالكامل.فأين قداسة البابا عن النصوص التي في حزقيال وفي سفر نشيد الإنشاد !!<br />فخذ على سبيل المثال هذه النصوص<br />(ترجمة الفانديك:حزقيال:4:12)<br />وتأكل كعكا من الشعير. على الخرء الذي يخرج من الإنسان تخبزه أمام عيونهم<br />(الترجمة العربية المشتركة:حزقيال:4:12)<br />وكل طعامك رغيفا من الشعير مخبوزا على نار من زبل الإنسان أمام عيونهم<br />ألا يمكن إستخدام لفظة أخرى غير ( الخرء و الزبل )وهل يمكن أن يكون هذا أسلوب يقوله المسيح ياقداسة البابا ؟ أليس البراز<br />هو نفسه الخرء ؟<br />فلو برنابا قال خرء بدلاً من براز هل يصبح إنجيله مقدس ؟ اليس المفروض وحسب مقياسك يجب<br />أن نرمي بحزقيال ونشيد الإنشاد وغيرها عرض الحائط لأنها تحتوي على كلمات غير لائقه وبذئه؟"
archived = "2010-03-14"
