[[comments]]
order = 1
subject = "شلالات نياجرا او شلالات فياجرا"
author = "سى عادل"
posted = "2008-12-22"
text = "صحيا زواج الرجل بعد الستين مشكوك فية - فاى شيخ او رجل بعد الستين تضعف لدية الرغبة الجنسية وتنتابة الام المفاصل والاطراف وضعف الاعصاب وبالتالى ضعف الانتصاب ولا يصلح للمعاشرة الجنسية الا نادرا وبمجهود ىكبير جدا ويكون الشكل العام مقززا ومن المفروض ان يحترم الانسان سنة ووضعة<br />ورايى ان زواج منفعة او مصلحة فلا يوجد تكافؤ لا فى السن ولا الوضع الاجتماعى ولا النواحى العلمية<br />وهذا الزواج محكوم علية بالفشل<br />الا اذا كانت واحدة من الناس وهبت نفسها لتعمل خادمة عند شخص اخر وترعاة صحيا وتدادية وتدخلة الحمام وخصوصا وان الشيخ تعدى الثمانين<br />الا انة احيانا تفعل الفياجرا فعلها فيظن العجوز انة شابا<br />وقديما فى الحكم العربية قالوا<br />نهاية الشيخ ومقتلة فى اثنتين جارية شابة جميلة يتزوجها وجارية حاذقة فى الطبخ تطبخ لة لذيذ الطعام"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223152253/http://masr.20at.com:80/newArticle.php?sid=18909"

[[comments]]
order = 2
subject = "هل الشيخ القرضاوى من الشيوخ المصلحين ؟ ام شيخ كلاس"
author = "hf, ik]"
posted = "2008-12-22"
text = "هل القرضاوى شيخ بحجم شيخ مصلح زى الشيخ محمد الغزالى او الشيخ الشعراوى ؟ اظن لا<br />فالرجل شيخ عادى وليس موهوب فى الدعوة ولا لة جاذبية فى محاضراتة - بل ان سيدة فاضلة مثل الشيخة سعاداو السيدة عبلة الكحلاوى لها قدرة على اجتذاب الناس والتاثير فيهم وهدايتهم<br />كل ما عند القرضاوى كلام كلاسيكى عادى اتقال قبلة الف مرة<br />ولكن كون لجوءة الى دولة خليجية جعلتة يظهر فى الشاشات والندوات<br />فزواجة من واحدة فى هذة السن شرعيا مباح ولا خلاف علية ولكن يا مولانا لية قلة القيمة - هل خفت على نفسك وانت فى الثمانين من العمر خفت على نفسك من الفتنة"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223152253/http://masr.20at.com:80/newArticle.php?sid=18909"

[[comments]]
order = 3
subject = "الدكتور يوسف القرضاوي ليس بافضل من النبي محمد صلى"
author = "مش ضروري"
posted = "2008-12-22"
text = "من مفاتيح الاساءة للنبي محمد صلى الله عليه وسلم زوجاته بصفة خاصة وتعامله مع النساء بصفة عامه وعرفنا ذلك من مواقع النت المتخصصة في الاساءة للنبي محمد صلى الله عليه وسلم<br />وعلى ما يبدو ان اعطاء الدكتور القرضاوي سيتخدون من زواجه وطلاقه ذريعة للاساءة اليه<br />معلش يا دكتور يوسف فانت لست افضل من النبي محمد صلى الله عليه وسلم"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223152253/http://masr.20at.com:80/newArticle.php?sid=18909"

[[comments]]
order = 4
subject = "رد على هل الشيخ القرضاوى من الشيوخ المصلحين ؟"
author = "مش لازم"
posted = "2008-12-22"
text = "انت بتقول في العنوان هل الشيخ القرضاوي<br />ما اسموش الشيخ القرضاوي دا اسمه استاذ دكتور يوسف القرضاوي يا جاهل<br />استاذ دكتور في الشريعة الاسلامية<br />وبعدين في التعليق بتقول هل القرضاوى شيخ بحجم شيخ مصلح زى الشيخ محمد الغزالى او الشيخ الشعراوى ؟<br />لمعلومات حضرتك استاذ دكتور يوسف القرضاوي لا احد يضاهيه في العلم الذي نبغ فيه وهو الفقه والشريعة الاسلامية<br />علاوة على انه داعية اسلامي عالمي معروف على مستوى العالم<br />حتى رئيس جامعة الازهر انا شفته على القناة الفضائية المصرية استشهد بفتوى للدكتور يوسف القرضاوي<br />والدكتور يوسف القرضاوي عمل قي قطر كأي استاذ جامعة معار لاي دولة عربية ووصل الى منصب عميد كلية الشريعة في قطر واستغل وجوده في الخليج ليجوب العالم شرقا وغربا للدعوة الى الله سبحانه وتعالى واثرى المكتبة الاسلامية بالعديد من المؤلفات المفيدة<br />شوفوا الخيبة اللي انتوا فيها الاول ما لكوش دعوة بالقرضاوي"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223152253/http://masr.20at.com:80/newArticle.php?sid=18909"

[[comments]]
order = 5
subject = "مؤلفات الدكتور يوسف القرضاوي"
author = "مش شريف الدواخلي ولاالبراء اشر"
posted = "2008-12-22"
text = "كتب الشيخ يوسف القرضاوي<br />• فقه الزكاة<br />• المدخل لدراسة الشريعة الإسلامية • المدخل لدراسة السنة النبوية • مدخل لمعرفة الإسلام • الحلال والحرام في الإسلام • العبادة في الإسلام • تيسير الفقه للمسلم المعاصر • لكي تنجح مؤسسة الزكاة في التطبيق المعاصر • دور القيم والأخلاق في الاقتصاد الإسلامي • فوائد البنوك هي الربا الحرام • بيع المرابحة للآمر الشراء كما تجريه المصارف • تيسير فقه الصيام • فتاوى معاصرة بأجزائه الثلاثة • السنة والبدعة • الضوابط الشرعية لبناء المساجد • ظاهرة الغلو في التكفير • التوبة إلى الله • التوكل • كيف نتعامل مع القرآن العظيم • الصبر في القرآن • وجود الله • حقيقة التوحيد • النية والإخلاص • موقف الإسلام العقدي من كفر اليهود والنصارى • جريمة الردة وعقوبة المرتد • الحل الإسلامي فريضة وضرورة • الحلول المستوردة • أولويات الحركة الإسلامية في المرحلة القادمة • لماذا الإسلام • شريعة الإسلام صالحة للتطبيق في كل زمان ومكان • المبشرات بانتصار الإسلام • بينات الحل الإسلامي وشبهات العلمانيين والمتغربين • واجب الشباب المسلم • جيل النصر المنشود • شمول الإسلام • الأمة الإسلامية حقيقة لا وهم • الإسلام والعلمانية وجهاً لوجه • الأقليات الدينية والحل الإسلامي • غير المسلمين في المجتمع الإسلامي • الصحوة الإسلامية بين الاختلاف المشروع والتفرق المذموم • الصحوة الإسلامية وهموم الوطن العربي والإسلامي • الصحوة الإسلامية بين الجحود والتطرف • الصحوة الإسلامية بين الآمال والمحاذير • الإسلام الذي ندعو إليه • الخصائص العامة للإسلام • ملامح المجتمع المسلم الذي ننشده • الفقه الإسلامي بين الأصالة والتجديد • الفتوى بين الانضباط والتسيب • السياسة الشرعية في ضوء النصوص الشرعية • عوامل السعة والمرونة في الشريعة الإسلامية • في فقه الأولويات دراسة جديدة في ضوء القرآن والسنة • حول قضايا الإسلام والعصر • ثقافة الداعية • لقاءات.. ومحاورات حول قضايا الإسلام والعصر • نساء مؤمنات • مسلمة الغد • مركز المرأة في الحياة الإسلامية • فتاوى المرأة المسلمة • النقاب للمرأة بين القول ببدعيته والقول بوجوبه • الإخوان المسلمون سبعون عاما في الدعوة والتربية والجهاد • التربية الإسلامية ومدرسة حسن البنا • الشيخ الغزالي كما عرفته • الإمام الغزالي بين مادحيه وناقديه • التربية عند الإمام الشاطبي • الدين في عصر العلم • العقل والعلم • الرسول والعلم • موقف الإسلام من الإلهام والكشف والرؤى والتمائم والكهانة والرقي • الإسلام والفن • الإسلام .. حضارة الغد • مشكلة الفقر وكيف عالجها الإسلام • الإيمان والحياة • الحياة الربانية والعلم • خطب الشيخ القرضاوي • أين الخلل • الوقت في حياة المسلم • عالم وطاغية • الثقافة العربية الإسلامية بين الأصالة والمعاصرة • درس النكبة الثانية • مستقبل الأصولية الإسلامية • الناس والحق • رسالة الأزهر • قيمة الإنسان وغاية وجوده في الإسلام • القدس قضية كل مسلم • الاجتهاد في الشريعة الاسلامية • الحكم الشرعي في ختان الإناث • البابا والإسلام • فقه اللهو والترويح • نحن والغرب • مع أئمة التجديد ورؤاهم في الفكر والإصلاح التربية السياسية عند الإمام حسن البنا • الدين والسياسة • تاريخنا المفترى عليه • الشيخ أبو الحسن الندوي كما عرفته • الفتوى بين الإنضباط والتسيب • من أجل صحوة راشدة تجدد الدين وتنهض بالدنيا • من فقه الدولة في الاسلام • خطابنا الإسلامي في عصر العولمة • رعاية البيئة في شريعة الإسلام • دور الزكاة في علاج المشكلات الاقتصادية وشروط نجاحها • في فقه الأقليات المسلمة"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223152253/http://masr.20at.com:80/newArticle.php?sid=18909"

