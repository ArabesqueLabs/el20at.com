subject = "مواقف العلماء من الشيخ القرضاوي الى الشيخ عبدالحمي"
author = "مش زعلان"
posted = "2008-12-24"
text = "الشيخ القرضاوي جاءته الفرصة الحلال ليتزوج بنت صغيرة ولم يستطيع المقاومة وفتح على نفسه ومركزه القيل والقتال<br />اريد هنا ان اتذكر موقف للشيخ عبدالحميد كشك رحمه الله رحمة واسعة<br />الشيخ عبدالحميد كشك كان رجل فقير لا يمتلك الا راتبه وكان يعمل امام وخطيب مسجد في منشية الصدر وكان شيخ ذائع الصيف كما تعلمون<br />فعرض عليه امير كويتي ان يعمل لديه في مسجده بالكويت براتب شهري 2000 دينار كويتي والكلام دا كان في اوائل السبعينيات<br />الدينار الكويتي كان ب 10 جنيه مصري يعني 2000 دينار كويتي يعني 20 الف جنيه مصري في السبعينيات<br />20 الف جنيه مصري في الشهر فرفض الشيخ كشك مع انه حلال ميه في الميه لكنه رفض الحلال<br />لانه كان يعلم انه لو قبل هذا الحلال سيسيئ الى نفسه والى دعوته والناس حتقول ان الشيخ كشك جري ورا الفلوس<br />فرفض الشيخ كشك الحلال من اجل القيم والاخلاق والمبادىء والمثل العليا<br />وكنت اتمخنى من الشيخ القرضاوي ان يرفض هذا الزواج الحلال"
