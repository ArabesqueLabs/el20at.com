author = "مش كاتب"
posted = "2008-12-24"
text = "وهذا نص الحلقة (33) من مذكرات يوسف القرضاوي:<br />كانت ليلة حافلة جياشة بالعواطف والمواقف. وقد ودعتني الطالبات بمثل ما استقبلنني به من المودة والابتهاج، وكان في وداعي عدد منهن صحبنني إلى الباب، وقد استرعى انتباهي إحداهن، وزميلاتها ينادينها باسمها: أسماء. فقلت لها: هل أنت أسماء صاحبة الكلمة على المنصة؟ قالت نعم: أنا هي. فلما نظرت إليها عن قرب قلت: سبحان الله! لقد جمع الله لك يا أسماء بين الجمال الحسي، والجمال الأدبي، أعطاك الله الذكاء والبيان، وحضور الشخصية، والجمال والقوام. بارك الله لك يا ابنتي فيما منحك من مواهب، وبارك لك في فصاحتك، وبارك لك في شجاعتك، وبارك لك في ثقافتك. لقد أثلجت صدورنا بردك القوي البليغ.<br />فقالت: لعل كلمتي حازت رضاك يا أستاذ!<br />قلت: أكثـر من الرضا، ولست وحدي، ولكن كل المدعوين من العلماء والدعاة عبروا عن رضاهم وإعجابهم. زادك الله توفيقا.<br />قالت: ما أنا إلا تلميذة من تلميذاتك وتلامذتك الكثيرين هنا، لقد تتلمذنا على كتبك من بعيد، ونتتلمذ عليك اليوم مباشرة من قريب. وقد رأيت وسمعت كيف يحبك الجميع.<br />قلت: إذا كان تلاميذي على هذه الدرجة من نضج التفكير، وبلاغة التعبير، فقد يغرّني هذا كأستاذ!<br />قالت: كتبك العلمية والفكرية ساعدتنا على أن نستكمل ثقافتنا الإسلامية، وأسلوبك الأدبي والشعري ساعدنا على أن نقوِّم تعبيرنا العربي، وقد كنا نتدارس كتبك في حلقاتنا التربوية.<br />قلت: وهل عرفتم شيئا عن شعري؟<br />قالت: نحفظ نشيد (مسلمون) وكنا نتغنى به في لقاءاتنا الإسلامية، وننشده بصورة جماعية، فيثير فينا الحماس والاعتزاز.<br />كما نحفظ بعض الأبيات من قصيدتك (النونية).<br />قلت: في أي الكليات تدرسين؟ وفي أي التخصصات؟<br />قالت: في كلية العلوم والتكنولوجيا، وفي قسم الرياضيات.<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />قال دكتوراه في العلوم السياسية قال<br />ها ها ها ها ها ها ها ها ها ها ها هعا"
archived = "2010-03-14"
