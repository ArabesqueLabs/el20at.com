subject = ""
author = "مش مهم"
posted = "2009-05-27"
text = "يا من تدافعون عن الحريات وأسميتم النقابة قلعة الحريات كيف تسلبون شباب الصحفييون حقهم بالله عليكم أنا لي أصدقاء صحفيين ومرتباتهم لا تتجاوز الـ 200 جنيه من جرائدهم في حين أن كبار الكتاب الذين تريدون أن تميزوهم يقبضون رواتب بالآلاف والصحفي الشاب مطالب بأن ينفق من هذا المبلغ تليفونات للمصادر ومواصلات بالإضافة إلي نفقاته الشخصية أليس هذا تصريص واضح لهم وفتح للضوء الأخضر لكي يخالفوا شرف المهنة في مقابل حق الحياة الكريمة التي تود يا نقيب الصحفيين سلبهم إياها .. أريد أن أخبرك أن العقد الموحد الذي طالبت النقابة بتطبيقه يطبق فقط علي الورق ولا ينفذ .. أرجو أن تنزل من برجك العاجي لتعايش مأساة أصدقائي وغيرهم كثيرون"
archived = "2010-03-14"
