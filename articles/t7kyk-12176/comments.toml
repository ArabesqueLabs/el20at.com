author = "تامر نصار"
posted = "2009-05-27"
text = "والله الأخ مكرم محمد أحمد نعملش حاجه للنقابة غير الـ 200 جنيه اللي النقابيين انتخبوه نقيب ليهم علشانهم وعشان كده مكرم بيرد الجميل الجميل لكن في شباب الصحفيين اللي بيشيلوا ظلط في جرائدهم كي لا يساويهم بالسادة المشتغلين الذين لا يهتمون بالبدل من عدمه لأنه تحصيل حاصل بالنسبة لكم فبالله عليك يا معالي النقيب ألا تقرأ الجرائد وتري أن من يقوم بالسود الأعظم من المادة المنشورة هم شباب الصحفيين الذين تريد أن تسلبهم حقهم المشروع في الحصول علي بدل التدريب والتكنولوجيا"
