text = "هو النقيب مبينزلش يشوف الأسعار ولا إيه ولا ميعرفش أن الصحفيين الشباب بيتمرمطوا في كل الجرائد سواء كانت قومية أو خاصة أو حزبية<br />أنا أشتغلت لمدة سنة في جرنال الجمهورية وبشتغل وشغلي بينزل بأسم غيري ومفيش مرتب كنت باخده ومكنش تدريب لأن الأستاذ الفاضل رئيس القسم هو اللي طلب مني أتعاون معاه مش أنا اللي عرضت نفسي عليه<br />سيبوا الشباب في حالهم مش هتبقوا أنتوا والحكومة"
