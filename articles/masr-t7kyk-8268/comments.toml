[[comments]]
order = 0
subject = "قل انما انا بشر مثلكم"
author = "معقول برضة"
posted = "2008-02-20"
text = "استمعوا الية صلى اللة علية وسلم<br />انما انا ابن امرأة من قريش تأكل القديد<br />لم يقل انة ابن اللة - ولا الجالس على ملكوت العرش بجانب ابية الذى فى السماء - بل قال<br />انما انا رسول اللة اليكم ابلغكم رسالاتى<br />فكان يأكل الطعام ويمشى فى الاسواق ويتزوج النساء كما الناس فى عصرةوعندما مات غسل وكفن ودفن فى مكان معلوم للناس<br />ديننا ليس غيبيات واساطير كالنصارى"
archived = "2010-03-14"
