[[comments]]
order = 1
subject = "بدون تعليق"
author = "أخ"
posted = "2008-02-24"
text = "يا أخي((معقول برضه)) مال الموضوع بالنصارى وان كان ديننا في رأيك فيه غيبيات فهو لنا وجزائنا من عند ربنا مش من عندك يا أخيوهل تستطيع أن تنكر أنك تؤمن بالله وأنت لم تراه ....؟؟؟؟؟؟<br />ان كنت لا ترضى بما نؤمن به فلك مطلق الحريه ولكن ان تهكمت علينا فانك تفعل ما لا يرضيك أن يفعل بك الآخرون<br />وهنا أذكرك بقول الشاعر : لآ تنهي عن فعل وتأتي مثله عار عليك ان فعلت عظيم<br />السلام والمحبه معك ومع الجميع"
archived = "2010-03-14"
