subject = "ماء النيل راح فين"
author = "حنتيرة"
posted = "2007-12-01"
text = "اسعار المياة دى مبالغ فيها جدا - وهى طريقة لتجمع بها الدولة اتاوات من الناس وضريبة غير مباشرة لتصرف منها على جحافل الامن المركزى المخصص لحماية النظام<br />وللعلم جميع السياح يتلقون رسائل من بلادهم بعدم الشرب من مياة الحنفيات فى مصر لانها غير صالحة للاستخدام الادامى<br />فبها نسبة يوريا عالية جدا بالاضافة الى الكلور الذى اوقف استخدامة عالميا ومن مشاكلة الفشل الكلوى والسرطان"
archived = "2007-12-04"
