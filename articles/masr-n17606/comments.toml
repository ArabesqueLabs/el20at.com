subject = "بأى حق يعتصمون ؟ هى كانت بلد ابوهم"
author = "برضة لا"
posted = "2008-09-16"
text = "الناس دى بأى حق يعتصمون ؟ مش وجودهم هو سبب تلوث القاهرة<br />المفروض يبعتوا طيارات رش المبيدات وتطهر المنطقة منهم<br />اية القرف دة<br />دول بيتكاثروا زى الارانب وقال عايزين شقق - منين يا روح امك انت وهو"
