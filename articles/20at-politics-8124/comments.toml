[[comments]]
order = 4
subject = "قناة الناس الأولي في مصر وليبيا؟"
author = "اكتب اسمك هنا"
posted = "2008-01-28"
text = "قرأت اليوم ما نصه بإحدى الصحف : \"قناة الناس أهدت كثير من الناس في ليبيا يلاحظ العديد من سكان ليبيا التهافث الشديد للمواطنين على قناة الناس،مما أحدث تغيرا هاما في سلوكيات وأعمال الشعب الليبي، وقد أصبح أهل ليبيا من خلال قناة الناس يلتزمون بشعائر الإسلام ،حيث آزداد عدد المحجبات في الكليات والشوارع ومن تترك القليل من شعرها بارز، ينظر إليها من كل الناس،فيتملكها الحياء وتغطي شعرها\"<br />وفي مصر لاحظت مدى التجاوب خصوصا في الأوساط الشعبية لقناة الناس حيث تعتبر القناة الأولى مشاهدة بين الفضائيات الدينية المنتشرة في عالمنا العربي.<br />القناة على النايل سات<br />تردد 11919<br />باستقطاب افقى - معدل الترميز 27500<br />ولا أعلم هل القناة في بلدك لها نفس الصدى ؟؟ ولماذا في رأيك هذا الانتشار للقناة ؟"
archived = "2010-03-14"
capture_url = ""

