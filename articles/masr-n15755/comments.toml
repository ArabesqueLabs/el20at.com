[[comments]]
order = 0
subject = "وما هو رأيكم ادام اللة فضلكم فى المرأة المحجبة وال"
author = "مواطن"
posted = "2008-05-12"
text = "اية الغريب فى الموضوع<br />هى الحشمة وحشة<br />والا عايزين البنات يركبوا الموتسيكلات بالمايوة<br />اية الاراء الغريبة دى<br />زى ما العامل بيلبس عفريتة او افرول فى المصنع ومحدش بينتقدة<br />وزى الراقصات فى الملاهى الليلية بيعروا اجزاء تجذب السكارى<br />برضة النساء والفتيات احرار كل واحد يلبس اللى هو عايزة"
archived = "2008-05-13"
capture_url = "https://web.archive.org/web/20080513181333/http://masr.20at.com:80/newArticle.php?sid=15755"

[[comments]]
order = 1
subject = "هوه فيه إيه؟"
author = "حسين"
posted = "2008-05-12"
text = "سلام عليكم... بدايةً أنا أعرف الست دى نفسها , و الصوره دى تقريباً فى شارع الهرم , و الست دى مصابه بإعاقه فى رجلها , و عندها أولاد بتربيهم , فبدل ما تشحت , اشترت الفزبه (فزبه مش موتوسيكل على فكره) علشان تقدر تروح بيه أماكن شغلها, فيعنى كتر ألف خيرها انها ماستغلتش الإعاقه اللى عندها فى الشحاته , و اشتغلت بكرامتها ... لكن بجد .. الفاضى يعمل قاضى"
archived = "2008-05-13"
capture_url = "https://web.archive.org/web/20080513181333/http://masr.20at.com:80/newArticle.php?sid=15755"

[[comments]]
order = 2
subject = "heliopiles"
author = "mohamed"
posted = "2008-05-13"
text = "من الواضح في الصورة ان السيدة معاقة و من الواضح انها تحمل اكياس او ما شابه فهي تجنبت ذل التكسيات و غتاته الاتوبيسات و لكنها للاسف لم تتمكن من تفادي الكاميرا العبقريه اهتموا بمعاجة العيوب و ليس التهكم على خلق الله المكافحين و اسأل الله العافية و احذر ان يعافيها الله و يبتليك"
archived = "2008-05-13"
capture_url = "https://web.archive.org/web/20080513181333/http://masr.20at.com:80/newArticle.php?sid=15755"

