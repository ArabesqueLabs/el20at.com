[[comments]]
order = 5
subject = "خيبة الله عليكى"
author = "بنت مسلمه"
posted = "2008-05-17"
text = "ده الثلاث عجلات بيقولوا للاعمى ان هذه السيده مصابه باعاقه ما؟؟؟ ولا انتم عمركم شوفتوا حد سليم بيسوق فزبه بتلات عجلات !!! ونفسى اعرف اعتراض الست دعاء على ايه بالضبط ؟ على الفزبه ام ثلاث عجلات ولا على النقاب الاسلامى؟؟ صح قول القائل (اذا اتتك مذمتى من ناقص-------- فتلك شهادة باننى كامل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "حسبنا الله ونعم الوكيل"
author = "محمود"
posted = "2008-05-18"
text = "دى ناس معندهاش دم خالص يعنى ايه القصد من هذه الصورة الست حتى لو مش معاقه على الاقل بتحافظ على نفسها من الاتوبيسات وبيعدين دا مافيش ولا واحد جه فى صفك<br />والحمد لله الناس بدات تفهم وكانت متعاطفه مع الست وربنا يسعادها على الى هى فيه<br />وبتلى الى صور الصوره بالاعاقه ونشوف هيعمل ايه"
archived = "2010-03-14"
capture_url = ""

