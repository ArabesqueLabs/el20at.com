subject = "انتي فيكي حاجة غلط يادعاء .."
author = "مش فاهم !!"
posted = "2008-05-13"
text = "ايه الاعاقة اللي انتي فيها دي يادعاء !!!<br />مش فاهم ايه الغريب في الموضوع !!!<br />مش احسن من غيرها اللي بتركب ورا البوي فريند بتاعها علي الموتوسيكل حاضناه ونص ضهرها عريان!!<br />بجد انتي فيكي حاجة غلط !!!"
