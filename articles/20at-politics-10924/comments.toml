subject = "حسبنا الله ونعم الوكيل"
author = "محتسب"
posted = "2009-01-21"
text = "دم هؤلاء الاطفال وكل الشهداء في رقبة كل خاين عميل باع نفسه واهله ووطنه وقضيته ويلهث خلف السراب يسب المقاومة ويطالب بالخنوع والاستسلام<br />ولكن طالما ظل الشرفاء المجاهدون الاوفياء سنأخذ ثأر كل شهيد بل كل قطرة دم زكية سالت على ترابنا الغالي وليس ذلك في غزة وحدها بل كل فلسطين من النهر الى البحر فأبشروا فالنصر الكبير آت لامحالة ذلك موعود الله ونهنئ ام البنات بشهادة بناتها وقد سبقوها إلى الجنةفهنيئا لها ولكل الشهداء واهليهم"
archived = "2010-03-14"
