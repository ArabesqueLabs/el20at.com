subject = "صرح مصدر بالداخلية"
author = "نكد"
text = "تم القاء القبض على مصرى مبتسم والشبهات تدور حول دوافع ابتسامتة ومصدر امنى يقول ان الابتسامة مدفوعة من جهات خارجية"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 23
subject = "كل سنه وانت طيب يا ريس"
text = "كل سنه وانت طيب يا ريس<br />كل سنه وانت طويل واحنا قصيرين<br />كل سنه وانت تخين واحنا رفيعين<br />كل سنه وانت مبسوط واحنا زعلانين<br />كل سنه وانت كبير واحنا صغيرين<br />كل سنه وانت سليم واحنا عيانين<br />كل سنه وانت شبعان واحنا جعانين<br />كل سنه وانت مكسي واحنا عريانين<br />كل سنه وانت فاهم واحنا مش فاهمين<br />كل سنه وانت نايم واحنا صاحيين<br />كل سنه وانت ضارب واحنا مضروبين<br />كل سنه وانت طالع واحنا نازلين<br />كل سنه وانت فاكر واحنا مش فاكرين<br />كل سنه وانت هادي واحنا مش هاديين<br />كل سنه وانت غني واحنا مأشفطين<br />كل سنه وانت كبير واحنا صغيرين<br />كل سنه وانت فالح واحنا مش فالحين<br />كل سنه وانت سيد واحنا خدامين<br />كل سنه وانت داهس واحنا مدهوسين<br />كل سنه وانت ساكن واحنا مش ساكنين<br />كل سنه وانت متدلع واحنا مش متدلعين<br />كل سنه وانت متجوز واحنا مش متجوزين<br />كل سنه وانت شغال واحنا عاطلين<br />كل سنه وانت لابس جذمه واحنا حافيين<br />كل سنه وانت مبسوط واحنا مبوزين<br />كل سنه وانت بتضحك واحنا معيطين<br />كل سنه وانت هايص واحنا لا يصين<br />كل سنه وانت عايم واحنا غرقانين<br />كل سنه وانت مفتح واحنا مغمضين<br />انت فاكرنا يا ريس<br />مسكين حتفتكر مين ولا مين ولا مين"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 24
subject = "على ابواب عام جديد تبدو حياتى سطر و طريقى كلمه و لكن اين المعنى؟"
author = "نيفين نيفى نوفا"
text = "المعنى فى بطن الشاعر و الشاعر من شعر و الشعر هو كلامك يا استاذ طحاوى<br />صحيح عشرينات متبقاش عشرينات من غير الطحاوى بس ده ميمنعش اننا نقرا اسمك على صفحات الجرائد<br />هقوال ايه!!!<br />اكيد اكتر من رائع"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

