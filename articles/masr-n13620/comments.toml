[[comments]]
order = 8
subject = "الى هاني صلاح الدين (ملعون ابو الغباء اللي بيقفل الصحف)"
text = "يا اخ صلاح الدين الغباء هو اللي قفل صحيفة افاق عربية مش القهر<br />افاق عربية فكرها اخوان مسلمين<br />والاخوان اضاعوا الممكن في سبيل المستحيل<br />المستحيل هو ان تقيم دولة اسلامية في ظل الظروف الحالية (قل اللهم مالك الملك تؤتي الملك من تشاء)<br />لكن الممكن هو الدعوة الاسلامية واصلاح الناس قدر المستطاع (وما اريد الا الاصلاح ما استطعت وما توفيقي الا بالله)<br />الاخوان اضاعوا الممكن من اجل المستحيل<br />يعني كان ممكن افاق تستمر وتعلم الناس الدين بالحكمة والموعظة الحسنة<br />لان الله القاعدة الاساسية للاخوان ان الحاكم فرعون والجيش جيش فرعون ووزير الداخلية هامان الى اخر الفلم<br />هذا رأيي ورأي علماء اهل السنة والجماعة الكبار ومعذرة لعدم كتابة اسمي"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

