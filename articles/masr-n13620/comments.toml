[[comments]]
order = 15
subject = "الطحاوى والزعبلاوى - فلاح كفر الهنادوة"
author = "برضة انا"
text = "انا مش شايف صحافة - ولا حتى صحافة مدرسية - دى حتة منتدى بيجيب مواضيع من بقية الصحف - واحيانا مقالات لبعض الهواة - ومش معروف هويتكم اية ؟ انتم اخوان - والا شيوعيون - والا مباحث امن دولة<br />ومقالنكم متواضعة جدا وكلها اخطاء ومفيش تحقيق صحفى كامل ولا عندكم صور وعاملين زى فلاح كفر الهنادوة اللى دايما يتكلم على لسان الواد ابن ابوسويلم ابو لسان زفر<br />نصيحة يا اخ طحاوى - ابقوا اكتبوا عن الطبيخ - ورضاعة الاطفال - وغسيل الكوافيل<br />يمكن ربنا ينفخ فى صورتكم"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 16
subject = "وقد نقل ابن عبد البر عن أيوب ابن القَرْيَة قال: «أحق الناس بالإجلال ثلاثة:"
author = "مش ضروري"
text = "وقد نقل ابن عبد البر عن أيوب ابن القَرْيَة قال: «أحق الناس بالإجلال ثلاثة:<br />العلماء والإخوان والسلطان، فمن استخفّ بالعلماء أفسد مروءته، ومن استخفّ<br />بالسلطان أفسد دنياه، والعاقل لا يستخفّ بأحد»."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 17
subject = "الى الاستاذ برضه انا"
text = "وتاعب نفسك ليه ومزعل نفسك ليه<br />موقع عشرينات خلاص اصبح له عشاقه ومدمنيه<br />يا عم اذا ما كنش عجبك<br />عندك محركات البحث دور على المواقع اللي تعجبك<br />وسيب عشرينات في حالها<br />واتحداك<br />اذا لقيت موقع تاني ينشر رأيك بصراحه زي عشرينات<br />يعني انت قلت رايك بمنتهى الصراحه وعشرينات نشرته<br />فيه عندك موقع تاني ينقل رايك بهذه السهولة<br />مستحيل"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 18
subject = "الى مش ضرورى"
author = "we"
text = "نشر المصرى اليوم الحديث التالى<br />قال رسول اللة صلى اللة علية وسلم<br />اما انة سيكون بعدى امراء يكذبون ويظلمون فمن صدقهم بكذبهم وما لاهم على ظلمهم فليس منى ولست منة ومن لم يصدقهم بكذبهم ولم يمالئهم على ظلمهم فهو منى وانا منة الا وان سبحان اللة والحمد للة ولا الاة الا اللة من الباقيات الصالحات"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 19
subject = "قال الإِمام أحمد : ( لو كان لنا دعوة مستجابة ، لدعونا بها للسلطان"
text = "قال الشيخ الدكتور صالح الفوزان ويسن أن يدعو – أي الخطيب – للمسلمين بما فيه صلاح دينهم ودنياهم ، ويدعو لإِمام المسلمين وولاة أمورهم بالصلاح والتوفيق وكان الدعاء لولاة الأمور في الخطبة معروفا عند المسلمين ، وعليه عملهم ، لأن الدعاء لولاة أمور المسلمين بالتوفيق والصلاح ، من منهج أهل السنة والجماعة ، وتركه من منهج المبتدعة ، قال الإِمام أحمد : ( لو كان لنا دعوة مستجابة ، لدعونا بها للسلطان ) ولأن في صلاحه صلاح المسلمين .<br />وقد تُركت هذه السنة حتى صار الناس يستغربون الدعاء لولاة الأمور ويسيئون الظن بمن يفعله ) ."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

