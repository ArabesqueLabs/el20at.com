[[comments]]
order = 26
subject = "صحيح بيعملوا اية فى ليلة الدخلة ؟"
author = "اهوة"
text = "بمناسبة ليلة الخلة ؟ هما بيعملوا اية - ولية سموها دخلة<br />الهى يكون العريس اقرع<br />ونغنى ونقول<br />دخلت دارة قلبت حالة"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 27
subject = "ليلة الرعب"
author = "بطة"
text = "الدخلة عندنا اسمها ليلة الرعب<br />يا ترى الشريك هيكون حيوان والا طريقة المعاملة هتكون ازاى<br />والنزيف دة ممكن يموت<br />ونفترض الشريك عندة شك ان مفيش غشاء اصلا<br />طيب والتصرف ازاى<br />البنات بيقولوا مفيش الم - دى زى شكة الدبوس - ولكن انهوا دبوس<br />هل كل البنت ما تكبر فى السن الغشاء بيرق ويصبح ضعيف<br />بمعنى لو واحدة عانس عندها 40 سنة - الغشاء عندها بسماكة بنت العشرين<br />اسئلة محيرة<br />وحاجة اخر قلق"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 28
subject = "الى الاخ الطحاوي"
text = "يا اخ الطحاوي هذه الباب اسمه مساحة للراي يعني لازم يكون موضوع عام يتم المناقشة فيه بينك وبين القراء وتبقى مناقشة مفتوحة<br />هذا الموضوع من الكرباك الى عشرينات هذا ذكرياتك الخاصة ليست مجال الصفحة ولا يوجد ما يتناقش القراء عليه<br />وشكرا"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 29
subject = "حاجه وتلاتين لولاء الشملول مثال ممتاز لمساحة للرأي"
author = "ابومحسن"
text = "ان من انجح موضوعات مساحة للراي منذ الاخراج الجديد لعشرينات هو موضوع<br />حاجه وتلاتين للكاتبة وفاء الشملول<br />لازم موضوعات مساحة للرأي تكون بنفس الشكل قضية عامه تهم الناس ويتناقشوا فيها اما كده ما ينفعش"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 30
subject = "صحافة لمين وعلشان اية"
author = "متابع"
text = "فى الغرب ممكن مقالة فى جريدة تشيل الحكومة<br />وممكن مقالة تلفت نظر الحكومة لسياسة ما خطأ او توجهها الى وجهة صح<br />انما عندنا رئيس الدولة صرح مرة انة لا يقرأ صحف المعارضة ويمكن لا يكون بيقرأ اى شىء ونسى القراءة من زمان<br />وكذلك الحكومة والوزراء لا يقراوون<br />ومعظم الشباب لا يقرأ غير صفحة الرياضة<br />والعواجيز صفحة الوفيات<br />يبقى هتكتبوا لمين - مين هيسمع صريخ الشعب - مفيش - مجرد صراخ فى البرية<br />فيا عم الطحاوى - الواحد يشتغل منجد كنب بلدى احسن<br />الصحافة فى بلدنا مهنة المنافقين والمطبلاتية وبتوع الزمامير<br />هيصة"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 31
subject = "صدقت يا اخ متابع"
author = "مش لازم"
text = "الصحافة في الغرب صحافة متخصصة صحافة تاثير<br />صحافة بتتحكم في مصير الرئيس الامريكي<br />صحافة بتشيل رئيس وتحط رئيس<br />يعني مثلا الان بدأت الانتخابات في امريكا وبدأت الاعلام يلعب لعبته في التاثير على الناخب الامريكي<br />علشان خاطر كده اليهود مسيطرين على الاعلام في امريكا"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 32
subject = "الصحافة..غابت المدينة لم تعد أعمدة أنارة، بل وسائل للاغاظة الكلمة نميمة والخبر قيل وقال."
author = "ابومحسن"
text = "صدقت يا اخ طحاوي الصحافة لم تعد اعمدة انارة بل وسائل اغاظه<br />والمفروض تبدأ في وضع اول عمود للانارة"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 33
subject = "هانت .وفتح بعضهم مزادا يبيع فيها الكارنيه لمن يدفع ولو كان زبالا."
text = "مشكلة نقابة الصحافيين<br />اي واحد ممكن يشتغل صحفي<br />ولذلك لا بد من المطالبة ان يقتصر عمل الصحفي على خريجي كليات الاعلام فقط تماما مثل الحقوق حتى تنتهي هذه المهازل"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 34
subject = "الصحافة نضال للوطنيين"
author = "واحد"
text = "قرأت كتاب عن الثورة العرابية - ثورة احمد عرابى على الخديوى الظالم الخديوى توفيق<br />واعجبنى النضال الوطنى لصحفى شاب يؤمن بقضية بلدة اسمة عبد اللة النديم<br />الصحفى الشجاع لا ينافق ولا يخاف ويضع مصلحة بلدة امام عينية<br />هذا الصحفى الذى سجن وشرد ونفى من بلدة وهرب من السلطة 10 سنوات مختفيا فى القرى هو مثال للصحفى البطل الذى يدخل التاريخ حاملا قلمة بدلا من السيف<br />على كل شاب صحفى ان يحتفظ بكتاب عن عبد اللة النديم - وحياة عبد اللة النديم<br />اما الذين يختارون طرق النفاق ومداحين غباء الحكام وتجميل كراميش اوجههم القبيحة فلا مستقبل لهم"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

