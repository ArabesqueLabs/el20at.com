text = "الأخ شريف الدواخلي هو بقى ليه حق انه يقول ده قلب عشرينات و لا مش قلب عشرينات و الله بقت تضحك ، و على مين على عبد الله الطحاوي و ايه الصورة اللي محطوطة ده"
