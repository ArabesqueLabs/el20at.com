[[comments]]
order = 0
subject = "يجعله عامر"
author = "سعدية الشامي(دودو يعني)"
text = "بعد الشر عليك من نزعة الحمورية يا استاذ عبد الله والله انت جيت كده وعملت لنا جو مختلف صحيح موضوع مصدرة الموضوعات، والاداء الصحفي ده كانت غريبة علينا شوية بس انت شوية شوية نسيت واحنا شوية شوية اتعودنا عليها وبقينا نعملها لوحدنا واصبحت انت الذي تطالب بالموضوعات الخفيفة والذاتية وكله عند ربنا<br />انت فعلا شخص يستحق التقدير غيرت فينا الكثير وفي شخصيا لديك قدرة هائلة على احتواء من حولك ودفعهم للامام سعدت بالعمل معك واعتبرها فرصة كبيرة للتعرف على هذا القادم من الريف مثلي<br />صحيح انا سعدية زي ما انت بتناديني لكن كمان عوضين وفي يوم من الايام لازم نعمل مسرحية تهد الدنيا وتطلع لابس الجلابية الفلاحي وانا لابسه اللبس الغريب اللي بيطلعوا بيه الفلاحين في المسلسلات العربي ..وسلم لي على حفلة القرصاية انت عارف قصدي طبعا بس كله فداك ياعمنا ويجعله عامر"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104081425/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 1
subject = "يااااااااه انصحك تكتب مذكراته يا استاذ عبد الله"
author = "شريف الدواخلى"
text = "ولو انى زعلان منك على تريقتك على رمسيس بس بس يالله مش مشكلة ..<br />بجد رحلة مضنية لا اتصور ان غيرك كان يمكنه أن يتكبد مشاقها ليصل إلى ما أنت فيه الان<br />قطعاً ليست عشرينات هى نهاية المطاف و أنما أتصورها نقطة الانطلاق ... لاماكن ارحب وافضل ... بصراحة نفسنا نقرالك فى حاجة مطبوعة يا استاذ عبد الله \" مع احترامى للنت والصحافة الاليكترونية \" بس برضه لازم قلم الطحاوى يبدع فى حاجة مطبوعة ورقية ....<br />عارف يا استاذ عبد الله لو جيلك \" الجميل \" ده رجع تانى يشتغل صحافة هانقعد كلنا فى البيت .... يعنى مثلا لو رجع الطحاوى واسامة سلامة يكتبوا تانى فى الملف القبطى يبقى خلاص بتوع الدستور والمصرى والبديل \" العيال يعنى \" يقعدوا فى البيت أحسن لان اللى احنا بنعمله بالمقارنه بيكم عامل زى الفرق بين الشخبطة اللى يلهو بها عيل صغير و كتابة احسان عبد القدوس .... فرق كبير أنا عارف ... بس هذه سنة الحياة ... عشان برضه نعرف ناكل عيش<br />تعرف يا استاذ عبد الله أنا لما بقارن احلى حاجة كتبتها فى الملف و أى حاجة حضرتك كتبها سواء هنا أو فى اسلام اون لاين بحس أن الفرق بينهما مثل الفرق بين السماء والارض \" بس أهوه \" أدينا بنتعلم ويكفينا فخراً أنك نعتنى بأنى تلميذك النجيب ... وهو شرف لا أستحقه ...<br />سنة أن شاء الله سعيدة عليك يا استاذ العظيم و لازم تتجوز فيها بقى عشان كده مش هاينفع بقى ... العرايس وافقين صف \" ارحمهم بقى \"واتجوز ....<br />وربنا يسعدك يارب<br />كلمة أخيرة :<br />عشرينات هى الطحاوى والطحاوى هو قلب عشرينات"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104081425/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 2
subject = "الله ينور ياطحاوي"
author = "احمد غانم"
text = "قلبت علينا المواجع ياطحاوي لكن ستظل آفاق عربية رغم سلبياتها في القلب تجربة جمعت الشامي على المغربي ومن كل لون ياباطسطة والله كانت أيام حلوة وتجربة أحلى وعيال مخلصة من عماد الدين للألفي لصبري ابو علم للبطل احمد عبد العزيز لنوال وكله الا نوال جابت خبرها وكافية كانت لمانة على لقمة حلوة وخناقة لذيذة وحناجر تنبح اااااااااااااه تعرفوا امنيتي ايه قبل ما اموت يفتحوا افاق عربية سلام ياصاحبي"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104081425/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 3
subject = "ملعون القهر اللي بيقفل الصحف"
author = "هاني صلاح الدين"
text = "احسنت ياطحاوي وجسدت مأسي جيل حلم بالانتساب لبلاط صاحبة الجلالة فدفع الثمن من حياتة وداخ السبع دوخات حتي يحقق حلم الكارنيةومنا من أغتالة الموت عقب تحقيق حلمة وما عصام الانصاري رحمة الله علية عنا ببعيد لكن اتركني ان اختلف معك في تجربة افاق عربية والتي التحقت بها مع عددها الثالث فهي تجربة ناجحة بكل المقاييس واستطاعت ان تاثر في السوق الصحفي وبالطبع كل تجربة لها وعليها ايضا لكن هذة الجريدة التي نعشقها جميعا خرجت جيل من الصحفيين المهرة الذين شهد لهم الجميع بجودة القلم وحرفية المهنة واغتالتها ايدي القهر والأستبداد والفساد السياسي ولن اخفيك سرا رغم اننا سرنا جميعا في دروب المهنة ولاننكر اننا حصلنا علي مكانة معنوية ومادية الا انني مازلت احلم بعودة جريدتي افاق عربية التي جعلت لنا اسما وسعرا في سوق الصحافة المصرية ودائما يتجدد في نفسي الامل ويراودني حلم العودة دوما ومازلت انتظر تحقيق الحلم وان كنت واهم فانا لن انتازل عن حلمي ولن يضيع حق ورائة مطالب والله غالب علي امرة ولوكرة المستبدين والمفسدين وان كان اليوم لهم فغدا ان شاء الله لنا واخيرا نبشت في الجرح ياطحاوي الذي مازال ينزف منذ عام و9 شهور"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104081425/http://masr.20at.com:80/newArticle.php?sid=13620"

