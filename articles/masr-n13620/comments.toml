[[comments]]
order = 37
subject = "اخبار سعدية الشامى اية"
author = "سعاد"
text = "اخبار البنات بتوعك اية يا طحاوى باشا<br />قصدى الحريم او مجلس الحريم اللى حواليك حاكم انت عامل زى شهبندر التجار فى وسطهم او ديك البرابر زى ما بيقزلوا<br />يا ترى سعدية ولدت بنتها والا لسة<br />عايزين نبارك مقدما على المولودة واية رأيك لو تسميها طحاوية ودلعها طيطى"
archived = "2008-02-09"
