[[comments]]
order = 10
subject = "فأسعار جريدة \" الكرباج \" كانت اعلى من اسعار جرائد اقل شهرة"
text = "* كان المرء انذاك اذا ما اراد ان يشتم وزيرا او مسئولا او حتى شخصا عاديا يتوجه الى احد الكتاب او الصحفيين الذين يملأون مقاهي باب الخلق والفجالة والحسين ليطلب منه ان يقوم بالمهمة شعرا او نثرا مقابل اجر يتم الاتفاق عليه وغالبا ما يقوم الزبون بتزويد الصحافي بخامة الموضوع ( المعلومات ) ليقوم الكاتب بتفصيل المقالة او القصيدة حسب رغبة الزبون وطلبه ثم يحملها الى احدى الصحف الشعبية التي تصدر من الرصيف لنشرها .... وكانت اسعار النشر تختلف وتتفاوت باختلاف طول المقال وعرضه وشهرة كاتبه كما كانت اسعار النشر تختلف باختلاف شهرة الجريدة او المجلة ... فأسعار جريدة \" الكرباج \" كانت اعلى من اسعار جرائد اقل شهرة مثل \" البعبع \" و \" الجاسوس \" و \" اللجام \" و \" الصاعقة \" و \" الغندورة \" والمرصاد\" و\" عفريت المقاولين \" و \" الخلاعة \" و \" المرستان \" وغيرها من صحف \" العتبة الخضراء \"."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

[[comments]]
order = 11
subject = "المنافقين والمنافقات"
author = "رخم"
text = "طبعا كل اللى شغالين معاك عمالين يعلقوا وينافقوا واولهم الست دودى - الريس بتاعهم بقى - ولازم يبينوا انك حاجة محصلتش وكتاباتك بتنقط سكر وانك جبت الديب من ديلة - وطبعا من كتابتهم فهمنا الشغل ماشى ازاى عندكم وعرفنا انكم مجموعة متافهمة ومع بعض<br />بس اللى منكد على عيشتى مين الللى بيصرف على الموقع المبالغ دى والمرتبات والايجار وكل المصاريف<br />مين اللى وراء عشرينات"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

