[[comments]]
order = 21
subject = "حكومة الشعب ومش عارف ايه"
text = "طيب يا خبيبي ما هو جمال عبدالناصر جه من الشعب وجاب معاه الحرامية كلهم<br />والسادات جه من الشعب وجاب معاه حرامية تانيين خالص<br />وحسني مبارك جه من الشعب وجاب معاه ناس تانية خالص<br />وبرضه لما حتيجي حكومة من الشعب تانية حيجيبوا معاهم حرامية جداد<br />وكل دا كان ليييييييييييييييه اسألني ليه<br />لان القاعدة بتقول كيفنا تكونوا يولى عليكم<br />فهم يا عم الناظر ولا ما فهمتش<br />وخلي بالك احنا كده كده مش واخدين حاجه حكومة شعب حكومة حرامية كده كده احنا بره اللعبة"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042655/http://masr.20at.com:80/newArticle.php?sid=13620"

