[[comments]]
order = 6
subject = "كل سنه وانت طيب"
author = "محمد"
text = "مش عارف ليه ياعبد الله باشا كل مااقرا لك احس انك اديب اكتر من كاتب صحفي<br />بستمتع بقراءة مقالاتك والله<br />بس خس شويه يا عبد الله .مينفعش كده ياراجل ......خد البراء واشتركوا في اي جيم ولا حاجه وبطل اكل كشري و ااتجوز بقي ياعم الحاج"
