subject = "وربنا يطول فى عمرك"
author = "حياتى"
text = "وربنا يطول فى عمرك يا اسطى طحاوى وتنتقل من الكرباج لعشرينات - وبعدين تقوم بالطلعة الجوية وتنتقل للتلاثينات<br />اى بعد العشرينات تبقى تلاتينات وبدل البنات اللى حواليك يبقوا شوية قرشانات وكل شوية يرفعوا الشبشب"
archived = "2008-02-09"
