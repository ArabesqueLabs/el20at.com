author = "ابو يوسف"
text = "الحمد لله ان الاستاذ مكتبش انة كان مع عادل امام وهو جاي يجيب المحرات لما قبلة سعيد صالح واخذ منه الفلوس<br />لا يكون ده بقي الطحاوي فوق صفيح ساخن"
