[[comments]]
order = 0
subject = "المحامين اول من تسعر بهم النار يوم القيامه"
text = "قال لي واحد بيشتشغل موظف في المحاكم وكان زميل قديم<br />ان المحامين اول من تسعر بهم النار يوم القيامه<br />فقلت له لماذا<br />قال لي لانه بيساعد المتهم وهو عارف انه غلطان ويستاهل السجن<br />فقلت له هذا طيب ان يساعد المحامي موكله ليخفف عنه الحكم او يجيب له البراءة<br />فقلت له ما بالك في محامي يغدر بموكله لحساب خصومه<br />تتصوروا يا جماعة ان المحامي (الواطي) من كتر حبه للفلوس (الا من رحم ربي) ممكن يغدر بموكله اذا الخصوم دفعولوا اكتر<br />اتفوووووووووووووووووووووا عليكم يا نقابة وسخه يا مهنة وسخه<br />وانا اصلي محروق من اتنين محاميين واحد فيهم عمي والله العظيم عملتلهم توكيل عام رسمي ودفعت الاتهاب وباعوني رخيص اوي اوي اوي<br />تخيل انت لما عمك المحامي يبيعك والله العظيم باعني وضيعني منه لله"
archived = "2008-01-07"
capture_url = "https://web.archive.org/web/20080107231150/http://masr.20at.com:80/newArticle.php?sid=13725"

[[comments]]
order = 1
subject = "محامين من ارازل الناس"
author = "رخم"
text = "هذة المهنة لا ينجح فيها الا كل رزيل سمج - يتعامل مع اصحاب القضايا كانهم ابقار يحلبها ولا يراعى فى مهنتة اى ضمير ولا اخلاقيات<br />اعوذ باللة<br />كان عميد حقوق اسكندرية فى سنة ما مرشح نفسة لانتخابات مجلس الشعب<br />وكنت اطالع اعلانات الدعاية الانتخابية على محطات الترام وكانت جملة قوية كاتبها فى الدعاية : انتخبوا الرجل الذى لا يبحث عن القوة ليقف بجانبها ولكن يبحث عن الحق ليقف بجانبة<br />كلام جميل جدا ومعبر من عميد الحقوق : الرجل سوف يقف بجانب الحق<br />وانتخبة الناس وبالاجماع<br />ودخل مجلس الشعب<br />وتغير 360 درجة - واصبح ترزى القوانين سيئة السمعة الصادرة عن الحكومة ومن مخلفاتة كل القوانين التى نعانى منها وتعديل الدستور لصالح الحاكم ليحكم مدة بلا نهاية ويخنق حريات الناس"
archived = "2008-01-07"
capture_url = "https://web.archive.org/web/20080107231150/http://masr.20at.com:80/newArticle.php?sid=13725"

[[comments]]
order = 2
subject = "الى الأخ اللى عمه المحامى ضلالى"
author = "المهاجر"
text = "الأخ بتاع المحامين اول من تسعر بهم النار ده احب اقوله حاجتين<br />انت بتقول ان عمك المحامى عو اللى غدر بيك وده معناه حضرتك ان مش العيب فى المحامين العيب فى العيلة الواطية اللى انت منها علشان فيها بنى أدم وسخ بالشكل ده وافرض عمك ده دكتور ولا ظابط كان برضه هايطلع دكتور وسخ بتاع اجهاض وترقيع ولا ظابط مرتشي حرامى العيب مش فى المحاماه العيب على الأصل الواطى بتاع العيلة المحترمة<br />وهو كل اللى تحصلة مصيبة ولا مراته تطرده وتضربه بالجزمة ولا جوزها يطلقها ولا يكتب شيكات ملهاش رصيد يبقى المحامين هما السبب ايه التخلف ده<br />وبعدين الموضوع عن القهاوى مش عن المحامين يا غجر"
archived = "2008-03-08"
capture_url = "https://web.archive.org/web/20080308182523/http://masr.20at.com:80/newArticle.php?sid=13725"

[[comments]]
order = 3
subject = "الى الاخ المهاجر"
text = "اكيد انت محامي واعتبرت ان الكلام موجه ليك<br />المحامي الشاطر لازم يقرأ كويس لان دليل البراءة بيكون في الاوراق فلازم يقرأ كويس ورق القضية علشان خاطر يساعد المتهم<br />ارجوك تقرأ تعليقي مرة ثانية حتلاقيني كتبت (الا من رحم ربي) كان لازم تفهم انني اعلم ان فيه محامين شرفاء"
archived = "2008-03-08"
capture_url = "https://web.archive.org/web/20080308182523/http://masr.20at.com:80/newArticle.php?sid=13725"
