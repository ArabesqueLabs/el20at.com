subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-08-22"
text = "ماهو ده جزء من سياسة منظومة الفساد، وعلى فكرة كل هذا نشأ وعرفته الجامعات خلال الحقبة الربع قرن الأخير ، وانتم عارفين وانا عارف، لأن مرتبات الدكاترة لا ترقى لمستوى معيشة محترم، بالإضافة لاحساسهم بالمهانة حيث يتحكم فيهم الأمن، ولا تخفى قصة ضرب الأستاذ الدكتور بجزمة ملازم أول ولم يحرك أحد ساكنا، كما أن منظومة الدولة تقلل من شأن المدرس بصفة عامة تهينه إجتماعيا، وقد بدءوا بالمدرس ومروا على الطبيب ، هم ظهر حقد الضباط على العلماء الذين لا يعرفون تنفيذ الأوامر لأنه ضد ما ألفوه من حرية الفكر وعدم قتل روح الإبداع، والله الموضوع كبير ومتشعب ولكن سلم الشاب الذي أثاره لنا، وهو احنا حنحلق على ايه واللا ايه الدنيا كلها بايظة والله<br />د.حازم"
archived = "2010-03-14"
