subject = "قانون المرور الجديد وعلبة الاسعاف وعلبة المكياج"
text = "قرفونا بالمثلث وشنطة الاسعاف وعلبة المكياج وهلافيط العادلى وقانونة<br />سلامة الناس على الطرق مربوطة بنوعية وجودة ومواصفات الطريق الهندسية وصلاحية السيارة للسير يعنى سيارة مفيش فيها فرامل والسواق يعطى رجل المرور 50 جنية ويجدد رخصة العربية وهى غير صالحة للسير والناس تموت<br />الفساد فى عساكر المرور اللى تخصصهم عمل مخالفات باى طريقة<br />النقطة الاهم هى الواسطة فى استخراج رخص السواقة - يعنى واحد عندة واسطة ودفع 500 جنية - الرخصة بتروح لة لغاية البيت وهو ما بيعرفش يسوق ويعمل حوادث قاتلة<br />اصلحوا جهاز شرطة المرور اولا لانة كلة فساد<br />مش تطلعوا قانون المثلث وشنطة الاسعاف وعلبة المكياج"
archived = "2008-09-04"
capture_url = "https://web.archive.org/web/20080904084002/http://masr.20at.com:80/newArticle.php?sid=17297"
