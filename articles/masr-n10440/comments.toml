[[comments]]
order = 0
subject = "سمك لبن تمر هندى"
author = "مصرى حتى النخاع"
posted = "2007-05-29"
text = "الموقع هيس على الاخر<br />الاخ كاتب المقال حد قالك ان مفتى الديار المصرية هو رئيس الجمهورية فانتا رايح تسالةالاسئلة دى<br />حد قالك ان الاسلام زى المسيحيين عندنا بابا ممكن نسالة فى كل الامور الحياتية<br />مقالة ماسخة ملهاش طعم واظاهر الموقع معدشى لة هدف غير الندب واللطم على الخدود<br />حد الكلام العقلانى بقى قليل"
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065112/http://masr.20at.com:80/newArticle.php?sid=10440"

