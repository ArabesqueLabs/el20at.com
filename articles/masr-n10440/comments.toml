[[comments]]
order = 2
subject = "مش مهم فعلا"
author = "مصرى حتى النخاع"
posted = "2007-05-29"
text = "الاخ مش مهم عاوز يبدا بمقولة الشيخ كشك ؟<br />جميل جدا الشيخ كشك دة يعنى رسول ولا عالم دين ؟<br />وبعدين اى دين بينافق السلطة فى المقالة دى<br />دة واحد قال كل مشاكل البلد وعاوز يلزقها بالعافية فى مفتى الجمهورية<br />وبعدين بااخى عرفت منين ان الشيعة بتحبة هاتللى دليلك ولا هيبا الحكاية ضرب فى الازهر بالعافية<br />تكونشى انتا واحد من طلبة الازهر اللى اتفصلوا وعاوز تنتقم<br />طب يااخى مش احسن توقدج شمعة بدل اما تلعن الظلام<br />لو حضرتك عالم دين ياريت تقول اسمك علشان نحترمك<br />اما لو كنت واحد قرا كلمتين وداخل يكفر شيوخ لمجرد انهم مش على مزاجة يبقى قول على الدنيا السلام<br />على فكرة انا لا مع المفتى ولا ضدة<br />لن بصراحة انتا واللى زيك بتهربوا من مواجة الشيوخ بالشائعات ونفسى الاقى حد يناظرهم وخصوصا ان القنوات الفضائية بقت برا مصر وسهل عمل كدة<br />انا الشائعات فهية فى الاخر حيلة الرخيص"
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065112/http://masr.20at.com:80/newArticle.php?sid=10440"

