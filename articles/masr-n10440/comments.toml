[[comments]]
order = 4
subject = "ضع عنوان التعليق"
author = "برضة مش مهم"
posted = "2007-05-29"
text = "يا عم النخاع انت مش عارف نفسك بتقول اية والحمد لله انى قرايت كلمتين احسن من اللى مش بيقراء خالص تعرف مشكلتنا اية انى اللى زيك مش فاهم حاجة فى اى حاجة وبيتفلسف وخلاص اولا الشيخ كشك دة عالم دين كبير جدا واسال علية المفتى نفسة بغض النظر عن سياستة ثانين بلاش تهلفط فى الكلام وبس ادخل على موقع الشيعة وانت تعرف ثالث كنت اتمنى انى اكون من طلبة الا زهر لان لا يعلم قدر الا زهر الا رجال الا زهر وبعد كدة انت بتتكلم على مناظرات الشيوخ هو شيوخ الحكومة شيوخ شيوخ الفضايات اللى بتتكلم عليهم لو لقوء متسع ليهم فى بلدهم مكنوش طلعوا برضو زى الشيخ القرضاوى والشيخ وشيوخ كثرياء ودعاة زى عمرو خالد وكثيرا جدا بس للاسف بيان عليك مش فاهم اصلا ان كنت بتكلم على اية والشمعة دى مش احنا اللى نقيدة لا ن احنا مع الله ومش عارف والله اقوللك اية يكرمك ربنا وتقراء كلمتين ينفعوك زيى كدة بس فى الدين وبعد كدة يا اخى الكاتب بيتكلم فى حاجات من صميم الدين مش عارف انت تقولة زى المسحين وبتاع يا اخى اذا كان الدين ورسول الله يقول عن الفرض العادى من لا يعى امر المسلمين فليس منهم فى شى فما با للك با لمفتى ادعو الله للك ان يفقهك فى الدين والدنيا ويجعلنا الله عباد زهاد فى الدنيا"
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065112/http://masr.20at.com:80/newArticle.php?sid=10440"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "جندل"
posted = "2007-05-31"
text = "شك أنك امتعضت –مثلي– من حكاية شرب بول الرسول صلى الله عليه وسلم، أقول امتعضت تأدبًا مع مقام الشيخ الجليل علي جمعة الذي أعلم أنه صاحب مدرسة فكرية مميزة وعالم من الوزن الثقيل.. لكن –بصراحة- هذه الفتوى مع أختها الخاصة بإرضاع الكبير تكفيان لصرف الناس عن دخول الإسلام لعشرات السنين، ولا يمكن أن نلومهم عن الانصراف عن دين يشرب أتباعه بول رسولهم ويرضع بعضهم بعضا!!<br />أضف إلى ذلك أن الحديث في هذا الأمر بعيد عن اللياقة؛ فالطبيب يسأل عن البول لتشخيص مرض، هذا مع الشخص العادي، فما بالك برسول كريم يقرن اسمه بما يستدعي إلى النفس معاني الطهارة والجمال!!.. حينما وصفه أصحابه ذكروا محاسنه (فداه أمي وأبي): طيب ريحه وإشراقة ابتسامته وحسن"
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065112/http://masr.20at.com:80/newArticle.php?sid=10440"

[[comments]]
order = 6
subject = "من هو المفتى"
author = "ابو اسامة"
posted = "2007-06-04"
text = "لقد دخل بنا علماء هذه الامة الى نفق مظلم لم نعد نرى فيه الا علماء يتناطحون فيما بينهم على الفتوى ومن له الحق فى الفتوى ونسوا او تناسوا دورهم الحقيقى وهو ارشاد قادة هذه الامة الى الصواب والى ما فيه صالح هذه الامة التى تدهور حالها بسبب ارتباط العلماء بالحكام واصبحوا بدلا من ان يعطوهم الفتوى فى صالح امور المسلمين ياخذون الفتوى من الحكام<br />ويطلقونها على حسب هواهم فاصبح الحاكم هو المفتى مفتى بلا دين الى اين يسير بنا الى ما نحن فيه .<br />حتى العلماء الذين يدعون الى الله مثلما فى قناة الناس وغيرها وليست مصر وحدها فى هذا لا يجرؤون على قول كلمة الحق فى وجه حاكم ظالم مع انها زروة الجهاد . بل كل همهم الدعوة . الدعوة فى بلاد مسلمة والكل الان يعرف فى دينه ما له وما عليه. رحم الله الشيخ كشك فقد كان عالما مجاهدا فاين انتم يا علماء الامة ركنتم الى الدنيا وزخرفها وحكامها<br />اعلموا انكم مسؤلون امام الله عما يفعله الحكام بالشعوب لانكم لم تقولوا لهم كلمة الحق انكم ظالمون فلو قلتموها لاءتبعكم الناس وكان التغيير على ايديكم . اتنتظرون ان يذهب هؤولآ الحكام العلمانيون لياتى غيرهم اسواء منهم او ياتى قوما يقولون<br />ان الله اختصهم وحدهم بدينه ليسموا نفسهم جماعة ويتناسوا من حولهم من المسلمين الله ينعل ابو اى جماعة تسمى<br />نفسها بعيدا عن الناس فليس ديننا دين جماعات او احزاب الدين دين الناس جميعا لم يخص الله به جماعة افيقوا يا علماء الامة واعلموا انكم ستساءلون عن علمكم وانكم تخاذلتم عن قيادة الامة عاوز اسال سؤال ليه واحد زى محمد حسان ميكونش مرشح لقيادة مصر ويتفق عليه العلماء بدلا من هؤلاء العلمانيون والحرامية الى خربوها"
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065112/http://masr.20at.com:80/newArticle.php?sid=10440"

[[comments]]
order = 7
subject = "رضاعة الكبير وبول الرسول واقباط المهجر"
author = "مش لازم"
posted = "2007-06-07"
text = "انا يا جماعة من المتردين على مواقع اقباط المهجر او كما يجب تسميتهم اعباط المهجر كالهيئة القبطية الكندية والاقباط متحدون وخلافه كفانا الله شرهم<br />المهم الفتاوي دي اول ما نزلت نزلت في مواقع اقباط المهجر او اعباط المهجر لان الاساءة للدين الاسلامي هي من اهم اهداف هذه المواقع<br />الامر الذي يؤكد ان اقباط المهجر او اعباط المهجر لهم ضلع كبير في هذه الفتاوي"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707113713/http://masr.20at.com:80/newArticle.php?sid=10440"

[[comments]]
order = 8
subject = "الازهر يوقف صاحب فتوى رضاعة الكبير عن العمل"
author = "اكتب اسمك هنا"
posted = "2007-06-09"
text = "الازهر يوقف صاحب فتوى رضاعة الكبير عن العمل<br />أرسل هذا التعليق بواسطة : اكتب اسمك هنا<br />صورة أرشيفية لـ د. عزت عطية<br />دبي، القاهرة- العربية.نت وسيد زايد<br />قرر المجلس الأعلى للأزهر ايقاف رئيس قسم الحديث بكلية أصول الدين بالقاهرة الدكتور عزت عطية عن عمله وإحالته إلي مجلس التأديب للتحقيق معه حول فتواه \"جواز إرضاع الموظفة لزمليها في العمل لمنع وجودهما في خلوة شرعية\". وجاء القرار في وقت شنّ وزير الأوقاف المصري محمود حمدي زقزوق هجوماً عنيفاً على فتوى أخرى لمفتي مصر الدكتور علي جمعة، أكد فيها أن الصحابة كانوا يتبركون بشرب \"بول\" الرسول صلى الله عليه وسلم.<br />وأصدر المجلس الأعلى للأزهر -وهو أعلى جهة إدارية تابعة لمشيخة الأزهر في مصر- بيانا نقلته صحيفة \"الشرق الأوسط\" الثلاثاء 22-5-2007، اعتبر فيه أن ما جاء على لسان عطية \"يتنافى مع مبادئ الدين الإسلامي الحنيف ويخالف مبادئ التربية والأخلاق ويسيء إلى الأزهر كمؤسسة إسلامية مرموقة\". وأجرت \"العربية.نت\" اتصالا هاتفيا بالدكتور عزت عطية بعد قرار الإيقاف وإحالته إلي لجنة التحقيق المشكلة من علماء بالأزهر"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707113713/http://masr.20at.com:80/newArticle.php?sid=10440"

[[comments]]
order = 9
subject = "ضع عنوان التعليق"
author = "كرة"
posted = "2007-06-12"
text = "فمرحى لرحلة من هذا النوع ولنتوقع غرق العالم الإسلامي، الذي نراه الآن، وهو يناقش مشكلة إرضاع المراهق، لرفع مشكلة الخلوة مع أجنبية، وهو أمر متوقع لقوم كفوا عن العمل واشتغلوا بالسفاسف والجدل، كما كانت نهاية بيزنطة، يناقشون في جو كسول رتيب، من الثرثرة المملة، عن جنس الملائكة؟ هل الملائكة ذكور وإناث؟ المرأة تقطع الصلاة بين الحمير والكلاب السوداء، زيادة في التمييز العنصري، حتى في مستوى الحيوانات، والماء يطهر بتغطيس الذباب، الذي يحمل الصادات الحيوية المعدلة في جناح، والشاب الذي يختلي بامرأة أجنبية عنده طريقة ممتازة لدفع الحرمة، وليس عليه سوى ان يلتقم ثدي امرأة تعمل معه في نفس القسم، فيمصه فتصبح المرأة حرام عليه لوجود نص بذلك؟! بعد خلع النص من كل إحداثياته وتاريخيته، لنسبح في بحر غامض من النصوص، ولنفتري على الله الكذب باسم الله..<br />لقد كان النيهوم صادقا في عنوان كتابين : محنة ثقافة مزورة، والثاني إسلام ضد الإسلام.. فهل حان الوقت لمراجعة مزعجة للتراث؟؟"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707113713/http://masr.20at.com:80/newArticle.php?sid=10440"

[[comments]]
order = 10
subject = "اهو دا الي كان نائصنا"
author = "شيكبالا"
posted = "2007-06-20"
text = "بال يبول بولا والبول من الا مبالاة والشيخ هداة الله لم يبالي بمشاعر الناس واهتماماتهم واعطانا قنبلة الموسم هذة الفتوى التي جعلتنا نتجاوز كل امم العالم تقدما وحضارة واعدنا فلسطين والعراق وجعلتنا خير امة في مجرة التبانة<br />هوكان نائصنا فتوة زي دي محنا خيبة ناقصين فتاوي تخيبنا كمان ولا التاني الي قال الست الموظفة ترضع زمايلها من الحليب بتاعها طيب لما تكون انسة حتشربهم منين والله حاجة تضحك وتبكي في نفس الوقت ال شيوخ آل اسكت بلا خيبة انت وهو"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707113713/http://masr.20at.com:80/newArticle.php?sid=10440"

[[comments]]
order = 11
subject = "شيخ الأزهر وتخاريف الصوفية وفتنة الكرسي!!!"
author = "واحد معدي"
posted = "2007-06-24"
text = "مسألة شرب بول النبي كانت حادثة عارضة ونص الرواية بين ذلك، وكان فيه دعاء الرسول لأم أيمن بألا يضرها ذلك!<br />فمن أين يأتون بطارة بول النبي من ذلك النص؟ وما الدليل على جواز التبرك به؟؟؟<br />هذا فقط من تخاريف الصوفية القبورية الذين يعبدون الموتى والهلكى من الأولياء المزعومين ويعبدون قبورهم!<br />والمفتي المعين من الحكومة لا يخفي ايمانه بمثل هذه الخرافات والشركيات بل ويتهم من ينكرها بالتنطع!<br />الحمد لله الذي فضحه بلسانه...نسأل الله أن يريح الأمة منه وممن عينوه!"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707113713/http://masr.20at.com:80/newArticle.php?sid=10440"
