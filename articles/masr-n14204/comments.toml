subject = "اعجابى بالحفله"
author = "طارق شراره"
text = "لقد اعجبنى كثيرا فريق حبايب والفنان الاستاذ محمد العزبى واكثر موقع 20atواريد حفله اخرى ويوجد بها الستاذ محمد الكحلاوى وشكرا"
archived = "2008-02-19"
capture_url = "https://web.archive.org/web/20080219232536/http://masr.20at.com:80/newArticle.php?sid=14204"

[[comments]]
order = 2
subject = "بطلنا نسمع الغناء ونسينا الفرح والضحك"
author = "شرارة بشرطة"
text = "سنينكم سودة وقطران<br />لما الواحد يشتغل الصبح وبعد الضهر فى عمل تانى وفى الليل مساعد عامل محارة علشان يعرف يعيش<br />هيجيب منين الفرح<br />لما انت مش قادر تعطى لابنك دروس وتخش على مراتك مهدود الحيل<br />هتسمع اغانى اية<br />ربنا يسد نفسكم زى ما قرفتم الخلق فى عيشتها"
archived = "2008-02-19"
capture_url = "https://web.archive.org/web/20080219232536/http://masr.20at.com:80/newArticle.php?sid=14204"
