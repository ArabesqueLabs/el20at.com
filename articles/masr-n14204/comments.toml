[[comments]]
order = 0
subject = "بمناسبه الضحك"
author = "مونا دلع مني"
text = "تخيلوا لو اتنين سمعهم تقيل اتكلموا مع بعض!! .<br />ايه اللي ممكن يحصل<br />تعالوا نشوف اتنين من دول<br />، واقفين على محطة الاتوبيس ودار بينهم الحوار ده :<br />الأول : الاتوبيس ده بيروح مــصر الجديدة؟<br />الثاني : على الحديدة !!... ليه انت طالب احسان<br />الأول : بذرة الكتان !! لا ..دي تلاقيها عند العطار<br />الثاني : جزار!! اه ..قوللي كده .. عايز تشتري لحمة<br />الأول : معك حق.. الدنيا زحمة ..علشان ده ميعاد خروج الموظفين<br />الثاني : نور الدين !! لا والله .. ماعرفهوش<br />الأول : ما بتشربوش!! ليه ..كفا الله الشر<br />الثاني : رأس البر !!! ..ده مــصيف هادي<br />الأول .: عايز تركب للمعادي... دي منطقة جميلة<br />الثاني : بليلة !! انت شكلك كده جعان<br />الأول : عيان!!! أي والله .انت باين عليك عيان ..<br />طيب ما تروح للدكتور<br />الثاني: الحنطور!! ده احسن من الأتوبيس ، وبيوصلني لحد الباب<br />الأول : هبــــاب !!! وانا اللي كنت فاكرك محترم<br />الثاني : اتخـرم !! هو مين ؟؟<br />الأول : عاوز اسـبرين ! ليه انت عندك صداع ؟<br />الثاني : قراع !!! ينهار اسود . ده مرض خطير<br />الأول : لا والله مش عايز. وبعدين مش بأحب الفطير.<br />تقيل على المعدة وتمنه غالي<br />الثاني: خالي.. انت تعرف خالي ؟ ده راجل كبير في السن<br />الأول : الجن .. نهارك مش فايت ..انت عليك عفريت .!؟<br />الثاني : لا والله ..ممعاييش.. انت عايز الكبريت ليه . عايز تولع؟<br />الأول : أدلع ! أدلع عليك انت!؟ انت ما تملاش عنيا<br />الثاني :يقبضوا عليا !! ليه !؟<br />الأول : انت غريب يا راجل انت..شكلك شحات ، (يدفعه من القميص) روح اشتغل شغلة تاكل منها عيش<br />الثاني : خيش!! والله ده صوف انجليزي<br />الأول: بنتك زيزي!!! ربنا يخلي...<br />الثاني : أنتاج محلي .!!!! ده مستورد<br />معدى شاويش من بتوعنا ... يلفت انتباهه الحوار، : بتعمل ايه يا جدع منك له!!!<br />الاتنين: ايوة يا شاويش ...احنا مستنين الأتوبيس<br />الشاويش :! نهاركم مش فايت .... جواسيس !!! قدامي على القسم"
archived = "2008-02-19"
capture_url = "https://web.archive.org/web/20080219232536/http://masr.20at.com:80/newArticle.php?sid=14204"

[[comments]]
