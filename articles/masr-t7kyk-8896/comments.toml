(السعودية) 08:58 مساءً (جرينتش)<br />شكلها كده مش عارفة انها عايشة فى مصر، لكن أحب أقوللك ان المسمين فى بلادهم بيحجروا على أى حد تانى غير مسلم مع انهم يطولوا لسانهم قد كده انهم مالهمش حقوق فى أوروبا وأمريكا، يعنى مثلا هناك عضو مسلم فى الكنيست الاسرائيلى فى حين انه فى أى بلد اسلامى تكون هناك اعتراضات واسعة يعنى من الآخر انسى ان مصر تقدملك حاجة واحمدى ربنا ان المسلمين سايبينك فى حالك لانهم نادرا فى بلادهم ما يتركوا حد فى حاله<br />68 - اوعي الدبح<br />مصري بجد مش زي صاحب تعليق رقم 30 ورقم 49|18/04/2008 م، 12:09 صباحاً (السعودية) 09:09 مساءً (جرينتش)<br />تعليق رقم 30 - (مصري - لا بارك الله بقومً حكمتهم إمرأة) خلي بالك بيدبحوكم دلوقت وبيعملوكم همبورجر تعليق رقم 49 - (احمد - الاسلام باقي) وانت كمان خلي بالك<br />69 - خلو القانون مدني بدل شرعي!<br />DANY|18/04/2008 م، 12:11 صباحاً (السعودية) 09:11 مساءً (جرينتش)<br />خلو القانون مدني بدل شرعي والكل يرتاح وتنتهي العنصرية. خصوصا الزواج والطلاق والوراثة المدني أفضل وأعدل!<br />70 - نفسي أشوف قاضية قبطية في المجلس الملي<br />مصري أصيل|18/04/2008 م، 12:54 صباحاً (السعودية) 09:54 مساءً (جرينتش)<br />نفسي أشوف قاضية في المجلس الملي للأقباط ، ولا شريعةالمسلمين كلأ مستباح وانتم بس اللي تحافظوا على دينكم من المرأة.<br />71 - محمد عبد ربة<br />والله العظيم لو لم تعين هذه القبطية المحترمة ستشتعل مصر |18/04/2008 م، 01:04 صباحاً (السعودية) 10:04 مساءً (جرينتش)<br />اقباط المهجر بيغلوا دلواتي وروحوا شوفوا منتدي الاقباط فتحوا الموضوع نقلا عن العربيه وهتبدأ الهيصة من امريكا وانا مع انها تعمل قاضية وعدم اهدار حقها بل لابد من ان يكون هناك الف قبطية مع الف مسلمة وتصبح مصر دوله الحرية ولكن الخوف هو من تشدد النظام بمادتة الثانية ونلاقي الدنيا ولعت فوق مصر<br />72 - مدير التفتيش القضائي في مصر قبطي<br />قاضي مصري|18/04/2008 م، 01:06 صباحاً (السعودية) 10:06 مساءً (جرينتش)<br />لا أظن هناك تفرقة ، و اعلان طلب لقاضيات كان واضح : اختيار القضايات من بين عضوات النيابة الادارية و هيئة قضايا الدولة وذلك لأن التجربة جديدة فرؤي البدء بمن تعملن بالفعل في الهيئات القضائية ، أما رافعة الدعوى هذه فهي محامية حرة لم يسمع بعد بقبول المحاميات سواء كانت مسلمة أو مسيحية ، أما مسألة تعيين المحامية الكبيرة تهاني الجبالي فقد كانت استثناء خاص من رئيس الجمهورية لا يقاس عليه ، فاعتقد أن هذه المحامية الشابة عايزة الشهرة أو تركب الموجة وتدخل مسألة الاقباط في الموضوع وخلاص .. وأخيرا لا توجد تفرقة في هذا المجال بالذات حيث أن مدير التفتيش القضائي المسئول عن تعيينات و ترقيات ونقل ومحاسبة بل و مجازاة القضاة في مصر و الموافقة على ندبهم ونقلهم واعارتهم وكل ما يخصهم هو مسيحي قبطي اسمه المستشار انتصار نسيم حنا كما أذكر بالخير المحامي العام الأول لنيابة الأموال العامة العليا (وهو منصب لو تعلمون عظيم) هو المستشار اللامع البارع خبير جرائم الاموال العامة المستشار بولس فهمي ... و الأمثلة لا تعد ، مثل المستشار عادل أندراوس رئيس محكمة استئناف القاهرة بجلالة قدرها وعضو مجلس القضاء الاعلي (مكون من سبعة مستشارين لا غير) و غيره كثير !<br />73 - مش موضوع مسلمة او مسيحية<br />المحامى الحر|18/04/2008 م، 01:35 صباحاً (السعودية) 10:35 مساءً (جرينتش)<br />يا استاذة اوراقك لم ترفض لكونك مسيحية ... الامر انك لست بنت احد من المستشارين او المحافظين الذين كانوا كمستشارين راجعى ايتها الز ميلة اسماء القاضيات المعينين ستجدى اكثر من تسعين بالمائة منهن بنات لمستشارين بالخدمة او من كانوا بالخدمة و مازالوا بمناصب اخرى كمحافظ القليو بية عدلى حسين و اخرين و هذا هو النظام فى مصر و الذى تعرفينه جيدا و انت لست بغريبة علينا... و الامر فى النهاية لا يشرف احد فالمسالة ماهى الا ديكور يتز ين بة وجة الحكم القبيح للغرب و محاكاة ليس الا ... اتريدين لنفسك ان تكونى قطعة ديكور يتز ين بة اخرون ام من الافضل ان ترتدى عباءة المحاماة السوداء دليلا على الحزن من الظلم الذى يقع على الشعب المصرى و انت منهم و تدافعى عن الحق حتى يرى النور !!!! مع تحياتى<br />74 - لا اوافق<br />ابن السودان البار|18/04/2008 م، 02:01 صباحاً (السعودية) 11:01 مساءً (جرينتش)<br />بما انه لافرق بين سودانى ومصرى فمن حقى ان اقول انا لا اوافق على هذاااااااااااااااااااااااااا ,أكثر من 70ً% اصول التشريع القانونى بمصر يستمد من الدين الاسلامى فكيف لغير المسلم ان يحكم بقوانيين هو نفسه لا يؤمن بمصدرها .. للمصريه هذه التى تطالب ان تصير قاضيه ان تعترف بالاسلام وتشهد برساله محمد رسول الله _ص) ومن ثم ينظر فى طلبها ..<br />75 - هل تؤيد منح الاقليات في العالم العربي مزيدا من الحريات<br />sami|18/04/2008 م، 02:10 صباحاً (السعودية) 11:10 مساءً (جرينتش)<br />لو كان الاستفتاء الحاصل هذا الاسبوع على العربية عن منح الاقليات مزيد من الحريات عن مصر فقط لكانت مصر حصلت على الدرجة الاولى في قمع الحريات<br />76 - ماهي دي الحقيقة<br />مش لازم |18/04/2008 م، 02:39 صباحاً (السعودية) 11:39 مساءً (جرينتش)<br />الي تعليق رقم 1 هي دي الحقيقة ان كان عاجبك وبعدين من قلة القضاء يعني انت عايزة تبقي قاضية وخلاص وبعدين انت اصلا مابتفهمش حاجة غير الحقد علي المسلمين ليه بقي اسال نفسك ياعم الفلحوس انت عامل نفسك فاهم كل حاجة وانت والله ولا فاهم حااااااااااااااااااااااااااااااااااجة خااااااااااااااااااااااااااااااااااااااااااالص الرجاء النشر<br />77 - الى الجاهل كريم التعليق رقم 48 وامثاله<br />علاء الموصلي|18/04/2008 م، 03:01 صباحاً (السعودية) 12:01 صباحاً (جرينتش)<br />هل تفهم ماذا تعني هذه الايات من الكتاب المقدس ؟؟ هل قرات لها تفسير يا اجهل الجهال ؟؟ الكتاب المقدس يا جاهل فيذكر معلمنا بولص الرسول هذه الايات للمرة في الكنيسة وليس في محكمة فيها تشريع بشري صرف هل فهمت ولا ازيدك يا جاهل ان وامثالك الجهلة .. والقبطية هذا بلدها ويجب ان تتعامل معاملة المثل مع المسلمات هل فهمتم يا معترضين .... يا عربية ان لم تنشري فهذا يدل على ضعفكي<br />78 - اختطاف وطن أم اختطاف نقابة<br />عمرو اسماعيل|18/04/2008 م، 03:32 صباحاً (السعودية) 12:32 صباحاً (جرينتش)<br />ما حدث في نقابة الصحفيين من سيطرة قلة من المنتمين إلى التيار الإسلامي ومنع مؤتمر \\\"مصريون ضد التمييز\\\" من الانعقاد في نقابة مفروض أنها تمثل حرية الرأي في مصر، لا يمثل فقط اختطافاً للنقابة من قبل قلة صوتها عالِ، ولكنه اختطاف لوطن بأكمله، فما حدث في نقابة الصحفيين حدث من قبل في كل نقابات مصر.. وجماعة الإخوان قد اختطفت من قبل نقابتي المهندسين قبل وضعها تحت الحراسة ونقابة الأطباء حتى الآن.. وأي معارض لهم يتم اتهامه في الدين والملة وكأنهم هم الإسلام ومن يعارض سياستهم الفاشلة في إدارة النقابة هو ضد الدين والإسلام.. ويتم استبعاد ليس فقط غير المسلم بل وحتى المسلم الحر الذي لا يتفق مع توجهاتهم.. وتحولت أي نقابة سيطروا عليها إلى مصدر م"
