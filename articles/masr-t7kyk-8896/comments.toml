subject = "إلى قبطى"
author = "حسين"
posted = "2008-04-26"
text = "فيه إيه يا عم؟؟ داخل شمال كده ليه؟؟<br />هيا قالت أن الموضوع ملوش دعوه بكونها قبطيه , و انها مريم المصريه مش مريم المسيحيه , و دى حاجه احترمها منها<br />و فعلاً انا مقتنع ان ما دام فيه قانون هيتطبق على الكل , يبقى معنديش مانع يكون القاضى من أى دين... أهم حاجه الأمانه و انه لا يخاف فى الحق لومة لائم"
