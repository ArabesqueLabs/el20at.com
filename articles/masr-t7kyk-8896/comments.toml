[[comments]]
order = 5
subject = "تعليقات حول الموضوع"
posted = "2008-04-28"
text = "مراقب|17/04/2008 م، 06:14 مساءً (السعودية) 03:14 مساءً (جرينتش)<br />اتفضلوا سبوا بالمسيحيين وان المراة ناقصة عقل ودين ومحسن المصري سيكتب عشرة صفحات يخطب بها ويتفلسف ويذكر كم اية حافضها وبقية الحثالة من معلقي العربية سيلثون حقدهم وكراهيتهم مجرد ان يقراوا كلمة قبطي بدون قراءة المقال.. وكل تافه سييتغل الموضوع ليقول لنا كيف ن المسحيين والكفار هم اساس مضاكل العالم .. تفضلوا<br />2 - و غالبيتهن محجبات !!!!!<br />مسلم سابق|17/04/2008 م، 06:19 مساءً (السعودية) 03:19 مساءً (جرينتش)<br />نخر الإخوان جسد القضاء المصري و جسد مصر كيف يمكن لقاضية المفروض أنها متعلمة و مثقفة أن تخضع للتمييز بإرادتها و تعتبر نفسها عورة و مصدر فتنة !!!!! و مادامت محجبة لتقر في بيتها أحسن بالمرة أم تؤمن ببعض الكتاب و تكفر بغيره ؟ الى متى هذا النفاق والتخلف و التمييز الديني ؟ يا اخوان الخراب<br />3 - تريد إثارة الفتنة<br />خالد المصري|17/04/2008 م، 06:21 مساءً (السعودية) 03:21 مساءً (جرينتش)<br />ان أراها تريد إثارة الفتنة الطائفية في البلد فضلاً عن أنها باحثة عن الشهرة أولاً ليست هذه الفتاة هي الوحيدة التي رفضت أوراقها بل هناك أكثر من ثلاثة الآف طلب قد رفض وكلهن من المسلمات وقولها انها لا تريد ان تظهر القضية على أنها قضية اضطهاد أكبر دليل على أنها تستغل الامر أسوأ استغلال ويبدوا أنها لم تقنتع بأن طلبها سوف يرفض لأان شرط التحاقها بالنيابة الادارية لم ينطبق عليها اصلا وانطبق على ثلاثمائة امرأة مسلمة وقارنت نفسها بتهاني الجبالي الوحيدة التي تم تعيينها بقرار جمهوري نظراً لمكانتها المرموقة في مهنة المحاماة يا سادة انها تريد أن تجعل قضيتها قضية اضطهاد طائفي وهي بعيدة كل البعد عن هذا<br />4 - هو بالعافية عايزين تمسكوا المناصب<br />بطلوا ابتزاز|17/04/2008 م، 06:22 مساءً (السعودية) 03:22 مساءً (جرينتش)<br />القاضية الفاشلة ببساطة حولت الموضوع لمسلم ومسيحي..يعني انا لو فاشل ومش مستاهل اقول اني مسيحي علشان ابتز الدولة واضغط عليها وبالعافية يعينوني..علشان اي ارض يغتصبها بنوا ملتها ويبنوها كنيسة تحكم على طول باحقيتهم في السرقة ..واي واحد قذر يتنصر بالفلوس تروح مطلعة حكم باحقيته في التلاعب وكتابة مسيحي في بطاقته..واي أم قذرة تعمل غسيل لولادها وتحصل على حكم من قريبتها المسيحية بالهروب بالأطفال إلى الخارج مثلما كانوا يريدون تهريب الأطفال من تشاد لفرنسا لتنصيره أو لتقديمهم للقساوسة للمتعة..بطلوا ابتزاز يا نصارى واحمدوا ربنا على النعمة اللي انتم فيها..رحمتك يارب<br />5 - من الخاسر ؟؟؟؟؟<br />الحق واضح ولكن عرقلته جاهزه بالف سبب...!!!|17/04/2008 م، 06:28 مساءً (السعودية) 03:28 مساءً (جرينتش)<br />الاقباط المسيحيون هم الاصل الاكيد للمصريين ..هم اهل مصر الاصلاء.. ولكن التمييز البغيض بصرف النظر عن المسميات تجعلهم غرباء على ارضهم..لا تخيلوا كم التعصب الذى يلاقيه مثلا الطلاب الاقباط فى الاختبارات الشفهيه وخاصه فى الكليات العمليه وذلك طبعا لمنع تعيينهم فى كادر التدريس...وفى تعيينات القضاء والنيابه وحتى الشرطه ...الكل يعلم ذلك ولكن التعصب البغيض و جو المجتمع المملوء بالبغضاء والغل نحو كل ماهو غير مسلم...تذكروا لماذا د.مجدى يعقوب لجا الى لندن ولم يبق فى القاهره والمئات غيره....لمصلحه من هذا التمييز لمواطنين مصريين منذ الازل ولا يجادل اى انسان فى وطنيتهم واخلاصهم ...صدقونى الوطن والمجتمع هو الخاسر من الغاء الاقباط من المعادله...الميزه الفريده والجميله لمصر المعروفه عنها يذبحونها بجهلهم و تعصبهم...وفى النهايه نقول ان كان الله معنا فمن علينا______<br />6 - هذا الطلب العادل<br />DANY|17/04/2008 م، 06:35 مساءً (السعودية) 03:35 مساءً (جرينتش)<br />نعم نريد قضاه مسيحيين وذلك للعدل بين الناس<br />7 - عليكى وعلى شعبولا<br />AHMED IRELAND|17/04/2008 م، 06:37 مساءً (السعودية) 03:37 مساءً (جرينتش)<br />على هذه المحامية القبطية أن تذهب الى شعبان عبد الرحيم لعرض مشكلتها<br />8 - aarm_06@hotmail.com<br />عاصم|17/04/2008 م، 06:38 مساءً (السعودية) 03:38 مساءً (جرينتش)<br />انا من وجهة نظري جميع النساء على اختلاف ديناتهن لايصلحن للقضاء بسبب طبيعة المرأة العاطفية .<br />9 - برافو والى الامام<br />مصرية مرت من هنا|17/04/2008 م، 06:39 مساءً (السعودية) 03:39 مساءً (جرينتش)<br />واتمنى ان توافق المحكمة حتى نثبت ان مصر دولة متحضرة وراقية وليست دولة ظلامية متخلفة<br />10 - قاضية للأقباط!<br />حمد بن خالد - قطر|17/04/2008 م، 06:42 مساءً (السعودية) 03:42 مساءً (جرينتش)<br />إذا كانت تريد أن تصبح قاضية، فلتصبح قاضية على قضايا الأقباط فقط، طبعاً يجب أخذ رأي الكنيسة والبابا أولاً حتى لا تصبح فتنة!<br />11 - والله افظل<br />بو نواف|17/04/2008 م، 06:43 مساءً (السعودية) 03:43 مساءً (جرينتش)<br />نحن المسلمين في غالبيتنا لانصلح للقطاه او ارئسه او اي شي نحن غريبين منافقين لا نسمي الا شيا بسمائه الحقيقيه راجعو انفسكم شوي؟؟؟؟؟؟<br />12 - خبر غريب ياعربيه<br />مذهول عبد الحيران|17/04/2008 م، 06:48 مساءً (السعودية) 03:48 مساءً (جرينتش)<br />و ما وجه الغرابه ان تكون قبطيه قاضيه؟؟ اليست انسانه؟؟ هناك 30 قاضيه مسلمه و ما المانع ان تكون هناك واحده قبطيه..لا اتفهم الغرض من الخبر. و هنا اتقدم بالسؤال للعربيه ما هو مفهوم الخبر في قاموسكم؟ رجاء النشر<br />13 - معاملة بالمثل<br />Egyptian|17/04/2008 م، 06:49 مساءً (السعودية) 03:49 مساءً (جرينتش)<br />نحن فى مصر مسلمين لا نعرف الديمقراطية و حقوق الانسان اهم ما يميزنا هو العنصرية على اساس الدين فان كانت مستائة من هذا التخلف فاذهبى الى فرنسا الكاثوليكية ستجدى منتهى الحب و الحرية و عدم العنصرية و خصوصا وانت ارثوزكسية فكم الحب و عدم التفرقة لا حصر له بين الكاثوليك و الارثوزكس<br />14 - تحية للمحامية القبطية<br />هبنقة|17/04/2008 م، 06:55 مساءً (السعودية) 03:55 مساءً (جرينتش)<br />كيف يتوقع المسلمون من العالم احترامهم بينما هم يمارسون هذا النوع من التمييز القائم على الدين؟<br />15 - الاعتراض علي الجنس او الديانة ؟؟؟؟؟؟؟؟؟؟؟<br />egyptian london|17/04/2008 م، 06:59 مساءً (السعودية) 03:59 مساءً (جرينتش)<br />لا اري اي مانع ان تكون المرأة قاضية فليس النساء اقل ذكاء او اكثر قسوة من الرجال........ انما العقليات التي تربت ومن تقاليدها ان النساء... اقل.. اقل ..في العقل والتفكير وهي نصف الرجل هي سبب تخلف العالم العربي بالذات ........ونزيد علي هذا العنصريات الدينية ونزاعات الاطفال اي ديانة هي الافضل.... لا تختلف عدالة السماء من دين الي اخر لانهم بكل بساطة لنفس الاله..... لا يهمني لون القاضي او ديانتة كل ما يهمني ان يكون عادل في زمن ساد فية الفساد ..... تحيااتي من مسلم احب واحترم اخواني الاقباط يا اذوق والطف البشر وعلم وذكاء ,نبع طيب صافي وعنوانكم هو السمااحة والاخلاق<br />16 - مساواة<br />بيبرس|17/04/2008 م، 07:01 مساءً (السعودية) 04:01 مساءً (جرينتش)<br />فى مصر مستشارين و قضاة أقباط فما المانع فى أن تصبح قبطية قاضية .<br />17 - القاضي حسابة مرررر<br />مصري اصيل|17/04/2008 م، 07:04 مساءً (السعودية) 04:04 مساءً (جرينتش)<br />خليكي في حالك ربنا يسترها عليكي قاضي في بلد ظالم ويل عظيم وكل سنة وانتي طيبة وعقبال ثمانين سنة ماسكة المملكة انتي وابنك وكلابة , هي قطنة في الاخر وفي يوم الحساب مش ها ينادوا بالالقاب يا ريسة خليكي محامية شريفة ولا قاضي في بلد ظالم ,<br />18 - شريعة العنصرية<br />ايوب صابر|17/04/2008 م، 07:04 مساءً (السعودية) 04:04 مساءً (جرينتش)<br />اذا كان هنالك 30 قاضية مسلمة و لم يسمح لهذه القبطية بتعيينها قاضية فهذا دليل العنصرية و عدم قبول الآخر بسبب المحدودية. و الانغلاق الذي يبقي او يرجع البلاد الى زمن الجاهلية التي يعاني الكثير من افكارها .<br />19 - نكتة النكت<br />أبو صلاح للإصلاح|17/04/2008 م، 07:04 مساءً (السعودية) 04:04 مساءً (جرينتش)<br />الشريعة الإسلامية لا تمنع عملها بالقضاء؟؟؟ سبحانك اللهم ربي الأعلى وبحمدك! هل أنت مفتية رخص لك الأزهر بالإفتاء الشرعي وصرت عالمة للنظر في مثل هذه المسائل الدقيقة؟ أم هل مسلمة من الأساس؟ هدانا الله وإياك إلى صراطه المستقيم.<br />20 - الفتنة نائمه لعن الله من ايقظها<br />وائل بيه|17/04/2008 م، 07:05 مساءً (السعودية) 04:05 مساءً (جرينتش)<br />بدأت النعرات الطائفيه والمذهبيه تدق اجراسها فى سماء المحروسه . بالامس البهائيون يطالبون باستحداث دين جديد يسمى البهائيه . واليوم تطالب اخت مسيحيه باحقيتها بكرسى القضاء . وغدا سيطالب المتشيعين حديثا بارثهم الشرعى بمسجد سيدنا الحسين . هل كراسى القضاء توزع هكذا لمن يتقدم اليها . ماذا لو تم قبول طلبها ولم تختار كقاضيه ؟؟ بالتاكيد كانت ترفع نفس القضيه وتتساءل لماذا اختاروا المسلمات وتركونى ؟ كفانا لعبا بهذه الورقه ارجوكم فمصر باتت لا تتحمل هذه المهاترات .فغدا ستطل علينا لجان مايسمى بحقوق الانسان ولجان اقباط المهجر والمعصبين والمتغميين وسينادون بمناصرة اخت لهم لان حقها قد اغتصب وكأن من المفروض ان يلبى طلبها فورا والا دقت الاجراس لها والسؤال هنا هل كل المتقدمات لهذا الكرسى قد نجحن فى الوصول اليه ؟ يااختى ليس معنى انكى تعرفين مئات الاحاديث او حصولك على ليسانس الحقوق بتقدير جيد ان تصبحى قاضيه .الفتنة نائمه لعن الله من ايقظها.<br />21 - كما اقول دستور مصر يجب تحديثه...<br />N.T.B.L.P|17/04/2008 م، 07:13 مساءً (السعودية) 04:13 مساءً (