subject = "مش اول قاضية - طيب ما هو بطرس غالى الكبير كان قاضى"
author = "قبطى"
posted = "2008-04-26"
text = "اية التزوير وقلب الحقائق دى<br />انتم عارفين حادثة دنشواى وزهران والمشانق والجلد<br />طيب ماهو القاضى ووكيل النيابة كانوا اقباط وحكم بطرس بطرس غالى الكبير على الفلاحين بالاعدام شنقا<br />ازاى بقى هتبقى انتى اول واحدة<br />دول قبلك كتير قوى من الاقباط<br />وفيهم الشرفاء جدا<br />القاضى القبطى البطل اللى حكم على المتظاهرين فى 18 و 19 يناير المعروفة بمظاهرات الحرامية ايام السادات حكم القاضى عليهم بالبراءة جميعا ولم يخف<br />ثم انك مصرية اولا ومتقدمة لوظيفة - اية دخل الدين هنا - بتقولى قبطية لية - علشان لما تفشلى فى الاختبار تقولى اضطهدونى علشان قبطية<br />النغمة دى بقت بايخة قوى<br />قولى انك مصرية وبس - نجحتى اهلا وسهلا - فشلتى برضة اهلا وسهلا - انما شغل الصهينة بلاش منة احسن<br />وربنا يوفقك"
archived = "2010-03-14"
capture_url = ""

