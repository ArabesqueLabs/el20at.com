subject = "رد على قبطي (المعلق الاول)"
author = "مش لازم"
posted = "2008-04-27"
text = "انت بتقول<br />بطرس غالى الكبير كان قاضى وحكم على بتوع دنشواى بالشنق والجلد<br />اقولك انا ليه بطرس غالي عمل كده<br />لان مرات بطرس غالي كانت بتشتغل خدامة بيت وسرير عند السفير البريطاني علشان كده بطرس غالي عمل اللي عايزينه الانجليز لانه ما يقدرش يفتح عينه فيهم<br />فهمت ازاي يا قبطي افندي<br />وبعدين يا اخي انت مسمي نفسك قبطي ليه<br />انت بتتكلم عربي اهه وزي الفل والانجيل بتاعك بالعربي<br />ايه قبطي دي"
