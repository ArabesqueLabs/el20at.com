author = "عاصفة الصحراء"
posted = "2007-06-19"
text = "عادت وتقاليد بعيدة كل البعد عن الدين جعلت من المراة السعودية اشبة ماتكون بالسجينة لهذاالواقع المرير والا كيف يتم تعطيل نصف المجتمع عن المشاركة فى بناء ونهضة البلد لماذا نمنع المراة من قيادة السيارات ليتمكنوا من التنقل من والى اعمالهم وقضاء حوائجهم ونستعين بسائقين ليسوا ذوخلق والبعض ليس ذودين والمشاكل الناتجة عن ذلك لوكانت المراة تتمتع بقليل من حرية الحركة والعمل لما سمعنا بعانس الالماندر ولكن ان تقبع حبيسة اربع جدران فطبيعى ان تكون عانس"
archived = "2011-07-06"
