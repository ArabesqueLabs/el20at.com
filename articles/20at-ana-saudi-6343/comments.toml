text = "السبب الاباء والامهات واحيانا البنت تقعد تتدلع اذا جاها خطابة تقول ابكمل تعليمى ومرة تقول هذا مايصلح لى فجاءة تلقى نفسها عدت الاربعين وتقول ياليت وياليت وعموما الشباب العوانس اكثر من البنات والسبب البطالة وعدم المقدرة على تكاليف الزواج الباهظة والشروط التعجيزية"
