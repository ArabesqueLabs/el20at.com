text = "هناك من يوافق و يراها هدية ربانية جاءت ف وقتها نظرا للحاجه و آ خرون يرونها وصمة عار و اهانة و هؤلاء اغناهم الله من فضله<br />الموضوع نسبى بحت<br />و لهذا انا مع الرأى القائل باعانة من يحتاج بصرف النظر عن اطلاق مسميات ساذجة لا داعى لها"
archived = "2011-07-06"
