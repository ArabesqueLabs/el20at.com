author = "نائب غبى"
posted = "2009-10-12"
text = "النائب الغبى عايز 27 مليون جنية زى اللى اتصرفوا على منتخب الشباب<br />طيب هم صرفوا على منتخب الشباب 27 مليون جنية ازاى<br />27 مليون جنية على منتخب الشباب امل منتخب مصر بيصرف كام مليون<br />علشان كدة فهمت لية الزبالة مالية الشوارع والناس بتشرب من المجارى والشباب قاعد على القهاوى<br />هنقول اية حسبنا اللة ونعم الوكيل<br />وبتوع الاخوان يبطلوا عنتريات ويتلموا شوية البلد مش نقصاهم"
archived = "2010-03-14"
