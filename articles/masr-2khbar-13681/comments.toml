author = "اعرف عن الاخوان"
posted = "2009-10-12"
text = "اعرف عن الاخوان كتير اوي<br />الاخوان دول اتباع ذو الخويصره اللي مسك النبي محمد من قميصه وقال له اعدل<br />واتباع قتلة عثمان ـ ما كنش عاجبهم سيدنا عثمان علشان كده قتلوه<br />واتباع الخوارج اللي خرجوا على سيدنا علي علشان خاطر سيدنا علي وحش وهما حلوين<br />اللي اعرفه عن الاخوان انهم خوارج<br />ومش انا اللي بقول كده دا علماء الدين الكبار هما اللي بيقولوا كده<br />والانترنت مليان فتاوي ومحركات البحث خير شاهد"
archived = "2010-03-14"
