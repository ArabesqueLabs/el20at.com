subject = ""
author = "واحد من الناس"
posted = "2009-10-12"
text = "هو انت تعرف تعمل زي الاخوان<br />وانت تعرف عنهم ايه أصلا<br />هوكان بيتكلم على سبيل السخرية<br />شغلوا عقولكم بطلو تصدقو كل اللي بتسمعوه من الاعلام المضلل"
