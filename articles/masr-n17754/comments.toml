order = 0
subject = "اصبح بطل رأى عام"
author = "لية"
text = "يالحكم شهرين سجن على الصحفى ابراهيم عيسى اصبح بطل قضية رأى عام وستكتب عنة الجرائد فى جميع انحاء العالم وبثت جميع نشرات الاخبار فى الفضائيات الخبر واصبح اشهر من رئيس وزراء مصر<br />تعليقى هو<br />غباء نظام فاشل بيلف حبل المشنقة حول رقبتة كان ممكن للقاضى ان يحكم بغرامة مالية"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 1
subject = "تستاهل يا ابراهيم يا عبيط"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "يا فرحة تانت ظاظا فيك يابو خليل؟<br />(من اعمالكم سلط عليكم)<br />بعد خروجك من السجن انا عارف اسميك اية بالضبط<br />الاستاز ابراهيم عيسى و لا السيدة ابراهيمة عيسى؟ انا موش عارف اقولك ايه؟!!!<br />انت عارف السجن و الشقاوة اللى بتحدث فى السجن يا مدام"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

