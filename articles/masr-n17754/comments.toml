[[comments]]
order = 4
subject = "وللحرية الحمراء باب --------------- بكل يد مضرجة يدق"
author = "مصرى"
text = "الجبناء ليس لهم مكان وسط الشرفاء<br />ستتحرر مصر من كابوس النظام البوليسى الفاشيستى وسيخرج الاحرار من السجون وكل الشرفاء ابتداءا من ايمن نور الى الشاطر ورفاقة و18 الف معتقل سياسى بدون اى محاكمات وخلف القضبان<br />وسيخرج الحر الجرىء ابراهيم عيسى اطول من كل الاقزام والعملاء واتباع الصهيونية العالمية<br />وغدا يفرح المؤمنون بنصر اللة<br />والسجن وسام شرف على صدر كل مناضل<br />فليسجنوا الشعب كلة"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
text = "نظام مرتعش: أنا مش حأعلق على الحيوان ( مع الأعتذار للحيوانات) اللى سمى أسمه زخارى ومن الواضح أنه موظف فى أمن الدولة. واضح أن النظام بيترعب من الكلمة لأنها الوحيدة الل ممكن تصحى هذا الشعب اللى فى غيبوبة. أبو خليل حيفضل يتكلم ويعبر عن كراهيتنا لهذا النظام الفاشل فى كل شىء وحيموت الفرعون وعائلته وتبقى الكلمة حتى لو نبحت علينا كلاب الحزب الواطى الغير ديمقراطى والبلطجية والقتلة واللصوص الذين يضمهم تحت جناحاته . الله معاك ياأبراهيم على كل ظالم .الله أكبر عليك ياللى خربتها وقعدت على تلها."
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 6
subject = "الحمد للة"
text = "اولا انا فرحان فى ابرهيم عيسى لعدة اسباب منها انها احنا مش عارفينة هو سياسى ولا مفكر دينى ولا مصلح اجتماعى ولا اية با لظبط انا هتكلم فى الى هفهم فية يعنى لما يتكلم ابراهيم عيسى عن الصحابة او زوجات الرسول ص من غير علم فى برنمجة الفاشل على قناة دريم او ان يعيب فى صلاح الدين الا يوابى مش كل دة يستهل علية الحبس والجلد والضرب بالجرمة القديمة فعلا ان ربك للا بمرصاد وبعد كدة محدش عارفة سنى ولا شيعى ولا اى ملة علشان كدة انا فرحان"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 7
subject = "لا نخاف من سجون وكلاب الطاغية"
author = "برضة لا"
text = "وما الفرق بين الحياة خارج السجن او داخلة<br />البلد كلها بقت سجن كبير - شعب جائع يتسول طعامة من دول العالم<br />وقيادة دولة فاشلة اختزلت الشعب المصرى وعددة 80 مليون الى الفين من السماسرة وتجار العقارات والمحتكرين وانشات لهم اثتثمارات عبارة عن صالات ديسكوا وخمارات ومواخير وفنادق وشاليهات فى الساحل الشمالى ومارينا وشرم الشيخ والغردقة - اليست تلك اماكن اثتثمار النظام والحكم الفاشل<br />بينما كل المدن المصرية تغرق فى اكوام الزبالة والبطالة وطوابير الخبز من اسكندرية لاسوان<br />اين الاثتثمارات فى كفر الشيخ وفى طنطا والنصورة واسيوط وقنا والاقصر واسوان<br />هل مصر هى فقط شرم الشيخ والساحل الشمالى<br />اصبح لا احد يخاف السجن<br />فليعتقلونا كلنا<br />على الاقل يطعموننا"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 8
subject = "كاس فى صحة سيادتة"
author = "شقلوب"
text = "فى السبعة وعشرين سنة الماضية التى تولى سعادتة الجلوس على كرسى حكم المحروسة او المهروسة فى نفس المدة تبدل اربع رؤساء لامريكا وتبدل خمس رؤساء وزارة لبريطانيا العظمى وخمسة رؤساء لجمهورية فرنسا وخمسة رؤساء وزراء لاسرائيل والهند وباكستان ومع ذلك لم ينهار اقتصاد بلدهم ولم تنهار البورصة ولا انهار اليورو والاسترلينى والدولار<br />انما قاضى النظام الصالح رأى ان ابراهيم عيسى كتب ان سيادتة عندة زغطة - وكان سيادتة لما ييجى لة زغطة النيل هيبطل يجرى من اسوان لدمياط والشمس هتتوقف عن الدوران وهتشرق من الغرب وهتحصل زلازل ورعود وبرق وعواصف<br />ازاى الفاسق المارق يكتب ان سيادتة مريض وانة هيموت - يا نهار اسود يا ولاد - يموت ازاى - طيب والبورصة - بورصة اية<br />طيب والبورصة دى لمين وهتنهار لية<br />سيادتة عندة صحة ما شاء اللة ولا محمد على كلاى او ليستون وحش الحلقة وبيرفع 500 كيلوا حديد نطر ويجرى فى المارثون فى المانيا وفى فرنسا<br />صحتة ما شاء اللة اقوى من اى ثور ولكن مخة......ز<br />المهم بعد سجن ابراهيم عيسى دعونا نشرب كاسين مية لفت على صحة سيادتة البمب ونتذكر قصة سيدنا نوح ونوصى وزير التربية ان يدرس فى المقررات الدراسية قصة سيدنا نوح وانة عمر فى الارض 950 سنة<br />ودقى يا مزيكة"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 9
subject = "مبارك ثم ابنة سوف يكونون على الاكتاف رغم كيد الحاقدين"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "مهما تشتموا و مهما تسبوا و مهما تكتبوا و مهما تفعلون هباء<br />الرئيس مبارك سوف يكون رئيسا عليكم رغم انوفكم<br />و ابنة جمال ايضا سوف يكون الرئيس القادم باذن اللة تعالى<br />اشربوا من البحر<br />طظظظظظظظظظ فيكم ز طظ فى اللى علموكم الحقد و الكراهية و الغباء<br />رمضان كريم و كل سنة و انتم بكل خيبة و حقد و كراهية<br />و (كل سنة و شعب مصر الطيب المؤمن الحق بخير رئيسا و شعبا)<br />و ارق التهانى لكل مصر بعيد الفطر المبارك!!!"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 10
subject = "الاوساخ هيظلوا طول عمرهم اوساخ ؟حتى و لو اغتسلتم بماء زمزم"
author = "ممدوح زكى زخارى جرجس_الاسكندرية مصى"
text = "انا لدى من الشجاعة لاكتب اسمى<br />اية شجاعة عندكم لتخافوا تكتبوا اسمائكم الحقيرة يا حثالة اللة فى الارض<br />حقدكم و كراهيتكم و غبائكم جعالكم دائما محتقرين فى الارض و السماء بازن اللة تعالى<br />اذدرائكم و تهجمكم على الاديان و العقائد الاخرى يعطى للاخرين الحق و كل الحق للرد عليكم و مهاجمة دينكم ايضا<br />انتم البادئين و اخشى ان تكون العواقب غير سارة<br />من اجل الاسلام و المسيحية اكتفوا بعدم الزج بالاديان و العقائد فى اية مداخلات<br />و السلام على من اتبع<br />و اطيب التهانى بعيد الفطر المبارك الى جميع ابناء مصر من الاخوة المسلمين<br />(و كل سنة و انتم بخير)"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 11
subject = "فى زمن الخديوى توفيق - ولمنع انهيار البورصة"
author = "زخارى الخارى على نفسة"
text = "كان المتبع والمفروض انهم يضيفوا خانة بجانب اسعار اسهم البورصة فية درجة حرارة سيادتة - وعدد ضربات القلب - وضغط الدم - والحالة المزاجية لسيادتة - ونسبة السكر فى الدم - علشان تشترى وتبيع وهى مطمنة<br />اما المدعو زخارى الارثوذكسى - روح يا ولد العب بعيد - شوف لك موقع من المواقع بتاع خنازير المهجر اكتب فيها"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 12
subject = "100 الف خنزير فى مقلب زبالة القاهرة - هرب منهم خنزير"
author = "صالح"
text = "انت هربت من المقلب لية يا زخارى<br />هناك الاكل كتير والشرب كتير وبتوع الوطنى برضة كتير<br />امك تناشدك العودة<br />عد يا زخارى<br />خليك هناك مع القديسين والرهبان ذلك افضل"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 13
subject = "الى زخاري"
text = "بالنسبة للحكم يا زخاري<br />فالله قال في القران<br />قل اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتزل من تشاء<br />يعني قضية الحكم دي محسومة قرأنيا<br />ربنا سبحانه وتعالى هو الذي يولي من يشاء<br />فاحنا المسلمين عارفين هذه الحقيقة واذا كان ربنا سبحانه وتعالى كاتب ان جمال مبارك يحكم فلازم حيحكم زي ما حصل في سوريا والاردن والمغرب ما هياش مشكلة بالنسبالنا<br />ولكن هذا لا يمنع من انك انسان واطي وسافل وحقير<br />والماما بتاعة انت بتروح تغفر عند مرقص عزيز الاسكندراني النجس<br />وحياتك خليها تشوفلها قسيس عليه القيمة شوية<br />لحسن مرقص عزيز دا بيشتغل مع خنازير المهجر"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 14
subject = "رد على زخاري في قوله انا لدى من الشجاعة لاكتب اسمى"
author = "من مديرية امن اسكندرية"
text = "والله يا زخاري دا موضوع مشكوك فيه<br />لانك جبان وممكن تكون منتحل اسم واحد تاني<br />بالك انا لو متأكد ان دا اسمك<br />اجيبك هنا مديرية امن اسكندرية واخلي العساكر يقلعوك اللباس ويضربون على طيزك<br />لكن حرام اظلم واحد تاني لاني مش متأكد ان دا اسمك<br />سلام"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 15
subject = "الى زخارى وامثالة والمؤجرين على حساب ما يسمى الحزب الوطنى"
author = "اى واحد"
text = "اولا يا زخارى نحن شباب مصرى قومى لا ننتمى الى اى احزاب كروتونية او صورية او لزوم الديكور لعمل شرعية لنظام حكم فاشل بدون شرعية قانونية ويعتمد على التزوير والبلطجة<br />نحن شباب قومى مصرى نؤمن ببلدنا وباصلاحها واعادتها الى الواجهة الحضارية بين امم الارض<br />اما ان تظهر فجأة بكلام وشتيمة سوقية وتدخلنا فى مهاترات شتيمة بين الاديان لتخرج المعلقين عن موضوع الحوار الاصلى فهذة من تدريب كوادر الحزب الكرتونى اياة<br />معلوم انك من كوادر الحزب اياة وانهم بيعطوك خط نت سريع ببلاش وتقعد تعلق وتمجد فى مخبول يحلم ان يحكم مصر<br />دا بعيد عن شنب الكبير فى اهلك<br />مصر ولادة وعفية وفيها شباب رجالة وطنيون وعارفين مصلحتها فين<br />فيها مثقفوا الاخوان الجدد الجدار الحامى الاخير لمصر<br />وفيها الشباب القوميون بتوع 6 مايو"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 16
subject = "ضع عنوان التعليق"
text = "بسم الله الرحمن الرحيم وجادلهم بالتى هى احسن يا جماعة الا سلام دين حوار واخلاق اولاء وهذا كلة اساة للاسلام قبل اى شى فاستسمحكم ان تتعلموا الادب من من علم الادب للبشرية سيدنا محمد علية افضل الصلاة واسلام وكل سنة وانت طيبين وربنا يهديك يا عم زخارى"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"

[[comments]]
order = 17
subject = "ربنا اهدى القوم الجاهلين الظالمين؟"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "لندعوا جميعا اللة تعالى ان يهدى القوم الجاهلين الظالمين<br />انة مستجيب الدعاء<br />رمضان كريم و عيد فطر سعيد و كل عام و مصرنا جميع بخير و سلام بلا حقد"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190606/http://masr.20at.com:80/newArticle.php?sid=17754"
