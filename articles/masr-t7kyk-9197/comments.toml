subject = "العفو الدولية تؤكد وجود 18 الف معتقل بلا محاكمة فى"
author = "ابو فهد"
posted = "2008-05-28"
text = "نشرت جريدة الخليج الاربعاء 28 مايو<br />اكدت منظمة العفو الدولية امس وجود نحو 18 الف معتقل فى السجون المصرية بلا تهمة او محاكمة وذلك غداة اعلان تمديد العمل بقانون الطوارىء فى مصر<br />وفى تقريرها السنوى قالت المنظمة المدافعة عن حقوق الانسان ومقرها لندن ( لا يزال نحو 18 الف شخص معتقلين بلا اتهام او محاكمة بامر من وزارة الداخلية بموجب قانون الطوارىء واضافت ان معظم هؤلاء محتجزون فى ظروف سيئة ويلقون معاملة قاسية ولا انسانية ومهينة ويعتقد ان مئات منهم يعانون من امراض مثل السل والامراض الجلدية واستنادا الى المنظمة فان الكثير من السجناء لا يزالون محتجزين رغم صدور احكام قضائية ببرائتهم واوامر متكررة بالافراج عنهم"
archived = "2010-03-14"
