text = "المثل بيقول --- ايش ياخد الريح من البلاط<br />عايزين يبقوا دولة جباية زى المماليك زمان<br />ما كان عندهم مصانع بتجيب دخل للخزينة العامة وباعوها زى الاسمنت والبيبسى كولا وغيرها<br />ودلوقتى عايزين يلموا ضرايب من مين ياحسرة<br />يبقوا ييجوا يقابلونى فى سوق الجرسة<br />البركة نشفت وبانت قراميطها"
