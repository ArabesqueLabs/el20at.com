subject = "اول مره ......"
author = "هووووووووووووووووووبه"
posted = "2007-04-21"
text = "الموضوع جميل يا حاجه مني واول ما قريت الراس الموضوع عرفت انه ليكي , بعد موضوع دمعه لله ودا انا دمعت<br />حسسني اد ايه انا ضعيفه ونبهني لحاجات كنت غافله عنها بخصوص الدموع مانت في شهر رمضا ن اللي فات<br />كنت تعبانه ومينفعش اصوم مسكت اذكار الصباح بعد الاان وتنيتني اقره فيها معرفش والله ايه اللي حصلي كميه دموع رهههههههههههههيبه و خصوصا بعد الدعاء تمنيت من ربي اني اموت اللحظه دي ومعش تاني كانت اروع لحظه في حياتي كلها انا بقول كدا عشان اخر حديث ذكرتي اول مره اسمعه الحمد لله اني عرفته ميرسي ليكي ومتعينا علي طول كدا يا بنتي . سلام يا قمر"
