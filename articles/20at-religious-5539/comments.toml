text = "أختي منى جزاك الله خيرا ورزقك حب الله وخوفه كما يرضيه.<br />هناك خطأ في الآية: \"وخافون إن كنتم مؤمنين\" آل عمران ، 175<br />وخطأ آخر: \"والذين يؤتون ما آتوا.....\"<br />أرجو أن تحرصي يا أختي على نقل الآيات بدقة فالمعنى يتغير في كل من هذين الخطئين وهذا خطير.<br />بارك الله فيك وجزاك خيراً."
