[[comments]]
order = 1
subject = "هل اجد عندكم ما اصبو اليه"
author = "راغبة في المعرفة"
posted = "2007-04-21"
text = "عربية حتى النخاع مسلمة لكن للاسف بالوراثة فليس بيني و بين الاسلام الا الاسم و اللقب، اعرف الكثير عن الاسلام قرات الكثير و احفظ الكثير من الصور و الايات لكن لا افهم، نعم لا افهم او بالاحرى لا احس..عندما اقرا القرأن اتمنى من كل قلبي ان ابكي ان اتخشع ان افهم اتمنى ان يصير حياتي و ان التزم بكل تفاصيله لكني لا استكيع ان افعل رياءا و لا استطيع ان ان افعل شيئا من غير اقتناع، اجد في الاسلام ديني و حياتي لكن ايضا هناك بعض المفارقات التي لا افهمها من سنة و شيعة و الفرق بين كل هذه الفرق هل هي العلاقة كما في النصرانية بين الكنيستين، هل لا اتمعن القران لاني عاصية لاني اعرف ان الله عندما لا يحب قوما يغلق ابصارهم و قلوبهم عن القرأن لكني لم افعل شيئا او بالاحرى انا ارغب في المعرفة و لست صادة عنها كيف افعل و ما هو السبيل للتخشع و للتمعن ارجو الافادة و شكرا"
