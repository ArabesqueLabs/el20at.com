order = 0
subject = "تحية لقضاء مصر الشامخ"
author = "أنا المصرى"
posted = "2008-12-01"
text = "فعلا شهر نوفمبر هو عيد لمصر فقد أوضح كم بعد النظام المصرى بعيد عن شعبه وأصبح يتصرف بغرور شديد فى غياب أى رقابة حقيقية أو أعتراض من مجلس الشعب اللى مفروض أنه أختير من الشعب للحفاظ على مصالحه والتعبير عنه.<br />تحية لقضاة مصر العظماء الذين نرفعهم فوق الأعناق."
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044850/http://masr.20at.com:80/newArticle.php?sid=18681"

[[comments]]
order = 1
subject = "قضاء بطىء وفاسد ونخرة السوس ومسيس وبينفذ احكام الس"
author = "مواطن"
posted = "2008-12-02"
text = "مين اللى انة قضاء نزية - دى اكبر اكذوبة<br />طيب لما هو نزية كدة - لية اتحكم بالبراءة على بتاع العبارة اللى غرق 1500 مصرى فى البحر الاحمر وحكم بالبراءة على بتاع اكياس الدم وشركة هادلينا<br />مين اللى حكم بالسجن على ايمن نور ورؤساء التحرير والمدونون والاخوان ولا توجد اى ادلة ضدهم<br />مين اللى ان القضية تقعد فى الحكم او المحكمة عشر سنين لما القاضى يحكم فيها<br />القضاء المصرى من اسوأ القضاء فى العالم بنظامة الروتينى الجامد وبيقلد قضاء فرنسا سنة 1800 ميلادية وبعدين الاحكام الستة دى مش من المحاكم دى من المحكمة او القضاء الادارى<br />والقضاء الادارى منفصل ووكل شغلة انة بيفسر القوانين الادارية ومدى مطابقتها للدستور انما لا يحكم بين الناس<br />فلا يجب الخلط بين قضاء فاشل وقضاء النظام الادارى"
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044850/http://masr.20at.com:80/newArticle.php?sid=18681"
