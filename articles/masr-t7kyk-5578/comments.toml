text = "يرضيكوا يا جماعة الاستاذ ابراهيم سمير يكتب مقال عن الاندية التى تحمل اسم ( النادى الأهلى ) ومايجبش سيرة النادى الأهلى المصرى اللى هو أشهرهم وأقدمهم وأعرقهم وأفضلهم وأحسنهم وألعبهم و ........<br />وقال إيه \" أبرزهم أهلي جدة السعودي \" يا راجل حرام عليك طيب عد البطولات السنهة دى بس على الاقل ورد عليا"
