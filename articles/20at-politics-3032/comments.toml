subject = "حد الردة لا أصل له"
author = "EPS"
posted = "1970-01-01"
text = "إما أنك تؤمن بالقرآن كله من أوله لآخره و كفر بكل ما يخالفه من أحديث مكذوبة على لسان الرسول تناقض القرآن و تم وضعها في فترة الدولة العباسية لتعطي غطاءً شرعياً لعمليات التصفية التي قامت بها الدولة العباسية (تكفير المعارض ثم قتله) ،،، أو انك تؤمن بحديث (من بدل دينه فاقتلوه) الذي يتناقض مع سماحة القرآن (لا إكراه في الدين) ، (من شاء فاليؤمن و من شاء فليكفر)<br />أما إذا تعارضت أقوال شيوخ السلاطين من أمثال القرضاوي و غيره مع كلام الله ، فالقرضاوي يذهب هو و جلابيته الى أقرب مكب زبالة لأنه فضل نقل الكلام الفظيع الذي يناقض القرآن جيلاً عن جيل بدلاً أن يؤدي مهمة العالم الشرعي و هي تصفية الدين من كل مايعلق به من شوائب تذهب عكس القرآن"
archived = "2010-03-14"
