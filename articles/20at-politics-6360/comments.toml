author = "واحد إتخنق"
posted = "2007-06-22"
text = "فعلا مغلطش ..<br />ماهو ده اللى بيحصل بجد لينا !<br />شعب عبيط و أهبل معندهوش غير الصوت العالى و خلاص و ساعة التنفيذ يجرى و يقولك و أنا مالى ..<br />و انا واحد من الشعب ده .. بعترف بسلبيتى .. بس بحاول أتغير ..<br />يمكن مش هتغير غير لما أهاجر و أسيب الشرق الأوسط كله ..<br />إدعولى أعرف أهاجر علشان خلاص إتخنقت .."
