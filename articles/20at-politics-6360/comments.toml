order = 0
subject = "من يؤمن بهذ الكلام فهو كذلك .. .أما الأغلبية فلا"
author = "محمد السيد"
posted = "2007-06-19"
text = "إيه ده؟؟<br />بأي منطق وبأي حكم اتكتب الكلام ده ؟<br />بدءا من الحديث الأسطوري ... اللي مش حأتكلم عن شرعيته الدينية .. وانتهاء بروح بائسة مهزومة مهينة ....<br />مش عارف بأي منطق ممكن تتنشر حاجة زي دي ... مؤلم للغاية أن يكون شيء بهذا البؤس والسوء ينشر هنا في عشرينات ....<br />عم هواري ... من مدة .. لم ينشر في عشرينات حاجة تخجلني وتصغرني وتحسسني بفشل المسئولين علي الموقع في الاختيار زي اللي منشور فوق ده ...<br />عذرا علي العصبية ..لكن مش عارف أمنع نفسي من التعليق الحاد ده ....<br />مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\"بس مش أوي كده\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي ....<br />www.mesh7askot.blogspot.com"
archived = "2010-03-14"
