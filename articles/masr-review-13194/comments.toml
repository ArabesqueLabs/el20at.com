text = "زمان ايام صلاح جاهين<br />كانت افقر طبقة فى مصر هم عمال التراحيل<br />وعمال التراحيل دول ناس غلابة لا يملكون ارضا ويحمل كل واحد فاس على كتفة ويجلس ينتظر المقاول لياخذهم ليفحتوا ترعة او يبنوا جسر وكانوا ينامون فى الطل ويموتون فى العراء ويدفنوا حيث ماتوا بعيدا عن اهلهم<br />كان اجر عامل التراحيل فى فترة بداية الستينات 4 اربعة قروش صاغ<br />تخيل عامل اجرة اليومى اربعة قروش صاغ فى حين كيلوا اللحمة وقتها بعشرين قرش<br />امر الرئيس عبد الناصر برفع الاجر من اربعة الى خمسة وعشرين قرشا<br />يعنى عبد الناصر رفع اجرة 6 مرات<br />بحيث يستطيع ان يشترى لحمة كل يوم لو عايز<br />اة<br />اة"
