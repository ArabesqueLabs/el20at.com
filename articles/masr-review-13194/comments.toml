text = "بعد حرب 73<br />كان هناك قرار غبى جدا من النقيب السادات التى تولى الرئاسة فى غفلة من الزمن<br />هذا القرار الغبى الذى دمر اقتصاد مصر هو انة<br />كل من شارك فى الحرب من العمال والفلاحين وليس لة وظيفة يوظف فى الحكومة وتخيل ان الجيش كان بة مليون وربع المليون اضيفوا فجاة الى الوظائف الحكومية والقطاع العام<br />كانت مدرستى الثانوية فيها 27 مدرس وستة فراشين<br />بعد قرار السادات كان فيها 27 مدرس و17 فراش<br />فما بالك بالمصانع<br />وحتى المساجد<br />كل مسجد عين فية خمسة اوستة من العساكر المسرحين وتركوا ارضهم وتوظزفوا فى الحكومة"
