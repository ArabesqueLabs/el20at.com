posted = "2010-02-27"
text = "لو كان صلاح جاهين حيا هذه الأيام الغبرة لمات ألف مرة من الاكتئاب .. فقط إذا قرأ بعض التعليقات المدونة هنا .. واحد بيسأل يطلع مين صلاح جاهين ... والتانى دخل الشيخ الغزالى فى الموضوع .. والتالت قلبها ما بين علمانية ومش عارف إيه .. والرابع مايعرفش عن الموضوع غير ياواد ياتقيل .. والخامس ماعرفش إيه وأبصر إيه ..<br />حقيقى حاجة تخلى الواحد موش يكتئب بس .. لأ يبقلاى هو المادة الخام للاكتئاب .. واضح من التعليقات إن كلهم مصريين والحمد لله الذى لايحمد على مكروه سواه ..<br />وهكذا بعد 10 سنوات من القرن 21 نجهد النصب التذكارى للجهل والغفلة والاغتراب والتشوش والغيبوبة والجمود والتخلف والنظرة الأحادية المتبلدة منتصبا شامخا فى مصر نباهى به أشقاءنا من حولنا خصوصا فى الجزائر .. وتحيا الوحدة العربية رز على ملوخية وسلم لى على المترو"
archived = "2010-03-14"
capture_url = ""
