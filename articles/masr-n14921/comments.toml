subject = "واقعة سرقة محل فاضي من اجل مفتاح الكهرباء"
author = "مفروم"
text = "ايه رايك يا اخ يا سر ابو العلا ان عندي محل فاضي تم تكسير القفل بتاع بابه ولم يجد السارق الا مفتاح الكهرباء وتم سرقته"
archived = "2008-04-01"
