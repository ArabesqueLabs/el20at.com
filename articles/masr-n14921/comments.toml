text = "عنترة<br />أرسل هذا التعليق بواسطة : أحمد زهران - صحفي<br />والله يا أستاذ ياسر لا أدري ما أقول ، ولكن الشاعر كفانئ مئونة القول، اقرأ واسمع ووصلها لكل الناس يمكن يعرفوا في يوم يمشّوا عنترة.. يقول الشاعر:<br />هذي البلاد شقة مفروشة... يملكها شخص يسمى عنترة....<br />يسكر طول الليل عند بابها...<br />ويجمع الإيجار من سكانها...<br />ويطلب الزواج من نسوانها...<br />ويطلق النار على الأشجار، والأطفال، والعيون، والضفائر المعطرة...<br />هذي البلاد.. كلها مزرعة شخصية لعنترة...<br />سماؤها.. هواؤها.. نساؤها.. حقولها المخضوضرة...<br />كل الشبابيك عليها صورة لعنترة...<br />كل الميادين هنا تحمل اسم عنترة...<br />عنترة يقيم في ثيابنا...<br />في ربطة الخبز...<br />وفي زجاجة الكولا...<br />وفي أحلامنا المحتضرة...<br />في عربات الخس والبطيخ... في الباصات...<br />في محطة القطار، في جمارك المطار...<br />في طوابع البريد، في ملاعب الفوتبول، في مطاعم البيتزا....<br />وفي كل فئات العملة المزورة....<br />مدينة مهجورة مهجرة....<br />لم يبق فيها فأرة، أو نملة، أو جدول أو شجرة...<br />لا شيء فيعا يدهش السياح إلا الصورة الرسمية المقررة، للجنرال عنترة...<br />في غرفة الجلوس، في ميلاده السعيد، في قصوره الشامخة الباذخة المسورة...<br />ما من جديد في حياة هذه المدينة المستعمرة....<br />فحزننا مكرر، وموتنا مكرر، ونكهة القهوة في شفاهنا مكررة...<br />فمنذ أن ولدنا ونحن محبوسون في زجاجة الثقافة المدورة...<br />واللغة المدورة...<br />ومذ دخلنا المدرسة ونحن لا ندرس إلا سيرة ذاتية واحدة تخبرنا عن عضلات عنترة...<br />ومكرمات عنترة...<br />ومعجزات عنترة...<br />ولا نرى في كل دور السينما إلا شريطا عربيا مضجرا يلعب فيه عنترة...<br />لا شيء في إذاعة الصباح نهتم به.. فالخبر الأول فيها خبر عن عنترة...<br />والخبر الثالث والخامس والتاسع والعاشر... فيها خبر عن عنترة...<br />لا شيء في البرنامج الثاني سوى عزف على القانون من مؤلفات عنترة...<br />ولوحة زيتية من خربشات عنترة...<br />وباقة من أردأ الشعر بصوت عنترة....<br />هذي بلاد يمنح الكتّاب فيها صوتهم لسيد المثقفين... عنترة...<br />يجمّلون قبحه... يؤرّخون عصره...<br />وينشرون فكره.. ويقرعون الطبل في حروبه المظفرة....<br />لا نجم فوق شاشة التلفاز إلا عنترة.. بقده المياس، أو ضحكته المعبرة...<br />يوما بزي الدوق والأمير...<br />يوما بزي الكادح الفقير...<br />يوما على دبابة روسية.. يوما على مجنزرة....<br />يوما على أضلاعنا المكسرة.....<br />كل عام وشعبا الخاضع القانع....<br />الخانع الخاشع...<br />المطبل المهلل....<br />الباذل الروح والدم فداء... لمن لا يستحق....<br />بألف ألف خير<br />_________________________________________________________________<br />أولاً شكراً للأخ أحمد زهران - صحفي .<br />بداية لقد أعجبني قول الشاعر عن ( عنترة ) .. ووصفه بأوصاف هي بالأساس لاتنطبق عليه ( كما فهمت إلاّ إذا كان فهمي مغلوطاً ) ..<br />المهم ،،،<br />فأنا من خلال قراءتي لهذه الأبيات الشعرية المعبرة .. أحسست بان الشاعر أراد أن يصور لنا صورة ( عنترة ) كما هي موضحة في الأبيات أعلاه .. حيث شبهه بإنسان يحب أن يتملك لكل شيء .. محب لذاته .. في أي زمان ومكان موجود ..<br />الكل يعرفه ولا أحد يجهله .. لا أحد يسلم من شره الفظيع .. صوره منشورة في كل مكان ( على الأعمدة الكهربائية .. على جدران الشوراع العامة، في الأزقات بين البنايات، على المحلات، جميع أفواه الناس تتحدث عنه، .. الخ ) ..<br />أطلب من الاخ / زهران .. أن يشرح لي هذه الأبيات شرحاً وافياً كاملاً متكاملاً من جميع الجوانب ..<br />لأنني أحمل في مخيلتي شرح لكل بين من هذه الأبيات .. وحدسي بأن ( عنترة ) هو .........."
