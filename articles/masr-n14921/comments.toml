[[comments]]
order = 6
subject = "عنترة"
author = "أحمد زهران - صحفي"
text = "والله يا أستاذ ياسر لا أدري ما أقول ، ولكن الشاعر كفانئ مئونة القول، اقرأ واسمع ووصلها لكل الناس يمكن يعرفوا في يوم يمشّوا عنترة.. يقول الشاعر:<br />هذي البلاد شقة مفروشة... يملكها شخص يسمى عنترة....<br />يسكر طول الليل عند بابها...<br />ويجمع الإيجار من سكانها...<br />ويطلب الزواج من نسوانها...<br />ويطلق النار على الأشجار، والأطفال، والعيون، والضفائر المعطرة...<br />هذي البلاد.. كلها مزرعة شخصية لعنترة...<br />سماؤها.. هواؤها.. نساؤها.. حقولها المخضوضرة...<br />كل الشبابيك عليها صورة لعنترة...<br />كل الميادين هنا تحمل اسم عنترة...<br />عنترة يقيم في ثيابنا...<br />في ربطة الخبز...<br />وفي زجاجة الكولا...<br />وفي أحلامنا المحتضرة...<br />في عربات الخس والبطيخ... في الباصات...<br />في محطة القطار، في جمارك المطار...<br />في طوابع البريد، في ملاعب الفوتبول، في مطاعم البيتزا....<br />وفي كل فئات العملة المزورة....<br />مدينة مهجورة مهجرة....<br />لم يبق فيها فأرة، أو نملة، أو جدول أو شجرة...<br />لا شيء فيعا يدهش السياح إلا الصورة الرسمية المقررة، للجنرال عنترة...<br />في غرفة الجلوس، في ميلاده السعيد، في قصوره الشامخة الباذخة المسورة...<br />ما من جديد في حياة هذه المدينة المستعمرة....<br />فحزننا مكرر، وموتنا مكرر، ونكهة القهوة في شفاهنا مكررة...<br />فمنذ أن ولدنا ونحن محبوسون في زجاجة الثقافة المدورة...<br />واللغة المدورة...<br />ومذ دخلنا المدرسة ونحن لا ندرس إلا سيرة ذاتية واحدة تخبرنا عن عضلات عنترة...<br />ومكرمات عنترة...<br />ومعجزات عنترة...<br />ولا نرى في كل دور السينما إلا شريطا عربيا مضجرا يلعب فيه عنترة...<br />لا شيء في إذاعة الصباح نهتم به.. فالخبر الأول فيها خبر عن عنترة...<br />والخبر الثالث والخامس والتاسع والعاشر... فيها خبر عن عنترة...<br />لا شيء في البرنامج الثاني سوى عزف على القانون من مؤلفات عنترة...<br />ولوحة زيتية من خربشات عنترة...<br />وباقة من أردأ الشعر بصوت عنترة....<br />هذي بلاد يمنح الكتّاب فيها صوتهم لسيد المثقفين... عنترة...<br />يجمّلون قبحه... يؤرّخون عصره...<br />وينشرون فكره.. ويقرعون الطبل في حروبه المظفرة....<br />لا نجم فوق شاشة التلفاز إلا عنترة.. بقده المياس، أو ضحكته المعبرة...<br />يوما بزي الدوق والأمير...<br />يوما بزي الكادح الفقير...<br />يوما على دبابة روسية.. يوما على مجنزرة....<br />يوما على أضلاعنا المكسرة.....<br />كل عام وشعبا الخاضع القانع....<br />الخانع الخاشع...<br />المطبل المهلل....<br />الباذل الروح والدم فداء... لمن لا يستحق....<br />بألف ألف خير"
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401115905/http://masr.20at.com:80/newArticle.php?sid=14921"

[[comments]]
order = 7
subject = "سياسة الحكومة"
author = "الحكومة"
text = "كويس يا استاذ ابو العلا هذا يتمشا مع سياسة الحكومة<br />انتوا قولوا اللي انتوا عايزينه<br />والحكومة تعمل اللي هي عايزاه<br />اللي نفسه في حاجه يقولها مفيش مشكلة"
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401115905/http://masr.20at.com:80/newArticle.php?sid=14921"

[[comments]]
order = 8
subject = "الحكومة قالت كلمتها"
author = "شويكار"
text = "أخي الكريم شفت الحكومة قالت كلمتها خلاص يعني كل اللي احنا بنعمله أو بمعنى أصح اللي بنقوله أهو كلام وبس تنفيس عن الشعب يعني ... لكن في النهاية اللي الحكومة عايزة تعمله بتعمله .... واحنا مش في ايدينا غير الكلام .. وحسبنا الله ونعم الوكيل .."
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401115905/http://masr.20at.com:80/newArticle.php?sid=14921"

[[comments]]
order = 9
subject = "الشعب يقول الي هوا عايزه والحكومة تعمل اللي هيا عايزاه"
author = "الحكومة"
text = "الشعب يقول الي هو عايزه واهي جرايد المعارضة في كل مكان<br />قولوا اللي انتوا عايزينه الحكومة بتاخد رشاوي جمال مبارك حيورث الحكم الحكومة حرامية الحكومة نصابين الحكومة بيبيعوا الدولة<br />مفيش مشكلة<br />والحكومة تعمل الي هيا عايزاه<br />تغير الدستور<br />تبيع ممتلكات الدولة<br />تبيع اراضي الدولة<br />تلغي قوانين<br />تحط قوانين<br />الحكومة بتعمل اللي هي عايزاه"
archived = "2008-04-05"
capture_url = "https://web.archive.org/web/20080405173906/http://masr.20at.com:80/newArticle.php?sid=14921"
