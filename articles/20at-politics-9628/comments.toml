subject = "كلام غير موضوعي"
author = "هنا زين (خليجية من قطر)"
posted = "2008-07-16"
text = "الاخ منير اسمح لي اناقشك في خلطك ما بين امرين و هو زيارة بلد ما بغرض السياحة و زيارة بلد بغرض العمل و الاقامة انا ارى ان من حق اي دولة في العالم توقيع مثل هذه التحاليل على العاملين بها و بدون تهاون و ماهي المشكلة في ذلك و ما ادخل كرامة المصريين المصونة في ذلك؟ في بلدي يجري توقيع التحاليل الطبية على جميع القادميين للعمل و من جميع الجنسيات (و اكرر جميع الجنسيات بدون تهاون او تقصير) و تتم هذه التحاليل مرتين مرة في بلد المستقدم و مرة داخل البلد للتأكيد على صحة تلك التحاليل و بعدين اسمح لي يا اخ منير ان افاجئك بهذه الحادثة التي قد توجع قلبك اكثر على المصريين و حالهم فانا من حوالي سنتين تقدمت لدراسة الماجستير في الجامعة الامريكية بالقاهرة و هي من ارقى الجامعات في مصر و كان من الشروط المكتوبة ان يقوم المتقدم بتحليل فيروس الايدز و كنت على اتم الاستعداد لذلك سواء في بلدي او في مصر و راسلت الجامعة لسؤالها اين تفضل ان اقوم بالتحليل فأذا بالجامعة الامريكية هي التي تتهاون في تنفيذ هذا الشرط و تخبرني كتابة بانه لا اهمية لذلك و لو كنت احتفظ بهذا الايميل لا رسلته لك و اخبرتني المسؤولة في مكتب الطلبة الاجانب ان هذا الشرط يستلزم تنفيذه فقط لغير العرب و انا شخصيا لم افهم ذلك و لم احب عدم تنفيذ القانون و لانقل لك صورة اخرى مما يحدث في بلدي فانا الفتاة الخليجية بنت البلد بعد تخرجي و تقدمي للعمل في المكان الذي اعمل فيه كان من شروط توظيفي فحص طبي شامل يتضمن تحليل لعدد من الفيروسات و من ضمنها فيروس الكبد و فيروس الايدز حفظنا الله و اياكم و عندما رفضت جهة الابتعاث ذهابي للجامعة الامريكية لمصر لاسبابهم الخاصة و فرضت عليا جامعة بريطانية دون ان تشترط الجامعة البريطانية اية تحاليل طبية البتة بغرض الدراسة قامت هيئة الابتعاث في بلدي بتوقيع هذه التحاليل عليا دون ادنى اعتراض مني حتى توافق الهيئة على ابتعاثي اصلا.... يا سيد منير هذا فقط لاعطائك فكرة عن مدى الرعاية الطبية و هيه للجميع و تطبق على الجميع و انا هنا سؤالي ما هو الغرض من وراء هذه المقالة الطويلة العريضة و هذا الاستفتاء الشعبي الذي قمت به يا سيد منير؟ فانت لكي تكون صحفي في موقع عشرينات يجب ان تكون بدون شك خريج جامعي اي تدربت على الموضوعية في الصحافة و كيفية التأكد من المصادر فهل كان سوف يرفض اي من الملحقيين الطبيين فاي سفارة لاية دولة الاجابة على تساؤلاتك البسيطة و لو على التلفون؟ هل كنت تقصد من وراء تلك المقالة التعرض .... لماذا؟ انا فعلا لا اعلم و لا استطيع تفسير اسباب كتابتك بهذا الشكل و اتساءل الا يوجد لا اقول رقابة بل مجرد اشراف على ما يكتب في عشرينات فا انا عندما تأتي لي احدى طالباتي يمقالة تريد مراجعتها اوجه لها اسئلة بسيطة من هو جمهورك؟ ماذا تريدين اخباره؟ تحري الصدق في كتابتك و قدمي ما تريدين بشكل منظم و مدعوم بالادلة....<br />ارجو الرد عليا يا سيد منير في تساؤلاتي البسيطة لك فأنا اكن لموقع عشرينات الاحترام الشديد و للعاملين به و هم من اصدقائي الشخصيين الاقرباء على قلبي"
