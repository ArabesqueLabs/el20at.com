order = 2
subject = "و ايه المشكلة؟"
author = "مصري يعمل في قطر"
posted = "2008-07-16"
text = "والله أنا مع الاخت القطرية.. مافيش أي مشكلة في عمل هذه التحاليل في حالة العمل و الاقامة بأي دولة في العالم ..ازاي تتوقع ان أي دولة تفتح أبوابها لواحد أجنبي مريض هايخالط المواطنين في المحلات و المستشفيات و السينيمات .. عاوز اقول لك ان ده كمان بيحصل في مصر .. أنا كنت شغال في مؤسسة multinational في مصر و كان معايا أجانب شغالين فيها و ماكانوا يحصلوا أو يجددوا تصريح العمل الا بعد عمل التحاليل دي في هيئة الامصال أو مركز قومي تابع وزارة الصحة في الدقي .. احنا بس اللي دايما نحب نحسس نفسنا اننا لازم نبقي مختلفين علشان مصريين !!! علي فكرة ..منتهي الاحترام ان احنا نحترم و نتقبل الغير طالما مافيش حاجة بتيجي علي الكرامة .. شكرا"
