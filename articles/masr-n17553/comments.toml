[[comments]]
order = 0
subject = "السؤال هو - ما هو توجهنا القومى - هل اصبحنا يهود ؟"
author = "السطوحى"
posted = "2008-09-11"
text = "ركبت القطار من محطة مصر فى القاهرة قطار الصعيد من على رصيف 16 وسافرت جنوبا لمدة 10 ساعات متواصلة لانزل فى محطة احد المدن<br />ركبت تاكسى قديم ميكروباص بالنفر من المحطة واتجهت شرقا حيث نزلت على شاطىء النيل وعبرت معدية عبارة عن صندل متهالك يجر بجنزير ليعبر من الضفة الغربية الى الضفة الشرقية ركبت المعدية مع بعض الصعايدة ومعهم الحمير والجواميس ونسوة عائدات من السوق<br />بعد عبور النهر وجدت ركوبة فى انتظارى عبارة عن حمار ضعيف علية بردعة قديمة وسار بى على طريق شبة صحراوى الى قرية صغيرة فى بطن الجبل<br />فى مدخل القرية مدرسة ابتدائية متواضعة جدارانها من الطوب الطينى ومرشوشة بالجير<br />دخلت المدرسة<br />اولاد صغار فى ابتدائى وبنات فى ملابس رثة قديمة<br />هنا الهيكل العظمى لمصر<br />صلب المجتمع بلا تزويق ولا رتوش<br />مصر الحقيقية او حتة من مصر الحقيقية<br />دخلت احد الفصول<br />سالت<br />من هم يا اولادى اعداء مصر ؟<br />رد الاطفال كلهم صبيان وبنات وبصوت واحد<br />اسرائيل وامريكا يا استاذ<br />ملحوظة<br />تلك ليست قصة ولكنها حقيقة<br />التعليق<br />لماذا تتخذ الذين يسمون نفسهم قيادة مصر هذة المواقف - هل اصبحت قيادة مصر يهودية"
archived = "2008-09-13"
capture_url = "https://web.archive.org/web/20080913230541/http://masr.20at.com:80/newArticle.php?sid=17553"

[[comments]]
order = 1
subject = "مشكلة مصر مع حماس هى العسكرى الاسرائيلى الاسير شال"
author = "يا ريت اعرف"
posted = "2008-09-12"
text = "مصر او حكومة مصر عايزة او تعهدت لاسرائيل انها تستخدم نفوذها للتدخل لدى حماس للافراج عن العسكرى شاليط<br />الحكومة او القيادة المصرية عايزة تعطى اسرائيل رسالة محبة بافراجها عن شاليط<br />ويروح سليمان بتاع المخابرات ويرجع وحماس مش عايزة تسيبة<br />ومصر تزيد لحصار على غزة وتمنع الدخول والخروج علشان حماس تسيب شاليط<br />ومش هتسيب شاليط<br />واللى جنن القيادة السياسية فى مصر ان حماس طلبت تدخل قطر لمفاوضات الافراج عن شاليط مقابل افراج اسرائيل عن معتقلين من حماس<br />يعنى مصر تطلع برة اللعبة خالص<br />زى ما طلعت من لبنان وقطر حلت المشكلة<br />وزى ما طلعت من سوريا وتركيا بتتوسط فى المفاوضات بين سوريا واسرائيل<br />طيب اللى قاعد فى الشرم هيبقى فايدتة اية غير صفر على الشمال وبلا دور فى المنطقة<br />يبقى يزود الحصار على غزة لغاية ما يركعوا<br />انما الغزواية مش هيركعوا ومش يسلموا شاليط<br />اصل شاليط قريب او ابن تانت"
archived = "2008-09-13"
capture_url = "https://web.archive.org/web/20080913230541/http://masr.20at.com:80/newArticle.php?sid=17553"
