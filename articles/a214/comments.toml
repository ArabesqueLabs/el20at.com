[[comments]]
order = 0
subject = "موقع عشرينات"
text = "الرسالة تتكون من قسمين: الأول تم ترجمته إلي الإنجليزية والفرنسية والألمانية، ويتضمن حديثاً عاماً موجهاً للشباب في كل أنحاء العالم، يوضح الغرض من هذه الحملة، أما القسم الثاني فجاري ترجمته إلي الإنجليزية فقط، ويحتوي على معلومات وحقائق موثقة عما يحدث داخل العراق، بدءا جريمة حرب احتلال العراق (20 مارس – 9 أبريل) التي راح ضحيتها 15 ألف عراقي، حتى فضيحة معتقل \"أبو غريب\" التي كشفتها محطة سي بي إس الأمريكية 28 أبريل 2004 ."
archived = "2004-05-22"
capture_url = "https://web.archive.org/web/20040522042640/http://www.20at.com:80/article.php?sid=214"

[[comments]]
order = 1
subject = "موقع عشرينات"
text = "كما أننا نوجه عناية الجميع إلي أن التوقيعات التي سيتم تجميعها سترسل مع نص الرسالة إلي: 500 وسيلة إعلام وصحيفة أمريكية وأوروبية وآسيوية وأسترالية، كما سيتم توجيهها إلي وزارات دفاع وحكومات دول تحالف الحرب على العراق، بجانب جماعات أمهات الجنود الأمريكيين في العراق..وجماعات شبابية أمريكية وأوروبية من مختلف الأعمار والاهتمامات."
archived = "2004-05-22"
capture_url = "https://web.archive.org/web/20040522042640/http://www.20at.com:80/article.php?sid=214"

[[comments]]
order = 2
subject = "بيرو"
text = "المقال .. أسف مين اللي قال إن ده مقال الحملة المكتوبة فوق دي كارثة و عبقرية.. أنا موش عارف أعبر بس أخيرا لقينا حد بيكتب وهو بيفكر نعمل أيه علشان نخرج من اللي أحنا فيه ... ولعل مقال في موقع يكون هو الشرارة اللي تصحي الناس وتوعيهم وتخليهم يتحركوا .. أنا معاكم ويارب يهدينا وينصرنا علي أعداء الإسلام"
archived = "2004-05-22"
capture_url = "https://web.archive.org/web/20040522042640/http://www.20at.com:80/article.php?sid=214"

