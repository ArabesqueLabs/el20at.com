text = "أنا أعتقد أن أمريكا هي أكثر الدول في العالم إرهاباً فلو نظرنا إلى ما خلفه ما يدعونه إرهاباً من ضحايا كما يقولون ونظرنا إلى ما خلفته أمريكا من القتل لوجدنا أن أمريكا قتلت أكثر بكثير مما يدعونه منظمات إرهابية هذا بالإضافة إلى كون أمريكا تستعمل سلاحاً حديثا في تدمير الشعوب التي تدعي بأنه إرهابية مثل العراق وأفغانستان"
archived = "2004-06-10"
