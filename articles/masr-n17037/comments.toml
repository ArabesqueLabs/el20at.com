[[comments]]
order = 2
subject = "مين اللي سجنك كدا يا مصر"
author = "Ahmad"
text = "طوق وبيتشد على مصر واهل مصر<br />سجننونا بالحديد<br />مممممممممممم<br />يعني حاجة من هذا القبيل"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806101543/http://masr.20at.com:80/newArticle.php?sid=17037"

[[comments]]
order = 3
subject = "شفت الصورة دي"
author = "مصري حزين"
text = "أيوة شفتها و المصور واد حدق قوي و ممكن يكون فيه دم مصري<br />حتسآل ليه أقولك ياعم هو شايف إن البلد أو الحكومة أو يمكن كل المصريين عايزين يحطوا تاريخهم كله من أقدمه إلي أحدثه في خبر كان أو في غيابات المجهول و الأحسن حسب الكلام الماشي دلوقت إنسى. أنا بصراحة ما شفتش شعب بينقلب على ما ضيه زي المصريين و أقدر أحكم بذلك لأني لفيت بلاد كثيرة مش ليوم أو أثنين. فالسلسلة بتقول لك روعى تقرب هنا محظور و إنتهي. و اللبيب بالإشارة يفهم علشان قلت لك الواد ده أكيد فيه دم مصري و على الأحرى إسكندراني، و السلام."
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806101543/http://masr.20at.com:80/newArticle.php?sid=17037"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
text = "حسيت انى مخنوقه جدا لان الصوره عبرت عن القيود اللى الحكومه و النظام مصرين يربطوا رقبتنا بيها"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806101543/http://masr.20at.com:80/newArticle.php?sid=17037"

[[comments]]
