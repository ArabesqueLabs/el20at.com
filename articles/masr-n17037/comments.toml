subject = "تيجوا نبيع اثار مصر للاجانب فقط؟"
author = "ممدوح زكى زخارى _الاسكندرية-مص"
posted = "2008-09-10"
text = "فكره و خاطر يحتاجوا الى دراسة حقيقية<br />لماذا لا نبيع اثار مصر الى الاجانب و الاجانب فقط؟ و ليس العرب او المصريين؟!<br />لان الاجانب هم من خيرة الشعوب التى تقدر و تعرف كيفية الحفاظ على تاريخ الاباء و الاجداد و الاوطان معا!!!<br />و بثمن البيع نسدد ديون مصر ؟<br />خيرا من سرقة هذة الاثار و بيعها و الاستيلاء على رسوم زيارة جميع الاماكن التاريخيةو الدينيةو الاثرية بواسطة هولاكو مصر الاوحد(فاروق بوسنى خان الاول)و عصابتة الملعونة؟"
archived = "2010-03-14"
capture_url = ""
