[[comments]]
order = 16
subject = "عرفت لية اتكسرت انف ابو الهول"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-26"
text = "من يوم الوزارة الجاهلة اللى اسمها و زارة الثقافة و جميع اثار مصر من كنوز و متاحف و اثار مسكت الاشراف على الاثار و الثقافة فى مصر ؟<br />انكسرت كرامة و انف ابو الهول حزنا على ما فعلتة بهم و زارة اياة الوزير<br />خرابى عليكى يا يونسكو لو دخلك هذا مدعى الثقافة و الفن و الحضارة<br />فاروق يا حسنى ابقى تعالى بول و تبرز على قبرى اذا انتخبت لرئاسة منظمة اليونسكو<br />اتعظ من كارثة و فضيحة ال 12 صفر بتاعة جنوب افريقيا و لا نسيت يا حبيب ماما يا روقة؟<br />بالمناسبة انا مستعد اترك لك اسمى كامل و عنوانى و رقم جميع تليفوناتى لابلغ النيابة العامة اتحريك الدعوى العمومية ضدى ؟اوكى اى you agree my dear sweetheart darling ارجو ان تكون قد فهمت ها ها ها ها ها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 17
subject = "اليونسكو حقا اولى برعاية اثارنا العريقة من الوزارة"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-26"
text = "للاسف جميع الاماكن السياحية و الاثار جميعا و المتاحف تدار على اسلوب و طريقة على بابا و المليون حرامى<br />انها تكية من ليس لهم قيمة فى الحياة و المجتمع<br />هيئة اليونسكوا حقا اولى بادارة و رعاية هذة الكنوز التى لا تقدر بمال او ذهب<br />(فاقد الشيئىء لا يعطية)ياعالم يا منافقين و جهلة و مدعى الثقافة و العلم و الجميع منكم براء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 18
subject = "هيئة الاثار الاسرائيلية و لالالالالالالالالالالالا"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-26"
text = "لو اى سعيد الحظ منكم ذهب و زار و رائى كيف تدار مجموعة الحجارة و الطوب اللى تتباكى عليهم اسرائيل و تدعى فخرا بان هذة الحجارة و الطوب من تاريخهم المزور و كيف يتباكون و يحافظون علية<br />لاتى الى مصر و قتل جميع مسئولى الثقافة فى مصر و المنوض بهم رعاية الاثار المصرية و الحفاظ عليها<br />و قبل ان تدار الاثار المصرية بواسطة اليهود خيرا من اللصوص مدعى الثقافة و حافظى اثار مصر و لكنهم فى الحقيقة هم ابناء البرابرة و التتار مدمرى الاثار و حارقى الادب و الثقافة و على راسهم المدمر (فاروق خان الاول) الحفيد الاخير للطاغية(جنكيز خان) الماغولى؟؟؟؟؟<br />اااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااة ياثار عينى عليكى اتمت من البكاء و الضحك؟؟؟؟؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 19
subject = "فضائح الدنيا الثلاث   افضل من عجائب الدنيا السبع"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-29"
text = "(عجائب الدنيا السبع) معروفة للجميع و العالم كلة<br />امااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااظ<br />(فضائح الدنيا الثلاث )و التى يجب ان تعرفها الدنيا فهى:_<br />1-فضيحة (صفر) مونديال جنوب افريقيا 2010؟<br />2-فضيحة (صفر) مونديال الدورة الاوليمبية ببكين-الصين 2008؟؟<br />3-فضيحةترشيح و زير خرابتنا (فاروق خان الاول) حفيد (جنكيز خان الماغولى)ليكون رئيسا لمنظمة اليونسكو للثقافة؟؟؟؟؟<br />تصدقوا هذة الفضيحة؟! و انا متاكد بانة سوف يفوز فوز ابليس بالجنة(صفر صفر صفر)<br />و ارقصى و زغرتى يا مصر"
archived = "2010-03-14"
capture_url = ""

