subject = "عام 2009  هو عام الاضرابات والغضب واللة اعلم بما ت"
author = "اكتب اسمك هنا"
posted = "2009-02-22"
text = "السنة دى هتبقى غريبة<br />العالم كلة بيفكر كيف يخرج من الازمة المالية ؟ ونحن نجتهد فى مجلس الشعب لتشريع قوانين تثير غضب جميع فئات الناس والشعب وتخرج فى مظاهرات واضرابات<br />يعنى لو الحرس وامن الدولة ساب الجامعة - اية اللى هيحصل<br />هل الطلبة هيقلبوا نظام الحكم ؟<br />ابدا<br />طيب ما كل الكليات الخاصة والجامعات الخاصة مفيش فيها امن دولة وفيها حراس مدنيين قاعدين على الباب ليس لهم علاقة بالطلاب<br />يا جماعة الامن بيحط مناخيرة فى كل حاجة وعايز يظهر انة هو اللى ممشى الدولة كلها ابتداءا من مترو الانفاق لغاية الجامعة<br />العيال عندهم حق<br />سيبوا الجامعة يا بتوع الامن وارجعوا معسكراتكم احسن واتعلموا صفا وانتباة هناك برحتكم"
archived = "2010-03-14"
