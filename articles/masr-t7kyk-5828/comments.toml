subject = "بني ادم من البشر"
author = "يا عم روح بقي"
posted = "2007-05-12"
text = "عمال<br />تدخل لكل موضوع وتقول فين المصادر وفين بتاع اية<br />طيب انت قولي<br />بقي<br />انا اية الي استفدة من الموضوع ده<br />يعني المهنة ده وحشة حلوة<br />اية المخاطر اية اهم المواقف الي بتحصل لهم<br />طيب انت بتقول ان في مشاكل<br />في المهنة يعني خريج جامعات<br />بيتشتغلو ا فيها<br />يعني هات راي خبير اقتصادي<br />ولا واحد بتاع عاطلين<br />يقول اي كلمتين احصائية عن الطيارين<br />لا يا دواخلي مش هينفع الشغل ده<br />بقول ليك اية<br />روح اشتغل دليفري احسن"
