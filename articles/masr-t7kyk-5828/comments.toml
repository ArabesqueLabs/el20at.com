[[comments]]
order = 3
subject = "الموضوع الديسك دمره اصلا .. وشكرا انه نزل اسمى علي"
author = "المحرر"
posted = "2007-05-16"
text = "اولا انا مع كل واحد كتب حرف نقد .. لان الموضوع اللى نزل فعلا \" سئ جدا جدا جدا \" وده ابعد ما يكون عن اللى انا عملته خالص .. يعنى بالعربى انا برئ من الموضوع ده خالص ..... ونقول حاجه حاجه<br />1- العنوان التحفه ده مش بتاعى خالص ... عنوان مبهم جدا جدا يعنى ايه اطلب يجيلك طيار .. عنوانى كان \" الضائعون فى عالم الهوم ديلفيرى \" !<br />2- الموضوع اتفرغ من محتواه تماما .. كله حكايات .. و تم حذف الكثير منه<br />3- كان فى مصادر كتير جدا جدا فى الموضوع لا اعلم اين ذهبت حتى يترك الديسك كلام الشباب المرسل<br />4- كان فى تصريح لطبيب بارز عن الحالات التى يستقبلها فى المستشفيات من هؤلاء الشباب<br />5- مصدر امنى تحدث عن حوادث الطرق وعددها بسبب القيادة السريعه<br />اخيرا الاخ مصطفى فتحى اللى قال انى لسة شاب مش صحفي كبير الخبرة هتيجي واحدة واحدة المهم الحماس والمحرر واضح ان عنده حماس ... شكرا لكلامك الرقيق بس لمعلوماتك موضوع قله الخبره ده انا اخر واحد ممكن يتقال عليه كده ... بس انتى اللى ما تعرفنيش ومش بتقرا جرايد"
archived = "2010-03-14"
capture_url = ""

