posted = "2007-05-20"
text = "هو مين شريف الخوارجي اللي عاملنا صداع ع الفاضي ده<br />وايه الهرتلة والقئ والترجيع والــ(تيــــــــــت) اللي عدم الما لامأخذة اللي تسد النفس دي؟!!<br />وغلاوتك يا شريف كنت بأعصر على نفسي لمونة وأنا بأقرا تعليقاتك الناقدة لمواضيع زمايلك<br />ولما بدأت أنت تكتب زادت اللمونة وبقت شادر كامل<br />بس عدم الما لا مأخذة جبت كل اللي في بطني أول ما قريت تعليقك<br />وبعدين ديسك ايه يا ابن الــ..... ديسك!<br />لامؤاخذة يا حاج!!!"
