[[comments]]
order = 5
subject = "اللعب على المكشوف"
author = "بدون خليج افضل"
text = "بعد سيطرة السعودية على وسائل الاعلام العربية بدا من الفضائيات ومرورا بشراء الافلام المصرية وانتهاءبابتلاع شركات الانتاج السعودية الضخمة لكل المطربين العرب انتهت الجمرحلة الاولى وبدات المرحلة التانية والتى كان مضمونها حبس متعمد لاهم الفنانين العرب واجبار غالبية الفنانيين الغناء باللهجة الخليجية حتى يعتاد المشاهد والمستمع العربى على ذلك وعمل افلام خليجية بمثثلين عرب لماذا لان المشاهد العربى لن يقبل على هذة الافلام بدون هؤلاء الممثلين والان......... تبدا المرحلة الثالثة وهى عمل هذة الافلام والبرامج من خلال خليجيين الاتلاحظون معى ان طاقم برامج ال ال بى سى قد تغير الى خليجيين<br />تتحدث الاخت عن تغيير الممثلين بسعوديين وبان هناك مواهب رهيبة سعودية تنتظر واقول لها اطلقى ماشئت من الفنانيين فقط الطلقى سراح الفنانين العرب غير الخليجيين ............ ولا تعتمدوا كثيرا على حكم الجمهور فمن المؤكد ان الجمهور ذكى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "أصلاً لا يوجد مسلسل سعودي أبد"
author = "محمد حسن البرعي"
text = "الموضوع جميل وجيد ، أصلاً لا يوجد مسلسل سعودي أبد ، القصص مكتوبة ومأخودة من كتاب غير سعوديين ، ثم يعاد كتابتها وتحويلها إلى قصة شبه سعودية وذلك بتغيير مسمى المواقع والاشياء ، واللي يقوم بعملية اعادة صياغة القصة غير سعودي .<br />اما بالنسبة للممثلات ففعلا لا توجد ممثلة سعودية تستطيع القيام كغيرها من الممثلات غير سعوديات ،هذا غير السفر والتنقل والتحرك كما ان القصة غالبا ما تضم دور اساسي للمرأة القصة تركز على الرجال واعمالهم وظروفهم ودور المرأة هامشي جدا .<br />وبالنسبة بخصوص اول فيلم سينمائي المختلف عليه من اول فيلم ، برأيي ايضاً لم يولد اول فيلم سعودي ، فاذا كان لم يولد لحد الآن أول مسلسل سعودي فكيف أول فيلم ، نفس الحكاية تحصل القصة والمؤلف والتحويل هذا غير أن المخرجين رغم ان بعضهم سعودي الجنسية إلا أنه بعيد عن المجتمع السعودي وواقعه والرؤية السعودية هذا غير طاقم الفيلم او المسلسل أغلبهم غير سعوديين وكما قلت يحصل تضارب في اللهجات والشكل والاداء والاحساس ولا توجد وحدة عمل متكاملة ، ورغم المحاولات من الكثير من الممثلين او المنتجين والمخرجين الا باعتقادي الخاص انها فشلت في انتاج فيلم او حتى مسلسل سعودي متكامل 100 % .<br />محمد البرعي - جدة<br />public_relation_art@hotmail.com"
archived = "2010-03-14"
capture_url = ""
