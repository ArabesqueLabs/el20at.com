[[comments]]
order = 0
subject = "ثلة مثل الشهداء اللى حاربوا فى حرب الاستنزاف وحرب"
author = "اكتب اسمك هنا"
posted = "2009-01-28"
text = "يحاكموة على اية<br />اذهب الى مدرسة ابتدائى او حضانة<br />فى شمال الوادى او فى جنوبة<br />مين عدو مصر ؟<br />هيرد عليك فورا اسرائيل<br />طبعا الكلام هذا لايسرى على اولاد الحزب الوطنى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "شهيد عند اللة"
author = "اكتب اسمك هنا"
posted = "2009-01-28"
text = "نحتسبة عند اللة شهيدا وهو وكل اخوانة الفلسطنيين والعرب ربنا يتغمدهم برحمتة ويسكنهم جنتة فهم تاج على رؤسنا ومصدر فخرنا وعزنا وندعوا اللة ان يلهم اهلة الصبر والسلوان اللهم امين"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "الله أكبر"
author = "عصام"
posted = "2009-01-29"
text = "الله اكبر و لله الحمد<br />النصر قادم لا محالة<br />تلك هى بشائر النصر و طلائع النصر<br />كل التحية لابطال غزة المغواريين<br />كل التحية لاسود كتائب القسام<br />ان شاء الله موعدكم الجنة<br />اصبروا و صابرواو رابطوا<br />روحى و دمى فداكم ايها الابرار<br />فداكم نفسى و قلبى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "وسام الاستحقاق من المدرسه المحمديه"
author = "لا استحق ان اكتب اسمى بجوار  ا"
posted = "2009-01-29"
text = "(لمثل هذا فليعمل العاملون) رفعت رأسنا والله يابن بلدى وفزت ورب الكعبه فهنيئا لك الشهاده الخالصه لوجه الله فتلك هى اهم واعظم شهاده ينالها انسان"
archived = "2010-03-14"
