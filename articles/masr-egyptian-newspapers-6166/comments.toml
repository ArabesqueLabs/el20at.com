subject = "حقيقة غير كاملة"
author = "ابو اسامة"
posted = "2007-06-04"
text = "ولو ان كلامك معظمه صحيح لان الحجاب فريضة ذكرت فى القراءن اذا كنتى تقرئيه و لكن غياب الديموقراطية حتى اليوم بسبب امثالكم من المثقفين واصحاب الا حزاب الذين ابتعدوا عن الناس ولم يقودوا الشعب واكتفوا ببعض الفتات من الحكام ولم نسمع منهم سوى الكلام دون اى التحام مع الناس الناس لاتريد كلاما لان الكلام لايحميهم فكل الاحزاب تريد ان تفرض<br />افكارها على الناس دون ان تعرف ما يريده الناس و(كل حزب بما لديهم فرحون ) لم تقد الاحزاب مظاهرة للمطالبة بحقوق الفلاح لم تقد الاحزاب مظاهرة للمطالبة بحقوق العمال فاى تغيير تريدون او تاملون انه ان كان هناك تغيير فسوف تكون ثورة للجياع والفقراء ولن تثتثنى احد الصالح والطالح من اصحاب الملايين ."
