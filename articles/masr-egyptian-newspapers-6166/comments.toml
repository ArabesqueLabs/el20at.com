subject = "فقط اقول"
author = "طارق الوزير"
posted = "2007-06-04"
text = "والله والله لو جاء عبد الناصر الان ! لكان اخوانيا واحتضن الاخوان ! الذين هم اعداء الصهاينه والامبرياليه والان خرج البهائيين والشواذ ومزغطى البط وعبده الشواذ والمطبعين والمتصهينين و(فرقه المواسير الصهيونيه) التى تدعى خداعا وبهتانا اسم القرانيين ! وزعيمهم الفاجر بن صبحى من امريكا يكتب ليعجب المتمركسين !! وفريق الدلع ( ديمقراطيه ليبراليه علمانيه ) ومهاويس الاقباط واشهرهم فى مصر فرقه التلاثى المرح الراقص( المستشار والمحامى ومرقص ) والمرتبطين بمنظمات مشبوهه ! خرجوا الان من جحورهم ويكتبون ببجاحه وهم الاخطر على مصرنا ! واخيرا الاخوان اسقطوا خالد محى الدين لانه اساسا انعزل عن اهل دائرته بقصوره بالقاهره مثلمايعوم الان رفعت السعيد فى احضان الحكومه ويكتب من امام حمام سباحه فيلته بالمقطم ولا ندرى من اين جاء بتلك الفيلا !!!! وهو بتاع الطبقه الشعبيه ههههههه اضحكنا بشعاراته التى كانت من هنرى كوربيك الصهيونى من اخترق الشيوعيين !!!!فلا عجب ومن لاايمان له لاامان له على راى الست ام كلثومtarkalwer1@yahoo.com"
archived = "2010-03-14"
