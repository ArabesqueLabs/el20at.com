author = "الفراخ الفيومى"
posted = "2009-06-03"
text = "رحت دار ابويا الحاج فى البلد اشرب فنجان قهوة معاة واشوف ستى الحاجة الكبيرة وادخل بيت العائلة<br />سالت ابويا الحاج عن مشاكل الفراخ وانفلونزا الطيور<br />عايز اعرف اية راى اهلينا فى الريف عن مشاكل الطيور وصفحات الجرايد المليانة باخبار الانفلونزا والاصابات والوفيات<br />ابويا الحاج قال لى<br />شوف يا ابن اخويا - المصايب هلت علينا من يوم ما عرفنا المستورد - لما كان عندنا الفراخ الفيومى والفراخ البلدى المتعودة على جو بلدنا وحر وبرد بلدنا لم تكن هناك مشكلة ولا امراض فراخ بنت الارض عاشت معانا عليها الاف السنين وعندها مناعة ضد الامراض<br />انما لما جابوا فراخ خواجاتى بيضاء تتربى فى مزارع جاية من بلاد جوها مختلف فلازم تصاب بالامراض وتغيير الجو والمناخ وييجى لها انفلونزا وبلاوى زرقاء<br />شوف يا ابن اخويا قتلوا انتاج بلدنا بالمستورد<br />فين الشمام المصرى اللى ريحتة كانت بتقلب البيت - قضوا علية بالكانتلوب واختفى البطيخ النمس والبطيخ الشلين والاسماعيلاوى<br />راحت منتجات بلدنا<br />فين الكمثرى المصرية والجوافة المصرية<br />كلة مهجن وكلة بالهرمون<br />لما تروح بيتكم فى القاهرة لا تأكل الخيار ولا الطماطم ولا الفراخ البيضاء لاننا بنحط"
