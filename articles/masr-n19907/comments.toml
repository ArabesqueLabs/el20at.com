text = "بذمة ابوكم ايه دخل اساتذة الجامعات في الموضوع<br />امتحان الثانوية ايه مشكلته<br />اي موجه مادة يحص امتحانات الثانوية<br />ولا استاذ المادة من الجامعة علشان خاطر يحط اسئلة معقدة<br />وبسبب العيال تتربط في طاحونة الدروس الخصوصية<br />منكم لله جميعا"
