[[comments]]
order = 0
subject = "اخر مسمار فى نعش التعليم - قبل نقلة الى المقبرة"
author = "السيد مسرور"
posted = "2008-09-15"
text = "هذا النظام مطبق فى امريكا وفى الهند ايضا - نظام امتحان القبول بالجامعات ولكن لماذا ؟<br />لانة لا يوجد امتحان ثانوية عامة موحد على مستوى الدولة فى امريكا او غيرها وكل مدرسة ثانوية بتعمل امتحان ثانوية عامة خاصة بها وكل مدرسة ومستواها وطبعا تختلف المستويات من مدرسة سهلة الى مدرسة صعبة<br />ولكن فى مصر عندنا نظام بريطانى عريق كل طالب معروف مستواة من الامتحان الموحد للثانوية العامة ويفاضل بينهم بالمجموع<br />انما النية فى القانون الجديد تتجة الى اغلاق ابواب التعليم العام امام عامة الشعب<br />عارفين ازاى<br />زى نظام القبول فى الكليات العسكرية - نظام كشف الهيئة - ابوك مين وعندكم املاك قد اية وتقدر تدفع قد اية<br />ورغم ان الدستور فية بند المواطنة وكل المواطنين سواء امام الدستور الا انة فى الكليات التى فيها كشف الهيئة يرسب الطالب تحت بند عدم اللياقة الاجتماعية - يعنى ابوة فقير ولا يصلح لهذة الوظيفة<br />ايا كانت الفلسفة وراء تطبيق هذا النظام<br />وايا كان ما كتب فى الدستور فان الواقع مختلف عن بنود دستور البلد وقانون البلد<br />ولا اظن ان هذا النظام سيطبق - لانة فى رايي عند تطبيقة سيكون نظام الحكم هذا الذى يعد هذا القانون فى مزبلة التاريخ"
archived = "2010-03-14"
