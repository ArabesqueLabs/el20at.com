posted = "2009-07-13"
text = "الفكره ممتازه<br />, والنظام البريطاني العرييييق ... قدم و حط عليه الغبار و بدلييل فشله طوال الاعوام الماضيه ........<br />والهند وأمريكا حالهم افضل من حالنا ......<br />بس أهم حاجه....<br />مييين اللي هيطبق النظاام الجدييد<br />و مين اللي هيقيم الطالب , ومين بياخذ فلوس عشان يظبطني في درجتين<br />ومين معهوش فلوس هينداس تحت الرجلين .<br />خلاصه:<br />النظام ممتاز اذا تم استبدال عناصر التعليم بكائنات فضائيه او اّليين وربنا يرحمنا ."
