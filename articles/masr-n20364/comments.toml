order = 0
subject = "سائح فى بلاد الشحاتين"
text = "سياحة اية<br />مش الاول يشوفوا الناس الجوعانة والمريضة والمحرومين وتبقى الحالة مستورة<br />انما جوعان وشحات واجيب الاجانب يتفرجوا على خيبتى التقيلة واموتهم فى حوادث على الطرق السريعة الصحراوية لن السواق كان جوعان او ضارب حجرين حشيش او شارب بانجو<br />السياح بيروحوا دبى وتركيا وتونس والمغرب ولبنان<br />والتعبان قوى بييجى مصر<br />ويطلع منها حالف ميت يمين ما يرجعش تانى"
archived = "2009-03-23"
capture_url = "https://web.archive.org/web/20090323235942/http://masr.20at.com:80/newArticle.php?sid=20364"
