[[comments]]
order = 7
subject = "حسبنا الله ونعم الوكيل..وكفى به ولي حسيب"
author = "أردني حتى النخاع"
posted = "2008-07-18"
text = "الأخ المعلق عاشق فلسطين...أنت والمدعو نواف سواسية في ذات المستوى، لأنك تعرضت لجميع الأردنيين وشتمت وسبيت فقط لأنه تم استفزازك من شخص او مجموعة صادفتهم في حياتك...كما أنك ادعيت زوراً وبهتاناً أن لكم الفضل على الغير...رغم انكم تعرفون أنه لم ولن تستقبلكم دولة في العالم كما استقبلكم الأردنيين عند حاجتكم...<br />وللعلم ليست شهادة من الأردنيين الذين عرفوكم عبر السنيين من بداية اللجوء إلى النزوح وحتى العودة من الكويت...في بداية التسعينات...أكلتم خير الكويت ...وأول من طعنها وطعن أهلها أنتم..أكلتم من خير الخليج ولو بيدكم لاستوليتم على خيراتها...حتى أرضكم وشعبكم في الكويت خنتوها.....وشهداء الخيانة الفلسطينيية موجودة وأنتم أكثر الناس معرفة بها...فياسر عرفات والدكتور الرنتيسي والشيخ أحمد ياسين والشهيد يحي عياش وغيرهم الكثير الكثير أرواحهم ذهبت نتيجة خيانة فلسطينية بامتياز...نحتسبهم عند الله شهداء للخيانة .......أراضيكم تبيعونها بالملايين من الشيكلات الإسرائيلية وتسعون للشراء في صحراء الأردن التي تذمها وأهلها ....بداعي الطمع وعدم الشبع ...حتى أنكم تعملون سماسرة لليهود تشترون بأموالهم أراضي عربية....كل هذا نسيته وتناسيته يا ابن شعب الله المختار....كل العرب يعرفون أن أمثالك يطعنون كل يد تمتد لهم بالخير ويبيع الأرض مقابل حفنة دولارات.............ويبقى هنالك فلسطينييون عرب أقحاح وأصليين بريئون من أمثالك...نسأل الله ان يقويهم على مبتلاهم.......الصفات التي نعتنا بها نحن الأردنييون ..نسأل الله أن يرد عليك بها يوم الدين وحسبنا هو نعم المولى ونعم النصير"
archived = "2010-03-14"
capture_url = ""

