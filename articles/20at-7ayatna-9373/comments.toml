[[comments]]
order = 16
subject = "فلسطين اولا"
author = "عاجل ومهم جدا"
posted = "2009-03-10"
text = "لا حول ولا قوة الا بالله استهدوا بالله اخوكم الفلسطيني<br />بس انا اريد ان اقول لكم يا عرب ان تتقوا الله<br />في فلسطين وان تكونو ارحم علينا وان تنصرو القضية قولا وعملا<br />اما بالنسبة للفلسطيني ارجو ان يثبتك الله على الحق وارجو ان لا تشتم اي اخ من اي جنسية عربية كانت وهدول اخوانا<br />واريد ان اقول للزعماء العرب حلت لعنة الله عليكم<br />اتفيه على شرفكم<br />اما بالنسبة للزحمة فسببها الهنود<br />بس وشكرا"
