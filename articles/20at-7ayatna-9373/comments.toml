subject = "الى اماراتي"
author = "محمد نواف الحمدالله ..."
posted = "2008-08-22"
text = "ولك كس أمك إذا بتفهم .. أنتا واحد اخو عاهره .. لاتفقه بالحياة شيئاً .. أنتا واحد اخو شرموطه .. ابن حرااااااام ..<br />ولك كس أمينها امك يا ابن القواده ،،،<br />يلعنك ويلعن اللي خلفك يا بن مرتي ............... ولك يلعنننننننننننننننننننننننننننننننك شووووو ابن زناااااااااااااااااااااا<br />ااااااااااخ يا الله .. من وين بطلعوا هذوله النفهات ولاد الشرموطه ( أولهم إماراتي *) كس أختك كل مالف عجل سيارة ...<br />يلعن امك شو انو كسها مفتوح زي المغاره .. ولك منيوك اخو شرموطه انتا واللي عاملين حالهم بفهمو<br />أي كس أختك إذا انتا فاهم ‘إشي ...<br />ولك رف عن ايرنا خلينا نفظح بعراض هذوله الفلسطيزية<br />فش فيكو واحد زلمه !!!<br />للأسف الشديد ................. الكل صار يحكي ويحكي ويحكي ... وياريتو بفعل .. \\\\وانتا أولهم يا إماراتي |<br />فعلاااااااااااااااااااااااً هزلــــــــــــــــــــت وقل منافعهااااااااااااااااا<br />وشكراً"
