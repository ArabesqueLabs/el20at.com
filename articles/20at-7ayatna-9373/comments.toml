subject = "بالقرب من محطة النزين ،، غز[ة]"
author = "محمد يحيى الأغا"
posted = "2008-06-21"
text = "هنا نختلف في نقطة واحدة ،، الإزدحام هنا يكون في المركبات وفي الطرق الكبيرة والمشهورة في هذة المدن المرموقة والكبيرة التي تعد من اجمل المدن العربية ,, اما هناك في غزة فالأمرُ مختلف تماماً طريقة الازدحام مختلفة ونوعها واسلوبها ايضاً ,, قد يتمالك البعض من اهل غزة انفسهم وهم مصطفين منتظرين في طوابير كبيرة في ازداحام شديد ،، والبعض الآخر ينالون الوجع بأكمله فالجميعُ هنا ينتظرون وصول الغاز الطبيعي \\\\\\\" غاز الطهي \\\\\\\" والمحروقات الي محطة البنزين كي يستطيعوا ان يعيشوا لكن ليس دائماً يحالفهم الحظ في الوصول الي هدفهم ،، فيقتلهم الازدحام وهم ينتظرون ..<br />طبعاً هناك فرق كبير ،،، وأعتقد أن الوجع أكبر بكثير<br />فنحن الآن علي ضفاف الإزدحام في دبي |،| وفي قعر الألم في غزة"
archived = "2010-03-14"
capture_url = ""

