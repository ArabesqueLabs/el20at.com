text = "ما كنت متوقع انك تكون شذي يا اخ محمد نواف وانا برضه زعلان لكل الطرفين الفلسطيني والإردني من اللي قاعد يصير لكن مو للدرجة ذي توصل الاهانات بعدين انا شنو دخلني بالموضوع وتقلي (لا تتفلسف بسمانا ) طيب ما قلت شي وجالس انصح وكان معنى تعليقي انه كل شعب فيه التمام والبطال .. بعدين تطاولت على الذات الالهية لما قلت ان الله حاشاه انه هو اللي جاب لكم نور وبجم على قولتكم اتق الله في نفسك انا شخصيا احب الاردنيين والفلسطينيين وعندنا الناس وحدة ما في فرق<br />على كل الله يهديك ويسامحك على لهجتك الجارحة تجاهي شي يقهررررررررررررررررر والله ما دام عقول الشباب العربي رح تبقى كذي"
