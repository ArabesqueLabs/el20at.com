subject = "إلى الاخ أردني حتى النخاع"
author = "محمد نواف"
posted = "2009-02-10"
text = "أخي أردني هذا الصعلوك عاشق فلسطين .. ماهو إلا مريض نفسي .. وانا كل كلامي هذا أي نعم كتبته ولكن هو قد حرف بكلامي .. ولا أدري من أين جاء به .. لن أدعو عليه يا أخي أردني ولن سوف اكتفي بقول ( حسبي الله ونعم الوكيل ) ..<br />وليعلم هو ومن يشد على يده إني لست خائفتاً لا منه ولا من غيره، لأن الرجال مواقف .. وهو ليس كلام في كلام !!<br />تحياتي لك أخي ..<br />والسلام عليكم"
