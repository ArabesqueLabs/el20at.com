text = "السلام عليكم ..<br />لو وااحد منكم يوقف بجانب رصيف الشارع .. يمكن إيحصل مواطن إماراتي الزحمه من لهنوود أكثر شي ..<br />وأخر تقرير لعدد السكان 4 مليون ... في الإمارات .. 2000000 هنود 1200000 أجانب وإخواني العرب .. ومواطنين دولة الإمارات 800000 الف ..<br />بس اناا مستغرب ليش منزلين هذاا الموضوووع ... هذا شي عاادي ويحصل في كل دولة .. هب في الإمارات بس ؟؟<br />..... وإلي يتكلم عن الإمارات وعن الزحمه وتقصر العمر يااخي روح بلادك وكمل عمرك هنااك بين أهلك وإخوانك ولا تعور راسك<br />وأقووول لخواني الشباب الفلسطيني والإردني .. بغض النظر عن فلسطين والإردن وهذا يقول أناا خليجي والثاني مصري ... يااااا جماعة الخير .. أنااا إماراتي إذا غلط ع أي دوله عربيه أو أجنبيه هل إن شعب الإمارات كاامل غلطااان ... طبعن الجواب .. بيكون ( لا ) ..."
