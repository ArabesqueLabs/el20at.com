[[comments]]
order = 9
subject = "أردنيين وما ننظام ومهرك يالأردن غالي .."
author = "محمد نواف الحمدالله"
posted = "2008-08-03"
text = "أنا هونه بدي أقول كلمة وحده لهذولة الملقبيين بالفلسطيزيين .. يعني أنا مش فاهم .. ليش الواحد بعمل مع كل الناس خير وبساعدهم وبعاونهم، وبردوه بالمثل ؟.. إلا الفلسطيزيين .. بتعمل معاهم خير وبتساعدهم .. بروحو بقلبو ظدك .. وبصيرو مش معك بالمره . يعني فوق ما حنا مفظليين عليهم وعلى اللي خلفوهم وعلى كل فلسطيزي أجرب مقلعط مش لاقيله دفشة ولا دزه .. ويلا يلا تا شايف قدامو .. فعلاً !!! إنكو ناس حقرا وأنذال ووسخيين ومعفنيين وجرب ومفطسيين وهبايل وكلاب ولاد كلاب ولكو إنتو في دمكو الكذب والغش والحقد والنميمة والحقد والكره والضغينة واللئم .. الله مجمع فيكو كل وسخ وخره هالدنيا والعالم وحاطه فيكو .. سبحان الله !!! يعني الناس بتحاول إنها ( ه ) تحترمكو .. وتقدركو .. وتسويلكو مكانة ومستوى .. وإشي عليه القيمة والفايدة .. بس إنتو مامنكو فايدة بالمره .. يعني أنا الصراحة .. مش من طبعي أو حتى من صفاتي إني أسب سوى إنو شفت إنو فاظ الكيل .. والوعاء امتلا وصار لبرا .. فقلت فحالي وفنفسي صار لازم أتدخل وأسب وألعن وأفضحكو كلكو فرداً فرداً .. يعني أكبر دليل إنكو ناس شاطرة .. ومتفصحنه .. ورايقة .. وفاضية .. وماعندكو شغله ولامشغله . ولا حتى عمله .. إنكو نازليين سب فينا على ولا إشي .. يعني القافلة تسير والكلاااااااااااااااب ( اللي همه إنتو ) تنبح وتعوي ..!!!<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره فالتات ودايرات وداشرات بالشوارع ..<br />يعني والله أنا بشفق عليكو من شعب ماكل خرا من جميع الأصعدة والجوانب المختلفة . يعني شعب كس إمو من شعب شرموووووووووووووط .. قال رنتيسي وياسين وأبو عمار ( أبو حمااااااااااااااااااااااااااار ) .. وكس أخت أسماءكو كيف هيه !!!<br />إنتو اللي رح توكلو خراااااااااااااااا بالملعقة والشوكة والسكين ... وبالنهاية .. وكلمة أخيرة لكل أردني على وجه الكرة الأرضبة .. وووين ما كان .. بقلو وأنا هونه من موقعي ( الإمارات ) .. إرفع راسك لفوق لفوق لفوق وخليك عنيد وراسك يابس مش زي الحجر لأ أقوى من الحجر بكثييييييييييييييير .. وخلي عينك جاويه .. بتقدح شرارة .. قوية .. واللي بطلع فيك وخصوصاً إذا كان فلسطيزي .. مع إنو بسترجيش أو بالأحرى بقدرش أو إنو يحاول يرفع وجهو بوجهك .. وفي حال لو رفع شويه من وجهو الأجرب أخزقلو جوز عيونو .. وسوي براسووو خريطة العالم .. ونييييييييييييك خواته ال66مليون شرموطه وشرموطه .. ولاتنسى تنيك إمو ( لإنها هيه الأساس ) .. وبعد هيك إدعس بنص بطنو دعسة بنت كلب ( نصها موت ).. وشلحو أواعيه .. وافتح طيزو ونيييييييييييييييييييييييييكو لحد ما يغمى عليه ويطفي على الآخر . وبعدين كفين على الماشي ومرتبات يكونو على أكمن بوكس على شلوتين في زبو يخليه يبطل يخلف نهائي وبالمره .. وبعد هيك ( بدي أفرط من الظحك ) .. _ هذا إذا ظل عايش وعلى قيد الحياة وفيه روح وبتنفس _ .. على العموم شيك يعني .. هع هع هع ... وقلوووووووو بأعلى صوتك كالآتي :- ((( مظيع بوجهي شلن يا أخو العرصة ..... )))<br />ولكووووووووو .. نكناكو كثير كثيييييييييييييييييييييييييييييييييييير كثيييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييير .. وزهقنا من طياز وكساس وبزاز وشفايف وخدود بناتكو ونسوانكو يالفلسطيزيه .. وملينا منكو نهائي .. ومسحنا بكرامتكو وشرفكو أرض الأردن كلها/ ولفينا فيها شبر شبر .. ولعنا ظمايركو حى صفيتو بلا ظمير .. أي كس أختكو من متى كان عندكو ظمير .. يعني بالمشرمحي هزئناااااااااااااااااااااااااااااااااااااااااكوووووووووووووووووووووووووووو .. وخليناكو فرجه للي بسوى واللي مابسوى .. وعلكة بثم الجميع .. وسيرتكو وقصتو على كل لسان في العالم .. يعني خلصنا عليكو وقظينا عليكو .. يعني ياجهلة ( Game Over ) <<< يعني انتهت اللعبة ،،،<br />والأردن أولاً .. أولاًُ .. أولاً ..<br />وجيشنا جيش الوطن .. سمينا بإسم الله .. نحمي الوطن والعلم .. بعيون عبدالله ...<br />وبدي أشوف تعليقات الأردنيين النشامى ... اخزقوهم يانشامى الوطن .. ونيكو أعراظهم .. للي بلا شرف !!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "وين كنا ووين وصلنا !!!"
author = "محمد نواف الحمدالله"
posted = "2008-08-03"
text = "يعني أنا والله مش فاهم ياموقع الشرموطه ( موقع عشرنيات ) ليش تعايقاتي اللي كتبتهم إمبارح حذفتوهم ياولاد الساقطة .. كس أختكو من موقع فاشي أخو شرموطه .. ولكو فش واحد بالموقع زلمه ابن زلمه حتى ينشد فيه الظهر ..<br />وبالنسبة للأخ الإماراتي .. الله يخليك ويرظى عليك يوخيه .. لاتقعد تتفلسف بسمانا . وإنتا أصلاً وبالأساس<br />مابتعرف الفلسطيزيه قدنا حنا الأردنيه .. يعني كيف بدك تعرفهم قدنا حنا ؟!<br />أنا الصراحة أكره ناس بكرهم وبطيقهمش ولاحتى مستعد أطلع في وجهم الأجرب المعفن همه الفلسطيزيه .. سبحان الله كل ما أطلع بوجه فلسطيزي منيوك عرص ابن عرصه متعرص أخو تعريصه بنت قحب شرموطه عاهره داعره . بصيبني غثيان وبحس حالي بدي استفرغ وأراجع .. يخرب بيتهم هذوله البقر الجحوش الغجر النور البهايم . نفسي بتنسد نهائي لما أشوفهم أو إني ألمحهم بأي شكل من الأشكال .. خرا الخرا عليهم شو إنهم خراااااااااااااا .. يا أخ إماراتي ،، أنا بحكي معك على أساس إنك إماراتي وإنتا مابتعرفهم وبس حنا اللي منعرفهم منيح ... ومنيح كثير كثير كثير .. أنا مابنكر إنو همه كانوا بالإمارات زي ماكانوا عنا ومازالوا عندنا حنا الطرفين ( الأردن والإمارات * ) ولكن وجودهم كان عنا أكثر بكثير من الإمارات ووسخو عنا ولمو قرفهم وعفنهم لعنا .. وماخلوا حدا يعتب عليهم ... وكل الناس عارفين مين همه وكيف كانوا ..<br />وكيف صاروا من تحت أفظالنا اللي لابتنعد ولاحتى بتحصى !!! ترى والله يا إماراتي أكثر ناس قرفنا منهم لهذوة الحثالة المرتزقة الخونه العملا الجواسيس اللي كلهم على بعظهم مش شايفهم !! هو حنا الأدرنيين .. يعني الله سبحان الله ( لا إعتراظ على حكمو ) بس هو جبلنا مجموعة من الوسخ والعفن والقذارة والحقارة والسفالة والنذالة والحيونه والهمجية والنورية والبجمية اللي مش طبيعية وكل إشي زفت ولا يطااااااااااق بالمره ونهائي !! وراح حاطو فينا وعطينا إياه .. وعلى مين راحت يا إماراتي ؟؟؟ أكيد راحت علينا حنا الأردنيين .. وإجوا الفلسطيزية القواديين القحاب على بلدنا وخربوا فيها ونشروا فيها وسخهم وعفنهم بمختلف مناطة المملكة . مافي محافظة ماسلمت منهم ولاد المشلطات بالشوارع ودايرات على الكابريهات والديسكوهات والكازينوهات والبارات والخمارات والمراقص والنوادي الليلية .. يعني يا أخ إماراتي .. إذا بدك تلاقي الفلسطيزية فبتلاقيهم بهالأماكن (الكابريهات والديسكوهات والكازينوهات والبارات والخمارات والمراقص والنوادي الليلية .. الخ ) ترى أخي الإماراتي أنا مابقول هالكلام من عدم !!!! كل واحد عارف حقيقتهم ومفظوحيين بكل مكان .. وأكبر دليل عنا بالأردن .. لما تروح على لبنان نفس الإشي .. ولما تروح على سوريا كمان نفس الإشي .. ولما تروح على الإمارات ( اللي هيه بلدك طبعاً ) .. ولما تروح على دول الخليج بشكل عام ودون تحديد .. ولما تروح على مصر .. ولما تروح على العراق .. ولما تروح بكل مكان بتلاقيهم بهااااااااااااااااااااااايم العادة ومفظوحيين هونه وهناك ..<br />صدقني ياأخي السعودي هاي الدنيا مش مخربها غير هذولة الفلسطيزية اللي همه حثالة ونذالة وحقارة وسخنة المجتمع العربي والعاملي .. لأنهم ناس بالأساس وبالأصل وسخيين وتافهيين لأبعد الحدود , يعني همه هيك الله خالقهم ناس حمير جحوش غجر نور بقر حوش بجم بفهموش .. يعني لويش تعب حالك على الفاظي .. سيبك منهم .. هذوله الكلام معهم بنفعش .. بدهم الواحد يدق راسهم مزبوط وينيك أعراظهم وشفهم ويحمل كل بناتهم الشرموطات المنيوكات الداعرات العاهرات البايعات شرفهم لمين مانكان ؟؟<br />فكيف بدك الناس تحترمهم وتقدرهم وتسويلهم قيمة ومستوى .. لا يا أخي أنا شخصياً بتمنى إنو يحلو عنا الفلسطيزية ويطلعوا من عنا نهائي ويروحوا على بلدهم خلي اليهود ينكيوا بخواتهم وأمهاتهم وبناتهم وحده ورا الثانية ..<br />بعدين اخ إماراتي .. إذا ملاحظة معي إنو الفلسطيزية معروفين بسب الإسلام والدين والرسول ( صلى الله عليه وسلم وعليه أفضل الصلاة والسلام ) والذات الإلهية ( الله عز وجل * ) دون تفريق بين هذا وذاك .. فالكل بالنسبة لهم سواسية .. وما أحلاه من ساعة ومن لحظة لما يسب الفلسطيزي الله وربو .. هع \\\" هزُلَت\\\" ...<br />يعني ناس باعوا أرضهم .. وباعوا كل إشي بخصهم .. بعدين طلعوا من أرضهم وراحوا بكل هالدنيا وصاروا يلفلفوا فيها دولة دولة .. والدولة اللي تعجبهم يبسطوا فيها ويقعدوا فيها ومستحيل يتخلوا عنها .. ومنها أرظنا ( الأردن الغالي * ) يالله كيف سوها ولاد القحبة الشرموطه الداعره ؟! بس آآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآخ خليها بالقلب ترجح ولاتطلع لبرا وتفظح<br />وإذا سألتني ياخوي الإماراتي شو أمنيتك ؟؟؟ لأقلك نفسي ومناي .. وأمل وأمنيت حياتي .. إني أنهي وأقظي وأخلص على إشي اسمو فلسطين وكلاب فلسطين من خريطة العالم وأمسحهم مسح .. وأقظي عليهم قظاء مبرم .<br />وهاي هيه أمنيتي وبسسسسسسسسسسسسسسسسسسسسسسسسسسسس وكس أمكو أولاً وآخراً يا أولاد الحرااااااااااااااااااااام .. يلي إنولدتو من زبارنا حيث إنها ادخلت بأكساس وطياز خواتكم وأمهاتكم فولدناكم .. حلوه صح<br />ع العموم هاذ اللي حكيتوا غيض من فيض . وماخفي كان أعظم وأدهى وأمر بكيثيييييييييييييييييييييييييييييييييييييييييييييير ..<br />والله على الظالم .. ورح يجيهم يوم ورح يوكلوا أصابيعهم لأ بل يدهم ندم وحسرة .. وساعتها رح ندعس على طيازهم وأكساس وبزاز وطياز بناتهم وخواتهم وأماتهم بدون أي رحمة ولا حتى شفقة وشوفوا يافلسطيزية بدي أقول شغله وحده بس :<br />إنو المراجل وشغل الزلمنة . وشوفة الحال وشد الحيل .. ونفخ الصدور .. وكل واحد عاملي حالو أبو عنتر ومش عارف شو ..<br />بكونش من ورا شاشة الكمبيوتر .. أو التطقيق ع الكيبورد .. اللي بدو يحكي إشي يجي ويتفظل ويحكي وجه بوجه .. كس أمكو شغل لقلقة وتجعير .. بس لما تصير الشغلة جد وحقيقة بتتخبو مثل البسس والقطط ياوسخين ياجرب يامعفنين .. الله يلعنكو واحد واحد .. قال شعب منضال قال .. بس بلااااااااااااااااش !!!"
