subject = "كس امك يا منهالي يا منيك ياعرص يازبالة"
author = "محمد نواف"
posted = "2008-09-05"
text = "ياشرموط .. رف عن ايرنا كس أختك شو خراااااااااااااااااااااا .. يلعن ابوك شو انك ابن كلب وعاهره وداعره ..<br />يا ابن الشلف ..<br />ولك تخلينيش اكفر !!!!!!!!!<br />ولك مين دازك علي .. مين هاذ اللي مسلطك علي يا ابن الزانية ...<br />اطلعمن راااسي لأقطعووووووووووووووووووو<br />وبعدين انتا واللي جابك ع راس زبي من فوووووووووووووووووق ..<br />اه صحيح .. سلم على أختك الحلوه (( نتاشا ))<br />هع هع هع هع هع ..<br />اسمع دير بالك على حالك ؟؟؟؟<br />وتكبرش راس علي ..<br />وتنفخش صدر على الفاضي ..<br />وتهزش ذنب يا كبير ..<br />ترى معوبة ابو شريك<br />.. انتا فاهم .. فش داعي اوضح !<br />يلا .. انبح ياكلب يا ابن الكلب ..<br />واذا ثاني مره بتجيب سيرتي على لسانك .. وشرفي لأقص لسانك واحملك اياها .. ماشي<br />وبلعن ابوك اخو شرموطه .."
