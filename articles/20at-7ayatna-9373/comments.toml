subject = "زحمه من نوع اخر"
author = "ابن البلد"
posted = "2008-06-24"
text = "لا انكر ان هناك زحمه شديده في دبي,,ولكن هناك بعض الحلول لتجاوزها ,كسلوك بعض الطرق الاخري,او وضع بطاقة سالك.<br />لكن هناك زحمه اخري في بلد اخر ,,اعتقد انه ليس غريب عليكي. ففي غزه هناك زحمه شديده سواء بالسيارات او السلاسل البشريه التي تصطف لتنال حصتها الزهيده من الوقود والغاز ,وفي الضفه الغربيه ,هناك حواجز الاحتلال التي تعيق الحركه وتجعل السائقين من اختيار طرق التفافيه وعره للوصول الي مرادها ,, قاطعه مسافات واوقات عشرات الاضعاف للوقت التي تستغرقه لو لم تكن هذه الحواجز ,,بوجهة نظري الكتابه في هذا الموضوع اهم من الكتابه في موضوعك هذا ,, مع انني لا انكر انك متابعه ولست مقصره في قضايا وطنك وهموم شعبك ...<br />لك كل الاحترام والتقدير<br />ابن البلد"
