posted = "2010-02-18"
text = "اولا ما يسمى الاردن هي تاريخيا امتداد طبيعي لسوريا الكبرى وتحديدا جزء من جند فلسطين والتاريخ يؤكد هذا الكلام اما ما يسمى شعب الاردن وهم معدودين على الاصبع هم من البدو الرحل والذين تعود اصولهم للمنطقه الشماليه من السعوديه او من النقب الفلسطيني<br />والعائله الماسونيه الهاشميه وكما تحدث عنهم التاريخ فهم من مكه طردهم ال سعود فذهبو وارتمو بأحضان بريطانيا لمنحهم مناطق يحكموها ونتيجه لذلك قامو بالتأمر على الدوله الاسلاميه وثارو ضدها خدمة للمشروع الاستعماري الغربي وكان من نتيجة ذلك ان استعمر الوطن العربي واعطى البرطانيين للهاشمين مناطق نفوذ منها الاردن على ان يساعد هؤلاء العملاء في جعل فلسطين دوله لليهود ولم يبقى الهاشميون في الناطق التي استلموها الا في المنطقه الشرقيه من نهر الاردن وهو نهر فلسطيني سميت المنطقه الشرقيه منه نسبه اليه وسبب بقاء الحكم الهاشمي في هذه المنطقه هو عدم وجود شعب له حضاره بل مجموعه من البدو المتخلفين مما ساعد الهاشميين على حكم هذه المنطقه اما سوريا والعراق فقد تم طرد الهاشمين بعد فتره قليله من دخولهم اياها"
archived = "2010-03-14"
