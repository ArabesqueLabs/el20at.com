[[comments]]
order = 0
subject = "عندنا في مصر حاجه اكثر من عادية سب وشتم رئيس الجمه"
author = "مش ححبك"
posted = "2008-06-26"
text = "تعالوا شوفوا عندنا في مصر مش نجل الرئيس لا دا الرئيس نفسه<br />في المظاهرات سب الرئيس وابنه<br />وفي الصحف صحف المعارضة<br />ببقى واقف على محطة الباص والاقي بياع الجرايد صافف جرايد المعارضة واتفرق على العناوين<br />اتهام حسني مبارك شخصيا بالرشوة والفساد عيني عينك<br />واخيرا فهمت ان سياسة حسني مبارك<br />انتوا تقولوا اللي انتوا عايزينه والحكومة حتعمل الي هي عايزاه"
archived = "2010-03-14"
