text = "الموضوع عادى..طبعا اسلوبه كويس جدا..لان اللى كاتبه الاستاذ مجدى الجلاد..رئيس تحرير احسن جرنان يومى موجود فى السوق دلوقتى..لكن التناول كان فيه جانب هجومى شويه..وطبعا عنده حق.. بس اللى لازم ناخد بالنا منه ان ممكن تكون العضويه ديه فرصه جديدة لمصر فى مجال حقوق الانسان.. ويمكن بعدها كل اللى احنا عايشينه الان يتغير ويتحول للاحسن..ويمكن الوضع يفرض علينا الاحسن..من الاخر انا شايف ان احنا من حقنا نفرح من اى حاجه كويسه..فى ظل الظروف اللى احنا فيها ديه..وبدل ما نحول الفرح الى مأتم نحاول نضحك ونفتكر الابتسامه اللى هربت مننا........"
