text = "بسم الله الرحمن الرحيم<br />دكتورنا وحبيبنا الغالى واللى انا من عشاق كتابتك الدكتور نبيل فاروق احب اقول الأول ان انا من المتابعين بشدة لكتاباتك وخصوصا رجل المستحيل وملف المستقبل تانى حاجه لية يا جماعه بتحسبوه غرور هو اللى يتكلم من قلبة و مايخفش من حد تقولو عليه مغرور طيب لية ماسألتوش نفسيكم لية بتقولو مغرور مش فاهم انا هو ده الشعب المصرى يهاجم من غير ما يفهم و بشكرك من قلبى يا دكتور على نشرك الإلكترونى للقصص واللى اتاح لينا كلنا قرائتها بسهولة ويسر لك جزيل إحترامى وشكرى وتقديرى على ما تبذله من اجلنا من فكر وتفكر و عصارة افكارك التى توهبها لنا"
