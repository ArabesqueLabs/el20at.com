text = "اولا احب اوضح ان الدكتور نبيل طبعا من الاشخاص المحترمين و الذى بفضلهم تعلو مصر و انا اقدر مجهوداتك و اعمالك الفنية العظيمة اللى خلتنا نتشرف باننا مصريين<br />ثانيا ردا على الاخ الكريم مصطفى فتحى فى قوله ان الجلوس مع الدكتور نبيل حمل ثقيل اود فقط ان اسأله هل سبق و جلست معه و احسست بهذا الشعور و ارجوا ان تتكلم عن نفسك و لا تتحث بلسان الجميع لان هذا ليس رأيى و انا اؤكد لك ان هذا ليس رأى الكثيرين و اذا كنت تحب كتابات الاستاذ احمد خالد توفيق فأنا عكسك تماما و عموما اختلاف الرأى لا يفسد للود قضية و لابد من ان تحترم آراء الآخرين و لا تهين احد<br />ثالثا ردا على الاخ الذى يقول انه لا يفتخر بمصريته و يسب جهاز مخابراتنا العظيم: ان مصر لا تفتخر بامثالك لانكم انتم سبب تخلف البلد و تأخرها و سبب للسلبية اللتى سادت فى البلاد.<br />لقد اتهمت جهاز المخابرات بهذه الصفات و تشك فى بطولته فما دليلك على ذلك ليس معنى انك لا تتابع اخبار البطولات بانه لا توجد<br />و ارجوا فى النهاية الالتزام بآداب الحديث و بالالفاظ اللائقة<br />و السلام عليكم و رحمة الله و بركاته"
archived = "2010-03-14"
