[[comments]]
order = 31
subject = "اديب فكاهى"
author = "شاب مصرى"
posted = "2007-10-15"
text = "استاذ نبيل فاروق انا كنت من المعجبين بكتاباتك اثناء فترة طفولتى ومراهقتى وللحق يقال فانك من الكتاب القلائل الذين يملكون اسلوبا مميزا وخيال خصب ولكن المشكلة انه كان هناك صراع دائم استاذ نبيل يعانى منه اغلب من يقرا لك ويملك عقل واعى بالاحداث هو انك تتحدث بالتاكيد عن بلد غير البلد التى نعرفها انت بالتاكيد تتحدث عن مصر اخرى غير التى نعرفها استاذ نبيل الشاب المصرى الذى تتحدث عنه لم يعد سيشغل نفسه بقضية فاشلة مثل قضية الانتماء الى مصر التى حرمته من ابسط حقوقه التى انت تحدثت عن انه ياكل ويشرب وينام فيها وبالتالى (هو يطول) استاذ نبيل ان ما تتحدث عنه وتقوله ليس حق انسان ووالضح انك قرات عن جمعية حقوق الحيوانات الاوروبية والتى اعتقد ان حقوق الانسان عندها اكثر مما قلت حيث ان من المعروف ان حق كل انسان طبيعى ان ياكل ويشرب وينيجد الماوى والعمل والامان والقدرة على تلبية احتياجاته الغريزية اين شباب مصر من كل هذا بالنسبة للعمل امام الشاب ان يعمل ليل نهار بعد التخرج وقرف الدراسة لياخذ من المال ما لا يسد احتياجاته ولا يستطيع به الزواج الا بعد خمسين عاما على اقل تقدير لذلك يجب ان يفكر بواقعية وينسى الزواج وحقه فى ممارسة رغباته بشكل شرعى مع انه يرى ان الكلاب الضالة تستطيع ممارسة احتياجاتها الطبيعية بحرية اكثر منه هذا ما تعطيه مصر لابنائها لا عمل مناسب ولا سكن مناسب وانت تعلم ان الملايين من المصريين يعيشون فى القبور على مستوى مغيشى تابى ان تحياه البهائم وطبيعى ان لا تدرك هذا وانت من طبقة مختلفة لان المشكلة الاساسية فى الشعب المصرى انه شديد الانانية مثلك فانت ما دمت تعيش وتتنزه فى اروروبا فالباقى يتحرق ويجب على المطحونين ان يمجدو مصر الحضارة اى حضارة واى امن ان مصر وامنها يخدم اسرائيل وامريكا على طول الخط وهذه حقيقة يعلمها العرب والعالم فاى كفاح واى بطولة يبدو انك تتحدث كما قلت لك عن بلد اخر واى انتماء انا ان صح انتمائى فانا انتمى الى الاسلام ولو حاربت فساحارب فى سبيل الله وليس فى سبيل الشيطان ااو مصر وحتى لو استخدمنا منطقك فهذا معناه اننى ساحارب ضد مصر لانها ظلمتنى ولو كانت مصر امى لكنت قاطعتها من ساعة ما كبرت ولمعلوماتك وانت انسان مثقف ولكنك تتجاهل العديد من الحقائق<br />1-هل تعلم ان بعد فتحخ باب الهجرة الى اسرائيل تقدن اكثر من 24000 مصرى للهجرة ولولا الخوف لزاد العدد<br />2_ هل تعلم ان اعداد المطالبين بالهجرة اتلى خارج مصر عديدة وان محاولات المهاجرين غير الشرعيين لا تياس حتى ولو خاطروا بحياتهم (طبعا ده كلله لانهم بيموتو فى مصر الحنونة) لدرجة ان الاتحاد الاوروبى وجه انذارا شديد اللهجة الى مصر بسبب الهجرة غير الشرعية<br />3_هل تعلم ايضا انى والشباب خرجنا نضحك من فيلمك الرهينة وشعرنا انه انضحك علينا لان فكرة الفيلم ساذجة لان حتى لو كلامك صح واللى عايشين بررة عايشين عيشة متدنيه فمعنى بقاؤهم هناك ان العيشة فى مصر اكثر تدنيا وهذا(طبعا قارن شاب ساكن فى حجرة مع 10 شباب احسن من عيشته فى مصر وسط الترب)<br />4_ه تعلم وهذا هو الاهم ان فكرة الشعوبية والتعصب للبد والقوميات فكرة زرعها الاستعمار الغربى للقضاء على اى فكرة للجهاد الاسلامى ووضع البديل الزائف بدلا من الجهاد فى سبيل الله وبالتالى العودة الى الاصولية والدينية التى هزمت اوروبا لقرون عديدة يتم استبدال هذا الكلام بكلام فارغ مثل فى سبيل الوطن او سبيل مصر وللاسف حال سبابنا الان لا عايز يحارب عشان مصر او ربنا بفضل ظروفه الا ادمية<br />5- هل تعلم لا مكان لها هنا هل تستطيع وانت صاحب الخيال الخصب ان تتخيل مدى امتنانك وشعورك تجاه بلد درست فيها وتخرجت ثم تاخد بعد عمل شاق طوال اليوم ما لايكف حتى ان تعيش تخيل مدى حبك لمصر الوطن الحنون الذى اعطاك كل هذا الترفيه فانت تاكل وتشرب وتنام وانت عايز تنهب دى مصر خيرها عليك<br />6- هل تعلمت استاذ نبيل انت ترجع الفضل لاهله عند حديثك عن ما تعطيه مصر وتنسى ان الله ربك وربى هو من اعطال الاكل والشرب والحياة وصاحب النعم عليك هو الله عزو وجل وليس (مصر)<br />استاذ نبيل صيحتى لك راجع جيدا تصنيفك كاديب شباب فانا اعتقد ان ما تكتبه فكريا يندرج تحت بنت كتابات كاريكتورية او فكاهية ولكنه ليس فكر علمى او موضوعى يقبل النقاش وشكرا"
