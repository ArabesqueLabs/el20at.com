[[comments]]
order = 44
subject = "د.نبيل فاروق..ليس مغروراً"
author = "أميمة الشاذلي"
posted = "2008-03-09"
text = "بسم الله الرحمن الرحيم<br />انا بصراحة مش عاوزة ارد على اللي هاجمو د.نبيل لأنني مؤمنة بالشاعر الذي قال<br />وإذا أراد الله نشر فضيلة طويت.. أتاح لها لسان حسود<br />د.نبيل غني عن أي تعريف.. ولقد قابلته شخصيا ولم أجد فيه الغرور الذي تحدثتم عنه<br />د.نبيل انسان بسيط الا أنه تعرض للكثير من ضغوط الحياة مما جعله أكثر خبرة وربما أكثر ضيقا مما يحدث<br />ولربما لاحظنا بعض الأسئلة المستفزة التي طرحت من قبل المحاور والتي لا نعرف نحن أيضاً بأي طريقة طرحت عليه<br />فربما أسأل أي شخص سؤالا فيرد علي بمنتهى الهدوء وربما أسئله نفس السؤال بطريقة ثانية فيرد علي بثورة<br />ما لم نعرفه هو كيفية طرح السؤال عليه<br />ثم إن ردوده كانت تلقائية وعفوية ولم أجد فيها ما يغضب..فكل انسان حر في رأيه<br />الغريب أنني قد لاحظت من البعض تغير في نظرته لكاتبنا الكبير وكأنه من المفروض أن تغير وجهة نظرك في شخص من أجل مقال واحد أو حوار واحد<br />هل الحكم على الانسان يكون بمجرد حكم الناس عليه<br />وكمان من مرة واحدة؟ حوار واحد؟<br />للأسف احنا فعلا بنظلم علمائنا وبعدين نقول..هم مش بيقدروا العلماء ليه؟<br />اذا كنا احنا مش بنحترمهم ..مستنيين ايه تاني؟<br />واللي كتب القصة للتريقة على أدهم صبري<br />هل هذا يعيب د.نبيل؟<br />بالعكس انا شايفاه ان الناس لقيت ان قصة ادهم صبري من كتر ما هي جميلة حبت تحط قصة طريفة ومضحكة وده مش بيأثر في قوة السلسلة<br />رجل المستحيل هتفضل هيا رجل المستحيل<br />وبعدين لعلمكم سبق ان د.نبيل فاروق نفسه قدم قصة مشابهة لدي لواحد من الناشئين وكان بيتريق فيها برضه على ادهم صبري<br />القصة كانت في العدد الاول من سلسلة مجانين للي يعرفها وكان الدكتور بيقدمها بمنتهى التواضع<br />فين الغرور بقة؟<br />لو كان مغرور مكنش قبل ان واحد قد ابنه يتريق على حاجة هو كتبها<br />لكن الموضوع كان ظريف جدا وانا لغاية دلوقت باضحك عليها كل ما أقرأها<br />يا جماعة راجعوا نفسكم وعقلكم قبل ما تحكموا على حد وكفاية تقطيع في فروة الراجل..ما يستاهلش مننا ابدا اللي انتم كتبتوه ده<br />ربنا يسامحكم<br />وربنا يخلي لينا د.بلبل اللي طووووووول عمره بيمتعنا بكل قصة وكل دراسة وكل رواية بيكتبها"
archived = "2010-03-14"
