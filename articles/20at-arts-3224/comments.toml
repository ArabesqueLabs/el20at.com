[[comments]]
order = 50
subject = "مش غرور"
author = "محمد عبدالله"
posted = "2008-03-26"
text = "د.نبيل فاروق من كتاب مصر المشهورين ساهم فى تجميل صورة وطنه امامنا واما كل الشعوب وذلك التعليق الذى كتبه<br />مصطفى فتحى يقول فيه(لا احب نبيل فاروق ولا اقتنع بما يكتبه اشعرانه يكتب لمجرد الكتابه افكاره مكرره ومعلوماته ليست كما يتصور الكثيرون كما انه يعشق ان يعيش فى دور المثقف عندما تجلس معه تشعر انه حمل ثقيل بعكس احمد خالد توفيق الذى اعشق كتاباته) ذلك التعليق فى الواقع تم كتابته بواسطة احمد خالد توفيق واناارى ان نبيل فاروق افكاره ليست مكرره ابدا بل انه مبدع موهوب بعكس احمد خالد توفيق الذى كتب معظم التعليقات التى يصف فيها نبيل فاروق بالغرور كما انى لم اقرا روايه من تاليف احمد خالد توفيق الا ووجدتها مقتبسه من فلم مثل هرقل وسوبر مان ومعظم الافلام الرعب وانه ليس بمبدع اوعبقرى مثل نبيل فاروق وقد راينا كيف لميحضر احمد خالد توفيق الندوه حقدا وحسدا من الدكتور العبقرى نبيل"
archived = "2010-03-14"
capture_url = ""

