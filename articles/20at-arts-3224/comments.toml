subject = "لازم نكون ناس محترمه"
author = "hepa1"
posted = "2008-01-20"
text = "انا قرات معظم الردود يا جماعه لازم يكون عندنا ادب الحوار وادب الاختلاف<br />الناس الى بتقول انه مغرور انت شفته وهو بيتكلم ؟ لا ده كلام منقول يعنى ممكن يكون هناك اكتر من غلط<br />وانا لا اهاجم<br />والناس الى بدافع<br />احنا لازم نكون متحضرين كفايه ان احنا نختلف مع حد بس نفضل نحترمه<br />الراجل قضى عمرة بيسعى انه يحقق حلمه<br />ومع اصراره حققه<br />وهو انسان بسيط زى ما ام ريم بتقول هو عايز يربى ولاده مقالش اخد نوبل<br />الناس الى اتكلمت ليها هدف فى الحياه ولا مقضياها نت<br />فكروا فى نفسكوا قبل ما تهجموا<br />مع ان ده من حق كل انسان<br />بس نحاول على الاققل نحترم الانسان الى مختلفين معاه<br />والى بيقول انه مقدرش يقول انه مصرى<br />ياخى ده عيبنا احنا ان مصر وصلت للى وصلت ليه<br />لو كل واحد فينا بيحترم الكبير وبيشتغل وبيحب ربه<br />مكناش كده<br />وانا فخورة جدا انى مصريه يكفى ان الرسول قال (فهم فى رباط الى يوم القيامه)<br />وياخى لو اى شعب فى العالم اتعرض للى احنا فيه لكان انهار واختفى<br />بس احنا لسه عندنا المقدرة على الضحك<br />ياشباب وسعوا معرفتكم وانضجوا شويه<br />وفى الاخر وبغض النظر عن اى شىء<br />الراجل ده يستحق الاحترام"
archived = "2010-03-14"
