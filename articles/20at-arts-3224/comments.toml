text = "انا ايضا لا احب احمد خالد توفيق ابدا رواياته مقتبسه فأانا وعلى الرغم من قرائتى اربع روايات فقط لااحمد خالد الاانى ووجدتها ممله واثنين منهم وجدت احداهم مقتبسه من هرقل فى روايات فانتازيا والاخرى من فلم اجنبى احمد خالد توفيق لايمتلك موهبه اطلاقا وانت ياعماره تعتقد ان سلسلتى ارزاق وزوووم هما الافصل لانك لم تقراء غيرهما وانا بدأت بقراءة ملف المستقبل واعتقدت انها الافضل ثم كوكتيل واعتقدت انها الافضل وهكذا لذا عليك تجربة انواع اخرى وستجد انه كلها جميله ولكن والحق يقال حرب الجواسيس هى الافضل وانا مصروف يدى لا يكفى لها جميعا او نصفها ولكنى انوع مره ملف المستقبل مره كوكتيل وهكذا وبالنسبه لايميلى فانا لا امتلك على iname ولكنى اعدك بانى سأعمل واحد وساخبرك به قريبا وانا<br />امتلك ايميل yasen_didoman2010@hotmail.com و<br />اريد ان اعرف رايك فى ماقلته انا عن احمد خالد وارجو منك فتح هذا الموقع كثيرا حتى ترى ايميلى الجديد ولى ايميل اخر هوyasendido2010@yahoo.com"
archived = "2009-06-02"
