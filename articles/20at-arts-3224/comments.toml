author = "محمد عبد الحميد"
posted = "2008-05-30"
text = "لا أعلم لماذا يسيطر علي عقولنا الفكر الاحادي المطلق .. لماذا لانقبل بالتعددية التكاملية ... من يحب دكتور نبيل (وأنا من عشاقه بالمناسبة) ينسي أنه بشر قد يخطيء وقد يصيب .. بل وينسب السباب والشتائم لدكتور أحمد خالد .. ومن يكره دكتور نبيل ينسب اليه كل النقائص ويدعي ان الدكتور يكتب مديحه بنفسه... ما هذا كله يا أخواني .. الاختلاف بيننا هو سنة الحياة .. مالعيب في ان نقبل الاخر علي علاته ... فالانسان يستمد تميزه ووجوده من هذا الاخر ...<br />ملحوظة أخيرة أخواني .. تعجبت كثيرا من تناول مسالة الغيرة بين الدكتور أحمد خالد والدكتور نبيل ... صعب أوي حاجة زي كده تكون حقيقية ... احنا بنتكلم عن اتنين من كبار مثقفي هذه البلد .. مش عن اتنين مطربين .. واظن اصحاب هذا الراي من اخواني لم يقرأوا قصتي (اسمه أدهم) و (أرشيف الغد) للدكتور أحمد .. من قرأهم سيجد أن القصتين عبارة عن قطعة سيمفونية في مديح الدكتور نبيل وأعماله ... خصوصا رجل المستحيل وملف المستقبل ...<br />عن نفسي أنا بدأت اقرا رجل المستحيل وملف المستقبل وكوكتيل منذ السابعة من عمري ... ومش هاقدر أوصف مهما حاولت اثر هذا في حياتي ... يكفي أن أذكر انني ومعي مجموعة من الاصدقاء الذين بدأوا قراءة هذه السلاسل في مثل عمري كنا نتحدث ونحن في الصف الثاني الاعدادي عن روسيا القيصرية والاتحاد السوفيتي وحالة التقشف الرسمية المعلنة فيه ...<br />اخواني في الله أرجو تقبل الاخر والتعايش معه بل والتكامل معه ..."
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

[[comments]]
order = 70
subject = "ضع عنوان التعليق"
author = "banota masreya"
posted = "2008-06-04"
text = "الدكتور نبيل فاروق دا راجل محترم ويستحق دا عن جداره ولو اخدنا بالنا من كل ابطال قصصه نلاقيهم بيصلو وبيلتزمو باخلاق فاضله مش ممكن نلاقيها دلوقتى وبيحاربو بنبل وشرف مش بحقاره ومن ورا الضهر وبعدين الراجل ده عاش عمره كله يحاول يزرع الوطنيه وحب البلد جوانا من بنات لاولاد ويحسسنا اننا بشر اذا كنا بدانا نفقد ادميتنا فى الواقع هوا بيحاول يرجعهالنا وانا عن نفسى اول ماقريت قريت قصصه واول معلومات كانت برده من قصصه ورواياته وان كانت فى اطار مسلى والمعلومه اللى كنت بصادفها فى قصه عمرى مابنساها مش زى معلومات كتب المدرسه اللى اول ماخرج من الامتحان انسى اسم الماده اصلا احنا بدل مانهاجم الدكتور نبيل المجترم المثقف نهاجم مافيا الاسعار اللى خنقونا وخلو الناس تستغنى عن اساسيات فى حياتها علشان الاسعار اللى ولعت وبعدين هوا مش ذنبه ان عقله سابق عصره والبلد اللى عايش فيها هوا كان ممكن يسافر برا ويكتب ويشتهر مليون مره اكتر من دلوقتى ويكسب مليون مره اكتر من دلوقتى بس للاسف هوا وطنى حابب يفضل فى مصر واللى فى مصر مش مقدرينه وعلى فكره هوا لو مغرور مكنش اتكلم مع محاور او محاوره مجهولين الهوويه او مبتدئين بالذمه ده مش قمه التواضع خلينا ساكتين احسن"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

[[comments]]
order = 71
subject = "مصر"
author = "هشام"
posted = "2008-06-09"
text = "أرجو من القائمين علي الموقع متابعته باستمرار وإزالة أي كلام قذر أو سباب يتم فيه , وخاصة هذا المعتوه الذي قام بسب الدين . . .<br />وأحيي الصديقين عمارة وياسين علي تصرفهما الحضاري واعتذار كل منهما للآخر . . .<br />أنا من محبي نبيل فاروق بشدة , صحيح أن أسلوبه به بعضا من العيوب والانتقادات إلا أن التأثير الجبار الذي قد أرساه في عقول الملايين من الشباب لا يمكن أن يتجاهل , وأعتقد أن انتشار روايات أدهم صبري في أوساط الشباب خير من انتشار أرسين لوبين أو مجلات البورنو<br />الرجل يريد أن يصلح ما أفسده المجتمع علي مر عقود , وأتمني أن نري مثله في مجالات الموسيقي أو السينما"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

[[comments]]
order = 72
subject = "قضية هامة"
author = "بهاء بدر الدين"
posted = "2008-06-09"
text = "عزيزى دكتور نبيل حاولت كثيرا الأتصال بك لعرض قضية هامة عليك أرجو أن تتبناها وتدافع عنها وهذه القضية هى حرب أكتوبر ستسألنى ما المشكلة ؟؟<br />المشكلة هى أن الدعاية الصهيونية روجت فى العالم بأكمله أن حرب أكتوبر أنتهت بنصر للجيش الأسرائيلى وللأسف هذا الكلام يدرس كتاريخ فى بعض الدول العربية ولعلك ياسيدى قد لاحظت أن السادس من أكتوبر من كل عام لا يحتفل به سوى مصر وسوريا فقط . وقد شاهدت منذ سنوات على قناة أم بى سى برنامجا يسمى خمسون عاما على الصراع العربى الأسرائيلى وهو من أنتاج محطة البى بى سى البريطانية وتم دبلجته للعربية وقد أستضاف البرنامج عددا من الشخصيات العربية و الأجنبية ممن عاصروا تلك الحرب ولكن ما لفت نظرى حقا هو ما قاله السفير السوفيتى فى واشنطن فى تلك الفترة ويدعى أناتولى دوبرينين ويبدو أنه أفرط فى أحتساء الفودكا قبل ظهوره فى البرنامج فقد ذكر لافض فوه أنه بنهاية حرب أكتوبر كانت الدبابات الأسرائيلية تحاصر القاهرة تمهيدا لأقتحامها ( نعم لم تخطئ القراءة ولم أخطئ الكتابة) وأن الرئيس السادات كان منزعجا من أحتمال أحتلال القاهرة فى أى وقت . أولا الكل يعلم ظروف حدوث ثغرة الدفرسوار والدور القذر الذى لعبه هنرى كيسنجر وزير الخارجية الأمريكى خلال تلك الحرب بأعطائه الضوء الأخضر لأسرائيل لخرق وقف أطلاق النار للحصول على مكاسب جديدة تساعدهم فى المفاوضات وقد كان أحرى بالسيد دوبرينين أن يتحدث عن موقف بلاده المخزى من مصر خلال الحرب ففى الوقت الذى أطلقت فيه الولايات المتحدة جسرها الجوى الشهير الذى أنقذ أسرائيل من هزيمة مروعة أكتفى الأتحاد السوفيتى ببيانات الشجب و الأستنكار التى يجيدها ولولا الدول الصديقة كيوغوسلافيا و الجزائر سارعت بأمداد مصر بالدبابات عوضا عما فقدته ما تمكن الجيش المصرى من محاصرة الثغرة ووقف أنتشارها تمهيدا لتصفيتها وأقول للسيد دوبرينين أذا كانت القوات الأسرائيلية شرق القناة كانت تخوض معارك عنيفة لمنع قواتنا من أغلاق الثغرة وقطع طريق أمدادها الوحيد والقوات الأسرائيلية فى غرب القناة كانت فى وضع حرج جدا بعد أكتمال حصارها وأصبحت مهددة بالأبادة فأين هى القوات التى من الممكن أن تحاصر القاهرة بل وتحتلها أذا لزم الأمر؟؟؟؟<br />عزيزى دكتور نبيل لقد أعيتنى الحيلة بعدما بعثت بهذا الموضوع الى أكثر من صحيفة أو مجلة ولم يهتم أحد بالأمر وأنا كلى ثقة بأن أحدا غيرك لن يهتم بتلك القضية فلديك العديد من المؤلفات الوطنية التى يقرأها الجميع من كل الأعمار وأنت قادر بأذن الله على تصحيح هذا الوضع فى عيون الكثير من شباب بلدنا ممن يحبونك ويثقون فيك.<br />وفقك الله والسلام عليكم ورحمته وبركاته"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

