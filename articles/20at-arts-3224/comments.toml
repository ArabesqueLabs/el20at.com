[[comments]]
order = 12
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-03-10"
text = "انا قرات كل روايات نبيل فاروق تقريبا و انا مع ان الرجل عمل انجاز كبير و ذلك الانجاز انة جعلنا نثق ان هناك فعلا بلد اسمة مصر و ان هناك فعلا رجال تعمل من اجل مصلحة هذا الشعب لكن الواقع اثبت عكس ذلك فالشعب المصري الان من احط الشعوب اخلاقا و منارة الدعارة التي يقتدى بها في منطقتة و حكومتة اكثر الحكومات عمالة للغرب و منفذة لمشاريعة بدون قيد او شرط و يوما بعد يوم يقومون ببيع خيرات البلد و كرامة شعبة بدون مقابل حتى ان كلمة مصري بين العرب الان مرادف للوضاعة و الانحطاط و السرقة و ذلك الانهيار على كافة المستويات<br />فسياسيا لا يرقى الى دولة صغيرة مثل قطر او السعودية<br />و اجتماعيا اصبح مفكك منهار (اولاد الشوارع , بائعات الهوى , ....)<br />خارجيا ذي الذفت و المصري ليس لة قيمة و حتى لو حدث لو مات لا تقوم الحكومة بارجاعة الى بلدة و تقوم بتصريحات بيعة على الملا بدون اكتراث لما سوف يحدث لة<br />تعليميا مثار للسخرية فالاردن و تونس اللذين كانوا في الكهوف منذ سنوات قليلة اكثر تقدما و كفائة و انجاز حقيقي اكثر منة<br />, و على كل الاصعدة و المجالات تقريبا تجد المصريين في المؤخرة<br />و بعد ذلك تقول لي مخابرات و ابطال و كلام فارغ مالهوش اي دليل يا عم روح انت بتلعب على مين حتى المخابرات المصرية منذ انشائها مجرد بيت للدعارة و الشذوذ مش مهارة و رافت الهجان اللي هم فرحانين بية اكبر دليل<br />لابد من محاسبة النفس بموضعية اذا اراد المصريين خروجهم من المذبلة التي وضعو انفسهم فيها و ليس بخداع النفس و الخيال اللذي يروج لة نبيل فاروق<br />و لو راجل بصحيح رد على الكلام دة بدون لف او دوران<br />ما تعليقق على قول القذافي ان حسني مبارك باع لي المصريين اللي عندي؟<br />ما تفسيرك لاوامر الخارجية بمنع العاملين في الخليج من التظاهر او الانقطاع عن العمل تحت اي ظرف؟<br />ما الرد على تصريح بوش ان مصر حليفة امريكا الاولى في المنطقة و ليس اسرائيل ؟؟؟!!!! الا تعلم يا رجل ان اسرائيل تقول لا لامريكا و لا تنفذ الا الذي في مصلحة شعبها اما مصر فتنفذ الاوامر بدون تردد<br />لقد قال لي طفل فلسطيني من عرب اسرائيل كما يسمونهم ( انا اسرائيلي و افخر بذلك حتى النخاع )<br />و لم استطع الرد علية اتعلم لماذا ؟؟؟؟؟؟؟ لاني مصري و لا افخر ابدا باي حال من الاحوال اني مصري<br />بل و اتبرا من هذا الانتماء لما اراة من مذلة و وضاعة المصريين و خذلان حكومتة و بيعها دمة و مالة و عرضة<br />ادعوك يا عم نبيل الى مراجعة نفسك فانت تخدع شباب هذا الجيل و ربنا يهديك"
archived = "2010-03-14"
capture_url = ""

