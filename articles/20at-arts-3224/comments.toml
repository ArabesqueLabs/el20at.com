author = "أيهاب صالح"
posted = "2008-02-28"
text = "ياأصدقائى الدكتور نبيل فاروق ليس ماتتصورونه جميعا فمع الأسف الشديد من يقرأ له حاليا ليسوا من جيله ولذلك لم يشاهدوا أفلام وروايات الخيال العلمى فى السبعينيات والثمانينات بالإضافة الى أنهم لم يقرأوا مجلة تان تان التى كانت تصدر فى سبعينيات القرن الماضى وكان نبيل فاروق من قرائها الدائمين ومنها أقتبس أغلب أعماله وبخاصة حلقات الخيال العلمى مثل ليك أوريان وغيرها ولنبدأ معا بأمثلة من ملف المستقبل الرواية 34 مقتبسة من الفيلم الشهير 20,000 فرسخ تحت الماء0 الرواية 60 مقتبسة من مسلسل أمريكى كان يعرض بالتليفزيون المصرى فى أواخر الستينيات و مازال يعرض حتى الأن على بعض الفضائيات وأسمهland of the giants أى أرض العمالقة أما الروايات من 76 حتى 80 فهى مقتبسة بالنص عن مسلسل أمريكى أسمه V وكان يعرض فى نوادى الفيديو بمصر فى أواخر الثمانينات تحت أسم أحتلال العالم . وهذه عينة صغيرة فقط من مؤلفات كاتبكم الأسطورى ولدى الكثير ولسوف أرسله لكم قريبا.<br />مع تحيات<br />أيهاب صالح"
