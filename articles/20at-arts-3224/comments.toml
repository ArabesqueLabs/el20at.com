text = "نعم يكفينى انه مصرى وابن مصر وبيعمل من اجل مصر وكل انسان له سلبياته وحتى ان كان مغرور زى ما بتقولوا _مع انى مش شايفة كده خالص_ الواضح ان ايجابياتة تكسب و انا عايزه منه فنه الراقى وثقافته وايجابياتة الكتييييييييييير واحترامه لذاتة ولدينه ولوطنه مصر اما الاخ اللى بيقول انه زعلان انه مصرى فاقوله وماتزعلش منى ان لو كل المصريين زيك كده لنا قولنا على مصر يا رحمن يا رحيم من زماااااااااان اية الجحود ده يا اخى معلش اصل انت مشوفتش غير السلبيات ده بدل ماتصلح فيها اخى فى الله دور على اوجه الخير فى بلدك واعمل على اظهاره بدل ما تعمل على تشويه صوره مصر بالشكل ده دا كفايه الجدعنة المصرية و اخيرا ما تزعلش منى لانى بحب مصر وبحب المصريين فى الله"
