text = "(بسم الله الرحمن الرحيم)<br />و(السلام) عليكم و(رحمة الله) و(صلى الله) على (الحبيب)و(اله)<br />اذا كان الكلام الجاهل من عينة ان المخابرات المصرية رمز للدعارة منذ نشأتها والدليل الهجان نفسه<br />فالدليل على قوتها حرب 1973 نفسها ولعبها مع كبار العالم<br />لست من هواة الطنطنة الوطنية ومصر ام الدنا ومثل هذا الكلام<br />لكن انا احترا م الشىء الجيد فى حياتنا و لاداعى لضمه الى قائمة سلبياتنا والا سنظل نهدم كل ما هو جيد بمعاملتنا له معاملة الشىء الردىء ونبدأ من الصفر دما لنسأل انفسنا حنا ليه مش بنتقدم؟<br />(السلام) عليكم و(رحمة الله) و(صلى الله) على (الحبيب)و(اله)"
