subject = "إلى كل من كتب تعليقاً,,,,"
author = "الأسيــــر \"أسير عشق مصر"
posted = "2008-02-05"
text = "إلى د/نبيل فاروق<br />بارك الله فيك ولك وأعانك على فعل الخير وأثابك بنيتك على ما فعلت للشباب على مدار السنون وإن كنت مغروراً ولا أرى ذاك فلك الحق , وإن كنت واثقاً فى الله وبنفسك فثق سيدى ثقه عمياء ...إنسان أحبك ويعرف أن البشر ليسوا ملائكه ...<br />وإلى الشاب الحقير الذى يندم على كونه مصرى ....هأقولك زى ماقال عزت العليلى لنبيل الحلفاوى فى فيلم الطريق إلى إيلات....مش أدها سيبها ياأخى وريحها وريحنا منك ومن نتنك .....<br />وإلى (حبيبى فى الله )شاب مصرى....<br />............................................أكثر الله من أمثالك وجزاك الله خير الجزاء على ما قولت ولا فض الله فاك لقول الحق والنطق به دوماً ورزقنى الله وإياك شهادة فى سبيله على أعتاب الأقصى المبارك فى سبيل نصرته وعودته.<br />وإلى أخوتى (بنت مصريه وhepa1) بارك الله لكن على ما قولتموه ...ولكن من يستمع؟؟؟<br />وإلى الفنان المتميز والمؤلف البدع ...كاتب القصه رقم65468 واللى حفظت رقمها بالعافية :-) :-) :-)<br />جامد بس إستغل موهبتك الفذة دى فى التهكم على من يستحق<br />وعلى كلٍ وبمنتهى الموضوعيه قصتك جامده موووووووووووووووووووووووووت وتستحق القرأة والتثيبت :d :-)<br />وبارك الله فيكم ولكم جميعا وأعطى الله منكم الخير والإنتماء لهذا البلد العظيم وحسن الإنتماء لهذا الدين القويم<br />وصلى الله على محمد وعلى آله وصحيته ومن صار على هديه وأستن بسنته إلى يوم الدين<br />والسلام عليكم ورحمه الله وبركاته<br />أخوكم فى الله محمد الأسير"
archived = "2010-03-14"
