[[comments]]
order = 62
subject = "العفو يا أخى"
author = "عمارة الليثى"
posted = "2008-04-10"
text = "أخى ياسين أنا متأكد أنه ليس لك دخل بهذا الشخص العاهر فأنت عندما أعتذرت لم تكسب أحترامى وتقديرى وحدى بل كسبت أحترام وتقدير القراء والذى أقصده بالتحديد أن بعض القراء المتحمسين جدا لايقبلون النقد وهم رغم كل شئ محترمون ولذلك كما يلجأ بعض الناس لأستئجار بلطجي ليؤدب أحدا يقوم بعض القراء بأستئجار أحد المشردين ليكتب ما لايستطيع هو كتابته ولذلك كن مطمئنا ياأخى فأنا أكن لك كل الأحترام والتقديرe"
