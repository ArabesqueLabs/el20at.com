[[comments]]
order = 18
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-03-31"
text = "د.نبيل<br />أشكرك جدا على هذه المقابلة المتميزة .. وأنت انسان رائعٌ ومبدع حقاً<br />بالنسبة لي فأنا أعرفك عن كثب ، ولكنك لا تعرفني ، لكن ... اثباتاً لهؤلاء الذين يقولون عنك أنك مغرور ، فدعهم يقولوا ما يشاؤون ، فلكل انسان نظرة على حسب تفكيره ، وعلى حسب وجهة نظره ومحدوديتها والطريقة التي يفكر بها .. واعتقد ان نظرتهم هي نظرة عقيمة غير مجدية ، ممن يذمون وعميت ابصارهم عن رؤية بعض الحقائق و فقط ترى السلبيات .. مصر هي وطننا ولن نتخلى عنه لأجل ما فيه من فساد ، يكفي انك انت غير فاسد .. فهل انت كذلك ؟ اذا كنت فيكفي مصر شرفاً ان تكون اح ابناءها ، ولا تغتر فلست وحدك .. وهذا استاذنا الفاضل نبيل فاروق من اوضح الامثلة ، وممن تكون مصر مشرفة بأمثاله .. والكثير الكثير ..<br />ان الاوضاع لا تتحمل نظرياتكم الضيقة .. تيقنوا الامر ثم تعالوا وتحدثوا..<br />د. نبيل<br />قرات كل كلمة وكل حرف بتمعن .. اشكرك من اعماق الفؤاد .. ومرحبا بكل جديدك .. وربنا يسهل لك ولأبنائك الاعزاء اكمال هذه الفترة وتقر عينك بهم يااارب .. وربنا يخليهم ليك ..<br />الله يوفقك ان شاء الله ويحفظك والعائلة ، ويظل قلمك ذهبياً إلى اخر العمر ان شاء الله ..<br />لك تحية تقدير واحترام .. ووقفة معزة و سلام<br />في امان الله"
archived = "2010-03-14"
capture_url = ""

