author = "ابو اسامة"
posted = "2007-06-20"
text = "يبيعون دولة من اجل الحكم هم دائما حكامنا.عباس زى حسنى زى عبدالله باعوا بلادهم وآخرتهم من اجل الحكم<br />لكن فى النهاية الحق لازم ينتصر .وعلشان الأخوة الى مش فاهمين ان كل الى بيتقال عنحماس هو كذب انا لاادافع عن حماس فان كان لها خطاءفهو انها رضت بالسلطة على الجهاد فما يقصده الكاتب العظيم الذى اعتبره اخر الرجال المحترمين<br />ان الخيانة هى من فتح وقادتها وانها خطة مرسومة من امريكا واسرائيل."
