text = "اللى انا فاهمة اكتر يا استاذ فهمى هويدى .. ان غزة بتمدها اسرائيل بكل المرافق .. بالتالى حماس انتصرت او اللى بادرت بالانقضاض قبل ما قتح تنقلب .. تنقلب عشان تاخد ايه عشان تاخد ايه بجد والنيى .. ومش هى دى السلطة الفلسطينية الخائنة اللى انت كنت شايفها ما تسواش الناس تعتبرها من سنتين بس .. بقت دلوقتى شرعية ومتنازع عليها كمان .. مش السلطة اللى حماس رمت عيال من البلكونات عشانها جاية وفقا لاتفاق اوسلوا اللى حماس اصلا مش معترفه بيه .. مشكلة حماس هى التذاكى التذاكى التذاكى"
