[[comments]]
order = 2
subject = "الحمار فاهم كده .... وصاحبى مش فاهم كده"
author = "سمسم أفندى"
posted = "2007-06-22"
text = "أولا اسجل احترامى الشديد للأستاذ فهمى هويدى. هذا الرجل الذى قل ان نجده فى مثل هذه الأيام.<br />لكن أن أقول له يا استاذ فهمى كل الناس عارفة الحقيقة . عارفة ان اسرائيل هى العدو الأول والأخير لنا ومن تبعه فهو مثلها . لو واحد سال نفسه ايه سب المشاكل التى نعانى منها لوجد انها من سوء الادارة أى الانظمة التى تحكم وتدير. ولو واحد سأل نفسة سؤال تانى طيب الأنظمة الفاشلة باقية ليه ؟ أكيد الجواب أن هناك من يدعمها. ولو سأل نفسه مين اللى بيدعمها لوجد انها الأم غير الشرعية للدنيا الآن ... أمريكا. اللى هى بنت خالة اسرائيل الكبيرة . يعنى من الأخر \"وهذا راى شخصى\" إن اسرائيل هى سبب كل المشاكل التى نعيش فها هى وكل من يتعاون معها او يدعمها.<br />لكن اللى انا مش قادر أفهمة . هو حصل ايه؟! كل العدد ده من الناس عارف كده بس يجى يتكلم يتكلم غير كده ويقول غير كده . طيب ليه ؟؟؟!!!! يقول لك هو كده ... يا عم ليه كده ؟؟؟؟!!!!! يقولك هو برضه كده. يمين شمال....... هو كده. تسمع كلام يوقع من الضحك عن السلام والحياة الكريمة اللى احنها عايشينها فى ظل السلام مع اسرائيل وكان زمننا صرفنا أد كده على الحرب ز أقول له يا عم ما احنا صرفنا أكتر من كده على السرطان اللى جاى لنا من اسرائيل بسبب المواد المسرطنة اللى جابوها العملاء من هناك قال ايه لتحسين الانتاج الزراعى. ... يلف ويدور ويهبل فى الكلام وبرضه كده . .... من الأخر أنا قررت أحاور واحد تانى ..... أنا جبت حمار ... أيوة حمار.... وقعدت معاه وقلت له يا حمار . ايه رأيك فى كده . لقيت الحمار فاهم أحسن من كده . الحمار عارف سكته مضبوط . يمشى لواحده ويوصل لهدفه ويقول الحق ولو على رقبته ...ز خلاص من يومها وأنا قررت أصاحب الحمار"
archived = "2010-03-14"
capture_url = ""
