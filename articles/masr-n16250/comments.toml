subject = "ربنا يرزقها ويعطيها الصحة"
author = "مسرور"
text = "ويعطى كل محررى ولاد البلد الصحة والعافية<br />التحقيق الجاى يبقى عن واحدة جزماتية واللى بعدة عن واحدة بتبيع لحمة راس وكرشة وقوانص علشان تكون دروس للاجيال القادمة علشان يسيبوا العادات الهايفة ويتعلموا طرق اكل العيش الشريف"
archived = "2008-06-15"
