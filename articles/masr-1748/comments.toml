subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-08-06"
text = "محمد عبدالعليم دا بياع كلام وللعلم انا من دائرة محمد عبدالعليم بس للاسف انتخبته لانى كنت بحسبه يستاهل لكن هو يتظاهر ولا يعمل شىء يحاول انه يتكلم وخلاص انا عايز اساله سؤال عملت ايه لاهل دايرتك مش بنشوفه الا قبل الانتخابات ولهم حق يشيلوه لانه بيتكلم وخلاص مش دا النائب الصح ولا له اى لازمة بيحاول يغلط فى الناس وخلاص لو فعلا هو كويس كان خدم اهل دائرته لكن تعالو شوفو مركز فوه ومطوبس حالهم لا يسر عدو ولا حبيب"
