[[comments]]
order = 2
subject = "نائب شعب"
author = "عبد المنعم شوقي"
posted = "2008-01-03"
text = "أولاً أنا مشفق جداً على هذا النائب المحترم الذي لو رشح نفسه في أي مكان ما أظن أن يفشل<br />ثانياً حزب الوفد كان يرشح في نفس الدائرة نائب آخر عنه كان يحصل على أصوات أقل من التوكيلات التي كان يعملها لمناصريه ولا عزاء لحزب الوفد . ثالثاً هذا النائب حين يتكلم ينفس عن حال القطاع الأكبر من الشعب و الله معه لأنه يتحمل التبعات وحده . والله وددت لو نصحته بترك العمل السياسي شفقة به و بأولاده و لكن الرجال يصمدون لآخر شهيق و الله وحده المسئول أن يعين هذا الفتى المصرييييييييييييييي حتى النخاع الوطني حتى المشاش ( قلبي معاه )"
archived = "2010-03-14"
capture_url = ""

