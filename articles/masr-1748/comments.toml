text = "الشعب اساسا ضد الحكومة وانت استغليت الفرصة دى عشان تطلع تشتم فى الحكومة كمان انت ماحدش بيشوفك فى الدائرة خالص ولم تقدم خدمة واحدة عامة للبلد والناس كانوا بيعترضوا على النائب السابق عشان كان بيعين ناس معينة وانت عملت نفس القصة وعينت كبارات البلد بس النائب السابق له انجازات عامة كثيرة ومن الاخر انت ذى ما قالت عنك منى الحسينى فى العاشرة مساء انت بتاع شو اعلامى"
