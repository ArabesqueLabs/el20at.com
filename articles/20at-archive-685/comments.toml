subject = "اي حب هاد"
author = "محمد دراوشة"
posted = "2007-11-05"
text = "اي حاب هاد انا حبيت مرة وضلت علاقتي تلت سنين وكنا نحب بعض حب مش طبيعي (المفروض يعني) بس اول ما تركتها وسافرت كل شي انتها بنسنة الها يعني ما كان حب بنسبة الها كان تسلية وتضيع وقت وانا الي حبيت بجد وكنت مستعد اعمل اي شي عشانها راحت بكيسي بس يا خسارة"
