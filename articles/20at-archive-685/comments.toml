subject = "قال حب ههههه"
author = "غدير مسلم"
posted = "2008-01-02"
text = "انا سمعت عن الحب<br />وكان نفسي احب وحبيت ابن صفي او تعلقت في وهو كان يحبني كتير<br />لما وصلنا المرحلة الثانوية بطل يعتبرني صار يحب غيري<br />بس انا بموت في يا ريت يرجع يحبني لانو حلوووكتير"
