[[comments]]
order = 2
subject = "تصدق مش عارف ؟"
author = "فارس الخيال"
posted = "2008-02-22"
text = "امممم ... تصدق مش عارف .........انا نفسي مش عارف اذا كان الحب في الجامعة كله خيبان ولا فيه حب حقيقي في النص<br />انا بعرف بنات كتير في الجامعة و بعرف اذا كان حبي ده حقيقي ولا لأ<br />ازاي<br />عن طريق اني بشوف نفسي فبلاقيني بحب كذا بنت في وقت واحد<br />فبعرف ان ده مراهقه<br />اما لو ميلت لواحده عن غيرها فبعرف ان ده اعجاب وبعد كدا ممكن يتحول لحب<br />وعموما انا بحاول اخلي عقلي يتحكم في ده ويشوف هل ده مظبوط<br />هل البنت دي ممتازه تصلح للجواز<br />هل البنت دي كويسه واهلها كويسين<br />انتوا عارفين انا من بداية فتره المراهقه حبيت حوالي 33 بنت وكله بيضيع هبااااء"
archived = "2010-03-14"
capture_url = ""

