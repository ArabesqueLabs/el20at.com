[[comments]]
order = 2
subject = "اللى يستاهل كل اللى بيجراله"
author = "واحد من الشعب"
posted = "2008-02-28"
text = "حلوة محمود الخطيب عشان القافية لا شاعر بتحشر الخطيب ،لكنها القافية اللعينة عبيط .....خطيب وحتى كده كمان القافية مش تمام اقولك ينعل ابو الشعب المصرى الفهلوى اللى 99% منه نصابين وفهلونجية وفعلا عقاب ربنا جابلهم رئيس وحكومة زى دول وعلى فكرة انا مصرى مش خليجى وعايش فى جوه تراب مصر العظيم اوى وبشرب من ميه النيل وبشم الهوا النضيف يعنى مصر خيرها مغرقنى لا بصراحة مش عارفين نودى جمايل مصر الكتيرة دى فين (......) يا مصر حد الشتيمة اللى على كيفك"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004128/http://masr.20at.com:80/newArticle.php?sid=14405"

