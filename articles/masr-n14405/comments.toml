subject = "المهاجر"
author = "نيفين نيفى نوفا"
posted = "2008-02-29"
text = "اولا الموضوع جميل يل مروه لانى بحب خالد النبوى جدا<br />انا شايفه ان خالد النبوى مخدش حقه لغايه دلوقتى باستثناء افلام المهاجر و المصير<br />خالد فنان حساس و جامد جدا<br />اتمنى اشوف الفيلم قريب و اقول رايى"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004128/http://masr.20at.com:80/newArticle.php?sid=14405"

