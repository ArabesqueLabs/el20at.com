[[comments]]
order = 0
subject = "يجعله عامر"
author = "مصرى غريب"
text = "مبروك لرءيسنا ومبروك للشعب ويارب يفرحه ويبسطه دايما عشان ميقساش علينا اكتر من كده<br />عشان احنا بنحبه وعايزينه دايما لاننا منعرفش غيره واللى نعرفه احسن من اللى منعرفوش<br />ويجعله عامر"
archived = "2007-05-02"
capture_url = "https://web.archive.org/web/20070502013051/http://masr.20at.com:80/newArticle.php?sid=9949"

[[comments]]
order = 1
subject = "والنبي لنكيد العزال"
author = "مصرية"
text = "أرجو من فناني الفرح الملاييني ألا ينسوا غناء الكلمات الرائعة للسيد \"محرم\" فؤاد... والنبي لنكيد العزال ... ونقول اللي ماعمره اتقال.. ياكايدينهم .... ياتاعبينهم.... بالقوي ياحنا\" مع اهداء خاص لكل فئات الشعب المصري وانا أولهم...."
archived = "2007-05-02"
capture_url = "https://web.archive.org/web/20070502013051/http://masr.20at.com:80/newArticle.php?sid=9949"

