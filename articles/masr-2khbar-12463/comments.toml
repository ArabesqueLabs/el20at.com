text = "الحكم كان ممكن ينزل من اعدام الى 3 سنين سجن<br />في جرايم القتل فيه حاجه اسمها اولياء الدم<br />لو ولي الدم اتنازل عن حقه في القضية الحكم ينزل من اعدام الى 3 سنين فقط وحصلت وشفتها هنا في الامارات<br />المفروض اول حاجه في القضية اول خطوه هو تعويش اولياء الدم والحصول على تنازلات عن حقهم الشخصي في القضية<br />وطالما واحد دفع 2 مليون علشان خاطر يقتل كان ممكن يدفع لكل واحد من اولياء الدم مليون وحصل علىتنازلات<br />وهذا هو السر في القضية ليه محامين طلعت مصطفى ما مشيوش في السكه دي"
