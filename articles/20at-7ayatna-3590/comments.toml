subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-04-14"
text = "الاخ مسلم كان بيدى نقده علي الصورة لانها فتاة مش مغطية شعرها مخدش بالو انها عامله كمان انها متنمصة وحجات تانيه. هى مطلبتش منك تقول رأيك عالصورة ومكنش دا موضوع التوبيك وانت حقك تغض البصر عنها بس دا خواطر وكان كويس انك تقول الكومنت بتاعك بس من غير تطويل في النقض<br />وعموما اعتقد ان دى خواطر حبت تكتبها مش حاله حقيقية هى عايشاها<br />وان كان الانسان بيحلم بس الواقع بيخليه غصب عنو ينتبه ليه<br />انا عن نفسي واقعي اكتر اه بحلم بس حلمى مبيبعدش عن الواقع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "يا عيني علينا"
author = "اكتب اسمك هنا"
posted = "2007-04-14"
text = "يا عيني علينا اما نيجي عند الهايفة ونتصدر سيبنا المضمون وبنركز دي سافرة ومتنمصة والله عيب عليكوا احنا بننقد خواطر يا جدعان وبنعلق عليها بتوقفوا الابداع وتقولوا اصلنا مسلمين والبت دي سافرة ، الا الكابتن مقراش موضوع \"مرة واحد شاذ\" الى كان منشور على عشرينات قريب ، هتقول اية عليهم ساعتها \"قوم لوط\" ، وسع افقك يا اخ هو جايبلك واحدة لابسة قميص نوم وبتقولك مين دة الى ما يعرف دودو؟؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "وتحسبونه هينا..."
author = "مسلم"
posted = "2007-04-14"
text = "اللي بينتقد ملاحظة \"مسلم\"...<br />انت نفسك بتعترف ان صورة المرأة بقميص النوم عيب...<br />تفتكر هو عيب ليه؟ لانها كشفت عورتها؟ طيب هو عورة المرأة ايه؟ كلها ما عدا وجهها وكفيها؟؟ تفكر!<br />ولو موضوع عورة النساء والسفور والحجاب موضوع هين أو هايف...مكنش نزل في القرآن والسنة...ولا ايه؟!<br />والملاحظة على الصورة هي نصيحة عامة...<br />كما أن التعليق على الصورة المصاحبة لاي مقال هو أمر معتاد على هذا الموقع من عدة معلقين...<br />ولا لازم يكون التعليق بالاعجاب بالصورة فقط؟؟!!"
archived = "2010-03-14"
capture_url = ""

