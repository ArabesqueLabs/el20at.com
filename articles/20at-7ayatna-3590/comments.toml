text = "بجد كلمات جميله جدا واقعيه اقرب منها خياليه لان كلنا فعلا راسمين صور لاحلام كتير جوانا من ضمنها النص الاخر وسواء طلع حقيقه او لا او حتىاستضمنا بواقع مختلف فكفايه اننا قدرنا نحلم لان حجات كتير فى حياتنا كانت احلام واصبحت حقيقه واكيد طول ما لسى قادرين نحلم يبقى اكيد احنا لسه عايشين<br />ودا وموضع موجود جوا كتير منا سواء اتكمنا عنوا او لا الحقيقه الوحيده انو فعلا موجود<br />حلو يادليا وفى انتظار المزيد من الخواطر والاحاسيس الصادقه"
