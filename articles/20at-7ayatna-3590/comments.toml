subject = "خطورة \"أفلام\" أحلام اليقظة!!"
author = "مسلم"
posted = "2007-04-14"
text = "أشعرتني هذه المقالة بخطورة \"إدمان أحلام اليقظة\"...فكتبت هذه الكلمات....!<br />ندخل أفلام أحلام اليقظة لنبقى فيها الدقائق وربما الساعات الطوال...<br />ثم نخرج منها أصفارًا...!<br />بل...<br />بقيم سلبية...<br />على مستوى الحالة الصحية: صداع في الرأس، وتنميل في الاطراف!<br />على مستوى الحالة النفسية: اكتئاب ذهولي وتبلد ضموري!!!، وهروووووب من الواقع -خاصة فترة المذاكرة والامتحانات!- لنقع أكثر!<br />على مستوى الحالة القلبية: يكثر تعلقنا بعشق \"الصور\"، ونزداد غفلة عن ذكر الله، وبعدًا عن منهجه!<br />على مستوى الحالة الاجتماعية: يزداد انطواءنا عن الآخرين، وربما تعلق البعض بالصور الملائكية الخيالية التي يرسمها لمستقبله -خاصة مستقبله مع الجنس الآخر- ليصدم بأن الواقع لا يمت لخياله بصله!"
