text = "هو ماتش الاهلي امته؟؟؟؟هههههههههههههه,,,,الموضوع شيق جدا و الاختلاف في الراي لا يمنع ان خواطر داليا تستحق الاشاده,,و بالنسبه للصوره كان نفسي اشتم فيها و ابدي امتعاضي الشديد منها بس انا محكمش على ربع صوره,,ياريت لو نشوفها كامله عشان نعرف ننقض بضمير.و اخيرا متنمصه مترفصه مش عارف ايه..فوقو بقى و بطلوا شعبطه في الهيافات..و على راي الشاعر....أغاية الدين ان تحفوا شواربكم يا امة ضحكة من جهلها الأمم؟؟!! شكرا داليا و شكرا لكل من ابدى رايه"
