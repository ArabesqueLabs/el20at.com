subject = "مدرسة \\"
author = "محمود"
posted = "2008-07-29"
text = "\\\"اجتمعت الجهود، وتضافرت الخبرات، وتوجَّهت النيَّات المخلصة -بإذن الله تعالى&--1648;- لتدشين موقع (الإمام العلامة) ليلة السابع والعشرين من رجب ، وهو يعد أول موقع على الإنترنت يُمثل مدرسة مميزة فريدة ذات فكر راقٍ، وعلمٍ منير غزيرٍ حيث يجمع أعمال علماء وآئمة مميزين؛ فهنا ستجدون أعمال كاملة لفضيلة الإمام العلامة \\\"علي جمعة\\\" مفتي الجمهورية ورمز من رموز الأمة ودرة تاج علمائها؛ خطب، ومحاضرات ، ودروس ، وفتاوي وأخبار ، وهي متاحة إما صوتية أو مرئية، إضافة لحلقاته التلفزيونية. .<br />كما تحتوي مدرسة \\\"الإمام العلامة\\\" على أعمال الشيوخ ، محمد إبراهيم عبد الباعث، د/ يسري جبر، جمال فاروق، د/ أسامة السيد، د/ محمد حسن عثمان، أشرف مكاوي، محمد وسام.<br />وعنوان الموقع:<br />www.alimamalallama.com"
