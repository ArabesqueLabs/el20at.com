posted = "2010-02-22"
text = "هى القصيدة القيت على عتبة مسجد السيدة زينب والا الحسين - حيث يقف الشحاتين<br />ربنا معاك<br />معاك فكة ورقة ب 100 جنية وتاخد منها جنية للة"
archived = "2011-07-05"
capture_url = "https://web.archive.org/web/20110705135953/http://www.20at.com/masr/profile/15419-2010-02-21-14-51-33.html"

[[comments]]
order = 3
subject = ""
author = "اوعى تقول غلبان"
posted = "2010-02-23"
text = "الغلبان اليومين دول بينضرب بالقديمة وبيدوروا على اى مصيبة تلبسة<br />الولد نجار المسلح الغلبان لبسوة قضية قتل بنت المغنية اياها<br />وغلبان تانى اهو من بولاق بيشتغل مش عارف اية ترزى لبسوة قضية تفجيرات<br />انت عارف المثل بين ضباط الشرطة اية او بيقول اية<br />المثل يا سيدى<br />ان قابلك مسكين حط راسة فى الطين<br />اما الحكومة المصرية ورجال الحزب الوطنى فشعارهم<br />لنا حق معلوم فى اموال السائل والمحروم<br />اما الست جمالات بياعة الفاكهة على ناصية حارتنا زوجة المعلم دنجل سواق التوك توك فتقول<br />البيت اللى مفيش فية ولد صايع يبقى حقة ضايع"
archived = "2011-07-05"
capture_url = "https://web.archive.org/web/20110705135953/http://www.20at.com/masr/profile/15419-2010-02-21-14-51-33.html"

