author = "دة اللى جبنا وراء"
posted = "2010-02-21"
text = "انا غلبان وانا مسكين ودى قسمتى ودة نصيبى<br />وعلشان كدة احنا من اتعب الشعوب والفقر بيمص فى دمنا<br />انا كدة وغيرى احسن منى لازم احاول ابقى زية بالعمل والاجتهاد<br />مفيش حاجة اسمها الرضا بالواقع المرير<br />اللة سوف يحاسب امثالنا حسابا رهيبا<br />فى الفران قصة المستضعفين وقولهم كنا مستضعفين فى الارض فرد عليهم الم تكن ارض اللة واسعة فتهاجروا اليها<br />انما حكاية المشى جنب الحيط ولا ابص للى فى ايد غيرى فهذة علامات جبن"
archived = "2011-07-05"
capture_url = "https://web.archive.org/web/20110705135953/http://www.20at.com/masr/profile/15419-2010-02-21-14-51-33.html"

[[comments]]
order = 1
subject = ""
author = "هو دة شعر"
posted = "2010-02-22"
text = "مين قال ان دى قصيدة وان الكلام دة شعر<br />دى كلام لا هو شعر حر ولا شعر موزون ولا يخضع لاى بحر من بحور الشعر<br />دى كلام ينفع يتقال على مصطبة<br />او واحدة بتشحت<br />او بياعة بتنادى على كرات وفجل<br />شوية كلام عامى على تعابير بلدية غير مترابطة المعانى ملخصها كلمتين وبس<br />عشانا عليك يا رب<br />يا عم بلاش الشعر دة ما تطلع بصندوق امشاط وفلايات وتوك شعر واستك منة فية فى اتوبيسات العتبة<br />ويجعلة عامر"
archived = "2011-07-05"
capture_url = "https://web.archive.org/web/20110705135953/http://www.20at.com/masr/profile/15419-2010-02-21-14-51-33.html"

[[comments]]
