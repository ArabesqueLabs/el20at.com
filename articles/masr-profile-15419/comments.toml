subject = ""
author = "خطبة الجمعة"
posted = "2010-02-27"
text = "كانت خطبة الجمعة امس فى جميع مساجد الجمهورية المباركية على وزن المملكة السعودية كانت الخطبة عن اشتغال العلماء بالعلم والمعامل وليس بالسياسة وذلك حسب تعليمات الزقزوق والامن واسهب الخطيب فى ان المولود فى القصر الجمهورى رضع السياسة من بز امة ويقصد بة جمال مبارك اما البرادعى فرجل علم وافاق ومكانة المعامل والمحاضرات والجامعة وانة لا يصلح للسياسة هكذا انتهى شيخ الجامع ودعى بالعمر المديد للسيد الرئيس ودعوت خلفة ومش عارف هيمدة تانى لغاية امتى<br />هو الحزب الوطنى مش قال لا دين فى السياسة ولا سياسة فى الدين ومنع على الاخوان شعار الاسلام هو الحل واللى بيعلق الشعار دة فى الانتخابات بيعتقلوة فورا - لية الحزب الوطنى بيستخدم الدين فى السياسة<br />على العموم بعد ما خرجنا من الجامع قعدنا نضحك على مولانا وعلى كلامة عن جمال والبرادعى<br />وفهمنا ان الحكومة خايفة قوى من البرادعى وبتستخدم المساجد للدعاية السياسية"
archived = "2010-03-14"
capture_url = ""

[[comments]]
