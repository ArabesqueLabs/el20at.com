posted = "2010-02-26"
text = "برادعي مين والناس نايمين<br />شوفو البرادعي في الصورة مع عمرو موسى قاعد مجعوص وحاطط رجل على رجل<br />دا ما ينفعش يبقى رئيس شعب مسكين زي مصر<br />اللي ينفعنا عمرو خالد<br />عينه على الارمبه والمسكين واليتيم والعاطل والعامل والمريض<br />هي دي الشخصية اللي تنفع حكم بلد المليون شحان ومليون ارمله ومليون عاطل ومليون مريض سرطان<br />ما ينفعش البرادعي بيه يحكم مصر<br />ما ينفعش سعادة الباشا يحكم مصر<br />اللي ينفع عمرو خالد بتاع الغلابه اللي زينا<br />سلام يا صاحبي وسلمولي على عبدالله الطحاوي<br />وعلى رأي شاديه ما نقلش ايه ادتنا مصر نقول حندي ايه لمصر"
