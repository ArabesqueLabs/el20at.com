text = "شعر عبد الرحمن يوسف -----<br />فى ليلة من حالك الليالى<br />صليت ثم نمت فى سباتى<br />فوجدت سبحة الرئيس فى يدى<br />فهمهمت بذكر اللة وامسكت بالحباتى<br />فوجدتنى اقول<br />لذاتى وذاتى وذاتى وذاتى<br />فانتبهت وهممت بورد اخر<br />فوجدتنى اكرر لذاتى وذاتى وذاتى وذاتى<br />فاستيقظت من النوم فزعا وانا اقول<br />اعوذ باللة من الشيطان الرجيم<br />كان كابوسا سيئا ما اقبحة<br />فالرئيس لا يملك اصلا مسبحة"
