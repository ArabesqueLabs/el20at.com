text = "انا غلبان وانا مسكين ودى قسمتى ودة نصيبى<br />وعلشان كدة احنا من اتعب الشعوب والفقر بيمص فى دمنا<br />انا كدة وغيرى احسن منى لازم احاول ابقى زية بالعمل والاجتهاد<br />مفيش حاجة اسمها الرضا بالواقع المرير<br />اللة سوف يحاسب امثالنا حسابا رهيبا<br />فى الفران قصة المستضعفين وقولهم كنا مستضعفين فى الارض فرد عليهم الم تكن ارض اللة واسعة فتهاجروا اليها<br />انما حكاية المشى جنب الحيط ولا ابص للى فى ايد غيرى فهذة علامات جبن"
