subject = ""
author = "ياسر انور"
posted = "2010-02-27"
text = "اخر اخبار ليلى العامرية<br />عادت قوافلهم<br />وليلى لم تعد<br />والهودج المشبوب يسكنة الارق<br />حدقت فى مقل النساء فلم اجد<br />خلف النقاب ملامحى<br />بين الحدق<br />وسألت عن ليلى<br />اجاب دليلهم<br />كانت هنا حتى بدايات النفق<br />من يومها الاسفلت ضج بخطوتى<br />حتى اكاد بكل درب انزلق<br />قالت تقارير المباحث<br />لم تمت ليلى اطمئن<br />وعندها زاد القلق<br />تليفونها المحمول بالصوت المبرمج مزعج جدا<br />يردد منغلق<br />علقت صورتها على كل جدران المدارس والنوادى والطرق<br />وعلى عواميد الشوارع<br />فى محطات القطار<br />وسائل النقل النزق<br />اذن المهم بحثت عن ليلى<br />اقبل ذا الجدار وذا الجدار كمن سبق<br />شخص يقول ويقسم انها كانت تخدم الغرباء فى احدى الشقق<br />ويضيف اخر قد راى ليلى هناك بسلم المترو<br />باكياس مناديل الورق<br />ليلى على الكورنيش يوميا<br />يدا بيد<br />ليلى تدخن فى المقاهى<br />والنراجيل استباحت ريقها لما شهق<br />ليلى ارتدت زى الحداثة فى مدرجها<br />وشىء من انوثتها سرق<br />منقول من جريدة بر مصر"
archived = "2010-03-14"
capture_url = ""

