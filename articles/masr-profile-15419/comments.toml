posted = "2010-02-23"
text = "انا بني ادم غلبان<br />الكلام دا تقولوا لما مباحث امن الدولة يقبضوا عليك ويجرجروك بالبيجامه على السلم للعربية والجيران يشوفوك وانت بتتبهدل ويجرجروك على القسم<br />تقولهم<br />انا بني ادم غلبان يا بيه<br />والنبي يا بيه انا ما استاهل دا كله"
archived = "2011-07-05"
capture_url = "https://web.archive.org/web/20110705135953/http://www.20at.com/masr/profile/15419-2010-02-21-14-51-33.html"
