[[comments]]
order = 0
subject = "اللى بينهبوها يحبوها"
author = "مش بحب احد"
posted = "2008-02-14"
text = "انا برة اللعبة - يعنى من اللى ملهمش حاجة فى البلد<br />لا عندى امل فى شقة ولا عروسة ولا وظيفة - يعنى بدون اى اهداف<br />يبقى ها احب اية<br />خللى بتوع الاعمال والبزنس والحديد والاسمنت يحبوها<br />مصر مش بتاعتى بتاع ناس تا نيين"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195802/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 1
subject = "بعد خراب مالطة"
author = "واحد"
posted = "2008-02-14"
text = "مجلس الوزراء تحول الى نادى رجال الاعمال<br />ومقر مزدوجى الجنسية اللى بينتسبوا الى بلدين بيحبوهم على قد الفايدة<br />انا با احب سوسو - - وسوسو بتحبنى<br />واركب العجلة -- وهى تزقنى"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195802/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 2
subject = "فوقوا بقه"
author = "الطير المسافر"
posted = "2008-02-14"
text = "الدانمارك تسب النبي صلي الله عليه و سلم<br />يا جماعه المقاطعه مش كفايه.لازم يكون لينا رد فعل شعبي قوي جدا عشان نضغط علي الحكومات الجبانه بتاعتنا و ياخدوا<br />موقف رسمي من اللي بيحصل ده.<br />والله فداك روحي و ابي وامي يا خير خلق الله يا محمد يا بن عبد الله<br />يا اشرف خلق الله."
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195802/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 3
subject = "بحبها"
author = "بيبو"
posted = "2008-02-14"
text = "بحبها وهتفضل في دمى حتى لو اغتصبها عيال حسنى وحتى لو 80 مليون فضلو ساكتين<br />هغيرها وهخليها احسن حاجة فى دنيتى<br />واللى مش عاجبه انى بحبها يشوف له بلد تانية يعيش فيها"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195802/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 4
subject = "بحبك يا مصر"
author = "yoyaaa"
posted = "2008-02-14"
text = "صباح الخير<br />بجد فكره جميله و ياريت كنت اقدر اشاركو التعبير عن حبي لمصر<br />بس انا عايشه في الاردن صح معشتش في مصر غير سنتين بس بجد كانو احلى سنتين في حياتي و ياريت يتعادو<br />انا اردنيه من ام مصريه عشقي لمصر مالوش حد و دايما عندي امل انها هتكون احسن من اللي هي عليه دلوقتي و خليكو دايما حطين في البكو ان مصر رغم كل المشاكل اللي فيها حلوه و اجمل الجميلات كفايه ان اهلها بشر بجد و الكلام ده مش مجرد مجامله دي حاجه انا عشتها و حسيتها<br />بحبط يا مصر"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195802/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 5
subject = "نستطيع ان نرد على اسائة الدنامركيين"
author = "رامز"
posted = "2008-02-14"
text = "نستطيع ان نرد اساءة الرسوم الكاريكاتيرية بقلة ادب ايضا<br />وحيث اننا نؤمن بان عيسى نبى ولا اساءة لة - فلة قدسيتة واحترامة كنبى اللة<br />يمكننا ان نرسم البابا وطيزة باينة وبيحط فيها طرف الصليب علشان يبرد ومن بقة كلام بيشتم فى الاسلام<br />السفالة سهلة خالص<br />ولكن لايجب ان نعير للكلاب اى انتباة<br />فيكفى ان عشرة الاف من المقاومة العراقية ازلت 23 دولة صليبية واكبر حامل للصليب الامريكى ومرغت اقتصادهم فى الوحل"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195802/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 6
subject = "ديكور الديمقراطية - بيقول اننا تحت حكم ارهابى"
author = "مصرى بيتابع الجرايد"
posted = "2008-02-16"
text = "الناس فى كل دول العالم بتنتخب اعضاء البرلمان علشان يحاسبوا الحكومة ويراقبوا الاداء بتاعها<br />تجرأ عضو فى مجلس او مصطبة الشعب وسأل وزير الداخلية عن الذمة المالية لرئيس الجمهورية<br />ببساطة شديدة جدا كان من الممكن ان يرد وزير الداخلية اقرار الذمة المالية موجود - وتنتهى الازمة او السؤال<br />ولكن الديكتاتورية البشعة ترد بطرد هذا العضو من المجلس وحرمانة من حضور الجلسات الى ما شاء اللة<br />ديمقراطية بيومى - بالمزاج - بالشبر<br />عايزين ناس زى نبيل لوقا بباوى يرفع يافطة فى المجلس مكتوب عليها<br />الاجنة فى بطون امهاتهم يبايعون حسنى مبارك<br />التعليق من جهتى - سبح احات وعشر شخرات"
archived = "2008-02-17"
capture_url = "https://web.archive.org/web/20080217205215/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 7
subject = "ميت فيها رغم بعدى عنها"
author = "hgeyoushi"
posted = "2008-02-16"
text = "سرقوها وإغتصبوها وحولوها لبنت ليل تبيع نفسها للحرامى والأفاق والعجوز المتصابى اللى بيصبغ شعره بلون سواد قلبه ونفسه يورثها بس أحب أقوله ياأخى أحه ( آسف بس مش لاقى حاجه تناسب مقامه غير كده) هتفضل لينا حتى لو جثه وهنحبها بكل مرارتها العيب فينا مش فيها إحنا مش عارفين قيمتها والكلاب بعدونا عنها وكرهونا فى عيشتها أقول إيه هههههههههههههههانت"
archived = "2008-02-17"
capture_url = "https://web.archive.org/web/20080217205215/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 8
subject = "egyptian mish egypyine ya prince"
author = "كريمبو"
posted = "2008-02-17"
text = "بما انك ياصاحبي كاتب العنوان اساسا غلط اذا الفحوي اكيد هتكون غلط في غلط<br />ونصيحه من اخ لاخ<br />اهم شروط النجاح والانتشار انك تكون صادق مع نفسك قبل ماتكون صادق مع غيرك<br />من الاخر ياصاحبي ماتدحكش علي نفسك وانزل للواقع<br />وان كان علي حب مصر فأكيد كلنا بنحب مصر ودي مش محتاجه كلام ومفيش اي حد مابيحبش مصر<br />كلنا بنحبها<br />لكن بنكره حاجات تانيه ممكن تكون في مصر حوالين مصر بره مصر جوه مصر او بشل او التاني متعلقه بمصر دي الحاجات اللي بنحبها او بنكرهها لكن مصر فهي فعلا امنا كلنا ولازم كلنا نحبها<br />بس ياصاحبي"
archived = "2008-02-17"
capture_url = "https://web.archive.org/web/20080217205215/http://masr.20at.com:80/newArticle.php?sid=14199"

[[comments]]
order = 9
subject = "انتباه من فضلكم"
author = "كريمبو"
posted = "2008-02-17"
text = "بعد اذنكم ياجماعه ممكن اعرف ايه غاية ان كل حد كاتب في اسمه اسم مبهم يعني اسماء مش اسماءه<br />يعني المفروض ان خانة الاسم دي يتكتب فيها اسم صاحب الموضوع مثلا ( احمد محمد محمود ) مثلا<br />ليه بقا احنا وصلنا لدرجة اننا مش قادرين اننا نبوح بأسمنا حتي ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />الي لقاء قريب اخواني واخواتي"
archived = "2008-02-17"
capture_url = "https://web.archive.org/web/20080217205215/http://masr.20at.com:80/newArticle.php?sid=14199"
