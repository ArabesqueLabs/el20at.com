subject = "وزير الكهرباء خربها ومبارك نايم في شرم  الشيخ ؟؟"
author = "مهندس في تكية وخرابة حسن يونس"
posted = "2009-03-26"
text = "وزير الكهرباء ومبارك نايم في شرم الشيخ ؟؟<br />يبدوا أن النهج العتيق والمتقادم المتبع ومنذ عهد قدماء المصريين وحتي تاريخ مصر المعاصر من بعض وزراء مصر لضمان استمرارهم علي كرسي الوزارة هو أتباع نظرية السوبرمان في إظهار عبقريتهم الفذة المفتقدة والمفقودة في انجازات تظهرهم بعيون الرئيس في أنهم قد غيروا وجه المعمورة ووضعوا مصر في طلائع الأمم مع أن واقع الحال المر علي أرض التنفيذ الفعلي يوحي حتي للجاهل دون ذلك ومن ضمن هؤلاء الوزراء وزير الكهرباء المصري والذي يتضح مدي ولعه الشديد في أن تظهر صورته اليومية بالصحف وفي مقالات مدفوعة الأجر بخلاف طلاته التي زهقنا منها من خلال الفضائيات ليتحدث عن انجازات لو تحقق نصفها لوضعت مصر في أوائل الأمم المصدرة للطاقة ولأصبحت عاصمة أخري للنور مثل فرنسا ؟ ولعل المثير للسخرية هو آخر ماطالعتنا به صحيفة الأهرام الحكومية بعددها الصادر الخميس 19/3/2009 وبالصفحة السابعة بخبر مفاده حصول وزارة الكهرباء علي قرض ياباني بقيمة 9.5 مليار ين ياباني لإقامة محطة الكريمات للطاقة الشمسية بطاقة 150 ميجا وحصول ذات الوزارةعلي قرض تمويلي من البنك الدولي بقيمة مليار وخمسون مليوناً من الدولارات لإقلمة محطة كهرباء بالعين السخنة وناهيك عن تعاظم قيم القروض التي يحصل عليها القطاع المذكور لإقامة مشروعاته المزعومة والتي تمثل في النهاية أعباء وديون لا يدفعها ولا يتحملها إلا المواطن العادي في ظل فاتورة كهرباء شهرية مغالي فيها وأصبحت جميع الأسر والبيوت المصرية تأن وتصرخ منها دون جدوي والعجيب هو تصريح نفس الوزير وبنفس الصفحة في قوله أن سياسة وزارته تعتمد علي تنوع مصادر الطاقة للحد من الأعتماد علي الطاقة البترولية للحفاظ علي الأحتياطي البترولي لصالح الأقتصاد الوطني وهو ما يخالف به نفس تصريحاته بنفس الجريدة أن سياسات وزارة البترول تعد السبب الرئيسي الكامن وراء الخسائر المتتالية التي أصابت شركات توزيع الكهرباء بسبب تصدير الأخيرة للغاز الطبيعي إلي الأردن والذي بدوره استعني عن كميات وتكلفة الطاقة الكهربية المنقولة له خلال شبكة الربط وذلك لأنخفاض سعر الغاز الطبيعي والذي أعتمدته المملكة الأردنية لتشغيل مولدات محطاتها واستغنت به عن الطاقة المنقولة عبر الشبكة الأمر الذي سبب خسائر كبيرة لقطاع الكهرباء وشركات التوزيع بحد تصريحات نفس الوزير وعلق مسببات تلك الخسائر الجسيمة علي شماعة وزير البترول؟ ناهيك علي أن الوزير تناسي أن خسائر قطاع الكهرباء في عهده قد تجاوزت 12 مليار جنيه بحسب آخر تقارير رقابية وإحصائية فضلاً علي مشاريع فاشلة أطاحت بالمليارت من الجنيهات أدراج الرياح وتفشي ظاهرة الفساد وإهدار المال العام في هيئاته وشركاتة التابعة ففي أحدث تقرير للجهاز المركزي للمحاسبات 2008 جاء فيه في هيئة تنمية واستخدام الطاقة الجديدة والمتجددة هناك 590 مليون جنيه غير مستغلة و90 قرش خسارة عن كل جنيه بينما في هيئة المحطات النووية لتوليد الكهرباء تحدث التقرير عن مبلغ 60 مليون جنيه لمشروعات متوقفة و17 مليون جنيه عجز جاري و705 مليون جنيه فوائد لقروض محلية ومصروفات إدارية وعمومية وأشار إلي أنه في هيئة كهرباء الريف 1.2 مليار جنيه رصيد دائنين والهيئة تستعمل الأيرادات للصرف علي المكافآت وهناك 119 مليون جنيه سحب علي المكشوف ورصيد القروض 8.5 مليار جنيه وتطرق التقرير إلي وجود مخالفات مالية وفساد وإهدار للمال العام ناهز 500 مليون جنيه في هيئة المحطات المائية لتوليد الكهرباء وقيدت تلك المخالفات ووقائع الفساد تحت قضية برقم 22 لسنة 2007 ومنظورة أمام المحكمة التأديبية العليا وفيها تم تحويل 52 وكيل وزارة من الكهرباء والمالية والتخطيط إلي المحاكمة التأديبية ولقد ضمنت وقائع أعمال الفساد بتلك المهزلة إهدار 110 مليون جنيه علي مشروع محطة اللآهون الفاشل بطاقة لا تكمل حتي الواحد ميجا وات فضلاً علي إهدار 52 مليون جنيه علي مشروع منخفض القطارة وعلي الرغم من وجود أعمال بترولية بأرض المشروع حتي عام 2019 ؟ وأيضاً إهدار مبلغ 46 مليون جنيه أخري علي مايسمي بمشروع الضخ والتخزين بالعين السخنة ؟ كما جاءت إهدارات تلك الوزارة المتالية حين تقدم بهاء عطية (عضو الكتلة البرلمانية للإخوان المسلمين) بطلب إحاطةٍ إلى رئيس الوزراء ووزير الري والموارد المائية السابق حول وجود تخريب متعمد بمشروع تطوير مولدات كهرباء السد العالي، خاصةً المولدين 3و4 اللذين ظهرت بهما عيوب خطيرة أثناء تركيبهما وأوضح عطية أن مصدرًا مسئولاً بشركة المحطات المائية لإنتاج الكهرباء بأسوان صرح أن هناك تخريبًا متعمدًا لمولدات السد العالي من قبل الأجانب تمت تحت علم مسئولي الشركة المصريين!!! مدللاً على ذلك بتوريد شركة الكتروسيلا الروسية مولدات تحتوي على عيوب فنية لتركيبها في مشروع تطوير مولدات السد العالي ولم يتم اكتشاف تلك العيوب إلا بعد الانتهاء من تركيب العضو الثابت للمولد الرئيسي للوحدتين 3و4- وتجدر الإشارة إلى أن جريدة الوفد قد نشرت في عدد الخميس 25/12/2008 خبرًا يفيد حصولها على&--8238; &--8236;تقارير ومستندات وصور خطيرة تكشف عن فضيحة فساد وإهمال في&--8238; &--8236;السد العالي،&--8238; و&--8236;تبين وجود مشكلة اهتزازات بالسد العالي&--8238; &--8236;تصل إلى&--8236;3&--8237;.&--8236;5&--8238; &--8236; بمقياس ريختر للزلازل؛ بسبب عمليات تطوير لأجهزة التحكم قامت بها شركة ألستوم العالمية &--8236;،&--8238; &--8236;كما قامت بتغيير الأرياش الروسية،&--8238; &--8236;وتدميرها حتى&--8238; &--8236;لا&--8238; &--8236;يعاد تركيبها مرة أخرى&--8238; &--8236;وتركيب رياشات بديلة&--8238; &--8236;غير مطابقة للمواصفات،&--8238; &--8236;مما استدعى&--8238; &--8236;سد جزء&--8238; &--8236;يصل إلى&--8238; &--8236;90&--8238; &--8236;سم من فتحات السد بالأسمنت والخرسانة المسلحة، مما أثر على&--8238; &--8236;أداء المولدات وحدوث اهتزازات وتشويه التصميم الأصلي&--8238; &--8236;للسد المصنف من الهيئات الدولية بأنه أعظم مشروع هندسي&--8238; &--8236;شُيد في&--8238; &--8236;القرن العشرين&--8238; - وأوضحت الجريدة أن تلك الاهتزازات قد تسببت بحدوث بعض الشروخ،&--8238; &--8236;والتي&--8238; &--8236;تتابعها إدارة الري&--8238; &--8236;منذ&--8238; &--8236;3&--8238; &--8236;سنوات على&--8238; &--8236;فترات متباعدة دون عمل أي&--8238; &--8236;علاج لها&--8238;، &--8236;كما حدث رشح خطير في&--8238; &--8236;الفواصل الإنشائية بين الوحدتين&--8238; &--8236;3&--8238; &--8236;و4&--8238; &--8236;بمحطة أسوان، &--8236;وتفاقمت المشكلة بداية العام الحالي&--8238; &--8236;وتم الاستعانة بمكتب تصميمات واستشارات هندسية بالأمر المباشر لعمل مقايسة لأسلوب معالجتها- كما تبين وجود مشاكل جسيمة في مشروع تطوير المولدات الذي&--8238; &--8236;يجري&--8238; &--8236;حاليًا، &--8236;مما اضطر وزارة الكهرباء لتأجيله،&--8238; &--8236;تبين أن المولدات الجديدة التي&--8238; &--8236;تكلفت&--8238; &--8236;600&--8238; &--8236;مليون جنيه إهدرت وطارت في الهواء وأنها تسخن عند التشغيل وتتوقف عن العمل بسبب السخونة نتيجة أنها من النحاس المفرغ&--8238; &--8236;عكس المولدات القديمة التي&--8238; &--8236;كانت من النحاس المصمت، مما&--8238; &--8236;يتطلب تعديل المولدات أو تعديل نظام التبريد&--8238; - كما جاءت فضيحة أخري حديثة فى كهرباء كفر الشيخ تحمل الشعب المطحون فيها 120 مليون جنيه نقلاً عن جريدة العربى الناصرى العدد 1129 فى19/10/2008 حيث بعد أقل من 6 أشهر من الانتهاء من إنشاء خط ربط كهرباء سيدى سالم كفر الشيخ المحمودية انهارت الابراج الرئيسية بارتفاع 65 متر للبرج فى خط الربط ومع أول هطول للمطر لتصل خسائر قطاع الكهرباء الى مايقرب من 120 مليون جنيه حسب تأكيدات الخبراء .. بخلاف خروج ثلث محطات رئيسية بقدرات 220 كيلو فولت من الخدمة هى محطات سيدى سالم وكفر الشيخ والمحمودية ليترتب عليها فصل وخروج أكبر 8 محطات فرعية بقدرات 66 كيلو فولت وهى مطوبس والمندورة والمثلث وغرب البرلس والمحمودية وفوة والحامول وأبو غنيمة و قلين فيما تم تقليل الأحمال عن بعض المحافظات لسد العجز فى محافظة كفر الشيخ وأطراف محافظة البحيرة ؟ بالإضافة الى فقدان الاتصال بين محطة سيدى سالم 220 الرئيسية وبين باقى المحطات من جانب وبينها ومركز التحكم الرئيسى بالقاهرة أو حتى مركز التحكم الفرعى بالمنصورة؟ وكما كشف تقرير حديث للجهاز المركزى للمحاسبات عن نتائج الرقابة المالية لقطاع الكهرباء والطاقة عن السنة المالية 2007 أن إجمالى قيمة المبالغ المنفقة على دراسات مشروع إنشاء المحطات النووية بالضبعة بمحافظة مرسى مطروح بلغ 881 مليون جنيه خلال العام الماضى، وأشار التقرير إلى أن تلك الدراسات لم تستطع تحديد المكان المناسب للمشروع حتى الآن أو الجدوى الاقتصادية له ومدى الاستفادة من المبالغ التى أنفقتها الدولة على المشروع مما اضطر هيئة المحطات النووية إلى الاستعانة مرة أخرى بالشركة الفرنسية التى قامت بدراسة الموقع لتحديث الدراسة، ونتج عن ذلك عجز فى ميزانية الهيئة بلغ حتى الآن 17.85 مليون جنيه عن العام المالى 2007، مقابل 11.705 مليون جنيه لعام 2008 بزيادة 5.353 مليون بنسبة 45.7 % ليصبح إجمالى العجز المرحل نحو 28.763 مليون جنيه ومن جهته تقدم محمد العمدة، عضو مجلس الشعب عن دائرة أسوان، بطلب إلى مجلس الشعب لتحويل جملة المخالفات المالية المرتكبة داخل قطاع الكهرباء إلى النيابة العامة، مستندا فى ذلك إلى كونها مخالفات جسيمة وأكد فى حيثيات طلبه أن ما حدث فى الضبعة يعد بشكل صريح إهدارا للمال العام وصل إلى 881 مليون جنيه فى عام واحد على دراسات لم يتضح منها حتى الآن الجدوى الاقتصادية للمشروع أو تحديد مكانه.<br />وبالأضافة إلي صدق جميع مانشر حيث أنها جميعها موثقة المراجع وبالأرقام وبالأحداث إلا أنني أريد أن أضيف للسيد رئيس الجمهورية وللسيد وزير الكهرباء خبــراً ( طازجاً ) يؤيد أن الفساد قد حل وساد وأن السرقات أصبحت علي المكشوف وبلا حياء ولا كسوف وهو أن هيئة المحطات المائية لتوليد الكهرباء قد أقامت مشروعاً فاشلاً بكل المقاييس وهو محطة اللآهــون المائية لتوليد الكهرباء بالفيوم والتي تقف دليلاً دامغاً وشاهداً للفساد في مكانها بالفيوم لمن يريد التأمل والتبصر ؟ وجاءت المحطة بقدرة 800 ك/ وات ساعة وتكلفت 110 مليون جنيه بأسعار الثمانينات ؟ أي أن قدرة المحطة لم تكمل الواحد ميجا مما يعني انعدام جدواها الأقتصادية ثم طالعتنا اليوم جريدةالأهرام ص / 8 والصادرة اليوم الخميس 26/3/2009 بخبر مفاده أن سيادة الوزير ( المفسد والنايم ) قد أفتتح اليوم محطة كهرباء سيدي سالم بقدرة 250 ميجا ؟ وبتكلفة 96 مليون جنيه فقط ؟؟ وسأترك للقاريء العادي المقارنة بين التكلفة والقدرة في كلا المحطتين ليكتشف بكل سهولة حجم وكيفية ومدي الفساد الذي يتم والريس مبارك وللأسف( نايم في الطراوة في شرم الشيخ ؟؟) بينما وزيره يسعي في الأرض فساداً وإفساداً ودون أي رقيب أو حسيب علي المال العام المباح والمستباح ؟<br />وهكذا تتوالي مسلسلات الهزل والفشل والمخادعة الكاذبة للضحك علي ذقون الرؤساء والشعوب المغلوبة علي أمرها لتتحدث عن نجاحات هزلية لو تم نصفها فقط لأصبحت مصر عاصمة النور والطاقة ولتضاهي بل وتزيد عن باريس ؟ ولعل السؤال الذي يفرض ويطرح نفسه الآن هل من الممكن أن يصدق الرئيس مبارك هذا الهراء ولدية أرقام وتقارير موثقة ومفزعة وصادرة عن أجهزته الرقابية الرسمية المعتمدة والتي تترجم حقيقة الواقع المر والفشل الذريع وهو بالطبع عكس مايصرح به البعض من أشاوسته من وزراؤه والذين لا يتجملون فقط ولكن يكذبون أيضاً – وليبقي السؤال الأذلي ولصالح من ؟"
