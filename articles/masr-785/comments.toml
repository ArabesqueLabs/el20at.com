subject = "مازلنا ننتظر رد من السيد وزير عدل مصر"
author = "محمد غيث"
posted = "2008-11-06"
text = "بسم الله الرحمن الرحيم<br />لماذا لم تحولوا الجناة وناهبوا المال العام للنيابة العامة<br />المختصة وهو أضعف الإيمان ؟ ولصالح من ما يحدث ؟<br />معالي السيد المستشار / وزير عدل مصر الموقر .<br />السلام عليكم ورحمة الله وبركاته وبعد.<br />نتشرف بأن نرسل لمعاليكم بهذا الفاكس الذي يعد في جوهره بلاغاً وتظلماً رسمياً من جانبنا قبل أن يكون علامة أستفهام كبري نعرضها علي معاليكم ليس بصفتكم الموقرة والجليلة كوزيراً للعدل في دولتنا الطيبة فقط ولكن أيضاً كون معاليكم شيخ شيوخ قضاة مصر المحروسة وأستاذها الجليل في علم القانون والمعني المجردوالمقدس للعدالة التي أختص الله عزوجل ذاته القدسية بها وبالطبع نحن كمثقفين نعلم أن العدل في جوهره وموضوعه ومعناه الجليل ( لا يتجزأ ) بمعني أنه ( لايقبل ويمقت تعبير الكيل بمكيالين ) فهو يطبق ويسري في أحكامه وردعه علي كافة الجناة حالة تطابق الذنب أو الجريمة – وهنا ونحن نطالع صحف هذا الأسبوع قرأنا كيف أن مساعد شرطة (صول) أنتحر لأنه قبض عليه متلبساً بأخذ رشوة من مواطن قيمتها 5 خمسة جنيهات فقط ؟ فأبي المذنب المسكين إلا أن يقتل نفسه خلاصاً عن ذنب بذنب أقسي؟ وأما الحالة الثانية فهي خبر يقول تجديد الحبس لمدة 21 يوم لأمين شرطة متهم بقبول رشوة من مواطن آخر مع تقديمه محبوساً للمحاكمة – حسناً – ولعل هذان الخبران جعلنا في حيرة وإرباك نفسي شديد ونحن المبلغين والشاكيين الأصليين في القضية رقم 22 لسنة 2007 نيابة إدارية وعلي الرغم من فداحة وكارثية المبالغ التي أهدرت وبددت وتربح فيها الجناة من وظائفهم والتي وصلت إلي ما يقارب 449 مليون جنيه بحسب مقالة جريدة صوت الأمة الصادرة بتاريخ 21/1/2008 بعددها رقم 371 وعلي لسان الدكتور المستشار / إبراهيم عبد الله والتي أحيلت من بعده ( حيث تم نقله واستبعاده من التحقيق بالقضية؟) فأحيلت إلي السيد المستشار /محمود قناوي وحيث أننا قمنا بأبلاغ النيابة الإدارية رسمياً في 10/7/2006 ليصدر قرار الإحالة عن السيد المسستشار الأخير خلال 9/2008 المنصرم أي بعد أكثر من سنتين ؟! والغريب والمستفز والمربك يامعالي وزيرنا الأجل والأكرم هو ماجاء بقرار الإحالة الصادر عن السيد المستشار / محمود قناوي والذي أكد فيه سيادته للصحف القومية وغيرها وجميعها صادرة بتاريخ 17/9/2008 ( الأهرام – الجمهورية – المصري اليوم- الأحرار ) أكد سيادته وفقاً للمنشور علي لسانه فيها - حصول المسئولين بهيئة المحطات المائية لتوليد الكهرباء علي 12 مكافآة غير مشروعة بلغت قيمتها 125 مليون جنيه ؟ وأن بعض العاملين بالهيئة حصل لنفسه علي علي مكافآت غير مشروعة في سنة واحدة بلغت 261 ألف جنيه ؟ وأن 10 موظفين آخرين صرفوا لأنفسهم ( وبأسماء أشخاص وهميين ؟ ) مبلغ 25000 جنيه وأن القيادات أنشأوا لأنفسهم وحدة محاسبية خاصة بهم لصرف المكافآت بعيداً عن أعين الرقابة وأستأثروا بها أنفسهم دون بقية صغار موظفي الهيئة ؟ وأن النيابة حفظت مانسب لمجهول ؟ ثم يختتم قرار الإحالة بأنه ومع كل هذه الكوارث ؟ فأن النيابة الإدارية قررت صرف النظر عن إبلاغ النيابة العامة في حق المتربحين والجناة ؟؟<br />وهنا نعود مع معاليكم لمقارنة أفعال هؤلاء المتربحين الجناة مع هذا الصول المسكين الذي أبي إلا أن يقتل نفسه وينتحر خجلاً لأنه ضبط متلبساً بتقاضي رشوة 5 جنيه ؟ ومعه حالة أمين الشرطة الذي سيقدم للمحاكمة محبوساً بتهمة تقاضي رشوة بمبلغ 500 جنيه من مواطن ؟ أي سيهدم مستقبله وحياته وسيرته علي وجه العموم – ولكن – هل جرم الجناة والمتربحون من وظائفهم وبمئات أوعشرات الملايين والألوف كما أسرد السيد المستشار قناوي بالحرام من المال العام المحرم حلال ؟ وأليس جرمهم وذنبهم أشد وطأة علي المجتمع من وطأة هذان المذكوران<br />ياسيدي الموقر لعل الصول وأمين الشرطة قد تقاضيا الرشوة من مواطن فاسد أي من ماله وجيبه الخاص بينما الجناة والمتربحون ولصوص المال العام بالمحطات المائية قد نهبوه من المال العام أي من مال شعب ودولة وحكومة ورئيس ؟ فهل بعد ذلك تصرف النيابة الإدارية النظر عن تحويلهم للنيابة العامة ؟<br />سؤال بسيط أربك نفوسنا وأرق مضاجعنا وأثقل ضمائرنا نطرحه علي عدالتكم السامية باعتباركم يد الله في أرضه لتطبيق العدالة الكاملة ( متي أمكن ) ونحن يامعالي الوالد الوزير العادل نعلم أن واجب طاعتكم هي فرض عين علينا وعلي كل مسلم علي أرض مصر لأنها فرض عين بالطاعة بعد إطاعة الله ورسوله إلا أنه كان لزاماً علينا ونحن العارفون أن هيئة النيابة الإدارية تخضع لسلطات معاليكم فأننا نري والأمر الأخير لمعاليكم أن قرار الإحالة وفقاً لما نشر بالجرائد المذكورة علي لسان السيد المستشار / محمود قناوي جاء معيباً ومنقوصاً ويحمي الجناة ويفلتهم من يد النيابة العامة للأقتصاص والقصاص ولأسباب غامضة نجهلها ولا يعلمها إلا الله وحده وسيادته ؟ ونري أن العدل البين أو أقله يامعالي الوزير العادل هو في حتمية تحويل الجناة الأصليين للنيابة العامة المختصة وهم الذين نهبوا وتربحوا من مال الدولة العام المحرم والمجرم وبتلك المبالغ الرهيبة التي ذكرها سيادة المستشار قناوي للصحافة وعلي الأقل لكي نقول أنهم أسوة في العدالة وأمام القانون بحال هذان المواطنان الغلابة والمذنبون والذين تم الأقتصاص منهم لجرم ربما نقول أنه بسيط إذا ماقورن بما صدر عن أمثالهم بل أنه وبكافة المقاييس ( العدلية ) لا يصل ولا يربو قياساً إلي ضخامة وفظاعة وجسامة جرم الجناة المتربحون بهيئة المحطات المائية لتوليد الكهرباء .<br />اللهم هل أبلغنا – اللهم فاشهد .<br />وتفضلوا معاليكم بقبول وافر الاحترام .<br />مدير عام / محمد شريف فاروق . ت : 0103854743/ 23698963<br />مدير عام /محمد غيث محمود . ت : 0101989788/23162833<br />هيئة تنفيذمشروعات المحطات المائية لتوليد الكهرباء<br />7/10/2008"
