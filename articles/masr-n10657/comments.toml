[[comments]]
order = 0
subject = "ومال ام اسرائيل"
author = "واحد مصرى"
text = "ومال ام اسرائيل ومال المدونين<br />لو ركبت قطار الصعيد ومشيت بة عشر ساعات جنوبا ثم نزلت منة وركبت سيارة بيك اب ومشيت ىساعتين شرق الى ان يقابلك النيل ونزلت وركبت المركب اللى اسمة المعدية ثم بعد عبور النيل ركبت حمار اتجة بك الى احد القرى الصغيرة<br />وفى القرية ادخل مدرسة القرية<br />هتلاقى عيال وجهها شاحب من الفقر وعندهم انيميا مزمنة وماسكين الكراريس<br />وبيقرأوا فى سورة قل هو اللة احد<br />اسأل اى طفل فيهم<br />من هم اعداء مصر ؟<br />هيقولوا كلهم فى نفس واحد<br />اسرائيل وامريكا<br />اللى فى القلب فى القلب<br />والغد الوطنى المصرى قادم للثأر"
archived = "2007-06-20"
capture_url = "https://web.archive.org/web/20070620071406/http://masr.20at.com:80/newArticle.php?sid=10657"

[[comments]]
order = 1
subject = "ده اللي بيحصل"
author = "Masri"
text = "يا عزيزي، هو ده اللي بيحصل، اسرائيل ما بتسكتش وما بتسيبش الموضوع يعدي كده، فهي ترصد كل شيء عننا، لانها لسه بتقول ان العدو الاكبر لها هو مصر، وانت بتسأل اسرائيل مالها؟ وهم العدو؟ طيب عندك اهو الموضوع بيقولوا لك ان سيد رجب افندي الشيوعي ما عندوش مشاكل، وبقى اصحاب هو والصحفي الاسرائيلي، ومش بعيد يبقى بعد كده يبلغهم باللي عنده مباشرة من غير مدونة ولا بتاع!.. استرها يارب"
archived = "2007-06-20"
capture_url = "https://web.archive.org/web/20070620071406/http://masr.20at.com:80/newArticle.php?sid=10657"

