[[comments]]
order = 5
subject = "مصر خربانه"
author = "مش فاكر"
text = "اولا احب اهدي تحياتي للي خربين مصر الي هما الحزب الوطني والاخوان وبقول لهم ربنا يخليكم علشان تخربم مصر اكتر ما هي خربانه اليهود ليهم حق يعيشوا علي الارض زينا زيهم لانهم من بني ادم وهما مش قتله هما بيحاربوا علشان يعيشوا"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821043344/http://masr.20at.com:80/newArticle.php?sid=10657"

