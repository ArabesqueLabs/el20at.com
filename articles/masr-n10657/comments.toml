[[comments]]
order = 3
subject = "انتوا لسة بتعلقوا"
author = "أرابيسك"
text = "انتوا لسة بتعلقوا<br />البلد دى خلاص انسوها رايحه فى 60 داهية و بايظه بايظه<br />و من الاخر كل واحد يلحق يشوفله بلد تانية عشان يعيش فيها<br />انسوا اى امل فى التغيير دى حقيقة مش يأس"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821043344/http://masr.20at.com:80/newArticle.php?sid=10657"

