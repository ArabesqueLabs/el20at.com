[[comments]]
order = 1
subject = "عنصرية"
author = "سعيد"
posted = "2008-02-17"
text = "للاسف كل من تجرأ وكتب وخط لا يكاد يقرأ ما كتبه او يعلم ما يصف من كلام.. انا بكل حيادية انظر للثورة الايرانية كأي ثورة ضد اي حكم جائر ونحن العرب نكره من بنتصر علينا والامر اسوء ان وصل لفكر مخالف الينا فكل يوم يكتشف شيء جديد ويأتي لنا من يقول ابن فلان قبل 500 سنة اكتشفه! المشكلة ليست \"من\" ولكن ماذا حققت الثورة الايرانية والكل يعي ويعرف المحاولات المستميته من الحروب والحصار عبر ما يزيد عن 28 سنة لخنق ايران تمهيدآ لانهياراها من الداخل. مللنا من اسطوانة المهزومين من عنصرية وارهاب فكري واقصاء اراء الاخرين وحتى طمس الانتصارات كانتصار حزب الله في طرد المحتل الصهيوني من الجنوب المحتل الذي زاد حنق الكثير منهم فجعلهم منغلقين على انفسهم بقوقعة كنا وعملنا وصار يتغنوا بامجاد العرب وتاريخ ضاع ليس له وارث سوى ذكر مكتوب وعقل مغلوب."
archived = "2010-03-14"
