subject = "الى متى نحن هكذا"
author = "منصف محتيد"
posted = "2008-02-13"
text = "غريب امرنا نحن لانستطيع ان نحترم مع من نختلف, لانستطيع ان نقرء وننصف انفسنا يامة تنتسب الى الاسلام اسماً والبعد عنه فعلا<br />الامام الخميني رحمه الله كان يؤمن بافكاره وقام بتغير واقعة في بلادة<br />ونحن المساكين نلعن الحال ومن دون العمل<br />اتمى من اخواني ان يخرجوا من دائرة الانا وتفهم الاخرين حتى نكون خير سفراء لدين العظيم<br />والسلام عليكم جميعا"
