subject = "المصيبة كمان إن فيه ناس من جلدتنا"
author = "الدبوس"
posted = "2007-04-05"
text = "والله أنا مبسوط من الفكرة دي فكره ممتازه بس يا ريت تعملوا حمله كمان ضد كل واحد من جلدتنا زي إلي بيقولوا عليه دكتور خالد منتصر ده إتكلم كتير قوي عن الحجاب والاعجاز العلمي والحجامه وقال كلام لا يليق... أرى أنه لا يلق بنا كمسلمين نسيبه يبخ سمومه فينا ..."
