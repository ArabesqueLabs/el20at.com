author = "لعلهم يدعون اللة"
posted = "2009-06-24"
text = "لا احد يستيطيع الغاء الحاج لا جرانة ولا بدنجانة<br />السعودية فقط هى من يستطيع ان يلغى الحج - وهذا لن يتم - واى دولة هتلغى الحج هتعرض علاقتها مع السعودية للقطيعة وهذا ما لا يمكن ان يفعلة النظام<br />وانا ارى ان يذهبوا للحج لعلهم يدعون اللة فوق جبل عرفات ان يرفع عنا البلاء ويكشف عنا الغمة وان يعجل بهلاك الظالمين والذين اكلوا حق اليتيم وضيعوا المسكين<br />اللهم عجل بهلاكهم يارب العالمين"
