[[comments]]
order = 5
subject = "وكأننا عيشينا قرون بدائية"
author = "مواطنة  مفقوعة"
posted = "2008-05-28"
text = "بصراحة موضوع مهم وحيوى أيوه مشكلة الحمامات فى الأماكن العامة وأماكن العمل ديه فعلا عايزه نصايحك المتينة يا مريم<br />أيوه كده موضوع ضربة معلم بصحيح ، المشكلة فعلا فى اللى مش عامل حسابه .<br />وعايزين فعلا حملة شباب بريحة حلوة مش كفاية فى إعلانات مزيلات عرق وعلى الرغم من كده فى الحر وفى البرد بنشوف الهاوويل"
