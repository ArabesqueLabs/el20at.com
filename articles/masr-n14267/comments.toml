[[comments]]
order = 0
subject = "يبعد عنكو شر الزنقه"
author = "سيمفونيه سيفون"
text = "امين يا مريم دا الواحد بيقي ناعي هم الحمام دا بشده وشكرا علي النصايح الجميله دي<br />ونخلي معانا شنطه زي اللي بتقولي عليها دي عارفه بتفكرني بشنطه فليكس<br />كارتون لاطفال كان في الشنطه كل حاجه هو عايزها<br />علي العموم ربنا ما يحوجنا للزنقه ويسترها معانا"
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226143501/http://masr.20at.com:80/newArticle.php?sid=14267"

[[comments]]
order = 1
subject = "برافو يا شباب"
author = "إيمان"
text = "برافو عليكم يا شباب بجد موضوع هايل وبناء وريحته تجنن :)<br />أدخلوا بقا على ريحة العرق والرجلين والهدوم الي مش بتتغسل بالأسبوعين<br />وركزوا على مترو الأنفاق كمان وربنا يخليكم عايزين نعمل حملة واسعة للنظافة العامة والشخصية ونسميها \" يالا شباب نكون بريحة حلوة \" وبجد يا شباب الموضوع ده مهم جدا والمعاناه فيه بجد فظيعة واحنا كمان داخلين على صيف شكله يعلم بيه ربنا والله المستعان<br />مواطنة منهارة من ريحة العرق والرجلين والشرابات والحمامات .....:)"
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226143501/http://masr.20at.com:80/newArticle.php?sid=14267"

[[comments]]
