subject = "الله يقرفكم"
text = "هو ايه اللى حصل كل المواضيع عن الحمامات الله يقرفكم هى ناقصة !!! الموقع بقى ريحتة وحشة من مواضيع دورات المياة"
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401072055/http://masr.20at.com:80/newArticle.php?sid=14267"

[[comments]]
order = 3
subject = "والله الموضوع يجنن D:"
author = "حسام"
text = "حقيقى والله الحمامات بقت زبالة تماما فى كل حتة ودى احدى المعاناة اللى بشوفها فى الجامعة ):<br />عشان كدا بقعد فى الحمام ساعة بحالها قبل مانزل الجامعة D:<br />الحمام البلدى ده للاسف صعب ان حد يستخدمه حتى انا مستحيييييييييييييييييييييييييييل (اوه سيتروه) D:<br />وربنا يبعد عنا وعنكم شر الزنقة"
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401072055/http://masr.20at.com:80/newArticle.php?sid=14267"
