text = ":oops: :cry: :-x<br />بعد خراب مالطة جاى تتكلم عن سوق مشتركة<br />زمان كانت السينما ايام الملك فاروق اسمها السينما العربية لان الممثلون كانوا من الدول العربية فريد الاطرش واسمهان وعبد السلام النابولسى والفنانة كوكا ودريد لحام واسمهان وغيرهم وغيرهم وكان الفيلم يسوق فى كل الدول العربية - سيادتك منعت اشتراك الممثلين العرب فى الاعمال المصرية وبالتالى التسويق بلاد العرب انتهى وظهرت الاعمال السورية ومسلسلات دول الخليج وكل بلد عملت فن خاص بها والاعمال المصرية راحت فى الكازوزة<br />وبعدين جاى تتكلم عن سوق عربية<br />انتم جيل الانحدار المصرى"
