[[comments]]
order = 5
subject = "الى الاخ المعترض على الكارينا والهوا"
author = "اكتب اسمك هنا"
posted = "2007-11-20"
text = "فيه معلق في موضوع الطحاوي بتاع الجنيه غلب الكارنيه على موضوع الكارينا والهوا وزعلان اوي<br />يا ابني عشرينات دا من اقوى المواقع المصرية على الاطلاق واوعا تفتكر انهم بيشتغلوا همايوني كده<br />الموضوعات اللي بيجبوها خطيره جدا بس اللي فاهم صحافه<br />وموضوعات في غاية الاهمية وخصوصا الموضوع مرة واحد اسمه الهوا خطير جدا بس يا خساره الناس عقولها فاضيه<br />ومش فاهمه حاجه<br />حفهمكم ازاي بس<br />والله يا اخت مروى حاولي تفهميهم انتي<br />انتوا عارفين يا جماعة موقع عشرينات دا بيتكلف كام في الشهر<br />مش معقول الناس اللي بتموله هبله زيكم"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121132714/http://masr.20at.com:80/newArticle.php?sid=12483"

[[comments]]
order = 6
subject = "استمري يا عشرينات في فضح خيبة الشعب المصري"
author = "ابومحسن"
posted = "2007-11-20"
text = "الاخ اللي معترض على الكارينا والهوا وزعلان اوي<br />الكارينا والهوا يعني الشعب المصري خيبان<br />الشعب المصري نايم على نفسه<br />شاغل نفسه بحجات تافهه<br />مش عارف ان سيدنا داوود كان بيحكم مصر<br />مش عارف ان فيه حاجه اسمها اسرائيل الكبرى<br />ونايم على نفسه مش عارف ان غزو العراق بداية عصر جديد<br />سايب كل دا ومشغول بالكارينا والنكت<br />استمري يا عشرينات في فضح غباء الشعب المصري وجهله"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121132714/http://masr.20at.com:80/newArticle.php?sid=12483"

