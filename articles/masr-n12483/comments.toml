[[comments]]
order = 1
subject = "اخر نكت"
author = "مش لازم"
posted = "2007-11-18"
text = "آخر النكات<br />K<br />بيقولوا لجحا ... الحق يا جحا تعبان دخل غرفة مراتك ...فقال لهم : سيبوه يستاهل<br />K<br />صرصار ندل عزم 4 اصحابه علي الغدا ولما اتجمعوا كلهم ... شد عليهم السيفوووووون<br />K<br />واحد حمش بيقول لمراته لازم تعرفى أن كلمتى فى البيت زى الساعة قامت بصتلو بصت غضب قام قايلها يعنى لا بتقدم ولا بتأخر<br />واحد غبي بدو ينتحر من عاشر طابق<br />قام زت حالو من خامس طابق مرتين<br />واحد حمصي خبروه انو غلي البنزين آم رد عليهن : انا مابتفرق معي لانو دايما بعبي بخمسمية ليرة بس<br />أسماء قطط محلية و عالمية:<br />علي اكبر بسبساني - قط فارسي<br />نيسان ميو رانو - قط ياباني<br />بسه المعفن - قط شارد مصري<br />الهارون السعيد - قط عراقي<br />قطيقط البسابسة - قط اردني<br />الأطئوط سعدو الحئيئة بدو - قط لبناني<br />البسة النسة - كباريه قطط<br />ياما نوا ياما - قط ياباني اخر صديق لنيسان<br />مأكول الهنا - قط كوري<br />بسبوس ابو فروة - قط سوري<br />كات ستيفنس - قط بريطاني<br />شو اسمه وزير الرياضة الياباني ؟؟؟<br />ياما هيري خفافاتو<br />احتج أحد سكان مدينة مشهورة بالبخل على صاحب جريدة لكثرة نكاتها عن بخلهم فأرسل إليه الرسالة التالية (إذا عدتم إلى التنكيت عن بخلنا فإني لن أستلف جريدتكم من أي أحد)<br />دعاء تلفزيون:الله يعطيك حكمة الزعيم وشجاعة العكيد وصبر أبو عصام وتوبة الأدعشري ويحميك من حقد فوزية وغدر صطيف ويبعد عنك لسان فريال ويحميك من أبو النار وجماعته وأخيرا كل أهل الحارة بسلمو عليك<br />مرة واحد بدوي حب يعاكس بنات قام شاف وحدة طالعة من الحمام قلها يا شخاخة<br />مره واحد دخل لبيت عشان يسرقو ولا صاحب البيت راح اتشكى عليه ولا اجا البوليس بيقول للسراق ليش سرقت البيت اجا بيقولو لأ مسرأتوش اجا البوليس بيقولو مبلا صاحب البيت شافك اجا بيقولو لأ هادا كذاب لأني انا لما سرقت البيت كان هو نايم هههههه"
archived = "2007-11-20"
capture_url = "https://web.archive.org/web/20071120015436/http://masr.20at.com:80/newArticle.php?sid=12483"

