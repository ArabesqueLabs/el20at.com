subject = "مبروك للاهلى و الف سلامه محمد صديق"
author = "نيفين نيفى نوفا"
posted = "2007-06-09"
text = "معلشولاد البلد هخرج عن موضوع التعليق علشان اهنى الاهلاويه بماتش طلائع الجيش و اقول الف سلامه يا صديق ياللى وقعت قلوبنا كلنا<br />بالنسبه للموضوع طول عمر الاهلى مصنع تنشئه و صقل النجوم<br />و كالعاده هقول اننا كاهلاويه نثق فى اى قرار تتخذه اداره النادى"
