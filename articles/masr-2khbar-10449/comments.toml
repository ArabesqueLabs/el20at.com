subject = "أكيد العصابة هذة كانت تنصب على(السعوديين)العرب الج"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-16"
text = "لالالالالالالالا تعليق<br />العنوان خير برهان<br />حذاء اقل مواطن مصرى براس اعلى امير عربى سعودى كلب؟<br />كرامة المواطن المصرى من كرامة الوطن<br />وحان الوقت لاستخدام حرب النعال لتعليم النظام السعودى المتخلف اقل مباذئ الانسانية و احترام حقوق الانسان<br />(لا فرق بين عربى و اعجمى الا بالتقوى)<br />تذكروا حديث رسول اللة يا سعوديين يا ولاد الكلاب<br />(كرامة مصر من كرامة مواطنيها)"
archived = "2010-03-14"
