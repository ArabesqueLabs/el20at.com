subject = "(اللى أختشوا ماتو)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "اما صحيح نقدر نلاقى رغيف العيش متوفر نبقى ندور نتسمم بالبطاطس ايهاااااااااااااااااااااااااااااا!<br />اللى ما تتسمى و لا تتاكل اللى اسمها (شيبسى)<br />صحيح بلد جعانة بتاعة بطنها و بس<br />اهههههههههههههههههههههه يا بلد"
archived = "2008-12-09"
capture_url = "https://web.archive.org/web/20081209032307/http://masr.20at.com:80/newArticle.php?sid=17845"

[[comments]]
order = 1
subject = "الواقع المر - هذة هى اثتثمارات ما يطلق عليهم رجال الاعمال"
author = "مفروس من سماجة بتاع اعلان البطاطس"
text = "مش هو دة واقع بلدنا - وهذة هى الاثتثمارات ورجال الاعمال والفكر الجديد ومصر بتبنى بنا او بتبنى بالشيبسى<br />اما اعلانات البطاطس فى التليفزيون او سماسرة العقارات وبتوع الفيلل فى الساحل الشمالى والشاليهات فى الجرايد<br />لم نرى رجل اعمال يصنع لنا محرك سيارة مثلا ولا حتى كرسى سيارة زى الهندى بتاع شركة تاتا فى الهند<br />ولم نرى رجل اعمال يثتثمر فى صناعة حتة كرت فى كمبيوتر<br />انما وكيل لشركة سيارات امريكية بياخد عمولة 5% عن كل سيارة يبيعها فى مصر ويملىء الدنيا اعلانات<br />للاسف دى الواقع الاليم بتاع مصر وهذة هى الاثتثمارات وهذة هى المنتجات<br />زى بتاع البيبسى والكولا اللى اخد الشركة من الحكومة بتراب الفلوس ورفع سعر الزجاجة 25 % الاسبوع الحالى وقارفنا باعلاناتة ومنتجاتة الهابطة<br />اللهم ارفع عنا البؤس والغم<br />وارزقنا حكومة تخطط لاثتثمارات تضيف انتاج للبلد ويباع فى الاسواق العالمية<br />شكرا اثتثمارات البطاطس وحكومة البطاطس وسماجة بتاع اعلان البطاطس وسماجة امة فى الاعلان"
archived = "2008-12-09"
capture_url = "https://web.archive.org/web/20081209032307/http://masr.20at.com:80/newArticle.php?sid=17845"

[[comments]]
order = 2
subject = "المشروبات الغازية ودرجة الحموضة ومواصفات الكولا والبيبسى فى مصر"
author = "برضة لا"
text = "فى المياة المعدنية تجد انة مكتوب درجة ph 7.2 , هذة القراءة تبين درجة التعادل بين الحموضة والقلوية<br />اما فى المياة الغازية وبما انها اصبحت قطاع خاص واللة اعلم بيعكوا اية فممكن يزودوا نسبة الصودا او الغاز<br />وهذا يسبب قرحة فى المعدة وبلاوى كتير فى الكلى والدم<br />وبما اننى لا اثق فى شركة تزيد اعلاناتها بطريقة مكثفة للبيع باى طريقة فاننى اشك<br />وقررت وكل الجيران مقاطعة البيبسى والكولا وعمل عصائر فى البيت ليمون او جوافة او مانجو عندما يتيسر الحال<br />وربنا يسترها معانا"
archived = "2008-12-09"
capture_url = "https://web.archive.org/web/20081209032307/http://masr.20at.com:80/newArticle.php?sid=17845"

[[comments]]
order = 3
subject = "والله عالم بتهيس وخلاص"
author = "محمد"
text = "داس على الثوابت الوطنية ايه يا عمو ويا ستو الكلام الكبير ده ولا هو اى كلام وخلاص عشان المقال يتملى كلام<br />ولعلمكم ناس كتير والله قالوا ان اعلان رأفت الهجام ده من اظرف الاعلانات مش عارف باينكم جايين من كوكب تانى"
archived = "2008-12-09"
capture_url = "https://web.archive.org/web/20081209032307/http://masr.20at.com:80/newArticle.php?sid=17845"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
text = "للعلم فقط ....اعلان العربية افيو اللي بتقولوا انه ارخم اعلان ..الاعلان ده بالذات زود مبيعات الشركة للعربية دي في شهر رمضان بس 40 % و الزيادة دي مكنتش علشان العرض اللي طرحته الشركة بس لكن كمان لوحظ الاقبال الشديد جدا و الاصرار على شراء لون السيارة اللي كان معروض في الاعلان و هو الأحمر ..يا بتوع كلية الاعلام و جروب الفيس بووك"
archived = "2008-12-09"
capture_url = "https://web.archive.org/web/20081209032307/http://masr.20at.com:80/newArticle.php?sid=17845"

