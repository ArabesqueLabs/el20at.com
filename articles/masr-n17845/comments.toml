subject = "أنا موافق على معظم الحاجات دي و لكن"
text = "أنا شايف إن إعلان ال I aveo you رائع بكل المقاييس و جديد جدا و ناس ممتازة و إن الكلام اللي إتقال هنا مش نقد صحيح ليه ده مجرد واحد متغاظ من إن عمره ما هيملك حاجة من الحاجات دي<br />بالنسبة للفانلات طب انتي عايزة يعلنوا عنها إزاي و لا ينتجوها و يحطوها في المخازن و يفرقوها على العائلة"
