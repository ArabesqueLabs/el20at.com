subject = "اعلانات فعلا مستفزه"
author = "laweryasser@yahoo.com"
text = "اكتر حاجه بتسعدنى ان الاقى ان اللى بيسنفزنى استفز غيري لانى بحس انى صح<br />فعلا مجموعه الاعلانات اللى جات ف المقال ده مستفزه جدا وكانت اول ماتيجى فى فواصل المسلسلات<br />كنت بقلب على اى حاجه لحد ماتخلص وارجع تانى انا بقيت ادايق من كريم عبد العزيز احب اقوله رخصت نفسك<br />والاعلان ده بالزات اظهر انك لو مثلت كوميدى هتفشل خليك ف الاكشن المحجوز اصلا للسقا"
archived = "2008-12-09"
capture_url = "https://web.archive.org/web/20081209032307/http://masr.20at.com:80/newArticle.php?sid=17845"
