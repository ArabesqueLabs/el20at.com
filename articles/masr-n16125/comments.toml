[[comments]]
order = 0
subject = "عتاب على الحكومة المصرية الحبيبة"
author = "صعيدى من دشنا"
text = "بتوع الامن والوزراء وكل مسئول يقول لك ما تعملش مظاهرات ولا اضرابات وعبر عن رأيك بالقنوات الشرعية<br />كلام رائع<br />اين هى القنوات الشرعية اللى ممكن المواطن يعبر عن رأية فيها ؟<br />اتحاد الطلبة وانتخاباتة المزورة<br />النقابات اللى تحت الحراسة<br />اتحاد العمال المنتخب بالبلطجة والعافية والتزوير<br />مجلس الشعب ومحاصر بقوات تسد عين الشمس<br />نعبر عن رأينا ازاى من خلال القنوات الشرعية<br />نروح قسم الشرطة نهتف هناك شوية<br />والا نروح لاظوغلى نهتف لرئيس الدولة<br />يا عالم اتقوا اللة"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144115/http://masr.20at.com:80/newArticle.php?sid=16125"

[[comments]]
order = 1
subject = "اين هى القنوات الشرعية اللى ممكن المواطن يعبر عن رأية فيها ؟"
author = "مش رائص"
text = "1) الحمامات<br />2) الكبانيهات<br />3) المراحيض<br />4) المزابل<br />5) اماكن جمع القمامه<br />هذه هي القنوات الشرعية اللي ممكن تعبر فيها عن رايك بكل حرية"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144115/http://masr.20at.com:80/newArticle.php?sid=16125"
