[[comments]]
order = 4
subject = "عدد معتقليها بلغ خلال العام الماضي 7555 معتقلا."
author = "مش وخلاص"
posted = "2009-02-02"
text = "دول من الاخوان فقط ويمكن فيه ادهم مش من الاخوان ولكن معتقلين على حس الاخوان<br />تصوروا بسبب ذلك زوجات حائرات واولاد تائهين وامهات ثكالى بسبب وجود الزوج او الابن داخل السجن<br />والحكومة الفاشله مش عارفه تعمل اي حاجه الا انها تزود الطينه بله<br />الازواج في السجن ذهبوا للجهاد الاكبر<br />والزوجات عليهن الصبر والاحتساب عند الله<br />والاولاد يروحوا في ستين جاهية تاخدهم الاباء يزرعون الحصرم والابناء يدرسون<br />عمر التلمساني المرشد التالت للاخوان لما هجمت المباحث الفاشلة التابعة لوزارة الداخلية المصرية الفاشلة على منزله لالقاء القبض عليه<br />الواد ابنه يا عيني اتفزع وجاتله حالة عصبية مزمنه واصبح مريض نفسي<br />ولا حول ولا قوة الا بالله العلي العظيم<br />خلينا احنا كده شغالين حكومة واخوان وفي غزه شغالين فتح وحماس واسرائيل عماله كل يوم تكسب مواقع جديدة وتنطلق من اسرائيل الصغرى الى الكبرى<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "الأسكندريه"
author = "smsm"
posted = "2009-02-09"
text = "بعد السلام اتمنى من الله ان تكون جميع الأمه الأسلاميه بخير<br />بس كل اللى عايز اقوله ان كل ده كدب فى كدب (( ويمكرون ويمكر الله والله خير الماكرين)) كل ما قيل عن الأخوان كدب ووالله ليس انحياز لهم ولكنى عاشرتهم وعلمتهم جيدا ومع احترامى لباقى الناس انا شايف تعليقات سخيفه جدا بس كل اللى اقدر اقوله اولا عمر ما حدثة فجوه مثل ما تقولن بين شباب الأخوان ولن تحدث بأذن الله وان حدث فبين شباب لا يفهمون الدعوه فهمها الصحيح<br />علشان ما اطول اقول للناس كلها لو مش عاجبكم الأخوان عايزين مين اللى يرجع الخلافه ويحكم بالأسلام عايزين مين يكون الضمير الصاحى اللى يدافع عن حقوقنا كفايه عناد فى نفسنا وكبر وكفايه بس نقول كلمه حلوه فى حقهوم بدل ما احنا عمالين نعصى ربنا ومش فالحين غير فى التأليس<br />على فكره انا مستعد لنقاش اى حد فى موضوع الجماعه وده ايميلى smsm_sus@yahoo اوsmsm-com@maktoob"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "كفايه"
author = "smsm 1986"
posted = "2009-02-09"
text = "كفايه بئى استهتار بأعراض الناس وثب وشتم فيهم اتقو الله واقرأوا التاريخ صح وانتم تعرفوا الأخوان عملوا ايه<br />قبل الأخوان كان فيه حد بيشغل باله بأنتخابات مجلس الشعب وغيرها من الحاجات اللى فتح عنينا عليها من السرقه اللى فى البلد واحنا نايمين على ودانا واول ما نسمع كلمة الحكومه نكش ونخاف خلا بئى فوقو واعرف صاحبك من عدوك<br />مفكرتيش يوم تسأل نفسك يالى عمال تغلط وتشتم فيهم هما بيدخلوا السجن والمعتقلات ليه ايه اللى بيخدوه من كده الدوله بتديهم فلوس ولا ليه ممكن علشان يوصلولك فكره او يقولوا قلمه حق ممكن يدخلوا المعتقل ايه اللى حملهم على هذا غير حب الدعوه والتضحيهمن اجل انك تعيش حياه كويسه<br />والله انا عن نفسى عانيت كتير فى المعهد بتاعى اللى المفروض كنت اقضى فترة الدراسه فيه عادى زى اى طالب لكن لما تعرف اللى بيحصل يبئى لازم يكون فى كلام تانى لما تعرف ان عميد المعهد معمله قضيه تحرش بفتيات فى المعهد ولما تعرف ان وكيل الوزاره ومدير عام المعهد شاذ جنسيا وبيمارس كده مع بعض المهندسين الجداد ومعاك ادله صوت وصوره يبئى عيب اوى نقف نتفرج وقررنا نحارب الفساد وطبعا كان اسمى اول واحد يوصل للمهندس اللى معانا انى ما انجح علشان الطلبه يبعدوا عنا لكن الحمد لله عديت سنه ولما خرجنا الموضوع كبر وش شرط الثمره تيجى فى وقتها لكن الحمد لله الوزاره اتأكدت من الكلام ده وفعلا اتشال من منصبه هوه والعميد وما تزال طائفة من امتى ظاهرين لعدوعم قاهرين لا يضرهم من خالفهم من اذى حتى يأتى وعد الله واما نصر واما شهاده"
archived = "2010-03-14"
capture_url = ""
