subject = "من جانبه، استبعد الدكتور ضياء رشوان الباحث في شؤون"
author = "مش باحث"
posted = "2009-02-02"
text = "الازمة الاقتصادية في مصر يا جماعة عملت حجات وحشه اوي في الخلق<br />واحد بيشتغل باحث في شءون الجماعات الاسلامية<br />وقبل كده في موضوع لمصطفى شحاته (درش) جاب اسم واحد سما باحث في شءون الحركات الاسلامية<br />يعني دكتور باحث في شئون الحركات الاسلامية<br />ودكتور تاني باحث في شءون الجماعات الاسلامية<br />يا حلاوة يا جدعان<br />ربنا يرزقنا بوظيفة كويسه كده يعني مثلا نفسي ابقا باحث في شئون خيبة المصريين"
archived = "2010-03-14"
