subject = "وأوضح أنه على مدار 80 عاما من عمر الجماعة"
author = "مش اخوان"
posted = "2009-02-02"
text = "80 سنه عذاب<br />80 سنه سجون ومعتقلات<br />80 سنه خروج على النظام بدون اي نتيجة<br />لما جه جمال عبدالناصر وخرج عليه الاخوان كانت النتيجة هزيمة نكراء في 67 يبقى يا فرحتي بالاخوان<br />يا ليت نرجع عهد ما قبل الاخوان<br />80 سنه مصاريف باهظة ينفقها الامن بسبب جماعة الاخوان كان اولى بها المرضى والمكسحين<br />ارحمونا بقا لا انتو عارفين تاخدوا الحكم ولا عارفين تسبونا في حالنا"
archived = "2010-03-14"
