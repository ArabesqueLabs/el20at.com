author = "ومن يهتم ؟"
posted = "2009-07-02"
text = "جريدة معارضة تمثل تيارا معارضا للنظام - تيار الاخوة الاشتراكيين الذين وصلوا الى قرار من بدرى ان موارد مصر محدودة جدا ولا بد من تنظيم توزيعها بعدل بحيث يكون للفقير فيها حق وللغنى حق<br />وهذا ضد الراسمالية المتوحشة السداح مداح<br />من اجل هذا فرح الجميع لسقوط الجريدة<br />وشربوا على سقوطها الانخاب<br />ولن يهتم احد بتلك الاضرابات ولن يعيروها اى اهتمام<br />الا اذا<br />تغير لون الجريدة وتركت السياسة وبدات تكتب عن الموضة وملابس النساء الداخلية والاحذية النسائية وسروال هيفاء وتنورة نانسى وباروكة سمير غانم<br />ساعتها وزارة الثقافة ستدعمها بالاموال وتكون احسن جريدة"
