[[comments]]
order = 1
subject = "وانت مالك يا استاذ ابراهيم عيسى"
author = "بفتة المنجد"
posted = "2008-11-08"
text = "انا شايف انك تقعد ساكت وملكش دعوة بأى حاجة - وبدل ما تكتب فى السياسة اكتب فى الدين والاخلاق وانت مقنع فى احاديثك التليفزيونية فى قناة دريم<br />اذا كان جدار بيقع وايل للسقوط نقعد نشتم لية ونعكر فى دمنا لية علشان الجدار هيقع ومشقق ومايل واساسة مخوخ<br />هتقع هتقع<br />كل شىء فى طريقة للانهيار<br />وكل واحد بيتوقع انة يصحى من النوم يلاقى البلد مولعة<br />اقعد ساكت يا ابراهيم<br />دع المقادير تجرى فى اعنتها ولا تنام الا قرير العين<br />فما بين لحظة واخرى يبدل اللة من حال الى حال<br />خربانة خربانة"
archived = "2010-03-14"
