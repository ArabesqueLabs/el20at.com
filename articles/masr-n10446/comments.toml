subject = "فى الانتظار"
author = "نيفين نيفى نوفا"
text = "من فتره و احنا بنسمع عن افيلم و منتظرينه و بنسال اتعطل ليه<br />الفيلم يبدو مشجع يعنى كاتبه معاطى اللى ساعات من كتر الابداع بيكتب حاجات غريبه و العمل بيبوظ منه ف الاخر زى ما حصل ف الهلالى بس ده لا يمنع انه فنان<br />كمان الجميل طلعت زكريا و اللى بيدخا الافيه بتاعه القلب من غير استئذان و اللى براهن عليه ف الفيلم ده كبطوله مطلقه مش بس كسنيد يخف بافيهاته الكوميديه من حده او اكشنيه الاحداث"
archived = "2007-07-03"
capture_url = "https://web.archive.org/web/20070703112218/http://masr.20at.com:80/newArticle.php?sid=10446"
