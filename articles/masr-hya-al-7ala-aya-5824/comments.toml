subject = "العب غيرها (رد على مفيش فايدة يا بتوع الاخوان"
author = "فاضح الاقباط"
posted = "2007-05-13"
text = "يا جماعة الاقباط عندهم هاجس اسمه الاخوان<br />يعني الموضوع ليس له علاقة بالاخوان<br />والمغفل بيقول مفيش فايده يا بتوع الاخوان<br />الاخوة الاقباط والمسيحيين عموما عندهم هاجس اسمه مهدي عاكف حاسين انه قرب يصل الى الحكم وهذا ليس صحيح<br />وما تخفوش لو وصل الى الحكم مش حياخد منكم الجزيه"
