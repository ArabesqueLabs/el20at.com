subject = "العنوان خطأ - غرق 70 مليون مصرى"
author = "البكاء فى القلب"
posted = "2008-06-17"
text = "خمسين بس اللى غرقوا<br />وبقية الخمسة وسبعين مليون مش غرقانين<br />نحن نتنفس تحت الماء - نحن نغرق - كما قال عبد الحليم حافظ<br />انت ماسمعتش عن الغش فى الثانوية العامة والغش فى الانتخابات والغش فى رغيف العيش والغش فى العلاوة 30 %<br />ربنا يسترها معانا جميعا<br />ويطلعنا من المستنقع<br />ونعيش زى بقية البشر"
archived = "2010-03-14"
