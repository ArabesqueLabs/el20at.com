order = 1
subject = "واحد مش فاهم حاجة"
author = "يعني إيه"
posted = "2007-07-02"
text = "بصراحة انا بضم صوتي ل(واحد والسلام ) لأن الموضوع غير متناسق وأنا مش عارف إيه إللي بيحصل ، حتى إن مستوى العربي بقى متدني لابعد الحدود ، ( إحنا بنفهم عربي برضه ) لو معندكوش مدققين كويسين قولولي وأنا أحلهالكو ."
