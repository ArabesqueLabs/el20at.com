subject = "تصحيح للخبر : لايوجد شيئ اسمه خط البلدة وابو ريالي"
author = "ابو نواف"
posted = "2008-01-18"
text = "قريت المكتوب اللي كاتبتة الاخت المراسلة ضحكت كثير على غبائها<br />ليتها سألت وتأكدت قبل ماتنشر اخبار حتى يطلع اسمها جنبه<br />لايوجد شي اسمه خط البلدة ولابوريالين من وين جابت هالمعلومات<br />شي ثاني : شركة النقل الجماعي افخم شركة نقل بالعالم وهي نفسها من تنقل رؤساء الحكومات في زيارتهم للأماكن المقدسة بالسعودية"
