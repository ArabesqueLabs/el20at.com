subject = "القذافى المخبول"
author = "فهد الا سلام"
posted = "2007-05-03"
text = "طيب والله كو يس انة فيية حد من الغرب عارف ان القذافى معتوة وخريج مشتشفى الا مر اض العقلية لو شفتة مسرحية محمد صبحى مش فاكر اسمها لا نى مش بشوف الحاجات دى دلوقتنى المهم لما كان دكتاتور وريس دوله بس مجنون اهو القذافى زى كدة من مطاب الا مة الا سلا مية الى جة غلط وضيع الدنيا والدين القذافى عاوز يطبق التشيع على المسلمين القذافى بيقول انة مفيش سنة بعد موت رسول الله صلى الله علية وسلم القذافى يقول عن سيدنا عمر الى هو احسن من اللى جابة ابوة يقول عنة انة كان دكتاتوار طيب فية اية تانى من واحد يسمى ريس دولة رحم الله شيخ المجا هدين عمر المختار هو دة ليبيا كان الله فى عون الا خوان فى ليبيا ويرحمكم ربنا من الدكتتاور المجنون وحسبى الله ونعم الوكيل"
archived = "2010-03-14"
