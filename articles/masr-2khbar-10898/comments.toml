subject = "السادات هو شهيد فلسطين الحقيقي"
author = "مش لازم"
posted = "2009-01-07"
text = "بلا اربعين عالم بلا اربعين بتاع<br />السادات هو الشهيد الحقيقي لفلسطين وبسببه اقيمت دولة فلسطين في الضفة والقطاع وهذا هو الممكن في زمن المستحيل<br />واللي مش مصدقني يقرأ تفسير حتى اذا جائ وعد الاخرة جئنا بكم لفيفا للشيخ الشعراوي الذي قال ان لفيفا دي معناها ان كل يهود العالم سيأتون الى فلسطين<br />ثم قال حتى يضربهم المسلمين ضربة واحدة للقضاء عليهم<br />فنحن الان في تنفيذ اية حتى اذا جاء وعد الاخرة جئنا بكم لفيفا<br />اذن الذي فعله السادات هو عين الصواب"
archived = "2010-03-14"
