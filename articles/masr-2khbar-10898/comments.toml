[[comments]]
order = 2
subject = "كل سنه وانت طيب يا زخاري النهاردة 7 يناير وطنطاوي"
author = "مباحث اسكندرية"
posted = "2009-01-07"
text = "الاسم: ممدوح زكى زخارى<br />العنوان: حقا انمة رجل محترم اما انا فخطير على الامن القومى المصرى كما تدعى على كذبا وزارة داخلية مصر<br />ليتنى كنت ممدوح اسماعيل و ليس ممدوح زكى زخارى المصرى الذى منعت من السفر خارج مصر من 11 مايو 1992 و حتى و قتنا هذا انتقاما منى بسبب زيارتى الى دولة اسرائيل لغرض العلاج الطبى الغير متوفر فى مصر و كل الدول العربية و ايضا قيامى باداء مراسم التقديس بالقدس لكونى مسيحى مصرى؟ يشرفنى حقا ان يكون لى شرف التعرف بالشخصية الهامة التى ساعدت على اخراج السيد ممدوح اسماعيل خارج مصر من صالة كبار الزوار ليخرجنى انا كمان؟ مستعد لدفع مليون دولار امريكى لاى شخص يساعدنى على الخروج خارج مصر و ليعتبرنى ممدوح اسماعيل ولست ممدوح زكى زخارى جرجس المصرى المسيحى القبطى الشريف و لست القاتل؟<br />ــــــــــــــــــــــــــــــــــــ<br />الاعتراف سيد الادلة يا زخاري<br />http://masr.20at.com/marquee/comment.php?id=84038"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "السادات راح يلاعب اليهود امك فى العش والا طارت فقت"
author = "مش لاعب"
posted = "2009-01-07"
text = "موقف السادات فى حياتة وفى اخر ايامة زى موقف سعد باشا زغلول تماما<br />غطينى يا صفية وصوتى<br />فبدل السادات ما يقول غطينى يا جيهان وصوتى - راح واخد نفسة وراح على تل ابيب ومعاة كفنة زى الصعايدة بتوع التار ووقع اتفاقية استسلامة فى كامب ديفيد ونتيجتها ان اليهود بياخدوا الغاز ببلاش وممنوع دخول قوات سيناء علشان يستردها اليهود فى اى لحظة<br />وبعدين بعد الاتفاقية راح يتلاعب وعايز يتملص فقتلوة لانة كان فاكر نفسة ذكى وهيلاعبهم امك فى العش وطارت<br />وطبعا حادث القتل على المنصة فى مواقع كثيرة على النت وعدد القتلى ومن هم ومن المفاجات ان بعض القتلى من حرسة الخاص كانوا من كوريا الجنوبية<br />السادات عمل اية للقضية الفلسطينية ؟ رجع القدس - رجع غزة اللى ضيعها عبد الناصر فى حرب 1967<br />كلا<br />الملك فاروق بس هو اللى حارب فى 1948 علشان فلسطين<br />انما الباقى<br />اللى حارب فى 1956 علشان تاميم القناة<br />واللى حارب فى 1967 علشان سوريا واغلاق خليج العقبة<br />واللى حارب فى 1973 علشان يحرر شريط على شط القناة ولتحريك القضية سياسيا<br />سادات مين يا ابا<br />اتغطى قبل ماتنام<br />وقلل شوية من احلام اليقظة"
archived = "2010-03-14"
capture_url = ""

