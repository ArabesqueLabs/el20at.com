subject = "يا خوفى لا بعد غزة - ييجى الدور على مصر - الست ليف"
author = "واحد من مصر"
posted = "2009-01-06"
text = "بيان العلماء دة صح<br />لكن السؤال - راى شيخ الازهر اية ؟<br />يا شعب مصر نحن فى خطر<br />اسرائيل بتتلكك - وحكاية الانفاق دى مش هتعدى على خير<br />ويا بتوع الحزب الوطنى اجهزوا علشان تدافعوا عن مكتسباتكم انتم ورجال الاعمال<br />انا واحد من الناس ما ليش دعوة لانى تبع حزب طز"
