subject = "العلماء هتفوا - يا اسماعيل يا هنية ما تسيبش البندق"
author = "كنت هناك"
posted = "2009-01-07"
text = "العلماء هتفوا يا اسماعيل يا هنية ما تسيبش ا لبندقية<br />ولما ضيق الامن عليهم الخناق وزنقوا عليهم هتفوا<br />ساكتين لية ما تضربوا<br />وطبعا الازهر فية ناس شرفاء<br />وفية علماء عارفين مصلحة الامة وغيورين على الدين<br />انما فية شيوخ حزب وطنى زى الطنطاوى ولائهم لالمرت وشيمون بريز - انتم نسيتم سلامات حارة من شيخ الازهر لشمعون بريز فى المؤتمر<br />على فكرة اسرائيل انهزمت<br />وابلغت عملائها ان يتقدموا بمبادارات لايقاف الحرب وهدنة<br />والعملاء جاهزين والمبادرات جاهزة<br />ويا اسماعيل هنية<br />خللى السلاح صاحى<br />خللى السلاح صاحى"
archived = "2010-03-14"
capture_url = ""

