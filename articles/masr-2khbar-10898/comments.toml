[[comments]]
order = 8
subject = "شيوخ الفتة والتهليل للحاكم ونفاقة واصدار الاراء ال"
author = "مسرور السياف"
posted = "2009-01-07"
text = "زمان ايام الجهل خرج بعض المستشييخين وقال للخليفة المعتصم - كيف تخرج لفتح عمورية والنجم اليمانى مش هيكون على شمال السماء والابراج بتقول انك هتنهزم وهتنضرب بالجزمة لو حاربت الرومان فى الوقت<br />طبعا لم يصدقهم<br />وخرج للحرب وفتح عمورية<br />وقابلة الشاعر قائلا<br />السيف اصدق انباءا من الكتب ----------------------- فى حدة الحد بين الجد واللعب<br />مشايخ مين ؟<br />والشعراوى مين ؟ ومالة ومال لفيفا<br />دة رجل فقى بيفسر القران المفسر الفين مرة قبل كدة<br />اخراج اليهود من فلسطين - عايز السيف ومش عايز فتاوى ولا تفسيرات<br />قبل كدة<br />السلطان البطل حاكم مصر قلاوون دمر امارة الرها الصليبية وطردهم<br />ثم تولى من بعدة ابنة السلطان اشرف قلاوون المعروف باسم السلطان الاشرف ودمر الامارة الثانية للصليبيين - ومات<br />ثم تولى اخوة السلطان محمد بن قلاوون وطرد اخر صليبى من فلسطين<br />تحرير الارض بالسلاح وليس بالفتاوى ولا بالمكاوى ولا الشعراوى<br />كل المظاهرات دى ملهاش فايدة<br />20 فدائى يقاتلوا احسن من صويت النسوان فى الشوارع<br />الصراع فى فلسطين صراع وجود -"
archived = "2010-03-14"
capture_url = ""
