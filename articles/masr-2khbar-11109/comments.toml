subject = "هتبقى جار ايمن نور فى سجن ابى زعبل والحبس 5 سنوات"
posted = "2009-01-29"
text = "التهمة والجناية هى الخروج من حدود البلاد بالطرق الغير مشروعة والتسلل الى دولة مجاورة بدون اذن السلطات ودى عقوبتها من 3 ال 5 سنوات<br />اما اذا امن الدولة اراد ان يحبش التهمة كويس ويقول انك كنت بتهرب صواريخ واسلحة الى حماس فا انا اضمن لك الاعدام بالتاكيد وستقابل عشماوى قريبا<br />ولكن على كل الاحوال اسمك هيدخل التاريخ ايا كان الحكم<br />والعيال فى الاجيال القادمة ربما يقرأوا قصتك فى كتب المطالعة فى مدارس مصر<br />ولكن الان<br />طريقك مسدود مسدود"
