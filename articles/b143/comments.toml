subject = "يعني بنفسك اعترفت يا محمد نواف الحمد الله بأنكم مت"
author = "عاشق فلسطين"
posted = "2008-04-21"
text = "السلام عليكم ورحمة الله وبركاته , وانتا بنفسك يا محمد نواف بتقول إنو العيشة بالأردن خرا , وهي فعلا أخرا من خرة , شوف<br />كيف ثقافة المرور البدوية المعفنة , هدول إنتوا يا الأردنيين , مش بقلك من أول مش عارف كيف الملك ساكت عليكو , ولك والله والله والله لولا الله تعالى ثم إحنا الفلسطينيين اللي رافعين راسكو والمفروض ينحط بالتراب , لكانت الأردن أخزى وأخرى وأعفن وأفشل دولة على وش الأرض , يعني سبحان الله بنفسك اعترفت , لا تعليق , فعلا شعب متخلف , وبعد.. هذه هي ثقافة الأردنيين المرورية.. وهذه هي نتيجة ثقافتهم<br />على العموم :<br />عاشت فلسطين : من الفاء للنــــــــون , ومن النهـــــــــــر إلى البحــــــــــــر"
archived = "2010-03-14"
