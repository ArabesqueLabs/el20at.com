[[comments]]
order = 3
subject = "والله معاك حق ياأبو الشباب ... فعلاً إحنا هيك وأزو"
author = "محمد نواف الحمدالله ..."
posted = "2008-02-12"
text = "أخ طارق _ كلامك صحيح وسليم بالمطلق وهاذ إن دل على إشي فإنو بدل على تخلفنا وجهلنا وهبلنا وتسطيلنا ..<br />يعني الواحد _ قرف حياتو _ إنو يحكي الحق والصحيح والحقيقة المرة \" مثل مابقولوا \" .. لإنو ماعاد في إشي مخبى .. كل مفضووووووووح .. ومبين وواضح مثل عين الشمس .. يعني وكذبنا .. وضحكنا .. وكابرنا .. وخبينا .. ورقعنا \" باللهجة الأرنية القحية \" .. يعني ومن الآخرررر لمتى ؟؟؟ يعني رح يجي يوم وننفضح فيه وهذا اليوم جاي أكيييييييد .. بس متى ؟؟؟ ( الله أعلم )<br />يعني اللي بدي أقولو يكفينا تخلف وجهل وغباء .. لإنو الناس تطورت وتحضرت .. وصارت مواكبة لهذا العصر ومتطلباته .. وإحنا زي ما إحنا \" فالج لاتعالج !!! \" .. مشتهي مرة بحياتي إني أشوف نظام مستقل منفصل إلو سيادتو وخصوصيتو بالأردن ولو لمرة وحده بس .. \" كثير اللي قاعد عم بطلبو أنا \" _ أنا واثق وعارف تماماً _، بأن هاذ الإشي مش رايح يتطبق نهائي على أرض الواقع وولاحتى بالأحلام الوردية \" مثل مابقولوا \" .. آآآآآآآآآآآآآخ .. آآآخ .. آآخ دنيا غريبة ,,, عجيبة !!<br />بس يلا . بعين الله . والله يخليلنا حكومتنا الرشيدة \" اللي لابتهش ولا بتنش \" ...<br />* ملاحظة :- مع إني شخصياً مش مولود وولاعايش بالأردن .. أنا مولود وعايش بالإمارات .. ويمكن ( ه ) أنزل كل صيفية عليها .. يعني والله إشي بطقطق .. وبزهق .. وبخري كمان !! يعني الصراحة _ وبدون مجاملة _ العيشة بالأردن خرا، لأ شو خرا ؟؟؟ لسه الخرا أهون !! هاذ هوه واقعنا ولازم نتقبلو .. وبرد بحكي وبكرر ثاني مرة واللي بقول غير هالكلام بكون كذاب وبضحك ع حالو قبل مايضحك ع الناس .. ورغم كل شيء ............ ::: الأردنـــــ أولاً ــــــــــــــــــــــــ ::: وتحياتي للجميع ،،،"
archived = "2010-03-14"
capture_url = ""

