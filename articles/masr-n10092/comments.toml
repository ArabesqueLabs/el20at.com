[[comments]]
order = 1
subject = "الدنيا ضرب ×ضرب"
author = "شرين منصور"
text = "السلام عليكم موضوع جديد وغريب من نوعو فعلا بس صح احنا ليه كلامنا كلها لازم تدخل فيها كلمة ضرب حتى الشعب اللبناني بيقول(أكلت الضرب) يعني شربت المقلب باللهجة المصرية واضح ان ده يدل على شعور عدواني مكبوت جوة كل واحد فينا ،بالاضافة ان الكلمة دي بتدخل من ضمن القاموس الشبابي الغريب اللي بيضم روش وطحن وموت وشك والكهربا وحاجات ملهاش معنى ،وفيه برضو يا استاذ محمود (نضرب بالكلام عرض الحائط) بجد كلامنا مش ليه معنى واصبح هيروغريفي لكن المعروف جداااااا زي ما قلت في اسكندرية يلا بينا نضرب كشري انا عن نفسي بقولها وبجد بعد ما بقولها بقول لأصحابي يعني ايه نضرب كشري.بس بجد ليه كلامنا فيه كلمات ليها"
archived = "2007-05-10"
capture_url = "https://web.archive.org/web/20070510021043/http://masr.20at.com:80/newArticle.php?sid=10092"

[[comments]]
order = 2
subject = "ضربني وبكى وسبقني واشتكى"
author = "هووووووووبه"
text = "انا<br />عجبني الموضوع جدا خصوصا الحته الاخيره بتاعت الامثال<br />, عامه ماما لما كانت تندهلي تقولي روحي يا مضروبه تعالي يا<br />مضروبه اما بخصوص الامثال فهي كتير فعلا منها مثلا ضرب وبكى وسبق واشتكى<br />الضرب في الميت حرام<br />ضربة في كيس غيرك كانها في تل رمل<br />ضربتين في الراس توجع<br />ضربوا الاعور على عينه قال اهي خسرانة"
archived = "2007-05-10"
capture_url = "https://web.archive.org/web/20070510021043/http://masr.20at.com:80/newArticle.php?sid=10092"

[[comments]]
order = 3
subject = "عثل عثل عثل على راى جماعه اصحابنا"
author = "نيفين نيفى نوفا"
text = "الموضوع جميل جدا و غريب جدا و جديد جدا<br />و انا عن نفسى اول حاجه بعملها الصبح اضرب كبايه نسكافيه على الريق<br />و دى الحاجه الوحيده اللى ممكن الواحد يضربها قبل ما ينزل من البيت<br />لان اول ما بتنزل الشارع و بتختلط بالناس بتتضرب..انا عن نفسى مثلا بنضرب عين اول ما بنزل من وتحده عينها مدوره اول ما تشوفن تقوللى ايه الشياكه دى و الباقى انتو عارفينه طبعا ..بيبقى اليوم تماااااااام<br />و يتوالى الضرب على مدار اليوم زى ما قال محمود<br />بمسى او بصبح علشان التوقيت على اللى فوقىو بقولها الميل وصل يا هبهوب<br />اى خدمه يا جمييييييييييييييييييييييييييييل"
archived = "2007-05-10"
capture_url = "https://web.archive.org/web/20070510021043/http://masr.20at.com:80/newArticle.php?sid=10092"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
text = "نسيت تتكلم عن الناس اللي بتضرب مخدرات<br />نضرب سيجارتين حشيش او بانجو<br />نضرب حقنة<br />نضرب برشام"
archived = "2007-06-13"
