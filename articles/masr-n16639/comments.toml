subject = "بمصص شفايفى كل مشفهم"
author = "مانا واقفه واقفه"
posted = "2008-08-01"
text = "وقفة ايه ونيلة ايه انا من ساعة متولدت ولغايه لما كبرت اهو وتعديت السن القانونى للجواز ورئيس الدولة يقر بأن الأزمة الحقيقة للباد هى الزيادة السكانية كل شويه على كده مش فاهمة انا من أسره عدد أفرادها ماشى على حسبة الحكومة وفى التنظيم بتاع الأسرة ده وعلى الرغم من كده طول عمرى بعانى من كافة الخدمات فى البلد فكرتنى بحملة محلول الجفاف فى التمانينات وماما كريمة"
