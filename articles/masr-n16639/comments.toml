[[comments]]
order = 9
subject = "عبيط ده ولا إيه؟؟!!!"
author = "واحد محروق دمه"
posted = "2008-08-03"
text = "القصه كلها اننا غلطنا فبابا حسني حب يربينا شويه, لأن موضوع الوقفه دي -اللي مفيش بعدها عيد ولا حاجه- مكانتش مع بدايه الصيف زي ما الأخ أحمد الهواري قال, لكن بعد مظاهرات إبريل اللي فات آل يعني احنا اللي غلطانين وولاد ........, عشان الحكومه بتحاول تسعدنا وتنمي البلد واحنا برضه مش عاجبنا علي العموم حسبنا الله ونعم الوكيل. بس انا مش فاهم نقطه هوا العيش اللي في الصوره اللي فوق دي مش برضه من ابو جنيه الرغيف, وبعدين فيه صوره تانيه مضايقاني بتاعت نستريح كلنا مصورين اتوبيس سياحي فاخر علي انه اتوبيس نقل عام زي ما يكون كلنا مركبناش صفيحه الزباله اللي اسمها اتوبيس قبل كده, دي ناس بتستهبل."
archived = "2010-03-14"
capture_url = ""

