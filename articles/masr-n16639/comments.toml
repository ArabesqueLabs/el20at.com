[[comments]]
order = 11
subject = "وقفة حقيقية"
author = "lwvdm"
posted = "2008-08-05"
text = "للأسف فكرة الإعلانات غلط، مفيش حد بيهتم بيها إنما لو مثلاً الحكومة عملت حوافز لتشجيع الناس على الإكتفاء بطفل أو اتنين على الأكثر، زي ما دول تانية عملتهان ده هيبقى أفيد بكتير. ليه مايبقاش مصروفات التعليم والعلاج وغيرها من الخدمات للطفل الأول مخفضة وتساهم فيها الدولة؟! كده فعلاً تبقى وقفة مصرية الناس تحس فيها إنها لما تكتفي بطفل واحد تبقى بتقف مع حكومتها وتخفف من الزيادة السكانية وفي نفس الوقت تحس إن حكومتها واقفة معاها وبتخفف عنها أعبائها، أما الإعلانات دي فهي وقفة مصرية تزيد من الأعباء"
archived = "2010-03-14"
capture_url = ""

