[[comments]]
order = 4
subject = "والله احنا زهقنا ,, هما لسه مزهقوش"
author = "ابنك يامصر"
text = "طيب وبعدين ؟!<br />هما مفكرين انهم بيضحكوا علينا<br />بدل ما نخكم عقلنا و نبطل خلفة ,,, ما يحكموا هما القانون ويرحمونا من الفاسدين اللي ناهبين البلد وهما معروفين !!<br />اشك في ان واحد من المسئولين عن الحملة مقتنع بيها أصلا<br />ثم الزيادة السكانية دي في صالحنا لأنها موارد بشرية !! بس هما بيدارو على فشلهم في استغلالها<br />فالحين بس يحرقوا دمنا ربنا ينتقم من كل ظالم<br />لو قدر لي اني اتجوز اصلا - الا الحديد بقى بكام النهاردة - هخلف كل يوم عيل بالعند فيهم<br />جتهم نيلة"
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130142/http://masr.20at.com:80/newArticle.php?sid=16639"

[[comments]]
order = 5
subject = "الحملة ولادة"
author = "almalk"
text = "الناس دى مبتفهمش مبتشوفش ده دليل ان هما مش شيفين شغلهم كويس<br />ملهاش لازم الحملة لان الشعب يحسبة صح وبلاخص الشباب<br />الشاب مشلاقى يأكل يبق ازاى الواحد منهم هيفكلر يتجوز ويخلف<br />ده مثل<br />والله انا لو مكان الحكومة لأفر فلوس الحملة الشعب مش محتاج حملة<br />للان الحملة ولادة خلاص"
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130142/http://masr.20at.com:80/newArticle.php?sid=16639"

