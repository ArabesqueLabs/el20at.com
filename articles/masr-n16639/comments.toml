[[comments]]
order = 0
subject = "الحكومة فين والشعب فين - لا الشعب يشعر ان دى حكومتة ولا الحكومة تشعر بشعبها"
author = "من هنولولو"
text = "قلت ياولد اتفرج على القناة المصرية وخليك وطنى شوية وسيب الجزيرة والعربية والبى بى سى وغيرها<br />المذيعة المصرية فى البرنامج قاعدة بتتكلم عن تجهيز شنطة المصيف وطبعا يا مشاهدينا كلنا بنستعد نروح المصيف والناس كلها هتروح المصيف وهنعمل اية هناك ونهتم بشعرنا ازاى<br />ومن خلال البرنامج يخيل اليك ان جموع الشعب المصرى سوف تترك طوابير الخبز وامتحان الثانوية وتركب القطارات وتروح على المصايف<br />المذيعة دى بتخاطب مين<br />هل اغلبية الشعب كما فى ظن المذيعة بتروح المصايف<br />هناك انفصال فى التفكير وفى الاهداف بين الحكومة والاعلام وبقية الشعب<br />لما بيخطب اكبر مسئول فى البلد كم واحد بيسمعة<br />انا اعرف ان فية رؤساء لمصر لما كانوا بيخطبوا كانت الحركة فى الشارع المصرى بتقف والمقاهى بيتم حجز كراسيها علشان يتفرجوا على الخطاب فى التلفزيون<br />الحكومة تقول اللى هى عايزاة<br />والشعب عارف بيعمل اية<br />وابقى سلم لى على بتاع الوقفات والوثبات التعبوية والشعارات العنجهورية"
archived = "2008-07-07"
capture_url = "https://web.archive.org/web/20080707130510/http://masr.20at.com:80/newArticle.php?sid=16639"

[[comments]]
order = 1
subject = "النظام باين عليه أتعمي"
author = "hossam drwesh"
text = "النظام الحاكم في مصر واضح ان العمي أصابه,وكأنه مش واخد باله ان المصريين واقفيين أصلا في كل مكان,والا نسمي اه كل الطوابير اليي بنشوفهه في كل مكان ,احنا واقفيين في طوابير العيش,المترو,الاوتوبيس,المستشفيات,..............................الله يخرب بيتكوا حنقف فين تاني"
archived = "2008-07-07"
capture_url = "https://web.archive.org/web/20080707130510/http://masr.20at.com:80/newArticle.php?sid=16639"

[[comments]]
order = 2
subject = "ايوووة ع الزمن"
author = "محمد السيد"
text = "يا جدعان ... إنت بتتكلم جد ياعم؟<br />هي الإعلانات دي بتاعة كده؟<br />طب والله في الأول مفهمتهاش بتاعة إيه ... وبعد كده فهمت عن إيه ....<br />لكن تطلع في الآخر حملة وعاملها مبارك بيه ... يانهار أبيض يا جدعان ...<br />هي العالم دي مفيش حد بيخطط لها .. ولا الناس بيدبسوها وخلاص ولا إيه؟؟<br />الله يخرب بيت الدماغ اللي كده يا جدع ..."
archived = "2008-07-09"
capture_url = "https://web.archive.org/web/20080709003539/http://masr.20at.com:80/newArticle.php?sid=16639"

