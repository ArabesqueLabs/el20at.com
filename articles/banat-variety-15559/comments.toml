author = "من فلسطين"
posted = "2010-03-04"
text = "المهم بالموضوع مشاورة البنت وإلتماس الصدق معها وإظهار الإيجابيات والسلبيات دون غش أو غبن.<br />وذلك ما دامت البنت بالغة وعاقلة, فهذا لا يتنافى مع رغبات الانسان البشرية بل إن الاكراه في الزواج هو سر الفشل."
archived = "2010-03-05"
