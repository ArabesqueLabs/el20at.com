[[comments]]
order = 2
subject = ""
author = "ana"
posted = "2010-03-07"
text = "السلام عليك<br />موضوع مهم نوعاً ما....لكن اسمحوا لي بتعليق بسيط<br />اعتقد أنو في بينت بتنجيبر تتزوج واحد أد جيدها هاي الأيام أو حتى رجل هيه مو راضيه فيه..! يمكن القليل جداً وهاد الكلام كان زامان<br />خصوصاً الفلسطينية بعطو البنت حق الاختيار وزيادة عن اللزوم ومن شان هيك العنوسه كتيرت للبناتو لأنه البنت ما بعجيبها العجب هالأيام وأهلها سايبينها على راحتهاو وأنا بلاحظ هالشي<br />بعرف بنات كتيير في الأردن وفلسطين وحتى في أمريكا من العرب طبعاً وولا مرى سمعت وحدة فيهم أهلها بده يزوجوها غصب عنها لواحد كبير أو شو ما كان :<br />بتوقع لو البنت في سن ال17 أو 18 ووعايه وعارفه مصلحتها الأفضل أنها تتزوج بدل ما تنحرف خصوصاً في فلسطين وفي الأوضاع السيئة فيها بهذا الوقت...أسفة على الصراحة لكن هذا رأي لا غيرزززشكراً على الموضوع"
archived = "2010-03-14"
