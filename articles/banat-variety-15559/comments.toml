text = "طب ما بدل ما يعملوا حملات توعية عن مخاطر الزواج المبكر يعملوا أحسن حملات دعم للناس الغلابة اللى مش لاقية تاكل و المصايب نازلة على دماغهم من كل ناحية...و كلنا طبعا عارفين حالة غزة"
