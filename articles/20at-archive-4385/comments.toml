subject = "ليس كل مايلمع ذهبا كما ليس كل من حمل الجنسية انتمى"
author = "نورة"
posted = "2008-10-16"
text = "أشكر الكاتب على تصنيفة ولكن في كثير من الدول العربية نحكم على شعب كامل من السياح فقط وهذا يعتبر كارثة فلا يجوز الحكم على 25مليون نسمه سعودي من مليون سائح سعودي ففي السفر في رأيي الشخصي كل يمثل نفسة اذا أساء فالتصرفات لاترد الى البلد بل هي موروث عائلي كامل فلكل عائلة طريقتها في التربية كما لايمكننا الكم على شعبكم من الوافدين هذا مانحتاجة من مفهوم ففي كل بلد الصالح والطالح أنتم رأيتم المليون أو الاثنين ولكن لم تروا ال24المتبقين وكذلك اريد أن أصحح مفهوم أن العباية والحجاب فرض واجب في الدين الاسلامي في الكتاب والسنة والاجماع وهيئة الأمر بالمعروف والنهي عن المنكر مذكرة وليست كابتة للحرية وماقالته الأخت فيه نوع من قلة الوعي الديني والثقافي وهذا الرأي انما يمثلها وحدها عموما التنوع في التصرفات والأطباع في السعودية طبيعي جدا لاختلاف العادات والتقاليد تبعا للمناطق تبعا لتنوع الأعراق والأجناس فهنالك القبائل والحضر والبدو والوافدون ممن حملوا الجنسية قريبا أو قديما .<br />عموما أرجوا أن تقبلوا اعتذاري نيابة عن شعبنا السعودي كاملا مما قد يبدر من القلة التي تفد اليكم للسياحة واعلموا ان ماقديصدر منهم من خطأ لا يرضينا ولا يمثلنا وايقنوا تماما أن بلدنا فيه الملايين المحترمين والطيبين ولا أحد ينكر ذلك ولكن هل من مستكشف شكرا لاتاحة الفرصة للتعليق"
