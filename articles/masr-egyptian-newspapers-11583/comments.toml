text = "احنا في دوله المصالح والواسطه والمحسوبيه.بعدين انت زعلان ليه كده.برنامج الحزن الوطني فرص عمل جديده للشباب بس ايه شباب الحزن الوطني فقط.بعدين مش الوزرا دول صحاب سي جوجو يبقي ملناش احنا الشعب نتدخل.راجل بيجامل صحابه ليه نظلمه.عيب يا جماعه دي بلدهم وهما احرار فيها.علي سنه2011 هيسموها مملكه مبارك وابنه جمال واعوانهم. من الاخر قولوا جميعا (((علي مصر السلام))).............سيدابوحفيظه"
