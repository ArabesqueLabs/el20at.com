[[comments]]
order = 0
subject = "مطرب لكل مواطن"
author = "محتار"
posted = "2007-11-02"
text = "الفكر الجديد للحزب الوطنى هو تخريج مطرب لكل مواطن لدرجة ان كل يوم فية اسماء جديدة واصواتهم والعياذ باللة تسد النفس<br />وكمان تجنيد عسكرى امن مركزى لكل اسرة واستيراد الخيرازان لهم من سيريلانكا"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102120257/http://masr.20at.com:80/newArticle.php?sid=12239"

[[comments]]
order = 1
subject = "جيص الوطنى"
author = "ابوحة"
posted = "2007-11-02"
text = "يظهر ان جيص كبير قوى حزأ الراجل بتاع الزهايمر فقال تصريح عنتراوى جامد<br />انا ها اعمل نووى<br />وبكرة فى الازاعة هتطلع اغنية النووى والنووى<br />وانا اتهريت عن توشكى بتاع السبع افندى<br />ويظهر ان النووى من اثار الزهايمر"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102120257/http://masr.20at.com:80/newArticle.php?sid=12239"
