subject = "الى سامح حنين حول عيد ااقباط"
author = "مش ححبك"
posted = "2009-01-08"
text = "ما سموش عيد الاقباط يا سامح دا اسمه عيد المسيحيين<br />عيد ميلاد المسيح اللي الكاثوليج بيحتفلوا بيه يوم 25 سبتمبر والارتودكس 7 يناير<br />وبعدين الاقباط دول يا سامح المصريين القدماء<br />يعني قبطي دي كلمة عرقية زي عربي وزي فارسي وزي افريقي او امريكي او هندي<br />يعني كلمة قبطي لا علاقة لها بالديانة<br />القبطي ممكن يكون مسلم ممكن يكون مسيحي ممكن يكون يهودي ممكن يكون شيوعي<br />وبعدين قبطي تعني مصري قديما وطالما فيه مصري الان يبقى كلمة قبطي ما لهاش محل من الاعراب<br />زي ايران<br />اسمها زمان بلاد فارس<br />اسمها دلوقتي ايران<br />والايراني اسمه ايراني وكان زمان اسمه فارسي<br />ما ينفعش بقى جماعة في ايران يقولوا على نفسهم ان اسمهم الفرس<br />انتوا بقا يا عم سامح صادرتوا الكلمة لصالح المسيحية والقبطي هو المسيحي المصري لانه هو اصل البلد وصاحب البلد والمسلمين دول مش اقباط دول عرب غزاه<br />وكثيرا من المغالطات والسخافات التي تغص بها المواقع المسيحية المصرية وعلى راسهم الحيوان عدلي ابادير<br />وخلاصة الكلام يا سامح<br />القبطي دي جنسية او عرقية زي مصري وزي هندي وافريقي وزي امريكي لا علاقة لها بالدين<br />فارجو ان تبلغ الاخوة المسيحيين المصريين يبطلوا استهبال واستعباط<br />سلام يا سامح<br />وبالمناسبة المسيح اتولد يوم 25 ديسمبر ولا 7 يناير<br />بس احنا عندنا نحن المسلمين المسيح اتولد عندنا في الصيف<br />ليه يا سامح<br />لان ربنا قال وهزي اليك بجزع النخلة تساقط عليك رطبا جنيا<br />والرطب الجني دا يا سامح بيكون في اول شهر 8 اغسطس يعني"
archived = "2010-03-14"
capture_url = ""

