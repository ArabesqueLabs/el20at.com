text = "حقا اذا كنت تستطيع اخلااجى من (مصر)<br />فمبروك المليون دولار!<br />انا اقسم باللة العظيم انى لست امزح؟<br />اما عندما تقول لى اين و و كيف اللقاء؟<br />فالعملية موش صعبى<br />عندك مباحث (امن الدولة)بالاسكندرية و هم عارفين كل شيئى عنى من عنوان و تليفونات و تحركات؟!!!<br />و اهلا و سلم<br />كل سنة و انت طيب يا ابن و طنى الحر"
