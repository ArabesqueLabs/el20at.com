subject = "عيد الأقباط!"
author = "Ashour"
posted = "2009-01-08"
text = "\"عيد ميلاد\"ربنا يسوع..<br />بقلم: الدكتورة زينب عبد العزيز<br />أستاذة الحضارة الفرنسية<br />يمثل عيد ميلاد \" ربنا يسوع \" نوذج واضح المعالم متكامل الأركان ، من حيث أنه يجمع مختلف وسائل التحريف والتزوير والإستحواذ على العقائد السابقة .. مما يوضح كيفية قيام المؤسسة الكنسية بنسج عقائد المسيحية الحالية، التى لا يعرف عنها يسوع شيئا، وتبعد كل البعد عن الرسالة التى أتى بها كأحد أنبياء الله المرسلين، كما نطالعه فى الأناجيل، إذ يقول عيسى عليه الصلاة والسلام : \" أنا إنسان قد كلمكم بالحق الذى سمعه من الله \" (يوحنا 8 : 40)، وكما يقول معاصروه : \" يسوع الناصرى الذى كان إنساناً نبياً مقتدراً فى الفعل والقول أمام الله وجميع الشعب\" (لوقا 24 : 19).<br />وتتناقض الأناجيل فى مختلف مكونات عيد الميلاد من حيث المكان والسنة واليوم. ونبدأ بتحديد مكان مولده: فى بيت لحم بمنطقة اليهودية جنوباً أو فى الناصرة بمنطقة الجليل شمالا، إذ يقول متّى: \" ولما وُلد يسوع فى بيت لحم اليهودية فى أيام هيرودس..\" (2 : 1)، أما لوقا فيقول: \" فصعد يوسف أيضا من الجليل من مدينة الناصرة إلى اليهودية إلى مدينة داود التى تدعى بيت لحم لكونه من بيت داود وعشيرته\" (2: 4)، أى أنه إنتقل من الناصرة حيث وُلد إلى بيت لحم حيث يتم التعداد.. والمفروض ان يقول الكاتب الذى من الواضح أنه يجهل جغرافية بلده: أن يوسف \"نزل\" وليس \"صعد\"، فبيت لحم تقع جنوبا فى منطقة اليهودية !.. بينما يقول مرقس: \"وفى تلك الأيام جاء يسوع من ناصرة الجليل وإعتمد من يوحنا فى الأردن\" (1 : 9). وهنا لا بد من أن يتساءل القارىء: هل يمكن \"لإله\" أن يكون بحاجة إلى التعميد ؟ ومِن مَن ؟ من الذى يقول عن نفسه أنه ليس أهلا ان ينحنى ويحل سيور حذائه ؟! (مرقس 1 : 7).. وبالمناسبة: لم تكن هناك أيام يسوع \"أحذية\" وإنما كانت نعال تربط بالسيور..<br />كما يقول متّى أن يسوع وُلد قبل موت هيرودس الكبير، وهيرودس الكبير مات سنة 4 ق. م. (راجع متّى 2 : 1-20).. وجاء فى إنجيل لوقا أن يسوع قام بالدعوة فى عام 15 من حكم القيصر تيبريوس وكان فى الثلاثين من عمره، وتيبريوس حكم سنة 765 من تأسيس مدينة روما، أى ما معناه أن يسوع وُلد سنة 749 من تأسيس مدينة روما، أى أنه وُلد سنة 4 ق. م.<br />ولو أوجزنا تواريخ سنة ومكان ميلاد يسوع نرى أنه من الجليل وطنه (متّى 2: 23؛ 13 : 54-55) ومن اليهودية وطنه (يوحنا 4 : 43-44)؛ وولد أيام هيرود الملك (متّى 2 : 1) حوالى عام 6 ق. م.، وولد حينما كان كيرنيوس واليا على سوريا (لوقا 2 : 1-7) حوالى عام 7 ميلادية أى بعد أحد عشر عاما! أو بقول آخر: يسوع وفقا لإنجيل متّى كان فى الحادية عشر حينما وُلد يسوع وفقا لإنجيل لوقا فى نفس الظروف والملابسات..<br />والإنجيل وفقا للوقا وحده هو الذى يصف مولد يسوع بشىء من التفصيل، أما الإنجيل وفقا لمتّى فيشير إليه بأن كتب شجرة عائلة يسوع، بينما كل من مرقس ويوحنا فيهملان بداية نشأته. وهنا تجب الإشارة إلى أن كتابة شجرة عائلة ل \"ربنا يسوع\"، كما جعلته المؤسسة الكنسية، يتنافى مع فكرة ربوبيته..<br />لذلك \" أوضح البحث التحليلى والتاريخى أنه يجب إعتبار مولد يسوع فى بلدة بيت لحم كعنصر من عناصر قصة كونتها المسيحية الأولى من الناحية الأدبية \"، على حد قول كلاوس بايبرشتاين (K. Biberstein) فى كتابه \"الأزمنة الأولى للكنيسة\" (2002). ولذلك أيضا يقول القس السابق إرنست رينان (E. Renan) فى كتابه عن \"حياة يسوع\" (1863): \" أن يسوع وُلد فى الناصرة، وهى بلدة صغيرة بالجليل، ولم يكن لها أى شهرة من قبله، وطوال حياته عُرف يسوع بالناصرى، ولم يفلحوا فى جعله يولد فى بيت لحم إلا بالتحايل المحرج\"، والإحراج هنا ناجم عن ان يسوع لا يمكن أن يولد فى وقت واحد أيام هيرود وأيام إحصاء التعداد والفرق بين الحدثين أحد عشر عاما، ولا يمكن ان يولد فى بلدة لم تكن موجودة فى عهده، فما تقوله الوثائق وكتب التاريخ أن الصليبيين هم الذين بنوها!..<br />ويقول شارل جينيوبير (Ch. Guignebert) : \"رغم تكرار فكرة أن يسوع من الناصرة، فى عشرات الآيات، فما من نص قديم، سواء أكان وثنيا أو يهوديا، يذكر مدينة الناصرة (راجع : \"يسوع\" صفحة79)... ثم يتناول تفسير ما نلخصه بأن هناك عملية تحريف وتلاعب بين كلمة النذير (Nazoréen)، أى الذى نذره أهله او نذر نفسه للسلك الكهنوتى، وهى الموجودة فى النصوص القديمة، وبين كلمة \"الناصرى\" (Nazaréen) ، نسبةً إلى مدينة الناصرة التى تم إختيارها، إذ كيف يمكن لإله أن يُنذر نفسه لسلك الكهنوت ؟!.<br />أما عن يوم ميلاد يسوع فما من نص مسيحى واحد يحدده ، وما يُفهم من الأناجيل أنه وُلد فى بداية فصل الخريف أو الربيع مجازا، حيث أن الرعاة كانوا يباتون فى العراء \"يحرسون حراسات الليل على رعيّتهم\" (لوقا 2 : 8) ، وليس فى ديسمبر تحديداً نظرا لإستحالة ذلك فى جو قارس البرودة أوالثلوج المتساقطة .. كما أن عيد الميلاد المحدد بيوم 25 ديسمير لم يكن من الأعياد المسيحية الأولى ولا يرد إسمه فى قوائم الأعياد التى نشرها كل من إيرينى أو ترتوليان (راجع موسوعه أونيفرساليس الفرنسية Universalis والموسوعة الكاثوليكية الأمريكية). ونطالع فى الموسوعة الفرنسية تحديدا : \" أن عيد الميلاد لا يمثل عيد مولد يسوع بمعنى الكلمة لأن تاريخ مولده مجهول\" (ط 1968 ج19 صفحة 1360) ..<br />وتؤكد مارتين برّو (M.Perrot) الباحثة بمعهد البحوث القومى فى باريس فى كتاب حول \"أصول عيد الميلاد\" (2000): \"أن الكنيسة قد أقامت عيد الميلاد على إحتفال وثنى وفى مكانه، واستعانت بكثير من التفاصيل الوثنية كالشجرة، والكعكة على شكل حطبة، ونبات الدبق، والهداية، إلخ \"... أى أن المؤسسة الكنسية استحوذت على عيد وثنى وقامت بتنصيره لترسيخ عقائدها بين الشعوب التى تقوم بتنصيرها!.<br />وقد تم تحديد تاريخ 25 ديسمبر لعيد ميلاد يسوع فى منتصف القرن الرابع. وقبل ربطه بذلك اليوم، فكروا فى تثبيته فى عدة تواريخ منها 6 يناير الذى كان يرمز لعيد تعميده بينما كان يوم أول يناير يرمز لعيد ختانه الذى ألغته الكنيسة لتضع مكانه عيد \"القديسة مريم أم الله \" !. لكنهم استقروا على يوم 25 لأنه كان يمثل الإحتفال بعيد الشمس التى لا تقهر (Sol Invectus)، وعيد الميلاد الخاص بالإله ميثرا الشديد الإنتشار آنذاك بين الشعب والجيش الرومانى خاصة بعد أن قام الإمبراطور أورليان (270-275) بإعلانه \"الإله الحامى الأساسى للإمبراطورية\" وجعل من 25 ديسمبر، صبيحة مدار الشتاء، عيدا رسميا.<br />وكان الإمبراطور قسطنطين الأول، الذى سمح للمسيحيين بممارسة عقيدتهم، من أتباع هذا الإله وله أيقونات وعملات تمثله مؤلها ورأسه محاط بآشعة الشمس، إذ لم يتم تعميده وفقا للعقيدة المسيحية إلا وهو على فراش الموت وعلى مذهب الأريوسية الرافض لتأليه يسوع.<br />وبناء على توصيات القديس أغسطين، كان على الذين تم تنصيرهم حديثا، فى الإمبراطورية الرومانية، ألا يعبدوا الشمس فى ذلك اليوم وإنما \"ربنا يسوع\". وبذلك تم فرضه حتى يسهل على الذين تم تنصيرهم حديثا أن يحتفلوا به بعد أن أدخله البابا ليبريوس سنة 354 م فى روما، وهو الذى حدد الإحتفالات الأولى لإمتصاص الإحتفالات الوثنية.<br />وتعد هذه المعلومة من الحقائق الأبجدية المسلّم بها فى الغرب، فعندما سألوا البابا السابق يوحنا بولس الثانى، يوم 22 ديسمبر1993، عن رأيه فى هذا الخلط والإستحواذ التاريخى، أقره قائلا: \" أيام الوثنيين القدامى كانوا يحتفلون بعيد الشمس التى لا تقهر، والطبيعى بالنسبة للمسيحيين أن يستبدلوا هذا العيد لإقامة عيد الشمس الوحيدة الحقيقية وهى: يسوع المسيح\"!. ومثل هذه \"الحقائق\" والآلاف غيرها هى التى كانت قد جعلت البابا بيوس الثانى عشر يقول فى احد المؤتمرات التاريخية الدولية عام 1955 ما سبق وقاله من قبل: \"بالنسبة للكاثوليك، ان مسألة وجود يسوع ترجع إلى الإيمان أكثر منها للعلم \" !!<br />ومن الغريب ان نرى البابا بنديكت 16 يواصل عملية ترسيخ هذه الفريات.. ففى يوم 21 ديسمبر 2008 راح يؤكد فى خطابه الأسبوعى، من نافذته بالفاتيكان، ليربط مولد يسوع المسيح بمدار الشتاء وتوضيح اهمية معنى مولده فى الخامس والعشرين من ديسمبر!!.<br />وتتوالى المفاجآت عبر السنين لتتبلور فى معطيات تمس بالعقائد وكيفية نسجها، ومنها الخطأ الذى وقع فيه القس دنيس القصير (Denys le Petit)، المتوفى عام 545، والذى عدّل التقويم الميلادى إبتداء من مولد يسوع، ولم يدرك انه بجعل ميلاد يسوع فى ديسمبر 753 من تأسيس روما يتناقض مع تواريخ هيرودس الأكبر المتوفى سنة 750، كما فاته إحتساب عام صفر بين التقويمين، فأول عام ميلادى يُحتسب عدداً من العام التالى لميلاد يسوع! والطريف أن جميع المؤرخين والتقويميين فى الغرب يعرفون ذلك وما من أحد يجرؤ على المطالبة بالتعديل لعدم إضافة مزيد من الأدلة على عمليات التحريف..<br />وفى عام 2001 صدر كتاب الباحثة أوديل ريكو (Odile Ricoux) الذى تقدمت به كرسالة دكتوراه فى جامعة فالنسيان، شمال فرنسا، تحت عنوان \" يسوع وُلد فى شهر يوليو\"! وقد اقامت الكاتبة بحثها على العديد من الدراسات التى سبقتها إعتماداً على ذلك التيار الجديد، لذى يربط علم الفلك بالعلوم الإنسانية، الدائرة خاصة فى جامعة ستراسبور بفرنسا. وقد إعتمدت على ضوء الشِّعْرَى اليمانية وعلى مكانتها فى الديانة المصرية القديمة وعلى كل ما انتقل منها إستحواذاً أو تحريفاً إلى العقائد المسيحية..<br />وفى 9/12/2008 نشرت جريدة \"تلجراف\" البريطانية موضوعا تحت عنوان: علماء الفلك يعلنون: \"يسوع وُلد فى يونيو\"! ففى أبحاثهم الفلكية إستطاعوا إستعادة تكوين شكل السماء والنجوم يومياً نزولا لبضعة آلاف من السنين، وببحثهم فى صور السماء منذ الفى عام وجدوا أن هناك نجم سطع فوق سماء بيت لحم فى 17/6 وليس فى 25/12، وان ذلك النجم الساطع كان إلتقاء واضح لكوكبى الزهراء والمشترى اللذين كانا قريبين من بعضهما فى يونيو سنة 2 ق م لدرجة يبدوان فيها نجما واحدا.<br />ويقول ديف رينيكى (Dave Reneke) عالم الفلك الأسترالى والمحاضر الأساسى فى مرصد ميناء ماكوارى: \" لا نقول أن هذه هى النجمة الدالة على عيد الميلاد يقينا، لكنها أقوى تفسير علمى يمكن تقديمه\" ثم أضاف قائلا: \"ان شهر ديسمبر هو شهر إفتراضى تقبلناه جدلا لكنه لا يعنى انه يشير الى تاريخ الميلاد حقا \"..<br />وسواء أكانت الأبحاث تدور فى مجال علم مقارنة الأديان، أو ربط علم الفلك بالعلوم الإنسانية، أو الأبحاث الفلكية البحتة، أو حتى إعادة النظر فى النصوص التى هُريت بحثا، فإن كل الأبحاث العلمية الحديثة تشير إلى بطلان حدوث عيد الميلاد فى شهر ديسمبر وتؤكد أن يسوع وُلد فى الصيف، وهو ما قاله القرآن الكريم منذ أكثر من الف وأربعمائة عام حين قال بوضوح:<br />\" وهزّى إليك بجذع النخلة تساقط عليكِ رطبا جنيا \"، (25/ مريم).<br />والمعروف أن الرطب والبلح والتمر بكافة أنواعه لا يوجد إلا فى فصل الصيف!. وصدق ربى، رب العزة سبحانه عما يُشركون ..<br />2/1/2009"
