[[comments]]
order = 3
subject = "والتي تبدأ من 30 جنيها إلى 100 جنيه فهي تلقى إقبال"
author = "مش عبدالله الطحاوي"
posted = "2008-11-26"
text = "ما هي الطبقة اللي بتشتري الحجات دي طبقة الحرامية اللي عايشه على دم الشعب وما بتتعبش في الفلوس<br />بيشترواعلبة المكياج للاطفال بميت جنيه<br />والناس الغلابة حديثهم بيقولوا فيه ايه<br />الطبخة بتتكلم 100 جنيه الان 40 جنيه كيلو لحمه و60 جنيه بقية الطبخة ويا دوب تكفي يومين<br />اما السفلة والمجرمين اللي بياكلو مال الشعب مش اشكال لما يشتروا علبة مكياج للاطفال بتمن طبخة للطبقة الكادحة<br />سلام يا مروى وما تنسيش تحقيق شارينان وحكايتها مع نقابة المحامين وتحقيق عادل امام وحكايته مع المرض بتاع عينه"
archived = "2010-03-14"
capture_url = ""
