order = 0
subject = "تشوية وجوة اطفال البراءة"
author = "سوسو"
posted = "2008-11-25"
text = "مكياج لطفلة يعنى اية<br />تشوية لوجة الطفل وتضييع البراءة من ملامحة<br />انتم بتشوفوا الست ليفنى وزيرة خارجية اسرائيل بتظهر ازاى فى التليفزيون - مفيش مكياج بتغسل وشها وتسرح شعرها وتجرى على اجتماع الوزارة بلا مكياج ولا بودرة ولا اى لاينر<br />بدل ما نعلم البنات يبقوا عمليين وبنعلمهم التزويق والتجميل والخداع وتبقى عروسة مولد وبعدين لما تكبر واحد يتحرش بيها"
