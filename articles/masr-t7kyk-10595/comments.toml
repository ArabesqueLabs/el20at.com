[[comments]]
order = 2
subject = "بدايه الانحراف"
author = "مزمز"
posted = "2008-11-25"
text = "بنعلم البنات من صغرهم ازاى تتجمل لاعجاب الناس وبعدين نسئل وهو ليه فى تحرش ومش بنعلمهم يفكروا فى تحقيق الخطط الموضعه للوصول لهدفهم وبعدين نقول التعليم ضاع من ايه وتاخر البلد من ايه"
