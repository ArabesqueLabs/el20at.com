text = "انالمغرضين الذين لا يرون ان الأعمال الخيريه تخرج للمجتمع من تعاون الأفراد بمختلف فئاته يريدون ان يعم الفساد فى الأرض وان اى مصلحه لأفراد المجتمع من تنوير عقول الشباب او عقول من اوقعهم الشيطان واصدقاء السوء فى شرك الأدمان تسبب قلق وازعاج للفاسدين وتعوق عملهم لأنهم اصدقاء الشيطان وانا احييى الأستاذ / عمرو خالد و الفنان / شعبان عبد الرحيم لأنهم تعاونا للمصلحه العامه فبها صلاح الناس وكذلك ارضاء الله0"
