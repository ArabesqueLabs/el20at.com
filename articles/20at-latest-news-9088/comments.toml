[[comments]]
order = 0
subject = "أزرعوا الأمل تنصروا"
author = "محمد عبد المقصود"
posted = "2008-05-17"
text = "إن الاعلامي صاحب الرسالة عليه أن بفقه أن مهمته الاساسية : غرث الأمل ودعم الثقة في أبناء هذه الأمة الأبية الفتية ,<br />لأن كلاب الاعلام الغربي كلهم تضافرت جهودهم لتحقيق خطط سادتهم في بث روح الانهزامية وتكريث التشرزم لتظل الأمة تدور في فلكهم , ولكن هذا لايمكن أن يستمر إذ هي حقبة مؤقتة وسبق أن مر بالأمة ما هو أعنف من ذلك ولكنها قامت من كبوتها وأنهت عدوها بل استوعبته وحولته لدينها , وأقرأوا التاريخ ياشباب فأين التتار لقد اسلموا وأين الترك العثمانيون لقد أسلموا بل أن نهاية الحملة الصليبية الفرنسية بقيادة نابليون أنتهت باسلام قائده مينا فأقرأوا التاريخ وعو الدرس وثقوا في أمتكم فقط دوركم أحيوا الايمان والثقة بالله في الأمة وكونوا نورا يسري في جسدها بكتاب الله وعودوا إلى مصدر قوتكم ونصركم ينصر الله دينكم وأمتكم (( إن تنصروا الله ينصركم ويثبت أقدامكم )) (( وما النصر إلا من عند الله ))"
