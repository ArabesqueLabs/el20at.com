subject = "بل نهايتها أقرب"
author = "محمد عبد المقصود"
posted = "2008-05-17"
text = "النكبة أشد فعلا ولكن على المستوى الرسمي أما على المستوى الشعبي فالشعوب واعية وتترقب لقتناص الفرصة ثم الانقضاض على الفريسة ولكنها فقط تنتظر الفارس الذي يلم شعثها ويضمد جراحها ويوحد صفها ويحي الايمان في قلوب ابنائها ثم ينطلق ولا تسريب ! فقط تحرك قظز في أحد عشر شهرا بهذه الموقومات التي على رأسها نشر العدل ورفع الظلم فدحر التتاز إلى غير رجعة رغم التهامهم الأخضر واليابس ورغم ما فعلوه في بغداد وما قبلها وهو مملوكي نعم ولكنه مسلم أولا , ويسبقه إلى ذلك صلاح الدين الأيوبي الذي تربى على يد نور الدين زنكي فاستعاد القدس بعد أن احتلها الصليبيون العنصريون لأكثر من تسعين عاما , ودورات التاريخ تكرر نفسها كما قال الاستاذ المسيري لذا فإن نهاية اسرائيل حتما قريبة قريبة ولكن يؤخر نهايتها فقط تمترس الأذناب خلفهافمتى تقطع ."
