order = 1
subject = "بل نهايتها أقرب"
author = "محمد عبد المقصود"
posted = "2008-05-17"
text = "النكبة أشد فعلا ولكن على المستوى الرسمي أما على المستوى الشعبي فالشعوب واعية وتترقب لاقتناص الفرصة ثم الانقضاض على الفريسة ولكنها فقط تنتظر الفارس الذي يلم شعثها ويضمد جراحها ويوحد صفها ويحي الايمان في قلوب ابنائها ثم ينطلق ولا تسريب فقط تحرك قظز في أحد عشر شهر بهذه الموقومات التي على رأسها نشر العل ورفع الظلم فدحر التتاز إلى غير رجعة رغم التهامهم الأخضر واليابس ورغم ما فعلوه في بغداد وما قبلها وهو مملوكي نعم ولكنه مسلم أولا ويسبقه إلى ذلك صلاح الدين الأيوبي الذي تربى على يد نور الين زنكي فأعاد القدس بعد أن احتاها الصليبيون العنصريون لأكثر من تسعين عاما ودورات التاريخ تكرر نفسها ولكن كما قال الاستاذ المسيري لذا فإن نهاية اسرائيل حتما قريبة قريبة ولكن ي}خرها فقط تمترس الأذناب خلفها ."
archived = "2010-03-14"
