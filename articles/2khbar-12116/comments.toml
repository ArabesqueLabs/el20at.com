text = "قلوبنا انشطرت معك يا مبارك :D<br />للفقيد الرحمة و للجميع الصبر و السلوان<br />تقبلة اللة ملاكا فى جنات النعيم<br />اللة معك يا مبارك و الهمكم الصبر و السلوان و لا راد لقضاء اللة<br />اقباط مصر مسلمين و مسحيين معك و تصلى لاجل الحفيد العزيز<br />تقبلة اللة مقاما محمودا<br />عزاؤ السماء يقوى ايمانك يا مبارك"
