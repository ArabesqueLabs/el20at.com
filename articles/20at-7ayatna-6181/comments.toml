text = "على فكره انا شاب عمرى 21 سنه بس بموت فى افلام الكرتون وفاكر الفيلم ده لحظه بلحظه دورى فعلا مذهله<br />بس فعلا بابا نيمو الى هو اسمه مرهف كان دوره فى الفيلم جامد جدا هو وجاك السمكه الى وقعت فى مشاكل مع نيمو العقل المدبر فى حوض السمك عند الدكتور بتاع السنان وطبعا نيمو السمكه البهلوان الى عنده زعنفه اكبلا من التانيه<br />سلام يا زوق"
