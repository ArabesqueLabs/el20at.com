subject = "هكذا يجب ان نكون"
author = "ساره"
posted = "2007-06-05"
text = "الموضوع حلو جدا وعجبني اوي طريقه عرض افكار عند طريق كرتون يوصل لقلب اي حد بس للاسف مش كتير اللي بيحاول يفهم ويتعلم من الهدف اللي بتقدمه القصه وعايزه كمان اشكر المودنه علي انها ببساطه وسلاسه استخرجت معاني مهمه من قصه غاية في الجمال ببساطتها انا عن نفسي بحب افلام الكرتون اوي بتشد ليها يمكن علشان اللي المفروض الاطفال يتعملوه انا مش لاقيها في الكبار اللي المفروض متعلمينه اصلا واسمحولي اشكر كل واحد بيشتغل في السايت دا علي مجهوداتهم الجميله في عرض كل القضايا بطريقه حضارية اديبة ايضا ...شكرا"
