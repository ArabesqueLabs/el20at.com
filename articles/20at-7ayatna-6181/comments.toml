author = "نيفين نيفى نوفا"
posted = "2007-06-14"
text = "مين فينا متاثرش بشخصيه كرتون و حبها اوى<br />مين مبيحبش مغامره بعينها من مغامرات توم ان جيرى<br />مين مبيستناش بكار كل سنه ف رمضان<br />حبنا ككبار لمثل هذه الاعمال حتى الان دليل حى على وجود الطفل داخل كل منا<br />انا عن نفسى يا جماعه بحب جدا فيلم monsters خصوصا النسخه المدبلجه اللى بصوت هنيدى ىو حنان ترك<br />و نيمو كمان فيلم لذيذ<br />و بالنسبه للمدونه الاسلوب بسيط و سلس و فكره تضمين المقال للافكار الخاصه بيكى من خلال شخصيه كرتونيه محبوبه جديد و جميل"
