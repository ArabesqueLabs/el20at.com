subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-06-17"
text = "معليش شباب ,, بس ابغى اكون واقعي معاكم هنا ,,<br />يعني انتو السعوديين من دون كل العالم الي ماعندكم اختلاط في الجنسييييين أبداً ,,<br />وثانياً الكحول ,, حتى البسيط منها ممنوع عندكم<br />شباب مساكين متحاصرين في البيوت والله يعيييينكم<br />وربي حرام شوفولكم صرفه<br />أنا حاسس انه كل العلم بيدخل النار الا السعودين"
