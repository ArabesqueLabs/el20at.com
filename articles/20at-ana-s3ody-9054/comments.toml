[[comments]]
order = 3
subject = "قال تعالى( ومن أعرض عن ذكري فإن له معيشة ضنكا)"
author = "محمد بامشموس"
posted = "2008-05-15"
text = "ولنسمي الموضوع ياشيخ علي (الفراغ الروحي) وسأنظر للموضوع من هذه الزاويةإذا سمحتلي:<br />الإنسان في هذة الحياه لابد أن يعرف أنه خلق لمهمتين أساسيتين وهي<br />أولا: العبادة(وماخلقت الجن والإنس((((( إلا ليعبدون))))))) وليسأل نفسه السؤال لماذا خلقت على ظهر الحياة؟ ويدع قلبه الذي يجاوبه... ثانيا:الخلافة(إني جاعل في الأرض خليفة) بمعنى أن الله قد أستخلفك فيها بما أمرك به واجتناب مانهاك عنه<br />فإذا بنى الانسان حياته على هذين الأمرين العظيمين لن يشعر بالطفش أوالملل لأنه صاحب مهمه في هذا الوجود<br />وأختم بمقوله لأحد الصالحين يقول فيها(كل ماأسكنته قلبك تولاك ...فأنظر مأسكنت فيه)"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "لماذا القتل العمد"
author = "أبو سلمان"
posted = "2008-05-16"
text = "قد نسمى هذه المصطلحات او هذا المصطلح بالسم القاتل لروح الشباب فهي مصطلحات تلغى معنى الرجولة من حياة الشباب فشباب كالنبات له عمر محدود وبعده يفقد هذه القوة واذا اتت مرحلة الضعف فكأنه عاش حياة الضعف من شبابه الى شخوخته وأفضل حل للتخلص من هذه المصطلحات لزوم الذكر ولزوم قول ( اللهم إني أعوذ بك من الهمم والحزن والعجز والكسل وأعود بك اللهم من الجبن والبخل وأعوذ بك من غلبة الدين وقهر الرجال ) ونتذكر قوله تعالى( ومن أعرض عن ذكري فإن له معيشة ضنكا)"
archived = "2010-03-14"
