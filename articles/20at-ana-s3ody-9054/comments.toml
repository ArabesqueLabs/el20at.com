text = "طفشان, زهقان, ضيق وملل وغثى ومرض ..كلها مسميات على لسان الشباب من حولنا.<br />وجيت على الجرح يابو الحسن ..والحل باختصار بالتصالح مع رب الارض والسماء والانشغال بما يفيدك من المباحات وما يعود عليك من الخير في الدنيا والاخرهـ (عمل ومنتديات ورياضه وطلعات ودراسة ..الخ)<br />تحاياي ..جميلة الكلمة دي وتقبلها مني ;-)"
