[[comments]]
order = 1
subject = "رايك انت حر فيه"
author = "محمد الانصاري"
posted = "2007-07-02"
text = "لو ده رايك في افكار الاخوان او في الفكرة الاسلامية من وجهة نظر الاخوان فده من هقك ولكن انا عايز اسالك باي حق يتم القبض على الطلاب دول يا ترى انتى عارف حالة اهليهم دلوقتى ايه يا تارى عارف ايه اللى بيحصل في الشباب دول لما بيتعرضوا على ضباط امن الدولة صدقينى لو تعرفي هتتمنى ان لا انتي ولا اي مواطن مصري يحصله كده نتيجة انه بيعبر عن رائيه حتى لو انتي مختلف معاه"
