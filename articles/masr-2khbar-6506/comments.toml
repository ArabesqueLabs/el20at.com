[[comments]]
order = 0
subject = "اللهم خلصنا وولع فى كل الاخوان المسلمين"
author = "مصريه"
posted = "2007-07-01"
text = "فعلا انا بتمنى من كل قلبى ان ربنا يخلصنا من جماعة الاخوان المسلمين وربنا يرحم شباب مصر منهم<br />لانهم فعلا زى الوباء لما يدخل على جسم الانسان يدمرة وهما كده برضه لما يوسوسه فى مخ حد يضيعوه ويدمروه<br />بسبب الافكار المتخلفة بتاعتهم دى اللى بينسبوها للاسلام والاسلام اطهر من اللى بيقولوه وبرىء منهم<br />على فكره انا مسلمه ومصريه كمان وبتمنى من ربنا انه يخلصنا من امثالهم"
