[[comments]]
order = 2
subject = "للاسف"
author = "زيرو"
posted = "2007-07-02"
text = "للاسف الشديد لا زلنا نحن المصريين نتكلم من دون ما نعرف احنا بنتكلم عن ايه اللى بيدعى الاخوان ده اتحداكوم ان كان يرف عنهم مش هقول حاجه حلوه لا يعرف عنهم اى حاجه واقصد بحاجه حاجه ذات قيمه مش كلام جرايد على شويه كلام سمعه فى المترو على حبه كلام من التلفزيون الناس كلها بتغلط محدش قال حاجه بس الواحد لازم يبقى عنده عدل اكتر فى الكلام على الغير وقبل ما يتكلم يبقى عارف هوة بيتكلم عن ايه ولا هو النت خلاص الناس كلها بتعرف تفتح عشرينات ويكتبوا اى كلام وطحينه.<br />وبعدين فى حاجه هما الاخوان دول ولا غيرهم مش مسلمين برضه ونفسهم ومنى عينهم ان البلد دى تكون هى وكل بلاد المسلمين احسن البلاد طيب ينفع اجى انا بعد كل ده واقول ربنا يولع فيهم ؟؟!!!!!<br />ملحوظه انا مش اخوان ومش متفق معاهم فى حاجات كتيييير بس اختلاف عن اختلاف يفرق وصلت :-)"
archived = "2010-03-14"
capture_url = ""
