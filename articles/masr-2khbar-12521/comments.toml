text = "مفيش احد بيناقش فى البطالة<br />ولا احد بيناقش فى انهيار الاقتصاد<br />ولا احد بيناقش فى ازمة الاسكان<br />ولا احد بيناقش فى انهيار التعليم<br />احنا بس كل انجازاتنا القبض على اعضاء الاخوان ثم الافراج عنهم للمرة المليون بملل كامل<br />وكل مشاغلنا فتح وحماس ووفود رايحة ووفود جاية وعمرهم ما يصطلحوا<br />وكل مشاغلنا العسكرى شاليط وازاى نفرج عنة وكانة قضية امن قومى بينما الاطباء المصريين فى السعودية بينضربوا بالجزم وبيجلدوا كل اسبوع مرة<br />زهقنا<br />ملينا<br />قرفنا من الاعتقالات والافراجات وكانهم بيدخلوهم سينما من 6 الى 9 ويروحوهم من من 9 الى 12"
