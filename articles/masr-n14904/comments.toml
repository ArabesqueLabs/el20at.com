[[comments]]
order = 1
subject = "ومازالت حكومتنا الغبية التافهة الامن رحم اللة تتعا"
author = "الدكتورفتحى مسرور وصاحبة صفوت"
posted = "2008-03-29"
text = "لن تستشق مصر هواءالحرية والديمقراطية مادام الاخوان يطلق عليهم جزافا جماعة محظورة يعنى مش عارف لية محظورة هما دول ابة بلطجية وحرامية وخريجين سجون بجرائم تمس الشعب المصرى من قريب اوبعيد اوباعوا اسرار البلد وباعواالبلد باراضيها وشواطئها واللى تحت الارض من بترول وغاز اتباع لاحب حبايبنا وجيراننا الاسرائيليين -يعنى اسالكم باللة يامؤيدين اومعارضين للجماعة هل هذة النخب من حملة الشهادات العليا فى جميع تخصصات الحياة من طب وهندسة ومحاماة وغيرة وغيرة الكتير الذى يعجز اللسان عن ذكرها مجتمعة ويشهد لهم تاريخهم العلمى والعملى وكذلك ناخبيهم ومريديهم انهم خير من يمثلهم امام السلطة الحاكمة لتحقيق ولو جزء بسيط من طلباتهم واحلامهم كابنى ادميين عايزين يعيشوا فى بلدهم بطمائنينة - اما من يدعى ان الجماعة تريد قلب الحكم او الاستيلاء بالقوة او اللجوء الى العنف فدى كلام كذب وافتراء الجماعة واللة اعلم تريد انتخابات حرة وفرص متساوية فى الانتخابات على الرغم من التعسف الواضح من الحكومة ومناصريها لاقصى حد عند اقتراب اى انتخابات تمتلى السجون والمعتقلات بمناصرى الاخوان للترهيب وافساد برنامج اى مرشح بالمهد - عصور الظلام اللى احنا عايشينها دلوقتى ماعداش على مصر فى تاريخها الحديث اسواء من كدة زمن"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174914/http://masr.20at.com:80/newArticle.php?sid=14904"
