[[comments]]
order = 6
subject = "الحاج بوش"
author = "كداب زفة"
posted = "2008-01-18"
text = "الحاج بوش قعد مع الحاج ابوجمال ساعة زمن على ما الطيارة ملات بنزين وقال عواف عليك مش فاضى لك ولفقرك وكفاية عليك ساعة - انما قعد فى دبى يومين لانهم لهم قيمتهم وانت شحات بتعيط لما نخصم من المعونة 100 مليون مع ان عز عندك يملك 60 مليار<br />ويظهر ان الحاج بوش استغنى عن خدمات الحاج ابو جمال واعطاة استمارة 6 بتاع انهاء الخدمة<br />ويمكن يعطى المخابرات المركزية ضوء اخضر بانهم يخلصوا من الجثة زى السادات تماما لما انتهى دورة معاهم<br />والمفروض ان الحاج ابو جمال يحرص وياخد بالة من غدر الامريكان لا يكرروا ما عملوة مع الشاة ومع صدام وكانوا برضة من رجالتهم<br />المهم الايام اللى جاية شكلها كدة منيل<br />والبرلمان الاروبى النهاردة لوى بوزة لمصر علشان ايمن نور<br />وفيها اية لما الحكومة يبطل المحاكمات العسكرية وتخرج ايمن نور والواد العادلى دة يتلم شوية بدل ما يهيج اروبا علينا وعلى حقوق الانسان<br />انما الغباء واخد حقة مع الحكومة"
archived = "2008-01-20"
capture_url = "https://web.archive.org/web/20080120034351/http://masr.20at.com:80/newArticle.php?sid=13881"

[[comments]]
order = 7
subject = "الاخبار فى الجرايد بتقول اننا رحنا فى ستين داهية"
author = "قارىء صحف"
posted = "2008-01-19"
text = "نائب فى مجلس الشعب بيقول - ان سيادة الريس كان معجب ببنت مغنية اسمها امال ماهر واوصى سعادتة انهم ياخدوا بالهم منها - فقام الحبيب انس الفقى وصرف عليها ما مجموعة 20 مليون جنية بشراء فساتين وعمل البومات ومصاريف مكياج وخلافة - 20 مليون من الضرائب كانوا يوفروا الخبز لمليون مصرى لمدة شهر<br />- اخونا الملط فى المجلس الموقر سيد قرارة بيقول ان مديونية الحكومة تخطت الخطوط الحمر والزرق وانها اقترضت محليا 799 مليار جنية - وعلمى ان الحكومة لم تبنى مصانع ولا مزارع ولا مساكن شعبية - يبقى الفلوس دى راحت فين - مين اللى لهفها او لهطها وهرب برة<br />- الشعب فى طنطا خرج فى مظاهرة بيقول<br />غلوا السكر وغلوا الزيت لما بعنا البيت<br />تبقى دى حكومة اية<br />حكومة هات الزجاجة وتعالى لاعبنى<br />خللى الكبير قاعد فى الشرم"
archived = "2008-01-20"
capture_url = "https://web.archive.org/web/20080120034351/http://masr.20at.com:80/newArticle.php?sid=13881"

