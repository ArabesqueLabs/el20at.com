subject = "السادات خاف وكان حيهرب"
author = "خالدالامير"
posted = "2008-01-18"
text = "يوم 18/19 السادات كان بره في اسوان ولم علم كان حيهرب علي السودان ولو الجيش لكان في خبر كان واما الدعاء فهو احدي الوسائل وفعلا ده من ذنوب العباد لكن ربنا قال الساكت عن الحق شيطان اخرس ولازم نتكلم ونقوم وننتفض زي ما الي قبلينا عملوا وهم حيخافوا ومش احنا الي حنخاف"
archived = "2008-01-20"
