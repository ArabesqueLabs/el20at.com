order = 0
subject = "الحل ان يأخذهم الطاعون او الكوليرا"
author = "صا صا"
posted = "2008-01-18"
text = "زى زمن المماليك تمام - الشعب يطلع يدعى ويقول يا عزيز يا عزيز داهية تا خد الانجليز - او داهية تاخد الفرنسيس<br />او يدعوا زى اجدادهم<br />ايش تاخد من تفليسى يا برديسى<br />انما بقى دلوقتى نحضر دعاء على احمد عز - بتاع لجنة السياسات<br />او ندعوا على حزب الفقر الوطنى<br />ندعوا ان ربنا يبعت لهم الكلويرا او الطاعون<br />لكن هتدعوا على اية<br />ما خلاص خربت خربت<br />واللة خربت"
archived = "2008-01-20"
capture_url = "https://web.archive.org/web/20080120034351/http://masr.20at.com:80/newArticle.php?sid=13881"

