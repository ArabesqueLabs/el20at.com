text = "وكالات الانباء اطلقت على احداث يناير بانها انتفاضة شعبية<br />رد عليهم السادات وقال لا انتفاضة الحرامية<br />يظهر يا جماعة ان 18 و19 يناير حيبقى عيد عند المصريين كل سنه حيتذكروه"
