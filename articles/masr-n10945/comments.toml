[[comments]]
order = 0
subject = "من الإخوان للتجمع !! واسعة قوى الصراحة"
author = "مش ضرورى ماليش نفس"
text = "الحمد لله يا أستاذ بلال، ربنا بيكرم الإخوان ويخلصهم من الشوائب أول بأول ، بس الأمر اللى بيغيظنى الصراحة حكاية القيادى فى الإخوان دى ، يا جماعة هو لازم إسباغ صفى القيادى على كل واحد الإخوان فصلوه أو هو حتى ساب الإخوان علشان الموضوع يصبح أكثر إثارة ؟<br />وبعدين أى قيادة دى يا أخى اللى تسيب الإخوان وتروح التجمع ؟<br />إنت عارف لو قلت إنه ساب الإخوان مثلا وراح يشتغل مدير أمن مراجيح مولد النبى كان يبقى الموضوع ماشى ، إنما حكاية التجمع دى الصراحة مش داخلة دماغى ، يا عمى أصلا الشيوعيين ذات أنفسهم قرفانين من التجمع ورئيسه واللى فيه ، يبقى هييجى واحد شاف سعة الإسلام وجمال تعاليمه وروعة الانتماء إلى جماعة مثل الإخوان وتقوللى راح التجمع ، لا دى مش داخلة دماغى وأوعدك إنى هاحاول أبحث فى القصة دى .<br />وبعدين ملحوظة بس علشان حكاية قيادى اللى قلت عليها ، مفيش حاجة فى الإخوان اسمها شعبة القليوبية ، وهو تعبير إن دل فإنما يدل عن عدم معرفة بأبسط تقسيمات الإخوان اللى يعرفها الناس العادية فضلا عن واحد بتقول إنه كان قيادى وقعد 20 سنة فى الإخوان وبعدين قرر الانتقال إلى جنة التجمع ، لأنه ببساطة القليوبية دى محافظة كاملة يا سيدى ويتبعها موال كبير ومش شعبة طبعا .<br />وختامًا ...... تحياتى لكل المشتاقين لدور على حس شتيمة الإخوان ."
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131323/http://masr.20at.com:80/newArticle.php?sid=10945"

[[comments]]
order = 1
subject = "سبوبات مع خالص التحيات"
author = "مش ضرورى ماليش نفس"
text = "على فكرة يا جماعة أنا عارف واحد كمان ساب الإخوان ، هابقى ابعتلكم ميله وتليفوناته علشان تستغلوا الفرصة وتعملوا عنه بروفايل حلو ، بس لازم تلحقوا قبل ما حد من روزاليوسف او الوطنى اليوم ياخد الأرقام قبلكم .<br />إنتم عارفين دى سبوبة كويسة وفرصة لازم استغلالها بسرعة ، واحتمال تلاقوه كمان عارف واحد صاحبه كمان الإخوان طردوه ولا حاجة يبقى زيادة الخير خيرين .<br />أما بقى لو كان ربنا فتح عليه وعمل دراسة بيلعن فيها سلسفيل الإخوان فهنا يأتى دور الطحاوى ، وسعوا بقى .<br />أما لو كان الوضع كبير والمسألة فيها مؤتمرات برة ودراسات بقى ومراكز أبحاث فاتركوا المهمة حيئذ للأستاذ \"تمام \" فهو أهل لها ."
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131323/http://masr.20at.com:80/newArticle.php?sid=10945"

[[comments]]
order = 2
subject = "ممكن اتكلم"
author = "مروان"
text = "السلام عليكم ورحمة الله وبركاته<br />وبالرغم من اني في الاخوان عمر ما حد قالي اعمل ايه وما تعملش ايه<br />بالعكس الحكاية منفتحة غاية في الانفتاح<br />فلما يقول كده لازم اشك ايه اللي بيحصل<br />لو هو قلب تجمع ليه سايب دقنه حاجة غريبة يعني يبقي يساري مش مقتنع اوي بالافكاؤ الاسلامية ومربي لحيته ومن النوع<br />الكثيف<br />والحجات اللي زي ده بتدفع بعض الشباب والصراحة معاهم حق انهم يقولوا انهمدسوس وعميل<br />لان اللي يعيش مع الاخوان سنتين ما يقدرش يسيبهم من الحب<br />فما بالك بعشرين سنة وبعدين يروح فين التجمع ؟؟؟؟؟؟؟؟؟؟<br />سبحان الله انا الكلام ده مش داخل دماغي خالص."
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131323/http://masr.20at.com:80/newArticle.php?sid=10945"

