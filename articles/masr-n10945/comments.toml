[[comments]]
order = 4
subject = "موضوع سخيف"
author = "واحد ساب الإخوان"
text = "أحمد بلال<br />عاوز أقول لك إن الموضوع سخيف جدا وليس له أي قيمة على الإطلاق<br />لا هو خبر<br />ولا هو مقال<br />وما طلعتش منه بأي معلومة مفيدة من أي نوع<br />وواضح فيه جدا تحزبك لاتجاه<br />وواضح فيه كرهك الغير ممنطق أو مبرر للإخوان<br />أنا لي على الإخوان مآخذ وكان لي فيها صولات وجولات، لكن عمري ما اتكلمت بدافع التعصب وبالمناسب: أنا واحد ساب الإخوان لبعض الظروف الشخصية والاجتماعية، ورغم ذلك عمري ما تحاملت على الإخوان بالمنظر ده..<br />يا ريت يا أستاذ أحمد عندما تكتب يا تكتب حاجة عدلة يا تصمت!<br />بجد الانترنت مش ناقصة مراحيض فكرية! كل واحد عاوز يتقيأ يتقيأ على شاشاتنا كلنا..<br />عاوز تكتب صحافة أنا أرحب أن أرى مقالاتك<br />عاوز تتقيأ روح اعمل لك موقع أو مدونة تقيأ فيه براحتك<br />وأوعدك هأبعته لكل أصحابي<br />علشان يضيفوه للبلاك ليست<br />وخد راحتك هناك ع الآخر"
archived = "2007-07-15"
capture_url = "https://web.archive.org/web/20070715131323/http://masr.20at.com:80/newArticle.php?sid=10945"

[[comments]]
order = 5
subject = "إلى صاحب تعليق الموضوع سخيف"
author = "أحمد بلال"
text = ":) شكرا جزيلا انك منحتني من وقتك عشان تكتب رد على موضوعي<br />و شكرا اكثر انك قلت رأيك في موضوعي الـ\"سخيف\"<br />ما قلته من معلومات قد لا تكون مفيدة لك و لكنها قد تكون مفيدة لغيرك و لذلك أتمنى دائما ألا ننظر إلى العالم من خلال عيننا فقط، بل يجب أيضا أن ننظر إليه و لو قليلا بعيون الآخر<br />لا أعرف في أي فقرة كنت متحزبا بهذا الشكل الذي اتهمتني به ؟!!!<br />و لا أعرف أيضا في أي فقرة ظهرت كارها كرها غير ممنطق و غير مبررا للإخوان ؟!!!!<br />كل ما كتبت عبارة عن أحاديث نسبتها لأصحابها أو حقائق معروفة مثل مصادرة كتاب أو غيرها<br />أما عن أني أكتب عن الإخوان بشكل متعصب فأعذرني يا سيدي لم أكتب عن الإخوان و إنما كتبت عن أشخاص و لا أعرف أيضا متى كنت متعصبا ؟!!!<br />إلى هنا أستطيع الرد اما ما أتي بعد ذلك فهو دون المستوى الذي يستحق أن أرد عليه<br />شكرا :)"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819191602/http://masr.20at.com:80/newArticle.php?sid=10945"
