subject = "الانتخابات"
author = "مش لازم"
posted = "2008-04-09"
text = "تتصور يا خباب انا عمري 51 سنه والحمد لله مقاطع الانتخابات طول عمري ما عنديش بطاقة انتخابية ولا عمري دخلت في اي انتخابات من اي نوع<br />ليه يا خباب<br />لاني عارف ان الانتخابات في بلدنا مصر تهريج في تهريج كلام فارغ<br />لان الحاكم بيعمل اللي هو عايزه لا معارض له ولا ند له<br />يبقه لزمته ايه الانتخابات ما نوفر فلوسنا احسن<br />الانتخابات دي مصالح شخصية يا خبخوبتي كل واحد من المرشحين بينظر لها كمصلحة شخصية فقط وعلشان خاطر الفوائد اللي حتعود عليه<br />لذلك انا ادعو كل الناس مقاطعة الانتخابات ما حدث يروح اي انتخابات يا جماعة احنا في بلادنا العربية الاسلامية الحاكم بيعمل فيها اللي هو عايزه"
