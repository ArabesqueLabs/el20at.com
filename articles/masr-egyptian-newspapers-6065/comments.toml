text = "ولية مبيقاش قاعد على قلبنا مدى الحياة بعض الشخصيات لن تخرج من كراسيها مدام القلب ينبض والباشا احمدفتحى سرور من هؤلاء الشخصيات والقائمة طويلة جداا ولن يخرج احد منهم الا فى حالة واحدة التغير الكلى والجذرى ولن يعلم احدمتى هيكون هذا الميعاد .انا بجد حزين على ماوصل الية مجلس الشعب مافيش مرة فى تاريخة يسحب الثقة من وزير او مسئول صحيح مجلس اللب والسودانى والبصمجية بتوع الحزب الواطى"
