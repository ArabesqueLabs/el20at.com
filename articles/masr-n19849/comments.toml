[[comments]]
order = 0
subject = "هى دى مصر ياعبلة"
text = "هو دة حال مصر فى جميع المستشفيات اهمال وفساد ومعاملة سيئة وكأنهم ليسوا بشرا ولو واحد او اكثر ماتوا ولايرمش لهم جفن يمكن لو ال بيموت عندة قطة اوكلب بيتأثر ولو شوية حسبنا اللة ونعم الوكيل"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213172146/http://masr.20at.com:80/newArticle.php?sid=19849"

[[comments]]
order = 1
subject = "الحل هو - ارسال بلدوزر من البلدية لازالة هذة المستشفى من على ظهر الارض وايقاف قتل الناس الغلابة تحت اسم العلاج"
text = "شوية دكاترة بهايم ما بيعرفوش يستخدموا الاجهزة ولا احد اعطاهم اى تدريب<br />المحروس صمام وكحيت وبيحفظ الكتاب وبقى دكتور عين امة علشان يموت فى الناس برخصة اسمها بكالوريوس الطب<br />يا عم هاتوا لنا شوية دكاترة هنود زى دول الخليج ما بتعمل يمكن يعلموا الجهلة بتوعنا"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213172146/http://masr.20at.com:80/newArticle.php?sid=19849"
