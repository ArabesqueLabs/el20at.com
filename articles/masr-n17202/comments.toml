[[comments]]
order = 11
subject = "عم \\\"سامر\\\" يقف أمام عربته القديمة المكتوب عليها (اذكر الله).."
author = "مش قايل"
text = "يا ريم خورشد فيه واحد واقف بعربية تين شوكي اسمه سامر برضه يا ريم<br />يا ريم طبعا الموضوع دا معمول وانتي قاعدة على المكتب لا فيه عم سامر ولا بطيخ<br />ابقي اختاري اسماء حقيقية<br />يعني مثلا عم علي عم حسين عم محمد<br />اسماء معقولة شوية اما عم سامر دي ما تجيش ابدا<br />سلام يا ريم"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030844/http://masr.20at.com:80/newArticle.php?sid=17202"
