[[comments]]
order = 6
subject = "الى ابو جلمبو فقر 27 سنه"
posted = "2008-08-12"
text = "يا استاذ ابو جلمبو<br />الاسلام حل مشكلة الفقر روح دور على حل مشكلتك بدل القعدة على النت طول الليل<br />مشكلة الفقر وكيف عالجها الإسلام<br />عبدالرحمن بن محمد بن علي الهرفي<br />الداعية بمركز الدعوة بالمنطقة الشرقية<br />مشكلة الفقر وكيف عالجها الإسلام<br />المؤلف : صاحب الفضيلة الأستاذ الدكتور يوسف القرضاوي<br />الناشر : مكتبة وهبة ، الطبعة السادسة<br />يقع الكتاب في 152 صفحة<br />وقد بدأ المؤلف بمقدمة ذكر فيها أسباب تأليف هذا الكتاب القيم ومما قاله فيها : عرفت الإنسانية الفقر والفقراء منذ أزمنة ضاربة في أغوار التاريخ ، وحاولت الأديان والفلسفات منذ القدم أن تحل مشكلة الفقر وتخفف من عذاب الفقراء … ، وفي عصرنا هذا احتلت مشكلة الفقر مكانا فسيحا في عقول الناس وقلوبهم ، واتخذها المخربون والهدامون أداة لإثارة الجماهير والتأثير عليهم ، وكسبهم إلى جانب مذاهبهم اللادينية الباطلة ….. ولهذا فواجب على كل من عنده علم من الإسلام أن يبين للمسلمين حقيقة ما بعث الله به محمدا ـ صَلَّى اللَّهُ عَلَيْهِ وآله وَسَلَّمَ ـ من الهدى والرحمة .<br />وتحدث المؤلف في النقاط التالية :<br />أولا: موقف الناس أمام مشكلة الفقر .<br />ثانيا : نظرة الإسلام إلى الفقر : وفي هذا الباب تحدث عن عدد من النقاط منها :<br />الفقر خطر على العقيدة<br />الفقر خطر على الأخلاق والسلوك<br />الفقر خطر على الفكر الإنساني<br />الفقر خطر على الأسرة<br />الفقر خطر على المجتمع واستقراره<br />معنى القناعة والرضا بما قسم الله<br />ثالثا : وسائل الإسلام في معالجة الفقر . وقد أفاض في الحديث عن أبرز وسائل معاجة الفقر . ومن هذه الوسائل :<br />الأولى : العمل .<br />الثانية : كفالة الموسرين من الأقارب .<br />الثالثة : الزكاة .<br />الرابعة : كفالة الخزانة الإسلامية بمختلف مواردها .<br />الخامسة : الصدقات الاختيارية والإحسان الفردي .<br />ثم ذكر شرطا لابد منه فقال : هذه الوسائل التي شرحناها والتي عالج الإسلام بها مشكلة الفقر إنما تحق أهدافها وتؤتي أكلها على الوجه المرضي في ظل مجتمع اسلامي تقوده عقيدة الإسلام .<br />ثم ختم بخاتمة لطيفة عنوانها : انتصار الإسلام على الفقر .<br />وقد عرض المؤلف لما سبق من عناصر بأسلوب راق ، وشرح واف ، واستشهاد موضح . الأمر الذي أكسب الكتاب تميزا .<br />ومما زاد في قيمة هذا الكتاب أن قام سماحة الشيخ محمد ناصر الدين الألباني ـ رحمه الله ـ بتخريج أحايثه في كتاب لطيف يبلغ 96 صفحة ."
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030844/http://masr.20at.com:80/newArticle.php?sid=17202"

