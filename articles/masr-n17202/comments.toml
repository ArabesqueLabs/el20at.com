[[comments]]
order = 3
subject = "الى الاستاذ أحمد القطب أحمد محمود"
author = "ابومحسن غربة 27 سنه"
posted = "2008-08-12"
text = "وليه بس النظرة التشاؤمية دي تجاه الحكومة<br />خليك راجل سني يا استاذ احمد زي ما قلتلك قبل كده الكلام اللي انت بتقوله دا كلام الخوارج<br />بص اهل السنة والجماعة بيقولوا ايه<br />من أراد صلاح الأمة يجب عليه الدعاء لوليهم<br />بسم الله الرحمن الرحيم<br />والحمد لله رب العالمين وبه نستعين على أمور الدنيا والدين والصلاة والسلام على خاتم الأنبياء والمرسلين الصادق الأمين حبيبنا ونبينا وعظيمنا وقائدنا ومولانا وشفيعنا وهادينا المرسل رحمتاً من رب العالمين محمد إبن عبدالله صلى الله عليه وعلى آله وصحبه وسلم تسليماً كثيراً إلى يوم الدين أما بعد :-<br />ياجماعة الخير مايجوز هذا الكلام والدعاء على الإنسان المسلم فعندما يأتي أي شخص يدعي أو يمتنع عن الدعاء لولي الأمر حفظه الله وهذا من جهله ، وعدم بصيرته؛ لأن الدعاء لولي الأمر من أعظم القربات ، ومن أفضل الطاعات ، ومن النصيحة لله ولعباده ، والنبي صلى الله عليه وسلم لما قيل له : إن دوسا عصت وهم كفار قال : اللهم اهد دوسا وائت بهم فهداهم الله وأتوه مسلمين .<br />فالمؤمن يدعو للناس بالخير ، والسلطان أولى من يدعى له؛ لأن صلاحه صلاح للأمة ، فالدعاء له من أهم الدعاء ، ومن أهم النصح : أن يوفق للحق وأن يعان عليه ، وأن يصلح الله له البطانة ، وأن يكفيه الله شر نفسه وشر جلساء السوء ، فالدعاء له بالتوفيق والهداية وبصلاح القلب والعمل وصلاح البطانة من أهم المهمات ، ومن أفضل القربات ، وقد روي عن الإمام أحمد رحمه الله أنه قال : ( لو أعلم أن لي دعوة مستجابة لصرفتها للسلطان ) ، ويروى ذلك عن الفضيل بن عياض رحمه الله .<br />والدعاء لولي الأمر وإمام المسلمين من أفضل القربات والسنن، وهو دأب العلماء المصلحين، جاء عن بعض السلف أنه قال: لو كان لي دعوة مستجابة لصرفتها للإمام؛ وذلك لأن صلاح الراعي فيه صلاح الرعية، واستقامة أمورهم، وتعدل أحوالهم، وفي قربه من الله قرب لهم.<br />وليس للدعاء لولي الأمر حد، فلو جعل المتحدث مجلسه كله في الدعاء لهم لكان هذا حسنا، وكذا يدعو لهم في الخطب وفي القنوت وفي المحاضرات، ويكثر من الدعاء لهم بأن يوفقهم الله ويسددهم ويعينهم، وأن يصلح بطانتهم ونحو ذلك.<br />ولا يعد بحال من زاد في الدعاء لولي الأمر معتديا في الدعاء؛ بل هو محسن.<br />والدعاء لولي الأمر ديانة واعتقاد ويخطئ من ظن انه مجرد تزلف .<br />ومخاطبة الرؤساء بالقول اللين أمر مطلوب شرعاً.<br />ولهذا فإنني أنصح كل من دعاء على الملك بشر أن يغيروا هذا الظن وأن يتوجهوا إلى الله سبحانه وتعالى أن يشفيه وأن يصلحه وأن يهديه وذلك لما فيه صلاح له ولهم والله من وراء القصد ....<br />أخوكم /<br />الروهجـان حسين ابوعيه احمد"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030844/http://masr.20at.com:80/newArticle.php?sid=17202"

