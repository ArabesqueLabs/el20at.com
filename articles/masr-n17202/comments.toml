subject = "الى ام محسن 27 سنة غربة"
author = "ابو جلمبو 27 سنة فقر"
posted = "2008-08-12"
text = "انتت عايش فى اى زمن - سنة اية وشيعة اية وهباب اية ودعاء لمين ك- انت بتشتغل اية -ك بتغسل فوط لسوزان تميم عاهرة لجنة السياسات اللى كانت بتلف عليهم فى فندق الفور سيسون فى ماخور الشرم<br />هتدعى لمين بالاصلاح الحكومة اللى حكمت بالبراءة علىاللى غرق 3 الاف مصرى<br />بتاع لجنة السياسات اللى دفع مليون دولار لعقيد شرطة يروح يقتل فنانة فى دبى بدل ما يشتروا عيش للطوابير<br />انا عارفك انت يا ولد<br />انت مش نازل اجازة فى رمضان<br />عارفك كويس فرفور مباحث امن"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030844/http://masr.20at.com:80/newArticle.php?sid=17202"

