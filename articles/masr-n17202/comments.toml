[[comments]]
order = 8
subject = "حكومة سوزان تميم وسوزان ثابت"
author = "اها  ها ها"
posted = "2008-08-12"
text = "اساتذة الجامعة بيقولوا ان الدولة عايشة على التنفس الصناعى تمام زى الكبير اللى عايش على التنفس الصناعى فى الانعاش<br />سوزان تميم تسببت فى انهيار البورصة والنهاردة اخبار زى الزفت واقتصاد التسول على كف عفريت<br />وسوزان ثابت بتقول لك الثقافة ورعاية الطفل لغاية مابقى عندنا مليون طفل شوارع<br />والكبير العايب بيقول واقفة مصرية على قناة النيل لغاية البلد مابقى حالها واقفة<br />ونظيف رايح يفتتح سلم متحرك عطل بعد نصف ساعة من تشغيلة<br />والشباب عاطل بيعاكس بنات فى الشوارع يسرق هدوم من على حبل غسيل يسرق عربية عجلة غطاء المجارى والبلاليع اى حاجة حديد تنباع<br />والكبار فى الشرم بيجيبوا بنات من لبنان والمغرب واسرائيل ويعملوا ليالى حمراء وزرقاء<br />والشعب واقف فى طوابير الخبز عرقان من الحر<br />وبتاع الاعلام عايز يبيع مبنى التلفزيون للوليد بن طلال ويظهر ان العمولة معجبتوش فرجع فى كلامة<br />وبتوع المحلة بيحاكموهم<br />كلة هيصة<br />بلد تحت التنفس الصناعى"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030844/http://masr.20at.com:80/newArticle.php?sid=17202"

