subject = "زمن الشخلعة"
author = "مجهول"
posted = "2007-04-18"
text = "عندما كانت شعوب اوروبا ترغب في غزو العرب كانو يرسلون جواسيسهم لنا ليرو فيما يتكلم الناس ،،،، و عندما وجدو انهم يتناقشون في امور الجبر و الهندسة و الفلك علموا و تأكدوا انه لي بالميعاد الصحيح للغزو ،،، و بمرور الوقت أصبحنا نتحدث عن تفاهات .... فسهل عليهم غزو بلادنا و نهب خيراتنا ،،، واحد يكتب عن كاتبة يهودية و آل ايه بقلب عربي ، و التاني عمال يكتب عن تامر حني ( رد السجون ) و أخيرا ابو عيون جريئة ...<br />نعيب على زماننا و العيب فينا و ما لزماننا عيب سوانا"
