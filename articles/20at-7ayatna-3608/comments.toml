author = "atat_atat40@hot عبدالله"
posted = "2007-04-18"
text = "السلام عليكم الف مبروك علي الموضوع وهذا يظهر ايضا ما به البشر من تفاهات الله يخرب بيت الفضائيات وعبدالناصر لو موجود مكنش هيقول اعز الولد ولد الولد والله الشباب تعبان وانا كمان تعبان وانت كمان تعبان والله يرحمنا عشان خلاص هنموت واحنا بنشوف البهدله ومش عرفين نغير حاجه البنات مشين في الشوار ولا في اي حياء والشباب خلاص راحت الرجوله وممكن كمان احنا منكنش ناس ممكن نكون مخلوقات جديده هههههههههههه"
