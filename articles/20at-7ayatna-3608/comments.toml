[[comments]]
order = 6
subject = "ومالو"
author = "التوربيني...صبح صبح"
posted = "2007-04-18"
text = "السلام عليكم جميعا<br />انا مش عارف الشباب و الشابات اللي بيعلقوا هنا متضايقيين ليه... عشان يعني الرجالة بتوعنا طالعين في مسابقة لاختيار الشاب الموزززة.... طب وايه المشكلة يعني.... مالشباب في كل حتة بقي يكسف ... عليه العوض و منه العوض... كتير جدا باشوف الشباب اللي لابس بنطلون و منزله تحت وسطه لغاية ال..... , و اللي مطول شعره و عامل ديل حصان .... و مصطفي قمر بيحط ماكياج (ميك اب) قبل ما يطلع يغني...و سعد الصغير بيتجزم و يرقص... و محمود شاكيرا له فقرة رقص شرقي في كل الكاباريهات دلوقتي.... الموضوع مالوش دعوة بعبد الناصر ولا جمال مبارك و لا اشرف مروان.... المشكلة في الرجالة اللي بتربي و الامهات اللي بتوجه...دول راحوا فين... البيوت بقيت فاضية و الفلوس اعمت الناس...مفهوم الرجولة و الحمشنة و النخوة خلاص...اتغير...تمشي جمب مراتكك و هي صدرها عريان تبقي رجل عصري... اصحابك يسلموا عليكو و يبوسوكو انتو الاتنين تبقي راجل اجتماعي.... مراتك زميلها في الشغل يوصلها البيت بعد الشغل عااادي... مانتا راجل متفاهم و سبور...لما الرجالة حالها اتلغبط و بقوا اشباة الرجال.... يبقي مستنيين اية من شباب عندوا 19 ولا 23 سنة....الله يرحمك يا شويش عطية ايام الابيض و الاسود لما كنت تقول \" اضرب برجلك جامد ترهب العدو\"....دلوقتي اخرهم يضربوا ......اياااك بس يعرفوا"
archived = "2010-03-14"
capture_url = ""

