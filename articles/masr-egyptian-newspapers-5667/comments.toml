subject = "بصراحه انا بتابع حسنين كروم من زمان والله الراجل ا"
author = "رامز عباس"
posted = "2007-05-01"
text = "بصراحه انا شايف ان الهجوم علي جمال زيي قلته الراجل خلاص كمان يومان ويفك زنقته في ليله من ليالي الحزب الوطني مع نفسه وبس واتمني من الاخوة الصحفيين يدولهلم علي لقمه عيش نضيفه ونخلي الصحافه هوايه وخلاص علشان منبقاش تحت ضغط بالنسبه لا خ محمد ابو الحديد هقوله لما جمال يمسك ويخلي عز يمسك الوزارة هيهتم بيك لانك ابو التجارة كلها حديد في حديد ومعلشي علي القشفه دى جت ببالي مع اني بحترمك جدا استحمل بقا مش انت ابو حديد ههههههههههههههه"
archived = "2010-03-14"
