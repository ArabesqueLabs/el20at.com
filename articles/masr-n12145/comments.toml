subject = "طيب وباقى الناس"
author = "مصطفى"
posted = "2007-10-29"
text = "الحيتان الكبيرة زى احمد عز وسوريس وبقية الحرامية وبتوع قصور مارينا والشرم والفلل اللى فى الغردقة اشمعنى دول محدش بيجيب سيرتهم فى الضرايب<br />والا دول فوق القانون<br />والغلابة بس اللى فاتح دكانة واللى بيسرح بعربية خضار هم اللى يدفعون الضرايب<br />يابلد اعدلى بين عيالك"
