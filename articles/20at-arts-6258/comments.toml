subject = "إن الله عز و جل ليؤيد هذا الدين بالرجل الفاجر"
author = "متجول"
posted = "2007-06-27"
text = "الأخت آية التي تحجبت بسبب الأغنية نقول لها...<br />- قال عليه الصلاة والسلام: \"إن الله عز و جل ليؤيد هذا الدين بالرجل الفاجر\" ولعله يدخل في ذلك اهتدائك للحجاب بسبب هذه الأغنية رغم أنها مليئة بالمخالفات الشرعية، من المعازف، وظهور النساء، والخلط بين الحجاب الشرعي والحجاب المتبرج، وابراز الاختلاط على أنه أمر لا حرج فيه.<br />- لاشك أن الدعوة للالتزام بالواجبات الشرعية أمر واجب على الأمة، لكن ينبغي أن تكون وسيلة الدعوة نفسها جائزة شرعًا، فلا يعقل أن ندعو للحجاب من خلال اظهار المتبرجات على الشاشة ثم اظهارهن وهن يرتدين الحجاب المتبرج!!!"
archived = "2010-03-14"
