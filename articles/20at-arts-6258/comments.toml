text = "السلام عليكم<br />مش عارفة مين أميمة (ده) اللي شايف انه بنت مش مؤدبة و انه هيبقى أم فاشلة و كل الحاجات الوحشة دي .. متقلقش ان شاء الله هتبقى كويس يعني.. انا مش شفت الكليب يا جماعة لكن سمعت التعليقات طبعا فهمت ان فيه تجاوزات في التصوير بس الواحد لما يشوف حاجة يقول فيها كذا كويس و كذا وحش مش كله ضرب ضرب فيه حاجة اسمها نقد بناء و نقد هدام و اعتقد ان كتير من اللي ردوا هاجمو الوحش بس لكن مقالوش لكن هو مثلا الهدف كان ايه، تعليقك ممكن يغير تفكير بني آدم و يخليه يمشي في طريق تاني لان ملقاش حد يشجعه و يقولله كويس بس كان احسن لو يبقى كذا و ممكن يخليك تشيل ذنبه لانه كان ممكن في دماغه حاجات تانية كتير كويسة و يغير مساره بسبب التعليقات الكتير اللي كانت ممكن تتقال باسلوب تاني.. ربنا يهدينا جميعا"
