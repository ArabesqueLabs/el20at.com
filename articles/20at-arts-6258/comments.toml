text = "اميمة دي انا اشك انها بنت او تكون مسلمة اصلا لان رايها هو هو راي الشباب الملحد اللي بيحقر من شان المراة وبيعتبر ان جمال جسمها ومفاتنها جزء من المناظر الطبيعية اللي لازم يستمتع بالنظر ليها يا بني ادم ياللي اسمك اميمة الححجاب فرض رغم انفكم وهايفضل على رؤوس البنات مهما حصل ومش معنى ان بعض بنات مش متربيين لكن لابسين الحجاب انه يتمنع او يتلغي او اننا نبطل نلبسه بقى بالعكس احنا لازم نلبسه ونبين للناس اخلاقنا وتربيتنا عشان تفرق بين الاصيل والمغشوش وبالنسبة لقلة ادب المراة العربية عن الامريكية كل انسان بيكون حاسس بنفسه واعتقد انك بتتكلم او ببتكلمي في النقطة دي بالذات عن نفسك"
