[[comments]]
order = 0
subject = "هل لها مردود بالفعل ؟؟"
author = "معلقة دائما.."
posted = "2007-06-14"
text = "السلام عليكم أغنية اتحجبتي هي الأغنية الثانية على ما اعتقد التي تناولت موضوع الحجاب بعد أن تناولها الفنان حسين الجسمي في أغنية(يا صغر الفرح في قلبي )فعرض الكليب بعدما اثيرت قضية منع الحجاب بفرنسا ولكن ليس بكلمات صريحة مثل اغنية اتحجبتي ، الأغنية كلماتها رقيقة بالفعل لكن لست مع الذين انتقدوا وضع ان الشاب الذي لم يتقبل الفتاة بالحجاب في بادئ الأمر، ان أغلب شباب هذه الأيام لا يقبلون حجاب الفتاة من الأساس فانني اعرف قصة حقيقة ان شاب ترك محبوبته بسبب الحجاب لا أعلم لماذا أصبح الحجاب هو أمر فاصل في حياتنا اليومية حتى في العمل وليس في علاقاتنا الشخصية لكن ما حدث للشباب في الكليب على ما اعتقد انه قام بالتفكير في الأمر بشكل عقلاني ووجد ان الحجاب لن يقف عائق كما يظنه البعض لأن يستكمل علاقته اما عن الخيط الذي تحول في لحظة الى خاتم خطوبة فأظن ان المعنى الذي وصل اليا والى بعض الأصدقاء هو أنني اريدك وانني اتمسك بكي وان الحجاب لن يغير ما في قلبي وعلى فكرة اي شيء في أولو بيبقى غريب وبعدين يصبح عادي فااللي حصل كان أمر طبيعي هذا ما قد وصلنا لا اعرف هل هذا ما وصل للذين شاهدوا الكليب ام لا ،لكن الأهم هل للأغنية مردود على الفتيات وهل سيكون بالايجاب ام بالسلب لا أعلم،قرات شيء غريب جدا على احد المواقع ان روبي قد رفعت قضية تقاضي فيها القائمين على العمل لمجرد أن الفتاة كتمت صوت الأعنية التي كانت أختها الكبرى تشاهدها لتكون كلمة(MUTE) على الأغنية وذلك لكي تقوم الفتاة الصغيرة باقامة الصلاة ،ايه رايكم ؟هو المفروض ايه يا روبي الواحد يصلي على اغاني ولا ايه ولا اغانيكي....... يحرم عليها كلمة )MUTE) ده كمان من مردود أغنية اتحجبتي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "إتشربتي برافو عليكي"
author = "شريف ف أ"
posted = "2007-06-15"
text = "فعلا نحن نعيش في أيام سادها الفتن وتاهت فيها مرادفات الكلام الصحيحة<br />هل تعرفون معنى كلمة حجاب ؟<br />كلمة حجاب في مضمونها قد تكون أعم من الخمار فهى مشتقة من الفعل حجب أي منع<br />والمرأة التي يطلق عليها محجبة هي التي تمنع فتنتها وجمالها عن الناس<br />وذلك بملبسها الشرعي الفضفاض الذي لايشف ولايصف والذي يبعد عن لباس الشهرة والزينة التي لا يصح أن تظهرها إلا لبعلها أي زوجها<br />وكذلك بأفعالها من نظرات وكلمات فصوتها منخفض بغير ميوعة وليونة ونظراتها متزنة فيها الحياء<br />حينئذ نطلق إسم محجبة علي هذه المرأة التي تعرف معنى حجاب الحقيقي<br />والذي لا يقتصر على مجرد غطاء للرأس أو الشعر فهذا ما يسمى بالإيشارب<br />لذا كان يمكن أن تكون كلمات الأغنية إتشربتي برافو عليكي أي لبستي الإيشارب برافو عليكى حتى نضع الكلمات في موضعها الصحيح<br />وأرجو ألا يفهم من كلامي الهجوم على كلمات الأغنية فقد تكون الكلمات مقبولة<br />ولكن التصوير والإخراج غير مقبول لأنه يؤدي إلى الفتنة وقلب الحقائق وبذلك تكون الأغنية قدمت السم في العسل"
archived = "2010-03-14"
