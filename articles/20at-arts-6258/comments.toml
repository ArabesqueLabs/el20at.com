text = "اولا احب اوضح ان التعليق يعبر عن وجهه نظرى الخاصه و علشان متفهمش غلط اقصد انها وججه نظر من الناحيه الفنيه و ليست من الناحيه العقائديه و اكرر فى رايى الخاص لانى لست ناقده فنيه<br />فنيا من وجهه نظرى الكليب كفكره كان ممكن يتقدم بشكل افضل و لكن الكلمات جاءت مباشره الى حد السصحيه التى ازاد منها اللحن رغم ان الملحن و الموزع بذلو جهد حاولو يقللو من السطحيه مقدروش<br />و التصوير كان الطامه الكبرى و مش عايزه اخوض فيه بس كفايه الشوت بتاع الطفله الصغيره اللى لابسه حجاب و الرساله و اضحه و السؤال لماذا.................؟"
