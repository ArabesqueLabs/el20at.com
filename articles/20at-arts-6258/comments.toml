[[comments]]
order = 11
subject = "رد على إن الله عز و جل ليؤيد هذا الدين بالرجل  الف"
author = "محمد حافظ"
posted = "2007-10-31"
text = "سلام عليكم أولآ....بالنسبه للفاجر اللى هو مش انا ولا انت أصلا . أحب و أحب جدا أن أشكر الله لأنه شرفنى بكده عمل ثانيا ل أشكر الله انى ما عملت حاجه وضيعه اتكسف منها . المهم الحمد الله الأغنيه شافت النور بعد مشاكل من الوزن الثقيل !! أما عن الجديد عندى فحدث و لا حرج.... اغنيه عن واحد مدمن و الثانيه عن معنى الزواج و العلاقه الصحيحه بين الرجل و المرأه فى مشكله كده ...و على فكره مين المطرب الجامد اللى يقول على نفسه أدمنت خلاص و عينى مغميها !<br />أما عن الثانيه مين كمان حيقول ؟ هوه ده الكلام اللى نقوله.....شهر عسل غرام و الحب نطوله. و ده طبعا حيحصل انشاء الله بس بعد الجواز و فى الحلال . ما علينا و الله يسامحنا جميعا"
