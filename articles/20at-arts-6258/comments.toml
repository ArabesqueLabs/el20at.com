subject = "تاني! الخلط بين الحجاب المتبرج والحجاب الشرعي!"
author = "مسلم"
posted = "2007-06-24"
text = "- الحجاب شرعه الله لتحجب وتستر المرأة زينتها لا لأن يكون في نفسه زينة كما شاع في نماذج الحجاب المتبرج التي غزت المجتمع...<br />- والحجاب المتبرج ليس إلا صورة مشوهة من التبرج... فليست صاحبته بالمحجبة وليست بالمتبرجة تبرجًا صريحًا...لكنها ما زالت في جميع الأحوال \"فتنة للناظرين\" غير مستورة العورة والمفاتن! ونخص بالذكر الحجاب الذي من طراز: بنطلون + بودي + ايشارب قصير مزركش!<br />- نؤكد على أن الحجاب الشرعي القرآني هو : زي محتشم موافق لشروط الحجاب + سلوك ملتزم بالعفة والحياء.....لا مجرد حتة طرحة قصيرة بألوان فحلقية!"
