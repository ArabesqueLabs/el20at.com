subject = "مش كل البنات وحشين.."
author = "معلقة دائما.."
posted = "2007-06-17"
text = "السلام عليكم يا اميمة هو احنا بدل ما نصلح اللي باظ تبوظيه اكتر ،انا بحترم رايك ان دلوقتي اغلب البنات المحجبات دلوقتي للاسف لابسين الحجاب مجرد حتة قماش على الراس وخلاص لكن ان ده ميمنعش ان برضو في بنات محجبات محترمات وبيراعو حتة القماش اللي شعرهم واحنا الحمد الله مهماكان برضو فينا بنات مش محترمات بس عمرنا ما حنوصل لدرجة نبقى نتقارن ببنات اوروبا وامريكا وان البنات العربيات أصبحوا قللات الأدب أكتر منهم والمفروض انك بنت ده على اساس ان اسمك أميمة كفاية اللي بتعرض في السينما والتليفزيون خلو الشباب ميثقوش في البنات زي ما فيه الوحش في الحلو برضو لكن للاسف الوحشين غطوا على البنات وللاسف ان في بنات بتدفع تمن عدم ثقة الشباب فيهم فالعملية مش ناقصة يا اميمة"
