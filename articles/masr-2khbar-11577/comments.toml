subject = "لماذا التضامن مع البشير ومعاداة مبارك"
author = "مش رايح"
posted = "2009-03-17"
text = "معناها ايه التضامن مع البشير ومعاداة مبارك<br />ايه الفرق بين البشير ومبارك<br />وايه الفايدة من التضامن مع البشير والوطن المصري ممزق<br />ولا هي حركات وخلاص"
