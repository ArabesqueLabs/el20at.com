[[comments]]
order = 0
subject = "رئيس كتلة نواب الإخوان داخل مجلس الشعب،"
author = "مش ضروري"
posted = "2009-03-17"
text = "اريد ان انوه هنا انه لا يوجد اخوان مسلمين داخل مجلس الشعب<br />فيه نواب مستقلين<br />رشحوا انفسهم على انهم مستقلين ليس لهم اي انتماء حزبي<br />فغلط بعد ما ندخل مجلس الشعب على هذا الاساس يعلن المستقلين انهم كانوا كدابين وانهم ليهم انتماء حزبي ويعملوا كتلة برلمانية<br />خصوصا انهم يريدون اقامة دولة اسلامية والكذب حرام في الاسلام ولازم المسلم يكون قدوه لغيره<br />طالما دخلوا مستقلين يبقى يلتزموا بذلك<br />هذا رأيي ورأيي غير ملزم لاحد"
archived = "2010-03-14"
capture_url = ""

