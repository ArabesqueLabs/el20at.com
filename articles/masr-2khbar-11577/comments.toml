[[comments]]
order = 2
subject = "قال الدكتور عمرو الشوبكى، الخبير فى شؤون الحركات ا"
author = "مش لازم"
posted = "2009-03-17"
text = "هو خبير في الحركات الاسلامية<br />يا سلام يا اخي<br />المجاعة اللي في مصر دي عملت حجات عجيبه<br />خبير في الحركات الاسلامية وخبير في الكوره وخبير في شئون عشرينات وخبير في المهيصه<br />يلا بقا ما هو كل واحد لازم يقلب عيشه ويشفله سبوبه ياكل منها عيش في ايام لجنة السياسات السودا دي"
archived = "2010-03-14"
