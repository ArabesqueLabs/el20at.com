subject = "و اية يعنى لو يتحرق مجلس الشورى؟ دة مجرد شوية طوب"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-01"
text = "عجبت للدوشة الكبيرة اللى اعقبت حريق مجلس الشورى؟<br />و اية يعنى ما يتحرق مجلس الشورى و كمان يتحرق علية مجلس الشعب كمان!!!<br />كيفما تم بنائة كيفما سوف يتم بنائة ايضا؟<br />اية الدوشة الفارغة دى كلها<br />و بلاش التفكير المريض اياة؟ التفكير المسمى (نظرية المؤامرة)<br />ما تفيقوا يا شعب جاهل و مخدر<br />المهم (الا تحترق مصر) يا شعب كسول اكولجهول!!!<br />ارحم مصر نظام و حكومة و شعب يا اللة العظيم<br />لية يا رب الشعب تغير و بقى حقود ووحش؟"
