subject = "ال سعود عدو الامة الاول"
author = "مسلم"
posted = "2007-04-18"
text = "مهما حاولتم من تلميع صورة ال سعود \"فقد اتسع الفتق على الراتق\" ، لذلك أقول قد اتضح للقاصي والداني إن عدو الامة الاول هم ال سعود ، ومن كان من كلامي في شك فليرجع الى التاريخ فما من حركة اسلامية بل حتى عربية صادقة الا وقفوا لها بالمرصاد واجهضوها ، ولولا الرياض ما سقطت بغداد.<br />لذلك وفروا جهودكم ، فشعب الجزيرة بدأ ينهض من كبوته ، وسيسقط هؤلاء المجرمين -ال سعود - عن كاهله الى غير رجعة"
