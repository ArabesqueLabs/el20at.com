subject = "عبد الإنجليز"
author = "طارق"
posted = "2007-04-11"
text = "لست أدرى ما أقول , ولكن بصراحة الواحد عارف إن التعليم فى العالم العربى كله غث وقرف ونفاق وتمجيد ,....... من حقه يقول على أبوه أى حاجه هوه حر , مش ابوه اللى سمى البلد بإسمه , بس يدرسو الكلام الفارغ ده للعيال فى المدارس مش هيجيب نتيجه و الكل عارف إن عبد العزيز كان راجل الغرب فى المنطقه وحرب العصابات اللى كان بيعملها كانت مموله من الغرب والإنجليز"
