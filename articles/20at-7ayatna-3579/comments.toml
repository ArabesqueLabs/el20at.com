subject = "بس انت تغنى واحنا نناولك"
author = "ديمة"
posted = "2007-04-12"
text = "ياسلام .. على رأى احمد زكى .. وياسلام سلم كمان<br />والله انا من كترة حرقة الدم قلت خلاص هاضحك ولا هيهزنى، ما علينا من الامعاء المتدلية وحب عبد العزيز واسوده فاما النصب او الشماتة.<br />لكن شعب ايه اللى حاسس ان كله مفقتد حنان الاب ويبلاقيه على وش سيادته، وانت مالك انت وايه اللى عرفك فكرتينى بالرائد عمرو دياب وهو بيقول منين ما تروح تلاقى ستين مليون فدائى .. والنبى .. اتكلم عن نفسك ياخويا<br />جاتنا القرف شعب من المحيط للخليج اقولها من فوق الدولاب وتحت السرير"
