[[comments]]
order = 5
subject = "من المملكة"
author = "لينا عبود"
posted = "2007-04-15"
text = "ليس هناك متسع من المكان للرد .. وانما الله المستعان على ما سيكتب ولن يعجب الكثيرين هنا:<br />بسم الله نبدأ<br />ان كل ماورد في الردود لا يمثل شيء سوى الاستهزاء والتحقير من شأن شعب او دوله وحاكم..<br />أما الاخ طارق الذي اطرق في وصف المغزى بأن عبد العزيز كان رجل عصابات وان عملياته ممولة من الغرب والانجليز فكان حريا به ان يطرف مفكرا في سياسة دولته التي بها 70 ميلون و 3 اربعاهم يعيشون تحت الحد الادنى بسبب التمديد القمعي والسياسه ( المعفنه ) والاستعباد من عصر الفراعنه .. وهناك تكثر حرب العصابات على المم والسكن والمال ... فأطرق اكثر يا استاذ طارق ..<br />الانسة ديمه: كل فتاة بأبيها معجبه.. اشمعنا انتو على الرغم من كل القرف السياسي وعدم رضاكم عن الوضع السياسي والمستوى المعيشي مازلتم تقولون مصر ام الدنيا وماما سوزان وبابا مبارك و تطلعوا في ستار اكاديمي وسوبر ستار عايزين ترفعوا راس مصر ؟ و السعوديون يعاب عليهم حبهم لملكهم ولو حتى ادعاءاً( بالمصري : انتي مالك ؟)<br />سندباد: وان كان رأيك ان الهدف منه اضحاك الشعوب ، فعلى ماذا يضحكون ؟ على بلاد وحاكم فتحت ابوابها للعرب جميعا للعمل والانتفاع وتحويش الفلوس عشان نروح المدرسه اللغات ونشتري السجادة الشنوا والطقم الكنب المدهب ونركب احسن عربيات بينما اولياء امورنا يعملون في الخليج ؟ لو انها تدعو الشعوب للضحك كنا ضحكنا في بلدنا واحنا بنشتغل و مكفيين مصاريف عائلاتنا ، مش خبزنا كفاف يومنا ..<br />لوسي ابن طنط فكيه: لا تعليق .. ومن يليه ومن يليه ..."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "إيضاح"
author = "أحمد القطب"
posted = "2007-04-15"
text = "لم يكن المقام هنا مقام استخفاف بدولة ولا بشعب.. وإنما اندهاش وتساؤل لما وصلت إيه الأنظمة الحاكمة من استخفاف بعقول الناس وتلاعب بأفهامهم.. وليس بالضرورة أن يكون هذا الكلام للمقارنة بين نظام عربي وآخر، فمن الواضح لكل مشاهد أن سائر الأنظمة العربية في يومنا هذا لم تكن أكثر من أدوات في أيدي صانعي السياسات وحراس المصالح للدول الغربية والولايات المتحدة.. بدءاً بالأنظمة الملكية السعودية والأردنية، وانتهاءً بالأنظمة الجمهورية الصورية في مصر وليبيا وتونس .. إلخ..<br />الأخت لينا عبود.. أنا أحترم غضبتك لشعبك ومليكك، ولكني لا أرى هنا أي موضع للإساءة للشعب العربي السعودي ولا إليك على نحو شخصي، وأرجو أن تقفي أمام نفسك ولا تنجرفي أمام عصبية قومية محضة..<br />أما أن الناس يقصدون السعودية من كل حدبٍ وصوب للعمل والتربح وجمع المال، فلا أراه فضلاً لأحدٍ على الآخر، فإنما هي نعمة الله وفضله عليكم، ما أتيتم به من عند أنفسكم، واذكري قول قارون إذ قال: \"إنما أوتيته على علم عندي، فخسفنا به وبداره الأرض\" وأما من قصد المملكة العمل فلا أرى أحداً قد اكتسب هنالك مالاً إلا بعمل يده وكده وعرقه.. ولا فضل لأحد إذاً عليه في هذا المال إلا الله تعالى..<br />وختاماً.. أسأل الله تعالى الهداية والتأييد لسائر العرب والمسلمين، والإصلاح أو الاستبدال لسائر الحكام والملوك.."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "رحم الله الانسان فيصل بن عبد العزيز"
author = "مصطفى من مصر"
posted = "2007-04-16"
text = "رغم كل شيء فقد مات الرجل و له من المواقف ما لا ينكرها الا حاقد و انا من مصر لا ارى رجلا يذكر الملك فيصل الا و يترحم عليه لما فعله و ساعد به مصر في حرب اكتوبر ضد العدو الاسرائيلى. كان اول من استخدم سلاح البتروا ضد الغرب. وكان يدعو الى الوحده.<br />هذا ما اعرفه عن الرجل و ما يعرفه كل مصري. اما غير هذا فلا ادري عنه شيء و حسابه عند ربه و لا املك الا ان ادعو له بالمغفره و الرحمه ."
archived = "2010-03-14"
