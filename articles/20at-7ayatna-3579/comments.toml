posted = "2008-03-21"
text = "الملك فيصل بن عبدالعزيز رجل وسياسي محنك وهذا ماقاله عنه اعدائه قبل محبيه<br />وللملك افعال لاينكرها الا شخص متخلف تابع ،،،،،<br />اما من اتهم آل سعود بانهم اعداء للامة اقول له من ضيع اراضي فلسطين وبالاخص القدس الا تهور ،،،،،،،،،<br />ومن وقع اتفاق الذل مع اسرائيل<br />ومن حاصر اهلنا في قطاع غزة<br />هذه الحقيقة ولو تغضب بعض الاشخاص لان التاريخ لايرحم ،،،،،،،،"
