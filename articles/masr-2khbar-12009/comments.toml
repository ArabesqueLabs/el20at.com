author = "ابومحسن غربة 28 سنه"
posted = "2009-05-10"
text = "احنا التلاته<br />حسني مبارك وعبود الزمر وابومحسن<br />في وقت واحد سنة<br />حسني مبارك صعد الى كرسي الرئاسة<br />عبود الزمر دخل السجن<br />وانا جيت الامارات<br />واحنا التلاته ما فيش حد فينا عارف يرجع الى حياته القديمه<br />لا حسني مبارك عارف يسيب الرئاسة<br />ولا عبود الزمر عارف يخرج من السجن<br />ولا انا عارف ارجع مصر<br />ربنا يتوب علينا احنا التلاته يا رب"
