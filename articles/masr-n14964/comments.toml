subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-04-20"
text = "بعد الإطلاع على الأوراق وسماع المرافعة وبعد المداولة<br />حيث أقامت النيابة العامة الدعوى الجزائية رقم 14832 لسنة 2007<br />ضد المتهمين:<br />1) ابتسام الحق عبدالحق<br />2) محمد ابصار بت محمد رفيع بت<br />3) محمد عرفان شجاع بت شجاع الدين بت<br />4) احتشام شوجاء بت شوجاء الدين بت<br />5) دانش بت عبدالرشيد بت<br />6) محمد حمزه مير محمد دين مير<br />7) فيصر مراد علي حاجي مراد علي<br />8) عاطف ظفر ظفر احمد<br />9) تجمل جوهر محمد طلعت<br />10) شاهد بت محمد رياض بت<br />11) احمد سراج الدين<br />12) عديل شوجاع بت شوجاع<br />لأنهم بتاريخ 24/8/2007 وسابق عليه بدائرة مركز شرطة بردبي<br />اولا: زوروا صورة بطاقات عمل منسوبة لوزارة العمل والشؤون الاجتماعية وقاموا باستعمالها على النحو المبين بالأوراق<br />ثانيا زوروا شهادات راتب منسوبة لشركة برايت تايم على النحو المبين بالأوراق<br />ثالثا زوروا صور جوازات سفر علاوة على تزوير بطاقات العمل المبينة بالبند \"أولا\" وشهادات الراتب المبينة في البند \"ثانيا\" وتقدموا من خلالها بطلبات حصول على بطاقات ائتمانية ودفاتر شيكات من بنوك عديدة وتمكنوا من خداع تلك البنوك والحصول منها على تلك البطاقات والدفاتر واستولوا من خلالها على مبالغ مالية كبيرة على النحو المبين بالأوراق.<br />رابعا\" استعملوا البطاقات الائتمانية المبينة في البند ثالثا\" ونسبوها لأنفسهم وذيلوا الإيصالات الخاصة بها بإمضائهم على النحو المبين بالأوراق.<br />وطلبت عقابهم بالمواد 45، 47، 121/1، 216/4، 6، 7، 217، 217 مكرر، 222، 399/1 من القانون الاتحادي المعدل رقم 3 لسنة 1987 بإصدار قانون العقوبات ومحمد أول درجة قضت بتاريخ 29/1/2008.<br />اولا: حضوريا بمعاقبة كل من ابتسام الحق عبدالحق ومحمد ابصار بت محمد رفيع بت ومحمد عرفان شجاع بت شجاع ودانيش بت عبدالشهيد بت وعاطف ظفر ظفر احمد بالسجن ثلاثة سنوات وابعادهم عن البلاد.<br />ثانيا: غيابيا بمعاقبة احمد سراج الدين وعديل شوجاع بت شوجاع بالسجن خمس سنوات وابعادهما عن البلاد.<br />ثالثا: حضوريا ببراءة كل من احتشام شوجاع بت ومحمد حمزه مير محمد وقيصر مراد علي حاجي وتجمل جوهر محمد طلعت وشاهد بت محمد رياض.<br />رابعا: بمصادرة جميع المضبوطات<br />فلم يرتض المحكوم عليهم الثلاثة الأول والخامس والثامن هذا الحكم وطعنوا عليه بوكيلهم بالاستئناف رقم 559/2008 بتقرير اودع في 6/2/2008.<br />كما طعنت عليه المحكوم عليها الاولى بالاستئناف رقم 456/2008 بالتقريرالحاصل في 30/1/2008 والمحكوم عليه الثالث بالاستئناف رقم 459/2008 بالتقرير الحاصل في30/1/2008 والمحكوم عليه الخامس بالاستئناف رقم 464/2008 بالتقرير الحاصل في 30/1/2008 والمحكوم عليه الثامن بالاستئناف رقم 467/2008 كما طعن عليه كل من احتشام شوجاء ومحمد حمزه وتجمل جوهر وشاهد بت وترتيبهم في قرار الاحالة: 4، 6، 9، 10\" بوكيلهم بالاستئناف رقم 563/2008 بتقرير اودع في 6/2/2008.<br />وبالجلسة المحددة لنظر الاستئنافات الستة لم يحضر المتهم المستأنف محمد ابصار بت وترتيبه الثاني في أمر الاحالة ـ رغم اعلانه قانونا، ومثل كل من المتهمين ابتسام الحق ومحمد عرفان ودانش بت وعاطف ظفر وترتيبهم في قرار الاحالة \"1، 3، 5، 8\" وانكروا ما اسند اليهم من اتهام.<br />وحضر محاميا موكلا معهم وعن كل من المتهمين احتشام شوجاء ومحمد حمزه وتجمل جوهر، وشاهد بت ـ وترتيبهم في قرار الاحالة \"4، 6، 9، 10\".<br />والمقضي ببراءتهم ـ وقدم مذكرتي دفاع وحافظة مستندات، ودفع في مذكرة الدفاع المقدمة ضد عن المتهمين المقضي بادانتهم ـ ابتسام الحق، محمد ابصار، محمد عرفان، دانيش بت، عاطف ظفر، بانتفاء اركان جريمة التزوير واستعمال محرر مزور في حقهم وانتفاء علمهم بها بدلالة انكارهم ما اسند اليهم وما ورد بتقرير المختبر الجنائي من ان جميع المضبوطات لم يتبين وجود تزوير بها سوى عدد 32 بطاقة عمل والتي تم ضبطها في احدى الشقق المؤجرة للمتهم الحادي عشر احمد سراج الدين ولم تكن في حيازة ايا من المتهمين الآخرين فضلا عن عدم وجود سوابق للمتهمين واعالتهم لأسرهم والتمس في ختامها اصليا البراءة واحتياطيا استعمال الرافة والغاء تدبير الابعاد.<br />وحوت حافظة المستندات المقدمة صور احكام جزائية صادرة من محاكم دبي كما التمس في ختام مذكرته المقدمة عن المتهمين المستأنفين المقضي ببراءتهم بالغاء ما قضى به الحكم المستأنف من مصادرة المضبوطات الخاصة بهم تاسيسا على ان المضبوطات لا تتعلق بموضوع الدعوى ولم يتم استخدامها في جريمة وانما هي ممتلكات شخصية عبارة عن هواتف متحركة ومبالغ نقدية وكمبيوتر محمول وحقيبة امتعة وبطاقات عملهم واوراق ومستندات اخرى وطلبت النيابة العامة رفض الاستئنافات الستة وقررت المحكمة ضمهم ليصدر فيهم حكم واحد بجلسة اليوم.<br />وحيث انه لما كان الثابت ان المتهم المستأنف محمد ابصار بت وترتيبه الثاني في قرار الاحالة ـ محكوم عليه بعقوبة مقيدة للحرية ولم يتقدم للتنفيذ قبل الجلسة المحددة لنظر الاستئناف رغم اعلانه قانونا الأمر الذي يتعين معه والحال كذلك القضاء في الشق الخاص باستئنافه رقم 559/2008 بسقوطه اعمالا لنص المادة 238 من قانون الاجراءات الجزائية.<br />وحيث انه عن الاستئناف رقم 559/2008 في الشق الخاص بالمتهمين ابتسام الحق ومحمد عرفان ودانيش بت وعاطف ظفر وباق الاستئنافات ارقام 456 + 459 + 464 + 467 + 563/2008 قد حازت اوضاعها المقرره قانونا فهي مقبوله شكلا.<br />وتنوه المحكمة بداءة الى ان المذكرة المقدمة من المحامي عبدالله الطاهر بخصوص كل من المتهمين المقضي براءتهم قد ورد بها اسم قيصر مراد علي حاجي، إلا ان الثابت من تقارير الاستئناف ان المذكور لم يستأنف الحكم المستأنف فيما قضى به من مصادرة ومن ثم فإن المحكمة تلتفت عن طلباته الواردة بتلك المذكرة.<br />اولا عن الاستئنافات ارقام 456 + 459 + 464 + 467 + 559 لسنة 2008 والاستئناف الاخير في الشق الخاص بالمستأنفين ابتسام الحق ومحمد عرفان ودانيش بت وعاطف ظفر.<br />وحيث ان وقائع الاتهام وادلة ثبوته قبل المتهمين المستأنفين ابتسام الحق ومحمد عرفان ودانش بت وعاطف ظفر ـ الذي قضى الحكم المستأنف بادانتهم قد سبق وان احاط بها الحكم المستأنف تفصيلا باسبابه والتي تحيل اليها المحكمة وتعتبرها جزءا مكملا لاسبابها وتوجزها في ورود معلومات الى الادارة العامة لامن الدولة تفيد بأن المتهمين ابتسام الحق عبدالحق/، ومحمد عرفان شجاع، ودانش بت عبدالرشيد، وعاطف ظفر ظفر، وترتيبهم في قرار الاحالة 1، 3، 5، 8 ـ يقيمون في الدولة ويكونوا فيما بينهم وبين متهمين آخرين وهم محمد ابصار بت، احمد سراج الدين، عديل شوجاع ـ وترتيبهم في امر الاحالة 2، 11، 12 تشكيلا عصابيا لتزوير بطاقات العمل وشهادات الراتب وجوازات السفر للحصول على بطاقات ائتمانية ودفاتر شيكات من عدة بنوك حتى يتمكنوا من الاستيلاء من خلالها على مبالغ مالية من هذه البنوك، وانهم يتخذون من شركة برايت تايم ستارا لأعمالهم غير المشروعة سالفة الذكر واستغلال اسم الشركة في تعاملات بنكية مشبوهة حيث يحصلون على صور ضوئية لجوازات سفر لاشخاص آخرين ويقومون بتغيير بياناتها وتزوير شهادات راتب، وبطاقات عمل، ويحصلون بموجب تلك الأوراق المزورة على بطاقات ائتمانية من عدة بنوك ثم يقوموا بالاستيلاء على المبالغ التي تتيحها تلك البطاقات بالاحتيال على هذه البنوك عن طريق سحب بعض المبالغ المالية نقدا او عن طريق استخدام البطاقات الائتمانية في الشراء من المحلات التجارية وقد أكدت التحريات صحة تلك المعلومات، كما دلت على ان المتهمين يقيمون في الشقة رقم 118 الكائنة ببناية تلال \"6\" بمنطقة السطوة بدبي ويتخذون منها مقرا لعملهم غير المشروع وبناء على تلك التحريات اذنت النيابة العامة بالقاء القبض على المتهمين وتفتيش الشقة التي يقيمون بها سالفة الذكر ونفاذا لاذن النيابة العامة تم ضبط كل من المتهمين الاولى ابتسام الحق والثالث محمد عرفان والخامس دانش بت، وكذا الثاني محمد ابصار والذي قضت المحكمة بسقوط الاستئناف ـ وبتفتيش الشقة الماذون بتفتيشها عثر بداخل الصالة على عدد 39 هاتف نقال يقوم المتهمين باستخدامهم في تزويد كل بنك يتقدمون اليه بطلب الحصول على بطاقة ائتمانية برقم احد هذه الهواتف، كما عثر على جهاز حاسب آلي محمول من نوع “aser” وعدد \"3\" اختام وبطاقات عمل وبطاقات ائتمان وبطاقات غير مدون بها اية بيانات ودفاتر شيكات وأظفر بداخل كل منها دفتر شيكات وبطاقة ائتمان وطلبات للحصول على بطاقة الائتمان وكشوفات صادرة من عدة بنوك بل حركة حسابات باسماء اشخاص مختلفة وجهاز حاسب الي من نوع كومباك \"هارد دسك\" وجهاز برينتر وحقيبة سوداء بها دفاتر شيكات لعدة بنوك وعدد \"12\" ختم لعدة شركات، وعدد 38 قرص مدمج ومبلغ \"500ر78 درهم\" وعدد 19 جواز سفر باكستاني وعدد 2 جواز سفر بنجلاديش وبتفتيش المتهم دانش بت ضبط معه عدد 3 بطاقات ائتمانية غير عائدة له، وبتفتيش شركة برايت تايم للمعارض الكائنة بالشقة رقم 201 بناية صرافه عيسى الانصاري بشارع الضيافة تم ضبط عدد \"2\" جهاز حاسب الي \"هارد دسك\" وجهاز حاسب الي محمول من نوع Hp وثلاثة اقراص مرنة \"فلوبي\" وعدد 11 قرص مدمج وعدد ثلاثة اقراص مدمجة صغيرة الحجم وعدد 3 ذاكرة تخزين بيانات وعدد 8 قطع لأجهزة حاسب آلي وارشد المتهم المستأنف محمد عرفان رجال الشرطة عن المتهم المستأنف عاطف ظفر وانه يعاونه في عمليات التزوير حيث تم ضبط الاخير في الشقة رقم 105 الكائنة بمنطقة الضيافة وبمواجهة المتهمين اقروا بما اسند اليهم.<br />وحيث ان الواقعة على التصوير السابق قام الدليل على صحتها وسلامة اسنادها الى المتهمين من شهادة النقيب محمد عباس مراد عبدالله واعتراف كل من المتهمين ابتسام الحق عبدالحق ومحمد عرفان شجاع ودانيش بت وعاطف ظفر بمحاضر جمع الاستدلالات ومما ثبت بتقرير المختبر الجنائي.<br />قسم فحص المستندات من ان عدد 32 بطاقة عمل بيضاء اللون المنسوب صدورها الى وزارة العمل والشئون الاجتماعية مزورة وتقرير الادلة الجنائية وهي الأدلة التي اورد مؤداها تفصيلا الحكم المستأنف في اسبابه وتحيل إليها المحكمة بما يغني عن اعادة ترديدها.<br />وحيث انه لما كان القانون لم يرسم لجريمة التزوير واستعمال المحرر المزور طريقة اثبات خاصة يتعين على المحاكم الجنائية انتهاجها وانما العبرة في اثباتها بما تطمئن اليه المحكمة من الادلة السائغة، وكان من المقرر ان لمحكمة الموضوع ان تاخذ بأقوال المتهم في حق نفسه وفي حق غيره ولو كانت واردة في محضر الشرطة متى اطمأنت الى صدقها ومطابقتها للواقع ولو عدل عنها في مراحل التحقيق الاخرى وكان وزن أقوال الشهود وتقديرها مرجعه الى محكمة الموضوع تنزله المنزلة التي تراها وتقدره التقدير الذي تطمئن اليه بغير معقب، وكان لا يشترط لصحة الحكم بالادانة في جرائم التزوير ان يتحدث عن كل ركن من اركانها استقلالا ما دام قد اورد من الوقائع يدل عليه وكانت محكمة اول درجة قد اوردت الادلة على ارتكاب المتهمين لجرائم التزوير واستعمال المحررات المزورة من اعتراف المتهمين بمحضر جمع الاستدلالات وشهادة النقيب محمد عباس بالتحقيقات ومما ثبت بتقرير المختبر الجنائي والادلة الجنائية بشأن فحص المضبوطات وكان المتهمون لا يعارض ايا منهم في ان الوقائع والادلة التي اوردها الحكم المستأنف لها معينها من الاوراق فان الحكم المستأنف يكون قد بين واقعة الدعوى بما تتوافر به عناصرها القانونية وادلة ثبوتها ويعدو ما ينعاه كل من المتهمين عليه من قالة القصور في التسبيب او الفساد في الاستدلال محض جدل موضوعي في تقدير الدليل وهو ما تلتفت عنه المحكمة وتقضي برفضه.<br />وحيث ان المحكمة لا تعول على انكار المتهمين بجلسة المحاكمة اذ لا يعدو ان يكون مجرد دفاع منهم قصدوا به نفي الاتهام عنهم ولا تاثير له على عقيدة المحكمة فيما اطمأنت اليه من ادلة الثبوت السابق ذكرها.<br />وحيث انه لما كان ما تقدم وكان الحكم المستأنف قد انتهى سديدا الى ادانة المتهمين واعمل صحيحا الارتباط بين الجرائم المسندة اليهم وعاقبهم باشدهم عقوبة وهي جريمة التزوير في اوراق رسمية وانزل بهم عقوبة تتفق والحد القانوني لتلك الجريمة ومن ثم يكون في محله وتقضي المحكمة بتأييده.<br />ثانيا: عن الاستئناف رقم 563 لسنة 2008<br />وحيث انه لما كان المشرع قد اجاز الامر برد الاشياء المضبوطة اما من النيابة العامة او من المحكمة المختصة بنظر الدعوى الجزائية اثناء نظرها \"م 82 اجراءات جزائية\" وكان من المقرر وفقا لنص المادة 81 من القانون سالف الذكر ان الاشياء المضبوطة ترد الى من كانت في حيازته وقت ضبطها حتى ولو لم يكن هو مالكها.<br />لما كان ذلك، وكان الثابت من الاطلاع على محضر ضبط الواقعة انه بناء على الاذن الصادر من النيابة العامة انه تم تفتيش الشقة رقم 118 الكائنة في بناية تلال \"6\" بمنطقة السطوة حيث كان متواجدا بها خمسة اشخاص وهم ابتسام الحق ومحمد ابصار ومحمد عرفان واحتشام شوجاء ـ مستأنف ـ ودانش بت وتم العثور على عدد 39 هاتف نقال وحقيبة سوداء بها جهاز حاسب الي محمول من نوع “aser” اسود اللون وعدد \"3\" اختام وبطاقات عمل وبطاقات ائتمان وبطاقات خالية من البيانات ودفاتر شيكات وكشوفات صادرة من عدة بنوك وجهاز حاسب الي \"كومباك\" وجهاز فض اللون \"برنتر\" وملكية مركبة ورخص قيادة وحقيبة سوداء بها دفاتر شيكات وعدد \"12\" ختم تابعة لعدة شركات وعدد 38 قرص مدمج ومبلغ 500ر78 درهم وعدد 21 جواز سفر باكستاني كما تم تفتيش الشقة رقم 201 بشارع الضيافة وعثر بها على مضبوطات اخرى عبارة عن عدد 2 جهاز حاسب الي وجهاز حاسب الي محمول واقراص مدمجة ومرنه وعدد 2 ذاكرة تخزين البيانات وعدد \"8\" قطع لاجهزة الحاسب الالي.<br />وتم تفتيش الشقة رقم (111) بناية تلال \"6\" حيث كان بداخلها كل من حمزه مير وقصير مراد ولم يتم العثور بها على أي شيء، وتم تفتيش الشقة رقم 105 بمنطقة الضيافة ولم يعثر بها على أي شيء وكان بداخلها كل من عاطف ظفر وتجمل جوهر وشاهد بث.<br />وحيث انه بالاطلاع ايضا على محضر جلسة المحاكمة امام محكمة اول درجة المؤرخ 16/12/2007 تبين ان المحكمة فضت احراز المضبوطات في مواجهة المتهمين جميعا فانكروا صلتهم بها.<br />لما كان ما تقدم وكان الثابت ان المضبوطات جميعا شائعة بين المتهمين جميعهم ولم يثبت انها قد ضبطت بحوزة من قضى ببراءتهم ولم يقدم ايا منهم الدليل على حيازته للمضبوطات التي لم تستخدم في ارتكاب الجرائم موضوع الدعوى أو ملكية لها كما جاء طلبهم بشأنها مجهلا ولم يحددوا المضبوطات تحديدا الواجب ردها من جملة ما تم ضبطه وسند حيازته لها، هذا فضلا عن ان المتهمين جميعهم قد انكروا صلتهم بالمضبوطات التي عرضت عليهم بجلسة المحاكمة امام محكمة اول درجة ومن ثم يكون الاستئناف القائم على الغاء ما قضى به الحكم المستأنف من مصادرة وهو في حقيقته طلبا برد المضبوطات في غير محله وتقضي المحكمة برفضه."
