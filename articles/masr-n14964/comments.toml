text = "قال ميت الف جنيه قال<br />انتوا ما تعرفوش انا ابقى مرات مين<br />انا ابقى مرات اشرف مروان سوريييييييي المليونير اشرف مروان<br />قال ميت الف جنيه قال<br />دا انا حبعت الخدام بتاعي يروح يدفعهم للمحكمة"
