subject = "أش خاصك أ العريان"
author = "مغربية في بلاد العجم"
posted = "2007-04-04"
text = "المغرب، بلد المتناقضات ، بلدي، 25 سنة عشتها فيه و اليوم لا يشدني اليه الا تواجد الاهل ، و لا احن فيه الا لبراد الشاي و الزربية و السوق، ليس هناك ما يجعلني اتنهد عليه كلما تذكرته و لا ما يجعلني اتحسر على برد اوروبا و على زوج يكبرني ب22 سنة ، كل هذا ما هو الا ضريبة دفعتها و يدفعها ملايين المغاربة كل يوم للهروب من بلد ليس لنا فيه ابسط الحقوق...فإما ان تموت جوعا و تعيش شريف و اما ان تقول ماذا يجدي الشرف في وطن فقد عذريته و تلتحق بطابورات الظواهر التي لا تعد و لا تحصى، المغرب لا ينقصه البطاقة الذكية لنشود الكمال المفقود فالحمد لله عايشين مع البطاقة البليدة ، ما ينقص المغرب هو ذكاء الحكومة و المسؤولين الذين يغمضون العيون على دهن السير يسير في كل المجالات ، في السير و النتيجة الحوادثو ملايين الضحايا بسبب الرشاوي و القهيوات، في الادارات حدث و لا حرج حتى منهم من يقول ديرها فالقصبة و جيبها بالغياطة و نشدها و النتيجة انتظار ايام و اسابيع من اجل ورقة تثبت انك حي ليس ميت و المشكلة انك ان لم تفهم راسك و تخرج القهوة من جيبك فقد تموت حسرة قبل اخذها و بذلك سياتي اهلك لاخراج شهادة وفاتك و سيتكرر معهم نفس الشيئ، المغرب و البطاقة الذكية ، مشكلة المغرب انه دائما يريد ان يظهر للغرب انه يواكب التطور و ان النساء يتمتعن بالحقوق و يسقن السيارات و يفهمن المدونة وووو لكن عن اي مغرب ة عن اي نساء نتكلم ، انه مغربهم لا مغربنا و نساؤهم و لسن نساءنا، مغرب من يكنز الملايين من عرق الشعب ، اما الغالبية فهم مساكين يتقاتلون من اجل لقمة العيش لا يفقهون من المدونة و من التنمية الشاملة اي شيئ و لهم الحق فكل ما يقوم به المغرب من مبادرات لفئة معينة غالبا ما تكون اسماؤهم برادة او بناني او العلوي او بنشقرون اما غالبية الشعب من و الفلاقي و شقوف و غيرهم فل الدكاكة كما كانت لابائهم و لهم البطاقة الذكية هدية على بلادتهم."
