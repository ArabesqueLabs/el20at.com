[[comments]]
order = 0
subject = "كنت فى الحرم وواحد ماسك المحمول وبيشرح لامة هو فين وبيعمل اية وشايف اية"
author = "ساخن"
text = "خط ساخن اية وخط بارد اية - اية الهيافة دى - خط ساخن واكن البيت الابيض هيكلم الرئيس الروسى - ما كل حاج معاة موبايل<br />المهم التنظيم - يروحوا يشوفوا جمال الحجاج وتنظيمهم سواء الحجاج الاتراك او حجاج شرق اسيا ماليزيا واندونسيا وغيرهم<br />اللبس الموحد الجميل - كل حاجة معاها شنطة فيها كتاب الادعية والمصحف وزجاجة مياة وكل مجموعة لها مشرف لو واحدة تاهت بيطلعها بلبسها المميز الجميل من وسط مليون وكل حاجة تضع على راسها وردة بلون المجموعة بتاعتها وتتشاف من اخر الدنيا<br />انا انبهرت من شياكة وتنظيم حجاج شرق اسيا وتركيا وحجاج حزب اللة بلونهم الاصفر<br />اما المتاخن بتوعنا اللى لا بسين جلابيب النوم ونايمة فى الحرم كانها نايمة جنب السيد البدوى او السيدة فتدل على فوضى التنظيم وفوضى الادارة<br />الحق يقال فية جمعية طالعة من المنوفية كانت موحدة اللبس ومنظمة جدا لانها اهلية وبعيد عن تنظيمات الداخلية بتوع الخط الساخن"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207000005/http://masr.20at.com:80/newArticle.php?sid=18735"

[[comments]]
order = 1
subject = "ومع كل بعثة للحج وعاظ وائمة يشرحون للناس كيف يقيمون الشعائر"
author = "عادل"
text = "الا فى مصر<br />البعثة المصرية للحج مفيش فيها وعاظ<br />مفيش احد يشرح للناس كيفية اقامة الشعائر وفى المكان دة نقول اية ونعمل اية وندعى ازاى<br />مفيش مع الحجاج الا ضباط شرطة<br />300 ضابط شرطة<br />اية الهنا دة<br />الناس مش ضباط شرطة الناس عايزة وعاظ ودكاترة تعالجهم لما يمرضوا واداريون لتسهيل الخدمات والتنقلات من مكة للمدينة ومن منى الى عرفة<br />انما الدولة بتصرف عشرون 20 مليون جنية على البعثة وكل ضابط شرطة بيجيب قرايبة يحجوا على حساب المعلم"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207000005/http://masr.20at.com:80/newArticle.php?sid=18735"
