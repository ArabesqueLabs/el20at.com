[[comments]]
order = 0
subject = "مصر تتبرىء من هذة الشخصية"
author = "احمد صالح_صحفى معارض"
text = "هذة الشخصية المفروض ان تعدم فى ميدان عام دة اقل واجب علية وكنت اتمنى ان يكون العنوان جاسوس مصرى بيحب اسرائيل او اسرائيلى قذر بيحب اسرائيل لكن مصرى بيحب اسرائيل مصر والمصريين لا يشرفهم خروج هذا الشخص من مصر ربنا ساخد الجواسيس والاشكال المن عينت مجدى علام دة ويريحنا منهم كتكم الارف مالتوا البلد"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820100556/http://masr.20at.com:80/newArticle.php?sid=11081"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
text = "المفروض ان ادارة الموقع لا تنشر اى تعليق الا بعد مراجعته واقول لصاحب التعليق الثانى ان هذا كلام بذىء لا يجوز كتابته باى حال من الاحوال"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820100556/http://masr.20at.com:80/newArticle.php?sid=11081"

[[comments]]
order = 2
subject = "ليس الاسم هو المستفز ولكن الشخص نفسه هو المستفز"
author = "عبدالمنعم المصرى مقيم بالمهجر"
text = "لا يهم كثيرا ان نعلق على كل من هب ودب وكتب كام كلمة علشان ترضى عنه الصهيونية وحماتها ؟؟ هذا البنى آدم هو نكرة لا يستحق التعليق وبصراحة ما كان يجب على القائمين على هذا الموقع ان يكتبوا اسم هذا المعتوه . ويعنى بحسبة بسيطة وهو عمرة الان 55 سنة يعنى وقت ان كان عبد الناصر يحكم مصر كان هو بيلبس بنطلون شورت يعنى نص والكلمة دى بيعرفها الكبار شوية فى العمر والشىئ التانى ان لولا عبد الناصر ما كان هو ولا اللى خلفوه بيتعلم وبيروح الجامعة والان مادام مصر اصبحت تشتم وتنتقد من كل الصعاليك فها هو صعلوك آخر يدلى برايه ..<br />انا ارجوكم قبا ان تنشروا اراء متل هذا النكرة ان تراجعونها لانه حرام يتحسب هذا البنى آدم على مصر<br />واشكركم"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820100556/http://masr.20at.com:80/newArticle.php?sid=11081"

