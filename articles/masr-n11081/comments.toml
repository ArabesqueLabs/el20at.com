[[comments]]
order = 6
subject = "ضع عنوان التعليق"
text = "أنا مش شايف فيها أى مشكله \"لا اكراه فى الدين قد تبين الرشد من الغى فمن يكفر بالطغوت ويؤمن بالله فقد استمسك بالعروة الوثقى لا انفصام لها والله سميع عليم\"<br />وما الفائده من اعدامه يا أخى أحمد المليار ونص نقصو واحد؟ عندما يشهر المنافقين اسلامهم فى سبيل التزوج من مسلمات ثم ينجبون ثم يخرجون عن الاسلام هنا نقول انهم يعدمون - وقس على ذلك اذا تنصر مسلم فى سبيل التزوج بفتاه مسيحيه ومن ثم اكراهها وأولادها لى الدخول فى الاسلام ارى ان الاعدام هى العقوبه البديهيه لمثل أولئك لأنهم خانو عهودهم فى المسيحيه والاسلام<br />هناك مسيحيون يحبون هذا الوطن ويعشقون ترابه اعتقلوا وتعذبو على ايدى الانظمه الفاشيه وصارعوا وناضلو وقهرو وعذبوا اضعاف ما عاشه مجدى علام بل انهم من المدافعين للقضيه الفلسطينيه اكثر من من كثير من المسلمين السلبيين وهذا الشخص لا يؤخذ حجه على مسيحييى مصر ومسلميها<br />يا مجدى \"وكل انسان الزمنه طائه فى عنقه ونخرج له يوم القيامة كتابا يلقاه منشورا اقرأ كتابك كفى بنفسك اليوم عليك حسيبا\"<br />انت حر"
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401232659/http://masr.20at.com:80/newArticle.php?sid=11081"
