subject = "دى الطبيعة البشرية للمصريين - هنمشى ضد الطبيعة لية"
author = "حمبوزو لاوى بوزو"
posted = "2008-11-13"
text = "طبيعة الست المصرية هى الحشمة - تحب تلبس مستور<br />انما الفرنجة المزيفة اللى كنا عايشين فيها لفترة فدى موضة كانت ضد الطبيعة وانتهت<br />اللبس مالوش دعوة بالاخلاق - دى نقرة ودى نقرة<br />الحرامى فى بلدنا لما ييجى يطلع على المواسير بتاع المجارى علشان يسرق شقة بيقول استرها المرة دى يارب - حرامى وبيطلب ستر ربنا<br />فا الاخلاق غير اللبس وغير السلوك<br />محدش يتفلسف ويقول اية فايدة انها محجبة ومنحرفة<br />الحجاب مطلوب اخلايا وجماليا<br />وحتى ستات النصارى فى الصعيد زمان كانوا بيلبسوا العباية ويمشوا خيمة متحركة - اللبس مش دين بس ولكن اخلاق ايضا<br />وانا اعرف انة لولا التضييق من الادارة على المحجبات فى التليفزيون لتحجبت جميع المذيعات<br />ولكن للظروف احكام"
archived = "2010-03-14"
