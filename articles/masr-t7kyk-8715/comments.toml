subject = "خلاص يا مروة الاضراب خلص"
author = "مش شريف ولا براء"
posted = "2008-04-08"
text = "خلاص يا مروة الاضراب خلص بسرعة كده<br />بس يا مروه انا كنت حاسس وانا بقرأ مقالاتك عن الاضراب انك كنتي فرحانه اوي من اللي بيحصل ونفسك البلد تولع نار وتتحرق والمسلمين والمسيحيين يضربوا في بعض والوطني والاخوان يقتلوا بعض والامن المركزي يضرب في الجيش والجيش يضرب في الطيران والطيران يضرب في البحرية<br />كنت حاسس انك نفسك حاجه كبيرة تحصل في البلد"
