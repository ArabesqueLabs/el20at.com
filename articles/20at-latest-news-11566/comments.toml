subject = "الله اكبر"
author = "اردني الاصل وافتخر"
posted = "2009-03-25"
text = "هذا هيكل انسان معوق اكيد ما شاف نفسه بالمراه قبل البرنامج<br />كل الدنيا وخاصة العرب حاسدين الاردن على امنها واطمأنانها ومو جايه بحدا<br />والمصري يحسد القرد عحمار صرمه مشان الفلوس بتاعتهم<br />حتى الفلسطيني حامل الجنسيه الاردنيه يشتم الاردن برا ليش ؟ لانها ضبته وضبت اهله من قبله"
