posted = "2009-03-15"
text = "يعني الواحد اتشحن ضد الراجل من الكلام ده<br />لكن عايزة أعرف ايه اللى قاله أصلا وضايقهم كده<br />وطبعا ياريت نذكر الرد عليها من خبراء التاريخ أو السياسيين مثلا"
