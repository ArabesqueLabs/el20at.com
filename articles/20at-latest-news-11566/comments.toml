[[comments]]
order = 1
subject = "هذا  مرتزق بتاع كلام وكلام بس"
author = "النواصرة - كفرخل"
posted = "2009-03-15"
text = "للاسف هذا الشخص ليس مؤرخا ولا عالم تاريخ والتاريخ علم وفن وهذا لا علم له ولا فن الا الردح والكذب للعيش على فتات الجزيرة ولا اعتب الا على شيوخ قطر ووجهاء القبائل وهي نبراس في العرب ان تسمح بهذه المسرحيات على ترابها في الدوحه وان يتحدث الإمعه في أمور لا يفهم فيها ولا يعرف عنها شيء"
