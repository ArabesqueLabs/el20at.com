subject = "GO GO A HEAD 20"
author = "شرين منصور"
posted = "2007-04-26"
text = "السلام عليكم عشرينات هو عنوان للتقدم والتطوير بعد ان كان لايتقدم جاء تقدمك مفاجاة جميلة لكل العشرينات زاد عليه الاقبال بعد التطوير الذي حدث والاضافات الجديدة التي قمتم بها كعرض أفلام تسجيلية قصيرة كانت نقطة تحتسب لتاريخ الموقع وتقسيمات المواضيع تحت أبواب منوعة ومختلفة ككلقم رصاص و ولاد البلد وعبقرينو وغيرها من الابواب وذلك كله بجانب الموضوعات القوية جدااا والتي يتعرض محرريها بطريقة محايدة وقوية ،ثم ارى السير في خطى التطو ير حيث جئتم بتغير (ولاد البلد) الأقرب لنا ،حيث سمحتم لنا بالكتابة والتعليق والمشاركة ايضا في عرض ما نكتبه وهذانفراد من وجهة نظري في (أضف رقعة)و(قول كلمتك)والأجمل (ايدك معانا)فهي فرصة لاكتشاف المواهب بصراحة كل الاقتراحات دي واللي جتتنفذ فاقت كل تصوراتنا بجد نتمى ان يتعمل ندوات لعشرينات تتواصل من خلالها مع الشباب وجها لوجه ويبقى في القاهرة واسكندرية وغيرها لأن في ناس كتير للاسف الشديد مش عارفة الموقع ..مبروووووك يا عشرينات التجديد ودايما في تطور وتقدم والاهم في انفراد دايم GOOOOOOOOOOOOOOOOOOOO A HEAD 20"
archived = "2010-03-14"
