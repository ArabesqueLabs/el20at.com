[[comments]]
order = 0
subject = "أنا برضو"
author = "أنا"
text = "حلوه الفكره دى جامده جدا ولذيذه فى طرحها صحيح رغم ان الحجر جما الا انه فى كثير من الاحيان يتحكم فى عبقيرة الناس كالنحات ودماغهم كعشاق الشيشه وحتى عند بناء شركه ما او مبنى ما يقولون وضع حجر الاساس اممم جامد بجد الموضوع اوىىىىى"
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150158/http://masr.20at.com:80/newArticle.php?sid=11007"

[[comments]]
order = 1
subject = "موضوع مقرف..ومش ضرور"
author = "محمد"
text = "بقترح على كاتب الموضوع إنه يتجوز الشيشة لعلها تطفي ناره المكبوته...بصراحة موضوع مقزز<br />وبالنسبة للأخ مش ضروري هو فعلاً انت مش ضروري ومش مهم ومش حاجة خالص....<br />الدكتورة زينب عبد العزيز دكتوراة من جامعة السوربون في تخصص مقارنة الاديان واشتغلت فترة طويلة مدرسة في الجامعة دي..وواضح إنك مسيحي معقد من إلي بيبخوه في دماغكو في الكنيسة...عيشو معانا بقى في وطن واحد وبطلو العزلة والتقوقع إلي انتو فيه ده.."
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150158/http://masr.20at.com:80/newArticle.php?sid=11007"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "و الله فعلاً موضوع اهب<br />انت يا عم العبيط<br />ايه الهبل اللي انت كاتبه ده<br />عمال تكتب عن الشيشة تفاح و ان صاحبك اتنرفز لما الحجر اتأخر عليه<br />عليك و على صاحبك الأهبل ده<br />طب انت عارف لو شفتك في فيصل و الله لضربك على هبلك ده<br />عمال تكتب عن الشيشة و ناسي الشباب الل متبهدل في حياته و الناس الل بتموت من الجوع<br />يا شيخ اتنيل<br />و النبي يا ريت تكون فعلا قدوة مهنة الصحافة لابد و ان يكون صاحبها قدوة انما انت احسنلك تروح تبيع ترمس عالكورنيش"
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150158/http://masr.20at.com:80/newArticle.php?sid=11007"

[[comments]]
order = 3
subject = "اختراع البسمة"
author = "اضحك"
text = "مالكم يا جماعة؟ فيه اختراع اسمه انتزاع البسمة، والراجل بيتكلم عن شوية افكار، ربط فيها بني حجر الشيشة القاتل والحجر اللي يقدر يعمل انجازات كثييييييييييييير! يعني الراجل كان قصده انا نبتسم لما نقرا الموضوع! انما لو عاوزينه جد، حد يفهمني لما سعادتك بتقعد قدام ماتشات الكورة ويتحرق دمك انت واهلك، بتستفيدوا ايه؟ سواء كسب او خسر؟!.. وحد يفهمني لما بتقعدوا تشتروا الجرايد اللي مليانة كذب ونميمة على الممثلات بستفيدوا ايه؟<br />الحكاية ببساطة انها موضوعات خفيفة تخفف عننا الغم اللي حوالينا.. ولكل مقام مقال يا سادة!"
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150158/http://masr.20at.com:80/newArticle.php?sid=11007"

[[comments]]
order = 4
subject = "ارحمونا"
author = "كماتشو"
text = "والنبي الجماعة المعقدين يسيبونا في حالنا! فيه اماكن كتير للموضوعات المجعلصة عن الارهاب والكباب والمسيحيين والبطيخ! ايه اللي جاب الكلام ده هنا؟! فين ادارة الموقع؟ وبعدين الاهبل اللي بيقول على الكلام ده انه هبل، باين عليه هو اللي اهبل عشان ما بيعرفش يقول ايه امتى وفين؟.. والنبي ترحمونا وبعدين ايه اللي جابك هنا اساسا؟ ما عندك موضوعات فلسطين وزينب عبد العزيز وغيرهم ما تروح تقراهم هناك؟.. ما عجبكش الكلام اقلب القناة!.."
archived = "2007-07-12"
capture_url = "https://web.archive.org/web/20070712150158/http://masr.20at.com:80/newArticle.php?sid=11007"
