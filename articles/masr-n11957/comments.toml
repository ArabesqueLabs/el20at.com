[[comments]]
order = 0
subject = "مشكلتك مشكلة جيل من الاباء للاسف اتربوا على كدة"
author = "احمدابوصالح(صحفى)"
text = "مشكلة شغل الاعلام انة بيطلب الشغل احيان كتيرة ليلا ومش مهم الوقت بس للاسف العادات والتقاليد عندنا ان البنت عيب تتاخر عشان الجيران يقولوا اية وكمان الذائاب الجائعة الموجودة فى الشوارع وحاجات كدة كتير<br />فالحل فى وجهة نظرى المتواضعة هو الشغل نهارا فقط زى مثلا صحفيات الجرائد القومية او حتى الحزبية وبلاش يكون فى الاعلام والتلفزيون بكدة تكون حققتى رغبت ومضاقتيش العائلة ... هو دة العندى من حل وربنا يوفقك ويوفق الجميع"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027143652/http://masr.20at.com:80/newArticle.php?sid=11957"

[[comments]]
order = 1
subject = "يا محترم لنا تقاليد من زمان"
author = "واحد من الشارع"
text = "الاب والام لا يتكلموا من فراغ<br />تلك عادات شعبنا ورثناة ابا عن جد<br />البنت لها حدود والست لها حدود والرجل لة حدود<br />اعرف طبيبة ماهرة جدا وتخطت الخمسين ولم يتقدم لها احد رغم انها ذات جمال لانها فضلت النجاح فى العمل والسهر فى العيادة حتى منتصف الليل<br />عملت فلوس اة - حققت ذاتها نعم - بنت عمارة نعم<br />ولكنها لم تسمع كلمة ماما من طفلة او طفل لها<br />لنا عادات يجب احترامها<br />ومن يخرج عتها لايلوم الا نفسة بعد فوات قطار العمر"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027143652/http://masr.20at.com:80/newArticle.php?sid=11957"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "سيبى الشغل وبرى ابوكى وامك وإن شاء الله ربنا هيرزقك انتى وابوكى وامك ويبعتلك ابن الحلال اللى يخليكى تنطلقى فى عبادة ربنا احسن من الاعلام ويعنى مهواش يعنى مجال محترم يتزعل عليا ده مجال مشبوة وكل الناس عارفة كده وانتى من اولهم طبعا استعينى بالله وصلى صلواتك واحفظى نفسك اخوكى فى الله ومخلص والله"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027143652/http://masr.20at.com:80/newArticle.php?sid=11957"

[[comments]]
order = 3
subject = "لا تيأسى"
author = "shima"
text = "نفس مشكلتى و نفس حيرتى<br />اهلك عندهم حق لان فعلا الذئاب اللى ببتريقوا عليهم موجودين<br />و ف نفس الوقت الاخ اللى بيقول انه مش مجال عدل اوى و تسبيه احسن .... بالعكس ........ انتى ع ثغر من ثغور الاسلام و لا يخفى ع عاقل قدر الاعلام الان و انه سلاح قوى و مؤثر لقوة او ضعف الحق و الاسلام<br />اعتقد انك تستمرى ف مجال الاعلام و الميديا اللى يحقق طموحك و ف نفس الوقت تحسى انك بتتعبى من اجل شىء مفيد لدينك اللى بيهاجم دلوقتى بشراسة<br />فيه القنوات الاسلامية زى الرسالة و اقرا و مكاتبهم هنا ف القاهره و ممكن تتوصلى ليهم و تحاولى تلاقى فرصة مناسبة و العمل هناك اكيد هيراعى ظروفك كبنت مسلمة طموحة<br />ربنا يوفقك يا رب و صدقينى لو اهلك حسوا انك بتعملى شىء مفيد اوى هما اللى هيشجعوكى<br />لا تيأسى و جددى هدفك و نيتك و طموحك لله"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027143652/http://masr.20at.com:80/newArticle.php?sid=11957"

[[comments]]
order = 4
subject = "اسمعى كلامى ومدوريش بعديه"
author = "سما"
text = "بصراحه مشكلتك دى شايفه ان حلها بسيط جدا وهو انك تستمرى فى تحقيق طموحك ومتسمعيش كلام حد يقولك بن الحلال ومش ابن الحلال والا مكنتيش اتعلمتى من الاساس وقعدتى فى بيتك وكان جالك برده بن الاحلال<br />يبنتى احنا فى مجتمع زباله بجد اه والله زباله فعلا ومتعرفيش ترضى الناس ازاى وبعدين سواء سيبتى شغلك او مسيبتهوش الناس بتتكلم لا يبقي متسمعيش كلام حد وتجاهلى اى كلام تسمعيه من بره واجري ورا طموحك وسدقينى هو الى هينجحك وهيخلى الكل يجري وراكى ويحترمك الزمن دا بقى زمن كدا البنت لازم تتحدى علشان تعيش ابعدى عن الياس والانكسار الى هيضيعك وفى نفس الوقت حاولى تقنعى اهلك وقوليلهم دا شغل انا مش قاعده بتفسح او بشتغل فى كباريه دا مجال محترم ولازم تعرفوا كدا واهم حاجه اقولها دلوقتى متسمعيش لكلام الجيران ولا مش جيران سيبك كل دا كلام فاضى والله"
archived = "2007-12-27"
capture_url = "https://web.archive.org/web/20071227035514/http://masr.20at.com:80/newArticle.php?sid=11957"

