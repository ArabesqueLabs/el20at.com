text = "ميريهان<br />أوَ نحاسبهم على خوفهم علبنا<br />أوَ نتذمر من قلقهم<br />أوَ نقول ما بالهم بنا وماذا يشغلهم؟<br />طريقة تفكيرهم غيرنا ...................................... نعم<br />تعليمهم قديم................................................نعم<br />جيلهم مختلف ...............................................نعم<br />ولكنهم أولا وأخيرا ...... أبائـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــنا"
