[[comments]]
order = 1
subject = "ضعف الإبمان والعقيدة ورفاق السوء هو السبب الرئيسي"
author = "شذى شريف"
posted = "2008-02-27"
text = "بسم الله الرحمن الرحيم<br />أولا أود أن أشكر الأخ مصري على التطرق إلى هذا الموضوع ، فهو مشكلة أساسية وهامة جداً بالنسبة لمجتمعنا العربي ، المتمثل بالمبادىء والقيم الإسلامية .<br />وأنا أرى أن السبب في هذه المشكلة هو فعلاً يكمن من ضعف الإيمان الذي ينشأ عليه الفرد منذ الصغر والذي يكون الدور الأساسي لتكوينه وترسيخه داخل الفرد هو راجع للأسرة ثم للإرادة .<br />ولايمكننا أيضاً أن ننسى دور رفاق السوء في الوصول بالفرد إلى هذه الحالة ، لذا يجب أن ينشا الفرد على العقيدة و القيم منذ الصغر وعلى تعلم المسؤولية والوعي الكافي ليكون قادر على تجاوز هذه المرحلة بخير .<br />أما اللي يقع في الفترة دي فأهم حاجة التوبة الصادقة ، وخير مثل عليها ماحصل مع ثعلبة خادم الرسول (ص) حين أطال النظر لمرأة وهي تغتسل ، فأحس بالذنب ودخل جبالا بين مكة والمدينة، ومكث فيها قرابة أربعين يوماً ،وكان اذا جاء جوف الليل خرج من بين هذه الجبال واضعا يده على أم رأسه وهو ينادي يا ليتك قبضت روحي في الأرواح ..وجسدي في الأجساد.. ولم تجددني لفصل القضاء.؟<br />حتى دله الرسول على ما يغفر ذنبه وهو : (ربنا آتــنا في الدنيا حسنة وفي الآخرة حسنة وقـنا عذاب النار ) فقال يارسول الله ذنبي أعظم . قال الرسول الكريم (ص) : بل كلام الله أعظم .<br />اللهم اجعل توبتنا صادقة ، واهدنا إلى سبيل الرشاد ، ولا تسلط علينا من لايخافك فينا ولايرحمنا ."
archived = "2010-03-14"
capture_url = ""

