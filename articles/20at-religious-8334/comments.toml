[[comments]]
order = 5
subject = "لا يا أخي عبد الواحد سنبل ..."
author = "محمد نواف الحمدالله ..."
posted = "2008-02-27"
text = "لاتعمم وتجمع تعليقك على جميع الخليجيين، فمنهم الإنسان الصالح المتقي الذي يخاف ربه .. ومنهم أيضاً الإنسان الطالح غير التقي الذي لايخاف ربه .. فجميع المجتمعات _ بشكل عام _ يوجد بها كلا النوعين أو الصنفين أو الفريقين معاص وفي آنٍ واحد .. فلا تستغرب وتندهش عندما تسمع بأن شخصاً لايؤدي الصلاة .. والصيام .. والحج .. والزكاة .... وما إلى هنالك ..<br />استحالة أن تجد الجميع يسيرون وفق منهج او طريق واحد .. فهما خطان متوازيان ومتساويان لايمكن أن يلتقيا ولو لمرة واحدة على الإطلاق .. وهذا أمر طبيعي ومن المسلم البديهي المعروف ..<br />أريدك أن لاتتعجل على أن تحكم على الآخرين بشكل سريع .. دون أن تترك مجالاً للتأني والتفكير والتخطيط المسبق ..<br />تحياتي لك ،،،<br />وشكراً"
archived = "2010-03-14"
capture_url = ""

