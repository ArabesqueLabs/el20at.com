[[comments]]
order = 4
subject = "هولاء هم الخلايجة"
author = "عبد الواحد سنبل"
posted = "2008-02-27"
text = "هذا حال الخلايجة وما غريب عليهم هذه الاشياء فهم الحفاءة العراة الذين اخبر عنهم المصطفى صلى الله عليه وسلم يتطاولون في البنيان، فلماذ نستغرب منهم هذه الاشياء هذا طبيبعي في بلاد عاطلين عن الوراثة ولا هم لهم إلا بطونهم."
