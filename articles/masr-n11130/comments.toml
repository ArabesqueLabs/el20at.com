[[comments]]
order = 1
subject = "منك لله يا حكومة"
author = "مصرى"
text = "الخدعة أن كل جيجا زيادة بقى عليها فلوس يعنى لو استخدامك كتير هتدفع ضغف اللى بتدفعه<br />حتى الدى اس ال يا مفتريين اللى هو أصلا ب95 جنيه أقل حاجة<br />منك لله ياحكومة ومنكم لله يابتوع النت<br />عموما لو ده حصل انا اول واحد هيلغى اشتراكه وبلاها نت"
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817063458/http://masr.20at.com/newArticle.php?sid=11130"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "وانا كمان لو حصل كده هلفى اشتراكى<br />ده افترى<br />حرام والله"
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817063458/http://masr.20at.com/newArticle.php?sid=11130"
