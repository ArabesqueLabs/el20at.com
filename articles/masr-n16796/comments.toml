subject = "بجد بكرهه"
author = "لور دكاش"
posted = "2008-07-16"
text = "علاء صادق ده شخصية كريهة إلى أبعد حد.. والله احنا معندناش مانع انه يزايد بحكاية حبه للأهلي.. بس كل المطلوب انه يحاول يبقى موضوعي شوية علشان الناس تصدقه.. لكن حكاية انصر الأهلي ظالما أو مظلوما دي بقت ماسخة قووووووييييييييي."
archived = "2008-09-19"
