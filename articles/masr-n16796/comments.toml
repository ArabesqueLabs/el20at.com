subject = "انت كل معرفتك بالكرة انها مدورة"
author = "مصرى قرفان من اشكالك"
posted = "2008-07-15"
text = "الأهلى تعرض لظلم تحكيمى فى المبارتين نهائى ابطال افريقيا 2007<br />علاء صادق رجل محترم ولا يخا فى الحق لومة الحاقديين من امثالك<br />ويكفى انك معجب بثلاثى اضاوء المسرح<br />ماطرح ماترسى دقلها (شوشو)<br />الحرباء (شلبى) , راجع مواقفه مع الحضرى وزكى كلاهما موضوع واحد لكنه متلون<br />اخصائى برامج الأطفال (فطوطة) اللى سب الدين لقدرى عبد العظيم<br />ونعم الإحترام<br />الأهلى فوق الجميع"
archived = "2008-09-19"
capture_url = "https://web.archive.org/web/20080919122553/http://masr.20at.com:80/newArticle.php?sid=16796"

[[comments]]
