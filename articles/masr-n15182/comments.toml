[[comments]]
order = 0
subject = "مجرد فكرة"
posted = "2008-04-14"
text = "أعتقد أن الفيلم أكيد سيثير جدل و بنائا عليه سيقوم من شاهد الفيلم بالبحث أكثر عن الاسلام , و عن الايات المذكورة التي تم اقتطاعها و بترها من معناها الحقيقي الى معنى بعيد تماما عما أريد منها و هنا يأتي دورنا بوضع الايات في اطارها الحقيقي و تبيين أسباب النزول , ثم تقوم بحملة اعلامية عن طريق مقالة في جريدة أو رسائل الكترونية أو نشرة اعلانية قصيرة متكررة في التلفزيون بهولاندا و أوروبا وتوفير الكتب بلغاتهم و ان شاء الله سيفهمون سفاهة مخرج الفيلم و وضاعة تفكيره و تتبين الحقيقة.<br />و عدم مصداقيته"
archived = "2008-04-14"
capture_url = "https://web.archive.org/web/20080414141554/http://masr.20at.com:80/newArticle.php?sid=15182"

[[comments]]
order = 1
subject = "وستشرق شمس الاسلام على اوروبا ولو كرة الحاقدون 0 ا"
author = "مصرى"
posted = "2008-04-14"
text = "اوروبا منزعجة من انتشار الاسلام<br />فى هولندا قرابة النصف مليون مسلم<br />وفى الدنمارك قرابة المليون<br />فى فرنسا ستة ملايين مسلم<br />وفى بريطانيا خمسة ملايين مسلم<br />وفى المانيا ثلاثة ملايين مسلم<br />من حقة ان يشتم وان يخاف من النور الذى بدأ ينير الحاديتهم الفاجرة<br />ان شتيمتهم تبين ان الاسلام يسطع ويعلوا<br />ولن يحجبوا شمس اللة<br />ويوم يفرح المؤمنون بنصر اللة وتشرق شمس الاسلام على اوروبا<br />اذا جاء نصر اللة والفتح ورأيت الناس يدخلون فى دين اللة افواجا فسبح بحمد ربك واستغفرة انة كان توابا"
archived = "2010-03-14"
