[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-11-18"
text = "التصوف فيما اعتقد تأتى من لبس الصوف اوالخشن قيما يعنى الزهد اما فيما يخص معظم الطرق الصوفية هذه الايام قيلتبس بها الخبيث بالطيب اما مقام الولاية فهو منة ومنحة من الله فقد قال الله تعالى الا ان اولياء الله لا خوف عليهم ولا هم يحزنون الذين امنوا وكانوا يتقون لهم البشرى فى الحياة الدنيا والاخرة 0000الى اخر الاية فليس كل شيخ طريقة بولى ولكنه قديكون عارف بالله او امام طريقة او ولى فالولاية منة من الله ولا تورث وهناك الولى بالجسد والولى بالنفس وهناك من هو ولى ولا يعلم الا بعد الموت واخر دعوانا ان الحمد لله رب العالمين وصلى اللهم على سيدنا محمد واله وصحبه وسلم"
archived = "2010-03-14"
capture_url = ""
