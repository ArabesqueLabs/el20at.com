order = 0
subject = "زعلتني منك يا هواري"
author = "ابوشنب"
posted = "2007-10-26"
text = "اشهر الطرق الصوفية همة دول<br />ههههههه واضح انك ضارب الموضوع من حتة او عامل بحث عن اشهر الطرق فالنتيجة كانت موقع سوداني ههه<br />دول اشهر الطرق في السودان<br />عندنا في مصر اشهر الطرق حاجة تانية خالص<br />عندنا صلاح سالم والعروبة وشارع فيصل والهرم<br />ههههههه<br />لا بجد في مصر فيه الرفاعية والنقشبندية والخلوتية وحاجات كتيير تانية وممكن تظبط نفسك لو اتصلت بالمجلس الاعلى للطرق الصوفية وتسأل<br />بلاش فبركة وكوبي اند بست يا هواريىىىى"
archived = "2010-03-14"
