[[comments]]
order = 4
subject = "أحمدوا نعمة السلام"
author = "ابن العراق+علماني"
posted = "2009-01-05"
text = "ليش هذا التهجم على أنسان موضوعي, لا أسرائيل حتوقف العمليات العسكرية ولا مبارك حيكسر السلام مع أسرائيل. أسرائيل ماضية في العمليات العسكرية حتى تحقق ماتريده لأمنها, لا الأمم المتحدة ولا منظمة الدول الأسلامية ولا أي مظاهرة سوف تغير رأيها الى أن تكسر شوكة حماس وقدرتها العسكرية على أطلاق الصواريخ لان منظمة حماس في السابق لم تتكفل بمسؤلية عدم أطلاق الصواريخ حتى لما كان يوجد هدنة. في أعتقادي أن الرئيس مبارك ليس مستعد بأن ينقض معاهدة كتبت قبل حوالي 3 عقود والتي أعطت مصر السلام والأستقرار وأوقفت الأستنزاف لأجل عيون مشعل ومنظمته التي صارت ألعوبة بيد دولة الملالي في طهران!"
archived = "2010-03-14"
