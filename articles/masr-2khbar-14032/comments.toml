posted = "2009-11-15"
text = "قبل الهزيمة وقبل النصر - الرياضة اخلاق افرح لما اكسب ولا احزن عندما اهزم واشد على يد غريمى الكسبان<br />الرياضة اننى اعلم الطفل والشاب انة يشتغل فى فريق team work فى المصنع والمكتب والورشة والغيط<br />مشكلتنا يا مصريين اننا لا نلعب رياضة ولكن بنتفرج على رياضة ولنا وكلاء بيلعبوا نيابة عنا<br />الشعوب بتنهض بالرياضة لما يعلموا اطفالهم ان شغلة مكمل لشغل زميلة ومفيش فردية ولما كل واحد بيشتغل لوحدة بيفشل العمل<br />الرياضة الصح تتلخص فى تعليم الناس والاطفال خصوصا معنى ال team work<br />الجزائر تكسب مصر تكسب الكرة اجوان وتدريب وتعاون ومش هتفرق كتير"
