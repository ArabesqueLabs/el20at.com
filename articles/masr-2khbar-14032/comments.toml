text = "قل بفضل الله وبرحمته فبذلك فليفرحوا هو خير مما يجمعون<br />الحمد لله انه وفقنا ونصرنا :lol:<br />وإن شاء الله سينصرنا يوم الأربعاء فى المباراة الفاصلة<br />لأن ربنا عمره مابيضيع اجر شخص اجتهد فى اى شىء :roll:<br />إن الله لايضيع أجر من أحسن عملا<br />الللى اجتهد فى التدريبات وتعب مش زى اللى اجتهد فى تكسير الأتوبيس واجتهد فى عمل المؤمرات وتضييع الوقت<br />ويارب حياتنا دايما تبقى افراح<br />ولكن فرحتنا الحقيقية يوم مانتحد كلنا ويتحرر المسجد الأقصى المبارك :roll:"
