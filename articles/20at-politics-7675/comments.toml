[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-11-28"
text = "آآآآآآآآآآآآآآآه يا نجلاء<br />خليها في القلب تجرح ولا تطلع برة وتفضح<br />لا داعي لأن تعبري عن رأيك بالوضع الحالي الذي نمر به لأنك بالتأكيد ستنهال عليك التعليقات الساخنة -وعلي أيضا بالمثل- وستتهمين بالعمالة والخيانة والتكفير والتخاذل وليس بعيدا أن يتهموكي بقبضك لمبالغ مقابل مشاركتك هذه<br />العقل غائب ولغة الانتقام والدم وحدها الحاضرة في هذا البلد التعيس , لن يسمعك أحد ولن يفهموك , وأكثر الأشياء احتراما التي ستقال بحقك هي أنك غافلة مسكينة لا ترين الحق والحقيقة<br />الساسة المحترمين لا يفكرون كيف يخرجوننا مما نحن فيه , كل ما يفكرون به كيف يهزمون الحزب الآخر وكيف يستعرضون عضلاتهم أمامنا وكيف ينتقمون ممن استضعفهم سابقا وكيف يثبتون على مراكزهم السياسية ولا يتخلون عنها وكيف يثبتون خطأ غيرهم وكيف تكون لهم الغلبة<br />وكأن الناس هنا لا تفهم ولا تستطيع أن تحلل ما تراه وكأننا محكوم علينا بأن نكون اتباعا لعقيدة هذا الحزب أو ذاك , ليس من حقك يا نجلاء أن تصفي الانهيار الذي نعيشه وليس من حقك نقل معاناة شعبنا .. عليك فقط أن تقولي سمعنا وأطعنا"
archived = "2010-03-14"
