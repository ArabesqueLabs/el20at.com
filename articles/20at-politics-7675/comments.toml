subject = "ومن أطلق هذة الرصاصات"
author = "حمدان البيومى"
posted = "2007-11-28"
text = "ومن أطلق هذه الرصاصات عليكى أهم كما تقولين (فقعد في غزة، يحسب أنها فلسطين من البحر إلى النهر، وأن جماعته هم أولياء الله، لذا يجب توظيفهم وإقصاء الباقيين، ويقتل الناس باسم الدين ) الذين أرد لكى حياة ذات عزة وشرف وفخر بأنك فلسطنية مسلمة والارض هذة ارضك ولن اتفاوض على حقى والمقاومة هى سلاحى الذى املكة<br />أما الذى اطلق النار عليكى من هروال وراء الصهاينة والامريكان وباعو شعوبهم واوطانهم ولن اكذب ان قلت لكى دينهم أيضا اختاه رحمكى الله راجعى التفكير جيدا واعرفى من الذى يحميك وينصرك ومن لبذى يحاربك ويتعاون مع اعداك واعداء البشرية جميعا وعلى فكرة انا مش فلسطينى لتنظني ان منحاز الى احدهما ولكن والله هذة كلمة الحق كما اظن h.elbayoumy@gmail.com"
archived = "2010-03-14"
