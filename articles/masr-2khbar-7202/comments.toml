order = 0
subject = "العسكرى تبع مين ؟"
author = "محمد ابو الرشيد"
posted = "2007-09-26"
text = "محدش قال لنا العسكرى دة تبع النظام العام والا المباحث والا الامن المركزى والا مباحث امن الدولة والا شرطة المسطحات المائية والا شرطة المرافق والا الشرطة العسكرية والا مخابرات امن الدولة والا المباحث العامة والا القوات الخاصة<br />معدناش عارفين احنا تحت انهو شرطة<br />ربنا يوفقهم يارب<br />ويعملوا للصالحالعام"
archived = "2010-03-14"
