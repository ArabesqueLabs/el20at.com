[[comments]]
order = 1
subject = "اه ه ه ه ه ه ه ه"
author = "واحد من الناس"
posted = "2007-09-27"
text = "اه هانفضل نقول اه لحد امتى ارحموا الناس العسكرى اللى فالافلام دا كان بنى ادم العسكرى اللى هايتحط دلوقتى هايبقى بلطجى ميرى عارفين يعنى ايه يعنى الحكومة حالفالنا ما هاتسيبنا وبكرة هايعينو عساكر فالصالة والصالون والفقير يا فرحتة العسكرى مش هايلاقى حتة يقعد فيها عنده_________ امناء الشرطة اللى مش معروفلهم وظيفة فالبلد اتحولو بلطجية ومنهم اللى بياخد اتاوات من الناس امال العساكر اللى هاترابط تحت بيوت الناس هاتعمل ايه حسبى الله ونعم الوكيل"
archived = "2010-03-14"
