[[comments]]
order = 1
subject = "اللهم ان هذا برا ووفاء لهذا الرجل المشرف"
author = "خالد عبد ارحمن"
posted = "2007-05-24"
text = "الك الرجل فى كل مكان وضدد اى مقال وهذا من باب البر والحب والوفاء وحسن الظن والاخوة فالهم اصلح ما بيت امتى واسرتى وتقبل من كل معلمى الناس الخير"
