subject = "ضع عنوان التعليق الى مروة"
author = "مسلمة"
posted = "2007-07-08"
text = "الى الاخت مروة انت تقول انالبرنامج كان يضم ولاد وبنات وان عمرو ليس ملتحياويحزنك هدا ولكن لمادا لم تفرحىباللعشرات الدين هداهم الله على يد هداالشاب الانيق الحليق ولم تهتز عواطفك لمراى العشرات من الفتيان والفتيات الدين اخدت الخشية بمجامع قلوبهم وفاضت اعينهم بالدموع تاثرالكلامه النابع من صميم فؤاده يبدوا انك ممن يتتعامل مع ديكورات الاسلام وصوره وتجهلى جوهره ولمادا تسب جماعة وتصفيها بالمتطرفة وانت لاتعلمى عنها شيئا فاتقى الله"
archived = "2010-03-14"
