[[comments]]
order = 2
subject = "الداهية"
author = "مروة عبد المنعم"
posted = "2007-07-01"
text = "تقول يا استاذ عمرو خالد انك تقتدى برسول الله صلى الله عليه وسلم انت تتدعى ذلك ؟؟؟؟؟؟؟؟ ان كنت حقا تقتدى برسول لما انت من جماعة الاخوان المسلمون المنحلة المتطرفة لما تحاول نشر افكارهم المتخلفة بطرق ملتوية عن طريق اندساسك بين الشباب وتظاهرك بان هذة هى الحياة ولما انت تقتدى برسول الله لما لم تطلق لحيتك كما امرك رسول الله صلى الله عليه وسلم ولما فى برنامج كلام من القلب وغيره كان هنك اختلاط بين الشباب والبنات والاولى ان يكون امامك الشباب فقط وليس بنات وشباب وتفتن البنات بك رايت بعينى بعض البنات يحملن صورك باجندتهم فاصبحث مثل المطربين او الراقصين انت لا تصلح داعية ابدا اترك الامر لمن فيه صلاح انت لست اهل لذلك"
archived = "2010-03-14"
capture_url = ""

