subject = "ما شاء الله عليه"
author = "أم عزت"
posted = "2007-05-24"
text = "الراجل دا مثال مشرف ما شاء الله عليه ربنا يحفظه و يحقق له كل إمنياته ويجعله في ميزان حسناته و نتقابل كلنا في الفردوس الأعلى ان شاء الله على حوض الرسول صلى الله عليه و سلم"
