subject = "اغبياء لانكم تتكلمون با سم شعب جبان"
author = "غبى"
posted = "2008-05-06"
text = "للنظام الحق فى سحلكم<br />بتتكلموا باسم مين<br />باسم الجبناء اللى كل واحد بيقول وانا مالى<br />انتم اللى عاملين رجالة<br />فين بقية الشعب اللى بياخد على قفاة وساكت<br />ولا بينطق<br />وبيقول ياعم وانا مالى هى كانت دولة ابويا - ان شاء اللة تخرب<br />اخدتم درس<br />احترموا انفسكم<br />اذا ذهبت الى روما فافعل مثلما يفعل الرومان<br />اذا كنت فى دولة حرامية - لا تعمل شريف خليك شيخ منصر وحرامى كبير<br />زمان علمونا فى الجيش<br />نيك الحكومة ولا توريهاش زبك<br />اسف لسوقية العبارة وقلة الادب ولكنها تقال للشباب"
archived = "2010-03-14"
