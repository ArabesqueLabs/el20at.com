text = "أعتذر عن الخطأ المطبعى ده ... 1430 و لا تزعل<br />أصلى بطبع فى الأهرام .. وانت عارف بقى بيحبوا يضخموا كل حاجة كدة ،حتى التواريخ<br />هههههههههههههههههههه<br />هاتلى كيبورد جديد بقى .علشان ما أطبعش فى الاهرام تانى<br />ههههههههههههههههههههههه<br />وأسف مرة تانية"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235816/http://masr.20at.com:80/newArticle.php?sid=19045"

