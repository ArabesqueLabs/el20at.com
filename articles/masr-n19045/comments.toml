[[comments]]
order = 5
subject = "مش دا المهم.. المهم ان النبي قال بعثت انا والساعة كهاتين"
author = "ابومحسن"
text = "النبي محمد صلى الله عليه وسلم قال بعثت انا والساعة كهاتين واشار بالسبابة والوسطى<br />ففيه ناس فسرت عندما اشار النبي محمد صلى الله عليه وسلم باصبعيه الشريفين انه يقصد ان القيامة بعد 2000 سنه هجرية<br />يعني بعملية حسابية بسيطة<br />2000 - 1430= 570 سنه<br />يعني فاضل على يوم القيامه 570 سنه<br />ممكن لان الان كل علامات يوم القيامه الصغرى قد ظهرت والكبرى على وشك الظهور<br />يعني ظهور الشيعة في ايران والعراق دليل على قرب خروج المهدي المنتظر واليهود في فلسطين دليل على قرب نزول المسيخ الحقيقي وخروج المسيخ الدجال وهذه من العلامات الكبرى<br />ربنا يستر"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235816/http://masr.20at.com:80/newArticle.php?sid=19045"

[[comments]]
order = 6
subject = "بدون تعصب"
author = "حسين كامل"
text = "بدون تعصب التقويم الميلادى هو الاصح !! يعنى انا مثلا من مواليد شهر يوليو فهل اى فى عز الحر فهل يمكن مثلا ان احتفل بعيدى ميلادى مره فى فى الصيف واخرى فى الشتاء ( مش عايزين لخبطه ) ثانيا لو رغبت اتزوج من فتاه ممكن تقولى ان عمرها عشرين سنه ووقت الجد اكتشف ان عندها اربعين سنه وساعتها حتقولى انها حسبت عمرها بالتقويم الهجرى لان السنة الهجرية اصغر فى العمر من السنه الميلادية ( مش عايزين لخبطه ) ."
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235816/http://masr.20at.com:80/newArticle.php?sid=19045"

[[comments]]
order = 7
subject = "الى الاخ ابو محسن"
author = "مش مهم"
text = "ايه اللى انت بتقوله ده يا ابو محسن<br />ياخي الحاجات دي اللى بتضحك الناس علينا<br />اذا كانت علمها عند ربها ازاي يخمنوها كل دي خرافات<br />وكمان 570 سنة ايه الجمال ده<br />وهو اصلا كانت في سنة هجرية ايام الرسول السنة الهجرية دي تم تحديدها من المؤرخين بعد كده وبدا العمل بيها كحساب للتاريخ الاسلامي<br />الدين الاسلامي مافيهوش الغاز ولا حزر فزر لو كان ربنا كاتب خير في معرفة وقت الساعة كان قاله لينا والمسالة اسهل من انه يتقال لينا في لغز<br />بس لو في منك اتنين البلد تتحرق بجاز اكتر ماهي محروقة"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235816/http://masr.20at.com:80/newArticle.php?sid=19045"

[[comments]]
order = 8
subject = "الى الاخ حسين كامل"
author = "مش متنيل قايل تاني"
text = "ياخي ماهو لو كنا ماشين على التاريخ الهجري كنت قلت نفس الكلام بالظبط وقلت ان التاريخ الهجري هو الأصح<br />الكاوتش مخروم يا كابتن -.-"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235816/http://masr.20at.com:80/newArticle.php?sid=19045"

[[comments]]
order = 9
subject = "الاستاذ مش مهم"
author = "ابومحسن"
text = "يا استاذ مش مهم تجمع الشيعة في المنطقة واليهود يدل دلالة قاطعة على اقتراب ظهور المهدي والمسيح الدجال والمسيح الحقيقي<br />والثلاثة دول حيظهروا في وقت واحد<br />واذا ظهروا يبقى 500 سنه كتير اوي على النهاية"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235816/http://masr.20at.com:80/newArticle.php?sid=19045"
