subject = "تشريفة رئيس جمهورية شمبونجو فى المحيط الكاريبى"
author = "شانج بانج شو"
text = "الرئيس قى جمهورية شمبونجو وهو رايح يفتتح طلمبة مية بحارى بتسحب مية ملوثة لبيوت الاهالى<br />الامن قبلها باسبوع بيقبض ويحتجز بعض شباب اهل القرية ويحاصر القرية من الجهات الاربع ويمنع الدخول والخروج ووقت الزيارة ممنوع اى واحد يطلع من البيت والا هينطخ ويروح فطيس وجميع السيارات تسحب الى ساحة واسعة وتوضع تحت رقابة وحراسة الامن وجميع حمام وغربان البلد يحظر عليها الطيران وطبعا الرئيس الشمبونجى هيقابل افراد من تلك القرية الشمبوجنية عبارة عن ضباط امن بالجلاليب والطواقى والعمم الشمبوجينية<br />وبعد انتهاء الزيارة تتعطل الطلمبة المفتتحة"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022002948/http://masr.20at.com:80/newArticle.php?sid=17951"
