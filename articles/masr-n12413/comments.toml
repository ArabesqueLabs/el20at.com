[[comments]]
order = 0
subject = "نظام حكم قمعى ارهابى بوليسى"
author = "مصرى"
posted = "2007-11-13"
text = "قتل مواطن بتلك الطريقة جريمة حرب<br />لماذا يقبضون على الناس فى البيوت وفى الفجر ؟<br />لماذا لا يقبضون علية فى الشارع او من على المقهى او خروجة فى مشوار ؟<br />لماذا يروعون الاطفال والستات فى الفجر ؟<br />هناك الف طريقة للقبض على شخص اخرها القبض علية فى بيتة وفى الفجر<br />على جمعيات حقوق الانسان ان تخاطب الامم المتحدة والمنظمات الدولية فليس هناك مصرى امن على نفسة"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113230403/http://masr.20at.com:80/newArticle.php?sid=12413"

[[comments]]
order = 1
subject = "هو حبيب العدلي دخل كلية الشرطة ليه"
author = "اكتب اسمك هنا"
posted = "2007-11-14"
text = "للاجابة على هذا السؤال تفسير ما يحدث في وزارة الداخلية<br />ليه الطلبة لما بياخدوا السنوية العامة بيجروا على كلية الشرطة<br />هل حبا في امن مصر؟؟؟؟؟؟<br />ام لانهم مرضى نفسانيين ؟؟؟؟؟"
archived = "2008-01-14"
capture_url = "https://web.archive.org/web/20080114032913/http://masr.20at.com:80/newArticle.php?sid=12413"

[[comments]]
order = 2
subject = "بلد بنت ستين وسخة"
author = "meg"
posted = "2007-11-14"
text = "بلد وسخة حكومتها اوسخ وشعب قذر ساكت على اللى بيحصل فيه علشان انتم شوية جبانات وهتفضلوا كده لغاية ما تصحوا على كابوس زى كابوس العراق ان شاء الله"
archived = "2008-01-14"
capture_url = "https://web.archive.org/web/20080114032913/http://masr.20at.com:80/newArticle.php?sid=12413"
