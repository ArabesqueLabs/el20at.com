subject = "يجوع ويأكل بثدييه ويشبع وبرضه يأكل بثدييه"
author = "ديمقراطية - بزاز- ممتاز"
posted = "2008-01-05"
text = "أي ديمقراطية أو حرية تلك التي تنتهك فيها الأعراض والقيم والمباديء.؟! أي حرية تلك التي تحاول اغتيال هيبة وكيان الوطن، وتحاول هدم وتشويه كل ما حققناه من إنجازات؟!<br />أي حرية تلك التي تنشر الكراهية والبغضاء، وتزرع اليأس، وتقتل كل بارقة أمل في حياة أفضل لأبناء مصر؟! أي حرية تلك التي جعلت بعض موظفي الحكومة يغلقون مكاتبهم، 'بالضبة والمفتاح'، في محاولة للضغط علي الحكومة، وتحقيق بعض المكاسب أو المزايا الجديدة. رغم تعارض ذلك مع كل قوانين وأنظمة ولوائح العمل، وحتي إن كانت لهم بعض الحقوق؟!<br />أي ثقافة جديدة تلك التي هبطت علينا فجأة، وتجد من يدافع عنها، ويدعي أنها تعبير عن الحرية والديمقراطية..؟!<br />ان مصر كلها تعيش اليوم خطرا محدقا، لا يجب التقليل من شأنه أو تأثيراته ونتائجه، لأن كل التجارب والأحداث التي شهدها الشارع المصري خلال العامين الماضيين تؤكد ان هناك من يعيش بيننا، لكنه ينفث سمومه واحقاده داخل مجتمعنا. احداث تؤكد ان هناك عملاء باعوا أنفسهم للشيطان، وأصبحوا ادوات جاهزة للاثارة والتهييج، واثارة القلاقل، وزرع بذور الفتنة والأحقاد.<br />لاشك أننا جميعا نتفق علي أن هناك ارتفاعا حادا في الاسعار، يعصف بكل ما يتقاضاه المواطن المصري من دخل، وسواء كان راتبا من الحكومة، أو من القطاع الخاص، أو مقابل خدمات أوسع.. ونتفق جميعا علي أن هناك حقوقا يجب علي الحكومة احترامها في علاقتها بالمواطن، وأهمها توفير الاحتياجات الأساسية، ورفع مستوي الخدمات، وعدم اضافة أي أعباء جديدة علي المواطنين. غير أن الاسلوب والطريقة التي يلجأ إليها البعض للتعبير عن حقهم، أو الحصول علي أي مزايا اضافية، يجب ان تظل مصونة بسياج يحمي المصلحة العامة،ويتوافق مع قيم المجتمع وعاداته ومعاييره الاجتماعية.<br />لا أعتقد أنه من المقبول ان تصبح لغة الاعتصامات والاضرابات سبيلا وحيدا للتعبير عن هذه الحقوق، خاصة عندما تتم الاضرابات والاعتصامات علي الطريقة المصرية!! بأسلوب 'ضرب الكرسي في الكلوب'!!<br />لقد آلمني وهالني الأسلوب الممجوج، الذي لجأ إليه بعض العاملين بجامعة عين شمس، الذين يعملون كعمال مؤقتين، عندما طلبت منهم إدارة الجامعة توقيع عقود للعمل.!!<br />عقود تنص علي العديد من الحقوق، التي كانوا محرومين منها، وتمثل بداية حقيقية لانخراطهم مستقبلا كعمالة دائمة.<br />بدأ العمال يتجمعون للتعبير عما يعتقدون بأنه يعبر عن مصالحهم وحقوقهم. وذلك بعد أن قام بعض المهيجين بالاتصال بالقنوات الفضائية التي تخصصت في الهجوم علي مصر.<br />وعلي طريقة بعض المصريين، 'رمي الجتة وهصورلك قتيل'، أغمي علي احدي العاملات، لتسري شائعات روجها بعض المحترفين، تقول إن رئيس الجامعة، أو أحد قيادييها قام بضرب العاملة، وهو شيء لايتقبله العقل أو المنطق، وإن كان يجد صداه بين الفئات الأقل تعليما.<br />لقد تم فض هذا الاعتصام، من خلال حوار أداره رئيس الجامعة الدكتور أحمد زكي بدر، الذي شرح فيه للعمال المكاسب التي ستعود عليهم، بعد توقيع تلك العقود، التي تتضمن زيادات مقننة في الحوافز والاجور، بالإضافة لبعض المزايا الجديدة، كالإجازة السنوية المدفوعة الأجر، والاجازات الطارئة والعارضة، واجازة الحج، وغيرها من المزايا التي تعتبر ميزة جديدة للعمالة المؤقتة. وهي عقود ليست ملزمة واختيارية. ان العمالة المؤقتة تعني العمالة التي ترتبط باداء عمل معين، وتنتهي بمجرد اتمامه، أي يكون من حق الجهة الاستغناء عنهم في أي لحظة، وجاءت العقود الخاصة، كوسيلة لاقرار حقوق قانونية، ومزايا لم تكن موجودة لهؤلاء العاملين.. وان كانت العقود قد نصت علي حق جهة العمل في عدم التجديد، فانه بند وديباجة قانونية موجودة في العديد من عقود العمل، ولا يتم اطلاقا أو عمليا تنفيذها.<br />وكان من الطبيعي أن تتحول القصة الخيالية المريضة إلي سباق رخيص بين صحف الاثارة، التي وجدت في شخص رئيس الجامعة، وكونه نجلا لوزير الداخلية الراحل زكي بدر، سببا وجيها لتصب لعناتها علي أسلوبه في قيادة الجامعة. وذلك انطلاقا من حملتها المسعورة ضد أجهزة الأمن، ووزارة الداخلية، علي الرغم من كونه واحدا من أفضل القيادات الجامعية، غير ان عيبه الوحيد أنه يرفض دائما أساليب الابتزاز الرخيصة، ومحاولات لي القانون، التي يخضع لها للاسف الشديد بعض كبار المسئولين في مواقع كثيرة للعمل، وكانت سببا رئيسيا في ثقافة الاضراب التي يلجأ اليها البعض!!.<br />لقد عرفت رئيس الجامعة، عندما كان رئيسا لاكاديمية أخبار اليوم، وقد استطاع خلال فترة رئاسته لها ان يحولها إلي واحدة من أفضل الاكاديميات والجامعات الخاصة بمصر، واصبحت مثالا في الانضباط، وقدوة لكل الجامعات الخاصة. لكن في مصرنا المحروسة كل الأمور مقلوبة، ومن يقول كلمة الحق، ويعلي سلطة القانون ويرفض الابتزاز. أصبح مكروها ومطلوبا لجلادي صاحبة الجلالة، الذين ينهالون بسيوفهم علي رقاب الشرفاء.<br />ماحدث في جامعة عين شمس، وما سبقه من احداث في مأموريات الضرائب، يحتاج إلي سرعة مراجعة وتقييم، والضرب بيد من حديد علي يد كل من يعتقد ان أسلوب الابتزاز، والتهديد والوعيد، ومقالات الردح والسب والشتائم، ستكون سببا للحصول علي الحقوق، علي حين تكمن الحقيقة المرة في كونها أحد مظاهر الفوضي الخلاقة، والاثارة التي تستهدف مصر كلها.<br />إن ثقافة الاضراب هي إحدي صور الممارسة الديمقراطية، ولكنها تحتاج الي أرضية صلبة من وعي الناس، وادراكهم لحقوقهم وواجباتهم. لأن الاضراب أو الاعتصام، عندما يتحول إلي وسيلة للضغط والابتزاز، يصبح شرا مستطيرا، يجب التصدي له، لأن عدوي انتشاره يمكن ان تؤدي إلي نتائج لا تحمد عقباها.<br />يقيني ان هناك شيئا ما خطأ يحدث اليوم في الممارسة الديمقراطية، والذي يحولها للأسف الشديد إلي نوع من البلطجة والابتزاز. فحق الاضراب أو الاعتصام، لابد ان يقترن بمجموعة من الضوابط، تضمن إعلاء المصالح العليا للوطن، أو المؤسسات، أو المصانع.<br />في كل بلاد الدنيا الديمقراطية، يعد الاعتصام أو الاضراب ثقافة من نوع خاص، تضمن عدم الاضرار بمصالح الفئات الأخري من المواطنين.<br />فعندما يعلن موظفو مصلحة ما انهم سوف يعتصمون أو يضربون. فإنهم يقومون بإخطار الجهات المسئولة مسبقا، كما أنهم يقومون بإعداد ورديات خاصة، تضمن استمرار العمل، وقضاء مصالح الناس وعدم تعطلها. فاضرابات عمال المترو في باريس، لا تعني اطلاقا توقف الحركة، ولكنها تعني ابطاء الحركة، أي تشغيل أدني حد ممكن من قطارات المترو بحيث يشعرالمسئولون والناس بها، ولم يحدث في أي من هذه المرات ان توقفت الحركة كلها. لكن موضة الاضرابات في مصرنا المحروسة، تتم دون أي ضوابط، كما أن أسلوب الحكومة في علاجها أدي لاستفحالها. وأعتقد أنه آن الآوان لمعالجة أسبابها، وسرعة إحتواء أي منها. واعلاء كلمة القانون أمام أي ممارسات ضارة تخل بالعمل، أو تلحق الأذي بمصالح المواطنين.<br />أبو قردان هذا - ليس صديقا للفلاح- ولكنه هنا يأكل الدود ويأكل لحم المعوزين ويأكل الفتات على موائد لجنة السياسات وجاهز دائما بجوار أوسخ بيادة في قدم السلطة ليتقيأ قيحه وصديده وقرفه على الشرفاء الفقراء الذين ضرب المرض أكبادهم وهزم الجوع كبرياءهم و احتل العوز ديارهم وبسط الفقر رداءه على وجوههم فما كان منهم إلا أن استعملوا أبسط أبسط حقوقهم في التعبير عما هم فيه حتى يلتفت إليهم أسياد الكلب الأجرب ليخففوا عنهم عذابهم ومعاناتهم ويردوا إليهم بعض بعض حقوقهم .. ولكن ذلك لم يعجب اللقيط الذي يعتقد أن كل الشرفاء يجب أن يكونوا مثله أولاد ...حرام"
