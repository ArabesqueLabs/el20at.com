[[comments]]
order = 1
subject = "الموضوع مليء بالمغالطات الفادحة"
author = "عادل"
posted = "2008-07-21"
text = "أولا هذه الفئة موجودة لكنها أقل من 1 في المئة من الشباب المغربي. ثانيا الطريقة التي كتب بها المقال مغرضة بكل المقاييس. لان الامر لا يتعلق الا بفئة بائسة ضعيفة الشخصية لان هناك آلاف من الشباب يعيشون الفقر و يعدون من اشرف الناس كلهم ادب وأخلاق. وهذه هي الفئة مع كامل الاسف التي لا يتطرق لها هذا الموقع وكأن هناك مؤامرة ضد هذا البلد. لذلك أرجو احترام الوقائع وعدم نشر اي شيء. واذا استمر هذا الموقع في نشر مثل هذا الهراء ساقاطعه نهائيا كخطوة أولية وشكرا."
archived = "2010-03-14"
