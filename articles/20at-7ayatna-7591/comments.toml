[[comments]]
order = 0
subject = "موضوع تافه لايخلو من الكدب"
author = "adil"
posted = "2008-07-21"
text = "الى الاخت الكريمة صاحبة المقال هدا هو الموضوع الدي اردت من خلاله ابراز بنات بلدك بانهن حشاشات وبانهن منحرفات جزاك الله خيرا على ماقلته لكن ارجو اختي الكريمة ان تنتبهي الى بنات هن في الغربة يتعلمن ويرجعن الى بلدهن لكي يحققن النجاح بدل كلامك الفرشاخ والقرطاس والبارود ...ان جئت الى الحديث عن الحشيش فاقول لك ان كل بنات المشرق العربي يشربن الشيشة بمافيهم محجبات اغلب شباب العالم العربي يدخن البانجو والكيف وغيره ولم يتكلم عنهم احد يكفي ان الامر يتعلق بالمغرب لكي يسيل المداد ارجوكم اختارو مواضيع تنفع عوض ان تضر"
archived = "2010-03-14"
