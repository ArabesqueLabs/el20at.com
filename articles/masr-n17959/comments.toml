subject = "الراجل يستطيع ان يجر ورائة بحبل حمار واحد - اما ال"
author = "اة - لو كنت فتاة"
posted = "2008-10-19"
text = "اة لو كنت بنت<br />كنت خليت الاولاد يمشوا فى الشارع يتهبلوا<br />قال احد الشعراء وقد راى امراة جميلة<br />ان النساء شياطين خلقن لنا ------------------- نعوذ باللة من شر الشياطين<br />فردت علية المراة الجميلة<br />ان النساء رياحين خلقن لكم --------------------- وكلكم يشتهى شم الرياحين"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022003005/http://masr.20at.com:80/newArticle.php?sid=17959"

