text = "إن هذا الشيء لا علاقة له بالزي التقليدي الذي ورثناه عن أجدادنا و هو مدعات فخر لنا و أنا شخصياً أحرص على ارتدائه دوماً لأني أحب التمسك بثقافتنا الشرقية بدل ثقافة الغربيين السفلة الكفار حليقي الذقون الذين يدعمون الدنمارك الأندال و إخوة القردة و الخنازير اللعينين أما هذه الشماغات الملونة فهي للطنطات و المخنثين أما الرجال الحقيقيون يلبسون الشماغات التقليدية بدل هذا التقليد السافر .<br />و السلام عليكم و رحمة الله و بركاته ."
