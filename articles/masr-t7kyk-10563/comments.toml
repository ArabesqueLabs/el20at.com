subject = "انتقاماً للهجمات الإسرائيلية على غزة... الظواهري ي"
author = "اوباما حيبتدي الشغل بدري يا جم"
posted = "2008-11-20"
text = "انتقاماً للهجمات الإسرائيلية على غزة... الظواهري يدعو إلى ضرب أهداف أميركية وإسرائيلية<br />صدى سوريا: في رسالة لاسلكية التقطت أمس الأحد في واشنطن، دعا المسؤول الثاني في تنظيم القاعدة أيمن الظواهري, إلى هجمات جديدة على المصالح اليهودية والأمريكية، انتقاماً من الهجمات الإسرائيلية على قطاع غزة مطلع شهر آذار مارس الحالي، وقال الظواهري في خطاب بثته شبكة السحاب، الذراع الإعلامي لتنظيم القاعدة، وسجله موقع سايت لمراقبة المواقع الإسلامية, \\\"أيها المسلمون, اليوم يومكم. اضربوا مصالح اليهود والأمريكيين وجميع الذين شاركوا في الهجوم على المسلمين\\\"، انتقاماً من الهجمات الإسرائيلية على قطاع غزة<br />ودعا الظواهري في الشريط الصوتي الذي تبلغ مدته أربع دقائق \\\"المؤمنين\\\" إلى \\\"مراقبة الاهداف وجمع الاموال وتقديم المعدات والقيام بالاستعدادات ثم استعينوا بالله واسعوا إلى الشهادة والجنة\\\"، وكانت وزارة الداخلية السعودية شنت حملة مؤخرا ضد أشخاص اطلعوا على رسالة جديدة للظواهري عبر أجهزة الجوال، ودعت الوزارة من اطلع على الرسالة الصوتية التي عثر عليها مع أحد قيادات \\\"القاعدة\\\" في السعودية، إلى سرعة الإبلاغ الرسمي وتوضيح موقفه."
archived = "2010-03-14"
