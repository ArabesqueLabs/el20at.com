subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-05-09"
text = "اطالب باضراب من اجل عودة الجيش الى الثكنات العسكرية<br />أرسل هذا التعليق بواسطة : مش بحبك<br />يا جماعة عايزين نعمل اضراب عامل وشامل من اجل المطالبة بعودة جميع افراد الجيش الى الثكنات العسكرية<br />حرام عليهم بقا<br />كفاية خمسين سنه وداخلين في خمسة وخمسين سنه<br />حرام حرام حرام<br />البلد عايز يحكمها اقتصاديين كبار مخلصين امثال<br />عبدالمجيد الغزالي اقتصادي كبير او اي اقتصادي اخر بصو السيرة الذاتية بتاعة الدكتور عبدالحميد الغزالي<br />الدكتور /عبد الحميد حسن الغزالي<br />الإسم :<br />عبد الحميد حسن الغزالي<br />تاريخ ومكان الميلاد :<br />23 فبراير 1937م ـ الشهداء / المنوفية / جمهورية مصر<br />المؤهلات العلمية :<br />دكتوراه الفلسفة في الاقتصاد ـ اقتصاديات التخطيط ـ المملكة المتحدة 1968م.<br />الوظائف العلمية :<br />عضو هيئة التدريس بكلية الاقتصاد والعلوم السياسية ـ جامعة القاهرة ، منذ 1968م حتى الآن.<br />أستاذ زائر ـ معار ـ جامعة أم درمان ، جامعة الكويت ، جامعة الملك عبد العزيز ، جامعة أم القرى.<br />الوظائف العملية :<br />عضو مجلس إدارة المصرف الإسلامي الدولي للاستثمار والتنمية 1980 ـ 1990م.<br />مستشار اقتصادي للمصرف الإسلامي الدولي 1985 ـ 1990م.<br />مؤسس ومشرف على مركز الاقتصاد الإسلامي بالقاهرة 1985 ـ 1990م<br />مدير المعهد الإسلامي للبحوث والتدريب ـ البنك الإسلامي للتنمية 1411 ـ 1415هـ.<br />رئيس لجنة تنسيق البحوث بين البنوك الإسلامية 1991 ـ 1995م.<br />الإنتاج العلمي في مجال المصرفية الإسلامية : ( المؤلفات ) :<br />دراسة جدوى المصرف الإسلامي 1978م.<br />الأرباح والفوائد بين التحليل الاقتصادي والحكم الشرعي 1990م<br />حول أساسيات المصرفية الإسلامية ، 2001م.<br />العديد من المقالات في مجال المصرفية الإسلامية.<br />الإشراف على العديد من الدراسات في مجال المصرفية الإسلامية كصادرات مركز الاقتصاد الإسلامي بالقاهرة ، وللمعهد الإسلامي للبحوث والتدريب بجدة.<br />الإشراف على العديد من رسائل الماجستير والدكتوراه في مجال المصرفية الإسلامية.<br />الإشراف على تنفيذ برامج تدريبية لرفع كفاءة العاملين في بالمصارف الإسلامية.<br />الاشتراك في العديد من الندوات وورش العمل والمؤتمرات حول المصرفية الإس<br />كفاية جيش بقا حرام عليكم حرام عليكم<br />أبلغ عن هذا التعليق<br />55 سنه جيش يا عالم كفاية كفاية كفاية<br />أرسل هذا التعليق بواسطة : مش كفاية مش كفاية احنا معاك للنهاية<br />محمد حسنى مبارك - السيرة الذاتية 8/16/2005 4:18:00 PM<br />ولد الرئيس محمد حسني مبارك في قرية كفر مصيلحه محافظة المنوفية، بمنطقة الدلتا بقلب مصر، في 4 مايو 1928.<br />وفي عام 1950، التحق بالكلية الجوية حيث حصل على درجة البكالوريوس في العلوم الجوية وتدرج بعد ذلك في عدد من المناصب القيادية في القوات الجوية المصرية: كطيار، ثم مدرس، فقائد تشكيلات، فقائد لقاعدة جوية، وتلقى دراسات عليا بأكاديمية \\\"فرونز\\\" العسكرية في الاتحاد السوفيتي.<br />وقد تميز الرئيس مبارك طوال فترة عمله بالقوات الجوية بالانضباط والتميز، وهو ما أهله لأن يعين في عام 1964 قائداً لإحدى القواعد الجوية غرب القاهرة، ليكون أصغر طيار يقود قاعدة جوية.<br />وفى عام 1967 عُين مديراً للكلية الحربية، ثم رئيساً لأركان حرب القوات الجوية المصرية. وهو المنصب الذي ظل يشغله حتى تم تعيينه قائداً للقوات الجوية عام 1972. وخلال هذه الفترة، تمكن من إعداد كوادر جوية مقاتلة خاضت معركة أكتوبر 1973 وكان الرئيس مبارك صاحب خطة الضربة الجوية الأولى.<br />عقب حرب أكتوبر 1973، رقي لمنصب فريق جوى. وفى عام 1975، اختاره الرئيس السادات نائبا لرئيس الجمهورية، ثم عُين نائباً لرئيس الحزب الوطني الديمقراطي عام 1978."
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510152912/http://masr.20at.com:80/newArticle.php?sid=15699"

[[comments]]
order = 2
subject = "نظام فاشل ومن اغبى انظمة الحكم فى العالم"
author = "تاتا خطى الغتبة"
posted = "2008-05-09"
text = "النظام الفاشل كل مكاسبة كم ماخور سياحى فى شرم الشيخ<br />وكم قرية سياحية فى الغردقة<br />انما اية التنمية والمصانع اللى عملها للملايين فى اسيوط وقنا<br />اية هى فرص العمل اللى جابها نظام مبارك فى محافظة زى الدقهلية تعدادها اربعة ملايين مواطن<br />لا شىء<br />شوية مصانع فى كم مدينة جديدة تعدادها لا يتجاوز نصف مليون وكل يوم رايح ينط هناك بيفتح مصانع مفتتحة من عشرين سنة<br />75 مليون مصرى مجمد من 26 سنة<br />ومسرحية عيد العمال معروفة<br />جابوا شوية مخبرين وظباط امن دولة فى صالة الاحتفال بعيد العمال يهتفوا لة ويهيصوا لة وهم بملابس العمال<br />انا عامل فى مدينة زارها مبارك ودخل المصنع اللى اشتغل فية<br />الامن قبلها ب 3 ايام اخبروا جميع العمال ان محدش ييجى الشغل فى اليوم دة<br />واللى وقف على المكن والمعدات ضباط امن الدولة لابسين افرولات وعاملين نفسهم عمال علشان يمر الريس عليهم ويلاقى وشهم منور ومش ممصوص واصفر من الجوع زى العمال العاديين<br />وهتف بتوع الامن لة وكانهم العمال<br />تمثيلية بايخة قوى ملينا منها<br />طيب عمر حسنى مبارك ما خطب للشعب فى ساحة مفتوحة ولا فى استاد رياضى<br />لازم يخطب فى صالة مغلقة علشان الامن يعرف يحرسة كويس ويذنب الناس قبل حضورة بالتفتيش اربعة ساعات<br />العملية بقت مسخرة قدام الناس"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510152912/http://masr.20at.com:80/newArticle.php?sid=15699"
