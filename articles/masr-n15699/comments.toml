subject = "بعد اغتيال السادات فرضت الاحكام العرفية وقانون الط"
author = "صحفى من منازلهم"
posted = "2008-05-09"
text = "حينما تحكم البلد بقانون الطوارىء الذى وضع سنة 1914 ايام احتلال الانجليز والذى ثار علية سعد زغلول وثورة 1919 معنى حكم الطوارىء كلمتين<br />هو ان الذى يحكم هو الامن<br />والامن انواع - امن الدولة - مباحث امن الدولة - محاكم امن الدولة<br />والنظام المصرى فريد فى العالم النامى والمتخلف<br />عندنا محاكم الاسرة - المحاكم الجنائية - المحاكم العسكرية - محاكم امن الدولة<br />مع ان جميع انظمة العالم فيها يقدم الشخص لمحكمة واحدة فقط<br />فطبعا قانون الطوترىء ممكن الناس تتحملة وقت الحروب او شهور انما سبعة وعشرين سنة فهذا قتل لاقتصاد شعب وسجن لافكارة وتدمير لمبادىء اى امة<br />الامن توحش واصبح يمتص كل فلوس البلد<br />750 الف عسكرى امن مركزى لية<br />بيحاربوا مين<br />ايام حرب 65 وايام 67 و 73 لما كان فية حرب مع اسرائيل كان الجيش 500 الف عسكرى<br />انما لما ييجى السلام اعمل جيش لمحاربة الشعب اسمة قوات الامن المركزى وعددة 750 الف عسكرى<br />يبقى محدش يسأل الفلوس بتروح فين"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510152912/http://masr.20at.com:80/newArticle.php?sid=15699"

