author = "SB - مصري"
posted = "2008-02-04"
text = "هل تعملون ان اليهود قد أزعجتهم صورة أبو تريكة والفانلة التي تناهض عزة العربية واتفقوا مع محرك البحث جوجل لرفع هذه الصورة من البحث على جوجل - يعني صورة عملت فيهم كده ومعني ذلك أننا لو تحركنا اكثر واتحد العرب لصار الرعب في قلبوهم - اتمنى من الله أن يجمتع العرب لنرى ماهم عليه"
