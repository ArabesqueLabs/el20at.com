author = "حسناء المغرب"
posted = "2008-12-31"
text = "اني استنكر وبقوة العدوان الاسرائيلي كما اني اطالب من كل العرب ان يتفقو وان يقفو وقفة واحد ان يلتعمو وان يصرخو في وجه العدو الصهيونى عدو الامة الاسلامية والعربية ،لانادى واقول افيقويا مسلمين وافيقو ياعرب يا من يجري في عروقهم شىء من دم محمد صلى الله عليه وسلم اغيثو اشقاءنا في غزة فاين هى النخوة العربية واين هى العزة والانفة اين هى ضمائركم اتظنونها حية لا والله على هذا الحال لهي ميتة كيف يمكن ان نرى صور خراب ودمار لا تهتز فينا شعرة كيف يمكن بنا ان نرى جرحى وقتلى لا بل شهداء اطفال وشيوخ و لا نتكلن ويا حصرتااااه عليك يا غزة ويا اسفاه علينا نحن العرب ، لكن يامن في قلبه شيء من الايمان لا تنسى الدعاء فهو اضعف الايمان<br />يا ذا العرش المجيد /يا فعال لما تريد / برحمتك نستعين<br />اللهم انصر اخواننا المجاهدين في كل مكان<br />اللهم تبث اقدامهم<br />اللهم كن معهم ولا تكن عليهم<br />وكفهم شر الاشرار وكيد الفجار<br />اللهم كن عينهم التى يرون بها واذانهم التي يسمعون بها و ايديهم التي يبطشون بها يارب العالمين<br />اللهم احفظهم من عبث العابثين واعين العملاء الخائنين ومن الخذل و المتخادلين واجعلهم من عبادك الصالحين<br />اللهم زلزل الارض تحت اقدام اعدائهم<br />اللهم عليك باعدائهم<br />اللهم زلزل كيانهم واعمي بصائرهم و شل اركانهم<br />وفرق جمعهم<br />و اجعل ضرباتهم في في المجاهدين خائبة<br />واجعل ضربات المجاهدين فيهم صائبة يارحم الارحمين و يا اجود الاجودين<br />اللهم اكرمهم بشهادة تصبهم بها الفردوس الاعلى وتجمعهم مع الانبياء و الصديقين<br />اللهم انا نسال كان تحرر البيت الاقصى من اليهود و من دنس اليهود وكيد اليهود برحمتك يا ارحم الارحمين<br />اللهم احصي اليهود ومن معهم عداد واقتلهم بددا ولا تغادر منهم احدا<br />اللهم انصر اخواننا في غزة اللهم دمر اعداءنا اعداء المسلمين في كل مكان<br />اللهم عليك باليهود الصهاينة<br />اللهم ايدهم بروح من عندك<br />اللهم امددهم بملاء من جندك<br />اللهم انصرهم بعينك التى لا تنام<br />واكلأهم في كنفك الذى لا يضام<br />اللهم عليك باعدائك اعداء المسلمين<br />اللهم من كاد للاسلام فكده<br />ومن مكر به فامكر به<br />ومن بغى عليه فخذه<br />فانه لا يعضم عليك اللهم كن لهم عونا ونصيرا<br />اللهم ارزقنا صلاة في القدس قبل الممات<br />اللهم لا تحرمنا اجر المجاهدين و لا تفتنا بعدهم"
archived = "2010-03-14"
