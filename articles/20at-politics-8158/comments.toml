subject = "مليون مره"
author = "نيفين نيفى نوفا"
posted = "2008-02-04"
text = "الموت لاسرائيل<br />الموت مليون مره للصهيونيه و الصهاينه فكرا و عقيده<br />المدرسه الاسرائيليه بتقف ف الفصل بتعلم الاطفال الاسرائيلين الفكرالصهيونى و على خريطه اسرائيل و تحت العلم الاسرائيلى بتقول للاطفال ده علم اسرائيل و دى دوله اسرائيل الكبرى من النيل للفرات<br />كلمه مكتوبه على سقف الكنيست و مكتوبه ف قلوبهم و عقولهم<br />وانا ساعات بحس ان احنا كعرب بنتولد فطريا كارهين اسرائيل لدرجه انى بحس ان الكره ده بيوصللنا من امهاتنا ف الرحم<br />التار بايت"
archived = "2010-03-14"
