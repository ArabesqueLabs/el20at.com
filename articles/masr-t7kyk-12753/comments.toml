text = "انا رايي ياجماعه ان السبب في زوغان عين الرجل المصري هي الحاله الاقتصاديه ...ايوه هي الحاله الاقتصاديه .. هتقولي ازاااااااي<br />هقولك ... يعني لما يكون الراجل مرتاح في بيته ومعيش مراته عيشه كويسه ومهنيها .. اكيد مش هطتر تنزل تشتغل وهتهتم بيه وبالبيت وهيبقي في وقت تهتم بنفسها كمان .<br />مش الراجل طول النهار طافح لدم وهي كمان طافحه الدم في شغلها ويجي البيت عايزها تكون برنسيسه مستنياه ... اكيد هيلاقيها اتحزلت بعد شويه لحاجه تانيه خالص<br />فاكيد بالشكل ده هيطر يبص بره"
