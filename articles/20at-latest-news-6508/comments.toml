subject = "بلاش كلام الحقد الشعوبي ده! كلنا اخوة!"
author = "مصري مسلم متجول"
posted = "2007-07-01"
text = "لصاحب التعليق السابق...<br />الاخوة السعوديين ربنا رزقهم بالمال ومن يعتم منهم بطلب التعليم العالي يستطيع بسهولة تحصيله من الدول المتقدمة مباشرة...<br />وشهدت السنوات الأخيرة نبوغ \"عالمي\" للعديد من السعوديين والسعوديات في مجالات متعددة خاصة \"الطب\"...<br />وميغركش كترة الكليات والجامعات المعوقة في مصر اللي بتطلع آلاف الشباب من أنصاف المتعلمين الذين هم بحاجة لإعادة تأهيل -إلا من رحم الله- !"
