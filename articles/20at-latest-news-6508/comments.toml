subject = "السعودية"
author = "شاب غيور"
posted = "2007-07-03"
text = "يا شباب بلا مناقشه احنا بشر وتعليمنا محدود<br />كما قال عز وجل وما اوتيتم من العلم الا قليلا صدق الله العضيم<br />هذا الايه تدل اننا كلنا بمستوى واحد انضرو الى كلام الخالق ولا تنضرو الى الجنسية او البلد<br />الشيئ الاخر الذي لفت نضري الاخ الذي اسما نفسه السعوديه بلد الارهاب لا تنسى انها مهبط الوحي<br />ولا تنسى ان كل انسان يحاسب بعمله لا باعمال الاخرين وشكرا محبكم في الله ؟؟؟؟؟"
