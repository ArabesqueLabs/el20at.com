[[comments]]
order = 1
subject = "هذه الالعاب موجودة في اغنى بلد في العالم امريكا"
author = "اكتب اسمك هنا"
posted = "2007-12-24"
text = "يا بنت الحاج عبدالفضيل ليه عايزه تعملي فتنة ضد الدولة بهذا الموضوع وعابر سبيل ما صدق ودخل في الموضوع على طول<br />هذه العاب سيركية موجودة في امريكا والله<br />وايه يا عم عابر سبيل لو كنت في بلد محترمه ايش دخل البلد في الشغل<br />طيب ما هو فيه نساء بتغسل مراحيض في البلاد المحترمه وغير المحترمه<br />ايش دخل البلد في هذه اللغبة دي لعبة سيرك والسيرك موجود في كل بلاد العالم وفيه نساء بيلعبوا نفس اللعبة في اغنى بلاد العالم<br />ومصر محترمه والحمد لله واكبر دولة اسلامية عربية ربنا يحميكي يا مصر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "يا ابن اللي ما عرفش اسمه"
author = "واحد معدي"
posted = "2007-12-25"
text = "الي الاخ بتاع مصر اكبر دولة اسلامية وعربية<br />يا ابن اللي ما عرفش اسمه واعتقد انك كمان مش عارف مصر مش اكبر دولة اسلامية وعربية ولازم نعترف بهذا ولا ندفن انفسنا في الرمال، وانصحك بالذهاب الي دبي لتعرف حقيقة مصر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الى واحد معدي"
posted = "2007-12-26"
text = "وحياة امك الغالية انا في دبي بقالي 26 سنه<br />ومصر اكبر دولة عربية اسلامية سواء رضيت ام لم ترضى<br />والمصريين هما اللي عملوا دبي بشهادة اهل البلد انفسهم<br />والمدرس المصري والطبيب المصري هما اول من وطأت اقدامهم دبي والخليج"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "الى الاخ بتاع دبى 26 سنة"
author = "واحد"
posted = "2007-12-26"
text = "مع اسفى الشديد لنفخ ذاتك اكتر من اللازم - وطيرانك فى الفراغ<br />اظنك تعرف ان معنى كلمة مصرى فى الخليج اية - يعنى يا محترم واظنك تعرفها جيدا - معناها عندهم فى لغتهم العامية واسف ومتضايق طبعا ولكنها الحقيقة معناها الحمار - مصرى معناها ( الحمار )<br />وطبعا اللى بنى دبى الهنود والباكسنيون والايرانيون وكلهم اصحاب رأس المال والشركات<br />اما المصريون فبدأوا بشوية مدرسين وقليل جدا من الاطباء ثم تطور الزمن واصبح هناك بعض الساقطات كما ضبط اخيرا فى اكبر شبكة دعارة فى دبى<br />ثم تطور الحال اكثر واصبح الخدم فى الفنادق والمقاهى والبنات اللى بتقدم الشيشة مصريات جامعيات<br />ثم تقولى اكبر دولة عربية واسلامية ( دى واسعة قوى )<br />اكبر دولة اسلامية اندونيسيا وتليها الباكستان<br />خليك واقعى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "الى واحد"
author = "اكتب اسمك هنا"
posted = "2007-12-30"
text = "يا اخي العزيز<br />محمد الفايد ابو دودي الفايد اللي كان حيتجوز دينا دا مصري من الذين ساعدوا حكام دبي على نهضة دبي<br />كل المدرسين بلا استثناء كانوا مصريين وبقية العرب طلعوا على اكتافهم<br />كل الاطباء في مصر بدون مبالغة في مستشفى راشد ومستشفى الكويت في دبي 80% منهم كانوا مصريين<br />الوظائف الحكومية العمود الفقري فيها كان مصريين بلا استثناء وبدأ العرب يطلعون على اكتافهم<br />كل القضاه بلا استثناء كانوا مصريين وكل المستشارين القانونيين الا قليلا<br />صحيح الحال اتبدل الان بس الفضل كله يرجع لمصر في بناء دولة الامارات وبقية دول الخليج<br />الهنود والباكستانيين تجار وعمال<br />والحال اتبدل الان واصبح المصريين الكبار اقلية بسبب التوطين والجنسيات الاخرى التي دخلت سوق العمل<br />اما حكاية الدعارة دي غير صحيحة على الاطلاق شبكة الدعارة اللي مسكوها اخيرا في دبي كانت صينية<br />الدعارة هنا روسيات وصينيات وافريقيات<br />العرب عموما سواء كانوا لبنانيين او مصريين او سوريين او مغاربة قليل جدا لما بيتورطوا في قضايا الدعارة والمغاربة بشكل كبير<br />والسلام"
archived = "2010-03-14"
capture_url = ""
