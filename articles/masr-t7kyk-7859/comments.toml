subject = "لو كنت فى بلد محترمة"
author = "عابر سبيل"
posted = "2007-12-24"
text = "لو كنت فى بلد محترمة كان القانون كفل ليكى معيشة ادامية واعطاك معاش تقاعدى او بطالة<br />ولكنك يا مسكينة فى زمن الحرامية ولجنة عصابة على بابا والاربعين حرامى"
archived = "2010-03-14"
