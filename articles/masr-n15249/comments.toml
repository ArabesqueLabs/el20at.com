text = "كلامكم كتير<br />وفعلكم مفيش - شوية خوافين<br />بعد 6 ابريل مفيش تعاطف<br />خليكم مع الحكومة ومع التوريث<br />انما شعب مصر العامل المترابط العامل والفلاح والطالب والتاجر هم الذين سيحررون مصر"
