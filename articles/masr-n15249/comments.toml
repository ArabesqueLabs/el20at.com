posted = "2008-04-16"
text = "يا دكتور عبدالمنعم جماعة الاخوان دي من سنة 1927 واصطدمت بنظام الملك فاروق ثم نظام جمال عبدالناصر ثم نظام السادات ثم نظام حسني مبارك يا دكتور عبدالمنعم اخطائكم هي هي ما بتتغيرش الاخوان المسلمين اللي اعتقلهم الملك فاروق هما اللي اعتقلهم جمال عبدالناصر هما اللي اعتقلهم السادات وهما هما الي اعتقلهم حسني مبارك مفيش فايدة فيكم"
archived = "2011-10-22"
capture_url = "https://web.archive.org/web/20111022005838/http://www.20at.com:80/20at/religious/8796.html"

