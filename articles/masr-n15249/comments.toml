[[comments]]
order = 0
subject = "يا دكتور عبدالمنعم ابو الفتوح"
author = "اكتب اسمك هنا"
posted = "2008-04-16"
text = "يا دكتور عبدالمنعم جماعة الاخوان دي من سنة 1927 واصطدمت بنظام الملك فاروق ثم نظام جمال عبدالناصر ثم نظام السادات ثم نظام حسني مبارك يا دكتور عبدالمنعم اخطائكم هي هي ما بتتغيرش الاخوان المسلمين اللي اعتقلهم الملك فاروق هما اللي اعتقلهم جمال عبدالناصر هما اللي اعتقلهم السادات وهما هما الي اعتقلهم حسني مبارك مفيش فايدة فيكم"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420052621/http://masr.20at.com:80/newArticle.php?sid=15249"

[[comments]]
order = 1
subject = "انتا انسان ..."
author = "اكتب اسمك هنا"
posted = "2008-04-16"
text = "بدل ما تشتم يا بجم كنت قوم اتحرك دافع عن بلدك اللي بتتسرق عن اهلك وشعبك اللي حاكمهم حاكم مستبد بقاله 24 سنة وعايز يورثها لابنه خرب البلد وسرقوها هو والشلة اللي حواليه ..متخلنيش اغلط اكتر ن كده فيك"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420052621/http://masr.20at.com:80/newArticle.php?sid=15249"

[[comments]]
order = 2
subject = "بعد 6 ابريل كل كلام الاخوان فشنك والبطلة اسراء عبد"
author = "مش لاعب"
posted = "2008-04-16"
text = "كلامكم كتير<br />وفعلكم مفيش - شوية خوافين<br />بعد 6 ابريل مفيش تعاطف<br />خليكم مع الحكومة ومع التوريث<br />انما شعب مصر العامل المترابط العامل والفلاح والطالب والتاجر هم الذين سيحررون مصر"
archived = "2008-04-20"
