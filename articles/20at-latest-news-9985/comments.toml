subject = "86 زوجة .... ويطمح إلى أكثر من ذلك !"
author = "محمد نواف"
posted = "2008-09-03"
text = "ولله في خلقه شؤون ..<br />يا مفتري 86 زوجة .. ومش شبعان .. لاعاد كم بدك ؟!<br />ليكون ناوي تحطم وتكسر الرقم القياسي بأكثر عدد ممكن من الزوجات ؟!<br />لا ! أنت شكلك ناوي تدخل موسوعة جينس للأرقام القياسية !!<br />وبعدين هالرجل هاذ ماحسب حساب إنو عمرو 84 سنة ( وبهالعمر هاذ صعب إنو يخلف لأ مستحيل إنو يخلّف ) يمكن مستصغر حالو ومتشبب .. واتحدى إنو حافظ كل أسماء أولادو وبناتو الـ 170 ! الله اكبر ( مدرسة بحالها ) !!<br />سبحانك ربي !"
