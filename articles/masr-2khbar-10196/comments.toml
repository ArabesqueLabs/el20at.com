subject = "فتش عن الطابور الخامس - النصارى"
author = "لية"
posted = "2008-10-05"
text = "كل مصيبة فى مصر سببها النصارى - المهندس النصرانى المقبوض علية فى حريق المسرح علامة او شاهد واضح<br />دائما الضعيف الجبان يقتل بالسم كما فى حوادث قتل النساء او يحرق فى الظلام كما يفعل النصارى<br />حينما عزل المرحوم السادات المقبور شنودة ورماة زى الكلب فى الدير ازدادت حوادث الحرائق فى مصر فحرقت الاوبرا المصرية فى العتبة وحرق قصر الجوهرة فى القلعة وحرقت مخازن الترام وغيرها فى تلك الفترة<br />نحن لا نلقى التهم جزافا ولكنة الواقع وراقبوهم جيدا<br />اليوم نشرت جريدة المصريون ان كلبا نصرانيا فى الصعيد تبحث الشرطة عنة الف كتابا اسمة تيس ابليس فى مكة وكلة سب وشتيمة فى حضرة الرسول صلى اللة علية وسلم<br />اما ان الاوان لنحرقهم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "إلى لية"
author = "محمد عادل الزنكلونى"
posted = "2008-10-05"
text = "المتخلفين أمثال صاحب أو صاحبة التعليق الخاص بالنصارى هما اللى موديين البلد فى داهية .<br />أكيد من الإخوان المسلمين اللى عاوزين يولعوها فى مصر .. عاوزين يخربوها و يقعدوا على تلها لكن إن شاء الله إحنا كلنا مسيحيين و مسلمين إيد واحدة و الإخوان المسلمين اللى ميعرفوش أى حاجة أصلا عن الإسلام غير إنه ذبح و جهاد بس هما اللى هيقعدوا بس مش على تلها لا المرة دى هيقعدوا على خااااااااااااازوووووووووووووق<br />الله يقرفكم و يخرب بيوتكم يا متخلفين يا أسباب الفتن و المصايب<br />اللهم فرق شملكم و شتت جمعكم.<br />اللهم أنصرنا على هؤلاء المتأسلمين<br />اللهم آمين<br />اللهم آمين<br />اللهم آمين يارب العالمين<br />و أنا من هنا أعتذر لكل إنسان مسيحى مصرى وطنى عن سفالة التعليق السابق الذى لا يخرج إلا من السفلة و الجهلاء و مثيرى الفتن"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "الى الاخ (محمد عادل الزنكلونى) اشكرك و اكثر اللة م"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-06"
text = "لا تعليق<br />(الشاهد ! شاهد من اهلة؟!!!)<br />الاسلام ليس سفالة او انحطاط او قلة ادب او اذدراء العقائد و الاديان؟<br />لا تعطونا ذريعة للتهجم على الاسلام<br />حرام عليكم يا متاسلمين؟<br />انتم تضرون الاسلام اكثر من اليهود ؟<br />الاديان عند معتنقيها شيئ مقدس؟<br />(المسلم من سلم الناس من يدة و لسانة؟!!!!!!!!) فهل انتم بهذة الهجمات القذرة المنحطة تبشرون بالاسلام ام انكم (تشهرون بالاسلام)؟<br />ليكن معلوما للجميع انة لا و لن تقوم قائمة لامثالكم ايها السفهاء!<br />جماعتكم المحظورة و لى عليها الزمان و المكان؟ اذهبوا الى الجحيم حيث مكانكم الابدى يا مدعى الاسلام حقدا و تطاعا لحكم و اشعال البلاد بوقود جهنم يا حثالة تدب على الارض و تشعل حقدا و جهلا و فسادا؟<br />الحكم فى مصر (للسلطة و الشرعية و النظام) و ليس لكم ايها الموتورين ذوى الذقون الشعثة المتربة مدعى الايمان ظاهرا و مريدى الخراب باطنا!<br />لعنكم اللة دنيا و اخرة لقد ضررتم الاسلام فى مقتل عندما تتهجمون بحقد و غباء و جهل موتور على اخوتكم ابناء الوطن الواحد<br />و تهاجمون عقائدهم و رمز دينهم عن غير حق؟<br />الجميع سواء مسلمين او اقباط مسحيين لديهم من القدرة و المقدرة على الرد باكثر مما تعتقدون انكم تستطيعون؟<br />و لمن ما النتيجة سوى انحطاط و قذارة و قلة ادب و تخلف و حقد يولد من الكراهية اكثر من نيران جهنم فى الاخرة؟<br />اتقوا اللة فى مصركم و اسلامكم الحق!!!<br />غفير اللة لى و لكم و لنا جميعا! انة غفور رحيم<br />اللهم استجب لنا امين يا رب العالمين<br />انك مستجيب الدعاء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "لا يوجد غيرهم يفعل ذلك - وهم تحت المراقبة حاليا -"
author = "عادل"
posted = "2008-10-06"
text = "هذا الكلام ليس افتراء<br />الذى زرع الفساد وابتدع الرشوة هم تلك الاقلية - انهم سوس حقير فى المجتمع<br />والتهمة جاهزة عندهم لكل من يكشفهم - فى الحال يبقى اخوان<br />انما بيشوى لما يقل ادبة ويروح امريكا يسب فى المسلمين يبقى حرية راى<br />انا لااعرف حاجة اسمها وحدة وطنية<br />الوطن كلة موحد والحمد اللة<br />ماذا يستطيع ان يفعل 4% فى الوحدة الوطنية<br />وحتى لو مات 4 % فلن تتاثر الوحدة الوطنية<br />تخريف ال 4 % ونسيج الامة وعنصرى الامة<br />الامة المصرية عنصر واحد مسلم واقلية هامشية لا تؤثر فى شىء - زى 6% مسلمين فى فرنسا او 7 % مسلمين فى بريطانيا<br />بلاش العزف على كلام كبير وتضخيم اقلية ليس لها اى لزمة فى الوطن"
archived = "2010-03-14"
capture_url = ""

