subject = "تانى بلاش نفتح فى مواضيع لستم على علم ودرايه بها ."
author = "محمد على الحداد"
posted = "2008-10-31"
text = "انا لسه بكتب تعليقى لاقيت (ممدوح زكى زخارى جرجس) بتقول كل سفيه يرتدى حجاب وعبائه ياعم و بالله عليك دى حريه شخصيه وفريضه فى الدين الاسلامى طبعا الاخلاق دى رقم واحد فى التعامل بين الافراد بلاش تخلى حد تانى يرد عليك يقولك ماهو عندكم مش عارف ايه تفتح جنب تانى فى الحوار كفاااايه بقى<br />بالله عليك ربنا حيستجيب لدعائك وانت بتقول يالله اغفر لهم فهم جهلاء<br />يعنى ربنا بيقولك ماتسبش فى حد وانت بتدعيه بالسب فى اللى بتدعى لهم<br />الكلب كلب حتى و لو كرة المشركون مدعى الدين و العلم<br />ده مش كلام ولا اسلوب حوار ابدا ممع ان الكلام مش ليا لكن انا ارفض هذا الاسلوب فىى الحوار<br />لو انك انت اللى تعرف الدين والعلم جيدا وتتكلم بهذه الطريقه فشكرا جدا لعلم و طريقه اخذك للدين<br />تنويه : انت لسه قايل ادين معامله واخلاق .....؟؟؟!!!!!!!!!!!!!!!!!!!!"
