[[comments]]
order = 5
subject = "إلى الأخ عادل"
author = "محمد عادل الزنكلونى"
posted = "2008-10-06"
text = "و الله إنك و أمثالك من يفسدون الدين<br />ألم تسمع عن رسول الله صلى الله عليه و سلم و هو يهادن المسيحيين و يأمنهم على أموالهم و نساءهم و أعراضهم ؟؟<br />ألم تسمع بالحديث القائل : من آذى ذميا فقد آذانى ؟؟<br />و فى رواية أخرى : من آذى ذميا فقد كفر بما أنزل على محمد ؟؟<br />ألم تعلم عن الرسول العظيم المبعوث رحمة للعالمين و هو يتحالف و يتعاهد مع اليهود لمصلحة الأمة الإسلامية أولا و لرحمته بهم ثانيا ؟؟<br />أتأتى أنت و أمثالك اليوم لتنقض ما بدأه رسول الله ؟؟<br />و من أنت ؟؟ و من هم أمثالك ؟؟<br />ما أنتم إلا شرذمة تتبع رجل متخلف يسمى نفسه (( مرشد )) و هو من يحتاج إلى إرشاد !!<br />و الله إن من إتخذ مرشدا آخر غير رسول الله و سنته فهو فى ضلال مبين ...<br />قال رسول الله صلى الله عليه و سلم : (( تركت فيكم ما إن إتبعتوه لن تضلوا بعدى أبدا . كتاب الله و سنتى ))<br />صدقت يا رسول الله و كذب الكاذبون<br />صدقت حتى ولو كره الكارهون"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "مصر دولة اسلامية فيها اقلية ارثوذكية زى انجلترا دو"
author = "مصرى"
posted = "2008-10-07"
text = "اية الكلام الفارغ اللى مليتوا بة الدنيا - الوحدة الوطنية<br />مواقع النصارى كلها على النت بتدعوا الى وقفة حداد لمدة دقيقة واحدة يوم 5 اكتوبر بمناسبة يوم الفتح العربى او كما يسمونة الغزو العربى لمصر<br />وهم كانهم سكان مصر<br />النصارى فى مصر ليسوا مصريين<br />موسى لما خرج من مصر مش كل اليهود خرجوا معاة - دا كان فية المريض والضعيف واللى مش عايز يخرج وبقايا اليهود دول هم اجداد النصارى عندنا<br />كذلك كان فية احتلال رومانى لمصر 700 سنة قبل عمرو بن العاص وكان لهم جاليات كبيرة من الرومان هم ايضا اجداد النصارى الحاليين<br />احنا معندناش مصريين نصارى - احنا عندنا ناس من اصول اجنبية يؤمنون ببقايا الوثنية ازيس الام وازوريس الاب والابن يسوع اللى هو حورس<br />الوحدة الوطنية بخير والحمد للة المسلمين كلهم وحدة واحدة والاقلية القذرة لا تستطيع ان تحرك طوبة فى مصر فقط بيعملوا حرايق ويتجسسوا على البلد لصالح اسرائيل وامريكا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "الى المناظر(محمد عادل الزنكلونى) مرة ثانية أشكرك"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-07"
text = "لندع هؤلاء الجهلة الموتورين فى ظلامهم الاعمى؟<br />و حقدهم الدفين<br />و غبائهم المبين<br />النقاء و الطهارة و التدين الحق بالادب و الاحترام<br />و ليس كل سفيهة يرتدى حجاب او نقاب او عباية و اطلق ليحتة و نشر سموم افكارة المريضة و فتاويهة المضحكة و ما كثرتها مثل(ارضاع الكبير) و .....غيرها من الكثير اصبح من العلماء و خبراء الدين؟<br />ومالكى قصور فى الجنة؟ انهم حقا مالكى كل نار جهنم من سعير و صراخ و بكاء و عويل!!!<br />اغفر لهم ياللة انهم جهلة لا يفقهون مازا يقولون و مازا يفتون و مازا يعلمون؟<br />(اللة القدوس القدير (اغفر لهم انك غفور رحيم)<br />الاخ(محمد عادل الزنكلونى)<br />دعك من هؤلاء الاكلاب الموبؤئين و اجعلهم يهوهووووا (هو هو هو هو هو)<br />الكلاب ستظل طول عمرها كلاب<br />و الكون و الطبيعة لا و لن تتغير و لن تستطيع تغيير جنس(الكلاب) الى جنس اخر يفهم و يتعلمو يتعظ؟<br />ليكون محترم<br />الكلب كلب حتى و لو كرة المشركون مدعى الدين و العلم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "إلى الأخ مصرى"
author = "محمد عادل الزنكلونى"
posted = "2008-10-07"
text = "أسكت يا أخى حتى لا يضحك الناس عليك<br />فمن الواضح جدا جهلك المدقع فى التاريخ<br />هؤلاء المسيحيون المصريون أجدادهم هم سكان مصر الأصليون و ذلك لا يمنع أن منهم من دخل الإسلام إيمانا بسماحته - و ليس إيمانا بهذا الهراء الذى تقولونه - و هؤلاء هم أجدادنا المسلمون الذين أناروا الدنيا علما و حقا و نورا مع إخوانهم المسيحيين على مدى الأزمان .<br />و الله أنا لا أعلم لماذا نخاف و نستحى أن نذكر أن المسيحيين هم أصلا سكان مصر الأصليون و هم أصحاب الأصول الفرعونية فعلا ؟؟<br />هل مثلا أنت تستحى من ذكر أصولك العربية التى عاشت على الأرض التى تشرفت بنزول أشرف المرسلين عليها ؟؟<br />و الله أمرنا عجيب جدا !!!!!!<br />يا أخى .. التاريخ الإسلامى واضح جدا جدا جدا فى هذه المسألة فهو يقول أن أصحاب الأرض الحقيقيون هم النصارى و أن العرب جاءوا مصر ففتحوها و إستقروا فيها و تزوجوا من أهلها و دخل بعض من أهل مصر فى الإسلام لأسباب عديدة مثل الخوف من القتل أو عدم القدرة على دفع الجزية و لكن الأغلبية دخلوا عن إقتناع تام بالدين الحنيف .<br />أرجوك يا أخى إقرأ أولا كتب التاريح الإسلامى جيدا و إفخر بأصولك العربية و دعك من هؤلاء المزورين فى التاريخ و الذين سيكون مصيرهم فى مزبلة التاريخ فلا تجعل نفسك معهم<br />و لله الأمر من قبل و من بعد"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "دعونا نتكلم بالعقل"
author = "محمد على الحداد"
posted = "2008-10-31"
text = "يا جماعه ايه اللى حول موضوع عن حريق فى القاهره الى موضوع ومشكله بين المسلمين والمسحيين -ليست فتنه لانها لن تصل لفتنه ابدا انشاء الله- لكن واحد تكلم بحريه وقال المسحيين هما السبب فرد المسحيين قالوا لعنكم الله يا كذا وياكذا<br />السؤال الاول ل(ليه ) هل الاسلام وافق واعطاك الحق فى ان تسب جيرانك وولاد بلدك بمثل هذه الالفاظ سواء كانوا مسيحيين او يهود ؟؟!!! ابدا ابدا ابدا قال تعالى (لكم ديناكم ولى دين) وفبلاش بقى تنزل تحت عبائه الدين وتقول ان الاوان لنحرقهم من انت لتأخذ قرار حرق فئه بحالها فى المجتمع ( رجال ونساء وشيوخ واطفال ) هو ده برده الاسلام وقبل ما تقول دول سبوا الرسول -عليه الصلاه والسلام-شوف سيدنا محمد -اعظم خلق الله-كان بيعملهم ازاى واتعلم منه ازىتتكلم بدون ماتسبب مشاكل كلامك يدعوا للاستفذاذ لى كمسلم اكتر منهم كمسيحين<br />السؤال التانى ل(محمد عادل الزنكلونى) ياحول الله يارب مين قالك ان اللى قال الكلام ده واحد من الاخوان (ولا ترموا الناس بالباطل) يا راجل بلاش نتكلم عن فئه ونعمم عليها اولا سورى يعنى كلامك وضحلى انك ماتعرفش الفرق بين الاخوان والسلفيين وانا مش حوضحه لان الاتنين لا يدعون للدم لما تعرفهم كويس وتعرف اشخاص منهم ابدا ابحث بعديها عن جماعه اسمها التكفير والهجره ودول خلاص انتهوا فمصر بقالهم 20 سنه ارجوك يا اخى ماتخليش مصدر معلوماتك الافلام اللى برده مافيهاش ثقافه على حق<br />انا بس حقولك على معلومه صغيره الاخوان مش هما اللى بيربوا دقنهم<br />ولى فكره انا لا أنتمىللأخوان ولا لأى جماعه فى مصر ولا حتى حزب<br />السؤال التالت ل(ممدوح زكى زخارى جرجس) : رغم ان كلامك فى الاول كان كويس لكن قولى هل لك الحق ان تسب فى فئات انت لست على علم بها وحتى لو على علم بها هل ترى فى كلامك ودعائك عليهم كده الموضوع اتحل يعنى انت زوته اكتر ما قللته وخليت المشككله بقت بين المسيحين والاخوان او مصر كلها والاخوان برده ماتحلتش خالص وخليت الموضوعمابين مؤيد للاخوان ومعارض وحيبقى موضوع تالت غير الاساسى هى ناقصه<br />السؤال الرابع ل(عادل ): هى بالكم ولا ايه ؟؟ طول عمرها بالكيف ..!!"
archived = "2010-03-14"
capture_url = ""

