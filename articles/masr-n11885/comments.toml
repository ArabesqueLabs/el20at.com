[[comments]]
order = 0
subject = "الغلاء والغلاء"
author = "مصرى"
text = "السنة دى عملنا الكحك عينات حاجة كدة غصب عننا<br />خلوا حياتنا هباب وسواد بالغلاء الفاحش اللى عملوة<br />ربنا ياخدهم اخذ عزيز مقتدر<br />يارب بحق ليلة القدر - الناس اللى جوعتنا وخلت حياتنا بلاء ربنا يفتكرهم بقى<br />يارب<br />ولا تعرضنا لذل الحاجة يارب"
archived = "2007-10-13"
capture_url = "https://web.archive.org/web/20071013122317/http://masr.20at.com:80/newArticle.php?sid=11885"

[[comments]]
order = 1
subject = "الى الاخ مصري المعلق السابق"
text = "يا اخ مصري سبب الغلاء الخروج على الحاكم او الخروج على النظام<br />فيعمل ايه الحاكم<br />يعمل اجهزة امنية<br />الاجهزة الامنية دي عايزه فلوس كتير<br />فهمت يا اخ مصري<br />والحل<br />غلط نخرج عن الحاكم ما اقام الصلاة<br />الناس اللي خرجت على الحاكم مثل لا مؤاخذه الاخوان المسلمين وحركة كفاية وخلافه<br />خرجتها من ظلم الى اظلم وجعلت البلد على شفا كارثة اقتصادية<br />فياليت الناس السياسيين دول وعلى راسهم الاخوان يرجعوا لرشدهم ويرحموا شعبهم وما لهمش دعوة بالسياسة والحكم<br />وعليهم بالدعاء كما اوصانا النبي محمد صلى الله عليه وسلم اللهم ولي علينا خيارنا ولا تولي علينا شرارنا<br />واسمه كلام الحسن البصري قال ايه<br />من مواقف الحسن البصري<br />عاش الحسن رحمه الله الشطر الأكبر من حياتة في دولة بني أمية، وكان موقفه متحفظاً على الأحداث السياسية، وخاصة ما جرّ إلى الفتنة وسفك الدماء، حيث لم يخرج مع أي ثورة مسلحة ولو كانت باسم الإسلام، وكان يرى أن الخروج يؤدي إلى الفوضى والإضطراب، وفوضى ساعة يرتكب فيها من المظالم ما لا يرتكب في استبداد سنين، ويؤدي الخروج إلى طمع الأعداء في المسلمين، ولأن الناس يخرجون من يد ظالم إلى ظالم، وإن شق على دراية إصلاح الحاكم فما زال لإصلاح المحكومين مُيسراً. أما إن كان الحاكم ورعاً مطبقاً لأحكام الله مثل عُمر بن عبد العزيز، فإن الحسن ينصح له، ويقبل القضاء في عهده ليعينه على أداء مهمته.<br />ربنا ينجي البلد من فتنة الاخوان وكفاية وكل السياسيين والخوارج"
archived = "2007-10-13"
capture_url = "https://web.archive.org/web/20071013122317/http://masr.20at.com:80/newArticle.php?sid=11885"

[[comments]]
order = 2
subject = "تانى الحسن البصرى والحزب الوطنى"
author = "رخم بقى"
text = "هو الحسن البصرى بتاعك اسمة الحسن المصرى<br />امن اية واحنا عندنا مليون وربع امن مركزى<br />اشرب لك كوز ماء لفت ينصلح حالك<br />واقرا شوية سياسة فى جريدة الاهرام"
archived = "2007-10-13"
capture_url = "https://web.archive.org/web/20071013122317/http://masr.20at.com:80/newArticle.php?sid=11885"

[[comments]]
order = 3
subject = "الخروج يؤدي إلى الفوضى والإضطراب، وفوضى ساعة يرتكب فيها من المظالم ما لا يرتكب في استبداد سنين،"
author = "الحسن البصري"
text = "انا برد على الاخ اللي بيشتكي الغلاء<br />شوفوا الحسن البصري بيقول ايه يا جهله اقرا العنوان كويس يا اخ رخم بقى"
archived = "2007-10-13"
capture_url = "https://web.archive.org/web/20071013122317/http://masr.20at.com:80/newArticle.php?sid=11885"
