[[comments]]
order = 0
subject = "الكينج"
author = "دودو جارتك"
posted = "2007-12-31"
text = "ماااااااااااااشي يافاروق بقى انا برضه اللي بامشي عشان العزومات ولا الماسنجر اللي على طول مفتوح وعليه صور ...استغفر الله العظيم<br />انا قلت لك متخبطش في في مووضعك بس انت اضطريتني افشي اسرار جاري العزيز رغم محاولاتي الحثيثة على الحفاظ عليها بس يلا بقى انت اللي جبته لنفسك<br />هووووووووووس فاروق الكنج وصل، تحيتي له في الصباح لاتختلف عنها في المساء محمد هو جاري العزيز في المكتب والذي يقرر مزاج عشرينات طوال الاسبوع فالموضوعات تخرج من تحت يده كما قال ولكنه احيانا ياتي مقريف مش نايم كويس يقوم يعمل ايه بقى يشيل كده الكلام بالزوفة وياحظه الحلو لو محمد مبسوط وبيضحك ولو من غير سبب( وده شيء بيجنن استاذ عبد الله ويخليه يشد في شعره) بس في النهاية اليوم بيعدي<br />بصراحة بيتعب كثير وهو انسان مختلف تماما ولكنه تغير كثيرا فقد تلبسته روح عشرينات كما حدث مع مروة على راي شرين"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002257/http://masr.20at.com:80/newArticle.php?sid=13630"

[[comments]]
order = 1
subject = "محمد و الشازلونج"
author = "اكتب اسمك هنا"
posted = "2008-01-01"
text = "بجد كنت هزعل اوي يا محمد لو مكنتش جبت سيرة الشازلونج اللى بيطلع منه اجمل العناوين و انا و محمد على طول فى مراهنات العنوان ده هيجيب تعليقات من القراء و نجي الصبح نفاجئ بان الموضوع يا عين امة محدش عبره بجد اجتماعنا على الاشزلونج مرة يخيب و مرات بيصيب فالى احبائى القراء ارجو التعليقات على كل الموضوعات علشان تجبروا خاطرى انا و محمد او روقه كما القبه و طبعا هو عارف من روقة التي اقصدها"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002257/http://masr.20at.com:80/newArticle.php?sid=13630"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-01-01"
text = "موضوع حلو بجد ، وفيه روح جميلة كلها حب وود بينكم وبين بعض ، والأكثر من كده هو الوحدة الا موجودة في عشرينات ، تحس انه انتو في دائرة واحدة ومينفعش حد يخرج منها ، بس بجد ديسك مان ، بس فيه سؤال مين الديسك بتاعك ، وما انت لازم تحتج وتلاقيلك ديسك اشمعني هما بقي ، اعمل ثورة انت وروضة وطالبو بديسك ههههههههه<br />بالتوفيييييييييييييييييييييييييييييييييييييييييييييق"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002257/http://masr.20at.com:80/newArticle.php?sid=13630"

[[comments]]
order = 3
subject = "مشروع صحفى كبير"
author = "محمد عبد القادر"
posted = "2008-01-01"
text = "طول عمرى كنت حاسس انك مشروع لصحفى كويس ودايما كنت بستنى اقرأ موضوعاتك واشعارك من زمان من ايام السنوى . فاكر الايام الحلوة دى يا محمد. وبجد مش علشان صحبى انا بستمتع بكتاباته جدا ولسه يا فاروق كمل وان شاء الله هتبقى احسن واكبر لانى ملاحظ ان اسلوبك ومواضيعك فيها تطور جميل وتسلسل لصحفى كبير وربنا معاك ياعجم وابقى افتكرنا ياعم"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002257/http://masr.20at.com:80/newArticle.php?sid=13630"

[[comments]]
order = 4
subject = "موضوع جميل"
author = "طارق ديلواني"
posted = "2008-01-01"
text = "موضوع جميل يا محمد لكن لم تقل رايك في موضوعات مراسلي الخارج يعني موضوعاتي مثلا!!!<br />عموما المعاناة الحقيقية لمحرري الديسك في الصحف اليومية ..و مع ذلك وارجو ان تحترم رايي فانا ارى ان تحرير المواد بشكلها النهائي في عشرينات في كثير منها ضعيف وبحاجة الى اعادة تحرير"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002257/http://masr.20at.com:80/newArticle.php?sid=13630"

