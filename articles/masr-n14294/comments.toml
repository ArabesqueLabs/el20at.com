[[comments]]
order = 7
subject = "الحضري ( كلاكيت ) آخر مرة"
author = "محمد سنجر"
posted = "2008-04-20"
text = "وضعت حقيبة ملابسي جانبا ،<br />نظرت إليه من خلال نافذة الكشك الخشبي ،<br />وجدته يجلس مرتديا جلبابه الذي ظهر عليه آثار الزمن ،<br />رمقني بنظرة تساؤل من خلال النافذة ،<br />بادرته قائلا :<br />ـ حاجة ساقعة .<br />تحركت أنامله بحركة آلية تجاه صندوق حديدي بجواره ،<br />أخرج منه زجاجة مياه غازية ،<br />فتحها و فتح معها تساؤلات كثيرة داخلي ،<br />نظرت إليه نظرة متفحصة ،<br />بادرته متسائلا :<br />ـ معقول ؟ مش إنت برضه الكابتن ( رفعت الفناجيلي ) ؟<br />( نظر إلي نظرة انكسار ،<br />قفزت من عينيه علامات استفهام تملأ الكون من حولي ،<br />ابتسم مستنكرا )<br />ـ أمازال هناك من يتذكر ؟<br />ـ و مين ما يعرفش المهندس ؟<br />( قفزت على رأسه أقبلها )<br />ـ مين ينسى أوليمبياد روما و طوكيو و كاس فلسطين ؟<br />مين ينسى فوزكم بكاس أمم افريقيا ؟<br />مين ينسى رجاله الزمن الجميل ؟<br />رفعت الفناجيلي و صالح سليم و طارق سليم و الشربيني و الشيخ طه<br />و عبده نصحي و شحته ؟<br />مين ينسى منتخبنا العسكري اللي فاز على ايطاليا 2/ صفر في روما ؟<br />( انهمرت دموعي تغرق الكون من حولي )<br />ـ معقول ؟<br />هي دي مكانتك يا كابتن ؟<br />بتبيع سجاير و بيبس ؟<br />معقولة يا أبو الكباتن ؟<br />( سمعت غليان صدره يتأجج ،<br />تنهد تنهيدة عمر بأكمله ،<br />ناولته النقود )<br />ـ روح يا بني ما تقلبش عليا المواجع الله لا يسيأك .<br />ـ معلش يا أبو الكباتن سامحني بس ده من حبي لك و الله ،<br />طيب ممكن تنصحني يا عم رفعت ؟<br />ـ بص يا بني ،<br />أولا ـ اوعى تكيل بمكيالين ،<br />ثانيا ـ لازم تحترف يا بني ، طول ما انته بتلعب محلي لا ها تروح و لا ها تيجي ، خلي عينك دايما على الاحتراف .<br />( أخذت منه بقية النقود و رحلت آسفا على ما صار إليه رمز من رموز الرياضة المصرية و العربية و الإفريقية )<br />اختارني الخواجة ( كرول ) لحراسة مرمى المنتخب الأوليمبي ،<br />و بدأت مشواري مع التألق ،<br />انتقلت إلى النادي الكبير ،<br />كلما ارتقيت سلما ، كلما أسدلت الرهبة على قلبي قتامه ،<br />فزت مع النادي بثمان بطولات للدوري ،<br />و بأربع بطولات كأس مصر ،<br />و بأربع بطولات كأس السوبر المصري ،<br />و بثلاث بطولات كأس إفريقيا أبطال الدوري ،<br />و ببطولتين للنخبة العربية ، و واحدة لبطل الدوري ،<br />و بثلاث كأس السوبر الإفريقي ،<br />و برونزية كأس العالم للأندية باليابان ،<br />و مع المنتخب المصري فزت بثلاث بطولات كأس أمم إفريقيا ،<br />و لكن ،<br />بين الحين و الآخر تتراءى أمامي صورة الكابتن ( فناجيلي ) و هو يجلس في كشكه الخشبي ،<br />خاصة بعد سحب شارة ( الكابتن ) مني بسبب خروجي خطأ على إحدى الكرات ،<br />إذا كان اللي بيتكلم عاقل يبقى اللي بيستمع مجنون ،<br />و بدأت أشعر و أمر بكل ما مر به الرجل ،<br />و بدأ أعرف ما هو موضوع ( الكيل بمكيالين ) ،<br />كثيرا ما حدثتني نفسي ،<br />هل سيكون مصيري داخل كشك خشبي ؟<br />حلمت طوال حياتي بالاحتراف في أحد الأندية الأوربية ،<br />و جاءتني الفرصة بعد فوزنا بكأس الأمم الإفريقية بالقاهرة ،<br />و لكن نظرا لتمسك إدارة النادي الشديد بي لحين انتهاء الموسم ،<br />و نظرا للوعود التي وعدوني إياها بتوفير فرصة للاحتراف بعد نهاية الموسم )<br />ـ لقد وفرنا الاحتراف لابن الكابتن فلان و نحن من جعلنا ابن الكابتن علان يحترف ، و في أي لحظة ممكن نخليك تحترف ببساطة ، الاحتراف عند أطراف أصابعنا .<br />( نعم لم نسجل هذه الوعود بالأوراق ،<br />و لكنني أثق في وعود إدارة النادي أكثر من ثقتي بنفسي ،<br />فهي عندي مسجلة بماء الذهب ،<br />و لكن مع الأسف الشديد تهاوت هذه الوعود بمجرد انتهاء الموسم ،<br />جرح عميق شق قلبي تجاه من حنثوا بوعودهم ،<br />عندها لاحت أمام عيني صورة الكابتن ( الفناجيلي ) ،<br />وجدت صوته يتردد بسمعي ( إياك و الكيل بمكيالين )<br />طلبوا مني البقاء مقابل أي مبلغ أطلبه ،<br />ما العمل الآن ؟<br />فالعروض التي كانت متاحة وقت الوعود هوت بصحبة وعودهم ،<br />نعم ، لم تعد متاحة الآن ،<br />و من سيقوم بشراء لاعب لا يستفيد منه بعد انتهاء موسم الانتقالات هناك ، خاصة و أنني بلغت الثالثة و الثلاثين من العمر ،<br />أضررت مرغما للموافقة على التجديد ،<br />و لكن جرح قلبي العميق لن يندمل ما حييت ،<br />تهادت إلي الفرصة ثانية عندما اشتركنا بكأس أمم إفريقيا بغانا ،<br />كنت عازما على القبول بأي فرصة للاحتراف و ليكن ما يكون ،<br />كنت مصرا على تحقيق حلمي الذي حولوه إلى سراب ،<br />ها هي الفرصة تتراقص بعيني الآن ،<br />تذكرت عندما كنت طفلا ،<br />فاتني القطار مرة ،<br />لكنني كنت مصرا على ألا يفوتني ثانية ،<br />يومها كدت أفقد حياتي ، وقعت بجوار عجلاته ،<br />و لكن حاولت و حاولت حتى لحقت بآخر القطار ( السبنسة )<br />و ما هي إلا لحظات حتى كنت أجلس بأول كرسي بالدرجة الأولى ،<br />و جلست عليه أحلم بأن أكون سائق القطار ،<br />إما أن أكون أو لا أكون ،<br />جاءني عرض لا يليق باسمي و لا باسم النادي الكبير ؟<br />نعم ،<br />و لكن لن يفوتني القطار ثانية حتى و لو كانت في ( السبنسة )<br />فما هي إلا خطوة لتحقيق حلمي الذي ظل يداعبني طوال حياتي ،<br />و كلي ثقة في الله بأنه لن يخيب تعبي و عملي و اجتهادي ،<br />نعم ،<br />فلكل مجتهد نصيب ،<br />و إنني بإذن الله قادر على تحقيق ما هو أفضل ،<br />نعم ، فأنا لا أقل طموحا عن ( دروجبا ) و ( إيتو ) و كل هؤلاء المحترفين ،<br />و لا أنا أقل من ( زوف ) الذي قاد إيطاليا للفوز بكأس العالم و قد بلغ اثنتان و أربعين سنة ،<br />نعم ،<br />رحم الله امرئ عرف قدر نفسه ."
archived = "2010-03-14"
