[[comments]]
order = 0
subject = "برافو حضرى"
author = "د. محمد سعد"
text = "كل التميزيين و المتفوقين فى جميع المجالات يهربون خارج عزبة مصر و برافو حضرى أهلاوى"
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226064956/http://masr.20at.com:80/newArticle.php?sid=14294"

[[comments]]
order = 1
subject = "يهرب بكرامتة"
author = "--"
text = "يهرب بكرامتة احسن من تكية الحرامية<br />بدل ما يهرب فى مركب وتغرق على شواطىء اليونان<br />مع السلامة"
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226064956/http://masr.20at.com:80/newArticle.php?sid=14294"

[[comments]]
order = 2
subject = "بالتوفيق يا حضري"
author = "كابتن"
text = "ناس بتلعب بملايين وناس يقفوا لها القناة<br />قناة البركة قفلوها بحجة الامن القومي<br />وسلم لي على الامن القومي<br />وبكرة هايقفولا كل قناة ترفع شعار الاسلام"
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226064956/http://masr.20at.com:80/newArticle.php?sid=14294"

[[comments]]
order = 3
subject = "هو لو لأقي مقابل فى بلده كان هيسبها ؟؟؟؟!!!!!"
author = "مصطفى سعد المحامى"
text = "يلله ربنا معاه هو من الشباب المتميز زي كثير من الشباب المصرى بس ياخسارة مش لاقي مقابل زى اللى بره خصوصاً فى سويسرا بلد المال والاعمال 0<br />ويرب يسبوه فى حاله 0000000000 يمكن ربنا يفتح عليه من الخير 0000 هو يستاهل والله ....<br />عقبال ما الريس يعمل زى كستروا 0000000....."
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226064956/http://masr.20at.com:80/newArticle.php?sid=14294"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
text = "ولا برافو ولا نيله اللى عملو الحضرى ده يدل على انه شخص مندفع واحمق وبكده هيمسح كل تاريخه بى استيكه<br />الاهلى عمروه ما هيقف للعاب بس اللى عملوه الحضرى ميصحش"
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226064956/http://masr.20at.com:80/newArticle.php?sid=14294"

[[comments]]
order = 5
subject = "ُيا يت مناكولش و ننكر ده راجل ليه فضل علينا كلنا"
author = "ك ف ف"
text = "أنا شيفه انه من حقه يشوف مصلحته مين يعني فينا متلا لو وجد فرصة احسن في الشغل مش هيمشي وراها!! الأهلي هو اللي عمل الحضري... ماشي مش هاقول لا بس نرجع تاني مع بعض لمثل الشغل.. هنلاقي ان محدش هيتعرض عليه شغل افضل الا بناء علي خبره اصلا.. و انه يشوف مصلحته بصراحه دي مش خيانه.. انا معاكم ان الوسيله كانت غلط لكن<br />الله اعلم بظروف الناس, و بعدين انا قصدي بانها غلط انه بس ظلم نفسه و اعطي فرصة للناس انها تظلمه. لسه يا حضرى فيه ناس فكرالك الكويس و مش كرهاك, و ده رأيي الشخصي"
archived = "2008-04-01"
capture_url = "https://web.archive.org/web/20080401064512/http://masr.20at.com:80/newArticle.php?sid=14294"
