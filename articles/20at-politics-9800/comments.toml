subject = "لا حياة من دون كهرباء"
author = "يااااااااااااااااااسمين"
posted = "2008-08-14"
text = "هااااااااااااي...........كيفكن.......على فكرة كتير الموضوع حلو وشي من الاخر يعني نار وطبعا ميرسي كتير لالك يحيى على هيدا الموضوع الاجتماعي والواقعي بصراحة الله يعينكن في لبنان والله الحياة من دون كهربا ما بتنطاق يعني الله يعين الكل وخاصة طلاب التوجيهي ولاني منهن كتير عم ادعيلكن ترجعلكن الكهربا باسرع وقت ممكن حتى تقدرو تمارسو حياتكن بالشكل الطبيعي وعلى كل حال ما فيني قلكن الا (ان الله مع الصابرين ) وهلا باي والقلب داعيلكن (باااااااااااااااااي)"
