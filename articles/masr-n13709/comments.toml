subject = "ضع عنوان التعليق"
author = "العجيب"
posted = "2008-01-14"
text = "والله انا مش عارف انا فرحان ولة بيضحك على ولة احنا نظمنا اية انا مش مصدق ان ممكن ضابط يدخل السجن ابدا ولكن طرق اتعذيب الى بيعزبوبيها السجين من اشرس الطرق ظابط يخلى سجين يلبس ملابس نسائية ويمشى فى الشارع زية زى اى وحدة معلش فى اللفظ شرموطة و الله دة رام وانتهاك اولن لحقوقة كانسان انا مش هقول غير (حسبنا الله ونعم الوكيل فيهم) وشكرا"
