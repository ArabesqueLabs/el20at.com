text = "المفروض الشرطة العسكرية والنيابة العسكرية والمحاكم العسكرية تتولى امور عسكريين وزارة الداخلية بجانب وزارة الدفاع لازم كلاب وزارة الداخلية يعرفوا ان فيه جهة رقيبة عليكم فيه جهة بتراقبهم فيه مباحث عسكرية بتبص عليهم"
