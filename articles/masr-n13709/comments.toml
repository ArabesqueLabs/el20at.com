order = 2
subject = "شرطة الامس"
posted = "2008-01-07"
text = "عيد الشرطة المصرية<br />Submitted by تعذيب on Wed, 2007/01/17 - 17:05.<br />Start: 2007/01/25 - 00:00<br />Timezone: Etc/GMT+2<br />تحتفل الشرطة المصرية ممثلة فى وزارة الداخلية فى يوم 25 يناير من كل عام ،ة حيث يوافق ذكرى مقاومة البوليس المصرى الدبابات والمدافع الإنجليزية أثناء محاولتها اقتحام مديرية الأمن بالإسماعيلية عام 1952، وأدى صمود قوات الشرطة إلى مزيد من ضرب النيران الإنجليزية نحو الموقع ولم تستسلم الشرطة المصرية أبداً حتى سقوط الموقع بدماء الشهداء."
archived = "2008-01-07"
capture_url = "https://web.archive.org/web/20080107231124/http://masr.20at.com:80/newArticle.php?sid=13709"

