subject = "الى وائل عباس وعموم المدونين وعشرينات"
posted = "2008-01-07"
text = "يا جماعة عايزين نعرف الضباط دول بيدخلوا السجن حقيقة ولا لأ وعايزين نشوف صورهم وهما جوا السجن وهو دا شغل الصحافة المضبوط انكم تجبولنا صورهم جوا السجن<br />عايزين نبرد النار اللي جوانا بصورهم وهما في السجن"
