[[comments]]
order = 11
subject = "بارك الله هذه الجهود"
author = "محمد العمري"
posted = "2008-10-09"
text = "بسم الله و الحمد لله ثم الحمدلله ان اتم علينا اننا مسلمون,,,<br />و قل اعملو فسيرا الله عملكم و رسلوه والمؤمنين,,اللهم لا تجعلنا ممن يخجلون باعمالهم و اقوالهم و علانيتهم و سرائرهم اذا اطلعت عليها ,,,<br />لا اريد ان اعلق على المكتوب و لكنني سأنتقل من الحديث عن الحدث الى الحديث عن المتحدث عنهن,,<br />و ان كنت لا اعرفهن الاكغيض من فيض<br />فهن اكبر من ان يذكرن بأسطر ..<br />و اجل و ارفع من يذكتب عنهن من كان متواضعا مثلي باللغة و اكتفي بان ادعو الله ان يثبتهن على طريق الخير و الرشاد و ان يقبل منهن اعمالهن و ان لا يردهن خائبات يوم الموقف العظيم و ان يزحزن عن النار و يدخلن الجنة مع الفائزين...<br />اعلمو انني اقلكم علما و اقلكم ورعا و لكنني سمعت وانقل لكم فاقرأوا عني عل الله يطلع على حسنة عندي فيغفر لي بها و يختم لي بالصالحات و الله من وراء القصد...<br />اخواتي من فرقة الحور العين جعلكن الله من سيدات نساء الجنه و اصلح اعمالكن و ختم لكن بخير يرضى به عنا و عنكن اللهم امين<br />الاخ اللذي اراد ان يظهر بعبارة عابر سبيل .. ما اظن انك قد علمت اي كلام قلت وانك عليه محاسب عند اله يعلم خائنة الاعين و ما تخفي الصدور اسأل الله ان يغفر لك و يردك الى دينه ردا جميلا....<br />و اني استغفر الله لي و لك و اتمنى ان اراك يوم الحشر العظيم و قد غفر الله لي ولك,,,<br />اخي ان سيدنا علي افضل السلام و ابرك الصلوات قال ... ان اول فتنة بين اسرائيل النساء...<br />فان اكرمنا الله بان جعل بناتنا صالحات مؤمنات .. يكون قد ضمن لنا الجنة فاعاننا على ان نصلح باقي امرنا<br />و اظن ان وصفك فتيات مؤمنات حافظات لكتاب الله بهذه العباره .. ليس من الادب مع الله و مع من يحمل في جوفه كلام الله<br />فهن يأتين يوم القيامه و يقال لهن اقرأن و ارتقيين اما انت فمسؤول عما قلت عنهن بما لم تحط به خبرا..<br />فيؤؤخذ من اوزارهن ان كان لهن اوزارا فتطرح عليك في يوم يفر به المرأمن امه و ابيه و صاحبته و اخيه... و يكون لكل منا شأن يغنيه..<br />اسأل الله ان يتوب عليك و علينا و ان يدخلنا بعباده الصالحين...<br />اما هذه الكوكبة الرائعه فاني اسأل الله ان يقل لهن يوم القيامة اني دافعت عنهن و ما عرفتهن فيشفعن لي يوم يكون المرأمنا احوج ما يكون لحسنة واحده فلا يجد من يغنيه<br />و استغفر الله اللذي منه السلام و هو السلام و على نبيه الصلاة و السلام"
archived = "2010-03-14"
capture_url = ""

