posted = "2008-04-02"
text = "لااااااااااااااااااااا شكلك بتمزحي بدك إياهم يحجزولك كرسي بالجنة ( ليش قاعدين بمدرسة ولا بجامعة ولا بكلية إحنا .. !!! )<br />وبعدين شو حوريات الجنية هاي .. ( ليش بالمره ماتسميهم حوريات البحر .. !!! )<br />وبعدين مين هاي زينب أبو عون .. ( أنا عارف إنها وحده من اللي أبدوا آرائهم بالموضوع اللي هيه مديرة الفريق( عفواً رئسية المافيا الدولية للنساء ) .. ويعدين اللي كاتبه اسمو على ما أعتقد يعني ( تامر الصمادي ) إتأكدي فوق أول إشي مكتوب ( تامر الصمادي – عمان – عشرينات - 1/4/2008 ) .. !!!<br />وبعدين ليش مش حاطة موضوع لتعليقك ( ولا حضرتك وزيرة، وإحنا مش عارفين، ولا إنتي على راسك ريشة وبتنعرفي على طول يعني .. ولا شو بالضبط .. !!! )<br />والله دنيا غريب وناسها عجيبة ...........................................................................<br />شكراً وتحيتي للجميع ،،،"
