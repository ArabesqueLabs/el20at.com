[[comments]]
order = 2
subject = "نداء و استغاثة للسيد رئيس الخمهورية و رئيس الحزب ا"
author = "ممدوح زكى زخارى جرجس-الاسكندري"
posted = "2008-08-11"
text = "الى السادة الافاضل<br />1-السيد رئيس الجمهورية و رئيس الحزب الوطنى الديمقراطى<br />2-السيد امين الحزب الوطنى الديمقراطى<br />3-السيد امين لجنة السياسات بالحزب الوطنى الديمقراطى<br />تحية و احتراما و بعد<br />نستغيث بكم من تجاوزات السيد رئيس لجنة العضوية بالحزب الوطنى الديمقراطى و حرسة الموئيد و الخاضع لى<br />يتصرفون فى امور الحزب الوطنى الديمقراطى و كانهم اسياد الوطن و ملاك الحزب<br />تدخلكم السريع كفيل بوضع الامور فى نصابها<br />و فقكم و حماكم اللة لمصر و شعبها<br />اللة معكم و الى الامام"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123310/http://masr.20at.com:80/newArticle.php?sid=17088"
