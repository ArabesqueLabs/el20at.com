subject = "مشكلة مصر"
author = "هباب"
posted = "2008-08-04"
text = "مشكلة مصر مش حسنى ولا الواد ابنة<br />مشكلة مصر فى كلاب الامن<br />كل كلب فى الامن فكرة انة بيحمى البلد - وهو بيحمى الحرامية والناس اللى بتدمر البلد<br />لكن اخرتهم قربت"
archived = "2008-08-13"
capture_url = "https://web.archive.org/web/20080813123310/http://masr.20at.com:80/newArticle.php?sid=17088"

