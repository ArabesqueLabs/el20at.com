subject = "الأخوان وحرب 1948"
author = "احمد"
posted = "2008-05-16"
text = "الأخوان لم تكن تنقصهم الحماسة وقد قال الخبير العسكري جمال حماد والذي شارك في حرب 1948 انهم كانوا مقاتلين شرسين ولكن ينقصهم التدريب ففي احد المعارك لبسوا اكفانهم وهجموا على موقع اسرائيلي وكانت النتيجة انهم ابيدوا عن اخرهم! القول بأن الأخوان كانوا ليحرروا فلسطين ويهزموا عشرات الألاف من الجنود الأسرائيليين منهم 125 جنرال من روسيا واوروبا واميريكا وعشرات الطيارين ذووا الخبرة من الحرب العالمية الثانية هو قول غبي. المعركة كانت بين العالم الثالث والعالم المتقدم والنتيحة كانت طبيعية."
archived = "2010-03-14"
