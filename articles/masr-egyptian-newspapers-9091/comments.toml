subject = "اين المهنية في مقالك"
author = "عمك محمد"
posted = "2008-05-18"
text = "أيها المنمنم !!!!!!!!!!!!!!!! ؟؟؟؟؟؟؟؟؟؟؟؟<br />على مايبدو أنك لم تدرس اعلام ولم تقرأ لكتاب ؟<br />وتظن أن سبك في الأخوان يرفع قدرك !!!<br />فكل وضيع أراد الرفعة يحاول رمي العملاق ظناً منه أن ذلك يرفعه ؟؟؟<br />فأنظر لنفسك واعرف قدرك وانتبه إليّ جيدا ...<br />عنوان كلمتك السطحية لا يتطابق مع ماجاء فيها هذه واحدة<br />اصدرت احكاما على شرفاء مجاهدين كانوا في ساحة الوغى شهداء وانت لا زلت في ظهر ابيك وليس لديك بينة أو دليل وهذه الثانية<br />وأنت تطلب من يدرس الموضوع ولم تدرسه فلماذا حكمت قبل الدراسة وهذه ثالثة<br />الأخوان تاريخهم مسطر بدماء وتضحيات وكتبهم تباع في كل حدب وصوب لكل من له عينين ورأس يريد أن يعلاف الحقوهذه رابعة<br />فماذا قدمت أنت يا صاحب التيشرت والسلسلة ويكفيك هذا حتى تتعلم لتكون كاتبا بحق .<br />خذها من عمك محمد لتستفيد شيئا في حياتك الله يرحم زمان ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
