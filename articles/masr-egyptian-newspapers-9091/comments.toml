[[comments]]
order = 0
subject = "لم تكن هناك اسلحة فاسدة ولكن كان هناك ضعف فى التدر"
author = "عربى من الشام"
posted = "2008-05-15"
text = "درست معارك حرب 48 واسباب الهزيمة فيها وقرأت كل كلمة كتبت فيها فى الجانب العربى او الجانب الاسرائيلى<br />وتستطيع ان تخرج بالنتائج الاتية<br />ان الجيوش العربية كانت جيوش لعمل الاستعراضات والوقوف بين يدى الملوك فى الساحات ولم تكن جيوش قتال بالمعنى الحرفى<br />ان الجيوش العربية كانت تحارب بطريقة الخنادق الثابتة وهى تكتيكات الحرب العالمية الاولى بينما القوات الاسرائيلية تحارب بالحرب المتحركة والقوات المناورة والالتفاف حول تلك القوات وتدميرها ومن الغريب ان تلك العقيدة التكتيكية استمرت فى حرب 56 وحرب 67 وحرب 73 وادت الى نتائج كارثية<br />فالقائد العسكرى العربى عندما يحتل منطقة فاول شىء يصنعة هو حفر الخنادق ودخول قواتة الى تلك الخنادق بينما تأتى القوات الاسرائيلية لمحاصرتها كما طلب من القوة المصرية فى الفلوجة<br />ومثلما تخندقت القوات المصرية بعد العبور واتى شارون واخترق الجيشين الاول والثانى وحاصر الجيش الثالث فى مأساة لم تحدث فى اى حرب سابقة<br />ان الجيش الاردنى كان عبارة عن جيش من البدو لا علم لة بالتكتيك ولا بالحرب الحديثة وانما مجموعة من البدو الذى يصلح للاغارة ونهب المدن وعلى شاكلة يا خيل اللة اركبى<br />ان اليهود اعتمدوا على الحرب المتحركة وبدون خنادق واعتمدوا على قوة النيران وتركز تكتيكاتهم على المبدأ الثالث الذى طبقوة فى جميع حروبهم مع العرب وه<br />الحصار والاختراق من الاجناب والتطويق والحصار ثم طلب الاستسلام<br />ونجح هذا التكتيك فى جميع حروبهم<br />صحيح ان عدد القوات اليهودية كان ثلاث اضعاف القوات العربية فى 48<br />ان جهل الجنود والضباط بالسلاح مثلا ان بعض المدافع من الطراز القديم كانت بعد اطلاق عدد معين من الطلقات تحتاج الى تبريد وتركها فترة بدون استخدام لتبرد ثم حشوها بالدانات بعد ذلك بعد ان تبرد ونتجة الجهل لم يكن يتم تركها لتبرد واما هجوم الاسرائيليون المتواصل كان يتم حشو المدافع الملتهبة بالدنات لتنفجر الدانة داخل المدفع الساخن جدا الى درجة الاحمرار - ثم يقال ان الاسلحة كانت فاسدة<br />لم تحقق القوات النظامية اى نجاح على الارض<br />ولكن لو تركت الحرب للاخوان المسلمين وحروب العصابات لما قامت اسرائيل<br />نعم الاخوان قاتلوا برجولة وسببوا خسائر لاسرائيل وضحايا ومن يومها لا يحب اليهود الاخوان ابدا"
archived = "2010-03-14"
