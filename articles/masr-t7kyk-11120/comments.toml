text = "يا اخي العزيز الدنيا امتحان واختبار<br />وعلم الله سبحانه وتعالى كل شيء ازلا وعلم اهل الجنة واهل النار قبل ان يخلق الخلق فرزق اهل الجنة اعمال اهل الجنة ورزق اهل النار اعمال اهل النار<br />فالدنيا ظالم ومظلوم اهل الجنة واهل النار<br />لما تشوف ناس ظلمه احمد ربنا سبحانه وتعالى انك مش في معسكر الظالمين ولما تشوف نفسك مظلوم احمد ربنا سبحانه وتعالى انك في هذا المعسكر معسكر المظلومين<br />تذكر دائما<br />علم الله سبحانه وتعالى كل شيء ازلا وعلم اهل الجنة واهل النار قبل ان يخلق الخلق<br />فرزق اهل الجنة اعمال اهل الجنة ورزق اهل النار اعمال اهل النار<br />سلام يا صاحبي"
