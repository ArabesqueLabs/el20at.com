subject = "العمدة رمز مرحلة سوداء من تاريخ مصر الاسود"
posted = "2009-01-30"
text = "مش العمدة دة اللى كان بيجمع الفلاحين ويكتفهم بالحبال ويشدهم على المركز لتسخيرهم فى حفر قناة السويس والعمل فى السخرة اى ببلاش وبدون اجر فى ارض الباشوات ويسيب اهلة بس يرتاحوا<br />مش العمدة دة هو كرباج الحكومة ضد الفلاحين الغلابة<br />مش العمدة دة زى ما جسد فيلم الزوجة التانية بعض من شخصيتة هو اللى بيطلق الفلاحات من زوجها علشان ينط عليها هو<br />مش العمدة دة رمز المماليك البغيضة<br />مش هو اللى كان بيلم الجمال والحمير والفلاحين ليسخرهم فى حملة الانجليز على الشام فى الحرب العالمية الاولى وكل المصريين ماتوا فى تلج الشام وحر سيناء<br />ملعون ابو اى عمدة ابن وسخة<br />اللى وقف الناس دى عند حدها هو جمال عبد الناصر وربنا ضرب الظالمين بظالم زيهم"
archived = "2010-03-14"
capture_url = ""

