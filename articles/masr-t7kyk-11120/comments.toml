[[comments]]
order = 4
subject = "مصر"
author = "د. البدراوى"
posted = "2009-03-23"
text = "لقد كان هذا الموضوع مفاجئا لى شخصيا لأننى من البلدة التى ذكرها الموضوع ورغم ان الموضوع شيق الا انه غير مكتمل وأظهر جانب من الجوانب التى يؤديها العمدة فى القرية والشئ المفاجئ لى أن المقال ذكر ان العمدة السابق واسمه محمد أبو النصر وهذا غير سليم لأنه لايوجد فى قرية شبراباص عمدة سابق فالعمدة الحالى والذى أسأل الله له الشفاء العاجل هو الحاج على أبو النصر وهو بالمناسبة عمدة لقرية شبراباص منذ العام 1974 وحتى تاريخه والعمدة السابق له كان الحاج عبد اللطيف أبو النصر وهو عم العمدة الحالى .... وهناك جوانب كثيرة كانت متعلقة بعمدة القرية لأنه نظيم قديم كان يعطى صلاحيات واسعة للعمدة الذى هو بالفعل حاكم مطلق للبلدة التى يحكمها وهذا كان ولا زال صالحا فى بعض القرى التى يوجد بها عائلات كبيرة ولا تريد ان تحتك باى صورة من الصور بأقسام البوليس وغيرها مما قد يقلل من هيبتها وهذا ما زال فى القرى ذات الحجم المتوسط والصغير أما القرية المدينة فهذا أمر صعب التحقيق لعدم قدرة العمدة على السيطرة على قريته ..... وهذا أمر يطول شرحه ... وشكرا على هذه الفرصة"
archived = "2010-03-14"
capture_url = ""

