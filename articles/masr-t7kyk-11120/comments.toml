text = "السلام عليكم طبعاالمشاركه بتاعتى دى ممكن ميكونش فيها جديد لا اللى هاقوله لست وحدى من اقوله فبحق فقدت شبراباص رجل كان يقف له الكبير اى كان منصبه احتراما وتبجيلا لانه فعلا كان يستحق لاكثر من هزا والدليل كان جليا بجنازته وعزاه فكان رحمة الله عليه يحق الحق على الكبير والصغيروكان يقضى بمشاكل تستعصى على عمد البلاد الاخرى فكان لابد ان يلقب بعميد عمد المنوفيه والله كان يستحق عميد عمد الجمهوريه فكان الله يرحمه حامى قريتنا من تدخلات الشرطه وغيرها وعاش حياته للجميع وعوضنا الله بخير خلف لخير واغلى سلف وهو عمى عزت الزى ضحى بمستقبله المرموق بالضرائب ليكمل مسيرة الاباء والاجداد وان احمد الله ان جعلنى ابنا من ابناءهذه العائله الكبيره ..التى انجبت رجالا مثل هؤلاء وارد على الاخ صاحب الاى الغريب عن العمد باقول له يستحيل تكون شوفت او سمعت عن المرحوم بجد رايك كان بيتغير وبادعى لك الله يهديك وباشكر كل من قال كلمة حق ليلقى بها الله واخيرا استحلفكم بالله الفاتحه للمرحوم واستودعكم الله"
