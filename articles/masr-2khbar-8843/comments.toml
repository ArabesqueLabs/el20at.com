text = "الفريق طيار على المعاش حسنى مبارك هيقول مفاجأة فى عيد العمال<br />هيصرف شهر مكافأة للموظفين بمناسبة الغلاء<br />ان شاء اللة محد حوش واية يعنى مليارين هدية لة من احمد عز<br />الفلوس مع عز زى الرز<br />يتبرع لبتوع الوطنى علشان يحفظوا الكراسى بتاعتهم<br />ويمنعوا اضراب4 مايو"
