[[comments]]
order = 1
subject = "طيب يا شوية حمير بدلا من كده تبقى الجلسة سرية"
author = "هنا"
posted = "2008-11-27"
text = "طالما خايفين حد يسمع الكلام المتداول في القضية<br />يبقى يعملوا الجلسة سرية ايه المشكلة<br />وكان المفروض الصحافيين لما لقوا هذا التصريح لا يذهبون الى المحكمة اصلا<br />بلد خايفه حكاما ومحكومين وناس تافهةت وعلى رأي مدحت قلاده بتاع الاقباط مرة قالي انتم امة ضحكت من جهلها الامم<br />مسلمين على حدودهم اسرائيل من اكثر من خمسين سنه ولسه بياكلوا في بعض وبيحيلوا بعض الى المحاكم وامن مركزي بيضرب في بعضه وحاجه اخر خيبة<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""
