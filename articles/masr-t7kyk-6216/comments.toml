subject = "النكسة تانى وتالت ورابع"
author = "السيد سليمان"
posted = "2007-06-10"
text = "كلام سخيف وتحليل اسخف نسمعة<br />الحرب يا سادة زى مبارة الملاكمة ممكن تنهزم جولة ولكن تعوض فى الجولة التالية<br />انهزمنا فى 67 لان القيادة عايزة كدة عبد الحكيم اعطى امر بالانسحاب غلط لان الطيران انضرب على الارض<br />نصر اللة حارب اسرائيل لمدة شهر بدون اى غطاء جوى فى لبنان<br />انما المشير اللة يكحتة قال لهم انسحبوا بدون ترتيب الانسحاب<br />كان عساكر الجيش كلهم فلاحين لا يعرفوا القراءة ولا الكتابة<br />تغير الوضع بعد مدارس ناصر المجانية وبعد تجنيد المؤهلات وحملة الشهادات<br />اسرائيل الان اضعف من ان تهاجم لبنان لان الشباب العربى تعلم وكان الاول الامية منتشرة ويعرف يتصرف فى الميدان<br />السلاح اللى عندها مش هينفع<br />الشعوب العربية على استعداد لعمل عشرين منظمة زى حزب اللة اذا هوجمت<br />الوضع الان غير والناس غير والشباب العربى غير<br />انسوا تلك الجولة الفاشلة<br />ولا تذكروا تلك النكسة الخايبة فايام النصر قادمة<br />والشباب العربى فى العراق مخلى امريكا بتشد فى شعرها<br />الامل بكرة والنصر قادم على ايدى الشباب<br />والمجد لمصر"
archived = "2010-03-14"
