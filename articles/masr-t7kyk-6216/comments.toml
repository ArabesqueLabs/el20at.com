order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-06-10"
text = "انا عايزاقول بس ان حزب الله في بداية حربه مع اسرائيل قال انه هيحاربحرب عصابات و نجحفي اخراج القوات العسكرية المنظة لإسرائيل ،،، لكنلوبصيناعلى الوضع دلوئتي هتلاقي ان اسرائيل بتضرب في لبنان بطريقة العصابات ،،، لبنان متبهدلة يا سادة كل شوية تفجيرات غيرمعلومة المصدر لكن طبعا المصدر غير خاف على ذوي الأبصار<br />كمان بالنسبة لشعب العراق في رأيي ان احسن من يحكمهم كان صدام حسين و طريقته بالرغم من وجود بعض التصرفات الإستبدادية الا انها الطرقة المثلى و ذلك لإختلاف الملل و الطوائف و الديانات في العراق ،،، ولا نسيتو الخيانة اللي حصلت<br />بعد ما كانت كل التوقعات للسياسيين بتقول ان امريكا مش هتعرف تدخل العراق الا بعد سنه على الأقل نلاقيهم تاني يوم في بغداد ؟؟؟؟!!!<br />بالنسبة للموضوع المنشور للأستاذة مروة اتمنى ان يكون العمل الفني على قدر عالي من المستوى فالأعمال التاريخية شئ غاية في الأهمية لما فيه من تعاليم و مبادئ لشباب الأمة"
archived = "2010-03-14"
