subject = "وهل نهتم بحقوق الانسان لنهتم بحقوق الحيوان"
author = "مش لاعب"
posted = "2008-10-29"
text = "اللى استحوا ماتوا<br />هل للانسان حقوق فى البلد دى بامارة اية<br />لما يبقى فية حقوق انسان يبقى فية حقوق حيوان<br />بلاش نكت بايخة"
