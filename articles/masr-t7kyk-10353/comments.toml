text = "اولا: احييكىيا أستاذة امينة وربنا معاكى<br />ثانيا : الناس ال شغالة تريأة انا مش فاهمة اية الخيبة دية االانسان ممكن يتكلم ويشتكى ويصرخ وفية حاجات كتير بتوصل شكوة الانسان اذا مكنش فية رد او اجابة دية مشكلة المسئولين .<br />لكن الحيوان ميقدرش يتكلم ولا يعبر عن اى شىء فربنا بعت ناس تدافع عنهم نشكرهم والا نتريأ عليهم هو الحيوان دة مش مخلوق ربنا هيحاسبنا عليهم لما نعذبهم .<br />ملحوظة : محدش طلب منكم تجوعوا وتأكلوا الحيوانات بس على الاقل سبوهم فى حالهم"
