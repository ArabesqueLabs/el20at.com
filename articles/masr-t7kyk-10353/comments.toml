subject = "وانا اول سفير للحمير في مصر"
author = "مش كاتب"
posted = "2008-10-29"
text = "وانا اول سفير للحمير في مصر واللي اعطاني هذا اللقب<br />الجمعية الدولية لحقوق الحمير المناهضة لاكل لحم الحمير<br />لا تأكلوا لحم الحمير ارجوكم<br />لا تمتهنوا كرامة الحمير"
