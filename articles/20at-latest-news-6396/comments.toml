text = "الله والله ونااااسة<br />زي مانسوي مع بعض نكتب على المريول بالطامس هع هع<br />وبعضهم يكتبون بالاقلام الفاقعة الفسفورية<br />ههههههه والله ونااااسة بس بنفس الوقت نزعل ونصيح لاننا بنفترق عن بعض<br />تهئ تهئ تهئ<br />والله فاقدة صحباتي الحين ابيهم وابي اتكلم معهم بس وش نسوي هذي الدنيا"
