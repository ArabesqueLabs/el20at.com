subject = "ذكريات جميلة"
author = "آخر يوم"
posted = "2007-06-22"
text = "ياااااااااااااااااااااه مفيش أحلي من ذكريات الواحد مع أصدقائة<br />الشقاوة و الخفة و سعات المواقف النكد<br />يعني مرة فاكر إتمسكنا بعلبة سيجار في المدرسة قدام المدير ......... جم صحابي كلهم و دافعوا عننا و إتفقوا علي حدوتة واحدة كله يقولها علشان ما أتفصلش من المدرسة<br />و عدي الموقف ........ جينا بقي كل واحد كتب تاريخ ميلاده علي سيجار في العلبة و سيم كده كان بيرمز ليه أيام المدرسة<br />العلبة لسة موجودة لحد إنهاردة مع إني و الحمد لله بطلت أدخن بس كل ما نتقابل في المناسبات السعيدة بيصروا إنهم يجوا عندي و نطلع العلبة و نكتب ورقة بنعبر فيها عن حالنا في اليوم اللي بنطلع فيه العلبة<br />آسف علي الإطالة"
