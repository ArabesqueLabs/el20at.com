[[comments]]
order = 0
subject = "انحدار مستوى الطب فى مصر"
author = "مش لاعب"
posted = "2008-10-18"
text = "مش كل واحد محرات بيحفظ الكتاب من الجلدة للجلدة ويجيب 100 % فى الثانوية العامة ينفع يبقى دكتور<br />النتيجة بتروح لدكتور حفيظ كتب وصمام ومش عارف يشخص المرض صح ويكتب لك عشرين دواء يمكن واحد فيهم يطلع صح<br />مستوى منهار<br />وكتير من الناس بتموت نتيجة التشخيص والعلاج الخاطىء<br />والنتيجة ظهر ما يسمى الدكتور النجم<br />الدكتور الموهوب او الدكتور صاحب الشخصية اللماحة الذكية<br />انما بتوع الحفظ ففى السوق بيفشل وبتبقى سمعتة زى الزفت وعايز يرتزق باى طريقة يروح الترب يروح البيوت يهلب رزقة باى طريقة<br />لو مهندس فشل فى عمل كوبرى او عمارة كل الناس بتتفرج على خيبتة<br />انما الطبيب لو فشل فى علاج انسان ومات فبيقول خلاص يا جماعة عمرة خلص والاعمار بيد اللة هنعمل اية هنحارب ربنا بسيف الرجل عمرة خلص واكرام الميت دفنة<br />كل سنة وانتم طيبين ويا ميت خسارة على الطب فى بر مصر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "القاهره"
author = "دكتوره"
posted = "2008-10-19"
text = "أنا طبيبه بس حديثة التخرح<br />لكن عندي خبره في مجال مراكز التجميل و الجراحات التجميليه<br />المجال ده أكتر حاجه بيعتمد عليها في جذب المريض هو الإعلان<br />و بأحلام ووعود كاذبه و مبالغ فيها<br />بالبلدي كده جر رجل<br />و المجال ده دلوقتي في مصر بقى بيزنس<br />معظم أصحاب المراكز ده مش أطباء أصلا<br />و رغم كده ممكن يكشفوا على عيانين<br />و حتى لو كانوا أطباء فغالبا مش تخصصهم تجميل خالص<br />المهم إنه حد متوفر له رأس المال<br />فده صوره غلط خالص لأستخدام الإعلانات رغم إني في المجال ده بس أنا ضدها<br />بس أنا مرؤوسه و ماليش حق الرفض بس بتكلم مع المرضى بصراحه<br />عشان ده أمانه<br />و ربنا يعدلها بقى الطب في بلدنا على حافة الهاويه بجد"
archived = "2010-03-14"
capture_url = ""

