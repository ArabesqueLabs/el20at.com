subject = "مومس هوم دليفري"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-10-20"
text = "الفلوس هي كل حاجه هي اللي بتجيب المومس لغاية البيت مش كده وبس<br />وحياتكم المومس بتركب الطيارة وتيجي لغاية البيت<br />الفلوس هي اللي بتجيب كل حاجه لغاية البيت حتى الطبيب ولو فيه حاجه اعلى من الطبيب<br />حيجي البيت زي الجذمه"
archived = "2010-03-14"
