subject = "سيدمكاوى فنان لن يتكرر"
author = "سيمون اسمر"
text = "قبل مايموت بفترة قليلة كانوا مستضيفينو تلفزيون المستقبل فى خيمة رمضانية وكان ضيف الشرف ليلتها وكان اول ظهور للفنانة نانسى عجرم كفنانة مبتدئة وكان شكلها وحش وكانت عاملة تقويم لسنانها المهم المرحوم تعب عليهم فى السهرة من كتر الدخان اللى فى الهوا بعد كدة نقلوة لمستشفى الجامعة الامريكية بلبنان وبعديها مطولش رحمة اللة كان فاكهة مصرية محبوبة بتجدد كل رمضان"
