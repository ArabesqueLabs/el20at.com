subject = "فى المتاحف العالمية يراعى فى تصميمها عدم وجود مواد"
author = "ابو لهب مشتعل"
posted = "2008-11-29"
text = "اى مكان فية مواد قابلة للاشتعال واذا حدثت شرارة من اى مصدر كلة بيولع نار<br />عادة بيستخدموا مواد العرض من الرخام والزجاج وبيستبعدوا الاخشاب والبلاستيك والمواد القابلة للاشتعال زى السجاد والموكيت والستاير<br />على فكرة حكاية الماس الكهربى دى بقت موضة بايخة والمفروض يبطلوها بقى"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195143/http://masr.20at.com:80/newArticle.php?sid=18623"
