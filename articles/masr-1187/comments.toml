text = "لا عجب ايها الاخوه كلنا نعلم ماهى انتماءات وزير الثقافه فهو ماسونى وماركسى قديم وهو من اكابر الدعوه الى العلمانيه واخرجت الوزاره فى عهده كتب بها الكفر الصريح وما كتاب وليمه لاعشاب البحر ببعيد وكتب كثيره"
