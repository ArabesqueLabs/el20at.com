text = "مقدم بواسطة Ched فى ثلث, 2006-11-14 13:01. سياسة | تونس<br />وردت علينا رسالة من لجنة الدفاع عن المحجّبات في تونس تشير إلى اعتداء سافر تعرّضت له امرأة عجوز بالطريق العام في تونس العاصمة ننقلها للرأي العام الوطني والدولي لمعرفة حقيقة المعاملات الوحشيّة التي يمارسها البوليس التّونسي ضدّ المرأة المحجّبة في تونس وفيما يلي نصّ الحادثة :<br />تم إيقاف امرأة تجاوز عمرها الستّين من قبل اثنان من أعوان الأمن بمنطقة \"الباساج\" بتونس العاصمة لاستجوابها عن سبب ارتدائها الحجاب و تذكيرها بالتصريحات الأخيرة لرئيس الدّولة . تمّ على إثرذلك أمرها بنزع حجابها فورا فلما رفضت قام أحدهما بنزعه بالقوة عندها صاحت المرأة من هول الفاجعة و لم تتمالك نفسها فدعت عليه قائلة : \"فضحك الله في الآخرة كما فضحتني في الدنيا\". عندها انهالا عليها عوني الأمن ضربا بالعصا حتى سقطت على الأرض على مرأى من المارة.<br />و يجدر الإشارة أن المرأة تعمل كمعينة منزلية و هي من ضعاف الحال و قد قررت الانقطاع عن العمل و لزوم بيتها خوفا من أن تتكررلها الحادثة مرة أخرى .<br />» طباعة"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

