[[comments]]
order = 0
subject = "الإسلام والذئاب"
author = "محمود القاعود"
posted = "2006-11-21"
text = "واهم من يظن أنه لاتوجد مؤامرة كبرى لتدمير الإسلام ؛ أو أن الإسلام آمن فى ظل هذه المؤامرات الشيطانية الشريرة ، فقد اجتمعت قوى البغى فى جميع أنحاء العالم على الكيد للإسلام من أجل القضاء عليه ، وفى سبيل ذلك قاموا – ولا زالوا – بحملات عنيفة تستهدف أصول الإسلام وذلك عن طريق الطعن فى القرآن الكريم والذى أُنزل عليه القرآن الكريم ( صلى الله عليه وسلم ) ، والتشكيك فى صدق الصادق الأمين ( صلى الله عليه وسلم ) والافتراء على السنة النبوية المطهرة وتشويه صورة الصحابة الكرام رضوان الله عليهم أجمعين والتشنيع بأمهات المؤمنين من زوجات المعصوم الأعظم صلى الله عليه وسلم .<br />ولم يترك أعداء الإسلام وسيلة إلا واستعملوها واستخدموها ضد الإسلام ؛ فهذه الفضائيات التنصيرية تسب وتلعن الإسلام ليل نهار ، وكذا المواقع الإليكترونية الموجودة بالشبكة العنكبوتية الإنترنت ، وغرف ما يُسمى ب ( البال توك ) والتى مارسوا فيها أسلوب خريجات قضايا الآداب والدعارة ، لدرجة أن قرءوا القرآن الكريم بألسنتهم النجسة على نغمات العود والطبل والزمر والتصفيق ، فى محاولة منهم لإحياء أسلوب كفار قريش ، فى السخرية والاستهزاء من كلمات الحق سبحانه وتعالى .<br />أيضاً هناك الإذاعات التنصيرية ، وخطابات التنصير التى تصل لشباب الإسلام وتعرض عليهم الإغراءات من أجل ترك الإسلام واعتناق النصرانية مع وعد بالهجرة إلى أوروبا أو أميركا أو كندا ، مع راتب ضخم للعيش فى هناء ، ورخاء ..<br />لقد اجتمع الذئاب على الإسلام من كل مكان ، هؤلاء الذئاب يساعدهم ويُعاونهم فى مخططهم الإجرامى قطيع كبير من الكلاب الشاردة الضالة ( المحسوبين على الإسلام ) .<br />الكلاب تعمل فى السر والعلن من أجل تنفيذ مخطط الذئاب …. وبدا واضحاً لكل ذى عينين أن الكلاب لا يعنيها سوى رضاء أسياده<br />اقرأ بقية التعليق .."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

