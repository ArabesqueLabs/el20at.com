subject = "بصو في الصورة كويس"
author = "متهيالي الصورة دي متركبه"
posted = "2006-11-23"
text = "الصوره فيها اثنين نسوان عواجيز على الشمال وفاروق حسني قاعد على اليمين وبيبصلهم وهو مبسوط اوي.<br />اولا النسوان عواجيز يعني ما ينفعش يتعمل معاهم حاجه<br />ثانيا هو غير متزوج وانا سمعت انه ما لوش في النسوان.<br />اذن الصورة دي متركبه"
