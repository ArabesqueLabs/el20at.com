subject = "حقاً مهزلة وما جديدة فى عصر المهازل"
author = "اميرة عربية"
posted = "2006-11-23"
text = "حقاً مهزلة وما جديدة فى عصر المهازل<br />فليسمح لي أو لا يسمح كل من يتكلم عن الحجاب لسؤال لي أراه ومن وجه نظري انه مهم .............<br />طالب قاسم أمين سابقاً بحرية المرأة وإنها من حقها أن تجلس مع من تشاء وتتحاور ولا يجب أن يكون هناك محارم مفرد (محرم ) ومن حقها أن تخرج وتصاحب من تريد مادامت تحافظ على شرفها ونفسها كما يقول هكذا رأيت الفتاة في الغرب . ولكنه أدرك خطأه حين دق بابه رجل وطلب منه أن يجلس مع زوجة قاسم أمين على انفراد دون تدخل منه أو يدعوها للخروج معه هو وهى فقط في حينها أدرك قاسم أمين الجرم الذي وقع فيه من التعليم والانبهار بالغرب .<br />نحن لا نقول إن التعليم في الغرب خطأ أو جريمة ولكن نقول أن الانبهار هو الخطأ !!!!<br />ثق أيها المثقف المتكلم عن الحجاب الذي أنت لا تدرك قيمته لأنك لم ترى أخلاق من يرتدون الحجاب ولا تعرف معنى الكلمة والهدف منها كن على ثقة انك لو كنت تعرف قدر المرأة وقيمتها ما جعلتها مطلقا عارضة لنفسها في أسواق النخاسة ..........<br />أنت تُدرك جيداً خُبث الفكرة وخبث الداعين إليها سأظن بك الخير وانك لا تعلم ماذا يريدون وأظن بك الخير وأقول انك لم تقراء عن الطريقة المثلى لهدم الدين الاسلامى عن طريق المرأة .<br />واسلك ماذا يضرك ارتداء الحجاب للمرأة ؟؟؟؟؟؟؟؟؟؟؟؟<br />واسالك أين تضع لوحاتك التي تعتز بها ؟؟؟؟؟؟؟؟؟<br />أتلقى لوحاتك في عرض الطريق للمرة يدهسونه بأحذيتهم أم تعرضها في أماكن إلقاء القمامة ؟؟؟؟؟؟؟؟؟<br />لو كنت أدركت قيمة المرأة كما تعرف قيمة لوحاتك الغالية عليك . لعرفت قيمة المرأة الغالية على الدين التي هي صانعة الرجال والأجيال تأكد إن كلامك عن الحجاب لا يتعدى عن كلمات رجل عامي من عامة الشعب لا يعرف اى شئ عن ماتسميه فنون تشكيلية فإن كان الرجل الفقي<br />اقرأ بقية التعليق .."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

