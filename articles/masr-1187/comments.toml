[[comments]]
order = 2
subject = "ايها الفرعون الفاسد"
author = "يوسف محمد عامر"
posted = "2006-11-21"
text = "ياسادة ان الفرعنة ليسو فقط فرعون موسي ولكن هناك فراعنة جعلو من بلدهم ام الخضارات وهذا الفرعون جعل بلدنا الحبيبة تتسابق لكي لا تكون أخر البلدان المتخلفة وجاء بالفنان ليجعلة وزير للثقافة وهو لايدري اين هي الثقافة وتذكرو ياخوة تصريحات هذا الوزير الجاهل بخصوص الحملوة الفرنسية علي مصر وتشبيهها بالحرب الجيش المصري في اليمن وان جاء العيب من اهل العيب ميبقاش عيب وهو بس هو الوزير دة تذكرو يوسف والي الذي تولي سرطنة المصرين وتذكرو ممدوح اسماعيل قاتل المصرين ولكني اتعجب اين الضمائر الحية في الجيش المصري العظيم نريد الخلاص من الخونة و العملاء يايها الابطال ذاد الفساد ووصل الي الدين والعقيد تمنع بناتنا من العمل في التليفزيون بسبب الحجاب اي تخلف هذا وهل كان الاحترام عيب والسلام عليكم"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

[[comments]]
order = 3
subject = "اقاله متأخره"
author = "ايمن امام"
posted = "2006-11-21"
text = "السلام عليكم- تلوح فى الافق بوادر اقاله لهذا الشخص- ولكن هذه الاقاله ان تحققت وانا يراودنى كابوس انا لن تتحقق - لان الغرب سيضغط حمايه لرجله فى الوزاره - وحتى وان تحققت الاقاله فأنها تأخرت خمس وعشرون عاما - هى عمر هذا الرجل فى الوزاره - تقريبا - لانه منذ اليوم الاول للتشكيل الوزارى وهذا لغز غريب ينبغى محاسبه من عاونو الرئيس فى اختيار الشخصيات المرشحه للوزاره -منذ اليوم الاول وحسبما نشر - فان الدكتور عاطف صدقى قد تبرأ من هذا الاختيار - وهذا يعطينا دلاله اخرى على ان منصب رئيس الوزراء شرفى اكثر منه تنفيذى لانه وببساطه شديده لم يختار هذا الرجل ليكون معه فى الوزاره فمن اختاره اذن - بل ان ما نشر يؤكد ان الدكتور عاطف صدقى قد فوجىء باسم هذا الشخص فى التشكيل الوزارى - اى انه لم يكن يعرف التشكيله الوزاريه حتى الاعلان عنها فى الصحف اليوميه- وهذا لغز اخر - بأختصار من يعاون السيد/ رئيس الجمهوريه فى الترشيحات هو المسئول الاول عن هذا العبث - ورغم ذلك فلو ان المؤسسه الرئاسيه كانت صادقه مع نفسها فأن الفرص قد توالت تباعا للتخلص من هذا الرجل - ويكفى موضوع روايه ولبمه لاعشاب البحر ولكن ونكايه فى الشعب فأن هذا الرجل بقى فى موقعه - رغما عن انف الجميع عدا المنتفعين من بقائه - والسؤال الان - كيف تستطيع مؤسسه الرئاسه ان تتحاشى الوقوع فى مثل هذا الخطاء الرهيب الذى لايغتفر- قد يختلف الجميع على الاسلوب الامثل لاداره البلاد وقد يتحمس كل فرد لرأيه فى الطريقه المثلى للاداره ولكن اعتقد ان الجميع لايختلف على وجوب ان يكون صاحب هذا المنصب - شخص لاتحوم حوله الشبهات وخاصه مثل هذه الشبهه - التى لاتشرف النظام قبل ان تشرف الشعب - سيدى الرئيس / الاعتراف بالحق شيمه من شيم الاحرار - ليس عيبا ان تعترفو انكم اخطاتم فى<br />اقرأ بقية التعليق .."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

[[comments]]
order = 4
subject = "موضوع الحجاب"
author = "سحر"
posted = "2006-11-21"
text = "على فكره انا واحده محجبه بس انا عايزه اقولك ان ديه اول مره يحترم فيها وزير الثقافه ( فاروق حسني ) لانه كان طول الوقت خايف على الكرسي موظف حكومه خايف وكنت اتوقع منه الكثير حين تولي مسئولية وزارة اليقافه لكن للاسف كتير خيب ظني اول مره اشعر انه بتكلم عن اللى عايز يقوله من دون خوف ولا حرج ،لم يخطئ الوزير حين عبر عن وجهة نظره وعلينا تقبل الاخر وتقبل الاختلاف في الرأي هولم يقل على النساء خلع الحجاب ولميلقب نفسه مفتي ويصدر الفتاوي وفعلا الحجاب الان اصبح اتجاه وليس ايمان تجد كثير من البنات التي لم تعدي عمرها خمس او ست سنوات ولا البنات فى مدرسة ابتدائية لابسين الحجاب يعرفوا ايه دول عن الحجاب لابسنهم قهر انا محجبه لكن بتحصر فعلا على مصر ايام الستينات ايام ما كانت البنت بتلبس الميني جيب وتلبس اخر موضه من غير حرج وكانت بتركب الاتوبيس وبمتمشي فى الشارع بدون خوف من المجمتع مجتمعنا فعلا بيعيش حاله من التردي والتقهقر اصبح يختزل كل شئ في اشياء تافه وسطحية تحيه لفاروق حسني على جرأته واعتذار عن كل المهاترات والالسنه القذره التي كالكلاب المسعورة اخذت تهنش فيه ونفسي اقول كلمه مضيقاني بدل ما مجلس الشعب يمسك فى كلمه قالها وزير لا تعبر الا عن وجهة نظره الشخصيه وحملوها ما ليس فيها ليه لاحس ولا خبر عن بيع مصر حته حته من صفقات مشبوهه فى بيع عمر افندي والدخليه للحديد وغيرها وغيرها ايه القرف ده بطلوا بقىىىىىىىىىىىىىىى"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

[[comments]]
order = 5
subject = "مصر العزيزة لي وطن"
author = "رموززززززززززززززززززززز"
posted = "2006-11-21"
text = "السلام عليكم الاخت الفاضله اللي كاتبه تعليق فوقي انت قولتي رايك ممكن تحترمي رايي يا سحر انا بقول ان مصر وفيه انا فاسدة اخلاقيا اخلاقيا فاهمه سواء قال الوزير او هاج الاخوان او رقصت كفايه او طبل الا حرار او الدستور وصوت الامه في النهايه دول ضيعونا الحجاب يحفظ المسلمه لانها بقت فاجرة قوى وبقت بعضهم بيبات مع رجاله وملهومش اخلاق فانتي متتحيسريش لا ن الخونه كلهم بينفذو مخططات معينه وفرقعات معينه واتحدكم يا شباب ان تقولوا كلمه لهولاء عبر الاعلام المفتوح<br />وكفاينا بقا احنا بندور علي لقمه العيش والحريه الزائفهحتي مش لقينها"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

[[comments]]
order = 6
subject = "ربنا وحده عالم القلوب"
author = "ميم"
posted = "2006-11-21"
text = "انا مستغربه جدا من الحاله الحواريه ال وصلنا لها لا احد يريد ان يعطي الاخر فرصه للتعبير عن رأيه ويصادر رأيه مادام ليس على هواه الشخصي ( والحكومه تفعل نفس الشىء مع الشعب يجب علينا ان نكوف عن التشدق اننا عاوزين حريه رأي طالما لا نعطيها للاخرين وبعدين نبقى نتشملل ونطلب من الحكومه ) مستغربه ان واحد قال جمله بسيطه تعبر عن رايه الشخصي فقط ولم يطالب اي سيدة بخلع حجابها فما هذا اللغط .واغرب شىء في كلام الاخوه المنفعلين ال عاملين انهم فقط ال بيحموا الاسلام يقولك اه انه مش عجبكوا الحجاب يبقى على طول لازم انك تكون تدعوا الى الابتذال فعلا طريقه تفكير بدائيه وسطحيه كانهمعمرهم ما سمعوا ان اكبر ايام الفساد والنفاق والكذب والخراب والغش والمعاملات الانسانية وصلت الى الحضيضفي هذا العهد الذي امتلأء بالاشاربات . فيا ريت لو انتوا فعلا خايفين على الاسلام بلاش نربط بين الحجاب والدين ومكارم الاخلاق لانها مش في الصالح.<br />وعلى فكره الدين الاسلامي يحميه الله وليس نحن لاسباب كثيرة اننا متخلفين عن العالم في كل شىء مش احنا الممكن نحمي دين عظيم ياريت نعمل بجوهره عشان الغرب يحترمنا لان المصيبه الكبيره انهم فاهمنا اكثر من نفسنا وعارفين اننا صوره سيئه لدين بسبب الغش والفساد والنفاق المتفحل على الرغم من انهممش مسلمين ومعندهمش الخصال دي واحنا المسلمين حالنا رهيب يا ريت ناخد نطبق روح الاسلام العظيم ومكارم الاخلاق ونجعلها تسكن ضمائرنا وقلوبنا وعقولنا اهم من التباهي الموجود الان واراه في الطريق ال اناس بتتكلم بها ازاي بيصلوا كتير وبيحبوا الصلاه والصيام الخ على الرغم ان الطقوس الدينيه للله فقط وليس للتباهي بفعلها امام الناس حتى يقولون عني ابيات من الشعر<br />انا حزينه ومتلخبطه من هذه الفوضى .<br />ارجو محاسبه الفاسدين والاخ<br />اقرأ بقية التعليق .."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

[[comments]]
order = 7
subject = "مصر لن تكون علمانيه"
author = "مسلم ومصراوي بجد"
posted = "2006-11-22"
text = "يا جماعه القضية مش قضية تصريحات وزير ولا راى كاتب ولا غيرة الناس دول باعوا الدين واشتروا الدنيا وصدق الله حيث قال ( انها لاتعمي الابصار ولكن تعمي القلوب التي في الصدور )<br />الرد بسيط علي كل الجموع الفاجرة والمتحرة والنساء ال...........<br />انتوا عاوزين تخلعوا الحجاب اخلعوا ياريت تمشوا عريانين طالما ان القضية مش قضية دين (( عليكم لعنة الله والملائكة والناس اجمعين ))"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

[[comments]]
order = 8
subject = "إتصدروا في الهيافة"
author = "حسام"
posted = "2006-11-22"
text = "دايما كده .. نيجي في الهايفة ونتصدر .. أستطيع أن أذكر ألف سبب يدعونا للمطالبة بإقالة فاروق حسني ومحاكمته كمان .. ولكن كلامه حول الحجاب ليس من هذه الأسباب .. بقي يا إخواننا محرقة بني سويف وسرقة المتحف المصري مرتين وإتهامات الفساد التي حبست مدير مكتبه وسرقة الآثار ونهب ومخالفات الترميم وسلوكه الشخصي ال(000) وبلاوي سوده كثير قوي كل الحاجات دي خلاص مش مهم .. إنما كلامه عن الحجاب هو اللي مهم .. طيب ماهو كلامه عن الحجاب قاله قبل كده مثقفين ومفكرين إسلاميين كمان .. وما إنقلبتش الدنيا ولا حاجة"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112443/http://masr.20at.com:80/article.php?sid=1187"

