posted = "2009-04-24"
text = "مفيش معاهدة سلام مع اسرائيل يا زخاري<br />دي يا خويا اسمها عقد ايجار كده او شابه ذلك<br />مصر واخدة سينا بموجب اتفاقية تشبه عقد الايجار<br />وفيه بند بيقول دايما في عقود الايجار<br />يعتبر العقد مفسوخا من تلقاء نفسه اذا خالف المؤجر اي شرط من شروط عقد الايجار<br />والمؤجر اسرائيل والمستأجر مصر والمحامي اللي كتب العقد امريكا<br />سلام يا زخ زخ وسلملي على تريزا"
