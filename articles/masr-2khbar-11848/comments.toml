posted = "2009-04-23"
text = "كلام الدكتور/زقزوق كلام منطقى و جميل و الجميع يؤيدة<br />و لكنى احذر من اسود امن الدولة الاشاوش اللذين لنا بالمرصاد؟<br />سوف نعتقل او على اقل القليل سوف نوضع على قوائم الممنوعين من السفر؟<br />أمن الدولة فى واد و الحكومة المصرية فى واد<br />(امن الدولة)فى واد النسيان متجاهلة او متناسية (أتفاقية السلام)المبرمة بين مصر و اسرائيل!!!؟<br />أصحى يا(أمن الدولة)حرام عليكى"
