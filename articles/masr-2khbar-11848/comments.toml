author = "الانبا بيشوي"
posted = "2009-04-24"
text = "ما هو يا زخاري يا خويا البلد مش فوضى<br />قبل ما تفكر تسافر اسرائيل وقبل ما تفكر تمشي في الشارع اللي فيه السفارة الاسرائيلية لازم تروح تستأذن من مباحث امن الدولة<br />هو النظام كده<br />وبعدين انت ممنوع من السفر من سنة 92 يعني عدا الى الموضوع اكثر من 17 سنه<br />يعني تروح وزارة الداخلية في القاهرة مكتب الوزير وتروح للسكرتارية بتاعته وتقدم طلب هناك<br />عمال تقدم طلبات في موقع ولاد البلد<br />روح قدم طلب في مكتب الوزير في لاظوغلي بالقاهرة<br />سلام يا زخزخ وسلملي على مرقص عزيز"
archived = "2010-03-14"
