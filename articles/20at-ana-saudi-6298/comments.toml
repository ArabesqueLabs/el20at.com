subject = "تعقيب على الموضوع"
author = "محمد بن عبدالهادي"
posted = "2008-10-23"
text = "بسم الله الرحمن الرحيم<br />تعقيبا على موضوع الأخت وفاء لموضوع تكاليف الزواج<br />بالنسبة لتكاليف الزواج فنحن من نصنع ذلك يستطيع الانسان توفير أكبر قدر ممكن من المبالغ الطائلة التي تصرف وتذهب<br />هباءا منثورا فمثلا لو نظرنا الى تكاليف القاعات من بوفيه وايجار وكوشه و .... و ... و ... الخ<br />فذلك يصنعه الانسان بنفسه وهناك بدائل كثيرة جدا فالزواج هو يوم واحد فقط مالذي يدفعنا الى استئجار قاعة بـ 50 الف ريال ويوجد بدلا عنها استراحات مناسبة وبتوفير قدره 45 الف ريال وكذلك الكوشه وغيرها لابد من كل مستهلك أيا كان التفكير مليئا قبل اتخاذ اي قرار قد نندم على اتخاذه فيما بعد<br />وهنا سوف اضع بريدي الالكتروني واستقبل رسائل الاخوة والأخوات المقبلين على الزواج وتحديد الأسعار بحسب الامكانات المتوفرة لديهم بدراسة كاملة مني شخصيا وسوف استقبل استفساراتكم على بريدي safeerr@hotmail.com<br />وانا في غاية السرور وصدق او لاتصدق كلما قلت تكاليف الزواج كلما زادت بركتة بإذن الله<br />أخوكم<br />محمد بن عبدالهادي"
archived = "2010-03-14"
