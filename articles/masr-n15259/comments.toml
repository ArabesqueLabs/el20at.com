subject = "شوفو الخليجيين بيقولوا عليكم ايه"
author = "مش رائص"
text = "النصائح العشر لمن أراد الذهاب لمصر.<br />لكل بلد من بلاد الدنيا سلبيات وايجابيات في كل النواحي ، ومن خلال تجربي للسفر الى ارض الكنانة اريد ان انصح كل من أراد الذهاب بهذه النصائح الغالية وان شاء الله الجميع يستفيد ولو من بعضها :<br />1: كن دائما واثق من نفسك وفي تصرفاتك ولا تجعل لأحد عليك مدخل بتصرف معين.<br />2: مكان السكن لا تستأجره أكثر من ثلاثة أيام فربما تغير عليك الحال وأردت التبديل وهذا وارد كثيرا .<br />3: لا تستأجر سواق طوال فترة جلوسك هناك مهما كانت الضروف ، ولكن اجعل كل مشوار تريده بسيارة تستوقفها من الشارع .<br />4: هناك أناس كثر يستوقفونك في الشوارع وأماكن تجمع أهل الخليج ويعرضون عليك أسئلة ويدعون فوزك بجائزة والفائز هم في هذه الحالة حذار ثم حذار من الوقوف لهؤلاء الاشخاص أو حتى الاستماع لهم .<br />5: ابتعد قدر المستطاع عن أماكن السهر والملاهي الليلية وإذا اضطررت للذهاب لها فكن عاقلا رزينا ثقيلا .<br />6: استمتع كثيرا بدور السينما وما يعرض بها من أفلام شيقة ، ولا تنس حضور بعض المسرحيات الجميلة إذا كان لك اهتمام بهذا المجال .<br />7: احترم كل من حولك من أهل البلد ومن أصدقائك ولا تنفرد برأيك دائما .<br />8: احرص على استغلال سفرك وذهابك في زيارة الاماكن الجميلة ، واسأل عن تواجدها ومشاهدتها .<br />9: كن حريصا على ممتلكاتك الشخصية وتفقدها دائما حتى وهي في جيبك .<br />10: تابع أولا بأول حجز تذكرتك وموعد رجوعك إلى بلدك ."
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061614/http://masr.20at.com:80/newArticle.php?sid=15259"

[[comments]]
order = 1
subject = "إلى الأخ : مش راقص .."
author = "محمد نواف الحمدالله ..."
text = "وفعلاً مثل ماكتبت في تعليقك بشأن من أراد السفر إلى البلاد العربية ( عموماً ) وإلى مصر ( خصوصاً ) ..<br />حيث يجب عليه أن يتبع هذه النصائح الثمينة التي كتبتها في تعليقك بحذر وحيطة وأن يأخذها على محمل الجد لا اللعب والإستتهتار والأهمال واللامبالاة ..<br />فقد صدقت ولامست عين الحقيقة ..<br />وأكثر مالفت انتباهي وشد نظري من بين تلك النصائح القيمة، هي النصيحة قبل الأخيرة (( النصيحة التاسعة )) ..<br />لأنها فعلاً منتشرة في مصر بشكل كبير ..<br />ولكن وكما قلت في بداية تعليقك بأن لكل بلد في العالم أجمع له إيجابيات وسلبيات من مختلف النواحي، وعلى كافة الأصعدة ..<br />أرجو من أهل مصر الكرام ،،،<br />عدم الزعل من تعليقي بشأن تحفظي بالنصيحة التاسعة ...<br />بل عليهم أن يأخذوها على محمل \\\" قول الحق ولو بقطع الرقبة بالسيف \\\" ..<br />أشرك أخي :- مش راقص على هذه المعلومات الجميلة، والرائعة ..<br />أمد الله في عمرك، وعمر من تحب .. وبارك الله فيك أخي الطيب ..<br />فمصر بالرغم من كل ذلك .. ستبقى ((( أم الدنيــــــــــــــــــــــــــــا ))) دائماً وبداً ...<br />شكراً ..<br />_______________ تحياتي للجميع ______________"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061614/http://masr.20at.com:80/newArticle.php?sid=15259"

[[comments]]
order = 2
subject = "مش فاهمة الناس بتعلق على المواضيع بكلام عجيب ملوش صلة بالموضوع أصلا"
author = "بنت مصرية"
text = "أولا اخواني الأعزاء مش فاهمة تعليقاتكم التى لاتمت للموضوع بأي صلة ، بالنسبة للموضوع ، الشرقاوي حاليا معروف لدى الجهاز الأمنى ولدى دور النشر المهمة أما دخولهم واقتحامهم للدار فكان رغبة منهم لإيقاف محمد وده بناء على اعتقاله لأنه محمد معروف بآراءه الثورية ضد الجهاز الأمنى الفاسد ، للأسف هما عاملين زي لعبة حاوريني ياكيكة رغبتهم في إبعاد الأشخاص المميزين بتكون بطرق همجية ، وبعدين لما يكون ليهم حق مصادرة الكتب كان يعتد بده لكن محمد والشباب لابد ليهم من مهاجمة هذا الفعل الغير حضاري والذي لايمت للثقافة بشيء أتمنى نتحرك للدفاع عن دار نشر مهمة"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061614/http://masr.20at.com:80/newArticle.php?sid=15259"
