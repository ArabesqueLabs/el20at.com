text = "العواطلية اللي مش لاقيين شغل<br />المحللين والمفكرين والمحامين والاخوان والاقباط<br />لازم يبقى فيه قضايا علشان خاطر ناكل منها عيش<br />والشعب الاهبل بيدفع على طول"
