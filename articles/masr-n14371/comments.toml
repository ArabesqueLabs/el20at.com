[[comments]]
order = 4
subject = "الحكومة بتعمل اية"
author = "مش فاهم"
posted = "2008-02-29"
text = "انا عمرى ما سمعت خطاب لرئيس الدولة - اول ما ييجى فى التلفزيون با احول القناة فورا - مش بيقول حاجة تهم الناس<br />بيتكلم على انجازات اكيد اتعملت علشان واحد زى بتاع الحديد - وانجازات مش تخص الشعب ولكن تخص بتوع فلل الساحل الشمالى - ثم انة رئيس الحزب الوطنى ومصر مش هى الحزب الوطنى يبقى مش رئيس كل الناس- فأنا مثلا ليس لى حزب<br />يبقى مليش رئيس<br />وبعدين الانجازات اللى تمت فى 26 سنة هى بيع المصانع والشركات والبنوك للاجانب وتشريد العمال تحت مسمى المعاش المبكر -- ثم جولات الشحاتة الى دول الخليج لاجراء عمليات تسول وجلب مثتثمرين يشاركوا ناس معينيين من الاقرباء لعمل ثروات وقرى سياحية لا يستفيد منها احد"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428214920/http://masr.20at.com:80/newArticle.php?sid=14371"

[[comments]]
order = 5
subject = "بصو في الصورة كويس"
author = "مش بحبك"
posted = "2008-02-29"
text = "واحد قافل بقه وحاطط عليه قفل ورابط ايده بكلبشات<br />هو عامل كده ليه؟ أفهم يعني<br />هو يعني لما يعمل كده حيفرجوا عن المعتقلين ولا ايه ولا هو تضييع وقت وخلاص<br />ناس مش لاقيه شغل يا جدع<br />البطالة عملت حجات غريبة<br />هو كده استطاع ان يلفت النظر تمام ونجح في هذا واصبح مشهور الان"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428214920/http://masr.20at.com:80/newArticle.php?sid=14371"

[[comments]]
order = 6
subject = "لماذا المحاكمة عسكرية"
author = "مش عارف"
posted = "2008-02-29"
text = "الناس اللي شايلين يفط ودايرين في الشوارع ورافعين راية لماذا المحاكمة عسكرية<br />يا ابني انت وهو انت بتستغبط ولا بتستهبل<br />المحاكمة عسكرية لكن الرئيس عسكري<br />والريس اصلا هو اللي حيحكم في القضية يعني الر ئيس حسني مبارك هو رئيس المحكمة العسكرية الفعلي<br />فهمت يا روح امك انت وهو<br />عيب كده شوية حمير يشتغلوا في السياسة<br />السياسي لازم يكون فاهم<br />حسني مبارك راجل ديكتاتوري يسمح بمعارضة مقدارها على اكثر تقدير 10% فقط واكثر من 10% يكون تجاوز للخط الاحمر<br />المفروض اللي بيشتغل في السياسة يكون فاهم ما يكنش حمار"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428214920/http://masr.20at.com:80/newArticle.php?sid=14371"

[[comments]]
order = 7
subject = "تكملة اللي فوق"
author = "مش عارف"
posted = "2008-02-29"
text = "وبعدين الاخوان المسلمين دول عندهم خبرة في المسائل اللي زي دي من ايام الملك فاروق<br />تم اعتقالهم ايام الملك فاروق<br />وايام جمال عبدالناصر<br />وايام السادات<br />وايام حسني مبارك<br />المفروض يكونوا فاهمين<br />ان خيرت الشاطر ورفاقه دول تم اعتقالهم سياسيا وقضي الامر ولن يفرج عنهم الا عندما ياتي نظام اخر<br />المفروض يكونوا فاهمين كده<br />يعني مثلا عبود الزمر سجن في اول عهد حسني مبارك واتهبد 25 سنه وخلصوا ومع ذلك هو لسه في السجن<br />يا ابني انت وهو ما تضيعوش وقتكم في كلام فارغ روحوا شوفوا شغلكم احسن<br />خيرت الشاطر ورفاقه معتقلين سياسيين الى ما شاء الله<br />والمحكمة دي صورية لا فائدة منها ولا قيمة لها"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428214920/http://masr.20at.com:80/newArticle.php?sid=14371"

[[comments]]
order = 8
subject = "النظام العسكرى الديكتاتورى هو الذى يجب محاكمتة"
author = "مش لاعب"
posted = "2008-03-01"
text = "النظام الفاشل الذى باع الصناعة المصرية ودمرها - وباع المصانع للافاقين واليهود مصانع الاسمنت بيعت لشركات يهودية بجنسية ايطالية والغزل للهنود والالاف غيرها<br />والبنوك التى بيعت<br />هدم نظام التعليم - ونظام الصحة وجعل البلد على حافة الانهيار<br />رئيس بلد يترك مكان عملة لمدة 20 سنة اللى هو القصر الجمهورى وقاعد فى اجازة مفتوحة فى احد المنتجعات الساحية اللى هى شرم الشيخ وسايب الشعب ياكل طوب<br />من اولى بالمحاكمة"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428214920/http://masr.20at.com:80/newArticle.php?sid=14371"
