[[comments]]
order = 2
subject = "الريس فين انا مش عارف الريس فين حد شافة اوسمع عنة"
author = "اوتومان بفراوى ابوبسكوتة"
posted = "2008-02-27"
text = "انت ياريس اللى بتشرعن للفساد فى الليل والصبح تسمعنا لحن الديمقراطية والحريات الصحفية اللى اتحققت فى عهدك طب بص لامورناالداخلية ومشاكلنا واسبابها تزوير ارادة الناس ودة الاهم ومن بعدة وجود اشخاص غير منتخبين ومفروضين بقوة السلطة والامن والذى منة لتشكيل التوليفة المطلوية من المحاسيب وسيئى السمعة بغض النظر عن كفائتة وشعبيتة بين ناخبية وفى النهاية احب اقول لسيادتك انى بحبك احيانا وفى احيان كتيرة بقول الريس فين معقولة التناغم بين دوائرالدولة لاتخاذ القرارات بطريقة توحى للسذج ان التاجيل والتمديد قرار فردى وليس سياسة موضوعة لهدف بعينة"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004241/http://masr.20at.com:80/newArticle.php?sid=14371"

