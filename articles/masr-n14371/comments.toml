subject = "الفوضى قادمة - والكرسى  يهتز"
author = "شرفنطح"
posted = "2008-02-26"
text = "لبنان من غير رئيس من 6 شهور<br />ومصر من غير رئيس لمدة 26 سنة - بعد موت السادات - تعتبر مصر من غير رئيس<br />اللى بيحكم مصر من 26 سنة هو الامن - رئيس امن الدولة هو رئيس مصر الحقيقى<br />الامن خاف من المظاهرات<br />طلب تأجيل اعلان الحكم"
