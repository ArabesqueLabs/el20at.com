text = "الموضوع جميل و اسلوبك جميل اوي يا دعاء .. انما مش شايف براء تخين اوي للدرجة المهوله دي<br />يمكن انا اخر مرة شوفته فيها كان في ستمبر 2005 ووزنة زاد بعدها<br />المهم مبروك عليكي ومبروك عليه"
archived = "2007-07-05"
