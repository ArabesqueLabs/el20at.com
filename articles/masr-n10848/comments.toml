author = "مي حمدي"
posted = "2007-07-01"
text = "الموضوع مش بالطول ولا التخن ولا الرفع...أهم حاجة التفاهم وكل شيئ نصيب...على فكرة أنا خسيت 20 كيلو الحمد لله...وقابلني مواقف بايخة كتير برضه من ناس مش بتراعي شعور حد...عموما المقال لطيف وألف مبروك"
archived = "2007-07-05"
