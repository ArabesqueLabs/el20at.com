author = "مصـ( الخير )ـعب"
posted = "2007-07-02"
text = "برضه يا بيرو يا حبيبي \"تخين وبنضارة\"<br />وده الوصف اللي أنت حطيته ليك في مدونتك بعد ما قعدت تلف وتدور كتير :-)<br />واسمح لي أفضحك شوية، وأقول لكم اكتشاف دعاء الخطير ..<br />لما تكتب \"تخين\" على بحث الصور في جوجل ..<br />تاني صورة على طول صورة براء<br />شكرا يا دعاء على الاكتشاف المذهل ده<br />\"بحبك يا صاحبي\""
archived = "2007-07-05"
