[[comments]]
order = 1
subject = "أبشر يا طحاوى"
author = "ياسر أبو العلا"
posted = "2007-06-28"
text = "إذا كانت الأستاذة دعاء تقول هذا الكلام الرائع عن براء وهو يستحقه لاشك ، فأبشر يا عبد الله يا طحاوى بأنه من الممكن أن يأتى اليوم الذى تفرح فيه زوجتك بأنها تزوجت \" تخينا وبنظارة ... وطيبًا أيضًا \" وهى نفس الأوصاف التى يشترك فيها كل من براء والطحاوى ، وإذا كان براء الذى أراه كالعصفور إلى جانب صديقى اللدود عبد الله قيلت فى حقه هذه الكلمات الرقيقة ، فليس مستبعدًا أن نقرأ مثل هذه الكلمات فى حق الطحاوى أو غيره من أصدقائى الأعزاء الذين يستولون على جزء كبير من الأكسجين المخصص لعدد أكبر بكثير من البشر .<br />ولكن عندى سؤال - بالمناسبة يعنى - وهو لماذا ترتبط السمنة بطيبة القلب وخفة الدم ؟<br />أتمنى أن يحاول أحد الزملاء\" العشريناتية \" البحث فى هذه القضية التى أعتقد أننا نلاحظها جميعا ."
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204921/http://masr.20at.com:80/newArticle.php?sid=10848"

[[comments]]
order = 2
subject = "الواحد علي كدة يضمن عروسة"
author = "ابو يوسف"
posted = "2007-06-28"
text = "برضة انا كل خوفي اني يتقال علي كدة<br />لا يا ستي دعاء<br />انا اروح اعمل رجيم من الان وصاعد<br />ومش هاكل ولا اشرب حتي اخس<br />والعروسة متقولش كدة"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204921/http://masr.20at.com:80/newArticle.php?sid=10848"

[[comments]]
order = 3
subject = "انا مش قصير ازعه ولا طويل واهبل"
author = "محمد"
posted = "2007-06-28"
text = "موضوع ظريف ودمه خفيف انا بحترم جدا اى شخص بدين بتعامل معاه لا باسخر منه ولا اى حاجة بس بصراحة انا بسخر من الرفيعين جدا او القصيرين لان القصير دايما كده بس جبار ودايما اى قصير تلاقيه استاذ كلام .<br />انا لا انا تخين ولا رفيع بين البينين ولا طويل ولا قصير بين البينين برضه .<br />بس لازم اخس 7-8 كيلو عشاناوصل للجسم الرياضى هه دعواتكم معانا"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204921/http://masr.20at.com:80/newArticle.php?sid=10848"

[[comments]]
order = 4
subject = "يالهوى"
author = "المعلم"
posted = "2007-06-29"
text = "تخين وبنضارة بس والا فية حاجة تانية<br />ياخوفى لا يكون ما بيعرفش يطلع السلم<br />وبعدين العتبة جزاز والسلم نايلون فى نايلون وبسبب النضارة مش شايف الالوان<br />والوزن التقيل دة مصيبة بتكبس على النفس وخصوصا بعد اكلة محشى<br />عزائى للتخان وربنا يصبر نسوانهم"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204921/http://masr.20at.com:80/newArticle.php?sid=10848"

[[comments]]
order = 5
subject = "طويييييييل"
author = "هش"
posted = "2007-06-29"
text = "بس البراء مش تخين اوى<br />وفيه ميزه انه طويل يغنى ممكن يخس وابسط نزول فى وزنه هيبان عشان طويل<br />روح جيم بيجاما يا براء<br />هههههههههه<br />والله موضوع عثل"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204921/http://masr.20at.com:80/newArticle.php?sid=10848"

[[comments]]
order = 6
subject = "تخين بس هيخس عشانى"
author = "Barbie girl"
posted = "2007-06-30"
text = "انا كمان مش بحب التخان..لان اخويا تخين وعملى عقدة نفسية ههههه وهو كمان اتعقد منى عشان كل شوية اقوله خس يانى خس ..اخر ما هو زهق منى قالى يارب تتجوزى واحد تخين..وعدت السنين..وفى الاخر حبيت واحد والله مكانش تخين وفجأة لتاقيته تخن مش عارفة ليه بقى..بس على مين!!!انا مصممة انه يخس وهو وعدنى انه هيخس ههههههههههه عشان اخويا مايفرحش فيا ويتريق عليا...موضوع عسول خالص وعجبنى اوى"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204921/http://masr.20at.com:80/newArticle.php?sid=10848"

[[comments]]
order = 7
subject = "علاء ولي الدين"
author = "hana"
posted = "2007-06-30"
text = "زعلت منك يا دودو انا كنت بحب علاء ولي الدين الله يرحمه و كنت عايزة اتجوزه و اخليه اسعد راجل تخين في العالم<br />علاء كان بجد فتى احلامي كان انسان جميل و طيب و مثقف و كل الناس كانت بتحبوا و على فكرة انا ما كنتش بحبه علشان دمه خفيف انا كنت بحبه علشان شخصيته و لما توفى الله يرحمه صحابي كلموني عزوني فيه<br />شفتي بقى ان في بنات ممكن تحب التخان و تموت فيهم.....اه صحيح ما انتي واحدة مننا اهه :-)"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204921/http://masr.20at.com:80/newArticle.php?sid=10848"

