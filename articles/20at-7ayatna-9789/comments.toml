text = "إن هذا المول مركز للمعاصي يجتمع فيه الشباب من الجنسين فهو يشجع على الإختلاط وشاهدت داخله مجموعات من المتشبهين بالنساء و المتشبهات بالرجال و أنا أدعوكم إخوتي إلى مقاطعته حتى يتوب و يمتنع عن المعاصي<br />و السلام عليكم و رحمة الله وبركاته"
