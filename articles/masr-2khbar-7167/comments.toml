[[comments]]
order = 3
subject = "عااااااااااااوز اغور"
author = "مصرى للأسف"
posted = "2007-09-24"
text = "السيد السويركى دة ......... بتاكلة . وشكلة عايش فى مية البطيخ ومش حاسس بحاجة ومش حاسس بالغلب اللى احنا فية . انا كل الشباب اللى اعرفهم نفسهم ومنى عيهم انهم يغوروا من البلد دى فى اى حتة تانية وانا اولهم وانا ياعم سيد مش عجبانى البلد واتمنى ان حضرتك تبقى قد كلامك وتغورنى بمعرفتك فى اى حتة وياريت اروح موريتانيا . تفتكر يعنى اية اللى بيخلى شباب زى الورد يسافر عن طريق البحر وهوة ميعرفش يعوم علشان يغور من البلد دى ؟؟؟؟؟؟؟؟؟؟؟؟؟"
