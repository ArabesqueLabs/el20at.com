subject = "الى السيد السويركى"
author = "اكتب اسمك هنا"
posted = "2007-09-25"
text = "يا اخ سيد يا سويركي ما هو اصل مش حتمنعونا من الكلام كمان<br />الكلام والفضفضه هو اخر ملاز للمصري من العذاب اللي شايفه<br />انت عارف يا سيد يا سويركي ان زمان كان فيه حاجه اسمها اسر محدودة الدخل<br />الان يا سيد يا سويركي فيه اسر معدومة الدخل واوعا تفتكرني بضحك عليك<br />انزل انت الى الناس والشارع وابحث وشوف بنفسك"
archived = "2010-03-14"
