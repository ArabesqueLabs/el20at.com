subject = "شعب يطلب الفرار من بلدة"
author = "محمد ايوب"
posted = "2007-09-24"
text = "امنية اى مصرى انة يهرب من بلدة ويروح اى حتة فى الكرة الارضية فيها امان وفيها احترام للادامية والانسانية<br />البلد بقت بتاع الحرامية<br />فى افريقيا تلاقى مشردين مصريين<br />وبيموتوا فى سفن التهريب الغير شرعى الى اوروبا<br />اننا نعيش فى زمن الهروب من مصر"
