text = "على ما يبدو ان العنوان كده صح لان الحياة في مصر اصبحت مستحيله في ظل الظروف الراهنة وفي ظل ان العلاج اصبح من مظاهر الترف يعني انك تعيا وتروح للدكتور وتتعالج اصبح هذا الامر للناس الاغنياء فقط"
