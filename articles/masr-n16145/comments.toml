[[comments]]
order = 2
subject = "سجون عزيز مصر وسيدنا يوسف والزمن الاغبر"
author = "مصرى عايز يفهم"
posted = "2008-06-06"
text = "اسهل حاجة عند اى قاضى مصرى او مشرع قانون مصرى ان يحكم بالسجن<br />فاذا كشر زوج فى وجة زوجتة وذهبت الى المحكمة فان القاضى سيحكم علية بشهر سجن<br />واذا اغضبها وحكم لها بالنفقة فانة يحكم يا الدفع يا الحبس<br />واذا ارتكبت مخالفة مرورية صغيرة فانة يحكم احيانا بالحبس<br />كل شىء حبس وحبس وحبس<br />والنتيجة امتلات السجون بالمساجين وتكدسوا فيها واصبحت معتقلات لا انسانية<br />لماذا يحبس ايمن نور - اذا كان اخطأ فلماذا لا يحكم بغرامة كبيرة ويطلق سراحة او تحدد اقامتة فى بيتة او قريتة ولا نتعرض لسخرية بوش وحقوق الانسان<br />هل لا زلنا بعقلية عزيز مصر الذى سجن سيدنا يوسف بحجة وشاية من زوجتة<br />هل يتلذذ الحكام المصريين بسجن الناس<br />ثم يقولون مصرح لة بمكالمة تليفونية للتجميل امام حقوق الانسان العالمية<br />واذا كانت عائلة المسجون فقيرة وليس عندها تليفون<br />يا عزيز مصر<br />ارحموا الناس"
archived = "2010-03-14"
capture_url = ""

