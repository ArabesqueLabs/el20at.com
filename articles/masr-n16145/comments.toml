[[comments]]
order = 0
subject = "اللواء سمير سلام محافظ الدقهلية كان مساعد لوزير الداخلية لقطاع السجون"
author = "مش لاعب"
text = "سؤال برىء واللة<br />ما علاقة لواء بمصلحة السجون بوظيفة محافظ علية تخطيط واعمار وتنمية المحافظة ؟"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091650/http://masr.20at.com:80/newArticle.php?sid=16145"

[[comments]]
order = 1
subject = "الى الاخ مش لاعب"
author = "مش ححبك"
text = "هذه خطوة لتعميمها على كل محافظات مصر<br />وذلك لتحويل مصر الى سجن كبير<br />والشعب سيعامل كمساجين"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091650/http://masr.20at.com:80/newArticle.php?sid=16145"
