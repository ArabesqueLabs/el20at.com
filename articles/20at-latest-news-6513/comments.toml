subject = "نونإلى نونو"
author = "محمد نواف"
posted = "2008-11-20"
text = "أولاً: شكراً لكِ على التصحيح ..<br />ثانياً: جزاك الله خيراص أختي ..<br />ثالثاً: أرجو منكِ مرةً أخرى عدم التدخل ..<br />رابعاً: أنا أعرف هذا الدفاع المستميت الذي تقومين بالدفاع عنهُ، انا أقول لكِ لماذا؟ بكل بساطة لأنه سعودي ولأنك سعودية .. فكلاكما أبناء بلد واحد .. ووطن واحد، لذلك قمت بالدفاع عنهُ، ولو أنه ليس من المملكة السعودية، لما انتفضت هكذا !<br />خامساً: لا أقول إلاّ إن في وطننا العربي، يوجد عقليات متحجرة، من العصر الحجري، وللأسف هم موجودون بيننا، ويعيشون بيننا، ونحن نترك لهم العنا !<br />ختاماً ..<br />عاهاتك يا وطن ... \" وربي \" يكون في عونك يا وطن !!!!!!!<br />محمد نواف ،"
