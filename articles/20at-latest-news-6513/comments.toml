text = "وين ادارة الموقع لحتى تشوف كلام التافه الذي لا يمت لفلسطين و ارضها بصلة و هو الذي يطلق على اسمه عاشق فلسطين<br />فهو لا يمت لفلسطين و لا الاسلام و لا العروبة بصلة و انما هو عبارة عن انسان جاهل و حاقد و يكفيه كلمة جاهل فعلا<br />اتمنى من ادارة الموقع حذف كل التعليقات الموضوع حتى لا تتحمل المسؤولية القانونية<br />و ان كان من يطلق على نفسه عاشق فلسطين رجل بمعنى الكلمة و اشك بهذا الامر اتمنى ان يعطيني تلفونه و بريده الالكتروني لنلتقي"
