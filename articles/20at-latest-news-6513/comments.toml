subject = "تصحيح !"
author = "محمد نواف الحمدالله ..."
posted = "2008-04-16"
text = "والعمى عمى البصيره وليس عمى العيون ..................... ( اقتباس من الأخ السعودي : الفارس )<br />لو سمحت فسر لي أو حلل لي هذه الجملة الغبية التي كتبتها .. فيكبف العمى عمى البصيرة وعمى العيون بنفس الوقت .. فالبصيرة والعيون نفس المعنى وليسا ضد بعض .. المثل يا حذق يقول :- (( العمى عمى القلب وليس البصيرة )) ..<br />روح الله يهديك ياشيخ حتى كتابه مش عارف تكتب .. !!!<br />تحياتي للجميـــــــــــــــع ،،،<br />وخصوصاً لأروى .."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "نونو"
author = "تصحيح كلام الاخ محمد نواف الحم"
posted = "2008-05-18"
text = "كلامك خطأ اخي الاردني محمد نواف و كلام الاخ السعودي صحيح مائة بالمائة<br />البصيرة يا اخي الكريم تعني القلب ..و ليس البصر .. لذلك في اللغة العربية المثل يقول العمى عمى البصيرة و ليس عمى البصر .. اما قولك العمى عمى القلب و ليس البصيرة فهو التناقض التام و الخطأ بعينه لان القلب هو البصيرة ..<br />اقل شئ ممكن تعمل بحث في الانترنت لتعرف المعاني التي تضمها اللغة العربية الجميلة ..<br />البصيرة في القلب .. و البصر في العيون<br />و اتمنى ان تتحلى بطريقة النقد و التصحيح (لو كان في خطأ ) باسلوب راقي بدلا من الاساءة في الرد على الشخص فقط لأنه عارضك في الرأي اساسا ..<br />تحية طيبة للجميع و للاخ السعودي الفارس و حقا ... إنها لا تعمى الابصار و لكن تعمى القلوب التي في الصدور ..<br />فاللهم نور قلوبنا و اغفر لنا .."
archived = "2010-03-14"
capture_url = ""

