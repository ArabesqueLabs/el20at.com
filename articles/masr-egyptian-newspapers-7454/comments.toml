[[comments]]
order = 1
subject = "هاهاهاهاها"
author = "هاهاهاهاها"
posted = "2007-10-29"
text = "وهكذا ندرك أن الواقعية هي التي جعلت الرئيس مبارك وحكومة الحزب ينجحان في ترسيخ مفهوم الأمن القومي. ليتفرغا للتنمية الشاملة وتحسين معيشة المواطن (هاهاهاهاهاهاهاهاهاهاهاهاها), ضحكتنى وانا مل ليش نفس."
