[[comments]]
order = 3
subject = "رزق الحزب على المجانين"
author = "ابو اسامة"
posted = "2007-10-29"
text = "هو الاخ الاهبل ده كاتب مقال ولا دعاية للحزب ولا عايش فى بلد تانية وشايف حاجة غير<br />بلد مخروبة فى الداخل وتافهة ومن غير اى دور فى الخارج يا حبيبى احنا لفيه داخل ولا خارج<br />الحمار الى سايق بينا مش عارف هو واخد البلد على فين دا اذا كان هو اللى بيسوق اصلا.<br />جتك خيبة فيك وفى اللى مشغلينك."
archived = "2010-03-14"
