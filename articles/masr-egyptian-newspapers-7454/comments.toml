[[comments]]
order = 0
subject = "الله يخرب بيتك يا بهلول"
author = "موااطن محدود الدخل"
posted = "2007-10-28"
text = "هو الراجل ده عبيط ولا بيستعبط ولا ايه نظامه<br />هو فين تأثير الاستقرار على محدودى الدخل والاستثمار اللى وفر وظائف عمل لابنائهم هيا الناس لاقيا تاكل يا محترم الله يخرب بيوتكم يا شيخ انت واللى مشغلينك فى يوم واحد<br />الراجل ده منافق وكداب زفة ودى حاجة معروفة بس متوصلش للدرجة دى يعنى وسعت منك على الأخر يا بهلول انت"
archived = "2010-03-14"
