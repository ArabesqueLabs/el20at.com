[[comments]]
order = 2
subject = "يالهوى"
author = "وهوهو"
posted = "2007-10-29"
text = "صحفى ابن منافقة<br />بيبرر الخراب<br />استقرار اية يا اهطل يا ابن الهطلة<br />البلد خربها حزب الوطنى بقيادة شارون<br />تفو على امك"
