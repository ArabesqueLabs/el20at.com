subject = ""
author = "سيد اسماعيل"
posted = "2009-12-01"
text = "لا ادى كيف لموقع محترم كموقعكم يسمح بتلك التعليقات السخيفة التى تنال من عالم مسلم مصرى عربى يفخر بيه كل عربى . الدكتور محمد النشائى هو واجهة مشرفه للعرب فى كل مكان .<br />بالطبع انا افهم الهجوم الشرس ضد الدكتور محمد النشائى و اعرف ان من وراء هذا الهجوم الغير شريف مجموعة يتراسها دكتور فاشل سبق و ان حكم عليه بالسجن هو و زوجته لاتهامه بالسرقة و التزوير للحصول على بعض الامول التى ليست من حقهما وهذا الدكتور الفاشل قد سبق ان طرد من جامعة القاهرة و جامعة بنسلفانيا الامريكية و اخير طرد من جامعة سيناء . ولقد سخر هذا الدكتور كل مجهوده فى الاساءة الى الدكتور العظيم محمد النشائى و ذلك لاسباب شخصية بحته . ان هذا الشخص العديم الاخلاق هو الدكتور سعيد صلاح حامد و اليكم الموقع الذى يذكر فيها حقيقته و صورة للحكم القضائى الصادر ضدة<br />http://saidelnashaie.blogspot.com/<br />و اخير ا ارجو من السادة مدراء الموقع الكريم ان يقوموا بحذف تلك التعليقات المسمومة التى تطال واحد من اعظم رجال العلم فى وطنى العربى و الا يسمحوا بان يكون موقعهم ساحة للتشهير بعالم عظيم و جليل"
archived = "2010-03-14"
capture_url = ""

