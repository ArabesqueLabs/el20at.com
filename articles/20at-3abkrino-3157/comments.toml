posted = "2009-12-11"
text = "أرجو من النشائى (وأتباعه المخلصين) أن يكتبوا بلغة عربية سليمة فمثلا سيد أسماعيل (النشائى) يكتب بيه بدلا من به. أنتبه الباء مكسورة وليس بعدها ياء وهذا خطأ يقع فيه التلاميذ فى السنوات الأولى من المرحلة الأبتد ائية. لذلك نرجو من النشائى أن يتعلم دروس اللغة العربية للمرحلة الأبتدائية وهذا ليس عيبا وقد يكون فى متناول قدراته أكثر من الفيزياء التى فات الأوان على تعلمها."
