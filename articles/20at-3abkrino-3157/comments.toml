text = "هذه الهجوم بفعل فاعل لا يهمه سوى ان يدمر صورة الدكتور محمد النشائى التى لن تتاثر بتلك المهاترات و الاكاذيب . يا نشائى لا تلتفت الى تلك القله فالشعب المصرى يثق بك و لا يسمع تلك الاكاذيب"
