[[comments]]
order = 9
subject = ""
author = "أحمد"
posted = "2009-12-23"
text = "انا لا ادرى الى اى شئ قد تقودنا تلك المهاترات الغير مسئوله من بعض القلة التى تريد ان تسئ الى صورة عالمنا الدكتور محمد النشائى . ولا ادرى كيف يمكن لاصحاب الموقع ان يسمحوا بتلك التعليقات السيئة و التى لا هم لهم غير تشوية صورة عالم مصرى عربى مسلم ؟ عندما تقراء تلك المهاترات و التعليقات لابد وان تجد ان هؤلاء الناس ليسوا سوى مجانين فانهم يتهمون الرجل بانه ينشر ابحاثه فى مجلته التى انشائها و يجدون ان هذا عيب و يروى تكريم النشائى من قبل الجامعات الخارجية هراء .. اى عبث هذا ؟؟ ان الموقع المشين الذى يحاولون نشرة على النت ولأسف الشديد موجود فى تلك التعليقات لا يرضى عنه اى انسان عاقل فما بالك برجال عرب و مسلمون . ان هذا الموقع يروج لأكاذيب و يعرض صور مخله بلأداب العامة يحثوا يركبون صور الدكتور على صور جنسية فاضحة و يتعرضون الى بناته فكيف بالله عليكم تسمحوا بتلك القذارة ان تكون فى موقعكم ؟ ومع ذلك و مع تلك الحرب القذرة نجد ان الدكتور محمد النشائى لا يتأثر ولا يكتثر حتى بالرد عليهم ومع ذلك دائم الظهور على شاشات التلفاز و على صفحات الجرائد . موتوا بغيظكم متى كان الجبل يتاثر بالفئران الزاحفة تحته"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = ""
author = "ماهر"
posted = "2009-12-27"
text = "(1)<br />الله بسم الله الرحمن الرحيم السادة المسئولين عن هذا الموقع الكريم والاخوة القرائين الكرام . لابدا و انكم قراتم التعليقات التى تفوح منها رائحة الحقد و الكفر و الفجور هذا هو محتوى التعليقات الكاذبه السابقة لتعليقى هذا كاتب هذه التعليقات زور اسمه و اسمه الحقيقى هو الدكتور سعيد حامد و تستطيعون متابعة تاريخه المخجل تحت حقيقة الدكتور سعيد .. وكيف نسطتيع ان نسمى هذا الرجل دكتور او حتى رجل يكفى ان تروا تاريخه الحافل بالتزوير لا لشئ الا لحقده الدفين لكل من هو احسن منه و اما اكثرهم. العذر الوحيد لهذا الرجل اذا حق ان نسميه مرة اخرى بالرجل انه مريض مرض نفسى خطير دفع الدكتور حسن راتب رئيس جامعة سيناء الى فصله و لقد كانت جامعة سيناء ملاذ هذا الرجل الشاذ الاخير بعد ان فصل من جامعة بنسليفينا بالولايات المتحدة المريكية و قبل ذلك جامعة الظهران فى السعودية وقبل ذلك من جامعة القاهرة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = ""
author = "ماهر"
posted = "2009-12-27"
text = "(2)<br />الدكتور سعيد هو زوج الدكتورة شادية الشيشنى التى قضت مضت عقوبة بسجن النساء فى القناطر بسبب التزوير والاستيلاء على الاموال بطرق غير مشروعة . وابنة زوجته هى نجمة السينما جهان فاضل ( ونعم النسب )رجائى الوحيد هو ان تزال هذه التعيلقات الفاجرة للدكتور سعيد وكذلك اى اشارة الى موقع المجرم جيسون الامريكى تلميذ الدكتور سعيد النجيب وصورة الفاجرة التى يحق فى الاسلام ان يقام الحد على صانعيها وعندما تزال هذه الجراثيم من هذا الموقع الشريف نرجو ان يزال ايضاً تعليقنا هذا حتى نستطيع ان ننسى او نتناسى هذه البلايه و العار الذى اصابنا بسبب وجود مخلوقات من نوع الدكتور سعيد و اذنابه المتعددة واغلبهم فى الجامعات الخاصة او خارج مصر فى مناطق يسيطر عليها اولاد ملته من الصهاينة ولكم خالص الشكر و التقدير"
archived = "2010-03-14"
capture_url = ""
