[[comments]]
order = 4
subject = ""
author = "صدام بن خليفة الحربي"
posted = "2009-11-06"
text = "صدام<br />يـــالله يـــارب السمــا والأراضيـــــن يـــاواحـدا مـعـــبود عـــالم شانها<br />رب النبي طه رسول العـــالمــــــــين كــل الشمـــايل والـنـبـي نـــوالها<br />صلـوا عـليه وسلـموا يــامسلــــــمين أكـبر صلاة والـنـبـي يـــــزهالها<br />مـرحــــوم يــاقايد العرب والمسلمين شـاهـد عظيـــم والشهاده نـالـــــها<br />درع العرب صدام مهيب السلاطــين المــــارد العمــــلاق اللـــــي نالها<br />صــدام صــدام صــدام حســـبن ســـــيف العــروبـــه ذالبطل خيالها<br />عز العرب صــدام نسـل الميــامـــين تنحره ذلتــنا وتـدلـي احبـــالــــــها<br />طبوا عليه أعيال كســــرى الملاعين وفي نهـار العيـد الأكــــــــــبر نالها<br />إيــها بني الإســــــلام أنتو الموؤمنين في عيد الأضــحى تنـحر نـخــواتنا<br />إيــها عرب قحطـــان يـانصرة الدين اليوم ذا تـرعـــــــد سمـابمــــطارها<br />إيــهاعرب عـدانـــان للـحق اليقــــين الأرض تـحـتك يعتـــلي زلـــــزالها<br />صدام بن خليفة الحربي<br />30/12/2006"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202062022/http://www.20at.com:80/20at/arts/13843-2009-10-27-11-32-35.html"

