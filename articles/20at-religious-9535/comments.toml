text = "الطعام يكون وسيلة لممارسة الحياة ويكون معينا للجسم للصبر على الطاعة أما المفجوع مثل الحيوانلايشبع أبدا لانه يحب الأكل وليس عنده ادراكلما يأكل من يلتزم تعاليم الرسول ثلث للطعام وثلث للشراب وثلث للنفس يعيش سعيدا من غير أمراضو لا قلق"
