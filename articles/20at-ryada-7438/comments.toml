[[comments]]
order = 2
subject = "عيب يامصري"
author = "ولدت لاكون اهلاوي(احمد صفاء)"
posted = "2007-10-27"
text = "اولا السلام عليكم ورحمه الله وبركاته وبعد بالنسبه لما تم نشره عن الاستاذ الذي يدعي انه مصري وليس له ميول رياضيه<br />مصريه اقول له عيب عليك هي دي كلمه حق ياراجل ماتخليش كرهك لانجازات النادي العظيم ده يخليك تنسب له ماليس به عيب عليك تغلط في نجم له شعبيه كبيره زي ابوتريكه انت ايه اللي عرفك انه بيمثل ليه الظن ده وايه اللي عمله جوزيه عشان يكون صاحب اسوء اخلاق,اقرا واسمع عن الاهلي من 100سنه وانت تعرف يعني ايه اهلي ياجاهل ماتخليش الحقد يملى قلبك ماتزعلش مني على صراحتي لانك تطاولت على نادي عريق حتى لو مالكش في الكره يبقى تخرس وتفهم وتقرا وتشوف وبعدين تحط تعليقك ورأيك زي مانت عايز.<br />وفي النهايه مقدرش اقول الا اني ماينفعش اكون مصراوي وانا مش اهلاوي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "نـ المصـرى الاهلـوى ـادر"
posted = "2007-10-28"
text = "رغم انك مصرى وكاتب انا مصرى لانك متفهمش حاجه<br />مصرى وبحب الاهلى وبعدين ياراجل يمنافق هوه ف زى ابوتريكه ع فكره ابو تريكه ولا ابن خالتى ولا ابن اختى ولا اعرفه اصلا<br />اتقى الله ف كلامك<br />الحمد لله حققنا هدفنا ف سوسه واتعدلنا مع النجم الساحلى التونسى وان شاء الله نكسب ف القاهره<br />حظ سعيد لنجم الساحلى التونسى<br />ومستنينكم ف بلدكم التانيه مصر هتنورونا بس للاسف ان شاء الله الكاس للاهلى<br />الكاس للاهلى عشان انتم يانجم مش هتقدرو تسدو قدام فرق الفى كاس العالم للانديه باليابان<br />اخوكم نـادر المصـرى الاهلــوى<br />ان شاء الرحمن الكاس للاهلى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "لو لم اكن اهلاويه لوددت لان اكون اهلاويه"
author = "نيفين نيفى نوفا"
posted = "2007-11-01"
text = "مش عارفه ليه يا استاذ انا مصرى حاسه كده انك زملكاوى<br />اصل الجماعه الزملكاويه (و هما اشقاء و اخوه افاضل)بس يعنى زى ما تقول كده بيبقى لهم اسلوب معروف حبتين ف الكلام و اهم ما فى الموضوع انهم بيجادلو ف مسلمات<br />انت مثلا بتقول القديس ابو تريكه<br />حرام عليك<br />يعنى انت بتتكلم على محمد ابو تريكه<br />انا مش هدافع عنه بس هقوللك بالامانه انت مقتنع عن اللى بتقوله عنه<br />اصل معلش اسمحلى لو يعنى عايز تتكلم و خلاص عندك متعب<br />ده مثلا الكلام عنه ممكن يأدى الغرض بس متزودهاش ده متعب برده<br />اما النادى الاهلى كجماهيريه و اداره فهو اعلى من انى اتكلم عنه يا جماعه<br />دعواتكو ف مباراه النجم الجايه يا عشريناتيه<br />الاهلاويه بس<br />بلاش الزملكاويه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "واحدة بواحدة و الروح الرياضية هي الفائزة"
author = "أحمد الزياني"
posted = "2007-11-10"
text = "انا من مشجعي النادي الرياضي الصفاقسي وفرحت كثيرا بفوز النجم الرياضي الساحلي مثل ما فرح معضم الشعب التونسي ففي صفاقس رفعت الاعلام والاحتفالات بفوز النجم على عكس ما فعل بعض من مشجعي النجم عندما هزمنا السنة الفارطة و أقول مبروك للنجم الذي فعل ما لم ينجح فيه الصفاقسي و مبروك لتونس و للرياضة التونسية وحضا أوفر للأهلي اللذي نحترمه ونحترم الشعب المصري وأخيرا الكرة مدورة السنة الفارطة افتك الاهلي الانتصار من الصفاقسي وهاته السنة افتكها النجم من الاهلي . والسلام -أحمد الزياني - صفاقس -"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "أنا مصرى(ايوه كلمه حق)"
author = "اكتب اسمك هنا"
posted = "2007-11-11"
text = "اللى انا قلته فعلا كلمه حق و مش عن جهل و أنا كنت متوقع الهجوم ده عليا من الأول<br />الأساتذه اللى بيهاجمونى ربطو مصر بالنادى الأهلى كأن مفيش نادى تانى غيره فى مصر و كأن من الوطنيه ان تكون أهلاوى و لو أنت مش أهلاوى يبقى من مشجعى أسرائيل مثلا<br />ثانيا جوزيه فعلا صاحب أسوأأخلاق شهدتها الملاعب المصريه و لا الاساتذه اللى بيهاجمونى نسو أو تناسو يوم ما كان بيقلع هدومه على الهواء مباشرة و لا لما كان بيعمل أشارارت غير لائقه بأيده لحكم مباراه و محدش ساعتها حاسبه لا من ناديه و لا من الأتحاد و ده يثبت أن فعلا أن الأهلى له سلطه على قرارات أتحاد الكره<br />ثالثا لما لاعبي الأهلى كلهم رمز للوطنيه و الأنتماء ليه ما راحوش يلعبو مع المنتخب فى اليابان ولا هى الوطنيه جوه النادى بس<br />و أخيرا أحب أقول لكل اللى هاجمونى بلاش تعصبكم و تشجيعكم الشديد و حبكم لناديكم يعميكم عن الحقيقهو ياريت ما تخلطوش الأوراق ببعضها زى اللى بيخلط تشجيعه للأهلى بتشجيع مصر"
archived = "2010-03-14"
capture_url = ""

