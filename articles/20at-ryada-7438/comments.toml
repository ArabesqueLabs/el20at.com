subject = "الاهلي يفوز علي الزملك في دور8 بدوري ابطال افريقيا"
author = "محمد الاهلاوي"
posted = "2008-07-20"
text = "الاهلي سحق الزمالك كالعاده وانشاء الله هيفوز في العوده وشكرا للاخ احمد الزياني مشجع الصفاقسي واحب اقولك تاكد ان الاهلويه يشجعون الصفاقسى والترجي والاهلويه كانوا يشجعونكم في الكونفدراليه وبالتوفيق للاهلي والترجي واحب اقول ان انا كنت بتمني فوز الترجي علي الاهلي في تونس في دوري المجموعات لكى يصعدوا معا فبا لتوفيق واقول ان الصفاقسى كان يستحق بطوله افريقيا مع الاهلي فهو لعب بطوله رائعه وشكرا"
