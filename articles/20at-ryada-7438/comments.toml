order = 0
subject = "أنا مصرى"
author = "اكتب اسمك هنا"
posted = "2007-10-25"
text = "رغم أنى مصرى<br />إلا أنى أكره الأهلى المصرى جدا لغرور معظم لاعبيه و مدربهم صاحب أسوا أخلاق رياضيه شهدتها الملاعب المصريه<br />أكره أيضا النادى لأنه صاحب نفوذ على إتحاد الكره المصري لدرجه إصدار الكثير من القرارات السلبيه تجاه الأنديه الأخرى<br />حتى لاعبهم الأول أبوتريكه أو القديس أبوتريكه على سبيل السخريه عليه أكرهه جدا لأنه من هواة التمثيل أمام الحكام و الجمهور على أنه شخص ملتزم أخلاقيا و دينيا حتى تقول عنه الجماهير (هو فى أخلاق زي أبوتريكه)<br />على فكره أنا مش زملكاوى عشان أقول كده ولا بشجع أي نادي مصرى من الأساس بس حبيت اقول كلمة حق"
archived = "2010-03-14"
capture_url = ""

