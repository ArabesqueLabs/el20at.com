text = "وبعكس ارادة شركة موف وارادة المشاركين بالتصاميم والمنفذين لها دعيت الصحافة للافتتاح وكان عدد الصحافيون اكثر من عدد الحضور. وسمحت شركة ترب تيك ومعها شركة اكس بارتنر لهم بالتواجد اثناء العرض والتصوير ونشر الخبر كالنار بالهشيم وعرضة اجساد بنات فلسطين للعالم وكأن من وقف بالامس القريب يثأر الى اهله ووطنه وعرضه من الظلم بات يرضى بذلك ..لا تستغربوا من ذلك فمن هانت عليه 78% من فلسطين يهون عليه ما دونها والله المستعان<br />بامكانكم الاتصال بشركة موف في رام الله والاستيضاح"
