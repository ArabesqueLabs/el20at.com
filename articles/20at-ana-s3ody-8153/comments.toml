subject = "مصري"
author = "مسلم"
posted = "2008-01-30"
text = "والله اني لأشفق على منطقة الخليج العربي كلها بأن يأتي يوما تمحي فيه الهوية العربية لما فيها من هؤلاء البشر من جنسيات غير عربية - برغم أن المملكة العربية السعودية قد أفاقت قليلا لهذه المهزلة وبدأت تستغني عن العمالة الآسيوية عن مختلف باقى دول الخليج بعد مقتل أحد رجال الشرطة منذ حوالي اكثر من عامين بمنطقة الرياض<br />ولكن الآن الهوية العربية في هذه المنطقة أصبحت في خطر ونستطيع أن ترى هذا عند دخولك لأي متجر او اتصالات بينك وبين الأفراد هنا فقد أصبحت اللكنة التي يتحدثون بها غير عربية وبها من المصطلحات الغير مفهومة فهي ليست عربية ولكنها لكنات دخلت في العربية فشوهتها واصبح أهل الخليج يتحدثون بها الآن<br />آمل واتمنى على الله أن يهب الخليج العربي ويبعدوا هذه الجنسيات قبل فوات الآوان خوفا على وطني العربي من التوغل فيه، فعلينا كعرب جميعا نشر الوعي الوطني نشر التوعية بعدم استخدامهم او استقدامهم خاصة في البيوت العربية من الخادمات والطباخين الذين يكون لهم التأثير الأكبر على الأطفال<br />نأمل بوجود صرخة في دول الخليج من القائمين عليها لابعاد هذه الجنسيات التي تأخذنا للخلف - والله ولي التوفيق"
