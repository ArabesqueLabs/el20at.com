author = "عبدالرحمن البغدادي"
posted = "2007-11-03"
text = "اللي ظاهر دلوقتي هو المصري الخانع اللي لا بيهش ولا بينش ، لكن ده سكون ما قبل العاصفة فكل العلامات توحي بثورة شعبية يقيمها الجياع اللذين لم يعودوا قادرين على الصمت ( فإذا تكلمت المعدة ، سكت الجميع )"
