subject = "مشروع الحكومة لتخفيض الاسعار جاهز"
author = "لاظوغلى باشا"
posted = "2008-05-11"
text = "كيلوا اللحمة وصل خمسين جنية<br />المعى من بتوع القرية الذكية وضع خطة لترخيص اللحم بحيث كل واحد يقدر يشترى اللحمة<br />بدل البيع بالكيلوا هنبيع بالجرام<br />جرام اللحمة بنص جنية<br />يعنى تشترى عشرة جرام لحمة بخمسة جنية<br />امال اية<br />افكار ذكية<br />ابتسم فالبقرة بقت بتضحك"
archived = "2010-03-14"
