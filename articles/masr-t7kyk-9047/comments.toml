subject = "بهدله ببهدله يبقى بلدنا احسن"
author = "ابومحسن غربة 26 سنه"
posted = "2008-05-11"
text = "بالنسبة للست اخر واحدة<br />الصوت ما كنش واضح اوي بس انا سمعت اخر حاجه وهي بتقول بهدله ببهدله يبقى بلدنا احسن<br />والله صدقتي يا بنتي<br />غربة 26 سنه ولسه 26 سنه كمان علشان خاطر نعرف نرجع مصر"
archived = "2010-03-14"
