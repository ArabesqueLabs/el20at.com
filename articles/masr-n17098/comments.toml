[[comments]]
order = 10
subject = "رد وتصحيح"
author = "د/ محمد أبوجاد"
posted = "2008-11-12"
text = "السلام عليكم جميعا الأخ الدكتور نصر بيقترح العودة لنظام شيكات الدم<br />أشكره أولا على اهتمامه بالموضوع وأرجو أن يساهم معنا ليكون اهتمام جميع الناس حيث أن المسألة حاليا أن الاحتياج للدم يكون مسألة تخص المريض وأسرته فقط ومن يتطوع معه من محبى الخير للبحث عن فصيلة الدم ونحن نرجو أن ندرك جميعا أن توفير الدم مسئولية الجميع ولن يتوفر الدم لكل من يحتاجه إلا إذا بادر عدد معقول من القادرين على التبرع بالنسبة لموضوع الشيكات فقد تم ألغائه بعد اساءة استخدامه من قبل محترفى التبرع فبعد منع المقابل المادى لجأ بعضهم للتبرع للحصول على الشيك ثم المتاجرة به وابتزاز أهالى المرضى لبيعه لهم<br />بالنسبة للمتاجرة وبيع الدم بالمئات فمن يتيح الفرصة لهؤلاء التجار وسوقهم السوداء هو عدم توافر الدم فى المستشفيات الحكومية مما يضطر أهل المريض للبحث عنه فى كل مكان وبأى سعر فلماذا يا أخى لا نشجع التبرع التطوعى فى المراكز الحكومية الموثوقة مما يضرب هذه التجارة ويقضى عليها تماما ولا يزيد سعر وحدة الدم فى المراكز الحكومية عن 90 جنيه وهى كما تعلم أقل كثيرا من تكلفة الجمع والفحوصات والحفظ كما توفر مراكز خدمات نقل الدم القومية والمستشفيات الجامعية الدم للمرضى المصابين بالأمراض المزمنة بدون أن تكاليف (قرارات علاج على نفقة الدولة) لا يعنى ذلك أن كل شئ تمام والصورة وردية لكن أحنا محتاجين كل جهد وفكر لمواجهة المشكلة المزمنة<br />أما التصحيح بخصوص تعليق الأخ طبيب فأرجو يا أخى ألا تتسرع بنشر معلومات غير موثقة تربك الناس وتثير البلبلة فتنص توجيهات منظمة الصحة العالمية على أن فترة 3 شهور للرجال و4 شهور للسيدات هى الفترة الآمنة للتبرع بالدم الكامل ولا تؤثر صحيا على الشخص أطلاقا بل أن توصيات الرابطة الأمريكية لبنوك الدم تحدد 8 أسابيع كحد أدنى بين كل تبرع والآخر واعلم ياأخى أن الجسم يعوض الدم المتبرع به خلال مدة قليلة<br />• يبدأ تعويض سائل الدم (البلازما ) فور التبرع<br />• وخلال ساعات (24-36 ساعة) بعد التبرع يكتمل تعويض كمية الدم<br />• التبرع بالدم ينشط نخاع العظم لإنتاج كرات دم حمراء جديدة لتصل نسبتها الطبيعية خلال 3-6 أسابيع"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218144114/http://masr.20at.com:80/newArticle.php?sid=17098"
