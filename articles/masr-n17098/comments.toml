text = "مع ترحيبي بالتبرع بالدم ومع الفوائد الطبية التي تعود على المتبرع نفسه قبل أن ينقذ غيره ، لكن الفكرة التي يطرحها المقال يجب الحذر منها بعض الشيء<br />فالإسراف في التبرع خطر ، والفترة الملائمة ليست كما جاء في المقال 3 شهور للرجال و 4 للسيدات ، وإنما الأفضل أن تكون 6 شهور بين كل مرة والمرة اللاحقة<br />أتمنى أخذ هذه الملاحظة بالاعتبار<br />وشكرا"
