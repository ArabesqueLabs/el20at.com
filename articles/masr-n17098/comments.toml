order = 0
subject = "تبرع بدمك وأحيى الناس جميعا"
author = "د/ محمد محمود أبوجاد"
posted = "2008-08-04"
text = "عمرك حسيت إنك مخنوق مش عارف تتنفس, دايخ , عينيك مزغللة و دقات قلبك سريعة , مش مركز<br />ورجليك مش قادرة تشيلك ...........؟<br />طب تصدق إن فيه إنسان بيعيش بالعذاب ده وأكثر , يوم وأتنين وأحيانا أكثر من أسبوع ؟<br />عارف ليه ؟<br />لما يبقى مصاب بأنيميا مزمنة أو فشل كلوى ومعتمد على نقل الدم......... و يحتاج نقل الدم وفصيلته ماتكونش موجودة..<br />( وده بيحصل كتير خصوصا لو فصيلة دمه نادرة)<br />عمرك فكرت فى عذاب مريض النزف الوراثى(الهيموفيليا) لما مفاصله تورم بسبب النزيف الداخلى وميلاقيش مشتقات الدم عشان وقف النزيف ومع تكرار النزف بيصاب بتشوهات واعاقة كان ممكن تجنبها لو علاجه توفر فى الوقت المناسب........<br />جربت إن حد عزيزعليك يكون محتاج نقل دم عاجل وفصيلة دمه مش موجودة فى المستشفى ...... تخيل أهله بيتعذبوا قد أيه وهما شايفينه بين الحياة والموت<br />ومش قادرين يسعفوه ........... تخيل فى إنسان حياته فى خطر وانقاذه فى إيديك ؟؟؟؟<br />تعرف إن كل الحالات دى ممكن تخفف معاناتهم وتنقذ حياتهم فى نص ساعة من وقتك<br />أكتر من 20 ألف مريض بأنيميا وراثية مزمنة ( يعيشون على نقل الدم المنتظم كل أسبوعين – شهر مدى الحياة)<br />حوالى 8 ألاف مريض بسيولة الدم (الهيموفيليا) يحتاجون لنقل مشتقات الدم باستمرار<br />عشرات الآلاف من مرضى الفشل الكلوى والأورام ومصابى الحوادث<br />كلهم حياتهم فى خطر<br />كلهم منتظرين إنك تمد إيديك وتهبهم فرصة النجاة<br />انضم إلينا<br />فى شريان( برنامج التبرع المنتظم بالدم ) جارى حاليا اعادة انشاء موقع المشروع ويمكنك مراسلتنا مؤقتا أو<br />أرسل بياناتك وسيتم الاتصال بك للتبرع فى أقرب فرصة shoryan2@yahoo.com<br />0101624487"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002127/http://masr.20at.com:80/newArticle.php?sid=17098"

[[comments]]
order = 1
subject = "الدم ده بيروح فين؟"
author = "شريان العطاء"
posted = "2008-08-04"
text = "الدم بيروح للى محتاجه عشان ينقذ حياته أو يمنع حدوث مضاعفات خطيرة أو يخفف معاناة<br />ففى كل الأحوال لا يتم نقل الدم إلالمريض فى أشد الحاجة إليه<br />ولو عايز تتأكد بنفسك وتعرف المريض اللى هياخد دمك وكمان تتابع حالته وتتبرع لنفس المريض بانتظام شارك معانا<br />فى مصر عشرات الالاف من مرضى أمراض الدم المزمنة والأورام<br />فى مصر مئات الالاف من مرضى الفشل الكلوى والكبدى<br />فى مصر أعلى معدل للإصابة بفيروس سى فى العالم<br />فى مصر أعلى معدل لحوادث الطرق وما ينتج عنها من مصابين وضحايا<br />فى مصر من يحتاج للدم يعانى ويتعذب هو وذويه<br />يتعرض أهله للابتزاز والاستغلال<br />ويتعرض هو للمعاناة أو فقدان الحياة<br />إيدك فى إيدينا نغير كل ده<br />من أجل دم آمن لكل مصرى<br />من أجل دم كافى وفعال<br />لكل من يحتاجه<br />انضم إلينا<br />فى شريان( برنامج التبرع المنتظم بالدم ) جارى حاليا اعادة انشاء موقع المشروع ويمكنك مراسلتنا مؤقتا أو<br />أرسل بياناتك وسيتم الاتصال بك للتبرع فى أقرب فرصة shoryan2@yahoo.com<br />0101624487"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002127/http://masr.20at.com:80/newArticle.php?sid=17098"

[[comments]]
order = 2
subject = "أتبرع ليه؟"
author = "مصر شريان العطاء"
posted = "2008-08-04"
text = "• اتبرع عشان فيه ألاف بل ملايين المرضى والمصابين محتاجين لدمك<br />• و مفيش مصدر للدم غير المتبرعين ومفيش أى بديل للدم يمكن تصنيعه يعنى حياتهم فى ايدك<br />• تعرف إن فى مصر أكثر من 25 ألف مريض بأنيميا وراثية مزمنة بيحتاجوا نقل الدم مدى الحياة ده غير ملايين مرضى الفشل الكلوى والكبدى والأورام ومصابى الحوادث<br />• اتبرع بدمك عشان لما تحتاج أنت أو حد عزيز عليك(لا قدر الله – بعد الشر عليك ولكن كلنا معرضين ) تلاقى الدم ومتقولش هابقى اتبرع ساعتها لأن الحاجة للدم أحيانا تكون عاجلة ولازم يكون الدم موجود وجاهز للصرف يعنى غالبا مينفعش تتبرع ساعتها<br />• اتبرع عشان ده واجب دينى واجتماعى وربنا هايسألنا كلنا عن كل واحد بيموت أو بيعيش بيتعذب بسبب نقص الدم واحنا ماشاء الله ربنا رزقنا الصحة يعنى أبسط شكر لنعمة الصحة أننا نساعد بيها اللى اتحرموا منها<br />• يعنى عمرك فكرت فى طفل من عمر 6 شهور لازم يتنقل له دم كل أسبوعين عشان يعيش , فكرت فى عذاب أهله وهما شايفين أبنهم بالحالة دى وكمان عذابهم عشان يلاقوا الدم , فكرت الطفل ده لما يبدأ يكبر ويفهم حالته ويحس بالألم والمعاناة بسبب نقص الدم واحنا كلنا ماشاء الله عشرات الملايين من الأصحاء نقدر نساعده عشان يعيش ونخفف معاناته , صدقنى كل صرخة ألم وعذاب, كل احساس بالهبوط وسرعة النبضات والنفس كل ده محسوب علينا لأننا نقدر وربنا أعلم , تخيل أفكاره وهو عارف إن علاجه عندنا بس إحنا خايفين أو مكسلين تفتكر هايحس بأيه ؟ تفتكر ممكن يدعى ربنا يقول أيه ؟<br />اشمعنى أنا يعنى ؟ هى جت عليا انا؟ فيه ناس صحتها أحسن منى ؟<br />التبرع بالدم واجب على الكفاية على كل الناس يعنى بس مش كل الناس تنفع تتبرع<br />يعنى لازم يكون فيه شروط لاختيار المتبرع عشان سلامة اللى عايز يتبرع وسلامة المريض اللى محتاج للدم , يعنى اللى سنه أقل من 18 سنة أو أكتر من 60 مينفعش يتبرع<br />وكمان المصاب بأى مرض مزمن أو بياخد أى دوا بانتظام ده غير اللى جاله صفراء فيه أى وقت ( ماعدا صفراء حديثى الولادة) واللى كان عنده حمى روماتيزمية مينفعش يتبرع<br />ده غير إن فيه حاجات بسيطة لو عملناها لازم نأجل التبرع لفترة محددة زى عمل علاج أسنان أو أى عملية بسيطة وحاجات تانية كثير<br />يعنى ببساطة مش كل الناس ينفع تتبرع ولو أنت ماعندكش مانع صحى من التبرع<br />يبقى التبرع واجب عليك طالما أنت قادر صحيا"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002127/http://masr.20at.com:80/newArticle.php?sid=17098"

[[comments]]
order = 3
subject = "شروط التبرع بالدم في الدول الخليجية"
author = "ابومحسن غربة  27 سنه"
posted = "2008-08-05"
text = "بمناسبة التبرع بالدم عندنا هنا حملة تبرع بالدم بس المتبرع لازم يخضع للشروط ولازم يقرا شروط التبرع بالدم وهي كالآتي:<br />ـــــــــــــــــــــــــــــــــــ<br />ـ هل سبق وان اقمت علاقة جنسية مع اي شخص اخر خلال الاثني عشر شهرا الاخيرة مقابل اعطائه نقود او عقاقير؟<br />ـ هل سبق وان اقمت علاقة جنسية منذ عام 1977 مقابل حصولك على بدل نقدي او عقاقير؟ وهل سبق وان اقمت علاقة جنسية خلال الاثنى عشر شهرا الاخيرة مع اي شخص اخر تلقى نقودا او عقاقير مقابل اقامته لعلاقة جنسية<br />ـ هل استعملت ابرة، ولو مرة واحدة لاخذ عقاقير بدون وصفة طبية؟ وهل كان لك علاقة جنسية ولو مرة واحدة خلال الاثنى عشر شهرا الماضية مع اي شخص استعمل ابرة لاخذ عقاقير بدون وصفة طبية<br />ــ للذكور: هل سبق وان اقمت علاقة جنسية مع شخص اخر من نفس الجنس ولو لمرة واحدة منذ عام 1977<br />ـ للاناث: هل سبق وان اقمت علاقة جنسية مع ذكر كان قد اقام علاقة جنسية مع شخص اخر من نفس الجنس ولو لمرة واحدة منذ عام 1977<br />ـ هل سبق وان اعطيت ادوية عوامل تجلط الدم لوقف نزيف ـ مثل مرض الهيموفيليا؟ هل كان لك علاقة جنسية ولو لمرة واحدة خلال الاثنى عشر شهرا الماضية مع شخص فعل ذلك<br />، هل انت مصاب بمرض الايدز او كانت نتيجة الكشف عن فيروس الايدز ايجابية؟ هل كان لك علاقة جنسية ولو مرة واحدة خلال الاثنى عشر شهرا الماضية مع اي شخص مصاب بمرض الايدز او كانت نتيجة الكشف عن فيروس الايدز لديه ايجابية؟<br />ـ هل تتبرع بالدم بغرض الكشف عن مرض الايدز؟<br />ـ هل تعلم انه اذا كنت مصابا بفيروس مرض الايدز فانه يمكن ان ينتقل منك الى شخص اخر على الرغم من انك تشعر بصحة جيدة وان نتيجة فحص مرد الايدز لديك سلبية<br />هل تعلم انه يتم ابلاع دائرة الصحة في الدولة بجميع نتائج فحوص الكشف عن الايدز الايجابية المؤكدة؟<br />هل المعلومات التي قدمت لك حول التبرع بالدم واضحة ومفهومة وشاملة وهل تجيب على كافة تساؤلاتك بهذا الشأن؟<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />هذه هي شروط التبرع بالدم في الخليج فهل يعمل بهذا في مصر من اجل عدم نقل دم ملوث الى المرضى"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002127/http://masr.20at.com:80/newArticle.php?sid=17098"

[[comments]]
order = 4
subject = "فكره استثمارية مدهشة (ايه رايكم في دم الحمير)"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-08-05"
text = "زي ما المصريين بياكلوا لحم حمير وهما مش عارفين<br />ايه رايكم في دم الحمير<br />فكره مدهشة وحتكسبنا دهب يا جدعان<br />ناخد دم الحمير ونعبيه في ازايز دم ونبيعه واهو الشعب الاهبل اللي بياكل لحم الحمير ننقله دم حمير وما حدش شايف حاجه<br />مشروع زي دا حيكسبنا دهب يا جدعان<br />وحنبقى اغنى من احمد عز بتاع الحديد والواد بتاع مدينتي<br />ايه رأيكم اللي عايز يوصل ويبقى غني يتصل بينا على الفودافون اي خط حرد عليه"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002127/http://masr.20at.com:80/newArticle.php?sid=17098"

[[comments]]
order = 5
subject = "مهما اعترضت طريقك التفاهات فلا تتاثر فهناك عقول اس"
author = "محمد فرح"
posted = "2008-08-05"
text = "اولا احب التعليق عل من يذكر ان استمارة الاسئلة تذكر اي علاقة جنسية اولا نحن لسنا دولة خليجية ولا اظن ان دول الخليج تكثر من هذا السؤال كما تدعي وان كان هذا الؤال وارد احب ان اوضح لك ايها السيد المحترم ان هناك العديد من الامراض التي قد تنتقل عن طريق علاقات جنسية واذا كنت تجهل ان هناك ما يسمي بالفترة الشباكية التي لا تظهر فيها التحاليل الاصابة بالمرض رغم وجودة وهذا ما يتضح من كلامك فهذا ليس ما يعنينا جهلك بتلك الامور<br />والمحترم الاخر الذي يذكر دم الحمير ان كنت مصابا بجنون البقر او اي مرض وترتضي ان ينقل لك دم حمير فهذا لا يعني ان الشعب المصري جاهل كما تذكر واعلم انك وحدك من يرضي لنفسة هذا ان تاتي في موضوع عن التبرع بالدم وانقاذ حياة ووتحدث بكلمات ساخرة وتفاهات فهذا يرجع لك ولن يمسنا بشيء سوف يقال انسان تافة يتحدث بكلام تافة لا اكثر لا اريد الاطالة في تلويث قلمي للرد عل امثالك من التافهين ولكن اريد ان اوجة رسالة لكل امثالك التافهين الذين ملاهم الجهل نحن لن نضيف هذا الموضوع في هذا السايت المحترم لامثالك من ذوي العقول الحيوانية ولكن وضعناة لاناس يقدرون حياة الانسان ويحترمون الاخرين فابحث لك ايها التافة عن موضوع تافة مثلك تملاة بقذارتك التافهة"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002127/http://masr.20at.com:80/newArticle.php?sid=17098"

[[comments]]
order = 6
subject = "بقية الاسئلة الموجودة باستمارة التبرع بالدم في الخ"
author = "ابومحسن غربة 27 سنه"
posted = "2008-08-06"
text = "الاسئلة السابقة كانت في الوجه الاول فقط وبقية الاسئلة انقلها لكم<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />ـ هل سبق ان حاولت التبرع او تبرعت بالدم باسم مختلف (او اخر) او رقم شارة مختلف هنا او في اي مكان اخر؟<br />ـ هل تبرعت بالدم او البلازما او الصفيحات الدموية خلال الاسابيع الثمانية الماضية هنا او في اي مكان آخر.<br />ـ هل تم تأجيل تبرعك بالدم او رفضه او اعلمت بالا تتبرع لاي سبب من الاسباب؟<br />ـ هل تشعر اليوم بأنك في حالة صحية جيدة؟<br />ـ هل خضعت لعلاج من قبل طبيب او اصبت بمرض خطير او اجريت لك عملية جراحية خلال الاثنى عشر شهرا الماضية.<br />ـ هل سبق ان احسست بالم في الصدر او اصبت بمرض في القلب او مرض تنفسي شديد؟<br />ـ هل اصبت بالسرطان او بمرض في الدم او نزف؟<br />ـ هل اصبت باليرقان او مرض الكبد او التهاب الكبد الفيروسي او كانت نتيجة التهاب الكبد ايجابية؟<br />ـ هل اصبت بالملاريا او بمرض \\\"شاغاس\\\" او داء الباييزية؟<br />ـ هل سبق لك ان تناولت اتريتينيت تيجسون لمرض الصدفية؟<br />ـ هل تناولت اسيتريتين (سورياتين) لمرض الصدفية خلال السنوات الثلاث الماضية؟<br />ـ هل تناولت اسبرين او اي شيء يدخل الاسبرين في تركيبته خلال الست والثلاثين ساعة الماضية.<br />، هل تناولت (كيوتين) لحب الشباب او (بروسكار) بروييسها لالتهاب البروستات خلال الشهر الماضي.<br />ـ هل تناولت اي اقراص او ادوية خلال الاسابيع الاربعة الماضية.<br />ـ هل حقنت في اي وقت منذ عام 1980م بمصل انسولين بقري؟<br />ـ هل اخذت اي حقن او اي تطعيمات خلال الاسابيع الاربعة الماضية؟<br />ـ هل اخذت اي تطعيم ضد داء الكلب خلال الاثنى عشر 12 شهرا الماضية؟<br />ـ هل سافرت خارج الدولة خلال الاشهر الستة 6 الماضية؟<br />ـ هل سبق ان تناولت هرمون نمو مشتقا من نخامي بشرية؟<br />ـ هل اجريت لك عملية في الراس او الدماغ مع زرع رقعة من الام الجافية (غطاء الدماغ)<br />ـ هل اصبت انت او احد اقاربك قرابة عصب بمرض يدعى كرويتسلفدت ـ جاكوب (جنون البقر) او هل ابلغت ان عائلتك معرضة للاصابة بهذا المرض؟<br />ـ هل اختلطت بشكل مباشر مع شخص مصاب باليرقان او التهاب الكبد او اعطيت غلوبين مناعي للالتهاب الكبري (ب) خلال الاثنى عشر شهرا الماضية؟<br />ـ هل سبق لك ان اصبت باحدى هذه الامراض (السكري، قرحة المعدة، امراض جلدية، الصرع، النقرس، جلطة في المخ، السل)<br />، هل سبق لك خلال الثلاثة ايام الماضية ان قمت بعملية تنظيف او حشو في الاسنان او في جذر السن؟<br />ـ لغير المسلمون: هل تناولت مشروبات كحولية في الاثني عشر ساعة الاخيرة<br />ـ هل اجريت لك عملية نقل دم او زراعة عضو او نسيج خلال الاثني عشر شهرا الماضية؟<br />ـ هل اجريت لك عملية وشم او ثقب اذن او جلد او وخز بالابر او دخلت في جسمك ابرة بالصدفة او لامست دم شخص اخر خلال الاثني عشر 12 شهرا الماضية؟<br />ـ هل كانت نتيجة الكشف عن مرض الزهري ايجابية او هل عولجت من مرض الزهري او السيلان خلال الاثني عشر شهرا الماضية.<br />ـ هل سجنت خلال الاثني عشر شهرا الماضية؟<br />، وهل ولدت او سكنت او سافرت الى اية دولة افريقية منذ عام 1977.<br />ـ اذا كان الجواب نعم: هل اجريت لك عملية نقل دم او اية معالجة طبية اخرى بمنتج يدخل في الدم في تركيبته؟<br />ـ متى تناولت طعاما اخر مرة<br />ـ للاناث: هل حصل حمل في الستة الاسابيع الماضية او هل انت حامل الأن.<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />هذه هي بقية الاسئلة<br />وطبعا الخليجيين بياخذوا هذا الكلام من الغرب وخاصة بريطانيا"
archived = "2008-08-15"
