subject = "حل المشكلة من جذورها"
author = "د/نصرالدرديري"
posted = "2008-08-20"
text = "يمكن حل مشكلة النقص الحاد الموجود في بنوك الدم بتفعيل أمر بسيط تم منذ 22 عاما وتوقف وهو إعطاء المتبرع شيك بكمية الدم التي تبرع بها أي أنه يستطيع أن يحصل على كمية من الدم من أي بنك دم بالجمهورية عند إحتياجه (لا قدر الله)أو أحد أقاربه وهكذا لن يشعر المتبرع بأن دمه ذهب هباءً أو يتم المتاجرة به لأننا نسمع أن كيس الدم يصل سعره في بعض المستشفيات إلى المئات من الجنيهات لذا أتمنى أن تكون الدعوة الى التبرع بالدم تأخذ مأخذ جديد وهو (إدخار الدم ) أي أن المتبرع يدخر بعضا من دمه لوقت الحاجة وعندها لا يطالب بدفع أكثر من مصاريف حفظ الدم<br />أتمنى أن ينال هذا الإقتراح القبول ولا مانع من تجربته وأنا واثق من النتيجة إن شاء الله"
archived = "2008-08-20"
capture_url = "https://web.archive.org/web/20080820194649/http://masr.20at.com:80/newArticle.php?sid=17098"

