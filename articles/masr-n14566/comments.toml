subject = "الإصابة التي أجبرت اللاعب علي إجراء عملية جراحية ع"
author = "اكتب اسمك هنا"
posted = "2008-03-10"
text = "المانيا حته واحدة<br />طيب دي مصر متقدمة جدا في الطب وفيها طب القصر العيني باه معقوله مفيش استاذ في كليات الطب القاهرة وعين شمس واسكندرية وغيره وغيره كل كليات الطب دي كلها ولا طب المنصورة ولا ولا مفيش دكتور هناك حيعرف يعالج تمزق عضلة ابو تريكا باشا<br />ولاهي الفلوس كتير اوي وما لهاش اصحاب<br />وطبعا بقا حيطلع مع ابو تريكا باشا وفد كامل ما هو مش معقول حيسافر المانيا لوحده لازم وفد من النادي الاهلي يروح يتفسح في المانيا على حس ابو تريكا الدكتور بتاع النادي والاداري بتاع النادي والخدام بتاع النادي وبقية الشله الواطية بتاعة النادي اللي بتاكل فلوس الشعب<br />مسكين يا شعب يا اهبل"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234140/http://masr.20at.com:80/newArticle.php?sid=14566"
