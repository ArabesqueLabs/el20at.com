[[comments]]
order = 0
subject = "الصوفية دجل دينى - وهم بالاجماع خوارج عن دين الاسل"
author = "اكتب اسمك هنا"
posted = "2009-03-26"
text = "الصوفية فى مصر بدعة وخروج عن الدين<br />هؤلاء الجهلة بتوع الموالد والدراويش وحفلات الرقص والتنطيط الذى يسمونة ذكرا ويلتفون حول اناجر بعدها يلهطون الفول النابت والفتة - هؤلاء الجهلة نامل من الجماعات الدينية والشرعية ان تهديهم الى الطريق الصحيح ويتركون الشاذلى فى حالة وبقايا المشايخ الاولياء فى حالهم<br />ثم من افهم هؤلاء الجهلة فى السياسة<br />اظن ان ضابط امن دولة كتب لهم هذا الكلام وقرأة جاهل منهم<br />يا بتوع الفتة شوفوا الحقوا مولد سيدى العريان قبل ما تخلص الفتة يا شوية زعابيط"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327230405/http://masr.20at.com:80/newArticle.php?sid=20419"

[[comments]]
order = 1
subject = "مد دددددددددددددددددد"
author = "فهد"
posted = "2009-03-26"
text = "مدد يا سيدى مبارك مدد مدد يا الا بيت مبارك مدد هولاء لا يعرفون الا المدد من هولاء والصوفية الحقيقية براة منهم وفعلا هولاء بتوع دجل دينى ورقص وبتوع المولد هنروح المولد"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327230405/http://masr.20at.com:80/newArticle.php?sid=20419"

[[comments]]
order = 2
subject = "السر فى الفتة"
author = "بنت مصرية"
posted = "2009-03-26"
text = "لم يعد الا الدراويش كمان ياعينى عليك يامصر اتفق عليك دراويش الموالد مع دراويش الحزن الوطنى ووزعوا التركة بتوع الموالد يأكلوا الفتة ودراويش الوطنى يأكلوا البلد بحالها<br />اضراااااااااااااااااااااااااااااب"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327230405/http://masr.20at.com:80/newArticle.php?sid=20419"

[[comments]]
order = 3
subject = "الحزن الوطنى يستعين بمجاذيب الموالد لاجهاض الاضراب"
author = "الشيخ حزنبل"
posted = "2009-03-27"
text = "الحزن الوطنى يستغل الدين فى السياسة<br />اوعز الى المجاذيب بالاعتراض على الاضراب<br />بل ان المجاذيب قد دخلوا فى دور الافتاء والتحليل والتحريم<br />مش حاجة تضحك وتدل على افلاس فكرى وخوف من الاضراب الذى يكتسب شعبية بين جميع فئات الشعب المصرى"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327230405/http://masr.20at.com:80/newArticle.php?sid=20419"
