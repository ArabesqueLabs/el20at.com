[[comments]]
order = 0
subject = "خايف لاكون انا كمان اخوان"
text = "حتى أنت يا أبو تريكة طلعت إخوان .. أنا خايف لتكون مراتى هى كمان من الإخوان وعاملها لى مفاجأة .. ده مش بعيد أطلع كون أنا كمان إخوان وأنا معرفش"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717103441/http://masr.20at.com:80/newArticle.php?sid=10630"

[[comments]]
order = 1
subject = "بطلوا اشاعات قذرة ياعشرينات"
author = "عبد السلام الحامولى"
text = "مع الاسف انتم اتحولوا لموقع اشاعات صفراء بدون اى دليل والمطلوب الناس تفتح بقها زى الهبل وتستنكر<br />ربنا قادر ياخدكم اخد عزير مقتدر على البلبلة بتاعتكم دى وانا معندتش مصدق اى كلام من بتاعكم"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717103441/http://masr.20at.com:80/newArticle.php?sid=10630"

[[comments]]
order = 2
subject = "عايزين حوار مع تريكة"
author = "أهلاوى على طوووول"
text = "ياريت موقع عشرينات يعمل لنا حوار مع النجم الجميل محمد ابو تريكة بغضن قضية احتجازه فى امن الدولة او لا . نفسي اشوف حوار له فى عشرينات"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717103441/http://masr.20at.com:80/newArticle.php?sid=10630"

[[comments]]
order = 3
subject = "فيه ناس تانية انا متوقع تطلع اخوان"
author = "حمزة الحمزاوى"
text = "فيه ناس تانية انا متوقع تطلع اخوان .. لو البلد حكمها الاخوان .. كمال الشاذلى .. احمد عمر هاشم .. زكريا عزمى واللوا نبيل لوقا بباوى .. مصطفى بكرى .. عمرو اديب .. ابراهيم عيسى .. حنان ترك .. مى عز الدين بعد ما تتحجب \" وده مطلب جماهيرى بعد اغنية ايظن \" .. نادر السيد وياريت كام زملكاوى .. مننساش هادى خشبة ومن رجال الاعمال حيكون محمد فريد خميس .. ومن المطربين طبعا كل الناس اللى من عينة محمد الحلو و نادية مصطفى .. ودة كله مش مستبعد اذا كان بابا الفاتيكان اسلم وهو بيموت"
archived = "2007-07-17"
capture_url = "https://web.archive.org/web/20070717103441/http://masr.20at.com:80/newArticle.php?sid=10630"
