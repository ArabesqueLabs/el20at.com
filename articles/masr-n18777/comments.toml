subject = "عوضين وخيمر بقم سياح فى بلدهم - اة يا بلد مالهاش ك"
author = "عصفور"
posted = "2008-12-12"
text = "تم والحمد للة تفكيك شبكة النقل العام وبيع اتوبيساتها خردة فى وكالة البلح بحجة اصلاح الاقتصاد والخصخصة والبصبصة وانهاء دور الدولة فى البلد<br />فلم تعد هناك اتوبيسات تربط بين طنطا والزقازيق مثلا ولا بين الزقازيق والمحلة او المنصورة<br />كل شىء تم بيعة<br />باقى فقط فى موقف عبود بضع اتوبيسات هزيلة تربط بين القاهرة والمراكز والمحافظات ومحدودة العدد ومكتوب عليها شركة النقل السياحى<br />مخيمر رايح القاهرة يبقى يركب النقل السياحى وعوضين راكب الاتوبيس وراجع دكرنس يركب النقل السياحى<br />سياحى اية يا عالم يا ظلمة وكل اللى بيركبة فلاحين وصنايعية وطلبة<br />يمكن المصريين بقم سياح فى بلدهم<br />واجرة الاتوبيس دة زى اجرة التاكسى الخاص - البيجو او الميكروباص<br />وبالنسبة لسيارات الاجرة فمفيش ترخيصات لسيارات جديدة - بتوع الداخلية والمرور بيقولوا ان عدد سيارات الاجرة كتير قوى<br />والنتيجة زى ما شفنا فى العيد الاجرة ارتفعت من 8 جنية الى عشرين جنية<br />طبعا اصل وزير النقل عقبال الحبايب رجل اعمال فى لجنة السياسات وابن منصور شيفرولية<br />يبقى يشرب الشعب من المجارى"
archived = "2008-12-13"
capture_url = "https://web.archive.org/web/20081213183356/http://masr.20at.com:80/newArticle.php?sid=18777"
