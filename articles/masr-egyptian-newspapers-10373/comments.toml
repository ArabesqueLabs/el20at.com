order = 0
subject = "الحزن القومى العام"
author = "المصرى أفندى"
posted = "2008-11-01"
text = "أنا رأيلى أنه يتم تغيير أسم الحزب الوطنى الى الحزن المصرى العام لأنه من يوم ما ركب فوق بر مصر وأصبح كل شىء فى النازل. يعنى دول العالم الرابع أصبحت أحسن منا والكوارث ليس لها أول من أخر. أصبح شعب مصر حزين ودمعته على خده.فقد الناس أنتمائهم لهذا البلد ,اصبح هم الشباب هو الهجرة من البلد أنشا الله ألى قاع البحر .لا نعرف أين نهاية النفق. سيطر الحزن الواطى على كل السلطات من تنفيذية لتشريعية حتى القضاء وهاتك يافساد فى البلد. ضم الحزن ألى صفوفه كل الحرامية أو من يسمون أنفسهم رجال أعمال( بس أعمال غير شرعية) نهبوا أموال البنوك والأراضى وبتسهيل من شركائهم فى الحزب. وباعوا كل ما يمكن أن يباع والجديد أنهم بيستولوا على الأراضى والمزارع اللى الناس شقيت فيها بعد ماأحلوت فى عنيهم وبالبلدوزرات علشان مفيش وقت للقضايا والكلام الفارغ. ضربت جميع أنواع الأمراض الفتاكة فى أجساد الناس. التعليم أصبحت الناس بتعلم عيالها عن طريق المدرسين الخصوصيين اللى شفطوا ما تبقى فى جيوب الناس وأصبحت المدارس عبارة عن ديكورات. سياسة مفيش بيعملوا كل اللى عايزينه . البلد كلها واقفة على رجل لغاية ما يورث الننوس الكرسى بتاع بابا اللى ورثه من جدو الباشا.والناس بتعامل على أنها هى اللى عضت كلب الحكومة مش الكلب اللى عضها. المصيبة الكبرى أنهم عاملين مؤتمر وبيناقشوا خيببتهم وأل أيه أنجازاتهم. ومشغلين مجموعة من الأفاقين والكذابين والمنافقين علشان يقنعونا أن المريض بخير وأنه بدأ يتحرك وأصلا هو مات وشبع موت. وأن بلدنا لم ولن تتأثر بالأزمة العالمية (فى مثل بيقول أيش ياخد الريح م البلاط). ياعم طب أصبر وشوف أيه اللى حيجرالنا بكرة هى الأزمة خلصت خلاص ؟؟!! حسبنا الله ونعم الوكيل فيكم ياولاد الكلاب !!!"
