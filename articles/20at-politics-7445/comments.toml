subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-10-29"
text = "السلام عليكم ان تركيا لا تريد التدخل في شمال العراق لطرد حزب العمال الكردستاني لان هذا الحزب موجود منذ اكثر من ربع قرن وحاولت تركيا مرارا وتكرارا ولم تستطع التخلص منه وهذا حلم لن يتحقق لان الحزب يدافع عن شئ يؤمن به وهو نيل الحقوق القومية والسياسية والتاريخية للشعب الكردي اما تركيا فانها ليس لديها قضية لتدافع عنها لانها قوة محتلة ويجب ان تخرج من شمال كردستان كما يجب ان تخرج باقي الدول المحتلة من مناطق كردستان كايران وسوريا لان الشعب الكردي هو اكبر شعب في العالم بدون دولة والسلام"
