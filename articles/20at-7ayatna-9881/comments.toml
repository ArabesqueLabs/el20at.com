subject = "نسبه مبشره لحياه هانئه"
author = "سالي"
posted = "2008-08-16"
text = "السلام عليكم<br />كيفكم...في البدايه شكرا على هيك موضوع ...شي حلو انو النسبه كتير قليله وهالشي مبشر لصبايا فلسطين ...بس بتمنى يكون اساس هالنسبه قائمه على علاقات اسريه هانئه ..بدون نزعات وقلق اسري..وبتمنى هيك نسبه تشمل العالم العربي بأكمله وتريح الصبايا والشباب من نتائج الزواج السيئه وتبني حياه سعيده قائمه على اسس هادئه...<br />مع تحياتي ..\"سالي\".."
