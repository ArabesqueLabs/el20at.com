[[comments]]
order = 1
subject = "على راسي والله كل شباب فلسطين"
author = "ياااااااااااااااااااااسمين"
posted = "2008-08-16"
text = "هاااااااااااااي......كيفكن.......ميرسي كتير لالك يا رنا على هيدا الموضوع الي بيرفع الراس والله ........ النسب كتير حلوة وما في شي بخوف بس انا بقول انه اهم شي الواحد يحسبها منيح قبل ما ياخد هيك قرار مصيري لانه التفكير الجيد قبل الزواج بكون بصالح الطرفين ......... ولازم لو شو مصار بين الزوجين يحاول واحد فيهن يلطف الجو لانه طول ما الجو متوتر بينهن راح يلجأو للطلاق لانه انا عم شوف بهيدي الايام انه الشباب والبنات مو على قدر جيد انهن يتحملو مسؤوليه ويعتمدو على حالهن .....طبعا مو الكل بس في شباب وبنات عم ياخده الموضوع بلامبالاه ومفكرين الطلاق مجرد كلمة ليرجعو لبعض مع انه في كتير من الاحيان بيفترقو بسببها ....... وعلى كل حال الله يوفق الجميع وgood louk وهلا باااااااااااااااااااااااي"
archived = "2010-03-14"
capture_url = ""

