[[comments]]
order = 0
subject = "علي جمعة دا لما بشوفه بفتكر على طول اقباط المهجر"
text = "الراجل دا اول ما بشوفه بفتكر اقباط المهجر<br />ليه لاني اول ما قرأت الفتوى المشئومة بتاعته قرأتها في مواقعهم الله يخرب بيت ابوهم<br />لانهم ضالعين في الاساءة للاسلام بصفة عامة وللنبي محمد صلى الله عليه وسلم بصفة خاصة<br />يا ترى الراجل دا بيشتغل معاهم<br />كل شيء جايز"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023242/http://masr.20at.com:80/newArticle.php?sid=11932"

[[comments]]
order = 1
subject = "خطا من الأخ السابق التعبير بذلك اللفظ"
author = "دموع التوبة"
text = "لو سمحت اخى الكريم المعلق قبلى بمن تقصد هذا الكلام<br />بالدكتور / على جمعه<br />اخى ان وافقت حضرتكم فى انه اخطا جدلااا<br />فانه لم يخطا فى امور اخرى سد بها ثغرا كانت تاتى لنا رماح الضد منها<br />شكرااا جزيلااا"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023242/http://masr.20at.com:80/newArticle.php?sid=11932"

[[comments]]
order = 2
subject = "ESHMENAL ALI"
author = "MOHAMED AHMED A KAWY"
text = "MESH LEH EL DAGAH EL MOSARAH DE WE ESHMENA ALI GOMA WAL HOWA ASHANA MALHOSH DAHR ESHMENA EL BABA SHONADA BYETHADES FE KOL HAGA WE MAHADESH BEUOKOL KHALEK FE EL KANESA<br />WE AGABY<br />BALAD BETMOOT FE EL KOSAAAAAAAAAAAAAAAAAA"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023242/http://masr.20at.com:80/newArticle.php?sid=11932"

[[comments]]
order = 3
subject = "مفتى السلطة"
author = "الشيخ حزنبل"
text = "مشايخ السلطة والفتاوى الجاهزة لتبرير اى اخطاء او اى تمرير اى مشروع مشبوة ذكرنى بالقصة الشهيرة<br />ان احد الناس جاء احد المشايخ وقال لة يا سيدنا الشيخ لقد رأيت الكلب يبول على احد الجدران فما رايك ؟<br />قال الشيخ - يهدم فورا<br />فقال لة<br />ولكن الجدار جدارك يا مولانا<br />فضحك الشيخ وقال<br />قليل من الماء يطهرة<br />الحاكم يقول للمفتى طلع للناس فتوى غريبة تشغلهم عن الكلام فى السياسة والبطالة والفقر وبيع البنوك والشركات<br />فيخرج علينا بفتوى ارضاع الكبير وشرب البول لينشغل الناس ويجدوا موضوع يتكلموا فية<br />معظم الناس يلجأون الى المشايخ الثقة بعيد عن الموظفين ليشرحوا لهم امرا ما فى امور دينهم<br />اما مشايخ السلطة فلا احد يتبع كلامهم"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023242/http://masr.20at.com:80/newArticle.php?sid=11932"
