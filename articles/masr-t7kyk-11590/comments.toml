posted = "2009-03-25"
text = "بجد ابضن حاجه الراجل ده بجد ده الماده الخام للحيلنه والل مش فاهم حيلنه يعني ايه يعني رخاااااااااااااااامه وسماااااااااااااااجه جامده جدا وسلام يا بو حفيظه اضرب الشعب علي قفاه كمان يا خااااااااااااااايب"
archived = "2009-09-23"
