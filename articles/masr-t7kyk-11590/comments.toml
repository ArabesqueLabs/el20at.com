[[comments]]
order = 4
subject = "ضع عنوان التعليق"
author = "كلب أثر كلمة الحق وانصار الله"
posted = "2009-03-22"
text = "سيد ابو حفيظة بلاش دعاء البداية<br />دمك خفيف كتير<br />انا بقول ولو شو هالمذيع اللي حاطينه اصلع وبسيط جدا<br />مش عوايدهم<br />واذا بها نشرة فكاهية<br />انا بسمع نشرتك<br />حلوة الله يوفقك"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221237/http://www.20at.com:80/masr/t7kyk/11590.html"

