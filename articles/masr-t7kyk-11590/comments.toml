[[comments]]
order = 7
subject = "ميرسي ابو حفيظة"
author = "كلب أثر كلمة الحق وانصار الله"
posted = "2009-03-28"
text = "عن جد ميرسي بس يا حرام تامر حسني ليش هيك بتقول عليه مطرب الجير<br />والله بحسه طيب جدا<br />وكمان شاطر وحساس بأسلوبه وصوته حلو<br />يا رب يغفر لك ويهديك يا تامر آمين"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221237/http://www.20at.com:80/masr/t7kyk/11590.html"
