subject = "اضعف من ان يغير"
author = "سكسوكة الحلاق"
posted = "2008-11-07"
text = "مفيش احد يقدر يغير حاجة<br />فية وزراء بقى لهم فى الوزارة اكثر من عشرين سنة ومحدش يقدر يحركة زى فاروق حسنى وغيرة<br />مصر كلها مجمدة<br />داخل الفريزر<br />بيموتوا فيها<br />الفكر الجديد هو<br />يظل الوضع على ما هو علية<br />يظل الوضع على ما هو علية وعلى المتضررين ان يخبطوا راسهم فى اقرب طابور خبز او مركب تغرق على شواطىء اوروبا"
