[[comments]]
order = 0
subject = "هبط يهبط فهو هابط"
author = "واحد"
text = "الثقافة هى مناعة الجسم - هىالواقية من الامراض<br />اما الشعب المريض المنهزم فثقافتة منهزمة بلا مناعة ضد الامراض والفيروسات<br />انحدرنا وانحدرت اغانينا<br />الموسيقى اصبحت دربكة نغم واحد فى الاغانى وكانهم شوية عيال رايحيين يلموا دودة القطن ف5ى الغيط<br />زمان كنا نسمع الاغنية فنحفظ كلماتها من اول او تانى مرة<br />دلوقتى كل شوية بتنزل اغنية وما تفهمش منها حاجة<br />موسيقى مستوردة<br />وكلمات سوقية - وذوق منحدر<br />انة زمن الانحطاط"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004123/http://masr.20at.com:80/newArticle.php?sid=14401"

[[comments]]
order = 1
subject = "لية كل دة يادكتور"
author = "سيد قرارة"
text = "الدول المتقدمة فى العالم وغير المتقدمة لما بتحصل عندهم ظاهرة فنية غريبة يبتدو يدرسوا نفسيات الجمهور وسر انجذابهم ولما يبقى فية شريحة كبيرة تشجع الظاهرة يبتدى النقاد والاعلاميين كل واحديدلى بدلوة ودة بيجعل بعض الحكومات انهاتجمع وتوثق الظاهرة فيما لو تطورت واصبحت فن يفرض نفسة سواء كان غناء اومسرح اوقصة كانت او رواية من باب انة لية جمهورة اللى بيحبة وبيدعمة بشراء منتجاتة انما عندنا هنا الفن الشعبى بمصطلحاتة البسيطةوموسيقاة البلدى بيتحارب وبينعت بافظع الالفاظ يادكتور لومش عاجبك ماتسمعوش فية لية جمهورة اللى بيسمعوة ويسمعو الطرب الاصيل ام كلثوم وعبدالوهاب وحليم وكمان عمرودياب وانغام واصالة والروك اندرول وكلاسيك من بيتهوفن لموزارت تشيكوفسكى وباخ وبافاروتى دة مايمنعش انى اسمع للاستاذ احمد عدوية وحسن الاسمر وشعبان وسعدالصغير وريكو واى حد يعجبنى كلامة ولالحنة حاسمعة وعلى فكرة انا معظم دراستى برا مصر ومهندس نظم يعنى متقولش ان الفن دة للناس اللى مش متعلمة لانة فن للكل قابل للنقد بس مش قابل للتجريح والتهميش"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004123/http://masr.20at.com:80/newArticle.php?sid=14401"

[[comments]]
order = 2
subject = "الى الاخ اللي فوق واحد من الناس"
text = "انه زمن علامات يوم القيامه يا صاحبي<br />قال رسول الله صلى الله عليه وسلم : (( لاتقوم الساعة حتى تروا أمورا عظاما لم تكونوا ترونها ولا تحدثون بها أنفسكم ))"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004123/http://masr.20at.com:80/newArticle.php?sid=14401"

[[comments]]
order = 3
subject = "الاخ اللى فوق انت خرجت برا الموضوع"
author = "سيد قرارة"
text = "ماقال اللة وقال رسولة صلى اللة علية وسلم صحيح وانامسلم موحد بصلى واصوم وحجيت مرتين وعملت عمرة خمس مرات وبصلى بعض الفروض فى الجامع بس دة مايمنعش انة اعيش حياتى واستمتع بيها انا واسرتى بعيد عن التشدد يعنى خيرالامور الوسط"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004123/http://masr.20at.com:80/newArticle.php?sid=14401"

[[comments]]
