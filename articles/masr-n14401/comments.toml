subject = "م"
author = "م"
text = "والله الاغاني دي جميله جدا وعاجباني مالها يعنى مش تقليديه خالص"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004123/http://masr.20at.com:80/newArticle.php?sid=14401"
