posted = "2009-10-11"
text = "هههههه ربنا يشفيك يا بنى والله ،،،مريض نفسى،،، الجزائر بالرغم من التعصب اللى بينا بسسب الكورة امدت مصر بالسلاح فى حرب اكتوبر زى العراق والمغرب والسعودية وغيره<br />زى ما مصر امدت الثورة الجزائرية بالمال والسلاح وده كان من ضمن اسباب عداء فرنسا لمصر اللى أدى للعدوان الثلاثى بعد كده<br />ربنا يهدي امثالك من العيال التافهة والعبيطة"
archived = "2010-03-14"
