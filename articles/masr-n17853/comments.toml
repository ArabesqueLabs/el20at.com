text = "ردا على (الحقيقة): كلامك جميل. قد يكون أيمن مظلوم ولكنك دست على بيت الداء وهو المناصب المتعددة لواحد محظوظ وكأن البلد ليس فيها كفاءات أو عقمت. فى ناس كتير عندهم كفاءة ومش لازم ياسيدى يكون عندهم ميراث. أنت مش شايف أن كثرة المسئوليات والمناصب كتخليه مايقدرش يركز فى أعماله وبالتالى حيكون حواليه مساعدين وفيهم أكيد افاسدين وهنا هيكون الضرر عليه وعلى المنصب."
