[[comments]]
order = 4
subject = "(ما افتكرش انك(مصرى افندى) انت و اللة العظيم(صهيون"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-09"
text = "يا حقود<br />هو انا و العياذ باللة عملت لاهلك و لا ليك حاجة و العياذ باللة قبيحة كلها قلة ادب ؟<br />انت صهيونى و لكن انت (صهيونى و سخ)<br />يا ريت تكون محترم فى كلماتك و افعالك و تصرفاتك<br />أتفو على اهلك اللى معرفوش يربوك<br />لكن معلش الوسخ و سخ!!! اتفو اتفو اتفو"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 5
subject = "الحرامى(مدير مشروع القاهرة التاريخية)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-09"
text = "الى(مصرى افندى)<br />مقدر حقدك الاسود على<br />معلش انا مقدر ظروفك النفسية النهارة و الخزى و العار اللى لحق بكم و بالاسرة<br />و خاصة الشريفة العفيفة المامى بتاعتك؟<br />لا دى موش المامى بتاعتك؟؟<br />لا المامى بتاعتك دى بتاعتنا كلنا؟؟؟<br />ههههههههههههها هاااااااااااااااااااااااا هههههههههههههههههههههههها هااااااااااااااااااااااااااااااااااااا<br />معلش ان (مدير مشروع القاهرة التاريخية) الحرامى طلع أبوك جوز المامى بتاعتنا كلنااااااااااااااااااااااااااااااااااااااااااا؟!!!<br />و معلش يابن الحرامى المرتشى<br />ابن الوسخ لازم يطلع وسخ؟<br />ابن الحرامى لابد ان يكون وسخ<br />و ابن المامى برضة يطلع و سخ زيهاااا ؟<br />دى المامى بتاعتنا كلنا يا ابن الوسخة<br />معلش ما المامى بتاعتك طول عمرها و سخة علشان ما عرفتش تربيك او تربى ابوك الحرامى؟<br />ملحوظة:sad:انت الذى بدات بالسباب؟فتستحق الاهانة و السباب يابن الكلب يا قذر؟)<br />الادب فضل عن العلم!!!"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 6
subject = "سلومه الأقرع رجع تانى"
author = "المصرى أفندى"
posted = "2008-10-09"
text = "مش قلت لكم ياجماعة بكابورت خره وفتحوه... أنا كل قرفى من ألفاظ أهلك اللى لا تصلح أن تقال فى موقع محترم زى ده. على فكره أنا مش هشتم أمك ولا أبوك زى أنت ما عملت. عارف ليه لأنى مش من عينتك ومتربى أحسن منك. ياريت لو تنقى كلامك الوسخ قبل ما تكتبه أو زى ماقلت لك حل عن سمانا وغور بعيد.. وماتنساش وأنت غاير بعيد فى الخرابة اللى أنت جاى منها تبقى تهتف لسيدك اللى بيقبضك وتقول له وللننوس أبنه بالروح والدم يا لافاشكيرى..."
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 7
subject = "سفالة النصارى يجب ان يوضع لها حد"
author = "ابو مرقص"
posted = "2008-10-10"
text = "نشرت جريدة المصريون هذا الاسبوع<br />سلم المدون النصرانى هانى نظير عزيز نفسة لمركز شرطة نجع حمادى هذا النظير الف رواية اسمها ( تيس عزرائيل فى مكة ) المسيئة للرسول بعد هروب دام 3 ايام وسيتم محاكمتة بتهمة ازدراء الاديان وذلك انة فعل هذا الفعل بعد تلقية اموالا من خنازير المهجر<br />طبعا الصعايدة بتوع النجع مش هيسيبوة - ولما احست اسرتة بالجرم الذى فعلة المجرم هربت من القرية<br />والسؤال هو هنسيب الناس دى تتطاول علينا لغاية اية<br />الوحدة الوطنية واحترام الاخر وحرية الاقليات والمواطنة وكل الكلام الفارغ دة - تلك الاقلية الذليلة لا تقتنع بة<br />نحن لا نكرههم من فراغ<br />ولكن صبرنا بدأ ينفذ"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 8
subject = "مكانك يا زخارى فى موقع الاقباط متحدون وكل مواقع خن"
author = "انا"
posted = "2008-10-10"
text = "ارحم اعصابنا وغور فى ستين داهية<br />مش عايزين نشوف الاسماء الوسخة دى على الصبح<br />يا اخى بنشائم بيركبنا النحس لما نقرا الاسماء دى<br />غور فى داهية<br />قرفتنا<br />ربنا ياخدك بدرى بدرى انت وشنودة والوطنى والسياسات<br />ومصرانى وكمان من الوطنى - يلعن ابوك"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 9
subject = "(على قلوبكم و حتى قيام الساعة)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-10"
text = "الى الفتك المعلق(أنا)<br />معلش يا حمار ؟<br />احنا قاعدين على قلوبكم سواء شئتم ام ابيتم؟!!!<br />و نخن على (قلوبكم القذرة و حتلى قيام الساعة)<br />يلا روحوا اشربوا من مياة المجارى و كلوا من براز المجارى كمان<br />و بنا يكتر من امثالكم الوسخة كمان و كمان و كمان<br />قول انشاء اللة<br />و ربنا يخليك يا ننوس عين مامى؟<br />و على فكرة؟<br />(اية دخل الوطنى و السياسات)فى المناقشات اللى بيننا يا حمار؟<br />هم و العياذ باللى عملوا حاجة قبيحة؟!!!!!<br />و(نكحوا)الموزة الحلوة الملعب البلاعة (امك)؟<br />اللى المصريين و العرب و اليهود و لا مؤاخذة(شخوا)فيها؟<br />وكمان(تفوا عليها )؟؟؟؟؟<br />ربنا يوسعها عليك و على البلاعة المفتوحة دائما (المامى)بتاعتك يا ننوس عينهااااااااااااااااااااااااااااااااااااا؟<br />اتفو اتفو اتفو اتفو اتفو عليكم ايها الموتورين الحاقدين المعفنين!<br />هااااااااااااااااااااااااااااا هاااااااا هااااااااااااااااااااااااااااااااا<br />و اشربوا من المجارى<br />وولعوا من حقدكم<br />و برضة مليون الف طظظظ طظظظ طظظظظظظظظظظظظظظظظظظظظظ فى اللى خلفوكم<br />و شالوم شالوم شالوم"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 10
subject = "كرسى الاعتراف فى الكنيسة وبوس الواوا"
author = "مرقص ابو شخة"
posted = "2008-10-10"
text = "يا جرجس زخارى<br />كم مرة الست امك راحت وقعدت على كرسى الاعتراف والقسيس دنجل باس لها الواوا<br />ثم افدنا هل ابوكم بيبوس الواوا الصبح والا بالليل<br />وهل بيبوس الواوا على انفراد والا على الملىء<br />وهل لما بيبوس الواوا بتاع امك ما بيرجعش اللى فى بطنة - هذا الا اذا كان خنزير<br />وهل امك بتستخدم الموسى قبل بوس الواوا والا بتروح بعبلها"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 11
subject = "احنا اللي على قلبك و حتى قيام الساعة"
author = "سكرتير  مرقص عزيز لشؤون الماما"
posted = "2008-10-10"
text = "احنا اللي على قلبك و حتى قيام الساعة<br />الى الفتك المعلق ممدوح زكى زخارى جرجس_الاسكندرية-مصر<br />معلش يا حمار ؟<br />احنا اللي قاعدين على قلوبكم ايها الاقباط سواء شئتم ام ابيتم؟!!! قاعدين في مصر المسلمه 94% مسلمين<br />و نحن على (قلوبكم القذرة و حتلى قيام الساعة) ايها الاقباط<br />يلا روحوا اشربوا من مياة المجارى و كلوا من براز المجارى كمان اللي موجودة في امريكا وسويسرا<br />و بنا يكتر من امثالكم الوسخة كمان و كمان و كمان ايها الاقباط متحدون<br />قول انشاء اللة<br />و ربنا يخليك يا ننوس عين مامى اللي بتروح عند مرقص عزيز<br />و على فكرة؟<br />(الوطنى و السياسات) دول مسلمين زينا يا حمار<br />هم و العياذ بالله عملوا حاجة قبيحة؟!!!!!<br />و(نكحوا)الموزة الحلوة الملعب البلاعة (امك) اللي بتروح تغفر عند مرقص عزيز اللي بيركب عليها<br />اللى المصريين و العرب و اليهود والامريكان و لا مؤاخذة(شخوا)فيها؟<br />وكمان(تفوا عليها )؟؟؟؟؟<br />ربنا يوسعها عليك و على البلاعة المفتوحة دائما (المامى)بتاعتك يا ننوس عينها اللي بتروح تغفر عند مرقص عزيز بتاع اسكندرية هااااااااااااااااااااااااااا هاااااااااااااااااااااااااااا هااااااااااااااااااااااااااااااااا<br />اتفو اتفو اتفو اتفو اتفو عليكم ايها الموتورين الحاقدين المعفنين الاقباط او الاعباط<br />هااااااااااااااااااااااااااااا هاااااااا هااااااااااااااااااااااااااااااااا<br />و اشربوا من المجارى اللي في سويسرا وامريكا وكندا<br />وولعوا من حقدكم على الاسلام والمسلمين والفاتح الاسلامي وعمرو بن العاص<br />و برضة مليون الف طظظظ طظظظ طظظظظظظظظظظظظظظظظظظظظظ فى اللى خلفوكم يا اقباط الداخل<br />موتو بغيظكم خلاص عمرو بن العاص فتح مصر واللي كان كان وعدد المسلمين 94%<br />و شالوم شالوم شالوم عليك يا يهودي يا ابن الوسخة"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 12
subject = "هاااااااااااااااااااا  هاااااااااااااااااااااااااا"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-10"
text = "مكنتش عارف انكم عبط للدرجة دى<br />طيب يا جدعان و رجالة كدةو الحمد للة لسانكم طويل و بتقولو انكم (رجال 9<br />طيب ما تورونى هتعملو اية فى اسرائيل اللى محتلة بيت المقدس ؟و بتخرب فية حتة حتة و انتم زى النسوان و اقفين تتفرجوا و تنوحوا علية؟<br />فين هى الشهامة و الرجولة و الاسلمة اللى بتقول انكم فعلا 94% من تعداد مصر؟<br />وا تروحوا تعملوا رجالة و تحرروا المسجد الاقصى الاول من اليهود اولا؟<br />و بعدين تحرروا فلسطين من اليهود اللى بتقولوا انهم اغتصبوها ؟ زى امك ما اغتصبيت بمزاجها و رضاها بالضبط؟!!!<br />و بعدين تعالوا و ورونا شطارتكم ازاى هتقدروا تتغلبوا علينا زى ما بتقولوا كدة؟<br />انتم بتوع (كلام كلام كلام)<br />و شجب و استنكار و تظاهر ليس الالالالالالالالالالالالالالالالالالا<br />فرق كبير نين الاسلام الحق و المتاسلمين بالكلام و قلة الادب؟(امثالكم) اللى المسيحية معقداكم جدا منها؟!!!<br />(هى المسيحية عملالكم عقدة موش هتفوا منها الا فى الاخرة انشاء اللة)<br />و رسولكم الكريم قال علانية فى حديث صريح:_<br />(من زم زميا فقد زمنى)!!!!!!!!!!!!!!!!!!؟<br />و اكثر اللة من امثالكم الاغبياء و شفى الكلاب و العقارب من سمومكم<br />القوة و الكثرة ليست بالعدد؟<br />القوة فى الايمان و العلم و المال و الحق؟!<br />(و كم من فئة قليلة غلبت فئة كثيرة 94% بازن اللة)<br />اين فلسطين؟<br />و اين العراق؟<br />و اين انتم ايها المتاسلمين؟<br />ربنا شفاكم من الحقد و الغل و السم و الجهل الذى يسرى فى عقولكم و دمائكم و نفوسكم الرخيصة؟<br />ربنا يشفى العقارب امثالكم<br />و شلمولى على القدس و فلسطينو العراق؟!!!اعظم (شالوم)<br />(و الشالوم عليكم و رحمة اللة و بركاتة)"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
