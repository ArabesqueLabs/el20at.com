text = "إلى الحقيقة المزيفة :: زمان ملئتوا الدنيا نباح بأن نجسكم أمل عبدالمنعم مظلوم و أن العبرة في حكم القضاء هذا كلامكم و الآن بعد أن أتى القضاء بما لا تشتهيه أنفسكم أصبح قضاء مرتشي و محاميكم الألعبان (محامي عزام عزام الجاسوس و محامي سفاح سوزان تميم) أصبح مرجعية لكم. ألا تستحون و تتوارون عن الأنظار أم البجاحة وصلت إلى هذا الحد في تزييف الحقائق الدامغة. خد عندك أيها الكذاب أمل عبدالمنعم لم يحصل على تقدير جيد جدا في الليسانس و هذه حقيقة و ارجع لكلية الآثار ... كذبكم في ثراء والده و تقديم محاميه الألعبان مستندات مزيفة تحققت منها المحكمة بإرسال لجنة تقصى حقائق إلى مركز السنبلاوين (الشهر العقاري ، و السجل العيني ، مصلحة الضرائب ، المرور) و كشف عن المستور في جريمة أخرى و هي تهريب عدد من سيارات النقل من مصلحة الجمارك لنفوذ غندركم و وزيره و تم ترخبصها في مرور دكرنس على الرغم أن بالسنبلاوين إدارة مرور خاصة بها. أما عن والده الذي توفاه الله و هو غاضب عن إبنه و علاقته الشاذة بالوزير الشاذ عندما أبلغه أبنه أنه مسافر إلى إيطاليا للكشف على ركبتيه ، و أراد الأب أن يتكشف حقيقة هذا المرض المفاجئ و إن كان سببه ما يسمعه ممن حوليه عن علاقة محرمة قائمة بين إبنه أمل و وزيره (وزير الثقافة) و أشهد الله أنه برئ منه إن كانت هذه العلاقة قائمة... نأتي الأن إلى قيمة الرشوة المذكورة و نتعامل معها بطرقيتكم الجهنمية و المقارنة بين هذه القيمة و القيمة الأصلية لحجم التعاملات و التي تصل إلى مئات بل ألوف الملايين و هل من المعقول أن يضحى بالمجد الذي كان ينتظره من أجل فتات، نقول لا أيها الشياطين لأن ما تم رصده كان على مدار ثلاثة أشهر فقط قبل القبض عليه عندما وشي به أحدهم لكن الحصيلة الحقيقية هي ما ذكرته أنت و أدعيتم أنه ميراث و ملايين أخرى أدعيتم أنها راتبه و حوافز إلخ من عطايا وزيره الفاسق... في النهاية هذا جزاء طريق اللواط لمن لا يعتبر ، اللهم لك ألف حمد و شكر ياعادل با قهار."
