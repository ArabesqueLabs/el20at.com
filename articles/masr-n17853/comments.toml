text = "لا اعلم من اين ابدأ ولكن دعونا ننظر بعين ثاقبة ولا ننظر للأمور من شكل الحكم<br />على ايمن عبد المنعم<br />دعونا نقارن بين قضية ايمن عبد المنعم والقضايا الاخرى الكبرى وانتم تعلمون هذه القضايا وهى كثير والتى أخذت براءات كلها ونحن نعلم بالفعل انهم مدانين<br />ولكن فى قضية ايمن عبد المنعم اسمحوا لى بالتحليل واانا اطلب من اصحاب العقول ان ينظروا اليها برؤية وبتحليل عقلى<br />اولا ايمن عبد المنعم ( قبل دخوله الى وزارة الثقافه) من اسرة كبيرة وميسورة الحال والتاريخ يثبت ذلك ويشهد على ذلك ابوه رحمة الله من قبل ان يولد ايمن عبد المنعم يملك من الاراضى كثير واسس شركة للنقل من زمن بعيد وبدايتهم كانت فى نقل المواد البترولية بالعربات النقل من شركات البترول وتوزيعها والى اصبح لهم اسهم فى بعض شركات البترول وبدأت نشاطاتهم تزيد وتجارتهم تربح واسهمهم تربح والثروه فى تزايد وهم اربع اخوان<br />هذا جانب<br />وتخرج ايمن عبد المنعم من كلية الاثار سنه 89 وبتقدير جيد جدا<br />وايمن عبد المنعم من الذين تربوا فى الريف ونشأوا فيه ويملكون صفات اهل القريه والى ان التحق بالاثار وانتقل للقاهرة<br />ايمن بالفعل والله العظيم كان فى عدم الحاجه الى شغل او وظيفة لوجود الثروه والتجارة وشركة النقل والتى كانوا يديرونها وتدر عليهم مالا وفيرا<br />ولكن نصيب ايمن عبد المنعم ان يلتحق بالعمل فى وزارة الثقافه ليكون هذا قدره<br />الى لاحظة الوزير فى احد فى احد الزيارات لمتحف معين وشاهد هذا الشاب وهو شعلة من النشاط والتميز ويدون ملاحظات الوزير فى مفكره كى تنفذ<br />وبالفعل راى الوزير أن ايمن عبد المنعم يستحق ان ينتقل الى مكتبة والتحق بالعمل فى مكتب الوزير والى اثبت نفسة فى كل ماكنا ينسب له من اعمال ومن نجاحات<br />ايمن بالفعل كان عصب الوزارة وشعلة من النشاط والحيويه<br />مناصب اايمن عبد المنعم كانت مدير مكتب الوزير للاثار<br />المشرف على صندوق التنمية الثقافية ومدير متحف الحضاره والمشرف على مشروع القاهره التاريخيه<br />اربعة مناصب بالاضافة الى منحة درجة وكيل وزارة<br />نظرة على مشروع القاهرة التاريخية قام ايمن عبد المنعم بفتح مجالات عمل واحياء قصور واماكن اثريه كانت مهجوره واعاد توظيفها واعطى لها الحياه<br />ومن مساجد ومن ومن مشاريع بالفعل ضخمة<br />للأسف ايمن ظلم وحكم بالفعل ظالم ظالم<br />صندوق التنمية الثقافية اشرف ايمن عبد المنعم على صندوق التنمية الثقافية وهو مخروب لايوجد به ميزانية اداره اداره حكيمه وانجازات كثيره فى وقت قليل<br />شهد لايمن عبد المنعم الكثير من الذين يعرفونه على المستوى الشخصى والعملى بمستقبله الباهر وبمجهوده العظيم ( وماذا لو قلت لكم بأن منظمة اليونسكو تشكر ايمن عبد المنعم فى كثير من الاحيان وكتابيا وبشهادات تقدير لانجازاته )<br />ايمن المحبوب من قبل وزير الثقافه<br />ايمن كان له شخصيه صارمة وحازمة فى العمل وعين لا ترضى بالعمل السىء<br />ايمن الذى فى بعض المشاريع كان يعمل بيده والتى كانت تفتتح من قبل القيادة السياسيه<br />ايمن بالفعل كان شديد جدا على المقاولين ولايرضى باستلام شىء غير مطابق للمواصفات<br />فى ظل تدرج ايمن وصغر سنه فى الكثير من المناصب حسده الكثير وحقد علية كبراء وزارة الثقافه<br />ورجال قدامى امثال كثير وكثير<br />كان حقا يكره ايمن الكثير من البشر ظنا منهم بأنه متكبر ومغرور ولكن على العكس كل من كان يملك شخصيه حديديه واداره حازمه يكرهه الموظفون والعمال الذين لايعطوا الشغل المناسب<br />ايمن عبد المنعم تربص له الكثير من الحاقدين والحاسدين<br />بالعقل تعاولوا نحسب ماكان يتحصل علية ايمن عبد المنعم من مال فى العام مايقارب المليون جنية لمناصبه المتعدده ومكافأته وسفرياته التابعه للوزارة واليونسكو والمهرجانات ومكافأتها<br />الى جانب ميراثه ونصيبه مع اخوانه والتى قدرت ثروته الى مايقارب 100 مليون جنيه<br />ترددت الاشاعات حينما قالوا ان الوزير ذاهب الى اليونسكو وقالوا ان ايمن هو الوزير القادم لوازرة الثقافه وحينما سألوا الوزير من الذى ترشحه لخلافة وزارة الثقافه قال ايمن عبد المنعم وكتبها بخط يده<br />ومن هنا كانت النهاية لايمن وانقلبت الدنيا فى الوسط السياسى والثقافى كيف يصبح هذا الشاب وزيرا للثقافه وهى من الوزارات الهامه<br />كيف وهو شريف وحازم فى التعامل ايمن خساره حقيقيه والله العظيم<br />اطلب من المحللين ان ينظروا الى القضيه بعين تحليليه ويفتشوا فى تاريخ ايمن وماذا فعل ويزورا اهله ويسمعوا لهم<br />كيف لايمن عبد المنعم ان يصل الى كل هذه المناصب وكيف وهو اليد اليمنى لوزير الثقافه ايمن عبد المنعم هو وزارة الثقافه<br />حقا تفتقد الوزارة لقيادات شرفاء وقيادات حازمه فى العمل<br />خسارة يا مصر<br />تعالوا نحسب ونشوف كام لجنه مسكت عمل ايمن عبد المنعم ولم تفلح فى الاشراف على مشروع القاهرة التاريخية اكثر من لجنه واكثر من شخص وبأعداد كثير<br />كيف يكون شخص واحد يدير هذا الكيان ولا يقدر علية مجموعه يقال انهم خبراء فى ادارة مشروع القاهرة التاريخية اكثر من عشرون شخص للقاهرة التاريخيه<br />وفى الاشراف كذلك على متحف الحضاره اكثر من شخص والعمل يسير ببطء شديد<br />وايضا صندوق التنمية الثقافية والذى اشرف علية احمد مجاهد ولم يفلح فى ادارته فذهب لمنصب اعلى وهو رئيس الهيئه العامه لقصور الثقافه لماذا لعدم وجود قيادات عجبى عليك يا وزير الثقافه ضيعت ايمن عبد المنعم بالثقه الزائده والمناصب الكثيره وكرهت فية الكثير من الناس والقيادات الوزارة<br />وعجبى عليك هتخرب الوزاره لعدم وجود قيادات قادره على ادرة المناصب<br />والاخر حسن الجندى والذى يشرف حاليا على صندوق التنمية الثقافية لبعض الوقت وابحثوا فى جريدة الوفد وهى تنشر حقائق من داخل الصندوق خلال الشهر الماضى وبعنوان صندوق التنمية الثقافية الى الهاويه وعلى اربع اجزاء<br />ليكن مايكون<br />كيف لشخص تردد انه سيصبح وزيرا للثقافه يضيع نفسه وهو اذكى مايكون من ذلك<br />كان يملك عقلا مميزا وواعى ايمن لم يقفز ببراشوط على الوزارة ولكن بدا من الصفر ولكن انجازاته هى التى اعطت ثقة الوزير فيه وكرهت الكثير فية<br />تعالوا نفكر هل يعقل ان تكون هذه هي الرشوه لرجل فى مثل هذه المناصب<br />وايضا مقارنة بالمشروعات التى التكلفه الاجماليه لها بالملايين من الجنيهات تكون الرشوه سجاد واجهزة تكييف و200 الف جنيه<br />مشروع قيمته 20 مليون جنيه تكون رشوته كام ؟ ده فرضا ان لايمن يد فى ارساء العطاءات<br />ولكن من يقرأ قانون العطاءات والمناقصات يعلم انها بلجان فتح مضاريف فنية ولجان فتح مظاريف مالية وبت ويدرسوا اقل العطاءات سعرا وافضلهم فنيا<br />ولا تدخل اطلاقا لايمن عبد المنعم فى هذا<br />ايقنا الان ان التهمه ماهى الى مجرد ابعاد ايمن عن الوزارة وقطع يد الوزير<br />لانه كان الوحيد المرشح الاول من وزارة الثقافه لادارة هذا الكيان<br />الان اصبح من الممكن ان يأتى جمال مبارك بالوزير القادم لوزارة الثقافه ويقال انه دكتور من لجنة الساسيات وصديق لجمال مبارك اصبحت الان الوزارة خالية لاى شخص يأتى من الخارج لقيادتها وياريت .على الاقل ينظف مكتب الوزير من العقارب والعواجيز اللى فية اللى خربين البلد بجد<br />طيب ايمن كان بيعمر ويرمم ويحى الاماكن<br />عينى عليكى يابلدى اللى بيعمل كده بيكون مصيره كده والحبس<br />واللى فعلا بحق فاسد وبيخرب فى البلد وبيسرق بيكون حاله فوق<br />نظرة الى الحكم والذى يقول انه تربع اعلى المناصب وباع منصبه مقابل فتات<br />مقارنة مناصب ايمن عبد المنعم لو حد مكانه هيبيع منصبه باجهزة تكييف وسجاد و200 الف جنيه لمشروع مثلا تصل قيمته 30 مليون جنيه<br />فتات فتات لو حد مكانه هيبه منصبه ده بكام<br />الفساد طال القضاء الفساد طال اقضاء<br />عندما قرا فريد الديب القضية طلب ان يكون لوحده فى القضيه لانه تأكد من براءة ايمن عبد المنعم لو كان فريد الديب تأكد من ان ايمن قد تلقى رشوى وانه محبوس محبوس كان قبل بالقضية<br />اعتقد انها سوف تكون ضربه قاتله لفريد الديب قبل ان تكون ضربه لايمن عبد المنعم<br />وانتهت القضيه والبلد بايظه بايظه<br />انظروا للوزراء القادمون ستعلمون ان اغلبهم من لجنة السياسات واصدقاء جمال بيك وداكترة جامعه<br />وشكرا"
