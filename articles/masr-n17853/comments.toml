subject = "الحمد للة (مدير مشروع القاهرة التاريخية) مطلعش منن"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-10"
text = "الحمد للة ان الحرامى المرتشى (مدير مشروع القاهرة التاريخية)؟!!!!!<br />مطلعش مننا<br />و الحمد للة!<br />ربنا خزلكم دة طلع و الحمد للة كثيرا(واحد منكم ياللى بتقولوا انكم 94%)<br />انا عرفت مصر لية اتخربت و بتتسرق من مين؟<br />اسفى و مليون (أخص أخص أخص)<br />معلش احنا بنتكلم؟ (مع الاعتذار للقرموطى) والعب!!!"
archived = "2008-10-12"
