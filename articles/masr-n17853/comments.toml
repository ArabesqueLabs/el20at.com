subject = "هاااااااااااااااااااا هااااااااااااااااااااااااااا"
author = "الانبا ويصا"
posted = "2008-10-11"
text = "مكنتش عارف ان الارتودكس عبط للدرجة دى<br />طيب يا جدعان و رجالة كدة و الحمد للة لسانكم طويل و بتقولو انكم (رجال )<br />طيب ما تورونى يا اقباط هتعملو اية فى العرب اللى محتلة مصر من 1400 سنه بتخرب فية حتة حتة و انتم يا اقباط زى النسوان و اقفين تتفرجوا و تنوحوا علية؟<br />فين هى الشهامة و الرجولة و المسيحين اللى بتقول انكم فعلا اصحاب مصر وان مصر قبطية<br />ما تروحوا تعملوا رجالة و تحرروا مصر من العرب الغزاه<br />و بعدين تحرروا فلسطين اللي عاش فيها المسيح ومريم من اليهود اللي المفروض هي مهبط الديانة المسيحيةوارض مقدمه لان المسيح عاش فيها<br />و بعدين تعالوا و ورونا شطارتكم ازاى هتقدروا تتغلبوا على العرب زى ما بتقولوا كدة؟<br />انتم يا اقباط بتوع (كلام كلام كلام)<br />و شجب و استنكار و تظاهر في امريكا وسويسرا وكندت ليس الالالالالالالالالالالالالالالالالالا<br />فرق كبير نين المسيحية الحقه و المتأقبطين بالكلام و قلة الادب؟(امثالكم) اللى الاسلام معقدكم جدا منها؟!!!<br />(هو الاسلام عاملكم عقدة موش هتفوقوا منها الا فى الاخرة انشاء اللة)<br />و المسيح عليه السلام قال علانية فى القران<br />ومبشرا برسول يأتي من بعدي اسمه احمد<br />و اكثر اللة من امثالكم الاغبياء ايها الاقباط متحدون و شفى الكلاب و العقارب من سمومكم<br />القوة ليست بأمريكا والغرب<br />القوة فى الايمان و العلم و المال و الحق؟!<br />(و كم من فئة قليلة غلبت فئة كثيرة بازن اللة) عمر بن العاص جاء بستة الاف جندي وهزم في مصر 40 الف جندي روماني<br />اين الفرس<br />و اين الروم<br />و اين انتم ايها المتأقبطين<br />ربنا شفاكم ايها الاقباط متحدون من الحقد و الغل و السم و الجهل الذى يسرى فى عقولكم و دمائكم و نفوسكم الرخيصة؟<br />ربنا يشفى العقارب امثالكم<br />و شلمولى على المسيحيين الذين ضاعوا في القدس و فلسطين و العراق؟!!!اعظم (شالوم)<br />(و الشالوم عليكم و رحمة اللة و بركاتة)"
