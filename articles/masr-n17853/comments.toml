text = "كونة من كفر الروك ؟ وكون ابوة كان فى حرب 73 واية يعنى - كل بيت فى مصر فى 73 كان فية شاب او اتنين فى الحرب<br />وكونة عندة عربيتين ارياف مكسرين هيبقى غنى<br />معروف اصل اصحاب العربيات النقل اصلهم سواقين وعتالين واخلاقهم زى اخلاق العربجية واسوأ<br />وبيرحوا يدفعوا فى العربية الف جنية والباقى بالتقسيط على كذا شهر<br />يعنى حرامى ابن حرامى واصلة واطى"
