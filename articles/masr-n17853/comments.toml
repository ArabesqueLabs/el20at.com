text = "ماهى مؤهلات رجل خريج 89 ليصبح وكيل وزارة فى اقل من 12 سنة<br />هل نقول المستور ؟<br />هل كان يمارس دور الذكر مع وزيرة الشاذ ؟<br />ثم ان اسرتة لم تمتلك المال الا بعد ان وصل هذا الفاسد الى قلب هذا الوزير الشاذ عار الحكومة المصرية وبعد ان لهط الرشاوى واسس الشركات الوهمية باسم اقربائة ليسند اليهم مناقصات وزارة يتمتع فيها بالقرب من الوزير الشاذ<br />ارحموا عقولنا وبلاش نفتش فى سيرة الناس المعفنة"
