[[comments]]
order = 15
subject = "الى زخارى جرجس وكل مصرانى حقير"
author = "مرقص ابو شخة"
posted = "2008-10-10"
text = "القدس اللى بتعايرنا بيها وبتفتخر باليهود قرايبك احتلها الصليبيون 200 سنة وعملوا من المسجد الاقصى مربط للخيول او زريبة للخيول بتاعتهم - وبعدين هزمنا كل اوروبا الصليبية بقيادة ريشارد قلب الاسد وحررنا القدس بواسطة صلاح الدين الايوبى<br />واظنك بتتابع الانهيار المالى فى امريكا بعد غزو العراق وعارف ان بوش بيتخيط هو وجيشة هناك<br />والعراق هزم امريكا ومطلع عين امها وامريكا بتاعتك دى لم تستطع حماية النصارى فى العراق وكلهم طردوا برة العراق والامريكان هناك فى العراق لم يستطيعوا حماية النصارى العراقيون<br />اما فى العراق فمش امريكا بس فى العراق 22 دولة صليبية طلع عين امهم<br />احنا مش مستعجلين يا زخارى<br />الاسلام لا ينهزم ابدا<br />الاسلام تخصصة تدمير الامبراطوريات - الرومان والفرس قديما وحديثا تم تدمير الامبراطورية الروسية بعد غزو افغانستان<br />وقريبا جدا ستسمع تدمير امريكا بعد غزوها العراق<br />الموضوع موضوع وقت<br />والنصر للاسلام"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

