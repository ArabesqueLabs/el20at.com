subject = "(ممدوح زكى زخارى جرجس_الاسكندرية-مصر)"
author = "مسلم متدين فرحان جدا جدا جدا"
posted = "2008-10-10"
text = "بشرى يا مسلمين<br />المحاور(ممدوح زكى زخارى جرجس_الاسكندرية-مصر)<br />قتل فى حادث سيارة بقرب قرية(الجونة) بمحافظة (البحر الاحمر )<br />فى طريقة الى (الغردقة) لقضاء اجازة (عيد الفطر المبارك)!<br />و تم دفنة بمدينة (القدس الشريف)بدولة (فلسطين المحتلة) بناء على و صيتة؟<br />لذا و جب لفت الانظار و لاجل العلم اليقينى!!!"
