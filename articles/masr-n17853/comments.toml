subject = "قلنا ميت مرة ان الاقباط ليسوا مصريين اطلاقا"
author = "بشاى بلبن ابن نخلة من غير بلح"
posted = "2008-10-11"
text = "انتم هتصدقوا الخرافات بتاعتهم<br />سيدنا موسى لما خرج باليهود من مصر - مش كل اليهود راحوا معاة - فية يهود كانوا مرضى وفية يهود مش بيأمنوا بية وفية يهود عجبهم القعدة فى مصر - هؤلاء هم اجداد من يسمون نفسهم اقباط واللى اتى مرقص ينصرهم بناءا على حديث ليسوع بيقول فية انة ارسل فقط لهداية خراف بنى اسرائيل الضالة<br />الجزء التانى من الارثوذكس هم بقايا الجالية الرومانية الكبيرة التى حكمت مصر 7 قرون وكانوا موزعين فى اسكندرية والفيوم وميت دمسيس والاماكن اللى راح عمرو يحاربهم فيها داخل مصر<br />هؤلاء هم اجداد الارثوذكس الكلاب بقايا الديانة الوثنية ازيس الام التى حولوها الى مريم والاب ازوريس اللى حولوة للروح القدس اما الابن حورس فحولوة ليسوع<br />اناس بقايا وثنية قديمة<br />حتى بابا روما لا يعترف بارثوذكس مصر<br />فرجاءا لا تسموهم اقباطا<br />انهم ارثوذكس قذرة"
archived = "2008-10-12"
