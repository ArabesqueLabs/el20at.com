order = 0
subject = "احد اتباع (الوزير)اياة؟!!!"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-09"
text = "توجد مادة فى القانون(مسئولية التابع عن تابعة)<br />ليحاكم و يسجن وزير(الخيابة)اياة؟!!!<br />انة راس الفساد<br />و اتباعة المرئوسين هم ازناب الفساد!!!<br />هذة حقا وزارة(فساد)و ليست باى شكل من الاشكال وزارة(ثقافة)؟<br />لعنك اللة يا(روقة)يا ننوس عين ماما<br />حقا تستحق ان تكون وزيرا (للفساد) عن جدارة و استحقاق و احتقار بالطبع؟!!!"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

[[comments]]
order = 1
subject = "وماذا عن كبيرهم الذى علمهم السحر  ؟ هما مش كانوا ب"
author = "ابو السعود"
posted = "2008-10-09"
text = "القضية تدل على الانحدار الاخلاقى للحكومة - وضعف الكبير الى درجة انة لا يستطيع تغيير وزير فاحت منها رائحة العفونة فى وزارة اتهم اثنين من وكلاء الوزير بالرشوة عيانا جهارا<br />لو كان عند هذا الوزير نقطة دم او ذرة حياء لاستقال وغار فى ستين داهية<br />ام رئيس الوزراء فكفى على الخبر ماجور<br />ورئيس الدولة مش هنا او ربما لا يدرى بما يدور فى الدولة وفى دوواوين الحكومة من فساد ورشوة ونهب<br />انا مش عارف مين فى البلد دى اللى فى ايدة القرار"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042847/http://masr.20at.com:80/newArticle.php?sid=17853"

