[[comments]]
order = 1
subject = "الخصخصة وتاثيرها على الفلاحين وبقية الشعب من وجهة"
author = "فلاح مصرى مش فنان"
posted = "2008-11-20"
text = "انا هتكلم عن مصنع قطاع عام كانوا بيقولوا علية بيخسر فى مفهومهم الغبى<br />مصانع الاسمدة الكيماوية<br />زمان عبد الناصر بعد بناء السد العالى بنى شوية مصانع اسمدة كيماوية لتعويض الارض المصرية نقص الطمى وكانت بتبيع انتاجها فى الجمعية الزراعية بسعر التكلفة - يعنى لا خسارة ولا مكسب ما هو كلة للشعب وفى الشعب حسب السياسة وقتها<br />كانت شيكارة السماد الكيماوى بتنباع فى الجمعية الزراعية ب 3 جنية وكان الفلاح بيبيع كيلوا البصل ب 3 قروش وفى احسن الظروف 5 قروش<br />ثم فى عصر الرئيس المؤمن السادات رفع سعر شيكارة السماد الكيماوى الى 7 جنية فارتفع سعر كيلو البصل الى 10 قروش<br />ثم مع عصر مبارك زاد سعر السماد وارتفع سعر كيلو البصل الى 25 قرش<br />ومع ظهور لجنة السياسات وضرورة تحقيق المصانع ارباح وتصدر انتاجها الى الخارج فالوضع الان كالتالى<br />سعر شيكارة الاسمدة الكيماوية 130 جنية -- هكذا رفعوا الاسعار ليزيد ارباح القطاع العام حتى يمكن بيعة وحتى تزيد التنمية 7 % بدون عمل شىء<br />سعر شيكارة الاسمدة 130 جنية<br />وبالتالى<br />كيلو البصل ب 100 قرش<br />كيلو البدنجان ب 100 قرش<br />كيلو الطماطم ب 400 قرش<br />كيلو الفول 700 قرش<br />كيلو العدس 1300 قرش<br />اى ان الاسعار ارتفعت على المستهلك بطريقة فظيعة علشان مصنع واحد يكسب بالاضافة الى ارتفاع اسعار الوقود وانا لا اتحدث عن اسعار النقل حيث ان تلك الاسعار هى الاسعار داخل القرية قبل النقل<br />اذن العملية مش قطاع خاص بيخسر<br />ولا فشل فى الادارة<br />ولكن كان للمصانع دور اجتماعى هو الحفاظ على اسعار فى معقولة لدى الناس<br />لا يمكن ان يكون الفلاح راضى وسعر الكرنبة 6 جنيهات بعد ان كانت نصف جنية<br />والفاصوليا الخضراء خمسة جنيهات وكانت ب 30 قرش<br />المشكلة انهم نسوا دور المصانع فى خدمة كل الشعب واولهم الناس الغلابة<br />والنتيجة زى ما احنا عايشين"
archived = "2010-03-14"
capture_url = ""

