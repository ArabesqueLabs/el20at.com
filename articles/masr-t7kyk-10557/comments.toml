text = "خليك مع الكداب لغاية باب الدار<br />ولكن الكلام دا كان المفروض يكون من الاول ان اي شركة حيبعوها كان المفروض يعرضوها على المصريين الاول والعرب<br />مايرحوش يبيعوها لليهود والنصارى والهندوس اللي بيعبدوا البقر"
