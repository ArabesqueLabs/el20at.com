[[comments]]
order = 4
subject = "أقرؤوها حتى النهاية ومن لم يتأثر بشيء عليه مراجعة"
author = "مش رضوى حسن ولا مروة صلاح"
posted = "2008-09-15"
text = "أقرؤوها حتى النهاية ومن لم يتأثر بشيء عليه مراجعة نفسه<br />لو سمحت أقرأها كاملة<br />صلى الله عليه و سلم ، وبعدها نزل قول الله عز وجل وفاة الرسول قبل كانت حجة الوداع<br />( اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الاسلام دينا (<br />فبكي أبو بكر الصديق عند سماعه هذه الآيه.. فقالوا له ما يبكيك يا أبو بكر أنها آية مثل كل آيه نزلت على الرسول صلى الله عليه و سلم .. فقال : هذا نعي رسول الله صلى الله عليه و سلم .<br />وعاد الرسول صلى الله عليه و سلم.. وقبل الوفاه بـ 9 أيام نزلت آخر ايه من القرآن<br />( واتقوا يوما ترجعون فيه الي الله ثم توفي كل نفس ما كسبت وهم لا يظلمون( .<br />وبدأ الوجع يظهر علي الرسول صلى الله عليه و سلم فقال : ) أريد أن أزور شهداء أحد ) فذهب الي شهداء أحد ووقف علي قبور الشهداء وقال :<br />( السلام عليكم يا شهداء أحد، أنتم السابقون وإنا إنشاء الله بكم لاحقون، وإني إنشاء الله بكم لاحق (.<br />وأثناء رجوعه من الزيارة بكى رسول الله صلى الله عليه و سلم قالوا ما يبكيك يا رسول الله ؟ قال<br />( لا أنتم أصحابي، أما إخواني فقوم يأتون من بعدي يؤمنون بي ولم يروني ( .<br />اللهم أنا نسالك أن نكون منهم<br />وعاد الرسول صلى الله عليه و سلم ، وقبل الوفاه بـ 3 أيام بدأ الوجع يشتد عليه وكان في بيت السيده ميمونه ، فقال: ( اجمعوا زوجاتي ) ، فجمعت الزوجات ، فقال النبي صلى الله عليه و سلم:<br />( أتأذنون لي أن أمرض في بيت عائشه ؟ ) فقلن: أذن لك يا رسول الله فأراد أن يقوم فما استطاع فجاء علي بن أبي طالب والفضل بن العباس فحملا النبي صلى الله عليه و سلم<br />وخرجوا به من حجرة السيده ميمونه الي حجرة السيدة عائشة فرآه الصحابة علي هذا الحال لأول مره .. فيبدأ الصحابه في السؤال بهلع:<br />ماذا أحل برسول الله.. ماذا أحل برسول الله. فتجمع الناس في المسجد وامتلأ وتزاحم الناس عليه.<br />فبدأ العرق يتصبب من النبي صلى الله عليه و سلم بغزاره، فقالت السيدة عائشة : لم أر في حياتي أحد يتصبب عرقا بهذا الشكل . فتقول: كنت آخذ بيد النبي وأمسح بها وجهه، لأن يد النبي أكرم وأطيب من يدي. وتقول : فأسمعه يقول :sad: لا اله إلا الله ، إن للموت لسكرات ). فتقول السيده عائشه : فكثر اللغط ( أي الحديث ) في<br />المسجد اشفاقا علي الرسول صلى الله عليه و سلم فقال النبي صلى الله عليه و سلم :sad: ماهذا ؟ ) . فقالوا : يارسول الله ، يخافون عليك فقال : ( احملوني إليهم ) . فأراد أن يقوم فما استطاع ،<br />فصبوا عليه 7 قرب من الماء حتي يفيق . فحمل النبي صلى الله عليه و سلم وصعد إلي المنبر.. آخر خطبه لرسول الله صلى الله عليه و سلم و آخر كلمات له فقال النبي صلى الله عليه و سلم: ( أيها الناس، كأنكم تخافون علي ) فقالوا : نعم يارسول الله . فقال :<br />( أيها الناس، موعدكم معي ليس الدنيا، موعدكم معي عند الحوض..<br />والله لكأني أنظر اليه من مقامي هذا. أيها الناس، والله ما الفقر أخشي عليكم، ولكني أخشي عليكم الدنيا أن تنافسوها كما تنافسها الذين من قبلكم، فتهلككم كما أهلكتهم ) .<br />ثم قال صلى الله عليه و سلم :sad: أيها الناس ، الله الله في الصلاه ، الله الله في الصلاه ) بمعني أستحلفكم بالله العظيم أن تحافظوا علي الصلاه ، وظل يرددها ، ثم قال :<br />( أيها الناس، اتقوا الله في النساء، اتقوا الله في النساء، اوصيكم بالنساء خيرا )<br />ثم قال :sad: أيها الناس إن عبدا خيره الله بين الدنيا وبين ما عند الله ، فاختار ما عند الله ) فلم يفهم أحد قصده من هذه الجمله ، وكان يقصد نفسه ، سيدنا أبوبكر هو<br />الوحيد الذي فهم هذه الجمله ، فانفجر بالبكاء وعلي نحيبه ، ووقف وقاطع النبي صلى الله عليه و سلم وقال : فديناك بآبائنا ، فديناك بأمهاتنا ، فديناك بأولادنا ، فديناك بأزواجنا ،<br />فديناك بأموالنا ، وظل يرددها ..<br />فنظر الناس إلي أبو بكر ، كيف يقاطع النبي صلى الله عليه و سلم.. فأخذ النبي صلى الله عليه و سلم يدافع عن أبو بكر قائلا :sad: أيها الناس ، دعوا أبوبكر ، فما منكم من أحد كان له عندنا من<br />فضل إلا كافأناه به ، إلا أبوبكر لم أستطع مكافأته ، فتركت مكافأته إلي الله عز وجل ، كل الأبواب إلي المسجد تسد إلا باب أبوبكر لا يسد أبدا )<br />وأخيرا قبل نزوله من المنبر .. بدأ الرسول صلى الله عليه و سلم بالدعاء للمسلمين قبل الوفاه كآخر دعوات لهم ، فقال :<br />( أوآكم الله ، حفظكم الله ، نصركم الله ، ثبتكم الله ، أيدكم الله ) .. وآخر كلمه قالها ، آخر كلمه موجهه للأمه من علي منبره قبل نزوله ، قال :<br />( أيها الناس ، أقرأوا مني السلام كل من تبعني من أمتي إلي يوم القيامه ) .<br />وحمل مرة أخرى إلي بيته. وهو هناك دخل عليه عبد الرحمن بن أبي بكر وفي يده سواك، فظل النبي صلى الله عليه و سلم ينظر الي السواك ولكنه لم يستطيع ان يطلبه من شدة مرضه. ففهمت السيده عائشه من نظرة النبي صلى الله عليه و سلم ، فأخذت السواك من عبد الرحمن ووضعته في فم النبي صلى الله عليه و سلم ، فلم يستطع أن يستاك به، فأخذته من النبي صلى الله عليه و سلم وجعلت تلينه بفمها وردته للنبي صلى الله عليه و سلم مره أخري حتى يكون طريا عليه فقالت : كان آخر شئ دخل جوف النبي صلى الله عليه و سلم هو ريقي ، فكان من فضل الله علي أن جمع بين ريقي وريق النبي صلى الله عليه و سلم قبل أن يموت .<br />تقول السيده عائشه : ثم دخلت فاطمه بنت النبي صلى الله عليه و سلم ، فلما دخلت بكت ، لأن النبي صلى الله عليه و سلم لم يستطع القيام ، لأنه كان يقبلها بين عينيها كلما جاءت إليه .. فقال النبي صلى الله عليه و سلم:<br />( ادنو مني يا فاطمه ) فحدثها النبي صلى الله عليه و سلم في أذنها ، فبكت أكثر . فلما بكت قال لها النبي صلى الله عليه و سلم:sad: أدنو مني يا فاطمه ) فحدثها مره أخري في<br />اذنها ، فضحكت ..... ( بعد وفاته سئلت ماذا قال لك النبي صلى الله عليه و سلم ، فقالت : قال لي في المره الأولي :sad: يا فاطمه ، إني ميت الليله ) فبكيت ، فلما وجدني أبكي<br />قال :sad: يا فاطمه ، أنتي أول أهلي لحاقا بي ) فضحكت .<br />تقول السيده عائشه : ثم قال النبي صلى الله عليه و سلم :sad: أخرجوا من عندي في البيت ) وقال :<br />( ادنو مني يا عائشه )<br />فنام النبي صلى الله عليه و سلم علي صدر زوجته ، ويرفع يده للسماء ويقول :<br />( بل الرفيق الأعلي، بل الرفيق الأعلي ) .. تقول السيده عائشه: فعرفت أنه يخير.<br />دخل سيدنا جبريل علي النبي صلى الله عليه و سلم وقال : يارسول الله ، ملك الموت بالباب ، يستأذن أن يدخل عليك ، وما استأذن علي أحد من قبلك فقال النبي صلى الله عليه و سلم :sad: ائذن له يا جبريل )<br />فدخل ملك الموت علي النبي صلى الله عليه و سلم وقال : السلام عليك يا رسول الله ، أرسلني الله أخيرك ، بين البقاء في الدنيا وبين أن تلحق بالله فقال النبي صلى الله عليه و سلم :<br />( بل الرفيق الأعلى ، بل الرفيق الأعلى )<br />ووقف ملك الموت عند رأس النبي صلى الله عليه و سلم وقال : أيتها الروح الطيبه ، روح محمد بن عبد الله ، أخرجي إلي رضا من الله و رضوان ورب راض غير غضبان ...<br />تقول السيده عائشه: فسقطت يد النبي صلى الله عليه و سلم وثقلت رأسه في صدري ، فعرفت أنه قد مات ... فلم أدري ما أفعل ، فما كان مني غير أن خرجت من حجرتي<br />وفتحت بابي الذي يطل علي الرجال في المسجد وأقول مات رسول الله ، مات رسول الله . تقول: فانفجر المسجد بالبكاء. فهذا علي بن أبي طالب أقعد، وهذا عثمان بن عفان كالصبي يؤخذ بيده يمني ويسري وهذا عمر بن الخطاب يرفع سيفه ويقول من قال أنه قد مات قطعت رأسه، إنه ذهب للقاء ربه كما ذهب موسي للقاء ربه وسيعود ويقتل من قال أنه قد مات. أما أثبت الناس فكان أبوبكر الصديق رضي الله عنه دخل علي النبي صلى الله عليه و سلم واحتضنه وقال :<br />وآآآ خليلاه ، وآآآصفياه ، وآآآ حبيباه ، وآآآ نبياه . وقبل النبي صلى الله عليه و سلم وقال: طبت حيا وطبت ميتا يا رسول الله.<br />ثم خرج يقول : من كان يعبد محمد فإن محمدا قد مات ، ومن كان يعبد الله فإن الله حي لا يموت ... ويسقط السيف من يد عمر بن الخطاب، يقول: فعرفت أنه قد مات... ويقول: فخرجت أجري أبحث عن مكان أجلس فيه وحدي لأبكي وحدي....<br />ودفن النبي صلى الله عليه و سلم والسيده فاطمه تقول : أطابت أنفسكم أن تحثوا التراب علي وجه النبي ... ووقفت تنعي النبي صلى الله عليه و سلم وتقول:<br />يا أبتاه ، أجاب ربا دعاه ، يا أبتاه ، جنة الفردوس مأواه ، يا أبتاه ، الي جبريل ننعاه .<br />ترى، هل ستترك حياتك كما هي بعد وصايا رسول الله صلى الله عليه وسلم لك في آخر كلمات له ؟؟<br />لا أدري ماذا ستفعل كي تصبر على ابتلاءات الدنيا..<br />رجاء من فضلك وليس امرا<br />ارسلها لغيرك فان الدال على الخير كفاعلة"
