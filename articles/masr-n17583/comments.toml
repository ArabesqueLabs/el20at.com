[[comments]]
order = 5
subject = "سرقوا الامل من عيون الولاد"
author = "ممبار"
posted = "2008-09-15"
text = "الشاب بيجد ويجتهد علشان لما يخلص دراسة يلاقى وظيفة قطاع خاص او قطاع عام ويبنى مستقبلة ويحلم بالعروسة والشقة والزفة وبكيانة كانسان<br />البنت بتحلم بية يكون لها عريس وتبقى من غير مريلة ولا كراريس<br />الاب بيحلم لاطفالة بمدرسة نظيفة ذات مستوى تعليمى ذى بقية الدول من غير دروس ولا دفع اتاوات ولا غيرة<br />الشخص العادى بيحلم انة يتعامل الشرطة معاة كانسان ولة احترامة وكيانة<br />بيحلم ان مرتبة يسترة ويستر اسرتة لاخر الشهر<br />انما مفيش اى بصيص للامل<br />لما المواطن يحس ان البلد دى مش بتاعتة وانة مالوش فيها اى حاجة ولا اى لزمة<br />لما يحس ان البلد وقعت فى ايدين شوية رجال اعمال وهم مش رجال اعمال دول عبارة عن شوية سماسرة عقارات<br />لما يقرا ان واحد زى هشام مصطفى سمسار العقارات بياخد متر الارض من الدولة بعشرين جنية ويبيعة ب 9000 جنية علشان لة قرابة مع الحكومة<br />يبقى اية<br />لما يشوف محاكم عسكرية لشرفاء زى الدكتور الشاطر وبراءة للى موت 3 الاف مصرى تحت اعماق البحر<br />لما يشوف براءة صاحب اكياس الدم الملوثة واعتقال 18 الف مصرى فى المعتقلات بدون اى محاكمة<br />لما يشوف تزوير الانتخابات عينى عينك ومصورة على فيديو على اليوتيوب ومفيش اى رد فعل من الحكومة<br />يبقى مفيش اى امل<br />والناس امام حارة سد او حيطة مقفولة<br />تبقى تسمع الدعاء علية وعلى اولادة ان ربنا يخسف بيهم الارض1 بعد صلاة التراويح ومن الحجاج والمعتمرين حول الكعبة<br />تبقى انت امام ظاهرة عجز الناس وقهر الرجال<br />وانتظار الحل من عند السميع القدير<br />ربنا ارفع عنا العذاب انا مؤمنون<br />اللهم ارفع مقتك وغضبك عنا<br />وولى امورنا خيارنا ولا تولى امورنا شرارنا<br />اللهم اخسف بهم الارض"
archived = "2010-03-14"
capture_url = ""
