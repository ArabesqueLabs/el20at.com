subject = "لفى البلاد يا صبية بلد بلد - باركى الولاد يا صبية"
author = "مسرور السياف"
posted = "2008-09-14"
text = "الفرحة تغمر القطر المصرى من اقصاة الى ادناة<br />والناس فى الشوارع بتهلل وتكبر<br />والناس محتارة ازاى تصرف وتاكل فى شنطة رمضان بتاع الوطنى<br />والبنوك بتفتح فترة مسائية علشان الناس بتوع العشوائيات والقرى يعرفوا يحطوا فلوسهم فى البنوك وبعملوا كرديت كارد<br />واصحاب شقق للايجار بيبخروها كل يوم علشان تتسكن<br />والدلاور ابن الكلب بقى بعشرة صاغ<br />وخناقة فى مجلس الشعب علشان استيراد عمالة من المانيا علشان معندناش ولا عاطل والناس مش عايزة تشتغل فى وظايف دنيا وواطية<br />والمستشفيات مش لاقية ولا واحد عيان<br />افرحوا وهيصوا<br />رمضان جانا"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062527/http://masr.20at.com:80/newArticle.php?sid=17583"

