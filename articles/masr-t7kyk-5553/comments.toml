subject = "لا عزاء في الضمائر"
author = "لو كنت أعلم"
posted = "2007-07-09"
text = "هقول إيه غير تفتكر إن أصلان حياته مهمة للدرجة دي<br />لا يابني<br />حياة الممثلين والممثلات أهم طبعاً<br />ولا بأس أيضاً من اتصال من الرئيس للاطمئنان على صحتهم الغالية<br />أما أصلان وأمثاله فعندهم التأمين الصحي<br />وحتى التأمين هو كمان إن شاء الله هيتخصخص<br />وعمار يامصر"
