author = "مكتبة الاسكندرية"
posted = "2009-08-20"
text = "عدت من الخارج فى اجازة<br />قلت اشوف مكتبة الاسكندرية اللى وجعوا دماغ الناس بها<br />قطعت تذكرة دخول ب 4 جنية<br />اية الهبل دة<br />دى عمارة والا فن تشكيلى والا سريالى والا واحد مجنون طالع من مستشفى الخانكة وضع التصميم الزبالة دة<br />المكتبة على شكل مدرج فى جامعة من الداخل<br />ومن الخارج سطح مثلث لا فية جمال ولا فن ولا اى حاجة اى شخبطة واى زعبطة وفلوس انصرفت على كلام فارغ<br />صدقونى كليات جامعة اسكندرية مبانيها خلفها اشيك منها<br />ومستشفى الولادة اللى عايزين يهدوها علشان المكتبة اجدع من المكتبة 100 مرة<br />عمارة المخابيل<br />فاكرين العمارة شنطة حريمى او جزمة حريمى هنغيرها مع الموضة كل شوية<br />شفتم مدخل كلية الهندسة المواجة لمستشفى جمال عبد الناصر فى اسكندرية<br />شفتم مجمع التحرير<br />هى دى العمارة"
archived = "2010-03-14"
