author = "الفيلات فى الصورة"
posted = "2009-08-21"
text = "الفيلات اللى فى الصورة دى تلاقى مهندس معمارى او مدنى استسهل النقل وجاب كتالوج فيلات من الريف البريطانى ونقل الرسم بالمسطرة ونفذة فى مصر<br />طبعا كلام فارغ وعك<br />الريف البريطانى غير الجو الصحراوى فى مصر وطبيعة الناس تختلف وسلوكيات المصريين فى بيوتهم غير البريطانيون والاروبيون عموما<br />انما نقل الرسومات والتصميم من اوروبا بالمسطرة بدون اضافة الروح المصرية فكلام فارغ<br />فية عمارة مصرية موجودة من ايام الفراعنة والمماليك ويجب احترامها<br />انما العك والنقل فهو غير مطلوب"
archived = "2010-03-14"
