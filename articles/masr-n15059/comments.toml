[[comments]]
order = 0
subject = "- الي كل مصري حر شريف"
author = "أحمد"
text = "06/04/2008 م، 11:44 مساءً (السعودية) 08:44 مساءً (جرينتش)<br />المحلة الان مدينة معزولة اغلاق كل الطرق المؤدية الى المحلة المسؤل الاول والاخير عن احداث العنف هو مبارك وكلابه تصميمهم علي فض المظاهرات بالقوه والتحرش بالاهالي قوات الامن تطلق الرصاص الحي والقنابل المسيلة للدموع بلا اية رحمة وبشكل عشوائي اعتقالات بالجملة وسط تعتيم اعلامي انباء عن سقوط قتلي وجري لابد من عمل وقفه لمساندة اهالينا واخوانا في المحلة مش معقول هم فقط من يدفعون التمن"
archived = "2008-04-07"
capture_url = "https://web.archive.org/web/20080407213300/http://masr.20at.com:80/newArticle.php?sid=15059"

[[comments]]
order = 1
subject = "بجد حرام"
author = "ابراهيم"
text = "مدينه المحله لها الله عمال المحله عمرهم ما عملو كدا فى اى اضراب<br />حرام بجد اللى بيجصل ولا اى طريق مفتوح للهروب من المدينه المشتعله حتى السكك الحديد جميع القطارات تغير مساراتها وتم حرق قطارين<br />بالاضافه الى حرق محطه بنزين + نهب وسرقه محلات دهب وغيرها وغيرها<br />دلوقتى لو كان الاضراب عشان نقول عايزين حقنا خلاص معدشى ينفع<br />دلوقتى الكلام هيبقى ان اهل المحله السبب فى الخراب اللى بيحصل حرام حرام حرام بجد اللى بيحصل ده<br />المحله واهلها ما يستهلوش كدا حتى لو الامن هو السبب او الاهال او العمال المحله ما تستاهلشى كدا ابدا ابدا ابدا ابدا<br />حسبى الله ونعم الوكيل"
archived = "2008-04-07"
capture_url = "https://web.archive.org/web/20080407213300/http://masr.20at.com:80/newArticle.php?sid=15059"

[[comments]]
order = 2
subject = "احنا ادهورنا"
author = "مصري من الطبقة الوسطى"
text = "يا جماعة احنا في أواسط و أواخر التسعينات كانت الناس بتفكر تشتري عربية , حتصيف فيين لكن وعلى أي حال مكانش موضوع العيش و الاكل يشغل جزئ كبير من التفكير عند معظم المصريين واحنا النهارده في 2008 بنقول يا رب استرنا و نوصل لاخر الشهر مستوريين منغير ما نستلف حاجة من حد ومعنى كدة اني معظم طبقات الشعب اتضغطت و بقينا تقريبا على حد الكفاف . و ماحدش يقولي البلد مافيهاش فلوس و عشان هي فيها و فيها كتيير كمان ."
archived = "2008-04-07"
capture_url = "https://web.archive.org/web/20080407213300/http://masr.20at.com:80/newArticle.php?sid=15059"

[[comments]]
order = 3
subject = "بداية جديدة"
author = "rose"
text = "اللي حصل صفحة جديدة والأيام الجاية حتثبت ان مصر بتتحرك ومحدش حيعرف يوقفها"
archived = "2008-04-07"
capture_url = "https://web.archive.org/web/20080407213300/http://masr.20at.com:80/newArticle.php?sid=15059"

[[comments]]
order = 4
subject = "اية اللى جنن الناس"
author = "مراقب"
text = "البلد مش عارفة ليها كبير<br />ولا مين الرئيس<br />مبارك فى الصفحة الاولى فى جريدة حكومية<br />وابنة بيلف على المحافظات بسيارات الرياسة فى الصفحة التالتة<br />ومراتة الست سوزان بتفتتح مؤتمرات وندوات ومعارض فى الصفحة اللى بعدها<br />وفاروق حسنى 23 رسنة فى الوزارة<br />وابن منصور شيفورلية وزير نقل<br />وكيميائى بجنسية سعودية وزير للاسكان<br />ورئيس وزارة معاة جنسية كندية<br />وغيرة وغيرة بلاوى<br />ومصر تدعم المواطن الاسرائيلى الفقير ببيعة الغاز ببلاش والمصريين مش لاقيين عيش<br />والجيش بدل ما يدافع عن المواطنين ويحمى الناس على الحدود مبارك مشغلة فى توزيع الخبز<br />يا حلاوة<br />يا بقلاوة<br />ومش عايزين الناس تتجنن<br />اليس فيكم رجل رشيد"
archived = "2008-04-07"
capture_url = "https://web.archive.org/web/20080407213300/http://masr.20at.com:80/newArticle.php?sid=15059"

[[comments]]
order = 5
subject = "لجنة السياسات"
author = "احمد سامح"
text = "يا خوفي من لجنة قوم لوط لجنة السياسات سابقا هم أناس لا يخافوا الله وفي عهدهم سيري الناس الظلم والقهر والفقر وكل الموبقات وقريبا ان شاء الله سيعلمهم الشعب درسا لن ينسوه"
archived = "2008-04-07"
capture_url = "https://web.archive.org/web/20080407213300/http://masr.20at.com:80/newArticle.php?sid=15059"
