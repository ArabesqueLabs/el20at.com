[[comments]]
order = 117
subject = ""
author = "عازب و افتخر"
posted = "2010-01-01"
text = "عندك حق يا عم في كل اللي بتقوله خليهم يولعو<br />[quote name=\"عايش مع نفسي براحتي\"]انا شايف البنات كلها اجمعو علي ان مفيش واحده عاجبها حبيبها او خطيبها إلخ إلخ :o<br />طب لما انتو شايفين كده ههههههههههههه :P<br />ماسكه في زماره رقبته ليه متسيبيه :-*<br />ولا عشان يجي يصرف و يعمل و يخلي و يسيويلك و انتي قاعده في بيتكم<br />سوري يا جماعه بس انا من رأيي كل واحده كتبت تعليق هنا تروح تتصل بحبيبها دلوقتي و تقول له نسيب بعض عشان انا مش مرتاحه معاك :-*<br />و افضلي قاعده يا بيضا مستنيه عدلك لحد لما يجيلك فارس احلامك ابو حصان بمبه و سيف فوشيه و ياخدك بالهلاهيل اللي عليكي و يعملك اميره[/quote]"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106154207/http://www.20at.com:80/banat/self-development/14475-2009-12-20-11-48-30.html"

