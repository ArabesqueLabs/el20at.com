subject = "كل النقاد بيعيدو كلام بعض يعمى"
author = "كمال الباشا"
text = "انا مشفتش الفيلم بس كل النقاد الى اتكلمو كلهم بيشتمو على سعد ومفيش حاجة عجباهم طب مثلان فيلم كتكوت يعتبر احسن فيلم فى الموسم الى فات فى كل حاجة وناقش موضوع الارهاب والانما للوطن الزى هو غريزة فى كل انسان<br />ويريت الافلام التى تعتمد على الاغراء النقاد يخربوها زى كدة و هو كلام والسلام"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022733/http://masr.20at.com:80/newArticle.php?sid=11021"

[[comments]]
order = 13
subject = "فكرة بلا حكاية"
author = "sara"
text = "الحقيقة محمد سعد قال فكرة الفيلم بطريقة مباشرة لما عقل وقعد يدى محاضرة لعمه وعمته والمؤلف كان بيحاول ينسج الفيلم على الفكرة دى بس للأسف معرفش أو ملقاش حكاية فاضطر يفتعل أى مشاهد حشو ومملة امال لازمة الروائى إيه ......أى واحد ممكن يبقى عنده الفكرة لكن إما تتعرض فى فيلم متتعرضش بالشكل ده يقولها فى دقيقتين وبقية الفيلم حاجات ملهاش لازمة!!!!!!!!!!!!"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022733/http://masr.20at.com:80/newArticle.php?sid=11021"

[[comments]]
order = 14
subject = "ضع عنوان التعليق"
author = "عبدالعزيز السعوديه"
text = "السلام عليكم<br />الصراحه انا ماشفت الفلم بس انا اشوف احلا الافلام افلام محمد سعد لماذا؟<br />لانه في زمننا هذاماتنفع الا هالافلام بغض النظر عن القصه وانا اموت في افلام محمد سعد<br />افلام محمد سعد كلها مضحكه اتحدى اي احد من هالبشر يمر عليه مشهد من اي فلم لمحمد سعد ومايضحك<br />وبيني وبينكم تعتبنا من البكاء وافلام الحب و الغرام والعشق اللي ماله اخر<br />ياناس نبغى نضحك حب غرام عشق هذي تعبت عشان حبيبه تركها والعكس خلاص كفايه ملينا من هالافلام<br />احلا افلام محمد سعد والفنان محمد سعد ذكي جـدآ وعرف من اين يأتي الجمهور العربي والى الامام محمد سعد<br />وشكـــــــرآ"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022733/http://masr.20at.com:80/newArticle.php?sid=11021"

[[comments]]
order = 15
subject = "لماذا ؟؟؟دعونا نتامل"
author = "مارك"
text = "لماذا الهجوم علي محمد سعد وبهذه الضراوه؟؟؟<br />علي فكره هناك افلام فاشله بالفعل تستحق كل هذا النقد ولم يلتفت اليها النقاد بكلمه ..!<br />وهناك ما يستحق ان يقال عليه فيلم بلا معني يستحق كل هذا الهجوم ولم ينظر اليها ..واهي راحت شانها شان الباقي<br />الاجابه علي كلام النقاد المهاجمين او الجمهور الحائرين تتلخص في كلمتين (((النجاح الغير مسبوق لمحمد سعد)))<br />اولا افلام محمد سعد من اللمبي وحتي كركر مرورا بعوكل وبوحه وكتكوت تنال نجاحا غريبا لدي النقاد وطبيعيا لدي الجمهور وسر هذا النجاح الجماهيري الساحق يكمن في بساطه محمد سعد دائما ما يمثل دور الشاب البسيط ذو البيئه الشعبيه او الريفيه التي تتسم بالبساطه فلم نجد له فيلم كان قد قدم دور شخص من جذور ارستقراطيه بل الظروف هي التي تضعه في المستوي الاجتماعي الراقي كما راينا في اللي بالي بالك من مسجون الي رجل ذو مكان مرموق وكذلك الي عوكل او كتكوت او كركر مع اختلاف في كركر حيث قدم دور شاب ثري ابن احد الاعيان ولكن الدور كان جديدا علي سعد بالمره حيث قدم صورته الحقيقيه في بعض مشاهد الفيلم عكس المالوف ولكن نراه يرفض المال ويعود ليغني وسط الحي الشعبي ليشكي له قسوه تلك الطبقه ..هذا هو سر دخول محمد سعد وشخصياته الغريبه الي قلوب الجمهور فما بالك انت بكلام نقاد يقولون ان محمد سعد نجح بادعاءه الهطل او الهبل لاستجداء الضحكات...هذا الكلام غير صحيح ويهين بكل الصور الحمهور المشاهد فهل تلك الجماهيريه العريضه تضم اشخاص سفيهه غير مثقفه او راقيه ؟؟لا بل نجد ان الجمهور يهبون نفس النجاح لفنانين من الوان اخري .السر في بساطه سعد فانه يقدم اعمالا بسيطه لا تافهه لان الجمهور لا يقبل التفاهه<br />مهما كانت الصور ولا يقبل المبالغه فمحمد سعد نجد انه لا يقدم اعمالا تضعه تحت مقاييس عاليه فلا نجده يقدم اكشن او رومانسيه تجعله تحت ميكرسكوب يرصد كل عيوب السيناريو او الاخراج والتي لا يكون له ذنب فيها فمثلا حينما رصد الكاتب قضيه الارهاب رصدها بمنتهي البساطه المقنعه بدون اهدار لاهميه القضيه وتاثيرها وبدون مبالغه تضعه تحت مقاييس خاصه حيث تنسينا القالب الكوميدي الذي يسير به شخصيه كتكوت وحدها وكركر البسيط الذي لا يتمني ابدا كاي انسان ان يحدث له هذا حين صعق ولكنها قدر يكشف له حبيبه من عدوه قضيه اجتماعيه بحته بسيطه يتخللها مواقف كوميديه وافيهات طبيعيه من شخص مجنون تثير الضحك والشفقه ايضا مما حدث له ولا ذنب له فيه محمد سعد يتمتع بخفه دم وروح مرحه بالفطره بالاضافه الي البساطه التي تجذب الجماهير وعرضها با بعيدا عن التعقيد والغموض"
archived = "2007-09-19"
capture_url = "https://web.archive.org/web/20070919004218/http://masr.20at.com:80/newArticle.php?sid=11021"

