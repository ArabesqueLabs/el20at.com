[[comments]]
order = 11
subject = "كفاية يا سعد"
author = "حمادة"
text = "مع اتفاقنا على ان محمد سعد موهوب وجريء فليس كل فنان يستطيع ان يرقص ويهز ويغني ويافه(يعمل افيهات يعني)<br />لمدة ست سنوات على التوالي دون ان يسال نفسه قائلا ايه اللي انا باعمله ده بصراحة محمد سعد مستواه في انحدار شديد فعلى عكس راي معظم الناس بان عوكل هو الافضل ارى ان اللمبي كان في القمة ثم بدا المستوى في الانحدار شيئا فشيئا انا شاهدت اللمبي واللي بالي بالك وعوكل وبوحة وحسيت ان الراجل بدأ يخلص قلت الحق نفسي انا وما دخلتش لا كتكوت ولا كركر اللي كركرونا بالاعلانات بتاعته في الشوارع ...غابت التلقائية والاداء البسيط التي ميزت اللمبي فسقط محمد سعد في الوحل الى الامام يا سعد وتكركر كمان وكمان وحنا مش معاك... لا عزاء للجمهور ... أحمد سراج"
archived = "2007-07-14"
capture_url = "https://web.archive.org/web/20070714215355/http://masr.20at.com:80/newArticle.php?sid=11021"

[[comments]]
