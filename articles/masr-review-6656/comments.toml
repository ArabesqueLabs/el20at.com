[[comments]]
order = 2
subject = "محمد سعد .....!!!!!!!!؟؟؟؟؟؟؟"
author = "معلقة دائما...."
text = "السلام عليكم،كلنا عارفين أفلام محمد سعد كوميديا أحيانا دون هدف بدخل افلام سعد على اني أأمل ان يكون في هدف لكن للاسف بخرج ندمانة على اللي دفعتو لكن مين فينا مش بيخرج من السينما بنضحك على الأقل على مشهد او مشهدين انا عندي وحدة صحبتي بتقولي انها لازم تتفرج على افلام محمد سعد 3 مرات عشان تفهم الفيلم، بصراحة احلى فيلم شوفتو ليه كان فيلم عوكل غير كدة مفيش حتى بوحة أنا زعلت على مي عز الدين لأن ده مش مستواها بالمرة بالرغم ان الفيلم كان فيه مشاهد تخلي الواحد يموت من الضحك لكن نفسي محمد سعد يمثل فيلم كوميدي ذي هدف لكن للأسف..وبعدين يمكن كمان أنا برجح ان الفيلم ده حيفشل لأنو نازل مع فيلم الزعيم عادل امام (مرجان احمد مرجان) طبعا لا مجال للمنافسة ولاأضع الزعيم بمقارنة بينه وبين محمد سعد لكن أفلام عادل امام كوميديا جدااااااا لكن ذات هدف وهذا ما نريده من السينما المصرية ..تعليقي الوحيد على كركر (هو مثال للسينما المصرية الهابطة وزي ما قالت الناقدة خيرية البشلاوي انه نوع من التلطيش بالفعل )كفاية هلس في أفلامنا ياريت نرتقي شوية في مستوى أفلامنا الكوميدية ..أستاذ محمود احنا سمعنا خبر ومش عارفين مدى صحتو هل فعلا ان الزعيم حيعتزل السينما بعد (مرجان احمد مرجان) وانو سيتفرغ للمسرح؟؟ ياريت يتعمل موضوع عن ده لأن بصراحة يحتاج اننا نتكلم فيه اكتر من كركر لأن لو الخبر ده صح حنقول سلالالالالالالالالالالام يا كوميديا وحيكون سلام بدون رجعة ليكتب عادل امام موت الكوميديا المصرية باعتزاله للسينما.."
archived = "2007-07-14"
capture_url = "https://web.archive.org/web/20070714215355/http://masr.20at.com:80/newArticle.php?sid=11021"

