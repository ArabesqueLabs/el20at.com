subject = "محمد سعد الأفضل"
author = "محمد أحمد محمد"
text = "لم أر الفيلم بعد، لأني مسافر، والحقيقة أني واحد من الناس غير المهتمين بالسنما أساساً، لكني أحب أن أدخل أفلام محمد سعد لأني أرغب قليلاً في الضحك، وسط يوم عاصف من الأحداث والكآبة التي تسيطر على حياة المصريين.<br />ومحمد سعد شأنه شأن كل الافلام الهابطة والتي لا تقدم اي قيمة، فقط تقدم الضحكة بمقابل مادي مثله مثل عادل إمام إن لم يكن هو أفضل حاليا من عادل امام."
archived = "2007-07-14"
capture_url = "https://web.archive.org/web/20070714215355/http://masr.20at.com:80/newArticle.php?sid=11021"

