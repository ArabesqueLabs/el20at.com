text = "أشهد أن لا إله إلا الله وأشهد أن محمد رسول الله<br />اللهم صلي على محمد طب القلوب ودوائها وعافية الأبدان وشفائها وعلى أهله الطيبين الطاهرين وصحبه والتابعين إلى يوم الدين يا رب العالمين<br />الحمدلله انه ربنا نور قلوبهم بنور الإسلام .. وقادهم إلى الطريق الصحيح .. ويا رب يكتر عندنا في الوطن العربي مراكز جميلة زي دي عشان يزيد عدد المعتنقين للإسلام .. ونرغبهم فيه عن طريق دراسة اللغه العربية والقرآن :-)"
