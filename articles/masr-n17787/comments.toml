[[comments]]
order = 0
subject = "مسجات العيد بعضها الفاظ خارجة وبعضها مقبولة وكلها تسخر من نظام الحكم الفاشل"
author = "مش لاعب"
text = "نشرت المصرى اليوم بعض من هذة المسيجات فى تليفونات المحمول<br />اللهم انا قد صبرنا ربع قرن ..... فا اعفوا عنا واغفر لنا ... وارحمنا ... اللهم واجعلة عيد سعيد او سيد او عبد الشكور ................... اى حاجة .......... بس وحياة حبيبك النبى بلاش يكون عيد مبارك<br />مسيج تانى<br />مشروع المليون كحكة تحت رعاية السيدة الاولى .... تبرع ولو بكيلو عين جمل .... تعاطفك لوحدة مش كفاية"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 1
subject = "الصحافة مهنة من ليس لهم مهنة؟"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "بعد القراءة و المتابعة اعتقد ان الصحافة للاسف الشديد تحولت الى سبوبة و مهنة من ليس لة مهنة؟<br />عاوز تكون صحفى لابد ان تكون<br />سليط اللسان<br />متطاول على الشرفاء<br />مخطئ التقدير و الحسابات<br />اعمى فى الحكم و الاستدلال؟!!!!!!<br />عديم الشعور و الادراك؟<br />غير نزية و غير سوى<br />قليل الادب و تكتب و تهبش فى الجميع كالكلب المسعور !!!!!<br />لكن تعلم ياولدى انك تمشى طريق الظلمات<br />القضاء لك بالمرصاد طبقا للقانون؟<br />فسوف تخطئى و تحاكم و تسجن<br />(بس خلاص؟ توتة توتة و خلصتن الحدوتة؟ )<br />اهداء الى ما يدعى الصحافة الاخ| أبراهيم عيسى رئيس تحرير جريدة الاسبوع!<br />(وانتهى الدرس يا غبى)؟"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 2
subject = "زخارى اعمى القلب واعمى البصر"
author = "واحد وخلاص"
text = "يا زخارى يا خنفشارى يا بتاع الوطنى - يا جاهل - ابراهيم عيسى رئيس تحرير جريدة الدستور وليس الاسبوع كما ذكرت<br />ربنا يشفى الكلاب ويضرك"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 3
subject = "ما بقتش تفرق الاثنين اخوات(الاسبوع) و (الدستور)"
author = "ممدوح ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "الى ارلاخ المعلق سابقا<br />ليك حق و لكن الاثنين اخوات سواء(الاسبوع) او(الدستور)<br />ما صاحبهم واحد و هو الاستاز الفاضل الاخ(عصام اسماعيل فهمى) صديقى العزيز شافاه اللة و اعطاة الصحة و العمر المديد<br />(واية حكاية الحزب الوطنى معاكم) هو مزعلكم فى اية بالضبط؟!!!!!ّ<br />(الحزب الوطنى سيظل جاثم على قلوبكم سواء شئتم ام ابيتم؟)<br />اطيب التهانى بعيد الفطر المبارك و كل سنة و انت عبيط و اهبل على طول<br />و ربنا يخليك للماما يا ننوس عينهااااااااااااااااااا"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 4
subject = "هو هو هو هو"
author = "ممدوح ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "الى (واحد و خلاص)<br />هو هو هو هو؟<br />شفت ابوك الكلب لما عضنى حصل اية؟؟؟<br />ابوك الكلب ابن الكلب (سعرنى) و عضنى و جرى الكلب الجبان!!!<br />هو هو هو هو عليك و على اللى خلفوا ابوك الكلب ابن الكلب المسعور<br />ربنا يشفية؟"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 5
subject = "مفيش فايدة حتعيش صليب كلب وتموت صليب كلب وسخ واطي"
author = "مباحث اسكندرية"
text = "مفيش فايدة فيك يا زخاري الكلب مفيش فايدة فيك<br />حتعيش كلب وتموت كلب<br />زي ما قلتلك قبل كده والله وكمان والله لو اضمن ان انت اسمك دا صحيح لاجيبك هنا مديرية امن اسكندرية واخليهم يقلعوك اللباس ويضربوك على طيز امك يا ابن الوسخه<br />لو راجل تثبت ان دا اسمك انت"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 6
subject = "ممكن كلمة فى و دنك"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "الى المعلق اللى يستخدم كلمة و اسم (مديرية امن اسكندرية) و (مباحث الاسكندرية)<br />ممكن اقولك كلمة على الملىء و السمع(كوس امك) و (طيز امك حمرا)<br />كوس امك و طيز امك معمول ليهم (فيش و تشبية)<br />ممكن تتاكد من و حدة مباحث الاداب<br />يابن العرص يا شرموط<br />ملعون ابو امثالكم الوسخة فى كل مكان و كتاب و زمان"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 7
subject = "يا زخارى خليها تاكلك"
author = "برضة"
text = "لان ريحة امك معفنة برضة مفيش ولا واحد هيعملها معاك<br />معفن وريحة النصارى الزفرة والزنخة بتفوح من جتة اهلك من اكل الخنازير النجسة - ولان الجبن وراثى فى ملة اهلك وبس بطل وشجاع امام الكمبيوتر وبرة اجبن من ارنب - بس مصيرك تقع فى ايدنا وهنخللى كلب اجرب يشرمك يا ابن اللبوة اللى دقة صليب على طيزها"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 8
subject = "نتكلم عن دراما (الصحافة) و الست عن دراما (امك )الشرموطة سيئة المسمعة و السير و السلوك؟!!!"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "الى (برضة)<br />معلش معاك؟<br />و اللة لو امك (الشرموطة المومس) لو كانت تفهم معنى رسم(الصليب) لكونتم جميعا و اولهم(امك)مانت دقت(الصليب)على (كوسها المنتوف)موش على طيزها المخرية<br />اتفوا عليك و على اهلك اللى معلمكش الادب دول بس شربوك الحقد و القذارة؟<br />(موش كدة و لا اية؟)<br />كما نتكلم عن دراما (الصحافة) موش عن دراما (امك)<br />لية تدخل الدين فى اية مناقشات؟<br />هى (المسيحية)و (الصليب) اسة معقدينكم و لا اية الحكاية بالضبط<br />ما تفهمونا بالحقيقة ايها الكذبة الكلاب؟.<br />ياريت المرة القادمة تكون عندك من الشجاعة لتكتب اسمك الحقيقى؟ و لا العياز باللة اسمك عورة مكتوب على (كس امك)بالبنط العريض(كوسها)علشان كدة انت خايف تكتبة و تقولة و تبينة علشان (كوس امك )عورة يابن الشرموطة العورة منيوكة هانم؟<br />ابقى تتفلى عليها و حياة الغالى (اللى بالى بالك)!!!!!!!!!!!!!!!!!<br />هااااااااااااااااااااااااااااااااااااااااهااااااااااااااااااااااااااااااهاااااااااااااااااااااااااااااااااااااااااااااااااااااااااا<br />خليها تاكلكم كلكم يا خولات النت؟"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 9
subject = "جنازة نصرانى"
author = "عجوة"
text = "حضرت جنازة نصرانى فى الكنيسة<br />القسيس اللى لابس عمة سوداء زى قلبة الاسود ماسك سيخ حديد وبيغز جثة المتوفى بالسيخ فى بطنة ويقول<br />اكل كتير وشرب كتير وتموت لية يا خنزير<br />ووراة شوية زلنطحية بيرددوا<br />اكل كتير وشرب كتير وتموت لية يا خنزير<br />دى صلاة الجنازة عند الخنازير"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 10
subject = "الصليب اداة تعذيب وليس عبادة يا وثنيين"
author = "مرقص اللى بيرقص فى الحلة"
text = "اولا حكاية ان الرومان يموتوا واحد على الصليب دى مستبعدة تماما<br />لان عساكر الرومان كل واحد معاة سيف وسهل جدا ان يضربة بالسيف فى ثانية واحدة ويخلصوا منة<br />انما المؤلف لازم يدخل فيها صليب وتعذيب وعياط ونواح فوق الصليب علشان تبقى بكائية كدابة وابن اللة بتاعهم يعيط على الصليب ويقول الحقونى اغيثونى<br />صليب اية وخشبة اية وصلب اية<br />ابراهيم ربنا نجاة من النار وموسى نجاة من فرعون اشمعنى عيسى اللى ربنا مش هينقذة<br />المرضى النفسيون هيقول لك خطيئة ادم<br />ادم ربنا غفر لة ونال عقابة ونزل الارض وانتهى الموضوع<br />يبقى للصليب فايدة واحدة انهم يدقوة على طيزهم"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

[[comments]]
order = 11
subject = "قسما باللة العظيم ما فية اية خنازير سوى انتم يا شعوب خلقتم لتستعبدون و تحتلون و تلعنون"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "ما انتم الا حثالة خنازير فى هيئة الانسان<br />لا و لن تكون لكم حضارة الا عندما تتجردون من عقدة النقص التى مسيطرة على عقولكم الصدئة<br />و قلوبكم الحاقدة<br />و اشكالكم القذرة<br />و صفاتكم المنحطة بكل تصرفاتكم النابية<br />ملعون ملة ابوكم يا عرب يا محتلين من اسرائيل و ابو ست ايمان ابوكم امريكا<br />ما تروحوا تحرروا القدس و تورونا رجولتكم المسلوبة<br />اتفو اتفو اتفو على اللى جابوا حثالتكم لتعبثوا خرابا فى الارض ايها الشعوب المريضة دنيا و اخرة سودا على راس اهل ابوكم"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011103515/http://masr.20at.com:80/newArticle.php?sid=17787"

