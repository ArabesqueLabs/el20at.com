subject = "كذب استاذ السياسة عندما قال الثورة بعد ربع قرن واخ"
author = "واحد"
posted = "2008-05-20"
text = "لا شىء يستوجب الثورة - ولا يوجد من يقوم بالثورة<br />لم يعد احد يشعر بالانتماء لهذة البلد حتى يثور من اجلها<br />عزيزى حينما يفقد الناس انتمائتهم للبلد<br />سيأتى الاستعمار بعد عامين<br />ولو ارسلت اى دولة 5 الاف جندى فسيدخلون القاهرة<br />اصحاب البلد احمد عز او بقية الحرامية يبقوا يدافعوا عنها<br />عنى شخصيا<br />مرحبا بأى احتلال قادم<br />لانى اشعر ان البلد مش بلدى"
