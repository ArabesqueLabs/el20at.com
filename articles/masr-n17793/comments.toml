[[comments]]
order = 0
subject = "للتحرش وهياج الشباب اسباب"
author = "برضة هو بغباوتة"
text = "عدم وجود رقابة على المواقع الاباحية فى النت<br />تاخر سن الزواج<br />ازدياد معرفة الصغار بالثقافة الجنسية والفحش عن طريق النت السداح مداح<br />والكل عايز يشوف عملى ويطبق اللى بيتفرج علية فى النت"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"

[[comments]]
order = 1
subject = "الوقاية خير من العلاج"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "اللي نقوله نعيده<br />واللي نعيده نزيده<br />يا جماعة خلاص اعلان مصر دولة تحرش جنسي<br />كل واحد ياخد باله<br />اللي عنده بنت ولا متز\\\\جوز يا خد باله ما تنزلش لوحدها<br />ممنوع البنات والستات ينزلوا لوحدهم بعد العصر<br />لان الشياطين بتنام الصبح وبتنزل قبل المغربية بشوية تتسكع<br />فالست او البنت اللي وراها مشوار او مدرسة او كلية او شغل كله الصباح بعد العصر كل النسوان والبنات يكونوا قاعدين في البيت<br />يعني زي حضر التجول بالضبط<br />يعني قانون اللي حينزل يتقبض عليه<br />فهمتوها ولا لسه<br />الست اللي تنزل بعد العصر يبقى لازم بتصريح رسمي وتخرج معاها واحد<br />والا يتحرشوا بيها ولا تروح في ستين الف داهية تاخدها<br />قالون يطلع بعد العصر ممنوع النزول الحريمي الا بتصريح رسمي<br />واللي عايزه تنزل تستاهل اللي يجرلها يخطفوها يتحرشوا بيها<br />تتفلق وتروح في ستين الف داهية تاخدها<br />سلام"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"

[[comments]]
order = 2
subject = "لا"
author = "مصرى"
text = "شباب تعبان ليس لة دين ولا ايمان شباب يعبد الشهوات . شباب محبط وليس لة هدف فى الحياة .شباب عاطل وفاضى<br />للاسف انهم شباب مصريين<br />للاسف انهم من اخى واخواتكم<br />قبل ان نبحث عن علاج للمشكلة نبحث عن سبب المشكلة"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"

[[comments]]
order = 3
subject = "بنات نصارى بيخرجوا بالمحزق والملزق والعيال عملوها معاهم علشان يحترموا انفسهم"
author = "لية"
text = "مين قال ان كان فيهم بنت محجبة - دى الحكومة الوسخة مش عايزة تقول انهم بنات مومسات من النصارى الكنيسة بتوجههم يلبسوا عريان وملزق خلال شهر رمضان والاعياد علشان فتنة الشباب<br />انا معايا فى الشغل نصرانية قذرة شكلها يسد نفس الكلب وعاملة زى الكلبة الجربانة وقفاها مقشف اول ما رمضان ييجى تلبس لبس تبين فية نصف صدرها واعلى افخاذها لما تقعد<br />طبعا العيال معاهم حق<br />خليهم ينطوا على كل نصرانية هايجة طالعة ترتزق فى عيد مش عيدها"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
text = "ربنا يهديك!ياااااااااااااااااه للدرجة دى مفيش إحترام للبنى آدم!واضح فى لغة كلامك إنك مش بنى آدم و أنا آسفه على التعبير ده!ربنا يهديك و يرجع لك عقلك فى راسك و عينيك تبقى نضيفه و قلبك يبقى نضيف!علشان تشوف و تفرق بين النضافه و ال!بلاش أقولها!"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"

[[comments]]
order = 5
subject = "المواقع الاباحية هي سبب الكوارث"
author = "غضبااااااااانه"
text = "انا اضع كل اللوم علي عدم وجود رقــــــابه علي المواقع الاباحيه . وهو ده سبب الفوضي وربنا يستر علي بنات الناس ."
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"

[[comments]]
order = 6
subject = "الأخ اللى اسمه ليه"
author = "أحمد"
text = "السلام عليكم ، كلامى موجه للأخ اللى كتب ان اسمه ليه و قعد يقول بنات نصارى و حاجات غريبه جدا و معاه واحده عريانه تقريبا حسب وصفه فى الشغل ( غالباً بيشتغل فى كباريه ) أنا مسلم زيك و أقولها لك بمنتهى الجديه و بمنتهى الأدب : أخى الحبيب أنا شاهد عيان على النصف الأول من الواقعه و كانت فى بدايتها تحرش من خمسة أو ستة شبان تحت العشرين ببنتين مسلمتين محجبتين كانوا ماشيين فى امان الله ولم يكن يرتدين أى شئ خادش للحياء يعنى ملابسهم محترمه و الشباب السافل القذر دول اتحرشوا بيهم بشكل بشع لا يصدقه عقل و عندما حاولت التدخل أصبح الشباب حوالى عشره أو 15 شاب فأخدت البنات فوراً و دخلتهم أحد المحلات بسرعه و بدا الشباب ( نفس الشباب ) يدوروا على حد تانى يعاكسوه حتى أنهم تحرشوا بشباب زيهم فى مشهد لا يقل حقاره و قذاره عن الخنازير ."
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"

[[comments]]
order = 7
subject = "السلام"
author = "احمد"
text = "وخلقناكم من ذكر وانثى -زين للناس حب الشهوات من النساء والبنين - اذن الشياطين تزين النساء للرجال بحكم الغريزه الفطريةالتي خلق عليها الرجال والنساء وللمرأة أعضاء اثارة وجذب ولذة للرجل مباح ان تظهرها لزوجها لمتعته الحلال<br />وأمرت ان تسترها عن غير زوجها حتى لا تثير من هو غير زوجها فيتحرش بها غريزة وفطرة فالغالبية من البنات كاسيات وكأنهن عاريات فهجم ذئب الشهوة والغريزة على كل نعجة شردت عن طاعة راعيها فلا تلومن الا نفسهاوالمجموع شارد"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"

[[comments]]
order = 8
subject = "سكوت كلاكيت هنصور مليون مرة(تحرش_تحرش_تحرش)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "و قفة لا يجب ان تمر مرور الكرام<br />يجب الضرب بيد من حديد على هؤلاء القلة المنحطة عديمة الاخلاق و الشرف و الدين؟!!!<br />حتى و لو اقتضى الامر باعتقالهم و نفيهم كم يقولون(وراء الشمس)!<br />تخيل ان هذا التحرش و العياذ باللة قد حدث لوالدتك _خالتك_عمتك_زوجتك_أختك_بنتك؟!!!!!!<br />او حتى زميلتك او جارتك او حتى صديقتك؟<br />لا أعتقد انك سوف تقبل او تتجاهل هذة الظاهرة المقلقة القاتلة فى أعراضنا"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063733/http://masr.20at.com:80/newArticle.php?sid=17793"
