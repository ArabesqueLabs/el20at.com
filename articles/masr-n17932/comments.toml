[[comments]]
order = 0
subject = "وبعدين تشتكوا من التحرش الجنسى"
author = "شايف"
text = "لما بتربوا الاطفال على المناظر الفاضحة دى والعرى وقلة الحياء والامهات بتشتريها لاطفالها<br />منتظر اية من الاطفال دى لما توصل سن المراهقة<br />هيعملوا اية فى الشوارع ؟<br />المسخرة اللى بنشوفها من هؤلاء الفتيان والتحرش الجنسى وقلة الادب<br />هذة امر تسيب وجب ايقافها وحماية المجتمع منها"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070906/http://masr.20at.com:80/newArticle.php?sid=17932"

[[comments]]
order = 1
subject = "جرس انذار"
author = "الميم الاخت"
text = "الموضوع بجد خطير جدا وبيمثل خطورة كبيرة علي البنات وهم في السن ده بدليل ان بعض الفتيات بياخدهم قدوة في تسريحة شعرهم ولابسهم كمان ومستنين موضوعاتك الجميلية يا ميم قصدي يا ميرووووووووووووو"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070906/http://masr.20at.com:80/newArticle.php?sid=17932"
