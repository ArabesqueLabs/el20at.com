subject = "وبعدين تشتكوا من التحرش الجنسى"
author = "شايف"
posted = "2008-10-16"
text = "لما بتربوا الاطفال على المناظر الفاضحة دى والعرى وقلة الحياء والامهات بتشتريها لاطفالها<br />منتظر اية من الاطفال دى لما توصل سن المراهقة<br />هيعملوا اية فى الشوارع ؟<br />المسخرة اللى بنشوفها من هؤلاء الفتيان والتحرش الجنسى وقلة الادب<br />هذة امر تسيب وجب ايقافها وحماية المجتمع منها"
