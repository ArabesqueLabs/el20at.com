order = 2
subject = "فن المانغا/المانجا الياباني !!!"
author = "بنت بطوطة"
posted = "2008-10-18"
text = "هذه الرسوم و الأفلام و القصص الجنسية ذات الطابع الكرتوني ( المانغا أو المانجا ) نشأت في اليابان و هي معروفة و منتشرة جدا هناك لدرجة وجودها في المكتبات العامة و على الأرصفة. و أذكر إنه في إحدى المرات كنت أحضر مع أسرتي إحدى المعارض الإلكترونية و لما طلب الأطفال الذهاب الى قسم الأفلام الكرتونية و الألعاب الإلكترونية لم نستطع حتى الدخول الى ذلك القسم لصدمتنا من البوسترات المعلقة فقد كانت رسوم كرتونية و لكن كما قال الأخ بأوضاع جنسية مقززة بين الجنسين و بين المثليين أيضا و صور بنات عاريات و أولاد مخنثين يرتدون ملابس شبه نسائية و يضعون المكياج بين الهادئ و الصارخ كل ذلك على طريقة رسوم أطفال, الى جانب البضائع المعروضة الغريبة, فقد دخلنا إحدى قرطاسيات و كانت الأقلام و المساحات و المساطر و المقالم و ما الى ذلك مقسمة حسب طبعة المنتج من دمى , حيوانات, سنوبي, هالوكيتي و غير ذلك أما الغريب فوجود قرطاسيات و أدوات مدرسية ماركة و طبعة \" البلاي بوي\" و \"البلاي غيرل\" في قسم الأطفال!؟؟!! كل ذلك دون أي إستهجان من أحد أو حتى رفة عين!!!؟؟؟!!!!؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2010-03-14"
capture_url = ""
