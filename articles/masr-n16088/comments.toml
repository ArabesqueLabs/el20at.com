[[comments]]
order = 2
subject = ""
author = "جمهور الاسكندرية"
posted = "2008-06-02"
text = "احنا معاكى يا شرين منصور وانتى اساسا مكنتيش محتاجة تدخلى حاجة زي دي انتى الاولى وقلمك احسن قلمك مستنيين التحقيقات بتاعتك انتى اكبر من كدة بكتير …رسالة الى موقع عشرينات انا واحد معرفش شرين منصور بس هى مشهورة في اسكندرية بالتحقيقات بتاعتها وعلى فكرة التصويت بتاعها كان عالى لأن الناس اللي تعرف شرين شخصيا واللي تعرفها من خلال تحقيقاتها دخلو صوتولها بس هى كوووووووووووووو ووووووووووووووو ووسة وانتو فعلا خسرتو اسم جامد شرين منصور … معلومات اضافية ياريت تتصلوا بيها لأنى جبت نمرتها واتصلت بيها ياريت تسألوها مؤهلها ايه وايه هي الشهادات اللي اخدتها … شرين بنحبك مووووووت"
archived = "2010-02-09"
capture_url = ""

