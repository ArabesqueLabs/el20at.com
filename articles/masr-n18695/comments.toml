[[comments]]
order = 0
subject = "نسيبهم ازاى - دى افرازات نظام حكم يعتبر التصفية ال"
author = "لا لا"
posted = "2008-12-02"
text = "القضية مش قضية مطربة اتقتلت او بنت مطربة تتعاطى المخدرات ووجدت مقتولة<br />لا يا ست دعاء<br />دى عنوان تحالف رأس المال مع السلطة ونتج عنها الفساد الذى انتشر<br />انتشار المخدرات وبالذات البانجو بين الشباب وعلى الارصفة - مين اللى وراة واللى بيسمح بدخولة البلد والتهاون فى محاربتة - اكيد كبار رجال الامن<br />حوادث القتل مش للدفن وانسى وابتسم وطنش<br />دى ظاهرة جديدة على المجتمع المصرى وافرازات مرحلة وفشل نظام امنى يهمة الامن السياسى فى المقام الاول<br />والا بماذا تفسرى انتشار شركات الامن الخاص ؟<br />لية دلوقتى الرقاصة والفنانة بتجيب شركة امن تحميها<br />ولية الفنادق والشركات بتجيب شخصيات امنية سابقة واصلة فى الحكومة قبل كدة تحميها<br />لية كبار رجال الاعمال عاملين امن مخصوص وبودى جارد بيمشى وراهم كانهم رؤساء دول<br />حوادث القتل دى بتبين ان فية نظام امنى فاسد يعمل خارج نظام الدولة الامنى اللى هو وزارة الداخلية<br />سامى السكرى اللى قتل سوزان كان بيشتغل اية لما راح وقتلها - شركة امن خاص<br />مطلوب الغاء كل شركات الامن الخاص - وتتعهد الدولة بحماية مواطنيها الفقير والغنى"
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044916/http://masr.20at.com:80/newArticle.php?sid=18695"

