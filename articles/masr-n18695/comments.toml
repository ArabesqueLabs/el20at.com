[[comments]]
order = 36
subject = "ضبط والد القتيلة في مطار القاهرة وبحوزته كمية من ا"
author = "مش شريف الدواخلي ولاالبراء اشر"
posted = "2008-12-13"
text = "من جانبه، طلب طلعت السادات محامي المدعي بالحق المدني، عادل معتوق، استدعاء جمال مبارك رئيس لجنة السياسات بالحزب الوطني بصفته، للإدلاء بشهادته حول سلوك هشام طلعت مصطفي باعتبار أن الأخير عضواً بلجنة السياسات.<br />كما طلب السادات استدعاء وزير الداخلية، حبيب العادلي، لأنه كان يشغل منصب مدير مباحث أمن الدولة وقت عمل السكري بالداخلية، وأيضاً بسبب ضبط والد القتيلة في مطار القاهرة وبحوزته كمية من المخدارت حيث تم الإفراج عنه آنذاك<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />ريحوا نفسكم دي مافيا مخدرات واتخلصت منهم هما التلاته"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 37
subject = "السكرى ومعلمة كانوا قوادين بيجيبوا نسوان  لولى نعم"
author = "هياص"
posted = "2008-12-13"
text = "الناس عارفة ان السكرى ومصطفى كانوا وجهة الاصطياد لشخصية كبيرة معروفة مغرمة بالنسوان والفنانات ولة غراميات تشيب لذلك سيتم قتلهم بطريقة او اخرى لمنع صدور اى تفاصيل بعد ذلك واللى يؤكد الكلام حظر النشر فى القضية<br />يحظروا النشر لية<br />قتيلة وقتلة متهمون<br />هيقولوا اية يخوف<br />فية حاجة كبيرة عايزين يخبوها<br />لكن المثل المصرى القديم بيقول<br />اللى بتحبل على الفرن بتولد فى الجرن"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

