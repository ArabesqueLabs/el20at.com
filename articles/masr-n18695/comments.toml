[[comments]]
order = 8
subject = "القبض على نجار مسلح بتهمة قتل إبنة ليلى غفران"
author = "مش كاتب"
posted = "2008-12-03"
text = "القبض على نجار مسلح بتهمة قتل إبنة ليلى غفران<br />02/12/2008<br />القاهرة - أ ش أ - البديل الالكتروني / 2 - 12 - 2008<br />قالت أجهزة الأمن الثلاثاء انها كشفت الغموض حول حادث مقتل هبة العقاد إبنة المطربة المغربية ليلى غفران وصديقتها نادين حيث تبين أن القاتل نجار مسلح كان يعمل فى حي \"الندى\" بمدينة الشيخ زايد بمحافظة 6 اكتوبر جنوب القاهرة .<br />وذكر مصدر امنى ان المتهم ويدعى محمود سيد عبدالحفيظ عيسوى 20 عاما يقطن منطقة روض الفرج وكان يعمل فى احدى المشروعات بجوار موقع الجريمة كنجار مسلح ، وتبين انه سبق اتهامه فى قضية تعاطى مخدرات .<br />واشار المصدر الأمنى أن القاتل إعترف بجريمته بعد القاء القبض عليه ومواجهته بالقطعة الحديدية \"العتلة \"التى تم العثور عليها فى مكان الجريمة ، وتم كشف البصمة الملوثة بالدم ومطابقتها ببصمات المتهم بعد تحليلها بحامض \"دى إن أيه\" .<br />وبمواجهة المتهم عن طريق مباحث مديرية أمن 6 اكتوبر إعترف بتفاصيل إرتكابه للجريمة ، كما اعترف انه كان يمر بضائقة مالية فقام بتنفيذ تلك الجريمة وأنه كان قد دخل المكان بغرض السرقة دون معرفته بالموجودين بالمكان ، وحينما وجد نادين فخشى أن تكشفه فطعنها عدة طعنات وقتلها وحاول العثور على مسروقات وقام بتفتيش المكان دون ان يكون على علم بوجود القتيلة هبة ابنة ليلى غفران والتى فوجىء بها فإنتابته حالة هيستيرية وسدد اليها عدة طعنات حتى لا تكشفه ولا تقوم بمطاردته ثم فر من المكان وترك القطعة الحديدية والقى بالسكين الذى استخدمه فى الحادث خارج المنزل .<br />وأكد المصدر الأمنى أن التحريات التى قامت بها أجهزة البحث الجنائى والمعمل الجنائى أكدت أن الجانى كان يتعمد قتل نادين بتسديد طعنات غائرة وذبحها ، فيما كان يسدد الطعنات بصورة عشوائية للقتيلة هبة ، وسدد طعنات سطحية لها ولم يكن بها اى طعنة غائرة وهو ما يفسر أن هبة توفيت نتيجة نزف كمية كبيرة من الدماء .<br />وكانت ابنة المطربة المغربية ليلى غفران قد قتلت مع صديقتها نادين الخميس فى مدينة الشيخ زايد حيث تم العثور على هبة إبراهيم العقاد \"23 عاما\" مصابة بعدة طعنات بحي الندى ، وتم نقلها إلى مستشفى دار الفؤاد حيث لفظت أنفاسها الاخيرة لدى وصولها المستشفى، كما عثرت الشرطة على جثة صديقتها نادين خالد جمال \"23 عاما\" في نفس الشقة مصابة بعدة طعنات."
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044916/http://masr.20at.com:80/newArticle.php?sid=18695"

