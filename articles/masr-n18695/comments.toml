[[comments]]
order = 34
subject = "الموضوع مش موضوع سرقة شعب - دى موضوع تلذذ شعب بالع"
author = "فركش"
posted = "2008-12-12"
text = "لا<br />ملخص الكلام ان الشعب دة غير قابل للتطور<br />بيحب ينضرب على القفا باستمرار<br />شفتم اليونان<br />الشرطة قتلت صبى<br />البلد كلها من الشمال للجنوب ولعت<br />انما هنا 3 الاف بيغرقوا فى البحر او يحترق بهم قطار او الشرطة تضربهم بالرصاص الحى فى المحلة - ثم لا استجابة<br />جينات العبيد مسيطرة على هؤلاء الناس<br />فنحن فى مصر كنا تحت الاحتلال منذ خلقنا<br />مفيش اى فايدة"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

