subject = "لقد قتلنا وامامنا قتل شديد"
author = "مش قايل"
posted = "2008-12-08"
text = "الناس العواجيز اللي زيي فاكرين السادات بعد حرب اكتوبر قال في اول خطاب له<br />لقد قاتلنا وامامنا قتال شديد<br />وفيه برنامج اتعمل بعد انتهاء الحرب كان في المقدمة بتاعته جزء من خطاب السادات اللي بيقول فيه لقد قاتلنا وامامنا قتال شديد<br />الان تم تحريف العبارة لقد قتلنا وامامنا قتل شديد"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

