[[comments]]
order = 26
subject = "للأسف أسوأ التعليقات كانت من موقع قناة العربية"
author = "سامي"
posted = "2008-12-09"
text = "أتفق معك في كل ما قلتيه وكأن معتز الدمرداش مفكر نفسه صحفي بيفهم ولا انسان محترم - للأسف أن والدتك انسانة محترمة جدا..<br />يعني بيقول مش عايز ينشر في الموضوع ده وهو بنفس الوقت بيجرح والدة القتيلة الله يرحمها ..<br />ولكن أسوا المقالات التي كتبت عن هذه الجريمة هي مقالات موقع قناة العربية - بصراحة كله تجريح وإساءة للفتاتين وإهانة لأهلهم ..وفوق كل ذلك إهانة لقراء الموقع حيث وردت تعابير تتعلق بالشرف ومسيئة جدا - مرة تقول أن في الشقة آثار مخدرات وحشيش من السهرة السابقة ومرة تقول أن هناك شنطة فيها ملابس رجالية في شقة الفتاتين.. وتصف زوج هبة بأنه صديقها ولكن لديهم عقد زواج - مادام في عقد زواج حتى لو في السر يبقى اسمه زوجها ولا ايه يا جماعة؟<br />وأقترح أن يرفع أهل الفتاتين قضية تشهير وتجريح على الموقع وعلى قناة العربية<br />thesupersami@hotmail.com"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

