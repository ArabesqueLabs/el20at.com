[[comments]]
order = 43
subject = "الى دعاء الشامى"
author = "درس خصوصي"
text = "على فكرة يا دعاء انتى محتاجه تاخدى كورسات تعرفى يعنى ايه صحافه انتى كل مهمتك فى الحياة تطلعى كام كلم من دماغك من غير و لا تتعتبى و لا تفكرى<br />انت اتعلمتى فين يا حجة دعاء<br />حسبى الله و نعم الوكيل فيكى<br />حسبى الله و نعم الوكيل فيكى<br />حسبى الله فيكى و ان شاء الله ربنا هيخلص منك"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 44
subject = "الى المعلقين التلاته اللي فوق (اترضاه لامك) (اترضاه لاختك) (اترضاه لابنتك)"
author = "مش ححبك"
text = "الى المعلقين التلاته اللي فوق686<br />عيب كده اللي انتو بتقولوه دا<br />البابا شنوده بيسلم عليكم وبيقلكم عيب كده الالفاظ الوحشة دي يا مسلمين<br />والنبي محمد صلى الله عليه وسلم بيقول اترضاه لامك اترضاه لاختك اترضاه لابنتك<br />صلى الله عليه وسلم<br />المفروض الانسان سواء كان مسلم او اي ديانة قبل ان يتعرض لانثى باي شيء يتذكر امه او اخته او ابنته<br />سلام"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"
