[[comments]]
order = 2
subject = "طيب مين اللى قتل الفنانة ذكرى - واهى اندفنت بسرها"
author = "عبد الجبار"
posted = "2008-12-02"
text = "من قتل نفسا بغير حق كانما قتل الناس جميعا - اليس هذا كلام القران وشرع اللة<br />قتل النفس ايا كان صاحبها ليس امرا سهلا<br />ازاى ندفن اللى مات ونسكت - وشكر اللة سعيكم - وعظم اللة اجركم - وربنا يرحم الجميع - والحكاية بح خلاص<br />مفيش يا اخت دعاء فى الاسلام حاجة اسمها القاتل مجهول او مش معروف او تحفظ القضية لعدم وجود ادلة<br />على ما حسب ما سمعت من احد مشايخنا الازهريين القدامى وليس المشايخ الخنافس بتوع الكمبيوتر واللغة الانجليزية قال شيخنا<br />نفترض انة وجد انسانا مقتولا فى قرية او مدينة او مكان ما<br />ولم يعرف قاتلة ولم يستدل علية - فما حكم الشرع ؟<br />الحكم هو وجوب دفع الدية لاهل القتيل وتجمع من جميع سكان قريتة او بلدتة بالتساوى وتدفع لاهلة مثل زوجتة واولادة<br />مفيش حاجة اسمها دم هدر<br />لا<br />طيب وفى الزمن الحالى - ندفع الدية ازاى - يبقى من بيت المال او الخزينة العامة<br />من قتل نفسا فكانما قتل الناس جميعا"
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044916/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 3
subject = "رجالة هشام مصطفى طلعوا كتاب بيقولوا فية ما ملخصة ا"
author = "اة يا زمن"
posted = "2008-12-02"
text = "بالمنطق دة ان كل المغنيات والمطربات والراقصات وبتوع الفن والتمثيل فسقة وبينشروا الفساد فى المجتمع ووجب قتلهم وان اللى عملة الاخ هشام مصطفى كان صح والقاضى يحكم لة بوسام شرف الفضيلة مع حكم البراءة<br />لكن القاضى بناءا على هذا الكتاب منع الحظر فى النشر عن هذة القضية<br />وجرت فى الاسابيع الماضية مساعى فى دبى لفك تلك المشكلة بدفع الدية وانتهى الموضوع<br />وانا شايف ان الكاتبة بتأيد فى مقالها بقفل الموضوع وخلاص ونكفى على الخبر ماجور<br />زمان فى التاريخ العربى<br />انة كان قاضى فى اليمن اسمة الربيع العامرى<br />واشتكى احد العرب ان كلبة قتل وان القاتل هو كلب جارة<br />فقضى او حكم القاضى بقتل الكلب القاتل جزاءا وفاقا<br />فتندر الناس بالحكم بقتل الكلب القاتل وقال شاعرهم متهكما<br />اشهد ان اللة حق لقائة ------------------------------------------- وان الربيع العامرى رقيع<br />اقاد لنا كلبا بكلب ولم يدع -------------------------------------- دماء كلاب المسلمين تضيع<br />صباح الفل"
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044916/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 4
subject = "كلامي فسر بشكل خاطيء"
author = "دعاء الشامي"
posted = "2008-12-02"
text = ",واضح ان كلامي تم تفسيره بشكل خاطيء فوفقا لما أقصده لم أطلب في اي من سطور المقال أن نترك القاتل ولا ان نقيد قضايا القتل ضد مجهول ما طرحته واضح وصريح لا تخوضوا في أعراض الموتى يا جماعة خصوصا اني اعرف جيدا ان الهدف من وراء تناول الاعلام للقضية ليس المعرفة ولا تزويد الراي العام بالمعلومات اللسيمة ولا دياولو هي ناس بتسترزق وبس يعني صحفي يعمل خبر وموقع فني يعمل سبق، لكن القضية نفسها والحقيقة تضيع وسط ما نشره فلان وما عرضه ترتان<br />الاسلام بريء مما يحدث وحتى الفساد بريء كمان في الحقيقة هي رغبة متاصلة فينا للنم على الناس ونهش أعراضهم وبس والا يا جماعة ممكن حد يفسر لي ليه كل ما نشر عن قضية قتل الفتاتين في الشيخ زايد طلعت فشنك وفرقعة ولا كان فيه مخدرات ولا عشاق ولا حقن رحم ولا مشي بطال ؟؟<br />وليه يعني الصحف ركزت قوي على بنت ليلى غفران؟؟<br />وممكن اعرف مين في حضارتكم يعرف اخر اغنية غنتها الست ليلى؟؟<br />ولا هي بقت مشهورة ومهمة فجأة كده؟؟"
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044916/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 5
subject = "اللة ينور عليكى -- الموضوع فرقعة اعلامية للتغطية ع"
author = "ماشى"
posted = "2008-12-03"
text = "القضية التانية للتغطية اعلاميا على قضية هشام مصطفى وصرف الراى العام عنها لتنتهى بدية ويتقفل الموضوع<br />والحمد للة ان اللى قتل بنت ليلى وصديقتها لم يكن واحد مختل عقليا ولا مضطرب نفسيا وكمان لم يكن الماس الكهربائى لعنة اللة وانما طلع نجار مسلح رايح يسرق ومعاة عتلة وضربهم بالسكينة او المطوة وبعدين لم يسرق شيئا<br />يعنى النجار كان بيمر بضائقة مالية فراح قتل بالسكينة ولم يسرق شيئا<br />فية حاجة كدة المؤلف خميس فجلة دخلها فى السناريو مش مبلوعة<br />ولية اللى قتل ما يكنش سامى سكرى تانى ولبسوها لنجار مسلح يمكن كان ماشى من غير بطاقة وقبضوا علية<br />الحكاية بقت قرف وتجيب غثيان وانعدمت الثقة بين الناس والحكومة وبالذات بتوع تاليف الروايات وكاننا مجموعة من الاغبياء"
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044916/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 6
subject = "وطلع نجار مسلح - وطلع نجار مسلح ومعاة عتلة وعلشان"
author = "قف"
posted = "2008-12-03"
text = "طيب النجار يطلع السكينة ويهدد هاتى اللى معاكى يا بنت انت وهى وطلعى الموبايل والدهب بتاعك<br />وياخد الحاجات دى ويهرب<br />انما الفيلم الهندى بتاع الداخلية فمش مبلوع<br />انتم شفتم تحقيق شرطة دبى فى قضية سوزان وكيف توصلت للقاتل فى وقت وجيز وبطريقة علمية وبدون القبض العشوائى على الجيران والمعارف<br />فية فرق بين العلم وفية فرق بين الجهل واستخدام اساليب المماليك والاتراك فى القبض على اى واحد والاستمرار فى تعذيبة حتى يعترف<br />وبعدين الموضوع تضخم قوى فى صحف الحكومة وقالوا ان الفحص للجثث بين وجود تضخم غير طبيعى فى الرحم وان فية حقن مش عارف بتعمل اية - فين محاكمة رؤساء التحرير على الاكاذيب والا المحاكمة بس لبتوع الدستور وصحف المعارضة<br />واللة يا جماعة انا حاسس ان الموضوع فية هشام مصطفى تانى وسامى السكرى تانى او واحد زميلة وان الحكومة بتغطى على الفضايح بتاعت رجال الاعمال بتوعها<br />وبكرة نقعد جنب الحيطة ونسمع الزيطة"
archived = "2008-12-04"
capture_url = "https://web.archive.org/web/20081204044916/http://masr.20at.com:80/newArticle.php?sid=18695"

