[[comments]]
order = 28
subject = "ضع عنوان التعليق"
author = "منقول بواسطة (مش)"
posted = "2008-12-10"
text = "والد القتيلة \"نادين\" يقاضي 17 صحيفة ومجلة خاضت في عرضها<br />خالد جمال الدين والد القتيلة نادين<br />محيط: انتهي الطب الشرعي من كتابة تقريره في حادث مقتل هبة ابنة ليلي غفران وصديقتها نادين، فيما قام والد نادين برفع داعوي ضد 17 صحيفة ومجلة اتهمها بالخوض في عرض ابنته.<br />وذكرت جريدة \"الوفد\" أن التقرير الذي لم يسلم للنيابة أشار إلي وفاة الضحيتين بهبوط حاد في الدورة الدموية إثر طعنات مختلفة بالجسم، وحدد التقرير اصابة هبة بـ 11 طعنة ونادين بـ 8 طعنات وجرح ذبحي بالرقبة، وأكد التقرير أن القتيلة نادين مازالت عذراء.<br />في غضون ذلك قرر محامي والد نادين، خالد جمال تقديم بلاغات واقامة دعاوي ضد 17 صحيفة ومجلة خاضت في عرض الفتاتين، وكذلك إقامة دعوي قضائية ضد إدارة حي الندي للمطالبة بـ 2 مليون جنيه تعويضا لاهمالهم في الحفاظ علي أمن السكان، كما تقدم محام آخر للدفاع عن المتهم محمود سيد عبدالحفيظ بدلاً من المحامي الحالي وأعلن عن تقديمه بلاغا ضد محرر بجريدة قومية يومية أجري حوارًا مع المتهم واصدر حكمًا بإدانته واتهمه بالاجرام قبل صدور حكم من المحكمة . وقد تسلم أمس والد نادين متعلقاتها الشخصية بعد صدور قرار النيابة، كما تم ترحيل المتهم محمود سيد عبدالحفيظ إلي سجن طرة أمس .<br />يأتي هذا فيما رجحت الفنانة المغربية ليلي غفران أن يكون القاتل الحقيقي لابنتها هبه وصديقتها نادين ابن شخصية مصرية معروفة واستبعدت ان يكون هو الشخص الذي أعلنت الداخلية عنه، مشيرة إلي ان قضية اعتقال قاتل ابنتها \"مفبركة\".<br />وبحسب تصريحاتها لصحيفة \"الجريدة الأولي\" المغربية قالت غفران إن إعلان اعتقال القاتل من قبل السلطات المصرية، الغرض من ورائه إسكات الرأي العام والصحفيين المتابعين لمستجدات الملف منذ يوم وقع الحادث المؤلم فجر الخميس قبل الماضي. وأضافت \"لا يعقل أن يكون الجاني قتل ابنتي وصديقتها نادين ـ التي فصل رأسها عن جسدها بعد أن قطع رقبتها ولسانها ـ بغرض الحصول علي 200 جنيه مصري ويترك مجوهرات ثمينة من الماس وكاميرا وهواتف محمولة متطورة. وأكدت غفران تضامن النيابة المصرية والسفارة المغربية فى القاهرة معها إلي أقصي الحدود ."
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 29
subject = "الضربات التى تعرضت لها الفتاتين هى ضربات شخص محترف"
author = "مهموز"
posted = "2008-12-10"
text = "الضربات لقاتل محترف متخصص حاصل على دورات<br />انما ضربات عشوائية لحرامى فلا تكون بتلك الطريقة ولا بقطع اللسان<br />الحرامى بيضرب علشان يهوش علشان يهرب ومش بينتقم<br />لما بيمسكوا حرامى فى اتوبيس او فى الشارع بيطلع سكينة او مطواة بيهوش بها علشان محدش يمسكة ويضرب ضربات خفيفة ويهرب<br />انما الموضوع هنا مش محتاج شرح<br />عيل زميلها فى الجامعة الامريكية لة بودى جارد او ابن احد الكبار<br />العملية هيصة"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 30
subject = "الامن سمعة البلد"
author = "هذا رأيي"
posted = "2008-12-11"
text = "الامن سمعة البلد<br />علشان خاطر كده دبي كشفت محسن السكري بعد خمس ساعات من ارتكاب الجريمة لكن دبي مركز مالي عالمي وحبت تثبت سمعة دبي الامنية لان الامن يؤدي الى الاستقرار والاستقرار يؤدي الى الاستثمار<br />اين سمعة مصر<br />لما واحدة او اثنين يتقتلوا وبعدين يقولوا نجار مسلح سرقهم علشان خاطر 200 جنيه<br />دا كلام يا يا سيادة اللواء حبيب العادلي<br />ما يصحش كده<br />ما يصحب امارة دبي فيها مليون واحد وعمرها 30 سنه يبقوا عندهم امن افضل من دولة عمرها 7000 سنه<br />سلام"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 31
subject = "لا تقارن مصر بدبى - مقارنة ظالمة - فعمر دبى 30 سنة"
author = "كنت فى دبى"
posted = "2008-12-11"
text = "هذا حقيقى<br />دبى تسبق مصر فى الحضارة ب 7000 سنة حضارة<br />ادخل اكبر قسم شرطة فى دبى وقابل اكبر ضابط فية - هيقابلك باحترام ايا تكون وهيجيب لك شاى فى مكتبة بلا عنجهية ولا منظرة كدابة ولا نفخة كانة مش عارف اية<br />شيخ امارة دبى وميزانية دبى المالية اكبر من ميزانية مصر بيركب سيارتة بنفسة ويسوق فى الشارع بدون اى حرس ولا قفل شوارع ولا موتوسيكلات ولا قناصة ولا عشرة الاف عسكرى بيحرسوا الموكب ولا تشريفة ولا يحزنون وبتقابلة مدرسة بيدخل يتفقدها ويشرب شاى مع مدير المدرسة ويمشى<br />فارق حضارى كبير جدا اكتر من 7000 سنة بين دبى ومصر<br />ويؤسفنى ان اقول ذلك وانا مصرى ولكن تلك هى الحقيقة<br />ومؤسسات دبى فيها الانسان محترم جدا<br />القاضى فى المحكمة بيقعد على مكتبة فى غرفة والمتهم جالس امامة على كرسى والعسكرى برة على باب المكتب وبيحل القضية فى نفس اليوم<br />انما فى مصر علشان مخالفة مرور تنحط فى القفص ونيابة وحجز وحبس وتعقيدات وكفالة وتقعد تتبهدل شهرين وحاجة اخر قرف<br />لا لا لا لا لا مقارنة بين ناس فى عصر المماليك وناس فى القرن الواحد وعشرين"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 32
subject = "نكتة"
author = "gh"
posted = "2008-12-11"
text = "انتشرت تجارة زرع الاعضاء فى مصر فى مصر فى السوق السوداء فى الفترة الاخيرة وفى احد المستشفيات الخاصة كانت هناك قائمة باسعار الاعضاء<br />الكلية 10 الاف جنية<br />الكبد 40 الف جنية<br />اليد 50 الف جنية<br />وبالنسبة للمخ يوجد لدينا مخ قابل للزرع بالاسعار التالية<br />مخ من راس عامل ب 15 الف جنية<br />مخ من راس مهندس متوفى ب 3 الاف جنية<br />مخ من راس طبيب متوفى ب 3 الاف جنية<br />مخ من راس كيميائى متوفى ب 5 الاف جنية<br />مخ من راس ضابط متوفى ب 100 الف جنية وكتب بجانبة مخ على الزيرو لم يستخدم قط وبحالة الفبريقة"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

