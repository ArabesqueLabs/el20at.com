subject = "حضارة 7 الاف سنة - ها ها ها ها ها ها ها"
author = "معجب"
posted = "2008-12-05"
text = "قضية النجار المسلح وقتلة فتاتين علشان 400 جنية قصة رائعة اضحكت على جهاز الشرطة المصرى العرب من الخليج الى المحيط<br />كانت احلى فيلم تابعتة فى جميع الصحف العربية ووكالات الانباء - من العربية الى ايلاف وغيرها وضحك الناس كثيرا على الفيلم بتاع الداخلية<br />السناريو 10 على عشرة<br />التاليف عشرة على عشرة<br />التمثيل عشرة على عشرة<br />الظلم عشرة على عشرة<br />افتراء عشرة على عشرة<br />تلفيق عشرة على عشرة<br />كلة فى التمام وفى السليم يا باشا<br />جهاز الشرطة ال وبيقول لك اكاديمية مبارك للشرطة<br />هشك بشك - وسلامتها ام حسن"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206044818/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 14
subject = "القضاء الادارى يلغى قرار وزير الداخلية بمنع ايمن ن"
author = "هو وهى"
posted = "2008-12-05"
text = "وزير الداخلية الهمام اصدر قرارا بمنع ايمن نور من الصلاة وصلاة الجمعة فى المسجد وعلى حسب ما نشرت جريدة المصرى اليوم فقد الغى القضاء الادارى الحكم<br />وانا اشك ان وزير الداخلية قد امسك مصحفا مرة وقرأ<br />ارايت الذى ينهى عبدا اذا صلى<br />او قرأ<br />كلا تطعة واسجد واقترب<br />كنت غير متعاطف مع ايمن نور<br />ولكنى ومع هذة القرارات الصبيانية التى يرضى بها رؤسائة تعاطفت مع ايمن نور<br />هل تصل الامور ان يمنع وزير الداخلية مواطنا من الصلاة"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206044818/http://masr.20at.com:80/newArticle.php?sid=18695"

