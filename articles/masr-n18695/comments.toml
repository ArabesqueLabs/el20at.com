[[comments]]
order = 21
subject = "عجبتنى كلمة من كلام الورق"
author = "حازم"
posted = "2008-12-06"
text = "السوس شرق من بين حروفها وبرق 00000000 وعجبى<br />الكلام اللى حضرتك قلتية جميل جدا وينم عن شخصية واعية تعرف جيدا ماذا تكتب<br />وتعرفجيدا كيف تعبر عن ارائها التى من لممكن أن لاتعجب أحدا<br />فن المقال اسمة فن ولكن الحقيقة انها ليست بصنعة ولا تقليد متبع ولكنها تعبير عن وجهة نظر تعبر عن كاتبها وعن قناعاتة الشخصية<br />عجبنى جدا أسلوب الكتابة والذى ينم عن شخصية تجيد فن الكتابة المحترمة والذى كما ذكرت نفتقدة كثيرا<br />فكثير من مشاهير الكتاب يخرقون ميثاق الشرف الصحفى والمهنى وكذا يخرقون أبسط القواعد التى يجب على كل كاتب أن يحترمها ويراعيها عندما يكتب مقالا أو تقريرا أو تحقيقا<br />أنا لا ععطى دروسا سامحنى الله ولكن 00000 هى نقاط أحببت أن استخلصها من مقالك البسيط الجميل<br />بالمناسبة هذة هى المرة الثانية التى أعلق فيها على هذا الموقع واخترت بيتا من أبيات صلاح جاهين ومش فاكر الباقى فعذرا<br />ولكن الكتابة التى تكون لجمهولر فى هذة الايام دوما تكون موجههة لاسباب كثيرا من الواعين يعرفونها جيدا<br />وهذا ما استخلصتة من بين السطور وعذرا للاطالة مقال جيد 0000 وشكرا"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 22
subject = "الى الجاهل اللي فوق (النور شرق وليس السوس يا جاهل)"
author = "مش ححبك"
posted = "2008-12-07"
text = "عجبتني كلمة من كلام الورق<br />النور شرق من بين حروفها و برق<br />حبيت أشيلها ف قلبي .. قالت حرام<br />ده أنا كل قلب دخلت فيه اتحرق<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />هذه مقطوعة من قصيدة لصلاح جاهين<br />بس طالما انت بتتذوق الكلام كده وبيعجبك ازاي كتبت السوس بدل النور<br />انت لو معاك الابتدائية ما كنتش كتبت السوس شرق من بين حروفها<br />يعني شلت النور وحطيت السوس فذميت المقال وكاتبته<br />روح يا ابني شفلك وكسه توكسك"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
order = 23
subject = "جريمة يوم امس الاول مش لبنات فنانات ولكن لمصرية"
author = "سنكوح"
posted = "2008-12-07"
text = "سيارة ميكروباص تسير على الطريق الصحراوى<br />اعترضتها عصابة مسلحة واوقفتها وانزلت منها سيدة وابنتيها وتركت السيارة تسير واخذ الام وبتيها الى داخل منطقة صحراوية<br />وهناك اغتصبوا بنت من البنات امام امها واختها واخذوا ما معهم من نقود وموبيلات وذهب وتركوهم<br />وتجرى الشرطة البحث<br />ولكن لانهم ليسوا فنانات ولا ابناء فنانة ولا مطربة ولا رقاصة فالاعلام تناول الموضوع باختصار وايجاز ولم يتابع<br />اننا مقبلون على فترة خطرة جدا من حياتنا<br />ان تفشى الفقر بواسطة السياسات المستوردة ستصل بالمجتمع المصرى الى الجحيم<br />ربنا يستر على البلد"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103055/http://masr.20at.com:80/newArticle.php?sid=18695"

[[comments]]
