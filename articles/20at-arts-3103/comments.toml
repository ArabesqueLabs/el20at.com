text = "يعنى يا اخ براء مجبتش سيرة الاخوان فى موضوعك ده ليه ,, ممكن يكونوا هم اللى بيالفوا الاغانى للعسيلى , عشان كده تلاحظ ان اغانية مفيهاش العك بتاع العين والشفايف والشعر و......... !! مش ممكن برده ولا مصادرك الخاصة مجابتش لك الخبر ده يابراء<br />العسيلى اخوانى قديم ,, زي حلاتك كده .<br />سلملى على شرف المهنة يا براء . للاسف انت حطيت نفسك فى مستنقع النفاق مع عمو كرم \" روزاليوسف \" و المخبر \"حمدى \"<br />بيع ياعواد بيع ................................."
