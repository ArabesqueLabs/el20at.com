subject = "ارحمونا هؤلاء لافنانين ولاهباب"
author = "مصري"
posted = "2007-01-24"
text = "ياخلق هوووووووووه هؤلاءجميعا من المؤديين الجدد حرام عليكم ان تكتبوا عليهم لفظ فنان او مطرب هؤلاء معلوماتهم عن الفن والغناء معلوماتي عن اللغة الصينية هؤلاء شوية بلطجية الواحد منهم بيؤدي مثل الماكينة لا يطرب حتي الحمار صوتة يؤذي الاذان وشكلة الله واكبر ياخلق هوووووه المطرب من يطرب القلب والاذن له المغني لازم يكون عندة موهبة مش صوت زمارة ولازم يكون دارس فن الغناء ودارس جيد للمقامات الغنائية واقترح علي الفريق وزير الدفاع ان يلمهم وياخذهم يحلق لهم ويدخلهم الجيش علشان يبقوا رجالة الاول دول شوية شواذ وبهدلوا ثلاثة اجيال واثرهم اكثر من المخدرات والبدرة والبانجوا في تدمير شباب مصر والاجيال القادمة رحم الله ام كلثوم ورياض السنباطي وفريد وعبد الحليم وشادية ونجاه ولله يازمري؟"
