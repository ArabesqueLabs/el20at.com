posted = "2007-01-24"
text = "اولا وحشنا تحليلك الفنى الرائع<br />فكرتنا بايام دم الغزال<br />انا معاك ان العسيلى سايب بصمه و دى مش حاجه سهله وسط العبث الفنى الحالى<br />و انه رغم ان قدراته الصوتيه محدوده قدر يجذبنا<br />الاغانى اللى انت معلق عليها كويسه بس انا بعتبر ان اغنيع رايح على فين من اجمل اغانيه و ان كان تصويرها اللى جه بشكل funny شويه بيخرجنا من مود الغنوه بس فعلا من اجمل اغانيه<br />و اخيرا متحرمناش من مقالاتك الفنيه"
