posted = "2007-01-24"
text = "حلو اوى يا براء ... ايه الرومانسية دى يا ولد ... جامد و الله<br />و بعدين ايه المشكلة يكون اخوانى خواجه مع اعتذارى يا براء....<br />و بعدين احنا كلنا بنكتب من وحى خلفياتنا الثقافية و الأيدولوجية .... و ما تصدقشى اللى بيقول انه بيتكلم بحياد!!!!!!!!!<br />انا متفق معاك ان اغانى العسيلى مختلفة ... و دة يحترم<br />و مش فاهم الأخ بتاع الأتهام بالنفاق مع روز اليوسفّّّّ !!!! هوا ايه الللى قالوا براء يستاهل الاستهزاء بيه!!!!<br />حسك الفنى عالى يا براء و بعدين يابنى الأنتساب للاخوان شرف مش سبة ..... سيبك من اللى ماسكين فزاعة الاخوان لكل من يتكلم بالحق!!!"
