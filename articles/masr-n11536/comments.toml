[[comments]]
order = 0
subject = "مشروب وطنى 100%"
author = "السوهاجى باشا"
text = "عصير القصب مشروب وطنى 100% ولا فية كيماويات ولا اضافات ولا صبغات صناعية ولا فية صودا ولا غازات<br />ومن انتاج بلدنا<br />بقى فىزمتك مش احسن من البيبسى والكولا<br />يعنى لو طورناة شوية وبعناة فى قزايز مش نكسب"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105243/http://masr.20at.com:80/newArticle.php?sid=11536"

[[comments]]
order = 1
subject = "امممممممممممم"
author = "سما"
text = "الله على عصير القصب هو فى احلى من كدا وكمان مفيد اوى للكلى<br />طيب هاتولى دلوقتى كدا عشرين كبايه وانا اشربهم وعلى رئي سوهاجى لو عملناه فى ازايز هنكسب دهب والله"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145735/http://masr.20at.com:80/newArticle.php?sid=11536"

[[comments]]
order = 2
subject = "عصير قصب صنع في مصر"
author = "خالدالامير"
text = "عصير القصب المنتج المصري 100% وهو منج صعيد الاصل علشان كده اصيل وبعالج امراض زي الكلي ويرطب علي القلب وهو الحاجه الوحيده الي لسه محتفظ بمصريته لانه صعيدي اصيل"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145735/http://masr.20at.com:80/newArticle.php?sid=11536"
