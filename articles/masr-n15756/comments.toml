[[comments]]
order = 0
subject = "صباح الخير يا ابو النسانيس"
author = "مصرى"
posted = "2008-05-13"
text = "هيص يا عم<br />محظوظ<br />طول النهار بتاكل فول سودانى وموز<br />دمة شربات<br />نسنوس عين امة<br />سحنة عكرة تجيب ابو الفقر فى البنك المركزى"
archived = "2008-05-13"
capture_url = "https://web.archive.org/web/20080513181338/http://masr.20at.com:80/newArticle.php?sid=15756"

[[comments]]
order = 1
subject = "يا لهوى يا عشرينات"
author = "هدى"
posted = "2008-05-13"
text = "ارجوكم دى صورة تنشروها<br />يا عالم يا شر انا حامل<br />انتم عايزنى اخلف اية ؟"
archived = "2008-05-13"
capture_url = "https://web.archive.org/web/20080513181338/http://masr.20at.com:80/newArticle.php?sid=15756"
