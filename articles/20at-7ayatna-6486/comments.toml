text = "يعنى المقال بدا وانتهى من غير ما نعرف مين هما الطوارق. طب كنتوا اديتونا نبذة ولو مختصرة ولا حتى مين اللى سماهم كده . يا خوانا هي ناقصة توهان . ما كفاية اللي عاملينو فينا المواكيس بتوع الحكومة.<br />لاشك أن الصورة المرفقة بالموضوع غاية في الغموض والتشويق لكن تناول الموضوع لم يأت بالشكل المطلوب"
