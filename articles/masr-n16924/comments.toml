text = "كما تعلمون ان دولة الامارات 7 امارات بينهم اتحاد كونفدرالي ويشكلون سويا دولة الامارات<br />فالنادي هنا ينسب الى الامارة ولا ينسب الى دولة الامارات<br />فاهلي الامارات خطأ لان فيه الادي الاهلي في امارات ثانية وعلى سبيل المثال لا الحصر اهلي الفجيرة<br />وشكرا"
