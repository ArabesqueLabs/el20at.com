[[comments]]
order = 0
subject = "شرقاوى ش - ك - ع كاورك عبيط اصلها اية"
author = "برضة انا شرقاوى"
text = "زمان ايام اجدادنا الفراعنة كانت عاصمة اقليم الشرقية مكان مايعرف الان بتل بسطا وفيها معبد فرعونى شهير<br />وكان الناس فى تلك المنطقة يرمزون لمعبودهم برسم القط وكان القط حيوان مقدس عندهم<br />وجاء جيش الفرس بقيادة قمبيز اثناء دخولة الى مصر بالهجوم على مدينة تل بسطا حيث كان بها جيشا كبيرا من الشراقوة الابطال فى انتظار المعركة الفاصلة<br />وفى الصباح استعد الجيشان للقتال<br />واعد الفرس مفاجأة من النوع الثقيل للشراقوة<br />رسموا على دروعهم القط بسطا الذى يقدسة الشراقوة<br />هل يقاتل الشراقوة الفرس ويضربون بسيوفهم القط المقدس المرسوم على دروع الفرس<br />كلا<br />لقد هربوا لكى لا يضربوا معبودهم على دروع الفرس<br />ودخل الفرس المدينة ودمروا معبد المعبود القط<br />واطلق عليهم سكان مصر كلها الشراقوة العبط<br />ورغم اننى شرقاوى كاورك عبيط بالوراثة فانها قصة من التاريخ"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113930/http://masr.20at.com:80/newArticle.php?sid=15612"

[[comments]]
order = 1
subject = "آمل"
author = "من السعودية"
text = "والله ظننت الموضوع عن محمد الشرقاوي وكريم الشاعر ، آمل أن أسمع عن أخبارهما ، وأخبار غيرهم من الذين فقدوا حريتهم دفاعا عن الحرية ."
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113930/http://masr.20at.com:80/newArticle.php?sid=15612"

