subject = "تفتكر لو كان السموره ده هو اللي جوه التاكسي كان ايه اللي حصل؟؟"
author = "mostafa"
text = "تفتكر لو كان السموره ده هو اللي جوه التاكسي كان ايه اللي حصل؟؟<br />اكيد الرصاصه عمرها ما كانت هاتيجي في دماغه.... ليه؟؟؟؟؟<br />الحكومه ها تقولك اصله كان اعزل مع انه كان معاه سلاح فحبينا نضرب على الكاوتشات برضو خيشت....<br />علشان كده هرب ..... قدر الله وما شاء فعل...<br />ماهو عندنا في بلدنا دي كل حاجه ماشيه بالمشقلب........"
archived = "2007-12-11"
capture_url = "https://web.archive.org/web/20071211200036/http://masr.20at.com:80/newArticle.php?sid=13333"
