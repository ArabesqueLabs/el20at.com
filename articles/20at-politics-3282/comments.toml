[[comments]]
order = 2
subject = "كركوك في دمي فماذا افعل لها...يايها السادة؟؟؟"
author = "كركوكية الاصل..."
posted = "2007-03-02"
text = "نسيت اجويب على عنونكي ياعزيزتي منى<br />وماذا لو كنت كركوكيا؟<br />فانا اصلي كركوكية وان شاء الله راح اعملها شي في المستقبل...فلا اريد ان تتمزق امامي وانا حياه<br />ياريت جسمي يتقطع قطعه قطعه ويكون حفظ وامان لبلدي...<br />الان لا اقدر اعملها شي بسبب صغر سني واني مع عائلتي...يعني غير مستقله<br />لكن ارجع واقول لا اريد ايخذني الحماس..فأن شاء الله لا اكون علة على بلدي الحبيب<br />لكن...<br />اعدكم لا تركها هكذا فهم اهلي وناسي وارضي واصلي...<br />مشكوره عزيزتي منى سليم"
