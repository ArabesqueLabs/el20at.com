text = "صعب اوى التعليق على هذا<br />بس حنعمل اية ؟<br />انا شايفة ان احسن من حكم العراق كان هو صدام ؛ لا حكم العراق يحتاج لحكمة معينة وقوة معينة وغموض معين وتجمع ذلك فى شخص واحد كان صدام .<br />وهذا ليس حكم على شخصية صدام وانما اقرار واقع ؛ فراى فى صدام قد يكون مختلف ."
