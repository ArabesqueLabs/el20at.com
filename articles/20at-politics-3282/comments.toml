[[comments]]
order = 3
subject = "اين الوطنية؟؟؟؟"
author = "احمد ضياءالدين"
posted = "2007-03-11"
text = "سلامي الى كل الوطن، من شمالها الى جنوبها، و الى شرفاء مواطنيها، عربا و تركمانا و اكرادا. انا من كركوك، و بالنسبة للاكراد فهي مثل القدس في فلسطين حسبما يقولون في شعاراتهم، و انا اعرف انهم ما كانو يعيروها اي انتباه اذا لم تكن تحوي النفط الذي يريدون ان يقوو به اقتصادهم. هم سقولون ان كركوك قلب كردستان، ناسين اهلها و تاريخها. هم يمثلون نفس دور اليهود في فلسطين، بسلب الناس حقوقها و كرامتها. هم اصبحو صاحب الجبروت في هذا الزمن العصيب الذي هو زمن الخونة و الحرامية. بعد ان نهبو بغداد و كنوزها، هاهم يطالبون بكركوك لينهبو اصلها و نفطها. كانت حجتهم ظلم صدام حسين، و هذا صدام فد مضى، لكنهم ابو ان يكونو عراقيين، بل هم كردستان، و هم يطالبون بالفدرالية لكي يستقلو عن العراق مستقبلا. انهم يستخدمون نفس منهج اليهود في فلسطين. يريدون ان يتحدو مع اكراد المنطقة، و بالتالي يدمرون كل التوازن في المنطقة. اتكر طالبة كردية كانت زميلتي في جامعة بغداد، كان عمرها في العشرين، و كان الزمن بعد انتهاء الحرب الغادرة الاخيرة، قالت بكل افتخار، انا لست عراقية، بل انا كردية. يا سلام على الاكراد و هم في العشرين، يا ترى كيف ستصبح عندما تكون في الاربعين و كيف يصبح اولادها.<br />أن كركوك كانت و ما تزال و من الازل، مدينة لكا القوميات، و لا يمكن ابدا ان تطغى فيها قومية على اخرى. ربما قد تشرد اهلها الان، و اصبح مثقلا بساكنيها الجدد( 600 الف كردي نزحوا الى المدينة لغرض النجاح في الاستفتاء حول المدينة)، الا ان التاريخ لم و لن يظلم احدا، و ستصبح كركوك عنوانا للوطنية بمساعدة اهلها. فهنيئا للاكراد كردستانيتهم، و هنيئا للعراقيين الشرفاء عراقيتهم."
archived = "2010-03-14"
