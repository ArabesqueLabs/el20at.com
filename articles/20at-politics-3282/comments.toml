subject = "كركوك تبكي ولأجلنا تضحي..."
author = "كركوكية الاصل..."
posted = "2007-03-02"
text = "مسكينة كركوك كنما انخلقت لغيرها لا لأهليها وناسها...وكنما انخلقت للأحتاااااااااال...<br />تألمت كثيرا ً وعانت كثيرا ً وتمزقت كثيراً وبكيت كثيرا ً...فلا تدري الى متى ينتهى تاريخ هذه الالم...<br />فلا ادري مااقول في هذه المدينة المسكينه فقدت من ناسها ونهبه نفطها وسرقت امولها واختفت ملمح تاريخها وفقدت علمها وعلماها...<br />وكل هذا تأتي الدول الجوار مثل تركيا تريد ان تضم كركوك الى باقي مدنيها فوق ماهي محتله من الدول الاجنبيه..فما تقولوا ياساده في هذا الكلام...!!؟؟؟<br />لمـــــــــــــــاذا كل هذا لمـــــــــــــــــــــــاذا...!!؟؟؟<br />اما عن الحق فماذا ترون انتم...!!!<br />الاهم الحق ان ياخذه املكنا مثل الاحتلال او الدول الجوار ونظل ساكتين عنهم مثل الشيطان اخرس<br />نتباسم في وجههم...<br />فماذا هذا يعني...!!!؟؟؟"
archived = "2010-03-14"
