[[comments]]
order = 4
subject = "ربنا يصبرنا"
author = "مخنوق"
text = "بصراحة الشعب دا يستاهل اكتر من كدة..!!!!!! عشان لما الناس تقول اضراب يوم 4 مايو كان المفروض نكون ايد واحدة...مش زى ما شفنا يومها الحياة ماشية عادى والناس بمنتهى البرود ماشية فى الشوارع واللى يشوفهم يومها يقول دا شعب سويسرا او السويد..!!!!!!! مش شعب بيضرب فى بعضه عشان يشترى 5 ارغفة الكلب يقرف ياكلهم..!!!!! اشربوا بقى يا شعب مصر..!!!!!!! وكل علاوة وانتم مكويين...!!!!!!!!!! مفييييييييييييييييييييييييييييش فايدة..!!! هى دى مصر يا عبلة...!!!!!!!!!!!!!!!!!!!!!"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510093935/http://masr.20at.com:80/newArticle.php?sid=15637"

[[comments]]
order = 5
subject = "اتق الله ياحسين ياكامل"
author = "سعدون المجنون"
text = "يا عم حسين ياكامل // ان كنت تعلم فتلك مصيبه ----- وان كنت لاتعلم فالمصيبة اعظم ؟؟؟ يعنى انت عايز تفهمنا انك مش فاهم ان الريس كان عارف ان فى زياده فى اسعار البنزين والسجاير قبل مايضحك علينا بحكاية ال30% دى -- تبقى مغفل والله وحرام عليك وقتك اللى بضيعه فى قناة العربيه وموقع عشرينات ودفاعك عمال على بطال عن استاذك هولاكو"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510093935/http://masr.20at.com:80/newArticle.php?sid=15637"
