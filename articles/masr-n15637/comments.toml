[[comments]]
order = 1
subject = "سياسة الفقر للشعب المصرى تمولها وتخطط لها الوكالة اليهودية"
author = "ابو حباجة"
text = "حتى لا تستطيع مصر محاربة اسرائيل ولو بعد قرن من الزمان<br />وضعت الوكالة اليهودية مخططاتها<br />تولية عملاء للوكالة الحكم فى مصر يقومون بتفيذ السياسة المطلوبة<br />رفع اسعار الديزل يؤثر على الفلاح الذى يستخدم الجرار فى الحرث وماكينة الرى وعربية نقل الخضار من القرية الى المدينة<br />اذن الخضار والارز والقمح كلها ستزيد الى الضعف<br />سيزحف الشعب على بطنة ليلعق التراب ويشرب من ماء المجارى ولا يفكر ابدا فى النضال ولا التحرير ولا حتى رفع رأسة<br />سوف يبقى شعبا جائعا يلهث وراء لقمة ملوثة وخروجة تماما من خريطة البشر<br />انتهى كل شىء<br />نجحت الوكالة اليهودية فى سياستها فى غزة وفلسطين ومصر<br />بارك اللة فى اعوان الوكالة اليهودية"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510093935/http://masr.20at.com:80/newArticle.php?sid=15637"

[[comments]]
order = 2
subject = "حتى بعد الزيادة"
author = "حسين كامل"
text = "حتى بعد الزيادة مازال سعر البنزين المصرى هو الارخص فى العالم ,, حتى بعد الزيادة مازلت سعر السجائر المصرية هى الارخص فى العالم !! ولكن ومع هذا ومع انى من مناصرى الحكومة فى معظم القرارات الا ان قرار رفع الاسعار اكبر خطاء ارتكب من حكومة نظيف وذلك لسببين . السبب الاول ان ارتفاع سعر البنزين شئنا ام ابينا ينتج عنه ارتفاع فى الاسعار لمعظم السلع الاخرى , ثانيا فى خلال الاسبوع الماضى حصل الرئيس مبارك على حب وتأيد شعبى منقطع النظير وموقع العربية خير شاهد على ذلك , ولكن للاسف حكومة نظيف تفهم فى المال والاقتصاد اكثر مما تفهم فى السياسة وبسبب الغباء السياسى قد تتسبب فى ضياع بعض من التأيد الشعبى الجارف للرئيس مبارك ذلك التأيد الذى اذهل العدو قبل الصديق حينما افشل الشعب الاضراب الاخير . اتمنى من الرئيس مبارك ان يصدر قرار جمهورى بتعليق اى زيادة فى الاسعار لمده عام حتى لا نعطى الفرصة للخونة والعملاء والاخوان المتأسلمين او نعطى الفرصة لفريق الحسبنة والبكاء والولوله من اثارة الشعب ونعود بذلك الى المربع صفر ."
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510093935/http://masr.20at.com:80/newArticle.php?sid=15637"

