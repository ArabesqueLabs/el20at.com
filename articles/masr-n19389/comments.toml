[[comments]]
order = 0
subject = "اقول لكم"
author = "مش لاعب"
text = "فى ستة ايام اجتاح الجيش الاسرائيلى سيناء بالكامل ووقف يستريح على شط القناة بدون ان يخسر جندى واحد<br />واجتاح الضفة الغربية والقدس فى يوم حتى وقف على ضفة نهر الاردن<br />واحتل الجولان وكل مدنها وقراها ووقف على بعد 40 كيلو متر من دمشق<br />كل ذلك فى ستة ايام<br />ولكن تلك المرة بكل قواتة وجبروتة لم يستطع بدباباتة ان يخترق غزة ويصل الى الميدان فى وسط البلد ولمدة 22 يوما<br />لمدة 22 يوما الجيش الاسرائيلى بطياراتة ودباباتة والوية جولانى تنطح فى مدينة صامدة بطلة تدافع<br />تحية الى فتيان غزة الابطال<br />وقيادة غزة البطلة<br />لقد رفعتم الرأس عاليا<br />اما القتلى المدنيين - فكم قتل فى حادث العبارة او حادث القطار<br />انها حرب دفاع<br />ولا بد من الضحايا<br />بعد العرب راهنوا على ان غزة ستسقط فى 3 ايام<br />ولم يعقدوا مؤتمر القمة الا بعد ان انتصرت غزة - تصور<br />بعض العرب حينما يسمعون كلمة اسرائيل ترتعش فرائصهم وتهتز ركبهم<br />بوركتم شباب غزة البطل<br />ان تنصروا اللة ينصركم ويثبت اقدامكم<br />ولا نامت اعين الجبناء"
archived = "2009-01-23"
capture_url = "https://web.archive.org/web/20090123200628/http://masr.20at.com:80/newArticle.php?sid=19389"

[[comments]]
order = 1
subject = "الصمود"
author = "بنت مصرية"
text = "اتفق مع الاخ صاحب اتعليق السابق فهذة الحرب وحرب لبنان 2006 دمرت والى الابد اسطورة الجيش الذى لايقهر وقوتة الرادعة فلا قوتة ردعت المقاومة ولاكسرت شوكتها وجعلتها تسير فى موكب المستسلمين ويكفى لمقاومة شرف الصمود الاسطورى امام هذة القوة الغاشمة رغم ضعف تسليحها ورغم الطعنات التى تلقتها من الاشقاء وابناء العمومة فما بالكم لوتم تزويد هذة المقاومة بأسلحة متطورة دام فضلكم"
archived = "2009-01-23"
capture_url = "https://web.archive.org/web/20090123200628/http://masr.20at.com:80/newArticle.php?sid=19389"
