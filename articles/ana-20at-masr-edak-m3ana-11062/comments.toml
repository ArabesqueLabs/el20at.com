text = "العنوان خطأ<br />والصحيح هو ان حدث ضرب بوش بالجذمه هو الذي انقذني وليس جذمة بوش<br />بوش انضرب بالجذمه وذهب الى مزبلة التاريخ واحتقره العالم كله<br />بوش انضرب بالجزمه وحزن عليه كل كلاب الدنيا وحقرائها ونخص بالذكر<br />1) الشيعة 2) الاقباط وغيرهم من هوام الارض"
