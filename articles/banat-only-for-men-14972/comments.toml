text = "مش هاقول عندك حق في نقط معينه او كلامك فيه شيء من الصحه<br />لكن للاسف كلامك كله مظبوط من غير غلطه<br />بس مش عام على كل البنات<br />لكن حضرتك لو قريت مقالك<br />بنظرة سيكولوجيه هتلاقي الوضع طبيعي و مش محتاج استغراب<br />لان الرجل بطبعه واقعي عقلاني<br />والمرأه عاطفيه مزاجيه<br />انت اتكلمت بمنتهى الواقعيه و الموضوعيه وزعلان من حوا وتصرفاتها<br />رغم ان عاطفيتها بتجبرها على حب الاهتمام ولفت الانظار و انها نمبر وان في كل حاجه عدا الواقعيه ...... طبعا ده نسبي من واحده للتانيه<br />بالمختصر الشديد اه ده موجود بس طبيعي لكن مستغربينه لانه اخد شكل ظاهرة مش جديده بس ماكنتوش واخدين بالكم منها<br />لا مع اللي جوه ( مراتك اختك و....) ولا مع اللي بره .. اي بنت تانيه<br />بس صدقني لو اديت حوا اهتمامها الصح اللي تستحقه ماكنتش حصلت الظاهرة ده<br />وعلى لسان اي بنت ينطبق عليها مقالك<br />لو اخويا او جوزي او خطيبي مهتهم بيا ماكنتش دورت على اللي بره<br />وبالكلام العقلاني .. لو انا قدرت الف نظر راجلي كان اهتم بيا و ماكانش اهملني وخلاني احاول اشوف اهتمام اللي بره...."
