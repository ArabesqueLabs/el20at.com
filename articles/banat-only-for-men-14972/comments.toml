posted = "2010-02-27"
text = "السلام عليكم<br />شكلك بتتكلم علي نوع معين من البنات واللي مش عارفة مضايقك ليه لو انت ماشي صح<br />الصفة الاولي : مش معقول مكنش فيه حد ماشي في الشارع غير البنات اكيد كان قامك رجاله كتير بس انت حبيت تحط نفسك مكان شبه وتختار بنت وتسالها ومهما كانت من النوع اللي بيحب الاعجاب ليها حق تخاف منك لان لو 60% بس منكم لسه نيتهم خير يمكن مكنتش فكرت كده الله اعلم علي كل حال ريح دماغك ودور علي راجل زيك واسئله بعد كدة<br />الصفة التانيه : سبحان الله يعني عندك صحابك الصبيان كلهم وكمان البنات اللي مش مصريات وكمان لو ليك صحبات مصريات ورايح تسأل واحدة ماتعرفهاش؟!!!!! افرد ياأخي مش عاوزة تتكلم معاك ايه لازم تتكام معاك غصب عنها<br />الصفة التالته : دي صفة اللي مشهورين بيها وزي ما قولت الجيل الجديد عنده طاقة التغير ان شاء الله ولو مديقاك قوي كدة لما تتجوز ان شاء الله اتجوز واحدة مش مصريه محدش هيزعل<br />الصفة الرابعة : ياااااااااااااااه انا كنت مفكره مصر معروفه بسي السيد والكلام داه كان بعد الفراعنه اكيد بس للحق في رجاله مظلومين<br />الحلول اللي حطتها اكيد طبعا مؤيداها لسبب بسيط وانها هتريح البنات اكتر ما هتريحكم<br />نصيحة وسع نطاق بحثك"
