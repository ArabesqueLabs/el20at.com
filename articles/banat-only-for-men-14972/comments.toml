text = "عارف هى اكتر من كده بخلاف من هدى ربك انا كنت فى العشرينات مصاحب 20بنت كلهم بخليهم يعملو كل حاجه وانا كنت سيدهم بس لاعمرى قلت وحشتينى ولا حموت واشوفك يمكن علشان كنت غايه فى الواقعيه وغايه فى التعبير حتى فى الاتوبيس كانت تهانى تقف وانا اقعد وقمت مره لبنت لبسه محترم جدا وزعلت اوى بس انا فهمتها ومن بعدها بقت تلبس محترم جدا<br />.....الحب كان مشكلتهم معايا ومع كل ده لم اكذب على احد لدرجه انى كنت احيانا اشعر ان العلاقه سوف تتطور الى طلب تبادل الحب فاعترف باننى لا احب ولن ارتبط الان .....حتى فتنتنى بنت 12سنه فراقبتها حتى اصحبت ام اولادى وقلبى الذى ينبض فى صدرى ومع هذا مهما احببتها لن يصل حبى الى ذره فى ححبها وتفانيها فى راحتى واسعادى ...اللهم استرها وارحمها وزدها جمالا ورضا وحب ...اسف على التطويل والتنوع والخروج عن النص"
