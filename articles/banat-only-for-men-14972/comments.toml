text = "بتكتب وانت مش حاطط ف دماغك غير وجهه نظر واحده (وجهه نظرك ) مش شايف انك يوم ماتيجي تكتب عن حد المفروض تحط نفسك مكانه وتبص عالموضوع من وجهه نظره<br />لو الشباب المحترمين اللي زي حدرتك عاملهم كويس وكانوا محترمين اكيد مكنوش هيعملوكم كدا<br />بالعكس معظم الولاد يوم مابنت تكلمه كويس وتعامله باحترام بيفتكر انه يااااااااااه مفيش زيه ف الدنيا وانها هتموت عليه ممكن يمشي يقوول لكل الناس انها بتحبه وهي يعيني تكون اخر من يعلم :lol:<br />لازم يكون الناس بصفه عامه شيك وواثقين ف نفسهم وولاد وبنات<br />الرجاله المصريين معرفوين بالجدعنه والجنتله<br />ودي حاجه للاسف معدتش موجوده<br />بنشوف يوميا بالمواصلات ستات كبار ف السن متشعلقين او حتى راجل عجوز مش قادر يقف وخلااص هيقع من ع الباب ورجاله وشباب قاعدين ولا سالين<br />وانه كمان يسيب بنت تقف وتتخبط يمين وشمال وهو قاعد ولا ف دماغه يتفرج عليها دي تسميها اااااايه؟؟<br />ومش شرط انها تكون اختك او قربتك لو انت ما اعتبرتش انهم اختك<br />انت مش ع طوول معاها ف يوم هتكون مكانها وهيكون واحد زيك بالظبط ف مكانك<br />شووف انت هتحب يحصلها ايه ؟؟؟؟ :-*"
