text = "بصراحة الكلام ده معظمه صحيح ميه بالمية بس زي ماقلت اللي ليك تقول اللي عليك<br />1- انت ذكرت حوار الأتوبيسات صح ؟طيب ليه بقى الرجالة أول مابيلمحوا واحدة بنت أو ست جت في مستوى نظرهم يجيبوها من أولها لاخرها والبنت اللي عايزه الراجل يبصلها مره تانية بعين الانبهار عشان تجذب تفكيره مش (عينيه) بس يعني لازم تتشيك ع الاخر عشان عارفه ان الرجالة بيجذبهم المظاهر(وده مثبت علميا بدون جدال)ومش معنى كده ان البنت ديه كده قصدها وحش ولكن هيه عايزاه يفوق من عينه الزايغة عشان يمكن يفوق ويفهم انها ليست مجرد بنت وانما هي مخلوق جميل يستحق الحب و الاحترام و الحماية..<br />2- ليه بقى الولد (الراجل) يعني عشان مقصود بيه كل الأعمار أول مابيشوف واحدة وقع نظرها عليه لمجرد أنه في مرمى بصرها يفتكر أتوماتيك أنها مهتمة وأنه خلاص بقى الفالنتينو ويقعد يسبللها بعينه ويجي يقف جنبها ويعمل انه ياحرام مابقاش عرف الطريق (وهوه حافظها شارع شارع ) ولو ردت عليه عشان صعب عليها خلاص كده كأنها قالتلوا.. أنا بحبك وخد رقم تليفوني...<br />3- أما بالنسبة أن الستات صحتها أحسن ده غلط أولا هي جسديا ضعيفة جدا ولكن ربنا أنعم عليها بالقدرة على تحمل الألم"
