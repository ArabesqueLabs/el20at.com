text = "على فكرة بقى الولاد هم الغلسين جدا على طول يبصو للبنت بالمكرسكوب يعنى فى واحد معانا فى الشغل كلنا كنا وخدين عنة فكرة انه ملتزم وفعلا مش بيبص ولا بيغلس على حد مننا وخاصة ان اغلابنا بنات حديثى التخرج الا اننا فوجئنا انة بيقول لزميلتنا الكبيرة وهو بسالها مين ولاء دى الى بتحط اى شادو لون الترحة وبتعمل وردة فى الترحة مع العلم انى انا مش ولاء ولاكن فلا الولاد دول عملين فيها محترمين وهم اصلاعنيهم زايغة وفى نفس الوقت عايزين يتجوزو ملتزمات عنيها مغمضة ما تعرفش اى حاجة حسبى الله ونعم الكيل"
