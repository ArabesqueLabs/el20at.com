text = "والا انا مداخلتى مختلفه شويه عن الاخريات للاسف كل الكلام اللى قلته صح وانا بنت وباكد ده بس اولا دى نسبه من البنات مش كلهم اكيد بس المحزن ان النسبه بتزيد والفتايات اليوم فقدو الحياء وهو اوالله اجمل حلى تتحلى به الفتاه العربيه والمسلمه والمشكله التانيه اللى بقت اكتر انتشارا الاتباع الاعمى لنظريات حقوق المرأه واللى انا شايفاه انها بتجرد المرأه من حقوقها واحترام المجتمع ليها وبعدين الحقوق فى مقابلها واجبات والحقيقه ان بنات كتير مايصلحوص زوجات صالحات بمعنى ستر وسند لزوجها وان كلمة ماما تتقال للجيل الحالى والله مسئوليه كبيره ربنا هيحسبنا عليها اى نعم احنا نصف المجتمع وبنجيب النصف الثانى بس دى فى حقيقه الامر مسؤليه كبيره علشان نربى اولادنا ويكونو رجال على فكره انا مش كبيره اوى انا سنى 23 ومتزوجه من سنه والحمد لله ربنا كرمنى براجل يستحق انى اعيش عمرى كله علشان اسعده واعينه ربنا يخليهولى وكرم كل الولاد والفتايات بالازواج الصالحين يا شباب الدنيا لسه فيها خير بس السئ بدأت معدلاته تزيد بشكل مقلق .."
