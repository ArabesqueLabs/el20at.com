text = "انا لما لقيت الموضوع ده قلت اقراه يمكن الاقي حد ينصف البنات لكن لقيتك زيك زي اي راجل تاني وكانك ولا اتعلمت ولا عرفت حتي ايه الاصول والاداب في الحوار ولو انت عايز تنتقد البنات المحترمة وتوصفهم بالتناكة هل انت بتنصح اختك انها تكون لاااارج مع صحابها الصبيان ....لأ بصراحة ونعم الرجولة :zzz المصحصحة . وعشان تبين انك فير متكلم عن البنات بتوع اللبس الملزق عارف ليه عشان انت اول ما بتطلع من بيتكم مش بتبقي مركز يا عيني غير عليهم :sigh: ...عايزة اقول للبنات اوعوا تاخدوا بكلام واحد زي ده الكائن ده عايزنا نغير من مفهومنا للاحترام و نبقي فاكين ويا ريت بعد كده نحس اننا كويسين لأ دا كمان مبين ان اللي هتلبس وتتزوق هتبقي بنت وقيع من اياهم يعني لا كده نافع ولا كده عاجب و دا يخلينا يا بنات نصر علي اظهار احترامنا لنفسنا و لتربيتنا و في نفس الوقت نتشيك ونلبس لبس يبرز زوقنا في الالوان لكن من غير ما نبتذل ... وكلمة اخيرة ليك احنا بنلبس احسن ما عندنا مابين اصحابنا البنات لان ربنا خلق جوانا الاحساس بالجمال الفطري مش المصطنع"
