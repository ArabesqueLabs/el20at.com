[[comments]]
order = 6
subject = "تخلف حقيقى"
author = "بنت النيل"
posted = "2008-11-05"
text = "انا مش عارفة بقى لمجرد ذكر ان نهى من عرب 48 تنقلب عليها هذة المدعية انها محامية الباحثة عن الشهرة مستغلة جهل قطاع عريض من الشعب بالفرق بين االاسرائيلى اليهودى الصهيونى الذى اتى من انحاء العالم لسرقة ونهب الارض الفلسطينية وطرد اهلها منها وبين الفلسطنيين الذين رفضوا ترك بيوتهم وارضهم رغم ما يتعرضون لة لكى يستولى عليها اليهود فإشترطت عليهم اسرائيل حمل الهوية الاسرائيلية ليتمكنوا من البقاء فى بيوتهم وارضهم<br />يعنى مش هما اللى حاربونا فى 67او اكتوبر 73 ولاهما اللى قتلوا اسرانا ولاهما اللى بيغتصبوا الارض العربية<br />اما حكاية انها سبق لها ورفعت قضية تحرش ضد ظابط فرنسى فهذا هو التخلف بعينة لية دائما مصرين على خلط الحقائق فهى متحرش بها وليست هى التى تحرشت بة هل معنى انها مرت بهذة التجربة من قبل ولم تترك حقها فننظر لها وكأنها اصبحت سوابق -----حرام عليكم بجد ارحمونا هى البلد دى اتخلفت من شوية"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "الى بنت النيل"
author = "بنت الترعة البولاقية"
posted = "2008-11-05"
text = "اية الكلام الحماسى دة<br />يا اختى لما كل بتوع عرب 48 مناضلين - سايبين دى لية هنا قاعدة فى مصر الجديدة - ما تروح تناضل عندهم هناك فى يافا<br />وبعدين مصدر عائلتها للرزق اية<br />احنا بلد وحشة<br />تروح تقعد عند قرايبها<br />والا الموساد بيدفع لها المرتبات وتكاليف المعيشة<br />هو اللى مد ايدة يعاكسها - اكيد كانت واقفة مش محترمة ولابسة مش محترمة - الاشكال دى احنا عارفين بتلبس اية<br />وبتقف قين<br />الاشكال دى احنا عارفينها كويس<br />خليها وروحى معاها يافا ناضلوا هناك ضد الصهاينة<br />بلاش قرف"
archived = "2010-03-14"
