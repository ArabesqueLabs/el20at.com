[[comments]]
order = 1
subject = "لماذا لا تذهب الى بلدها وتريحنا - هو احنا ناقصين ل"
author = "المفتش كرمبو"
posted = "2008-11-04"
text = "صعدت الموضوع وعملت منها قضية علشان واحد منحط مد ايدة عليها وكان ممكن تضربة قلمين على وشة وينتهى الموضوع<br />انما عملت قضية<br />والقضية استلمها الاعلام<br />وقامت وكالات الانباء بعمل اللازم واذيع الخبر فى ارجاء المعمورة وعملت للبلد سمعة زى الزفت وهى ان المصريين همج وبيتحرشوا بالنسوان على قارعة الطريق<br />وكلمة التحرش معناها فى الخارج انة مش مسك ايدها او لمس صدرها انما تعنى انة امسكها ومزق ملابسها واغتصبها عنوة او حاول ولكنها دافعت عن نفسها<br />واصبحت كل دولة تنبة على السائحات عند قدومهم الى مصر - خدوا بالكم الناس هناك عندهم سعار جنسى وبيغتصبوا السيدات فى الشوارع ونهارا جهارا<br />دى اسمها تشوية سمعة بلد<br />البنت دى المفروض تنطرد وتروح عند قرايبها فى اسرائيل او فى ليبيا او اى داهية تاخدها<br />كفاية قرف"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "كفاية تشويه في نهى- فين موضوعية الصحافة"
author = "ام سليمان"
posted = "2008-11-05"
text = "عيب عليكم تكتبوا ان المحامية فجرت مفاجأة كذا وكذا من غير ما تكتبوا ان نهى نفسها اثبتت ان ده كذب وان المحامية المنحطة تراجعت عن كلامها في برنامج الحياة اليوم وغيره ولم تقدم هي او كذاب الزفة التاني نبيه الوحش اي دليل على افترائاتهم ولا حت عملوا بلاغ رسمي زي ما ادعوا. ليه متحيزين ضد نهى؟ بتخوفوا البنات عشان تسكت على التحرش احسن صورتهم تشوه زي ما عملوا مع نهى؟<br />نهى دي بطلة وشجاعة ما خافتش من المتحرش ولا خافتش من البوليس المصري احسن يرحلها"
archived = "2010-03-14"
capture_url = ""

