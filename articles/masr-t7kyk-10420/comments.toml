[[comments]]
order = 4
subject = "هي لو يهودية او بوذية يبقي التحرش بيهلا حلال؟؟؟؟؟؟"
author = "امة الله المصرية"
posted = "2008-11-05"
text = "الاخ اللي كتب كانت اديته قلمين و خلص الموضوع اتمني ان تجد من يتحرش بك انت نفسك و تذكر وقتها ان حتي قتل المتحرش بك لن يريحك<br />والاخ اللي قال ان الموضوع شوه صورة مصر اللي اساء لبلدنا رجال بلا اخلاق مدعين التدين يمشون في شوارعها و يركبون مواصلاتها و اذا وجدوا فتاة في موضع تحرش قالوا مالنا<br />و نعم مصر هي الوحيدة<br />عمركوا شوفتوا بلد رجالها بيجروا خلف بناتها للتحرش بيهم و تقطيع ملابسهم كما يحدث في حوادث التحرش الجماعي في مصر؟<br />عمركوا شوفتوا بلد يقف ذكورها ينظرون لبنات الناس في الشارع يتم التحرش بيهن و لا يفعلون شيئا سوي التلصص و النظر علي عورتهن بعد ان يتحرش بيهن الا في مصر؟<br />نعم لا تحرش كهذا في اسرائيل نفسهاد<br />حتي الرجل الاوروبي لديه نخوة افضل و ينقذ فتاة تستغيث في الطريق<br />الافضل بدل ماتلوموا غيركم انه فجر القضية اصلحوا من انفسكم<br />لان رجال بهذه الصفات الموبؤة لن يكونوا ابدا اهلا للدفاع عن بلد او وطن او دين"
archived = "2010-03-14"
capture_url = ""

