[[comments]]
order = 8
subject = "الي بنت الترعة"
author = "امة الله المصرية"
posted = "2008-11-05"
text = "يمكن انتي ماحدش اتحرش بيكي في مصر<br />و اكيد ماشوفتيش المنقبات اليي تم التحرش بهم جماعيا<br />واكيد الي الان ما اكتشفتيش ان مصر الي 80%من نسائها محجبات هي البلد الوحيد اللي في العالم يجري كلابها خلف النساء للتحرش بيهن و شد حجابهن و تمزيق ملابسهن<br />ورغم ان في دول العالم حدثي و لا حرج علي زي النساء فان الرجال لا يتحرشون بهن و اذا استغاثت فتاة وجدت من يعينها و لكنك تربيتي في مجتمع يقلب كل الموازين و يدعم المتحرش و ينهش في الضحية ثم يتافف من حكومة يري انها ظالمة<br />انا اري ان القرف اللي قصدتيه هو كلامك وخير رد علي فكرك هو حسبي الله و نعم الوكيل في كل من يقف بجوار ظالم و يدهس حق المظلوم"
archived = "2010-03-14"
