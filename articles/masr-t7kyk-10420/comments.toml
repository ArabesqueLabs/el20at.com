subject = "ام بتسأل بنتها : انت اتأخرت لية برة يا بنت  ؟"
author = "برضة انا"
posted = "2008-11-05"
text = "انتم عارفين النكتة القديمة البايخة لما الام سألت بنتها انتى اتأخرت لية برة يا بنت ؟<br />وردت البنت<br />اصل يا ماما كان فية واحد ماشى ورايا وبيعاكسنى<br />قالت الام<br />طيب هو ماشى ورائك - اية اللى يأخرك ؟<br />ردت البنت<br />اعمل اية يا ماما ماهو كان ماشى على مهلة وبطىء"
