subject = "واحنا  مالنا"
author = "واحد"
posted = "2007-12-15"
text = "امريكا والشيكو&--65275;تة طيب واحنا مالنا - ما عندنا اللى يكفينا<br />مصيبتنا اننا بنبص لامريكا وعايزين نعمل زى امريكا فى السياسة والاقتصاد<br />يا جماعة الخير امريكا قارة سكانها 300 مليون وممكن تسع 2000 مليون انسان - الخير هناك للركب<br />انما احنا دولة فقيرة محدودة الموارد وصغيرة ومينفعش نظام امريكا عندنا<br />احنا ينفعنا نظام وسط بين الراسمالية والاشتراكية لان عندنا فقراء كتير<br />احنا مشينا ال 20 سنة اللى فاتوا غلط لما مشينا وراء فتاوى البنك الدولى كان المفروض مسكنا العصاية من النص شوية راسمالية وقطاع خاص وشوية اشتراكية للفقراء والجوعى<br />ابعدوا عن امريكا تكسبوا<br />الفلبين مشيت وراء امريكا اصبحوا شحاتين<br />&--65275;زم يبقى لنا سياسة مستقلة<br />انسوا امريكا - امريكا كويسة للامريكان انما احنا خلينا فى مشاكلنا<br />خلينا نتكلم عن رغيف الخبز وبعيد عن الشيكلوتة واصحاب الشيكو&--65275;تة ايا كانوا<br />خلينا فى حالنا"
