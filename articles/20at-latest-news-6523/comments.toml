subject = "المنفى"
author = "نيفين نيفى نوفا"
posted = "2007-07-02"
text = "تعرفو يا جماعه ان العنوان نفسه ممكن يخلى الواحد يبكى<br />و يمكن تصورت من العنوان ان يكون الصبغه الادبيه طاغيه على الموضوع لكن ده لا يمنع ان الموضوع حرك مشاعرنا و نقلنا لمكان ما حيث يمكن ان نجد انسان منفى عن بلده و يشتاق لترابها و حطيت نفسى مكانه للحظات و كدت اجن<br />بس مش جهاد او غيره اللى منفيين بس فيه ملايين الفلسطينين منفيين داخل فلسطين و ملايين اكتر داخل انفسهم<br />و ربما يتهمنى البعض بالتشاؤم اذا قلت ان المنفى خارجيا و داخليا سيدوم<br />لان النزاع اصبح داخل الجسد الواحد و اقصد ما يجرى من عبث بين فتح و حماس<br />كان الله فى عون فلسطين"
archived = "2010-03-14"
