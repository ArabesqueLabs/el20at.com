subject = "التنظيم العالمي للإخوان المسلمين"
author = "مش ححبك"
posted = "2009-01-17"
text = "التنظيم العالمي للإخوان المسلمين نشأ هذا التنظيم في بدايته كمكتب أو مجلس تنفيذي لجماعة الإخوان المسلمين يضم في عضويته أفرع الجماعة في الدول العربية والأجنبية في عهد الإمام المرشد الأول للجماعة حسن البنا، توقف نشاط المكتب بعد تولي الرئيس المصري جمال عبد الناصر الحكم في مصر وإعلانه الحرب علي الإخوان وحله للجماعة وتعرض الإخوان لمحنة شديدة في عام 1954 م أعتقل الكثير منها وأعدم العديد من قياداتها ومنهم الشيخ محمد فرغلي والقاضي عبد القادر عودة وحكم بالإعدام علي المرشد الثاني الإمام حسن الهضيبي الذي خفف إلي السجن المؤبد، وتعرض الإخوان لمحنة أخري شديدة في عهد عبد الناصر أيضا عام 1965م أدت لإعتقال الألاف من الإخوان في مصر وإعدام العديد منهم أبرزهم الأستاذ الشهيد سيد قطب, إثر هذه المحنة فكر الإخوان خارج مصر في إحياء المكتب التنفيذي القديم, إذ أن حركة الإخوان ليست مجرد جماعة مصرية، بل هي حركة إسلامية عالمية، وإن كانت مصرية النشأة. وبدأت لقاءات إعادة إحياء التنظيم في بدايتها في بحث شئون الدعوة, إلي أن أخذت هذه اللقاءات منحي تنظيمي يحضر عن كل بلد فيها عضو ممثلا للدعوة فيها، وكانت تجري هذه اللقاءات في عدة بلدان مثل مكة المكرمة والمدينة المنورة وإسطنبول وبيروت, وعمّان وبعض الدول الأوروبية.[1]<br />تم تعديل اللائحة الخاصة بالتنظيم لتناسب الوضع الجديد ومن أهم ما اتجه إليه الإخوان في اللائحة الجديدة، هو اختيار المرشد العام للجماعة، والذي يختاره هو مجلس الشورى العام المختار من جميع الأقطار، ويجب أن يختار لمدة محدودة، وليس لمدى الحياة. وأيضا تم تعديل صيغة القسم التي يقسم فيها العضو على الالتزام بمنهج الإخوان، والسمع والطاعة للقيادة في غير معصية. إلي (صيغة عهد) لا صيغة قسم، فالشخص يتعهد بدل أن يقسم.وبدل أن كانت صيغة البيعة للمرشد العام، عُدلت إلي بيعة مطلقة، على العمل بكتاب الله وسنة رسول الله، ونصرة الدعوة إلى الإسلام . وظل هذا المجلس في التوسع إلي أن تم تسميته التنظيم العالمي للإخوان المسلمين[2]"
