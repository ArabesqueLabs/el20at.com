subject = "الاخوان المتأسلمين"
author = "حسين كامل"
posted = "2009-01-17"
text = "اشاهد عبر الفضائيات ضحايا الحرب الفلسطينية من قتلى ومصابين والغريب انهم جميعا من الاطفال والنساء والاعرب اننى لم اشاهد اصحاب الذقون من بين القتلى والمصابين لماذا !! لانهم فروا من الشهادة وارتعبوا من الموت ودخلوا الى الجحور والانفاق وتركوا الشعب المسكين يقتل بسبب صواريخ الورق الحمساوية !! العجيب والغريب ان اصحاب الذقون يتهجموا على مصر لانهم كانوا يتوقعوا ان تنجر مصر خلف المؤامرة وتفكيرهم المريض خيل لهم ان الرئيس المصرى يمكن ان يضحى بالشعب المصرى مثلما ضحوا هم بابناء غزة !! مثلث قذز اراد النيل من مصر وهذا المثلث يشمل اصحاب الذقون بداية من ذقون ايران الى ذقون حماس فى غزة وصولا الى ذقون الاخوان المتأسلمين فى مصر التى خيل لها ان الشعب المصرى سينخدع بذقونهم وسوف يثور على مبارك من اجل عيون وذقون حماس الارهابية المتأسلمة !! ومع التحفظ تجاه شعب غزة اريد ان اقول ان الموضوع لا يخصنا بل بخص اهالى غزة وقادتهم من حماس الارهابية فلو كان الشعب الغزاوى يرغب فى استمرار القتال فله مطلق الحرية ولو كان يرغب فى السلام فعليه ان يسحق حماس الارهابية ويعود الى العقل والمنطق المتمثل فى محمود عباس وعلى الشعب الغزاوى ان يعلم ان كل المصائب والكوارث التى احلت بغزة تعود الى اللحظة التى انتخب فيها الغزاويين حركة حماس الارهابية المتأسلمة ولم يجنوا منها غير الشعارات والخراب والحصار وصولا الى المجازر التى تحدث لهم اليوم !! الغريب والعجيب ان حماس تعتبر انها تنتصر على اسرائيل واليكم مظاهر الانتصار ( اكثر 1200 قتيل واكثر من 5 الاف مصاب فلسطينى بالاضافة الى انهيار البنية التحتية وفى المقابل ونتيجة اطلاق صواريخهم الورقية التى احدثت اصابات جسيمة فى الجانب الاسرائيلى تتمثل فى اصابة ( 20 اسرائيلى بالهلع ) تخيلوا هلع !! ولنترك الهلع ونعود الى قادة حماس المقيمين فى سوريا لنشاهد تهجمهم على مصر وعلى الرئيس المبارك !! غريب امرهم يتهجموا على مصر ولم نسمع منهم اى تهجم على من زج بهم وبالشعب الفلسطينى فى اتون الحرب !! لم نرى اى تهجم على سوريا او ايران او الاخوان المتأسلمين اللذين اكتفوا بالخروج الى الشوارع فى تظاهرات لم تضم غيرا لعامة والغوغاء وحثالة المجتمع من مدمنى الشوارع والارصفة ,, واخيرا تحية من القلب الى الرئيس المصرى على حكمتة التى جنبت الشعب المصرى ويلات الحروب طوال فتره حكمة وتحية الى كل قادة العرب من جبهة الاعتدال التى تعمل فى صمت من اجل حل القضية الفلسطنية والتى تقدم الدعم المادى الى شعب غزة واول هذا الدعم يتمثل فى علاج المصابيين من ابناء غزة ,, سؤال اخير !! هل سمع احدكم ان ايران او المتأسلمين فى اى مكان عالجوا ولو مصاب فلسطينى واحد او حتى ارسلوا معونات غذائية وادوية الى غزة !! حتى قطر التى ارسلت فى بداية الامر معونات طبية الى غزة ورفضت مصر عبور الادوية لانتهاء فترة الصلاحية !!!!"
