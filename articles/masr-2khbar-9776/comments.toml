[[comments]]
order = 0
subject = "من ذلك المخلوق المدعو (تامر حسنى)"
author = "ممدوح زكى زخارى جرجس"
posted = "2008-08-03"
text = "حقا كل الذى اعرفة عن ذللك المخلوق المولود المدعو (تامر حسنى)؟<br />انة مزور و جبان لجاء الى التزوير للهروب من دفع ضريبة الدفاع و خدمة الوكن و ذلك بتزوير مستندات رسمية من اجل الهروب من اداء الخدمة العسكرية و ليكون مواطن شريف محترم(رجل يستطيع حمل السلاح يوما ما للدفاع عن الوطن )وقت الشدةو ليس مولود مخلوق يتشبهة ببغايا و ساقطات الوطن؟<br />هذا هو كل ما اعرفة عن ذلك المدعو (تامر حسنى)<br />و للة الامر من قبل و من بعد؟"
archived = "2010-03-14"
