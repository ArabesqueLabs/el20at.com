posted = "2008-08-04"
text = "انا مش فاهم ايه التخلف ده .. دى عالم متخلفه .. لامؤاخده يعني !!<br />كل ده عشان خاطر عمر دياب .. مع ان مافيش وجة مقارنة اصلا .. عمرو دياب حاجة وتامر حسني حاجة تانيه خالص !!<br />انا عارف ان اسم عمرو دياب لم يذكر فى الموضوع .. لكن انا كمان عارف ان كل اصحاب الجروبات دى هدفهم فقط تشوية صورة تامر وتأييد عمرو دياب أكتر .. !!<br />بنحبك ياتامر .."
