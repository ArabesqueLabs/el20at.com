text = "هاااااااااااااااااااااااااااي........كيفكن......انا بدي قول انه هيدا المكتوب عن نجم الجيل تامر حسني مو صح لانه من اسلوب الي كتبه مبين انه بيكرهو هيك من دون سبب مقنع لانع ما اعطانا الدليل الي يخلينا نكرهو بالعكس بين انه الكاتب مو قد حالو لانه لو قد حالو بيقول اسمه مو بيتخبى متل القطط ههههههههههههههه وبعدين البوم تامر حسني الجديد كتير حلو ومهضوم وحتى الكلمات بطير العقل يعني من الاخر نار وبالنهاية بنحبك يا تاااااااااااااااااااااااااامر لو مهما صار وباي لكل الشطار وهلا بااااااااااااااااااااااااااااااااااااااااااااااي"
