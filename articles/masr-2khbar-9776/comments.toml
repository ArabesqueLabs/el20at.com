author = "محمد نواف الحمدالله .. اردني ح"
posted = "2008-08-20"
text = "لعن أبو هيك شكل بستميت مليون كندرة يا اخو الحماره ..<br />ولك ليكون مصدق حالك فنان ..!!<br />لا ياعمو لا ياروم أمك وأبوك لا يابابا مش أناااااااااااااااااااااااااااا ..<br />ايوه يا أخو الخرى اسمع .<br />إنسان لا ليش إنسان !! هو بعيد كل البعد عن الإنسانية هو حيوان ( مع احترامي للسامعين ) ..<br />ساقط وواطي وخسيس وكلب وحيوان ولايبفقه شيئاً ..<br />تحياتي لكل إنسان يقدر الفن ويحرترمه ..<br />محمد نواف"
