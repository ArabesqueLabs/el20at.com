subject = "طظ فى معونتهم"
author = "وش فقر"
posted = "2007-12-26"
text = "من يوم ما استلمنا المعونة منهم والفقر ركب البلد<br />كان خيرنا مكفى شرنا وكنا كويسين واحرار - لا البنك الدولى بيتحكم ويحط شروط - ولا اصحاب المعونة سايبنا فى حالنا - وانما بيسحبوا استقلالنا خطوة خطوة - وحرية قرارنا خطوة خطوة<br />وانا بصفتى معدم ولا املك اى شىء فى البلد دى بعلو صوتى مش عايز معونة<br />واحنا كلنا مش عايزين معونة - وخصوصا من بوز الاخص"
