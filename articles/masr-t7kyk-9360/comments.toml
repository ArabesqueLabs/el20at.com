posted = "2008-06-17"
text = "اكتر حاجة بتضايقنى كلمة الجمهولا عايز كدة او الجمهور مش زعلان منى ومعجب بيا موت والكلام السخيف دة هو انتى يا مدام سمية عملتى استفتاء وعرفتى ان الجمخور بيحبك ومش زعلان منك نفسى الجمهور يكون لية موقع على النت للرد على الفنانين والمسئولين الكل حاجة عندهم اصل الجمهور عايز كدة نعملة اية واحنا نرد عليهم انتم العايزين كدة والجمهور برىء منكم ومن اعمالكم كتكم الارف مالتوا البلد بمشاهدكم ال*** والفاظكم القذرة وملابسكم العارية وسهراتكم الخاصة الماجنة وعلاقتكم المقززة .... اعوذ باللة منكم"
