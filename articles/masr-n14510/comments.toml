posted = "2008-03-04"
text = "هذا غباء نظام امنى<br />بسيطة خالص - بلاش عرب سات ونايل سات<br />يروحوا القمر التركى والا الاسرائيلى<br />وحاجة اسهل خالص ينقلوا مكاتبهم بيروت او قبرص ويزيعوا على الهوت بيرد<br />وخللوا النايل سات لقنوات التخلف العقلى والزهايمر"
