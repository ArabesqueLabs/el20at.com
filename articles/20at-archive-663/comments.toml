[[comments]]
order = 14
subject = "شبرامنت ( اشتقت الى كل شبر فيكى يا احب البلاد الى"
author = "ياسر عثمان دويدار"
posted = "2009-01-29"
text = "اخى الكريم اعلم ان ما كتبته لم يكن بقصد الاهانه ولكنك تناولت الموضوع بشكل ساخر فانك مثل من صنع تورتة جميله وبعد ان انتهى منها وضع عليها جاز فانت ذكرت مثال الابواب المفتوحه نعم مفتوحه فنحن اهل كرم وجود لا نغلق ابوابنا فى وجه احد هل تعرف ان جميع الحجاج الذين كانوا ياتون قديما من شمال افريقيا من بلاد المغرب العربى وليبيا عن طريق الابل كانوا ينزلون شبرامنت فى دواووين العائلات حتى يستريحوا وياخذوا واجب الضيافه والسفر ( مجانا ) مثل ما كان يحدث فى دوار دويدار على سبيل المثال وفى دوارات باقى عائلات البلدة الكريمة اتعرف ان اكثر البلاد تعاونا ومجاملة فى جميع المناسبات هى شبرامنت ان اعلى نسبة تعليم فى المحافظة عندنا ان اعلى نسبة ملتزمين عندنا ان كل الناس فى شبرامنت قلبهم ابيض وطيبين والله اننا فى غربه بعيد عنها ولكن عندما نذهب اليها نشعر بالراحة الكاملة اخى الكريم ارجوا ان تعتذر عن كل ما اقترفته فى حقنا وان تعتذر لشبرامنت التى آاوتك فى يوم من الايام فاذهب اليها ولف فى الشوارع واعتذر لكل شارع وكل شبر وكل فرد فيها فنحن خير اجناد الارض ( السنا من مصر ) وقول لشبرامنت وحشتينى نفسى ارجع بقى واستحلفها بالله ان تهتم باولادها وتحتضنهم وانتم يا شباب شبرامنت تمسكوا بها واصلحوها فالله سيسالكم عنها يوم القيامه فانتم اهلها وتمسكوا بالله وشريعته وبسنة نبيه صلى الله عليه وسلم تفلحوا وتفرح بكم شبرامنت yasser7582@yahoo.com"
archived = "2010-03-14"
capture_url = ""

