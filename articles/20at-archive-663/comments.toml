subject = "شبرامنت=="
author = "واحد عاوز البلد تكون على مستوى"
posted = "2009-02-10"
text = "يا ريت يكون فية مسئولين يخافو من الله وينظرو الى هذا البلد الطيب بنظرة جميلة على اساس يقومو بتنظيف البلد من الداخل مثل الشوارع الرئيسية ---والترعة الا داخل البلد الا جيبة المرض للناس الا فى البلد ---ياريت يردموها او يغطوها ==يارب ==حد من المسئولين يوصل هذا الكلام الى محافظ الجيزة ---والزراعةوالرى --على اساس تكون بلد على مستوى البلد الا حوليها -----------وللاسف ان هذا البلد فيها او كان فيها عضو مجلس شعب بس للااسف بلد زى ماكان الاول وهو موجود وهو مش موجود ---كل انسان بيقول يلى نفسى بس ===لو انا مسئول لا كنت اعمل للبلد حاجات كتير على الاقل الناس تفتكرنى بطيب وددعو لى بلخير ------------------هذا الكلام يا ريت اى حد يقراءة يوصلة الى المسئولين ---والله يوفق كل انسان يسعى فى الخير للناس اميييييييييييييييييييييييييين يلرب العالمين"
