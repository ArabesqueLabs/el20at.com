subject = "صبغتنا التوحيد"
posted = "2008-01-07"
text = "(صبغة الله ومن احسن من الله صبغة ونحن له عابدون )<br />هذا ديننا دين التوحيد والاخلاص والاستسلام لله الواحد الاحد . اللهم زدنا ولاتنقصنا واهدنا واهدى بنا وسددنا وخذ بأيدينا إليك واجعلنا سبب لهدى الناس الى طريقك طريق الحق . اللهم اكرمنى وذلل لى الصعاب حتى يؤمن بك من لايعرفك"
