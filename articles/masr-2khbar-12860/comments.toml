text = "..4...... وبدءت المخالفات وكتير م التعديات ...وبمرور السنوات زادت المخالفات ...وبدا الخلاف وصاح النيل للبهوات ...انتبهوا وخدوا بالكوا ياحضرات ...وصارت زيطه ولا الانتخابات ...الناس اللي تحت تعمل مظهرات والناس اللي فوق تصدر بيانات ...وصاحبنا يصرخ يئن كما النائحات ...الناس اللي تحت تقول دا فساد والناس اللي فوق تقول دا كساد ...وبين الفساد والكساد راحت مصالح العباد ...وضاع النجاشي بسبب العناد ...وعلي جانبيه زاد الفساد ...ده مبني للخواجات ...وده نادي بيقدموا فيه طلبات ...وكمان صاله لاجل يقيموا الاحتفالات ...وده قصر زد احمد اخوه السقا مات ...وكمان مسافر خانه لراحه البشوات ...اما الغلابه ملهمش ف التركات ...ولا حتي ممشي صغير وكله للبهوات ...يتبع"
