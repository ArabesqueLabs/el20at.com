text = "....5.....تقدر تشوف ميته ...؟...ولا حتي تلمح صفحته ؟...اياك هتحضر بهجته ...!!ولا تمد ايدك وتغرف من ميته ...؟وشوف اللي يغيظ و يوجع الراس ...مصانع ومداخن واقفين عليه كما الحراس ...ومسؤلين كتير بيألفوا ف كراس ...كلام كتير خالي من الاحساس ...ياناس الرحمه حلوه خليكوا ف صف الناس ...وارحموا مره هيئته ...لاجل نعرف نشرب ميته ...وروحوا بلغوا حضرته ...ياخد باله وبلاش قسوته ,,,دا لولا النيل ما كنا روينا عزبته .......((( ملحوظه اقرا القصيده من الاسفل ...)))النيل مجاشي 2"
