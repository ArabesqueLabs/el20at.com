subject = ""
author = "حمدي يوسف"
posted = "2009-10-03"
text = "النيل مجاشي ...(2).....قالوا النيل نجاشي ....النجاشي زعل راح ولا جاشي ....انت اصلك كنت مايم وبالدنيا ماتدراشي ...وساب لك رساله تقراها وافتكر ماتنساشي ....بيبلغك سلامه وعظيم امتنانه ...وكان كل كلامه دا الكريم اكرامه ...ومن طبع اللئيم كتر ملامه ...ياميت حسره عليك والف مليون ندامه ....ماهو اصله من سنين عايش بينا حزين ...لا عمره ف يوم اشتكي ولا سمعنا منه انين ...وكل مانهمله يبكي ع الناي الحزين ...ويفيض علينا بدمعه يروي كل العطشانين واهو كان عايش بينا ورحل مع الراحلين ...سمعنا انينك ياناي واشجي الساده المستمعين ....دا نص المستمعين عمال والنص التاني فلاحين ...وكانوا كلهم ف الاصل يشتغلوا ف الارض فلاحين ...بعد رحيلك صبحوا من غيرك غلابه ومساكين ...ارجع لنا من فضلك واحسانك يانيل ...لاجل تروي الارض من تاني ياجميل ...لاجل تروي العطاشي والمحرومين ...لاجل ابني وابنه وابناء الفلاحين ...لاجل كل الغلابه واخوانا المطحونين ...لاجل الشجر والغجر اللي ف ارض الله هايمين ...دا الهوام والعوام صبحوا يشربوا م الطين ....(لها مقدمه وبقيه)"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = ""
author = "حمدي يوسف"
posted = "2009-10-03"
text = "...حتي الزرع لم سلم بيسقوه كمان م الطين ....دا المسلم جنب المسيحي كانوا ف خيرك عايشين ....دا حتي الاعادي كانو ف خيرك طامعين ...وسامحنا يا جميل لو صدر منا ف يوم اساءه ادب ...ولا خليناك ف يوم تشعر بالغضب ...دانت صاحب الاصيل ياجميل ...وطبع الاصيل يقابل الغضب بالادب ...وانت طول عمرك جميل واصيل يا نيل ......والحكايه م البدايه انه ...كان عندنا نيل بيمر من هنا ....يروي كل العطشانين ....يروي زرعي وارضي والاف الفدادين ....وكان منه ترع في كل ناحيه كما الشرايين تروي الشرقي والغربي وما بين الاتنين ...وف الجنوب هناااك بحيره للصيادين ...وعلي جانبيه بطوله بيوت المهندسين ...يراقبوا صرف الميه من الجهتين ..."
