text = "3.........وعلي ضفتيه قامت حياه ....محطات كبيره لاجل ترشيح المياه....لاجل تروي البشر وعباد الله ف دنياه ...وزرع وضرع وكل من فيه حياه ...ولما الفجر لاح ...نادي سيدنا حي علي الفلاح ...قام واجتهد ولدي واشتغل ف الارض فلاح ...يزرع ويحصد خير مع طلعه كل صباح ...يتعب ويشقي يدرس ويغرس دون اي صياح ...خير ربنا كتير قطن ورز وقمح وتفاح ...وف الاعياد تملا الفلايك صفحته والورد ويا الشجر فرحان علي ضفته وولاد وبنات ماسكين للقارب دفته ...والغريب ويا القريب يمد ايده ويغرف من ميته ...لاجل يرجع تاني يحضر افراحه وبهجته ...جسور وقصور وصبايا طالبه المهور ...حاجه تفرح وميته كانت كما البللور ...وريشه فنان ابدع حاجه تشرح الصدور ...وبعد ايام صبح الحرم مكسور .(..يتبع )"
