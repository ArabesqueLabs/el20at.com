subject = "وزير خنافس وصابغ شعرة"
author = "عادل حسين"
posted = "2007-10-08"
text = "ماقلنا الوزير دة بيحارب الاسلام لانة حالق دقنة وشنبة وبيصبغ شعرة وبيطلع قرارات غريبة<br />منتظر ان كل واحد يصلى وعايز يخش الجامع يدفع خمسة جنية لصلاة الصبح وعشرة لصلاة الجمعة ويمكن يطلع قرار زقزوقى ان صلاة الجمعة هتم يوم الثلاثاء بعد صلاة العصر<br />طيب ماهو الكنايس مفتوحة اربعة وعشرين ساعة"
archived = "2007-10-11"
