posted = "2007-09-27"
text = "هناك بعض القواعد القانونية التي يدرسها الأستاذ/ عتيقة لتلامذة الحقوق كأسس ومبادئ قانونية راسية وثابتة ومنها:<br />* أن الأصل في الأشياء الإباحة*<br />* أن لا جريمة ولا عقوبة إلا بنص*<br />* أن الأحكام يجب أن تكون علنية*<br />* أن جلسات المحاكمة علانية إلا ما استثني بنص لظروف معينة كقضايا الأحوال الشخصية\"<br />* أن البطلان هو مصير أي حكم أو محكمة لم تتوافر في إجراءاتها العلنية *<br />*أن الأحكام تصدر دائما باسم الشعب باعتبار أن الشعب هو مصدر هذا الحكم*<br />لما كان ما سبق فإنه لم يصدر نص أو قانون مقيد لهذا الأصل العام يمنع الشعب من تناول الحكم الصادر علنا باسم الشعب . وحيث أن من الأسباب الثابتة والمتداولة دائما في الطعن على الأحكام عبارات من قبيل \" الفساد في الاستدلال\" أي أن استدلال القاضي للوصول إلى وجه الحق في القضية كان فاسدا . وكذلك \" القصور في التسبيب\" أي أن الأسباب التي بني عليها الحكم شابها القصور .. وكذلك \" الخطأ في تطبيق القانون\" و \" بطلان الحكم\" و\" عدمية الحكم وانعدامه\" كلها أسباب تؤسس للطعن على الأحكام ..فساد وقصور وخطأ وبطلان وانعدام ..وكثير جدا جدا من الأحكام صح الطعن عليها وثبت العيب فيها .. وكثير من الأحكام تأيدت وتأبدت على خطئها وبطلانها وظلمها ولم يفلح الطعن عليها لأسباب إجرائية أو لأسباب تنفيذية وغيرها .. لذلك فإن مجلس الاستئناف ليس هيئة تشريعية وما ارتآه من وجوب عدم التعليق على الأحكام ليس قانونا ملزما ولا يوجد نص يجرم من يعلق على الأحكام .. وما ذهب إليه عتيقة وأمثاله ليس لوجه الله و القضاء وإنما هو الظهور في زمن الأشباه .. وهو لم يستند في حظر التعليق إلا على أسباب لها ما يقابلها من رأي آخر وسديد بجواز المتابعة والتعليق على الأحكام لأنها تمس مصائر الناس وتتعلق بحياتهم وتنظم العلاقات والمراكز القانونية بينهم.. وإن الله الذي هو أعلى وأجل من كل قاض ومن كل عتيقة ومن كل رئيس قد حرم الظلم على نفسه وأعلنها ..فلماذا تمنعون الناس أن يشيروا إلى أوجه الظلم ويكشفوها .. إن القضاة ليسوا أنبياء وحتى لوكانوا أنبياء فإن الذي هو خير وأعظم منهم جميعا رسول الله محمد قال في الناس من كنت قد جلدت له ظهرا أو من له مظلمة عندي فهاك أنا فليقتد أو فليقتص بحقه… إيه ياعتيقة ..إيه أيها السائرون نياما .. أفيقوا حتى لا تحل عليكم لعنة أشد وأنكى من التي هي بكم .. هذا الرجل المحترم الشجاع .هذا القاضي الشيخ الجليل .. هكذا يساق بإرهاب من عتيقه وأمثاله إلى منصات الاتهام لأنه قال قولة الحق وهم يريدون الباطل … رحمة الله عليك وبركاته يا مكي أنت وأمثالك . . فكن كما أنت رابضا لهم شديد البأس عليهم عزيزا عليك ما عنتنا حريصا علينا ولا يجرمنك شنآن قوم على ألا تعدل ..إعدل فهو أقرب للتقوى.. والسلام"
archived = "2010-02-08"
