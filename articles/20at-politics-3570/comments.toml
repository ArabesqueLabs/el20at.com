[[comments]]
order = 3
subject = "من بابا و ماما لمحمد ف العراق"
author = "نيفين نيفى نوفا"
posted = "2007-04-11"
text = "انا لما جيت م الغيب العدل كان كيفى<br />و الحق كان مطمعى و الحب كان سيفى<br />و الله ايام غريبه عشناها و عايشينها و لسه هنعيشها<br />انا متهيالى اسود الايام ف تاريخ غزو العراق يوم القاء القبض على صدام<br />طبعا يوم سقوط بغداد يوم اسود برده بس يمكن اقل سوادا<br />لان سقوط رمز الدوله بيبقى ساعات اسوا من سقوط الدوله نفسها و اكيد كلنا شفنا صدام كرمز للزعامه العربيهكان شكله ازاى يومها<br />بتاثير تعذيب بقى بتاثير المخبا اللى كان فيه دى مش المشكله<br />المشكله الشكل اللى ظهر بيه للعالم كله<br />عادى<br />كان ف القلب جرح اسمه فلسطين وزادت الجروح جرح بقى اسمه بغداد<br />اعزائى<br />استمتعو بالسىء فالاسوأ قادم"
archived = "2010-03-14"
capture_url = ""

