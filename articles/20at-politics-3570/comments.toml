subject = "تسلم ايديكم"
author = "مجاهد شرارة"
posted = "2007-04-11"
text = "الاخت مروة والاخت منى فعلا تسلم ايديكم ، شعرت وانا اشاهد الصور واقرأ الكلمات انكم ترون قصة حية لمرحلة من الذل والخداع عايشناها ليس فقط منذ احتلال العراق ولكن منذ ان بدأنا نتنازل عن حقوقنا في وجد كيان يشمل كل العرب والمسلمين ...<br />واجدتم في اخيتار اليوم 9/4 وكأنكم بموقف تمثيلي اردتم ان تتركوا للمشاهد الخيال رحب ان يكمل بنفسه الاحداث ...<br />لي ملحوظة بسيطة<br />هذا الفلاش الرائع لماذا لم يصاحبة موسيقى تعبر ايضا عن الكلمات والصور ؟؟"
archived = "2010-03-14"
