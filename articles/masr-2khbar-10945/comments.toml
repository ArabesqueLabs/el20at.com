[[comments]]
order = 1
subject = "نيران صديقة"
author = "Ashour"
posted = "2009-01-13"
text = "نيران صديقة<br />فهمي هويدي<br />بكل احتشام وأدب مهني جم نشر الأهرام علي صفحته الأولي أمس أن ضابطين من قوات الأمن المركزي المصرية المرابطة علي الحدود مع قطاع غزة أصابتهما شظايا القصف الصاروخي المكثف الذي استهدف الشريط الحدودي، كما أن القصف أصاب طفلين مصريين أحدهما عمره سنتان والآخر خمس سنوات، وأدي إلي تصدع وتهديم بعض المنازل في رفح المصرية، وذكر الخبر المنشور أن الضربات استهدفت أنفاقاً علي بعد 400 متر علي الحدود المصرية.<br />المعلومات التي أوردها خبر الأهرام تجاهلت تفاصيل أخري منها مثلاً أن الشظايا الإسرائيلية أصابت الضابطين المصريين إصابات خطرة في الرأس والظهر، وأن الطائرات الإسرائيلية في غاراتها اخترقت المجال الجوي المصري مرات عديدة، كما ذكرت وكالة «رويترز» ومحطة «سي. ان. ان»، وأن المتحدث باسم وزارة الحرب الإسرائيلية رفض التعليق علي هذه المعلومات.<br />لا أعرف إن كان تجاهل تلك المعلومات تم بسبب السهو أو العمد، لكن الشاهد أن صياغة الأهرام ــ وكذلك بقية الصحف القومية ــ بدت شديدة الهدوء، وكان واضحاً فيها أنها حرصت علي الإيحاء بأن إصابة الضابطين والطفلين كانت علي سبيل الخطأ وليس العمد، وذهبت إلي أبعد، حيث حاولت تغطية ما جري وتبريره، حين ذكرت أن عملية القصف الإسرائيلي استهدفت أنفاقاً علي بعد 400 متر من الحدود المصرية، وهو ما يعطي انطباعاً بأن الطائرات الإسرائيلية لم تخترق المجال الجوي ولم تعتد علي السيادة المصرية، رغم أن وكالة رويترز أمس نقلت عن شهود في رفح المصرية أنهم شاهدوا بأعينهم الطائرات الإسرائيلية التي كانت تطير فوق بيوتهم علي ارتفاع منخفض، وذكرت أن هؤلاء الأشخاص طلبوا عدم ذكر أسمائهم حتي لا يتعرضون لبطش أجهزة الأمن المصرية.<br />إذا قارنت الكيفية التي عولج بها الحدث في الإعلام المصري بالطريقة التي قدم بها خبر مقتل ضابط الشرطة الشهيد الرائد ياسر فريج أثناء محاولة بعض الفلسطينيين عبور الحدود المصرية، فسوف تري عجباً، إذ ستلاحظ علي الفور أن التوجيه الإعلامي حرص علي تهدئة المشاعر للغاية في حالة القصف الإسرائيلي الذي أدي إلي إصابة الضابطين والطفلين المصريين، في حين عمد إلي الإثارة والتحريض في حادث مقتل الضابط المصري، إذ ربما تذكر أن قتل الضابط تم علي سبيل الخطأ، أثناء عبور بعض الفلسطينيين للحدود وتبادل بعضهم إطلاق النار مع عناصر الشرطة المصرية، مما أدي إلي قتل واحد منهم وإصابة عشرة، وهي التفاصيل التي أثبت ورودها في أول نشر للخبر، كما أثبتت الكيفية التي تدخل بها التوجيه الأمني بسرعة، بحيث عمم علي وسائل الإعلام المصرية صياغة مختلفة تماماً، سممت الخبر، وكان واضحاً فيها الحرص علي إثارة الرأي العام وتأجيج مشاعر المصريين ضد حركة حماس تحديداً، فالفلسطينيون الذين تبادلوا إطلاق النار مع الشرطة المصرية لم يعودوا فلسطينيين عاديين، ولكنهم تحولوا في الصياغة المستجدة إلي كوادر من حماس، جاءوا ملثمين، بتعليمات من قيادة حماس، وترصدوا الضابط وقتلوه عمداً «بدم بارد»، وأرادوا بذلك إثارة الفوضي علي الحدود، ولم تشر الصياغة الأمنية إلي قتل الشاب الفلسطيني ولا إلي إصابة زملائه العشرة، أثناء الاشتباك الذي حدث، لكي لا يفهم أن قتل الضابط تم أثناء تبادل لإطلاق النيران بين الجانبين.<br />لا يحتاج المرء إلي جهد لكي يدرك أن الرفق الشديد مقصود في عرض خبر القصف الإسرائيلي، علي نحو أدي إلي حد غض الطرف عن الاعتداء علي السيادة المصرية، والتأكيد علي الخطأ في الموضوع مع تبريره واغتفاره، بذات القدر فإن تعمد الدس والكيد والإثارة ضد حماس كان واضحاً في تلويث خبر اشتباك مجموعة الفلسطينيين مع شرطة الحدود المصرية، ولا تفسير لذلك سوي أن القائمين علي اللعب في الأخبار اعتبروا ما صدر عن إسرائيل كان قصفاً لنيران صديقة، أما الفلسطينيون وحماس بالذات فلهم شأن آخر، أترك لك أن تختار الوصف المناسب له، بحريتك وعلي مسئوليتك!."
