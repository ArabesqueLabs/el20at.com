text = "حلو الموضوع ده أوي وبصحيح عشوب فنان من طراز خاص قد يكون الجندي المجهول وراء أي عمل وما قد أعجبني في الكثير من أعماله فيلميه السادات وناصر 56 فهو بكل المقايس يحمل لقب رائع."
