[[comments]]
order = 2
subject = "منى الشاذلي ليست اعلاميه ولا شهيرة"
author = "مش حاقد"
posted = "2008-12-20"
text = "من موسوكة ويكيبيديا منقول هذا الكلام<br />منى الشاذلي مذيعة و مقدمة برامج مصرية<br />منى الشاذلى.== منى الشاذلي في سطور اسمها الكامل منى محمد محمود أحمد وملقبة بمنى الشاذلى<br />منى الشاذلى تنتسب إلى الأشراف أى أنها شريفه نسبها يعود إلى الإمام علي بن أبي طالب زوج السيدة فاطمة الزهراء بنت الرسول محمد صلى الله عليه و سلم ، وقد ذكر ذلك الامير الحسن بن طلال ولى عهد المملكة الأردنية الهاشمية السابق في إحدى حلقات برنامج العاشرة مساءً اذ ناداها بأبنه العم كناية على كونها من الأشراف .<br />درست العلوم السياسية في الجامعة الأميركية بالقاهرة<br />ــــــــــــــــــــــــــ<br />اخر سطر درست العلوم السياسية في الجامعة الامريكية<br />يعني ما درستش اعلام<br />الاعلامي لازم يكون خريج كلية الاعلام<br />يعني هي مش اعلاميه هي موظفة في قناة دريم لا يجوز اطلاق عليها لقب اعلاميه<br />وبعدين هي بتعتمد على جمالها بنسبة 100% والناس بتتفرج عليها علشان هي حلوه<br />اما كون انها اعلامية شهيرة فهو كذب وافتراء<br />الاعلامي لازم يكون متخرج من كلية الاعلام<br />زي المحامي متخرج من كلية الحقوق<br />والطبيب متخرج من كلية الطب<br />والمعلم متخرج من كلية المعلمين وهكذا<br />منى الشاذلي لا علاقة لها بالاعلام<br />هي حلوه واموره والناس بتحب تتفرج علي جمالها مش عليها<br />وهما سؤالين فارغين بتسألهم كل حلقة اي واحد خريج صنايع يقدر يسألهم هي واللي اسمه وائل الابراشي<br />والشعب الاهبل بيصدق اي حاجه وبيطبل على اي حاجه<br />الاعلام المصري مش حينضف الا لما يقتصر على خريجي كليات الاعلام<br />الا هل بلغت اللهم فاشهد"
archived = "2010-03-14"
capture_url = ""

