posted = "2007-06-30"
text = "ممكن اعرف ليه كووول المصريين عندهم فكره ان السعودية دي صحرا وغباااء وتخلف<br />انا مصريةو عاايشة هناك ولما بروح مصر بلاقي معاملة غريييبة مجرد ما يعرفو اني جاية من السعودية<br />ليييه كدا حررااااااااااام عليكو افهمو بقا<br />كل الدنيا دلوقتي متطورة ولعلمكو بقا السعودية فيها حجات ما شفتوهاش ف مصر اصلا وهم متطورين عننا بكتيير بيني وبينكو للأسف<br />،"
