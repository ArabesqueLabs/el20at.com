[[comments]]
order = 11
subject = "طويل واهبل.. بصو في الصورة"
author = "حكومة تجويع الشعب"
posted = "2008-12-20"
text = "اطول واحد فيهم واهبل واحد عرفتوه طبعا<br />دا طبعا لما جابوه علشان خاطر يرأس الوزارة قالهم لازم ندمج البنوك علشان خاطر الاقتصاد<br />ليه يا نضيف دا السادات لما جه قال لازم نكتر البنوك علشان خاطر الاقتصاد<br />قال لا السادات حمار ما بيفهمش حاجه<br />طيب يا نظيف يعني انت اللي بتفهم<br />طبعا انا بفهم كل حاجه<br />طيب يا جماعة ادمجنوا البنوك<br />وكانت الفايدة 10% وطبعا انتو عارفين ان فيه ناس حطه فلوس في البنوك وبتعتمد على الفايدة الشهرية يعني 10000 جنيه بيجيبوا 100 في الشهر واهي النواية بتسند الزير<br />فعمط نظيف دمج البنوك وعمل الاصلاح والحمد لله والناس استبشرت خيرا وقالت يمكن الارباح بعد اصلاحات نظيف تطلع الى 12% ولا حاجه<br />بصينا لقينا الحمار بعد اصلاحاته نزل الفايدة الى 6%<br />ليه يا حمار مش انت اللي قلت ادمجو البنوك<br />ولا حول ولا قوة الا بالله<br />يعني اللي كان بيروح ياخد 100 جنيه كل شهر من البنك بقا بيروح ياخد 60 جنيه ومعظمهم ارامل والله بيربوا ايتام<br />ادي يا عم حكومة نظيف بتجوع الشعب الارامل والايتام"
