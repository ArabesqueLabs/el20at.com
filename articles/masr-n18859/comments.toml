text = "قالوا ان الملك حرامي وفاسد ومش مصري من اسرة محمد علي التركية ولازم ناس مصريين يحكموا مصر علشان خاطر يحافظوا عليها<br />طيب جه جمال عبدالناصر من بني مر من الصعيد<br />والسادات من ميت ابو الكوم منوفية<br />حسني كفر مصيلحه منوفية<br />يعني التلاته فلاحيين من تراب مصر<br />ومصر عمرها ما شافت سرقة من 7 الاف سنه زي التلاته دول<br />التلاته دول اللي هما ولاد البلد جابوا خبرها من السرقة هما والحاشية بتاعتهم<br />وعلشان خاطر كده ما منوش فايدة تغيير الحكم لان اللي حيجي غيرهم حرامي برضه<br />كل الناس اللي بتتصارع على الحكم حرامية برضه تماما زي التلاته دول"
