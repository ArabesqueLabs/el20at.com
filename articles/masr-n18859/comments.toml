subject = "برنامج مصر للاداء الحكومي المتميز"
author = "امال فين برنامج مصر للاداء الح"
posted = "2008-12-18"
text = "الإخوة والأخوات الموظفين المحترمين<br />تحية طيبة وبعد،<br />يهديكم برنامج دبي للأداء الحكومي المتميز أطيب تحياته ويتمنى لكم دوام التقدم والنجاح وبعد، فإنه انطلاقاً من توجيهات صاحب السمو الشيخ محمد بن راشد آل مكتوم نائب رئيس الدولة رئيس مجلس الوزراء حاكم دبي المتضمنة وجوب التعرف على آراء وملاحظات الموظفين فيما يتعلق بظروف عملهم في القطاع الحكومي، يجري البرنامج سنوياً دراسة تهدف إلى التعرف على آرائكم وملاحظاتكم وقياس مستويات رضاكم عن بيئة وظروف عملكم.<br />وقد تم اختياركم ضمن عينة عشوائية من موظفي الدوائر الحكومية للإجابة على أسئلة الاستبيان المرفق، راجين الإجابة عليها بكل دقة وموضوعية وأمانة وإرسال إجاباتكم على عنوان البريد الإكتروني الموضح أدناه في أسرع وقت ممكن.<br />http://acnonline.com/cl.asp?cp=p279673392&u=13712&p=nbqyn<br />نشكركم على اهتمامكم وتعاونكم، ونوّد أن نؤكد لكم بأن جميع المعلومات والإجابات التي تقدمونها ستعامل بمنتهى السرية وسيستفاد منها لغايات تطوير الأداء في مجال إدارة الموارد البشرية.<br />وأقبلوا فائق الشكر والتقدير،،،<br />برنامج دبي للأداء الحكومي المتميز"
archived = "2008-12-18"
