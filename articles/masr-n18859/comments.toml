[[comments]]
order = 8
subject = "فضيحة جديدة تضرب مشروع مبارك القومي للاسكان،"
author = "منتدى محاورات المصريين"
posted = "2008-12-19"
text = "كاتب الموضوع: فيصل رافت Oct 1 2008, 04:29 PM<br />فضيحة جديدة تضرب مشروع مبارك القومي للاسكان، لكن هذه المرة بطل الفضيحة ليس وزارة الاسكان بمفردها وانما تتقاسم بطولة الفضيحة مع شركة اوراسكوم التي حصلت علي 40 فدانا في أفضل مناطق مدينة اكتوبر لتشارك فيما اسموه بمحور القطاع الخاص في المشروع القومي لإسكان الشباب وفقا للبرنامج الانتخابي للرئيس مبارك. تفاصيل الفضيحة كثيرة ومتعددة، لكننا سنبدأ من البداية. منذ ستة أشهر تقريبا وقعت شركة أوراسكوم اتفاقية مع وزارة الاسكان تقضي بحصول الشركة علي 40 فدانا تقع خلف مدينة الانتاج الاعلامي علي طريق الواحات البحرية بسعر رخيص جدا مقابل أن تبني مساكن للشباب مدعومة من الحكومة بـ 15 الف جنيه لكل وحدة سكنية علي نصف الارض وتبني الشركة مساكن استثمارية تباع وحداتها بالسعر الحر علي النصف الثاني من الأرض. الاتفاق يقضي أيضا بأن تبني اوراسكوم الارض كلها في مدة زمنية محددة مما يلزمها بالتزامن في البناء، الشباب مع الاستثماري حتي لا تقع في خطيئة \\\"تسقيع\\\" الارض المخصصة للوحدات الاستثمارية. الوحدة السكنية وفقا للاتفاق تكلفتها 50 الف جنيه تدعمها الدولة بـ 15 الف جنيه منحة لا ترد. الي هنا والاتفاق واضح وبسيط وسليم وان كان ينقصه جهة تشرف عليه. الفضيحة ظهرت عندما خرجت المباني للنور، وانكشفت اللعبة التي قررت أوراسكوم ان تضحك بها علي الجميع، بمن فيهم السادة كبارات وزارة الاسكان من وزيرها حتي خفرائها. لأول مرة في مشروع اسكان قومي مخصص له مليارات الجنيهات وتعمل خلفه وزارات مصر كلها وفقا لتوجيهات الرئيس مبارك ان يتم البناء بدون اساسات وبدون كمرات حاملة وبدون عمدان مسلحة وبدون حديد مسلح. لأول مرة يتم بناء مشروع قومي بنظام الحوائط الحاملة التي توقف عن بنائها الفقراء بعد ان وقعت علي رءوسهم كثيرا. هذه الحوائط الحاملة مبنية علي \\\"فرشة\\\" اسمنتية سمكها 9 سم فقط من المفترض ان تحمل مبني ارتفاعه ثمانية أمتار، نفس الحوائط الحاملة المكونة من الطوب الابيض ستحمل سقفا سمكه 9 سم فقط يحمل بالتبعية دوراً ثانيا من الحوائط الحاملة. لهذه الدرجة وصلت الاستهانة ببرنامج الرئيس وبحياة الناس وبعقول القائمين علي وزارة الاسكان، ومع ذلك ليت الامر توقف عند هذا الحد، بل إن المفاجأة الحقيقية هي تكلفة الوحدة بطريقة البناء هذه المخجلة، فقد كشف عقد من عقود مقاولي الباطن أن تكلفة المبني الواحد المكون من أربع شقق سكنية مساحة كل شقة 63 مترا محدد بـ 34 الف جنيه فقط يعني الشقة الواحدة تكلفتها لن تتجاوز الـ 8500 جنيه فقط. لهذه الدرجة يتم الاستهتار ببرنامج الرئيس وبحياة الناس وبعقول القائمين علي وزارة الاسكان، فلو علمنا أن السعر الذي حددته اوراسكوم للشقة الدور الارضي بـ60 الف جنيه والشقة بالدور العلوي بـ75 الف جنيه يضاف اليها فائدة سنوية علي التقسيط ترفع تكلفة الشقة 20 الف جنيه اخري يعني ذلك ان اوراسكوم كلفت المبني ثمانية آلاف وخمسمائة جنيه وستحصل علي ثمنها \\\"الكاش\\\" متوسط 67.5 الف جنيه أضف اليها 15 الف جنيه منحة لا ترد من الدولة للمشروع يكون اجمالي ما ستحصل عليه من المبني المكون من أربع وحدات سكنية 270 الف جنيه أضف اليها 60 الف جنيه منحة الدولة للشقق الاربع يكون الاجمالي 330 الف جنيه. يعني صافي الربح للشركة من المبني الواحد بعد خصم التكلفة الرهيبة 296 الف جنيه. يعني لو قامت اوراسكوم ببناء 500 مبني بهذه الطريقة ستحصل علي أرباح قدرها 148 مليون جنيه، يا بلاش والله. الأغرب من كل ما سبق ومن كل ما سيأتي أن اوراسكوم لم تشترط في مقاولي الباطن المسند اليهم اعمال البناء \\\"العبيطة\\\" أي سابق خبرة أو أي اشتراطات تضمن الجودة والسمعة فقط بطاقة ضريبية وتحصل علي عقد مقاولة لأي مبني بسعر 34 الف جنيه. هل هناك سر وراء هذه المهزلة؟ نعم سر بسيط جدا، هو أن مشروع اوراسكوم ليس عليه رقيب، لا جهاز مدينة اكتوبر ولا هيئة المجتمعات العمرانية ولا قطاع اسكان الشباب بالوزارة ولا حتي جهة محايدة من تل أبيب تضمن تنفيذ الاتفاق بتفاصيله الكثيرة. سؤال واحد نختم به هذه الفضيحة، هل كل المشاريع الاسكانية التي تتم في المدن الجديدة تنشأ بنفس الطريقة وبنفس الطناش؟ وحتي نبسط المسألة للسادة القائمين علي وزارة الاسكان الافاضل نلخص كوارث اوراسكوم في هذه الفضيحة في الآتي: أولا :اختراع نظام جديد للبناء خاصة في الأساسات فبدلا من حقن التربة قبل صب الأساسات قامت بصب الأساسات مباشرة ضاربة عرض الحائط بالطرق الهندسية المعتمدة، الامر الذي قد يسبب خطرا علي المبني حتي لو بارتفاعات صغيرة لأن التربة في هذا المكان تحتاج للحقن حتي لا تسبب ميلا في الأساسات بعد فترة. ثانيا : إن شركة اوراسكوم لم تسدد ثلاثة أقساط علي التوالي منذ استلامها للأرض الأمر الذي يوقعها تحت طائلة مخالفة العقد وبالتالي سحب الأرض من الشركة بما عليها من إنشاءات. ثالثا: إن الاتفاق مع وزارة الاسكان يقضي ببناء وحدات سكنية تكلفتها 50 الف جنيه وليس 8500 جنيه بالمخالفة للاتفاق. رابعا: إن الأرض تم تنظيمها بحيث تكون نصفها للشباب والنصف الثاني للاستثمار علي ان يكون البناء متزامن بين الاثنين، لكن أوراسكوم قامت بالمشروع في بناء الجزء الخاص بالشباب وتسقيع النصف الآخر الاستثماري لحين الانتهاء من الشباب وبالتالي سيكون سعر متر الارض مختلفاً تماما بعد تعمير بقية الارض.<br />هذا الموضوع نهديه للسيد أحمد المغربي وزيرالاسكان للبت فيه، فهل يتعامل معه بنفس الحماسة التي يظهرها علي أراضي الغلابة أم ان أوراسكوم \\\"عضمة ناشفة\\\" قد لا يستطيع إعادتها للصواب؟!"
