text = "السيد الرئيس بيفتخر ان الاقتصاد حقق معدل تنمية 7 %<br />والسيد وزير الاثتثمار مزاطط على الاخر ان الاقتصاد حقق 7%<br />والسيد وزير التنمية فرحان ان التنمية 7 %<br />التنمية 7 فى المية لمين<br />اية العائد منها على العاطلين - وبتوع المعاش المبكر - والعاملين فى الدولة<br />مفيش<br />معدل الزيادة فى التنمية رايح ل 300 الف من الشعب المصرى - من الحرامية والنصابين والهليبة<br />الزيادة يا سيدى بتروح للايطاليين اصحاب مصانع الاسمنت<br />وللخليجيين اصحاب فنادق الخمس نجوم والقرى السياحية<br />اما الشعب فالنسبة صفر فى المية فى التنمية او وصول معدل الزيادة فى التنمية الى 100 % فلن يشوف منها حاجة<br />الشعب بيشوف زيادة فقط فى الضرايب واستحداث ضرايب جديدة زى الضريبة العقارية وزيادة قيمة المخالفات على السيارات وتطليع عيون الناس<br />انا مش عايز كلب من الحكومة يقول لى معدل زيادة التنمية 7 % طيب وانا مالى ما دام ما ليش فيها حاجة - والا بتغيظ فيا<br />حلال عليكم يا ولاد ال<br />حكومة ال"
