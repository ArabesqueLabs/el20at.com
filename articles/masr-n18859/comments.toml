text = "أنين من العالم الآخر ….. ؟؟؟<br />سامع أنين أرواح متعذبة وبريئة<br />بتسأل ربها وكل حبة تراب<br />فوق أرضها ….<br />والمسلمين من شعبها<br />وحتي الولي في أمرها ….<br />وبتسأل كمان الرئيس<br />ذنبي أيه أموت فطيس ؟<br />وليه ياناس أروح رخيص ؟<br />أرواح بتسأل ربها<br />أيه بس ذنبها ؟<br />ولا أيه حتي جرمها ….<br />ومين جلاد نحرها ؟ واللي خطف سر الحياة<br />من بين ثنايا جلدها ….<br />وليه هدرتم حقها في دمها ….<br />ومن حقها ….<br />ومن بشاعة أو فظاعة أو كآبة<br />منظر وأدها ….<br />وعلي غير هواها أو مرادها<br />وودها ….<br />بتصرخ يامسلمين يا موحدين ….<br />فين الحقيقة ؟<br />اللي غابت واللي في غياهب الظلم<br />ضاعت ؟<br />والمسئولية فين في ….<br />أرواح العباد اللي ماتت ؟<br />في بحار متغربة وغريقة ….<br />واللي أكلتهم نار الحريقة ….<br />واللي مؤدين تحت صخور جبال العار<br />في الدويقة ….<br />أرواح رافضة ترتاح<br />وبتناجي ربها ….<br />وبتصرخ في وش كل طاغي<br />عايزة منه حقها ؟<br />وبتسأله ليه سلبها ….<br />حتي حياتها التعيسة في حلمها ….<br />أرواح حيرانة بتسأل ؟ أيه ذنبها ؟<br />ومين وفين الجبان<br />اللي أهدر واللي سفك<br />عرضها ولحمها مع دمها ؟<br />و مين اللي سرق ….<br />حتي حق حياة الذل ….<br />من كفها ؟<br />أرواح بترفع لعرش الرحمن أكفها<br />وبتسأل فين الحساب ؟<br />فين القصاص ؟<br />أرواح بتصرخ ليه ياغجر؟<br />وليه كل مصيبة ليكم ….<br />بتلزقوها في حق القضا أو القدر ؟<br />وهو القدر<br />تغتالوني بدون إرادة ؟<br />ولا الإرادة في شرعكم<br />هي الإبادة ؟<br />تغتالوني ليه ….<br />بدم بارد وفي بلادة<br />وليه العار في دمكم يا كلاب ….<br />أصبح عبادة ؟<br />وليه دمي ضاع في دولة فاسدة<br />ما بين رئيس ….<br />و ما بين عصابة أو قيادة ؟"
