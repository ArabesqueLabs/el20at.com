subject = "بلاغ عاجل لمعالي السيد المستشار  النائب العام"
author = "محاسب / محمد غيث  -  محاسب / م"
posted = "2008-12-26"
text = "بسم الله الرحمن الرحيم<br />بلاغ عاجل<br />إلي عدالة معالي السيد المستشار النائب العام الموقر .<br />مقدمه لعدالتكم المواطن / محمد غيث محمود - والمواطن / محمد شريف فاروق .<br />كبيري محاسبين ( مديري عموم ) بهيئة تنفيذ مشروعات المحطات المائية لتوليد الكهرباء واضعين رفق بلاغنا هذا صورة ضوئية كاملة عن أدلة ثبوت مسئولية المتهمين ومذكرة الإحالة وقرارها الصادر عن المكتب الفني لرئيس هيئة النيابة الإدارية في القضية رقم 22 لسنة 2007 رئاسة الهيئة المذكورة والمقيدة برقم دعوي 83 لسنة 50 ق - تأديبية عليا .<br />ونحن هنا وبموجبه نتقدم إلي عدالة معاليكم الرفيعة والكاملة ليس باعتبارنا فقط المبلغين والشاكيين الأصليين في أحداث ووقائع وملابسات تلك القضية ولكن يسبق ذلك كله كوننا من المواطنين المصريين الشرفاء الذين آمنوا فاقتدوا بنهج وتطلعات ومباديء السيد الوالد الزعيم رئيس الجمهورية والتي تلاقت وتلاحمت مع عدالة معاليكم في التطلع إلي تحقيق رواسخ وثوابت قواعد ومباديء الشفافية والطهارة والنزاهة والأمانة الوطنية أمام الله وولاة أمورنا من بعده علي مال الدولة العام والضرب بيد من حديد علي كل من تسول له نفسه التلاعب بأموال ومقدرات هذا الشعب وتأسيساً علي أن العدل هو أساس الملك وخاصة عندما يصل الحد الكارثي والأستهتار وانعدام الضمائر إلي إهدارعشرات إن لم يكن مئات الملايين من المال العام المحرم والمجرم بين تبديد وإهدار وتزوير وتربح وظيفي محرم وفساد بالملايين تكاد أن تنطق به كل ورقة من المرفقات الموضوعة بين أياديكم الطاهرة في الوقت الذي نعاني فيه جميعاً بلا استثناء حكومة أو شعباً من وطأة الحياة الصعبة والظروف الأقتصادية الخانقة والقاهرة وفي ظل موارد محدودة والتي طالت الجميع وتأن معها جميع الأسر المصرية من أزمات لطوابير البطالة لشباب متعطل أو الغذاء أو المواصلات أو الرعاية الصحية الكريمة وغيرها والتي هي الشغل الشاغل لأحلام وتطلعات رئيس حالم ومتطلع وحكيم وحكومة رشيدة وشعب صابر ومكافح بينما هناك وفي الجانب المظلم الآخر من لايهمه ولا يثمن بأي قيمة تحقيق متطلبات وتطلعات هذه الأمة ويتعمد وبدافع من الأنانية المفرطة وانعدام الحس والضمير الوطني واللآمسئولية إلا أن يخرب ويحفر في أساسيات بنيان هذا المجتمع المتلاحم لكي يهدم وعن عمد كل هذه التطلعات ويقتل فينا وفي الأجيال القادمة حتي مجرد حق الحلم بغد أفضل ووسائله وأدواته في ذلك الهدم إنما هي الإهدار والتبديد والتزوير والتربح ما أمكن من مال الدولة العام وهذا هو لب قضيتنا هذه والتي كنا فيها السباقين بالشكوي والإبلاغ .<br />نحن نتشرف بأن نضع بلاغنا هذا بين أيادي معاليكم الطاهرة وعدالتكم الرفيعة والسامية والتي هي الحصن الحصين لجميع الشرفاء من أبناء هذا الشعب الكريم وأن نحتكم إلي معاليكم ليس فقط بصفتكم الكريمة المشرفة كنائب عام لدولتنا الأبية ولكن أيضاً كون معاليكم شيخ شيوخ قضاة مصر وأساتذتها الأجلاء ويد الله العادل والعادلة في أرضه لتحقيق ثوابت ورواسخ العدالة الكاملة بين مواطنينا وفي مجتمعنا الذي يتشرف بوجودكم ووظيفتكم الجليلة والتي هي أيضاً تتشرف بوجودكم علي رأسها ولن ننسي أو ينسي مواطناً شريفاً علي أرض المحروسة موقف معاليكم المشرف والمحفور في ضمير هذه الأمة ووجدانها والذي يترجم وبكل شرف مدي الأمانة والوطنية والعدل الكامل ومعاليكم تتصدون بشخصكم الكريم وصفتكم الجليلة في قضية العبارة الشهيرة لكي تترجموا معاليكم نبض الحس الوطني الجارف لجميع من أحبوكم وعرفوكم قائداً هماماً ومقداماً في إرساخ قواعد العدالة حين يجنح البعض .<br />وفي قضيتنا تلك والمعروضة علي عدالة معاليكم فأننا نري أن هيئة النيابة الإدارية الموقرة وسعادة السيد المستشار الذي تولي مجريات التحقيق في ملابساتها ربما قد يكون قد جانب الصواب وصحيح القانون عن غير ذي عمد لأنه علي الرغم من تردد العبارات والكلمات الواردة في دباجة عبارات سيادة المحقق والموضوعة أمام عدالتكم والتي يؤكد فيها سيادته مراراً وتكراراً علي ثبوت وقائع الإهدار والتبديد – والأتيان بما أضر بمالية الدولة – والتزوير في محررات ومكاتبات رسمية وتوقيعات مزورة لموظفين عموميين – وثبوت واقعة الرشي وتزوير التوقيعات فيها – وثبوت واقعة التربح الوظيفي – بل ووصولاً لجسامة نهب مال عام بأسماء أشخاص وهميين ؟ لا وجود لهم ؟ وكما هو ثابت برأي وتحقيقات النيابة الإدارية وما تنطق به كل ورقة موضوعة بين أياديكم الطاهرة إلا أنه علي الرغم من كل تلك الوقائع المحرمة والمجرمة جنائياً واعترافات بعض المتهمين فيها فإن النيابة الإدارية وفي الصفحة رقم 124/ 143 تحديداً من المذكرة أقرت بنفسها وفي نصها بأن المخالفات محل التحقيق أنطوت علي ( جرائم جنائية مؤثمة ) بالمادة 113 من قانون العقوبات ؟ إلا أن النيابة الإدارية وبعد ذلك كله نراها وقد جانبت صحيح القانون حين عمدت إلي عدم الفصل في الأختصاصات ؟ ويتضح ذلك جلياً في قرارها بصرف النظر عن إبلاغ النيابة العامة في حق المتهمين؟ مع أنها أي النيابة العامة أصبحت هنا الخصم الأصيل تجاه المتهمين لحفظ واسترداد مال الدولة العام المسلوب والمتربح ؟ بل أن النيابة الإدارية الموقرة بذلك التصرف إنما قد تمنح الجناة الفرصة الذهبية للإفلات من يد العدالة بما حملوا وأثقلوا من مال الدولة العام؟ فضلاً علي كونها تنحي النيابة العامة عن القيام باختصاصاتها وواجباتها ودورها كخصم أصيل ومختص أمام الجناة ؟ هذا في الوقت الذي تقر وتؤكد فيه النيابة الإدارية أنهم أرتكبوا ( جرائم جنائية مؤثمة بالمادة 113) وغيرها من قانون العقوبات وبحسب نصها - وهو ما يمثل تضارباً وخطئاً فادحاً وواضحاً نري أن النيابة الإدارية قد جانبت فيه حد الصواب وصحيح القانون بعدم إبلاغها النيابة العامة باعتبارها أنها قد أصبحت هنا هي جهة الأختصاص والأختصام الأصيلة للجناة - وطالما أرتكبوا جرائم جنائية مؤثمة بالمواد 113 وغيرها من قانون العقوبات وبحسب نص وتأكيد النيابة الإدارية نفسها ذلك .<br />وعليه فأننا نتشرف بأن نطرح ونضع بين عدالة معاليكم وأياديكم الطاهرة بلاغنا هذا مؤيداً ومدعوماً بالمستندات المرفقة ملتمسين من عدالة معاليكم نحو التفضل بالنظر في ضرورة تحويل الموضوع والقضية برمتها للطرح علي النيابة العامة باعتبارها هي جهة أختصاص وخصم أصيل لا يجوز تجنيبه أو تحييده أو تنحيته تجاه الجناة في قضيتنا هذه وحفاظاً علي حق الدولة والمجتمع في المال العام واسترداه من قبل الناهبين والمتربحين وعملاً وتحقيقاً في الوقت ذاته بمبدأ الفصل بين السلطات والأختصاصات القضائية والعدلية في القضايا المنظورة والمطروحة أمامها .<br />وتفضلوا معاليكم بقبول وافر وأسمي آيات التوقير والإجلال والأحترام .<br />مقدمه لمعاليكم :<br />المواطن / محمد غيث محمود الدستاوي.<br />ت : 23162833 – 0101989788 - 0121069534<br />المواطن / محمد شريف فاروق محمد .<br />ت : 23698963 – 0103854743<br />25/12/2008"
