text = "سياسة عض البردعة ؟<br />بصراحة وكوني واحداً من مثقفي أبناء مصر المحروسة فأنا وربما بطبعي الخاص لا ولم تعجبني أياً من مقالات الأستاذ / أسامة سرايا مع احترامي الكبير لسيادته لأنني فضلاً علي إحساسي الخاص والمتواضع بأنها تتسم في صياغتها ودباجتها بسياسة اللف والدوران حول الموضوع الذي تقصده وأياً كان هذا الموضوع أو محوره فأنني أري مقالاته تتعمد الإيحاء بفكرة أو مراد الكاتب والذي يمكنك أن تستشعره دون أن تحسه أوتقتنع به فضلاً علي أنه يعمد إلي دون الدخول بصراحة أو شفافية ومباشرة في لب الموضوع المثار أو المطروح علي القاريء معتمداً سياسة اللف والدوران المربكة حوله مما يجعل القاريء محيراً عن مقصد الكاتب أو غايته المبتغاة من الطرح وبالطبع فليس بخاف علي القراء أن مقالات سيادته هي في أساسها مقالات سياسية وموجهة بالدرجة الأولي سواء في مواضيعها أو غايتها ومن ثم فهي تخدم وتعبر وبالدرجة الأولي وتترجم رأي نظام سياسي بعينه في موضوع ما أو قضية ما مطروحة ومن ثم فهي كما جاءت أشعر أنها ذهبت أدراج الرياح لأنها في حقيقتها لا تحمل لنا فكر ذاتي أو شخصي لرجل من رجالات الصحافة والأدب يطرح علي القاريء قضية ما أو موضوعاً دسماً ما منبعه فيه هو رأيه وفكره الخاص المحيد والشخصي ومولده فيه هو ثنايا موهبته وبواطن عواطفه وتوجهاته الخاصة وحتي يشعر القاريء بالأشباع الفكري والثقافي وحتي البعد السياسي الصادق بعد قراءته للمقالة ولعل الكاتب في آخر مقالاته التي نشرت بصحيفة أهرام الجمعة 26 /12/2008 والتي جاءت بعنوان \" أوهام حماس \" لم يحالفه الحظ كالعادة معي في أن أعرف ماهية مراده ومقصده فلقد تركني كالعادة محيراً وهو ربما لا يعلم أنني مخيراً كمثقف وأنني لن أقبل بوجبة طعام قد لا تروقني أو أستسيغ طعمها؟ فهو كثيراً في مقالات لسيادته سابقة كانوا يشيدون بحماس وقادة حماس ؟ والآن وفجأة تجلد وتركل حماس ؟ وبوضوح غير خاف علي أحد وخاصة فور زيارة تلك الشمطاء اليهودية تسيبي ليفني وزيرة خارجية الكيان الغاصب ومقابلتها للسيد الرئيس مبارك ؟ وبما ينذر وفي شعوري الخاص بكارثة ما في طريقها إلي حماس وقادتها وقريباً جداً وهذا ما لانرجوه لأي عربي مسلم علي وجه العموم؟ وخاصة هؤلاء الذين يواجهون طائرات العدو الغاشم ببنادق ومنجنيق ؟ ثم ينتقل بنا الكاتب وفي ذكاء وداهية وإن كانت محيرة ومربكبة فهي لا تخقي علي أحد لخلط الأوراق كالعادة وتوزيعها فيما بين قادة حماس وايران وسوريا ؟ ووهم القوة الفارسية والمؤامرات الأيرانية والأخطاء السورية وصولاً إلي وهم المشروع السياسي الأصولي والذي تتبناه حماس والذي يتجاوز فلسطين ؟ برأي الكاتب ليصل بين المغرب وأندونيسيا؟ علي حد رأي ورؤي الكاتب أيضاً ؟ وأنا كمواطن مصري عادي أتساءل وأنا أري شعباً ذليلاً كسيحاً محاصراً لا حول له ولا قوة إلا بالله العلي العظيم ؟ وأري وبرأيي المتواضع وعلي الرغم من أخطاء حماس الفادحة أو قادة حماس ونهمهم للسلطة والحكم والتحكم ضاربين عرض الحائط هم ومنظمة فتح وغيرهم من منظمات لاندري لها عدداً أومسميات بمصالح قضيتهم الأساسية وبقضية التحرير أوتحديد المصير لشعب مقهور لا حول له ولاقوة بين نزاعات وهوس السلطة والحكم بين تلك المنظمات وبعضها والتي تركت قضيتها الأساسية للتناحر علي هوس وجنون الحكم والسيطرة إلا أنهم وفي النهاية جميعاً ومنهم حماس فهي لاتصنف سوي منظمة متواضعة الأمكانيات والقدرات فهم لم ولن يكونوا قوة ما للتأثير أو المد تجاوزاً للمغرب ووصولاً لأندونيسيا ؟ برؤي الكاتب ؟ وهم الذين حتي لا يمتلكون فرض تواجدهم علي رقعة متواضعة المساحة أو شريط ساحلي غاية التواضع أسمه ( قطاع - غزة ) فكيف لهم بهذا المد الجارف الذي يتصوره أو يطرحه علينا الكاتب ؟ ثم في حديثه عن أوهام القوة الأيرانية واعتماد البعض عليها فأنا هنا لايهمني وبالمقام الأول كمواطن مصري سوي وطني وبلادي وموطني وأتساءل هل تلك الدولة الفارسية والتي أنهكتها الحرب مع صدام لدرجة الأنهيار الشبه كامل ومازال ماثلاً أمام عيني ( مقالات لمفاتيح الجنة ) وهي تلك المفاتيح التي كان النظام الخميني يمنحها لجنوده وجيشه للأنتحار والذي لاقي مراده ومراره علي يد جيش دولة صدام حينها ؟ فها هي نفس تلك الدولة الفارسية والتي خرجت من حرب العراق شبه معاقة من كافة النواحي الأقتصادية والأجتماعية والسياسية والعسكرية ؟ وفجأة ونحن ( النيام الغافلون ) وفي غيبوبة وسبات عميق كأهل الكهف ؟ نجدها تخرج علينا وعلي الجميع لتنتج وتصنع وبأيادي علماؤها وأبناؤها منظومات الصواريخ ذاتية الدفع القصيرة والمتوسطة والطويلة المدي والدبابات والسفن والغواصات بل والطائرات بل والتوجه إلي إطلاق قمر صناعي والجميع صنع مصانعها ؟ وتجري التجارب الناجحة تلو التجارب علي أحدث أسلحة العصر من منتجات محلية خالصة وصولاً إلي تطلعها النووي وبرنامجها المتنامي وأجهزة الطرد المركزي والتي تصنعها بالكامل في مصانعها وإمكاناتها المثيرة للجدل وللحسد وللإعجاب في الوقت ذاته ؟ وهي أولاً وأخيراً دولة إسلامية وإن أختلفت فينا الملل أو تشيعت وتفرقت بنا المذاهب ؟ وحتي ولو أرادوا أن يظهروها بمظهر فزاعة للعصافير ؟ في المنطقة العربية وخاصة عصافير وحمائم وغربان دول الخليج ؟ والسؤال الذي أطرحه أنا كمواطن مصري حتي النخاع ؟ وما يهمني في هذا السرد والسراديب والمتاهات السياسية تلك هو سؤالاً واحداً ملح وعاجل بل ومصيري ؟ أين نحن الآن من تلك القوة الفارسية ووهمها المزعوم كما تتحدث المقالة ؟ وأين كنا غافلون ونائمون عن هذا المد والنماء والأزدهار والتقدم الفارسي طوال تلك السنوات ؟ وهل نحن أنقص من هؤلاء الفرس أو أقل منهم علماً أو مالاً أوعدداً أو علماءً أو ذكاء وموهبة وحضارة ووطنية وغيره ؟ أم نحن الآن فقط استيقظنا من سباتنا العميق لنجد أنفسنا خارج نطاق القوي الجادة والمسيطرة والمؤثرة في صنع القرار الأقليمي والدولي فبدأنا فقط والآن نتبع سياسة ( قضم الأظافر؟ ) وخلط الأوراق أو بصراحة أوضح سياسة ( عض البردعة ) ؟ بينما هؤلاء الفرس يعضون في جرأة وثقة وثبات قلب ( البرادعي ؟) بل وقلب أوروبا وأمريكا ذاتها ؟ أعتقد أنني وبالمقام الأول كمواطن مصري لا يعنيني من قريب أو من بعيد أي قضية سوي قضية أوقضايا وطني مصر ولعل أولها وأهمها هو أمنها القومي والأقليمي والتي تتقزم عندها بل وتتلاشي كافة القضايا والعنتريات والأفتراضات ورؤي المد أو الجذر هذه ؟ وبدلاً من التباكي علي اللبن المسكوب ؟ والدخول في جدل بيزنطي أو ثرثرات ومقالات سياسية لا تسمن ولا تغني من جوع فلنعد لنا ولأعداؤنا مااستطعنا من قوة وليس هناك من خجل علي عموم الأطلاق أن نقلد أو لنتفوق علي ( التجربة الفارسية ) تلك وأن نبدأ من الآن سياسة العمل في صمت بعيداًعن تلك الثرثرة والفلسفات والنظريات والتي لن تخدمنا ولن تضيف شيئاً ما إلي قوتنا ومكانتنا الأقليمية أو الدولية ؟ وكفانا سياسة ( عض البردعة ؟) ولنبدأ ومن الآن وصاعداً وفي صمت وإرادة وطنية حقيقية وثقة بالذات وبقدراتنا نحن الفراعنة أحفاد صناع الحضارات ومنارة الأمم ونبع العلوم علينا وبكل صدق وأمانة وضمير وطني حر أتباع سياسة ( أعدوا لهم ماأستطعتم من قوة – بشرط أن تكون محلية الصنع ؟) ."
