subject = "مركوب الزيدي - ومركوب أبومازن ؟"
author = "محمد غيث آل دستاوي"
posted = "2008-12-20"
text = "مركوب الزيدي ومركوب أبو مازن ؟<br />قد يخفي علي الكثير من العامة والمثقفون العرب أن حذاء السيد أبو مازن ثمنه 25 ألف يورو وهو من أشهر بيوت الأزياء والماركات العالمية وهو بنفسه أكد ذلك متفاخراً؟ بينما حذاء الزيدي العربي العراقي البطل أسد الرافدين فهو حتماً مثل أحذيتنا نحن الغلابة من أبناء هذا الشعب العربي المغلوبون علي أمرهم وربما قد اشتراه من حر ماله من أحدي أرصفة شارع الموسكي؟ بالعراق ؟ أما الأول فقد دفع ثمنه الفاجر والفاخر من دماء شعب يتسول طعامه ومن جماجم وعظام ولحم أبطال فلسطين وشبابها الذين فجروا أنفسهم فتاتاً من أجل قضية ومبدأ ولكي يستمر السيد أبو مازن راكباً مركوبه المكلف هذا ليحمله إلي دار أسياده في الغرب وخاصة إلي هذا الشيطان المريد الرجيم \" بوش \" الكلب الأبيض في البيت الأسود .<br />وللمفارقة العجيبة أن يطرأ الآن في ذهني المقارنة بين هذين النعلين ولعل الأول يمثل حذاء لرمز سياسي أو لرئيس دولة عربية ( لم تقم بعد ) والثاني لحذاء صحفي عادي ومواطن عربي شريف فالأول وعلي الرغم من حرمانية مصدر الثمن المدفوع في حذاؤه فهو لم يطلي أو يزيد عليه قيمة أو ميزة ما ؟ اللهم سوي أنه قد ركب هذا الحذاء أو المركوب ( بالصعيدي ؟ ) ليأخذه كما أسلفنا إلي أوكار أسياده في أوروبا أو للكلب الأسود في البيت الأسود أو ليتناول وجبات غذاء ( عمل ؟) فاخرة لم تسمن ولم تغن من جوع مع قرينه الأسرائيلي قاتل صبية وأطفال ونساء فلسطين والموصوم أيضاً بتهمة الفساد والآستيلاء علي المال العام ؟ ومازال السيد أبو مازن راكباً مركوبه المكلف هذا دون أن يقدم أي جديد لا للعرب ولا للقضية الفلسطينية اللهم سوي التشيع والأنقسام وضياع شعب وحلم وقضية وتضحيات لا تثمن بين أطماع في سلطة لا تدوم وأحذية مكلفة دون أي طائل ؟ أما الزيدي أسد الرافدين فقد عرف كيف يستغل حذاؤه المتواضع أسمي استغلال وأنبل استخدام حين وجهه وسدده بمهارة إلي وجه الكلب الأبيض للبيت الأسود وهو يزأر في وجه الكلب الأذغر قائلا ً ( هذه هي قبلة الوداع ياكلب ) وهو بهذا التصرف الوطني إنما قذف بيد مئات الملايين من أبناء شعوب العرب بحذاؤه المتواضع هذا وجه العمالة والدياسة ولكي يصرخ الجميع معه بنشوة وبغضب ويرددوا معه قوله الخالد ( هذه قبلة الوداع ياكلب ) وبهذا يعد حذاء الزيدي هو أغلي وأثمن حذاء علي وجه البرية سواء من حيث القيمة أو المعني أو الأستخدام والرمز وبالطبع يتضاءل هنا ليتقزم معه حذاء أبو مازن ومن هم علي شاكلته ليصبح بلا معني ولا هوية ولا قيمة ولا سعر ؟ ولكي يبقي السؤال المطروح الآن هل يعي هذا الكلب بوش ماهية ومدي حقارة وتدني وانحطاط هذه الإهانة ؟ وهل وصلت الرسالة إلي كل الموصومين والموشومين بوصم وبوشم العمالة ؟ ولعل مايحزنني في الأمر كله أن خبراء المفرقعات من الأوباش المصاحبين للكلب الأبيض قد أتلفوا حذاء الزيدي بحثاً عن متفجرات قد تكون داخله وهم بالطبع من تلك الفئات التي تصنف بالشواذ واللواط والدياسة ومن ثم فهم لا يفهمون ولا يثمنون أن كل متفجرات العالم أجمع قد انفجرت في وجه هذا الكلب الأجرب بمجرد قذف وجهه التعس بهذا الحذاء العربي الغالي والنفيس والذي كان يجب أن يوضع في متحف خاص لكي يظل للأجيال العربية القادمة رمزاً للحرية والتعبير والوطنية والرفض للخيانة والعمالة والأستعمار وأصحاب الطرح البيضاء من حكامنا ومن المفروضين علينا كابوساً لا ينتهي ولا يريد ؟"
