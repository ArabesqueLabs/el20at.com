subject = "غادة عادل ترفع اجرها في التليفزيون إلى مليون جنيه"
author = "مليون"
posted = "2009-03-18"
text = "غادة عادل ترفع اجرها في التليفزيون إلى مليون جنيه<br />رشا لطفي - خاص - بعد نجاح آخر أعمالها التليفزيونية وأدائها اللافت من خلال مسلسل \"قلب ميت\" قررت النجمة غادة عادل رفع أجرها إلى مليون جنيه نظير المشاركة في أي مسلسل تليفزيوني.<br />وربما هذا السبب هو ما دفع غادة عادل مؤخراً إلى الإعتذار عن القيام ببطولة الجزء الثاني من مسلسل \"المصراوية\" بعدما رفضت الجهة المنتجة الرضوخ للطلبات المادية التي وضعتها غادة عادل مقابل إبداء الموافقة على استكمال باقي دورها في أحداث المسلسل."
archived = "2010-03-14"
