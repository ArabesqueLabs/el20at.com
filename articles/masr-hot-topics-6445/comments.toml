[[comments]]
order = 5
subject = "خايف اقول اللي في قلبي"
author = "بحب مصر جدا وقرفانة من اللي بي"
posted = "2007-07-06"
text = "بجد الموضوع لمس نقطة هامة في حياتنا جايز تكون ملازمنا في كل وقت بأشكال مختلفة انا مثلا عندى احساس فظيع بالخوف من كل شئ خوف من الناس اللى حواليا خوف من بكرة اللي مش عارفين ممكن يحصل فيه ايه الدنيا عمالة تتغير كل ثانية يعني مثلا مصر كانت من فترة قريبة بشكل يمكن يكون افضل من اللي احناعليه دلوقتي الدنيا بتتغير من حواليا المبادئ بتتغير الاخلاق بتتغير الناس مبقتش طيقة بعضها كله بياكل في كله كله بيضرب في كله اصبحت خايفة جدا من بكرة واللى ممكن يحصل فيه انا بتكلم من السياق ده لسبب اني بشتغل في شركة قطاع عام من فترة قصيرة وحاسة ان عنيا فتحت على الدنيا اللي خارج البيت والجامعة بدري ربنا يستر علينا من اللي جاي"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819202143/http://masr.20at.com:80/newArticle.php?sid=10806"

[[comments]]
order = 6
subject = "بخاف و الخوف بقى دنيا ..بنى ادميين عايشين حواليا"
author = "نيفين نيفى نوفا"
text = "اولا مش عارفه محمد السيد بتاعنا و لا حد تانى يعنى محمد السيد بتاع مش هسكت و لا تشابه ف الاسماء؟؟؟؟؟؟؟؟؟؟<br />عموما ف كل الاحوال الموضوع تحفه و يبشر بكاتب رائع<br />الخوف<br />موضوع يتكتب فيه مدونات و قامت على اكتافه روايات و افلام و اغانى و قصائد بس ف الفتره الاخيره عجبنى مقطع ف غنوه فيلم قص و لزق بتقول (لا عمره خلى القلب يفرح فرحه بجد ..و لا عمره خلى حد يطمن لحد)و هو ده الخوف ف ابسط و اعمق صوره ف نفس الوقت<br />و الخوف بيشملنا و بيغلف عالمنا ..انت بتخاف على نفسك و على حياتك و الدليل انك بتبص يمين و شمال قبل ما تعدى الطريق<br />و بتخاف على عيلتك و بتخاف على حبيبك و بتخاف على حبك ليه و حبه ليك<br />و بتخاف من الموت و زى ما قال عبد الله نحن اعداء ما نجهل و بنخاف من اى شىء منعرفوش<br />يعنى بنخاف من اللى بنعرفه و اللى منعرفوش<br />ناهيك عن الخوف المرضى اللى بيسمى الخواف او الفوبيا ان صح التعبير<br />الموضوع جميل يا محمد و اجمله اخر برجرافين اللى بتتكلم فيهم عن الخوف من ضياع البراءه و الطفوله جوانا<br />انا كنت فاكره انى الساذجه الوحيده اللى لسه خايفه على الناس من ذهاب براءتهم و طفولتهم اللى لو راحت مبترجعش<br />طلعنا اتنين ..ما هى دلوقتى بقت سذاجه صدقنى"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819202143/http://masr.20at.com:80/newArticle.php?sid=10806"

