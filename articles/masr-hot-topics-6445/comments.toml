text = "استاذة نيفين ....<br />تمام يا أفندم ............. محمد السيد بتاعنا .....<br />بتاع مش هاسكت ....<br />جميل جدا أن تجد هؤلاء الذين جمعهم شيء واحد رغم البعد .....<br />ليتذكروك وتتذكرهم ...<br />خالص تحياتي ودعواتي .....<br />وشكرا جزييييييييييييييلا علي هذا الإطراء ...<br />ويارب مش حاسكت فعلا<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \"لا جدوي لهذه الكلمة .. فالمشكلة أكبر وأعظم\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />مدونة مش حاسكت ...<br />http://mesh7askot.blogspot.com/"
