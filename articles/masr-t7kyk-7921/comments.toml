text = "اولا ليكى يا يمنى و لكل عشرينات محررين و معلقين كل سنه و انتم و مصر كلها طيبه و سنه سعيده علينا كلنا و مش عايزه اقول اسامى علشان منساش حد و لريما بقولها باللبنانى ينعاد عليكو<br />حكايه الشجره و تزيينها ده امر لابد منه كل سنه ف شغلى لانى بشتغل ف مكان بيقتضى ده فالقصه دى انا عايشه فيها و بالنسبه للزهور فهى بجد ضيف دائم طول السنه ف كل مناسباتى علشان كده الموضوع لامسنى اوى و موضوع جميل يل يمنى<br />و تانى سنه جديده سعيده يا عشرينات"
