subject = "5 مليون بس والا 50 مليون تحت خط الفقر"
author = "مش هو"
text = "بالاسعار الموجودة حاليا<br />مرتب الاسرة المفروض ان لايقل شهريا عن عشرين الف جنية علشان يعيش مستور<br />كم اسرة فى مصر دخلها عشرين الف جنية فى الشهر<br />يا راجل يا كداب<br />انا قابلت واحد خواجة عند الهرم وسألتة - اية اللى عجبك فى مصر<br />رد على بمنتهى الهدوء<br />الفقر صناعة مصرية عريقة<br />افقار الشعب مهنة الزعامة فى البلد ومهمتهم الاولى"
archived = "2008-05-15"
