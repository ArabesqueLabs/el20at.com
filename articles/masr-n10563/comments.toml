[[comments]]
order = 2
subject = "بلدنا عمار يا زمامير وفوانيس مكسورة وكسر اشارات......الخ"
author = "شرين منصور"
text = "السلام عليكم مصر علامة للزحام وكل المخالفات المرورية وده طبعا للأسف أنا لما جيت مصر لقيت سيارات معدومة ازاي بتمشي عربيات من غير المرايات اللي من الناحية اليمين ومن الناحية الشمال وأحيانا اشارات فوانسها مكسورة وكل التاكسيات أوكر الأبواب اما مكسورة او الحمد الله نصها موجود يدوب نفتح بيه الباب ولا يوم ما تحب تتهوى متلقيش اليد اللي تخليك تفتح الشباك اما العربيات الملاكي فدي حكاية تانية تيجي تلاقي وحدة بتسوق طبعا مفيش حاجة بس ياريت يا سيداتي الفضليات ويا آنساتي تلتزمن بالمقعد اليمين وليس مقعد السائق البلد مش ناقصة متستغربوش انا وحدة مكملتش دروس السواقة قولت اني التزم بالكرسي اليمين او الخلفي اكرملي من الشتايم اللي ممكن اتشتمها وغيرو وغيرو انا بصراحة نفسي يطلع قرار بمنع اي سيدة تقود سيارة كفاية تكتك عليها وده ان عرفت تسوقو من اساسو ،احيانا يا استاذة مي بتكون الزمامير منتحرة ايضا متقوليش ان بدفع عليها كهربا ولا ضريبة والله ومش بيزمرو بيسيبوا اللي مش واخد بالو ان في عربية جاية تخبطو وضع غريب انا بحمد ربنا ان تاكسي العاصمة توغل في القاهرة وهنا في اسكندرية على الأقل وجهة كويسة بدل الوجهة المنتحرة يلا كلو حيتظبط على 2300 ان شاء الله"
archived = "2007-06-17"
capture_url = "https://web.archive.org/web/20070617010042/http://masr.20at.com:80/newArticle.php?sid=10563"

[[comments]]
order = 3
subject = "نسيت تتكلمي علي الكارو"
author = "هبة الله السيد"
text = "موضوعك معبر عن ما نعانيه في شوارعنا من سلوكيات سئية اثناء القيادة بس في مشكلة اكبر وهي الكارو قابلتني شخصيا وفي شارع الهرم الرئيسي و انا ماشية شمال حيث السرعة عالية فاجد امامي كارو عكس الاتجاه<br />والحمد لله ربنا ستر . انا لااعتقد ان الزحام الشديد هو السبب في هذا السلوك السيء و لكن عدم وجود نظام والدليل علي كده ان الدول الغربية لا تخلو من الزحام وعلي الرغم من ذلك سلوك قائدي السيارات ليس بنفس السوء"
archived = "2007-06-17"
capture_url = "https://web.archive.org/web/20070617010042/http://masr.20at.com:80/newArticle.php?sid=10563"

[[comments]]
order = 4
subject = "خليكى حمشة"
author = "shima"
text = "معاكى ف كل كلمة و نفس المآسى التى لا يعلمها الا الله و يا سلام بقى لما تكون بنت هيه اللى سايقه تبقى البلاوى بالكوم و تلاقى ناس ربنا يسامحهم يستهيفوكى و ما يصدقوا يشوفوا واحده سايقه و يبتدوا اللى يكسر و اللى يدنوا يزمر و الطريق فاضى و وراكى وراكى<br />و يا سلام بقى ع الشباب اللى اهله غلط و سماهم اسامى ولاد و فاكرينهم رجاله كل واحد فرحان بعربية مامى و بابى و عايز يولع ف خلق الله<br />ع فكرة انا اتعلمت قلة الادب بجد من اول ما بدات اسوق<br />لازم تبقى حمشه و تطيحى ف اللى ادامك عشان مش يستهيفوكى"
archived = "2007-06-18"
capture_url = "https://web.archive.org/web/20070618070019/http://masr.20at.com:80/newArticle.php?sid=10563"

[[comments]]
order = 5
subject = "كان ذمان"
author = "جمال محمود معتوق"
text = "كان ذمان ألشعب ألمصرى شهم وجدع وابن بلد وكن أيضا لا يتأخر عن أى مساعدة وكن شعب فعلا كريم ولكن ياأستاذى ألفاضل ألنفوس تغيرت ولا أحب أن تتكلم عن ألقيادة فقط لأن معظم ألشعب لايسوق ألشعب ألمصرى يأستاذى ألفاضل لايفكر حتى فى نفسه شعب بارد وطيب شعب جبان وقوى ملوش دعوة بحاجة أبدا شعب يأكل فقط وياريت لاقى يأكل شعب مثقف وغبى شعب عبيد وهو فى ألحقيقة سيد هذا ألشعب يجب أن يكون سيد لا عبد هذا ألشعب يجب أن يرجع يكون شهم وجدع وأولاد بلد يجب أن يكون مثقف عارف حقوقه وواجباته نحو ألوطن ووجباته نحو بعضنا ألبعض وألاأن يعيشو فى وطن أخر يضحكو ويلعبو ويقولو نكت فهم أذكياء جدا جدا فى هذا ألمجال فى شعوب أخرى لايعرفون ألضحك ويحقدو على خفة دم هذا ألشعب ألذكى ألذى لايملك الا خفة ألدم وياريت كان فيها فايدة أما أنا فدمى ثقيل وثقيل جدا جدا"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819182205/http://masr.20at.com:80/newArticle.php?sid=10563"
