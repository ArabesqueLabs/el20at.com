order = 0
subject = "خواطر واقعيه 100%"
author = "محمد"
text = "هذه الظواهر موجوده بالفعل تماما كما ذكرت هنا و أصبحت هى المسيطره على الشوارع فى القاهره و الجيزه و المدن الكبرى على الأخص و لكنها تقل كثيراً فى معظم المدن المصريه و هى ناتجه عن الزياده الرهيبه فى وسائل النقل مع عدم قابلية الطرق لإستيعاب هذا الكم المستمر فى النمو حتى الآن و على المتضرر اللجوء إلى المدن الجديده ."
