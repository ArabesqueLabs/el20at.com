[[comments]]
order = 3
subject = "الدكتور عصام العريان، رئيس اللجنة السياسية بجماعة"
author = "مش كاتب"
posted = "2008-04-06"
text = "انا عايز اعرف حاجه مهمة واحد طبيب بشري ايش علاقته بالسياسة<br />السياسة دي ليها كليات متخصصة في الجامعات اسمها كليات العلولم السياسية<br />عيب كده لما واحد طبيب بشري يبقى رئيس لجنة سياسية<br />في مهن في المجتمع زي مقلب الزبالة بالضبط اي حد يرمي فيها زي الصحافة والسياسة والدين وخلافه مهن مالهاش رابط<br />الصحافة اي واحد يشتغل صحفي والسياسية اهو واحد طبيب بشري بيشتغل سياسة والدين اهو عمر خالد محاسب وبيشتغل دين والبابا شنوده ضابط وبيشتغل دين<br />انا عايز اعمل اضراب على الناس دية الناس اللي بتنظ على تخصصات غيرها<br />ونسال الدكتور العريان اللي بيشتغل في السياسة ممكن واحد خريج سياسة مثلا زي فاروق الباز ممكن يفتح عيادة دكتور"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406214742/http://masr.20at.com:80/newArticle.php?sid=15032"

[[comments]]
order = 4
subject = "الى الدكتور عصام العريان"
author = "مش كاتب"
posted = "2008-04-06"
text = "بالله يا دكتور سيبك من السياسة والكلام الفارغ اللي انت عايش فيه دا وروح نقابة الاطباء ادعيهم للاسلام وقولهم ان الاسلم هو دين الرحمة والدكتور اسمه ملاك الرحمة لانه بيعالج المرضى<br />لان دلوقتي يا دكتور الطبيب في مصر اصبح مستثمر عايز يكسب فلوس وخلاص بيفتح عيادة علشان خاطر يحلب المرضى<br />حاول يا دكتور تساعد الشعب في هذا القطاع الذي هو من صميم تخصصك<br />انا فاكر زمان ايام ما كنا بنصلي عند الشيخ كشك كان يقولنا بعد الصلاة ان الدكتور الفلاني عمل يوم في الاسبوع في العيادة بتاعته مجانا للفقراء والمستشفى الفلانية فتحت فرع للفرقاء<br />كان الشيخ كشك بيحنن قلوب الاطباء على الشعب<br />فيا دكتورنا العزيز سيبك من السياسة والكلام الفارغ والهبل والعبط واخدم شعبك في تخصصك لحسن انت عارف الان اللي معاه فلوس بيتعالج واللي معهوش فلوس بيموت يا دكتور<br />يا دكتور دلوقتي لما تنقل واحد للمستشفى فيه حاجه اسمها تأمين اقل تأمين في اي مستشفى قبل ما المريض يدخل 1000 جنيه واللي ما عندوش تأمين يموت على باب المستشفى<br />فروح يا دكتور ادعي قومك (الاطباء) وقولهم ان الاسلام دين الرحمة والطبيب اسمه ملاك الرحمة افضل من السياسة والهجص<br />سلام يا دكتور"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406214742/http://masr.20at.com:80/newArticle.php?sid=15032"

[[comments]]
order = 5
subject = "المنهج الاجتماعي والمعارضة الحزبية تما"
author = "اسامه صلاح"
posted = "2008-04-11"
text = "السياسيون والمثقفون الحزبيون والحكوميين يهجمون شعار الاسلام هو الحل بدعوة لا دين في السياسة<br />هل يعلمون ما هو مفهوم الشعار (بصفة عامة) لا ,هل يعلمون ما هو مفهوم المنهج الاجتماعي (بصفة عامة) لا , هل يعلمون مما تشتق او تنبثق او تستخلص السياسات في اي مجتمع وما هي حدودها ( بصفة عامة) لا .<br />انهم نواب واحزاب هدفهم الوحيد اسقاط الحكومات طمع في ان يحلوا محلهم لهذا يتبعون وسيلة الاعتراض واقصاء الاخر وصم الاذان وايضا الرائ الوحدوي لرئيس الحزب ( فهي سياسات حزبية وحدوية في شكل تراثي ) وفي حقيقي الامر فهم لا يفقهون في دنيا او دين ( لمن ينادي بمثل تلك النداءات الجاهلة لتحقيق اهدافه الشخصية) وهم بعيدين كل البعد عن مفهوم المنهج الفردي والمنهج الاجتماعي المحرك للسلوك والمنظم للتفاعل الاجتماعي<br />وليس معني المنهج الاسلامي مثلا هو اضطهاد المعارضين له من اصحاب الاراء الاخري مسيحية او غيرها او احداث اي ضرر بهم لانه في تلك الحالة فصل جزء من المجتمع وتحول من منهج اجتماعي الي منهج تعصبي او عرقي لفئة وليس لمجتمع<br />وانما المنهج الاجتماعي ( اي منهج) هو القواعد المنظمة للتفاعل والاحتكاك داخل المجتمع والتي تحافظ علي حقوق كل عضو بالجماعة بصرف النظر عن اللون اوالدين او الملكية او حتي المجهود والانتاج الفردي بشكل عادل ومتساوي في كل الحقوق والواجبات وكذا توفير الحماية الداخلية ضد الاخر والتوحد في مواجهة اي عداء خارجي ومن ثم يكون المنهج هو منبع المواطنة وفي اي منهج اجتماعي ناجح يكون من مصلحة الاغلبية المحددة لنوع المنهج ان تستقطب المعارضين لهم وتوفرلهم كل سبل الشعور بالمواطنة والانتماء وقل الاسباب لذلك هو السبب الاقتصادي والنفعي حيث ان الجانب الاخر المعارض للمنهج هو قوة بشرية ومورد بشري واقتصادي لا يمكن التفريط فيه او اهمالة بل يجب استرضائه بشتي الطرق<br />المهم لنتعرف لمن لا يعرف علي مفهوم المنهج الاجتماعي في اي مجتمع ولعل<br />المعارضة والنقد الجاهل والمحبط للاخر والمحفز علي الفتن داخل الوطن الواحد لعله يخجل من نفسه<br />السلام عليكم ورحمة الله وبركاته<br />الاستاذ محمد علوان ارجو ان يتسع صدرك بشي من الديمقراطية وحرية الحوار والاستماع للرائ العلمي كعادة الوفديين<br />اولا السياسة هي المبادئ والوسائل والادوات التي يستخدمها اي مجتمع لادارة شؤنة الداخلية والخارجية وفق لمعتقدات راسخة ترتبط بطبيعته وتراثه .<br />ثانيا اي مجتمع لا بد له من اتباع منهج اداري او منهج اجتماعي واحد ومحدد وثابت يعبر ويمثل ويحقق متطلبات هذا المجتمع للحياة الانسانية الكريمة ويعبر عن شخصيته ومعتقداته واهدافه حتي لا ينفصل الهدف الاجتماعي العام عن الهدف الفردي للاشخاص وحتي يكون سعي اي فرد في حدود ذاتيته هو في نفس الوقت سعي لتحقيق اهداف اجتماعية .<br />ثالثا من هذا المنهج الاجتماعي والمحدد لاهداف المجتمع ككل ينبثق بلغة الساسة سياسات مختلفة في شتي المجالات (خارجية - داخلية- اقتصادية-اجتماعية) تعمل وفق لهذا المنهج<br />رابعا والمهم في الادارة الاجتماعية والمنهج الاجتماعي هو ثبات المنهج ووضوحه وايمان واعتقاد اغلب مكونات المجتمع واعضائه(الافراد) بقدرة هذا المنهج علي تلبية متطلباتهم (الدنياوية ان كانوا لا يؤمنون بالاخرة او دنياوية واخراوية معا ان كانوا ممن يؤمنون بالحياة الاخرة),ومن ثم هذا المنهج المعبر عن والممثل للشخصية الاجتماعية والثقافة والهوية الاجتماعية يجب ان تلتزم به جميع السياسات والاستراتيجيات والادارات الموجهه للسلوك الاجتماعي لقيادته في طريق وغاية وهدف واضح<br />ومن ثم ايضا تعتمد اغلب المجتمعات لرفع شعارات تعبر عن هذا المنهج واختصاره في كلمات او رسومات<br />واخيرا قد يكون هذا المنهج ( اسلامي - مسيحي - يهودي - وضعي - شيوعي - اشتراكي - راسمالي - ديمقراطي - حر - فوضوي ...الخ) كل هذه المناهج يمكن لاي مجتمع ان يتبني اي منها اذا وافق عليها الاغلبية وكانت اكثر تعبير عن ثقافة ومتطلبات افراد المجتمع ( ولكن بشرط وهو صدق التطبيق وصحة السياسات المنبثقة وعدم التحويل من منهج الي منهج او خلط جميع المناهج في لا منهج)<br />فاذا اتبع اي مجتمع المنهج المسيحي ورفع شعار الصليب هو الحل لا شك ان هذا الشعار وهذا المنهج ان طبق كان حل حقيقي لكل المشاكل الدنياوية اما الاخرة فبيد الله والجكم يومئذ لله عز وجل , وحتي ان كان المنهج يهودي فلا شك في نجاحة وهذه كمناهج سموية تجمع بين الدنيا والاخرة اما بالنسبة للمناهج الوضعية والخاصة بالنجاح الدنيوي وفقط في ايضا قد يكون صحيحة ان احسن تخطيطها واعدادها وثباتها وتعبيرها عن متطلبات المجتمع .<br />وتظل المشكلة اي منهج هو المناسب والمعبر عن اغلب المصريين ويكون هو الحل ونرفع شعاره ليتعلم الجيل الجديد منهجه.<br />وايضا هل يعلم المسؤؤلين مفهوم المنهج في ادارة المجتمعات ام هم يعلنون فشل المنهج والشعار في الحل ارضاء لقوة اخري تريد فرض منهج بعينه ام هم يعتمدون كوكتيل مناهج تحقق مصالحهم وفقط دون ان تعبر عن الشعب<br />ملحوظة اخيرة جميع المناهج السماوية تتضمن بداخلها المناهج الاخري (ديمقراطية- اشتراكية - راسمالية - حرة ) الا انها لا تتضمن المنهج الاجتماعي الفوضوي<br />فنعم الاسلام هو الحل والصليب هو الحل ونجمة داوود هي الحل بشرط موافقة اغلبية الشعب واعتقادهم وانتماؤهم الفردي لهذا الشعار .<br />وبالطبع المنهج الاسلامي احدث تلك المناهج ويحتوي علي احدث واحق طرق الضبط الاجتماعي بقدرة الله تعالي ولذا فهو احق تلك المناهج بالاتباع"
archived = "2010-03-14"
