[[comments]]
order = 1
subject = "فعلا كويس جدا"
author = "نيفين نيفى نوفا"
posted = "2007-10-19"
text = "الفيلم بالفعل كويس اوى يا راندا<br />التصوير و الاضاءه عجبونى جدا و ان كان البطل مش اد كده<br />بس فكرنى بنفسى و رجعنى لايام الرسم و شوقنى للبلته و الالوان و الحامل اللى كنت رايحه جايه بيهم ف كل حته لولا الشغل و الدراسه اللى اخدونا من هواياتنا الحلوه"
archived = "2007-12-16"
capture_url = "https://web.archive.org/web/20071216010937/http://masr.20at.com:80/newArticle.php?sid=11486"

