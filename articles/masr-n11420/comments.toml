[[comments]]
order = 0
subject = "ليس قتيلا وانما شهيدا"
author = "واحد"
text = "هل هذا تصرف ضابط متحضر اوتى قدرا ضئيلا من التعليم ؟<br />ضرب الرجل بخشبة كانما يضرب كلبا وجمعية رعاية حقوق الكلاب تمنع ذلك<br />الى ماذا يستند والى اى سلطات<br />انهم يلجئون الشعب الى الخطوة القادمة وهى سوف تاتى لو تمادوا وهى الكفاح المسلح لحماية الارواح ويا روح ما بعدك روح<br />هل هى تصرفات مع بعد تعديل الدستور ؟<br />اخشى من يبرر بان الضابط كان فى حالة دفاع عن النفس وسوف يجدون عذرا ما<br />انتظروا الايام السوداء القادمة"
archived = "2007-09-01"
capture_url = "https://web.archive.org/web/20070901200349/http://masr.20at.com:80/newArticle.php?sid=11420"
