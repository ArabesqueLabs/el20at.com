[[comments]]
order = 14
subject = "كلام موزون بس محتاج تصحيح"
author = "محمد الحسينى"
posted = "2007-12-04"
text = "اعتقد اننى اوافق على كلام ساويرس من الناحية المبدئية ولكن هناك بعض التصحيح<br />1- انه قال ان الحجاب حرية شخصية وهو لا يعلم انه من مبادىء الاسلام<br />2- سواء كان الحجاب بالشكل المصرى او السعودى او الايرانى فانه حجاب مفيش فرق اهم حاجه يكون فيه شروط الحجاب<br />3- موضوع انه هايعمل قنوات عشان تعادل المد الدينى قنوات ساويرس مش زى قنوات المسلمين مثلا قنوات ميلودى ومزيكا وقنوات الاغانى الخليجية بل اللى بيعرض على القنوات دى اوسخ مليون مرة من اللى بيعرض على قنوات ساويرس بس عشان هو مسيحى دا بيدى الموضوع حساسية شويه.<br />4- موضوع المفتى بتاعنا لا يحتاج الى تعليق لانه وبلا شك اصبح مفتى الحكومة ومفتى الخزعبلات راجع فتواه عن قش الارز وعن التبرك ببول الرسول وعن الاولياء .<br />5- الاخوان ليهم برنامج طبعاً مش كل الناس هاتوافق عليه والا مايبقاش فيه فرق بينهم وبين اى حد تانى لكن المشكلة فى الانتقادات المنزايدة عن حدها يعنى الحكومة بتعمل اللى هى عايزاه ودا طبعاً ببرنامج لجنة السياسات ومحدش معترض من بيع بنك القاهرة والقمح المسرطن ومحاكمة الصحفيين واضطهاد القضاة وخلافه وعلى قلبهم زى العسل لكن طبعا الاخوان كخة وحشين لكن ارجع واقول ان ساويرس قال كلمة جميلة جداً اللى هايحكم بالعدل يا اهلاً بيه هو ده المحك وده الفيصل لان العدل مش هايفرق ما بين مسلم ونصرانى<br />شكراً"
archived = "2007-12-10"
capture_url = "https://web.archive.org/web/20071210235650/http://masr.20at.com:80/newArticle.php?sid=12349"

[[comments]]
order = 15
subject = "برضه أحلى تعليق هو أبوأسامة"
author = "أحلى تعليق -أبواسامة"
posted = "2007-12-08"
text = "رغم أن تعليقه إرتجالي يتسم بالبساطة والتلقائية إلا أنه عميق المغزى وفلسفي ومنطقي ومنطلق من وعي فكري وثقافي وديني سليم رغم بساطته وتلقائيته .. ثم في النهاية لا تملك ثم الابتسامة عند قراءته إلى حد الضحك الساخر..<br />أبوأسامة واد مصري شوارعي نضيف وصايع محترم وهارش الليلة وفاهم وبيعرف يرد صح وببساطة وجمال ووعي ..<br />كنت ناوي أعلق ..لكن لما قريت تعليقه انبسطت وضحكت وحسيت إن ساويرس بجلالة قدره اتفرم بين حروف أبو اسامة ..وكذا المفتي وشرحه الإخوان .. علشان كده مفيش أحلى من تعليق أبو أسامة.."
archived = "2007-12-10"
