author = "حازم كمال"
posted = "2007-12-11"
text = "سكان مصر يتمتعون بأغلبية مسلمة ساحقة....ومن الطبيعي ان يكون الحاكم من الأغلبية...لأن الحاكم منتخب ....ولا يتخيل ان لا يوجد في الاغلبية ولو واحد عادل....ولا اظن ان مسلما ينتخب مسيحيا..والعكس صحيح الا من باب التمويه السياسي والخداع في لعبة تبادل الادوار والمصالح...فالمسألة ليست انتخابية 100% بقدر ما هي توازنات دولية تملى علينا ...انما ودون تحيز رأي الأخوان صحيح..وهذا لا ينفي ابدا فكرة المواطنة التي يقولها سويرس وكأنه يتقي بها عصبية متسترة وراء الليبرة والعولمة...وهل تعارض الاسلام في ايدولوجيته مع الآخر....لا والله والعكس هو الصحيح بأعتبار ان الاسلام اعطى حرية المواطنة الكاملة لكل من ينتمي الى دولته بغض النظر عن معتقده..بل حمى الآخر وكفل له حقوق متساوية مع الأكثرية المخالفة له في العقيدة....ومن ظن غير ذلك فهو على جهله...وينبغي في هذا المقام ان نفرق بين الاسلام كنظام للحكم له مبادئه واصوله...وبين الاسلام الذي نطبقه الآن ...والبون شاسع .. ومن هنا وقع الخلط واللبس بين النظرية والتطبيق...واستغل المناوؤن بعمد او غير عمد هذا الخلط وروجوا لفكرة المواطنة بقصد ابعادها عن الاسلام كنظام للحكم..والاسلام هو اساسا يعتبر المواطنة احد ركائز حكمه..ومن هنا يظهر خطورة تفكير سويرس ومن على دربه..فنحن من اجداد اقباط اصلا ولكن دخلنا الاسلام من باب العقل لا السيف والكل يعرف اننا خرجنا من اضطهاد المسيحيون ابناء الديانة الواحدة الى سماحة الاسلام وعدله...ودخلنا من باب المواطنة...لمن كان له عقل عليه ان يفكر قبل الاندفاع في القول والتعميم المبني على تسطيح الامور دون وعي معرفي تاريخي يظهر الامور على حقيقتها<br />ولفضيلة المفتي رأيه الذي لا يخلو من فوائد ودروس وعبر وقد يخطئ وقد يصيب فهو اجتهاد بشري غير ملزم وهناك من ايده وهناك من عارضه..والقضية لا نريد منها تشهيرا بل تصحيحا او نقدا بناءا فالمتوفي غرقا شهيدا بنص الاحاديث...اما الدوافع فليس لاحد ان يحددها فهي ماتت مع صاحبها....وخروج الشباب للعمل وبيعهم لما يملكون من اثاث وتجميعهم ل20000او25000جنيه بشق الانفس للسفر ليس طمعا ابدا بل املا في حياة مستقرة...وهناك فرق كبير لمن يتكلم وهو يملك قوت عمره ومن لا يملك رغيف خبز لولده....فلمن كان له عقل..خطاب الرغيف غير خطاب الهوامير"
