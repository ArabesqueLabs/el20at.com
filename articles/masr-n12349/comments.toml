subject = "ربنا يخدهم الثلاثة"
author = "ابو اسامة"
text = "ربنا يخدهم......اولا ياعم يا بتاع الاخوان اما تبقى انت نفسك توصل للحكم ودى تبقى مصيبة ابقى اتكلم عى كيفك انت يعنى شايف الحرية بتخر من عمك حسنى والدور هيجى على مسيحى ولا مسلم ثانيا الاخ سويرس نفس الغباء بتاع الاخوان يا عم انت فى بلد معظمه يدين بالاسلام ومحدش طلب راءيك فى الحجاب مش بقولكم نفس الغباء الاخوانى بيقول راءيه فى حاجة محدش ساءله فيها. اما الاخ بياع الفتاوى فهو نفس الهبل لا معاه مفتاح الجنة ولا النار ولا حد ساءله وعمال يوزع فتاويه اللى محدش بيصدقها لانه متعين ... .ربنا يريحنا منكم"
