subject = "ليس بعد الصعود على قمم الجبال الي  الهبوط الي الها"
author = "عاطف احمد"
posted = "2008-02-21"
text = "هذا ردي على مفتى الديار ـ الشيخ على جمعة ـ اولا وقبل كل شئ أن احبه في الله ولكنني فوجئت بما قال عن الشباب الذي مات على سواحل إيطاليا متى سمعنا هذا اليس في هذا العهد فقد الذي تم خصصة كل الشركات والهيئات الحكومية في حين تم فتح مجالات أخرى اجهزة محلية وشورى أماكن يبرتع فيها الخيول علشان الحرامية تأكل وتسمن على حساب الشعب الغلبان اما الي بيسافر يدور على مستقبله فهو طماع ـ أعرف انسان قريب مني من أربعة سنوات ضحك عليه ناس علشان يسفروا ابنه يشتغل وطلبوا 12000 جنيه من اربع سنوات ولم يكن يملك غير ذهب زوجته وقطعة ارض صغيرة باعهم واستلف عليهم علشان يسفر ابنه يشتغل وأضحك عليه في النهاية ورجع ابنه . مين مستغنى عن أبنه علشان يغربه ويسفره إلا الحاجة الله يحوج كل انسان في مصر كان السبب في اللي احنا فيه انا أب وحاسس بالأباء وما كان يبغي للمفتي ان يقول ذلك على هؤلاء الشباب كفاية صدمة أبائهم فيهم كان لازم يقول كلمة أفضل من كده تبرد نار الصدمة على فلذات أكبادهم ـ وبعدين يافضيلة المفتي مشروع ايه في مصر أي شئ تفتحه او تشتغله تلاقي مائة حرامي امامك ـ تموين ـ صحة ـ اشغالات طريق ـ شرطة ـ دفاع مدني ـ وكله مش عايز منك غير انه تأكله فقط وتعطيه شهرية في جيبه الله يجعلهم في نار جهنم من اكل السحت . أرجو من فضيلة المفتى ان يطلب من حسني مبارك أن يوجد أماكن لهؤلاء الشباب وتشرف عليهم وزارة العمل او وزارة الشباب كما اوجد فرصة لابنيه جمال وعلاء مبارك والا هما ماشاء الله اخدوا مؤهلات أعلى من الناس ـ أتقوا الله في الشباب وفي المصريين عموماً .<br />وهذا ردي على الهالك ساويرس ـ هو اسمه ساويرس والا سوارس<br />\" قال الله تعالي \" اليوم اكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الإسلام دينا\"( سورة المائدة3)<br />\"ومن يبتغي غير الإسلام دينا فلن يقبل منه وهو في الأخرة من الخاسرين \"(آل عمران 85)<br />وقال رسول الله صلى الله عليه وسلم \" ما من عبد يسمع بي ولا يمؤمن بما أرسل عليَ فقد كفر \"<br />ياسويرس ماشأنك وشأن المحجبات قد كده هما تعبينك ومضايقينك في عيشتك يارجل أتق الله وخاف على أخرتك ولكن حنقول ايه ليس بعد الكفر ذنب ـ أأنت مصري ابدا والله كل انسان يحاول إفساد هذا البلد الطيب فهو ليس منه حتى ولو ولد فيه ومن اب وجد مصري ولكنه خائن لمصر وللمصريين ـ من قبل خرج علينا المسيحي مفيد فوزي وقام بمهاجمة عمرو خالد واليوم يخرج علينا ساويرس ويهاجم المحجبات ـ خليكم في مصيبتكم واتركوا غيركم . مرة يسب الدين وهو في التليفزيون على الهواء ومرة يبث قناة تزيع الأفلام الماجنة ومرة يهاجم المحجبات .راجع نفسك قبل فوات الأوان ."
