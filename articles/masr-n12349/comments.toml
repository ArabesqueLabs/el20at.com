[[comments]]
order = 8
subject = "ربنا يخدهم التلاتة"
author = "ابو اسامة"
text = "vربنا يخدهم التلاتة اجهل من بعض .اولا ياعم يا بتاع الاخوان اما تبقى انت نفسك توصل للحكم ودى تبقى مصيبة<br />ابقى اتكلم عى كيفك انت يعنى شايف الحرية بتخر من عمك حسنى والدور هيجى على مسيحى ولا مسلم<br />ثانيا الاخ سويرس نفس الغباء بتاع الاخوان يا عم انت فى بلد معظمه يدين بالاسلام ومحدش طلب راءيك فى الحجاب<br />مش بقولكم نفس الغباء الاخوانى بيقول راءيه فى حاجة محدش ساءله فيها.<br />اما الاخ بياع الفتاوى فهو نفس الهبل لا معاه مفتاح الجنة ولا النار ولا حد ساءله وعمال يوزع فتاويه اللى محدش بيصدقها<br />لانه متعين من قبل الاخ حسنى الغبى .ربنا يريحنا منكم"
archived = "2007-12-10"
capture_url = "https://web.archive.org/web/20071210235650/http://masr.20at.com:80/newArticle.php?sid=12349"

