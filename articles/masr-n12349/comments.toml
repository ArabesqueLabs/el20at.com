[[comments]]
order = 3
subject = "مفتى لمين ؟ ولية"
author = "مش مهم خالص"
text = "فى ثلاث ايام طلعت من المدعو مفتى فتاوى تريح الحكومة خالص وتحط فى بطنها بطيخة صيفى وغفر اللة ذنبكم<br />اول فتوى كدة اسمها فتوى لمولانا ويظهر انة اصبح عراف الحزب الوطنى --- ان اللى ماتوا غرقى فى البحر دول ماتوا فطيس وانهم زى اللى وقف قدام القطار وهرسة يبقى ذنبة على جنبة وجنب ابوة واية اللى وداهم هناك<br />ياعم الشيخ انت موظف وبتلهط بدلات ومكافات وسفريات ودول شباب عاطل عن العمل يسرقوا والا ينهبوا والا نقطع ايديهم من خلاف<br />ثانى فتوى لجنابة ان فية واحدة ست عسكرى امن مركزى دهسها باللورى فالفتوى طلعت انها تستاهل هى وقفت قدام العربية لية وان العسكرى ليس لة اى ذنب<br />سؤال للمفتى<br />فية حد قال رايك اية يا مولانا ؟<br />والا انت من نفسك بتخبط فتاوى كدة وخلاص<br />يا مولانا فتاويك خاصة بك بس - عايز تمشى عليها انت حر - انما عيل صغير هيقول لفتاويك خمسين طز<br />معندناش فى الاسلام كنهوت ولا مشايخ وانما عندنا اولى العلم وللاسف لست منهم<br />يا فض1يلة الشيخ انت موظف فى الازهر نعم ولكنك لست صالح للافتاء ومطلوب تطنيشك<br />زمن اغبر"
archived = "2007-12-10"
capture_url = "https://web.archive.org/web/20071210235650/http://masr.20at.com:80/newArticle.php?sid=12349"

[[comments]]
order = 4
subject = "كم نحن في امس الحاجة للعدل والحرية والامانة فهي مفتاح الخلاص"
author = "أحمد السيد"
text = "الاخوان وبتأمل الفكر والخطاب التي تربي الشباب عليه بإختصار تدعو الى دولة طائفية دينية ظالمة، تريد ان تصادر الدين لفهم واحد احادي وتؤممه وتفرض الوصاية بجبروت الدولة على الدين وعلى معتقد المسلمين . الذي نحتاجه دولة عادلة تحق الحق وتعطي حق الضعيف وتحميه في مواجهة امكانية تغوّل القوي عليه. نحتاج الى ان يعود الدين الى حقيقته دعوة واقتناع وايمان وهداية في ظل حرية الاعتقاد وحرية الوعي بالاعتقاد مع احترام حقوق الاخرين ودون اعتداء عليها حتى ولو بإسم الدين.<br />ساويرس يقول : \" عدم إعجابه بازدياد المد الديني غير المعتدل في مصر على المستويين الإسلامي والمسيحي \" كم من المفكرين بل والعلماء المسلمين قال مثل ذلك ، وانا اعتقد ان اغلب العقلاء المفكرين في مصر يشهد بذلك ، والاحداث التي نراها في قرية بمها او في الاسكندرية او الصعيد او على مستوى مصر كلها تشهد بذلك . وهذا الرأي احقاقا للامانة التي تعلمت انها سنام الدين ومن اهم قيمه. ان هذا الكلام لساويرس لا يعني بالضرورة انه عداء للتدين . وما يحمله من معنى انه ضد التدين غير المعتدل اي المتطرف الذي يعتدي على حقوق الاخرين وحرياتهم .<br />كلامه عن الحجاب \" مؤكدا أنه ليس ضد الحجاب باعتباره حرية شخصية، واعتبر النقاش حوله غير مجد، لكنه تساءل: «هل كانت أمهاتنا كفرة أم لا؟ لأن الحجاب لم يكن ينتشر في ذلك الوقت\"<br />وماذا في هذا الكلام ، يعلن انه ليس ضد الحجاب كحق وحرية شخصية للمرأة ، ويشير الى انه ضد المتجاوزين المعتدين على حريات الاخرين مطالبين بفرضه ، او متهمين غير المرتدين للحجاب بأرذل الاتهامات في اخلاقهم او دينهم ، وللحق هذا نلقاه في اماكن كثيرة من بلدنا ، فكل يريد ان يدفع امرأة للحجاب يتهم او يهمز ويلمز بغير المرتدين له في اخلاقهم ودينهم ، وهذا ظلم وتجاوز في حق الاخرين.<br />اذكر بكلمات للاديب الكبير علاء الاسواني عندما وصف حالنا في مصر بأن مصر تعاني من حالة اكتئاب اجتماعي يرتدي عباءة دينية ، واتذكر انني قرأت تلك المقولة له في مقالة للدكتور الفقيه الدستوري الكبير يحيى الجمل كان يوافقه فيها الرأي ويدعوا الى حملة للتنوير لمواجهة انتشار التطرف والارهاب الفكري والحسي بإسم الدين.<br />تلك كان ملاحظتي على تصريحات ساويرس ، واود ان اشير ان الاخلاق الحقيقية الصادقة الاصيلة نعرفها فقط عندما تظهر مع من نختلف معهم (اعتقادا او عرقا او رأيا او ...) .<br />بالنسبة لتصريحات الدكتور علي جمعة ، اتمنى لو هناك امكانية لتوثيق برائتي من وصاية اي شيخ او جماعة او دولة علبى اعتقادي ووعيي بما اعتقد به ، لأنه اخصص واهم حق لي كإنسان .. أن اكون حر فيما اعتقد وفي وعيي بما اعتقد دونما ان اعتدي على حقوق الاخرين واحترمهم ."
archived = "2007-12-10"
capture_url = "https://web.archive.org/web/20071210235650/http://masr.20at.com:80/newArticle.php?sid=12349"

[[comments]]
order = 5
subject = "قاطعوامنتجات ساويرس بكل الدول الاسلامية الدعوة عامة للمسلمين فى جميع انحاء العالم"
author = "زمزم"
text = "فية كذاشركة اتصالات احسن وارخص من بتاعة البتاع يعنى البديل موجود والخمرة والبيرة ال اى دى والفودكا دول ديننا بيحرمها وبتتعب الصحة بالمرض اللى نهايتة الموت واى حد عندة اسهم فى اى شركة من شركات البتاع يبيع لو بخسارة لانة الراجل دة تجاوز الحدود بكلامة عن المعتقدات الاسلامية ولازم يعرف ان الفلوس اللى لمها كلها فلوس مسلمين دة غير فلوس ياسر عرفات ومنظمة التحرير الفلسطينية اللى ابتدا يشتغل بيهم ويجيب سنترلاات مستعملة من شركة اتصا لات دبى ويبدا شغل الموبايل بفلوس الفلسطينين اما قبل كدة معروفة تجارة اهلة وتاريخة"
archived = "2007-12-10"
capture_url = "https://web.archive.org/web/20071210235650/http://masr.20at.com:80/newArticle.php?sid=12349"

