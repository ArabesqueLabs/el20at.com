subject = "انت مسيحي وماله ولكن انتا فين"
author = "احمد الراشد"
posted = "2007-11-24"
text = "بالنسبة للاخوان فهم ماقلوش كده بمزاجهم ولكن ده رأي الشرع وجمهور الفقهاء مش الاراء الشاذة التي ليس لها من الادلة ما يقويها.... يعني مش بمزاجهم.... والناس دول من حقهم يقولو ده في برنامجهم احسن ما يفضل الموضوع مبهم وكل شوية الاعلام يسأل عنه<br />بالنسبة لساويرس انتا مسيحي وماله.. ليه بتهاجم الاسلام طيب احترم انسانية الناس الي بتقول انك بتشمأز اما تشفهم احترم ان فيه ملاين المسلمين بتشمأز من تصريحاتك الخارجة وبعدين نيجي للاباحية انتا عملت قناة جميل بتدعو للاباحية كمان في بلاد شرقية فضلا عن انها اسلامية طيب خلي عندك دم شوية ... انتا تستاهل المقاطعة<br />بالنسبة للمفتي دي فتوى سياسية عشان حد قالو قول كده ....وشكرا"
