subject = "كنيسة الشهيد العظيم مارى جرجس بدسوق"
author = "سامى وليم زكى"
posted = "2008-05-20"
text = "عندما خطا المسيح أولى خطواته على طريق رحلته التبشيرية الشاقة، كان همه الأول أن يختار التلاميذ الذين سوف يعلمهم ليوكل إليهم فيما بعدُ مهمةَ متابعة الرسالة.<br />لم يكن اختيار التلاميذ أمراً سهلاً أمام المسيح إذ كان عليه أن يرضيَ عدداً كبيراً من الناس الذين تربطه بهم علاقات خاصة أو مصالح معيّنة، ماديةً كانت أم شخصية!..<br />كان لأمه أقرباء وكذلك كان ليوسف ـ خطيب أمه ـ أقرباء وأصدقاء، وكان على السيد المسيح أن يرضي أمه وخطيب أمه وكل معارفه. ومن هذا المنطلق ، كان المسيح حذراً كل الحذر في اختيار هؤلاء التلاميذ!!<br />إني لعلى ثقة بأنَّ قارئي لا يصدّق حرفاً واحدا مما أتيت على ذكره، لا بل، لا أشك أبداً في أن قارئي قد بدأ يغضب وهو يقرأ ما يقرأ، وأنا لا ألومه على عدم تصديقه أو على غضبه. إني على العكس من ذلك تماماً، أشاركه عدم تصديقه لما ذكرت، كما أشاركه غضبه واشمئزازه. ولكن، إذا كنت أنا نفسي لا أصدق ما قلت وأشعر بالغضب لما قلت، فلماذا تراني قد قلت ما قلت؟!!<br />أعترف بأنني لم أقل الذي قلته إلا ساخراً من واقعِ حالٍ نعيشه ولا مفر لنا من الاعتراف به. وأنا إذ أعتذر لسخريتي، لا بد لي من الإشارة إلى أنها سخرية متألمٍ لا سخرية متهكّم.<br />المسيح لم يكن بحاجة لإرضاء أحد، وحين اختار تلاميذه أولئك فإنه قد اختار كلا منهم لغاية تخدم رسالته. كان يعرف مستقبل كل واحد منهم وأهمية دوره في رسالته التي أتى هو من أجلها. كان لمتى دورٌ، وليوحنا دورٌ، ولبطرسَ دورٌ، وحتى ليهوذا الاسخريوطي دور. ومهما اختلفت أدوار كل منهم، فإن الغاية من اختيارهم كانت إتمام القصد من مجيء المسيح ومتابعة الرسالة. والأهم من ذلك، فقد حذّرهم بأنه لن يتغاضى عن أيّ تصرّف فاسدٍ إذ خطب فيهم قائلاً: \"أنتم ملح الأرض ولكن إن فسد الملح فبماذا يُملَّح. لا يصلح بعدُ لشيء إلا لأن يطرح خارجاً ويُداسَ من الناس.\" (متى 5 : 13)<br />علمهم أن يكونوا فقراء صبورين وُدَعاء رُحماء غير طماعين بمال. علمهم أن لا يهتموا لهذا العالم وسياسة هذا العالم. حذرهم من أن يكونوا تجاراً. مجاناً أعطاهمُ ومجاناً أمرهم أن يعطوا.<br />من منطلق تلك التعاليم، فَهِمَ الرسل الأوائل المهمة التي أوكلت إليهم وقبلوا بها. قبلوا بها عارفين أنها ليست وظيفة لتأمين عيش إنما وعلى العكس تماماً، رحلة على طريق العذاب.<br />بعد رحيل المسيح، كان الرسل يجتمعون ويصلون ويطلبون من الروح القدس أن يساعدهم على اختيار التلاميذ. لم يكن لديهم آنذاك أجهزة كمبيوتر ولم يكن هناك مؤسسات يستخدمونها للتحري عن تاريخ وسلوك التلاميذ ولكنهم بالتأكيد كانوا يختارونهم بعد أن يتأكدوا إلى حد ما من صلاحيتهم للخدمة وبناء على توصيات من تلاميذ آخرين عُرفوا بصلاحهم.<br />تعيين الكهنة كخدام للكنائس يجب أن لا يختلف، لا في الطريقة ولا في الهدف عن كيفية انتقاء المسيح للرسل، أو عن كيفية انتقاء الرسل للتلاميذ.<br />الكهنة والمطارنة والقسس ليسوا الكنيسة. والكنيسة ليست البناء الذي يجتمع بين جدرانه المؤمنون لأداة الصلاة. الكنيسة هي جماعة المؤمنين نفسها. وبالتالي، فإن هذه الكنيسة ليست بحاجة إلى بناء، إذ يمكن للمؤمنين أن يجتمعوا في حديقة عامة أو أي مكان آخر، وحيث يجتمعون تكون هناك كنيسة. الكنيسة ليست بحاجة إلى كاهن، إذ يمكن للمؤمنين أن يختاروا من بينهم أي رجل صالح حكيم ومطلع ليرأس اجتماعهم. بعبارة أخرى، إن جماعة المؤمنين هي الكنيسة سواء كان هناك كاهن أم لم يكن، وسواء كان هناك بناء أو لم يكن. وجود كاهن داخل بناء تحيط به أربعة جدران دون مجموعة المؤمنين لن يشكل كنيسة.<br />هنا لا بد لي من الاستدراك قبل أن يرى البعض في كلامي دعوة إلى الفوضى. إني لأستدرك وأقول، إن القول بعدم الحاجة إلى راع أو رئيس هو أمر يخالف طبيعة المجتمعات البشرية لا بل حتى طبيعة بعض الجماعات الحيوانية الذكية التي لا يمكن لها أن تستمر في الوجود دون قيادة.<br />الدولة بحاجة إلى رئيس والجيش بحاجة إلى قائد والفريق الرياضي بحاجة إلى مشرف والمؤسسة التجارية بحاجة إلى مدير وجماعة المؤمنين بحاجة إلى راعٍ سواء كان لقبه كاهناً أو قسيساً أو معلماً. ولكن إذا كان الرئيس في العالم ـ الحرّ منه طبعاً ـ معرضاً للعزل حين يسيء استخدام السلطة التي عُهِدت إليه، وإذا كان مدير الشركة معرضاً للطرد حين يخون الأمانة التي ربطت بعنقه، وإذا قائد الجيش معرضاً للمحاكمة والسجن حين يتعاون مع الأعداء أو يقود جنوده بتهور إلى معركة خاسرة.. إذا كان هذا عقاب الحكام والقادة والمسئولين الزمنيين، فحريّ أن يكون عقاب القادة الروحيين الذين يخونون الأمانة والذين لا يحترمون القوانين التي يعظون هم أنفسهم بها عقاباً أشدّ وأعظم.<br />وأن ما يفعله الانبا بيشوى سكرتير المجمع المقدس أكبر برهان وما يفعله القمص بطرس بطرس بسطوروس كاهن كنيسة الشهيد العظيم مارى جرجس بدسوق ووكيل مطرانية كفر الشيخ وأكبر جامع تبرعات فى تاريخ الكنيسه القبطيه لحسابه الشخصى وأكبر بذنس مان فى تاريخ الكهنه قسيس يورس أبنه الذى لا يصلاح غير تاجر فى سوق الخرده الكنيسه قسيس يعيش فى شقق فاخره بدسوق و الاسكندريه و القاهره يتعدى ثمن الواحده الملايين قسيس يمتلاك الاراضى الزراعيه والفيلات وافخم السيارات وياريته ابن عز بلعكس ابن فقر وكان يقتصر داخله على طبق العطايه هوه و ابوه من قبله قسيس فاشل فى حياته الدراسيه ووضعه الانبا بيشوى فى هذه المنصب لأنه واجد فيه مالم يجده فى غيره من عادات من أقذر العادات مثل الوشيه بلكهنه وأشياء أخرى كثيره لن تسع هذه المساحه للحديث عنه ...<br />أصيب بلعجب الذى يصل الى حد الغباء لأنى لا أقدر ان استوعب لماذ نترك هؤلاء المسحاء الكذبه ...<br />ربما يعترض بعض المتحفظين بقولهم أنه من العار أن نقوم بنشر الغسيل الوسخ أمام الناس. إلى هؤلاء أقول: إنه من العار أن لا يُنشرَ الغسيل الوسخ والأفضل لهذا الغسيل الوسخ أن ينشر ليتطهر بأشعة الشمس قبل أن يعرّض الجسد لمختلف الأمراض. إضافة إلى ذلك، إذا كانت أخبار الفساد في العصور الماضية تنتشر بسرعة الحصان، فهي اليوم تنتشر بسرعة الضوء، وتجاهلها ليس إلا كتجاهل النعامة للخطر المقبل عليها بدفن رأسها تحت الرمال.<br />إلى هؤلاء أقول أيضاً: إن أعداء المسيحية لا يجدون شيئاً في تعاليمها يستغلونه للهجوم عليها، فيستعيضون عن ذلك بمهاجمتها عن طريق إظهار رجال الدين المسيئين بتصرفاتهم إلى تعاليمها وكأنهم هم الدين المسيحي.<br />خلال السنوات الثلاثة التي قضاها المسيح على الأرض مع التلاميذ، علمهم كيف يكونوا خداماً للمؤمنين لا أرباباً، وقام بغسل أقدامهم ليقرن قوله بالفعل. قال لهم: \"من أراد أن يكون فيكم كبيراً فليكن لكم خادماً، ومن أراد أن يكون فيكم أوَّلَ فليكن لكم عبداً\" (متى 20 : 27)<br />إنّ من يعتقد بأن الكنيسة كمؤسسة وسلطة ليست بحاجة إلى إصلاح، فكأنه يقول بأنها معصومة عن الخطأ، وهذا القول بحد ذاته هو الخطأ عينه. ما علينا إلا أن نفتح كتب التاريخ ونطالع صحف الحاضر!<br />إنه لمن المؤسف أن يكون هناك من يعتقد بخطأ توجيه النقد إلى السلطة الكنسية علناً، لأن السكوت عن الخطأ خطأ أكبر، والحديث عنه سراً لا يؤدي إلى نتيجة، فالاعتراف بوجود الخطأ لا عيب فيه، إنما العيب هو في السكوت عنه.<br />ابو هنرى<br />سامى وليم زكى يوسف<br />كنيسة الشهيد العظيم مارى جرجس بدسوق"
