subject = "نكت المقاهى"
author = "بو هندى"
text = "زار رئيس الوزراء احدى مدارس الاطفال فسالة طفل قبطى - ينفع قبطى يبقى وزير فرد علية رئيس الوزراء ينفع يا حبيبى<br />فكرر الطفل طيب ينفع ان رئيس الدولة يبقى قبطى<br />فرد رئيس الوزراء ولا حتى مسلم ينفع"
