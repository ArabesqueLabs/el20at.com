subject = "مرسي ارحل"
author = ",واحد مخنوق"
text = "صراحة الدكتور محمد مرسي أكثر شخصية تسئ لجماعة اإخوان المسلمين وهو يعمل علي تضييق الانفتاح الذي وصلت اليه الجماعة<br />العجيب أنه أصبح الرجل القوي في الجماعة بعد غياب الشاطر رغم أنه تم تعيينة في مكتب الإرشاد ولم ينتخبه مجلس شوري الجماعةولا قواعدها بالطبع في الوقت الذي يتم تهميش القيادة المنتخبة مثل عبدالمنعم أبوالفتوح<br />بصراحة الواحد قلقان علي نفسه من حكم الإخوان اذا تولي أمري شخص مثل الدكتور محمد مرسي أشهر اقصائي الجماعة"
archived = "2007-10-31"
capture_url = "https://web.archive.org/web/20071031232556/http://masr.20at.com:80/newArticle.php?sid=12195"
