subject = "نقلا عن منتدى الكساد"
text = "الإخوان المفلسين دعـاة فتنـة للشيخ مقبل رحمه الله<br />قال الشيخ مقبل رحمه الله رحمة واسعة :<br />وأما الإخوان المفلسون فهم دعاة فتن فانظروا إلى ما فعلوا في كنر ـ لا جزاهم الله خيرا ـ<br />وأنا أقول إنهم يمهدون في ذلك الوقت لأمور فهم يعرفون أن أهل السنة لن يرضوا بها ثم يأتي حكمتيار ـ لا بارك الله فيه ـ ولا جزاه الله خيرا وأخزاه الله وقد فعل ويهجم على كنر ـ وقتل هو وجماعتة أهل السنة شر قتلة أخزاه الله ـ أما أهل السنة فإنهم يقولون كما قال النبي صلى الله عليه وسلم { المسلم أخو المسلم لا يظلمه ولا يخذله ولا يحقره التقوى هاهنا بحسب امرىء من الشر أن يحقر أخاه كل المسلم على المسلم حرام دمه وماله وعرضه } .<br />بل رب العزة يقول (( إنما المؤمنون إخوة )).<br />فيا أيها الإخوان المفلسون على نفسها براقش تجني فإن الشعب اليمني إذا رآكم تظلمون إخوانكم السنيين الذين لا يريدون الفتن يشمئز منكم وإليكم مثالا على ذلك :<br />فعند إن كنت في موديه أشاعوا أنها ستكون فتنة فقلت : أما نحن فلسنا دعاة فتن وتركت المحاضرة ، ثم ضربوا أخا لنا من عدن في ذلك المسجد ، وضربوا أخا آخر كذلك ، فاشمأز الناس منهم وقالوا :<br />هؤلاء يريدون ألا يعلمنا الناس وطلبة العلم ، لا يريدون إلا أن نضيع كما ضاعوا ، يريدون أن<br />يشغلوا الشباب بالتمثيليات والسمر<br />والمهرجانـات وبحمد الله فقد تفلت الشباب من أيديهم فما أكثر الشباب الذين يأتون من جميع المدن اليمنية ولا يبقى معهم شخص إلا من أجل الشهادة أو من أجل المرتب فإذا كنت<br />إخوانيا فأبشر بثلاث وظائف .<br />ونحن إذ ندعو إخواننا إلى المسالمة فإننا ننصح أهل السنة كلهم ألا يحضروا محاضرات الإخوان المفلسين ولا الشيعة ولا الصوفية ولا غيرهم من أصحاب البدع والحاقدين على السنة .<br />وأنا أريد من أهل السنة أن يتركوا الحزبيين فلماذا تكثرون سوادهم وهم يقتلون إخوانكم ويضربون إخوانكم ويأخذون المساجد من تحت أيديكم ويسحبون ضعاف الأنفس من شبابكم بالمادة والسني الذي يقول نتعاون فيما اتفقنا عليه ويعذر بغضنا بعضا فيما اختلفنا فيه ‍‍‍‍‍‍‍‍‍؟؟؟<br />أعتبره مغـفـلا .<br />وأصحاب جمعية الحكمة سينضمون بعد قليل إلى الإخوان المفلسين وستذكرون هذا فإنهم كل وقت وهم في تدهور وفي خسارة وأنا أسألكم من أخسر الناس من أصحاب جمعية الحكمة ؟؟ يقول أحد الأخوة عبدالقادر الشيباني فقلت لا : فعبدالقادر الشيباني ضايع مايع من أوله إلى آخره ولكن الخاسر هو محمد المهدي الذي لم يكن أحد في بلد أطوع من أهل آب لمحمد المهدي فقد كانوا يلتفون حوله والذي بقي معه الآن عمارة جمعية الحكمة أما الشباب فالحمد لله قد انصرفوا عنه فهو الذي أضل عبدالمجيد الريمي بعد أن كان عبدالمجيد رجلا طيبا وصحبه إلى الجمعية وهو الذي أضل محمد البيضاني وسحبه إلى الجمعية وبعدها يقول: هؤلاء مغفلون مقبل بن هادي لا يفرق بين الجماعات والجمعية ، فأقول : إن الجمعية هي جزء من الجماعات وأما حفر الآبار وبناء المساجد فهي وسيلة إلى الأكل وقد قال لي بعض الذين حضرهم وهو يـقتسمون الأموال لأنهم في صنعاء كانوا يطلبون للمغتربين فأحدهم يقول :والعاملين عليها وآخر يقول والعاملين عليها ولا أدري ما هو الذي وصل للمغتربين !!!! والله المستعان."
archived = "2007-10-31"
