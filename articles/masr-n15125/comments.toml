order = 0
subject = "لا بغل بعد اليوم.....الثورة السوداء قادمة الينا.... فمرحبا بها"
author = "محمد سالم"
text = "اولا لابد ان اسجل اني من المعجبين بكتاباتك يااخ عبد الله وغالبا مااتفق مع معظمها<br />لكن ياعم عبدالله المحلة او مصر ليست اوكرانيا ..... ثم لا تنسي انه لولا الدعم الغربي لما حقق الثورة البرتقالية شيئا<br />اما نحن فليس معنا الا الله ....<br />انا مش مزعلني حاجه يا عبد الله في الموضوع بتاع المحلة الا انهم حرقوا محلات البغل بتاع الفول والطعمية<br />ده انا كنت عامل اشتراك يومي معاه<br />حاسس اني فقدت مكون اساسي من مكونات حياتي اليومية<br />لا اتصور الحياة بدون سندوتشات البغل ------ عليه شوية سندوتشات ياعبد الله ولا تقول التابعي ولا بتاع<br />تقولشي حاطط فيها لحمه حمير ياراجل .... واسعارة تمشي مع معدومي الدخل اللي زي<br />بس هو يستاهل ... اقولك السر في حرق المحلات<br />الباشوات بتوع الداخلية كانوا قاعدين جوم المحل وكان قاعد معاهم اشرف البغل صاحب المحلات<br />فالناس استفزها المنظر قوي واعتبروه متواطيء مع الامن<br />فلما بدات المعارك كان البغل اول من بداو به بغرض استهداف الضباط الموجودين بالداخل<br />وكانت النتيجة فرار الباشوات مثل الفئران المذعورة بعد اصابة عدد منهم<br />وتم حرق المحل بالكامل اللي موجود في ميدان الشون<br />ثم اتجه المتظاهرون الي المحل اللي في شارع البحر بجوار العباسي وقاموا بحرقه ايضا<br />واسفاه علي البغل<br />لا بغل بعد اليوم..... يافرحةالاعادي فيك يا بغل"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132118/http://masr.20at.com:80/newArticle.php?sid=15125"

