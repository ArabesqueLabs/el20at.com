subject = "15- عن حذيفه بن اليمان قال : قال رسول الله صلى الل"
author = "مش ضروري"
posted = "2008-04-12"
text = "15- عن حذيفه بن اليمان قال : قال رسول الله صلى الله عليه وسلم ((يكون بعدى أئمة لا يهتدون بهديى ولا يستنون بسنتي وسيقوم فيكم رجال قلوبهم قلوب الشياطين في جثمان إنس ، قلت كيف أصنع إن ادركني ذلك قال تسمع وتطيع وأن ضرب ظهرك وأخذ مالك ))رواه مسلم .<br />طبعا يا جماعة الرسول صلى الله عليه وسلم قال هذا الحديث وكان يقصد وقت ظهور علامات يوم القيامه<br />فطالما ظهرت علامات يوم القيامة ظهرت الفتن والبلايا مع علينا الا ان نستمسك بحديث النبي محمد صلى الله عليه وسلم"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"

