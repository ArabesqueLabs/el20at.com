subject = "وجبات غذائية"
posted = "2008-04-20"
text = "الوجبة الأولي :<br />يتم إحضار بقايا العيش البلدي وتتم إضافة قليل من الماء مع استمرار التقليب والدعك حتي يصبح مثل الطحينة تماماً.. ويوضع عليه بعض الملح والبهارات اللازمة ويتم تغميسه بالعيش ... يعني عيش... يغمس بعيش ..!!<br />الوجبة الثانية :<br />نذهب لأي فسخاني ونشتري بعضا من ماء الفسيخ منه بـ 50 قرشا ونقوم بتغميسه بالعيش ... أهوه بنحدق يا ريس ... !!!<br />الوجبة الثالثة :<br />نذهب إلي سوق الخضار ونشتري الخضار التالف العاطب والذي يضعه البائع عادة أسفل قدميه ... نأخذه ونحاول تظبيطه بغليه ونضعه بعد تقطيعه علي النار ويتم عمل خلطة خضار نأكلها في الثلاث وجبات ... ؟!!<br />الوجبة الرابعة :<br />نذهب إلي أي جزار ونأخذ منه العظم الذي يلقيه أسفل قدميه وتلعقه القطط .. والذي لا يوجد به أي مواسير أو غيره .. فنحن ليس في مقدرتنا شراء عظم المواسير الفاخر...ونقوم بغسله ونضعه علي النار مع كمية كبيرة من الماء ... ونعمل شوربة حتي نرم عظم أولادنا ونشرب شوربة ..!!<br />الوجبة الخامسة :<br />وهي أغلي الوجبات وأصبحت ترفيها لنا وهي شراء الفراخ النافقة الميتة من عند تجار الفراخ الذين يبيعون لنا الفرخة بـ 4 و 5 جنيهات ، بعد أن تعدي ثمن الفرخة 30 جنيها ووصل ثمن الكليو من الفراخ البيضاء إلى 13 جنيه .. !!<br />الميتة أحلت لنا في عهدكم من سنين يا سيادة الرئيس .... !!<br />الوجبة السادسة :<br />شراء أرجل الفراخ وعمل خضار وشوربة عليها ... حتي يجد الأطفال ( منابا) يمسكونه في أيديهم حتي ولو رجل فرخة ..؟!!<br />وأخيراً تصور يا سيادة الرئيس .. ما يحلّي به شبابنا وأطفالنا عندما يهفهم الحلو .. إنهم يذهبون لبائع الزلابية ولقمة القاضي وبلح الشام ومعهم رغيف العيش ويقطعونه نصفين ويطلبون منه أن يضع لهم القليل من الشربات المسكر الذي تتم التحلية به داخل الرغيف ...!!"
