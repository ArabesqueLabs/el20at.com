text = "المشكلة مش في تغيير الحكم<br />المشكلة مين اللي حيحكم بعد تغيير الحكم<br />وهل هو حيحقق اهداف الشغب<br />و(ايه الضمانات)<br />لان احنا عندنا تجربة قريبة الا وهي الثورة على الملك فاروق<br />فالناس اللي جم بعد الملك فاروق طلعوا ازفت وانيل من الملك فاروق<br />فتغيير الحكم مش هبل وعبط<br />تغيير الحكم لازم يكون مرهون بان السلطة تنتقل الى يد الشعب والجيش يعلن ولائه للشعب"
