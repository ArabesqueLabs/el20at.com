order = 10
subject = "ولى امر البقر الضاحك - والبغل"
author = "الزناتى خليفة"
posted = "2008-04-10"
text = "اية حكاية ولى الامر والزمارة اللى كل شوية بتطلع بتاع الولد فرقع لوز<br />ولى امر اية يا روح امك<br />ولى امرك فى منتجع الشرم يعاقر الحان ويتفرج على المايوهات الاسرائيلية البكينى ويتمشى على شواطىء العراة<br />وانت تقف فى طابور الخبز يا متخلف<br />من يسمع كلامك هذا بيتف علية"
