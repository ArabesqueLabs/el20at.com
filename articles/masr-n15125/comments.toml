[[comments]]
order = 9
subject = "كيف يجمع بين حديث: ( من قتل دون ماله فهو شهيد ) وحديث: (اسمع وأطع وإن ضرب ظهرك وأخذ م"
author = "مش ضروري"
text = "س : أحسن الله إليكم ؛ يقول السائل : فضيلة الشيخ : كيف يجمع بين حديث: ( من قتل دون ماله فهو شهيد ) وحديث: (اسمع وأطع وإن ضرب ظهرك وأخذ مالك فاسمع وأطع )؟<br />ج : (اسمع وأطع وإن أخذ مال11ك وضرب ظهرك ).هذا في ولي الأمر، أما المدافعة عن المال فهذا مع غير ولي الأمر.<br />لو جاء ظالم ،أو سارق ،أو لص ،أو قاطع طريق يريد أخذ مالك ،فإنك تدافع دونه ولو قتلت ، فإن قتلت فأنت شهيد ،أما ولي الأمرفلا تدافع ،لو أخذ مالك لا تدافعه ؛ بل اصبر على ذلك دفعا لأعظم الضررين ،فرق بين ولي الأمر وبين آحاد الناس ،الظلمة من آحاد الناس .ــــ<br />المصدر :<br />كتاب : شرح حديث (إنا كنا في جاهلية ) للشيخ صالح الفوزان - حفظه الله تعالى -"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132118/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 10
subject = "ولى امر البقر الضاحك - والبغل"
author = "الزناتى خليفة"
text = "اية حكاية ولى الامر والزمارة اللى كل شوية بتطلع بتاع الولد فرقع لوز<br />ولى امر اية يا روح امك<br />ولى امرك فى منتجع الشرم يعاقر الحان ويتفرج على المايوهات الاسرائيلية البكينى ويتمشى على شواطىء العراة<br />وانت تقف فى طابور الخبز يا متخلف<br />من يسمع كلامك هذا بيتف علية"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132118/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 11
subject = "مقاومة الظلم والفساد واجبة شرعا وعقلا"
author = "مقاومة الظلم والفساد واجبة شرعا وعقلا"
text = "http://masr.20at.com/newArticle.php?sid=15073<br />مقاومة الظلم واجبة شرعا وعقلا .... وكل من يبرر للظلم ظلمة وفساده هو شريك بالجريمه<br />مثل ما قال الاخ اللي كاتب في الرابط اللي فوق<br />لا نريد فتاوي مدفوعة الاجر ياعملاء السلطة والفساد والظلم"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 12
subject = "ترويع البنات والسيدات"
author = "بنت مصر"
text = "لا شيئا ابدا اقسى من ترويع البنات والسيدات فى انصاف الليالى وفى الفجر<br />فتاة بملابس النوم وسيدة فى لبس البيت تقتحم قوة من اجلاف الامن - امن الرئيس وليس امن الدولة - تقتحم القوة بيتهم او شقتهم بطريقة تروعهم وتفزعهم بلا ادمية ولا حرمانية ولا اى معايير للاخلاق<br />سألوا ابوجهل<br />لماذا لا تقتحم بيت محمد ليلا وتقتلة وتريح العرب منة ؟<br />فقال ابو جهل<br />اتريدون ان يقول عنى العرب اننى روعت بنات محمد ؟<br />الجاهلى عدو الاسلام خاف وارتعب ان يروع البنات فى البيت<br />ان ارهاب النظام فاق كل حد<br />وحينما نقيم دولة الحرية<br />ستكون اول مادة فى الدستور<br />المصرى امن فى بيتة ولا يجوز اقتحام سكنة او ترويع افراد اسرتة وبناتة وزوجتة<br />وعندما يريدون القبض على انسان فليكون فى الشارع وهوخارج من بيتة اما اقتحام البيوت فى الفجر فلا ولا ولا ولا"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 13
subject = "سألت ابى المريض عن المظاهرات زمان ودلوقتى"
text = "سألت ابى عن المظاهرات زمان على ايامة وعن المظاهرات دلوقتى واية الفرق وهل شارك فى مظاهرات من قبل<br />فقال لى<br />عندما كنت طالبا فى المدرسة الثانوية فى مركز المحلة مثلك تماما الان حدثت احداث مؤسفة فى الجزائر ايام تحريرها فقررت زعامة الطلاب عمل مظاهرة لتطوف فى شوارع المحلة ولتهتف بما تشاء واخبروا الناظر والوكيل وسكرتير المدرسة وتجمع الطلاب فى الحوش وهتفوا اليوم حرام فية العلم<br />اتصل حضرة الناظر بمأمور المركز<br />فجاء مأمور المركز راكب حصان وخلفة ثلاثة جنود من الخيالة راكبين احصنة برضة وقال شوفوا يا جماعة مظاهرية سلمية ومفيش ضرب طوب واحنا هنمشى قدامكم<br />وفتحوا ابواب المدرسة وخرج ما يقارب 700 طالب وانضم اليهم طلبة المعهد الدينى وبعض المدارس الابتدائية والاعدادية<br />كان المأمور فى المقدمة على حصانة وخلفة 3 احصنة عليهم عساكر سوارى والجماهير خلفة تهتف والطلبة شايلين بعض للهتاف<br />اذكر الهتاف وقتها<br />الجزائر عربية وديجول ابن الحرامية<br />وهتف الطلبة وصرخوا بدون اى تدخل ثم انفضوا وكل واحد رجع بيتة - المأمور مبسوط والطلبة مبسوطين لانهم فرغوا الشحنة النفسية اللى عندهم<br />كان المأمور ابا للطلبة زى الناظر<br />انما دلوقتى<br />تحدث مظاهرة على سلم نقابة فتجىء قوات تسد عين الشمس بالعصيان والمدرعات وهات يا ضرب<br />تختلف مظاهرات النقابات عن مظاهرات الشعب<br />اى اشتباك مع جماهير غير متعلمة سوف يؤدى الى فوضى وحرائق ويخرج الموضوع عن السيطرة مهما كانت القوة الغاشمة ومهما كان سلاحها<br />اتخيل لو ان الامن لم يظهر فى شوارع المحلة ولم يحتك بالناس كان الناس سوف يهتفون شوية وينفضوا<br />ان مصر تصرف ربع ميزانيتها على قوات الامن المركزى لتستعدى الشعب وتحاربها<br />ان اى حرب مع الشعب سوف ينتصر الشعب وسيحرق الاخضر واليابس<br />ابعدوا سياسة العصى الامنية<br />سرحوا عساكر الامن المركزى وهاتوا بالفلوس اللى بيصرفوها عيش للناس<br />شاهدنا لوارى ومدرعات وعربات اطفاء لو استخدمت فى نظافة الشوارع وجمع الزبالة سوف تخدم المجتمع<br />من يحكم مصر الان<br />هل نحن بدون قيادة<br />هل هم لواءات الداخلية بغبائهم المعروف<br />مستقبل مظلم يا بلادى"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 14
subject = "15- عن حذيفه بن اليمان قال : قال رسول الله صلى الله عليه وسلم ((يكون بعدى أئمة لا يهتدون بهديى ولا يستنون بسنتي وسيقوم فيكم رجال قلوبهم قلوب الشياطين في جثمان إنس ، قلت كيف أصنع إن ادركني ذلك قال تسمع وتطيع وأن ضرب ظهرك وأخذ مالك ))رواه مسلم ."
author = "مش ضروري"
text = "15- عن حذيفه بن اليمان قال : قال رسول الله صلى الله عليه وسلم ((يكون بعدى أئمة لا يهتدون بهديى ولا يستنون بسنتي وسيقوم فيكم رجال قلوبهم قلوب الشياطين في جثمان إنس ، قلت كيف أصنع إن ادركني ذلك قال تسمع وتطيع وأن ضرب ظهرك وأخذ مالك ))رواه مسلم .<br />طبعا يا جماعة الرسول صلى الله عليه وسلم قال هذا الحديث وكان يقصد وقت ظهور علامات يوم القيامه<br />فطالما ظهرت علامات يوم القيامة ظهرت الفتن والبلايا مع علينا الا ان نستمسك بحديث النبي محمد صلى الله عليه وسلم"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 15
subject = "قال رسول اللة صلى علية وسلم اذا وسد الامر الى غير اهلة فانتظر الساعة -- حديث متفق علية"
author = "خايب"
text = "اى نعم من علامات الساعة تولى معتوة ومتخلف عقليا رئاسة مصر كما يقول الحديث حيث ان الامر وسد الى غير اهلة لى وضع الشخص الغير مناسب فى مكان لا يناسبة<br />وحسنى مبارك كل مؤهلاتة تؤهلة لان يكون رئيس للساحة الشعبية فى كفر مصيلحة"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 16
subject = "قال رسول اللة صلى اللة علية وسلم --- شر امراؤكم اللذين ---"
author = "برضة هو"
text = "قال رسول اللة صلى اللة علية وسلم<br />شر امراؤكم اللذين تبغضونهم ويبغضونكم وتلعنونهم ويلعنونكم<br />حديث متفق علية<br />اللهم العن حسنى فى كل كتاب"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 17
subject = "ممتاز ممتاز ممتاز"
author = "ابومحسن"
text = "الى المعلق السابق والمعلق قبل السابق<br />ممتاز ممتاز ممتاز<br />لما ندور على احاديث رسول الله صلى الله عليه وسلم<br />كده يبقى احنا بدأنا نمشي صح<br />واي حاجه في الدنيا كلها افتى فيها النبي محمد صلى الله عليه وسلم والنبي محمد صلى الله عليه وسلم حكى للصحابة كل حاجه حتحصل الى يوم القيامه<br />اللهم صلي وسلم وبارك على سيدنا محمد<br />ويا جماعة الخير من القراء ومدوني هذا الموقع دوروا على احاديث رسول الله صلى الله عليه وسلم"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"

[[comments]]
order = 18
subject = "يا (برضه هو) ما تكتبش نص الحيث وتسيب نصه"
author = "مش ضروري"
text = "فيه واحد كاتب اسمه برضه هو جايب حديث وسايب نصه والحديث كما هو<br />حديث عوف بن مالك عند مسلم عن شرار الأئمة، قول النبي صلى الله عليه وسلم: وشرار أئمتكم الذين تبغضونهم ويبغضونكم، وتلعنونهم ويلعنونكم، قالوا: أفلا ننابذهم يا رسول الله، قال: لا، ما أقاموا فيكم الصلاة...<br />فهمت بقية ا لحديث بيقول ايه يا شاطر (ما اقاموا الصلاه)<br />اسمع كلام النبي انت وهو وبلاش الهبل اللي انتو فيه دا"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413214418/http://masr.20at.com:80/newArticle.php?sid=15125"
