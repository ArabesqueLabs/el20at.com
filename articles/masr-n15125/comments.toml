[[comments]]
order = 23
subject = "رايحة فين يا مصر يا حبيبتي"
author = "محمد رحيب"
posted = "2008-05-01"
text = "أعتقد بأن المتأمل في أحوالنا اليوم يري بأن الوضع مقلوب والحياة لم تعد بالسعيدة واليوم يمر علينا ولا نعرف إن كان في موازين الحسنات أم والعياذ بالله في موازين السيئات ..<br />أستشعر التيه الذي أصاب البلاد والعباد وأتسائل يا تري ما سببه ؟؟<br />هل الإنشغال بالدنيا والتفريط في حق الله ؟؟ أم المعاصي والذنوب ؟؟ أم الأولويات المشتتة ؟؟ أم التفكير السلبي ؟؟ أم ماذا ؟؟<br />ما هو سبب حالة الفوضي التي نحياها ؟؟<br />وهل كان يوسف شاهين وخالد يوسف يسألوا من خلال فيلمهم التافه سؤالا أم يُقِروا واقعا نحياه ؟؟<br />الأمر جد خطير والغريب أننا جميعا نحيا في هذه الفوضي ,,,,,<br />أسمحو لي أن أكلمكم عن مصر لأن أهل مكة أدري بشعابها فليس عندي المعرفة الكاملة لظروف بلد من بلدان المسلمين إلا البلد التي أحيها فيها وأتشرف بأنني ولدت وتربيت بين أهلها الطيبين .... نعم طيبين .... مهما حصل ومهما عملوا ومعدن الشعب الجميل ده لن يظهر إلا إذا رجع إلي الله بحق وأقتنع بجدوي أن تكون مصر إسلامية وأن يجاهد في سبيل ذلك<br />أسمحوا لي أن أكلمكم عن كنانة الله في أرضه ..<br />أليست هي البلد الوحيدة التي ذكرت في كتاب الله أربع مرات ؟؟<br />أليست هي مصر التي قال عنها رسولنا صلي الله عليه وسلم أستوصوا بأهلها خيرا فإن لكم فيها نسبا وصهرا وأوصي بأن يأخذ المسلمين من أجنادها فهم خير أجناد الأرض ؟؟<br />أليست هي مصر بلد الخير التي يسرقها حكامها من آلاف السنين ورغم ذلك يجد أهلها المأكل والمشرب والملبس .<br />ولكن المشكلة أن أهل مصر الكرام يعيشون حالة من التيه والفوضي ,,,<br />والمسالة بإختصار هو محاولة إيجاد حلول للخروج من هذا التيه ..<br />هل الإضراب هو الخطوة الأولي ؟؟ وإن كان كذلك فهل سيدع النظام الظالم الممسك بزمام الحكم هذه الخطوة لتنجح وتؤتي ثمارها دون منغصات ؟؟<br />أم سيكون النظام في إضراب 4 مايو أعظم مكرا من إضراب 6 إبريل ؟؟<br />هل سيدفع البلطجية (الذين لا استطيع تصنيفهم) للتدمير والتخريب ثم يلصقها بالمتظاهرين الذين يقيمون مظاهرة سلمية هدفها في الأساس هو الحياة الكريمة بدون فقر ولا بطالة ولا تأخر في سن الزواج ولا محسوبية ولا رشوة ولا إعتقلات لأصحاب الفكر ولا محاكمات عسكرية للمدنيين ولا سماع لسياسة تتار العصر من الأمريكان وأذيالهم ؟؟؟<br />والسؤال هل البلطجية مصريين مثلنا ؟؟<br />هل يعانون مما نعاني ؟؟<br />أم أنهم أصبحوا أسري الجريمة وأصبحت سطوة ضابط القسم عليهم أقوي من سطوة العلي الكبير ؟؟<br />وضع غريب ..<br />أيها المصريون هل تثقون في نظام مبارك ؟؟ هل تعتقدون أن مبارك والحزب الوطني يسعون فعلا للإرتقاء بمستوي البلاد ولكن ضعف الموارد هو الذي يحول بينهم وبين تحقيق ذلك ؟؟ وإن كانت الإجابة بالنفي وأننا لا نثق في نظام مبارك ونجزم بأن نظام مبارك يعمل لمصلحة الأمريكان أكثر من عمله لمصلحة المصريين فأين هو الطريق الذي نسلكه ؟؟<br />هل بالعمل السياسي ؟؟ أم بالتربوي (الذي لم يعد كسابق عهده) ؟؟؟<br />أم بإيقاظ الشعب الجائع ليثور ؟؟<br />ما هو دور الإخوان بالضبط في هذه المرحلة ؟؟؟<br />وهل نخاف بالفعل علي حياتنا ؟؟؟<br />ألم نقل بأن الموت في سبيل الله أسمي أمانينا ؟؟؟<br />أليست هي الجنة ومن قبلها رضي الرحمن علينا هو ما نريده ؟؟؟<br />أين المشكلة إذن ؟؟<br />البطالة تتفشي والأزمات النفسية تزداد والظلم الواقع علينا يزيد الأمر سوءا فوق سوء والإعلام الحكومي العميل مستفز وجيش الإعلاميين المتمثل في (عمرو أديب وتامر بسيوني ومعتز الدمرداش) الذين يحاولون أن يكونوا محايدين ولكن من الواضح جدا أن جيش الإعلاميين هذا مأجور لنظام مبارك ويحاول بكل طريقة أن يدفع الأذي عنه حتي وإن كان هذا علي حساب الشعب الغلبان ولكنهم جهلوا بأن هذا الشعب له طاقة وأنه صعب الخداع ومن الممكن أن يتقبل الهزيمة النفسية لفترة ولكنه لا يحبها بل ويبغضها ولن يصدق زيف إدعاءاتهم .<br />أريد أن تشاركوني الهم والغم علي بلادنا التي تضيع من بين أيدينا فلم يعد هناك وجود للقيم ولا المبادئ حتي عبادتنا التي هي سر وجودنا في الحياة أصبحنا نعلم عنها القشور ولا يعنينا أكثر من ذلك في حين أننا أصبحنا نتهافت علي متع الدنيا الزائلة<br />وحسبنا الله ونعم الوكيل"
