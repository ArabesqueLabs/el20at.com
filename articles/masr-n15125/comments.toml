subject = "الاخوان يقولون ان الاسلام هو الحل والحزب الوطنى يق"
author = "من الشباب"
posted = "2008-04-14"
text = "الشباب محتار مع من ينحاز<br />مع الاخوان فى شعارهم الاسلام هو الحل<br />ام مع الحزب الوطنى الذى ينفذ شعارة<br />الاستعباط هو الحل<br />نعم الاستعباط فى كل شىء<br />يقول لك ديمقراطية وهو الذى قضى على بواقى اى ديمقراطية من العصور السابقة<br />فى عصر عبد الناصر كان عمدة القرية بالانتخاب<br />وعميد الكلية بالانتخاب<br />وهى من بقايا الديمقراطية فى العصر الملكى<br />دلوقتى كلة بيتعين بواسطة مباحث امن الدولة اعتبارا من طالب الحربية والشرطة وحتى رئيس الجامعة ورئيس الحى<br />كلة مباحث امن الدولة<br />كلة استعباط فى استعباط وفاكرين الشعب بيصدق اكاذيبهم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 20
subject = "التليفون"
posted = "2008-04-19"
text = "التليفون<br />مخاصمني بقاله مده وف ليله الشوق ناداني<br />كلمت سمعت حسه وقفلت السكه تاني<br />اكمنه يا ناس واحشني وخصامه كمان حايشني<br />كلمته سمعت حسه وقفلت السكه تاني<br />باليل والدنيا ضلمه دورت نمرته<br />وسكت وقلت كلمه وسمعت غنوته<br />الو?..مين ؟؟؟وانا بايدي اليمين<br />خدت السماعه ابوسها وقفلت السكه تاني<br />وفتحت الراديو مره على غنوه بتعجبه<br />سبت التليفون عليها وانا بقصد اكلمه<br />سمعها للنهايه وفرحت انه معايا<br />من غير ما هو يعرف وقفلت السكه تاني<br />اكمنه ياناس واحشني وخصامه كمان واحشني<br />وف مره حم صحابه خليتهم يطلبوه<br />وغمزت لهم بعيني يعني عني اسالوه<br />سالوه قام قال كلام مافيهوش سيرة الخصام<br />شايفين يا ناس عشانه انا باعمل ايه<br />اطلبه واشمعنى هوه ما طلبش مره ليه<br />ياريت يطلب ويقفل يعمل زي ما يعمل<br />اعرف انه فاكرني لو قفل السكه تاني<br />اكمنه يا ناس واحشني وخصامه كمان حايشني<br />كلمته سمعت حسه وقفلت السكه تاني<br />UP<br />اه ياسمراني اللون<br />غناء المطربه المحبوبه شاديه<br />اه يا اسمراني اللون حبيبي الاسمراني<br />يا عيوني ناسياكي عيون حبيبي الاسمراني<br />تحت الرمش عذاب وحنين وعذاب وعيون ما تنام<br />دقت معاك طعم الايام والوقت بعيد يا سلام<br />جوني وسالوني جوبتهم عني<br />دموع عيني<br />علشانك امشيها بلاد من غير لا ميه ولا زاد<br />اه ياللي عيونك شمعه وضحكه وبحر في نسمة طيف<br />انت رسيت وانا وسط الشوق حيرانه من غير مجاديف<br />جوني وسالوني جاوبتهم عني<br />دموع عيني<br />يا طير يامسافر لبعيد روح قول لحبيبي الاسمراني<br />ليه سافر ونسي المواعيد يا حبيبي الاسمراني<br />ليه وانت تحب الشوق اكتر مني وقلبك عطشان<br />ليه وانت قايلي ان غبتي يغيب م الدنيا احلى مكان<br />جوني سالوني جاوبتهم عني<br />دموع عيني<br />UP<br />خذني معاك<br />تأليف محمد حمزه- تلحين بليغ حمدي<br />خدني معاك ياللي انت مسافر خدني معاك<br />خدني معاك عنــــد الحبـــايب خدني معاك<br />خدني معاك عنـــد اللي غايـــب حدني معاك<br />وحياتك يا ماشي عدي ولا تنساشي<br />حبيبي راح ولا جاشي<br />من سنين وانا صابرةه عا لحنين مش قادرة<br />ولأجل خاطره مسافرة<br />خدني معاك ياللي انت مسافر<br />وحياتك يا جارنا يامسافر لقمرنا من يوم فراقه لدارنا<br />غابت في بعده قمره تكتب عليه الشجره<br />سألت عليه كم مره خدني معاك ...<br />والله ان كنت اعدي سبع بحور لاعدي<br />حتىان تعبت ما هدي<br />عدي وخدني معاك خدني لحبيبي هناك<br />واناواقفه باستناك<br />خدني معاك ياللي انت مسافر<br />UP<br />يا دبلة الخطوبة<br />كلمات جمال البنداري- لحن منير مراد<br />يا دبلة الخطوبه عقبالنا كلنا<br />ونبني طوبه طوبه في عش حبنا<br />نتهنى بالخطوبه ونقول من قلبنا<br />يادبلة الخطوبه<br />يا صوره في الحيال ماتغبش عننا<br />بداية الامال وعز فرحنا<br />شبكنا بدلته وقرينا فاتحته<br />وعرفنا نيته وغلاوته عندنا<br />يادبلة الخطوبه<br />يادبله من دهب قوليلي ايه مكتوب<br />دا الاسم بالدهب منقوش عالقلوب<br />القلب وانشبك وراح مع الشبك<br />ولقينا في الشبك نصيبنا وفرحنا<br />وفي دبلة الخطوبه كتبنا اسمنا<br />يادبلة الخطوبه<br />UP<br />قولوا لعين الشمس<br />تلحين بليغ حمدي<br />قولو لعين الشمس ماتحماشي احسن حبيب القلب صابح ماشي<br />ماشي حبيبي ماشي ماشي بكره ماشي<br />يا حمام يا طير قبله قوام يا حمام خلي له الشمس حرير يا حمام<br />ويا ناس لو غاب ياناس خلوه يبعتلي سلام<br />دي الآه يقولها وهو ما يدراشي وف بعده طعم الدنيا ما يحلاشي<br />قولوا لعين الشمس ما تحماشي<br />يا حنان ايام ولا حتى اشوف احلام<br />ايام واراي لو غاب حتفوت الايام<br />وياناس لو غاب يا ناس خلوه يبعتلي سلام<br />اه ياناس مطرح خطاويه ما تروح<br />قسوه بحنان قسوه وادو له الروح<br />دي الآه بيقولها وهو مايدراشي وف بعده طعم الدنيا مايحلاشي<br />قولوا لعين الشمس ما تحماشي<br />UP<br />والله يازمن<br />كلمات محمد حمزه-لحن بليغ حمزه<br />والله يا زمن لا بايدينا زرعنا الشوك<br />ولا روينا يازمن وانت يازمن<br />قاسي علينا بتبروا شوك حوالينا<br />يا زمن يازمن<br />والله يا زمن مكتوب علينا<br />ومين عارف مصيره فين واللي انكتب<br />عالجبين بنشوفو بعينينا يازمن<br />والله يازمن والله يازمن<br />والله يا زمن<br />UP<br />وحشتنا<br />لحن بليغ حمدي<br />والنبي وحشتنا وحشتنا وحشتنا في غيابك عننا وحشتنا وحشتنا<br />دا احنا من غيرك ولا حاجه ونقصنا كام مليون حاجـه<br />من يوم ما فارقتنا ودموع على خدنا<br />واوعى تعملها تاني وتسيبنا لوحدنا<br />دورنا عليك يا غالي وقدرنا عللى الليالي<br />والناس قالت يا عيني ده غالي عندنا<br />دا احنا من غيرك ولا حاجه وناقصنا كام مليون حاجه<br />يا عشرة عمرنا يا اول بختنا<br />واوعى تعملها تاني تاني وتسيبنا لوحدنا<br />في الحب يا قلبي دوبنا دوبنا والشوق دوب قلوبناودوبنا<br />ويا ريت يا حبيبي توبنا في بعادك عننا<br />دا احنا من غيرك ولا حاجه ونقصنا كم مليون حاجه<br />يا غالي عندنا فين رحت مننا<br />واوعى تعملها تاني تاني تاني وتسيبنا لوحدنا<br />امانه عليك تجينا بيقولو ا عليك ناسينا<br />وحياة سهرالليالي ماتبعد عننا<br />دا احنا من غيرك ولا حاجه وناقصنا كام مليون حاجه<br />تعالى عندنا وفرح قلبنا<br />واوعى تعملها تاني تاني تاني وتسيبنا لوحدنا<br />UP<br />يا طيره طيري ياحمامه<br />ياطيره طيري يا حمامه روحي على بر السلامه<br />روحي على ديرة احبابي يلي اشتاقوا بغيابي<br />وهاتيلي من ايدن علامه يا طيره طيري ياحمامه<br />انا على ناري تاهت افكاري دوبني البعد حرام والله...يا طيره<br />ياطيره طيري ياحمامه ووديلن سلام..<br />الفرقه صعبه يا حمامه وبيزيد الآلام..<br />انا والله من بعد غيابن جفاني المنام..<br />وعيوني كوتها الدمع..وترجعلي الابتسامه..ياطيره طيري يا حمامه<br />لو مهما بعيد كنت بروحلو وبقطع سبع بحور<br />وبركب حتى اوصلوا للوادي المسحور<br />وبكحل عيني بغيابن بكحلها بالنور، ومافي والله علامه ياطيره طيري<br />ندرا علي يا حبايب لو راق الزمان<br />وهنا لي قلبي يللي دايب من كتر الحنان<br />لاشعل قناديل الفرحه واضمن بالاحضان<br />وتهرب من عيني الدمعه..وترجعلي الابتسامه.. ياطيره طيري ياحمامه<br />UP<br />اتعـــودت عليك<br />لحن خالد الامير<br />اتعودت عليك يا حبيبي اتعودت عليك<br />وبقيت ملك ايديك يا حبيبي وبقيت ملك ايديك<br />زي الطير ما تعود عشه اتعودت عليك<br />اتعودت الحنان وشعوري بالامان<br />اتعودت عليك<br />زي الطير ما تعود عشه انا انا تعودت عليك<br />انت ما كنتش بالنسبه لي حبي الغالي<br />دا انت حياتي وربع عمري وكل آمالي<br />وانت سمايا اللي بتحميني وانت النيل اللي بترويني<br />وانت النسمه اللي بتحييني وانا منك واليك<br />زي الطير ما تعود عشه انا اتعودت عليك<br />آه يا منايا وكل رجايا من دنيايا<br />انت وحدك بين العالم كفايه<br />عالم تاني اشوفه بقربك دنيا جديده باطولها بحبك<br />حب الناس لي من قلبك والاقيه جوه عنيك<br />زي الطير ما تعود عشه انااتعودت عليك<br />مسافر<br />UP<br />مسافر..مسافر..واللي افتكرته حبيب<br />وانا اللي ياما غنيت على الليالي<br />في الفرح موال وفي الجرح موال والصبر موال<br />وأصبح على دي الحال غريب ولاحد جنبي قريب<br />قلت مسلفر مسافر<br />وخايفه لما تسافر تنسى انك فايت في بلدالغريب<br />تنسى انك فايت في بلدك حبيب<br />مستنى باشواق تعبان من الفراق<br />ونولعلك شمعه نورها مستقبلك<br />وف عيونه دمعة تمسحها بعينيك<br />ولما تيجي تاني من البلد الغريب<br />يومين اسافر يمكن احايل الصبر في سكيني<br />يمكن الاقي الفرح في غربتي<br />كان نفسي اكون جنبك حبيبه من بلدك<br />تسهر على راحتك تفرح لفرحك وتقاسمك في جرحك<br />ما تهملش وعدك لما تيجي تاني من البلد الغريب<br />خايفه تلاقي ورده تحلى ف عينيك<br />تنساني وتميل تقطفها بايديك<br />وتجرحك الاشواك وتتعذب هناك<br />واقطفها بايده ولا تجرحش ايديه<br />سبت الجرح لي وخللي الفرح ليك<br />بس تيجي تاني تاني من البلد الغريب<br />مكسوفه<br />UP<br />مكسوفه منك مش قادره اقولك اني احبك<br />لاانا قد حبك ولا قد قلبك<br />لكن باحبك واعمل ايه مكسوفه منك<br />الحب غنوه وكلمه حلوه<br />حيجري ايه لو قلتها لي<br />دا انا من كسوفي وكتر خوفي<br />مش قادره اقولها قولها بدالي<br />مكسوفه ليه وفيها ايه..<br />دنا باحبك واعمل ايه مكسوفه<br />حرام عليك تعبت عنيك<br />تشغل عيني طول الليالي<br />حاولت اخبي حبك في قلبي<br />ليبان علي كتر انشغالي<br />مكسوفه اروح لك وازاي حاقول لك<br />مين قلك تسكن في حارتنا<br />UP<br />مين قالك تسكن في حارتنا تشغلنا وتقل راحتنا<br />ياتشوف لك حل في حكايتنايا تعزل وتسيب حتتنا<br />شوفحبك عامل ايه فيه من يوم ماسكنت وجيت جنبي<br />لانا عارفه اتلم على عنيه ولاعارفه حاجه عن قلبي<br />حبيتك ايوه انا مش ناكره<br />والحب عذاب وانت ادرى<br />انت اللي زرعت الشوك في بيتنا وعلى باب بيتنا<br />يا تشوف لك حل في حكايتنا يا تعزل وتسيب حتتنا<br />بيجي ابويا يعوز فنجان قهوه اعمله شاي واسقيه لامي<br />وخيالك بيجي على سهوه ما فرقشي بين خالتي وعمي<br />آخرتها ايه انا مش عارفه<br />وحاترسى لايه والله انا خايفه<br />خايفه لتروح يوم وتسيبنا والعقل ما فيش غيره حيلتنا<br />يا تشوف لك حل في حكايتنا يا تعزل وتسيب حتتنا<br />تشاور لي انزل واقابلك يا خي بعدك بيتنا ماهو جنبك<br />لوجيت ابويا حيفتح لك خد وادي معاه افتح قلبك<br />ومفكش حاجه بتعيب لمايسالني رح اقول طيب<br />النور ينقاد حوالين بيتنا داير ما يدور في بلكونتنا<br />ياتشوفلك حل في حكايتنا يا تعزل وتسيب حتتنا<br />يا حسن ياخولي<br />UP<br />تاليف ابو السعود الايباري-لحن محمد شريف<br />حسن يا خولي الجنينه ياحسن ياحسن يا غالي علينا يا حسن<br />يا خولي الجنينه ادلع يا حسن<br />يا عقلي يا روحي يانور العيون<br />يابلسم جروحي يا اصل الشجون<br />يافتنه يا زينه يا سلوى الحزينه<br />عالبال او ناسينا يا خاين يا حسن<br />يا خولي الجنينه ادلع ياحسن<br />ياخاين بحبك ياظالم يا قاسي<br />ياعينك يا قلبك يا وعدي يا كاسي<br />شوف ازاي بقينا يا كبدي علينا<br />صبرنا وقاسينا ليالي يا حسن<br />يا خولي الجنينه ادلع ياحسن<br />يا اول حبايبي يا آسر فؤادي<br />انا رضيت بنيابي وذلي وسهادي<br />في يوم ما التقينا وناحت عنينا<br />كتبنا بايدينا نصيبنا ياحسن<br />يا حسن ياخولي الجنينه يا حسن يا غالي علينا<br />ياخولي الجنينه ادلع ياحسن<br />شفت القمر<br />كلمات عبد الوهاب محمد<br />شفت القمرعلى طلعتك بالي انشرح<br />وقلت امتى في رجعتك بيجي الفرح<br />انا قلبي طار م الشوق اليك<br />راح للنجوم يسال عليك<br />ولما ما لقتش لعنيك في الليل اثر<br />بوست الهوى وبعت بوستي للقمر<br />على طلعتك شفت القمر احساسي قال<br />ان انت اجمل م القمرومن الجمال<br />وهواك وعدني اسهر هناعلشان ربطنا ببعضنا<br />في جو يقرب لنا بعد البلاد<br />انا قلبي طار م الشوق اليك راح للنجوم يسأل عليك<br />بعت بوستي للقمر يمكن يكون<br />سهران وشارد في السهر صاحي العيون<br />وبتهدي بوستك للقمر وانا باهدي بوستي للقمر<br />يتقابلوا الاتنين في السهرمن غير ميعاد<br />انا قلبي طار من الشوق اليك<br />غاب القمر<br />كلمات الشاعر حمدي نجيب- تلحين الموجي<br />غاب القمر يا ابن عمي ياللا روحني دي النسمه آخر الليل بتفوت وتجرحني<br />والصوت دليل في الخلا واليل غااب ما عاد له دليل<br />لمس الفضا واتملا قلبي بنجوم الليل<br />صار النسيم بالشوق ماكلمتك لمس النسيم توبي برمش عيونك<br />غاب القمر يا ابن عمي ياللا روحني<br />الليل وحدي ووحدك سايبين هوانا بعيد فين الحواديت وفين سهرتنا تحت الصي<br />يا خوفي من الظلمه تتهوني وانت بعيد غاب القمر ياحبيبي ب