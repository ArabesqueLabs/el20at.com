order = 4
subject = "صلو على النبي"
author = "ابومحسن"
text = "عَنْ عَائِشَةَ قَالَتْ مَا لَعَنَ رَسُولُ اللَّهِ -صلى الله عليه وسلم- مُسْلِماً مِنْ لَعْنَةٍ تُذْكَرُ وَلاَ انْتَقَمَ لِنَفْسِهِ شَيْئاً يُؤْتَى إِلَيْهِ إِلاَّ أَنْ تُنْتَهَكَ حُرُمَاتُ اللَّهِ عَزَّ وَجَلَّ وَلاَ ضَرَبَ بِيَدِهِ شَيْئاً قَطُّ إِلاَّ أَنْ يَضْرِبَ بِهَا فِى سَبِيلِ اللَّهِ وَلاَ سُئِلَ شَيْئاً قَطُّ فَمَنَعَهُ إِلاَّ أَنْ يُسْأَلَ مَأْثَماً فَإِنَّهُ كَانَ أَبَعْدَ النَّاسِ مِنْهُ وَلاَ خُيِّرَ بَيْنَ أَمْرَيْنِ قَطُّ إِلاَّ اخْتَارَ أَيْسَرَهُمَا وَكَانَ إِذَا كَانَ حَدِيثَ عَهْدٍ بِجِبْرِيلَ عَلَيْهِ السَّلاَمُ يُدَارِسُهُ كَانَ أَجْوَدَ بِالْخَيْرِ مِنَ الرِّيحِ الْمُرْسَلَةِ. رواه أحمد. وعَنْ أَبِى هُرَيْرَةَ قَالَ قِيلَ يَا رَسُولَ اللَّهِ ادْعُ عَلَى الْمُشْرِكِينَ قَالَ « إِنِّى لَمْ أُبْعَثْ لَعَّانًا وَإِنَّمَا بُعِثْتُ رَحْمَةً ». رواه مسلم وعَنْ أَنَسِ بْنِ مَالِكٍ - رضى الله عنه - قَالَ لَمْ يَكُنِ النَّبِىُّ - صلى الله عليه وسلم - سَبَّابًا وَلاَ فَحَّاشًا وَلاَ لَعَّانًا ، كَانَ يَقُولُ لأَحَدِنَا عِنْدَ الْمَعْتَبَةِ « مَا لَهُ ، تَرِبَ جَبِينُهُ » . رواه بخاري . و عَنْ أَبِى هُرَيْرَةَ أَنَّ رَسُولَ اللَّهِ -صلى الله عليه وسلم- قَالَ « لاَ يَنْبَغِى لِصِدِّيقٍ أَنْ يَكُونَ لَعَّانًا ».رواه مسلم . وعَنْ عَبْدِ اللَّهِ قَالَ قَالَ رَسُولُ اللَّهِ -صلى الله عليه وسلم- « لَيْسَ الْمُؤْمِنُ بِالطَّعَّانِ وَلاَ اللَّعَّانِ وَلاَ الْفَاحِشِ وَلاَ الْبَذِىءِ ». رواه الترمذي"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132118/http://masr.20at.com:80/newArticle.php?sid=15125"

