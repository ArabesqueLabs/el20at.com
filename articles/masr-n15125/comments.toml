text = "الاخ العزيز عبد الله حديثك عن احداث المحله هو حديث غير صحيح لانك تحملهم المسئوليه كامله وتنسى ان القمع الغير مبرر للامن وقتل الابرياء بدون اى ذنب والاستخدام المفرط للقوه واستخدام الرصاص الحى هو السبب فيما حدث كما انك تعلم جيدا ان البلطجيه اللذين يستخدمهم الامن فى تزوير الانتخابات كان لهم دور فى هذه الاحداث ثم الى متى سوف يصبر هذا الشعب على هذا النظام واى حركه جماعيه سلميه التى تتحدث عنها هى التى سوف تخلصنا من هذا الاستبداد وكأنك تعيش فى عالم اخر هذا النظام لن تجدى معه هذه الحركات السلميه بل يحتاج الى ثوره شعبيه وتغيير جذرى يعيد الامور لنصابها ويعيد حقوق الشعب المسلوبه ويعيد كرامتنا التى تهان يوميا ويعيد لمصر دورها وقيمتها العربيه والاسلاميه"
