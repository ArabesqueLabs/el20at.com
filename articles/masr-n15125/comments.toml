[[comments]]
order = 7
subject = "52 كان انقلاب عسكري مش ثورة ..... واللي بيحصل ده نتيجه له"
author = "محمد سالم"
text = "52 كان انقلاب عسكري مش ثوره ______ بالعكس قضي علي الحكم المدني الي كان موجود<br />محدش ينكر ان عبد الناصر كان راجل نظيف اليد وانجز بعض الاشياء الطيبة خصوص في مجال العدالة الاجتماعية والتعليم وغيره<br />لكنه كان ديكتاتورا ------ والديكتاتورية افة الافات ومصيبة المصائب والنتيجة كانت الكوارث الي حنا عيشنها دلوقتي<br />لو الاضراب ده كان في عصر عبد الناصر كان هيتصرف بشكل اشد قسوة مئات المرات اكتر من الديكتاتور مبارك<br />ااحنا عايزيين حكم مدني ويكون فيه تداول للسلطة ورقابة علي السلطة التنفيذية ___ رقابة حقيقة مش رقابة سيد قراره وفتحي سرور اللي داخل مجلس الشعب بالتزوير اصلا<br />انا مش خايف اللي من الاخ بتاع الخروج عن الحاكم تخيل لو ناس من عينته مسكت الحكم هتكون كارثة الكوارث<br />كل حاجه عندهم حرام حتي الديمقراطية حرام والمظاهرات حرام والاضراب حرام والاحزاب حرام<br />الحلال بس طاعة الحاكم .....<br />بس بعيد عن شنبك .....انت وهوه ..... الوهابية ملهاش مكان في مصر<br />انتم التطرف الديني الذي يقابل التطرف العلماني<br />لكن اغلبية الشعب تميل الي الاعتدال ولن تنجحوا فيما فشل فيه شيوخكم في الماضي<br />***** هو انا بقول ايه .... يظهر النقص في امدادات سندوتشات البغل اثر علي اتزاني العقلي<br />ربنا يرجعك لينا بالسلامة يابغل..... انت منقذنا في زمن عزت فيه الفراخ واللحمة"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132118/http://masr.20at.com:80/newArticle.php?sid=15125"

