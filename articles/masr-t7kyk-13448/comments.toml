author = "ما هو انتي مش محترمه"
posted = "2009-09-15"
text = "ما هو انتي مش محترمه<br />لو انتي محترمه كان جالك عرسان كويسين<br />ـــــــــــــــــــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
