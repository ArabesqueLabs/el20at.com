posted = "2009-09-15"
text = "اتريقي اتريقي على العرسان<br />وعلى راس المثل الخليجي<br />اللي ما يطول العنب حامضن عنه يجول<br />يعني اللي مش طايل العنب يقول عليه حامض<br />اتريقي على العرسان اتريقي وفشي غلك يا ام العوانس"
