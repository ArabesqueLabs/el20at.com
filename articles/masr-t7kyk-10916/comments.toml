author = "الى المعلق السابق"
posted = "2009-10-01"
text = "يا عزيزى دى طبيعة المرحلة التى تعيشها اليلد بحق وحقيقى<br />الزيارات للطلبة هتكون لسينما او مول او ملهى ليلى او صالة قمار فى فندق اثتثمارى او فندق اثتثمارى فية فتيات من اوكرانيا واسرائيل<br />طبعا انا مش جاحد ولا ناكر ان هناك اثتثمارات صناعية جبارة فى صناعة الشيبسى ابو شطة والشيبسى بطعم الليمون والشيبسى بطعم الفلفل والشيبسى بنكهة الدجاج<br />واحنا كدة كويسين قوى<br />هنوجع دماغنا زى ايران ونعمل مصانع صواريخ والا محطات نووية والا نستهيف زى الصين وننتج فانوس رمضان وسجادة الصلاة واقلام رصاص واقلام حبر<br />احنا كدة زى الفل"
