subject = "وبعض المدارس استدعت راقصات  للرقص فى المدرسة"
author = "ابو مصطفى"
posted = "2009-01-10"
text = "طبقا لخطط اصلاح التعليم يتم تجهيل الجيل الجديد بتاريخ بلدة ونزع روح الاعتزاز والوطنية من دمة<br />وطبعا غرس الروح الاستهلاكية وليس الانتاجية فى طباعهم<br />زمان كان فية حاجة اسمها الزيارات للوحدات المحلية وزرنا مصانع عمل الصابون ومصانع البيبسى والغزل والنسيج<br />انما نروح السينما نتفرج على فيلم الحمار ابو بردعة واغنية با احبك يا حمار<br />ا"
