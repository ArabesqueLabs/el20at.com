text = "السلام عليكم<br />في البداية المقال رائع جدا.<br />كلام هذا الداعية ياخذنا للقناة الفضائيه الاعلانية التي تاخذنا الى الجنة والتى باتت منبرا ليس لدعاة الاسلام وانما اشخاص يروجون للعادات والتقاليد التى نشءوا عليها ومنها التعامل الدوني مع المراة ومن اوضح صوره النقاب وانا لن اخوض في شرعية النقاب ولكن اقول ان اي دولة تحترم حق المواطن في الامان ستحكم بمنع النقاب وكفانا سترا لخاطفي الاطفال والزناة والزانيات والمتسولين النقاب ليس الا (سلو) منتشر ببعض البلاد."
