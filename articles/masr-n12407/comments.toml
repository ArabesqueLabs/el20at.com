[[comments]]
order = 0
subject = "مفتى اية ومين عينة"
author = "واحد منغاظ"
posted = "2007-11-12"
text = "انا مفروس من كلام الراجل اللى الحكومة بتقول علية مفتى<br />دا لا مفتى ولا حاجة دا رجل خريج تجارة مالة ومال الافتاء<br />يمكن علشان مربى دقنة ولابس عمة او همة لبسوها لة علشان يمثل علينا دور المفتى<br />فضحنا فى مشارق الارض ومغاربها<br />اللة يلعن اللى عينة واللى اختارة<br />ربنا ياخد العصابة دى كلها"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113113747/http://masr.20at.com:80/newArticle.php?sid=12407"

[[comments]]
order = 1
subject = "فعلا حسبى الله ونعم الوكيل"
author = "مش مهم"
posted = "2007-11-13"
text = "للمفتى ولحكومه النا س اللى فوق دول مش حاسين ولا عمرهم هيحسوا بالناس الغالبه هيحسوا بيهم الزاىوهم فى قصور مشيده هى البلد دى كده الغنى بيزيد غنا والفقير بيزيد فقر وربنا يرحمن برحمته الواسعه"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121132708/http://masr.20at.com:80/newArticle.php?sid=12407"

[[comments]]
order = 2
subject = "قفلها المفتى"
author = "abu osama"
posted = "2007-11-15"
text = "يعنى ايه يا عم المفتى اللى يسافر هيروح النار طيب ماهو اللى مسفرشى قاعد فى نار سيدك حسنى<br />لا بس ربنا ارحم بعبيده من حسنى اللى استعبدنا الا اذا كان معاك مفتاح النار ."
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121132708/http://masr.20at.com:80/newArticle.php?sid=12407"
