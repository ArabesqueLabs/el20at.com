[[comments]]
order = 0
subject = "اخص عليكو يا عشريناتيه ..كده و لا تعليق"
author = "نيفين نيفى نوفا"
text = "كده و لا تعليق على اعتزال النجم وليد صلاح الدين الجميل لعبا و خلقا<br />هتشمتو فينا اخواننا الحلوين اصحاب الفانله البيضاء<br />المهم الماتش كان تحفه و نقدر نقول شهد حضور مميز لحازم امام وحسام حسن و ميدو اللى(الحق يقال) سجل هدف تاريخى و رائع وطبعا حبيب الملايين تيرى هنرى<br />كمان الماتش بين ان تامر حسنى مكدبش لما قال انه لو مكنش كمل ف الغناء كان هيبقى لاعب كره مميز<br />و لم يفسد جمال اللقاء الا سعد الصغير و الطفل المعجزه خالد الغندور<br />ما علينا<br />اتمنى كاهلاويه صميمه ان النادى يستفيد من وليد اداريا زى ما استفاد منه مهاراتيا قبل كده<br />و علقو يا اهلاويه عيب كده"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034321/http://masr.20at.com:80/newArticle.php?sid=10270"

[[comments]]
order = 1
subject = "رغم كل المشاكل"
author = "البرج"
text = "والله يانفين مش عارف اقولك ايه احنا رغم كل المشاكل اللي بنتكلم فيها كل يوم الا اننا كمصريين عموما واهلاوية خصوصا مش بننسي حبيبنا اللي طبعا منهم وليد صلاح الدين ويارب احمد شكري اللي شفناه امبارح يكون خلوق وحريف زيه"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034321/http://masr.20at.com:80/newArticle.php?sid=10270"
