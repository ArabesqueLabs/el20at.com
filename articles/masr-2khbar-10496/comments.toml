text = "و احد من الخولات النسوان بتوع الجماعة اياها اللى ما تتسمى اللى اسمها(المحظورة)<br />متضايق من النصارى و الصليب؟<br />بالذمة دة يبقى اية؟؟؟؟؟؟؟؟؟؟؟<br />أكيد أكيد أكيد دة يبقى خول من اللى بينكحوا من الشواز السعوديين اللى بياتوا لة لمعاشرتة فى مصر<br />اتفوا على ام ابوك يابن المرة المنكوحة<br />لا تفرح بجلد ابناء و طنك الاطباء المتعلمين يابن المة الزانية؟<br />ملعون ابوكم فى الارض كما انتم ملعونين فى السماء<br />على فكرة لو كان هؤلاء باسرائيل و ليسوا بالسعودية لما كانوا قد أهينو او حتى جلدوهم<br />(أسرائيل) احسن مليون الف مرة من( السعودية)<br />موش كدة و لالالالا أية؟"
