[[comments]]
order = 1
subject = "قرار غبى"
author = "سنقر"
posted = "2008-11-13"
text = "واضح ان اللى طلع القرار ما يعرفش اسواق العمالة فى دول الخليج<br />فية العمالة الهندية وهم الاغلبية وخصوصا فى المهن الطبية والممرضات فليبينيات ودكاترة باكستانيون ثم الاخوة الفليسطنيون والشوام والعراقيون اخيرا وبكثافة<br />والمصريون غير محبوبون لانهم بيكذبوا وبينافقوا كتير وبيضربوا ذنب فى بعض لان تربيتهم مش ولا بد<br />فهذة الدول لا تهتم<br />عندها بدائل افضل بكتير جدا<br />واللى هيخسر المصريين والعمالة المصرية<br />وانا اعتقد ان الدكتور المدان كان بيجامل ويتقرب من الاسرة وينفذ كل طلباتها ولو كان دكتور هندى كان التزم بالتعليمات وان طردتة الاميرة مش مهم - المهم يحافظ على كرامتة وعلى مهنتة<br />انما الفهلوة اللى عند بعض المصريين وانة خلاص هيحط الاميرة فى جيبة ويمشيها زى ما هو عايز فدة شغل لا مؤاخذة يتحمل هو ذنبة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "(المعاملة بالمثل)"
author = "ممدوح زكى زخارى جرجس_الحزب الو"
posted = "2008-11-14"
text = "لو كانت لنا من الشجاعة و الكرامة على معاملة رعايا المملكة العربية السعودية بمصر بنفس العقوبات<br />لكان هؤلاء السعوديين الكلاب احترموا المصريين و ادميتهم<br />ليس السعوديين بل اقربائهم و ابناء عمومتهم من رعايا الدول العربية الاخرى ايضا؟<br />لكن معلش الكلاب طول عمرهم سيظلوا كلاب و سخة<br />حتى و لو كانو ملوك و امراء و شيوخ<br />معلش فهم من سلالة عملاء الانجليز الخونة<br />و التاريخ خير شاهد<br />الف مليون اتفوا على العرب عامة و على السعوديين المخنثين و الشوازخاصة ملوك و امراء و شيوخ و اميرات و اتباع و معرصين و جوادين و مخنثين سواء كانوا حكومة او حتى شعب من الرعاع ؟<br />لك اللة يا مصر"
archived = "2010-03-14"
capture_url = ""

