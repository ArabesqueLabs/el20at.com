[[comments]]
order = 13
subject = "القضاء والشريعة فى المملكه العربيه السعوديه خاص لن"
author = "السيد أبراهيم حسانين"
posted = "2008-11-18"
text = "بسم الله الرحمن الرحيم ولا أبدآ بقولى غير بذكر المولى عز وجل<br />أقولها وبصراحة العباره عن الموقف المصرى أتجاه الجاليات المصريه بالخارج وبالذات بالدول الذى يقولون عليها الشقيقه وهى الدول الذى نتبع كلاهنا كلمة لا اله الا الله محمد رسول الله مع احترامى للأخرين من الديانان الاخرى هل من حق شخص يتحكم فى شريعة الله فى العالم باكمل غير من لا يتقى الله والشريعه وفى أى شريعه يتم الحكم بالسجن والجلد أكثر من 79 وسبعون جلدهأليس من حق القضاء السعودى الحكم الصادر من محكمة جدة الجزئية ضد الطبيب المصري رؤوف محمد العربي<br />الذي قضي بحبسه 7 سنوات وجلده 1500 جلدة<br />تنفذ بواقع 70 جلدة كل 10 أيام<br />مطالبة بضرورة أن تتخذ الدولة<br />موقفاً صارماً إن المواثيق الدولية لحقوق الإنسان تمنع حكم الجلد<br />وتعتبره عقوبة حاطة بالكرامة الإنسانية إهانة لمصر ولشعبها حيث أنالحكومة المصرية تشعر بالضعف في تعاملها مع المملكة العربية السعودية<br />مما يعطي الفرصة لها ولغيرها من دول الخليج بالذات<br />لإهانة كرامة المصريين هناك وفى ذلك الامر الشنيع والبشع من السعوديين والمملكه الذى يقال عنها مملكه ولكنها مدعكه وحصل نفس الموقف مع بعض من الاخوه الاجانب الاوربيين وهم من يستحق ان يقال عنهم أخوه لنا وليس العربى اللعين فى مملكة المهاليك حيث حصل ولقد حدث من قبل أن صدر حكم مماثل داخل المملكة بجلد بعض الأوروبيين<br />ولكن السعوديين لم يستطيعوا تنفيذه بسبب التدخل الشديد الذي حدث من أوروبا ونشكر حكومتهم الذى تافع عن ابنائها وليس الحكومه الذى تقف متكتفة الايدى واذا حتي لو ثبت أن الطبيب المصري مذنب<br />فلا يجوز للمملكة جلده<br />لأن الجلد يندرج تحت بند التعذيب لا العقاب أما عن النظام القضائى التشريع السعودى فله عده مشاكل كبيرةمع منظمات حقوق الإنسان العالمية<br />وأنهما بعيدان تماماً<br />عن مواثيق حقوق الإنسان ومن الارحج والمفروض ان تكون فى وقفه من الحكومه نفسها أتجاه الأسلوب البذئى الذى يتعاملون بها مع المصرين فى دول الخليج هل تقبل الحكومه المصريه أن تسيطر على نظامها حكومه وشعب لا يعرف القانون والمواثيق الدوليه بل ومن جهة نظرى اذا أطلقت عليهم السعوديين ومن مثلهم حيوانات فكلمة حيوان تحترم لان الحيوان يفهم ويحترم من يعمل معه شئ أذا اعطيتة شئ يتذكر اما هم السعوديين والتشريع والقانون البزيئ وهو القانون السعودى الذى لايعرف له قانون ولا تشريع فى الاديان السماويه شئ بل تشريع فى مصالح شخصيه وأرضاء أميرات عاهرات وملك ومملكه فاسده بكل ما فيها من بشر أذا كان فيها بشر فكيف يحكم على طبيب مثل هذا الحكم الشنيع وأين منظمة حقوق الانسان المصريه والعالميه والانتربول المصرى ولما لم يتم طرد السفير السعودى من مصر وسحب السفير المصرى من السعوديه وقطع العلاقات كمثل ما فعلت معنا الوله الذى تحترم منى شخصيا بحفاظها على الموجودين بها سواء من أهلها أو من دوله أخرى وعلى سبيل المثال قضية سوزان تميم لماذا لم تفعل مصر وحكومتها كما فعلت دبى وتهديدها أم نحن كمصريين ليس لدينا نخوه وليس لدينا من يرعنا خارج بلادنا أذا كان هذا صحيح فمن الكون ان تفعل ذلك أستالتها علنآ حتى يعرف العالم ما حدث من الحكومه أما إذا كانت السعودية تهدد بقطع العلاقات فهذا لا يضر مصر بشئ نحن لا نخسر بل نكسب نكسب أولا الكرامه والعزه ونكسب أبنائنا وخبراتهم المتعدده فى ذلك الحين الذى تتعررض له من من أستثمارات وتطرات فى كل المجالات المختلفه<br />أما أذا كانت المنظمة المصرية لحقوق الإنسان قد أعربت عن قلقها البالغ إزاء الحكم على الطبيب المصري بالجلد مطالبة السلطات السعودية بعدم توقيع عقوبة الجلد عليه إعمالا للمواثيق الدولية المعنية بحقوق الإنسان التي تحرم العقوبات البدنية<br />كما أكد عدد من علماء الأزهر رفضهم الشديد لتطبيق هذه العقوبة على الطبيب المصري، مؤكدين أن هذه العقوبة مغلظة بشدة ولا أساس لها في الإسلام وأنها تعادل نحو 20 ضعفا من تطبيق عقوبة شرب الخمر<br />هذا الحكم يخالف أحكام الشريعة الإسلامية التي لا تقضى فى كل الأحوال بحكم الجلد بأكثر من عشر جلدات بشكل اجمالى وان 1500جلدة رقم مبالغ فيه، وزيادة حد الجلد عن عشر جلدات لا تكون إلا فى حالات الضرورة القصوى وهى الاعتداء على حدود الله.<br />أما السفاره السعوديه بالقاهره فمع ذلك تدافع بشده عن المملكه فكيف هذا وفى أى دين وشريعه أهذا الملك العين البذيئ الحاكم بأمر الله ولو كان الحاكم بأمر الله ما كان هذا الحكم حصل وبالطريقه البشعه هذه أذا لم تتذكر المدعه السعوديهوالذى يقولون عنها العربيه بل ألعن من العبريه حاليا فى الاراضى الفلسطينية قبل ذلك حينما فعلت فى وقت سابقوأصدرت أحكام أحكام في الفترة الأخيرة ضد الوافدين في السعودية؛ ففي ديسمبر 2006 نفذت في الطائف حكما بجلد طبيب أطفال من جنسية عربية داخل مبنى مستشفى الملك عبد العزيز التخصصي وسط حضور عدد كبير من الموظفين والأطباء؛ بعد صدور حكم قضائي بجلده لإضراره بسمعة طبيبة تعمل في المستشفى<br />وصدر الحكم بالجلد داخل حرم المستشفى؛ لرد اعتبار الطبيبة المتضررة، إضافة إلى ترحيله عن البلاد لإخلاله بميثاق مهنته<br />وفي يوليو 2008، أكدت محكمة استئناف حكما بجلد وسجن باحث في الكيمياء الحيوية وطالبة كان يشرف على رسالتها الجامعية، بعد اعتبار علاقتهما البحثية \"ستارا لعلاقة على الهاتف كما يقولون وحكم عليه في 2007 بالسجن 8 أشهر، والجلد 600 جلدة، وعلى الطالبة بالسجن 4 أشهر والجلد 350 جلدة؛ بتهمة إقامة علاقة عبر الهاتف، قالت المحكمة إنها أدت إلى طلاقها من زوجها وكان المستشفى الذي يعمل به الباحث، ويقع في الباحة جنوب غربي المملكة، قد كلفه عام 2002 بالإشراف على رسالة الطالبة التي تعدها في جامعة الملك عبد العزيز بمدينة جدة<br />وكانت السيدة قد حصلت على الطلاق في عام 2004 بعد 7 أشهر من زواجها، فرفع الزوج دعوى قضائية يقول فيها إن اتصالها مع المشرف على الرسالة هو ما أدى إلى الطلاق فكيف تكون بلد كهذه تحمل رايه وشعار يكتب عليه أشهد أن لا اله الا الله وان محمد رسول الله اللهم انى أسآلك رد القضا ولكن أسآلك اللطف فيه فمن المفروض الان تحمل السعوديه شعار الملك والاميرات وبنات الزوات ومخالفة التشريح السماوى وكله على حسب رضاء \"المداعيك\" عفوآ المماليك"
archived = "2010-03-14"
