text = "عجبآ عليك يا زمن فى زمن عجيب زمن تلاقى الكلب أنقلب لديب ولو ضاقت الحال بيه يلف ويعمل حبيب<br />سا أخ سنقر على الرغم انك موش سنقر حا احترمك ومحردش عليك بالاسم اللى يلقيق بيك بس أحب اوضح ليك شئ بس أنتم وكل العرب بلا أستثناء وخاصه رجال العرب يكرهون الرجال المصريين لماذا تكرهون المصريين ؟<br />أنا أجاوب السؤال دا علشان أنتم اعفن ناس على وجه الارض وأحكر وأزبل ناس عقليات متخلفه أبدى متقول وتشكر فى العماله الاجنبيه فى بلدك شكر فى العماله اللى أساسها سعودى حتقولى أنك ما بتشتغلوش علشان اللفوس اللى عندكم والمال والعزه اللى انتم فيها دى فأبشر يا سنقر افندى إن الله لا يغفل ولا ينام فى مثل يوجد فى مصر ويقول أذا نسيتم اللى جرى هاتوا الدفاتر تنقرى نص للزمن اللى فات من كام سنه وشوفوا حالكم كان ازاى والدوله ما تنحسبش دوله الأ بالعماله والايد العامله اللى فيها والتطوير بايد أبنائها موش الأطبه والممرضات والباكستانيين ولا المصريين وهم أفضل واحسن من مليار سعودى على الرغم أنكم ماتسوو شئ فى سوق الاحذيه بالنسبه ليا كمصريين ولا اى دوله فى العالم كمان موش أنتم بس قولى أنتم بتجيبوا ناس تشتغل عندكم ليه لانكم أغبيه حماء حساله مفيش عندكم أنسان يقول انا طبيب ولا غير انتم مجرد كلاب أغبياء فهذا المستوى المعيشى والتعليمى عندكم وليس أكثر من ذلك يا حمـــــــــــــــــــــار<br />مع احترامى للحمار لآنه بيفهم عن الملك بتاعكم يا حسالة المجتمعات العالميه احسن ما تفتخر بالعماله الاجنبيه فى بلدك افتخر بأهل بلدك الاول أنتم ليس من يحق لهم النهوض بالعالم أنتم يحق ان يطلق عليكم حثالة العالم فقط ويكفيك هذا"
archived = "2010-03-14"
