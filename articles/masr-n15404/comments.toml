order = 0
subject = "عايزين تعملوا ثورة ليه"
author = "مش ضروري"
posted = "2008-04-24"
text = "طول عمر المصريين بيدفعوا ضرايب وجباية واتاوات واكراميات وتفتيح مخ<br />من ايام خوفو وخفره ومنقرع ورمسيس لغاية حسني مبارك<br />عايزين تعملوا ثورة ليه بقى<br />ما هم الضباط الاحرار عملوا ثورة ومشينا معاهم<br />والضرايب زادت والسجون زادت<br />يا مصري ريح نفسك حتعيش مصري وحتموت مصري<br />تدفع وبس"
archived = "2008-04-26"
capture_url = "https://web.archive.org/web/20080426023902/http://masr.20at.com:80/newArticle.php?sid=15404"
