subject = "عمر الشريف"
author = "ايمى"
posted = "2007-06-04"
text = "من اكثر الشخصيات التى انبهرت باسلوبها فى الحياه عمر الشريف ليس لشكله ولا لمظهره ولكن لطباعه التى اعشقها ولكن لاول مره اشعر انى مختلفه معك فانت تعشق الحاكم الفرعون وترى فى مبارك هذا ولكن مبارك لا يستطيع فيكفينا اننا مازلنا نفتخر بعصر الفراعنه وانهم اصحاب حضاره عظيمه اما مبارك الفرعون الذى تراه يا استاذ عمر خلا دول ملهاش لزمه تبصلنا من تحت اوى وخلانى بقى بيصعب على انى مصريه ومش فخوره حتى بده لان ملناش دور وكمان انت شايف نجاد وابن لادن من زاويه سيئه وفرحان اوى بكلينتون اللى اتعزمت عنده كلينتون اول من ضرب العراق ثم من بعده بوش انا ندمت انى قريت كلامك لانى كنت بشعر ان شخصيتك احب الشخصيات لى ويمكن الشئ اللى اتفق معاك فيه هو حريه العقيده لان ده مبدأى فى الحياه لان فعلا المسيحى مش مذنبه ان لازم يعرف ان القران رساله مش محمد اللى مؤلفه هيعرف منين محدش كان بيقتنع بكلامى لما اقول كده ويعتبرونى كافره ولكن بصراحه ارائك السياسيه سخيفه لدرجه كبيره يا عمر افضل شئ ان تمتنع عن الاحاديث"
archived = "2007-06-08"
