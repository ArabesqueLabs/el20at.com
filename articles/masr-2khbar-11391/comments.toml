subject = "البطالة 7 % يا اخى قحة - البطالة لا تقل عن 40 %"
author = "فيكى فيكى انت صديقى"
posted = "2009-02-24"
text = "المصادر الرسمية بتقول 7 % بطالة - يعنى التوظيف عندنا احسن من المانيا واعلى من فرنسا<br />سبع قحات وفوقهم شخرة<br />اركب المترو الساعة السابعة صباحا وقت الذهاب للعمل واركبة الساعة الحادية عشر صباحا والثانية ظهرا<br />مفيش احد بيروح شغل - فى كل الاوقات المترو مليان زحمة موت وكلهم شباب - يبقى بيشتغلوا امتى - والا يمكن بيشتغلوا فى الازرق<br />اتلبطالة لا تقل عن 40 فى المية واللى بيشتغل بيشتغل وظيفة هامشية بدون اى عائد انتاجى<br />عن نفسى يا ريت اى احد يعطينى الجنسية الصومالية<br />واظن ال 70 شاب اللى عايزين يخلعوا الجنسية لو الباقى قدر يخلع هيخلع<br />لان الطريق مسدود والمستقبل اسود ومفيش اى فايدة الا اذا ربنا بعت زلازل بقوة 50 ريختر وجابت عاليها سافلها ويمكن يطلع جيل يقدر يعمل اى حاجة"
