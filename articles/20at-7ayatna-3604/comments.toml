[[comments]]
order = 8
subject = "ماذا لو لقيت الفرشاه اصلا"
author = "هوووووووووبه"
posted = "2007-04-19"
text = "انا نفسي ارسم لوحه فيها كل الالوان مشخبطه كدا متعرفيش مرسومه ليه حاجه كدا شخبطاطه بكل الالوان بجد ولو لوحه تانيه واحده محجبه في غربه وسط punker ,وهي وسطهم شكلها غريب زي يعني كدا ممكن كمان لوحه<br />واحده بتعيط محدش يقولي اني مساويه بس بجد بتعيط ووراها نافوره ميه تتلااء المياه مع قطرات دموعها حاجه كدا كابه معرفش ليه نازله كابه اليومين دول يمكن عشان الامتحانات \"ادعليي يا نوفا \" . وعموما احسن اللوحان الللي بحبها اللي بتكون بالقلم الرصاص بس من غير الووان خالص رصاصي يعني , وتكون لوحه عن قفه ايوه قفه مش بدودوه حاجه كدا<br />فيها ريحه مصر واحده لبسه هدوم ريفيه ومعها قفه علي راسها حاجه من الريف يعني ,اما بالنسبه لنوفا فحب اقولك ان<br />الصور الكايبه دي بتاخد جوائز عالميه زي صوره الطفل اللي كان قاعد بيدور علي اكل وجنبيه صقر مستني موته وغالبا بتاخد<br />اجمل صور لعام 2006 او 2005 . اما بخصوص اميلك وصلني يا جميل ونلتقي بعد الفاصل ان شاء الله بس جرينتش يزط مره<br />كمان ان شاء الله"
archived = "2010-03-14"
capture_url = ""

