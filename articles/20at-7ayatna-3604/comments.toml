[[comments]]
order = 1
subject = "ماذا لو ضاعت الفرشاه؟؟؟؟؟؟؟؟؟؟؟"
author = "نيفين نيفى نوفا"
posted = "2007-04-16"
text = "الله عليكى يا منى<br />فكرتينا بالذى مضى<br />كنت برسم و اعرض لوحاتى بس خلاص لاسباب ما تاهت الفرشاه<br />انشغال دراسه متاعب حياه<br />بس لو هرجع ارسم هرسم لوحه فيها فناجين قهوه و صحاب كتير بيتكلمو و يهزرو و دول هيبقو ال focus ف اللوحه<br />اما ف الخلفيه و اللى هتكون بالوان باهته فهى لبنت واحده من الاصحاب دول<br />لوحدها ف مكان بعيد و بتدور عليهم و بتتجه نحو بقعه ضوء بعيييييييييييييييييييده ممكن البقعه الضوئيه دى تبقى اصحابها<br />او حبيبها او حلم<br />و ميعرفش اللى بيشوف اللوحه هتوصل و لا لا لانها هتكزن ف المنتصف بين مكان مظلم و مكان بقعه الضوء<br />فهمتو حاجه<br />انا نفسى لسه مش فاهمه<br />عموما الموضوع جميل يا منى<br />و خلينى اقوللك حاجه طريفه ان ابدع صوره شفتها ف حياتى كانت صوره لطفل بائس مشرد ممزق الملابس انكسرت منه جره كان شايلها و كانت هى امله الوحيد و قعد يبكى جنبها و لحد دلوقتى معرفش مين صاحب اللوحه دى لو تعرفى او حد من القراء اتعرف عليها من وصفى لها يا ريت يقوللى"
archived = "2010-03-14"
capture_url = ""

