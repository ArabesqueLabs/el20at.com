text = "تعرفى يا منى موضوعك دا ناجح ليه<br />علشان الكلام اللى بيطلع من القلب بيدخل القلب لكن اللى بيطلع من اللسان لا يتعدى الاذان<br />و قلمك دا قدر يلمس حته موجوده جوا قلب كل واحد فينا<br />حته طفوليه جميله متقدرش كل هموم و مشاكل الحياه انها تمحيها او تغيرها<br />و بالنسبه لهبهوب اوكى يا جميل وانا مستنيه على المسنجر و نبقى نكمل كلامنا<br />ربنا معاكى يا هووووبه"
