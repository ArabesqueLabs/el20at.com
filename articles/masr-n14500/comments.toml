subject = "عملية السلام والبدنجان"
author = "----"
text = "رايس جاية تقول تعليمات للصبيان بشأن مؤتمر القمة المزمع اقامتة فى دمشق<br />هتقول لهم - شوفوا ياحبايبى مين اللى يروح - ومين اللى يعمل زعلان - وتكلموا فى موضوع لبنان وتختاروا رئيس لبنانى يساعد فى نزع سلاح حزب اللة - ويجيب ابن الحريرى رئيس وزاراء مكان ابوة<br />انما نتدارى وراء السلام والكلام البدنجان والفلسطنيين - فحل ذلك مش عند مبارك - لا - عند اولمرت"
archived = "2008-03-06"
capture_url = "https://web.archive.org/web/20080306021045/http://masr.20at.com:80/newArticle.php?sid=14500"
