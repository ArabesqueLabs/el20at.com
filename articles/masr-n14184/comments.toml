subject = "أنا كنت هناك"
author = "عايش مع إيقاف التنفيذ"
posted = "2008-02-13"
text = "أنا أول مرة أتفرج على ماتش في أي حتة غير أصحابي أو البيت اتفرجت على الماتش في شارع جامعة الدول العربية بصراحة كان المنظر تحفة أنا ما كنتش متخيل الأعداد اللي أنا شفتها وقعدت أصور بالموبايل فيديو وصور حوالي ساعتين وبعد كده مشيت علشان كان عندي شغل الصبح بس كنت مروح وأنا نفسي عماله تراودني أروح البيت ولا أكمل الليلة هنا"
