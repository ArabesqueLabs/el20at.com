subject = "تجب المقاطعة"
author = "محمد عبد السلام"
posted = "2008-08-09"
text = "من يقولون أن المقاطعة تقطع أرزاق بعض الموظفين العرب هذا كلام مردود عليه لأنه في جميع الأحوال فإن الشركة العربية التي تحمل اسم شركة أجنبية فإن الشركة الأجنبية مستفيدة كذلك من المبيعات فأنت تفيد الشركة الأجنبية ماديا ثم إنه حتى وعلى افتراض أنها لاتستفيد أليس من الأفضل ألا نروج لأشياء مشينة وعلى الذي يتولى توكيل هذه الشركة أن يغير نشاطه"
archived = "2010-03-14"
