[[comments]]
order = 2
subject = "تبا لهؤلاء الشواذ اللعينين"
author = "الشيخ الشكسي"
posted = "2008-08-03"
text = "أنا أوافق الأخ حمد العقيلي , و أنا وصلني من مصدر موثوق أن ماكدونالد (لعنهم الله) لا يدعمون الشواذ فقط بل إن فروعهم في المملكة تقيم إحتفال صاخب كل ليلة جمعة (مع العلم أنها ليلة فضيلة) يدعون إليه كل الشواذ و السحاقيات و اللوطيين و اليهود و الشيوعيين (و كل هؤلاء حليقو اللحى و العياذ بالله ) و يحدث في هذا الحفل الكثير من الشرب و تعاطي المخدرات و التعري و ما يتبعه . لذلك علينا جميعاً أن نقاطع بؤرة الفساد هذه .<br />و السلام عليكم و رحمة الله و --1648 و بركاتهما ."
archived = "2010-03-14"
capture_url = ""

