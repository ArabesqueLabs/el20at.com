text = "أتفق مع رأي مصطفى الدوسري فعلى الشركة الموجودة في المملكة إصدار بيان يتبرؤون فيه مما فعلته الشركة الأم<br />وأن يبذلوا جهودهم لتوضيح مغبة تلك التصرفات للشركة الأمريكية"
