subject = "موظفين اية ------------- شوية زبالة يستحقون الطرد"
author = "اكتب اسمك هنا"
posted = "2009-03-01"
text = "البلد الوحيد فى العالم اللى تقف فية امام الموظف باوراقك كاملة ثم ينظر فى وجهك فى قرف ويقول عدى علينا بكرة او تعال بعد اسبوع<br />ولما يكون الحاجة مستعجلة ابسط حاجة يقول لك تعالى بعد ساعة<br />الوقت دة بتاع الناس مش مهم ابدا عند الموظف<br />انا اقترح لجنة تشكل ويتم مراقبة الموظفين واى واحد بيأخر معاملة الناس يطرد الى الشلرع فورا<br />بجد لما تتعامل مع الموظفين فى مصر تصاب بالقرف"
