posted = "2009-02-08"
text = "في التعليق مكتوب<br />كان اغلب اهالي المنطقة يعملون في صناعة الفخار.. ثم اصدرت الحكومة قراراً بنقل مصانع الفخار الى منطقة اخرى وهدم الموجودة حالياً مما شرد عشرات الشباب والرجال الذين يعولون عشرات الاسر..<br />يا سلام على الحكومة الرشيدة والحزب الوطني والتنمية والدخول الى القرن الـ 21<br />يا سلام على الحكومة اللي بتشرد شعبها يا سلام عليك يا نظيف وعلى حلاوتك"
