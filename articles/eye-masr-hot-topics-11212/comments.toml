[[comments]]
order = 1
subject = ""
posted = "2009-02-07"
text = "اى مهانة تلك وصلنا اليها بعد 35 سنة تنمية<br />بعد ان بشرنا السادات ان كل مواطن سيحصل على يخت وفيلا وسيارة دفع رباعى بعد توقيع كامب ديفيد<br />وبعد ان نبذنا الحروب وقلنا مصر اولا<br />واضح اننا كنا ولا زلنا فى الفيرزر مجمدين ويجرى الهدم على كل الاصعدة<br />ارسلوا الصور للانروا يمكن يغيثوهم"
archived = "2010-04-18"
capture_url = "https://web.archive.org/web/20100418211108/http://eye.20at.com:80/masr/hot-topics/11212.html"

[[comments]]
order = 2
subject = ""
author = "مش بقره"
posted = "2009-02-07"
text = "بطن البقرة.. منطقة عشوائية في مصر القديمة خلف مسجد عمروبن العاص.. صادر لها قرار ازالة منذ زمن طويل ولم ينفذ.. تحتوي على قرابة ال 3000 اسرة..لا يوجد بها صرف صحي.. والحمامات مشتركة \"كل 5 او 6 اسر تشترك في حمام واحد\".. المياه لا توجد في جميع المنازل.. كل اسرة تتكون من 6-7 افراد في المتوسط يعيشون في الغالب في غرفة واحدة مساحتها قرابة 4*4 متر وهذا ما يعيش عليه اغلب الاسر هناك…<br />كان اغلب اهالي المنطقة يعملون في صناعة الفخار.. ثم اصدرت الحكومة قراراً بنقل مصانع الفخار الى منطقة اخرى وهدم الموجودة حالياً مما شرد عشرات الشباب والرجال الذين يعولون عشرات الاسر..<br />تنتشر في المنقطة الامراض الصدرية والجلدية نتيجة للجو الملوث فيها… بالاضافة الى ان الجزء الغربي من المنقطة يعمل بالكامل في جمع القمامة… كما يوجد مزرعة خنازير… كل ذلك اثر كثيراً على صحة اطفال واهالي المنطقة…"
archived = "2010-04-18"
capture_url = "https://web.archive.org/web/20100418211108/http://eye.20at.com:80/masr/hot-topics/11212.html"

