subject = ""
author = "اكتب اسمك هنا"
posted = "2009-02-07"
text = "واحد امريكانى شاف صورة زى دى المنشورة فوق على الطبيعة - شاف عشش وقاذورات الناس عايشة فى وسطها<br />وبعدين فى احد الجلسات<br />وانا بافتخر واقول لة حضارة 7 الاف سنة<br />ضحك ساخرا<br />ولا حضارة سبع ايام - المناظر دى ممكن تشوفها فى التاميل نادوا وقرى اعالى نهر النيجر حيث ياكلون القرود<br />فين التنمية - اى تنمية<br />مفيش حاجة خالص<br />احياء تشبة معسكرات اللاجئين بعد هروبهم من فلسطين 48"
archived = "2010-04-18"
capture_url = "https://web.archive.org/web/20100418211108/http://eye.20at.com:80/masr/hot-topics/11212.html"

