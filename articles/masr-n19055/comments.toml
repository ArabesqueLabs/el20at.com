subject = "الاخوان المتأسلمين"
author = "حسين كامل"
text = "مؤيد لقرار منع المؤتمر لان اللعبة مكشوفة ,, الاخوان المتأسلمين اصبحوا اليوم تابعين لايران مثلهم مثل حزب الله فى لبنان وحماس فى غزة والاوامر اتت للاخوان المتأسلمين بتقليب الشارع المصرى فى نفس التوقيت الذى دعى فيه المدعو حسن نصر القوات المسلحة المصرية للتمرد او بمعنى اصح للانقلاب ,, الاخوان المتأسلمين هم من يقفون خلف المؤتمرات التى تحدث وها ليست بؤتمرات بل مؤامرات على مصر وشعب مصر ,, وهنا اقول للاخوان المتأسلمين ما فائدة المؤتمرات هل ستمنع العدوان الاسرائيلى !! لو كنتم رجالا بحق لذهبت الى غزة للجهاد وكلنا نتذكر مرشد الاخوان حينما ناصر حسن نصر الله فى العدوان الاسرائيلى على لبنان وقال بعنترية ان الاخوان على استعداد لان يرسلوا 100 الف مصرى للجهاد بجانب حسن الله !! اليوم نقول لك يامرشد الاخوان ارسلهم الى غزة ولو كنت تجهل الطريق فاذهب الى العريش ومن هناك يمكنك ان تركب ميكروباص بالنفر الى رفح ومن رفح عندك عشرات الانفاق بين رفح وغزة ادخل منها وكافح وجاهد ام ان الجهاد عندكم شعارات وهتافات وصراخ وعويل !! كفاكم اونطه وضحك على الذقون ."
archived = "2009-01-03"
