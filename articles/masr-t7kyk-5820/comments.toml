text = "احب اقول لشرين منصور انة انسانة تفهة ومعندهاش ين واكي انة مش بياعة ولا حتة ابوها كان بياع احب اقولها انا اكبر حرام لما يكون واحد يحرم التانى من رزق وغير كدة البايعن حرام انهم يبايعو ذكرت فى القران دا الرسول صلى اللة علية وسلم كان تاجر لية كدة يعنى الورافق تخرب بيوتنا غلشان السياح طب ميوظفونا واللة انا اعرف انا مصر كلمة حرام المواض واللة مابيتعب قد البائع يروح يمضى وبجى وقبضة شغال مش حرام اة يا ابلة شرين اقسم ليكى لو شفتك لا اخذ فيكى اعدام لما الحكومة تمنعنا من الشغل ناكل من فين انتى هتيجى تصرفى عليا انا واسرتى وانتى بتكلمى عن سوريا ومش عجباكىلا منتى اكيد موظفة من بائع"
