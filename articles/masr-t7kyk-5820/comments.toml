order = 0
subject = "رموز الفوضى والتلوث"
author = "شرين منصور"
posted = "2007-05-10"
text = "السلام عليكم الموضوع حلو بس في تحفظ على طريقة الكتابة نوعا ما المهم ان الفكرة وصلت بصراحة انا مش فاهمة يعني ايه أن سوريا أجبرت البائعين على أنهم يفتحوا شرايط المطربة فيروز وكل واحد بأة يفتح الأغنية اللي عايزها ولا ايه مهو كدة ناحية وحدة بس اللي اتحسنت وهي انهم بدل ما يسمعوا اصوات تجيب الصداع المزمن وكل أنواعه حنسمع صوت يريح الأعصاب الا ان فضلت برضو الهمجية مهو لما كل واحد يفتح الاغنية اللي عايزها يبقى حنسمع دوشة والمفروض ان مقام المطربة فيروز اعلى من ذلك وأرقى بكثير بأن تستخدم وسيلة لهذا الغرض،أما بصراحة تحفظي على اللي على الموضوع وهو في الجزء التاني وهو لو طبق القرار ده في مصر حيكون مين البعض قال كاظم و تامر وعمرو دياب وغيرهم الذين تم ذكرهم في الموضوع يا جماعة دول فنانين راقيين على مستوى أعلى من ان تتحط شرايطهم في الشارع كوسيلة لاسكات البائعين ،،يا جماعة المشكلة في البائعين نفسهم احنا بلد سياحي المفروض الناس بتقول كدة يعني اي حاجة حتبقى واجه لمصر في الخارج يبقى لازم يطلع قرار بازالة وعقاب البائعين الجوالة كما حدث في الاسكندرية في عهد المحافظ الجديد عادل لبيب حيث شاهدنا اختفاء نسبة كبيرة جداااااااااااااااااااااااا منهم في شوارع الاسكندرية وخاصة في محطة الرمل والمنشية على سبيل المثال فانا بصراحة ضد ان يستخدم اي صوت من المغنين كوسيلة لاسكات الأصوات الغوائية والهمجية التي تجعلك تندم انك فكرت في لحظة الخروج لشراء شيء ما ،كما ان موضوع الباعة الجوالة موضوع كبير له جوانب عديدة منها نوعية البضاعة المعروضة التي أحيانا تخدش الحياء ومنها أصوات الباعة أنفسهم وجوانب اخرى عديدة ،فالباعة هم رمز للغوغائية والفوضى والتلوث البصري والسمعي"
archived = "2010-03-14"
