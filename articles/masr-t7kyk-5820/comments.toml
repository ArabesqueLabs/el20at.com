text = "فرحانة انة بتكلم عن البائعين مالهم البائعين بيااكلوة بالاحلال مش زيك اكيد انتى موظفة حكومية واللة اعرف انا معظم الموظفات نصهم بياكلو الحرام وبيستقبلوة ومب يعرفوش ربنا وبينهبو مثل الحرمية شرين حرام سيبى البياعين ياكلو عبش حرام حرام احنا اتعبنا احنا لو فى فلسطين هنقعد مرتحين عاوزة تحرمى الباعين من رزقهم روحى حسبى اللة ونعم الوكيل حسبى اة ونعم الوكيل من بياع زهق احب قول حاجة يعنى تامر حسنى وكاظم عجبينك اقوى عاوز تخربى بيت الباعين علشان مغنين واللة حرام اقول عليك انك يهوديو مش مسلمة وتعرفى ربنا تخربى بيت البائعين علشان تامر حسنى وكاظم طب دول الوم بيبقى فى ايداهم بالملاين ام احناى الللى بنعمل بيهم بنجيب اكل ونام احب اقولك ياريت تسكتى واعرف طريق ربنا وخليكى محضر خير وتقولين اننا ،فالباعة هم رمز للغوغائية والفوضى والتلوث البصري والسمعي يرضا ربنا كدة حرام عليكى سبينا ناكل عيش"
