subject = "لو كده يبقى فيروز"
author = "نيفين نيفى نوفا"
posted = "2007-05-12"
text = "طبعا فيروز جاره القمر و ست الكل<br />مين ميقولش فيروز<br />طيب يا ريت الواحد يسمعها و هو ماشى ف كل حته ف البلد سواء فيه بياعين او مفيش<br />نسمع سلملى عليه<br />ليالى الشمال<br />يا انا يا انا<br />انا لحبيبى<br />ع هدير البوسطه<br />يوووووووووووووووووووووووووه اقول ايه و لا ايه دى فيروز يا جماعه<br />اه بالحق نسيت اقول نسمع طبعا انا و شادى علشان هبهوب<br />مش كده يا بشر اقصد يا هووووووووووووووبه"
