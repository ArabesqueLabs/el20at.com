text = "انا عندي قصة حب كتير بتحزن نفسي احكيها اكتبها اخلي الدنيا كلها تقراها انا زهقت من حياتي جد اتعبت مين ما تعب زهق بس كتير اتعذبت بيحكو الصبرحلو ونا صابرة بس لا ايمتا ازهقت بحبو كتير والناس اها منهم ما بحبو حبنا لبعض كلهم ضدنا بنت فلسطين ......................عاشقت الاحزان جدجدجدجدجدجدجد بحبو كتيييييييييييييييييييير هو كتير ساعدني وتعب معي استحمل كل الاكلام الي تقال اتعبنا منو وزهقنا طرقنا كملنا بس حقول حاجة انا الفتها...لو يعر الناس مدة حبي اليك لتركو الكلام وصارو ملك ايديك ......................بحبو كتيييييير رناد بنت المخيم"
