[[comments]]
order = 0
subject = "لا رأى لك أصلا"
author = "أحمد المصري"
posted = "2007-06-12"
text = "سيدى لا رأى لك في الحجاب أصلان لأنك لست سيدة.<br />السيدة المحجبة هذه حريتها حتى و لو كان رمز لإسلامها كما هى حرية المسيحية في إرتداء و وشم الصليب كرمز لدينها التي تعتز به.<br />و المرأة المسلمة غير المحجبة هذا رأيها هى و لا ينتقص من دينها أو إحترامها و لا يحق لأحد فرضه عليها.<br />إذا إرتدت إبنتك الحجاب و منعتها فأنت متحجر العقل مثلك مثل من يحجب إبنته بالأمر.<br />إذا كان الحجاب مش عاجبك خلاص متتحجبش إنتة."
