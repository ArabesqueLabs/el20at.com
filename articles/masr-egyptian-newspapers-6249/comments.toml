[[comments]]
order = 1
subject = "يا ريت تخرس"
author = "ابو اسامة"
posted = "2007-06-16"
text = "اذا كنت لا تعرف يا اخى فان الله قد فرض فى قرآنه الكريم الحجاب<br />فاءذا قال الله شىء فلا راى لك بعد قول الله ويا ريت تخرس لن كلامك يا اما انت جاهل بالدين<br />يا اما انك تابع لدين آخر ومش عارف هو الحجاب بالنسبة لك بتعتبر ان الست بتلبسه موضة ولا ايه"
