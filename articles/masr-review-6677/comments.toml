[[comments]]
order = 2
subject = "أنغام رمز الرومانسية والرقي والطرب الأصيل.."
author = "شرين منصور ..معلقة دائما.."
text = "السلام عليكم أنغام من اسمها تعرف شخصيتها فهي تجسد انغام الحب والرومانسية والعتاب بطريقة راقية ،تحس فعلا انك في عالم تاني عالم طرب أصيل بس عصري جدااااا غير انها في الاساس انسانة محترمة و تحترم دائما جمهورها ومحبيها.. أما بالنسبة للشريط فابالرغم انها تتاخر اوي في انها تطلع البوم الا انها تقدر تخلي اغانيها تعيش وكانها لسة نازلة حالا،شريط كل ما نقرب كوكتيل رائع بصراحة معتبراه قصة صغيرة تحكي عن عالم الحب بما فيه من حب وعتاب واشواق متقدرش تقول ان الغنية دي احسن من دي بس أغنية مبحبش دي أغنية ليها وقع تاني خاالص فهي عبارة عن 2 كوبليه الا انها قدرت توصل معنى راقي وصورة واقعية عن البنات اللي بتتجرح ومش بتحب حد يبصلها بصة شفقة ،أما اغنية حتمناله الخير أغنية لاتعليق عليها لأن وصفها لن تكفيه بحور لكن بكل بساطة الأغنية ان ممكن يبقى لسة فيه ناس محترمة وبتحب برقي لدرجة انهم لما يسيبوا بعض بيتمنو لبعض الخير نادر اوي لما تلاقي كدة بس في ناس كدة فعلا،وغيرو وغيرو ..لو سمحت لي الظروف واسعفتني الأوراق والأقلام ولو كنت شاعرا كنت ملئت اوراقي شعرا واصفا أنغام .."
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082605/http://masr.20at.com/newArticle.php?sid=11042"

[[comments]]
order = 3
subject = "مذكرات مشبك غسيل"
author = "ريلاكس"
text = "مذكرات مشبك غسيل<br />الأربعاء<br />عشت في هذا البيت أكثر عمري ولا أعرف مكاناً آخر .. و يقول أحد اخوتي في كيس المشابك أنني ولدت في مكان بعيد عن هنا و أن أمي كانت قطعة خشبية كبيرة و أنني ولدت ولادةى قيصرية اتستخدمت فيها مناشير و قواطع و مبارد كثيرة جداً بالإضافة الى صنفرة خشابي !! و أنا لا أصدقه ، فهو حتى الآن لم يبرهن لي كيف عرف كل هذا !!<br />الخميس<br />النهارده يوم اسود ! و كل يوم خميس كذلك ، فاليوم يعود الأولاد من المدرسة مثل المجانين ليستحمو بعد أن يأخذو العلقة الإسبوعية ! ثم تبدأ ست البيت في غسل كل ما يقع تحت عينيها من ملابس ، ولا يكفي ( فوم ) واحد لغسيل الخميس ، بل أظل معلقاً على الحبل طيلة اليوم و اليوم الذي يليه !! و في إحدى المرات ظلت تغسل طيلة الليل الى صباح اليوم التالي ، فظللت على الحبل الى يوم السبت و أصبت بإلتهاب روماتيزمي حاد و صدأ في المفاصل ظللت أعاني منه لفترة طويلة !!<br />الجمعة<br />أما سعاد الشاغلة فشغلها طياري و يقرف .. و اليوم الذي تقوم فيه بمهمة الغسيل .. تخرج الهدوم من تحت يدها قذرة كما كانت .. و أظل مقروفاً و انا أمسك الملابس التي غسلتها على الحبل ! الله يقرفك يا سعاد ! حتى عندما حاولت أن أنتقم منها فعضضت إصبع قدمها الكبير ، لم تشعر بشئ الحلوفة !!!<br />السبت<br />اكتئاب السبت لابد منه فست البيت تستيقظ مهدودة من غسيل الخميس و فسحة المجعة ، و تنتهز فرصة ذهاب الأولاد الى المدرسة و زوجها الى الشغل حتى تبدأ بالرغي في التليفون حتى آخر النهار !!!<br />الأحد<br />اليوم حدثت خناقة بين أحد اخوتي و بين أحد المشابك البلاستيكية المتعجرفة زاهية الألوان ! و سبب الخناقة هي أن البيه المشبك الملون يريد مساحة أكبر من الكيس يفرد فيها فكيه !! لكن أخي كان له بالمرصاد ! و أنا أسمع حكايات عجيبة عن هذه المشابك البلاستيكية ، فيقال انها تولد في صورة سائلة و تصب في قوالب ، و يقال أيضاً انها تصنع من مواد مقرفة جداً و مضرة باليئة ، و هذا هو سبب نفوريمنها ، لم يقدر أخي على المشبك البلاستيكي فهو أكبر حجماً بكثير ، و عندما اجتمعنا عليه انضمت اليه باقي المشابك البلاستيكية و غلبنا ، لكني الآن أتحين الفرصة الملائمة للإنتقام ! ملعونة أيتها المشابك البلاستيكية ، سأريك أن مشابك الخشب ليست سهلة الهضم !!<br />الإثنين<br />أوقعني حظي اليوم في أن أشارك المشبك الملون إيان في حمل فانلة على الحبل ، و بعد أن فارقتنا ربة البيت استظعت أن أشنكله و أ,قعه من البلكونة في الخرابة الخلفية - و التي من المنفترض أن تكون حديقة المنزل - ضحكت كثيراً جداً أنا و أخوتي لكني نئت تحت حمل الفانلة ... و اتضح لي الآن كم هي ثقيلة ، خاصة لو عرفتم أنها لرب البيت و هو رجل ذو كرش عظيم .، و بعد دقائق سقطت أنا و الفانلة في حديقة العقار . و ما كاد البواب المقيم في الحديقة أن يلمحها حتى أخذ الفانلة و أخفاها لكنه نسيني أنا و المشبك الملون لنمثل دليلاً على الجريمة التي ارتكبها .<br />و عندما جائت ربة الكمنزل لم لتجمع الغسيل ... يبدو أنها لم تلحظ اختفاء الفالنة ، و لكنها لمحت المشبك الملون عندما انحنيت من الشرفة . و في الحال كان حمادة الصغير يهرول هابطاً السلم كأنما ضاعت منهم قطعة ذهبية !<br />و التقط حمادة المشبك الملون دون أن يلاحظ الأبله الصغير وجودي ، و كدت أصرخ لكني أدركت أن أحداً لن يسمعني ، و كان آخر مشهد رأيته هو المشبك الملون و هو يخرج لي لسانه قبل أن يغشى علي!<br />الثلاثاء<br />اليوم انضممت الى مجتمع جديد علي هو مشابك زوجة البواب . و هو مجتمع متمدن طبقياً بالنسبة للمجتمع الذي كنت أعيش فيه . صار بيتي الآنهو الصفيحة الصدئة التي تحتفظ فيها زوجة البواب بالمشابك !! أشتاق كثيراً للكيس البلاستيكي الجميل الذي كنت أعيش فيه ، و للهواء الذي يرد الروح و الذي كان ( يطس ) في البلكونة ليل نهار . الآن أمسك هلاهيل البواب و أولاده على سلك معدني ممدود في الخرابة الخلفية . و قد كتبت هذه المذكرات خصيصاً لتكون عبرة على غدر هذا الزمان ، الذي لم يترك أحداً دون أن يغدر به ... الإنسان و الحيوان و مشابك الغسيل !!!!"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082605/http://masr.20at.com/newArticle.php?sid=11042"

