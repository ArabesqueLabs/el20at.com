subject = "سونا اه سونا لا"
author = "سونا"
text = "يا مروه مش عارفه انتى ليه مبتعمليش حاجه عن تامر حسنى ولا عمري شفتك كتبتى اى كلام عنه مع انى بعشقة وبموت في وبالنسبة لي اجمد رجل في الدنيا ومفيش راجل ذيه اصلا وللعلم كل الرجالة بيغيروا منه موووووووت عشان هو قمر وستايل يا لهوى عليه يجنن."
