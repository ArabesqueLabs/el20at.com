[[comments]]
order = 0
subject = "الحسين شهيدا"
author = "مدحت"
text = "نحن فى مصر نحب اهل البيت جدا ولكن لسنا مغالين فى حبهم مثل الشيعه عليهم اللعنه<br />وسيدنا الحسين له فى قلب المصريين من الحب الكثير<br />وولكن نحن لانوافق على مايحدث فى هذه الموالد من مظاهر مخجله<br />من تفقير وحاجت كدا ملهاش لزمه"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519061232/http://masr.20at.com:80/newArticle.php?sid=10253"

[[comments]]
order = 1
subject = "خزعبلات و جهل"
author = "واحد من الناس"
text = "المولد و ما ادراك ما المولد و الزحمة و اللى بيحصل فيها و الطريقة البيومية و الفيومية و المهلبية و قمة الجهل فى القرن الواحد و العشرين و الحسين و اهل البيت الشرفاء الكرام من هذه التجمعات المخجلة براء ..... عموما هى عادة مش عبادة و بدعة لا ليها اصل و لا فصل و لكن من بقايا الوثنية و مخلفات العصر الفاطمة المقيت بكل خزعبلاته و شطحاته من تقديس للاشخاص و التمسح بقضبان الاضرحة و تقبيل العتبات المقدسة و الله سبحانه و تعالى ما انزل بذلك من سلطان و طقوس و سنن ما كانت على ايام سيدنا رسول الله .... و يلا خللى الجهلة تفرح و الحرامية تنشل ... و سلملى على الليلة الكبيرة"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519061232/http://masr.20at.com:80/newArticle.php?sid=10253"

[[comments]]
order = 2
subject = "سيد شباب الجنة"
author = "فهد الا سلام"
text = "بسم الله الواحد كل هذة البدع والمحرمات ونظن ان الله سوف يد خلنا الجنة والله لو قام الحسين من مقامة الشريف ووجد كل هذة البدع لتبراء من كل هذا وتبراء من يفعل ذلك العبرة من الحسين فى قصة وليس بالخرافات والفكر الشيعى المتخلف الذى قسم الا مة الى سنة وشيعة احفاد ابو لولوة المجوسى وعبد الله بن سبا كفنا تخلف وهيا نرجع الى سنة رسول الله والمفروض ان الدولة تلغلى كل هذة الا شياء المسية لالااسلام ولو حتى با لقوة فعلا مو لد وصحابة غايب وسنسال عن كل هذا امام الله ورسولة وحسبى الله ونعم الوكيل فى كل من اراد هدم هذا الدين"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519061232/http://masr.20at.com:80/newArticle.php?sid=10253"

[[comments]]
order = 3
subject = "مبروك يا اية"
author = "ابو يوسف"
text = "موضوع لذيذ والصور جميلة مبروك يا اية يا فقي اول موضوع ليكي وعقبال الباقي<br />وسلام"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519061232/http://masr.20at.com:80/newArticle.php?sid=10253"

[[comments]]
order = 4
subject = "حب مصر"
author = "مصرى حتى النخاع"
text = "لو القائمين على الموقع دة بيحبوا مصر والمصريين ودة انا متاكد منة ياريت يركزوا فعلا على جانب شديد الخطورة وهو بعد المصريين عن صحيح الاسلام تلاقى الواحد بيصلى والزبيبة على جبينة قد كدة ويقعد يقرا الفنجان او زحمة الموالد واللة انا شفت بعينى دعارة فى احد الموالد بالشرقية كل الكلام دة مالوش دخل بالاسلام"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519061232/http://masr.20at.com:80/newArticle.php?sid=10253"

[[comments]]
order = 5
subject = "سيبوا الناس تفرح!"
author = "واحدة زهقت من كلام الناس"
text = "في ناس بتحب تعبر عن حبها للدين ولله بالصلاة في الجامع، وفي ناس بتحب تعبر عن ده بخدمة الأخرين، وفي ناس بتحب تعبر عن ده بالمشاركة في الموالد. ليه مش قادرين نعترف ان على اختلاف اشكال التعبير، فإن الهدف واحد. ليه متأكدين أوي كدة ان بس طريقتنا احنا في التعبير اللي صح وكل الباقي غلط. الناس مختلفة في ثقافتها ونظرتها للحياة ونظرتها للدين وللعبادة، وربنا اللي خلقنا مختلفين. ليه خايفين من الاختلاف ده وعايزين نقضي عليه؟ انا باقترح نبطل نحكم على الناس التانية ونحاول نفهمهم ونسيب لهم حق وحرية الاختيار. ذي ما انت متأكد من طريقك، غيرك متأكد من طريقه برده. وبعدين، الموالد بتجيب فرحة كبيرة للناس، عايزين نشيل فرحة والناس مش ناقصة غم؟ وااله أعلم!"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115700/http://masr.20at.com:80/newArticle.php?sid=10253"

[[comments]]
order = 6
subject = "يعني اية"
author = "يلا خير"
text = "يعني نروح نعمل مظاهرة نضرب<br />نعمل مولد عادي<br />اصل الحكومة عازوة كدة<br />الناس تبقي دراويش<br />وتنبلة"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115700/http://masr.20at.com:80/newArticle.php?sid=10253"
