[[comments]]
order = 7
subject = "أحيوا أمرنا رحم الله من أحيا أمرنا"
author = "محب ال الرسول"
posted = "2008-08-06"
text = "إذا رأينا إمرأة متحجبة و حجابها غير محتشم فهل الخلل في الإسلام أم في المتحجبة . و أيضا إذا حصل أي منكر في مولد أو إحتفال بإحياء ذكر رسول الله أو أهل بيته فيجب أن نبين الخطأ و محاولة تصحيحه بالنصيحه و الكلمة الطيبة لا بالشتائم و السباب و الإنتقاص ممن يحيي ذكر رسول الله و ال بيته , و بإعتقادي أن من يشارك في ذلك حباً برسول الله و اله أفضل ممن لا يشارك , و أكثر من ذلك يسب و يذم و يشتم بدل أن يحاول على الأقل أن يصحح و يبين الأخطاء كي لا تتكرر ."
archived = "2010-03-14"
capture_url = ""

