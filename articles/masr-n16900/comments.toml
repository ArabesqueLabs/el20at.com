subject = "اى مشكلة فى بيلدنا حلها سهل خالص  - اعملوا قانون"
author = "بغباوتة"
posted = "2008-07-24"
text = "ازمة فى المرور - بدل دراسة عمل مواقف واشارات مرور عصرية وتوعية وتخطيط طرق وعمل انفاق وكبارى تقوم الحكومة تهرب من المشكلة وتروح للحاج فتحى سرور وتقول لة فصل لنا قانون نخرب بية بيت ابو اللى عندة سيارة<br />ذلك اسهل جدا<br />نزود الغرامات وبعدين الرشوة تزيد للعساكر<br />المخالفة ام عشر جنية كنا بندفع جنية<br />اما المخالفة اللى بقوةت ب 100 جنية فتبقى الرشوة عشرة جنية"
archived = "2008-08-01"
