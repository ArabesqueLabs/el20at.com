author = "ابو عاصم المصرى"
posted = "2009-10-27"
text = "كل الحب والتقدير لشيخ القضاة السيد محمود الخضيرى..وكل البغض والعار لنظام حسنى مبارك وكتبتة الكاذبين المؤيدين للباطل والمتسترين على اللصوص,امثال المستشار الخضيرى هم الدليل الوحيد تقريبا على ان مصر مازال بها خير وفيها امل ,مصر ليست عزبة الباشا مبارك ليورثها لأبنائة بل هى ملك كل المصريون ولن نقبل الا بالمخلصين والأكفاء من ابنائها وهم كثر والحمد لله, مستقبل ابنائنا لن نتركة لعبة فى ايد غير امينة واذا اصر الطاغية على بغية فليعلم ان الكثيرين جدا من ابناء الوطن على اتم الأستعداد للتضحية بالغالى والرخيص من اجل بلدهم ومستقبل ابنائهم."
