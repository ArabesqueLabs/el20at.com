subject = "كلنا مضطهدون"
posted = "2008-07-06"
text = "أولا : ما سبب العنف الطائفي فى مصر ؟<br />من أهم أسس المنهج العلمى ألا تدرس الظاهرة موضوع دراستك بمعزل عن سياقها العام . وإذا أردنا دراسة العنف الطائفي فى مصر فيجب ألا نعزله عن بقية صور العنف فى المجتمع المصري ، مثل العنف الأسري الذى يبدأ مع أول مشكلة تسكت عنها الألسنة لترتفع فوقها الأيدي ، والعنف فى المدارس سواء أكان بين المعلم وطلابه أو بين الطلاب وزملائهم ، والعنف الذي يمارسه رجال الشرطة بشكل روتيني ، والعنف الواضح حتى في قيادة السيارات . وبذلك سنخرج بأول نتيجة ، وهى : إن العنف أصبح ظاهرة عامة فى المجتمع المصري فى السنوات الأخيرة ، وهو ليس قاصرا على العلاقة بين الطوائف الدينية المختلفة . ولذلك فإنني أعتقد أن سبب العنف الطائفي فى مصر هو نفسه سبب الصور الأخرى للعنف ، فما سبب العنف الطائفى فى مصر ؟ ثمة ثلاث إجابات مختلفة لهذا السؤال :<br />1- وجود جماعات وأفراد فى كلا الطائفتين المسلمة والمسيحية يبثون الكراهية للطائفة الأخرى بمختلف المنابر . ولكني أرى أن هذا ليس سببا للعنف الطائفي ، وإنما أحد مظاهره . والحقيقة أن هذا العنف متبادل رغم أن كل طرف يدعي أنه من طرف واحد ، وإن قلَّت عدد الاعتداءات المسيحية عن عدد الاعتداءات المسلمة ، فذلك لقلة نسبتهم فى المجتمع عن نسبة المسلمين ، ولسبب آخر يُحسد عليه المسيحيون ، وهو أن الكنيسة القبطية الأرثوذكسية هي المؤسسة الوحيدة فى مصر التي لا يُعين رئيسها بقرار من أمن الدولة ، لدرجة أن السادات فى قمة غطرسته وصدامه مع البابا شنودة لم يستطع حبسه أو عزله ، بينما حبس الشيخ كشك والشيخ المحلاوي وقال عنه مقولته الشهيرة : ( مرمي فى السجن زى الكلب ) . ولذلك فإن للبابا شنودة استقلاليته ، ومرجعيته الموثوق بها من قِبَلِ مسيحيي مصر ، واحترامه من قِبل كل المسلمين المصريين ( ربما يحترمونه أكثر من بعض أقباط المهجر الذين يهاجمونه الآن ) ، لذلك فإن الكل كان يتطلع إليه عندما تحدث مثل هذه الفتن ، والرجل دائما يدعو أبناء طائفته للصبر علي المكاره ، وعدم الانفعال حفاظا علي الوحدة الوطنية ( ولكنه للأسف كلما وقعت فتنة فى الفترة الأخيرة اعتزل الناس معتكفا للعبادة فى وادي النطرون ) ، بينما يفتقد المسلمون فى مصر مرجعية دينية رسمية موثوق بها طالما ظل شيخ الأزهر ومفتى الديار المصرية ورئيس جامعة الأزهر مُعَيَّنون بقرار من أمن الدولة .<br />2- تقاعس الدولة وأجهزتها الأمنية عن أداء دورها تجاه الاعتداءات الطائفية على الأقباط ، سواء رجع ذلك إلى عدم الكفاءة أو إلى تواطؤ من عناصر داخل تلك الأجهزة موالية للتيارات الفاشية بالمجتمع . وأنا فى الحقيقة يدهشنى أصحاب هذا الرأي لأن الشرطة المصرية لا تؤدي أى دور إلا حماية الحاكم فقط . وإذا قامت أية مشاجرة - حتى بين أبناء الدين الواحد - فلن تتدخل الشرطة عملا بمبدأ ( أن هؤلاء صيع ويجب أن نتركهم يُخَلِّصون على بعض ) ، ثم تتدخل بعد انتهاء المشاجرة للقبض على من بقى حيا وإحصاء الضحايا والخسائر ، وهى لا تضطهد الأقباط فقط بل كل المصريين ، والأقباط جزء المصريين لذلك عليهم أن يتحملوا جزءا من الاضطهاد عملا بمبدأ المساواة فى المواطنة . ولكي أوضح ما أقصد سأروي موقفا شخصيا تعرضت له . دخلت قسم شرطة سيدي جابر بالإسكندرية لأبلغ عن سرقة سيارتي ، وكنت أظن أن القسم سينقلب رأسا على عقب ، فلقد سرقت سيارة بأكلمها فى وضح النهار فى منطقة من أرقى مناطق الإسكندرية ، لكني فوجئت بمدى التجاهل وسوء المعاملة ، فقد كان على أن أنتظر السيد ضابط المباحث حتى يعود من جولاته على التجمعات الانتخابية ، وحتى ينتهي - بعد عودته - من اتصالاته بالسادة ضباط أمن الدولة ليعطيهم التقارير عما شاهد . ولم يقف الأمر عند حد طول الانتظار ، بل أنه عاملني كمتهم ، فأخذ بطاقتى لمدة يوم كامل وأجبرني على الجلوس داخل سيارة البوكس ( كما يجلس المتهمون أو المخبرون ) لكي أطلعه على المكان الذى تركت فيه سيارتي قبل سرقتها ، ورفض أن أركب جواره أو أستوقف تاكسيا . وإلى الآن لا أعرف لماذا تمت معاملتي بهذا الشكل علما أننى لست مسيحيا . ثم شاء القدر أن أدخل نفس القسم مع شخص أمريكى ( مسيحي ) للإبلاغ عن فقد جواز سفره ، وفوجئت بنفسى أجلس فى مكتب مأمور القسم الذي يسألنا بنفسه إن كنا نريد شايا أو قهوة ، كما قام رئيس مباحث القسم بكتابة المحضر بنفسه .<br />3- شعور المتدين بإهانة دينه . ولاختبار صحة هذه الإجابة سأقارن بين ثلاثة مواقف تعرض فيها المتدين لهذا الشعور :<br />- الموقف الأول فى الولايات المتحدة الأمريكية ، خلال إحدى جولات \" باراك أوباما \" المرشح للرئاسة الأمريكية عندما رفض التقاط صورة له وخلفه بنات محجبات ، وعلى الفور قامت قناة ( سى إن إن ) بعمل لقاءات متعددة مع محلليين سياسيين من مختلف الاتجاهات السياسية والدينية ، وكان واضحا شعور المسلمين في أمريكا بإهانة دينهم ، بل إن بعضهم هدد بالتراجع عن تأييد أوباما لأنه فى حال فوزه سيكون رئيسا لكل الأمريكان بما فيهم المسلمون . لكن الملاحظ أن أحدا لم يهدد أوباما بالقتل ، ولم تخرج مظاهرات تقذف مندوبيه بالطوب . لماذا ؟ لأن اعتراضهم وصل لهدفه ، بل أنه أجبر أوباما بعد ساعات قليلة على الاعتذار ، وفى اليوم التالى حرص على التقاط صور له مع فتيات محجبات ، وانتهى الأمر .<br />- الموقف الثاني فى مصر ، عندما رأى المسيجيون أن إسلام وفاء قسطنطين حدث مدبر لإهانة دينهم ، فتظاهروا داخل كاتدرائية العباسية واعتدوا على رجال الشرطة عندما حاولوا منعهم من الخروج من الكاتدرائية .<br />- الموقف الثالث فى مصر أيضا ، عندما رأى المسلمون في المسرحية التي عرضت داخل كنيسة مارجرجس بمحرم بك بالإسكندرية إهانة لدينهم ، فتجمعوا حول الكنيسة واعتدوا عليها .<br />فلماذا يلجأ المتدينون فى مصر إلى العنف عند الشعور بإهانة دينهم ؟ هل السبب هو دينهم ؟<br />لا أعتقد أن الدين المسيحي هو السبب ، فالمسيح يقول فى الإنجيل : \" من ضربك على خدك الأيمن فأدر له خدك الأيسر \" .<br />ولا أعتقد كذلك أن الدين الإسلامي هو السبب ، لأن القرآن لم يشرع القتال للمسلمين إلا إذا بدأهم به العدو ، بل وينهاهم عن أن يكونوا هم البادئون بالاعتداء ، \" وقاتلوا في سبيل الله الذين يقاتلوكم ولا تعتدوا إن الله لا يحب المعتدين \" .<br />ولو كان الدين سبب العنف ، فلماذا لم يلجأ إليه المسلمون فى أمريكا عند شعورهم بإهانة دينهم بينما يلجأ له المسلمون والمسيحيون إلى العنف عند شعورهم بنفس الشعور ؟<br />أعتقد لأنهم لا يجدون منافذ التعبير التي تنقل صوتهم ، وتفتح جراحهم ليخرج منها الصديد عندما تفتح حوارا حرا لمناقشة مثل هذه الإهانات ، ولكن للأسف فإن منافذ التعبير فى مصر اقتصرت على ثلاثة منافذ :<br />- منافذ حكومية لا تتحدث إلا عن فخامة الرئيس .<br />- منافذ خاصة تنشغل بالصراع بين تامر حسنى وعمرو دياب .<br />- منافذ طائفية تساهم بشكل كبير فى تغذية الفتنة الطائفية .<br />ولعل السبب الرئيسى فى هذا الوضع هو غياب الديمقراطية التي تقوم على مؤسسات المجتمع المدنى ، وتفسح المجال للجمعيات الأهلية لتقوم بدورها في التعبير عن الشارع ، عندئذ يكون لكل طائفة من يمثلها تمثيلا حقيقا ويطالب بحقوقها ويعبر عن غضبها بشكل سلمي فعال ، وهذا هو سبب قوة الأحزاب والمنظمات الأهلية فى الغرب ، أنها تمثل قاعدة عريضة يحسب لها حساب . أما المصري إذا أهين فليس أمامه إلا أن يضرب رأسه فى الحائط ؛ فليس له عضو مجلس نيابي يمثله ، ولا حزب يدافع عنه ، ولا حتى رجل دين يثق فى مرجعيته . وبالتالي سوف يشعر بالغربة داخل وطنه ، ويفقد انتماءه الى البلد ، ويوجه انتماءه نحو جماعته الصغيرة ( الدينية أو القروية أو الكروية ) ويتعصب لها . وعندما يشعر بإهانة دينه لا ينتظر رد فعل الازهر أو دار الإفتاء .<br />نستخلص من هذا كله أن السبب الرئيسى للعنف الطائفي فى مصر هو غياب الديقراطية ، وليس أدل على ذلك من أن العنف الطائفي لم يظهر فى مصر قبل ثورة يوليو ( التي قضت على الديمقراطية المصرية وأقامت حكما عسكريا ثم بوليسيا ) رغم أن المجتمع المصري كان يضم ثلاث طوائف دينية مختلفة ( مسلمة ومسيحية ويهودية ) .<br />ثانيا : لماذا يزداد العنف الطائفي فى مصر ؟<br />إذا كان غياب الديمقراطية هو السبب الرئيسي وراء العنف الطائفي فى مصر فلماذا لم يظهر هذا العنف منذ قيام ثورة يوليو وظل مكتوما حتى أواخر حكم السادات ؟ لأن السبب الرئيسى لأي ظاهرة يكون كفيلا بخلقها حتى تأتي مجموعة عوامل مساعدة تهيأ لهذه الظاهرة أن تندلع ، ولعل من أهم عوامل اندلاع ظاهرة العنف الطائفي فى مصر ما يلى :<br />1- ضعف الدولة الحالية في مصر بسبب فقدانها لشرعيتها فى الداخل وعجز قادتها الذين شاخوا فوق مقاعدهم ( إنهم عاجزون حتى عن ممارسة مزيد من القمع ) وتعرضهم لضغوط عالمية كبرى ، مما جعلها تتحول من البقرة الضاحكة ( كما كنا نسمي رأس هذه الدولة ) إلى البقرة التى وقعت ، كما يقول المثل الشعبي ( إذا وقعت البقرة كثُرت سكاكينها ) ، فلقد وقعت دولتنا ورفع كل منا سكينه على رقبتها ، لا ليقتلها بل ليساومها على مطالبه ، وهي للأسف مطالب طائفية أو فئوية . فمن هذه المطالب الطائفية :<br />- الأقباط : وأنا أتفهم – بل وأطالب معهم – مطالبهم بشأن تدريس التاريخ القبطي فى المدارس كجزء من تاريخ مصر ، وأن نكف عن عادتنا فى تزوير التاريخ . بل إننى أعتقد أن هذا مطلب وطني لا يخص الأقباط وحدهم . كما أفهم مطالبهم الأخرى بشأن حرية بناء الكنائس وترميمها . لكن تزعجنى حقا مطالب مايكل منير الأمريكى من أصل مصري ( ولا أقول المصري الحاصل على الجنسية الأمريكية ) بتخصيص دوائر انتخابية لا يرشح فيها سوى الأقباط ، فهل هذه هي الديمقراطية ؟ هل مصر مثل أمريكا التي مازالت حتى الآن مقسمة إلى مناطق للبيض وآخرى للسود ؟ هل مصر مثل أمريكا التي لم تعط السود حق التصويت فى انتخاباتها إلا فى ستينيات القرن العشرين ( ومع ذلك نصفها بأنها أعرق ديمقراطيات العالم ) ؟ بالطبع لا لأن المجلس النيابى فى مصر منذ إنشائه أول مرة فى ستينيات القرن التاسع عشر كان يضم نوابا مسلمين وأقباطا . كما أزعجني تصريحه بعد لقائه بجمال مبارك أن سيؤيد أي رئيس يخلف مبارك الأب إذا كان سيعطي الأقباط حقوقهم كاملة ، في إشارة إلى صفقة بينه وبين مبارك الابن على تأييده ودعمه ( خصوصا لدى الإدارة الأمريكية التي يحتاجها جمال ليرث مصر ) مقابل منح الأقباط مزيدا من الحقوق . كما أزعجني تأييد الأقباط لقانون الإرهاب الذي تريد الحكومة المصرية سنه بحجة أن أعرق الدول الديمقراطية طبقته بعد أحداث الحادي عشر من سبتمبر لحماية ديقراطيتها من الإرهابيين ، دون أن يسألوا أنفسهم : لماذا ستطبقه مصر ؟ ( فأى قانون تحتاجه مصر وهى محكومة منذ ما يزيد على نصف قرن بقانون الطوارئ ؟ ) ولحماية ماذا إذا كانت مصر دولة غير ديمقراطية ؟ ولحماية من إذا كانت الدولة لا تحمى إلا حاكمها ؟ ( لماذا يظن الأقباط أن هذا القانون سيحميهم رغم أن ضربات الإرهاب أصابت المصريين كلهم ولم تقتصر على الأقباط وحدهم ، بل إن معظم ضحايا الهجمات الإرهابية على مصر كانوا مسلمين ؟ ) وكيف ستطبقه ؟ ( هل يثق المصريون فى رجال الشرطة الذين سيطبقون هذا القانون من أجل المزيد من إحكام قبضتهم على البلد ؟ ) . كما أزعجني مطالبة الأقباط للإعلام المصري بالشفافية فى نقل أخبار الفتنة الطائفية ، ولم يطالبوه بالشفافية فى كل الأحوال . فلماذا يتقوقع الأقباط على أنفسهم لهذه الدرجة ؟<br />- النوبيون : وأنا – وغيري كثيرون - بالفعل أحترم النوبيين وثقافتهم لا كمتحف بل كحياة تُمارس أخلاق تُسلك ، ولكنى دهشت عندما رأيت صديقى الأديب الرائع \" حجاج حسن أدول \" فى قناة العربية فى برنامجها السياسي ( نقطة نظام ) وليس فى برنامجها الثقافي ( روافد ) ، والذي أدهشنى أكثر أننى عرفته عن قرب لفترة من الزمن فى ندوات ومقاهي الإسكندرية بل وفي بيته . ومع ذلك لم أسمع منه من قبل ما سمعته منه على قناة العربية وما أقرأه له على الإنترنت الآن ، فقد سمعته من قبل يتحدث عن تضرر النوبيين من جراء الأخطاء التى وقعت فيها الدولة أثناء تهجيرهم لبناء السد العالي على أرض قراهم ، وحرصه على جمع التراث النوبي خوفا من اندثاره ، لكني لم أسمعه أبدا يتحدث عن اضطهاد مصري ضد النوبيين ، أو عن مقارنة الشتات النوبي فى محافظات مصر بالشتات الفلسطيني ، أو عن مطالبه التي من أهمها : عودة النوبيين إلى موطنهم مثلما أعادت الدولة المصرية مهجري قناة السويس إلى مدينتهم – أن تكون اللغة النوبية لغة ثانية في مصر – محاكمة المسؤولين الذين أجرموا بحق الشعب النوبي أمام محاكم دولية . وأنا أود أن أذكره بأن أحدا فى مصر لم يعترض على حكم السادات بسبب لون بشرته الأسود ، بينما أمريكا الآن مقلوبة رأسا على عقب لأن أحد المرشحين لرئاستها أسود ، وقد وصلته خطابات تهديد بالقتل من جماعات البيض المتعصبين . وأسأله : هل إذا حملتُ أمتعتى وتوجهت إلى منطقة النوبة لأقيم فيها سيمنعنى المسئولون فى مصر ؟ وإذا كانت الإجابة بـ ( لا ) فلماذا ينتظر النوبيون الدولة كى تعيدهم إلى أرضهم ؟ أما إذا كانت الإجابة بـ ( نعم ) فإنها ليست مشكلة النوبيين وحدهم بل مشكلة كل المصريين . وكذلك بالنسبة لتغيير أسماء القرى النوبية إلى أسماء نوبية فإنها قضية كل المصريين الذين يجب أن يقفوا ضد تزوير التاريخ بكل أشكاله . أما حديثه عن عدم وجود مذيعة أو مذيع أسود فى مصر فالرد واضح ، أنه لا يستطيع أى مصري مهما كان لونه أو دينه أو مؤهلاته أن يعمل مذيعا فى التليفزيون الرسمي المصري بدون ( واسطة كبيرة جدا ) . وأخيرا أود أن أهمس فى أذنه : أنا حزين جدا منذ قرأت مقولتك عن اضطهاد مصر للنوبيين ، حزين لأننى بالفعل أحبك ، رغم أنني مصري ، ورغم أن بشرتي ليست سمراء !<br />- الإخوان : وكلنا يعرف أنهم يساومون الدولة للإفراج عن معتقليهم وإفساح المجال لهم فى النقابات والمجالس النيابية ، وأخشى ما أخشاه أن يكون المقابل سكوتهم عن توريث الوطن .<br />ولكنى أقول لهؤلاء : إذا نجحت مساوماتكم وورث آل مبارك مصر فلن يغفر لكم التاريخ !<br />أما المطالب الفئوية التي ظهرت فجأة منذ سقوط عصا سليمان من يد الدولة المصرية ، فإنها مطالب تتعجب كيف سكت الشعب عنها لمدة تزيد على نصف قرن ، فمعظمها مطالب بخصوص أوضاع غير طبيعية رسختها ثورة يوليو ، مثل :<br />- مطالب القضاة باستقلال السلطة القضائية عن السلطة التنفيذية .<br />- مطالب أساتذة الجامعة بانتخاب عمداء الكليات ورؤساء الجامعات ومجلس إدارة ناديهم ، وإنهاء دورالأمن في الجامعة .<br />- مطالب الصحفيين بإطلاق حرية إصدار الصحف ، وإلغاء القوانين التي تبيح حبس الصحفي فى جرائم النشر ، وتطبيق قوانين الخصصة على وسائل الإعلام الحكومية لإلغاء دور الدولة فى الإعلام .<br />- مطالب عمال شركات العام بتحسين رواتبهم وعلاواتهم بما يوازي حالة التضخم فى الاقتصاد المصري .<br />- مطالب سكان المناطق العشوائية بحقهم في شرب مياه غير ملوثة فيما أطلق عليه مظاهرات العطش .<br />لعلها الوحيدة حركة كفاية التي لها مطالب عامة لمصر كلها ، ومن اللافت للنظر أن أول منسق عام لها كان قبطيا ( جورج إسحاق ) أستطاع يخرج من شرنقته ليتحدث باسم مصر كلها ، فالتف المصريون حوله بجميع طوائفهم وتياراتهم .<br />ولعل هذه المطالب الفئوية قد تتكل يوما ما ، لتشكل مطالب عامة تحاول أن توقف انحدار مصر إلى الحضيض فى الوقت الذي يتقدم فيه غيرنا .<br />وليس أدل على أن ضعف الدول هو من أهم العوامل المساعدة على اندلاع العنف الطائفي من تتبع هذه الحقب التاريخية :<br />- الحقبة الناصرية : لم يظهر فيها عنف طائفي بسبب قوة الدولة وقيامها بمشروع وطنى وحّد كل طوائف الشعب حوله .<br />- الحقبة الساداتية : لم يظهر العنف الطائفى إلا فى النصف الثاني من هذه الحقبة ، بعد انتهاء مشروع التحرير الوطنى ، وبدء ترهل الدولة .<br />- الحقبة المباركية : بدأت بمحاولة خلق مشروع وطنى ، فتخبطت بين محاربة الفساد والإفراج عن المعتقلين السياسيين وإعادة مصر إلى حظيرة العرب وسد ديون مصر ، ولكن بعد فشل كل هذه المشاريع لعدم جدية الدولة فيها ، لم تفلح أية ديكورات أو مساحيق فى إخفاء عجز الدولة ، ولذلك عاد العنف الطائفي يطل بوجهه القبيح .<br />2- أطفال الشوارع المشردون : نعم ، إنني أعتقد إن العامل الثاني من عوامل اندلاع العنف الطائفي فى مصر هم أطفال الشوارع المشردون ، وهذا ليس هروبا من الأسباب الحقيقية ، فالكل يعرف أنهم قنبلة موقوتة فى مصر ، وأن خروجهم من شرنقتهم سيمثل كارثة تحرق اليابس والأخضر ، وأنا مقتنع أنهم قد بدأوا الخروج ، فمن الذي شهر السيوف ورفع السنج وقطع الطرق وألقى البنزين على النار المشتعلة فى محرم بك عام 2005 والعصافرة عام 2006 والمحلة 2008 ( رغم أن أحداث المحلة ليست طائفية ) ؟ يجمع كل شهود العيان أنهم رجال غرباء لم يرهم أحد من قبل فى هذه المناطق ، وأن ( شكلهم وحش ) . إنهم يخرجون كيأجوج مأجوج بين فترة وأخرى لينتقموا من هذا المجتمع الذي تجاهلهم ، وليحكموا الشارع لساعات ، ثم يعودون إلى مخابئهم ، ولكنهم يتحينون الفرصة المناسبة كلما وقعت مظاهرات أو اعتصامات أو اعتراضات أو اعتداءات أو مشاحنات ليستتروا بها . والويل لنا من خروجهم الكبير ."
