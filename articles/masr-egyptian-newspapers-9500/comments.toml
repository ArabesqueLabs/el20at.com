text = "اتابع منذ سنوات عديدة ما يقال و يدعى انة يوجد اضطهاد للاقباط فى مصر<br />حقا هذا هراء و كذب و خداع<br />انا مسيحى قبطى اعيش فى مصر و لم اتعرض يوما ما لاى صورة من ما يسمى بالاضطهاد ؟<br />انها مشاكل عادية تحدث بين افراد الوطن و ليست مخططات او سياسة تنتهجها الدولة<br />الخطاء الاطبر هو معالجة الدولة لها بالحل السياسى و هذا هو عين الخطاء<br />لنترك علاج هذة المشاكل الى السلطة القضائية متمثلة فى النيابة العامة و القضاء على مختلف درجاتة<br />و السلطة التنفيذية متمثلة فى جهاز الشرطة بكافة اداراتها المختلفة؟؟؟<br />و دعونا نتجنب دور المنيسة و الجامع فى حل هذة الازمات و نترك الحل للاهل الخبرة و الحنكة و الحل و هما السلطة القضائية و السلطة التنفيذية؟؟؟؟؟؟"
