subject = "باركهم الله"
author = "سعودية"
posted = "2008-04-17"
text = "بارك الله شبابنا وحفظهم من كل مكروه<br />خطوة رائعة تثلج الصدر<br />وتعطي فكرة مخالفة عن تسيب أبنائنا وعدم أهتمامهم<br />كل الشكر لكم على هذا الطرح والنقل<br />ودمتم"
