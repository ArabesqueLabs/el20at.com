subject = "قدوة وفخر وتحميس لنا كشباب الله يقويكم"
author = "عبد الرحمن النمري"
posted = "2008-04-21"
text = "الف مـــــــــــــــبروك على نجاح هذا البازار او المعرض ووالله اقولها لكم بكل صدق انتو فعلا فخر الشباب السعودي وقدوتهم والله يساعدكم ويعينكم... وشعاري هو (الشعل مـو عيب)"
