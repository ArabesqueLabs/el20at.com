subject = "my interview"
author = "عمّار"
posted = "2007-11-29"
text = "أول مقابلة كانت مفاجئة لي، حيث كان المقرر أن أذهب إلى الشركة للتدريب، وليس للعمل<br />وكنت أعتقد أن التدريب لا يحتاج إلى مقابلة او غيره<br />المهم، طبعا إنتظرت حوالي 30 دقيقة، حتى أدخل للمدير Technical manager الذي كان يسألني وهو يتحدث بالهاتف وييديه على جهازه المحمول وهو يقوم بالرد على بريده الإلكرتوني، (مشغول جدا :-) لكن أسألته كانت ذكية ، أرتبكت لأني لم أكن متوقع أسئلة،<br />بدأها بـ، ما الذي درسته؟<br />ذهني مشتت، لماذا يسألني؟؟ هذه شركة برمجيات ، وأنا أرسلت CV أني في كلية حاسبات... إذن ماهو داعي السؤال،<br />أول مادة خطرت لي كانت Data Structure لا أدري لماذا...؟<br />المهم أعطاني ورقة وقلم بيده الأخرى غير التلي تحمل الهاتف، وطلب مني رسم ل Linked List<br />هذه كانت البداية<br />إنتهى الإنترفيو بعد 40 دقيقة،<br />والنتيجة، أني بدأت التدريب في نفس اليوم<br />وبفضل الله، بعدها ب 370 يوم بالتمام أي بعد تخرجي إلتحقت بالشركة فعلا كمبرمج، وبدون أي interview"
archived = "2010-03-14"
