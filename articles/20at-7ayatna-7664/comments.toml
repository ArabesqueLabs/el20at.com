text = "كنت مع 2 من أصدقائى الباحثين عن وظيفه أمثالى, و كان الميعاد المحدد للـ interview يوم الخميس \"كان أول يوم رمضان\" الساعه 11 صباحاً فى احدى الشركات المشهوره, المهم وصلنا قبل الميعاد المحدد بـ 10دقائق<br />أول واحد حن علينا و كلم واحد مننا كانت الساعه 4:15<br />أيوه انتو قريتو صح... انتظرنا من 10:50 حتى 4:15 و فى الآخر قالولنا المدير مشغول و مش حيقدر يقابلكم."
