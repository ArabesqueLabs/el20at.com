subject = "الله يكون فى عون العبد ما كان العبد فى عون اخيه"
author = "almalk"
text = "دى قصة حقيقية هو ده الى بيحصل فعلا<br />بس انت نسيت حاجة مهما ياحمد<br />ان السائق مبيوصلش الركاب الى اخر الخط<br />ولاكن السائق بيقسم الخط الى مراحل علشان يزود الاجرة<br />الله يكون فى عون الشعب المصر"
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130231/http://masr.20at.com:80/newArticle.php?sid=16149"

