[[comments]]
order = 7
subject = "ميكروباص 15 مايو حلوان"
author = "ابومحسن غربة 26 سنه"
text = "ايووووووووه يا احمد عبدالحكم الموضوع والصورة حته من مصر يا عبدالحكم<br />فكرتني بميكروباص 15 مايو حلوان<br />يلا بينا نغني لمصر في موقف ميكروباصات مصر يا حبايب مصر<br />مصر هي أمي .. نيلها هو دمي<br />شمسها ف سماري .. شكلها ف ملامحي<br />و إن كان لوني قمحي .. ده من فضل مصر<br />ما تلاقيش مثالها .. ست كل عصر<br />عشة جنب نيلها .. تسوى ألف قصر<br />ولا وردة بلدي .. فيها عطر مصر<br />ولا سحر مصر .. ولا جو مصر<br />ولا .. ولا .. ولا<br />ده شئ ملهش حصر<br />.. روحوا زوروا مصر<br />و إنتوا تعذروني .. لما أقول يا مصر<br />مصر .. مصر .. مصر<br />فاتك نص عمرك ياللي ما شفت مصر<br />ده التاريخ ف مصر .. و الهرم ف مصر .. و الكرم ف مصر<br />و الحلوين ف مصر .. و الجدعان ف مصر<br />ادوني عصاية .. أرقص رقص مصر<br />.. روحوا زوروا مصر<br />و انتوا تعذروني .. لما أقول يا مصر"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615005244/http://masr.20at.com:80/newArticle.php?sid=16149"

[[comments]]
order = 8
subject = "مصر بلد الامن والامان"
author = "ابو تريكة"
text = "زمان<br />ده التاريخ ف مصر .. و الهرم ف مصر .. و الكرم ف مصر<br />و الحلوين ف مصر .. و الجدعان ف مصر<br />والان<br />لايوجد كرامة لمواطن مصرى فقير يعذب فى كل شئ حتى فى اقسام الشرطة اللى المفروض اللجوء لها فى وقت الشدة النهاردة التعذيب فيها جهارا نهارا بعملية ممنهجة وعلى علم ومسمع من وزير الداخلية الخنزير حبيب العادلى الذى لا هو حبيب ولا هو عادلى والسيد الكلب احمد نظيف الذى لا هو نظيف ولا حاجة دى اوسخ واغبا خلق الله والسيد رئيس الجمهورية والسيد ابن رئيس الجمهورية الخنازير وعجبى على ام الدنيا عجبى عليكى يا مصر"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615005244/http://masr.20at.com:80/newArticle.php?sid=16149"

[[comments]]
order = 9
subject = "كان عندى ميكروباظ - وعلية العوض"
author = "مقهور"
text = "اتغربت كتير - وعلشان الميكروباظ فرشوا الارض لى حرير - وما فيش فايدة اللا هو مفيش فايدة<br />دخلت شريك فى ميكروباظ وقلت الهط شوية زى الناس<br />لقيت الميكروباص فى المركز بتاعى فى فرشوط بيعدى على 3 نقط مرور على الطريق - وكل نقطة مرور لها شهرية معلومة مدفوعة<br />وصول المخالفات والباشويش لة شهرية وبيحلف بالطلاق انة بيلم الشهرية من الميكروباظات ويعطيها للبية المأمور وان البية المأمور بيقسم الحصيلة على الضباط والرؤوس كلها على حسب الرتبة فى المركز<br />وفية ولد ارباب سوابق سابق ومسجل خطر بيقعد فى الموقف علشان بيطلع الكارتة او البون ولة نصيب معلوم قبل قيام اى تحرك للزفت الميكروباظ<br />والسيد ضابط المباحث فى المركز عامل جدول نبطشية بالترتيب لكل ميكروباظ فى الموقف انة يبات ليلة بالسواق قدام المركز علشان البية ضابط المباحث لما يحب يطلع تفتيش على القهاوى فى القرى او يزبط مخالفين او متهربين من دفع غرامة الدودة او عليهم غرامة ضريبة اطيان او بقال علية غرامة مخالفة والضابط عايز يحصلها يقوم علشان السرية المطلقة ما يطلعش بعربية الميرى بتاع المركز ويطلع بالميكروباظ هو والعساكر فى انصاف الليالى ويهاجم البيوت لتحصيل الغرامات ويقتحم البيوت علشان يقبض على الناس علشان عليهم غرامة<br />والسيد الميكانيكى واخوة الكهربائى وسمكرى السيارات كل دول لهم دخل من الميكروباظ<br />برضة يا اسيادنا سواق الميكروباظ معذور<br />عايش دايما فى توتر<br />وفى الاخر<br />قمت بقيادة الميكروباظ بتاعى ورميتة فى اقرب ترعة وقلت حادث وبعتة خردة ومن يومها وانا اعرف انام بالليل زى بقية البشر"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615005244/http://masr.20at.com:80/newArticle.php?sid=16149"

