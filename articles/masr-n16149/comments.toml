[[comments]]
order = 4
subject = "اقتراح بكتابة الجزء الثاني من القصه"
author = "مش رضوى حسن ولا شريف الدواخلي ولا البراء اشرف"
text = "والله يا اخ حكم خيالي سرح في قصص صلاح ابو سيف وتخيلت الجزء الثاني من القصه الا وهو في موقف الميكروباصات يعني مسرح القصة حيبقى في الموقف<br />سواق الباص هو الشاب الوسيم نور الشريف ومعلم الموقف هو الشرير توفيق الدقن وفيه بنت حلوه وصغيره بتعمل القهوة والشاي للسواقين هي ميرفت امين وتدور قصة حب بين البنت الحلوة بتاعة الشاي وسائق الميكروباص الوسيم نور الشريف والعزول هو وتوفيق الدقن معلم الموقف اللي عامل فرده على السواقين وكل السواقين بتكرهه وبتحب نور الشريف وعايز يتجوز البنت الحلوه بتاعة القهوة والشاي (ميرفت امين) وهي ما بتحبوش ومش طايقاه وامها امينة رزق عماله تزن على ودانها علشان خاطر تتجوز المعلم وتقولها يا بت دا حينغنغك في الدهب فيه واحدة تسيب المعلم الكبير الغني دا وتتجوز حتته سواق سنكوك وهي تقولها بحبه يا ماما بحبه القلب وما يريد يا ماما... الله بأه<br />المتهم بأه ندخل في الجد بأه وهنا حندخل قصة عماد الكبير سواق الميكروباص المشهور والضابط اسلام نبيه<br />طبعا المعلم اللي هوا توفيق الدقن حيشطط غضبا لما عرف ان البت بتحب نور الشريف (اللي هو عماد الكبير سائق الميركروباص) فقرر تدبير مقلب له<br />فذهب المعلم اللي هو توفيق الدقن الى ضابط القسم صديقه الضابط اسلام نبيه وهو في الفيلم حيبقى (صلاح السعدني) وحيشتكيلوا الواد السواق الهلفوت نور الشريف (عماد الكبير)<br />فالضابط حيقولوا بس كده يا معلم سيبلي الموضوع دا انا حجبلك خبره انا مش حخليه يفتح عينه في الحته تاني<br />و صلاح السعدني اللي هو الضابط اسلام نبيه بعت المخبرين بتوعه الموقف وجروا شكل نور الشريف اللي هو (عماد الكبير) وسحبوه من قدام حبيبته ميرفت امين البت الحلوه بتاعة القهوة والشاي وضربوه قدامها وجروه على القسم<br />والضابط اسلام نبيه اللي هو صلاح السعدني عمل عملته السودا وصور السائق المسكين<br />(وهنا بقا حنحط حكاية عماد الكبير مع اسلام نبيه كاملة بكل احداثها)<br />وطبعا ميرفت امين حزينه من اللي حصل وبعدين يوم المحكمة بتاعة اسلام نبيه اللي هو صلاح السعدني كلهم يروحوا المحكمة ويسمعوا النطق بالحكم ويزغرطوا ان ربنا ظهر الحق والمعلم اللي هو توفيق الدقن حيهرب من الموقف ونور الشريف اللي هو عماد الكبير حيبقى معلم الموقف ويتجوز ميرفت امين البت الحلوه بتاعة القهوة والشاي ويخلفوا صبيان وبنات وتوته توته فرغت الحدوته حلوه ولا ملتوته<br />يلا يا اخ عبدالحكم اشتغل يا ابني اديني عمال اساعدك اهه"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615005244/http://masr.20at.com:80/newArticle.php?sid=16149"

