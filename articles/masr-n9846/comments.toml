subject = "يااااااااا بلدنا ياااااااابلد..!"
author = "3a2esha"
text = "\"وكانت سيارة بيجو تحمل ميكروفونا تجوب شوارع البلدة تدعو الناس للتبرع، وجاد البسطاء بملابس القطن وقطع الفطير والجبنة القريش\"<br />سبحان الله .. يعنى بيطلبو من ناس اغلب منهم يساعدوهم ويمدوهم بأى حاجة..اصلى حكومتنا مش فاضية .. معلش لو كان الحريق حصل فى منطقة راقية ويسكنها رجال اعمال كانوا سألو عليهم وكمان علجوهم على حساب الدولة .. الغلطة غلطت اهل البلد بئة ..يعملو حسابهم المرة الجاية ..<br />ولسة ياااااااما هنشوف..!!"
