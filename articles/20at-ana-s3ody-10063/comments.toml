subject = "يـــــــــالة من فخـــــــــر......"
author = "ســــــــــــارة"
posted = "2008-10-06"
text = "الصراحة بعد ما قرأت تقريرك الرائع.....ونشوة فرحك وانت تردد (الفتاة السعوديه) وكأنك تقول في نفسك أخيراً تحررت من جحرها المشؤوم... وكأنك تتمنى في المستقبل ان تكون..<br />أمــــك...و أختــــك... ,و زوجتك ...وبنــــاتك... في مثل مواهبـــــــــن... وبصراحة يحسدن لأنهم وقعوا في يد رجل دمقراطي جــــدا ويدعم المواهب ..... حسناً اذا أردت سأدعوا أنا وكل من يقرأ لك بما تتمنى.......<br />.لكن تــــــــــذكــر..<br />(أن بأمثــــال هؤلاء ينزلق المجتــــــمع الى اسفـــــــــــل سافلين...والى مستنقع الرذيلة العفن...)<br />فبارك الله فيك استخدم قلمك فيما يسمو بأفكارك ....وأبدع وتجمل فيه..ولكن باطار دينناا الــــــــــــــراقي...<br />دعــــــــــــــــــــوة صــــــــــادقه من قلبي اللهم اهــــدني واهدَ ناصر ,,, وشباب وبنات المسلمين.....<br />اميـــــــــــــــــــــــــــن"
archived = "2010-03-14"
capture_url = ""
