[[comments]]
order = 1
subject = "البطالة اصبحت موجودة بين الخريجين من دول الخليج نف"
author = "برضة هو"
posted = "2008-08-17"
text = "معظم الشركات فى دول الخليج يملكها اسيويين من الهند او الباكستان او الايرانيين او حتى انجليز<br />وهم يحبون العمالة الاسيوية من بلدانهم ويتكلمون جميعا لغة الاوردو وحتى العرب فى الخليج يجيدون لغة الارودو ويتكلمون بها - والعمالة المصرية غير مرحب بها وغير مطلوبة وسيبوكوا من احلام العروبة والوطنية والتكامل ومش عارف اية<br />العمالة المصرية حاليا كما ارى مطلوبة كعامل فى مقهى سفرجى فى فندق - قصدى يقدم طلبات فى مطعم الفندق<br />او بعض وهى ضئيلة جدا عمال فى المعمار<br />وطبعا السكن كل اربعة فى غرفة وبيدفع حوالى الفين ريال شهريا فى دبى سكن مع ان مرتبة لا يتجاوز اربعة الاف<br />يعنى حتى لو حصل على شغل العملية خسرانة خسرانة وطبعا فى بيشتغل فى جو حرارتة 40 درجة ورطوبة خانقة<br />والمطلوب كل واحد يشتغل فى بلدة<br />ازاى<br />اسألوا الكبير<br />الكبير اللى المفروض هو على الكرسى دة علشان يحقق وظيفة لكل مواطن او يدفع لة بدل بطالة زى الدول التانية المحترمة<br />مش كبير منظر مالوش دعوة باى حاجةفى حاجة غير الاجتماع مع ابو عباس يتكلموا فى كلام فارغ<br />انا الاحظ فى السنتين الماضيتين انة اجتمع مع ابو عباس عشرين مرة مع ابو عباس واجتمع مرتين بس مع الوزراء<br />يعنى حتى مفيش اجتماع مجلس الوزراء<br />ابحثوا لكم عن رئيس او كبير يرعى البلد<br />البلد من غير رئيس من 27 سنة"
archived = "2008-08-18"
capture_url = "https://web.archive.org/web/20080818074710/http://masr.20at.com:80/newArticle.php?sid=17259"

[[comments]]
order = 2
subject = "مصر بتغرق بينا"
author = "عبد المولى الصعيدى"
posted = "2008-08-17"
text = "احد الاصدقاء علق على اعلان مكتوب باحد الميادين واظنة للحزب الوطنى - مصر بتتقدم بينا - فقال ضاحكا - مصر بتغرق بينا<br />وتعليقى ان السيد رئيس لجنة السياسات للحزب اياة ومعة جوقة من الوزراء زاروا افقر قرية فى الصعيد لرفع مستواها وطرد الفقر منها<br />كلام جميل ورائع جدا ان نحارب الفقر وكلنا ورائك ومعك ونعضدك لمحاربة الفقر<br />كيف سنحارب الفقر سيادة رئيس لجنة السياسات ؟<br />سعادتة اشار ان الفقر يمكن طردة بعمل شبكة مجارى وشبكة مياة فى القرية<br />سعادة الرئيس للسياسات - الناس عايزة تاكل الاول - عايزة مصدر رزق - عايزة وظيفة ترتزق منها وتدخل عائد للاسرة - مش شرط وظيفة فين - قطاع خاص قطاع حكومى اى شغل اى عمل - الناس مش هتاكل من المجارى ولا من حنفيات المياة<br />يوجد فى مصر 22 الف مثتثمر - كل اثتثماراتهم فى السياحةوالفنادق والقرى السياحية فى الساحل الشمالى وشرم الشيخ<br />اين التنمية فى الصعيد ؟<br />اى تنمية ومصانع تشغل الشباب فى الصعيد وتفتح بيوت<br />فين الفكر الجديد والفكر الحديد والاحتكارات<br />الصعيد يختنق من البطالة وقلة فرص العمل - ونحن لسنافى حاجة للمجارى وهنعملها فى الخرابة وهنشرب من الترعة راسا - بس ارجوكم اوجدوا فرص عمل للناس<br />ساعتها هتبقى مصر بتتقدم بينا<br />ولكن الشواهد كلها بتقول مصر بتغرق بينا<br />يا ربى رحمتك"
archived = "2008-08-18"
capture_url = "https://web.archive.org/web/20080818074710/http://masr.20at.com:80/newArticle.php?sid=17259"

