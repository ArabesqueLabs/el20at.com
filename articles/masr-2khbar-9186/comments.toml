text = "متهيالي عيب لما المسلم يبقى طرطور<br />المفروض 88 دول ينسحبوا فورا من مجلس الشعب لانه مجلس طراطير ولا يحقق اي مصلحة للشعب<br />الا بأه اذا كانوا الاخوة المسلمين في هذا المجلس دخلوا لمصالح شخصية والله اعلم<br />ونوجه نداء لفضيلة المرشد<br />انسحب من مجلس الشعب وانسحب من السياسة ورجع الجماعة الى تنظيم للدعوة الله كما انشأها حسن البنا<br />قد اسمعت لو ناديت حيا ولكن لا حياة لمن تنادي"
