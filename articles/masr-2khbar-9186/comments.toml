د و العشرين...برافو عليكم ..حتى شعب ما يقدر...<br />60 - قال مجلس شيعب قال<br />ادهم البداري|26/05/2008 م، 03:33 مساءً (السعودية) 12:33 مساءً (جرينتش)<br />يا جماعه هو انتم لسه ما فهمتوش ,,, الطوارئ لتخويف الشعب ,,, و الله لو زعلت امين شرطه هيقول لك هعتقلك و اوديك المعتقل ,,, احنا نعرف الطوارئ ضروريه اثناء الكوارث و الاضطرابات ولمده حتي ينتهي الحدث,, و ترجع الحياه طبيعيه ,,,, و موضوع الارهاب اللي كانو واجعين جماغنا عليه في التسعينات ,,, لا كان فيه ارهاب و لا حاجه ,, الموضوع شويه عيال مخهم ضارب هههه عايزين حكومه اسلاميه ,,, و العيال دي مضحوك عليها من شويه افاقين عواطليه ,,, و اللي كان بيحصل في فب الصعيد ,, ده كان ثار بين الصعايده و الشرطه ,, بسبب اهانه كبار العائلات هناك ,,, طب العيال تابو و خرجوا من السجن ,, ليه بقه طوارئ تاني ,,, انتم لسه ما فهمتوش<br />61 - الي عاشق الاهانة المهان ابن بهانة (حسين حامل)<br />الجلاد|26/05/2008 م، 03:36 مساءً (السعودية) 12:36 مساءً (جرينتش)<br />انت باين عليك من الناس اللي حريمها واصلة بصراحة وبعدين ليك حق تفرح اصل قانون الطوارئ مش مطبق علي الرقصات<br />62 - بالتأكيد ... هذه ليست \"ديمقراطية\" ... وهذا ليس \"مجلس شعب\"<br />محمود المصرى*ّ|26/05/2008 م، 03:36 مساءً (السعودية) 12:36 مساءً (جرينتش)<br />عندما يُطبق \"قانون الطوارىء\" لمدة 27 عاما ... يصبح قانون الطوارىء هو \"القانون العادى \" وبالتالى فليس مستغربا مما يسمى بـ\"مجلس الشعب\" أن يمدده ... أما القانون العادى الذى غطاه التراب ... أقصد القانون الذى كان مطبقاً فى عهد الرئيس السادات رحمه الله فقد أصبح \"مسألة طارئة\" لايريد النظام أن يسمح بها !!! ... تطبيق قانون الطوارىء لمدة 27 عاماً وتمديده , يعنى بوضوح شديد لكل من لديه عقل أن \"النظام الحاكم\" يفتقد إلى القبول الشعبى وبالتالى هو يفتقد للشرعية , ويستعيض عن ذلك بفرض حالة الطوارىء طول الوقت ليفرض بها نفسه على شعب لا يقبل به... \"حالة الطوارىء\" تعنى فى الواقع أن هناك ظرفا إستثنائيا يستوجب معالجة سريعة خاصة لا يفى بها القانون العادى فيتم تجاوزه إلى قانون الطوارىء ... فهل 27 عاما فترة إستثنائية؟! ... هل هناك ما إنشغل النظام بمطاردته 27 عاما وترك الشعب ليغرق فى المشاكل والأزمات؟! ... أما تمثيلية \"مجلس الشعب\" الذى وافق على تمديد الطوارىء , فأعتقد أنها أصبحت مكشوفة ومعروفة للجميع ... وأنا هنا أقصد \"الأغلبية\" التى تمرر القوانين التى يريدها النظام , وتستطيع بالتصويت أن تحرم الحلال وتحلل الحرام !!! ... أليسوا أغلبية؟! ... هؤلاء لا يمثلون الشعب ... هؤلاء يمثلون مصالحهم على حساب مصالح الشعب ... لا يمكن إدعاء الديمقراطية والحرية هنا فنحن أبعد ما نكون عن الديمقرطية الحقيقية ... فالديمقراطية تعنى إختيار الأفضل من أجل تحقيق الأفضل ... كما أن الحرية تعنى التعبير عن الرأى بما يسمح للخيارات الصحيحة بمزاحمة الخيارات الخاطئة ومنعها من المرور إلى حيز التطبيق وما يجرى هو عكس ذلك ... ليس لدينا لا ديمقراطية ولا حرية وليس لدينا أى أمل فيما يسمى بـ\"مجلس الشعب\" ... لكن يبقى الأمل موجوداً فى الله وفى الشعب ... أن ينهى فترة \"إستثنائية طارئة\" إستمرت 27 عاماً ... ما زالت تريد أن تمتد.<br />63 - معك حق هايدي من المهندسين<br />قارئه|26/05/2008 م، 03:41 مساءً (السعودية) 12:41 مساءً (جرينتش)<br />البدله بتاعه قانون الطوارئ ملبوسه من 27 سنه حتي ما اتغسلتش لما شكلها بقي فظيع .فقالوا للترزي يعمل واحده تانيه تكون اوسع شويه بس الظاهر لسه ما خلصتش فقالوا يستنوها. و لا عايزين النظام يقعد مكشوف.<br />64 - اكيد لازم يتمدد<br />وائل المصرى|26/05/2008 م، 03:44 مساءً (السعودية) 12:44 مساءً (جرينتش)<br />اكيد لازم يتمدد مع انا مفيد شهاب ورئيس الحكومه اكدوا اكتر من مره انه مش هيتمدد بس كلنا عارفين انهم لازم يمددو حاله الطوارئ اما الاخ حسين كامل انه هقولك ليه معظم الشعب المصرى ضد التوريث علشان الحصاد عارف حصاد ايه حصاد 52 سنه حكم وده مش من عندى دة من مركز الاهرام للدرسات وده حكومى على فكره حصاد 25 سنة من حكم مبارك ( إحصائيات مجدّدة من مؤسسة الأهرام من مصر ) الأحوال المالية الديون : إجمالي 614 مليار جنيه الفقر : 35% من الشعب تحت خط الفقر,أقل من1 دولار في اليوم النقود المهربة : 300 مليار دولار خرجت من البلاد الجنيه المصري : الدولار كان سعره 85 قرش سنة1981م .. وأصبح 6 جنيهات سنة 2005 م الأحوال الصحية السرطان : تضاعف 8 مرات ..أعلى نسبة في العالم الذبحة الصدرية :20 % من الحالات شباب تحت الأربعين البلهارسيا : أعلى نسبة في العالم السكر : ‏7‏ ملايين .. ‏10 %‏ تقريبا من عدد السكان التهاب كبدي : 13 مليون.. 20 % من الشعب فشل كلوي : أعلى نسبة في العالم شلل الأطفال : موجود في 6 دول في العالم فقط منهم مصر الاكتئاب : ‏20‏ مليون مواطن [والمصابين بأمراض نفسية أخرى : ‏6‏ ملايين] التدخين : 80% من البالغين مدخنين التلوث : أعلى نسبة في العالم...تلوث للهواء ومياه الشرب والتدهور في التربة والمناطق الساحلية..خسائر 30 مليار جنيه الإنفاق الحكومي 10 دولار للفرد سنوياً الأحوال الاجتماعية القضايا : 20 مليون قضية بالمحاكم .أقدمها من 38 عام حتى الآن البطالة : 29% من القادرين على العمل..حوالي 5 مليون شاب الانتحار : 3 آلاف محاولة سنوياً حوادث الطرق : 6 آلاف قتيل سنويا و 23 ألف مصاب الطلاق : 28% من حالات الزواج سنوياً .. 20% في العام الأول العنوسة : 7 مليون عانس .. 4 مليون فوق 35 عام الهجرة : 4 ملايين مهاجر : 820 ألفاً من الكفاءات و 2500 عالم في تخصصات شديدة الأهمية.. 6 ملايين طلب هجرة للولايات المتحدة وحدها سنة 2005 التعليم : دروس خصوصية ، كتب خارجية ، جامعات خاصة للربح فقط عمالة الأطفال : نصف مليون طفل أطفال الشوارع : تقرير الأمم المتحدة : 100 ألف طفل عشوائيات : 45% من الشعب يسكن العشوائيات.. 35 منطقة عشوائية بالقاهرة فقط موظف الحكومة : تحت خط الفقر ويؤخذ منه ضرائب (ستة جنيهات متوسط دخل الموظف يومياً) المخدرات : 6 مليار دولار سنوياً في تجارة المخدرات الأُمية (الحالية) : 26% من الشعب المصري الأُمية (المستقبلية) : 7% من الأطفال لا يدخلون المدارس بسبب الفقر ..غير الهاربين بعد الدخول مشاكل أخلاقية رشوة، محسوبية، بلطجة، توريث المهن، عُري، زواج عرفي قتل الأزواج، امتهان وتحرش بالنساء، ألفاظ بذيئة، صحافة جنسية غش جماعي وجريمة و تسول الأحوال السياسية سيطرة وفساد النخبة الحاكمة، مراكز قوى، الإعداد لتوريث الحكم، تزوير انتخابات،قمع المعارضة،اعتقالات، تعذيب حتى الموت،انتهاك لحقوق الإنسان، إلغاء دور النقابات والجمعيات الأهلية مشاريع قومية متوقفة أو خاسرة القضاء على الأمية قبل عام 2000 ، زراعة الصحراء الغربية بالقمح خسائر 10 مليارات جنيه بقطاع الإذاعة والتلفزيون (مشروع اليابان) وادي السليكون، محطة الطاقة النووية، جامعة د/ أحمد زويل (التكنولوجيا) فوسفات أبو طرطور ,وادي توشكى أكثر من 2,3 مليار جنيه خسائر بشركات القطن و 8 مليارات جنيه خسائر شركات الغزل والنسيج و 12 مليار جنيه العجز الإجمالي لسكك حديد مصر الأزمــــــــــــــات فساد ,تعليم، إسكان، زواج، بطالة، صحة، أخلاق، ضمير، مرور، مياه نظيفة، صرف صحي، البناء على الأرض الزراعية، تصحر، زحام، غلاء, انخفاض احتياطي النقد الأرض الزراعية تم تجريف مليون و200 ألف فدان أرض خضراء من 5000 سنة من أصل 6 مليون فدان الأمن والشرطة قانون الطوارئ : 25 سنة طوارئ في خدمة الشعب :: ولـكِ الله يا مـصـــر ::<br />65 - ارنيه وافتخر<br />roro|26/05/2008 م، 03:47 مساءً (السعودية) 12:47 مساءً (جرينتش)<br />اساسا الاردن احلى من مصر بكتيييييييييير اصلن بتستاهل ما بيعرفو يربو وكمان عم بتقولو انو اليتيم ما بيجي الا بالعين الحمره تعرفو انو اليتيم احسن من وجوهكم يالمصرين روحو شوفو الاردن ما احلاها احلى منكم ههههههههههه بااااااااااااااااي<br />66 - بلاش قطر المرة دى علشان ما تزعلوش<br />أم الزهراء ..... مصر العربية الإسلامية |26/05/2008 م، 03:49 مساءً (السعودية) 12:49 مساءً (جرينتش)<br />لنتعلم من دولة أخرى .... هى الكويت .... إنظروا إلى إنتخاباتها ..... تعبر عن إرادة شعبها بالفعل .... حتى لو لم تُرضى هذه النتائج حكام الكويت ..... ((( مش إحنا التزوير شغال فى كل الإنتخابات .... برلمانية ... أو محليات ))) ..... ليتعلم برلماننا ..... من برلمان لبنان ....... إنظروا كيف كان التصويت بالأمس على إنتخاب العماد ميشيل سليمان ...... ((( صندوق زجاجى .... و بالإسم ))) .... من عندنا برفع الأيدى .... و موافقون موافقون ........ تعلموا من الكويت و من لبنان ..... أصبحنا أضحوكة فى العالم ..... حرام عليكم ..... عايز إيه يا حزب يا وطنى ؟؟؟ .... عايز تخربها ؟؟؟ .... خربت خلاص ..... سيبونا بقى ... حلوا عنا .<br />67 - احمد زى سيد احمد<br />احمد من مصر |26/05/2008 م، 03:51 مساءً (السعودية) 12:51 مساءً (جرينتش)<br />ببساطة ليس هناك فرق بين الدولة بالطوارئ او من غير الطوارئ لان اى واحد يقل ادبة بياخد على دماغة وانتم عارفيين كده يعنى دا حاجة شكلية ليس الا هو لما يحب يجيب سيادتك فى اى وقت ويحاكمك على اى حاجة عملتها او لم تعملها حد حايقوله انت بتعمل اية اشتروا دماغكم ياجماعة هى دى الديموقراطية عندنا فى الوطن العربى واخيرا اعاتب على كل نواب الشعب المصرى حكومة ومعارضة واسألهم هل انتم من الشعب وممثلى الشعب اين ضمائركم ؟اعرفوا ان الحجر الداير لابد من لمسة وسوف تذوقوا ان شاء الله ظلم تصرفاتكم وموافقاتكم ربنا يحمى الشعوب العربية من الغوغاء والدهماء والسفهاء من اصحاب السياسة والنفاق<br />68 - الخوف عشش فينا يامصريين<br />خايف من أمن الدولة|26/05/2008 م، 03:52 مساءً (السعودية) 12:52 مساءً (جرينتش)<br />الخوف - الفزع - السلبية - ........................ كلها نتاج ..................... سؤال فى امتحان اتمنى الاجابة عليه بصراحة<br />69 - يارب<br />مصرية|26/05/2008 م، 03:52 مساءً (السعودية) 12:52 مساءً (جرينتش)<br />يارب الشعب المصري ح يتحمل إيه والا إيه زيادة أسعار في السلغ الغذائية وزيادة رسوم المدارس ومسؤولين شيمتهم الكذب<br />70 - إلى 46 خالد<br />محمد اسكندراني|26/05/2008 م، 03:58 مساءً (السعودية) 12:58 مساءً (جرينتش)<br />كم انتا جميل يا اخي ... أقول لك نعم أبشر الشعب المصري الان أكثر من اي وقت آخر سيكون قادر على كنس الاستبداد وعصور الظلام والتخلف لكي يرجع لمحيطه العربي الذي نحن جزء منه ... سوف ترجع الشقيقة الكبرى يا خالد كما كانت في زمن ابو خالد (عبد الناصر) الزمن الجميل ولاكن هذه المرة ليست قومية تقليدية لأ بل قومية ديمقراطية تراعي حقوق الانسان وتعمل على تداول سلمي للسلطة وتأكد سوف تبدأ العدوى......... تحياتي لك أخ عربي شقيق..... أرفع راسك يا اخي انتي عربي خليجي<br />71 - tany<br />mohamed|26/05/2008 م، 03:59 مساءً (السعودية) 12:59 مساءً (جرينتش)<br />tany tany tany rag3een lilnaaar min taaaaaaaany<br />72 - 27 سنه طوارئ و لسه !!!!!!!!!!!<br />المصرى الأصيل|26/05/2008 م، 04:00 مساءً (السعودية) 01:00 مساءً (جرينتش)<br />المرتبه الأولى على مستوى العالم فى (( الديكتاتوريه )) ... هل يوجد بلد فى العالم فرض الطوارئ عشرات السنين و لسه لا يعلم أحد متى ستنتهى هذه الغمه ... يبدو أنه نظام حكم لا يستطيع أن يستمر بدون طوارئ ... ألم يعلم أن ضباط الشرطه يستغلون هذا القانون المشبوه فى التنكيل بالأبرياء و سمعة مصر فى مجال حقوق الإنسان قد تدنت إلى أدنى مستوياتها .. و من تنتهى مدة عقوبته فى السجن يتم أعتقاله قبل أن يخرج منه حتى لو كان بريئا و منهم أستاذ الجامعه و المهندس و الطبيب و المدرس و التاجر الشريف ......... إلخ لسبب واحد أنهم سجناء رأى ...أما لصوص البلد و المرتشين و تجار الممنوعات و المحرمات فلا خطر منهم على البلد أو بمعنى أدق على حكام البلد ... لماذا كل هذا الظلم للمصريين ؟؟ عموما العيب ليس على الحكومه و لا لوم عليها و لكن العيب على المنافقين و شياطين الإنس الذين يزينون الشر و كإنه الخير و حسبنا الله و نعم الوكيل .................<br />73 - للي مشافش<br />مشاهد يعلق|26/05/2008 م، 04:03 مساءً (السعودية) 01:03 مساءً (جرينتش)<br />للي مشافش عيوب قانون الطوارئ.. عذرك معاك. اللي بيقول قانون الطوارئ مضرنيش اكيد مدخلش القسم وشاف حد عينيه معصوبين ومضروب زي البهيمة ومنفوخ ولا سمع عن الناس اللي بتموت في الاقسام ولا عن الناس اللي بتختفي ولا عن الناس اللي بتتلم عليها بلطجية تطلع البلا الازرق على جتتهم ولا شاف الامن المركزي وهو طايح في الناس ولا ليه قريب في السجن بدون داعي ولا حد زاره بالليل وجابه من قفاه. ايوة عندك حق لأنك في الغالب لا بتروح اقسام ولا بتتعامل مع حد من اساسه من اجهزة الدولة المحترمة. وسلم لي على اللي مشافش.<br />74 - GG<br />GG|26/05/2008 م، 04:09 مساءً (السعودية) 01:09 مساءً (جرينتش)<br />اشكرا االخوة ( محمود المصري تعليق رقم 54 ) والاخ ( وائل المصري تعليق رقم 58 ) واقول كفيتم ووفيتم وشكرا على الطرح المتميز!!!<br />75 - صاحبة البرج العاجي<br />واحد من الناس|26/05/2008 م، 04:10 مساءً (السعودية) 01:10 مساءً (جرينتش)<br />للجماعة اللي متفقين مع تمديد الطوارئ لما هي مش ح تفرق مد أو إلغاء طيب بنمده ليه وهو موجود ليه ياصاحبة الراي رقم 1 ياليتك تتطلعي على قوانين العالم اللي منها قانون الطوارئ وسبب وضعه ومدته أقلها وأقصاها داحنا بقالنا 27 سنة منذ وفاة الرئيس السادات يعني أيام السادات مكنش موجود وأيام عبد الناصر لم يكن موجودا أقصد طوال فترة حكمهم يبقي ليه واحد جاي من أول يوم حكم لغاية ما ربنا يطول لنا في عمره كمان وكمان عمال يمده بهذا المد التاريخي لقانون صفته أنه طـــــارئ ده لازم يدخل موصوعة جييز الا بالمناسبة يارقم واحد أنت ومؤيديك 00000إيه أخبار الأسعار والزيادة في مصاريف المدارس ولو حد عندك تعبان بتعالجيه كويس والأ كل ده ماإنتش حاسه بيه ربنا يزيدك من العقل عقل<br />76 - قانون حماية الفساد<br />AHMED IRELAND|26/05/2008 م، 04:14 مساءً (السعودية) 01:14 مساءً (جرينتش)<br />قانون الطوارئ لخدمة أمن الحكومة والحكام .. أى أن وزارة الداخلية تستطيع أن تعتقل أى مواطن فى أى وقت وبدون ابداء الاسباب .. أى أن قانون الطوارئ غطاء للقمع والاعتقالات ومنح جهاز الشرطة الفاسد أصلاً أن يتمادى فى الفساد وبالقانون<br />77 - يا عم جت على ده مهى بايظة فى كل حاجة<br />مصرى مسلم|26/05/2008 م، 04:15 مساءً (السعودية) 01:15 مساءً (جرينتش)<br />مصر هى صاحبة السجون مصر صاحبة المعتقلات من ايام فرون بيه لقوله لسيدنا موسى لاسجنك<br />78 - الأخوان هم السبب<br />مصرى جدا|26/05/2008 م، 04:24 مساءً (السعودية) 01:24 مساءً (جرينتش)<br />وجود جماعة الأخوان ..وخوف الحكومة من غدرهم ..هما السبب فى تمديد الطوارىء..والحكومة مقصرة كثيرا تجاه هذه الجماعة ..مرشدهم يؤيد افعال القاعدة ..ومع ذلك تترك الحكومة لهم حرية القاء الخطب فى المساجد وتكوين مجموعات تدعو لأفكارهم وتتمسح فى الأسلام لتجذب البسطاء من الشعب الذين لا يفهمون ما الفرق بين التدين"
