subject = "قانون الفلكة او قانون بديعة مصابنى"
author = "ابو طارق"
posted = "2008-05-26"
text = "قانون الطوارىء<br />يا ريت<br />ضحكتونى وانا عيان<br />انا عايز اى مصرى شريف يقول لى احنا بننحكم بأى قانون<br />يا ريت قانون الطوارىء يطبق بحذافيرة<br />احنا بنحكم بقانون الفلقة - عارفين الفلقة بتاع سيدنا - اللى سيدنا يغضب علية يحط رجلية فى الفلقة ةيرفع قدمية والخيرازانة تهرى رجلية<br />قانون الطوارىء مافيش فية ضابط يحط ايد مقشة فى مؤخرة مواطن<br />قانون الطوارىء مفيش فية واحد يغرق الفين فى عبارة ويخرج من المطار الى لندن بتوصية من كبير<br />قانون الطوارىء مفيش فية ناس تكسب مليارات ومتدفعش ضرايب<br />نحن بدون اى قانون<br />قد يكون قانون بديعة<br />او قانون شفيقة<br />او قانون ارسطو طاليس<br />او قانون التوتو جاى - التوتو جاى"
archived = "2010-03-14"
capture_url = ""

