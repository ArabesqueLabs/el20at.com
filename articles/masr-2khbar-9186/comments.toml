text = "تعليقات حول الموضوع<br />1 - مششش فارقه<br />&--9829; &--9829; مصريه أنـآ &--9829; &--9829; |26/05/2008 م، 01:19 مساءً (السعودية) 10:19 صباحاً (جرينتش)<br />معدتش تفرق انا بصراحه مش شايفه ان قانون الطواريء ضرنا في شيء انا عن نفسي مش حاسه بوجوده وكوني مواطنه مصريه قانون الطواريء ماضرنيش بشيء واعتقد انه اكثر المتضررين منه هم المعارضين السياسيين وعامه ربنا يحفظ مصر ويقدم اللي فيه الخير<br />2 - عن أي طوارئ<br />أصحاب العروش |26/05/2008 م، 01:21 مساءً (السعودية) 10:21 صباحاً (جرينتش)<br />طوارئ ثبات توريث<br />3 - مصري<br />عربي|26/05/2008 م، 01:22 مساءً (السعودية) 10:22 صباحاً (جرينتش)<br />لا حول ولاقوة إلا بالله حسبنا الله ونعم الوكيل<br />4 - وفي روايه عزوبي السالميه<br />كويتي السالميه |26/05/2008 م، 01:23 مساءً (السعودية) 10:23 صباحاً (جرينتش)<br />نعم الفقراء يتوجب ان تريهم العين الحمراء..انا لدي دريول وبستاني وطباخ وعامل نظافه وغساله في منزلي..ومن واقع تجربه نفعت سياسة العين الحمراء التي اتبعتها معهم....انما لما كنت اتعامل معهم بهواده ولين تبعثرت اشيائي بالبيت واكتئبت وتأثر جهازي الشعوري<br />5 - دمى خشبية<br />محمد 11111|26/05/2008 م، 01:23 مساءً (السعودية) 10:23 صباحاً (جرينتش)<br />دا مش مجلس للشعب دا مجلس للخشب دول مجرد دمى بيد الدكتاتور<br />6 - أوباااااااااااااااااااا<br />محمد طلعت|26/05/2008 م، 01:26 مساءً (السعودية) 10:26 صباحاً (جرينتش)<br />أعتقد ان قانون الارهاب اللي المفروض يحل مكان قانون الطوارئ هو الافضل لسبب واحد ان الرئيس وعد مش علشان الاخوة بتوع حقوق الانسان اللي لما واحد منهم البواب بيسرق منه حاجة بيكلم واحد قريبه يجيب اللي سرقه, و لذلك اعتقد ان قانون الارهاب هو الحل<br />7 - تحياتى يااااا رقم (1)<br />طبيب سامر الباشا smasm.1128@hotmail.com|26/05/2008 م، 01:28 مساءً (السعودية) 10:28 صباحاً (جرينتش)<br />انا معاكى يا مصرية عندك حق انا فى الانتظار معا كامل تحياتى<br />8 - الى الاخت مصرية انا؟؟<br />طيحة شموخ|26/05/2008 م، 01:29 مساءً (السعودية) 10:29 صباحاً (جرينتش)<br />مصر هذي اعبرها مثل بلدي ومااتوقع يوم من الايام يحصل مثل ماحصل من تفجير قبل سنوات قليلة الله يحفظها ويحفظ اهلها<br />9 - نعم مع تمديد حالة الطوارئ ..فالمواطن المحترم لايشعر بأي ضرر منها ! .<br />محمد ع. الأسكندرية|26/05/2008 م، 01:31 مساءً (السعودية) 10:31 صباحاً (جرينتش)<br />رغم كوني ديموقراطيا بطبعي و علمانيا و مناصرا لكافة أشكال حقوق الإنسان إلي أقصي حد ممكن إلا أنني أصبحت أتفهم يوما بعد الآخر الحكمة من تمديد حالة الطوارئ في مصر ، و هذا لا يمنع من تحميلي المسئولية \" الشبه كاملة \" للحكومة المصرية في عدم معالجتها للأسباب التي تمدد من أجلها الطوارئ كالتطرف الديني و خلط الدين بالسياسة و بعض حالات الفساد كالعبارة و غيرها ....إلا أنني أرحب باستمرار حالة الطوارئ ...التي لا يمكنني أو أي مواطن عادي في الشارع أن يشعر بها إلا في حالات \" الدوريات المرورية المفاجئة \" فقط ...فالبلد شهد حالات جرائم و اغتيالات سياسية في أوقات من القرن العشرين لم تكن فيها حالة الطوارئ موجودة ...و تقريبا اختفت هذه الجرائم من مصر و الحمد لله مع فرض الطوارئ ...تحية إلي الرئيس \"حسني مبارك\" الذي أحبه و أحترم مواقفه الثابتة ....<br />10 - عاميــــــــن فقط.......<br />مستغرب|26/05/2008 م، 01:32 مساءً (السعودية) 10:32 صباحاً (جرينتش)<br />اجعلهم الى نهايه العمر يا رجل......ما دام في شعب....و شرطه.....و انتخابات مضمونه النتائج......!!!<br />11 - هذه هي الحقيقة<br />جاسم الخفاجي |26/05/2008 م، 01:32 مساءً (السعودية) 10:32 صباحاً (جرينتش)<br />السلام عليكم اخوتي واخواتي الاعزاء مع الاسف الشديد هذا هو حال جميع الدول العربية فمع وصول الحاكم الى المنصب وهو يبدء بكل شيء يستطيع ان يوقف الزحف المتواصل الى السلطة بكل الطرق سواء كانت مشروعة ام غير مشروعة وهذا مع الاسف الحال في مصر العروبه فانها اصبحت ملكية وليست جمهورية وسف نرى في المستقبل القريب ما يدلل كلامي الله يكون في عون الشعوب العربيه على هذا الابتلاء<br />12 - مدة مش طويلة<br />أبو حازم|26/05/2008 م، 01:34 مساءً (السعودية) 10:34 صباحاً (جرينتش)<br />مبروك عليك يا شعب مصر تمديد حالة الطواريء التي استمرت حوالي سبعة وعشرين عاماً، وهي مدة ليست بالطويلة وتكون مصر بهذا الشكل قد سجلت رقماً قياسياً لسريان حالة الطواريء وهذا إنجاز عظيم بكل تأكيد<br />13 - هل هذا معقول ؟<br />أبراهيم زكريا المصري|26/05/2008 م، 01:34 مساءً (السعودية) 10:34 صباحاً (جرينتش)<br />هل هكذا تدار البلاد يا حكام مصر ؟ هل هناك دولة محترمة في الدنيا تفرض على شعبها قانون طوارىء لمدة 25 عاما وتمدده من جديد ؟ حتى أسرائيل عدوتنا جميعا لا تفرض قانونا للطوارىء على شعبها .. ما هذا .. ألا تخجلون ؟ حقيقة لآ أعرف سببا للأستمرار في فرض هذا القانون الا أرضاء السياسة الأميركية .. ولكن ها هو بوش وفي عقر دارنا مصر قبل أسبوعين تهجم علينا وعلى نظامنا فلماذا نسترضيه وما المنفعة من ذلك ؟ أنتم لن تصدروا قانونا لمكافحة الأرهاب ثم تلغون قانون الطواريء بل ستبقون على قانون الطوارىء . حتى قانون مكافحة الأرهاب لا لزوم له فهو أيضا تنفيذا لسياسة أميركا التي والله لا تهتم بنا ولا بمصيرنا ومن يعرف ربما هي تشجع المعارضة وبالأخص جماعة الأخوان المسلمين ليس لأيصالهم للحكم ولكن لأبقاء مصر في حالة \" أضطراب \" وبالتالي في حاجة لدعم أميركا وحتى لا تعمل ولا تفكر في معاداة أسرائيل أو محاربتها . أن في القانون المصري ما يكفي من نصوص واضحة لمحاربة الأرهاب والفساد ةالأخلال بالأمن والتآمر على الدولة .. فيا حكام مصر أعتمدوا على الدستور المصري والقوانين المصرية وألغوا قانون الطوارىء وكونوا مع شعبكم وتطلعاته نحو الحرية والديمقراطية والتنمية الحقيقية واستحوا على أنفسكم .<br />14 - الى 4 الكويتى التافه<br />ابن مصر|26/05/2008 م، 01:37 مساءً (السعودية) 10:37 صباحاً (جرينتش)<br />وانت ما اهلك بينا يابارد ... الموضوع لا يخصك ولا يهمنا رأيك التافه ... ياريت الاخوة العرب اللى عنده كلمه كويسه يقولها واللى ماعندوش يورينا عرض قفاه ... قال عنده طباخ وغسالة وبتنجانه... واحنا مالنا يابارد... هاتحكيلنا قصة حياتك<br />15 - ....... عنوان العربية نت .... مثير للضحك ...... لأنهم لا يملكون سوى الموافقة ..............<br />صائد الأحلام |26/05/2008 م، 01:44 مساءً (السعودية) 10:44 صباحاً (جرينتش)<br />أمر مضحك فعلا ان يقال أن مجلس الشعب المصري وافق على هذا القانون او غيره من القوانين .... انه مجلس الموافقون ... تأتيهم القوانين والقرارات والتعليمات وهم ينفذون فقط .... وكل هذه مظاهر ديمقراطية كدابة ... يعلمها الشعب المصري كله .... ان مصر تعيش في ظل قوانين استثنائية من منذ سبعة وعشرون عاما ... وهى سابقة ليست موجودة في أي بلد محترم في العالم كله .... وهذا يدل ويؤكد على أن مصر تعيش في ظل حكم ديكتاتوري مرتعد .... هزمته أصابع النساء على أجهزة الكمبيوتر ... لقد اعتقلت فتاة مصر إسراء عبد الفتاح بموجب قانون الطواريء .... وكل من قبض عليه في أحداث إضراب 6 ابريل من الشباب الصغير السن ... كان بموجب قانون الطوارىء ... الذين قالوا عنه أنه فقط للإرهاب ولتجار المخدرات .... والحقيقة أنه لجميع الشعب ولكتم وضرب وإسكات الشرفاء والمعارضين للنظام الفاشل الفاسد .. الجاسم على وجه الحياة في مصر منذ عقود من الزمان ... بفضل مجموعة من الجثث القديمة ... أرعبتها عقول الشباب المصري الواعد وأصابعهم الذهبية في جميع المواقع وخاصة في الفيس بوك ... وحتى على جريدة المصري اليوم نجد حاليا تعليقات من جميع رجال ونساء مصر ... تقدم تعليقات ونقد شديد القوة ضد النظام والسلطة على جميع الأخبار ..... إن فتاة الفيس بوك .. بنت مصر إسراء عبد الفتاح لا يعمل الإنترنت على جهازها في منزلها ... رغم أنها أحضرت خبراء في الاتصالات وتحققوا من كل شيء وفعلوا كل شيء دون أي نتيجة .... إنها ممنوعة من استخدام النت .... هل في رعب من أصابع النساء أكثر من هذا ... ولذلك تمديد القانون هو استمرار لحالة الظلم والظلام والضلال والديكتاتورية التي تكسو وجه الحياة في مصر المحروسة بإذن الله ... رغم أنها منكوبة بمسئوليها وحكامها .<br />16 - ما شاء الله على الديمقراطية في مصر !!<br />أحمــــــد يوســـف_الـقـدس الشــريــف،فلســـطيــن |26/05/2008 م، 01:44 مساءً (السعودية) 10:44 صباحاً (جرينتش)<br />ما شاء الله على حالة الديمقراطية في مصر الشعب جائع، و مجلس صورة ! و عبارة عن دمية بيد النظام ، و بعد هذا كله النظام ينظر علينا و يعطينا دروس في الديقراطية و الحرية ، على فكرة مصر من اكثر الدول التي تنتهك حقوق الانسان ... عاشت مملكة مصر العربية قصدي جمهورية مصر العربية...هههههههههههه pal_guy88@yahoo.com<br />17 - do we still belive them<br />ahmad assem|26/05/2008 م، 01:46 مساءً (السعودية) 10:46 صباحاً (جرينتش)<br />i dont know if we still belive what the goverment is saying .. they are doing what they can do .. and when they want to do .. with NO supervison from any body above any body .. so let them say what they say .. THE WHOLE counrty is corrupetd and no way back . its over .. and after that .. they told our youth .. why you left the counrty and immigrated for another counrty .. let them taste their mediceine.<br />18 - تعليق 