subject = "تهزيء واهانة اعضاء مجلس الشعب لا يجوز"
posted = "2008-05-27"
text = "لما يجوز مجلس الشعب دا منتخب وجميع اعضاءه يمثلون الشعب<br />ولما يكون الشعب رافض تماما لقانون الطوارىء<br />يبقى املاء الموافقة على اعضاء مجلس الشعب يعتبر تهزيء واهانة لهم<br />ولا يصح لحكومة محترمة فيها ناس محترمين رئيس الجمهورية كان قائد عسكري كبير ورءيس الوزراء استاذ جامعي سابق ووزير الداخلية كان قائد كبير في الشرطة لا يصح بأي حال من الاحوال اهانة اعضاء مجلس الشعب المغلوبين على امرهم وفرض عليهم هذه الموافقة<br />كان ممكن ان يمرر القرار بدون موافقة مجلس الشعب"
