subject = "وافق مجلس الشعب المصري على طلب الحكومة تمديد حالة"
posted = "2008-05-27"
text = "كلام غبي وفي منتهى الغباء من مجلس الشعب ومن الحكومة ومن الصحافيين اللي نقلوا الخبر<br />وهل مجلس الشعب يملك حق الرفض<br />وما هي القرارات التي اتخذتها الحكومة ورفضها مجلس الشعب<br />مجلس الشعب دا مجلس نفعي الناس رشحت نفسها للمنفعة الشخصية زي اللي بيخش كلية الشرطة علشان خاطر يلبس البلدة ويتعايق بيها<br />كذلك مجلس الشعب كله بيتصارع للدخول فيه علشان خاطر العياقة (الا من رحم ربي) علشان خاطر العياقة والمنظرة والمظهرية<br />وبعدين انا عايز اعرف حاجه ما هي الحكومة بتعمل اللي هي عايزاه من غير حتى قانون الطوارىء يعني لو مفيش قانون طوارءى برضه حتعمل اللي هي عيزاه<br />يبقى لزمته ايه باه يهزقوا اعضاء مجلس الشعب وفيهم 88 من الاخوة المسلمين"
archived = "2010-03-14"
capture_url = ""

