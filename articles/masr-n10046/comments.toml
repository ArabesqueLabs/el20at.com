[[comments]]
order = 9
subject = "شباب اخر تفاهة"
author = "احمدابوصالح_صحفى معارض"
posted = "2007-05-04"
text = "هى الشباب بقت تافهة اوى كدة ولا موضعاتكم الصحفية هى التافهة يعنى سيبين الفساد بقا بطول وعرض مصر ومشاكل بتنخر فى عظام المصريين لا ليها اول من اخر وحضراتكم بتكتبوا عن الشبشب الجامعى بكرة تعملوا موضوع بيروحو بشبشب خدوجة ولا سابوا ارحمونا من الهيافات دية وخلونا فى المهم احسن على قد منا بحس ان الموقع فى مقالات وموضوعات رائعة جداا على قد منا ساعات بحس انة قمة فى الهيافة .....وشكرااااااااااا"
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505022008/http://masr.20at.com:80/newArticle.php?sid=10046"

