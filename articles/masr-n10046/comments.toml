[[comments]]
order = 1
subject = "شكلهم بيض"
author = "أحمد المصري"
posted = "2007-05-03"
text = "إيه القرف ده هى صحيح جامعاتنا فاشلة بس على الأقل لازم شكل الطلبة يبقى مناسب. الصور قميئة جدا عاملة زى ميكون واحد رايح و لا مؤاخذ الكنيف مش داخل محاضرة."
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505022008/http://masr.20at.com:80/newArticle.php?sid=10046"

[[comments]]
order = 2
subject = "اه يا عم محمد"
author = "ابو يوسف"
posted = "2007-05-03"
text = "اه يا عم محمد هو انت كنت عامل الموضوع<br />في الكابانية<br />ولا اية<br />شبشب في الجامعة<br />هههههه<br />بكرة الواحد يروح بالفوطة<br />ولا ممكن نروح بال ..... والبنات بال ....<br />يلا بس لقطه حلوة يا عبد العاطي<br />وربنا يكتر من شباشبك"
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505022008/http://masr.20at.com:80/newArticle.php?sid=10046"

[[comments]]
order = 3
subject = "موضوع متميز"
posted = "2007-05-03"
text = "موضوع ظريف جدا أولا<br />ثانيا بيتكلم عن ظاهرة منتشرة وبكثرة والغالبية بيلاحظوها<br />أجمل ما في الموضوع تميزه ... لأنه سلط الضوء على ظاهرة محدش اتكلم فيها قبل كده<br />وفقكم الله"
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505022008/http://masr.20at.com:80/newArticle.php?sid=10046"

[[comments]]
order = 4
subject = "اخيرا لاقيتك ... الانسان الانوى النادر"
author = "الاسطوره"
posted = "2007-05-03"
text = "بقى بالذمه ده موضوع تقابل بيه ربنا ياراجل .... شبشب ايه بس اللى جاى تقول عليه .... انا مش عارف انتوا بتفتكسوا الموضوعات ديه ازاى منين .. يعنى بعد كده حد يعمل حاجه عن البنشات فى الجامعات وشنط البنات والشجر فى الجامعه و النظافه فيها ؟؟؟ ايه ياعم ديه برضه صحافه ... وبعدين امتى هانبطل محمد بيقول ومنى تؤكد<br />... مش تزعل بس انتا فى غيبوبه ولازم تفوق منها"
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505022008/http://masr.20at.com:80/newArticle.php?sid=10046"

[[comments]]
order = 5
subject = "خير خير"
author = "flona"
posted = "2007-05-03"
text = "انا كنت بسال نفسي يا ترى هل الشباب والبنات دول تافهين من جوة ؟؟<br />لو كدة يبقى المصيبة تكمن هنه فعلا !!"
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505022008/http://masr.20at.com:80/newArticle.php?sid=10046"

[[comments]]
order = 6
subject = "لا الشباب ده مش تافه خالص هوا بس مش لاقى حاجه يعمل"
author = "نهى"
posted = "2007-05-03"
text = "طب وايه المشكله فى الشبشب او السابو دا مش عيب خالص كل حد حر يلبس اللى يعجبه<br />بس بصراحه هوا بيبقى اشيك على البنطلون اكتر من البنتاكور وبرضه كل حد حر"
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505022008/http://masr.20at.com:80/newArticle.php?sid=10046"

