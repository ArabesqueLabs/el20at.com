author = "نظيف ودمج البنوك"
posted = "2009-04-28"
text = "المهم في الموضوع انهم جابولنا عم نظيف لما الاحوال سائت خالص ولقوا ان الحل الوحيد انهم يجيبوا خبير اقتصادي كبير علشان خاطر يحل المشكلة من جذورها فوقع الاختيار على عمو نظيف فعم نظيف جه بقا وبص يمين وشمال وقال الحل هو دمج البنوك هو دا الحل فقالولوا يا عم نظيف دا السادات كتر البنوك علشان خاطر يحل المشكلة الاقتصادية قال لهم لا السادات دا حمار الحل انننا ندمج البنوك وشوفوا ايه اللي حيحصل بعد كده<br />طيب يا عم نظيف دمجنا البنوك وبصينا لقينا عم نظيف نزل الفايدة من 10% الى 6%<br />ليه يا عم نظيف والناس حتعمل ايه قالهم هو كده<br />وبعد كده فوجئنا بازمة رغيف الخبز<br />والمصائب تتوالى علينا بسبب عم نظيف<br />اتوقع ان الحمار اللي حيجي بعد كده حيرجع تاني البنوك على ما كانت عليه<br />بالضبط زي بور سعيد خلوها منظقة حره وبعدين رجعوها تاني<br />والابتدائية خلوها 5 سنين وبعد كده رجعوها 6 سنين<br />ونوجه نداء الى سعادة الرئيس بمناسبة خطابه اليوم<br />شوفلك رئيس وزارة محترم يمسك الوزارة يا عم حسني<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش احمد الهواري ولا عبدالله الطحاوي"
