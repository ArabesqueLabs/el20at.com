text = "البلد مليانة خير<br />الناس اشترت 42 مليون خط تليفون محمول<br />والسيارات المرسيدس فى الشوارع اكتر من المانيا<br />والفلاحين بيأكلوا المواشى الرز مجروش لانة ارخص من العلف - تمن كيلو الارز بقشرة جنية وكيلو العلف ب 2 جنية<br />الخير للركب<br />ربنا ما يجيب مجاعة<br />نحن فى ازهى عصور الخير والديمقراطية<br />وربنا يخللى لنا الريس والناس الشرفاء زى سرور والشريف ويبعد عنا ولاد الحرام زى هنية ونصر اللة<br />وعاشت مصر حرة"
