[[comments]]
order = 0
subject = "واللة ضحكت من كل قلبى"
author = "السيد الحملاوى"
posted = "2008-05-15"
text = "الست دعاء الشامى عندها تطلعات برجوازية<br />عايزة تبقى زى مدام لوليتا سكربيتا<br />السؤال هو - لماذا تجذبك مثل هذة الاعلانات ؟ انا انظر ولا اكمل القراءة فى مثل تلك المسائل<br />وبما انك بنت بلد مثلى ومن نواحى الارض الطيبة - ةسأحكى لك هذة القصة<br />تخرج فى قريتى طبيب بيطرى معتبر ومتخصص فى امور العض والرفس والدجاج والبط وخلافة وحدث ان مرضت معزة لاحدى الفلاحات - فحملت الفلاحة المعزة الى الطبيب البيطرى ليعالجها<br />فشخط فيها البيطرى وقال لها<br />يا ولية قومى ادبحى المعزة واطبخى لحمتها فى الحلة - علاج اية - دة تمن العلاج قدر تمن المعزة عشر مرات<br />الحاجات دى للناس الكبار<br />بتوع البزنس - الرأسمالية الجديدة<br />المستعدة ان تصرف على كلب او قطة عشرات الالاف - انما تصرف على مدرسة فى حى شعبى او قرية فمش ممكن<br />وان هاجمت الاوضاع تبقى شيوعى مارق وعندك حقد طبقى وتسعى لخراب البلد ووجب اعتقالك<br />خلينا مع هموم الفقراء<br />خليهم يروحوا فى ستين داهية بقططهم وكلابهم"
archived = "2010-03-14"
capture_url = ""

