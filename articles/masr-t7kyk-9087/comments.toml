[[comments]]
order = 2
subject = "وايه المشكلة مش فيه كلية اسمها كلية الطب البيظري"
author = "مش لازم"
posted = "2008-05-15"
text = "لما الواحد يربي عنده حيوان اليف زي الكلب والقطة لازم يكون فيه طبيب بيطري يكشف عليه<br />لان ممكن هذا الحيوان يصاب بمرض وينقله للانسان فلازم الحيوانات الاليفة تعرض على الطبيب<br />وبعدين والله فيه كلية اسمها كلية الطب البيظري الطالب بيقعد فيها 5 سنوات بيتخرج طبيب بيطري يعالج الحيوانات<br />تتصوروا بأه ان فيه حاجه اسمها امراض الاسماك واذا ما كنتوش مصدقيني اسالوا اي طبيب خريج كلية الطب البيطري<br />وبعدين المفروض براء قبل ما يترك عشرينات كان كتب مقالة ودع فيه القراء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "مستشفى الدكتور هرمل للحمير المصابة فى بر مصر"
author = "واحد مصرى"
posted = "2008-05-16"
text = "واللة دى مش نكتة<br />اسألوا اى واحد عجوز فى أى قرية هيحكى لكم تلك القصة التى حكى لى واحد فلاح عجوز عنها<br />زمان ايام الاحتلال كان فية مستشفى فى مصر لمعالجة الحمير المصابة بجروح اسمة مستشفى الدكتور هرمل<br />وكان كل فلاح بيخاف يروح السوق فى المدينة او البندر بحمار مجروح من البردعة او الضرب او بيعرج او خلافة<br />كان العسكرى او المخبر بيقبض على الفلاح والحمار معا وياخدوهم مركز الشرطة لاخذ عنوان وبيانات الفلاح المصاب بالطحال والبلهارسيا وفقر الدم ثم يتم ترك الفلاح ليعود الى قريتة والحمار يتم تسفيرة الى مستشفى هرمل ليتم علاجة فى المستشفى على حساب الفلاح الفقير المريض<br />ثم بعد فترة يقبضوا على الفلاح لاخبارة ان الحمار مات وانة مطلوب دفع تكاليف العلاج الباهظة للحمار المسكين او يعود الحمار ومعة فاتورة محترمة اعلى من ثمن العلاج ليدفعها الفلاح<br />كان بعض البيطريين الخواجات يهتمون بصحة الحيوان ولا يهتمون بصحة الانسان الذى لا يساوى شيئا فى نظرهم<br />فيا عزيزتى<br />صدق المتنبى<br />وكم بمصر من المضحكات ولكنة ضحك كالبكا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "يعقد اليوم فى شرم الشيخ مؤتمر دافوس يحضرة جمال مبا"
author = "مسرور السياف"
posted = "2008-05-17"
text = "نشرت جريدة المصريون انة اليوم يعقد مؤتمر دافوس فى شرم الشيخ ويحضرة الاستاذ حسين سالم والمهندس احمد عز والاستاذ جمال مبارك وانا ليس لدى اعتراض على حضور احد بل اكن للجميع كل احترام<br />ولكن ما يغيظنى ويوجع قلبى هو التكلفة<br />تكلفة المؤتمر 20 مليون دولار<br />وتكلفة حراسة رؤساء ووفود عشرين دولة 10 ملايين دولار كحراسة وتأمين وفنادق واكل وصرمحة<br />لماذا نطلب عقد تلك المؤتمرات عندنا<br />كتر فلوس<br />عايزين نتصور فى التلفزيون مع الناس<br />الفلوس دى لية ما نشتريش بيها خبز للناس<br />وبدل ما نزود الديزل والبنزين على خلق اللة ونعكنن عليهم عيشتهم - نوفر الفلوس دى<br />هل هناك سفة فى ادارة الدولة<br />مجلس الشعب فين يحاسب الناس دى<br />الجهاز المركزى للمحاسبة بيعمل اية<br />اتقوا اللة فى فلوس الغلابة ا"
archived = "2010-03-14"
capture_url = ""

