text = "ههههههههههههه<br />والله عجبتني في تركيزك واشكرك على الاهتمام باخباري<br />انا الحمد الله ربنا رزقني ببنت واسمها\"مليكة\"<br />والبراء بطل يكتب في عشرينات لانه مهتم الان باخراج الافلام الوثائقية في احدى شركات الانتاج واذيع له مؤخرا فيلم(المدونو الصحفيين الجدد\" على قناة الجزيرة<br />اهوه جاوبت على الاسئلة"
