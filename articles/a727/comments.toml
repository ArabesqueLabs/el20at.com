[[comments]]
order = 11
subject = "واحد رخم"
text = "فقر ايه اللى انت جاى تقول عليه .. يا ابنى ما فيش فقر ولا حاجة دى كلها اوشاعات مغرضة وانت كمان شخص مغرض وعاوز تسوء سمعة مصر والدليل على كده انك حذفت عده امثال مهمنة خد مثلا -- مافيش فقر فيه قلة رأى - وهو ما يعتى ان الفقير هو اللى عامل فقرة باديه .. وكمان حذفت مثل اهم --- الشاطرة تغزل برجل حمارة --<br />وبضم هذه الامثال لبعضها وتخريجها يبقى حضرتك راجل مفترى والناس الفقرا دولم هما اللى يستاهلوا وهما اللى فقرية وده يدينا مؤشر انك فقير دقة وهو ده اللى غايظك من الفقر"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043938/http://www.20at.com:80/article.php?sid=727"
