[[comments]]
order = 7
subject = "القيصر"
text = "الموضع كويس جدا يا استاذ على عبدالمنعم<br />من ثلاث سنين كنت رايح أزرو خالي في مستشفى تبع التامين الصحي....اول مره دخلت المستشقى لقيت على بابها راجل مرمي..وباين عليه تعبان.<br />جيت كمان اسبوع جيت المستشفى ازرو خالي تاني ...لقيت نفس الراجل مرمي في مكانه ولحظت ان في انتفاخ في رجله اليمين..قولت لدكتور في المستشفى على الراجل ده....قالي قريب هندخله المستشفى.<br />بعديها بيومين خالي كان طلع من المستشفى ..بس انا روحت عشان اشوف دخلوا الراجل ولا لسه.<br />للاسف روحت لقيتهم مكلفتين جثته ببطانيه وبيبعدوها عن المستشفى.<br />والله ا نا عمري ما انسى الموقف الي حصل للراجل ده من البلد دي ما حييت.<br />هو مش من حقه يتعالج ولا اك منه فقير."
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043938/http://www.20at.com:80/article.php?sid=727"

