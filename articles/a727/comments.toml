text = "انت بتقول فيها يا قطوب يا خويا؟.. المقال بجد حلو لدرجه تخض.. يكونش هوه ده سبب اختفاء علي بقاله كام يوم من النت؟:D<br />حد يشوفلنا علي فين يا جدعان.. الصحاب وقت الشده برضه.. و السجن للجدعان.. و عوضنا على الله..!!"
