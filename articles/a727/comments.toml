[[comments]]
order = 2
subject = "اللي حصل لأبو علي ;)"
text = "زار الرئيس المؤتمن<br />بعض ولايات الوطن<br />و حين زار حـيّـنـا<br />قال لنا :<br />هاتوا شكواكم بصدق في العلن<br />و لا تخافوا أحدا .. فقد مضى ذاك الزمن .<br />فقال صاحبي حسن :<br />يا سيدي<br />أين الرغيف و اللبن ؟<br />و أين تأمين السكن ؟<br />و أين توفير المهن ؟<br />و أين من يوفر الدواء للمريض بلا ثمن ؟<br />يا سيدي<br />لم نر من ذلك شيئا أبدا .<br />قال الرئيس في حزن :<br />أحرق ربي جسدي !!!<br />أكل هذا حاصل في بلدي ؟!!<br />شكرا على صدقك في تنبيهنا يا ولدي<br />سوف ترى الخير غدا .<br />و بعد عام زارنا<br />و مرة ثانية قال لنا :<br />هاتوا شكواكم بصدق في العلن<br />و لا تخافوا أحدا .. فقد مضى ذاك الزمن .<br />لم يشتكي الناس..<br />فقمت معلنا:<br />أين الرغيف و اللبن ؟<br />و أين تأمين السكن ؟<br />و أين توفير المهن ؟<br />و أين من يوفر الدواء للمريض بلا ثمن ؟<br />معذرة سيدي..<br />و أين صاحبي حسن؟؟"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043938/http://www.20at.com:80/article.php?sid=727"

[[comments]]
order = 3
subject = "بحر بلا شطآن"
text = "دائما ما نعطى غطاءا شرعيا لمساوينا بالقول ان الفقر مش عيب والعبد فى التفكير والرب فى التدبير واصرف مافى الجيب ياتيك مافى الغيب وخلليها على الله فى الحقيقه يا ساده ان تفشى الفقر فى مصر هو ناتج لعده عوامل منها الفساد الذى وصل للركب عاى حد قول احد النواب وسوء توزيع الموارد وشيوع قيم سلبيه كثيره ورثناها من عصورالانحطاط كالكسل والتواكل والسلبيه والاناماليه وياتى فى اول الاسباب واخرها البعد عن الدين بمفهومه الصحيح الذى يدعو الناس الى العمل والسعى فى الارض"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043938/http://www.20at.com:80/article.php?sid=727"

[[comments]]
order = 4
subject = "من تسنيم اسمع يا باشا\"انت مجرم ولازم تتسجن فو"
text = "يا قوم لا تتكلموا ان الكلام محرم<br />ودعوا التفاهم جانبا فالخير أن لا تفهموا<br />نامواناموا واشبعوا ما فاز إلا النوم<br />يا شباب الناس مطحونة وانتوا عارفين اللي بيتكلم بيروح فين فاحنا عندنا منطقة واسعة جدا وراء الشمس في مصر اللي مش هايحترم نفسه ويسجد للواقع ويعترف انه كفايه انه عايش هايسكن فى المنطقة دي فورا<br />عجبي"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043938/http://www.20at.com:80/article.php?sid=727"

