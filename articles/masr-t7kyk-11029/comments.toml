text = "هناك راي بيقول ان الدولة لاتريد ان تعلن عن عدد المسيحيين خوفا على مشاعرهم<br />والبابا شنوده بيقول ان عددهم 12 مليون وهو كذاب<br />مصر عددها 80 مليون يعني نقول 70 مليون مسلم و12مليونمسيحي<br />يعني كل 7 ما شيين في الشارع فيهم 1 مسيحي<br />يعني كل 7 شقق فيهم شقة مسيحية<br />وهذا غير حقيقي على الاطلاق<br />انا متهيألي كل 50 واحد فيهم واحد مسيحي"
