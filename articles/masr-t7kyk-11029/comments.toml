subject = "الكتب الاجنبية سعرها نار"
author = "يزوم"
posted = "2009-01-23"
text = "مكتبات الجامعات اشترت بعض الكتب الاجنبية باسعار مولعة كمراجع للطلبة - ومعظم الجمهور بيتفرج ويقلب فى الكتب ولا يشتريش غير الكتب الدينية الرخيصة والمطبوعة طبعات شعبية - اما كتب القصاصين زى كتب نجيب محفوظ وعبد الحليم عبد اللة وتوفيق الحكيم ويوسف السباعى ويوسف ادريس فلا احد يلتفت اليها ولا تجذب انتباة الشباب الصغير الذى يجذبة كتب الكمبيوتر ومجلات الالعاب games والكتب الدينية التى تباع باسعار رخيصة وطبعات شعبية واشهرها تفسير القران للشيخ الشعراوى"
