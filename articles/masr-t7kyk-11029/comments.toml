subject = "الى المعلق السابق - التعليقات الاستفزازية"
author = "مصرى"
posted = "2009-01-24"
text = "هناك اتجاة من نصارى للتضخيم من حجمهم واظهار انهم اكثرية وبحجم يفوق حجمهم المتواضع جدا<br />انا مثلا لم ارى مسيحى مصرى فى حياتى الا فى المدرسة الثانوية<br />حيث كان فى مدرستى الثانوية بالكامل وعدد طلابها 800 طالب غير 6 طلاب مسيحيين<br />ولم اراهم لا فى الابتدائى ولا فى الاعدادى لان قريتى ليس فيها نصارى على الاطلاق<br />الظاهرة انهم يضخمون نفسهم اكثر من اللازم<br />وهم اقلية متواضعة جدا<br />وعندهم عداء لكل مصرى متدين<br />ومنعزلين فى قوقعة وعندهم جبن وراثى شديدا"
archived = "2010-03-14"
capture_url = ""

