subject = "الاخوان المتأسلمين"
author = "حسين كامل"
posted = "2009-01-22"
text = "جاء فى المقال (( اصطف أفراد الأمن حول المسجد بين السيارات المصفحة، وذلك لتجنب أي تجمهر أو تظاهر للإخوان المتأسلمين )) للحق انا فى غاية الاستغراب من موقف السيد الرئيس حسنى مبارك !! لماذا يتساهل مع تلك الحركة الارهابية المتأسلمة !! الشارع المصرى يتمنى من الرئيس مبارك ان يقضى عليهم ولا يكفينا ان نقراء كل فترة عن القاء القبض على بعض من عناصرهم فهذا لا يكفى طالما راس الحية موجود واقصد برأس الحية كوادرهم التى تسكن قصور التجمع الخامس .. اقضى عليهم يامبارك وانظر ماذا فعل فرعهم فى غزة والمسمى بحماس من تدمير لغزة وشعب غزة ."
