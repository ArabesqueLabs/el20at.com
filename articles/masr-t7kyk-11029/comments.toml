[[comments]]
order = 5
subject = "الاخ بتاع التعليق الاول المدعو حسين كامل"
author = "سعيد سعدون"
posted = "2009-01-23"
text = "انا عايز اسالك سؤال -- هو اللى عايز ينضم للاخوان يروح فين يسجل اسمة<br />مفيش حاجة رسمية ولا تنظيمية اسمها اخوان ولا لها مقرات ولا اماكن بيجتمعوا فيها<br />دى شعور شعب مسلم فية بعض افراد عندهم نشاط زائد شوية فى خدمة الناس وهم موجودين فى كل مكان فى الشعب المصرى المسلم<br />عندك معرفة باماكن تواجدهم<br />ببساطة وعلشان تريح نفسك الاخوان هم الشعب المصرى كلة - عدا طبعا الاقلية الضئيلة النصرانية - اقلية زى المسلمين فى لندن مثلا<br />سلام يا متحذلق"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "المدعو حسين كامل الشهير بسلومة الأقرع"
author = "المصرى أفندى"
posted = "2009-01-23"
text = "المدعو حسين كامل زى البهلوان بيتنقل بين المواقع الألكترونية مخصوص علشان يستفز الناس فيشتموه. بيحب يتشتم وبيشعر بالسعادة الشديدة لما يتهزأ. وهو يبدو موظف فى الحزب الواطى أياه اللى لامم البطجية واللصوص والرقاصيين والأنتهازية. ليس دفاعا عن الأخوان واللا الأقباط ولكن ليس من حق أى خول أنه يوزع صكوك الوطنية والشرف وخصوصا اللى فقدوا الوطنية والشرف وشافوا ذبح الأطفال والنساء ولم ينقح عليهم ضميرهم لأنه خلاص مات . ورجعوا تانى يقابلوا القتلة ولا كأن كان فى مذبحة. وبدل ما تشتم الأخوان ياحيوان (مع الأعتذار لجميع الحيوانات) روح أتبرع لك بشوية دم للضحايا واللا صحيح نسيت دا أنت ما عندكش دم.... أتفوووو."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
posted = "2009-01-23"
text = "الى السيد / سعيد سعدون تحية طيبة ,, جاء فى ردك (( انا عايز اسالك سؤال -- هو اللى عايز ينضم للاخوان يروح فين يسجل اسمة<br />مفيش حاجة رسمية ولا تنظيمية اسمها اخوان ولا لها مقرات ولا اماكن بيجتمعوا فيها)) لا ياسيد سعيد لهم مقر دائم فى المنيل يسمى بمكتب الارشاد ولهم اجتماعات اسبوعية بقيادة مرشدهم مهدى عاكف الساكن والمقيم فى قصر من قصور التجمع الخامس !! وهل تعلم ان مرشد الاخوان المتأسلمين دخل ضمن قائمة اغنى خمسين رجل فى العالم !! وهل تعلم ايضا ان مرشد الاخوان المتأسلمين الطامح فى الاستيلاء على حكم مصر هو مدرس العاب ابتدائى سابق !! وهنا السؤال لكل متعاطف مع الاخوان المتأسلمين اقول لهم ماذا فعل الاخوان المتأسلمين لمصر طوال ثمانون عاما منذ ظهورهم الاول !! اقول ,, قاموا باغتيال وقتل العديد من الوزراء ابتداء من عهد الملك فاروق وحتى اليوم , قاموا بالعديد من التفجيرات والمجازر داخل مصر وكلنا نتذكر تفجير مدرسة منسية البكرى ونتذكر مجزرة الكلية الفنية العسكرية بقيادة الاخوانى المتأسلم صالح سرية ونتذكر مقتل الشيخ الذهبى بدم بارد تحت اوامر الاخوانى المتأسلم شكرى مصطفى وكلنا نتذكر محاولة اغتيال نجيب محفوظ , ودعك من كل هذا فالسجل الاسود طويل واكتفى بان تلك الجماعة المتأسلمة تعمل على تقليب الشعب ضد الحاكم بداية من الفاروق الى الرئيس جمال عبد الناصر ومحاولة اغتيالة فى المنشية ثم الرئيس انور السادات واغتيالة فى حادث المنصة ثم الرئيس مبارك ومحاولة اغتيالة فى اديس ابابا ,, اى ان كل ملوك ورؤساء مصر لايصلحوا من وجهة نظرهم والاصلح للرئاسة هو مدرس الالعاب الابتدائى القابع فى التجمع الخامس !! واخيرا ماذا قدم الاخوان المتأسلمين لمصر !! لا شى غير التخلف والجهل ولعودة بنا الى عصور الظلام فلم نرى منهم غير الحجاب الاخوانى والدقن والجلباب !! هل لديك اى انجاز لهم غير اونطة والدجل والضحك على الذقون .. شكرا ولك منى اطيب تحية .. اما السيد / المصرى افندى فارجو الا تقارن بين الحزب الوطنى وجماعة الاخوان المتأسلمين لان الفرق شاسع وكبير انه حزب تحت قيادة الرئيس حسنى مبارك لا تنظيم ارهابى تحت قيادة مدرس العاب ابتدائى !! ثانيا من ردك واسلوب الكلام وبعض الكلمات البذيئة تيقنت انك اخوانى حتى النخاع فكان الله معك وكان الله فى عونك واتمنى ان تعود الى رشدك وتترك تلك الجماعة التى لن تجنى من خلفها غيرالمتاعب ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "مصر يا ابنى هى الاخوان المسلمين والاخوان المسلمين"
author = "الى حسين كامل الشهير بزخارى"
posted = "2009-01-23"
text = "عجبك او مش عاجبك<br />الاسلاميون تحت احتلال امريكا يحكمون بغداد<br />وتحت احتلال امريكا فى افغانستان يحكم الاسلاميون<br />وهم قادمون<br />لانهم الانقى والاطهر والاشرف<br />فاستعد انت والوطنى للجان ستشكل قريبا اسمها لجان اجتثاث الوطنى على وزن لجان اجتثاث حزب البعث العراقى<br />تلك هى السياسة الامريكية القادمة<br />وامريكا هتنفذ سياستها فى مصر زى العراق وزى افغانستان"
archived = "2010-03-14"
capture_url = ""

