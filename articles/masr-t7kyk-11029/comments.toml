text = "بعد تشرزم الاحزاب وتجميدها<br />وبعد انتشار الجماعات الهدامة والتامرية مع الصهيونية فى المهجر وخلافة<br />تبقى لمصر الحركة الشعبية للاخوان كدرع وحيد لمصر - جماعة شريفة - تضم نخبة المثقفين المصرية من الاطباء والمهندسين واساتذة الجامعات والنخبة المثقفة فى مصر<br />وليخبط براسة فى حائط من لا يعجبة هذا"
