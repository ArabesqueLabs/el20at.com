text = "اول ما تدخل من الباب - تلاقى تفتيش ذاتى كانك مسافر من المطار وهناك شرطة نسائية لتفتيش الحريم<br />وعدد عساكر وضباط الشرطة اكتر من زوار المعرض<br />واللافت ان كل واحد بيدخل المعرض بيسأل نفسة السؤال دة<br />هو النظام مرعوب من اية<br />بيرتعش من اية<br />خايف من اية<br />سؤال يمكن الاخ حسين كامل يجاوب علية"
