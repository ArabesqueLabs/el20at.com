[[comments]]
order = 0
subject = "لا دة قر بقى"
author = "صرى عادى"
text = "اتركوا الرجل يدعوا الى سبيل ربة بالحكمة والموعظة الحسنة<br />انتم بتوع الدستور ما لكم دعوة بية<br />خليكم فى حالكم وناكفوا فى السياسة"
archived = "2007-11-08"
capture_url = "https://web.archive.org/web/20071108222939/http://masr.20at.com:80/newArticle.php?sid=12297"

[[comments]]
order = 1
subject = "متأسفين انه اتكلم عن الصنم اللى بتعبده"
author = "خلينا فى حالنا احسن"
text = "الراجل عمال يمدح فى عمرو وبعدها تقول ده قر وسيبوه يدعو دا الراجل الكاتب خلاه زى الشمعة المضيئة وسط ظلام الجهل .<br />عموما انا مش هتكلم عن عمرو ولا عنكم انتم احرار بس بلاش الارهاب الفكرى ده وكأن عمرو خالد اله يعبد"
archived = "2007-11-08"
capture_url = "https://web.archive.org/web/20071108222939/http://masr.20at.com:80/newArticle.php?sid=12297"

[[comments]]
order = 2
subject = "عندما نقرأ لأستاذنا المسيري"
author = "وسام فؤاد"
text = "القراءة النقدية أهم مسات العقل الناضج، لكن.. عندما تقرأ للدكتور المسيري تكاد تنسى النضج والنقد معا.. وتقرأ للتعلم والتمتع بلذة المعرفة العلمية والفلسفية التي أينعت وآن قطافها..<br />شكر الله لكم نقل هذا المقال لأني لم أقرأ العدد."
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205234144/http://masr.20at.com:80/newArticle.php?sid=12297"

