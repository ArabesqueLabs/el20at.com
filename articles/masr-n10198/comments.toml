text = "اشكرك جدا على هذا الموضوع الثري وانا من الناس اللي بعشق النماذج ولكن انا لي راي فيما يتعلق بنماذج الجامعة الامريكية بما اني سكرتارية في cimal المشاركة والوعي السياسي لدى طلاب جامعة القاهرة اعلى من طلاب الجامعة الامريكية ولكن هناك نجد التفاني الرائع في العمل كما ان الطلاب يقبلو على الجامعة الامريكية نظرا للشهادة ايضا"
