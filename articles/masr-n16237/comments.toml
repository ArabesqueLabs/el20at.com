[[comments]]
order = 0
subject = "حلو أوي التقرير"
author = "واحد معدي"
text = "بسم الله ما شاء الله تسلم ايدك يا خباب<br />الفيديو تحفة بجد<br />وهي دي حكومتنا، حكومة \\\"توقف المراكب السايرة\\\""
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144146/http://masr.20at.com:80/newArticle.php?sid=16237"

[[comments]]
order = 1
subject = "يا بتوع البرلس اسكتوا ليجيبوا لكم اجريوم"
author = "صقر الجبال"
text = "صيادين اية وسمك اية<br />احنا هنجيب السمك بتاعنا من باريس<br />انتم شوية حشرات ليس لكم اى لزمة<br />تعملوا اضراب ضد اسيادكم<br />صحيح انتم من الفئة المندسة اللى بيخلفوا عيال كتير عاملين زى الدود بياكلوا التنمية بتاع جدو<br />جدو زعلان خالص"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144146/http://masr.20at.com:80/newArticle.php?sid=16237"
