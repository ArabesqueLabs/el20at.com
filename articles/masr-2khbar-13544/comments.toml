subject = ""
author = "نوال نوال نوال......"
posted = "2009-09-28"
text = "حتي لو مش عاجبنا و معترضين ممكن نعترض و نتعامل باحترام و اكيد ديننا الدين الاسلامي لم يامرنا بتللك المعامله حتي مع الاعداء<br />ولا احنا بس مسلمين علشان نشتم و بس و افتكرو لما محمد صلي الله عليه و سلم سال علي اليهودي جاره لما تخلف عن ايذائه بسبب مرضه<br />فلماذا الالساءه و لماذه نهين بعضنا البعض و ندخل الدين في الكلام ده"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = ""
author = "ضرب الجزمة"
posted = "2009-09-28"
text = "اليهودى الذى عاملة الرسول بالحسنى لم يشكك فى اصول الدين<br />ومعاملة الاسلام لاهل الكتاب بالحسنى واجب ما داموا فى حالهم ولم يقاتلوكم او يخرجوكم فى الدين<br />انما الان القتال ليس بالسيف ولا فى ميادين القتال فقد فشل الغرب الصليبى كلة فى افغانستان وفى العراق<br />القتال الان بالكلمة والتشكيك فى اصول الدين للشباب المهتز والمراهق<br />وعندما يتشكك الشباب فى دينة نرى صورا لحجازى الذى تنصر وللمحامية التى تنصرت اخيرا<br />اذن هؤلاء المشككون لا رحمة معهم بل واجب كشفهم وسبهم وتعريتهم<br />انهم اخطر من اليهود واخطر من غلاة الصليبيين<br />وعندنا اشكال مثل سيد خرة القمنى ونوال زفت السعداوى"
archived = "2010-03-14"
capture_url = ""
