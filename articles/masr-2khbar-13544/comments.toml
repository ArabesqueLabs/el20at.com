subject = ""
author = "المادة الثانية للدست"
posted = "2009-09-28"
text = "الشرموطة وخنازير المهجر يريدون نزع هوية مصر والغاء المادة التانية من الدستور وهى ان الاسلام هو دين الدولة وان الاسلام هو او الشريعة هى المصدر الرئيسى للتشريع<br />ويريدون ان يحولوا مصر الى دولة قبطية مع ان الاقباط لا تتجاوز نسبتهم 4 % والغاء ارادة 96 % مسلمين من الشعب المصرى<br />فمصر عربية اسلامية وستظل عربية اسلامية الى ابد الدهر رغم نعيق الغربان وعواء الكلاب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = ""
author = "مواد الدستور"
posted = "2009-09-28"
text = "الى تلك المرأة<br />هل كل مواد الدستور مفعلة والحكومة ماشية على الدستور والا الغباء اللى راكب مخ اهلك وغضب اللة اللى نازل على وجهك القبيح وعمى القلب التى تعيشينة يجعلك تفكرين ان الحكومة لا تعمل بالدستور وانما تحكم بقانون الطوارىء<br />فيا ست هانم الدولة تحكم بقانون الطوارىء وكان اولى بك ان تطالبى بايقاف العمل بقانون الطوارىء والمحاكم العسكرية للمدنيين والاعتقالات شبة اليومية للمواطنين<br />ولكنك بحقدك على الدين وتحالفك مع كلاب المهجر تتكلمين فى نقطة غبية وهى الغاء الهوية وكانى ليس اسمى محمود ومحمد وعلى واسماعيل وغيرى اسمة اسكندر وصليب وعبد المسيح وتنطق تلك الاسماء بالديانة والهوية<br />هل تريدين ان يكون واحد اسمة محمد ولا يكون مسلم او واحد اسمة جرجس ولا يكون مسيحى<br />اغلبية الدولة مسلمة وتتبع شريعة الاسلام فى الزواج والميراث والقضاء والا تريدين ان نتزوج على طريقة الكاثوليك او زواج مدنى<br />احترمى نفسك يا امراة"
archived = "2010-03-14"
capture_url = ""

