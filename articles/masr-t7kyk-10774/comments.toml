order = 0
subject = "جمعت الفراشات زمان - ومع كل فراشة اتأمل الوانها وا"
author = "جامع الفراشات"
posted = "2008-12-22"
text = "قرات لك<br />كنت اجمع الفراش<br />وشاهدت فى شبابى فيلم امريكى اسمة جامع الفراش<br />وحينما تجمع الفراشات تعشق جمال الالوان وتحب الجمال عموما ويرتقى حسك الفنى<br />ومن المتوقع ان تنتقل من جمال الفراشات الى جمال الزهور وجمال البنات<br />وكان صديقى الصعيدى قبل ان نذهب الى ميدان الحرب ايام حرب الاستنزاف يقف امام كلية بنات عين شمس فى الصباح ويراقب الفتيات ويقول انة يقف فى حقل زهور ووسط سرب من الفراشات<br />ثم اثناء العمليات اصيب فى زراعة وطلب نزورة فى الصعيد لصيد الفراش عندما يشفى - ولكن لامر ما مات ذات ليلة وطارت روحة مع الفراشات فى حقول الصعيد اليانعة"
archived = "2010-03-14"
