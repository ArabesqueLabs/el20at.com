text = "يعني انت لما ما تعرفش حاجة ما تقولهاش ، ما تقولش فويل للمصلين وتسكت ، أولا ، الفلوس اللي من ثمانين سنة ، ما اتخديتش ، وما حدش بنا بيها حاجة ، وما تألفش الله يكرمك . وبلاش بلبلة ، وسيبوا الجماعة في حالها"
