[[comments]]
order = 0
subject = "محاضرة فى امريكا"
author = "اى كلام"
posted = "2007-10-27"
text = "استمعت الى محاضرة يلقيها استاذ فى مركز سياسى امريكى يقول فيها هذا الاستاذ الامريكى<br />النظام الديكتاتورى البوليسى البلطجى فى مصر يخوفنا نحن الامريكان من الاخوان المسلمين ويقول لنا الاخوان سوف يحكمون ويفعلون مثل ما تفعل حماس فى غزة ونحن نقف لهم ونسجنهم ونعتقلهم من اجل مصلحتكم انتم ايها الامريكان<br />ونحن الامريكان ندرك ان اقوى قوة سياسية فى مصر هم الاخوان<br />اذن امريكا تعرف الاخوان وتعرف انهم اكبر كتلة سياسية مثقفة ونظيفة وطاهرة اليد<br />ولا بد لامريكا ان تؤيد الاخوان ايا كان موقفهم لانهم سيكون ديمقراطيون<br />امريكا تريد الاخوان لان النظام الحالى فاسد ولا لون لة ولا طعم ولا رائحة<br />ومات وشبع موت<br />وباقى غطينى ياصفية وصوتى"
archived = "2010-03-14"
capture_url = ""

