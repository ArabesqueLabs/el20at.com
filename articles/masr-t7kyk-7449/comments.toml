subject = "الشمس متتحجبش بمصفى"
author = "ابوصهيب"
posted = "2007-10-28"
text = "مشكلة النظام الحاكم عندنا غش وتزوير وتبذيروسرقة كل حاجة واى حاجة فى سبيل تحقيق مصالح افراد على حساب مصير ومصالح امة - الاخوان بدكاترة ومهندسين وعلماء ورجال اعمال واقتصاد ونخب ثقافية وفنية وسياسية وعامة الشعب المصرى المؤمن باللة اولا وببرنامج الخلاص من التخلف بجميع انواعة يتمنى من مثل هذاحوار ان يتم ويستمر وفق شروط الجماعة ومطالبها الواقعية والشرعية لتحقيق الهدف المنشود والمقصود والواضح وضوح الشمس لكل العالم وهو قيادة الامة لتحقيق ولو بعض امانى الشعب المغلوب على امرة من امورحياتية وانشاء وزارات تقوم على خدمة الناس وتيسير امورهم والمحافظة على اموالهم واعراضهم وتكافىء الفرص فى كل حاجة وادارة البلد كدولة قانون مش قانون الغاب"
archived = "2010-03-14"
