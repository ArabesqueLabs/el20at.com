text = "جمال اية بس<br />وهى عاملة زى زكيبة الفول او شوال البدنجان<br />جمال اية وهى بتضرب حلة المحشى وتزعرط وتزلط المولود وبرضة تزغرط<br />جمال اية وهى عمال على بطال تاكل من فوق وتاكل من تحت"
