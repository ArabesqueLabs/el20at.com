text = "لا اتفق معك فى موضوع الجمال<br />جمال ايه وهى أصبحت أكثر فحشا وقبحا تخلت عن أهم ما يميز المرأة بصفه عامة الحياء و طهر البراءة فهى أصبحت مقززة وأكثر تداول من العملة ولكل قاعدة شواذ كما يقال لكن بشكل عام و واضح وضوح الشمس الشارع يتكلم و محلات اللبس الزبالة تتكلم الجمال فى عصر العرى أصبح نادر جدااااااااا"
