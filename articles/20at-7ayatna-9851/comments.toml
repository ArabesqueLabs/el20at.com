text = "ميرسي لالك يا راما بس بحب احكيلك انو نحنا كمان بالاردن اغلبية الحفلات بتكون بالصيفية ....وهاد شي مو جديد حتى نحكي فيه ......سواء كان العريس مسافر او بالبلد الاعراس بتم بالاردن بالعطلة فقط الا حالات نادرة بسبب سفر او شي تاني ....(نصيحة يابنات خليكو عزابيات اريحلكو لانو الشباب بطققو ...ههههههههه)سوري شباب بس هي الحقيقة<br />(نصيحة شباب ما تتزوجوا افضل لالكو ولالنا اوك )<br />مع تحياتي هايدي....سنفورة بس كتير امورة<br />قود لك لكل الصبايا والشباب المقبلين على الزواج.........ههههههههههههههههههههه"
