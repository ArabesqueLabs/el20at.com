[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-08-08"
text = "الرأى في الزواج المبكر يختلف باختلاف الظروف<br />أهم شئ ان الزوجين يقدروا يتحملوا المسئولية<br />الكارثة اللى احنا بنعيش فيها هي ان بنفضل عيال لغاية 20 و25 سنة ويمكن اكتر من كده كمان<br />فهى المشكلة مش فى السن<br />المهم هو النضج وده يختلف من بيئة لأخرى<br />انا باشوف بعض الشباب والبنات ناضجين جدا بالرغم من صغر سنهم"
archived = "2010-03-14"
capture_url = ""

