text = "السلام عليكم ورحمة الله<br />الزواج امبكر عفة وعفاف للشباب ورسولنا الكريم يقول يامعشر الشباب من استطاع منكم الباء فليتزوج والزواج المبكر يجعلك تتحمل المسولية وصدق رسولنا الكريم صلى الله علية والة وسلم"
