[[comments]]
order = 2
subject = "الاهلى نادى القرن الاول"
author = "محمد ممتاز - بيبو"
posted = "2007-06-24"
text = "لن اقول يسقط الاسماعيلى فهو ساقط بالفعل .. لن ارتكب ما هو احمق لكى اشتم جماهيرهم فجماهيرهم هى الاسوء عبر جماهير العالم اجمع<br />فهم الموكسين دوما و دواما و ما احلاها ذكرى 8/0 ايام صالح سليم و ما احلاها ذكرى عندما يتذكرون انهم هزمونا فى بطولة دورى فقراء العرب 0/4 فى ظل تحكيم فاجر تحدث عنه العرب جميعا<br />الاسماعيلى يا اعزاء فريق لا يليق بنا نحن جماهير نادى القرن ان نتحدث عنه فشانة شان نادى زمالك قلين او مالية كفر الزيات او بنى سويف او حتى الزمالك المصرى . من انتم حتى تغلطوا فى نادى القرن . انت ثالث الدورى و بصراحة مانويل جوزيه قرف يقابلوكوا يللى فرحنين بجون محمد فضل و ال 3 بتوع القاهرة اسالوا على فريد الحكم الاماراتى الموقف اللى مش بيحكم اصلا فى الامارات و موقف و جابوه جمال الغندور و طبعا عارفين الرشوة بتاع رئاسة اللجنة التحكمية بتاعه خليجى 17<br />و تعالوا نقولها تعالوا نغيظهم<br />سعد زغلوول بناه<br />مختار التتش علاه<br />صالح سليم رباه ( هو ربى الاسماعيلى فعلا 7 اجوان من 8 اتكسفوا على دمكم دانتوا 3 دورى و احنا 32 )<br />و 70 مليون وراه<br />اللموند الفرنسية : ربما يبقى اثرا فى كرة القدم المصرية بكرة جميلة تسمى الاهلى<br />عكاظ السعودية بعد هدف ابو تريكة فى الصفاقسى : القاهرة اهتزت فى الدقيقة 92<br />موقع الفيفا : ابو تريكة يساوى نصف لاعبى الزمالك<br />بيبو : اخرسوا ... الاهلى و بس"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الى الدروايش و الزبالك"
author = "محمد ممتاز - بيبو"
posted = "2007-06-24"
text = "الاهلى القاهرى المصرى فى سطور بسيطة<br />الدورى المصرى : 32 مرة<br />كاس مصر : 34 مرة<br />دورى ابطال افريقيا : 5 مرات<br />كاس افريقيا : 4 مرات<br />سوبر افريقيا : 3 مرات<br />افرواسيوية : مرة واحده<br />بطولات عربية : 4 بطولات<br />بطولة الاتحاد المصرى لعام 89-90 : مرة واحدة ( اقيمت مرة واحده )<br />سوبر مصرى : 3 مرات<br />بالاضافة الى 16 بطولة لكاس السلطان<br />يعنى 100 بطولة فى 100 عام<br />تعالوا بقى اضحكوا معايا<br />الاسماعيلى صاحب اسوء جماهير فى العالم .. جماهير حقودة و ناكرة للجميل<br />الدورى المصرى 3 و الله حاجه تموت من الضحك<br />كاس مصر : مرتين . طب ده فريق اعمله حساب<br />افريقيا : مرة واحده يا سلام و شكرا على كده<br />بطولة الحوارى و الشرابات : 999 مرة<br />بطولة سب الجماهير المنافسة : 400<br />بطولة سب جماهير الاهلى : 800000 مرة<br />لاسف لا اعتقد انى اقدر اصبر على حد يقول على النادى الاهلى حاجه<br />و بعدين يا استاذ سيد الاهلى لا يخرب اندية الدورى ده اللاعيبة متوزعة فى كل نادى انت شكلك بتابع دورى عالم سمسم<br />و الاستاذ البغداداى حبيب قلبى اللى بيفتى بنهاية الاسطورة<br />الاهلى ده .. يا بغداداى ارفع ايدك الاهلى هو سيدك و تاج راسك كمان<br />نادى القرن العشرين<br />مش الاسماعيلى ..نادى السرايا الصفراء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "لست ضد الجهور الغلبان  انا ضد الفساد والتعصب الاعم"
author = "saedelkhmmar"
posted = "2007-06-24"
text = "صديقي ممتاز ابدا لست ضدك او ضد اي مشجع للنادي الاهللك انا ضد الادارة التي صارملفها ضخم -وللعلم لست ضد الشباب الصغار لأنهم لم يغرفوا التاريخ وقيمة النادي بشرفة و الناس في مصر تشجع الاهللك لانة مفروض عليهم بالأعلام عندما سجلت مذكرات الراحل العظيم نجيب المستكاوي ونشرتها باللواء اللبناني قبل اختراع النت فال وسجل للتاريخ ان الدولة تريد الحزب الزمهلكاوي صاحب اعلي صوت وحضر المستكاوي اجتماع مع الساداتبحضور المزحوم لطيف واخرين من اجل اسقاط خلد محي الدين زعيم حزب التجمع وقصص اخري ولو مش مصدق يا حمادة قول اي كلمة في مظاهرة في الاستاد عن الفساد او التوريث او الخراب وانت تعرف ان الامور مرتبة وساعة الجد الاسماعيلي واع حد يعكنن علبي البهوات بالجزمة ويتحرق بجاز وسخ وتقبل تحياتي انت وكل اهلكاوي شريف"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "الاهلى بيدبح و كلامك كله ك* * يا سيد"
author = "محمد ممتاز - بيبو"
posted = "2007-06-25"
text = "هما كلمتين و مش عاوز لماضة .. الاعلام مش بيشجع اى حد فى الكرة لان كرة القدم لا تعرف الاعلام الكاذب الذى تزعمونه كما تزعمون ان الاهلى لم يستضيف مباريات فريقكم الموكوس دائما ودواما الاسماعيلى<br />و انا هاتعب دماغى ليه انا اهلاوى بستمتع بفريقى حتى لو اداءه سى الروح موجوده مش نادى المبادى الى رجع عمرو جمال و سيد معوض عشان ماتش الاهلى لما كانوا موقفين<br />شوف الجبن<br />انا اللى اقدر اقولهولك ..انك غيرنيين و حاقدين جدا على كل ما هو خير عشان كده مش هتاخدوا اى حجا<br />و على فكرة ربنا هيكرم الاهلى قصادكوا<br />صدقنى يا سيد بدل لما تلجا للفوار ..اتفرج على الاهلى<br />و اظنك شفت ماتش الاهلى و الهلال طبعا هتقولوا ده سهل و كسب الزمالك و اتعال معاه هنا<br />الاهلى بيدبح"
archived = "2010-03-14"
capture_url = ""
