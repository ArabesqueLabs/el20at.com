[[comments]]
order = 3
subject = "الناس لا يخططون للفشل ولكنهم يفشلون فى التخطيط"
author = "من الجياع"
posted = "2008-01-06"
text = "الفقر نتيجة اتباع سياسات معينة - للاسف يقوم غيرنا كالبنك الدولى بوضعها لنا<br />نحن امة تنازلت عن حرية قرارها<br />القرار بييجى من برة وعليهم التنفيذ والا القتل هو المصير<br />اما الحالة عندنا فى مصر فأصبحت بؤس شامل - العالم كلة يتقدم ونحن نرجع للوراء<br />وصدقونى ان الثلاجة عندى ليس فيها شىء والكهرباء مفصولة عنها لتوفير فاتورة الكهرباء فى الشتاء وفى الصيف استخدمها لتبريد المياة<br />ولكن ليس مهم الحاضر المصيبة فى اللى جاى<br />تنتظرنا ايام سوداء ومهببة<br />وربنا يستر"
archived = "2010-03-14"
capture_url = ""

