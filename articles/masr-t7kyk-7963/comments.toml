[[comments]]
order = 6
subject = "لن يغير الله مابقوم حتى يغيروا ما بانفسهم"
author = "emy"
posted = "2008-01-07"
text = "انا مش عارفة لية احنا يامصريين ساكتين على الوضع دة يعنى بعد غلاء اسعار البنزين و الالاجهزة و الشقق و تخلى الحكومة عن قطاع التامين الصحى كمان الحكاية و صلت الى لقمة العيش يعنى بعد كدة اية اللى ممكن يغلى .لازم على فكرة نعمل حاجة مش كفاية الصدقات و التسول من دول الخليج لازم يكون فى موقف ضد الحكومة باى شكل من الاشكال مش بس عشان احنا نعرف نعيش كمان عشان الاجيال الللى جاية مين منا نفسة و لادة يعيشوا الحياة الصعبة اللى كلها شقى و غلب دى .و شكرا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "اسائلكم الفاتحة على الشعب المصرى"
author = "ابوصالح"
posted = "2008-01-07"
text = "فعلا لايغير اللة بقوم حتى يغيرو ما باانفسهم طول ما الشعب المصرى ساكت وراضى وخانع على كل هذة الزيادات اليومية هيفضل الاسعار فى ارتفاع الى ان نصل الى طبقتين فى المجتمع او احنا وصلنلها خلاص اغنياء جداا وفقراء جدااا لا يوجد وسط وطبعا قطاع العريض من الموظفين والحرفيين والمعشات والارامل من الفقراء طبعا وبقية الحاشية اغنياء جداا فمش هيفرق معاهم السلع الاساسية بتغلى ولا عن عندهم الكثير والكثير اوىى لدرجة انهم ماْمنين مستقبلهم ومستقبل ولادهم واحافدهم وليذهب الشعب المصرى الى الجحيم وهذة الطبقة اصبحت محتكرا الحاجات الاساسية فى مصر من مواد غذائية ومواد بناء وماالى ذللك يعنى من الاخر كدة اذا الشعب من نهضتش من غفوتة يبقى نقرا الفتح على المصريين<br />وسمعونا صلاة النبى(علية الصلاة والسلام)ما تصلى علية"
archived = "2010-03-14"
capture_url = ""

