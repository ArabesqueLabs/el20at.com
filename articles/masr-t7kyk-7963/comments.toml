subject = "ويل للعرب من شر قد اقترب"
posted = "2008-01-06"
text = "ويل للعرب من شر قد اقترب<br />كون التلاجه فاضه دا مش مهم<br />لكن اللي لازم تعرفون ان هذا حال كل الدول العربية من المغرب الى عمان حتى في الخليج ارتفاع اسعار جنوني<br />الامر الذي يؤكد ان فيه احداث في غاية الاهمية حتحصل قريبا<br />انتظروا المفاجآت الكبرى مع الرئيس الامريكي المنتخب<br />يا ترى الدور على مين بعد العراق<br />مصر<br />سوريا<br />السعودية<br />السودان<br />ايران<br />محدش عارف"
archived = "2010-03-14"
capture_url = ""

