subject = "شيوخ الامارات يهددون بسحب اثتثمارتهم من مصر وتقدر"
author = "ابو نخلة فى العلالى وخيبة بباو"
posted = "2008-09-05"
text = "يا بباوى<br />الموضوع اكبر من الحزب الفشنك اللى انت فية<br />دا مش قتل سعاد حسنى فى لندن<br />ولا قتل اشرف مروان فى لندن<br />بواسطة ضباط مباحث امن الدولة<br />لا<br />الموضوع مختلف<br />الموضوع ان سوزان كانت فى حماية دبى<br />ازاى هلفوت مجرم محترف زى اللى مشغلينة يروح يقتل جوة بلدهم لانسانة طلبت منهم الحماية<br />دى كبيرة قوى<br />هيتحاكم هيتحاكم<br />وهيروح فى ستين داهية<br />والا<br />العلاقة بين الدولتين هتبقى فى خبر كان"
