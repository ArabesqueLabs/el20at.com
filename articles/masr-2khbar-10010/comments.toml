text = "اتكلم فى اى حاجة الا الدين<br />بلاش الكلام عن جماعة الاخوان لانك ارثوذكس والكلام منك لة حساسية - اتكلم فى السياسة فى الفن فى الرقص عن ارثوذكس المهجر<br />انما الجماعة دى بلاش<br />لان دول مش جماعة - دول شعب مصر شاء من شاء وكرة من كرة<br />ولكنها الحقيقة<br />كل شعب مصر اخوان حتى اعضاء المسمى وطنى"
