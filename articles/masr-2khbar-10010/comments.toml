subject = "(دعوة للجميع)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-05"
text = "لقد كثر اللغط و الخلط فى مصداقية ممثلينا رجال السياسة و على كافة توجهاتهم الحزبيه سواء الوطنية او المعارضة<br />لماذا لا يقوم اولى الامر باعادة الغربلة و تنظيف المجلسين الموقريين(الشعب و الشورى) من السوس و الفساد الذى ينخر بهما من فساد و استغلال نفوذ كما يتهامسون و يتكلمون اخواتنا البعدة و العياز باللة اعضاء (الجماعة المحظورة) عفوا اعضاء(الجماعة الموبؤبة المتخلفة)؟!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!<br />و ذلك بفك المجلسسين الموقرين(مجلس الشعب ومجلس الشورى)<br />و اعادة الانتخابات لاختيار الصفوة خيرة رجال الوطن المخلصين الشرفاء؟<br />و لتكن (دعوه للجميع)<br />أقتباسا من(القرائة للجميع)"
archived = "2010-03-14"
