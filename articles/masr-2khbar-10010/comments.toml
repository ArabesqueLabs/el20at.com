text = "مسخرة حيتان رجال البزينس الذين اغتنوا فى زمن قياسى وتصارعهم على اقتصاد شعب جائع يقف فى طوابير الخبز - تدعوا الى التقزز<br />يتصارعون على راقصة او مطربة ويقتلون داخل البلد وخارج البلد<br />فاض الكيل<br />كفاية قرف<br />كفاية قرف<br />يلعن ابو<br />والزمن الذى اوجدكم والعهد الزفت الذى ظهرتم فية"
