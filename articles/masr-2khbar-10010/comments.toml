[[comments]]
order = 6
subject = "الاسلام هو الحل"
posted = "2008-09-05"
text = "أُعلن فوز 30 من مرشحي الإخوان المسلمين في انتخابات الإعادة للمرحلة الأولى من الانتخابات التشريعية المصرية، لينضموا إلى الأربعة الذين فازوا في الجولة الأولى وهم<br />- دائرة حلوان: المحمدي عبد المقصود، مقعد العمال.<br />- دائرة السيدة زينب: عادل حامد، مقعد العمال.<br />- دائرة البتانون بالمنوفية: سعد حسين، مقعد العمال.<br />- دائرة الواسطى: محمد شاكر الديب، مقعد الفئات.<br />والنواب الثلاثون الجدد هم:<br />القاهرة<br />- دائرة عابدين: جمال حنفي، مقعد الفئات.<br />- دائرة مصر القديمة: يسري بيومي، مقعد العمال.<br />- دائرة النزهة والمرج بشرق القاهرة: مجدي عاشور، مقعد<br />العمال. - دائرة التبين و15 مايو: علي فتح الباب، مقعد العمال.<br />- دائرة الساحل: حازم فاروق على، مقعد الفئات.<br />- دائرة المطرية وعين شمس: محمود مجاهد، مقعد العمال.<br />- دائرة مدينة نصر: عصام مختار، مقعد العمال.<br />الجيزة<br />- دائرة بندر الجيزة: عزب مصطفى، مقعد العمال.<br />- دائرة مزغونة بالجيزة: أحمد عبده شابون، مقعد العمال.<br />- دائرة الحوامدية: جمال قرني، مقعد الفئات.<br />- دائرة أوسيم: محمود عامر، مقعد الفئات.<br />المنوفية<br />- منوف: عبد الفتاح عيد، مقعد الفئات.<br />- دائرة بندر شبين الكوم بالمنوفية: رجب أبو زيد، مقعد<br />الفئات. - أشمون بالمنوفية: أشرف بدر الدين، مقعد الفئات.<br />- دائرة إسطنها بالمنوفية: ياسر حمود المليجي، مقعد الفئات.<br />- دائرة قويسنا: عيسى عبد الغفار، مقعد العمال.<br />- الشهداء: يسري تعيلب، مقعد العمال.<br />- الشهداء: علي إسماعيل، مقعد الفئات.<br />- بركة السبع: صبري عامر، مقعد الفئات.<br />المنيا<br />- دائرة ملوي بمحافظة المنيا: بهاء الدين عطية، مقعد العمال.<br />- دائرة العدوة بمحافظة المنيا: محمد عبد العظيم، مقعد<br />العمال. - بندر المنيا: محمد سعد الكتاتني، مقعد الفئات.<br />- مغاغة بالمنيا: إبراهيم زانون، مقعد الفئات.<br />- دائرة مطاي: ثروت عبد الفتاح، مقعد الفئات.<br />- بني مزار: موسى غنوم، مقعد الفئات.<br />بني سويف<br />- مركز (ناصر- بوش) ببني سويف: عبد العظيم الشرقاوي،<br />مقعد الفئات. - في دائرة ببا بمحافظة بني سويف: عبد اللطيف قطب،<br />مقعد العمال. - في مركز بني سويف: حمدي زهران، مقعد الفئات.<br />أسيوط<br />- دائرة القوصية: محمود حلمي، مقعد العمال.<br />- دائرة الفتح: عبد العزيز خلف، مقعد الفئات."
archived = "2010-03-14"
capture_url = ""

[[comments]]
