subject = "الى الاخ مش قايل"
author = "مش ححبك"
posted = "2008-09-05"
text = "يا اخ مش قايل انت مش عارف سياسة الموقع اللي انت داخله<br />سياسة الموقع ان المعلقين يسبوا في بعض ويشتموا في بعض باختصار<br />يا اما تتجاهل التعليقات المستفزة وان تترك الموقع وترحل<br />ما تتعبش اعصابك<br />جماعة الاخوان المسلمين بعد التزوير الظاهر كسبوا خمس عدد مقاعد البرلمان مش محتاجه حد يدافع عنها<br />سيب اللي عايز يشتم يشتم كله لصالح الجماعة<br />جماعة الاخوان المسلمين عامله زي \"الضأن\" كل ما تدبح منهم بيزيد عددهم<br />وعلى سبيل المثال الاستاذ خيرت الشاطر ما كنش حد بيسمع عنه ولا حد يعرفه<br />الان العالم كله بفضل الله بيتكلم عن خيرت الشاطر<br />سيب اللي يشتم يشتم"
archived = "2010-03-14"
capture_url = ""

