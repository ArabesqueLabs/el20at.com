text = "الاخ (مش ححبك)<br />تحياتى و تقديرى لكلماتك و تعليقاتك الظريفة و بعد,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,<br />كتبتم مشكورين تقولون:_<br />(العالم كلة بفضل الله بيتكلم عن خيرت الشاطر----------------------الخالخ الخ؟؟؟<br />عارف ليه؟<br />لانه طلع بليد قوى و خايب جدا و غبى غبى غبى جدا؟؟؟!!!!!!!!!!!!!!!!!!!!!!!!!!!!!كمان<br />علشان كدة ابوه سماه الشاطر كنايه عن جهله المريع الفظيع؟<br />ها ها ها ها ها ها ها ها ها ها ها ها هاههههههههههههههههههههههههههههههههههههههههههههه ها ها ها ها ها ها ها<br />اشكرك و نحياتى لك و الى الاخ المهذب- (موش قايل) مقطوع القضيب و اللسان كمان<br />يا ساتر استر<br />(رمضان كريم ) و كل عام و انتم و الامة الاسلامية و العربية بكل خير و تقدم<br />و الله المستعان"
