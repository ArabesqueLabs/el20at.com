subject = "زير نساء و مزواج و معبود بالنساء  ممكن؟ اما ان يتا"
author = "اكتب اسمك هنا"
posted = "2008-09-05"
text = "ملياردير<br />رجل اعمال ناجح<br />رجل سياسة مشهور<br />مزواج<br />زير نساء<br />مولع بالنساء<br />ضعيف امام النساء<br />جنسى<br />شديد الرجولة و الفحولة<br />نعم كل هذا ممكن؟<br />اما الغير ممكن فهو الاتهام بالتامر على قتل خليلتة ؟<br />ما اسهل الحصول لة على البرائة؟<br />المهم يكون لدية محام نبية و صايع من المحامين بتوع النسوان اياها و تخصص قضايا الاداب<br />معلش يا هشام بتيجى مع العمى طابة<br />و للة الامر من قبل و من بعد<br />(قلوبنا معك)"
