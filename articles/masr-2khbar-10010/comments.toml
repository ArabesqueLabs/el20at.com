[[comments]]
order = 10
subject = "الى ابو نخلة في العلالي"
author = "ممدوح ذكي زخاري جرجس يعقوب ـ ا"
posted = "2008-09-06"
text = "ما هوا فعلا حيتحاكم مفيش مشكلة وحياخد حكم برضه ما فيش مشكلة<br />لكن الحكم مش حيتنفذ هي دي المشكلة<br />زي الضابط اسلام نبيه علشان خاطر الراي العام اتحاكم واخد تلاث سنين سجن<br />لكن هو فين اسلام نبيه اختفى عن الانظار خلاص والناس فرحت انه اخد تلت سنين سجن لكن للاسف ما دخلش السج<br />برضه طلعت مصطفى حياخد حكم بس مش حيتنفذ<br />وتوته تونه خلصت الحدوته حلوه ولا ملتوته<br />بس اكيد الموضوع دا فيه مخدرات وتجارة مخدرات<br />لان ما فيش حد بيصفي بالطريقة دي الا اذا كانت عصابات مخدرات"
archived = "2010-03-14"
capture_url = ""
