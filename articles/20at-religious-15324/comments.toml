text = "دا كلام جميل ياريت يطبق فى العالم كلة وجزء من احترام الاخر والاستاذ اللى بيتكلم على الجرس دا مجرد رنة فى اليوم لكن الاذان كام مرة فى اليوم وكام اذان يشوشر على اذان اخر وتحس انك فى سوووووق وياريت بتقف على الاذان وبس دا فى خطبة وصلاه ولو عندك امتحان يوم الجمعه اخبط دماغك فى الحيط . لو مش هنحترم بعض ونراعى مشاعر بعض بناقص منة الجرس والادان واظن اننا مش فى الجاهلية ولا عايشين فى خيام ومستنيين حد يفكرنا بمواعيد الصلاه ...... كفاية تخلف بقينا من دول العالم التالت عايزين اية تانى<br />والصلاه دى صلة بين الانسان والله ليس لاحد اخر دخل فيها"
