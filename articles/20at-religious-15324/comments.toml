text = "طب بالسبة لصلاة الفجر ... مين اللي هايقومنا من النوم ؟؟؟؟<br />و بعدين قمة العبودية انك تبقي مثلا مع اصحابك او منهمك ف الشغل او في اي شيء مهم و تسمع ( الله اكبر ) و تحس ان الله فعلا اكبر من كل شيء ... ف تحس انك فعلا عبد ....<br />يا جماعه الناس دول عمرهم ما داقوا حلاوة عبودية الله بجد اللي كل الشرائع المحرفه محرومه منها , عشان كده بيألفوا ذي ما هم عاوزين ... ربنا ما يحكم علينا و نبقي ذيهم"
