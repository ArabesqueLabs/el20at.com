subject = "شوية دم ياوزارة"
author = "موظفة بالهيئة المنكوبة"
posted = "2008-11-27"
text = "هدية فساد : إلي السيد الدكتور وزير الكهرباء والطاقة<br />ورد بمذكرة الإحالة الصادر عن النيابة الإدارية في نوفمبر 2008 في شأن المهزلة والكارثة الكائنة بهيئة المحطات المائية لتوليد الكهرباء – القضية22 لسنة 2007 ونصياً مايلي :<br />الصفحة 143 : نصياً<br />حصول شاغلي الوظائف العليا بالهيئة وعددهم لم يتجاوز العشرون شخصاً علي مكافآت وحوافز غير مشروعة تجاوزت مبلغ 686 ألف جنيه عام 2003 ومبلغ 708 ألف جنيه عام 2004 ومبلغ مليون ومائتين وثلاثة وعشرون ألف جنيه عام 2005 ومبلغ مليون ومائة وواحد وثمانون ألف جنيه عام 2006 ومبلغ مليون وثمانية وخمسون ألف جنيه عام 2007 بخلاف ماصرف لهم من مرتبات وحوافز ميزةملحقةللراتب الشهري وقد تجاوز المنصرف مبلغ 261 ألف جنيه في سنة واحدة فقط إلي محمد الحارث الجزار والذي حصل علي مبلغ 233948 ألف جنيه حوافزوجلسات ومكافآت وبدل استقبال وتمثيل ومبلغ 28073 جنيه راتب شهري وحافز مميز وذلك عن عام 2005 فقط .<br />الصفحة رقم 95- 96 : نصياً<br />عام2003 حصل محمد محمد عبد المنعم علي حوافز ومكافآت وبدلات غير مشروعة بقيمة128937 جنيه أي بواقع 10745 جنيه شهري في حين أن راتبه الشهري الأساسي هو مبلغ 768 جنيه أي بما تجاوز13 ضعف لراتبه الشهري بينما عن نفس العام محمد الجزار علي مبلغ 111734 جنيه وراتبه الأساسي 569 جنيه أي بواقع 9311 جنيه شهري وهو 16 ضعف راتبه – بينما تلاحظ حصول محمد الجزار رئيس الهيئة في عام 2005 علي مبلغ 233948 جنيه بواقع 19496 جنيه شهري وهو ما تجاوز 29 ضعف نرتبه الاساسي البلغ 658 شهري – بينما حصلت وفاء عبد المنعم محمد النائب المالي له علي مبلغ 164793 جنيه عن ذات العام بواقع 13732 جنيه شهري أي تجاوزت 23ضعف راتبها الأساسي البالغ 593 جنيه شهريا وتكررت نفس الواقعة لهما عامي 2006 و2007 وبلغ المنصرف عام 2003 لعدد 17 شخص فقط من الادارة العليا مبلغ 686731 جنيه وعام 2004 مبلغ 708311 لعدد 18 شخص وعام 2005 مبلغ 123835 جنيه لعدد 21 شخص وعام 2006 مبلغ 1181538 جنيه لعدد 21 شخص وعام 2007 مبلغ 1058244جنيه لعدد 19 شخص فقط - وجاء المنصرف علي مجموعه وفي تفاصيله مخالفا وغير مشروعاً .<br />وسلم لنا علي الشفافية يابتوع الشفافية والطهارة ؟"
