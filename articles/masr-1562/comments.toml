[[comments]]
order = 8
subject = "مفترض صحته إذا كان رب البيت بالدف ضار ب  ؟"
author = "محمد ابراهيم"
posted = "2008-10-31"
text = "إذا كان رب البيت بالدف ضارب فشيمة أهل بيته الرقص<br />طالعتنا جريدة المساء الأسبوعية الصادرة 25/10/2008 في عددها رقم 18806وعلي صفحتها الأولي وبالبنط العريض بخبر كارثي ومهزلة كبري للفساد المالي لم ولن تحدث في أي دولة من دول العالم المتحضر أو المتخلف حيث جاء فيها \" 52 وكيل وزارة ورئيس هيئة بالمحطات المائية لتوليد الكهرباء أمام المحكمة التأديبية العليا حصلوا ونهبوا وسرقوا أموال الدولة بملايين الجنيهات ونصبوا حتي علي وزارة المالية والسؤال الذي يطرح نفسه علي هذا الخبر أو المسخرة والمهزلة الكارثية هو كيف يتم تحويل 52 وكيل وزارة ورئيس هيئة من وزارة واحدة وهي وزارة الكهرباء ومن هيئة واحدة ؟ ثم هل وصل حجم الفساد المالي إلي هذا الحد الهزلي والكارثي في مصر ؟ وإذا ماتم تحويل 52 وكيل وزارة دفعة واحدة من وزارة واحدة؟ فكيف هو حجم وكم الفساد المستخبي في بقية وزارات وهيئات ومؤسسات الحكم في الدولة ؟ ثم أين السيد رئيس الجمهورية ورئيس الوزراء من هذه المسخرة والمهزلة الكارثية للفساد ؟ ثم ماذا ينتظر وزير الكهرباء من بعد لكي يقدم أستقالته أو يقال ؟ وأليست تلك الهيئة تابعة له ؟ أم تابعة لوزير كهرباء جزر القمر ؟ للأسف الشديد أن الوزراء عندنا وبقية دول العالم المتخلف يبدو أنهم من ذوات الدم البارد بعكس أقرانهم من وزراء العالم المتحضر الذين يسارعون بتقديم أستقالتهم من فرط وطنيتهم وإحساسهم بالمسئولية حالة حدوث أخطاء في أي جهة تابعة لهم وربما لا تقاس بمثل هذه المسخرة والمهزلة الكارثية لنهب وسرقة المال العام كما حدث في هيئة وزارة الكهرباء أو هيئة علي بابا والـ 52 حرامي – وأخيراً نقول إذا كان رب البيت بالدف ضارب فشيمة أهل بيته الرقص ."
