author = "مهندس بوزارة النهب \" الكه"
posted = "2009-03-07"
text = "فضيحة فى كهرباء كفر الشيخ تحمل الشعب 120 مليون جنيه نقلاً عن جريدة العربى الناصرى العدد 1129 فى19/10/2008 بعد أقل من 6 أشهر من الانتهاء من إنشاء خط ربط كهرباء سيدى سالم كفر الشيخ المحمودية انهارت الابراج الرئيسية فى خط الربط ومع أول هطول للمطر لتصل خسائر قطاع الكهرباء الى مايقرب من 120 مليون جنيه حسب تأكيدات الخبراء .. بخلاف خروج ثلث محطات رئيسية بقدرات 220 كيلو فولت من الخدمة هى محطات سيدى سالم وكفر الشيخ والمحمودية ليترتب عليها فصل وخروج أكبر 8 محطات فرعية بقدرات 66 كيلو فولت وهى مطوبس والمندورة والمثلث وغرب البرلس والمحمودية وفوة والحامول وأبو غنيمة و قلين فيما تقليل الأحمال عن بعض المحافظات لسد العجز فى محافظة كفر الشيخ وأطراف البحيرة ..<br />انهيار الابراج وخروج محطات المحولات الرئيسية من الخدمة يمثل نتاجا طبيعيا للفساد الذى تشهدة الشركة المصرية لنقل لكهرباء خلال العام الماضى وفى تنفيذ مشروعات بمئات الملايين من الجنيهات يشوبها عيوب فنية خطيرة ..<br />مصادر تكشف خيوط الفضيحة التى تم رفع تقرير مفبرك يلقى بتبعات جريمة انهيار الاربعة أبراج الرئيسية و بارتفاعات 65 مترا للبرج - مرة واحدة وتصدع باقى الخط الذى يصل طولة الى 4 كيلو مترات للتصدع - على الامطار!! وهو رفض الوزير الاعتراف به والقيام بتكليف لجنة من قيادات الوزارة بحصر التلفيات والكشف عن أسباب انهيار الخط بعد 6أشهر من إنشائه ..<br />وفى اجتماع عاصف داخل محطة سيدى سالم مساء الاربعاء الماضى وبعد 12 ساعة من انهيار خط نقل الكهرباء الذى يربط بين محطات ال220 وهى الخطوط التى تتولى سحب الطاقة من محطات التوليد وتوصيلها الى عشرات المحطات ـ 66 بعد تخفيف الاحمال ـ تراشق قيادات الشركة المصرية بالالفاظ مع قيادات شركة المصرية للنظم الكهربائية التابعة لوزارتى الكهرباء وقطاع الاعمال بعد ان فجر مفاجأه وهى ان ممثلى شركة نقل الكهرباء بقطاع الدلتا لم ينتبهوا لتحذيراته من وجود عيوب فنية فى التنفيذ والتراخى فى الاشراف والتسلم و عن وجود فساد فى عمليات انشاء الخط الذى بدا العمل فيه شهر يناير الماضى وانتهى أبريل وقال صلاح الشاذلى ممثل شركة النظم المصممة للمشروع بأن الشركة المصرية رفضت تركيب خط أرضى يقوم بامتصاص الصواعق الناتجه عن العوامل الجوية السيئة وتفريغها بواسطة الخط الارضى لحماية جسم الابراج العملاقة من التصدع والانهيار .. بإضافة الى فقدان الاتصال بين محطة سيدى سالم 220 الرئيسية وبين باقى المحطات من جانب وبينها ومركز التحكم الرئيسى بالقاهرة أو حتى مركز التحكم الفرعى بالمنصورة ..<br />وصرح صلاح الشاذلى حسب تأكيدات مصادر أثناء الاجتماع فى وجه جلال حلاوة نائب رئيس المصرية لنقل الكهرباء ومحمد أبو طالب رئيس منطقة الدلتا قائلا.. سبق وحذرتكما من التسرع فى انشاء الخط وبه كم من العيوب الفنية بالخط وبمحطة سيدى سالم نفسها حيث إن أجهزة الوقاية تعطلت بالمحطة . مشيرا الى ان السرعة فى التنفيذ التى أكد عليها الوزير لم تكن تعنى تجاهل مراعاة المواصفات الفنية _ وأضاف الشاذلى قائلا انتم السبب فى انهيار الخط .. ولم يكن كشف المستور فى فساد المصرية لنقل الكهرباء هو السبب الوحيد الذى من أجله ثار ممثل شركة النظم فى وجه قيادات المصرية للنقل .. ولكن لمحاولة تلك القيادات تحميل شركة التصميمات المسئولية - وفى تصريحاته للعربى نفى المهندس حسنى الخولى رئيس الشركة المصرية للنظم قائلا إننا نسير وفق كود عالمى متشدد ولدينا برامج عالمية نستعين بها فى التصميمات وبدقة لا تقبل الخطأ ولو بنسبة واحد فى المليون وقال ان التنفيذ الذى يتم دون أشراف جاد من شركة النقل يمكن ان يسبب كارثة بسبب إهمال عامل فى ربط مكبس وأشار الى أن البرامج والتصميمات لو بها أى تجاوز لما لم تعط نتائج سلبية فى أى من المشروعات السابقة التى تصل أعمالنا فيها بنسبة 90% من حجم الاعمال فى الشبكة القومية للكهرباء!! وأضاف الخولى للعربى أنه كلف أحد مساعدية للمشاركة فى لجنة عامة لاعداد تقرير عن الحادث ولكنه يشكل لجنة حاليا من شركة النظم لاعداد تقرير أخر به كل التفاصيل والتحفظات على عمليات الانشاء والاشراف من قبل شركة نقل الكهرباء على ان يتم تسليمه للدكتور حسن يونس وزير الكهرباء والطاقة والخطير فى الامر ان ابو طالب اقترح على شركة النظم ان يعاد إصلاح الخط واستبدال الابراج المنهارة بأخرى الا ان شركة التصميمات اعترضت مطالبة خلال الاجتماع بضرورة إزالة الخط كاملا واستبداله بآخر وليس الابراج المنهارة فقط نتيجة لحدوث تقوس وانحرااف فى زوايا باقى أبراج الخط .والمضحك أن محمد أبو طالب مسئول منطقة الدلتا بدلا من لوم نفسه على تقصيره ومسئوليته فى تسلم أعمال بها عيوب فنية تسببت فى ضياع نحو 120 مليون جنيه على قطاع الكهرباء سوف يدفعها الشعب من جيبه قام بمعاقبة العمال والمهندسين الغلابة العاملين بالمحطات بالغاء بدل الورادى لهم .<br />من جنب أخر ثار الفلاحون الذين تضرروا من أنهيار الابراج والتى أتلفت محاصيلهم وأدت الى قتل العديد من رءوس الماشية المملوكة لهم وقاموا بمطاردة قيادات الكهرباء الذين استعانوا بدورهم بقوات من الشرطة لتمكينهم من المرور على الخط المنهار.<br />17- كشف تقرير حديث للجهاز المركزى للمحاسبات عن نتائج الرقابة المالية لقطاع الكهرباء والطاقة عن السنة المالية 2007 أن إجمالى قيمة المبالغ المنفقة على دراسات مشروع إنشاء المحطات النووية بالضبعة بمحافظة مرسى مطروح بلغ 881 مليون جنيه خلال العام الماضى، وأشار التقرير إلى أن تلك الدراسات لم تستطع تحديد المكان المناسب للمشروع حتى الآن أو الجدوى الاقتصادية له ومدى الاستفادة من المبالغ التى أنفقتها الدولة على المشروع مما اضطر هيئة المحطات النووية إلى الاستعانة مرة أخرى بالشركة الفرنسية التى قامت بدراسة الموقع لتحديث الدراسة، ونتج عن ذلك عجز فى ميزانية الهيئة بلغ حتى الآن 17.85 مليون جنيه عن العام المالى 2007، مقابل 11.705 مليون جنيه لعام 2008 بزيادة 5.353 مليون بنسبة 45.7 % ليصبح إجمالى العجز المرحل نحو 28.763 مليون جنيه.<br />التقرير لم يتوقف عند حد هذه المخالفة بل انتقل إلى مشروعين تقوم بدراستهما هيئة تنفيذ المحطات المائية لتوليد الكهرباء، هما منخفض القطارة بالعلمين بمحافظة مرسى مطروح والضخ والتخزين بمحافظة السويس، فقد وصلت قيمة الدراسات بالمشروع الأول نحو 52 مليون جنيه وأثبتت دراسات الجدوى الاقتصادية لمشروع منخفض القطارة عدم وجود جدوى اقتصادية بالرغم من دراسته أكثر من 32 عاما أى منذ عام 1976.<br />المفاجأة الكبرى جاءت بالتقرير النهائى للعام الماضى والتى أكدت استحالة تنفيذ المشروع قبل عام 2027 لأن وزارة البترول تستغل غالبية مساحة المنخفض كمناطق تنقيب واستكشاف واستخراج بمعرفة شركات أجنبية تم منح امتياز لها حتى عام 2027. أما مشروع الضخ والتخزين الذى تم الانفاق على دراساته بمبلغ 46 مليون جنيه، فقد ثبت قيام شركة السويس لمواد البناء والتنمية العمرانية والسياحية التعدى على الأرض المخصصة له منذ عام 1994 لإقامة مدينة سياحية، مما جعل الهيئة تقوم برفع دعوى قضائية ضد الشركة برقم 193 لسنة 1995 وإحالتها لمكتب وزارة العدل مما أسفر عن عجز فى نتائج الأعمال النهائية بلغ 13.555 مليون جنيه عن العام المالى 2007، فى مقابل عدم تحقيق فائض أو عجز فى 2006 ذلك نتيجة تجاوز المصروفات على 4 مشروعات خلال عام واحد نحو 235.871 مليون جنيه وذلك بزيادة قدرها 6 % عن المعتمد بقانون ربط موازناتها لنفس العام.<br />وجاءت المفاجأة الثالثة فى التقرير الصادم فى هيئة كهرباء الريف الذى أكد فى البند الثامن منه تضمن المخزون السلعى 505.138 مليون جنيه مقابل 469 مليون جنيه والتى تضمنت أصنافا راكدة بلغ ما أمكن حصره منها نحو 20 مليون جنيه تمثل 4 % من إجمالى المخزون مقابل 21 مليوناً و189 ألف جنيه، بنقص 792 ألف جنيه ولم يتم إيضاح رصيد البضائع لدى الغير والبالغ 14 مليوناً تم حسابها بالخطأ على حساب المستلزمات السلعية، وبلغ رصيد المدينين والأرصدة المدينة للهيئة لدى الغير نحو 4.408 مليار جنيه مقابل 3.450 مليار جنيه فى عام 2006 بزيادة نحو 958 مليون جنيه بنسبة 27.8 %<br />الغريب أن حساب أجور العمال عن العام المالى 2007 والذى بلغ 29.281 مليون جنيه قيمة المبالغ المنصرفة كأجور وحوافز وبدلات لم يتأثر بالمديونية. فى الوقت نفسه بلغت قيمة الدراسات والإشراف الفعلى المحصلة على المشروعات الممولة من الغير فى هيئة كهرباء الريف نحو 28.280 مليون جنيه، فى حين بلغت المصروفات الفعلية من أجور ومستلزمات سلعية بدون خامات ومستلزمات خدمية بدون مقاولى الباطن نحو 55.463 مليون جنيه، والتى قامت الهيئة بتمويل الفرق البالغ نحو 27 مليوناً و183 ألف جنيه من بواقى الشيكات المعلاة للغير فى الحسابات الدائنة على ذمه تنفيذ بعض المشروعات.<br />وجاء البند الأخير للتقرير عن إجمالى المبالغ المنصرفة على جميع المشروعات المنفذة للخطة بنحو 627.489 مليون جنيه بتجاوز يصل إلى 367.283 مليون جنيه بنسبة 141 % عن الاعتماد المعدل لنفس العام البالغ 260 مليون جنيه، ويتضمن المنصرف خلال عام نحو 403.140 مليون جنيه فوائد سابقة على بدء التشغيل تمثل نسبة 64.2 % والتى تزيد على المستهدف البالغ 10 ملايين جنيه بنحو 393.140 حيث تم تمويل المنصرف عن طريق زيادة الدائنين والأرصدة الدائنة بنحو 401 مليون و818 ألف جنيه وعن طريق قروض مباشرة من بنك الاستثمار بنحو 225 مليون جنيه ومنحة عينية بنحو 206 آلاف جنيه.<br />من جهته تقدم محمد العمدة، عضو مجلس الشعب عن دائرة أسوان، بطلب إلى مجلس الشعب لتحويل جملة المخالفات المالية المرتكبة داخل قطاع الكهرباء إلى النيابة العامة، مستندا فى ذلك إلى كونها مخالفات جسيمة.<br />وأكد فى حيثيات طلبه أن ما حدث فى الضبعة يعد بشكل صريح إهدارا للمال العام وصل إلى 881 مليون نيه فى عام واحد على دراسات لم يتضح منها حتى الآن الجدوى الاقتصادية للمشروع أو تحديد مكانه."
