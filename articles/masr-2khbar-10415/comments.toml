subject = "حماس وفتح  ولا يهم مصر من الموضوع غير الافراج عن ا"
author = "مش فاضى"
posted = "2008-11-04"
text = "ما علاقة مصر من القضية الفلسطينية ؟ لا شىء - منذ كامب دافيد ونحن انطردنا من الشرق الاوسط وانكفئنا على الذات<br />وهناك دول تولت ملىء الفراغ مثل تركيا والسعودية وقطر<br />اما مصر فتسمع كلام اسرائيل وامريكا<br />القيادة من البنك الدولى<br />اسرائيل تقول اغلقوا المعابر - نقول حاضر<br />اسرائيل تقول احرسوا حدودى - نقول حاضر<br />اسرائيل تقول دمروا الانفاق - نقول حاضر<br />اسرائيل تقول شوفوا لنا العسكرى شاليط فين - تتركز كل الجهود الدبلوماسية والمخابراتية والمعلوماتية للبحث عن شاليط<br />ولكن حماس اصبحت ازكى من تسلم اوراقها لمصر<br />عرضت حماس توسط قطر كما توسطت فى موضوع لبنان ولكن المصريين زمجروا<br />اذن كل ما يجرى عبث واكل على موائد الفنادق وحضور سهرات فى صالات الفنادق وصالات المطاعم والتكلم فى عبث قد نعيد الكلام عنة العام المقبل والعام الذى يلية<br />كلة عبث فى عبث وتضييع وقت واهى ناس بتضيع فى وقتها لانها بدون شغل"
archived = "2010-03-14"
