subject = "من المومنين رجال صدقوا ما عاهدوا الله عليه"
author = "اسماء سيد على"
posted = "2009-01-22"
text = "ادعوا الله ان ينصرك وجميع المسلمين فى كل بقاع الارض امين ويجمعنا فى جنات النعيم بعد الشهادة باذن الله<br />اود ان اخبرك انى عندما اشاهد تصريح لك عبر التليفاز اتذكر عند رويتك قول الله تعالى (من المومنين رجال صدقوا ما عاهدوا اللله عليه)...فاللهم اهد حكامنا واجعلهم مثل هذا الرجل وتجاوز عنا<br />اسماء من مصر"
archived = "2010-03-14"
capture_url = ""

