[[comments]]
order = 1
subject = "اصبح عندى الان بندقية"
posted = "2007-12-27"
text = "اصبح عندى الان بندقية<br />إلى فلسطين خذونى معكم<br />إلى ربى حزينة<br />كوجه مجدلية<br />إلى القباب الخضر<br />والحجارة النارية<br />عشرين عاما وانا ابحث عن ارض و عن هوية<br />ابحث عن بيتى الذى هناك<br />عن وطنى المحاط بالاسلاك<br />ابحث عن طفولتى<br />وعن رفاق حارتى<br />عن كتبى<br />عن صورى<br />عن كل ركن دافئ<br />وكل مزهرية<br />إلى فلسطين خذونى معكم<br />يا ايها الرجال<br />اريد أن اعيش او اموت كالرجال<br />اصبح عندى الان بندقية<br />قولوا لمن يسأل عن قضيتى<br />بارودتى<br />صارت هى القضية<br />اصبح عندى الان بندقية<br />اصبحت فى قائمة الثوار<br />أفترش الاشواك<br />والغبار<br />والبس المنية<br />انا مع الثوار<br />انا من الثوار<br />من يوم ان حملت بندقيتى<br />صارت فلسطين<br />على امتار<br />يا ايها الثوار<br />فى القدس<br />فى الخليل<br />فى بيسان<br />فى الاغوار<br />فى بيت لحم<br />حيث كنتم ايها الاحرار<br />تقدموا تقدموا<br />إلى فلسطين<br />طريقُ واحدُ<br />يمر من فوهة بندقية<br />إلى فلسطين<br />طريقُ واحدُ<br />يمر من فوهة بندقية<br />إلى فلسطين<br />طريقُ واحدُ<br />يمر من فوهة بندقية<br />إلى فلسطين طريقُ واحدُ<br />نزار قبانى"
archived = "2010-03-14"
capture_url = ""

