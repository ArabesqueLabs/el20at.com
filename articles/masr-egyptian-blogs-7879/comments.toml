subject = "تعجبني عشرينات في فضح الخيبة التي وصلنا اليها"
posted = "2007-12-27"
text = "فعلا اصبح اليوم عندي سمسمية<br />بعد حذف البندقية وحل مهلها السمسمسية<br />يعني النخوة والشجاعة العربية التي تتمثل في البندقية<br />حل محلها اللامبالاة والخيبة والاستهتار وتمثلت في السمسية<br />استمري يا عشرينات في فضح خيبة الشعب المصري والعربي"
