order = 0
subject = "مستقبل النت مظلم"
author = "شايف"
posted = "2009-03-02"
text = "التهمة جاهزة لنشطاء الانترنت وهى<br />الدخول على مواقع ارهابية - ويتم ايداعهم المعتقلات بدون اى محاكمة او استجواب او حتى تدقيق<br />سلام مربع للحرية<br />بطلوا سياسة واتفرجوا على مواقع جنس لتبقوا ارهابيين"
