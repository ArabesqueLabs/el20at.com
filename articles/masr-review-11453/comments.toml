subject = "بشنب ولا من غير شنب يا هواري"
author = "مش لازم يا هواري"
posted = "2009-03-03"
text = "صورتك في الموقع بشنب يا هواري<br />وصورتك وانت بتطلع الصليب من غير شنب يا هواري<br />انت بشنب ولا من غير شنب يا هواري"
