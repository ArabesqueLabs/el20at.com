order = 0
subject = "وما هو رد الحكومة السنية التى ارسلتة الى هناك"
author = "قرفان"
text = "لا شىء<br />لا شىء يهم<br />زى اللى اتقتل بواسطة السفينة الامريكية فى السويس<br />لا شىء<br />لا شىء<br />لاشىء<br />محدش هنا خالص<br />محدش لة دعوة باى حاجة فى اى حاجة"
