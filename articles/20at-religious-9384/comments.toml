text = "ماشاء الله روعة بصراحة فعلا ابداع الله يبارك فيهم و يوفقهم و يجعل العمل خالصا لوجهه الكريم و يجزيهم خير<br />و الله اي شي حلو من اي دولة مسلمة يرفعلنا راسنا كلنا امة واحدة"
