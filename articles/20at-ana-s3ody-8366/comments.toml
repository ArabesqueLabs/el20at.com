subject = "ضع عنوان التعليق"
author = "عيب على كل العرب"
posted = "2008-03-02"
text = "عيب فعلا عيب في اغنية الضمير العربي استقطبو كل المغنيين من العالم العربي وعجزو عن استدعاء مغني او مغنية مغربية وصلو الى الجزائر وتوقفو. اليس المغرب ببلد عربي سحقا للعرب ولبلدانهم ان كنتم لاتعترفون بنا فلانعترف بكم يكفيكم المصريين بعددهم الهائل ويكفيكم لبنان ببناته وفنه ويكفيكم الخليج بثروته النفطية. اما المغرب دعوه يعيش بعيدا عنكم وعن مشاكلكم مادمتم ابعدتموه انتم."
