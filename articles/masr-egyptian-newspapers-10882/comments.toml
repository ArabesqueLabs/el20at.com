subject = "الآخرين يتحركون‏ ومصر  مكتوفون"
author = "Ashour"
posted = "2009-01-08"
text = "تعليمات الجهات العلي<br />فهمي هويدي<br />اللعب في خبر مقتل ضابط الشرطة المصري علي الحدود مع غزة فتح عليَّ بابًا لم أستطع إغلاقه، لقد رويت في اليومين الماضيين كيف أن مصرع الضابط أثناء تبادل لإطلاق النيران مع بعض الفلسطينيين الذين قتل أحدهم وأصيب عشرة منهم أثناء محاولتهم اجتياز الحدود، هذه الواقعة نشرت كحادث مؤسف في البداية، ولكن الأجهزة الأمنية أعادت صياغتها بالكامل لتوظيفها سياسياً واستخدامها في حملة الكيد والتشهير، إذ حولتها إلي جريمة قتل عمد قام بها «ملثمون» من حماس بتعليمات من قيادتهم، في مؤامرة استهدفت إثارة الفوضي علي الحدود، هذه الصياغة الأمنية الجديدة التي عُممت علي كل وسائل الإعلام تجاهلت حقيقة أن تبادل إطلاق النار تم أثناء محاولة اجتياز الحدود، وأن ثمة قتيلاً وجرحي بين الفلسطينيين.. كما شددت علي أن العملية مدبرة بتعليمات من قادة حماس، وأن ضابط الشرطة الشهيد لم يكن يحمل سلاحاً وقتل غيلة وغدراً.. إلخ.<br />هذا الذي عرضته كان له أصداء متعددة استوقفني منها ما سمعته من بعض الزملاء المشتغلين في «المطبخ الإعلامي» وهو المصطلح الذي يطلق علي المواقع التي يتم فيها إعداد المواد الصحفية، والتي يكون العاملون فيها علي دراية بالتعليمات والتوجيهات التي تصدر عن الجهات العليا وتلك التي تحدد وجهة الخطاب الإعلامي، والخطوط الحمراء والخضراء التي ينبغي أخذها في الحسبان.<br />الدور الرقابي لم يكن غريباً عليَّ، وقد سبق وأن أشرت إليه حيث قلت يوم 6/12 إن إعلامنا موجه علي نطاق واسع، لكن ما كان جديداً هو التفاصيل التي سمعتها علي المدي الذي بلغه ذلك التدخل وبهذه المناسبة، وحتي لا أُفْهَم خطأ، أكرر أنني أحد الذين يؤيدون إقامة علاقات إيجابية بين الإعلام والسلطة ويعارضون الخصومة أو القطيعة بينهما، لكني أشترط أن تقوم تلك العلاقة علي أساس من الحوار والاحترام وليس التبعية والاستخدام.<br />كنت أعلم أيضاً أن الأجهزة الأمنية نجحت في اختراق كل وسائل الإعلام المكتوبة والمرئية والمسموعة، فذلك مفروغ منه بالنسبة للصحف القومية والتليفزيون والإذاعة، التي حولها الاختراق الكبير إلي أبواق للسلطة والأجهزة الأمنية، ولكن الجديد أن الأجهزة أدركت أن «المنابر القومية» تراجعت مصداقيتها بحكم اربتاطها العضوي بالسلطة، ومن ثم فإنها ركزت علي الصحف المستقلة، وحققت في أغلبيتها الساحقة اختراقات واسعة، مكنتها من استخدام تلك الصحف في شن الحملات علي المعارضين وتعبئة الرأي العام ضدهم، من خلال الأخبار المرسومة والمعلومات المغلوطة والصور المفتعلة، وما يسري علي الصحف المستقلة ينطبق بنفس الدرجة علي الفضائيات التي يفترض أنها مستقلة، ذلك أن هذه المنابر جميعها خاضعة للتوجيه الذي يتم بالتنسيق بين وزير الإعلام شخصياً وبين الأجهزة الأمنية، ولا مبالغة في القول بأن الاختراق إذا كان قد شمل الإعلام المحلي بجميع منابره وأشكاله، فإن ذلك الاختراق حاصل أيضاً بالنسبة لمكاتب الفضائيات العربية في القاهرة، وإضافة إلي مراقبة كل المواد التي تبث من القاهرة، من خلال أجهزة خاصة في مدينة الإنتاج الإعلامي، فإن سيف الإغلاق وسحب رخص البث مرفوع في وجوهها طوال الوقت، وقد نقل لي الزملاء أن وزير الإعلام بنفسه يهدد بإغلاق أي مكتب، يُشْتٍّم من أدائه أنه لا يلتزم بالتعليمات، وأي مشاهد يتابع تقارير مندوبي قناة «الجزيرة» مثلاً، حين يتحدثون عن الحاصل عند معبر رفح من الجانب المصري، ويقارنها بتقارير زملائهم المتحدثين عن ذات المشهد من الجانب الفلسيطيني لابد أن يلاحظ الفرق، إذ يدرك أن الأولين يتحدثون بحذر من يعلم أن وزير الإعلام يقف وراء ظهره منصتاً ومنذراً، في حين أن الآخرين ينقلون الصورة كما هي، مخاطبين المشاهدين وحدهم وعلي راحتهم.<br />حدثني الزملاء العاملون في «المطبخ» عن التعليمات التي تصدر من «الجهات العليا» داعية إلي التركيز علي مهاجمة حماس تارة، ودمشق تارة أخري، وإيران وحزب الله في مرة ثالثة، وقطر في مرة رابعة، وهذا الهجوم يخرج أحياناً في أخبار ومقالات منشورة، وأحياناً في حوارات تليفزيونية مرتبة، مزودة بالصور التي «تنضح» بها التعليمات، قالوا أيضاً إن وزير الإعلام والأجهزة المعنية يزوَّدون يومياً بأسماء المتحاورين في البرامج التليفزيونية المسائية، وأن الوزير كثيراً ما يتدخل لحذف أو إضافة أسماء بذاتها، وفي بعض الأحيان فإنه يتصل هاتفياً بأشخاص يدعوهم إلي المشاركة في المناقشات التي يقدمها التليفزيون للمشاركة في القيام بـ«الواجب».<br />هذه بعض المعلومات التي يمكن نشرها فيما نقلوه إليَّ في محادثات طويلة، وهناك معلومات أخري فضَّلت التريث في نشرها، لأسباب لا تخفي علي فطنتك، وأنت سيد العارفين"
archived = "2010-03-14"
