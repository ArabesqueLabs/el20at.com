text = "انا شايفة ان الولاد باصين للموضوع من ناحية واحدة ما هو لو انت في مرة رحت لبنت ولقيتها كده دا مش معناه ان كل البنات كده بالعكس في بنات عندهم استعداد يقفوا في وش الدنيا بحالها عشان خاطر يتجوزو الشاب اللي هم مقتنعين باخلاقه وانا اعرف بنت ابوها مقتدر جدا واتقدملها واحد باديء من تحت الصفر حتي الشقة لسه مجابهاش صممت عليه البنت لانه حافظ القران الكريم كله ولان اخلاقه عالية جدا وابوها في الاخر وافق لما لقاها مصممة عليه."
