text = "الجيل بتاعنا غلبان أوى، الولاد مع البنات فى الجامعة و الشغل - مش عارفين نتعامل مع بعض إزاى و اللى معجب بحد مبيعرفش يقول أو يبنى علاقة محترمة كأن الحب جريمة و جواز الصالونات مش جريمة - كلنا شايفين الطلاق بقى كتير إزاى و كله بفضل الجيل القديم اللى بيتحشر فى حياتنا بالرغم إنهم عاشوا و اتجوزو عن حب - مش الخيبة اللى احنا فىها، البنت بقت سلعة لازم تلبس حلو و تتكلم حلو عشان تعجب شخص مسلوب الإرادة و نازل يشوف عروسة تحت ضغط و إلحاح من الست الحاجة اللى عايزة تفرح بخيبته قبل متموت :sad:"
