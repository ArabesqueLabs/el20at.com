posted = "2010-02-19"
text = "يمكن الكلام اللى هاقولة هايزعل ناس كتير. المشكلة ان أحنا قلبنا الموازين بمعنى ان زمان كان الراجل هو اللى بيشتغل والست تقعد فى البيت تربى اولادها وترعاهم خرجت الست من البيت تشتغل فالأولاد مابقوش بيتربوا وأخدت مكان الراجل اللى كان ممكن يشتغل مكانها ويتجوز بنت من بنات جنسها أضعفت قدراتة المادية فأصبح عليها انها تساعده فى الجواز والجهاز<br />ماحدش فكر ليه ربنا سبحانه وتعالى جعل للزكر مثل حظ الأنثنين من الميراث ؟!! لأن المفروض الرجال قوامين على النساء ولان لما هايكون ليا اخ راجل ورث ضعفى بحكم صلة الرحم والدم اللى بينا واللى المفروض اتربينا عليه هايكون بجوار اختة اللى مقبلة على الجواز لأن فى الأول وفى الخر المفروض كل أسرة بتشترى راجل مش بتدفع مقابل الشبكة والشقة اللى هايجبها!!<br />ياجماعة الأوضاع أتقلبت وفى الاخر جت فوق دمغنا فرحنا فى الأول بالمساواة لحد ماضعفنا شخصية الرجالة أو تقريبا نقدر نقول أنقرضوا من كتر مابقينا أحنا اللى بنسترجل.<br />مش معنى كدة ان البنت تقعد فى البيت من غير تعليم بس تتعلم ةتدرس وتعرف ازى تكون ست"
