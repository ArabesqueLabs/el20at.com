[[comments]]
order = 2
subject = "هاشم جد الرسول زار غزه ودفن هناك"
posted = "2008-02-09"
text = "تدل الوثائق التاريخية على استمرار الناس بالعيش في مدينة غزة على مدار أكثر من 3000 عام، كانت أول مرة ذكر فيها في مخطوطة للفرعون تحتمس الثالث (القرن 15 ق.م)، وكذلك ورد اسمها في الواح تل العمارنة. بعد 300 سنة من الاحتلال الفرعوني للمدينة نزلت قبيلة من الفلسطيننين وسكنت المدينة والمنطقة المجاورة لها، عام 635 م دخل المسلمون العرب المدينة وأصبحت مركزا اسلاميا مهما وخاصة انها مشهورة بوحود قبر للجد الثاني للنبي (ص) هاشم بن عبد مناف فيها ولذلك أحيانا تسمى غزة هاشم. وكانت المدينة مسفط رأس الشافعي (767-820) الذي هو أحد الائمة الاربعة عن المسلمين السنة. سيطر الاوروبييون على المدينة في فترة الحملات الصليبية، لكنها رجعت تحت حكم المسلمين بعد ان انتصر صلاح الدين الايوبي عليهم في معركة حطين عام 1187."
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142538/http://masr.20at.com:80/newArticle.php?sid=14133"
