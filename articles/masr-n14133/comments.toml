posted = "2008-02-08"
text = "منقول<br />واحد دخل السوبر ماركت سأل كيلو اللحمةبكام قال له الجزار 30جنيه ‏قعد يدعى:<br />\"الله يخرب بيتك يا ‏محسن ياللى مغلي العيشة علينا\"<br />سأل كيلو السمك بكام قال له بتاع السمك 15 ‏جنيه قعد يدعى:<br />\"الله يخرب بيتك يا محسن ياللى مغلي العيشةعلينا\"<br />سأل بكام الفرخة قال له ‏بتاع الفراخ 10 جنيه قعديدعى:<br />\"الله يخرب بيتك يا محسن ياللى مغلي العيشةعلينا\"<br />واحد مخبر سمعه قبض عليه وراح واخده على ‏القسم ودخل على الظابط قال له: تمام يا فندم الظابط ‏سأله: ماسك الراجل ده ليه؟؟قال له: الراجل ده مش عارف اسم ‏الريس يافندم"
archived = "2008-02-16"
