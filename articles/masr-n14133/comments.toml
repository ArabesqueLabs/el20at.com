author = "علي"
posted = "2008-02-08"
text = "مسابقة \"الطريق من هنا\".. شارك<br />سؤال هذا الأسبوع لقناة الناس الفضائية :<br />أي أجداد النبي صلي الله عليه وسلم زار مدينة غزة:<br />1. عبد المطلب بن هاشم.<br />2. هاشم.<br />3. عبد مناف.<br />للمشاركة في مسابقة:<br />اتصل من أي محمول علي 1465 ومن أي خط أرضي علي 09000255"
