[[comments]]
order = 0
subject = "مسرحية فاشلة"
author = "مساعد مخرج"
text = "العملية كلها مرسومة فى مباحث امن الدولة - يجيبوا فرقة خاصة بملابسها الرسمية من الشرطة يعملوا عرض وتانى يوم يقبضوا على القيادات السياسية والفكرية فى البلد بتهم مزورة ومزيفة والقضاة العسكريون المجهولى الاسم ادركوا مدى سطحيتها لان دة هينكتب فى التاريخ وهتيجى ناس بعد كدة تحلل الاحداث دى<br />تمام زى ما حصل فى التسعينات لما امريكا قالت للحكومة الحقوا الاسلاميين هيمسكوا الاقتصاد وتم تدمير الاقتصاد والاستثمار والقبض على السعد والشريف وغيرهم وتصفية شركاتهم بتهمة انهم هيسيطروا على الاقتصاد<br />طيب ما حدش بيتكلم عن مليارات سويرس لية والا لكح ومنين جابوا فلوسهم<br />والنصارى وعشرات المصانع فى العاشر والمليارات ومحدش بيقول هيسيطروا على الاقتصاد<br />اشمعنا السعد والشريف والشاطر وغيرهم من الشرفاء<br />اظن العملية قدام رجل الشارع البسيط بقت ريحتها وحشة قوى<br />والمحكمة العسكرية اللى حكمت بكدة هتحال للتقاعد فى يناير وهتتشكل محكمة جديدة قريب جدا"
archived = "2007-12-18"
capture_url = "https://web.archive.org/web/20071218074627/http://masr.20at.com:80/newArticle.php?sid=13455"

[[comments]]
order = 1
subject = "سياسة وليس دين"
text = "يا جماعة دي سياسة لا علاقة لها بالدين<br />خيرت الشاطر مسجون سياسي<br />جماعة الاخوان جماعة سياسية لا علاقة لها بالدين<br />شوية اطباء ومهندسين ومحامين وصحفيين ومدرسين عاملين حزب سياسي ما لوش علاقة بالدين وان كانوا يريدون اقامة دولة دينية"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216215323/http://masr.20at.com:80/newArticle.php?sid=13455"
