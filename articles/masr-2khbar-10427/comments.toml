subject = "ahmekabrahim@yahoo.com"
posted = "2008-11-11"
text = "بسم الله الرحمن الرحيم<br />مهزلة تعليمية وإدارية بمدرسة السادات الإعدادية بالفيوم<br />السيد الفاضل /<br />تحية طيبة وبعد ...<br />لن اكتب مقدمات ... ولكني سوف اسرد حقائق لمهزلة تعليمية .. في مكان يطلق عليه مدرسة<br />مدرسة .. امام محافظة الفيوم .. يطلق عليها مدرسة السادات الاعدادية بنين<br />لا تحتوي على ما يشير مطلقا بأنها مدرسة .... فالتسيب هو سمة كل شئ بها ... مباني خربة ... اساس محطم وغير موجود ... عهد يتم تسويتها .. مجاملات واكراميات وهدايا والكثير الكثير واليكم الحقائق<br />• لا يوجد بالمدرسة التي تحتوي على 11 فصل اكثر من 40 تختة .. متهالكة<br />• الطلاب يجلسون على الارض لتلقي القليل من العلم<br />• الادارة متسيبة مشغولة بالامور الشخصية عن العمل<br />• طلاب يقفزون من سور المدرسة امام الادارة بالكامل<br />• طلاب يخرجون بعد الحصة الاولى امام الادارة التي تفتح لهم ابواب المدرسة<br />• عمال غير متواجدين<br />• عهد ناقصة<br />• ادارة لا تعلم شئ عن المدرسة بالكامل<br />• افعال لا اخلاقية من الطلبة ... ولا موقف من الادارة<br />• تسرب في طلاب الصف الثالث بالكامل ... ولا ادارة<br />• عدم انتظام للعملية التعليمية .. ولا ادارة<br />• ادارة غير مؤهلة لحل مشاكل المدرسين او الطلاب<br />• ادارة تتكون من مديرة ادارة مدرسية وناظرة واربع وكيلات ... على 11 فصل فقط وفاشلون في ادارة المدرسة<br />• اختراق للقوانين... وتحدي صارخ لخطابات النقل<br />• ادارة تقول دائما بأنهم فوق القانون . ولايستطيع احد نقلهم من تلك المدرسة .. لانهم تعاملوا مع القائمين على العملية التعليمية في الادارة والمديرية<br />• ادارة مدرسية نسائية ... في مدرسة للبنين في سن المراهقة<br />• افعال يندى لها الجبين بين الطلاب .. ولا محاولة للحل من قبل الادارة<br />• تزمر واضح من كل مدرسي المدرسة ... ضد الادارة الفاشلة<br />• ثم بعد ذلك .. انشغال بالامور الشخصية بدلا من العملية التعليمية<br />نرجو من سيادتكم وضع حد لتلك المهزلة الاخلاقية التي تقطن بمدرسة السادات الاعدادية للبنين<br />وفقكم الله الى ما فيه خير التعليم في مصر"
