[[comments]]
order = 2
subject = "والدي أبا عدي وقصي :- هم يمنّون أن خلّوا يابك يامع"
author = "عراقي (( سنّي ))"
posted = "2008-02-19"
text = "إلى الشهيد البطل .. إلى الزعيم الرائد .. إلى المفوار القائد .. إلى المعلم الطيب .. إلى صقر العروبة .. إلى أسد العروبة .. إلى ذئب العراق العظيم .. إلى إنسانٌ أضحى اليوم تحت فراش التراب مدفون .. إلى إنسانٌ ماعرف يوماً ما طعماً للهزيمة . للإستسلام . للتخاذل . للهوان . للذل . للضعف .. إلى إنسانٌ هو تعريفٌ للحياة بأكملها .. إلى إنسانٌ عاش عزيزاً كريماً قوياً بطلاً شهماً قائداً مغواراً معلماً رافعاً رأس الأمة العربية والإسلامية .. أنا اتحدى بأن هناك أي شخص على وجه الكرة الأرضية يضاهي ظفر هذا الرجل . أتعرفون ظفره الذي يقصصه م يرميه !!! أريد إنسانٌ أن يأتي بظفره .. بظفر رجله !!! أريد إنسانٌ يحمل كل معاني هذا الرجل .. أريد إنسانٌ يعرف معنى الرجولة بحق .. أريد إنسانٌ بقوة وبسالة وجرأة وشهامة هذا الرجل .. أريد إنسانٌ أن بأتي بمثله !!!!!!!!! والله لو يلف العالم أجمع كله .. من يمينه إلى يساره .. من شماله إلى جنوبه .. من فوقه إلى تحته .. من هنا إلى هناك .. من ومن ومن ومن .. لا ولن ولم يلاقي مثل هذا الرجل الكبير بشعبه وأهله وناسه .. الكبير بعزته بوفاءه بعروبته بمجده التيلد الذي لايلين البتّه .. بجوده وكرمه وعطاءه .. بنظرته التي هي مليئة بمعاني الحياة كلها .. بنظرته الثاقبة القوية .. أنا أريد رجلاً إنساناً . مثل صدام حسين المجيد ..<br />لقد ضاعت كرامة العرب .. لقد ضاع كل شيء .. منذ وفاته وإلى الآن والعرب نائمون .. غافلون .. ساهون .. في سبت عميق .. في غباءٍ مدقع !!!<br />في زمنه هو ملك زمانه بلا منازع .. أيام الراحل لم يكن هناك معنى للخوف أو الرهبة أو القلق أو التوتر .. لإن هناك رجلٌ .. إنسانٌ .. قائد ٌ فذٌ .. صاحي لهم .. هذا الإنسان الذي كان حلمه الأول والوحيد في حياته أن يرى فلسطين الحرية محرره من دنس الصهاينة .. أبناء القردة والخنازير .. أيام المرحوم .. كان الفلسطينيون في عز .. كانوا في آخر انبساط وفرحين جداً .. فهم فعلاً أناسٌ كانوا يقولون مايفعلون ! لا بل كانت أفعالهم تسبق أقوالهم .. هم أناس ٌ لطالما أحبوا أبا عدي وقصي .. لطالما احترموه وقدره ووضعوه تاجاً عل رؤوسهم ووسامٌ على صدرهم !! يالله !!<br />كم هي جميلة ورائعة وحلوة تلك الأيام .. يالله !! عندما كلن صدام موجوداً .. كان كل العراق يكنُ له كل احترام وتقدير .. كان ذا مكانة .. كان يعطف على الصغير ويحن عليه ... كان هو وشخصيتة القوية تفرض ذاتها .. من خلال تعامله مع الشعب العراقي .. ولم لا أيس هو الذي بنى العراق العظيم حجرأ حجرأ حجرأ .. لبنه لبنه لبنه !! أليس هو الذي أنعم على الشعب العراقي بالحرية والأمن والإستقرار والأمان والطمأنينة على بلده .. أليس كان همه أن يوحد صفوف العراقيين جميعهم دون استثناء أو تمييز .. عراقه عراقٌ واحدٌ .. ودم العراق دمٌ واحدٌ .. وسبيل العراق سبيلٌ واحدٌ .. ونهضة العراق وتقدمه نهضةٌ واحدة .. الخ<br />الآن .. وبعد الإحتلال الأمريكي للعراق .. يتمنون العراقيين بأن يرجع الزمن بهم إلى الوراء قليلاً .. لكي يكونوا تحت ظل الرئسي المرحوم .. كانوا يتمنون أن العراق لم يُحتل من الأساس .. كانوا أفضل وأحسن حالاً مما هم عليه الآن !! ورجاءٍ أفضل السكوت هنا .. عضضتم أصابيعكم ندماً لا بل أيديكم ندماً .. لأنكم وبكل بساطة لم تتكاتفوا وتوحدو صفوفكم مع بعضكم البعض .. لو إنكم وقفتم مع بعضكم بعضا جنباً إلى جنب لما كان حصل الي حصل !! ولكن أبت الأقدار إلاّ أن تغيّر كل شيء في العراق .. وأيضاً قدر الأمريكي أن يلعب بكم .. ويعمل بمخكم غسيل من أول وجديد .. لا أدري !!<br />وكما قال اشهيد صدام حسين المجيد ..<br />الله أكبــــــــــــــــــــــــــــــــــــــــــــــــــــر ...<br />وليخسئ الخاسؤون ...<br />وعاش العراق العضيم ...<br />ولا قرّت أعين الجبنــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــاء يوما ...<br />وأشهد أن لا إله إلاّ الله وحده لا شريك له .. وأن محمدأّ عبده ورسوله ..."
