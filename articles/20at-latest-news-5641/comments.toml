subject = "بطل للنها ية"
author = "فهد الا سلام"
posted = "2007-04-29"
text = "يكفنا فخر انك لم تبع نفسك للامريكان نعم كنت طغية على المارقين احفاد هولا كو والمجوس عبدة النار كفاك فخر انك مت على الشهداة ياليت كلنا صدام فى وجة الكفرة والمجوس الشيعة فهم فعلا جبناء لم يظهر لهم صوت الا بعد موتك يا شهيد يا من احببت الحسين اكثر منهم ويا ليت وقعوك با يدهم ولكن دايما الغدلر فيهم كل عام وانت طيب وفى جنة الله ويغفر للك ربى"
