[[comments]]
order = 1
subject = "الا يكفينا قص ولزق يا صحافة"
author = "أحمد"
posted = "2007-04-30"
text = "بسم الله الرحمن الرحيم<br />اولا رحم الله القائد صدام حسين، ويكفيه شرفا انه رفض ان يقدم العراق على طبق من ذهب مقايل الإقامة في الإمارات العربية المتحدة، وإختار الصمود والتضحية بحياته وحياة ابنائه.<br />ولي ملاحظة للإخوة، هل ما تكتبه رويترز او غيرها من وكالات الغرب، هل هو قرآن منزل!!! لماذا لا تقومون بتحرير الخبر وتحذفون منه ما يسيئون به لأمتنا!!؟؟؟ فلماذا لم تحذفوا كلمة دكتاتور!!!!<br />واسألكم، هل رويترز وغيرها من وكالات الغرب تصف بوش عندما تتحدث عنه بأنه مجرم حرب وجزار، وهل تصف ما يجري في العراق بأنه إحتلال؟؟ طبعا لاااااااااااااا، والسبب انهم لديهم مشاعر إنتماء لأمتهم، وللأسف يبدوا انكم لا تملكون ذلك!!!<br />فالإعلام العربي إنتقل من مرحلة الإنغلاق الكامل إلى مرحلة \"الدياثة الإعلامية\"."
archived = "2010-03-14"
