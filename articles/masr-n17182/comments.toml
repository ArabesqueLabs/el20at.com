subject = "بصلة مصننة"
author = "ابوعبدالله"
text = "اللى هايسمع دعاء(ِِِِِِشريين)مثنى شر<br />يبقى صدق فيه المثل اللى بيقول<br />صام صام وفطر على بصلة مصننة"
archived = "2008-09-01"
capture_url = "https://web.archive.org/web/20080901220355/http://masr.20at.com:80/newArticle.php?sid=17182"
