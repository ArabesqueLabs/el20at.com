[[comments]]
order = 1
subject = "بلاش نشوف القناة الاولى فى رمضان"
author = "و احد"
text = "اشمعنى شيرين - لية ما تكونشى فيفى عبدة والا المحروسة خالدة الذكر هياتم<br />ولا تشوفوا اصوات سجلتها سوزان تميم بتاع لجنة السياسات فى فندق الفور سسونز فى الشرم تذيعوها بعد الفطار<br />اة يا بلد"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030817/http://masr.20at.com:80/newArticle.php?sid=17182"

[[comments]]
order = 2
subject = "يارب العالمين الى اين نحن زاهبون؟هل نحن فى علم ام فى كابوس مخيف"
author = "ممدوح زكى زخارى جرجس_الاسكندرية -مصر"
text = "اين الاصوات الجميلة التى نستمتع بها طوال الوقت امثال الشيخ النقشبندى و الطبلاوى و قيثارة السماء شيخنا الجليل محمد رفعت رحمة اللة؟<br />و غيرهم كثيرين انجبتهم بمصر باصواتهم العذبة الرخيمة من مشاهير القراء شيوخنا الاجلاء<br />(أليس صوت المراة عورة) ام هذة المسماة شيرين(ملاك من ملائكة السماء)<br />هل انقرضت الرجال انستعير بامراءة؟<br />ارحمنا ياللة العظيم و اغفر لنا"
archived = "2008-08-27"
capture_url = "https://web.archive.org/web/20080827031352/http://masr.20at.com:80/newArticle.php?sid=17182"

[[comments]]
order = 3
subject = "هو مفيش رجالة فى البلد والا اية؟"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "صحيح كان زمان يقال(القوالب نامت و الانصاص قامت)<br />اما الان اسمحو لى ان اقول عاليا(اذ لم تستح فافعل ما شئت؟)<br />لقد جعلتونا نشعر بالخزى و الهوان؟<br />اين اصوات احبابنا دعات مصر الرجال زوى الاصوات الجميلة المتقربة الى اللة<br />يا تليفزيون الغوازى لعنكم اللة<br />اين نحن حقا فى مصر او فى جهنم الاخرة ايها الشياطين مسئولى التليفزيون المصرى؟<br />و اللة مسئولى تليفزيون اسرائيل يستحوا القيام بهذا الفعل الكافر يا كفرة يا عبدة المال يا مريدى النساء؟؟؟؟؟<br />فضحتونا"
archived = "2008-08-27"
capture_url = "https://web.archive.org/web/20080827031352/http://masr.20at.com:80/newArticle.php?sid=17182"

[[comments]]
