order = 0
subject = "وكانت جامعة اسيوط فى الستينات ايام عبد الناصر بدون اسوار وبدون حرس"
author = "خريج قديم"
text = "وكذلك جامعة اسكندرية كانت بدون اى حرس حتى سنة 1970 وكان الناس الخريجين القدامى يدخلون المكتبات ويقابلوا الاساتذة وكنا نتنقل بين كفتيريا التجارة والاداب وكفتيريا الهندسة<br />وكانت الامور عادية جدا<br />انما بقى لما الامن يبقى عايز يحط مناخيرة فى كل حاجة فتبقى دى حكاية تانية"
archived = "2009-03-24"
capture_url = "https://web.archive.org/web/20090324012016/http://masr.20at.com:80/newArticle.php?sid=20369"
