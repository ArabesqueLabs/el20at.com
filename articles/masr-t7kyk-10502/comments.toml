subject = "السلامية المهنية والامن والسلامة"
author = "مرزوق"
posted = "2008-11-15"
text = "اى عامل يدخل موقع العمل من امريكا غربا وحتى الصين شرقا مرورا بالدول المتقدمة والمتأخرة ودول الخليج كل عامل غير مسموح لة ان يدخل موقع العمل بدون الخوذة الواقية وحذاء الامان - اى موقع عمل - سواء عمال البناء او العمالة الفنية فى الورش والمصانع<br />وفى المعامل حيث الابخرة والغازات هناك الماسك الورقى الذى يلبس على الانف للوقاية من الابخرة والغازات وقد لفت نظرى فى موسم الحج ان الحجاج فى مكة القادمين من شرق اسيا من ماليزيا وسنغافورة واندونيسيا يرتدون الماسك الورقى على وجهوهم للحماية من فيروسات الزحام ونزلات البرد<br />اما عندنا<br />لو قلت لواحد عامل او فلاح البس الماسك على مناخيرك علشان الغازات والابخرة يمكن يشتمك او يتعدى عليك بالقول واليد<br />فى احد المرات شفت فلاح بيرش محصولة بمبيد حشرى سام جدا والابخرة والرزاز حوالية من كل ناحية - قلت لة يا اخينا حط على مناخيرك منديل او اربط منديل على مناخيرك يمنع استنشاق السموم دى - طبعا مفيش ماسكات ورقية فى السوق عندنا - فالراجل زعل جدا وكانى شتمتة - وطبعا بييجى لهم امراض كبد وكلى وتسمم دم وبلاوى<br />الخلاصة ان السلامة المهنية معدومة فى بلدنا<br />وحتى طلبة الكليات المفروض يعلموهم مبادىء السلامة المهنية وضرورتها<br />انما الكليات مش فاضية او متخلفة عن العالم او محدش مهتم<br />احنا جرى لنا اية"
