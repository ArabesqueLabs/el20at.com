subject = "تستمر الحياة ........و تستمر الزيادة"
author = "منير"
posted = "2008-06-04"
text = "السلام عليكم و رحمة الله و بركاته<br />مازلنا نسمع عن المبادرة الوطنية للتنمية البشرية ...تغطي عن عنوان إسمه حقيقة المغرب الكارثية....و تستمر الزيادة المادية ...لتساهم في عجز القدرة الشرائية ....<br />أجي تشوف أو تسمع ....راه كيزيدوا في اسوايع ...اش هاد الكية أيا الجايع....<br />اصبر دوانا ....حتى ايحن مولانا ...أو يهلك لظلمنا..أو جوع أطفالنا<br />تستمر الحياة و تستمر الزيادة"
