[[comments]]
order = 1
subject = "عذر اقبح من ذنب"
author = "نجية"
posted = "2008-06-03"
text = "فعلا زيادة 60 دقيقة على التوقيت الرسمي قلبت جل الموازين و الأسوء ان جل المغاربة لا يفهمون معنى هذعه الزيادة و لا السبب الكامن ورائها و على حد قول بعض الصحف العربية مادمنا نتبع سياسة التقشف حتى في الوقت لما لا يقتصد كبار المسِؤولين في مصاريفهم و يتبعون سياسة التقشف في المعاشات الباهضة التي يتقاضونها او التي تصرف على الامور الفارغة مثل مهرجان موازين الذي اخد فيه كل لمست فقط قدماه ارض الخشبة 70 الف درهما فما فوق<br />فعلا زمن العجائب و المشكلة العذر أقبح من الذنب الاقتصاد في الطاقة و السؤال هل المواطن العادي وراء استغلال الطاقة حتى ان هناك من يدفع اجرة الطاقة باهضا دون استغلالها و العكس صحيح"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "زيدو في الخلصة"
author = "زبيدة"
posted = "2008-06-04"
text = "نعم أختي الغالية، لقد أقرت الحكومة المغربية الزيادة في التوقيت لأول مرة سنة 1984، واستمرت التجربة حوالي 15 شهرا، ليتم تكرار التجربة سنة 1989، وها هي تعيد الكرة وذلك لأسباب موضوعية وأخرى... لدس الغبار في الأعين والتمويه على الأجور الجامدة والزبادات الصارروخية في الأسعار التي تفوق عقارب الساعة، ناهيك عن الزيادة في معدل البطالة والفقر والتهميش، إن الشعب المغربي قد ضاق درعا من تلك الزيادات المرعبة فإلى متى ستظل الحكومات المتتالية تطبق سياسة النعامة التي تدس رأسها في الرمل كي لا يراها الصياد"
archived = "2010-03-14"
capture_url = ""

