[[comments]]
order = 5
subject = "ساعة قديمة و ساعة جديدة و حكومة قديمة و حكومة جديد"
author = "المحمودي"
posted = "2008-06-04"
text = "كنا ننتظر الزيادة في الأجور خاصة بعد الزيادات الأخيرة في المواد الغذائية و الطاقية لكننا نفاجئ أن حكومتنا الغير الموقرة زادت 60 دقيقة على الوقت الحالي ، فالرجل المسكين الذي كان يصلي المغرب في الساعة 16و الربع أصبح يصليها في 17 و الربع<br />و الذي كان يذهب للعمل في الثامنة صباحا أصبح حاليا يذهب في السابعة و لكن باختلاف بسيط حيث السابعة أصبحث الثامنة.<br />حكوماتنا القديمة و خاصة حكومة عببيس الجديدة تتلاعب بنا كيف ما شاءت رغم أنها أضعف حكومة مغربية مرت على المغرب"
archived = "2010-03-14"
capture_url = ""

