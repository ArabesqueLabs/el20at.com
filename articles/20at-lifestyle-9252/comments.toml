subject = "لله الأمر من قبل ومن بعد"
author = "نادية العربي"
posted = "2008-06-04"
text = "من ألف استعمال الضوء والطاقة فسوف يستعمله سواء أضيفت ساعة أم لا ولكن المسألة لا تكمن هنا إنما هو تلاعب الحكومة الماكرة وتمويهها للشعب المستضعف وإشغاله بأمور لا علاقة لها بهمومه بينما هو يحارب من أجل رغيف الخبز وتحسين ظروف المعيشة حسبنا الله ونعم الوكيل"
