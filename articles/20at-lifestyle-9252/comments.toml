text = "والله حتى بصاح ، الدولة تتلاعب بنا كلما شاءت وكيفما شاءت نحن فعلا في حاجة إلى الزيادة في الرواتب والاجور وفي فرص وجود وظيفة وليس في تحريك عقارب الساعة<br />ولكن لقد اسمعت لو ناديت غير أنه لا حـــــــــــــــــــــيــــــــــــاة لــــــــمــــن تــــــنـــــــــــادي"
