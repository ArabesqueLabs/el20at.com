subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-06-05"
text = "هذه الساعة الإضافية أهلكتنا من أول يوم و لا زال مفعولها حتى الان ساري المفعول .. كان على الحكومة أن تصدر قرارا للموظفين أن يبدءوا أوقات العمل على الساعة السابعة صباحا دون أن يلعبوا بعقارب الساعة و كدا التلاعب بالشعب فلو اعرف من اقترح هدا الامر لكنت ضربته ضربا مبرحا مادا سيحصل لو تم بدء العمل على الساعة السابعة صباحا<br />قلبت لينا كلشي انا بعدا خليتك لله هو اللي ياخدلي فيك الحق واش فراسك واش كلشي الناس معايا في هاد الشي راه رونتينا و زايدها زايدين وقت فابور شحال كاع كانشدو على هاد الحساب الراحة احسن اكلس بنادم في دارو احسن ليه من هاد الهبال ."
archived = "2010-03-14"
