subject = "عادى جدا"
author = "ايات الحبال"
posted = "2008-06-04"
text = "بما ان كل حاجه زادت وغليت مش فى مصر ولا ف المغرب لا فى كل العالم العربى واصبح الواد بيدفع مرتبه على الاقساط والضرايب ةوالاجار اول ما يقبض فمش غريبه انى اسمع انهم زودو الساعه بس احمدو ربنا ان الوقت مش بفلوس واننا غير مقدرين لقيمه الوقت لحد كانو دفعوكم تمن الساعه دى"
