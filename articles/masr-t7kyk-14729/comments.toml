author = "نظيف برىء"
posted = "2010-01-03"
text = "نظيف اشبة بشاهد ما شفش حاجة - ولا هو هنا - ولا لة فى الثور ولا فى الطحين - رئيس وزراء بيعمل اجتماعات مع المحافظين لمناقشة انفلونزا الطيور او انفلونزا الخنازير ويتصور معاهم ويتغدى فى العزومة ويروح بيتة وكانة حكيمباشى المستشفى الاميرى ونظرا لطولة وفخامتة فهو يقف فى التشريفة عند سفر الرئيس او قدومة من الخارج فهو بالبلدى رجل طمبة يعنى منظر بيمثل دور - انما الذى يختار الوزراء فهو الجهات الامنية والسيد مدير مباحث امن الدولة وتعرض الاسماء على احد الانجال ويتم الموافقة واخيرا يخبر السيد نظيف ان نفر جديد من المجموعة هيطلع وهييجى نفر تانى<br />وتسلم تسلم وسلامتها ام حسن"
