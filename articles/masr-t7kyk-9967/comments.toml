text = "ربنا يكون في عون الشعب ...<br />.................................................................أتمنى النشر<br />السلام عليكم ورحمة الله<br />القرآن الأمريكي الجديد (استغفر الله)<br />تحريف للقرآن الكريم<br />القرآن الأمريكي الجديد أمر خطير جداً<br />وتحريف واضح للقرآن<br />قرآن جديد يوزع في الكويت<br />اسمه ((الفرقان الحق))<br />والله يا أخوان إنه شيء خطير وخطير للغاية<br />اللهم أعز الإسلام والمسلمين وأذل الشرك والمشركين من اليهود والنصارى والمنافقين<br />آمين آمين آمين.<br />آيات شيطانية جديدة تسمى (الفرقان الحق) توزع في الكويت<br />رجاءً الحاضر يعلّم الغائب،<br />اللهم فاشهد، أمانة على كل من سمع أو قرأ هذا الكلام أن يبلّغ به أكبر عدد ممكن من المسلمين.. اللهم فاشهد، اللهم فاشهد!<br />مجلة الفرقان الكويتية<br />سلطت الضوء على مصحف مزعوم هو تحري ف للقرآن يوزع في الكويت، ووصفته بالآيات الشيطانية.<br />إنها حقاً آيات شيطانية ، فهي تحرض على الشرك بالله وتعمل على تخريب عقيدة أبناء المسلمين.<br />وذكرت المجلة التي جعلت من الموضوع عنواناً لغلافها:<br />تمخضت دارا النشر الأمريكيتان<br />Omega 2001 و wine Press<br />فقذفتا لنا أخيراً، آيات شيطانية أسم ياها (الفرقان الحق).<br />وهو ليس سوى الكتاب المقدس للقرن الحادي والعشرين!<br />أو سمه إن شئت كتاب السلام! أو مصحف الأديان الثلاثة!!<br />قدم له عضواً اللجنة المشرفة على تدوينه وترجمته ونشره المدعوان الصفي و المهدي – كما ورد في مقدمته - وذكرا بأنه للأمة العربية خصوصا وإلى العالم الإسلامي عموماً.<br />مصحف (الفرقان الحق) المزعوم يقع في 366 صفحة من القطع المتوسط ومترجم إلى اللغتين العربية والإنجليزية..ويوزع حالياً في الكويت ، خاصة على المتفوقين من الطلبة في المدارس الأجنبية الخاصة، التي أصبحت مرتعاً خصباً للمنصرين، للتأثير على فلذات أكبادنا وبث ثقافة الاستسلام في أذهان الأجيال القادمة من أبنائنا وبناتنا، حتى يردوهم عن دينهم الإسلامي الحنيف، لاسيما أن الشباب يمثلون طموح الأمة وقادة المستقبل..<br />فها هي أصابع التغيير وجهود التنصير ومخاطر حقبة السلام تتسلل إلى عقول أبنائنا وتعبث بمعتقداتهم وقيمهم وأفكارهم.<br />إنها حرب باردة خفية تدور على أبنائنا في ظل غفلتنا وانشغالنا بأعباء الحياة وتكالب الأعداء على أمتنا الإسلامية!..<br />يبتدئ المصحف المزعوم بمقدمة مسمومة ترسخ وتؤصل للخلط العقدي وحرية الأديان في مرددات تنصيرية،<br />زاعمة أن (الفرقان الحق) لكل إنسان بحاجة إلى النور بدون تمييز لعنصره أو لونه أو جنسه أو أمته أو دينه.<br />ويتألف من 77 سورة مختلقة وخاتمة.<br />ومن أسماء تلك السور المفتراة:<br />الفاتحة -المحبة - المسيح - الثالوث - المارقين - الصَّلب - الزنا - الماكرين – الرعاة -الإنجيل - الأساطير - الكافرين - التنزيل - التحريف - الجنة - الأضحى – العبس-الشهيد.. إلخ !!!!<br />ويفتتح بالبسملة الطامة بقولهم:<br />(بسم الأب الكلمة الروح الإله الواحد الأوحد.<br />مثلث التوحيد.. موحد التثليث ما تعدد)!!!<br />يتجلى فيه خلط واضح لمعنى الإله فهو الأب كما زعمت النصارى<br />ومثلث التوحيد وهو الإله الواحد الأحد كما نؤمن نحن المسلمون.<br />ثم تأتي سورة الفاتحة المزعومة بتلبيس إبليس في مطابقة اسمها لفاتحة القرآن العظيم..<br />ثم سورة النور.. ثم السلام.. وهكذا.<br />وفي سورة السلام المفتراة حشو للإفك والباطل وتلفيق واضح، ومن آياتها:<br />(والذين اشتروا الضلالة وأكرهوا عبادنا بالسيف ليك فروا بالحق ويؤمنوا بالباطل أولئك هم أعداء الدين القيم وأعداء عبادنا المؤمنين).<br />فمن ذا الذي في عصرنا يُكره المؤمنين ليكفروا بالحق غير أعداء الله من اليهود والنصارى؟<br />ثم يأتي التصريح بالنصرانية ليكشف عن مكنون صدورهم<br />في السورة ذاتها بقولهم افتراء على الله:<br />(يا أيها الناس لقد كنتم أمواتا فأحييناكم بكلمة الإنجيل الحق. ثم نحييكم بنور الفرقان الحق)<br />ثم يتجلى التحريف والعبث بآيات القرآن العظيم في كل آيات ذلك الكتاب.<br />ثم تأتي الفرية في الكذب على الله بقولهم:<br />(لقد افتريتم علينا كذبا بأنا حرمنا القتال في الشهر الحرام , ثم نسخنا ما حرمنا فحللنا فيه قتالا كبيرا )!!.<br />وفي سورة المسيح التي خطتها أيديهم الآثمة:<br />(وزعمتم بأن الإنجيل محرف بعضه فنبذتم جُلَّه وراء ظهوركم).<br />وبذلك يستنكرون على القرآن بيان حقيقة تحريفهم للإنجيل والتوراة.<br />ويتبع ذلك اتهام المسلمين بالنفاق في مثل قولهم:<br />(وقلتم: آمنا بالله وبما أوتي عيسي من ربه ، ثم تلوتم منكرين..<br />ومن يبتغ غير ملتنا دينا فلن يقبل منه.. وهذا قول المنافقين) !!.<br />ويتواصل الرفض لاستخدام القوة في قتال الكفار أعداء الله<br />بقولهم في السورة المزعومة نفسها:<br />(وكم من فئة قليلة مؤمنة غلبت فئة كثيرة كافرة بالمحبة والرحمة والسلام) !!<br />ثم يتعمدون مساواة الطهر بالخبث والنجاسات!! ومساواة النكاح بالزنا!!<br />في سورة الطهر بقولهم على الله زوراً وكذباً:<br />(وما كان النجس والطمث والمحيض والغائط والتيمم والنكاح والهجر والضرب والطلاق<br />إلا كومة رجس لفظها الشيطان بلسانكم وما كانت من وحينا وما أنزلنا بها من سلطان).<br />تلك أمانيهم أن نكفر بالقرآن العظيم وبآيات الله عز وجل<br />ونتبع إنجيلهم المحرف وفرقانهم المكذوب على الله ولكن هيهات لهم!.. هيهات!<br />أخي المسلم بالله عليك كن غيوراً على دينك وساعد في نشر هذه الرسالة ووزعها على كل من تعرف حتى نحارب هذا الخطر الذي يحارب الإسلام وأهله وحتى تلاقي ربك.<br />وتجد الإجابة حين يسألك عن هذا الموضوع، ماذا فعلت حين علمت أن القرآن قد حُرّف ؟<br />هل أخبرت من حولك وساعدت في مجابهة هذا الخطر؟<br />وساعدت في نشر هذه الرسالة؟<br />أم قلت مالي وشأني ؟<br />أخي المسلم:<br />اعمل ليوم تذل فيه الأقدام ويحتاج أحدنا لحسنة لا يجدها حتى عند أقرب المقربين منه.<br />إعمل ليوم لا ينفع فيه مال ولا بنون إلا من أتى الله بقلب سليم..<br />أخي المسلم اعمل ليوم تلقى فيه حبيبنا رسول الله صلى الله عليه وسلم<br />فيلقاك بوجه مستبشر ويقول يا رب هذا من أمتي، ويسقيك من يده الشريفة شربة هنيئة لا تظمأ بعدها أبدا<br />سبحانك اللهم وبحمدك أشهد أن لا اله إلا أنت أستغفرك وأتوب إليك.<br />حقوق الطبع والنشر والتوزيع محفوظة<br />لكل مسلم يغار على دينه ويدافع عنه بكل ما أوتي من قوة"
