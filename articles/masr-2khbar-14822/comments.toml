author = "ابومحسن غربة 28 سنه"
posted = "2010-01-12"
text = "تسمحولي اقول رايي في هذا الموضوع<br />لماذا قال الله سبحانه وتعالى وانكحوا ما طاب لكم من النساء مثنى وثلاث ورباع<br />لان الراجل قبل الزواج لا مؤاخذه بيبقى عنده شهوه<br />بيعتقد انه اول ما حيتزوج حتتحل عنده هذه القضية<br />بعد الزواج بفترة بيفاجىء ان فيه شهوه ثانية<br />اقصى من الشهوة الاولى التي كانت قبل الزواج<br />الا وهي شهوة التغيير<br />ولذلك تجد ان بعض المتزوجين من واحدة مثل العزاب تماما يجرون ورا البنات والسيدات وكأنهم مراهقين<br />ولذلك جاء التشريع الرباني وانكحوا ما طاب لكم من النساء مثنى وثلاث ورباع<br />والموضوع يطول شرحه"
archived = "2010-03-14"
