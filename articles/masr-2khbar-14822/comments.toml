author = "فراغ وكتر فلوس"
posted = "2010-01-12"
text = "الموضوع مش شهوة ولا بدنجان<br />ما هو كلة خرم وخلاص<br />الموضوع كتر فلوس ووقت فراغ وسطحية فى التفكير<br />والتعدد موجود علشان الناس الاوفر الغير طبيعيين اللى عندهم طاقة زايدة جدا وممكن يعملوا مشاكل وعندهم مقدرة مادية يتزوجوا اتنين وتلاتة<br />انما عامة الناس امراة واحدة تكفى<br />انما التنوع والجمال والكلام الفارغ دة فكلهن فى فى الظلام على السرير واحد"
archived = "2010-03-14"
