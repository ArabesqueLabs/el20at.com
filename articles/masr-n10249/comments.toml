posted = "2007-05-25"
text = "انا عايز اشكر الكاتب احمد قطب على تصديه الراقي لمقالة المدعو جورج رياض<br />لان والله مهما حاولتوا مصر هتفضل عربية مسلمة الى ان يشاء الله ,;hk ydv;,h ha'v<br />وبعدين يا جماعة انا شايف ان خلطة الاعراق والهويات اللي مصر فيها دي مش حلوة<br />بصو حوالينا تلاقوا كل شعب عارف هو ايه<br />بصو على الخليج تلاقيهم هناك عارفين انهم عرب<br />وتلاقي ده منعكس فس لبسهم واكلهم وطريقة حياتهم<br />بصو على ايران تلاقيهم عارفين انهم فرس بصو على المغرب العربي<br />تلاقي البربر والامازيغ والعرب كل واحد عارف هو ايه<br />انما احنا مهلبية<br />ومحدش يقولي احنا مصريين لان المصريين خلاص بح من ايام كليوباترا<br />ولو ان معظم الصعايدة والمسلمين عرب<br />وبعدين الانتماؤ للعرب شرف مابعده شرف<br />وفكك من حوارات القومية العربية ومش عارف ايه انا بكلم عن الهوية والثقافة العربية اللي لازم تبقى عند كل واحد فينا"
