[[comments]]
order = 18
subject = "البينة على من ادعى"
author = "أحمد القطب"
posted = "2007-05-20"
text = "البينة على من ادعى، والدليل على من أنكر، وقد ادعيت بغير بينه، وأنكرت أنا ادعاك بدليل موثق، فإن أردت أن ترد أدلتي اتنا بالبينات التي تثبت ادعاءك..<br />عزيزي محمد أنور، أشكر لك ملاحظتك وأحترم رأيك كثيراً، لكنني أختلف معك اختلافاً طفيفاً، فاللغة العربية وإن لم تكن وربما لا تكون لغة الحوار اليومي، فأنا أرى أنها كانت دائماً وستظل لغة الحوار الرسمي ووعاء الثقافة والفكر لكل الشعوب العربية، وثانياً لا نستطيع الجزم باختلاف طبيعة اللغة وألفاظها في مدى زمني قصير مثل 80 أو 100 عام فقط، فالعربية بعد نزول القرءان وانتشار الدين الإسلامي في الشرق الأوسط أصبحت وعاءً ثقافياً جامعاً لشعوب عديدة، ولا يمكننا أن ننكر أن الرابط الثقافي الإسلامي قد أسهم بصورة جوهرية في الحفاظ على هذا الوعاء..<br />وأما حقيقة انتشار لهجات عامية في البقاع المترامية داخل القطر المصري أو خارجه في أقطار عربية أخرى فهو يا عزيزي أمر شائع الانتشار في كل أمم العالم الحديث والقديم، ولإن ذهبت إلى فرنسا فستجد قرى وبلدان جنوبي باريس العاصمة تتكلم بلهجات لا تمت للفرنسية المعروفة اليوم بصلة، ولو رجعنا إلى تاريخ القرنين السابقين من العصر الحديث سنرى أن نابوليون بونابارت بجلالة قدره لم يكن فرنسياً حقاً وإنما ولد وقضى شبابه في جزيرة كورسيكا، وكان في صغره يرى فرنسا دولة محتلة مستعمرة لأرضه !"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064211/http://masr.20at.com:80/newArticle.php?sid=10249"

