[[comments]]
order = 20
subject = "مداخلة جادة مع احمد قطب"
author = "محمد انور"
posted = "2007-05-22"
text = "يا استاذ احمد .. تاريخ مصر من القدم بشكل جعله حمل علينا .. مثلا انا شبه متاكد ان فيه ناس كتير وحاول تتامل معايا المثل ده لو عرفت مثلا ان جدها الاول او التانى كان مسيحى مصرى واسلم ممكن يتضايقوا ويحسوا بان فيه حاجه غلط .. فيه حالة من ضيق الافق بتزيد وياللغرابة بتزايد ادوات المعرفه !! .. موضوع اللغة انا حاسس ان العربى قدامه طريقين يا يتحول للاتينى جديد وده حيحصل طول ما الناس دافنه راسها فى الرمل ومصره ان العربى محروس من ربنا مش من اللى بيتكلموه ولا بينتجوا بيه المعرفه .. الطريق التانى هو ان يكون فيه احد اللهجات الغنية واللى تم انتاج معارف بيها زى المصرى مثلا .. ان اللهجة دى تكون رافعه للعربى مش بديل ليه .. حضربلك مثل اذهلنى سمعته من احد علماء اللغويات ان بعض المناطق المعزولة جدا لدرجة الغياب عن التاريخ فى دهاليز اليمن لما اكشفت على الدنيا فى القرن العشرين بقم بيستخدموا اصطلاحات مصرية فى حاجات اساسية جدا زى كويس وبق \"فم يعنى \" ودى كلمات اصلا مش عربى من بابه وبصرف النظر عن اصلها هى كلمات مستخدمة فى البلد اللى انتاجها الثقافى المرئى والمسموع والمكتوب اعلى واغزر .. على فكرة فى موضوع فرنسا تحديدا .. اللى حصل ان الناس دى مكنتش بتتكلم فرنساوى اساسا وتم فرض الفرنساوى عليهم زيهم زى الجزايريين بالظبط بس مشيت معاهم عشان الالتصاق الجغرافى لان اصلا الامة الفرنسية امة حديثه ووعيها بذاتها بقالة 400 سنة على الاكثر .. والى يجننك بقى بقى انك يبقى عمرك 6000 سنة الفلاحين عندك بيتنيلوا يمارسوا تقريبا نفس جوهر طقوسهم وفيه ناس مش عاجبها كل العمر .. اخيرا .. لما بنتكلم على مصر اللى هى بلدكم كلكم ن اول انا والاستاذ احمد القطب وجورج رياض و ابو محسن والراجل اللى مش عايز يكتب اسمه ومصر ان فرعون كان اسمه وليد صلاح الدين .. لما بتكلم على البلد دى مش بنتكلم على اعراق حتى بعض الاقباط اللى عندهم وهم انهم عرق مصرى صافى انا بس بدعو اى واحد فيهم انه وهو جوه كنيسه مليانه يضرب كده بعينه لو لقى 10 شبه بعض يبقى له عندى حق .. احنا خليط تاريخى من كل اعراق البحر المتوسط و الشرق باسثناء الاسيوى جدا منها .. لو كانت امريكا فاكرة نفسها بلد متعدد الاعراق احنا اقدم خلطة فى التاريخ .. الخلطة دى اى كانت بقى وليد .. انطونيو .. اثناسيوس .. قحطان .. قورش .. نبوخذ نصر .. ايا كان بييجوا مصر يقعدوا حوالين وادى النيل ويزرعوا ويستنوا الفيضان كل سنة ويحترموا مصدر المياه الوحيد اللى عندهم بيعيشوا جنب بعض وهم دائما متدينين عشان لو ربنا زعل منهم النيل مش حييجى .. وهما بيعيشوا جنب بعض فى سلام وطول الوقت بيفتكروا نفسهم حاجه واحد ويقشعروا من اى تعددية وسطيهم .. حيث ان الله واحد والنيل واحد واللغة واحده والشعب واحد ... و طبعا الفرعون او السلطان او الرئيس واحد .. الحقيقة ان ده هو طبعا ايا كنا احنا اشعب اللى بيمشى سنه ولا يعدى قنا .. احنا الشعب بتاع يا نحلة لا تقرصينى ولا عايز عسلك .. ولظن دى صفات ملهاش اى دعوة بالقحطانيين حتى لو كان مجموعة منهم استوطنت مصر خلال الاف سنة الللى فاتت .. ملحوظة انا مش عارف اصلى العرقى ايه لانى فعلا شكلى ممكن يدى اى حاجه"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064211/http://masr.20at.com:80/newArticle.php?sid=10249"

