text = "أشكرك على مداخلتك القيمة، وبالمناسبة أنا عيلتي أصولها القديمة مسيحية فعلاً، ش بس كدة، انا لسة عندي فروع لعيلتي من بعيد مسيحيين أرثوذكس إلى الآن..<br />وكلامك عن ان مصر خليط عرقي شديد التنوع والتجانس في ذات الوقت لام صحيح 100%، وعلى أي حال احنا مناقشتنا لم تنتحِ أي منحى عرقي على ما اعتقد بغض النظر عن بعض الآراء الشاذة، أما اللغة العربية ومستقبلها فا أنا زيك يائس تماما من الواقع.. لكن في الحقيقة أنا عندي يقين بإن المستقبل هايكون مختلف إن شاء الله..<br />وأشكرك للمرة الثانية"
