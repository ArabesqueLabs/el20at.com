[[comments]]
order = 14
subject = "\"الوليد ابن مصعب\"  ليست رواية صحيحة ولا"
author = "أحمد القطب"
posted = "2007-05-20"
text = "أحب أن أوضح مسألة بسيطة للأخ الكريم الذي يصر على أن فرعون موسى اسمه (الوليد ابن مصعب)، هذا الاسم ورد في تفسير القرطبي الجزء الأول كإحدى الروايات التي أولت ما أريد به لقب (فرعون) وهذا هو النص:<br />(- قوله تعالى: (فرعون) \" فرعون \" قيل إنه اسم ذلك الملك بعينه. وقيل اسم كل ملك من ملوك العمالقة مثل كسرى للفرس وقيصر للروم والنجاشي للحبشة وأن اسم فرعون موسى قابوس في قول أهل الكتاب. وقال وهب أسمه الوليد ابن مصعب بن الريان ويكنى أبا مرة وهو من بني عمليق بن لاوذ بن إرم بن سام بن نوح عليه السلام. قال السهيلي وكل من ولى القبط ومصر فهو فرعون. وكان فارسيا من أهل اصطخر. قال المسعودي لا يعرف لفرعون تفسير بالعربية. قال الجوهري: فرعون لقب الوليد بن مصعب ملك مصر وكل عات فرعون والعتاة الفراعنة وقد تفر عن).<br />وهي رواية ضمن روايات عدة، ولم يرد ما يؤكد صحة هذه الرواية، كما أن السياق التاريخي للأسر الفرعونية وعلاقاتها بقبائل الرعاة في شمال الجزيرة العربية وبأنبياء الله في منطقة عبر الأردن بداية بإبراهيم الخليل عليه السلام وانتهاءً بموسى وخروجه ببني إسرائيل لا يتفق وهذه الرواية، كما أن اسماً كالـ(وليد ابن مصعب) في لفظه ومبناه اسم عربي الطابع ولا يمكن أن يكون قد ساد في بلاد كهذه منذ ما يربو على أربعين قرناً من الزمان في وقت لم تكن فيه اللغة العربية الإسماعيلية قد بلغت الهيئة التي هعي عليها الآن ناهيك عن أن تكون قد عُرفت خارج الجزيرة العربية أو انتشرت على هذا النحو.<br />وأخيراً يا عزيزي أرجو أن تتثبت من معلوماتك بالاستناد إلى مصادر موثقة، والرجوع إلى أكثر من مرجع، وأحب أن أنبه عنايتك إلى أن محركات البحث ةعلى رأسها (جوجل) لا تعرض لك بالضرورة معلومات صحيحة، ولكنها فقط تقوم بعرض ما هو شائع ومتداول والمعلومة الشائعة لا يمكن أن تكون بالضرورة هي المعلومة الصحيحة..<br />وشكراً .."
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064211/http://masr.20at.com:80/newArticle.php?sid=10249"

[[comments]]
order = 15
subject = "اللغة فى خدمة الانسان مش العكس"
author = "محمد انور"
posted = "2007-05-20"
text = "عزيزى احمد انا قريت موضوع جورج رياض فيه حاجات فلتت منه بس فى العموم الكلام صح .. انا متوقف عند اخر جملتين انت كتبتهم ( لقد استمتعنا كثيراً باستعراض المفردات القبطية الباقية على ألسنتنا إلى اليوم، ولكن من المهم أن نعي دور كل لغة، وأن ندرك الحدود الثقافية لواقعنا ومستقبلنا، وأن لا نحمّل الألفاظ والمعاني فوق ما تحتمل.)<br />الحقيقة ان الحساسيات الدينية المفروض مبيقاش ليها مكنا واحنا بنناقش مواضيع من النوع ده وانا شايف ان احنا مقصرين فى اننا ناصل فهم مصرى وبقول مصرى مش اسلامى او مسيحى لتاريخ مصر وللغتها الدارجة .. حنا دلوقتى بتكلم عربى مصرى او مصرى عربى .. واذاكان فيه حد متخيل ان كل الناس حتتكلم فى يوميتها كمشايخ الازهر فى محاضرتهم يبقى بيصعب المساله جدا .. مش عايزين لغتنا تبقى لغة مثقفين نفخر بان العوام مش فاهمينها .. الناس بتحب الليلة الكبيرة مش معلقات عنتره .. لغتك انت نفسك اللى انت كاتب بيها المقال لو وديتها لحد بتاع عربى من 80 سنة كان اتهمك بانك تتامر على العربية الفصحى الاصيلة .. احنا عندنا مشكلة لغوية مسببه ازمه فى التعليم والتحصيل والمفروض كلنا نبذل جهد فى تطوير العربى فاللغة فى خدمة الانسان مش العكس والتطوير ده ييجى باننا نعترف بالمركبات الكتيرة اللى مكونة ثقافتنا واللى عاكسه نفسها على اللغة المستخدمه يوميا .. اخيرا الاصطفاف الطائفى والكلام هنا مش موجه ليك لانك واضح انك انضج من الحالات اللى بتفكر كده .. الاصطفاف ده مخللى بعض الناس مثلا متحتفلش بشم النسيم اللى هو اقدم عيد مستمر الاحتفال بيه فى تاريخ البشر .. قد ايه ده مؤلم"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064211/http://masr.20at.com:80/newArticle.php?sid=10249"

[[comments]]
order = 16
subject = "فرعون موسى وفرعون يوسف عربيان الى ان يثبت العكس"
author = "مش مهم"
posted = "2007-05-20"
text = "يا استاذ احمد الاقباط داخلين في صراع معانا على هوية مصر مع ان الامر انحسم وفاز العرب والمسلمون بالضربة القاضية الفنية واصبح عدد المسلمين على اصح الروايات 94% مسلمين سنه<br />هما بقا عايزين ايه<br />المدعو جورج رياض تعب نفسه وفضل يجيب كلمات بيدعي فيها ان اصلها قبطي ومن ضمنهم كلمة مشط<br />مع ان الرسول ذكر كلمة مشط في الحديث وقال الناس سواسية كأسنان المشط فكيف هي كلمة قبطية<br />ودراسات وابحاث لن تفيد احدا في محاولات فاشلة لاثبات قبطية مصر<br />طيب انتوا بتقرأوا الانجيل بالعربي كان من الاولى ان يكتبوا الانجيل بالقبطي ويقرؤةه بالقبطي<br />وهما بيقولا ان كل شيء تغير في الانجيل بأمر الرب المسيح<br />طيب يبقى الرب المسيح بيحب العربي<br />انتوا بأه بتكرهوا العربي ليه<br />يا جماعة الاقباط فوقوا بأه مصر دولة عربية اسلامية بعدد سكان 94% مسلمين سنه<br />يعني الامر حسم من زمان<br />ولو كان فيه حاجه ممكن ننعكاكان ايام الاحتلال البريطاني لمصر لكن اثباتا لهوية مصر العربية الاسلامية دخل الانجليز بقوة جيشها وعتادها وخرج بخفي حنين<br />وخلاصة الكلام<br />سيدنا المسيح ابن مريم نبي الله وامه سيدة نساء العالمين مريم جاءوا مصر فحلت البركة على مصر بفضل هذه الزيارة المباركة وبناء عليه هدى الله الشعب المصري للاسلام<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064211/http://masr.20at.com:80/newArticle.php?sid=10249"

