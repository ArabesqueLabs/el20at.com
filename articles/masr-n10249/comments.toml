[[comments]]
order = 28
subject = "اقولك احنا مين"
author = "حسين منصور"
posted = "2007-05-25"
text = "بالعكس يا احمد الخلطة دى حاجة كويسة .. اولا مستحيل تلاقى بلد تاريخها 7 الالاف سنة وموجودة فى قلب العالم ومتكونش مخلطه طول الفترة دى الا لو كان شعبها عنده جرب .. الايرانين بالمناسبة مخلطين برضه لانهم شعب قديم زينا فهم فرس واذاريين وكرد وقومية اللر والبلوش وافغان وعرب برضه ده غير العناصر اليونانية والاسيوية اللى مرت عليهم .. الطلاينة برضه مخلطين منهم بيض اريين ومنهم رومان ومنهم من شمال افريقيا وناس شبهنا بالظبط .. احنا لينا لبس معين اسمه الجلابية الفلاحى والصعيدى بطلنا نلبسه بس عندنا .. وبناكل الفول والعدس واكشك الصعيدى والكشرى اللى محدش غيرنا بياكله .. طريقة حياتنا مميزة انت بس لانك عايش جواها ففاكرها عادى .. سافر انت بس بره فترة طويلة وانت حتعرف ان لمصر سماتها المتميزة جدا .. اللى انت شايفة لخبطه انا فخور بيه .. فالمصريين مسمحوش ان تكون فى بلدهم لغتين مثلا .. ايران فيها 9 لغات بالمناسبه .. مصر هضمت كل الثقافات عدت عليها و دوبتها جواها .. وعلى فكرة كلمة ثقافة عربية كلمة غامضه لان الثقافة العربية المتعارف عليها حاليا هى الثقافة المصرية مع بعض النكهات اللبنانية .. الهم بقى لو انك عايزنا نبقى زى السعوديين ساعتها اقولك روح هناك هما بيحبوا اللى بيحب عوايدهم"
archived = "2007-06-24"
capture_url = "https://web.archive.org/web/20070624021231/http://masr.20at.com:80/newArticle.php?sid=10249"

