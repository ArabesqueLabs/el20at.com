[[comments]]
order = 2
subject = "ياعيني عليك ياجرب"
author = "كتكوتة"
posted = "2007-05-17"
text = "مقالة راااااااائعة واكثر من رائعة وبمثابة وجبة دسمة وفي نفس الوقت خفيفة ومفيدة ولذيذة<br />والف شكر وتحية للاستاذ احمد<br />اما الاستاذ جرب طبعا اللغة العربي هي اللغة الام شئت ولا لا<br />وطبعا العرب المسلمين هم خير امة وده كلام ربنا ولا عندك اعتراض؟<br />ومش معنى انهم في كبوة دلوقتي ان دي حاجة وحشة بالعكس<br />ولو انه مش جاهل زي ما بتقول اقرا للغرب اللي عاجبك في منهم ناس كتير عندها ضمير وبيعترفوا ان اصل كل تقدم اوروبا والعالم من بعدها كان في الاصل يرجع فضله لحضارة العرب المسلمين<br />بس هانقول ايه والله انت صعبان عليا عارف ليهظ لانك بالمثل المصري رقصت على السلم لا اعتزيت باصلك اللي هو مش عارفة ايه ده ولا انتميت للغرب وحسيت باحترامك في<br />وشكرا مرة اخرى للاستاذ احمد وننتظر اكتر"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064211/http://masr.20at.com:80/newArticle.php?sid=10249"

[[comments]]
order = 3
subject = "تعقيب"
author = "أحمد القطب"
posted = "2007-05-17"
text = "عزيزي... أولاً: أشكرك لقضائك بعضاً من وقتك الثمين في قراءة الموضوع والتعليق عليه، ولكني أرجو منك أن يلتزم كل منا بأدب الحوار وأن نبتعد عن أسلوب الشتم والسباب لأن هذا هو في الحقيقة الجهل بعينه.<br />ثانياً: قد قمت في هذا الموضوع بعرض حقائق تاريخية موثقة وواضحة وذكرت المراجع التي استند إليها كلامي، فإما أن ترد على ما قلته بأسلوب علمي ومنطقي كما فعلت، دون عصبية وخروج عن أصل الموضوع، أو أن تذكر على الأقل رأيك بصورة مهذبة، دون أن تتعرض بالقدح والشتم لأحد بعينه أو لفئة من الناس، مع ملاحظة أننا هنا لا نمجد أمة العرب أو نرفعها فوق غيرها من الأمم، ولا حتى نتكلم من منطلق إسلامي، وإنما نناقش المسألة من زاوية تاريخية فقط، ةإن رجعنا إلى المنطق الإسلامي فإن الإسلام يعلم أهله أن \"لا فضل لعربي على أعجمي\" فأرجو أن لا تأخذ الأمور بهذه الحساسية.<br />ثالثاً: التقدم التقني والمعرفي الذي بلغه الغرب أمر لا يمكن أن ينكره أحد، ولكنه لا علاقة له بالحقائق التاريخية التي ناقشناها في هذا المقال، وليس حجة يمكن أن تنكر بها هذه الحقائق، فإن الأمم والحضارات على مدار حياتها دائماً ما تتبادل أدوار التقدم والرقي والريادة فيما بينها، وقد عاشت أوربا أسوأ عصور الظلام والجهل والتخلف تحت نير الكنيسة عبر القرون الوسطى، ثم نهضت لتقود العالم في كثير من المجالات، وها نحن نرى أمماً أخرى مثل الصين والهند في طريقها للنهوض.. والمنافسة.. وهكذا تسير عجلة التاريخ..."
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064211/http://masr.20at.com:80/newArticle.php?sid=10249"

