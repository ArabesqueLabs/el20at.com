[[comments]]
order = 0
subject = "صور جميلة"
author = "واحد"
text = "موضوع حلو وصور جميلة ، الناس دى محترمة قوى يا أخى ، النظام اللى هى فيه يجب ان الحكومة العبقرية بتاعتنا تقتدى بيه ، وكمان أهم حاجة حبهم لبعض وتقدير الكبير للصغير واحترام الصغير للكبير .<br />وبعدين ييجى واحد يقولك جماعة ارهابية ، بالله عليكم فيه جماعة إرهابية برقة الأخلاق والحب اللى عند الإخوان اللى ظاهر من تعامل قيادتهم مع بعض ، الكلام ده بيفكرنى باحزابنا الهايلة اللى بتخطط للإطاحة ببعضها قبل الفطار كل يوم ، على غيار الريق يعنى"
archived = "2007-07-13"
capture_url = "https://web.archive.org/web/20070713174653/http://masr.20at.com:80/newArticle.php?sid=11011"

[[comments]]
order = 1
subject = "السي في بتاعة واحد من الاخوان"
text = "الواحد لما بيجي يدور على شغل بيعمل حاجه اسمها السي في (السيرة الذاتيه) علشان خاطر يثبت فيها قدراته وكفاءته<br />طيب دا واحد من الاخوان المسلمين عامل سيرة ذاتيه لدخوله وخروجه من السجن<br />افهم ليه<br />المفروض ان الواحد لما يدخل السجن في سبيل الله خلاص اخد الاجر من الله وينسى الموضوع<br />لا دول عايزين يثبتوا حقهم علشان خاطر يبقو دايما في المقدمة بالسجون والمعتقلات<br />بصوا شوفوا السيرة الذاتية من مدونة واحد من الاخوان وهو جوز بنت خيرت الشاطر<br />اعتقل أول مرة في سنة التخرج عام 1986 وكانت لأيام بسيطة بمناسبة العيد<br />الثانية كانت لمدة شهرين عام 1992 قبض عليّه في حملة الاعتقالات التي تمت في الشرقية وذلك في أعقاب ترشحه لإنتخابات المجلس المحلي بالزقازيق وخرج بقرار من غرفة المشورة بعد شهرين من تلفيق القضية له .<br />اعتقل مرة أخرى عام 1994 وظل بالمعتقل 6 شهور ونصف وكان معتقلا في الحملة التي شنتها أمن الدولة ضد جماعة الإخوان لتصديها لمؤتمر السكان العالمي ومسألة الحجاب في المدارس التي تبناها وزير التعليم وقتها.<br />اعتقل عام 1998 وخرج بقرار غرفة المشورة بعد 6 شهور وكانت المرة الأولى بعد الزواج،<br />اعتقل أيضاً في 2002 ومكثت 6 شهور أيضاً قبل أن يخرج بقرار غرفة المشورة<br />وفي 2004 اعتقل وخرج بعد شهرين ونصف<br />اعتقل في مارس 2006 وبقيّ بالمعتقل ستة اشهر إلا أسبوع قبل أن يخرج في أواخر أغسطس الماضي، وأخيرًا اعتقل في الرابع من ديسمبر الماضي على خلفية أحداث الأزهر .<br />يا اخوان<br />لا تمنوا على الله اسلامكم ان الله يمن عليكم ان هداكم للايمان وبلاش دعايه انتخابية بأه وبلاش فتن وبلاش زعزعة في امن واستقرار الوطن والحمد لله احنا في دولة اسلامية ماتكفروش الناس المسلمين علشان خاطر حزبكم يحكم<br />عيب عليكم<br />يرجى عدم حذف التعليق واللي عنده رد يرد بشجاعه وبلاش نعمل زي النعامة اللي بتخبي رأسها في الرمل"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819192155/http://masr.20at.com:80/newArticle.php?sid=11011"

