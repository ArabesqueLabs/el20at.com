[[comments]]
order = 3
subject = "أمن واستفرار مين بالضبط؟"
author = "مصري"
text = "ياأخ يابتاع الفتن والزعزعة..هو مين من الإخوان اللي كفر المسلمين؟؟! وإيه علاقة السطرين بتوع الزعزعة والإستقرار بالسطور اللي سبقتها ؟؟! واحد بيقولك إنه أعتقل عشرين مرة وتقوله بلاش دعاية انتخابية!! ماشاء الله ..جرب كده حد يرقعك قلم علي قفاك وقولي إحساسك بعدها بالأمن والإستقرار بتاع الوطن..أخيرا قارن كده يابشمهندس -لوكنت منصف وعاوز تعرف مين الأحرص علي الوطن-السيرة الذاتية بتاعة أي حد من الإخوان وبين بتوع استقرار الوطن -اللي سيادتك عارفهم طبعا-أكيد حتلاقي..ولا بلاش لإنك لو منصف وعاوز تعرف الحقيقة ومش عاوز تدفن راسك في الرمل حتعرف مين اللي بيز.عز.ع حديد الوطن . قصدي أمن الوطن!!!"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819192155/http://masr.20at.com:80/newArticle.php?sid=11011"

[[comments]]
order = 4
subject = "رد على الاخ مصري"
text = "يا اخ مصري انا اللي اعرفه لما الواحد بيعمل حاجه لله ما يذكرهاش<br />يعني مثلا انت لو تصدقت بمبلغ من المال تنسى علطول ذلك وما تحكيش لحد علشان خاطر ما يرحش ثوابك<br />كذلك واحد قال كلمة الحق ودخل السجن<br />خلاص لما يخرج من السجن ما يقعدش يقول انا دخلت السجن علشان خاطر قلت كلمة الحق<br />المفروض هو دخل السجن واخذ الثواب من الله<br />دا صحبك دخل زي ما انت شايف وعامل مدونة وكاتب فيها الكلام دا كله علشان خاطر الناس تقرأه<br />دا بيعمل دعاية لنفسه<br />وضيع ثوابه"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819192155/http://masr.20at.com:80/newArticle.php?sid=11011"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
text = "أعتقد ذكر سنوات الإعتقال وحوادث التعذيب ليس للتفاخر أو الرياء ... ولكن لبيان الظلم المعرض ليه الإنسان<br />الرجل اللي انت جايب السي في بتاعه ده ... بيحاكم عسكريا والمدونات طريقه للتعريف والتوعية وفضح الظلم والتعذيب<br />عشان كده بيتكتب مرات الاعتقال والظلم اللي تعرض لها ...<br />أخيرا مش هو اللي بيكتب عن نفسه ........ أخوانه همه اللي بيكتبه عنه عشان يعرفوا الناس والإعلام بالظلم الواقع عليه<br />هو الآن في سجن مزرعة طرة لا يملك كمبيوتر ولا مدونة ينتظر حكم القاضي العسكري<br />كان يمكن أن تأخذ الموضوع بحسن نية أو على الأقل لا نفتش النوايا أصلا"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819192155/http://masr.20at.com:80/newArticle.php?sid=11011"
