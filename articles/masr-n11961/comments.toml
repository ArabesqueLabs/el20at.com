subject = "ومن افقر الشعب المصرى؟"
author = "فواقرى"
posted = "2007-10-18"
text = "نظام الحكم الحالى هو الذى افقر الشعب المصرى<br />يعنى الحكومة مسئولة من اكبر مسئول<br />وبعدين يحتفلوا بنجاحهم فى افقار الشعب المصرى<br />يقتلوا القتيل ويمشوا فى جنازتة"
