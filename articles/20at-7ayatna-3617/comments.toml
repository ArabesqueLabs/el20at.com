[[comments]]
order = 5
subject = "ماذا يجدي الشرف في وطن فقد عذريته"
author = "مغربية في بلاد العجم"
posted = "2007-04-21"
text = "نعم من هذا المنطلق ينطلق المغاربة الذين ملوا من الفقر المدقع و من البطالة و من قلة الشي، من هذا المنطلق ثاروا على مغرب يتحق ان يكون افضل، فكثرة الظواهر و تعددت طرق رفض الفقر ، لكن للاسف الحكومة لا تلقي الضوء الا على التفجيرات، و اتساءل لماذا لا تلقي الضوء على اطفال الشوارع و على بنات الليل و على قوارب الموت و على الزواج بالاجانب... فكل هذا ما هو الا هروب من مغرب الصفيح و مغرب الفقر و اختلاف الطبقات...انا مغربية و احب بلدي اكيد انني ضد التفجيرات لكن مع ذلك اجد العذر لؤلائك الشباب فما هم الا ضحايا و الاكيد انهم لا يستحقون الموت، لكن في نظرهم موتهم احسن من بقائهم في دور بلا ابسط التجهيزات، و ان اراد ان يتنزه فالاكيد انه يرى ما يجعله يسام الحياة و يسترخص نفسه، الفوارق الطبقية في الدار البيضاء وحدها لا تعد و لا تحصى فالى جانب دور الصفيح هناك من يلعب بالملايين غير أبه و لا مبالي بمن لم يجد قوت يومه، فيلات و شاليهات و مطاعم...الا يجعلك هذا تقرر الاصطدام باول حافلة او الاستماع للمتطرفين الذين يغسلون الادمغة او الزواج من اجنبي بعمر الوالد كل هذا ما هو الا هروب من الواقع المدقع...فكفانا لامبالاة على الحكومة ان تتحرك و لا فان ما خفي كان اعظمو نحن كمغاربة لا نرضى هذا لمغرب مات اباؤنا من اجل حريته و جاء ابناء الخونة لاستنزاف ثؤواته و اخد مناصبه فوالله حراااااااااااااااااااااااااااااااااام"
archived = "2010-03-14"
capture_url = ""

