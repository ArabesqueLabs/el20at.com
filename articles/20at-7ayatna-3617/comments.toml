[[comments]]
order = 2
subject = "لماذا بالدار البيضاء بالضبط...؟؟؟dorsaf_88@hotmail"
author = "حياة من المغرب"
posted = "2007-04-19"
text = "لايمكن أن نتهم الفقر قنبلة تهدد كيان الدار البيضاء،اذ أن الفقر كما هو معروف منتشر في بقاع المملكة . وهذا ما يدعونا الى التساؤل لماذا الارهاب بالدار البيضاء بالضبط ؟،علما بأن التهميش والفقر والاقصاء يعاني منهم شرائح عديدة من المجتمع ،ولو كانت الفرضية المطروحة صحيحة فيما يخص الفقر= الارهاب ،فهنا يمكن أن نقول أو نستنتج بأن العملية ستشمل مستقبلا باقي مدن المملكة وما هذه الا نقطة البداية.......لكن ما يجب أن نقر به هو وجود قاعدة تدعي من الفقر حافز للقيام بهذه العملية،هادفة الى تشويه صور الاسلام في أنظار الغرب ...وما أدراك بالغرب...لكن من أين تحضى هاته الجماعة الماسة بأمن الدولة بالدعم المادي علما بأنها شريحة فقيرة...؟؟؟؟؟؟"
