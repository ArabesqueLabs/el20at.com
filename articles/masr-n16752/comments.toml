posted = "2008-07-14"
text = "الموضوع فعلا خفيف ولكنه يتطرق لموضوع مهم فالدنيا كلها بتمشي دلوقتي بالارقام السرية ، حتى أن حياتنا كلها اصبحت سرية ... وانا من دلوقتي بفكر اسيب شغلي واشتغل مخبر سري علشان محدش يعرف ارقامي واستطيع معرفة كل الارقام السرية للاخرين .. فمن لديه وظيفة بالشكل ده يقولي<br />SALAH_BBC@YAHOO.COM"
