posted = "2007-03-06"
text = "جامد جدا يا ترك ولكن انت تحاملت على صبحي في بعض الجمل ، الموضوع متكامل موت وكل كلمة فيه صح وجاب الرأي والرأي الآخر ولكنه نسي يقول صبحي عنده كام سنة وكمان صبحي مش ملاك كدة عشان هو اول من وضع الكوسة في الفن ومخلي اخوه بيشارك في كل عمل ومراته تعمل الديكور وكمان بيقولك إن حفيده عنده مؤهلات فنية"
archived = "2010-09-27"
capture_url = "https://web.archive.org/web/20100927040109/http://www.20at.com:80/20at/arts/3366.html"

[[comments]]
order = 5
subject = ""
author = "HopiZ"
posted = "2007-03-06"
text = "عندما تصير رمزا … فتصرف كما يتصرف الرموز<br />لا تكن كبقية الشعب…تتكلم وقتما ترغب, وتموت متى تريد<br />فحذار أيها الرمز…فليس بخاطرك ان لا تصير<br />ليس بمقدورك… ان تتنحى او تتنازل عن منصبك<br />لأنك لست من تملكه…انما يملك هذا القر من منحوك اياه<br />فحتى تتنازل ايها الرمز… أطلب الأذن مسبقا من كل فرد منحك حبه<br />فكيفللشعب ان يعيش…اذا ود الرمز قد مات<br />و كيف للشعب ان يصمد… اذا اسلم الرمز يداه<br />وكيف للشعب ان يحارب … اذا خارت من الرمز قواه<br />وكيف لنا ان نحيا…دون رمز فى زمن لا رموز به ولا حياه<br />فأصمد ايها الرمز… فأنك تحمل بين اصابعك الطاهرة<br />قلوب شعب…طالما حار فى وصفك اياه<br />فصبرا ايها الرمز…فغدا يموت من لوث أصابعك بدم لست مسئولا عنه<br />فغدا ينسى التاريخ… مثل هؤلاء ويتناساهم الناس<br />ولكن فى القلب دوماانت… والتاريخ سيظل يحمل بين طياته\"ان الرمز لم يهزم\"<br />فحقق التاريخ ايها الرمز… فنحن من ورائك نسير<br />وكيف لقافله ان تهتدى فى ظلمات ليل… دون مصباح ينير<br />ده ان احساسى بجد لما عرفت خبر اعتزاله…"
archived = "2010-09-27"
capture_url = "https://web.archive.org/web/20100927040109/http://www.20at.com:80/20at/arts/3366.html"

