author = "بسلة مسلمة مصرية"
posted = "2007-03-06"
text = "انا اتفرجت على حلقة البيت بيتك اللى اعلن يها محمد صبحى اعتزالة للتليفزون المصرى ؛ انا بس احب اقولة لو انت انهزمت ضدم فاحنا بقى حنعمل اية نعمل زيك ؟<br />ارجوك … ارجع تانى.<br />انا كنت قريت كتاب بروتكولات حكماء صهيون لشوقى عدالناصر وانا فى 3 اعدادى مرتين ويمكن 3 كمان واتفرجت على مسلسل فارس بلاجواد وكنت متابعة وفاهمة ومستوعبة فارجوك بلاش …بلاش …بلاش يا فنان يا كبير بلاش …بلاش تسيبهلهم يزرعوا فى دماغنا الهيافة والتفاهة ارجوكارجع تانى .<br />انا واحدة من الناس مش حعرف اشوفك غير على القنوات الارضية زى الناس كلها فارجو خيب املهم ارجع تانى ومتبعش القضية الناس لسة ممكن تراهن عليا تانى ."
archived = "2010-09-27"
capture_url = "https://web.archive.org/web/20100927040109/http://www.20at.com:80/20at/arts/3366.html"

[[comments]]
