author = "شرين منصور"
posted = "2007-03-06"
text = "اولا عود أحمد يا استاذ محمود انت فين بقالك زمان بس بصراحة انت صحفي ليك مستقبل بصراحة بصراحة واااااااااااعد والمتميزين هما اللي بيغيبوا يغيبوا بس بيرجعوا بقنبلة صحفية من العيار الأول موضوعك هايل لخصت حياة الفنان الراقي محمد صبحي الفنية في سطور ذهبية ،زعلنا جدااا لما قرأنا الخبر في الجرايد والمواقع وبصراحة انتابني شعور من الغضب من الذي رسخ في اذهاننا مبادئنا وقيمنا من خلال رسالاته المتعددة وقلت ليه سبت الساحة للي ميسووش واسمهم قال ايه فنانين دول بصراحة عايزين شهرة مش مشكلة اذا كان في هدف من اللي بيقدموه ولا لأ بس امبارح لما قريت انو معتزلش قلت هو ده محمد صحبي اللي عارفينو …ياريت تعمل يا محمود ندوة لمحمد صحبي وتبقى مسجلة وتنزل على مواقع النت لأن ده الفنان اللي بجد …فالحمد الله لسة حنشوف فن راقي وفنانين راقيين جزاك الله كل خير يا محمود مقالك قنبلة"
archived = "2010-09-27"
capture_url = "https://web.archive.org/web/20100927040109/http://www.20at.com:80/20at/arts/3366.html"

[[comments]]
order = 3
subject = ""
author = "لوله"
posted = "2007-03-06"
text = "الموضوع جميل يا محمود جدااااااااااااا اااااااا، وخاصة انه رصد خطوات صبحي وعرض أسلوبه، ولكني اعترض علي خاتمة الموضوع اللي فيها دعوة لترك صبحي التمثيل \" أم أن عليه الاعتزال وترك الساحة لـ\"تلاميذه؟! \" . فإن كان صبحي يعشق الخطب والتوجيه إلا أنه يقدم فن راقي هادف خلاف غيره من المشاهير الذي يستخدم شهرته في تقديم الإسفاف والخلاعة.<br />فصبحي شخصية محترمة ولها العديد من الأعمال الممتازة وتشهد علي ذلك مسرحية الهمجي.<br />وبالنسبة لمسلسل \"فارس بلا جواد\" وإن كان عليه نقد فقد كشف بصورة مباشرة مؤمرات الصهيونية، وذكرت الجميع أن الصهاينة مازالو أعدائنا ولو وقعت الحكومات معها آلاف المعاهدات وطبعت معها العلاقات.<br />فتحية ألف تحية للممثل محمد صبحي"
archived = "2010-09-27"
capture_url = "https://web.archive.org/web/20100927040109/http://www.20at.com:80/20at/arts/3366.html"

[[comments]]
