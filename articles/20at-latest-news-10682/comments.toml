text = "تتحدّث المسماة بالعجلونية وكأن الأمر فقط عناد أو مزحة أو ما شابه ذلك ,,,,<br />هذا الأمر أمر دين ,, يعني ءاخرة ,,, يعني حساب وعذاب وثم جنة أو نار<br />يعني الموضوع لا بدّ له من تثبّت وتوثيق ,,, بالتأكيد عندما نريد التأكد من منهج الشيخ الحبشي نقوم يقراءة كتبه والسماع من تلاميذه<br />وأنا أظن أن العجلونيه هذه ما التقت لا بالحبشي ولا يتلاميذه<br />حقيقة أنا قمت بقراءة كتب للشيخ الحبشي وسأل تلامذته عن الأمور التي تتحدّث عنها العجلونية هذه ووجدت بأن كلامها هو كذب وافتراء<br />والله كذب وافتراااااء<br />الله يهديها !!!"
