text = "دخلوا ع موقع مكافحة الاحباش الهرريه واعرفوا حقيقة الزنديق الحبشي<br />اسحبوا اولادكم من مدارس الاحباش الهرريه في الاردن التي يسموها _مدارس الثقافة العربية الاسلامية--<br />حدثني ولي امر طالبة في الصف الثاني ادخلها في مدارس الاحباش المسماة __ مدارس الثقافة العربية الاسلامية__ ان معلمة الدين في المدرسة(حبشية طبعا )<br />اخبرتهم انه اا شاهدتوا كلمة اسرائيل على ورقة فلا يجوز رميها على الا رض لانها مقدسة<br />تخيلوا خيانة وكفر الاحباش الذين تدعمهم( مؤسسسة راند ) الصهيونية لتفتيت الاسلام من الداخل"
