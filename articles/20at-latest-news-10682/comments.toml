subject = "الاحباش الهرريه يبثون سمومهم"
author = "عجلونية"
posted = "2008-12-07"
text = "الاحباش الهرريه طائفة تتبع المقبور المنافق عبدالله الحبشي جاء الى لبنان من الحبشة بعد ان تامر مع النصارى ضد المسلمين<br />يقولون ان القران مخلوق وانه لازكاة على الاموال النقدية وفتاوي تخالف القران<br />== لهم في الاردن جمعية ومدارس الثقافة العربية الاسلامية<br />== يحاولون السيطرة ع وزارة الاوقاف= كليات الشريعة لحبشنة الاردن<br />== افتحوا ع (منتدى مكافحة الاحباش)))) واعرفوا حقيقتهم وساعدونا ع توعية الناس من خطرهم ع الاسلام<br />== اسحبوا اولادكم من مدارسهم انهم يسبون بعض الصحابة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = ""
author = "محمديون رفاعيون"
posted = "2009-04-22"
text = "عجلونية انت كاذبة ومفترية وها انا من اتباع الشيخ عبد الله الهرري الحبشي ولا مرة ولا يوجد في اي كتاب له انه لا يوجب الزكاة ولكن هذه افتراءات ذنب الوهابية الجوال الضال المضل دمشقية فكفاك كذبا وافتراء<br />قال رسول الله صلى الله عليه وسلم:كفى بالمرء كذبا ان يحدث بكل ما سمع<br />واظن انك لا تعرفين الشيخ عبد الله الهرري رحمه الله تعالى<br />فعليك بالسكوت وعجم الافتراء على اهل السنة والجماعة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = ""
author = "محمديون رفاعيون"
posted = "2009-04-22"
text = "اما عن ما يسمى منتدى مكافحة الاحباش المليء بالافتراءات والأكاذيب على العلامة المجدث الحافظ الفقيه الشافعي الشيخ عبد الله الهرري رحمه الله فقد اقفل بسبب فضحه وفضح من عمله امام الناس وقد عرفه الناس وعرفوا كذبه وافتراءاته<br />فتراجعي وتوبي الى الله من كذبك وافتراءك على شيخنا الهرري وعلى جماعته<br />الله يهديكم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = ""
author = "محمديون رفاعيون"
posted = "2009-04-22"
text = "اما قولك اننا نسب بعض الصحابة فهذا يذكرني بمن يقول: من بيته من زجاج لا يرمي الناس بالحجارة<br />بل يا ايها الناس اسحبوا ابنائكم من مدارس الوهابية اتباع ابن تيمية الذي يقول في كتابه المسمى المنهاج ما نصه: وان علي اسلم صبيا وفي اسلام الصبي خلاف...انتهى<br />هذا الاحمق شيخ ضلال الوهابية يشكك في اسلام سيدنا علي فبهذا شكك في صدق النبي الذي اقر اسلامه<br />فبالله عليكم قولوا لنا من يشتم الصحابة؟؟<br />هاهو ابن تيمية في كتابه المسمى اقتضاء الصراط المستقيم يقول ان عبد الله ابن عمر عمل عملا فيه ذريعة للشرك لأنه تتبع آثار النبي عليه الصلاة والسلام...وهذا عبد الله ابن عمر قال فيه الرسول: عبد الله ابن عمر رجل صالح<br />فقولوا لنا من يشتم ويكفر بالصحابة؟؟؟"
archived = "2010-03-14"
capture_url = ""

