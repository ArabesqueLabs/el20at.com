[[comments]]
order = 0
subject = "وهيا هتعمل ايه الورقة"
author = "مسلمة"
posted = "2007-02-05"
text = "اهو ده الى احنا شاطرين فيه نعمل حاجات رمزية او نقعد نبكى على ليلاه ونتذكر ايام زمان ونقول ونتكلم وبعدين نسكت<br />لكن مين فينا الى ياخد عهد ابدى على نفسه انه يحرر القدس<br />مي فينا عمل حاجه فعليه<br />كفاية بقى كلام ومصمصة شفاة احنا عايزين حركة عايزين ناس صاحية<br />الحاجات الرمزية دى تبقى للاطفال او الى لسه مش عارفين هيعملو ايه<br />لكن الى محدد هدفه وعارف قضيته هيعرف يشق الطريق ليها كويس<br />اللهم فك قيد الاقصى الاسير<br />اللهم انصر الاسلام واعز الملسمين<br />ثانكس على التوبيك"
archived = "2010-03-14"
