[[comments]]
order = 0
subject = "متابع جيد والسلام للموقع"
author = "مش مروة عبد الفضيل ولا حد تاني أساسا"
text = "بجد داتا ومعلومات جيدة عزفتيها لنا يا مروة لأن بليغ معتقدش انه خد حقه اعلاميا زي كتير غيرة لأنه تعاون مع نخبة من عمالة الغناء والطرب مثل أم كلثوم وحليم ورشدي ووردة"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727125025/http://masr.20at.com:80/newArticle.php?sid=16948"

[[comments]]
order = 1
subject = "ماتت الموسيقى بعدك يا بليغ"
author = "مصرى"
text = "اللة يا بليغ<br />لما كان الشباب فى الخنادق على شط القناة ومعاهم الترانزستور الصغير الفليبس ابو 5جنية وبيسمعوا اغنية عدى النهار<br />يا بليغ يا اعظم موسيقى<br />فين اغنية ام كلثوم الرائعة حب اية اللى انت جاى تقول علية<br />باقى لنا اغانى الدربكة وموسيقى الرتم الواحد وكلام كلة انحطاط بدل الشعر الجميل<br />سلام على روحك يابليغ"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727125025/http://masr.20at.com:80/newArticle.php?sid=16948"

[[comments]]
order = 2
subject = "جود"
author = "مش لازم يعني اسمي"
text = "فعلا موضوع جود ...مروة جود لك"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727125025/http://masr.20at.com:80/newArticle.php?sid=16948"

[[comments]]
order = 3
subject = "ده انا"
author = "مش هما"
text = "عدى النهار والمغربيه جاية الله الله يا بليغ يا كينج الله يرحمك شكرا يا مروه على الموضوع الرائع"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727125025/http://masr.20at.com:80/newArticle.php?sid=16948"

[[comments]]
order = 4
subject = "no"
author = "الأسيوطي بك"
text = "ايه الجمال ده يا بليغ رحلتك غاية في األابهار والعقبات التى تخطتها كانت كثيرة رحمك الله"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727125025/http://masr.20at.com:80/newArticle.php?sid=16948"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "الأسيوطي برضو"
text = "أنا زعلان منك أوي يا مروة كيف تتجاهلي شخصية زي عمنا يوسف شاهين ومتعمليش موضوع عنه لو معملتيش انا بحقيقي هغضب منك كتير"
archived = "2008-07-28"
capture_url = "https://web.archive.org/web/20080728201720/http://masr.20at.com:80/newArticle.php?sid=16948"
