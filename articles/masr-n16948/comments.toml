[[comments]]
order = 7
subject = ""
author = "كريم المهدي"
posted = "2009-11-05"
text = "يا استاذة مروة ارجو ان تتاكدي من معلوماتك جيدا قبل النشر لان هذه حقوق ملحن و يجب علينا احترامها، اولا اغنية (الحب كده ) هي من الحان الموسيقار الكبير رياض السنباطي وكلمات بيرم التونسي وليس لها اي علاقة بابن النيل بليغ حمدي ، اماا هذه الاغنية التي بدات بها موضوعك فهي اغنية ( حب ايه ) كلمات الشاعر عبد الوهاب محمد و الحا ن الموسيقار الخالد بليغ حمدي، والتي لم يكمل بليغ تلحينها الا بناء علي طلب من سيدة الغناء العربي بعد سماعها لجزىء منها في احدي الجلسات الفنية كما ذكرت انت ، والتي حققت نجاح ساحقا ان ذاك لتبدا بها ام كلثوم عصر جديدا تدب به دماء التغيير و يليها بعد ذلك احدي عشر لحنا من روادع بليغ مثل ، ظلمنا الحب ، سيرة الحب ، الف ليلة ، الحب كله ، حكم علينا الهوي والتي كانت اخر تعاون بين بليغ و ام كلثوم بسبب خلاف بينهما ، انا واحد ممن عشقوا بليغ الانسان والفنان ولكن احب ان تستوفي الحقوق ."
archived = "2010-03-14"
capture_url = ""
