[[comments]]
order = 4
subject = "حتى نكون واقعيين"
author = "سعيد عطية"
posted = "2008-11-11"
text = "الحقيقة المقال ممتاز ، ولكن لي تعليق على تعليق الأستاذ / الطحاوي الذي يتراجع فيه عن سعي بعض الفتيات للتحرش ، فالمشاهد في قليل من الأحيان ان بعض الفتيات بل والسيدات يرتحن ويطربن لأنواع من التحرش ، خصوصاً اللفظي منها ، بل واللمس الخفيف اذا كان في الخفاء ، وهو ما اشارت اليه الكاتبة بنفسها في صدق وصراحة تشكر عليها عندما تكلمت عن ممارسات \\\" تحت السلم \\\" ، فهذه الممارسات تتم غالباً برضا الفتاة ، وإلا لصرخت ( كما يحدث في بعض حالات الرفض ) وفضحت ذلك الأحمق الذي لم يحسن انتقاء من سترضى وتنتشي بما يفعل بها . أليس كذلك ؟"
archived = "2008-11-13"
capture_url = "https://web.archive.org/web/20081113113935/http://masr.20at.com:80/newArticle.php?sid=18291"

[[comments]]
order = 5
subject = "مش قادر ع الحمار!"
author = "زارع"
posted = "2008-11-11"
text = "مرحبا دكتورة ولاء.. أعجبني تناولك للموضوع ومحاولة النظر في دوافع المتحرشين، وأرى أنه ربما كان هناك تضخيم من وسائل الإعلام في الطرق على هذه السلبية التي تشبه آلاف السلبيات التي نواجهها يوميا.<br />لدى عدة تعقيبات بسيطة على ما جاء في المقال. أولا: جعل مسالة تحريم الحديث في الجنس هو من عوامل الكبت الذي يؤدي إلى الفجور فأخالفك الرأي لأننا لم نرى ولم نسمع من يحرم الحديث في الجنس وإنما هو نوع من الذوق ومن اللياقة وترك الحديث في أمور خاصة لا يحسن إشاعتها في المجتمع وجعلها مادة للحديث اليومي بمانسبة وبدون مناسبة وهو من باب تقديس هذه الفطرة وليس ازدرائها وإلا لو تركنا لأنفسنا الحديث في الجنس كما نتحدث في كل شأن لتحولنا مع الزمن لمخلوقات غريبة مسرفة ومتطرفة تماما كالتي حرمت من قبل!<br />ثانيا: تسوية الحاجة للجنس بالحاجة للطعام فيها تقارب حقيقي، لكن تسوية الحكم والقياس على ما فعله عمر رضي الله عنه فيه شطط أو مثالية محلقة، فالذي لايجد الطعام سيموت حتما أما الذي لا يجد الجنس فلن يموت وفي الحديث المعروف الموجه للشباب دعوة لمواجهة الشهوة بالصوم.<br />ثالثا: تقولين إن الحرمان من الجنس يؤثر على الإبداع بالسلب وأنا أقول هذا الكلام ليس على إطلاقه بدليل ما قاله جهاد فاضل في كتابه عن نزار قباني من أنه كان يعمد إلى تجويع نفسه جنسيا ليكتب ما قرأناه من قصائد إباحية!<br />وإذا اعتبرنا أن الحرمان من الجنس أزمة فهو من بواعث الإبداع فأصدق الشعر ما كان وارءه أزمة حادة أو موقف مؤثر.<br />وأخير أعترض على وزارة تزيوج الشباب لأننا لو أنشانا الوزارة وأخذنا فلوس الحجاج وغيرهم من المحسنين فسنكون أعطيناهم السمكة ولم نعطهم السنارة، وفي رأيي أن الدولة هي المسؤولة الأولى وليست الوحيدة عن هذه الأزمة فهي لا تريد أن تفعل وتتعمد ما نحن فيه وكل حلولنا من قبل (مش قادر ع الحمار بيتشطر ع البردعة) ويقني أننا مجتمع زراعي ولا حل إلا أن نتبعثر في بلاد الله لخلق الله في بلدنا مصر الفسيحة في الرمال العطشى للخضرة والماء والإنسان أيضا، نتبعثر في هذه الأرض نزرع ونتزوج ونخلف ونعمر. وما عدا ذلك فهو في رأيي حلول ترقيعية أو كأننا نلاحق المشكلة بطفاية حريق! آسف للإطالة وتقبلي تحياتي"
archived = "2008-11-13"
capture_url = "https://web.archive.org/web/20081113113935/http://masr.20at.com:80/newArticle.php?sid=18291"

[[comments]]
