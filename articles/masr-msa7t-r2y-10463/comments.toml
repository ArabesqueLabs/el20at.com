[[comments]]
order = 18
subject = "مصر: حملة احترم نفسك تجوب الجامعات المصرية"
author = "منقول من موقع لها اون لاين"
posted = "2008-11-24"
text = "مصر: حملة احترم نفسك تجوب الجامعات المصرية<br />ولاء الشملول<br />القاهرة ـ ولاء الشملول: تحت شعار \\\"لسه فيكِ رجالة يا مصر\\\" تجوب حملة (احترم نفسك) ضد التحرش الجنسي الجامعات المصرية ابتداءً من الاثنين القادم 3 نوفمبر وتستمر بجامعة عين شمس حتى الخميس 6 نوفمبر ، ثم تتحرك لبقية الجامعات والمدارس المصرية الحكومية والخاصة. وستتضمن الحملة فعاليات مثل إلقاء محاضرات وتوزيع ملصقات وإقامة مباريات كرة قدم للدعاية للحملة.<br />وكانت الحملة التي نظمتها مجلة كلمتنا الشهرية للشباب انطلقت في يونيو الماضي بعد قيامها باستفتاء حول التحرش الجنسي في مصر، لقياس مدى انتشاره في المجتمع.<br />وتهدف الحملة إلى تعريف معنى التحرش وتعليم الفتاة كيف تدافع عن نفسها حيال هذا ، مستنفرة روح الشهامة والنخوة في المصريين وتوضيح مدى الإيذاء النفسي الذي تتعرض له الفتاة نتيجة التحرش بها جنسياً.<br />أنشطة الحملة<br />وقامت الحملة مسبقاً بتنظيم ورش عمل ومحاضرات شارك فيها أخصائيون نفسيون ومدربون للدفاع عن النفس ، وجابت الحملة عدداً من الحفلات التي يقبل عليها الشباب من الجنسين واستغلت تواجدهم للدعاية للحملة وضم مؤيدين لها موضحة الهدف من الحملة ، مع توزيع ملصقات مساعدة.<br />كما تم تقسيم الشباب المشارك في الحملة (وعددهم 250 شاباً وفتاة) إلى مجموعات نزلت للشوارع في العاصمة المصرية القاهرة وعدد من المدن الأخرى مثل الإسكندرية والمنصورة وبورسعيد ، وتحدثت مع المارة وأصحاب المحلات وسائقي المركبات المختلفة موضحين لهم أهداف الحملة .<br />وقفة لازمة<br />وتأتي الحملة التي لاقت إقبالاً وتشجيعا كبيرا من الشعب المصري بعد أحداث تحرش تعرضت لها بعض النساء المصريات ، حتى يكون هناك وقفة مع الأحداث السلبية التي تقع بالمجتمع على حد قول ريم عادل المسئول الإعلامي عن الحملة في حديثها مع موقع لها أون لاين.<br />وأضافت : الحملة تتوجه للرجال والنساء ، فاحترم نفسك نقولها للطرفين للفتاة والشاب .<br />وربطت المسئول الإعلامي بين الحملة وقضية التحرش الجنسي التي تم رفعها لأول مرة في المجتمع المصري مؤخراً مؤكدة أن هذا أحد النتائج الايجابية التي أسفرت عنها الحملة.<br />نداء<br />وتتوجه الحملة على موقع FACE BBOK للرجال والنساء على حد سواء بقولها:<br />(مستني إيه محتاجينك معانا في الحملة يمكن أكتر من البنات...<br />محتاجينك عشان نحمي أختك والدتك ،زوجتك إنها تتعرض لأي أذى من أي حد( !<br />وتقول للفتاة: (محتاجينك تبقي أقوى.... تعرفي حقوقك )<br />كما انضم للحملة حوالي 42 ألف شاب وفتاة على صفحة الحملة بموقع FACE BOOK على الإنترنت، ومن الداعمين لحملة احترم نفسك: المجلس المصري لحقوق المرأة ، وشركة جودنيوز للدعاية والإعلان والإعلاميون معتز الدمرداش وعمرو وعماد أديب،والفنانان عمرو واكد واشرف مصيلحي .<br />لإحياء النخوة<br />والتقينا ب\\\"مي حرحش\\\" 25 سنة من المشاركات بالحملة تقول: بعد حوادث التحرش الأخيرة قرنا أن نفعل شيئاً في المجتمع لإحياء النخوة والرجولة في الناس مجدداً .<br />وعن سبب انضمامها للحملة تقول : بسبب عدد المضايقات المتزايد ضد البنات والسيدات ،وحتى يكون هناك أمان في الشارع خاصة وأنه حتى المحجبة والمنتقبة يتم التحرش بها وحتى أساهم في الحفاظ على البنات في الشارع لأني أشعر أن أي فتاة أختي.<br />ولمست مي تغييراً في آراء الناس بعدما تحدثت مع بعضهم في الشارع حول الحملة والهدف منها بعدما كانوا يعتقدون أن لبس الفتاة الضيق مبرر كاف لمعاكستها أو التحرش بها.<br />أحداث دخيلة<br />أما شروق حسني 17 سنة من المشاركات بالحملة تبدي سعادتها للانضمام للحملة لأنها تشعر أنها في غاية الأهمية كما أخبرتنا.<br />وتضيف: يجب أن ننظر للمستقبل وأننا بحملتنا هذه نحافظ على المجتمع في السنوات القادمة وعلى بناتنا في المستقبل، ولو كان بيدنا أن نغير شيئاً فلنغيره ولا نرمي مسئولية هذا على غيرنا .<br />وترى شروق أن أحداث التحرش دخيلة على المجتمع المصري مؤكدة أن أخلاق المصريين دائماً كانت قويمة وما يشهده من وقائع تحرش نتيجة ثقافة غريبة عن المجتمع الذي استسلم لها واستقبل أفلام وأغاني فيديو كليب خليعة تحمل فكراً لا يخص المجتمع المصري، وإنما هو مجرد تقليد أعمى للغرب دون تفكير ، ودعت هؤلاء المقلدين للغرب أن يقلدوهم في عملهم الدءوب وجديتهم.<br />رسالة<br />وتحدثنا مع سامح داود 24 سنة وأحد الشباب المشاركين بالحملة الذي وجه رسالة لمن يعاكس أو يتحرش بفتاة في الشارع قائلا: لا يوجد أي مبرر لما تفعله، إلا لو كانت تربيتك أو ثقافتك غير سليمة ، والدنيا دوارة ، وكما تدين تدان ، فلو ضايقت امرأة اليوم ستجد من يفعل هذا مع أختك أو أمك أو زوجتك. والطريق حق للجميع وليس لك وحدك.<br />وعن الأسباب التي يراها لوقوع مضايقات للنساء في الطريق العام يرى سامح : لأنه لا أحد يطبق قاعدة \\\"حب لنفسك ما تحب لأخيك\\\" فلو نظر أي شاب لأي فتاة تسير في الطريق باعتبارها أخته، وأنه لا يقبل أن تمس أخته بسوء لما أقبل على أي مضايقة لها. ويتمنى أن يعود الحياء للشاب والفتاة من جديد."
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201053118/http://masr.20at.com:80/newArticle.php?sid=18291"

[[comments]]
order = 19
subject = "التحرش مطلوب - انت لما بتروح تشترى  قفص طماطم مش ب"
author = "متحرش"
posted = "2008-11-24"
text = "هو فية اية<br />ما التحرش موجود منذ الخليقة<br />لما حمارة بتعدى على حمار فى الشارع وبتعجبة بيقعد ينهق ويرفس ويقلب الدنيا ويمكن يقلب العربية الكارو والعربجى يضربة ميت خيرزانة على ما يهدى شوية<br />والتحرش موجود من زمان قوى لما كان الولد بيزنق البنت فى بير السلم او يمسك مش عارف اية وهى تقابلة نازلة على السلم<br />الجديد ان البنات اتعلمت البجاحة واصبحوا بيشتكوا ومعدش حياء واصبحت بتقول بالصوت الحيانى امام الاشهاد دى مسك صدرى وكلمة صدرى دى مؤدبة شوية دى بتقول لفظ اشنع<br />انا اعرف صديق كان كل ما يطلع على السلم تزنقة بنت البواب فى مدخل العمارة وهات يا بوس فى شبة اغتصاب<br />وبعدين الشباب مش هايج ولا حاجة ولا حتى عندة رغبة جنسية لان كل اكلة فية هرمونات وانا با اشوف اصحاب مزارع الدواجن وهم بيحطوا الهرمونات للفراخ وطبعا الشباب بييجى لة برود جنسى<br />وحتى الطماطم الفلاح اتعلم يحط هرمونات للزرع علشان حبة الطماطم تكبر وتعطى ميزان ويقدر يكسب فى البيع<br />واللى مش مصدق كلامى يسأل الصيادلة عن مقدار كمية حبوب الفياجرا اللى الشباب بيتعاطاها وهو فى ريعان الصبا<br />الشباب مظلوم<br />وبيرفس وعملية المعاكسة دى قصر ديل يا ازعر - وعايز يبرر عجزة ويقول انا قادر وهو تعبان من جوة خالص<br />سيبوا الشباب فى حالة<br />هو ناقص قرفكم"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201053118/http://masr.20at.com:80/newArticle.php?sid=18291"

