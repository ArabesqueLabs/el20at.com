[[comments]]
order = 9
subject = "سرقة الجنس ومذاهب العشق"
author = "ابو سامر"
posted = "2008-11-15"
text = "بعض الشباب يعشقون النسوان العواجيز<br />فى اخر زيارة للغردقة وجدت شابا مصريا لم يتجاوز الثلاثين متزوج من عجوز المانية تجاوز عمرها التسعين وفرحان قوى بيها لانها ستعمل لة التاشيرة وستاخذة الى المانيا<br />وبحثت فى الادب العربى القديم عن حب النسوان العواجيز<br />فوجدت ابياتا فى منتهى الظرف فى احداها<br />تعشقها شمطاء شاب وليدها ----------------------------- وللناس فيما يعشقون مذاهب<br />وصال عمنا ابو نواس وجال واتى الى مصر يسأل شاعرا حدادا وقف على باب حانوتة<br />ماذا تقول رعاك اللة فى رجل ------------------------------- اضناة حب عجوز بنت تسعين<br />فاجابة الحداد بقولة :<br />يبكى علية فقد اودى بمهجتة ----------------------------------------- حب القباح وترك الحور العين<br />فزواج شاب من امرأة عجوز هو عين سرقة الجنس من شاب صغير تسرقة امراة عجوز شمطاء<br />والسرقات انواع والوان"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201053118/http://masr.20at.com:80/newArticle.php?sid=18291"

[[comments]]
order = 10
subject = "سوزان تميم تتعاون مع صلاح الشرنوبي"
author = "محسن منير السكري"
posted = "2008-11-17"
text = "سوزان تميم تتعاون مع صلاح الشرنوبي<br />بيروت: «الشرق الأوسط»<br />غادرت المطربة اللبنانية سوزان تميم الى القاهرة بغية التعاون مع عدد من الملحنين المصريين، وتحديداً صلاح الشرنوبي الذي اختارت منه لحناً سيتصدر البومها المقبل. كذلك ستتعاون تميم ايضاً مع عصام كاريكا وسليم سلامة وسام الامير وطارق ابو جودة.<br />ومن المنتظر ان تعود سوزان الى الربوع اللبنانية نهاية الاسبوع لتقضي فترة استراحة وتمارس رياضة التزلج، وهي المفضلة لديها. وكانت قد سافرت الى دولة الامارات العربية وشاركت في مهرجان دبي الغنائي الى جانب المطرب السعودي عبد المجيد عبد الله.<br />كذلك كانت تميم قد ابلغت عن سرقة سيارتها خلال الشهر الماضي، مفيدة ان مجوهراتها كانت في السيارة المسروقة، ثم عُثر على السيارة بعد حوالي الاسبوعين قرب منزلها الجبلي."
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201053118/http://masr.20at.com:80/newArticle.php?sid=18291"

