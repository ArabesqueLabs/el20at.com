text = "ابوح يا ابوح<br />مصر اللى وش صبوح<br />مش قادرة حتى تبوح<br />وتقول لبياعها<br />فعلك رخيص مفضوح<br />يا للى بكل وضوح<br />شقلبت اوضاعها<br />اذا كنت تفعم فى الاصول<br />هى الاصول تنباع"
