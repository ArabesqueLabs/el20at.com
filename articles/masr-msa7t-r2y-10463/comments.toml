subject = "تحرش ايه وهباب ايه وبير السلم ايه"
author = "مش كاتب"
posted = "2008-11-12"
text = "ايه يا عم الموضوعات اللي زي قلتها دي<br />ما تتعلموا الشغل بقا<br />تحرش ايه ونيلة ايه خيبة ايه<br />بنقولكم اوباما جاي ومعاه ادجندا زي النيلة<br />احنا الان على هامش حدث عظيم زي ضرب البرجين كده علشان خاطر الكلب ينفذ الادجندا بتاعته<br />زي بوش نفذ الادجندا لما انضرب البرجين<br />احنا الان نتقرب حادث خطير على مستوى الكرة الارضية<br />تحرش ايه وهباب ايه وبير السلم ايه"
archived = "2008-11-13"
capture_url = "https://web.archive.org/web/20081113113935/http://masr.20at.com:80/newArticle.php?sid=18291"

