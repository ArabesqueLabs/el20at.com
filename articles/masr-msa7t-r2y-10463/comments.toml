[[comments]]
order = 12
subject = "الىالاخ اللي فوق الشعب المصري هو اللي ابتدا بالبيع"
author = "مش لازم"
posted = "2008-11-17"
text = "الاخ اللي فوق اللي بيقول في تعليقه ان الحكومة بتبيع اصول الدولة<br />اريد ان اذكرك ان الحكومة بدأت ببيع شركات القطاع العام الخسرانه اللي اصلا سرقها القائمين عليها ولقت ان مفيش فايدة في ان ناس من الشعب يكونوا امناء على القطاع العام<br />لان بصراحه الشعب المصري حرامي وكيفما تكونوا يولى عليكم<br />يعني الشعب هو اللي ابتدا بالسرقة من الحكومة"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201053118/http://masr.20at.com:80/newArticle.php?sid=18291"

