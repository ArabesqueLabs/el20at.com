order = 13
subject = "وما بعد البيع"
author = "شادى"
posted = "2008-11-17"
text = "وبعد البيع اية اللى هيحصل<br />كل شىء انباع<br />وراح فى ستين داهية - مش عايزينة - شوية مصانع خردة اتبنت ايام عزيز صدقى وجمال عبد الناصر والمرحوم طلعت حرب<br />وبعدين اية الخطوة اللى بعدها<br />هنعمل اية<br />الحكومة هتبنى مزيد من المقاهى علشان نقعد عليها<br />والا هتزود قوارب وسفن التهريب لشواطىء اوروبا<br />الهند امبارح طلعت صاروخ يلف حوالين القمر ويصور القمر<br />نفسى اعرف اية الخطوة الجاية اللى عايزين يعملوها بعد البيع"
