[[comments]]
order = 2
subject = "التعليم ثم التعليم ثم التعليم"
author = "الزعبلاوى"
posted = "2008-11-10"
text = "من الممكن ان تخلق شخص انتهازى وصياد فرص سانحة عن طريق تعليمة وغرس مبادىء معينة فى تفكيرة<br />ومن الممكن ان تخلق شخصا يشعر بالمرؤة والشهامة والنخوة والاعتزاز بالنفس والوطن عن طريق التعليم وغرس مبادىء معينة فى تفكيرة<br />فى الستينات من القرن الماضى نشط كثير من المفكرين الاشتراكيون والشيوعيون فى مصر وتحول الاعلام الى منادى بالاشتراكية والميثاق ومبادىء ماركس وافكار الالحادى لينين<br />ولكن التعليم فى المدارس كان سليما ومعافا<br />فى اللغة العربية كانت تدرس فى الثانوية العامة كتاب من كتب عباس محمود العقاد الا وهى العبقريات - عبقرية عمر - وعبقرية خالد - وعبقرية الصديق<br />وكان الشاب يتقمص تلك الشخصيات ويكتسب الشهامة والمرؤة والعفة والسلوك المستقيم الراقى - كان يستحى ان ينظر فى وجة جارتة او بنت حتتة<br />كانت الاغانى عفيفة وشريفة - تذكرون اغنية نجاة الصغيرة ساكن قصادى وبا احبة - وكل الحب اللى فى الاغنية ولكنها ليست متبجحة ولكن الحياء والعفة والشرف يمنعها من الكلام حتى فو جئت بزواجة<br />ما الذى حدث فى مجتمعنا المصرى المحافظ ؟<br />قنبلة نووية انفجرت فدمرت كل المقومات - نتيجة الانفتاح الغير محكوم على الثقافات الاخرى - نتيجة منع كتب الدين بحجة اننا نعلم الارهاب - الغينا كل الثقافات الدينية فى مقررات التعليم كنصيحة اليهود والامريكان فخرج لنا هذا الجيل الغير منتمى والغير محترم<br />ظهر التحرش من شباب تربى بطريقة غير صحيحة - شباب انتهازى يمثل ثقافة مجتمع - اخطف واجرى -<br />نعم اختطف واجرى فى رجال الاعمال<br />اخطف واجرى فى الحب فظهر الزواج العرفى والتحرش والزواج والطلاق<br />اضف الى ذلك تفشى الفقر والياس بين الشباب<br />والاخطر لا زال قادم<br />فسوف يظهر عما قريب وقد بدأت بوادرة السطو المسلح والاغتصاب تحت تهديد السلاح وعصابات الشوارع<br />الاخطر سوف ياتى قريبا<br />وربنا يستر"
archived = "2008-11-13"
capture_url = "https://web.archive.org/web/20081113113935/http://masr.20at.com:80/newArticle.php?sid=18291"

