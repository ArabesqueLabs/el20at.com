[[comments]]
order = 1
subject = "أؤيدك تماما"
author = "المصرى أفندى"
posted = "2008-11-10"
text = "هذا كلام علمى سليم. المشكلة أن الحكومة أستهدفت تسطيح شباب مصر أى تحويلهم ألى كيانات تافهة ليس لها فى الثقافة أو التفكير السوى أو السياسة حتى لا يكونوا عقبة أمام سلب ونهب هذا البلد. بالتوازى مع ذلك قامت أعلاميا بهدم أى قيم أخلاقية أو دينية. النتيجة هى عقول فارغة ورغبات جامحة وكبت جنسى بدون وجود تفريغ لهذه الشحنات. الخطورة ألى أين وماهو مستقبلنا. الله يستر على أبناءنا وبناتنا وعلى مستقبل هذا البلد.."
