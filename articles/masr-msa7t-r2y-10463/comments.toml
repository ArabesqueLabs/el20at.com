[[comments]]
order = 26
subject = "ليس بالحجاب وحده نقضي على التحرش عادل الأنصاري"
author = "منقول"
posted = "2008-11-29"
text = "ليس بالحجاب وحده نقضي على التحرش عادل الأنصاري<br />AM 07:08 2008-10-19<br />عندما تطل حالات التحرش الجنسي على مجتمعنا برأسها ويتكرر حدوثها يتوجس الجميع خيفة من تحول هذه الحالات إلى ظاهرة مرعبة تقضي على الأخضر واليابس ، وتدفع إلى مزيد من المخاوف لدى الأسر التي سرعان ما تسعى إلى البحث عن أسباب المشكلة وتحرص على التعرف على أسبابها وتبدأ في اتخاذ التدابير اللازمة لحماية نفسها منها.<br />ولعل أول ما يتبادر إلى ذهن الكثير من الأسر أن الحجاب الشرعي هو الحماية والوقاية من هذا الوحش الكاسر الذي يقض مضاجع كثير من الآباء والأمهات ، فيبادروا بدفع بناتهم إلى التحلي بالحشمة والحجاب حتى يحمين أنفسهن من هذه الذئاب البشرية.<br />إلا أن هذا التحول الذي تبادر إليه كثير من الأسر لا يحلو لكثير من العلمانيين الذين يتفقون معنا في رفض ظاهرة التحرش ويدركون معنا خطورة الظاهرة على مجمل المجتمع ، إلا أنهم في المقابل يستاءون من انتشار ظاهرة الحجاب ويحاولون صرف نظر الأسر عن أهمية الحجاب كحل لهذه المشكلة ويسعون إلى البحث عن بدائل تكون بعيدة عن الالتزام بأي مفهوم شرعي أو إيماني لمواجهة الظاهرة.<br />والغريب أن البحث العلمي المسكين يتم توظيفه بصورة غير أخلاقية للتدليل على عملية الفصل الكامل بين غياب القيم الإيمانية والتشريعات الإسلامية من جانب وبين انتشار ظاهرة التحرش ، حتى أننا نجد استطلاعات للرأي تقول أن عددا كبيرا من اللاتي يتعرضن للتحرش الجنسي من المحجبات بل من المنتقبات وهو ما يدفع – بصورة تلقائية – إلى استبعاد الحجاب أو الزي الشرعي بل ربما استبعاد القيم الإيمانية بصورة كاملة كحل لظاهرة التحرش.<br />ورغم أنني أشك كثيرا في مخرجات هذه الاستطلاعات ولا أبرئ أصحابها من محاولة تطويع أدوات البحث العلمي لإثبات فرضيات يضعها الباحثون قبل بدء بحثهم والانحياز إلى فرضياتهم بصورة غير علمية ، إلا أنني أجد أسبابا أخرى لما تفرزه هذه الدراسات والأبحاث من نتائج.<br />ولعل أبرز هذه الأسباب هو عدم وضوح الرؤية لدى المجتمع ولدى الباحثين حول المفهوم الحقيقي والشامل لقضية الحجاب ، فالبعض ينظر إلى الحجاب على أنه نوع من الزي أو اللباس الذي ما إن ارتدته المرأة كان متوائما مع مقاصد الشارع الحكيم سبحانه وتعالى.<br />إلا أننا لا نحسب الحجاب زيا أو مجرد لباس فحسب ، ولكنه منظومة أخلاقية وإيمانية متوازنة ومتكاملة يشد أدناها أقصاها وهو ما يمكن أن نطلق عليه \\\" منظومة الحجاب\\\" التي تشكل في مجملها صورة نهائية وكاملة للحل الإسلامي لمشكلة التحرش وغيرها من المشاكل المناظرة .<br />فإذا كان الشارع الحكيم يأمر المرأة بالتستر والحشمة \\\" وليضربن بخمرهن على جيوبهن ولا يبدين زينتهن إلا ما ظهر منها \\\" فهو يأمر أيضا المرأة قبل ذلك - كما فعل مع الرجل – بغض البصر \\\" وقل للمؤمنات يغضضن من أبصارهن\\\" حتى أنه أتم حفظ البصر بحفظ الفرج بقوله تعالى \\\" ويحفظن فروجهن\\\" \\\" فدل على التتابع المنطقي بين غض البصر وحفظ الأعراض.\\\"<br />ويدخل في هذه المنظومة المتكاملة الشاملة قوله تعالى \\\" ولا يضربن بأرجلهن ليعلم ما يخفين من زينتهن\\\" ، فالحكمة ليست فقط في اللباس الشرعي ولكن - ومع ذلك - في عدم لفت انتباه الرجال إلى ما تخفي المرأة من زينة في الوقت الذي لا تحرمها الشريعة الغراء من هذه الزينة أو تصادرها ولكن تضع لها الضوابط والحدود التي تحميها من غير الأسوياء.<br />ويدخل في المنظومة أيضا قوله تعالى \\\" ولا تخضعن بالقول فيطمع الذي في قلبه مرض\\\" \\\" فلا قيمة للباس غطى جسد المرأة أو غالبه ثم يأتي الخضوع في القول أو التكسر في المشية مقرونا به ، فيفرغ هذا الزي من مضمونه ويقضي عليه قضاء مبرما.\\\"<br />فالحجاب منظومة تحمي المرأة من أطماع من وصفهم القرآن الكريم بالذين في قلوبهم مرض فهو يحمي جسدها باللباس الشرعي ويدفع عنها الشبهات ومظان السوء بعدم الخضوع بالقول خارج البيت وبعدم لفت أنظار المارة عند الخروج في مجالات الحياة المختلفة التي تشارك فيها إخوانها الرجال قدما بقدم متسلحة بمنظومة الحجاب المتكاملة وليس لباسا مفرغا من محتواه ومجردا من الأخلاق الكريمة.<br />عندما يدرك المجتمع هذا الفهم الشامل والرؤية المتكاملة للحجاب الشرعي ، وعندما تطبق المرأة هذه المنظومة بصورة متكاملة غير مجتزأة ستشعر المرأة ويشعر معها المجتمع بالأمان والطمأنينة ، دون أن نغفل أدوار المجتمع بتربية الأبناء على حسن الخلق - رجالا ونساء - وإرشادهم إلى ميادين العمل الجاد والمثمر ودون أن نغفل أيضا أدوار السلطات التي تتكامل مع دور المجتمع في وجود تشريعات رادعة للقلة التي لا ترتدع بالتربية ولا تستجيب للنصح ، وهو ما ينسجم بالجملة مع منظومة الأخلاق العليا في الإسلام والتي تعد منظومة الحجاب جزء أصيلا ومكونا رئيسا فيها."
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201053118/http://masr.20at.com:80/newArticle.php?sid=18291"

