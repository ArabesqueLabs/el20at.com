subject = ""
author = "اكتب اسمك هنا"
posted = "2008-06-08"
text = "يعني بشكل عام الفيلم ساذج جدا او طبول كبيرة ولها أصوات عالية بس من داخلها فارغة هذه ضربة قاضية جديدة ليس للسينما المصرية بل هي ضربة جديدة وقوية للقومية العربية عندما يقوم اتحاد من الممثلين المصريين والسوريين ليحاولو تجديد فكرة نهوض القومية العربية على حساب الاسلام او جعلها في مواجهة الاسلام للأسف كان العدو في الفيلم الاسلام ولم تكن هناك مداخل للقصة أو حتى مخارج للكاتب لأي من المبررات وذلك لأنه لو تجرأ وفعل لأظهر مزيدا من السذاجة"
archived = "2010-02-09"
capture_url = ""

