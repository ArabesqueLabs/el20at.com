author = "محمود محمد"
posted = "2008-06-06"
text = "فعلا فضلنا اكتر من سنة عمالين نسمع عن الفيلم ونقرا الأسامي الكبيرة المكتوبة فيه ، وفوجئنا بهذا الفيلم العبيط مع الأسف ، فيلم فعلا خساره فيه الفلوس اللي الواحد دفعها علشان يتفرج عليه ،<br />وده مش اول مقلب ناخده من شركة جود نيوز للأسف ، هذه الشركة ناجحة في حاجة واحدة بس ، إنها تعمل دعاية قوية جدا للفيلم أما انها تعمل الفيلم ذات نفسه فده شيء فاشل جدا"
