posted = "2008-06-12"
text = "انا لم ار الفيلم و لكن الصورة وصلتني واضحة يا مريم و فعلا انت متميزة في كتابتك و ترتيب عرضك للصورة يعطي الانسان احساس انه شاف الفيلم و اعتقد ان هناك يد خفية ليست مبدعة علي الاطلاق بل سطحية و تجارية هي التي كتبت هذا التهريج و لكن الذي احزنني اكثر هو الشباب المسلم الذي يتمني كل الخير للعرب و المسلمين ويتمني ان يشارك في نهضة الامة كما يشارك في التعليق علي الذي يقرأه ليكون ايجابيا هؤلاء الشباب المشاركون في التعليق لم يخطر ببالهم ان يعرفوا كيف يكتبون لغتهم حتي لو كانت عامية .فأنا اري ان اول خطوة لتحقيق اي نجاح في حياتنا ان نحسن التعبير عن انفسنا بلغتنا القوية الرائعة"
