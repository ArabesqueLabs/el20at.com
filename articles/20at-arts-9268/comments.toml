[[comments]]
order = 4
subject = ""
author = "المعتز بدين الله"
posted = "2008-06-07"
text = "لا حول و لا قوة الا بالله<br />يعني هو كل فيلم لازم يظهروا فيه المتدين على انه ارهابي و تفجيري ؟؟<br />الا تتفقوا معي على اننا قد مللنا من هذه الصورة النمطية التي ما اصبحت تتعدى حدود العداء للدين و التدين ؟<br />هل يجرؤ العاملين في مجال دعارة السينما ان يصوروا القساوسة الارهابيين و الشاذين جنسيا كما نرى في الاخبار ؟<br />هل يجرؤ هؤلاء الرويبضة ان يصوروا واقع الكنيسة العبطية في مصر و التي ياكلها التطرف أكلا و يشتمون الاسلام و يدعون لقتل المسلمين في مواقعهم الالكترونية و التسجيلات الصوتية و المرئية موجودة لمن يكذبني<br />ارفعوا ايديكم عن الاسلام يا داعري السينما فمن عاش في احضان البغايا عقود الزمن ليس اهلا لان يقيم الدين و التدين"
archived = "2010-02-09"
capture_url = ""

[[comments]]
order = 5
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-06-08"
text = "الحقيقة يا مريم مع احترامي الشديد لرأيك الا اني لا اوافقك الرأي في حاجات كتييييير<br />انا شايف انو القصة كلها عرض واقعي جداً و صريح و جرئ جداً للحصل و الي بيحصل<br />و الحقيقة ركز علي نقطة مهمة جداً \" انهم من العادي انهم يشوفونا ارهابيين … ده طبعاً بعد كلام بوش … و طبعاً من الطبيعي اننا نشوفهوم كلاب محتلين \"<br />لكن الحقيقة انو مش كل الامريكان \"بوش\" … ولا كل عربي مسلم \"بن لادن\" …<br />انا شايف انو حط ايدو علي الحقيقة فعلاً"
archived = "2010-02-09"
capture_url = ""

[[comments]]
