[[comments]]
order = 2
subject = "اسهاب و مرونه فى استدعاء الاحداث"
author = "محمد السيد جراد"
text = "أحسنت استاذ منير<br />تصويرك للامور فيه نوع من الاسهاب المحبب للنفوس و المرونه فى استدعاء الأحداث و بالرغم من نقدك لكثير من مناحى الحياة الا انه ...نقد منطقى و مبنى على دلائل.. كما انه نقد من شخص احب حياته بكل صورها بحلوها و مرها ...فانت تتكلم عن الماضى و تذكرنا به بكثير من الحنين ."
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528045559/http://masr.20at.com:80/newArticle.php?sid=10378"

[[comments]]
order = 3
subject = "حلوة"
author = "shimoland"
text = "طريقة سرد شيقة و جميلة و بها مواطن تشبيهية جذابة نوعا ما ..<br />تصلح في كتابة القصص<br />و لكن .. ليه في بعض الجمل فيها كلمات عامية و كلمات فصحى (دايما جاهز ،أرواح شقيانة )<br />اعتقد لو كان كله على نمط واحد كان افضل<br />نرجو ان تحاول في كتابة قصة ما ... و نقراها لك قريبا"
archived = "2007-06-29"
capture_url = "https://web.archive.org/web/20070629085846/http://masr.20at.com:80/newArticle.php?sid=10378"
