[[comments]]
order = 0
subject = "حرام ...عليكم"
author = "شرقاوى"
text = "هيا الناس متضايقه من الشرقيه ليه<br />الشرقيه بقت رمز لكل ما هو غبى ..ومتخلف ...وغير حضارى<br />ده ايه القرف ده"
