subject = "استهزاء"
author = "الدميرى"
posted = "2008-02-11"
text = "الافلام والمسرحيات بامكانك ان تشاهد فيها كمية الاستهزاء بالغه العربيه...حتى بات الذى يتحدث اللغه العربيه شخص يدعى للسخلريه والاستهزاء.... انها امراض دفينه(لا تجادل ولا تناقش يا اخ على فان هذا من مصلحة الجماعه)تقال الان لكل من يتحدث العربيه وللاسف تقال من اشخاص المفتر انهم مسلمين ((المقوله لعادل امام))"
archived = "2010-03-14"
