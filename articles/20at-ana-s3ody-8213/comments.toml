subject = "شئ مستفز"
author = "اكتب اسمك هنا"
posted = "2008-02-10"
text = "ده شئ مستفز جدا ... اللى بيعمل كده عشان المنظرة بيسقط من نظرى تماما<br />لكن بيصعب عليا جدا اللى متعودين على كده بسبب دراستهم .... وقابلت منهم كتير بيحاول يتخلص من الكلمات دى<br />الافظع دلوقتى هو مايسمى بالفرانكوعربى .. اللى بنكتب به فى الشات والنت .. ده اللى فعلا هيضيع لنا اللغة تماما<br />عامة دى لغة القران ويستحيل تضيع .. لكن محتاجة اللى يدافع عنها ... وهى مش هيرجع لها قيمتها تانى اللى لو العرب والمسلمين قدروا يرجعوا قيمتهم لأنفسهم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "وامصيبتاااه"
author = "الدميرى"
posted = "2008-02-11"
text = "قديما كانت لغة الشعر التى نقراها كشعر المتنبى والجاحظ وغيره كانت المتداوله بين الناس فافتخر كل عربى بها حتى ان معجزة الرسول كانت بمثابة تحدى لهم فعجزوا عن الاتيان بمثلها وانبهر بها الكثيرون وقصص اسلام كثير من الصحابه كثيره...<br />لكن اللغه بدات تنهار مع فتوحات المسلمين الكثيره حيث دخل فى الاسلام اشخاص غير عربيين ادخلوا بها الفاظا جديده ودعوا الى ترك الالفاظ الصعبه حتى لكد كانت تضيع اللغه .... المهم ان سبب ذلك الانحدار هو ان اناسا كانت لهم مصلحه فى تحريف اللغه....ولنسئل انفسنا من له المصلحه فى ضياع لغة (القرءان)؟؟؟؟؟؟؟؟؟؟<br />فعود يا مسلمون لان الحرب على الاسلام باتت واضحة فساهم فى بقائها لعله يكون فلاحنا جميعا....<br />الدميرى19 سنه...ELDEMERY_89@YAHOO.COM"
archived = "2010-03-14"
