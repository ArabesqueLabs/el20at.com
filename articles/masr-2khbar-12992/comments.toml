text = "ان الجبلى السعودى الجنسية وصاحب المستشفيات الاثتثمارية هيطلع الغلابة بتوع البرادعة هما المسئولين ويستحقوا اللى جرى لهم لانهم ما بيعرفوش يشربوا<br />وفى نظر الجبلى ان بتوع البرادعة غلطوا لانهم لم يشربوا مياة من الزجاجات المعدنية<br />حاضر يا دكتور جبلى<br />هنخليهم يشتروا مياة معدنية<br />احنا اسفين"
