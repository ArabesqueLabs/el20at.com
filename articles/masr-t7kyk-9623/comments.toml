[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-07-16"
text = "تحصيل حاصل أن نشيد أو نتوقف امام عبقرية أداء عادل امام الذي اضحكنا‏30‏ سنة كاملة‏,‏ بينما هنا هجر الكوميديا لأداء آخر مريح وحميمي وممتع‏..‏ وعمر الشريف فنان التمثيل الكبير صاحب الأداء الذي يشجي كعازف ماهر لفنون التعبير‏..‏ وتم اختيار فريق العمل بمهارة حقيقية من رامي امام الذي قاد فيلما صعبا للغاية‏,‏ ونجح في أن يجعله حالة فنية لا تسقط من الذاكرة بسهولة‏..‏ والفيلم اضافة للفنانة لبلبة‏,‏ واكتشاف لمحمد عادل امام وشيرين‏,‏ وعودة لهناء الشوربجي‏,‏ ويسترد عزت أبو عوف عافيته كممثل‏..‏ وأضافت موسيقي ياسر عبدالرحمن للفيلم روحا‏,‏ وديكورات عادل المغربي‏,‏ وجاء مونتاج ماجد مجدي بارعا في رصد المفارقات في تنقل سلس ومريح‏.‏"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الجمهورية 10-07-2008"
posted = "2008-07-16"
text = "* لعلي لا أكون مبالغة حين أقول إن \"حسن ومرقص\" فيلم يستحق أن نتوقف عنده طويلاً.. لأن صُنَّاعه اختاروا تقديمه في \"عز الأزمة\" بدلاً من الابتعاد عنها. وترك كل ما يحدث في مصر من احتقان طائفي بلا تعقيب. مؤكدين أن أهل الفن ليسوا جميعاً من نفس النوع. فإذا كان بينهم من يري في السينما مجرد لحظات من الضحك والفرفشة. فإن هناك من يراها أيضاً موقفاً اجتماعياً والتزاماً أخلاقياً علي كل من يملك ضميراً حياً أن يلتزم به.. وبرغم أن فكرة الفيلم طاغية علي بنائه. فإنها تبدو منطقية في إطار السيناريو الذي كتبه يوسف معاطي معتمداً علي مقارنة كبري تتحول إلي منبع لمفارقات"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
author = "رءوف توفيق"
posted = "2008-07-16"
text = "لو أنفقت الدولة مئات الملايين من الجنيهات من أجل إطفاء نيران الفتنة الطائفية لما حققت نتيجة مثلما يمكن أن يحققه فيلم «حسن ومرقص». لو أنفقت الكنيسة المصرية مئات الملايين للدعوة لرسالتها فى المحبة والسلام والتآخى، لما حققت نجاحا مثلما حققه فيلم «حسن ومرقص»."
archived = "2010-03-14"
