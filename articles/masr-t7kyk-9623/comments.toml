subject = "ازيك يا مروة"
author = "مش لازم"
posted = "2008-07-16"
text = "شفتي ازاي بأه انا بنبهك لموضوعات كويسة<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />ازيك يا مروا<br />أرسل هذا التعليق بواسطة : مش لازم<br />كويس خالص<br />وفيه فيلم جديد طلع اسمه (حسن ومرقص)<br />يا ليت تعمليلنا تحقيق عنه"
