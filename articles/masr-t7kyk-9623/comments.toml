text = "وها هو عادل إمام يعود إلينا قبل أن نلتقط أنفاسنا ليفجر أمامنا هذا الشهاب السينمائي الذي أضاء سماءنا السينمائية وملأها نورا في فيلم لا حد لذكائه وشفافيته وتأثيره وتسلله إلي شراييننا ممسكا بكرة من لهب تتلاعب بها أصابعه الواعية بذكاء وحرفية تثير الدهشة والإعجاب"
