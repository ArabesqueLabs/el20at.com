author = "banooooota 8"
posted = "2010-03-02"
text = "اللهم اهدي شباب و بنا المسلمين<br />يا جماعة فعلا الموضوع خطير<br />و انا أنصح كل بنت ادمنت المواقع دي أن تستعيذ بالله من الشيطان الرجيم كل ما تيجي تفتح المواقع دي<br />و تفتكر ان المرء يبعث على ما مات عليه<br />لو لقدر الله ماتت و هي بتتفرج على حاجات كدة ازاي هتقابل ربنا<br />و كمان<br />تفتكر ان ذنب زي ده ممكن يمنع خييير كان جايلها من زوج صالح و حلال<br />ساعتها هتقفل على طول علشان ربنا يرزقها بزوج صالح او ييسر لها زواجها لو كانت مخطوبة<br />قال رسول الله صلى الله عليه وسلم :<br />( من ترك شيئا لله بدله الله خيرا منه )<br />خليكي قوية و دوسي كلوز و اقفلي المواقع دي بنية ان ربنا يرزقك الزواج الحلال في اقرب وقت<br />اللهم اغننا بحلالك عن حرامك و اغننا بفضلك عمن سواك<br />آميــــــــــــن"
