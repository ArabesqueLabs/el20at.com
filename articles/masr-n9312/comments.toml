subject = "ضع عنوان التعليق"
text = "ياااااااااااه ..انا فاكرة الموضوع ده من السنة اللي فاتت ..وفاكرة كمان اني احتقرت الامام ده أوي ..لأنه صلى رغم أنف المأمومين ..وكأن الحكاية عافية أو فهلوة ..حاجة مقرفة فعلا انك تصلي امام غصب عن المأمومين ..الصحابة كانوا بيتهربوا من الامامة لأنها مسئولية ..لكن بسلامته فرحان أوي انه صلى رغم انف الناس ..تعرف ايه انت بقى عن شروط الامامة ؟ وتعرف ايه حكم الأخ اللي يصلي بناس وهم له كارهين؟"
