text = "دى استهلاك متواضع جدا<br />ويدل على مدى بؤس الشعب<br />وبعدين دى حاجة بتتاكل<br />ومحدش حسب قد اية استهلاك الكافيار والسيجار والخمور المستوردة وحتى الايس كريم المستورد من باريس لكبار علية القوم<br />انا كنت فى السوق اليوم الوقفة قبل العيد ولقيت كتير من الناس بتشترى لحمة الفشة والممبار وارجل الجواميس علشان العيد<br />الناس غلابة<br />وغلابة قوى<br />وربما من شدة الفقر تنبت افكار شيوعية متطرفة فى البلد"
