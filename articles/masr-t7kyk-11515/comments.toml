order = 0
subject = "قالوا : فى الصغر يحب الصبيان الفارس صاحب الحصان وت"
author = "ابو زيد الهلالى سلامة"
posted = "2009-03-09"
text = "ذكرى مولد سيدى رسول اللة - احب الناس الى قلوبنا<br />فلماذا لا نحتفل بذكرى النور الهادى ؟ ويفرح صغارنا بلعبة مصنوعة من الحلاوة يأكلونها ويتذكرون نبى الاسلام ويتعلمون ان اشكال الاصنام والاوثان لا تنفع ولا تضر<br />قد يقول البعض انها بدعة ولكنها بدعة طيبة<br />واعتقد اننا الشعب المسلم الوحيد الذى يحتفل كل هذا الاحتفال بمولد سيدى رسول اللة<br />سيدى يا رسول اللة بابى انت وامى"
