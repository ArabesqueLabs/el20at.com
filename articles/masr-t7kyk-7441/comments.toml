[[comments]]
order = 1
subject = "هل كفر الصحفيون لما قالوا ان سعادة اللواء عيان"
author = "اسناوى النجعاوى"
posted = "2007-10-27"
text = "طيب هو الراجل مصنوع من الحديد الزهر ومغلف بالجرانيت علشان ما يمرضش<br />قالوا مريض طيب واية يعنى ما كل الناس بتمرض وتطيب وتصحى تانى<br />سيادة اللواء طيار ابن الرب لا يجوع فيها ولا يمرض ومحروس من الرب<br />ناقص يقول لنا انا ربكم الاعلى<br />وناقص تطلع فتوى من المفتى انة هيعيش خمس قرون<br />اية هيافة النظام دى<br />ياعم العملية هايفة خالص واحد يطلع من الرياسة يقول انة مش عيان وانة هيجرى فى المارثون الجاى فى فرنسا"
archived = "2010-03-14"
capture_url = ""
