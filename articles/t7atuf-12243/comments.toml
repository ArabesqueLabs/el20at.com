author = "جمعة مصطفى خليل محمد"
posted = "2009-08-20"
text = "قضية النوبة مثل أي قضية في أي محافظة من محافظات مصر المحروسة وللنوبيين مطالب مشروعة وأعتقد أن الحكومة تفهمت هذا الأمر وتسعى لتنفيذ مطالب النوبيين ولكننا أعلق هنا على بعض الإخوة المصريين أنهم يعتبرون النوبيين غير مصريين وأود أن أؤكد كما قال الكاتب الكبير أنيس منصور النوبة أصل الحضارة المصرية الأصيلة والدليل على ذلك أن في منطقة النوبة حتى الآن تقل الجرائم بأنواعها وأقول لمن يقولون أننا لسنا مصريين !!!! إن كان كلامك صدق عرفنني بنسبك ؟؟حتى الجد الخامس والعشرون في ثواني معدودة وأنا أتحدي لو يعرفنى بنسبه حتى الجد الخامس فقط ؟؟؟!!!<br />وأخيرا أدعوا الكريم أن يحفظنا جميعا لمصرنا ويحفظ مصرنا لنا جميعا من أسوان حتى سيناء الحرة"
archived = "2010-03-14"
