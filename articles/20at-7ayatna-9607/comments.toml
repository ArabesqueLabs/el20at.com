[[comments]]
order = 4
subject = "eissa_alleji@yahoo.com"
author = "عيسى اللجي"
posted = "2008-07-22"
text = "ليست القضية بين الرجل والمرأة من يملك من وليست العلاقة قائمة على أن هذا لي ولايمكن أن يشاركني به أحد لأن الانسان بطبيعته لايستطيع عزل نفسه وبالتالي فإن له شبكة علاقات متداخلة أحياناً ومتنافرة أحياناً أخرى فالزوجة لها حقوقها وعليها واجبات والأم لها حقوقها التي هي أولى من كل شيء ولكن ما أوصلنا لهذه النتائج هي ضياع أطراف المعادلة التي ننشد حلها فلا الأمهات يعرفن حدوداً لعواطفهن فيقمن بكبح جماحها وليست لديهن القدرة على فهم قضية حساسة أن هذه الفتاة الجديدة بحياة الولد ذات طباع وتربية مختلفة وزمان مختلف النمط عما عشن<br />ثم أن الزوجات وهذه للأسف ظاهرة استشرت لدى مجتمعاتنا سلفاً يعددن العدة لسلخ الرجل عن كل ما كان قبل الزواج من علاقات وخصوصاً مع الأقارب لذلك يبدأ الشد من كلا الطرفين لدرجة تودي بتدمير العلاقة أحياناً<br />والحل من وجهة نظري أو دعوني أقول الدواء لما نصف من علة متوفر بصيدلية الاسلام ومنذ عدة قرون لو كلفنا أنفسنا وبيننا حياتنا على تعليم الدين الحنيف واقتدينا بخير قدوة وخير إمام صلى الله عليه وسلم وكيف كان خلقه مع أهله وذويه وأخذنا العبر من نهج من ساروا على دربه لأن البعض سيقول لي رسول الله ماتت أمه وهو طفل لكن ستجدون أن المعادلة سهلة ويمكن أن تسير الحياة باتزان وهدوء<br />ولو أنني أطلت لكن أود أن أقدم النصح لأخواتي المقبلات على الزواج وهي بشيء من الحكمة والجهد القليل يمكننا أن نسير بسلام مع الحموات والوصول لبيت سعيد يستحق منا التضحية والجهد"
archived = "2010-03-14"
