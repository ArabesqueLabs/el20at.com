[[comments]]
order = 1
subject = "مممم"
author = "دينـــا"
posted = "2008-07-13"
text = "أما أنا فأتوقع بأن أمه ستسبب لي الكثير من المتاعب ولا سيما عندما نخرج سوياً أو حين يغيب فترة زمنية عن أمه ، فلا أعتقد أبداً بأني سأرتـــاح في حياتي \" البتة \" .. بل سأبقى في مشاكل لا أول لها ولا آخر ، ومن جهة أخرى قال لي عبد الرحمن \" ابن عمتي \" قبل 3 سنوات وهو اصلاً وحيد أمه : لن أتزوج إلا بفتاة تشبه أمي كثيراً .. و هو الآن ينعم بتكتل المشاكل فوق عاتقه .. بل وأصبحت أمه تحرضه على طلاق زوجته .. ولا أعلم ماذا سيفعل هذا الابن المدلل .. !!<br />أستاذة هلا ..<br />لا حرمنا الله جوهر فكرك \" ماشاء الله تبارك الرحمن \" أنا جداً معجبة ببحثك ومواضيعك الشيقة ..<br />شكراً كثيراً لك حبيبتي على هذا المجهود المثمر \" الرائع \" ..<br />ألم تلاحظي بأني بدأت أتحرى أيضاً مثلك هههههه<br />وفقك الله أستاذتي ..<br />أختك / دينــــا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "رائعة يا استاذة هلا .."
author = "شادي الألحان"
posted = "2008-07-14"
text = "هل تتوقعون بأن وحيد أمه هو دائماً يغمره الدلال .. !!<br />حسناً حسناً .. !<br />سأقول وجهة نظري هنـــا ..<br />إن أرادت الفتاة أن تنعم بحياة سعيدة مع وحيد أمه \\\\\\\" زوجها \\\\\\\" فعليها أن تتعلم من أمه كل أمرٍ شبّ عليه هذا الزوج .. بل وتحاول هي أن تتقرب من أمه حتى تكسب ودهـا وحبها .. وعندها ستجد الفتاة بأن أم زوجهـا قد أدخلتها دائرة الدلال مع ابنهـا .. وبذلك كسبت الفتاة زوجهــا .. وكسبت أيضاً أمه ..<br />أسأل الله لكِ التوفيق يا باذخة العطاء \\\\\\\" هلا \\\\\\\" ..<br />تمنياتي للجميع بإجازة سعيدة .."
archived = "2010-03-14"
capture_url = ""

