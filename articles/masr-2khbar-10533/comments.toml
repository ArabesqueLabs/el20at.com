[[comments]]
order = 2
subject = "يا زخاري فيه حاجه اسمها تنفيذ احكام"
author = "مش الانبا بيشوي"
posted = "2008-11-18"
text = "فيه حاجه اسمها تنفيذ احكام يا زخاري<br />الحكم مش مشكلة<br />لكن تنفيذ الحكم هو المشكلة<br />ازاي حتنفذ حكم ضد الحكومة يا زخ زخ<br />شوية عيال صيع محامين صيع غاويين شهرة رفعوا قضية والمحكمة حكمتلهم ايه المشكلة<br />تعالى بقا يا حبيبي في قسم تنفيذ الاحكام في المحكمة<br />وورينا مين حيعبرك<br />سلام يا زخاري<br />وبعدين دي سياسة حسني مبارك حبيبك مش انت بتحب حسني مبارك وجمال مبارك<br />هو نظيف يقدر يعمل حاجه من غير اذنهم<br />يطيروه تاني يوم على طول يقعدوه في البيت يطبخ مع المدام بتاعته<br />يا زخاري ما تستعبطش نظيف دا طرطوس اللي بيقرر المسائل اللي زي دي حسني مبارك نفسه صحبك وحبيبك<br />سلام يا زخزخ يا خويا"
archived = "2010-03-14"
capture_url = ""

