subject = "حكم قضائى اية يا روح امك"
author = "ام زخارى"
posted = "2008-11-18"
text = "حكم قضائى ضد مين ؟<br />دا قرار سيادى ببيع غاز لاسرائيل<br />مش قرار خميس فجلة والا قرار اشكيف قاعد بيبيع عسلية على راس الحارة<br />دا قرار سيادى من اكبر راس فى البلد ببيع غاز للاشقاء اليهود اولاد ابراهيم<br />الحكم بتاع القاضى يتبل ويتشرب ميتة او يتلف زى القرطاس ويتلبس"
