subject = "ياأخى دمك يلطش"
author = "المصرى أفندى"
posted = "2009-03-08"
text = "ياجماعة والله لما بأشوف صورة أى حد من عيلة مبارك بأحس أن غم الدنيا كلها قدامى. ياعنى أحنا متحملين وبندعى ربنا أنه يخلصنا من الخازوق اللى سابه لنا السادات الله يسامحه. واحد عامل زى السلاحف بيعيش مائتين سنة. وزى الخرتيت جلده سميك مفيش حاجة بتأثر فيه وزى الحمار فى غباوته(مع الأعتزار لكل الحمير). لأ وأيه يجيلنا خازوق صغير يطلع لنا زى الدمل وعاوز يستلم الكرسى من اللى خلفه. ياعم غور بقى خللى البلد تفوق دا لو كان لسه فيها أى خير........ ربنا يأخدكم ياعيلة مرض."
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003103/http://masr.20at.com:80/newArticle.php?sid=20209"
