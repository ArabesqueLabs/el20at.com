subject = "من مبارك الى باراك أوباما"
author = "http://tornado75.blogspot.com/"
posted = "2009-03-08"
text = "ماشي على نفس الطريق المستقيم باخدم اميركا واسرئيل وعمولتي ملاليم<br />رؤساء اميركا ربعهم عدى عليا وانا قاعد على الكرسي ولا الصنم المقيم<br />رغم كوارث بعضهم عندي الكل يشهد ان دفتر خــــــدمتي فل وسليم<br />ولما يشتمني كمان منهم رئيس باكبر الطاسة واقول دا مبتديء وغشيم<br />ريجان في يوم قال ان انا كداب وباعاتبه في التلفيون قاللي انكتم يا لئيم<br />بادعيله يشفيه م الزهايمر والهبل دا مهما كان انا قلبي برضه رحيم*<br />غزة محاصرينها ولاحصار الماسادا وحياة ولادها كلهم غم وجحيم<br />المرضي بيموتوا على السور عندنا ذي السمك جوة الشبك بيحرك الخياشيم<br />لو حفروا انفاق يخطفوا منها الرغيف بيموتوا فيها بدون انذار ولا تجريم<br />اقول شاليط يرجع لحضن امه تفتح حدودي وتدخلوا وسط البلد معازيم<br />اقول شاليط يرجع لاحـــــبابه واهله وافتح لكم سينا مع الاقاليم<br />شاليط دا ابني زيه زي جمال انا مش بافرق بين فرنسي ولا مصري صميم<br />ساركوزي حتى بعت جواب بيشكرني قاللى انت حامي الاسرى والمظاليم<br />الغاز بتاخده اسرائيل مجانا والعقد مجلسنا الهزوء عامل عليه تعتيم<br />سرور حبيبي وهو عوني ع الشقا هو االموقر بيدبا وانا المعظم دبشليم<br />اقول له فصل لي قوانين العجب يقوللي هــــــات الابرة والابزيم<br />شيلنا الجهاد من كل كتب المدرسة ولو عاوزين كمان نشيل الحج والصوم<br />بنعلم الطفل الرضيع ازاي يحب العم سام ونأمركه حتى وهو فطيم<br />انا رهنت مصير المنطقة ليكو والحالة فيها ماشية تحت الجيم<br />بقى كل حكامها العرر ف ايديكو نايمين في قبضتكو ولا الطفل اليتيم<br />عملاء على اغوات على خونة و الكل ماشي في سكة التأزيم<br />وانا الى باصنع كل دا بصمتي والصمت هو ملاذي في الكرب العظيم<br />اما عن الشعب الى حاكموا باسمكو عايش حياته ف نغنغة ونعيم<br />الشعب من رفاهيته مل الحياة حاسس وجوده فيها عبء سقيم<br />بيقضي اجازاته في افران الحكومة مستني يستشهد وناقصه غريم<br />مبسوط وطافح بالسعادة والهنا في الصحة والاسكان مع التعليم<br />لو تسأله لو كان سعيد بوجودي يحلف بانه ما شاف في كرمي زعيم<br />زودت له علف المواشي ف الدقيق يمكن تجيله الصدة او يعمل رجيم<br />مواشي روسيا ترفض القمح المسوس ونجيبه تاكله عندنا المحاريم<br />من حرص حكومتنا على صحة سعادته عاوزين نضيفله التبن والبرسيم<br />أهي حاجــــــــة برضو تحرش المعدة وتسلك الأمعاء وتنشط الانزيم<br />اما عن الاصلاح وباقي المكلمة دا كله سحر وشعوذة وتنجيم<br />انا لما باسمع الكلمة بترعبنـــــي كأنها شيطان ومسه رجيم<br />بأحس لساني مش قادر يكررها وابص ع الكرسي واقول يارحيم<br />اصلاحكو معناه الكراسي تنخلع والكرسي في عرفي مؤبد مستديم<br />الكرسي دا هو حياتي ومهجتي هو رفيق الدرب ف الليل البهيم<br />الكرسي دا هو نصيبي م الحياة وهو كل الآتي والعمر القديم<br />لو راح تروح مني الحياة وبصيصها ووجودي فيها يبقى خاوي عقيم<br />الكرسي وانا حتى واحدة مننفصلش الا بموتي او تولي حميم<br />الكرسي من حبه ساعات يكلمني ويقول لي انا السين وانت الميم<br />كلام في العشق لكن انا مش فاهمه زي كلام الصوفة كله طلاسيم<br />الكرسي من وجده ساعات يناجيني وانا ف حب الكرسي عاشق مستهيم<br />ابني جمال طمعان في احسانكم خايف يضيع الكرسي م الشاب الوسيم<br />ابني جمال حامل جيناتي وخبرتي قلبه ف واشنطن والهوى من اورشليم<br />كم مرة اكلم بوش في الموضوع يقوللي ربنا يحنن وانا اقول ياكريم<br />لو تخدموه ها يعيش اسير افضالكو دا ابني وانا عارفه خدوم وكريم"
