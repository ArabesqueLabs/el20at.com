[[comments]]
order = 0
subject = "وصاحبة المدرسة مسيحية عايزة تبيعها وتروح تهاجر الى كندا"
text = "سكة السلامة<br />فيها اية لما الحكومة تشترى منها ارض المدرسة وتبنيها مدرسة جديدة من المعونة الامريكانى<br />حسب علمى ان الحكومة بطلت تبنى مدارس من زمان وان كل المدارس الجديدة بتبنيها المعونات الامريكية"
archived = "2009-02-20"
