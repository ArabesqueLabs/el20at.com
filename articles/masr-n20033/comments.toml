subject = "الحقيقة الغائبة"
author = "مصري اصيل"
posted = "2009-02-23"
text = "كنت اظن ان من واجبات الصحفي الحر ان يتأكد من صحة اي خبر يقوم بنشره او مجرد التفكير في نشره خصوصا اذا ما كان سيمس سمعة الاخرين ولكن للاسف لقد نشرت السيدة دعاء حسن خبرها عن مدرسة رمسيس الخاصة بدون ان تتأكد بنفسه من صحة المعلومات المنشورة.<br />مالكة المدرسة لم تقم ببيع المدرسة الى اي شخص او اي جهة من اين حصلت السيدة دعاء على معلوماتها؟ هل من اشخاص اخرين ذكروا لها هذه الاشياء؟ انا اتحدى ان يكون هناك دليل واحد صحيح يثبت هذه الادعاءات.<br />الذي لا تعرفه كاتبة الخبر ولا القراء والا الاهالي واولياء الامور ان المدرسة بالفعل آيلة للسقوط وان المباني تشكل خطرا على حياة اولادهم ولكن تعنت الادارة التعليمية هو الذي اوصل الحالة الى ما نحن عليه الان من تشويش وبلبلة.<br />للعلم ان مالكة المدرسة ممنوعة من دخول وادارة المدرسة منذ يونيو 2008 وان لجنة من الادارة التعليمية تقوم بادارة المدرسة تحت ما يسمى بالاشراف المالي والاداري<br />هذه اللجنة تقودها السيدة سعاد محمد التي قامت بارتكاب مخالفات مالية وادارية جسيمة بالمدرسة وتؤدي الى الضرر بمستقبل الطلبة والاخطر ما يهدد حياتهم اذا ما انهارت المدرسة على رؤوس الطلبة ومدرسيهم معا.<br />ويساعد اللجنة على ارتكاب الفساد عدد من المدرسين والعاملين الفاسدين بالمدرسة الذين قد زعموا انه قد تم فصلهم فصل تعسفي من المدرسة من قبل.<br />لقد حاول المسئولين بحي شبرا والادارة التعليمية ان يعموا اعين الناس عن الحقيقة فاصدروا تصريحات شفهية وتقارير غير معتمدة وغير مختومة من اي جهة حكومية ان المباني سليمة ولكن هناك تقارير اخرى تم اخفائها من كلية الهندسة بالازهر وكلية الهندسة بعين شمس ان المباني آيلة للسقوط وغير صالحة للاستخدام على الاطلاق.<br />هذا ما دفع المحافظة ان تنتدب لجنة هندسية ثالثة وهو ما اسفر عن صدور تقرير ثالث مطابق تماما للتقريرين السابقين وهذا قد ادى الى اصدار قرار الغلق للمدرسة.<br />لكن للاسف تحت الحاح وضغط جماهيري تم اعادة فتح المدرسة جزئيا للطلبة وهذا في منتهى الخطورة.<br />سؤالي للسيدة دعاء ، هل تستطيعين ان تحصلي على هذه التقارير الحقيقية والسليمة التي تشرح حقيقة الموقف فتكوني قد قدمت خبرا سليما للقراء؟ بدلا ان تعتمدي على خيالك او خيال الاخرين من حولك!!!!<br />للاسف المصريين دائما لا يدركون مدى خطورة الموقف الا بعد فوات الاوان والمقولة الشهيرة على السنتنا جميعا (ياريت اللي جرى ما كان)"
archived = "2010-03-14"
capture_url = ""
