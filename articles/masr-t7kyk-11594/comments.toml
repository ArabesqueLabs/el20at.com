subject = "يا خسارة على العلم والعلماء في مصر"
author = "مش ححبك"
posted = "2009-03-18"
text = "يا خسارة لما العلماء يبقو جعانين كده<br />او بمعنى اخر لما الدولة تجوع العلماء<br />لما يبقو اساتذة الجامعات جعانين والسباكين والميكانيكية والعربجية وتجار الخرده والسماسره والفوريجية والحوش واللوش شبعانين ومبسوطين<br />ماذا بقي لنا<br />بلد بتهزأ علمائها<br />اخص على كده"
