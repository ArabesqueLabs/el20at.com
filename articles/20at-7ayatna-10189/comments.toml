posted = "2008-10-04"
text = "حتى هنا فى المغرب تريدون عزل النساء عن الرجال ؟؟<br />هذه خطوة أولى و سيتبعها طبعا منع النساء تماما من نزول الشاطئ بلباس البحر<br />خنقتونا و قرفتونا الله يقرفكم و يخنقكم<br />و لماذا لا يغض الشاب بصره ؟؟<br />و لكن لا .. كيف ذلك ؟؟<br />ننحرق نحن و نموت و نروح فى داهية من أجل متعة الرجل<br />أنتم معقدون نفسيا لأنكم تنظرون إلى المرأة على إنها أداة للمتعة الجنسية فقط و لم ترقوا بعد إلى أن تدركوا أن المرأة روح و قلب و عقل و جسد ..<br />شئ مقرف"
