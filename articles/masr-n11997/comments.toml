subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
text = "و الله يا مروه انا كنت زمان لما اشوف مع حد من اصحابى self defence و لا حتى اسبراى او الحاجاتدى كنت اقوللها يا بنتى احنا ف مصر مش للدرجه دى<br />بس فعلا الايام دى اقل كلمه تتقال على التحرش انه بقى فوبيا<br />و على الرغم ان موجه المعاكسات و التحرش كانت انحسرت عن البلد فى فتره ما ليست بالبعيده الا انها رجعت الايام دى بشكل ملحوظ و مبالغ فيه من حيث الجراه من قبل الشباب يعنى مش رجعت عاديه لا دى رجعت بشكل مرضى واضح فعلا فوبيا<br />بجد ربنا يستر على الايام الجايه"
archived = "2007-10-22"
