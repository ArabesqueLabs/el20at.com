text = "الجهاز قطعة صغيرة فى حجم تليفون المحمول بتدوس على زرار بيخرج منة شعاع ليزر لصفر يسقط على الجزء الذى تريد قياس درجة حرارتة وينعكس الى الجهاز تانى ويعطى قراءة لدرجة حرارة الجسم الذى سقط علية وهو دقيق ويقيس درجات حرارة اى جسم سواء ادمى او خشب او حديد وهو انتاج صينى وتايوانى ويباع فى حدود 450 جنية<br />واشبة بلعب الاطفال التى يطلع منها شعاع ليزر على شكل قلب او نجمة"
