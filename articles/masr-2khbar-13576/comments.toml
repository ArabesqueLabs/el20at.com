author = "يا حلاوة يا ولاد"
posted = "2009-09-30"
text = "ربنا ما يحرمهم من العبط<br />الجهاز اللى الوزير المبهور بة شغال فى العالم اللى بيفهم من حوالى 15 سنة<br />طبعا برة بر مصر حصنة اللة من العلم والعلوم بتولى العسكريون حكمة من اعلى ومن اسفل ومن الجنب اليمين للجنب الشمال من سكرتير المحافظ اللواء الى رئيس الحى اللواء الى نائب وزير الاوقاف اللواء<br />الجهاز اللى قد الكف بيستخدم فى قياس درجات حرارة افران حتى الف ومائتين درجة مئوية<br />ومن زمان قوى استخدمناة فى قياس درجات حرارة عوازل ابراج الكهرباء الضغط العالى لمعرفة اى ارتفاع فى درجات الحرارة ونحن على الارض<br />وسيادة الوزير هناك اجهزة تقيس درجة حرارة القمر من على الارض اى واللة وكل ساعة لو عايز والناس بيستخدموها<br />وقانا واياكم شر الجهل<br />على فكرة الجهاز اللى سعادة الوزير بيتكلم علية انتاج الصين"
archived = "2010-03-14"
