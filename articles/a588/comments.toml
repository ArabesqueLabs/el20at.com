[[comments]]
order = 26
subject = "نونا"
text = "والله يا مرمر ده المفروض يتعمل موضوع لوحده و اهو مؤشر برضة ان المصريين تيجي تقولي لهم ازيك يقولك اشجب اندد ..ز يا عم طيب ازاي والدتك الحاجة يرد يقولك والله لنفجرلك البلد و انا هعمل و اسوي<br />يا ابا الحج مش بتكلم عن الجهاد انا بقولك ازاي الصحة هيرد برضة يقولك انا مش هسيب ولا يهودي علي الارض دي<br />والله يا مرمر الحل في رأي ان عقولنا تنضف بالقراءة و محاولة سماع الرأي الاخر مش رأينا بس<br />الفرق بين المؤمن و الكافر ان الكافر كان عنده كبر و استكبر ان يقول ان هو ده الدين الحق ... رفض يسمع كبر و عن منه<br />مش دايما رأينا صح لازم نسمع رأي غيرنا لكن زي ما انت شايفة كله عاجبة دماغة و سايبين المهم و ماسكين في الهايفة زيما انت قلتي<br />لازم الاول نتعود علي اسلوب راقي للحوار و التفكير و كفاية ندب و شجب و لطم و صويت<br />مصعب الخير بدل الشعر الي انت قلته ليه مقلتش اقتراح ازاي نقاوم؟؟؟؟؟ و احنا في بلدنا<br />ليه ملتفتش لخطورة موضوع ان اليهود بينكوشوا ورانا و قعدت تدينا من خلاصة فكرك الشعري العبقري مش قصدي اهانة عشان متقفش بس فعلا مفروسة و حزينة علي بلدي و ولادها"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018122428/http://www.20at.com:80/article.php?sid=588"

[[comments]]
order = 27
subject = "جهاد"
text = "يا نونا .. هل انت متأكدة اولا أنه اسرائيلي فعلا ؟؟ ما يمكن عيل اهبل بيستعبط<br />ثم ان الاسرائيليين دلوقتي بياخدوا تأشيرات وبيدخلوا مصر رسمي وبيسمعوا كلام الناس في الشارع ومش محتاجين جمعة الشوان<br />ثم ان العالم قرية صغيرة وفيه مية طريقة يعرف بها الاسرائيليين موقف الناس في مصر وغيرها<br />أما المصيبة فأكبر ... أين هي المقاومة .. ليس لدينا ما نخفيه .. لكننا نريد الجهاد"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018122428/http://www.20at.com:80/article.php?sid=588"

[[comments]]
order = 28
subject = "شهد من غزة"
text = "يا جماعة انت بالظبط رايحين لنفس الطريق الى اسرائيل بتحاول في كل مرة تبعت اله الوفد الفلسطيني المفاوض علشان يسيبوا القضية المهمة الى رايحين يتفاوضوا عليها و يمسكوا في الفرعيات .<br />الى عرض الصورة اكيد ما دبلجها أكيد هي صورة حقيقة لبنت انتكبت في حد من أهلها بعدين ذنبها مش في جمالها ذنبها إنها فلسطينية بس .<br />و للأخت المفروسةانا اكيدة انك لو انت قاعدة مكان اي حد من الحكام كنتي أكيد حكيتي بنفس لهجتهم و انتهجتي نفس نهجهم .<br />هو أكيد في شي غلط ما بعرف أذا كان هو في الحكام و لا لا<br />بس معقول كل الحكام العرب الـ22 فيهم نفس المشكلة و لا تكون المشكلة فينا احنا يالشعوب بس مش عارفين."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018122428/http://www.20at.com:80/article.php?sid=588"
