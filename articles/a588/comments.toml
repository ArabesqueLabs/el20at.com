[[comments]]
order = 14
subject = "منقول من ساحة حوار إسلام أون لاين"
text = "السلام عليكم ورحمة الله وبركاته<br />ماذا اقول لها اقول لها انني لم استطع ان افعل شيء لم استطع<br />ان اعيد الفرحه لك وهتان العينان التي ان نظرتوا اليهم اجد<br />حزن العالم فيهم حزن دفين بداخل هاتين العينان اني خجل من<br />نفسي ولا استطيع ان اوجه لها كلمة ولكن عندما يشاء الله فسيكون<br />كلمتي هي دمائهم<br />قسماً بكل غريبة المنفى... ومغترب<br />بالنازحين على مرامي أعين الشهب<br />سأظل أحرق شمعتي وأذوب في لهبي<br />وأزفهم كأسي وأحيا العمر في سغب<br />سأظل أدفع قاربي في الصاخب اللجب<br />حتى أطل به على دوامة الحقب<br />والسلام عليكم ورحمة الله وبركاته<br />اخوكم المسلم<br />فلسطيني بالغربة"
archived = "2004-09-07"
capture_url = "https://web.archive.org/web/20040907105035/http://www.20at.com:80/article.php?sid=588"

