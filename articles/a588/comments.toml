text = "شايفة يا مرمر انا اعمل ايه انا قولي لي انت في الشعب المصري انا حاسة بأذن في مالطا<br />لسه بيشجوبوا و يعيطوا و يشعروا و ينزلوا يشربوا ببسي و ياكلوا في ماك<br />و محدش قال اي تعليق علي ان الاسرائيلي ده العربي بتاعه احسن مننا ولا انه مهتم يعرف تفكرنا<br />قولي انت الطم؟ ولا اصوت؟ ولا اصوت و الطم؟"
