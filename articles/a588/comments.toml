[[comments]]
order = 16
subject = "وائل عباس"
text = "يسوؤني جدا ان نروج لقضايانا بمفاهيم ومقاييس غربية<br />يعني اشمعنى البنت عنيها زرقاء وشعرها اصفر<br />ليه مش سمراء او سوداء حتى ؟؟؟<br />ليه مش كرته وشعرها خشن<br />ليه ما عندهاش ضب وبتضحك ضحكة هبلة ؟؟؟<br />ليه بنت البواب بتاع العمارة اللي جنبنا مش رمز للبراءة ؟؟؟<br />ليه دايما مقاييس الجمال والبراءة عندنا غربية ؟؟؟<br />ودايما نتساءل احنا ليه متخلفين !!!<br />وفير آند لافلي بيبيع عندنا بالعبيط !!!<br />وكل واحد راح عمل قرشين في الخليج يرجع لامه يقولها جوزيني واحدة بس تكون بيضه يامه !!!<br />احنا ليه تافهين كده<br />ومش معتزين ومعتدين بنفسنا كده ؟؟؟<br />ده حتى اليابانيين ايام الحرب العالمية برغم انهم قصيرين وعنيهم ضيقة كانوا عندهم نظرية بتفوق الجنس الياباني عن باقي شعوب العالم اللتي اعتبروها مشوهة !!!<br />والهنود عاملين حملة لمقاومة فير ان لافلي وباقي مستحضرات تبييض البشرة باعتبارها اعتداء على الجمال الهندي الاصيل ...<br />لا حول ولا قوة الا بالله<br />ربنا يهدي"
archived = "2004-09-07"
capture_url = "https://web.archive.org/web/20040907105035/http://www.20at.com:80/article.php?sid=588"

[[comments]]
order = 17
subject = "نونا متغاظة"
text = "تصدقوا ان احنا اغبيا عشان محدش اهتم ليه اليهودي ده متعلم عربي كده و احسن مننا كمان و بيجي و يقرا و يشوف الاستفتائات و يطلع منها بمؤشرات<br />ابسط حاجة الموضوع الي انا كتبته بيقوله مصر كل رجالتها بيدوروا علي قلت الادب و ده المدخل الي تدخولوا له منه<br />اكيد دي معروفة بس انا اكدتها<br />موضوع كريم ابو زيد يدي له مؤشر ان احنا واخدين الجيش ده رحلة و خناقتنا في التعليقات تدل علي ان كل واحد فينا عاجبه دماغة و كل الناس حمير<br />و اسلوبنا في الحوار و المناقشة زفت و اي موضوع نتكلم فيه نخرج عنه<br />و هكذا بكل سهوله و احسن من احسن جاسوس احنا بنشتغل للموساد بدون قصد<br />طبعا فاكرين جمعة الشوان دموع في عيون وقحة<br />كان يجمع معلوماته من كلام الناس في الشارع<br />حد يرد علي......."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018122428/http://www.20at.com:80/article.php?sid=588"

