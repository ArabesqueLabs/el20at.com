[[comments]]
order = 4
subject = "للاسف"
author = "محمد بسيونى"
posted = "2008-07-07"
text = "انا للاسف مدرس ومكانتي الاجتماعيه صفر علي الشمال او من المافيه<br />رغم اني مدرس لماده مش اساسيه وله بدي دروس وله حاجه لكن انا مع اي مدرس بيدي درس خصوصي وضد اي شخص يهاجم ذلك اما لانه جاهل باحوال المدرس او بيستعبط او عايش في ميه البطيخ ومش حاسس بالدنيا فانا مثلا بقالي 8 سنين في التدريس باخد كام يا استاذي الفاضل عشان اعيش واكل والبس كويس ولو متجوز اصرف عليها وعلي اولادي وادفع الكهربا والميه والتليفونات واجر المنزل باخد 371 جنيه تهريجي رسمي طبعا واي مدرس لا يستطيع العيش بهذا المرتب او حتي طفل صغير يقدر يعيش بالمبلغ ده ثانيا المدرس مش هو اللي بيجري وراه التلاميذ العهد ده انتهي معلش اولياء الامور هما اللي بيزحفوا ويبوسوا ايد المدرس عشان ياخد ابنهم في درس والغريب ان بعد كده ولي الامر بيهاجم المدرس ؟؟<br />بالاضافه بقي زي ما قيل ما ادراك بالمنهج وله المتابعين الجهله واللي بيتابعوا عليه ورق وعنوا الدرس علي السبوره الحياه في وزارتنا ورق ورق ورق ولا يهم العمل الحقيقي<br />ولو حاولت توصل لحقك يبقي انت اللي غلط ومكروه وتحارب<br />كادر ده ضحك علي دقون عشان الناس تتلهي وتفضل تشوف شغلها وتروح الثانويه تراقب والامتحانات<br />وكادر ايه يا ابو كادر يطلع كام الكادر يعني انا زدت 50 جنيه وتاني يوم استلام ليه لقيت الاسعار زادت الضعف والمواصلات زادت اربعين في الميه<br />ويا سلام بقي لو حبيت تتفوق وتاخد دبلومه وتدفع فيها فلوس قد كده<br />هتزيد زياده خطيره 2 جنيه علي مرتبك ياااا سلااااااااااااااااااااااااااام علي تشجيع العلم<br />احنا في وزارة المهرجين"
archived = "2010-03-14"
