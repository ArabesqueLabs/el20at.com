[[comments]]
order = 5
subject = "يا ناس يا ظلمه اتقوا الله"
author = "MON MON"
posted = "2008-08-21"
text = "فى يوم كان حلم حياتى اكون مدرسه , الحمد لله بقيت , بس الحمد لله الحكومه الرائعه الجميله عملت من الحلم كابوس<br />انا اتعينت من اربع سنوات على درجه مدرس اعدادى بس علشان خايبه والتوجيهه شاف كده لانى كنت جايبه فى نتيجه البكالوريوس \\\"جيد\\\" فالموجهه بتاعتى تعمل ايه تنتدبنى لمدرسه ابتدائى انتداب كلى وانا زى الشاطره كل شهر اروح للمدرسه الاساسى بتاعتى علشان اخد منها مرتب كل شهر مكان جميل معرفش حاجه عنه غير ان اسمى وفلوسى موجودين هناك والحمد لله بمناسبه الانتداب ده واناماليش اى حق فى الدنيا ولا فى اى حاجه لانى منتدبه .<br />قولت ايه الخيابه دى لازم اعمل حاجه الحمد لله اخدت دبلومه مهنيه فى التربيه الخاصه , دبلومه خاصه فى طرق ومناهج التدريس . بدرجه جيد باردوا خيابه مش كده فكرت اكمل تعليمى علشان ابقى شاطره كان المفروض اخد ICDL والحمد لله اخدته يا ناس ده حق اليونسكو علينا وكمان حق المصريين تاخدوا كمان INTELوماله ناخده كمان<br />بس اروح اخد حقى من الحكومه بقى الغوا الانتداب بتاعى ارجع مدرسى<br />قالولى اسفين يا خايبه ده انتى جايبه \\\"جيد \\\" فى البكالوريوس ظلم ده ولا حلال<br />الحكومه الجميله هتجيب حق المدرس امتحان كادر هتجيبلى حقى انا وكل مدرس يالله مش ممكن الكلام بجد<br />الحكومه عامله مفاجئه لينا امتحان \\\" لغه عربيه , كفاءه تربويه اعدادى وثانوى , ماده تخصص اعدادى وثانوى \\\" الله على الحق يا ناس همتحن حاجه عمرى ما مسكت كتابها علشان اشرحه ومفاجه الامتحان اربع ايام قبله علشان يا شطوره تلحقى تبصى فى الكتاب<br />هو ده الحق يا ظلمه عازيين حقنا ربنا ينتقم منكم يا ظلمه<br />حسبى الله ونعم الوكيل اصل الحاج يسرى شاف فلوس مالهاش صاحب قال ناخد منها شويه احنا واصحابى الدكاتره الدكتور التعبان اوى الى هيحط الامتحان للمدرس الفاشل الى كان فى يوم من الايام المدرس بتاعه , كمان الدكتور المجتهد الى هيتعب حاله ويصحح الامتحان ياخد من الحب جانب اشمعنى هو ولا هو مالوش حق دى حتى كانت قاعده قهوه واحده ولا يسرى ياكل وراشيل ماتكولش ههههههههههههه<br />ياله ربنا يهد القوى"
