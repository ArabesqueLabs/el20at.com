[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "مدرس"
posted = "2008-06-07"
text = "مين اللى قال المدرس هو اللى أفسد التعليم<br />يا سادة موضوع الدروس الخصوصية هو ثمرة لشجرة مرة ولكن ليس هو الشجرة المرة<br />الوزارة عايزة كده<br />صدقونى والله أنا مش بادى دروس خصوصية ولكن لا الوم على الدروس الخصوصية<br />المدرس لا يملك فى الفصل أن يعاقب تلميذ ( باعتبار التلميذ سيده وسيد أبوه ) وياويله يا سواد ليله اللى يعمل لى فيها بطل ويفكر يعاقب تلميذ يبقى نهار ابوه اسود جزا ونقل من المدرسة ولو ابوه واصل يبقى نقل من المحافظة<br />يبقى على ايه يعاقب سيب الدنيا تقلب تعدل<br />تيجى بعد كده للمنهج<br />مفيش دلوقتى تفتيش على مستوى التلامذه المهم المدرس يصحح كراساته ويكمل ورقه ودفاتره والباقى مش مشكلة<br />انتوا عارفين ايه الباقى مستوى التلميذ يا سادة يعنى نهارك اسود ومنيل بستين نيلة لو جات لك لجنة ولقيتك عندك كشكول مش مصحح ولا تلميذ اتأخرت فى الشفوى بتاعه يبقى سنتك زى وشك<br />اما لو الورق كله مصحح وتمام والعيال ما يعرفوش الالف من كوز الدرة فأنت كده مدرس مثالى<br />صدقونى دا حكم الوزارة حاليا على المدرس يعنى مثلا أنا عندى فى الفصل 70 تلميذ الاحق عليهم ازاى فى التصحيح بعد الشرح فطبيعى هيكون فيه تقصير<br />دخل على أحد الموجهين ( فاهم الامور صح ) ولقى عندى تقصير فى التصحيح تصدقوا قاللى ايه :<br />قال انت تدخل الفصل تكتب الدرس وينقلوه التلامذة وتصححه ولو زاد فى الحصة وقت ابقى اشرح<br />بعد كده بتسالوا المدرسين ما بيشرحوش ليه<br />هو فيه حد له نفس للشرح دا أحنا فى وزارة فريدة من نوعها فهى الوزارة الوحيدة على مستوى الدنيا اللى بتكره موظفينها<br />انتوا عارفين اى لجنة تفتيش بتبدأ عملها فى أى مدرسة منين ؟ من الحمام يا سادة فلو صلح الحمام صلحت باقى المدرسة ولو أساء الحمام ساءت باقى المدرسة ( والله دا جد ماهو نكتة ولا حاجة )<br />فعلا اى لجنة بتبدأ تشوف الحمام أول حاجة وغاليا بيكون الحمام وبس<br />شوفتوا فى حياتكم وزارة بتقيم عملها من الحمام<br />أهو دا اللى خلا عيشتنا ......."
archived = "2010-03-14"
