text = "السلام عليكم ورحمة الله وبركاته-<br />بعد تقديم وافر التحية:<br />أعرض على سيادتكم الآتي:<br />إنني حاصل على دبلوم معلمين1978 وحصلت على المركز الأول على محافظة السويس<br />و حاصل على بكالوريوس علوم وتربيةعام1992 جامعة قناة السويس<br />ونظرا لتفوقي وإخلاصي في العمل تم ترشيحي للعمل بمدارس خاصة بالسويس لمدة 5سنوات<br />ثم عملت موجهآ ثم ثم تم تكليفي بالعمل مدير مدرسة . ولسبب تسجيل اسمي مرتين وبوظيفتين<br />مختلفتين ظهرت النتيجة مخالفة تماما مع العلم باننى قمت بالإجابة الموفقة على الاختبارات الثلاثة<br />فأرجو تصحيح نتيجتي للأننى أصابني الإحباط واليأس i"
