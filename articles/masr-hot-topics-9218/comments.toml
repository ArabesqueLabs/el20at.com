order = 0
subject = "المدرسون افسدوا التعليم لصالحهم الخاص علشان الدروس"
author = "مصرى"
posted = "2008-05-31"
text = "ما هى اسباب انهيار التعليم فى مصر ؟<br />العامل الرئيسى هو المدرس وادارة المدرسة<br />زمان كان المدرس بيحضر فى المدرسة من السابعة صباحا وحتى الثالثة ظهرا ميعاد دوام ثابت سواء عندة حصص او معندهوش<br />دلوقتى تلاقى المدرسة ف6اضية والمدرس بييجى من البيت على حصتة ويجوز ان حصتة تبقى اخر حصة فى اليوم الدراسى فيأتى الى المرسة الساعة واحدة ظهرا ليروح واحدة ونص<br />المدرس بييجى المدرسة مهدود الحيل من السهر فى الدروس الخصوصية والمجهود القاتل اللى بيبذلة فى الدروس وبالتالى بيدخل الحصة ويصرخ فى وش العيال كل واحد يطلع الكتاب ويفتحة على صفحة كذا<br />مفيش تعليم<br />لان مفيش مدرسين بمعنى كلمة مدرسين وحصة وشرح ونتيجة وموجة وناظر بيتابع ويقيم ويوجة ويرشد<br />هتقولى ضعف مرتباتهم<br />هقول لك هل هم وحدهم اللى مرتباتهم ضعيفة والا كل موظفى الدولة<br />لابد من وقفة لانقاذ العملية التعليمية<br />المدرس اللى نتيجة الفصل بتاعة تطلع ضعيفة يتفضل يروح مع السلامة وغيرة يتعين<br />احنا بقينا فى مؤخرة الدول العربية فى مجال التعليم<br />لا بد من الحزم مع المدرسين<br />المحاسبة على نتيجة التعليم فى الصف والرجوع الى الامتحانات الموحدة للمدارس لتقييم الجميع على اسس واحدة<br />كفاية انهيار"
archived = "2010-03-14"
