subject = "حلوان"
author = "نوشة"
text = "وضع الصورة على الايميل او الفايس بوك امر محدد من زمان ان اجابته لا.... احنا مهما يكن بنات فالتعامل يجب ان يكون بحذر حد يقولى لو وضعت صورتى هستفاد ايه او غيرى هيستفاد ايه ...... احكى لكم كنت بكلم شخص على النت وكان يطلب منى انى اضع صورتى وكان يلح ولما اصريت مسح الايميل بتاعى ولم يعد يكلمنى"
archived = "2008-09-19"
