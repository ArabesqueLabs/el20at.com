text = ":-? ليه الراجل ده علطول متخلف ؟؟؟ في رأي ان كل واحد حر يحتفل باللي عايز يحتفل بيه و الكريسماس مش هايقدم ولا هايأخر حاجه في دين الواحد و راس السنه لازم كلنا نحتفل بيها عشان دي سنه جديده جايه على العالم و كل واحد المفروض يستقبلها كويس ويديها اهميه لانها سنه جديده عليه ممكن يحقق فيها حاجه .. انا من ناحيتي (كمسيحي مصري ) في المولد النبوي بجيب حلويات المولد و في عيد الفطر بنعمل كحك .. ده مش هايقلل مني حاجه بالعكس ده يذودني ... و برضه لو المسلم جاب شجره و زعبوطين و زماره .. معتقدش ان ده يزعل ربنا في حاجه :-)"
