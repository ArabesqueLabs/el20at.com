posted = "2008-06-04"
text = "اول شرط من شروط الزواج السني الذي سنه سيدنا محمد صلى الله عليه وسلم<br />الاعلام والاشهار<br />يعني لازم الدنيا كلها تعرف ان فلان تزوج فلانه على سنه الله ورسوله<br />واوعوا تصدقوا حد قالكم غير كده حتى او كان اعتى علماء الدين<br />اول ركن من اركان الزواج السني الاعلام والاشهار للدنيا كلها<br />لا زواج سري في سنة رسول الله صلى الله عليه وسلم<br />والنبي محميد صلى الله عليه وسلم عاش 23 سنه في حياة الدعوة الاسلامية ما حصلش فيها زواج المسيار دا ابدا على حد علمي"
