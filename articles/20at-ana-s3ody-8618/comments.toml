[[comments]]
order = 2
subject = "أين مؤسسات الدولة في حماية شبابنا"
author = "رامز عباس"
posted = "2008-06-02"
text = "والله لا نقبل بمثل هذا الوضع المأسوى كيف أقبل كأنسان مسلم وارتضي ان يأتي شخص لمنزلنا تحت مسمي المسيار<br />او العرفي لمضاجعة اختي وهذة هي نيه ولنتفرض وهذا مستحيل ان المسيار له ظوابط عن اهل الحرمين الشريفين العزيزين<br />ماذا اذا جاء ابناء لهذا الزواج الغريب الهئية فلمن ينسبون ولمن يصرف ويتحمل مصاريفهم ونفقاتهم فلنتق الله الذى خالفناه<br />فسلط علينا ارازل القوم بني صهيون<br />ايها الاخوة العرب والمسلمون<br />ان مؤسسات الدولة يجب ان تتكفل بحمايتنا ولا تكون سندا للحرام مثل هئية الامر بالمنكر والنهي عن المعروف بالسعودية<br />شباب الاسلام والعرب لكم الله فتحروا الحلال الطيب ونسأل الله ان يقينا شر أنفسنا رامز عباس"
archived = "2010-03-14"
