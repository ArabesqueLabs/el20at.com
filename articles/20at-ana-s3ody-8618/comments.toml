[[comments]]
order = 1
subject = "نحن لسنا ما يجعلون السماء تفخر بتطبيقهم لصحيح الدي"
author = "رامز عباس"
posted = "2008-06-02"
text = "أيه دة معقولة والسعودية معقل خروج الرسالة النبوية للعالم هي اللي بتعمل كدة معقولة هي خلاص<br />البنات والنساء النبي صلي الله عليه وسلم وصانا عليهم (لم يقل أستوصوا بالناس خيرا) اين ذلك<br />جواز المسيار بالسعودية او الفرند بوى بالمغرب وتونس او العرفي بمصر او المتعه بلبنان وسوريا وايران في حاله اعتبرها<br />دويلة اسلامية<br />لايصح ويحط من قيمة المرأة فلها النفقة والكسوة ولها ان نعلي من قيمتها امام العالمين المرأة هي مؤلفة الحب والحنان"
