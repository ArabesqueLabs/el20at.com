[[comments]]
order = 6
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-07-05"
text = "بسم الله الرحمن الرحيم / اخوتي الافاضل ارجو ان تمنحوني فرصة من وقتكم الثمين كي اطرح ما اعرفه عن زواج المسيار ووكل ما تمناه منكم ان تخرجوا عن روح التطرف والتعصب المذهبي وان نتحاكم الى العقل<br />/ ان زواج المسيار هو زواج شرعي ومن اهم فوائدة التي تعيد على الشباب هو عدم انحرافهم وان زواج المسيار ليس في الخليج فقط وليس في مذهبنافقط بل انه موجود في كل المذاهب الاسلامية فعند الشيعة الاثنى عشرية موجود ويطلق عليه الزواج المؤقت او المتعة وارج ان لاتتحسسوا من كلمة ابلمتعه فلا حياء في ابلدين وان اعتقد ةان الشيعة وهي احدى اهم المذاهب الاسلامية على حق لذا اخوتي علينا واقسم عليكم بالله ان لا تتجاهلوا موضوع زواج المسيار او المؤقت لانه حكم شرعي كما ارجو ان لاتنطوي عليكم اقاويل محدثي الفتن بين المسلمين فالشيعة هم اخوتنا في الله وهم يؤمنون بمحمد علية افضل الصلاة والسلام وصلاتهم صلاتنا وحجهم حجنا وصيامهم صيامنا واقول هذا والله على مااقول شهيد بان لافرق بيننا وبين الشيعة"
archived = "2010-03-14"
