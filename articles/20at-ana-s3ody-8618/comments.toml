subject = "جهل وتخلف"
author = "froo7aa"
posted = "2009-03-26"
text = "لو هو حلال يسموه زواج ويفكونا المسميات الي جابت الشبهه للاسلام واهله<br />بلا مسيار بلا خرط<br />الشيخ الي افتى بجواز المسيار اسالوه اذا يقبل يزوج اخته مسيار والا لاء ...<br />ومن متى الاسلام يقبل الاهانه للمرأه؟؟؟ والمعروف انه المسيار اكبر وقذر انواع الاهانات للمرأه<br />شروط الزواج الاشهار _ والزواج للاستقرار مايكون فيه نية طلاق لانه اذا نوى طلاق فهو باطل _ مايشترط عدم الخلفه<br />وللاسف هذي كلها ما اتوفرت في المسيار<br />يجي الشاب ويتزوج بالسر ويحط بنيته انه متى ما اتيسرت معه طلق البنت عشان يتزوج علناا بوحده ثانيه ويشرط على صاحبه المسيار ماتخلف ... اي انحطاط هذا وصلنا له!!!!!<br />مافيها شي انو الزوجه تيسر وتسهل للزوج لكن اتركوا هذا المسمى وخلو التنازلات الي تقدمها الزوجه من ضمن الزواج العادي<br />الي يؤيد هذا الموضوع يجاوب وبكل شجاعه<br />يقبل يزوج اخته مسيار ؟؟ وبهذي الطريقه الوقحه؟؟؟"
