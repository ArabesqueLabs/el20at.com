text = "الكارثة حين نهتم بالقواعد الشرعية الجافة وننسى روح الدين وغايات الشريعة ومقاصدها<br />فهل اصبحت الغاية هى ارضاء الغريزة الحيوانية<br />وهل يصح أن نطّوع الدين ليقبل أخطاءنا وعاداتنا السيئة ، فأصبحنا نتكلم عن كيفية جعل الحرام حلالا ، بدلا من أن نناقش كيف نجعل المجتمع ييسر الزواج ويتكافل لتكوين الأسر التي هى نواة المجتمع<br />وما الفرق بين زواج المسيار وما يحدث في الغرب ؟!!!!"
