subject = "الفاو والكاكاو والسح الدح امبو - ودلعنى يا جدع"
author = "مش فاهم"
posted = "2008-06-10"
text = "كرم جبر<br />دة يطلع اية<br />فاسوخة او زمارة<br />الفاو واحنا مالنا ومال الفاو<br />لسة بنتكلم عن المثتثمرين او بتعبير ادق المشترين<br />هو احنا عندنا اية فاضل ممكن نبيعة للمثتثمرين<br />مش شايف حاجة ممكن يطمع فيها الايطاليون بعد ما اشتروا غالبية مصانع الاسمنت"
