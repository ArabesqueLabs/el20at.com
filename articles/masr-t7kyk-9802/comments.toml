[[comments]]
order = 0
subject = "كم دولة فى العالم فيها اعتقالات"
author = "مجنون سوزى"
posted = "2008-08-05"
text = "ظن الدول اللى فيها اعتقالات هى كوريا الشمالية ومصر واليمن وسوريا<br />يعنى الدول بتاع التوريث<br />يعنى الدول المتخصصة فى الفقر وطوابير العيش<br />يعتقلوا الناس لية - علشان يخوفوا الشعب<br />واضح ان النظام اللى هو مرعوب من الشعب<br />بدليل انهم لما راحوا يقبضوا على حتة مجهول عاطل فى قرية مجهولة استخدموا عشرين سيارة ورتب وضباط وحاجة اخر مسخرة"
