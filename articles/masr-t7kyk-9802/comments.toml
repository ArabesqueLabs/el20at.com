[[comments]]
order = 2
subject = "السجن شيء اساسي في حياة السياسيين وخخطوة مهمة للصع"
author = "مش ضروري"
posted = "2008-08-05"
text = "معتقلين فرحانين<br />ازاي الواحد يبقى مسجون وسايب اسرة ممكن تكون زوجة واولاد ويبقى فرحان وبيضحك على النحو الثابت بالصورة<br />يا جماعة السجون والمعتقلات دي سياسة والمعتقلين سياسيين وافضل حاجه للسياسي اللي عايز يصعد سياسيا هو السجن والمعتقل<br />نلسون مانديلا اتسجن 27 سنه وخرج من السجن على كرسي الرئاسة<br />واتوقع والله اعلم ان خيرت الشاطر هو رئيس مصر القادم وحيخرج من السجن على كرسي الرئاسة<br />السجن شيء اساسي في حياة لا مؤاخذة الاخوان المسلمين<br />زمان انا كنت بصلي الجمعة عند الشيخ عبدالمتعال الجابري (راجل عظيم رحمة الله عليه) في السبعينيات وكان الراجل طول فترة خطبه التي دامت حوالي خمس سنوات بيشرح قصة سيدنا يوسف<br />وباختصار سيدنا يوسف حكم مصر واتعرض ايضا للدخول الى السجن مرة واثنين وخرج من السجن على كرسي الرئاسة<br />على النحو الثابت في قصة سيدنا يوسف"
archived = "2010-03-14"
capture_url = ""

[[comments]]
