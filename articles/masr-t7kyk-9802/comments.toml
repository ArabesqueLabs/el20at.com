[[comments]]
order = 4
subject = "إيه ياعم محمد؟ده اسمه ايه كلام كده؟"
author = "محمد السيد"
posted = "2008-08-07"
text = "لو هو الشرقاوي اللي كان معتقل معانا في مظاهرات القضاة... وجاي دلوقتي يقول علينا كده .. يبقي فيه مشكلة بقي؟؟<br />وتشهد علينا زانزانة الجنائيين اللي نقلوا فيها بعض الاخوان مع بعض معتقلين من كفاية ...<br />دي كانت عشرة ياعم محمد ...في ايه؟<br />والله الدنيا دي غريبة .."
archived = "2010-03-14"
