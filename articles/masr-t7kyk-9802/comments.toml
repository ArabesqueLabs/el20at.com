subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-08-07"
text = "مواقف فعلا طريفة بتهون على المعتقلين<br />لكن لى ملاحظة على كلام محمد الشرقاوى ( يسارى )<br />عمر ما الإخوان كفروا من نطق بالشهادتين .. مش دى شغلتهم .. هم دعاه إلى الله وليسوا مكفرين<br />أكيد انت كنت معتقل مع حد غير الاخوان"
