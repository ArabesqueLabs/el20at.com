text = "فليكن((((((( الـــرابــع مــن مـايــــو )))))))))يوم الثأر من الأوغاد…الذين عاثو فى البلاد ،واكثرو فيها الفساد… فليكن يوم عذاب عليهم جميعا… وليكن ذلك بدون تخريب …لنثبت لهم إننا لا نريد إلا هم…ولا للتخريب … لأنه بيضر مصالح ناس غلابة زينا …ولأن الأوغاد الكبار مش عبط للدرجة دي…دول بيحسبوها كويس كتير.. فلوسهم مش في وسطنا.. اللي في وسطنا أدوات بيجمعوا بيها الفلوس.. ويمصو بيها دم الغلابة …وبلاش كمان نضرب العسكري الجاهل الغلبان.. اللي بياخد علي قفاه علي الفاضي وعلي المليان ..لأن ده مغلوب علي أمره وأبن فلاح بسيط وعامل أبسط ..وأخويا وأخوك.. واللي عايزين ننتقم منهم بجد .. هما زبانية جهنم الحرامية الصغيرين.. اللي هيبقوا في يوم وزراء ومحافظين أمثال بعض الضباط ولاد…ألخ .. والحيتان الكبار.. جهابزة النظام الفاسد … ورأس الأفعي… وحزبه الملعون… ونجله المكلوم قريبا باذن الله… وللعلم الناس دى أجبن ما يكون فلنتكاتف جميعا ضد هؤلاء المرتزقة ..نحن مصــــــــــــر وليس هم ..فلنستعد للــرابع مــن مايـــو القــادم …فلنثبت للجميع إننا شباب متحضر نعرف عدونا جيدا ..وليس غيره …إلي الرابع من مايو من أجل إســـــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــراء"
