text = "إسراء عبد الفتاح.. عمرها 28 عاما، حاصلة على ليسانس الألسن،<br />وطبعا ما فيش لا شغل ولا جواز زيها زي اي شاب فلازم تفكر في حل للمشكلة دي<br />وفكرت اسراء ولقت الحل ولعبت لعبتها وضربت ضربتها واشتهرت واصبحت مشهوره اكتر من عمر خالد والدنيا حتمطر عليها فلوس مبروك يا اسراء يا حبيبتي وما تنسيناش في حته من التورته<br />إنتخبوا إسراء عبد الفتاح !!!يؤيدون ترشيح إسراء عبد الفتاح لرئاسة الجمهورية 2011 ! … إسراء عبد الفتاح زعيمة من رحم أكبر أزمة عاشتها مصر : أزمة سبعة وعشرين سنة نكد وبؤس ومصادرة وإحتكار …<br />samyharak.maktoobblog.com/938480/إنتخبوا_إسراء_ع بد_الفتاح_!!! - 48k - نسخة مخبأة - صفحات مشابهة"
