[[comments]]
order = 13
subject = "المواطنة المفقودة"
author = "اسامه صلاح"
text = "السلام عليكم ورحمة الله وبركاته<br />مصر تحتاج لاحياء مفهوم المواطنة الصحيح واعادة تاهيل وتنشيئة الشعب ليكتسبوا الشعور بالمواطنة المفقودة.<br />يمكن مصر او بالتحديد المواطن المصري زمان كان فقير بس كان عنده آآمل سهلة التحقيق ليكون من الاغنياء ويزرع ارض ويبني بيت او حتي يفتح مشروع صغير او دكان وكان تحقيق الامن يتم اولا بواسطة صحبه وجاره الامين وعسكري الدرك الي بيلف الحارة والشارع علي رجلية جايز يكون جاهل بس عارف هو بيعمل ايه وعارف ان هدفه الاساسي حماية امن الغلبان وبتاع الفجل واولاد الشوارع من بطش الغني والفتوة جايز كان بيخاف منهم بس عمره ما ساب وجبه علشان خاطر خمسة جنية.<br />دلوقت مصر بشهادة مسؤليها في الداخلية ومجلس الشعب والشوري والحكومة انفسهم بيتبروا من هذا الجزء غير الصغير من الشعب (المهمش) وبيعتبروهم (غوغاء - شرزمة - بلطجية - مش مصريين) وبيتهموهم بعدم الانتماء او العمالة وهذا عن لسان بعضهم في العاشرة مساء علي الهواء اثناء مناقشة احداث المحلة ) وبيحملوهم مسؤلية الشغب في طنطا , لم يسأل هؤلاء المسؤلين انفسهم من هو السبب او ما هي العوامل التي افرزت تلك الغوغاء ؟ لم يسألوا انفسهم ماذا قدموا من خدمات ومساعدات وتأهيل ورعاية لتلك الغوغاء من خلال مناصبهم ومسؤلياتهم ؟ علي سبيل المثال وليس الحصر<br />رجال الدخلية ماذا فعلوا لاعادة تأهيل هؤلاء البلطجية (المسجلين خطر ) داخل السجون ماذا فعلوا للسيطرة علي سلوكهم بعد الافراج عنهم لضمان عدم اساءتهم للمجتمع ؟ هم فقط اكتفوا بتسجيلهم في سجلات امنية وتركوهم في تجمعاتهم المشبوهه (والحجة طبعا نقص الامكانيات وعدم الاختصاص او واحنا هنعملوهم ايه هنربيهم من جديد) نعم ربوهم من جديد تربية سليمة واعيدوا تأهيلهم والسيطرة علي سلوكهم ومساعدتهم لنفع انفسه والمجتمع , والا تكونوا فشلتم في مهامكم الاجتماعية ودوركم في اكساب المواطن مفهوم المواطنة.<br />اولاد الشوارع من هو المسؤل عنهم !!! دخلية - شؤن اجتماعية – مجتمع- اصحاب القلوب الرحيمة؟ محدش عارف!<br />كيف يطالب المسؤلين والنواب اي فرد برعاية المجتمع والمحافظة عليه. في نفس الوقت الذي لا يلقي هذا الفرد من المجتمع الا (الطناش -اهملة - ولم يقدم له الا الرمي في الحجز من حين لاخر) هذا بالنسبة للمهمشين او البلطجية<br />اما الجزء اللاكبر من الشعب فما هي دوافع ارتباطة بالمجتمع<br />امن ! نادرا ما تجد فرد احتاج مساعدة امنية ووصلت له في موعدها وبفاعلية انسانية بدون تليفون او كارت واسطة<br />صحة! هات لي واحد (موظف-عامل-معاش-منطوي)لم يعاني من المستشفيات والعلاج<br />توفيرالعمل ! هات لي واحد بيفكر يعمل مشروع او في المستقبل ويجد فرصة بدون معوقات وبيروقراطية منفرة<br />زراعة! الارض المستصلحة بتتاخد من الي عرقوا فيها علشان اخرون والارض الصالحة توزع علي المستثمرين والبور توزع علي شباب الخريجين وبعد اصلاحها تصادر نتيجة للديون<br />تعليم ! الوزير نفسه اتهمه بالفشل والخريجين لا تقبل شهادتهم للعمل بالخارج او في فرصة محترمة بالداخل.<br />توفير الغذاء! المجاعة قادمة يراها الجميع عدا (النواب) والكل يبحث عن الغذاء بشق الانفس والبعض في الزبالة<br />حلول تبعث الامل ! لا توجد حلول مطروحة الا ( الكلام المنظوم) معاد من نفس المصادر مع تكرار القسم علي الوفاء بالعهود<br />فساد ! لا توجد بشائر لمحاربة الفساد وحقيقة الامر لا سبيل لمحاربة الفساد لان النواب يطالبون الشعب بالبداء من انفسهم وهذا مستحيل مستحيل مستحيل عارف ليه,للاتي<br />لان المواطن (بالاسم) مجبر علي ممارسة الفساد وليس محب له ولا باختياره ,فلابد من دفع رشوة للحصول علي الحق في كل المجالات ومحاولة الحصول علي الحق بدون رشوة او ممارسة نوع من انواع الفساد تدخل في مجال القضاء والتقاضي والانتظار بالسنين للحكم في موضوع قد يكون تافهاو لا يحتمل الانتظارولماذ الانتظار طالما ممكن ان ينتهي الموضوع فورا بعشرة جنية( دخول كهرباء -دخول مدارس نقل من مدارس-علاج وعمليات - فتح نشاط تجاري - تصريح لاي حاجة - خروج كريم من الجمرك-...الخ) المواطن مجبر علي كسر اشارة المرور لانه لا يعلم هل الاشارة شغاله ولا عاطلة من خبرته الطويلة في المرور حتي عسكري المرور غير علامات المرور خلي الاخضر احمر والاحمر اخضر وما فيش اصفر.<br />المواطن مجبر علي فقد الثقة بالاخرين لان وصل الامانه لم يعد له قيمة حتي ولو مبصوم عليه ورد الحق اذا اترد يكون بعد سنتين في المحكمة يعني لو صحبك ولا اخوك نصب عليك وهو شبعان (طمع) وانت لا تملك غير هذا المال المنصوب فيه علي ( يبقي خربت لاعلاج طارئ ولازواج للبنات ولا تعليم اولاد ومن ثم انضمام لاولاد الشوارع) ولا منصف لك فالقانون لا يحمي المغفلين وفي هذا العصر يسميهم اهل الفتوي الطماعين .<br />حتي تعرض المواطن لبلطجة في الشارع امام ضابط المرور الذي لا يتدخل لانه غير مكلف بالامن العام وانتظاره لوصول النجدة بعد نصف ساعة علي الاقل من البهدلة حلها الامثل التنازل عن حقه لهذا البلطجي او ابن الزوات المدلع وعوضه علي الله.<br />اعدام المجتمع التوربيني وجرمه ولم يجرم من قام علي تربية التوربيني وتنشيئته الاجتماعية والمسؤل عنه فلا يعقل ان يكون هناك مواطن في بلد خارج نطاق المسؤلية(مسؤلية مجتمع وليس اسرة) لم يجرم المجتمع من تركه يسعي في الارض فساد طوال حياته, واتهمه النواب الافاضل بانه لادين له ولا انسانية والحقيقة انه انسان مظلوم ومجني عليه من المجتمع فلم يقدم له احد ولم يعلمه احد مفهوم الدين او مفهوم الانسانية ولم يساعده احد لاشباع رغباته الانسانية من مأكل وملبس وغريزة بطريقة انسانية شرعية ولم يجد من يوجهه بالحسني او بالقوة ان استدعي الامر.<br />وهكذا فهولاء الغوغاء مظلومين لان لا احد قدم لهم المساعدة والتعليم والتنشيئة السليمة ليكونوا مواطنين شرفاء بل الجميع يطالبونهم بالالتزام بالسلوك الصالح دون تقديم يد العون لهم.<br />لولا حسن حظنا لكنت وانت وهو توربيني او اولاد شوارع . ولولا الاهمال لظهر من تلك القوة البشرية المهمشة قدرات قد تفوق قدرات من يشمئز منهم ويسميهم كما يحلوا له لظهر منهم علماء وقادة واطباء اكثر ذكاء بكثير ممن لا يعلمون او يقدرون معني الانسان والقدرة البشرية<br />واخيرا اعلم ان رد اي نائب او مسؤؤل سيكون كالاتي ( ده كلام مش صحيح يعني ايه هو احنا حندخل كل بيت نربي الشعب وفين مسؤلية الاسرة و.. و....) ارد عليهم واقول لا<br />قم باعداد وتنفيذ برنامج تجميع واعادة تأهيل وتوزيع ومتابعة وقدم لهم المساعدة بانشاء مشروعات خاصة بهم او علمهم الزراعة وسلمهم ارض مصر الصحراء ليزرعوها بدل من المستثمرين الكبار,ايضا ان هؤلاء الغوغاء اما افراد لا اسر لهم واما اسر لا عائل او وظيفة او تعليم لهم فالافضل توفير العلاج والغذاء والتعليم والتوظيف لهم او لنصمت ولا نتهمهم بعدم الوطنية لان المصطلح الاكثر تعبير هو ( انسان فاقد المواطنة)<br />اما باقي اسر الشعب فهي لا تحتاج لمن يعيلها او يربي ابنائها ولكنهم يحتاجون من يترك لهم الفرصة والوقت للاعتناء باولادهم بدلا من ضياع الوقت في البحث عن حقوقهم فكلنا يبحث عن حقه وفقط وان لم يكن هنا فنبحث هناك وليس منا ما ليس له حق ضائع في العديد من المجالات.<br />اصلحوا التعليم واسرعو ا اجراءات رد الحقوق علي كل المستويات واسرعوا اجراءات التأمين وطلب الحماية والتدخل السريع للحماية الشخصية لاي المواطن انسان(شرطة- اسعاف- اطفاء) وحولوا الموارد الطبيعية الي منتجات نهائية وضاعفوا الرقعة الزراعية وفعلوا القانون لانتظام المرور واستعادة الاخلاق العامة بالشارع وحولوا السجون الي معاهد وجامعات لاعادة التأهيل و حلوا مشاكل الغوغاء اولا وقبل كل شيئ واصلحوا من القاعدة الي القمة ومن ثم احكموا الرقابة وامنعوا فساد (كل الموظفين في الاجهزة الخدمية الي هم من الشعب برده) لاعلاء شأن الخدمة المقدمة هذا ان اردتم استرداد روح المواطنة المفقودة والاصلاح الحقيقي للبلاد.<br />وشكرا<br />مواطن بشهادة الميلاد<br />واخيرا فلنفرج عن هؤلاء الغوغاء من السجون ان كنا نبحث عن رد الحقوق والعدل والمستقبل"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073453/http://masr.20at.com:80/newArticle.php?sid=15153"

[[comments]]
order = 14
subject = "بالمقلوب والمقارنة واضحة"
author = "اسامه صلاح"
text = "البلطجية والغوغاء حجة ومبرر لكل من يريد ان يتنصل من اخطاءه او يرمي بها علي القدر والمجهول وكأننا نظيفي اليد وغير مشاركين في تكوين العشوائيات والبلطجية والغوغاء عبر خمسون سنه او انهم زرع شيطاني نبت في جنان الارض !<br />ومع ذلك ماذا فعل هولاء الغوغاء (المواطنون اصحاب البلد) كسروا نهبوا اضروا بالمال العام (كم الخسائر) مليون عشرة مئة مليون ( خطاء كبير لا شك ولكن مسبب وله دافع قد يكون الغضب او التسيب)<br />لنقارن الخسائر الناتجة عن حالة الغضب بالخسائر الناتجة عن حالة الطمع لصفوة القوم (الغير بلطجية والغير غوغاء) والذين تسببوا فيها بدون اي دافع يخفف من جرمهم<br />خسائر (تعليم-اقتصاد- تصدير -استيراد-زراعة-صناعة -ارواح وعبارات وقطارات-مرور-نهب - سرقة- عمولات -فساد -احتكار -رشاوي - قروض - نصب...الخ وطبعا عندكم الاحصائيات)<br />كم مليار عشرة مليار مئة مليار ولا مئات المليارات (بسبب الفساد)<br />الغوغاء والبلطجية يحاكمون ويسجنون ويتهمون بالخيانه ويضافوا الي جموع العشوائيات واولاد الشوارع ويضيع مستقبلهم واحلامهم , اما الفاسدين فلهم قوانين يحميهم ومحاميون ونواب شعب يدافعون عنهم وفوق كل هذا يتمتعون ويحققون احلامهم العير مشروعة دون يوم واحد حجز ( برجاء الايعترض احد ويقول ان هذه قاعدة شاذة وان كل الفاسدين في السجون والمتسببون في ضياع المال العام وفشل المشروعات يحاسبون)<br />فما الفرق بين هذا وذاك لنقارن ونحسب بالعدل و القيمة والدافع للجريمة والخطورة والفائدة ولا ننسي ان ما حدث في المحلة ايقظ كثير من الشعب النائم (وهذه الفائدة لا تقدر بثمن بالمقارنة بالخسائر )ولا ننسي ايضا ان كل تجربة تحتوي علي قدر من المخاطرة والتكلفة<br />من منهم اخطر علي الامن القومي واستقرار البلاد ليوضع خلف القضبان ولكن للاسف الحال مقلوب"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073453/http://masr.20at.com:80/newArticle.php?sid=15153"

[[comments]]
order = 15
subject = "المصيبة والكارثة"
author = "اسامه صلاح"
text = "المصيبة الحقيقية والكارثة الكبري ان يحدث هذا باوامر القضاء والنيابة والنائب العام والهيئة القضائية كلها مشتركة في هذا الفعل وهذه الفتوي وهذا المفهوم والمبداء المقلوب ومعني هذا ان اخر خط دفاعي عن حقوق الشعب والعدل قد سقط او اسقط نفسه او خدعها عندما غابت عن ضمائرهم الحقيقة الواضحة كالشمس<br />وبشلل القضاء وعدم قدرتهم تحقيق العدل للعامة والغوغاء تنهار كل الامال المستقبلية في الاصلاح<br />وسؤال للنائب العام هل لو كانت اسراء ابنتك وغلطة ودخلت النت واتكلمت في السياسة كنت سوف تسمح بحجزها واهانة عائلتها وفضحها علي رؤؤس الاشهاد ووضعها مع المجرمين والمشبوهيين و.... اكيد كان الموقف سيختلف<br />فيا رجال العدل والقضاء اعتبروا كل فتاة او شاب احدي اولادكم وعاملوهم بالمثل ( واكيد محدش فيهم هيهرب بره مصر لان معهمش ثمن الطيارة كما انهم لم يستولوا علي اموال البنوك ولم ينصبوا علي احد ولم يرتشوا )<br />ولنكتفي باستدعائهم الي النيابة بطريقة لائقة حتي يصدر حكم بادانتهم وساعتها اعملوا الي انتوا عايزينه<br />وامنعوا العقاب عن طريق الضغط النفسي والسلطة التنفيذية والانتظار بالساعات حتي ياتي الدور في التحقيق والكلام الفاضي اياه هذه هي مهمتكم الحقيقية (روح القانون وسلطة القضاء المطلقة والعدل فوق القانون)<br />ارجوا ان تكون الرسالة وصلت لقضاة مصر الشرفاء عن طريق ضمائرهم وليس عن طريق التعليمات ونص القانون"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073453/http://masr.20at.com:80/newArticle.php?sid=15153"

[[comments]]
order = 16
subject = "ربنا يفك سجنها ...ورسالة للاستاذ الصحفى"
author = "عضو بحزب الغد"
text = "انا متعاطف مع الاخت اسراء جداا وربنا يفك سجنها ... بس الاستاذ احمد الهوارى كاتب انها امينة التثقيف بحزب الغد<br />انا عضو بحزب الغد ولا اعرفها وبعدين سياتك تقصد انهى حزب بمعنى الغد بتاع ايمن نور ولا الغد بتاع موسى مصطفى موسى<br />اكيد هى غد ايمن نور وهو خلاص انتهى امرة لا اقصد ايمن نور نفسة ربنا يفك سجنة ايضا ولكن النزاع حسم واصبح موسى مصطفى هو رئيس الحزب الشرعى ومبقاش فى غد اخر .... وشكرا هذا للتوضيح فقط"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073453/http://masr.20at.com:80/newArticle.php?sid=15153"

[[comments]]
order = 17
subject = "اسراء عبد الفتاح بنت مصر وليست ابنة تمرجية بريطانية"
author = "مصرى"
text = "يا اسراء انت بنت الارض الطيبة<br />بنت الطهارة والشرف والنزاهة والوطنية انت بنت مصر<br />هؤلاء الذين يروعون الفتيات فى الفجر ويقتحمون غرف نوم السيدات من اجل ان يصادروا جهاز كمبيوتر ويسرقون الاموال التى فى البيت جهاز امن النظام الفاشل<br />قالوا لابو جهل ذات مرة<br />لماذا لا تقتحم بيت محمد ليلا وتريح العرب منة<br />قال ابو جهل<br />اتريدون ان تقول عنى العرب انى روعت بنات محمد<br />هذا النظام الذى يروع البنات فى انصاف الليالى وجب الكفاح ضدة لانة يستخدم الرصاص المطاطى وقنابل الدخان تماما زى النظام الاسرائيلى مع الفلسطنيين<br />اطمئنى يا اسراء ف5انت بنت مصرية بألف رجل مثل القادمين من كفر البراغيت"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073453/http://masr.20at.com:80/newArticle.php?sid=15153"

