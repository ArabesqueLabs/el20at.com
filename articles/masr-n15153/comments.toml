capture_url = "https://web.archive.org/web/20080412073453/http://masr.20at.com:80/newArticle.php?sid=15153"

[[comments]]
order = 25
subject = "الى الاستاذ اللي فوق ها ها"
author = "بابا"
text = "انا ما غلطش في حاجه<br />بعد اغتيال السادات كل المحللين والمفكرين اجمعوا على ان اسرائيل هي التي قتلت السادات<br />وبعد ضرب البرجين كل المحللين والمفكرين اجمعوا على ان اسرائيل هي التي ضربت البرجين<br />ما هو اصل مستحيل واحد عايش في جبل في افغانستان يقدر ينظم عملية تعجز عن تنظيمها دولة معادية لامريكا<br />وطبعا اضراب على هذا المستوى العال من التنظيم لم تشهده مصر ولا اي دولة عربية من قبل لا يمكن ان تكون واحدة بتجلها العادة الشهرية كل شهر ولما بتركب الاتوبيس الرجالة بيتحرشوا بيها لا يمكن تقدر تنظم حاجه زي دي<br />هذا رايي<br />وبعدين الدين النصيحة<br />انت عارف اسرائيل دي ناجحه ليه لانهم بيسمعوا كلام الكبار يعني اليهود الصغيرين بيسمعوا كلام اليهود الكبار المكحكحين العواجيز بياخدوا منهم الخلاصة<br />اما احنا هنا في بلادها العربية واحدة صايعة مش لاقية شغل ولا لاقية تتجوز رشحناها لرئاسة الجمهورية"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073453/http://masr.20at.com:80/newArticle.php?sid=15153"

