[[comments]]
order = 39
subject = ""
author = "منقول"
posted = "2008-04-28"
text = "إسراء عبد الفتاح : لم أعلن توبتي<br />Submitted by EDITOR1 on السبت, 26/04/2008 - 01:44.<br />لم أرتكب جرما حتى أعلن عن توبتي عنه\".. بهذه العبارة القاطعة القوية ردت إسراء عبد الفتاح الشهيرة بفتاة (الفيس بوك) في تصريحات خاصة لـ\"إسلام أون لاين.نت\" اليوم الجمعة على ما نقلته عنها بعض الصحف ووسائل الإعلام المصرية، بأنها أعلنت \"توبتها\".<br />وقالت إسراء: \"لم أرتكب جريمة أو ذنبا عندما عبرت عن رأيي عبر مجموعة (الفيس بوك) ودعوت إلى إضراب سلمي في 6 أبريل.. لقد دفعت ثمن التعبير عن رأيي ضريبة قاسية كانت 18 يوما داخل السجن.. فهل يعقل أن أضع تعبيري عن رأيي موضع الجرم الذي يستوجب أن أعلن توبتي عنه.. المجرمون وحدهم يعلنون عن توبتهم.. وأنا لست مجرمة\".<br />وأردفت بنبرة يملؤها الأسى قائلة: \"لم أندم على فترة سجني.. ولكن شعرت اليوم بعد أن قالوا إني أعلنت (التوبة) بأن كل ما فعلته ضاع هباء\".<br />ونشرت صحيفة \"المصري اليوم\" في عددها الصادر اليوم الجمعة ما قالت إنه نقلا عن إسراء: \"لم أسمع عن إضراب 4 مايو.. ولن أسمع عنه.. ولم أشارك فيه.. فقد أعلنت التوبة\"، في صفحتها الأولى.<br />وحول ما نقلته الصحيفة عنها بخصوص إضراب 4 مايو قالت إسراء: \"لم أعرف بإضراب 4 مايو إلا بعد خروجي من السجن.. فالجرائد كانت ممنوعة عني داخل السجن.. وبالتالي لم أدع إليه أو أحذر منه.. وأنا لن أحجر علي أي فرصة للتعبير عن الرأي\".<br />وترى إسراء أن مبالغة بعض وسائل الإعلام في الحديث عما تقول إنه \"توبتها\" ربما يكون \"الغرض منه تخويف الشباب من المشاركة في إضراب 4 مايو\".<br />وواصلت إسراء قائلة: \"وسائل الإعلام لم تمنحني فرصة التنفيس عن مشاعري تجاه أهلي لحظة خروجي من السجن.. الذين لم أرهم منذ القبض عليّ.. فنقلوا عني بعض الكلمات التي قلتها لأهدئ من قلق أمي عليّ\".<br />ومضت تقول: \"من الطبيعي بنت في سني وبحكم طبيعتنا الشرقية تقول لأمها بعد خروجها من تجربة مريرة -هي السجن- ما يهدئ روعها.. لكني بالرغم من ذلك أؤكد إني لم أصرح لأي وسيلة إعلامية أني أعلنت (توبتي) أو ندمي على ما فعلت\".<br />وحول العودة إلى ممارسة نشاطها الإلكتروني أو عملها في حزب الغد (ليبرالي) قالت إسراء: \"هناك العديد من الشروط الأمنية التي أمليت علي عند خروجي، وأحتاج إلى بعض الوقت لأعيد ترتيب أوراقي، وأشعر بالهدوء والاستقرار النفسي وبعدها أقرر ماذا أنا فاعلة\". ولم تفصح عن الاشتراطات الأمنية التي قالت إنها أمليت عليها.<br />وتعمل \"إسراء\" منسقة موارد بشرية بإحدى الشركات الخاصة، ولم تكن تتوقع أن تنجح دعوتها لإضراب السادس من أبريل على موقع \"الفيس بوك\" الشهير في استقطاب 70 ألفا من جمهور الموقع الإلكتروني التفاعلي الأكثر شهرة في العالم.<br />وصباح يوم الإضراب اعتقلت إسراء من داخل إحدى المقاهي المواجهة لمقر عملها، وأمرت النيابة بحبسها 15 يوما على ذمة التحقيقات، ووجهت لها تهم التحريض على إضراب 6 أبريل وإثارة الشغب وحيازة المنشورات، قبل أن يتخذ النائب العام قرارا بالإفراج عنها بكفالة في 14 من أبريل الجاري، لكن السلطات لم تفرج عنها وصدر بحقها قرار اعتقال طبقا لقانون الطوارئ المعمول به في مصر منذ سنوات.<br />وتجري \"إسلام أون لاين.نت\" اليوم في تمام الساعة الخامسة بتوقيت مكة المكرمة، حوارا مباشرا مع إسرا، وتدعوكم للمشاركة بطرح أسئلتكم المختلفة عليها."
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725040700/http://www.20at.com:80/masr/t7kyk/8750.html"
