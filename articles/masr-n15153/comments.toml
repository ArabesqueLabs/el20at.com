subject = "الزهايمر والشذوذ الجنسى يحكمون مصر"
author = "برضة بغباوتة"
text = "قرارات الزهايمر لا تحل مشاكل متراكمة من 26 سنة<br />وبرضة واحد شاذ جنسيا مش هيحل<br />الامل فى الشباب اللى زى اسراء<br />الشباب الذين فقدوا مستقبلهم بسبب التخلف العقلى فى ادارة البلاد<br />وسينجحون<br />رغم غباء حزب المتخلف عقليا والاربعين حرامى"
