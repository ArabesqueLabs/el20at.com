subject = "عاطل عن العمل وجاهز لاى اضراب فى اى مكان وجاهز للسجن والاعتقال"
author = "عاطل عن العمل"
text = "العساكر ولاد الفلاحين والعمال الغلابة بيسلحوهم بعصاية ودرع علشان يضربوا بيها<br />انما زى ما شفنا فى المحلة اللى بيضرب بالرصاص الحى والرصاص المطاط وقنابل الدخان الضباط ولاد الكلب بتوع حراسة الكرسى<br />سيبوا العساكر فى حالها<br />اضربوا الضباط زبانية النظام وحماة الفساد وكلاب السلطة"
archived = "2008-04-12"
