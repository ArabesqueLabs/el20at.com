text = "صرح سيادة الرئيس حسنى مبارك ان محدودى الدخل فى عقلة وقلبة \\\"<br />والسؤال هو<br />لا ادرى لماذا محدودى الدخل ان يأكلوا ؟<br />عايزين ينهبوا<br />الناس فى عقلة وقلبة يبقى ياكلوا لية معندهمش دم عايزين ياكلوا وهم فى قلبة وفى عقلة<br />رخامة بقى"
