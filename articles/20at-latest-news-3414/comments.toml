posted = "2007-03-18"
text = "مش ملاحظين ان معظم الناس بتشغل بالها بحاجات ملهاش لازمة وانهم ممكن يحتاجوا وقتهم ده عشان يستفادوا بيه في الخير مالهم تامر حسني ولا غيرة اللي يغني تتر البرنامج ودلوقتي مهمو كل المطربين بيغنوا ديني وبعدين احنا منقدرش نحكم علي حد اذا كان وحش ولا حلو يمكن يكون تامر عند ربنا احسن مننا كلنا ويمكن يتغير ويبقا احسن انسان في الدنيا اتقوا الله في حكمكوا علي الناس وبعدين ماله عمرو خالد انسان محترم وقرب من الناس كلها ولا دايما اللي بيبقا معاه الحق ليه اعداء وناس حاقدة ومش ممكن يكون اللي بيتكلموا دول مسلمين ده انت هتسال يوم القيامة ماذا فعلت لدينك هترد تقول ايه هتقول انا قولت ان تامر مزور ومينفعش يكون قدوة وازاي يغني اغنية التتر وعمرو خالد مبيفهمش وبيتاجر بدينه اتقوا الله واتقوا يوما ترجعون فيه الي الله وميصحش تطلع من مسلم بحق الفاظ ميجبش انها تتقال كل كلمة بتقولها هتتحاسبوا عليها وفعلا اتمني من الله ان يهدينا جميعا ويهدي شباب المسلمين وكفاية اساءة للاسلام بقا وبصوا حولكم شوفوا المواضيع اللي محتاجة راي سليم ومحتاجة عقل فعلا احنا كده اثبتنا اننا منقدرش نطلع راي سليم ولا حكم سليم ولا عمرنا هنحرر القدس بارائكم الضايعة ده سبحانك اللهم وبحمدك استغفرك واتوب اليك"
