subject = "مووووووووووووووووووووووووتوااااااااااااااااااااااا"
author = "drsalah-hanie"
posted = "2007-03-14"
text = "أولا أنا أشك فى أن كل من قال الكلام السابق المهين مسلم فهناك من غير المسلمين من يرتادون موقع عشرينات بهدف تشتيت المسلمين وهذا ما لمسته بنفسى من خلال العديد من المواضيع السابقة.<br />ثانيا اقول لكل واحد مش عايز \"دين\" أحب أقول له \"موت بغيظك\" فالله متم نوره.<br />فعمرو خالد يقول : قال الله وقال رسول الله .<br />لو مش عاجبك إللى بيقوله يبقى إنت مش عاجبك الدين.<br />أنا أعرف إن الواحد يعترض على بعض أخطاء العلماء والدعاة _بحكمة وموعظة حسنة_ ولكن أن يعترض على شخص معين علشان بيتكلم فى الدين فأنصحك تروح تراجع نفسك الأول قبل ما تتكلم عن شخص أعتقد أن ما أضافه للإسلام أضعافا أضعاف ما قدمته أنت _إن كنت قد قدمت شيئا!!_.<br />وأذكر إخوانى المسلمين جميعا أن \"لحوم العلماء والدعاة مسمومة\" والكلام الهابط والاتهامات الباطلة والشتائم ليست من صفات المسلمين.<br />وأقول مرة أخرى لكل واحد غير مسلم ما بيسبش موضوع يخص المسلمين إلا ما بيدخل ويعلق تعليقات مفقوسة بهدف إرباك المسلمين وتفريقهم أقول لك وأنت تقرأ كلامى الآن وللمرة الألف :<br />\"مووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووت بغيظك\"<br />فالله متم نوره ولو كرهت أنت وأهلك أيها الحاقد على الاسلام ."
archived = "2010-03-14"
