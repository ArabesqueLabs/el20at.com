text = "الاسلام دين التسامح والتعايش ولاستاد عمرو خالد مغلطتش لانو حاول يهدي نفس تامر غلط ايوة بس ربنا وحدو الي حيحسبو وحيسمحو مش البشر.وانا مع لاستاد خالد لانو ياما علمنا مفيهاش حاجة لو تعامل مع حبيبنا تامر لانو احساسو عالي وطيب خلاص يجماعة بصو للشعوب الي بتتحارب وبتموت مش الانسان الي غلط وتاب. فوقو بقا ياعرب لامتى حتفضلو نيمين ومهتمين بحاجة تافهة اخوانكم بيموتو وانتم عمالين تتكلمو عن انسان حاول يساعد اخوه. مع احترامي للغير اتمنى لتامر الاستمرارية ولاستاد خالد وربنا يوفق كل من حاول يساعد اخوه المسلم. اختكم المغربية"
