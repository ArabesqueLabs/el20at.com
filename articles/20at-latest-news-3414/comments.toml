subject = "ضع عنوان التعليق"
author = "صاحب رأي"
posted = "2007-03-15"
text = "مش فاهم ..يعني انتو بقيتوا تتبعوا عمرو خالد بلا وعي للدرجة دي ؟ طيب سؤال بسيط ليه مخترش عمرو خالد واحد زس أحمد بو خاطر أو سامي يوسف او مسعود كارتس لغناء التتر ؟<br />ليه عمرو خالد صمم على رأيه في حين ان ناس كتير رفضت فكرة غناء تامر حسني ..وتامرحسني تحديدا لمشكلته الأخيرة في تزوير شهادته الجامعية و الهروب من الجيش ..يعني حتى مخترش واحد زي حمادة هلال اللي بدأ يلتزم في الشهور الاخيرة و يندم على اعماله اللي فيها رقص وموديلز<br />يعني سؤال بس عمرو خالد العظيييييم ده اختار تامر حسني تحديدا ليه ؟ هل تامر ندم على رقصه و أغانيه ؟ يا جماعة متربكوش الناس وتصدموهم ..الشباب لما التزموا بطلوا يسمعوا أغاني لتامر حسني و أمثاله<br />دلوقت عمرو خالد بيقول لهم برسالته دي اسمعوا الناس دول ..ده انا بحبهم<br />عمرو خالد اللي سلم بالايد (سلام باليد) على كل امرأة كانت في السفارة الامريكية في القاهرة ...أؤكدمرة أخرى سلم على كل سيدة و فتاة باليد في اثناء زيارته للسفارة الأمريكية ليؤكد أنه داعية مودرن ....وهو أيضا الذي أؤكد ما سمعته و رأيته حينما قال \"علشان منتكسفش لما تبقى ملتزم و ترفض تسلم على امرأة و تقول زي ما النبي (ص) قال أنا لا أصافح النساء\" تخيل لما تشوف المشهدين قدام عينيك يبقى تصدق ايه ولا تتبع ايه ؟<br />يا عالم احنا لا كفرة و لا ملحدين ..وبعدين بلاش السذاجة بتاعتكم دي ..قال لما منحبش عمرو خالد يبقى مبنحبش الدين ...اتقوا الله ونضفوا ودانكم و جربوا تسمعوا لمن هم غير عمرو خالد والله ساعتها هتعرفوا ان عمرو خالد فقير جدا في معلوماته"
archived = "2010-03-14"
capture_url = ""

