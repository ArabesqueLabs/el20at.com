subject = "؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
author = "واحد من الناس"
posted = "2007-03-15"
text = "أحب أسأل إحنى معترضين على تامر حسنى علشان شخصه واللا علشان الفن المبتذل إللى بيقدمه ؟؟<br />طبعا علشان فنه المبتذل.<br />طيب لما يبقى الراجل هيغنى أغنية هادفة يبقى حرام عليه!!!!!!!!!!!!!!!!!!!!!<br />يعنى هو مكتوب عليه يغنى أغانى هابطة ومبتذلة طوووووووووووول عمره..!!<br />أنا عايز أعرف ما هو وجه الاعتراض أن يغنى هذه الاغنية؟؟<br />يعنى عبد الحليم يبقى أجرم لنا غنى أغانى عن الكون وعن الله.<br />يبقى هشام عباس أذنب لما غنى أسماء الله الحسنى.<br />ف \"تامر\" ربنا يهديه مش هايغنى أغانى من بتاعته فى البرنامج ولكن هيغنى أغنية ذات هدف ومعنى فلم الاعتراض؟؟؟<br />طيب ما هو فيه أفلام تتحدث عن الصحابة وعن الاسلام والممثلين غير مسلمين , دا يعنى لو كان وجه الاعتراض إن إزاى تامر حسنى يغنى فى برنامج هادف زى برنامج الاستاذ عمرو!!<br />هذا مع إن تامر حسنى مسلم ولكن لنفترض جدلا أن الاستاذ عمرو أوكل مهمة غناء تلك الاغنية إلى شخص غير مسلم فما هو أيضا وجه الاعتراض؟؟<br />أم أن وجه الاعتراض هـــــــــــــو إنه مفيش وجه اعتراض أصلا وإنه هوه كده وأنا بأعترض وخلاص أو إن فيه البعض الذى يدعى أنه مسلم من اجل الوقيعة بين المسلمين...."
