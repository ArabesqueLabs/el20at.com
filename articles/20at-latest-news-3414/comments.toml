text = "الأخ محمد من اسكندرية بيقول ان تامر حسني مش هيقدم البرنامج مع عمرو خالد ..تامر بس هيغني اغنية التتر ..طيب طالما الحكاية كده ما نجيب هيفا ولا نانسي علىالأقل تطبطب وتدلع<br />أو شعبان عبد الرحيم ...ولا ايييييييييييييييييييييييييييييييه؟<br />بجد والله لو على رأيك ..ليه ميجبش حد من دول ؟ يعني اظن باينة اوي ومفقوسة أوي انه بيعمل كده مكسب مش اكتر<br />معلش انتو متعاملتوش مع عمرو خالد مباشرة علشان كده متعرفهوش صح<br />والله انتو أجدع من بتوع لجنة السياسيات و أعضاء الحزب الوطني اللي بيرفعوا ايديهم وهما مغمضين"
