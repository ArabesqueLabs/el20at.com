subject = "لا حول ولا قوة الا بالله"
author = "مسلمه حزينه"
posted = "2007-09-27"
text = "انا كل ما اقرأ موضوع عن عمرو خالد الاقي ناس بتشتم و بالفاظ وحشه جدا واغلبهم تحس انه عمره ما سمع محاضره واحده له يعني بيتكلم بجهل و كمان اسلوب غير مهذب و صوره شيئة جداجدا للاسلام. والله حرام عليكم اتقوا الله وهو اكيد اكيد عند ربنا احسن منكم لانه علي الاقل مهذب ومحترم ده غير انه بيدعوا الي الله و اتحدي حد يقوللي انه خرج في حلقه وقال كلام يغضب ربنا زي اللي انتوا بتقولوه و بالنسبه لتامر عادي ده انسان مسلم ومحدش في الدنيا له الحق يحكم عليه انا عموما مش بحبه بس دي كلمة حق و للاخت متسائلة تامر لم يمثل اي افلام مع مني زكي ولا مسرحيات اطلاقا ثم كل المسلمين كانوا كفار قبل اسلامهم و بعدها منهم من كان اماما للمسلمين لم يقل احدا انه لما بشوفه بافتكر انه كان كافر بالعكس انتي لما تسمعي اللتر المفروض تقولي ربنا يهديه و بعدين نظرتكوا دي اصلا حرام و تعارض ان الله علي كل شئ قدير وانه يهدي من يشاء وبعدين يا مسلمين يالي مابتسمعوش عمرو خالد و بتقولوا ان اللي بيسمعوه بيتبعوه بسذاجه انتوا ليه مش نموذج للانسان اللي بتسمعوله يمكن نلاقي عندكو حق و كمان ماهو الداعيه الرائع معز مسعود تتر البرنامج بتاعه بيغنيه احمد فهمي بتاع واما محدش اتكلم<br />وللي بيسخروا من تامر و عمرو احب افكركوا بالايه الكريمه \"لا يسخر قوم من قوم عسي ان يكونوا خير منهم\" و ده كلام ربنا مش كلام حد و لم يستثني منه حد ولا حتي الكفار اتقوا اللـــــــــــــــــــــــــــــــــه"
