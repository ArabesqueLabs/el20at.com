text = "\" لا إله إلا الله محمد رسول الله \"<br />أنا مصدومة ولا أدري ماذا أقول بعد ما قرأت هذه الردود غير أن مصيبتي بل مصيبتنا جميعا كبيرة<br />أسأل الله المغفرة لي ولكم وأعوذ به من عذابه وعقاب قبره وأسأله أن يجيرنا من جهنم ويسترنا يوم العرض عليه ويجمع شملنا ولا يشتت أمرنا في الدنيا وأن لا يجعل مصيبتنا في ديننا ولا إلى النار مصيرنا وأن يجعل الجنة دارنا أسأله الصلاح والهداية والرشاد لنا جميعا"
