[[comments]]
order = 1
subject = "قرارات اعدام"
author = "ام قيس"
text = "نقول لمن يبكي على اعدام صدام .... انظروا الى القرارات التي اصدرها صدام لاعدام الشعب العراقي 1. قرار 865 في 12/8/1974 الإعدام لكل من يزدوج في الانتماء للبعث. 2. قرار 1244 في 20/11/1976 الإعدام لمن انتمى لحزب آخر بعد البعث. 3. قرار 734 في 30/5/1978 الإعدام لمن يتصل بأي جهاز غير عراقي دون موافقة السلطة. 4. قرار 1357 في 10/11/1971 الإعدام لكل عسكري يمارس السياسة غير البعث. 5. قرار 784 في 7/5/1987 الإعدام لمن يحاول تنظيم شخص بعثي. 6. قرار 884 في 3/7/1978 الإعدام لكل عسكري/شرطي عمل بعد تقاعده بالسياسة غير البعث. 7. قرار 461 في 31/3/1980 الإعدام لكل من انتمى أو سبق له (!) الانتماء لحزب الدعوة. 8. قرار 1140 في 26/8/1981 الإعدام لكل من تهرب من الخدمة العسكرية. 9. قرار 877 في 7/7/1982 الإعدام لكل من تغيب 5 أيام عن وحدته العسكرية. 10. قرار 1370 في 1983 الإعدام لكل من تآمر على سلامة سلطة البعث. 11. قرار 313 في 13/3/1984 الإعدام لكل من يتعامل بالعملة الأجنبية. 12. قرار 384 في 31/3/1984 الإعدام كل من يثبت بحقه الجبن أو التخاذل. 13. قرار 458 في 21/4/1984 الإعدام لكل من انتمى لتنظيم يعمل لأسقاط البعث. 14. قرار 120 في 29/12/1986 الإعدام لكل من زور أو غير في جواز سفره. 15. قرار 840 في 4/11/1986 الإعدام لكل من قام بإنتقاد شخص رئيس الجمهورية أو مجلس قيادة الثورة أو حزب البعث أو المجلس الوطني او الحكومة (!)"
archived = "2010-03-14"
capture_url = ""

