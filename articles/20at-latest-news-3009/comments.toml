subject = "التوقيت مختار بعناية"
author = "سلمى"
text = "يوم العيد للاهانة يوم قبل تعيين الامين الجديد للامم المتحدة اخر ايام السنة لمنعه من الاعتراض حتى ولو كان قرار الامم المتحدة غير مصداقي<br />ليس مهما اعدامهم ام لا الشخصية التي كان يجب ان ينظر الى اعدامها قد اعدمت وما من داعي لان ندعو لرحمة الاخرين"
