text = "انها يوم ماسؤى ولكنى لسيت معتارضة على اعدام صدام ولا يمكن ان ينسى اى عربى يوم ضرب ايران والكويت بل انه هدد مصر بتوجعها ولكنى اعتراض على اعدامه بايدى المحتل والمالكى وامثله وشكرا"
