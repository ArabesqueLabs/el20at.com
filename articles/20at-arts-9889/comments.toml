subject = "اغتنم الفرصة ولو بمعلومة"
author = "هايدي"
posted = "2008-08-17"
text = "السلام عليكم ورحمة الله وبركاته ...شكرا ياراما على هده المبادرة الرائعة والتي كونها ترويج الى اهمية الثقافة واماكن تواجد الكتب للمثقفين ...فعلا موضوع رائع جميل ...بالرغم من اني 17 سنة الا انو ما في كتاب بعتب علي ...انا الحمد لله ثقافتي مو محدودة لا انا ثقافتي عالية..انا ما بقرافقط الكتب العلمية او الادبية انا بقرااي كتاب مهم وادا كان الكتاب رائع انهيه في اقل من يوم مهما كان كبيرا وانا بقرا الكتب والخواطر واي شي مفيد واكتر كاتبة روايات مفضلة بالنسبة الي هي اقاتا قرستي كاتبة الروايات البوليسية ...وبنصح الكل ما يفوت هده الروايات علية لانها فعلا رائعة ومشوقة وانا بالرغم من انو عمري 17 الا اني مؤلفة وكاتبة بالف روايات رومنسية وبكتب خواطر وكمان شعر وبتمنى انشرهم وتقرؤهم لانهم فعلا رائعين مو لاني انا الي كتبتهم لاء لانو هي الحقيقة ...بتمنى تدعولي<br />مع تحياتي للجميع :هايدي"
archived = "2010-03-14"
