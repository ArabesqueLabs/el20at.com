subject = "الثقافة غذاء للفكر الإنساني"
author = "محمد نواف"
posted = "2008-08-17"
text = "يقولون: (( القناعة كنزُ لا يٌفّنى )) .. وأنا أقول: (( الثقافة كنزُ لا يُفنى ))، ذلك أن الثقافة هي التي تحدد مكان ومستوى الإنسان، لأن هناك فرق شاسع وهائل بين الإنسان المثقّف والإنسان الغير مثقّف ..<br />الثقافة يجب أن تكون في كل مجالات الحياة المختلفة، اجتماعياً، واقتصادياً، وسياسياً، وأدبياً، وفنياً .. الخ<br />الثقافة مرآة للمجتمع المتطوّر، المتحضّر، المواكب للعصر وتطوراته السريعة .. فبحكم أننا نعيش في زمن السرعة فبات من السهل جداً قراءة كتاب ثقافي عبر الإنترنت دون اللجوء إلى استعارته من المكتبة أو شراؤءه حتى وهذا أمر معروف للجميع .. أضف إلى ذلك وجود الكثير الكثير من الكتب الهامة والمراجع الضروروية للكتاب ..<br />للأسف - نحن العرب - كنّا في السابق السبّاقيين الأوائل وكانت الأعين الصليبية الغربية الأوروبية تتربص لنا، وللأسف الشديد غزونا غزو فكري ثقافي مما جعلنا في نظرهم دول العالم الثالث، لأن هنالك الكثير من الناس تفكيرهم تفكير سطحي ومحدود وضيق الأفق .. وإذا استمر الحال على ماهو عليه فسوف نصبح دول العالم الرابع والخامس والساس .....<br />نحن البشر زائلون لا محالة ! ولكن تبقى وتستمر الحياة طالما وجودو أناسٌ مثقفون، وحتى لو رحلوا هؤلاء المثقّفون جسداً فهم بلا شك باقون روحاً وعقلاً .. لأنهم عظماء في نظر الجميع، أمثال الراحل محمود درويش، والمخرج السينمائي الشهير يوسف شاهين، وغيرهم كثيرون رحلوا ولكنهم تركوا وراءهم ثقافتهم التي لم تمحوها السنين، فهم بحق من يصنع التاريخ ويسطّرونه بأحرف من نور ..<br />شكراً للأخت راما أحمد وعلى هذا المووضع القيّم الرائع<br />محمد نواف"
