[[comments]]
order = 1
subject = "ضع عنوان التعليق"
text = "وعلي النقيض تقول إيناس الشناوي - 19 سنة : من المعروف أن البضائع الصينية جيدة وزهيدة الثمن، لذلك تغري الناس بشرائها وأنا من مؤيدي هذه البضائع رغم من سلبياتها الكثيرة.<br />وتضيف قائلة: إذا تعرضت يوما للبطالة فلن أستسلم ولن أجلس في البيت ورغم أنني لست من هواة البيع والشراء فإنني لو اقتنعت بذلك وقتها سأفعلها، مع قليل التردد والخوف لكنني أعتقد أنني سأستطيع التغلب علي ذلك . تأثير سلبي"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043953/http://masr.20at.com:80/newArticle.php?sid=14104"

[[comments]]
order = 2
subject = "nasayh mohmh"
author = "ksksy"
text = "كيف تصبح إنسان فاشل<br />بكل بساطة عليك بالتالي:<br />--اجعل هدفك في الحياة هو الراحةوالاسترخاء<br />-- حب سريرك فهو مملكتك الوحيدة<br />-- ارتاح بالنهار لتتمكن من النوم بسهولة في الليل<br />-- العمل شيء مقدس، لذلك لا تقترب منه أبداً<br />-- لا تؤجل عملك للغد طالما يمكنك تأجيله لبعد الغد<br />-- اعمل أقل ما يمكنك عمله، وحاول أن تجعل غيرك يؤدي عملك بدلاً منك<br />-- لا تقلق لن يموت أحد إذا لم تفعل شيئاً، بالعكس قد يتأذى البعض عندماتعمل<br />-- إذا أحسست بأن لديك رغبة في العمل،استرخي قليلاً حتى تزول تلك الرغبة<br />-- لا تنسى : العمل مفيد للصحة ، لذلك اعطي المريض فرصة ليعمل"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043953/http://masr.20at.com:80/newArticle.php?sid=14104"

[[comments]]
order = 3
subject = "نكته"
text = "ma7adesh_7ases_bea:<br />عريس عصبي يوم فرحه كتب في بطاقة الدعوة: الزفت اللي هايجي ميتأخرش...واللي مش جاي في ستين داهية ... والعيال الرذلين الصغيرين يتخمدوا فى البيت..... و اللي هاتجيب موبايل كاميرا هفقع لها عينيها الاتنين....وابقوا اطفحوا في بيوتكم .. كفايه اللي دفعته للموكوسه العروسه.... اللي هتمد ايدها عالتورته هقطعهالها ..وابقى حلي في البيت ياختي انتى وهى .. منتو زي القطط تاكلوا وتنكروا .... الرقص ممنوع .. الضحك بصوت ومن غير صوت ممنوع...... وابقى عيل لو اتجوزت تانى"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043953/http://masr.20at.com:80/newArticle.php?sid=14104"
