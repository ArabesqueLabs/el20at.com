[[comments]]
order = 0
subject = "هو اخبار الصكوك وتوزيع الاسهم بتاع ابن حسنى - اخبارها اية"
author = "فريكيكو"
text = "عايزين نشترى موبايل<br />هو الموضوع سكت لية<br />اية الاخبار يا حاج فتحى<br />والا المشروع الست ليفنى لم توافق علية"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235649/http://masr.20at.com:80/newArticle.php?sid=19007"

[[comments]]
order = 1
subject = "بدأها حسين إبراهيم نائب رئيس كتلة الإخوان الذى اعتبر أن قرار ضرب غزة أُعلن فى القاهرة إثر لقاء أحمد أبوالغيط، وزير الخارجية نظيرته الإسرائيلية تسيبى ليفنى،"
author = "مش حتجوز"
text = "عيب عليك يا نائب رئيس كتلة الاخوان اللي انت بتقوله دا<br />عيب اوي اوي اوي<br />انا فاكر مرة زمان ايام السادات مرة اسرائيل ضربت مفاعل نووي عراقي ايام مناحم بيجن وقبلها بيومين تم لقاء بين بيجن والسادات<br />فقام كل العالم الزباله قالوا ان مصر ادت الضوء الاخضر لضرب المفاعل<br />عيب اوي يا بتاع الاخوان لما تتهم رئيس بلدك بكده<br />امال الاعداء يقولوا ايه<br />وبعدين انت راجل مستقل ما لكش دعوه بالاخوان جوا البرلمان"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235649/http://masr.20at.com:80/newArticle.php?sid=19007"

