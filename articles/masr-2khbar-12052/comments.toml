author = "سعيد منصور"
posted = "2009-05-13"
text = "عمليا مش ممكن<br />الشباب عندهم الف طريقة وطريقة لاختراق المواقع الاباحية<br />وبعدين فيها اية لما يشوفوا ويتعلموا<br />صدقونى لما يشوفوا الانحلال الغربى ودونية استخدام نسوانهم فى الجنس ورخصهم بيتمسكوا بالحريم الوطنى وبيحترموا حياء المرأة المصرية وخجلها وممارستها للجنس مع زوجها فى منتهى الخجل والحياء والحرص على الكرامة مش زى شراميط اوروبا<br />خلوا اغلشباب يشوفوا وبعدين هيفرقوا بين الغث والثمين"
archived = "2010-03-14"
capture_url = ""

