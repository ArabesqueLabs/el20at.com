text = "استغفر الله الذي لا إله إلا هو.وأتوب إليه .<br />اتقي الله يا أخي سعيد وتذكر ..قول الله تعالى .. { ما يلفظ من قول إلا لديه رقيب عتيد }<br />الحمدالله على قرار المحكمه الزام الجهات المسئوله نحو منع المواقع الاباحيه...نسأل الله ..ان لا يجعلنا خزايا اومفتونين..انه سبحانه وتعالي ولي ذلك والقادر عليه ."
