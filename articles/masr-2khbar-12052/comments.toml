text = "[quote name=\"benjamin cohen\"]انا ضد هذا القرار اللى حيخلى مصر زى السعوديه و ايران و حيخلق نوع من الكبت لدى الشباب كما ان الشىء ده نوع من الحريه الشخصيه و غريزه طبيعيه تقنينها مايكونش بمنعها بس يكون بالتوعيه اما منعها حيخلى الشباب يتعب نفسيا و يحاول يشوف طريقه غير شرعيه لقضاء حاجته الجنسيه و خلينا نشوف اللى بيحصل فى الدول اللى اتمنع فيها الحريه الجنسيه من تحرش بالنساء و شذوذ و اشياء اخرى ارجو من الجميع يحكم عقله و يعرف ان المنع ليس الطريقه الصحيحه لمواجهة المشكله<br />صديقكم المخلص دكتور بنيامين كوهين مزراحى[/quote]<br />مستر مزراحى<br />انت تايه و لا ايه - اسف لامؤخذه-<br />الغريزه الطبيعيه حلها يجوز لو مش قادر يصوم مش يزود الشهوه عنده بالحاجات ده"
