[[comments]]
order = 0
subject = "الأفضل"
author = "باسل سمير"
text = "كان الافضل ان واحد تانى مش من تيت راديو هو الللى يكتب عن الراديو لو عجبه مش حد من جوه ده رأيي بس ده لا يمنع ان فى حاجات لذيذة جدا واصوات متميزة"
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063052/http://masr.20at.com:80/newArticle.php?sid=13865"

[[comments]]
order = 1
subject = "لا يجوز"
author = "لا يجوز"
text = "ازاى واحد من تيت راديو يكتب عن موقع تيت راديو<br />ده بيخل باى حياديه او بتنجانيه فى الموضع من غير مقرا الموضوع<br />الموضوع مينفعش اصلا<br />واان مش عارف ازاى موقع زى عشرينات يعمل حاجه زى كده<br />ده ولا كانه موقع ملاكى"
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063052/http://masr.20at.com:80/newArticle.php?sid=13865"

[[comments]]
order = 2
subject = "ولاد البلد للدعاية والاعلان"
author = "بني ادم"
text = "يعنى مش عارف مش ده موقع ولية بنيان تحريري يعني اية اوحد عامل موقع او اذاعه ومشارك فيها يعمل موضوع عن الاذاعه ولا عامل عبيط وكانة مش معاهم طيب خلي اي واحد عندك في الموقع يعملة ..."
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063052/http://masr.20at.com:80/newArticle.php?sid=13865"
