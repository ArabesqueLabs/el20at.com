[[comments]]
order = 0
subject = "اى مصرى حتى لو كان عمدة فرشوط ينفع يبقى رئيس لمصر"
author = "فلاح من كفر الهنادوة"
text = "ماذا يفعل الرئيس فى اى دولة ؟<br />بينفذ خطة للتنمية والبناء موضوعة بخبراء واهل البلد من المتخصصين واهل الخبرة وكبار البلد واهل الحل والعقد فيها<br />هل ينزل علية الوحى ؟ كلا<br />هل شخصيتة مصونة لا تمس ؟ كلا - انها وظيفة عامة يتقاضى عنها اجرا من خزينة الدولة ومن فلوس دافعى الضرايب<br />اذن اى شخص فى مصر يصلح لتولى هذة الوظيفة<br />اذن ما هو الخلل فى هذة الوظيفة ؟<br />ان لا يتولى تنفيذ اى شىء او تنفيذ خطط للاعداء داخل بلدة<br />من هنا لا يهم من هو الرئيس<br />المهم ما هى خطة التنمية التى سينفذها<br />وماهى اللجنة من الخبراء التى ستضع الخطة<br />عموما الموضوع خرج من ايدينا<br />فامريكا ستختار لنا الرئيس<br />واظنة سيكون عسكريا"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233352/http://masr.20at.com:80/newArticle.php?sid=17659"

[[comments]]
order = 1
subject = "ايهاب الخولى احسن لك لتعمل خولى فى اى مشتل او جنينة و روح اتعلم الاول ازاى تفهم فى الساسة يا حمار يابن حمار و حمارة حصاوى"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر (الحزب الوطنى الديمقراطى)"
text = "حقا و الشهادة للة و حدة؟!!!<br />لا يجب الاجتهاد النابع من فراغ و ترشيح اية اسماء على سبيل الفرقعة الاعلامية المبنية على الغباء بزج اسماء بعض مشاهير مصر الذين نفتخر بهم عالميا امثال دكتور محمد البرادعى/رئيس الوكالة الدوليى للطاقة الذرية؟ليترشح لرئاسة الجمهورية؟<br />لا يجب الخلط بين السياسة و بين العلم؟<br />العلم لة رجالة العلماء ؟اما السياسة فلها رجالها المحترفين الحكماء؟!!!!!!!!!!<br />و ما تنساش تسلملى على ايمن نور المزور السجين و تقولة كفارة !رمضان كريم و كل سنة و امثالكم بخير !<br />(صحيح ان لم تستح فقل ما شئت؟)اصحاب العقول الفارغة امثالكم فى راحه؟<br />يابنى رئاسة الجمهورية شيىء و رئاسة اى حاجة شيىء تانى حتى و لو كانت رئاسة الامم المتحدة موش رئاسة الوكالى الدولية للطاقة الحيوانية؟ عفوا اقصد (الوكالة الدولية للطاقة الذرية)<br />, و معلش انتهى الدرس يا غبى؟ارجو ان تكون قد فهمت و لكنى ما زلت اشك من انك سوف تفهم يا خولى الجنينة و اداع يايهاب يا هباب !!!!!<br />جاتك خيبة و ستين مليون خيبة يا عميل من تحت بير السلم"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233352/http://masr.20at.com:80/newArticle.php?sid=17659"

[[comments]]
order = 2
subject = "اذا رشح الدكتور البرادعى لرئاسة الجمهورية ؟ فمن حقى ان اكون رئيسا للجمهورية؟ معلش مهى بقت سايبة للحيوانات تفتى و تقول اللى هى بتخرف فية!!!"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "الى ايهاب الخولى!<br />طيب ما انت اهو فالح و بتقول انك بتغهم فى السياسة؟<br />طيب يا حمار يا غبى؟؟؟<br />لية ما رشحتنى لاكون رئيسا للجمهورية ايضا؟ او لرئاسة الوزراء مثلا!!!<br />و انا اعدك بان ارشحك لان تكون حيوان فى جبلاية القرود بحديقة الحيوانات بدرجة قرد و كيل اول الجبلاية؟<br />ضحكتنى اللة يكملك بالعقل يا حمار ياغبى من غبى!!!"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233352/http://masr.20at.com:80/newArticle.php?sid=17659"

[[comments]]
order = 3
subject = "طيب ما رشحتش امك لية لرئاسة الجمهورية؟ يايهاب يا خولى؟؟؟!!"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "يا ريت تكون انت او امك قد اترشحتم لرئاسة الجمهورية يا حمار؟؟؟<br />و اقسم باللة العظيم اننى سوف اقوم بانتخابك فورا انت او امك ؟؟؟<br />لاننى لا امتلك سيارة و ممكن استع?ين عنها بحمارة مثل امكظ او حمار حصاوى مثلك او مثل الحمار الغبى ابوك? اللى معرفش يعلمك شيئ فى الحياة او السياسة؟<br />السياسة شيئ ؟ و التفاهة اللى انت بتعملها شيىء<br />افهم يا غبى؟ يابن الغبى؟؟؟"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233352/http://masr.20at.com:80/newArticle.php?sid=17659"
