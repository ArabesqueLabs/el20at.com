order = 0
subject = "بما انى لا لى فى الطور ولا فى الطحين - يارب تخرب"
author = "مش لاعب"
text = "بما اننى ما ليش حاجة فى اى حاجة فى البلد دى<br />وبما اننى فى نظر الدولة ما ليش لزمة<br />ولا الدولة لها لزمة عندى<br />يبقى البورصة تولع احسن وتخرب ونقعد نتفرج<br />نعم الافضل انها تخرب<br />علشان يبقى فية حاجة نتسلى بيها<br />هتتفلسفوا وتقولوا الاقتصاد والخراب<br />هقول لكم هو فية حاجة لسة مش خربانة - يبقى بجملة الخراب خللى البورصة تخرب"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070751/http://masr.20at.com:80/newArticle.php?sid=17922"
