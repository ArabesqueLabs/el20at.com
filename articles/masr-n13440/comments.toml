order = 0
subject = "دور العبيط"
author = "واحدمن البشر"
text = "تفتكر مين يا استاذ دعاء ينفع يمثل دور العبيط با قتدار<br />واحد مديها طناش على الاخر فى فيلم العنبوكة يقولوا لة العيال بتغرق على شواطىء تركيا واليونان وايطاليا يرد ببلاهة اية فين لية<br />يقولوا لة الناس جعانين يرد ببلاهة اة لية فين<br />الادوار الصعبة دى عايزة واحد عندة بلاهة طبيعية مش تمثيل زى مدرسة المشاغبين والواد ابن الناظر اللى ما بيجمعش<br />انا احىى ممثلى الكوميديا السوداء وعلى رأسهم المفتى وشيخ الحزب اياة<br />سلامات على افلام العيد<br />وكل عيد وانت طيب"
archived = "2007-12-17"
capture_url = "https://web.archive.org/web/20071217235328/http://masr.20at.com:80/newArticle.php?sid=13440"
