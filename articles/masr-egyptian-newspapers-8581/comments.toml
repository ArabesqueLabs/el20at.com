text = "انا بس اللي مستغرباه انك حكيت عن جوزيه وعن سجله الاخلاقى..ونسيت اخلاق لعيبة الزمالك اللي غنية عن التعريف!!<br />من اول عبد الحليم لشيكابالا..<br />يااستاذ محمود اللي بيته من ازاز مايحدفش الناس بطوب<br />اللي بيقولوه جماهير الزمالك عن الاهلى هو اللى فعلا اصبح \" ظاهرة مستفزه\""
