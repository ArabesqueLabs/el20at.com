subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-03-27"
text = "ايه يا بني كل ده ؟؟؟؟<br />دانت شكلك زملكاوي رئم من بتوع بلدهم ..... زملكاوي زملكاوي يعني ما علينا<br />الاهلي بالفعل اقوي نادي في مصر وافريقيا كلها ولاعيبته ومدربه وجهازه الفني افريقيا والعالم كله شهدهلم مش هنستني واحد زيك وناخد برأيه يعني<br />كمان انت عمال تقول ظاهرة ظاهرة الظاهرة هي اللي بتاخد وقتها وتروح زي الزمالك كدة لما خد الدوري مرتين ورا بعض ولا مش عارف مرة وغلب الاهلي وكان نازل طحن في فرق الدوري ايام اوتوفيستر وكابرال وبعد كدة الله يرحمه<br />واذا كنت نسيت اللي جري هات الدفاتر تنقرا"
