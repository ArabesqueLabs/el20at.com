[[comments]]
order = 2
subject = "انا رجعت تاني"
author = "Dabdoob"
posted = "2008-03-27"
text = "الراجل ده عبيط وانا هارد عليه:<br />1- هل من الطبيعي أصلا ان يسال الصحفيون مانويل جوزيه عن فوز الزمالك بالدوري؟؟؟؟ من الطبيعي ان يكون الرد كوميدي اذا كان السؤال كوميدي!!!<br />2- ليس من الطبيعي ان يبتعد كرول عن المواجهة كلما خسر فريقه و حينما يقول عنه جوزيه انه هرب من المواجهة فهذا طبيعي ولا يوجد به ما يعيب.<br />3- لم افهم معني فضيحة النادي الاهلي في نهائي افريقيا . لان الفوز والهزيمة واردان في الكرة كما ان الزمالك خسر من الهلال السوداني في ستاد القاهرة ولم يقل احد انها فضيحة.<br />4- يمتلك جوزيه سجلا تدريبيا مميزا بدون الاهلي ولا اعرف من اين اتي بفكرة انه مدرب مغمور!!!!<br />5- وجود اسم الاهلي كعلامة تجارية علي اكياس الشيبسي لا يعيبه خاصة اذا علمنا ان ريال مدريد يضع اسمه علي الماكولات والمشروبات وفانلات اللاعبين والصور التذكارية ووووووو!!!!! هذا هو استخدام العلامات التجارية (Brand name) في تسويق اسم النادي وزيادة ايراداته.<br />وسلام<br />Dabdoob"
archived = "2010-03-14"
capture_url = ""

