subject = "من منزله حيث مكان إضرابه؛"
author = "مش سعاد حسني"
text = "ما تقولولنا ساكن فين علشان خاطر ناخد فكره<br />المرشج بتاعه ساكن في القاهرة الجديدة يا ترى هو ساكن فين<br />طبعا مستحيل حيكون ساكن مع الجرابيع اللي زينا في المرج وعزبة النخل"
archived = "2008-05-09"
