[[comments]]
order = 0
subject = "الى محمد عبدالقدوس نحل احسان عبدالقدوس كاتب الجنس والدعاره"
author = "مش مروة عبدالفضيل ولا مروة صلاح"
text = "قبل ما تعكنن على الريس<br />قولنا عملت ايه مع ابوك وكتاباته وكتبه عملت فيها ايه<br />سيدنا ابو بكر في احد الغزوات كان مع المسلمين وابنه كان مع الكفار وبعد الغزوة ما انتهت جاء له ابنه وقال له يا ابتي انا كنت اتحاشاك في المعركة<br />فرد سيدنا ابو بكر رضي الله عنه قال له وانا كنت ابحث عنك لاقتلك<br />قولنا بأه يا عم محمد عبدالقدوس قبل ما تعكنن على الرئيس قولنا ايه رايك في ابوك رايك الاسلامي طبعا"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509012403/http://masr.20at.com:80/newArticle.php?sid=15561"

[[comments]]
order = 1
subject = "لا يا ابن روزل يوسف"
author = "مش هو ولا هي"
text = "لا يا ابن روزل يوسف قبل ما تزعزع امن واستقرار البلد وتخلي الامن يعمل استنفاز احد المعلقين قال انه بيتكلف 50 مليون جنيه لازم تفهم ان امريكا واسرائيل خلاص سيطروا على هذه المنطقة ويظهر ان ما فيش فايده ولا ملجأ من الله الا اليه واتا امر الله فلا تستعجلوه واسرائيل الكبرى قادمة لا محاله<br />وبعدين يا اخي ما هي افغانستان كانت مليانه اخوان وكل اصناف الجماعات الاسلامية عملوا ايه مع امريكا<br />والعراق كان فيها اخوان عملوا ايه مع امريكا<br />امريكا هي المسيخ الدجال احنا في زمن المسيخ الدجال مفيش فايدة<br />بدل ما تعمل فالح كده روح انزل ادعي الناس وعلمهم الناس الجهلة اللي ماشيه في الشارع دي تعليمهم اولى من الجلوس في المنزل والاشتغال بالسياسة الفاشلة<br />الفلوس اللي بتتصرف بيها على الامن دي كان اولى بيها مرضى السرطان والله العظيم لكن حنعمل ايه بقى في عقلية الخوارج"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509012403/http://masr.20at.com:80/newArticle.php?sid=15561"

