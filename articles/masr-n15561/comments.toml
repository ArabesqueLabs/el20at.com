[[comments]]
order = 6
subject = "هذا ما يلقاه الرواد"
author = "مصري صميم"
text = "أستاذ محمد عبد القدوس واحد من قلة قليلة في بلدنا يمكن أن نطلق عليهم آخر الرجال المحترمين<br />هم بالفعل آخر الرجال الشجعان الفرسان النبلاء الذين لا يخافون في الحق لومة لائم ويقولون كلمة الحق عند سلطان جائر ... لم يركنوا للراحة والتنبلة كبقية الشعب مع أن أسهل سيئ في بلدنا هي التنبلة والتلحمة والاستهبال وتقبيل الأيادي والأقدام وبعدها بكام يوم سيكون رئيسا لمجلس إدارة الأهرام أو الأخبار أو أي جريدة حكومية أخري<br />مش عارف يا أستاذ محمد لماذا تتحملون كل هذه البهدلة من الأمن والشرطة ؟؟؟ لأجل من؟؟ لأجل شعبنا الذي وصل إلي درجة من الاستخفاف واللامبالاة وتخانة الجلد لا يصدقها عقل ؟؟؟ صدقني نحن لا نستحق منكم كل هذه التضحيات .... فنحن نستحق كل ما حن فيه بل وأكثر ألف مرة .... بسكوتنا بسلبيتنا بخوفنا نحن نشارك الحكومة والحكام فيما وصلت إليه بلدنا من انحدار واندحار وانحطاط غير مسبوق في جميع المجالات السياسية والاقتصادية والاجتماعية والأخلاقية .... ألأم تسمع حديث الرسول (ص): يأتي زمان على أمتي يحبون خمسا وينسون خمسا : يحبون الدنيا وينسون الآخرة ... يحبون المال وينسون الحساب ... يحبون المخلوق وينسون الخالق ... يحبون القصور وينسون القبور ... يحبون المعصية وينسون التوبة ..... فإن كان الأمر كذلك ابتلاهم الله بالغلاء و الوباء و الموت الفجأة و جور الحكام. أو كما قال صلى الله عليه وسلم<br />000 هل تعتقد أنه مازال هناك أمل فينا ... في هذا الشعب الجبان الخانع المستسلم .... لماذا تحملون هموم مصر والمصريين بهذا الشكل إذا كانوا في رأيي لا يستحقون ولن تجد منهم سوى خفة الدم والاستظراف والسخرية أو الصمت و السكوت والاختفاء ساعة الجد 000 يا عم خليك زينا في حالك وبيتك واولادك ... روح شغلك الصبح وتعال العصر اتغدي ونام وقوم اتفرج على الدش ونام زي الحيوانات (قصدي زينا يعني .. وتقبل أسفي)<br />000 وحيث أني من أبناء هذا الشعب العظيم ويجري الجبن في دمي جريانا وأكتب لك هذا الكلام وأنا مستخبي تحت السرير فإني لا أستطيع أن أعدك بأي مناصرة أو مساعدة فعلية من جانبي سوى بالدعاء الى الله أن ينصرك أنت وأمثالك على من عاداكم وأن يبعد أي شر عن بلدنا الحبيبة في هذه الفترة العصيبة من تاريخها ..."
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509012403/http://masr.20at.com:80/newArticle.php?sid=15561"

[[comments]]
order = 7
subject = "الى الاخ اللي فوق"
author = "مش نيره الشريف"
text = "والنبي يا خويا بلاش فلسفه<br />فيه احد المعلقين قال ان مصاريف استنفار الامن خمسين مليون جنيه كل يوم<br />كل دا علشان خاطر فيه ناس عايزه تتمنظر ويعملولي سياسيين كبار<br />خمسين مليون جنيه فاهم يعني ايه خمسين مليون جنيه كل يوم<br />يعني في الشهر خمسين في تلاتين احسبهم بقا يا فالح انت ومحمد عبدالقدوس بتاعك"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509012403/http://masr.20at.com:80/newArticle.php?sid=15561"
