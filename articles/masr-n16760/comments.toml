[[comments]]
order = 0
subject = "بصو في الصورة كويس"
author = "مش ححبك"
text = "لبس النقاب دعوة اساسية ليس لها اساس ديدي<br />لان كشف الوجه والكفين اصل من اصول الدين<br />والدليل على ذلك ضرورة كشف الوجه في الصلاة التي هي اقدس شيء في دين الاسلام<br />فلبس النقاب والدعوة الى لبس النقاب دعوه سياسية مظهرية لا علاقة لها بالدين<br />تماما عند الرجال العورة بين السرة والركبتين<br />فتغطية الصدر مثلا عند الرجال لا اساس ديني له<br />وشكرا"
archived = "2008-07-18"
capture_url = "https://web.archive.org/web/20080718162620/http://masr.20at.com:80/newArticle.php?sid=16760"
