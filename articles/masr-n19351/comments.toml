order = 0
subject = "النصر هو - الشباب العربى الجديد المقاتل"
text = "الشباب الجديد المثقف المتعلم اللى بيصنع صواريخة بيدية ويضربها<br />الشباب بتاع الجيل الجديد<br />مش شوية البصمجية والجهلة اللى حاربوا قبل كدة واللى كان بيسمع صوت انفجار قنبلة بيستخبى ويشخ على نفسة<br />الشباب العربى الجديد يبشر بنهاية اسرائيل<br />انتهى عصر العواجيز ولاد الوسخة اللى هزمونا فى 67 وعملوا الثغرة وحصار السويس فى 1973<br />والانهزاميين ولاد اللبوة اللى استسلموا فى كامب ديفيد وخللوا العدو يركب على اكتافهم ويمص دم البلد ويستحل بترولها وغازها ومقدراتها<br />فين بتوع اتفاقية الكويز ولاد القحبة<br />المفاجاة فى الحرب دى هى الشباب المقاتل الجديد"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119204629/http://masr.20at.com:80/newArticle.php?sid=19351"

