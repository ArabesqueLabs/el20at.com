subject = "ضع عنوان التعليق"
text = "فعلا موضوع علامة النصر دا شغلني جدا و بحثت عنه كتير من حوالي سنتين تقريبا و اقرب الاشياء ال توصلت اليها من حيث الصحة هو ان علامة النص برفع الاصعين تشبه حرف v في اللغة الانجليزية و هي الاختصار لكلمة victory وهو الانتصار او النصر و انا بعتقد ان هذا اقرب للصح خاصة بعد ما قام بتأديته تشترشل بعد فوزه علي قوات النازي عندما كانت قريبة جدا من بلاده خاصة بعد ما قال كلمته الشهيرة ليس لديكم عندي الا الدم و الدموع ............ اعتقد ان دي وجهة النظر الصح و ان كنت اتمني من كاتب الموضوع ان يقوم بالبحث اكثر و يتحفنا بالمزيد من الاراء ال وردت في ذلك الموضوع ........ شكرا للجميع<br />قرطبة"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119204629/http://masr.20at.com:80/newArticle.php?sid=19351"
