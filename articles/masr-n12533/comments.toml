[[comments]]
order = 4
subject = "الله يرحم جدك"
author = "إلى الأخ محسن"
text = "ننتظر البيت القادم من شعر جدك إمتى انت ما قلتش ومناسبة إيه اللى هنستناها عايزين نعرف بقية الشعر وياريت تعرفنا كمان معناه وإيه رأيك كمان انك ممكن تجمع النوع من الأشعار فى ديوان وتسميه أشعار جدى الحكيم.."
archived = "2007-11-22"
capture_url = "https://web.archive.org/web/20071122185022/http://masr.20at.com:80/newArticle.php?sid=12533"

[[comments]]
order = 5
subject = "مى زيادة"
author = "------------"
text = "حقيقى موهبة جميلة تحتاج إلى المساندة والتشجيع والبنت كمان إحساسها حلو وده باين فى أشعارها وواضح غنها مثقفة وقارئة جيدة ومتابعة للأحداث ياريت تلاقى إهتمام ورعاية عشان موهبتها دى تكبر معاها يمكن تبقى مى زيادة المصرية فى يوم من الأيام ."
archived = "2007-11-22"
capture_url = "https://web.archive.org/web/20071122185022/http://masr.20at.com:80/newArticle.php?sid=12533"

[[comments]]
order = 6
subject = "موهبة حقيقية"
text = "على فكرة فى أطفال كتير جدا موهوبين فى الأدب والرياضة والفن واعتقد انى قرأت فى الموقع من فترة عن الطفل أصغر رئيس تحرير بس محتاجين حد يهتم بالبحث عنهم وتبنى مواهبهم عشان يبقى عندنا ناس متميزين فى مجالات كتير"
archived = "2007-11-22"
capture_url = "https://web.archive.org/web/20071122185022/http://masr.20at.com:80/newArticle.php?sid=12533"

[[comments]]
order = 7
subject = "الضرب بالبراطيشى"
author = "شاعر حلمنتيشى"
text = "دة شعر حلمنتيشى - شعر اية اللى انتى جاية تقول علية<br />دا كلام يكتبة عيل عندة 7 سنوات وياخد درجة ضعيفة فى التعبير<br />دة بيفكرنى بقصيدة الخراف البيضاء<br />كان فية خراف بيضاء<br />بتقول ماء ماء ماء<br />والسماء بيضاء<br />والولد لابس حذاء<br />والوادى لونة اخضر ..........والراعى شكلة مكعبر<br />والكلب بيجرى وياكل ويقعد القرفصاء<br />شعر دة يا بيومى<br />يا عالم خلوا الشعر لاصحابة"
archived = "2007-11-22"
capture_url = "https://web.archive.org/web/20071122185022/http://masr.20at.com:80/newArticle.php?sid=12533"

