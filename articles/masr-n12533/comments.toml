[[comments]]
order = 0
subject = "تمام تمام واللة تمام يا محسن بية"
author = "محسن"
text = "واللة عفارم عليك. تصدق شاعرة بجد ولا انت اية رايك<br />واية رأيك فى الشعر دة:<br />عزيز خطر كيف زوال بكى العين فى وادى الغروب<br />انتظر البيت القادم فى مناسبة أخرى وهذا من أقوال جدى الحكيم اللة يرحمة والنبى تقرالة الفاتحة وادعيلة ربنا يبشبش الطوبة اللى تحت راسة ، حقيقى حكيم يا جدى واللة حكيم وأوعى تفتكرة حكيم المطرب لاحسن ازعل منك أوى خالص خالص .<br />امضاء محسن بيك الى محسن بيك"
archived = "2007-11-22"
capture_url = "https://web.archive.org/web/20071122185022/http://masr.20at.com:80/newArticle.php?sid=12533"

[[comments]]
order = 1
subject = "نصيحة للاخ عطوة ابو مطوة"
author = "واحد من الناس"
text = "يااخ ابو مطوة واضح انك حاطط حمدى رزق فى دماغك اوى ماتسيبك منة وتخليك فى نفسك احسن وحاول تتقدم وتكون احسن وكل واحد بياخد نصيبة وكل واحد مكتبلة اية الهياخدة فى الدنيا وبعد كدة فى اخرة كلنا هنتحاسب على ما فعلنة واعتقد ان مش هو دة الحل الهيفضح حمدى رزق ويخلية فى وجهة نظر الناس وحش لانة كاتب بردة كبير ولة عمودة اليومى فى المصرى اليوم وعلى فكرة انا لا احب كتباتة لان بحس انها ليها سياسة خاصة ومصالح وحاجات كدة بس شايف انة مش هو دة الحل معه"
archived = "2007-11-22"
capture_url = "https://web.archive.org/web/20071122185022/http://masr.20at.com:80/newArticle.php?sid=12533"

[[comments]]
order = 2
subject = "الى الاخ واحد من الناس"
text = "قضية عطوه ابو مطوة وحمدي رزق دي قضية صحفية موجودة داخل نقابة الصحفيين<br />ومعذرة ممكن اضرب مثل بنقابة المحامين<br />فيه محامين كبار اوي اوي اوي<br />وفيه محامين صغيرين اوي اوي اوي<br />صح<br />ليه الصغيرين اوي اوي اوي ما بيحقدوش على الكبار اوي اوي اوي<br />لانهم كلهم متخصصين خريجي كلية واحدة اسمها كلية الحقوق وكل واحد عارف حجمه العلمي وعارف تاريخ زميله<br />وقس على ذلك نقابة الاطباء وغيرها من النقابات<br />تعالى بقى في نقابة الصحفيين<br />اول كارثة من كوارث النقابة عدم التخصص<br />اي مؤهل يمشي<br />واللي داخل امبارح بيناطح اللي بقاله خمسين سنه<br />مش زي نقابة المحامين 1) محامي تحت التمرين 2) محامي ابتدائي، 3) محامي استئناف وهكذا<br />لا دا اي كلام اللي داخل امبارح بيعمل مدونة ويسمي نفسه رئيس تحرير وكاتب صحفي كبير ويكون موضوعات من شغل الناس ويكتب عليها اسمه (وانا شفت دا بعيني)<br />الاصلاح يبدأ من اعادة انشاء نقابة الصحفيين من الصفر<br />وتحويلها الى نقابة قوية لصحفيين متخصصين تماما مثل نقابة المحامين<br />وارجو الا يغضب الصحافيين الحاليين من هذا الكلام.<br />انا بقول هذا الكلام لحل الخلاف بين عطوه ابو مطوه وحمدي رزق وغيره من الصحافيين"
archived = "2007-11-22"
capture_url = "https://web.archive.org/web/20071122185022/http://masr.20at.com:80/newArticle.php?sid=12533"

