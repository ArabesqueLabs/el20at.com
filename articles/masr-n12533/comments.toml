subject = "ايه حبيبتى"
author = "ايمان صبحى"
text = "ايه صاحبتى منذ سنوات ونحن فى الروضة ... ومازلنا تكتب هى الشعر وتلقيه واكتب انا القصة والقى الشعر ... مبروك لاية النجاح وادعو لها بالاستمرار ... مبروك مبروك ... يا صديقتى وعقبال الديوان المائة."
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212091246/http://masr.20at.com:80/newArticle.php?sid=12533"
