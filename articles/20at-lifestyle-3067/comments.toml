order = 0
subject = "عبدالله مفتاح"
author = "جميل"
posted = "2007-01-18"
text = "بخصوص الطب النفسي فانا بحب جدا اسمع واظن اني بقدر افرق بين الطبيب النفسي والنصاب النفسي يعني في واحد زي الاخ يحيى الرخاوي لما بسمعه بحس انه محضر التشخيص قبل الحاله لمجرد انه شاف الشكل العام<br />فاما الطبيب النفسي تشخيصه يمكن يتفق او يختلف مع توجهاته<br />واما النصاب النفسي تجد تشخصيه يتفق دائما مع ميوله"
