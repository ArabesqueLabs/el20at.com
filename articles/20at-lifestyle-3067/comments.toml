[[comments]]
order = 1
subject = "سؤال ظريف"
author = "محمد صلاح الدين"
posted = "2007-03-17"
text = "سألت نفسي السؤال دا فى مرة ..<br />بس أعتقد إن إجابته هى ..<br />أكيد \" زميله \" :D<br />يعنى إذا كان دكتور نفسي .. ف أكيد له زمايل و أساتذة دكاترة نفسيين ..<br />أصلاً المفروض إنه عاشان يكون دكتور نفسي .. يكون هو صحيح نفسيـًا ..<br />بس فرضـًا و حصل - و دا شيء عادى بكونه إنسان - ف أكيد حد من زمايله فى المهنة ..<br />بس مين اللى بيعالج الناس العاديين .. من مطباتهم النفسية العادية الحياتية .. من غير دكتور نفسي ..<br />الصديق ..<br />و دى كلمة سحر .. و مفتاح ..<br />محظوظ اللى له صديق ، تؤام روح ، و اللى يستطيع أن يفتح قلبه لصديق ،،<br />عاشان فى ناس مش عارفة تفتح قلوبها للدكتور النفسي ..<br />كلاكيع بعيد عندكو<br />هههههه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "بعد قراءة المقال"
author = "محمد صلاح الدين"
posted = "2007-03-17"
text = "يا محاسن الصدف .. هههههههه<br />أصلى قريت المقال بعد ما كتبت المشاركة اللى فاتت ،، أو كتبت المشاركة اللى فاتت قبل ما أقرا المقال ، و أول ما قريت العنوان .. لأنه - العنوان بس - شد زميله و هو نفس السؤال و اللى دار فى ذهنى قبل كدا .. فحبيت أكتب تعليقي قبل ما أنساه .. أصل أنا كمان بأنسي عاشان عندى إكتئاب و بأتعالج منه .. المهم إنه طلع متفق مع الإجابة المتخصصة .. و دى حاجة بسطتنى أوى<br />جايلك يا أبو هندى<br />ههههههههههه"
archived = "2010-03-14"
capture_url = ""
