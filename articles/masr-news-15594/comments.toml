author = "اجراء قضائى عادى"
posted = "2010-03-04"
text = "فى حكم الاعدام يعتبر هذا اجراء روتينى وسيتم اعادة المحاكمة وسيصدر حكم من محكمة تانية اخرى نهائى<br />والسؤال هو - هل اذا حكمت محكمة تانية بالاعدام - السيد رئيس الدولة هيصدق على الحكم<br />واحنا عارفين انة كان قريب تانت"
