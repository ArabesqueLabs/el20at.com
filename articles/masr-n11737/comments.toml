subject = "باعشق عالم ديزني من صغري"
author = "Dabdoob"
text = "عالم ديزني<br />عالم ديزني عالم سحري يمثل حياتنا بطريقة رمزية كاريكاتورية بسيطة ولذلك فهو ممتلئ بالشخصيات الثنائية فمثلا عبقرينو شخص مخترع فلن تجد له اي صفات سوي انه يخترع فلا يملك حياة شخصية مثلا وزيزي هي نموذج المرأة الاجتماعية الجميلة النشيطة (المستغلة أحيانا) وبندق هو الشخص الغبي ذو القلب الطيب جدا والمثير للاهتمام انه يتحول الي سوبر بندق ليعبر عن قيمة الشخص الطيب في خدمة المجتمع بغض النظر عن مستوي ذكائه اما عم دهب فهو رمز بسيط لشخص غني وبالتالي فهو يقدم الصورة الأولية للشخص الغني البخيل شخص يمتلك مخزنا مليئا بالنقود و يرتدي نفس الملابس القديمة و بقدم اقل المرتبات للعاملين ( 30 قرش للساعة كان اجر بطوط في كثير من القصص!!) أما الأشرار مثل عصابة القناع الأسود وسونيا ودنجل فلا هم لهم سوي الشر. باختصار هي كلها صور بسيطة لأنواع البشر ولا توجد شخصية مميزة حقا سوي بطوط لأنه ببساطة رمز الشخص العادي الذي لا يمتلك أي قدرات مختلفة أو خارقة بل علي العكس تماما يميل الي الاسترخاء ويتمني جني الأرباح دون تعب.<br />وتتألق عبقرية ديزني في رسم الشخصيات حين يضفي مسحة مرحة خفيفة الظل علي كل الشخصيات حتي الشريرة منها لاضفاء جو من الألفة والحميمية علي القصص حتي ولو كان خلق هذا نوعا من التناقض أحيانا فتجد عصابة القناع مثلا تخطط بذكاء كبير ثم يرتكبون أغبي الأخطاء الممكنة!!<br />في النهاية تجدر الاشارة الي عشرات الاقتباسات والتأثيرات بل والسرقات احيانا من عالم ديزني في أدبنا العربي مثل سلسلة فلاش مثلا التي ببساطة كانت ترجمة لعالم ديزني فميدو هو النموذج المقابل لميكي وأخته سوزي تقابل ميني وبندق هو البحار الغبي وعبقرينو هو المخترع ...(نسيت اسم الشخصية في فلاش) والاسوأ انه نقل نفس النهج في رسم الشخصيات فمثلما كان محظوظ رمز الشخص المحظوظ كان سرور رمز الشخص المتفائل وعباس رمز الشخص العبوس و حريص رمز الشخص الحريص!!!! ايه يا عم الابداع المصري ده!!!!<br />فعلا محتاجين نتكلم كتير قوي عن عالم ديزني لانه عالم جميل قوي<br />وسلام<br />Dabdoob"
archived = "2007-10-11"
