subject = "والله حاجة جميلة"
author = "أبوالمعالى فائق"
posted = "2008-06-10"
text = "إيه رأيكم نقوم بتطبيق تجربة توزيع الكروت على المنازل ، قيا سا على توزيع الخبز وكل شارع له كارت ، والحمد لله الكل تساوى طوابير عيش وطوابير كورة وعلشان هناك علاقة تدوير وتكوير بين العيش والكورة أقترح أن لا يحصل على كارت الجزيرة إلا كل فرد يكون قد تم القبض عليه فى سوهاج ولففوه كعب داير وبكده تبقى الحكومة حققت العدالة بين المواطنين فى توزيع التدوير أنا عارف محدش فاهم حاجة ولا أنا وجتنا نيلة فى هيافتنا وياشماتة الحكومة فينا آه لو الدكتور نظيف شاف طابور الكروت المشفرة أنا خايف يسلط واحد من أعضاء سيد قراره للمطالبة برفع الدعم عن الرغيف .0103067092"
