posted = "2008-09-12"
text = "يا بخت البنات الخيبانة المنحلة اللى ما كلوش تعليم و لا تعلم الادب؟<br />حبة احضان و قبلت و تنهدات ؟<br />و من ثم فى يوكم و ليلة تصبحكم يدعون على انفسهم قال ايه؟(فنانين)<br />بالذمة دة كلام و لا دى تبقى سرقة و نصب و دعارة؟!!!!<br />و احدة من اياهم بتاخد 7000000 جنية فى حبة مرقعة امام الشاشة؟<br />امال تاخد كام مليار جنية عندما يذهبون الى بلاد الخليج اياها و يعملوا الحاجات الابيحة اياها فى اوض النوم؟<br />صحيح زمن خلع الملابس التحتانية و الحاجات الابيحة اياهابقى مقنن و بيسموه ا ايه(فن9<br />اللة يلعن ابو ميتين ابوكم يا كلاب نجسة رخيصة!!!!!"
