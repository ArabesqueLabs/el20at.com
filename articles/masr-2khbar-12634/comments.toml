author = "غبى منة فية"
posted = "2009-07-13"
text = "هى جات على المولد<br />طيب يا سعادة المحافظ اية رايك فى زحام المترو الخانق<br />والسينما المغلقة والمملوءة بالبشر<br />واسواق الخضار وزحام العتبة وشارع الازهر<br />اللة يخرب بيوتكم<br />هتمنعوا الاحتفال بمولد ال البيت<br />ان شاء اللة قبل المولد الجاى هتكون فى جهنم ويكون ربنا قصف عمرك"
