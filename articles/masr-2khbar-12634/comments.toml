author = "وسنحتفل"
posted = "2009-07-13"
text = "وسنحتفل بمولد السيدة<br />ونحىى الليلة<br />ونولع لها الشمع<br />ونقيم الذكر<br />ونقرا لروحها الفاتحة<br />وسنشترى لاطفالنا البلونات والطرابيش والطراطير<br />وليذهب الوهابيون الى جهنم"
