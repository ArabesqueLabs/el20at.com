[[comments]]
order = 1
subject = ""
author = "الى المعلق السابق"
posted = "2009-07-13"
text = "انت فعلا غبي منه فيه<br />لاننا المسلمون مأمورون بتباع النبي محمد صلى الله عليه وسلم في تصرفاته وافعاله<br />وحب النبي صلى الله عليه وسلم وال بيته في اتباع سنته صلوات الله وسلامه عليه والامتثال فيما امر به النبي والانتهاء فيما نهى عنه النبي<br />والنبي محمد صلى الله عليه وسلم لم يأمر بمثل هذه الاحتفالات والبدع والمقابر<br />سلام يا صاحبي<br />حبي ال البيت باتباع النبي محمد صلى الله عليه وسلم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = ""
author = "خلاص يا عم"
posted = "2009-07-13"
text = "بكرة هنشترى جمل او ناقة نركبة اتباعا للنبى صلى اللة علية وسلم<br />وبكرة هنرمى الملاعق والشوك وناكل بايدينا برضة اتباعا<br />وهنجيب مغزل زى غاندى ونغزل ثيابنا اصل مكائن الغرب الكافر هى اللى بتعمل الملابس<br />وهنرجع نكتب على جلد المعيز وجلد الغزلان اصل الورق بدعة<br />اما الكهرباء فرجس من عمل الشيطان وشر الامور مستحداثتها وهنولع ركية نار نشوف عليها<br />اما البوتاجاز فهنرمية من الشباك وهنطبخ على الخشب او الحطب اسوة بسيدنا النبى<br />وهنشرب لبن الناقة والمعيز اما البقر والجاموس فملعون<br />والمترو والسيارة والباص من المحظورات فلم يثبت ان النبى ركبها وهى من البدع المستحدثة<br />سلام"
archived = "2010-03-14"
capture_url = ""

