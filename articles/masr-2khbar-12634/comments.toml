[[comments]]
order = 4
subject = ""
author = "اما لهم الوهابيين"
posted = "2009-07-13"
text = "ثم إن غالب هذه الاحتفالات بالموالد مع كونها بدعة لا تخلو من اشتمالها على منكرات أخرى ؛ كاختلاط النساء بالرجال ، واستعمال الأغاني والمعازف ، وشرب المسكرات والمخدرات ، وغير ذلك من الشرور ، وقد يقع فيها ما هو أعظم من ذلك وهو الشرك الأكبر ، وذلك بالغلو في رسول الله صلى الله عليه وسلم ، أو غيره من الأولياء ، ودعائه والاستغاثة به وطلبه المدد ، واعتقاد أنه يعلم الغيب ، ونحو ذلك من الأمور الكفرية التي يتعاطاها الكثير من الناس حين احتفالهم بمولد النبي صلى الله عليه وسلم وغيره ممن يسمونهم بالأولياء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = ""
author = "بدعة اختلاط الرجال ب"
posted = "2009-07-13"
text = "بيقول لك بدعة اختلاط الرجال بالنساء<br />وكان النساء لا يختلطون بالرجال فى المكاتب والمصانع واماكن العمل والقطارات ومحدش بيلمسهم او يقرب منهم<br />ونسوا انهم شاهدوا فى حرب العراق نسوان تقود ال اف 16 وتطير من فوق حاملة الطائرات وتضرب الجيش العراقى<br />وكاننا تجمدنا عند مجتمع قبيلة بدوية حينما كان الرجل يرى كعب بدوية كان بيعملهم على نفسة ويهيج زى الحمار<br />الوهابيون الصورة القبلية الجافة البعيدة عن الدين اللى بتقول قبل ماتكلم احد فيهم يقول لك حرام وبدعة<br />الاسلام جميل وبسيط ودين الفطرة وبلا كلكعات ويقول ان اللة احل لكم طيبات الدنيا فلماذا نحرم نفسنا منها لماذا نحرم انفسنا من الطيبات التى احلها اللة لماذا لا نفرح بعيد ميلاد شخصية دينية قدوة ونقول لاطفالنا لقد جاهدوا فى الدين وانتصروا<br />لماذا لا نحتفل بالسيدة زينب والحسين والسيد البدوى واحمد الدسوقى وسيدى جابر والمرسى ابو العباس<br />وفيها فرح وفيها منافع لبعض الناس فيبيعون ويشترون ونخرج من حالة الكاءبة التى نعيشها"
archived = "2010-03-14"
capture_url = ""

