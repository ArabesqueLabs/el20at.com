order = 0
subject = "اشفق على اللواء (وزير الداخلية)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-02-11"
text = "نعم انا اشفق على اللواء (وزير الداخلية)حقا<br />لقد كان اسدا و مع مرور السنوات اصبح اسدا حكيما و لكن بدات أسنانة تسقط بمرور الازمات الخطيرة التى واجهاعندما امسك بزمام وزارة الداخلية<br />وزارة الداخلية تحتاج من وزيرها ان يديرها بيد من حديد<br />اصبحت وزارة الداخلية للاسف الشديد بؤرة من بؤر الفساد و التراخى و المجاملات و مراكز القوى التى سوف عن قريب سوف تجهز على وزيرها الاسد<br />شعب مصر يريد ان يرى ايدى اللواء وزير الداخلية و قد نظفت الوزارة من مجموعات الضباط الذين يعبثون فسادا فى المجتمع محتمين بمناصبهم<br />انهم اسياد و ملوك و باشوات الوطن الذين حان الوقت لقطع رقابهم بالقانون؟<br />نعم بالقانون و حدة سوف تقطع رقاب هؤلاء الباشوات الرضع؟"
archived = "2009-02-14"
capture_url = "https://web.archive.org/web/20090214124814/http://masr.20at.com:80/newArticle.php?sid=19911"
