author = "محمد...العربى"
posted = "2009-09-27"
text = "الى الاخ الفاضل الذى لعن عبد<br />الناصر رحمة الله عليه وعلي كل حاكم فى ذمة الله كان او من اهل الدنيا<br />اعلم انه لو اصطلحت الرعيه مع ربها لاصطلح الراعى(الحاكم).....<br />يرحمنا ويرحمك الله وتذكر قول الرسول صل الله عليه وسلم..فيما معتاه<br />اذكروا محاسن موتاكم.....وقوله..لاتسبوا موتاكم..صدق رسول الله<br />ويكفيه من الحسنات بناء السد العالى وكلنا نعلم فوائده<br />وخيراته التى عادت ومازالت......رحمة الله علييك ياجمال"
