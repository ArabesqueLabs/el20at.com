order = 0
subject = "أول الفتن قتل عثمان، وآخر الفتن خروج الدجال،"
author = "منقول"
posted = "2008-05-03"
text = "أول الفتن قتل عثمان، وآخر الفتن خروج الدجال، والذي نفسي بيده لا يموت رجل وفي قلبه مثقال حبةٍ من حُبِّ قتل عثمان إلا تبع الدجال إن أدركه، وإن لم يدركه آمن به في قبره\"(2).<br />لقد كان الخروج على عثمان رضي الله عنه وقتله أعظم فتنةٍ ابتلي بها المسلمون في صدر هذه الأمة، ورغم أن عمر أفضل من عثمان وهو مقتول أيضاً؛ فإن قتل عثمان كان أشدَّ وطأةً على المسلمين، رضي الله عنهما وأرضاهما؛ فقاتل عمر رضي الله عنه فرد مجوسي كافر، أكله الحقد،وأعماه الحسد، وما ادعى بقتل عمر إصلاحاً.. أما قتلة عثمان فمسلمون داخلتهم الشبهات، وتشربتهم الفتن والأهواء، في جمع غفير من الرعاع والدهماء، زعموا بالخروج على الخليفة وقتله صلاح المسلمين، وهو الفساد عينه!!."
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506061310/http://masr.20at.com:80/newArticle.php?sid=15550"

[[comments]]
order = 1
subject = "اية دخل الدجال وبتاع العيال فى خراب بلد وانتشار ال"
author = "زعبور"
posted = "2008-05-04"
text = "اية اللى دخل الدجال فى ركوب واحد مستبد جاهل الحكم وكل شوية فارض علينا مراتة وابنة<br />يكونش مراتة البريطانية فاطمة الشريفة<br />وابنة الحسين من ال البيت<br />يا اولاد الكلب اختشوا<br />دا رئيس الجمهورية موظف وظيفة عامة يتولاها الاصلح ومش بيحكم بعقد الهى ومفوض من السماء<br />دا ما نزلش علية القرأن<br />اية اللى جاب الدجال وابو رجل مسلوخة وامنا الغولة<br />البلد انباعت<br />اسرائيل بتاخد وقود غاز من حكومة مصر ببلاش<br />دعما للمواطن الاسرائيلى المسكين"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506061310/http://masr.20at.com:80/newArticle.php?sid=15550"

[[comments]]
order = 2
subject = "رد على اول الفتن واخر الفتن"
author = "mohdira"
posted = "2008-05-04"
text = "انا انصح هاد العالم الفقيه<br />لان كلامه مثل الرغوى عبارة علا فقاعات ملياة بلهواء<br />يمكن ان تصلح للعب مع الاطفال الصغار اقل من 3 سنوات<br />تمنيت انك على الاقل عرفت كيف تستر نفسك<br />ولى تتدخل في شاون الكبر الدين لو لاهم وتقديرا لههم لاسمعتك ملى يرضي العباد<br />اتمنا انك تستوعب ما نصحتك به انت وامثالك<br />النصر لاشعب المصري<br />اخوكم من المة العربية"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506061310/http://masr.20at.com:80/newArticle.php?sid=15550"

[[comments]]
order = 3
subject = "سؤال !!"
author = "حسين كامل"
posted = "2008-05-04"
text = "سؤال , هل غلاء الأسعار يجتاح مصر فقط بل يجتاح جميع دول العالم !! غلاء الاسعار يجتاح جميع دول العالم ومع ذلك لم نشاهد شعب من شعوب تلك الدول ارتدى الملابس السوداء او نظم اضراب !! الدول الاوروبية تعانى من ارتفاع الاسعار , الدول العربية بدون استثناء تعانى من الغلاء , دول الخليج شهدت ارتفاع جنونى فى الاسعار شمل كل شى لدرجة ان العاملين بتلك الدول قاموا بترحيل اسرهم حتى يتمكنوا من العيش وسط الارتفاع الجنونى للاسعار !! اذن مصر كغيرها من الدول تعانى من ارتفاع الاسعار العالمى ولكن لماذا نسمع اصوات المعارضة فى مصر بينما لا نراها فى باقى الدول !! السبب ان الحكومة تراخت فى مواجهة الاخوان المتأسلمين والعملاء والخونة فهولاء يتربصون بمصر وشعب مصر وامن مصر وينتظرون الفرصة لكى يغرسوا خناجرهم فى صدر الوطن . هولاء يتمنون الفوضى والدمار والتخريب والسرقة والقتل والنهب والدليل حينما فشل اضراب السادس من ابريل اصيبوا بخيبة امل وخرجوا على مواقع الانترنت يسبون الشعب الذى رفض الاضراب ولكن فى اليوم التالى تبدل الحال وانتشوا حينما عم الخراب والدمار مدينة المحلة الكبرى فهذا هو املهم وهذا هو حلمهم ان تحترق كل مصر مثلما احترقت المحلة الكبرى !! لذلك اتمنى من الحكومة المصرية واتمنى من الرئيس مبارك ان يقدم كل من شارك او حرض على الاضراب الى المحاكم العسكرية , اتمنى ان تتم معاملة مهدى عاكف الذى قرر المشاركة فى الاضراب معاملة تلك الفتاة التى تدعى اسراء والتى نظمت الاضراب السابق واتمنى من الحكومة ان تنتزع الريشة التى وضعتها على راس مهدى عاكف فلا فرق بين عاكف واسراء امام القانون .. واخيرا تحية من القلب الى رجال الدين اللذين حرموا الاضراب , تحية الى اقباط مصر وكنائسهم التى رفضت الاضراب , تحية الى كل صحفى حر وشريف كتب كلمة يحارب فيها الاضراب , تحية من القلب الى كل مصرى شريف سوف يخرج اليوم ويظهر فى شوارع القاهرة ليكون ظهوره فى شوارع القاهرة هو خير دليل وخير شاهد على فشل الاضراب ."
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506061310/http://masr.20at.com:80/newArticle.php?sid=15550"
