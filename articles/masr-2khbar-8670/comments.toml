subject = "الشعب المصرى كلة محبوس"
author = "محبوس"
posted = "2008-04-03"
text = "دى يا محترم عملوا البلد كلها سجن<br />على راس الحارة عربية الامن المركزى واقفين وفى ايديهم العصيان كانهم واقفين على باب الزنزانة<br />يبقى دور عبادة اية<br />ماهى جوة السجن<br />مليون ونصف عسكرى امن مركزى<br />لو سرحناهم هيبقى فى البلد فلوس كتير ومش هيبقى ازمة فى العيش"
