author = "الدميرى"
posted = "2008-02-13"
text = "والله فى ناس مسلمين سنهم وصل50 سنه ومش بيعرفوا يتوضوا......<br />فما بالك باولادهم<br />الغريب ان اهل الغرب لما بيسمعوا عن الاسلام بيدخلوا فيه على طول<br />يا احبابنا اللى ماسك الاعلام الغربى هم اليهود منتظريين انهم يشكروا فى المسلمين ودينهم<br />الى يعرف يعمل حاجه لازم يعملها<br />المشكله ان احنا فاكريين ان الدين ده له ناسه اللى يدافعوا عنه ويحموه طب وانت من انه دين<br />الامر بالمعروف والنهى عن المنكر وتقديم النصائح للمسلمين كلها امور واجبه (فرض)على كل مسلم<br />بهذا كان للامه الافضليه(كنتم خير امة اخرجت للناس تامرون بالمعروف وتنهون عن المنكر وتؤمنون باله........)ال عمران<br />فاعرف دورك واثر فى مجتمعك علشان انت ربنا اختارك مسلم ولو حتى كنت بتعمل غلط كتيييييير<br />لان القاعده الفقهيه بتقول (مالا يدرك كله لا يترك كله*)"
archived = "2010-03-14"
