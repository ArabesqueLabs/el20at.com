[[comments]]
order = 0
subject = "الحمد لله"
author = "مصرية"
text = "يا سيدى متزعلش نفسك اوى كده<br />وزعلان ليه ع السينما<br />وبتعتبر ان ده تخلف انكم معندكمش السينما متطوره ؟؟!!<br />بالعكس انتوا هتتخلفوا اكتر لما السينما تتقدم وتبعدوا عن شرع ربنا<br />سينما ايه اللى مزعلاك اوى كده !!!!!<br />اه انا عارفه ان مصر متقدمه جا فنيا ولكن ده يهمنا فى ايه اذا كان بيبوظ الشباب وبيعدهم عن الاخلاق والقيم الاسلاميه<br />بما يعرض فى هذه الافلام مما يخالف الشرع<br />انا افتخر ببلدى اه بس لانها متقدمه مثلا علميا او لان فيها الازهر<br />لكن افتخر بيها فنيا !!!!!! والله ابدا<br />ده وباء وبلاء<br />احمدوا ربنا يا سعوديين ان معندكمش سينما وفوقوا فكروا فى تطوير التعليم عندكم بدل ما تفكروا فى السينما<br />مع احترامى لكل اخوانا وحبايبنا السعوديين بس دى نصيحه ارجو تتقبلوها منى<br />والسلام عليكم"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120355/http://masr.20at.com:80/newArticle.php?sid=11524"

[[comments]]
order = 1
subject = "القادسية واليرموك ام مهرجانات السينما"
text = "يا عم رجا اعقل شوية بلاش هبل<br />ما قرأتش كلام سيدنا عمر (نحن قوما اعزنا الله بالاسلام فاذا ابتغينا العزه في غيره ازلنا الله)<br />يا ابني شوف العرب عندهم كام جامعة في الدول العربية<br />والبترول العربي بيضح كام مليار كل يوم<br />ومع ذلك نحن في ذيل القائمة العالمية<br />بدل ما تفكر في مهرجانات السينما فكر ازاي نرجع تاني امة محمد صلى الله عليه وسلم ونشرف ديننا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120355/http://masr.20at.com:80/newArticle.php?sid=11524"
