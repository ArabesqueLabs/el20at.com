[[comments]]
order = 6
subject = "تكية الحرامية"
author = "من الدراويش"
posted = "2008-01-28"
text = "واحسن فيلم شفناة باللون الاسود والمنيل هو فيلم تكية الحرامية<br />بطولة الحرامى الاول اللى عمل 60 مليار جنية فى عشر سنين من الحديد<br />والحرامى فوق القانون وتحت القانون وفى المجلس بيفصل قوانين<br />وفى نهاية الفيلم بيقف البطل ويقول انا مع مهدود الدخل ( محدود الدخل ) لغاية ما اطلع روح امة"
archived = "2008-01-31"
capture_url = "https://web.archive.org/web/20080131084912/http://masr.20at.com:80/newArticle.php?sid=14007"
