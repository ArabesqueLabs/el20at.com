subject = "استفاد كثيرا من مسلسل عباس الابيض"
posted = "2008-01-28"
text = "المهم ان مسلسل عباس الابيض من اسخف وارزق المسلسلات اللي اتعملت في مصر<br />مسلسل غبي جدا<br />لكن حنعمل ايه في الشغب المصري مسلوب الارادة اللي عمال يتفرج وبس"
archived = "2008-01-31"
capture_url = "https://web.archive.org/web/20080131084912/http://masr.20at.com:80/newArticle.php?sid=14007"

