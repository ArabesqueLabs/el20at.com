subject = "جائزة أحسن ممثل شاب في بدايتك مشوارك .. ماذا تمثل"
author = "مش بحبك"
posted = "2008-01-28"
text = "ايه رايكم ما تيجي نعمل جوائز للعاطلين عن العمل<br />1) جائزة افضل طبيب عاطل عن العمل<br />2) جائزة افضل محامي عاطل<br />3) جائزة افضل محاسب عاطل<br />وهكذا"
archived = "2008-01-31"
