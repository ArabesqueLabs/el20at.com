subject = "شكر للأخت (مسلمة)"
author = "علاء"
posted = "2007-10-14"
text = "شكراً لك إختي الغالية (مسلمة) على التعليق الرائع الذي يدل بدوره على رقي الإسلام وحضارته<br />وأنا من جهتي مسيحي وأحترم الدين الإسلامي وأحترم النبي محمد (ص) كما أنني أحترم كل الأديان السماوية والأفكار التي لا تحض على نبذ الأديان الأخرى والتكفير والقتل والإرهاب<br />شكراً لك مرة إخرى<br />وتحياتي الحارة لك"
