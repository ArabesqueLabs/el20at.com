text = "موضوع رائع واحترم جدااااااااااااااااااااااااااااااااااااااااااااااااااا ان يكون رغبة غير المسلم فى الجلوس على مائدة الافطار هو رغبتة فى الشعور بالروحانيات العظيمة التى يستشعرها المسلمين ويتعلم ويعرف ما هو الاسلام ولكنى اعتقد ان بعضهم يجلس من باب التوفير الحمد لله على نعمة الاسلام وكفى بها نعمة اللهم الف بين قلوبنا واجعل الرحمة بيننا"
