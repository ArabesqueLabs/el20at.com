subject = "ليهتدي الضالين"
author = "علاء"
posted = "2007-10-05"
text = "إلى الأخ (عبد الله)<br />هل تطلب الهداية للأديان الأخرى وأنت لم تهتدي بعد ؟؟؟<br />أنسيت أنك تطلب الهداية كل يوم 5 مرات ولم تحصل عليها بعد ؟؟؟<br />بِسْمِ اللّهِ الرَّحْمـَنِ الرَّحِيمِ<br />الْحَمْدُ للّهِ رَبِّ الْعَالَمِينَ<br />الرَّحْمـنِ الرَّحِيمِ<br />مَـالِكِ يَوْمِ الدِّينِ<br />إِيَّاكَ نَعْبُدُ وإِيَّاكَ نَسْتَعِينُ<br />اهدِنَــــا الصِّرَاطَ المُستَقِيمَ<br />صِرَاطَ الَّذِينَ أَنعَمتَ عَلَيهِمْ غَيرِ المَغضُوبِ عَلَيهِمْ وَلاَ الضَّالِّينَ<br />من كل قلبي أدعو لك ولمن مثلك بالهداية ..."
archived = "2010-03-14"
