[[comments]]
order = 5
subject = "تعليق و كلمة ل علاء"
author = "نوال"
posted = "2007-10-15"
text = "الموضوع جميل جدا حقا و جمع اراء كل من لهم صلة بالموضوع فبارك الله فيكم<br />الاخ علاء ،، بصراحة فاجأني ردك على الاخ عبدالله بس بعد ان ذكرت انك مسيحي ادركت سبب كلامك :-)<br />لا بأس يا علاء ، ما قصده الاخ عبدالله واضح جدا و ليس فيه تهجم على الاديان الاخرى و اتباعها و ليس فيه اي تكفير<br />ما قاله الاخ عبدالله ببساطة انه يتمنى الهداية لكل الضالين ، فمن قال انه في كلامه يقصد باقي الاديان فقط ؟ الضالين هم من ضلوا عن طريق الصواب .. قد يكونوا من الاديان الاخرى و قد يكونوا ايضا مسلمين كل ما لهم من الاسلام اسم فقط و لا يتصرفون كالمسلم الحقيقي .. فهو هنا يطلب الهداية لكل الناس ان يهتدوا للطريق الذي يرضاه الله لهم<br />هذه النقطة الاولى ، اما النقطة الثانية ، نحن كمسلمين نرى ان الطريق الذي ارتضاه لنا الله هو الاسلام ، (و رضيت لكم الاسلام دينا) لذلك الاخ عبدالله بعكس ما ظننت يحب الخير للاخرين و يتمنى ان يهتدوا لخير الطرق لكي يفوزوا برضا الله و بالجنة و الخير في الدنيا .. نحن نحب الخير لكل الناس و نريد لهم الخير و الهداية .. الهداية عندنا هي الاسلام ، و اعتقد انه الهداية عندكم ان يكون المرء مسيحي (وقالوا لن يدخل الجنة إلا من كان هودا أو نصارى ) يعني اليهودي يقول انه مش هيدخل الجنة الا اليهود لانهم على حق و لانصارى برضه نفس الشئ ، و هذا تفكير مقبول منا و منكم لان كل طرف يرى انه هو على حق .. و الا لما كان رجال الدين عندكم يبعثون ارساليات للتبشير بالدين المسيحي في افريقيا و غيرها لماذا لانهم يرون انهم على حق و باقي الاديان ضالين و واجبهم هدايتهم ... تفكير و احد و لكن لا يمنعنا الاختلاف من ان نحترم بعض و نحن هنا ليس لنجادل في من على حق و من على باطل يا علاء ، و الاخ عبدالله لم يوجه اهانة لاي ديانة ، (لكم دينكم و لي دين) بل قال رأيه بكل وضوح و كل صراحة و كل احترام :-) و كل ديانة لها أسسها و احد اسس كل الديانات السماوية التسامح و قبول الاخر ، انا من المعجبين جدا بالممثل تيم روبينز مش بتمثيله بس بل لقوته في اراءه السياسية و لانه له انشطه كثيرة في دعم البرامج الخيرية و الانسانية و الحريات الدينية المختلفة :-) يعني تعجبني همته بصراحة انا من اشد المعجبين به و احترمه اكثر من كثير من الممثلين المسلمين اللي لا يؤدون رساله للمجتمع .. و لا يساهمون بفكر و لا عمل ..<br />أما السورة القرانية التي ذكرتها (الفاتحة ) لا استطيع انا او انت ان تحكم ان عبدالله او غيره لم يهتدي بعد ؟ نحن الحمدلله نقرأ هذه السورة يوميا 5 مرات ( تثبيتا )على الهداية و تذكيرا لانفسنا بالنعمة التي انعمها الله علينا و هي الاسلام و طلب يومي من الله بالهداية لأن القلب غير ثابت يا علاء هذا ما تعلمناه ، القلوب تتقلب و بين لحظة و لحظة قد يضل الانسان لذلك نحن نذكر انفسنا و نداوم على الدعاء بالهداية من رب العالمين ، و مثال نحن ايضا يوميا ندعو الله بان يرزقنا الصحة مع اننا اصحاء ؟؟؟ ( الله ارزقنا الصحة و العافية ) و لكن هو استمرار للدعاء من ب العالمين بدوام الصحة ... و على فكرة سورة الفاتحة فيها تفصيل جميييييل جدا و فيها تفسير لكل اية لماذا نرددها يوميا و بهذا التسلسل .. رائع ان استطعت ان تحصل على التفسير<br />اتمنى لك كل خير يا رب و اتمنى لي و لك الهداية و دوام الصحة ، و تشرفت بالكلام معاك عيدكم سعيد"
archived = "2010-03-14"
