subject = "الاسلام دين محبة وخير"
author = "مسلمة"
posted = "2007-10-11"
text = "حسن المعاملة في الاسلام لم تقتصر على المسلمين بل امتدت لغير المسلمين ،و إني لا أرى أي ضير في مشاركت غير المسلمين لموائد إفطار المسلمين قد يكون هذا بابا لدخولهم للإسلام ،و قد يتعرف الغير مسلمين على حقيقة الاسلام و سماته و احترامه للناس كافة بغض البصر عن ديانتهم أو جنسهم أو لونهم ....."
