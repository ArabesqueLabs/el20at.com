[[comments]]
order = 0
subject = "زمان كان فية قسم فى كلية الهندسة فى قسم العمارة اسمة تخطيط مدن - نعم قسم تخطيط مدن"
author = "شقلب مقلب"
text = "هذا القسم كان بيخرج عشرات من مهندسى تخطيط المدن وكان لا يوجد فى مصر حاجة اسمها عشوائيات<br />هذا القسم خطط لمدينة نصر والعباسية ومصر الجديدة حينما كانوا صحراوات قاحلة وخطط لمدينة او حى المهندسين ايام ناصر وكانت ارض زراعية<br />اما وقد تلاشت الحكومة او انهارت الحكومة بكل مؤسساتها وتوالى السادة اللواءات رؤساء احياء ومحافظين وحكام مدن وتولوا رئاسة مرافق المياة والنقل واصبحوا يخططون الاحياء الجديدة والنتيجة كل العشوائيات التى نتجت فى العصر المباركى المبارك<br />الناس دى كانت بتبنى ازاى وبتصريح من مين<br />وازاى خدمات الكهرباء والمياة كانت بتوصل للعشش دى<br />وبعدين لما تحصل المصيبة نقول عشوائيات - طيب كنتم فين<br />التجمعات السكانية دى مش عايزة وظايف وخدمات وتعليم ومصانع<br />يبقى السؤال هل بصحيح عندنا حكومة زى بقية الدول والا العملية ديكور ومنظرة<br />الناس دى هتولع فى البلد فى يوم قريب"
archived = "2008-09-28"
capture_url = "https://web.archive.org/web/20080928204002/http://masr.20at.com:80/newArticle.php?sid=17739"

[[comments]]
order = 1
subject = "بصراحه لازم عمر خالد يحكم البلد دي"
author = "مش ححبك"
text = "بصراحه ومن غير زعل ومع احترامي لكل من تسول له نفسه ان يكون حاكم زي المرشد العام وايمن نور وجمال مبارك ومعرفش مين<br />احق الناس بحكم هذه البلد هو عمرو خالد<br />عمرو خالد لازمن يجلس على كرسي الرئاسة اذا كنتم عايزين حال البلد دي ينصلح<br />والله على ما اقول شهيد"
archived = "2008-09-28"
capture_url = "https://web.archive.org/web/20080928204002/http://masr.20at.com:80/newArticle.php?sid=17739"
