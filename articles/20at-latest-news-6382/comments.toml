subject = "روسيا  موسكو"
author = "سعيد فيصل حسن"
posted = "2008-09-25"
text = "سياسي عراقي سابق عالق في روسيا الاتحادية<br />الكاتب : العراق للجميع | أضيف بتاريخ :09-08-2008 7:59:30 PM | [ قراءة : 35209 مرة ]<br />سياسي عراقي سابق عالق في روسيا الاتحادية<br />سياسي عراقي سابق عالق في روسيا الاتحادية<br />ايهاب سليم-صحفي مستقل-السويد-تقرير-9/8/2008:<br />سعيد فيصل حسن السلطاني,56 عاما, سياسي عراقي سابق كان يعمل امين مخزن في ديوان الرئاسة السابق ضمن مهمات القصر الجمهوري,حاز على كتاب تثمين الجهود المرقم 2995 عام 1987من قبل الرئيس العراقي السابق صدام حسين,قرر السلطاني تقديم استقالته من العمل رسيما ضمن الكتاب المرقم 5162 عام 1993.<br />بعد معاناة مريرة في العراق,قرر السلطاني التوجه الى روسيا الاتحادية عام 1994 طالبا اللجوء فيها ولاسيما ان العراق كان يمر بأوضاع مأساوية,الا ان على ما يبدو جرت عملية تزييف في الاقوال من قبل المترجمة العراقية اثناء مقابلة المحامي على حد قول السلطاني,ادى ذلك الى رفض طلب لجوءه من قبل المفوضية العليا لشؤون اللاجئيين التابعة للامم المتحدة.<br />اكمل السلطاني قائلا:تقدمت باكثر من عشرين شكوى الى المفوضية العليا لشؤون اللاجئيين الا ان المفوضية العليا تؤكد بعدم وجود هذه الشكاوي في ملف طلب لجوءه!<br />اضاف السلطاني قائلا:الادهى من ذلك انهم سجلوني اعزب رغم اني متزوج ولدي اولاد وهم يعيشون في روسيا بأوراق ثبوتية قانونية صادرة من الامم المتحدة بعد قبول طلبات لجوءهم.<br />عائلة السلطاني منهم شقيقه العقيد الركن في الجيش العراقي السابق وشقيقته العاملة في الخطوط الجوية العراقية سابقا وباقي افراد اسرته قد غادروا العراق الى بلدان اخرى بعد تلقيهم تهديدات مباشرة من قبل الميلشيات المدعومة من ايران.<br />اختتم السلطاني مناشدا المنظمات والهيئات الدولية ايجاد له حل سريع ولاسيما انه يعيش منذ اربعة سنوات داخل شقته على نفقة اولاده واصدقاءه دون التمكن من التسوق او التوجه الى المستشفيات الرسمية في روسيا الاتحادية او حتى عدم القدرة للعودة الى العراق وذلك لخشيته من الاستهداف المباشر من قبل الميليشات المدعومة من ايران على حد قوله.<br />Iraqi political man appeal in Russia<br />Ihab Salim- independent journalist-Sweden-Report-9/8/2008:<br />Said Faisal Hassan AL-Sultany,56 years,a former Iraqi political man who worked Treasurer<br />in the former Presidential Office within the Republican Palace,he got the book value the efforts No. 2995 in 1987 by former Iraqi President Saddam Hussein,AL-Sultany decided to submit his resignation from his post within the book No.5162 in 1993.<br />After suffering a difficult in Iraq,AL-Sultany decided go to Russia in 1994 requesting asylum because that Iraq was going through a tragic situations,but it seems that process took place in the falsification of statements by the Iraqi translator during an interview lawyer according to AL-Sultany said,this led to the rejection of his asylum request by the High Commission for Refugees of the United Nations.<br />AL-Sultany said:I was given twenty filed a complaint to the Office of the High Commissioner for Refugees but the High Commission stresses that there is no such complaints on file a request for asylum!<br />AL-Sultany added:Harder than that,they wrote at i am single although I am married and i have children,they live in Russia according to the legal identity papers issued by the United Nations after accepting requests for asylum!<br />AL-Sultanie\\'s family including his brother Colonel corner of the former Iraqi army and his sister working in the former Iraqi Airways and the rest of his family members had left Iraq to other countries after receiving direct threats by militias backed by Iran.<br />AL-Sultany appealed to international organizations to find a quick solution,especially he lived for four years inside his apartment at the expense of his children and friends,he can not to the shopping or go to the hospital official in Russia,he is unable to return to Iraq because of fear of direct targeting by militias backed by Iran,According to AL-Sultany said"
