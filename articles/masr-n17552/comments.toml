[[comments]]
order = 0
subject = "وبعد عرابي وكامل جه جمال عبدالناصر"
author = "مش ححبك"
posted = "2008-09-12"
text = "جه جمال عبدالناصر والاخوان المسلمين ما سكتوش قالوا مااحناس لاعبين ومسك جمال عبدالناصر في خناق الاخوان لحد ما لقينا نفسها في 67 وبصينا لقينا سينا ضايعه والبلد بتنهار والاقتصاد في النازل والحرامية عمالين يسرقوا ويعبوا لغاية ما جه نظيف وقال الحل ندمج البنوك ودمجنا البنوك ولكن يظهر الدمج طلع غلط والعملية اتنيلت اكتر من الاول وجت على رغيف العيش اللي اصبح حيكلوه الناس الاغنياء فقط وفيه مشروع للفقراء يعملولهم عيش من روث البهايم بس ما تخافوش عيش حلو اوي وبعدين الامن المركزي رايح يضرب في الناس الجعانة اللي مش لاقيه والفشل الكلوي بقا عامل زي الكحه في البلد واللي معاه فلوس يتعالج واللي معهوش يموت والجواز العرفي انتشر ما هو اصل ما فيش لا شقق ولا ظايف يبقى ما فيش حل الا اننا نقلد القطط والكلاب ما لهم القطط والكلاب دول احسن مننا كتير اوي وبعدين جه غزو العراق وانكشفت اللعبة وكلها لغاية عشرين يناير اللي جاي لما اوباما يمسك الحكم وحيبقى نهار ابونا اسود كلنا"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914005603/http://masr.20at.com:80/newArticle.php?sid=17552"

[[comments]]
order = 1
subject = "الاخوان سبب كل بلاوى البلد -- ازاى  -- اقول لكم"
author = "لا - لا -لا"
posted = "2008-09-13"
text = "حسنى مبارك يتقرب الى امريكا بمحاربتة الاخوان واعتقالهم وتقديمهم الى المحاكم العسكرية<br />وامريكا حاولت مخاطبة الاخوان وردوا عليها بغباء مشهود لهم<br />ماذا تريد امريكا من الاخوان لتسمح لهم بتولى الحكم وازالة النظام الحالى ؟<br />ان يعترفوا باسرائيل وبا اتفاقية كامب دفيد وعدم معاداة اسرائيل<br />لو قبل الاخوان ذلك سوف يحكموا مصر بعد شهر واحد وبمساعدة الامريكان<br />يا ايها الاخوان غيروا موقفكم الغبى<br />اعترفوا باسرائيل<br />قولوا نقبل السلام معها<br />خليكم زى الوفد والوطنى<br />العبوا على كل الحبال<br />وحتما ستحكمون البلد وتنقذون مصر"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914005603/http://masr.20at.com:80/newArticle.php?sid=17552"

[[comments]]
order = 2
subject = "حسن البنا هو الوحيد الذي كان يستطيع تحقيق اهداف جم"
author = "مش ضروري"
posted = "2008-09-14"
text = "في الاسلام الخروج على الحاكم جائز بشرط ان تكون قادر على الخروج عليه تماما كما حصل في السعودية فمحمد بن عبدالوهاب خرج على الحكام وكان عنده القدرة وانتصر وكما فعل الخوميني في ايران خرج على شاه ايران وكان عنده القدرة على تغيير الحكم وانتصر هذا جائز في الاسلام كما قال فقهاء اهل السنة وجماعة الاخوان المسلمين ايام حسن البنا كانت جماعة عظيمة بلا شك ولها اهداف عظيمة والوحيد الذي كان قادر على تحقيق هذه الاهداف هو حسن البنا وحده لانه ملهم موهوب ولكن حسن البنا فوجىء باجراءات الملك فاروق ضد الجماعة فالامر كان محتاج فتاوي اخرى واجتهادات ولكن للاسف قتلوه<br />رحمك الله يا شيخ حسن"
archived = "2010-03-14"
capture_url = ""
