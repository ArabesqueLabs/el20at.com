subject = "sakr1428@yahoo.com"
author = "محمد خالد"
posted = "2007-04-30"
text = "أخر خبر سمعتة<br />النيابة تفرج عن نائبي الإخوان وتقرر حبس الباقين 15 يومًا<br />أفرجت نيابة أمن الدولة بالقاهرة اليوم عن النائبَيْن المهندس صبري عامر ورجب أبو زيد- عضوي مجلس الشعب- اللذين تم اعتقالهما مع 12 مواطنًا مساء أمس من منزل المهندس فتحي شهاب الدين، ولم تقم النيابة بإجراء أية تحقيقات معهما، وقالت إن حالة التلبس التي نصَّ عليها الدستور للقبض على عضو مجلس الشعب دون رفع الحصانة عنه لا تتوافر في الحالة النائبَيْن، خاصةً أن التحقيقات مع المعتقلين أكدت أنهم وجهوا الدعوة للنائبين لاستطلاع رأيهما في انتخابات مجلس الشورى القادمة.<br />في حين قررت النيابة حبس باقي المعتقلين 15 يوما علي ذمة التحقيقات ووجهت لهم النيابة تهم إحياء نشاط جماعة محظورة والعمل علي قلب نظام الحكم.<br />من جانبها رحبت الكتلة البرلمانية بقرار النيابة وأكد حسين محمد إبراهيم- نائب رئيس الكتلة- أن القرار يعد خطوةً في الاتجاه الصحيح، إلا أنه كان يجب أن يشمل القرار باقي المعتقلين، خاصةً أن النيابة لم تجد فيما تم حالة تلبس، مما يعني أن اللقاء كان طبيعيًّا وليس هناك قضية في الأساس، وهو ما يؤكد أن الداخلية انتكهت المادة 54 من الدستور والتي كفلت حرية الاجتماع للمواطنين طالما لم يكن الاجتماع عسكريًّا.<br />وأكد نائب رئيس الكتلة أن أخطر ما في هذا الموضوع هو أن تقرير المباحث افتقد للدقة والتوصيف الصحيح لحالة التلبس، وهذا إن حدث مع أعضاء مجلس الشعب فإنه يحدث كل يومٍ مع باقي المواطنين، مما يضرب في مصداقية محاضر وتحريات المباحث.<br />وهو ما أكد عليه عبد المنعم عبد المقصود- محامي الجماعة- والذي رحَّب بقرار الإفراج عن النائبَيْن؛ لأنه لم تكن هناك قضية من الأساس، كما ناشد النيابة بأن تتخذ نفس القرار مع باقي المعتقلين، خاصةً أن القضية برمتها كانت قائمةً على النائبين، ولأنه قد ثبت صحة موقفهما فإن مواقف باقي المعتقلين يجب أن تتسق مع قرار الإفراج.<br />وكان نواب كتلة الإخوان المسلمين بمجلس الشعب قد هددوا بتنظيمِ اعتصامٍ مفتوحٍ في مكتب رئيس المجلس لحين الإفراج عن نائبَي الإخوان رجب أبو زيد وصبري عامر اللذين أُلقي القبض عليهما مساء أمس بالمنوفية، وقدَّم حوالي 90 نائبًا يمثلون كتلة الإخوان والمستقلين بلاغًا ظهر اليوم إلى المستشار عبد المجيد محمود النائب العام، طالبوا فيه بالإفراج الفوري عن النائبين، مؤكدين في المذكرة التي أُعدت بالتشاور مع د. فتحي سرور رئيس المجلس المسافر حاليًا في إندونيسيا لحضور اجتماعات اتحاد البرلمان الدولي، أن عملية القبض على النائبين و13 آخرين من قيادات الإخوان تمَّت بالمخالفة للقانون والدستور.<br />وأشارت المذكرة التي سلَّمها النائبان المستقلان المحاميان علاء عبد المنعم وسعد عبود إلى النائب العام، إلى عدم توافر حالة التلبس في القبض على قياداتِ الإخوان، ووصفت المذكرة عملية القبض بأنها انتهاكٌ للدستور، وطالبت بالإفراج الفوري عنهم.<br />وكشفت المذكرة أن المقبوض عليهم كانوا في اجتماعٍ تحضيري لانتخابات مجلس الشورى التي ستُجرى الشهر المقبل، وأنه لم يتم حتى الآن توجيه أي اتهامٍ رسمي إلى المقبوض عليهم.<br />وقد قرر نواب الإخوان الذين اجتمعوا في قاعة المستقلين بمجلس الشعب توجيه رسالةٍ اقترحها النائب السيد عسكر إلى رئيس اتحاد البرلمان الدولي المنعقد حاليًا بإندونيسيا ويحضره وفدٌ برلمانيٌّ مصريٌّ رفيع المستوى لفضحِ ممارسات النظام ضد معارضيه، ودعوة البرلمانيين الدولييين إلى تبني اتخاذ قرارٍ قوي يُدين التصرفات غير المسئولة والمخالفة للشرعية.<br />وطالب نواب الإخوان بتدخل الرئيس حسني مبارك بصفته الحاكم بين السلطات ووفقًا للدستور لمنع السلطة التنفيذية من الاعتداء على السلطة التشريعية واستعمال نفوذها بتعنت.<br />وكان نواب كتلة الإخوان المسلمين قد بدأوا التوافد على مجلس الشعب مع الساعات الأولى من صباح اليوم، وأجرى د. سعد الكتاتني رئيس الكتلة اتصالاً هاتفيًّا برئيس مجلس الشعب الموجود في إندونيسيا.<br />وعقدت الكتلة اجتماعًا مغلقًا في قاعة المستقلين لإعداد بيانٍ حول الأزمة وبعد الاجتماع أعلن د. الكتاتني في تصريحاتٍ بالمجلس للصحفيين أن الإخوان ليس لديهم معلومات عن إجراءات القبض على النائبَيْن والشخصيات المنتمية للجماعة بالمنوفية إلا من خلال ما نشرته الصحف والفضائيات، موضحًا أن قوات الأمن حاصرت منزل المهندس فتحي شهاب عقب دخول النائب صبري عامر بعشر دقائق، لمدة 4 ساعاتٍ، وأن النيابة وصلت إلى مقر المنزل بعد ساعةٍ ونصف الساعة من الحصار، مما يؤكد عدم حصول الأمن على أمرٍ بالضبط إلا بعد عمليات الحصار، وأن النيةَ كانت مبيتةً للقبض على النائبين، مشيرًا إلى أن الإخوان كانوا يتوقعون هذه الخطوة، بعد ممارسة سياسة التضييق على أنشطة النواب في مراكزهم الانتخابية.<br />وأكد أن ما حدث مع النائبَيْن رسالةٌ موجهة للجماعة حتى لا تخوض انتخابات مجلس الشورى القادمة، موضحًا في الوقت نفسه أن التراجع عن الانتخابات غير مطروح، وأن كل خيارات تصعيد المشكلة مفتوحة، بدءًا من الاعتصام ودون سقفٍ للمواجهة، مشيرًا إلى أن الكتلة لن تسكت على هذه الإهانة والإجرام.<br />وأضاف د. حمدي حسن أن الحكومة أصبحت في حالة مواجهة مع الشعب الذي يعاني من احتقان كل طوائفه بسبب المشاكل العديدة، مشيرًا إلى أنها عاقبت نواب الإخوان قبل انتخابات الشورى.. فماذا ستفعل أثناء الانتخابات؟<br />وقال النائب سعد عبود: يجب أن نستعد لنظامٍ بدأ يجهر بالعين الحمراء، ووصل إلى نقطة اللاعودة مع الشعب، وعلينا أن نستعد لأيام أكثر سوءًا بعد أن أصبحت الزنزانة هي المكان الوحيد للشرفاء."
archived = "2007-05-02"
capture_url = "https://web.archive.org/web/20070502013024/http://masr.20at.com:80/newArticle.php?sid=10006"
