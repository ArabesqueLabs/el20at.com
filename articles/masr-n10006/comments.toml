subject = "إمشى .. مع الف ......"
author = "واحد بيحب مصر"
posted = "2007-04-30"
text = "تعليق سخيف من واحد لا يفهم شيئا فى اختراع جديد خالص اسمه الأدب ، على فكرة يا ريتك تكمل مشى أحسن ليك ولينا ، تريحنا من الفاظك العبيطة وتستريح من الهبل المركز الذى تعانى منه .<br />الف سلامة يا اللى ماشى ، بقى نواب الاخوان اللى بيدافعوا عن الكبير والصغير فى البلد نواب أنس ؟ يا أخى كان نفسى أرد عليك بنفس الدرجة من القباحة وقلة الادب اللى انت كتبت بيهم تعليقك بس للأسف مش هينفع ، أصل أهلى علمونى الأدب .<br />يا سيدى البلد بتاعتنا لا يقبض فيها الا على الشرفاء والذين يحبون بلدهم ولم يسرقوا او ينتهكوا اعراض او يغرقوا عبارات ، السجن مش عيب فى بلد دى حالتها ، بالعكس ده شرف يا سيدى ، ان الناس يتقبض عليها علشان بتخدم الناس وبتعمل على الاصلاح ، العيب والعار فى اللى يؤيد الظالم والمفترى واللى يسخر من ناس العالم كله شهد بكفاءتهم واخلاصهم لبلدهم ."
archived = "2007-05-02"
