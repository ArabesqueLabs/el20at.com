subject = "\"قناة الحافظ\" تحفظك"
author = "محمود"
posted = "2007-12-29"
text = "أبرز أحداث العام عام 2007 بروز العديد من الفضائيات الدينية وانتشارها بشكل كبير ، ووصل الأمر إلى خروج 5 قنوات دينية من رحم قناة الناس ؛ وهم الناس، الخليجية ، البركة، والصحة الجمال وأحدث القنوات ظهورا قناة الحافظ للقرآن الكريم ، التي ترفع شعار حتى تكون قرآنا يمشي على الأرض."
