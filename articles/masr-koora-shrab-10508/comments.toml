subject = "اللى معاة قرش محيرة"
author = "ابو درف"
posted = "2008-11-16"
text = "واللة كلام كويس<br />بس انا با اشوف شوارع مليانة مية مجارى وفيها قطط ميتة وعيال بتلعب فيها<br />وبا اشوف شوارع مكسرة وفيها حفر بتموت ناس<br />وبا اشوف مستشفيات مفيش فيها ادوية للفقراء وشكلها من جوة يجيب المرض ومفيش بطانيات للمرضى يتغطوا بيها<br />يا سادة فية اولية للانفاق<br />وبعدين نبقى نبص للخيل<br />صحيح الخيل حلوة وجميلة وحاجة شيك خالص وموضوع اوريجنال خالص بس فية خيل من البشر بتموت على قارعة الطريق من المرض"
