subject = "طيب فين الاجهزة المسئولة في الدولة"
author = "مش بايظ"
posted = "2009-02-25"
text = "اذا كان المشروب دا بيتباع سرا فمكافحته شغلة الشرطة المصرية<br />واذا كان بيتباع علننا ففين اجهزة الرقابة في الدولة<br />وليه دولة اسلامية تبيع الخمور اصلا<br />اقولهم البلد بايظه"
