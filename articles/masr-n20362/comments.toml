subject = "الصورة لغرفة عمليات جراحية والمريضة فى مستشفى الحميات بتاخد مضادات حيوية ولبوس ومزيج الحديد ومخفض الحرارة"
author = "عصفور"
text = "يا جماعة مفيش عمليات جراحية<br />وبعدين انفلونزا الطيور ليس لها علاج - ويظهر ان اخونا بتوع الصحة بيعملوا شوية دعاية لنفسهم ويمكن المرض لم يكن انفلونزا الطيور ولكنة اشتباة وممكن يكون عندها شوية حمى او برد او زغطة"
