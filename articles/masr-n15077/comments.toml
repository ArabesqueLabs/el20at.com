posted = "2008-04-08"
text = "انا شامم ريحة اسرائيل يا جماعة<br />مستحيل اصلا حد يعرف ينظم حاجه زي دي الا اسرائيل<br />وعلى ما يبدو ان دي بداية الطوفان اللي حيغرق الشعب المصري"
