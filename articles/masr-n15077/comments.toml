[[comments]]
order = 3
subject = "صدق رسول الله صلى الله عليه وسلم"
author = "مش عبدالله الطحاوي"
posted = "2008-04-08"
text = "1قال سيدنا محمد صلي الله عليه وسلم لصحابته في شأن المصريين: \\'إذا فتح الله عليكم بمصر فاتخذوا منها جندا كثيفاً فهم خير أجناد الأرض و هم في رباط إلي يوم القيامة\\'. صدق رسول الله صلى الله عليه و سلم. 2: قال عمرو بن العاص: \\\"أهل مصر أكرم الأعاجم كلها و أسمحهم يدا\\\"[بحاجة لمصدر]. 3: قال سيدنا عيسى عليه السلام: \\\"مباركٌ شعب مصر\\\". 4: روى أبو ذر عن النبي صلى الله عليه وسلم أنه قال: (ستفتحون أرضا يذكر فيها القيراط فاستوصوا بأهلها خيرا، فإن لهم ذمة ورحما). 5: روى أبو هريرة أن رسول الله صلى الله عليه وسلم قال: (مصر أطيب الأرضين ترابا، وعجمها أكرم العجم أنسابا). صدق رسول الله صلى الله عليه و سلم."
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412211530/http://masr.20at.com:80/newArticle.php?sid=15077"

