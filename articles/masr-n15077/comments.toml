[[comments]]
order = 5
subject = "الى ابو اسامه"
author = "مش ضروري"
posted = "2008-04-08"
text = "فيه حاجه اسمها عقيدة اهل السنة والجماعة يا اخ ابو اسامه التي يدين بها معظم المسلمين ويدين بها 94% من ابناء الشعب المصري<br />الحديث اللي انا كابته دا اقرته عقيدة اهل السنة والجماعة مش الحزب الوطني ولا حزب الاحوان ولا اي حزب<br />دا حديث النبي محمد صلى الله عليه وسلم<br />لو مش مصدقني روح لاي واحد عالم دين خريج كلية اصول الدين واسأله عن صحة هذا الكلام<br />وبعدين الله اسمه مالك الملك<br />وطبعا الحكم مش عاجبنا كلنا<br />يبقى نرجع لمالك الملك ندعي له بأي يولي علينا خيارنا ولا يولي علينا شرارنا<br />واياك ان تستهون بسلاح الدعاء<br />فربنا سبحانه وتعالى قال ادعوني استجب لكم في القران<br />وقال ايضا فاني قريب اجيب دعوة الداعي اذا دعان<br />فالدعاء سلاح المستضعفين وخصوصا في الثلث الاخير من الليل"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412211530/http://masr.20at.com:80/newArticle.php?sid=15077"

[[comments]]
order = 6
subject = "مين الاخ بتاع"
author = "ابو اسامة"
posted = "2008-04-08"
text = "الاخ بتاع الحزب الوثنى ده اللى كاتب كل التعليقات مش عاوز يفهم اللى حصل فى العراق حصل علشان هما اللى سابوا حاكم ظالم يحكمهم وما حولوش يغيروا لذلك جلهم التغيير من الخارج واللى مش هيغير من الداخل هيتفرض عليه التغيير من الخارج ومع ذلك لو كان بوش الحمار يعرف اللى هيحصلوا فى العراق مكنشى حتى فكر انه يروح ناحية اهلها اما لجرايد الحكومة اللى بتقول ان الشرعية انتصرت شرعية ايه اذا كانت كل حاجة مزورة واذا كان الشعب المصرى ما اشتركشى فى الاضراب يبقى هو عايش سعيد ومتهنى ولا فيه جوع ولا بطالة ولا فساد وتبقى الدنيا بنبى. اختشوا على دمكم يا عالم وحسوا بقى بالناس حسبى الله ونعم الوكيل فى الحزب الوطى وفى الاخوان وفى كل حزب كان ."
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412211530/http://masr.20at.com:80/newArticle.php?sid=15077"
