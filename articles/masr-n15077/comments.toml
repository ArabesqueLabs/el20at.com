[[comments]]
order = 0
subject = "ضع عنوان التعليق"
author = "مواطن من المحلة"
posted = "2008-04-07"
text = "انا من المحلة قاعد قدام الكومبيوتر فى البيت والناس كلها بتتصل وبتقول ممنوع تخرج من البيت<br />المحلة بقت كلها قنابل مسيلة للدموع ... حالات اتناقات كتير بسببها رغم انك فى بيتك<br />المشكلة ان الناس فلت عيارها من الغلب والجوع ... بقت بتتخانق لمجرد الخناق ... بس اللى بيعمل القلق دول مش غزل المحلة أبدا . مظاهرات غزل المحلة طول عمرها محترمة ... اللى بيعمل القلق بلطجية مش عارفين منين ....<br />ربنا يستر ويعديها على خير"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412211530/http://masr.20at.com:80/newArticle.php?sid=15077"

[[comments]]
order = 1
subject = "يا ترى خسائر الاضراب كام مليون"
author = "ابومحسن"
posted = "2008-04-08"
text = "باختصار عايزين واحد اقتصادي يقولنا خسائر الاضراب على الدولة وعلى الشعب كام مليون<br />وطبعا الشعب المسكين هو اللي دفع التمن او بمعنى اخر الاضراب كان على حسابه<br />كان اولى بالملايين دي الناس المرضى"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412211530/http://masr.20at.com:80/newArticle.php?sid=15077"

