subject = "كما قال النبي -صلى الله عليه وسلم- (أدوا الحق الذي"
author = "مش ضروري"
posted = "2008-04-08"
text = "فهموا الكلام اللي مكتوب ولا لما نبقى زي العراق حتفهموا"
archived = "2008-04-12"
