subject = "يارب خليكى يا امى  -- يا ست الحبايب"
author = "انا"
posted = "2008-10-07"
text = "فى بيت جدتى او ستى تتجمع كل الاسرة كل يوم خميس او جمعة وفى جميع الاعياد<br />لا احد يستطيع ان يزوج ابنتة او ابنة بدون راى ستى او جدتى من العائلة<br />لا يستطيع احد شراء حاجة الا بعد ان يأخذ رأى جدتى<br />جدتى تحضر العزاء فى الاسر الاخرى<br />جدتى او ستى هى عامود بيتنا<br />ولا يستطيع احد ان يغضبها او يرفض لها طلبا<br />يا جدتى متعك اللة بالعمر الطويل لانك احن على من امى واحن على من ابى<br />يا جدتى - الجا اليك حينما تقع مشاكل مع ابى او امى<br />يا جدتى الا يقولون فى المثل اعز من الولد ولد الولد"
archived = "2010-03-14"
