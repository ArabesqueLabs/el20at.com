[[comments]]
order = 0
subject = "وماذا بعد ؟ هنوصل الى اين ؟"
posted = "2009-01-29"
text = "هل السادة بتوع امن الدولة عندهم حل ؟<br />هل ممكن القبض على قيادات العمال والسائقين وايداعهم معتقل برج العرب ؟<br />زى ما بنقرأ فى الجرايد - الحكومة بتقترض قروض بالدولار مش علشان تعمل مشاريع تدر عائد للدولة ولكن لشراء اكل وخبز وطعام<br />يبقى هتحسن دخل العمال ازاى<br />ويمكن حل المشكلة باعادة الادارة الانجليزية الفرنسية لتشغيل السكك الحديدية زى ايام الاحتلال الانجليزى<br />احنا فشلنا فى ادارة كل شىء<br />الفشل الادارى عنوان كل مصلحة حكومية<br />ذهبت لدفع فاتورة التليفون<br />وقفت فى الطابور 3 ساعات اذلال حتى جاء دورى<br />موظف واحد قاعد فى الشباك وقدامة كمبيوتر واحد وطوابير واقفة قدامة<br />ذهبت للمدير<br />قلت لة مش حرام نقف كدة ساعات علشان عندكم موظف واحد - لية بدل الشباك الواحد يكون اربع شبابيك او خمس موظفين والناس تخلص بسرعة<br />نظر الى ببرود ولم يرد واشعل سيجارة وتركنى ومشى يتطلع الى الطوابير بتلذذ<br />دة اسمة فشل ادارى<br />او ربما بيتعمدوا اذلال الشعب - انا مش عارف"
archived = "2010-03-14"
