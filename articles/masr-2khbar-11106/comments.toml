subject = "منكم لله يا مجرمي ثورة 23 يوليو"
author = "مش حخاف"
posted = "2009-02-01"
text = "مجرمين ثورة 23 يوليو هما الذين اوصلوا البلد الى هذه الحالة<br />عمركم شفتم ايام الملكية او الملك فاروق كان فيه حاجات زي دي<br />عمركم سمعتم ان فيه حد مش لاقي يتجوز ايام الملك فاروق<br />عمركم سمعتم ان فيه حد بيدور على شقة ايام الملك فاروق<br />منهم لله شوية الحرامية دول<br />شوية عيال جبتهم بريطانيا الصليبية الحاقدة على مصر المسلمة<br />عز على الصليبيين ان يروا مصر بلد الازهر شامخة وشعبها طيب<br />فجابوا ولاد الوسخة القحاب دول المجرمين علشان خاطر يدمروا البلد عن بكرة ابيها<br />والذين جاءوا من بعهم<br />منهم لله جميعا"
archived = "2010-03-14"
