[[comments]]
order = 5
subject = "متتحسبش كده يا نهى"
author = "نيفين نيفى نوفا"
posted = "2007-05-01"
text = "مينفعش اقول يروحو يموتو<br />انا لما يدى بتوجعنى مبقطعهاش لكن بعالجها<br />شئنا ام ابينا السيناويه جزء من سكان مصر و ان اختلفو و سبنا جزء عزيز على قلب كل مصرى<br />الموضوع يا جماعه مش ثوره حماس اننا نزعق و نغضب و نقول ازاااااااااااااااى يلجأو لاسرائيل..انا معاكو ان الموضوع كبير و انا من اول الناس اللى ناديت ان عشرينات تتبنى الموضوع و تديله التغطيه الكافيه بس مش علشان نشتم السيناويه و يشتمونا و نقعد نقول البيضه قبل الفرخه و لا الفرخه قبل البيضه<br />اولا الناس دى طول عمرها بتشتكى و محدش بيسمعها و مبناخدش بالنا الا لما القنبله الموقوته تنفجر وده ف الاول و الاخر راجع لحكومتنا الكريمه اللى ان شاء الله هتدفع التنم<br />و بالنسبه لموضوع اللجوء انا مش شايفه ان اسرائيل الدوله اللى مشرده الفلسطينين و مخلياهم لاجئين ف بقاع الارض هتستقبل لاجئين و لو عملت كدا السيناويه قبل غيرهم عارفين ان الحدايه مبتحدفش كتاكيت و ان عنب اسرائيل حصرم<br />هى يمكن عمليه تصفيه حسابات مع الحكومه<br />يبقى احنا كشعوب المفروض نحسبها صح<br />مش كده و لا اييييييييييييه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "تسوقون الى الاسرائيليين دون ان تدرون؟"
author = "سعيد اعتيق السواركة"
posted = "2007-12-14"
text = "يبدو ان كاتب المقال لا علم لة بما يدور فى خلد سيناء الصامدة:<br />فلقد اخطا خطا فادح فى اختيار العنوان الخاص باحداث سيناء فعلى الرغم من ان الاخ بلاال يدعى انة من اهل اليسار الا ان كلمة اسرائيل طلعة من بقة زى السكر ......ثم ان ابناء سيناء لم تكن لهم النية البتة فى اللجو الى اسرائيل .<br />ولو كان الامر كذالك لما بقو كلهم الى الان مرابطين فى ارطهم ولم يعبر ولو شخص واحد الى اسرائيل .ثم ان الرحيل الى اسرائيل ليس فى حاجة الى تضاهرة على الحدود .فلقد سبق وان هاجر الى اسؤائيل اكثر مكن خمس عشر مواطن مصرى وبالتحديد من مجة بحرى ويمارسون حياتهم اليومية داخل تل ابيب.<br />فبدو سيناء ليسو من اصحاب النفس الرديئة لكى يبع عرظة وارطة من اجل حفنة دولاارات"
archived = "2010-03-14"
capture_url = ""
