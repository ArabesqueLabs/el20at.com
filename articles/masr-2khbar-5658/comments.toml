posted = "2007-04-29"
text = "محدش يا نهى قال ان اهل سيناء راحوا اسرائيل<br />و اهل سيناء بيرفضوا ان حد يزايد على وطنيتهم و انتمائهم<br />في حاجات كتير متعرفوهاش عن اهالي سيناء و معاناتهم<br />اقري الموضوع تاني الاعتصام على الحدود مش جوا فلسطين المحتلة"
