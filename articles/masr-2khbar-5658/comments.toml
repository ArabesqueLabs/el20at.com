subject = "المدعو نهي انت بتتكلمي بأسم مين.. أعتقد مش بأسم ال"
posted = "2007-04-29"
text = "أعتقد أن من قتل الاخوة الفلسطنيين العدو الصهيوني.. أما من قتل مواطنان من سيناء هم أصدقاء الصهاينة من يؤمنون وصول الغاز لهم والاسمنت الذي بُني به جدار الفصل العنصري وهؤلاء من يستخدمون خيرات سيناءالمحروم منها أبنائها لرفاهية الصهاينة في الجنوب ودعم دولتهم والحفاظ على أمنهم بتوريد اسمنت سينا لعمل جدار يحميهم من المقاومة الفلسطينية الباسلة.. وعلى فكرة ليس الصهاينة من يضيعون الاف الفسطنيين بل حماس وحكومتهم ورجالتهاهم هم من يساعدوا الصهاينة في قتل جزء من هذه الآلاف.. بس أريد أن أعرف انت بتتكلمي بأسم مين؟"
archived = "2010-03-14"
