text = "بجد انا مبسوطة اوى انى احتفلت بعيد ميلاد عشرينات اون لاين ومن غير ما اكون فى المكتب يومها بس حسيت انى بجد قد ايه مرتبطة بكل حد وكل حاجة فى عشريناتنا<br />اكتر مرة حسيت انى بتاعة المكان ده وهو حتة منى كان فى عيدميلاد دعاء تقريبا السنى اللى فاتت كنت اول مرة اخرج مع عشرينات كلهم ونتكلم اوى بعيد عن الشغل يعنى هو احنا دايما بنهرج بس كان تهريج قلب بهزار<br />اما بقى استاذ عبدالله مش عارفة ارد عليه اقوله ايه، دايما بيتريق على عشان لما باحترم واحد راجل باقول عليه تلقائيا عسول اول مرة سمعها صعق ، لكن دلوقتى انا مضطرة اشهر به اون لاين واقولكم انى باقوله انه هو بقى مش عسول لانه سكر وستنرفيش كمان<br />بس كان اول ما عرفنى قال انفع اشتغل مدرسة حضانة دلوقتى بقيت مطربة شعبية ماشى انا مش معترضة بس اشتغل فى فرقة سلامة حجازى<br />يلا سلام لغاية ماارجع من الاجازة اليومين اللى خدتهم بالعافية .. بحبكم اوى اوى اوى"
