text = "أخواني في عشرينات محررين ومشرفين وقراء<br />ما رأيكم لو نحدد هذا اليوم ليكون عيداً سنوياً لعشرينات..<br />نحتفل فيه بنمو هذا المولود العملاق الرائع \"عشرينات\".<br />لكن بعد أن يتعدي العشرينية.. ماذا سيكون اسمه..<br />أنتظر اجابة من الاستاذة العظيمة التي تخيفنا جميعا \"شيرين\"؟<br />ولعل الجميع يشارك ويقترح شيئاً متميزا بشأن هذا العيد كل سنة، وما هو المميز الذي يمكن أن نقوم به.<br />وسنبحث عن فتوى من السعودية بجواز الاحتفال بهذا العيد -فقططططط-..<br />لكم خالص شكري وتقديري<br />محبكم<br />أحمد العمودي<br />جدة"
