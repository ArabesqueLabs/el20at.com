text = "ميش هعرف نهائي أجمع كل العشريناتيه واحد واحد عشان أكيد في واحد هيدحرج مني و بعد كده هيرجع يقولي أنت خرء ،كل اللي هقوله إن عشرينات أجمل مدرسة شعارها \" إتعلم بابتسامة\".<br />بس إسمحولي أبعت 3 رسائل الأولي للأستاذة ياسمين و الله وحشاني جدااااا يمكن كانت فترة معرفتنا قصيرة بس كانت كفاية عشان أعرف قد إيه حضرتك جميلة وكفاية إن أول موضوع كان علي يدك.<br />الرسالة التانية أنا آسف هي بره الموضوع بس معلش بقي أحب أقول للأستاذ قطب لسه قدامك فرصة للفرار وما تفتكرش الكام جندي الصايعين اللي هطلعهم هينفعوك.<br />الرسالة الثالثة هابعتها لحبيبتي و درة قلبي \"بورش\" بحبك مووووووووووووووووووووووت.<br />*ملحوظة: عشان خاطر الأستاذة مروة كلمة خرء يعني جعضان :P"
