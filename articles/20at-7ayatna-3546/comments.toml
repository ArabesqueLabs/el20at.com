text = "عمنا الطحاوي وكل اهل عشرينات كل سنة وأنتم طيبوووووووون وإن شاء الله في هذا العام يزدهر عشرينات أكثر واكثر ...<br />كنت أفكر في كتابة موضوع يلخص ال5 اشهر التي عشتها في كنف عشرينات واتكلم عن كل زميل وزميلة لكن الوقت يداهمنا دوما ....<br />لذلك اكتفي بالتعليق هنا<br />كل عام وأنتم بخير<br />كل عام وعشرينات دوما الموقع الاول للشباب العربي<br />كل عام وعشرينات رسالة حب الى كل الشباب<br />كل عام وانتم صوت مغاير لا يرضى أن يسير مع السرب المغرد دوما<br />كل عام وشيرين وعلي ومروة ومنى والقطب والمعتصم ودعاء واليسر ويمنى وهبة الله والطحاوي والهواري ومصعب وفاروق وياسر ومصطفى بخير<br />كل عام وزين وياسمين ونصر ورانيا وشيماء والدسوقي بخير"
