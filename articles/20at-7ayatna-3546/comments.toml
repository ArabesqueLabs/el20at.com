subject = "نيفين نيفى نوفا"
author = "الى مصعب ردا على موضوع علاقه ت"
posted = "2007-04-07"
text = "اسمحولى يا عشريناتيه اقتحم القعده الحلوه و الكلام الجميل دا بين الاصحاب و الزمايل الصحفيين و علق على موضوع مصعب علاقه تعليق لان فيه صعوبه ف نزول التعليق هناك<br />احب اقوللك يا مصعب ان و الله احنا كمان مفتقدين تعليقاتنا<br />مفتقدين لما الواحد كدا كان بيبقى عايز يكسر الكيبورد و هو بيكتب تعليق على موضوع من موضوعات نقد احوال البلد اللى متسرش<br />مفتقدين لما كنا بنبقى هنحضن الكيبورد لما نعلق على موضوعات لايت مفرفشه<br />مفتقدين الشجن الجميل ف التعليق ايام ما فتحتو ملف الموت<br />مفتقدين تواصلنا معاكو يا مصعب<br />و بتكلم بصيغه الجمع لانى واثقه ان دا احساس ناس كتير<br />هقوللك ايه بس<br />ميرسى انك مفتقد تعليقاتى بس و الله صدقنى الواحد حاسس انه تنقلع ليه عين و التعليقات ترجع<br />تحياتى ليك و لكل الناس العشريناتيه الحلوه اللى عندك"
