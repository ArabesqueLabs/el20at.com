[[comments]]
order = 0
subject = "قصيدة"
author = "المواطن مصري"
text = "أبانا الذي في المباحث..نحن رعاياك..<br />باق لك الجبروت... وباق لنا الملكوت....<br />و باق لمن تحرس الرهبوت<br />تفردت وحدك باليسر. ان اليمين لفي الخسر<br />أما اليسار ففي العسر الا الذين يماشون<br />الا الذين يعيشون ويحشون بالصحف المشتراة<br />العيون. فيعشون.<br />الا الذين يشون.<br />و الا الذين يوشون ياقات قمصانهم برباط السكوت<br />تعاليات ......ماذا يهمك ممن يذمك ؟<br />اليوم يومك ..... يرقى السجين الى سده العرش<br />و العرش يصبح سجناً جديداً و انت مكانك.<br />قد يتبدل رسمك و اسمك. لكن جوهرك الفرد<br />لايتحول.. الصمت وشمك و الصمت وسمك<br />و الصمت - انى التفت - يزين و يسمك<br />و الصمت بين خيوط يديك المشبكتين المصمغتين يلف<br />الفراشه و العنكبوت<br />ابانا الذي في المباحث.. كيف تموت<br />و أغنيه الثوره الأبديه<br />ليست تموت؟؟<br />قصيدة \"صلاه\" من ديوان العهد الآتي لامل دنقل"
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065339/http://masr.20at.com:80/newArticle.php?sid=10403"

[[comments]]
order = 1
subject = "شاعر ومتنباء"
author = "ابو اسامة"
text = "شاعر يتنباء بما سوف يكون ونعم الشعراء قد يكون .انه لم يرى ما سوف يكون بل انه راءى ميراث الظلم فالحاكم الظالم لن يورث الا ظالما مثله فلم يورث عبد الناصر الا السادات الذى افسد علينا فرحة النصر بمعاهدة الاءزلال التى نعانى منه حتى اليوم فقد ملكنا سيناء ولا يحق لنا التصرف فيها بما نشاء ومن هذا السادات الى عصر من الظلم الاسود على يد رجل<br />لا يعرف الا الخنوع والعمالة لامريكا لم يعد للفقير شىء الا التسول باع كل شىء حتى انه لم يبقى فى مصر الا اشباح يتفرجونعلى ما يفعله هذا الغبى وابنه."
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065339/http://masr.20at.com:80/newArticle.php?sid=10403"

[[comments]]
order = 2
subject = "اين انت يا دنقل"
author = "نيفين نيفى نوفا"
text = "اين هو امل دنقل الورده الجنوبيه السمراء التى ذبلت قبل الاوان<br />و الفرق يا جماعه بين دنقل و غيره من الشعراء انه كان عنده بعد النظر و دى ملكه مش عند ابدع الشعراء<br />كان فعلا شايف كويس و اقرو زرقاء اليمامه<br />جميل يا منى"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707113645/http://masr.20at.com:80/newArticle.php?sid=10403"
