[[comments]]
order = 1
subject = "احنا مش عاوزين شوكولاتة عاوزين نتعامل كبنى ادميين"
author = "فكرى"
posted = "2009-01-27"
text = "الشرطة والامن بوجة عام عنصر استقرار وازدهار للمجتمع وبانعدام الامن واختفاء الشرطة تفقد الدولة هيبتها كلنا مع الشرطة والامن ضد الحرامية والمجرمين المتاصل الاجرام لديهم لدرجة انة مينفعش يعيش برا السجن لخطورتة على المجتمع وكلنا ضد الشرطة لما تنكل وتعذب الناس باسم الامن وكلنا ضد الشرطة فى حمايتها لعملية تزوير الانتخابات وارهاب الناخبين الغير مؤيدين لسياسة الدولة القائمة بالاساس على تزوير الانتخابات والاستيلاء على السلطة بالقوة وفرض سياسة الامر الواقع بحماية الشرطة والامن مع الاسف وبعد كدة اقولكم مش عاوز شيكولاتة عاوز شوية انصاف ووقفة مع النفس ومراجعة للماضى"
archived = "2010-03-14"
capture_url = ""
