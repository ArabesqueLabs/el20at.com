text = "يا احمد ليس الدين بقطعة قماش0 فلاذا خلق الله لكل انسان وجه خاص به 0 ولا تبكى على الحرية فى هولندا الدولة المتقدمة ولكن ابكى على الحرية فى بلادنا المتخلفة التى تريد تصدير التخلف اليهم 0 عودوا الى بلادكم وعيشوا فيها كما يعجبكم ودعوا خلق الله يعيشون كما يعجبهم 0 فان سيادتك وغيرك لستم اوصياء ولا مندوبين من السماء على البشر 0 ولماذا تضعون انفسكم مكان الله خالق الكل وديان الكل 0 والفت نظرك الى الشرور التى ترتكب من وراء النقاب 0<br />لايتخفى الا من يصنع الخطأ 0 اما الصحيح فكل اعماله واضحة فى النور 0 وهل قطعة القماش تدخل الجنة مهما كانت الذنوب<br />؟؟؟؟؟؟؟؟ اتق الله واعقل"
