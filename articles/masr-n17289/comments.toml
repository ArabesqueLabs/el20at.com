[[comments]]
order = 0
subject = "العمل عبادة و انتاج و صلاة معا"
author = "ممدوح زكى زخارى_الاسكندرية -مص"
posted = "2008-08-19"
text = "الموضوع كبير و حساس<br />لا يجب الانسياق و راء اى رائى خاصة فى امور الدين؟<br />سواء كان هذا الرائى خطاء كان ام صواب؟؟؟؟؟<br />(اسالوا اهل الذكر ان كنتم لا تعلمون)"
archived = "2008-09-04"
capture_url = "https://web.archive.org/web/20080904083909/http://masr.20at.com:80/newArticle.php?sid=17289"

[[comments]]
order = 1
subject = "شغل العيال تانى"
author = "متولى الزعفرانى"
posted = "2008-08-19"
text = "انا اشتغلت مع شركة امريكية سنتين وشركة ايطالية برضة سنتين وكان العمل بيبدأ السابعة صباحا وينتهى السادسة مساءا وكان موجود حاجة اسمها time break يعنى عند الساعة عشرة راحة نصف ساعة وعند الساعة الثانية راحة نصف ساعة تشرب شاى تاكل سندوتش تصلى تدخل الحمام تشرب مية تمدد رجليك شوية<br />اية يعنى يا عزيزى انت وهو لما يبقى فية راحة نصف ساعة للصلاة وشرب الشاى واكل سندوتش زى بقية العالم كلة<br />انتم بتجيبوا الافكار دى من اين<br />يا ريت كل موظف ييجى فى ميعادة ويروح فى ميعادة ويشتغل بما يرضى اللة ولو عايز يصلى ياخد نصف ساعة يصلى<br />المهم يرضى ربنا فى عملة<br />الانسان فى عملة مش الة بتلف دى برضة بشر ومطلوب شوية راحة<br />افهموا بقى"
archived = "2008-09-04"
capture_url = "https://web.archive.org/web/20080904083909/http://masr.20at.com:80/newArticle.php?sid=17289"

[[comments]]
order = 2
subject = "الموضوع محتاج تنظيم والتزام"
author = "Mohamed Saleh"
posted = "2008-08-19"
text = "انا بشتغل برا مصر-ومديري مش مسلم-وفعلا كان بيحصل مشاكل بسبب خروجنا للصلاه من غير نظام--ف الاخر اتفقنا ان كل صلاه ليها تلت ساعه--الضهر الساعه واحده والعصر الساعه اربعه--واتبعت تعميم لكل الشركه---من يومها مفيش اى مشاكل--بس بشرط اننا بنيجي الصبح ف معادنا ونروح ف معادنا---بس التزام وتنظيم--منكبرش الموضوع ونعمل من الحبه قبه--شكرا"
archived = "2008-09-04"
capture_url = "https://web.archive.org/web/20080904083909/http://masr.20at.com:80/newArticle.php?sid=17289"

[[comments]]
order = 3
subject = "احنا رايحين لفين"
author = "مصريه"
posted = "2008-08-20"
text = "والله انا مش عرافه احنا رايحين لفين بالفتاوي بتاعتنا يظهر ان الاستاذ وليد معندوش اي فكره عن ان الصلاه مينعش انها تتأجل وان مجرد ما الاذان ياذن المفروض تسيب اللي في ايدك وتصلي وبعدين المصالح الحكوميه كلها بيمشوا قبل الساعه 3 يعني كل اللي هيصلوه في اليوم الواحد هو صلاة الظهر بس وانا معتقدش ان ال10 دقايق دول هيعطلوا مصالح الناس ماهم بيعدوا يفطروا في نص ساعه ويحبسوا بالشاي في ربع ساعه متكلمتش علي ده ليه ولا لازم يخلص طبق الفول عشان يعرف يشتغل ربنا يهديك"
archived = "2008-09-04"
capture_url = "https://web.archive.org/web/20080904083909/http://masr.20at.com:80/newArticle.php?sid=17289"

[[comments]]
order = 4
subject = "الموضوع بسيط جداً"
author = "محمد منصور"
posted = "2008-08-20"
text = "الموضوع بسيط جداً وأنا شايف إن مافيش وجه خلاف إحنا لو التزمنا بمواعيد الحضور والانصراف أولاً وحددنا وقت بريك بدل ما نشرب فيه شاي وسيجارة نجعله وقت للصلاة - وبعدين احنا لو جمعنا وقت كلامنا في التليفونات نجدها تصل إلى الساعة - أما بعض الأشخاص الذين يدخلون المصلى يصلوا وبعدين يناموا شوية فأقول لهم اتقوا الله فأنتم سبب هذه الأقوال"
archived = "2008-09-04"
capture_url = "https://web.archive.org/web/20080904083909/http://masr.20at.com:80/newArticle.php?sid=17289"
