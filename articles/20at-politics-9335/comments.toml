[[comments]]
order = 2
subject = "غزة  محاصرة من الخارج مظلومة من الداخل"
author = "فلسطيني"
posted = "2008-06-23"
text = "بسم الله الرحمن الرحيم<br />ظلمت غزة وظلم شعبنا بعد ما حصل في القطاع من قتل واعدام وتفجير وتقطيع للأطراف وجرائم بشعة اخرى ارتكبت اما بغطاء الاسلام البريء من تلك الجرائم او غيرها من الغطاءات.<br />لا تقولو لي ان هذا نصرا للأسلام فنصر الاسلام يأتي بالتاخي والتعاون والترابط والصمود واخذ اسباب القوة والتقدم على عدو ذكي كإسرائيل .<br />غزة تعيش بأمن وكذلك الضفة ولكن ليس هذا مقياس نقيس به صحة ما فعلته حماس في غزة<br />علينا ادراك ان ما حصل جريمة وكارثة ونعمل لأجل الاتفاق والوفاق<br />شكرا<br />سلام"
