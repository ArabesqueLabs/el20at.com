[[comments]]
order = 1
subject = "أفضل عام رغم الحصار"
author = "عمار"
posted = "2008-06-18"
text = "بسم الله الرحمن الرحيم.. بصفتي مواطن يعيش في قطاع غزة ويعاني كغيره من ويلات الحصار المفروض علينا، أستطيع ان التأكيد على ان العام المنصرم والذي سيطرت حركة حماس فيه على قطاع غزة بالكامل، هو افضل عام من ناحية الأمن الداخلي في قطاع غزة \\\\\\\\\\\\\\\" اتلاف كميات هائلة من المخدرات، القضاء على عصابات السرقة والاغتصاب والدعارة، القضاء على سلاح العائلات المنفلت، وأصبحنا نسير في الشوارع ونسهر الليالي دون خوف او وجل من حواجز الملثمين المسلحين البلطجية، تنظيم المرور وحفظ الأمن في المؤسسات والمدارس والمستشفيات والمرافق الحكومية... وغيرها الكثير... \\\\\\\\\\\\\\\"<br />وانا ارى من وجهة نظري ان الحصار الظالم الذي فرض علينا كان الهدف منه بالأساس تشتيت انتباه الناس عما يمكن ان تنجزه حماس، ووضع العراقيل والعثرات في طريق الاصلاح والتغيير الشعار الذي رفعته حماس عند دخولها الانتخابات، وحتى يصرخ المواطن المحاصر : لا أريد حكم حماس .. نار فتح ولا جنة حماس .. وغيرها من العبارات الانهزامية التي رددها البعض .. لكن الغالبية العظمى من أبناء شعبنا يدركون المغزى من الحصار، ولعلي أسرد لكم ما حصل معي البارحة أثناء عودتي من العمل إلى البيت، حيث كنت أركب سيارة ودار نقاش اعتيادي بين الركاب والسائق حول الاوضاع الحالية، السائق قال كلمة جوهرية، قال \\\\\\\\\\\\\\\" إن المشكلة والله ليست في حماس ولا حكومة حماس، المشكلة في الاحتلال الذي يحاصرنا ويعاونه في حصارنا ناس من أهلنا حتى نقرف حماس وحكمها..\\\\\\\\\\\\\\\"<br />فوالله يا جماعة نحن نشعر بالأمن والامان والطمأنينة والهدوء والاستقرار بشكل لم نشهده من قبل .. هذا طبعا على الصعيد الداخلي، اما على صعيد الاحتلال وجرائمه فهذا امر اعتدنا عليه، واعتدنا ان نقدم التضحيات الجسام في مقابل ثباتنا ورباطنا على أرض فلسطين الطاهرة، فنحن مستعدون للموت في سبيل الله ولا نقبل ببيع ارضنا وضياع هويتنا ونسيان قضيتنا المقدسة التي من أجلها ارتقى آلاف الشهداء.<br />فيا أهلنا في كل البقاع شعب فلسطين بخير وثابت ومرابط ويعي ما يدور حوله من مؤامرات ودسائس<br />ومن يظن أنه سيعود غلى غزة محتميا بظهر دبابة صهيونية فهو واهم، فليس له إلا أن يعود إلى احضان شعبه ويلتزم بثوابته ومبادئه.<br />وتقبلوا تحياتي جميعا."
archived = "2010-03-14"
