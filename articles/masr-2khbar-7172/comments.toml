subject = "هو التقدم  مش عاجبكم"
author = "مواطن"
posted = "2007-09-24"
text = "الجرس الكهربائى المبرمج اللى بيضرب اتوماتيك معلنا انتهاء الحص وبداية الفسحة<br />والسبورة المغنيطيسية<br />وانتهاء عصر الطباشير واستخدام اقلام الفلوماستر على السبورة البيضاء<br />واستخدام الكمبيوتر والبروجكتور فى الشرح<br />والكتب تتحول الى سى دى<br />لية كل دة ما يبقاش فى مدارس اطفالنا<br />العلم نور"
