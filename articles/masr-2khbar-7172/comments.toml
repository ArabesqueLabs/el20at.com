text = "لا تتعجب وانظر لحال مدرسة حافظ ابراهيم الاعدادية بنين والمهزلة التى حدثت بها اليوم قامت سيدة بالتعدى بالضرب على المدرسات وسب علنى و؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ اذهب لتضحك على حالنا نحن المدرسين وامن الدولة والحكومة كلها تتركنا وترحل لا حول ولا قوة الا بالله"
