subject = "أولئك لهم الأمن وهم مهتدون"
author = "http://www.almenhaj.net/makal."
posted = "2009-01-27"
text = "أولئك لهم الأمن وهم مهتدون<br />فضيلة الشيخ علي الحلبي<br />كثيرٌ من النّاس -اليوم- يعيشون صوراً من الرُّعب، والخوف... والإرهاب... والتَّرقُّب... ولا يعرفون (سبباً) ظاهراً لذلك كلِّه، إنَّما هو شعورٌ داخليٌ يُراودهم، سواءٌ في طريقهم وسلوكهم، أم في بيوتهم و(بُروجهم)، أم في حياتهم ورواحهم ومجيئهم!!<br />ولو نظر هؤلاء نظرة غلويَّة فاحصة... لعلموا أنَّ السَّبب الرئيس في بُعدهم عن الأمن... وإغراقهم في نقيضه هو: تنكُّبهم سبيل الهداية، وتَجنُّبهم طريق الالتزام بأحكام الله جلَّ شأنه:<br />يقول الله سبحانه: {الذين آمنوا ولم يلبسوا إيمانهم بظلم أولئك لهم الأمن وهم مهتدون}.<br />فالأمن... والهداية... قرينان... لا يفترقان... إذا زال أحدهما زال الآخر... بل إذا رقَّ أحدهما رقَّ الآخر.<br />فالأمن الحقيقي ليس بكثرة الجيوش والعساكر... وليس بوفرة الحرس والسِّلاح... إنَّما هو الأمن المنبعث من الروح المطمئنَّة التي رضيت بالله ربَّاً، وبالإسلام ديناً، وبِمحمَّدٍ صلى الله عليه وسلم نبيَّاً رسولاً.<br />فالأمن الحقيقي -إذن- هو «الأمن من المخاوف، والعذاب، والشَّقاء، والهداية إلى الصراط المستقيم.<br />فإذا كانوا لم يلبسوا إيمانهم بظلم مطلقاً؛ لا بشرك ولا بمعاصٍ: حصل لهم الأمن التَّام، والهدايَّة التَّامة.<br />وإن كانوا لم يلبسوا إيمانهم بالشرك وحده، لكنَّهم يعملون السيِّئات، حصل لهم أصل الهداية، وأصل الأمن، وإن لم يَحصل لهم كمالُهما.<br />ومفهوم الآية الكريمة أنَّ الذين لم يَحصل لهم الأمران، لم يَحصل لهم هدايةٌ، ولا أمنٌ، بل حظُّهم الضَّلال والشَّقاء»([1]) .<br />وهذه الآية العظيمة تُبيِّن لنا الفهم الواقعي لقوله جلَّ وعلا: {سنلقي في قلوب الذين كفروا الرعب بما أشركوا بالله ما لم ينزل به سلطاناً...}.<br />هذا في الدُّنيا، ولو كانت لهم البروج المشيَّدة، والقلاع المحصَّنة، والأسلحة، والجند، والهيمنة، والجبروت...<br />وأما في الآخرة: {ومأواهم النَّار وبئس مثوى الظَّالمين}.<br />والوعد الحقُّؤ من الإله الحقِّ لأهل التزام الحقِّ بالأمن الحقِّ: {وعد الله الذين آمنوا منكم وعملوا الصالحات ليستخلفنَّهم في الأرض كما استخلف الذين من قبلهم وليُمكِّننَّ لهم دينهم الذي ارتضى لهم وليبدِّلنَّهم من بعد خوفهم أمناً يعبدونني لا يشركون بي شيئاً}...<br />...{فأيُّ الفريقين أحق بالأمن إن كنتم تعلمون}:<br />أهل الهداية واليقين...<br />أم أهل الفساد وأولياء المشركين!؟<br />أم أذنابهم من المتأكِّلين وأشباه المنافقين!؟"
