[[comments]]
order = 4
subject = "لا -- برضة لسة فية خير"
author = "واحد"
text = "واللة برضة لسة فية خير النهاردة صبحية العيد فية ناس خبطوا على الباب - وبنت صغيرة بتاع 10 سنين نزلت من عربية ملاكى ومعاها ورق ملفوف واعطت كل شقة ورقة لحمة فيها واحد ونص كيلوا لحمة ومشيت<br />شكرا لاصحاب الفضل<br />وربنا يزيدكم<br />انما الخوف لمباحث امن الدولة تقبض عليهم لانهم بيساعدوا الناس<br />اصل اللى بيساعد الناس بيهز امن الدولة وبيبقى من حاجة فى مخ الحكومة اسمها الجماعة المحظورة<br />حكومة مهزوزة"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214444/http://masr.20at.com:80/newArticle.php?sid=13481"

