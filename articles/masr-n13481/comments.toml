subject = "الى الاستاذ حسام الزمر والاستاذ ابو سعاد"
text = "حضرتك لما بتحس بالمرض بتروح لدكتور متخرج من كلية الطب<br />ولما بيكون عندك قضية بتروح لمحامي متخرج من كلية الحقوق<br />لما تكون عايز تبني عمارة بتروح لواحد مهندس متخرج من كلية الهندسة<br />وقس على ذلك كل امور الحياة واولهم يجب ان يكون الدين اذا كانت الحياة تخصصات بالاولى بالتخصص هو دين الله عز وجل<br />تفسير فاسمع واطع للامير وان ضرب ظهرك واخذ مالك تفسيرها مجود في تراث الحسن البصري والذي يدرس في المدارس<br />من كتاب التربية الاسلامية للصف الاول الثانوي المقرر على طلبة جمهورية مصر العربية ص 73<br />مكتوب فيه<br />(وكان يخشى على المسلمين من الفتنة والفرقة (اي الحسن البصري) وتمزيق اواصر المحبة بينهم حتى انه عندما قام ابن الاشعث بثورة على الحجاج الثقفي فزع العلماء الى الحسن وقالوا له: ماذا تفعل وانت ترى الحجاج يسفك دماء المسلمين دون رحمة او شفقة ويقتل اعداءه دون قضاء او محاكمة وينفق ثروات المسلمين فيما يغضب الله؟<br />قال لهم لا تقاتلوه الا اذا اعلن الكفر بالله وانكر اصلا من اصول الدين<br />وان تكن افعاله الان عقوبة من الله فما انتم برادي عقوبة الله باسيافكم وان يكن بلاء فاصبروا حتى يحكم الله وهو خير الحاكمين<br />وكان ينهي عن سفك الدماء والخروج على الحجاج حتى لا تحدث فتنة اكبر تراق فيها دماء المسلمين وكان يرى السلام بين ابناء الامة اغلى نعمة من الله عليهم وعلى هذا النهج سار علماء عصره في الدعوة الى التسامح ولم شمل الامة وتوثيق عرى المحبة بين المسلمين (انتهى)<br />وهذا هو ما واقع الان شوف لما بتحصل مظاهرات ايه اللي بيحصل الامر الامركزي بينزل يكسر الدنيا ويقفل الشوارع وبلاوي سودا بتحصل تماما زي ما قال الحسن البصري وزي ما قال الشيخ الشعراوي وارجوا الا تتهموا العلماء المتخصصين باي شيء شوف الشيخ الشعراوي قال ايه لحسني مبارك بعد محاولة اغتياله الشهيرة في اثيوبيا<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />كلمة الشيخ الشعراوي لحسني مبارك بعد محاولة اغتياله في اديس ابابا<br />وفيها تفسير معنى افضل الجهاد كلمة حق في وجه سلطان جائر<br />هذا المقطع كان لفضيلة الامام الشيخ محمد متولي الشعراوي قبل وفاته بفترة بسيطة كان المعروف عن الشيخ انه لا يخاف سوا الله وجريء ويقول الحق امام الظالم ولو كان فرعون لا يهاب ظلمه وجبروته وانه الوزير الوحيد الذى ترك الوزارة وترك السلطة وكل شيء للتفرغ الى الدعوة وحتى يقع فى دائرتهم المعروفه .<br />فكان هذا الحديث فى مؤتمر القي فيها الرئيس والقي الشيخ كلمته المشهورة والتى ستظل فى مسمع العالم الاسلامي كله والتى لن ينساها مسلم قد سمعها وهى :<br />وانى يا سيادة الرئيس اقف على عتبه دنيايا لأستقبل اجل الله فلن اختم حياتي بنفاق ولن ابرز عنتريتي باكتراء ولكني اقول كلمة موجزة للامة كلها حكومتا وحزبا ومعارضة ورجالا وشعب .. اسف ان اقول سلبي .. اريد منهم ان يعلموا ان الملك كله بيدي الله يأتيه من يشاء فلا تأمر لأخذه ولا كيد للوصول إليه فأن الحق سبحانه وتعالي حينما حكي حوار ابراهيم للنمروز ماذا قال له .. الذى حجا ابراهيم فى ربه وهو كافر قال ان اتاه الله الملك فالملك حين ينزله الله قال يأتي الملك لمن يشاء فلا تأمر على الله لملك ولا كيد على الله لحكم لانه لا يحكم احدا فى ملك الله إلا بمراد الله .. فإن كان عادلن فقد نفع بعدله وان كان ظالما بشع الظلم وقبحه فى نفوس كل الناس فيكرهون كل ظالما ولو لم يكن حاكما ولذلك اقول للقوم جميعاً والحمد لله قد تأكد لنا صدق الله فى كلامه بما جاء من الاحداث فكيف كنا نفسر قول الله ويمكرونا ويمكروا الله فكيف كنا نفسروا انهم يكديون كيدا ونكيدوا كيدا الله يريد ان يثبت - قيوميته - على قومه فانا انصح كل من يجول براسه ان يكون حاكما انصحه بان لا تطلبه بل يجب ان تطلب له فان رسول الله قال من طلب الي شيء اعين عليه ومن طلب شيء وكل إليه .. يا سيادة الرئيس اخر ما احب ان اقوله لك ولعل هذا يكون اخر لقائي انا بك .......... ( ووضع الشيخ يده على كتفي الرئيس وقال) ... اذا كنت قدرنا فليوفقك الله فإذا كنا قدرك فليعنك الله على ان تتحمل .<br />وكان هذا فعلاً اخر لقاء للشيخ فرحمه الله<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />منقول من منتدى سوالف<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />واخيرا يا اخوة احنا لا عملاء لمباحث امن الدولة ولا الحزب الوطني احنا من اهل السنة والجماعة ونتبع علماء اهل السنة والجماعة كالحسن البصري قديما وابن باز والشيخ يوسف القرضاوي والشيخ محمد الغزالي والشيخ الشعراوي والشيخ احمد عمر هاشم اعزهم الله جميعا وبقية علماء اهل السنة والجماعة المخلصين حفظهم الله ورعاهم<br />واذكركم بأن صدام حسين الظالم الجبار المفتري اتعلق على حبل المشنقة لانه من اهل السنه والجماعة<br />اما بالنسبة للخروج على الحاكم فهو جائز شرعا ولكن له شروط<br />اولها ان تكون عندك القدرة على تغيير ذلك الحاكم زي جمال عبدالناصر كده خرج على الملك فاروق لانه كان عنده القدرة على ذلك<br />وشكرا"
archived = "2008-02-20"
capture_url = "https://web.archive.org/web/20080220062806/http://masr.20at.com:80/newArticle.php?sid=13481"

[[comments]]
order = 14
subject = "الغباء ثم الغباء ثم الغباء"
author = "وتانى"
text = "وتبرير غبائك بالشعراوى ومن هم على شاكلتة لف على المواضيع<br />نحن بغبائك لسنا فى عصور الخروج على الحاكم بصرخة يا خيل اللة اركبى فالكل هيركب حصانة او حمارة ويشيل سيفة ويروح يحارب الحاكم فى ميدان عابدين - يا غبى هذا عصر ولى زمانة زى زمان البصرى بتاعك الشيعى بتاع اظهار غير ما تبطن<br />نحن نقول ان هناك قنوات شرعية للتغيير<br />الانتخابات الحرة والشريفة لاختيار عناصر نظيفة وعندها كفاءة لانقاذ البلد من الدمار والاخبار السيئة التى نطالعها كل يوم وغرق شباب فى عرض البحار وعنوسة جيل كامل وبطالة فى كل بيت وتسول من جميع دول العالم بالاضافة الى الاعتقالات والمحاكمات العسكرية<br />نحن دولة تنهار وفى حاجة الى الشرفاء من اى ملة او مذهب او جماعة للعمل لرفعة بلدنا<br />كفاية انحدار<br />البلد مليانة كفاءات وخبرات ومخلصين فلماذا الاصرار على الحرامية وبتوع بيع البلد<br />انت انسان مريض عايش فى وهم الخروج على الحاكم<br />وهل انا اخترتة لاخرج علية والا هو مفروض بالقوة<br />انت موظف تبع الحزب او تبع الامن ثقافتك محدودة وزى ما بيقولوا لك بتقول واكل عيشك كدة ونحن لا نناقش الجهلة ومحدودى التفكير وبتوع اصل فلان قال او علان ما قلش<br />الكلام دة تقولة فى محاضرات الحزب على مصايف اسكندرية فى الدورات اللى بيعملوها<br />وربنا يشفى"
archived = "2008-02-20"
capture_url = "https://web.archive.org/web/20080220062806/http://masr.20at.com:80/newArticle.php?sid=13481"

[[comments]]
order = 15
subject = "من درر كلام الحسن البصري"
text = "من درر كلام الحسن البصري<br />قال-رحمه الله-<br />((لا يستحق احد حقيقة الأيمان حتى لا يعيب الناس بعيب فيه، ولا يأمر بإصلاح عيوبهم حتى يصلح عيوب نفسه، فإذا فعل ذلك لم يصلح عيبا إلا وجد في نفسه عيبا أخر ينبغي إن يصلحه.فإذا فعل ذلك شغل بخاصة نفسه عن عيب غيره وانك ناظر إلى عملك بوزن خيره وشره، فلا تحقرن شيئا من الخير وان صغر، فانك إذا رايته سرك مكانه.رحم الله امرءا كسب طيبا، وانفق قصدا، وقدم فضلا.إلا إن هذا الموت قد اضر بالدنيا وفضحها، ولا والله ما وجد ذو لب فيها فرحا.فإياكم وهذه السبل المتفرقة التي جماعها الضلالة وميعادها النار.رحم الله امرءا نظر فتفكر، وتفكر فاعتبر، واعتبر فأبصر، وأبصر فصبر:فقد أبصر قوم ثم لم يصبروا فتمكن الجزع من قلوبهم، فلم يدركوا ما طلبوا ولم يرجعوا إلى ما فارقوا.يا ابن ادم!!! اذكر قول الله تعالى: ( وكل إنسان ألزمناه طائره في عنقه ونخرج له يوم القيامة كتابا يلقاه منشورا أقرا كتابك كفى بنفسك اليوم عليك حسيبا)<br />عدل والله من جعلك حسيب نفسك.خذوا صفاء الدنيا وذروا كدرها))."
archived = "2008-02-20"
capture_url = "https://web.archive.org/web/20080220062806/http://masr.20at.com:80/newArticle.php?sid=13481"

