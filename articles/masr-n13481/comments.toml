subject = "رد على الاستاذ ها ها ها"
text = "انا عايزك تصور الحديث دا وانتا بتصلي الجمعة بعد الصلاة انتظر خطيب الجمعة واسأله ايه معنى هذا الحديث بس يكون خطيب الجمعة شيخ متخرج من كلية اصول الدين<br />ولما يشرحلك معنى الحديث هاتلنا الشرح وانشره على موقع عشرينات<br />وحاقولك على حديث تاني قالوا الرسول ما معناه ان في اخر الزمان الانسان حيسب والديه فقالوا له كيف يا رسول الله<br />قال يسب الرجل ابا الرجل فيسب الرجل اباه"
archived = "2008-02-20"
capture_url = "https://web.archive.org/web/20080220062806/http://masr.20at.com:80/newArticle.php?sid=13481"

[[comments]]
order = 18
subject = "الحمار اللي فوق"
author = "هاهاها"
text = "قصدك اية بعقليتك الغبية بكلمة الامير<br />الامير بندر بن عباس<br />الامير شهبندر التجار<br />والا الامير اللى هيضرب ظهرك هو صلاح نصر بتاع المخابرات والا العادلى بتاع المعتقلات<br />انهوا امير اللى عايزة يضربك على ظهرك<br />هو لسة فية ناس زيك عندها تخلف عقلى<br />انت مسمعتش عن حقوق الانسان فى الامم المتحدة والا انت لسة عايش فى عصر العبيد والجلد على الظهر"
archived = "2008-02-20"
capture_url = "https://web.archive.org/web/20080220062806/http://masr.20at.com:80/newArticle.php?sid=13481"
