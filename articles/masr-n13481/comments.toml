[[comments]]
order = 12
subject = "الى الاخ الزمر"
author = "معلق والسلام"
text = "لا تلقى اى اهتمام لهذا الشخص - فهو منفعجى من بتوع الحزب اياة - او مخبر فى امن الدولة - وكل ما يلاقى اى نقد للنظام يروح طالع بالحديث بتاعة عمال على بطال سواء فاهم او مش فاهم هو بيقول اية - اهو طربوش والسلام<br />والعينة دى كتير فى المواقع<br />وعندها غباء وراثى متأصل<br />واى واحد بينتقد يبقى اخوان<br />فلا تشغل بالك بهؤلاء المرتزقة ديدان الشعب المصرى<br />مع شكرى واحترامى<br />ابو سعاد"
archived = "2008-02-20"
capture_url = "https://web.archive.org/web/20080220062806/http://masr.20at.com:80/newArticle.php?sid=13481"

