[[comments]]
order = 8
subject = "الحمار اللى فوق"
author = "هاهاها"
text = "قصدك اية بعقليتك الغبية بكلمة الامير<br />الامير بندر بن عباس<br />الامير شهبندر التجار<br />والا الامير اللى هيضرب ظهرك هو صلاح نصر بتاع المخابرات والا العادلى بتاع المعتقلات<br />انهوا امير اللى عايزة يضربك على ظهرك وعلى طيزك<br />هو لسة فية ناس زيك عندها تخلف عقلى<br />انت مسمعتش عن حقوق الانسان فى الامم المتحدة والا انت لسة عايش فى عصر العبيد والجلد على الظهر والقعر<br />انت ابن وسخة"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214444/http://masr.20at.com:80/newArticle.php?sid=13481"

