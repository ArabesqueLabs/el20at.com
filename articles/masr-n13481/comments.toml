[[comments]]
order = 0
subject = "ذكر بط"
author = "انا"
text = "الامكانيات تسمح بذبح ذكر بط متزغط فول واخر تمام وانا فرحان بية<br />وشوربة البط مع لسان العصفور فوق اى اعتبار - وطبعا ان شاء اللة - هنعمل حلة كسكسى - وهناكل الكسكسى مع الشوربة وهتبقى اخر حلاوة<br />كل سنة وانتم طيبين<br />لينفق كل زى سعة من سعتة - وربنا يطعمنا بالحلال<br />انما دعوتى للميسورين انهم يفتكروا اهليهم واقربائهم الغلابة ويودوهم<br />ويقولوا لهم كل سنة وانتم طيبين<br />وتبسمك فى وجة اخيك صدقة<br />وزوروا امواتكم ولا تنسوا الذين راحوا<br />وثواب زيارة الايتام وادخال الفرحة فى قلوبهم تعادل كل خراف الدنيا<br />عيدكم سعيد وكل عام وانتم بخير<br />يارب تعيد علينا الايام بخير<br />هى دى عاداتنا المصرية"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214444/http://masr.20at.com:80/newArticle.php?sid=13481"

[[comments]]
order = 1
subject = "الى الاخ اللي فوق"
text = "دكر بط حته واحدة<br />دا انت راجل غني بقى<br />طيب ممكن تنظر حولك<br />ارجوك تنظر حولك في انحاء مصر المحروسة<br />وحتلاقي ناس ما عندهاش تدبح فحل بصل"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214444/http://masr.20at.com:80/newArticle.php?sid=13481"

[[comments]]
order = 2
subject = "انا ودكر البط"
author = "انا"
text = "نعم يا سيدى انا غنى برحمة اللة وسترة والغنى غنى النفس وانا اعد هذا الدكر من 3 شهور ونتولى تزغيطة بالفول انا وزوجتى وامى وهو عندى احسن من عشر خرفان<br />وسوف اعزم علية اخواتى البنات الاثنين فقط بدون ازواجهم<br />وايهى لقمة هنية تكفى مية<br />وكفاية لمتنا مع بعض واهو كل واحد يشرب لة مغرفة شوربة - هنعمل اية يعنى<br />ربنا يكملها بالستر"
archived = "2007-12-20"
capture_url = "https://web.archive.org/web/20071220214444/http://masr.20at.com:80/newArticle.php?sid=13481"

