[[comments]]
order = 10
subject = "الي الاخ صاحب الحديث"
author = "حسام الزمر"
text = "السلام عليكم<br />ما قولك يا أخي في عبد الله بن الزبير و ما قولك في أحمد بن حنبل و ما قولك في بن تيمية و ما قولك في العز بن عبد السلام<br />كل هؤلاء من أهل السنة و الجماعة و من العلماء العاملين المجاهدين وكلهم وقفوا أمام السلطان و منهم من رفع السيف و كثير غيرهم<br />بل و ما رأيك في محمد بن سعود و الامام محمد بن عبد الوهاب ؟؟؟!!!!! ألم يخرجوا على الأمير؟؟؟؟؟؟؟؟؟؟؟؟؟<br />أرجوا دراسة الفقة و أصول الفقة و التاريخ<br />و بما أنك طلبت من احد المعلقيين مراجعة أحد خريجي أصول دين أود أن أسألك عن الأحاديث التالية و كيف تجمع بينها و بين الحديث الذي أوردتة<br />( عن أبي هريرة قال : { جاء رجل فقال : يا رسول الله أرأيت إن جاء رجل يريد أخذ مالي , قال : فلا تعطه مالك , قال : أرأيت إن قاتلني ؟ قال : قاتله قال : أرأيت إن قتلني ؟ قال : فأنت شهيد , قال : أرأيت إن قتلته ؟ قال : هو في النار } رواه مسلم وأحمد , وفي لفظه : يا رسول الله أرأيت إن عدا على مالي ؟ قال : \" أنشد الله \" , قال : فإن أبوا علي قال : \" أنشد الله \" , قال : فإن أبوا علي ؟ قال : \" قاتل , فإن قتلت ففي الجنة وإن قتلت ففي النار \" فيه من الفقه أنه يدفع بالأسهل فالأسهل ) . صحيح مسلم -كتاب الايمان -الحديث 104<br />\" سيد الشهداء حمزة بن عبد المطلب , و رجل قام إلى إمام جائر فأمره و نهاه فقتله \" .<br />رواه الحاكم وصححه الألباني في \"السلسة الصحيحة\" (374) .<br />أرجوا أن تقرأ أو تسأل عن الضابط التكاملي عند تفسير النص<br />أخيراَ أقول أن الحديث تحدث عن ضرب الظهر وأخذ الأموال ولم يتحدث عن موالاة اليهود و الأمريكان و حصار الفلسطنين في غزة و الكثير مما فجعنا بة \"أمراء\" أخر الزمان .<br />أخيراَ أود أن اؤكد أني لا أدعوا للخروج على الحاكم و لكن ردي فقط حتى لا يتخذ الاسلام مطية للدعوة للخنوع<br />\"و لولا دفع الله الناس بعضهم ببعض لهدمت صوامع و بيع و صلوات و مساجد يذكر فيها اسم الله كثيرا و لينصرن الله من ينصره ان الله لقوي عزيز\" &--64831;40&--64830; الحج"
archived = "2008-02-20"
capture_url = "https://web.archive.org/web/20080220062806/http://masr.20at.com:80/newArticle.php?sid=13481"

