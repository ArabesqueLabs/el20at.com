subject = "تركيب العطور"
author = "وليد"
posted = "2008-01-11"
text = "بسم الله الرحمن الرحيم<br />استاذي الفاضل بعد التحية مع احترامي الفائق لرايك انا مش معاك لا ن مجال تركيب العطور مجال كبير وان مش اي حد ممكن يعمل بة ويستمر لان محتاج الي خبرات كبيرة انا اعمل بمجال تركيب العطور تقريبا منذ ستة سنوات او اكثرولم يشتكي احد من ضرر من استخدام هذة العطور لاني استخدم انواع عطرية مميزة وجيدة ولكبراي الشركات العلمية لتصنيع العطور واضيف ان العطور التركيب اقتصادية وغير مكلفة وفي متناول الجميع ومنها انواع ذات اسعار باهظة جدا حسب طلب المستهلاك وايضا تساعد اي فرد يختار نوع العطلا اللي يناسب ذوقة وشخصيتة والحمد للة عليها اقبال شديد ولكن مشكل اللي بيعمل بها ممتميز التميز للخبرة وشكرا<br />السلام عليكم ورخمة الله وبركاته<br />وليد"
