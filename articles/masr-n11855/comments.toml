[[comments]]
order = 0
subject = "قلة حياء"
author = "السيد سرحان"
posted = "2007-10-10"
text = "المؤلف والمخرجة يتميزون بغباء واضح ووقاحة زائدة وواضح ان قلة الفهم فى عقولهم جعلتهم يلقون بالفشل على المشاهدين<br />وانا اطالبهم بترك هذة المهنة التى اصبحت مهنة من لا مهنة لة والعمل فى محل عصير قصب او دكان كشرى وان يأخذوا دورة تأهيلية فى مركز الاعاقة النفسية<br />ربنا يشفى الكلاب ويضرهم"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120427/http://masr.20at.com:80/newArticle.php?sid=11855"

[[comments]]
order = 1
subject = "مش كفايه اننا استحملنا"
author = "سناء خلف"
posted = "2007-11-05"
text = "استحملنا المسلسل حلقه ورا حلقه وكل شويه نقول هيبقي كويس هيبقي كويس ومفيش فايده ولا حياة لمن ينادي<br />المسلسل تأليف واخراج الست اللي عماله تشتمنا دى مش تقوليلنا في الاول علي موضوع الاكسجين ده كنا اتفرجنا عالمسلسل في الانعاش واحنا معلقين المحاليل الراجل نجم عالمي والله وسقط في بحر من السذاجه وقع في مسلسل كارتون وكمان دمه تقيل انا شايفه انك تاخدي اكسجينك وتبعدي عننا خالص دي قلة ادب والله ووقاحه وعلي رأى سومه ابن صاحب العماره ناحو بقي"
archived = "2010-03-14"
capture_url = ""
