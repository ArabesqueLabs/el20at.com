posted = "2009-07-24"
text = "يالا السخافه<br />\" صنع اكبر سدر كنافه \" أهذا هو طموحهم وغايتهم واحلامهم واهميتهم<br />بدل ان يدخلوا كتاب جينيس بالشعب الذي ضحى وسعى لتحرير بلاده وللدفاع عن الوطن ولكن ياللهول ما عساني ان أقول إلا \" إن لله وان اليه راجعون \"<br />أهذا هو العرس الفلسطيني -- ظننت انهم يطلقون اسم العرس الفلسطيني بيوم فك حصار غزه او بيوم تحرير البلاد أجمع ولكن \" إن لله وان اليه راجعون \"<br />صدق القائل \" العري جرب \" ما بهمهن غير بطونهن"
