text = ":lol:<br />:lol:<br />يا ولاد بلدنا يوم الخميس ------ هااكتب كتابى وابقى عريس<br />ها اكتب كتابى على الحلوة زوبة<br />جرى اية يا عم نظيف انت لسة شباب وفيك للنسوان والا الموضوع مرفوع من الخدمة من زمان قوى<br />على العموم بالرفاء والبنين وتخلفوا نظيف صغير وتسموة رابسو يغسل اكبر بياضا وينظف على الباقى<br />هى العروسة بنت زكى مين - مصيبة ليكون زكى بدر واخت وزير التربية الجديد<br />الهى وانت جاهى تكون العروسة قدم السعد والخير وتخرج من الوزارة<br />ابقى ادعى الناس الغلابة فى الفرح يمكن يشوفوا اللحمة شكلها اية<br />وابقى افتكر ملايين الشباب المصريين الغلابة اللى وصلوا لسن الخمسين ولسة متجوزوش ولسة بيحوشوا تمن الشبكة والشقة"
