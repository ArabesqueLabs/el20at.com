author = "تهنئة من الشباب"
posted = "2010-01-19"
text = "تهنئة من شباب مصر اللى مش عارف يتجوز ودايخ السبع دوخات علشان يدخل دنيا قبل عمرة ما يخلص ويطلع من الدنيا<br />مبروك يارئيس الحكومة اهى الدولة جهزتك وجوزتك - وارتاح بالك ونلت اللى فى خيالك ابقى يا اخويا بص بنظرة عطف للشباب الغلابة العطلانين التعبانين<br />وجوازتك من الست بتاع المعلومات دى تبقى حكومة دوت نت فعلا وابقى افتكر الشعب برغيف ديجتال واوعى تهنج ليلة الدخلة لتبقى مصيبة وبعدين نعمل لك فرمتة ونحمل برنامج جديد<br />وبعدين شوف الوزراء اللى عندك من غير جواز زى الاخ بتاع الثأفة ( الثقافة )<br />وهنقول اية<br />بالرفاء والبنين"
