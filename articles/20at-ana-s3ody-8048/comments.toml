subject = "ولم لا نرقص مع بوش"
author = "حبيب"
posted = "2008-01-17"
text = "السلام عليكم في البداية .. بعد كده نخش في الموضوع .. ونطرح سؤال : ليه ياجماعة زعلانين من الرقص مع بوش .. وأنا باتفرج علي الصور بتاعة الزيارة .. شفت صورة كده لمجموعة من الأخوة السعوديين رافيعن سيوفهم وبوش واقف على جنب كده هو والملك عبد الله بيرقصوا بالسيوف .. قلت يالله .. المفروض فعلا في الواقع ان السيوف دي تكون مرفوعة على عدو الله بوش بن أم بوش بدل ما بنهز ياوز معاه .. وتحيا مصر"
archived = "2010-03-14"
