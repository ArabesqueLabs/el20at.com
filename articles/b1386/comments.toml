subject = "فين ردك؟"
author = "mucha"
text = "أستاذ ناجى العلى انا مش باهاجمك و لم اصفك بنقص الثقافة كما فعلت انت<br />و بدل ما تفضل تهاجم و خلاص طب ما ترد على النقاط اللى انا انتقدتها و نتناقش ايه المشكلة؟<br />و حتى لو انا ثقافتى السنيمائية قليلة زى ما بتقول ايه المشكله لما تصحح مفاهيمى؟<br />لما انت رديت الاول و قلت على لحافك مديت رجليك....ماشى ده نقص امكانيات محدش يلومك فى لكن الاخراج نفسة و زوايا التصوير ملهاش دعوه بالامكانيات<br />فى حاجة كمان مهمة جداً كون ان فى حد دخل و استهزأ بك او بالفيلم فده لا يستحق ان ترد عليه اصلاً وما تنزلش لمستواه انت ترد على اللى اتكلم على الفيلم الموضوع مالوش علاقة بالمصريين<br />مستنى ردك على النقاط التى انتقدتها فى الفيلم و اتمنى ان يكون صدرك اوسع من ذلك<br />mucha (موتشا)"
