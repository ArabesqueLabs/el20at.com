[[comments]]
order = 26
subject = "إلي ناجي العلي وموتشا"
author = "هشام عاصم , دارس للإخراج السين"
posted = "2008-01-24"
text = "صديقي العزيزين<br />أري أن النقاش بينكما لم يكن علي المستوي الأمثل الذي نطمح إليه لننهض بأمتنا وفنوننا وإقامتها من عثرتها , وأري أن موتشا كان من الممكن أن يوصل نفس رسالته بأسلوب أفضل كثيرا , وأري أيضا أن كثيرا من نقاط نقضه ليست صحيحة ولا علمية (مثل خداع الإسم , و الهواء والاستخدام الاسم كثيرا ) , وربما كان أفضل لو استوضحها من ناجي بدلا من الهجوم المباشر<br />أنا رأيت الفيلم ولم يعجبني أكثره لكني رأيت في المخرج نقاط يفتقدها 90% من المخرجين المعاصرين ولعمري هذا ما نحتاجه في تلك الفترة<br />* احترمت كثيرا التزام ناجي بالحجاب في الفيلم مع أن الدراما لم تستدعي هذا , وهذا شئ أكثر من رائع , و أعتقد أن استخدامك الحجاب حتي لو كان غير موظف أفضل بمراحل من مشاهد العري والشذوذ الغير موظفة دراميا أيضا التي اجتاحت إعلامنا العربي<br />* احترمت اهتمام المخرج بذكاء المشاهد بدلا من تلقينه بالأسلوب الرتيب الذي اعتدناه وحفظناه<br />وأعتقد أن من لم يجرب العمل في إخراج الأفلام المستقلة يعتقد أنها من أسهل ما يكون وأنها بمجرد ضغطة زر , ومن يدخل الميدان سيواجه عشرات المشاكل الفنية والمصاعب الغير متوقعه والذي لم يكن يتخيل وجودها مثل قيادة الممثل وعيوب أماكن التصوير وضعف الكاميرات وما إلي ذلك<br />أعجبني أيضا بشدة استمرار ناجي في العمل وعدم اكتفائه بعمل واحد وهذا ما يدل علي اصراره علي النجاح وأعتقد أننا سنري منه فنا متميزا في الفترة القادمة<br />و أشجع فيك التزامك بحجاب الممثلة وأتمني أن تستمر عليه في باقي الأعمال<br />هشام عاصم<br />طالب في الإخراج السينمائي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 27
subject = "ينقصة الكثييييييييييييييييير"
author = "Mucha"
text = "أولاً أنا رحبت جداً بفكرة عرض الفيلم على الموقع و انه أكيد عايز يوصل فكرة معينة خاصة انه فيلم قصير (20 د) فقلت اكيد هاشوف حاجة روعة ما قل و دل يعنى<br />1-فى الأول تكرار ممل لاسم ناجى العلى,افلام ناجى العلى اخراج ناجى العلى قصة ناجى العلى<br />2-فكرة عرض اسماء الابطال فى الاول ما زلت مصر انها غلط المفروض تكون بعد الفيلم لأنى خلاص حفظت اسم الشخصية و تفاعلت معها يبقى لما تقولى فى الاخر قام بدور فلان فلان هابقى عارف لكن ماتتوقعش انى لما اشوف اسم البطل الحقيقى فى الاول هاقدر اعرف مين بيعمل ايه!!!!!<br />3-المسيقة التصويرية تقليدية مووووووووووووووووت<br />4-فى صوت هواء على طول و كأن فى تكييف مفتوح او حاجة زى كده و كمان بيتغير مع تغير المشهد و ده اعتقد نتيجة الوسائل البدائية لتسجيل الصوت<br />5-بصراحة وجوه الممثلين غير سنيمائية خالص دى حاجة مالهومش ذنب فيها و ممكن يكون الدر انها وجوه من واقع الحياه و بتاع بس دى حجة فارغة خاصة ان الاداء مش احترافى اصلاً<br />6-زوايا التصوير مفهاش اى افكار جديدة الا لو اعتبرنا تصوير وجه اكرم من خلال يد الفنجان او البراد مش فاكر<br />7-معرفش ايه العلب اللى مكتوب عليها سم قاتل و بتاع مش مبلوعة دى<br />8-الحوار طويل و ممل بجد و تقليدى انت قدمت ايه جديد؟<br />9-مشهد الحموم الطويل بتاع اكرم ده بيتكرر بنفس الطريقة بس هو غير الزاويا فى المرة التالتة بس بنفس صوت المياه المزعج<br />فى النهاية يا ريت تعرفوا ان نقدى ده بناء لو قلت الفيلم رائع و الاخراج رائع هانفضل كده مبتدئين على طول"
