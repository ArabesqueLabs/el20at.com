[[comments]]
order = 33
subject = "بين الرد على رأى شخصى .. والرد على النقد"
author = "ناجى العلى"
text = "الرد على رأى موتشا<br />السلام عليكم ورحمة الله وبركاته<br />العضو موتشا ..<br />لم اكن اريد ان ادخل فى مزيد من الحوارات للرد على سطورك .. لان الارضيه المشتركة للرد غير موجوده<br />لكن ان كان الرد دليل على اتساع صدرى .. فاليك الرد<br />أستاذ ناجى العلى انا مش باهاجمك و لم اصفك بنقص الثقافة كما فعلت انت<br />نعم .. لديك نقص فى الثقافة السينمائية .. اكررها نعم .. وهذا ليس عيباً لانك تفتقد الى ثقافة تخصصية وليست ثقافة عامة ..<br />وما كتبته سيادتك اسمه ملاحظات او راى شخصى لا يرقى الى النقد المبنى على دراية بما تنقده لنقص ثقافتك فيه<br />وعليه .. لا يحق لك الدخول فى دائرة النقد وما تقوله يندرج تحت مسمى .. رأى شخصى ..<br />و حتى لو انا ثقافتى السنيمائية قليلة زى ما بتقول ايه المشكله لما تصحح مفاهيمى ؟<br />تمام .. يبقى من باب اولى تسرد المفاهيم بشكل اسئله لكى اجيب عليها ..<br />وذلك قبل رص الملاحظات وكتابتها بشكل جمل خبرية تعطى انطباع بانك جبت الديب من ديله ..<br />راجع رسالتك كلها من اولها الى اخرها سلسلة من العبارات والجمل التى تنم عن نقص تلك الثقافة السينمائية المرتبطة بالسينما المستقلة ..<br />فى الأول تكرار ممل لاسم ناجى العلى,افلام ناجى العلى اخراج ناجى العلى قصة ناجى العلى - المسيقة التصويرية تقليدية مووووووووووووووووت - فى صوت هواء على طول و كأن فى تكييف مفتوح او حاجة زى كده و كمان بيتغير مع تغير المشهد و ده اعتقد نتيجة الوسائل البدائية لتسجيل الصوت - بصراحة وجوه الممثلين غير سنيمائية خالص دى حاجة مالهومش ذنب فيها و ممكن يكون الدر انها وجوه من واقع الحياه و بتاع بس دى حجة فارغة خاصة ان الاداء مش احترافى اصلاً- زوايا التصوير مفهاش اى افكار جديدة - معرفش ايه العلب اللى مكتوب عليها سم قاتل و بتاع مش مبلوعة دى - الحوار طويل و ممل بجد و تقليدى<br />عد كام كلمة ممل و تقليدى وعادى وحجة فارغة و اداء مش احترافى و بتاع مش مبلوعة دى<br />كلام كله سلبى غير مبنى على اساس ولا يحق ان نطلق عليه نقد بناء<br />فى النهاية يا ريت تعرفوا ان نقدى ده بناء لو قلت الفيلم رائع و الاخراج رائع هانفضل كده مبتدئين على طول<br />وايه المشكلة لو قلت الفيلم او اى فيلم رائع وحلو بس فيه شوية ملاحظات .. وتروح قايل الكلام اللى انتى عاوزه وتقول فى الاخر دا رأى شخصى .. وليس نقد لانى غير متخصص فى هذا الموضوع<br />انا هاعتبر ان سيادتك قلته بردك للمرة التانيه وانك عاوز تعرف ايه الموضوع حيث انك ذكرت بطلبك<br />مستنى ردك على النقاط التى انتقدتها فى الفيلم و اتمنى ان يكون صدرك اوسع من ذلك<br />وسأعتبر ان صحة الجملة هى<br />مستنى ردك على النقاط التى كانت نتاج رأى شخصى فى الفيلم<br />سوف ارد على ارائك وليس على نقدك لاننى لم اقراء نقداً ..<br />فى الأول تكرار ممل لاسم ناجى العلى,افلام ناجى العلى اخراج ناجى العلى قصة ناجى العلى<br />الفيلم المستقل هو فيلم يتم انتاجه فى ظروف غير تجارية وفق انتاج فردى وغير خاضع لموسسات رسمية<br />وبالتالى وفق محدودية الميزانية فانه يتم اللجوء الى تنفيذ الفيلم المستقل باقل ميزانيه عن طريق اسناد بعض الاعمال فى الفيلم للمشتركين فيه .. يعنى انا ممكن امسك كلاكيت وانا بصور .. واكون المخرج والمونتير .. تانى حاجة ممكن يكون الممثل هو اللى كاتب القصة .. ممكن اكون مونتير ومخرج ومصور .. ليست القضية بتكرار الاسم .. لكنه الاحتياج الفنى الى توفير وتقليص المشاركات لنقص المادة يؤدى الى قيام الفرد المشترك فى الفيلم باكثر من مهمة وفق ما اراه كمدير للعمل<br />فى صوت هواء على طول و كأن فى تكييف مفتوح او حاجة زى كده و كمان بيتغير مع تغير المشهد و ده اعتقد نتيجة الوسائل البدائية لتسجيل الصوت<br />ليس هناك ما اسميته وسيلة بدائية للصوت .. لكن هناك كواليتى الصوت اثناء المونتاج لم يتم التحكم به بشكل احترافى<br />الموسيقة التصويرية تقليدية مووووووووووووووووت<br />رأى انا انها هايلة مووووووووووووووووووووووووووت<br />بصراحة وجوه الممثلين غير سنيمائية خالص دى حاجة مالهومش ذنب فيها و ممكن يكون انها وجوه من واقع الحياه و بتاع بس دى حجة فارغة خاصة ان الاداء مش احترافى اصلاً<br />راى انا .. بصراحة وجوه الممثلين سنيمائية خالص دى حاجة مالهومش ذنب فيها و ممكن يكون انها وجوه من واقع الحياه و بتاع بس دى حجة سليمة جدا خاصة ان الاداء لموهوبين على اول طريق الفن<br />الحوار طويل و ممل بجد و تقليدى<br />راى انا .. الحوار حلو وهايل<br />زوايا التصوير مفهاش اى افكار جديدة<br />اعتقد انك تقصد ان زوايا التصوير كلها افكار جديدة<br />معرفش ايه العلب اللى مكتوب عليها سم قاتل و بتاع مش مبلوعة دى<br />دا انت ماشفتش الفيلم بقى ؟؟ !!!!!!<br />العضو موتشا .. كل ماذكرته لم اجد فيه اى مجال للنقاش لانها للمرة الميلون رأى شخصى بحت<br />وفقك الله لما هو فيه الخير<br />ناجى العلى<br />مخرج مستقل"
