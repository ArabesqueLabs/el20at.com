text = "اه معلش بجد عشان انا مش فاهم انا اول ما سمعت كلمة ناجي العلي فكرته فيلم قديم عمله ناجي العلي رسام الكاريكاتير الأشهر في تاريخ العرب<br />لكن فوجئت في كلمة ان البنت محجبه جوا البيت عشان الفيلم يبقى ملتزما ؟؟؟ حاولت افهم مفهمتش ناجي العلي اللي هو ناجي العلي يعمل فيلم في بنت محجبه وجوا البيت ؟؟ دا هطل ولا عبط ولا اسمه ايه ؟ بعدين اخدت بالي ان في حد تاني اسمه ناجي العلي ...الرجاء بس عشان اكيد في ناس زيي ياما نزلوا الفيلم على اساس انه ناجي العلي توضحوا بعد اذن جناب حضراتكم ان الفيلم مش لناجي العلي الكاريكاتور بلاش تماحيك بجدوإستغلال لاسم رجل زي دا ."
