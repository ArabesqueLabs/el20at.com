subject = "إنت هايل"
author = "mucha"
text = "يعنى المشكلة انى سميت كلامى نقد مش رأى شحصى؟ يا عم سميه زى ما انت عايز بس انت كده عايز اللى يشوف الفيلم يكون ناقد سينيمائى عشان كلامه يعجبك و اكيد نسبة كبيرة من الى هايشوفو الفيلم مش دارسين سينيما فكل واحد هايعبر بطريقتة<br />انا بجد مش شايف اى جديد فى الفيلم هو لازم الواحد يكون دارس عشان يعمل فيلم زى ده؟<br />ممكن يكون الفيلم امكانيته ضعيفة لكن فكرتة جديدة...اه...حاجة كمان كلمة ممل و عادى و الكلام ده بيتقال على افلام اكبر من كده و خش على الياهو و شوف الCritical Consensus بيقولوا ايه او الUser Reviews ماشوفتش مخرج دخل و اتهم الناس انهم معندوهومش ثقافة سينيمائية<br />انا مش عارف ردك هجومى ليه على طول<br />سلام"
archived = "2010-03-14"
