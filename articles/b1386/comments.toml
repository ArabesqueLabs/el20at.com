[[comments]]
order = 35
subject = "الانتر لوب وطريقة 4-4-2"
author = "ناجى العلى"
text = "السلام عليكم ..<br />على الرغم من قيامى بالاعداد والتحضير لفيلمى الثانى ( صور الحب والكراهية ) وعدم تفرغى الكامل الا اننى اجد نفسى ملزم بالرد على رسائل الاعضاء لكى لا اتهم باننى فى واد وهم فى واد اخر ..<br />ولاننى رأيت ان ذلك الموضوع من الاهمية للتفرقة ووضع اسس للنقد بشكل مثمر<br />انت كده عايز اللى يشوف الفيلم يكون ناقد سينيمائى عشان كلامه يعجبك ..<br />لم اشير الى ان الفيلم للمختصين فقط ..<br />انما ما اردته هو ان يكون الرد بطريقة تنم عن خلفيه صاحب الرد و عليه يكون الرد وفق حجم خلفية صاحب الرد .<br />وهو ليس شىء مشين او يعيب صاحبه<br />و اكيد نسبة كبيرة من الى هايشوفو الفيلم مش دارسين سينيما فكل واحد هايعبر بطريقتة<br />اديك قلت يعبر بطريقته .. مش ينقد بطريقته .. يعنى من الاخر كده .. بلاش بقى نقول نقد ..<br />ينفع تتكلم عن الدكتور الفلانى او العلانى فى قصر العينى انه كويس او حش .. وتروح قايل اصله مايفهمش فى الانتر لوب وانت مش فاهم ايه هو الانتر لوب ... ؟؟؟؟<br />يعنى تقول رأيك فى الدكتور وفق احساسك او وفق سمعته فى الاوساط الطبية ..بدون ما تدخل نفسك فى كلام انت مش قده ..<br />يحق لى ان اقول انا شايف ان الزمالك فريق مابيلعبش حلو .. ادارته تعبانه ..<br />لكن ماينفعش اقول اصل الهجوم والدفاع وطريقه 4-4-2 هى اللى بتخليه يخسر وانا ماعرفشى اصلا ان الفريق عدده فى الملعب لا يزيد عن 11 لاعب .. ماينفعش اقول ساعتها انا ناقد رياضى ياسيد موتشا<br />انا بجد مش شايف اى جديد فى الفيلم هو لازم الواحد يكون دارس عشان يعمل فيلم زى ده ؟<br />تانى .. كل اللى قلته ان الواحد يكون فاهم هو بيتكلم عن ايه ومع مين ..<br />ماشوفتش مخرج اتهم الناس انهم معندوهومش ثقافة سينيمائية ..<br />مع كامل احترامى لكل اللى بيتكلم ومع بعض التحفظات على اسلوب يوسف شاهين الا انى بجد بحترمه جدا جدا كصاحب فكر .. لان مش كل من هب ودب يقدر يقول كلمه هو مش قدها قدامه ..<br />اعمل حساب للى قدامك<br />سميها زى ماتسميها ديكتاتورية نرجسية اى حاجة من الحاجات الوحشة دى..<br />انا مش عارف ردك هجومى ليه على طول<br />لكل فعل رد فعل سيد موتشا<br />مع أرق تحياتى واطيب امنياتى<br />ناجى العلى"
archived = "2010-03-14"
