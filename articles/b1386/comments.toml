text = "اولا .. فين نقدك للفيلم ؟؟<br />تانيا .. ناجى العلى الفلسطينى رسام الكاريكاتير يعمل فيلم ؟؟؟؟؟؟ حلوه النكته دى<br />تالتا .. اسمى ناجى على عبد المنعم .. اسم الشهرة من كل الناس اللى تعرفنى .. ناجى العلى .. اعمل ايه ؟؟<br />رابعا .. انا مش عارف ليه الكلام بين الناس فى مصر بالفظاظه دى ؟؟؟ صدقونى انا كل ما بقراء رد اوله استظراف او اول سطر فيه استهزاء او كلام مش بناء .. بعرف ان اللى كاتب ده مصرى .. معندوش فى كلامه الا الشجب والادانه بدون انت ماتعرفنى ولا عمرك شوفتنى .. نبطل بقى سوء الظن ده فى بعضينا<br />وبعدين لما جناب سعادتك مش عاجبك الحجاب دا .. فدا موضوع تانى ابقى خللى فاروق حسنى يتناقش معاك فيه احسن<br />ناجى العلى<br />مخرج مستقل"
