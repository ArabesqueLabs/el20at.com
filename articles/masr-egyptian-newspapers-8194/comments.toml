[[comments]]
order = 3
subject = "عودة فرعون و هامان"
author = "طيف بدر"
posted = "2008-02-16"
text = "http://alayasser.maktoobblog.com/821381/%D8%B9%D9%88%D8%AF%D8%A9_%D9%81%D8%B1%D8%B9%D9%88%D9%86_%D9%88_%D9%87%D8%A7%D9%85%D8%A7%D9%86<br />سيادة بشكل جديد<br />أن تكون مجبرا على شراء القمح من أمريكا !<br />أن تكون مرتبطا ارتباطا شبه كليا بالمعونة الأمريكية !<br />عندما يكون في مصر مركز أمريكي \"لتطوير\" التعليم المصري !<br />عندما تفرض محكمة أمريكية غرامة 50 مليون دولار على الحكومة المصرية ! هنا<br />عندما تقوم وزارة الخارجية الأمريكية بتقييم أداء الحكومة المصرية تجاه المواطنين المصريين !<br />عندما ترسل الاستخبارات الأمريكية بمن تشتبه بهم إلى القاهرة لكي تقوم وزارة الداخلية المصرية بالتحقيق معهم ثم إرسال نتائج التحقيق إلى أمريكا ... مع تعظيم سلام و \" تمام يا أفندم \" !<br />عندما ترعى الحكومة الأمريكية جماعات طائفية و انفصالية تهدد مصلحة مصر و أمنها الاجتماعي !<br />عندما تأمرك أمريكا \" ابعت جيشك يطرد العراق من الكويت \" فتقول \"سمعا وطاعة \" !<br />عندما تكون ملزما ببيع الغاز الطبيعي لإسرائيل بربع الثمن الذي يباع به للمصانع الوطنية المصرية !<br />عندما تضرب الحكومة المصرية قرارات القضاء المصري بعرض الحائط و يستمر اليهود في المجئ إلى دمنهور للرقص حول ضريح \" أبو حظيرة \" و في سبيل \" العارف بيهوه أبو حصيرة ، فملعون أبو أهل دمنهور \" !<br />عندما تتوغل دبابة صهيونية 3كـ داخل سيناء و تقتل رب أسرة مصري و تصيب آخرين و تلحق أضرارا بالمباني و البيوت و لما تجف بعد دماء ثلاثة جنود مصريين قضوا غدرا !<br />عندما يكون هناك 45 ألف شاب مصري متزوجين من إسرائيليات داخل إسرائيل !<br />عندما لا تتوقف \" إسرائيل \" – و على الرغم من معاهدة السلام – عن تجنيد الجواسيس ضد مصر !<br />عندما تمنع الحكومة المصرية التصريح لأحد رجال الأعمال لإنشاء مصنع لتصنيع التليفزيونات بدوائر إلكترونية حديثة مصممة و مصنعة مصريا خالصا من أصغر جزء شبه موصل و حتى أعقد الدوائر المتكاملة و ترفض بناء مصانع أسمدة النترات استجابة للتعليمات القادمة من الأسياد !<br />كل ما ذكرته الآن لا يمس السيادة المصرية و لا الكرامة المصرية و لا يهدد الأمن القومي المصري !!!<br />اقرأ : وطنية الخنازير<br />لكن ...<br />وجود حماس في غزة التي لا تتعدى مساحتها مساحة حي المعادي و قدوم الفلسطينيين لإلى سيناء لشراء ما يكسرون به حصارهم و يسدون به جوعهم هو الذي يهدد مصر و ينذر بغزو فلسطيني حمساوي للأراضي المصرية قد يصل إلى نحيط قصر عابدين ، و على كل مصري لازم يشيل الشومة بتاعته و يدافع عن بيته !!<br />هذا هو حال الإعلام السلولي في بلدي .... السلوليون و حظائر الخنازير الأمريكية جعلت الفلسطينيين كلهم إرهابيين و لصوص و كارهين لمصر و مخربين و ما من نقيصة إلا و ألصقها الساقطون بهم ... المرء يتساءل في حيرة : \" هل إسرائيل هي العدو أم فلسطين و مقاومتها التي تدافع عن الأمن القومي لأقطار كثيرة في المنطقة ؟ \"<br />بوجوههم الفاشية يطلون على شاشات التليفزيون و بأقلامهم البغيضة ينفثون السموم و الأكاذيب في الصحف، يقلبون الحقائق و يبدلون الكلم عن مواضعه، لو أدركهم (جوبلز) لعلم أنه لازال صغيرا و كان عليه أن يتعلم المزيد على يد (أسامة سرايا) و (كرم جبر) و (حمدي رزق) و (محمد علي إبراهيم) ... إلى آخر تلك القائمة \"الهامانية\" . جاءت أحداث غزة لتكشف أكاديميات ترويج الخرافات و الأباطيل في (روز اليوسف) و ( الأهرام) و إن كنا نحن المصريين لم ننسى أكاديميات الشؤم هذه خلال الانتخابات التشريعية و الرئاسية و في أمر العبارة الغارقة و مذبحة (بني مزار) .<br />على نفس الأرض و قبل آلاف الأعوام أعلن فرعون أن موسى هو كبير السحرة و أن موسى ينشر في الأرض الفساد و هامان من خلفه يحرض الرعية و الحاشية بالباطل يشحنهم ضد موسى و دعوته ....<br />لكن ما فقه فراعنة هذه الأيام أن الله ترك بدن فرعون عبرة للعالمين !!!<br />أسأل الله ( عز وجل) ألا نكون نحن المصريين كآل فرعون فيكون مآلنا كمآلهم إن لم نعمل عقولنا و نحلل ما يرد إلينا من أخبار .فرق كبير بين فرعون موسى و فراعنة هذه الأيام : فرعون موسى كان يستكبر لحسابه أما فراعنة هذه الأيام فهم يستكبرون و يفترون لحساب الآخرين وراء الأطلسي أصحاب حظائر الخنازير .<br />هؤلاء بعض من الذين وقفوا أمام تلفيقات فرعون و هامان و لم يسلموا عقولهم للشعوبيين الشوفينيين ... و غيرهم كثر<br />أسبوع الالتياس العظيم<br />حماس ... نهار يحتاج إلى دليل<br />بيان من مصري إلى أهل غزة<br />“الأمنيين - القوميين - المصريين “<br />لسنا أحجارا على رقعة الشطرنج<br />يعني إيه أمن قومي ….؟؟<br />مدونة \"ادعم غزة\"<br />أنا كدة<br />أنا بكره فلسطين !<br />كأس إفريقيا ...فرحة منقوصة<br />و هل هناك مصري لا يسعده هذا الانتصار الرياضي ؟! أنا بالذات فرحت بالخصوص من أجل أبو تريكة الذي لم يهز هدفه فقط شباك مرمى الكاميرون بل زلزل به النفوس الوقحة للسلوليين و الشوفينيين و العصبيين في مصر الذين أرقهم تفاعل الرجل مع آلام و قضايا أمته حتى كادوا أن يرموه بالعمالة لسوريا و إيران و حماس !!<br />و أنا أنظر إلى شوارع الإسكندرية التي أصبحت بحرا تلونت أمواجه بالأحمر و الأبيض و الأسود لم أشعر بأن فرحتي كاملة ... هل هذا هو حب الوطن و حب مصر ؟<br />ليس هذا هو حب مصر عندما يمسك بعضهم العلم باليمين و سيجارة الحشيش بالشمال !!!<br />ليست هذه هي الوطنية في فتاة رسمت على بطنها العارية ألوان العلم الثلاثة !!!<br />ما معنى أن ألوح مع رفاقي بالعلم حتى إذا وجدنا مجموعة من الفتيات حاصرناهن بالأعلام للاحتفال على مغازلتهن ؟؟<br />ياترى هل هذا الشباب الذين يلفون أجسادهم بالعلم المصري لن يلقوا بأنفسهم في قوارب الموت بحثا عن لقمة العيش ؟<br />هل معنى الوطنية و الانتماء انحسر في تشجيع منتخب الكرة ؟<br />مع كل شيء ... ألف تحية لرجال المنتخب الوطني و لمعلمهم حسن شحاتة و للفارس المسلم (محمد أبو تريكة) !!!<br />كونوا دوما من أهل السجود ، يعزكم الله و يذل بكم أهل الجحود !!"
archived = "2010-03-14"
