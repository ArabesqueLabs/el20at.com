text = "دا مش كلام صحفى - دا كلام واحد ممكن يبقى جزماتى - وفية يظهر الجهل بابسط السياسات<br />يا بنى ادم يا غبى لو عسكرى مصرى على الحدود ضرب طلقة على فلسيطينى والفلسطينى مات وتم تعبئة الفلسطنيين ضد مصر - يبقى دور حسنى مبارك اللى بيتدارى وراة وحل القضية الفلسطينية راح فى الكازوزة ويبقى من غير شغلة<br />ووزير المخابرات عمر سليمان مش هيلاقى احد يقابلة فى غزة اللى كل يومين رايح هناك ينقل رسايل ويجيب رسايل - هيبقى صايع ومش لاقى شغل<br />اكتب كلام موزون ومعقول"
