subject = "وطنية الخنازير !!!"
author = "طيف بدر"
posted = "2008-02-16"
text = "http://alayasser.maktoobblog.com/800395/%D9%88%D8%B7%D9%86%D9%8A%D8%A9_%D8%A7%D9%84%D8%AE%D9%86%D8%A7%D8%B2%D9%8A%D8%B1_%21%21%21<br />خبر عاجل :<br />سلاح الجو التابع لكتائب القسام يدمر ميناء الإسكندرية بالكامل .<br />القوات المصرية تتراجع في سيناء أمام توغل جيش الاحتلال الحمساوي الغاشم بعد مد إيران لجسر جوي بين طهران و غزة .<br />أنا لن أشعر بالدهشة إذا قرأت هذين السطرين المذكورين أعلاه على الصفحة الرئيسية الأولى للأهرام أو الأخبار أو الجمهورية أو روزاليوسف أو لو أذاعتهما وسائل الإعلام الحكومية المصرية ... التحريض الإعلامي الرسمي على الفلسطينيين و حماس بشكل خاص بلغ حدا لامعقولا لدرجة السعار مما يدفعك لكي تتساءل : \" هل أنا في تل أبيب ؟ \"<br />يثبت هؤلاء الإعلاميون الذين نشأوا في حظيرة الخنازير الأمريكية يوما بعد يوم أنهم باطنيون مصابون بشذوذ عقلي و نفسي يدفعهم للتفكير في سلامة مصالح واشنطن و تل أبيب لا مصالح بلادهم و أوطانهم .... مفضوحون كلما تحدثوا او تنفسوا ، لا ترتقي عقولهم حتى إلى مستوى الخنازير ... لذلك لن يفهموا الدرس حتى يأتي وعد ربك بإلقائهم في مزبلة التاريخ قبل حرق وجوههم في قاع الجحيم .<br />ما صفات الخنازير هذه الأيام ؟؟<br />الخنزير هو صحفي أو إعلامي يولول هذه الأيام على سيادة مصر و كرامة و أمن مصر القومي لأن أهل غزة يريدون أن يشتروا ما يسدون به جوع أطفالهم و فك سجنهم و لكننا لا نسمع ولولتهم عندما يفتخر اليهود بذبح الأسرى المصريين ثم نستقبلهم على أرضنا بكل ترحاب.<br />لا تعلو أصواتهم عندما يدخل اليهود بدون تأشيرة ولا إذن إلى مصر مرتدين قلنسواتهم للرقص حول ضريح أبي حصيرة الوهمي .<br />لا نسمع عويلهم و لا نشعر بحبهم الجامد أوي لمصر عندما يتم ضبط شبكات مخدرات و دعارة و تجسس إسرائيلية بل بالعكس هم يسجدون لصنمهم الصهيوني يصبون اللعنات على كل من يدعو لمقاطعة إسرائيل.<br />الخنزير يسبح بحمد (واشنطن) متناسيا دعمها للصهاينة في حرب 1973<br />الخنزير هو الذي يتخذ من إصابة بعض الجنود المصريين (هذا لو صدق) ستارا للتباكي على مصلحة البلد مع أن ما حدث لا فرق بينه و بين ما يحدث أحيانا من اشتباكات بين المصريين و الأمن المركزي (ناسيين قلعة الكبش و أهالي ضحايا العبارة ؟ و لا مش عارفين أخلاق عساكر الأمن المركزي بتوعنا و سبهم الدين و الأم و الأهل ؟)<br />الخنزير هو من يقبل أن يأكل قمامةكل من كان أشقرا ذي عينين زرقاويين و لكنه لا يقبل أن تنزل رحمات السماء على المظلومين !!!<br />الخنزير هو من لا تسمع له حسا حين يقتل اليهود الجنود المصريين على الحدود او تقتحم دباباتهم الحدود المصرية لقتل رب أسرة مصري و إصابة آخرين بينما يصور ما حدث من أهل غزة على أنه غزو لمصر.<br />الخنزير لايضره ان يكون إرهابيا سفاحا كـ \" أفيجدور ليبرمان\" وزيرا في الحكومة الصهيونية و هو الذي يطالب مرارا و تكرارا بضرب السد العالي !!<br />ألا أدلكم لماذا يكرهون حماس ؟<br />إنه الحقد و الغيظ إزاء حماس فعلى الرغم من كل المصاعب و المحن التي تحيط بحماس إلا أنها استطاعت مرمغة أنوف ما يسمى بـ “المجتمع الدولي ” بكل طواغيته و أصنامه في التراب على الرغم من أن مساحة قطاع غزة قد لا تتجاوز مساحة حي المعادي بينما الأنظمة الحاكمة في بلادنا لا تستطيع اتخاذ أي قرار إلا بالعودة إلى أصنام واشنطن . لقد جعلت حماس من الفلسطينيين شعبا فعالا إيجابيا يعتبر الشهادة في سبيل الله شيئا كالطعام و الشراب و الملبس لا يعيشون مجرد أحجارا على رقع الشطرنج .<br />كذبة : مصر حاربت علشان الفلسطينيين !!<br />فلنكن صادقين مع انفسنا و نكف عن تلك النبرة المتعالية كي نقتع أنفسنابالباطل أننا أدينا ما علينا و زيادة !!<br />حرب 1948 : كان ثلث فلسطين تقريبا تابعا لمصر بما فيها قطاع غزة و كان من الغباء عدم مواجهة مشروع استيطاني يهدف إلى بناء دولة من النيل إلى الفرات .<br />حرب 1956 : أمم جمال عبد الناصر قناة السويس و تحالف اليهود مع إنجلترا و فرنسا لغزو مصر.<br />حرب 1967 : اكيد عارفينها ؟؟!<br />حرب 1973 : كانت علشان فلسطين برضه ؟؟<br />على المرتزقة المتسللين إلى الإعلام المصري أن يدركوا أن المقاومة الفلسطينية في غزة هي التي تدافع عن الأمن القومي للقاهرة و لولاها لقطع المشروع الصهيوني خطوات واسعة لا نعلم مداها.<br />لماذا نغفل عن حقيقة واضحة كوضوح الشمس في منتصف نهار اغسطس أن سبب كل هذه المشكلات هم أصحاب مشروع هرتزل الذين ابتلينا بجوارهم منذ ما يزيد عن نصف قرن ؟ و ليس حماس أو أهل غزة الذين نالهم نار العدو و طعن الشقيق .!!"
archived = "2010-03-14"
