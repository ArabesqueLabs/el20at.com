[[comments]]
order = 1
subject = "ومين تطلع كريمان حمزه دي علشان خاطر تفسر القران"
author = "عجيبه والله"
text = "ممكن نعرف مين تطلع كاريمان حمزه دي<br />لما واحد يفسر قران لازم نشوف السيرة الذاتية بتاعته وتاريخه مع العلم والعلماء المفروض كده<br />تطلع مين كريمان حمزه دي<br />وبعدين هو القران ناقص تفسير كريمان حمزه<br />عجيبه والله"
archived = "2008-12-24"
capture_url = "https://web.archive.org/web/20081224111507/http://masr.20at.com:80/newArticle.php?sid=18939"
