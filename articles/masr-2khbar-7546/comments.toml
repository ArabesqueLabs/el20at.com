text = "هوة ده الجهل<br />الأخ اللي عمال يشتم عالفاضي ده .... إنت جاهل<br />يا عم انا لو إتكلمت بعنطزة دي عقوبتها إني أتعذب لحد ما تجيلي عاهة مستديمة<br />وكمان الراجل كان عالم محترم مش مترجم للقوات الأمريكية<br />إتفو علي الجهل اللي عايشين فيه"
