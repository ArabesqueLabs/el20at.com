text = "الاردن ديه اساسان بلد العملاء احنا هنظيط ولا ايه وحياة امى انا لو ماسك ..... لكنت ولعت فى الاردن تانى يوم انتم اتجننتو ولا ايه فقوا انتم بلد وسخة على الصبح شوية زبالة يعملوا فى عالم مصرى كده وبعدين الحواراكبر من ما هو مكتوب بكتير حوار مدارى ميعرفوش االلى الى عمله فى الراجل الغلبان ده والله كان نفسى اكون هناك كنت ولعتلهم فى المطار كله لو على رقبتى"
