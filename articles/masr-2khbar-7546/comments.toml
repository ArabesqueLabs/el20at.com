subject = "عنطزة كدابة"
author = "اى كلام"
posted = "2007-11-08"
text = "الباحث اياة تعامل مع موظف المطار بعجرفة هائلة وخاطبة باحتقار واهانة وازدراء<br />لذا فقد وجب تأديبة وارجاعة الى حجمة الطبيعى<br />فالناس لا يضربون احدا من الباب للطاق<br />لا بد وان يكون صنع شيئا<br />وخصوصا وانة كان يعمل مترجما لقوات غربية فى العراق واشبة بالبلاك ووتر<br />تستاهل يا جبان"
