author = "ياسمين من مصر"
posted = "2010-02-28"
text = "اصبح من يعمل او يدرس مع الرجال حرام<br />بل ومن يوافق على ذلك هو كافر ايضا<br />باي حق يكفرون البشر<br />وباي حق يتهموم بالأرتداد عن الدين<br />وباي حق يمنعون حرية ؟<br />هل الدين اجبار؟<br />هل اصبحت هذة هي الطريقة التي يتم بها التعامل مع الشباب وتحبيبهم في الدين<br />اي اختلاط هذا هو الحرام؟<br />اي فتوة تلك<br />وااسفاه على حال السعوديين وحياتهم<br />الكبت يولد الأنفجار<br />والسعوديين اكتر شعب مع الأسف به احصائيات ضخمة لفعل المعصيات في الخفاء<br />ذلك لزيادة الكبت وحدته<br />هل يظنون انهم بمنع الأختلاط بين النساء والرجال في العمل سيتمكنون من تقليل المشاكل وتقليل الحرام؟؟؟؟<br />اليس ما يفعلوه هو الحرام بعينه<br />اليس اجبار البنات على ارتداء الحجاب واللون الأسود والنقاب قصرا هو الحرام<br />ومعظمهم غير مقتنع بهذا اصلا وحين يسافرون لأي دولة اخرى يقومون بخلعه؟<br />ما فائدة ان نكون مسلمين بالوراثة<br />الا ةيعطوهم فرصة حتى يؤمنون بما يفعلون<br />كل شئ بالأجبار؟<br />عموما<br />اعلن اسفي على حال الفتاوى التي تصدر<br />وتكفير الناس والرغبة في اقامه الحد عليهم واعلان ارتدادهم لمجرد ان تفكيرهم منطقي<br />واقول لكل سعودي وسعودية<br />الله يكون بي عونكم"
