text = "مع احنامى لكل علماء الدين ، من انت حتى تكفر و لا تكفر، الحرام بين و الحلال بين و حتى الكافر لا بحق لك ان تقيم عليه الحد الا فى الكبائر، با سبدى الفاضل امثالك من يكرهوا العالم فى الاسلام ، يا سيدى الجليل حتى ايام الرسول عليه الصلاه و السلام كات الساء تشارك فى مجالس العلم و العمل و لم يكفرهن الرسول و لم يكفر ازواجهن ارجوك اتقى الله فى الاسلام ، نحن دين الوسطيه و العلم و الحضاره و الاخلاق و لسنا دي التكفير و اقامه االحدود على كل من هب و دب"
