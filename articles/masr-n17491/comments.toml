[[comments]]
order = 0
subject = "المشير ابو غزالة قائد المدفعية وبطل كل الحروب بلا منازع وكان قائد ميدانى ناجح ولم يكن خلف المكاتب وقت الحرب"
author = "مقاتل سابق"
text = "مصرى حتى النخاع وليس مصرى مزور عميل من تايوان<br />بطل الطوبجية وطوبجى اول<br />اة لو كان القدر رسمة رئيسا لمصر<br />كانت الدنيا تغيرت<br />رحمة اللة ورحم البطل عاطف السادات الطيار صاحب الضربة الجوية الاولى والتى استشهد بطائرتة على الضفة الشرقية للقناة"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911192023/http://masr.20at.com:80/newArticle.php?sid=17491"

[[comments]]
order = 1
subject = "رحمة الله عليه"
author = "مصطفى الخطيب"
text = "أحبه أناس وشعروا فيه بالوطنية وودوا لو أنه تُرك ليكمل مسيرة استقلال الجيش. رحمة الله عليه"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911192023/http://masr.20at.com:80/newArticle.php?sid=17491"

[[comments]]
order = 2
subject = "بضغط امريكى اسرائيلى اخرجوة من الجيش بحجة تطوير صواريخ وحصولة على خاماتها من امريكا"
author = "واحد"
text = "ثم بعد ان ترك القائد الجيش واحيل الى وظيفة هامشية<br />تم خلخلة الجيش من الرتب اصحاب الخبرة والكفاءة واصبح تسليحة قديم جدا ولا يصلح لاى حرب مستقبلية وتدخلت ايدى خفية فى امور كثيرة<br />رحمة اللة كان اخر قادة الجيش الوطنيين المصريين الشرفاء"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911192023/http://masr.20at.com:80/newArticle.php?sid=17491"

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
text = "كل هذة الا نجازات الغظيمة لرجل عظيم لم يقدر فى بلد لا تقدر الا المطربين والرقصين فى جنات النعيم اية البطل العظيم فانت كنت رمز من رموز الوطنية كل هذا الا نجاز فماذا فعلوا هولاء المرتزقة مثل هذا البطل فعلا تاريخ مشرف اما حسنى فتاريخ غير مشرف"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911192023/http://masr.20at.com:80/newArticle.php?sid=17491"

[[comments]]
order = 4
subject = "لو كان ابو غزاله هو اللي مسك الحكم"
author = "مش شريف الدواخلي ولا البراء اشرف ولا عبدالله الطحاوي"
text = "لو كان ابو غزاله هو اللي مسك الحكم وكان حسني مبارك هو اللي كان في الضل<br />كنا حنقول يا خسارة يا ليت حسني مبارك هو اللي مسك الحكم<br />دا راجل محنك<br />دا راجل خبير<br />دا قائد الضربة الجوية الاولى<br />دا ودا ودا<br />ابو عزاله مين يا ابني انت وهو<br />ابو غزاله زي ابو فصاده زي جمال عبدالناصر زي السادات زي حسني مبارك زي لجنة السياسات زي جمال مبارك زي الملك فاروق<br />اول ما يعد على الكرسي بيحصلهم حاجات غريبة وعجيبة"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911192023/http://masr.20at.com:80/newArticle.php?sid=17491"

[[comments]]
order = 5
subject = "ابو غزاله ما جربش ضمة (الكرسي)"
author = "مش رضوى حسن ولا مروى صلاح ولا دعاء الشامي"
text = "فيه حاجه اسمها ضمة القبر اول ما الواحد ينزل الطربه فيه حاجه اسمها ضمة القبر ودي تسألوا عليها علماء الدين<br />كذلك فيه حاجه اسمها ضمة (الكرسي) كرسي الحكم<br />اول ما الضابط يجلس على الكرسي ويلاقي نفسه فوق وكل الناس تحت جزمته بتحصله حاجات غريبة<br />فابو غزاله ما تحكموش عليه لانه ما جربش ضمة الكرسي<br />ربنا بيحبه والله<br />هو طبعبا الان قابل ربنا سبحانه وتعالى وعرف ان الله سبحانه وتعالى عافاه عن هذه المصيبة<br />وزمانه بيقول الحمد لله اللي جت في حسني ما جتش فيه"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911192023/http://masr.20at.com:80/newArticle.php?sid=17491"

[[comments]]
order = 6
subject = "3 الاف مدفع ثقيل تقذف الضفة الغربية وتعمل غطاء من النيران لعبور القوات - مدافع البطل ابو غزالة"
author = "واحد"
text = "مدافع البطل ابو غزالة وسلاح المدفعية كانت من اول لحظة فى الحرب لغاية اخر لحظة بتضرب وبتحارب وكان زى الاسد فوق المعابر بيحرك مدفعيتة الى الشرق<br />وكان معة البطل حامى اجواء وسماء مصر البطل قائد حائط الصواريخ سام 2 وسام 3 وسام 6 الذى شل اليد الطولى لاسرائيل واسقط طائراتها بكثافة البطل اللواء محمد على فهمى حامى سماء مصر<br />بعد الطلعة الاولى للطيران واستشهاد البطل عاطف السادات لم يسمع احد عنة<br />كان فين صاحبك لما حصلت الثغرة وتم حصار الجيش التالت<br />البطل بطل<br />بطل المدرعات معروف<br />وبطل المدفعية معروف<br />وبطل حامى السماء المصرية معروف بصواريخة<br />مصر ولادة<br />بيقع راجل بيطلع الف راجل<br />ولكن زمن الانكسار - موجع<br />مؤلم على نفسية الرجال<br />البطل الجمسى عيط بدموعة قدام السادات لما كيسنجر طلب عبور الدبابات مرة اخرى الى غرب القناة وقال للسادات او لكسينجر محدش يعرف قد اية مجهود اتبذل علشان الدبابات تعدى القناة<br />والبركة فى العيال الصغار ولدنا اللى هيزرعوا الامل فى صحراء الفساد والانحطاط<br />ابتسم انت فى عصر سوزان تميم مالكم ومال المقاتلين الابطال"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911192023/http://masr.20at.com:80/newArticle.php?sid=17491"

[[comments]]
order = 7
subject = "كنت حروح في ستين داهية"
author = "ابو غزاله من الاخرة"
text = "طبعا انتو فاكرين الصورة المشهورة بتاعة العرض العسكري لما كان السادات في الوسط وانا على اليمين وحسني مبارك على الشمال ولابسين احنا التلاته الملابس العسكرية<br />فاكرنا<br />لما السادات انضرب كنت انا القائد العام للقوات المسلحة وكان حسني مبارك لا قيمة له في الجيش مجرد نائب رئيس جمهورية وما لوش اي حاجه في الجيش<br />وكان الامر بيدي ولما صوفي ابو طالب اصبح رئيس جمهورية قانونا بعد مقتل السادات اول قرار اعلنه ان حسني مبارك يبقى القائد الاعلى للقوات المسلحة<br />انا كنت اقدر الغي القرار دا واضربهم هما الاثنين بالجزمة القديمة<br />ولكن ما اعرفش ايه اللي سكتني نزل عليها سهم الله ووافقت وعملنا انتخابات سريعة لحسني مبارك واصبح رئيس الجمهورية والقائم الاعلى للقوات المسلحة<br />والحمد لله بعد فترة عزلوني عن المنصب بقرار امريكي فاكرين لما حسني مبارك رجع من امريكا وعزلنا والحمد لله<br />لما نزلت القبر وجالي الملكين يسالوني سؤال القبر<br />اول ما شفتهم تذكرت موت السادات وتذكرت ان الرئاسة كانت في جيبي بصفتي القائم العام للقوات المسلحة<br />وقلت الحمد لله ان ربنا سبحانه وتعالى لم يرد لي ذلك<br />فظلم 80 مليون مصري مش هينة عند الحساب"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911192023/http://masr.20at.com:80/newArticle.php?sid=17491"
