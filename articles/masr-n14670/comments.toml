[[comments]]
order = 0
subject = "الناس خيبتها السبت والاح واحنا خيبتنا ماوردتش على"
author = "شمهورش الدبلوماسى"
posted = "2008-03-13"
text = "انا كنت فاكر ان سعادة الدبلوماسى بتاعنا هيعرض عليهم انتاجنا المتقدم من الكاميرات الرقمية والشاشات العملاقة الليزرية واجهزة الكمبيوتر الدفترية انتاج كفر البطيخ وفرشوط وقويسنا البلد - هى دى ثقافة الشعوب دلوقتى<br />انما رايح يوريهم الزار والكودية وشمهورش الجبار<br />دا تخلف عقلى<br />وبيقول لهم ان مفيش امل فينا ولا بعد 7 الاف سنة حضارة كمان<br />وسلم لى على البدنجان"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003226/http://masr.20at.com:80/newArticle.php?sid=14670"

[[comments]]
order = 1
subject = "حكاية النووى ولخبطة الزهايمر وتخريفات تقدم العمر"
author = "مش فاهم"
posted = "2008-03-14"
text = "من كام شهر طلع علينا بتاع الزهايمر بتصريح مرعب انة هيعمل نووى كدة من غير احم ولا دستور<br />وصفق بتوع الحزب اياة لة طويلا طويلا - الراجل هيعمل نووى يا نووى يا حاج نووى وبنحقق البرنامج الانتخابى لسيادتة اللى وعد ببناء مش عارف كام مليون شقة ووعد الشباب بكام مليون وظيفة - كدة - الكلام ببلاش<br />واليوم<br />السيد رئيس الوزراء - ووزير التكافل الاجتاعى - والسادة المحافظين - والسادة وزراء الدفاع والداخلية والكل كليلة مسخرين لتوفير رغيف الخبز للطوابير الطويلة اللى صورها بتنشر فى تلفزيونات العالم وجرايد العالم وفضايح العالم<br />وفى تقرير لمنظمة عالمية ضمت مصر ضمن الدول الجائعة جنوب الصحراء<br />حاجة تكسف<br />واصبحنا على حسب الترتيب من اكبر الدول الفاشلة فى تقارير الامم المتحدة<br />واية - عايز يعمل نووى<br />المثل القديم بتاع جدتى<br />مش لاقيين العيش ياكلوة وجايبيين عبد يلطشوة<br />انكسفوا<br />يا حكومة فاشلة"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003226/http://masr.20at.com:80/newArticle.php?sid=14670"

[[comments]]
order = 2
subject = "سيادة اللواء المصيلحى - البلد وتموين البلد مش معسك"
author = "اوف"
posted = "2008-03-15"
text = "السيد اللواء المصيلحى - خريج الفنية العسكرية وحاصل على دكتوراة فى العلوم العسكرية - على راس ابويا من فوق<br />انما يبقى مسئول عن تموين 70 مليون انسان ومسئول عن رغيف الخبز فدى غير مبلوعة<br />ولان سيادتة راجل عسكرى وبيحب الطوابير وبالذات طابور الصباح وتحية العلم<br />فبسياستة الحكيمة جدا وقف الشعب المصرى كلة فى الطوابير من الصباح الى المساء ليحصلوا على رغيف الخبز<br />لكن بقى تحية العلم<br />وناقص انك تخللى ضابط امن مركزى يقف جنب كل طابور ويهتف - تعيش جمهورية مصر الملكية"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003226/http://masr.20at.com:80/newArticle.php?sid=14670"
