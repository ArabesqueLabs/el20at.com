subject = "الصورة بتقول"
author = "ميدو"
posted = "2008-01-24"
text = "الصورة بتقول ان دى مش جامعة القاهرة اللى تعلمنا فيها ولم نرى اى عسكرى طوال فترة الجامعة داخلها<br />الصورة بتقول ان دة معسكر جيش فى هاكستب<br />وعايزين التعليم يتطور وينهض والطالب والدكتور وهو داخل من الباب يشوف وجوة العسكريين الكئيبة بتوع التخلف العقلى ويعرف يفكر او يعرف يعمل ابحاث<br />انا اقترح انهم يعينوا مدير جامعة واحد عميد او شرطة امن مركزى ويسموها جامعة استقبال وتدريب واصلاح المستجدين<br />تعليم ال وجامعة ال وحرية راى ال"
