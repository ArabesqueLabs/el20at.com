subject = "بصو في الصورة كويس"
posted = "2008-01-24"
text = "والله يا اخي من انقلاب 23 يوليو وبعدين جه حكم العسكر جمال وانور وحسني<br />واحنا ربنا كارمنا بعساكر بلدنا قاعدين معانا في الشوارع على طول<br />مستأنسين بيهم<br />ودي من فوايد الثورة انهم جابوا الجيش من على الجبهة وسابوا الجبهة فاضيه وحطوه معانا في الشوارع"
