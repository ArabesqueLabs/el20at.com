[[comments]]
order = 4
subject = "الصورة قالت"
author = "yug"
posted = "2008-01-24"
text = "الصورة بتقول ان عندنا عساكر كتير قوى زى الرز - ومكانهم الجامعات لتخريبها وتحويلها الى معسكرات حدود<br />واننا بنصرف كل فلوس البلد علشان نمنع مظاهرة<br />يا اخى الغبى واية يعنى لما يعملوا مظاهرة ويزعقوا شوية ويشتموا شوية ويروحوا<br />لازم نجيب سيادة العميد وسيادة العقيد والاف العساكر علشان شوية طلبة هتعمل مظاهرة<br />الحكم ضعيف والكرسى مهزوز للدرجة دى<br />نظام الحكم هيسقط بمساطر واساتيك واقلام شوية تلامذة<br />يا حكومة هايفة - انكسفى على دمك بقى"
archived = "2010-03-14"
