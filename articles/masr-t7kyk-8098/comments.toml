subject = "شكرا"
author = "abofady"
posted = "2008-01-24"
text = "اهل غزه وفلسطين في غنى عن خدماتكم<br />انا مواطن مصرى ، الاخ الفلسطينى الذى يبدو انه صاحب التعليق الغريب اقوله طب خلى بالك من نفسك ومتعيطوش امام شاشات التليفزيون طالبين العون من الدول العربية ، جتكم نيلة فى ردودكم وقلة ادبكم"
