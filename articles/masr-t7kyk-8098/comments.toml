[[comments]]
order = 1
subject = "اهل عزه  وفلسطين في غنى عن خدماتكم"
posted = "2008-01-24"
text = "اهل غزه وفلسطين في غنى عن خدماتكم<br />انتو شوفوا نفسكم وشوفوا الخيبة اللي انتم فيها<br />لما موسى قال لليهود<br />ادخلوا الارض المقدمة التي كتب الله لكم<br />ردوا عليه وقالوا ايه<br />ان فيها قوما جبارين<br />فالاخوة الفلسطينيين بيعتبروا نفسهم قوما جبارين وهما جبارين فعلا<br />فالاخوة في فلسطين مستغنيين عن خدماتكم"
archived = "2010-03-14"
capture_url = ""

