[[comments]]
order = 0
subject = "مسرحية اية دى حقيقة"
author = "احمد السلامونى"
text = "يا ست هويدا اللة يسترها معاكى الحكاية دى فى التاريخ<br />القاضى هو شيخ الاسلام عز بن عبد السلام والحاكم هو الملك قطز ومملوكة بيبرس<br />والقاضى قال لما الحاكم كان عايز يدفع الناس ضرايب نبيع المماليك الاول وعرض المماليك للبيع فعلا<br />دا لما كان فية العز بن عبد السلام<br />انما شيخ الاسلام دلوقتى طنطاوى<br />عايزة الطنطاوى يبيع الحاكم ويعرضة للبيع او يدعوا الناس للخروج علية<br />الطنطاوى<br />يا اختى احة"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064832/http://masr.20at.com:80/newArticle.php?sid=12205"
