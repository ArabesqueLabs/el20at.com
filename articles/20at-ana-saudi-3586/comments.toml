subject = "هذا هو الرأي العاقل المنصف!"
author = "مسلم"
posted = "2007-04-14"
text = "\"\"\"ورفض العبيكان– في حديثه لصحيفة \"عكاظ\" المنع لكنه طالب بوضع ضوابط لها وان لا يسمح بممارستها إلا للمتخصصين مع وجود الإشراف، \"\"\"<br />ما تتحجج به وزارة الصحة السعودية في منع الحجامة أمر واه للغاية!<br />فحتى المستشفيات والعيادات المرخصة يحدث فيها ممارسات خاطئة ويحدث فيها نقل للأمراض! فهل هذا مسوغ لإغلاقها؟؟؟<br />العقل...والاعتزاز بالشرع...يدعونا لوضع ضوابط لممارسة هذا النوع من التداوي الذي زكته وأوصت به السنة النبوية المطهرة.<br />نعوذ بالله من الخذلان!"
