[[comments]]
order = 2
subject = "معقول يا وزير الصحه ؟؟؟فاتك الصواب!!!!!!"
author = "زهره بريه"
posted = "2007-06-28"
text = "سبحان الله ان تصدر السعوديه بالذات امرا بمنع الحجامه ونحن ننظر الي السعوديه انها قلعه المسلمين وكنا نأخذ اي كلام ونصدق عليه ونحن مغمضين العينين وانها قلعه الاسلام والمسلمين..... لكن بعد هذا القرار الغريب احدث انقلاب كبير فيما كنا نعتقده من انها حاميه الاسلام اصبح الموضوع فيه اعاده نظر.... خاصه وان الحجامه ليس فقط طب نبوي بل هو الطب الوحيد الذي نزل من السماء انزله الله مع سيدنا جبريل عندما اشتكي رسولنا الكريم عليه افضل الصلاه واذكي السلام فكيف يفوتك هذا وزير الصحه وان الرسول اوصي بها امه الاسلام كيف لك ان تمنعها وانت مسلم ا لا تقر بالسنه النبويه ؟؟؟؟؟؟؟؟<br />وكان الاجدر بك بدل ان تضع محاذير وقرار بمنع الحجامه وانت طيب في الاصل كان الادعي الا يفوتك ان تضع ضوابط في استعمال الادراوت ونشر الوعي الصحي بين الحجامين ووضع ضوابط وشروط يلتزمونها في مراكزهم كما نفعل نحن هنا في بلدنا وذلك بان يكون لكل فرد ادواته الخاصه به من كاسات ومشرط ومواد معقمه وبلاستر طبي وقطن وامواس وان الموس لا يستعمل الا مره واحده حتي لو كان لنفس المريض مره اخري وهو زهيد الثمن ا لي اخر شروط الامن والسلامه وانت طبيب وتعرف شروط الامن الصحيه.... لكن ان يكون المنع باتا وان تخوف الناس من سنه نبويه وانت مسلم...؟؟؟ كيف؟؟؟<br />وعلاج سماوي خلقه الله تعالي من فوق سبع سموات فهذا هو الامر الغريب!!!!.... نحن نعلم تماما ان وراء محاربه الحجامه وطب الاعشاب .... مافيا شركات الادويه العربيه والعالميه لان هذا يهدد مكاسبها الخياليه والارقام الفلكيه التي تدخل جيوب اصحاب هذه الشركات ولا يخفي علي علم اي انسان بسيط هذه النقطه...... رجاء وانت الطيب المسلم الا تحرم بسطاء الناس من سنه نبيهم وتساعد الشركات ومافيا الادويه علي المتاجره بصحه الناس وقد خلق الله الدواء الناحج وليس من حق البشر مخالفه ما جاء من عند الله ومن سنه نبيه .... هدانا الله جميعا لنصره الاسلام ونشر سنه نبيه عليه الصلاه والسلام."
archived = "2010-03-14"
