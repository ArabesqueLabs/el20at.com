text = "لعلي بصعوبة فهمت التلميح الذي يرمي إليه العنوان.. لكن من فضلكم، إذا كنتم تريدون مخاطبة( العالم العربي) حقاً، فباللسان العربي، , وبخاصة تلك العناوين الجانبية..ساعدوا الشباب على احترام اللغة والفخر بها، والالتفاف حول علمها، إنه العلم الوحيد المستحق للاحترام من أعلام العرب..كرمى للقرآن الكريم.. وتشرفاً به.. الله يرضى عليكم."
