text = "انا مش فاهم فين مراقبة التعليقات في عشرينات<br />ابلغت عن عشرات التعليقات من امثال التعليق القذر بالاعلي ....... ولا مستجيب<br />انا مش فاهم هما الناس في عشرينات بتتعامل مع الموقع علي اساس انه شغلانه بعد الظهر والسلام بيتسلوا فيها شويه<br />ازالة التعليق القذر بالاعلي لن تستغرق دقيقة من الوقت<br />اين المسئول عن هذا الموقع ؟؟؟<br />ستفقدون احترامكم اذا استمر الوضع بهذا السوء<br />لماذا لا تدخلون خدمة مراقبة التعليقات من اجل امثال الحيوان الذي بالاعلي<br />ارجوكم اهتموا بالموضوع فسوف تتحملون وزر هذه الكلمات النابية والقذرة الموحجوده علي صفحات الموقع"
