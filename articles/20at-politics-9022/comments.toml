[[comments]]
order = 3
subject = "arab sionist and arabiya the bad of the bad"
author = "jamal"
posted = "2008-05-09"
text = "\"اللي استحوا ماتوا\".. تختصر هذه العبارة حال \"المخبرين\" و\" العملاء\" هذه الايام في لبنان.. في العادة يعمل العميل أو المخبر لمصلحة العدو في الخفاء، ويحاول التستر كي لا ينكشف سره، ويصنع لنفسه \"ستاراً\" من الشرف والعفة \"والقومية العربية\"، ومحبة الوطن.. أما في لبنان، فشبكة العملاء تعمل على المكشوف، نهاراً وليلاً لكشف شبكة اتصالات المقاومة.. ويريدون أن لا يرد أحد عليهم.. أحدهم لم يترك دواء في مستودعات وزارة الصحة الا وباعه ووضع ثمنه في جيبه يوم كان \"طبيباً يداوي الناس وهو عليل\".. ولاحقاً سخّر خطوط الاتصالات لصالح شركة \"نجله\" الذي \"من شابه أباه فما ظلم\" .. فمنع خطوط الانترنت عن شركات عدة حتى يتسنى لوليده مشاركة كل الشركات في الارباح.. واحتكر اعلانات دليل الهاتف لصالح \"رفيق \" له في الحزب \"التاريخي\" والا فلا دليل.. وبعد كل هذا يقف ليقول ان شبكة اتصالات المقاومة هي تعدٍّ على الدولة.. أصلاً هل ترك هو وفريقه دولة ليتم التعدي عليها.. شبكة اتصالات أقر \"فينوغراد\" انها كانت العمود الفقري لانتصار المقاومة.. باتت اليوم \"ملك الدولة اللبنانية\"، عجيب وهل قاومت الدولة اللبنانية متمثلة بفريق \"سراي\" السنيورة.. العدوان الاسرائيلي في العام 2006.. أما شكرت \"الدكتور رايس\" على صبرها علينا.. وسلمت ثكنة مرجعيون للعدو، وتواطأت على قتل وجرح من كان في قافلة \"الهروب الكبير\" من الثكنة.. كي لا يبقى دليل.. ألم تكن هذه \"الدولة\" تقدم الاحداثيات للعدو بعد كل اجتماع مع فريق المقاومة ليزيد من حدة قصف الضاحية.. بناية بناية.. او الاستسلام.. المشكلة أن \"دولة الوليد\" في معمل ترابة سبلين لم تستنفع على ظهر المقاومة وبيوت اهلها.. فلا بد من سمسرة ما.. هل تعرفون ان ما يوجد في مستودعات جهاد البناء على طريق الاوزاعي القديمة هو \"رخام ـ روز\" مخصص لصالونات بيوت الفقراء التي دمرها العدو.. هل تعرفون ان ما يوجد في مستودعات جهاد البناء على طريق الاوزاعي القديمة هو \"بياضات حمامات ومطابخ\" لبيوت الفقراء التي دمرها العدو الصهيوني بعد \"إخباريات\" فريق السلطة بكل فروعه.. هل تعرفون ان ما يوجد في مستودعات جهاد البناء على طريق الاوزاعي القديمة هو ما وعد \"سيد النصر\" أشرف وأطهر واكرم وأنبل وأعظم شعب به ليكون خميرة بيوتهم التي يعاد اعمارها.. نظرة واحدة الى ما وجد في مستودعات ميليشيا تيار المستقبل في \"واحد\" من مكاتبه، ومع انه لا مجالا للمقارنة .. تكفي لنعرف هوية هؤلاء.. بين شبكة امان وإعمار .. وشبكة سلاح وخمور وإتجار.. بالهلوسة شعب لبنان العظيم.. يعرفكم واحداً واحداً.. ويوم الحساب سيأتي مهما طال الصمت.."
