[[comments]]
order = 4
subject = "للأسف"
author = "محمد محمد"
posted = "2008-05-10"
text = "للأسف الشديد أن اقطاعية مثل لبنان الحزين تضم كل هذه التناقضات بينها وتضم كل عملاء الدنيا فكلا الطرفين المتنازعين عميل ولا تجد مبرررا واحدا أن تنصر هذا أو ذاك فكلاهما عميل<br />بلد بهذا الحجم الصغير يعيش بلا رأس أو رئيس وكثرت فيه رؤس الأفاعي فكلهم غير حريص على الوطن الذي يعيش فيه جسده على أرضه وروحه هنا أو هناك وعقله محرك بالرموت<br />لا نصركم الله جميعا يا فرقاء لبنان ياعملاء الشرق والغرب على السواء<br />اللهم اسبدلهم جميعا بقوم خيرا منهم تحبهم ويحبونك ويقاتلون في سبيلك وحدك لنصرة دينك الله آمين"
archived = "2010-03-14"
