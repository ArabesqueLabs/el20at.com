subject = "ربنا يخدهم"
author = "منى محمد"
posted = "2007-01-31"
text = "والله مهما عملوا ربنا قادر يخسف بيهم الارض وان شاء الله عن قريب<br />لانهم بدل بيغضبوا الله وبيفتروا فى الارض وبيظلموا هتبقى نهايتهم قريبة وكل ظالم على وجه الارض يا رب يتاخده<br />بس مش المهم انهم يتخدوا ولا لا المهم ازاى احنا نبقى احسن منهم ونقدر نغلبهم وننتصر عليهم واقصد باحنا كل المسلمين مش العرب بس لانى بصراحة مش مقتنعة بان الدول العربية انهم بتجمعهم العروبة فخلاص يبقى يجمعنا الاسلام ومفيش احسن من الاسلام موحد خلاص يلا نبدا مع نفسنا ونحاول تانى وتالت ورابع حتى لو كانت الحكومة معارضة مش مشكلة يعنى المعتقلات قدها انشاء الله امن مركزى مش مشكلة ضرب وشتينة واهانة اه يعنى لازم نستحمل مش احنا حاملين رسالة وعايزين ننفذها والدعاء اهم حاجة"
archived = "2010-03-14"
