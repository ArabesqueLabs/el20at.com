author = "احمد الهادى"
posted = "2009-11-11"
text = "ااذا كان الموضوع حق حصرى لجريده اشروق فلماذا لم يعقب فاروق جويده نفسه بان القصيده مكتوبه خصيصا للشروق ولماذا لم تقاضى الشروق فارق جويده نفسوا العقد شريعه المتعاقدين فمن حق الشروق اذا كان لها حق فا مع فاروق جويده ليس مع المصرى اليوم ولو كان فعلا سيقوم فاروق جويده بدورة بمقاضاه المصرى اليوم ومقاضاه برنامج العاشره مساء اما المصرى اليوم فهى كتبت نقلا عن برنامج العاشره مساء للشاعر فاروق جويده اذا سقط عليها الحق ولكن الموضوع مفتعل لتثبت الشروق انها صاحبه حصريات ولتبين للناس من هى اشروق عذرا فقليل منا من يعرفها مقارنة بالمصرى اليوم احمد الهادى روائى مصرى"
