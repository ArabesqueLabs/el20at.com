posted = "2009-11-11"
text = "قرات القصيدة<br />كلام منظم فى شعر بينتقد الوضع الحالى ولا جديد او فكرة او حاجة يمكن اعتبارها ملكية فكرية<br />هو نتيجة شهرة الشاعر فاروق جويدة فالجرايد بتتسابق على اى موضوع تملىء بة ورق فاضى وتسد خانة انما الموضوع مش سبق صحفى ولا حاجة<br />وفية قصائد للشاعر الشعبى احمد نجم اكثر جراءة فى انتقاد الحاكم وشتمة اكتر من فاروق جويدة"
