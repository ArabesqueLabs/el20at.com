[[comments]]
order = 8
subject = ""
author = "ماجد"
posted = "2009-10-31"
text = "شهدت الساعات الأولى من اليوم السبت الموافق 31 أكتوبر 2009، آخر سطور رحلة الفيلسوف الكبير والعالم الفذ الدكتور مصطفى محمود، الذي رحل عن عالمنا عن عمر يناهز الثامنة والثمانين.<br />رحل الدكتور مصطفى محمود بعد صراع طويل مع المرض، منذ إصابته بجلطة بالمخ عام 2003، اشتد عليه في الشهور الأخيرة،<br />كان الدكتور مصطفى محمود واحد من العلماء القلائل الذين يمكن أن نصفهم بالموسوعيين، حيث لم يقف تخصصه في الطب، أمام دراساته في علوم الفلك، أو البحث في علوم الذرة والطبيعة، أو كتاباته الدينية والفلسفية والاجتماعية والسياسية، إضافة إلى إبداعاته في الحكايات والمسرحيات وقصص الرحلات.<br />اشتهر ببرنامجه \"العلم والإيمان\"، الذي قدم منه 400 حلقة، وقدم فيه النظريات العلمية المعقدة إلى المشاهد العادي بأسلوب تميز بالبساطة والرشاقة والقدرة على تقريب الأفكار، وهو البرنامج الذي أذاعه التليفزيون المصري، وبثته العديد من القنوات العربية، وحظي بنجاح غير مسبوق من جميع فئات المشاهدين.<br />يتبع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = ""
author = "ماجد"
posted = "2009-10-31"
text = "عن حياته:<br />ولد الدكتور مصطفى كمال محمود حسين آل محفوظ، عام 1921، بشبين الكوم بمحافظة المنوفية، وكان توأما لأخ توفي في نفس العام، توفي والده بعد سنوات من إصابته بالشلل، درس الطب وتخرج عام 1953، ولكنه تفرغ للكتابة والبحث منذ عام 1960، تزوج مرتين عام 1961 وعام 1983، وانتهى الزواج بالطلاق في المرتين، ورزق بابنيه \"أمل\" و\"أدهم\" من زوجته الأولى.<br />واجه مشاكل في مراحله الدراسية الأولية، رغم بدايته المتفوقة بالدراسة، لدرجة انقطاعه عن الدراسة لمدة ثلاث سنوات، عاد بعدها لمتابعة الدراسة.<br />وفي منزل والده أنشأ معملاً صغيرًا يصنع فيه الصابون والمبيدات الحشرية ليقتل بها الحشرات، ثم يقوم بتشريحها، وحين التحق بكلية الطب اشتُهر بـ\"المشرحجي\"، لوقوفه طول اليوم أمام أجساد الموتى، طارحًا التساؤلات حول سر الحياة والموت وما بعدهما. أنشأ عام 1979 مسجده في القاهرة المعروف بمسجد مصطفى محمود، ويتبع له مستشفى خيري كبير، تهتم بعلاج محدودي الدخل، كما يضم أربعة مراصد فلكية، ومتحفا جيولوجيا، يضم مجموعة من الصخور الجرانيتية، والفراشات المحنطة بأشكالها المتنوعة وبعض الكائنات البحرية، يشرف عليه أساتذة متخصصون."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = ""
author = "ماجد"
posted = "2009-10-31"
text = "من أهم مؤلفاته: \"أينشتين والنسبية\"، ومسرحية \"جهنم الصغرى\"، و\"مغامرة في الصحراء\"، و\"لغز الموت\"، و\"من أمريكا إلى الشاطئ الآخر\"، و\"الخروج من التابوت\"، و\"الشيطان يحكم\"، و\"السر الأعظم\"، و\"العنكبوت\" و\"الإسلام ما هو\"، و\"الإسلام السياسي والمعركة القادمة\"، و\"القرآن محاولة لفهم عصري\"، و\"القرآن كائن حي\"، و\"حوار مع صديقي الملحد\"، و\"رأيت الله\"، و\"رحلتي من الشك إلى الإيمان\"ن و\"سواح في دنيا الله\"، و\"عصر القرود\"، بالإضافة إلى مجموعة من المقالات الصحفية التي أثارت جدلا واسعا عبر الصحف ووسائل الإعلام."
archived = "2010-03-14"
