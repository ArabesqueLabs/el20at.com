text = "ممكن اعرف ايه الخبر الغريب دة مش حرام ان كل علاقة العالم الجليل مصطفى محمود والفيلسوف الموسوعى واحد اكبر مالفكرين ان يقاال عنه بس رئيس جمعية مصطفى محمود الخيريه بجد عيب اوى الكتابة بالشكل دة عن الراجل دة ارجو من كل الناس تشوف الخبر دة اصل د. مصطفى محمود مكنش بياع بليله طيب اكسبو ثواب فى الشباب الصغير وعرفوه مين مصطفى محمود"
