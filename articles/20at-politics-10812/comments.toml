[[comments]]
order = 3
subject = "الدوحة قطر"
author = "مروى العشرى"
posted = "2009-01-09"
text = "ما يحدث هو اختبار حقيقى للاسلام والمسلمين و لو ان هناك اسلاما لوجدنا حلولا فعالة على الارض بدلا من القاء كل بلد باللوم على الاخرى. من هذه الحلول ان نعلن فتح باب الجهاد بكل بلاد الاسلام لكل شبابنا و رجالنا الاحرار و هم كثر باذن الله و كذلك نعلن الجهاد بالمال لمن لا يملك الجهاد بالنفس (مثل الشيوخ والنساء) والمال هو لتسليح شعبنا المقاوم داخل فلسطين أعنى ان يصلهم هذا السلاح لمواجهة الة احرب اليهودية . لا تيأسوا من روح الله فان النصر والله ات باذن الله ووعد الله حق"
archived = "2010-03-14"
capture_url = ""

