[[comments]]
order = 1
subject = "لاتسألوا عما ماتت ضمائرهم"
author = "عاطف محمود"
posted = "2009-01-08"
text = "الحكام العرب ماتت ضمائرهم وتحجرت قلوبهم ولاحول ولاقوه الابالله العلى العظيم<br />ولكن يوما لك ويوما عليك قبل الغدكان العراق والغد لبنان واليوم غزه ولكن غدا الله اعلم سوف<br />يكون فى مكان اخروهذا هوحال الشعوب المغلوبه على امرها خلقت لتكون هى الضحيه سيان بالعدوان اوبغيرالعدوان<br />حسبى الله ونعم الوكيل فى حكومة امريكاالمنتهيه ولايتها والحكومه الاسرائيليه وكل من تعامل معهم ايا كانت جنسيته وديانته"
archived = "2010-03-14"
capture_url = ""

