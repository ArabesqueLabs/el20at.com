[[comments]]
order = 5
subject = "تبسة الجزائر"
author = "ياسين الجزائر"
posted = "2009-01-12"
text = "الله أكبر عدد خلقه و سبحان الله ولا إله إلا الله و الله أكبر<br />أبواب جنان الرحمان مفتوحة في غزة الآن هلمو يا شعوب العالم واعتلوا إلى درجات الرسل و الأنبياء<br />ولا تحسبن الذين قتلوا في سبيل الله أموات بل أحياء عند ربهم يرزقون*<br />جاهدوا في سبيل الله والله لا يضيع أجر المجاهدين<br />من أحب الله بجهاده أحبه الله و جعله في جنانه<br />الله أكبر - الله أكبر - الله أكبر"
archived = "2010-03-14"
capture_url = ""

