subject = "هر شعار قبل حرب اكتوبر : يا خوفى لبعد النصر ترجع سينا وتضيع مصر"
text = "فى اثناء مباحثات كامب ديفيد وقبل التوقيع قدم اربعة وزراء خارجية قد عينوا بالتتابع قدموا استقالتهم للسادات رفضا للتوقيع على الاتفاقية منهم الوزير محمد ابراهيم الذى قدم استقالتة فى كامب ديفيد وعاد الى مصر - ليختار بعدها السادات وزير دولة اسمة بطرس غالى يوقع معة على الاتفاقية - كافئتة امريكا واسرائيل بعد ذلك باختيارة سكرتيرا عاما للامم المتحدة ولميولة الصهيونية حيث ان زوجتة يهودية<br />كان من الممكن استبدال اتفاقية كامب ديفيد بااتفاقية هدنة مع اسرائيل مثل ما فعل الملك فاروق عندما وقع هدنة رودوس مع اسرائيل<br />ولكن التسليم لاسرائيل والاستسلام المنبطح كما شاهدنا تبعيتة فى تصدير الغاز ونزع سلاح سيناء وجعلها مفرغة من القوات وتدمير الاقتصاد باوامر من امريكا التى سلمناها رقابنا وقال السادات ان 99 % من اوراق اللعبة مع امريكا<br />هل كان الموضوع كما قال حسين الشافعى جاسوس نائم او خلية نائمة<br />البعض يقول ان اتفاقية كامب ديفيد ابعدتنا عن الحروب<br />وهل سوريا حاربت رغم انها لم توقع اى اتفاقية<br />اما ان للدولة ان تفرج عن الاسرار حتى نعرف اين نحن واى اى حد وصلنا<br />فى الوضع الحالى<br />كامب ديفيد قيدت مصر وشلت حركتها ودمرت ارادتها<br />ولا زالت السفارة فى العمارة غرب النيل وليس شرقة لان حدود اسرائيل من الفرات شمال حتى شرق النيل جنوبا - من النيل الى الفرات - ولا يمكن ان تقيم اسرائيل سفارة لها فى شرق النيل تؤمن انها ارضها التوراتية - فهل تقيم اسرائيل سفارتها فى مصر على ارض توراتية ؟<br />اللة يرحم الاموات جميعا ويرحم السادات"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327224145/http://masr.20at.com:80/newArticle.php?sid=20422"

[[comments]]
order = 1
subject = "قرأت كتاب كتبة محمد انور السادات يمجد ولى نعمتة وينافقة بطريقة فجة الكتاب اسمة يا ولدى هذا هو عمك جمال"
text = "الكتاب كما يزعم السادات يرتقى بعبد الناصر الى مراتب الالهة والنبيين<br />وقرأت كتاب محمد حسنين هيكل خريف الغضب بعد مقتل السادات - فما هى مؤهلات السادات ليحكم مصر<br />- انهيت خدماتة من الجيش بسبب قضية تجسس ضد الانجليز لصالح الالمان<br />- اشتغل مساعد سواق لورى ( تباع ) او عتال ليرتزق وياكل عيش<br />- عاد الى الخدمة فى الجيش واشتغل فى الحرس الحديدى لحماية الملك فاروق<br />- جندة عبد الناصر فى تنظيم الضباط الاحرار ليعرف منة اخبار القصر الملكى<br />هذا واحد من رجال الثورة اللى ودوا البلد فى ستين داهية<br />الملك كان عيبة اية ؟<br />كان فية 100 اقطاعى - دلوقتى فية عشر الاف اقطاعى<br />كان فية 100 راسمالى مستغل - دلوقتى فية نصف مليون راسمالى محتكر وفاسد<br />ايام الملك كان فية انتخابات واحزاب ودلوقتى تزوير وحكم امنى بوليسى<br />ماذا صنعت الثورة بمصر ؟<br />انزل الشارع وشوف"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327224145/http://masr.20at.com:80/newArticle.php?sid=20422"
