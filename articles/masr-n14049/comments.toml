subject = "ضع عنوان التعليق"
author = "هو انا برضة بغباءة"
text = "معرض كتاب ؟ لمين ؟ ونقرأ اية ولية<br />يا حكومة مصر الرشيدة اعملوا لنا معرض للخبز - انواع الخبز والعيش الفينو - العيش اللى نسيناة المعمول من القمح مش معمول من الرضة والذرة بتوع علف البط والفراخ<br />عايز نشوف رغيف عيش اصلى<br />وبعدين لما نملىء المعدة نبقى نفكر فى القراءة فى متب شرشر نط عند البط ونغنى نشيد ماما زمانها جاية بعد شوية تفتح مكتبات وتقول لنا الثعلب فات فات وفى ديلة سبع لفات<br />معرض كتاب مرة واحدة<br />اية التهور دة"
