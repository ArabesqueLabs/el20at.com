order = 2
subject = "على اى دين انتم"
author = "abu osama"
posted = "2008-05-16"
text = "على اى دين انتم ايها الحكام العرب لالا لن تكونوا على ديننا فمن يهنىء من قتا ابناءه واخوانه لا يمكن ان يكون مسلما<br />ومن يستقبل هذا الاحمق القاتل بوش بالأحضان ويرقص معه بالسيف ليس مسلما نعم نعم واقرأو ان شأتم قول الله تعالى<br />فى كتابه الكريم وهو ينطبق عليهم بسم الله الرحمن الرحيم(يا أيها الذين امنوا لا تتخذوا المشركين اوليأ من دون المؤمنين<br />ومن يتولهم منكم فاءنه منهم)صدق الله العظيم نعم لقد حكموا على انفسهم وذهبوا بملأء ارادتهم الى الآخرة مع الكفرة والقتلة الذين يفضلونهم على اخوانهم من المسلمين الذين يحاصرونهم وهم على جهاد فانتظروا العقاب ايها الظالمون<br />اكتب هذه الكلمات وانا اتحسر اننى لااملك لهم سوى الكلمات سامحونا اخوننا فى فلسطين الحبيب فوالله نحن فى احتلال<br />وذل بايد من يتبعون اليهود .الا لعنة الله على الظالمين"
archived = "2010-03-14"
