[[comments]]
order = 0
subject = "بصاق الأرض لايكفي"
author = "الوعد الصادق"
posted = "2008-05-15"
text = "نعم ويمين الله .بصاق الأرض لايكفي .لنغرق فيه كل من تولى امانة المسلمين فخانها وخانهم.. بصاق الأرض لا يكفي لنغرق به ذلك الذي يربض على أرضه الأزهر الشريف وجامعة العرب ويعلن دستوره أن دينه الإسلام ثم تخط يده الرقطاء برقية تهنئة للصهيوني اليهودي الذي سلب شرفه وانتهك عرضه وابتلع أرضه ودنس مقدساته وقتل أبناء عروبته ودينه وسبى نساءه وأذل رجاله وقهر شيوخه ..أي رجل هذا ..أي نوع من مادة البشر هذا ... أي قبر سيقبل أن يطويه .. ,اي سماء سترتضي أن ترفع روحه حين ينتزعها ملاك الموت..والله ..ويمين الله .. حتى ولو جفت الدماء في عروقه.. حتى ولو انسحقت كل معاني الشرف والكرامة والنخوة تحت أقدام أطماعه وحبه المهووس للحياة.. حتى لو باع دينه جهرة في سوق النخاسة .. حتى ولو تجرد من كل مفردات الإنسانية وضلت معالم الكبرياء ..حتى لو كان يحمل كل هذا ..لبقيت عنده ولو ذرة خزي تردعه أن يبارك قاتله .وأن يهنئ سالب شرفه ومنتهك عرضه ومغتصبه .. أنا قرفان وعايز أستفرغ على وشه الكريه."
archived = "2010-03-14"
