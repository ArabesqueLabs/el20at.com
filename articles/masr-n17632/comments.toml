[[comments]]
order = 8
subject = "يلا يا شعب مصر ادفعوا فلوسكم للممثلين علشان خاطر يسكنوا في الزمالك والمهندسين ويركبوا سيارات اخر موديل وانتو كفاية عليكم المرجع وعين شمس والدويقة ويا دوب عليكم تركبوا مواصلات هيئة النقل العام"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "أجور الممثلين عن الفيلم الواحد ( فى عام 2005 )<br />عادل إمام 7 مليون<br />محمد سعد 6 مليون<br />محمد هنيدى 5 مليون<br />احمد زكى 3 مليون<br />محمد فؤاد 2.5 مليون<br />منى زكى 300 ألف<br />منة شلبى 150 ألف<br />احمد رزق 400 ألف<br />غادة عادل 150 ألف<br />احمد عز 450 ألف<br />نور 100 ألف<br />حمادة هلال 400 ألف<br />تامر حسنى 750 ألف<br />عبلة كامل مليون<br />حكيم 1.5 مليون<br />سمية الخشاب 200 ألف<br />احمد السقا 2 مليون<br />نيللى كريم 150 ألف<br />رزان مغربى 75 ألف<br />هند صبرى 150 ألف<br />محمود حميدة 500 ألف<br />ريهام عبد الغفور 75 ألف<br />علا غانم 75 ألف<br />ماجد الكدوانى 200 ألف<br />أحمد آدم 750 ألف<br />أميرة العايدى 50 ألف<br />داليا البحيرى 120 ألف<br />حنان ترك 300 ألف<br />ياسمين عبد العزيز 150 ألف<br />غادة عبد الرازق 100 ألف<br />بسمة 75 ألف<br />الدراما التليقزيونية<br />ما يحصل عليه الممثل فى المسلسل الواحد ( عام 2005 )<br />يحيى الفخرانى 3 مليون<br />يسرا 2.5 مليون<br />إلهام شاهين 2.5 مليون<br />سهير البابلى مليون<br />حنان ترك مليون<br />أحمد رزق 400 ألف<br />عبلة كامل 800 ألف<br />سمية الخشاب 500 ألف<br />نجوى إبراهيم 950 ألف<br />حسن يوسف 600 ألف<br />مصطفى شعبان 600 ألف<br />ليلى علوى 3 مليون<br />محمد صبحى 1.5 مليون<br />فاروق الفيشاوى 1.3 مليون<br />سمير غانم 400 ألف<br />هشام سليم 500 ألف<br />حسين فهمى مليون<br />ممدوح عبد العليم مليون<br />جومانا مراد 400 ألف<br />سميرة أحمد 1.5<br />هانى رمزى مليون<br />فيفى عبده مليون<br />صلاح السعدنى مليون<br />هذه هى أجور الممثلين فقط ، بخلاف الأجور التى يتقاضاها الكتاب والمؤلفين والمخرجين .<br />نأتى لقائمة بأجور المطربين فى للية راس السنة الميلادية : من نفس العدد بصوت الأمة .<br />أجور المطربين فى هذه الليلة فقط ، وهناك من يأخذ أجره بالدولار ، وفى الساعة :<br />عمرو دياب 300 ألف<br />هيفاء وهبى 30 ألف دولار فى الساعة<br />إيهاب توفيق 70 ألف<br />إليسا 35 ألف دولار فى الساعة<br />نانسى عجرم 30 ألف دولار فى الساعة<br />روبى 120 ألف<br />تامر حسنى 35 ألف فى الساعة<br />مروى 15 ألف دولار فى الساعة<br />وائل جسار 30 ألف دولار فى الساعة<br />راغب علامة 50 ألف دولار فى الساعة<br />عاصى الحلانى 50 ألف دولار<br />شيرين وجدى 75 ألف جنيه<br />شيرين عبد الوهاب 100 ألف جنيه<br />خالد سليم 25 ألف جنيه فى الساعة<br />فريق واما 30 ألف جنيه فى الساعة<br />فريق ( إم تى إم ) 25 ألف فى الساعة<br />حكيم 120 ألف جنيه<br />عامر منيب 70 ألف جنيه<br />حمادة هلال 35 ألف جنيه<br />بهاء سلطان 35 ألف جنيه<br />عصام كاريكا 35 ألف جنيه<br />شاهيناز 20 ألف جنيه<br />هيثم شاكر 20 ألف جنيه<br />ريكو 15 ألف جنيه<br />عمدة 15 ألف جنيه"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011094803/http://masr.20at.com:80/newArticle.php?sid=17632"

