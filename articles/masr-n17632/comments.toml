subject = "هند صبري تونسية"
author = "مش خايف"
text = "ارجو الا يكون مصيرها مصير<br />1) اللبنانية سوزان تميم<br />2) التونسية ذكرى<br />3) المغربية اللي قتلها بليغ حمدي<br />مالكيش دعوى برجال الاعمال المصريين يا حلوه<br />من البيت للاستديو ومن الاستديو للبيت<br />ربنا يكفيكي شر هشام طلعت ومحسن السكري وحديد العز وبقية الشلة اياها<br />وبتوع المخابرات اللي بيعملوا كونترول على النسوان علشان خاطر يجبولهم معلومات<br />ربنا يا بنتي يحفظك باين عليكي غلبانه زينا وجاية البلد تاكلي عيش"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011094803/http://masr.20at.com:80/newArticle.php?sid=17632"

