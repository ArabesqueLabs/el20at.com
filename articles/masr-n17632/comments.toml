[[comments]]
order = 10
subject = "معلش والله اخر حاجه في المهزلة بتاعة السينما"
author = "مش حتجنن"
text = "هند محامية وشاريهان برضه محاميه وعايزين عضويات في نقابة المحاميين<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />محكمة تونسية تأمر بقيد الفنانة هند صبري بسجلات المحاماة<br />محكمة تونسية تأمر بقيد الفنانة هند صبري بسجلات المحاماة<br />قضت محكمة الاستئناف التونسية بقيد الفنانة التونسية المقيمة في مصر هند صبري \\\\\\\"28 عاما\\\\\\\" بسجلات المحاماة وأجازت لها ممارسة المحاماة بصفة رسمية, وذلك بعدما ألغت المحكمة قرار الهيئة الوطنية للمحامين \\\\\\\"نقابة المحامين\\\\\\\" برفض قيدها في السجلات بحسب موقع العربية نت.<br />وقالت مصادر صحفية تونسية أمس السبت إن هند صبري أدت أول من أمس الجمعة وهي ترتدي عباءة المحاماة السوداء وربطة العنق البيضاء اليمين القانونية للمحامين أمام هيئة قضائية بمحكمة الاستئناف بالعاصمة تونس بحضور خصمها عبد الستار بن موسى رئيس نقابة المحامين الذي كان يرفض قيدها والكاتب العام للنقابة، بحسب صحيفة الوطن السعودية الاحد 4-2-2007.<br />واعتبرت وسائل إعلام أن حضور العميد والكاتب العام للنقابة أضفى بعض المشروعية على التحاق هند صبري بالمحاماة إذ نادرا ما يشاهد أهم مسؤولين بالهيئة معا في جلسات ترسيم اعتماد جدد دخلوا المحاماة عبر بوابات القضاء وليس عبر موافقة النقابة\\\\\\\".<br />وقالت صحف إن محامي الممثلة أقنع المحكمة بأن موكلته \\\\\\\"تمارس التمثيل على سبيل الهواية. وليست محترفة, كما قدم ما يفيد إقامتها في تونس\\\\\\\".<br />وحصلت هند صبري على الماجستير في القانون بتقدير جيد جدا من كلية حقوق تونسية وكان موضوع رسالة تخرّجها \\\\\\\"المصنّف السينمائي في القانون التونسي».<br />وسبق لها التقدم بأوراقها الرسمية إلى نقابة المحامين المصريين في التاسع من نوفمبر (تشرين الثاني) عام 2005 لقبول قيدها في جدول المحامين وحلف اليمين والحصول على بطاقة العضوية، إلا أن النقابة رفضت قيدها .<br />وقالت النقابة المصرية في أسباب الرفض إن هند محمد دغبوش، الشهيرة بهند صبري، مواطنة تونسية لم تتجنس بالجنسية المصرية حتى الآن ، حيث تنص مواد قانون المحاماة على اقتصار عضوية النقابة على المصريين من أبوين مصريين وحاصلين على مؤهل قانوني من جامعة مصرية، ولا يستثنى من هذا البند سوى المحامين الفلسطينيين تضامنا من النقابة معهم.<br />كما ذكرت النقابة المصرية أن \\\\\\\"هند صبري تتمتع بعضوية نقابة المهن التمثيلية منذ اكثر من عام كامل، ومقيدة بجدول المشتغلين بها، ما يجعل قيدها بنقابة المحامين غير قانوني\\\\\\\".<br />جدير بالذكر أن الفنانة الاستعراضية المصرية شريهان أقمت قبل سنوات دعوى قضائية ضد نقابة المحامين المصريين التي رفضت قيدها ضمن جداول المحامين العاملين وقيل وقتها إن النقابة ترفض عضوية شريهان فيها لتنافي متطلبات مهنة التمثيل والرقص الاستعراضي مع مهنة المحاماة، ورفضت المحكمة الدعوى القضائية التي أقامتها شريهان وألزمتها بمصاريف المحاماة."
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011094803/http://masr.20at.com:80/newArticle.php?sid=17632"

