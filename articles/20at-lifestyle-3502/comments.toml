posted = "2007-03-29"
text = "إذا كان هناك من مشكلة فيجب معالجتها من الأساس, فالفتاة التي تظهر بالمظهر الذي وصفه الكاتب, أعتقد أن لها أهل و هم يرونها كل يوم كيف تذهب إلى جامعتها أو إلى معهدها حيث من \"المفروض أنت تتلقى علومها هناك\" ومن المؤكد أن الفتاة تأخذ مصروفها من ذويها و هذا يتضمن طبعاً لبسها وزينتها… أي إن هذا الأمر يجري برضى الأهل.. فالمشكلة هي في تربية وتوجيه الأهل لأبتائهم.. أما من ناحية \"مواكبة الموضة\" فهذا ليس بالأمر الخطأ شرط أن تكون لهذه الموضة ضوابط تتعلق بالأمور الشرعية والتقاليد الاجتماعية طبعاً إذا كانت بيئة المجتمع محافظة.. أما غير ذلك فلا يجب أن يستغرب البعض بل الكثير منا بظهور هذه الأمور في مجتمعنا, لأن لكل أمر حد وضوابط إذا تم تجاوزها دخلنا في منطقة الفساد, والفساد إذا بدأ بالنوع الاجتماعي فسينتقل إلى الإداري والثقافي وغيرهم…"
archived = "2010-07-30"
