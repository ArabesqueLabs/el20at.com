text = "كنا نرجع من المسجد بعد صلاة الجمعة<br />ونجتمع حول ترابيزة السفرة لتناول الغذاء كاسرة مجتمعة يوم الجمعة ونفتح الراديو على برنامج على الناصية الساعة الواحدة والنصف ظهرا<br />نستمع الى برنامج على الناصية ومقاطع من اغنيات ام كلثوم يا احلى من ايامى يا اغلى من ايامى خدنى لحنانك خدنى<br />ننتهى من برنامج على الناصية لنسمع نشرة اخبار الساعة الثانية والنصف ظهرا<br />فى يوم الجمعة ايضا الساعة الرابعة والربع ظهرا فى برنامج عالم الصحافة نسمع مقال بصراحة للعملاق محمد حسنين هيكل اطال اللة عمرة"
