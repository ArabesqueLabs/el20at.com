subject = "رائع .. رائع ... رائع"
author = "abdel maqsood"
posted = "2008-05-24"
text = "إذا سقطت حشرة في كوب القهوة الخاص بك - فماذا تفعل ؟<br />التحليل:<br />إذا كنت من حزب الوفد فستلقى بكوب القهوة وتغادر المقهى<br />وإذا كنت من الإخوان فأنك ستخرج الحشرة وتشرب القهوة<br />وإذا كنت من حزب العمل أو الشعب فانك ستأكل الحشرة وتشرب القهوة<br />إما إذا كنت من الحزب الوطني فسيكون رد الفعل مختلفا - -!!!<br />ستبيع الحشرة إلى مستثمر..<br />والقهوة إلى مستثمر عربي رئيسي<br />وستصيح - امن الدولة معرض للخطر –<br />وتفرض قانون الطوارئ<br />وسيتهم الإخوان المسلمين بإلقاء الحشرة في القهوة –<br />وستدعى أن حماس والجهاد والقاعدة ساعدوا الإخوان في إلقاء الحشرة في القهوة وان هذه عملية إرهابية<br />وسيطلب من الدولة منع طيران تلك الحشرات الإرهابية<br />وتقبض على عشرين ألف من الإخوان وتقدمهم للمحاكم العسكرية وتصادر أموالهم<br />ويتم رفع أسعار البنزين والديزل والضرائب إلى عشرين ضعفا<br />لتشترى كوب قهوة :<br />غالي ونظيف وتعيش مسرور وحياتك آخر جمال ومبارك عليك يا حبيب"
