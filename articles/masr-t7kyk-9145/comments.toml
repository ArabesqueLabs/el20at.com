order = 0
subject = "الحزب الوطنى"
author = "واحد من الناس اللى تحت"
posted = "2008-05-22"
text = "قرأت فى احد المدونات<br />اذا سقطت حشرة فى كوب القهوة الخاص بك - فماذا تفعل ؟<br />التحليل<br />اذا كنت من حزب الوفد فستلقى بكوب القهوة وتغادر المقهى<br />واذا كنت من الاخوان فأنك ستخرج الحشرة وتشرب القهوة<br />واذا كنت من حزب العمل او الشعب فانك ستأكل الحشرة وتشرب القهوة<br />اما اذا كنت من الحزب الوطنى فسيكون رد الفعل مختلفا - - ستبيع الحشرة الى مثتثمر والقهوة الى مثتثمر عربى رئيسى<br />وستصيح - امن الدولة معرض للخطر -- وتفرض قانون الطوارىء<br />وسيتهم الاخوان المسلمين بالقاء الحشرة فى القهوة - وستدعى ان حماس والجهاد والقاعدة ساعدوا الاخوان فى القاء الحشرة فى القهوة<br />وان هذة عملية ارهابية<br />وسيطلب من الدولة منع طيران تلك الحشرات الارهابية<br />ويقبض على عشرين الف من الاخوان ويقدمون للمحاكم العسكرية وتصادر اموالهم<br />ويتم رفع اسعار البنزين والديزل والضرائب الى عشرين ضعفا لنشترى كوب قهوة جديد ونظيف"
archived = "2010-03-14"
