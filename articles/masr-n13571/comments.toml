subject = "الافلام رسالة الى الديكتاتورية"
author = "مصرى"
text = "الديكتاتورية بتاع الامن وارهاب اقسام الشرطة للشعب ونشرها الفساد لدرجة ان امريكا تشترط فى تسليمها المعونة هذا العام ان تحسن الشرطة معاملة الناس فى الاقسام واماكن الحبس<br />يعنى الريحة القذرة بتاعة الشرطة بيشموها فى امريكا<br />اما انتشار الفقر فهذة من تخطيط لجنة السياسات"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229071528/http://masr.20at.com:80/newArticle.php?sid=13571"
