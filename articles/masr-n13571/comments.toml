subject = "كرييييييييم وبس والباقي عادي"
author = "mark"
posted = "2008-02-25"
text = "عجبني جدا فيلم كريم من قبل ما اشوفه وبعد ما شفته مش قادر اوصف الفيلم بكلمات بصراحه فيلم جمبييل جدا وملهوش حل..كنت هدخل فيلم الجزيره الاول لكن قررت ادخل خارج علي القانون الاول وبعدين الجزيره وقد كان ...<br />فيلم احمد السقا بالنسبالي درجه تانيه متاثرتش بيه قوي لكن لفت نظري الضرب والاكشن الي فيه كانو تحفه ..عجبني فيلم خارج علي القانون لاني شفت فيه قصه وذكاء وتشويق مش مجرد ضرب وصعايده وارهابزي ماشوفت في الجزيره لكن مانكرش انه برضه عجبني..مارك"
