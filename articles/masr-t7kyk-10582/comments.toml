order = 0
subject = "عن اى دعم تتكلمون - ومين اللى بيدعم مين - اكذوبة ع"
author = "ابو شحبور"
posted = "2008-11-23"
text = "ما فيش حاجة اسمها دعم - دى اكبر اكذوبة فى تاريخ مصر<br />تحب نتكلم بالمفتشر وعلى عينك يا تاجر<br />نبدأ منين<br />نختار دولة اقتصادها حر ولا تدخل للحكومة اطلاقا فيها ولا فى اسعارها - خلينا نختار دولة من الشرق الاوسط ولتكن دبى او جدة<br />سعر التليفزيون فى دبى 280 درهم يعنى 350 جنية 21 بوصة ومثيلة فى القاهرة 850 جنية - لية<br />سعر سيارة التويوتا 45 الف درهم يعنى 60 الف جنية مصرى وتباع فى مصر ب 120 الف جنية - لية<br />سعر لتر البنزين فى مصر 170 قرش وبما يعادل السعر فى دبى واغلى من السعودية<br />رغيف الخبز اللى بيتكلموا علية واللى معمول من علف الحيوانات ما لوش سعر والحكومة بتكسب من وراة<br />تذاكر السكة اليد والمواصلات اغلى من اى دولة فى الشرق الاوسط<br />الكهرباء والمياة اغلى من اى دولة خليجية وعربية واسرائيل<br />اسعار الارز والشاى تباع فى مصر بالاسعار العالمية واغلى من العالمية<br />التلاجات والمكيفات والاجهزة الكهربائية اغلى من اى مكان فى العالم<br />يبقى دعم اية<br />لما الشباب يجند لمدة ثلاث سنين فى الجيش والشرطة للعمل بالمجان تحت بند خدمة العلم ونحن بلد لسنا فى حرب ولا وارد اننا ندخل حرب يبقى اية<br />مين اللى بيدعم التانى<br />لما بطارية السيارة فى مصر ب 350 جنية وفى دبى وجدة ب 70 ريال يعنى 100 جنية<br />دعم اية<br />دة المواطن هو اللى مدعوم ومصدوم<br />بطلوا كذب بقى"
archived = "2010-03-14"
