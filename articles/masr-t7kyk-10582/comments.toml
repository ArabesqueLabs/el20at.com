order = 1
subject = "صكوك الملكية والصك على القفا - ونهاية لعبة الثعلب"
author = "س"
posted = "2008-11-23"
text = "عندما قامت ثورة العسكر فى مصر خرجوا بشعار الاتحاد والنظام والعمل واستمر من 54 وحتى 59<br />وبعدها طلعوا بشعار التعاون لبناء مصر وطلبوا من الناس ان تتعاون وتشارك وتساهم وتبنى المصانع<br />وحتى شركة زى الحديد والصلب بدأت باسهم لمصريين ومن جميع الشعب وكتير ساهموا فيها وكان لهم اسهم فيها<br />وانتظرت الحكومة من الناس او ما يسمى بالقطاع الخاص ان يبنى المشاريع ولكن لم يبنى احدا شيئا لفقر الناس ثم من هو القادر على بناء مصنع اسمدة او ادوية او كيماويات<br />وفى سنة 61 وضع المرحوم عزيز صدقى الخطة الصناعية الاولى على اساس انشاء قطاع للصناعات الخفيفة التحويلية وانتهت سنة 1966 بنجاح مذهل وبنى كل تلك المصانع التى نبيع فيها منذ 20 سنة ولا زلنا<br />كانت الخطة الثانية لعزيز صدقى هى البدأ فى الصناعات الثقيلة ولكن الغرب وامريكا لم يسمحا بذلك ودبرتا حرب 67 ولم ترى الخطة الخمسية التانية النور ولم ندخل عصر الصناعة الثقيلة اطلاقا وحتى اليوم<br />اذن ليس عندنا المصانع الثقيلة اللى عند الاتحاد السوفياتى ولا بولندا ولا تشيكوسلوفكيا<br />دى شوية مصانع لصناعات تحويلية اقرب الى ورش كبيرة ذات خطةط انتاج متهالكة وعايزة تتخرد وتتباع فى وكالة البلح<br />اذن صكوك اية اللى بيقولوا عليها ولما هيوزعوها هتجيب عائد اية<br />سيداتى وساداتى دى صك على القفا"
archived = "2010-03-14"
