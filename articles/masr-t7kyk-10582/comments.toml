[[comments]]
order = 2
subject = "صحوك الغفران الحكومية ونظرية عصا موسى"
author = "مش شريف الدواخلي ولاالبراء اشر"
posted = "2008-11-24"
text = "عملية صحوك الحكومة دي بتفكرني بصحوك الغفران التي كانت تبيعها الكنيسة للمسيحيين في القرن التاسع عشر<br />وبعدين في حاجه اسمها عصا موسى والحكومة المصرية عرفاها كويس<br />سيدنا موسى لما رما العصا تحولت الى ثعبان اكل كل العصيان الصغيره<br />كذلك خالتك الحكومة المصرية لما تلاقي المشاكل بتكتر والناس بتتكلم فيها كتير مثلا زي غلاء الاسعار وخلافه من المشاكل<br />تروح الحكومة راميه عصا موسى اللي تخلي الناس تنسى المشاكل الكتيرة وتتكلم في هذا الموضوع<br />كذلك الصحوك الحكومية اللي الحكومة حتوزعها على الشعب ما هي الا :<br />1) ضحك على الذقون تماما كصكوك الغفران الكنيسية في القرن التاسع عشر<br />2) عصا موسى التي جعلت الناس ينصرفون عن مشاكل البلد الاساسية والحديث في هذا الموضوع<br />وخلي بالكم دايما من عصا موسى دي لان الحكومة المصرية استخدمتها كثير وهي اسلحة من اسلحة الحكومة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "من انجازات الباشا محمد على باشا الكبير واستمرت فى"
author = "ابو داوود"
posted = "2008-11-24"
text = "ادخل محمد على باشا زراعة القطن فى مصر وذلك ضمن مشروع النهضة الخاصة بمصر<br />واستمرت زراعتة فى مصر فى حكم اولادة واحفادة من بعدة<br />وكان يسمى القطن المصرى بالذهب الابيض مقارنة بالذهب الاسود اللى هو البترول اللى عند دول الخليج<br />افخم انواع الملابس فى العالم كان يكتب عليها made from egyptian cotton<br />ثم اتى زمن الاصلاح<br />فى مدينتى الصغيرة كان يوجد اربع محالج للقطن - يتم جمع القطن من الفلاحين ويحلج اى يفصل البذور عن القطن ويجمع فى بالات وتصدر الى الاسواق العالمية<br />ثم يتم عصر بذور القطن ويتم استخراج زيت القطن الذى كان يعرف بالزيت الفرنساوى وكان يكفى مصر بالكامل وبقايا البذور اسمها الكسب وهو من احسن اعلاف الحيوان<br />توقف الناس عن زراعة القطن بالكامل<br />وبيعت محالج القطن لمثتثمرين وتم بناء عمارات سكنية على ارضها وبيعت الالات خردة لمصانع الحديد<br />ويتم استيراد القطن على حسب ما كتبت الجرائد من اسرائيل<br />لو سألت فلاح من الشباب ازاى تزرع القطن مش هيعرف<br />الحقيقة الاصلاح ماشى على ودنة ولا رجعة فية وكلة لمصلحة المواطن<br />وربنا يخللى المواطن"
archived = "2010-03-14"
capture_url = ""
