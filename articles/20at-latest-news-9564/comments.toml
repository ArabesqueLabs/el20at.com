subject = "بالعكس مخطط لها منذ سنه"
author = "رجاء ابودقة  جزائري بغزة"
posted = "2008-07-12"
text = "باسم اللجنة الوطنيه للدفاع عن حقوق المواطنة من غزة ،افتخر اني جزائري المولد و النشا طيلة ال31سنه التي عشتها منذ البولادة و قدومي الى غزة مع زوجتي الحبيبة كريمة ملزي الجزائرية، احيطكم علما اننا خططنا لهذا اليوم طيلة سنه كاملة من الاعتصام اليومي و الاحتجاج السلمي لاسماع صوتنا للعالم اجمع ، و كم انهمرت دموعنا شوقا وحنينا الى الجزائر اين يوجد نصفنا الاخر من الاهل و العائله و الطفولة، و كم انهمرت دموعنا حسرة و حزنا و ايمانا منا بحتميه التضحية من اجل نيل الحرية هنا في ارض فلسطين عشنا لحظات القصف الصهيوني و فقدنا اقربائنا و اعزتنا من حولنا و فقدنا اراضي لنا جرفت و بيوتنا هدمت و لم نتزعع لحظه في ايماننا بل بالعكس شددنا على ايادينا و عزيمتنا بحتميه انتصارنا يوما و لكن جاء الاقتتال الداخلي الفلسطيني لينال منا في ظرف ساعات قليلة و منذ ذلك الوقت ونحن نأن الما من ويلات ما راينا من دماء سالت من نار الفتنة، و نحن لا نطمع الا في حياة كريمة مثل باقي البشر ، ومن هنا انتظرنا يوم عيد الاستقلال يوم 05/07/2008 لنقل اننا نحن هنا<br />رجاء ابودقة"
archived = "2010-03-14"
