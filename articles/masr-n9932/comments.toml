text = "نأسف لعدم تمكننا من استقبال مراسلاتكم ومشاركتكم طوال الأسبوعين الماضيين نظراً لهجوم رسائل الـspam على السيرفر الخاص ببريدنا الإلكتروني، مما أدى إلى تعطيل العمل به طوال هذه المدة، ولذا نود أن نتعذر لكم، ونبلغكم بأننا نتلقى مشاركتكم مؤقتاً على عنوان البريد التالي: weladelbald@yahoo.com، ونتمنى منكم إعادة إرسال مشاركتكم حتى يتسنى لنا نشرها سريعاً"
