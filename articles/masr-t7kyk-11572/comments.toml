subject = "شعار المسيرة - دخل الشمس من شباكك"
author = "دكتور كحة"
posted = "2009-03-15"
text = "رائع<br />طيب وسكان العشوائيات والاحياء الشعبية اللى فيها ملايين زى امبابة وشبرا اللى البيوت ملتصقة والشوارع حارات ضيقة 3 متر والبيوت ارتفاعها 15 متر والشقق مضلمة وعمرها ما بتشوف الشمس - يعملوا اية<br />وبعدين السفيرة مشيرة هتعالج السل بالمسيرات والا بالادوية<br />فين الادوية يا سعادة السفيرة<br />هى العملية مسيرة وشوية منظرة ومليون واحد ماشى - ان شاء اللة يمشوا على رؤوسهم - مشيهم مش هيعالج المرض<br />اللى هيعالج المرض هو الدواء والغذاء والسكن الصحى عندك حل للحاجات دى الدواء والغذاء والسكن الصحى<br />مسيرة ال<br />يظهر انك عجوزة اصلك من مواليد 1944 وطبعا عشتى مرحلة الشعارات الناصرية"
archived = "2010-03-14"
