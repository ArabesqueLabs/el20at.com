[[comments]]
order = 1
subject = "الدراسة =فقدان الحنان."
author = "حياة من المغرب"
posted = "2007-03-21"
text = "السلام عليكم..أختي أميرة، ممكن أطرح عليك سؤال؟وأنت تكتبين هذا الموضوع،ألم تفكري في من هم بعيدون عن آبائهم؟والله أثناء قرائتي الأولى للموضوع أحسست بقشعريرة في جسدي،وحنين الى أبي،وغيرة اتجاهك لأنك تملكين أبا يعيش بقربك يراك تترعرعين بين أنامله،وتتخذينه قدوة لك .أما أنا فشاء القدر أن يبعدني عن والدي،فخيرت بين أمرين كلاهما قاس على قلبي،اما الدراسة أو العيش مع أسرتي الصغيرة،لكني اخترت سبيل العلم....لأ حرم من حنان الأبوين...حنان الأم وحب الأب....فهل فعلت الصواب؟"
archived = "2007-07-20"
capture_url = "https://web.archive.org/web/20070720222012/http://20at.com/newArticle.php?sid=5117"

[[comments]]
order = 2
subject = "ديمة"
author = "حبه كثيرا"
posted = "2007-03-21"
text = "كلامك عن والدك شبه كلامى عن بابا مع اى حد اعرفه، لكن انا حظى احسن من ناس كتير حولى ان لسه حسه فى الدنيا مالى على حياتى، لكن كلامك رجعنى لسؤال بافكر فيه كل يوم واحساس باخاف منه وناس بازعل عشان الانسان الجميل اللى كان فى حساتعا مشى.<br />ربنا يصبرك ويصبرنا جميعا على بعدهم سواء كان ده بايدنا او غصب عنا، وربنا يحيى باباكى كل يوم جواكى اكتر واكتر<br />ويخلى لى بابايا واقدر اسعده ومااقصرش فى حقه"
archived = "2007-07-20"
capture_url = "https://web.archive.org/web/20070720222012/http://20at.com/newArticle.php?sid=5117"

