text = "اوقات الكلام بيضيع يا اميرة منى مش بعرف اقول ايه<br />مقالك حلو جدا وهو على فكرة احساس اكتر من وصف<br />مش هقدر اقولك غير ربنا يرحمه ويرحم موتانا وموتى المسلمين ويصبرك ويصبرنى انا كمان ويرحمهم جميعا"
archived = "2007-07-20"
capture_url = "https://web.archive.org/web/20070720222012/http://20at.com/newArticle.php?sid=5117"

