posted = "2007-04-04"
text = "بجد يا اميرة مقال حلو اوى<br />فعلا الانسان بيحس بد بقيمة اهلة اما بيبعدو عنة<br />وانا حسيت بقيمة بابا اوى اما فقدتة مع انى بصراحة كنت حاسة بقيمتة وهو موجود<br />بجد بجد مقال رائع واسلوبك يجنن يا قمر"
