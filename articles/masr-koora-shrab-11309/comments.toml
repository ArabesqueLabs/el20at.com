subject = "فيما أكد أن كل ما وصل إليه من مجد وشهرة يرجع فقط ل"
author = "مش ححبك"
posted = "2009-02-16"
text = "نسي الشعب المصري<br />نسي الجماهير اللي عملته وعملت النادي الاهلي بتاعه<br />نسي ان اليغمه اللي هو فيها دي من فلوس مشاهدة مباريات كرة القدم اللي الشعب الاهبل بيدفعها<br />نسي ان الشعب المصري ياما عمل ناس كبار زي صالح سليم والخطيب ومصطفى عبده وعادل امام ونجلاء فتحي ونور الشريف<br />كل دول ناس اغتنت من فلوس التذاكر اللي بيدفعها الشعب المصري وبعد كده يبقو بهوات وبشوات ويركبوا الزلمكه واول حاجه يتنكروا للشعب المصري اللي عملهم ولاد ستين (.....................)<br />معلش انا صايم النهاردة وبلاش اشتم علشان خاطر صيامي يا يرحش<br />الفضل يرجع الى الله سبحانه وتعالى اولا واخيرا<br />ثانيا الشعب المصري والجماهير المصرية يا ناكر الجميل اللي لولاها كان زمانك بتلعب كوره شراب في الحاره"
archived = "2010-03-14"
