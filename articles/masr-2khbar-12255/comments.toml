text = "بناءا على طلب السفارة الامريكية وجهت الحكومة الدعوة ل 11 نائبا من الاخوان المسلمين وكذلك الاخ ايمن نور لحضور حفل خطاب اوباما فى جامعة القاهرة<br />لاحظ الخبر - بناءا على طلب السفارة الامريكية<br />لية لا نكون حلوين على طول<br />لية لا توجة مثل هذة الدعوات عند القاء مبارك بمناسبة ما<br />لية الاستقطاب والتفرد بالحكم<br />هل عندما وجهت لهم دعوات نظام الحكم هيختل = - ابدا<br />احنا عندنا قصور وجمود سياسى"
