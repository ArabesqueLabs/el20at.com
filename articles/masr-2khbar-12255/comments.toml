author = "الحذر واجب"
posted = "2009-06-02"
text = "نعم حماية الرئيس الامريكى مش حاجة لعبة واعتقد انة سيصطدم باسرائيل وربما يدفع الصهاينة الامريكان الى اغتيالة كما حدث للرئيس كنيدى حينما ابدى تقاربا مع الرئيس عبد الناصر<br />وطبعا الامريكان فهموا لعبة اسرائيل متأخرين<br />فقد دفعت اسرائيل امريكا وغررت بها لغزو العراق لتدميرة نيابة عنها حتى تظل هى القوية فى المنطقة والنتيجة خسرت امريكا كل اقتصادها<br />والان تريد اسرائيل ان تدفع امريكا لتحارب عنهم ايران وتدخل الامريكان فى متاهة<br />امريكا فهمت اللعبة الاسرائيلية بعد خراب مالطة<br />واوباما هيكون شخص مكروة من اسرائيل فحمايتة على ارضنا واجب قومى ووطنى"
