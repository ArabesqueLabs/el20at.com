text = "مصر قلعة الاسلام واهم بلد اسلامى فى العالم<br />وها هو رئيس الولايات المتحدة يعترف بذلك ويأتى الى قاهرة المعز وعاصمة الاسلام ليوجة خطاب للعالم الاسلامى<br />وهذا يتعب زخارى وامثالة نفسيا<br />يتعبهم نفسيا ان يقروا ان مصر بلد الاسلام وحصنة وكنانتة<br />يشعرون انهم اقلية ضئيلة لا تودى ولا تجيب زى الاقلية المسلمة فى باريس او فى لندن<br />مرحبا باوباما فى القاهرة"
