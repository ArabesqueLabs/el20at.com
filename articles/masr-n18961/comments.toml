[[comments]]
order = 0
subject = "فى الشريعة الاسلامية لك حق فى بيت المال تاخذة غصبا عن السلطان ولا عمل لك"
author = "عب عزيز"
text = "المفروض ان يكون لك مرتب ثابت من بيت المال اللى هو وزارة المالية<br />فكل العجزة والكهول وغير القادرين على الكسب للعجز الجسدى والعقلى من جميع الاديان سواء يهود او نصارى او مسلمين مسؤول عنهم امام رب العزة يوم الحساب الرئيس او ولى امر هؤلاء الناس"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235852/http://masr.20at.com:80/newArticle.php?sid=18961"
