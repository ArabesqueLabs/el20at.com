text = "البابا هو اللى بيدافع عن الرسول يالها من مصيبه حلت بنا عيب عليكو يا مسلمين يا(رجاله)<br />بجد عيب اوى اوى اوى<br />الكفر مله واحده<br />اللهم افتح لنا بابا للجهاد واعنا على انفسنا<br />وصبرا يارسول الله فانت بقلوبنا وثارك نحن مسؤلون به"
