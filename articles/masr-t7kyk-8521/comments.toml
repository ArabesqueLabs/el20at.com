text = "أولا أحب أحيي هبة على التحقيق الرائع ده<br />ثانيا أحب أقول ان المشروع ده من أعظم المشاريع وربنا هيبارك فيه لانه لخدمة العرب كلهم<br />على فكرة انا رغم اني عايشة في القاهرة الا ان لم أتمكن من الاشتراك في صناع الحياة وبدلا من ذلك شاركت مع صناع الحياة بالعاشر من رمضان في توزيع الملصقات ونشرها في القاهرة لاني ما اعرفش اي حد ممكن يديني الملصقات في القاهرة<br />الحمد لله تمكنت من الصاق 100 تقريبا بالاضافة الى ان اختي اخدت 50 ملصق تانيين لنشرها بين طلبة الجامعة في مدينة السادس من اكتوبر والناس كلها متحمسة جدا<br />انا كنت باعلق ملصق في احد الاماكن ولقيت راجل كبير بيبصلي افتكرته هيقولي ممنوع التعليق هنا لانه قدام القصر الجمهوري ولكني فوجئت بانه بيقولي: المشروع ده هايل يا بنتي ويا ليت كل الشباب يشاركو فيه..يا ترى عندك مجموعة استيكرز ينفع اخدها واعلقها في منطقتنا؟<br />طبعا انا معنوياتي ارتفعت جدا بعد ردود الافعال من اللي حواليا<br />كمان بقيت كل ما الزق استيكر يسألني حد هو ايه ده اللي بتلزقيه؟ اقوم اشرحله بسرعة الحملة واهدافها..بجد حاجة تفرح<br />ربنا يوفقنا جميعا يا رب"
