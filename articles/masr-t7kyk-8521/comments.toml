text = "فعلا المدمنين بيتصلو بال call centers<br />وعلى حد المعلومات اللى وصلتني من صناع الحياه المعادي<br />اخر الاسبوع اللى فات كان في اكتر من 2 مليون و 290 الف استيكر ملزوق<br />وكمان اكتر من 4700 event معمول ...... و 87 حاله اتصلو في يوم واحد<br />دي كانت احصائيات اخر الاسبوع اللى فات<br />يا ريت فعلا نشتغل شغل من ناااااااااااااار<br />عايز اقول كمان حاجه بس<br />ان الحمله دي مش بتاعت الاستاذ عمرو خالد بس<br />دي بتاعت كل شاب وفتاه في الوطن العربي<br />وربنا يوفقنا جميعا الى ما يحبه ويرضاه"
