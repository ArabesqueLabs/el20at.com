text = "السلام عليكم انا اخوكم جبريط محفوظ من الجزائر ياشباب شدو حلكم والله اني الحملة جاءت في وقتها فلا تضيعو هده الفرصة فابدلو كل ما تستطعون مانا عن نفسي والله ببدل كل ما استطيع وقد اشتركت في جمعية اسمها جمعية الارشاد والاصلاح ومن خلالها توسعت في الانشطة مع دعمها وتوفير كل الامكانيات من اجل انجاح هده الحملة لدالك انصح الشباب انهم يشتركو في الجمعيات لانو هي الحل الافضل في نجاح الحملة وشكرا ."
