subject = "بشاير حمله حمايه  ..... أ/عمرو خالد"
author = "عمرو"
posted = "2008-03-20"
text = "بشائر حملة حماية .. أ / عمرو خالد :<br />ابشروا يا شباب ، بفضل جهودكم حققنا انجاز رائع في الاسبوع الأول ، فابدوا الاسبوع الثاني وكلكم همة ونشاط بفضل الله علينا لما تحقق في الاسبوع الاول<br />شركات ومصانع مصرية<br />• مخبوزات ريتش بيك الشهيرة انضمت للحملة بتوزيع البوسترات الخاصة بالحملة مع منتجاتها، بالإضافة إلى وضع بوسترات الحملة على سيارات التوزيع في سائر أنحاء الجمهورية .<br />• المول التجاري الشهير \"هايبر وان\" اشترك في الحملة بتوزيعه للبوسترات و الملصقات مع كل المنتجات التي يبيعها للمستهلكين<br />• مصانع وشركات \"ريادة\" المنتجة للاجبان قررت وضع لوجو الحملة على جميع المنتجات الخاصة بمنتجاتها، بما في ذلك عبوات التصدير لحوالي 6 دول عربية.<br />• وكيل شركة \"بروكتر اند جامبل العالمية\" في مصر أعلن عن انضمامه للحملة ودعمه لها في منطقة الدلتا والاسكندرية حيث سيقوم موزعي الشركة بتوزيع بوسترات الحملة على التجار الذين يتعاملون معهم.<br />• أعلنت محلات لوكرنفال للحلويات تبنيها للحملة ودعمها لها.<br />• شركة الدعاية و الإعلان المسئولة عن الإعلانات الموجودة في طريق مصر الاسكندرية الصحراوي أعلنت عن مشاركتها في الحملة وذلك عن طريق توزيعها للبوسترات والبروشورات الخاصة بالحملة على المغادرين والزائرين للطريق.<br />• المدرسة المصرية الدولية ومدرسة مودرن بالهرم قرروا وضع بوسترات الحملة على جميع أتوبيسات نقل طلابها في مصر<br />• مواقع محيط وموقع بص وطل وموقع في الجول.كوم الإلكترونيه تبنوا الحملة على الصفحات الأولى لمواقعهم لكل القراء مع تنظيم شات على الهواء مباشرة مع الأستاذ عمرو خالد للحديث عن الحملة خلال الاسبوع القادم.<br />الإعلام وإعلاميين<br />• جريدة المصري اليوم انضمت كشريك إعلامي لحملة حماية وقامت بتوزيع ملصقات الحملة داخل عددها الصادر بتاريخ 13 مارس 2008 ، وتعد الجريدة لعدد خاص عن خطورة المخدرات وعرض كامل لاخبار الحملة.<br />• قناة المحور وقناة الرسالة تبنت الحملة من خلال برنامج الجنة في بيوتنا الذي يقدمه الاستاذ عمرو خالد والذي انطلقت منه الحملة.<br />• قناة مودرن سبورت أعلنت عن انضمامها للحملة وقد قامت القناة باذاعة يومية للأفلام القصيرة الخاصة بالحملة، وقد تفاعل العديد من الرياضيين مع نداء القناة وأعلنوا البدء في عدة مشاركات رياضية لدعم فكرة الحملة.<br />• برنامج القاهرة اليوم على شبكة الاوربت طالب مشاهديه بتبني الحملة، وقد تفاعل العديد من الفنانين وأصحاب الشركات في العالم العربي لتبني الحملة استجابة لنداء البرنامج.<br />• جريدة عكاظ السعودية الشهيرة أعلنت عن انضمامها للحملة كشريك إعلامي في المملكة العربية السعودية<br />الدول العربية<br />• شركة الاتصالات السعودية تواصلت مع الحملة وأعلنت عن رغبتها في الانضمام للحملة بارسال SMS’S لجميع عملائها للتعريف بالحملة.<br />• شركة داماس للمجوهرات قررت طبع 30 الف بروشور للحملة لكي توضع ضمن الكاتولوجات الخاصة بالحملة للتوزيع على عملائها \"حسنى مصلى\".<br />• المستشفى السعودي الألماني بالمملكة العربية السعودية قررت طبع الملصق الإرشادي الذي يحتوي على شعار الحملة وتوزيعه في أنحاء المملكة العربية السعودية ، إلى جانب تنظيم عدد من الندوات التثقيفية و حلقات البحث العلمية لمناقشة موضوع الإدمان بالاستعانة بأطباء المستشفى بمختلف تخصصاتهم.<br />• وزارت داخلية الأردن و ليبيا و اليمن و الإمارات العربية المتحدة أعلنوا عن دعمهم للحملة.<br />• وزير الصحة الأردني أرسل خطاباً رسمياً للجنة المركزية للحملة بالاردن يعلن فيها عن دعمه لحملة حماية<br />• شرطة دبي زادت من كمية الملصقات التي قامت بطباعتها لتصل إلى 200 ألف ملصق بسبب الإقبال الشديد من شباب دولة الإمارات العربية المتحدة، وقد نظمت شرطة دبي أول نشاط في الحملة من خلال ندوة جماهيرية بنادي شرطة دبي.<br />صناع الحياة<br />• فريق AKYD صناع الحياة بالجماعة الأمريكية بالقاهرة تنظم ندوة كبرى بحضور طلاب الجامعة، يحاضر فيها الاستاذ عمرو خالد بتاريخ الاحد 16 مارس 2008<br />• صناع الحياة نظموا عدد من فعاليات التوعية بالحملة و الترويج لها كان من أهمها زيارة صناع الحياة بالسنبلاوين لـ 800 مسجد في عدد من المحافظات للاتفاق مع أئمة المساجد على جعل خطبة الجمعة القادمة تركز على موضوع المخدرات.<br />• صناع الحياة بالمنصورة اتفقوا مع عدد كبير من الأسر الطلابية داخل جامعة المنصورة على الإشتراك في الحملة من خلال تنظيم عدد من الفعاليات و الأحداث و الاحتفالات التي تروج للحملة<br />• صناع الحياة بجامعات الجزائر بدولة الجزائر قاموا بطباعة 100 ألف بوستر على نفقة طلاب الجامعة وقاموا بتوزيعها ولصقها في أرجاء الجامعة .<br />• حفصة من صناع الحياة بالسعودية طبعت 500 تي شيرت عليها شعار الحملة وجمعت عائلتها وأقاربها وأقامت مزاد ببيتهم لشراء التي شرتات باسعار عالية لعلاج المدمنين الفقراء الغير قادرين على تحمل نفقات العلاج.<br />• شباب صناع الحياة من طلاب جامعة الملك سعود في الرياض طبعوا عشرة آلاف بوستر و ملصق للحملة وقاموا بتوزيعها ، ولأول مرة تشهد الجامعة مشاركة واسعة من الطالبات في الدعاية للحملة و الترويج لها<br />• الفنان التشكيلي عبد الرحمن الحسيني من صناع الحياة رسم لوحة جدارية عليها شعار الحملة ليتم الاستفادة منها وتعليقها في مكان متميز<br />رياضيين<br />• فريق كرة السلة بنادي سبورتنج السكندري انضم لحملة حماية حيث حصل الفريق على موافقة من المعلن لوضع شعار الحملة على القمصان الرياضية للاعبين بدلاً من الإعلانات ، ووافق المعلن على ذلك اشتراكاً منه في الحملة ، ودعماً لها.<br />• أعلن اللواء محمود أحمد علي رئيس الاتحاد المصري لكرة السلة عن تخصيص 50 % من دخل الاتحاد من مبارايات كرة السلة في الدورات المجمعة القادمة لصالح حملة حماية للمساهمة في علاج المدنين غير القادرين على تحمل نفقات العلاج ،كما أعلن أن الدورة المجمعة القادمة للناشئين تحت 18 سنة سيوضع باديج الحملة على جميع القمصان الرياضية لكل الفرق. كما أعلن الكابتن مدحت وردة أفضل لاعبي أفريقيا في كرة السلة عن انضمامه للحملة واستعداده للمشاركة في جميع الانشطة.<br />• شركة سبورتيف للتسويق الرياضي اتفقت مع عدد من لاعبي كرة القدم المشهورين على إقامة عدة مباريات كرة قدم خماسي لجذب الشباب والترويج أثناء هذه المباريات للحملة وقد وافق عدد كبير من لاعبي كرة القدم علي حضور عدد من الفعاليات المتعلقة بالترويج للحملة مجاناً، من أشهر اللاعبين الذين سيساهمون في الترويج للحملة هادي خشبة ونادر السيد و سيد عبد الحفيظ<br />أماكن الترفيه<br />• حديقة الازهر بارك شاركت في الحملة بحفلة غنائية بها عدة أغنيات عن خطورة المخدرات وذلك يوم الجمعة الموافق 14 مارس مع توزيع بروشور الحملة لكل زائر للحديقة<br />• سلسلة فنادق سفير في مصر قررت وضع بوث للحملة في فنادقها ، كما أبدت رغبتها في التعاون مع الفعاليات المتعلقة بالحملة من خلال تنظيم عدد من الندوات الإرشادية للعاملين بالفندق.<br />• إدارة المركز التجاري الشهير \"فيرست مول\" fourseason بالقاهرة قررت وضع بوث للحملة على مدخل المركز طوال فترة الحملة<br />فنانين<br />• الفنان الكوميدي الشهير محمد هنيدي أعلن عن انضمامه للحملة واستعداده لحضور عدد من الفعاليات المختلفة للحديث عن الحملة و الترويج لها.<br />• الفنانة أنغام قررت المشاركة في الحملة بأغنية يتم كتابتها خصيصاً لمخاطبة البنات المدمنات و أمهات المدمنين.<br />• الفنان عمرو مصطفى تبرع بتلحين وغناء الأغنية الرسمية للحملة.<br />• الفنان شعبان عبد الرحيم قام باعداد وغناء أغنية فيديو كليب عن خطورة المخدرات.<br />أشخاص قاموا باعمال مميزة رغم أنها بسيطة<br />• د/مسعد عرابي مدير مستشفى الحلمية بأبو حماد، قرر هو وزوجته وابنته 10 سنوات أن يتحركوا سويا كاسرة مع الحملة وقد قاموا سويا بوضع 1000 استكير في جميع انحاء ابو حماد خلال اسبوع الماضي.<br />• اتصال جاء على الكول سنتر من بنت 11 سنة أنا طالبة إعدادي في مدرسة مصرية شهيرة ولدي مشكلة أن الأولاد في الفصل معانا بيخرجوا برة المدرسة في الفسحة بيشربوا بانجو ويرجعوا تاني، ماذا افعل لاكون ايجابية أمام هذا الوضع.<br />• طفل عمره سبع سنوات أرسل رسالة إلى عمرو خالد أخبره من خلالها أنه قام بطبع الاستيكر من مصروفه ، وسأله إن كان بذلك شارك في الحملة أم لا، كما فوجئ الأستاذ عمرو خالد بأطفال 11 سنة من أعضاء نادي الصيد المصري ويرتدون كابات وتي شيرات عليها شعار الحملة وبسؤالهم تبين أن كل الفصل جمع من المصروف وقرروا أن نشاطهم أنهم سيطبعوا لكل الفصول هذه الكابات والتشيرتات.<br />قصص مؤثرة وصلت عن طريق الكول سنتر الخاص بالحملة<br />• تلقى الاستاذ عمرو خالد هذا الاتصال الهاتفي \" أنا حسام 29 سنة من السويس ، أنا تاجر مخدرات (أنا دخلي من هذه التجارة يصل إلي 50 و60 الف جنيه شهريا)، أنا سمعت الحملة وشفت شباب بيضع استكير في الحي.. لقد استيقظ ضميري ، أنا بموت ناس .. من قتل نفسا، خايف اتوب لان علي ضغوط من التجار الكبار .<br />• اتصلت فتاة عمرها حوالى 25 عام وقالت انها تريد احضار زوج صديقتها الحميمة لأن صديقتها ادمنت وتعالج الان فى احد المصحات العلاجية على نفقة سيدة كريمة تبنت حالتها وكان سبب ادمانها ان زوجها مدمن ويحضر المخدرات فى البيت ولكن الزوج مازال لا يلقى اى علاج وحالته تسوء تكلمت معاه هي بعد الحملة واقنعته ان تحضره الينا للعلاج قالت بالنص ارجوكم ساعدونى حتى لا يضيع الاب كما ضاعت الام.<br />• بنت غير متزوجة تعيش فى الارياف فى بيت العائلة ابوها واخوها وعمها مدمنين ولا تعرف ماذا تعمل لأنقاذهم تطلب منا التدخل ولا تستطيع اقناعهم او حتى الكلام معهم فى العلاج ولكنها تبكى ليل نهار لما هم فيـه.<br />• اتصل رجل من السويس قال انه على بعد مسافة من القاهرة ويرغب فى الحضور لنا للعلاج ولما ابلغناه انه لازم موعد سابق قفل السكة ثم اتصل بعد ساعة قال انا على مدخل القاهرة هاجى واعملوا فيه اللى تعملوه انا مدمن ومش عارف اروح فين.<br />• شاب عمره 36 سنة اتصل يطلب العلاج وهو لا يستطيع الكلام بوضوح ولكنه مضطرب ويتكلم بطريقة تقطر صدقاً . انا حلاق عايز اتعالج عندى ولد وبنت مش عايزهم يشوفونى كده ساعدونى ارجوكم.<br />• اتصلت واحدة معاقة من الاسكندرية تقول انى اعيش حياة بلا هدف ودلوقتى عايزة يبقى لية هدف اشركونى معكم انا ممكن اعمل اى حاجة وانا فى عجزى نفسى اشعر ان لى فائدة.<br />• واحدة والدتها عندها جلطة فى المخ وفى المستشفى طلبت اى اوراق او بيانات او شيء ممكن تعمله وهى فى المستشفى بجانب والدتها لعل هذا يكون سببا ان شفي الله الوالدة.<br />• اتصلت فتاة اسمها رشا بركات : ينفع أعمل معكم بنية أن يصل ثواب ما افعل لوالدي الذي توفى الشهر الماضي وبنية أن ربنا يحمي أولادي لما يكبروا ثم قالت اليست هذه النية هي معنى حديث النبي \"صناع المعروف تقئ مصارع السوء\".<br />• ام اتصلت تقول عايزة اشتغل معاكم مستعدة اعمل 24 ساعة انا مرعوبة ان ابني يدخل الدائرة دي ويمكن عملي في هذا الاتجاه يبقى سبب يعصم به ربنا ابني من اصحاب السوء الحلقة قطعت قلبي وحسستني المخدرات مش بعيدة عن أي حد، كل اولادنا كلهم معرضين لها.<br />• بنت عمرها 19 سنه ادمنت وهي تقوم بتوزيع المخدرات ولكن احدى قريبات امها لاحظت عليها التغيرات فقررت ان تحاول معها حل المشكله لعلها تعاني من مشكله عاطفية ولكنها صدمت عندما علمت انها ادمنت وعندما سمعت عن حمله حماية اتصلت السيدة بنا وحضرت مع البنت لمركز الكول سنتر وطلبت ادخال البنت فورا لان البنت قضت يوم كامل مانعة المخدر محاوبة منها التخلص من الادمان ولكنها بدات تشعر بالارهاق الشديد والحمد لله رغم ضيق حالتهم المادية استطاع مركز الاستقبال تدبير مكان لها في احدى دور العلاج وبمساهمة مادية من الدار ايضا.<br />فابشروا ازدادوا أملا وعملا"
