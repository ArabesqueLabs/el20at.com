subject = "يحرق أبو كده"
author = "واحد معدي"
posted = "2008-06-15"
text = "يحرق أبو ده فهم للدين يا أخي<br />ربنا يتوب على الامة من الناس دي<br />على فكرة الانحراف أقل خطرا على المجتمع من التشدد<br />والكبت يولد الانفجار بينما التسيب يولد الانهيار<br />خير الأمور الوسط يا جماعة"
