text = "فى الحقيقة هما ما يقدروش يخلو الجعانين هما اللى يمشو لانهم بالطريقة دى ها يوقفو كل شئ لان الجعانين لو قررو يمشو زيهم كده يبقى هلدوسو عليهم والدنيا بتاعتهم تقف كتير أوى لان الجعانين بجد كتير أوى"
