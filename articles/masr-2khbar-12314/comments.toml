author = "امشى معانا"
posted = "2009-06-09"
text = "امشى معانا نقضى على الجوع<br />ازاى<br />ازاى<br />المشى هيعمل رغيف عيش<br />هو الموضوع دة حلقة من بتاع الخواجا بيجو وابو لمعة المصرى<br />ازاى نقضى على الجوع بالمشى<br />صحيح المشى يقضى على الامساك ويساعد على الهضم انما ما يعملش رغيف عيش<br />يا ريت كانوا اتبرعوا بفلوس لعمل مصنع مكرونة للجياع او شراء كم طن ارز وكم شوال بطاطس<br />انما نمشى علشان الغلابة يشبعوا<br />طيب انا عندى اقتراح - بدل مسير الجوع - نخليها ننام تعسيلة الضهر من اجل الجياع<br />يا اخى قحة"
