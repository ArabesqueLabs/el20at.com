subject = "اتذكرها"
posted = "2007-02-26"
text = "أتذكر تلك اللحظة . عندما أشعر بضئالتى في الكون و كيف أن الله كرمنى و خلق كل ذلك من أجلى و خلقنى من أجل عبادته و لكنى أعصاه لان نفسي ضعيفة.<br />أتذكرها أيضا عندما أذكر القبر و وحشته و ظلمته و كيف سيكون حالى فيه .<br />أتذكرها أيضا عندما أشعر اننى في هذه الدنيا ضعيفة ضعيفة ليس لي إلا الله وحده و هو الرحيم الودود و لكنى أعصاه فتنزل تلك الدموع لعلها تكون شفيعي عند ربي الجبار فيغفر لي برحمته .<br />اللهم ارزقنا دموعا هطالة من خشيتك و ادخلنا الفردوس الأعلى يا رب العالمين ."
