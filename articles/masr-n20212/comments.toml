order = 0
subject = "طيب والستات المفتريات اللى بيقطعوا الرجالة فى اكياس زبالة"
author = "مضروب وحياة قلبك مضروب"
text = "وحياتك مراتى بتضرب بالروسية ولا سيد ابو الروس فى فيلم زقاق المدق<br />ومرة ايام الخطوبة ولد من الشارع عاكسها فخبطتة روسية اغمى علية بعدها وتمدد على الارض بطولة<br />يومها قلت دى بنت جدعة واهو الواحد ياخدها دفاع وحماية<br />صحيح هى جدعة قوى وعمرها ماجربت تضرب روسية جوة البيت وبتطبخ ملوخية بالارانب مظبوطة قوى<br />هى فيها شبة من البنت ليفنى وزيرة خارجية اسرائيل -- علشان كدة بتاعنا اخر نظافة والعبد للة علية كل الغسيل فى المطبخ وهى بتذاكر للعيال<br />ستات بتنضرب مين يا عم<br />ربنا يقينا شرهم"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003118/http://masr.20at.com:80/newArticle.php?sid=20212"
