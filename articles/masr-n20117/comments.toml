subject = "بكرة ستعلن محكمة الجنايات الدولية القبض على اللواء"
author = "ابو سعد"
posted = "2009-03-03"
text = "اظن انظمة حكم العقيد واللواءات والبكباشى والشاويشية ستنقرض<br />واحد لواء شغلتة صفا وانتباة وللخلف در ومعتدل مارش مالة ومال حكم بلد<br />هى البلد دى معسكر كشافة والا مركز رياضى فى كوم اوشيم<br />البشير عمل اية فى السودان غير انة خربة ودمرة وكسرة وفتتة اجزاء<br />لازم يتحاكم كل العسكر اللى اغتصبوا السلطة<br />بص على الخريطة تلاقى اوسخ منطقة فى العالم هى المنطقة اللى بيحكمها العسكر العرب - كلها عشوائيات وزبالة وبطالة"
