subject = "احمد الهواري مؤسس تيت راديو صوت الجالية المصرية في"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-02-27"
text = "تـــيــــت راديــــو Teet radio.. صوت الجالية المصرية فى مصر! - 14-04-2008, 11:33 PM<br />أهلا<br />حد هنا يعرف إذاعة تيت راديو؟<br />للى لسه ميعرفش يبقى هيتعرف عليها دلوقتى<br />عندما يتحدث مذيعو تيت راديو عن أنفسهم:<br />تيت راديو الوكيل الرسمي المعتمد لكسر القواعد أيا كانت وأيا كان أصحابها ..<br />تيت راديو ثورة متصلة وجهاد ومرابطة وكفاح اتباعت فيه موبايلاتنا واشتغلنا فيه نقاشين ونجارين وسباكين لحد ما أسسنا مكاننا بإيدينا ..<br />وخلص أبو تهريج وبدأ أبو جد .. أو هايبدأ لحظة ميلاد السنة الجديدة ..<br />من هنا ورايح صوتنا من دماغنا ومن دماغكم .. ومن قلوبنا من قلوبكم ..<br />هتلاقونا في كل حتة وفي كل وقت وكل مكان ..<br />هاتلاقونا في كيزان الدرة المشوي اللي بتشتروها لحبيباتكم على الكورنيش ..<br />وهاتلاقونا في كراسي الأتوبيس المكسرة ..<br />وهاتلاقونا على عربيات الفول وعلى عربيات الكبدة وعلى قهاوي وسط البلد وأطرافها ..<br />واحترسوا تحت الكباري في الحتة الضلمة لأننا هانكون هناك برضه ..<br />احنا الطوفان اللي جاي يكسح قدامه كل أصنام الإذاعة الباردة واللي مافيهاش روح والتي لا تنفع ولا تضر..<br />احنا الصداع القادم في رأس كل رخم وفاسد ومدعي وفاكس ..<br />احنا الجالية المصرية في مصر .. بنعلن استعادة السيطرة<br />واللي خايف ياخد جنب<br />كانت بداية معرفتى بيهم هيا المجموهة الرهييييييبة دى .. لازم تسمعوهم على ضمانتى:<br />لازم يتسمعو بالترتيب ده عشان مرتبطين ببعض<br />ابراهيـــم<br />مصر - بلبيس<br />البداية: 337 جنيه<br />الهبرة: 3 مليون جنيه<br />( إزاى أبقى غنى وبسرعة ومن غير ما استنى ولا فرص ولا أكون نفسى ولا أكافح ولا الكلام الفاضى ده كله)<br />عــــلاء<br />مصر - كرواتيا<br />البداية: 3 مليون جنية<br />الهبرة: 204 مليون وكسور<br />( فيه جيل جديد من المغفلين طلع لجيل جديد من النصابين عشان يشتغل عليهم .. ربنا مبيسيبش حد ينام من غير عشا .. وعشا حلو كمان)<br />دريــنــى<br />مصر - جامعة الدول<br />البداية: 204 مليون وكسور<br />الهبرة: لا تسألوا عن أشياء إن تُبد لكم تسؤكم<br />( الحمد لله .. ربنا أخد منى كل حاجة .. بس لسه الجبنة البراميلى فاضلالى )<br />هـــوارى<br />مصر - سفنكس<br />البداية: على باب الله<br />الهبرة: 45 مليون جنيه<br />( إحنا كنا عارفين إننا مش هنلم فلوس كتير م الشعب .. بس قلنا اللى ييجى منه أحسن منه )<br />فـــؤاد<br />مصر - أمريكا<br />البداية: 45 مليون جنيه<br />الهبرة: 10 مليار جنيه<br />(هوارى ادانى 45 مليون جنيه عُمى .. رغم ان المبلغ كان صغير اوى إلا إن أنا قدرت أستثمر فيه)<br />حـــربـــيــة<br />مصر - سويسرا<br />البداية:10مليار<br />الهبرة الشريفة: 10مليار<br />(أنا مش هغير عادات الشعب المصرى .. هو كده كويس .. أنا هغير عادات الشعب السويسرى)<br />إنجوى<br />www.teetradio.com"
archived = "2010-03-14"
capture_url = ""

