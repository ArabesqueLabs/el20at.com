[[comments]]
order = 10
subject = "مشاكل شعب مصر واللي المفترض انهم يحلوها"
author = "مش لازم"
posted = "2009-02-27"
text = "طبعا الشعب المصري عنده مشاكل<br />وهناك مهن خصصت لحل هذه المشاكل<br />فاصحاب هذه المهم اصلا عندهم مشاكل<br />فاستغلوا مهنهم لحل مشاكلهم على حساب الشعب<br />زي مثلا المحامي المفروض المحامي دا بيحل مشاكل الشعب المصري وبيساعد اي حد حقوقه ضايعة<br />اصبح المحامي بيضيع الحقوق من اجل حل مشاكله<br />الطبيب المفروض انه بيساعد الشعب المصري في حل مشاكله الصحية وعلشان خاطر الناس بتتسابق على كلية الطب لحل مشاكلهم فنسيوا وظيفتهم الاساسية وحلوا مشاكلهم على حساب الشعب يعني واحد رايح يعمل عملية بيخرج من غير كلية بفضل الاطباء<br />الصحفي المفروض انه بيساعد الشعب في عرض مشاكله اعلاميا لكن للاسف بيستغل المشاكل في عمل مواضيع يكسب منها فلوس<br />المدرس المفروض انه بيحل مشكلة الجهل ووظيفته الاساسية هو تعليم<br />ولكن علشان خاطر عنده مشاكل بيستغل الطلبة في الدروس الخصوصية والثراء السريع<br />وقس على ذلك كل المهم في مصر<br />الشعب المصري وقع ضحية استغلال اصحاب المهم التي هي اصلا المفروض ان اصحابها يحلوا مشاكل<br />كله عايز ينهب الشعب المصري ويدوس عليه ويطلع لفوق"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = "اتصل بينا على اي رقم يبدأ 0900 علشان نسرقك يا شعب"
author = "مش ضروري"
posted = "2009-02-27"
text = "يظهر ان اللي اختشوا ماتو في القنوات الفضائية الفاشلة كلها اعلانات عن خدمات على ارقام تبدأ 0900 واذا كان عندك موبايل يبقى رقم 1771 ومش عارف ايه<br />يلا يا شعب اتصل بينا وحياتك<br />نفسنا نسرقك يا شعب<br />طول عمرك كريم يا شعب مصر انت اللي خليت عادل امام غني وسعاد حسني ومحمود الخطيب وابو تريكا وانت اللي سكنتهم في الزمالك يا شعب<br />يلا يا شعب اتصل بالرقم باه ما تبخلش علينا بمكالمه بسيطة بكام جنيه<br />يلا يا شعب اتصل نفسنا نسرقك يا شعب<br />نفسنا نبقى اغنهيا يا شعب وكل واحد في الحرامية اللي ماسكين القناه يعملوا كامل مليون يا شعب<br />دي سرقة علني والمفروض الحكومة والشرطة المصرية تحمي الشعب من السرقة العلني في القنوات الفضائية<br />لكن يظهر ان الكبار عاملين فرده وليهم نسبة<br />ونوجه نداء للشعب المصري بانه يتجاهل ولاد الوسخة الحرامية دول<br />والله وانا بكتب التعليق فوجئت على قناة فضائية اعلان بيقول للشعب المسكين<br />اتصل على رقم 0900490 علشان خاطر حتكسب شقه والحق الحق السحب يوم 15 مارس على شقة تمليك<br />اتفضلوا بيبيعوا الوهم للشعب المنكوب بدل ما القنوات الفضائية تعلم الشعب ازاي يحل مشاكله بيبيعوا الوهم للشعب<br />اصحا يا شعب تجاهلوا هذه الارقام يا شعب<br />كفاية بقا يا شعب عادل امام وابو تريكا وهنيدي كفاية بقا يا شعب تدلي فلوسك للكلاب دول<br />سلام يا شعب"
archived = "2010-03-14"
capture_url = ""

