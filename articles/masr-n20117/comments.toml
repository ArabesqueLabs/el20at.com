subject = "هاواااااااري على طول"
author = "واحد مضبون من الكلب الهواري"
text = "احلى حاجة فى الحوارى أو الهوارى أنه بيضان ، عنده قدرة رهيبة على أنه يبضنك فى أي وقت وفي أى مكان .... فعلا بيضان بيضان يا هواري ... هو الصحافة اتبضنت من شوية ... هاااااااااااواى على طول ... بيضناوى على طول"
archived = "2009-02-26"
