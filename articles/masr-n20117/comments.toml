[[comments]]
order = 0
subject = "فى النهاية - الفيل لازم ياكل - ولكن ازاى"
author = "واحد من البلد دى"
posted = "2009-02-25"
text = "اتعلمنا من الزملاء الهنود فى الشركات فى الخليج ان الحالة للشعب المصرى وصلت مع غالبيتة العظمى فى الجملة الهندية الشهيرة from hand to mouse اى بالبلدى كدة يادوب الفلوس اللى بتيجى فى الايدى بتروح على الاكل او بالمصرى من ايدة لبقة ومفيش توفير ولا مليم وبالعافية تحمية من الجوع<br />وجهاز الدولة الامنى تضخم جدا اصبح مثل الفيل - مليون عسكرى امن مركزى ومباحث امن دولة وسجون ومعتقلات وشرطة بالملابس المدنية وكل وزير بيتحرك بقافلة من السيارات والحراسات - جهاز ضخم جدا عايز مصاريف ومرتبات وبدلات واكل وشرب وبنزين وتنقلات وملابس - فيل كبير قوى - عايز لة فدان برسيم علشان ياكل ويكفية<br />الدولة تعمل اية<br />الخزينة العامة كانت لها عائد من مصانع الكاكولا والبيبسى ومصانع الاسمنت وبيع القطن وقطاع طويل عريض اسمة القطاع العام كان بيتحمل مصاريفها - الدولة باعتة بابخس الاسعار لاجانب وعرب ويهود<br />طيب الفيل عايز ياكل<br />يطلع بطرس غالى يقول لك اة لازم الناس تدفع ضرايب علشان نجيب اكل للفيل - وابتدأ بضريبة المبيعات وبعدين عايز يعمل ضرايب على الصيادلة وقانون المرور الجديد هدفة الجباية وجمع فلوس للخزينة ووزارة العدل عملت قانون والمحامين عملوا اضراب والمدرسين عملوا اضراب واساتذة الجامعة عملوا اضراب وكل الناس مشتبكة مع الحكومة<br />والناس مش هتدفع وهتعمل اضراب لانة ببساطة لا يوجد عندهم فلوس ليدفعوها ومصر ليست امريكا والناس كما يقول الهنود from hand to mouse<br />والحكومة عايزة فلوس والناس مفيش<br />يبقى الاضرابات هتستمر<br />واظن الخراب قادم<br />فلا المنح من السعودية ولا الامارات كافية ومنح امريكا مشروطة بايمن نور والمعتقلين والاخوان<br />يعنى وضع منيل<br />وهنقعد فى الهم دة على طول<br />لغاية ما الفرج ييجى من عند ربنا"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203617/http://masr.20at.com:80/newArticle.php?sid=20117"

