subject = "جريدة نشرت ان دولة قطر دفعت 120 دولار لشراء 120 جرار قطار للسكك الحديد المصرية من شركة جنرال اليكتريك"
text = "يعنى بنشحت من قطر كمان<br />ومفيش تكذيب من الحكومة<br />طيب دخل البلد بيروح فين - لما الامارات بتبنى لنا مدن سكنية والسعودية والكويت طرق<br />مين اللى بيحاسب الناس دى"
