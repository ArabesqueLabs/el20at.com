[[comments]]
order = 2
subject = "حريمي ولا رجالي"
author = "داليا"
text = "أيوه ساعات كتيير كنت بصور من أمام عربية السيدات علشان يدوب ألحق اركب المترو أمال حركب ازاي ونصف رجال مصر بيركبوا المترو ومش مخلين حته فاضية في العربات التانية وبعدين أبو يوسف مضايق ليه ان يكون هناك مصور حريمي يعني هو فيه فرق كتير عن المصور الرجالي"
archived = "2008-06-27"
capture_url = "https://web.archive.org/web/20080627130850/http://masr.20at.com:80/newArticle.php?sid=16395"
