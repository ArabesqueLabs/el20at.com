text = "السلام عليكم ورحمة الله وبركاتة<br />اولا انا بشكر كل اهل القرية علشان عرفت ان كل المعمول دة بالمجهود الذاتى من العيلة الى متسمية البلد على اسمها ومن اهل القرية الموجودين فيها كلهم<br />انا سمعت عن جمال القرية دة كذا مرة واخر مرة لما كان رئيس الوزراء كان جاى فى زيارة لى القرية بصراحة كان نفسى ابقى من القرية دى الى الوزرا بينزلوها والمحافظين<br />انا اتمنى بجد انى اعيش فيها انا فعلا نزلت كنت رايحة اسكندرية ومشيت مخصوص من على الطريق الزراعى علشان اعدى على القرية ودخلتها ويرتنى مدخلتها علشان ندمت انى مش منها بجد انا اصلا من القاهرة واتمنى بجد ان اى حد يستضفنى عندو بس ولو ساعة بس اقعد فى البلد دى شوية بس بجد اجمل من القاهرة نفسها واهدى وجو فظيع فظيع اتمنلكم المزيد"
