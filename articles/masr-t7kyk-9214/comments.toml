text = "بالفعل قريه نموذجيه بمعنى الكلمه ويرعاها مجموعه عمل متميزه لايتوانى جهدا اى منهم فى رفع قيمه القريه<br />ولكن للاسف من يحاول النيل من جمالها ورقتها ومتعتها<br />هم للأسف ساكنيها<br />بما تحويه الكلمه<br />لا مبالاه<br />لا يعرفون قيمه الجمال الذى بين إيديهم<br />فمن تحت تحت الصفر والظلام الدامس والقازورات<br />الى منتجع صيفى لايحلم به الصغير قبل الكبير<br />ولكن<br />عذراً أنت فى المنوفيه<br />ههههههههههههههه<br />إبتسم"
