author = "فتحى عبدالمحسن وهب"
posted = "2009-06-25"
text = "لو نظرت الى هذا الجمال الظاهرى فابحث عن شخصية صاحب هذا الجمال حيث ان هذه الشخصية يجب ان تدرس للاجيال للوقوف على معنى الجمال الحقيقى حيث ان الجمال ليس بالظاهر ولكن الجمال ان تعرف من هو وراء هذا الجمال .... هل عرفت من هو صاحب هذه الشخصية ؟؟؟؟ نعم انه معروف للجميع ولكن لا نملك الا ان نقدم اليه كل فرائض الحب والولاء ويترجم الحب والولاء بالوقوف الى جانب هذه الشخصية الفريدة بالعطاء والجهد وبذل المال والجهد دون طلب شكر او تقدير ولذا ادعو شباب وشيوخ وابناء هذه القرية ان تتكاتف دائما للمحافظة على هذا الجمال وهذا اقل شئ نقدمه الى صاحب هذه الشخصية . انه هو ساقدم اعتذارى اولا له شخصيا لانى سوف سافصح عن هذه الشخصية واعلم انه غير متفق معى على ذكر اسمه ولكن حبى وتقديرى له ارغمنى على ذكر اسمه انه الاخ والاب الروحى لهه القرية انه الاستاذ الدكتور مجدى عبدالمقصود ارجو ان يقبل اعتذارى لذكرى اسمه ولكن هل جزاء الاحسن الا الاحسان فله منى بعدد الاشجار والزهور وكل لمبة مضيئة وطريق نظيف فله منى اسمى ايات الحب والاحترام وان يكون ذلك فى ميزان حسناته . واخيرا وليس باخرا فانى اعجز ان اوفيك حقك علينا الى ان نلتقى"
archived = "2010-03-14"
