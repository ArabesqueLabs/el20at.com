subject = "ما شاء اللة قرى المنوفية  شوارعها مرصوفة بينما مدن"
author = "ابو خشم"
posted = "2008-05-30"
text = "دى تمييز عنصرى<br />مدن اسنا وديروط وابوتشت والبدارى ومركز صدفا والبلينا نصف شوارعها ترابية وهنا حتة كفر مجرد كفر مش نجع شوارعة مسفلتة وفية زهور وورود واشجار وفلوس بتنصرف علية من الضرايب اللى بيدفعها الصعايدة<br />شوف يابوى انت وهو<br />احنا عايزين نستقل بالصعيد<br />ننفصل عن المنايفة وبلاويهم والبجر اللى بييجى من عندهم<br />لما يبقى فية عدل يبقى ماشى<br />كل واحد يدور على مصلحتة<br />احنا عايزين الاستقلال"
