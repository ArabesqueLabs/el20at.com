text = "النملة قالت للفيل : قم دلكني<br />ومقابل ذلك ضحكني<br />وإذا لم أضحك عوضني<br />بالتقبيل والتمويل<br />وإذا لم أقنع..قدم لي<br />كل صباح ألف قتيل<br />ضحك الفيل بسخرية<br />فشاطت غضبا<br />تسخر مني يا برميل<br />ما المضحك فيما قد قيل<br />غيري أصغر<br />لكن طلبت أكثر مني<br />غيرك أكبر<br />لكن لبى وهو ذليل<br />و هذا لدليل<br />أكبر منك بـــــــــــــــــــــــــــــــــــــــــــلاد<br />العــــــــــــــــــــــرب<br />وأصغر مني إسرائيل<br />منقول<br />[/frame]"
