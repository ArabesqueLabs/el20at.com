text = "ايوه اتجوزه ما اتجوزوش ليه مش راجل وفيه عضو ذكري يبقى خلاص ما اتجوزوش ليه<br />واتجوزك انت كمان يا محمد سيد احمد وحصرف عليك كمان<br />اديني اميلك ياض انا بت كسيبه بكسب اد كده في اليوم<br />مش صايعه زيك باخد في المقال 50 جنيه<br />هات اميلك يا محمد سيد احمد خلينا نتعرف على بعض"
