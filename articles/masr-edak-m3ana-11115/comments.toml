text = "ايه ياض يا محمد سيد احمد عملتلي فيها ميت يا روح امك<br />حجوزك يعني حجوزك<br />حتروح مني فين يا روح امك<br />يلا هات اميلك ولا رقم موبايلك<br />لا موبايل ايه<br />هات اميلك بس انت مسكين وغلبان وبتاخد في المقال 50 جنيه بتصرفهم على السجاير<br />متخفش ياض انا بت كسيبه وحصرف عليك وعلى عيلتك كلها ياض<br />هات اميلك بالذوق<br />وخلي بالك انا مش حسيبك الا بعد ما تدبح الخروف"
