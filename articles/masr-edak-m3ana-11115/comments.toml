[[comments]]
order = 2
subject = "وفاة الكاتب المصري محمد سيد أحمد"
author = "اكتب اسمك هنا"
posted = "2009-02-08"
text = "18/02/2006 20:33<br />عرب48<br />توفي في القاهرة، اليوم السبت، الكاتب المصري البارز محمد سيد أحمد عن 80 عاما نتيجة أزمة قلبية.<br />وتخرج أحمد في كلية الحقوق بجامعة القاهرة عام 1944 وانتسب في الاربعينيات الى إحدى المنظمات الشيوعية وفي الخمسينيات انضم الى الحزب الشيوعي المصري وكان من بين الذين اعتقلوا عام 1959.<br />وكان الراحل يكتب مقالا أسبوعيا بانتظام في صحيفتي الاهرام القومية والاهالي التي يصدرها حزب التجمع اليساري. كما كان عضوا مؤسسا بالمجلس المصري للشؤون الخارجية وهو هيئة أهلية مستقلة تعنى ببحث القضايا الخارجية ذات الصلة المباشرة أو غير المباشرة بالمصالح المصرية.<br />وللراحل مؤلفات منها (بعد أن تسكت المدافع) و(مصر بعد المعاهدة) في إشارة الى معاهدة كامب ديفيد بين مصر واسرائيل عام 1979. كما شارك مع اخرين في كتب منها (ثورة 23 يوليو 1952. دراسات فى الحقبة الناصرية)."
archived = "2010-03-14"
capture_url = ""

