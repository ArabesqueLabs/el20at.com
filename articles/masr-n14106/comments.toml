[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "مي"
posted = "2008-06-17"
text = "بصراحة أنت شخصية حقودة جدا هذه الاجهزة التي اخترعها هذا الشاب لا يوجد مثلها والا لما أخذ عليها الجائزة ثم ان اي فكرة تنتج لتصبح في متناول اليد وبسعر معقول تسمى اختراع اما التصميم فهو يعني اول مراحل الانتاج ياجاهل فلا نطلق كلمة تصميم على جهاز نمتلكه بأيدينا ونضع له سعرا في السوق ... اذا تكلمت فتكلم بعقل ولا تذكر أهل الكهف في مقالاتك لانهم أفضل منك كثيرا .... اما ان كنت تقصد العصر القديم فارى أنك منهم وعلى درجة كبيرة من التخلف والحقد والغل ... ان الله يخرج من النار من كان قلبه فيه مثقال ذرة من ايمان وذرة من رحمة .... يجب عليك ان تفتخر ولو بمقدار ذرة أيضا .... حفظ الله الناس منك ان كنت في منصب وحفظ الله اولادك منك ان كان لديك ولد .... ورحمنا الله جميعا من أمثالك ."
archived = "2010-03-14"
capture_url = ""

