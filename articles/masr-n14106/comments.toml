[[comments]]
order = 0
subject = "مخترعون جهلاء"
author = "مش عارف"
text = "زمن الاختراعات انتهى من زمان من ايام اختراع ماكينة الديزل ومحرك البنزين والالات البخارية<br />انتهت الاختراعات والاكتشافات<br />لا يمكن ان يقال ان مهندسا معماريا اخترع عمارة او سوقا بل يقال صمم عمارة وصمم بناية<br />وكذلك فى الاجهزة والالات فيقال فلانا صمم جهازا لقياس نبضات القلب او لقياس سرعة الريح او الكشف عن الكذب<br />او صمم وبنى رادارا جديدا يكشف الطائرات من الف كيلومتر<br />ثم ان التصميم الجديد والافكار المبتكرة لا تاتى من طفل لا يعرف اساسيات العلوم او الفيزياء او الهندسة<br />فالمصمم يكون عالما تطبيقيا وهناك فى اسرائيل فقط وهو المعهد الوحيد فى الشرق الاوسط معهد فى حيفا اسمة معهد الهندسة التطبيقية ولا يوجد لة مثيل فى اى دولة عربية<br />انما خزعبلات ولد بشخة اخترع مش عارف اية فدى نكتة يضحك الاختصاصيون كثيرا عند سماعها<br />اما انصاف الجهلاء علميا فيصدقونهم<br />والا يمكن هيخترعوا الكهرباء تانى<br />اصحوا يا اهل الكهف"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043958/http://masr.20at.com:80/newArticle.php?sid=14106"

