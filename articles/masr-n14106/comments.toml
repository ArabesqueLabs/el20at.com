subject = "محمد"
author = "محمد"
text = "طب يا اخي انتا متغاظ ليه لو ما تقدرش تعمل زيهم يبقي تحط لسانك في بقك و تسكت خالص و كما قال الشاعر :<br />اقلوا عليهم لا ابا لابيكم من اللوم او سدوا المكان الذي سدوا"
