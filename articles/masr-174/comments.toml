text = "الا ول ندخل المسجد كلنا ونعرف اللى لينا واللى علينا بعدكده ندخل الكنيسة يعنى ياريت احنا وهما نكون مع بعض فى الا لتزام بالاداب<br />وثانيا ربنا بيقول فى القران ان المساجد لله فلا تدعوا مع الله احدا<br />والرسول بيقول عليه الصلاة والسلام ان الملائكة لا تدخل بيتا فيها صورة واظن جدران الكنائس كلها صورلدوات الارواح<br />ياريت ندخل المسجد الا ول<br />ويارت الاخوة النصارى يعملوا بتعاليم الانجيلahmed9293@hotmail.com"
