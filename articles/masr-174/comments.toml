[[comments]]
order = 34
subject = "انتبهواايهاالمصريين"
author = "مصرية"
posted = "2006-05-06"
text = "فى الواقع الموضوع اكبر من الهلال والصليب الموضوع هووضع بذور فتنة طائفية قى مصر انها احدى الحلقات فى سلسلة المخطط الصهيونى المدروس لغزو الوطن العربى عن طريق اضعافه وتفتيت نسيج كل دوله فيه على حده كما يحدث الآن فى العراق عدد من سقطوا نتيجة هذا الصراع اكثر ممن سقطوا نتيجة الاحتلال الذى يقوم بدور المتفرج على تحقيق اهدافه دون بذل اى مجهود وما يحدث بين الفصائل الفلسطينية الآن جزء آخر من هذا المخطط ومن قبلها سوريا ولبنان والسودان والبقية تاتى فلايجب ان نسمح نحن المصريين بتحقيقهم لهذا الهدف لأن مصر هى الحلم الأول هى ارض الميعاد ولنجعلها ارض الميعاد لهلاكهم وهلاك احلامهم بتماسكنا تعاشنامعا نسيج واحد بحب وود كما كنا دائما فهذه النغمة النشاذ دخيلة علينا من قوى الشر الخارجية وساعدتها قوى داخليه تريد الهاء الشعب بقضايا اخرى غيرالقضايا المصيرية التى تمس مستقبل وحياةالمصريين"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213031/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 35
subject = "نصلي مع بعض؟ يا ساقط العقل و الدين"
author = "مصري أكثر منك"
posted = "2006-05-22"
text = "السلام عليكم و رحمة الله و بركاته<br />كنت أظن دائما ان من يؤذي هذا الدين من اصحاب الأراء و الاقتراحات الفاسدة من الفاسدين و المنحليين اخلاقين أو الكارهيين للاسلام.............<br />يعني من الأخر ساقطين الدين<br />أما ما رايته من اقتراح الصلاة المشتركة<br />ان قد يكون ايضا ساقط العقل أحمق<br />و لا حول و لاقوة الا بالله<br />و اخيرا اسال صاحب أو صاحبة هذا الاقتراح<br />\" انت متربي فين يا ابني؟؟؟؟؟؟؟؟؟؟؟!!!!!! \""
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213031/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 36
subject = "عشان مصر"
author = "عمرو سميكة"
posted = "2006-05-26"
text = "يااخوانا مصدر جميع الفتن الطائفية فى مصر بعد القضاء على الجماعات الاسلامية بعد عام 1998والتخلص من جذورها فى صعيد مصر هو الحكومة لتثبيت حكم الطؤرىء ولتوريث الحكم لجيمى ولكن التعصب الدينى فى الصعيد معقل الفكر الاسلامى خفت حدتة اما الاسكندرية لايوجد بها تعصب اطلاقا ولكنها فتنة لزوم الشىء والحدق يفهم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

[[comments]]
order = 37
subject = "مصر التى فى خاطرى"
author = "أبو ابراهيم"
posted = "2006-06-25"
text = "أخوتى السلام عليكم ورحمة الله وبركاته :<br />ارجو الانتباه للنقاط التالية:<br />- التركيز على الدين الاسلامى والدفاع عنه بشكل دائم يعطى الإيحاء بأنه دين متهم دائماًوهذا غير صحيح وشواهد تسامحه فى التاريخ وفى الوقت الحالى ونصوص آياته واحاديث نبيه صلى الله عليه وسلم 0لاحصر لها<br />- الباس أى حادث بين مسلم ومسيحى لباس الدين خطأ كبير والتواء غير مبرر فنفس الحادث بنفس ظروفه يمكن ان يتكرر بين مسلم ومسلم ومسيحى ومسيحى.<br />- المسيحيين قدراتهم الاقتصادية فى مصر ومواقعهم المالية تزيد بنسبة كبيرة جدا عن المسلمين وهذاأمر معروف من زمن هناك وتساندهم الكنيسة فى ذلك و مصاعب وغلاء معيشة على المسلمين أكبر بحكم العدد.<br />- شكوى المسيحيين من قلة أو عدم التمثيل السياسى بدعوة اضطهاد الحكومة المصرية(الإسلامية) لهم كلام مرسل غير صحيح لأن الحكومة المصرية تضطهد المسلمين ايضاً والسجون ملاأى حالياً بالمسلمين الذين يريدون حق الإنتخاب وحق ا لترشيح ، ورغم تحكم المسيحيين اقتصاديا فى كثير من الموارد إلاّّ أنهم اساسايحجمون عن المشاركة اسوة بالمسلمين هذا امر ينضم تحت المواطنة وليس بسبب الدين.<br />- انتشار الأصولية المسيحية فى العالم الغربى وخاصة امريكاوتطبيقاتها الغازية والظالمةلدول العالم الإسلامى تحت مسميات زائفة كنشر الحرية والديموقراطية أغرى رؤوس المسيحية فى مصر بالتطلع لكسب سلطةاضافيةعلى المسلمين المنتزعة سلطاتهم أصلا واصابهم بحساسية زائدة وفائقة تجاه أى تصور اسلامى جديد يطرح على الساحة والمبادرة بالهجوم عليه بالطريقة الامريكية المعتادة وهل ننسى هجوم امريكا على حكومة حماس المنتخبة ديموقراطيا وعلى انتخاب نواب الأخوان فى البرلمان المصرى.<br />واخيراً لى رجائين عند الجانب المسلم والجانب المسيحى ؟<br />أما الجانب المسلم فأقول لكل اخوتى<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

[[comments]]
order = 38
subject = "لاتعارض"
author = "ابو اسامة"
posted = "2006-07-13"
text = "مع احترامى لكل الأخوة الى علقوا على الموضوع لكن يجب ان يعرفوا انه لايوجد اى تعارض بين حديث صحيح ونص قرأنى اى عندما يقول السول عليه الصلاة والسلام(من أذى<br />زميا فانا خصيمه الى يوم القيامة)<br />فهذا يدل على ان الله سبحانه عندما يذكر<br />النصارى او اليهود فى اياته فهو ادرى بهم<br />وهو الذى يحاسبهم وليس لنا ان نحاسب احدا<br />فالله سبحانه هو الموكل بحساب الخلائق فلا<br />تنصبوا انفسكم الهة وتفتون بغير علم<br />وليس منا احديستطيع يدعى انه سيدخل الجنة<br />او يدعى على احد انه سيدخل النار فاتقوا<br />الله فيما تقولون واعلمواا انما نبيكم قد جأ رحمة للعالمين فانشروا دينكم بالتسامح والرحمة وامشوا على خطى نبيكم تهتدوا<br />فقد كان يزور جاره اليهودى والذى كان يؤذيه وقد كان ذلك سببا فى اسلامه فهذا<br />ما يريده منكم نبيكم ايها الشباب فهل<br />نبيكم لم يكن يعلم بهذه الأيات<br />انصحكم باتباع سنة نبيكم وعدم الأنجرار ورأ هذا التعصب الأعمى الذى يريده لنا اعدأهذه الأمة لكى تسود الفتنة ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

