order = 0
subject = "أين الخلاف ؟؟"
author = "من السعودية"
posted = "2008-05-23"
text = "من الغريب أن نختلف حتى على أبسط المسلمات ، أولا / بطاقة الأحوال المدنية ضرورية وكان من الواجب على وزارة الداخلية فرضها إلزاميا على المواطنات منذ عقود .<br />ثانيا / ما المانع في دولة غنية كالسعودية أن تبتكر وتمول طريقة لتحفظ للمرأة حقها في إبراز وجهها من عدمه ( بصمة الكترونية ، جراب ، ... ) ولا أعتقد أن الإنسان يعجز عن اختراع مماثل .<br />بالنسبة لي .. أعتقد بوجوب تغطية الوجه فهو أساس الجمال والفتنة ، والمسلمة التي تكشف وجهها وبالذات في السعودية ( كون هذا موضوع النقاش ) هي حرة كون هذا اجتهادها واعتقادها ، ومن أبسط حقوقي ممارسة حريتي في اعتقادي وعدم السماح للرجل الأجنبي الإطلاع على ما ( أعتقد ) أنه عورة – إلا للضرورة - ما الضرر من ذلك ؟<br />لمحبي الجدل والخلاف .. سؤالي : أين الخلاف ؟؟"
archived = "2008-06-22"
capture_url = "https://web.archive.org/web/20080622185224/http://www.harb.20at.com:80/newArticle.php?sid=15930"

