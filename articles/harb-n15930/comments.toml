text = "الان طلعت المرأة بطقة احوال .. وهذا ما تريدونه صحيح ..<br />طيب وش دخلكم تغطي صورتها ولا ماتغطيها . . بطاقتها وهي حره << انتم من يدعو الى حرية المرأة<br />سبحان الله<br />نعم .. هدفكم هو اشباع رغباتكم بنظر الى النساء .. لعنة الله على كل من يدعو الى الفساد"
