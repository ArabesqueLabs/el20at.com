subject = "إلى حضرات الكرادلة النواطير البزابيز العثامين الفزازيز ..خدوا عندكم"
author = "واحد مغفل"
text = "(1) قال الله ( إن الدين عند الله الإسلام) ويقول بيانكم : أن الناس على دين ملوكهم<br />(2) قال الله( ما كان محمد أبا أحد من رجالكم ) ويقول بيانكم : أنكم الوحيدون المتحدثون باسم النبي .<br />(3) قال الله ( {لَا تَجِدُ قَوْماً يُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ يُوَادُّونَ مَنْ حَادَّ اللَّهَ وَرَسُولَهُ وَلَوْ كَانُوا آبَاءهُمْ أَوْ أَبْنَاءهُمْ أَوْ إِخْوَانَهُمْ أَوْ عَشِيرَتَهُمْ) ويقول بيانكم : أن هذا النص موجه لعامة المسلمين وليس للحكام والملوك فهم أحرار يوادون من أرادوا.<br />(4)يقول الله {وَلاَ تَرْكَنُواْ إِلَى الَّذِينَ ظَلَمُواْ فَتَمَسَّكُمُ النَّارُ وَمَا لَكُم مِّن دُونِ اللّهِ مِنْ أَوْلِيَاء ثُمَّ لاَ تُنصَرُونَ }هود113 ويقول بيانكم : نحن لا نركن إلى الذين ظلموا من رعاع الشعب أما الحكام والأمراء فإن ننام في حضنهم ولا نركن إليهم.<br />(5) يقول رسول الله ( لا طاعة لمخلوق في معصية الخالق) وتقولون أنتم طاعة الحاكم واجبة ولو كان ظالما فاسقا معتديا على الحرمات حاملا رعيته على غير منهج الله .<br />(6) يقول الله ورسوله أن الجهاد فرض وفريضة واجبة على كل مسلم ضد من استباع عرض وحرمات وأرض المسلمين . وتقولون أنتم كل واحد يقعد في بيته وياكل عيش بلا جهاد بلا كلام فارغ .<br />يبقى نفهم من ده إييييييه؟؟ طبعا نفهم منه أنكم اشتريتم الدنيا بالآخرة واشتريتم رضا الحاكم اللي بيشخ على روحه برضا ملك الملوك .. ربن يهديكم أو يهدكم ..... هات والنبي كمان بخة برفان .. حط هنا ..أيوه كده ..ياه..روعة"
