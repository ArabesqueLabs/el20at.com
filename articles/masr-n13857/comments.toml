subject = "إلى سمو ومعالي وجلالة شيوخ براميل النفط"
author = "واحد أهبل"
text = "( ما كان محمد أبا أحد من رجالكم ولكن رسول الله) هذا هو الخطاب الرباني الذي يجب أن يعلمه شيوخ البراميل وغيرهم من شيوخ المملكة الخائفين على ملكهم ومليكهم وسمو أمرائهم وجلالة براميلهم وزيتهم فكان اجتماعهم وغضبتهم وبيانهم وتحذيرهم للفئة الضالة المضلة التي خرجت من حظيرتهم ونطحت في (النظام) باعتباره هو (الاسلام) ...<br />أليست النصيحة لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم ؟؟ ستقولون بلى فنقول لكم أنكم عميتم عن النصيحة سوى لعامة المسلمين أما أئمتهم فالدعاء لهم واجب وطاعتهم فرض وإن طغوا وإن بغوا وإن زنوا وإن فسقوا لأن فسقهم حاجة ببلاش كده ما تضرش حد من عامة المسلمين الارهابيين المارقين .....<br />هاتوا لي اجتماع كده للهيئة الموقرة بعد ما أكلوا الكبسة وشربوا البارد من البيبسي واتكرعوا ثم اجتمعوا ونشروا بيان في مجلة البحوث الاسلامية موجه إلى مليكهم خادم الحرمين \" الكونجرس والكنيست\" وملوكهم وحكامهم الذين أضاعوا المقدسات و مكنوا أعداء الاسلام إما بالتواطؤ المباشر أو التغاضي المباشر أو بالأمر المباشر أو بالاشتراء المباشر في هتك عرض أوطانهم واستباحة نسائهم ..ماذا قالت اللجنة الموقرة في مذابح ومآسي وفضائح أبوغريب وجونتانامو والعراق والقدس وغزة وأفغانستان .. ماذا قالت اللجنة في ( الذين يوادون من حاد الله ورسوله) من الخلايجة اللي رقصوا مع بوش السفاح رقصة السيف وأهدوه الأوسمة الملكية وعقدوا معه صفقات بالمليارات لأسلحة تصدأ على رمال الصحراء ..ماذا قالت اللجنة في فضايح سمسرة سمو الأمير في موضوع صفقة أسلحة اليمامة ..ماذا قالت اللجنة في اختصار تاريخ ومجد للاد الحجاز ونجد وشبه الجزيرة وجعل كل رجل فيها منسوبة جنسيته إلى اسم رجل آخر ليس رسول الله ولا أحد من الخلفاء الراشدين بل ( الحاج سعود) وجعل مسجد أرض النبي ووطن النبي ومسجد النبي والنبي نفسه منسوبا إلى (عم سعود)<br />و كبراء المسلمين عند عمك سعود ومنهم هيئة العلماء الموقرة يرفلون في الحرير و يستحمون في برفانات كرستيان أند ديور وتنفق نساؤهم على المكياجات مليارات الدولارات مش الريالات بينما المسلمون في بقاع الأرض كاللقطاء رائحتهم كريهة لا تعتادها أنوف أعضاء اللجنة الموقرة التي تآكلت من الجدري .. المسلمون يقتلهم الفقر وتعوزهم الحاجة ويذلهم المرض ..ولا تتحرك اللجنة الموقرة إلا بهذا البيان الذي في حقيقته هو رسالة من حكام الخلايجة علفى ألسنة شيوخهم موجهة إلى أسياددهم الأمريكان والصهاينة يقسمون لهم فيها بالطلاق بالتلاتة من نسوانهم كل ما يحلوا يحرموا عليهم أنهم برءاء من التفجيرات التي أقضت مضجع الأنذال ...نقول إيه ..لا نامت أعين الشيوخ... هات بقى بخة برفان !!"
