subject = "الله المستعان"
author = "محمود"
text = "يا جماعة<br />يقول الله عز وجل (وَلَوْ أَنَّ أَهْلَ الْقُرَى آمَنُواْ وَاتَّقَواْ لَفَتَحْنَا عَلَيْهِم بَرَكَاتٍ مِّنَ السَّمَاء وَالأَرْضِ وَلَـكِن كَذَّبُواْ فَأَخَذْنَاهُم بِمَا كَانُواْ يَكْسِبُونَ)<br />ما نحن فيه من هم وغم وكرب وبلاء وغلاء ... سببه نحن في المقام الأول ثم حكامنا<br />أقول ذلك وأنا أدعو الله من كل قلبي أن يعجل يهلاكهم وزوال ملكهم فلقد طغوا وبغوا وإستقبلوا قاتل أطفال العراق بالهدايا والفسح المجانية<br />لكنني أود أن ألفت إنتباه الجميع إلى أن الله عز وجل سيغير حالنا فقط لو غيرنا ما بأنفسنا<br />ليراجع كل منا نفسه ... أين ذهبت أخلاقنا ... أين رجولتنا ... أين غيرتنا ... أين حماسنا<br />كل ذلك أصبح أثرا بعد عين ... وأصبحنا كالوحوش في الغابة ... لا نقيم للرحمة وزنا ... وعما قريب سيأكل قوينا ضعيفنا<br />وهذا الدعم الذي تتحدثون عنه وتتشدقون به ... هذه أموال الله التي إستخلفكم الله عليها لتصلحوا بها شأن عباده ... لكنكم ضيعتم الأمانة وخنتم العهد ... إذا كان راتب بعض المديرين عديمي المؤهلات الذين تم تعيينهم بالوسائط والمحسوبيات يفوق الخمسين ألف جنيه شهريا ... بينما الآلاف من خريجي الكليات إما متناثرين على المقاهي والأرصفة وإما يمسحون البلاط والصحون من أجل سد رمق عائلاتهم<br />حسبنا الله ونعم الوكيل ... وإنا لله وإنا إليه راجعون<br />رحمة الله عليك يا سيدي يا رسول الله<br />ورحمة الله على خلفائك الراشدين الذين كانوا ينادون الناس في الأسواق ليوزعوا عليهم الأموال فلا يأتي إليهم أحد قناعة من الكل بما عنده<br />كانوا أفضل حكام لأفضل محكومين ... ونحن الآن في أوطاننا منهوبين ومحتلين"
