text = "اية حكاية الدعوات الوهابية اللى بتبان فى كل موضوع<br />هو عايز اية ؟<br />نبقى تبع حاكم الحرمين ونقر لة بالولاية والخلافة<br />حاضر يا سيدى<br />الطاعة المطلقة لحاكم الحرمين - ولا خروج على ابن باز ولا مشايخ الوهابية بتوعك<br />وابقى حط فيها لبوس - يمكن ترتاح"
