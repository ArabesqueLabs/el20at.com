subject = "بيان"
text = "بيان حول خطورة<br />التسرع في التكفير<br />والقيام بالتفجير<br />وما ينشأ عنهما من سفك الدماء وتخريب المنشآت<br />بيان من هيئة كبار العلماء<br />من المملكة العربية السعودية<br />حرسها الله وسائر بلاد الإسلام، وحفظها جميعاً من شر الخوارج المارقين<br />الحمد لله، والصلاة والسلام على رسول الله، وعلى آله وصحبه ومن اهتدى بهداه، أما بعد:<br />فقد درس مجلس هيئة كبار العلماء في دورته التاسعة والأربعين المنعقدة بالطائف ابتداء من تاريخ 2\\4\\1419هـ ما يجري في كثير من البلاد الإسلامية وغيرها من التكفير والتفجير، وما ينشأ عنه من سفك الدماء، وتخريب المنشآت، ونظراً إلى خطورة هذا الأمر، وما يترتب عليه من إزهاق أرواح بريئة، وإتلاف أموال معصومة، وإخافة للناس، وزعزعة لأمنهم واستقرارهم، فقد رأى المجلس إصدار بيان يوضح فيه حكم ذلك نصحا لله ولعباده، وإبراء للذمة وإزالة للبس في المفاهيم لدى من اشتبه عليهم الأمر في ذلك، فنقول وبالله التوفيق:<br />أولاً: التكفير حُكْمٌ شَرعي، مَرَدُّهُ إلى الله ورسوله، فكما أنَّ التحليل والتحريم والإيجاب إلى الله ورسوله، فكذلك التكفير، وليس كل ما وُصف بالكفر مِن قول أو فعل، يكون كفراً أكبر مُخرجاً عن الملة.<br />ولما كان مَرَدّ حكم التكفير إلى الله ورسوله ؛ لم يجز أن نُكَفِّرَ إلا مَن دَلَّ الكتاب والسُّنَّة على كُفره دلالةً واضحة، فلا يكفي في ذلك مُجرد الشبهة والظن، لِـما يترتب على ذلك مِن الأحكام الخطيرة، وإذا كانت الحدود تُدرأ بالشبهات، مع أن ما يترتب عليها أقل مما يترتب على التكفير، فالتكفير أولى أن يدرأ بالشبهات؛ ولذلك حذر النبي صلى الله عليه وسلم مِن الحُكم بالتكفير على شخص ليس بكافر، فقال :\" أَيُّمَا امرىء قال لأخيه : يا كافر، فقد باء بها أحدهما، إن كان كما قال وإلا رجعت عليه\"، وقد يَرِدُ في الكتاب والسنة ما يُفهم منه أنَّ هذا القول أو العمل أو الإعتقاد كُفر، ولا يَكْفُر مَن اتَّصَفَ به، لوجود مانع يَمنع من كُفره.<br />وهذا الحكم كغيره من الأحكام التي لا تتم إلا بوجود أسبابها وشروطها، وانتفاء موانعها كما في الإرث، سببه القرابة - مثلاً - وقد لا يرث بها لوجود مانع كاختلاف الدين، وهكذا الكفر يُكْرَهُ عليه المؤمن فلا يكفر به.وقد ينطق المسلم بكلمة بالكفر لِغَلَبَةِ فَرحٍ أو غضب أو نحوهما فلا يكفر بها لعدم القصد، كما في قصة الذي قال : \" اللهم أنت عبدي وأنا ربك \"، أخطأ من شدة الفرح.<br />والتسرع في التكفير يترتب عليه أمور خطيرة من استحلال الدم والمال، ومنع التوارث، وفسخ النكاح، وغيرها مما يترتب على الردة، فكيف يسوغ للمؤمن أن يَقْدُمَ عليه لأدنى شُبهة .<br />وإذا كان هذا في ولاة الأمور كان أشد ؛ لما يترتب عليه من التمرد عليهم وحمل السلاح عليهم، وإشاعة الفوضى، وسفك الدماء، وفساد العباد والبلاد، ولهذا منع النبي صلى الله عليه وعلى آله وصحبه وسلم من منابذتهم، فقال :\" إلاَّ أَنْ تَروا كفراً بواحاً عندكم فيه من الله برهان\"، فأفاد قوله : \" إلا أن تروا \"، أنه لا يكفي مجرد الظن والإشاعة . وأفاد قوله : \" كُفر \" أنه لا يكفي الفسوق ولو كبُرَ، كالظلم وشرب الخمر ولعب القمار، والإستئثار المحرم . وأفاد قوله : \" بواحاً \" أنه لا يكفي الكفر الذي ليس ببواح أي صريح ظاهر، وأفاد قوله : \" عندكم فيه من الله برهان \" . أنه لابد من دليل صريح، بحيث يكون صحيح الثبوت، صريح الدلالة، فلا يكفي الدليل ضعيف السند، ولا غامض الدلالة . وأفاد قوله : \" مِن الله \" أنه لا عبرة بقول أحد من العلماء مهما بلغت منزلته في العلم والأمانة إذا لم يكن لقوله دليل صريح صحيح من كتاب الله أو سنة رسوله صلى الله عليه وسلم ، وهذه القيود تدل على خطورة الأمر .<br />وجملة القول : أن التسرع في التكفير له خطره العظيم ؛ لقول الله عزّ وجلّ: \" قُلْ إِنَّمَا حَرَّمَ رَبِّيَ الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَالإِثْمَ وَالْبَغْيَ بِغَيْرِ الْحَقِّ وَأَن تُشْرِكُواْ بِاللّهِ مَا لَمْ يُنَزِّلْ بِهِ سُلْطَاناً وَأَن تَقُولُواْ عَلَى اللّهِ مَا لاَ تَعْلَمُونَ\" - الأعراف 33 - .<br />ثانياً : ما نجم عن هذا الإعتقاد الخاطىء من استباحة الدماء وانتهاك الأعراض، وسلب الأموال الخاصة والعامة، وتفجير المساكن والمركبات، وتخريب المنشآت، فهذه الأعمال وأمثالها مُحرمة شرعاً بإجماع المسلمين ؛ لما في ذلك مِن هَتْكٍ لِحُرمة الأنفس المعصومة، وهتك لحرمة الأموال، وهتك لِحُرُمَات الأمن والإستقرار، وحياة الناس الآمنين المطمئنين في مساكنهم ومعايشهم، وغُدُوُّهِم ورَوَاحهم، وهَتكٍ للمصالح العامة التي لا غِنى للناس في حياتهم عنها.<br />وقد حفظ الإسلام للمسلمين أموالهم وأعراضهم وأبدانهم، وحَرَّمَ انتهاكها، وشَدَّدَ في ذلك، وكان مِن آخر ما بَلَّغَ به النبي صلى الله عليه وسلم أُمَّتَهُ فقال في خُطبة حجة الوداع :\" إن دماءكم وأموالكم وأعراضكم عليكم حرام كحرمة يومكم هذا، في شهركم هذا، في بلدكم هذا \"، ثم قال صلى الله عليه وسلم : \" ألاَ هَل بَلَّغْتُ ؟ اللهم فاشهد \" متفق عليه . وقال صلى الله عليه وسلم:\" كل المسلم على المسلم حرام، دمه وماله وعرضه \"، وقال عليه الصلاة والسلام: \" اتقوا الظلم، فإن الظلم ظلمات يوم القيامة \".<br />وقد توعد الله سبحانه مَن قتل نفساً معصومةً بأشد الوعيد، فقال سبحانه في حقّ المؤمن:\" وَمَن يَقْتُلْ مُؤْمِناً مُّتَعَمِّداً فَجَزَآؤُهُ جَهَنَّمُ خَالِداً فِيهَا وَغَضِبَ اللّهُ عَلَيْهِ وَلَعَنَهُ وَأَعَدَّ لَهُ عَذَاباً عَظِيماً\" – النساء: 93. وقال سبحانه في حقّ الكافر الذي له ذِمَّة في حُكم قتل الخطأ:\" وَإِن كَانَ مِن قَوْمٍ بَيْنَكُمْ وَبَيْنَهُمْ مِّيثَاقٌ فَدِيَةٌ مُّسَلَّمَةٌ إِلَى أَهْلِهِ وَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةً\" – النساء: 92.<br />فإذا كان الكافر الذي له أمان إذا قُتِل خطأ فيه الدِّية والكفارة، فكيف إذا قُتِلَ عمداً، فإن الجريمة تكون أعظم، والإثم يكون أكبر . وقد صَحَّ عن رسول الله صلى الله عليه وسلم أنه قال :\" مَن قَتَل معاهداً لم يَرَح رائحة الجنة \".<br />ثالثاً: إن المجلس إذْ يُبين حُكم تكفير الناس بغير برهان مِن كتاب الله وسنة رسوله صلى الله عليه وسلم وخطورة إطلاق ذلك، لما يترتب عليه من شرور وآثام، فإنه يُعلن للعالم أنَّ الإسلام بريء مِن هذا المعتقد الخاطىء، وأن ما يجري في بعض البلدان مِن سَفك للدماء البريئة، وتفجير للمساكن والمركبات والمرافق العامة والخاصة، وتخريب للمنشآت هو عمل إجرامي، والإسلام بريء منه، وهكذا كُل مسلم يؤمن بالله واليوم الآخر بريء منه، وإنما هو تصرف من صاحب فكر منحرف، وعقيدة ضالة، فهو يحمل إثمه وجرمه، فلا يحتسب عمله على الإسلام، ولا على المسلمين المهتدين بهدي الإسلام، المعتصمين بالكتاب والسنة، المستمسكين بحبل الله المتين، وإنما هو مَحض إفساد وإجرام تأباه الشريعة والفطرة؛ ولهذا جاءت نصوص الشريعة قاطعة بتحريمه مُحذرة من مصاحبة أهله .<br />قال الله تعالى:\" وَمِنَ النَّاسِ مَن يُعْجِبُكَ قَوْلُهُ فِي الْحَيَاةِ الدُّنْيَا وَيُشْهِدُ اللّهَ عَلَى مَا فِي قَلْبِهِ وَهُوَ أَلَدُّ الْخِصَامِ وَإِذَا تَوَلَّى سَعَى فِي الأَرْضِ لِيُفْسِدَ فِيِهَا وَيُهْلِكَ الْحَرْثَ وَالنَّسْلَ وَاللّهُ لاَ يُحِبُّ الفَسَادَ وَإِذَا قِيلَ لَهُ اتَّقِ اللّهَ أَخَذَتْهُ الْعِزَّةُ بِالإِثْمِ فَحَسْبُهُ جَهَنَّمُ وَلَبِئْسَ الْمِهَادُ\" . - البقرة 204 – 206.<br />والواجب على جميع المسلمين في كل مكان التواصي بالحق، والتناصح والتعاون على البر والتقوى، والأمر بالمعروف والنهي عن المنكر بالحكمة والموعظة الحسنة، والجدال بالتي هي أحسن، كما قال الله سبحانه وتعالى:\" وَتَعَاوَنُواْ عَلَى الْبرِّ وَالتَّقْوَى وَلاَ تَعَاوَنُواْ عَلَى الإِثْمِ وَالْعُدْوَانِ وَاتَّقُواْ اللّهَ إِنَّ اللّهَ شَدِيدُ الْعِقَابِ \"، المائدة: 2.<br />وقال سبحانه:\" وَالْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بَعْضُهُمْ أَوْلِيَاء بَعْضٍ يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنكَرِ وَيُقِيمُونَ الصَّلاَةَ وَيُؤْتُونَ الزَّكَاةَ وَيُطِيعُونَ اللّهَ وَرَسُولَهُ أُوْلَـئِكَ سَيَرْحَمُهُمُ اللّهُ إِنَّ اللّهَ عَزِيزٌ حَكِيمٌ \"- التوبة: 71 ، وقال عز وجل :\" وَالْعَصْرِ - إِنَّ الإنسَانَ لَفِي خُسْرٍ - إِلاَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ \" - سورة العصر.<br />وقال النبي صلى الله عليه وسلم :\" الدين النصيحة \" قيل: لِمن يا رسول الله ؟ قال: \" لله، ولكتابه، ولرسوله، ولأئمة المسلمين وعامتهم \"، وقال عليه الصلاة والسلام :\" مَثَلُ المؤمنين في تَوَادِّهِم وتَراحمهم وتَعاطفهم مثل الجسد، إذا اشتكى منه عُضْوٌ تَدَاعَى له سائر الجسد بالسَّهَرِ والحُمى \"، والآيات والأحاديث في هذا المعنى كثيرة .<br />ونسأل الله سبحانه بأسمائه الحسنى وصفاته العلي أنْ يَكُفَّ البأس عن جميع المسلمين، وأن يوفق جميع ولاة أمور المسلمين إلى ما فيه صلاح العباد والبلاد وقمع الفساد والمفسدين، وأن ينصر بهم دينه، ويُعلي بهم كلمته، وأن يصلح أحوال المسلمين جميعاً في كل مكان، وأن ينصر بهم الحق، إنه ولي ذلك والقادر عليه، وصلى الله وسلم على نبينا محمد وآله وصحبه .<br />مجلة البحوث الإسلامية، عدد (56) صفحة: 357-362.<br />هيئة كبار العلماء<br />برئاسة الشيخ عبد العزيز بن باز<br />وعضوية كل من:<br />الشيخ محمد بن صالح العثيمين - الشيخ عبد الله البسام<br />الشيخ صالح بن فوزان الفوزان - الشيخ صالح اللحيدان<br />الشيخ محمد السبيل - الشيخ عبد الله الغديان وآخرون..."
