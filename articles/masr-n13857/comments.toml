subject = "الحل في منهج النبي محمد صلى الله عليه وسلم"
author = "مش لازم"
text = "النبي محمد صلى الله عليه وسلم قائد وزعيم يا جماعة قاد الجزيرة العربية بجدارة من كل النواحي صلوات الله وسلامه عليه<br />وممكن نقرأ حال الجزيرة العربية قبل الاسلام<br />ونقرا سيرة النبي محمد صلى الله عليه وسلم لمدة 23 سنه<br />وبعد ان انتهت مهمة النبي محمد صلى الله عليه وسلم<br />ممكن نقرأ حال الجزيرة العربية<br />علشان نتأكد بنفسها ان منهج النبي هو الحل"
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063033/http://masr.20at.com:80/newArticle.php?sid=13857"

