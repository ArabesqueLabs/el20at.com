subject = "هذه بلاد أحبها"
author = "أسامة"
posted = "2008-02-24"
text = "ما أجمل سوريا الطبيعية، وما أروع شعبها الخلوق المضياف. لقد زرتها منذ فترة فأحسست أنني في بلدي مصر. لم أحس باستغلال السائح العربي ولم أشعر بغربة عن وطني، وقابلنا الكبير قبل الصغير بالحفاوة والترحاب. ولن أنسى المناظر الطبيعية الخلابة التي رأيتها هناك ، إنها حقا ً بلد رائعة<br />تستحقي يا دمشق أن تكوني حاضنة للثقافة العربية والإسلامية بعد أن تخلت وطني مصر عنها :sad:"
