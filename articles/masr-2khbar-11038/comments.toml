posted = "2009-01-25"
text = "يا سيادة اللواء جمال مبارك ولي عهد مصر<br />حضرتك قلت في مؤتمر صحفي انك حتوزع اصول الدولة على الشعب<br />والشعب فرح وانتظر<br />وبعدين الحكومة سكتت خالص<br />هو ايه الحكاية فيه اصول حتتوزع ولا مفيش"
