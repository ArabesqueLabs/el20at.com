order = 0
subject = "لا حدق يا سيادة اللواء الدكتور --------- المشكلة خ"
author = "المفتش كورمبو"
posted = "2009-01-25"
text = "الحكومة بتفرض فى الشعب الغباء والجهل<br />ويظهر اننا من اغبى شعوب الارض فعلا<br />زى ما اى انسان بيولع سيجارتة اللى بيدخنها بولاعة مشحونة غاز او الولاعة بتاع السجاير بتشتغل بالغاز<br />كذلك مصانع الطوب<br />فى بداية اشعال وقود المازوت بيستخدموا ولاعة للاشعال او بداية اشعال وقود المازوت - ولمدة دقيقة او دقيقتين وبيستهلكوا انبوبة او انبوبتين كل اسبوعين وهذا يحدث من زمان جدا وسيظل يستعمل وجارى استعمالة حتى الان<br />انما السبب الحقيقى يا سيادة الوزير هو تدويخ الناس وراء الانبوبة علشان ينسوا موضوع غزة وليفنى وخيبة الحكومة اللى انفضحت فى مشارق الارض ومغاربها وضربوا سفاراتها بالطوب"
archived = "2010-03-14"
