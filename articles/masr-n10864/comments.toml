[[comments]]
order = 0
subject = "منابر و كراسى"
author = "نيفين نيفى نوفا"
text = "و الله يا استاذ محمود و انا معاك ف اللى قلته بس انا شايفه ان هى دى طبيعه الكراسى عندنا ف البلد<br />الكراسى اللى بتغير الناس و بتخليهم بمليون وش و مليون اتجاه و بتخليهم يعتلو مليون منبر<br />و ان كنت حضرتك قصرتها على الرياضه فصدقنى لو اتجهت لمجالات تانيه هتلاقى برده كتير من اصحاب المنابر<br />و اسمحلى انى اخرج عن الموضوع و اهنى كل الهلاويه بالفوز الغالى على الاسماعيلى و الاغلى ان شاء الله ع الزماللك يوم الاتنين"
archived = "2007-07-03"
capture_url = "https://web.archive.org/web/20070703180938/http://masr.20at.com:80/newArticle.php?sid=10864"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
text = "و الله انا شايف ...ان كل الاخوه اللي فوق دول طموحاتهم ليها سقف ...و ليها اخر و راضيين و حامدين ربنا و شاكرينه بنصيبهم في تركة مبارك ...الا الاخ الاولاني ..شوبير ...ياااااااااااه يا شوبير علي كمية التعريض اللي عندك ...بتعرض كتير اوي ...بيعرض نفسه لمواقف كتير يعني ..اوعي حد يشيل نقطة الضاد ...اخر موقف عرض فيه نفسه للاحراج و كان مكشوف اوي ... دا اللي فاكره يعني ...كان اييام كاس الامم ..قاعد في الاستوديو في الفضائيه المصريه ...و بيكلم المراسل في الاستاد ...ف بيسأله عايزين نعرف مين اللي موجود في الاستاد ...المراسل غلبان ياعيني ...مش واخد باله راح قايله اسامي اللعيبه ...قاله بقولك اسامي الشخصيات العامه ...كان موجود الوزير وناس تانيه كتير ليهم صفات رسميه و رئيس الاتحاد و الدنيا ..الغلبان ساب دول كلهم و زي ما يكون انتبه لما شوبير زعق فيه ...و قعد يقوله الاستاذ جمال مبارك الاستاذ جمال مبارك الاستاذ جمال مبارك ...و الغريبه انه مسألوش و مين تاني معاه ؟؟ يا جماعه انتظروا شوبير وزير الشباب و الرياضه بعد التوريث مباشرة ..."
archived = "2007-07-03"
capture_url = "https://web.archive.org/web/20070703180938/http://masr.20at.com:80/newArticle.php?sid=10864"

[[comments]]
order = 2
subject = "بطالة"
author = "ابو اسامة"
text = "امال بيقولوا فيه بطالة ليه مهى الناس شغالة 7شغلات ومنصب دى طبعا تريقة فى بلد تصل فيه البطالة الى اكثر من<br />60% نجد مثل هؤولاء الناس يشغلون اكثر من منصب ووظيفة فى استفزاز واضح لمشاعر الشباب العاطل الذى كان ياءمل فى اى من هذه الفرص حتى ولو معلق ."
archived = "2007-07-03"
capture_url = "https://web.archive.org/web/20070703180938/http://masr.20at.com:80/newArticle.php?sid=10864"

[[comments]]
order = 3
subject = "أكثر شيء هيخلين أفرقع هو"
author = "مهندس مصري"
text = "الصراحة يا جماعة أكتر شيء هيخليني أفرقع هو موضوع أن الأستاذ هادي فهمي بيكتب في الرياضة في المصري اليوم ، ده المفروض راجل ماسك منصب كبير جدا جدا ( رئيس الشركة القابضة للتجارة ) يعني مش فاضي يتابع كل شيء بيكتب عن الرياضة أنا قرأت له كذا مرة ، حسيت أنه فاضي طول اليوم لمتابعة البرامج والصحف الرياضية ، إلا بقي لو حد تاني هو اللي بيكتب موضوعاته وبتنزل بإسم هادي فهمي ، ده بقي يبقي شغل علي كبير .......... أما باقي الأسماء الموجودة في المقال فأنا لا أري تعارضا كبيرا لكي تتحدث في الرياضة رغم مناصبها المختلفة لأنها في النهاية مناصب رياضية ، أما ما لا أفهمه كيف يهاجم شوبير أتحاد الكرة وسياسته وهو في نفس الوقت نائب رئيس هذا الأتحاد ... وشكرا ومعلش طولت عليكو"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819202120/http://masr.20at.com:80/newArticle.php?sid=10864"
