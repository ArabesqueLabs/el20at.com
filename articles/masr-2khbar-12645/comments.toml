subject = ""
author = "السيدة زينب"
posted = "2009-07-14"
text = "ولِّيتُ وجهى شطرَ قبلةِ الورى<br />ومن بها تشـرفتْ أُمُ القـرى<br />قطبُ محيـطِ عـالمِ الوجـودِ<br />في قوسيِ النـزولِ والصـعودِ<br />ففي النـزولِ كعبـةُ الرزايـا<br />وفي الصـعودِ قبـلةُ البرايـا<br />بل هيَ بـابُ حطـةِ الخطايـا<br />ومـوْئـلُ الهباتِ والعطـايـا<br />أمُ الكتابِ في جـوامـعِ العـلا<br />أمُ المصـابِ في مجامعِ البـلا<br />رضيـعةُ الوحىِ شقيقةُ الهـدى<br />ربيـبةُ الفضـلِ حليفةُ النـدى<br />ربـةُ خدرِ القـدسِ والطـهارة<br />في الصونِ والعفافِ والخـفارةِ<br />فإنـها تـمثـلُ الكنـزَ الخـفي<br />بالسـترِ والحيـاءِ والتعـفـُّفِ<br />تمثِّـلُ الغيـبَ المصونَ ذاتـها<br />تعـربُ عنْ صـفاتِهِ صـفاتها"
archived = "2010-03-14"
