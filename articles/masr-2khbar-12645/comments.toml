author = "مش صوفى"
posted = "2009-07-14"
text = "مش صوفى ولا احب المتصوفين<br />ولست شيعى ولكنى مسلما سنيا مصريا يحب ال البيت ويجلهم وحتفل باعياد ميلادهم وتاريخ وفاتهم اللى هى الموالد<br />وتهزنى موسيقى الصوفيين ودقات دفوفهم وتغنيهم بحب ال البيت<br />وفى الحديث من اذى لى وليا فقد باء بحرب اللة ورسولة<br />الا ان اولياء اللة لا خوف عليهم ولاهم يحزنون<br />لا اسالكم علية اجر الا المودة فى القربى<br />ونحن يا رسول اللة نود اقربائك ونزورهم ونحبهم ونحتفل بهم<br />هنحتفل يعنى هنحتفل<br />واللى ناوى حرق الجرن ربنا بيهلكة قبل الحصاد"
