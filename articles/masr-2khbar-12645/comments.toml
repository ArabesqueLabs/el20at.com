[[comments]]
order = 2
subject = ""
author = "رد على مش صوفي"
posted = "2009-07-14"
text = "يا استاذ مش صوفي اولا ازيك وازي صحتك<br />انت بتقول انك بتحب ال البيت وعلشان خاطر كده بتحتفل بتواريخ ميلادهم وتاريخ وفاتهم<br />ممكن نعرف اولا يعني ايه ال البيت<br />ال البيت اللي هما ال بيت النبي صلى الله عليه وسلم ونخص بالذكر<br />السيدة فاطمه الزهراء والحسن والحسين رضي الله عنهم<br />طبعا التلاته دول ما فيش حد حيحبهم اد النبي محمد صلى الله عليه وسلم<br />يعني النبي محمد مستحيل حد حيحب بنته فاطمه وولديها الحسن والحسين اكتر منه لانه هو اللي خلف فاطمه وهو حضر ميلاد الحسن والحسين<br />فاذا كان حبهم يعني الاحتفال بهم لكان النبي محمد صلى الله عليه وسلم اولى بان يقيم احتفال بميلادهم كل عام زي ما احنا بنعمل لعيالنا كده<br />ولكن الرسول صلى الله عليه وسلم وهو ابوهم وجدهم ولم يحتفل بميلادهم ولا باي شيء من هذا القبيل وهو اولى الناس بالاحتفال بهم<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />يبقى بقى حبتوا الاحتفالات دي منين يا اخوانا الصوفية<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش احمد الهواري ولا عبدالله الطحاوي"
