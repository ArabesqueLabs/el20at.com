[[comments]]
order = 3
subject = ""
author = "العصر النبوى"
posted = "2009-07-14"
text = "كان النبى حيا يسعى بين الصحابة وحولة ال بيتة الاطهار<br />والناس يرونة فى المسجد والسوق وفى الغزوات وفى افراحهم وفى عزائهم<br />كانوا ملىء العين والبصر والقلب<br />كانوا مصابيح للتقى والهدى يقصدهم الفقير والغنى والمسكين واليتيم والاسير<br />اما نحن الفقراء الى اللة فاين نحن منهم واين زماننا من زمانهم فلا يبقى لنا غير سيرتهم ومحبتهم والسير على هداهم<br />فدعونا نحتفل بهم ونظهر محبتنا الى اهل بيت النبى ونودهم ونذكرهم وهم قرة عين النبى واحبائة<br />المولد ليس الاختلاط وليس حلقات الذكر ولكنة اطعام لفقير جائع ربما لا يتناول اللحم الا فى الموالد وربما تكون مناسبة ليتجمع فيها الفقراء والمحسنون باضحيتهم وطعامهم ليطعموا الجائع والفقير والمحتاج<br />هناك فقراء واهل ذكر مساكين ومشردون ينتظرون المولد لياكلوا لقمة حلوة وليشكروا اللة<br />هناك مفاسد نعم هناك<br />ولكن الخير اعم واكثر<br />واطعام جائع خير عند اللة من الدنيا وما فيها<br />وسنحتفل بالمولد<br />شاء من شاء وابى من ابى<br />وتلك هى عادتنا<br />ليست من الدين نعم ونقر بذلك ولكنها عادتنا ولن نغيرها<br />وفى الغرب الصليبى المسيحى واتباع وعباد الصليب يقيمون المهرجانات والكرنفلات ويحتفلون بى الساحات"
archived = "2010-03-14"
