[[comments]]
order = 4
subject = "اقترح عمل موضوع عن الفساد في القضاء المصري"
author = "مصرية"
posted = "2008-11-18"
text = "اري ان لو كان القضاء نزيه كان كتير من اهل الفساد اختفوا<br />لكن السوس نخر ووصل للعصب من زمان و الضرس مشبس بقي ايود و الخراريج خارجة منه طول الوقت<br />لازم يتخلع بقي لانه بيؤلم طول الوقت و يترمي<br />لكن كمصرية اقولا لشعبي لا يغير الله ما بقوم حتي يغيروا ما بانفسهم<br />لينظر كل منكم كيف يعامل اهله و اسرته و قبلها علاقته مع الله و كيف امانته في اخلاقه و بعدين احكوموا اي حكومة تستاهلوها و كفاية الرسائل اللي ربنا بيبعتها من غرق عبارات و حوادث قطارات و حرائق و زلازل فوقوا بقي"
archived = "2010-03-14"
