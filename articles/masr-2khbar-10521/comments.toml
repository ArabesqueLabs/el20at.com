subject = "حظر النشر فى قضية تهم الراى العام  علشات يعرفوا  ا"
author = "القرموط الحزين"
posted = "2008-11-17"
text = "لومبارك واثق من نفسة ومن حزبة وحراميتة يسيب الموضوع يمشى للاخر والتحقيق والقضاء يستدعى اللى هو عايزة للمحكمة للادلاء بشهادتة لتتضح الامور لكن اتوقع انة دة مش حيحصل لانة حيكون محاكمة للنظام الحاكم اللى بقالة تلاتين سنة وهو شغال شعارات ووعود من ناحية ومن الناحية التانبة تقسيم التورتة بين العيلة والمحاسيب والمحظوظين وهشام بتاع سوزان تميم دة من المحظوظين والشركاء للريس وابنة فى المقاولات والاستبلاء على الاراضى بدون وجة حق"
