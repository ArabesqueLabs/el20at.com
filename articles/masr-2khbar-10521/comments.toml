subject = "طيزك حمرا يا سعادة النائب العام....... ليه"
author = "مش كاتب"
posted = "2008-11-17"
text = "سعادة النائب العام او معالي النائب العام يظهر جايبينه من ايام جمال عبدالناصر وصلاح نصر والعالم دول<br />معالي النائب العام ما يعرفش ان فيه انتر نت وفضائيات بتجيب اخبار مصر قبل الجرايد المصرية وان فيه جرايد مصرية بتعرف اخبار مصر من الخارج عن طريق الفضائيات ومواقع الانترنت<br />المفروض النائب العام دا يروح الانتكخانه<br />مفيش فايدةالمصري حيفضل طول عمرو مصري حيعيش حمار زيموت حمار"
