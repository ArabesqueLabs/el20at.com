subject = "الى الاخ المهم"
author = "مش ضروري"
posted = "2008-04-24"
text = "انت حضرتك ذكرتني شخصيات ثورية مصطفى كامل واحمد عرابي وخلافه<br />ممكن اعرف بأه الناس دول عملوا ايه<br />طبعا الناس دول احنا درسناهم في المدرسة<br />وبعد الناس دول فوجئنا بالضباط الاحرار اللي ضيعوا البلد<br />يبقفى مصطفى كامل واحمد عرابي كان المفروض يوفروا تعبهم احسن وكانوا سابوا الملك في حاله<br />لان النتيجة كانت جمال عبدالناصر<br />كذلك التاريخ يعيد نفسه فيه ناس ثوريين ومش عارف ايه<br />لكن النتيجة ان ممكن الحكم حينتقل الى ناس زي الضباط الاحرار<br />الثوريين مش حياخدوا حاجه زي مصطفى كامل وسعد زغلول<br />علشان كده ريحوا نفسهم يا مصريين حظكوا كده مع حكامكوا<br />من ايام حتشبسوت ومينا ورمسيس المصري بيدفع ضرايب وجباية وبس<br />المصري يشتغل زي الحمار ويدفع ضرايب وبس<br />ما لوش اي حقوق مش من ايام حسني مبارك<br />من ايام حتشبسوت وخوفو وخفرغ<br />ريحوا نفسكم يا مصريين واستهدوا بالله<br />الحكم الجاي حيبقى ازفت من اللي موجود<br />وبرضوا حتدفعوا ضرايب وجباية واتاوه"
