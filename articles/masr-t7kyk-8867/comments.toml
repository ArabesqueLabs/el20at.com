[[comments]]
order = 5
subject = "احذر الفيش بوك"
author = "منقول"
posted = "2008-04-23"
text = "احذر الفيس بوك<br />فيس بو ك FACE BOOK<br />فترة قليلة على انطلاق موقع 'فيس بوك' الشهير للتعارف على شبكة الانترنت ، كانت كفيلة لتكالب الملايين من أنحاء العالم على المشاركة في الموقع خصوصا ان من السهل على أي مشترك الوصول للمئات من الجميلات ، ولكن المسألة لا تتوقف على الجميلات فحسب . فثمة شكوك حول أستفادة إسرائيل من الكم الهائل من المعلومات المتاحة عن المشتركين من العالمين العربى والاسلامي وتحليلها وتكوين صورة استخباراتية عن الشباب العربي والمسلم وهذا الشباب كغيره من شباب العالم وجد في هذا الموقع ضالته المنشودة حيث يمكنه عبره التعرف على عدد كبير من الفتيات من مختلف أنحاء العالم<br />ولكن الخطير هو أن الشباب العربي يجد نفسه مضطراً دون أن يشعر للادلاء بتفاصيل مهمة عن حياته وحياة أفراد أسرته ومعلومات عن وظيفته واصدقائه والمحيطين به وصور شخصية له ومعلومات يومية تشكل قدراً لا بأس به لاى جهة ترغب في معرفة أدق التفاصيل عن عالم الشباب العربي .<br />وتجربة إسرائيل في الاستفادة من التكنولوجيا المعلوماتية لا تخفى على أحد ، فأجهزتها الامنية والمخابراتية صاحبة باع طويل في هذا المجال وثرية بطريقة تجعلها قادرة على جمع ما تريد من معلومات في أى وقت عن الشباب العربي الذي يشكل النسبة الاكبر ويعد الطاقة في أى مواجهة مستقبلية. وليس الحديث عن شكوك أو تخمينات بل حقيقة دامغة وأن غابت تفاصيلها وأسرارها ، لكن هل يمكن أن نتخيل أن نكون جميعا »جواسيس« دون أن ندري وأن نقدم معلومات مهمة للمخابرات الاسرائيلية أو الاميركية دون أن نعرف أننا نقدم لهم شيئاً مهما .<br />هذه هى الحقيقة فالامر أصبح سهلا حيث لا يتطلب من أى شخص سوى الدخول إلى الانترنت وخاصة غرف الدردشة، والتحدث بالساعات مع أى شخص لا يعرفه فى أى موضوع حتى فى الجنس معتقدًا أنه يفرغ شيئا من الكبت الموجود لديه ويضيع وقته ويتسلى، ولكن الذى لا يعرفه أن هناك من ينتظر لتحليل كل كلمة يكتبها أو يتحدث فيها لتحليلها واستخراج المعلومات المطلوبة منها دون أن يشعر هذا الشخص أنه أصبح جاسوسا وعميلا للمخابرات الاسرائيلية أو الاميركية، هذه الحقيقة نشرتها (مجلة اسرائيل )اليهودية التى تصدر فى فرنسا منذ فترة قصيرة حيث نشرت ملفا عن عملاء الانترنت الذين يشكلون اليوم إحدى أهم الركائز الاعلامية للمخابرات الاسرائيلية والاميركية على حد سواء، وفي الملف معلومات فى غاية الاهمية والخطورة عن أحدث طرق للجاسوسية تقوم بها كل من المخابرات الاسرائيلية والاميركية عن طريق أشخاص عاديين لا يعرفون أنهم يفعلون شيئا خطيرا بل يفتحون الانترنت وبالتحديد صفحات الدردشة الفورية لقضاء الساعات في الكلام عن أشياء قد تبدو غير مهمة، وأحيانا تافهة أيضا، لكنها تشكل أهم المحاور التي تركز عليها أجهزة استقطاب المعلومات في المخابرات لانها ببساطة تساعدها على قراءة السلوك العربي، وخصوصا لدى الشباب الذين يشكلون أكثر من 70% من سكان الوطن العربي .<br />والحكاية كما روتها المجلة بدأت فى العام 1998 حين اجتمع ضابط المخابرات الاسرائيلي (موشيه أهارون) مع ضابط اخر اميركي فى مقر وكالة الاستخبارات المركزية الاميركية (سي اي ايه)، لم يكن الامر يعدو اجتماعا روتينيا، بل كان الجانب الاميركي يسعى فيه إلى الحصول على الحقائق اللوجستية التى من عادة المخابرات الاسرائيلية تقديمها للاميركيين عن الدول التي تطلق عليها إدارة البيت الابيض الدول المارقة، لكن الجانب الاسرائيلي كان يبحث عن الدعم اللوجستي غير المعلوماتي، بل المادى لتأسيس مكتب ظل يعول عليه أهارون الذى كان من أبرز الوجوه الاسرائيلية المختصة في الشؤون الامنية العربية، وكان وراء عمليات اغتيال شخصيات فلسطينية في تركيا ونيروبى وساحل العاج وتونس ودول أخرى أوروبية مثل يوغسلافيا واسبانيا وايطاليا .<br />الأقمار الأميركية بدورها لم تكن إسرائيل قادرة على ضمان (نجاح) تجربة مخابراتية عبر الانترنت من دون مساعدة أميركية عبر الاقمار الصناعية، وعبر المواقع البريدية الاميركية التى تخدم بالخصوص (الشات ) بكل مجالاته والتى يقبل عليها من قبل شباب العالم الثالث فى القارات الخمس وفى الاول من مايو 2002 تم الكشف للمرة الاولى فى جريدة (التايمز) عن وجود شبكة مخابراتية تركز اهتماماتها على جمع أكبر عدد من العملاء، وبالتالى من المعلومات التى يعرف الكثير من الاختصاصيين النفسانيين المنكبين على المشروع كيفية جمعها، وبالتالى كيفية استغلالها لتكون ذات أهمية قصوى .<br />وقد جاء ما نشرته مجلة ( لوماغازين ديسراييل ) الصادرة فى فرنسا مثيرا للدهشة ؛ ربما لانها نقلت عن (ملفات سرية) الكثير من التفاصيل التى استطاعت أن تجمعها عن مصادر موثوقة فى إسرائيل، وهو ما أثار فى النهاية سخط السفير الاسرائيلى فى فرنسا ضد المجلة اليهودية التى اتهمتها غالبية من الجهات اليهودية بأنها كشفت أسراراً لا يحق لها كشفها للعدو .<br />إلا أن الموضوع لم ينته عن هذا الحد بل بدأ الجميع فى البحث عن وجود جهاز مخابراتى اسمه مخابرات الانترنت يقول جيرالد نيرو الأستاذ فى كلية علم النفس بجامعة بروفانس الفرنسية، وصاحب كتاب ( مخاطر الانترنت ): إن هذه الشبكة تم الكشف عنها، بالتحديد فى مايو2001 وهى عبارة عن مجموعة شبكات يديرها مختصون نفسانيون إسرائيليون مجندون لاستقطاب شباب العالم الثالث وخصوصا المقيمين في دول الصراع العربي الاسرائيلي اضافة الى اميركا الجنوبية ( فنزويلا، نيكاراغوا.. الخ ) ويرى نيرو إن كل من له قدرة على استخدام الانترنت لسد وقت الفراغ أو لحاجة نفسية يعتبر (عميلا مميزا)، لان المواقع التى تثير الشباب هى التى تمنحهم مساحة من الحوار ربما يفتقدونها فى حياتهم اليومية، ناهيك عن أن استعمال الانترنت يضمن خصوصية معينة، حيث إن المتكلم يحتفظ عادة بسرية شخصه، كأن يستعمل اسما مستعارا، وبالتالى يكون إحساسه بالحرية أكثر انطلاقا، كما أن تركيز الشباب لا يكون على الموقع نفسه، بل على من سيلتقيه للحديث معه، وخاصة البحث عن الجنس اللطيف للحوار والمسألة تبدو سهلة بالنسبة لضباط المخابرات الذين ينشطون بشكل مكثف داخل مواقع الدردشة خاصة فى المناطق الاكثر حساسية فى العالم ، وربما يعتقد بعض مستخدمى الانترنت أن الكلام عن (الجنس) مثلا ضمان يبعد الشبهة السياسية عن المتكلم، بينما الحقيقة أن الحوار الجنسى هو وسيلة خطيرة لسبر الاغوار النفسية، وبالتالى لكشف نقاط ضعف من الصعب اكتشافها فى الحوارات العادية الاخرى، لهذا يسهل (تجنيد) العملاء انطلاقا من تلك الحوارات الخاصة جدا، والتى تشمل فى العادة غرف النوم والصور الاباحية وما إلى ذلك، بحيث إنها السبيل الاسهل للايقاع بالشخص ودمجه فى عالم يسعى رجل المخابرات إلى جعله عالم العميل .<br />وتجدر الاشارة إلى أن رئيس الوزراء الاسرائيلي السابق بنيامين نتنياهو أكد في سياق تصريحات له نشرت بان رئاسته للحكومة أنه ابان يقوم شخصياً بالاستماع إلي المحدثات التي يجريها الشباب العربي عبر غرف الشات ببرنامج بال توك وقال أنه يعلم من خلال تلك المحادثات ما يفكر فيه الشارع العربي والحديث الغالب عليه وأهم القضايا الحساسة التي يهتم بها العرب .<br />اللبنانيون في الصدارة : أما موقع فيس بوك فقد قالت عنه صحيفة 'لوس أنجليس تايمز' الاميركية إن اللبنانيين أكثر شغفاً وحرصاً على إنشاء صفحات لهم على موقع 'فيس بوك'، حيث يضم موقع لبنان 125 ألف شخص، أي بنسبة واحد لكل 32 من عدد السكان، في حين يضم موقع إسرائيل 90 ألفاً، أي حوالي واحد لكل 70 بينما يضم موقع مصر 180 ألفاً، أي حوالي واحد لكل 437 من المقيمين فيها ، ومن الصفحات المصرية على الموقع، صفحات خاصة بنجوم وفنانين مصريين وإعلاميين وحوالي 500 جماعة، بينها جماعات للدفاع عن الحريات وحقوق الانسان، ومجموعة لمحبي مصر زمان، ومجموعة من العائلة المالكة قبل الثورة، تضم صوراً وأخباراً عن أسرة محمد علي والملك فاروق .<br />وبدأ 'فيس بوك' الذي ينضم إليه أكثر من مليون عضو شهريا، في طرح المعلومات المتعلقة بأعضائه علنا على محركات البحث على الانترنت مثل 'غوغل' و'ياهو' ، وعلق خبير تكنولوجيا المعلومات اوم مالك على ذلك بالقول 'هذه الخطوة تحول- فيس بوك- من شبكة اجتماعية خاصة إلى ما يشبه الصفحات الصفراء على الانترنت، ويهدف 'فيس بوك' من هذه الخطوة إلى الدخول المبكر في السباق لبناء دليل إلكتروني عالمي يحتوي على أكبر قدر ممكن من المعلومات والتفاصيل الشخصية مثل السير الذاتية وأرقام الهواتف وغيرها من سبل الاتصال بالشخص، وهوايات الاعضاء وحتى معلومات عن أصدقائهم، ما قد يعود بأرباح كبيرة على الموقع ، وينضم حاليا نحو 200 ألف شخص يوميا إلى 'فيس بوك' الذي أصبح يستخدمه 42 مليون شخص، طبقا للموقع. وتشير تقارير الصحف إلى أن الموقع استقطب 60 مليون عضو مع نهاية 2007م ، ومنذ إنشائه قبل ثلاثة أعوام على يد مارك غوكيربيرغ الذي كان طالبا في جامعة هارفرد في ذلك الوقت، حقق الموقع انتشارا عالميا وأصبح دليل معلومات إلكترونياً خاصاً ، إلا أن نيته نشر معلومات حول أعضائه للعلن تعني أن أي شخص يستخدم محركات البحث العادية على الانترنت يمكنه أن يحصل على معلومات عن أي عضو في فيس بوك ، وإذا لم يرفض العضو في الموقع نشر معلومات عنه، فإن صوره واسمه ستتوافر من الان فصاعدا لاي شخص غير مسجل في الموقع ."
