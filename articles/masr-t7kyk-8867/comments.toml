text = "مش عارف ليه عندى احساس غريب ؟؟ ان احمد عرابى كان عميل للموساد ونفس الاحساس عن مصطفى كامل وسعد زغلول وعمر مكرم يبدو والله اعلم انهم كانوا يعملون لحساب ال(c i a ) ثم جاء بعدهم الدكتور عبد الوهاب المسيرى وجورج اسحاق والمدعوه اسراء عبد الفتاح ليسيروا على الدرب ذاته ولكن هيهات لهم ذلك فنحن اذكى شعوب الدنيا ونفهمها وهى طايره؟؟؟ فقسناكم ياعملاء المخابرات الاسرائيليه والc i a وال fbi والKGB العبوا غيرها وسيبونا فى حالنا ننعم بحياتنا الهادئه المترفه الجميله فى ظل رئيسنا وحكومتنا ووزرائناونوابنا واياكم والتدخل فى شؤننا وحياتنا مره تانيه 1والا سنكشف عنكم السرارئر ونهتك الستائر ونعرف الشعب المصرى ماهى حقيقة اسراء واخواتها عملاء القاعده ومنظمة ايتا الانفصاليه والجيش السرى الايرلندى وكذلك لن ننسى دورها فى مساعدة ( الحمير الحمر)؟؟ اسف نسيت احط نقطه على الحاء ؟؟؟ اى خدمه يااخ مش مهم نهق انت واحنا وراك"
