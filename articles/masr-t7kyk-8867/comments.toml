text = "نسأل الله ان يفرج همك<br />استعينى بالله واسالى الله ونحن نساله معك ولا تطلبى استغاثه من احد الا الله<br />فمن من اتكل على نفسه كلّ ومن اتّكل على ماله قلّ ومن اتّكل على عقله ضلّ ومن اتّكل على غيره ذلّ<br />واعلمى انما النصر من عند الله فالله هو القوى وهو المعيين<br />قال الله تعالى: {واصبر وما صبرك إلاّ بالله}(1).<br />وقال سبحانه: {واصبر على ما أصابك}(2).<br />وقال الله تعالى: {واستعينوا بالصبر والصلاة}(3). فجعل الصبر معونة على الصلاة، بل هو معونة على كل طاعة، وترك كل معصية وبليّة.<br />وقال سبحانه: {وبشّر الصابرين}(4) يعنى بعظيم الثواب وحسن الجزاء، وأوجب صلاته ورحمته عليهم، فقال: {الذين إذا أصابتهم مصيبة قالوا انّا لله وانّا إليه راجعون * اولئك عليهم صلوات من ربهم ورحمة واولئك هم المهتدون}(5).<br />وقال سبحانه: {سلام عليكم بما صبرتم فنعم عقبى الدار}(6).<br />____________<br />قال تعالى: (وتوكل على الله وكفى بالله وكيلا.)<br />· قال ذو النون : هو ترك تدبير النفس ، والانخلاع من الحول والقوة وإنما بقوى العبد على التوكل إذا علم أن الحق سبحانه يعلم ويرى ما هو فيه.<br />· قال بشر الحافي : يقول أحدهم : توكلت على الله ... يكذب على الله ..لو توكل على الله .. رضي بما يفعل الله.<br />· قال بعضهم : التوكل : التعلق بالله في كل حال.<br />قال بشر بن الحارث : أما تستحي أن تطلب الدنيا ممن طلب الدنيا؟ اطلب الدنيا ممن بيده الدنيا.<br />قال يحيى بن معاذ : من طلب الفضل من غير ذي الفضل غرم وإن ذا الفضل هو الله تعالى : ( إن الله لذو فضل على الناس).<br />قال الإمام أحمد رحمه الله : وجملة التوكل : تفويض الأمر إلى الله جل ثناؤه والثقة به.<br />وذكر إن الذكرى تنفع المؤمنين"
