subject = "مرحبا بك اسراء في عالم المجد والشهرة"
author = "مش لازم"
posted = "2008-04-24"
text = "معلش يا ستي علقه تفوق ولا حد يموت<br />بس بأه الاش اش لما تخرجي من السجن بقا ودا لازم حيحصل<br />حتبقي حاجه تانية<br />حتبقي شخصية تانية<br />حتبقي اشهر من المرشد العام وايمن نور ورفاعة الطهطاوي وذكي جمعة ومنيرة المهدية وعادل امام وابو تريكا وعمر خالد ومحمود الخطيب<br />مبروك يا بنتي الف مبروك وعقبال عندنا<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />(هذا رايي وانا حر في رايي ورأيي غير ملزم لاحد)"
