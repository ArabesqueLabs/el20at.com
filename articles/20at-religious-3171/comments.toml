subject = "النصر للإسلام والموت للظلم"
author = "drsalah_hanie"
posted = "2007-02-04"
text = "أشكرك أخى \"كامل\" على الموضوع وأعتقد أن القرآن الكريم كان ينبغى الاعتناء به قبل ذلك بفترات كبير فانا أتعجب كيف لم يترجم القرآن الكريم غلى كل لغات العالم حتى الآن ومن هو المسئول عن هذا الإهمال فى حق كتاب الله تعالى مع أن الرسول صلى الله عليه وسلم بعث للعالم أجمع لذا فمع إعتقادى أنها شىء جيد إلا أنها جاءت متأخرة جدا خاصة أن الشعب الجزائرى ظل تحت الاستعمار فترات طويلة جدا كما أنه عانى من بعض الاتجاهات التى فهمت الإسلام فهما خاطئا ففجروا وقتلوا هنا وهناك باسم الدين _ والدين منهم براء_ فأصبح الكثير من الشعب الجزائرى بمنأى عن الدين لذا كنا نحتاج إلى الدعوة إلى الإسلام الحق وترجمات القرآن منذ فترات طويلة جدا خاصة وأن المنصرين أصبحوا يستغلون الجهل بالإسلام فى الدعوة إلى دينهم المحرف ."
archived = "2010-03-14"
