text = "الإمام لم يخطيء الا في شيء واحد ، انه فضح الميت وهو لا يملك دليلا على انه لا يصلي ... اما انه اعترض ورفض الصلاة عليه فلا أرى شيئا في ذلك ! أليس هذا ما فعله الرسول صلى الله عليه وسلم ..!<br />لكن أن يفضح الميت وهو لا يملك دليلا (او حتى ان كان يملك ما يدل على ان ذلك الميت لا يصلي) ، فما كان ينبغي عليه -كمسلم قبل ان يكون امام مسجد- ان يفضح اخاه المسلم .."
