subject = "تصرف خاطئ"
author = "سعودي"
posted = "2007-01-23"
text = "هذا تصرف لا يليق بإمام أبدا، لقد قام الرسول صلى الله عليه وسلم لجنازة يهودي وهي مارة عليه احتراما لقداسة الموت، فما بالك بهذا الإمام الذي فضح الميت وأهله<br />ثم أنه لم يتحقق من صدق كلام من أبلغه من أدراه، ثم لا يوجد في زماننا هذا من يترك الصلاة جحودا ، وهناك الكثيرين يتكونه تهاونه وكسلا، انا لا أدافع عنهم لكن لو عمل كل الأئمة مثل هذا الإمام لن نصلي على ميت"
