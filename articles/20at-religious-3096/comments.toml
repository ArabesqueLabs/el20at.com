[[comments]]
order = 8
subject = "لما احنا مش حنصلي حنقول ايه لربنا"
author = "احمد محمد"
posted = "2007-04-07"
text = "بسم الله الرحمن الرحيم<br />الحمد لله الذي خلقنا مسلمين و هدانا و لم نكن لنهتدي لولا أن هدانا الله و الصلاة و السلام على حبيبنا المصطفى محمد صلى الله عليه وسلم و على أله وصحبه أجمعين و بعد<br />هذا المقال كتبه احد علماء المسلمين و قرأته له و أحببت ان اشرككم به<br />و إن شاء الله يتقبل إحسانكم<br />عقوبة تارك الصلاة في الدنيا و الآخرة<br />من تهاون في الصلاة عاقبه الله بخمسة عشرة عقوبة<br />ستة منها في الدنيا و ثلاثة في القبر<br />و ثلاثة عند خروجه من القبر<br />أما الستة التي تصيبه في الدنيا :<br />1-ينزع الله البركة من عمره<br />2-يمسح الله سيم الصالحين من وجهه<br />3-كل عمل يعمله لايؤجر من الله<br />4-لا يرفع له دعاء إلى السماء<br />5-تمقته الخلائق في الدار الدنيا<br />6- ليس له حظ في دعاء الصالحين<br />أما الثلاثة التي تصيبه في القبر :<br />1-انه يموت ذليلا<br />2-انه يموت جائعا<br />3-انه يموت عطشانا ولو سقي من مياه بحار الدنيا ما روى عنه عطشه<br />أما الثلاثة التي تصيبه يوم القيامة :<br />1-يسلط الله عليه من يصحبه الى نار جهنم على جمر وجهه<br />2-ينظر الله تعالى اليه بعين الغضب يوم الحساب و يقع لحم وجهه<br />3-يحاسبه الله عز وجل حسابا شديدا ما عليه من جهد<br />ويأمر الله به إلى النار و بئس القرار"
archived = "2010-03-14"
capture_url = ""

