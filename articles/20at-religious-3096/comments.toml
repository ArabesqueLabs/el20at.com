subject = "ده اللي ناقص كمان\"هذا عن رأيهم... فماذا عن رأ"
author = "محمد السيد"
posted = "2007-01-23"
text = "والله ؟؟..........<br />رأينا إحنا ؟؟........<br />مكنتش أعرف إننا شيوخ كمان ....<br />في مواضيع بتجيبوها الحقيقة .... بيكون ملهاش أي لازمة ...<br />وخصوصا لما تكون فيها فتوي دينية .....<br />إنتو عايزينا نمسك في خناق بعض يعني ؟؟؟ وكل واحد بعمل شيخ ؟؟؟<br />زي بالظبط موضوع حد الردة .... مفيش أي فايدة حتعود علينا من الموضوع ... غير إن كل واحد بفتي بمزاجه ....<br />وفي آخر .. ننتظر رأيك ؟؟؟ رأيي أنا ؟؟؟<br />قدموا سبب أو فايدة واحدة لمواضيع زي دي ...مش بأتكلم عن طرحها ...بأتكلم عن مناقشة شرعيتها .... حلال أ حرام ...<br />بس برضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
