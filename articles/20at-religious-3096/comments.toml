text = "و ما يعلم الغيب اِلا الله و من اِين تيقن الأمام أن المتوفى لا يصلى ؟ و ربما كان الميت كافرا جملة و تفصيلا<br />و لكن الله هو الغفور ذو الرحمة فمن أين أتى الأمام بأن الله لن يغفر لمتوفى ؟<br />حسبى الله على المحسوبين على الأسلام و المسلمين"
