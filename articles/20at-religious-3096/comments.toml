[[comments]]
order = 3
subject = "اللهم اغفر له وارحمه ياغفور يارحيم"
author = "محمد سالم"
posted = "2007-01-23"
text = "اللهم اعفر له وارحمه يارب ....والهم اهله الصبرعلي مصيبتهم يالطيف ياخبير<br />*** ليس غريبا ان يحدث هذا الفعل في عالمنا الاسلامي اليوم ...وخصوصا عندما يكون الحدث في مدينة القصيم....منبع الفكر المتطرف<br />**اكثر مايؤلم في هذا الموضوع ماسيتركه هذا الفعل الاحمق ..في نفسية اهل المتوفي خصوصا وقد انتشر الموضوع ليصل الي وسائل الاعلام<br />*** استغرب ماتحمله بعض النفوس من غلظة في القلب ...وانغلاق وجمود في الفكر....من اين ياتي هؤلاء الشيوخ بدينهم...عن اي شيطان يلهمون فتاويهم<br />*** هل اصبحنا في عصر محاكم التفتيش الاسلاميه ...او بالاحري ..محاكم التفتيش الوهابيه ...التي تمنح الناس صكوكا للجنه والنار<br />**لاحول ولا قوة الا بالله العلي العظيم"
