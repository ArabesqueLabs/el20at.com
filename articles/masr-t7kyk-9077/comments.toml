[[comments]]
order = 1
subject = "الطبيب المصري اصبح جزارا ومستثمرا"
posted = "2008-05-15"
text = "الطبيب المصري (الا من رحم ربي) اصبح انسان اناني وهو طالب كان يذاكر بجنون حتى يصبح طبيبا ليحل مشكلته الاقتصادية وبعد تخرجه يستثمر في المرضى والمرض وما ذكره المقال غيض من فيض فالاطباء لهم فضايح تماما كضباط الشرطة<br />وعلى ما يبدو يا اخ محمد السيد ان فضايح الاطباء بحاجة الى موقع الكتروني خاص<br />والى الاخ اللي فوق المعلق السابق ما تتكلمش كلام انت مش فاهم معناه ولا عارف مصدره"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "مهن فقدت معناها"
author = "مش بحبك"
posted = "2008-05-15"
text = "الطبيب من ملاك الرحمة الى مستثمر وجزار وبتاع نسوان<br />الضابط من حامي الوطن الى ( اسلام نبيه)<br />المدرس انما بعثت معلما الى جامع للاموال من الدروس الخصوصية<br />الرقاصه من فن الرقص الى فن الدعاره<br />الصحفي من انسان محترم الى اي حاجه تجيب فلوس<br />الممثل من فنان الى الا من رحم ربي<br />وقس على ذلك كل المهن<br />جزارين بيستثمروا في شعب مصر الغلبان"
archived = "2010-03-14"
capture_url = ""
