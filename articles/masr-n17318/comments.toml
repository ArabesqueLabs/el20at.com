author = "ريهام"
posted = "2008-09-04"
text = "ااكشف الطبى قبل الزواج سلاح زو حدين السلاح اليجابى انه بيخلينا نعرف كل حجة عن الشخص اللى هانكمل عمرنا كله معاه و لو لقدر الله طلع مريض يبقى عندنا الفرصة اننا نختار اننا نكمل او لا مش نبقى قدام الامر الواقع بعد الجواز و الجانب السلبى ان معظم الشباب رفضينة بسب الامكانيات اللى هاتتصرف على الكشف الطبى مش كفاية مصاريف الجواز اللى مش عارفين يجبوها منين انا راى ان الموضوع يكون بالاتفاق بين الزوجين مش يكون قاانون اجباارى"
