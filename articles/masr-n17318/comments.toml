[[comments]]
order = 0
subject = "هو القانون دة طالع من انهو مجلس"
author = "مش لاعب"
posted = "2008-08-21"
text = "ان كان القانون دة طالع من عند مجلس الشورى فهو انحرق والحمد وللة<br />وان كان طالع من مجلس رجال الاعمل ( الشعب سابقا) فهمتكم يا شباب - بسرعة عايزين حريقة تخلص علية<br />كل 3 ايام قانون<br />الحاج فتحى نشيط خالص وبيدوروا على اغى حاجة تعكنن ام الناس<br />طيب انا مش هكشف نفسى قدام اى واحد<br />وهتجوز رغم انف ام القانون<br />هتجوز عرفى<br />هية ضحكت عليك ياعم فتحى - اظن عرفى مفيش فية كشف والعرفى حلال برضة وهسجل العرفى فى الشهر العقارى<br />ما يعملوا قانون لمكافحة البطالة - لمعاملة رجال الشرطة للناس<br />قرف"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090635/http://masr.20at.com:80/newArticle.php?sid=17318"

