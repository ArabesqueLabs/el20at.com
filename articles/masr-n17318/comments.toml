[[comments]]
order = 6
subject = "قانون خاص با لارسوذكس لان مفيش طلاق عنهم"
author = "مش قايل"
text = "حوالى 65 الف حالة طلاق امام المحاكم من طائفة الارسوذكس فى مصر منها حالات بنت عندها 25 سنة اتجوزت واحد من الطائفة عاجز كليا عن ممارسة الجنس - راحت الكنيسة قالوا لها لا طلاق الا لعلة الزنا - البنت تعمل اية - مفيش طلاق<br />طبعا فى الحالة دى يبقى الكشف الطبى مطلوب وبشدة<br />البنت تعمل اية والدنيا قفلت فى وشها - راحت الدير وترهبنت ودفنت نفسها بالحياة<br />على فكرة محدش يقول على النصارى اقباط - لان الاقباط هم سكان مصر ايام الرومان وهى كلمة رومانية والانبا بيشوى اللى بيخرف بيقول لك الاقباط اللى اسلموا يعنى احنا المسلمين مش مصريين - هو بس اللى مصرى وهو اصلة يا يهودى يا رومانى من الجالية الرومانية اللى كانت فى مصر قبل الفتح"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090635/http://masr.20at.com:80/newArticle.php?sid=17318"

