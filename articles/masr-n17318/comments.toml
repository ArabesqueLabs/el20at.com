[[comments]]
order = 11
subject = "خليكم ساكتين وخدو بالجزم وقولو كمان فهمتهم ولا لسة"
author = "وليد الجابر ى"
posted = "2008-09-28"
text = "انا عن نفسى بقول ان الحكومة مش لاقية حاجة تقولها لان لو فى ظروف صحية فى الشباب سواء الراجل ولا الست فدة من البلاوى اللى بتدخل البلد من كيماويات ياترى دلوقتى مين شاب يقدر ياكل بيض بلدى بالسمنة البلدى عارفين لية لان الخراب بايد اللى مسكين البلد انا باقول وافضفض باللى فى قلبى ولا حياة لمن تنادى وانا عارف بكدة لكن بجد كلة ساكت وبيدورو على اى حاجة تخنق الناس علشان محدش يقول انا عايز وعايز اذاى يديلك فرصة تفكر بحقوقك اللى للاسف من حق كل مواطن مصرى اية اللى بنستفيدة من اللى بيدخل للبلد والله انا عن نفسى باكرة مصر بحكمها لانهم هما اللى كرهونا فيها بسبب الزل اللى عايشينة فى بلدنا اللى المفروض تكون بلدى لكن للاسف كل التقدم ولا الفلوس ولا الاطيان مش لينا للى بيحكموها وبس وكمان الاجنبى اليهودى عايش فى بلدى وواخد اكتر من حقة بل حقنا جميعا ولو جيت تتكلم يقولك دة ضيف عندنا ودة كرم المصرى المصرى اللى من كل اللى بيحصل فينا فى بلدنا بيسافر ومش عايز يرجعلها تانى ابدا من حلاوتها وزلها وكرامتة اللى بتتهان فيها بل بالعكس الواحد لما بيروح اى بلد بتاخد حقك اكتر من اى حد تانى مش زى بلدنا الحبيب المواطن ياخد على قفاة والضيف يعيش بجزمتة فوق راقبينا وهى دى الحقيقة اللى كلة مش قادر يعترف بيها ياترى الغلاء وكل اللى بيحصل فينا دة عدل ولا بيعملوا الشئ اللى يخليك ماتقولش عايز ذيادة لان مفيش فى قلبة رحمة اللى عمل موضوع الغلاء وللاسف انة صورة فقط وليس برجل ان يفعل ذلك لانة ماعندوش رأفة ان فى ناس مش قادرين على ثمن الرغيف الحاف لكن هانقول اية ظلم وجشع بس كل اللى اقدر اقولة هانتقابل يوم الحساب ان شاء الله وهاخد منك كل اللى انا عايزة بحق وعدل ربنا وساعتها ولا حد هاينجيك من الشعب المظلوم وياريت تتعظ وتعمل خير قبل ما تقابل الوجه الكريم لكن للاسف اللى زيك مفيش فى قلبة نقطة ولا ذرة رحمة لانك مش انسان ولا هاقول غير كدة لان اللى غير كدة بيحسو بردو لكن انت للاسف مش انسان ولا غيرة انت شيطان حسبى الله ونعم الوكيل فيك وربنا يرينا فيك يوم وقريبا هانسمع عنك خبر يفرح جميع الشعب بظلمك لية وكلاب الحراسة اللى حواليك ونظيف اللى غسل الدولة ونظفها اكتر من اسمة النظيف عوضنا على ربنا فى هذا البلد وخيرها . كفاية كدة لكن لو قعدت اكتب انا ممكن اكتب للصبح ومش هاحس بالوقت لان جوايا اشياء لا احد يتوقعها تجاة المحنكين الذين يرؤسون البلد وغيرهم والذين حولو جميع اموالهم لبنوك سويسرا وغيرها ربنا يورينا فيك يوم انت واسرتك بالكامل انا اسف ياجماعة انى فتحت على العاشر بس كل شئ بيعملوة بيكون ضدنا مش من مصلحتنا واسف انى طولت عليكم واحبطكم بهمى وهم كل مواطن مصرى مظلوم ومجرد من حقة كانسان فى بلدة."
archived = "2008-10-25"
capture_url = "https://web.archive.org/web/20081025231539/http://masr.20at.com:80/newArticle.php?sid=17318"
