[[comments]]
order = 2
subject = "جريمة فساد ادارة الدولة - وضياع 80 مليون جنية مصثر"
author = "السبع افندى"
posted = "2008-08-22"
text = "تونس حققت ميدالية ذهبية<br />والبحرين اللى تعدادها 400 الف نسمة حققت ميداليتين ذهبية<br />ومصر اللى تعدادها 80 مليون نسمة حققت ميدالية برونزية واهداها صاحبها الى الملهم صاحب الضربة البدنجانية فى هو التخلف العميق<br />وصرفت البعثة المصرية فى بكين 80 مليون جنية مصرى بالتمام والكمال<br />طيب رايحيين تهببوا اية وبعثة اية وعلم مصر اية وهباب اية<br />80 مليون جنية وترجعوا ببرونزية<br />فين ماما ظاظا<br />صوتى يا ماما ظاظا<br />80 مليون جنية كنا جبنا بيهم دقيق وعملنا عيش للناس اللى واقفة فى الطوابير<br />والا هى فتة والكل بيلهط<br />مين المسئول فى البلد دى<br />الرئيس طربأها"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090635/http://masr.20at.com:80/newArticle.php?sid=17318"

[[comments]]
order = 3
subject = "النظام المصرى المرعوب والمرعوب جدا"
author = "من الاسماعلية"
posted = "2008-08-22"
text = "انا من الاسماعلية<br />لو فية مركب امريكانى وما اكثرهم اليومين دول ماشية فى الفناة - الاسماعلية تحاصر بقوات الشرطة والجيش ولو واحد قرب من شط القناة او ماشى على الكورنيش ينضرب علية نار ومالوش دية<br />هى الحكومة عايزة اية<br />تهجر اهل الاسماعلية<br />تمشى المصريين من هناك وتجيب يهود<br />يا نظام مصرى منهار انت خايف من اية<br />مرعوب من اية<br />انت حاسس انك مش شرعى<br />بقتعملوا دة لية"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090635/http://masr.20at.com:80/newArticle.php?sid=17318"

[[comments]]
order = 4
subject = "محافظة كفرالشيخ"
author = "محمد جلال"
posted = "2008-08-22"
text = "والله ياشباب لما قرأت التعليقات قلبتو عليا المواجع وفكرتوني بحال البلد اللي بيرجع لوره كل يوم بقعد مع نفسي الف وادور ادور على الحل اقول الحل هو الديموقراطيه السليمه ذات المرجعية الاسلاميه ننتخب اللي نشوفو يصلح من اي من افراد الشعب والانتخاب يكون متاح لجميع من تتوفر فيهم النزاهه وتخالفهم الشوائب مش خيالات مئاته رؤساء احزاب صوريه والرئاسه تبقى اربع سنين والريس ليه مدتين بس وبعد كده يخدم البلد زي اي مواطن عادي مش ملكيه وتوريث والمحافظين كمان يبقو بالانتخاب ومدراء العموم يبقو بالانتخاب وكل مماهو عام من الناس وللناس يبقى بالانتخاب يااااااااااااااااااه لو كل ده يحصل دا البلد تبقى غير البلد في عشر سنين اصحى على فكره مزعجه وهي ان الشعب تعم فيه مشكله و انا لا اعمم ان نسبه لا بأس بها مغيبه وهي ولا على بالها بتبص قدامها بس لا يعرف نائب مجلس شعب ولا ليه في السياسه وان كانو حتى الساسه دول هما اللي مجوعينو ومشحططتينو ومدوخينو ورا لقمة العيش وبصينلو فيها كمان بضرايب ورسوم ودمغات دي السرقه الرسمي والاكراميات والرشاوي دي السرقه من تحت لتحت لما با نكظر للفئه دي اقول ياد يا محمد يمكن دول يستاهلو اللي يجرالهم وبيهم البلد بترجع لوره فعلا فعلا ماهو الريس ولو انو هو اللي خاربها مش هو اللي قال الموظف عامل الناس باستهار ولا اشتغل من غير ضمير ولا ادفع رشوه ولا خد رشوه احنا بردو علينا الحق والاخر علشان الموضوع ما يطولش مني الشعب قدامه مشوار طويل لحد ما يف على رجليه والبنى بيبدأمن تحت وحسبي الله ونعم الوكيل في كل ايدي هادمه والسلام لكل الاخوه الاحباب نور مصر وأملها"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090635/http://masr.20at.com:80/newArticle.php?sid=17318"

