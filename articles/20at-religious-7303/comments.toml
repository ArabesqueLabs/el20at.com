[[comments]]
order = 1
subject = "المغرب بلد مسلم وبه اهل الله قبل اي شيء اخر"
author = "محمد المغربي"
posted = "2007-10-11"
text = "مسابقة تجويد القران الكريم<br />كما ان من اهم ايضا مايميز الاجواء الايمانية الرمضانية ويعطيها نكهة قرآنية خاصة هي تنظيم مسابقات في حفظ وتجويد القر آن الكريم على طول ربوع أقاليم المملكة المغربية وخاصة في اوساط الاطفال والشباب من الجنسين معا.ولعل اهم هذه المسبقات برنامج مواهب في تجويد القران الكريم والذي ترعاه وتبثه القنات الثانية بمشاركة مع وزارة الاوقاف والشؤن الاسلامية والذي يلقى اقبالا متزايدا من طرف الجمهور عليه وهو برنامج اثبت نجاحه وتفوقه ثمتل نجاحه على سيبل المثال لاالحصر في جلب المزيد من المتفرجين لهذه القنات ذات الطابع الفرنكو فوني والتي اصبحت تعاني من قلة المشاهدين امام التدفق الاعلامي العالمي .<br />وتختتم هذه المسابقة كغيرها من المسابقات في باقي الجهات والاقاليم في يوم السابع والعشرين من رمضان وذلك بالاعلان عن الفائزين الثلاثة ، وقد اتبث البرنامج نفسه في خريطة برامج القنات الثانية وهو ما يعبر بحق وصدق عن مدى اهتمام المغاربة بالقرآن الكريم.<br />ففي تعليق لاحد الشباب على هذه المسابقة يقول :ان هذا البرنامج هو فرصة لتتبع اطفال وشباب المغرب وهم يتنافسون ليس لترديد الاغاني ورقصات الهيب هوب ولكن لتلاوة القران الكريم الذي تقشعر له الابدان عند سماعه عضا طريا على السنة هؤلاء المواهب ذات الاصوات المؤثرة والشجية وهي المواهب التي يجب علينا ان نعتز ونفتخر بها سواء في القراءة المغربية او المشرقية.<br />اخفاء ليلة القدر<br />اذا كان الاعتقاء السائد عند المسلمين عامة والمغاربة خاصة ان ليلة القدر تكون يوم السابع والعشرين فان الكثير منهم يعلم انها مخفية في العشر الاواخر من رمضانوان يومها غير معروف وانما لها صفات لذلك تجد اولي العزم والايمان يصرحون ان لله حكمة بالغة في إخفائها عنا، فلو تيقنا أي ليلة هي لتراخت العزائم طوال رمضان، واكتفت بإحياء تلك الليلة، فكان إخفاؤها حافزًا للعمل في الشهر كله، ومضاعفته في العشر الأواخر منه، وفي هذا خير كثير للفرد وللجماعة.<br />وهذا كما أخفى الله تعالى عنا ساعة الإجابة في يوم الجمعة، لندعوه في اليوم كله، وأخفى اسمه الأعظم الذي إذا دعي به أجاب؛ لندعوه بأسمائه الحسنى جميعًا.<br />احياء الليلة بالصلاة<br />بمجرد ان تنتهي من وجبة الافطار بعد يوم من الصيام عليك ان تسرع الى اقرب مسجد الى حيك اوعند قارئك المفضل اذ مما لاشك فيه ان قراءة القران على وجه الاتقان هي من الاسبابالباعثة على تقوية الخشوع في النفوس. .<br />حتى يتسنى لك الصلاة في بهو المسجد اما ان تاخرت فكن على يقين انك ستصلي على الرصيف المفروش بالحصير او في وسط الطريق وبالتالي سيضيع منك الخشوع والطمانينة نتيجة الضجيج ولعب الاطفال الذين يرافقون عائلاتهم الى المسجد .هذه هي احوال كثير من المصلين في هذه الليلة العظيمة المباركة كما وصفها القران ففي هذه الليلة عادة ما يختم الامام القران في صلاة التراويح يقول محمد الخطاب احد الائمة: لم يتبق لي الا ستة احزاب للختم لذلك سأقرا في كل ركعة بربع حزب وعند حوالي الساعة العشرة سنتوقف مع درس حول فضائل هذه الليلة \"وبعدها ينتناولالمصلون والفقراء واليتامى والارامل اللذين يحضرون الى المسجد وجبة الكسكس بالدجاج الرومي او البلدي او اللحوم الحمراء مزين بانواع الخضريبين التكافل والتضامن الاجتماعي في اوساط الشعب المغرب في مثل هذه المناسبات الغالية وكدى كؤوس الشاي التي اعدت خصيصا لضيوف الرحمان من طرف جيران المسجد والمحسنين ويضيف الامام \" تم بعد ذلك سناخد قسطا من الراحةحتى لاتمل النفوس وتكل وتتعب ويغيب القصد الذي من اجله اجتمع الناس في المسجد\" .هذا وتقوم في بعض المساجد بعض الفرق الانشادية الفردية والجماعية بتشنيف أذان المصلين بالمديح النبوي كما يجتهد المصلون في هذه الليلة بالدعاء والانابة الى الله منهم المتأوه ومنهم الخاشع الباكي على ما فرط في ما مضى من عمره او اقصر في ايام رمضان كما يتم احيا ءهذه الليلة بذكرالكلمة الطيبة لااله الاالله والتحميد والتسبيح والاستغفار وقراء اجزاء من القرآن استنا نا بسنة المصطفى الذي كان يحيي ليله ويوقظ اهله ويشد مازره.<br />ومن عادات النا س في هذه الليلة مخافة ان يفوتهم اجر ليلة هو خير من الف شهر من العبادة ان يأخذون قسطا من الراحة والنوم في المسجد ليقوموا للتهجد في ثلث الليل المتبقي و حاضرين بقلبهم وقلوبهم في الصلاة وعند دعاء ختم القران وصلاة الفجر لينفض الجمع بعد ذلك وكله فرح بما وفق اليه من عمل صالح في هذه الليلة التي لانوم فيها ولاكسل وانما تشمير وعزم وحزم واخلاص لله .<br />وضع الريحان على القبور في اليوم الموالي<br />لاتزال في بعض الارياف المغربية عادة موروثة ابا عن جد اذا يقوم الناس باحضار غصون واوراق الريحان الى المسجد ليصلى عليها تحت افرشته وذلك نية منهم بان تتعطر ببركة القران الكريم وتتنور بنوره ورحمته.لتاخدها النساء في صباح اليوم الموالي لتضعه على قبورالموتى من اقربائها ترحما عليهم.بعد استإجارفقيه يقرا ما تيسر من القران الكريم على تلك القبور ، وبعد ذلك يشرع المغاربة في تبادل التحية والتهنيء بمثل قولهم \"مبروك لعواشر\" وتقبل الله منا ومنكم وتشرع بعض الاسر في اخراج زكاة الفطرمالا او عيناوذلك حتى تتمكن الاسرة المعوزة والفقيرة من ادخال الفرحة الى بيوتهم وعلى قلوب ابناءهم .<br />هذه اذن هي التقاليد المغربية في احياء ليلة القدر والتي منها مايرتبط بالموروث الثقافي اوالبعد السكولوجي النفسبي او الاقتداء بالهدي النبوي المحمدي عليه الصلاة والسلام ، وآخر غريب عن ثقافة الامة وعقيدتها مرتبط بالشعودة والسحر والطقوس الكهنوتية."
