subject = "و ماااا أدراك ما ليلة القدر؟؟؟!!!!"
author = "عاشقة مصر"
posted = "2007-10-09"
text = "بسم الله الرحمان الرحيم<br />ليله القدر من دون شك هي اعظم الليالي التي تكرم بها الله تبارك وتعالى على عباده.<br />و الـــمــــغــــرب بلد مـــــــــــــــــــســـــلـــــــــم عــــــــــــــــربــــــــــــــــــــــــــــــــــــــي<br />اما جن وسحر و بخور فهذه مصطلحات تحتاج الي الكثير من التدقيق و التمعن اثناء استعمالها، خاصة، في مواضيع مشابهة و مناسبات مماثلة.<br />المغرب، الذي يضم مدينة فاس العريقة، من ناحية، هو كأي بلد مسلم واجب عليه الاستعداد لمثل هذه الليلة العظيمة، و من حقه الاحتفال بها. أما تلك المعتقدات أو الاعتقادات الخاطئة التي تسيطر على أهل البــــوادي خـــــــــــاصة فهي لطالما عرفت في مجتمعاتنا العربية و لازالت للأسف رائجة.<br />والصلاة والسلام على أشرف المرسلين."
archived = "2010-03-14"
