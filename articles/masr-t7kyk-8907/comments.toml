order = 1
subject = "من  هم شباب الفيس بوك"
author = "من الشعب"
posted = "2008-04-28"
text = "هم شباب الصفوة فى مصر<br />اولاد الناس الذين ورثوا مكان الطبقة الوسطى التى انتهت بحكم حسنى مبارك وحلت مكانها طبقة من رجال الاعمال الصغار واولاد العاملين فى اروبا وامريكا مما يتقنون الكمبيوتر وعندهم وفرة مالية<br />معظم هؤلاء الشباب طلاب فى الجامعة الامريكية والجامعة الالمانية والجامعات الخاصة بتاع اولاد الاثرياء<br />اتفقنا هم الطبقة الوسطى المصرية التى عادة ما تحمل هموم الوطن وتتصدر الدفاع عن قضاياة وتقود خلفها طبقات الشباب الفقير<br />بنت زى اسراء عبد الفتاح ابوها وكيل وزارة سابق رحمة اللة وامها وكيلة مدرسة ثانوى بنات ويعنى مرتاحة ماديا فى حياتها<br />وبما اننا اصبح لدينا طبقة وسطى فاطمئنوا فسيبدأ الكفاح الوطنى لتحرير مصر من الحزب الوطنى وقانون الطوارىء ومباحث امن الدولة وتزوير الانتخابات والبطالة والعنوسة وكلام كتير يقال<br />انتظروا الايام القادمة<br />فالبلد اصبحت على اصبع وليس كف عفريت"
archived = "2010-03-14"
capture_url = ""
