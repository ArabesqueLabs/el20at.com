[[comments]]
order = 0
subject = "عمرو"
author = "سمير"
text = "عمرو اديب شخصية ظريفة وذكية وعنده كاريزما عالية وان كان بعض الناس شايفينه بيزمدها شوية الا ان لاخلاف على انه انسان ناجح جدا<br />سمير<br />http://samir-fun.blogspot.com"
archived = "2007-05-13"
capture_url = "https://web.archive.org/web/20070513030201/http://masr.20at.com:80/newArticle.php?sid=10165"

[[comments]]
order = 1
subject = "هنتريش بأجنحه محلق"
author = "نيفين نيفى نوفا"
text = "عمرو اديب فعلا من انجح و اشهر الاعلاميين ف العالم العربى<br />ومهما اختلف الناس عليه يظل عمرو هو المتصدر و برانامجه لاكبر نسبه مشاهده حتى بعد ما سابت نرفانا البرنامج قدر عمرو يحافظ على نسبه المشاهده لان هو لوحده كفايه<br />انا عن نفسى نادرا ما بفوت حلقه من القاهره اليوم و و بعتبر عمرو المذيع المفضل ..ده غير خفه دمه الا متناهيه<br />بس مش حلقه الشردوحه دى قديمه شويه يا عشرينات"
archived = "2007-05-13"
capture_url = "https://web.archive.org/web/20070513030201/http://masr.20at.com:80/newArticle.php?sid=10165"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "كتكوتة"
text = "انا رايي ان البرنامج اصبح انجح عندما غادرته هذه النرفانا اللي كانت منرفزانا والحمد لله لم يحتملها البيت بيتك كثيرا ونتمنى الاتطل علينا من شاشة اخرى نحبها حتى لاتضيع علينا متعة المتابعة<br />اما عمرو اديب فهو ماشاء الله عليه ربنا يخليلنا لسانه اللي بيقول اللي احنا عيزينه ولكن انا اعترض على كلمة شردوحة فهي ارى انها لاتليق فنحن ننتقد ولكن بدون تجريح وشكرا"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125324/http://masr.20at.com:80/newArticle.php?sid=10165"
