order = 0
subject = "ضع عنوان التعليق"
author = "مش البراء اشرف ولا عبدالله الطحاوي"
text = "با بنت الحاج عبدالفضيل<br />ما انا قلتلك قبل كده في موضوع سمية الخشاب<br />قلتلك الموضوع مادي بحت<br />والناس دي ما بيهمهاش غير الفلوس<br />وهي وسمية الخشاب مستعدين من بكره الصبح يمثلوا دور رابعة العدوية او اي شخصيات دينية تعدبك بس للي يدفع"
archived = "2008-06-27"
capture_url = "https://web.archive.org/web/20080627192524/http://masr.20at.com:80/newArticle.php?sid=16493"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
text = "صلاح الدين ؟؟؟؟ ايه العلاقة ؟؟؟؟<br />وايه حتتة انا مش حلوة ومش بستهدم انوثتى وبتاع ... لا مفيش ممثلة تقول كدا , الشعب دلقتى عاوز يشو اى جسم وخلاص مبقاش يركز فلجمال دا اولا . وبعدين يا فنانة انتى مترجيش من سؤال على حساب نفسك.. فهمانى؟ كا يبقى ردك افضل بجرائة لو تقولى اه هو الدور عاوز كدا واللى مش عجبه يشد فحوجبه .. متهربيش<br />هممم على فكرة هى غشيمة فردودها شوية ... انصحها متتكلمش كتير مع الصحافة لإنها طيبة اوى , على نيتها واللى على قلبها بتقوله ... والشعب بقى واعى حبتين فبلاش منه احسن"
archived = "2008-08-04"
capture_url = "https://web.archive.org/web/20080804105258/http://masr.20at.com:80/newArticle.php?sid=16493"
