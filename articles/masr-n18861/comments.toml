subject = "على راس كل شركة لواء متقاعد وبقت الشركات مكان لنهاية خدمة العسكريين - وعلشان كدة بتخسر وافضل بيعها"
author = "مصرى"
text = "شركات اية<br />يا عم بيعوها وريحونا<br />انتم عايزنها تكسب وعلى راسها لواء جاى يخم لة سنتين قبل المعاش<br />بيعوا بلا شركات بلا هم<br />مش خربتوها"
