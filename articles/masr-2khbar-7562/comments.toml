[[comments]]
order = 1
subject = "حلم ولا علم"
author = "سويسى"
posted = "2007-11-12"
text = "ايه ده يا اخونا ..يعنى حصحى فى يوم الاقى نفسى فى هونج كونج ولا بكين و حى الاربعين يبقى سنغهاى و الاقى العجل والطواقى الصينى رايحة جاية عينى عينك واروح اشترى الفول والطمعية من عند عم عبده شونج والخضار من عند ام متولى سنج ..يا حلاوة يا اولاد ..بس احنا السوايسة اللى مش لايقين شغل واللى الوظائف بتروح بقدرة قادر لشباب من محافظات مجاورة عشان قرايب فلان الفلانى اللى شغال فى الادارة واللى مع احترامى ليهم بياخدوا حق ولاد البلد فى الوظائف<br />دولقتى حنلقيها من دول ولا من الصينين اللى جايين يزحمونا فى البلد اللى متر فى متر ..الله يخرب بيتك يا حسحس"
archived = "2010-03-14"
