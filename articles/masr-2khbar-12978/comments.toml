text = "هم عملو كده عشان نشترى اللمض الموفرة بتعتهم ويعدو يبيعلنا فرش سنااان بقى و دوالييب دى حكومة دى وللا هايبر ماركت دول هيبر حكوومة انا جوايا كلاام كتيير قليل الادب بس لازم الواحد يتكلم بحترام عشان الناس تسمع هنعمل اييه احنا متسائيين لااازم احنا اللى نسووووق دى عربيتنا احنا مش عربيتهم هما موضوع فاتورة الكهربا دا مفيش حاجه تجبر المواطن يدفع فاتورة لاتساوى القيمة الاستهلاكية الحقيقية دى اسمها نصب على فكرة ده مش الراجل ده بس فى نااس كتير جياالهم بقييم اعلى بكتيير من الطبييعى حسبنا الله ونعم الوكييل وبعدين هم بيطللعو الفاتورة بناءا على اييه العدااد محدش بيبص هو مشى كام كييلو كل شهر ويعد يطرح وحسب دى بالشروة فبركة عااالم تعباانة"
