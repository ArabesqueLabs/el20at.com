text = "يا حمار قبل ما تتكلم على الشيخ القلاني وتقول عليه مجمل لوجه السعوديه لازم تعرف إن الراجل ده اتسجن في السجون السعودية لا لشيء وإنما لأنه لا يخشى في الله لومة لائم ، واحذر يا ( فسل ) فلحم العلماء مر . ( دا انت طلعت انسان وضيع وصفيق )"
