author = "المواطن مصري"
posted = "2007-10-02"
text = "التعليق بقى شخصيا القرنى دة بيبيع اية ؟ دة واحدمن ??وهدفة الاساسى تجميل وجهة السعودية القبيحجدا والملطخ ولا استبعدان يقوم بدعوة الشباب العربى المسلم للجهاد اقصد الارهاب فهؤلاء الشيوخ لايعترفون بجهاد النفس ولايعترفون بسلطة اى حكومة فشعارهم الاساسى اضرب فى سلطة اى حكومة عربية حختى يكون الحكومة السعودية هيا الباب العلى للعرب<br />ظاهر للناس؟"
