subject = "كس أمكو يافلسطيزيه على راسو لزبي يلعن شرفكو يا بلج"
author = "محمد نواف"
posted = "2008-09-20"
text = "كس أمك يافلسطين كس أختك يافلسطين .. ينعن شرفك يافلسطين أبوكي على أمك يافلسطين<br />بدي أنيكك وأنيك بناتك ونسوانك كلهم . بدي أنيك أخت القدس أنا . شراميط منايك حيوانات عاهرات داعرات عرصات قحبات<br />ينعن أبو زلامك إذا كان فيكي زلام يافلسطينز (( طبعاً مافي كلكو مخانيث وشواذ وشغل لقلقه على الفاظي ))<br />ولكو ياحيوانات ياكلاب يانور ياغجر يابجم ياهوامل ياكسالى يااللي بعتو أرظكو وحطيتوها بظهور العرب كلهم ونحنا أولهم يابهايم العاده !<br />ولكو بعتوا أرظكوا . كس أمكو إذا كنتوا بتعرفوا إشي اسمو ((((((((((((((( وطـــــــــــــــــــــــــــــــــــــن )))))))))))))))))<br />الله ينعنكو من بين الناس والعالم . فظايح ومتخلفين وهبايل<br />وانا من موقعي هونه بناشد الشباب ألأردنية إنهم يعنعن أبو تعريص كساس وبزاز وطياز وشفايف خواتهم للفلسطيزيه أصلاً كلكو على بعظكوا يافلسطيزية بتيجوش ظفر واحد أردني .. ولك خذ ظفري واقسموا نصين ولما تقسموا نصين اقسموا كمان نصين وإذا بتصير قد ربع اظفري .. هنيالك هنيالك .. عليك وعلى اشي اسمو فلسططططططططييييييييييز<br />هع هع هع هع هع هع عه عهع هع<br />وعليهم يالربع عليهم .. انسفووووووووووووووووووووووووووووهم !"
