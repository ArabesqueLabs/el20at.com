subject = "اشترى لها فى دبى شقة بثلاثة ملايين درهم"
author = "vghf"
posted = "2008-08-10"
text = "يا حكومة الهجص الراجل دة دفع ضرايب للدولة قد اية<br />لما يشترى لفنانة شقة بالمبلغ دة - يبقى سفة ودة مال جمعة من الشعب المطحون فى طوابير العيش<br />يبقى عبد الناصر كان على حق لما امم فلوس الناس دى8<br />يشترى لفنانة شقة فى ابراج دبى بالملايين والناس واقفة فى طوابير الجوع يبقى اجرام"
