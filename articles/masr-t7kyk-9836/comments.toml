[[comments]]
order = 1
subject = "والمحروس بتاع السياسات"
author = "مطاوع"
posted = "2008-08-11"
text = "والمحروس بيتاع لجنة السياسات رجلة فى القضية ايضا<br />بيدفعوا ملايين علشان يقتلوا من فلوس العزبة<br />الموضوع مش هشام مصطفى دة جمال مبارك اللى عايز يحكم مصر<br />مش العصابة دى اللى مقرها فى ماخور شرم الشيخ وبيستدرجوا الفنانات هناك<br />مش هو دة بتاع مصر بتتقدم بينا<br />عصابة مجرمين بتحكم البلد لما البلد جاعت"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "فكر جديد للعبور للمستقبل جمال وصحابة يتوسعوا فى مش"
author = "بندق"
posted = "2008-08-11"
text = "لما الفساد يبلغ مبلغة ويبقى النهب والبلطجة سياسة مشروعة يتبناها جمال وصحابة المتنفذين المحظوظين فيبقى شى عادى انة واحد من اياهم يبعت حد علشان يقتل نفس بشرية او يصفى معاة الحساب يعنى اصابة اواعاقة اوترهيب ووعيد وعلى فكرة احمدعز لية مغامرات عاطفية وفضائح مع بعض العاملين بالوسط الفنى وحينكشف وينفضح واللى متدارى وفاكر نفسة فى الطراوة حيوقع على دماغة وانا بادعى ربنا انة يفضح كل واحد من الناس دول فى الدنيا والاخرة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "اسود ايام تعيشها مصر"
posted = "2008-08-11"
text = "لما يبقى ابن حاجب او فراش فى محكمة منوف يحكم مصر تبقى كبيرة قوى ولما مراتة بنت التمرجية البريطانية تبقى سيدة مصر الاولى - يبقى فية حاجات غلط<br />كانوا فى الجرة وطلعوا برة<br />يبقى فية افتراء على البشر<br />يبقى اللى يقتل 3 الاف فى العبارة براءة<br />يبقى اللى سرقوا بنك القاهرة براءة<br />يبقى نقتل ونعمل ليالى حمر والشعب عايش فى السواد وفى الطوابير وبيموت علشان رغيف العيش<br />يبقى الشباب يموت غريق على شواطىء اوروبا<br />والمومياء قاعد فى الشرم ياكل جمبرى ويتفرج على مايوهات السائحات فى بلاهة موروثة من اهلة<br />كان مالة الملك فاروق - كان فاسد وبتاع نسوان دلوقتى الفساد للركب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
