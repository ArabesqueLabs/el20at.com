subject = "نهاية القصة"
author = "شطة"
posted = "2008-08-11"
text = "نهاية التحقيق فى مصر الاتى<br />ضابط الشرطة القاتل عندة لوثة عقلية وتنتابة حالات نفسية متقلبة لايدرى ما يفعلة واودع مستشفى المجانين<br />- الحل الثانى ضابط الشرطة وجد مشنوقا فى زنزناتة بعد ان انتحر بشنق نفسة بملاية السرير<br />وسلم لى على المسئولين فى مصر وخللى كل لياليهم سوزان تميم وسوزان ث"
archived = "2010-03-14"
