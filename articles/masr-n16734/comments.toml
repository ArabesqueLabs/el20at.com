[[comments]]
order = 0
subject = "ازيك يا مروا"
author = "مش لازم"
text = "كويس خالص<br />وفيه فيلم جديد طلع اسمه (حسن ومرقص)<br />يا ليت تعمليلنا تحقيق عنه"
archived = "2008-08-04"
capture_url = "https://web.archive.org/web/20080804111402/http://masr.20at.com:80/newArticle.php?sid=16734"

[[comments]]
order = 1
subject = "ايوه يا عم ياسر ابو العلا يسهلك ربنا"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "إحنا<br />المدير التقني:-<br />ياسر أبو العلا<br />مدير التحرير:-<br />محمد عيد<br />المحررون:-<br />أحمد عبد الفتاح<br />أحمد عبد المنعم<br />أحمد خشبة<br />رانيا<br />محمد فوزي خلف<br />محمد عيد<br />محمد الدواخلي<br />مايا إيفانوفا<br />ياسر أبو العلا<br />ياسر خاطر<br />استضافة الموقع:-<br />تشكر (تحت الكوبري) د.(محمد عبد الحافظ) على استضافته (الغير محدودة) لنا<br />مؤسسو الموقع<br />ياسر أبو العلا – محمد عيد"
archived = "2008-08-04"
capture_url = "https://web.archive.org/web/20080804111402/http://masr.20at.com:80/newArticle.php?sid=16734"

[[comments]]
order = 2
subject = "مش الأهبل ولا العبيط"
author = "الى الأخ اللي فوقي"
text = "مش الأهبل ولا العبيط<br />مش الأهطل ولا الأهبل<br />مش الأرعن ولا المسطول......... ابقى مين؟"
archived = "2008-08-04"
capture_url = "https://web.archive.org/web/20080804111402/http://masr.20at.com:80/newArticle.php?sid=16734"

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "مدحت"
text = "و يا ترى ضربتى الموضوع ده من انهى موقع يا مروه"
archived = "2008-08-04"
capture_url = "https://web.archive.org/web/20080804111402/http://masr.20at.com:80/newArticle.php?sid=16734"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
author = "مدحت"
text = "وللعلم برضو حوار غاة عبد الرازق مضروووووووووووووووووووووب"
archived = "2008-08-04"
