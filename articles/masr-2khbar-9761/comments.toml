text = "اراد شاب صعيدى يتزوج بنت من بحرى فاعترض اهلها بشدة ووضعوا عقبات فى وجهة<br />عايزين شقة فى الزمالك - رد الصعيدى جاهزين<br />قالوا عايزين شبكة عشرة كيلوا ذهب<br />رد الصعيدى -جاهزين<br />عايزين الاثاث للشقة من باريس<br />رد الصعيدى - جاهزين<br />ولما غلبوا منة ومش عارفين يعجزوة قالوا لة<br />عايزين واحد بتاعة طولة مترين ونصف<br />رد اللصعيدى<br />حاضرين - نقصرة شوية"
