subject = "أقترح تعديله"
author = "اكتب اسمك هنا"
posted = "2008-08-01"
text = "الكشف بهدف الخلو من الأمراض فكرة رائعة ، ومن حق الجيل القادم علينا ، وهي مطبقة في السعودية منذ سنوات ولا يوجد فيها أي مشكلة ، فهو تحليل دم في النهاية ... أما لتحديد إن كان أحد الأطراف عقيما فهنا المشكلة الحقيقية ، هل نحكم على أحد الأطراف بالبقاء عازبا أو الزواج من شخص سبق له الزواج والإنجاب ، لأن الفحص أظهره غير قادر على الإنجاب ، ربما يجد حلا طبيا بعد الزواج .. لاحظوا هذا في مجتمعات يكثر فيها أصلا ظاهرة تأخر الزواج .."
