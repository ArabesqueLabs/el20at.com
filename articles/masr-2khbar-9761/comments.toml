order = 0
subject = "حل لطيف"
author = "عبد الله المصرى"
posted = "2008-07-31"
text = "نتجوز عرفـــــــــــــــــــــــــــــــــــــــــــــــــــــــى و نوثق العقد فالشهر العقارى و الناس الي بتطلع كل ربع ساعة قوانين<br />غير قابله للتطبيق تخبط دماغها فالحيط<br />و بعدين الموضوع ده هيفتح باب فساد علي ودنه الدكتور هيدى الجدع من دول الكوبايه و يقوله استمنى التانى هيقول<br />لا، مش علشان حرام لكن علشان مينفعش ده شئ يجرح كرامة اى رجل مصرى الا في حالة الضروره القسوه<br />المهم الدكتور هيقول طب فتح مخك يقوم الواد مطلع خمسين ولا ميه جنيه و يديها للدكتور عن طيب خاطر علشان<br />يطلع من الكمبيوتر اى تحليل سائل منوى سلبى علشان يسلمه للمئذون و لو طلع ما بيخلفش هيقولك خطأ فالتحليل<br />او المرض جد عليه بعد اجراء التحليل<br />و فالختام اقول ايها المصريون العرفى هو الحل"
archived = "2010-03-14"
capture_url = ""

