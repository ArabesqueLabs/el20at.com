[[comments]]
order = 5
subject = "الى المعلق السابق ... المسمي نفسه لي ملاحظه"
author = "ابومحسن غربة 27 سنه و30 سنه صح"
posted = "2008-08-01"
text = "لو انت قريت الموضوع كله الى اخر سطر كنت ريحت نفسك<br />بص اخر سطر في الموضوع مكتوب (نقلا عن جريدة الشرق الاوسط) يعني فيه امانة في النقل<br />ثانيا في اول الموضوع كاتبين اخبار ولاد البلد<br />انت عارف طبعا ان هذا خبر عام عن جمهورية مصر العربية بتبثه وكالات الانباء فكل جريمة مشتركة في وكالة الانباء من حقها ان تنزل الخبر كما اوردته وكالة الانباء<br />يعني ممكن خبر يكون في الاهرام ونفسه يكون في الاخبار ونفسه يكون في الجمهنورية او المصري اليوم او اي جريدة ثانية بنفس النص لانه مبثوث عن طريق وكالة الانباء<br />يعني حتى عشرينات لو ما كتبتش نقلا عن جريمة الشرق الاوسط موقفها سليم لان الخبر اصلا خبر مبثوث من وكالات الانباء<br />وشكرا"
archived = "2010-03-14"
capture_url = ""

