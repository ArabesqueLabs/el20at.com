[[comments]]
order = 3
subject = "ده كان لازم من بدرى"
author = "مش مخطوبة"
posted = "2008-08-01"
text = "إجراء التحاليل ده كان لازم يتعمل من مدة طويلة علشان المشاكل والأمراض الوراثية ده غير كمان حالات الإدمان عند البعض واللى لايتم إكتشافها إلا بعد مخالص يتدبوس فى إنجاب أطفال وضرورى كمان معامل وزارة الصحة يتم فيها تطبيق التحاليل بشكل سليم من غير تدليس وبعدين طالما الإجراءات ديه بتتم فى حالة الشغل والسفر إجبارى هنيجى عند الحياة الزوجية اللى المفروض تكون واضحة وكل شئ فيه صراحة هنقول ده كده يفتح باب العرفى طب ماهو قبل تطبيق القانون كان فيه برده التدليس والغش والعرفى وغير العرفى ولو المشكلة اوى فى إجراءات التحاليل نفسها يبقى كلو واحد وواحدة يدفع زى ماهو عايز ويسلك حاله وهيجى على دماغه فى الآخر"
archived = "2010-03-14"
capture_url = ""

