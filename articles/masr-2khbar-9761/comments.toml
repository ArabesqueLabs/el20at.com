subject = "الى مش مخطوبه"
author = "مش خاطب"
posted = "2008-08-01"
text = "يا اخت مش مخطوبة ازيك وازي صحتك<br />والله يااختي الحالم بعضه وانا كمان مش مخطوب ولا خاطب<br />اللي مش مخطوبة تسيب اميلها للي عايز يخطب<br />مش كده ولا ايه<br />يلا باه ادينا اميلك يمكن يحصل النصيب وعشرينات تاخد الاجر والثواب"
