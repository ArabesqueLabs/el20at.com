[[comments]]
order = 1
subject = "سفر نشيد الانشاد ( المعروف باسم نشيد الافساد )"
text = "سفر نشيد الانشاد ( المعروف باسم نشيد الافساد ) : 7: 1 ما اجمل رجليك بالنعلين يا بنت الكريم دوائر ؟؟؟مثل الحلي صنعة يدي صناع 7: 2 ...لا يعوزها شراب ممزوج بطنك صبرة حنطة مسيجة بالسوسن 7: 3 ... 7: 4 عنقك كبرج من عاج عيناك كالبرك في حشبون عند باب بث ربيم انفك كبرج لبنان الناظر تجاه دمشق 7: 5 راسك عليك مثل الكرمل و شعر راسك كارجوان ملك قد اسر بالخصل 7: 6 ما اجملك و ما احلاك ايتها الحبيبة باللذات 7: 7 قامتك هذه شبيهة بالنخلة و ثدياك بالعناقيد 7: 8 قلت اني اصعد إلى النخلة و امسك بعذوقها و .... الكرم و رائحة انفك كالتفاح"
archived = "2007-11-04"
capture_url = "https://web.archive.org/web/20071104144409/http://masr.20at.com:80/newArticle.php?sid=12245"

[[comments]]
order = 2
subject = "الخنازير"
author = "ممكن نقل ادبنا"
text = "احنا بنعرف نشتم ونقل ادبنا ونطول لسانا ونضرب بالجزمة اذا لزم الامر<br />كل شوية يطلع لنا ولد نصرانى راضع الجبن من امة يقول لنا بول البعير وارضاع الكبير وكلام صبيانى لعيل جبان قاعد فى حضن امة ومعاة جهاز كمبيوتر ومحدش شايفة<br />ايوة ياسيدى احنا كدة واحنا بتوع النكاح زى ما بيقولوا لك فى الخرابة اللى بتصلى فيها امال هو ربنا خلق لنا العضو دة لي علشان نخزنة زى ما بيعمل ابوك احنا بتوع النكاح وهننكح امك واختك وانت ايضا<br />خليك انت وطائفتك مخصى فى القلاية ومارسوا العجز الجنسى والنفسى وامراض الوساوس والقهر النفسى ما انتم كلكم اصحاب امراض نفسية<br />ارتحت واللى عايز واحد يريح امك ما دام ابوك فى القلاية"
archived = "2007-11-06"
capture_url = "https://web.archive.org/web/20071106090700/http://masr.20at.com:80/newArticle.php?sid=12245"
