[[comments]]
order = 0
subject = "الاسود الديمقراطى اوباما لا و لن يكون رئيسا لامريك"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-11"
text = "يخظئىء من يعتقد بان الاميركى الاسود الديمقراطى اوباما سوف يفوز و يكسب الانتخابات الامريكية و يكون رئيسا على الامريكيين البيض الفير ملونين؟<br />الشعب الاميركى فى داخلة يرفض بكافة الصور ان يراسة مواطن ملون اسود ذو جذور اسلامية تحت اية مسميات<br />و دائما نحن العرب ما نراهن على الفرس الخاسر و ايضا دائما لا نتخلى عن (نظرية المؤامة) سبب تخلف العرب للاسف الشديد!"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030828/http://masr.20at.com:80/newArticle.php?sid=17190"

[[comments]]
order = 1
subject = "باراك اوباما المرشح الاميركى الديمقراطى الاسود ما"
author = "ممدوح زكى زخارى_الاسكندرية-مصر"
posted = "2008-08-11"
text = "ن العرب دائما ما نكون ضحية للاوهام الضعيفة بانة يوما ما سوف ياتى و يكون رئيسا امريكيا صديقا للعرب على حساب مصالح الامة الاميريكية او المصالح و المطامع و الاحلام الصهيونية؟<br />(الديمقراطية و الحرية)انهما الوجة الخفى لعملة واحدة الا و هى(الصهيونية)و ليست اليهودية؟<br />و طبعا هناك فرق<br />افيقو من غفوتكم يا عرب و أفرحوا"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030828/http://masr.20at.com:80/newArticle.php?sid=17190"

[[comments]]
order = 2
subject = "امريكا والاسلام"
author = "ابو هاد\\\\ف"
posted = "2008-08-12"
text = "التاريخ يعيد نفسة<br />دخل التتار بغداد ودمروها وقتلوا الخليفة وكسروا المساجد وحرقوا المصاحف<br />تماما زى الامريكان<br />واسلم التتار كلهم بعد فترة ورفعوا راية الاسلام عاليا وفتحوا الهند واسسوا الامبراطويات المغولية المسلمة فى الهند<br />وفى الاسبوع الماضى نشرت الانباء ان امريكا قلقة من انتشار الاسلام فيها وهجرة المسلمين اليها وزيادة نسبة المسلمين فى امريكا الى قرابة عشرين مليون مسلم<br />التاريخ يعيد نفسة<br />الاسلام ينتشر وبقوة وستشرق شمس الاسلام على امريكا<br />فلا تدفنوا رؤسكم فى الرمال فسيأتى اليوم الذى يحكم امريكا فيها مسلم"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814030828/http://masr.20at.com:80/newArticle.php?sid=17190"

[[comments]]
order = 3
subject = "لالالالالالالالالالالالالالالالالالالالالالالالالا"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-16"
text = "اشفق على العرب و المصريين اللذين انا منهم على رهانهم على حصان خاسر يدعى اوباما مرشح رئاسة من الحزب الديمقراطى الامريكى يخوض انتخابات الرئاسة الامريكية طامعا ان يسكم البيت الابيض<br />البيت الابيض لاى امريكى ابيض و ليس لاى امريكة ملون اسود<br />افيقوا يا عرب و كفى نوم و احلام يقظة؟؟؟"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816113111/http://masr.20at.com:80/newArticle.php?sid=17190"
