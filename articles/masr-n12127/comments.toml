subject = "حمدى رزق نشنت يافلح"
author = "عطوة ابو مطوة"
text = "بشجاعة واقتدار يحسد عليهما يلعب الزميل حمدي رزق الآن دور عمرة في بلاط صاحبة الجلالة ،فلم يعد لدية مايخسرة أو حتى يكسبة أو على الأقل يراهن علية وبة ،فقد سقطت كل أدوارة التي لعبها على مسرح صاحبة الجلالة سقوطا مدويا وذريعا رغم اتقانة كل منها ،فمأساة حمدي رزق انة اعظم من مثل واتقن الدور ولكن النجاح و التكريم كان ويظل يذهب الى اخرون لايقل عنهم حمدي ذكاء أو موهبة فهما جميعا ممثلين محترفين، إلا أن ادوار حمدي رزق فى مسرح صاحبة الجلالة كان ينقصها شي ما، ومع كل فشل لدور من أدوارة كان ضميرة يستيقظ فجاءة صارخا \" نشتنت يافالح \" ليبداء حمدي مرة أخرى من جديد بدور تمثيلي أصعب ولكن يتكرر نفس الأمر حيث حمدي يجيد اتقانة دورة على خير وجة وكفاءة ينافس بها ممثلي السينما المصرية و العالمية إلا سقوطة ونجاح آخرين هي المحصلة .<br />أبدع حمدي رزق في دور\" محجوب عبد الدايم\" أمام العملاق مكرم محمد احمد فكافوا عبداللة كمال برئاسة تحرير روز اليوسف ، وأجاد حمدي دور محفوظ عجب فجاء عبد القادر شهيب رئيسا لمجلس إدارة و تحرير المصور ، وتفوق حمدي رزق في دور المخبر فجاء مجدي الدقاق رئيسا لتحرير المصور ، وتجلى حمدي رزق في دور المشهلاتى فجاء محمود سعد للكواكب وخلفة فوزي إبراهيم ، وأتقن حمدي دور \" على طائرة الرئاسة \" فخرج من برنامج \" البيت بيتك\" دون رجعة ، و تألق حمدي رزق في دور \" المحلل \" و البلياتشو و الناضورجى و ، و... و ......و.......و........الخ<br />إلا ان السقوط المدوي كان من نصيب كل تلك الأدوار جميعا ،حتى حينما لعب دور عميل المخابرات العامة المصرية في لقائاتة الصحفية مع القائد السوداني المتمرد \"جون جار نج \" لم يقنع حمدي احد من المتفرجين على المسرح السياسي من الحكوميين بهذا الدور الذي اعتزلة حمدي برحيل جون جار نج بحثا عن دور جديد.<br />منذ أن خطا حمدي رزق بقدمية خطواتة الأولى في بلاط صاحبة الجلالة وهو يتحين الفرصة تلو الأخرى للصعود و الظهور على المسرح حتى ولو على جثث وأشلاء الآلاف من اصدقائة وكل من قدم لة يد المساعدة او مد لة يد العون ، فمنذ اللحظة التي شاهد فيها حمدي فيلم ( القاهرة 30 )وهو صبى لم يحبو بعد شعر أن كاتب السيناريو قد صاغ سلم حمدي رزق الى المجد عبر مسرح الحياة فى سنواتة القادمة ،وحينما أطلق موسى صبري رائعتة \" دموع صاحبة الجلالة \" كانت بداية الانقلاب في حياة حمدي رزق فكان يلتهم بعينية الحلقات المسلسلة من الرواية و التي كانت تنشر تباعا في \" أخبار اليوم \" صباح كل سبت في نهاية الثمانينات ،كان حمدي يصرخ من النشوة مع نهاية كل حلقة صائحا فى داخلة و ضاربا الأرض بقدمية \" هو دة إلى كنت بدور علية \" ، فأعاش حمدي داخل محفوظ عجب و عاش محفوظ بداخل حمدى ، ورغم ذلك فشل حمدي رزق أن يخرج مواهب محفوظ عجب و عبقرية محجوب عبد الدايم \" مع عادل حمودة في روز اليوسف حتى منتصف التسعينيات فكان ان غادر إلى المصور حيث مكرم محمد احمد مدرسة الاحتراف التى تشبع غرور حمدى رزق ،وهناك وجد حمدي ضالتة بعد طول انتظار ، وجائت الفرصة لة على طبق من ذهب ليخرج مواهب محفوظ عجب و عبقرية محجوب عبد الدايم وعلى مدار 15 عاما لم يخجل حمدي رزق من أن يفعل اى شيى أو أن يلعب اى دور ، فلم يخجل من أن يدبر مكيدة بين مكرم و يوسف القعيد خرج منها يوسف طريدا من دار الهلال غير مأسوفا علية بعد أن شعر حمدي أن يوسف قد يكون بديل لة بعد أن استشعر فى يوسف روح محفوظ عجب واقنع مكرم بذلك ،ولم يخشى حمدي أن توجة لة أصابع الاتهام بانة هو الذي حمل نسخة من رواية نجيب محفوظ الخالدة \" أولاد حارتنا \" من مطابع دار الهلال إلى مبنى مباحث امن الدولة في لاظوغلى ليقدم بلاغ في مجدي الدقاق بأنة بصدد طبع الرواية و توزيعها باسم روايات الهلال لتمنع الرواية من الصدور فى مصر من دار الهلال على يد مجدي الدقاق الذي يكرهة حمدي بكل جوارحة ومن كل اعماقة ،ولم يراعى حمدي صداقة السنين وهو يوشى إلى مكرم بمحمود سعد رئيس تحرير الكواكب الذي يحقد علية حمدي حقدا اسود مغموس فى بحور من الكراهية لانة اعتقد أن سعد يجلس على مقعد كان حمدي أحق بة إلا أن النصيب.<br />\" إياك ان تكون أو تحاول أن تكون أذكى من مديرك يوما ما \" حكمة خالدة لايحفظها حمدي رزق عن ظهر قلب فقط ولكن يلتزم بها ويعمل عليها وكاسنة مؤكدة تعيش في اعماقة ،لذلك لم يحاول حمدي يوما أن يسال نفسة لماذا يصمت مكرم على بيزنس صفاء لويس من الاراضى و العقارات و المقاولات حتى صارت ثروتها تقدر بالملايين ؟ ولماذا يغض مكرم النظر عن غالى محمد وهو يقود اكبر عملية ابتزاز لشركات قطاع الأعمال العام بعلاقتة بأحمد عبد الرحمن رئيس هيئة الرقابة الإدارية الأسبق، او وهو يحصل على 30 ألف جنيه مقابل اى فرصة توظيف في قطاع البترول الذي ورثة غالى من بابة بضوء اخضر من مكرم ، ولم يستفسر حمدي عن سر تجاهل مكرم لأعمال عزت بدوى البنكية المشبوهة وحصولة على عمولات من رجال أعمال مقابل تسيل حصولهم على قروض بنكية ،ولم يسال حمدى نفسة يوما لماذا تنهار اصدارات الدار توزيعا و مستوى صحفى وكفاءة مهنية حتى مجلة المصور على يديرها استاذة مكرم، وعلم حمدي السر وهو ان القضية ليست قضية توزيع مجلة و لكن رضاء الرجل الكبير عن مكرم الذى لم يحاول يوما ما ان يكون اذكى من الرجل الكبير بل عمل مكرم منظرا و مرشدا و محللا لأفكار الرجل الكبير وفارضا على ارض الواقع كل ما يحلم بة الرجل الكبير ،وهنا قرر حمدي ان ينسخ الادوار فعاش دور مكرم وجعل من مكرم الرجل الكبير و انطلق حمدي يعدو فى كل الفضائيات و الإذاعات و القنوات التليفزيونية لدرجة انة كان يذهب للفضائيات أكثر مما يذهب لمكتبة فى دار الهلال ،وكان دائما مكرم يفتخر فى دار الهلال بان حمدى ((... بيقراء افكارى و ينفذها أحسن مما فكرت )) وانطلق حمدى يعمل جاسوسا على زملائة لمكرم حتى نجح فى طرد يوسف القعيد من دار الهلال وتدمير العلاقة بين رجاء النقاش و مكرم و الدسائس لمكرم ضد سناء السعيد و الوشاية لمكرم ضد الدكتورة سلوى ابو سعدة و زرع الاحقاد لدى مكرم تجاة مجدى الدقاق و اطلاق الشكوك فى عقل مكرم تجاة عبد القادر شهيب و غرس الفتنة فى علاقة محمود سعد بمكرم محمد احمد ،و.....،و.............................................الخ<br />طالما حاول حمدي طوال سنواتة في بلاط صاحبة الجلالة أن يثبت ان كلية الأعلام بجامعة القاهرة يمكن ان تخرج ممثلين من قسم الصحافة بكفاءة و اجادة تتفوق على خريجي معهد السينما ومعهد الفنون المسرحية ،إلا أن الحظ لم يكن يلعب دائما مع حمدي رزق بل كان الحظ ضدة في أوقات كثيرة ، وكثيرا ما حاول حمدي ان يؤسس مدرسة جديدة في الصحافة تقوم على العب على كل الأطراف و استغلال الفرص و الهروب من المركب قبل الغرق و فن الوصولية وكان دائما و لايزال يكرر ماثورة شهيرة \" الى تغلبة ألعبة \" لذلك سعى الى صهر عبقرية محجوب عبد الدايم و ذكاء محفوظ عجب مع خلاصة رحلتة و ملخص كل دور من ادوارة في بلاط صاحبة الجلالة بما تحمل هذة الرحلات و الادوار من كل السقطات و الأخطاء و الأحقاد و الدسائس ولكن كان دائما ما يصدم بحمدي بسو ء التقدير فلا كل من اقترب منهم حمدي هم محجوب عبد الدايم ولا هم محفوظ عجب فقد كان و لايزال هناك ناس نظيفة لم تتلوث طوال مشوارها لذلك جاء عبد اللة كمال رغم كل مساوءة ولم ياتى حمدي رزق رغم ان كليهما شخص واحد بل كان عبداللة تربية حمدي رزق صحفيا بكل ما تحمل هذة التربية من ..........!!!!!<br />بخروج مكرم محمد احمد من دار الهلال دون رجعة انتهى عصر حمدي رزق إلى الأبد وسقط من أعلى قمة جبل الموالسين و الأفاقين ، على الأقل من ناحية طموحة فى رئاسة تحرير المصور ، ويعلم جيدا ذلك كل العاملين فى الوسط الصحفي الا شخص واحد فقط هو حمدي رزق نفسة ، فلا ظهورة في الفضائيات صبحا و مساء و على مدار 24 ساعة متحدثا فى كل ألوان السياسة و مغازلا كل الأسياد حول مبارك وجمال مبارك قد حنن قلب احد علية ، ألا أن حمدي لايزال يصر على ان الأمل باقى وكل من يقراء عمودة فى \"المصري اليوم \" لا يسعة إلا القهقهة فا للعبة انتهت و الدومينو أغلقت، ولم يعد هناك أولاد فى الكوتشينة ،والستارة نزلت، و كل الممثلين غادروا المسرح إلى أعمالهم الجديدة مكافاءة لهم على ادائهم ،إلا حمدي رزق لايزال مندمجا فى دورة على المسرح و مؤديا لة حتى رغم انصراف الجمهور من كراسي المتفرجين باستثناء مشاهد واحد يجلس معجبا و مصفقا ومشيدا بأداء حمدي رزق ورغم ان هذا المشاهد لم يعد لاحول لة ولا قوة الا انة رهان حمدي الأخير فاهذا المشاهد هو العملاق مكرم محمد احمد الذى طالما الهم حمدي كيف يلعب ادوار عمرة على خشبة المسرح وهاهو حمدي يبدع الان آخر ادوارة أمام العملاق الا وهو دور \" السفرجى \" فهو اخر الأدوار التي يجيدها حمدي رزق بعد ان سقطت كل الأدوار الأخرى ولكن يصمم حمدى رزق على التنشين الخطاء و المقامرة على ميراث الريح فحتى العملاق مكرم أصبح هو الأخر عملاق فى متحف صاحبة الجلالة لا حول لة ولا قوة بعد ان اصبح عبا على خشبة المسرح نفسها التى نخرها السوس ، ولكن حمدى يصر على مواصلة دور \" السفرجى \" امام العملاق مكرم محمد احمد فى مسرح خالى من المشاهدين و الممثلين وحتى السعاة ، فلا شي يهم لدى حمدي الا العملاق مكرم ، ولا شى يهم مكرم الان الا حمدى فهو آخر المؤمنين بة بعد ان ارتد عنة الجميع وكفر بة تلاميذة وحوارية ولم يعد سواة وحمدي يسيران بخطى ثابتة نحو ارفف المكتبات حيث الاتربة تعلو فوق الجميع جزاء فما فعلوا فى انفسهم قبل ان يفعلوا بن"
