order = 1
subject = "الراقصون على حبال واهية"
author = "ياسر أبو العلا"
text = "تعليق شدشد قوى الصراحة ... تسلم إيدك يا عم عطوة<br />وقانا الله شر مطوتك وجعلها مصوبة نحو المنافقين وكذابى الزفة والراقصين على كل الحبال ، والذين لا يجدون دورًا إلا الطعن فى كل الناس طالما ابتعدوا عن أنفسهم ، إلا أننى أعتقد أن مثل هؤلاء - ومنهم الأستاذ حمدى - يصيبون أنفسهم بتلك السهام قبل أن يصيبوا الآخرين .<br />من الواضح يا عم عطوة أنك زميل فى هذا البلاط الذى يضم - للأسف- شخصيات لا ترغب إلا فى سفك دماء الذين يعملون ، لأنهم لا يجدون ما يفعلون غير ذلك .إلا أن عزاءنا أن الناس فى بلادنا ما زال لديها القدرة على فرز الغث من السمين ."
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194150/http://masr.20at.com:80/newArticle.php?sid=12127"

[[comments]]
order = 2
subject = "ظهر الفساد فى عزبة الصحافة"
author = "من غير مطوة"
text = "عمى عطوة ابو مطوة قال كلام جامد قوى يسلم بقة<br />بس ياعم عطوة الكل عارف ان الصحافة بقرة للمقربين واللى بيسافروا على طيارة الرياسة<br />بياخدوا عمولات بالملايين وبيقبضوا مرتبات من شركات البترول علشان ينشروا اخبار وردية عنها وبياخدوا عربيات مرسيدس هدايا من سفارات دول الخليج علشان يكتبوا شوية مقالات مجاملة وينشروا اخبار الحكام ويتعزموا فى الحفلات والافراح ومع صفوة المجتمع<br />ميغة بقى<br />انما كلامك يا عم عطوة اخر حلاوة<br />اما براوة اما براوة على الحلاوة<br />تسلم لى ها العيون ويعطيك الصحة"
archived = "2007-11-01"
capture_url = "https://web.archive.org/web/20071101044129/http://masr.20at.com:80/newArticle.php?sid=12127"
