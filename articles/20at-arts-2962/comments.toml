[[comments]]
order = 2
subject = "الحلو والمر"
author = "loga"
text = "رغم المنظر السودوى لهذا العام الا ان هذا السواد يتفجر من عمقه الضياء حتى وان لم يبزغ بالصوره الواضحه<br />فمع كثر الهجوم والقتل يتمسك الناس بهذا الدين العظيم ويرخصون له الحياه يختارونه عمن سواه .<br />يظهر الوجه الغربى المزيف بزيف الحريه التى تريد ان تجردنا من كل شىء تحت ستار مكافحه الارهاب بل هى مكافحه الهويه لطمس هذا الدين او تلك الروح التى تعيش بها الشعوب العربيه فى ذوابان بكل الطوائف ويابى الغرب ليترك العالم العربى يعيش هكذا الا ليسعىلفرقتها وتشيعها كل هذه الامور تظهر لنا بان التمسك بكل ثوابت الامه هو نجاتنا من هذه الهجمات ........................ولنا الله"
archived = "2010-03-14"
capture_url = ""

