[[comments]]
order = 8
subject = "نسيت حاجه يا مجاهد"
author = "نيفين نيفى نوفا"
text = "و الله شخصيا يا جماعه دا كان اسوا عام من بدايته و بجد هكسر ورا 2006 زير<br />اكيد اجمل صور فوز ايطاليا بكاس العالم و فوز مصلر بكاس افريقيا و فوز الاهلى حبيب الملايين يتالت العالم<br />بس من اسوا الصور اللى نسيت تحطها يا مجاهد صوره العباره السلام 98<br />الله يرحم الجميع<br />و عايزه اقول كلمه للى بيلومو مجاهد انه فكرنا بحاجات وحشه ان مجاهد ملوش ذنب<br />الراجل ملقاش حاجه تفرح و اتاخر<br />هى كانت سنه ما يعلم بيها الا ربنا<br />كل سنه و انتو طيبيبن"
archived = "2010-03-14"
