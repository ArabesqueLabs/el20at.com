[[comments]]
order = 0
subject = "وماذا تعمل الماشطة فى الوجة العكر ؟."
author = "مصرى"
posted = "2008-04-15"
text = "من الذى اطلق الرصاص الحى على المتظاهرين فى المحلة ؟<br />من الذى استخدم غازات الدخان وغازات الاعصاب التى سببت مئات الاغماءات فى المحلة على مواطنين مصريين وليسوا يهود<br />من الذى قيد المصابين بالسلاسل بطريقة همجية فى السراير فى مستشفيات المحلة رغم الامهم المبرحة<br />انة المجرم<br />ولا بد من محاكمتة يوما على جرائم الحرب ضد المدنيين سواء داخل الدولة او خارج الدولة"
