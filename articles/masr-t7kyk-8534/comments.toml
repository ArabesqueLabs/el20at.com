subject = "الى خباب عبدالمقصود"
author = "واحد والسلام"
posted = "2008-03-19"
text = "عنوان الموضوع اصلا حديث للرسول صلى الله عليه وسلم<br />عن سعيد بن زيد،عن النبي صلى اللّه عليه وسلم قال: \" من قتل دون ماله فهو شهيدٌ، ومن قتل دون أهله أو دون دمه أو دون دينه فهو شهيدٌ\". سنن أبو داود<br />و عن طلحة بن عبد الله بن عوف، عن سعيد بن زيد بن عمرو بن نفيل، عن النبي صلى الله عليه وسلم قال :<br />((من قتل دون ماله فهو شهيد)).ابن ماجه<br />فعنوان الموضوع بتاعك استهزاء بحديث رسول الله<br />زي بالضبط زميلك احمد الهواري كتب مقال بعنوان رب زرني فردا مع ان ربنا علمنا الدعاء وقال رب لا تزرني فردا<br />وبعدين اللي حصل في طوابير الخبز دي مشاجرة عادية بين اثنين انتهت بقاتل ومقتول<br />ودي حلها ان النيابة في الاتي:<br />1 الشرطة تنتقل الى مكان الحادث وتقبض على القاتل وتستدعي النيابة<br />والنيابة تنتقل الى مكان الحادث وتتولى التحقيق<br />ثم بعد ؤلك يتم تحويل القاتل الى محكحمة الجنايات<br />والمقتول مات في مشاجرة لا علاقة لها بالشهادة<br />وهنا اتذكر حديث للرسول اذا التقى المسلمين بسيفيهما فالقاتل والمقتول في النار<br />قالوا يا رسول الله فما بال المقتول<br />قال فانها كان حريصا على قتل صاحبه<br />والله اعلم"
