[[comments]]
order = 2
subject = "ليه رغيف العيش؟"
author = "أميمة الشاذلي"
posted = "2008-03-29"
text = "أولا أحب أن أبدي اعجابي الشديد بهذا التحقيق الصحفي الهائل<br />التحقيق أكثر من رائع والأسلوب جااااااااامد<br />ثانياً أحب اقول للي كتب عن نفسه \"واحد والسلام\" أن أستاذ خباب لم يقصد الاستهزاء بالدين وإنما قصد أن يأتي بعنوان مناسب للفتاوى التي صدرت عن شهيد رغيف العيش والتي في محتواها معنى عنوان التحقيق \"ومن قتل دون رغيفه فهو شهيد\"<br />ثالثا:أستاذ واحد والسلام.. انت شكلك ما قرأتش المقالة كاملة..لانك دخلت في نيابة وشرطة وحجات غرييييبة<br />ده بيقلك واحدة اتخنقت وهي واقفة<br />اتخنقت من الزحمة..مش حد قتلها<br />وقعدت تجيبلي في احاديث عن القاتل والمقتول وحاجات غريبة والله<br />انا مش عارفة ازاي واحد يكتب تعليق على العنوان بس من دون ما يقرأ التحقيق نفسه<br />حاجة عجيبة والله<br />رابعا وأخيرا..انت ليه مضايق يا خباب<br />على قول السادات الله يرحمه<br />مش لاقيين عيش.. ياكلوا جاتوه<br />اعتقد مفيش اسهل من كده<br />اهو منها الواحد ما يرميش نفسه في التهلكة ومنها كمان يحلي بقه"
archived = "2010-03-14"
