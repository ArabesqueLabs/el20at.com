[[comments]]
order = 1
subject = "الإسكندرية"
author = "أبوإستشهاد"
text = "مرحبا بك مسلمة داعية إلى دين الله وكما قال النبي الكريم صلى الله عليه وسلم :ٍِ[سيبلغ هذا الدين ما بلغ الليل والنهار ولا يترك بيت مدر ولا وبر إلا دخله بعز عزيز أو بذل ذليل]ووالله إن القلب ليسعد ونقول لكل من يحارب الإسلام :[موتوابغيظكم إن الله مخرج ما تحذرون]وشكرا لطالبان على تمثيلها المشرف للإسلام."
