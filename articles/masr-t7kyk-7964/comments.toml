[[comments]]
order = 5
subject = "سيدنا المسيح عيسى بن مريم له زيارة تاريخية لمصر دع"
posted = "2008-01-06"
text = "انا اللي كتبت هذه العبارة وانا مسلم<br />هل فيها حاجه غلط فعلا سيدنا المسيح ابن مريم المذكور في القران عليه وعلى نبينا الصلاة والسلام ذهب الى مصر واحتضنه المصريون كما احتضن اهل المدينة الرسول عليه الصلاة والسلام فدا لشعب مصر وقال لهم مبارك شعب مصر<br />وبناء على هذه الدعوة المباركة من نبي الله عيسى ابن مريم صلى الله عليه وسلم استجابه الله وشرح الله صدر المصريين للاسلام واصبحوا مسلمين بنسبة 94%.<br />انا قلت حاجه غلط يا جماعة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "اصل الاقباط"
author = "مصرى فرعونى موحد باللة من ايام"
posted = "2008-01-06"
text = "المصريين القدماء كانوا لهم ديانتين - اهل التوحيد وهم الاغلبية الساحقة ومعبودهم رع ويرمزوا لة بقرص الشمس وهو الالاة الواحد الاحد الفرد الصمد<br />واهل التثليث يعبدون الثلاثة ايزيس الام والاب ازوريس والابن حورس<br />حينما دخل عمرو بن العاص مصر لم يخرج جيش لمحاربتة عند الحدود ولكن كانت كل جالية رومانية كبيرة كانت مستوطنة اقليم فذهب لمحاربتهم هناك<br />اصحاب المعبود رع الموحدين اسلموا جميعا لان الاسلام دين التوحيد الالاة الواحد الفرد الصمد وهو القريب الى قلوبهم<br />والجالية الرومانية واصحاب التثليث اللى هم اجداد الاقباط جعلوا من ازيس مريم ومن الة الرب ازوريس اما حورس فقالوا علية المسيح<br />اذن اغلبهم من اصل رومانى - اذهب الى اى كنيسة وشوف عيونهم الخضراء ولونهم الابيض الرومانى تعرف اصلهم<br />ثم بقايا اليهود فى مصر الذين لم يخرجوا مع موسى<br />اذن الناس النصارى اللى عندنا اصلهم رومانى او يهودى او بقايا الديانة الوثنية بتاع ازوريس وحورس<br />وجيش عمرو كان خمسة الاف وتعداد مصر 8 ملايين - هيعملوا اية خمسة الاف فى ثمانية ملايين<br />وبعدين هجرات اية من الحجاز - هما عندهم ناس منين للعراق والشام ومصر وكانوا بضع قبائل لا تزيد عن نصف مليون فى احسن التقديرات<br />فهؤلاء النصارى بقايا الرومان عليهم ان يذهبوا عند قرايبهم<br />وما يكتبة اقباط المهجر عن الاسلام - كلام فظيع وكانهم مفيش حد هيطولهم<br />فى اسنا فى خمسة دقائق كان هيختفى اى نصرانى من الوجود لو كان ظهر للناس<br />انهم اقباط المهجر يشحنون الناس فى مصر بكلامهم البذىء ويفاجئوا بردات فعل عاصفة"
archived = "2010-03-14"
capture_url = ""
