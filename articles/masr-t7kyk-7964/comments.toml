text = "الموضوع مش سويرس ولا الحجاب ولا الكلام الفارغ دة<br />الجماعة اخونا البعدا الكنيسة بتقول لهم وبتعطيهم تعليمات ما تشتريش من دكان مسلم ولا صيدلية مسلم - لاتنفع الكفار - اشترى من قرايبك النصارى<br />وطبعا بيشتروا من بعض - مش مهم - فى ستين داهية - هم قد اية - اربعة ملايين نصرانى فى بحر 80 مليون مسلم<br />فالموضوع مش اخوان ولا يحزنون<br />دا شعب ذكى جدا"
