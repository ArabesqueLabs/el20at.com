subject = "الى الاخ عطوه ابو مطوه"
author = "مش لازم"
posted = "2007-12-08"
text = "خلاص يا اخ عطوه ابو مطوه خلاص القرأء عرفوا قضيتك مع حمدي رزق وخلصنا مش لازم يعني حضرتك في كل موضوع تقدم شكوتك دي للقراء<br />وبعدين اذا كان عندك قضية اكتب اسمك الحقيقي ما تكتبش عطوه ابو مطوه لما تكون مظلوم اكتب اسمك الحقيقي وقول حمدي رزق عمل فيك ايه بالضبط<br />لكن اللي انا فهمته من الشكوى انه راجل منافق ووصولي وياستطاع انه يسبقك في العمل مع انك اكفأ منه<br />ودي مسألة مش حنقدر نعمل فيها حياجه<br />خلاص الراجل بقى نائب رئيس تحرير واللي كان كان وخلصت المسألة<br />قرآء عشرينات حيعملولك ايه يعني"
