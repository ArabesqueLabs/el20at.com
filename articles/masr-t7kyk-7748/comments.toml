[[comments]]
order = 3
subject = "وعدد من أعضاء مجلس النقابة، والموضوع .. مستقبل الص"
posted = "2007-12-08"
text = "زي ما قلنا مستقبلا ان الصحافة ليها كليات صحافة واعلام الان وخريجي هذه الكليات لا قيمة لهم في عالم الصحافة واللي مسيطر على الصحافة غير المتخصصين من خريجي الكليات الاخرى<br />ولن ينصلح حال الصحافة الا بعد ان يسيطر على عالم الصحافة المتخصصين خريجي كليات الاعلام والصحافة<br />الصحافة في مصر هبل دجل غش وصولية انتهازية رشوه<br />اما الصحافة الحقيقية التي تخدم المجتمع غير موجودة الان<br />انا بقول هذا الكلام لاني اعرف اثنين مدرسين دخلوا عالم الصحافة لانه وجدوه حاجه سهلة خالص واصبحوا مشهورين جدا الان<br />واعرف واحد محامي لما جه يشتغل محامي لقاها سكة صعبة اوي وطريق طويل ومتعب<br />واشتغل صحفي ولقى الصحافة دي سهلة خالص وحاجه حلوه اوي واصبح صحفي مشهور الان ومراسل صحفي لقناه تلفزيونية شهيرة<br />فنداء الى الاخوة خريجي كليات الاعلام والصحافة لازم تعملوا رابطة جوا النقابة وتطالبوا بحقوقهم في قيادة العملية الصحفية في مصر<br />والاخ مكرم محمد احمد حيهرج مثلما هرج الذين من قبله<br />وارجو الا يغضب مني احد"
archived = "2010-03-14"
capture_url = ""
