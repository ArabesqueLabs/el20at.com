subject = "الصحفيين فى ازمة هل هم ام البلد"
author = "واحد فايت من هنا"
posted = "2007-12-07"
text = "الصحافة فى ازمة هل يعقل هذا الكلام ؟ الحقيقة البلد كلها فى ازمة<br />مفيش موضوع يكلموا الناس فية ولا موضوع الناس تتابعة فى الصحافة - دايما كان بيبقى لمصر مشروع الناس كلها بتتابعة ايام طلعت حرب كان الاقتصاد وعمل بنوك مصرية باموال مصرية وشركات مصرية تنافس الاجنبى وكانت الناس بتتابع حاجة قومية<br />دلوقتى بنعمل العكس بنبيع البنوك المصرية والشركات المصرية للاجانب<br />وايام عبد الناصر كان فية مشروع وطنى بناء السد العالى ومديرية التحرير والجيش وطرد الانجليز وبناء مدينة نصر وطريق صلاح سالم وكورنيش النيل والمصانع الحربية والحديد والصلب<br />دلوقتى مفيش حاجة خالص<br />البلد فى الفريزر فى مرحلة تجميد<br />الناس بتتابع اخبار التعذيب فى اقسام الشرطة<br />ويوميا فية اخبار القبض على الاخوان والمحاكمات العسكرية<br />تبقى الصحافة هتتكلم عن اية<br />هتقول اية ولمين<br />والدش بيجيب 600 قناة فيها اخبار من اصقاع الارض وما ينفعش نخبى حاجة<br />لو حمار وقع فى ترعة فى الصعيد الجوانى العالم كلة بيعرف<br />ولو تاكسى ارياف ولع فية نار بيبقى فى اخبار الشرق والغرب<br />احنا بس الصحافة بتاعتنا بتتكلم عن انجازات وهمية وكان الاخبار بتيجى عن طريقهم بس<br />الصحافيين عايشين فى الوهم<br />والحكومة عايشة فى الوهم<br />اول بلد فى افريقيا والشرق الاوسط عمل شركة تليفونات حاجة كدة من 90 سنة<br />اتصالات الامارات بقى لها 30 سنة ومن سخرية القدر انهم جايين يعملوا لنا تليفونات وشركة تليفونات بدل احنا ما نروح نعمل فى الدول التانية<br />فى الامارات ادارة شفافة ونقية وشريفة انما احنا بنجيب لورا<br />البلد كلها فى ازمة"
archived = "2010-03-14"
capture_url = ""

