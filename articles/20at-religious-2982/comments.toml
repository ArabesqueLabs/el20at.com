subject = "ومنذ متى كان المتمذهبون أبطالاً؟"
author = "قلم جاف"
text = "إلى هايبربويد .. متى كان الملالي أبطالاً؟ هل عندما مولوا جماعات الإرهاب في مصر؟<br />أين أسوأ من زايدوا على القضية الفلسطينية؟ كم رصاصة أطلقوها على الكيان الصهيوني؟ هؤلاء الذين يعتبروننا الشيطان الأصغر!<br />لا خير في التطرف السلفي ، ولا في التطرف الشيعي الذي يجد ألف صوت يدافع عنه ، وعن نموذجه السياسي الذي صنع دولة نووية يتسول الكثير من أبنائها العمل في دول الجاز!<br />أما عن الذين يريدون أن يتحول الحج لموسم سياسي ، كفى متاجرة بالدين ، وكفى بالمتمذهبين تجارة بالدين من أجل السياسة وتجارة بالدين من أجل الدين ، وكم استعمل الملالي الذي يدافع عنهم بويد وشركاه السياسة لتمرير فكرة الزعامة الدينية إلى عقولنا..كما استعملوا ميليشياتهم الإعلامية للتغطية على أعمال الإرهاب التي يقوم بها أذنابهم في العراق.."
archived = "2010-03-14"
