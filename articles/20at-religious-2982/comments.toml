[[comments]]
order = 4
subject = "رعب السعوديون"
author = "Hyperboloid, UK"
text = "مرة أخرى عن إيران و خطر الإيرانيين ! مرة اخرى عن شحن عقول بسطاء المسلمين بالأكاذيب ، و كأن الايرانيين سيحجون لأول مرة في تاريخهم هذه السنة. ألا ترون هنا من يحاول تفريق المسلمين السنة والشيعة عن بعضهم بالقوة ليدافع عن سلطانه الزائل و ليرضي اعمامه في تـل أبـيب وواشنطن ؟<br />لماذا لا يعتبر هؤلاء السعوديون اسرائيل مصدر الخطر في الشرق الاوسط ؟ لماذا يزعل البعض من محاولة ايران اللحاق بركب التقدم و توليد الطاقة النووية (متأخرة 60 سنة عن الغرب و لكن احسن من الذين اقتنعوا بحرق الجاز لتوليد الكهرباء! ) لماذا يرى البعض أت محاولة ايران توليد الطاقة النووية سيدفع المنطقة نحو سباق تسلح ؟ لماذا لانسمع نفس الكلام بخصوص اسرائيل التي اعترف أولمرت رسميا بحيازتها اسلحة نووية ؟! ألا يرينا هذا حجم العمالات و القذارات في هذه المنطقة ؟<br />يركب السعوديون دائما على نفس الموجة البايخة (سنة و شيعة) .. هل تعلمون أن ميزانية وزارة الدفاع السعودية السنة الماضية فاقت 25 مليار دولار بينما ميزانية وزارة الدفاع في ايران بحدود 6 مليار ! أين تذهب هذه الاموال ؟ ايران تتسلح و تبني جيوشا (وليس جيشا) و تبني قوة نووية و تطور الصواريخ و تدعم تنظيماتها في الخارج و تتحدى الدنيا ب 6 مليار دولار في السنة ؟ أما أحفاد ماكرن موردخاي (مقرن بن مرخان) الذين يشترون ما يجود به أسيادهم في لندن وواشنطن عليهم من اسلحة قديمة بأضعاف أضعاف سعرها (عداك عن الرشاوي و المشاوي والليالي الحمراء و السوداء التي تقدم كرشاوي لهؤلاء القوم)<br />هؤلاء السعوديون ضيعوا العرب ، و ضيعوا م لايقل عن 10 تريليون دولار (10000 مليار دولار) خلال السنوات العشرين الماضية (على الاقل عن طريق اغراق السوق الدولية بالنفط حتى وصل سعر البرميل ل 6 دولار خلال اواخر الثمانينات) ... هؤلاء اللصوص و قطاع الطرق هم من ارسلوا آلاف الشبان الى افغانستان كمرتزقة لخدمة سيدهم رونالد ريجان الذي لم يرق له وجود الروس في افغانستان ، فجيء بهؤلاء الشباب المغرر بهم من قبل حكومتهم و منعوا من العودة لديارهم نظرا لخوف السلطات منهم لأنها هي أعرف بما زرعته في رؤوسهم من تكفير للآخرين ..... لماذا يكفر بن جبرين (عليه سحائب الرضوان!) حزب اللـه البطل الذي فعل بالصهاينة المعتدين مالم ولا و لن يفعله آل قرود ؟ لماذا يخشى الجهلة و العملاء على السنة في لبنان من شيعة لبنان و أهل السنة في فلسطين يذبحهم احبائهم الصهاينة منذ 60 سنة ؟<br />لماذا يراد لنا ان نبتلع الكلام الفارغ عن أهل الشيعة الابطال اخواننا نحن اهل السنة ؟؟ ألا يشهدون انه لا اله الا الله ؟ انا لن اصدق ان شيعيا عربيا كان ام فارسيا يمزق القرآن الكريم ! بل يمكن ان اصدق ان من يتحالف مع الغرب و باع الدين والنفط و استدعى المجندات الامريكيات لحماية عرشه الرث ان يدوس على القرآن و تعاليمه .... اعلموا ايها القراء أن آل قرود يجندون الآلاف من شباب بلدهم العاطل ليعملوا مخبرين و مندسين في وسائل الاعلام و منها الانترنت ،، و يقوم هؤلاء بنشر اكاذيبهم و اباطيلهم و دمجها مع كلام يراد به تحريك عواطف البسطاء مثل أن الشيعة يذبحون السنة و ان الشيعة يطوفون بالعكس! الى آخر هذا الهراء .....<br />إنه الرعب بعينه... انهم يعلمون انهم دعموا صدام في عدوانه على ايران بالمليارات ل 8 سنوات ، واليوم صدام بقي له اقل من شهر على البسيطة ! انهم يعلمون انهم لن يستطيعوا اضلال امة المليار للأبد بترهاتهم و اباطيلهم من اجل مصالحهم و مصالح من نصبهم ملوكا على دويلات جازستان!!"
