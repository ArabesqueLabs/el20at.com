order = 0
subject = "أن أيران أشد خطرا على الأسلام من أسرائيل"
author = "جمال المغربي"
posted = "2007-01-17"
text = "واهم أنت يا صديقي أن صدقت بأن أيران تعمل لصالح الأسلام و المسلمون . أن أيران تعتبر قضيتها القومية الفارسية فوق كل أعتبار . أن كانت تجاهر بأنتصارها للأسلام و المسلمين فأن أعمالها لا تشي بشيء من هذا بل بالعكس فهي تنشر الفرقة بين المسلمين شيعة و سنة و خاصة منهم ذوي الأصول العربية .أن اليهود يعرفون عدوهم الحقيقي و من يهدد وجودهم فعلا , و على هذا الأساس يضعون أولوياتهم في الحرب و نوعية السلاح المستعمل. عرفوا أن العراق هو العدو الأول و الأخطر فجيشوا له حربا كونية دامت عشرات السنين بتعاون كبير طبعا من دول الجوار العملاء و على رأسهم أيران.أما أستعراض العضلات الذي يقوم به النظام الأيراني فأن أسرائيل أدرى بفراغه من أدنى خطر عليها بل لا يعدو عن كونه تطبيل في تطبيل . وهي كذلك متؤكدة من جبن الجندي الأيراني و المعلوم أن الجبان لا يخيف."
archived = "2010-03-14"
