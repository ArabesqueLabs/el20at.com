subject = "المسامح كريم"
author = "نيفين نيفى نوفا"
text = "انا شايفه يا جماعه ان حسن شحاته مغلطش و الله اعضاء مجلس اتحاد الكوره مصابون بالكثير مما هو اكتر من انفصام بس على كل حال انا بقول ان يكفى هذا الرجل انه فرح كام مليون ف 2006 لما خدنا البطوله فمش كتير نغفر له و زى ما قال خالد الغندور ف برنامجه و تعالو ننسى و نرفع شعار تعالو نشجع منتخبنا و يمكن اول كلمه صح يقولها الغندور ف حياته<br />المهم فعلا يللا نبص لادام و نشجع منتخبنا"
archived = "2008-01-01"
capture_url = "https://web.archive.org/web/20080101095023/http://masr.20at.com:80/newArticle.php?sid=13618"
