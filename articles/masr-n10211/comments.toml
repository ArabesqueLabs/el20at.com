[[comments]]
order = 43
subject = "الى واحد من الناس وباتيستوتا"
author = "صلاح شادى"
posted = "2007-05-24"
text = "بالنسبة لموضوع دراسات الجدوى فى حاجة فى وزارة التخطيط اسمها ادارة المشروعات القومية اللى كان منها السد العالى ومشروع منخفض القطارة اللى متعملش ونفق احمد حمدى وكوبرى الفردان ,وتوشكى الخ الخ .. المشروع ده مش موجود والسعودية عايزه تبنيه سعودى على طريقة يالا يارجال ومصارينا كتير والله ما جصرنا ودى طريقة هلهلى لانها ببساطة انت بتغير فى حدودك الاقليمية .. الكلام اللى كنت قريته انا من كام سنه عن جسر يربط طابا بالعقبة بالسعودية وهو منطقى واقصر .. بس تقول ايه فى اللى حيموت على شرم الشيخ بالذات ولو كان الكلام على ان الرفض جى عشان هى عزبة مبارك فشرم الشيخ اذا كانت عزبة مبارك النهاردة فمش حتبقى عزبته بكره لانه مش دايم لينا .. البلد دى هى اللى دايمالنا<br />اللى دخل الاخوان فى الكلام ان معظم اللى معلقين اخوان او متعاطفين معاهم والموقع فى العموم متعاطف مع الاخوان بس بذكاء .. الحاجة التانية ان التعليقات كلها على مبارك الخائن وانا رايي ان مبارك حمار وجاهل بس مش خاين .. عمرى ما سمعت منكم كلمة واحدة فى حق اسعودية اللى مش سامحها للستات تسوق عربيات لحد دلوقتى .. ولا على نظامها الديكتاتورى ولا على اجهزتها الامنية اللى بترمى المعارضين فى الربع الخالى .. ثانيا توشكى مش مشروع فاشل توشكى مش مشروع شغال اصلا .. لانها قناه اتحفرت عشان تصرف فائض مياه بحيرة ناصر لما تتملى باذن الله بدل ما تفقد فى البحر زى ما حصل فى نص التسعينات .. البحيرة متملتش فالبالتلى مفيش مفيض يتملى عشان يتزرع منه .. توشكى موضوع اتكبر عشان مبارك كان نفسه فى انجاز هو مشروع خزان مياه جديد وميستاهلش كل ده . بالنسبة للاستاذ باتيستوتا .. مش معنى ان الاخوان بيتعرضوا لضربيات امنية ان كل الناس مباحث .. مرض الشك فى البشر على انهم امن دولة ده مرض ملوش علاج .. حيخليك فى الاخر مش بتكلم حد والمخبر يا ذكى هو اللى يسمعك الكلام اللى انت عايز تسمعه عشان يجيب قرارك .."
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

