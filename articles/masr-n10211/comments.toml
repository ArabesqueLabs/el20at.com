subject = "الحفاظ على ممتلكات مبارك"
author = "جابر العطواني ( رئيس دولة العط"
posted = "2007-05-27"
text = "إن الرئيس مبارك أقصد الجد مبارك صاحب المملكة المصرية فعل ذلك من أجل الحفاظ على ممتلكاته الخاصة لأن شرم الشيخ جزء من ألف جزء من الضيعه التى تركها له أجدادة . فكيف يمر أولاد الأيه دولت منها كلا وألف كلا لن يمروا منها أبدا ما دمنا فيها جالسون . لذلك أدعوكم لمساندة دولة العطوانيين وعاصمتها قاهرة المعز ضد ذلك الفرعون الذي خبربها ويريد توريثها للزعيم \"زعزوعه المر بزيادة \" ولذلك فقد قررت أن أتولها قيادة دولة العطوانيين من أجل إنقاذ سمعة البلد من الفساد والمفسدين .<br />...................................................... الزعيم جابر العطواني ...................................................."
