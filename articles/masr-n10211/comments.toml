[[comments]]
order = 27
subject = "حكموا العقل"
author = "شريف"
posted = "2007-05-19"
text = "يا جماعة أولا مفيش داعي لتبادل السب والشتائم مع إخوانا العرب أيا كانت مساوئهم فهم في النهاية عرب ومسلمين.<br />ثانيا ومع اختلافي مع كاتب المقال في بعض النقاط إلا أنني لا أعلم ماهو السبب الرئيسي لرفض الجسر؟؟!! إذا كانت الحجه هي الحفاظ على شرم الشيخ...خلاص ياسيدي خللي الجسر في أي حته تانيه غير شرم الشيخ إنتوا عارفين إن مع التقدم التكنولوجي إلا العالم توصل ليه نقدر نخللي الجسر يمتد إلى أي مكان حتى لو يوصل للقاهره نفسها. ممكن نخللي الجسر في سفاجا مثلا وبذلك تصبح مينا بحري وبري في نفس الوقت. لأن الهذا الجسر فعلا مهم ليس للمقيمين في السعودية فقط ولا للحجاج والمعتمرين فقط بل إنه مفيد لكل المصريين الذين يعملون في كل دول الخليج. أن أرجح أن يكون السبب الرئيسي لرفض الجسر هي بعض الضغوط الخارجية. والله أعلم"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

