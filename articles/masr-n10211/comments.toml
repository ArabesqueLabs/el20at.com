[[comments]]
order = 20
subject = "قرفان من اشكلكم"
author = "مش هكتب"
posted = "2007-05-18"
text = "هى البلد دى بلد ابو الى جابو مبارك ولا ورث سبهولو ابوة مفيش حد عارف مصلحة البلد غيرة اولا انا واحد من الناس ومصرى اتمنى ان شرم الشيخ تولع بجاز وسخ انت بتتكلمو فى اية برضة ارض منصر تبقى لدعارة وشواطى العراة حرام عليكم سياحة اية وزفت اية وفلوس اية بكرة هنقبل ربنا هنقولو اية كنا بنكل من شواطى العراة وبعد كدة السعودية مدينة مقدسة والى بيتكلم انهم راعة غنم يا حبيبى سيدنا رسول الله كان يرعى غنم ولا انت مش مسلم والعيز با للة هو حسنى خايف على نفسة ميعرفش انة ميت ميت بقى عا مل زى فرعون فا كر انة مخلد لكان لا والله لا تدرى نفس باى ارض تموت وبعد كدة احنا اية الى مستفدينة من السياحة محنا شحتين ولا هو بهف هو وشلة الحرامية السعودية على الا قل احسن من مصر مش مبهدلة ولادة يا اخوة يا افاضل المو اطن المصرى فى عهد مبارك بقى درجة عشرة يعنى ملناش لا زمة ولا احنا بنحب الكلام الكثير وبس وحسبى الله ونعم الوكيل فيكم وفى مبارك وكل من دمر هذا البلد كنانة الله فى الا رض خير اجناد الا رض احبطونا جتكو القرف"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 21
subject = "الى القراء المصريين فقط"
author = "Dr Mohamed Mokhtar"
posted = "2007-05-18"
text = "بعد ماقريت كل الأراء ...أولا: من الخطأ الشديد شتيمة و سب السعودية لأنهم اخواتنا في الدين و ماقالوش حاجة تزعل..... ثانيا : كاتب المقال و ان أخطأ في شيئ فقد أصاب في الكثير..ثالثا : انا مش عارف مين المصريين اللي بيدافعوا عن مبارك أوى كده عايشين في مصر معانا ولا فين بالضبط<br />رابعا : طبعا فلوس سياحة العراة و الخمور عارفين ان هي مال حرام ولا دي كمان فيها كلام و ربنا ما بيباركش في الحرام و أدينا شايفين الحالة الاقتصادية للمصريين وصلت لفين<br />خامسا: لو المشكلة في الأمن القومي فده له مليون حل ... علشان كده ده سبب ضعيف<br />سادسا : مصر شاخت و عجزت و معدش لها صوت في المنطقة و اللي مش شايف كده يبقى أعمى<br />سابعا : ياريت الأخوة السعوديين اللي بيعاملوا المصريين بعنصرية و بيبهدلوهم ..ليه كده..ده السعودية اتبنت عل كتاف المصريين ولا لما فلوس البترول كترت المصريين معدش ليهم لازمة... احنا اخوات قبل أى حاجة<br />ثامنا : الجسر أكيد مفيد جدا على الأقل مش هايبقى فاشل زي مشروع توشكي<br />تاسعا: أقول لكل المصريين الريس مبارك أدى ماعليه على مدار 25 عام في الحكم ولابد أن نعلم أنه بذل ما يستطيع ومصر الآن في حاجة شديدة الى نهضة سريعة و دم جديد وشكرا"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

