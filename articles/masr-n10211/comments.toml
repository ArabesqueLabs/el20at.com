[[comments]]
order = 25
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-05-19"
text = "الأخ اللي بيقول \"السعودية هى اللى خرجت الرسول محمد صلى الله عليه وسلم وكمان عمر وأبو بكر وخالد وعمرو و حذيفة وسلمان رضى الله عنهم \"<br />لا يا روح خالتك النبي عليه الصلاة والسلام اتولد في منطقة اسمها الجزيرة العربية ...مش السعودية..ومفيش بلد في العالم تنسب لعيلة ..يعني السعودية باللي فيها ملك لآل سعود ..يبقى وحياةوالدك متدخلش النبي في الموضوع ..لأنهم لو كانوا عاملين حساب للنبي كانوا على الاقل سموا البلد المملكة المحمدية ..ولا المملكة الاسلامية ..ولا اي اسم غير ال سعود<br />ووحياة ابوك يا خنزير يااللي كاتب المقال لماتتكلم عن الريس بتاعنا ملكش دعوة بخلافاتنا احنا كشعب مع حكومتنا روح شوف بلدكم بالقرف والفساد و الشذوذ اللي مغرقها ..لكن متتكلمش عن الريس و تقول \"الرجل قال في تصريحات\" اتعلم الادب يا تربية الغنم ..بقول ده حتى لو انا بعترض على سياسة مبارك"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

