text = "بالله يا اخ مصري عاطل ومش لا قي ياكل موقع ولاد البلد ده هو المتنفس الوحيد اللي الواحد بيقول فيه اللي جواه صدقني والله الواحد بيكتب تعليقاته على المواضيع وبعد كده بيحس بالراحه<br />فأرجوك بلاش سب وشتم بهذه الصورة<br />لماذا<br />لان الموقع ممكن يقفل التعليقات مرة اخرى<br />ارجوك وارجو جميع المعلقين بلاس شتيمه ارجوكم موقع ولاد البلد هو المتنفس الوحيد"
