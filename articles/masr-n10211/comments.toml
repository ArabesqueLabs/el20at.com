[[comments]]
order = 23
subject = "اللى ياكل من عيش السعودى .. يضرب بسلاحه"
author = "حمادة الصاوى"
posted = "2007-05-18"
text = "اخوانى المصريين اللى بيشتغلوا فى السعودية ومحموقين قوى ليها مش عارف ليه بتفكرونى بالمصريين اللى كانوا شغالين فى الكامب الانجليزى زمان ويوحى لجونىويقولوا تشترى كاااااااااللب .. والاستاذ اللى حيرشنا بالدم لو رشينا السعودية بالميه .. عايز اقوله اننا فى مصر معندناش حساسية خالص بس ياريت انتوبس تشيلو شيلة المشرق العربى وانتو عندكو فلوس كتير شيلو العراق وسوريا والفلسطينيين ولكم كل الفخر واستخدموا جيوشكم الجرارة اللى دافعتوا بيها عن نفسكوا ايام حرب الخليج الاولى.. ياساتر .. ده انتو ممسخرين العرب بره عارف يا حبيبى ان السعودية ليها سبعة فى المية من اصول الولايات المتحده .. طبعا انتو اغنى ومسيطرين على الاعلام وعايزين تسمعونا من اول راشد الماجد لحد مشارى الراشد عصب عن اللى خلفونا لا ونقتنع كمان ان احنا سيئين .. ياخى زهقتونا"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

