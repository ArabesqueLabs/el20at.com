[[comments]]
order = 49
subject = "فوقوا بقى"
author = "ابو اسامة"
posted = "2007-05-27"
text = "ياعلم فوقوا بقى انا مكنتش فاكر ان فيه ناس هايفة كدة ولسة بتتفرج على القنوات المصرية الى محتلها مبارك وعيلته<br />ولسة بيصوروا مبارك على انه هو ساق الطيارة وراح حرر سينا علشان كدة سينا كلها تبقى بتعته ويعمل الى هو عوزه<br />يعمل كوبرى يعمل فلج نخل ويعدى هو حر الرجل ده انا شفت فى فيلم ابو العربى كان سايق طيارة ودبابة و غواصة<br />وكان بيحارب لوحده يبقى يعمل فى سينا الى هو عاوزه مش هو رجعها رجعت المية فى زوره دانا ابويا والاف العساكر ماتوا<br />محدش قال انهم مسكوا مطوة وحاربوا بطلوا هيافة بقى الراجل ده هو وحكام العرب خاينين وهم من علامات الساعة<br />زى ما قال الشيخ محمد حسان على لسان الرسول عليه الصلاة والسلام ان من علامات الساعة اسناد الامر الى غير اهله<br />فهم ليسوا الا عملاء وخونة باعوا دينهم بعرض ذائل (وسيعلمالذين ظلموا اى منقلب سينقلبون)صدق الله العظيم"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

