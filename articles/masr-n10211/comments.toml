[[comments]]
order = 0
subject = "السعودية والعقدة المصرية"
author = "المواطن مصرى"
posted = "2007-05-14"
text = "فى ملاحظة فى السعودين وهى ان مبيقولوش على المللك بتاعهم اسمة على طول ميعنى مافيش مرة حد سعودى كتب عبد اللة لازم العاهل او المللك او حتى خادم الحرمين لكن وبنفس المنطق يقوللك مبارك او القذافى او خلافة ودى فى تصورى بيبين مدى العنصرية اللى فى دماغهم<br />عاوز ارد على البنى ادم السعودى عبد اللة الغامدى واقولة ان الرئيس المصرى حسنى مبارك وضح تماما ان الرفض جة بسبب ان شرم الشيخ منطقة سياحية لايعقل ان يتم انساء جسر والسياح اللى جايين يدفعوا فلوس يتبهدلواواعتقد انة سبب منطقى جدا<br />لكن مش عارف الاخ عبد اللة الغامدى مصمم انة يحشر مناخيرة فى مواضيع ملهاش دخل بالسعودية زى اسرائيل والقيادة العربية وبمناسبة القيادة العربية لو فرحان قوى ان السعودية اخدت دور مصر يبقى الف مبروك عليكم وكنا نتمنى كدة من زمان لاننا بصراحة نحب نركز على مشاكل المصررين وهيا فى الوقت الخالى اهم اما انتم فعلشان عندكم مشكلة نفسية من زمان فربما القيادة المزعومة عربيا تريح نفسيتكم شوية بس اياك متكونشى زى فنان العرب والجوهلرة السوداء<br />ودمتم"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 1
subject = "مصري مقيم في السعودية"
author = "محمد حسن"
posted = "2007-05-14"
text = "والله معك كل الحق يا أخ عبدالله هذا المبارك يعيش في برج عاجي في شرم الشيخ ولا يعرف ماذا يتعرض له المصريون في الغربة من أجل لقمة العيش التي حرموا منها في بلادهم، حتى وسيلة السفر الآمنة والتي كنا نمني نفسنا بها حرمنا منه<br />ولا أعرف حقيقة أي سياحة هذه التي سيدمرها الجسر<br />حرام عليكم<br />حسوا بنا"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 2
subject = "الحلم العربي"
author = "البرج"
posted = "2007-05-15"
text = "كنت عاوز اوضح كلمة بسيطة وهي هروب السياح من شرم الشيخ ممكن يطفشوا من اقل حاجة واحنا عارفين الكلام ده كويس وكمان الدخل بتاع السياحة بيروح لناس محدودين اصحاب فنادق وبازارت اما الجسر ده اصبح من اشلاء الحلم العربي"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 3
subject = "طز فى السعودية"
author = "مصرى مقيم فى السعودية"
posted = "2007-05-15"
text = "السعودية السعودية وجعتولنا دماغنا بالسعودية نكونشى بتكلم عن امريكا واحنا مش واخدين بالنا وكلمة فى سرك ياسعودى الرئيس بتاعنا قال كلمتة والسعودية على جزمتة<br />سعودية اية اللى عاوزين يعملوا جسر يتوع المعيز دول<br />ياللا شى حا عرررررررررر"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 4
subject = "أمركم غريب"
author = "محمد ميدو"
posted = "2007-05-15"
text = "الأمن القومى المصرى أهم طبعا من أى جسر ..<br />و بعدين سعوديين إيه اللى عاوزينهم ييجوا مصر ؟؟ هى ناقصة ؟؟<br />مش كفاية اللى موجودين فيها و كلابهم اللى عمالة تنهش و تعض فى المصريين ؟؟<br />شرم الشيخ أهم طبعا بمليون مرة من الجسر ده .. يعنى حتى السياحة اللى ولا دنا و إحنا شغالين عليها فى شرم الشيخ عاوزينها تنضرب ؟؟<br />ولا الظاهر إن عقدة المؤامرة ظهرت تانى و إحنا مش عارفين<br />شئ غريب و الله !!"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 5
subject = "ده تحليل  لموضوع ولا مفاضله  بين مصر والسعوديه ؟"
author = "نبضة قلب"
posted = "2007-05-15"
text = "أولا : ان كانت للسعوديه اسباب لاقامه الجسر فأكيد لمصر اسباب اقوى يمنعها لرفض الجسر سياسيه او اقتصاديه او امنيه<br />لان مصر لم تهمل ابدا مشروع يعود بالنفع على اهلها<br />ثانيا : المفروض أ.ب صحافه أنك تحترم تفكير وأتجاهات الجمهور الموجه اليه رسالتك الاعلاميه<br />، أ.ب ذوق أنك تراعى مشاعر القراء خصوصا وانك فى موقع عربى بيطلع عليه كل العرب وأكثرهم من المصريين<br />وحقيقى كلامك عن مصر ورمزها الرئيس مبارك لم تراعى فيه اساسيات الصحافه ولا الذوق<br />ثالثا: مشكلتك ياغامدى انك رصدت الموضوع بعين سعوديه بحته<br />ولم تأخد ف الاعتبار الحياديه التى يجب ان يتسم بها الصحفى خاصة وانت بتتكلم عن موضوع يهم دولتين<br />رابعا : اذاى تغفل تاريخ مصر الذى استمر عقود من السنين تهتم بشؤون العرب والمسلمين وقضاياهم وتدافع عنهم<br />وتزيح تاريخ مصر جانبا وجهود زعماء لمجرد ان بلدك اعلنت مبادره او اتنين واعتقدت انها بكده (( عملت اللى مايعمل))<br />وانها سوف تهمش دور مصر ومكانتها (( على حد قولك ))<br />مصر كانت وستظل القائده والاقوى وثقلها لايستطيع احد اغفاله الا حاقد او جاهل<br />نصيحه اخويه تخلى عن استفزازك وسخريتك فى مقالاتك القادمه<br />وادرس الصحافه شكرااااا"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 6
subject = "ليه يامصر"
author = "عبدالله جابر الفيفي"
posted = "2007-05-15"
text = "ليه ياحبايبنا معقوله كل هذه الردود العنصريه على السعوديه ماذا فعلت لكم السعوديه السعوديه تريد ان تفتح جسرا ليكون التواصل بين ابناء الشعبين سهل وفي اي وقت وليستطيعوا الاخوان المصريين من اداء مناسك الحج والعمره بكل يسر وسهوله بعيدا عن اخطار البحر والتكلفه الباهضه للطيران<br />ليه يامصر مع اننا نحبكم؟"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 7
subject = "مصري مقيم في السعوديه"
author = "محمد بسيوني"
posted = "2007-05-15"
text = "لقد حرمنا الرئيس المصري نحن المقيمين في السعوديه من بارقة الامل التي كنا ننتظرها باقامة جسر بين السعوديه ومصر<br />وان هذا الجسر كان سيخفف علينا عبء السفر بالباخره وما له من مخاطر وكنا سنتواصل كثيرا<br />ولكن الرئيس المصري الجبان رفض هذه المبادره ليخضع للضغوط الاسرائيليه ضاربا بمصالح شعبه عرض البحر"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 8
subject = "مصري يعمل في السعودية"
author = "محمود محمد أحمد السوادني"
posted = "2007-05-15"
text = "سلمت يمين كاتب المقال<br />ومنك لله يا مبارك<br />ضيعت الجسر عشان تعيش حياتك في شرم الشخ<br />واحنا كان الله فبي عوننا"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 9
subject = "انا  مع  الريس ............... (  متقال)"
author = "انا محمد"
posted = "2007-05-15"
text = "والله ما عاد حد عارف حاجه فى البلد دى<br />طب شرم الشيخ ولا الحجاج والمعتمرين اللى بيطلع عينهم كل سنه<br />وبقو ( بيموتوا ) كمان<br />طب السياحه هيحصلها ايه يعنى الارهاب هيجى من السعوديه<br />والله كله بقى طبيخ<br />وفى النهايه لازم كلنا نبقى مع الريس وتحت امر هدوءه وانسجامه<br />ونسمع ونرضى باللى بيعمله (اقصد الريس متقال طبعا)<br />غير كده فمعرفش موضوع الامن وغيره مقدرش اتكلم فيه<br />الجسر هيضر بالامن مش هيضر مش انا اللى احدد<br />والله اعلم"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 10
subject = "الى محمد بسيونى الجبان"
author = "مصرى واللة اعلم"
posted = "2007-05-16"
text = "انا متاكد ان محمد بسيونى هوا فى حقيقة الامر سعودى متخفى وعيب علية يشتم رئيس بلد كبيرة زى مصر لكن مع الاسف ان دى عادتهم فى السفالة وقلة القلب ( طبعا مش كل السعوديين )<br />عاوز ارجع للاخ السعودى اللى بيحب مصر وبيقول لية كل التحامل على السعودية<br />عزيزى احنا كمان بنحب السعودية والسعوديين لكن نظرة واحدة للمقال المستفز دة تعرفك لية الناس شاطت فى صاحب المقال وزى مااحد الاخوة قال ان موضوع الجسر موضوع يهم بلدين ومصر شايفة ان مصلحتها بعيد عن الجسر واحنا احرار يااخى ؟<br />اية بقى يزعل الاخوة السعوديين من كدة<br />ثانيا اية اللى دخل ان السعودية لها دور ريادى حاليا انا شايف انة خلط للاوراق واستفزاز عبيط<br />ولاحول ولا قوة الا باللة"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 11
subject = "مصرى عايش في السعودية وبيحبها"
author = "ليه الكراهية ..."
posted = "2007-05-16"
text = "بسم الله الرحمن الرحيم<br />أولا يا جماعة انا عايش فى السعودية فى جدة من سنتين ...<br />ثانيا ... الشتيمة والكلام اللى مالوش لازمة اللى بيتقال عن السعودية ده ليه .. ايه اللى شعب معيز و الأفلام دى ؟؟<br />الراجل المحترم اللى قال الكلام ده مش حاسس ان المصريين اليومين دول يعتبروا خراف منتظرة الدبح بكل أمانة ... مش مصدقنى ... انزل الشارع و امشى ربع ساعة واتفرج على الباشوات رجال الأمن المحترمين اللى عمالين يلموا عمال على بطال ... و اللى فوقهم اللى مش عاوزين يسيبوا الحكم الا لأبناؤهم ... و دى عقدة جامدة عندنا ... انت نفسك مش نفسك لما تسيب مكانك يجي ابنك اللى بتحبه جدا عشان تفرح بيه ويمسك مكان باباه اللى تعب اوى عشان يوصله ....<br />السعودية يا جماعة مش وحشة اوى زى ما انتوا متخيلين ... السعودية هى اللى خرجت الرسول محمد صلى الله عليه وسلم وكمان عمر وأبو بكر وخالد وعمرو و حذيفة وسلمان رضى الله عنهم ... ودلوقتى فى الوقت اللى أسعار البترول بتغلا ( حتى في قطر ( المنتجة للبترول ) ... نلاقى الملك عبد الله رخص البترول من غير اى مشاكل ... معاك ان السعودية بتنتج بترول و معاك انها مش فارقة ... لكن ما حدش غصب عليه عشان يعمل كده ... الموضوع جه فجأة ومن تانى يوم اتطبق ... وفيه قرار نزل قريب ان اللى مسجون فى ديون أقل من نص مليون ريال ... الدوله هاتدفع عنه و يخرج بعفو ملكى .... برضه ما حدش غصبه على ايده ... فيه كمان حاجة بذمتك انا وانت كمصريين بنعامل الأفارقة اللى موجودين فى مصر ازاى ؟؟؟ ... ولا نسيت اعتصام ميدان التحرير ؟؟ ... اسال اى حد تعرفه بقى السعودية بتعامل الوافدين ازاى ؟؟<br />هل معنى كده انى مش مصرى ؟؟ و بكره مصر و ملوا دماغى بكلام بقى ... واحنا حلوين اهه و شجعنا ...<br />لا والله ... لكن المشكلة انه بيصعب عليا انى انا هنا الاقى اللى عمل حتى السيستم بتاع الشكة واللى شايل الدولة فى الشغل مصريين ... و مش عارف اعمل كده فى بلدى ...<br />يا جماعة لازم نفوق الى ان انا عربى والسعودى عربي و الموريتانى و الجزائرى و اليمنى عربي ... و بلاش بقى احنا احسن منكم ... و نتقمص زى العيال الصغيرة ونشتم فى بعض و ننسى الهم الكبير اللى اسمه ( ا س ر ا ئ ي ل )<br />سؤال أخير ... تفتكر احمد زويل لو كان فضل فى مصر كان هايبقى ايه ؟؟؟؟"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 12
subject = "للاسف المشروع ده مفيد جدا جدا"
author = "مصرى عايش برة ومش فى السعودية"
posted = "2007-05-16"
text = "للاسف الشديد الموضوع ده مهم جدا ومفيد جدا والحجة بتاعة الامن والسياحة حجة هبلة جدا ويمكن ان يتحاشاها المشروع مثلا ان الكوبرى يفضل مغلق من الجانبين بعد نقطة الجوازات المصرية لمده عشرين او تلاتين كيلو مثلا حتى الخروج من شرم الشيخ يعنى اللى مسافر مصر لن يستطيع الدخول الى شرم الشيخ الا عن الطريق القادم من داخل مصر انما السبب الحقيقى لرفض الريس هو اسرائيل وما وراء اسرائيل 00 حاجة اخيرة عاوز اقولها للاخوة اللى نزلوا شتيمة فى السعوديين هو احنا منعرفش نتناقش بأسلوب حضارى شوية ولا لازم اى خلاف فى الرأى نقطع بعض ونشتم بعض !!! عموما ربنا يهدى"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 13
subject = "الحلقة المفقودة فى هذا الموضوع"
author = "احمدابوصالح_صحفى معارض"
posted = "2007-05-16"
text = "انا قرائة تعليقاتكم تعليق تعليق ومش فاهم لية نازلين شتيمة فى السعودية وتحقير من شائنها بالرغم من انها فعلا اصبحت بتلعب دور ريادى فى المنطقة وللاسف مصر تراجعت كثيراااا جداا عن ذى قبل واللة انا بحب مصر جداا بس نفسى ترجعلها ريادتها وكان المصرى يقول فى اى دولة انا مصرى كان زى مايقول كدة لية هيبة لكن الان اعتداء على السفير فى الكويت عادى ضرب العمال المصريين فى ليبيا عادى مقتل السفير المصرى فى العراق عادى والخارجية المصرية مش عارفة تعمل حاجة فبلاش نهر ب من الواقع . وبعدين مش عشان كاتب المقال سعودى وبيعبر عن وجهة نظرة نشتم السعوديين جميعا هو حر فى وجهة نظرة البعتقد انها ليست صحيحة 100% اكيد خيالة شطح فيها لان الرئيس مبارك عندة دايما حاجات بيعملها بنكتشف ساعات انها صحيحة ولو ان انا كنت مع المتحمسين جداا لهذا المشروع وكنت اتمنى انة يكمل وتتحول شرم الشيخ الى دبى اخرى وتنتعش السياحة اكثر والخير يعم على المصريين .....واسف للاطالة.. وشكرا"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 14
subject = "عيب"
author = "مصري برضه"
posted = "2007-05-17"
text = "عيب المصريين انهم لابسين نضارات بمبي فشايفين الدنيا بمبي وهي منيلة بنيلةشوفوا في اي مكان بره مصر اوجواها المصري بيتبهدل ازاي من اللي يسوا واللي مايسوا ووزارة الخارجية ودن من طين وودن من عجين وفي اي بلد عربي ياخ<br />دوا المصري يمرمطوه عارفين ان مالوش صحاب اما الهندي الباكستاني ولو كان زبال مايقدروش عارفين ان وراه حكومة بتحكم مش حكومة واكلة<br />اما اللي بيقول السعودية بتعامل المصريين ازاي؟ فحدث ولا حرج اسواء معاملة طبعا واللي يقول غير كده يبقى ما طلعش من بيتهم قبل كده"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 15
subject = "بلاش تعصب"
author = "اكتب اسمك هنا"
posted = "2007-05-17"
text = "على فكرة كاتب المقال قال حاجات صح بس التعصب بيعمى عن الحق وقبل ما اقول اى حاجة انا لا ادافع عن السعودية لانها دولة عنصرية فى تعاملها مع غير السعوديين وخصوصا احنا المصريين<br />لكن مش معنى كده انى اقف مع الباطل ضد الحق هو كون مبارك مصرى يبقى رأيه صح والرأى السعودى خطأ،طبعا لأ<br />مبارك من يوم ما تولدت عمره ما تخذ قرار فى صالح المصريين كلها لخدمته وعيلته وشلته قانون المالك والمستأجر مشروع توشكى الفاشل مشروع ترعة السلام المتوقف اكمل ولا كفاية<br />سياحة اللى فى شرم اللى مبنية على الدعارة والخمور والتعرى طبعا السياح العراة اهم من الحجاج والعمال فى نظره<br />اسرئيل لما تزرعت فى فلسطين فصلت عرب اسيا عن عرب افريقيا تخيل لو الجسر ده موجود اسيا هتتواصل مع افريقيا بممر برى لاؤل مرة بعد النكبة ويكون خاص بالعرب<br />تفسر بايه ان تسيبى ليفنى وزيرة خارجية اسرائيل تزور مصر وبعدها يطلع المبروك ويهوهو فى المساء"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 16
subject = "ضع عنوان التعليق"
author = "حسام المصرى"
posted = "2007-05-17"
text = "مش فاهم بس أكيد فى أعتبارات تانية كتير من ضمنها زى ماقال الأخ كاتب المقال هى أسرائيل من ناحية ومن ناحية أخرى الريس مبارك لأن هو شايف ان العملية حتبقى ميضة فى شرم والحجاج هيبقو راس براس مع الأخوة الأجانب وأحنا رافعين شعار أن السياحة خير لبلدنا كلها فى طز جداً فى الحجاج الى عايزين يروحو يحجو دى حاجة تانى حاجة وهى ظاهرة الميكروباصات الى ممكن تغرق الدنيا على الكوبرى وممكن يوصلو الحجاج الناحية التانية ب 1.50 زى ميكروباص رمسيس بنها وبكدة يبقو ضربوا عم ممدوح أسماعيل المغرق لخلق الله وممكن جداً يقلب العملية نقل جماعى ويموت الناس على الكوبرى زى ماكان بيعملها فى العبارات ويبقى كل شوية فى الجرايد أتوبيس الموت ميكروباص الموت و توك توك الموت أما بالنسبة لملك السعودية نصيحة هامة لاتحدث ميارك تحدث مع الأدارة الى موضفاه ومقرها فى واشنطن فى واحد هناك أسمة بوش ضيط معاه وهو هيعملك خمس كبارى ياعم وأى خدمة"
archived = "2007-05-18"
capture_url = "https://web.archive.org/web/20070518024115/http://masr.20at.com:80/newArticle.php?sid=10211"

