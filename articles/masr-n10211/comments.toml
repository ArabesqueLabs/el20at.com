subject = "لماذا يا مبارك"
author = "مصري مقيم بالامارات"
posted = "2007-05-20"
text = "لماذا رفض الجسر هذا الجهل العجوز المريض , يعيني الجسر سيدمر الهدوء الذي ينعم به بيت الدعارة الكبير المسمي شرم الشيخ حتي انه سيزعج المومسات الروسيات التي ينعم بهم رئيسنا القذر مبارك وابنه الشاذ المدمن ,<br />فمبارك فضل استخدام السفن والطائرات التي تستغرق ساعات وايام كوسيلة لتنقل ملايين المصريين الي الخليج بالاضافة الي السياح القادمين من الي الخليج الي مصر , عن وسيلة تنقل حديثة تقرب المسافة بين مصر والسعودية الي 20 دقيقة فقط ..هل هذا يعقل يا شعب مصر؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

