[[comments]]
order = 54
subject = "احب السعوديه واكره فيها الكفيل"
author = "ديمقراطية سامي من مواليد السعوديه"
text = "ايه مشكلتنا يا حكام العرب يا شطار كل واحد فيكم خايف على كرسيه من غير ما يفكر ولو للحظه انه هيقف امام الله يوم القيامه ويتسأل عن الرعيه اللي هم الشعب تعرفوا لو العرب فكروا ولو للحظه انهم يتعاونوا مع بعضهم ونخاف على بعض واللي يدخل بينا ندوسه بجزمه وسخه سعتها بس هنحس اننا بخير مش خايفين من حتة بلد غبيه تتحكم فيكم وكمان حاجه مصر كده ليه وفيها فلوس كتير ولا الكبار بينهبوا كله ومش حاسين بالشعب تعالوا شوفوا الاحياء الفقيره في شبرا والغربيه والشرقيه الخ اللي رفض قرار الجسر ده انسان مرتاح عايش في نغنغه وعز لو كان قعد في الاتوبيس بالثلاث ايام لو نام في الميناء عشان الباخره تأخرت وقام من النوم جسمه متكسر ده اذا عرف ينام احنا المصريين نطالب بحقوقنا كامله رواتب ماتجيبش حاجه وكل حاجه بتغلى حسوا على دمكم ياحكام الظلم ظلمات انا عايزه اعرف فلوس مصر بتروح فين بنوك سويسرا ولا الاكل والشرب ولا المشاريع لللناس الهامه الخ من الاخر كده انتم عارفين بلدكم اكتر مني لازم نتعاون عشان الخير يرجع لمصر من تاني<br />اتمنى ان يعجبكم تعليقي ياحلوين"
archived = "2007-08-25"
capture_url = "https://web.archive.org/web/20070825121144/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 55
subject = "يا أمة ضحكت من جهلها الأمم"
author = "بطيخ البطيخ"
posted = "2008-01-11"
text = "ولك يا شباب أنا ماني سعودي ولا مصري وموضوع الجسر هوي شماعة بينت السخف في التفكير العربي هداك بيقول للسعودي مبروك الدور القيادي عليك زهقنا من من نكران المعروف هذا الغبي الصغير اللي بدو كتير تيفهم فكر رجل متل /ناصر/ اللي جيش جيوش من الأساتذة والمثقفين وأرسلهم إلى الدول العربية وهذا السعودي الأحمق اللي يظن أنه من أحفاد الصحابة والسعودية شي شغلة نسيات أنو العرب ميموتو كل يوم بفلسطين والعراق من تحت راس هالنفط النشح ولا شو كان بدا أمريكا فينا الحهل يملأ عقولنا وأنا الجاهل الأكبر فيكم."
archived = "2010-03-14"
