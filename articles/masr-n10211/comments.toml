[[comments]]
order = 30
subject = "اااااااااااااااااااااااه يا مصر"
author = "اسكندرانى"
posted = "2007-05-20"
text = "اولا انا بناشد المصريين ماينجرفوش وراء استفزازات السعوديين ياجماعة دول عالم مافيش فى دماغهم مشاكل وكل همومهم عبيطة سيبوهم يتكلمو اى كلام...بس انا حابب اعلق على كام نقطة...<br />اولا...انا كشاب مصرى...لا اعرف حتى الان سبب رفض مبارك لمشروع زى دة من اللى قراتة هايكون له نفع اقتصادى كبير على مصر...ومش مقتنع ولا اى حد تانى بموضوع الدواعى الامنية...ومن الواضح انه للاسف فعلا انه رفض عشان خاطر عيون اسرائيل ...<br />ثانيا...بالنسبة للاخوة السعوديين اللى فرحانين بان بقا لهم دور قيادى....ياريت ياخويا تاخدو الدور دة على طول وتشيلو عنا شوية...بقالنا عشرات السنين بنساعدو العرب ونقفو جنبهم وفى الاخر يعاملونا اوسخ معاملة...<br />يارب ريحنا بقا من مبارك و وعصابته...<br />واخيرا رسالة اوجهها للشباب المصريين الغلابة...خصوصا الخريجين اللى مش لاقيين شغل...بقولهم انسو....يا اما واسطة يا اما...مافيش امل....!"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
