author = "م / محمد قنديل"
posted = "2007-05-28"
text = "أنا مهندس مصري و مشروع تخرجي من خمس سنين كان مشروع توشكى و الذي يختلف تماما عن مفيض توشكى اللي تكلمت انت عنه مشروع توشكى اللي فشل كان عبارة عن محطة رفع مبارك العملاقة ترفع مياه بحيرة ناصر بارتفاع متغير من 58 م الي 22 م يتم رفع المياه الى ترعة الشيخ زايد بطول 50 كم ثم تتفرع الى فرعين أحدهما للشمال و يسمى دليل 1,2 و الآخر للجنوب و يمر بسحارة (نفق) من تحت مفيض توشكى و يسمى دليل 3,4 الدليل الأول طوله 22 كم و يتفرع الى فرع 1 و المفروض أن يروى 120ألف فدان و فرع 2 برضه 120ألف فدان أما الدليل التاني فيتفرع الي فرع 3 ويروي 100ألف فدان و فرع 4 و يروي 200 ألف فدان"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 52
subject = "ايضاح لمن يرغب"
author = "المصري ابن البلدين"
posted = "2007-06-23"
text = "مشروع جسر بري يربط السعودية بمصر والعكس صحيح من الناحية العملية مشروع رائع وممتاز وخطوة ايجابية للعلاقات العربية العربية والعربية الاسرائيلية كدعم للمبادرة السعودية للسلام ، من جانب اخر عبور المعتمرين والحجاج من شمال افريقيا الى السعودية وليس من السعودية الى شمال افريقيا يعني هو مفيد جدا واكثر للحجاج والمعتمرين ، اما السياحة العربية العربية فأعتقد انه احد الطرق الهامة بجانب الطيران ، من ناحية امنيه (اهل مكه ادرى بشعابها) احتمال ان التوقيت غير مناسب لاقامة جسر الان ، وربما يكون مهم جدا عندما تتحسن نوايا اسرائيل مع جيرانها العرب ، ان العرب في طريقهم الى اقامة سلام مع اسرائيل رسمي وهو الامر الواقع الذي لا مفر منه وليس من مصلحة العرب او اسرائيل استمرار الصراع طالما هناك اتفاق سلام وليس استسلام . الشيء الاخير اعتقد ان التعليقات الخاصة بالاخوان التي تحتوي على شتائم ليس لها مجال هنا ولاداعي لوضع مقارنة بين السعودية ومصر لان المبادرة السعودية هي امتداد للمبادرة المصرية الاولى (كامب ديفيد- السادات) ولايجوز ان تقدم مصر مبادرة عربية للسلام نيابة عن السعودية او غيرها من الدول .. ولا تعارض ان يتقدم اي عربي بمبادرة وبالتنسيق مع الاشقاء العرب وهو ما يحدث ، ومطبخ السياسة لايفهمه الا السياسيين فقط والمقربين من القرار .اما عن دولة تأخذ دور دولة فهذا ليس صحيحا ، لان مصر قوية بالسعودية والعرب والعكس صحيح ."
archived = "2007-08-25"
capture_url = "https://web.archive.org/web/20070825121144/http://masr.20at.com:80/newArticle.php?sid=10211"

