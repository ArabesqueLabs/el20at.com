subject = "بالزمة دة كلام"
author = "عبد المنعم سلام"
posted = "2007-05-20"
text = "ياجماعة انتم عصابة اكيد لان الرئيس حسنى مبارك مش وحش قوى كدة واللى بيتكلم عن مومسات شرم الشيخ افكرة ان فية موقع فى النت لداعرات دبى واضح تماما ان الكلام دة كلة ينسجم مع هوى موقع الاخوان التانى اللى هوا عشرينات اقصد انهم ببساطة كتبوا تعليقات توهم الناس ان دة الحال يعنى انا مستغرب فجاءة الناس كلها مستغربة لية حسنى مبارك رفض الجسر وكاءن الجسر كان المشروع الحلم النتظر طب الناس دى مطالبتشى بالجسر لية طالما ان الكل متفق علية وبعدين لية الناس متاكدة قوى انة مفيد لمصر يعنى كل الناس دى علماء ودكاترة وحكاية انة بيوفر مشقة السفر للناس بتاعت الشغل فى السعودية طب ماطريق ضباء سفاجا بياخدها فى 24 ساعة<br />يااخوان ياللى بتكتبوا فى الموقع دة ويابتوع الموقع صدقونى الكلام دة مبيخوشى الناس وبيكرهم فى حسنى مبارك لانة ببساطة مبالغ فية جدا جدا ومع الاسف انتم لاعندكم انتماء لمصر اللى عماين تغنوا عليها ولا حتى عندكم انتماء للاسلام اللى عمالين ترفعوا شعارة لان الشتيمة بالطريقة القذرة دى مش من الاسلام"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 34
subject = "ما تسيبوا الناس تاكل عيش"
author = "واحد من الناس"
posted = "2007-05-21"
text = "يا جماعة انتوا مش شايفين المسألة على صورتها الحقيقة .... طيب لو الجسر ده قرب المسافة و ربط بين البلدين العبارات و اصحاب العبارات يعملوا ايه يعنى يأجروها فلوكة على النيل مثلا للحبيبة و لا يعملوها عوامات و يسكنوا فيها!! طيب و مين اللى هيغرق و يفتح باب رزق للحانوتيه و يغدى سمك القرش غدوة معتبرة كل يوم و بعدين شرم الشيخ مدينة الاكسلانسات تتملى قمل من اللى معدى رايح جى من العمال الغلابة اللى رايحين ياكلوا عيش فى بلاد العرب.... يا ناس اتقوا الله بقى الراجل هيأكلكوا منين و انتوا اكتر من الهم على القلب ... جتكم داهية ماليتوا البلد"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 35
subject = "يا شباب كلامكم مرعب"
author = "مسلم"
posted = "2007-05-21"
text = "انا مش قادر أتصور ان الشتايم دي بين مسلمين بعضهم مع بعض هو ايه اللي حصل علشان كل ده. عاوز أبلغ رساله لكل شخص شتم أخ مسلم له بسبب او بدون سبب او ظن فيه ظن سئ. أتق الله. و بعدين أحنا كلنا عيوب و ذنوب.<br />حتي يغيروا ما بأنفسهم<br />اللهم أهدي شباب المسلمين و أصرف عنهم شياطين الجن و الانس"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 36
subject = "الكلام هنا بقى موجه للاخوان المسلمين .. احترموا مص"
author = "صلاح شادى"
posted = "2007-05-22"
text = "الرجاء يا جماعة تفصلوا بين زهقكم من مبارك كرئيس مبلط فى الحكم بقالة كذا وعشرين سنة وبين مناقشتكوا لموضوع الجسر ده فى حد ذاته .. واضح ان الموضوع متمش دراسته انتو عارفين مثلا ان الخط التالت بتاع المترو بقالهم 10 سنين بيعملوا دراسات مسحية ليه .. الحاجات مش كاظمانى كده ومش عشان ملك السعودية مسافر الشمال بالصدفة قالك يالله نفتح كوبرى مع مصر .. الكلام هنا بقى موجه للاخوان المسلمين .. احترموا مصر لجل خاطر النبى .. تعاملو مع المسائل اللى تخص امنها القومى بحساسيه .. يمكن ساعتها النس تبصلكوا على انكم ناس جد مش عدد فى الليمون وخلاص"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 37
subject = "يا عم صلاح"
author = "احد من الناس"
posted = "2007-05-22"
text = "يا عم صلاح يا شادى ايه اللى جاب خاطر النبى للاخوان المسلمين للجسر .... و بعدين ايه اللى ادراك ان المشروع ما أتعملوش دراسة مع وجود الدراسات من حوالى 16 سنة ... هوه كوبرى فوق ترعة علشان الملك يعدى يقولك اعملولنا كوبرى هنا علشان نعرف نعدى!! و بعدين يا عم صلاح ايه علاقة الاخوان المسلمين بالكوبرى (و على فكرة انا مش منهم) ده بعد كده تقولى سبب هزيمة الاهلى من الزمالك كان سببها الاخوان المسلمين!! و بعدين طيب يا أخى صلاح , \"توشكى\" مثلا معمولها دراسات من أكتر من 40 سنة و بالمناسبة أدعوك أنت و انا نطلع رحلة بالفلوكة لغاية توشكى و نتفرج على الخرابة اللى انسحب منها معظم المستثمرين و كانت مقبرة لمليارات اترمت فى الرمل!!! يا عم صلاح الموضوع باين زى الشمس"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
order = 38
subject = "بيقولو مصر مبارك انا عرفت مصر مريضة ليه"
author = "Batistuta"
posted = "2007-05-23"
text = "يا مستعمر انت عندك حق بس يه فرق كبيييييييييييييييير اوى بين مصر البلد والمكان و مبارك الشخص بحكمه<br />يعنى لما يبقى سواق العربية اضبش وحمار اكيد العربية هتتخبط والناس مش هيقولوا دى عربية حمارة لا هيقولوا سواق حماااااااااااااااار<br />اما بقى للاخوة الظراف اللى بيقولوا حسنى مش وحش اوى كده والتانى اللى دخل الاخوان فى الخط فانا بعذرهم يمكن بيقعدوا مع الباشا ظابط امن الدولة كتير او يمكن بيتكلمو عن حسنى تانى"
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

[[comments]]
