text = "التاريخ بيقول والجغرافيا واضحة انة مصروالسعودية بيشكلوا راس رمح بيضرب بوش وحبيب قلبة اولمرت لوحصل حاجة كدة زى احتلال بلد عربى تانى غيرالعراق بحجة سلاح نووى اوارهاب حسب مواصفات ومزاج امريكا لان فى الاخر حييقى الدور على مصر والسعودية ودة كلة عشان خاطرعيون اسرائيل وتبقى عايشة بامان واحنا بنتخانق على اتفة الاسباب وعجبى"
