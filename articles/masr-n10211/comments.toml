subject = "لازم تغرقوا"
author = "ابو اسامة"
posted = "2007-05-23"
text = "الظاهر ان الئيس المصرى مصمم انه يغرق الناس والاخوة الى سابوا الجسر وبيتكلموا عن ادوار مفيش اى دور لاى حاكم عربى لانهم للاسف مشيين ورا امريكا ولا ليهم دور ولا نيلا كل يوم مؤتمر فى السعودية ومرة فى شرم الشيخ<br />واللى بيحصل هو اللى عوزاه امريكا يبقى فين دور الجبناء العرب وخليكوا ساكتين لما الشعب يغرق اكتر ما هو غرقان فى الفساد"
