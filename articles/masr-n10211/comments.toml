[[comments]]
order = 40
subject = "إلى الشعب المعيزي ؟"
author = "شاب كنت بالسعودية"
posted = "2007-05-24"
text = "أنا كنت بشتغل فى السعودية الشعب المعيز و الخراف و ذوى الأربع ما يجيبوا سيرة الريس (رغم إنني مختلف معاه فى سياسته) لو أتفتح الجسر حيبقى زي جسر البحرين السعودي يوم الأربعاء بيقول أنا رايح الكابريه و يعدي الجسر فى نصف ساعة يبقى فى الكابريه (البحرين) و مش ممكن تبقى مصر زي البحرين أنا بأيد الرئيس فى قراره حتى لو لو فى شوية ظلم للمصريين المقيمين فى السعودية و لكن أنجس شعب هذا خليه فى بلده العالم كله عارف إنها أطهر أرض بأنجس شعب ذي الشذوذ و النجاسة السعودي ما بيهدا إلا لما بيضاجع الخادة..إلا من رحم ربه."
archived = "2007-06-22"
capture_url = "https://web.archive.org/web/20070622115827/http://masr.20at.com:80/newArticle.php?sid=10211"

