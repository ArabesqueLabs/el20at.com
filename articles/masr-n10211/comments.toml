text = "ياجماعه انتو عرفين احنا العرب مش نفعين ليه عشان مبنفكرش ولا بنفهمش كل اللى نعرف نعمله نسب ونلعن وبعدين السعوديه هتجيب جنود فى سينا عشان تحمى مصر متحمى نفسها الاول وبعدين بدل مايعدى عليهالسعودين يعدى عليه الامريكان وزى ما امريكا مبتحمى اسرئيل هى برضه بتحمى ال سعود واسال الملك عبداللهبامرات اتفاقيه السلام"
