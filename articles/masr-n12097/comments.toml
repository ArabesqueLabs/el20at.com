[[comments]]
order = 0
subject = "سلاح جديد"
author = "ابو محاسن"
text = "يبدوا ان وزارة الداخلية قد استحدثت قوات جديدة او ميليشيا لا ندرى تتبع من او يقودها من من الكبار ومدربة على احدث فنون الكارتية والضرب المتلاحم والاشتباك مع المتظاهرين والمتجمهرين وضرب الشرطة احيانا والتدخل فى الانتخابات وامام صناديق الاقتراع ويرجح انها تابعة للجنة السياسات"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027033304/http://masr.20at.com:80/newArticle.php?sid=12097"

[[comments]]
order = 1
subject = "هذا ما توصل اليه مناقشات الحزب الوطني"
author = "خالدالامير"
text = "هذاملتوصل اليه الحزب الوطني تمهيدا للمؤتمر العام الذي يحضره الرئيس فهذا الفكر الجديد القديم لمواجهه المعارضه في كل مكان البلطجه ولاشئ يعلو فوقها"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027033304/http://masr.20at.com:80/newArticle.php?sid=12097"

[[comments]]
order = 2
subject = "البلاك ووتر"
author = "طالب"
text = "اليس هؤلاء البلطجية هم تبع شركة black water التى تعمل فى العراق ولكن بصورة مصرية وبلطجية مصريون"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145800/http://masr.20at.com:80/newArticle.php?sid=12097"

[[comments]]
order = 3
subject = "عين شمس"
author = "محمد باشا"
text = "احب اعرفكوا ان اللي قالع هدومه ده يبقى نائب رئيس اتحاد الطلاب بالجامعة<br />ومنظره يغني عن اي تعليق"
archived = "2007-11-28"
