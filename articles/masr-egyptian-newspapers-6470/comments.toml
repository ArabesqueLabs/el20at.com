subject = "الحلول الأكيدة لحل مشكلة المرور بالقاهرة"
author = "باروما"
posted = "2007-06-30"
text = "من غير كلام كتير الحلول : 1) منع تجديد تراخيص القاهرة للسيارات التجارية التى تزيد عمر انتاجها عن 15 سنة و منعها من السير فى القاهرة على ان يمكن السماح لها بتجديد ترخيصها و تسيرها فى اى محافظة اخرى غير القاهرة الكبرى و الأسكندرية و هذا لكل من: الأجرة - السرفيس- النقل التجارى - نقل الركاب .يقدروا يكلوا عيش فى المحافظات الأخرى من غير تلويث البيئة و تعطبل المرور فى القاهرة.<br />2) منع منعا باتا سير أى سيارات أجرة او نقل او سرفيس ترخيص اى محافظة اخرى بالقاهرة و اقتصار حدودها حتى أول حدود محافظة القاهرة (يعنى يوصلوا لحد أول القاهرة و بعد كدة يشتغل أهل القاهرة بالسيارات الأقل من 15 سنة نضافة بأة بدل عربيات المواشى الى ماشية فى القاهرة وجهة مصر .<br />3)عمل اختبارات القيادة و تجديد رخصة القبادة كل ثلاثة سنوات بعد أختبار حقيقى مش من منازلهم و برشوة .( السيارة سلاح قاتل مثل المسدس و السكينة فلا تمنح الرخص للمتخلفين أو المراهقين أو عديمى الثقافة و هم أرهابين من نوع آخر<br />4) قبل تجديد رخصة أى سيارة يجب و للآخر مرة بنقولها يجب ان تجتاز اختبارات السلامة ( السيارة سلاح يقتل ايضا).<br />5) خصخصة شرطة المرور و تكليف شركات خاصة بتنظيم و مراقبة المرور بوسائل متطورة و اعطائهم صلاحيات بالتعاون مع الشرطة فى بعض الحالات.<br />6)الغاء ترخيص القيادة تماما و حبس من بقوم بمخالفات تتعدى 12 مخلفة فى السنة ( بس ياريت تزودوا عدد السجون لأن 60% من قائدى السيارات فى القاهرة حيزوروا الأماكن دى).<br />7) آخر حاجة و طبعا حيزعل كتير : صرف كوبونات وقود بحدود معينة بالأسعار العادية للملاكى مع مرعاة باقى المركبات التجارية الأخرى فى زيادة حدودها ، و الى يخلص كبوناتة يشترى بفلوس و تكون القيمة أغلى شوية ( علشان الناس تهدى و تقتصد و بلاش تضيع وقتها فى الشوارع بدون داعى)<br />ربنا معانا و الله ولى التوفيق"
