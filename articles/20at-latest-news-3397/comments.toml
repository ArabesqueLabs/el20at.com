text = "اولا .. ان كان هذا قاضي ينوي الهرب فهو يهرب من نفسه .. لانه ادرى بنواياه حين حكم بالاعدام .. فحكمه لم يكن بعقل القاضي بل بعقل المحتل وتلبية رغباته وتزكية لاحقاد الاكراد ضد صدام حسين وهو مدرك ان نهايته ستكون وخيمه ولن ينعم براحة البال بعد ما قام به في المحاكمه<br />ثانيا سيلتجا الى فرع من فروع اعداء العرب فهنيئا له... لانه يعتبرون من يخون بلده يخون اي بلد اخر وعلى الارجح انه لن يحظى باللجوء بل سيبقى في العراق ليلقى حتفه ... وبجداه"
