subject = "عِشْرُونَ صَابِرُونَ يَغْلِبُوا مِائَتَيْنِ"
author = "مش ضروري"
text = "ممكن افهم لماذا قاطع الاخوان المسلمين الانتخابات<br />علشان خاطر مش عاجبهم 20 واحد بس<br />لو هما بيفهموا في الدين صحيح كان المفروض اول ما يسمعوا كلمة عشرين دي ترتعد قلوبهم لان ربنا ذكرها في القران<br />عِشْرُونَ صَابِرُونَ يَغْلِبُوا مِائَتَيْنِ<br />ان يكن منكم عشرون<br />ياخسارة يا فضيلة المرشد السياسة نستك كلام ربنا يا فضيلة المرشد<br />المفروض الاخوان المسلمين دول دعاه الى الله سبحانه وتعالى وانهم اي مكان بيتواجدوا فيه بيدعوا الناس الى الالتزام بدين الله عز وجل والتمسك بسنة النبي محمد صلى الله عليه وسلم<br />المفروض<br />يعني عشرين واحد كفاية اوي اوي للدعوة الى الله سبحانه وتعالى في هذا المكان كما قال ربنا في القران<br />عِشْرُونَ صَابِرُونَ يَغْلِبُوا مِائَتَيْنِ<br />يا جماعة النبي محمد صلى الله عليه وسلم كان داعية الى الله اولا واخيرا<br />يعني لما انا الحكومة تديني عشرين مقعد افرح واقول الحمد لله ان انا<br />عِشْرُونَ صَابِرُونَ يَغْلِبُوا مِائَتَيْنِ<br />للاسف الاخوان المسلمين دخل فيها ناس سياسيين نسيو الدعوة الى الله<br />عمر بن العاص لما طلب المدد من عمر بن الخطاب وطلب منه بضعة الاف<br />بعث له بعض الصحابة وقال له ان الواحد بألف والقصة معروفة<br />يا اخوان يا مسلمين اتقوا الله وعودوا الى الدعوة الى الله وسيبكم من السياسة وتصدر المجالس<br />يا اخوان يا مسلمين امريكا بتساعدكم ليه<br />فتحي سرور راجع من امريكا عايز يعمل حزب للاخوان ليه"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132037/http://masr.20at.com:80/newArticle.php?sid=15062"

