subject = "فعلا مش ضروري"
text = "لذيذ أوي أول تعليق بتاع مش ضروري ده.... ما شاء الله عليه نفسي أعرف ازاي عرف يخيط وش الدين في ظهره و راسه في رجله كده...لأ و بيتكلم بالايات و الأحاديث كمان... يابني روح اقرا تفسير و كتاب و لا مجلة ميكي حتى...عارف... نظام سمك لبن بطاطس بالكاتشب كده... والله ضحكت لما قريت التعليق بتاعه... ربنا يهدي.... أو ياخد"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132037/http://masr.20at.com:80/newArticle.php?sid=15062"
