subject = "صباح الخير يا جاري انت في حالك وانا في حالي"
author = "مش ححبك"
posted = "2008-11-19"
text = "المفروض الواحد ياخد باله كويس من الجيران دول يعني خير الامور الوسط ويتعامل معهم بما يرضي الله لان اي خلاف حيبقى مشكلة كبيرة لانه جارك وما تقدرش تستغنى عنه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "بنت الجيران زي اختك ياض انت وهو يا صايع يا ضايع"
author = "مش كاتب"
posted = "2008-11-19"
text = "يا صايع يا ضايع انت وهو ما حدش يعاكس بنت الجيران<br />بنت الجيران زي اختك بالضبط فاهم انت وهو لا لأ<br />وانتي يا ختي انت وهي بلاش تشاغلوا ولاد الجيران لانهم مفلسين ومتنيلين<br />ابن الجيران يا دوب حياخدك السيما ويقعد معاكي في اخر صف علشان خاطر تبوسوا بعض<br />مفيش جواز ولا بتاع ما حدش لاقي شقق يا ختي ولا لاقي وظايف<br />كل واحد يحترم نفسه كده ويبقى محترم علشان خاطر الكبار ما يقعوش في بعض"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "وانت يا راجل انت وهو ما تبصبصش لمرات جارك خليك محت"
author = "مش ناوي"
posted = "2008-11-19"
text = "ما حدش يبصبص لمرات جارح لانها احلى من مراته<br />انا فاهمكم كويس يا شوية رمم<br />غض بصرك واحمد ربك على اللي انت فيه<br />فيه غيرك مش لا قي حاجه خالص"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "ايه الكلام ده"
author = "مواطن"
posted = "2008-11-20"
text = "احب اشكر الاخ المحاور على موضوعه الشيق<br />اما المعلقين اللي بيستظرفوا دول احب اقولهم انتو حد تافه اوي اوي بلاش بقى عبط وهترلة اتعاملوا مع القضية بشئ من الجدية شوية انتوا لا منكم ولا كفاية شركم<br />اعوذ بالله من ديه طائفة غريبة صحيح"
archived = "2010-03-14"
capture_url = ""

