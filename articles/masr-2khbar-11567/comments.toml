[[comments]]
order = 0
subject = "مدريتشى مش مشمش مطلعشى مشمش"
author = "حنجور"
posted = "2009-03-15"
text = "لا واللة ظريفة<br />طيب وابو الغيط لما كان بياخد ليفنى بالاحضان قبل احداث غزة وقلبت الراى العام العربى ضدنا واتشتمنا فى كل القنوات العربية وقالوا علينا متواطئين مع اسرائيل ما زعلش منة لية<br />والوزير اللى العبارة غرقت ايامة والقطار اللى ولع بناسة مزعلش منة لية<br />ومجلش الشورى اللى ولع مزعلش من الوزير المسئول لية<br />لا لا لا لا<br />اكيد القصة حاجة تانية خالص<br />وبعدين اثيوبيا دول حبايبنا<br />لالالالالا<br />اظن السبب هو ان مشمش مطلعشى مشمش"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "الوزير رفض بيع مياة النيل للفلاحين"
author = "اكتب اسمك هنا"
posted = "2009-03-15"
text = "الوزير هيبيع مياة الرى او مياة النيل للفلاحين زى ما نشرت الجرائد<br />ودى اول مرة تحدث فى تاريخ مصر<br />والمتوقع لو حدث هذا ان اسعار الخضروات والفاكهة والحبوب ستتضاعف وبعض الفلاحين لن يقدروا على الدفع ولن يزرعوا ارضهم<br />وهى دعوة للفلاح المصرى لترك الزراعة والبحث عن مهنة اخرى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ما انش الاوان يا ريس"
author = "عسكر"
posted = "2009-03-16"
text = "سؤالي هذا الي سياده الريس الا ان الاوان ان تقيل هؤلاء الذين نهبوا خيرات البلد يا ريس دول هما اللي خلوا الشعب يكرهك.يا ريس جاء نظيف واعوانه علشان ينضفوها.حرام كده هتتحاسب علي كل ده.انا والله بحبك بس هاحبك اكتر لو شلت هؤلاء الحراميه اللي كلوا البلد في بطنهم.ارجوك الواحد قرب يفقد الامل في المستقبل."
archived = "2010-03-14"
