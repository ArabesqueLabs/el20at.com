[[comments]]
order = 2
subject = "الى المدعو حسام المعلق السابق الاناء ينضح بما فيه"
author = "مش بحبك"
text = "المقال سخيف ولا انت مخك فاضي وما عندكش حاجه تقولها<br />يعني المقال بيتكلم يا حضرة الغبي عن حدث مهم غير وجه العالم كله واصبح يقال العالم قبل 11 سبتمبر والعالم بعد 11 سبتمبر<br />المقال بيفكرنا بهذا الحدث المفتعل اللي خلا امريكا تكشف عن وشها القبيح تجاه العرب والمسلمين وتعلن عن مخططها ضدهم بدون حياء او خجل.<br />وانت مش شغلتك تقييم المقال يا جاهل انت شغلتك تقرا المقال واذا كان في حاجه في مخك الفاضي تقولها بمناسبة هذا الحدث<br />وما تورينا انت يا فالح مقالات امك غير السخيفة فرجنا كده علينا قولنا الموقع اللي مقالاتك العظيمة بتنزل فيه علشان خاطر نروح نقرأ.<br />والى الاخوة القراء<br />مش علشان خاطر التعليقات مفتونحة واي واحد بيقول اي حاجه بتنزل نبقى نجيب الزبالة اللي عندنا<br />حاولوا تدوروا على اي حاجه كويسه جواكوا وتكتبوها بلاش<br />ولا الاناء ينضح بما فيه"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023237/http://masr.20at.com:80/newArticle.php?sid=11898"

[[comments]]
order = 3
subject = "من 5 يونيو الى 11 سبتمبر"
text = "كما تعلمون يا اخواني الاحباء ان العرب اتهزموا هزيمة نكراء في 5 يونيو وتكرت اثر شيء في نفوس العرب عموما والمصريين خصوصا<br />فلما جه السادات وحقق بعض الانتصارات الجزئية على اسرائيل عمل حركة ذكاء كويسة انه جه في يوم النكسة 5 يونيو واعاد افتتاح القناه واصبح هذا اليوم احتفال بدلا ما كان حداد وذا حركة ذكية من السادات<br />وكمان 15 مايو كان يوم اغتصاب فلسطين كما تعلمون فجه السادات وعمل ثورة في نفس اليوم وبأه يوم احتفال<br />فيوم 11 سبتمبر لازم العرب يفكروا في حدث مهم جدا يعملوه في نفس اليوم (زي ما السادات عمل) في 5 يونيو و15 مايو يفكروا في حدث عالمي يغير سيرة هذا اليوم الكئيب"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023237/http://masr.20at.com:80/newArticle.php?sid=11898"

[[comments]]
order = 4
subject = "50 مليون دولار للقبض على (بن لادن) الذي لا وجود له"
author = "مش لازم"
text = "على ما يبدو يا جماعة ان بن لادن دي قصة خيالية وهمية ابتكرتها امريكا مثل شخصيات والت ديزني وذلك لاستخدامها ضد العرب عند اي تحرك ضدهم وانا متأكد من ذلك يعني مفيش حد اسمه بن لادن اصلا<br />يعني بن لادن دا عامل زي بابا نويل دميه<br />وتأييدا لكلامي ايام انتخابات بوش وكان بوش على وشك السقوط استخدموا الدمية وطلع فلم لبن لادن يتوعد فيه الامريكات بالخراب والدمار الامر الذي جعل الناخب الامريكي يهرع مرة ثانية الى بوش<br />وممكن امريكا لما تيجي تغزو سوريا تقول ان بن لاند مستخبي في سوريا وهي داخلة تدور عليه<br />ولما تيجي تغزو ايران سيكون نفس السبب ان بن لادن له جماعة هناك<br />وهكذا<br />بأنه معقولة بن لادن لسه عايش وامريكا مش عارفة تقبض عليه<br />امريكا اللي بتجيب رؤساء الدول من قفاهم مش عارفة تقبض على واحد عادي<br />لا وايه امعانا في المسلسل عامله جائزة 50 مليون دولار لمن يقبض على بن لادن"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023237/http://masr.20at.com:80/newArticle.php?sid=11898"

