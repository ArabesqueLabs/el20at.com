[[comments]]
order = 6
subject = "أسامة بن لادن.. حي أم ميت؟"
text = "الصحيفة الفرنسية \"لو ريبوبليكان\" نشرت تقريرا نقل عن جهاز مخابرات فرنسي يقول ان السعودية مقتنعة بأن اسامة بن لادن توفى لاصابته بالتيفود في باكستان<br />باريس (رويترز) - قالت وزارة الدفاع الفرنسية مؤخرا إنه لم يتسن التأكد من تقرير للمخابرات الفرنسية يفيد بوفاة أسامة بن لادن زعيم تنظيم القاعدة ولكنها أضافت أنها ستبدأ تحريات حول الوثائق السرية التي تسربت.<br />وأصدرت وزارة الدفاع البيان بعد ان نشرت صحيفة اقليمية فرنسية هي لو ريبوبليكان تقريرا نقل عن جهاز مخابرات فرنسي قوله ان السعودية مقتنعة بأن اسامة بن لادن توفى لاصابته بالتيفود في باكستان الشهر الماضي.<br />وقالت وزارة الدفاع في البيان: \"لا يمكن تأكيد المعلومات التي نشرت صباح يوم السبت في صحيفة لو ريبوبليكان والمتعلقة بوفاة أسامة بن لادن المفترضة. طلبت وزارة الدفاع بدء تحقيق لمعرفة أصل تسرب التقرير والذي يمكن معاقبته لارتكاب تهمة جنائية\".<br />ونشرت الصحيفة ما قالت انه نسخة من تقرير يحمل تاريخ 21 ايلول وقالت انه عرض على الرئيس الفرنسي جاك شيراك ورئيس الوزراء دومينيك دو فيلبان ووزيري الداخلية والدفاع في نفس اليوم.<br />وقالت الوثيقة: \"وفقا لمصدر يعتمد عليه عادة فان اجهزة المخابرات السعودية مقتنعة الان بأن اسامة بن لادن توفى\". واضافت: \"المعلومات التي جمعها السعوديون تشير الى ان رئيس تنظيم القاعدة كان اثناء وجوده في باكستان يوم 23 اغسطس 2006 ضحية اصابة خطيرة جدا بالتيفود أدت الى اصابته بشلل جزئي في الاعضاء الداخلية\".<br />وقال التقرير الذي يحمل خاتم \"عسكري سري\" وعليه الاحرف الاولى لجهاز المخابرات الفرنسي ان السعودية تلقت المعلومات اول مرة في الرابع من ايلول وانها تنتظر مزيدا من التفاصيل قبل ان تصدر اعلانا رسميا.<br />وقال مسؤول كبير في باكستان انه لم تتبادل أي حكومة أجنبية معلومات مع باكستان تؤيد القرير عن وفاة ابن لادن.<br />وكان ابن لادن السعودي المولد يقيم في افغانستان الى ان اطاحت القوات التي تقودها الولايات المتحدة بحكومة طالبان في اواخر عام 2001 . ومنذ ذلك الحين قال مسؤولون امريكيون وباكستانيون انهم يعتقدون انه يختبيء في مكان ما على الحدود الوعرة بين افغانستان وباكستان.<br />وكانت اخر رسالة مسجلة على شريط فيديو اصدره ابن لادن في اواخر عام 2004 لكن توجد عدة شرائط صوتية منخفضة النوعية صدرت هذا العام."
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023237/http://masr.20at.com:80/newArticle.php?sid=11898"

[[comments]]
order = 7
subject = "سيناريو تفجير اكبر ناطحات سحاب في نيويورك ؟"
author = "الخوارجي"
text = "سيناريو تفجير اكبر ناطحات سحاب في نيويورك ؟<br />بخياله فقط ولو حتي مجرد \" حلم \" !<br />اسامة بن لادن كان الوحيد الذي فكر في هذا الأمر<br />يا له من رجل خطييير<br />الحقيقة أن هناك أكثر من عشرين شخصا فكروا في ضرب البرجين بالطائرة منهم أنا (لا أمزح)<br />و منهم أيضا صاحب لعبة illuminati<br />الذي قامت أمريكا بمنع لعبته منالإنتشار من سنوات الثمانينات إلى سنة 1997<br />حيث صرح في لعبته عن ضرب البرجين و انتشار الأوبئة وضرب لندن<br />و تزوير التاريخ في المعاهد<br />و غيرها من الأخبار التي يقولون أنها ليست غيبية<br />بل هي خطط لمنظمة تحكم العالم إسمها illuminati التنويريون<br />وفيها أيضا skulls and bones وبوش عضو فيها<br />و ايضا الأخطر على الإطلاق<br />منظمة حكماء صهيون sages de sions<br />أو بإسم آخر<br />franc maçon لماسونيون الأحرار<br />و يقال أن أحد أمراء الخليج عضو معهم<br />وهذا مخيف<br />إذا أنا فكرت فيها بللإضافة إلى صانع لعبة صرح بأسرار خطيرة<br />بالإضافة إلى فيلم<br />الفيلم تم لإيقافه و ضاعت الأموال<br />المخرج تعجب من تحقق أحذا ث فيلمه في الواقع..."
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023237/http://masr.20at.com:80/newArticle.php?sid=11898"

[[comments]]
order = 8
subject = "معجزة الرقم 11"
text = "اولا نتعرف على هذه المعلومات الغريبة<br />1- كلمة New York City<br />11 حرف<br />2-Afghanistan لو تعدونها 11 حرف<br />3-Ramsin Yuseb الارهابي اللي هدد امريكا عام 1993 انه يهدم البرجين اسمه متكون من 11 حرف<br />4-George W Bushالرئيس الامريكي باسمه 11 حرف<br />يمكن كل هذا حدث بالصدفه بس انظر<br />والباقي أكثر:<br />1- نيويورك سيتي فيها 11 مدينه<br />2- اول طياره إصطدمت بالمبنى كان رقمها 11<br />3-الرحله 11 الي إصطدمت بالمبنى كان فيها 92 راكب 9+2 =11<br />4-والرحله77 الثانيه الي إصطدمت بالمبنى كان فيها 65 راكب 5+6=11<br />5-والمأسات هذه كانت ب-سبتمبر 11 او المعروف 11/9 خلونا نعدها وحده وحده 9+1+1=11<br />6-وطبعا رقم الامن الي توزع هذاك اليوم مثل ماهو معرووف 911 احسبوها 9+1+1=11<br />1-الضحايا بالطائرات كانوا 254 ..2+5+4=11<br />2- الانفجارات فمدريد في 2004/11/3 احسبوها تصبح 3+1+1+2+4= 11<br />3-وكانت بعد احداث امريكا ب 911 يوم احسبوها 9+1+1= 11<br />ما اقتنعتوا ؟؟!!<br />المهم نعود لموضوعنا كيف تعرف ان احداث 11 سبتمبر موجودة عندك في الجهاز قبل ان تحدث؟<br />الخطوات:<br />افتح المايكرسوفت وورد<br />اكتب بالحروووف الكبيره Q33 NY<br />وهذا هو رقم رحلة الطائرة التي نسفت برج التجارة<br />المهم ظللها حط حجم الخط 48<br />وظللها وغير نوع الخط في واحد اسمه Wingdings\"هناك خطان بنفس الاسم جرب الاثنين الى ان يظهر لك شكل احداث سبتمبر\"<br />وتفجيرات اليوم بالجزائر العاصمة جائت في ال 11من هذا الشهر<br />و لو جمعنا الشهر و السنة 11 / ( 04 / 07 ) 07+04 = 11<br />و التفجيرات جائت على الساعة 11سا 00 د<br />عدد الموتى في احد التفجيرات هو 11<br />و للضحك فقط عدد أهداف البارحة في كأس رابطة أبطال أوروبا هو (7+1)+(2+1)=11 [INDENT][/indent]"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023237/http://masr.20at.com:80/newArticle.php?sid=11898"

