subject = "مقال روعة"
author = "عبدالرحمن عياش"
text = "و الله جميل اوي يا بيرو<br />انا بقى كنت وقتها بحفظ قرآن و نزلت جري عشان اقول للشيخ اني مش هحضر<br />و بابا كان نايم رحت اصحيه و اقول له امريكا بتنضرب<br />بس انا لحد الطيارة التانية كنت فاكرها حادثة عادية<br />انا لا اقتنع بنظرية المؤامرة اللي بيسوق لها الكثيرين<br />لكن ممكن فعلا لا تكون بهذه الفعالية<br />عموما مقال رائع اوي في رأيي<br />سلام"
archived = "2007-09-22"
