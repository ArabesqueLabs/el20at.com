[[comments]]
order = 0
subject = "لا عزاء   فى الشهداء"
author = "مصرى"
posted = "2008-07-04"
text = "كلما سقط منا بطل تقدم بطل اخر من الخلف لحمل الراية<br />الناس فى زمن وسخ<br />القران والكتاب والسنة والواقع يقول لك عدوك فلان ولكن المطبلين من حول كرسى النظام يقولون لا والف كلا<br />اعدائنا بتوع غزة والفلسطنيين وحماس وكذلك حزب اللة وايران<br />النظام الفاشل يقول اعدائنا هم نفس اعداء اسرائيل وامريكا<br />اصدقائنا اليهود واسرائيل وامريكا<br />ويخرج واحد من اولاد الارض - مصرى اصيل مش امة انجليزية يقول خدوا بالكم هؤلاء اعدائنا<br />ويكتب موسوعة فى الصهيونية والاستعمار الاستيطانى فى اسرائيل<br />انة رجل لم يغير جلدة<br />فلاح من اولاد الارض<br />مصرى اصيل<br />مات فارس وشهيد"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705174431/http://masr.20at.com:80/newArticle.php?sid=16614"

[[comments]]
order = 1
subject = "اوعى سيبه ده المصدر بتاعى !"
author = "واحد كان معاكوا فى العزا"
posted = "2008-07-04"
text = "سلام عليكم<br />اللقطة أكثر من رائعة بصراحة ، ويمكن كل اللى راح العزاء فى فقيد الأمة العربية الدكتور عبد الوهاب المسيرى ما اخدش باله من الموضوع ده ، وهو أن بعض الإعلاميين وتحديداً الصحفيين \" نسيوا \" أنهم جايين جنازة مش جايين فرح ، فهذه فتاة تلبس جيب قصير لم تبحث عما يوارى سوءاتها و لكنها اتت \" بخرقة \" تدارى تضعها على شعرها التى ربما لم تغطى سوى ربعه ، و اتصور هنا أن المحررة الهمامة كان عليها أن تراعى تقاليد \" المقام \" فهى ليست فى نزهة خلوية أو سهرة ليلية حتى تلبس ملابس فاضحة و تحاول أن تدخل المسجد وعندما يمنعها أحد تقول له بمنتهى التناكة \" ايه ده انتا مش عارف انا مين \" انا صحفية فى الجورنال العلانى أو الفلانى \"<br />ومش بس كده تسيب الجنازة كلها وتتخانق مع \" دبان \" وشها وكأن الموت لا هيبة لها فى قلبها \" لقد صلينا الجماعة على 5 أموات \" – النعوش الخمس خرجت أمامها ولم يرق قبلها \" كلا بل ران على قلوبهم ما كانوا يكسبون \"<br />يعنى مواقف سخيفة اتمنى ألا تتكرر وألا يرزقنا الله بعاهات الصحافة المصرية لاننا اتفقعنا خلاص بصراحة ... يعنى كده كتير<br />انما حد يقول لزميله سيبه ده المصدر بتاعى حتى بعد ما يموت لا كده كتير والله العظيم كتير"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705174431/http://masr.20at.com:80/newArticle.php?sid=16614"

