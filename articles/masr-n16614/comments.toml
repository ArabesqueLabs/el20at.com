[[comments]]
order = 9
subject = "انا جاي اغطي واعمل ضجه صحافية محصلتش"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-07-08"
text = "انا جاي اغطي واعمل ضجه اعلامية محصلتش<br />لماذا<br />ناخد تجربة حسن البنا الشهيد<br />لما مات حسن البنا وانتشر خبر وفاته والضجة الاعلامية التي حصلت خلت الناس تلتفت الى جماعة الاخوان المسلمين وتقرأ عنها وتدخل في الجماعة وانتقلت في بلاد اخرى وانتشرت في 70 دولة في العالم واول الذين تاثروا بالضجة الاعلامية لوفاة البنا الشهيد سيد قطب الذي التحق بالجماعة بعد وفاة حسن البنا<br />فالتغطية الصحافية والضجة الاعلامية لها اثر كبير على الناس الذين لم يسبق لهم التعرف على عبدالوهاب المسيري وسيتعرف على اعماله وفكره اناس اكثر من الؤين عرفوه وسينتشر فكره في دول عربية اخرى<br />رحم الله المسيري"
archived = "2008-07-09"
capture_url = "https://web.archive.org/web/20080709151417/http://masr.20at.com:80/newArticle.php?sid=16614"

[[comments]]
order = 10
subject = "وأقدِّم الكلمات الآتية لفقيد الإسلام والإنسانية, و"
author = "منقول"
posted = "2008-07-14"
text = "مسيرك أنْعم به من مسيرِ شموخًا تعدَّى الرُّؤى يا مسيري<br />وعلمك كنز وفيرُ العطاء وعزةُ نفس ولا كالنسورِ<br />وموسوعة مثل قلب المحب يعي عالمًا من نبيل الشعور<br />ورأيك يبقى الأصيلَ الأصيل وهَمُّ الفقاقيع عشقُ القشور<br />صريح إذا قلتَ لا تنحني وغيرك يسجد حتى النحور<br />وغايته في رضاءِ الطغاةِ ومُتعته في فُتاتِ القصور<br />لذا حَرَموك لقاءَ الطبيبِ فعشتَ تعاني بقلبٍ صبور<br />ما شيعوك إلى حيث تمضي زكيًّا طهورًا.. لِمثوًى أخير<br />وأبطال إعلامِهم أغفلوك لراقصةٍ \\\"ما لها من نظير\\\"<br />ولَهْوٍ وطبلٍ, وفن رخيص وصوتِ مُغنٍّ رقيعٍ غرير<br />لأنك ما عشتَ بِاسْمِ الأمير وزيفِ الأمير \\\"بِِسِرْكِ\\\" الأمير<br />وحقّرتَ مَن مجَّدوا عرشَه بكل نفاق.. خسيس حقير<br />ويكفيك شعبك إذ غسَّلوك بعطر الزهور.. ودمعٍ غزيرِ<br />وقد كفَّنوك بنسْج الصدور وليس كثيرًا نسيجُ الصدور<br />وقبرك أصبح كل القلوب وقد فُرشَتْ بالضياء الطهور<br />بروحك تنبضُ نبضَ الحياة وآمالنا في انتصارٍ كبير<br />وخضت الغمارَ بقلبٍ جسورٍ وعزمٍ كأني به من سعير<br />وإيمانك النبوي المكين وفكرٍ رصين عميق وقور<br />وعلم تخطَّى حدودَ الزمان ورحبَ المكان وموج الأثير<br />فرُعتَ صهاينة أجرموا بحق الشعوبِ وحق الضمير<br />عتوْا و طغوا, وأذلوا العباد وعاثوا كداء عضال خطير<br />وصاغوا حضارتَهم من دم وقتلٍ و نسفٍ ونهبٍ وزورِ<br />وتبقى الكنانة في ثكلها تنادي فتاها بقلب كسير<br />عليها طغاة بغاة عتاة وكلهُمو مثل وحش عقور<br />تعامَوا عن الحق في خسةٍ وما فيهمو من رشيد بصير<br />وتبقى الكنانة في ثكلها وفي حزنها المستبد المرير<br />مكحَّلة بسهادِ الأسى مُفزَّعة بالهوان السعير<br />وفي ليلها المستباح الجريح تنادي مجيرًا. وما من مجير<br />أتبكي؟ لقد حرموها البكاء بأمر الأمير, وأمر الوزير<br />فليس لها من عزاء سوى تناجي فتاها \\\"مسيري مسيري\\\"<br />وفي عالم الخلد يمضي الصدى ليكتب بالنور اسم \\\"المسيري\\\""
archived = "2008-07-15"
capture_url = "https://web.archive.org/web/20080715064825/http://masr.20at.com:80/newArticle.php?sid=16614"

[[comments]]
order = 11
subject = "سيرة المسيري :"
posted = "2008-07-14"
text = "سيرة المسيري :<br />ولد عبدالوهاب المسيري في دمنهور 8 أكتوبر 1938درس الإبتدائية والثانوية في دمنهور وتخرج في الثانوية عام 1655 “أدبي”<br />درس في جامعة الإسكندرية تخصص لغة انغليزية، وتخرج عام 1959 وعين معيدا في نفس العام<br />سافر إلى أمريكا للدراسات العليا، وحصل على الماجستير من جامعة كولومبيا عام 1964<br />التحق بجامعة رتجرز في مدينة نيو برونزيك وحصل على الدكتوراه عام 1969<br />عاد إلى مصر ليدرس في قسم اللغة الانغليزية في كلية البنات بجامعة عين شمس، وعين مستشارا لوزارة الإرشاد لفترة قصيرة.<br />عين في تلك الفترة خبيرا للشئون الصهيونيةبمركز الدراسات السياسية والاستراتيجية بالأهرام..<br />وفي عام 1972 صدر أول مؤلفاته: “نهاية التاريخ: مقدمة لدراسة بنية الفكر الصهيوني”<br />وفي عام 1975 أصدر “موسوعة المفاهيم والمصطلحات اليهودية” وعاد إلى أمريكا في نفس السنة ليرافق زوجته التي كانت تحضر للدكتوراه.. وعمل مستشارا ثقافيا للوفد الدائم لجامعة الدول العربية في نيويورك.<br />وعاد إ‘لى مصر عام 1979 مدرسا في كلية البنات..<br />ثم انتقل عام 1983 إلى جامعة الملك سعود بالرياض.. وظل مدرسا فيها حتى عام 1989 حيث انتقل إلى الكويت مدرسا في جامعتها..<br />وبعد سنة واحد عاد إلى القاهرةواستقال من الجامعة ليتفرغ تماما لكتابة أعظم أعماله.. الموسوعة اليهودية..<br />ولنقرأ ما يقوله عن أيام كتابة الموسوعة:<br />“بدأت كتابة الموسوعة وأنا في الثلاثينيات من عمري،وكنت أعمل فيها ليل نهار.. أبدأ أحيانا في السادسة صباحا ولا أنتهي إلا في الثانية عشرة مساء”<br />“لقد وضعت جهازي العصبي داخل ثلاجة لمدة ربع قرن، ….كنت عبر كتابة الموسوعة أعامل تفسي بيد من حديد. كنت حينما أجلس في الأوبيرا للاستماع للموسيقى أو مشاهدة أي عرض، لا أكف عن التفكير في الموسوعة، ولا أكف عن الكتابة في أي ورقة تقابلني، وحينما كان أحد أصدقائي يزورني، كنت أتصنع الابتسامة والمشاركة في الحديث،ـ وأنا هناك في عالم الموسوعة، أشعر بالذنب لضياع وقتي..<br />….وحينما كان حفيدي نديم يأتي من الولا يات المتحدة حيث كان أبواه يدرسان.. كنمت أخفي أوراقي تحت الأريكة، وأأتبسم في وجهه وأتظاهر بأني ألعب معه إلى أن تنادي عليه جدته، فأخرج الأوراق بسرعة وأستأنف الكتابة..<br />بل كنت حتى قبال أن أخلد إلى النوم أضع إشكالية ما في عقلي، ثم أنام على أمل أن يستمر عقلي في التفكير حتى إذا استيقظت في الصباح ألفيت بعض ملامح الحل قد تبلورت..”<br />وأدى هذا الجهد الهائل الذي استمر خمسة وعشرين عاما عن إصابة أعصابه بالإرهاق الشديد.. ما أدى إلى تمرد جهازه العصبي عليه!! وانهارت فقرتان صدريتان من جراء الجلوس الطويل على الموسوعة..<br />وبعد ذلك مرض بمرض “الميلوما” وهي مرض سرطاني يصيب النخاع العظمي..<br />صدر للدكتور المسيري عشرات الكتب والأعمال عدا الموسوعة التي تعتبر أهم أعماله على الإطلاق.. والتي صدرت في ثمان مجلدات ضخمة،<br />ومن كتبه الأخرى:<br />الحداثة وما بعد الحداثة<br />العلمانية الجزئية والعلمانية الشاملة<br />الفردوس الأرضي<br />الأيديولوجية الصهيونية<br />الانتفاضة الفلسطينية والأزمة الصهيونية<br />من هو اليهودي<br />إضافة إلى بعض الدوواين الشعرية وقصص الأطفال..<br />وحصل المسيري قبل أشهر قليلة على جائزة الشباب العالمية لخدمة العمل الإسلامي.. حيث حاز لقب “أستاذ الجيل”<br />واليوم.. رحل المسيري عن دنيانا هذه إلى الدار الآخرة.. نسأل الله له المغفرة والرحمة.."
archived = "2008-07-15"
capture_url = "https://web.archive.org/web/20080715064825/http://masr.20at.com:80/newArticle.php?sid=16614"
