[[comments]]
order = 0
subject = "هكذا تعيش فرقة \"الصامتين للأداء الحركي"
text = "والله يا اختي انا عضو في فرقة الصامتين التي تمثل اغلبية الشعب المصري الكبير<br />الشعب المصري بيلعب دور فرقة الصامتين<br />مش عارفين نقول ايه<br />الجزمة 300 جنيه النظاره 400 جنيه بنطلوق وقميص 250 جنيه وانا مرتبي 200 جنيه<br />يبقى ما فيش حل غير الصموت يا بنت الحاج عبدالفضيل"
archived = "2008-05-03"
capture_url = "https://web.archive.org/web/20080503170320/http://masr.20at.com:80/newArticle.php?sid=14009"

[[comments]]
order = 1
subject = "الاسيوطي بك"
author = "الاسيوطي"
text = "إته شيء جدير بأن نرفع القبعة للسيد رضا الذي تبادر الي ذهنه فكرة بهذه القيمة رغم تجاهل الكثيرين لهم واتمنى ان يوفقك الله في حياتك وتنل جزاء ما فعلت خيرا بهؤلاء المساكين."
archived = "2008-05-03"
capture_url = "https://web.archive.org/web/20080503170320/http://masr.20at.com:80/newArticle.php?sid=14009"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "ما شاء الله فرقه روعه وتجربه هايله ، بجد حاجه تشرف مصر وتشرفنا كلنا كمصريين ، وياريت لو كل الشباب زى الاستاذ رضا عبد العزيز ياخدوا المبادره ويصنعوا نهضه جديده لمصر فى كافه المجالات ، مع تمنياتى لفرقه الصامتين بدوام النجاح والتوفيق ومن نجاح الى نجاح ان شاء الله وقلوبنا معكم يا صامتون مصر"
archived = "2008-05-03"
capture_url = "https://web.archive.org/web/20080503170320/http://masr.20at.com:80/newArticle.php?sid=14009"

[[comments]]
order = 3
subject = "ما اجمل الاحساس بالاخرين"
author = "اسماء عرابى"
text = "ما اروع الاحساس عندما نشعر بمن يحتاج الينا ونحاول بكل حواسنا ولانبخل عليهم<br />حقيقى انا فخوره جدا بأبن بلدى القدير اخذ بايديهم بكل حب ورائفه وحنان للقمه....<br />وان شاء الله دائما فى نجحات مستمره وعظيمه..... وربنا يوفق المخرج والاستاذ رضا<br />الانسان والفنان"
archived = "2008-05-03"
capture_url = "https://web.archive.org/web/20080503170320/http://masr.20at.com:80/newArticle.php?sid=14009"
