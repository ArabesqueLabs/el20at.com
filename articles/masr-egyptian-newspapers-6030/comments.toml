subject = "عليه العوض"
author = "sherio"
posted = "2007-05-29"
text = "عليه العوض و منه العوض ...ليه لما حد من الناس يقول انا بحب اسرائيل او امريكا تبقي خيانه عظمي ...بينما القياده السياسه ...صرحت اكتر من مره بكرهها للمصريين و قرفها منهم ....و عشقها لبلاد الاكسلانسات و الموت حبا في احضان اليهود ....هيا البلد دي بتتحكم ازاي ؟؟؟؟ مين شعبها و منين حكومتها ؟؟؟ حد يعرفني يا ناس مين مع مين في البلد دي انا خلاص هاتجنن ....كل بلاد الدنيا العمل فيها بيتم لصالح مواطنيها و اهلها ...ما عدا البلد دي ...لو اعجبو بوزير و حبوه يطير في اول تعديل وزاري ....و يمكن التعديل الوزراي يتعمل مخصوص عشان الشخص دا يمشي ...و لو كرهوا وزير يفضل في الوزاره فوق العشرين سنه ؟؟؟ مين مع مين في البلد دي يا نااااااااااااااااااااااااااااااس"
