subject = "جواسيس و خوابير"
author = "طيف بدر"
posted = "2007-05-29"
text = "http://alayasser.maktoobblog.com/?post=294430<br />عندما يتبجح الجاسوس داخل المحكمة و يقول : \" أنا أحب إسرائيل\" فعلينا أن ننتبه و نراجع ما الذي دفع هذا الجاسوس إلى قوله هذا ؟<br />هو عزا ما قال إلى أن \" إسرائيل دولة متقدمة و مجتمع متقدم\" ناسيا وحشيتها و إرهابها و انحدارها الأخلاقي و سرقتها للمقدسات و شعارها \" من النيل إلى الفرات\" الموجود في النشيد الوطني الإسرائيلي و مرفوعا على علمها و على جدار الكنيست بل لم ينتبه إلى الواقع العنصري الذي يعيشه اليهود الشرقيون و يهود الفلاشا و ارتفاع مستوى الفقر بين اليهود داخل الدولة المزعومة و فساد السلطة وتأثير الحركات الدينية اليهودية ذات الفكر الشاذ و التخريبي و لن نتطرق إلى واقع العرب الفلسطينيين داخل الخط الأخضر.<br />ا<br />علينا أن نتساءل : هل التقدم الإسرائيلي العلمي هو نتيجة العمل الإسرائيلي و الكفاح الإسرائيلي و الثقافة الإسرائيلية ؟ تاريخ التجمعات اليهودية الأوروبية يخبرنا بانعزاليتهم و أذاهم و عدائهم للمجتمعات التي كانوا يعيشون فيها و جشعهم المالي على حساب الإنسان و الحق حتى كانوا منبوذين في مجتمعاتهم يسكنون \"الجيتو\" .<br />فكما يذكر كارين أرمسترونج في كتابه \"الحملات الصليبية وأثرها على العالم اليوم\" : \"كانت الحروب الصليبية قائمة أساسا على معاداة السامية، وبدأت بمهاجمة اليهود والسعي للقضاء عليهم، وكانوا يخيرون بين التنصر والموت. وقبل أن تتحرك الجيوش الصليبية إلى الشرق كانت مشغولة بتطهير أوروبا من اليهود قتلة المسيح، وجعل الصليبيون من اللاسامية مرضا غربيا لا شفاء منه استمر متلبثا في الغرب طوال العصور الوسطى. وعندما نهض هتلر مرة أخرى كان يقتل أيضا حتى الذين اعتنقوا المسيحية من اليهود قبل مئات السنين هربا من المذابح التي ارتكبها قادة الحروب الصليبية.\"<br />و يقول \"بنيامين فرانكلين\" أحد أوائل الرؤساء الأمريكيين في خطاب له أمام المجلس التأسيسي الأمريكي ، حينما نالت أمريكا \"الاستقلال\" سنة 1789م أي قبل مائتي عام وأربعة عشر عاماً من الآن ، وقبل أكثر من مائة عام على تأسيس الحركة الصهيونية حذر شعبه من الخطر الجسيم الذي يشكله اليهود على أمريكا وعلى أجيالها القادمة قال : ( أيها السادة لا تظنوا أن أمريكا قد نجت من الأخطار بمجرد أن نالت استقلالها فهي ما زالت مهددة بخطر جسيم لا يقل خطورة عن الاستعمار ، وهذا الخطر سوف يأتينا من جراء تكاثر عدد اليهود في بلادنا وسيصيبنا ما أصاب البلاد الأوروبية التي تساهلت مع اليهود وتركتهم يتوطنون في أراضيها ، إذ أن اليهود بمجرد تمركزهم في تلك البلاد عمدوا إلى القضاء على تقاليد ومعتقدات أهلها ، وقتلوا معنويات شبابها بفضل سموم الإباحية واللا أخلاقية التي نفثوها فيهم ، ثم أفقدوهم الجرأة على العمل ، وجعلوهم ينزعون إلى التقاعس والكسل بما استنبطوه من الحيل لمنافستهم على كسب لقمة عيشهم ، وبالتالي سيطروا على اقتصاديات البلاد ، وهيمنوا على مقدراتها المالية ، فأذلوا أهلها ، وأخضعوهم لمشيئاتهم ، ومن ثم أصبحوا سادة عليهم ، مع أنهم يرفضون الاختلاط بالشعوب التي يعايشونها حتى بعد أن كتموا أنفاسها ، فهم يدخلون كل بلد بصفة دخلاء مساكين ، وما يلبثون أن يمسكوا بزمام مقدراتها ، ومن ثم يتعالون على أهلها ، وينعمون بخيراتها دون أن يجرؤ أحد على صدهم عنها.<br />ولقد رأينا في الماضي كيف أذلوا أهل أسبانيا والبرتغال وما يفعلونه اليوم في بولونيا وسواها من البلاد ، ومع كل هذا جعلوا التذمر شعارهم حيثما وجدوا ، والتشكيك ديدنهم ، فهم يزعمون أنهم مضطهدون طالما كانوا مشردين ويطالبون بالعودة إلى فلسطين ، مع أنهم لو أمروا بالعودة إليها لما عاد جميعهم ولظل الكثيرون منهم حيث هم.<br />أتعلمون أيها السادة لماذا ؟ لأنهم أبالسة الجحيم وخفافيش الليل ، ومصاصو دماء الشعوب فلا يمكنهم أن يعيشوا مع بعضهم البعض لأنهم لن يجدوا فيما بينهم من يمتصون دمه ، ولهذا فهم يفضلون البقاء مع الشعوب الشريفة التي تجهل أساليبهم الشيطانية ليثابروا على امتصاص دماء أبنائها ، ولينهبوا من خيراتها ، للأسباب التي أوضحتها لمجلسكم الموقر.. أتوسل إليكم جميعاً أيها السادة أن تسارعوا لاتخاذ هذا القرار وتطردوا هذه الطغمة الفاجرة من البلاد قبل فوات الأوان ضناً بمصلحة الأمة وأجيالها القادمة ، وإلا سترون بعد قرن واحد أنهم أخطر مما تفكرون ، وستجدونهم وقد سيطروا على الدولة والأمة ودمروا ما جنيناه بدمائنا ، وسلبوا حريتنا ، وقضوا على مجتمعنا ، وثقوا بأنهم لن يرحموا أجيالنا بل سيجعلونهم عبيداً في خدمتهم ، بينما هم يقبعون خلف مكاتبهم يتندرون بسرور بغبائنا ، ويسخرون من جهلنا وغرورنا.<br />أيها السادة ، أرجو أن لا يجنح مجلسكم الموقر إلى تأجيل هذا القرار وإلا حكم على أجيالنا القادمة بالذل والفناء.<br />أيها السادة ، لا تظنوا أن اليهود سيقبلون يوماً الانصهار ببوتقتكم أو الاندماج في مجتمعكم فهم من طينة غير طينتنا ، ويختلفون عنا في كل شيء.<br />وأخيراً أهيب بكم أن تقولوا كلمتكم الأخيرة ، وتقرروا طرد اليهود من البلاد ، وأن أبيتم فثقوا أن الأجيال المقبلة ستلاحقكم بلعناتها وهي تئن تحت أقدام اليهود.<br />وأنا أشهد لله أن الأجيال التي عرفناها الآن لئن تحت أقدام اليهود ، فهذه وصية من خبير باليهود وبأساليبهم الخبيثة التي لم تعرف وما عهدناها في أي شعب من الشعوب ، إنها خصوصيات يمتاز بها جنس اليهود \".<br />فإسرائيل تعيش على أموال التبرعات اليهودية للتجمع الصهيوني في فلسطين و الدعم الغربي للحكومات الصهيونية و كما يقول المفكر الفرنسي \"روجيه جارودي\" : \"لو انقطعت التبرعات عن إسرائيل فإنها لن تدوم و ستنهار من تلقاء نفسها في ستة أشهر أو أقل\"<br />فدولة إسرائيل نفسها قامت بجهود إنجليزية استخرابية (وعد بلفور و اتفاقية سايكس بيكو) و حرب 1956 كانت بدعم من الجيشين الفرنسي و الإنجليزي و لا ننسى الجسر الأمريكي الجوي في حرب 1973<br />و مفاعل ديمونة الموجود في صحراء النقب فقد بناه الفرنسيون من الألف إلى الياء و قدموه هدية إلى دولة إسرائيل عام 1960<br />لقد قامت إنجلترا و فرنسا باحتلال العالم العربي قرابة المائتين عام لم نرى منهما إلا مذبحة دنشواي و مذبحة المليون و مذبحبة كوبري عباس و تخريب التعليم في مصر على يد دانلوب \"لتقديم رعايا مخلصين لجلالة الملكة\" و إثارة النعرات الطائفية و التجارب النووية و الهيدروجينية في صحراء الجزائر و لم نجد الفرنسيين و الإنجليز يقدمون لنا الهدايا و الدعم كما فعلوا مع إسرائيل فقد قدموا للصهاينة كل شيء بداية من الأرض إلى البنية التحتية و الاجتماعية (سلموهم وطن متشطب على السيراميك بعد ما خربوا ديارنا) و حسبنا الله و نعم الوكيل .<br />هل تعرفون من السبب في ظهور هذا الجاسوس ؟ إنهم خوابير التطبيع الموجودة في صحافتنا و في مراكز صناعة الرأي و القرار ... مجموعة من الخونة و المرتزقة تبث السموم عبر أقلامها يدعون إلى خيانة الوطن و جلد النفس بالباطل و تعظيم العدو ... تلك المجموعة الخائنة و على رأسها وحيد عبد المجيد و عبد المنعم سعيد و علي سالم و عبده مباشر . هؤلاء الذين في كل موضع لا يتحرجون من تأييد الصهاينة و الأمريكان و التصريح باستحقاقية الفلسطينيين و البنانيين و العراقيين للموت لأنهم \"كائنات غير منتجة\". فماذا ننتظر من هؤلاء الأنجاس الذين نجدهم يعوون مع كل ضربة يسددها المجاهدون و المقاومون للعدو في العراق أو فلسطين أو لبنان عندما تتمكن أجهزة الأمن المصرية من إلقاء القبض على جاسوس مثلهم؟ لا نجد عندهم تعليقا او مقالة بشأن الفيلالي أو عزام او العطار أو سيد صابر !!! و لا حتى كلمة \"عيب\" تخرج منهم؟ و كيف تخرج الكلمة من أهلها؟<br />هذه العصابة التي يتزعمها عبده مباشر و حمدي رزق و عبد المنعم سعيد و وحيد عبد المجيد هي التي تستحق المحاكمات العسكرية و ليس غيرهم فمن أفضح ممن يجاهر بعدائه للبلاد التي يأكل منهاو ولائه للعدو و ها قد ظهرت ثمرتهم الفاسدة في سيد صابر (حشرهم الله جميعا مع من أحبوا)"
