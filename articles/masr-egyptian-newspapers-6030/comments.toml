subject = "المرء مع من أحب يوم القيامة،"
author = "مش لازم"
posted = "2007-05-26"
text = "نعم ـ أيها الإخوة المسلمون ـ المرء مع من أحب يوم القيامة، فمن أحب الله وأحب رسوله محبة إيمان وعبادة وطاعة وأحب أولياء الله من الأنبياء والمرسلين والصديقين والشهداء والصالحين كان معهم يوم القيامة. ومن أحب الشيطان وأحب أعداء الله من الكافرين والظالمين والمجرمين كان معهم يوم القيامة.<br />اللهم إنا نسألك حبك, وحب نبيك, وحب من يحبك, وحب الفقراء والمساكين.<br />رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ [آل عمران:53]."
archived = "2010-03-14"
