[[comments]]
order = 1
subject = "الف حمداللة على سلامت رجوعك لبلدك واهلك وناسك اللى بتحبك وتفرح لما تشوفك تمنياتى لك بطول العمر والسعادة"
author = "عمر"
text = "البابا شنودة الكل بيحبك مسلمين ومسيحيين والمسلمين فى العالم اجمع بيؤيدوا قراركم الحكيم بمنع ذهاب المسيحيين لبيت لحم وهى تحت الاحتلال الصهيونى البغيض فى مصر الغالية على قلبك وقلوبنا المسلم والمسيحى نسيج متماسك مع بعضة وبيحب بعضة بعض لكن يوجد قلة قليلة من الطرفين لم تستوعب لغاية دلوقتى ان الدين للة والوطن للجميع نسال اللة ان يهدى الجميع ويوفق الجميع لما يحبة ويرضاة"
archived = "2008-10-23"
capture_url = "https://web.archive.org/web/20081023010849/http://masr.20at.com:80/newArticle.php?sid=17975"

[[comments]]
order = 2
subject = "فى حظيرة الخنازير متسع للجميع"
author = "56"
text = "محافظة القاهرة بتفكر تنقل حظيرة الخنازير فى مكان بعيد خارج القاهرة<br />ولكن المشكلة اصحاب الخنازير<br />بيسرقوا الزبالة<br />ولكن فية ماوى متسع لجميع الخنازير والاكل ببلاش من الزبالة وعمل ثروات بالملايين<br />امتى البلد تنضف زى العراق"
archived = "2008-10-23"
capture_url = "https://web.archive.org/web/20081023010849/http://masr.20at.com:80/newArticle.php?sid=17975"
