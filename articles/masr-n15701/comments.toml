order = 0
subject = "حكى لنا البراء أشرف، مخرج الفيلم زميلنا السابق في"
author = "مش لازم"
posted = "2008-05-11"
text = "المفروض ذوقيا الكاتب الصحفي لما يخلع يودع قرائه بمقال تماما مثلما فعل الاستاذ احمد القطب قبل ما يمشي كتب مقال وداع لقرائه لان دايما القارئء بيتعلق بالكتاب الذين اعتاد عليهم<br />العملية مش اكل عيش وخلاص لا الصحافة دي مهنة انسانية<br />ويظهر برضه والله اعلم دعاء الشامي خلعت هي كمان<br />من غير ما تودع القراء"
archived = "2008-05-14"
