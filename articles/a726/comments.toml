text = "انا ما تعودتش اني امدح كاتب المقال, بس المره دي ما عنديش غير اني اقول الموضوع اكسيلانت وباين عليه موضوع مبذول في جهد كبير."
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109042709/http://www.20at.com:80/article.php?sid=726"

