[[comments]]
order = 4
subject = "منى أبوالحسن"
text = "للأسف هوه نفس الإصطلاح.. مع اني لحد دلوقتي مش فاهمه ايه علاقة هذا (التهريج) الي بيعمله داود حسين بالقرقيعان..<br />بالمناسبه يا أستاذ وائل، ممكن تعرفنا حيثيات الفتوه دي لأني أول مره أسمع عنها.."
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109042709/http://www.20at.com:80/article.php?sid=726"

[[comments]]
order = 5
subject = "إلى الأمام يا...منى"
text = "بارك الله فيكي.الموضوع واضح إنه مبذول فيه جهد..مش مسلوق يعني مع إن المسلوق صحي، والموضوع مكتوب بشكل جميل والقلب يعشق كل جميل، وفيه رؤية نقدية واضحة في المقارنة بين الجديد والقديم ومين فات قديمه تاه، ومقارنة بين الأصل والصورة...ضورة صورة صورة تحت الراية المنصورة..(مع إنه ما بقاش فيه رايات منصورة..إنما المنصورة موجودة الحمد لله)، ويبدو أن عاداتنا الرمضانية في الوطن العربي كله تتحول إلى صور باهتة مع الأيام وتغير الظروف والأحوال..ودائما إلى الأمام يا سمسم ..يا فول..يا شعير..يا روميل..ياإيه يا إيه ياااا..منىىىى...آه افتكرت..اسمك منى..برافو عليكي والله ان اسمك منى"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109042709/http://www.20at.com:80/article.php?sid=726"

