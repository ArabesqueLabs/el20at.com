[[comments]]
order = 0
subject = "لم يقتلهم الضباب ولكن قتلهم الفساد"
author = "مصرى قرفان"
posted = "2008-02-07"
text = "نحن دولة تدار بالفساد - والفساد فى كل مكان<br />يستطيع اى شخص حتى وهو خارج البلاد ان يحصل على رخصة قيادة سيارة بدون اى اختبار وتصل الية فى بيتة اذا دفع المعلوم وقامت الواسطة باستخراج الرخصة التى هى دعوة للقتل اذا قاد سيارة بدون فرامل او ليس فيها لمبات اشارة او تعلم كيف يسير فى الضباب<br />فى دول اوروبا الضباب كل يوم وكل ساعة ولكن لا تحدث فواجع مثل التى تحدث عندنا<br />تجديد رخصة السيارة يتم بدفع المعلوم وهو مبلغ يوضع فى جيب رجال المرور رغم عدم صلاحية السيارة للسير<br />حاربوا الفساد اولا"
archived = "2010-03-14"
