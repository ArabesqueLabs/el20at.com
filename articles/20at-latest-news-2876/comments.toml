order = 0
subject = "ضع عنوان التعليق"
author = "hnooh"
text = "أتعرف من هم السادة أكيد أنت لا تعرف هل أقول سامحك الله أو أدعو لك بأن ترى الحق حقا والباطل باطلا<br />السيد حسن أروع من أن تصفه 0000 عيب عليك سامحك الله<br />وهداك حقيقة لا يمكن أن ترى الحق لأنك لا يمكن أن تصدق عينك شيعي يساعد السنة !!!<br />لو كنت في المعمعة لرأيت بعينك من يساعدك ويأخذ بيدك لكن لايمكن أن ترى الحق"
