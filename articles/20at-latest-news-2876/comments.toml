[[comments]]
order = 1
subject = "الي صعاليك المملكه الوهابيه"
author = "محمد سالم-مسلم سني - مصري"
text = "انتم طائفيون حتي النخاع .... فلا تسقطوا عقدكم النفسيه علينا......فلتشغل نفسك ببلدك المنهوبه وحكامها العملاء ودع لبنان لاهلها ... فهم ليسوا بحاجه الي سمومك الحاقده .......يا من ترضون بحكم الطغاه وتاصلون له فقهيا من اجل ارضاء طويل العمر...مايجري في لبنان مظهر من مظاهر الديمقراطيه التي يراها شيوخك الجهابذه كفرا وابتداعا<br />ارجو ان تشغل نفسك بصفقه اليمامه السعوديه البريطانيه للاسلحه لتعرف ياعبد ال سعود انه يحكم بلادكم مجموعه من اللصوص العملاء.....ولو كان عندكم ذرة كرامه لناصرت المعارضه اللبنانيه التي تريد ان تعلمك انت وامثالك طريقه سلميه لتغيير الواقع المر والفاسدالذي نحياها في امتنا.....فهل خرج مواطن سعودي واحد يسال حكامكم عن صفقة اليمامه وفساد وفضائح حكامكم التي تزكم الانوف وتمتليء بها الجرائد الغربيه....لالا.. لم يخرج ولن يخرج احد عنكم ولن ينبت احد ببنت شفه....لانكم تعودتم ان تساقوا كالانعام<br />وغدا يحكمكم بعد ال سعود عتيبي او شمري وتصبحون المملكه العربيه الشمريه او العتيبيه<br />يا احمق ياصعلوك لا تتكلم عن العظماء وانت فسل حقير"
archived = "2010-03-14"
capture_url = ""

