[[comments]]
order = 13
subject = "دماغ مصرية"
author = "alexomania"
text = "الواحد فخور جدا بالعقول المصرية الجبارة اللي بنسمع عنها بين كل فترة و التانية<br />يعني المصريين وصلوا لمناصب عالية بقدراتهم و عقولهم.....زويل .البرادعي.بطرس غالي.مجدي يعقوب.الباز....<br />المحزن بقي إن المعروف إن التعليم عندنا فاشل و مش بينمي قدرات الفرد فما بالكم لو كان عندنا تعليم حقيقي؟ ينمي إمكانات الفرد كان أظن بقينا أفضل حالا من اليابان<br />طول ما فيه نظام متخلف إسمه التنسيق و الثانوية العامة و نظام تخريج كتبة مش أكتر يبقي قولوا علي مستقبلنا السلام"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193418/http://www.harb.20at.com:80/newArticle.php?sid=10880"

