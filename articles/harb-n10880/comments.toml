[[comments]]
order = 5
subject = "الإبتكار صناعة مصرية ( تحمع المبتكرين الشباب )"
author = "عالم الإبتكار العربي"
posted = "2007-11-30"
text = "الإبتكار صناعة مصرية<br />في الواقع الفرماوي وكثير من علماء ومبتكري مصر يحق لهم الوصول لما وصلوا إليه لحبهم للإبتكار<br />فمثلا على موقع شباب الإبتكار الكثير منهم مصريون<br />ولعل الموقع الجديد بعد نقله وإختفائه من الشبكة ثم ظهوره يوحي بأن حتى المشتركين الجدد فيه هم مصريون !!!<br />http://shbab.in-goo.net/index.htm<br />بالطبع لا عجب فالمصريون يحبون الإبتكار كما يحب الناس شرب القهوة و الشاي"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193418/http://www.harb.20at.com:80/newArticle.php?sid=10880"

[[comments]]
order = 6
subject = "جتهم  خيبة!"
author = "Amr_not_Amr"
posted = "2007-12-02"
text = "هما كده ما حدش منهم عشان يفيد البلد بحاجة ... مافيش فرق بينه وبين أحمد عز ... الاتنين احتكاريين وده مش بشهادتي ده بحكم محكمة من الاتحاد الأوربي حكم نهائي بعد 3 سنين مداولات ..<br />لو الفلوس اللي الحكومة بتدفعها في رخص ميكروزف دي دفعت لشباب مبرمجين وخريجي حاسبات ومعلومات عشان يشتغلوا في مشاريع حرة مفتوحة المصدر بحيث إنه يخللوها مناسبة أكتر لينا ولاحتياجاتنا ويضيفوا هما ويبدعوا هيكون عندنا استقلال في البرمجيات .. مش مجرد تبعية خرفة حمقاء لشركات احتكاريات بسياسات قذرة ...<br />إنما طبعا زي ما احتكار كل حاجة في الدنيا في مصر مهم للحكومات ا&--65271;جنية عشان يتحكموا في حكوماتنا ومهم لحكوماتنا عشان يسوقوا شعوبنا كالخرفان فاحتكار البرمجيات برضه مهم ..."
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193418/http://www.harb.20at.com:80/newArticle.php?sid=10880"

[[comments]]
order = 7
subject = "مشروع بطل"
author = "Mohamed Ibrahim"
posted = "2008-01-05"
text = "لكل مجتهد نصيب ، انا كنت متابع اخبار علي فرماوى من اول ما مسك مايكروسوفت مصر ولحد ما وصل للمنصب اللي هوة فية دلوقتى وانا بتمنالة كل الخير ولكل واحد من البلد الخير ويارب كلنا نبقي كويسين وبخير .<br />وعلي فكرة كل واحد فينا جواة مشروع بطل لو قدر يستغل قدراتة في اي مجال هوة بيحبة ها يغير حياتة وحياة الاناس اللي حولية كمان وساعتها الناس ها تجتهد علشان تبقي ناجحة زية وها تفضل حاطين صورتة قدامهم لحد ما يحققوا كل اللي نفسهم فية وياريت كل واحد فينا يبتدى وينسي الظروف الزفت اللي حوالينا لحد ما ربنا يكرمنا ونكون احسن ناس في الدنيا دي وشكرا"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193418/http://www.harb.20at.com:80/newArticle.php?sid=10880"

[[comments]]
order = 8
subject = "مايكروسوفت مصاصة الدماء"
author = "عابرسبيل"
posted = "2008-01-24"
text = "شركة مايكروسوفت شركة طفيلية بنت مجدها على شراء برامج لم تصنعها هي ، مثل \"الدوس\" الذي اشترته ورخصته لآي بي م ، وفي السياق العربي سمحت مايكروسوفت بقرصنة برامجها المعربة فكان ذلك ضربة قاصمة للشركات البرمجية العربية الناشئة . وأنا أقول فعلاً لو أن حكوماتنا العربية دعمت برمجيات \"المصدر المفتوح\" المجانية لكان ذلك خيراً لها من دفع الملايين لشراء برامج مايكروسوفت الغالية ... لكن ماذا نفعل؟ القط يحب خناقه!"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193418/http://www.harb.20at.com:80/newArticle.php?sid=10880"

[[comments]]
order = 9
subject = "راجل عبقرينو بصحيح"
author = "بديعة عبد البديع البعدعي"
posted = "2008-02-19"
text = "الحبايب اللى بيكلموا عن المصلحة الخاصة والاحتكار والحاجات الجامدة دى كلها يعنى مالقوش غير الراجل ده اللى يتهموه بكده ، بالنسبة للمصلحة الخاصة متهيألي ان محدش يكره ان يكون كل واحد عارف مصلحته ولو كل واحد كده بصحيح كانت الامور اختلفت -للاحسن طبعا- عن ما هى عليها دلوقتى ، والاحتكار بقى ارجوكم خلينا ساكتين ومفيش داعي نحرق بنزين ع الفاضي ، يكفى هذا الرجل -اللى انا اول مرة ارعفه بعد الموضوع ده- شرفا المنصب اللى مسكه واكيد بيعود على البلد بنفع وان كان غير مباشر او حتى ان كنت انا واللا انت مش بنجنى ثماره دلوقتي."
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193418/http://www.harb.20at.com:80/newArticle.php?sid=10880"

[[comments]]
order = 10
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-02-29"
text = "الحقيقة الفروماوي شرف مصر وفلسطين وجميع العرب وبالنسبة لمايكروسوفت فهي اكيد وبشهادة الجميع احتكارية وما في علاقة بين سعادتنا الكبيرة بتقلد الفرماوي لهذا المنصب وبين كراهيتنا لسياسة مايكروسوفت وبعدين هي مايكروسوفت ما بتشغل الناس مجاملة ولكن بحسب الكفاءة والامكانية ومن هنا فرضت مايكورسوفت قوتها واحترامها على الدول والمنافسين والسوق<br />اخيرا<br />الفرماوي مميز وربنا اكرمه ونجح ؟؟؟ والسؤال كم واحد مميز في مصر والدول العربية ضاعت الفرص امامهم بسبب النظام التعليميم الفاشل... ولم يحصل على فرصة"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193418/http://www.harb.20at.com:80/newArticle.php?sid=10880"

