[[comments]]
order = 0
subject = "إيه الهبل ده"
author = "مش مهم"
posted = "2007-07-04"
text = "يطلع مين عزوز ده وأيه اللى بيقوله ده<br />فيه ناس فعلا مش بتحب هيكل وهما حرين دى حريتهم الشخصية يقتنعوا بيه أو يرفضوه أو يختلفوا معه أيا ما يكون لكن الأخ ده لاعاجبه هيكل ولا مكرم محمد احمد ولا جلال عارف ... وبعدين هو مع التطبيع ولا ضده ... هو مع المعترضين على النظام وبيتظاهروا على سلالم النقابة ولا ضدهم ........ حاجة تلخبط شمك لبن تمر هندى<br />بس برضه مين عزوز ده .... بيبيع أيه بالظبط"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707015126/http://masr.20at.com:80/newArticle.php?sid=10918"

[[comments]]
order = 1
subject = "يسلم قلمك"
author = "زكى الدبور"
posted = "2007-07-06"
text = "رغم اختلافى مع الاستاذ سليم عزوز فيما جاء بمقالتة عن هيكل ،الا اننى اتفق مع ماذكرة عن مكرم محمد احمد تماما ومن الواضح ان مكرم ضحية شوية السفرجية حولة الذين زرعوا فية وهم ان هناك اتفاق عام علية كصحفى وعلى راس هؤلاء السفرجية طبعا ( حمدى رزق الشهي بحمدى تليفزيون الى لسة عندة امل مكرم يتدخل ويجيبوة رئيس تحرير المصور، وغالى محمد الشهير بغالى بترول اسواء صحفى استغل الرقابة الادارية فى ابتزاز مصادرة و التجارة فى التعين بوزارة البترول<br />، وصفاء عقارات الشهيرة بصفاء لويس،و.........................الخ<br />مكرم انتخابةاهانة لنقابة الصحفيين فى عصر جديد وردة الى عصر (الصحفى شرف المهنة) ، واذا كان مكرم قد فشل طوال 25 عاما فى صناعة اصدار واحد من اصدارات دار الهلال يوزع اكثر من 3000نسخة ؟؟؟<br />فكيف سينقذ النقابة؟؟؟؟<br />كما ان مكرم هو السبب فيما وصلت اة النقابة الان لاننا نحصد ما زرعة طوال 3 مدد كان فيها النقيب و قدم فيها للنظام خدمات العبد للسيد ، وجعل دار الهلال افقر دار صحفية واغنى محرريين، ودنسها بوفد يهودى من رؤساء تحرير الصحف الاسرائيلية، ونجس النقابة بوفد من الحخامات اليهود ، والكرثة التى نعلمها جميعا عن تاريخ مكرم الاسود هو انة الذى سطر بخط يدية قوائم اعتقالات سبتمبر عام 1981 والنبوى اسماعيل شاهد حى على ذلك، كما ان"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707015126/http://masr.20at.com:80/newArticle.php?sid=10918"

[[comments]]
