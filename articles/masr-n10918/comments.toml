subject = "مصرى"
author = "عزوز وزعزوع"
posted = "2007-07-07"
text = "عزوز بتاع عصير القصب بيتكلم عن قمم اعلام الصحافة فى مصر والعالم<br />الاقزام المجهولين يتقولون على العمالقة<br />هيكل هو الصحفى الوحيد فى مصر الذى يمكن ان اقرا مقالتة كاملة لانة يحترم عقلية القارىء<br />المقالات الاخرى هى مدح فى الكلاب القاعدة على الكراسى"
archived = "2007-08-18"
capture_url = "https://web.archive.org/web/20070818212333/http://masr.20at.com:80/newArticle.php?sid=10918"
