subject = "وعضو مجلس إدارة في قناة \\\\"
author = "مش رايح ولا جي"
posted = "2009-02-02"
text = "علشان خاطر ابوه صاحب القناه جاب ابنه عضو مجس الادارة وعنده 22 سنه<br />طيب زعلانين ليه من حسني مبارك بقا لما جاب ابنه معاه في الحكم<br />طالما احنا زي حسني مبارك بالضبط واوسخ منه كمان واي واحد حيوصل للحكم من اللي عاملين شرفاء دول حيعمل اوسخ من حسني مبارك 100 مرة<br />كل اللي عاملين شرفاء في مصر دول وعايزين يحكموا مصر عايزين يحكموها علشان يسرقوها زعلانين ان الحكومة بتسرق لوحدها<br />عايزين يسرقوا هما كمان"
archived = "2010-03-14"
