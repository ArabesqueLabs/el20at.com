[[comments]]
order = 0
subject = "المفتش كرومبو وصاحب الصورة اللي فوق"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-02-01"
text = "المفتش كورومبو عمل فني كبير يدل دلالة قاطعة على ان صاحب هذا العمل ليس واحد<br />1) هناك شخص صاحب الفكرة<br />2) هناك شخص بيكتب الالغاز<br />3) هناك شخص فنان اللي عمل الفيلم<br />4) وهناك مقلدين اصوات او ممكن يكون شخص واحد بيقلد كل هذه الاصوات<br />على الاقل<br />وناس مش اي كلام ناس مخضرمين<br />مستحيل يكون المصخوت اللي في الصورة دا هو صاحب العمل العظيم دا<br />واختاريلك حاجه من تلاته<br />1) اما ان تكوني بتكدبي علينا<br />2) او الواد اللي في الصورة دا بيكدب علينا<br />3) اما عشرينات هي اللي بتكدب علينا<br />وانا عرفت مين اللي بيكدب علينا<br />اذا كنتوا انتو عرفتوا مين اللي بيكدب علينا ابقو قبلوني في الموضوع الجاي<br />مستحيل يكون هذا العمل الفني الكبير اللي ابتكره طفل زي الموجود في الصورة دي عنده 21 سنه"
archived = "2010-03-14"
