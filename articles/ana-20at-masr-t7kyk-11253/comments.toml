[[comments]]
order = 2
subject = "فكرة جميلة من شاب مبدع"
author = "اكتب اسمك هنا"
posted = "2009-02-25"
text = "انا مش عارف ايه الهجوم الكبير على الراجل ده الراجل عمل مجهود يشكر عليه انا حبيت كرومبو في بساطه<br />و الأخ الي عامل اشخاص كتير على فكرة اكبر حلقة في كرومبو 4 دقايق و بعدين اي لغز من الألغاز مش معقد عشان واحد يعد يكتبه انتا عبيط ولا شكلك كدا و بعدين مخضرمين ايه بس ياعم انا اعتقد انك لسا بتتعلم على الكومبيوتر اصلا و مش بتعرف تكتب على الوورد اساسا الصوتيات دي تنضرب بأبسط برامج و اجهزة صوت و قال هناك شخص فنان عمل الفلم فلم ايه ياحبيبي ولا انتا عمرك ما شوفت كرومبو اساسا<br />ولا التاني الي حاقد على الأخ بص يعني انا لو عندي قناة و لقيت ابني عندي حاجه حلوة و جميلة و فكرة جامده زي كرومبو دي انا اكيد هنزل الفكره دي<br />و اي واحد لازم يساعد ابنه بكل ما عنده<br />لكن ما تخلطش بين الي عاوز يساعد ابنه و هو يستحق و الي عاوز يساعد ابنه و هو ما عندوش اي حاجه يستحق بيها المساعده و انتا فاهمني كويس"
archived = "2010-03-14"
capture_url = ""

