subject = "للاسف"
author = "nora"
posted = "2007-10-03"
text = "للاسف في مصر لاحظت شي الى عنده يدوس على الى ماعندهوش نسو انهم من بلد واحد قبل اى شي وانهم عرب ومسلمين تخلو عن اخلاقيات كثيره وصلت لدرجه كل واحد يظلم الثانى<br />كمان لاحظت شي ثانى الناس مش تعمل شغلها باخلاص مش عارفه ليه انا مش قصدى اسيء لبلد كلنا بنحبو ونحترمو<br />وتاريخه عريق من الاف السنين بس ده واقع مانقدر ننكره<br />اتمنى الحق يبان في المسئله دي وفوق كل ظالم من هو اقوى واعدل منه ."
