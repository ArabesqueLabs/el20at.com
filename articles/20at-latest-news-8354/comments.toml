text = "هو إنت ياللى بتتكلم فى موضوع القناة مش كان إسمك مازن ؟؟<br />هو إنت هتقعد كل شوية تغير أم إسمك ؟؟<br />يا عم محدش عاوز يشوف القناة اللى إنت عمال تتكلم عنها دى<br />فياريت تتكلم و ترد فى الموضوع المنشور أو تسكن و بلاش وجع دماغ"
