order = 31
subject = "نحن في حاجة إلي تيار بديل"
author = "البارودي"
text = "في قراءة واطلاع لكل التعليقات انظر إلي شباب الأخوان ( وقد كنت واحد منهم ) و انا الأن من ابناء التيار البديل ، فمن الواضح ان هناك نظره غير واضحه وتسليم غير معرف للجماعة وقيادات الجماعة وهناك تحامل كبير على الأخ عبد الله الذي تفضل وطرح الموضوع ، فاريد ان انبه الشباب الساخر ، بانه لماذا لاتكون لدينا نظره اخري للمواضع الأمور وهل كلام الدكتور على الذي كان في تجربه أخذت من عمره وهو وقت محسوب من العمر كان من الضروي ان يتجه فيه للطريق الصحيح ، فالسؤال هنا ما الذي خسره التيار البديل عندما خرج من الإخوان فلو كان الدكتور على مستمر داخل صفوف الأخوان وبالتحديد داخل شريحة القيادات هل كان سيخسر شي ولكن هناك شئ يجب ان نجتمع عليه سويا ً هو أن مصلحة البلاد والعباد ليست في هذا الطريق فيجب علينا أن نبحث عن البديل ، فقد توجه اعضاء التيار البديل مشكورين واولهم الدكتور علي إلي ( قيادات الجماعة ) مكتب الإرشاد بطرح موضوعهم بالاساس والذي ذكر في المقال فلم يجدوا حتي رفض من الجماعة فهل هذا استهزاء ام انه عدم اهتمام بأمور الأمة وكما ذكرنا أن الجماعة لا تريد إلا مجموعة من الأفراد المنتجين لافراد جدد لا تكون حصيلتهم في النهاية إلي مجموعة من الأشتراكات تكون مبلغ محترم ولا اعرف بعد ذلك فيما يستخدم المال والرجال؟ ونعود بعد ذلك للسؤال .. أين مصلحة البلاد والعباد ؟؟ ونضع امامه اكثر من علامة استفهام واكثر من علامة تعجب !! ايها الشباب دعونا نُحكم عقولنا ولو للحظة ونضع نصب اعيينا ما يفيدنا فهل من الداعي ان تظل الأمور كما هي ام هل من الضروري ان تتغير الأحوال ويكون هناك تيار بديل ،<br />وفي نهاية كلامى اوجه كل الأحترام والتقدير إلي الأستاذ عبد الله على انصافه في عرض الموضوع .<br />واوجه كل التحية والأحترام إلي شباب الأخوان الذين امتعونا بتعليقاتهم الذكية التى لم تخلوا من عدم المعرفة اذا كانت على الأنترنت أو على ارض الواقع<br />وفي النهاية فلندعوا جمعيا ً ( اللهم إن كنا على الحق فثبتنا وإن كنا على غيره فردنا إليه ) آمين"
archived = "2007-06-23"
