[[comments]]
order = 28
subject = "ملحوظة على السريع"
author = "بنى آدم"
text = "اقتباس \" شي مضحك يا دكتور الجماعة مبقتش بتاعة حاجة الجماعة بقت تسمع كلام المسئول واوعي تكلم عن القيادة ناس بتعتقل وبيتعمل ليها حملات للمطالبة بالافراج \"<br />يا عم حسام يا الهندى : بصراحة مش فاهم من كلامك انت عاوز إيه بالظبط، هو لازم كل اللى يقرا الموضوع يعلق علشان اسمه يبقى موجود ولا ايه ؟<br />تعليقك قصدى لم يضف أى معلومة .<br />يا سيدى التعليق على الموضوع ليس أحد شروط قراءته ، يعنى ممكن تقرا الموضوع وخلاص لو معندكش تعليق .<br />سيبوا الإخوان فى حالهم بقى يا شباب ، خلى الناس تركز فى انتخابات الشورى والمعتقلين وأوعدكم أول ما يخلص الملفين دول الإخوان نفسهم يبعتولكم ملفات تكتبوا عنها اللى انتم عاوزينه .ونرد عليكم برضه علشان الموضوع ياخد شو كويس وتنبسطوا ، مفيش أى مشاكل ."
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 29
subject = "قصة فرعون موسى في تراث الاخوان"
text = "زوجة د. محمد حافظ تكتب: رسالة إلى الظالمين<br />إخوان أون لاين - 16/05/2007<br />يكيد الظالمون ضد الحق والعدل وهم يعتقدون أنهم قد أحكموا خطتهم وأتقنوا سيطرتهم وما دروا أن وراء الأمور مُدبرًا &--64831;وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ وَاللَّهُ خَيْرُ الْمَاكِرِينَ&--64830; (الأنفال: من الآية 30).<br />وبالأمس طغى فرعون في البلاد واعتقد أنه إله الكون، ومدبر الأقدار يسيرها كيف يشاء، وأن له أن يأمر فيُطاع، وينهى فيُستجاب له قال تعالى: &--64831;فَقَالَ أَنَا رَبُّكُمْ الأَعْلَى (24)&--64830; (النازعات)، وادعى فرعون أنه يقود قومه وجنوده نحو الفلاح والازدهار ونحو الإصلاح والرخاء نحو الحرية والتقدم نحو الكرامة والعزة، قال تعالى: &--64831;مَا أُرِيكُمْ إِلاَّ مَا أَرَى وَمَا أَهْدِيكُمْ إِلاَّ سَبِيلَ الرَّشَادِ&--64830; (غافر: من الآية 29).<br />ولأنه لم يجد مَن يردعه ويتصدى له فقد استكبر وتمرد متناسيًا يوم الحساب، يوم الوقوف بين يدي الله عز وجل، والسؤال عن الرعية والمحكوم قال تعالى: &--64831;وَاسْتَكْبَرَ هُوَ وَجُنُودُهُ فِي الأَرْضِ بِغَيْرِ الْحَقِّ وَظَنُّوا أَنَّهُمْ إِلَيْنَا لا يُرْجَعُونَ (39)&--64830; (القصص).<br />وقد هداه كبره الراسخ في قلبه، المتأصل في نفسه إلى وسيلة لتنفيذ مراده وبسط سلطانه &--64831;إِنَّ فِرْعَوْنَ عَلا فِي الأَرْضِ وَجَعَلَ أَهْلَهَا شِيَعًا&--64830; (القصص: من الآية 4)، فالتفريق بين الناس ونشر الكراهية والحقد في المجتمع وسيلته المثلى فهناك طبقة منتفعة وأخرى متضررة، طبقة غنية وأخرى فقيرة طبقة لها كل صلاحيات البطش من ضبط واعتقال، تفتيش ومصادرة، تحبس وتنصت وحتى التعذيب والضرب، وأخرى مستضعفة لا تملك حتى حق الدفاع عن نفسها، قال تعالى: &--64831;يَسْتَضْعِفُ طَائِفَةً مِنْهُمْ يُذَبِّحُ أَبْنَاءَهُمْ وَيَسْتَحْيِ نِسَاءَهُمْ إِنَّهُ كَانَ مِنْ الْمُفْسِدِينَ&--64830; (القصص: من الآية 4).<br />ولم يكتف بذلك بل أشاع بين الناس أن من يريد لهم الإصلاح إرهابيون فليحذرهم الجميع قال تعالى: &--64831;وَأَرْسِلْ فِي الْمَدَائِنِ حَاشِرِينَ (53) إِنَّ هَؤُلاءِ لَشِرْذِمَةٌ قَلِيلُونَ (54) وَإِنَّهُمْ لَنَا لَغَائِظُونَ (55) وَإِنَّا لَجَمِيعٌ حَاذِرُونَ (56)&--64830; (الشعراء).<br />أما قائد هذه المجموعة الإصلاحية فطامع في السلطان، ساعٍ للحكم، يريد أن يستولي على خيراتكم وأموالكم، بل وحتى أرضكم &--64831;إِنَّ هَذَا لَسَاحِرٌ عَلِيمٌ (34) يُرِيدُ أَنْ يُخْرِجَكُمْ مِنْ أَرْضِكُمْ بِسِحْرِهِ&--64830; (الشعراء: من الآية 34/35).<br />وليس مسموحًا للجمهور بالتفكير أو الاعتراض إلا فيما يراه الطاغية المتجبر فإما أنا أو أنا &--64831;مَا أُرِيكُمْ إِلاَّ مَا أَرَى&--64830; (غافر: من الآية 29)، فأجمعوا على نية مؤازرة فرعون وسحرته قال تعالى: &--64831;وَقِيلَ لِلنَّاسِ هَلْ أَنْتُمْ مُجْتَمِعُونَ (39) لَعَلَّنَا نَتَّبِعُ السَّحَرَةَ إِنْ كَانُوا هُمْ الْغَالِبِينَ (40)&--64830; (الشعراء).<br />والويل كل الويل لمن يخالف، والثبور كل الثبور لمَن يُعمل عقله وفكره في غير التبعية حتى ولو كان بالأمس نصيرًا، وفي القريب معاونًا قال تعالى: &--64831;رَبِّ مُوسَى وَهَارُونَ (48) قَالَ آمَنْتُمْ لَهُ قَبْلَ أَنْ آذَنَ لَكُمْ إِنَّهُ لَكَبِيرُكُمْ الَّذِي عَلَّمَكُمْ السِّحْرَ فَلَسَوْفَ تَعْلَمُونَ لأقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُمْ مِنْ خِلافٍ وَلأصَلِّبَنَّكُمْ أَجْمَعِينَ (49)&--64830; (الشعراء).<br />وبلغة الاستخفاف بالعقول، وبالإعلانات المفضوحة بالنفاق، والحاشية المنتفعة من دماء الشعب وعرق أبنائه جمع فرعون قومه من حوله يقول سبحانه &--64831;فَاسْتَخَفَّ قَوْمَهُ فَأَطَاعُوهُ إِنَّهُمْ كَانُوا قَوْمًا فَاسِقِينَ (54)&--64830; (الزخرف).<br />فجلب على البلاد فسادًا قال تعالى: &--64831;الَّذِينَ طَغَوْا فِي الْبِلادِ (11) فَأَكْثَرُوا فِيهَا الْفَسَادَ (12)&--64830; (الفجر).<br />وعلى الشعب ذلاً واستعبادًا وحبسًا وتضييقًا &--64831;يَسُومُونَكُمْ سُوءَ الْعَذَابِ&--64830; (البقرة: من الآية 49).<br />نشر في البلاد خرابًا اقتصاديًّا، ومجاعةً قاتلةً، وأمراضًا فاتكةً، قال تعالى: &--64831;وَلَقَدْ أَخَذْنَا آلَ فِرْعَوْنَ بِالسِّنِينَ وَنَقْصٍ مِنْ الثَّمَرَاتِ لَعَلَّهُمْ يَذَّكَّرُونَ (130)&--64830; (الأعراف)، وقال تعالى: &--64831;فَأَرْسَلْنَا عَلَيْهِمْ الطُّوفَانَ وَالْجَرَادَ وَالْقُمَّلَ وَالضَّفَادِعَ وَالدَّمَ آيَاتٍ مُفَصَّلاتٍ فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا مُجْرِمِينَ (133)&--64830; (الأعراف).<br />ووسط هذا الوضع المظلم، والفساد المستفحل شاءت إرادة الله للمستضعفين نصره، وللبلاد نماء &--64831;وَنُرِيدُ أَنْ نَمُنَّ عَلَى الَّذِينَ اسْتُضْعِفُوا فِي الأَرْضِ وَنَجْعَلَهُمْ أَئِمَّةً وَنَجْعَلَهُمْ الْوَارِثِينَ (5) وَنُمَكِّنَ لَهُمْ فِي الأَرْضِ وَنُرِي فِرْعَوْنَ وَهَامَانَ وَجُنُودَهُمَا مِنْهُمْ مَا كَانُوا يَحْذَرُونَ (6)&--64830; (القصص).<br />اقتضت إرادة الله أن يُمكِّن للمستضعفين بزوال القوة الغاشمة، ورفعة المؤمنين المستضعفين؛ لأن سنة الله في كونه لا تُمكِّن للظلم كثيرًا، فدولة الظلم ساعة، ودولة الحق إلى قيام الساعة، ولكن هذه النصرة تقتضي أن يكون في المجتمع فئة من أمثال هؤلاء السحرة فئة تصدع بالحق، وتجهر بحرب الطغيان، فئة تُضحي بمالها ونفسها في سبيل كرامتها وعزها.. قال تعالى: &--64831;قَالُوا لا ضَيْرَ إِنَّا إِلَى رَبِّنَا مُنْقَلِبُونَ (50)&--64830; (الشعراء)، فئة تمتلئ بالإيمان فتستمد من الله قوتها يقول سبحانه وتعالى: &--64831;وَمَا تَنقِمُ مِنَّا إِلاَّ أَنْ آمَنَّا بِآيَاتِ رَبِّنَا لَمَّا جَاءَتْنَا رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ (126)&--64830; (الأعراف) فئة تتحلى بالصبر وتعرف قيمة الدنيا الفانية فلا تبالي بحكم الديكتاتورية والطغيان، قال تعالى: &--64831;فَاقْضِ مَا أَنْتَ قَاضٍ إِنَّمَا تَقْضِي هَذِهِ الْحَيَاةَ الدُّنْيَا&--64830; (طه: من الآية 72)، وأخيرًا هي فئة تولي وجهها شطر الآخرة في مغفرة من الله وجنة ورضوان قال عز وجل: &--64831;إِنَّا نَطْمَعُ أَنْ يَغْفِرَ لَنَا رَبُّنَا خَطَايَانَا أَنْ كُنَّا أَوَّلَ الْمُؤْمِنِينَ (51)&--64830; (الشعراء).<br />استحق هذا الجمع المستضعف النصرة عندما قام فيهم رجل مصلح قال الله تعالى: &--64831;وَقَالَ رَجُلٌ مُؤْمِنٌ مِنْ آلِ فِرْعَوْنَ يَكْتُمُ إِيمَانَهُ أَتَقْتُلُونَ رَجُلاً أَنْ يَقُولَ رَبِّي اللَّهُ وَقَدْ جَاءَكُمْ بِالْبَيِّنَاتِ مِنْ رَبِّكُمْ&--64830; (غافر: من الآية 28).<br />رجل نهى عن قتل المؤمنين وإيذاء المصلحين، ذو حكمة نظر في الأمم من حوله فعلم أن الظلم لا يدوم، وأن الهلاك عاقبته الفساد، والتمرد على الله قال الله تعالى: &--64831;إِنِّي أَخَافُ عَلَيْكُمْ مِثْلَ يَوْمِ الأَحْزَابِ (30) مِثْلَ دَأْبِ قَوْمِ نُوحٍ وَعَادٍ وَثَمُودَ وَالَّذِينَ مِنْ بَعْدِهِمْ وَمَا اللَّهُ يُرِيدُ ظُلْمًا لِلْعِبَادِ (31)&--64830; (غافر).<br />وإن هؤلاء المصلحين الذين قاموا في وجه الديكتاتورية التي تبطش بالمعارضين وتصادر الآراء والعقول، وتحجر على الأفكار وتدعي الإصلاح، وهي تطوي الفساد ترفع شعارات الحرية وهي تضمر الاستعباد والإذلال، ديكتاتورية تستخف بشعبها فتضخم الإنجازات الوهمية، وتغرق البلاد بالخراب والأمراض وينتكس في عهدها الاقتصاد وهذه العصبة المؤمنة التي لم تبال بالمحاكمات العسكرية ولا مصادرة الأموال بل وقفت في وجه الظلم تردد وتقول &--64831;فَاقْضِ مَا أَنْتَ قَاضٍ&--64830; (طه: من الآية 72)، هؤلاء هم الشوكة التي ستقصم ظهر الاستبداد.<br />وقد كانت نهاية فرعون عبرة إلى زماننا هذا &--64831;فَأَخَذْنَاهُ وَجُنُودَهُ فَنَبَذْنَاهُمْ فِي الْيَمِّ وَهُوَ مُلِيمٌ (40)&--64830; (الذاريات)، وابقى الله جسده عبرة وآية &--64831;فَالْيَوْمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنْ خَلْفَكَ آيَةً وَإِنَّ كَثِيرًا مِنْ النَّاسِ عَنْ آيَاتِنَا لَغَافِلُونَ (92)&--64830; (يونس).<br />عبرة لأصحاب العقول أما الغافلون اللاهثون وراء المال والطامعون في المال والسلطان فهم كما قال الله تعالى: &--64831;لَهُمْ قُلُوبٌ لا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌ لا يُبْصِرُونَ بِهَا وَلَهُمْ آذَانٌ لا يَسْمَعُونَ بِهَا أُوْلَئِكَ كَالأَنْعَامِ بَلْ هُمْ أَضَلُّ أُوْلَئِكَ هُمْ الْغَافِلُونَ&--64830; (الأعراف: من الآية 179)."
