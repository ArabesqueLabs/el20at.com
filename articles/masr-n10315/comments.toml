subject = "الهندي"
author = "ده راري واتكلم بالفكر"
text = "ياريت يا جماعة ان الموضوع يكون فكري وليس شخصي<br />والي عنده راي يقولة ومش معقولة حد يشيلة قول رايك في عن الموضوع مش عن محرر الموضوع<br />وكمان الي عنده رد ممكن يبعتة علي ميل الموقع والموقع كما اعرف لن يتردد في نشرة لو كان ذو قيمة فكرية<br />اما بالنسبة للموضوع فبالتاكيد كل شخص يري تجربنة لها سلبيات وايجابيات والدكتور علي راي ان الجماعة اصبحت للدعوة الفردية<br />شي مضحك يا دكتور الجماعة مبقتش بتاعة حاجة الجماعة بقت تسمع كلام المسئول واوعي تكلم عن القيادة ناس بتعتقل وبيتعمل ليها حملات للمطالبة بالافراج<br />علي فكرة ده راي شخصي يا ريت محدش يحسب ان ده راي يتعلق بعملي كصحفي"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

