[[comments]]
order = 13
subject = "الدكتور علي \"الطحاوي\""
author = "صديق"
text = "أود أن أصحح بعض المعلومات الواردة بالتحقيق ولا أعلم على وجه الدقة إن كان الأستاذ عبد الله الطحاوي تعمد هذا الخلط ليعطي لموضوعه أهمية أكبر فلجأ إلى التضخيم من حجم الدكتور علي بمعلومات غير حقيقية ليصبح شخصاً أخر غير صاحب الدراسة وليكون الشخص الجديد صاحب المكانة العلمية هو الدكتور \"علي\" الطحاوي \"بمعنى \"دكتور تفصيل على مزاج الاستاذ الطحاوي\"؟ أم أن الطحاوي لا يعرف المعلومات الصحيحة أصلا ؟<br />وفي كلا الحالتين توجد مشــــــــــــــــــــــــــــكلة :<br />اقتباس \"وهو ما يؤكده القيادي الإخواني الأسيوطي الدكتور (علي عبد الحفيظ)، الأستاذ بجامعة الأزهر وصاحب دراسة (تيار بديل) التي مثلت حصيلة تقييم لسنين عمره التي قضاها مع الإخوان هو وبعض رفقائه \"<br />أولا: الدكتور على ليس من أستاذاً وإنما مدرس وحصل على الدكتوراة العام الماضي فقط<br />ثانياً : الدكتور على ليس له علاقة بجامعة الأزهر فهو خريج أداب سوهاج ويعمل مدرس بكلية التربية بالوادي الجديد \"جامعة جنوب الوادي\"<br />ثالثاً: من قال للأستاذ الطحاوي أن الدكتور علي من القادات الاخوانية بأسيوط فهذا الكلام غير صحيح مطلقاً فلا هو من القيادات ولا هو من أسيوط ،حيث أنه من أبناء سوهاج ويعيش بالوادي الجديد<br />رابعاً : موضوع \"حصيلة سنين عمره\" واسعة شوية لأن الدكتور علي من مواليد عام 1974 !!!!!!!<br />ولن أخوض في تفاصيل الموضوع حيث أن الكثير يقوم بهذا الأمر ولكن أحب أن أذكر الدكتور علي بأن الإخوان هم أصحاب الفضل في أنه أصبح في هذا الحال من الفكر والمكانه العلمية وبدونهم كان طريقه غير ذلك تماماً.<br />كما أذكره بأن مكانته كمدرس جامعي تحتم عليه أن يتعقل في النقد وأن ينظر لكل المعطيات المتصلة بالموضوع حتى يكون حكمه عليها موضوعي و\"علمي\"."
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 14
subject = "بداية تشير إلى النهاية"
author = "أخوك"
text = "(تيار بديل) بداية غير موفقة يا دكتور على<br />من يسعى للبناء يستكمل جهود الأخرين ويستفيد منهم بدلا من تضييع الجهود هباءاً في محاولات هدم الأخرين<br />الا ان تكون محاولة منك للظهور فقط بالهجوم على جماعة عظيمة ولها مكانتها في كل مكان كما هو الحال مع كل من يريد أن يجد لنفسه مكاناً على صفحات الجرائد ومواقع الانترنت فيكون اسهل الطرق لذلك هو بوابة الهجوم على الاخوان خاصة لو كان الهجوم صادر من عضو سابق بها.<br />نصيحة أخوية : تعلم من الكفيف.. كيف يتحسس موضع رجله قبل أن يقدم خطوته<br />\"قدر لرجلك قبل الخطو موضعها\""
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

