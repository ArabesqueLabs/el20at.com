subject = "مسكين والله .... !!!"
author = "مواطنة مفقوعة"
text = "اولا .. معذرة المقال ملوش قيمة ، مفيش معنى لكتابة مقال كامل عشان رأي احدهم<br />كان افضل انك تتكلم بإنصاف أكثر بدلا من التحيز وتبني فكرة بهذه الصورة<br />المفروض انك محايد مش بتتبنى دعاية الحزب الوطنى ولا التيار السلفي<br />خلينا ننظر لواقع الاخوان ونقبله حتى لو كان بيخالف هوانا<br />الاخوان صرح عظيم وقوي ربى الالوف من مصلحي الوطن ...<br />لن ننكر انه اينما ذهبت ، واينما وجدت خيراا واصلاحاا وجدته بأيدي احد الاخوان<br />كن منهم او لا تكن منهم ،، فانت بهم وليسوا بك !!"
archived = "2007-05-23"
