[[comments]]
order = 8
subject = "كلام حلو بس للأسف مش مظبوط(2)"
author = "يحيي أديب"
text = "5- هل انتهت الجماعة عام1935 ؟<br />1935 يعتبر نقلة كبيرة للبنا وللحركة حيث ذكر في مذكراته\"مذكرات الدعوة والداعية\" أنه لم يكن في ذهنه هذا التصور الكامل الذي توصل إليه الإخوان في مؤتمرهم الخامس الشاهد أن الجماعة بدأت في هذا التاريخ ولم تنتهي بدات عندما وضعت دستورها ونظامها وتنظيمها الخاص بدأت عندما قسمت الشعب والمناطق والأسر والأقسام وإذا أخطأ الإخوان وأفرادها أو تنظيمها الخاص فلاأنهم بشر يصيبوا ويخطئوا ولا يوجد عقل أو منطق يقول أن أخطاء الأفراد مهما استفحلت يسقط فكر الحركة الإسلامية والتدين الحركي رغم ان هذه الأخطاء تداركه المستشار الهضيب بإلغائه النظام الخاص<br />6- هل ذهب أعلام الجماعة كل صوب\"القرضاوي والغزالي..... \" وسيطر النظام الخاص\"مشهور..السنانيري...\"علي عملية إحياء الجماعة؟<br />س: متي بدأت عملية إحياء الجماعة ج: في عهد السادات بعد هدم المعتقلات وخروج الإخوان من معتقلات \"عبد الناصر\"<br />أي أن الذي بدا عملية الإحياء قادها التلمساني وايس مشهور الذي يفصله المرشد حامد أبو النصر عن التلمساني<br />س: هل التلمساني من رجال النظان الخاص ؟ ج: طبعا لا ومعروف عن التلمساني تقبله وإنفتاحه علي الأخر<br />س: وأين الغزالي والقرضاوي من عملية الإحياء؟<br />فكريا فالحركة تستند علي أفكار الغزالي والقرضاوي في التربية والحركة والصحوة أهدافها ووسائلها<br />تنظيميا فالحركة فضلت ألا تسأتثر الجماعة بجهود عالم بمثل القرضاوي أو الغزالي فتركت لهم حرية الحركة في الفكر الإسلامي دون أن تثقلهم بأعباء تنظيمية<br />س: وايه المشكلة لو ان عملية الإحياء قام بيها مصكفي مشهور والسنانيري؟<br />ج: مفيش مشكلة طبعا لان رغم انهم من النظان الخاص الا ان الهضيبي لغي هذا النظام لانتهاء اهدافه وكثرة مشاكله وعليه فالتلمساني ومشهور والقرضاوي كلهم افراد في الجماعة لا فرق بينهم الا اعمالهم ومهامهم التنظيمية والدعوية"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 9
subject = "كلام مردود عليه"
author = "همسايه (www.hamsaya.blogspot.com)"
text = "انا مش هارد على النقاط الى موجوده فى التحقيق .. انا مش كفئ لكده ... بس فى كذا نقطة..<br />أولا: ليس هناك اى منظومة فى العالم لا اخطاء فيها.. و الخطا ليس جرما .. العيب اننا نرفض الاصلاح .. و هذا لايحدث فى الجماعه .. فالمراقب لحالها و احوالها على مدار عقود الزمان يرى بعين المنصف ما طرأ و مازال يطرا عليها من تغير .. و التوجهات الداخليه لنقد الذات بهدف الاصلاح ..و التطوير.. و هراء ادعاء من يريد جمود نظام يعمل فى اطار منظومة متغيره و عالم يتسم بالديناميكية.<br />تانيا : لا ادرى لماذا ظهر ما يمكن وصفه ب\"موضة\" جديده مؤخرا لجلد الجماعه .. و توجيه السهام لها ..سواء تنظيميا او اداريا او فكريا او حتى منهجيا ..و يعتبرها البعض نظرة ثورية شبابيه .. او سمة لشباب يريد التغير ! و لست ادرى ان كان احساسي فى محله بان عشرينات وولاد البلد راعي رسمي لكثير من هذا الفكر النقدي. اتمنى ان لا يكون احساسي فى محله.<br />ان جماعه اثبتت وجودها داخليلا و خارجيا و استطاعت الصمود طيلة العقود المنصرمة .. يشهد التاريخ لها .. و لا تنتظر شهادة من احد بقدرتها على التكيف و مواكبه العصر بمتطلباته ومقتضياته ..<br />و لست أدرى ما يؤرق مضجع الاستاذ فى نظام الدعوة الفردية و الاشتراكات .. بيد انهما يؤكدان لي - شخصيا - مدى قدرة الجماعه على مزاوله ابسط تكتياكات اساليب البحث العلمي .. و هو التخطيط.<br />اخيرا .. لست ادرى .. لماذا احسه نوع من نكران الجميل .. عندما تتنكر لكل الفضل التى منحته الجماعه للفرد منا .. و فجاه ينقلب عليها .. و لا يكتفى بخروجه منها - و ان كان هو الخاسر فى تلك المعادله - بل يسلط سياطه عليها بالتجريح و ما الى ذلك . على الاقل جدا.. اعترف بقليل الفضل - و ان كنت اراه كثيرا - الذى اضافته لك الجماعه<br />هدانا الله جميعا لما فيه صلاح امتنا و جماعتنا"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 10
subject = "صباح الشامبو"
author = "إخوانى"
text = "الى العزيز بتاع صباح الدروشة ..جميل جدا تعقيبك على التعليق بتاعى ..بصراحة فرحت جدا لما قريته لأنى اتأكدت إنك لم تدخل الإخوان إطلاقا ولم تعرف عنها أى شئ .. شكرا يا عمى جدا .. ريحت قلبى والله ، لأن أكتر حاجة عرفتها عن الإخوان اليفط والانتخابات .<br />واضح إنك وقفت على الباب شوية ورحت ماشى ، ريحتنا يا سيدى وريحت نفسك ، بصراحة صباح الدروشة اللى انت كتبتها دى أجمل حاجة تأكد إن فيه ناس متعرفش اى حاجة عن اى حاجة وبتفتكر نفسها من الإخوان ، وعلى فكرة حكاية الشامبو اللى مش عاجباك دى أكبر دليل قدمته الحكومة على إن الإخوان هيئة جامعة ، عارف ليه يا عسل ؟<br />لأنها بتعلم ولادها - ودول كانوا من العمال - إزاى يعتمدوا على نفسهم ويعملوا حاجة بايديهم ، بدل الاعتماد على مرتب الوظيفة ، لكن اللى ما يعرفش يقول ايه ؟ يقول عدس ، وانا كنت حاسس إنك كنت عاوز تكتب عدس بس الظروف مش مساعدة حضرتك .<br />وبعدين ترس مين يا سيدى اللى بتتكلم عليه ؟ انت متعرفش إن أى واحد فى الإخوان - بجد - مش اللى كانوا على الباب زى حضرتك يقدر يعترض على أى قرار فى الجماعة حتى لو كان صادر من المرشد ، كنتت متوقع اسمع منك حاجة مفيدة فعلا بس اللى سمعته لم يكن اكثر من \" عدس \" لذا فقد لزم التنويه ."
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 11
subject = "عبد الله بيمهد لنفسه وبيلزقها في الدكتور علي"
author = "بلاش"
text = "للاسف يا عبد الله يا سيدي بلاش لف ودوران وتجيبها في علي وزيد وعبيد يا عم انته عايز تسيب الاخوان ما تسيبهم وتخلص وبلاش تحطها في الدكتور على وغيره وعموما مثلك الاعلى انور الهواري خلع من زمان وخلصنا واراح واستراح ياريت بقى تحذو انته التاني حذوه ومتوجعش دماغك ودماغنا لا انته سيد قطب ولا حسن البنا عشان يحصل انقلاب يعني لما تسيب الجماعة والله ما حد هيحس بيك لان اصلا محدش يعرف انك اخوان غير بتوع الامن وطبعا اخوك علي بلدياتك وحبيبك وواضح ان سفرية الاردن دي فرفشتك كتير ويجعله عامر"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

