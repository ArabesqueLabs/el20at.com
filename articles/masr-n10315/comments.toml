order = 32
subject = "تيار بديل ( لا يستحوذ على الدين )"
author = "فاطمة الزهراء"
text = "التيار البديل يضع الأمة كلها في موضع الأحترام فبلفعل كما ذكر الأمة لا تحتاج إلي من يحفظ لها دينها فماذا كل هذا الأستحواز لماذا يذكر هؤلاء أن من غير البنا ومن غير فلان وعلان لم تكون الأمة وصلت لما هي فيه الأن ، أريد أن اسأل وهل ما فيه الأمة الأن شئ تفرح به من ظلم وقهر أم انت تنظر إلي ماذا والله لو ان العلماء لم يتكلموا حتى لحفظ هذا الدين .<br />يجب علينا ونحن نتكلم أن نحفظ للأمة مكانتها واحترامها وترابطها لا تدعونا للتفكك ، الكل يتهم الناس ، التيارات الأسلامية تتهم الناس بالتقصير في حق الله وفي معصيتها وبأنها هي السبب في ما نحن فيه هل هذا كل يصب في مصلحة الأمة ، أما النخبة فهي تتهم الأمة بالسلبية وعدم المشاركة فماذا تشارك وهي بالاساس لم تجد من تخرج خلفه .<br />ارجوكم لا يستحوذ احد علي الدين ويدعي انه هو حامل اللواء ، ولا يستحوذ اخرون على الوطنية ، الرجاء احرصوا على تجميع الأمه لا تشتيتها وللنظر إلي ما يتحدث عنه التيار البديل"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 33
subject = "خلاصة الكلام يرجى من الحكمة تفعيل المادة الثانية من الدستور التي تنص على ان الشريعة الاسلامية هي مصدر التشريع وتطبيق القوانين الاسلامية في البلاد وهؤذا هو المراد مننا جميعا"
author = "مش مهم"
text = "الرئيس السادات هو الذي اضاف هذه المادة للدستور<br />ونطالب بتطبيق شرع الله سبحانه وتعالى في جميع مناحي الدولة كما امرنا الله سبحانه وتعالى في القرأن<br />ولذلك ونحن نؤيد الرئيس حسني مبارك وندعو بعدم الخروج عليه<br />نطلب منه تطبيق الشريعة الاسلامية فورا وسنظل نطالب بذلك مع احتفاظنا بعدم الخروج على الامام حتى ولو ظلم<br />وسمعت حديث اليوم في صلاة الجمعة بعدم الخروج على الامام ولو جلد ظهرك واخذ مالك هذا خير من فتنة الخروج على الحاكم<br />ونرجو من الاخوان المسلمين ان يتخلوا عن قصة فرعون موسى في نشر ثقافتهم والمنشورة في التعليقات عاليه"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 34
subject = "خروج عن الموضوع"
author = "شخص محايد"
text = "اعتقد أن الاخوة الافاضل الذين علقوا تعليقات خارجه عن الموضوع اظن انهم في حاجة إلي شي من التركيز قليلا ً فبعضهم ترك الموضع الأساسي واخذ يتكلم عن الجماعة المباركة وعن الجنة والبنا واشياء انا لا افهمها ، أرجوا ان تعلقوا على الفكرة فهذا الذي يعلق على شخص الدكتور على ويقول انه مدرس وغير مدرس اسأله ؟ ما رأيك في فكرة التيار البديل ؟ ومارأيك في افكاره ؟ ارجوكم تكلموا في الموضوع ولا داعي للخروج عن الموضوع"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 35
subject = "ردا ً على ياسر ابو العلا"
author = "مروة"
text = "الاخ الكريم ياسر ابو العلا<br />اعتقد انك غير منصف في كلامك عن الدراسة ، لانك اولاً قلت ان فيها جهد ويجب ان تحترمة ، وثانيا ً اى فائدة توضع فيها الدراسة غير مصلحة الأمة ، فالدراسة التى بين ايدينا والتى قراتها في المقال ، حاول ان تقراء قراءة بناء ولا تنظر إليها من اعلى وكانك فوق السحاب وهي تحت الأرض .<br />اخى الكريم انت شديد الأعجاب بجماعة الإخوان لانك واحد من أفرادها ، وكذلك اعضاء التيار البديل كانوا اعضاء فيها والذي اخرجهم منها هو مصلحة الأمة التى أسائت الأدب في الحديث عنها ، فكيف تقول أن الإخوان هم السبب فيما فيه الأمة الأن اليسوا هم افراد في الأمة اهلم وعشيرتهم جزء منها لماذا تقول ان انواع التدين سبب فيها التيار الأسلامى وبالله عليك ماذا فعل التيار الأسلامي وماذا فعلت جماعة الأخوان ؟؟؟؟<br />الأمة متدينة بطبيعتها لانها كما قال عن نبيها ( لا تجتمع على ضلاله ) وفي نفس الوقت الخير فيها إلي يوم القيامة<br />لا الأخوان ولا غيرهم لها فضل في شئ عليها ولا حتى اباء النهوض ولكن هي قائمة محفوظة بأمر من الله<br />أرجوك أقراء كتاب ( تيار بديل ) لانني بالفعل قرأتة وحاول النظر حولك وانت في داخل الإخوان ولا تتعجب من أبنا التيار البديل ( فإن العقلاء يملؤن مصر )"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 36
subject = "س5: تحدث عن دور المعلم في بيان طاعة ولاة الأمر.. وبيان فضل العلم والعلماء؟"
author = "مش ضروري"
text = "من الأمور المهمة لدور المعلم تعزيز محبة ولي الأمر في طاعته لما أمر من , واجتناب كل ما نهى عنه من الشر , قال تعالى : ( أطيعوا الله وأطيعوا الرسول وأولي الأمر منكم ) .<br />وقد فسر العلماء ولاة الأمر بأنهم الأمراء والعلماء ؛ لان الأمراء يأخذون الشرع عن طريق العلماء، وقد أوجب الله طاعة الأمراء في طاعة الله حتى ولو فسقوا ولو جاروا قال الرسول صلى الله عليه وسلم { تسمع وتطيع للأميرو إن ظرب ظهرك وأخذ مالك فاسمع وأطع } وفي حديث آخر { إن كان لله في الأرض يومئذٍ خليفة جلد ظهرك وأخذ مالك فالزمه }<br />هذا ما يعلمه المعلم الداعية للطالب الذي هو واجهة المجتمع ويتوازن هذا الأمر بعدم طاعة ولي الأمر في معصية الله سبحانه وتعالى قال الرسول صلى الله عليه وسلم: { لا طاعة لمخلوق في معصية الله عز وجل } وعزز الأمر بعدم الخروج على الحاكم حتى يرى كفرا ًبواحا ًلأن مفسدة الخروج أعظم من الإصلاح وهذا ظاهر في التاريخ الإسلامي وحتى الكفر البواح يجب أن ينظر هل الخروج له مصلحة وإلا فعدم الخروج أولى.<br />ومن ذلك يعلم المعلم المجتمع بكيفية دعوة ولاة الأمر بطريقتين مهمين وهما:<br />1- المناصحة باللين .<br />2- المناصحة بالسر.<br />ولا عجب فموسى وهارون عليهما السلام يقول لهما تبارك وتعالى لدعوة فرعون : { فقولا له قولا ًلينا ًلعله يتذكر أو يخشى }, فإذا كان فرعون الذي تكبر وتجبر هكذا تكون دعوته فكيف بوالي المسلمين فهو الأولى باللين والمناصحة بالسر.<br />ومن هنا نلحظ كيف كان أثر المعلم في طاعة ولي الأمر ومحبتهم ومناصحتهم.<br />أما عن فضل العلم والعلماء فقد بين المعلم ذلك مستشهدا بقوله تعالى ( إنما يخشى الله من عباده العلماء) وبين المعلم فضل العالم حتى يقع احترامه في المجتمع بقول الرسول صلى الله عليه وسلم \" وإن العالم ليستغفر له من في السموات ومن في الأرض حتى الحيتان في الماء وفضل العالم على العابد كفضل القمر على سائر الكواكب إن العلماء ورثة الأنبياء إن العلماء لم يورثو دينارا ولا درهما إنما ورثوا العلم فمن اخذ به اخذ بحظ وافر\"<br />وبين أن لحوم العلماء مسمومة فمن اغتابهم فهو في خطر عظيم لأن بعلمهم يفقه الجاهل ويعرف امور دينه"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 37
subject = "الفرق بين الشيخ الشعراوي ومحمد مهدي عاكف"
text = "الشيخ محمد متولي الشعراوي في حوالي عشرين سنه فسر القران وعلم الناس العلم وافتى بعدم جواز استخدام ايات القران على مسلم ينطق الشهادتين ابدا وقال في تفسيره ان الذي نطق الشهادتين ولو مرة واحدة لا يمكن ان يكون كالذي جحد بهما.<br />اذن فحسني مبارك بكل تأكيد هو من اهل الشهادتين لا يمكن ان يكون مثل فرعون الذي جحد بالله ورسوله موسى ابدا وتشبيه حسني مبارك بفرعون خطأ عظيم<br />ثانيا مهدي عاكف خريج تربية رياضية وقعد في السجن حوالي 20 سنه هو يعني زعيم سياسي كبير مثل مانديلا ماذا سننتفع منه غير المظاهرات والاشتباكات مع الامن المركزي وامن الدولة<br />حسن البنا المرشد العام الاول كان عالم جليل كان يجلس في المساجد ويعطي دروس في العلم والدين والايمان ويفقه ويعلم ولم يكن سياسيا محضا بهذا الشكل<br />وخلاصة الكلام كيفنا تكونوا يولى عليكم"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 38
subject = "التيار البديل بين هاني صلاح الدين والإخوة المنتمين"
author = "سمير حسين"
text = "ليعلم الأستاذ هاني صلاح أن الإخوان هم جماعة من المسلمين وليسوا هم كل المسلمين ، وبالتالي فالخروج من الإخوان لا يعني الخروج من الإسلام .. ثم كيف تضع الإسلام والمسلمين في كفة ، والإخوان في كفة عندما تقول : \"بين الحين والأخر يخرج علينا مجاهيل يحاولون ان يكون لهم دور فلا يصبح أمامهم سوى طريقين الأول النيل من الإسلام والمسلمين او النيل من الأخوان فهما الطريقان الأسرع للوصول للأبواب المفتحة \" .. هل هناك فرق بينهما؟<br />وكان الأجدر بك أن ترد على كتاب [التيار البديل] بشكل فيه ترتيب وعقلانية ـ وأنت معك نسخة من الكتاب ـ بدلا من أن تقول : \" لذا لانستغرب علي أمثال هؤلاء (علي ورفقاء دربة ) ان يخرجوا علينا بمثل هذه الدعوات البعيدة كل البعد عن الحقيقة وبأستطاعتى ان افند كل منها علي حدة ولكن المكان يحول دون ذلك وسأسعى لتفنيدها بالتفصيل فى وقت لاحق\"<br />كان بإمكانك أن تضع نقدك في المساحة المخصصة التي علقت فيها ، وكانت ستتسع لردك ، لكنك حماسي وبالبلدي \" واخدنا في دوكة وجلبة \" حتى لا تترك فرصة للرد عليك.<br />ثم يا سيدي [الإخوان المسلمون فوق رأسنا من فوق] ، لكني لست معك فيما طرحته من أسئلة مثل (تصوروا ان لم يوجد علي الساحة الإسلامية والسياسية الإخوان ، لنطلق العنان لخيالنا ونستبعد ألأخوان من صورة الأحداث سواء فى مصر أو فلسطين أو أى بقعة فى العالم ألا ترون ان الموات سيكون سيد الموقف)<br />وعلى هذا أجيبك أن الإسلام ينصره الله بالبر والفاجر ، وبالتالي ليس الإسلام كدين في حاجة لأنه ينصره الإخوان ؛ فالإخوان جزء من التيار الإسلامي ، وليسوا كل الإسلام كما أسلفنا ــ هم على ثغر من الثغور ــ<br />[ثم تقول سيدى صاحب التيار البديل كيف تتصور مجلس الشعب وقد خلا من من نواب الأخوان ( وهذه صورة رأيناها من ذي قبل ) بالطبع كان مجلسا مطيع مؤدب وابن حلال ولا بيهش ولا بينش]<br />يا أستاذ هاني تم تعديل الدستور وقانون السلطة القضائية ، وكل مايريده النظام تم في وجود الـ 88 أعضاء الإخوان في البرلمان بالإضافة للمستقلين<br />وحول قولك: بل تصور سيدى صاحب التيار البديل الجامعات المصرية من غير الاخوان بالطبع تحولت جامعاتنا لأوكار للحب بل والرذيلة وتصور أن الإخوان لم يظهروا علي الساحة الإسلامية بالمرة أظن أن العري والفساد الأخلاقى سيد الموقف<br />أقول لك : يا أستاذ هاني لتعلم أن الزواج العرفي في الجامعة حسب أحدث الإحصائيات الصادرة عن وزارة التضامن الإجتماعي بلغ حوالي‏255‏ ألف طالب وطالبة متزوجون عرفيا‏ ,‏ ويشكل هذا العدد نسبة تصل الي‏17%‏ من طلبة الجامعات والبالغ عددهم‏5,1‏ مليون ‏,‏ ونتج عن ذلك وجود اكثر من‏14‏ ألف طفل من مجهولي النسب هم نتاج هذا النوع من الزواج ، والظاهرة متجددة وكل عام تصدر إحصائيات بأرقام مختلفة ففي عام 2003 كشفت دراسة أجراها المجلس القومي للسكان وجامعة القاهرة والجامعة الأمريكية عن وجود 400 ألف حالة زواج عرفي بين الشباب المصري في السن من 18 إلى 30 عاما ، الأهم هو ما ذكرته الدراسة أن نسبة الزواج العرفي بين طلاب الجامعات كان وقتها 6 % من مجموع طلاب وطالبات الجامعات المصرية ، وفي عام 2004 أشارت دراسة للمركز القومي للبحوث الاجتماعية إلى أن هناك 30 ألف حالة زواج عرفي بين أصحاب الشركات وسكرتيراتهم ، وفي عام 2005 نشرت صحيفة الشرق الأوسط اللندنية تقريرا يرجح زيادة أعداد المتزوجين عرفيا إلى أرقام أعلى من ذلك.<br />هذا فضلا عن انتشار العري في الشوارع بشكل مستفز ، وبالتالي لم يمنع وجود الإخوان على الساحة ارتفاع معدلات الزواج العرفي في الجامعات ، أو تفشي الفساد في المجتمع<br />قلت إن عدم وجود الإخوان سيغيب موقف الأسلام من السياسة فكل الفصائل الاسلامية المعتدلة تميل لتجنب غضب السلطان سواء سلف أو تبليغ ودعوة أو أنصار سنة سيدى البديل<br />أرجوك يا أستاذ هاني لا تقلل من جهد الآخرين في الدعوة إلى الله ، فكل له دور غير منكور سواء في الدعوة أو التربية أو تعليم العلم الشرعي .<br />أما بالنسبة للزميل عبد الله الطحاوى ماهو إلا ناقل لفكرك وطرحة بكل حيادية وإن كنت أختلف معه بأنه لم يُعمل قلمة ويقيم فكرتك المجانبة للصواب ولكن كعادتة يتميز بجمال القلم ومتعة العبارات وتميز العرض وعلى كل حال اعلم انة لدية قناعة كاملة بالرفض لمعظم ما جاء فى هذه الدراسة كما استنبطتة منة فى مناقشة سابقة<br />أرى أن الزميل عبدالله الطحاوي أبدع في عرض الدراسة ، ولا يعيبه أنه لم يعلق عليها ؛ لأنه لا يكتب في نشرة خاصة باتجاه معين حتى يوجه ما يكتب لهذا التيار أو ذاك<br />أخيرا .. افتقرت غالبية الردود للمنطق والحوار ، بل كانت عبارة عن حفلة زعيق أو صراخ ، لاينبغي أن تكون في أناس من المفترض أنهم جزء من الحركة الإسلامية<br />وشكرا للطحاوي ، ومن قبله الدكتور المعيد علي عبد الحفيظ أن حركا المياه الراكدة"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

