[[comments]]
order = 46
subject = "دولتنا المصرية.والغضب الكسول"
author = "علي محمد"
text = "أود في بادئ الامر أن يكون مفهوما بشكل جلي أن فكرتنا لا تنبني في أي من أسانيدها على اكتشاف أمر جديد ,فنحن لم نكتشف اوضاعنا التاريخية ولا دور مصر الاستراتيجي كقلب العالم,وعلى كل انسان في الحقيقة أن يرى بنفسه أن عناصر الفكرة اللتي نقوم بالتخطيط لهل ليست موجودة فحسب ولكنها حقا ظاهرة للعيان.<br />علينا اولا ان نحرر عقول الرجال.فلابد أن تشق الفكرة طريقها الى ابعد وأتعس الجحور اللتي يعيش فيها شعبنا,انهم سيستيقظون من ظلام الفكر عندما يتدفق في حياتهم معنى جديد.<br />ليس مطلوبا من أي نظام حكم أن يتغير لمجرد أن الشعب يريد ذلك,الحكومات تتغير حين يكون الشعب قادرا على تغييرها واجبارها على الرحيل,<br />لا أريد أن يكون يكون شعبنا يتسم بهذا النوع من الغضب الكسول ولا يريد أن يعبر عن نفسه,تغيير نظام الحكم في مصر واسقاط الحزب الحاكم لصالح انجاح حزب اخر,كل هذا ليس هبة ولا منحة للشعوب بل هو حق اذا كانت تريده وتستحقه فلتفعله فورا.فأي مجد ينتظر أولئك اللذين يكافحون في سبيل هدف غير أناني.من أجل ذلك فانني أعتقد أن جيلا رائعا من الشباب المصري الحر سوف ينبثق الى الوجود,<br />ان المصريين اللذين يريدون الدولة المصرية ستكون لهم,وسوف نحيا اخيرا رجالا أحرارا على أرضنا,وسنموت بسلام في بيوتنا.وسوف يتحرر العالم بتحررنا,ويغتني بثروتنا,ويعظم بعظمتنا,وأيا ما حاولنا احرازه من أجل صالحنا,فسوف يرتد بقوة وفائدة لخير الانسانية.<br />هل بعد ذلك يمكن التماس العذر لهؤلاء اللذين سحقتهم عجلات النظام السياسي,هل يمكن أن نرأف بحالهم لمجرد أنهم لا يملكون الحق في التغيير؟ترى الى متى سيظل المصري يعاني من ألم الجوع اللذي يقرصه في جنباته,جوع الطعام والشراب,جوع الحب,جوع الجنس,ترى هل يدرك المصري أن أزمته الكبرى في حريته السياسية؟هل يعي أن ذلك من صميم الموروث الديني؟<br />أيها الشباب المصري الحر..... لقد دقت ساعة العمل الثوري والوقت دائما أسرع فلا سبيل لتلك المهاترات اللتي نسمعها من أولئك اللذين يدعون أنهم نخبة فتلك وجوه أحرقتها الهزائم وعلينا نحن الشباب المصري أن نقرر شيئا وأن نقف بحزم في وجه الجهلاء ودعاة الخراب .......فحينما ترونا نعجز عن ذلك .........تمنوا لنا الموت ..........فسيكون حتما رحمتنا الوحيدة......تيار بديل"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819051038/http://masr.20at.com:80/newArticle.php?sid=10315"

