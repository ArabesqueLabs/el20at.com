subject = "على كل لون يا طحاوي"
author = "حبيبك"
text = "على كل لون يا طحاوي<br />في شغل مع الاخوان تشتغل<br />في شغل ضد الاخوان ماشي<br />في مظاهرات وخطب ما يضرش<br />في شغل في كنايس واديرة ماشي<br />في اي حاجة تاني ..........ماشي<br />حددلك خط واحد تمشي فيه عشان ماتهوش في السكة يا \"طحطاوي\""
