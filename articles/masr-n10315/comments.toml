[[comments]]
order = 44
subject = "القوة النفسية والمشروع النهضوى"
author = "أبو خالد"
text = "الإنتماء للإخوان لا بد وأنه يحتاج إلى قوة نفسية وعزيمة واستعداد للبذل وتحمل المشاق وهذه طبيعة طريق الدعوة ( واصبر على ما أصابك ) وقد يحضر البعض بعضا من أنشطة الإخوان ثم لايجد فى نفسه هذه القوة النفسية أو قد يتعرض للإبتلاء أو السجن فيراجع نفسه أقصد يراجع استعداده للبذل والصبر .<br />وبالنسبة للتيار البديل أقول أولا إذا لم يكن د . على عبد الحفيظ مقتنعا لهذه الدرجة بفكر الإخوان ومشروعهم النهضوى فما الذى دعاه للإنتماء إليهم أصلا وقضاء هذه السنوات من عمره معهم أم أن هذه المراجعات كلها حلت عليه فجأة بعد تعرضه للسجن .<br />ثانيا : إذا كان الإنسان لديه أفكار إصلاحية ومشروع نهضوى فلماذا لا يقدمه كمشروع مستقل ؟! لماذا يجعل نفسه بديلا للآخرين ؟! هل لاعتقاده أن المجال لايتسع إلا لفكرة واحدة ؟! أم لاعتقاده أن مشروعه غير مكتمل الأركان . دعونا نرى أركان هذه المشروع النهضوى (الجديد ) وليس البديل ."
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819051038/http://masr.20at.com:80/newArticle.php?sid=10315"

