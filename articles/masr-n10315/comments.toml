[[comments]]
order = 30
subject = "رحم الله البنا"
author = "ابو يوسف"
text = "رحم الله الامام البني لو كان عايش وشاف التعليقات الي كتبينها الاخوان<br />كان ضربهم بالجزمة<br />بقي ده بالذمة تعليق ناس بتفكر<br />ده خناقة وقلة ادب<br />بقي هما دول الاخوان بالتاكيد لا<br />\" من هم فينا وليسوا منا ومن هم منا وليسوا فينا\"<br />ربنا ياخدكوا شوهتة الاسلام والاخوان"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

