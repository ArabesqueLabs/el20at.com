[[comments]]
order = 25
subject = "عايزين نحط ادينا على الخلل (قصة فرعون موسى هل جائز العمل بها"
author = "ابومحسن"
text = "يا جماعة عايزين نحط ادينا على الخلل في جماعة الاخوان المسلمين<br />الاخوان المسلمين يستخدمون قصة فرعون وموسى في نشر فكرهم<br />يعني الحاكم فرعون وهامان هو الوزير والجنود جنود فرعون هذا ثابت في دعوة الاخوان المسلمين<br />فهل هذا صحيح<br />انا بقول الكلام را لان المرشد العام راح للشيعة وقالهم انتوا اخوانا في الله الشيعة الاثنى عشرية وما ادراك ما الشيعة الاثنى عشرية وكفرهم البواح في سب ولعن العشرة المبشرين بالجنة وزوجتي النبي عائشة وحفصه<br />يعني الحاكم المصري السني فرعون وجيشه جيش فرعون والشيعة الكفره اخوانا في الله<br />لماذا هذا التناقض يا فضيلة المرشد<br />انت مرشد في ايه بالضبط"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

