[[comments]]
order = 1
subject = "جماعة رائدة تبنت الصحوة"
author = "ياسر أبو العلا"
text = "الدراسة بالطبع مبذول فيها جهد واضح ، كنت أتمنى لو استثمره الباحث \" على \" في شئ مفيد ، وبدلا من استقصائه الحثيث لما يراه مثالب الإخوان كان يجب أن يوجه تلك الأوقات إلى البناء .<br />يا سيدي .. كيف تعتبر أن الأمة لم تكن في حاجة إلى حسن البنا وغيره من المصلحين لإقناعهم بأن الإسلام منهج حياة ، ولماذا إذن لم يلتزموا بهذا الفكر قبل أن يأتي البنا وقبله المصلحون الآخرون ؟<br />الناس دائما تحتاج إلى من يذكرها حتى بالثوابت لأنها تضيع مع الأيام ، إن ما قام به البنا ومن بعده جماعة الإخوان أكبر من أن يحصيه مثلي وفى مثل هذه السطور .<br />أرأيت إلى تيار الالتزام الواسع بالإسلام في شارعنا المصر ، بل أرأيت التدين الذي أصبح السمة الرئيسية في مجتمعاتنا العربية والإسلامية ، والتفاف الناس حول الإسلام والدعاة إليه .<br />ألم تلاحظ مدى الشعبية التي يحظى بها الإسلاميون - وفى القلب منهم الإخوان - في أي انتخابات يخوضونها ؟<br />ألم تتعرف على الحقد والغيظ الذي يكتنف المفسدين والأفاقين من الإسلاميين الذين يفضحونهم في كل موقع بكشف ممارسات هؤلاء المفسدين ؟<br />سيدي .. لك مطلق الحرية - بالطبع - في أن تكون مع الإخوان أو لا تكون ، ولكن من حق الأمة أن تعلن عن أن هذه الجماعة أحيت الدين بعد أن نسيه الكثيرون ـ ودافعت عن شمولية الإسلام بعد أن أوشكت تلك الحقيقة أن تضيع تحت ضغط الذين لا يريدون لهذا الإسلام أن يحكم ، أو تعلو شريعته .<br />بالله عليك ... كيف تتخيل عالمنا الإسلامي دون هؤلاء المجاهدين الذين ضج منهم الصهاينة وأنّوا في حرب فلسطين ، وما زال أبناء حماس ينغصون حياتهم ليل نهار ؟<br />كيف تتخيل شارعنا العربي والإسلامي - الذي كان أوشك أن يجرفه الانحلال - دون هذه الصحوة التي قادها الإخوان في ربوع عالمنا الإسلامي ؟<br />كيف ترى تلك الجموع من الشباب المصري الذي انتشله الإخوان من براثن التطرف والضياع في أواخر السبعينات ، وأسلمه إلى طريق الإسلام الصحيح ؟<br />هذه ملاحظات سريعة على ما قرأت ..."
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 2
subject = "ما أحلى أن تكون إخوانيا !!"
author = "إخوانى"
text = "أثارني التعليق الأول ، ولا أملك والله إلا أن أرثى لحال صاحبه ...<br />فكيف - أخي العزيز - تعلن عن نشوتك بالخروج من تلك الجماعة التي يشعر من يغيب عن أحد لقاءاتها أنه كالسمكة التي أبعدت عن الماء ؟<br />ألم تحن إلى تلك القلوب النقية التي كانت تنصحك بالطهر والعفاف والتشبث بالدين قائما وقاعدا<br />؟<br />ألم تشتق إلى مسامراتك مع إخوان لك ما جمعكم إلا طاعة الله والحب فيه والعمل لدينه ؟<br />ألم تهف نفسك إلى الاجتماعات التي كنت - إذا كنت - تحضرها للإعداد لأي عمل إسلامي والحث الدؤوب من إخوانك على تجديد النية والنشاط في العمل لهذا الدين ؟<br />لا يا أخي ... ما أحلى أن نظل مع تلك الفئة المؤمنة الصادقة تحقيقا لإحدى الحسنيين .. التمكين لهذا الدين أو الموت على نية تحقيق هذا التمكين .<br />ألم تتق نفسك إلى البكاء وقت الغروب وأنت تقرأ ورد الرابطة وتذكر من سبقوك على طريق الدعوة ؟<br />ألم تؤثر فيك نصيحة من أحد إخوانك ذكرتك بالله أو دفعتك للاجتهاد في مذاكرتك أو حثك للمثابرة في عملك ؟<br />ألم تأسرك ابتسامة من أحد إخوانك وهو يسدى إليك نصيحة لدنياك أو آخرتك ؟<br />أعتقد أنك لم تذق طعم أن تكون ....من الإخوان ... بجد...."
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

