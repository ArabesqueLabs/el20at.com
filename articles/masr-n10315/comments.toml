subject = "لنتجاوز الأزمة"
author = "علي محمد"
text = "بداية أشكر كل من ساهم بكلمة تفيد في مشروعنا ( تيار بديل ) واتمنى من أصحاب النقد اللازع ( الهادم ) بعد أن ينتهوا من ثروة الأنفعالات المفعومين بها - وحتما ً ستنتهي قريبا ً - أن يبدؤا في كتاب نقد موضوعي أو يستخرجون من قرائحهم ما يفيد في معالجة الأزمة المصرية .<br />كلامنا - لمن أراد أن يشارك بإيجابية - في غاية الوضوح ، فلقد تحدثنا عن أزمة النهوض - وهذه رؤيتنا - ونراه اليوم في حال يرثى لها ، فكان من واجبنا - شأن كل الشباب المصري - أن يساهم في دفع عجلة النهوض إلي الأمام - هذا بعد الكشف عن الأعطاب التي تخللته ومحاولة العلاج - .<br />ثم تحدثنا عن مشروعنا سياسي بالمقام الأول ولا نري حاجة لدعاية الخوف علي الدين من الضياع فهو كلام قبيح وسخيف<br />- ومازلنا نكرر - الإسلام والدين \" بنص قرآني \" محفوظين إلي يوم الدين ، والأزمة برمتها أزمة نهوض وصراعات سياسية ، وقراءة التاريخ منذ بداية الدولة الأمويه وإلي اليوم فيه متسع للجميع .<br />ثم انتهينا وقدمنا رؤية لدولة مدنية حديثة وسردنا القول في وظائفها وأمنها القومي وعلاقتها بالعالم علي قاعدة الإنسانية .<br />\" فنحن نرنوا لذلك اليوم الذي تقف فيه الإنسانية بحزم في وجه الجهلاء ودعاة الخراب ، وتسعى متحدة نحو الخير والسلام عبر حلف فضول عالمي ينصر الضعيف ويعين ذا الحاجة \"<br />وعليه فمن راى في كلامنا خيرا ً فهو مدعوا معنا للتأسيس للتيار البديل ، ومن راى غير ذلك فنحن ندعوه بأن لا دعايه سلبية فقط من أجل خير بلادنا<br />تيار بديل"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 40
subject = "تعليق بسيط جدا"
author = "سيد على"
text = "حقيقى ان الامر لا يعدوا الا مجرد اجتهاد شخصى من الدكتور على عبد الحفيظ يشكر عليه ويستفاد منه اذا كان فيه ما يستفاد حقا ولكن من الواضح ان الدكتور لم يستوعب فكرة الاخوان جدا ولذلك يرى ان دعوتهم الى شمولية الاسلام عيب وليست ممدوحه لهم ، والذى يعلمه القاصى والدانى ان سر تميز الاخوان عن غيرهم من الجماعات انهم بارعون فى شتى المجالات فمنهم الطبيب التقى والعام النووى والمفكر الاسلامى والداعية المجيد والطالب الناجح والمهندس البارع والفقيه الحاذق والمفسر البارع والعامل والصانع هذا هو الاسلام لا يوجد فيه طوائف متفرده عن بعضها البعض بل بناء متكامل يكمل الكل بعضهم البعض باخذون الاسلام كلا لا جزءا كما امر دينا ( نصيحه للدكتور على ولغيره من المتشككين فى الدعوة وجدوها ان يقرا كتب الاستاذ محمد احمد الراشد مثل العوائق والمنطلق والمسار ففيها الخير الكثير )"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 41
subject = "ندااااااااااااء إلى عبدالله الطحاوي"
author = "حبيب الطحاوي"
text = "لك الله يا عبدالله<br />ما الذي يدفعك لهذا ؟؟؟!!!<br />أأغراك افتعال المعارك الكلامية مع شباب الاخوان كوسيلة سهلة لخلق<br />أسم مشهور في حياة قصيرة فانية ؟؟!!<br />وماذا بعد ذلك ؟؟<br />هل كانت الإخوان مرحلة فكرية لك أم مرحلة اجتماعية ؟؟؟<br />هل تجاوزت هذه المرحلة الآن .. وتحاول أن تفلسف الأمر وتجعله مراجعة فكرية وموضوع كبير<br />ونصر حامد أبوزيد وسلمان رشدي \" وعلى إخوان \" !!!! والمواضيع تخش في بعضيها<br />حنانيك أخ طحاوي بنفسك .. وبشباب الإخوان المتحمسين مع غياب بعض الخبرة<br />دعك من الفلسفة والتنظير الغير مجد .. وتعال إلى رحابة الإيمان<br />فمكانك في ركن المسجد ينتظرك<br />وربك في شوق لسماع دعائك وليس نظرياتك وفلسفاتك \" الهوارية \" أو \" العبدالحفيظية \"<br />اشتاقت رحمة ربك أن ترى أناملك بين كفوفك مرفوعتان إليه تسأله فيجيبك ويرحمك ويصطفيك ويعلمك<br />لا أن يرى أناملك تخط ما يغضبه<br />تعال يا عبدالله !!!<br />تعال<br />تعال"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125516/http://masr.20at.com:80/newArticle.php?sid=10315"

