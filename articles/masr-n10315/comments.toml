subject = "شكرا"
author = "الطحاوي"
text = "السادة المعلقون المختلفون والمتفقون ياريت لا نجعل الحوار شخصيا اعتقد انا عرضت فكرة كما هي وطرحتها للنقاش لا تعبر عن رايي وهو واضح من النهاية ( هذه هي أفكار الدكتور علي نقلتها كما هي دون تعليق، ربما تتفق أو تختلف معها، لكن هذا لا يقل عن جديتها وإن اتسمت بشيء من القسوة والعمومية لكن هي مطروحة للنقاش) لا داعي للتجريح واتهام الاخرين شكرا لكل من كلف نفسه وخط حرفا وقرا موضوعي ، وسامح الله من أساء"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 18
subject = "ارفعوا ايديكم عن الأخوان"
author = "هاني صلاح الدين"
text = "بين الحين والأخر يخرج علينا مجاهيل يحاولون ان يكون لهم دور فلا يصبح أمامهم سوى طريقيبن الأول النيل من الإسلام والمسلمين او النيل من الأخوان فهما الطريقان الأسرع للوصول للأبواب المفتحة لذا لانستغرب علي أمثال هؤلاء (علي ورفقاء دربة ) ان يخرجوا علينا بمثل هذه الدعوات البعيدة كل البعد عن الحقيقة وبأستطاعتى ان افند كل منها علي حدي ولكن المكان يحول دون ذلك وسأسعى لتفنيدها بالتفصيل فى وقت لاحق لكن اوريد ان أطرح علي جهابذة التيار البديل بعض الأسئلة ومنها تصوروا معي ان لم يوجد علي الساحة الأسلامية والسياسية الأخوان بل لنطلق العنان لخيالنا ونستبعد ألأخوان من صورة الأحداث سواء فى مصر او فلسطين او اى بقعة فى العالم الاترون ان الموات سيكون سيد الموقف سيدى صاحب التيار البديل كيف تتصور مجلس الشعب وقد خلا من من نواب الأخوان ( وهذه صورة رأيناها من ذي قبل ) بالطبع كان مجلسا مطيع مؤدب وابن حلال ولا بيهش ولا بينش بل تصورى سيدى صاحب التيار البديل الجامعات المصرية من غير الاخوان بالطبع تحولت جامعاتنا لأوكار للحب بل والرذيلة فى بعض الأحيان ناهيك عن تغيب كل قضايا الأمة عن شبابنا بل سيدى صاحب التيار البديل تصور ان الاخوان لم يظهروا علي الساحة الأسلامية بالمرة اظن ان العري والفساد الأخلاقى سيد الموقف بل سيكون هناك تغيب كامل لموقف الأسلام من السياسة فكل الفصائل الاسلامية المعتدلة تميل لتجنب غضب السلطان سواء سلف او تبليغ ودعوة او انصار سنة سيدى البديل انت ليس امامك بديل الا مراجعة موقفك ليس من العيب أن أختلف مع الغير لكن العيب ان اشوة الغير اما بالنسبة للزميل عبد الله الطحاوى ماهو الا ناقل لفكرك وطر حة بكل حيادية وان كنت أختلف معه بأنة لم يُعمل قلمة ويقيم فكرتك المجانبة للصواب ولكن كعادتة يتميز بجمال القلم ومتعة العبارات وتميز العرض وعلى كل حال اعلم انة لدية قناعة كاملة بالرفض لمعظم ما جاء فى هذه الدراسة كما استنبطتة منة فى مناقشة سابقة"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 19
subject = "الاخوان اداة سياسية"
author = "ابومحسن غربة ?? سنه"
text = "الاخوان اداة سياسية يستخدمها الحكام<br />يعني مثلا الملك فاروق دخلهم السجون<br />وجمال عبد الناصر طلعهم علشان خاطر يعمل انه كويس وبعدين دخلهم السجن تاني<br />السادات علشان خاطر يضرب الناصرية قال يا حرام وطلعهم من السجن<br />وفي اخر ايام السادات دخلوا السجن<br />ولما جه حسني مبارك قال ما يصحش كدة وطلعهم من السجن<br />وبعدين حسني مبارك كان بيتقي شرهم وقبل الانتخابات كان بيعمل حملة اعتقالات وبعد الانتخابات بيطلعهم<br />المرادي ما اعرفش ايه اللي حصل وكلهم نزلوا الانتخابات علشان خاطر تحصل الازمة اللي احنا عايشين فيها الان وما حدش يعرف بيلعبوا الازمة دي لمصلحة مين<br />يعني الاخوان اداه سياسية بيتلاعب بيها الغير ومش عارفين يقودوا نفسهم ويعملوا لنفسهم شخصية وما عندهمش انتماء وطني يعني بيغلوا مصلحتهم الشخصية على مصلحة<br />وبيعتمدوا في نشر ثقافتهم على قصة فرعون موسر يعني الحاكم فرعون ووزير الداخلية هامان والجيش جيش فرعون والمرشد هو سيدنا موسى والاخوان هما بنو اسرائيل وهذه فكرة خاطئه بسببها تحولت البلاد الر سجون ومعتقلات<br />ما هو اصل مش معقول حتشبه الحاكم (اي حاكم) بفرعون وحيسكتلك<br />فأرجو منهم ان يصححوا فكرهم على اساس ان الحاكم والجيش والوزراء مسلمين وليسوا فرعون وجنوده<br />ما اعرفش ايه اللي حيستفيده الاخوانجي من القعده في السجن بالسنين والناس بره مش عارفه تصلي والله العظيم وانا في صلاة الجماعه ما في حد فاهم يعني ايه صلاة الجماعه لا الركوع صح ولا السجود صح ومش عارفين يقفوا صف<br />يبقي ايه فايدة القعده في السجن من الافضل انهم يقعدوا في الجوامع يعلموا الناس الدين والايمان افضل<br />واضرب مثل فضيلة الشيخ محمد متولي الشعراوي<br />في عشرين سنه فسر القرآن وغير الناس على مستوي العالم الاسلامي كله<br />كان ممكن الشيخ الشعراوي يعمل عنتر ويدخل يعيش في السجن وكان حرم الناس من تفسير القرآن العظيم<br />انا بقول كده لان المرشد العام سمعت انه عاش في السجن عشرين سنه عايز اعرف المسلمين استفادوا ايه بقعدته في السجن"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 20
subject = "لماذا لم ترد ؟ يا استاذ عبد الله يا طحاوي"
author = "إخواني"
text = "سؤال موجه إلى الأستاذ عبد الطحاوي \"محرر الموضوع\" :<br />لماذا لم ترد على المغالطات التي ذكرها صاحب تعليق \" الدكتور على الطحاوي\" رغم أنها تقدح في مصداقية الموضوع ومصداقيتك الشخصية ؟<br />حيث ذكر أن صاحب فكرة \"التيار البديل\" ليس استاذاً وإنما مدرس<br />ولا يعمل بجامعة الأزهر وإنما بجامعة \"جنوب الوادي\"<br />وليس من القيادات الإخوانية في أسيوط وعمره لا يزيد على 34 سنة<br />وبالأساس ليس من أسيوط وإنما من سوهاج ويعيش في الوادي الجديد<br />برجاء الرد حفاضظاً على مصداقيتك ومصداقية الموقع الجميل<br />وعلى فكرة طرح \"التيار البديل\" من شاب امر لا يعيبه بل يبشر بالخير الكبير مادام يبحث عن الطريق الصحيح<br />وبالتالي فلا توجد اي ضرورة لتغيير مواصفات صاحب الفكرة لإضفاء مزيد من الأهمية عليها.<br />واقول للأخ علي عبد الحفيظ جزاك الله خيراً على هذه الأفكار التي يشوبها الكثير من الأخطاء والمغالطات ولكنها محاولة<br />جيدة ومفيدة لكل من سيطالعها من الاخوان وخاصة الشباب منهم حيث تدفعهم مثل هذه الأفكار إلى البحث اكثر وزيادة<br />العمل لتصحيح اي خطأ يتم الوقوف عليه لتقويم المسار وليس الإنسحاب كما فعلت أنت ؟<br />وأيضاً بدون ضجيج حيث أن أذان وعقول وقلوب الإخوان مفتوحة للجميع وخاصة أبناءها من جميع الأعمار والمستويات،<br />وكل من هو \"داخل\" الصف الإخواني يشعر بذلك.<br />ولهذا فإنني أعتقد أنك بعيد عن الإخوان أو أنك تظن بطريق الخطأ أنك كنت واحداً منهم بمجرد انتظامك معهم لفترة من<br />الزمن.<br />وعلى كل الأحوال جزاك الله خيراً وأنصحك بأن تكون يداً تساعد في البناء وليس معول للهدم !<br />واذا كانت الثانية فلا تستبشر خيراً<br />هدانا الله واياك إلى الحق وثبتنا عليه إلى ان نلقاه"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 21
subject = "ضع عنوان التعليق"
author = "الطحاوي"
text = "ياجماعة ما اعرفه عن الرجل أنه من اسيوط وأنه حامل لراسالة الدكتوراة في احد العلوم الشرعية وهذا ما نقله لي عندما قابلته سواء كان مدرسا او استاذ او عميدا هذا امر يسال عنه الدكتور نفس الكلام ينطبق على سجنه والوثيقة ..لكن القضية الاساسية هي في الفكرة محل العرض واعتقد هي واضحة وانا فتحت الباب للنقاش خلونا في الفكرة واعد بالاستيضاح والرجوع اليكم اذا كان هناك خطا في نقل المعلومة وساقول بكل صراحةالمهم هيا نكمل النقاش الواعي الذي هو اهم شيء تحتاجه الامة الان وكل ياخذ من كلامه ويرد"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 22
subject = "بطل عقد يا طحاوي !!"
author = "محمد"
text = "الموضع ببساطة ان أي جماعة أو تنظيم معرض إن بعض المنتمين ليه يتركوه..وبالنسبة للإخوان وعلى مر العصور محصل إن حصل انشقاق داخل الجماعة بالمعنى الحركي المتعارف عليه في ادبيات التنظيمات والاحزاب للإنشقاق..يعني كل من خرجوا من الاخوان كانت عبارة عن صور فردية وليها ظروفها المتعلقة بالفرد إلي رمى العُرض وقال مش لاعب...<br />وبعض النماذج بيؤثر الانسحاب بإحترام من غير صخب الاضطهاد أو المتاجرة بالقضية زي ناس كتير واسماء مكنش حد عارف عنها حاجة إلا بعد شتيمة الاخوان والتهجم عليهم...<br />وبالنسبة للاخوان إلي كانو اخوان وتركو الاخوان فده كان اختيارهم والاخوان معندهمش فصل أو رفت..إلي عايز يسيب ..يسيب..إنما الاخوان مبيمشوش حد !!<br />وكل المناوشات والكلام عن وجود انشقاق أو حركات تمرد داخل الجماعة على مر السنين كلها مواقف ليها ظروفها..ولم تؤثر في الجماعة لا فنياً ولا كمياً..لان وضع الاخوان الديموجغرافي عصي على إن خروج أو إنعزال أي عدد أو كفاءة ..يؤثر في كفاءة الاعملل داخل الاخوان أو انتظام المشروعات الاخوانية سواء كانت مشروعات داخلية تربوية أو خارجية خدمية !!<br />وبصراحة يا طحاوي يا أخويا...من احتكاكي المباشر بكتير من خرجوا من الاخوان لقيت إن اسباب تركهم للإخوان كلها تلاكيك للتنصل من عبئ العمل المنظم وتبعاته في ظل ظروف الاضطهاط والتنكيل إلي بيعشها الاخوان...<br />يعني مثلاً شخصية هرمز للحروف الاولى من اسمائها ( أ . ز )..ده كان عايش في صفيحة زبالة \"لامؤخزة وفجأة وبدون مقدمات ولا حول ولا قوة له بقى يسافر \"بعلاقاته الاخوانية أيام مكان اخوان\" وربنا فتح عليه بفضل الاخوان ولحم كتافه وكتاف ابوه واخواته من خير الاخوان وفجأة بقوا الاخوان وحشين وكخة..يا أخي قحة !!<br />و واحد تاني طرشجي ( ر .ف )نفس الوضع كان جاره في صفيحة الزبالة بس كانت حالتهم اصعب من وضع صاحبنا أ . ز..وحالياً متعرفش إيه إلي حصلهم..انهبلو من كتر الفلوس !!<br />وكبير العيلة ( ه . ج) واحد مشتغلش شغلانه واضحة طول عمره ولامؤخزة كان قاعد في بيتهم وعايش على بعض الاعمال إلي بيعملها للإخوان نظير أجر لحد ما وصل الاربعين أو قارب ..وفجأة \"برضك\" ربنا كرمه بشغلانه \"عن طريق الاخوان\" وبياخد فيها عشر تلاف جنيه..وخير ما بين الاخوان والعشرتلاف جنيه..وطبعاً اختار !!<br />وعلى فكرة يا طحاوي..الاخوان عمرهم ما زعلوا على جاحد أو ناكر للجميل أو قليل الاصل..لأن دي حاجة تفرح الاخوان إن النماذج دي تنسحب لأنهم بصراحة ميستهلوش !!!<br />المهم ..الي يسيب يسيب..بس يسيب بإحترام ..!!<br />وكتير تركوا الاخوان من غير متاجرة ..ولا هو \"أكل العيش يحب شتيمة الاخوان \"\"!!"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

[[comments]]
order = 23
subject = "حركة في غيبوبة"
author = "التجديد"
text = "كثرة الحركات والاحزاب والتيارات الاسلامية، التي جميعها تجزم وتؤكد أن خطها هو الطريق الوحيد للحق والحقيقة، تؤكد وجود خلل وشح كبير في الفقه السياسي الاسلامي. فبينما ألفت وطبعت وانتشرت مئات الكتب والأبحاث عن فقه الطهارة مثلا، يبقى الانتاج والبحث والاجتهاد في الفقه السياسي محدودا الى أقصى درجة، بالرغم من وجود أكثر من محاولة جديرة بالاهتمام، مثل شرح مفهوم الحكم السياسي في الاسلام من قبل علي عبد الرازق الذي هوجم بضراوة وكفر وفسق وزندقة، كما هو المعتاد في ظل الاطروحات الجريئة، وكذلك حاول عبد الرحمن الكواكبي تقديم رؤية تحليلية لمفهوم ومعنى الاستبداد وعواقبه، بالاضافة لمحاولات أخرى متنوعة من آخرين. ويبدو أن الرؤية الاسلامية للتعايش والفكر السياسي المغذي لذلك انتقلت من حال الإمام المستنير محمد عبده، الذي كان قادرا على الانفتاح على الغرب والأخذ منه ومد جسور التعاون معه، وعدم الاحساس بالخوف أو الهلع الى مرحلة سيد قطب، الذي قطب خطابا وطرحا امتلأ بالذعر والتحذير من «فقدان الهوية» و«ضياع الثوابت» و«ذوبان الخصوصية» لاننا مهددون منهم، فبالتالي علينا التقوقع والانعزال والانغلاق والتشكك في الكل"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

