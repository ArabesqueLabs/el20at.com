[[comments]]
order = 6
subject = "كلام حلو بس للأسف مش مظبوط"
author = "يحيي أديب"
text = "1-مشكلة الدخول أو الخروج من الإخوان دي مشكلة قناعة شخصية انما الملابسات والظروف المصاحبة هي اللي بتسبب المشاكل واعتقد انها بتبقي راجعة لظروف شخصية بحتة وموضوع الإختلاف في الرؤي والفكر والاهداف بتكون موجودة دايما انما المشاكل والأزمات الشخصية بتسخنها<br />2-من قال ان الإخوان لا يقدرون جهود اوائل الأصلاحيين أمثال محمد عبده والأفغاني رغم ان البنا تتلمذ علي يد الشيخ رشيد رضا تلميذ محمد عبده وورث عنه\"البنا عن رشيد رضا\" تحرير مجلة المنار<br />3-كان الإمام محمد عبده أن الإصلاح يبدأ من التربية وكان الأفغاني يؤمن بأهمية الحكم والسياسة في الإصلاح فجاء البنا وجمع بين الإثنين التربية وممارسة السياسة<br />4-من قال ان الإخوان عندهم حساسية من الديقراطية فمن بداية التأسيس والبنا يصرح أن النظام النيابي المعمول به في مصر وقتها هو أقرب النظم للإسلام ولم يكتف بذلك بل شارك بترشيح نفسه في الإنتخابات<br />واسه فيه كلام"
archived = "2007-05-23"
capture_url = "https://web.archive.org/web/20070523064400/http://masr.20at.com:80/newArticle.php?sid=10315"

