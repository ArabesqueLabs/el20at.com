text = "انا اعيش في جدة واول مرة اسمع ان هذه الظاهرة اصبحت كثيرة في السعودية<br />بس في معلومة<br />انو ممكن تلاقي كل ساعه حفله يعني مش قصة طلاق فقط قصة انو اي مناسبة لو كان اخر يوم دوام في حفل لو بداية دوام او دراسة في حفل لو فرح او حفل ميلاد او سابع مولود او حد هيسافر او جي من السفر والحفلات مش بسيطة بتبقى كبيرة نوعا ما دا حتى صلح الزوجين لازم ليه عزومة كبيرة تبعاً للعادات ( دا بالنسبة للكبار)"
