text = "صح المثل المصرى اللى يعش ياما يشوف لكن لم كن اتصور ان ياتى اليوم التى تحتفل به المراة بطلاقها بدلا من ان تبكى على فراقها لزوجها الذى كان سبب عفتها وعلى اطفالها الذين تيتموا رغم وجود ابيهم وعلى فقدها لعائلها والله انه من محدثات الامور ما انزل الله بها من سلطان ولم نسمع قط على وجود مثل هذة الامور فى عهد الحبيب محمد رسول الله صلى الله عليه وسلم ---كفى ---كفى ---كفى!!!!!!!!!!!!!!!!!1بدع وتضليل"
