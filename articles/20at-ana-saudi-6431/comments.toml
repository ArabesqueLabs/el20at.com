subject = "حسبي الله ونعم الوكيل"
author = "meto"
posted = "2007-06-25"
text = "يعني يوم ما حد يقول كلمة تزعل أهل السعودية يقولوا إحنا و إحنا و أرض الحرمين... أما تطبيقهم للدين فغريب شوية<br />يعني مسمعوش إن أبغض الحلال عند الله الطلاق... و أيام العدة اللي المفروض سيادة المطلقة متخرجش فيها من بيتها!!!!<br />طب معرفوش إن المبذرين كانوا إخوان الشياطين!!!!!!!<br />ربنا هيحاسب الناس دس على فلوس لو كانت إتصرفت في مرضاة الله ولا في سبيل الله ولا في بلد مسلمة محتاجة زي الصومال مش كان يبقى أحسن<br />طبعا كلامي لا هو حقد ولا هو حسد لاني و لله الحمد مرتاحة ماديا لكن عمري ما فكرت زي الناس دي ما بتفكر<br />بستغرب إزاي يبقى البني آدم في إيده نعمة يفرط فيها بكل سفه بالشكل ده!!!!!"
