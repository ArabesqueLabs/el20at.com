subject = "شىء غرييييييب"
author = "ayat alla"
posted = "2007-07-01"
text = "انا بالفعل سمعت عن تلك الظاهرة ولكنى لم اعرف انها منتشرة بهذه الصورة الملحوظة<br />لكن الحقيقة اللى لازم تعرفها اى امرأة تحتفل بطلاقها بهذه الصورة ان كل الحاضرين او اغلبهم لا يتعاطفون معها ولا يبادلونها نفس احساسها بل هم قادمون للفرجة فقط وان اى واحدة منهم تتعرض لمثل هذا الموقف لن تفعل مثلها لانه اسلوب غريب ومنافى لعادات المرأة العربية المسلمة فتخرج من هذا الموضوع ملامة على تصرفها وبالطبع كل الاخطاء واقعة عليها<br />حقيقى انه موضوع لابد ان ياخذ المجتمع السعودى منه موقف لأن الشىء الذى يزيد عن حده ينقلب لضدضه"
archived = "2010-03-14"
