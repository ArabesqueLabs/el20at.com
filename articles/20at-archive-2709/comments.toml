posted = "2008-06-06"
text = "ان من البديهي لمن عاش وقرأ تاريخ المغاربة ان يعرف تمام المعرفة . اصل هذا الشعب اليهودي الاستعماري ابتداءا من اعتدائهم على الجارة الجزائرية وانتهاءا باحتلال الصحراء الغربية .. مع سبق الاصرار و الترصد ان له حقا في ملكيتها . لا و الف لا يا صبي الرباط يا لوطي .. يا من سمحت بزواج المثليين .. اصطدمت احلامك بصخرة المجاهدين الصحراويين .. ادعوكم اخوتي لقراءة التاريخ من مصادر اخرى فالمغرب يكتبون تاريخهم بقلم الرصاص فكله كذب و نفاق و ظحك على شعبهم الفاسد و المقهور .. اللهم لا تؤاخذنا بما فعل السفهاء بنا.....www.intifadamay.com لا اعرف كيف كنت تفكر يا صاحب المقال حين كتبت هذا الهراء .. تظحك على نفسك ام تصبرها ام اردت ان تحجب نور الشمس .. والله متم نوره ولو كره الكافرون . صدق الله"
