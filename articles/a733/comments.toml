[[comments]]
order = 0
subject = "بيرو"
text = "كرهوا الإسلام وقالوا ..<br />قد جاء بحد السيف ..!!<br />أتراهم قد جلبوا سلاما ..<br />أم كره وبراهن زيف..!!<br />أقتل ..لاتهتم بهم ..<br />وأرفع صليبك عاليا ..<br />ما أنت في حرب ..أو كرب<br />بل أنت بنزهة صيف ..!!<br />ما دام النوم يسليهم ..<br />والورق الأخضر يسكرهم<br />ماداموا يلهون جميعا<br />سيكون صليبك في عز<br />لن يشكو أبدا من خوف ..!!"
archived = "2004-11-10"
capture_url = "https://web.archive.org/web/20041110003455/http://www.20at.com:80/article.php?sid=733"

[[comments]]
order = 1
subject = "اللهم العن الصليبيين ومن والاهم وشايعهم"
text = "اللهم انصر المجاهدين فى الفلوجة,<br />اللهم سدد رميهم,<br />اللهم بارك فى عملياتهم,<br />اللهم وفق قادتهم,<br />اللهم ثبت اقدامهم,<br />اللهم القى فى قلوب اعدائهم الرعب,<br />اللهم امد المجاهدين بمددا من عندك,<br />اللهم انتقم من كل الحكام المخروسين عن ما يحدث,"
archived = "2004-11-10"
capture_url = "https://web.archive.org/web/20041110003455/http://www.20at.com:80/article.php?sid=733"

