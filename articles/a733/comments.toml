[[comments]]
order = 3
subject = "فترة جديدة"
text = "بسم الله الرحمن الرحيم\" يريدون أن يطفئوا نور الله بأفواههم و يأبى الله إلا أن يتم نوره و لو كره الكافرون \"<br />اللهم أنصر الإسلام و المسلين<br />هذا المشهد و المشاهد و الأقوال المماثلة دليل على أن البشرية فى بداية الدخول فى فترة جديدة فى تاريخها حيث يعود الدين ليكون الباعث و المحرك للصراعات فى العالم\" صراع و حرب الأديان \" بعيدا عن السياسات و الأيديولوجيات التى سيطرت خلال القرون القليلة الماضية.<br />و الله أعلم<br />و ندعوا الله أن يعجل نصرة الإسلام والمسلمين"
archived = "2004-11-10"
capture_url = "https://web.archive.org/web/20041110003455/http://www.20at.com:80/article.php?sid=733"

