text = "بالله عليك يا سيادة القاضى ايه الروشنه دى ايه الدماغ الاوفر دى على ما اعتقد ان الدين الاسلامى مبين حد الخمر ولا ايه يا باشا وبدل ما حضرتك تحكم بجلد هذا السكير تقوله روح وتعالى بعد 6 شهور حافظ القراءن ده كلام برده يا باشا ازاى واحد مسطول يحفظ القراءن مش اما يفوق الاول تسمحلى اقولك اللى عملك قاضى ظلمك وظلم الناس معاك<br />عبيط ده ولا ايه"
