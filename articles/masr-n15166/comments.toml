[[comments]]
order = 3
subject = "دعوة للاستقلال"
author = "سيف الدين قطز"
posted = "2008-04-18"
text = "بيان هام من الشعب المصرى .<br />اولا :-<br />* فى يوم(4) مايو بمناسبة وصول تعداده السكانى فى عام 2008 الى (80) مليون مواطن ووصول الرئيس مبارك لسن (80) سنة قرر الشعب اعفائه من منصبه كرئيس للجمهورية مع حفظ حق الشعب فى تقديمه للمحاكمة.<br />ثانيا:-<br />قرر الشعب المصرى اختيار كلا من :-<br />المشير/ ابو غزالة رئيسا للجمهورية . واللواء / عمر سليمان نائبا للرئيس.<br />الدكتور / كمال الجنزورى رئيسا للوزراء.<br />الفريق / صفى الدين ابوشناف وزيرا للدفاع .<br />اللواء/ احمد رشدى وزيرا للداخلية.<br />السيد / عمرو موسى وزيرا للخارجية<br />ثالثا :-<br />يتم تنفيذ القرار من 5 مايو 2008 ولمدة سنة واحدة كفترة انتقالية مؤقتة.<br />رابعا :-<br />اتباع وزارة الدفاع فقط لسلطة رئيس الجمهورية.<br />خامسا :-<br />يقوم رئيس الوزارء بتشكيل الوزارة مع منحه صلاحية كاملة فى انشاء او الغاء اى وزارة طبقا لما يراه فى مصلحة الشعب مع الغاء منصب وزير العدل ..<br />سادسا :-<br />انتخاب مجلس القضاء الاعلى من بين القضاة على ان يقوم المجلس فور انتخابه بتشكيل لجنة من القضاة<br />المختصين باعداد دستور جديد للبلاد يطرح للاستفتاء العام بين افراد الشعب فى موعد اقصاه 1/11/2008يحدد به قواعد انتخاب رئيس الحمهورية ورئيس الوزراء والمحافظين وسلطاتهم وفصل السلطات وضوابط تكوين الاحزاب وتعظيم حرية الشعب وعدالة توزيع الثروة القومية ........الخ كما يقوم المجلس المنتخب باختيار وتعيين كل من النائب العام ورئيس المحكمة الدستورية العليا وانتخاب رئيس لمجلس القضاءالاعلى وتكون جميع قراراته بالتصويت المباشر يتم انتخاب هذا المجلس كل 4 سنوات ولايسمح فية لاى عضو بالترشيح اكثر من دورتين .<br />سابعا :-<br />يقوم رئيس الوزراء بترشيح ثلاثة من ذوى الخبرة ليتم الاستفتاء الشعبى داخل كل محافظة لاختيار محافظ من بينهم.<br />ثامنا :-<br />حل مجلس الشعب وتعطيله لمدة عام ونصف مع الغاء مجلس الشورى وعزل جميع رؤساء تحرير الصحف القومية ويتم اختيار رؤساء بدلا منهم بلجنة ثلاثية مكونة من رئيس الجمهورية ورئيس الوزراء ورئيس مجلس القضاء الاعلى.<br />تاسعا :-<br />فتح الباب امام حرية تكوين اى حزب اى كانت اتجاهاته بشرط حصول الحزب على عضوية الفين عضو من خمس محافظات مختلفة على الا يقل سن العضو عن (20) سنة عند الاشتراك فى الحزب.<br />عاشرا :-<br />حل جميع مجالس النقابات المهنية واعادة انتخاب مجالس ادارة جديدة عن طريق جمعية عمومية مستقلة لكل نقابة حيث يتولى القضاء الاشراف على هذة الانتخابات.<br />احدى عشر:-<br />يتولى الجهاز المركزى للاحصاء تنقية جدوال الانتخابات واعداد كشوف الناخبين من واقع المواليد والوفيات على ان يقوم بالتنسيق مع مجلس القضاء الاعلى بتنظيم اجراء اى انتخابات والتى يتولى مجلس القضاء الاعلى وضع الضوابط والقواعد المنظمة للانتخابات وجميع النواحى المتعلقة بها ونظر الطعون والبت فيها كذلك يتم التمهيد لاجراء انتخابات رئيس الوزراء وتشكيل الحكومة من الحزب الذى حقق 70% من اعضاء مجلس الشعب بما يخلق نوع من تكوين التحالفات بين التيارات السياسية المختلفة<br />اثنا عشر :-<br />حل جهاز امن الدولة وتقليل تعداد الامن المركزى وتفعيل دور الشرطة للمحافظة على امن المواطنين واعادة الامن الى الشارع بالقضاء على جميع اوكار ومظاهر البلطجة واعفاء وزارة الداخلية من الاشراف باى شكل على اى انتخابات ويقتصر دورها فقط على حماية مقار اللجان واعمال الحراسة .<br />ثالث عشر :-<br />يتم تشكيل محكمة تقوم بمحاكمة كل من شارك فى الفساد ونهب ثروات البلاد على ان يتم توجية الاتهام للمسئولين السابقين بمعرفة جهاز الرقابة الادارية وبعد تقديم الادلة والبراهين على تورطهم فى مظاهر الفساد على ان يتم ترشيح واختيار اعضاء الرقابة الادارية بمعرفة لجنة مكونة من رئيس الجمهورية ورئيس الوزراء او من ينوب عنهم بالاضافة الى رئيس مجلس القضاء الاعلى ورئيس الجهاز المركزى للمحاسبات .<br />واخير ا نسأل الله التوفيق فى مشروع الاصلاح هذا ونرجوا نشره واعتباره نواه لذوى الخبرة لتفعيله بعد التصحيح ( انشره وساهم فى الاستقلال )"
