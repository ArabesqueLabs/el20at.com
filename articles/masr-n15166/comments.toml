[[comments]]
order = 1
subject = "نص خطاب مبارك فى فى 5 مايو كما سيقال بالضبط"
author = "حسب اللة السادس عشر"
posted = "2008-04-13"
text = "الاخوة والاخوات<br />اتحدث اليكم بمناسبة عيد العمال وانا اعرف ان كل عمالنا شرفاء الا اقلية منحرفة وشرزمة تحاول الرجوع بالبلاد الى الخلف<br />ولكن انحارفها سوف نردعة بالامن المركزى والاعتقالات<br />هذة الشرزمة عدوة التقدم تحاول جرنا الى الوراء ولكن لا رجعة عن المكتسبات<br />استغلت هذة الاقلية المنحرفة الظروف التى يمر بها العالم ومنها مصر وهى ظروف الغلاء وطوابير العيش ولكن هيهات ان نتراجع عن المسار الذى وضعناة لنفسنا<br />من 1981 لما توليت كان عندنا عشرين تليفون دلوقتى بقم عشريميت تليفون وكان المثتثمر بيروح قبرص علشان يعمل مكالمة من هناك دلوقتى ما شاء اللة التليفونات فى كل مكان<br />وانتاج الكهرباء كان مش عارف اية دلوقتى بقى اية<br />واحمد عز كان شحات وفى العصر بتاعى بقى عندة 60 مليار مش دى مكتسبات والناس الحاقدة علية بتوع الاشاعات والجماعة المحظورة يبطلوا نق دكر على الراجل<br />نعمل اية فيكم كل واحد بيخلف 5 او 6 والشعب بيزيد كل سنة مليون هنجيب منين<br />اوعدكم باننى لن اتخلى عن محدودى ومعدومى الدخل حتى اطلع عين ابوهم<br />لامساس بمجانية التعليم ولا دعم رغيف الخبز<br />هو بس فاضل شوية صغيرين ونطلع من عنق الزجاجة وكل واحد هيبقى عندة يخت وفيلا وسيارة دفع رباعى<br />الناس المستعجلة دى يهدوا شوية والخير جاى<br />وفى النهاية سنحقق الاتى<br />زيادة قوات الامن المركزى من مليون ونص الى 3 ملايين وتعيين فرد مباحث امن دولة لكل مواطن علشان يحس بالخير والمكتسبات التى لا رجعة فيها ابدا"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161058/http://masr.20at.com:80/newArticle.php?sid=15166"

[[comments]]
order = 2
subject = "رسالة مفتوحة الى السيد رئيس الجمهورية وصلتني على ا"
author = "مش كاتب"
posted = "2008-04-13"
text = "نحن أبناءك ورعاياك في مقابر البساتين والتونسي والإمام الشافعي وباب الوزير والغفير والمجاورين والإمام الليثي وجبانات عين شمس ومدينة نصر وأسفل الكباري<br />وفي المناطق العشوائية وبجوار المساجد وفي القرى والنجوع وفي الأكشاك الصفيح علي أشرطة القطارات<br />.. اسمح لنا أن ننقل لك بثا مباشرا لحالنا الذي سيتوارى خجلاً بعده المخرج خالد يوسف وفيلمه 'حين ميسرة' الذي يجسد فيه واحدا علي مليون من حال الفقراء والعشوائيات في مصر<br />.. نحن نموت من الجوع يا سيادة الرئيس .. ما هذا الذي يحدث في بلادنا مصر ...؟<br />ربما نسكت ونصبر علي القهر.. علي الذل.. علي المعاملة السيئة... علي تشابه أيامنا بعضها ببعض.. وعلي عدم القدرة علي الحلم.. لكن كيف نصمت على الجوع..؟<br />لو سكتت ألسنتنا لتكلمت ونطقت وصرخت بطوننا ... الأسعار اشتعلت ناراً .. والخدمات معها..بدون سابق إنذار أو تمهيد.. طعامنا الذي يطلق عليه الساسة الأغنياء 'طعام الفقراء' لا نستطيع شراءه .!<br />الفول أصبح الكيلو بـ 5 جنيه ... العدس بـ 9 جنيه ... زجاجة الزيت العادي بـ 10.5 جنيه ..!! كيلو الحلاوة السادة غير المعبأة ـ طعام المساجين ـ أصبح بـ 12 جنيه ... كيلو الجبنة البيضاء ب 18 جنيه !<br />صبرنا على الذل في طابور العيش .. وقضينا نصف عمرنا في سبيل أننا في النهاية نحصل علي رغيف عيش رخيص الثمن.. دلنا يا سيادة الرئيس علي أي طابور ولو طوله بالكيلومترات ولكن في نهايته نجد طعاما رخيص الثمن.<br />يا سيادة الرئيس ... قل لنا ماذا نأكل ؟<br />حتى الخدمات الضرورية ارتفعت بصورة مضاعفة ... فاتورة الكهرباء اشتعلت ... وفاتورة المياه توهجت.. وفاتورة التليفون لن نتكلم عنها فليس عندنا تليفون أصلاً..!!<br />واسمح لنا يا سيادة الرئيس أن نقدم لك ما نأكله هذه الأيام .. والذي يعتبر مفاجأة للكثير لما وصلنا له .. ولا نعلم هل هو كذلك بالنسبة لسيادتكم أم لا ..؟<br />والله.. والله ما سنقوله حقيقة يمكن أن تتأكد سيادتك مما سنقوله عما نأكله.. من خلال زيارتنا في أي من الأماكن التي ذكرناها سلفاً أو غيرها .. نقدم لسيادتكم عدة وجبات مما نأكلها الآن بعد أن ضاقت بنا السبل في أن نشتري الفول والعدس والزيت..<br />هذا ما يأكله فقراء مصر خير شعوب الأرض الذين أوصي بهم سيدنا محمد صلي الله عليه وسلم خيرا ً :<br />الوجبة الأولي :<br />يتم إحضار بقايا العيش البلدي وتتم إضافة قليل من الماء مع استمرار التقليب والدعك حتي يصبح مثل الطحينة تماماً.. ويوضع عليه بعض الملح والبهارات اللازمة ويتم تغميسه بالعيش ... يعني عيش... يغمس بعيش ..!!<br />الوجبة الثانية :<br />نذهب لأي فسخاني ونشتري بعضا من ماء الفسيخ منه بـ 50 قرشا ونقوم بتغميسه بالعيش ... أهوه بنحدق يا ريس ... !!!<br />الوجبة الثالثة :<br />نذهب إلي سوق الخضار ونشتري الخضار التالف العاطب والذي يضعه البائع عادة أسفل قدميه ... نأخذه ونحاول تظبيطه بغليه ونضعه بعد تقطيعه علي النار ويتم عمل خلطة خضار نأكلها في الثلاث وجبات ... ؟!!<br />الوجبة الرابعة :<br />نذهب إلي أي جزار ونأخذ منه العظم الذي يلقيه أسفل قدميه وتلعقه القطط .. والذي لا يوجد به أي مواسير أو غيره .. فنحن ليس في مقدرتنا شراء عظم المواسير الفاخر...ونقوم بغسله ونضعه علي النار مع كمية كبيرة من الماء ... ونعمل شوربة حتي نرم عظم أولادنا ونشرب شوربة ..!!<br />الوجبة الخامسة :<br />وهي أغلي الوجبات وأصبحت ترفيها لنا وهي شراء الفراخ النافقة الميتة من عند تجار الفراخ الذين يبيعون لنا الفرخة بـ 4 و 5 جنيهات ، بعد أن تعدي ثمن الفرخة 30 جنيها ووصل ثمن الكليو من الفراخ البيضاء إلى 13 جنيه .. !!<br />الميتة أحلت لنا في عهدكم من سنين يا سيادة الرئيس .... !!<br />الوجبة السادسة :<br />شراء أرجل الفراخ وعمل خضار وشوربة عليها ... حتي يجد الأطفال ( منابا) يمسكونه في أيديهم حتي ولو رجل فرخة ..؟!!<br />وأخيراً تصور يا سيادة الرئيس .. ما يحلّي به شبابنا وأطفالنا عندما يهفهم الحلو .. إنهم يذهبون لبائع الزلابية ولقمة القاضي وبلح الشام ومعهم رغيف العيش ويقطعونه نصفين ويطلبون منه أن يضع لهم القليل من الشربات المسكر الذي تتم التحلية به داخل الرغيف ...!!<br />لا أريد أن أكمل حتي لا أشق عليك يا سيادة الرئيس أكثر من ذلك ..<br />ولكن أكرر سؤالي : قل لنا ماذا نأكل ...؟؟<br />قرص الطعمية بـ 25 قرش ..! علبة الفول أصبحت بـ 1.5 جنيه ولا تكفي شخصين .. ساندوتش الفول بـ 75 قرش ...؟!!<br />إحسبها أنت لنا يا سيادة الرئيس .. لو قلنا أن مرتباتنا 300 جنيه في الشهر .. هذا لو افترضنا أن جميعنا يعمل عملا دائما أو يعمل أصلاً .. والأسرة محددة النسل وعندها طفلان والأب والأم ... كيف نأكل ونشرب ونسكن ونركب مواصلات ونلبس ونعالج أولادنا وندفع كهرباء ومياه بـ 10 جنيه في اليوم في ظل هذه الأسعار ... ؟!!<br />نريد أن نري انحيازك للفقراء يا سيادة الرئيس أمرا واقعيا نحياه ونتلمسه ...<br />تنادي دائما بأنك تريد أن يصل الدعم لمستحقيه .. فلتدعم يا سيادة الرئيس السلع التي نأكلها فقط ... هل الأغنياء يأكلون عدسا أو فولا أو يستخدمون زيوت الكتان مثلنا .. لماذا لا يكون كيلو العدس بجنيه واحد فقط وكذلك الفول وتكون زجاجة الزيت كذلك ... متوفرة سهلة ... بدلا من المهانة والذل علي البطاقات التمونية التي لا يحملها الكثير منا .. والتي تصرف لنا في النهاية كيلوات معدودة محدودة لا تكفي أياما .. وبأسعار رغم رخصها إلا أنها لا نتحملها ..؟؟<br />يا سيادة الرئيس... نحن نختنق . نحن نموت ...<br />احذر يا سيادة الرئيس ثورة الجياع ... فهي ثورة لن ينفع معها أمن مركزي أو غيره.. فهي ستقتلع اليابس والأخضر .. فإن النفوس إذا جاعت بطونها عميت ..وما أدراك ما الجوع يا سيادة الرئيس.. فما زال الجوع كافرا حتى الآن ..؟؟؟<br />انتهت الرسالة وأتمنى أن تجد طريقها إلى رئاسة الجمهورية .. فهي فعلا 'عاجلة' ولا تحتمل التأجيل."
archived = "2008-04-15"
