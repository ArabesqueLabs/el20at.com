[[comments]]
order = 3
subject = "شكرا جزيلا لك أختي الفاضلة بنت سوريا , وأنا وراك و"
author = "عاشق فلسطين"
posted = "2008-04-18"
text = "السلام عليكم ورحمة الله وبركاته , شكرا جزيلا لك أختي بنت سوريا , أنا بعرف السوريين كتير مناح ومحترمين جدا , وهم كإخوتنا<br />لا فرق بيننا وبينهم في العادات والتقاليد , ولكن يا أختي بعيد عنك كتير وإنتي بتحكي مع هالحيوان الجاهل المتخلف المنافق الكلب محمد نواف الحمد الله , أختي هدا كلب منافق سافل منحط شراري تافه حقير مرتزقة ابن كلب همجي بجمي خرى , أختي بس الله يرضى عليكي اكتب في البحث : ارفع راسك إنتا فلسطيني , يعني شوفي حتى الموضوع بتكلم عن فلسطين بشكل طبيعي كتير ولا جاب سيرة الأردن , شوية إلا الأردنيين قاموا يسبوا ويلعنوا ويشتموا وكل شي يا أختي , مع إنو الموضوع كتير بعيد عن الأردن ولا غيرو , كل الموضوع بحكي عن أيام فلسطين وذكريات فلسطين , بس عشان تعرفي بأنهم هدول الهمج البجم الأردنيين الأصل أولاد الحرام البجم فعلا بمعنى الكلمة , يا أختي لولا الله ثم الفلسطينيين موجودين هلأ بالأردن , ولا كان الأردن هي أخزى دولة على وش الأرض , ولليوم يا أختي وأنا عايش بالأردن , وأحمل الجواز الأردني , وإني لليوم يا أختي بقول يا ريت ما أخدت هدا الجواز النجس , أختي وبلا شك لليوم العنصرية اللي في الأردن رح تضل لقيام الساعة , وهي التفريق والتمييز بين الأردني الأصل وبين الأردني من أصل فلسطيني , وكذب من قال لك بأن الملك عبد الله قال : الأردن + فلسطين = شعب واحد ....<br />أختي الحبيبة بنت سوريا : تذكري مدبحة أيلول الأسود التي قام بها الكلب حسين الله لا يرحمو البعيد في قبرو وقتل خلالها<br />حوالي 44 ألف فلسطيني , وشربهم يا أختي من الشخ وأكلهم الخرى الله يعزك وكان حايط الضفة الغربية في جحيم والله يأ اختي , يعني اليهود اللي هما يهود ما عملوش فينا هيك , لكن يا أختي بحكيلك ياها بكل صراحة , وإنتي يمكن بتعرفي بل وأعرف مني<br />بأن أهل الأردن 98% من أهل البادية , وأهل البادية كما وصفهم الله تعالى بقوله : {الأعراب أشد كفرا ونفاقا} والأعراب هم يا أختي هم البدو أهل البادية , فلا تستغربي من هذا الحقير وغيره من الأردنيين السفلة بأن يقولوا لك مثل هذا الكلام , فهم يتكلمون بمعسول الكلام , وهم أنفق ناس على وجه الأرض , ونحن إلى يومنا هذا يا أختي نقول لك بأن العنصرية بالأردن في التمييز بيننا وبين الأردنيين , باقية لقيام الساعة , ولا تنسي يا أختي بأن الفلسطينيين هم عصب الأردن باقتصادها وجيشها<br />وأمنها وتعليمها الجامعي خاصة , فجامعات الأردن الآن من أقوى جامعات العالم , لماذا ؟ لأن كل العاملين والمدرسين ومدراء<br />الجامعات كلهم فلسطينيين يا أختي والله بلا استثناء وهذا ليس بكذب والله يا أختي , والكل بعرف هدا الإشي , فيا أختي هدا كذاب كبير ولا تصدقيه بأي كلمة , هدا منافق سافل خسيس ووقح لآخر الحدود , وشكرا كتير إلك ولكل الشعب السوري<br />الشقيق الكريم الطيب أعزهم الله وبارك لهم وفيهم وفي بلادهم وحماهم من شر كل حاقد ومكروه وبارك الله فيكي يا أختي ...<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ::: ملاحظة خاصة ::: ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />يا محمد نواف الحمد الله , يا شيخ والله لأشرشحك وأخلي الكل يتف عليك , كفاية إنك أصلا متفوف عليك ومدعوس عليك بالجزمة وعلى كل الأردنيين تبعونك يا بن الكلب , لسة والله لأخلي اللي بسوى واللي ما بسواش يدعس على رقبتك غصبا عنك يا كلب<br />يا واطي , ولأفضح بعرضك وشرفك يا شراري , واحد بدوي منافق ,<br />البدو اندال شُعث غبر الوجوه ان أمنتهم خانوا<br />وان شبهتهم بالكلب صاح الكلب لا بشعرة في ذيلي بألف ألف ترباني<br />:::: عاشت فلسطين : من الفاء للنون , ومن النهر للبحر ::::"
