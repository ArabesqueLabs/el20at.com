subject = "أخي lion king"
author = "محمد نواف"
posted = "2009-03-23"
text = "بداية أشكرك على الإطراء الجميل الذي ينم على انك أصيل ومعندك طيب وثمين، ولكن اخي بكل مكان توجد العنصرية وليس فقط في الاردن، وللأسف الشديد هذه هي السمة السائدة والشائعة بين البلدان العربي ولا سيما بلاد الشام على وجه الخصوص ، لكي أكون معك صريحاً وواضحاً اعترف واقر ان هناك عنصرية في الاردن، وكذلك في فلسطين وسوريا .. وهلم جرى .<br />ولك مني كل الإحترام والتقدير، وإن شاء الله ما بتحس بغربة عن بلدك، لأنو بالنهاية المصير واحد، والقلب واحد، والإيد وحده بعون الله، وسوريا اختنا وحبيتنا، وانا بصراحة ما بجامل، وهاي حقيقة، والكل بعرفها..<br />والسام عليكم ورحمة الله وبركاته //"
