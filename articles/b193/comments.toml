order = 9
subject = "تجربة حقيقية"
author = "lion king"
posted = "2009-03-22"
text = "اوجه كلامي اولا الى الأخت بنت سوريا<br />انا شاب من مدينة حلب اطررت للسفر دون ان اعرف اي شخص في الأردن منذ سنة ونصف وكان احد اسباب سفري هو خدمة العلم الموجودة لدينا وبعض المشاكل العائلية عندما قررت السفر الى الأردن وانا ا اعرف اي شخص او مكان فيها<br />ولكني اخترتها لأنها بلد قريب ولا تحتاج الى فيزا وبعد مكوثي في الفندق لمدة شهر تعرفت على الكثير من الناس الطيبين و وقد استقبلوني استقبالا لم اشهده من قبل مع انهم لا يعرفونني بفترة قصيرة اصبح لدي عدد كبير من المعارف والأصحاب ان الشعب الأردني شعب كريم وطيب وهم يحترمون السوريين جدا والسوري هنا له مكانته مقارنة مع الجنسيات الأخرى<br />هذا الكلام بعد تجربة مع احترامي للشرطة السورية لكن صادفني موقف هنا في الأردن لن اجد مثله في العالم حدثت مشكلة بيني وبين مجموعة من الشباب هنا وبمجرد ان قدمت شكوى حتى القي القبض عليهم وبدأو يترجوني من اجل ان اسامحهم مع اني لا املك اقامة او تصريح وجدت الشرطة متعاطفة معي لدرجة كبيرة<br />سؤال يطرح نفسه ماذا كان سيحصل لو ان هذه المشكلة في سوريا ستكون المعادلة للي بيدفع اكتر بالمخفر او اللي عندو واسطة ان الشعب الأردني شعب طيب وذو اخلاق عالية صدقيني على الأقل عندما تريدين الخروج من سوريا الى الأردن يجب ان تنتظري ساعتين على الأقل حتى يختم جوازك في الحدود السورية اما الحدود الأردنية فلن يستغرق الموضوع الا عدة دقائق ان بلدنا اجمل واروع ولكن اتمنى من الله ان يصلح الفساد الذي فيها وستكون اروع بلاد الدنيا<br />الأخ محمد نواف<br />انا معك بأن الحكومة الأردنية تحرص على امن السوريين في بلدها<br />ولكن لا احد يستطيع ان ينكر العنصرية الموجودة في الأردن ضد الفلسطينين واتمنى ان تغير مبدأك بالنسبة لشعار الأردن اولا وليكن شعارك كلنا الأردن لأن هذا الشعار يزرع المحبة في قلوب كل الناس ونحن اخوة ان شاء الله<br />اتمنى ان لا يجرح كلامي احد وشكرا هذا رأيي الخاص"
archived = "2010-03-14"
