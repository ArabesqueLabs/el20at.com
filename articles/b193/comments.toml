order = 0
subject = "هذا ليس من شيم وعادات وتقاليد الأردنيون ؟!!"
author = "محمد نواف الحمدالله .."
posted = "2007-12-10"
text = "إن المملكة الأردنية الهاشمية حريصة كل الحرص بأن ينعم العمالة الوافدة (( السوريين )) بكل سعادة وطمأنينة وأمان . فالحكومة الأردنية بعيدة كل البعد عن اضطهاد وتهميش وتشويه وأكل حقوق العمالة السورية .. لا وألف لا .. بالعكس . إن الحكومة الأردنية توفر لهم سبل الراحة والأمان .. لكي ينعمو بسعادة وهنائه في ظل الراية الهاشمية .. فهم في بلدهم الثاني (( الأردن ))، وأي إنسان حاول أن يخلق فوضى أو بلبلة .. أو أن يثير الشكوك بين الطرفين لا لشيءٍ ما يذكر على الإطلاق . بل هدفه بأن يخلق التمييز العنصري وإثارة الفتن والنعرات بين الطرفين (( الأردني والسوري )) .<br />ولكن الإنسان الواعي المتقف لايستجيب لهذه الأمور التافه الحقيرة .. التي مبتغاها سخيف وتافه لأبعد الحدود .<br />أنننا نحب إخواننا السوريين بكل شفافية وصدق ونزاهة .. ولنا بهم صلات عديدة وممتدة الأوصال منذ القدم ..<br />فسوريا بلد رائع . جميل . يتمتع بمناخ معتدل ونظر . وصفاء الجو نقاوته . والهواء العليل . والشمس الحارقة . كل هذا بكف والكف الآخر هو شعبها المتميز بالأخلاق والأدب .. والكرم والعطاء ..<br />بالنهاية .. الأردن أولاً .. ويبقى اسم الأردن مرفوعاً .. ويبقى الأردن اسم محفور في قلوبنا ولن ننساه أبدا ماحيينا .. وتحية إكبار وإجلال لقائد هذا البلد ملك الممكلة الأردنية الهاشمية، جلالة الملك المعظم / عبدالله الثاني ابن حسين ابن طلال _ حفظه الله ورعاه _ وجعله ذخراً وسنداً لهذا البلد الكبير بشعبه وناسه الكرماء .. وشكراًًَ ،،،"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "أحقر شعب الأردن عارف ليه يا محمد نواف الحمدلله"
author = "بنت سوريا"
posted = "2008-02-06"
text = "أولا كذب كل الكذب إنه الحكومة الأردنية توفر للعمال السوريين التنعم بالعيش هناك , ولو سمحت يا محمد نواف الحمدلله طبعا أنا<br />ما بصدأ كل كلمة حكيتها هلأ , هي إنك عم بتمدح بسوريا , طبعا إحنا ما بنحكم على الأردنيين كلهم , فيهم هيك وفيهم هيك , لكن للأسف أكترهم سفلة , وهلأ لما بيجوا عنا بسوريا , بغتصبوا وبسرقوا وبنشلوا , فعشان هيك الحكومة السورية الحكيمة اضطرت إلى حبسهم وسجنهم لكف شرهم عن الناس , وهدا الكلام موثوق ومعروف طبعا , سواءأ كان أردني أصل أو من أصل فلسطيني , لكن بصراحة إحنا أكتر أردنيين بخشوا علينا بكونوا أردنيين أصل , لأنه إحنا عارفين مين هما الفلسطينيين ؟ فلسطين شقيق وحبيب ومهما كان إحنا الحمد لله معيشينهم متنعمين , إزا هلأ الفلسطينيين اللي عايشين بالأردن بتعرضوا للتعذيب والتنكيل , إحنا الحمد لله موفرين إلهم الراحة والأمان وأعطيناهم الجوازات السورية , مش بس إنتوا , هده وجهة نظري يا محمد نواف الحمدالله وتحياتي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "هذه وجه نظرك يابنت سوريا .. وأنا أحترمها شديد الإح"
author = "محمد نواف الحمدالله ..."
posted = "2008-02-11"
text = "أولاً بنت سوريا أنتي حرة في وجهة نظرك وأنا أحترمها وأقدرها ... ولكل إنسان كامل الحق ومطلق الحرية بأن يعبر عن رأية وعن وجهة نظره بشتى مجالات الحياة المختلفة والعديدة والكثيرة .. الخ<br />ثانياً أنتي أثبت لي بأن السوريين أفضل من الأردنيين .. كلا، ومن قال لك هذا الكلام .. السوريين ليسوا بأفضل حالٍ من الأدرنيين ذاتهم .. فمن الممكن بأن تري سوري جاهل .. غبي .. أحمق لايفقه شيئاً بالحياة .. اللهم لاشماته .. وكذلك قد ترين الأمر ذاته بالنسبة للأردني .. ومن ثم أي كلام يقبله المجنون قبل العاقل .. بأن سوريا قد أعطت جوازات سورية للفلسطينيين المهجريين من بلدهم ( اللاجئيين )، فجميع الفلسطينيين في سوريا يحملون الوثائق المتعلقة بهم ( وثيقة سفر للأجئيين الفلسطينيين ) .. فمن سابع المستحيلات .. لا بل، في الأحلام الوردية بأن الحكومة السورية تعطي للفلسطينيين جوازت سورية .. من الله لله !! وبدون أي مقابل !! وهكذا !! أم لإن السوريون يحبون الشعب الفلسطيني فأكرموهم بالجوازات والحياة السعيدة الرغيدة الهائنة !! أم ماذا بالضبط ؟!<br />.. أنا متفق معكِ تمام الإتفاق .. بأن السوريين قد وفروا لهم حياة كريمة وسعيدة .. ولكن ليس بالمجان !!! استفسري عن الأمر وسوف تجدين الحقيقة بلا شك ؟!<br />.. وأنا متفق معكِ بأن الفلسطينيين قد لاقوا أحسن وأفضل معاملة عاملتهم إياها الحكومة السورية وشعبها الطيب .. ولكن إن عرف السبب بطلُ العجب ؟!<br />.. وأنا متفق معكِ بأن الفلسطيني لايشعر بالغربة والشقاء بعيداً عن بلده الأم ( فلسطين * )، فهو في بلده تماماً ( سوريا * ) .. هذا البلد الذي لطالما أعز وأكرم الفلسطينيين . وهذا شئ معروف ومؤكد ... ولكن !!!<br />ألم تسألني نفسكِ يوماً ما .. كيف هي مساكن الفلسطنيين في سوريا ؟؟؟<br />ألم تسألي نفسكِ يوماً ما .. كيف هم متنعمين بسوريا، وهم لايملكون لاجوازات .. ولا وثائق .. ولاحتى ( قوت يومهم من الطعام والشراب والنوم أو حتى السكن * )، وبالكاد حتى يجدون الطعام ويعثرون عليه .. هذا إن صادفتهم اياماً لايرون من الطعام شيئاً على الإطلاق .. فأين هي الجوازات السورية التي أصدرتها الحكومة السورية ( الكاذبة * ) بشأن هذه الفئة المهمشة من ( اللاجئين الفلسطينيين )، وأين هي الوعود الرائعة الجملية .. والشعارات الرنانة .. والأقوال المعسولة .. والكلام الطيب الكريم .. أين هي ؟!<br />ألم تسألي نفسكِ يوماً ما .. كيف يعامل السوريون الفلسطينيين؟؟ .. هل يعاملونهم بشكل لائق ومحترم، أم يمسحون بكرامتهم وشرفهم الأرض ؟!<br />ألم تسألي نفسك ِ بوماً ما .. بأن هؤلاء سوف يرجعون إلى بلدهم في يوم من الأيام ( وهو آتٍ لا محالة * )، فهم لايريدون منكِ أو من الحكومة السورية أو من الشعب السوري الطيب جمليةٍ أو عرفاناً أو تقديراً منك أنت . يكفيه فخراً واعتزازاً بأنه فلسطيني لا، ولن ، ولم يتخلى ع قضيته العادلة ؟!<br />ألم تسألي نفسكِ يوماً ما .. بان الفسلطينيين أينما وجدوا فهم يعمرون الأرض بسواعدهم الباسلة .. فمن الذي عمر وبنى سوريا غير الفلسطينيين أنفسهم !!! ولاننسى دور أبناء البد ( السوريين أنفسهم * ) . ولكن كان للفلسطينيين دوراً كبيراً وهاماً، وعاملاً أساسياً ورئيسياً في نهضة وتقدم وازدهار سوريا ؟!<br />ألم تشكري الرب الذي وفر لكِ ولغيرك نعمة الإستقرار والأمن والأمان والطمأنينة في بلدك، في حين أن غير يعاني ويعاني ويعاني _ ومازال _ ( الفلسطينيين * ) ؟!<br />إن أفضل وأحسن بلد استقبل الفسلطينيين بكل احترام وتقدير .. ومستوى عالٍ من الآداب والأخلاق .. وبعيداً عن التمييز العنصري .. هم بلا أدنى شك أو لبس بالموضوع .......................................... الأردن<br />فأفضال الأردن على الفلسطنيين كثيرة وعديدة فلا حاجة لذكر ماعملته الحكومة الأردنية وشعبها الطيب بالفلسطينيين ..<br />ويكفيهم فخرأ بإن أغلبيتهم الذين سكنوا وعاشوا بالأردن قد كرموا بالجواز الأردني .. وغيرها الكثير من الإمتيازات .. وتقليد المناصب الرفيعة والعالية في الأردن .. فهذا هو الفرق الجوهري الذي يعانيه الفلسطيني اللأجئ في سوريا والأردن ؟؟؟<br />هناك فرق كبير جداً ........................................................................................ فرق السماء والارض !!!"
archived = "2010-03-14"
