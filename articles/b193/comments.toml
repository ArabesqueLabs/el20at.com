subject = "ومن قال بأن السوريين متنعمين بعيشهم بالاردن؟؟؟"
author = "ابن سوريا الاصيلة"
posted = "2008-07-21"
text = "اولا بدي اوجه شكري الجزيل لبنت سوريا اللي كل كلمي حكتها صحيحة ومو غلط وفعلا انا لما بنزل الاردن بصراحة حتى عند الحدود ما بعاملوني باحترام وفعلا فيه ناس من العمالة السوريين بئربولي رجعو كلهم مضطهدين وفعلا عنوان الموضوع مو غلط وبوجه شكري لعاشق فلسطين لانو برض ما غلط بكلمة وحده وبرضوا بنفس الوقت اكرمنا الفلسطينيين اللي عنا بالوثائق السورية اللي هي تعتبر جواز حاليا ويا اردني اسال اي فلسطيني عايش بسوريا وشوف شو بحكي الك وبصراحة اروع ناس واشرف ناس بالكون كلو همي الفلسطينيه مش بس انتوا برضوا ...... وشكرا"
