text = "السلام عليكم ورحمة الله وبركاته , اختي بنت سوريا : على فكرة أقلك ليه الأردنيين الأصل بروحوا لسوريا , لأنهم يا أختي عشان<br />الفلسطينيات عنا بالأردن ما بعطوه وجه يعاكسهم ويحبهم , جايين عندكوا عشان يعملوا اللي براسهم , بس عشان يا أختي<br />أثبتلك إنهم شعب جعان ووسخ وحقير ووااااااااااااطي , وشكرا كتير إلك يا أختي , مش جاي على بالي أعلق , لكن تذكرت كم<br />هالكلمتين هده أحكيها , يلا سلااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااام"
