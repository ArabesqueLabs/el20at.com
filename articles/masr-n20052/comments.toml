[[comments]]
order = 0
subject = "اهانة للنظام الفاشل وضربة جامدة على قفاة الطويل ولا علاقة للشعب المصرى بشاليط او ام شاليط"
text = "محدش يتمحك ويتلزق بالشعب المصرى<br />دى ضربة على قفا اللى اختاروا لنفسهم وضع الوسطاء الضعفاء<br />الشعب المصرى زمان قال خللى السلاح صاحى<br />لانك لما تكون اقتصادك قوى وسلاحك قوى هيبقى لك احترامك<br />انما تبيع بلادك وتبقى شحات وتقول انا وانا فليس لك غير الضرب على القفا دو الجلد السميك"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083102/http://masr.20at.com:80/newArticle.php?sid=20052"

[[comments]]
