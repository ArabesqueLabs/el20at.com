subject = "تقولش روزاليوسف"
author = "أيمن"
text = "أنا عمرى ما شفت مقال فى الموقع ده بيتعمد الاستفزاز غير المبرر بالشكل ده ؟ إيه علاقة الخبر بعنوانه"
archived = "2009-02-23"
