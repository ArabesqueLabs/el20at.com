[[comments]]
order = 3
subject = "ما لم يقلة اللواء جلعاد"
text = "اللواء جلعاد راجل فاهم وعارف حكومتة بتخطط لاية<br />بعد ان وصل النظام المصرى الى اسوأ اوضاعة المتردية اقتصاديا وسياسيا واصبح يعيش على التنفس الصناعى اقتصاديا<br />ان لاسرائيل ان تجر شكل النظام وتستعدية وتضربة على قفاة<br />اسرائيل تريد ان تصل الى احتلال جزء من سيناء الى خط الممرات مثلا وتفرغ غزة من سكانها بنقلهم الى سيناء<br />والاغبياء الذين صدقوا معاهدة السلام وباعوا البلد ودمروا اقتصادها وقوتها ان يدفعوا الثمن<br />على النظام المصرى ان يقبل بقوات على ارضة لحماية حدود اسرائيل<br />على النظام المصرى ان يطيع حرفيا اى اشارة من اسرائيل<br />ايام سودة فى الانتظار<br />ومعندناش حاجة فى ايدينا نعملها<br />الا انتظار رحمة اللة"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083102/http://masr.20at.com:80/newArticle.php?sid=20052"

[[comments]]
order = 4
subject = "بنى (أسرائيل)شعب ملعون الى يوم (الدين)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "كيف تتوقعون من شعب حكم علية السيد/المسيح لة المجد دائما بالتفرقة و اللعنة و التشتت؟<br />(فاقد الشئى لا يعطية)<br />من هؤلاء الحثالة التى تدب فى الارض خرابا ان يستطيعوا اهانة شعب مصر العظيم التى باركها اللة و بارك شعبها منذ بداية الخليقة عندما قال و كتب فى الكتاب المقدس(مبارك شعبى مصر)<br />مبارك الارض و الوطن<br />فماذا قال السيد /المسيح عن ابناء شعب أسرائيل؟<br />(ملعونين الى يوم الدين)<br />هذا هو الفرق بين (مصر) المباركة<br />و شعب بنى (أسرائيل) الملعونة"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083102/http://masr.20at.com:80/newArticle.php?sid=20052"

[[comments]]
order = 5
subject = "يا زخارى - طيب ما هو المسيح وامة يهود من بنى اسرائيل"
text = "احنا هنضحك على بعض<br />هو المسيح مش يهودى وهو يقول انما ارسلت لهداية خرفان بنى اسرائيل الضالة<br />انت بتضحك علينا<br />روح يا ابنى شوف هم قالوا اية امبارح على القناة العاشرة فى التليفزيون الاسرائيلى عن المسيح التخين اللى مشى على مياة نهر الاردن وامة اللى حملت سفاحا وسنها 15 سنة<br />دى كلام قرايبك اليهود اللى منهم بولس بتاع المسيحية فى مصر واللى انت بتقرأ كتاب العهد القديم بتاعهم كل يوم"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083102/http://masr.20at.com:80/newArticle.php?sid=20052"

[[comments]]
order = 6
subject = "الى المعلق السابق"
author = "مش ححبك"
text = "الاخ المعلق السابق<br />يجب عليك قراءة كتاب في قصص الانبياء في القران لان مقولتك ان المسيح من بني اسرائيل تدل على ان معلوماتك صفر في هذا المجال<br />اشتري كتاب عن قصص الانبياء في القران<br />وكلك الانبياء بعثت لاقوامها خاصة<br />يعني سيدنا نوح بعث لقومه ودعا عليهم ولعنهم<br />وقس على ذلك كل الانبياء<br />وسيدنا المسيح بعث الى قومه بني اسرائيل ولكن لم يؤمنوا به فلعنهم<br />والامر حيتضح ليك اكثر لما تقرأ كتاب عن قصص الانبياء في القران<br />او حتى على النت اكتب على محرر بحث جوجل قسس الانبياء في القران واقرأ<br />سلام يا صاحبي"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083102/http://masr.20at.com:80/newArticle.php?sid=20052"
