[[comments]]
order = 0
subject = "يا مولانا - انت كنت فين من زمان - بعد الحرب ما خلصت والمولد انفض - والمقاومة صمدت ودفعت دم غالى"
text = "كنت فين من 3 اسابيع يا عم الشيخ<br />سمعت ان اسرائيل هتوقف الحرب النهاردة فخبطت بقين كلام<br />كنت ساكت لية يوم اسرائيل ما عملت الغارة الاولى<br />الكل جاى جاى يتكلم بعد توقف سقوط الصواريخ والقنابل<br />ما تشوف واحد مصاب وتقف تتصور جنبة وتطلع فى التليفزيون<br />سلام يا عم الشيخ"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203852/http://masr.20at.com:80/newArticle.php?sid=19327"

