[[comments]]
order = 3
subject = "اذا مصر قالت نعم ايدوها"
author = "ابومحسن غربة 27 سنه"
text = "اذا مصر قالت نعم ايدوها<br />وان اعلنت لاءها فاسمعوها<br />ومصر منزهة في العرب<br />ومصر العلا وضمير العرب<br />الى بيتها لجأ الانبياء<br />وفرعون معجزة في البناء<br />وأوصى الاله بها العالمين<br />وقال ادخلوا ارضها امنين<br />حمى الله نيلها من كل عاد<br />وجنب شعبها غزو الطعاه<br />فيا رب بارك في مصر الحبيبة<br />وكن معها فيالليالي العصيبة"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203852/http://masr.20at.com:80/newArticle.php?sid=19327"

[[comments]]
order = 4
subject = "لا يافضيلة المفتى"
author = "حسين كامل"
text = "لا ياقضيلة المفتى لن اخرج الذكاة الا لابناء بلدى من المصريين الفقراء !! الفلسطنيين سوف تنهمر عليهم الاموال كالعادة وسوف يبنون افخم الشقق والفلل والعمارات !! الم تشاهد المستوى الجيد من العمارات والفلل داخل غزة والتى بنيت عن طريق المعونة والدعم بينما شعبنا المصرى يعيش قى المقابر !! يافضيلة المفتى ومع احترامى الشديد لك لا تكن مثل القرع يمد لبره ."
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203852/http://masr.20at.com:80/newArticle.php?sid=19327"

[[comments]]
order = 5
subject = "الى ابو محسن 26 سنة تسول فى دول الخليج ---- اذا رقصت مصر عشرة بلدى فحزموها"
text = "اذا رقصت مصر فى شارع الهرم فحزموها وطبلوا لها<br />انت فى الغربة لية يا كس امك<br />بتشحت<br />وتتسول<br />وتنضرب بالجزمة هناك وتقبل<br />اية اللى وداك هناك غير الجوع<br />اتكلم عن بلدك الشحاتة والتسول<br />مصر هتقول اية - غير العمالة والارتماء فى احضان امريكا واسرائيل"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203852/http://masr.20at.com:80/newArticle.php?sid=19327"
