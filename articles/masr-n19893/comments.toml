subject = "\\"
author = "مش ححبك"
posted = "2009-02-10"
text = "مسألة بسيطة خالص<br />تقنين خروج النساء للشارع<br />يعني مثلا المرأة تخرج صباحا فقط وممنوع بعد المغرب خروج المرأة بدون محرم<br />ان يكون في المواصلات عربيات خاصة للنساء فقط يعني مواصلات للنسائ فقط وتكون فيها حراسة<br />تقنين لبس المرأة يعني ممنوع المرأة تخرج الا بلبس معين ويشترط انه لا يثير الشهوة<br />واشياء كتيرة ممكن تتقنن بالنسبة للمراة لانها هي سبب التحرش"
archived = "2009-02-14"
capture_url = "https://web.archive.org/web/20090214124811/http://masr.20at.com:80/newArticle.php?sid=19893"

[[comments]]
order = 1
subject = "ما اسهل وسائل القضاء على(التحرش الجنسى)فى مصر"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-02-11"
text = "الحل بسيط جدا<br />1_القيام ب(خصى)كل من يتحرش باى انثى ايا كانت حتى و لو كانت عاهرة؟<br />2-نشر اسم و عمل و مكان عمل و اقامة كل من يتحرش جنسيا بالمراة مع و ضع صورتة على اغلفة الجرائد و المجلات و شاشات التليفزيون لمدة اسبوع متواصل و على نفقتة الشخصية؟<br />3_نشر اسماء اقارب كل من يتحرش جنسيا باى انثى ايا كانت و هؤلاء الاقارب جميعا حتة الدرجة الرابعة ؟مع صورهم و عناوين سكنهم و عملهم ايضا؟<br />و اتحدى كل من سوف يقول انة سوف توجد اى صور من صور التحرش الجنسى باى امراءة فى مصر؟<br />لنجرب و كلى ثقة من ان التجربة خير برهان"
archived = "2009-02-14"
capture_url = "https://web.archive.org/web/20090214124811/http://masr.20at.com:80/newArticle.php?sid=19893"
