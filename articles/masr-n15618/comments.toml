[[comments]]
order = 1
subject = "الزيادة مش علشان 30 % دى علشان زيادة قوات الامن ال"
author = "مسطول"
posted = "2008-05-06"
text = "الحكومة نزلت قوات امن مركزى حوالى 750 الف عسكرى باللوريات والمدرعات وقنابل الدخان<br />ويمكن عايزة تزود العدد للضعف<br />حيث انة فى المحلة بس كان فيها 100 الف عسكرى<br />ولو الحكومة عايزة توفر 9 مليار تسرح عساكر الامن المركزى زى ما سرحت الجيش واصبح جيش رمزى او جيش المحمل<br />الحكومة كانت ممكن ترفع سعر الغاز المصدر لاسرائيل ببلاش لدعم المواطن الاسرائيلى<br />انما نخفض للمواطن الاسرائيلى الغاز ونرفع الاسعار على المواطن المصرى على حسب فتاوى البدرى والطنطاوى<br />والناس فى راييى تستحق الضرب بالصرم<br />اعمل فيهم ياحسنى اللى انت عايز تعملة<br />دا شعب جبان<br />بيخاف ما يختشيش<br />انا مع الحكومة<br />خليها تعمل فيكم اللى هى عايزاة"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113935/http://masr.20at.com:80/newArticle.php?sid=15618"

[[comments]]
order = 2
subject = "هس ياكلاب"
author = "ايمن امام"
posted = "2008-05-06"
text = "هس ياكلاب- اللى مش عاجبه - يعمل مظاهره- وهاانفخه دا انا عندى عساكر لابتفهم فى الطور ولا الطحين- وعندى قضاه طرشانين - وعندى صحافه ميه ميه فشر الغزيه- وعندى ابو عمه حمرا طبعا عارفينه- يحرم المظاهره ويحرم الاضراب ويحرم تاخد نفسك - ولما يتزنق- عيب ما بيقلعش - يدور له على اى حجه من اى حته- وعندى بلطجيه ميه ميه- يزوروا ويضربوا ويقطعو هدومك وهدوم اى صحفيه- ياشعب ياهفيه - يازباله يارميه- اى واحد عامل راجل يرفع صوته - البنزين ها يغلى عشان العلاوه- عاجبكم ولا لآ - انا سامع صوت كلب بيقول ماتزود الضرائب على اللى واكلينها ولعه الجماعه بتوع الاستثمار- اخرس ياكلب منك له له ل له - دول اسيادك واسياد اسيادك- دول شعبى وحبايبى ورجالتى- يعملو اللى يعملوه- يأكلوك اكل فاسد براحتهم يدوك دوا فاسد برضه براحتهم يسرقوا هدومك وحياتك برضه براحتهم يغلو اسعار براحتهم- لو فيكو راجل يقف ويقول انا راجل وانا هااوضبه عصيان فى الشرج والكهربا تظبط مخه والفلكه تفوقه والنيابه تحبسه وابو عمه حمرا يكفره والغزيه تشردله تألف له حكايات وقصص وتطلعه مثقف زى اللى بالى بالكو - هس ياكلاب انا زهقت منكو - اف - انا رايح كفر الشيخ - افرفش شويه وأعد مع اصحابى واتونس بيهم - وانتو كفايه عليكو كده- دش يمكن يفوقكو- كل واحد فيكو يعرف بيكلم مين انا صاحب الضربه اللى هيه ميه ميه - اه نسيت قبل ماامشى اقول لكو- انا قررت اخصخص شويه حاجات- هاهاها- ماتخافوش- مش هاأخصخص اللى بالى بالكو خلوها تنفعكو- ماهى كده كده بقت برش- هااسيبكو النهارده - لكن بكره ورحمه شامير هاانكد عليكو تانى بس مش لاقى حاجه ارفعها- مارأيكم دام ذلكم- ياكلاب= ايمن امام"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113935/http://masr.20at.com:80/newArticle.php?sid=15618"

