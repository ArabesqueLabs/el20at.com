text = "إحترامي .. للحرامي ii!!<br />صاحب المجد العصامي ..<br />صبر مع حنكة وحيطة ..<br />وابتدا بسرقة بسيطة ..<br />وبعدها سرقة بسيطة ii..<br />وبعدها تَعدى محيطه ..<br />وصار في الصف الأمامي .. !<br />احترامي .. للحرامي .. ii!!<br />احترامي .. للحرامي ..<br />صاحب المجد العصامي ..<br />صاحب النفس العفيفة ii..<br />صاحب اليد النظيفة ..<br />جاب هالثروة المخيفة ii..<br />من معاشه في الوظيفة ii..<br />وصار في الصف الأمامي ..<br />احترامي .. للحرامي .. ii!!<br />احترامي .. للحرامي ..<br />صاحب المجد العصامي..<br />يولي تطبيق النظام ..<br />أولوية واهتمام ..<br />ما يقرب للحرام ii..<br />إلا في جنح الظلام ..<br />صار في الصف iiالأمامي<br />احترامي .. للحرامي .. ii!!<br />احترامي .. للحرامي ..<br />صاحب المجد العصامي ..<br />يسرق بهمة دؤوبة ..<br />يكدح ويملي جيوبه ii..<br />يعرق ويرجي المثوبة ..<br />ما يخاف من العقوبة ii..<br />صار في الصف الأمامي ii..<br />احترامي .. للحرامي .. ii!!<br />احترامي .. للحرامي ..<br />صاحب المجد العصامي ..<br />صار يحكي في الفضا ii..<br />عن نزاهة ما مضى ..<br />وكيف آمن بالقضا ..<br />وغير حقه ما ارتضى ..<br />صار في الصف الأمامي ii..<br />احترامي .. للحرامي ..<br />احترامي للنكوص ..<br />عن قوانين ونصوص ii..<br />احترامي للفساد ii..<br />وأكل أموال العباد ii..<br />والجشع والازدياد ii..<br />والتحول في البلاد ..<br />من عمومي للخصوص ..<br />احترامي للصوص .. ii!!"
