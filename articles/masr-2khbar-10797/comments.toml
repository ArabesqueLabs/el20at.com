subject = "نصيحة لوزير الداخلية والقائمين على الحكومة المصرية"
author = "مش خايف"
posted = "2008-12-27"
text = "مكافحة التطرف والخروج عن النظام ليس اختصاص وزارة الداخلية<br />وزارة الداخلية دي للخارجين عن القانون يعني الحراميه والمجرمين<br />انا المتدينين اذا خرجوا على النظام ليس اختصاص وزارة الداخلية الفاشلة<br />وانا اختصاص الازهر والمجلس الاعلى للشئون الاسلامية ودار الافتاء المصرية ووزارة الاوقاف والشئون الاسلامية هي دي الجهات المعنية بمحافكة التطرف<br />مكافحة التطرف عن طريق وزارة الداخلية غلط يا حمار انت وهو لانه زود الطين بله<br />حكومة رئيسها واعضائها حمير دا علاوة على الحمار الاكبر"
archived = "2010-03-14"
