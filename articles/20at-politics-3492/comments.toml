subject = "حق ايه"
author = "ديمة"
posted = "2007-03-27"
text = "ماشى يا محمد، معاك ان احنا نوافق على حدود فلسطين 67 كحل سياسى ونتعامل مع ناس زيها بتدافع عن الوضع ده لكن بجد ولازم من غير ما نقول انها صهيونية بتناصر فلسطين لان معنى انها صهيونية انها جت مع اهلها تسرق الارض وحتى لو مش عارفين نحافظ على جقنا ما ينفعش نتنازل عنه تاريخيا او ادبيا، وفى كتير مش عاجبهم الكلام ده وبيقولوا بلا ثوابت بلا تاريخ، هم احرار وانا اكثر حرية"
