text = "ارجوا من السادة الطارحين والمصوتين على هذا الموضوع أن يعلموا أن هذه الفكرة إنما هي نابعة من غريزة الإنسان الحيوانية حيث لا توجد صداقة -بمعنى الصداقة - بين الولد والبنت البالغين،إلا على ألسن المنادين بهذه الفكرة طبعا لتحقيق أهداف عديدة أغلب الشباب لا يعلمها أو لايريد أن يعلمها والله سبحانه وتعالى يقول في كتابه العزيز (ولا تقربوا الزنا) صدق الله العظيم أي لاتقربوا أي طريق نهايته زنا وهو من الكبائر العظيمة التي يهتز لها عرش الرحمن لما فيه من خراب أكيد يقول الرسول(ص) بشروا الزاني بخراب بيته صدق رسول الله صلى الله عليه وسلم وده الكلام المباشر الذي يجب أن نواجه به أنفسنا ولا ننسى تقاليدنا الإسلامية والعربية والفطرية ."
