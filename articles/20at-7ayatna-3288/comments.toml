subject = "مفيش حاجة إسمها......"
author = "drsalah-hanie"
posted = "2007-02-20"
text = "أنا من الذين صوتوا ب\"إيه قلة الادب دى\".<br />وأنا من الرافضين تماما لمبدأ أن يكون للشاب أو البنت مايسمى بالصديقة أو الصديق.<br />لأن لكل إنسان فى هذا الكون مرجعية يأخذ منها مبادؤه وافكاره فالغرب يستقى مرجعيته من الثقافة الأمريكية التى تعتمد اساسا على العرى والاستمتاع بغض النظر عن مشروعية ذلك.<br />أما المسلمون فنحن نستقى افكارنا ومبادئنا من الإسلام وليس من الغرب ولكن للأسف هناك بعض الشباب الذين فتنتهم الثقافة الأمريكية المبتزلة فراحوا يقلدون الشىء السىء فى مجتمعاتهم فى الوقت الذى بدات المدارس والجامعات بالتخلى عن فكرة الإختلاط ومحاربته عن طريق التفكير فى بناء مدارس وجامعات للبنين وأخرى للبنات بعد أن جربوا خطورة الاختلاط.<br />كما أن القرآن نهى عن ما يسمى جدلا ب\"الصداقة\" بين الولد والبنت فقال تعالى (ولامتخذات أخدان) .<br />وأتمنى من عشرينات أن يعدل نظام التصويت فقد لاحظت أنه فى الأيام الأولى من التصويت كانت نسبة المصوتين ب\"نعم قليلة جدا ثم تغيرت النسبة تغييرا جذريا فى الايام التالية مما يوحى بأن هناك من كان يصوت عدة مرات لتغيير النتيجة .<br />وشكرا لموقع عشرينات على مجهوداتها الإعلامية وأرجو إطلاعنا على موضوع إسلام عمدة مدينة أمريكية مؤخرا."
