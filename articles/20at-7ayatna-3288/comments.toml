order = 3
subject = "لم لا؟"
posted = "2007-02-20"
text = "عن أنس بن مالك قال: كان النبي صلى الله عليه وسلم يدخل بيت أم سليم فينام على فراشها وليست فيه. قال: فجاء ذات يوم فنام على فراشها فأتت فقيل لها: هذا النبي صلى الله عليه وسلم نام في بيتك على فراشك قال: فجاءت وقد عرق واستنقع (اجتمع) عرقه على قطعة أديم (جلد) على الفراش ففتحت عتيدتها (صندوق صغير تجعل المرأة فيه ما يعز من متاعها) فجعلت تنشف ذلك العرق فتعصره في قواريرها. ففزع النبي صلى الله عليه وسلم فقال ما تصنعين يا أم سليم؟ فقالت يا رسول الله نرجو بركته لصبياننا قال: \"أصبت\" رواه مسلم.<br />علاقة الرجل بالمرأة لا تتوقف عند العلاقات الخاصة والزواج بل هي قبل كل ذلك علاقة إنسانية إنسان مع إنسان قبل أن تكون ذكر مع أنثى<br />حتى في ديننا هناك الكثير من القصص تحكي كيف كان يتعامل الرجل مع المرأة بكل بساطة وعفوية وبلا تعقيد<br />لم في زمننا تختزل العلاقة بينهما في اطار زواج أو في علاقات حب شهواني؟<br />لا أتحدث هنا عن الغرب وإباحية نظرته لكن يجدر الاشارة أن الغرب لا يعني دائما بمصطلح بوي فريند يعني حبيب بل قد يكون صديق مقرب ويطلق أيضا على الصديقو المقربة من الفتاة جيلر فريند<br />من هنا سأتحدث عن المعنى المغاير للإباحية التي أرفضها من منطلق أخلاقي وديني إسلامي والأخلاق قاسم مشترك بين الأديان جميعها<br />نعم لدي أصدقاء من الجنس الآخر وأنا أفخر بهم وأحبهم وآوي إليهم في ضيقي أو أزماتي... ليس لأنهم من الجنس الآخر بل لأني ضقت ذرعا بجنسي الذي لم أر منه سوى غيرة وتنافس ومشاكل وقصر نظر<br />بمعنى أنا أبحث عن السامي النفس من يحترم مشاعري وأفكاري وأستطيع التحدث معه بغض النظر عن جنسه وصادف ووافق من الجنس الآخر هناك رابطة الإنسانية بيننا<br />أحبهم وأخاف عليهم ولا أريد الابتعاد عنهم<br />أما علاقة الزواج فقد سبق وطلب مني أحدهم الزواج بكل أدب واحترام ولم يسبق أن تبادلنا الغراميات بل نتبادل عبارات الصداقة والأخوية<br />وبعد نقاش ودراسة عرف كل منا أنه يصعب الارتباط تبعا لظروف معقدة تفصل بيننا<br />فاتفقنا على الاستمرار بالصداقة والتعاون على التخفيف من وحشة الحياة بالرفقة الفكرية السامية<br />كما أني لن أتردد في مساعدته ماديا حينما يقرر الزواج أو مباركته لأني أريد مصلحته كإنسان وليس لدي شخصيا على أن أقدم له شيئا آخرا في هذا الباب<br />أرجوكم أنا ضقت ذرعا باباحية الغرب وتعنت الشرق<br />لذا سأخط لي طريقا يوافق ديني ويرضي ضميري ونفسي<br />فقط"
