[[comments]]
order = 6
subject = "ردا على القائل لم لا"
author = "محمد ربيع"
posted = "2007-02-20"
text = "قوله: (كَانَ النَّبِيَّ -صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ- يَدْخُلُ بَيْتَ أُمِّ سُلَيْمٍ فَيَنَامُ عَلَىَ فِرَاشِهَا) قد سبق أنها كانت محرماً له -صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ-.<br />ففيه: الدخول على المحارم والنوم عندهن وفي بيوتهن، وجواز النوم على الأدم وهي الأنطاع والجلود.<br />صحيح مسلم بشرح النووي<br />قال النووي رحمه الله : (اتفق العلماء على أن أم حرام كانت محرماً له -صلى الله عليه وسلم-. واختلفوا في كيفية ذلك، فقال ابن عبد البر وغيره : كانت إحدى خالاته من الرضاعة. وقال آخرون : بل كانت خالة لأبيه أو لجده لأن عبد المطلب كانت أمه من بنى النجار) أهـ .<br />وقال أيضاً : \"أُمّ حَرَام أُخْت أُمّ سُلَيْمٍ ، وقد كَانَتَا خَالَتَيْنِ لِرَسُولِ اللَّه -صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ- مَحْرَمَيْنِ إِمَّا مِنْ الرَّضَاع , وَإِمَّا مِنْ النَّسَب, فَتَحِلُّ لَهُ الْخَلْوَة بِهِمَا , وَكَانَ يَدْخُلُ عَلَيْهِمَا خَاصَّةً , لا يَدْخُلُ عَلَى غَيْرهمَا مِنْ النِّسَاء إِلا أَزْوَاجه أهـ .<br />ليس كل من قرأ حديثا صار فقيها. لماذا يا أخي تفتي بغير علم و تبني على ما تفهم بدلا من أن تسأل أهل العلم و الاختصاص ؟ أم سليم هي خالة النبي إما من الرضاع أو من النسب فلهذا كان يدخل النبي عليها ولا يدخل على عامة النساء. لا يجوز أن تحتج بدخولك على أمك أو خالتك لتحل لنفسك علاقات ما أنزل الله بها من سلطان."
archived = "2010-03-14"
