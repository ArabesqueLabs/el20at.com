subject = "انما المؤمنون اخوة"
author = "أبو راشد سليمان"
posted = "2008-08-09"
text = "بسم الله الرحمان الرحيم<br />السلام عليكم ورحمة الله قال الله تعالى : ( انما الؤمنون اخوة فأصلحوا بين أخويكم واتقوا الله.....)<br />وقال رسول الله صلى الله عليه وسلم : مثل الؤمنيين في توادم وتراحمهم كمثل الجسد الواحد<br />فعلينا أن نتصالح ومن ثم نتلاحم لنصرة اخواننا المرابطين في غزة ، لأن تفرق المسلمين يصب في مصلحة الصهاينة المعتدين.<br />أخوكم من الجزائر"
archived = "2010-03-14"
