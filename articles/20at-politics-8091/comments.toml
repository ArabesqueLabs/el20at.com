order = 0
subject = "جمهور الفضائية الدينية يتهمها بالتحذير من مساندة ا"
author = "kkkkkkk"
posted = "2008-01-24"
text = "جمهور الفضائية الدينية يتهمها بالتحذير من مساندة الإخوة في غزة<br />المصريون : بتاريخ 23 - 1 - 2008<br />قناة فضائية دينية واسعة الانتشار بين البسطاء يغلب عليها الطابع السلفي تلقت طوال أمس عدة اتصالات تليفونية من مشاهدين أعلنوا غضبهم بسبب حلقة أذيعت أول أمس لأحد المشايخ المعروفين.. تحدث الشيخ السلفي المعروف عن أن هناك من يموتون في الجهاد ومع ذلك يدخلون النار في حين أن هناك من يموت خارج ميدان المعركة ويدخل الجنة.<br />انصبت أغلب اعتراضات المشاهدين على أنه من غير اللائق أن يتحدث الشيخ حول هذا الموضوع رغم ما يتعرض له الفلسطينيون من حصار وظروف إنسانية قاسية في غزة وقال البعض أن كلام الشيخ ربما يفهم منه التخذيل عن نصرة أهالي غزة والتحذير من مساعدتهم."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "انقذوا غزة"
author = "محمد علي"
posted = "2008-02-04"
text = "شاهدت قناة الحافظ التابعة لقناة الناس في برنامج القرآن والحياة تحدث فيها الشيخ عن مساندة ونصرة المسلمين ليس في غزة فقط بل في العالم وتحدث الشيخ احمد عبده عوض في قناة البركة التابعة ايضا لقناة الناس عن غزة بل إنه قبل فك الحصار ناشد الرئيس محمد حسني مبارك لفك الحصار عن المسلمين في غزة باي وسيلة"
archived = "2010-03-14"
