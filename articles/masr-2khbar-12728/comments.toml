author = "اقفلوها يرحمكم اللة"
posted = "2009-07-22"
text = "كلية الاعلام<br />كلية الزراعة<br />كليات الاداب<br />كليات التربية<br />مطلوب اغلاقها فورا لانها ملهاش اى لزمة<br />انتم شفتم اعلامى لامع او مذيع تليفزيون او مذيعة متخرجة من كلية اعلام<br />والزراعة وبطلناها وبقت الغيطان مزارع مثل حديقة البيت<br />الكاتب محمد حسنين هيكل المشهور اعلاميا وعالميا معاة دبلوم تجارة<br />وعلى امين ومصطفى امين ولا العقاد ولا طة حسين كانوا خريجى اداب ولا خريجى اعلام<br />الكليات التى انفتحت فى عصر الانفتاح الاستهلاكى اقفلوها"
