text = "ولزومه ايه كلية الاعلام من اصله<br />لما الطبيب ممكن يشتغل صحفي<br />والمهندس ممكن يشتغل صفي<br />والمحامي ممكن يشتغل صحفي<br />اي خريج جامعة مؤهله ممكن يشتغله صحفي او مذيع<br />يبقى لزومه ايه كلية الاعلام<br />نطالب بالغاء كلية الاعلام<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش رضوى حسن ولامروة صلاح"
