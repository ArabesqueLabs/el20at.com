subject = "اكثر من رائع"
author = "لينا عبود"
posted = "2008-02-19"
text = "بالفعل موضوع جداً رائع .. مفيد بدرجة كبيرة<br />حبذا لو نقرأ الكثير من هذه المواضيع اللتي تخوض في تنمية المهارات الحياتيه و الرقي بالذات .. فنحن بحاجه لهذه الدروس أكثر من حاجتنا لمعرفة من يكتب على جدران الحمامات ومن المسؤول عن دلع البنات وغيرها من المواضيع<br />المواضيع التي تعلم الفرد كيفية الاندماج الايجابي والفعال في المجتمع والتي تساعد الجيل الجديد على تخطي صعاب الحياة وانتهاز الفرص بشكل يخدم اهدافه وطموحه هي من النوع الذي يحتوي عنصر جذب للكثير من الذين يحبون اتقان فن العيش والتعايش ..<br />عزيزتي مروه .<br />فعلا تسلم الايادي على الطرح الرائع ويعطيكي الف عافيه"
archived = "2010-03-14"
