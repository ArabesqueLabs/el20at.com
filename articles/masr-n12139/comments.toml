[[comments]]
order = 0
subject = "مفتقدة"
author = "الريس"
posted = "2007-10-28"
text = "لديك كل الحق، فلاعبو مصر لا يهمهم المشاركة في تلك الأعمال، ولكن لا يجب أن نلومهم بمفردهم، فالمجتمع المصري كله يفتقد إلى ثقافة التطوع في أعمال خيرية، إذ يجب تربية النشء منذ الصغر على أن يخصص من وقته فترة محددة لكي يقوم بتلك الأعمال الخيرة.. وهذا ما تدرسه المدارس الأمريكية والأوروبية في مصر.. حتى أنها تدخل في مجموع الطلاب في نهاية العام.."
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194222/http://masr.20at.com:80/newArticle.php?sid=12139"

[[comments]]
order = 1
subject = "موافق ولكن"
author = "كريم"
posted = "2007-10-28"
text = "أتفق مع كاتب المقال، ولكن أغلب لاعبي العالم يقومون بتلك الأعمال، من باب (الشو الإعلامي)، فهي تدخل في نطاق \"الأعمال الاجتماعية\" للشركات الراعية للفرق الأوربية الكبيرة.. فشركة ببيسي مثلاً عندما تقوم براعية فريق، يهمها أن يشاع عنها تلك السمعة، وأغلب تلك الشركات سيئة السمعة في مجال عمالة الأطفال وسوء مكونات منتجاتها... وأعتقد أننا يجب أن نشجع اللاعبين على فعل الخير.. لكن في السر.. لأنه أبرك وأفضل لكل أطراف العملية الخيرية.. بل يمكن أن يكون بعض لاعبينا يفعل ذلك في السر"
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194222/http://masr.20at.com:80/newArticle.php?sid=12139"

[[comments]]
order = 2
subject = "عندك حق"
author = "محمد عبد القادر"
posted = "2007-10-28"
text = "عندك حق على فكرة فى الكلام اللى كاتبته وخلتنا نأخد بالنا من حاجة جميلة كانت غايبة عنا وياريت نجومنا يأخذوا بكلامك<br />ويعملوا حاجة تنفع الناس مش لمجرد الشو والظهور بس لكن بهدف اكبر لانهم فعلا بيأثروا فى تحركات الناس سواء بالسلب او بالأيجاب ومش هنسى اهنيك على المقال الجميل والاسلوب الراقى والجميل اكتر اختيارك للموضوع وبتمنى نشوف مواضيعك ونقرئها بأستمرار . بالتوفيق ان شاء الله"
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194222/http://masr.20at.com:80/newArticle.php?sid=12139"

[[comments]]
order = 3
subject = "موافق كفكره"
author = "حكيم زمانه"
posted = "2007-10-28"
text = "أري أن المقال جيد كفكره .وهي تشجيع لاعبينا علي مثل هذه الأعمال ..لاكن كمنطق بعيد كل البعد عن مضمون فعل الخير .. وأتفق مع أحد الإخوه وهو أن أغلب الاعبن يقومون بمثل هذه الأعمال من أجل (الشو الإعلامي )فقط ..<br />لا يعنينا من أشرت إليهم بأنهم يساهمون في العمل الخيري . تحت الأضواء ..<br />الأصل في العمل الخيري ( السريه)..وكيف تكون السريه بعيد عن الأضواء ....؟؟<br />ما نحتاجه نيه خالصه لعمل الخير من أجل الفوز برضي الله لا من أجل مذيد من الأضواء والشهره ...."
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194222/http://masr.20at.com:80/newArticle.php?sid=12139"

