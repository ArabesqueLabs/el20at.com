[[comments]]
order = 5
subject = "روسيا    موسكو"
author = "سعيد فيصل حسن"
posted = "2008-07-16"
text = "اني المواطن العراقي كنت اعمل في ديوان رئاسه الجمهوريه وقد هربت من العراق بعدسجني سنه كامله للاسباب سياسيه عام 1994 الى الاردن ومنها الى روسيا في عام 1998 وقد طلبت اللجوء في الامم المتحده وفي الهجره الروسيه وقد تم رفضي رفضا قاطعا لانني سياسي وقد اصبحت طريدا وغير قانوني بعد رفضي من قبل الطرفين لا اعرف ماذا افعل انا اسرتي ولا شك ان كل الشرفاء والمخلصين في العالم يقفون مع هذه الحاله الانسانيه وشكرا لكم مع التقدير الساده المحترمين تحيه طيبه لكم ولكل الشرفاء والمخلصين في العالم ان هذه رسالتي لكم كي تعرفوا الحقيقه والظلم والفساد الاداري في منظمه الامم المتحده في موسكو وطلب التحقيق في ذلك رجاء الساده المحترمين فقد اخبرني احد العاملين في الامم المتحده ولا اريد ان اذكر اسمه بانه لا يمكن اعاده النظر في قضيتك مهما حصل مهما حدث وذلك لوجود اخطاء متعمده وتزوير في التحقيق من قبل المحامي والمترجم واذا تم التحقيق في الملف مره اخرى سوفه يحدث الاتي 1- تشكيل لجنه تحقيق خاصه 2- وسوفه يوحال الى التحقيق كل من كان معك في التحقيق وربما يفصل من الوظيفه 3- يتم استدعاء بطلب كل من كان معك في التحقيق حتى اذا كان خارج البلاد 4- مهما تفعل ومهماتكتب وتشتكي سوفه يرفضون طلبك وكما حصل سابقا لانهم لا يريدون ان تكون الامم المتحده هي الغلطانه بانه المحامي والمترجم هم السبب في التزوير المتعمد 5- يفصل او يسجن كل من تعمد في تزوير لانه هذه المنظمه ليست منظمه عاديه 6- لقد فعلوا اشياء في حقك انت وعائلتك لا تقبل بها الاعراف الدوليه ولا الانسانيه الساده المحترمين طلب منكم المساعده العاجله علما انني وضعي غير قانوني في البلد وبدون عمل وبدون مورد رزق مما يجعلني في فاقه وحاجه علما انني قد تجاوزت من العمر - 56 - عام ولا شك ان كل العالم والشرفاء والمخلصين يقفون مثل هذه الحاله الانسانيه معربا عن املي ان اجد من يقف بجواري لينهي مشوار حياتي وشكرا لكم لخدمه الانسانيه وشكرا مع التقدير ت- 3044352 - 89035615481 - رقم الملف - 37267 - في موسكو"
archived = "2010-03-14"
capture_url = ""
