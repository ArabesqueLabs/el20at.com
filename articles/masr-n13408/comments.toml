order = 1
subject = "قصة حزينة من سورية : على حطامنا يبني البعض مجده ؟!"
author = "اكتب اسمك هنا"
posted = "2008-01-06"
text = "قصة حزينة من سورية : على حطامنا يبني البعض مجده ؟!<br />دمشق 1976 ، والمكان يقع بين ساحة المرجة ومنطقة البحصة الحيوية ويمتد على مساحة تزيد عن 1000 متر مربع ، موقع استراتيجي مطل على ثلاثة شوارع احدها يمثل احد اضلاع ساحة المرجة الاربعة والاخر يمتد على طول الشارع الرئيسي الذي يصل بين المرجة والبحصة ، والشارع الثالث هو امتداد لما بات يسمى بجسر فكتوريا وهو منطقة فنادق ومطاعم ومحلات تجارية وعصب رئيسي في حياة دمشق التجارية .. طفل يمشي بموازاة كتل هائلة من \" الباطون \" ( اسمنت مسلح ) ، يسأل والده \" ما هذا يا بابا \" ، يجيب الاب بفخر انه صرح عظيم يا بني.. انها سورية الحديثة ..<br />ثلاثون عاما مضت ،كبر الابن واصبح ابا ومشى في الشارع ذاته مع ابنه الصغير ، وشاءت الاقدار ان يسأل الصغير اباه ، \" ماهذا يا بابا .. \" نظر الاب الى الكتل الباطونية ذاتها بحيرة .. وتذكر حين سأل والده السؤال نفسه .. مشهد مكرر مع استبدال ابتسامة الفخر والتفاؤل في مشهد بالابيض والاسود ، بمشهد بالالوان الكاملة اظهرت وجهاً اصفر متعباً ترتسم عليه حيرة كبيرة بفعل سؤال صغير \" لا اعرف يا بني والله العظيم لا اعرف .. \" ..<br />خطوات تولد صغيرة متسارعة في اول الشارع ، تكبر وتتباطأ لتنتهي في اخره ويدور الزمان على الاعمدة الباطونية التي تحمل خمسة طوابق بارتفاع عشرين مترا بمساحة اجمالية تزيد عن الخمسة آلاف متر مربع .. لتشكل الملامح الاولى ( والاخيرة على ما يبدو ) لبناء يتوسط القلب التجاري لمدينة دمشق . . ،<br />سنوات طويلة كثرت خلالها التكهنات : كراج ، مبنى حكومي ، مجمع تجاري ، مجمع ديني .. لم يعرف احد بالتحديد ما مستقبل البناء اللغز .. ولكن احداً لم يكن يتوقع ان يؤول \" حلم الاجيال \" لمجرد حامل لاعلان تجاري ضخم ، كفّن البناء بعلامة مسجلة ؟!<br />اعتدنا على الخيبة ، وأدمنّا الفشل واصبحت المصائب في اوطاننا فرجة ، والمشهد بات غريباً ومقززاً ، وكأنه حطامنا بعد ان جعنا وتآكلنا حتى بان هيكلنا العظمي ، وجاء احدهم ليضع تاجه الذهبي على رأسنا الذي لم يبق فيه الا الجمجمة ، اما الاضواء فهي تزيد التاج بريقا وتلألؤاً ، عسى ان يعمي النور المبهر بصائرنا فنحمد لصاحب التاج ماله ، وننسى على انفسنا ان نترحما ..<br />نضال معلوف"
archived = "2008-02-14"
capture_url = "https://web.archive.org/web/20080214124025/http://masr.20at.com:80/newArticle.php?sid=13408"
