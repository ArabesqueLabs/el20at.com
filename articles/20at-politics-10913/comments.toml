subject = "ضياع القدس والضفة الغربية بعد حرب الايام الستة سنة"
author = "بس"
posted = "2009-01-10"
text = "مين اللى ضيع المناطق دى<br />انتم بتعملوا عنتريات وبعدين تنضربوا ع7لى ادمغتكم وبعدين تقولوا القضية الفلسطينية<br />مين ضيع فلسطين غيركم<br />مين اللى ضيع القدس"
