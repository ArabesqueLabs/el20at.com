[[comments]]
order = 2
subject = "هل هذا معقول  ؟"
author = "سعيد عطية"
posted = "2009-01-11"
text = "هل يعقل ان يحاصر شعب لمدة عامين يحرم خلالهما من الغذاء والدواء وكل مقومات الحياة ، ثم يضرب بالطائرات والدبابات ، ويحرم من مجرد الحصول على السلاح ليدافع فقط عن نفسه ؟ و العجيب في الأمر أن النظام السياسي الفاشل في مصر الكبرى يحاول إقناعنا بأن اشتراكه الآثم في الحصار الخانق ، ثم تغافله عن الدفاع عن جيرانه العرب المسلمين ، أو على الأقل تزويدهم بالسلاح ( وليس تهريبه ) ، يحاول اقناعنا بأن هذا هو ( عين العقل ) ! وهو يتغافل عن ان اليهود لن يتركوه عاجلاً أو آجلاً ، وأن الدور سيأتي عليه حتماً، لتحاول اليهود التهام مصر هي الأخرى ، بل وجميع الدول العربية ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "فرقة موسيقى الجيش الاسرائيلى"
author = "لا خايف"
posted = "2009-01-11"
text = "بعد الوهن الذى نحن فية<br />وبعد تصريحات وزير الدفاع ان هدف الجيش هو حماية الشرعية فقط - اى حماية نظام الحكم<br />وبعد ان اظهرت قوتها الغاشمة فى غزة<br />يا خوفى<br />يا خوفى يا بدران<br />يا خوفى - لا اسرائيل تبعت فرقة موسيقى الجيش تحتل سيناء وتقف تعزف النشيد الوطنى على شواطىء القناة تانى<br />الحجج الاسرائيلية كتير<br />اسرائيل هتقول اى حجة وامريكا هتمشى ورائها<br />احنا فى وضع خطر<br />ومصر فى اسوأ حالتها مع الوضع الاقتصادى المهبب الذى وصلنا الية"
archived = "2010-03-14"
capture_url = ""
