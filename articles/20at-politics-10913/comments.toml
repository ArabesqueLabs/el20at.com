[[comments]]
order = 0
subject = "المشكلة مش مشكلة حماس المشكلة دلوقتى الانفاق وطرق"
author = "شايف"
posted = "2009-01-10"
text = "اسرائيل سابت حماس ومسكت فى مصر<br />الحجة دلوقتى الانفاق وتهريب السلاح من مصر لغزة<br />وطبعا اسرائيل تطلب قوات دولية لوضعها داخل مصر لمراقبة الحدود مع غزة<br />ومصر بتمانع<br />لية<br />لما اسرائيل تجيب قوات دولية لمراقبة ممر رفح ومراقبة الانفاق اللى تحت الارض والقوات الدولية تستلم المعبر حسب طلب اسرائيل - يبقى مصر مش هتقدر تتحكم فى الممر ولا تقدر تقفلة فى وش حماس<br />وبعدين حماس تنبسط وتبقى اسرائيل خدمتها<br />يبقى اللى هيفقد السيادة على حدودة هى مصر<br />لان فية قوات دولية هتعدى اللى عايزة تعدية وغصب عن مصر"
archived = "2010-03-14"
