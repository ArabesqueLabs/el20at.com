text = ":-| :cry: :P :roll:<br />اوباما هيقول اية - زى ما قال بوش 30 مرة<br />الدولة الفلسطينية هتكون خلال سنتين<br />وهنعمل مفاوضات<br />وكمان مفاوضات لمدة 30 سنة مفاوضات<br />وابقى قابلونى<br />وهيقول يا عرب يا مسلمين امريكا حلوة وزى الفل وهاتوا فلوسكم عندنا وخللونا نملىء البنوك بتوعتنا بدولارات البترول<br />ويا عرب ويا مسلمين اعملوا علاقات طيبة مع اسرائيل وخللوكو حلوين<br />كلام سمعناة من الخواجة كارتر والخواجة جونسون والخواجة بوش الاب والخواجة بوش الابن<br />يعنى شوية كلام علاقات عامة<br />ولا مصلحة لاى مصرى كان فيها<br />يمكن فيها مصلحة للنظام لتثبيت اركانة<br />ولكن اوباما لا يعنينا نحن المصريون فى قريب او بعيد<br />احنا شعب كل استهلاكنا من المنتجات الصناعية بتاع الصين<br />يعنى يهمنا شعبيا الصين"
