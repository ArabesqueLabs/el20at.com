subject = "يعيش الحزب الوطنى الديمقراطى"
text = "الحزب الوطنى هو حزب الافعال وليس الاقوال<br />انضموا الى الحزب تنهض مصر بكم تحت مبارك الزعيم الملهم وصاحب الضربة الجوية التى تعانى منها اسرائيل حتى اليوم<br />الحزب الوطنى هو دار الجميع<br />انضموا الى الحزب الوطنى"
