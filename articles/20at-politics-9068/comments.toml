posted = "2009-05-13"
text = "من ايقظ الفتنة ايران لتشن حرب غير محسوبة العواقب تظن انها بالنهاية ستحافظ على امتداد حكم ال خامنئى من خلالها مئات السنين وان كانت تضمن النتائج فربما نجدها استفادت من اشعال الفتنةولكن سلاح الفتنة الذى بيد المعلم حسن نصر لا يستخدمه الا بامرسادته بايران ومختطف شيعة لبنان كوقود لاى انتصار ايرانى مزعوم فان سلاح عمو حسن لايصلح لايقاع هزيمة باسرائيل وما الانتصارات التى يدعيها ماهى الا لعب بعقول سفهاء العرب ليشرع احتفاظه بسلاحه الذى يهدف من بقاؤه الى تركيع العرب وفرض اجندة ايران كقوة اقليمية وحيدة فى المنطقة وهى الوحيدة المؤهلة للتفاوض مع اسرائيل والمجتمع الدولى على كل القضايا محل الخلاف."
