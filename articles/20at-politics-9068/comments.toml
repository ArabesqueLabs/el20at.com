[[comments]]
order = 2
subject = "مقال متوازن قريب من الموضوعية"
author = "ناصر كمال"
posted = "2008-05-13"
text = "تحليل لطيف لما يجري في الساحة اللبنانية، وفعلا يصور بدقة موقف وسائل الاعلام المختلفة من احداث لبنان.<br />اختلف مع كاتبة المقال في قضية وصفها لقناة المنار بالطائفية. قناة المنار رغم كونها قناة تابعة لجزب الله، الا انها اقرب للموضوعية من نظيراتها. العربية بالغت في تطرفها وصارت بوقا للموالاة اكثر من قناة المستقبل الاخبارية.<br />كنت اتمنى لو علقت الكاتبة على مواقف القادة الاسرائيلين مما يحصل في لبنان، خصوصا تصريح رئيس الموساد الاسبق بأن ليلة واحدة ذهبت بجهد 3 سنوات لمخابرات عربية واسرئيلية في بيروت."
archived = "2010-03-14"
