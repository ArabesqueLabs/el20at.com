subject = "فتنة صغري لواد الفتنة الكبري قبل ان تبدا"
author = "محمد سالم"
posted = "2008-05-13"
text = "اسباب الازمة الحالية هي اصرار قوي14 اذار علي خضوعها للهيمنه الامريكيه والدوران في فلكها<br />ماذا تتوقعون من حزب الله وهم يحاولون ان يجردوه من سلاحه ... سلاح الاشاره في الجيش هو من اهم الاسلحه<br />وسبب رئيسي انتصار حزب الله في الحرب الاخيرة هي منظومة القياده والسيطره التابعه لحزب الله<br />لذلك كانت محاولة استهدافها من ادوات امريكا في لبنان من امثال جنبلاط والحريري والسنيورة وجعجع"
archived = "2010-03-14"
