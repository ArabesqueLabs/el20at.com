subject = "ضع عنوان التعليق"
author = "مقال غير موضوعي أبداً"
posted = "2008-05-14"
text = "المراسلة دي مراسلة فشلة بصراحة...<br />مع احترامي ليها....<br />من طبيعة وصياغة الكلام يتبن لنا أنها غير مدركة ولا ملمة بالوضع اللبناني من اساسو...<br />من اول جملة لأخر جملة والكاتبة توصل رسالة واضحة جداً<br />من أقيظ الفتنة هي المعارضة....<br />ومن حاصر بيروت هي المعارضة ...<br />وبلاش ترموا بلاكم يا مصريين على لبنان..<br />ودايماً بتشوفوا الحكومة على الخطأ والمعارضة على صواب..<br />حاولو تخرجوا من واقعكم السياسي علشان تفهموا الواقع السياسي اللبناني...<br />المعارضة اسقطت شرعيتها في أزقة بيروت..."
