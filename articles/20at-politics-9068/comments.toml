subject = "فين صور قوي المعارضه"
author = "وئام وهاب"
posted = "2008-05-14"
text = "بصي يا ست شيرين هانم<br />اليكي اسماء بعض من قوي المعارضه<br />طبعا بالاضافة الي حركة امل وحزب الله<br />فيه طلال ارسلان وو ئام وهاب ودول في الجبل<br />وفيه كمان عمر كرامي واسامه سعد ودول في طرابلس وكمان سليم الحص من السنه<br />وطبعا ميشيل عون من الموارنه وكمان سليمان فرنجية<br />ده غير الحزب السوري القومي وحزب البعث<br />كفاية دول ولا نقول كمان"
