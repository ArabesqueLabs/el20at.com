[[comments]]
order = 12
subject = "متي تسكت ومتي تتكلم؟"
author = "محمد السيد"
posted = "2008-05-15"
text = "بعيد عن اي تعليقات .. سيبقي سؤال من أيقظ الفتنة قائما اليوم وربما لاعوام قادمة أيضا ...<br />من أيقظ الفتنة ...؟<br />سكوت يدفع ونحن في ذكري النكبة إلي استحداث نكبات أخري وكأنها لاتكفينا .<br />مابين وضع يحسبه البعض امتدادا لمشروع شيعي يظهر أحيانا علي السطح .. ويقول عنها آخر أنها مقاومة حقيقية فعلا لا تتأثر بأي عامل خارجي ... وما بين رأي وسطي يتحدث عن مقاومة فعلية لكن لها حساباتها كذلك .. وهو ما أراه .. ولكن<br />أيها السادة .. هل هو تكرار لمشهد حدث في فلسطين حين تم دفع المقاومة وحماس إلي الحل العسكري .. ومن قبله مأساة المقاومة في العراق ما بين مقاومة حقيقية وأخري مدفوعة بقوي خارجية تدفع باتجاه اقتتال أبناء الوطن الواحد ...<br />ليتكرر الموقف في لبنان ...<br />ويظل مهددا للتكرار ولو بطرق أخري لخلق فوضي خلاقة في مجتمعات عربية وإسلامية عدة؟؟<br />والبديل الأصعب لسكوت المقاومة علي كل هذا كان أشد قسوة وهو القضاء اساسا علي المقاومة كلها وعلي سلاحها ..<br />هل المقاومة في كل هذا معها الحق والصواب؟ أم كان يجب أن تسكت علي إساءت بل وعلي محاولات القضاء عليها؟؟<br />هنا السؤال الحقيقي؟؟<br />متي نسكت .. ومتي تصل إلي مرحلة يصعب معها السكوت ؟؟"
archived = "2010-03-14"
capture_url = ""

