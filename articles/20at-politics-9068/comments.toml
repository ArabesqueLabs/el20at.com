text = "لقطة تحفة جدا جدا، وكتابة جميلة..<br />بس سابتني أكثر حيرة في الرد على السؤال.. \"من أيقظ الفتنة؟!\"<br />مش عارف ليه عاوز أقول إن واحد صاحبنا كاتب على الماسينجر اسمه \"شجرة الأرز تحترق\"<br />والـpersonal message :<br />\"الخيار صعب بين مشروع مقاومة يسوق لأيدلوجيا شيعية وبين مذهب سني ضعيف وتابع\"<br />كان الله في عونك يا لبنان..<br />وفي عوننا جميعا..<br />تسلم ايدك بجد يا شيرين.."
