subject = "عالم عايشة فى الخيال"
author = "عادل"
posted = "2007-12-03"
text = "راحوا على الحدود وهيصوا شوية وطيب اية النتيجة - لا شىء<br />الكوندا ليزا جمعت شنبات العرب واخدتهم فى امريكا وكلهم قعدوا زى التيوس يسمعوا فى خطب كانهم فى حصة مطالعة من كتاب القراءة<br />مفيش حاجة اسمها عودة الاجئين<br />مفيش حاجة اسمها الوطن العربى فية حاجة اسمها الشرق الاوسط<br />بتوع غزة يتحاصروا وينضربوا بالجزم<br />اسرائيل تساعد الاردن ومصر فى ضرب الاخوان المسلمين<br />المفاوضات بين الاسرائليون والفلسطنيين هتستمر 50 سنة وبعدها نبقى نعمل دولة فليسطينية<br />مش هى دى نتائج مؤتمر امريكا اللى الكل كان بيلهث علشان يحضرة ويبوسوا ايدين امريكا علشان تدعوا سوريا للمؤتمر<br />الاوباش كلهم ما سمعوش ان ما اخذ بالقوة لا يسترد بغير القوة<br />شايفين نصر اللة الاسد عمل اية فيهم<br />فيا عم عبد القدوس مفيش فايدة<br />ريح بالك<br />الجميع منبطحين"
