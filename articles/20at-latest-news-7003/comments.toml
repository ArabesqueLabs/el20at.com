order = 0
subject = "خيرا تعمل شرا تلقى"
author = "عبدالهادي مبارك الدوسري"
posted = "2007-11-22"
text = "ما عمله هذا المواطن الصالح يجب أن يكافأ عليه لا بأن يتحمل تلك لخسائر بسبب نقل الحديقة إلى مكان من الصعب علينا و على مسئولي المدارس أخذ الطلاب إليه في رحلة مدرسية وكذالك من الصعب علينا نحن أولياء الأمور السماح للمدارس بأخذ أولادنا إلى أم السلم لزيارة الحديقة لما في ذلك من خطر الطرق والمواصلات<br />من الواجب على الأمانة أن تبحث في التالي هل الحديقة أسست قبل أن يسكن المواطن عبد الله صالح أحمد و جميع من يقطن في حي الرحاب في الموقع إذا كان كذلك فليس له الحق لا هو ولا من يسكن في ذلك الحي وهو يعلم أن في ذلك الموقع يوجد حديقة حيوان<br />لو افترضتا أن الحديقة نقلت إلى حي السلم كما ترغب الأمانة هل تضمن أمانة جدة بأن لا يتقدم أحد المواطنين ممن يقطنون في حي السلم بعد خمس أو عشر سنوات بشكوى أخرى مطالبا بنقل الحديقة إلى مكان آخر لتوافق علية أمانة جدة وتحمل ذلك المواطن خسائر أخرى كما قدرها بخمسين مليون ريال ليصبح المجموع مئة مليون ريال ومن يعلم أنة كلما انتقل إلى موقع تقدم مواطن آخر بشكوى أخرى مطالبا بنقل لحديقة بعيدا عن موقع الحي السكاني لتوافقة الأمانة الرأي وتطلب من مالك الحديقة بنقلها مرة أخرى ويترتب على ذلك خسائر أخرى هل سيتوقف ذلك أبدا لأن الأمانة لا تبالي<br />و إذا كانت ألأمانة لا ترغب في أن يتكبد المواطن المالك للحديقة أي خسائر فمن لواجب أن تقوم بمنح ذلك المواطن بأرض ملكا له بعد أن تقوم بتخطيط و زفلتت وإنارة و تجهيز المكان بكل ما يلزم ليصبح صالح للاستخدام الحيواني و البشري<br />يا أمانة جدة مالي أراكم مهتمون بنقل حديقة الحيوان ولا تهتمون بنقل مرمى النفايات هل لأن الحديقة يتحمل خسائرها مواطن ومرمى النفايات يتحمل خسائره الأمانة و البلدية"
archived = "2010-03-14"
