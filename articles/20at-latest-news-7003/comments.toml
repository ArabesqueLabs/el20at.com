order = 2
subject = "رفقا بالحيوانات !!!"
author = "د.حسن عمر القثمي"
posted = "2007-11-28"
text = "أعجب كثيرا لاصرار أمانة مدينة جدة على إغلاق هذه المعلم الجمالي الحضاري الثقافي التعليمي لأبناء وزوار ومرتادي مدينة جدة لنضيف تشوها إلى وجه العروس التي أخذت تهزل في عافيتها شيئا فشيئا .<br />من حق الأمانة ان تستثمر ولكن ليس من حقها أن تقتل جهد هذا المواطن الصالح وتجعل حلمه على مدى ربع قرن يذهب هبا منثورا لمجرد شكوى كيدية وما أكثرها هذه الأيام في مجتمعاتنا العربية .<br />وهذا نداء صادق نيابة عن أبنائنا إلى أمير أطهر البقاع جمالا وأمير الشعر والفن ـ هذه ساحتك ـ والقول قولك فالعروس تتوجع والأمانة فقدنا بها الأمانة حينما تصيبنا بالتلوث البصري .. يوما بعد يوم ولا أقولها رفقا بنا ولا بمدينتنا بل رفقا بالحيوانات التي ربما تنفق من قلة زائريها .. دمتم بعافية"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "كلمة حق عن حديقة حيوان الأنعام الجميلة"
author = "علي السبيعي - أكاديمي"
posted = "2007-12-07"
text = "نقلت جريدة الوطن<br />أن أمير منطقة مكة المكرمة الأمير خالد الفيصل بن عبدالعزيز وجه أمانة جدة بعدم إغلاق أو اتخاذ أي إجراء ضد حديقة الأنعام الجميلة الواقعة شرق محافظة جدة حتى ترفع الأمانة تقريرا مفصلا عن وضع الحديقة وأسباب توجهها لإغلاقها.<br />ويأتي هذا التوجيه بعد أن اطلع أمير المنطقة على تقرير رسمي صادر عن الرئاسة العامة للأرصاد وحماية البيئة (حصلت \"الوطن\" على نسخة منه) يفيد بأن الحديقة تمثل معلما لمدينة جدة وتعتبر من الحدائق النموذجية في المملكة.<br />وأكد تقرير الأرصاد أنه من المنظور البيئي للضوضاء فإنه لا يوجد هناك أي تأثير على المناطق المحيطة بها.<br />أما عن مياه الصرف الصحي فقد أوضح التقرير أنه يوجد في الحديقة جهاز لمعالجة المياه الصادرة منها، ومن ثم الاستفادة منها في ري الأشجار الداخلية والخارجية للموقع.<br />وأضافت الرئاسة في تقريرها أن الحديقة محاطة من الخارج بأشجار علوية إضافة إلى الأشجار الداخلية مع جهاز الرش المائي (الضباب الدخاني) العلوي الذي يساعد في تنقية وترطيب جو المنطقة من الحرارة وغيرها.<br />ورأت رئاسة الأرصاد في تقريرها عدم الحاجة إلى غلق أو نقل الحديقة من موقعها نظرا لعدم وجود أي أضرار بيئية أو صحية على زوار الحديقة وسكان المنطقة.<br />من جهته، أوضح صاحب حديقة الأنعام الجميلة وسمي الوسمي لـ\"الوطن\" أنه لجأ إلى الأمير خالد الفيصل بعد أن حصل على كل الوثائق والمستندات من عدة جهات رسمية تؤكد سلامة الحديقة بيئيا، وأهمية وجودها كمعلم سياحي وتعليمي في المنطقة، مؤكدا أن أمير منطقة مكة المكرمة وجه الأمانة برفع تقرير مفصل عن الموضوع للبت فيه.<br />وأضاف الوسمي أن الحديقة قائمة منذ نحو 25 عاما قدمت خلالها خدمات كثيرة لمحافظة جدة سياحيا من حيث الوفود السياحية الداخلية والخارجية الزائرة للحديقة، كما قدمت خدماتها العلمية من خلال زيارات الطلاب والباحثين اليومية التي تنظمها وزارة التربية والتعليم أو بعض المدارس الخاصة لإطلاع الطلاب على الحيوانات النادرة والغريبة الموجودة في الحديقة، فضلا عن أن قرار إغلاق الحديقة يتسبب في خسائر تقدر بنحو 50 مليون ريال وهي مجموع الاستثمار في الحديقة منذ إنشائها.<br />وكانت أمانة جدة قد تحركت خلال الأسبوع الماضي في محاولة لإغلاق حديقة الأنعام الجميلة، وهددت باستلام الموقع غيابيا، واعتبار جميع المنقولات مواد تالفة دون أدنى مسؤولية إذا لم يقم صاحب المشروع بإغلاقها في وقت تم تحديده من قبل الأمانة.<br />وقد كتبت قبل ذلك سيدة الأعمال السعودية حصة العون قبل فترة في صحيفة الإقتصادية تحت عنوان (أنقذوا حديقة الأنعام) وكان لهذا المقال صدى كبير إذ تفاعل عدد كبير من محبي هذا الوطن من مواطن ومقيم ويبدوا من الردود أن الهجوم كان عنيفاً على أمانة جده وقد تم بتر بعضها مجاملة للأمانة واصبحت بعض الردود عرجاء.<br />وكان الأجدى أن يطرح الموضوع كاملاً وحذف الكلمات النابية فقط إن وجدت.<br />لقد تابعت قضية حديقة الأنعام بدقة لأني شعرت أن هناك حقائق لا بد من كشفها وهي مهمة صعبة ولكنها ليست مسنحيلة.<br />فمن قراءتي لما طرح شعرت بأن الحديقة ضحية وإن أول من طعنها الجيران ووقفت معهم أمانة جده ظلماً وعدوانا وتبينت لي الحقائق التالية:<br />تم إنشاء الحديقة منذ أكثر من 25 سنه وبإذن الجهات المختصة.<br />يكاد موقع الحديقة أن يكون خالياً من السكان وقتها وقد تم إحياء الموقع حيث تحملت الحديقة تكاليف ربط طريق الخدمات من شارع التحلية وحتى طريق الحرمين<br />وبطول 1.000 متر وقامت الحديقة وعلى نفقتها بإنشاء شبكة الهاتف لكامل الحي واستفادت من الخدمات الحديقة وسكان الحي.!<br />بعد إنشاء الحديقة بحوالي عشر سنوات أي بعد أن تنظمت وتوسعت وتعاقدت مع أمانة جده لاستئجار حديقة الأمانة المجاورة، تقدم بعض المجاورين الذين سكنوا يعد قيام الحديقة بعدة سنين بعدة شكاوي على الحديقة يتبين من تقارير الجهات المختصة بأنها كيدية.<br />حيث شكلت عدة لجان وصدرت تقاريرها بسلامة الحديقة.<br />وبأمانة اطلعت على جميع الأوراق ذات الصله في الدوائر المعنية وما قدمته إدارة الحديقة للدفاع عن نفسها واتضح أن بداية المشكلة كانت في عهد الأمين السابق<br />م عبد الله المعلمي حيث صدر من وزارة الشئون البلدية أمر بتميد عقد إيجار الأمانه بموجب لائحة التصرف في الأراضي البلدية.<br />علمت أيضاً بأن صاحب الحديقة قابل وقتها الأمين وأفاده أنه نظاماً يستفيد من التمديد دون طرح الموقع للمزايدة ولكن بقي في العقد سنتين نرى أن تنتظر إلى قرب انتهاء العقد لتستفيد منها وسيتم التمديد بحجة أن العقد الجديد سيكون بقيمة جديدة تحددها لجنة من عدة جهات معنية وأن العقد يبدأ من تاريخ التوقيع.<br />كان بإمكان الأمين السابق بموجب صلاحيته تحرير عقد جديد بشروط وقيمة جديدة تبدأ اعتباراً من تاريخ الإنتهاء.<br />ومن الخطابات التي وجهت لصاحب الحديقة يبدو أن الأمانة قد اعلنت عليه الحرب!<br />فقد اطلعت على خطابات أولها صدر له من الأمانة بعد اسبوع من صدور أمرالوزير بتمديد العقد.<br />الخطاب الذي صدر له يفيد بأنه خالف التصريح لبناء مرافق ومطلوب منه لقاء ذلك سداد غرامة سنوية إضافية تفوق قيمة إيجار العقد ويجب عليه سدادها وإلا سوف تسحب الأمانة الموقع.<br />وقام بالرد عليهم والتأكيد بأنه وحسب التصريح لم يرتكب أي مخالفه بل لم يستفيد من كامل المساحة المصرحه له في تصريح البناء وقد اقتنعوا بذلك.<br />وبعد انتهاءعهد الأمين السابق ورده عدة خطابات من إدارة الاستثمار تطالبه بدفع الغرامة بسبب المخالفة المزعومة والتي اكتشفت على حد قولهم بعد 13 سنة من التعاقد!.<br />وبعد تدخل المهندس الإستشاري الذي صمم الموقع بطلب من مالك الحديقة وبعد فحص المستندات وتقديم الأدلة تأكد خطأ الأمانة،تم الغاء المطالبه.<br />بعد ذلك ورده من إدارة الاستثمار خطاب مفاده عدم رغبة الأمانة بتجديد العقد معه.<br />وأن الموقع سوف يطرح للمزايده. ورد عليهم المستثمر بأن الموقع مخصص كحديقة حيوان وطيور وهو مستأجر كتوسعة لحديقة الأنعام فكيف يطرح للمزايدة لشخص آخر ليقيم عليه حديقة أخرى مجاورة؟<br />بعد أن أدركوا خطأهم ورده خطاب آخر من الأمانة مفاده بأنها غيرت نشاط الموقع من حديقة إلى تجاري.<br />(شيء لا يصدق ولا يجب أن يحصل من منشأة فردية محترمة فما بالك بدائرة حكومية تعتبر قدوة في تطبيق النظام.ألا وهي أمانة جده)<br />تقدم صاحب الحديقة باستدعاء لخادم الحرمين وسلمه شخصياً بطلب يلتمس فيه الحصول على ما يمكن وهذا من أبسط حقوقه. أما منحه قطعة الأرض أو البيع بالسعر الرسمي أو تمديد عقد الإيجار بنفس الشروط السابقة لمدة ثلاثون عاما. كما طلب في استدعائه منحه أرض بمساحة مناسبة لأقامة مشروع سفاري شمال شرق جده وصدر امر سامي بذلك.<br />أحيل الأمر السامي من وزارة الشئون البلدية إلى أمانة جده لتنفيذه وقرات الرد الخاطئ والغير نظامي من أمانة جده على الوزارة وقد اطلعت على المعاملة بأم عيني وشعرت بأن أمانة جده ارتكبت عدة مخالفات في حق صاحب الحديقة.<br />وقد علم صاحب الحديقة بأن الأمانة قامت بالرد وتعمدت تجاهل أمر السفاري.<br />رفع صاحب الحديقة برقية لخادم الحرمين وصور منها لولاة الأمر وتقدم باستدعاء عندما باشر سمو الأمير خالد الفيصل عمله وسلمه شخصياً وطلب الأمير الإفادة برقياً ولكن الأمانة لم ترد بل بدأت بتهديده باستلام الأرض وإغلاق الحديقة ومصادرة ونقل الحيوانات إلى حديقة الأمانة في حي أم السلم.<br />وتقدم مالك الحديقة باستدعاء آخر لأمير منطقة مكة المكرمة الأمير خال الفيصل الذي وجه ببرقية عاجلة للأمانه للإفادة عن ملف الحديقة.<br />الحقيقة المؤلمة أيضاً أن الحديقة حاصلة تقارير عدة لجان وعلى شهادات تقدير من الجهات المختصة وتوصيا وخطابات شكر وتصنيف بيئي وكلها تؤكد سلامتها على الزوار والجوار بعضها صدر من عدة سنين.<br />وقد تسلم مالك الحديقة مؤخراً تقريرا من الرئاسة العامة للأرصاد وحماية البيئة وخطاب موجه لأمانة جده يوصي بعدم نقل أو إغلاق الحديقة.<br />إذا يتضح أن حجة الأمانة واهية ويتبين من ذلك أن الأمانة لم تتخذ هذا الإجراء ضد الحديقة حرصا على سلامة الجيران.<br />أمانة جده أرادت أن تضرب عصفورين بحجر.<br />استغلت شكوي الجيران الغير مدعمة بدليل علمي لكي تزيل الحديقة من المكان لتستفيد من أرضها والتي هي وحسب المخطط حديقة كمتنفس للناس ليبني عليها مواطن آخر مكانها مركز تجاري من ناحية وتفرض على المالك ليستثمرحديقة الأمانة.<br />ودون مراعاة منها أن مالك الحديقة تكبد مبالغ كبيرة لإنشاء الحديقة وكما علق بعض الأخوة والأخوات بأن هذا الرجل قدم خدمة للآمانة لن تنالها أي أمانة مدينة في العالم.<br />علماً بأن الآرض محور القضية مقام عليها مسجد منذ 16 سنه برخصة من الأمانةّّ!!<br />لقد كانت السيدة حصة العون محقة في ما ورد بطرحها.<br />وأنا أقول: يا أمانة جده أن ما قدمه هذا الرجل لمدينة جده وزوارها يجب ألا يستهان به. صحيح أنها مجرد حديقة حيوان ومتحف ولكنه وبأمانة مشروع عملاق يفيد البلد أكثر مما يستفيد منه صاحبه. ولن يقوم بهذا المشروع إلا مواطن كريم وشجاع ومحب لوطنه. وتفسير ذلك لو كان أناني لاستفاد من هذا الموقع كما تفكر مع الأسف أمانة جده باستثماره بمشروع آخر غير الحديقه.<br />وشجاعته أنه صرف على هذه الحديقة وما يساندها من مرافق ومزارع أموالاً لا يمكن وبأي حال تعويضها من الدخل اليسير.<br />وعلمت أيضاً عن المزارع المساندة للحديقة فقد استصلح مالك الحديقة عدة مزارع منها في هدى الشام ومزارع في وادي بيضان بمجهود جبار حيث سوى الجبال الوعرة إلى أراضي خصبة لإنتاج الأعلاف وزراعة الأشجار نال عليها شهادات تقدير من وزارة الزراعة<br />لقد أسئتم يا أمانة جده لهذ الرجل الفذ وكثير غيره.<br />مع إننا في أمس الحاجة لرجال مثله.<br />لقد قابلت هذا الرجل بعد محادثة هاتفية سريعة كنت في مكتبه المتواضع وعلمت أنه كان من منسوبي وزارة الدفاع وكان يعمل أكاديمي ضمن الفريق الهندسي لصيانة الأجهزة والمعدات الألكترونية.<br />وقد بدأ العمل في القطاع الخاص منذ حوالي ثلاثة عقود وبدأ مشواره العملي.<br />بتنفيذ مشاريع لوازارة الدفاع ثم بدأ مشروع الحديقة كهواية وبتشجيع من الجهات المختصة.<br />من القلب أن نشكره وهذا أقل شيئ ممكن أن يقدم لهذا الرجل.<br />وكلمة أخيرة:<br />يا أمين جده علمت أن أحد مستشاريك وهو استاذ جامعي وافد.<br />قد أدرج أسمه ليحاضر في منتدى تبنته حديقة الأنعام وهو (منتدى بيئي لتوعية الأسرة والطفل ) في الصيف الماضي.<br />واعتذر الدكتور عن الحضور متعاليا على الأسرة والطفل السعودي.!<br />فهنيئاً لكم بمستشاريكم وعزائي لأهالي جده بهذ القرارات الهدامة."
