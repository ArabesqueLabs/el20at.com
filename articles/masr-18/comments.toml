subject = "يا قلبى لا تحزن"
author = "جمال محمود معتوق"
posted = "2007-06-05"
text = "من عمر أفندى لجمال أفندى يا قلبى لاتحزن ومن ألصحفيين ألقوميين ألمباركين ألقوادين ياقلبى لاتحزن ومن عبارة ألسلام الى ألطائرة ألتى كانت على متنها 30 ضابضا من أكفأألضباض ياقلبى لاثحزن ومن ألأاشراف توفيق ألريان وأسامة بن لادن ياقلبى لاتحزن ومن ألشهيد ألبطل ألفقير سليمان خاطر وألشهيد ألمسكين ألبور سعيدى هل جزاء ألاحسان الا ألموت هل نطلب من راعيينا مساعدة بسيطة فيقتلنا حراسه فى عز ألنهار بحجة أننا بيدنا سكين معقول هذا الكلام وبعددددددددد يينننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننن"
