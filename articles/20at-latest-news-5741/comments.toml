subject = "ال سعود جميعا يستحقوم المحاكمة"
author = "مسلم"
posted = "2007-05-06"
text = "إن جميع ال سعود وليس الامير نايف فقط يستحقون المحاكمة لما ارتكبوه في حق الامة<br />ومن أكبر جرائم ال سعود تغييب الاسلام الحق واستبداله بدين واهن ضعيف يوالي الكافرين ويعادي المؤمنين<br />ولو نتتبعتم تاريخ اسرة ال سعود لوجدتم أنهم خلف كل مصيبة تصيب الاسلام والمسلمين.<br />فهل نحاكم ال سعود لتغييب الاسلام الحق عن الوجود ، وتعطيل رسالة الحرمين أم نحاكمهم لتبذيرهم اموال الامة على شهواتهم واحلافهم أم نحاكمهم لقتلهم لخير رجالات الامة ، أم نحاكمهم لفتحهم الحدود والاجواء ليشن بها الكافر الغارة على ديار الاسلام ، أم نحاكمهم لافسادم لشباب الامة بهذا السيل الجارف من القنوات الهابطة .<br />إن كل ال سعود مستحق للمحاكمة وإن كان أكبر مجرميهم هو نايف بلا ريب."
archived = "2010-03-14"
