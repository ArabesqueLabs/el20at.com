order = 0
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-09-24"
text = "ياريت فعلا يطبق هذا النظام فى معظم المساجد لاننا فعلا نعانى من عدم التركيز بسبب الاطفال ولو ان دة مش هيمنع الشجار ولكنة سيقل مع ان هذا المكان بالذات لايصح ان يحدث فية مشاجرات مهما كانت درجتها لانة لايتفق مع حرمة وجلال هذا المكان ومع حالة لخشوع والروحانيات الجميلة والتى يجب ان يتحلى بها كل من ذهب الى المسجد وخاصة فى هذا الشهر الكريم وكل عام والامة الاسلامية بألف خير واحسن حال"
archived = "2010-03-14"
