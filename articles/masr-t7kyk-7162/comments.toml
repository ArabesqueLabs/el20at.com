[[comments]]
order = 1
subject = "كانت تذهب مسرعة لأداء صلاة التراويح في مسجدها المف"
author = "اكتب اسمك هنا"
posted = "2007-09-24"
text = "اشمعنى الهرم يعني اللي انتو مركزين عليه<br />يا اخي ما تشوفوا احياء الناس الغلابه اعملوا فيها تحقيقات<br />في حلوان مثلا ولا المرج ولا دول مش بشر في نظركم<br />روحوا اعملوا تحقيقات هناك كده ولا ياي تخافوا تدخلوا حتت زي دي"
archived = "2010-03-14"
capture_url = ""

