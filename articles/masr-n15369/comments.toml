لجنسي بس كثرة المغريات والمثيرات مع صعوبة الزواج اما بالنسبه للمتزوجين فهم ايضا يعانون من الكبت الجنسي لعدم وجود الثقافه الجنسيه لدى الزوجه والتي لا تعرف ادنى شيء عن المعاشره الجنسيه مما يؤدي الى عدم استمتاع الزوجين في المعاشره وخاصه اذا كان احدهما عنده الطاقة الجنسيه الهائله والاخر يعاني من برود مما يؤدي الى البحث عن وسيله اخرى او زواج اخر يشبع رغباتهم وانا اتكلم من واقع تجربه خاصه امر بها حيث انني الى الان اعاني من عدم وجود زوجه تشبع رغباتي وتكون قادره على امتصاص الطاقه الجنسيه التي امتلكها مما دفعني للبحث عن زوجه اخرى تسعدني وتحقق الهدف المطلوب وما زال البحث جاريا thespider66@hotmail.com<br />21 - ما أروع التكنولوجيا<br />حكيمة|22/04/2008 م، 11:31 صباحاً (السعودية) 08:31 صباحاً (جرينتش)<br />أين الرجال لقد صاروا أنصاف رجال لا حول و لا قوة إلا بالله العلي العظيم هذه الزوجة شجاعة هذا النوع من النسوان ما يصلح يكون أب أو زوج<br />22 - مراهق<br />نهى |22/04/2008 م، 11:32 صباحاً (السعودية) 08:32 صباحاً (جرينتش)<br />طاح حظه..و الله الرجال دول مشكله..مو مرتك عندك !! ايش تبغا بدول اللى بتستعرض لهم!! ياويلي ما اكترهم الهبل دول ..اللهم لا شماتة ..و على قولهم البيوت اسرار ..الله العالم ايش المشكله بينهم و ليش سوى كدا.و الله خبر يضحك من الصبح ..صعب انو نقول تفكير عربي و لا مسلم ولا نجمع كل الذكور ..لان دي حركات اكترهم الرجال من كل الجنسيات و الثقافات و ما نقدر نقول الانترنت لانو قد ما هوا مفيد كمان ضار ..علشان كدا راح اقول الله يهدينا كلنا و يسترنا كلنا ..اللهم لا شماتة<br />23 - كفايه يا عربية أخبار تافهه<br />&--9786;مصرى و افتخر&--9786;|22/04/2008 م، 11:32 صباحاً (السعودية) 08:32 صباحاً (جرينتش)<br />كفايه يا عربية أخبار تافهه . والأن سوف ينكب المعلقين على التعليقات التافهه مثلهم و يشتمون فى مصر و المصريين وقبلها كانوا يشتمون فى الجزأئريين و قبلها فى السعودييون و هلما جر فى الى اين يا عربية بأخبارك التافهه<br />24 - منيح<br />رفيف |22/04/2008 م، 11:32 صباحاً (السعودية) 08:32 صباحاً (جرينتش)<br />الزوجه معها حق لانوا أنتقص من قيمتها<br />25 - اذا كانت عضلات فقط ايه المشكلة<br />فوتوشوب|22/04/2008 م، 11:34 صباحاً (السعودية) 08:34 صباحاً (جرينتش)<br />هى ممكن تكون عايزة تتطلق من زمان ووجدتها فرصة للخلاص<br />26 - اتبع ما يلي لن تظل ولن تندم ولن تحزن مادمت تلتزمها<br />فاطمه |22/04/2008 م، 11:35 صباحاً (السعودية) 08:35 صباحاً (جرينتش)<br />1- كلمتان خفيفتان على اللسان ثقيلاتان في الميزان {{ سبحان الله وبحمده سبحان الله البعظيم }}فأكثروا منها 2-{استغفر الله الذي لاأله هو الحي القيوم واتوب إليه}سبب في رضا الله وزيادة في الرزق ويهب الله لك البنيين والفرج من الهم والسعادة فأكثروا منها 3- {{ حسبنا الله ونعم الوكيل }} سبب في نصرة الله لك من اي ظلم او جور او تعسف فأكثروا منها 4- {{لاحول ولا قوة إلاّ بالله }} كنز من كنوز الجنة آلاّ تتزود من كنوز الجنة ؟؟؟ فأكثروا منها<br />27 - والله يوجد شي مثير للاهتمام<br />محمد الاماراتي|22/04/2008 م، 11:36 صباحاً (السعودية) 08:36 صباحاً (جرينتش)<br />يااخواني هذا النت مليان الغام ومليان ورود كما يقال بالتالي علينا الانتباه فمثلا احد الاشخاص اراد الانتقام من فتاة ليعطي رقم هاتفها عبر مواقع الدردشة لعدة اشخاص حتى يوهمهم بانها عاهرة مع انها متزوجة ومتدينة وهنا صارت بين الزوج والزوجة وبين المتصلين مشاكل مع الشرطة اقول للحكومات الكريمة نرجو ان ينتبهوا لهذا الامر فما ادراني قد يصورني احد عاري في الفندق او يلتقط صورة ويفبركها او قد يعمل احدهم فيروس على جهاز الكمبيوتر ويسرق كل الصور اذن اعتقد اننا يجب ان لانلوم هذا الشخص قبل ان نتاكد تماما من صحة الصور ويجب مخافة الله عند استخدام النت لانه وسيلة خطيرة بصراحة ان لم تحسن استخدامها وينشر الصور عبر موقع يو تيوب او احد المواقع معالشكر للعربية لتفجير مثل هذا الموضوع المهم جدا كل التحية للشعب المصري والعرب والسلام عليكم<br />28 - الحمد لله أقلعت عن ادمان الشات منذ فترة<br />سلكاوى المصراوى|22/04/2008 م، 11:37 صباحاً (السعودية) 08:37 صباحاً (جرينتش)<br />أدعوا الله ان يثبتنى على اقلاعى عن الشات لانه ادمان خطير ومدمر للوقت والتفكير والاخلاق .. بعد سنوات طويلة فى تعاملى مع هذا الادمان تيقنت تماما انه لا فائدة على الاطلاق ولو حتى واحد على مليون من الشات و اجذم ان 100% من الشباب فى غرف الدردشة يبحثون عن فتيات و 100% من الفتيات يبحثون عن الشباب وتحت اى مسمى سواء تعارف او صداقة وا جنس او او .. كل هذه حجج فارغة ومبررات للاستمرار فى الادمان ...<br />29 - يا ساتر والفضايح - ربنا يستر علينا نحن الرجال<br />خالد |22/04/2008 م، 11:40 صباحاً (السعودية) 08:40 صباحاً (جرينتش)<br />الله يصلح كل الرجال ويخليهم عند حسن ظن زوجاتهم بهم خصوصا هذه الايام مع انتشار مواقع الشات والكلام الفاضي على الانترنت راقبوا الله يا شباب ويا رجال وغضوا ابصاركم وتجنبوا مالا يليق بمسلم يرجو رحمة الله ويخاف لقاءه وهو مذنب<br />30 - المختصر المفيد<br />????????????|22/04/2008 م، 11:41 صباحاً (السعودية) 08:41 صباحاً (جرينتش)<br />خبر عبيط وأهبل زي إلي كتبه ونشره !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!<br />31 - عيب عليك يالعربية<br />سبحانك الهم وبحمدك استغفرك واتوب اليك|22/04/2008 م، 11:42 صباحاً (السعودية) 08:42 صباحاً (جرينتش)<br />لهذه الدرجة وصلت يا عربية الايوجد قضايا اهم يمكن مناقشتها غير هذه المواضيع<br />32 - بدون تعليق<br />عابر سبيل|22/04/2008 م، 11:42 صباحاً (السعودية) 08:42 صباحاً (جرينتش)<br />لا حول ولا قوة الا بالله<br />33 - يمكن من الملل<br />DANY|22/04/2008 م، 11:42 صباحاً (السعودية) 08:42 صباحاً (جرينتش)<br />يمكن الزوج يحبها ولا يستطيع الإستغناء عن زوجته, ولكن الملل دفعه لتلك المغامرة, يمكن بالواقع ليس لديه مغامرات عاطفية حقيقية, ولكن على النت فقط, انا أخالف الزوجة على تصرفها السريع, ولكن يمكن إنها خجلت من جارتها لأنه وضعها بموقف لا يحسد عليه! الله يستر على الناس ويجب على الناس الحذر وعدم الدخول بتلك المواقف من الأساس!<br />34 - هايدي ...صائد الاحلام<br />سارة من المغرب|22/04/2008 م، 11:44 صباحاً (السعودية) 08:44 صباحاً (جرينتش)<br />اهلا هايدي انا كنت فاهمة انا الخرقوم هيتفهم اكتر من الزعفران لان كنت فاكرة كمان الزعفران كلمة بس مغربية واول مرة اعرف انكم انتم ايضا تقولو ن عليه الزعفران وانا لما كتبت في التعليق اللي فوق انه اسمعه الزعفران قلت في نفسي حكتبه واحلله اكتر عشان يتفهم اكترمن الخرقوم المهم حصل خير ياهايدي اهو انتي عرفت شو يعني الخرقوم وانا عرفت انا الزعفران كلمة ايضا مصرية المهم الله يبعد علينا التارترازين ههههههه ..صائد الاحلام اهلا بك اخي انا مش مشكلة كبيرة ولا حاجة انا انسانة جد جد بسيطة احب امزح واضحك جدا انا لما ارجع من عملي مهدودة بصداع الاطفال واسئلتهم التي لاتنتهي اجد نفسي عايزة امزح واضحك ولا تنسى يصائد البعد عن الوطن والاحباب والغربة تلعب دور كبير جدا في انا الانسان يعوض هدا الشيئ باالتخفيف عن نفسه باالضحك والمزح وليس كل الدي اقوله في تعليقاتي هو صح وانما فيه شيئ من الضحك خصوصا في المواضيع التي لااتقبلها اما خفة الدم والمزح لقد تعلمتها منكم (ممتلتي المفضلة التي تضحكني جدا نعيمة الصغيرة الله يرحمها )انتم الاساتدة انتم اصحابه يعني خامة مادة الضحك صنع في مصر egypt produkt شكرا لك على كلامك يصائد وانا فعلا معجبة جدا بتعاليقك التي فيها نوع من الفلسفة والحكمة ولا انسى ردك على صاحبة الفستان لما افتكرنا انها ستغادر تعليقك كان جدا رائع ولقد ابكيت وانا اقراه واشكر العربية من كل قلبي انها كانت السبب في التعارف فيما بيننا نحن جميعا<br />35 - أعزك الله ياصالحة<br />محمد كرن التكينة|22/04/2008 م، 11:44 صباحاً (السعودية) 08:44 صباحاً (جرينتش)<br />بنت ناس وشريفة وعفيفة وربنا يحفظك ويرعاك<br />36 - شو يعني مرتك مو حلوة<br />الحقيقة انو .............|22/04/2008 م، 11:46 صباحاً (السعودية) 08:46 صباحاً (جرينتش)<br />شو لك خال يعني المدام مانها حلوة عم طق حنك مع نسوان مو معروفي قرعت أبوهن منين ها<br />37 - لاحول ولا قوة الا بالله<br />|22/04/2008 م، 11:46 صباحاً (السعودية) 08:46 صباحاً (جرينتش)<br />\"قال رسول الله صلى الله عليه وسلم : لا تقوم الساعة على رجل يقول لا اله الا الله \"،،،،،،،،،،،،،،، أي أن الأمم ستبقى في انحطاط أخلاقي وديني حتى تصبح كلمة لااله الا الله ثقيلة على اللسان !!!!! فناسأل الله العفو والعافية<br />38 - b55asm@hotmail.com<br />راس غليس|22/04/2008 م، 11:48 صباحاً (السعودية) 08:48 صباحاً (جرينتش)<br />أشوى ماني متزوج يعني محدا الو عنا شي<br />39 - مشكله<br />الاسد السني |22/04/2008 م، 11:48 صباحاً (السعودية) 08:48 صباحاً (جرينتش)<br />المشكله أن هناك الكثير على شاكلة هدا الزوج العاصي لربه والمدنب بحق زوجته فيجب تطليق الزوجه ؟<br />40 - غبى<br />moodi74@hotmail.com|22/04/2008 م، 11:50 صباحاً (السعودية) 08:50 صباحاً (جرينتش)<br />مادرى يعنى مو مكفيتو زوجتو يستعرض قدامها اكيد عندو نقص شايفين هى مساوئ النت على كلا للتواصل moodi74@hotmail.com<br />41 - اذا لم تستحي فصنع ما شئت<br />العبسي- يمن|22/04/2008 م، 11:53 صباحاً (السعودية) 08:53 صباحاً (جرينتش)<br />من أسماء الله \"الـســـتـــــار\" بس نحن العبيد نفضح