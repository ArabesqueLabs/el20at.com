text = "[quote name=\"يزيد\"]تستاهل القناة والفتاة . كانت حلقة وقحة من جد . وإلى الأمام أيها القضاء السعودي[/quote]<br />امام مييين ما احنا عارفييين كويس ان 80% منكو شاذييين متزوجيين و مخلفيين و شاذين كبار و صغار ... و قضاء سعودي ايش بس ... انتو معاهم معاهم عليهم عليهم ... لو سعودي صدم و لا سب اردني و لا هندي و لا مصري و راحو الشرطة ما يصيرله شي بالعكس ممكن كمان ياخد منهم فلوس ... أقذر شعب في أطهر أرض ... ما عرفت فيكم أكتر من 4 أو 5 كويسيين و الباقي شاذييين ...يا راجل ده كان في شاذ عندو 50 سنة متزوج و مخلف و ابنه متزوج و كان يبيني أنا و صديقي ننام معاه بعد ماننام مع زوجته الاندونيسية ..."
