[[comments]]
order = 4
subject = "فينك يا عم"
author = "ابوشنب"
posted = "2008-01-18"
text = "فينك يا عم انت<br />ده مأمون نزل حته خلاصة عن برنامج هيكل في الجزيرة شكلها ما عدتش عليك<br />اسمع يا سيدي<br />* عندما بدأت الزيارات المتعددة لوفود عالية المستوى بين الاسرائيليين وقطر.. لم يعد يصلح احمد منصور أو حتى صاحب الصحيفة القطرية في إحدى العواصم العربية او صاحب الصحيفة القطرية في إحدى العواصم الغربية، هذا النوع من التضليل يحتاج الى دعاية اكبر، بالراء هنا وليس بالياء، لا يحتاج الى عالمة او صبي عالمة، هذا يحتاج الى ما يقابل تحية كاريوكا في عالم الصحافة، يحتاج الى استاذ في فن الدعاية والتضليل.<br />الصفقة بين قطر واسرائيل وصلت الى مستويات اكبر والى طرق اعقد، هنا، ولتلطيف الصورة ، قدمت لنا «الجزيرة» برنامجا تكلفته عشرات الملايين، برنامج «مع هيكل»، محاولة بذلك استخدام اسم الرجل وماضيه، برنامج «مع هيكل» قد لا يدوم طويلا على قناة الجزيرة، ليس لأن هيكل ممل وان اسلوبه ضد فلسفة الصورة، كما قالت زميلتنا ديانا مقلد، ولكن لأن هدف القطريين هو القيام بحملة التضليل حتى تمر الصفقة، فمتى ما انتهت الصفقة انتهى البرنامج بالنسبة للقطريين.<br />12 ديسمبر 2005 العدد 9876"
archived = "2010-03-14"
capture_url = ""
