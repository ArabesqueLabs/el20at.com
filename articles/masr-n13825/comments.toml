[[comments]]
order = 0
subject = "اخر العمالقة فى مصر"
author = "رجل شارع عادى"
posted = "2008-01-14"
text = "ويبقى هيكل اطال اللة فى عمرة اخر عمالقة الصحافة العالمية والرجل الذى يحترم عقلية قارئة - لا تحس ابدا انة ينافق بخسة كبعض صحفى صحف العائلة المالكة فى مصر المسماة قومية<br />يعلمنا فى كل مقالة نقرأها او نسمعها شيئا جديدا فى السياسة لم نكن نعلمة من قبل<br />استاذ قارىء مطلع خبير بالسياسة يؤخذ رأية من كبار السياسيين العالميين ورأية محل احترام<br />وطبعا البقر ليس فى حاجة الى ارائة فأدمغة البقر تجتر الجهل والتخلف والتبعية<br />ولا يهز فى الاستاذ شعرة ان تسلط على الاستاذ والمعلم بعض غلمان الصحافة المخصييين لمهاجمة عملاق اكبر واطول من كلامهم الذى لا يلتفت الية احد<br />تحية استاذى هيكل وامد اللة فى عمرك"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117043034/http://masr.20at.com:80/newArticle.php?sid=13825"

