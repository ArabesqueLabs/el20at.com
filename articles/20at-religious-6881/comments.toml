subject = "محمد نواف الحمدالله ..."
author = "إلى محمد السيد ... تدخلك بشؤون"
posted = "2007-12-27"
text = "هذا ليس من شغلك يا محترم .. فأنت لست بأردني كي تعلق وتسخر وتستهزأ .. أقول لك ولأمثالك .. اذهبوا بعيداً واهتموا بشؤونكم فقط .. ثم ياعزيزي، أنت تحسب بأن مصر أفضل حالاً من الأردن .. لا يا أخي أنتم على حافة الهاوية .. فالحكومة المصرية .. \" حدث ولا حرج \" ..<br />ثم أن الشعب المصري .. هو أفقر من الشعب الأردني .. وأنا لا أقول هذا القول أو الكلام لكي أسخر واستهزأ بكم .. ولكن ؟!<br />أنا أصحح لك معلوماتك القيمة .. بأن كلا الشعبين فقيرين .. وكلاهما يعانيان من شدة الغلاء، وماشابه ذلك ؟!<br />الإسلاميين _ بشكل عام _ هم أساس المصائب التي تحصل أو قد تحصل بالأردن .. فهم أناس متعصوب لدرجة بأن الشخص لا ولن ولم يتوقعها على الأطلاق .. فهم أيضاً ( الإسلاميين )، يقولون كثيراً، ويرفعون شعاراتهم البراقة، ويضيؤون هذه الشعارات الرنانه بأن المستقبل منتظرنا .. ويجب أن نبذل قصارى جهدنا للمضي قدماً، وأن ننسى الماضي .. ؟!<br />يعني .. أبالله عليكم ..<br />* هل الإسلاميين قادريين على محاربة الفقر المدقع بالأردن .. وأن يصرخوا بوجه الغلاء .. وأن يمثلوا الشعب بالشكل الصحيح السليم، دون أي تعصب أو حتى تفريق .. أو أنهم يملكون المال الكافي لكي يعيشوا هذا الشعب .. ؟؟؟ !!!"
