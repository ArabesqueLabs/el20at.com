[[comments]]
order = 1
subject = "المسؤولية صعبة"
author = "عادل المغربي"
posted = "2008-07-28"
text = "بداية اشكر الصحفية على هذا الموضوع الذي يفتح لنا المجال لكي نسمع عن قرب طموحات فتياتنا لو تحملن مسؤولية كبيرة..لكن ما غاب عن ذهن المستجوبات هو كم القيود التي ستفرض عليهن بحكم انهن زوجات لملك البلاد.. كيف سيتعاملن معها.. المستجوبات نظرنا فقط الى الامر من جانب انهن سيغيرن المجتمع ويصلحن البطانة ويتمتعن بالاسفار.. لكنهن لم يتحدثن عن معاناة البرتوكولات الرسمية التي سيوضعن فيها .. هل فعلا سيستطعن ان يقبلن ان يكن زوجات للملك بتلك القيود؟ هل يفضلن البقاء زوجات لمواطنين عاديين بما هو متاح لديهن من مساحة وحرية ؟ عوض التنقل في مواكب كلها مخططة ولايسمح فيها بهامش للخطأ او الشفاهي كما نقول..<br />مع تحياتي لكل من حلمن بأن يكن زوجات الملك"
archived = "2010-03-14"
