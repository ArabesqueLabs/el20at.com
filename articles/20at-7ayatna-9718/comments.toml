[[comments]]
order = 7
subject = "حكمة"
author = "ماجدة"
posted = "2008-08-31"
text = "ما أجمل البساطة ، و راحة البال و قلة المسئوليات و العمل فى صمت و ثبات و انتظار الحرير و النعيم فى دار الاستقرار و القرار ، لا ملك و لاجاه و لا سلطان و لا مال و لا شهرة يتحمل الإنسان عنه السؤال يوم الحساب ، فلنرض بما أنعمه علينا الرحمن و لا نتطلع للأفضل سوى فى العلم و العمل و الدين و رضا الرحمن و حب الحبيب المصطفى<br />و إذا أنعم الكريم علينا بفضله فى الدنيا بأن أصبحنا ذوى ملك أو جاه أو مال فلنتق الله و لنسأله العفو و العافية فى الدنيا و الآخرة ، و لا ننس أبداً مقولة الصحابى الجليل عمر بن الخطاب رضى الله عنه و أرضاه ( لو أن دابة فى أرض العراق تعثرت و هو فى المدينة ، لسئل يوم الحساب عنها و لماذا لم يمهد لها الملك ) و لنتذكر أيضاً مقولة هارون الرشيد يوم وفاته ( يا من لايزول ملكه ارحم من زال ملكه ) و قوله تعالى ( ما أغنى عنى ماليه ذهب عنى سلطانيه )<br />اللهم ارحم المسلمين و المسلمات الأموات منهم و الأحياء"
archived = "2010-03-14"
capture_url = ""

