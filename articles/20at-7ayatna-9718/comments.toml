subject = "ماذا لو أصبحت للا هل بإمكانك تحمل هاته التبعات"
author = "زعري"
posted = "2008-10-27"
text = "بسم الله أر كل فتاة في المقال تريد تحمل هاته المسؤلية وتحاول أن تغير المجتمع مع وجهة نظرها حسب النقص الذي تعاني منه في محيطها ولكن ألم تتسأل أي منهن ماذا لو فشلت وهاذ شيء أكيد ألم تفكر أنه سوف يأتي يوم تمتد إليها 30 مليون يد لتطالب بحقها و ملاين من أجيال اللاحقة إن لم نقل الملايير يوم يقف الناس في سف واحد أمام الله عز وجل في الحقيقة بدون أن أطيل عليكم أتمنى الفكرة أن تكون قد وصلت ولكن كنت أتمنى أن أجد فتاة في المقال لم تتمنى أن تكون للا"
archived = "2010-03-14"
