subject = "هو في ايه؟"
author = "الباشا"
posted = "2007-05-12"
text = "ايه علاقة الموضوع بمهدي عاكف ولا برسوم ياخوانا...هو في ايه بس...لكم دينكم ولي دين...<br />صحيح احنا في زمن العبث...كل واحد شايف ان اللي بيعملوا ثوابت وان اللي بيعمله غيره هو الاستثثناء<br />-وادعو ال سبيل ربك بالحكمة والموعظة الحسنة- مش بالشتايم وقله القيمة...<br />تحياتي لكم واحترامي"
