subject = "دعوناا نتكلم بصراحة"
author = "مصطفى"
text = "لو جيناا نفكر فى كم المليارات التى تهدر فى الاشياء المخلة بالشرع والمخلة بالحياء مثل الافلام الاباحية والقنوات الغير شرعية والفيديو كليبات وغيرهاا فلن نجد لهاا حصر<br />ولو جئناا ايضاا نفكر فى الناس الذين يحتاجون لهذه المبالغ الهائلة ونحن لا نفكر فى الهائلة احناا بنفكر فى المبالغ التى تعين الانسان على المعيشة ولو نظرناا كم من الملاين الذين يموتوت من الجوع ومن فقرهم<br />بصراحة ده السؤاااااااال وايضاا ترادنى اسئلة كثيرة واراء اكثر بس ده السؤاال اللى نفسى يوصل لكم......"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

[[comments]]
order = 60
subject = "اين الامة الاسلامية من كل هذاااا"
author = "مصطفى"
text = "انا نسيت المرة اللى فاتت انى اسلم على الموجودين اعذرونى<br />السلام عليكم ورحمة الله تعالى وبركاته<br />يا جمااااااعة رسلوناا الحبيب عليه افضل الصلوات واذكى السلام قال (من راْى منكم منكراا فليغيره بيده فان لم يستطع فليغيره بلسانه فان لم يستطع فليغيره بقلبه وهذاا اضعف الايمان) فاين نحن من كل هذا من منا راى منكراا وغيره بيده او بلسانه او بقلبه وانا اعلم ان البعض يعمل بالحديث الشريف والبعض الاخر الله اعلم وكلناا نعلم ان فى هذا الزمن ازمن ز ىما بيقوله اتقلب حاله بمعنى ما عدش لا فى لا حياء ولا اى شئ ولا احد يغار على دينه ومش كله ايضاا فى ناس وناس فلماا انا اشوف حاجة واليعوذ بالله وحشة ما جيش اقول يا شباب ده فى فيلم كذاا وكان فيه مشهد كذاا انت كداا بتساعد على انتشار هذا الفاحش وتكون ايضاا انت واحد منهم لا تفترق عنهم فندعوا الله تعالى ان يردناا الى ديننا مرداا جميلاا ونستغفر الله تعالى"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

