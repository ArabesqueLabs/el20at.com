[[comments]]
order = 54
subject = "كفاية بقى"
author = "المصري"
text = "التعليقات المتطرفة المتغطية بالفضيلة و الى بتدعى ان نجيب ساويرس بيعمل كدة علشان نصرانى و علمانى و كلام كله تعصب و تطرف ، مش كفاية بقى قرفتونا دمرتوا مصر بكمية الكراهية و الحقد على كل شئ ، يا ناس الناس وصلوا لحد المريخ و صوروا و احنا شاغلين نفسنا بكلام فارغ و ادعاء الفضيلة و معظم الناس ما ليها دعوة بالفضيلة خالص . انا عارف ان ناس كتيرة مش حيعجبها الكلام و تبتدي تهاجم و تشتم لكن ان جالك العيب من اهل العيب ما يبقاش عيب"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

[[comments]]
order = 55
subject = "حسبي الله ونعم الوكيل"
author = "محمد المصري"
text = "اولا انا مليش علاقه بالمصري اللي رد في الموضوع قبلي ،، انا رأيي ان الشباب يبدأوا يشنوا حملة علي كل شركات ومنتجات سويرس ، مهو مش بفلوسنا يا سعاده الملياردير ،، لازم يبقي في رقابة علي القنوات الفضائية المصرية<br />ولا هم فالحين بس يهددوا بقفل قناه الناس لأن مركزه علي الجانب الأسلامي وبدأت تبعد عن الثقافي وكلام من هذا القبيل ، حسبي الله ونعم الوكيل ، حسبي الله ونعم الوكيل"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

[[comments]]
order = 56
subject = "ضع عنوان التعليق"
text = "اهو واحد من العاملين نفسهم من اهل الفضيلة ، طيب يا سيدي و ماله ، انا المصري الحقيقى بقول حسبي الله و نعم الوكيل من كل من يدعى التدين و الفضيلة و يداري تخلف المجتمع وراء تلاكيك ، طيب انت مش عاجبك القناة ما تتفرجش عليها و لا هو ايد فى المياة و ايد فى النار ، يا ناس الكمبيوتر اللي احنا بنستعمله علشان نكتب هذا الكلام مصنوع فى دولة تانية مش كان احسن نصنعه احنا بدل ما نتلكك لبعضنا على الهايفة ، و لعلمك يا سيدي الفاضل اننى مل ليش دعوي بالسيد ساويرس لكن معجب بيه لانه بيساعد الطلبة الموهوبين بمنح من فلوسه و عامل منظمة خاصة لدعم العلم ، مش كدة احسن و لا مهاجمة كل شئ جميل احسن ، يا ناس اصحوا بقى !"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

