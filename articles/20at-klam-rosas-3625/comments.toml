text = "الى بشتم صلاح الدين الى حررهم من الرومان الى كانو مخلببن كنا يسهم تحت الارض<br />على فكره هو عمر مش صلاح<br />دولقتي لم صوت لان هي دي سماحة الاسلام<br />الي بيدعي لاسرائيل يمن مبسوط من اسرائيل علاشان صلبوا ربهم<br />صحيح<br />اذا اكرمت الئيم تمردا"
