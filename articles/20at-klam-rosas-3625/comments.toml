[[comments]]
order = 34
subject = "ضع عنوان التعليق"
text = "فيه ناس بتقول اللي مش عاجبه يقفل<br />دي نفس ايديولوجية تقنين الدعارة<br />واحدة بتعرض نفسها<br />واحد بيشتري<br />ملناش دعوة<br />الفكرة ان مفيش حاجة اسمها غير المحطة يا اذكيا<br />التلفزيون بيعرض في القهوة ..على الرصيف.. في المول.. في كارفور.. في التيك اواي<br />احنا مش في العصر الحجري لما كان اللي عنده تلفزيون عنتر زمانه<br />ياجماعة<br />.. اللي مش عاجبه.. يقاطع موبينيل.. يقاطع الشركة اللي بتدعم البورنو ده على otv<br />اما الاستسلاميين اللي بيقولو ما كله بيشوف كل حاجة.. يراجعوا نفسهم<br />الانهزامية دي -ويفتكروا كلامي- هاترجع عليهم في يوم من الايام<br />what goes aroung.. comes around<br />انتو بتفترضوا ان السواد الاعظم من الناس بالصورة اللي انتو شايفينها.. لكن بيقولوا اللي بيشوف الدنيا على صورة بيكون ده انعكاس لحقيقته هوة<br />ثم ان المجتمع لازم يوفر للمحترمين فرصة حياة.. مش يحاصرهم..<br />اذا كانت القنوات والمشاهد دي موجودة مشفرة.. لازمتها ايه تبقي مفتوحة؟"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

[[comments]]
order = 35
subject = "ضع عنوان التعليق"
text = "ناس كتير قوي بتشرب سجاير<br />ناس كتير قوي بتشرب بانجو<br />ناس كتير قوي بتغلط<br />ناس كتير قوي بتاكل حاجات فيها مواد كيماوية ضارة<br />العالم كله بيفرض قوانين جودة على كل شئ<br />مبيسيبوش ليه اللي ينتج ينتج واللي يشتري يشتري<br />اشمعنا في الاعلام بنقول اللي مش عاجبه يبقى مايشتريش<br />لو طبقنا نفس القاعدة يبقى اللي عايزة يعمل منتج غذائي فيه شئ مضر .. يكتب عليه.. واللي مش عاجبه.. يغير المحطة"
