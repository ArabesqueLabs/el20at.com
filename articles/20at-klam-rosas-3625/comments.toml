subject = "كاتب المقال مخطئ أكثر من القناة"
author = "غيور"
text = "كانت النكتة القديمة تقول أن الشيخ في المسجد أخذ ينصح الناس أن لا يقرأو المجلة الفلانية (ويسميها باسمها) لأنها تحتوي على صور خليعة وأخبار فاضحة لا تليق بالمجتمع المسلم<br />وفي الجمعة التثانية أتاه بائع الجرائد قبل الخطبة قائلا:<br />- المجلة دي بقى أقح من اللي قبها عايزينك تقولينا فيها كلمتين جامدين<br />والمعنى أن الشيخ قدم بدو ن أن يدري دعاية مجانية للمجلة تجعل من في قلبه مرض يشتريها"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

[[comments]]
order = 65
subject = "كفاية جهل و تخلف بقى"
author = "عماد المصري"
text = "متعرفوش ان نسبة كبيرة جدا من الطلاق في مصر بسبب الجهل الجنسي و دا مش للنساء بس دا للرجال كمان<br />يا ناس فوقوا من اللي انتوا فيه .. دا في امريكا و اوروبا الاطفال في سن المراهقة بتاخد مادة تربية جنسية في المدرسة .. جايين على حتة فيلم .. انا اتفرجت على الفيلم دا من 6 سنين مفهوش اصلا اي مشهد مثير .<br />كفاية جهل و خليكوا في حالكوا<br />على فكرة القناه جميلة و بتفرج عليها دايما .. و سازيرس افضل رجل اعمال مصري .. و نص شباب مصر شغالة في مشاريعه .. يعني من الاخر نص اقتصاد البلد في ايده ..<br />انتوا بس محروق دمكم عشان انتوا فشله و مش عارفين تعملوا 1% من اللي هو عمله<br />يا حقدة"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

