[[comments]]
order = 13
subject = "واية المشكلة لو اتعرض في التلفزيون .."
author = "Blue Sea"
text = "السلام عليكم ورحمة الله وبركاتة<br />انا نفسي اعرف .. هو المشكلة دلوقتي ازاي فيلم زي دا يتزاع علي قناه فضائية<br />ما الافلام دي ما اسهل انها تتنقل بين الشباب علي الهاردات إللي رايحة جاية<br />و إللي معندوش بياخدها علي اسطوانة والاسطوانة بجنية ...<br />يعني إللي عاوز يشوف فيلم زي دا و غير من الافلام حيشوفها و حيجيبها ... مش حيستني يتعرض في القناه<br />علي لاقل يوم ما يتعرض في التلفزيون حيبقي في رقابة من البيت مش لازم من الرقابة نفسها<br />( دا لو فرضنا انها بتفرق مع حد فيهم ) وحيقفل التلفزيون او يحول القناه او حتي يلغيها خالص من الجهاز<br />يبقي المشكلة لا في القناه ولا في ساويرس ... المشكلة في الشباب و في المجتمع نفسة<br />إللي مقفل دماغة و لسة عايش في زمن التلفزيون و الاقمار الصناعية ... في الوقت إللي النت دخل فية كل بيت<br />ياريت منمسكش في ذيول المشكلة .. سواء فيلم او قناه<br />المشكلة الاساسية هي انعدام الحياء في المجتمع و غياب الوعي عند الجميع إلا من رحم ربي...<br />وزي ما بيقولوا ... إذا لم تستحي فافعل ما شئت ( لانه لا حتفرق معاه صح و لا غلط و لا حرام و لا حلال )<br />إذا لم تستحي ياسويرس فاعرض ما شئت ( طبعا الراجل بينادي بالحرية و الجراءة .. والجراءة جزء من الشجاعة ..إلخ)<br />وإذا لم تستحي ايها الشاب فشاهد ما شئت ( ودي حرية شخصية ومحدش لية انة يدخل في حياه حد.. تمام كدة)<br />وإذا لم تستحي أيتها الفتاه ... فارتدي ما شئتي ( وبعدين دي موضة .. يعني مش عيب .. متقفلوش دماغكوا كدة easy)<br />وكل واحد مسؤول في النهاية ... مسؤول عن نفسة مسؤول عن دينة ... وفي الاساس مسؤول قدام ربه"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

