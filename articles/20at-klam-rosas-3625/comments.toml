subject = "انا شايف ان دى قناه جامدة وعرضت فيلم كموديى ليس الا"
author = "احمد سامى"
text = "بصراحة قناة جامدة وشبابية جدا وبالنسبة للفيلم هوا فليم كومدى والهدف منه الضحك وليس البحث عن منظر سكس الفكرة كلها ان الاس مش لاقيه حاجة تقولها وغير كده فى ملايين الافلام الخرا العربية واعتقد ان الناس كلها دخلتها فى السنيمات ما تشوفوا فيلم عن مثلا عمارة يعقبيان لما بتكلم عن شزوذ جنسى وحاجات تانية هل الفكرة كانت واضحة للناس والعيال الصغيرة دولقتى العيال الصغيرة فاهمة كل حاجة من الاغانى والكلام ده والناس نفسها المهم مش مشكلة الفكرة كلها يشوفوا حتى الشو تايم واللى بيعرض فيها شبكة خاصة لاكن بردوا بيشوفها العائلات<br />عادى كبر دماغك انت وهوا واتفرج وعيش مش عاجبك اقلب القناة او احذفها انت تاعب نفسك ليه ؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

[[comments]]
order = 28
subject = "مش عارفة اقول ايه؟"
author = "شرين منصور"
text = "السلام عليكم أولا انا مش عارفة هل الاخ بتاع جامعة الدول العرببية بيتريأ ولا ايه؟ انا لا حليت مشكلة ولاحاجة انا زيي زي اي حد بيعلق على الكلام ،انا قلت اننا سبنا كل حاجة وجايين على ؟otvنروح الاول نشوف ايه اللي احنا بنعرضو على الشاشات وبعدين مهو الافلام الاجنبية متعودة على انها تطلع علاقة جنسية كاملة والكل عارف كدة انا طبعا بحيي جدا كاتب المقال وياريت يبقى ملف مفتوح لأن واضح اننا عايزين رقابة تاني على شاشاتنا وعلى الشاشات السينما، فيا اصحاب الشاشات الصغيرة والشاشات الكبيرة السينما ارحموا من في الارض يرحمكم من في السماء وراعوا شبابنا باة"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

