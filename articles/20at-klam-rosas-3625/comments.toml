text = "هية ناقصة . مش كفاية المحطات الامريكية والاوربية والاسرائيلية فلازم كمان محطات عربية ويلله خلى الكل يتفرج وياترى الفلم التالى إيه والمحطة التنية هيكونإسمها إيه<br />المحطة موجهه للشباب العاطل الفاضى إللى مالوش شغلةو لا مشغلة غير الجلوس على القهوة والفرجة على قناة x tv<br />وسلم على القيم والأخلاق والمبادىء أصلها مابتوكلش عيش"
