text = "الاسلام فوق الجميع<br />والاسلام هو الحل<br />كفايه ان الاسلام معلن<br />لعنه الللله عليك يا وائل<br />االكلام عن الاشخاص ده مش كفايه<br />الحمد لله على نعمت الاسلام"
