posted = "2009-08-06"
text = "والله برافو عليكي انك ترضي علي واحد عايش في ضلالة الدنيا وناسي دينة<br />بس الله يهدية لانة بجد مش فاهم الين<br />الدين الاسلامي اللي خلي ناس كتييييييييييير من المسيحيين اسلموا واشهدوا بشهادة لا اله الا الله محمد رسول الله وكذبوا علي اقربائهم والله دي حقيقة<br />بسبب حلاوتة ولانة دين يسر وليس عسر<br />دة مسيحي بل والله مسيحيين وامنوا ان دينهم دين شهوة فقط<br />ما بالك انتة يافسل من واحد مسلم مش عارف الدين<br />ربنا يهديك ياوائل"
