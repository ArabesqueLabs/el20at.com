subject = "أصلها ناقصة!!!"
author = "Ahmed Nasr"
text = "السلام عليكم ورحمة الله<br />يا جماعة الموضوع مش موضوع فيلم جنسي ولا لقطات اباحية وللا قناة عري ولا ثقافة غربية،،، الموضوع إنها مصرية !<br />هتقولولي اية الفرق يا باشا من الاباحية الشرقة والغربية هقولكم معني انها مصرية يعني هتسببلنا شغب ومشاكل زي مسألة كلامه علي الحجاب كدة ويتدخل في اللي ملهوش فيه وهتلاقوا المصريين بيتأثروا بيها بس لعلمكم بعد الفيلم الاباحي اللي اتعرض فيها مظنش ان فيه حد هيسمعلها تاني سواء مسلم ولا مسيحي ولا بوذي ولا حتي مجوسي المسلمين والمسيحيين عارفين ان الاباحية والفتنة غلط ولا سيدنا محمد ولا المسيح امرنا بكدة الا الجهله منهم اللي مش فاهمين حاجة في دينهم ودول مش موضوعنا"
archived = "2009-03-08"
capture_url = "https://web.archive.org/web/20090308031839/http://www.20at.com:80/newArticle.php?sid=7057"

