text = "بصو يا جماعه انا هفترض ان الكلام المكتوب دة صح والضجة دي كلها على فيلم اباحى عرض بالقناة اوك<br />طيب اولا محدش فينا كلنا يقدر يقفل القناة ودي حقيقة ثانيا محنا عندنا شو تى فى وشوتايم واوربى وعندنا وعندنا هية جت على دي انتو بتتيجو على الهايفة وتتصدروا بس المشكلة في الحوار دة كلة .مش ان القناة عرضة فيلم اباحى ولا علشان سويرس صحبها لا المشكلة انها قناة مصرية مية في المية ودة يسيء لسمعه مصر لذلك انا بضم صوتى لصوتكو علشان منخليش القناة تعرض فيلم زى ده تانى ممكن اى قناة تعرضة اوك بس القنوات الفضائية المصرية لا تعرض هذة الاشياء لانها تسيء لمصر امام العالم ويا رب اكون وضحت وجهه نظرى المتواضعة ولكم خاالص التحية شكرا .....<br />عمرو"
