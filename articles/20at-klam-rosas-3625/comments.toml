subject = "ضع عنوان التعليق"
text = "بسم اللة ما شاء اللة على العرب خلاص فرجت الواحد الاول كان يستنى شوية هوى يطيرو جيبة اى بنت علشان نشوف رجليها اما اليوم جالنا اللى يحل مشكلة الهوى وخلانة واحنا قاعدين فى بيوتنا نشوف اكتر من الرجل وجابلنا البنات عرايا عاوزين اية تانى المفروض نشكرة متشكرين ياعم سويرس وعلى فكرة حسابة خالصعلى كل دقيقة وكمان عملنا تخفيض للرسائل وكل دة مش عوزين تشكورة ومين عالم يمكن بكرة يجيب البنات ويوزعها على كل خط كفاية بقى عاوزين نربى عيالنا على التربية القديمة مش عاوزين تقدم واللة ياريت نرجع جهلة تانى ونختشى بقى حرااااااااااااااااااااام عليكو كفايا"
