[[comments]]
order = 39
subject = "شوفوا روتانا بتعمل ايه"
author = "واحد فاهم الدنيا كويس"
text = "يا جماعة شوفوا روتانا عرضت ايه النهاردة<br />عرضت فيلم الجحيم بتاع عادل أمام و مديحة كامل ... المهم<br />أن فى نص الفيلم فى منظر أباحى من الدرجة الأولى و هو مديحة كامل طلعت عارية تماما على بعد حوالى 1 متر من الكاميرا و مع ذلك الكاميرا لم تضع اى شىء حول جسدها و ظهر صدرها كله و نصف جسمها السفلى<br />فياريت تسيبوا الحرية و الصراحة و تشوفوا روتانا اللى عامله نفسها قناة عربية"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

[[comments]]
order = 40
subject = "ضع عنوان التعليق"
text = "يا جماعه ما هو لو كل القنوات بقت كويسه و كل المصريين بقوا عندهم اخلاق يبقى مفيش حد هايتحط ف اختبار ما بين انو يختار الوحش من الحلو او العكس ، ببساطه اللى متربى واخلاقه و دينه يمنعه من الفرجه على (كده) يحول على قناة تانيه و اللى بيشوووف الحاجات ده كل يوم عالنت و غيرة يبقى يعقد يتفرج واهى حاجه جتله ببلاش .<br />ملحوظه: لاحظتوا ان القناة اساسا مفهاش اى حد محجب ولا حتى بتجيب ضيوف محجبين ؟ يبه عايزنها تجيب افلام محترمه؟"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

