subject = "هذا هو ساويرس"
author = "وليد الباز"
text = "من خلال متابعتي لهذا الشخص منذ فترة أستطيع أن أحكم عليه أنه يحمل أجنده لإفساد الشباب والمجتمع<br />منذ أن رأيته مرة يدافع عن أحد متطرفي العلمانيه المصرية ويصفه أنه شخص حكيم ينبغي أن نسمع ونستفيد منه<br />وما ينتشر الان من أخبار حول هذه القناة من أنها تتبنى اللغة العامية السوقية وتستخدم الفاظ من أمثال الشخلعه وما تبثه من أغاني تحتوي على لقطات خارجه ثم هذا الفيلم الإباحي<br />ألا يدلل كل هذا على أن ساويرس يسعى لإفساد المجتمع<br />ولا اعلم إن كان ساويرس يتحرك من منطلق ديني أم أمريكي أم إسرائيلي<br />أترك هذا لكم"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

