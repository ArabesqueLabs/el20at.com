text = "اقتباس الادمي:<br />اقتباس واللة انة للحق:<br />تحدىىى اللة تعالى قال (قل لئن اجتمعت الانس والجن على ان يأتو بمثل هذا القران لا ياتون بمثلة ولو كان بعضهم لبعض ظهيرا)<br />هذا احسن ام الانشااااد الجنسى فى الانجيل<br />وكل غبى يظن ان رضاعة الكبير ليست خاصة برجل واحد كان صحابى ويظن انها لكل الناس فهو غبى<br />يا ابن الدغرة المسيحي نايكلك امك لحتى مبعوص منو لك انا بس بدي قلك شي بناتكن بتعشق الزب المسيحي يا ابن ال[ *** ] محمد اتجوز بنت عمرها 9 سنين يا حرام مافتحها قلبو رقيق اه عفوا زبو رقيق وفيك تشرحلي ;كيف اجا محمدك بعد ما توفى ابوه باربع سنين شو تارك ضهرو بالتلاجة بكس ام محمد"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212081833/http://www.20at.com:80/20at/arts/3625.html"

