posted = "2009-08-05"
text = "انتا بس متغاظين منة لانة مسيحى مش اكتر …<br />أولا دعك من ركاكة الأسلوب … فأنت واضح إنك جاهل ولا يُعتب عليك<br />ثانيا يا أبو جهل لو كنا نتعامل بمنطق هذا مسيحى وهذا مسلم لأغلق ساويرس دكان موبينيل من زمان .. وكان كل المسلمين تعاملوا مع اتصالات مثلا بمجرد تواجدها على الساحة .. لكن خيالك المريض هو الذى صور لك ماقلته"
