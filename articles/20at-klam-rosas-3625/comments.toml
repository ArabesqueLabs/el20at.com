subject = "احنا عايزين نوصل البلد لغايه فييين"
author = "gayar"
text = "والله اللي بيحصل دة حراااااااااااااااااااااااام<br />ياريت توصل لحد الافلام بس القناه دى عايزة ايه , عايزة الشباب يبقي بيفكر ازاى , دة حتى البرامج والاعلانات منتهى قله الادب.<br />قناة o.tv بتعرض برامج مصريه مميزة وبتحاول تعملها طابع شبابي لذيذ بس مايكونش دة الطعم اللي تشد بيه الشباب عشان يتابعوا القناه وتعرض هى الافلام الفاضحه دى .<br />حتى البرامج والاعلانات والله العظيم دى مهزله . ومش اى حد ممكن يتفرج يقدر لما يجى مشهد وحش يقفل التليفزيون في ناس نفوسها ضعيفه وبدل مااحنا نساعدهم يبقوا كويسين ننيلها اكتر . هما عايزين مننا ايه بالضبط<br />وحسبي الله ونعم الوكيل"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

[[comments]]
order = 46
subject = "دماغكوا تعبانه!!"
author = "Egypt"
text = "عايزة افهم حاجة..<br />حد قالكم تتفرجوا؟<br />لو بتتفرج على الفيلم ولقيت مشهد وحش فيه و قفلتوه.. حد حيجيبهولك فى مطبخ بيتكو؟<br />انا شايفة ان اللى قعد يتفرج على الفيلم و جاى دلوقتى يشتم فى ساويرس.. ده بيشتغل نفسه لأنه لو كان قفل الفيلم اول ما لقى مشهد وحش كان رحم نفسه و كسب رضا ربنا .. و حرق دم الشيطان, لكن ازاى! لازم احسس ربنا انى اتفرجت غصب عنى و انهم هما اللى قاصدين يغرغروا بيا.. طب متحرق ولا ترمى ولا تبيع التليفزيون اللى مضايقك ده, ولا حتموت من غيره؟ انت بتضحك على مين يا اهبل ده ربنا عاجنك و خابزك و حافظك !!<br />اقول لكل بنت و ولد شاف الفيلم و جاى يتكلم.. اتنيلوا على خبيتكم و بدل ما تشتموا ساويرس اشتموا نفسكم و انتم الشيطان عمال يديكوا على قفاكم زى الهبل.<br />و آخر كلمة ( انت حمار يا حمار ؟؟!! )"
archived = "2007-09-28"
