text = "مصر فوق الجميع شئتم ام ابيتم يكفي انها ذكرت في القرأن واذا كان هناك تجاوزات فهذا ممكن ولعل ان تكون الهدايه من خلال التجاوزات ومصر هي وطن وشعب وليس حكومه الحكم علي حضاره الشعوب وليس عليي الحكومات في االعالم اجمع وليس بمصر االلتجاوزات والحساب عند اللله هو الذى سيحاسبنا ونطلب منه العفو والرضا لااله الا انت سبحانك انى كنت من الظاللمين"
