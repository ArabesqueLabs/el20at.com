[[comments]]
order = 32
subject = "أية ياناس أقرو مابين السطور"
author = "حسام المصرى"
text = "أولاً:- كان فية زمان برنامج لطارق علام كان أسمة مين السبب أبتدى البرنامج يتشهر ويسمع مع الناس بمجرد ما جاب واحدة دخلت المستشفى تعمل حاجة بسيطة مش فاكر كانت أية نقلولها الأيدز وأكياس دم ملوثة<br />ومصايب هزت كل بيت فى مصر تقريباً بي البهوات فى التلفزيون ماعجبهمش البرنامج لغوة.<br />ثانياً:- كان برنامج الأستاذ حمدى قنديل على القناة التانية فى التلفزيون المصرى بتاع رئيس التحرير كان برضة عملهم مشاكل فى الحكومة والناس كلها كانت بتابعة من ساعت موضوع غزو العراق والشتيمة الى شتمها للرؤساء العرب فى البرنامج لغوة برضة حتى قبل مايخلص شتيمة.<br />ثالثاً:- حلقة برنامج أختراق بتاعت عمرو الليثتى عن السادات لغوها وتقريباً لغو البرنامج بالمرة<br />رابعاً:- بسم الله ماشاء الله كل الفضائيات العربية ماهى الا قنوات أغانى أو رياضة أو أفلام ولانجد حس ولا خبر للقنوات العلمية مثل ديسكفرى أو أنيمال بلانت أو ساينس أو قناة التاريخ التابعة لديسكفرى أيضاً (على فكرة القنوات دى غربية برضة) بس أحنا الى بندور على الجنس فقط حتى تلاقى الناس الى بتئجر وصلة الدش ماتلاقيش عليها القنوات العلمية دى مع أن الآشتراك الاصلى أساساً رخيص جداً 5 جنية فى الشهر أحب أقول أن دة أتجاة عام للدول العربية عموماً كحكومات عشان يعملو غيبوبة للناس أكتر من الى هما عايشين فيها"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

