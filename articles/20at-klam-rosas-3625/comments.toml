text = "علمني كسك محجبتي أسوأ عادات<br />علمني أحلب بالحمام ساعات ساعات<br />علمني فرك الصابون<br />ووضع الزيت في كل الأوقات<br />علمني حبك أشياءا ماكانت بالحسبان<br />وأن المن هو ضهر الصبيان<br />علمني أني بنيك محجبة أصبح مسجون<br />بين حمالة صدرها وبين الكلسون<br />ويلي دخيلو شو طيب الابيض المخبى<br />ضبي بزازك ب 5 جنيه<br />قرب جرب"
