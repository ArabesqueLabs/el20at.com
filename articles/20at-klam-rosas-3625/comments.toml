text = "انا قرات تعليق الاخ blue sea<br />الشهاده لله ربنا يكمله بعقله<br />المشكلة فين يا جماعة<br />يعنى حد يقوللى لو قفلنا قناة otv<br />هنقدر نمنع سيل قنوات الكليبات الخليعة<br />طب هنقدر نمنع مواقع الاباحية على النت<br />طب هنقدر نحصر متاجر الفيديو والcd اللى بتبيع الافلام الجنسية<br />طب هنقدر نحصر ونمنع الشباب اللى بيتاجروا فى الافلام دى والاسطوانه بجنية على راى اللى قال<br />طب بعد كل ده<br />نريح شوية وناخد نفسنا ونكمل<br />نقدر نمنع واحد من انه يهدى صاحبه قيلم اباحى على الكومبيوتر او الموبايل<br />او حتى صورة اباحية<br />نقدر نمنع شبابنا لما يسافر للخارج من انه يشوف افلام خليعة او يمارس الزنا<br />طبعا لا كبيرة جدا هى الجواب<br />للاسف الحل بيبدا فى المتلقى وليس المرسل"
