[[comments]]
order = 11
subject = "النيا كلها جنس"
author = "شرين منصور"
text = "السلام عليكم انا قريت التعليقات اللي كتبها الناس ونفسي اعرف انتو بتختلفو على الاباحية والجنس ما المناظر الاباحية هي المرحلة الاولى من ما يسمى الجنس انما ماتيجوا معايا نحلل حاجة حاجة الاغاني والفيديو كليب كلنا بنشوف كل يوم كليب جديد لايحمل اي معنى لكن يحمل معنى اباحي من الدرجة الاولى يعني مثير للغاية انا افتكر مرة وانا بقلب القنوات اني شفت كليب قليل الادب جدا وكان اول كليب يجيب اولى مرحل ممارسة الجنس ،وده بخلاف الاغاني الزبالة سامحوني في اللفظ فانا بعتبر الكليب اول المراحل ،اما الافلام فهي مرحلة سوري يعني التطبيق سواء من الافلام المصرية او الاجنبية ما تيجو نبص الاول على ما يسمى خيبتنا أنا لم يتاح لي اني اتفرج على فيلم ليلة سقوط بغداد في السينما فقلت اجيبو سي دي وياريتني ما جبتو افاجا ان اختي جاية تقولي ايه القرف اللي انتي جبتيه قولتلها بيقولو انو ليه قصة وان الاخراج بتاعو رائع قالتلي تعالي لما اوريكي الزبالة اللي انتي جبتي وشفت مشاهد جنسية من الدرجة الاولى وبطلة المشاهد اللي اسمها بسمة اتفرجوا على الفيلم سي دي بعد كدة علقوا على الافلام الاجنبية وقناة الشاشة على فكرة عرضتو كامل هذه اخر الاخبار فاحنا لما بنسمح بعرض مثل هذه المشاهد في دور السينما فيا اهلا وسهلا بيها على الشاشات الصغيرة والمربي الاول ،وبعدين لو جيت تتكلم على الرقابة فين الرقابة من الدكتورة هبة قطب مهي برضو بتتكلم على الجنس بطريقة مفصللة مش فاضل الا التطبيق ايه يا جماعة الدنيا كلها بقيت جنس مش حنيجي على otvونتكلم نروح نداري خبيتنا الاول في افلامنا بعد كدة نبقى ننتقي اللي بنشوفوا من الافلام الاجنبية لو حد عندو كلام غير اللي بقولو ياريت اقراه"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

