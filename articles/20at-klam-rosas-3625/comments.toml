subject = "هذه هي تعاليم شاتلي"
author = "طيف بدر"
text = "إذا أردتم غزو الإسلام وتحطيم شوكته والقضاء على عقيدته التي أتت على كل العقائد السابقة واللاحقة، والتي كانت السبب الأول والرئيس لاعتزاز المسلمين وشموخهم وسيادتهم وغزوهم للعالم، فعليكم أن توجهوا جهودكم إلى هدم نفوس الشباب المسلم والأمة الإسلاميّة بإماتة روح الاعتزاز بماضيهم وتاريخهم وكتابهم القرآن، وتحويلهم عن كل ذلك بواسطة نشر ثقافتكم وتاريخكم، ونشر روح الإباحية، وتوفير عوامل الهدم المعنوي<br />-المستشرق الأوروبي \"شاتلي\" في كتابه \"غزو العالم الإسلامي\" صــ 264<br />http://alayasser.maktoobblog.com"
archived = "2007-09-28"
capture_url = "https://web.archive.org/web/20070928082628/http://www.20at.com/newArticle.php?sid=7057"

