text = "احنا على طول عملناها قضيه ؟؟<br />الموضوع ابسط من كده<br />احنا الى ممكن نختار نتفرج على ايه و امتى ؟<br />القناه دى فيها برامج جميله جدا و مفيده لكل الفئات العمريه و انا متابعها كويس<br />بس الى بحب اشوفه هشوفه و الى مش بحبه هغير القناه<br />ده الريموت بيبقى لازق فى ايدك بلزقه امريكانى<br />بلاش نلوم الناس و خلينا نبدأ بنفسنا"
