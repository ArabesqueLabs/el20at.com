subject = "انا فاهمها كدة"
author = "مصرى"
text = "ياجماعة احنا لية متخنين مخنا ومش عاوزين نفهم ؟ خلاص نظام رعاية الحكومة ليك وقوم ياحبيبى نام بدرى واوعى تشوف الافلام الوحشة خلاص بح رجعنا للاصل<br />والاصل اية ؟ ربنا سبحانة وتعالى حط فى الدنيا الخير والشر العفة والاباحة وانتا بذات نفسك عليك انك تختار ؟<br />حد فكر مثلا انة ممكن يشوف فلم جنسى دلوقتى حالا لكن ايمانة القوى سواء مسلم او مسيحى يمنعة من كدة<br />ثم انا عاوز افهم تفرق اية على النايل سات ولا الاوروبى اصلا اللى عاوز يتفرج الاوروبى عندة<br />ياريت نكبر دماغنا وياريت نستعيذ من الشيطان علشان نقاوم رغباتنا<br />ولا اية"
