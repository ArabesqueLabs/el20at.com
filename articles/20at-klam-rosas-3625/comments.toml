text = "يالهوى يعنى انتوا يعنى عاجبكوا القنوات الحكومية واللى بيحصل فيها وبرامجها المملة والسخيفة ولما تيجى قناة شبابية وبتعالج مشاكلنا بحرية نقعد نجلدها والله اللى فيه عينين وراس يعمل زى مابيعملوا الناس مش عاجبك الفيلم حوله وانا كل يوم بشوف بروموهات الافلام وبيقولوا انها للكبار فقط ومع انى كبيرة مبتفرجش بالرغم من انى عندى الحرية لده وحدش هايقولى لا الانغلاق مش هو الحل وبعدين ساويرس دا راجل جدع وياريت كلنا نبقى زيه او حتى نصه بغض النظر عن بعض افكاره لكن الاختلاف فى الراى ميمنعش انى بايده وبحبه ونفسى كمان اشتغل فى قناته لانها متكاملة وجامدة طحننننننننن ربنا يوفقك يا ساويرس وعقبال كل المصريين مايكبروا مخهم وينضجوا فكريا شوية"
