text = "بصو هوا كل انسان بيشتغل بحاجة هوا اختارها بارادتو وبايدو<br />القناة مش بس بتعرض افلام كده ده حتى لو جابت دعاية للقناة ركزو هتلاقو فيها حاجات اباحية من الدرجة الاولى<br />ولكن هي مسألة اختيار اللي عايز يفتح ويتفرج<br />وعلى فكرة القناة بتعرض برامج مفيدة جدا بجد احنا ممكن ناخد القناة دي حتى ولو كانت قاصدة الفساد زي مالبعض قالو لحتى تكون مصدر فايدة لينا<br />والله فيها برامج يومية جميلة بتناقش مواضيع ممتازة<br />فالانسان اللي عارف مصلحتو ومش قاصد اي حاجة تسيء لاخلاقو يقلب لو شاف حاجة غلط ويستثمر اي معلومة بتتقال بالقناة دي عشان تبقى مصدر للافادة<br />ده رأي"
