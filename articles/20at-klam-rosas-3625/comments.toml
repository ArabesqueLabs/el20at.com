text = "أقول لكل حاقد علي مصر وعلي الاسلام<br />يخاطبني السفيه بكل قبح فأكره ان أكون له مجيب<br />يزيد سفاهة فأزيد حلما كعود المسك زاده الاحراق طيب<br />اذا نطق السفيه فلا تجبه<br />فخير من اجابته السكوت<br />ان كلمته فرجت عنه<br />وان تركته كمدا يموت"
