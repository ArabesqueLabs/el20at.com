text = "بدأت اكثر القنوات الفضائية في الكلام عن الثقافة الجنسية بجرتءة لم نعتادها وسكت الجميع وقد كان السبق لهذة القنوات للمليارير محب الخير الوليد بن طلال وبواسطة قنواتة المميزة لنشر الرزيلة والفجور بواسطة الساقطة هالة سرحان والان يطل علينا سويرس ولكن ليس علية حرج فهو كما نعلم نصراني علماني ليس لة مذهب ولكن العيب علي المسؤلين الذين سمحوا بمثل هذة القنوات واللهم احسن خاتمتنا"
