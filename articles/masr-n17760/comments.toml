[[comments]]
order = 1
subject = "المخابرات الايطالية والالمانية هما اللي خلصوا المو"
author = "مش حأقلك"
posted = "2008-09-29"
text = "طالما المخطوفين المان وطليان يبقى مخابرات الدنولتين تدخلت بسرعة لانهاء الموضوع<br />الانسان الاوروبي غالي اوي يا جماعة<br />دول متحضرة<br />انتو فاكرين في فيلم اخر الرجال المحترمين بتاع نور الشريف لما كان فيه بنت تايهه وبيدور عليها ونور الشريف ذكر للضابط المستهتر ان فيه بنت تاهت في الدنمارك فالقصر الملكي الدنماركي تدخل بنفسه ووجه نداء الى الشعب علشان خاطر البنت ترجع<br />فاللي حصل ان الايطاليين والالمان ما بيسبوش رعاياهم<br />مش زينا احنا المصريين الحكومة بتضرب رعاياها بالجذمة القديمة<br />الحكومةبتسجن رعاياها<br />الحكومة بتسحل رعاياها<br />الحكومة بتسرق رعاياها<br />الحكومة بتهتك عرض رعاياها<br />حنقول ايه ولا ايه ولا ايه<br />وخلينا كده تحت جذمة الامن المركزي وامن الدولة"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190616/http://masr.20at.com:80/newArticle.php?sid=17760"

[[comments]]
order = 2
subject = "والعجول اللى بنعلفهم ومضيعين ميزانية البلد بتوع مك"
author = "مقهور"
posted = "2008-09-30"
text = "القوات الالمانية والقوات الايطالية هما اللى خلصوا الموضوع<br />وبتوعنا كانوا بيعملوا لهم شاى او بيغسلوا الفوط<br />ما تفضوها سيرة بقى<br />والا دول جدعان قوى يروحوا يلموا شوية عيال متدينين بحجة انهم اخوان من على موائد الرحمن<br />ولما تحصل كارثة زى الدويقة او حريق المسرح او مجلس الشيوخ او حاجة يعملوها انهم اساتذة فى قفل الشوارع ويعملوا حيطة بشرية حول المكان<br />البلد بتعلف فى جاموس ابيض ما لوش لزمة غير قهر الناس"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190616/http://masr.20at.com:80/newArticle.php?sid=17760"
