[[comments]]
order = 0
subject = "خيبتنا ما وردتش على حد"
author = "رياضى من منازلهم"
posted = "2008-08-14"
text = "الرياضة فى مصر هى كرة قدم - تشجيع الاهلى والزمالك والزعيق وجرايد ومعلقين وصفحات رياضية بتحلل فى شوطة ابو رجل مسلوخة اللى طلعت اوت ومش عارف مين ومدرب مين وهيافات للصبح<br />انما العاب القوى اللى ممكن نحقق فيها بطولات عالمية فمحدش مهتم<br />فين الاهتمام برياضة السباحة وعندنا محافظات على البحر الابيض والبحر الاحمر وكان عندنا عبد اللطيف ابو هيف<br />فين رياضة المصارعة ورفع الاثقال والملاكمة واظن كان عندنا بطل اخد الذهبية فى رفع الاثقال فى دورة برلين سنة 1935 ونزل هتلر الملعب وسلم علية وكان هذا الاعب يلقب بصخرة مصر السوداء<br />فين بطولات الرماية وكرة اليد وكرةالسلة<br />فى النسيان<br />كل الاهتمام بكرة القدم<br />ابقوا قابلونى"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816003916/http://masr.20at.com:80/newArticle.php?sid=17242"

[[comments]]
order = 1
subject = "جميع مسئولى الرياضة فى مصر لصوص و لاد لصوص  مكانهم"
author = "ممدوح زخارى جرجس_الاسكندرية-مص"
posted = "2008-08-15"
text = "كفى تخلف و لهث و راء سرقة ثروات هذا الشعب الغلبان و لتذهب الرياضة الملعونة الى الجحيم<br />الرياضة اصبحت فى مصر صورة مقننة للنهب و السرقة و الفضائح و المجاملات و المحسوبيات<br />ماذا سوف تخسر مصر لو لغت الرياضة مثلما لغت مصر اشياء اخرى اهم من الرياضة بكثير مثل حصص الدين بالمدارس ؟<br />أليس الدين و تنشئة ابناء الوطن اهم من هؤلاء الصيع مدعى الرياضة لصوص هذا الوطن و رافعين رايات الزل و الهوان عاليا فى كافة المحافل الرياضية؟؟؟<br />مصر ليست فى جاجة الى اى نوع من انواع الدعاية و كفى ضائح مونديال جنوب افريقيا الشهير ب(12 صفر؟)"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816003916/http://masr.20at.com:80/newArticle.php?sid=17242"

[[comments]]
order = 2
subject = "صيع صيع صيع كلهم لصوص و لاد لصوص  كدابين و منافقين"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-15"
text = "ماذا جنت مصر من مشاركتها العديدة فى البطولات الدولبة؟؟؟<br />لا اعتقد اننا جنينا سوى العار و الهوان و الفضائح؟؟؟<br />الرياضة فى مصر اصبحت رياضة اللصوص و الفاشلين و المنافقين؟؟؟<br />و اتحدى ؟؟؟ مع الاعتذار لسمنة (روابى )السايحة النايحة"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816003916/http://masr.20at.com:80/newArticle.php?sid=17242"

[[comments]]
order = 3
subject = "للاسف انة صايع بحر و ربيب شوارع"
author = "ممدوح زكى زخارى _الاسكندرية-مص"
posted = "2008-08-16"
text = "عار كبير ان تعتمد دولة عريقة مثل مصر على ما يدعى انة بطل حقيقى<br />هذا المدعو كرم ليس الا صايع بحر و ربيب شوارع<br />الرياضة اخلاق-مبادئى-مثل-تفانى-تضحية-انتماء-ولاء؟<br />(نعيب زماننا و العيب فينا ؟ و ما فى زماننا عيب سوانا)"
archived = "2008-08-17"
capture_url = "https://web.archive.org/web/20080817041510/http://masr.20at.com:80/newArticle.php?sid=17242"
