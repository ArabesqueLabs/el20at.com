subject = ""
author = "محمد حلمى"
posted = "2009-10-30"
text = "بسم الله الرحمن الرحيم<br />موضوع ابنى بيتك مشروع عملاق فى هذا العصر وهو من اكبر انجازات الرئيس مبارك وسيذكرة التاريخ من اكبر الانجازات<br />ولكن يوجد صغرة فى موضوع ابنى بيتك وهى موضوع الدعم<br />كيف تدين الدوله المواطن ب 10000 جنية ثم تقوم بدفع مبلغ 15000 الف جنية دعم للمواطن فى نفس الوقت مواطن اخر لم ينال هذة الفرصة واحد ارض وفلوس والاخر متفرج جيد<br />الحل ان يكون الدعم الثانى والثالث يخصم م قيمة الدين<br />بمعنى ان تعلن وزارة الاسكان عن خصم قيمة الدين الذى هو سعر الارض من قيمة الدعم الثانى والثالث<br />هذا الحل سوف يرفع هم الدين عن المستفدين من المشروع 1<br />هذا القرار سوف يوفر للدوله مبالغ من المال بالمليارات تساعد بها من لم يستفيد من المشروع 2<br />هذا القرار سوف يوفر وقت المواظفين فى الجهاز من الروتين المضيع للوقت 3<br />هذا القرار يمنع الرشوة بالاجهزة 4<br />وتفضلوا سيادتكم بقبول فائق الشكر"
archived = "2010-03-14"
capture_url = ""
