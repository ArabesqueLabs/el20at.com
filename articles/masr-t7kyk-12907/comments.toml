author = "طارق فوزي"
posted = "2009-08-16"
text = "السيد جمال مبارك<br />تحية طيبة وبعد<br />مصر دولة عظيمة بتاريخها وابناءها هم الثروة الحقيقية ومصر تمتكل الكثير من الحلول للمشاكل الكبري لديها بشرط وجود النية الصادقة والارادة المخلصة لحل هذه المشكلات ورفع المعانعة عن الشعب المصري<br />فعلى سبيل المثال مشكل بناء المدارس لحل مشكلة الكثافة من الممكن الاعلان عن بناء عدد من المدارس بنظام التبرع كوقف على ان تكون الارض متاحة من املاك المحافظة او وزارة الاوقاف او وزارة الاسكان والتعمير او هئية المجتماعات العمرانية او املاك الدولة<br />وتحدد اسماء المتبرعين لكل مدرسة وان يقوم على هذه العملية اناس من اهل الثقة لدي الشعب المصري لان كيثر من المشكلات لا تسطتيع الحكمومة حلها منفردة ولابد من تضافر الجهود لحل هذه المشكلات"
archived = "2010-03-14"
