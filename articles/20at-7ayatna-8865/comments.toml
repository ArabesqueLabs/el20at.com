order = 0
subject = "\" الكشرة \" لها أسبابها وعواملها .. في ال"
author = "حمد نواف الحمدالله ..."
posted = "2008-04-24"
text = "أولاً يا أخوان وقبل كل إشي \" الكشرة \" لاتجوز أن تعمم على جميع المواطنيين الأردنيين ( سواء أكانوا في الوطن أم خارجه ) ..<br />وكما هو معروف بأن أوضاع وأحوال المواطن الأردني \" تحت الصفر \" وذلك لعدة أسباب لايمكن حصرها .. ولعل أهم سبب يكمن في الغلاء الصاقع . والإرتفاع المستمر للأسعار بدل من نقصانها !!!<br />ع العموم .. \" وللتذكير فقط \" .. ليس الشعب الأردني شعب كشر .. وأنما الأمر عائد كله على الأوضاع المعيشية التي يعيشها هذا المواطن \" المغلوب على أمره \" .. وتدني مستوى المعيشة .. لا وبل أكثر من ذلك هناك دافع أو عامل مساعد ويلعب دور حيوي في خلق جو مليء بالحزن والهم والغم والنكد .. والإحباط واليأس والإكتئاب والقنوط .. (أقصد هنا الأوضاع السائدة في الشرق الأوسط ) ..<br />فكيف بدكو يا _ جماعة الخــير _ يفرح وينبسط ويهيص المواطن الأردني ؟؟؟ !!!<br />_____________________ لاتعليق __________________<br />تحياتي إلى كاتب هذا الموضوع الأخ ( تامر الصمادي )<br />.. وجبتها على الجرح ياكبير .. ( خليها لربك )<br />ويخلق الله مالاتعلمون !"
archived = "2010-03-14"
