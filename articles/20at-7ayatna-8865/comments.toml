subject = "آخ من الكشرة ...."
author = "عاشق فلسطين"
posted = "2008-06-21"
text = "والله الحياة عنا بالأردن نااااار مولعة , وفوق النار هاد كلو الضرائب اللي بتطلعها الحكومة الزفت على المواطنيين , يعني إحنا صرنا<br />تحت حزام الفقر بكل ما تحمله الكلمة من معنى , ويا ريت مستفيدة الحكومة من الضرايب , شو عاملة , ولا شي قال عشان نهضة<br />الأردن , بلا أردن بلا هم , ولا إشي صاير , لكن الله يستر من الجاي , وما فش داعي يا محمد نواف أفضحك وأشرشحك لأني خلاص<br />بكفي شرشحتك ..... والسلام على من اتبع الهدى ولا حول ولا قوة إلا بالله العلي العظيم"
