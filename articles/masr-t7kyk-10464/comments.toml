[[comments]]
order = 0
subject = "حلو وجميل وخلونا ننتهى من قصة الاصلاح ببيع كل ممتل"
author = "برضة"
posted = "2008-11-10"
text = "هو طيب فية سؤال - لما الدولة تبيع كل ممتلكاتها هتصرف على موظفيها والجيش والشرطة منين ؟<br />وبعدين الناس هتاخد الاسهم دى تعمل بيها اية - وهى اسهم لشركات خسرانة والمكائن بتاعتها منتهية الصلاحية وشغالة بقى لها 40 سنة من ايام المرحوم عزيز صدقى<br />اعتقد انة مشروع وهمى<br />او من احلام الحزب الوطنى<br />او واحد نصاب فاكر مصر هى الكويت او ليبيا وهنوزع عليهم او على الناس عائدات البترول<br />مش عارف الفكرة دى غامضة كدة ومش مبلوعة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "انا اول المؤيدين للبيع حتى ولو لاسرائيل"
author = "هيصة"
posted = "2008-11-11"
text = "يا عم بيع بقى وريحنا<br />وتسلموا قناة السويس لبريطانيا وفرنسا واليومين دول الايطاليين اخدوا السكة الحديد والسعودية اخدت 3 مستشفيات<br />خلاص احنا فشلنا فى ادارة القطاع العام<br />احنا مننفعش فى ادارة اى حاجة<br />بيعوا وكملوا المسيرة<br />هنعمل اية بالمصانع والشركات دى والبنوك - دى حتى ملهاش فايدة والتخلص منها مصلحة<br />اما حفاظا على حقوق الاجيال القادمة فدى واسعة شوية لان الجيل الحالى مشفش حاجة ولا شم حاجة وبيقف فى الطوابير لما حرقت قفاة الشمس<br />بيع<br />بيع<br />نؤيدك فى البيع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "مشروع الوطنى دة - ادارة الاصول - اتطبق فى اى مكان"
author = "واحد"
posted = "2008-11-11"
text = "عموما انا مش عايز اسهم - اللة اعلم اية اللى وراها<br />ويا جماعة حلال عليكم - وربنا يجعلة عامر<br />انما يدخل بيتنا قرش حرام ونشارك فى مسرحية - حاشا للة<br />وممكن يعطوا الناس اسهم ثم بعد شهرين يطالبوهم بثمنها واللى ما يدفعش يبيعوا لة عفش البيع<br />انتم فاكرين حكاية 30 %<br />لما الكل سقف وزيط وهيص وتانى يوم رفعوا الاسعار 200 %<br />يا حكومة لا تقرصونى ولا عايز منك عسل"
archived = "2010-03-14"
