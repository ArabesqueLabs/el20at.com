text = "بدى اشكر الاستاذه نجلاء عبد ربه وانا هيك عرفت اسمها من الاسم التانى لها وهى بالمناسبة صحافية معروفه بجرأتها وطرحها مواضيع عم بتحرك الراكد بقلسطين واطفال فلسطين الحبيبه بيحتاجووا منا مساعده وبدى اسأل بالمناسبة وينها جمعيات حقوق الانسان شكرا لكى اختى نجلاء"
