[[comments]]
order = 1
subject = "فلسطين .. إلى أين ؟؟!"
author = "محمد نواف الحمدالله .. الأردن"
posted = "2007-11-19"
text = "أول إشي بحب أصبح ع الجميع (( بما أنو الدنيا عنا الصبح )) ..<br />ثاني إشي اللي خلا أطفال فلسطين هيك يعملو .. واضح مثل عين الشمس .. الحكومات التي تلهث مثل الكلاب الجائعة التي لم تأكل منذ فترة طويلة جداً .. حكومات الوحدة الوطنية .. حكومات السعي نحو الأفضل والأحسن للشعب .. حكومات التغيير والإصلاح .. حكومات العدل (( إعطاء كل ذي حقٍ حقه )) .. كثير سمعنا من هالشعارات الرنانه .. ماشالله هاذ اللي فالحين فيه .. وغيرو لأ .<br />لو بدكو تيجو تحسبو لكل شخص مسؤول .. وعندو منصب رفيع بحكومة عباس .. فــ (( حدث ولا حرج )) ..<br />وعلى سبيل المثال لا الحصر .. وبدون ذكر أسماء (( بدناش فضايح )) .. مسؤول كبير جداً بالحكومة .. وصرلو أكثر من عشرين سنه .. وقاعد عم بكدح على ولا إشي وهو دكتور كان بجامعة .. وإلة بعض الكتب اللي ألفها .. وفي بحسابو مالايقل عن 500 مليون دولار .. ممكن أكثر . الله أعلم .وهاذ طبعاً من أول ما استلم منصبو بالحكومة يعني قبل عشرين سنة .. فما بالكو من عشرين سنة لهسه كم جمع .. كم ؟؟ كم؟؟ اه ..<br />المهم يعني كلو من تعب وعرق الشعب، بالأخير بتروح للحكومة الحلوه ع أساس إنو يعني بدها تطور البلد وتحدثو وتسوي مشاريع واستثمارات لصالح الشعب .. (( حكومة )) .. أهلاً حكومة .. هاذ طبعاً فيض من غيض .. والله يستر من اللي جاي .. وأخيراًَ بدي أوجه كلمة للحكومة الفلسطينية (( ارحموا هاذ الشعب )) . تحياتي للجميع .. عشتم .. وعاش الوطن .. والوطن للجميع .. شكراً ،،،"
archived = "2010-03-14"
capture_url = ""

