subject = "طار فى الهوا شاشى وانت ما تدراشى"
author = "نخلة"
posted = "2008-08-15"
text = "جواز اية<br />ماهو كلة بيسلك حالة زى هشام مصطفى وسوزان تميم<br />فضيحة عصر الغلمان الذين يحكمون مصر<br />ممدوح بية اسماعين بتاع الدبلوم اللى عبر بمصر من العصور الوسطى الى قاع البحر<br />والغلام بتاع اكياس الدم واجهزة الغسيل الكلوى اللى طلع براءة الاخر<br />والغلام اللى قتل سوزان تميم وهيطلع براءة<br />زمان قالوا العدل اساس الملك<br />وطالما مفيش عدل فى البلد دى يبقى مفيش شرعية للحكم<br />يبقى نشتم راس الكبير<br />العدل اساس الملك<br />العدل اساس الملك<br />العدل اساس الملك<br />يبقى ملعون ابو الكبير"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816003922/http://masr.20at.com:80/newArticle.php?sid=17253"
