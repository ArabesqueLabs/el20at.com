[[comments]]
order = 0
subject = "انا اليوم انسان افضل"
author = "نيفين نيفى نوفا"
text = "انا اليوم انسان افضل..العباره دى فعلا جميله جدا<br />الموضوع يمثل قصه نجاح عظيم و كفاح اعظم تحت شعار (حب ما تعمل حتى تعمل ما تحب)<br />و مش عارفه ليه القصه فكرتنى بقصه دكتور ابراهيم الفقى اللى كان مجرد عامل ف فندق ف كندا و كان بيحكى انه كل يوم و هو بيمسح مكتب مدير الفندق بيشجع نفسه و يقول ان انهارده بمسح المكتب اللى هقعد عليه بكره ..و قد كان..حتى وصل الى ما نعرفه عنه اليوم بكونه رائد من رواد التنميه البشريه<br />فعلا الموضوع جميل و يستحق التوقف لديه كثيرا"
archived = "2007-05-17"
capture_url = "https://web.archive.org/web/20070517041138/http://masr.20at.com:80/newArticle.php?sid=10177"

[[comments]]
order = 1
subject = "الصلاة في الكنيسة افضل من الصلاة في الجامع"
author = "مش لازم"
text = "المغزى هو ان الصلاة في الكنيسة افضل من الصلاة في الجامع وعلى حسب تصوير الكاتب المسلمين همج<br />اقرأو كويس ه1ه السطور المأخوذه من المقال<br />ومع الناس وربما مع الله أحيانا، حتي قلت يوما في صحن الجامع، أنا أحب إلي أن أصلي في الكنيسة القريبة لأني أشعر فيها بالسلام مع الله وأنتم هنا تذبحون بعضكم البعض علي الإمامة في الصلاة ومن يدير الجمعية التي تدير المركز ومن يخطب الجمعة وهكذا...."
archived = "2007-05-17"
capture_url = "https://web.archive.org/web/20070517041138/http://masr.20at.com:80/newArticle.php?sid=10177"

[[comments]]
order = 2
subject = "واد فلته ماجابتوش ولاده ياجماعه"
author = "AMS"
text = ">; المغزى هو ان الصلاة في الكنيسة افضل من الصلاة في الجامع وعلى حسب تصوير الكاتب المسلمين همج<br />اقرأو كويس ه1ه السطور المأخوذه من المقال<br />ومع الناس وربما مع الله أحيانا، حتي قلت يوما في صحن الجامع، أنا أحب إلي أن أصلي في الكنيسة القريبة لأني أشعر فيها بالسلام مع الله وأنتم هنا تذبحون بعضكم البعض علي الإمامة في الصلاة ومن يدير الجمعية التي تدير المركز ومن يخطب الجمعة وهكذا..<br />احب احييك على ذكاءك الخارق وسرعة بديتهتك العاليه جدااا ...... ايه ده ياولا الذكاء ده .......... ههههههههههههههههههههههههههههههه<br />صدفه حلو اللى كعبلتنى فى تعليقك عشان اضحك شويه ..... واتمنى يكون شريف شاف التعليق عشان يضحك هو كمان<br />اضحك يا شريف اضحك ........ سيبك يعم ...... مفيش فايده والله"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125109/http://masr.20at.com:80/newArticle.php?sid=10177"
