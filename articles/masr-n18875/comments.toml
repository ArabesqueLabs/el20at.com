[[comments]]
order = 0
subject = "اللى بيتلسع من الشربة بينفخ فى الزبادى"
author = "شايف"
text = "طبعا لازم يبقى فية اجراءات مشددة بعد حادث قذف بوش بالحذاء<br />فممكن طالب او استاذ شاب يقذف بحذائة اى مسئول جاى يحضر الحفلة - وهم يستحقون اكثر من الحذاء<br />ثانيا - السيد بطرس غالى رئيس جماعة حقوق الانسان كان الاسبوع دة - يعنى من يومين كان بيلقى محاضرة فى جامعة المنيا او بنى سويف لا اذكر - كان بيلقى محاضرة عن حقوق الانسان فقام طالب من الحضور وقاطع المحاضرة وقال لة<br />حقوق انسان اية يا دكتور - انا اعتقلت 13 سنة بدون محاكمة - وجاى تقول لى حقوق انسان - مصر مفيهاش لا حقوق انسان ولا حقوق حيوان<br />طبعا بطرس غالى احرج ورد علية ان الجمعية مش جهة تنفيذية<br />فلهذة الاحداث<br />ادارة الجامعة مش عايزة مفاجئات<br />اعطت كل الطلبة والاساتذة اجازة - علشان المسئول ييجى فى امان ويحطوا داخل الجامعة عشرة الاف عسكرى ومخبر وبلطجية يهتفوا بحياتة ووسط هذا الحشد الامنى يلقى المسئول خطاب كتبة لة صحفى فية كلام فارغ مالوش معنى والمسئول كانة فى حصة قراءة بيقرا لنا من ورقة كتبها صحفى غبى لة فيها كلام عن العدل الاجتماعى وبدنجان الاصلاح الاقتصادى"
archived = "2008-12-21"
capture_url = "https://web.archive.org/web/20081221214803/http://masr.20at.com:80/newArticle.php?sid=18875"

[[comments]]
order = 1
subject = "السبب الحقيقى"
author = "محمد جمال الدين"
text = "أعتقد أن السبب الحقيقى ,لو رجعنا بالذاكرة للوراء,ان ما حدث من الطالب بلال دياب ومقاطعته لكلمة رئيس الوزراء أحمد نظيف خلال زيارته للجامعة,المقاطعة التى لاقت ترحيباً كبيراً من الطلاب فى حين محاولة نظيف تجاهله و لكن محاولته لم تفلح. ولذلك هم يريدون ضمان عدم حدوث ذلك الامر مرة أخرى. أبداً أبداً ابداً<br />وبس كدة"
archived = "2008-12-21"
capture_url = "https://web.archive.org/web/20081221214803/http://masr.20at.com:80/newArticle.php?sid=18875"
