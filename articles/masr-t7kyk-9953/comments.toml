subject = "والنت راح فين وايه لزمته"
posted = "2008-08-28"
text = "يا جماعة الحجات دي اصبحت على النت حجز شقق والتقديم للوظائف كل دا خلاص احيلت الى النت<br />يعني مثلا ممكن حجز الشقة ودفع المقدم عن طريق النت<br />امال ايه لزمة النت"
