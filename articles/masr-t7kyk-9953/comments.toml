subject = "اغلب المتقدمين يريدوها للمكسب و التجارة و التسقيع"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-28"
text = "اغلب من تقدمو لحجز الشقق السكنية للشباب بمشروع مبارك اغلبهم تقدم للحجز بغرض التجارة و المكسبو تسقيعا ثم اعادة بيعها متربحين من هذا المشروع<br />و البركة فى التوكيلات القضائية التى تعطى الغريب الحق فى التصرف فى السقق التى خصصتها الدولة لمستحقيها اللى هم فى الحقيقة مستغليها<br />حرام عليكم اللى بيحصل فى مصر ظ<br />و اللة انتم خربتوهااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا خالص!"
archived = "2010-03-14"
