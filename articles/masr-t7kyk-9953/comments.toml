[[comments]]
order = 3
subject = "الى الاستاذ mdalsayed"
author = "مش لازم"
posted = "2008-09-09"
text = "يا اخي الكريم دي حقيقة امال ايه لزمته النت<br />اننا نملا البلد سيبرات علشان خاطر العلاي يقعدوا على الشات وخلاص<br />لما واحد يعمل اعلان عن وظائف وتبص تلاقي الافات رايحين يقدموا لتلك الوظائفويبقى منظر من كويس<br />يبقى التقديم على النت اسرع واوفر وكذلك حجز الشقق وكذلك التقديم للجامعات وكل دا المفروض يبقى على النت خلاص<br />وانا بقول الكلام دا لان رئيس الوزرا بتاعنا كان وزير اتصالات سابق وخبير كمبيوتر المفروض هو اللي يشجع الحجات دي<br />قبل توليه لمنصب رئيس الوزراء، شغل الدكتور أحمد نظيف منصب أول وزير للاتصالات وتكنولوجيا المعلومات خـلال الفترة من 1999 إلى 2004. خلال تلك الفترة، وضع الدكتور نظيف إطارا قانونيا جديدا من أجل تحرير قطاع الاتصالات وتكنولوجيا المعلومات وقام بالترويج لاستخدام الاتصالات وتكنولوجيا المعلومات في مختلف المجالات وخاصة في العمل الحكومي، كما وضع البيئة الملائمة لتنمية هذا القطاع بحيث أصبح ضمن قطاعات الاقتصاد المصري الأكثر نموا.<br />وتمتد خبرة الدكتور نظيف المتميزة في مجال تكنولوجيا المعلومات إلى مـا يزيد عن 30 عامـا، شهدت تقلده للعديد من المناصب الأكاديمية والوظيفيـة في القطاعين الحكومي والخاص، بالإضافة إلى نشاطه في إطار مؤسسات"
archived = "2010-03-14"
capture_url = ""
