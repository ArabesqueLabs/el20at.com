subject = "بالطبع"
author = "بنت مصرية"
text = "بالطبع شاركت فى الاضراب بأضعف الايمان وهو الجلوس فى المنزل وعدم شراء اى سلعة فى هذ اليوم بالاضافة خليت كل اقاربى وجيرانى لايذهبون للمدرسة وكنت اتمنى المشاركة بالنزول للشارع لكنى لم اتمكن واتمن ان تكون هذة هى البداية لصحوة حقيقية للشعب لنيل حقوقة"
archived = "2008-04-07"
