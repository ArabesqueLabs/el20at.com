text = "يتضح لنا احيانا اننا العرب ننكر اصولنا.. كل الكتب التي تحدثت عنها يادعاء تصور بعض من الضمير الامريكي الذي نراه عندما يتذكرون انهم بشر وانهم يمقتون الحروب والدمار ويبحثون عن السلام.. بادرة خير ودليل على بقاء الانسانيه لدى بعض من ننكرهم في واقعنا السياسي . ولكن فؤاد عجمي الذي يعود الى اصول عربيه فهي تكرس شيء واحد لاغير .. الاقتلاع من الجذور وعدم الانتماء ... ببساطه فيه نوع من الخلل في القيم .. فكيف يقوى ان ينكر عروبته السابقه ويقف الى جانب النظام الامريكي ويشجع سياسته في العراق وينادي بديمقراطية اساسها الاحتلال والقتل ..<br />ليته يعرف ان ( من فات قديمه مات )<br />شكرا على الكتب القيمه .. يبدو اننا سنتصفح بعضها قريبا.. لماذا لا نفترض مناقشة احدها ونقيم حلقه نقاش عبر الموقع ؟"
