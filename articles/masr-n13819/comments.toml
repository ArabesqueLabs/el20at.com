subject = "نشكر بابا بوش"
author = "سجين"
posted = "2008-01-16"
text = "الى المعلق اللى قبلى<br />يا اخى انت لا تدرى سر التغير هذا<br />الكونجرس الامريكى ربنا يجعلة نصير المظلومين ويبطل افترى على خلق اللة فى فلسطين والعراق - ارسل تهديد للجالس على اريكة الحكم فى الشرم انة هيخصم من الدعم والمعونة الامريكية لمصر ما لم يتم تحسين معاملة المساجين فى السجون ومعاملة المواطنين فى اقسام الشرطة<br />فالمعاملة الطيبة دى جاية من الضغط الامريكى - لان العالم عندنا بتخاف ما تختشيش ثم انهم بياخدوا اوامرهم من سيد البيت الابيض<br />فهمت يا حبيبى سر تحسين المعاملة - جبن بعيد عنك"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117043020/http://masr.20at.com:80/newArticle.php?sid=13819"
