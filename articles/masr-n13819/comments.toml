[[comments]]
order = 2
subject = "وجبة الغداء من اللحوم طوال العيد.. والأطفال يزورون"
posted = "2008-01-16"
text = "لواء سمير سلام.. رئيس قطاع السجون ل \"الجمهورية\"<br />وجبة الغداء من اللحوم طوال العيد.. والأطفال يزورون أمهاتهم السجينات<br />لأول مرة يتم ذبح عجل داخل أحد السجون بعد صلاة عيد الأضحي.. يحدث ذلك اليوم في سجن القناطر وتوزيع لحومه علي المساجين.<br />أكد اللواء سمير سلام مساعد وزير الداخلية لقطاع السجون في تصريحات خاصة \"للجمهورية\".. أن تعليمات حبيب العادلي وزير الداخلية أن تكون وجبة الغداء في كل أيام العيد من اللحوم بالإضافة إلي احضار ابناء وبنات السجينات الموجودين في دور الرعاية الاجتماعية لتناول الغداء مع أمهاتهم من المسجونات وكذلك حضور الآباء المسجونين إلي زوجاتهم المسجونات في حضور الابناء وجمع شمل الأسرة في أيام العيد المباركة وذلك في إطار المحافظة ورعاية حقوق الإنسان.<br />قال إنه تم إعداد سيارات خاصة مزودة بالمشرفين والمشرفات لاحضار الأطفال وعددهم 31 طفلاً وطفلة لامهاتهم وكذلك احضار الآباء المسجونين..وعددهم 26 في منطقة القناطر.<br />أضاف أن لجنة الافراج الشرطي وافقت علي خروج 161 مسجوناً أمضوا ثلاثة أرباع المدة.. حيث إن هذه اللجنة خاصة وتعقد كل شهر للنظر في الإفراج عن المسجون عقب قضائه ثلاثة ارباع المدة.. حيث تحدد اللجنة شروطاً للإفراج وهي أن يكون حسن السير والسلوك ولم يرتكب أي مخالفة والا يكون في الإفراج عنه خطورة علي نفسه أوعلي الأمن العام.. قال إن هذا الافراج يعد تعديلاً في أسلوب تنفيذ العقوبة ومن ينطبق عليه هذه الشروط يتم الافراج عنه.<br />أضاف أن هذا العدد تواكب مع خروج 758 مسجوناً صدر لهم قرار جمهوري من الرئيس مبارك بالعفو عنهم بعد قضائهم نصف المدة وسوف يتم الافراج عنهم صباح اليوم أول أيام العيد من بوابات السجون مباشرة وتنطبق عليهم أيضا شروط حسن السير والسلوك وان يكون مستجيباً لبرامج الإصلاح والتشغيل والا يكون التهم المحكوم عليه بها تمس أمن الدولةوجميع المفرج عنهم بقرار العفو الجمهوري متهمون في قضايا قتل غير مقترن وقتل خطأ وهؤلاء يخرجون من بوابات السجون..أضاف أن القطاع بدأ تنفيذ القرار الجمهوري رقم 165 لسنة 2007 باخلاء ستة سجون من عواصم المحافظات نظراً لقدمها وغير مطابقة للمواصفات الحديثة حيث انها مبينة علي الطراز الإنجليزي وتعاني من تكدس شديد ويعوق وجودها حركة التنمية داخل المدن وبدأ بالفعل في تحديد أماكن هذه السجون بالظهير الصحراوي خارج المدن وتم وضع التصميمات المعمارية الخاصة بها علي أحدث النظم العالمية لتتوافر فيها كل المقومات والأنشطة الرياضية والترفيهية للمسجون.<br />قال إنه بدأ بالفعل العمل في سجن المنيا خارج المدينةوقويسنا بديلاً عن شبين الكوم بالمنوفية بمساحات تتراوح ما بين 30 و60 فداناً مشيراً إلي أن وزارة الداخلية قررت انشاء ثلاثة سجون أخري بخلاف التي شملها القرار الجمهوري وهي سجون بني سويف وقنا وسوهاج وتم بالفعل التعاقد علي أرض تخصها وكذلك انشاء سجن جديد لأول مرة بمدينة القنطرة شرق لتخفيف العبء عن مدن القناة وبورسعيد وتم تخصيص أراضيها.<br />أضاف أنه لاول مرة يدخل رسمياً ضمن احتفالات عيد الشرطة بوزارة الداخلية ندوة تعقد عن السجون المصرية بين الماضي والحاضر يشارك فيها كل المتخصصين والمهتمين بحقوق الإنسان وتقديم الرؤي والابحاث اللازمة لطرح الافكار العلمية لصياغة حقوق المسجون خاصة أن توجيهات حبيب العادلي وزير الداخلية هي التطوير الشامل لكل المساجين لاعادتهم إلي المجتمع اناساً صالحين وتعقد الندوة باكاديمية مبارك للأمن بالتنسيق مع الإدارة العامة للإعلام والعلاقات بوزارة الداخلية.<br />ويواكب هذه الندوة معرض لمنتجات نزلاء السجون ومقتنيات السجون القديمة.<br />أشار إلي وجود مركز لتلقي شكاوي المساجين لأول مرة بالقطاع لبحث الشكوي والرد خلال 48 ساعة علي الأكثر وتم تزويد المركز بقاعدة بيانات من شئون المسجونين لحلها فوراً..أكد اللواء سمير سلام أنه لايوجد تعذيب بالسجون وأن ما يقال عن سوء معاملة داخل السجون لا أساس له من الصحة حيث إن السجون أصبحت مفتوحة ومن السهل أن يوصل المسجون صوته وشكواه لأي جهة سواء للنيابة العامة أثناء التفتيش علي السجن أو من خلال الخطابات والزيارات فالمسجون لديه من الوسائل الكثير جداً لتوصيل صوته وهذا ينفي ما يتردد عن وجود تعذيب بالسجون. مؤكداً أن مكتب التعاون الدولي وشئون المسجونين بالنائب العام نفي وجود تعذيب بالسجون<br />المصدر<br />جريدة الجمهورية"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117043020/http://masr.20at.com:80/newArticle.php?sid=13819"

