subject = "بين اطلال بلد قد كان"
author = "واحد"
posted = "2008-01-14"
text = "وهو فاضل حاجة غير الاطلال لبلد واطفال الشوارع ومدن واحياء الفقر واناس مخنوقة<br />واهو فاضل لغاية ما يكمل البيع ويتركها خرابا<br />نعم ليستمر ليستكمل الخراب - ويترك الغربان تنعق على الركام<br />وتكون مصر مجرد تابع وضيع ترتجف من الخوف اذا صرحت امرأة فى اسرائيل بكلمة واحدة ضدة"
archived = "2008-01-17"
