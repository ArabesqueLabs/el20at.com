subject = "مصيرنا بين الواقع والعدو المجهول"
author = "مجدي حامد المحامي"
posted = "2007-11-24"
text = "ملحوظة : تم إرسال هذه الرسالة علي سفارة مصر في واشنطن لعلها تصل ليد السيد الرئيس في مصر!0<br />حسبي الله ونعم الوكيل في كل مسئول يحنث بالقسم الذي اقسمه في بداية عمله0<br />\" مصيرنا بين الواقع والعدو المجهول \"<br />قالوا للأعمى هيضربوك علي عينك فقال الرجل ما هي خربانه خربانه ، هكذا حدثتني نفسي عقب قراءه أجزاء من الخطاب الأخير للسيد رئيس الجمهورية الذي ألقاه يوم 14/11/2007م بمناسبة افتتاح الدورة البرلمانية لمجلسي الشعب والشورى ، والذي أشار فيه أن هناك خطر يحدق بنا دون أن يفصح لنا سيادته عن ماهية هذا الخطر ومن أي اتجاه سيأتي0<br />ولو حقا نحن نعيش أزهي عصور الديمقراطية يبقي من حقي كمواطن أن اسأل السيد رئيس الجمهورية سؤلا ليس كالأسئلة المعدة سلفا عند لقاء سيادته مع شباب الجامعات وغيرهم ، ومن حقي أيضا أن يجاوبني سيادته ، وسؤالي هو : سيادة الرئيس أنا مصدق كلامك إن فيه خطر محدق سيداهم هذا البلد ، بل وأغلبنا متوقع كارثة ستحل قريبا بهذا البلد ومنا منتظر ساعة حدوثها لعلها تقضي عليه ليرتاح، لافتقاد المواطن المصري للعدالة بكافة صورها سواء كانت عدالة اجتماعية أو سياسية أو قانونية قضائية إلى أخر صور وأشكال العدالة ، والسؤال هنا سيدي الرئيس من هم في تصورك الذين سوف يواجهون هذا الخطر إذا حل بنا ؟ هل هم رجال الحزب الوطني ورموزه والحكومة العاجزة وشلة المنتفعين ؟ أم الشعب المصري الصبور المهاود ؟ قطعا ستكون الإجابة المنطقية أن الذي سوف يدافع عن الوطن جميع طوائف الشعب ، ولكن عفوا سيدي الرئيس هذا الإجابة لا تعبر عن الحقيقة والواقع والأدلة كثيرة والمساحة لا تسمح بسردها ، فلا تراهن علي الشعب المقهور المستعبد هذه نصيحة قد لا تجدها في التقارير التي ترفع لسيادتكم ، ولن تقرأها بقلم منافق ، وسوف أتكلم هنا عن نفسي وعن تجربتي ومش عارف مين من الشعب المصري معايا في الرأي ومين مختلف ، فأرجوا سيدي الرئيس عند حدوث الخطر الذي تعلمونه ولا نعلمه أو الخطر الذي نعلمه ولا تعلمونه متعملوش حسابي معاكم وأنتم تواجهون هذا الخطر، ولو تقصد سيادتكم أن الخطر الذي يهددنا قادم من الخارج في شكل مستعمر مثلا فإنني أول مصري يعلن ترحيبه بالمستعمر يمكن يكون ارحم بينا ويستمع لشكواي ولا يحيلها للمشكو في حقهم ثم وهذا الأهم ينصفني ، واليك بعض أسبابى فأنا مواطن مصري عادي وبسيط يبلغ من العمر 45 عام ولي من الأبناء ثلاثة ، وكنت اعشق تراب هذه البلد كما يقولون ، وكنت مستعد في شبابي وأنا اقضي فترة تجنيدي أن افديه بروحي وعنيا ، ولكن وآه من لكن ، فبمجرد معايشتي لتجربة شخصية تبين لي أنني مخدوع في حب مصر ، وبسبب الظلم والقهر الذي عانيت منه أنا وأطفالي منذ خمس سنوات بت لا أحسن التفرقة بين مصر كوطن يعيش في دمي ، وبين مصر كحكومات فاشلة ونُظم حكم مستبدة ، وكل هذا بسبب خطأ اقترفته في حق نفسي عام 2003 حين تصديت لبعض مظاهر الفساد المستفحل بجهة عملي نقابة المهندسين الموضوع أموالها \" وهي مليارات \" تحت يد شخص \"واحد فقط لا غير !!!\" يلقب بالحارس القضائي ، وعلي إثر ذلك تم التنكيل بي ونُقلت تعسفيا من محل إقامتي وعملي بالقاهرة ، إلى مكان مغلق ومهجور بمحافظة الوادي الجديد ثم اتبع ذلك حرماني من أجري الشهري والمنح والمزايا المقررة قانونا للعاملين بالمناطق النائية ، وهكذا سيدي الرئيس ظللت بالوادي الجديد ثلاثة أشهر متتالية بلا عمل وبلا أجر ومقيم بالفنادق حتى استدنت وأصبحت لا أستطيع الاستمرار في هذا الوضع ، وبعد فشل المساعي الودية لجأت للقضاء وحتى تاريخه لم يفصل في أي دعوي ، كما لجاءت للنيابة العامة منذ عام 2004م بالمحضر رقم 1669 إداري الأزبكية متهما الحارس القضائي وأخرين بالامتناع عن صرف أجري بلا مبرر أو مسوغ قانوني وهذا الفعل يشكل جريمة معاقب عليها بالمادة 117 من قانون العقوبات بخلاف عقوبات مخالفة قانون العمل التي حررها مكتب العمل المختص ، وعلي الرغم من ذلك لم تتخذ الإجراءات القانونية من قبل النيابة ، وأمام ذلك القهر أذعنت من قبل الحارس القضائي للتنازل عن الدعاوى المرفوعة مني في مقابل إلغاء قرار نقلي وصرف كافة مستحقاتي المالية وتسوية حالتي ، وبالفعل عاود الحارس القضائي صرف أجري اعتبارا من 1/9/2006م ولمدة ثلاث أشهر متتالية دون أن يسند لي أي عمل ودون توقيعي في كشوف الحضور والانصراف ودون أن يصدر قرار بإلغاء قرار النقل ودون أن يصرف مستحقاتي السابقة كما وعدني ، وعندما استشعرت بالخديعة أثبت أمام المحكمة العمالية بطلان التصالح والتنازل استنادا لنص المادة 5 من قانون العمل لمساس التصالح بحقوق مقررة قانونا مثل الأجر وخلافه ، وعقب ذلك قام الحارس القضائي بإصدار تعليماته للأمن بمنعي من دخول النقابة ، وأمتنع عن صرف راتبي ، وقمت باتخاذ الإجراءات القانونية التي تثبت حقي ، وتقدمت للنائب العام باستغاثات بلغت 1850 استغاثة استحث سيادته اتخاذ الإجراءات القانونية حيال المشكو في حقهم بالمحضر رقم 1669 لسنة 2004 ، والمحضر رقم 7390 لسنة 2007 إداري الأزبكية حيث تبين لي تزوير توقيعي علي أذون واستمارات صرف المرتبات عن اشهر فبراير ومارس وإبريل 2004 حيث ادعي الحارس القضائي صرفها لي في عام 2006م \" لاحظ التواريخ \" مما يؤكد صحة المحضر المتعلق بامتناعه عن صرف أجري هذا عام 2004م ، وكذلك التزوير في كشوف الحضور والانصراف لكوني غير مدرج بالكشوف من الأصل ، كما زور في إقرار تسلمي العمل بالقاهرة وهو ما لم يحدث حيث كان يصرف راتبي خلال تلك الفترة بدون أي عمل يسنده لي حيث كنت اذهب للنقابة لصرف الأجر!!! ، مما يؤكد أن الحارس القضائي وأعوانه يتلاعبون كيفما شاءوا ويضربون بالقانون عرض الحائط ولا أحد يحاسبهم0<br />فهل بعد ذلك سيدي الرئيس منتظر من مواطن مثلي مظلوم ومقهور أن يشارك ولو بالقليل الذي يستطيعه لدرء أي خطر يواجه مصر ؟ أرجوك سيدي الرئيس جاوب علي أحد مواطني مصر إذا كان ذلك من حقنا عليك كمواطنين ، وفي الختام أسأل زميلي القارئ هل تعتقد أن صوتنا يصل لرئيسنا ؟ وهل يهتم بشكوانا ويسهر علي حلها ويتابع مصيرها حتى لو أحيلت الشكوى للمشكو في حقهم !؟0 أم هيفسحوني؟<br />مجدي حامد000 المحامي : magdy75@gmail.com 17 /11/2007<br />نظرا لتصدي المقهور / مجدي حامد ، للمخالفات المالية والادارية بنقابة المهندسين الموضوعة تحت يد شخص واحد يلقب بالحارس القضائي فتم نقله من القاهرة للوادي الجديد0<br />واليكم بعض الأمثلة الموثقة بالمستندات وهي عبارة عن ملخص فتوى مجلس الدولة يثبت صحة اتهامات مجدي حامد ضد مسئولي النقابة الكبار ( الأمين العام التنفيذي )0<br />هذا المستند سري للغاية وممنوع تداوله داخل النقابة<br />مجلس الدولة<br />إدارة الفتوى لرئاسة الجمهورية ملف رقم : 75/21/2715<br />ورئاسة مجلس الوزراء والتخطيط سجل رقم / 553/2005<br />والتنمية المحلية والاستثمار / 68 ش القصر العيني<br />السيد / القائم بأعمال وكيل الجهاز المركزي للمحاسبات<br />تحية طيبة وبعد<br />اطلعنا علي كتاب سيادتكم المؤرخ في 17/8/2005 والوارد لهذه الإدارة برقم 1068 في 22/8/2005 والذي تطلبون فيه الإفادة بالرأي القانوني في مدي صحة ما تم صرفه للمهندس / مصطفي محمد رمضان 000 أمين عام تنفيذي لنقابة المهندسين من مكافآت ومنح خلال عام 2003 ، وكذا مدي صحة صرف مكافأة له مقابل عدم قيامة بالإجازات السنوية طوال العام0<br />وتذكرون سيادتكم انه بتاريخ 7/11/2004 ورد للجهاز من هيئة الرقابة الإدارية الشكوى المقدمة من السيد / مجدي حامد المحامي 000 ضد المسئولين بنقابة المهندسين وتضمنت الشكوى المذكورة ما يلي : ـ<br />1 ـ قيام نقابة المهندسين بصرف مقابل رصيد الإجازات للمهندس المذكور أثناء الخدمة دون وجه حق<br />2 ـ صرف مكافآت ومنح بخلاف المبلغ المقطوع المتفق عليه بالعقد المبرم مع المذكور 00 الخ0<br />لذلك نري<br />عدم صحة ما تم صرفه من مكافآت ومنح للسيد المهندس / مصطفي رمضان الأمين العام التنفيذي لنقابة المهندسين ـ بخلاف المبلغ المقطوع المتفق عليه في العقد المبرم معه ، وكذا عدم صحة ما تم صرفه له من مكافآت نظير عدم قيامه بالإجازات السنوية ـ وذلك للأسباب الواردة بالفتوي0{وحتى تاريخه لم يتم حصر هذه الأموال من تاريخ العقد ولم تسترد أموال الأيتام والأرامل من جيب كبار المسئولين}<br />وتفضلوا بقبول فائق الاحترام ،،،<br />مستشار الدولة لرئاسة الجمهورية<br />ورئاسة مجلس الوزراء والتخطيط والتنمية المحلية والإستشمار<br />المستشار / إبراهيم الصغير إبراهيم يعقوب<br />نائب رئيس مجلس الدولة"
