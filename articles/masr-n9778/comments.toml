subject = "عوده قويه"
author = "مصراوى"
text = "بسم الله الرحمن الرحيم<br />الف حمد وشكر لله تعالى على العوده القويه لجمعيات الشبان المسلمين حيث تمت اقامة اكبر دوره للالعاب الرياضيه على ارض محافظة سوهاج وهذه اول مرة تقام فيها مثل هذه الدوره على ارض محا فظه من محافظات الصعيد"
archived = "2008-10-15"
