subject = "الى صاحب التعليق  النصيحة في زمن ....."
author = "مغربية حرة"
posted = "2007-11-10"
text = "الى الاخ صاحب التعليق النصيحة في زمن كثر فيه الحاقدين الخونة . اول الامر الامازيغية ليست مدهب ديني الامازيغية هي ثقافة هم ناس مسلمون الفرق الوحيد هو عوض ان يتكلمو العربية هم يتكلمون الامازيغية المنتشرة في شمال افريقيا والممتدة الى جنوب مصر والسينغال الامازيغية اخي الكريم هي لغة تدرس والامازيغيون هم مسلمون هم السكان الاصليون للمغرب وليست مدهبا بالنسبة للاخوة الدين يسمعون لاول وهلة هده الكلمة كمان ان الامازيغ هم اكثر الناس حفاظا على الدين الاسلامي تجد التاجر الامزيغي عندما يحين وقت الصلاة لايتردد لحظة في اداءها داخل محل تجارته هم ناس لديهم انسانية اكثر من الباقي حتى ان بناتهم اكثر البنات لبسا للحجاب . ارجوك اخي تثقف قبل ان تتحدث عن شئ لاتعرفه لان اي معلومة خطا نشرتها سوف تحاسب عليها ثم انت بدكرك لمثال الدكتور هدا في الجامعة جعلت القارئ يظن انه مغربي وانت لم تدكر من اي بلد هو . ارجوكم لاتناقشو في امور لاتعرفونها الامازيغية ليست مدهبي ديني هي ثقافة لغة وعادات اجتماعية في قمة الاحترام للتدكير انا لست امازيغية لكن يؤلمني ان اسمع شيئا خاطئا الساكت عن الحق شيطان اخرس"
archived = "2010-03-14"
