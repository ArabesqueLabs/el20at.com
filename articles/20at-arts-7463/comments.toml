subject = "وقفت على الأمازيغية .."
author = "محمد نواف الحمدالله .."
posted = "2007-11-19"
text = "لقد تناسيتم // ولم أقل نسيتم // لأنكم قاصدون بهذا الشيء .. كل مافي هذه الدنيا من حروب بكافة أشكالها .. من مشاكل لها أول و ليس لها آخر .. من فقر وجهل ومرض .. من حرمان وجوع وعطش .. من ظلم ( طاغي ) وألم ومر وذل وقهر واستبدادوإضطهاد .. من قتل وسفك للدماء التي حرمها الله الإ بالحق .. من تكبر وتجبر وطغيان .. من حزن وأسى وعواطف مريرة .. من إرهاب يفتك بنا .. من شتم وإعتداء على الوالدين ونهرهما ومعصيتهما، وعند الكبر روميهما في دار المسنين (( أعوذ بالله بكل مايغضب الله )) . // يارضا الله ورضا الوالدين // ،،،<br />يقول عليه أفضل الصلاة والسلام : (( لاطاعة لمخلوق في معصية الخالق )) .. من ظلم الإنسان لأخيه الإنسان .. من الأمراض والأوبئة التي تهل وتزخ علينا كقطرات المطر .. من جشع وطمع وأنانية الإنسان في كل شيء .. من ومن ومن ومن ................................. الخ (( كل يوم يولد شيء جديد في هذه الحياة )) .. سامحوني إن أطلت عليكم .. ولكن هذه الأمور وغيرها من الأمور الأخرى يجب أن لانغفل عنها مطلقاً .. فيه كالهواء بالنسبة للإنسان وكل كائن خلقه الله عز وجل .. وأيضاً منطلقاً من قوله تعالى (( وذكر إن نفعت الذكرى )) . // سلامي للجميع //"
archived = "2010-03-14"
