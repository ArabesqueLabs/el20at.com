subject = "النصيحة في زمن كثر فيه الحاقدين الخونه؟؟؟"
author = "من الأردن .."
posted = "2007-10-29"
text = "أغلبية الشعب المغربي ... يتبعون المذهب الأمازيغي ... وهذا بحد ذاته كفر بكفر ... ؟؟!!<br />يجب على الشعب المغربي أن يفهم هذا الشيء .. لأنه وبكل بساطة هذا هو الحل الأساسي والنهائي والوحيد لهم ولغيرهم من بقية أتباعهم ؟؟!!<br />يانااااااااااااااااااس .. ياعاااااااااااااااااااالم ؟؟؟ إصحواااااااا قبل أن يأتي يوم .. وتظلو نائميين فيه إلى اللانهاية ..<br />أنتم بشر مثلنا .. ونحن مثلكم تماماً (( لانزيد ولا ننقص عنكم بشيء )) .. وإسلامنا هو خلاصن من عذاب الله الأليم ..<br />إن الله تواب رحيم .. أنه غفور رحيم ... إنه يقبل التوبه .. ويسامح ويعطف ويتقبل النية الصالحه .. اسرعواااااااا .. قبل أن يصلى عليكم ؟؟؟ .. باب التوبه مفتوووح للجميع .. هيا بنا لنغير أنفسنا .. هيا بنا للأمام .. هيا بنا لنرتقي بقيم الإسلام السمحة .. التي هي بعيدة كل البعد عن الأرهاب والتطرف الديني .. هيا بنا لرفعة الإسلام والمسلمين بكل بقاع العالم العربي والإسلامي .. بكل بقعة من بقااااااع الأرض .. فهي بلاد اللله الواسعة .. هنالك أناس مازالوا يعتقدون بأن هذا الكون ليس له خااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااالق ؟؟؟ ( استغر الله العظيم من كل نب عظيم ) .. هنالك أناس يحاولون تهميش وتشويه وتحطيم صورة الإسلام الحقيقية ... لا والله .. لا والله .. لا والله .. وأنا أقول لهم ومن معي .. خسئتم وخسئتم وخسئتم أنتم وأمثالكم ... أن الل حق علينا أجمعين .. هو الذي خلق الإنسان .. وهو أيضاُ خلق كل من الحيوان والنبات .....................................الخ .. وهنا أذكر قصة قالها لي أحد الأصحاب الكرام (( وفقه الله تعالى دنيا وآخرة .. وجعله من الصالحين .. وأدخله فسيح جناته )) .. المهم .. قال لي هذا الشاب وهو الذي يدرس في إحدى الدول الغربيه .. بأنه كان يؤخذ مادة من المواد الإجبارية بالجامعة .. وكان دكتور هذه المادة (( معروف عنه الشدد والعصبية الزائدة عن اللزوم )) .. حيث أنه في أول محاضرة دخل بها إلى القاعة .. وبعد السلام والترحيب والتعريف بنفسه .. قال لنا يا طلاب أنا الآن كتبت ع اللوحة كلام هل ترونه ؟؟ قالوا : نعم نراه، فقال لهم : إذن هو موجود .. وقال لهم أيضاً الساعة التي فوق اللوحة هل ترونها جيداً وإلى كم تشير هذه الساعة الآن، قالوا : نعم نراها بكل تأكيد .. فقال لهم : إّن هو موجود .. وضرب لهم مثال ثالث ورابع وخامس وسادس وسابع .. وهكذا .. ( طبعاً ضرب لهم أمثلة ماديه أي بمعنى آخر أمثلة محسوسة وملموسة .. لكي يقنعهم ) .. وبعد ذلك قال لهم وهو يضحك ويستهزأ وبصوت عال يكاد يصل إلى نهاية القاعات الثانية تقريباً .. (( إذا كان هذا الكون مخلوق من قبل خالق واحد وهو الله .. فهل فعلاً هو موجود ويراقبنا بكل الطرق ؟؟ أين هو ؟؟ أين يعيش ؟؟ ماذا يفعل؟؟ أين براهنه علينا ؟؟ .. )) .. أنظروا إلى سؤال هذا الدكتور الأحمق الخالي من الكياسه ( الذكاء) .. الذي ينم على أن هذا الدكتور من المفترض الاَ يكون دكتوراً .. الذي سوف يكون مكانه بإذنه تعالى نار جهنم خالداً فيها أبداً هو وأمثالة ممن يشككون بعظمة وقدرة الخالق عز وجل .. المهم .. ولكن هذا الدكتور يفعل مايريد والناس يفعلون مايريدون والله يفعل مايريد ؟؟؟ إلى أن قام أحدى الطلبة المسلمون وقال له بكل أدب واحترام (( حيث أنه يقابله بعكس ماكان مستخدماً لهجة السخرية والاإستهزاء )) .. وقال له : إّذا كان كل شيء له وجود فهو حقيقي لا خيالي .. فنحن هل نرى عقلك يادكتور ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ .. وهذا الكلام معناه أنه ليس لك عقل من الأساس .. فكيف هذا يعني ... وهنا سكت الدكتور .. وأنهى كلامه وقال له أن يلتزم الصمت .. ودخل بسرعة فائقة إلى موضوع الدرس الذي من المقرر هو شرحه لنا .. وفي هذه اللحظة بالذات إحمر وجهه .. وبدا العرق يتصبب من وجهه .. وظهرت عليه معالم القلق والتوتر والخوف ..فعلا ً يمهل ولا يهمل ؟؟؟ .. وإلى هنا هذه نهاية القصة .. الرجااااااااااااااااء ورجائي حار للجميع بأن يأخذو العبرة منها ومن غيرها من القصص ...الخ <<< انتهـــــــــــــــــــــــــــــــــــــــــى>;>;>;<br />والسلام عليكم ورحمة الله وبركاته ،، وشكراً"
