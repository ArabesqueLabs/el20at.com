[[comments]]
order = 0
subject = "(اللبيب بالاشارة يفهم)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "ليست الحادثة الاولى و لا و لن تكون الحادثة الاخيرة؟!!!<br />(حكمة مهداة الى الامبراطور (عادل لبيب)<br />محافظ و رئيس و مللم و سيد و امبراطور الاسكندرية<br />عظة لمن لا يتعظ<br />سوف تعزل شر عزلة بسبب فساد المحليات اللى انت تعجز عن اصلاحة و اعوجاجة<br />أحبك و لكنى اخشى عليك من الخيانة<br />نظف الاحياء قبل الطوفان ما يكتسح الجميع؟"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042837/http://masr.20at.com:80/newArticle.php?sid=17835"

