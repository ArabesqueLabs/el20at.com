[[comments]]
order = 2
subject = "الى صاحب تعليق(الشيطان يعظ)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "أرجوا ان تكون قد أتعظت يابن ابليس؟<br />خلاص استريحت؟ما بقتش تاكلك ؟<br />روح اشرب من البحر<br />موش عارف احنا مزعلينكم فى اية؟<br />هى احقاد و بس؟<br />و اللة انتم مساكين دنيا و اخرة<br />روح يابنى اللة يهديك؟!!! و يشفيك و يشفى اهلك الكلاب المساعير؟<br />و سلملى على(اللى بالى بالك)"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042837/http://masr.20at.com:80/newArticle.php?sid=17835"
