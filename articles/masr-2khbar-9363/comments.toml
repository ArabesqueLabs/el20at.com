text = "حسبى الله ونعم الوكيل فى هذا النظام الظالم وفى فتحى سرور والحكومة الفاشلة والله يكفى مختار البية انة راجل محترم بعيد عن تصنيفة السياسى فهو شخص خلوق وبشوش ومحترم جدا ولكن لاسف البلد عاوز الى زى حازم حمادى الاقطاعى رجل يشرب الخمر ولا يتقى الله فى شى والمهم عندة السلطة وبس حسبى الله ونعم الوكيل وانا لا انتمى الى احد بس عرفت الا ثنين على الطبيعة"
