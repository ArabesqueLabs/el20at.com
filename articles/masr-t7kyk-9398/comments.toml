[[comments]]
order = 1
subject = "استاذ الحقوق الكذاب"
author = "جار القمر"
posted = "2008-06-22"
text = "زمان كان فية استاذ حقوق فى جامعة اسكندرية ايام المرحوم السادات رشح نفسة لمجلس الشعب ولا داعى لذكر اسماء<br />هذا الاستاذ الفذ والضليع فى القانون كتب يفط واعلانات الدعاية وعلقها على محطات الترام وفى الشوارع<br />وكانت اعلاناتة جملة واحدة<br />الرجل الذى يسأل اين القانون ليقف بجانبة ولا يسأل اين القوة ليقف بجانبها -- انتخبونى لامثلكم فى مجلس الشعب<br />وبمجرد نجاحة<br />اشتغل ترزى قوانين<br />وفصل للسادات كل القوانين التى اطلق عليها فيما بعد القوانين سيئة السمعة<br />مصر من فوق حلوة جدا<br />لما تطلع فى الطيارة من فوق وتبص على مصر تلاقيها جميلة جدا<br />ولما تتقلد منصب فوق تلاقى الحياة بمبى والعيشة جميلة<br />والحاج سرور لو بيعرف كمبيوتر وفتح يو تيوب وكتب فتحى سرور وبحث هيشوف حاجات عن فتحى سرور تخلية يطلع على برج الجزيرة ويرمى نفسة من هناك<br />اين انت يا مجلس الشعب عندما كنت مجلس الاعيان<br />مجلس الاعيان الحقيقيون وليس الحرامية<br />ومنذ تقلد السادات رئيس مجلس الشعب واصبح هذا المجلس مجلس التقريع - الم يقل السادات من على منصة المجلس ان جمال عبد الناصر احسن من جميع الانبياء<br />استغفر اللة"
archived = "2010-03-14"
capture_url = ""

