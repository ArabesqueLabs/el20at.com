text = "حرام عليك يا اخى قرفنا من اشكلاكم كام سنة وانت قرافنا انت والريس بتاعك حرام عليكم احنا زهقنا الواحد قرف من البلد دى والى بيحصل فيها كلك كذاب يا سرور وانت فعل ترزى الحكومة واحمد عز ولكن نملك وما ل الشعب فالحكومة فوق الشعب"
