subject = "عن اى اداء تتحدثون ------- الكلام موجة لمين"
author = "شحبور"
posted = "2009-01-25"
text = "با اختصار شديد<br />لما السادات مات<br />كانت مديونية مصر حوالى 2 مليار دولار<br />انما الان المديونية الخارجية حوالى 35 مليار دولار حسب الصحف الحكومية والمديونية الداخلية حوالى 700 مليار جنية<br />الديون دى اتصرفت على اية<br />بتوع الوطنى بيقول لك اتصرفت على البنية الاساسية<br />وكلنا شايفين البنية الاساسية منهارة --- المواصلات والقطارات حالتها وحوادث بتعملها<br />الكهرباء اللى بتنقطع عشرين مرة فى اليوم<br />المستشفيات اللى هى مراكز توزيع الامراض والموت<br />ببساطة مفيش بنية اساسية<br />هينط واحد من الوطنى ويقول لك شوف بقى عندنا كم مليون تليفون - هقول لة الفضل لاختراع الميكروويف - يعنى تعمل برجين فوق اسطح عمارات وتربط المدن بشبكة ميكروويف والعملية مش محتاجة لا حفر ولا مد كابلات ولا يحزنزن - ودى بسبب تقدم الاتصالات فى مجال الميكروويف<br />يعنى الفلوس اتصرفت على اية<br />يبقى اداء حكومى اية<br />القروض دى انصرفت على اية<br />والبلد اندينت لية"
