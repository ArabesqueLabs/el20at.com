text = "[quote name=\"لاديني\"]لااريد الدخول في جدالات مع المؤمنين لكن يكفي ان اقول للاخ \"مسلم\" ان العلم الحديث اثبت ان القلب مجرد مضخة للدماء بمعنى عكس ماقالته الكتب السماوية مجتمعة التي كانت تعتقد ان الايمان والكفر بالقلوب وابسط دليل ان هناك الاف الناس الان يعيشون بقلوب صناعية بدون ان يحدث خلل في تفكيرهم او تغيير فيما يعتقدون...<br />لااعتقد ان \"عقلك\" قد يصور لك انه اذا وضع قلب مسلم مات بحادث لمريض بالقلب يهودي فهل تعتقد ان اليهودي سيصحو من العملية مسلما؟؟!!<br />اعتقد ان مسالة الاديان اصبحت موده قديمة وهي تعيش الان في المجتمعات المتخلفة فقط وكلما زادات تخلفا زادت ايمانا[/quote]<br />iهو انت لما بتحب و تتألم عشان حبيبك هجرك أو قلبك يألمك عشان ابنك أو أو أو و انت عندك قلب صناعي ... تسمي ده ايه ؟؟ ربنا اللي هو الله يا \"ملحد بيه\" اللي هيتحرق في نار جهنم ان شاااء الله و بأذن الله و هدعيلو انو بقرب أجلو و يكون ده مصيرو يارب ..."
