text = "كلامك صحيح يا لا ديني<br />و أنتا يا (مسلم) إزاي عايزهم يمحو كلامي وعدم نشرو بحجة حرية الرأي !!!! أمال إنتا إلي عايز تقول رأيك وبس ولا إيه وتقعد تكفر في أي واحد وتلعن فيه براحتك<br />وبعدين مبقدرش تعرف أنا ألحدت عشان قساوة قلبي ولا أي حاجة لأنك مبتعرفش حاجة عني ومبتعرفش إزاي بفكر<br />وبعدين مستحيل تتناقش مع ملحد وتجيبلو أدلة من القران يا غبي لأنو مبيأمنش بيه وأساسا مش حتعرف تغير من تفكير السلفي ولا الإخواني مهم أهو بيكرهو بعض وكل واحد شايف نفسو على حق"
