text = "رسل هذا التعليق بواسطة : لاديني<br />لااريد الدخول في جدالات مع المؤمنين لكن يكفي ان اقول للاخ \\\\\\\"مسلم\\\\\\\"<br />دا اقتباس لردك لا دينى بتعترف فيه بالايمان والمؤمنين معنى كدا انك بتحاول تستر على شئ موجود فعلا وانت مش حابب تعترف بيه لانه ثقيل على نفسك وحتى لا تكلف نفسك مشقه العباده والتكليف لله<br />وحتى تتبع هواك<br />أرسل هذا التعليق بواسطة : ملحد<br />وبعدين مبقدرش تعرف أنا ألحدت عشان قساوة قلبي ولا أي حاجة لأنك مبتعرفش حاجة عني ومبتعرفش إزاي بفكر<br />وبعدين مستحيل تتناقش مع ملحد وتجيبلو أدلة من القران يا غبي<br />الغبي هو انت لانك عارف ان دا دليل من القران العظيم هتعترف بيه امتى لما تصعق من تيار كهربي وتقرب من الموت ولما تفوق تقول انا اتكهربت انت شفت التيار الكهربي وهو بيسير في جسمك ولا حسيت باثره عشان تعترف بوجود الله<br />ربنا يفك اسر قلبك وتعقل الدين والاسلام<br />بس عايزه اعرف انت والدك صاحب ديانه او كتاب سماوى انت ولا دينى"
