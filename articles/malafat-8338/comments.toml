[[comments]]
order = 12
subject = "لا وجود للاخوين رايت"
author = "عصفور من الشرق"
posted = "2008-10-12"
text = "لو واحد ملحد سمع ان طيارات الاف 16 او البوينج او اي طيارة من اي نوع طايرة في الهوا لوحدها ومحدش اخترعها وانها جت صدفة تجمع ذرات معادن معينة بنسب معينة بشكل معين والوقود اتجمع عضويا بشكل ما ودخل التانك لوحده بشكل ما وبعدين الطيارة طارت لوحدها برده بشكل ما ونزلت برده بشكل لوحدها بشكل ما لو قلناله كده هيقول علينا متخلفين<br />لو انكرنا ان الاخوان رايت اخترعوا الطيارة وصنعوها هيقولوا علينا هبل<br />انما لو احنا قلنالهم الطيور في السما ربنا خلقهم ومش محض صدفة او قلنا لن ملايين الاجرام السماوية تطير في الفضاء بتتابع وتناسق زمني رهيب يشبه تكوين الكترونات الذرة , لو قلنا كده تلاقيهم يبحلقوا اوي ويستنكروا<br />ينكروا وجود الله ولا ينكروا وجود الاخوان رايت<br />الاخ اللي بيقول بكلم ربنا ومش بيرد عليا ومش بشوفه<br />مع اختلاف التشبيه سيادتك البشرية قعدت ملايين السنين مش مستوعبة وجود شعاع ليزر غير مرئي او ميكروبات وجراثيم غير مرئية ولما وصلنا لامكانية رؤية هذه الاشياء رأيناها<br />هتقول دي حاجات صغيرة اوي ؟<br />طيب فيه ملايين الشموس اللي حجمها اضعاف اضعاف شمسنا ومع ذلك البشرية عمرها ما شافتها الا آخر سنتين ولسة التلسكوبات بتؤكد وجود المزيد مما لم تصل اليه القدرة العلمية<br />يعني حتي الكبير حضرتك تعجز عن ادراك وجوده<br />لو حضرتك عايز تسمع كلام ربنا هتفتح كلامه وتقراه هتحس بيه هتعرف ان انت مش مخلوق عبثا وان لكل شيء غاية ونهاية فاذا لم تعرف غاية وجودك افسدت علي نفسك نهايتك وانت حاسس بكده جواك كويس اوي<br />ربنا يهدينا جميعا الي ما يحب ويرضي"
