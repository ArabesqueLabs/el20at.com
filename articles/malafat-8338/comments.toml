subject = "مؤمن"
author = "مسلم"
posted = "2008-03-01"
text = "بسم الله الرحمن الرحيم والصلاة والسلام على رسول الله سيدنا محمد صلى الله عليه وسلم ..اما بعد ان الذى يلحد اذا سالته لماذا تلحد فانه لن يجد اى اجابة مبنية على العقل والمنطق ..وذلك لان سبب الحاده مبنى على قساوة قلبه الذى اصبح كالحجر ...لان الله سبحانه وتعالى اوضح من خلال نبيه الكريم سيد الخلق سدنا محمد صلى الله عليه وسلم ان المؤمن امن بقلبه واتبع بقلبه فالايمان نابع من القلب وكذلك الكفر ينبع من القلب وليس العقل ..لانه الكافر ابن الكافر نفسه لو سالته من خلق السماوات والارض ليقولن الله....ولذلك للاسف الحوار غالبا مع ملحد للاسف لا يجدى وذلك لان سبب الحاده قلبه وليس عقله...ارجو من ادارة الموقع ان كانوا مؤمنين عدم نشر مثل هذا الكلام المتخلف من اشخاص كفرة بحجة حرية الراى ..الحرية فى الراى تختلف عن الحرية فى الكفر ..ولعن الله كل كافر وكل ملحد على وجه تلك الارض ..ولعنوا فى الدنيا والاخرة اولئك السفلة واولئك الكفرة ..فانهم قوم نجس ..يظنون انفسهم ملكوا الدنيا وهم اضعف من خلقهم الله ...يظنون انفسهم اذكى العقول وهم فى ظلام ..يظنون انفسهم الهة من دون الله وهم احقر من خلق الله .....ارجوا من ادارة الموقع ان كانوا مؤمنين عدم نشر ذلك التخلف وذلك الكفر بحجة حرية الراى ...وربنا يشفى العقول والقلوب الضالة ..ربنا يشفى"
archived = "2010-03-14"
