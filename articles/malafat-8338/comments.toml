text = "بسم الله ارحمن الرحيم السلام عليكم شباب الاسلام وبنات المسلمين ...ربنا يبارك فيكوا ويعزكم باذن الله<br />ثانيا احب ارد على الملحد واقوله انت مين الى خلقك غير الله طبعا عقله وقلبه مسيطر عليهم الشيطان وهيقولى رد اهبل ساذج ذيه ابويا وامى هقوله انت غبي ومخك دا يكون مخ حيوان هيكون افضل لان الحيوان بيعبد الله الى انت مش معترف بوجوده والحجر والشجر والمياه والبحر معترفه بيه وبتسبحه ليل ونهار لاكن انت انسان متستحقش الحياه ولا الهواء الى بتتنفسه واى شئ من الى ربنا فضلك بيه عن غيرك من المخلوقات التانيه<br />ولما تموت بتروح فين بتروح لتراب ويوم القيامه بترجع تانى وتقف بين ايد الله الى انت مش معترف بوجوده هتقوله ايه مش معترف بيك حسبي الله ونعم الوكيل<br />الهواء لى بتتنفسه وهو سبب استمرار حياتك انت مش بتشوفه حاول تمنعه عنك لمده يوم ولو لسه عايش تعال قولى ايه ردك لو انت معترف بالى بتشوفه بس والاكسجينن مش بتقدر تشوفه او تمسكه<br />يا مسلمين استنكروا كلامه وادعوا اضعف الايمان بالقلب ان ربنا يهدى كل عاصي كافر ملحد لدين الحق"
