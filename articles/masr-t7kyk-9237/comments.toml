[[comments]]
order = 2
subject = "بلدنا على راسنا"
author = "أميمة الشاذلي"
posted = "2008-06-05"
text = "والله هيا فكرة جميلة جدا بس مثالية قوي<br />انا عن نفسي مستعدة اعملها بس سيبلي فرصة احوش شوية<br />انا رايي ان في ناس اصلا مكوشين بالملايين وناس تانية ما معهاش حق ايجار اوضة صغيرة<br />يعني كده هتبقى قسمة غير عادلة<br />انا متاكدة يا خباب ان لو الناس اصحاب الملايين اتبرعوا بجزء من ثروتهم والله هتتحل الازمة<br />بس هي فكرة ذمم بقة<br />هي الفكرة عجباني..اننا كلنا نشترك في مصلحة بلدنا اللي ضمانا بكل مشاكلنا بس الفكرة ان الموضوع مش وردي<br />يعني ممكن نعمل حملة لكل الناس الموهوبة في البلد واللي الناس تحب تتفرج عليهم او تسمع صوتهم ويعملوا حفلات يروح جزء من ريعها لصندوق تسديد الديون<br />كده يبقى بنعمل حاجة بجد<br />يعني لو كترنا شوية من الحفلات للمغنيين والمغنيات والممثلين والممثلات طب والله ليحصل فرق..لان مجانين الفن كتير قوي.. وبكده احنا بناخد من فلوس اللي معاهم (لان الغلابة اكيد مش هيحضروا) ومن غير ما يحسوا انهم دفعوا فلوس للحكومة<br />يعني بشكل لطيف<br />اشمعنا ام كلثوم كانت بتجمع تبرعات لصالح البلد ايام الحرب.. ولا احنا مش بنحس ببلدنا غير ايام الحرب؟<br />ما هو احنا برضه دلوقت في حرب.. لاننا لو ما سددناش ديوننا يبقى هنلاقي رغيف العيش انقرض من مصر..<br />او انتحر بمعنى اصح..لان حتى رغيف العيش زهق والله..<br />بس عموما انا عجبني فكرة التحقيق قوي..مرسي يا خباب.. دايما بتتحفنا بافكار ما شاء الله هههههه<br />لا بجد.. الموضوع فكرته ظريفة بس محتاجة تكون واقعية حبتين"
archived = "2010-03-14"
capture_url = ""

