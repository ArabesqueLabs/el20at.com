subject = "انت فاكرنا يا ريس"
author = "مش ناقش"
posted = "2008-06-03"
text = "فاكر الجعانين<br />فاكر المشردين<br />فاكر المضروبين<br />فاكر المعتقلين<br />فاكر المخطوفين<br />فاكر المعتقلين<br />فاكر المنهوبين<br />مسكين يا حبيب الملايين<br />حتفتكر مين ولا مين ولا مين"
