[[comments]]
order = 7
subject = "الى الاخ حسام الزمر"
author = "مش ضروري"
text = "يا استاذ حسام الزمر الخروج على الامام جائز شرعا بشرط<br />ان تكون قادر على الخروج عليه وازاحته<br />الامام محمد بن عبدالوهاب كان قادر على الخروج على الحكام والامراء<br />لكن الشعب المصري غير قادر على ذلك اطلاقا لان الحاكم معاه الطيران والمصفحات والدبابات والامن المركزي<br />يبقى ما فيش امامنا غير سلاح الدعاء بأن يولي الله علينا خيارنا ولا يولي علينا شرارنا<br />او ربنا يهدي الحاكم<br />ادعي للحاكم يا استاذ حسام ان ربنا يهديه<br />ربنا قادر على كل شيء<br />وارجو عدم الاستهانة بسلاح الدعاء فالمولى عز وجل قال ادعوني استجب لكم"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004247/http://masr.20at.com:80/newArticle.php?sid=14375"

