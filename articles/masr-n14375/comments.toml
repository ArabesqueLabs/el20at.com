[[comments]]
order = 5
subject = "الغلبة"
author = "حسام"
text = "السلام عليكم<br />ما رأي مولانا فضيلة الشيخ فيما قام بة الامام محمد بن عبد الوهاب و الامام محمد بن سعود من قتال للأمراء الذين كانت لهم الغلبة و المولون من قبل الخليفة العثماني؟؟؟؟؟؟؟؟!!!!!!!!!!!!!!!!!!!!<br />ألم يكونوا سلفيين<br />ألم يكن سعيد بن جبير من السلف؟<br />ألم يكن عبد الله بن الزبير من السلف؟<br />ألم يكن بن تيمية من السلف؟<br />و اذا كان رأي سلفنا هو \"هي السمع والطاعة لأمير المؤمنين، سواء كان أميرا ببيعة أم بغلب\" فما المانع من المغالبة؟<br />و اقصد المغالبة القانونية و الدستورية<br />أود ان أقول في النهاية أن كل يدعي وصلا بليلى -السلفية- و انا أظن أن هناك 3 اتجاهات سلفية<br />1) سلفية جهادية منها بن لادن<br />2) سلفية سلطانية -مع السلطان-<br />2,5) سلفية علمية فقط<br />3) سلفية عملية علمية =الشيخ سلمان العودة و الشيخ على القرني و الشيخ عائض القرني وأخرون بارك الله فيهم و وفقهم<br />سلام<br />حسام"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004247/http://masr.20at.com:80/newArticle.php?sid=14375"

