[[comments]]
order = 11
subject = "ميييييييييييين.... لطفي؟؟؟؟؟"
author = "آه"
text = "أنا أوافق تماما على ما أفتى به وانتهى إليه مفتي سلفية محافظة دمنهور.. ليه بقى ؟ قلت لي ليه.. أقول لك .. لأنه راجل عالم وسلفي ..وكون أنه سلفي يعني قديم وعاصر وتتلمذ على يد مولانا الشيخ محفوظ أبو طاقية في مسرحية السكرتير الفني .. الذي أطلقها مدوية وصارت منهجا ومبدأ شرعيا لجماعة السلفية وهي ( اللي يتجوز أمي أقول له ياعمي) أي واحد يتجوز أمي أقول له ياعمي !! ..شوف العقد.. شوف الشراشيب.. ليه بقى ؟؟ لأنه أستك منه فيه ..تشده يلسعك .. طب تشده ليه ؟؟ ما هو علشان يلسعك!! وبموجب هذا المبدأ الشرعي يبقى أي واحد يتجوز أمي أقول على طول ياعمي؟؟ ما يهمنيش بقى اتجوزها إزاي .. سواء رسمي أو عرفي أو مبايعة أو غلبه ( يعني غلبها وركب فوقها فإنهارت من تحته وعمل فيها قلة أدب بدون رضاها ) برضه أقول له ياعمي ليه بقى ؟ علشان الفتنة ؟ لأني لو اعترضت أو استجبت لاستغاثة أمي وهي مركوبة وحاولت أدافع عنها يمكن تحصل فتنه؟ والراجل اللي راكبها يعورها أو يعورني؟ شوف الحكمة !! يبقى هوه عمي وتاج راسي وبراحته بقى .. يركب أمي أو حتى يركبني مش مشكلة ..المشكلة إني أبعد عن الفتنه وكفاية عليا الفتة !! أحبك يا عم الشيخ ياللي ماتنفعشي تبقى عمي ..عارف ليييه ؟؟ لأنك زي أمي واللي يركبك أقول له ياعمي !!! مييييييييييييييين .. لطفي ؟ معلهش يابني أصل أنا عندي فتوى ..ساعة تروح وسياعة تيجي .آه..ساعه تروح وساعه تيجي آه"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428214945/http://masr.20at.com:80/newArticle.php?sid=14375"
