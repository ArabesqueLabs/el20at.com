[[comments]]
order = 9
subject = "الى الأخ"
text = "السلام عليكم<br />اتفق معك في عدم الاستهانة بسلاح الدعاء<br />و اتفق أيضا في ان الفقة الاسلامي لم يحرم الخروج مطلقاً و لكن وضع له ضوابط منها ما قلتة<br />و ان كنت أرى ان هذا الحل غير مناسب خاصة مع تطور الدساتير و النص على تداول السلطة فيها<br />و اختلف معك في أن الامام محمد بن عبد الوهاب كان قادرا من البداية على المدافعة و قد تعرض حركة الامام محمد بن سعود لبعض الانتكاسات و لم يستتب الأمر لهم الا في زمن الملك عبد العزيز<br />و هذا ليس موضوعنا و لكني اتحدث عن المغالبة السياسية و دليلي قولة تعالى<br />\"وَلَوْلاَ دَفْعُ اللّهِ النَّاسَ بَعْضَهُمْ بِبَعْضٍ لَّفَسَدَتِ الأَرْضُ\" البقرة 251<br />و قولة تعالى<br />\"وَإِذْ قَالَتْ أُمَّةٌ مِّنْهُمْ لِمَ تَعِظُونَ قَوْمًا اللَّهُ مُهْلِكُهُمْ أَوْ مُعَذِّبُهُمْ عَذَابًا شَدِيدًا قَالُواْ مَعْذِرَةً إِلَى رَبِّكُمْ وَلَعَلَّهُمْ يَتَّقُونَ\" الاعراف 164<br />و جزاك الله خيراً<br />سلام<br />حسام"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004247/http://masr.20at.com:80/newArticle.php?sid=14375"

