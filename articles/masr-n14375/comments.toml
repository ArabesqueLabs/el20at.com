[[comments]]
order = 0
subject = "السلفية بتوع بنك التسليف - وامير الحرامية"
author = "الشيخ فنتوش"
text = "قال عيط ومعيط فى قضية نطاط الحيط - والسلفية بتوع التسليف قصدى بنك التسليف<br />ان احدهم ذهب يستفتى حرامى لابس عمة وعامل نفسة درويش<br />يا مولانا ما رأيك لو بال الكلب على حائط ؟<br />فقال الحرامى المستشيخ<br />يهدم فورا<br />فقال السائل<br />يا مولانا لقد رأيت الكلب يبول على جدار بيتك انت<br />فغير الشيخ فتواة قائلا<br />قليل من الماء يطهرة<br />فالشيخ اللى افتى بامير المؤمنين - على اى اساس - هل امير المؤمنين يأم جماعة المسلمين فى الصلاة الجامعة<br />هل يجلس بجانب المنبر يفتى للناس فى امور دينهم<br />هى حلة فتة هناكلها بعد الحضرة<br />هذة فتوى شيخ شخشخت ركبة<br />امير المؤمنين يختارة اهل الحل والعقد - اللى هى الانتخابات العامة مش يختارة دوريش متخلف عقليا"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004247/http://masr.20at.com:80/newArticle.php?sid=14375"

[[comments]]
order = 1
subject = "في الامثال"
author = "3agab"
text = "قال المثل المغلوط<br />( اهدي صحبك من الصبح للعصر وان جاء المغرب ومهتداش ضله )<br />والنصيحة كانت في ما قبل التوريث والتضليل هو اباحة التوريث<br />وصدق هذا المفتي وما كذب ووافق رايه راي حكماء الامم السابقة المذكورة في الامثال الشعبية قبل نزول الكتب السموية وقبل اختراع علم الادارة والاجتماع واحقية الولاية والامامة وقبل معرفة حقوق الانسان والحرية"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004247/http://masr.20at.com:80/newArticle.php?sid=14375"

[[comments]]
order = 2
subject = "اتقوا الله فينا يا من تقولون بأنكم علماء"
author = "فارس العربي"
text = "يارجل اتق الله . ماذا تقول في شيء أعتقد أنه لاعلم لك به وتستشهد باستشهادات عفا عليها الدهر , ولعلي من كلامك أيضا آخذ الرد عليك وهو أنه كما نعرف جميعا لم يولي النبي صلي الله عليه وسلم أحدا خلفه من بعده علي المسلمين وإن كان صلوات ربي وسلامه عليه قدم أبوبكر للإمامة إلا أنه أبدا لم يكن فرضا من النبي صلي الله عليه وسلم علي المسلمين بدليل أنهم تشاوروا فيما بينهم حتي استقر الرأي علي الصديق رضي الله عنه ولأنه صلي الله عليه وسلم لو فعل ذلك لهاج الناس ليس وقت فعل النبي صلي الله عليه وسلم ولكن بعد وفاته كما هو الحال الذي تفرضه وتقوله أنت إلا إذا كان معك وحي تتلوه أو أنزل عليك كتاب , وأيضا فضيلتكم تقول درءا للفتنة !!! أي فتنة تدرأ إذا كان كلامك هو مفتاحا لها , ثانيا وثالثا , أنت تتحدث عن السمع والطاعة , بالله عليك أستحلفك بالله الواحد القهار , أن تقول بصدق وحق شهادة لله تعالي حينما تولي أبوبكر الصديق رضي الله عنه الخلافة ماذا قال , وكيف كان عهده ؟؟؟؟ وأيضا لما تولي الفاروق !!!ماذا قال ؟؟؟ وأنتم أيها السلفيون أو يامن تدعون بأنكم سلفيون !!! أين ( الدين النصيحة ) إن تولي جمال أوغيره بل قل الآن أين أنتم من النصيحة ؟ ولماذا لا توجه النصيحة لسيادة الرئيس مبارك , بأن يرأف بحال الناس وأن يولي عليهم من يصلح لهم حالهم بدلا من المنافقين والأفاكين ؟ أرجو من فضيلتكم ألا تضع علمك وتوجهه في مسائل لا علاقة لك بها أصلا لأنه يبدو أنكم لاتشعرون بحال الناس , آسف للإطالة ولكن أرجو أن أكون قد وفقت في إيقاظ عالم كما يقول عن نفسة من زلة تودي به والعياذ بالله ....................فارس العربي"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004247/http://masr.20at.com:80/newArticle.php?sid=14375"

