subject = "ذكريات"
author = "نيفين نيفى نوفا"
posted = "2007-07-02"
text = "لو كانت الكاميرا هى الجهاز اللى بيوقف الزمن عند لحظه علشان نتفرج عليها فالاوتوجراف هو الذكريات حين تكتب<br />و مهما تطورت وسائل تسجيل الذكريات هيظل للوتوجراف الورقى مكانته و رومانسيته لان خط الشخص اللى بيكتبللك هو بمثابه معلم من معالم شخصيته اللى بيخليك تفتكره اكتر خصوصا اذا كان الخط مميز<br />انا عن نفسى مبميلش للتكنولوجيا كثيرا و بفضل الاوتوجراف الورقى التقليدى ابو صفح قديمه و اللى بتكون مقطوعه احيانا بفعل الزمن<br />الموضوع جميل يا استاذ محمد"
