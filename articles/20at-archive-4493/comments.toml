subject = "البوس البوس 000 الدعم الدعم"
author = "مجدي حامد المحامي"
posted = "2007-11-26"
text = "البوس البوس 0000 الدعم الدعم \"<br />الحزب الوطني مغتصب السلطة وحكوماته الفاشلة المتعاقبة يستعصي عليهم من باب الكبر إعلان إفلاس مصر علي يديهم ، وكل يوم والتاني يطلعوا بحاجة جديدة تنكد علينا العيشة واللي عيشينها ، فتارة يلهفوا المنح والمعونات والقروض الأجنبية وإحنا قاعدين ، وتارة يلهفوا القطاع العام وشركاته بالخصخصة وإحنا ساكتين ، وتارة يلهفوا فلوس التأمينات الاجتماعية وإحنا نائمين ، وبعد ما خربوها وقعدوا علي تلها \"ملقيوش\" غير حجب لقمة العيش وزجاجة الزيت عن الفقراء ، والجديد هذه الأيام قصيدة إلغاء الدعم العيني علي السلع والخدمات وتحويله إلى دعم مادي ، ولقد ذكرتني تمثيلية التمهيد لإلغاء الدعم، بقصيدة عمنا الشاعر الكبير مرجان أحمد مرجان البوس البوس00 الشوق الشوق 00 الحضن الحضن ، وقطعا في القريب العاجل وفي ظل غلاء الأسعار الذي لا يطاق مع تدني الدخل ورفع الدعم تدريجيا سوف نسمع قصيدة المم المم الجوع الجوع ، ولو حد منا فكر يتظاهر ضد الحكومة الفاشلة اعتراضا علي سياسة القهر والتجويع والتوريث والتزوير سوف يتصدي له فرق العو العو الاعتقال الاعتقال التلفيق التلفيق ، ولن يجد محدودي الدخل بد سوي توسيع مجال الرشوة وربما السرقة والهجرة غير الشرعية وعندها سنسمع قصيدة السجن السجن الضياع الضياع الغرق الغرق0<br />مجدي حامد000 المحامي :<br />magdy75@gmail.com 24 /11/2007"
