text = "اليهود معروفون بالدسائس منذ القدم ,دسوا بينهم الدسائس حتى لايعرف اليهود المخلصون لكتابهم الحقيقة عن انفسهم ,حرفوا ,زادوا وكذبوا على الله وعلى انفسهم ,ولن ينتهي اشكال اليهود مع العرب الى ان يرث الله الارض ومن عليها.انهم جهلة بعلم الاهوت وكتابهم الأصيل الغير المحرف الذي يدعوا الى اتباع محمدوالايمان به صلى الله عليه وسلم."
