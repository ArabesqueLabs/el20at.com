subject = "عفريتة هانمممممممممممم"
author = "عفريته هانم"
posted = "2007-10-09"
text = "احمد ياهواري بجد موضوعاتك تحفة والله وانا عن نفسي بحبها مووووووووووت لأن تعبيراتك حلوه وجملك مش مستهلكة وزي ما بيقولوا الموضوع في قلمك بيتحول لدهب وافكاراك حياتيه اب تو دات يعنى عشان اللي مش بيفهموا عربي ربنا معاك يا جميل"
