subject = "اللهم اعز الاسلام"
author = "ناصر"
posted = "2007-10-09"
text = "اللهم زد عزة الاسلام وزد منعتة<br />والقى الحسرة والذلة والانكسار فى قلوب اعداء الاسلام واصحاب المؤتمرات الحاقدة فى المهجر<br />الكلاب تعوى والاسلام يقوى ويشتد<br />ونور اللة هو الغالب<br />اذا جاء نصر اللة والفتح ورايت الناس يدخلون فى دين اللة افواجا فسبح بحمد ربك واستغفرة انة كان توابا"
