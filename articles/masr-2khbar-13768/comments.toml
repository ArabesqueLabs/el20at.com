author = "خارج عن القانون"
posted = "2009-10-27"
text = "هذه المدعيه انها صحفيه وتعلمت وتربت فى محراب العلم الصحفى تقوم بلإستدراج هاذا الغول البشرى الشامخ شموخ القطط المذللوله وتوقعه هو ومن يحبوه فى براثم الرذيله والقول الفاحش البذئ وهى قد قدصدت ذالك لانها قبضط ثمن ذللك من القاضى السابق ورجل القيم والمبادئ والفضيله مرنضى ولا نعلم ان كانت العلاقه الجنسيه بين شوشو وهى هى نفس البنت هبه المظلوم فى هذه القضيه هو المواطن الذى يصغى لهذه المخادعات والرذائل والفواحش ما ظهر منها وما بطن اطالب من عدالة الشعب المصرى الحر ان يقوم بنسف اسم كل من شوبير وهبه ومرتضى ذلك الثلاثى البشع من ذاكرة تاريخنا وان نلتفت لحالنا ونستاصل كل الأمراض المسرطنه مثلهم من حياتنا ونفوض القضاء المصرى الشامخ لاخذ حقنا منهم هم اتلثلاثه والضرب بيد من حديد على من تجرئ وتسول له نفسه للغوص فى مصالح الناس واضرارهم تحياتى"
archived = "2010-03-14"
capture_url = ""
