[[comments]]
order = 0
subject = "اتقوا الله"
author = "محمد"
posted = "2007-11-01"
text = "انا مش عارف احنا بنتكلم على تونس ولا على امريكا ,هل تونس بلد مسلم؟اشك؟ هل الحكومه التونسيه حكومه مسلمه؟اشك؟ يااااالله اصبح المسلمون يحاربون الاسلام . بلد مسلم تحارب الحجاب, ولماذا نتعجب عندما نحارب من الغرب . الحمد لله الذى شرفنا اننا مصريون ,على الرغم من الماخذ على الحكومه المصريه إلا انهم لم يفعلوا هذا اطلاقا وان كان قد فعلها التلفزيون المصرى من قبل ولكن سرعان ما أخذت المحجبات حقهن ,<br />اللهم اهدى قوما يدعون الاسلام وهم ابعد مايكونون عنه.<br />اللهم لا تؤخذنا بما فعل السفهاء منا.<br />اللهم اهلك من يحارب الاسلام واهله ."
archived = "2010-03-14"
capture_url = ""

