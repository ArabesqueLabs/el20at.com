text = "ياعم انيس انت لسة عايش<br />مش انت بتاع العفاريت والذين هبطوا من السماء<br />ياعم روح بقى كلامك بقى ماسخ وخايب وروح صلى ركعتين يمكن ربنا يغفر الحادك وكفرك بتاع زمان<br />ياعم يا مهرج قدام السادات وكل يوم تروح تحكى لة حكاية قبل النوم لغاية ما راح فى داهية بسببك<br />ياعم خلاص بقى الضرب فى الميت حرام ارحمنا وروح موت"
