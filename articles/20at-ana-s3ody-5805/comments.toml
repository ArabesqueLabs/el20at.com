text = "لا فعلا انا امضيت فترة طويلة من حياتى فى السعغودية و كان لى صديقات سعوديات مخطوبات يمنعن من رؤية الخطيب و كانوا يضطرون الى الخروج مع بعضهم فى السر و ده امر معروف جدا و الاسلوب الغريب ده هو اللى بيدفع الفتاة و خطيبها الى الوقوع فى الخطأ بسبب تشدد الكثير من الاسر السعودية يا جماعة كلها ظواهر و المجتمع السعودى غنى بكل الظواهر فى اللى بيخرج زى ما انت بتقول و فيه الملتزم بتشدد اهلة"
