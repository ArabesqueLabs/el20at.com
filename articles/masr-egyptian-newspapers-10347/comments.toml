subject = "بنت بمائة راجل"
author = "بنوتة مصرية"
posted = "2008-10-29"
text = "1_ بجد والله دى بنت بمائة راجل<br />2_ ممكن فعلا يكون دا سبب من أسباب تحرش ذلك السائق بتلك الفتاة لكن مش دا السبب الاساسى لأن أى جريمة تحرش بتحصل فى مصر ممكن تقوم بيها حتى شباب المدارس او الجامعات يعنى مش شرط يكونوا تعرضوا للقهر أو عندهم هموم وضغوط<br />3_ برأيى أن ممكن تكون الفضائيات سبب كمان من الاسباب من نشر الكليبات العارية والافلام الاباحية.<br />4_ تربية الانسان كمان فى بيت مش بيحترم المرأة بأى حال من الاحوال.. يعنى هو اتربى فى بيت مفهوم المرأة به هو أداه جنسية فقط لمتعة الرجل مش كإنسانة ليها كرامة.<br />5_ إهمال مادة الدين فى المدارس أكيد داخل من ضمن الاسباب.<br />6_ المشاكل المادية اللى بتخلى كل شاب عارف وواثق انه مش سهل انه يتجوز."
