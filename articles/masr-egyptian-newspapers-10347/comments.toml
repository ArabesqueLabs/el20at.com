[[comments]]
order = 1
subject = "اسرائليه"
author = "عوضين"
posted = "2008-10-30"
text = "فجرت نجلاء الإمام، المحامية بالنقض، مفاجأة في قضية التحرش الجنسي، التي كانت تتولي فيها الدفاع عن المدعية نهي رشدي، عندما أعلنت أنها قررت استئناف الحكم لصالح المتهم.<br />كانت المدعية - وهي مخرجة أفلام تسجيلية - قد اتهمت الشاب شريف رجب جبريل، بالتحرش بها في يونيو الماضي، حيث ألقي القبض عليه وأحيل للنيابة، وعاقبته محكمة الجنايات بالسجن &--1635; سنوات .<br />وقالت نجلاء لـ «المصري اليوم»، إنها توصلت لمعلومات عن المدعية، جعلتها تقرر التخلي عنها بعد &--1635; أيام من صدور الحكم، هي أن «نهي» من عرب &--1636;&--1640; ومولودة في يافا شمالي تل أبيب وتحمل جواز سفر إسرائيلياً،<br />كما سبق أن اتهمت ضابطاً فرنسياً بالتحرش بها أثناء وجودها في فرنسا قبل عام ونصف، وحصلت منه علي تعويض. وأوضحت المحامية تفاصيل معرفتها بهذه المعلومات،<br />وقالت إنها كانت معها في مقابلة تليفزيونية علي قناة M.b.c وأن المذيع قال لنهي: «حالات التحرش دي مابتحصلش حتي في إسرائيل»، فردت عليه الفتاة: «إسرائيل دي دولة محترمة»،<br />وأنها - أي نجلاء - بحثت عن معلومات وأوراق خاصة بالفتاة، وعرفت أنها ولدت في يافا، وأضافت أنها منذ ذلك الوقت قررت استئناف الحكم لصالح المتهم والدفاع عنه"
archived = "2010-03-14"
