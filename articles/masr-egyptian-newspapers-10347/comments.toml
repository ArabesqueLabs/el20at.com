subject = "لكن دمائها و اصولها عربية مسلمة فلسطينية؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-30"
text = "و اية يعنى اما تكون جنستها اسرائلية؟<br />المهم انها احتفظت بعروبتها الفلسطينية و دمائها العربية و ديانتها الاسلامية؟!!!<br />انها من الاصول الفلسطينية الاصيلية التى رفضت التخلى عن القلة القليلة المتبقية من الاراضى الفلسطينية؟<br />نهى تحياتى لك و احترامى رغم انك تحملى الاوراق الاسرائيلية! لكنك فى قلبك ووجدانك و دمائك الاصول الفلسطينية العربية الحرة<br />اللة معك و يعطيك العافية!!!"
