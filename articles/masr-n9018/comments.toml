subject = "فنان وانسان رائعين"
author = "ايمان عوض"
posted = "2008-01-17"
text = "احياناً يعز اللسان عن تقديم كلمة تقدير او شكر او حتي اعجاب ولكن الفنان الانسان خالد صالح اعجز العجز عن البوح ودفع السبابة والابهاب لبس فقط للكتابة لأ حتى بالكلام لينتلقا قائلين اين كنت ايها الفنان فأن كنز ادخر فنه لهذا الزمان عندما تعزر وجو تلقائية وعفوية تأخذنا بالعقل وتطلق العنان لننتله ونفيق من حلم بقظة في اخر العمل وتتيقن انه فيلم وليس مشهد يومي في حياة مجرد مواطن مصري مجرد صدق انسان. لك كل التقدير والاحترام والى الامام مع المحافظة على ما تبؤته من مكانة تستحقها بجدارة."
