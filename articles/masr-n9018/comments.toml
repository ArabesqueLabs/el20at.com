author = "أميرة عامر"
posted = "2008-10-12"
text = "مش عارفة اسميك ايه سلطان والا برنس والا الريس والا القاضى احترت فعلا لانك قادر انك توصللى كل مرة باشوفك فيها انك شخصية غير اللى قبلها وغير خالد صالح نفسه انسان يقدر يعمل كل الادوار وانا باقول انسان ومش ممثل لان الانسان هو اللى تقدر تحدد انه على طبيعته اما الممثل بتبقى عارف انه بيمثل مع احترامى لكل الفنانين طبعا ، وحقيقى انت بالنسبة ليا مثال لكل حاجة اتمناها ( الحلم ، الاب ، الزوح ، الابن ، الخيال ، والصدق ، والحنان ، والحزم ) وحقيقى بجد انت بطل احلامى وديما بتجسد دور الخير والمنقذ ليا فيها ، بجد انا بدعى ليك بالتوفيق ديما والنجاح ، وخليك فى طريقك كلنا وراك ،لكن ليا ملحوظة صغيرة ياريت ما تزعلش منى فيها ، فى فيلم الريس عمر حرب كنت فعلا متميز لكن فيه بعض الكلمات اللى تفوهت بيها مش عارفه جالك قلب تقولها ازاى ؟ انا متأكده ان وجهة نظرى وصلت ليك وفهمت قصدى وهتفضل ديما فى نظرى مثال الرجل اللى بحلم بيه ومثلى الاعلى دائما وبجد انا بحبك جدا ، ربنا يوفقك ديما معلش طولت عليك لكن ده من عشمى وكفاية كده لحسن ( هنتنفخ يا باشا ) هههههههههههههههههههههههههههههههههه مع حبى ودعائى لك دائما ."
