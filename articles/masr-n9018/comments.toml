[[comments]]
order = 0
subject = "الله عليك ياسلطان الغرام"
author = "سها"
text = "اللللللللللللللللللللللللللللللللللله<br />عليك بجد ياسلطان بجد سلطان في كل حاجه انت شخص جميل جدا وفنان متكامل جدا<br />تمثيلك يجنن ومش يبان تمثيل خالص بالذات في تيتو وسلطان الغرام حقيقي اوي شخصية سلطان بحس فيها من خالد صالح كتييييييييير وبجد تجنن ربنا يوفقك ويارب دايما في نجاح مستمر بجد خالد صالح احسن فنان دلوقتي عندي بعد احمد زكي ربنا يوفقك ونشوف حاجات حلوه كده زي سلطان الغرام المسلسل ده بعشقو اوووووووي<br />مع حبي<br />سها"
archived = "2007-10-21"
capture_url = "https://web.archive.org/web/20071021012305/http://masr.20at.com:80/newArticle.php?sid=9018"

[[comments]]
order = 1
subject = "انا جيت تاني"
author = "سها"
text = "نسيت اعلق عن حاجه مهمه جدا<br />السلطان قال ان تامر مطربو المفضل انا بحييييييييييييييييييييييييييييييييييييييييييييك من كل قلبي<br />تامر حسني ده مبدع وبجد زوقك عاااااالي اوي لان متهيالي ان تامر مش اي حد يسمعو وخلاص ده لازم يكون عندو حس فني وزوق عالي<br />وكمان اختيارك لاحمد زكي ده حاجه جنان احمد زكي ده فنان جميل اوي وبحس ان خالد صالح في كتير منو في تمثيلو يعني البساطه في التمثيل ويبان مش تمثيل يبان حقيقه ونصدق الشخصيه اوي وده بجد الفنان<br />بحباااااااااااااااااااك ياسلطان"
archived = "2007-10-21"
capture_url = "https://web.archive.org/web/20071021012305/http://masr.20at.com:80/newArticle.php?sid=9018"

[[comments]]
order = 2
subject = "اللللللللللللللله عليك يا اجمل ناس خالد صالح"
author = "عذراء من المغرب"
text = "اللللللللللللللللللللللللللله والله معرفتش باش راح نبتدي انا قريت عن حضرتك مكنتش بصراحة اعرفك بس مسلسل سلطان الغرام خلاني اموت بشخصيتك الى جانب بدرية . اتمني بجد من الله العلي القديييييير ان يشفيك ويعطيك الصحة والعافية من عندو يا رب ولا يحرمناش من قلبك الجمييييييل بجد انا كتييييييييير معجبة بيك وبموووت فيك خصوصا انك تمتاز بدوق رفيع دا انت حتى بتحب تامر يبقا نقول ايه والله انت انسان عظيم الله يخليك لمراتك واولادك ولا يحرمش مصر منك حبقا اجب مصر واسال عنك ان شاء الله وعن الناس الحلوة بتاع مصر.<br />تحياتي لزوجي حبيبي اعظم انسان بالدنيا مروان ابو الاسعاد"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121032346/http://masr.20at.com:80/newArticle.php?sid=9018"

[[comments]]
order = 3
subject = "فنان يا خالد"
author = "محمود الشيمى"
text = "يا خالد يا فنان انا محمود فتحى الشيمى من شبرامنت سلملى على خالى الحاج انسان كتير انا عارف انك مش عارفنى بس هو عارفنى انت فنان كبير بس فيك عيب كبير كمان عارف هو ايه؟ انك اهلاوى يا عم خالد معلش بقا انا زملكاوى بس بنحبك برضو بالتوفيق يا فنان"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224115059/http://masr.20at.com:80/newArticle.php?sid=9018"

[[comments]]
order = 4
subject = "تشويق بسرعة الصاروخ"
author = "لبنى"
text = "استاذ خالد فنان مش طبيعي قنبلو موقوتة دمار شامل<br />تتجوزني؟<br />تحكي هه"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224115059/http://masr.20at.com:80/newArticle.php?sid=9018"
