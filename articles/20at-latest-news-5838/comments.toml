subject = "لية كدة"
author = "كتكت"
posted = "2007-05-13"
text = "يا اخى حرام عليك طيب حط صورة حلوة بدل الوش العكر دة شكله وحش اوى زى الزفت يا لب ريحنا من شكله وبعد كدة هو خايف على نفسة مش على السياحة عامل زى فرعون فاكر انة مش هيموت وبعد كدة هو اللى خسران مش السعودية ولا اة صح هو ملهوش علاقة بلا سلام ولا السعودية يارب كفاية بقى يتريحنا احنا يا هو علشان نخلص من الا شكال دى"
