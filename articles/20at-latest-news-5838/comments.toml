subject = "الجبان العميل"
author = "alexomania"
posted = "2007-05-14"
text = "مفيش اكتر من كده خيانة او عمالة الموضوع مش موضوع هدوء ولا سمة شرم طب ما فيه عندك اكتر من 90 كم سواحل قريبة جدا من الطرفين ..... الموضوع إنه خايف ليزعل أسياده<br />الواطي عارف إن الجسر خطر علي وجود إسرائيل و سلامتها في المنطقة و حسبنا الله و نعم الوكيل"
