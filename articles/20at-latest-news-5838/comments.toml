[[comments]]
order = 2
subject = "مش ممكن رئيس مصر دا ولا رئيس الموساد"
posted = "2007-05-14"
text = "الراجل ده كل يوم بيثبت لى انه عمره ما هيفكر فى مصر ابدا حتى وهو بيموت انا متوقع انه هيقولهم هيه مسكتوا جمال الحكم<br />مش ممكن فعلا كل ما يظهر مشروع مفيد للناس و للبلد يقتله خايف على هدوء السياح دا الظاهر هو خايف على نفسه لانه الحركة كده هتكتر فى شرم الشيخ وبكده الزعيم مش هيستريح<br />انا اعتقد انه لو كان على ايام قناة السويس ولا السد العالى ما كنش سمح بإنشائهم<br />شوفوا الهايف بن الكلب ما بيبصش للبعد الاستراتيجى للمشروع وكل همه حياة السياح وحياته"
archived = "2010-03-14"
