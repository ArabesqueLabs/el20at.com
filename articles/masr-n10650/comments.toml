[[comments]]
order = 1
subject = "التضرع إلى الله هو الحل"
text = "السلام عليكم ورحمة الله وبركاته :<br />بسم الله الرحمن الرحيم والحمد لله رب العالمين... نحمدك ربي ونستهديك ونستغفرك .. من يهده الله فلا مضل له ومن يضلل فلا هادي له والصلاة والسلام على أشرف المرسلين وعلى آله وصحبه وسلم.<br />الحق أنه في ظل هذه الأحداث و المحنة التي تمر بها الأمة نحتاج أن نتكلم.. أن الأمة في محنة وكذلك النفوس... نحتاج إلى دواء... إلى هدهدة... نحتاج إلى من يرتب على ظهورنا... نحتاج أن يكون لنا دور تجاه المحيطين بنا في كل مكان.<br />تغيير النفوس إلى الأفضل هو الطريق الوحيد لتنفيذ قانون الله هذا هو أملنا الوحيد... لا ترضوا باليأس ولا تستسلموا للإحباط ولا تنفضوا أيديكم من العمل لأنه لم يعد هناك أمل.<br />لا يمكن التعامل مع الحياة بمنأى من القوانين الربانية... مثال بسيط.. قانون الجاذبية قانون رباني... حين فكر الناس في الطيران وصعدوا إلى الجبال وقفزوا تكسروا وتحطموا لأنهم لم يتعاملوا مع القانون بقواعده ولكن حين صنعوا الطائرات طاروا. والحياة الإجتماعية أيضاً لها قوانين... دعونا لا نقفز لنطير... دعونا لا نقف ننظر حولنا ونتساءل أين المعجزات؟ أين النهدي؟ أين معونة الله؟ بل تعالوا نصنع الطائرة... تعالوا نتعامل مع القوانين... والقانون الذي نحتاج إليه هذه الأيام هو قانون الله المتمثل في هذه الآية:<br />{إن الله لا يغير ما بقوم ختى يغيروا ما بأنفسهم}<br />التعامل مع القانون سيكون خطوة بخطوة... كل يوم جزء... وصدقوني لن يمر وقت طويل إلا وتعود لهذه الأمة عزتها وكرامتها وتعتلي عرش الزمان...<br />لقد ذكر هذا القانون في القرآن الكريم مرتين:<br />مرة في سورة الرعد:الآية 11<br />{إن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم} واستعمال قانون الله فيها بتغيير النفس كان للخروج من مصيبة أصابتها...<br />ومرة في سورة الأنفال:الآية 53<br />{ذلك بأن الله لم يكن مغيراً نعمة أنعمها على قوم حتى يغيروا ما بأنفسهم}<br />واستعمال القانون هنا كان لاستبقاء النعمة التي منحنا المنعم إياها..<br />إن هذا ليس شعار ولكنه حقيقة، وتعالوا معي نجرب.. كل يوم حركة.. واليوم نبدأ بعبادة مهمة جداً... التضرع إلى الله.. والتضرع مبالغة في الشعور بالفقر والحاجة لله.<br />اليوم هذا واجب وقت... التضرع غير الدعاء - التضرع غير الخشوع...<br />التضرع أن تلجأ لباب الله تستغيث... تصرخ بقلبك وروحك وكيانك تبكي ذليلاً بين يدي القادر المقتدر... تمد يديك بحاجتك لأبعد ما تستطيع وتتغلف بدموع الفقر واللجوء... تنادي كل ذرة في جسدك وكل زفرة في روحك بالنجاة ممن يملك طوق النجاة...<br />التضرع هو عبادة المصائب والكوارث... لو نظر الله إلينا الليلة في القيام وكانت الأيدي كلها مرفوعة تتضرع... هناك أمل... ولكن يجب أن نتعلمها أولاً.. نشعر بمعناها.. عبادة التائه الحيران... نتعلم كيف نتذلل على بابه ونقول يا رب... نقولها كما يقولها من تكسرت مركبته في عرض البحر ولم يبق بين يديه إلا لوح خشبي يذوب من ملح البحر ويوشك أن يتحلل... أسمعتم صوته كيف يصرخ بين الأمواج وعينيه إلى السماء وقلبه ينخلع مع قولته في كل مرة يا رب... هذا هو التضرع<br />وانظروا متى ذكر الله التضرع في القرآن:<br />الآيات:<br />*{ولقد أرسلنا إلى أمم من قبلك فأخذناهم بالبأساء والضراء لعلهم يتضرعون فلولا إذ جاءهم بأسنا تضرعوا ولكن قست قلوبهم وزين لهم الشيطان ما كانوا يعملون} يعملون حين يؤخذوا بالمصائب يجب أن يتضرعوا... وإن لم يفعلوه فمتى إذن.<br />*{قل من ينجيكم من ظلمات البر والبحر تدعونه تضرعاً وخفية لأن أنجانا من هذه لنكونن من الشاكرين قل الله ينجيكم منها ومن كل كرب ثم أنتم تشركون } كلام الله الجميل ... ننجو مما نتضرع منه ومن كل كرب... ولن نكون كأهل هذه الآية حين أنقذهم رب العباد أشركوا... وسنظل على إيماننا بالله بإذن الله تعالى<br />*{وما أرسلنا في قرية من نبي إلا أخذنا أهلها بالبأساء والضراء لعلهم يتضرعون أفأمن أهل القرى أن يأتيهم بأسنا بياتاً وهم نائمون أو أمن أهل القرى أن يأتيهم بأسنا ضحى وهم يلعبون} هنا عقوبة من لا يريد أ، يقف متضرعاً على باب الله... إن أخذ الله ليس سهلاً ولا ينقذنا منه إلا ما أنقذ من كان قبلنا التضرع..إنه القانون الشرط وجوابه.<br />*{ولو رحمناهم وكشفنا ما بهم من من ضر للجوا في طغيانهم يعمهون ولقد أخذناهم بالعذاب فما استكانوا لربهم وما يتضرعون} الجميع ينتظر معجزة... ينتظر السعادة والراحة...<br />يجب علينا العودة للتضرع... إن الله قد يرسل إلينا المصائب لنعود نتضرع إليه ولو لم نفعل لأصبحت البلوى أقسى وأشد... أحياناً ننسى العبادة فيدعونا الله إليها... حذار أن تصيبك مصيبة ولا تتضرع... لا تيأس ولا تنهار... هناك دائماً أمل في الله ... أمل فيمن يملك هذا الكون ما عليه ومن عليه... بيده الأسباب يغيرها بالكاف والنون..<br />التضرع عبادة الأنبياء...أتذكرون سيدنا يونس في بطن الحوت... سيدنا يونس محبوس في ظلمات ثلاث... ظلمة الليل وظلمة البحر وظلمة بطن الحوت... فلم يستسلم ونادى متضرعاً من أعماق روحه لا إله إلا الله سبحانك إني كنت من الظالمين...فبماذا إجابة الرحيم الكريم استجاب له وأنجاه من الغم وكذلك ننجي المؤمنين..<br />رسول الله صلى الله عليه وسلم يوم بدر ينظر إلى جيش المشركين...عددهم كبير ومعهم سلاح وينظر إلى جيش المسلمين عددهم أقل وسلاحهم أقل فماذا يفعل؟؟ رفع كلتا يديه وبدأ يدعو حتى سقط رداءه وظهر بياض إبطيه... حتى قال له الصديق: هون عليك فالله منجزك وعده...<br />التضرع إلى الله هو سبيل الأنبياء في كل وقت وحين... في حديث شريف رواه الترمذي: \"يقول عليه الصلاة والسلام أن الله سبحانه وتعالى عرض علي بطحاء مكة ذهباً فقلت لا يا رب أشبع يوماً وأجوع يوماً، فاذا جعت تضرعت إليك وإذا شبعت شكرتك وحمدت\"<br />وفي حديث أخر:\"جاء أعربي إلى النبي صلى الله عليه وسلم وقال علمني صلاة الليل فقال صلى الله عليه وسلم ك قال تصليها مثنى مثنى وتتشهد في كل ركعتين وتدعو وتتمسكن إلى ربك وتتذلل إلى ربك وتتضرع إلى ربك وترفع يديك تجعل باطن يدك إلى وجهك تقول له يا رب يا رب يا رب\"إن الله يحب أن يسمع أصوات عباده متضرعة ... ولذلك هناك حالات كونية وزمنية نتضرع فيها... كسوف الشمس.. توقف المطر...يوم عرفة.<br />تعالوا نعتبر أسبوعنا هذا كله عرفة... تضرعوا... تضرعوا جميعاً..."
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201627/http://masr.20at.com:80/newArticle.php?sid=10650"

[[comments]]
order = 2
subject = "الفرج قريب"
author = "طال الليل"
text = "السلام عليكم أيها الشرفاء<br />لابد من النظر فى التاريخ القريب والبعيد قبل أن نترك لليلأس مدخلا إلى النفوس النظام يتهاوى وما صنعه دليل على ترنحه 17مرشحا للجماعة المطاردة بكل أنواع الزور والبهتان أطارت النوم من العيون المتورمة برمد الخوف والهلع الغير مبرر<br />كل هم النظام الأن أن يواصل التزلف لقمته المتداعية تحت وطأة الشيخوخة ولكن السوس لا زال ينخر وسيظل حتى النهاية المحتومة لكل مستبد"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201627/http://masr.20at.com:80/newArticle.php?sid=10650"

[[comments]]
order = 3
subject = "الصبر علي الذل ليس صبرا انما خنوع وضعف"
author = "عبده نصحي"
text = "لم يخلو زمن من الازمان ولا مكان علي وجه الارض من وجود حق ومن وجود باطل من وجود فئه تنتصر للحق ومن فئه تريد نشر الباطل ولكن العجيب هي تلك الفئه التي تقف وتشاهد هذا الصراع من دون عمل اي شئ ولا حتي انكاره بقلبها وقد ورد في القران الكريم قصص للعبره والاتعاظ تصف لنا هذا الصراع الابدي الذي اقتضاه خالق هذا الكون صراع الحق والباطل ومن ضمن هذه القصص قصه تلك القريه التي نهاهم الله عن صيد يوم السبت وتحايلو علي حكم الله بشكل او باخر الشاهد والعبره من هذه الواقعه ان القريه انقسمت الي ثلاثه فرق فريق يعظ وينهي عن الفساد ويامر بالعدل والاحسان وفريق الفاسدين وفريق ثالث( وَإِذْ قَالَتْ أُمَّةٌ مِنْهُمْ لِمَ تَعِظُونَ قَوْمًا اللَّهُ مُهْلِكُهُمْ أَوْ مُعَذِّبُهُمْ عَذَابًا شَدِيدً) فرد اهل الحق الناهين عن الفساد ولو بالكلمه وقالوا (َمَعْذِرَةً إِلَى رَبِّكُمْ وَلَعَلَّهُمْ يَتَّقُون) نعتذر لله الاله الذي نؤمن به ونقول يارب نعتذر لك عن ظلم وفساد وضياع هؤلاء فما كانت النتيجه كانت ( فَلَمَّا نَسُوا مَا ذُكِّرُوا بِهِ أَنْجَيْنَا الَّذِينَ يَنْهَوْنَ عَنْ السُّوءِ وَأَخَذْنَا الَّذِينَ ظَلَمُوا بِعَذَابٍ بَئِيسٍ بِمَا كَانُوا يَفْسُقُونَ * فَلَمَّا عَتَوْا عَنْ مَا نُهُوا عَنْهُ قُلْنَا لَهُمْ كُونُوا قِرَدَةً خَاسِئِينَ ) اخذ الله -الظالمين الفاسدين المرتشين السارقين الخائنين لامانه اوطانهم - اخذهم بعذاب اليم بما كانوا يفسقون ونجي الذين انكروا الفساد والظلم نجاهم في الدنيا والاخره ولو كان انكارهم للفساد بالكلمه اما عن الفريق الثالث الخانعين الضعفاء المنتفعين من الفساد الذين قالوا لما تعظون قوما فاسدين اساسا وهالكين لا محاله فلم يذكر لنا القران الكريم مصيرهم تعرفون لماذا تحقيرا لهم وازدراء لتخاذلهم وضعفهم فهم بتخاذلهم اقل من اهل الباطل والفساد انفسهم , ان الصبر علي الذل والمهانه والفساد ليس من الصبر في شئ انما ضعف وذل وما يحدث في مصر انما ذل ومهانه ل 75 مليون فرد ارتضوا لهذا الواطي ان يعلوا عليهم ويكون رئيسا لهم والقران ذكر ذلك ايضا عن فرعون \" فاستخف قومه فاطاعوه \" ولم يكفيه فسادا وضغيانا بل صار متبجحا بفساده وطغيانه وفي هذا امعانا لذل هؤلاء واقول بالرغم من اني مصري وفخور بكوني مصري الا اني لست ارضي بالذل والضعف واقول ربنا يخرب بيت اهلك يا مبارم وكل من اعانك علي الفساد ربنا ينفخ فخادك ويسلخها يا قادر يا كريم يا رب كشفت شعري ودعيت عليك يا مبارم يا بن امونه ايا كان اسم امك عارف هتقول ايه اللي غير جو الكتابه كنت بكتب فصحي وبعدين قلبت عامي اصلي بجد افتكرت شكل امه العكر وهو بيضحك ضحتكه البيضان ومنظر الغلابه والمطحونين بن ..... دا وكمان عايز يورث ابنه كمان زمن الخديويه انتهي يا مبارم يا بن امونه انا بجد انفعلت جدا وانا بكتب وعايز اشتمه بامه عارف انه امه ملهاش زنب بس في راي زنبها انها خلفت الشخصيه الزباله الواطيه دي روح يا مبارم يجيلك بواسير من ام الكرسي اللي لزق في ط..ك بقالك 25 سنه قاعد عليه لما عفنت"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201627/http://masr.20at.com:80/newArticle.php?sid=10650"

[[comments]]
order = 4
subject = "الى الاخ اللي فوق"
author = "ابومحسن"
text = "يا اخي الكريم الصراع بين الاخوان المسلمين والحكومة ليس صراع حق وباطل<br />بالصراع بين الحق والباطل صراع بين مقري الشهادتين وجاحدي الشهادتين وصدق رسول الله صلى الله عليه وسلم امرت ان اقاتل الناس حتى يقولوا لا اله الا الله<br />اما الاخوان والحكومة والجهات الامنية كلهم مسلمين سنه يعني طايفة واحدة والموضوع صراع سياسي على كراسي البرلمانات وحدث في التاريخ الاسلامي الطويل صراع سياسي مرات عديدة اولها بين معاوية وعلي وبين يزيد ابن معاوية والحسين ابن علي وبسبب هذا الصراع السياسي لم يكفر احد من الطرفين<br />(لطفا يرجى الاطلاع على عقيدة اهل السنه والجماعة)<br />واريد ان اضرب مثل بصدام حسين كان راجل جبار وفرعون ووديكتانوري و و و<br />وفوجئنا بأنه يترنج على حبل المشنقه لانه راجل سني"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201627/http://masr.20at.com:80/newArticle.php?sid=10650"

