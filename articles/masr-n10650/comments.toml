subject = "فضيحة على الهوا"
author = "ابو اسامة"
text = "اتفضحنا .اتفضحنا .اتفضحنا آل يعنى الانتخبات الى قبل كدة كانت مظبوطة على الشعرة ماهى طول عمرها كدة<br />هو انتوا كنتم ما تعرفوش ولا ايه ولا مبتصدقوش الا بعنيكوا ولا جايز علشان محدش كان بينتخب اصلا وكانوا بيقفلوها من بره<br />بره هو ده بقى شعار الحزب الوثنى الجديد (فساد+تزوير يجيب فلوس كتير) وخليكوا نايمين"
