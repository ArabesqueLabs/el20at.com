author = "كتكوت الحمير"
text = "عاوزين رئيس العصابة ولاحد من الحرامية اوالامين العام للحرامية اوالامين العام المساعد لسياسات السرقة والتكويش بتاع العبور الى المستقبل يوضح للعالم بلاش الراى العام المصرى لانة عايش وعارف انة اللى جرى فى اللجنة بتاعت قناة الجزيرة بيحصل فى غالبية اللجان وانة ا لاغلبية المزعومة جت عن طريق التزوير ودا على فكرة بقى معروف ومكشوف يس نقول اية اللى اختشوا ماتو"
