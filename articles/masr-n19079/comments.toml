[[comments]]
order = 1
subject = "ارسل افندينا وزير الخارجية الى الباب العالى فى استنبول للاستنجاد بة"
author = "لاظوغلى"
text = "مولانا ولى النعم ارسل عريضة استرحام الى الخليفة الصدر فى استنبول عاصمة الخلافة فى الباب العالى وقد وعد اوغلى باشا رئيس وزراء تركيا بحل المشكلة<br />فلماذا تتظاهروا ؟<br />المملوك راح سلم الرسالة<br />وفى انتظار مبعوث الباب العالى فى قصر عابدين لحل المشكلة<br />هذا ويقيم مشايخ الطرق الصوفية حفلة استقبال لمندوب الباب العالى وستنحر الذبائح وستقطع بضعة رؤوس من الاغوات والاخوان المفسدين امام القصر احتفالا بقدومة<br />بلاش مظاهرات - اوجلان جاى من الباب العالى"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054012/http://masr.20at.com:80/newArticle.php?sid=19079"

