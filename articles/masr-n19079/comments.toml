[[comments]]
order = 5
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
text = "كنت اتمنى ان يتم القبض ليس على 600 فقط بل على كل من شارك فى التظاهر متعاطف مع حركة حماس المتأسلمة التى اطلقت النار وقتلت ضابطا من ضابطنا كان يقف ليحمى حدود مصر من مؤامرة احتلال سيناء من قبل الفلسطنيين تلك المؤامرة التى تتم برعاية ومباركة كل من ايران فى الخارج والاخوان المتأسلمين فى الداخل !! الاخوان المتأسلمين يحلمون ان فرعهم فى غزة والمسمى بحماس يحتل رفح والعريش وباقى سيناء لان الاخوان المتأسلمين لا يهمهم الاوطان بل يهمهم الاديان على حسب قولهمالكاذب !! كل من يخرج فى تظاهرة مؤيد لتلك الحركة المتأسلمة ( حماس ) هو خائن وعميل لمصر لان حماس هى من اشعلت الحرب اذن عليها ان تحارب لاخر حمساوى متأسلم لا لاخر جندى مصرى !! مصر التى امدت يدها للجميع اليوم تهان ويحرق علمها على ايدى الخونة من حماس والعملاء من الاخوان المتأسلمين !! اقول للاخوان المتأسلمين ان مصر وشعب مصر لن يرحمكم وسوف ياتى يوم الحساب لان شعب مصر لا يقبل الخونة والعملاء وهل هناك خيانة وعمالة اكثر من تصريح مرشدكم الداعم لايران والذى طالب فيه بالسماح بنشر المذهب الشيعى فى مصر !! اى خيانة واى عمالة اكثر من ذلك يامرشد الاخوان المتأسلمين ."
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054012/http://masr.20at.com:80/newArticle.php?sid=19079"

[[comments]]
order = 6
subject = "قريبا الحكومة تمنع الهواء عن الناس وحاليا الحكومة بتمنع الشعب عن التعبير عن نفسة فى حاجة مالهاش دعوة بقلب نظام الحكم الفرعونى"
author = "الدوكش"
text = "شعب مصر شعب طول عمرة حى ومش حيموت المظاهرات والاستنكار لوحدهم مش حينفعوا مع اليهود ولاد الكلب لو حكومة النصب والتزوير تحترم عقول الناس شوى وبلاش استهبال ومنظرة علشان تراضى امريكا واسرائيل تحبس 600 مواطن شريف عبر عن اللى جواة وبيتهيئلى ان حكومة النصب مستنية المكافاة 600 ضربة على القفا من جزمة بوش القديمة"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054012/http://masr.20at.com:80/newArticle.php?sid=19079"
