text = "الله يرحمك يا سادات ويرحم ايام ما مديت ايدك للفلسطينيين دول علشان خاطر تحللهم المشكلة عضوها وراحوا عملوا جبهة الرفض<br />انما هي فين جبهة الرفض كانت سوريا والعراق والاردن واليمن وفلسطين<br />راحوا فين"
