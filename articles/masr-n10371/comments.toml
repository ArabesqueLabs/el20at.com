[[comments]]
order = 6
subject = "تعقيب"
author = "BATISTUTA"
posted = "2007-05-25"
text = "والله ما كنت لا ادافع عن اى احد فانا لست من مريديهم واتباعهم انا اسمع للكل ولا اقصر نفسى على شخص واحد ارفعه فى مصاف الملائكة ولا اقبل ان يكون مخطئ ولو اخطئ ابو اسحاق او حسين يعقوب او اى شخص اخر فلن اسمع لهم .<br />وفى النقطة الاخرى يبدو انك لم تفهم وجهة نظرى انا لم اتحدث عن عدم الظهور فى هذه القنوات ولكنه الافراط فى الظهور فى جميع القنوات معا فكان يكفى اقرأ او الرسالة مثلا واعتقد ان الكل يستطيع سماعه من خلال اقرأ او اى قناة اخرى فتلك القنوات ليست مشفرة ."
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528050247/http://masr.20at.com:80/newArticle.php?sid=10371"

[[comments]]
order = 7
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-05-25"
text = "أود فقط أن أعلق على نقطة الانا التى زعموا أنها في عمرو خالد ...أعتقد ان المقال كان يدور حول رحلة عمرو خالد إلى أمريكا التى كان يكرم هو فيها فمن الطبيعي أنه عندما يسرد ما حدث في رحلة لم يقم غيره من بلادنا بها أن يتكلم بصيغة الأنا ....و لا عايزينه يقول احنا قولنا و احنا عملنا ....<br />و الكلمة الأخيرة لكل من يهاجم عمرو خالد ....حاولوا أن تفعلوا نصف ما فعله ثم تكلموا عن الرجل و انتقدوه<br />أعتقد أنه لو حاول احدكم أن يقدم للإسلام مثل ما قدم أو حتى أكثر (و أظنه من الصعب جدا) لما شغل باله بعيوب الآخرين و لما نسي أن للناس أعين تنظر له كما ينظر هو لهم............<br />و هكذا دائما ....النخلة العالية دائما تلقى بالحجارة"
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528050247/http://masr.20at.com:80/newArticle.php?sid=10371"

[[comments]]
order = 8
subject = "مقال بائس"
author = "محمد"
posted = "2007-05-26"
text = "يحاول مصطفى عاشور جاهدا أن يثبت نرجسية حسام لحديثه عن أسباب عودته لموضوع كتب عنه كثيرا ، ويدلس بوضوح قائلا (هذا الحضور الطاغي في تلك الكلمات في عدد أسطر لا يتجاوز التسعة، فما بالك لو قرأت بقية المقال)، سيغيب صوت حسام الذاتي في بقية المقال، لانه تواجد فقط في المقدمة. نوع من التصيد الرخيص.<br />ثم إن مصطفى يتجاهل المتن ويتمسك بالحواشي، فأطروحة حسام الأساسية كانت عن رؤية عمرو لذاته ورؤيته للعالم وللإسلام، بينما ركز هجوم مصطفى على نانسي عجرم والنادل الأسود.<br />ويواصل مصطفى التجاهل بشخصنة الموضوع والانتقال إلى الهجوم على حسام، وهو أمر ليس بالضرورة مفيدا في الرد على مقال يطرح رأيا، لكنه مقبول في كتابة مقال ناري يستعرض فيه الكاتب عضلاته.<br />الجريدة التي يصفها مصطفى بالخمارة هي جريدة القاهرة، جريدة وزارة الثقافة المصرية. لا تشتهر الجريدة - على حد علمي- بمهاجمة الدين الإسلامي، يكتب فيها مثقفون من اتجاهات مختلفة ومنهم الإسلامي، وإن تابعت مقالات حسام بها فسترى مقالات يمكن تصنيفها كإسلامية بها.<br />وحسام لم يكتب فقط مقالا عن تحولات الإخوان ، بل - حدث معلوماتك!- كتاب كامل من اصدارات مكتبة مدبولي. لا يمكن تلخيص أطروحة وبنيان نظري متكامل يقدمهما حسام في كتابه النقدي في تعليق صغير، لكن التدليس من جديد - ولن أستخدم صفة أخرى- هو المبرر الوحيد لحصر هذا الجهد في عنوان مقال واحد يثير - سلامتك- اشمئزازك. نصيحتي هي أن يقرأ القارئ المهتم هذه المقالات ويحكم بنفسه بعيدا عن تصيدات الاسلاميين الحزبيين."
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528050247/http://masr.20at.com:80/newArticle.php?sid=10371"

[[comments]]
order = 9
subject = "العداء مع منهج عمرو خالد"
author = "محمد سالم"
posted = "2007-05-26"
text = "الاستاذ عمرو خالد يخطيء ويصيب لانه بشر ولا احد يدعي ان لكلامه قدسيه او اننا يجب ان ناخذ ما يقول به كمسلمات<br />وانا شخصيا انتقدت عمرو خالد علي هذه صفحات هذا الموقع اثناء قضيه الرسوم المسيئه وسفره للدانمارك... وكان رايي مخالفا لما فعله وقتها... ولكني ابدا لم اشك في صدق نواياه واخلاصه لما يؤمن به من افكار<br />*** الا يمكن ان نختلف مع عمرو خالد او مع غيره دون ان نشكك في اخلاصه ونقدح في شخصه او نتهمه بتهم بشعه مثل العماله او تحريف السنه النبويه او مثل هذه التهم الخطيره<br />*** الن نتعلم ابدا ثقافة الاختلاف والقبول بالاخر واحترام راي الاخرين حتي لو كان مخالفا لما اراه........اليس فقهاء الاسلام هم من قالوا رايي صواب يحتمل الخطا ورايي غيري خطا يحتمل الصواب<br />**** عمرو خالد شخص يجتهد في خدمه دينه وامته********* فان رايتموه اخطا من وجهة نظركم فوجهوا له النصح بالحسني والموعظة الحسنه ------ لكن كفاكم تحطيما لكل النماذج المشرقه في هذه الامه<br />**** الشيء الغريب والمريب في الموضوع ان اغلب منتقدي عمرو خالد هم اما الكتاب المرتبطين بالسلطه او الذين يدورون في فلكها .. او التيارات الاصولييه السلفييه ..... وهما طرفان غالبا لايلتقيان ابدا علي هدف واحد وبينهما من الصراعات والاختلافات مثلما بين الذئب والشاه فكلاهما متربص بالاخر ..... ويبدو انه من بركات عمرو خالد ان الذئب والشاه قد وجدوا اخيرا هدفا يجمعهم ....بركاتك يا شيخ عمرو !!!"
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528050247/http://masr.20at.com:80/newArticle.php?sid=10371"

[[comments]]
order = 10
subject = "نقد اى شخص طالما بادب ليس عيب او حرام"
author = "BATISTUTA"
posted = "2007-05-27"
text = "انا لست من التيار السلفى حتى اننى لست ملتحى وايضا لست من احباء الحكومة ولكنى شاب مسلم وكفى<br />يعنى مش كل منتقدى عمرو خالد اما سلفى موتور او حكومى مغرض لكن فى ناس عادية بسيطة ملهاش علاقة بالجماعات والتكتلات الحزبية يعنى ملهاش غرض غير ان هى تسمع لاشخاص وتثق فيهم وليس اشخاص كثر حولهم الجدل .<br />الناس عموما لها ظاهر الكلام وان قلتم لايقصد فتلك مصيبة وان كان يقصد فالمصيبة اكبر نحن لا علاقة لنا هنا باخلاص الرجل من عدمه ولكن لنا علاقه بكلامه الظاهر امامنا .<br />ولكنى اخبرونى لماذا هذا الاحتفاء المبالغ فيه من كل وسائل الاعلام الغربية والعربية والمصرية سواء المقروءة او المرئية؟<br />وهل يثاب الفرد على الدعوة الى الله من جوائز ومديح وخلافه؟ لا نقول نحن الا جزاك الله خيرا والثواب من عند الله .<br />نقطة اخيرة لقد قدم الكثيرين النصح لعمرو سواء علنا او( سرا على ما اعتقد ) ولكن يبدو ان عمرو خالد لا يسمع لهم ."
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528050247/http://masr.20at.com:80/newArticle.php?sid=10371"

