text = "انا لست من التيار السلفى حتى اننى لست ملتحى وايضا لست من احباء الحكومة ولكنى شاب مسلم وكفى<br />يعنى مش كل منتقدى عمرو خالد اما سلفى موتور او حكومى مغرض لكن فى ناس عادية بسيطة ملهاش علاقة بالجماعات والتكتلات الحزبية يعنى ملهاش غرض غير ان هى تسمع لاشخاص وتثق فيهم وليس اشخاص كثر حولهم الجدل .<br />الناس عموما لها ظاهر الكلام وان قلتم لايقصد فتلك مصيبة وان كان يقصد فالمصيبة اكبر نحن لا علاقة لنا هنا باخلاص الرجل من عدمه ولكن لنا علاقه بكلامه الظاهر امامنا .<br />ولكنى اخبرونى لماذا هذا الاحتفاء المبالغ فيه من كل وسائل الاعلام الغربية والعربية والمصرية سواء المقروءة او المرئية؟<br />وهل يثاب الفرد على الدعوة الى الله من جوائز ومديح وخلافه؟ لا نقول نحن الا جزاك الله خيرا والثواب من عند الله .<br />نقطة اخيرة لقد قدم الكثيرين النصح لعمرو سواء علنا او( سرا على ما اعتقد ) ولكن يبدو ان عمرو خالد لا يسمع لهم ."
