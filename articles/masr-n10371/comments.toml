[[comments]]
order = 3
subject = "عمرو خالد سابقا يختلف عن حاليا"
author = "BATISTUTA"
posted = "2007-05-24"
text = "لماذا لا نسمع الجدل الا حول عمرو خالد ولماذا ودائما لعمرو خالد مدافعيين متحمسين كل همهم ان يظهروا عمرو خالد كالملاك الذى لايخطى انا لا اتحدث عن كاتب المقال ان اتحدث عموما ويظهر له مدافعون بالمئات كل همهم ان يسفهوا من اراء الاخرين ويظهروا عمرو خالد على انه شهيد الدعوة الاسلامية الذى لا يسلم من اذى الظلاميين اعداء النجاح.<br />لماذا ودائما ايضا تصروا ان تضعوا من ينقد عمرو خالد على انه غيران وحاقد على الشهرة التى وصل اليها الرجل .<br />اعرف ان هناك اشخاص اغبياء ينتقدوا عمرو خالد نقد جارح لا يسئ لعمرو بقدر ما يسئ الى منتقديه عموما.<br />اختلف مع كاتب المقال فى نقاط عدة منها :<br />اولا:ان عمرو خالد توجه الى الطبقة الغنية وحدثهم عن الاسلام وانا (واعذرنى عن كلمة انا هذه ليست نرجسية والله )اسأل هل يوجد اسلام للطبقة الغنية واخر للطبقة الفقيرة تلك عنصرية ومن جهة اخرى ان الاسلام منهج موحد للكل للفقراء الغلابة والاغنياء المترفين.<br />ثانيا :لا افهم ماذا تعنى او يعنى من تتحدث باسمه التدين التدريجى التدين حته حته بمعنى ان ياخد الشاب ما يريد ويترك ما يخنقه واذا كان الشباب المترف لايقبل بالاسلام ككل فهذا ليس عيب فى الاسلام بل عيب فى التربية والسلوكيات الخاطئة والحياة المترفة لهم .<br />لقد كنت من عشاق عمرو خالد فترة وكان يتحدث دائما عن اخلاصه لله وحبه للنهضه وغيره ولكنى وجدت ان عمرو بدل من ان يكتفى بإقرأ بدأ يظهر فى كل مكان كالنجم فعلا فى الرسالة والمحور ودريم والاوربت كما ان كلامه عن المرأة وغير المسلمين فاجده يتحدث عنهم بشدة وتركيز وكأن الاسلام اخفاهم فى مكان مظلم لا يستطيع احد الوصول اليهم او ان الشيوخ الاخرون عندما يأتى ذكر المرأة يحقرونها ويدعون عليها بان لا دور لها فى الاسلام وكانهم ايضا يطالبون بقطع رؤس غير المسلمين .<br />حديثه الدائم عن النهضة كان يجب ان يسبقها نهضة فى الاخلاق فلا نهضة زراعية واقتصادية وعسكرية وثقافية دون ان يسبقها نهضة اخلاقية<br />اخير وقوفه بجابن صالح كامل فى هجومه عن الوصلات التلفزيونية انا لم اعترض على انها طريقة غير شرعية وياليته قاله وكفى لكن تحدثه عن الاعلام يصنع نهضه وان الناس اللى فى القناة بيتعبوا عشان يقدموا اعلام هادف وانا احب ان اسال احباء عمرو خالد اى اعلام هادف تقدمه الا ايه ارت وكذلك الاوربت وغيرها من الشبكات المتخصصة"
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528050247/http://masr.20at.com:80/newArticle.php?sid=10371"

[[comments]]
order = 4
subject = "الي الاخ ياتيستوتا"
author = "محمد سالم"
posted = "2007-05-24"
text = "يااخ باتيستوتا الاستاذ عمرو خالد له محبين عن قناعة بافكاره وكذلك عن قناعه باخلاصه في الهدف الذي يصبو اليه لذلك من الطبيعي ان تجد من يدافع عنه مثلما كنت سنتفض لو ان احدا انتقد الشيخ ابو اسحاق او اشيخ وجدي غنيم<br />اما عن جكاية ال ايه ار تي ...فلو اخذ الدعاه والشيوخ بكلامك فهذا معناه ان يتوقفوا عن الظهور في قناة اقرا لان صاحبها هو صاحب قنوات ايه ار تي<br />ولتوقفوا كذلك عن الظهور في قناة الرساله لان صاحبها هو صاحب قنوات روتانا<br />وكذلك لتوقفوا عن الظهور في قناة الناس لان صاحبها هو صاحب قناة الخليجيه الذي هداه الله علي حسب ما سمعت<br />وكذلك كان يجب علي الشيخين الغزالي والشعراوي رحمهما الله ان لا يظهرا في التلفزيون المصري اخذا بكلامك<br />وفي رايي هذا تشدد ومغالاه لا يجني من وراءها خير<br />بل علي العكس اي وسيله مهما كانت يستطيع من خلالها الداعيه الوصول للناس يجب ان يتمسك بها حتي لا تترك الساحه للمفسدين"
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528050247/http://masr.20at.com:80/newArticle.php?sid=10371"

