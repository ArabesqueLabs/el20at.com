[[comments]]
order = 0
subject = "اسقاطات نفسيه واضحه"
author = "نيفين نيفى نوفا"
posted = "2007-05-24"
text = "يقول الاستاذ فى مقاله (عادة النجم الذي لا يتحرك إلا ويحدث ضجة ويجذب الأنظار ) وهل فى هذا عيب<br />الم يكن الشيخ الشعراوى محطا للانظار<br />اليس محمد هدايه محطا للنظار ..اليس الشيخ يعقوب محطا للانظار..و هل ذنب عمرو انه يمللك كاريزما خاصه تجذب الناس اليه..لا ارى فى ذللك ما يعيب الاستاذ عمرو خالد<br />كما يقول ايضا(لم أكن أنوي الكتابة في هذا الموضوع،)<br />و اقول له هل انت هنا صادق مع نفسك؟؟؟؟؟؟؟؟؟؟؟؟؟<br />و العيب كل العيب فى العباره التاليه( وللتوضيح أشير إلي أن صحيفة النيوزويك اختارت- قبل عامين- عمرو خالد نفسه ضمن أهم أربعين شخصية في العالم العربي ولها الحق أيضا...ولكن كان معه في الاختيار أيضا المغنية اللبنانية نانسي عجرم باعتبارها أعادت الاعتبار لفكرة المتعة والمرح لدي العرب)<br />و اقول له بالله عليك هل فى هذا ادنى قدر من الانصاف للرجل<br />و ماذا يحدث حين يتساوى داعيه مع مطربه<br />اى عبث هذا و اى امتهان<br />(قرأت حوار عمرو خالد أكثر من مرة وأزعجني كثيرا الإحساس المتضخم بالذات و\" الأنا \" العالية )<br />اترك لكم الحكم<br />و ليخبرنى احد من هنا النرجسى<br />الرساله زواضحه<br />و المقال ينضح بالنرجسيه و الاسقاط النفسى واضح جدا لاى شخص يعلم القليل عن علم النفس<br />ملحوظه:لست مع عمرو خالد على طول الخط و لى معه اختلافات كبيره شانى فى هذا شان العديدين و بل و احيانا كانت تصيبنى بعض احاديثه بالدهشه و لكن الانصاف يقتضى ان نعطى الرجل حقه<br />عمرو خالد لا يستحق منا هذا"
archived = "2007-05-28"
capture_url = "https://web.archive.org/web/20070528050247/http://masr.20at.com:80/newArticle.php?sid=10371"

