text = "انا كنت ف كافيه ف سموحه ،ن كان قبل ما الجون يجي على الدقيقة 47 كده في شويه عيال قدامنا اعدو يشتمو ف المنتخب (هيلا هيلا وهيلا هيلا هيو منتخبنا ** امو) فراحو قامو كل الي حواليهم زعقو فيهم وسكتوهم ، وانا اعد حاطط ايدي على وشي وخلاص بدمع وانا بسمع الكاديكي بيقول المهم فريق عربي ف كأس العالم ،، والحضري بيرمي الكوره وانا عمال اقول في نفسي طب ليه مش احنا؟؟ ليه مش احنا ، دحنا اللي احق يا رب احقنا اللي قلنا يارب وانشالله بارادتك يارب نكسب وهما قالو غصبن عن اللي جبونا هيكسبو!! ولعب المحمدي الكوره واتقطعت وانا عمال اقول يارب باقي هجمه متخليهاش تبقي ليهم! ورجتلنا الكوره ورقص احمد عيد وكل اللي ف الكافيه وقفو وحطينا ادينا على روسنا لما طلعوها ،، بعدين معوض بيرفع الكوره ومتعب حط الجون وانفجاااااااااااااااااار اللي يقول عاااااااا واللي يقول هيييييييييييييييييه انا عن نفسي واحد من صحابي كان جمبي اعد ابوس فيه بطريقه غبيه قالي متيجي تنيـ**ـي احسن!! وانا اضحك بهستريه وبدأنا نشجع كلنا الله حي التالت جي وجت فعلا كوره بركات بس ربنا رايد بمتش فاصل الحمددله وربنا يكرمنا فيه"
archived = "2009-12-21"
