[[comments]]
order = 1
subject = "محظوظ"
author = "alexomania"
posted = "2007-05-08"
text = "من حظ أنيس باشا إن ساعتها المحافظ اللي بيتكلم عنه ده مكانش عادل لبيب لأن عدولا معروف و اخر موقف كان موقف التهديد المباشر للمعارضين إنه (مبيرحمش)<br />كان ممكن عمو أنيس يروح ورا الشمس لو زعل عدولا<br />و حسبنا الله و نعم الوكيل"
archived = "2010-03-14"
