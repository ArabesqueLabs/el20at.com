subject = "و هذا هو الاستاذ"
author = "نيفين نيفى نوفا"
posted = "2007-05-08"
text = "هو دائما انيس منصور<br />باسلوبه السهل الممتنع و طريقته الساخره و روحه الدعابيه<br />يا ريت تكترو من مقالات الاستاذ يا عشرينات"
