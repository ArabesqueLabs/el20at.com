order = 0
subject = "وبلدنا على الترعة بتغسل شعرها يا ما نهار مقدرش يدف"
author = "عاشق الابنودى"
posted = "2008-06-23"
text = "خالى عبد الرحمن<br />عدى النهار<br />والمغربية جاية<br />لما كنا مهزومين وبنسف من تراب الارض طلعت انت بكلماتك وبليغ باغانية تنادوا على الشباب اولاد مصر<br />تقولوا<br />ابنك يقول لك يابطل هات لى نهار<br />ابنك يقولك يا بطل هات الانتصار<br />اية يا خال<br />تعبت من النضال ومن المنادية على ولاد الارض<br />تعبت<br />خانك الجسد<br />هتنزل من على الحصان وتسلم سيفك لمين ؟<br />خليك يا ابنودى فارس للكلمة الشريفة وخليك على حصانك ولا تترجل ابدا<br />مفيش فارس بعدك يركب الحصان<br />ولغاية ما يطلع ولد من الارض من قاع الصعيد يمسك النبوت ويضرب بسيفة<br />خليك يا ابنودى<br />ارجوك<br />لا تترجل<br />خليك على الحصان فى الميدان وموت على ظهر الحصان فارس"
archived = "2010-03-14"
