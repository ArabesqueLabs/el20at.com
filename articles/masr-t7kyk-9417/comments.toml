posted = "2009-06-19"
text = "شكوى الى الله المنتقم الجبار حسبى الله ونعم الوكيل فى كل انسان عطل بناء المدرسة عاشق تراب مصر يرجو ان يساعده حسني مبارك !<br />كتبهـا : نور حمود - بتــاريخ : 6/6/2009 7:28:47 PM, التعليقــات : 0<br />وصلت المدونة استغاثة من مواطن مصري ننشرها لاطلاع المسؤولين في مصر عليها لتحقيق رغبته الخيرة:<br />نفسى أساهم فى برنامج الرئيس الانتخابى الداعى لبناء الف مدرسة جديدة<br />عـاشـق تـراب مـصـر . نفسىـ أساهم فى برنامج الرئيس الانتخابى الداعى لبناء ألف مدرسة جديدة . نـداء من عاشـق تراب مصر احمـد عبد السميع الجارحى انا مواطن مصرى بيحب مصر بجد وبأعشق كل ذرة تراب من ترابها بحب خدمة الوطن والمواطنين وهذا الحب سبب لى مشاكل كثيرة كلها تهون فى حب مصر والمصريين وعشق تراب"
archived = "2010-03-14"
