[[comments]]
order = 3
subject = "الناس متوترة وحالتها صعبة"
author = "دكتور  كحة"
posted = "2009-03-14"
text = "التوتر هو اللى بيخللى الناس لا تتحمل بعضها<br />وسببة الفقر وضيق الحال<br />وكمان الفن الجميل زى الموسيقى والاغانى العاطفية بتاع زمان للست نجاة وعبد الحليم والست ام كلثوم كانت بتخللى الناس اكثر لطفا<br />ثم والعياذ باللة ترك الدين لان كل متدين بيعملوا لة ملف فى امن الدولة<br />وطبعا فية احياء شعبية الخناقات فيها بتستخدم السكاكين والمطاوى والسنج وكلمة ها اعورك دى بقت عادية بدلا من كلمة ها اضربك<br />وعموما فية حكمة بتقول<br />البيت اللى مفهوش صايع يبقى حقة ضايع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "سارة عبد الهادي، تؤكد أنها كل يوم تتخانق مع خطيبها"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-03-14"
text = "انصحك يا ساره انك تسيبيه فورا وتخلي ابوكي يديله بالجزمه ويطرده بره البيت لان الخطيب لما يثير مشاكل مع مخطوبته واهلها بيكون انسان تافه واحمق وغبي وممكن يثير معاها مشاكل بعد الزواج تؤدي الى الطلاق<br />واوجه نداء الى كل الاسر الخطوبة دي فترة اختبار لما تلاقي عريس البنت بيعمل مشاكل تفسخوا الخطوبة فورا ويمشي يروح في ستين داهية غير مأسوفا عليه<br />لكن الانسان العاقل يعرف ان البنت مازالت في بيت ابيها وتحت ولايته لا يتدخل ابدا في اي شأن من شئونها لانه يعلم انها لما حتبقى مراته وتيجي بيته حتسمع الكلام على طول<br />وما تخافوش كل شيء نصيب والبنت زي الولد دلوقتي بتشتغل وبتصرف والحمد لله<br />واوجه نداء للشباب كل واحد يحط نصب عينيه حديث رسول الله صلى الله عليه وسلم اترضاه لاختك<br />زي ما انت حتروح تخطب بنات الناس فيه ناس حتيجي تخطب اختك وزي ما بتعمل مع بنات الناس حيتعمل مع اختك<br />خليكوا محترمين يا شباب<br />سلام"
archived = "2010-03-14"
capture_url = ""
