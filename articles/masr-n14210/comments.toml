[[comments]]
order = 0
subject = "مين حمدى رزق ؟"
author = "شاهد"
text = "اللة يرحمك يا سعد باشا زغلول - عندما قلت<br />وماذا علينا اذا لم يفهم البقر ؟<br />استاذ حمدى - انت من اى زريبة ؟"
archived = "2008-02-19"
capture_url = "https://web.archive.org/web/20080219232546/http://masr.20at.com:80/newArticle.php?sid=14210"

[[comments]]
order = 1
subject = "مفيش فرق"
author = "زكى الدبور"
text = "مفيش فرق بين حمدى رزق وفتحى سرور الاول بيرقص للحكومة علشان يبقى رئيس تحرير للمصور بعد عمر طويل والثانى بيرقص للنظام ، يعنى ياحمدى مربوط على مربوط مايلفش والعب غيره."
archived = "2008-02-19"
capture_url = "https://web.archive.org/web/20080219232546/http://masr.20at.com:80/newArticle.php?sid=14210"
