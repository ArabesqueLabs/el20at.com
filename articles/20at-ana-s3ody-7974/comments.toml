text = "الوضع فعلا بئة محير ومخيف يمكن لينا احنا البنات هل المفروض علينا أننا مقابل شقائنا وتعبنا طول وقت الشغل وبعد كده يجى موضوع الراتب هو محل الخلاف الأساسى فى البيوت ، المادية طاغية علينا<br />قولونا الحل هل بالتقسيم والتراضى ولا كل واحد يخبى ويدارى من التانى ؟<br />ياخربة بيت ديه عيشة"
