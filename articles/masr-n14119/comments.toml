[[comments]]
order = 3
subject = "التحضر والمدنية"
author = "د. سوسن عبداللة"
posted = "2008-02-06"
text = "الى الاخ اللى فوق اعتقد ان هذا العمل لا يشين المرأة ولا ينقص من احترامها وقد انتهى خلاص عصر الحرملك واصبحت المرأة كيان قائم بذاتة ولم تعد تعتمد على الرجل بل اصبح العكس هو الوضع القائم فما المانع الذى يمنعها من مزاولة مهنة مأذونة او اى عمل اخر المهم ان يكون عملا شريفا وفى هذة الحالة الزوج موافق وهنا اكتملت الشروط وان كنت ارى ان موافقة الزوج غير ضرورية فالامر يخص المرأة وحدها . والى مذيدا من النجاحات للمرأة المصرية والعربية"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142528/http://masr.20at.com:80/newArticle.php?sid=14119"

[[comments]]
order = 4
subject = "¡¡¡¡¡¡¡"
author = "omar"
posted = "2008-02-06"
text = "بسم الله الرحمن الرحيم<br />سيدتي وامي واختي وزوجتي وبنتي المرأه<br />لاتنخدعي انهم يسحبوك رويدا رويداحتي تنجرفي الي منتصف اليم وساعتها سيقفون موقف المتفرج وانت تخلعين ملابسك لانها تعيقك عن السباحه وتخلعين حيائك لانه يمنعك من المواصله وستذوب عقيدتك ومبادئك العزبه في اليم المالح ذو الامواج العاتيه وبعد معاناه وصولك الي البر ستكتشفين ان اليم ابتلع بيتك الصغير ولك انت تبحثي عن جحر صغير تعيشين فيه عاريه من كل شيئ انت والكلبه سواء"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142528/http://masr.20at.com:80/newArticle.php?sid=14119"

[[comments]]
order = 5
subject = "وايه يعني"
author = "peace_lover"
posted = "2008-02-06"
text = "يا جماعه ليه كل التعليقات دى لاحظوا أنها ممكن تجرحها واحنا لازم نحترم اراء الاخرين ...................بالنسبه للفكره فأنا مش فاهمه ايه الغلط فيها مادامت مش بتتعارض مع الشرع في شئ .ربنا مش حرمه ليه نحرمه احنا ,,,وبعدين لو هيه أكفئ من المتقدمين الاخرين لحصولها علي الشهادات اللي قالت عليها مش يبقي ظلم اننا نفضل الاخرين عليها لمجرد أنها أمرأه.الاسلام عمره مفرق بين الرجل والمرأه في التشريعات فيما عدا بعض الخصوصيات ودي مش منها يبقي ايه يعني أن يكون في مأذونه رغم اني مستغربه الموضوع شويه بس ده الواقع كل شئ جديد لازم نستغربهpeace_lover"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142528/http://masr.20at.com:80/newArticle.php?sid=14119"

[[comments]]
order = 6
subject = "why not ??"
author = "some one"
posted = "2008-02-07"
text = "شئ غريب جداااااااااااااا<br />إيه اللى يمنعها يعنى إنها تتولى موقع مأذون ؟؟<br />دى مجرد وظيفة للتوثيق و الإشهار و إعلان الزواج فإيه اللى يمنع المرأة إنها تتولاه ؟<br />ده غباء إننا نطالب بقصر بعض الوظائف على الرجال فقط دون النساء ......<br />طول عمرنا هنفضل متخلفين و متأخرين طالما بنعامل المرأة على إنها كائن غير جدير بتحمل المسئولية ..<br />المرأة فى الخارج تولت منصب قاضى و فى المويت كمان فيه قاضيات ..<br />بس هنقول إيه ؟؟ ماهى مصر مسيطر عليها فكر الإخوان المسلمين و ده مخلينا دايما فى تأخر ..<br />طبقوا صحيح الدين و إبتعدوا عن التطرف و المغالاة .."
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142528/http://masr.20at.com:80/newArticle.php?sid=14119"

[[comments]]
order = 7
subject = "ولو الست عندها الدورة الشهرية"
author = "رخم قوى"
posted = "2008-02-07"
text = "ولو الست عندها عندها الدورة الشهرية هتقرأ ايات القرأن اللى المأذون بيقراها عادة قبل عقد القران ازاى<br />والا هتقول للى يروح يطلبها لعقد قرانة انتظر لما الدورة الشهرية تخلص<br />خلاص<br />وطبعا عادة عقد القران بيكون فى مجلس كلة رجالة وكبار العائلتين - الست الهانم هتقعد فى وسط الرجالة ازاى<br />هى العملية استهبال<br />والا كل بنت طالعة فيها هتعمل لنا فلة<br />اذا سمح الدين فالتقاليد تمنع<br />والتقاليد اقوى فى المجتمع احيانا من اى شىء اخر<br />وبعدين تبقى تقابلنى اذا احد طلبها لعقد قرانة<br />نسوان اخر زمن"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142528/http://masr.20at.com:80/newArticle.php?sid=14119"

