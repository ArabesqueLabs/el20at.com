text = "طبعا انتوا عارفين ان في اوروبا الشواذ بيتجوزا وفي الكنيسة كمان<br />اهو الست في مصر تنفع لعقد قران الشواذ<br />يعني لما اتنين رجالة عايزين يتجوزوا بعض يجيبوا الست الهانم تكتبلهم الكتاب<br />زي مين كده أه<br />زي فاروق حسني والبابا شنوده"
