text = "طبعا مصر رائدة حقوق الانسان واذا مش مصدين اسالو رائد شرطة خوفو الاول وهوا يقول ليكم عن معاملة البشر<br />ياحضرات انا فى اجازتى نزلت مصر وفى كمين وقفنى ظابط الشرطة وانا سايق عربيتى وقانونى<br />الظابط : رخصك بسرعة يلة ؟<br />انا : انتا بتكلمنى انا<br />الظابط : احا انزلى بسرعة<br />انا : نزلت ........ نعم<br />الظابط : فتح بقى وخبطنى على بطنى ( انتا مبلبع حاجة )<br />انا : انتا تعرف المقدم حمدى ....... دة جارى انا ساكن فى ...............<br />الظابط : انا بتشتغل اية ( بقلق )<br />انا : ابدا انا محاسب بس بشتغل فى الكويت ونازل مصر اجازتى السنوية<br />الظابط :sad: ابتسامة عريضة ) مش تقول كدة اهلا وسهلا معلش اصل احنا بنقابل من ولاد الكلب دول ( احتمال يقصد الشعب ) ومبنخلصشى من لماضتهم مع الف سلامة<br />انا : شكرا<br />الظابط : سلامنا لحمدى باشا بس قولة الملازم اول (وائل ...... )<br />اية رايكم فى الديمقراطية دى ؟؟؟؟؟؟؟؟"
