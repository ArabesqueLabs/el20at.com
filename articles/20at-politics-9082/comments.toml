subject = "گفتگو با استاد محمد عاطف رئيس جمعيت اصلاح و انكشاف"
author = "گفتگو با استاد محمد عاطف رئيس"
posted = "2008-05-17"
text = "گفتگو با استاد محمد عاطف رئيس جمعيت اصلاح و انكشاف اجتماعي افغانستان<br />احمدفريد فرزاد<br />معرفت: استاد، لطف نموده کم&--1740; دربارة خود بگو&--1740;&--1740;د.<br />نام بنده محمد و «عاطف» تخلص م&--1740;‌کنم. س&--1740;‌وهشت سال قبل در ولا&--1740;ت تخار د&--1740;ده به جهان گشودم، تعل&--1740;مات ابتدا&--1740;&--1740; خود را در زادگاهم به پ&--1740;ش بردم و بعد از کودتا&--1740; هفت ثور رو به تعل&--1740;مات د&--1740;ن&--1740; نموده و در مدارس سنت&--1740; تخار و کندز به فراگ&--1740;ر&--1740; علوم اسلام&--1740; ادامه دادم. در بهار 1365 هـ ش، راه&--1740; د&--1740;ار هجرت شدم و در مدارس د&--1740;ن&--1740; صوبه سرحد به تکم&--1740;ل درس‌ها&--1740; د&--1740;ن&--1740; خود پرداختم. در آغاز سال 1368 هـ ش به انست&--1740;توت امام اب&--1740;‌حن&--1740;فه پ&--1740;وستم و در آن جا مرحلة ثانو&--1740; خود را تکم&--1740;ل نمودم و سپس به دانشکدة اصول الد&--1740;ن (تعل&--1740;مات اسلام&--1740;-) دانشگاه دعوت و جهاد شامل شدم. در سال 1371 هـ ش از دانشکدة مذکور فارغ گرد&--1740;دم و در همان سال در چوکات د&--1740;پارتمنت عق&--1740;ده و فلسفه در کدر علم&--1740; دانشگاه دعوت و جهاد مقرر گرد&--1740;دم و تا سال 1376 هـ ش با نش&--1740;ب‌وفرازها&--1740;ي که دانشگاه مذکور داشت، همکار علم&--1740; بودم و بعد از سقوط دانشگاه دعوت و جهاد، در مقاطع مختلف و برا&--1740; مدت‌ها با دانشگاه‌هاي عبدالله بن مسعود (دانشگاه تخار)، دانشگاه ه&--1740;واد و دانشگاه افغان در د&--1740;ار هجرت همکار&--1740;‌ها&--1740; علم&--1740; داشتم. در هم&--1740;ن فرصت، مرحله علم&--1740; ماستر&--1740; خود را در زبان و ادب&--1740;ات عرب&--1740; از دانشگاه پنجاب در لاهور به دست آوردم و بعداً در دانشگاه پشاور مرحله بعد از ماستر&--1740; (ام فل) که مقدمه دکتورا شمرده م&--1740;‌شود، در رشته مقارنه اد&--1740;ان به سر رسان&--1740;دم. در جر&--1740;ان تحص&--1740;ل، مسؤول&--1740;ت اداره مرکز فرهنگ&--1740; اسلام&--1740; افغانستان را از سال 1378 هـ ش ال&--1740; 1383 هـ ش بدوش داشتم.<br />بعد از سپر&--1740;‌شدن &--1740;ک سال از تأس&--1740;س جمع&--1740;ت اصلاح و انکشاف اجتماع&--1740; افغانستان، در سال 1383 هـ ش، به اداره جمع&--1740;ت اصلاح از طرف شورا&--1740; مؤسسان مکلف گرد&--1740;دم، که تا حال در ا&--1740;ن راستا خدمت مي‌كنم.<br />معرفت: جمع&--1740;ت اصلاح و انکشاف اجتماع&--1740; افغانسان چه وقت تأس&--1740;س شده است؟<br />جمع&--1740;ت اصلاح و انکشاف اجتماع&--1740; افغانستان، به تار&--1740;خ 4/4/ 1382 هـ ش از وزارت عدل&--1740;ه جواز رسم&--1740; فعال&--1740;ت‌ها&--1740; خود را به دست آورد، که قبل از اخذ جواز، به نام «انجمن تعل&--1740;م&--1740; و فرهنگ&--1740; مستقبل» فعال&--1740;ت م&--1740;‌نمود و قبل از ا&--1740;ن ن&--1740;ز همزمان با دگرگون&--1740;‌ها&--1740; س&--1740;اس&--1740; کشور، در سال 1381 هـ ش فعال&--1740;ت‌ها&--1740; غ&--1740;ررسم&--1740; خود را جمع&--1740;ت اصلاح در بُعد فرهنگ&--1740; و تعل&--1740;م&--1740;، مانند نشر ماهنامه مستقبل که بعداً به فصلنامة جمع&--1740;ت اصلاح تبد&--1740;ل گرد&--1740;د، در شهر کابل ادامه م&--1740;‌داد.<br />معرفت: جمع&--1740;ت اصلاح عمدتاً چه اهداف&--1740; را دنبال م&--1740;‌کند؟<br />جمع&--1740;ت اصلاح و انکشاف اجتماع&--1740; افغانستان، به ح&--1740;ث &--1740;ک ارگان اجتماع&--1740; در کشور به فعال&--1740;ت آغاز نمود و از طرف &--1740;ک عده از جوانان و استادان دانشگاه‌هاي مختلف کشور تأس&--1740;س گرد&--1740;د. هدف تأس&--1740;س جمع&--1740;ت اصلاح و انکشاف اجتماع&--1740; افغانستان، در چند نقطه خلاصه شده م&--1740;‌تواند.<br />نخست از همه تلاش ما ا&--1740;ن است تا در راستا&--1740; بازساز&--1740; و انکشاف ماد&--1740; و معنو&--1740; کشور، در چوکات فعال&--1740;ت‌ها&--1740; فرهنگ&--1740;، آموزش&--1740;، فکر&--1740; و اجتماع&--1740; سهم بارز&--1740; داشته باش&--1740;م.<br />هدف د&--1740;گر جمع&--1740;ت اصلاح، ا&--1740;ن است که ارزش‌ها&--1740; ناب اسلام&--1740; در جامعه نهاد&--1740;نه گردد و دستاوردها&--1740; مرغوب فرهنگ اص&--1740;ل مل&--1740; ما در جامعه حفظ گردد.<br />جمع&--1740;ت اصلاح در صدد آن است تا جلو &--1740;ورش ب&--1740;‌رحمانه فرهنگ&--1740;، اخلاق&--1740; و د&--1740;ن&--1740; غرب در جامعه گرفته شود و هو&--1740;ت د&--1740;ن&--1740; و اسلام&--1740; جامعه ما حفظ گردد.<br />جمع&--1740;ت اصلاح تلاش م&--1740;‌نما&--1740;د تا فضا&--1740; صلح، انسان‌دوست&--1740; و برادر&--1740; در جامعه حاکم گردد و هر گونه گرا&--1740;ش نامطلوب، متعصبانه و تفرقه‌انگ&--1740;ز از جامعه زدوده شود.<br />به خاطر ترب&--1740;ه و پرورش اند&--1740;شه‌ها&--1740; سازنده و کادرها&--1740; علم&--1740; و فن&--1740; که در بازساز&--1740; ماد&--1740; و معنو&--1740; جامعه سهم فعال داشته باشند، برنامه‌ها&--1740; مناسب داشته و خود را مسؤول م&--1740;‌دان&--1740;م.<br />&--1740;ک&--1740; از اساس&--1740;‌تر&--1740;ن اهداف ما پرورش فکر&--1740; نسل جوان کشور (زنان و مردان) بر اساس جهان‌ب&--1740;ن&--1740; اسلام&--1740; است، نسل&--1740; که بتواند رستاخ&--1740;ز اجتماع&--1740; کشور را به سو&--1740; آ&--1740;نده سعادتمند ماد&--1740; و معنو&--1740; رهبر&--1740; کند.<br />معرفت: شما در کدام عرصه‌ها م&--1740;‌توان&--1740;د فعال&--1740;ت داشته باش&--1740;د؟<br />جمع&--1740;ت اصلاح و انکشاف اجتماع&--1740; افغانستان، به ح&--1740;ث &--1740;ک ارگان اجتماع&--1740; و مطابق اساسنامه خو&--1740;ش، م&--1740;‌تواند در عرصه‌ها&--1740; مختلف فعال&--1740;ت نما&--1740;د؛ از جمله ا&--1740;جاد اتحاد&--1740;ه‌ها&--1740; صنف&--1740;، ترت&--1740;ب و تنظ&--1740;م حلقات د&--1740;ن&--1740; و آموزش&--1740;، گشودن مؤسسات تعل&--1740;م&--1740; و خدمات&--1740;، پخش و نشر مجلات و &--1740;ا ا&--1740;جاد رسانه‌ها&--1740; د&--1740;دار&--1740; و شن&--1740;دار&--1740; و همچنان تدو&--1740;ر هر گونه برنامه‌ها&--1740; فرهنگ&--1740;، تربيو&--1740; و &--1740;ا آموزش&--1740;. که به فضل و مرحمت خداوند&--1740; و در نت&--1740;جه تلاش‌ها&--1740; مستمر و پ&--1740;‌گ&--1740;ر اعضا، همکاران و همفکران خو&--1740;ش، توانسته است تا اکنون در بخش‌ها&--1740; فرهنگ&--1740; و نشرات، بخش تعل&--1740;م&--1740;، بخش فعال&--1740;ت‌ها&--1740; عامه و بخش خدمات اجتماع&--1740;، خدمات شا&--1740;ان&--1740; را تقد&--1740;م نما&--1740;د، که به طور خلاصه نمونه‌ها&--1740; آن را &--1740;ادآور م&--1740;‌شو&--1740;م:<br />در بخش فرهنگ&--1740; و نشرات، که هدف آن سهم‌گ&--1740;ر&--1740; در همگان&--1740;‌شدن ب&--1740;نش اسلام&--1740; و درک واقع&--1740;ت‌ها&--1740; اجتماع&--1740; در ب&--1740;ن اقشار مختلف جامعه م&--1740;‌باشد، تا اکنون شمار&--1740; از نشرات را تقد&--1740;م فرزندان وطن م&--1740;‌نما&--1740;د. هفته‌نامه اصلاح مل&--1740; که هفته‌وار از کابل پخش م&--1740;‌گردد و به اکثر&--1740;ت ولا&--1740;ات کشور توز&--1740;ع م&--1740;‌گردد و از جمله پرت&--1740;راژتر&--1740;ن و پرفروش‌تر&--1740;ن هفته‌نامه‌ها به شمار م&--1740;‌رود، همچنان ماهنامه قافله که به عنوان &--1740;ک نشر&--1740;ه ترب&--1740;ت&--1740;، فکر&--1740; و علم&--1740; ط&--1740; تقر&--1740;باً صد صفحه ماهوار از کابل نشر م&--1740;‌گردد، برعلاوه از آن ماهنامه ژوند که از دفتر ساحو&--1740; ولا&--1740;ت ننگرهار ماهوار پخش م&--1740;‌گردد و ماهنامه اذان که از طرف دفتر ساحو&--1740; ولا&--1740;ت وردك پخش م&--1740;‌گردد. و برعلاوه از آن برخ&--1740; از جزوه‌ها، پوسترها، کتاب‌ها و س&--1740;‌د&--1740;‌ها&--1740; سمع&--1740; و بصر&--1740; که حاو&--1740; مطالب سازنده اخلاق&--1740; و اجتماع&--1740; م&--1740;‌باشد، از مرکز و دفاتر ساحو&--1740; به شکل منظم چاپ و تکث&--1740;ر م&--1740;‌گردد.<br />همچنان بخش فرهنگ&--1740; بر آن است تا در راستا&--1740; رشد و توسعه ب&--1740;نش د&--1740;ن&--1740; و علم&--1740; هموطنان عز&--1740;ز، تلاش‌ها&--1740; خود را گسترش داده، &--1740;ک دستگاه راد&--1740;و را رو&--1740; موج اف ام در کابل و سپس در ولا&--1740;ات د&--1740;گر کشور تأس&--1740;س نما&--1740;د. همچنان ا&--1740;ن بخش در تلاش تأس&--1740;س کتابخانه‌ها&--1740; علم&--1740; در شهرها&--1740; مختلف کشور است که هم‌اکنون در ولا&--1740;ات کابل و ننگرهار کتابخانه‌ها&--1740; مجهز&--1740; را در خدمت جوانان و علم‌پروران کشور خود قرار داده است.<br />بخش فعال&--1740;ت‌ها&--1740; عام: جهت رشد و توسعه فکر&--1740; و اجتماع&--1740; و همگام&--1740; هموطنان عز&--1740;ز با تحولات سرنوشت‌ساز کشور، س&--1740;م&--1740;نارها، کنفرانس‌ها، کورس‌ها&--1740; درازمدت و کوتاه‌مدت معارف اسلام&--1740; و دوره‌ها&--1740; کوتاه‌مدت و درازمدت تفس&--1740;ر، حد&--1740;ث و س&--1740;رت مطهر پ&--1740;امبر اکرم(ص) و حلقات توج&--1740;ه&--1740;، تعل&--1740;م&--1740; و ترب&--1740;ت&--1740; را برگزار م&--1740;‌نما&--1740;د.<br />بخش تعل&--1740;م&--1740;: برا&--1740; ارتقا&--1740; سطح علم&--1740; هموطنان عز&--1740;ز، به و&--1740;ژه نسل جوان کشور، قرار است کانون‌ها&--1740; علم&--1740; و آموزش&--1740; تخصص&--1740; از قب&--1740;ل مدارس، ل&--1740;سه‌ها، انست&--1740;توت‌ها و دانشگاه‌ها را تأس&--1740;س نما&--1740;د تا کادرها&--1740; فن&--1740; و مسلک&--1740; را ترب&--1740;ه و تقد&--1740;م کاروان علم&--1740; کشور نما&--1740;د. که فعلا در چوکات سکتور خصوص&--1740;، ل&--1740;سه‌ها&--1740; اصلاح در ولا&--1740;ت ننگرهار، کابل، کندهار و بادغ&--1740;س، کانون علم&--1740; امام ابو&--1740;وسف در جلال‌آباد و دارالمعلم&--1740;ن اصلاح در کابل شرف خدمت را بدوش دارند.<br />بخش خدمات اجتماع&--1740;: در موسم رمضان و ع&--1740;د قربان به روي مستمندان دروازة همکار&--1740; خو&--1740;ش را باز نموده و در جلب همکار&--1740; انسان‌ها&--1740; خ&--1740;راند&--1740;ش تلاش نموده است و توجه تجار مل&--1740; خود را به مردم ب&--1740;‌بضاعت و آس&--1740;ب‌زدة کشور جلب م&--1740;‌نما&--1740;د. ما در آغاز هم&--1740;ن سال برنامة نهال‌شان&--1740; را در مناطق مختلف شهر کابل به راه انداخت&--1740;م و صدها تن از اعضا و همکاران جمع&--1740;ت اصلاح در آن سهم گرفتند، که مردم و رسانه‌ها&--1740; مختلف کشور، از آن تقد&--1740;ر و تمج&--1740;د نمودند.<br />در تأس&--1740;س اتحاد&--1740;ه‌ها&--1740; صنف&--1740; مانند جوانان، دکتوران، علما و دانشمندان قدم گماشته که در توج&--1740;ه ملت و جلب همکار&--1740; در بازسا&--1740; کشور، با همد&--1740;گر مف&--1740;د واقع گردند؛ که هم&--1740;ن اکنون در چوکات جمع&--1740;ت اصلاح اتحاد&--1740;ه دکتوران تشک&--1740;ل &--1740;افته و در آ&--1740;نده‌ها&--1740; نزد&--1740;ک به فعال&--1740;ت رسم&--1740; خود آغاز خواهد نمود.<br />بخش جوانان جمع&--1740;ت اصلاح برنامه‌ها&--1740; بس&--1740;ار مف&--1740;د و مؤثر&--1740; را برا&--1740; رشد استعدادها&--1740; جوانان و شگوفا&--1740;&--1740; آن در ولا&--1740;ات مختلف کشور راه‌انداز&--1740; نموده است؛ از جمله برنامه ستاره‌ها&--1740; معارف ولا&--1740;ت کابل بود ـ که ا&--1740;شان ستاره‌ها&--1740; حق&--1740;ق&--1740; کشوراند ـ در ا&--1740;ن برنامه به اول‌نمره‌‌هاي عموم&--1740; 103 ل&--1740;سه ذکور و اناث شهر کابل جوا&--1740;ز باارزش&--1740; به همکار&--1740; برخ&--1740; از شرکت‌ها&--1740; تجارت&--