subject = "الفرس أم الروم ؟؟"
author = "طيف بدر"
posted = "2008-05-15"
text = "لسنا مرغمين على الاختيار بين مشروع صليبي صهيوني أو مشروع صفوي رافضي … لسنا مرغمين على تحمل تبعات مشروع التقوقع العربي الرسمي داخل القبعة الأمريكية… هناك مشروعات إسلامية قرآنية سنية في العراق( تحارب كلا المشروعين) و فلسطين (تتعامل ببراجماتية و استراتيجية لا تبعية مع إيران و تقاوم المشروع الصهيوني ) و لو كان في أرذال العربان المتجمة فر رقاب الشعوب العربية ذرة من الذكاء أو الرغبة في حماية نفسها على الأقل من الابتلاع بين فكي أحد المشروعين لدعمت الخيار الثالث المقاوم - لا سيما خيار حماس .<br />”و الله الواحد دمه بيتحرق لما يشوف إيران بتعمل إيه لحزب الله و دول الأعراب بتعمل إيه لحماس ؟<br />علشان كدة من حق إيران تمدد رجليها في وش التخين لكن الأعراب مكانهم تحت جزم الأمريكان عايشين “<br />http://alayasser.maktoobblog.com"
archived = "2010-03-14"
capture_url = ""

