text = "لازم نعرف انة نوعية الحيوانات البشرية المنحطة دى معندهاش اى وازع دينى بيردعها عن التعدى على اعراض الناس وبكدة يغوروا غير ماسوف عليهم ومحدش يقدر يلوم اهل البنت المسكينة على اللى عملوة لان دة من حرقت قلبهم على شرفهم مع العلم انة انا ضد انة كل حد ياخد حقة بايدة لانة يفترض انة فية حكومة 0000 انا عندى سؤال للظابط او وكيل النيابة او القاضى اى حد من المحترمين دول يحط نفسة لاسمح اللة مكان الاسرة دى واية ردة فعلة وبعد كدة يقدر يحكم بضمير مطمئن"
