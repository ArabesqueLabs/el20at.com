[[comments]]
order = 4
subject = "حاسبوا  انفسكم قبل ان تحاسبوا"
author = "نونيا"
posted = "2007-09-26"
text = "انا الى كتبت بدون اسم .على فكرة الحق لو استنينه نخدوا بالحكومه يبقى هيضيع بس لو استنينا نخدوا يوم القيامه يبقى مش هيضيع لان الدديان لا يموت وكما تدين تدان واكيد كان داه هيحصل لاى حد من اهل بيته بس الى هيوجعه اكتر فى قصه كده خدوها عظه .كان فى واحد اتعرف على فتاه عن طريق الهاتف بس وثقت فيه وراحت عرفته اسمها وبنت مين هى بتكون ولما طلب مقابلتها رفضت وضل يلح علبها وهى ماوافقت فهددها انوا انوا هيعطى رقمها لكل اصحابه وفعلا عمل داه وراح كتب اسمها على كل الجدران فلانه بنت فلان ونام ولما صحى لاقى ايده الاتنين مكتوب عليهم بنفس الخط فلانه بنت فلان وضل مايورى ايدوا لاحد من فظاعه منظرها وراح لطبيب وقاله انا عايز اعمل علاج ووصفلوا الحاله من غير مايوريلوا ايديه التنتين فجاله الطبيب مااقدر اشخص المرض دون ان ارى وبعد حديث مرير نزع القفاز عن يديه وحكى يالى صار الى الطبيب فعملوا عمليه ازاله باليزر تلات مرات وفى كل مره كان بيروح ويرجع تانى وبعدها راح الطبيب قال للشاب اتصل بيها وقولها تسامحك قالوا انا اتصلت كتير ولكن مابترد عليا قالوا حاول تانى واخيرا ردت عليه فقالها فقالتلوا روح مكه وصلى وبعد كل صله اغسل يديك بماء زمزم وبعد 10 ايام راح الاسم وهما الان لديهم ولد وبنت من الحلال . انا اسفه على الاطاله بس والله القصه حقيقه قال الله تعالى للعبد المظلوم وعزتى وجلالى لانصرنك ولو بعد حين . ولا ايه رايكم ياشباب , اطلب من الله ان يهدينى واياكم اجمعين .<br />لا اله الا الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "اقارب الفتاة تسرعوا كثيرا وكان يجب عليهم التروي وت"
author = "اكتب اسمك هنا"
posted = "2007-09-26"
text = "حبس الخادمة وأقاربها في جريمة قتيل المنصورية<br />بدأت نيابة حوادث جنوب الجيزة تحقيقاتها في مقتل السائق محمد إسماعيل عبدالسلام \"39 سنة\" الذي عثر علي جثته مذبوحة بترعة المنصورية بالهرم.. استمع حازم الجيزاوي وكيل أول النيابة إلي اعترافات القتلة وأمر معتز عيسي مدير النيابة باشراف المستشار حمادة الصاوي المحامي العام لنيابات جنوب الجيزة بحبس الخادمة وفاء صبري شحاتة \"17 سنة\" وأسرتها المكونة من 8 أفراد الذين شاركوها الجريمة وقررت النيابة عرض الخادمة علي الطبيب الشرعي لتوقيع الكشف الطبي عليها..استمعت النيابة إلي اعترافات بقية المتهمين وهم صبري شحاتة عبدالرازق \"45 سنة\" \"عامل إعلانات\" \"والد الخادمة\" ووالدتها زينب علي علي شعراوي \"38 سنة\" وخطيبها محمود سامي صادق وشهرته \"أيمن\" \"21 سنة\" ومحمد بخيت محمد \"21 سنة\" \"شقيق الخادمة من الأم\" وخالها شوقي علي علي وشقيقه أحمد وعلي شوقي علي \"ابن خالها\" وأشرف سيد حامد الذين اعترفوا بجريمتهم وقرروا ان المجني عليه اعتدي علي ابنتهم وفاء واغتصبها بالقوة وفض غشاء بكارتها فقرروا التخلص منه وأكدوا أمام النيابة أنهم غير نادمين علي فعلتهم..اصطحب العميد عصام عبدالنعيم رئيس مباحث قطاع النفس بالجيزة والعقيد مجدي عبدالعال مفتش مباحث الغرب المتهمين التسعة إلي مسرح جريمتهم وسط حراسة أمنية مشددة بقيادة المقدم عبدالرحمن أبوضيف رئيس مباحث الهرم ومعاونه الرائد محمد الصغير والمقدم حسن عليوه وكيل فرقة مباحث غرب الجيزة فأعادوا تمثيل جريمتهم ووصفوا كيفية اختطاف السائق واحتجازه وذبحه والتخلص من جثته بالترعة..أدلت الخادمة باعترافات تفصيلية قررت فيها أمام اللواء محسن حفظي مساعد الوزير مدير أمن الجيزة أنها غير نادمة لأن ما ناله السائق هو العقاب الوحيد لفعلته وأكدت أمام اللواء فاروق لاشين مدير الادارة العامة للمباحث أن السائق اختطفها في عشة بمدينة نصر واغتصبها بالقوة وفض غشاء بكارتها واحتجزها 6 أيام وروت لأسرتها ما حدث فقرروا قتله..وجهت النيابة لها ولأسرتها تهم القتل العمد وخطف السائق واحتجازه دون وجه حق واحراز أسلحة بدون ترخيص واخفاء جثة السائق القتيل."
archived = "2010-03-14"
