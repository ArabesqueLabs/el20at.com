subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-09-26"
text = "بصراحه يستاهل اكتر من كده بس معلش اعذرونى فى السؤال ايه الى دفع هذا الشاب او غيره من الشباب الى الاغتصاب<br />او الى ارتكابمثل هذه الجرائم . حاسبوا انفسكم قبل ان تحاسبوا يامسلمين .<br />الى كل من لديه شاب اوفتاه ارجوا منكم يااباء وياامهات التقرب منهم وعدم الانشغال عنهم تحت عنوان البحث عن لقمه العيش لان لو اى حد فيهم ضاع او افتقدكم لقمه العيش مش هترجع الى راح.<br />وهنرجع ونقول ياريت الى جرى ماكان انا اسفه طولت عليكم .<br />السلام عليكم ورحمه الله وبركاته"
archived = "2010-03-14"
