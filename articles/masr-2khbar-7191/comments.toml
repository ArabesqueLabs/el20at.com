text = "ليست دعوة للفوضى وكل واحد ياخد حقة با ايدة بعيدا عن القانون<br />لا ولكن القانون يتم التحايل علية<br />وبيطلع الف محامى يحللوا الحرام ويحرموا الحلال وتطلع القضية اونطة<br />لو المجرم عارف ان وراء الضحية اهل هينتقموا منة هيخاف<br />ومطلوب من كل واحد ان يحمى بناتة<br />وكل الطرق متاحة"
