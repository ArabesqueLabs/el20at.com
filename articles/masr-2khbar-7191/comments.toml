subject = "التلفييييييق حرام"
author = "نونيا"
posted = "2007-09-26"
text = "على فكرة الموضوع كله غير مقنع تماما لان القصه فيها حلقه مفقوده ايه الا وهى ما الذى دفع المجنى عليها كما يقال الى الذهاب معه لحد مدينه نصر وهى تقيم فى منطقه الجيزة واين الاهل من سته ايام وماالذى دفع هذا السائق الى اختيار هذه الفتاه وايضا اين كان السكان المجاورين بالمنطقه ياجماعه الحكايه فيها تار والى هيكشف الموضوع داه الطب الشرعى بس ياريت تهتموا لان الظلم حراااااااااااااااام .ربنا يهدينى ويهدى عصاه المسلمين. كل ابن آدم خطاء ولاكن خير الخطائين التوابين .لا اله الا الله"
archived = "2010-03-14"
