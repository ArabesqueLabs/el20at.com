subject = "المثتثمرين ماليين البلد والاثتثمارات فى كل مكان وي"
author = "شاكس"
posted = "2008-06-07"
text = "انتم مفتريين<br />احنا عندنا اطفال شوارع<br />دى اخبار مغرضة وكدابة<br />احنا كل طفل عندنا بياخد دعم من الدولة 5 الاف جنية وفية رعاية جامدة والشرطة لا تقصر وبنلمهم علشان الضباط يفسحوهم فى القناطر وجنينة الحيوانات<br />وحتى ماما سوزى واخدة عشرين جايزة عالمية فى رعاية الاطفال<br />شعب جاحد"
