[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "نانا"
posted = "2008-06-07"
text = "يا سلام ؟!<br />بيفضحوا مصر اه اصل مصر مفيهاش فضايح كفاية ان النصايح اللى السياح بيدوها لبعضهم<br />اول ما تنزل مصر خاف من 3 حاجات:الفلوس (المقرفة)اللى بيتعاملو بيها(العملة المصرية طبعا)<br />اى دواء محلى الصنع(الادوية اللى هرت اكباد وكلى المصريين)<br />الاطفال والشباب حديث السن فى الشوارع(يقصدوا طبعا اطفال الشوارع اللى بيعملوا حاجات مخجلة بالخصوص مع السائحات)ال السينما بتفضح مصر ال ماهى مفضوحة جاهزة والعيال دول لهم شهرة عالمية"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "لازم نبدأ ولا مفر من المحاولة"
author = "ابومحسن"
posted = "2008-06-08"
text = "صحيح مصر احوالها ليست جيدة<br />والنبي محمد صلى الله عليه وسلم لما بعثه الله نبي هذه الامة بلده اللي هي جزيرة العرب كانت منهاره<br />(لطفا) يرجى قراءة احوال الجزيرة العربية قبل البعثة المحمدية<br />حنجد ان مصر افضل كتير من حال الجزيرة العربية قبل البعثة المحمدية<br />وبعدين مكث النبي محمد صلى الله عليه وسلم فيهم 23 سنه<br />((لطفا) يرجى قراءة السيرة النبوية المحمدية ومدتها 23 سنه (منهج الاسلام الذي بلغنه النبي محمد صلى الله عليه وسلم عن الله)<br />وحد النبي محمد صلى الله عليه وسلم بلده جزيرة العرب وعلم اهلها المنهج وبعد انتهاء مهمته صلى الله عليه وسلم<br />وصلت دولتهم المباركة من اسبانيا الى الهند في اقل من 100 عام فقط<br />يا سلام لو نتبع النبي محمد صلى الله عليه وسلم كما اتبعه التابعين من بعده<br />بابي انت وامي يا رسول الله"
archived = "2010-03-14"
capture_url = ""
