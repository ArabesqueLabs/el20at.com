[[comments]]
order = 0
subject = "سبب انتصار الشيعة"
author = "ابومحسن"
text = "يا استاذ احمد القطب اريد ان اوضح سبب انتصارات الشيعة لان ليهم قيادة وليهم امامه وليهم زعامه<br />يعني عندهم الخامنئي هذا القائد الاعلى ثم نصر الله هذا قائد اقل وهكذا في اي مكان تجد الشيعة لديهك امامه وليهم قيادة روحية وزعامه ومرجعية<br />اما احنا اهل السنه والجماعة لماذا ننهزم لان ليس لنا امامه ولا زعامه ولا مرجعية لا على المستوى المحلي ولا على المستوى الاقليمي ولا على المستوى الدولي فنحن اهل السنة والجماعة ليس لنا قيادة روحية ولا مرجعية وعلى سبيل المثال وليس الحصر شيخ الازهر مين بيحترمه من اهل السنه في مصر مثلا او المفتي اهو هزأ نفسه بفتوى التبرك ببول الرسول تعالى في السعودية ابن باز او اي عالم دين ثاني تلاقي كل اهل السنه والجماعة واقفين ضد فتاويهم واجتهاداتهم.<br />فيا اخي الكريم الشيعة انتصروا وينتصرون لان لهم قيادة روحية ومرجعية دينية مقدسة محترمه<br />اما اهل السنة والجماعة فليس لهم قيادة روحية ولا مرجعية دينية على العكس اهل السنه والجماعة لا يحترمون علمائهم<br />واذا اراد اهل السنه والجماعة مكان بين الامم عليهم جميعا بانتخاب قائد وزعيم روحيي يستمع لفتاويه وتنفذ تعليماته تماما كالخامنئي ونصر الله<br />ولتأكيد ذلك شوف قسم حزب الله ايه اشركوا بالله من اجل القيادة والزعامه<br />قسما بالمهدي وبروح الله , بالسيد عسكر بشهيد الله , بالخامنئي بولي الله , إنا على عهدي يا نصر الله<br />فيا استاذ احمد طالما انت كاتب صحفي انا عايزك تدعو الى وحدة اهل السنه والجماعة في العالم كله وكل اهل السنة والجماعة يكون لهم قيادة روحية ومرجعية دينية ويكون لهم قرار واحد وحث اهل السنه والجماعة على احترام العلماء<br />وشكرا<br />اخوك ابو محسن اكبر منك بعشرين سنه"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

