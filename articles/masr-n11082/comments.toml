subject = "وماذا يكون حسن نصر الله شتام امهات المؤمنين في ابو عبيدة ابن الجراح فارس اهل السنة والجماعة"
author = "مش لازم"
text = "أبو عبيدة عامر بن الجراح<br />من ويكيبيديا، الموسوعة الحرة<br />(تم التحويل من أبوعبيدة بن الجراح)<br />اذهب إلى: تصفح, بحث<br />هو عامر بن عبد الله بن الجراح بن هلال الفهري القرشي ويكنى بأبي عبيدة. أحد السابقين الأولين إلى الإسلام أسلم على يد أبي بكر الصديق في الأيام الأولى للإسلام. هاجر إلى الحبشة في الهجرة الثانية. وقال عنه رسول الله صلى الله عليه وسلم: «إن لكل أمة أمينا وأمين هذه الأمة أبو عبيدة بن الجرّاح». يعد من أحد العشرة المبشرين بالجنة.<br />قاد غزوة الخبط عندما أرسله النبي محمد صلى الله عليه وسلم أميرا على ثلاثمائة وبضعة عشرة مقاتلا ومعهم قليل من الزاد وعندما نفد الزاد راحوا يتصيدون الخبط أي ورق الشجر فيسحقونه ويسفونه ويشربون عليه الماء لهذا سميت هذه الغزوة بغزوة الخبط. كما كان أحد القادة الأربعة الذين اختارهم أبو بكر لفتح الشام وهم: يزيد بن أبي سفيان وشرحبيل بن حسنة وعمرو بن العاص وأبو عبيدة بن الجراح. عينه عمر بن الخطاب قائدا عاما على جيوش الشام. لاقى أباه مع صف المشركين في بدر فنازله وقتله.<br />شارك في معركة اليرموك وقد أمره الخليفة عمر بن الخطاب على الجيش بدلا من خالد أبن الوليد ولكنه أخفى أمر الأمارة عن خالد إلى أن انتهى خالد من المعركة محرزا النصر ثم أعلمه بأمر عمر فسأله خالد: «يرحمك الله أباعبيدة، ما منعك أن تخبرني حين جاءك الكتاب؟» فأجاب أبوعبيدة: «إني كرهت أن أكسر عليك حربك، وما سلطان الدنيا نريد، ولا للدنيا نعمل ، كلنا في الله أخوة».<br />قال عنه عمر بن الخطاب وهو يجود بأنفاسه: «لو كان أبو عبيدة بن الجراح حيا لاستخلفته فإن سألني ربي عنه قلت: استخلفت أمين الله، وأمين رسوله». وقال عنه: «لو كنت متمنيا ما تمنيت إلا بيتا مملوءا برجال من أمثال أبي عبيدة».<br />من أشهر ما قال أبو عبيدة بن الجراح رضي الله عنه خطبته في أهل الشام وهو أميرهم:<br />يا أيها الناس إني مسلم من قريش وما منكم من أحد، أحمر، ولا أسود، يفضلني بتقوى إلا وددت أني في إهابه<br />لقبه النبي محمد صلى الله عليه وسلم بـ(أمين الأمة) في حديثه:"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

[[comments]]
order = 7
subject = "وماذا يكون حسن نصر الله شتام امهام المؤمنين في موسى ابن نصير فارس اهل السنة والجماعة"
author = "مش ممكن"
text = "أبوعبد الرحمن موسى بن نصير بن عبد الرحمن زيد اللخمي (640-716 م/19 هـ-97 هـ) نشأ في دمشق وولي غزو البحر لمعاوية بن أبي سفيان، فغزا قبرص، وبنى بها حصونًا، وخدم بني مروان ونبه شأنه، وولى لهم الأعمال، فكان على خراج البصرة في عهد الحجاج [1].<br />لما تولي الوليد بن عبد الملك الخلافة قام بعزل حسان بن النعمان واستعمل موسى بن نصير بدلا منه وكان ذلك في عام 89 هـ وكان أن قامت ثورة للبربر في بلاد المغرب طمعا في البلاد بعد مسير حسان عنها فوجه موسى ابنه عبد الله ليخمد تلك الثورات ففتح كل بلاد المغرب واستسلم آخر خارج عن الدولة وأذعن للمسلمين. قام موسى بن نصير بإخلاء ما تبقى من قواعد للبيزنطيين على شواطئ تونس وكانت جهود موسى هذه في إخماد ثورة البربر وطرد البيزنطيين هي المرحلة الأخيرة من مراحل فتح بلاد المغرب العربي. لم يكتف موسى بذلك بل أرسل أساطيله البحرية لغزو جزر الباليار البيزنطية الثلاث مايوركا ومينورقة وإيبيزا وأدخلها تحت حكم الدولة الأموية [2].<br />بعد أن عمل موسى على توطيد حكم المسلمين في بلاد المغرب العربي، بدأ يتطلع إلى فتح الأندلس التي كانت تحت حكم القوط الغربيين. قام موسى باستئذان الخليفة الوليد بن عبد الملك في غزوها فأشار له الوليد ألا يخاطر بالمسلمين وأن يختبرها بالسرايا قبل أن يفتحها. بعد أن قام موسى بإرسال السرايا واختبار طبيعة الجزيرة الأيبيرية قام بتجهيز جيش بقيادة البربري المسلم طارق بن زياد، وبمعاونة من يوليان حاكم سبتة دخل المسلمون الأندلس وانتصروا على القوط الغربيين انتصارا حاسما في معركة وادي لكة عام 712 م/92 هـ. مازال احفاد موسى بن نصير متواجدين ما بين مدينة الطائف في المملكة العربية السعودية و الأردن ومصر (1800مصرى) وتونس والمغرب محتفظين بشجرة العائلة (nossir)"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

[[comments]]
order = 8
subject = "وماذا يكون حسن نصر الله لعان صحابة رسول الله في عقبة ابن نافع فارس اهل السنة والجماعة"
author = "مش حيحصل"
text = "عقبة بن نافع بن عبد القيس الأموي الفهري هو من كبار القادة العرب والفاتحين في صدر الإسلام. ولد في حياة الرسول -صلى الله عليه وسلم- سنة 1 ق. هـ، ولا صحبة له، شهد مع عمرو بن العاص فتح مصر، ثم شارك معه في المعارك التي دارت في أفريقيا (تونس حاليا)، فولاه عمرو برقة بعد فتحها، فقاد منها حركة الفتح باتجاه الغرب، فظهرت مقدرته الحربية الفائقة وحنكته وشجاعته، وعلا شأنه.<br />وفي خلافة معاوية بن أبي سفيان ولاه أفريقية، وبعث إليه عشرة آلاف فارس، فأوغل بهم في بلاد المغرب حتى أتى وادياً يسمى القيروان فأعجب بموقعه، وبنى به مدينته المشهورة، كما بنى به جامعاً لا يزال حتى الآن يعرف باسم جامع عقبة، وفي سنة 55 هـ عزله معاوية من ولاية أفريقية، فعاد للمشرق.<br />بعد وفاة معاوية وفي خلافة ابنه يزيد أعاد عقبة مرة ثانية للولاية سنة 62 هـ، فولاه المغرب، فقصد عقبة القيروان، وخرج منها بجيش كثيف فتح حصوناً ومدنا حتى وصل ساحل المحيط الأطلنطي، وتمكن من طرد البيزنطيين من مناطق واسعة من ساحل أفريقيا الشمالي.<br />توفي عقبة في إحدى حروبه سنة 63 هـ في مكان يعرف حتى الآن باسم سيدي عقبة.بالجزائر ومن أحفاد عقبة المشهورين يوسف بن عبد الرحمن بن حبيب بن أبي عبيدة بن عقبة بن نافع الفهري القرشي أحد القادة الدهاة وعبد الرحمن بن حبيب بن أبي عبيدة مرة بن عقبة بن نافع الفهري أمه بربرية أمير من الشجعان الدهاة."
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

[[comments]]
order = 9
subject = "لا اختلاف"
author = "انا للة وانا الية راجعون"
text = "كل الذين كتبوا عن انتصارات الصحابة والسابقون فى الاسلام كانوا مسلمون ولم يكونوا سنة او شيعة انما تلك المسميات والبدع ظهرت بعد الاسلام السياسى والذين جلسوا على العرش والذين لم يجلسوا<br />ليس فى الاسلام شىء اسمة اهل السنة واهل الشيعة<br />كلنا مسلمون<br />وكلنا يعبد اللة الواحد الاحد<br />ويؤمن بمحمد نبيا<br />ولم ينزل فى القران ان احب عمر او ابوبكر او ابغض عليا<br />انما المسلم الحق هو من يحب الجميع<br />فهم السابقون السابقون اولئك هم المكرمون<br />انسوا تلك الخلافات<br />كلنا امام عدو يريد ان يقضى على الجميع<br />واعتصموا بحبل اللة جميعا ولا تفرقوا"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

[[comments]]
order = 10
subject = "الى واحد من الدهماء"
author = "ابومحسن"
text = "يا اخ واحد من الدهماء انا جبتلك بس خمس اسماء من الفاتحين الكبار لاني شفتك معجب جدا بحسن نصر الله<br />والفاتحين دول اهل سنه وجماعة لان الشيعة بيسبوهم ويشتموهم<br />المهم الموضوع انتهى واتشال من على الشاشة<br />ارجوك اقرأ عن الشيعة وابعد عنهم وقبحهم في عيون الناس<br />فهؤلاء يسبون ويلعنون اولا ازواج النبي امهام المؤمنين القانتات العظيمات رضي الله عنهم<br />ثانيا يسبون صحابة رسول الله ويلعنوهم وعلى رأسهم تتصور ابو بكر وعمر الذين حظوا بشرف مجاورة رسول الله صلى اله عليه وسلم في قبره يا بختهم<br />شوف حضرتك لما بتروح تعمل عمره وتزور قبر النبي بيبقى نفسك في اي وقت تجلس فيه في الروضة الشريفة علشان خاطر تكون جنب النبي لوقت معين<br />فما بالك ابو بكر وعمر الذين سكنوا بجوار النبي في قبره الى يوم القيامه<br />يا بختهم"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"
