order = 1
subject = "وتانى كلام امريكانى"
author = "واحد من الدهماء"
text = "الاسلام بنى على خمس شهادة ان لا الة الا اللة وان محمد رسول واقامة الصلاة وايتاء الزكاة وحج البيت وصوم رمضان<br />والمسلمين كلهم شيعة وسنة متفقين على الاصول ولكن هناك اختلاف فى الفروع<br />لا ترددوا كلام امريكا وتعملوا فرقة هذا شيعى واخر سنى وكل تلك التسميات التى يراد بنا بها الشر<br />كلنا نحب ال البيت ونصلى ونقول اللهم صلى على محمد وعلى ال محمد<br />وال محمد هم ال البيت ونحن السنة نجلهم ونحترمهم ونحبهم<br />اذن لا فرق<br />يكرهون الصحابة هذا لا يهم غيرهم<br />بعض الفرق عندهم ضالة لا يضر عسى ان يهديهم اللة<br />انما كونهم حاربوا اسرائيل وضربوها فهذا يرفع راسى كمسلم<br />يا نصر اللة يا حسن لك كل تحياتى واحترامى<br />فقد كنت اقف على الحدود مجندا احارب نفس العدو سنة 73<br />يا نصر اللة يا شيعى رفعت رؤسنا عاليا<br />واثبت لهم ان الجيوش مجرد ديكور يديرة بشوات<br />اما انت فمنظمة مقاتلة ومحترفة وذات عقيدة عالية<br />وهذة هى حروب الشعوب التى تقاتل وتصد وتصمد وتدافع عن الارض شبرا شبرا حتى اخر طلقة واخر راجل<br />يا نصر اللة تحياتى<br />واتمنى لو عندنا مثلك عشرة"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

[[comments]]
order = 2
subject = "رد على واحد من الدهماء"
author = "ابومحسن"
text = "فيه حاجه يا اخي اسمها فقه انكار المنكر<br />لما الشيعي يلعن ابو بكر وعمر صاحبي رسول الله صلى الله عليه وسلم والؤين كرمهم الله بالدفن بجواره صلوات الله وسلامه عليه<br />لما الشيعي يقول كذا وكذا على زوجتي رسول الله صلى الله عليه وسلم عائشة وحفصه<br />يبقى لازم تنكر هذا المنكر<br />وانتصارات الذن يؤذون رسول الله لا ترفع الرأس<br />تعليقك كله جهل في جهل<br />لو سمحت والله روح اقرأ"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

[[comments]]
order = 3
subject = "الذين يتبعون امثال مفتى البول واللازم منة"
author = "واحد من الدهماء"
text = "اولا انا لست عالم دين وفى الدين قلت اننى واحد من الدهماء رغم اننى احمل شهادات عليا فى تخصصات نادرة<br />ثانيا وعلى حسب علمى لم ينزل على محمد ولا فى رسالتة شىء اسمة سنى او شيعى او سلفى او حنبلى او غيرة<br />انما هو الاسلام ودين الاسلام فقط<br />انما المشكلة بدأت سياسية<br />من يجلس على كرسى الحكم ومن يحكم تلك الامبراطورية الاسلامية الواسعة<br />هل الخليفة الذى ينتخبة المسلمين ويبايعونة من النخبة المختارة ويكون من اهل الدين والتقوى ام يكون من اهل البيت ومن اولاد بنت النبى<br />وانقسم الناس سياسيا وليس دينيا كما يزعم البعض<br />بعضهم انضموا الى اولية ان يكون الحاكم الجالس على كرسى الحكم من اولاد النبى وال بيتة الكرام<br />والقسم الثانى قالوا لا اى واحد يحكم وجعلوها ملكية وراثية كما صنع معاوية وابنة يزيد<br />وانقسم الفريقان ودارت بينهم حروب وقتلى ليس بسبب خلاف فى الدين او فى الفقة او فى الشريعة وانما بسبب من يكون الحاكم<br />وكلا الطائفتين عند ربها الان يحكم بينهم بالعدل<br />اما نحن فلماذا نختلف ؟<br />لماذا يصنف بعضنا بعضا انة عدو<br />كلنا مسلمون ونوحد اللة والمسميات الكاذبة التى يعمقها امثالك من الطرفين لا معنى لها<br />واثناء قيامى باداء فريضة الحج رايت الاخوة الشيعة رجالا ونساء يؤدون مناسك الشعيرة مثل بقية المسلمين ولا خلاف اطلاقا<br />انما يعمق الخلاف الجهلة من الطرفين ومن كانوا يسبون ال البيت من على المنابر<br />الاسلام صافى ونقى<br />نختلف سياسيا ولكن بعيدا عن الدين وعن كرسى الحكم<br />ونصر اللة رجل مسلم اولا شيعى المذهب يحارب عدونا جميعا الا اذا كنت انت من جانب عدونا<br />وانتصر لانة رجل ذو عقيدة ومبدا<br />ومرة ثانية يا نصر اللة لك كل احترامى واكن لك كل احترام<br />فقد رفعت راسى عاليا وشعرت بالفخر والعزة<br />اما القاعدين الذين يفتون فى امور البول ولم يمسكوا بندقية القتال يوما ولم يناموا فى خنادق القتال كما فعلنا فى شبابنا فلهم رحمة اللة<br />مع تحياتى"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

[[comments]]
order = 4
subject = "الى واحد من الدهماء (ما عشرتوش تبقى ما تعرفوش)"
author = "ابومحسن غربة 25 سنه"
text = "يا اخ واحد من الدهماء فيه مثل مصري طويل اخر كلمتين فيه ما عشرتوش تبقى ما تعرفوش<br />انا يا اخي هنا في الخليج بقالي 25 سنه وعاشرنا الشيعة عن قرب وعرفنا كل خباياهم<br />اما انت بتشوف الشيعة في التلفزيون وبتسمع عنهم في الكتب<br />قبل ما اجي هنا كانت لسه الثورة الايرانية حديثة كنت معجب بالخميني جدا مثلك تمام ما انت بمعجب بحسن نصر الله<br />شوف انت ازاي من شدة اعجابك بحسن نصر الله وصفت اهل السنه بالبول ومش عارف ايه وهنا مكمن الخطورة وهنا يفسر غزو امريكا للعراق لتسليمها للشيعة وهنا يفسر الحملة الاعلامية بان حسن نصر الله انتصر مع ان العكس هو الصحيح وان لبنان تم تدميرا تماما<br />لازم تعرف ان الغرب الصليبي بيتلاعب بينا والاعلام زي ما صور جمال عبدالناصر انه بطل وطرد الانجليز صور حسن نصر الله انه بطل وبيصور احمد نجاد انه بطل ديمقراطي ايضا<br />لازم تعرف ان تشييع المنطقة هدف امريكا القادم نفسهم يشوفوا المسلمين بيلعنوا ابو بكر وعمر وزوجات النبي والصحابة رضوان الله عليهم الفاتحين<br />خلي بالك هو دا هدف امريكا القادم لا ريب فيه ولسه امريكا حتساعد الشيعة في انتصارات كتيرة قادمه<br />والكلام في هذا الموضوع طويل وكثير ولكن اريد ان اقول لك وانت معجب بانتصارات حسن نصر الله شوف انتصارات اهل السنه التاريخية انت مصري شوف عمر ابن العاص السني كيف فتح مصر شوف خالد ابن الوليد السني كيف فتح الشام وشوف اهل السنه في غزوة اليرموك والقادسية وشوف اهل السنه كيف فتحوا الاندلس<br />حاول ترجع اهل السنه الى ذلك ولا تلصق بيهم البول وفتاوي البول فاهل السنه هم الفاتحين العظماء ولولاهم ما كانت ايران اسلامية اصلا<br />ومع السلامه وربنا يكفين ويكفينا شر الشيعة الاثنى شيطانية"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145807/http://masr.20at.com:80/newArticle.php?sid=11082"

[[comments]]
order = 5
subject = "وماذا يكون حسن نصر الله شتام امهات المؤمنين في خالد بن الوليد فارس اهل السنه والجماعة"
author = "مش ضروري"
text = "خالد بن الوليد ( خ ، م ، د ، س ، ق ) ابن المغيرة بن عبد الله بن عمر بن مخزوم بن يقظة بن كعب. سيف الله تعالى ، وفارس الإسلام ، وليث المشاهد، السيد ، الإمام ، الأمير الكبير، قائد المجاهدين، أبو سليمان القرشي المخزومي المكي ، وابن أخت أم المؤمنين ميمونة بنت الحارث . هاجر مسلما في صفر سنة ثمان ، ثم سار غازيا ، فشهد غزوة مؤتة ، واستشهد أمراء رسول الله -صلى الله عليه وسلم- الثلاثة : مولاه زيد ، وابن عمه جعفر ذو الجناحين ، وابن رواحة ، وبقي الجيش بلا أمير ، فتأمر عليهم في الحال خالد ، وأخذ الراية ، وحمل على العدو ، فكان النصر . وسماه النبي -صلى الله عليه وسلم- سيف الله ، فقال : إن خالدا سيف سله الله على المشركين . وشهد الفتح وحنينا ، وتأمر في أيام النبي -صلى الله عليه وسلم- ، واحتبس أدراعه ولأمته في سبيل الله ، وحارب أهل الردة ، ومسيلمة ، وغزا العراق ، واستظهر ، ثم اخترق البرية السماوية بحيث إنه قطع المفازة من حد العراق إلى أول الشام في خمس ليال في عسكر معه ، وشهد حروب الشام ، ولم يبق في جسده قيد شبر إلا وعليه طابع الشهداء. ومناقبه غزيرة ، أمره الصديق على سائر أمراء الأجناد ، وحاصر دمشق فافتتحها هو وأبو عبيدة . عاش ستين سنة وقتل جماعة من الأبطال ، ومات على فراشه ، فلا قرَّت أعين الجبناء. توفي بحمص سنة إحدى وعشرين ومشهده على باب حمص عليه جلالة . حدث عنه ابن خالته عبد الله بن عباس ، وقيس بن أبي حازم ، والمقدام بن معدي كرب ، وجبير بن نفير ، وشقيق بن سلمة ، وآخرون . له أحاديث قليلة . مسلم : من طريق ابن شهاب ، عن أبي أمامة بن سهل أن ابن عباس أخبره أن خالد بن الوليد الذي كان يقال له : سيف الله أخبره أنه دخل على خالته ميمونة مع رسول الله -صلى الله عليه وسلم- ، فوجد عندها ضبا محنوذا قدمت به أختها حفيدة بنت الحارث من نجد ، فقدمته لرسول الله -صلى الله عليه وسلم- ، فرفع يده ، فقال خالد : أحرام هو يا رسول الله ؟ قال : لا ، ولكنه لم يكن بأرض قومي فأجدني أعافه. فاجتررته فأكلته ، ورسول الله -صلى الله عليه وسلم- ينظر ولم ينه . هشام بن حسان : عن حفصة بنت سيرين ، عن أبي العالية : أن خالد بن الوليد قال: يا رسول الله ، إن كائدا من الجن يكيدني ، قال : قل : أعوذ بكلمات الله التامات التي لا يجاوزهن بر ولا فاجر من شر ما ذرأ في الأرض ، وما يخرج منها ، ومن شر ما يعرج في السماء وما ينزل منها ، ومن شر كل طارق إلا طارقا يطرق بخير يا رحمن . ففعلت ، فأذهبه الله عني . وعن حيان بن أبي جبلة ، عن عمرو بن العاص ، قال : ما عدل بي رسول الله -صلى الله عليه وسلم- وبخالد أحدا في حربه منذ أسلمنا . يونس بن أبي إسحاق ، عن العيزار بن حريث أن خالد بن الوليد أتى على اللات والعزى فقال : يا عـز كفرانـك لا سبحانــك<br />إنـي رأيـت اللـه قد أهانــك وروى زكريا بن أبي زائدة ، عن أبي إسحاق ، عن أبي عبد الرحمن السلمي أن خالدا قال مثله . قال قتادة : مشى خالد إلى العزى ، فكسر أنفها بالفأس . وروى سفيان بن حسين ، عن قتادة أن النبي -صلى الله عليه وسلم- بعث خالدا إلى العزى ، وكانت لهوازن ، وسدنتها بنو سليم ، فقال : انطلق ، فإنه يخرج عليك امرأة شديدة السواد ، لويلة الشعر ، عظيمة الثديين ، قصيرة . فقالوا يحرضونها : يـا عـز شـدي شـدة لا سـواكها<br />علـى خـالد ألقي الخمار وشمــري فإنك إن لا تقتلي المرء خالــــدا<br />تبــوئي بــذنب عـاجل وتقصـري فشد عليها خالد ، فقتلها ، وقال : ذهبت العزى فلا عزى بعد اليوم . الزهري : عن عبد الرحمن بن أزهر : رأيت رسول الله -صلى الله عليه وسلم- يوم حنين يتخلل الناس ، يسأل عن رحل خالد ، فدُلَّ عليه ، فنظر إلى جرحه ، وحسبت أنه نفث فيه . وقال ابن عمر : بعث النبي -صلى الله عليه وسلم- خالدا إلى بني جذيمة ، فقتل وأسر ، فرفع النبي -صلى الله عليه وسلم- يديه وقال : اللهم إني أبرأ إليك مما صنع خالد. مرتين . الواقدي : عن رجل ، عن إياس بن سلمة عن أبيه قال : لما قدم خالد بعد صنيعه ببني جذيمة ، عاب عليه ابن عوف ما صنع ، وقال : أخذت بأمر الجاهلية ، قتلتهم بعمك الفاكه ، قاتلك الله . قال : وأعابه عمر ، فقال خالد : أخذتهم بقتل أبيك ، فقال عبد الرحمن : كذبت ، لقد قتلت قاتل أبي بيدي ، ولو لم أقتله ، لكنت تقتل قوما مسلمين بأبي في الجاهلية ، قال : ومن أخبرك أنهم أسلموا ؟ فقال : أهل السرية كلهم . قال : جاءني رسول الله -صلى الله عليه وسلم- أن أغير عليهم ، فأغرت ، قال : كذبت على رسول الله ، وأعرض رسول الله -صلى الله عليه وسلم- عن خالد وغضب وقال : \"يا خالد ، ذروا لي أصحابي متى ينكأ إلف المرء يُنْكأ المرء\" . الواقدي : حدثنا يحيى بن عبد الله بن أبي قتادة ، عن أهله ، عن أبي قتادة قال : لما نادى خالد في السحر : من كان معه أسير فليُدافِّه ، أرسلت أسيري ، وقلت لخالد : اتق الله ، فإنك ميت ، وإن هؤلاء قوم مسلمون . قال : إنه لا علم لك بهؤلاء . إسناده فيه الواقدي ، ولخالد اجتهاده ، ولذلك ما طالبه النبي -صلى الله عليه وسلم- بدياتهم. الواقدي : حدثنا يوسف بن يعقوب بن عتبة ، عن عثمان الأخنسي ، عن عبد الملك بن أبي بكر ، قال : بعث النبي -صلى الله عليه وسلم- خالدا إلى الحارث بن كعب أميرا وداعيا ، وخرج مع رسول الله -صلى الله عليه وسلم- في حجة الوداع ، فلما حلق رأسه ، أعطاه ناصيته ، فعملت في مقدمة قلنسوة خالد ، فكان لا يلقى عدوا إلا هزمه . وأخبرني من غسله بحمص ، ونظر إلى ما تحت ثيابه، قال : ما فيه مُصحّ ما بين ضربة بسيف ، أو طعنة برمح ، أو رمية بسهم . الوليد بن مسلم : حدثنا وحشي بن حرب ، عن أبيه ، عن جده وحشي : أن أبا بكر عقد لخالد على قتال أهل الردة وقال : إني سمعت رسول الله -صلى الله عليه وسلم- يقول : خالد بن الوليد سيف من سيوف الله سله الله على الكفار والمنافقين . رواه أحمد في \"مسنده\" . هشام بن عروة : عن أبيه قال : كان في بني سليم ردة ، فبعث أبو بكر إليهم خالد بن الوليد فجمع رجالا منهم في الحظائر ، ثم أحرقهم ، فقال عمر لأبي بكر : أتدع رجلا يعذب بعذاب الله ؟ قال : والله لا أشيم سيفا سله الله على عدوه . ثم أمره ، فمضى إلى مسيلمة . ضمرة بن ربيعة : أخبرني السَّيباني عن أبي العجماء ، وإنما هو أبو العجفاء السلمي ، قال : قيل لعمر : لو عهدت يا أمير المؤمنين ، قال : لو أدركت أبا عبيدة ثم وليته ثم قدمت على ربي ، فقال لي : لم استخلفته ؟ لقلت : سمعت عبدك وخليلك يقول : لكل أمة أمين ، وإن أمين هذه الأمة أبو عبيدة. ولو أدركت خالد بن الوليد ثم وليته فقدمت على ربي لقلت : سمعت عبدك وخليلك يقول : خالد سيف من سيوف الله سله الله على المشركين . رواه الشاشي في \"مسنده\" . أحمد في \"المسند\" : حدثنا حسين الجعفي ، عن زائدة ، عن عبد الملك بن عمير ، قال : استعمل عمر أبا عبيدة على الشام وعزل خالدا ، فقال أبو عبيدة : سمعت رسول الله -صلى الله عليه وسلم- يقول : خالد سيف من سيوف الله ، نعم فتى العشيرة . حميد بن هلال : عن أنس : نعى النبي -صلى الله عليه وسلم- أمراء يوم مؤتة فقال : أصيبوا جميعا ثم أخذ الراية بعد سيف من سيوف الله خالد . وجعل يحدث الناس وعيناه تذرفان . إسماعيل بن أبي خالد : عن قيس ، قال رسول الله -صلى الله عليه وسلم- : إنما خالد سيف من سيوف الله صبه على الكفار . أبو إسماعيل المؤدب : عن إسماعيل بن أبي خالد ، عن الشعبي ، عن ابن أبي أوفى ، مرفوعا بمعناه . وجاء من طرق عن أبي هريرة نحوه . أبو المسكين الطائي : حدثنا عمران بن زحر ، حدثني حميد بن منيب قال : قال جدي أوس ، لم يكن أحد أعدى للعرب من هرمز ، فلما فرغنا من مسيلمة أتينا ناحية البصرة ، فلقينا هرمز بكاظمة ، فبارزه خالد فقتله ، فنفله الصديق سلبه ، فبلغت قلنسوته مائة ألف درهم ، وكانت الفرس من عظم فيهم ، جعلت قلنسوته بمائة ألف . قال أبو وائل : كتب خالد إلى الفرس : إن معي جندا يحبون القتل كما تحب فارس الخمر . هشيم : حدثنا عبد الحميد بن جعفر ، عن أبيه ، أن خالد بن الوليد فقد قلنسوة له يوم اليرموك ، فقال : اطلبوها . فلم يجدوها ، ثم وجدت فإذا هي قلنسوة خلقة ، فقال خالد : اعتمر رسول الله -صلى الله عليه وسلم- ، فحلق رأسه ، فابتدر الناس شعره ، فسبقتهم إلى ناصيته ، فجعلتها في هذه القلنسوة ، فلم أشهد قتالا وهي معي إلا رزقت النصر . ابن وهب : عن عبد الرحمن بن أبي الزناد ، عن عبد الرحمن بن الحارث : أخبرني الثقة أن الناس يوم حلق رسول الله -صلى الله عليه وسلم- ابتدروا شعره ، فبدرهم خالد إلى ناصيته ، فجعلها في قلنسوته . ابن أبي خالد : عن قيس ، سمعت خالدا يقول : لقد رأيتني يوم مؤتة اندق في يدي تسعة أسياف ، فصبرت في يدي صفيحة يمانية . ابن عيينة : عن ابن أبي خالد ، عن مولى لآل خالد بن الوليد ، أن خالدا قال : ما من ليلة يهدى إلي فيها عروس أنا لها محب أحب إلي من ليلة شديدة البرد ، كثيرة الجليد في سرية أصبح فيها العدو . يونس بن أبي إسحاق : عن العيزار بن حريث قال : قال خالد : ما أدري من أي يومي أفر : يوم أراد الله أن يهدي لي فيه شهادة ، أو يوم أراد الله أن يهدي لي فيه كرامة . قال قيس بن أبي حازم : سمعت خالدا يقول : منعني الجهاد كثيرا من القراءة ورأيته أُتي بِسُم ، فقالوا : ما هذا ؟ قالوا : سم . قال : باسم الله . وشربه . قلت : هذه والله الكرامة ، وهذه الشجاعة . يونس بن أبي إسحاق : عن أبي السفر قال : نزل خالد بن الوليد الحيرة على أم بني المرازبة ، فقالوا : احذر السم لا تسقك الأعاجم ، فقال : ائتوني به ، فأتي به ، فاقتحمه وقال : باسم الله ، فلم يضره . أبو بكر بن عياش : عن الأعمش ، عن خيثمة ، قال أتي خالد بن الوليد برجل معه زق خمر ، فقال : اللهم اجعله عسلا ، فصار عسلا . رواه يحيى بن آدم ، عن أبي بكر ، وقال : خلا بدل العسل ، وهذا أشبه ، ويرويه عطاء بن السائب عن محارب بن دثار مرسلا . ابن أبي خالد : عن قيس ، قال : طلق خالد بن الوليد امرأة ، فكلموه ، فقال : لم يُصبها عندي مصيبة ، ولا بلاء ، ولا مرض ؛ فرابني ذلك منها . المدائني ; عن ابن أبي ذئب ، عن الزهري ، عن سالم ، عن أبيه ، قال : قدم أبو قتادة على أبي بكر ، فأخبره بقتل مالك بن نويرة وأصحابه . فجزع ، وكتب إلى خالد ، فقدم عليه ، فقال أبوبكر : هل تزيدون على أن يكون تأول ، فأخطأ ؟ ثم رده ، وودى مالكا ، ورد السبي والمال . وعن ابن إسحاق قال : دخل خالد على أبي بكر ، فأخبره واعتذر ، فعذره . قال سيف في \"الردة\" : عن هشام بن عروة ، عن أبيه قال : شهد قوم من السرية أنهم أذنوا وأقاموا وصلوا ، ففعلوا مثل ذلك ، وشهد آخرون بنفي ذلك ، فقتلوا . وقدم أخوه متمم بن نويرة ينشد الصديق دمه ، ويطلب السبي ، فكتب إليه برد السبي ، وألح عليه عمر في أن يعزل خالدا ، وقال : إن في سيفه رهقا . فقال : لا يا عمر ، لم أكن لأشيم سيفا سله الله على الكافرين . سيف : عن ابن إسحاق ، عن محمد بن جعفر بن الزبير وغيره أن خالدا بث السرايا ، فأتي بمالك ، فاختلف قول الناس فيهم وفي إسلامهم ، وجاءت أم تميم كاشفة وجهها ، فأكبت على مالك -وكانت أجمل الناس- فقال لها : إليك عني ؛ فقد والله قتلتني . فأمر بهم خالد ، فضربت أعناقهم . فقام أبو قتادة ، فناشده فيهم ، فلم يلتفت إليه ، فركب أبو قتادة فرسه ، ولحق بأبي بكر وحلف : لا أسير في جيش وهو تحت لواء خالد . وقال : ترك قولي ، وأخذ بشهادة الأعراب الذين فتنتهم الغنائم . ابن سعد : أنبأنا محمد بن عمر ، حدثني عتبة بن جبيرة ، عن عاصم بن عمر بن قتادة . قال : وحدثني محمد بن عبد الله ، عن الزهري ، وحدثنا أسامة بن زيد عن الزهري ، عن حنظلة بن علي الأسلمي في حديث الردة : فأوقع بهم خالد ، وقتل مالكا ، ثم أوقع بأهل بزاخة وحرقهم ، لكونه بلغه عنهم مقالة سيئة ، شتموا النبي -صلى الله عليه وسلم- ، ومضى إلى اليمامة ، فقتل مسيلمة ، إلى أن قال : وقدم خالد المدينة بالسبي ومعه سبعة عشر من وفد بني حنيفة ، فدخل المسجد وعليه قباء عليه صدأ الحديد ، متقلدا السيف ، في عمامته أسهم . فمر بعمر ، فلم يكلمه ، ودخل على أبي بكر ، فرأى منه كل ما يحب ، وعلم عمر ، فأمسك . وإنما وجد عمر عليه لقتله مالك بن نويرة ، وتزوج بامرأته . جويرية بن أسماء : قال : كان خالد بن الوليد من أمد الناس بصرا ، فرأى راكبا وإذا هو قد قدم بموت الصديق وبعزل خالد . قال ابن عون : ولي عمر ، فقال : لأنزعن خالدا حتى يعلم أن الله إنما ينصر دينه ، يعني بغير خالد . وقال هشام بن عروة عن أبيه ، قال : لما استخلف عمر ، كتب إلى أبي عبيدة : إني قد استعملتك ، وعزلت خالدا . وقال خليفة : ولي عمر أبا عبيدة على الشام ، فاستعمل يزيد على فلسطين ، وشرحبيل بن حسنة على الأردن ، وخالد بن الوليد على دمشق ، وحبيبب بن مسلمة على حمص . الزبير بن بكار : حدثني محمد بن مسلمة ، عن مالك ، قال : قال عمر لأبي بكر : اكتب إلى خالد : ألا يعطي شاة ولا بعيرا إلا بأمرك . فكتب أبو بكر بذلك ، قال : فكتب إليه خالد : إما أن تدعني وعملي ، وإلا فشأنك بعملك . فأشار عمر بعزله ، فقال : ومن يجزئ عنه ؟ قال عمر : أنا ، قال : فأنت . قال مالك : قال زيد بن أسلم : فتجهز عمر حتى أنيخت الظهر في الدار ، وحضر الخروج ، فمشى جماعة إلى أبي بكر ، فقالوا : ما شأنك تخرج عمر من المدينة وأنت إليه محتاج ، وعزلت خالدا وقد كفاك ؟ قال : فما أصنع ؟ قالوا : تعزم على عمر ليجلس ، وتكتب إلى خالد ، فيقيم على عمله ، ففعل . هشام بن سعد : عن زيد بن أسلم ، عن أبيه ، قال عمر لأبي بكر : تدع خالدا بالشام ينفق مال الله ؟ قال فلما توفي أبو بكر ، قال أسلم : سمعت عمر يقول : كذبت الله إن كنت أمرت أبا بكر بشيء لا أفعله ، فكتب إلى خالد . فكتب خالد إليه : لا حاجة لي بعملك . فولى أبا عبيدة . الحارث بن يزيد : عن علي بن رباح ، عن ناشرة اليزني : سمعت عمر بالجابية ، واعتذر من عزل خالد ، قال : وأمرت أبا عبيدة . فقال أبو عمرو بن حفص بن المغيرة والله ما أعذرت ، نزعت عاملا استعمله رسول الله -صلى الله عليه وسلم- ، ووضعت لواء رفعه رسول الله -صلى الله عليه وسلم- ، قال : إنك قريب القرابة ، حديث السن ، مغضب في ابن عمك . ومن كتاب سيف عن رجاله قال : كان عمر لا يخفى عليه شيء من عمله ، وإن خالدا أجاز الأشعث بعشرة آلاف ، فدعا البريد ، وكتب إلى أبي عبيدة أن تقيم خالدا وتعقله بعمامته ، وتنزع قلنسوته حتى يعلمكم من أين أجاز الأشعث ؟ أمن مال الله أم من ماله ؟ فإن زعم أنه من إصابة أصابها ، فقد أقر بخيانة ، وإن زعم أنها من ماله ، فقد أسرف ، واعزله على كل حال ، واضمم إليك عمله . ففعل ذلك . فقدم خالد على عمر فشكاه وقال : لقد شكوتك إلى المسلمين ، وبالله يا عمر إنك في أمري غير مجمل . فقال عمر : من أين هذا الثراء ؟ قال : من الأنفال والسهمان ، ما زاد على الستين ألفا فلك تقوِّم عروضه . قال : فخرجت عليه عشرون ألفا ، فأدخلها بيت المال ، ثم قال : يا خالد ، والله إنك لكريم علي وإنك لحبيب إليّ ، ولن تعاتبني بعد اليوم على شي . وعن زيد بن أسلم عن أبيه : عزل عمر خالدا فلم يعلمه أبو عبيدة حتى علم من الغير . فقال : يرحمك الله ؛ ما دعاك إلى أن لا تعلمني ؟ قال : كرهت أن أروعك . جويرية بن أسماء : عن نافع قال : قدم خالد من الشام وفي عمامته أسهم ملطخة بالدم ، فنهاه عمر . الأصمعي : عن ابن عون ، عن ابن سيرين ، أن خالد بن الوليد دخل وعليه قميص حرير ، فقال عمر : ما هذا ؟ قال : وما بأسه ؟ قد لبسه ابن عوف . قال : وأنت مثله ؟ ! عزمت على من في البيت إلا أخذ كل واحد منه قطعة ، فمزقوه . روى عاصم بن بهدلة : عن أبي وائل أظن قال : لما حضرت خالدا الوفاة ، قال : لقد طلبت القتل مظانَّهُ فلم يُقَدَّر لي إلا أن أموت على فراشي ، وما من عملي شيء أرجى عندي -بعد التوحيد- من ليلة بتُّها وأنا متترس ، والسماء تهلني ننتظر الصبح حتى نغير على الكفار . ثم قال : إذا مت ، فانظروا إلى سلاحي وفرسي ، فاجعلوه عدة في سبيل الله . فلما توفي ، خرج عمر على جنازته ، فذكر قوله : ما على آل الوليد أن يسفحن على خالد من دموعهن ما لم يكن نقعا أو لقلقة . النقع : التراب على الرءوس ، واللقلقة : الصراخ . ويروى بإسناد ساقط أن عمر خرج في جنازة خالد بالمدينة وإذا أمه تندبه وتقول : أنـت خـير من ألف ألفٍ من القوم<br />إذا مــا كُبَّتْ وجوه الرجـــال فقال عمر : صدقت إن كان لكذلك . الواقدي : حدثنا عمرو بن عبد الله بن عنبسة ، سمعت محمد بن عبد الله الديباج يقول : لم يزل خالد مع أبي عبيدة حتى توفي أبو عبيدة ، واستخلف عياض بن غنم . فلم يزل خالد مع عياض حتى مات ، فانعزل خالد إلى حمص ، فكان ثمَّ ، وحَبَّس خيلا وسلاحا ، فلم يزل مرابطا بحمص حتى نزل به ، فعاده أبو الدرداء ، فذكر له أن خيله التي حبست بالثغر تعلف من مالي ، وداري بالمدينة صدقة ، وقد كنت أشهدت عليها عمر . والله يا أبا الدرداء لئن مات عمر ، لترين أمورا تنكرها . وروى إسحاق بن يحيى بن طلحة ، عن عمه موسى قال : خرجت مع أبي طلحة إلى مكة مع عمر ، فبينا نحن نحط عن رواحلنا إذ أتى الخبر بوفاة خالد ، فصاح عمر : يا أبا محمد ، يا طلحة هلك أبو سليمان ، هلك خالد بن الوليد . فقال طلحة : لا أعرفنك بعد الموت تندبني<br />وفـي حيـاتي ما زودتني زادا وعن أبي الزناد : أن خالد بن الوليد لما احتضر بكى وقال : لقيت كذا وكذا زحفا ، وما في جسدي شبر إلا وفيه ضربة بسيف ، أو رمية بسهم ، وها أنا أموت على فراشي حتف أنفي كما يموت العير فلا نامت أعين الجبناء . قال مصعب بن عبد الله : لم يزل خالد بالشام حتى عزله عمر . وهلك بالشام ، وولي عمر وصيته . وقال ابن أبي الزناد : مات بحمص سنة إحدى وعشرين وكان قدم قبل ذلك معتمرا ورجع . الواقدي : حدثنا عمر بن عبد الله بن رياح ، عن خالد بن رياح ، سمع ثعلبة ابن أبي مالك يقول : رأيت عمر بقباء ، وإذا حجاج من الشام ، قال : من القوم ؟ قالوا : من اليمن ممن نزل حمص ، ويوم رحلنا منها مات خالد بن الوليد . فاسترجع عمر مرارا ، ونكس ، وأكثر الترحم عليه ، وقال : كان -والله- سدادا لنحر العدو ، ميمون النقيبة . فقال له علي : فلم عزلته ؟ قال : عزلته لبذله المال لأهل الشرف وذوي اللسان ، قال : فكنت عزلته عن المال ، وتتركه على الجند ، قال : لم يكن ليرضى ، قال : فهلا بلوته ؟ . وروى جويرية ، عن نافع ، قال : لما مات خالد لم يدع إلا فرسه وسلاحه وغلامه ، فقال عمر : رحم الله أبا سليمان ، كان على ما ظنناه به . الأعمش : عن أبي وائل قال : اجتمع نسوة بني المغيرة في دار خالد يبكينه ، فقال عمر : ما عليهن أن يُرِقْنَ من دموعهن ما لم يكن نقعا أو لقلقة . قال محمد بن عبد الله بن نمير ، وإبراهيم بن المنذر ، وأبو عبيد : مات خالد بحمص سنة إحدى وعشرين . وقال دحيم : مات بالمدينة . قلت : الصحيح موته بحمص ، وله مشهد يزار . وله في \"الصحيحين\" حديثان ، وفي مسند بقي واحد وسبعون .<br />من ويكيبيديا، الموسوعة الحرة"
