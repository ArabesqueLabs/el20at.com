text = "عشرينات بتلمع رغداء بندق<br />وبعد شوية تبقى كاتبه مشهوره ولا مذيعة مرموقه<br />طيب ما فيه الف مليون مدونة وفيها كلام اهم من العك دا<br />ليه عشرينات ما بتنشرش<br />نرفع الامر للسيد مدير عشرينات للتحقيق<br />ها ها ها ها ها ها"
