[[comments]]
order = 0
subject = "ياما"
author = "عطعط"
text = "السلام عليكم يالا الهول انا علقت علي الموضوع عشان صحبه طيب ومحدش علق غيري يلا كلمني"
archived = "2007-08-23"
capture_url = "https://web.archive.org/web/20070823062132/http://masr.20at.com:80/newArticle.php?sid=11124"

[[comments]]
order = 1
subject = "//////"
author = "؟؟؟؟؟"
text = "الموضوع حلو بس مين الظريف اللي بيقول ان صاحبه طيب ده و انت ايه اللي عرفك بطاوا استظراف على الصبح و بطلوا استهتار ، معلش خرجنا بره الموضوع ، أصل الموضوع كان محتاج رأي لعلماء النفس أكتلر من كده"
archived = "2007-08-23"
capture_url = "https://web.archive.org/web/20070823062132/http://masr.20at.com:80/newArticle.php?sid=11124"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "الموضوع حلو جدا ، بس مش عارفة مين الظريف اللي ده المفروض ان التعليقات معمولة عشان الواحد يقول حاجة مفيدة"
archived = "2007-08-23"
capture_url = "https://web.archive.org/web/20070823062132/http://masr.20at.com:80/newArticle.php?sid=11124"

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
text = "الموضوع حلو أوي و خلاني أحس بالتخلف بتاعنا بتاع زمان"
archived = "2007-08-23"
capture_url = "https://web.archive.org/web/20070823062132/http://masr.20at.com:80/newArticle.php?sid=11124"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
text = "الموضوع أثار عندي ذكريات لذيذة وجدد أفكاري في محاولتي لفهم مخاوفي الآن التي تطورت من الخوف من الصرصار إلى الخوف من الاحتباس الحراري .. الحروب .. الارهاب .. نفص المياه ......... مش عالم الصغار أرحم بذمتكم"
archived = "2007-08-23"
capture_url = "https://web.archive.org/web/20070823062132/http://masr.20at.com:80/newArticle.php?sid=11124"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
text = "الموضوع عاجبني و كل حاجة ، بس أكتر حاجة عاجباني رأي علماء النفس و صورة الطفل و إن الموضوع فيه أراء ناس كتير و ده حاجة عجباني أوى في الموضوع ده ."
archived = "2007-08-23"
