order = 0
subject = "صدق رسول اللة"
author = "مصرى"
posted = "2009-01-05"
text = "قال رسول اللة صلى اللة علية وسلم<br />ترى المؤمنون فى توادهم وتراحمهم كمثل الجسد الواحد اذا اشتكى منة عضو تداعى لة سائر الاعضاء بالسهر والحمى<br />صدقت يا رسول اللة<br />غزة هاشم تشتكى<br />فالمسلمون من المغرب الى الصين الى استراليا انتابتهم الحمى والسهر<br />صدقت يا رسول اللة<br />كل اجسام المسلمين تسهر وهى تشعر بالغضب والحمى<br />صدقت يا رسول اللة<br />من لا يهتم بامر المسلمين فليس منهم"
