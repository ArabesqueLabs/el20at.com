[[comments]]
order = 1
subject = "غزة على طريق النصر - والضحايا شهداء عند ربهم يرزقو"
author = "شحبور"
posted = "2009-01-06"
text = "ستنتصر غزة<br />وستنهزم اسرائيل<br />وستكون بداية النهاية لانحدار دولة اسرائيل والنهاية المحتومة كما حدث للتتار والامارات الصليبية فى فلسطين سابقا<br />التاريخ يعيد نفسة<br />الخوف لم يعد لة مكان فى قلب الشباب الفلسطينى<br />رغم قلة السلاح وضعفة والحصار - سينتصر الشباب الغزاوى البطل وسيوقف عجلة الحرب الاسرائيلية<br />لا تخافوا من كثرة الضحايا<br />فبعض الشعوب تفقد فى غرق عبارة او احتراق قطار اضعاف عدد هؤلاء الشهداء<br />النصر للاسلام<br />النصر لغزة<br />والخسة والعار للجبناء عملاء اسرائيل"
archived = "2010-03-14"
capture_url = ""
