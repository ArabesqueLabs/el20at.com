posted = "2008-11-13"
text = "من المؤكد ان هذه الاذاعه اللتي احتلت المرتبه الاولى بين الاذاعات الاردنيه والعربيه لانها الاولى من نوعها اللتي جعلت المسؤول اقرب الى المواطن وهمومه ومشاكله كما تمكنت هذه الاذاعه من جعل كل فرد اردني ضابطا لنفسه فكل مواطن يساعد الشرطه على عملها فهو انان مثالي نشيط يستحق الشكر والثناء ونتمنى لهذه الاذاعه المزيد من التقدم النجاح تحت ظل صاحب الجلاله الهاشميه"
