[[comments]]
order = 2
subject = "الموضوع جامد جدا"
author = "محمد سعد"
posted = "2008-10-26"
text = "أغرس بذور الخير في طريقك<br />كن مقتنعاً تماما بأن من يفعل خير في هذا العالم سيعود إليه مرة أخرى بعد بعض الوقت واحرص على الاستقامة في عملك؛ لأنك لن تستطيع أن تستشعر النجاح الحقيقي إذا توصلت إلى هذا النجاح بطرق ملتوية، على العكس فإذا حافظت على استقامتك تستطيع أن تحقق النجاح الذي تريده وأن تجني أموالا أكثر على المدى البعيد.<br />الموضوع جامد جدا جزاكي الله خيرا يا أستاذة رشا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "جميل الموضوع"
author = "عبد العظيم"
posted = "2008-10-28"
text = "ربنا يكرمك الموضوع بجد جامع وجميل لكل من يريد البدء فى مشروع<br />ولكن مشكله بتوجهنى وهى انى ادامى كذا مشروع ومش عارف اختار<br />بينهم وزى منتى قلتى عدم وجود خبره تحير اكتر<br />انا المفروض اختار فى حدود ثلاث ايام<br />هو ممكن اعمل بالمجالين ولا"
archived = "2010-03-14"
capture_url = ""

