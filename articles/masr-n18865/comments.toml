subject = "ضع عنوان التعليق"
author = "واحدة اتخنقت من الحكاية دى"
posted = "2008-12-17"
text = "انا لسه مشتكية لواحد من الامن من كام يوم<br />لان الساعة والله كانت 6 مساءا والعربية مليانة رجال<br />وبصراحة الراجل كان محترم فعلا<br />قاللى احنا كل شوية نعمل حملة لكن مافيش فايدة<br />وبالعقل كده مهما عملوا حملات هينزلوا مين ولا مين<br />ده كل قطر فيه نفس المشكلة، خلاص ما بقاش فيه نخوة أصلا<br />ومن حوالى اسبوعين شفت حملة<br />كان برضو الرجال في عربيتنا ففوجئنا في محطة انور السادات بحوالى 10 من بتوع الامن<br />اول ما الباب اتفتح نزلوا كل الرجال وواضح انهم عملوا لهم غرامات<br />ما تتصوروش دى فرحتي بجد<br />شوفوا الناس لو ما عندهاش ضمير وحياء ... ودم ... البلد دى مستحيل تتصلح"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218144210/http://masr.20at.com:80/newArticle.php?sid=18865"
