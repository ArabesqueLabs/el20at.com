subject = "اقيموا الافراح والليالى الملاح فقد عقدنا مؤتمر داف"
author = "مصرى"
posted = "2008-05-18"
text = "نقل التلفزيون خطاب الحاج بوش طيب اللة ثراة فى مؤتمر دافوس وشفت الحاضرين والحاضرات - مجموعة من الارزقية جايين يعملوا شوبنج او تسويق لمنتجاتهم<br />طيب قاعدين فى الشرم فى الفنادق واكل وشرب على حساب المعلم<br />احنا عندنا اية نسوقة او نبيعة فى دافوس<br />مفيش حاجة<br />الملايين اللى صرفناها على الحاضرين فى دافوس كنا نشترى بها قمح ودقيق وخبز للغلابة<br />الشيخ خليفة بن زايد بارك اللة فية تبرع للشعب الفقير المسكين بمليون طن من القمح<br />طبعا الحكومة هتاخد المليون طن قمح وهتبيعة للشعب بفلوس<br />زى المنشار لازم تاكل على حساب الشعب<br />نحن الفقراء نشكر الشيخ خليفة على شهامتة وكرمة العربى وتبرعة لشعب مصر بمليون طن قمح<br />ولعن اللة الحاضرين فى الشرم بتوع دافوس الموكوس"
