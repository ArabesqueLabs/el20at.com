posted = "2010-02-18"
text = "خلاص تمام اوى كدا مدام الستات فيهم كل المميزات دى و احسن من الرجالة يبقى بقى يعيشوا لوحدهم على جنب بعيد عننا :lol: انا عايز اقول ان العملية مش سباق ما بين الراجل و الست على مين الاحسن لكن انا بحب أكتر انى اقول ان الاتنين بيكملوا بعض يعنى ممكن بعض المميزات دى ظهرت عند بعض الستات علشان كان فيه رجالة واقفين جنبهم و بردو فيه مميزات فى الرجالة مش عايزين ننكرها و بردو بقول المميزات دى اللى ابرزها فى الرجالة ان كان فيه ستات واقفين جنبهم يعنى بجد من الاخر مفيش طرف يقدر يستغنى او يعيش من غير التانى مهما انكرنا ذلك"
