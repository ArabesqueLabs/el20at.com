[[comments]]
order = 7
subject = "مثل بشع"
author = "مظلوم"
posted = "2008-06-24"
text = "الموقع هايل وضحكنى جدا بس خايف الافتكاسات زى مثل الحشاشين كده تدخل على الامثال اللى بجد واللى فعلا بتشكل جزء من تراثنا وبنتميز بيه وها أقولكو على مثل بشع<br />المثل البشع ده سمعته من واحد غنى جدا وكمان مش تعبان فى فلوسه دا وارثها<br />إن قابلك الاعمى كل عشاه مش هتبقى أحن عليه من ربه اللى عماه"
archived = "2010-03-14"
capture_url = ""

