subject = "تعليق على الفيس بوك"
author = "يمنى"
posted = "2008-06-16"
text = "الموضوع حلو جدا وفيه معلومات كويسه و امثال شعبيه جميله وياريت البنات وكل اللى يدخل على الفيس بوك يعمل حسابه بيكلم مين زى عاداتنا الشرقيه وشكرا"
