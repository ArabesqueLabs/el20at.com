[[comments]]
order = 5
subject = "الحمدلله"
author = "ابـن نــاصر"
text = "الحمدلله أنا ناشط علي الفايس بوك لكن مادخلتش في الجروب ده عشان ممكن تبقي حرب أهلية لو دخلت لاني مع الطبقين وحش قوي قوي<br />تحياتي<br />ابن ناصر<br />http://ibnasser.blogspot.com<br />ibn-nasser@hotmail.com"
archived = "2007-12-23"
