[[comments]]
order = 0
subject = "موضوع جميل"
author = "ahmad hamdy"
posted = "2007-11-08"
text = "ازايك يا ست الريسه<br />موضوع حلو وقعدت اقراه كله وعجبنى<br />بس موضوع الفيس بوك ده غريب خالص والعايشين فيه كتير اوى وبيزيدوا بشكل فظيع<br />انا مش عارف تفاصيله الصراحة ومالقتش وقت استكشف الدنيا دى عامله ازاي بس احساسى ان فيه سلبيات كتير اوى<br />مش عارف<br />المهم انا والله داخل اسلم واقوليك تسلم ايديك ودايما متميزة<br />تحياتي"
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110082441/http://masr.20at.com:80/newArticle.php?sid=12341"

[[comments]]
order = 1
subject = "شككككرا"
author = "شيرين"
posted = "2007-11-08"
text = "والله يا أحمد الموقع منور.. شكرا قوي على تعليقك، وعلى انك مش ناسينا.. أما بقى بالنسبة لعالم الفيس بووك فبجد عالم تاااااني.. بس هو في النهاية يصدق عليه ما يصدق على النت كله، يعني فيه الكويس والوحش<br />ربنا يكرمك يا رب، وشكرا تاني على تشريفك."
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110082441/http://masr.20at.com:80/newArticle.php?sid=12341"

