subject = "رائع"
author = "ولاء الشملول"
text = "الموضوع حلو جداً يا شيري<br />الله ينور يا باشا"
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110082441/http://masr.20at.com:80/newArticle.php?sid=12341"

