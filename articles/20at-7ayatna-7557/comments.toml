text = "هي تونس والحريه الي فيه مفيش غير الشتيمه والنسوان لكن حد يقدر يتكلم في السياسه او رايه في الرئيس زين الي هو مو زين يتكلبش ويروح وراه الشمس كمان مدام مو زين عمله حريه جامده ااااااااااوي للنسوان هناك براحتهم علي اخر"
