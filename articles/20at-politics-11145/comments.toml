text = "طبعا المسجد الاقصى اول القبلاتين وثلاث الحرمين بس لازم نشوف الانفاق اللى تحته لانها خطيرة جدا بدا حفر الانفاق من سنة منذ سنة 1996ان هذة الحفر سوف يلتقى فى نقطة ما بين المسجد الاقصى والمتحف الاسلامى ان انهيار المدرسة هو صرخة هناك خطر دائم ومنذ شهور عند بابا المغاربة الاردن مسئول عن القدس حسب اتفاقية وادى عربة هم يخططون الان الى ان سنة 2020 الى انهاء قضية القدس"
