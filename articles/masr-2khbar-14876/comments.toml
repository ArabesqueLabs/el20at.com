author = "حبيبة مصر"
posted = "2010-01-14"
text = "ومين غيرها حبيبة مصر ---- السيدة شادية<br />حينما غنت لمصر غنت بعواطفها واحساسها ودخلت قلوب كل الناس وحفظت كلمات اغانيها الوطنية<br />شادية<br />يا حبيبتى يا مصر<br />فية طفل فى مصر لا يغنى اغنية حبيبة مصر شادية - يا حبيبتى يا مصر<br />عندما ضربت بحر البقر - وفى ثالث يوم من الحادث خرجت اغنية شادية الدرس انتهى وفى نهاية الاغنية غيرت كلمات الدرس من ضرب وقتل الى كلمات جديدة هى نهض - عبر - فتح<br />تحية لك يا ست شادية<br />تحية لك من اعماق قلبى يا عظيمة يا حبيبة مصر<br />شكرا للموقع لوجود تسجيل لاغنية انتهى الدرس"
