author = "الدرس لم ينتهى"
posted = "2010-01-14"
text = "ولن ننسى ابدا اطفال بحر البقر ولا عمال مصنع ابو زعبل للحديد<br />لن ننسى ابدا<br />لن ننسى اطفال غزة<br />الدرس لم ينتهى ولن ينتهى غير بالثأر<br />ويوما ما - ويرونة بعيدا ونراة قريبا"
