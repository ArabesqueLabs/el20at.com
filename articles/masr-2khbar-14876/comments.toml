author = "قضية اية ؟"
posted = "2010-01-14"
text = "زمان ايامها استغلوا ضرب مدرسة بحر البقر فى عمل دعاية ضخمة ضد اسرائيل وعرض الموضوع فى الامم المتحدة<br />وردت اسرائيل ببساطة وبالصور المزيفة او الحقيقية - اللة اعلم - انة كان على سطح المدرسة مدافع مضادة للطائرات وان الطائرات ضربت هدفا عسكريا ولا علم لها بوجود اطفال<br />وسكت العالم<br />وضربت مدارس غزة<br />والحجة ايضا انة انطلقت من تلك المدارس صواريخ تابعة لحماس وانها اسكتت مصادر النيران<br />مفيش حاجة اسمها قضية ومحكمة مع اسرائيل<br />فية حاجة اسمها القوة<br />واعدوا لهم ما استطعتم من قوة<br />حينما نملك القوة هنبقى محترمين - القوة الاقتصادية والقوة العسكرية<br />انما هنشتكى ونقول عشانا عليك يارب واحنا غلابة قوى والنبى يا بية<br />فهذا كلام فارغ"
archived = "2010-03-14"
