subject = "الرئيس محمد حسنى مبارك"
posted = "2008-03-17"
text = "الرئيس محمد حسنى مبارك<br />* من مواليد.. محافظة المنوفية<br />* التحق بالكلية الحربية فى 1/11/1947 وبعد تخرجه منها فى 1/2/1949<br />التحق بكلية الطيران حين تخرج منها فى 13/3/1950<br />* تدرج فى مختلف مناصب سلاح الطيران ثم عمل مدرسا بالكلية الجوية فى فبراير 1952 الى يناير 1959 .<br />* عين مديرا للكلية الجوية من 2/11/1967 وكلف بمهمة اعداد كوادر جديدة من الطيارين وفى 22/6/1969<br />عين رئيسا لاركان القوات الجوية وبعدها بأربع سنوات فى 24/4/1972 عين قائدا للقوات الجوية .<br />* قاد سلاح الطيران فى حرب اكتوبر 1973 .<br />* عين نائبا لرئيس الجمهورية فى 16/4/1975 واعيد تعيينه نائبا للرئيس فى اكتوبر 1976.<br />* تولى رئاسة الجمهورية فى 14 اكتوبر 1981 .<br />* فى عهده تم تنفيذ المرحلة الثالثة من اتفاقية السلام بانسحاب القوات الاسرائيلية وجلائها عن سيناء وعودتها الى السيادة المصرية الكاملة .<br />* خطط ونفذ اول خطة قومية للتنمية فى مصر تنفذ بالكامل 82/1987 .<br />* نادى بالصحوة الكبرى فى الانتاج والجدية والالتزام والشعور بالمسئولية الجماعية .<br />* ارسى قواعد الديمقراطية وحرية الرأى وتعدد الاحزاب تنفيذا للمبدأ السادس<br />من مبادئ الثورة وهو اقامة حياة ديمقراطية سليمة"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002905/http://masr.20at.com:80/newArticle.php?sid=14718"

[[comments]]
order = 1
subject = "حراس امن الكرسى الرئاسى الجهلاء"
author = "مسكين"
posted = "2008-03-18"
text = "ثلاثة ارباع مليون مصرى من فئة بصمجى فما تحت - جهلة حتى النخاع - وبعضهم عندة تخلف عقلى عميق<br />وبياكلوا ميزانية التنمية فى البلد<br />تلاقيهم بوجوههم المكهفرة كانهم لم ياكلوا من اسبوع على نواصى الشوارع ملطوعين حول لورى فى البرد والشمس والملازم بتاعهم قاعد فى كابينة اللورى بيقرأ جريدة واخدها من بياع الجرايد سحت<br />وكل مهمتهم ضرب المظاهرات وتقفيل الشوارع والميادين لما سيادتة يمر فى مشوار مالوش اى لزمة<br />بلد بتنهار من سوء صرف اموال الخزينة على شوية بهايم المفروض انهم يكونوا فى الغيط او الورشة بيحاولوا ينتجوا حاجة<br />لكن تقول اية للجهل<br />والحكومة الجبانة المرعوبة من الشعب"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002905/http://masr.20at.com:80/newArticle.php?sid=14718"

[[comments]]
order = 2
subject = "مافيش ضمير"
author = "ابوخضرة"
posted = "2008-03-23"
text = "ان السبب الاساسى لهذة الحادثه المروعه هم من استولوا على الطريق ليضموة الى قصورهم الفارهه على طريق مصر اسكندريه الصحراوى وخصوصا فى منطقه الحادث وما فيش حد قادر عليهم حتى قيادات الداخليه عارفيين وخايفيين يتكلموا وكمان المحافظ اللى خربها وقاعد على تلها المسمى فتحى تعس عارف ومش قادر يقول الجماعه دول يرجعوا الطريق للمارة تانى خايف من منصور و جرانه وقرايبهم وخاىف حتى يكلم اسعاد يونس الممثله ترجع سور قصرها عن الطريق يا نهار اسود ياجدعان لما دم الغلابه كل يوم سايح فى هذة المنطقه وما فيش مسؤل محترم او صحفى محترم قادر يقول رجعوا الطريق يا شويه قاطعى طريق"
archived = "2010-03-14"
capture_url = ""
