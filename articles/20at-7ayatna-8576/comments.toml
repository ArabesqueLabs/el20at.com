[[comments]]
order = 10
subject = "الاكلات الشعبية..عنوان ثقافة البلدان"
author = "جنان الرحمن"
posted = "2008-03-27"
text = "عادة اذا اردت التعرف على ثقافة بلد من البلدان تبحث في زيه ..ماكولاته..معالمه الاثرية..<br />وقد احسن الصحفي تامر تعريف قراء العالم بجزء من الثقافة الاردنية .. التي لازال في جعبتها الكثير الكثير..باسلوب جميل و<br />شيق....كفنان احسن تقديم الواقع الاردني بقالب جذاب..وناقد لحقيقة الوضع الاقتصادي في البلد..<br />وكأن للصمادي عينان ..عين امل بمخزون الطيبة وارادة التغيير عند الاردنيين ..وعين الم على الواقع المعيشي المتردي الدي<br />تصنعه الحكومات الارنية المتتالية ..<br />كل الشكر والتقدير للشاب تامر المبدع والطموح ...<br />.وكل الثناء والاحترام لعشرينات التي تبنت مثل هذه المواهب الشبابية المميزة...<br />اما التميمي..فله اقول..التنافس ان لم يكن نظيفا ..ملوثا..فليذهب قائده الى محرقة المهملات.....وطرح الراي ان لم يكن<br />مهذ با فليذهب به صاحبه الى حيث هو ليرتديه ......"
archived = "2010-03-14"
capture_url = ""

