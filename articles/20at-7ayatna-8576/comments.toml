posted = "2008-03-25"
text = "الاخ تامر انت تريد ان تكتب اي شيء والسلام اصلا اللي في الصورة اخ مصري وافد يعمل في المطعم حاله حال كثير من الاخوة المصريين الذين بدونهم لن تعمل مطاعم عمان ثم تاتي حضرتك لتضحك علينا بكلامك عن التراث الشعبي والاكلات الشعبية<br />المناسف وهي الاكلة الشعبية الاردنية التراثية يقوم بطبخها اخوة مصريون في المطاعم الارجنية الكبيرة والصغيرة<br />حاول ان تبحث عن مواضيع اهم وافضل حتى ترتقي في سلم المجد الصحفي تحياتي"
