[[comments]]
order = 3
subject = "المرابطة"
author = "قلب يبكى حزنا"
posted = "2009-01-14"
text = "رغم كل الالام و القلوب التى تبكى وتعتصر الما الا ان هناك دائما ثقة بان ما يحدث فهو خير لنا لكى نفيق من غفوتنا بدليل الصبر وقوة التحمل التى عليها الفلسطنيين الذى كرمه الله واختارهم للشهادة وصحوة المسلمين وغضبهم فى كل مكان وعدم قدرة الصهاينة على دخول غزة بدليل ضربها للمدنيين وتخبطها كثيرين لا يعلمون ان للنصر مقاييس اخرى قال تعالى (وعسى ان تكرهوا شيئا وهو وخير لكم وعسى ان تحبوا شيئا وهو شر لكم والله يعلم وانتم لا تعلمون ) صدق الله العظيم"
archived = "2010-03-14"
