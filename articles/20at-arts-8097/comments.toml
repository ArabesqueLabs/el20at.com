subject = "اغيثوا غزة"
author = "عربى حزين"
posted = "2008-04-13"
text = "نحن لانملك الا ان تقــــــــــول حسبــــــــــنا الله ونعم الوكيل والله اكبر صرخة على كل معتدى جبار<br />وحسنا الله ونعم الوكيل على كل خائن لوطنة ودينة وليعد جواب لغد ماذافعلت لدين الله<br />نصرت الدين ام خزلتة"
