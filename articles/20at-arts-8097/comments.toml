[[comments]]
order = 0
subject = "لأجلك يا غزة نصلي"
author = "أميمة الشاذلي"
posted = "2008-02-13"
text = "قد لا نستطيع حمل المدافع على أكتافنا لتحرير غزة .. إلا أننا نملك تأييدهم بكل ما أوتينا<br />بكلمة.. بمقال.. بأغنية صادقة.. ببعض المال الذي وهبنا الله إياه لمساعدة المحتاجين<br />وقبل كل هذا بدعوة صاقة<br />فإذا ما أتيحت لنا الفرصة كي ندعم غزة عن طريق مشاركة عبر الفيس بوك.. فلم لا ندعم هذه الفكرة؟!!!<br />انا اضم صوتي لصوت كل الغزاويين وأقول<br />من أجلك يا غزة .. نصلي"
archived = "2010-03-14"
capture_url = ""

