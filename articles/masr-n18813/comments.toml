[[comments]]
order = 0
subject = "تماسك - توجة الى اقرب الشطوط - فان الحمولة على وشك"
author = "شايف"
posted = "2008-12-15"
text = "المعارضة تهدى اللعب شوية<br />لان السفينة بتغرق<br />والبلد بتنكمش او زى البلونة اللى فيها ثقب وبتفسى ببطء واسف على التعبير<br />ايران اخدت دور مصر فى لبنان وتبنت حزب اللة هى وسوريا وهو الجواد الرايح واحنا قاعدين بنتفرج<br />تركيا شغالة وساطة بين سوريا واسرائيل واحنا برة اللعبة ولا عندنا فكرة هما بيقولوا اية<br />وقطر عملت مصالحة بين الفصائل اللبنانية واختاروا الرئيس اللبنانى<br />والقراصنة فى الجنوب الصومالى الهند شغالة كويس مع دول اوروبا<br />وفقدنا حماس وحماس ابتدأت ايضا تتجة الى ايران<br />ودارفور وما يجرى فيها لا يعنينا<br />ودائما مصر اولا<br />ونظرا للازمة المالية العالمية الطاحنة - المعونات هتقل - وهى اللى احنا عايشين عليها ودخل قناة السويس هيقل - والطلب على العمالة المصرية هيتلاشى وهناك عمالة مصرية ستعود قريبا بمئات الالوف وستنضم الى طابور العاطلين<br />ومشاكل مع قبائل سيناء<br />وقتلى الشرطة فى اسوان واسيوط والتوترات الشعبية وقنابل الدخان<br />كل شىء مرتبك<br />وعلى المعارضة ان تهدى اللعب وتترك الحكومة فى حالها<br />فالكل بينام ولا يعلم ماذا يخبىء الصباح من مفاجئات<br />وربنا يستر"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133649/http://masr.20at.com:80/newArticle.php?sid=18813"

[[comments]]
order = 1
subject = "الى الاخ اللي فوق وسفينة الانقاذ هي النبي محمد صلى"
author = "ابومحسن غربة 27 سنه"
posted = "2008-12-15"
text = "قبل ان نفكر في حل مشاكلنا ينبغي عمل الاتي<br />1)<br />ان نقرأ عن حال الجزيرة العربية قبل بعثة النبي ونشوف العرب الهمج كانوا عايشين ازاي على جميع الاصعدة سياسيا واجتماعيا واقتصاديا الخ ونقارن حالهم بحالنا الان<br />2)<br />نقرأ عن بعثة النبي محمد صلى الله عليه وسلم وسيرته النبوية العطرة ومدتها 23 سنه مع سكان جزيرة العرب وكيف علمهم صلوات الله وسلامه عليه المنهج الرباني وطلبوا منه معجزه فقال لهم صلوات الله وسلامه عليه انتم المعجزه طبقوا المنهج وستروا المعجزه<br />3)<br />نقرأ بعد انتهاء مهمة النبي صلى الله عليه وسلم وانتقاله الى الرفيق الاعلى وكيف بدأت المعجزه في الظهور في القادسية واليرموك حتى وصلت المعجزه الى اسبانيا غربا والهند شرقا<br />هذا هو الحل الوحيد للنهوض"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133649/http://masr.20at.com:80/newArticle.php?sid=18813"

[[comments]]
order = 2
subject = "يا ابو محسن - كلامك صح - ولكن من يتبعة يتعرض لابشع"
author = "غف"
posted = "2008-12-15"
text = "انت شايف حماس<br />ابتداوا يمشوا على المنهج اللى بتقول علية<br />الاخ الفقى قال لك مش عايزين امارة اسلامية ويحكمها الاسلام جنبنا - وتتعرض غزة للحصار من قبل المسلمين واليهود وحتى لو مات المليون ونصف مليون فلسطينى مش مهم ولكن المهم الا يقام حكم الاسلام<br />يا صديقى ادرس الواقع المرير الذى يحيط بالشعوب قبل ان تقول نظريتك التى ثبت بالتجربة نجاحها<br />ولكن العالم كلة ضدها ولا يمكنك ان تحارب العالم كلة"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133649/http://masr.20at.com:80/newArticle.php?sid=18813"

[[comments]]
order = 3
subject = "حراااااااااااام"
author = "محمد الحسينى"
posted = "2008-12-15"
text = "انا بقول ان اللى بيحصل ده حرام الحكومة مش عايزة اى حد يقاطعها او يجادلها الكل يقول حاضر ونعم وطيب<br />طيب وبعدين الناس دى مش حاسه هيه بتعمل ايه فى مصر<br />مصر لم يعد لها دور فى افريقيا والدليل السودان وما يحدث فيه من دارفور واقليم ايبى والجنوب كله<br />مصر لم يعد لها دور فى الخليج العربى او اسيا واسالوا ايران عملت ايه هيا وقطر<br />مصر لم يعد لها احترامها على المستوى العالمى<br />مصر اللى كل يوم فيها حادثة وقتلى وجرحى<br />مصر اللى وزير الخارجية المسلم بتاعها بيقول لن نسمح بوجود امارة اسلامية على الحدود المصرية طيب يعنى ماهو ان سمحت غصبن عنك وعن اللى خلفوك بوجود امارة صهيونية يهودية ولا هما احسن من المسلمين<br />مصر اللى بتمد اسرائيل بالغاز والكهرباء وتمنع كل شىء عن غزة وتسيبهم جعانين بردانيين عيانيين<br />مصر اللى رئيسها عنده 81 سنة ويبحكمها لحد دلوقتى من 27 سنة<br />مصر دى لازم تنهار لازم تقع لانها مش مصر دى مرض دى شلل دى طاعون<br />وحسبى الله ونعم الوكيل"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133649/http://masr.20at.com:80/newArticle.php?sid=18813"

[[comments]]
order = 4
subject = "مصر فى غيبوبة او فى الانعاش ويحكمها ضباط امن دولة"
author = "الصعيدى"
posted = "2008-12-15"
text = "سفينة تايهة فى وسط دوامة فى المحيط بتلف حول نفسها مش عارفة لها اتجاة<br />وضع مزرى<br />بتخاف من اسرائيل موت<br />ولو صحفى اسرائيلى شتم فى مقال هناك<br />الكل بييجى لة اسهال"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133649/http://masr.20at.com:80/newArticle.php?sid=18813"

[[comments]]
order = 5
subject = "معركة فى البرطمان"
author = "من اسوان"
posted = "2008-12-16"
text = "انتم بتسموة برلمان - دة اسمة برطمان<br />دة كلة ضباط - ما عدا شوية الاخوان<br />السيد رئيس المباحث المديرية اللى جنبنا الوزارة عايزة تكرمة على خدماتة - جعلتة يرشح نفسة للمجلس عن احد الدوائر ونجحوة بالتزوير<br />يعنى اللى بتشفوهم بالجلاليب فى المجلس ثلاث اربعهم بتوع مباحث وامن دولة وضباط جيش وقليل من المدنيين<br />دول شوية بلطجية<br />وناجحين بالتزوير واول واحد نجح بالتزوير الفقى بتاع البحيرة<br />سكوا على البرطمان<br />ريحتة بقت وحشة قوى"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133649/http://masr.20at.com:80/newArticle.php?sid=18813"
