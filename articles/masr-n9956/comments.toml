[[comments]]
order = 1
subject = "إلا مهم .... ده مهم ومهم ومهم"
author = "محمد السيد"
text = "بعد كده كل واحد ييجي ويسيب قفاه في البيت ....<br />أنا مش مسئول عن قفا حد بعد كده ....<br />إيه يا عالم ...ربنا يستر علي قفيانا ...<br />وبعدين بيقول لك في نظرية علمية ... الواحد عنده ودنين وعينين وفتحتي أنف ... لكن فم واحد وقفا واحد ...<br />إيه العلاقة بقي؟؟<br />يضرب علي القفا الواحد ... ويصرخ من القفا الواحد برضه ...<br />لا بقي ...يا هندي ....<br />مش كل ما أروح حتة ..ألاقيك معلق الأول ...<br />مش معقول كده ...<br />سبقتك هنا ..........هههههههههههههههههههه<br />يالا بقي.... عقبال كل قفا ...<br />بس برضه مش حاسكت ...<br />مع افتتاح ولاد البلد الجديد ...تقدروا تشرفوا المدونة بقي<br />www.mesh7askot.blogspot.com<br />mohamedmat@hotmail.com"
archived = "2007-04-28"
capture_url = "https://web.archive.org/web/20070428024954/http://masr.20at.com:80/newArticle.php?sid=9956"

[[comments]]
order = 2
subject = "مش ممكن بجد موضوع اكثر من رائع"
author = "شريف الدواخلى"
text = "لا اجد من الكلام ما يعبر عن اعجابى بالموضوع .. بجد راااااااااااائع .. 4 مصادر متنوعه اضافت لنا كقراء الكثير .. يعنى ماشاء الله الفكره عبرتى عنها بشكل جميل جدا جدا .... و المعلومات اللى فيها فعلا قيمه .. فتحيه لك على هاك الموضوع"
archived = "2007-04-28"
capture_url = "https://web.archive.org/web/20070428024954/http://masr.20at.com:80/newArticle.php?sid=9956"

[[comments]]
order = 3
subject = "حمد لله على السلامة"
author = "فهد الا سلام"
text = "حمدللله على السلامة وكنا مشتقين اوى بس مش هكتب اكثر من كدة"
archived = "2007-04-28"
capture_url = "https://web.archive.org/web/20070428024954/http://masr.20at.com:80/newArticle.php?sid=9956"

[[comments]]
order = 4
subject = "و من القفا ما قتل"
author = "نيفين نيفى نوفا"
text = "و الله يا جماعه لو كان بهجت الاباصيرى عرف ان اهميه القفا بالشكل دا كان بدل ما قال كل واحد يخلى باله من لغلوغه قال كل واحد يخلى بال من قفاه<br />مش قلتلكو حوار القفا دا افتكاسه تمام"
archived = "2007-04-28"
capture_url = "https://web.archive.org/web/20070428024954/http://masr.20at.com:80/newArticle.php?sid=9956"
