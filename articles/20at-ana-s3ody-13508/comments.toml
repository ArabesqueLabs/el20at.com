text = "في البداية أحب اوضّح نقطة:<br />احنا كسعوديين .. الجنسية لا تمثل لنا أي شي .. انا سعودي نعم ، و عربي نعم<br />ولكن كلنا مسلمين .. و تحت راية لا اله الا الله .. المؤمنون إخوة :oops:<br />احنا اخوااان يا جماعة .. لا تفرقنا الحدووووووود والدول والأعلام :sad:<br />انا سعودي أحب للمصري والسوري والعراقي و الباكستاني ما أحبه لنفسي<br />هذا المفروض يكون شعارنا .. ;-)<br />النقطة الثانية : اعتذر لاخواني المصريين عن ما بدر من الردود السابقة ، اللي ما ادري كيف أوصفها !!<br />بس تدل على دونية تفكير كاتبيها مع احترامي الشديد لهم : )<br />متى نتطور آخ بس ، شي يرفع الضغط و يجيب السكر والملح بعد :cry:"
