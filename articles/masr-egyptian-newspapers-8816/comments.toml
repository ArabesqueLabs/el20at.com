subject = "المادة الاولى والاخيرة فى اى دستور مصرى قادم"
author = "فورة"
posted = "2008-04-17"
text = "المصرى امن فى بيتة وحرمة بيتة هى سيادة الدولة فلا يجوز اقتحام بيتة ايا كان السبب ولا يجوز تفتيشة ولا القبض علية داخل بيتة ولا يجوز ترويع بناتة وزوجتة فى انصاف الليالى وفى الفجر ويتم القبض علية فى الشارع اذا ارتكب جرما ما"
