subject = "ليعلم الأغبياء"
author = "الليث الضاري"
posted = "2008-04-23"
text = "ليعلم الأغبياء العلمانيين والبهائيين والصليبيين أن كل هجماتهم الشرسة على الإسلام لا تزده إلا قوة ومنعة ... وبهجومهم هذا بدأ الشباب المسلم يعود إلى صحيح دينه بل وبدأ معدل دخول المخالفين في الإسلام أفواجا يزداد بإضطراد ... والحمد لله رب العالمين"
archived = "2010-03-14"
