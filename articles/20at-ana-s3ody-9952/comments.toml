author = "متخلف عن العمرة"
posted = "2009-05-10"
text = "انا احد المتخلفين عن العمرة صارلي سنة ونصف هل يطبق علي نظام البصمة ؟؟ ونظام عدم دخول المملكة اطلاقا ؟؟علما انني دخلت في نية العمرة والحج والحمد لله اتممت المناسك ومن جهة اخرى انا قاصد العمل في الممكلة لاني كنت لااملك ثمن التأشيرة والآن توفقت في عملي واريد السفر للدخول من جديد بتأشيرة نظامية والله العظيم اني محتاج لتحسين الوضع المادي والله بلدي ماضل فيها خير وانا مرتبط بعمل بالرياض ومااقدر اعيش من دونه فهل من العـــــــــــــــــدل ان تسفروني وتقطعون رزقي ؟؟؟ وش ذنبي ؟؟ لاني مادخلت نظامي ؟؟لا حول ولا قوة إلا بالله. :sad:"
