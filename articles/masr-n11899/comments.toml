subject = "واللة فكرة حلوة"
author = "ابو ليلى"
text = "الرحلات حلوة وجميلة وبتنسى الانسان همومة<br />والنيل والقناطر وركوب القارب او الاتوبيس النهرى - كل دة رائع جدا<br />والانسان لما بياخد كاميرا ويصور صور بتبقى لها زكريات جميلة<br />ومطلوب فك الكلكعة ونسيان السماجة ورخامة الظروف وخلونا نضحك<br />ويجعل عيدكم سعيد"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032259/http://masr.20at.com:80/newArticle.php?sid=11899"
