subject = "احد الظرفاء فى جريدة الدستور كتب"
author = "مش ظريف قوى"
posted = "2008-11-28"
text = "ان الهند نجحت فى اطلاق سفينة فضاء تدور حول القمر منذ اسبوع<br />وفى نفس الاسبوع اطلقت ايران قمرا او صاروخا الى الفضاء الخارجى<br />اما علماء مصر فانهم محتارين علشان هيركبوا عساكر الامن المركزى فى الصاروخ ازاى علشان يحرسوة وهو ماشى فى الفضاء<br />وبيقولوا ان المحطة النووية المزمع اقامتها فى الضبعة المشروع متعطل علشان تجاهل المصمم لوضع عساكر الامن المركزى داخل المحطة وتبعية مدير المحطة لضابط الامن المركزى"
archived = "2010-03-14"
