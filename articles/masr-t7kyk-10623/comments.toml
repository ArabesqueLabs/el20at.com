[[comments]]
order = 3
subject = "فى ثلاثة ايام هذا الاسبوع قتل ضباط الشرطة اربعة مص"
author = "مسعود"
posted = "2008-11-28"
text = "لم يشهد تاريخ مصر مثل هذا<br />ولا حتى فى ايام احتلال بريطانيا<br />اطلاق الضباط النار على رؤوس المصريين وكان الناس كلاب ضالة او حشرات يقتلونها<br />هل يصبر الناس طويلا ؟<br />اظن لا<br />فالبعض بدأ يفكر فى الرد<br />وما اسهل الكمائن واطلاق الرصاص عليهم ايضا<br />فليحذر الشعب المصرى فنحن نساق الى حرب اهلية"
archived = "2010-03-14"
capture_url = ""

