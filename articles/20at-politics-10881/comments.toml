subject = "التفلزة المغربية"
author = "صاحب المقال"
posted = "2009-01-05"
text = "ان اقصد ان الاعلام المرئي(التلفزة) الرسمي يعني القناة الاولى والثانية والمغربية لم يطرأ على برامجها الاخبارية اي تغيير يذكر وهذا وحتى تصويرا التظاهرا والمسيرات يكتفى فيها بعرض صور من الهامش ولا تظهر الحقائق والمغرب بحاجة اليوم قبل غد الى قناة اخبارية.اما الصحافة المكتوبة فاغلبها يقوم بواجبها اتجاه فلسطين وان اختلفت وجهات النظر وزاوية القراءة"
