subject = "رد على سؤال/ لماذا لم يفكر أي من هؤلاء المذيعين ال"
author = "مش ضروري"
posted = "2007-06-17"
text = "لان الاسائة الى الاسلام هي الهدف وكل المفتيش وهذه القنوات الفضائية ما هي الا جهات مرتشية من اعداء الاسلام والمسلمين ونخص بالذكى ما يسمون انفسهم (اقباط المهجر) وجهات معادية كثيرة للاسلام<br />واول الفتاوي المسيئة للاسلام كرضاعة الكبير وبول الرسول والتداوي ببول الابل وخلافه من اشياء بسيطة جدا تكاد لا تذكة وردت في السنه وليست في منهج النبي محمد صلى الله عليه وسلم وردت في السنه وليست في المنهج يتكلمون فيها ويضخمونها للاساءة الى الاسلام مع ان هذا الكلام مردود عليه فبعد وفاة النبي محمد صلى الله عليه وسلم وفي اقل من مائة عام تلامذة النبي محمد صلى الله عليه وسلم كانت دولتهم من اسبانيا الى الهند<br />وهذا يكفي للرد على كل من يسيء الى الاسلام والنبي محمد صلى الله عليه وسلم"
archived = "2010-03-14"
