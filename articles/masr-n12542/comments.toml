subject = "فين وزير الاثتثمار"
author = "عبد الروتين"
text = "كدة الحكومة مش مبسوطة 18% بس - الحكومة عايزة الشعب 100 % يدخن<br />نقول لية ؟<br />الحكومة بتستورد الدخان الخام اللى هو ورق الشجر بتاع الدخان ب 10 جنية للكيلو وشوف يا محترم لما تخلط الكيلوا دة بشوية خشب ناعم يعملوا كام علبة سجاير كيلوباترة وسوبر كمان<br />المكسب رهيب بيصرفوا منة على الامن المركزى والفسح والسفريات وخلافة<br />علشان كدة عمرنا ما سمعنا انهم بيفكروا يبيعوا مصانع السجاير لمثتثمر<br />اتحدى وزير الاثتثمار انة يقول انة عايز يبيع او يخصص مصانع السجاير<br />مش ممكن<br />خصخصة ال<br />يا ناس بطلوا شرب سجاير مضروبة<br />دى بتهد فى صحتكم<br />اتقوا اللة"
archived = "2007-11-24"
capture_url = "https://web.archive.org/web/20071124095346/http://masr.20at.com:80/newArticle.php?sid=12542"
