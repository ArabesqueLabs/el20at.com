text = "السلام عليكم ورحمة الله وبركاته<br />يعتبر شمال الاردن اكثر ثقافتا واطلاعا لدلك التشيع في الاردن معدوم تماما ربما هناك حالات استثنائيه ممن يطلبون الشهره المنبودين من المجتمع اصول غير اردنيه مرتزقه , كدلك يوجد شيعه لم يسبق لهم ان اعلنو مدهبهم لانهم كادبون يعني يستخدمون التقيه وبعد احتلال العراق من قبل خونة الامه الاسلاميه والشيعه الرافضه اصبح للشيعه عين ظاهره خرجو من جحورهم مدعيين انهم تشيعوا وسط مجتمعهم الدي خدع بهم وبتقيتهم سنوات لا يوجد دين في الارص يجبر اتباعه على الكدب ’^ حكم تارك التقيه اي الكدب عند الشيعه كافر كما ورد في كتب زنادقتهم .<br />الشعب الاردني شعب اصيل وعريق لا يكدب ولا يسب عرضه غالي , فكيف يتجرد هادا الشعب العشائري من اخلاقه<br />1- يتبع دين يسب صحابة الرسول صلى الله عليه وسلم ويتهمهم بالارتداد بعد وفاة الرسول وهم مبشرين بالجنه , هاده عقيدة القوم عقيدة البداء اي ان ربهم رضي عن الصحابه وبعد موت النبي غير هادا الرب رايه بالصحابه , اي رب يعبدون .<br />2- يدعون محبة الرسول صلى الله عليه وسلم ويتهمون زوجته عائشه بانها زانيه رضي الله عنها يكدبون الله لانه انزل برائتها في القران .<br />3- الرسول عندهم لم يؤدي الامانه ولم يبلغ الرساله كدلك الرسول معصوم عندهم كيف لا افهم .<br />4- اجمع علماؤهم على ان القران الدي بين ايدينا محرف هادا كفر ويجب قتل كل من يرد على الله ويتهمه بالكدب الله تعهد بحفظ القران الكريم .<br />5 - من تمتع خمس مرات كانت منزلته بمنزلة الرسول بالجنه , المتعه محرمه لانها زنا كيف يقبل الشيعي على اخته وزوجته هادا الامر و=يستشهدون بان الرسول تمتع لعنكم الله .<br />6- لا جهاد ولا صلاة جمعه ولا خمس صلوات باليوم كله عندهم محرم .<br />وهناك الكثير ن عقيدة القوم , لدلك لا اعتقد ان هناك اردني من الشمال وانا ابن الشمال لا اعتقد انهم يقبلون بهادا الدين حتى وان كانو من العوام لا يفقهون دينهم ولا يعرفون ان مؤسس الدين الشيعي هو عبد الله ابن سبا اليهودي الدي اتى ليهدم الاسلام بمساعدة الفرس الايرانيين الدين كرهو عمر بن الخطاب لانه اطفا نارهم ودمر عبادتهم للنار لدلك الفو عليه كسر الظلع واغتصاب الولايه .<br />لا اريد ان اطيل لكنني اردني شمالي مطلع اطلاع تام على ما يحدث في الشمال لكن ليس غريب على القوم الكدب لان دينهم يامرهم بالتقيه .<br />اترككم مع الدليل من كتب الشيعه على ما دكرت حتى اكون صادق في كل حرف<br />وهذا أحد علمائهم يشهد بهذا –محمد بن باقر البهبودي محقق كتاب الكافي وأحد علماء الشيعة – يقول : ومن الأسف أننا نجد الأحاديث الضعيفة والمكذوبة في روايات الشيعة أكثر من روايات السنة . وهذا قاله في مقدمة الكافي .<br />عن محمد بن الحسن بن أبي خالد قال : قلت لأبي جعفر الثاني عليه السلام : جعلت فداك ، إن مشايخنا رووا عن أبي جعفر وأبي عبد الله وكانت التقية شديدة ، فكتموا كتبهم ولم ترو عنهم . فلما ماتوا صارت الكتب إلينا . فقال –أي أبا جعفر الثاني : حدثوا بها فإنها حق . فلا إسناد إذن ، وإنما وجدوا الكتب قال حدثوا بها فإنها حق . وهذا في الكافي ج 1 ص 53<br />ومن أشهر أسانيد الشيعة ، ما أخرجه الكليني في الكافي حيث قال : قال علي بن أبي طالب رضي الله عنه ( وأقول أنا كرم الله وجهه ولسانه عن هذه الرواية) : عن عفير حمار رسول الله صلى الله عليه وسلم كلم رسول الله صلى الله عليه وسلم فقال : بأبي أنت وأمي !!! إن أبي حدثني عن أبيه عن جده عن أبيه أنه كان مع نوح في السفينة فقام إليه نوح فمسح على كفله ثم قال : يخرج من صلب هذا الحمار –حمار يركبه سيد النبيين وخاتمهم ، الحمد لله الذي جعلني ذلك الحمار !! الكافي ج 1 ص 237<br />وهذا كذب على علي كرم الله وجهه ولسانه ، وهذا يصور لكم حقيقة مدى التخبط الذي صاروا إليه حتى إنهم يروون حتى عن الحمير !! لا بل ويجعلونه إسنادا حيث يقول الحمار حدثني أبي عن أبيه عن جده عن أبيه !!!! ثم يكفيكم من هذا قوله : ومسح على كفله ! ولا أظن أحدكم يجهل أن الحمار ليس له كفل ، لأن الكفل للخروف وليس للحمار !!<br />محمد الباقر المجلسي في حق اليقين ص519 وعقيدتنا (الشيعة)في التبرؤ:أننا نتبرأ من الأصنام الأربعة:أبي بكر وعمر وعثمان ومعاوية، والنساء الأربع:عائشة وحفصة وهند وأم الحكم، ومن جميع أتباعهم وأشياعهم، وأنهم شر خلق الله على وجه الأرض، وأنه لا يتم الإيمان بالله ورسوله والأئمة إلا بعد التبرؤ من أعدائهم<br />أن الشرك معناه إشراك أحد من الناس في الولاية غير الأئمة وأن المراد بالمشركين هم من أشركوا في ولاية علي غيره ! يعني من اعترف بخلافة الخلفاء الراشدين مثلاً فهو المشرك المراد في القرآن الكريم!( الكافي<br />قال علي رضي الله عنه على منبر الكوفة لا أوتى برجل يفضلني على أبي بكر وعمر إلا جلدته حد المفتري.الكشي: ترجمة رقم 257، معجم الخوئي 8/153 – 326 الفصول المختاره 127<br />عن أبي عبد الله قال:كل راية ترفع قبل قيام القائم فصاحبها طاغوت يعبد من دون الله عزوجل الكليني الكافي (8/295)ووسائل الشيعة (11/37) وهذا يعني ان حسن نصر اللات كافر في حكم الشيعه فـ يا شيعة العاااالم استيقضوا<br />هل تعلم ان الحسن العسكري الامام الحادي عشر كان عقيماً ولم تحمل منه زوجاته ولا جواريه وانه مات سنة 260هـ.. دخل اقربائه على زوجاته وجواريه لعلهم يجدون واحدة منهن حاملاً فلم يجدوا احداً منهن حاملاً مما جعلهم يقسمون ميراثه بين امه واخيه جعفر..كتاب الحكومة الاسلامية.. للخميني ص45/46فمن اين سوف يأتي بولد لهذا العسكري<br />وقال محدث الشيعة في زمنه / نعمة الله الجزائري : إنا لا نجتمع معهم – أي السنة على إله ولا على نبي ولا على إمام وذلك أنهم يقولون أن ربهم الذي كان محمد نبيه وخليفته بعده أبو بكر – ونحن نقول لا نقول بذلك الرب ولا بذلك النبي بل نقول إن الرب الذي خلق خليفة نبيه أبو بكر ليس ربنا ولا ذلك النبي نبينا – هذا قاله في الأنوار النعمانية في الجزء الثاني صفحة 278.<br />عن أبي عبدالله عليه السلام : ( كان رسول الله صلى الله عليه وآله لا ينام حتى يُقَبِّلَ عرض وجه فاطمة ) بحار الأنوار 43/44 . ( وكان يَضعُ وجهَه بين ثَدْيَيْها ) بحار الأنوار 43/78 (من كتب) الشيعة<br />قال أبو جعفر \" للإمام عشر علامات: يولد مطهرا مختونا وإذا وقع على الأرض وقع على راحته رافعا صوته بالشهادتين ولا يجنب، وتنام عينه ولا ينام قلبه، ولا يتثاءب ولا يتمطى ويرى من خلفه كما يرى من أمامه، ونجوه (فساؤه وضراطه وغائطه) كريح المسك (الكافي 1/319 كتاب الحجة - باب مواليد الأئمة). إقرؤا كتبكم يا رافضه<br />هاده حقيقة معتقد القوم الطعن في الرسول وزوجته وابنته فاطمه وصحابته فكيف لا يطعنون باهل الاردن الشرفاء الدين فتحو قلوبهم قبل بيوتهم لشيعة العراق لكن التاريخ يشهد على خياناتكم مع المغول وتدمير العراق وقتل اهل السنه وخيانتكم مع بوش وقتل اهل السنه في العراق بابشع انواع العداب وتدمير لبنان على يد حسن نصر الله . نسال الله الهدايه لعوام الشيعه ولعن الله من يشيع قول علماؤهم الكفره الزنادقه اعداء الاسلام والمسلمين"
