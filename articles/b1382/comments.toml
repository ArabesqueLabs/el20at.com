text = "الى كل اردني شريف هل تعلم شيء عن دين الشيعه ؟<br />أي بني ...<br />- لن تجد أنصح لك مني فالابن بضعة من أبيه وفلذة كبده التي يطرب لطربها ويسعد بسعادتها ...<br />- فاسمع نصحي تسلك طريق النجاة .......<br />-يا بني..أني محدثك عن حقيقة مذهبك ومصدقك الخبر .......<br />- أعلم يابني..ان دينك ليس كبقية الأديان... بل هو مزيج منها جميعا فلليهودية نصيب منه وللنصرانية حظ منه وللمجوسية أوفر الحض والنصيب .......<br />فأخذ من اليهودية الحقد والكراهية ........<br />وأخذ من النصرانية الشرك والحلول والسذاجة ومخالفة المعقول .........<br />وأخذ من المجوسية عبادة الذات وتقديس البشر ......<br />وإن كان يختلف عنهم جميعاً في كونه لا يعظم نبيه ولا يؤمن بكتابه ويلعن أصحاب نبيه وحواريه الذين نصروه وعزروه وآووه .......<br />وقبل ذلك يكذب كلام ربه وخالقه ......<br />فاليهود يرون أن أفضل أمتهم أصحاب موسى عليه السلام .....<br />والنصارى يرون أفضل أمتهم أصحاب عيسى عليه السلام .....<br />أما نحن - الرافضة -..يا بني... فنرى شر أمتنا هم أصحاب محمد ...وأشر هؤلاء أقرب الناس إليه في حياته..... ومماته..... كأبي بكر وعمر وبعدهم أزواجه فهم عندنا معاشر الروافض أشر من أبي جهل وأمية بن خلف وغيرهم من مشركي العرب .......<br />ألم تسمع قول الإمام أن الناس كانوا أهل ردة إلا ثلاثة ........<br />فحكم على صدر الإسلام الأول بالكفر والردة وخالف نص القرآن في الثناء عليهم ....<br />أي بني ...<br />- يجب أن تعلم أن العقل والتشيع لا يجتمعان كالماء والنار .....<br />فإذا دخلت حسينية..... فضع عقلك مع حذائك عند الباب ،.... فلن تحتاج إليه فقد كفيت همه ....<br />وإياك إياك أن تفكر بعقلك .........<br />- يابني إذا جال بخاطرك أو حدثتك نفسك : كيف أسب أصحاب محمد صلى الله عليه وسلم وقد أثنى عليهم الله في كتابه ؟<br />فأعلم أن هذا السؤال لا جواب له عند قومك ........<br />يابني...احذرك...إن صدقت كلام ربك عز وجل في الثناء عليهم و الترضي عنهم فقد خرجت من مذهبك وكنت من أهل النصب .....<br />- يابني...إن فكرت يوماً وقلت :..<br />... كيف أكفر وألعن زوجات النبي صلى الله عليه وسلم وقد قال الله فيهن( النبي أولى بالمؤمنين من أنفسهم وأزواجه أمهاتهم ) فهن أمهات المؤمنين فإن كن لسن أمهات لنا فنحن لسنا مؤمنين ........<br />فقل: ها...ها...لا أدري .......<br />- يابني إن سئلت يوما : هل القرآن الذي بين أيدينا محرف ؟ فقل نعم وإلا<br />فتكون قد أصبت كبد الحقيقة ......<br />فعلماء مذهبك يكاد يجمعون على أنه محرف ومن قال غير ذلك فهي تقية لا محالة أو أنه خارج على المذهب الحق .............<br />ألم تسمع قول الشيخ المفيد :<br />\" ( إن الأخبار قد جاءت مستفيضة عن أئمة الهدى من آل محمد صلى الله عليه وسلم باختلاف القرآن وما أحدثه بعض الظالمين فيه من الحذف والنقصان \" اوائل المقالات : ص 91 )<br />أي بني ...<br />- أعلم أن الله بعث محمداً رحمة للعالمين وبعث علي بن أبي طالب نقمة .<br />فمن آمن بمحمد ولم يؤمن بإمامة علي فهو كافر مخلد في النار ........<br />ومن آمن بإمامة علي ولم يؤمن بكل ما جاء به محمد فهو مؤمن مخلد في الجنة ...<br />وأعلم يابني... أن محبة أصحاب محمد لا تجتمع مع إيمان بإمامة علي فلا بد أن تخرج إحداهما من قلبك ..........<br />يا بني...تكون مؤمناً إذا قدمت إمامة علي وتكون كافرا إذا كانت الأخرى ...<br />أي بني ...<br />-إياك...ثم اياك... أن تناقش أحداً من أهل السنة فهم أصحاب عقل ونقل ...<br />وأنت قد حرمتهما معاً ........<br />يابني ...وهل التقية إلا فرار من الحوار وإخفاء لمعتقدك الضعيف الذي لا يصمد أمام الحجة والبرهان ............<br />فإذا سألك سني :....<br />لماذا لم يرد ذكر لإمامة علي بن أبي طالب في القرآن وقد ذكر أشياء أقل قدراً منها كالغسل وأحكام الحيض والصيد ؟؟؟؟؟؟؟؟؟؟؟....<br />فقل : ها ها لا أدري .........<br />وإن سئلت..يابني... ما الحكمة من وجود وصي لخاتم الأنبياء والمرسلين وقد كمل الدين وانتفت الحاجة من وجود النبي صلى الله عليه وسلم نفسه ولذلك قبضه الله إليه ودينه عزيز ؟<br />فقل ايضا: ها...ها ... لا أدري ........<br />وإن سئلت..يابني...<br />- لماذا سمى الإمام المرتضى أبناءه بأسماء المنافقين مثل عمر وعثمان وأبي بكر ؟؟؟؟؟؟؟<br />-ولماذا زوج بنته من عمر بن الخطاب ؟ ولماذا تزوج من زوجة أبي بكر أسماء بنت عميس ؟ -ولماذا كان ينصح للخلفاء قبله وكان لهم ناصحا ووزيرا وقاضيا ؟ و .. و ... فقل لا أدري وحسبك به جواباً فإن نصف ا لعلم قولك لا أعلم ..........<br />أي بني ....<br />إياك إياك ثم إياك إياك أن تقرأ القرآن الكريم أو أن تنظر فيه . فإن خالفت قولي فلا تلومن إلا نفسك ............<br />فهو موصلك لا محالة إلى الكفر بمذهبك .... والشك فيه والندم على زمن كنت تدين به بمذهب الشيعة الإمامية ..............<br />وكن..يابني... كبقية علماء مذهبك وكبارئهم الذين أصبحوا مراجع وآيات وليس لهم باع ولا ذراع ولا دراية ولا رواية في القرآن وعلومه ..........<br />وكن كما قال من سبقك : ( لا تسمعوا لهذا القرآن والغوا فيه ) ...<br />فالله يذكر في القرآن أن له أسماء وصفات حسنى ........<br />ومذهبك - الرافضي -..يابني... يعطل هذه الأسماء والصفات ويشبه بالجمادات ...<br />فالله يثني على نفسه في القرآن بالصفات العلا ....<br />ومذهبك - الرافضي - ..يابني...يذكره بالنقص ويصفه بالجهل ويتهمه بالبدء .......<br />والله...يابني... يثني على صحابه نبيه ثناء عاطرا ....<br />ومذهبك - الرافضي -..يابني...<br />يشتمهم ويسبهم ويجعل كرههم علامة إيمان ومحبتهم علامة كفر ونفاق ........<br />والله يبشر أصحاب محمد بالرضوان والجنة ........<br />ومذهبك ... يابني...يبشر أصحاب محمد بالنيران والحرمان من الجنة ........<br />والله يقول واصفاً أصحاب محمد ( ليغيظ بهم الكفار ) ........<br />ومذهبك ... يابني ...يغتاظ منهم فهو قد شابه الكفار في الغيظ من أصحاب محمد .....<br />والله...يابني... يقول في القرآن أنه قد أكمل الدين ........<br />ومذهبك...يابني... يقول لا لم يكمل الدين إلا بخروج المهدي المنتظر الذي يرجع الحق إلى نصابه .......<br />يحمل في يمينه سيفاً مسلطا على رقاب أهل القبلة....<br />وفي شماله مصحف فاطمة طرياً كما أنزل ليس فيه من مصحف العامة شيء .....<br />فهل أنت... يابني... بعد هذا واجد في نفسك الرغبة لقراءة هذا القران.. الذي يبطل مذهبك وينسفه من أساسه ..........<br />ثم قلي بربك..يابني... كيف تؤمن بكتاب جمعه أعداء دينك ؟؟!!!<br />أي بني ....<br />قد نبشت تاريخك وفتشت فيه ورقة ورقة علي أجد قبسات من إيمان أو ومضات من نور أحدثك بها فما وجدت إلا شعلا من نيران تلظى ..............<br />فلا تسألني.. يابني... عن بطولات الصديق في حروب الردة ........<br />ولا سيرة الفذ عمر بن الخطاب وعدله ونبله التي سارت بها الركبان ....<br />حتى كان أهلا أن يزوجه الإمام علي بنته بنت فاطمة الزهراء .........<br />ولا تسألني...يابني رجاءا... عن بطولات أصحاب محمد صلى الله عليه وسلم في القادسية واليرموك وكيف اسقطوا دولة فارس والروم في سنوات معدودات .....<br />فليس هذا...يابني ... من تاريخك ولا تاريخ قومك...<br />وحسبك..يابني.. جرماً لهم أنهم أصحاب محمد سيد الخلق اجمعين...<br />وإياك...يابني... أن تتحدث...ابدا... عن الفتوحات الإسلامية في الهند والسند ومصر والشام وبلاد ما وراء النهر ................<br />فهذه ليست فتوحات بل هي نشر لمذهب العامة فلا تطرب لها ولا تفرح بها ......<br />أما إن سألتني ... يابني...عن الفردوس المفقود بلاد الأندلس.......<br />فإياك... أن تجزع لفقدها ...<br />أو تدمع عينك لجراحات أهلها....<br />فما كانت تدين بدين الحق يوما ما بل خرجت من حكم الإسلام إلى دين النصارى وهما سيان عند قومك .......<br />وإذا حدثتك نفسك.. يابني... أن تقرأ سيرة البطل صلاح الدين الأيوبي وكيف طهر القدس من أدران عباد الصليب ........<br />فعض...يابني... أناملك من الغيض ......وقل لها يا ليت لنا مثل صلاح الدين ........<br />فما دخل النصارى إلى بلاد الشام إلا بدعوة من أتباع دينك في بلاد الشام حتى يخلصوهم من حكم العامة ..........<br />إما إذا ذكرت هجوم المغول على بلاد الإسلام وتدمير حاضرة الخلافة العباسية بغداد ...<br />فهنا مربط الفرس وهناك بدأ مجد قومك وسدنة مذهبك ... يابني...<br />فاطرب لهذا الحدث الذي لن يتكرر .......<br />وفاخر الأمم.. يابني... بالبطل المقدام ...الوزير نصير الدين الطوسي ......<br />الذي خان ولي نعمته الخليفة العباسي وغدر به وكان سبباً في هلاك مئات الآلاف من العامة ....<br />أي بني ...<br />إن أهل السنة إن شئت الحقيقة أصدق محبة لأهل البيت منا معاشر الروافض .....<br />فهم يعتبرون علياً من أئمة الهدى ومن أهل الجنة ولكن لا يغلون فيه كما نفعل ....<br />ويحبون سيدا شباب أهل الجنة الحسن والحسين ...........<br />وكذلك بقية أهل البيت ..... بلا استثناء.....<br />ولكن نحن - أهل الرفض -...يابني... لا نحب إلا من نزعم أنهم أئمة فقط ...<br />فهل محمد بن الحنفية...<br />وزيد بن علي...<br />وجعفر الكاذب...<br />وبني جعفر....<br />وبني العباس ....<br />إلا من أهل البيت... يابني.. ولكن ليس لهم مثقال حبة من محبة عندنا خلاف أهل السنة الذين يوالون هؤلاء كلهم ..............<br />يا بني...من الذي يحب أهل البيت حقيقة نحن أم هم .......<br />أي بني ....<br />وفي الختام لا تسألني هل أنا مقتنع بهذا المذهب أم لا؟؟؟؟؟؟؟؟؟؟؟<br />ولا أخالك إلا عارف جواب سؤالك... يابني... وإنما أقول لك كما قال الله في كتابه : ( إنا وجدنا آباءنا على أمة وإنا على آثارهم مقتدون ) ........<br />... يابني ..يابني....من ذاق طعم المتعة في شبابه....<br />وطعم الخمس في شيخوخته هيهات أن يرجع إلى الحق ...........<br />أما أنت يا بني... فتدارك نفسك قبل رحيلها وحكم عقلك لا غير وأقرأ كتاب ربك تعرف مع من الحق ومن هم أهل الحق ........<br />فالزمهم وتمسك بالحق الذي معهم تكن من أهل الجنة ولا يغرك ما كان عليه أهل بيتك<br />وأجدادك من باطل."
