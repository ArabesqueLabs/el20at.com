[[comments]]
order = 1
subject = "اى قرية لا تختلف عن القاهرة - بل ان بعض القرى افضل"
author = "صعيدى"
posted = "2008-10-25"
text = "على معظم بيوت قريتى طبق الدش<br />ومعظم البيوت فيها شباب بيشتغل برة وعندهم كمبيوتر ونت وبعضهم بيجيب النت من الاقمار الصناعية مباشرة بواسطة اجهزة احضروها معهم من الخارج<br />شوارع بعض القرى انظف كثيرا جدا من شوارع احياء شعبية فى القاهرة تجرى فى وسطها قنوات المجارى وفيها القطط الفطسانة والزبالة<br />اى ريفى بينزل القاهرة لا يشعر باى فرق<br />الا اذا كنت تعتبر القاهرة هى مصر الجديدة والدقى والعجوزة والمهندسين ومدينة نصر بس<br />لا توجد تلك الفوارق الفظيعة التى تتحدث عنها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "سامح شراقي"
posted = "2008-10-26"
text = "بسم اللة الرحمن الرحيم<br />عزيزي الكاتب الفاضل / مصطفي هاشم<br />احييك علي فكرة الموضوع الرائعة التي نفذتها فهي فكرة طيبة للغاية ولكن لدي بعض الملاحظات التي اتمني ان تتقبلها بصدر رحب وانا متأكد من ذلك بحكم علاقتنا ودراستنا الصحفية في الجامعة الازهرية<br />اولا لاحظت ان صلب الموضوع بمعزل بعض الشئ عن العنوان وهذا خطأ مهني فأنت تقصد الصعايدة وبداخل الموضوع ذكرت طلاب الاقاليم بصفة عامة بل واستعنت بارائهم ايضا.<br />ثانيا / ازعجتني كلمة قويسنا دقهلية وذلك لاني منوفي وقويسنا منوفية .<br />لاتوجد مقدمة جذابة<br />عدم وجود خاتمة فلم تكتمل الصورة لدي حتي الان .<br />اسف علي الاطالة واتمني لك دوام التوفيق والنجاح لانك باذن اللة اعلامي ناجح جدا وينتظرط مستقبل مشرق باذن اللة.<br />وفقكم الله"
archived = "2010-03-14"
capture_url = ""
