[[comments]]
order = 2
subject = "الحقيقه"
author = "الدميرى"
posted = "2008-02-13"
text = "انه القرءان كلام الله الذى ابهر الشعراء واصحاب النثر حتى قال عنه الوليد بن المغيره راس الكفر ان له لحلاوه وان عليه لطلاوة وان اعلاه لمثمر وان اسفله لمغدف وانه يعلو ولا يعلا عليه<br />وصدق الله اذيقول فى سيد ولد ادم(وما علمناه الشعر وما ينبغى له انه لذكر وقرءان مبين)سورة يس.<br />قديما عبر الشعراء عن ارائهم بالشعر بدون ادنى تكلف فكان مايسمى بالشعر الارتجالى(كما فى قصة ابونواس حين جاء مصر ودخل على الخليفه فوجد الشعراء يمدحونه فترجل(الف شعر وهو واقف)وانبهر الكل به بما فيهم الخليفه وشعراءه<br />انها الان ليست الا وسيله لاثبات القدرات فاستعن بالقرءان تجد فيه متعتك وحين يهم بك امر فقل الشعر ولا تتخذه وسيله لرزقك فانه الخساره والندم على اوقات تضيع واعمار تفنى...."
archived = "2010-03-14"
