subject = "زبادى فى الخلاط"
author = "عشوائية"
posted = "2008-01-09"
text = "والله لو عدت 600 مليون سنة ، ابقوا قبلونا ، وساعتها انا عن نفسي مش هادارى وشي من الكسووووووف ابدا<br />يا جماعة مش المرتب اللي عايز انتفاضة<br />البلد كلها عايز انتفاضة ... الوزراء وكل مسئول قاهد في التكييف وبياكل الكافيار عايز انتفاضة ... الضماير عايزة انتفاضة<br />ااااااااااااااااااااااااااااااه يا بلد وصدقت يا فاروق يا جويدة \" هَذِي بـِلادٌ لمْ تـَعُــدْ كـَبـِلادِي \""
