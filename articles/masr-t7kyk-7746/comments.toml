[[comments]]
order = 5
subject = "7 جنيه ف الايه؟؟؟؟؟؟؟؟؟؟؟"
author = "نيفين نيفى نوفا"
posted = "2007-12-31"
text = "على راى سعيد صالح ف اعيال كبرت 7 جنيه ف الايه يعنى 7 جنيه اول كل مكتب<br />و الله يا جماعه انا بالنسبالى الحمد لله مش اوى<br />المرتب كويس بس ايه الفايده و الغلاء مستمر انا مثلا باخد من والدى ووالدتى مرتب اضافى على مرتبى رغم امنه كويس<br />و صدقونى عمر نا ما هنحس بقيمه اى فلوس بنمسكها طول ما الهوس الغلائى مجتاح البلد كده<br />ربنا يجازى اللى كان السبب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "عجبى"
author = "محمد عامر"
posted = "2008-01-02"
text = "بجد حلوه من الاخ ابو السعود 3000 جنيه اول تعيين يابلاش ياعم حرام عليكم بقى منتوا عايشيين ميه ميه اهوه وهناك نيه واقولها للعالم اجمع نعم هناك نيه فى تحقيق العداله الاجتماعيه يعنى بلدك بتفكر فيك اهوه بالدليل القاطع.<br />بس المشكله اننا ياجماعه مش حاسييين بالنمو الاقتصادى اى نعم مصر فيها نمو اقتصادى عالى وملفت بس الطبقه الكادحه من الشعب (الشعب كله)لسه محستش بيه ان شاء الله فى نيه مؤكده انهم يحسوا بيه وان شاء الله هقابلكم كمان 600 سنه كده وهوريكم انه الناس حست بالنمو ولا لسه ومن دالوقتى ياجماعه فكروا لما هقابلكم كمان 600 سنه هتداروا وشكوا منى م الكسوف ازاى وعجبى"
archived = "2010-03-14"
capture_url = ""

