subject = "البلد كلها محتاجة كادر خـــــاص"
author = "ابوصالح(صحفى)"
posted = "2007-12-07"
text = "فعلا البلدكلها محتاجة كادر خاص قضاة ظباط صحفيين مدرسين موظفين فى كل الاتجاهات محدش مرتبة مقضية حاجة غريبة والدولة والحكومة تعرف ذلك جيدا لكن للاسف سايبة اليرتشى يرتشى واليبتز الاخر عادى والعيعرف ينصب على التانى شغال واليقتل اخر عشان 5جنية والحكومة ماشية بمبدا خلى الكلاب تعوى والقافلة تسير والمهم عندهم انهم عايشين احسن عيشة هم واولادهم واحفادهم وخالص والباقى انشالة ياكل من الزبالة مش مهم انا ومن بعدى الطوفان للاسف 90%من المسئولين عن هذة البلد محتجسن للتغير وفورا قبل منغرق اكتر فى الخراب والفساد والرشاوى... وشكرا"
archived = "2010-03-14"
