subject = "مات أبو الصناعة"
author = "دينا"
posted = "2008-01-26"
text = "صدمت عندما قرأت خبر وفاة أبو الصناعة المصرية و رئيس وزراء مصر السابق الدكتور عزيز صدقي الذي عينه الرئيس عبدالناصر وزيرا للصناعه و هو عمره 36 سنه فقط<br />لقد توفي و هو يرى أبناءه تباع واحد تلو الأخر و هذا علي حد تعبيره في برنامج العاشره مساء مع مني الشاذلي عندما قال أن كل مصنع بناه يعتبره أبن له و أنه يتعذب و هي تباع الأن بكل بساطه<br />رحم الله عزيز صدقي فهو أخر الرجال المحترمين و ليرحمنا من بعده"
archived = "2010-03-14"
