subject = ""
author = "احمد المصري"
posted = "2009-12-05"
text = "[quote name=\"عبد الكريم الجزائري\"]رشحت الرقاصة شريهان عشان مصر بلد الثقافة والرقص الشرقي وهز البطن واتخيل البلد بعد تسلم ام الدنيا شريهان الحكم وهي ورئيسة الحكومة ليلى علوي والوزيرات فيفي و يسرا و نجلاء و شرين و و و و.......الخ من الفنانات الفاتنات التي تزخز وتفتخرون بهن ومايجي الصبح حتى تجد طابور كبير من اشباه الرجال من اجل شم رائحتهن فقط اما الرجالة الفحولة من اجل النيك فيمكن لهن استيرادهن حسب طلباتهن :lol: ههههههههه[/quote]<br />لا انت تجيب امك ترشحها احسن علشان الشعب كله يهيص واللي مش قادر علي الجواز اهي امك موجوده وربنا يخليها لشباب مصر"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207034923/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

