text = "[quote name=\"الجزئري الحر\"]اولا هو عندكم رجالة في مصر .اين هو الرجالة اللي بتتكلمو عليهم .عندما تفتحو سفارة اسرائيل كانو فين الرجالة .عندما كانت تقصف غزة بالصواريخ الفصفورية اين كانو الرجالة .حشا الصالحين[/quote]<br />انت تعرفوا منين انت اصلا الكلمة دي ؟؟ ... ياعني انت اللي عملت حاجة انت او بلدك<br />مكلكوا واقفين ساكتين و كلكوا خايفين ... فين الرجالة بقة عندكوا ... مش انتوا عرب برضه؟؟؟<br />يا حبيبي .. فاقد الشيء لا يعطيه<br />.... وكفاياكم بقة تثبتولنا انكم خيبانبن و تعبانين موله ... فاكس جدا الكلام ده والله<br />ياريت تنفض لنفس شوية انت واللي زييك ... وارحمونا بقة من قرفكم<br />مصر معروفه انها بلد الامن والامان و مالناش في البلطجة ... مش زيكوا ... بلد العصباجية والعربجيه ... ودي اقل حاجة والله تتقال عليكم<br />ياعم ... بلا فين الرجالة .. بلا فين النسوان .... بص لنفسك انت الاول ..."
