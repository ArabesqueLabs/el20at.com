posted = "2009-11-25"
text = "لكن ارفض وبشده الموضوع ومين نهى الزينى دى يا ريت حد يعرفها لنا بس البلد دى محتاجة ثورة على مستوى التاريخ الثورة هى اللى بتغير بس يكون لها قياديين صادقيين مش عاوزيين سلطة وبس<br />الضباط الاحرار اللى حررو البلد حتى الان<br />احمد عرابى<br />سعد زغلول<br />وغيرهم من اللى قامو بثورات كانت محور التاريخ حتى الان يااااااااااااااااااااااااااااااااااااااااارب<br />احمى مصر وخلى عيالها تسترجل"
