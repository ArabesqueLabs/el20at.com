subject = "الدور المصري....وآه يامصر"
author = "محمد السيد"
posted = "2007-06-19"
text = "إبراهيم عيسي ...... في الدستور<br />ده المتوقع من حكومة زي حكومتنا النظيفة ..بنظامنا المبارك ...<br />تحالف مصري إسرائيلي فوري و كامل لمواجهة خطر إقليم مقاومة بقيادة حماس ، و خطر تصدير و استيراد إخوان مسلمين بين مصر و فلسطين .<br />2. ضغط مصري رهيب و عصبي على جماعة الإخوان المسلمين فى مصر بالمزيد من الملاحقة و المطاردة و السجن و التحجيم منعاً من استغل أى انتصارات محدودة محتملة لحماس فى مواجهة سلطة أبو مازن أو فى مواجهة الاحتلال لإسرائيلي ، و استباقاً لأي مساندة إخوانية مصرية لإخوان فلسطين .<br />3. استمرار الدور المصري الذى انحاز و تورط مع فتح لتوريط و تفشيل حماس .<br />4. ابتزاز أمريكي أكثر إلحاحاً و ضغطا على الحكومة المصرية فيما يخص الإهمال و التراخي المصري الذى تدعيه إسرائيل و أمريكا إزاء ضعف مصر من تهريب الأسلحة إلى غزة وفتح الأنفاق بين رفح المصرية و الفلسطينية .. سوف تبتز إسرائيل مصر أكثر ، و ستكون مصر أكثر تهورا وتوترا فى ملاحقة أى عمليات تهريب الأسلحة و هدم الأنفاق ، مما سيخلق احتكاكاً حقيقياً و مفتوحاً على احتمالات كثيرة بين حكومة مصر و حماس غزة .<br />5. ستشارك مصر فى حصار حماس بقوة عن طريق منع قياداتها من المرور بمعبر رفح أو دخول مصر ، و هو ما سيجعل حكومة القاهرة بين نارين ، النار الأولى هى قدرتها على لعب دور وسيط و حامل الرسائل بين غزة و رام الله من جهة ، و غزة و تل أبيب من جهة أخرى ، وبين خوفها من ردود فعل حماس إذا ما أدركت أن ساعي البريد يفض الرسائل و يغير فيها و يعيد لصقها .<br />6. ستلعب أجهزة مصرية ضمن أجهزة أخرى دوراً داعماً لتنظيمات دينية متطرفة تكفيرية داخل غزة ،من اجل تشويه صورة حماس و تقديمها باعتبار تحول غزة إلى إمارة إسلامية و طالبان أخرى فى فلسطين ، و هنا تلعب قدرة حماس على ضبط الواقع الغزاوى المفتاح الفاصل لهذا السيناريو بان ينجح و يتمدد أو يفشل و يتبدد .<br />7. من اليوم ورايح ، فإن حماس ستبذل جهدا ضخما ، و يتضخم من اجل تحييد موقف مصر تجاهها و هو جهد تعرف حماس انه فاشل و تعرف حماس انه لا بد من بذله و سيلعب المصريون دورا فى تطمين حماس إلى حياد مصر و هو جهد تعرف مصر انه فاشل و تعرف انه لا بد من بذله .<br />يارب ... مش حاسكت<br />لا لتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\" بس مش أوي كده يعني\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />www.mesh7askot.blogspot.com"
