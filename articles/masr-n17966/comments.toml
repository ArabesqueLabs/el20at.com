[[comments]]
order = 0
subject = "3 ساعات متواصلة واسعة شوية"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "كون ان ذئب مفترس يهاجم امرأة والمرأة تدخل في صراع معه لمدة 3 ساعات واسعة شوية<br />لان الذئب يهاجم بمخالبه وبفمه وكلامها كالسكاكين<br />فممن نقول 3 دقائق وممكن فيه حاجه اسمها حلاوة الروح<br />لما الانسان يلاقي نفسه ضايع ضايع ومفيش فايدة فيه حاجه اسمها حلاوة الروح خلت الست كما ان الذئب انقض عليها هي مثلا انقضت على رقبته وخنقته<br />ولكن معركة من هذا النوع لا يمكن ان تصل الى 3 ساعات<br />3 ساعات دي واسعة شوية"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022003015/http://masr.20at.com:80/newArticle.php?sid=17966"

[[comments]]
order = 1
subject = "تعال شوف النسوان فى بلدنا - بيضربوا بالشوم رجالة بشنبات"
author = "ادهم المحلاوى"
text = "النسوان فى بلدنا لما تحصل خناقة مع الرجالة بتخرج بالنبابيت والشوم تضرب فى الرجالة وفيهم نسوان ماشاء اللة بتلعب تحطيب ومبارزة بالنابوت ولا سيدى الشجاعى<br />كون ان ذئب مسكين وقع فى ايدي واحدة من النوعية دى يبقى وقع فى شر اعمالة<br />ديب مين يا استاذ<br />بالضبط ديتة شومتين على راسة فى دقيقة واحدة يطب ساكت ويسكن القرافة<br />وواحدة منهم مرة نصحتنى انة لما اجى اموت كلب متشرد اضربة بالشومة على راسة بين اذنية - وعلى حسب قولها ضربة واحدة وهيطب ساكت<br />اصلكم مش عارفين النسوان فى البلد<br />دول شطارة واخر جدعنة"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022003015/http://masr.20at.com:80/newArticle.php?sid=17966"

[[comments]]
order = 2
subject = "ذكر الخبر ان الذئب هاجمها اثناء وضعها البرسيم للبهايم"
author = "فلاح"
text = "اولا البرسيم مش موجود دلوقتى<br />دا لسة احنا بنزرعة وامامة شهر ليظهر ويقدم للبهايم<br />احنا لسة بنزرع البرسيم ويدوب وضعنا البذور فى الارض فكيف بتقدم برسيم كبير للبهايم<br />اشك فى الخبر"
archived = "2008-10-22"
capture_url = "https://web.archive.org/web/20081022003015/http://masr.20at.com:80/newArticle.php?sid=17966"

