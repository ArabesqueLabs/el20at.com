[[comments]]
order = 8
subject = "ضربة الجزاء من الكورة الى السياسة"
posted = "2008-12-16"
text = "الراجل الصحفي دا طلع حمار معرفش يشوط الجزمه صح<br />الضرب بالجزمه عقب ضربة الجزاء يعني لما لعيب الكورة بيشوط ضربة الجزاء لازم يخدع حارس المرمى علشان خاطر حارس المرمى يترمي في جهه ولعيب الكورة يرميها في الجهة الثانية فيجيب جون<br />اما الضرب بالجزمه فلازم العكس لازم اللي حيضرب بالجزمه يخدع المضروب بالجزمه ويوهمه ان الجزمه حتيجي في مكان علشان خاطر المضروب يغير اتجاهه في مكان الجزمه<br />وعلى النحو الثابت بالصورة بوش استطاع تحديد انطلاق الجزمه فتفاداها لانه طبق نظرية حراس المرمى بس بالعكس انه لازم يكون عكس اتجاه الكورة او الجزمه<br />فكان لازم الصحفي يموه الاول واول ما بوش يوطي كان اداله الجزمه تحت<br />اللقطة جميله اوي اوي اوي بس يا خسارة طلعت اوت<br />بس يا خسارة الصحفي معرفش يجيب جون كان المفروض يموه الاول وكانت جت الجزمه في وش بوش بالضبط<br />يا خسارة ضاع علينا اجمل جون كنا حنشوفه في حياتنا"
archived = "2010-03-14"
capture_url = ""

