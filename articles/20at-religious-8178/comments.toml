subject = "فعلا جميل"
author = "ياسر فتحي"
posted = "2008-02-06"
text = "فعلا جميل خاصو انه بيلامس مشاعرنا واحوالنا .. لكن فعلا دينا جميل اوي .. اللي بيخلي مفتاح طهارة القلب مع كل واحد مننا (( التائب ن الذنب كمن لا ذنب له )) وبيخلي مشاعرنا هيه علامة المفتاح ده من غير ما نحتاج نظريات ولا فلسفات ولا حد يطهرنا (( الندم توبة )) ايوه التدم الحقيقي هو توبة ... كمان ربنا عالم بحالنا وبضعفنا وان مش شرط ان كل واحد فينا يكون زي سيدنا ابو بكر او عمر لكن الهدف الحقيقي ان ربنا يقلبنا وبعف عننا حتى لو كنا اضعف الناس زي حديث الرجل الذي يذنب ويتوب وربنا يغفره ويعود مرة اخرى ثلاث مرات في نهاية الحديث الصحيح ربنا بيقول (( ان هذا العبد قد علم ان له ربا يعلم الذنب وياخذ بالذنب اشهدكم يا ملائكتي اني قد غفرت له )) .. مرة اخرى اشكر محررة المقالة على حسن اختيار الموضوع والصياغة"
archived = "2010-03-14"
