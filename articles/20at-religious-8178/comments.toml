subject = "كُتَّاب عصري لتحفيظ القرآن الكريم"
author = "محمود"
posted = "2008-02-05"
text = "سعت \"قناة الحافظ\" بتوظيف التكنولوجيا الحديثة لحفظ القرآن الكريم وتعليم التجويد والقراءات، بما يوفر الجهد والوقت على الحفظة والمحفظين، وقد اتخذت القناة من الوسطية والاعتدال منهجًا لخدمة كتاب الله، وترسيخ مبادئه، ليكون منهجًا وسلوكًا لمشاهديها اقتداءً بالرسول الكريم- والذي كان قرآنًا يمشي على الأرض-، وتعتمد القناة الأساليب العلمية الحديثة كأقصر الطرق لتعليم مهارات الحفظ وأحكام التلاوة، مستعينة فى تحقيق هذا الهدف بالله أولاً، ثم بكبار العلماء والخبراء فى علوم القرآن، لكنها فى الوقت ذاته لم تغفل الجوانب الحياتية، لتقدم للمشاهد رؤية متكاملة تساعده فى دينه ودنياه.<br />وتدور موضوعات القناة حول: التحفيظ والتعليم علوم القرآن الكريم وأحكام تلاوته وطرق حفظه، إعجاز القرآن الكريم فى كافة المجالات، السنة النبوية المطهرة، توضيح وتبين الشبهات والأباطيل والرد عليها، حكايات الحفاظ والمحفظين، الرسم المصحفى، القرآن والحياة، آداب حفظ القرآن الكريم.<br />بقى أن نذكر بأن قناة الحافظ على القمر الصناعي نايل سات التردد 12360 افقي 27500 3/4."
