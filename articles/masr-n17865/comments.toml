order = 0
subject = "مسيرك يا مرات الابن تبقي حما"
author = "مش ححبك"
posted = "2008-10-09"
text = "الله يرحمها جدتي كانت دايما تقول هذا المثل<br />مسيرك يا مرات الابن تبقي حما<br />المهم في الموضوع ان المرأة عادة لما تكون مرات ابن بتشوف الويل من اهل جوزها ومن حماتها<br />وبعد فترة تبدأ في اخد وضعها ورويدا رويدا تتحول الى حماه<br />وتنسى خالص انها كانت مرات ابن وشافت الويل ويبدأ التاريخ يعيد نفسه ومراة ابنها تشوف الويل<br />فارجو من كل حماه ان تتذكر نفسها عندما كانت زوجة ابن مهيضة الجناح لا حول لها ولا قوة"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042937/http://masr.20at.com:80/newArticle.php?sid=17865"

