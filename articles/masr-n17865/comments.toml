text = "اعتقد ان هذا الحل سينتشر بعد الاوضاع الحالية<br />واعتقد انة حل افضل من الزواج العرفى وعلينا ان نقبل ان نعيش فى اس كبيرة تشمل الحماة وزوجة الابن"
