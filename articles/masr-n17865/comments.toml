[[comments]]
order = 3
subject = "انا اللى طلبت جوزى واترجيتة انة يجيب حماتى عندنا"
author = "نبيلة"
posted = "2008-10-27"
text = "شقة حماتى فى نفس الدور بتاع شقتى هى ست طيبة جدا ومحترمة والولاد بيحبوها اكتر منى ومن ابوهم وبنحس كلنا لما تروح بالليل لشقتها ان البيت بقى كئيب وممل وفمرة روحنا لبنان وهى رفضت تروح معانا قعدنا يومين والتالت ابتدوا الاولاد عياط ولما كلمت حماتى كانت تعبانة من صوتها باين عليها وهى بتنكر مش عاوزة تبوز علينا الرحلة قفلت السماعة ولمينا الشنط وعلى اقرب طيارة على مصر لكم ان تتخيلوا حرارة الاستقبال والفرحة وطبعا ندمنا انها مجتش معانا ومن يوميها وهى العضو الاساس والرئيسى فى البيت انا باحكى التجربة بتاعتى علشان البنات اللى ماتجوزوش لغاية دلوقتى ياخدو التجربة بتاعتى كمثال لانة البنت لما تتجوز حتبقى ام وبعدين حتبقى حمات وبعدة جدة وانا على فكرة سنى 29سنة وعندى تلات ولاد وبنت ومامتى وبابايا ساكنين فى اسكندرية واحنا فى القاهرة"
archived = "2008-12-11"
capture_url = "https://web.archive.org/web/20081211072151/http://masr.20at.com:80/newArticle.php?sid=17865"

[[comments]]
