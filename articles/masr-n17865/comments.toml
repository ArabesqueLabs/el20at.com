subject = "مغرم اخاك لا بطل"
author = "مونى"
posted = "2008-11-02"
text = "انا واحده من الناس اضطريت اعيش ف شقه ف نفس بيت حماتى وكل يوم مشاكل بسبب تدخلاتها اللى ملهاش لازمه ودلوقتى وبعد سنتين جواز كنت اتمنى لوكنت صممت انى مجوزش مع حماتى لكن اللى مصبرنى انى بحب جوزى جدا وظروفنا متسحش حاليا اننا ناخد شقه بره لكن اوعدكم اول اما تسمح هخلع"
archived = "2008-12-11"
capture_url = "https://web.archive.org/web/20081211072151/http://masr.20at.com:80/newArticle.php?sid=17865"

