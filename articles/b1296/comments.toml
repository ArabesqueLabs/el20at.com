subject = "مش فاهمه"
author = "نيفين نيفى نوفا"
posted = "2006-10-01"
text = "الحديث ذكر اركان الاسلام الخمسه<br />و لكن اليس لدرجه لنيل درجه رفيعه جدا كدرجه الشهاده شروط اخرى<br />يا ريت يا فو انيس توضح معنى الحديث او اللى فاهم يفهمنى"
