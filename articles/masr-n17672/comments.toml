[[comments]]
order = 1
subject = "ابعدوا الامن عن الجامعة - خللوا العيال تعرف تتنفس"
author = "مش لاعب"
posted = "2008-09-22"
text = "واية يعنى لما الطلبة تعمل معرض او دعاية او يبقى لهم نشاط<br />اركان الدولة هتهتز<br />معاهم مدرعات وهيروحوا يقلبوا نظام الحكم<br />شوية طلبة عندهم حماس ونشاط وطاقة وعايزين يمارسوا حياتهم فى حرية داخل الحرم الجامعى<br />لية نخنق الناس ونقيد حركتهم<br />انا مع الحرية الكاملة للطلبة ايا كانت اتجاهتهم<br />ولكن خارج اسوار الجامعة ممنوع التظاهر"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233357/http://masr.20at.com:80/newArticle.php?sid=17672"

[[comments]]
order = 2
subject = "هل الجامعات انهل العلم ام للانخراط فى دهاليز السيا"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-23"
text = "ارجو ان اجد الاجابة الصادقة؟؟؟<br />هل الجامعات اماكن لتلقى العلم ام اماكن للانخراط فى السياسة؟<br />افيدونى يرحمكم الله"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233357/http://masr.20at.com:80/newArticle.php?sid=17672"
