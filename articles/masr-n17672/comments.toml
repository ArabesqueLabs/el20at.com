[[comments]]
order = 0
subject = "ولوحظ انتشار أفراد من أمن الدولة في الحرم الجامعي،"
author = "مش كاتب"
posted = "2008-09-22"
text = "لعبة سخيفة اسمها عسكر وحرامية<br />مش عايزين يكبروا ابدا<br />حيفضلوا طول عمرهم عيال"
archived = "2008-09-27"
