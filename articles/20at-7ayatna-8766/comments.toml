subject = "رسالة إلى الأخ الكويتي"
author = "عاشق فلسطين"
posted = "2008-04-14"
text = "أخي الحبيب , أنا لا أقول لك إلا الله يهديك بس , لأني قلت الحقيقة والصدق وما سبيت ولا شتمت , لكني لن أتنزل إلى مستوى<br />الكلام الهابط الذي برسالتك , لأني فلسطيني رغم أنوف الحاقدين الكويتيين والخليجيين , أنتم الذين تقولون وتأكدون بأن القدس<br />إسرائيلية وليست فلسطينية , لكن القدس فلسطينية غصب عن الكل الكويتيين ورغم أنوف آل الصباح اليهود , أنتم الذين تعاونون<br />اليهود وعاونتم أمريكا على الشهيد صدام حسين رحمه الله , ومن عاون اليهود والمشركين على المسلمين فقد كفرا كفرا أكبر<br />حبيبي , فلسطين تارج راسك وراس كل كويتي وخليجي وعربي , فلو سمحت لا تغلط علينا بعد هيك بخاف أمسح فيك الأرض<br />وبارك الله فيك .........."
