text = "إلى الفلسطيني الخايس هاذ روح بلادك يا خون إسرائيل مالت عليك وعلى ويهك يا ولد الحرام ؟؟<br />أنت لو فيك خير كنت متقعد بالمواقع كنت على الأقل بتحرر بلادك من الصهاينة يا قواد ..<br />بس تصدق خير سو اليهود فيكم .. نكلوكم وشردوكم وخلوكم بدون أصل يا جواسيس<br />باعوا بلادهم لليهود .. وحطوها بظهورنا _ نحن العرب _<br />اشكره واحد ضايع وماعندك أصل"
