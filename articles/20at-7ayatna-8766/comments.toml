[[comments]]
order = 23
subject = "شكر وعرفان للاخت الإماراتية ( ح مشعل )  .."
author = "محمد نواف الحمدالله ..."
posted = "2008-04-24"
text = "شكرك جداً أختي . وأكيد مثل ماقلتي كل الناس خير وبركه .. ومافي حد أحسن من حد .. كلنا ولاد تسعة ( مثل مايقولون ) .. وكما قال خير خلق الله تعالى _ محمد _ صلى الله عليه وسلم : (( لافضل لعربي على عجمي إلاّ بالتقوى والعمل الصالح )) .. إذا معيار ومقياس التفاضل القائم بين بني البشر هو \" التقوى \" .. \" والعمل الصالح \" ..<br />والله يجي من الله حياه الله ..<br />وبالنهاية كلنا عرب/أخوان/حبايب/أهل/.. ملسمين كنا أو مسيحيين ( فهذا ليس مهماً ) .. المهم هو أن نعرف كيف نتعايش ونيا ونعيش مع بعضنا البعض بعيداً كل البعد عن كل ماينغصنا ويثير المشاحنات والحساسيات بينا .. والاهم من ذلك أن نبتعد لا وبل ننسى أن يكون بيننا تمييز عنصري .. وتعصب قبلي أو عشائري ..<br />وأنا قبل أن أكون إنساناً أردنياً ( بدوياً ) .. أنا فلسطيني ( همي همهم ) .. أنا أردني .. أنا سوري .. أنا لبناني .. أنا عراقي .. أنا إماراتي .. أنا كويتي .. أنا يمني .. أنا سعودي .. أنا عماني .. أنا بحريني .. أنا قطري .. أنا مصري .. أنا سوداني ... الخ<br />وبالنههاية .. أنا إنسان عربي *** مسلم *** شريف *** حـــــــــــــــــــــــر ..<br />شكراً لك أختي .. وعلى أسلوبك الرائع .. وأنتم شعب لطالما عرفنا عنكم طيب أصلكم .. ومعندكم الأصيل .. وشهامتكم .. ونخوتكم .. وعزتكم .. وكل شيء .. وهذا كله ليس بغريب عليكم .. وكيف لا ؟؟؟ وأنتم من أبناء المغفور له _بإذن الله تعالى _ الشيخ / زايك بن سلطان رحمة الله عليه .. هذا الرجل وبإيجاز شديد .. الكلمات لاتوفيه حقه ..وهو إنسان يصعب وصفه ..<br />إنسان لطالما حمل على عاتقه هموم الوطن أجمع .. والحمدلله _ تحقق مراده وأمله _ فجاء من بعد ذلك . خير خلف لخير سلف .. الشيخ / خليفة .. ليكمل من بعد أبيه مسيرة التقدم والنهضة والنجاح والتوفيق ...<br />حماكي الله يا إمارات وكان الله معك دائماص وأبدا .................<br />شكراً"
archived = "2010-03-14"
