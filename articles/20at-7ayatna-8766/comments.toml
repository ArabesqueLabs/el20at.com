text = "انا بس دخلت اعقب على موضوع البداوة :-)<br />بس بخصوص باقي الكلام و الله يا جماعة الخير ترا كلنا مسلمين و اخوان و خلوا الكلام بينا طيب .. و الله الرسول عليه الصلاة و السلام (صلوا عليه) ما اظن يفرح لو شافنا نقول لبعض هالكلام ..<br />اتقوا الله في بعضكم البعض .. و نحن كبار و نعرف انه كل مكان فيه الشين و الزين و حرام التعميم<br />كلنا اخوان الله يجمع بينا على خير<br />تحياتي للجميع جميع المسلمين"
