[[comments]]
order = 13
subject = "إلى عاشق ....."
author = "محمد نواف الحمدالله ..."
posted = "2008-04-20"
text = "وللمرة الثانية على التوالي يسب ويشتم هذا النكرة (( اللاشيء )) .. وأنا أتركه على راحته ليسرح ويمرح كيفما شاء وأراد ..<br />هو حر .. ولكن الشجاع من سيصمد ويبقى للنهاية وإلى آخر نفس .. إلى أخر رمقة .. إلى أخر قطرة دماء تسيل .. إنني وبكل صراحة ماعدت مهتماً لهذا المغفل الأحمق .. الذي إذا ماكتب تعليقاً أحس بأنني أقرأ كلمات تفوح منها الرذالة والقباحة والسيئة .. أحس بأنها كلمات وعبارات تدل على أن كاتبه طفل لايزال صغيراً لايعي ولا يفقه بالحياة شيئاً .. منذ البداية وأنا أحاور وأناقش نفسي لعلي أجد سبباً مقنعاً ومفحماً وراء تقصد هذا الشخص للأردن .. ولكنني فسرتها وحللتها ومحصتها من كافة الجوانب وعل جميع الأصعدة .. ولم أجد حلاً يقنعني ويرضيني .. إن هذا الشخص أبى القدر إلاّ أن يخلقه مغفاً سفيهاً أحمقاً ..<br />صدقاً .. لقد ثبت لي بالدليل القاطع بأن هذا المرء سلاحه ضعيف جداً ( سلاح المسبات والشتائم )، على النقيض تماماً مع السلاح الجوهري ( سلاح ضبط النفس والرد بأسلوب محترم ) ..<br />حاولت .. وحاولت .. وحاولت أن أوجهه وأرشده إلى الهداية والصلاح .. ولكن لاحياة لمن تنادي .. كأنني أقوله لصنمٍ أو لحائط .. فهو لايسمع ولايرى ولايتكلم .. وبعد تلك المحاولات التي باءت بالفشل .. لعل وعسى أن يرجع إلى جادة الحق والخير والعدل ..<br />ولكن، يبدو لي .. وقد تبين لي فعلاً بأن العصبية القبلية أو التميييز العنصري متأصّل في أعماق أعماق قلبه .. وأن تلك الجذور نمت وكبرت معه إلى ماوصل إليه _ الآن _ .. وطبعاً، هذا ليس بالأمر الهيّن أن تقنعه بأن الذي يفعله خاطئ .. ولا أساس له من الصحة .. وأن الذي علمه وحفظه ولقنه تلك الدروس على مضى أعوام قد سبقتها يحمل فكره خاطئة ومغلوطة مائة في المائة ..<br />إنها ليست المرة الأولى التي يسبني فيهل هذا المحترم .. ولاهي المرة الثانية ولا الثالثة .. الخ<br />إنني لا أنكر بأن المدعو ( عاشق فلسطين ) له مسبات وشتائم أنا حقيقةً أخجل واستحي من قولها .. ولكن هي البيئة التي نشأ وترعرع بها منذ الولادة وإلى الوقت الراهن ..<br />هو يسب ويشتم .. وأنا لاأسب ولا أشتم ..<br />هو يهين ويحط من كرامتي وشخصيتي .. وأنا لا أهينه ولا أحط من كرامته وشخصيته ..<br />هو يسب شرفي وعرضي .. وأنا لا أسب شرفه وعرضه ..<br />هو يتلفظ بأقوال نابية عن بلدي ( الأردن ) .. وأنا لا أتلفظ بأقوال شيئه عن بلده ( فلسطين ) ..<br />هو لايعجبه أحد، ويكره الجميع .. ويردد دائماً مقولة (( اللهم نفسي .. اللهم نفسي )) ..<br />أردتها أن تكون كذلك فلتكن كذلك ... !!<br />ولكن ثق تماماً ..<br />وتيقين عين اليقين ..<br />بأنني لن أنسى في يوم من الأيام الكلام الذي كتبته في تعليقاتك عني وعن بلدي الحبيب ( الأردن ) ..<br />وسوف يبقى كلامك محفور في قلبي ولن تمحوه السنين مهما طالت فيني ..<br />وسوف أرد الصاع صاعين ..<br />كما بدأت بالشكامل والمصائب ( التي انات بالأساس في غنى عنها ) .. فتحمل ماسيأتيك مني يا عاشق ..<br />صدقني (( لن أرحمك )) ..<br />وأنا جازم بأنك لست سوى شخص يتفوه بكلام هو أكبر من حجمك بكثير .. وهو طبعاً ليس في صالحك ..<br />وقد تتحول النعمة بالنسبة لك إلى نقمة .. فتحمل يا عزيزي ..<br />وسوف ترى بأم عينك .. من هو (( الشراري )) !!!<br />وللحديث بقية ،،،<br />شكراًَ<br />وتحياتي للجميع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 14
subject = "والله خوفتني كتير بتهديدك يا أخ محمد نواف الحمد ال"
author = "عاشق فلسطين"
posted = "2008-04-21"
text = "محمد نواف الحمد الله , أولا تهديدك هادا ما بعنيلي إشي , دور علي زي ما بدك , أنا والله لو بعرف وين مكانك بس , لأجيب 60 واحد بعرفهم لأخليهم يعرفوك مين إحنا الفلسطينية , ورب النعمة بس لو أعرف وين هو مكانك , لأخلي تهديدك هدا ينفعك , إنتا بس جالس بتتكلم وتهدد وتعمل اللي بدك ياه من ورا الكمبيوتر , وأنا هده العمايل عمايل خوافين وجبنا , أنا بكره الناس اللي زي هيك , بدي كلام بفعل مش كلام بدون فعل , حبيبي , بقدر أهكر كمبيوترك , أنا أكبر هكير بالياهو يا حبيبي وسرقت الآف الإيميلات , فلا تستبعد يوم من الأيام إني أكون مستولي على كمبيوترك وأضربلك ياه , خلاص حبيبي , ولا تحسب إنو تهديدك هدا خوفني , بالعكس بل هو لم يهز شعرة من شعرات بيضاتي , وشو بدك تعمل إلي بالضبط يعني , آه , بدك تضربني بالكمبيوتر ولا كيف , والله العظيم ما خفت , خلاص حبيبي , انتبه لحالك وضب حالك بالبيت , بلاش أطلع روحك بإيدي , فااااااهم<br />مش خاااااااااااااااااااااااااااايف , إلي ظهر وسند يا حبيبي طيب"
archived = "2010-03-14"
