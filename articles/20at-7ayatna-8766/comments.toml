[[comments]]
order = 27
subject = "سلااااما"
author = "ح مشعل الامارات"
posted = "2008-04-29"
text = "شكرا يا اخ عاشق<br />انا مب محتاجة احلف و لا غيره ، و انا يوم اكتب كلمة اكتبها خالصة لله سبحانه و تعالى ان شاء الله ، و انا ما سبيت فلسطين بالعكس انا احب فلسطين و حتى يوم انت تكلمت و عممت عن الخليجيين كلهم انا ما رديت عليك و سبيت فلسطين و اهلها ، لأنه هذا مبدئي ، اللي يسب و يشتم يمثل نفسه ما يمثل بلده ..<br />و ما اعرف عن اي تهكير تتكلم و لا غيره ، او اي ايميل حتى ..<br />انت زعلان ان الناس تسب فلسطين كلها و انت قاعد تسوي نفسهم بالضبط ، هاي ثاني مرة تلمح بالسب علي بس لاني من البدو و قاعد تهين البدو كلهم ، الله يصلحك ..<br />اما اذا كنت فعلا بتقدر تجيب الاي بي أحب ابشرك اني و لله الحمد اعرف نفسي عدل و بتكتشف اني انا اللي حطيت رد في الموضوع ارفع راسك و هذا الرد بعنوان (استغفر الله ) و حطيته امس من بعد ما انصدمت انه القذارة في الكلام لازالت مستمرة .. على الرغم من انه في ناس طيبة تحاول تسكر الموضوع بس الابصار معمية ..<br />و لاحظ ان ما انكتب رد الاماراتي هناك الا بعد ما كتبت انا هني هالردود ، و احمد ربي اني ما سبيت حد ، و ما انحط الرد هذاك هناك تحت اسم اماراتي الا عشان يسوون حساسية و تزيد مرة ثانية المشاكل و السباب و ما اريد ادخل في تحليلات من اي جنسية هذا اللي كتب الرد لأني بكون قاعدة اسوي مثلك بالضبط<br />هاي معلومة عطيتك اياها من غير اي بي ولا شي لأنك ما تقدر تجيب الاي بي بكل الاحوال ، و اقابل ربي ان شاء الله و انا فخورة اني ما وسخت ايدي و كيبوردي بالمشاركة بهذاك الموضوع الا بهالرد الوحيد اللي اسمه استغفر الله ... لأنكم وصلتوا الموضوع هناك انه واحد مسيحي كلب يتطاول على كتاب الله الكريم و يتفرج عليكم تتساببون و هو يضحك الحقير<br />و ايضا مش محتاجة اني اقولك هالكلام ، لكن فعلا وضع العرب يحبط اذا هذا مستوى تفكيرهم ، و اذا مفكر كل انسان مش فاضي الا انه يدخل في سباب و بعدين يسوي تحليلات منو متخبي تحت اسم شو<br />اكثر من نصف الردود تكون لناس يكتبون انهم من بلد و هم اصلا مش من هذا البلد ، بس عشان يسوون حساسيات و يكبر السب و يشمل دول ثانية و انا شفت ردود من اللهجة اقدر اقول انه مب اماراتي لأن الاماراتيين ما يقولون (لمن) هاي اصغر غلطة عنده ،، بس هالشي ما يهمني و ما يخليني اروح ارد عليه و اقوله انت مش اماراتي و غيره ، لأنه ايضا مبدئي اني ما تجادل مع ناس اسلوبهم حقير و في النهاية هذا رايه الشخصي و لا يشرف الامارات و لا يعبر عنها اصلا ..<br />تحيات لك يا اخي عاشق ، و اعلم ان كل كلمة الانسان محاسب عليها ....<br />انا الغلطانة اني اصلا دخلت في هذا الموضوع لأنه فعلا ( و إذا خاطبهم الجاهلون قالوا سلاما ) كان لازم اطلع من موضوعكم هذا بدون حتى ما اكتب نصيحة التجاهل هو احسن حال ...<br />سبحانك اللهم و بحمدك اشهد ان لا اله الا انت استغفك و اتوب اليك"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 28
subject = "رسالة مستعجلة لكل من :- ح مشعل ، عاشق فلسطين ....."
author = "محمد نواف الحمدالله ..."
posted = "2008-05-01"
text = "قبل كل اشي أنتا واحد ميؤوس من شافئك .. ومستحيل تصير بني آدم لأنك فقدت الأنسانية الأسمى .. وقاعد غم بتلفقني بتهم أنا ما إلي دخل فيها من الأساس .. وبعدين تعال لهون .. أنات كيف بتحكي مع الأخت الإماراتية ( ح مشعل ) بهذا الأسلوب الفظ .. والسلوك المشين .. والاخلاق الهابطة .. والكلام الوسخ اللي بنقط منك ...<br />عيب ولك استحي ع دمك .. يعني عاملناك بالحسنى .. واحترمناك وحطيناك على راسنا قبل عيونا .. وقلنا معلش الزلمه معصب وتفكيرو شويه مش ع بعضو .. خلينا نوقف معاه ونساعدو ..<br />لاهي مره ولامرتين ولا ثلاث ولا حتى عشرة ...................<br />انتا نازل سب وشتم وتهديد ووعيد .. ورح أسوي ..ورح أعمل .. ورح أفضح .. ورح أبهدل .. ورح انتقم ... ألخ<br />ياحبيبي .. شو مالك .. تراك عليت كثير أنتا .. !!<br />ومش مصدق حالك .. !!<br />حبيبي مش خايف .. لا منك .. ولا من اللي أكبر منك .. ولا من كل أهل فلسطين .. أنا مابخاف إلاّ من اللي خلقني .. سامع منيح ولا لأ ؟؟؟؟؟؟ !!!!!!!!<br />ولك وحياة أبو اللي خلفك هالرقبه مابشيلها الإّ اللي حطها .. ماشي !!<br />تا أشوف لوين بدك توصل ؟؟؟؟<br />وينك ؟؟<br />(((( أعلى ما بخيلك أركبووووووووووووووووو )))..<br />أختي ( ح مشعل ) .. لاتزعلي ..وحقك عيلنا .. ترى حنا حطيناكي في موقف لاتحسدي عليه الصراحة .. ودخلناكي بمشاكل ومصايب إلها أول لكن ما إلها آخرر ..<br />سامحيني أختي .. وأتمنى إنك ماتوخذي على خاطرك علي .. لأني والله حاولت أفهمو لهذا البني آدم . ولكن \" عبس \" إنو يفهم .. خلص<br />حصل خير ..<br />وأكرر أسفي مرة ثانية ...<br />تقبلي مروري المتواضع ..<br />وتحياتي للجميع ،،،"
archived = "2010-03-14"
capture_url = ""

