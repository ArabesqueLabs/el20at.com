[[comments]]
order = 16
subject = "و نعم"
author = "ح مشعل الامارات"
posted = "2008-04-21"
text = "حيا الله البداوة و أهلها<br />و نعم و نعم و الله<br />كلمة بدوي عمرها ما كانت مسبة ، و الله تكفي وقفتهم اهل البداوة وقفة فهود :-)<br />و البدو في معظم الدول العربية في الخليج و الاردن و حتى فلسطين .. و يجمع بينهم الخصال و الافعال<br />حيا الله البدوي على راسي و الله ..<br />يا شبيه هذاكـ ما أدري يا سميه<br />يا عمار الدار ما أدري يا دماره<br />كان تبغى منسبي اصبر شويه<br />كانكـ انته حر تكفيكـ الاشاره<br />ايه انا بنت الحصان اليعربيه<br />بنت من ياخذ على الخيل إستداره<br />بدويه و أفتخر إني بدويه<br />يوم بعض الناس جنب عن مساره<br />و سلامتكم من بدو و حضر"
archived = "2010-03-14"
