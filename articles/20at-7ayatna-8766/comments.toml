text = "اشكر الجميع وخصوصا اختي ح مشعل الامارات وعشاق فلسطين اخوانا واحب اضيف ان بدو الاردن هم معروفين وهم سبع قبائل كبيره اولها قبيلة بني حسن قبيلة المليون تسمي وثانيها قبيلة حمر النواظر بني صخر الصخريه وثالثها قبيلة بني عباد العباديه ورابعهما عشائر بني حميدة وخامسهما عشائر البلقاويه وسادسهما قبيلة بني عدوان وسادسهما قبيلة الحويطات وهذه القبائل تكن الاحترام والتقدير لكل العرب وبالنسبه للاخ عاشق فلسطين احب اضيف وهذا الكلام من اجدادنا اخذناه وللعلم ان اكثر قبائل السلط اتت من فلسطين ومن نابلس وهي ذات طابع حضري وريفي اكثرها وليسوا ببدو ونحن البدو لم نسب احد منكم والسلطيه انتمائهم للاردن من اجل ذلك احنا حبيناهم ونحترمهم جدا كما نحترم اهلنا بالخليج الشقيق لانهم قريبين لقلوبنا جدا"
