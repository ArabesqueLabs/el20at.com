subject = "أدعو له بالهداية والصلاح يا أخوان .. فهو في أمسّ ا"
author = "محمد نواف الحمدالله ..."
posted = "2008-04-22"
text = "إلى عدو النجاح .. وصديق الفشل ( عاشق فلسطين ) .. سوف أقول لك بضعاً من الكلمات، لعل وعسى أن تفلح معك ..<br />أولاً أنت تشكو من علل وعقد نفسية كثيرة لامجال لحصرها البتّه، تعاني من مرض خطير جداً إلا وهو جنون العظمة والإضطهاد، بإختصار شديد هذا المرض يصيب الإنسان عندما يشعر ويحس بأنه شيئاً كبير جداً ( ملك، وزير، أمير، شيخ .. الخ )، وهو في الواقع ليس إلاّ قزماً من الأقزام السبعة ! .. هو يدري بمرضه المستعصي الذي لامجال للشفاء منه .. فلقد فات الأوان .. وذهب القطار من غير عودة .. وبالتالي فقد ترسخ، وتأصل، ونمو، وكبر فيه هذا المرض ( مرض جنون العظمة والإضطهاد ) .. وإنني إنشاد الأخوة الكرام من موقعي هذا ( الإمارات المتحدة ) بأن يدعو لـ ( عاشق فلسطين ) لأنه وبصراحة يشكل عبأً وحملاً ثقيلاً عليه وعلينا .. فنحن ليس بمقدورنا أو بإستطاعتنا أن نشفسه من سقمه .. ولكن الامر عائد برمته إلى الخالق _ عزوجل _ ..<br />أقول لعـاشق فلسطين .. وأقولها وبكل صراحة .. وأجزم بان هذا المرء ليس بصاحي على ذاته .. هو نائم .. ونائم في سبات عميق .. هو يعاني .. ويعاني .. ومازال يعاني .. من مرض الذل والهوان والإستكبار والتكبر ..<br />للأسف الشديد لقد طغت الذات العليا على ذاته فمن الممكن في يوم من الأيام أن تجده في مستشفى المجانين .. ومن ون سابق إنذار ..<br />وأنا هنا للمرة المليــــــــــــــــــــــــــــــــار ( وإلى مالانهاية ) لن أرد عليه .. لأنه لو كان يستحق الرد لرددت عليه . ولكنني واثق بأنه إنسان متزعزع نفسياً .. فقد فقد توازنه .. وها هو الآن كما المجنون .. يلهث وينبح .. على أمل أن يلقى عظمه يسد بها فمه الذي يسيل منه اللعاب بغزارة ... وها هو ينتفض من مكان لآخر .. لعله يهدى ويستقر ويثبت في مكان محدد ..<br />ولكن هيهات !!!<br />لا أعرف حقةً .. هل هو هكذا فعلاً . أم أنه يتظاهر .. ؟!<br />أمره غريب هذا الفتى .. وتفكيره بالدنيا عجيب .. ؟!<br />والله لو كان الأمر بيدي لوددت أن أساعده وأعوانه في مصابه الجلل .. ولكن ( ما باليد حيلة ) .. ؟!<br />اسمع يا هذا ( عاشق فلسطين ) .. إذا أنت تحسب بأنني ساكت وجميع الكلام الذي قلته في تعليقاتك السابقة مردوده سلبي عليّ .. فأنت مخطئ يا فتى .. ؟!<br />أنا أريد أن أريك ماهي شخصيتك .. وكما هو جلي من خلال تعليقاتك الواهية .. بأنك لست طبيعياً ( والله أعلم ) ..<br />لأنك لو كنت طبيعياً لما لجأت إلى السب والشتم .. ورفع صوتك ( كالكلاب المسعورة ) .. ؟!<br />.. ما أكثر الذين يقولون مالا يفعلون .. ما أكثرهم !! وأنت منهم يا ( عاشق فلسطين ) .. !!<br />تصرخ وتصرخ وتسب وتسب وتشتم وتشتم وتتعالى وتتعالى كأنك فرقدٌ باقٍ إلى أبد الآبدين .. !!<br />... وأما بالنسبة للأخت الإمارايتة ( ح مشعل ) .. فشكراً جزيلاً لوقفتك الرائعة .. وإطراءك الطيب ..<br />وصدقاً .. البدو هم الرجال .. وهم مصانع الأسود ..<br />......... للحديث بقية<br />تحياتي للجميع ،،، ( لو لم أكن بدوياً .. لوددت أن أكون .. )"
archived = "2010-03-14"
