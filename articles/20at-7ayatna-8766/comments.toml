text = "بالمختصر المفيد المفيد المفيد >;>;>;>;>; البدوي هو الذي تربى على :<br />المنيكة والممحنة والنخولة والشرمطة والبعبصة وفتح الأطياز والدعرنة والوطونة والتعريص السقاطه والسفلنة والحقارة والهمجية والحيونة والبجمية والنورنة والسفالة والعمالة والتحشيش والتسكير والعربدة وقلة الحيا والندالة والنصب والإحتيال بس (فيض من غيض , وما خفي كان أعظم) بكفى هدا هو البدوي بدكوا أكتر من هيك ؟؟<br />بكـــــــــــفـــــــــــــــــي هـــيــــــك .............<br />الله يلعن البدو وين ما كانو"
