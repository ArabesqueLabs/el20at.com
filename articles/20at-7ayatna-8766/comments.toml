[[comments]]
order = 7
subject = "رسالة إلى الأخت _____ نوال ______"
author = "محمد نواف الحمدالله ..."
posted = "2008-04-16"
text = "رسالة إلى الأخت نوال .ز أختي لاتستغربي ولاتندهشي من الشعب الفلسطيني الناكر للجميل والفضل .. يعني وبالعربي كده وماخفي كان أعظم ..<br />هؤلاء هم الفلسطينيين في بلادهم أو خارج بلادهم .. كل حياتهم مصايب ومشاكل .. كل فلسطيني وين ماراح في أي بلد عربي أو أجنبي نشر الفوضى والفساد والخراب والدمار ( وأقرب مثال على ذلك الأردن .............. وغيرها كثير ) ..<br />يعني يا أخت نوال أنا مش عارف شو بدي أقلك عنهم . أنا شخصياً مابقول هالكلام لأني غيران منهم ومعصب منهم .. لا بالعكس تماماً أنا هاي نظرتي ومبدأي فيهم .. ومش بس أنا لااااااااااااا في ناس كثير مابحبو الفلسطينية .. ع فكره الواحد مايحط بذمتو إنهم كلهم وسخين وغجر ونور وبجم وحوش .. ولكن الأغلبية العظمى منهم هيك .. هاذ إذ ماكان بالمية (99.9%) ..<br />المشكلة إنو بتخبى ورا الإسلام .. والله ماخرب الإسلام وشوه صورتو غيرهم هذول اللي بقولو ومابفعلو .. بس يلا كل واحد بعمل بأصلو .. وكل إنسان بعبر عن البيئة اللي عايش فيها .. أنا لو بدي كنت من زمان بهدتلو وسبيت عليه ولعنت أبو شرفو ..<br />ولكني ابن عالم وناس .. وأهلي محترمين علموني إنو مهما اختلف وجهات النظر وتعددت الآراء واختلفت .. فهذا كلو وغيرو لايهم بتاتاً ..<br />لإنو النسا أجناس .. وكل إنسان ضمن قدرتو .. وبحدود طاقتو .. وعيب على الإنسان يسب على أخوه الإنسان مهما كان السبب !!!<br />لأن الله سبحانه وتعالى قال في كتابه العزيز (( وجعلناكم شعوباً وقبائل لتعارفوا إن أكرمكم عند الله أتقاكم )) ..<br />يعني أخت نوال ومن الآخر أنا بهنييكي على شخصيتك وعلى تفكيرك اللي صار مثلو بهذا الزمن قليل بل ويكاد أن يكون معدوماً ..<br />ولكن لعل وعسى أن يهدي الله جميع الاخوان .. ويثبتهم على الطريق القويم السديد .. اللي فيه خير وبركه وهداية وصلاح إلهم ولغيرهم .. آمين يارب العالمين ..<br />ومرة ثانية كل شكري وتفديري واحترامي للأخت نوال .. والله يكثر من أمثالك أختي ..<br />وإنتي على فكره مهما قلتي وحكيتي عن هؤلاء القوم فسوف تجدينهم صمٌ بكمٌ عميٌ فهم لايفقهون<br />تحياتي للجميع .."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "رسالة شكر للأخت نوال وكل خرى يا محمد نواف الحمد ال"
author = "عاشق فلسطين"
posted = "2008-04-16"
text = "السلام عليكم ورحمة الله وبركاته , إنتا يا محمد نواف الحمد الله ما في مكان إلا ووسختو بكلامك الحقير التافه , أخت نوال , بوجه شكري الخالص إلك والله , على فكرة , سيبيكي من هدا المنافق , هدا مرة بمدح شوية بمسح بكرامتك الأرض يا أختي , واحد حيوان بجمي حقير , جالس بغلط , لولا الله ثم إحنا يا كلب يا بن الكلب كان الأردن زمانها مخلصة , ولك إحنا اللي عمرنا الأردن وبنينا فيها ورفعنا مستواها الإقتصادي وخلينا سمعتها متل العلالي بالعالم كلو , لكن الأردنيين الخرى الكلاب أولاد الكلب المخريين المخزيين<br />المتفوف عليهم المدعوس عليهم , يا شيخ والله لأشرشحكم بالموقع كلو يا اردنيين يا أولاد تسعمية كلب , وحتى الكلب والله أشرف منكو وأنظف منكو لأنو الكلب حارس أمين , مش زيكو خونة مرتزقة عملاء جواسيس منحطين سفلة لأبعد الحدود , لاتنخدعوا يا عالم بهالأردنيين , لأنهم أكلب شفتهم بحياتي على وش الأرض , ((((عامل لي حالك محترم يا كلب , اخوتي , سووا بحث في موقع عشرينات واكتبوا :<br />ارفع راسك إنتا فلسطيني , وشوفوا التعليقات المكتوبة بالصفحة , شوفو مين بدأ بالسب عشان يبان الحق من الباطل ..)<br />وفلسطين أولا أولا أولاغصب عن كل الأردنيين والعرب أجمعين ......"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "وكما قلت لك عنهم ( شوفي تعليق المحترم عاشق ......."
author = "محمد نواف الحمدالله ..."
posted = "2008-04-17"
text = "كما ذكرت لك لاحقاً .. وأسلفت بذكري عن هؤلاء القوم .. فكما وصفتهم لكِ .. وأكبر دليل على ذلك تعليق المحترم عاشق فلسطين .. فما رأيك أختي ؟!<br />أختي ،،، أردت فقط لاغير أن أضعك في الصورة لتري حقيقة هؤلاء القوم ؟؟؟<br />إذا هم لايحترمون أنفسهم .. فكيف يحترمون الناس ؟؟؟<br />إذا هم لايحبون سوى أنفسهم .. فكيف يحبون الناس ؟؟؟<br />ولكن صدق الشاعر حينما قال :-<br />إذا أنت أكرمت اللئيم ملكته *** وإذا أكرمت اللئيم تمردا<br />وأيضاً فقد صدقت وصابت عين الحقيقة ولامستها تلك الإعرابية حينما نصحت ابناً لها قبل سفره، حيث قالت له :-<br />واذا هززت فاهزز كريماً , يلن لهزتك , ولا تهزز الليئم فإنه صخرة لا ينفجر ماؤها ..<br />وأما بالنسبة لحقيقة الشجاعة للمحترم عاشق فلسطين .. فليست الشجاعة أن يخلو قلبك من الخوف .. وإنما الشجاعة فى السيطرة على الخوف .. ورأس الشجاع لا ينحني مهما كانت الظروف أو الأسباب ..<br />وأنا أرى في عاشق فلسطين الكثير من العيوب والسلبيات التي لاحصر لها ... وكلنا عيوب وسلبيات طبعاً .. وهذا أمر موجود في كل إنسان .. ولكن المرء بطبعه لايرى عيب نفسه ..<br />أنا أنصح هذا المدعو بـــ ( عاشق فلسطين ) أن يحترم نفسه قليلاً لأن هذا الأسلوب ليس إلاّ أسلوب مغلفين حمقى .. وهو منهم بلا شك .. فأعدوه إلى أن يحسن في أسلوبه هذا الشنيع .. وأن يأخذ بعين الإعتبار بأن الناس كلها أخوة وعرب مسلمين كانوا أو مسيحيين .. ولا فضل لعربي على عجمي إلاّ بالتقوى والعمل الصالح .. وكل إنسان يعمل بأصله .. والإنسان المحترم مهما كانت الظروف والأسباب فهو يتمالك نفسه ولا تأثر به هذه الأقوال .. لأنه واثق من نفسه وواثق مما يقول وليس كبعض الناس ( عاشق فلسطين ) .. أنا شخصياً لن أرد عليه .. لأن الرد على تلك الأشكال حرام وعيب وممنوع بالنسبة لي .. فإنني أراهم أمامي لايسون شيئاص على الإطلاق .ز وهم فقط يمثلون أنفسهم فقط لاغير .. ومما لاريب فيه بأنهم مرضاء نفسيون ويعانون من أزمات ومشاكل لاحصر لها .. وهذا بالطبع له الأثر الكبير والمهم في صقل وتكوين شخصايتهم ونفوسهم .. العرب جميعهم ماكانوا في يوم من الأيام أعداء ويكرهون بعضهم البعض .. ولكن الحق والعتب كله عائد إلى الإحتلال الذي عمل على تقسيمنا وتفريقنا عن بعض .. وطبعاً أصحاب النفوس الضعيفة الواهية استجابت لهذا الأمر وخضعت له بلا أدني تفكير كالبهائم تماماً ( مع احترامي للسامعين ) .. وطبعاً لاننكر بأن البعض لم تأثر عليه محاولات الإستعمار والإحتلال وكان كما كان (( إلاّ من رحم ربي )) ...<br />أنا شخصياً وللمرة الثانية والثالثة والرابعة والخامسه والسادسه والسابعة ..... إلى مالانهاية لكي يسب ويشتم على من يشآء وهو حر .. لإنني وبصرحه تامة فإنني لا أراه وكلامه هذا في تعليقه وفي تعليقاته الأخرى لايهز لي شعرة ولايحرك لي قيد أنملة لأنه أنسان مجنون .. وليس على المجنون حرج .. والقافلة تسير والكلاب تنبح .. وقطار الحياة يمشي ولاينتظر أحد ..<br />وشكراً ..<br />تحياتي للجميع ،،،"
