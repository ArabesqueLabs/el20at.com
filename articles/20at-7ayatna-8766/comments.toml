[[comments]]
order = 22
subject = "الطيب منكم جميع و ما عليك زود"
author = "ح مشعل الامارات"
posted = "2008-04-23"
text = "أفااااااااااااااا يا اخ محمد ،، أفا عليك بس ...<br />،، كل انسان يحب بلده و ما يحب حد يقول عنها شئ و في فورة غضب انت و انا و فلان و كلنا ممكن نفقد السيطرة على كلامنا ، كلنا ممكن نعصب و نخطئ و نقول كلام يأذي الناس و يجرح مشاعرهم و نتطاول بدون ما نحس بس كل انسان في داخلة خير و اذا راحت فورة الغضب يرجع للصواب و مايستمر في الخطأ ... .. و الله لو ان السب يحل مشاكل كان ما لمنا حد في السب ،، بس لو كل منا لما يسب يشوف شو نتيجة السباب بس يوقف مع نفسه لحظة .. راح يكتشف انه السب ما جابله غير ضيقة النفس و النرفزة و تلف الاعصاب .. و دخل ناس غيره في مشاحنات ...<br />و الله انا اوجه تحية خاصة لعاشق فلسطين لأنه اسم فلسطين غالي علينا و. اذا اي حد سب فلسطين ترفعوا باسم فلسطين عن ان يذكر في موجة سباب و شتائم بمستوى منحط لأنه اسمها لازم يكون اكرم من ذلك .. و اقول لكل انسان افضل خدمة تقدمها لوطنك سواء كنت فلسطيني اردني مصري اماراتي سعودي كويتي الخ لتفرض احترام الناس له هو ان تحترم اوطان الاخرين و لا تذكرها بالسوء بدون وجه حق ،،، مثل اللي يسب ابو شخص هو بيكون جاب السب لأبوه لأنه هذا الشخص اكيد بيرد عليه بسب على ابوه .. يعني هو اهان ابوه في الاساس ولم يهن ابو الثاني .. و نفس الشئ عن الوطن .. و كل واحد فينا نفس الشئ .. اكرم وطنك انك ما تسب على الثانيين ...<br />و تحية خاصة للاخ محمد نواف هذا من طيب اصلك يا اخوي ما عليك زود والله و ترا كلنا اخوان و كل واحد له الحق انه يحب وطنه و يعشقه و يدافع عنه بعد ... بس احنا غير،، احنا مسلمين و لا يكفي ان نحب اوطاننا لأ لازم و واجب علينا نحب كل بلد مسلم و نتمنى له الخير و نحزن اذا اصابه شر و ندافع عنه اذا تطاول عليه اي شخص :-) و لا يكفي ان ننصح اخواننا لو احسسنا انهم مخطئين بل يجب ان ننصحهم بحب ليعرفوا اننا ننصحهم ليس بغضا و تهجما و انما حبا لهم و العتب لا يكون الا بين الاخوان .. و انت ماشاء الله اسلوبك جميل و رزين و باين عليك مثقف اخي محمد و اتمنى ان ارى مداخلات في كل المواضيع تكون راقية شرواك لكي نستفيد منك و من كلامك<br />تحياتي للجميع و لفلسطين الحبيبة عسى الله يفرج همهم و يرفع البلاء عنهم و يفك الحصار ... و السموحة على الزلل و التقصير"
archived = "2010-03-14"
