[[comments]]
order = 5
subject = "رد على رسالة الأخت : نوال"
author = "عاشق فلسطين"
posted = "2008-04-15"
text = "السلام عليكم ورحمة الله وبركاته , أختي نوال أنا متأكد إنك مصرية , لكن والله إنو المصريين والفلسطينيين زي السمن على العسل<br />وكلنا شعب واحد وإيد وحدة , وما عمري والله سمعت من أي مصري متل الكلام اللي حكيتيه دوبك , الله يسامحك بس , هدا اللي بحكيه , وإنتي بتقولي يا أختي إنو إحنا خمسين سنة معذبين بسبب ماذا ؟؟؟؟ لكن نحن مبتلون من الله سبحانه وتعالى جل في علاه , ولا تخشوا أن يأتيكم يوم أشد من يومنا يعني , وإحنا أهل الجهاد والنضال والمقاومة والشهادة , وأرضنا ارض الاستشهاديين<br />والإستشهاديات , ورح يضل راسنا مرفوع غصب عن كل العالم , والله يسامحك يا أخت نوال على رسالتك هده , برضوا بعيد وبكرر<br />الشعب المصري الشقيق والشعب الفلسطيني أكتر من إخوة ولن نتفارق أبدا بإذن الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "رد على الاخ الكريم عاشق فلسطين مع  التحية"
author = "نوال"
posted = "2008-04-16"
text = "وعليكم السلام و رحمة الله وبركاته<br />اخي عاشق فلسطين ، انا عشان بحب كل المسلمين يكونوا زي السمن على العسل و مش بس المصريين و الفلسطينيين قلت الكلام اللي قلته ، و من كل قلبي عشان انت انسان كويس اتمنى انك برضه تهتم بانه المسلمين كلهم بلا استثناء يكون قلوبهم على بعض لأنه ده الشئ الوحيد اللي هيرجع الامة لمجدها و انتصارها و يقودها لتحرير فلسطين و البلاد المحتلة .. انا بحب فلسطين .. و ايضا احب الكويت .. و احب كل بلد مسلم ينقال فيه لا اله الا الله .. و الكويت فيها خير كثير لا ينكره الا جاحد .. و الكويت فيها ناس كويسة كتير .. كفاية انه اغلية الناس المسلمة تحب تسمع القرءان الكريم بصوت احمد العجمي الكويتي ... احنا كلنا مسلمين و بنحب بعض و لازم نشد على ايد بعض في الخير و في الازمات نواسي بعض مش نهاجم بعض و نقلب المواضيع لانتقام و نبش مواضيع ليس لها داعي ..<br />و لا انا و لا انت يا عاشق تقدر تقول انه اللي حصل في الكويت عذاب بينما اللي بيحصل في فلسطين ابتلاء !!! من انت او مين انا عشان افسر اوامر ربنا على مزاجي ؟؟؟؟؟؟؟ كلها ابتلاءات و كلها عذابات عشان معاصي الامة كلها ..<br />و اذا كنت لم تسمع كلام يزعلك من مصري قبل كده ، احب اقلك انه اللي خلاني اكتب الكلام ده الزعل بسبب السباب و الشتائم اللي بشوفها في كل مكان بين المسلمين و بعضهم .. كاننا مش امة وحدة كله تحزبات و تخبيط في بعض .. انت مصري فيك كده انت فلسطيني انت خليجي انت مش عارفة ايه انت انت انت .. احنا مسلمين كلنا شعب واحد كلنا ايد وحدة ..<br />ربنا يهدينا و يسامحني لو اخطات و ينصر الامة و يعزها يا رب جزاك الله خير .."
archived = "2010-03-14"
