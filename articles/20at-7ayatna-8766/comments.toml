[[comments]]
order = 15
subject = "لافائدة !!"
author = "محمد نواف الحمدالله ..."
posted = "2008-04-21"
text = "إلى عاشق .. لقد كونت لي فكرة عن ذاتك وشخصيتك ( لاتعليق عليها ) .. ولقد كونت لي فكرة بأن عقلك أصغر من عقل النملة .. يا عاشق لقد علّيت وعلّيت .. وكبرت وكبرت .. إلى أن وصل رأسك السماء ! ومازالت تمشي في الطريق الوعر الذي به أشواكٌ كثيرة .. وهذا أيضاً ليس في صالحك .. الطامة الكبرى يكمن في أنك لاتفقه شيئاً على الإطلاق .. لذلك فقد يتعذر عليّ أن أفقهك !! وأنتا كما أنت سلاحك ضعيف وواهن فوق ما تتصور وتتخيل .. لإن سلاحك هذا ليس إلاّ سلاح يستخدمه المغفلون الحمقى السفيهون .. الذين إذا حاورتهم وناقشتهم في شيئاً ما ولم يعجبهم الكلام إنهالوا عليك بألفاظ نابية تمثّل شخصيتهم المريضة المعقدة .. أنا لا أهدد ولا أتوعد . بالعكس تماماً أنا أقول لك الشجاع من سيصمد إلى النهاية .. وقد ثبت لي من خلال تعليقاتك كلها .. بأنك لاتمت للرجولة والشجاعة بأي صلة نهائياً .. وهذا إن دل على شيء فإنه يدل على تحجرك وتخلفك المدقعين .. وفقرك الفظيع في العلم والمعرفة والثقافة .. ثم بعد ذلك نعتني بــ ( البدوي ) .. والبدوي لمعلوماتك القيّمة هو أشرف وأطهر واحسن منك ومن مشى على شاكلتك .. لإنه إنسان قد عرف مامعنى الحياة .. عرفها حقةً .. وهو الإنسان الذي تربى على الأصالة والنخوة والشهامة والعراقة والطيبة .. من صفات البدو: العفة.. عفة النفس، وعفة اللسان، وعفة اليد، يترفعون عن الممارسات والسلوكيات الهابطة، ينأون بأنفسهم عن كل ما يشينهم من قول أو فعل، فرسان يواجهون من الأمام، لا يطعنون من الخلف، يقولون رأيهم بوضوح وصراحة محافظين على قيم الصدق، والحق، والإيثار من أجل المجموع.<br />ومن صفات البدو: الصبر، والجلد، يتحملون كل المتاعب والإساءات، ويترفعون عن صغائر الأمور، وتوافه الأفعال، ويقابلون السيئة بالحسنة، يعرضون عن السفهاء، ويصمون آذانهم عن رديء القول وسيئه، يرون ان هذه الصغائر هي إسقاطات لا تعنيهم.<br />«وإن الذي بيني،<br />وبين بني أبي<br />وبين بني عمي،<br />لمختلف جدا.<br />إذا أكلوا لحمي،<br />وفرت لحومهم.<br />وان هدموا مجدي،<br />بنيت لهم مجدا..»<br />ومن طباع البدو أن لديهم أذهاناً حادة، وذكاء وقاداً، وقلوباً أبية، وأنوفاً حمية، لا يقبلون الضيم، ولا يسكتون على خلل، ولا يرضون بأنصاف الحلول، لا يتلونون، ولا يزيفون أنفسهم، مهتدين بقول البدوي عمر بن الخطاب - رضي الله عنه -:<br />«يعجبني الرجل إذا سيم خطة ضيم أن يقول: لا.. بملء فيه..»!؟<br />هكذا علّمت البداوة، البدو..!؟<br />البداوة علمت البدو أن الوضوح، والصراحة، والمكاشفة، ووضع الأمور في مكانها السليم والصحيح هي من خصائص العربي، ومن صفاته التي يجب أن تلازمه، وأن في ذلك أقصر الطرق إلى حل المشكلات، ومعالجة القضايا، وإنجاح الأهداف والغايات.<br />البداوة سلوك، وفعل، وممارسة للقيم الجيدة، والأخلاقيات السامية، والمواقف المشرفة..<br />هكذا هي البداوة، وهكذا هم البدو.<br />إذن:<br />لا خجل، ولا حياء، من البداوة، والبدو.<br />وإذن:<br />نحن نعتز كثيراً، ونتماهي، ونحتفي، ونحتفل بكل قبائل البدو في المملكة الأردنية الهاشمية الذين يشكلون عروبة الإنسان الأردني وأخلاق الصحراء، وإنسان الصحراء.<br />نعتز بكل إنسان من قبائل الأردن وعشائرها «البدو» الذين يشكلون الرفض البدوي للأخلاقيات المتدنية والمنحدرة التي مارسها «بيان جبر صولاغ»<br />أما نحن «البدو» في المملكة، وقد ورثنا الصبر سلوكاً، وفعلاً، وقولاً على السفهاء، فإن بداوتنا جعلت المدن العسكرية التي تنتشر في كل أنحاء المملكة مصدر توطين، واستقرار، ونمو للإنسان، وفتحت أمامه آفاق التعليم، والصحة، والحياة الجيدة. ولم تتحول في يوم من الأيام إلى قمع، وإرهاب، وتخويف، وبؤس للناس كما في أنظمة صدام حسين، وعلي الكيماوي، وارثي حضارة حمورابي..!!<br />هكذا هم البدو..<br />«وتكبر في عين الصغير<br />صغارها<br />وتصغر في عين العظيم<br />العظائم..»<br />وشكراً ..<br />وللحديث بقية ،،<br />تحياتي للجميع /////////"
archived = "2010-03-14"
