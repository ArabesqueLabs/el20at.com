[[comments]]
order = 25
subject = "بارك الله فيك و ما عليك زود ابد يا محمد نواف"
author = "ح مشعل الامارات"
posted = "2008-04-27"
text = "و الله هذا من طيب اصلك و معدنك ، و هالشي مو غريب عليكم يا اهل الاردن باخلاقكم العالية اللي تدل على طيب نسبكم و اصلكم<br />جزاك الله خير على الكلام الاكثر من طيب و الله انه مثل البلسم و يدل انه العرب و المسلمين لازال فيهم الخير الكثير..بارك الله فيك و آمين على دعائك الطيب الله يغفر للشيخ زايد الخير و يجزيه عنا خير و يرحم كل اموات المسلمين و يحفظ بلاد المسلمين من كل سوء و يبارك فيها و يجمع بينها ..<br />بارك الله فيك و تحياتي و تقديري لشخصك الكريم و كلامك الطيب<br />السلام عليكم"
archived = "2010-03-14"
