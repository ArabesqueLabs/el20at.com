[[comments]]
order = 18
subject = "شكرا جزيلا لك أخي العزيز مشعل الإمارات , وإليك صفا"
author = "عاشق فلسطين"
posted = "2008-04-21"
text = "السلام عليكم ورحمة الله وبركاتو , طبعا شكرا جزيلا لك أخي العزيز : ح مشعل الامارات وبارك الله فيك , وأنا عارف كتير بأنو أهل الإمارات بحبو الفلسطينيين كتير , وأنا بحب أهل الإمارات كتير لأنهم ناس كتير محترمين , وهيك إحنا تعاملنا معهم بالأردن , فعلا<br />ناس أهل نخوة وطيبة واحترام , مش زي الخرا أولاد الغنمة الأدرنيين , على كل يا محمد نواف الحمد الله , قصتك مش حتخلص , ولكن رح تكون نهايتك على إيدي إن شاء الله , وإنتا بتقول إنك عايش يا محمد نواف بالإمارات , ويمكن عايش بالسلط , بس خايف<br />تقول إنك عايش بالسلط عشان لا نيجي نلعن أبو أبو أبوووووووووووووك , على كل هده هي صفات البدو (بس بدو الأردن) وهي كالتالي : البدوي هو :<br />هو الإنسان الذي تربى على المنيكة والممحنة والنخولة والنخامة والتعريص وقلة الحيا .. من صفات البدو: ذلة النفس (كما هم<br />يشتحون بالمساجد والمراقص والكباريهات حاليا) ، وزفاتة اللسان، والإيد المتعرصة ليل نهار، يترفعون عن الممارسات والسلوكيات الطيبة الإسلامية الطاهرة ، ينأون بأنفسهم عن كل ما يشينهم من قول أو فعل، طيب , يحسبون أنفسهم أنهم هم الأفضل في الناس كلها .. فرسان شعان يتحملون ويتناكون من الخلف , ، يقولون رأيهم بوضوح وصراحة محافظين على أخلاقهم النفاقية الفسقية الكفرية والباطلة {الأعراب أشد كفرا ونفاقا} ،<br />ومن صفات البدو: الصبر، والجلد، يتحملون كل المتاعب والإساءات من أجل النيك ، ويترفعون عن كبائر الأمور، وطيب الأفعال، ويقابلون السيئة بالسيئة ، يعرضون عن العقلاء والعلماء والناصحين لهم ,، ويصمون آذانهم عن حسن القول وطيبه، يرون ان هذه الكبائر هي إسقاطات لا تعنيهم.<br />ودليل كبير على هده الصفات الموجودة , تفضلوا بدخول هذا الرابط الفوري التالي على موقع عشرينات :<br />http://www.20at.com/newArticle.php?sid=12273 :::أو اكتبوا بالبحث : ارفع راسك إنتا فلسطيني:::<br />وانظروا إلى أول تعليق وهو كافي وواضح , ولا أريد جدالا زائداً , فالمنافق الخسيس الوقح الكلب محمد نواف الحمد الله إلو تلات<br />أسماء مستعارة بالصفحة , وهي : الأردني , وأردني من السلط , ومشتهي نيك الفلسطينيات , واحكموا , عشان أطلع في<br />النهاية صادق ومش كذاب , وبارك الله فيكم أجمعييييييييييييييييييييين ........<br />قالوا عنك راسك مرفوع وعيونك جاويــة .. قلتلهم العفو كلنا ناس .. بس أنا :::: فلسطينــي ::::"
