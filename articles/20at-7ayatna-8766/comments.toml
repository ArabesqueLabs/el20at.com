[[comments]]
order = 35
subject = "أردنيين وما ننظام ومهرك يالأردن غالي .."
author = "محمد نواف الحمدالله"
posted = "2008-08-03"
text = "أنا هونه بدي أقول كلمة وحده لهذولة الملقبيين بالفلسطيزيين .. يعني أنا مش فاهم .. ليش الواحد بعمل مع كل الناس خير وبساعدهم وبعاونهم، وبردوه بالمثل ؟.. إلا الفلسطيزيين .. بتعمل معاهم خير وبتساعدهم .. بروحو بقلبو ظدك .. وبصيرو مش معك بالمره . يعني فوق ما حنا مفظليين عليهم وعلى اللي خلفوهم وعلى كل فلسطيزي أجرب مقلعط مش لاقيله دفشة ولا دزه .. ويلا يلا تا شايف قدامو .. فعلاً !!! إنكو ناس حقرا وأنذال ووسخيين ومعفنيين وجرب ومفطسيين وهبايل وكلاب ولاد كلاب ولكو إنتو في دمكو الكذب والغش والحقد والنميمة والحقد والكره والضغينة واللئم .. الله مجمع فيكو كل وسخ وخره هالدنيا والعالم وحاطه فيكو .. سبحان الله !!! يعني الناس بتحاول إنها ( ه ) تحترمكو .. وتقدركو .. وتسويلكو مكانة ومستوى .. وإشي عليه القيمة والفايدة .. بس إنتو مامنكو فايدة بالمره .. يعني أنا الصراحة .. مش من طبعي أو حتى من صفاتي إني أسب سوى إنو شفت إنو فاظ الكيل .. والوعاء امتلا وصار لبرا .. فقلت فحالي وفنفسي صار لازم أتدخل وأسب وألعن وأفضحكو كلكو فرداً فرداً .. يعني أكبر دليل إنكو ناس شاطرة .. ومتفصحنه .. ورايقة .. وفاضية .. وماعندكو شغله ولامشغله . ولا حتى عمله .. إنكو نازليين سب فينا على ولا إشي .. يعني القافلة تسير والكلاااااااااااااااب ( اللي همه إنتو ) تنبح وتعوي ..!!!<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره فالتات ودايرات وداشرات بالشوارع ..<br />يعني والله أنا بشفق عليكو من شعب ماكل خرا من جميع الأصعدة والجوانب المختلفة . يعني شعب كس إمو من شعب شرموووووووووووووط .. قال رنتيسي وياسين وأبو عمار ( أبو حمااااااااااااااااااااااااااار ) .. وكس أخت أسماءكو كيف هيه !!!<br />إنتو اللي رح توكلو خراااااااااااااااا بالملعقة والشوكة والسكين ... وبالنهاية .. وكلمة أخيرة لكل أردني على وجه الكرة الأرضبة .. وووين ما كان .. بقلو وأنا هونه من موقعي ( الإمارات ) .. إرفع راسك لفوق لفوق لفوق وخليك عنيد وراسك يابس مش زي الحجر لأ أقوى من الحجر بكثييييييييييييييير .. وخلي عينك جاويه .. بتقدح شرارة .. قوية .. واللي بطلع فيك وخصوصاً إذا كان فلسطيزي .. مع إنو بسترجيش أو بالأحرى بقدرش أو إنو يحاول يرفع وجهو بوجهك .. وفي حال لو رفع شويه من وجهو الأجرب أخزقلو جوز عيونو .. وسوي براسووو خريطة العالم .. ونييييييييييييك خواته ال66مليون شرموطه وشرموطه .. ولاتنسى تنيك إمو ( لإنها هيه الأساس ) .. وبعد هيك إدعس بنص بطنو دعسة بنت كلب ( نصها موت ).. وشلحو أواعيه .. وافتح طيزو ونيييييييييييييييييييييييييكو لحد ما يغمى عليه ويطفي على الآخر . وبعدين كفين على الماشي ومرتبات يكونو على أكمن بوكس على شلوتين في زبو يخليه يبطل يخلف نهائي وبالمره .. وبعد هيك ( بدي أفرط من الظحك ) .. _ هذا إذا ظل عايش وعلى قيد الحياة وفيه روح وبتنفس _ .. على العموم شيك يعني .. هع هع هع ... وقلوووووووو بأعلى صوتك كالآتي :- ((( مظيع بوجهي شلن يا أخو العرصة ..... )))<br />ولكووووووووو .. نكناكو كثير كثيييييييييييييييييييييييييييييييييييير كثيييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييير .. وزهقنا من طياز وكساس وبزاز وشفايف وخدود بناتكو ونسوانكو يالفلسطيزيه .. وملينا منكو نهائي .. ومسحنا بكرامتكو وشرفكو أرض الأردن كلها/ ولفينا فيها شبر شبر .. ولعنا ظمايركو حى صفيتو بلا ظمير .. أي كس أختكو من متى كان عندكو ظمير .. يعني بالمشرمحي هزئناااااااااااااااااااااااااااااااااااااااااكوووووووووووووووووووووووووووو .. وخليناكو فرجه للي بسوى واللي مابسوى .. وعلكة بثم الجميع .. وسيرتكو وقصتو على كل لسان في العالم .. يعني خلصنا عليكو وقظينا عليكو .. يعني ياجهلة ( Game Over ) <<< يعني انتهت اللعبة ،،،<br />والأردن أولاً .. أولاًُ .. أولاً ..<br />وجيشنا جيش الوطن .. سمينا بإسم الله .. نحمي الوطن والعلم .. بعيون عبدالله ...<br />وبدي أشوف تعليقات الأردنيين النشامى ... اخزقوهم يانشامى الوطن .. ونيكو أعراظهم .. للي بلا شرف !!!"
