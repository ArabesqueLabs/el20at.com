[[comments]]
order = 21
subject = "تعقيب على تعليق الأخت ( ح مشعل )  .. من الإمارات"
author = "محمد نواف الحمدالله ..."
posted = "2008-04-23"
text = "بدايةً أوجه خالص شكري وامتناني للأخت الإماراتية ( ح مشعل ) .. وهذا يا أختي إن دل على شيء فإنه يدل على طيب أصلك .. ومعدنك الأصيل .. وأخللاقك الرفيعة العالية .. فلكي مني كل احترام وتقدير .. واسمحي لي أن أرفع لك القبعة على مداخلتك الجميلة .. ومالها من أثر في النفوس ..<br />أختي .. كلامك على ( عيني وراسي ) .. و ( على قلبي زي العسل ) .. وأنا من جهتي مقتنع بمداخلتك وإنك على صواب ..<br />ولكن أختي .. هل هذا الكلام يجدي نفعاً مع ( عاشق فلسطين ) ... ؟!<br />لأنه وكما هو واضح ( من خلال تعليقاته ) في أعلاه .. فموقفه لايبشّر بالخير إطلاقاً .. ؟!<br />فكأنك فسرت الماء بالجهد بعد الماء .. !!!<br />أنا شخصياً لاأجزم بأنه سوف يبقى مصراً على موقفه .. ولكن الأمل هنا يشكل نسبة ضئيلة جداً لا يمكن الأخذ بها ..<br />وكلامك بالطبع ،،،<br />هو موجه للعقلاء فقط لاغير .. وغير ذلك فهو غير مفهوم بالنسبة لغيرهم، لأن الله قد طمس على قلوبهم وأبصارهم ..<br />فلا يرجى منهم الفائدة أو النفع .. (( إلاّ )) اللهم بقدرة قادر مقتدر قادر على أن يغير الإنسان بين عشية وضحاها .. والإنسان دائماً يتوقع بغدٍ أفضل مما سبقه .. بغد مليء بالأمل والتفاؤل .. مليء بالحب والسلام والخير .. وهذا بالطبع مانرجوه ونتمناه أن يحدث فعلاً ..<br />وفي الختام .. أوجه تحياتي لك أختي وعلى قلبك الطيب الواسع .. وأخلاقك الفاضلة .. ومبادئك الثابتة الراسخة ..<br />............................................................... سلام الله ,,,<br />وللحديث بقية ..<br />خالص تحياتي القلبية وأشواقي الروحية //"
archived = "2010-03-14"
