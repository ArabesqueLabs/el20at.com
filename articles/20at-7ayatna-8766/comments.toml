text = "إلى الجميع بلا استثناء ومن يدخلون إلى هذه الصفحة , رجائي تفضلوا بالدخول على الرابط التالي :<br />http://www.20at.com/newArticle.php?sid=12273<br />وانظروا من بدأ بالسب والشتم على فلسطين وغير ذلك , إنهم الأردنيين بلا شك , أول تعليق واضح وكافي , فالمنافق محمد نواف<br />الحمد الله له ثلاث أسماء مستعارة بهذه الصفحة , وهو الأردني ومحمد نواف الحمد الله واردني من السلط , بس لو سمحتو تفضلو بالدخول على الرابط لأني بديش أكتر كلام وإنتو احكموا بحالكو , مين اللي بدأ بالسب والشتم , بس<br />وعن أهلك يا بن الكلب يا محمد نواف ما قريت تعليقي , أنا مجنون , طيب مو مشكلة<br />والله العظيم ما مجنون ومخلول ومنفصم شخصية ومتخلف ومعوق ذهنيا وجسديا وشكليا حتى كمان غيرك , المجنون والله بكون<br />أحلى منك وبفهم أكتر منك يا بغل يا كلب , والله الكلب انظف منك والله العظيم ........ فعلا سافل يا شراري<br />::::: وتحياتي للجميع::::: عشتي يا فلسطين , والله كبيرة وأهلك أكابر"
