[[comments]]
order = 20
subject = "شو رايكم ؟؟؟"
author = "ح مشعل الامارات"
posted = "2008-04-22"
text = "و الله يا اخي عاشق فلسطين (و انا بنت مو ولد) .. انا دخلت اللنك اللي انت دليتنا عليه اكثر من مرة .. و اقسم بالله اني ضيعت وقت ليس اكثر .. و اقسم بالله انه لا يحل مشكلة بالعكس يزيد الطين بلة ...<br />سب من كل صوب و على الكل ، يا اخي انت و اخوي محمد نواف و اذا سمحتولي بكلمة ، اذا الانسان سب عليك او على بلدك باسلوب غير لائق اكبر غلط تسويه انك ترد السب بالسب ، لانك في هذه الحالة تكون منافق ، يقولون مالا يفعلون .. اذا ما عجبك انه سب بلدك فلا تفعل مثله بالضبط و تسب بلده و كل ناسها ، لأنك في هذه الحالة تزعل انسان من هذاك البلد لم يسبك و لم يسب بلدك ....<br />و اللي رايته في اللنك اللي وضعته يا اخي عاشق ، تعلمت انه من يسب مرة يسب مية مرة ، و من يسب اي شخص او بلد فان السب سيكون ديدنه في كل شئ ، و روح لاحظ الموضوع ، ما تكلم اي انسان مسلم من اي بلد الا انسب هو و بلده ، دخل سوداني في الموضوع انسب ، دخل سعودي انسب ، ... الخ ..<br />اذا كان محمد نواف اخطأ في هذاك الموضوع ( و على فكرة قريت له رد هناك في لحظة اعتذر عن كل شئ و استسمح من الجميع من طيب اصله و الخير اللي فيه شرواك يا عاشق فلسطين) ، و لكن لم يتوقف احد عند هذا الاعتذار تعرف ليش؟ ، لأن اللي رد على السب بالسب في البداية جر الموضوع و شجع الجميع على النزول لمستوى السباب و قذف اللعن و الشتم حتى في العرض ...<br />و هذا موضوع عن حادثة في الكويت فماذا حدث ؟؟؟؟ دخلت حضرتك و عممت كل الصفات السيئة على كل الكويت ليس فقط الكويب بل الخليج كله ، و ماذا تتوقع الرد ؟؟ اكيد يجي واحد بنفس الاسلوب و يعمم كل الصفات السيئة على فلسطين .. و هذا قصدي اخواني ..<br />اللي يسب انسان او بلد هو انسان ديدنه و اسلوبه السب ، و اذا واحد سب في السعودية مثلا و جا واحد من الامارات دافع عن السعودية هذا الواحد سيسب الامارات على طول و بدون سبب و هكذا لأن منطق في العداء مافي ، هو فقط اسلوب السب و الشتم في الحوار ... و السب لا يقدم و لا يؤخر و ليس فيه من الحقيقة اي مصداقية .. الانسان ينتقد بمنطق و عقل و احترام متبادل ... و انا متأكدة انه في قلوبكم من طيبة و اصل ما يمنعكم ان تتخذوا من اسلوب الشتائم ديدن<br />و دخلنا الان في دوامة اخاف تجرنا لسباب لا تنتهي ..<br />شو رايكم .. ؟؟<br />صلوا على النبي يا اخوان ... و خلونا كلنا نقول دعاء ختم المجلس عسى الله ان يغفر لنا اللي كتبناه حتى لو نحن نشعر ان كلامنا ليس خطأ .. رب كلمة يقولها المرء و لا يلقي لها بالا تهوي به في جهنم سبعين سنة .. و العياذ بالله ...<br />اقولكم بصراحة اقسم بالله اني اكتب هذا الكلام و اخاف ان يكون مصيري سيلا من السباب هههههههههههه و اخاف اوجه كلمة لواحد فيكم يفلقني بمسبة من كثر ما شفت تبادل شتائم بين اخوان ...<br />اسمحولي لو الكلام ضايق اي حد فيكم و اعذروني و أسأل الله ان يوحد الامة الاسلامية ( نحن يجمعنا الاسلام و ليس العروبة ) .. و يجعلنا خير امة اخرجت للامم ..<br />دعاء ختم المجلس : سبحانك اللهم و بحمدك اشهد ان لا اله الا انت استغفرك و اتوب اليك .."
archived = "2010-03-14"
