text = "السلام عليكم ورحمة الله وبركاته , أنا حبيت أذكر الأخت : ح مشعل الإمارات , أختي الله يرضى عليكي ما تضحكيش علي لأني هكرت كمبيوترك ولما دخلتي علي : ارفع راسك إنتا فلسطيني رحتي مسمية حالك إماراتي والنعم وجالسة تسبي وتشتمي وكل شي وهون عاملة حالك بتنصحي وكل شي , طبعا لأنك بدوية , مش غريب هدا الإشي, على العموم , الآي بي تبعك عندي وإيميلاتك عندي وكل شي , إن ما اعترفتي إنك إنتي اللي عاملة هيك رح تروحي فيها , وإنتا يا محمد نواف الحمد الله كذلك إيميلاتك والآي بي تبعك كلو عندي , إن ما احترمتو حالكو بعد هيك واللي بسب فلسطين رح ألعن أبوه ورح أخليه<br />يندم على اليوم اللي دخل فيه الموقع , والله على ما أقول شهيد ........<br />::: لا تنسوا بأن الصفحة مراقبة ::: وأي صفحة تدخلوها فكل ذلك مسجل عندي , فانتبهوا لحالكو , نصيحة مني إلك يا محمد نواف الحمد الله , ولا كيف كشفتك بأنك عندك تلات أو أربع أسماء ., مش هيك , بحبش كتر الكلام , لكن إيميلاتكو رهينة عندي وإنتو حرين ........"
archived = "2010-03-14"
