[[comments]]
order = 4
subject = "انتوا مش هتبطلوا العادة دي؟؟؟؟؟؟"
author = "نوال"
posted = "2008-04-15"
text = "برافو عليكم و خصوصا للاخ عاشق فلسطين برافو عليك ..يعني الكويتي و انا بخالفه في اللي قاله بس على الاقل تكلم بكل صراحة بدون بهارات و تجميل بس انت اتقي الله بقى .. عيب جدا لما تكتب كلام زي ده و مجمل الموضوع باسم رب العزة في كل جملة .. (فلسطين تاج راسك وراس كل كويتي و عربي وخليجي و بارك الله فيك) !! ايه ده ؟؟ اتقوا الله في بعضكم .. الاسلام جمعنا .. و لما تحصل حاجة زي دي في الكويت نقول لا حول و لا قوة الا بالله و اللهم ارفع البلاء عنهم و ندعيلهم بالخير و ننصحهم .. و نقول انه بسبب المعاصي و غضب الهي بس بادب مع بعضنا و بدون حقد دفين يظهر جدا في الكلام حتى لو حاولت يا عاشق فلسطين تخبيه ورا كلامك و ذكرك لاسم رب العزة ... اتقوا الله اوكيه .. يارب يهدي كل المسلمين .. كل بلد فيها سئ و جيد .. مش بس الخليج احنا نحب نعلق كل بلاوينا على شماعة واحدة و بنغش انفسنا .. روح شوف الفلسطينيين بيعملوا ايه في الخليج و في امريكا!!1<br />و لو الموضوع موضوع غضب الهي و تعذيب عشان المعاصي .. فيا اخ عاشق بقولك فلسطين بقالها اكتر من 50سنة في عذاب يا ترى ليه ؟ انتوا عصيتوا ربنا بايه ؟؟ و انا بس بقولك الكلام ده عشان افهمك انه لو ده المنطق بتاعك يبقى اول حاجة ينطبق على فلسطين ...<br />يا رب تحفظ بلاد المسلمين جميعها من اقصاها لاقصاها من كل سوء و تجمع قلوب المسلمين على الحب و الاخوة و تهدينا و تغفر لنا تقصيرنا و زللنا و ابعد عن الشرور و الفتن .. و حرر فلسطين و المسجد الاقصى من اليهود الانجاس و احفظ دماء اخوانا في فلسطين و الحمد لله على السلامة لكل الاخوة الكويتيين .."
archived = "2010-03-14"
