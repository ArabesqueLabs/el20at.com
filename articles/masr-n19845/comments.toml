[[comments]]
order = 0
subject = "كده مظبوط يا محمد السويدي"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "ايوه كده يا محمد السويدي<br />كده بقيت صحفي ابن صحفي<br />الموضوع لازم يكون فيه صور<br />مش زي فرح بتاع بطن البقره<br />فيه فرح من غير صور برضه<br />سلام"
archived = "2009-02-12"
capture_url = "https://web.archive.org/web/20090212003127/http://masr.20at.com:80/newArticle.php?sid=19845"

[[comments]]
order = 1
subject = "الكتكوت"
author = "حسين كامل"
text = "بلاش جهل وتخلف الموضوع ليس اكثر من مجرد تشوهات فى الطبقة الخارجية للبيضة ,, وبعدين لماذا فرح شيوخ الاسلام بكلمة الله وعتبروا ان المولود اقصد الكتكوت سيخرج من البيضة مسلما !! اليس الله هو ملك للجميع ومن هنا يمكن للكتكوت ان يكون مسلم او مسيحى او يهودى !! اذن فلننتظر الكتكوت اى الاديان سيختار ."
archived = "2009-02-12"
capture_url = "https://web.archive.org/web/20090212003127/http://masr.20at.com:80/newArticle.php?sid=19845"

[[comments]]
order = 2
subject = "انتم هتقلدوا النصارى - شافوا شوية نور قمر بيتسرب من سور السقف قالوا العذاراء ظهرت"
text = "بطلوا الغباء<br />والا هتقلدوا الاغبية اللى بيقولوا شفنا العذراء"
archived = "2009-02-12"
capture_url = "https://web.archive.org/web/20090212003127/http://masr.20at.com:80/newArticle.php?sid=19845"

[[comments]]
order = 3
subject = "اللعب بالبيضه والحجر"
author = "جمال الغمري"
text = "ياجماعه كفايانا عبط وسخافه وغباء كسفتونا كفايانا نوووووووووووووووووم واتكاليه هذا لايرضي خالقنا فهو القائل سبحانه وحسبي الله في من يروجون لهذه الخزعبلات التي تؤثر علي البسطاء"
archived = "2009-02-12"
capture_url = "https://web.archive.org/web/20090212003127/http://masr.20at.com:80/newArticle.php?sid=19845"

[[comments]]
order = 4
subject = "بالهنا والشفنا"
author = "عباس راجيندر"
text = "المهم أكل البيضه حلال ولا حرام أكلها, مين يفدنا جزاكم الله خير<br />يحسن يكلها الراجل ويدخل جهنم"
archived = "2009-02-12"
capture_url = "https://web.archive.org/web/20090212003127/http://masr.20at.com:80/newArticle.php?sid=19845"

[[comments]]
order = 5
subject = "هو مش تخلف ولا جهل"
author = "محمد جمال الدين"
text = "يا جماعة الموضوع مش موضوع تخلف ولا جهل ولا انسياق ولا بتاع<br />دى حاجة ظاهرة قدامنا بوضوح الشمس<br />ومن حق الراجل انه يعرض حاجة معجزة زى دى .. ودلالة كبرى ( واحنا مش محتاجين دلالة ) على وحدانية الله<br />المشكلة بقى فى الناس الى بتستقبل الخبر ده<br />بتصدر منهم تصرفات متخلفة وعبيطة<br />تلاقى الى بيمسك البيضة ويقعد يبوس فيها<br />تلاقى واحد تانى بيوشوش البيضة بامنية هو نفسه فيها<br />ومش بعيد نلاقى بعد كام سنة .. مولد ستى البيضة<br />والى بيقول انها تشوهات فى القشرة الخارجية<br />بقوله ده اسمه هروب من الحقيقة والامر الواقع<br />حتى لو تشوهات .. زى ما بتقول<br />هل ستكتب كلمة الله بالوضوح ده<br />يمكن تكون صدفة .. صح<br />\\\\\\\" وكل شىء يسبح بحمده \\\\\\\"<br />\\\\\\\" يسبح له ما فى السموات وما فى الارض \\\\\\\"<br />\\\\\\\"ولكنكم لا تــفقهون تسبيحه\\\\\\\"<br />بلاش نهرب من حاجة واقعية<br />بس اتمنى انها ما تبقاش زى الشجرة الى لقوا مكتوب عليها كلمة الله .. كل الناس راحت وتوافدت الوفود لرؤيتها<br />ثم دى حاجة غريبة اوى .. الناس قدامها كلمة الله ليل نهار فى الشغل او البيت او حتى فى عربية الميكروباص<br />فمش عارف ليه .. بيتشعلقوا فى حاجة موجودة اساساً عالطووول<br />؟!!!!!!!!!!1"
archived = "2009-02-12"
capture_url = "https://web.archive.org/web/20090212003127/http://masr.20at.com:80/newArticle.php?sid=19845"
