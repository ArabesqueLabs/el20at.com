text = "أولا الشيخة لبنى ليست ابنة حاكم الشارقة ولكنه ه خالها ثانيا : الشيخة لبنى حصلت عاى الماجستير من أمريكا وليس من جامعة الشارقة التي لم تكن قد فتحت في ذلك الوقت ثالثا: الشيخة لبنى حتى عام 1987 مازالت تعمل في الهيئة العامةللمعلومات وهناك العديد من المعلومات الخطأ فنرجوا الدقة قبل طرح المعلومات"
