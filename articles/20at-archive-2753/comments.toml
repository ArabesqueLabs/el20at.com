text = "شئ جميل عندما تجد أمرأه تتحدى الواقع الشرقي وتصل الى مبتغاها أضافه الى أن تكون مفيده وبناءه وقدوه ولكني لا اجد الشيخه لبنى غريب نجاجها فهي تنتمي الى أسره تحب النجاح وبذل كل مايلزم للتطور . وأنا فخوره لكونها عربيه واتمى أن يحذو الجميع وراء الطموح المشروع<br />لبنى الوائلي_العراق"
