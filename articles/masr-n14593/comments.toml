[[comments]]
order = 0
subject = "ما شاء اللة يا ست رضوى - مقالك الجميل لفوق سن 18"
author = "عكروت"
posted = "2008-03-10"
text = "يا ست رضوى يا محترمة يا بنت الناس الطيبين<br />يعنى الدنيا قفلت فى وشك ملقتيش غير موضوع الداعرات والساقطات والمواضييع المشبوهة لتقرفى الناس بها<br />فين الاخ الطحاوى اللى قاعد كومبرس على الديسك<br />ازاى يسمح بنشر موضوع زى دة<br />اكتبى لنا عن طريقة غسيل الكفولة - وتغيير بامبر البيبى - وصينية المكرونة بالبشاميلا<br />اكتبى موضوع عن طناش الازواج للزوجات يوم الخميس<br />انما تراقبى جيرانك وتسجلى ارقام سيارتهم واضح ان عندك فراغ هائل وتتسنطى على كلامهم<br />لالا - ياست رضوى<br />الموضوع اوت"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 1
subject = "اللهم ارحمنا"
author = "aya"
posted = "2008-03-10"
text = "معلش انا برضو عندى تحفظ على الموضوع يعنى خلاص المواضيع خلصت ومش باقى غير مواضيع الداعرات<br />واحب اقول ربنا يهدى الجميع ويرحمنا"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 2
subject = "كنتي في جرة وطلعتي لبره يا رضوه"
posted = "2008-03-11"
text = "فعلا يا رضوى حسن كنتي في جرة وطلعتي لبره<br />يا ليت ترجعي مركز الاخبار احسن<br />بالمناسبة هي رضوى اخرها الف مكسوره ولا تاء مربوطة<br />وسلميلي على دودي ام ننوشه"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
