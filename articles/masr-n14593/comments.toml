subject = "وأتذكر أن رجلا يرتدي ملابس خليجية طرق على بابي ذات"
author = "من الخليج"
posted = "2008-03-12"
text = "المقال لم يسيء الى سوريا فقط ولكنه اساء الى الخليجيين ايضا<br />عيب عليكم الاساءة الى اخوانكم العرب المسلمين في هذا الوقت بالؤات"
archived = "2008-03-14"
capture_url = "https://web.archive.org/web/20080314122751/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 14
subject = "ماشي يا رضوه"
posted = "2008-03-12"
text = "انشاء الله شكوى ضدك وضد الموقع في نقابة الصحافيين<br />بتهمة الاسارة الى دولة عربية وخمس دول خليجية وهي السعودية والكويت وقطر والبحرين والامارات وسلطنة عمان<br />وممكن يحصل ازمة ديبلوماسية بين مصر وهذه الدول اذا لم ينزل اعتذؤار رسمي"
archived = "2008-03-14"
capture_url = "https://web.archive.org/web/20080314122751/http://masr.20at.com:80/newArticle.php?sid=14593"

