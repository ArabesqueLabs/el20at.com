subject = "سخافات"
posted = "2008-03-11"
text = "على فكره انا بعمل موسوعة اسمها سخافات<br />المقال دا حيبقى من ضمن المجموعة"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 4
subject = "المقال جميل ورائع .. وكلن !!"
author = "محمد نواف الحمدالله ..."
posted = "2008-03-11"
text = "والله المقال عجبني من ناحية .. وماعبني من ناحية ثانية . بمعنى ثاني إنو يعني ماظل مواضيع غي هالمواضيع ( الداعرات )<br />يعني فيه مواضيع أهم بكثير من موضوع زي موضوعك اخت ( رضوى ) ..<br />أنا بحكي وجهة نظري الخاصة فيني مابرعف يمكن تكون صح وممكن تكون غلط ؟!<br />ع العموم ... شكراً<br />تحياتي للجميع ,,, وللأخوة المصريين ( بشكل خااااااااااص ) !"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 5
subject = "محدش شجعنى رضوه"
author = "محدش شجعني رضوه"
posted = "2008-03-11"
text = "السلام عليكم يا جماعة على فكرة انا سعيدة فعلا باكلامكم و لكنى شايفة انه ينقصه حاجة مهمة محدش يعني شجعنى على انى و لله الحمد قدرت اغير منكر ربنا يعفيكوا كلكوا من انكوا تسكنوا في شقه تمارس فيها لدعارة و يهتز عرش الرحمن لذلك عموما المقالة بتدعو كل انسان لتغيير المنكر و طبعا الزنا من الكبائر و اتمنى ان اللى يقرأ الموضوع و يعرف حد بيعاني من نفس المشكلة يشجعة على مواجهة هؤلاء حتى لا ينتشرون أكثر من ذلك في الدول العربية و خصوصا المدن الجديدة .. و على فكرة للسائل عن اسمى هو المفروض رضوى لكن كتبوني غلط في شهادة الميلاد و ممكن للمعلق بتاع السخافات يحط موضوعي في موسوعة سخافات المهم اننا ننشر الفعل الايجابي و لا كان المفروض اني اسكت و اسيب الفرصة لانتشار الزنا ياله اقلكوا سلام"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 6
subject = "تعليقاتكم زيكم"
author = "محطة مصر"
posted = "2008-03-11"
text = "واضح إن جو التعليقات انتقل من الناس اللي برة إلى المتواجدين بالاسم أونلاين وعشرينات<br />قلة الذوق أصبحت طابع التعليقات خاصة يا من تعملون في مبنى واحد، واضح جدا أنكم زملاء كاتبة المقال، والغريب إن الروح دي موجودة فيكم تجاه بعض، وأنتم عمالين تعلموا الناس وتنصحوهم<br />ياريت يا جماعة يا بتوع اسلام اونلاين وعشرينات تبطلوا بقى شغل الكبت اللي انتم شغلينه مع بعض في الموقعين، واحترموا بعض شوية بقى<br />بدأنا نقرف من الدخول على مواقعكم من كتر غسيلكم اللي بتنشروه<br />المقال اللي كتبته رضوة، بالتأكيد مقال مفيد، بس ما بقتوش شايفين في بعض غير السلبية<br />والله حرام عليكم"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 7
subject = "ايجابية"
author = "ايجابي"
posted = "2008-03-11"
text = "شكرا لصاحبة الموضوع .. وشكرا لهذا التحرك الإيجابي في مواجهة المشاكل .. ولمن أعترض على الموضوع كعكروت وغيره وخصوصا الاخت ولا الأخ بتاع كنتي في جرة وطلعتي لبره ياريت تطلعوا راسكم من الرمال شوية وتطلعوا من الكهف اللى انتم عايشين فيه دا اللى هيوديكم في داهية اكتر ما انتم فيها"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

