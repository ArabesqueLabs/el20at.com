[[comments]]
order = 9
subject = "ارحمنا يا رب"
author = "المهندس"
posted = "2008-03-11"
text = "اسال الله ان يرحمنا من الانحطاط الاخلاقي في بلادنا<br />و ان يرحمنا من مثبطي الهمم واتعجب ممن يرى ان هذا الموضوع غير مهم كي نتحدث فيه<br />اخبرني بالله عليك كيف يكون هذا الموضوع المتعلق بالقيم و الشرف غير مهم ولا انسى ان احيي الكاتبه التي تجنبت اي الفاظ خارجه في موضوعها"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 10
subject = "اللهم لا تؤاخذنا بما فعل السفهاء منا !!"
author = "حسين"
posted = "2008-03-11"
text = "يعنى أما واحده تطلع محترمه , و تقرر أنها تقاوم الفساد ... يا عالم يا متخلفه ... تقلوا أدبكم عليها؟؟<br />و يا ريتها بس اكتفت بمقاومة الفساد , دى كمان بتساعدنا على أننا نقاومه باننا نعلم بعض , و الكلام كله محترم جداً , ولا تشوبه شائبة ابتذال<br />واضح ان اللى زعلانين من الموضوع ده كانوا من زباين الأخت السوربه !!<br />اللهم لا تؤاخذنا بما فعل السفهاء منا"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 11
subject = "الى حسين"
author = "من سوريا"
posted = "2008-03-11"
text = "انت بتقول<br />واضح ان اللى زعلانين من الموضوع ده كانوا من زباين الأخت السوربه !!<br />وانا اقول<br />السوريين كلهم انضف منك ميت مرة<br />وانتي يا ست رضوه مفيش مفيش مصريات بيشتغلوا في الدعارة علشان خاطر تسيئي لدولة عربية اسلامية شقيقه<br />عندنا مصريات بيشتغلوا في الدعارة في دمشق"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
order = 12
subject = "دعوة للتعقل"
author = "المهندس"
posted = "2008-03-11"
text = "لا أدري كيف تحولت المقالة من هدفها الأساسي (على حد فهمي) و هو توضيح شيء سلبي في مجتمعاتنا العربيه أو في المجتمع المصري و توضيح كيف تم التعامل معها إلى خلاف بين أبناء الوطن الواحد و ليس معنى أن هؤلاء من سوريا أنه لاتوجد مثلهن مصريات بل يوجد الكثير وللأسف رحمنا الله من كل سوء"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234205/http://masr.20at.com:80/newArticle.php?sid=14593"

[[comments]]
