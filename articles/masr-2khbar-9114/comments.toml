subject = "باقولك ايه من الآخر"
author = "محمد سنجر"
posted = "2008-05-30"
text = "بقولك إيه<br />من الآخر<br />و شيل إيدك و سيب بُقي<br />كده اتاخر<br />آديني باقولها م الآخر<br />كلام الليل<br />ما لوش آخر<br />كلام لا يجيب و لا يودي<br />كلام ف كلام<br />لحد الضلمة ما تعدي<br />كلام مدهون و بالسمنة<br />و لما الصبح بيصبح و لا توفيش<br />حروفه تسيح و قدامنا<br />بالاقي قفايا و أنا راجع يأمر عيش<br />و الاقي كلامك الجبار كلام عادي<br />طاحونة يا ناس و شغالة على الفاضي<br />و طول الليل ماسك ودني<br />و دو دو دو و توعدني<br />تعممني<br />لأ اطمن ما فيش حاجة<br />ما فيش مصنع<br />تسجدني<br />و هي بلدكو محتاجة<br />مدام ها يضر و لا ينفع<br />كده كفاية<br />كفاية حرام بقى كفاية<br />كفاية حشيش و كباية<br />كده كفاية<br />عشان خاطري<br />عشان بنتك عشان ابني<br />بلاش مصنع<br />مدام ها يضر و لا ينفع<br />باسم الدين و باسم النخوة و الأخلاق<br />عشان سلمى عشان محمود عشان نجلاء<br />عشان سارة عشان حلمي و الا هناء<br />أبوس إيدك<br />عشان الوردة ما تفتح في جو نضيف<br />أبوس رجلك<br />عشان السل ما يعشش في حضن الريف<br />تعالى زيارة ويايا<br />و شوف بكره كده معايا<br />دي سارة فاكرها عملت لك مشبك أيوة و الا فطير<br />و شوف حلمي اللي كان بالأويما يعملك دولاب و سرير<br />أديه نايم شوف المنظر<br />بعد عنك ما جاله السل م الدخان<br />و سلمى نايمة و الكنسر<br />مخلي حياتها ذل ف ذل ويا هوان<br />يلا قوم و خليهم بقه يغوروا<br />على غيرنا يروحوا يلفوا و يدوروا<br />يلا و لم يا كندي و شيل من هنا سمومك<br />و لم اللي وقع منك فلوسك يلا و هدومك<br />و لم ديولك الألاضيش و خد عليهم المزة<br />أراهنك لو ف تل أبيب يوافقوا تعمله في غزة<br />و خليني و خلي لي هوايا الصافي و المية<br />و خليني كده بعبلي أفطر فول و طعمية<br />كفاية خلاص كفاية سكوت<br />خلاص حاسس بإني هـاموت<br />كفاية سكات سنين فاتت<br />و رحمة امي ما انا ساكت<br />ما فيش مصنع<br />ما فيش مصنع<br />لا انا ساكت و لا ها ارجع<br />ما فيش مصنع<br />و لو ناوين على موتي<br />مش ها افضل على سكوتي<br />و آديني باقولها م الآخر<br />و شيل ايدك و سيب بقي<br />كده اتاخر<br />لا انا ساكت و لا ها ارجع<br />ما فيش مصنع<br />ما فيش مصنع<br />ما فيش مصنع"
archived = "2010-03-14"
