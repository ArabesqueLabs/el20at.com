[[comments]]
order = 9
subject = "ليسو ا محافظين وانما قائدعسكرى ميدانى فى اقاليم الحرب"
author = "وفدى"
text = "قائد الجيش الثالث الميدانى عين محافظ<br />ييقى القيادة عارفة ان فية حرب فى المحافظة دى مع الشعب<br />طبعا القائد بينتقل باركان حربة<br />بلد قيادتها اخر حلاوة<br />استعدوا للخراب"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

[[comments]]
order = 10
subject = "غلى مروة عبد الفضيل"
author = "الأسيوطي بك"
text = "انا بس عايز أطلب من مروة عبد الفضيل حاجة ضرورية جدا وهى انها تعمل بروفايل عن سيدنا محمد حسني مبارك لإني عارف اكيد انها متمكنة جدا في حتة البروفايلات فيالا بئه بسرعة كده لانه من الاساس مش هيموت فلا تنتظري موته عشان تعملي بروفايل خلاص انا هستنى منك بروفايل قريب عنه."
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"
