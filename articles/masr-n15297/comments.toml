subject = "يلا قولوا ورايا"
author = "مش ساكت"
text = "الله غايتنا<br />والرسول زعيمنا<br />والقران دستورنا<br />والجهاد سبيلنا<br />والموت في سبيل الله اسمى امانينا"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

[[comments]]
order = 1
subject = "تعيين محافظين جدد حسب جريدة لاهرام"
author = "ابوك الحاج"
text = "السيد الرئيس اعلن اليوم حركة تعيين محافظين جدد حسب جريدةالاهرام والسؤال هو<br />محافظة تعانى من الجوع والبطالة فى حاجة الى تنمية شديدة نختار لها محافظا برتبةلواء اركان حرب مدرعات<br />ما علاقة التنمية والحكم المحلى باركان حرب المدرعات<br />ثم هل هذا اللواء فلح قبل كدة فى ا لمشاة ام المدرعات<br />ايةالحكاية<br />تكية بيوزعها مكافئات على الحبايب"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

[[comments]]
order = 2
subject = "طوابير الخبز ووزير الاثتثمار والاستحمار"
author = "الزرزور"
text = "صرح وزير الاثتثمار والاستحمار محى الدين الغريب ان الحكومة تخطط لبيع طوابير الخبز لمثتثمر رئيسى وقد تم مناقشة الامر فى لجنة السياسات واوصت بالبيع لمثتثمر رئيسى وقد قدم مثتثمر هندى عرضا من شركة كومار بنقل عينة من تلك الطوابير لعرضها على شعوب العالم لاظهار مدى تقدم الاقتصاد ورفاهية الناس ونتائج الفكر الجديد وجدوى سياسات الاصلاح الاقتصادى"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

[[comments]]
order = 3
subject = "الاصلاح الاقتصادى"
author = "عيون المها"
text = "زار الرئيس جمال عبد الناصر الرئيس انور السادات فى دار الاخرة وجلسوا يتسامرون<br />جمال لانور<br />انت سمعت خطاب حسنى فى عيد العمال عن الاصلاح الاقتصادى ؟<br />انور<br />ايوة ياريس سمعتة - بس اقسم لك وحياة النار اللى احنا قاعدين فيها دى انا ما سبتش اى اقتصاد خالص ومش عارف انهو اقتصاد اللى بيصلح فية من 30 سنة ولا فاهم حاجة"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

[[comments]]
order = 4
subject = "سيادة المحافظ لواء اركان حرب مدرعات"
author = "مش لازم"
text = "الى الاخ المعلق قبلي ابوك الحاج<br />اصل انت مش فاهم<br />لما يكون حاكم البلد فريق طيار<br />ايش علاقة مصر بالطيران<br />واللي قبليه كان اليوسباشي انور السادات<br />واللي قبليه كان البكباشي عبدالناصر<br />ايش علاقتهم بحكم البلد<br />علشان خاطر كده يا اخي المرتب 200 جنيه والجزمة بت 500 جنيه والبنطلون 300 جنيه والنظاره 400 جنيه<br />50 سنه بهايم ماسكه البلد وطبعا البهيم الكبير حط في كل حته بهايم زيه المحافظين والوزراء<br />معلش يا سيدي لنا الله"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

[[comments]]
order = 5
subject = "سيادة المحافظ لواء اركان حرب مدرعات"
author = "مش عايز"
text = "اكيد المحافظ دا حيحطوه في المحلة<br />علشان خاطر يعرف يحاصر المظاهرات بالدبابات والصواريخ والمدفعية الهاون<br />ويعرف ينشر الجيش بسرعة في طرقات المدينة<br />ويعرف يسيطر على المدينة<br />وبعدين يرفع سماعة التليفون ويقول<br />تمام يا فندمممممممممممممم"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

[[comments]]
order = 6
subject = "اطالب باضراب من اجل عودة الجيش الى الثكنات العسكرية"
author = "مش بحبك"
text = "يا جماعة عايزين نعمل اضراب عامل وشامل من اجل المطالبة بعودة جميع افراد الجيش الى الثكنات العسكرية<br />حرام عليهم بقا<br />كفاية خمسين سنه وداخلين في خمسة وخمسين سنه<br />حرام حرام حرام<br />البلد عايز يحكمها اقتصاديين كبار مخلصين امثال<br />عبدالمجيد الغزالي اقتصادي كبير او اي اقتصادي اخر بصو السيرة الذاتية بتاعة الدكتور عبدالحميد الغزالي<br />الدكتور /عبد الحميد حسن الغزالي<br />الإسم :<br />عبد الحميد حسن الغزالي<br />تاريخ ومكان الميلاد :<br />23 فبراير 1937م ـ الشهداء / المنوفية / جمهورية مصر<br />المؤهلات العلمية :<br />دكتوراه الفلسفة في الاقتصاد ـ اقتصاديات التخطيط ـ المملكة المتحدة 1968م.<br />الوظائف العلمية :<br />عضو هيئة التدريس بكلية الاقتصاد والعلوم السياسية ـ جامعة القاهرة ، منذ 1968م حتى الآن.<br />أستاذ زائر ـ معار ـ جامعة أم درمان ، جامعة الكويت ، جامعة الملك عبد العزيز ، جامعة أم القرى.<br />الوظائف العملية :<br />عضو مجلس إدارة المصرف الإسلامي الدولي للاستثمار والتنمية 1980 ـ 1990م.<br />مستشار اقتصادي للمصرف الإسلامي الدولي 1985 ـ 1990م.<br />مؤسس ومشرف على مركز الاقتصاد الإسلامي بالقاهرة 1985 ـ 1990م<br />مدير المعهد الإسلامي للبحوث والتدريب ـ البنك الإسلامي للتنمية 1411 ـ 1415هـ.<br />رئيس لجنة تنسيق البحوث بين البنوك الإسلامية 1991 ـ 1995م.<br />الإنتاج العلمي في مجال المصرفية الإسلامية : ( المؤلفات ) :<br />دراسة جدوى المصرف الإسلامي 1978م.<br />الأرباح والفوائد بين التحليل الاقتصادي والحكم الشرعي 1990م<br />حول أساسيات المصرفية الإسلامية ، 2001م.<br />العديد من المقالات في مجال المصرفية الإسلامية.<br />الإشراف على العديد من الدراسات في مجال المصرفية الإسلامية كصادرات مركز الاقتصاد الإسلامي بالقاهرة ، وللمعهد الإسلامي للبحوث والتدريب بجدة.<br />الإشراف على العديد من رسائل الماجستير والدكتوراه في مجال المصرفية الإسلامية.<br />الإشراف على تنفيذ برامج تدريبية لرفع كفاءة العاملين في بالمصارف الإسلامية.<br />الاشتراك في العديد من الندوات وورش العمل والمؤتمرات حول المصرفية الإس<br />كفاية جيش بقا حرام عليكم حرام عليكم"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

[[comments]]
order = 7
subject = "55 سنه جيش يا عالم كفاية كفاية كفاية"
author = "مش كفاية مش كفاية احنا معاك للنهاية"
text = "محمد حسنى مبارك - السيرة الذاتية 8/16/2005 4:18:00 PM<br />ولد الرئيس محمد حسني مبارك في قرية كفر مصيلحه محافظة المنوفية، بمنطقة الدلتا بقلب مصر، في 4 مايو 1928.<br />وفي عام 1950، التحق بالكلية الجوية حيث حصل على درجة البكالوريوس في العلوم الجوية وتدرج بعد ذلك في عدد من المناصب القيادية في القوات الجوية المصرية: كطيار، ثم مدرس، فقائد تشكيلات، فقائد لقاعدة جوية، وتلقى دراسات عليا بأكاديمية \\\"فرونز\\\" العسكرية في الاتحاد السوفيتي.<br />وقد تميز الرئيس مبارك طوال فترة عمله بالقوات الجوية بالانضباط والتميز، وهو ما أهله لأن يعين في عام 1964 قائداً لإحدى القواعد الجوية غرب القاهرة، ليكون أصغر طيار يقود قاعدة جوية.<br />وفى عام 1967 عُين مديراً للكلية الحربية، ثم رئيساً لأركان حرب القوات الجوية المصرية. وهو المنصب الذي ظل يشغله حتى تم تعيينه قائداً للقوات الجوية عام 1972. وخلال هذه الفترة، تمكن من إعداد كوادر جوية مقاتلة خاضت معركة أكتوبر 1973 وكان الرئيس مبارك صاحب خطة الضربة الجوية الأولى.<br />عقب حرب أكتوبر 1973، رقي لمنصب فريق جوى. وفى عام 1975، اختاره الرئيس السادات نائبا لرئيس الجمهورية، ثم عُين نائباً لرئيس الحزب الوطني الديمقراطي عام 1978."
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421184434/http://masr.20at.com:80/newArticle.php?sid=15297"

