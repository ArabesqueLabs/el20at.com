[[comments]]
order = 1
subject = "من مصدرك ؟"
author = "من السعودية"
text = "( ... لكن في الخليج تطول أحياناً إلي ثلاث ليال، ويقوم بعض الرجال ممن يرغبون في الزواج من السيدة المطلقة - التي تقيم حفلها - بإرسال هداياهم لها مع أقاربهم مثل العطور والمجوهرات ... )<br />أنا في الخليج وتحديدا في السعودية ، وهذه أول مرة أسمع بها هذا الكلام ، آمل تأكيد هذه المعلومة .. وتعريفنا على المصدر ."
archived = "2008-08-01"
capture_url = "https://web.archive.org/web/20080801111151/http://masr.20at.com:80/newArticle.php?sid=16902"
