subject = "اما ناس فاضية اوى"
author = "لسه مشاركة من شويه"
text = "يا عينى على حال اللى مش عارفين يطلقوا من أصله<br />لا الجواز نافع ولا الطلاق نافع ويظل آدم وحواء فى مناقرة طول الحياة"
