text = "بيضللنا وبيحاول يهرب من الاسئلة وبيجاوب بطريقة ظاهر فيها انه مش بيقول المطلوب منه<br />وقد ايه المذيعة فى اول اللقاء بان عليها الخوف منه بس عجبنى جدا طريقتها فى المحاورة وسرد الاسئلة وقد ايه كانت بتقول الاسئلة بدقة وصح علشان الغلطة فيها ؟؟؟!!"
