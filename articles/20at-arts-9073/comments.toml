[[comments]]
order = 2
subject = "سقطة اعلامية"
author = "محمد عبد المقصود"
posted = "2008-05-17"
text = "لقد كنت احترمك كثيرا يامنى لعدة اسباب من أهمها الموضوعية وتحري عرض كل الوجهات رغم اختلافك الفكري معهم وتميزت موضوعاتك بالموضوعية المهنية ولكن لم اكن اتصور - بما كونته عنك انك وطنية بمعنى تحبي الوطن وليس الحزب الوطني- أقول ولكن لهثك خلف هذا الموضوع وظهورك على أنك حققت مالم يحققه غيرك للقاء مع المدعو بوش وهو اصبح خارج الخدمة ورغم ذلك يعلن ما يعلن بتبجح فأين نخوتك وحبك لوطنك وغيرتك على بلدك أم أنها سقطت في الجري خلف السبق وحب الظهور على الأتراب لقد لحقت بالمدعو معتز إن لم تصححيما فعلتي.<br />أرجو أن تصححي وتكفري عن خطأك بالحرص على إبراز الرأي الآخر وأحرصي أن يكون مع هنية حفظه الله وسدد رميته في نحر بوش وأذنابه."
archived = "2010-03-14"
