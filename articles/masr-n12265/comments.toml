order = 2
subject = "الاقباط بقايا الجالية الرومانية"
author = "مصرى"
posted = "2007-11-05"
text = "هل الاقباط مصريون ؟ كلا - انهم بقايا الاحتلال الرومانى والجالية الرومانية الكبيرة التى هزمها عمرو بن العاص<br />انهم ورثة التثليث الوثنى بتاع ايزيس الام مريم والاب ازوريس والابن حورس الة واحد امين<br />لقد قضى هؤلاء الرومان على اللغة الهيروغليفية بكتابة حروفها بالحروف اللاتينية وقضوا على كتابتها تماما<br />اما المصريون الموحدون اصحاب ديانة رع الة الشمس حيث يأمنون بالالاة الواحد الاحد فهؤلاء وهم الاغلبية وجدوا الاسلام دين التوحيد الاقرب الى قلوبهم فأسلموا ودخلوا فى دين اللة افواجا وهم الاغلبية العظمى والمطلقة من شعب مصر<br />وحفظت اللغة العربية والعامية المصرية اللغة الهيروغليفية بين مفردات كلماتها وهناك 90 % من مفردات اللغة الهيروغليفية لا زالت تتداول فى اللغة العربية ككلمة امبو وتاتا خطى العتبة وزلطة ووو ووو وو<br />اذن بقايا هؤلاء الرومان اصحاب العيون الخضر والسحنة البيضاء لا يمكن ان يكونوا مصريين<br />بل كلهم جواسيس وعملاء للاستعمار زى المعلم يعقوب بتاع حملة نابليون<br />وهم من يفسد فى المجتمع المصرى بالرشاوى والنسوان السايبة العريانة والقيم السايبة"
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107044658/http://masr.20at.com:80/newArticle.php?sid=12265"

