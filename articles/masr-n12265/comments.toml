subject = "أسقف يسرق أموال أم نصرانية مكلومة في ولدها"
author = "اكتب اسمك هنا"
posted = "2007-11-05"
text = "أسقف يسرق أموال أم نصرانية مكلومة في ولدها<br />ترجمة تعليق مشرف مدونة التنصير فوق صفيح ساخن:<br />هذه قصة أم أمريكية دفعت بوحيدها إلى أتون الحرب الصليبية الدائرة في العراق فعاد إليها منهار نفسياً وحطام شاب سرعان ما أقدم على الانتحار ولم يبلغ الثالثة والعشرين من عمره الذي ضاع سدى.<br />وتتذكر هذه الأم كلمات قسيس بلدتها المعروف لديها منذ ريعان الصبا وأمين سرها إذ كان راعياً لمراسم تأبين جثمان ابنها في الكنيسة وكيف طيّب خاطرها وكم تعزت بقوله يومذاك.<br />ولم يتوقف دعم القسيس العاطفي لتلك المرأة عند هذا الحد لكنه استمر يتصل بها ويتردد على بيتها يستمع لبوحها ويقدم لها المواعظ والمشورة كلما احتاجت إليها في الظروف الصعبة التي مرت بها بعد حدث فقدان ولدها.<br />لكن تلك العلاقة البريئة في ظاهرها كان لها ما وراءها إذ تغيرت نحو منعطف جديد فور أن أخبرت المرأة قسيس وراعي الكنيسة التي تذهب إليها أنها تحصلت على مبالغ كبيرة نظير تعويض شركة التأمين لها في قضية انتحار ولدها.<br />فما كان من القسيس الذي يشغل منصب أسقف (رئيس قساوسة) إلا أن يخبر تلك المرأة المكلومة أن ((الرب يسوع)) – بحسب معتقد النصارى الكفري في المسيح – أوحى إليه (!!) بأن يسألها قرضاً مالياً قدره 25000 دولار “من أجل كنيستي!”، كما زعم الأسقف ((المبجل)).<br />وفي اليوم الثاني حررت الأم ((المسكينة)) شيكاً بالمبلغ وأعطته للأسقف لتحرر له بعدها بشهرين شيكين آخرين بمبلغ 75000 دولار أمريكي استجابة لـ ((وحي الرب))، على خلفية ايمانها النصراني في أن المسيح وأمه عليهما السلام يظهران للقساوسة والكهنة والمختارين من النصارى ويوحيان إليهم ويكلمانهم في اليقظة والمنامات.<br />فكيف لتلك المرأة أن تتردد في تكذيب الأسقف الذي تأخذ عنه الغفران من الخطايا والذنوب وهو واسطتها لدخول ((الملكوت)) أو الفردوس… من أين لها أن تكذب أو تشك وهذا المعتقد هو ركن هام من أركان دينها؟<br />ولما ماطل الأسقف في تسديد القروض قال للمرأة التي منحته ثقتها الكاملة أنه بصدد الدخول في صفقة مربحة تدر عليه الملايين بعدها يرد لها مالها أضعافاً مضاعفة (التعاملات الربوية ليست محرمة في النصرانية).<br />وبعد مرور عام على هذه الوعود المغرية بإسم ((الرب يسوع)) صرحت المرأة المخدوعة للصحافة الأمريكية أنها فقدت كل أمل في رؤية مالها من جديد بعد أن فقدت ولدها الوحيد في الحرب الغاشمة على العراق.<br />خدعها جورج بوش ومن معه وقالوا لها “حرب على الإرهاب من أجل تحرير العراق حفظاً لأمن أمريكا” وحرموها من فلذة كبدها الذي ذهب ليخدم من حيث يعلم أو لا يعلم مشروع الصليب في المنطقة فكانت نهايته على يده منتحراً، وصليب أصغر بائس يقف شاهداً على قبره، وهذه والدته التي ربته وتعبت عليه تدفنه ليأكل الدود زهرة شباب جسده، ثم تبكيه إلى أن يسرق الأسقف الأموال التي جاءتها تعويضاً لها على هذا المصاب الجلل.<br />من صليب بوش الذي رفعه علوجه على أبواب الفلوجة في رمضان منذ ثلاث سنوات مروراً بصليب قبر ابنها المنتحر وانتهاء بصليب الكذب الذي يتدلى من رقبة الأسقف النصاب، كانت هذه قصة رحلة تلك المرأة الأمريكية النصرانية التي صلبت حية ثلاث مرات!! ومن صليب إلى صليب يا قلب لا تحزن!<br />وصدق الحق تبارك وتعالى إذ يقول:<br />{يَا أَيُّهَا الَّذِينَ آمَنُواْ إِنَّ كَثِيرًا مِّنَ الأَحْبَارِ وَالرُّهْبَانِ لَيَأْكُلُونَ أَمْوَالَ النَّاسِ بِالْبَاطِلِ وَيَصُدُّونَ عَن سَبِيلِ اللّهِ وَالَّذِينَ يَكْنِزُونَ الذَّهَبَ وَالْفِضَّةَ وَلاَ يُنفِقُونَهَا فِي سَبِيلِ اللّهِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ} (34) سورة التوبة<br />مصدر الخبر في أصله الأنجليزي على هذا الموقع الاخبارى<br />Grieving mom says pastor cited God to get money"
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107044658/http://masr.20at.com:80/newArticle.php?sid=12265"

