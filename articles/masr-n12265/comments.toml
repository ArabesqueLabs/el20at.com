subject = "كنيسة خاصة لكل اسرة"
author = "واحد"
posted = "2007-11-05"
text = "فى عاصمة احد المحافظات احصت احدى الكنائس عدد الاسر المسيحية الموجودة ب 800 اسرة ويوجد لها حوالى 40 كنيسة فى تلك المحافظة اى بمعدل 20 اسرة لكل كنيسة وهذا رقم خرافى جدا وليس موجود فى الفاتيكان نفسها ولا يتحصل المسلمون على عشر ما يخصهم من دور عبادة فى مصر<br />ومع ذلك يقلب كلاب المهجر الدنيا كلها بحجة ان مصر تمنع بناء الكنائس<br />ويظهر فى مخيلتهم المريضة ان كل واحد فيهم عايز كنيسة مخصوصة لة هو يصلى فيها لوحدةونملى البلد كنايس ولما يشوفوا الكنايس كتير تبقى مصر مسيحية وطبعا دا عشم ابليس فى الجنة"
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107044658/http://masr.20at.com:80/newArticle.php?sid=12265"
