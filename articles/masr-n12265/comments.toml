subject = "قبطي يسرق كنيسة العذراء بالقليوبية"
author = "اكتب اسمك هنا"
posted = "2007-11-05"
text = "قبطي يسرق كنيسة العذراء بالقليوبية<br />أمر أحمد عزوز مدير نيابة الخانكة بحبس سائق القس «يسطس فانوس» راعي كنيسة العذراء بالقليوبية &--1636; أيام علي ذمة التحقيقات سرق خزينة الكنيسة وبداخلها &--1636;&--1637; ألف جنيه، وادعي أن مجهولين اقتحموا الكنيسة وارتكبوا الحادث كشفت المباحث غموض الواقعة وأدلي المتهم باعترافات تفصيلية في تحقيقات النيابة.<br />قال المتهم غبريال نادر عزيز «&--1635;&--1637; سنة» إنه يعمل سائقاً للقس يسطس فانوس «بطرس» راعي كنيسة السيدة العذراء «مطرانية الأقباط الأرثوذوكس» بمنطقة ورش أبوزعبل منذ أكثر من &--1637; سنوات تزوج قبل عامين وأنجب طفلة، تطالبه الزوجة بمصاريف بالغة تفوق راتبه الشهري، حاول الالتحاق بعمل إضافي إلا أن الوقت لم يسمح له.<br />ذات يوم شاهد السائق القس يسطس ومعه &--1635; آخرون من مسؤولي الكنيسة داخل حجرة مبني الخدمات الملحق بالكنيسة وقفوا أمام خزينة حديدية، بابها كان مفتوحاً تظهر المبالغ المالية منه.. وقف السائق علي باب الحجرة اتخذ قراره بالاستيلاء علي تلك الأموال عاين المكان والحراسة الأمنية علي الحجرة حدد طريقة الدخول عاد إلي منزله اتصل بالقس وأبلغه أنه مريض واستأذن في الراحة واستقر القس داخل منزله هو الآخر. توجه السائق إلي الكنيسة غافل حارس الحجرة ويدعي جاب الله غالي سليمان وكسر زجاج الباب الداخلي المفضي إلي الحجرة حمل الخزينة ووضعها داخل حقيبة سيارة القس وعاد إلي منزله خبأ الخزينة في جدار خزان الصرف الصحي بداخل منزله ولم يفتحها.<br />وأضاف المتهم أنه ارتكب الواقعة نظراً لمروره بضائقة مالية كما أن المبالغ التي شاهدها في الخزينة أغرته واعتقد أنها ستحل له كل مشاكله واستمعت النيابة لأقوال حارس الحجرة والقس الذي قام بفتح الخزينة وأكد سلامة الأموال الموجودة بها، أمرت النيابة بالتحفظ علي الخزينة لحين انتهاء التحقيقات."
archived = "2007-11-07"
capture_url = "https://web.archive.org/web/20071107044658/http://masr.20at.com:80/newArticle.php?sid=12265"

