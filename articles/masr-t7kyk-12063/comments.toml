text = "اول مرتب استلمتة سنة 1970 كان 20 جنية وكان الرئيس عبد الناصر موجود<br />كان كيلو اللحمة 35 قرش ولتر البنزين 5 قروش ولتر الكيروسين قرش صاغ وثمن جريدة الاهرام قرشين صاغ واجرة القطار بين القاهرة واسكندرية 35 قرش وكان ثمن جرام الذهب ثلاثة جنيهات وسبعون قرشا والسيارة الفيات 128 تجميع مصرى ب 4 الاف جنية وايجار الشقة ايجار جديد ب 8 جنية فى عمارة جديدة - رغم الحرب ورغم النكسة<br />وكان اقصى ما يمكن ان اصرفة وانا اقيم مع والدى 10 جنيهات واوفر 10 جنيهات<br />وحينما ذهبت الى الحرب اعطونى 20 جنيها اخرى من الجيش بالاضافة الى 20 جنية من شغلى المدنى فاصبحت غنى جدا ومش عارف اعمل اية بالفلوس دى كلها<br />كان الدولار رسميا ب 37 قرش والريال السعودة ب 15 قرش<br />كانت مصر عمار ومصر ام الدنيا<br />وظلت هذة الاسعار مع الرئيس المؤمن بتاع اخلاق القرية<br />اما الرئيس الحكيم فقد خفس بالجنية المصرى الارض واصبح فى خبر كان تحت مسمى الاصلاح الاقتصادى"
