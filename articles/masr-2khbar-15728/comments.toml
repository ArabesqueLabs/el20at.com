text = "تعرفوا المشكله فين , المشكله اننا ملناش كبير ,<br />صدقونى المشكله مش مشكله مسيحين او مسلمين , المشلكه ان كل واحد فينا ملوش كبير<br />على شان كده لما بتحصل معاه مشكله هو الى بيتصرف , انما لو كان لينا حد نثق فيه ونقدر نعرف اننا لو عندنا مشكله ورجعناله هيحكم بالحق ومش هيحكم لمصلحته او لمصلحة الاكبر منه مكنش ده بقى حالنا"
