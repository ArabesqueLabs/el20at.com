text = "[quote name=\"بلطجة الكنيسة\"]الكنيسة هيجت الناس - بالبلطجة عملت سور خارج حدود قطعة الارض المخصصة للكنيسة ومدت السور ليسد الشارع اللى الناس بتمشى فية وكانة فرض امر واقع<br />طبعا الناس هاجت وهدمت السور اللى سد الشارع بتاعهم واللى وقف ضربوة بالقديمة انا مش عارف هما مستقويين اليومين دول لية<br />على فكرة احنا مش بنخاف من امريكا وعليهم ان يتذكروا ان مسيحى العراق تم طردهم بالكامل من العراق والعراق تحت احتلال الجيوش الامريكية :-|<br />:-x[/quote]<br />اللي كتب التعليق ده هو اللي المفروض يتحاكم بتهمة الخيانة العظمي واثارة الفتنة لان كلامه يعني الاتي:<br />1) هناك حالة من التربص لدي مسلمي مصر تجاه مسيحييهم وسوف يقومون بطردهم من مصر اذا ثارت فوضي مثل تلك التي حدثت في العراق بعد احتلاله<br />2) كلامه دليل علي انه يري انه ينتمي الي مسلمي العراق اكثر من انتمائه الي مصروشعبها المسيحي اخوته في الوطن<br />3)والناس هاجت واللي وقف ضربوه بالقديمة...كأن مصر مافيهاش قانون ولا بوليس ويجب علي الافراد ان يأخذوا حقوقهم بايديهم ويضربون من يعارضهم بالقديمة (قارن مع أفعال وأقوال الاخوان داخل البرلمان المصري وبين مبدأ بالقديمة المذكور هنا)"
