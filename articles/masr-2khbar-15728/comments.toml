text = "انا مسلمه وعارفه الي فيها انا في مطروح مسلمين ومسحيين بنحب بعض قوي والله مفيش اي حاجه بينا واتربينا في خضن الكنيسه وبيتنا كان جامبها وكل المسحيين اهلنا واعز الناس لينا بناكل في بيوتهم وبيكلو في بيوتنا وكتبين معانا في قبايل العرب ومش حسيين انهم اغراب لان احنا هنا في مطروح بنتكلم بلغة البدو ومتعرفش مين مسيحي ومين مسلم ولو انت من مطروح انزل هاتشوف ان احنا بيوتنا في بيوت بعض والكنيسه الي في شارع المحطه جامبها مدرسه اسمها تحفيظ القران والكنيسه في بيوت العرب والحيطه في الحيطه لا عزلو ولا بنو حتي سور عالي وكلنا عارفين كده وتلاقي كمان ان المسلمين مش فارقه معاهم لان لكم ديناكم وليا دين وان كان الي حصل ده غلط من الاول علي الحكومه<br />ولوفي حد هنا من مطروح يقول ويشهد بالحق"
