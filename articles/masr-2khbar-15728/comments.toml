text = "علي فكرة شنودة سليم ده اسمي لان فيه ناس هنا بتفهم غلط<br />ثانيا الأخ اللي بيقول احنا عايزين مساجد بمساحة دير واحد اقول له كفاك ان لديك مسجد بمساحة مصر كلها فمن حق أي مسلم اياً كان ان يفرش سجادة صلاة في أي مكان في مصر ويصلي فروضه حتي لو كان هذا المكان داخل جامعة أو مدرسة أو مصلحة أو في شارع أو حتي في بيته ..... بينما اذا صلي المسيحي قداس في بيته تقوم الدنيا ولا تقعد<br />ثالثا : الناس اللي بتتكلم عن اعتداء الكنيسة علي حرم طريق لازم يعزفوا ان المساحة اللي حاولت الكنيسة تعمل حولها سور هي 180 متر اشترتها الكنيسة ...... ولو كان هناكمحاولة لاغلاق شارع كما قال البعض فلينظروا ما تفعله المساجد والزوايا كل يوم جمعة ليعرف معني اغلاق الشوارع بالامر الواقع والبلطجة وعدم احترام المصلحة العامة (ده ساعات يبقي الجامع جوه فاضي والناس فارشة برضه في الشوارع جنبه)<br />فالمسلم الذي يدعو الي احترام المصلحة العامة كان يجب ان يهاجم المساجد بالاسلحة عندما تغلق الشوارع حولها (مش بيقولوا المسلمين ضربوا المسيحيين بالسلاح لانهم عايزين يضروا بالمصلحة العامة وهم كان هدفهم حماية للمصلحة العامة؟؟) واضح الكلام وللا نقول كمان"
