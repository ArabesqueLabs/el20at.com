text = "بالنسبة للاخين اللي عللقوا قبل مني<br />واحد مسيحي اهبل بيقول العين بالعين و السن بالسن و التاني مسلم متخلف عقليا و بيهلفط و خلاص<br />انا فعلا اسف علي الكلام دة بس قولت الشتيمة جايز تفوقوا شوية<br />المسيحين دول مش جالية وافدة قاعدين في مصر شوية ياخدوا واجبهم و ماشيين تاني دول مصريين ليهم نفس حقوق و عليهم نفس الواجبات اللى على اى مصري عايش على الارض دى<br />و باعدين يروحوا جماعات للساحل الشمالي واللا مايروحوش انت مالك انت هتحدد اقامتهم واللا فرضت نفسك رب علي الناس واللا تكون من الناس اللي عندهم مرض افتراض المؤامرة<br />ربنا يعافينا ويعافيك<br />بانسبة للاخ المسيحي العيان التاني يا اخي العين بالعين دي كنتوا بتعيبوا عليها بما انها من كلام الرسول محمد ص من امتي بقيتوا بتتبعوه وبتنفذوا كلاموه مش تهده كدة وتاخد نفسك قبل ماتتكلم علي مصري زيه زييك حمار وفاكر ان انت كافر (مع انه ماشافش الكفرة اللى بجد شكلهم اية) وانك عدوه و سايبيين حكومة المحروسة تلعب فيكو انتو الاتنين"
