text = "أولا رداً علي الاخ صاحب التعليق رقم 11<br />لقد ظلت مصر مسيحية طيلة 6 قرون قبل دخول الاسلام اليها والدليل علي ذلك ان عبادة امون رع انتهت تماما من مصر (ومعها عبادة سيرابيس) في القرن الثاني الميلادي واوائل القرن الثالث وبقيت قلة محدودة من عبدة ايزيس في جزيرة فيلة حتي القرن الرابع الميلادي وعندما دخل عمرو بن العاص مصر كانت كلها مسيحية أما القول بأن مسيحيي مصر اصلهم روماني فهو الجهل بعينه<br />ثانيا : الاستاذ سامح زعلان ان مصريين مسيحيين راحوا يعمّروا حتة من مصر ويستفيدوا من دخل السياحة اللي داخل لمصر وبيتكلم كأنهم رايحين يعملوا غزو علي بلد مش بلدهم وكأن فيه مخطط خفي لفتح مطروح من قبل المسيحيين ......... يا اخي بُص علي الاديرة اللي في صحراء مطروح وانت تعرف هي اساسا ايه<br />كلامك ده معناه انك كاره الاقباط وعايزهم يسيبوا مصر وعشان اريّحك دة بُعدك وعلي فكرة قبطي مشتقة من (قبط) وده كان اسم مصر زمان علشان كدة في اليوناني كان اسم مصر (ايجبتوس) وده الاسم اللي بقي في معظم لغات العالم (ايجبت) وترجع في الاخر تقول انت وامثالك من كارهي المصريين واصحاب الفكر الوهابي السعودي اني مش مصري؟؟؟؟"
