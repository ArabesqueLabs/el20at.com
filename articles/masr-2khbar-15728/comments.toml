text = "اليست الاديرة جمع دير من دور العبادة<br />النصارى عايزين قانون دور عبادة موحد<br />طيب يا اخويا انت وهو مساحة دير واحد للنصارى 10 الاف فدان<br />10 الاف فدان مساحة دير واحد تعادل نصف مساحة كل المساجد الموجودة فى الدولة<br />انتم عايزين اية بالضبط<br />الحكومة بتدلعكم على الاخر<br />والاجرام انكم تضموا شارع فى مرسى مطروح لارض الكنيسة وكانها بوابة من غير بواب<br />ناس عمالة تهيص وتصرخ وتعوص زى الكلاب ولما احد يقول لهم حقيقة يردوا انتم جهلة<br />عايزين ارض للمساجد تعادل ارض الاديرة"
