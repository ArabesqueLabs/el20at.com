posted = "2010-03-14"
text = "من هم الاقباط ؟؟؟؟؟؟؟؟<br />هم أهل مصر اصلا قبل ان يكونوا مسيحيين أو مسلمين ( ونقول تاني ان قبطي من (جبت) وهي اسم مصر اللي اتاخد منه Egypt) وبعضهم كان فعلا من حكام الاقاليم في عصر الرومان والعرب لسبب أن الغزاة عادة ما يحضرون فقط حامية عسكرية تنتشر في المواقع الرئيسية في البلد التي يحتلونها بينما يظل الهيكل الاداري العام للدولة ثابت<br />ولمن يريد معرفة الوضع الحقيقي لمصر عندما دخلها عمرو بن العاص عليه ان يقرأ ما كتبه يوحنا النقيوسي وهو احد معاصري الغزو العربي لمصر بل وله ان يقرأ كتابات من جائوا بعد ذلك من عرب مثل المقريزي عن هذه المرحلة ليعرف من هم الاقباط (واسألوا أهل العلم ان كنتم لا تعلمون يا كتبة التعليقات الجاهلية الجاهلة)<br />والكلام عن الجنرال يعقوب مردود عليه لان في وقت كان فيه محمد كريم بطلا بسبب رفضه التسليم للحملة الفرنسية كولاء منه للاحتلال العثماني فان الجنرال يعقوب هو اول من حاول تكوين جيش مصري وطني بهدف الحصول علي استقلال مصر وخرج من مصر مع الحملة الفرنسية محاولا عرض قضية استقلال مصر علي الدول العظمي وهذا نفس ما قام به سعد زغلول لولا انه وافته المنية وهو في عرض البحر .. نقول كمان؟؟؟"
