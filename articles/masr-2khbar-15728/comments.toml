text = "المشكلة يا استاذ محمد في الموقف ده والمواقف المشابهه السابقة ان الناس مابتستناش لحد ماتشوف الكبير هايعمل ايه لكن تحس انهم مابيصدقوا يلاقوا سبب علشان يقرفوا اخواتهم في الوطن في عيشيتهم وكأن القرف اللي بنشوفه كلنا مش كفاية .............<br />أرجو ان كلامي يوصل لعقول وقلوب اخوتي المسلمين لنقضي علي هذا الصوت الداعي لتقسيم الوطن لكي يتم اخيرا تحقيق المساواة بين كل المواطنين الحاملين للجنسية المصرية بغضّ النظر عن اي شئ أخر انه مصري ............ مسام بقي وللا مسيحي وللا يهودي وللا بهائي وللا حتي ملحد .... نبقي كلنا زي بعض وساعتها تبقي دي البداية الحقيقية علشان كل مصري يحس بقيمة الجنسية اللي بيحملها مش يجري علي أول سفارة تفتح له بابها و(يعمل قرد) لحد ما ياخد جنسية تاني غير جنسية مصر.................. عرفت بقي المشكلة فين يا استاذ محمد"
