text = "التعليقات هنا اثبات علي ان فيه اضطهاد وتمييز ضد مسيحيي مصر الاقباط من مسلمي مصر الاقباط برضه (لأن قبطي يعني مصري واللي مش عايز يبقي قبطي يسيب البلد ويمشي)<br />احنا كلنا اهل بلد واحد مش دخلاء ولا عملاء ولا غزاه ومش عايزين نفتح كلام في المواضيع دي تاني وارجو من اي فرد يشك في مصرية المسيحيين أو انتمائهم ان يقرأ تاريخ مصر من مصادر غير كتب المدارس<br />واللي بيقول ان الحكومة مدلعانا يشوف كام اعتداء تم ضد المسيحيين في مصر دون محاسبة المعتدين او حتي صرف تعويضات مناسبة للمتضررين ....... وانظر كم برنامج ديني اسلامي يتم بثة علي تليفزيون الحكومة اللي مدلعانا مقابل قداسين مش كاملين علي الاعياد ... كيف اشعر انني مدّلع قوي كدة والدولة في اعلامها الرسمي تعتبرني غير موجود في البلد اساسا وبتتذكر ان فيها مسيحيين مرتين في السنة والمساحة الاعلامية للمسيحيين مثل تلك التي تعطي لدولة كوالالمبور في عيدها القومي.... وكيف اشعر انني في منتهي الدلع وانا ممكن في اي لحظة افقد بيتي وسيارتي ومحلي وحياتي ودون محاسبة لأحد .... والله لو ده دلع يبقي ياريت الحكومة تبطل تدلّع شعبها ..... كفاية وللا نقول كمان؟؟؟؟"
