text = "مش بالمساحة يا استاذي العزيز<br />الاديرة دي موجودة قبل ما يكون في مصر واحد مسلم والفكرة ان الاسلام مافيهوش لا تنسك ولا رهبنة يبقي تعوزوا تطلعوا في الصحرا وتاخدوا مساحات تعملوها مساجد ليه؟؟؟؟؟؟؟<br />ولو هاتعملوا مساجد في الصحرا يا عم بس تستصلحوا الارض حواليها زي الاديرة يا عم يا ريت ولعلمك الدير اللي مساحته 10 تلاف فدان زي ما بتقول( وده رقم مبالغ فيه ) بيكون فيه كنيستين أو تلاتة مساحتهم كلهم ما بتزيدش عن 500 متر وباقي المساحة مباني اثرية واراضي بيستصلحها الرهبان لان الراهب في المسيحية لازم ياكل من عرق ايديه ....... فهمت وللا نقول كمان؟؟؟؟"
