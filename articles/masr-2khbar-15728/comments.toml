author = "من هم الاقباط ؟"
posted = "2010-03-14"
text = "هم طائفة من الرومان والاغريق واليهود المتمصرين الذين يتوزعون فى الاقاليم وهم جالية كبيرة<br />ما هى وظيفتها ؟<br />جمع الجزية من المصريين وضربهم واذلالهم ويعملون لاى حاكم يحكم مصر<br />فهم جمعوا الجزية للفرس حينما اتوا الى مصر<br />وجمعوا الجزية للرومان واذلوا المصريين وضربوهم بالكرابيج وقتلوا منهم كثيرون<br />وحينما اتى عمرو بن العاص ترك الامور الادارية كما هى وتركهم يجمعون الجزية ويسلمونها لة<br />واستمروا فى جمع الجزية وتسليمها لجميع الحكام من الفاطميين والمماليك والتاريخ مملوء بقصص رهيبة من اذلال هؤلاء الاقباط للمصريين وجمع جزية بمبالغ رهيبة يسرقون نصفها<br />وعملوا تحت اسم وظائف الملتزم والمشد وهم جباة الجزية والضرائب<br />ومن قسوة معاملتهم هرب بعض الناس من دينهم الى الاسلام<br />الى ان انهى محمد على باشا نظام الالتزام وجباية الضرايب وجعل الدولة مدنية<br />ان لهم تاريخ اسود فى خدمة جميع الحكام<br />وحتى عندما اتى نابليون جاء جابى جزية من الصعيد اسمة المعلم يعقوب وتحالف معة ضد الشعب المصرى<br />تاريخكم اسود"
