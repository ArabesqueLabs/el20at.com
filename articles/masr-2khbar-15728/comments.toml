posted = "2010-03-13"
text = "الاستاذ اللي بيقول ان مافيش حاجة اسمها تراث قبطي ماتعرفش ان فيه في بلدك متحف اسمه المتحف القبطي؟؟؟؟ وان الصورة الاخيرة للغة بلدك قبل اندثارها كان اسمها اللغة القبطية ؟؟؟؟ وان الفن والفكر القبطي يختلف تماما عن التراث الفني الروماني لأو اللاتيني اللي انتشر في اوروبا؟؟؟؟؟؟ يا ريت اللي يتكلم يتكلم عن علم لكن الحق مش عليك الحق علي مناهج التاريخ اللي كانت بتنط مباشرة من العصر الروماني للعصر الاسلامي وكأن مصر مكانش فيها شعب اصلاً<br />وزي ما احنا مابنتكلمش عن احتلال عربي لمصر بالاولي ان المحتل اللي انا قبلته بحكم التاريخ كأخ وشريك في الوطن انه مايشككش في مصريتي<br />وبالنسبة للاخ اللي مابيخافش من امريكا وبيهددنا ان يحصلنا زي ما بيحصل لمسيحيي العراق وفرحان ان ناس بيطردوا من بلدهم أقول له ولأمثاله أنا ماباخافش لا منك ولا من امريكا ولا من اي انسان زيك مابيخافش من ربنا لان الهي قادر يحميني........ وهو ده اللي انا وكل الاقباط بنستقوي بيه لان الله أقوي من امريكا وايران والعراق ومنك انت شخصياً ومش هاسيب البلد دي غير لما اموت ...... فهمتوا وللا اقول كمان"
archived = "2010-03-14"
