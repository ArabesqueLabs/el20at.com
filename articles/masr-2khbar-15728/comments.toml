text = "علي فكرة انا دارس تاريخ كويس وماباتكلمش من فراغ وكمان دارس جيد للغة بلدي الاصلية (القبطي) كما انني قارئ جيد لكتب التاريخ عن نشأة المسيحية في مصر وحتي دخول العرب لمصر ولمنيريد ان يستزيد علما عن هذه الفترة المنسية في تاريخ مصر عليه قراءة كتب مثل تاريخ الامة القبطية (خللي بالك احنا امة مش جالية) بقلم مسز بوتشر وكتاب هوامش علي الفتح العربي بقلم الدكتورة سناء المصري وترجمة مخطوطة يوحنا النقيوسي (تاريخ العالم القديم) والتي نشرت مؤخرا الي جانب لقطات من كتاب (فتوح مصر واخبارها) لابن عبد الحكم<br />يعني اللي يكلمني عن التاريخ يبقي عارف انه مابيكلمش واحد جاهل<br />واحب اقول ان اي وضع تاريخي لن يؤثر علي حقيقة ان هناك افراد داخل مصر يحملون الجنسية المصرية هم في اعين مصريين اخرين ( جالية وبقايا جباة الجزية ) ينفع ازاي نتكلم عن مواطنة وعندنا ناس جهلة بتقول كلام زي ده والمصيبة ان مافيش مسلم واحد حاول يرد عليهم<br />لنا الله ........... اعتقد ان كفاية كدة وعيب اننا نقول كمان"
