[[comments]]
order = 12
subject = "نقف وقفه رجاله"
author = "ضد الحكومة"
posted = "2006-05-12"
text = "ربنا يكرمك يا محمد و يرجعك لعشرينات بالسلامه و بجد انا شايف ناس زهقانه و اتخنقت من الظلم خلاص بس المشكله ان احنا بنتكلم و احنا قاعدين في بيوتنا راكبين عربيه الاعتقلات بمزاجنا و احنا قاعدين نتكلم علي النت احنا لازم كلنا نتحرك الشعب كله يتحرك الشباب كله يتحرك نعمل زي محمد و لو اعتقلنا و اضربنا و لو متنا بس منفضلش قاعدين كده الامن و النظام لو شاف 70 مليون مصري بيقولو لأ و واقفين وقفه رجاله مصريين بجد مش حيقدر يعمل حاجه عايزين نشجع بعض و نقف ضد الظلم ونكلم الناس و نخليهم هما كمان يقفوا في وش الظلم لازم نصحي<br />و كفايه كده عشان متزهوش<br />و لغايه اما محمد يرجع يا ريت تبقي توقيعتنا في التعليقات<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100739/http://masr.20at.com:80/article.php?sid=306"

[[comments]]
order = 13
subject = "ايه الوساخة ديه"
author = "مصري مقيم باجمل بلد ( دبي )"
posted = "2006-05-12"
text = "ايه القذارةاللي بقت في الحكومة ديه انا حاسس ان الناس اللي بتضرب دول يهود او كفار او قوات احتلال حرااااااااااااااااااااااااااااااام عليهم اللي بيعملوه في الشباب المصري ده يا جماعة ازاي ده بيحصل وقوات الامن ديه اهالينا يعني اخواتنا وقريبنا اكيد كل واحد فينا ليه اب او اخ اوقريب ظابط ولا عسكري حتي إزاي الكلام ده بيحصل حاجة تجنن الوضع في مصر سئ جداً واتمني من الله ان يتحسن"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100739/http://masr.20at.com:80/article.php?sid=306"

[[comments]]
order = 14
subject = "اخدوا صاحبى منى"
author = "ياء"
posted = "2006-05-12"
text = "مكتوبالك يا محمد يا سيد<br />على فكره محمد اتاخد من قلب ميدان رمسيس اخدوه من جوه الجامع اه من جوه الجامع<br />محمد اخد 15 يوم حبس (يعنى الامتحانات راحت عليه )<br />منهم لله اخدو صاحبى منى<br />فى نشيد كنا بنسمعوا مع بعض كان بيقول<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100739/http://masr.20at.com:80/article.php?sid=306"

[[comments]]
order = 15
subject = "تفاصيل الخبر"
author = "ياء"
posted = "2006-05-12"
text = "قررت نيابة أمن الدولة العليا في وقت مبكر من صباح اليوم حبس ستة وستين من إخوان الإسكندرية خمسة عشر يوماً بتهمة التظاهر والشغب وذلك علي خلفية التضامن مع القضاة المحالين للتأديب أمس .<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />كانت قوات الأمن قد ألقت القبض علي المئات من الإخوان المسلمين الذين توافدوا من كل محافظات مصر لمساندة القضاة والتضامن معهم كما قامت بسد جميع المنافذ المؤدية إلي دار القضاء العالي ونقابة الصحفيين المصرية لمنهم من التفاعل في هذه المذبحة"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100739/http://masr.20at.com:80/article.php?sid=306"

