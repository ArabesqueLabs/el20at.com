[[comments]]
order = 21
subject = "تحت السطور"
author = "ياء"
posted = "2006-05-13"
text = "مصر حبلى و اللى ف بطنها ولد<br />ولد طول بعرض بحلاوة<br />في عينيه بريق<br />وف دمه خفه<br />مخلوطة بحبة شقاوة<br />مصر حبلى<br />ومش هبله<br />واللى ف بطنها<br />واد ع الفرازة متنقي<br />دمه زي العسل<br />وخالي م الغباوة !!!<br />منقول<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100739/http://masr.20at.com:80/article.php?sid=306"

[[comments]]
order = 22
subject = "صعيدي وعجبي"
author = "ابو علي"
posted = "2006-05-13"
text = "عليا النعمة اللي حصل ده يوم الأربع الأسود ما يرضي اي كافر علي وجه الأرض<br />وكمان شوية البلطجية ولاد الكلب اللي تبع الحزب الوسخ دول علي طول لما بتتزنق الحكومة علي طول تجيب شوية ولاد الكلب الي بيكسبو بهتافاتهم دي<br />وكمان ايه اللي عملتوه للنسوان يا ولاد الكلب في المظاهرات دي ؟<br />والله ليهم حق في اي دولة يدونا بالجزم علشان سعادة مبارك بيه الراجل الحلو<br />واحذر الكل ان البلد ان شاء الله هتولع عن قريب بس استنوا لما الطلبة تفضالكو وانتو موش عارفين يعني ايه الطلبة ؟<br />وكمان استنوا لما ربنا يكرم الصعايدة ويفوقو من الضغط اللي هما محطوطين فيه من الشرطة العميلة<br />واقولهالكو عمر مصر ما كانت مبارك ولا عمر مبارك كان مصر<br />واعجبي"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100739/http://masr.20at.com:80/article.php?sid=306"

[[comments]]
order = 23
subject = "إبادة شعب"
author = "أتمنى ألا أكون مصرى"
posted = "2006-05-14"
text = "لا بد أن يعاقب الرئيس حسنى مبارك على أفعاله إن ما يفعله هو إبادة جماعية للشعب المصرى وإغتيال لوجوده فمنذ أن إستولى عن الحكم بدون إنتخابات وهو يعلم عدم شرعية وجوده مما دفعه للإستيلاء على كل مقدرات البلد وثرواته وتزويره الإنتخابات به وتهميش الشعب وهذه نفس سياسة أى مستعمر فى إحتلال أى دوله إبادة الشعب وقهره حتى لا يكون هناك أى قوى تقف فى وجهه ونحن نطالب بمحاكمة دولية لحسنى مبارك على إبادته للشعب المصرى من تهميش وفقر وبطالة ومرض وإستيلاء على كل مقدراته وتزوير كل الإنتخابات لابد أن نقدم جميعاً عريضة محاكمة له على إتفاقية الكويز التى اضرت بإقتصاد مصر وعلى تصدير البترول لأمريكا لمدة عشرين سنة بنصف التمن وتصدير الغاز لأسرائيل وتصدير الأسمنت لها لبناء الجدار العازل وبيع الشركات والمصانع وهى من أملاك الشعب وليست من أملاكه وتهريب الأموال للخارج وإنتشار الفساد أنه مجرم ولا بد من عقابة كمجرمى إبادة الشعوب ولابد من نداء كامل من الشعب كله على ذلك فكيف سينظر العالم للمصريين بعد كل هذه الإهانات التى يتلقاها الشعب من حاكمه والفسدة من حوله العالم الذى كرم المصريين بأرفع الجوائز العالمين كيف سيتعامل اليوم مع المصريين"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100739/http://masr.20at.com:80/article.php?sid=306"

[[comments]]
order = 24
subject = "لا للتمديد لا للتوريث نعم لتعديل الدستور الف مره"
author = "نيفين..نيفى..نوفا"
posted = "2006-05-16"
text = "و الف اه و الف حسره<br />على مصر و شباب مصر<br />بقول لمحمد معلش يا ابنى<br />قدر الكبير بان يظل كبيرا<br />ربنا معاك و بكره ترجع و تلاقى شعارك بيختم كل التعليقات على الموقع<br />معلش دوله الظلم ساعه<br />و هفضل اقولها<br />البلد دى رايحه ف داهيه"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100739/http://masr.20at.com:80/article.php?sid=306"

