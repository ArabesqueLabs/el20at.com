text = "لالالالالالالالالالالا..للفساد..لالالالالالالالالالا لمبارك وسلالته..لالالالالالالالالالالالالالالا لقانون الطوارىء ..ونعم..نعم..نعم..لتعديل الدستور..أنتم أحقر المعانى والكلمات فى قواميس كل لغات الدنيا ..ربنا يخلصنا منكم ..ونلاقى داهية ترضى تاخدكم ...قولواآآآآآآآآآآآآمين"
