subject = "هو فيه ايه"
author = "وحيد ( الوهج الدامى)"
posted = "2006-06-06"
text = "تلقيت رسالة محمد الشرقاوى وبها تفاصيل<br />إنتهاك رجولته ( قديمة كلمة عذريته ) ولم اجد ما اغُعلق به عليها<br />سوى نقلها كاملة على مدوناتى وبتوقيعى فى المنتديات ؛ الغريب فى الامر ان سُلطاتنا المقدسة مازالت تُصر انها لم تفعل شيئا<br />ولم يحدث من الامر شىء<br />ياااااااااااااااااااااااااااااااااااااااااااه<br />لسانا فى الحلم عايشين لبكرة<br />فقط<br />تلك كلمتى لهؤلاء الزبانية"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 29
subject = "هو احنا فعلا فى مصر"
author = "أم محمد"
posted = "2006-06-24"
text = "ايه دة انا بعد ما شفت الصور والله حزنت حزن شديد وسألت نفسى هو احنا فعلا فى مصر والصور دى بتاعة مصريين والا دى غلطه مطبعيه يا جماعه دى اكيد صور اليهود اللى فى فلسطين بيضربوا الفلسطينين أو صور الاموريكان الكلاب وهم بيضربوا فى العراقيين لكن تقولى ان دى صور للمصريين على راى الست ام كلثوم اهو ده اللى مش ممكن ابدا وحسبنا الله ونعم الوكيل"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
