subject = "الاردن_ العراق"
author = "عمار سعد ابوهنية"
posted = "2009-02-25"
text = "بداية ,, السلام عليك ياوطن الكبرياء ,, السلام عليك يا بلد الرافدين,,, يا رافد الامة بالعلم والقيم<br />انني لا استغرب من طموحات هذا الشباب ,, لانهم يؤمنون بفجر الحرية ,, التي لامناص عنها في وطن يكره الغربان ,, في وطن تعودنا ان نصحو فيه على صوت العاصفير ,, ورائحة الحبر الازرق ,,,ونسمة دجلة ,,, وقراءات المتنبي<br />انكم ابناء العراق ,, ولستم ابناء المرحلة,, انكم تعون ما اقول؟<br />فهذا البلد مر بمراحل ولكنه بقي العراق العربي ,,, فمرحلة الهزل والظلم زائلة ,, وعودة العلم والعلماء قادمة<br />انني اتمنى لكم التوفيق والتسديد واللقاء القريب على ضفاف الفرات ,, وصديح صوت الغزالي ,, وطع شايكم المهيل ,, والنظر الى فتوة وزهو بغدادنا .<br />سيروا فان الحق معكم"
archived = "2010-03-14"
