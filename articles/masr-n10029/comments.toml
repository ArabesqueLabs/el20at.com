[[comments]]
order = 5
subject = "ربنا ياخد مرتضى منصور"
author = "سقراط"
posted = "2007-12-31"
text = "يا جماعة مرتضى ايه اللي انتوا بتتكلموا عليه ده راجل حرامي وواطي وناقص وبلطجي ونعم البلطجية رجل يقول ما لا يفعل ويلا يفعل اي شيئ رجل دائما ما يعتمد على تشويه صورة الاخرين فقط وللاسف يخشى الاخرون لسانه السيئ وبلطجته المعروفة ويسكتون يا مرتضى اين مخالفات كمال درويش التي ستدخله السجن يا مرتضى اين رشاوي اسماعيل سليم واين اختلاسات المندوه الحسيني واين واين واين يا مرتضى اقسم بالله اني زملكاوي حتى النخاع ارجوك ارحل عن نادينا وابعد عنا ربنا ينتقم منك انت السبب في المصايب اللي احنا فيها وحسبنا الله ونعم الوكيل فيك"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "عمـــــــــــــــار يامصر"
author = "فؤش المصرى"
posted = "2008-08-27"
text = "على فكرة ياجماعة مرتضى منصور من الشخصيات المحترمة المهمة جدا بجد والله بجدومش من حق أى حد يتكلم علية كلمة ملهاش لزمة لانة ميستهلش منكو كدا انتو لوشفتو هو عامل اية فى القرى الى حوالية هتصدقو وبجد الراجل دا يستاهل كل خير وبعدين يعنى مهو هى بلدنا دى كدا اللى يقول الحق فيها يبهدلوه ودى حاجة مش جديدة والراجل دا فعلا بيحب يخدم وانا مش بقول الكلام دا علشان حاجة لأن دى فعلا الحقيقة وانا بدعى ربنا يوفقك يامرتضى ويوقف جمبك ولاد الحلال"
archived = "2010-03-14"
capture_url = ""
