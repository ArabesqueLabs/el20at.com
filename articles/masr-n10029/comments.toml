[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "م"
text = "انا نفسي اعرف مرتضي منصور عملكوا ايه يا بلد ده رجل بجد يكفي انه لا يخشي فى الحق لومة لائم ومش منافق ذى الحكومه واتباعها وحاشيتها ربنا على الظالم يا رب."
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505025037/http://masr.20at.com:80/newArticle.php?sid=10029"

[[comments]]
order = 2
subject = "اشى خيال يا ناس"
author = "نيفين نيفى نوفا"
text = "مع احترامى يا جماعه بس مرتضى منصور برده عمل كتير و تاريخه معروف للجميع<br />و ده لا يعنى الشماته باى حال و لكن اذا كنا عايزين كل فاسد يتحاكم على اللى عمله فلا يصح ابراء ساحه مرتضى منصور باى حال من الاحوال<br />و ادانتى ليه مش من منطلق نوعيه القضايا اللى بيقبلها و لا علامات الاستفهام الكتيره اللى بتحيط بيه لكن من منطلق تبنيه الدائم و المستميت لمبدا البلطجه و علو الصوت و التهور<br />و احقاقا للحق الراجل ده برده ليه مواقف حلوه تحسب ليه و ان كانت قليلق و اشهرها تصديه الدائم للبهائين و حبه الحقيقى لنادى الزماللك بس كان دايما بيضيع كل حاجه كويسه يعملها بحاجه وحشه زى اللى بيعمل كيكه و يرش عليها ملح<br />امبارح جه زوجته و ابنه ف القاهره اليوم ووجههو نداء لسيد نوفا انه يتنازل فهل دا هيحصل و لا لا<br />الايام الجايه هتبين"
archived = "2007-05-05"
capture_url = "https://web.archive.org/web/20070505025037/http://masr.20at.com:80/newArticle.php?sid=10029"

