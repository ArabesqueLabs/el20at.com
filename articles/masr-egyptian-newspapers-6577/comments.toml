author = "مصراتى"
posted = "2007-07-07"
text = "زعبلة بيقول مصر فى قلب الامة بس بدى اسالة القلب والا الفشة والا يمكن الكلاوى والا بيت الكلاوى<br />مصر يا مفعوص بقت ماخور شرم الشيخ<br />بقت شط المايوهات الحمراء<br />قصر القبة هيتاجر مفروش للسفير الامريكى وهيعملوة المنطقة الخضراء<br />فين مصر واللى بيجرى فى لبنان<br />يا مفعوص سمعت عن اللى بيجرى تحتنا فى دارفور راى الزعيمة الملهمة اية<br />بتلمع فى مين وعلشان اية<br />خربانة خربانة<br />خربانة"
