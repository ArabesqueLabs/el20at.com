[[comments]]
order = 1
subject = "كتيبة الدفاع عن أم الهطل"
author = "صحفى متغاظ من أم الهطل دول"
posted = "2007-07-06"
text = "أهلا وسهلا بالأستاذ مرسى عضوا جديدا فى هيئة الدفاع عن النظام ، رغم أنه لم يكن بعيدًا عن تلك المجموعة إلا أنه لابد أن يقوم بواجب كبير شكرا للحكومة على اختياره لرئاسة مجلس إدارة الأهرام<br />صاحبنا مرسى واحد من أفشل صحفيي مصر الذين لا يجيدون إلا تظبيط الهبل الذى تقوم به الحكومة بتاعتنا ، بالإضافة إلى محاولة تبرير كل ما يتم فى أم الدنيا كلها \" دى غير أم الدنيا اللى بيطلقوها على بلدنا المنكوبة \" ، ولكن إيش تعمل الماشطة فى الوش العكر ،؟<br />وبعدين للأسف الحكومة مش عارفة تنقى صحفيين شاطرين يكتبوا عنها ويجملوا صورتها<br />هتجيبهم منين يا حسرة ؟ هو فيه صحفى محترم يقبل إنه يبقى كل شغلته إعادة كتابة التقارير التى أعدت مسبقا فى أماكن كلكم عارفينها كويس ؟يعنى بدال ما هى مكتوبة على ورق مكتوب عليه من فوق وزارة الداخلية بيروحوا كاتبين التقارير دى فى ورق تانى مكتوب عليه صحيفة الأهرام أو الأخبار أو الجمهورية أو روزاليوسف وبياخدوه لا مؤاخذة \" كوبى بيست \"<br />أكيد مفيش صحفى جدع وراجل هيوافق على كده إلا الكتع والمكسحين من الصحفيين من أمثال عبد الله كمال ومجدى الدقاق ومحمد على إبراهيم وخالد إمام \" بتاع المساء\" وأسامة سرايا \" بتاع الأهرام .. فاكرين الأهرام يا جماعة \"، بالإضافة إلى مرسى عطاالله ومكرم محمد أحمد وطارق حسن وحمدى رزق و عمرو عبد السميع وممتاز القط<br />نصيحتى للحكومة \" حلوة نصيحتى للحكومة دى \" إنها تحاول تعمل إعلان عن توريد صحفيين شاطرين لتجميل وشها العكر ، بس للأسف مش هيقدم غير هما نفس المجموعة العبيطة لأن مفيش صحفى محترم يقبل الدفاع عن الهطل ده"
archived = "2010-03-14"
