subject = "مين هناك"
author = "مصر"
posted = "2007-07-05"
text = "مصر مين يا زعبلة<br />مصر راحت فى الكازوزة وسعرها ب3 مليم<br />والبركة فى عبدة خرابة اللى خلاها منطة للحرامية<br />واحنا لنا هم ولا غم الا ابو عباس وابو مازن وابو جلمبو وابو النسانيس وكل شوية بينطوا فى شرم الشيخ ياكلوا الرومى ويروحوا<br />مصر كانت زمان<br />وكان وكان<br />وخلينا وراء ابو عباس وسلامات يا عبس نورت الشرم"
