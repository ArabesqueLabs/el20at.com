posted = "2009-03-13"
text = "(((( انت يا حمار )))<br />أنت يا حمار يلي جايفٍ حالك<br />على شنو انت مغتر، بجمالك!!<br />نسيت نفسك يوم كنت اتذل حالك<br />واتروح اتمصلح عشان قرب مالك<br />ابعد يالله عني وفكني من غربالك<br />ترى انا غنيٍ عنك وعن كل اعمالك<br />والقهر جايلي وجايب معك دلالك<br />والله ان عدتها لكسر على راسك فناجيلك<br />ابعد لا اتشمت فيك عند عذالك<br />واخليك ما تسوى شيء عند أعيالك<br />يا ما نصحتك وقلت اترك عنك اهمالك<br />وإرجع إلى ربك وحافظ على صلاتك<br />وانت مو مهتم وغارك في ملذاتك<br />لين ماعاقبك ربي وشربكك في حبالك"
