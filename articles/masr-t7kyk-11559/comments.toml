text = "الموضوع ده حلو اوى ولمس معايا جدا فى زكرياتى بالمدرس لان كان عندى مدرس لغة عربية واول مرة احس يعنى ايه حد يتقن عمله كان من خلاله وعلمنى يعنى ايه مبادئ بجد وعلى الرغم انه درسلى سنة واحدة فى حياتى الا انه اثر فيا جدا لدرجة انه شجعنى اكتب رواية بس طبعا كانت فاشلة جدا :d<br />بس بجد الموضوع ده مهم اوى وياريت كل المدرسين اما يشتغلوا تحت مفهوم رسالة علشان ياثروا بايجابية فينا ومايكروهناش فى عيشتنا او يبطلوها احسن<br />وشكرا"
