subject = "ضع عنوان التعليق"
author = "هبه عاشور"
posted = "2009-03-12"
text = "موضوع جميل جدا<br />أكتر واحد أثّر في هو أستاذ محمد صبرى .. مدرس التاريخ في إعدادي وثانوي<br />هو وشخص ذو مبادئ<br />حصته دايما كانت حلقة نقاشية ثقافية<br />دايما كان يربط التاريخ بالواقع ويدفعني للتفكير في كل حدث ماضي أو حاضر .. كنت أعشق النقاش معه<br />وهو إنسان نشيط جدا وكانت تقريبا المسئول الرئيسي عن الأنشطة في المدرسة وأنا كنت المساعدة الأولي له<br />دائما يشجعني وحتى الآن على اتصال قوي به<br />هو ابي الثاني ... أقول دائما أن أبي رمى البذرة في عقلي وأستاذ محمد سقاها"
