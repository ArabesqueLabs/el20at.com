subject = "غريب؟؟؟"
author = "الاء السوطري"
posted = "2008-08-10"
text = "كم هو غريب ان ينتهي اليوم ولا ارى اي تعليق على وفاة الشاعر الاروع من شعراء الارض المحتلة؟؟؟...<br />اريد ان احيي الأنسة رنا الخموس لأنها ابهرتني ببداية مقالتها ... واضيف ...<br />انت زين الشباب ..<br />وفارس الفرسان..<br />ومحطم الاوثان...<br />حدود الشام زرعتها..<br />قصائد تطلق العقبان..<br />وأتمنى من عشرينات كما لم تنسى نزار قباني ان لا تنسى الشاعر الاكثر من رائع محمود درويش... وتنشر بعض من قصائدة ك: عاشق من فلسطين ..وعاد في كفن... وفكر بغيرك.. شكرا"
archived = "2010-03-14"
