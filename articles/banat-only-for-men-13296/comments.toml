author = "أُختك في الله .  ."
posted = "2009-12-06"
text = "السلام عليكم . .<br />اللهم استر بنات المسلمين فوق الأرض و تحت الأرض و يوم العرض عليك . .<br />عدم التمسك بالدين و العمل بما أمرنا الله و رسوله به سيؤدي إلى كثير من المصائب .. اللهك اهدي شباب المسلمين إلى الدين<br />ولحرصي على أُختي المسلمة أقول لكِ إلتزمي بالزي الشرعي فيكون جلبابك فضفــاض ( لا تكوني كاسية عارية ) - ساتــر لجميع البـدن - لا يصف و لا يشف - غير معطر ولا يكون زينـة في نفسـه فتتحملي وزرك و وز كل شاب سقطت عينه عليكِ , و إياكِ و النمــص و نتف شعر الحاجبين فهذا الفعل يوجب اللعن لصاحبته ( قال النبي صلى الله عليه و سلم .. لعن الله النامصة و المُتنمصة ) و النمص من الزينة المُحرمة<br />و تقي الله أختاه .. فمن يتقي الله يجعل له مخرجًـــــا و يرزقه من حيث لا يحتسب .."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 40
subject = ""
author = "أُختك في الله .  ."
posted = "2009-12-06"
text = "و احرصي على الخروج من بيتك( للضرورة فقط )- فالأصلُ مكُوث المرأة في بيتها فجاء الأمر في القرآن الكريم للمرأة بالإقــرار في بيتهــا.. قال الله تعالى (( وَقَرْنَ فِي بُيُوتِكُنَّ وَلا تَبَرَّجْنَ تَبَرُّجَ الْجَاهِلِيَّةِ الْأُولَى )) , و أقــرب ما تكوني من ربك و أنتِ في بيتك<br />و قالالنبي صلى الله عليه و سلم (( المـرأة عـورة فإذا خرجت استشرفها الشيطان )) - أي ان الشيطان يُزينك في عيون الرجال و يزين الرجال في عينك<br />لا مانع من الخروج إلا لحاجة .. و اذا خرجتِ فالتزمي بما أمرك به الله و رسوله صلى الله عليه و سلم<br />و لا تستعطري عند خروجك من المنزل(لا تضعي طيب أو عطر) لأن النبي صلى الله عليه و سلم قال (( أيمــا إمــرأة استعطــرت فمــرت على القتوم ليجــدوا ريحهــا فهــي \" زانيــــــة \" ))<br />فالعطــر يثيــر شهــوات الرجــال و يجذبهـم إليكِ - فاحذري أُختي المسلمة و سلمكِ الله ."
