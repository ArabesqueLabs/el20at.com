text = "والله يااخ انت حيرتنا معاك وكلامك كله متناقض وعمال تقول ليا صديقات والعريانين في الغرب كتير ولما هوة كده يافندم واجع دماغنا ليه من الصبح وعمال تشتم علي بلدنا وتقول انهم عرايا وكليباتنا عاهرة وملأت ارجاء اروربا واظن انك في بلد غربي زي فرنسا فيها اللي العن من كده وانت تكلمت عن محجبات يفعلون الفاحشه ويتصورون وهم لايعلمون ده كلامك بالنص ان كنت شوفت ده فعلا زي مابتقول وربنا يشهد علي كلامك فده لايعم عن كل بنات مصر والله انزل مصر ياحضرت وشوفها وبعد كده ابقي احكم علي بناتها مش كليب شوفته تقول اهم كل بنات مصر كده وتيجي في الاخر تداري علي كلامك وتقول لا انا مقصدش كده انا لا اكره مصر وانا ليا صديقات مصريات<br />وفي الاخر جاي تقول انا ليا صديقه وبحبها ومش ناوي اتجوزها ياشيخ اتقي الله ايه التناقض الغريب ده عمال تتكلم عن الاحتشام والاحترام وفي الاخر جاي تقول ليا صديقه ومش صديقه<br />والله انا قولت اللي عندي وان كان علي اسلوبي في الكلام انت اللي وصلتنا لكده وواضح اوي كل البنات دخلت واضايقت من كلامك وانا بحترم كلام اي حد لكن يوصل انو يتكلم علي بلدي وعلي سمعه بلدي ساعتها مايزعلش من الكلام اللي هيتوجهله."
