[[comments]]
order = 123
subject = ""
author = "جسام"
posted = "2010-01-04"
text = "لا اعرف لماذا هذا الهجوم علينا مع انى لم اغلط فى واحدة منكم فقط قلت رايى وهذا الراى لم اقصد واحدة معينة به بل قصدت من هم يتعرون او يلبسون كما يريدون تحدثت عن رايى انه اذا تعرت البنت العربية فانها فقدت الشرعية الاهلية لتكون بنت مسلمة محتشمة لايتحرش بيها احد والادعو ان تكونوا محتشمين ولا محجبات الكل عنده حرية فى تصرفاته اقول للفتاة التى تقول لجيمس انت لاتقدر ان تفعل ذلك فى الغرب فعلا لايقدر لان الغرب ليس بمحروم من الجنس ولا من الفتيات فهنا الجنس اكثر من الاكل هنا كل انسان يفعل مايريد ولا يحاسبه احد هنا كل انسان يفعل حتى الخطا لايوجد اخلاق ولا مثل اعلى ولااى شئ يحاسبه عليه احد يامن اتهمتونى بالزانى والفاجر ان كنتم محجبات او كنتم لاتتعروا وتستروا انفسكم لماذا الغضب من كلامى يامن تقولوا انك محترمون لماذا غضبتم من كلامى ثم انى لم اجد فيكم عموما غير جيمس هو الذى فهم مقصد كلامى وفهم ماريد لكنكم انتم تسرعتم بالشتائم ومن تشتم جسام اكثر فسنحبها اكثر اشتموا وهزقوا وافرحوا ولا تنسوا انكم بكلامكم الذى ارا فيه التخلف تضعفون موقفكم ولابد ان تحسنوا من انفسكم لتعرفوا تخاطبوا حتى لو تخاطبوا اعدائكم"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 124
subject = ""
author = "بسنت"
posted = "2010-01-04"
text = "واحنا فعلا اللى مشوهين صوره مصر بتصرافتنا وافعالنا فعلا انت معاك حق<br />واقولك كمان احنا اللى بنسقط البنطلون وبنبن البوكسر واحنا اللى بنفتح زارير القميص عشان نبين شعر صدرنا واقولك كمان احنا اللى بقينا نوقف شعرنا زى عرف الديك عشان بنات الغرب بيعملو كده واحنا كمان اللى بنتحرش بيكو وبنغتصبكو يعنى هنعمل ايه قدام الاغراءت دى بوكسر معفن باين وجل ف الشعر وفاتحه القميص لازم طبعا نضعف قدامكو معزورين بقى<br />اقولك كمان احنا خلاص مافيش فينا بنت واحده محترمه ولاحتى مراتك ولاامك ولا اختك ولا بنتك كلنا بيقينا مش فيرجين وبنمارس الفاحشه ع الملاء ف الشارع وبقى عندناشذوذجنسى واقولك بقى نصيحه انت لومش متجوز تسافر لحسام فرنسا يشوفلك عروسه مؤدبه متربيه وبنت بنود ومتدينه تعرف ربنا بس بشرط ميكونش كان ليها بووى فريند قبلك وبعدين المواصفات دى سهله اوووى هتلاقى بسرعه ف فرنسا ده المحترمات هناك ع اقفى من يشيل واحنا ع فكره مش عايزين واحد يشكر فينا عشان مش محتاجنها منكو بس لما تيجى تتكلم اتكلم بالعقل والعدل"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 125
subject = ""
author = "بسنت"
posted = "2010-01-04"
text = "يصراحه يابنات الحق يتقال ان الاستاذ جيمس مثقف جدااااااا وثقافته ايه من النوع العالى اوووووووووى والدليل انا قال<br />((واحده ف الشارع راكبه اتوبيس وعريانه او ماشيه تهز))<br />ده ايه الثقافه دى عشان كده انتو بقيتو اصحاب عينه واحده ولازم تبعتو تشكرات لبعض طبعا وانا معاكو بردو بشكركم صحيح ماجمع الاماوفق<br />وانت يااستاذ جيمس ياللى جمعت ان كل البنات عريانين والراجل يعنى هيبوص فين ولا فين عندى سؤال لحضرتك هى اختك وامك بينزلو عريانين ولا بيمشوا يهزو؟؟؟<br />لان من الواضح ان دى العينه الوحيده اللى انت بتشوفها العريانين واللى بيهزو انت فعلا لو محترم ومثقف زى ما العروسه شهدتلك بانك انسان مثقف وبيتمنى تتقبل صداقته<br />لايمكن كنت تقول لفظ زى ده ابدااا"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

