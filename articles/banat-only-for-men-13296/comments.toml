text = "أهو الاخ جسام اللي بيدعي التدين ونازل شتيمة !!!<br />انت لو كنت حقيقي متدين وتعرف ربنا كنت عالأقل وجهت دعوتك بطريقة محترمة .. لكن اسمحلي انت فعلا ابعد ما تكون عن الدين .. الدين اللي انت عامل نفسك عارفه لم يأمرك بالتحرش لفتاة مهما كان ما ترتديه !!!<br />واذا كنت تتهم البنات بانهم بيتنافسوا في تقليد الغرب فأحب أقولك انك الظاهر مابتشوفش غير قنوات معينة لتشبع نفسك من داخلك بان الفتيات هم المسؤلات عن ذلك ..<br />انزل الشارع دة لو كنت فعلا عايز تشوف المشكلة على حق وانت هاتشوف ما يفعله الشباب في الشارع و أمام الناظرين ..<br />لما تكون بنت وماشي في حالك وتلاقي واحد بيعمل الفاحشة أو بيفتحلك سوستة بنطلونة دة تسميه ايه؟!!<br />لما تبقى ماشي في الشارع و تلاقي كل 200 متر قهوة قاعد عليها نص ان لم يكن معظم شباب المنطقة ماعندهومش حاجة يعملوها الا شرب الحشيش و مشاهدة أفلام الاباحية دة تسمية ايه؟!! ولا البنات يمكن بردو هما المسؤؤلين في دة كمان !!!!!<br />دة غير كمان ان الدين يا حضرة المتدين ماقلكش احكم على الناس أو البنات بلبسهم .. ياما لبسي محترم (أولاد أو بنات) و يدعوا الاحترام والدعوة الى الدين وهما أبعد مايكونوا عن الدين"
