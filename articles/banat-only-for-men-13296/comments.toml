[[comments]]
order = 133
subject = ""
author = "بسنت"
posted = "2010-01-06"
text = "ممكن اسالك شويه اساله ومعلش احترم رائ<br />اولا انت قلقان اووى كده ليه خايف عليها ولا عليك؟؟<br />لوخايف عليه وبتحبها ليه عملت كده من الاول معاها حرام عليك دى بنت ولو انتو متعودين ع كده وانا مقصدتش الاهانه بجد بس لازم تبطلو الموضوع ده عشان كده حرام.<br />لكن لو هى كويسه وانت بقى بتتسلى بيها يبقى اتقى الله ف افعلك وكما تدين تدان<br />لكن لوانتو بتحبوا بعض وحصل الى حصل يبقى لازم تتقدملها وتخطبها وتم الجواز ع اسرع وقت<br />وياريت ميكنش حصل حمل لقدر الله.<br />لكنى مانصحش بالغشاء الصينى انا معنديش تجربه ف الموضوع ده؟<br />بس تعمله ليه واذا انت ناولى فعلا انك تتجوزها وضامن ان الموضوع يتم<br />لكن لو ناوى تخلع يبقى بجد حرام عليك<br />وكده احنا بنحرض ان البنات يقعو ف الغلط ويعملو عمليه ويحطو غشاء صينى ده اسمه غش وخداع وانت ميرضكش انك تتجوز واحده عملت كده قبلك وخدعتك بالغشاء الصينى<br />انا شايفه ان انسب حل انك تتقدملها ولو الموضوع باظ واتعقد يبقى تسيبها لربنا ومتيأس ابدا ومتتخلاش عنها"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 134
subject = ""
author = "هانى"
posted = "2010-01-06"
text = "أنا شاب 25 سنة<br />أنا للأسف وأنا بمارس الجنس مع صحبتي معملتش حسابي ووقع المحظور حد يعرف ياجماعة حكاية غشاء البكارة الصيني ده وإلي كل الناس بتتكلم عليه وماحدش جاب حاجة أكيدة عنه أتمنى فعلا ماتخذولونيش في أول مشاركة ليا<br />وياريت لو مش ينفع ده طيب عايز رأي حد ذو تجربة بحاجة شبه كدة بس أرجوا رد جدي ونفسي كمان الي يرد عليا يكون عارف بش بس بيجامل لأنها بصراحة حوسة ووكسة ماأدعيش أي حد فيكو يقع فيها؟<br />إلي حاسس إنه ممكن فعلا يساعدني في الموضوع ده أنا هستنى بس أحس بجديته وهنتواصل على طول بأي طريقة أأمن من المنتدى ممكن مثلا ماسنجر."
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 135
subject = ""
author = "هانى"
posted = "2010-01-07"
text = "يابسنت انا مش خايف عليها انا خايف على نفسى للبسها وانا ماليش فى الدور ده ومن الاخر انا اتجوزها ليه دى صديقة والا تفتح رجليها لواحد تفتحها لاى حد وانا ايه عرفنى انها مابتنمش مع حد تانى انا عاوز اطلسقها خليها تعدى ومش بضحك عليها لانها عارفة انى مش هتجوزها وياجيمس كلامك صح بس انتا فاهم الشهوة ياصاحبى ولما يكون قدامك مزة طحن نفس اى حد يلسمها وانتا توصل لللل هعمل ايه وصلت المهم انا معجب بيك انتا وجسام وياريت نكون اصدقاء"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 136
subject = ""
author = "جيمس"
posted = "2010-01-07"
text = "ياعم هانى عيب عليك وحرام عليك وعليها انتا طبعا غلطان وهى اكتر منك وانا بصراحة ياجماعة بوجه كلامى للبنات اكتر من الاولاد فى حاجة زى كدا عيب عيب عيب ان بنت تصاحب ولد صداقة مش بريئة وعيب ان البنت تبقا رخيصة كدا حرام والله ان بناتنا يبقوا رخاص كدا طيب الولد بيعمل لافى غشاء بكارة ولا مجتمع بيحاسبه ولا بيلومه لكن انتى يابنت بتلاقى الف سكينة عاوزة تدبحك وعاوزة تتخلص منك واولها الشاب الا عمل معاكى كدا ياريت ياجماعة تفهموا كلامى انا وجسام فعلا جسام قالى على الموقع المصرى والله العظيم ياجماعة حاجة مالهاش وصف بنات كليات وستات متجوزة ستات كبيرة ومنقبات ومحجبات بالالافات والله حاجة فظيعة ياريت تفهموا انننا مش بيهاجمكم والله هو بيقول انا بكشف عيب بس وراى وكل انسان حر فى نفسه"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
