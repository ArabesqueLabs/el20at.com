text = "موضوع المعاكسات ده بقي عادي جدا ومنتشر يعني تبقي راكبة في اي مواصلة لازم تتوقعي المعاكسة حتي من السواق ده عادي دلوقتي العيب مش في البنات ولا في الحجاب ولا اي حاجة من الحاجات ديه خالص زمان امهاتنا كانوا بيلبسوا ميني جيب ومحدش كان بيقولهم حاجة خالص ولو كانوا بيتعاكسوا كانت بتبقي حاجات ظريفة مجرد ان الولد يبدي اعجابه بجمال البنت لكن مش بالشكل الفج زي اللي بيحصل دلوقتي . أنا عايزة اقول اللي اتغير هو الأخلاق الأخلاق اختفت من كل حاجة راحت جدعنة وشهامة ولاد البلد يعني دلوقتي الراجل الكبير يشوف بنت قد بناته بتتعاكس ويعمل كأنه مش شايف ويقول ماليش دعوة قيسوا علي كده في كل المجالات .اخيرا بقي نفسي واحد من اللي بيعاكسوا يقولي نظرية سيادته في المعاكسة ؟؟؟؟؟"
