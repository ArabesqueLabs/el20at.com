text = "تسمحوا لى ان قانون التحرش ده لا هيحل ولا هيربط يا ترى هيعينوا على كنت بنت عسكرى ده تلاقى العسكرى نفسه هيعاكسها والله لو احنا بصينا فى الدين هنستريح بدل ما احنا عمالين نلف وندور مافيش تربية الواد عنده 8 سنين وبيعاكس البنات وبيعمل حاجات مش كويسة طب ده هتعملوا فيه ايه مش ديه قلة ادب اما يكبر الولد ده هيعمل اكيد هيعمل اكتر واكتر مافيش دين يا احبائى مافيش اخلاق ما فيش شغل مافيش استقرار اجتماعى يعنى من الاخر الدنيا بايظة ومش هيحلها القانون الغريب ده ومش هيرضع حد طب فرضا حد تحرش ومافيش شاهد اعمل ايه اجيب القطة اللى كانت ماشية اقولها اشهدى ولا اقوله تعالى عشان اوديك القسم هيقولى حاضر من عنيا فين العقل يا ناس الموضوع ده تطور لحاجات احنا مكنوناش بنهتم بيها واه ومنها بردو الافلام \"التى تناقش القضايا الحساسة \" احاسيس كلمنى شكرا بالالوان الطبيعية حاجة مسخرة البيت عليه عامل كبير فى التربية وزى ما قلت الطفل دلوقتى بقى يعمل زى اللى عنده حاجة وعشرين يعنىالموضوع انتشر زى انفولنزا الخنازير من الكبير للصغير ودتم سالمين"
