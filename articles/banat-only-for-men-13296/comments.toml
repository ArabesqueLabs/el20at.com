text = "الله يحرقك انت وجيمس في يوم واحد<br />عمال تقولي احترموا رأيي رأي ايه ياابو رأي انت اللي نحترمو جاي تقول علينا مش محترمين وتفكيرنا هابط لا سيبنالك انت التفكير المحترم انت والموزة اللي انت ماشي معاها ياريت يااستاذ انت متتكلمش عن الاخلاق والفضيله طلاما انت طلعت من الي بيمشو مع موزز وفرحان ياخويا دانت هتتحاسب يوم الدين علي افعالك دي جاي تحاسبنا علي لبسنا وتصرفاتنا ياشيخ روح حاسب نفسك واتقي الله قبل ماتموت انت والجيل الفريند اللي هتخش بيها جهنم ان اشاء الله وابقي خلي الجيل فريند تنفعك<br />والاخ اللي اسمو جيمس والله ماجديد عليك الكلام الوسغ بتاعك ده انت ليك تعليق في كذا توبيك سافل ومش محترم ده يدل علي انك شخصيه تيييييييت وعيل من العيال السيس اللي ربنا ابتلانا بيهم وبعدين مدخل نفسك ليه يابابا وسط البنات ياعيني شكلك محروم فعلا زي ماقالت بسنت والله صعبت عليا روح يابابا ذاكرلك كلمتين ينفعوك ده الي هينفعك مش انك تمسك موزة ومن حقك تتحرش بيها ايه الكلام السافل ده ياتييييييييت<br />وبالنسبه للبنات ياجماعه دول مرضي نفسيين ماتتتعبوش نفسكو معاهم دول اخرتهم ع العباسيه عدل وابقي سلملي انت وهوة ع الجيل فريند :D :D"
