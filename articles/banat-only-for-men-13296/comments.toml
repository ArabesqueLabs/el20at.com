text = "ههههههههههههههههههههههههههه ههههههههههههههههههه شكرا لكم جميعا لكنى احب ان اقول لكم ايها الملائكة لم اتكلم عن القران ولم اتكلم عن الفضيلة ولم ادعى انى متدين ويجب عليكم ان تفهوا كلامى ولا تفهموا على اهوائكم حريتى ان اصادق واقوم بعلاقة حرية شخصية ولم انتقد واحدة فيكم بانها عاهرة مثلا تكلمتم عن التحرش فقلت رايى بكل بساطة مايزعجكم انتم فى ذلك انكم تشعرون انكم على رؤسكم شئ لماذا لاتدعون انفسكم تتكلموا بصراحة وان تنسوا كبريائكم لماذا تكذبون كثير وتجملون انفسكم لماذا تنكرون انكم مخطئون لانكم لاتعرفون ماهو هدفكم فالغرب يعرف ماهو هدفه شذوذ جنس حرية فى العلاقات وهذه حريتهم وانتم لاتعرفون ماهى طباعكم هل انتم مع الغرب ام مع المسلمين تصلون ولكن تلبسون القصير والضيق تصيمون وتشاهدو كليبات العرى لاتعرفوا ان تحددوا لكم هدف ان تختاروا الغرب او تختاروا المسلمين لاافرض عليكم ان تختاروا ان تكونوا غرب ولا تن تكونوا مسلمين لكن يجب ان تعلموا ان كنتم تريدوا الغرب فافعلوا كما يفعلون وان كنتم تريدوا المسلمين فافعلوا كما يفعلون ولا تاخذو من هنا ماتحبون من هنا ماتحبون لاتتعروا ثم تقولوا نحن مظلومات"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

