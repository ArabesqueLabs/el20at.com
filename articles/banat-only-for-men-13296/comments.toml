author = "أحمد"
posted = "2010-01-12"
text = "انا باشوف التحرش يوميا في الشارع وفي المواصلات – وانا اقصد التحرش باللمس – واللي بيضايقني ان البنت ساكته والناس شايفه المنظر عادي جدا وكمان الاقي اللي بيعمل كده بيعملها تاني وتالت لدرجة اني حاولت ادافع عن واحده فيهم وللاسف كانت محجبة انكرت انه عمل فيها حاجة وقالت لي انت مالك والمرة التانية لما مسكت واحد عمل كده طلع عليا مطوة بس ربنا ستر.<br />التحرش موجود وحايزيد طالما محدش مهتم بالشباب ولابمشاكلهم."
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 140
subject = ""
author = "مش مهم الاسم"
posted = "2010-01-19"
text = "انا بس كان عندى شويه تعليقات<br />انا الحمد لله متعرضش للمواقف دى لأن أخويا مبيرضاش أركب موصلات بسبب المهازل اللى بتحصل<br />ولو عايزاه أروح حته يا أما بيوصلنى أو حد من أخواتى<br />أو أكون رايحه حته بس قبل المغرب :-)<br />بالنسبه للتعليقات<br />1 الاخ اللى اسمه جاسم واللى اسمه جيمس كان ممكن تقولو وجه نظركوا بطريقه أحسن شويه<br />من غير الالفاظ اللى ملهاش لازمه وياريت مكونتوش تعممو<br />لأن فى بنات محترمات وكمان شباب محترمين<br />2 بالنسبه للبنات كل واحده فيكوا قالت وجهه نظرها<br />وكان فى بعض التعليقات لا تخلو من الشتايم<br />مش حسين يا بنات انكو كده بتغيرو سمعت مصر<br />وبتسبتوا للشباب ان كلامهم صح(مع ان كلامهم مش صح)<br />يعنى كان ممكن تعلقو بس بطريقه ألطف شويه حتى لو كلامهم مستفز :o<br />3 بالنسبه للأخ هانى<br />انا فى الواقع مصدومه من اللى حضرتك كتبتوا يا أخى اذا بليتم فاستتروا :-| انا رايي ان حضرتك تسأل اى دكتور وتشوف أضرار الموضوع ده<br />4 بالنسبه للأخ جسام نصيحه ليك متنشر أسم الموقع اللى انت شوفت عليه الصور اللى بتقول عليها<br />لأن ده كله هيكون فى الميزان يوم القيامه<br />أنا حاسه أن كلكو هتقومو عليا<br />شباب و بنات<br />بس كان لازم أوضح رأيي"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

