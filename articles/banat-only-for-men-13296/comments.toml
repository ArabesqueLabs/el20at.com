posted = "2010-01-05"
text = "[quote name=\"جيمس\"]بقول لبسنت انك انسانة اصلا عديمة التربية ليس الا وانكم مابتعرفوش فعلا غير انكم تشتمو وبس وبجد والله انك متخلفة لانك بتدخلى اهلى فى حاجة زى كدا وتشتمينى بالباطل جاتك ستين نيلة انتى انسانة مقملة ومعفنة ومعلهشى يعنى زبالة لانكم من الاساس شكلكم زى جسام مابيقول ما بتفهموش لانه اتكلم عن راى فانتم زى يتكلم كده سبتوه وشتمتوه وشتمتوا اهلى والله انتم الا متناقضين مش هو[/quote]<br />عجبتنى انتى مقمله ومعفنه اوووى بصراحه بس انت لوقريت كلامى تانى هتفهم انى مشتمش اهلك وكنت بتريق على اسلوب كلامك ان مافيش حد دلوقت محترم والبنات كلها عاريات كاسيات ولو واحد ودى وشى النحيه التانيه هيلاقى مليون بنت عريانه ولا بسه ضيق وجسمها كلها باين<br />ولما قولتلك اننا كلنا بنات مش محترمات حتى مامتك واختك طبعا واضح اووى انى بسخر من كلامك ولا قصدت اشتم امك او اختك للعفو انا حبيت اقولك ان ف بنات محترمه واديك مثال منهم ع اختك وامك اللى انت فهمته بطريقه تانيه انى بشتم اهلك طبعا لا اقرا تانى وفكر فاسلوب كلامى<br />وانا متربيه كويس جدااا"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

