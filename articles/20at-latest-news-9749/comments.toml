[[comments]]
order = 2
subject = "لماذا"
author = "عاشق الحيوان"
posted = "2008-08-27"
text = "اذا كانت الفتوى تقتضي بعدم اقتناء الحيوان في اي دين توجد هذه الفتوى لاني لا اعتقد ان الرسول صلى الله عليه وسلم نهى عن ذلك بل وقد امرنا بان نحسن اليها وانتم تمنعونها في الوقت الذي احترق فيه دار رعاية للحيوان في نيويورك وقد تبرع الكثير من الناس حتى وصل المبلغ 75الف دولار<br />انا لا ارضى بوجودها في الشارع لمراعاة الاخرين لكن بمنع بيعها ارجو اعادة النظر في ذلك لانه ليس نحن المسلمين من نقول ذلك ثانيا اذا اردتم يجب عليكم البحث عن الرفق بالحيوان الذي من الممكن انه اصبح مفقودا هنا للاسف ان هذا الكلام من الارض التي فج منها نور الاسلام يعني اليهود والنصارى افضل منا اترضون ذلك للاسف"
archived = "2010-03-14"
