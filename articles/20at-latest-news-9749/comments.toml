[[comments]]
order = 4
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-08-31"
text = "وبيع الكلاب والقطط حرموه ومايدرون ان فيه وحده دخلت الجنه عشان قطه و واحد خش الجنه عشان كلب طيب ليش يمنياناس ياعالم والله هذا الي تسويه الهيئه موصحيح مابقى شي مامنعوه الاسواق عوائل طيب حنا يالشباب وين نروح<br />عون بيع وشراء الكلاب يمنعون التجوال فيهم مو يمنعون البيع والشراء والله ان هذي مهزله ومتى بتتطور هالهيئه ولمتى العالم يسبقونا بكل شي وحنا اخر ناس والله العالم يضحكون علينا وصاروا يفهمون الدين الي نزل في بلادنا اكثر مننا والله مهزله الي يصير هنا ولو تستمر هالمهزله وربي بيخلون دخول البقالات والمستشفيات وكل شي عوائل انا مأقول الا الله يهديهم وان تقريبا 70% من قرارات الهيئه غلط والله يهديهم ويرجعون بعقولهم وحنا نكون بخير"
archived = "2010-03-14"
capture_url = ""

