subject = "الله يهدي الجميع"
author = "mohammed"
posted = "2008-08-31"
text = "الله يهدي هالهيئه الي ممشينا على كيفهم والله هذا اسمه تخلف ومتى بنتطور حنا<br />والله العالم يضكون علينا والله ياناس ان العيب مو فينا في اصحاب العقول المتخلفه الي هم الهيئه والله يهديهم ويصبرنا على قراراتهم الي ماتخش العقل"
