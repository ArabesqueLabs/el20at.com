text = "وربي حرآم عليهم أنا ابغى اجيب الكلب حقي و منعوني بمطار الرياض اني آخذه معاي و رحلوه عالمغرب و ماني عارفه ايش اسوي مو قادره اشتري غيره ولاني قادره اجيبه<br />تكفون يا جماعة الخير اي احد يعرف محل بالخبر او الدمام يخبرني تكفون<br />والهيئة حقكم يآكلون جزم لآيعرفون لآدين ولآشي بس يخربطون"
