subject = "رجال الحسبة وأناصر الدين"
author = "الذئب الأمعط"
posted = "2008-08-04"
text = "كنتم خير أمة أخرجت للناس تأمرون بالمعروف وتنهون عن المنكر...<br />هذا مايغيض أعداء الدين من الكفرة والعلمانيين اللذين يريدون التشبه بالكافرين حتى لو دخلوا جحر ضب لدخلوه<br />جزاكم الله خيراً يا أهل الحسبة على تطبيق شرع الله الحنيف بدء الإسلام غريباً وسيعودُ غريباً كما بدء فطوبى للغرباء اللذين يُصلحون اذا فسد الناس .<br />انهلك وفينا الصالحون نعم اذا كثر الخبث ."
