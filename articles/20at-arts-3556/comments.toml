text = "قدمت نماذج جيده وهناك الكثير غيرها ، اتفق معك تقريبا بكل ما قلت باستثناء مصطفى بكري فهو صوت جيد في مساحة الصمت قد لا نتفق معه في كل ما يقول ولكنه يحاول والكثير مما يقول صحيح."
archived = "2011-07-19"
capture_url = "https://web.archive.org/web/20110719202450/http://www.20at.com:80/20at/arts/3556.html"

