[[comments]]
order = 4
subject = "أكيد ... العدد أكتر من عشرة بكتييير"
author = "محمد مسعد"
posted = "2007-04-08"
text = "معرفش ليه بس بعتقد أن الأسماء المطروحة مختارة بمزاج خاص في السياسة والدين والأخلاق .. مع أن فيه ناس تانية ممكن تكون أكثر أثارة أعلامياً وأقل فائدة من الأسماء المطروحة .... رجال دين ... دعاة جدد ..... ممثلين ولاعبي كرة ورئيس الجمهورية والدستور وفتحي سرور و المعارضة والأخوان<br />العدد فعلاً أكبر بكتير وأن جمعنا في النهاية كل من لا قيمة لهم فأني أعتقد أننا لن نحتاج إلي الأعلام من جديد"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "لينا"
posted = "2007-04-09"
text = "على الأقل ما ذكر أعلاه قد يظهر مره في الاسبوع او مرتين بالكتير .. ولكن مارأيك بستار أكاديمي الذي يستمر كل موسم قرابة 4 اشهر ويبدأ الازعاج الفعلي واطلاق الشائعات ومتابعة النومنيز ..<br />أما الاخطر من كل هذا هو برنامج ديني للأفتاء يظهر في قناة الام بي سي يسأل فيه الناس الشيخ اسئلة لا اعرف من أين يأتون بها ... اجابتها عادة بديهيه... وكل حلقة تتكرر نفس الاسئله ولا يوجد اي قضيه جديده يتحدثون فيها<br />مازلنا نتصل بشيوخنا لنسئلهم عن الحيض والمحيض ... واذا كان الخروف من الدنمارك وبلاد الكفار فهل اكله حلال<br />واذا واذا واذا ... والامه كلها في ازمه كبرى ونحن محاطين بالعشرات من المزعجين اعلاميا..<br />بصراحه الموضوع جدا رائع .. وفقت في الطرح.."
archived = "2010-03-14"
capture_url = ""

