text = "أضف عليهم مذيعين نشرة الساعة تسعة اللي ما وراهمش السيد الرئيس و السيدة سوزان و اتحداك أن تجيبلي أي نشرة لأ تبدأ بالفقرة دي ( قام السيد الرئيس حسني مبارك …) مثلا باتصال تلفوني مع جورج بوش قام فيه بمناقشة أهم التطورات على الساحة العربية و الدولية ! شوفت ارخم من كده ."
