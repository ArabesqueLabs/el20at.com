subject = "الحالة واقفة قوى والناس تسير سكارى"
author = "مش برىء"
posted = "2008-09-02"
text = "خلاص لم يبقى غير الحب لنجعلة موضوعنا فى رمضان<br />هو الموضوع كتابة مقال يسد فراغ<br />كيلوا العدس الاصفر ب 13 جنية<br />انا نزلت السوق - الناس بتتفرج ومحدش بيشترى حاجة من عدم وجود فلوس<br />وفية حالة غم عند الناس<br />تقول لى الحب فى رمضان والعلاقة والمكياج<br />تركب تاكسى تلاقى الناس مشغلة قرأن كاننا فى حالة جنازة او مأتم<br />والكل ساكت<br />ساكت<br />ربما تمطر السماء احجارا"
archived = "2010-03-14"
