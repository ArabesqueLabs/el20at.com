[[comments]]
order = 1
subject = "حب ايه اللى انت جاى تقول عليه"
author = "مستر كيس"
posted = "2008-09-04"
text = "ياذوووق والله الحب اتلغى خلاص مش بسبب رمضان ده بسبب حاجات كتير لها علاقة بالحكومة والاسعار والبورصة والمونى الفلوس يعنى انغليش بقى ، الحب موجود بس الكصص و مسلسلات مامى ودادى اللى كلها فلل و عربيات اهل الخليج لان فى هذه المسلسلات سيدى الفاضل كل الظروف مهيأة للحب مفيش مشاكل الحياة اخر طعامة والرواية متظبطة تمام عشان الحب يعيش واحنا نموت من الغيظ فى الاخر ."
