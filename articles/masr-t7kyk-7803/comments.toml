[[comments]]
order = 2
subject = "عصر التوك توك"
author = "عبداللة"
posted = "2007-12-14"
text = "لازم يبقى فية كفاية<br />لاننا انحدرنا الى الهاوية<br />الم يوصلوا بلدنا الى عصر التوكتوك الهندى وهو من مظاهر الفقر<br />من اهم انجازات النظام هو ادخال التوكتوك وهو نظام فى الهند من 70 سنة وعلامة من علامات الفقر والضنك<br />وان شاء اللة الخطوة القادمة فى لجنة السياسات هى الريشكا<br />والريشكا هى عربية حنطور صغيرة يجرها انسان<br />ومن الممكن ان تنتشر خلال السنتين القادمة<br />انتظروا الريشكا<br />كفاية انحدار<br />يا عصر التوك توك"
archived = "2010-03-14"
