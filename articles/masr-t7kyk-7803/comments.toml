[[comments]]
order = 0
subject = "هية وهية واللة زمان يا سلاحى"
author = "ابو السعود"
posted = "2007-12-13"
text = "انت لية يا دعاء بتفكرينا بالزمن الجميل - لما كنا كلنا بنغنى يا حبيبتى يا مصر<br />لما عبد الحليم غنى وبلدنا على الترعة بتغسل شعرها<br />لما كنا كلنا عندنا تلاجة ايديال صناعة مصرية وتليفزيون تليمصر وفليبس مصرى<br />لما كان ابن الغفير بيدخل الجيش جنب ابن الوزير<br />لما كان مكتوب على اقسام الشرطة - الشرطة فى خدمة الشعب<br />لما كان الدكتور عزيز بيبنى كل يوم مصنع وكل خريج بيلاقى وظيفة وعروسة وشقة<br />انما يا دعاء<br />اتى الزمن الاغبر<br />وكل ما على ارض مصر معروض للبيع<br />والبيع ليس للشرفاء ولكن للحرامية<br />نحن فى عصر جحافل الامن المركزى ورمى الناس من البلكونات وقتلهم اغتيال فى حوادث طرق<br />كفاية<br />كفاية غلب وكفاية مهانة وتدمير للانسان المصرى<br />كفاية<br />كفايةا"
archived = "2010-03-14"
