subject = "كفاية وجع دماغ"
author = "Batistuta"
text = "ايه يا جماعة انت غاويين وجع دماغ طب انا مش اعلق على عمرو خالد التجاهل احسن<br />الناس داخلة على رمضان افتكروا حاجة عدلة"
