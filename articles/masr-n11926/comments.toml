subject = "اتكلموا عن الراقصات احسن علشان خاطر المعلقين يعرفوا يعلقوا"
text = "يا جماعة المعلقين بتوعكم عيال جهله ساعات ما بيفهموش حاجه من اللي مكتوب فعلى طول يشتموا ويسبوا<br />فاحسن حاجه تعملوا موضوع عن الراقصات علشان خاطر يعرفوا يعلقوا"
archived = "2007-09-21"
