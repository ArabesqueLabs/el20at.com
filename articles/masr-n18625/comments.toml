posted = "2008-11-30"
text = "اتجوزها واتجنوز ابوها كمان<br />هي مش واحدة ست وعندها اعضاء تناسلية زيها زي بنت الحسب والنسب<br />يبقى ايه المشكلة.. من الملجأ من كوكب تاني اتجوزها واتجوز اللي جابوها كمان<br />وححترمها وححافظ عليها زيها زي بنت رئيس الجمهورية<br />سلام يا ابو حنفي"
