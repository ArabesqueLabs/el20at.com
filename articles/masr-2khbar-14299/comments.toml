posted = "2009-12-08"
text = "فى الانتظار المحافظات التالية<br />محافظة شبرا البلد<br />محافظة مصر الجديدة<br />محافظة المحلة الكبرى<br />محافظة الرمل والمنتزة باسكندرية<br />خللوا الخير يعم ويطغى والناس تعيش مبحبحة<br />فية احد فاهم حاجة والا كلة فى الكالتش"
