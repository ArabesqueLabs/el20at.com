author = "كفر الغلابة"
posted = "2009-12-08"
text = "والنبى يا ريس - سايق عليك الحبيب النبى - بلدنا كفر الغلابة - نفسها تقب على الدنيا - ومستنية لفتة منك تحولها الى محافظة ويبقى لها محافظ لواء<br />هو كل اللواءات ما تزيد فى البلد نفصل لهم محافظات علشان يحكموها ويبقى فية سكرتير محافظ لواء ومدير مكتب المحافظ لواء ومحليات ومجلس محلى ولواء مدير امن ولواء مدير مباحث ومكاتب وسيارات وبدلات وسكرتارية وحوافز<br />هيصة يا دنيا هيصة<br />ومولد يا دنيا مولد"
archived = "2010-03-14"
capture_url = ""

