[[comments]]
order = 2
subject = "شكرا ونريد ان نذكر هنا  مجرمين ثورة 23 يوليو"
author = "مش مجرم"
posted = "2009-01-27"
text = "اي مشاكل في حياة المواطن المصري من غذاء وكساء وسكن وتوظيف وزواج سببها مجرمين ثورة 23 يوليو على طول الخط<br />انا عايز اعرف ولاد الوسخة دول عملوا ثورة على ايه بالضبط<br />ايام الملك فاروق كانت كل الناس عايشه ومبسوطه واهم حاجه كانت بتشتغل وبتتجوز<br />عمروا سمعتوا ان ايام الملك فاروق كان فيه واحد عايز يتجوز ومش لاقي ولا مفيش سكن ولا ولا ولا<br />منهم لله بقيادة جمال عبدالناصر وعضوية انور السادات وبقية الشلة الفاسده الشعب المصري مش حيسامحهم ابدا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "مجرمين ثورة 23 يوليو الذين حولوا حياة المواطن الى"
author = "مش ثورجي"
posted = "2009-01-27"
text = "أعضاء مجلس قيادة الثورة<br />اللواء محمد نجيب<br />البكباشي جمال عبد الناصر<br />أنور السادات<br />عبد الحكيم عامر<br />يوسف صديق<br />حسين الشافعي<br />صلاح سالم<br />جمال سالم<br />خالد محيي الدين<br />زكريا محيي الدين<br />كمال الدين حسين<br />عبد اللطيف البغدادي<br />عبد المنعم أمين<br />حسن إبراهيم<br />ـــــــــــــــــــــــــــــ<br />عبدالناصر كان اسمه بكباشي ها ها ها ها ها ها"
archived = "2010-03-14"
