subject = "المبدأ السابع للثورة القضاء على الزواج في مصر وتحو"
author = "مش مش"
posted = "2009-01-27"
text = "قامت الثورة على مبادئ ستة كانت هي عماد سياسة الثورة وهي:<br />القضاء على الاقطاع.<br />القضاء على الاستعمار.<br />القضاء على سيطرة رأس المال.<br />إقامة حياة ديمقراطية سليمة.<br />إقامة جيش وطني قوي.<br />إقامة عدالة إجتماعية.<br />ـــــــــــــــــــــــــــــ<br />المبدأ السابع للثورة<br />القضاء على الزواج في مصر وتحويل المواطن المصري الى انسان جائع مهان وذليل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "مجرمين ثورة 23 يوليو وإلغاء القضاء الشرعي في مصر:"
author = "مش رايح"
posted = "2009-01-27"
text = "- عندما قامت ثورة يوليو سنة 1952م كانت تهدف في المقام الأول لإقامة دولة على الطراز الجمهوري العلماني على النمط الغربي لذلك فكان من الضروري لقبولها على الساحة الدولية أن تقدم القرابين اللازمة لنيل رضا الدولة الصليبية بإعلان التأكيد على علمانية الدولة بنبذها التام للشريعة الإسلامية .<br />- أصدرت الثورة سنة 1952م قانوناً يقضي بإلغاء الوقف الأهلي تمهيداً لإلغاء محاكمة الخاصة ثم أصدرت في 4 صفر 1375هـ /21 – 9 – 1955م قراراً فشل في اتخاذه كل أعداء الإسلام الذين تقلبوا على حكم مصر من لدن نابليون حتى خلفاء محمد علي وآخرهم فاروق حيث أصدر قراراً بإلغاء المحاكم الشرعية الخاصة بالأحوال الشخصية تماماً وضمها للمحاكم العامة وألغيت كل القوانين المتعلقة بترتيبها واختصاصها وألحقت دعاوي الأحوال الشخصية والوقف والولاية إلى القضاء العادي وقد بررت ذلك القرار الجائر الظالم بحادثة افتعلتها عمداً ومفادها أن الشيخ سيف والشيخ الفيل وكلاهما من قضاة المحكمة الشرعية قد طلبا رشوة جنسية من أحد المطلقات وكلاهما برئ من تلك التهمة الظالمة الملفقة ولكن حكومة الثورة أرادت أن تشوه صورة القضاة الشرعيين ومن ثم الشريعة نفسها لتبرير جناياتها الشريرة بحق شرع الله عز وجل المطهر ."
archived = "2010-03-14"
capture_url = ""

