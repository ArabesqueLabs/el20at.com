subject = "شكر واجب للسيد محافظ الغربية"
author = "مش وطنى"
posted = "2009-01-26"
text = "انابيب البوتاجاز تطوف بها السيارات فى الشوارع وتدلل على من يشتريها وتباع ب 5 جنيهات من ثلاثة ايام مضت<br />شكرا محافظ الغربية<br />وكذلك دخلت مركز شرطة وكانت المعاملة اكثر من ممتازة ابتداءا من السيد نائب المأمور حتى اصغر عسكرى<br />حقيقى هناك تغير<br />وكما اننا نشتم المقصر واللى حالة مايل فى تعليقاتنا فواجب ان نقول الحق حينما نجد عملا طيبا<br />اخيرا انا مواطن عادى جدا ولا احد يعرفنى ولا اعرف احدا"
