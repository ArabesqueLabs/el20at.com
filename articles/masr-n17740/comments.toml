text = "الاستاذ هشام طلعت مصطفى حسب الجرائد الحكومية بيروح لة اكل مخصوص من فنادق الخمس نجوم وبيروح ياكل معاة نسوان تحل من على حبل المشنقة - لان اللى لة ضهر مبينضربش على بطنة<br />يبقى جت على الغلابة بتوع القناطر اللى بياكلوا فول وطعمية"
