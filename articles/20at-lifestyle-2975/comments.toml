text = "لقد كنت أقرأ للكاتب الغامدي ولا أوافق على بعض الأفكار ولكنني أقرأ من باب العقلية المنفتحة ولكن<br />العقلية المنفتحة التي التزمت بها لأنفتح على غيري وجدت ان غيري لا يقبل بها ..<br />انظر حولك من يسيمنا التهديد والنكال ويسرق مقدراتنا ويهددنا ويبسط سيطرته علينا يريد التدخل وسلب إرادتنا<br />والتمكين لإسرائيل ... وويل للمتكلمين ... عندها فقط انظر من يدافع عنه حتى في تبني أعياده الرسمية<br />عندها فقط ستعرف من هم العملاء .. ويكفي يا غامدي سواء دخلت باسمك أو اسم غيرك... لا تنس يوم \"اللجة\"ولست بناسيها ..."
