subject = "عن ابن عثيمين"
author = "Hyperboloid"
text = "ياشباب .... بغض النظر عن الموضوع : أنا لا أرى ان الاستدلال بأقوال شاعر السلطان ابن عثيمين (قدس سره) عن موضوع عيد ميلاد السيد المسيح فكرة جيدة ، فالفتوى كلها على ركاكة اسلوبها و ليها لمعاني الآيات القرآنية ، و اقحامها بغير موضوعها التي انزلت من اجله و ايرادها لأقوال اناس متحجرين من 1300 سنة مثل ابن قيم الجوزية ،، هي بالنهاية رأي صادر عن رجل أيد دخول الغزاة الى ارض الحرمين ، و أيد قصف العراق و تجويع أهله 13 سنة ، و من ثم يأتي و ينهانا عن مداهنة أهل الكتاب الذين أمرنا الله بأن نجادلهم باللتي هي أحسن ، لا أن ننعتهم بالكافرين ،،، فهؤلاء الذين سماهم بالكفار هم أولياء نعمة ولي نعمته سمسار الجاز ، واللي مش مصدق يزور YouTube و يشوف و يسمع اقرار الأمير طلال بن عبد العزيز (أو الانجليز) بعمالة والده للانجليز ، وانه كان يقبض 5000 جنيه استرليني شهريا (تعادل نصف مليون استرليني اليوم) ... فالشيوخ من أمثال ابن عثيمين و بن جاز و آل الفريخ و بقية شلة الجمباز لا يؤخذ برأيهم لثبوت نفاقهم و مداهنتهم للعملاء الذين سرقوا و أفسدوا و لم يقولوا (بخ) لاسرائيل ، بل لاموا حزب اللـه و سموا بطولته بالمغامرة و راهنوا على (الكفار) !!! (هذه نقرة و تلك نقرة) ..... اللهم اصلح هذه الامة و اذهب العملاء عنها و افضحهم و افضح بطانتهم العفنة ..."
