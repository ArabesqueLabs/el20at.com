subject = "اخذنا من الغرب بقاياه"
author = "سعود"
posted = "2007-11-13"
text = "قال الرسول عليه الصلاة والسلام\"لو دخلوا جحر ضب لدخلتموه\"<br />احتفال رأس السنه ليس لنا ولا لشعوبنا ولا هو من الدين في شيء.<br />انما هو تقليد.<br />لحب التقليد.<br />قد يتصور البعض انه متطور اذا احتفل برأس السنه , ولن يصلح حاله احتفال بالرأس فهو دائما ذنب.حتى في الاحتفالات<br />طيب عيد الفصح ممتاز<br />ليه مانحتفل بالفصح<br />او نجعل السنه كلها احتفالات<br />الهيلوين النيروز عيد الاستقلال الامريكي والهندي والفلبيني.<br />كلها اعياد وفيها فرح."
