subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-06-22"
text = "الغامدة كيفك انتا من جنوب المملكة وتسوى حورات مع اشخاص من شرق المملكة ويمثلون طائفة محدودة العدد حتى فى مكان تواجدهم وطبيعى تكون ارائهم مخالفة وتخيل لناس انهم شرائح تمثل خليط من المجتمع وبعدين وش حكاية على الكراها وعلى الاحوط هل انتا تنقل عن شيخ مسلم ام عن اية اللة ايرانى وانتا فتحت باب للمغفلين والجهال تمرير اقوالهم التى يشعون لترسيخها مثل وهابية متزمتين حتى نصل ارهابيين ولا عاجبك ومبسوط يبوضع العراق والمسلمين فية حين اصبحت بحوزة حوزة قم وما يحصل من مد ايرانى فى البوسنة بعد ان دفع ما يسمونهم الوهابية دمائهم فى تحريرها وحين توقفت الحرب تدخل الموالين الفرس لنقل مخازيهم التى تحتويها كتبهم ارجو ان تفهم انا المرحلة الراهنة يستغل فيها اى لمز او همز للمسلمين بشكل فوق ما تتصور اما اذا كان لايهمك ذلك فهذا شى اخر"
archived = "2010-03-14"
