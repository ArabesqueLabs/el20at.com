author = "البطل حسن خليل"
posted = "2009-08-23"
text = "للرجل سفينتين تصطاد السمك ولة ولدان كل ولد يشتغل على سفينة ومعاة صيادين من بلدة عزبة البرج<br />اختطف القراصنة السفينتين وطلبوا فدية مليون دولار<br />لف الرجل على مكاتب كل المسئولين محدش عبرة ولا سال فية<br />راح لجمعية تضامن الصيادين ليقترض مليون دولار اشتراك من الصيادين ويردهم بضمان السفينة وبيتة فسيادة اللواء قال لة اسف روح البنك<br />اتقفلت كل الطرق فى وشة<br />الناس بتوع البلد بداو يجمعوا تبرعات لتخليص ابنائهم<br />مفيش فايدة<br />البطل قال لمراتة انا حاربت فى 73 علشان مصر وانا الان شيخ عجوز وها اخرج احارب علشان عيالى ومش داخل عليكى البيت تانى الا ومعايا العيال<br />وخرج<br />وبدون مساعدة من اى احد<br />وهو وعيالة واولادة الصيادين دخل فى معركة مع القراصنة وخلص عيالة<br />ورجع لمراتة العجوزة وقال لها انا رجعت بالعيال والعيال جايين ورايا<br />وولاد الوسخة اللواءات بتوع الزفة راحوا لايقابلوهم فى الميناء<br />كل لواء علية قفا نص متر وكرش يبلع بلد<br />هم دول اللواءات ولاد الوسخة بتوع الزفة<br />ودى راجل من مصر<br />تحية للبطل الراجل اللى خلص عيالة حسن خليل ورجع لمراتة مرفوع الراس<br />شكرا يا رب<br />لسة مصر فيها بقايا رجالة"
