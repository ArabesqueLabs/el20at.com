[[comments]]
order = 0
subject = "التضخم والجنون وضياع الارض"
author = "فلاح"
posted = "2008-12-16"
text = "ثمن القيراط الواحد فى الارض الزراعية هذا العام فى قريتنا وصل 15 الف جنية والفدان فية 24 قيراط<br />يعنى ثمن الفدان فى الارض تازراعية360000 جنية اى حوالى ثلث مليون جنية<br />تضخم فظيع<br />سعر القيراط من 10 سنوات كان 400 جنية<br />طيب لماذا ؟<br />الفلوس لم يعد لها قيمة<br />الجنية فى قيمة المليم ايام عبد الناصر<br />انا مش عايز حمار فى الاقتصاد يقول لى التنمية 7 فى المية فية تضخم الف فى المية<br />طيب العائد السنوى من الفدان اية<br />تقريبا 3 الاف جنية<br />طيب الناس بتدفع الفلوس دى فى الارض لية - علشان مفيش امان لا فى البنوك ولا فى البورصة ولا فى اى حاجة<br />الناس بتحط فلوسها فى حاجة امان<br />فى الارض<br />يا حلاوة بتاع الاثتثمار ووزير الاثتثمار<br />البلد مليانة فلوس وهو بيلف برة<br />علشان كدة قدامى الاقطاعيون عايزين الارض بتاعتهم علشان يبيعوها بالسعر العالى<br />ثلث مليون جنية للفدان"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217105059/http://masr.20at.com:80/newArticle.php?sid=18845"

[[comments]]
order = 1
subject = "مطلوب من المحافظين عمل مشروعات تعاونية"
author = "كيمو"
posted = "2008-12-17"
text = "نفترض ان محافظة الشرقية مثلا او اسيوط اختارت قطعة ارض وقالت هنعمل مصنع موتوسيكلات والمصنع هيكلف 30 مليون جنية مثلا<br />مش هنعمل لا مبانى ولا مكاتب<br />مجرد هنجر للانتاج ومكتبين تلاتة<br />وهنقول للناس السهم ب ب 500 جنية<br />وحملة اكبر عشرة من اصحاب الاسهم هم مجلس الادارة<br />وهنجيب حق تصنيع الموتوسيكل من شركة مشهورة - وهنستورد بعض الاجزاء التى ىصعب تصنيعها فى البداية<br />الناس هتلاقى حاجة انتاجية تثتثمر فلوسها فيها وجوة محافظتها وهتشغل عيالها وهتضيف انتاج اضافى للبلد<br />بكدة يبقى فية تنمية<br />انما اقعد انتظر مثتثمر ييجى من برة - مش هييجى<br />لية<br />لان وضع البلد وظروفة لا يسمح بقدوم مثتثمر من الخارج<br />يعنى لو انا شخص هندى وعندى فلوس والحكومة عايزة تعمل مصنع حديد فى اسيوط وقالت لى روح اعمل المصنع فى اسيوط<br />اولا الحكومة تتقاضى جمارك على خامات انتاج الحديد 20 %<br />والسعودية ودول الخليج الجمارك صفر<br />يبقى اروح اعمل المصنع فى دبى او فى جدة او البحرين<br />البلد دى مش هتتبنى اللا بايدى اولادها<br />انسوا حكاية الاثتثمار والاستحمار بتاع محى الدين - دى شخص عايش فى الاوهام"
archived = "2010-03-14"
