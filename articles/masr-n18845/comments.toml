subject = "التضخم والجنون وضياع الارض"
author = "فلاح"
text = "ثمن القيراط الواحد فى الارض الزراعية هذا العام فى قريتنا وصل 15 الف جنية والفدان فية 24 قيراط<br />يعنى ثمن الفدان فى الارض تازراعية360000 جنية اى حوالى ثلث مليون جنية<br />تضخم فظيع<br />سعر القيراط من 10 سنوات كان 400 جنية<br />طيب لماذا ؟<br />الفلوس لم يعد لها قيمة<br />الجنية فى قيمة المليم ايام عبد الناصر<br />انا مش عايز حمار فى الاقتصاد يقول لى التنمية 7 فى المية فية تضخم الف فى المية<br />طيب العائد السنوى من الفدان اية<br />تقريبا 3 الاف جنية<br />طيب الناس بتدفع الفلوس دى فى الارض لية - علشان مفيش امان لا فى البنوك ولا فى البورصة ولا فى اى حاجة<br />الناس بتحط فلوسها فى حاجة امان<br />فى الارض<br />يا حلاوة بتاع الاثتثمار ووزير الاثتثمار<br />البلد مليانة فلوس وهو بيلف برة<br />علشان كدة قدامى الاقطاعيون عايزين الارض بتاعتهم علشان يبيعوها بالسعر العالى<br />ثلث مليون جنية للفدان"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217105059/http://masr.20at.com:80/newArticle.php?sid=18845"
