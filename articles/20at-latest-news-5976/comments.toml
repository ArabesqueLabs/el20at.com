subject = "حسبنا الله ونعم الوكييل"
author = "مساواة  مين بمين"
posted = "2007-05-28"
text = "ده عيب اوي شوفوا رواتب المدرسين اللي قامت السعودية على اكتافهم ومن سنين يعانو ويقاتلو في ساحات خحرووب تسمى المدارس بين عدم تهذيب وتربية الطلبة الي تعنت المدراء واضطهاد هم للمدرسين المصريين وإشعارهم بالدونية وبين نظم مهينة لهم رواتبهم في ظل الحالة الاقتصادية في البلد تكاد تكون بنفس معدلاتها ونسبتها في مصر وهم مضطرون للبقاء بسبب عدم وجود وظائف اصلا في مصر وايضا يتحملون اعباء اضافية من مصاريف سفر وخلافه حيبنا الله ونعم الوكيل<br />عندما يكون مدرس خبرة سنوات وسنوات في التعليم ويجيء واحد من تلامذته يتعين جنبا اللي جمب معه وبعد فترة قليلة يصبح يفوقه راتبا وترقيا في السلم الوظيفي والسبب ان ده مصري والتاني وطني"
archived = "2010-03-14"
