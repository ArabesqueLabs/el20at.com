text = "السلام عليكم<br />الله يسلمك أستاذنا عادل أنا أأيد السلامة المرورية والسلامة المالية<br />يعيني التفحيط و التطعيس يأثر بالسيارة سلباً يعني يعدمها على المدى الطويل<br />وأيضاً الله عز وجل وهبنا هذه النعمة , فلا نطغى ونترف عشان ماتروح علينا .<br />واذا احد معترض على كلامي فممكن يعطيني سيارته وأنا أعطيه حصان يطعس بك وتفط به ليييين ماينشف حلقك :lol:<br />والسلام ختام"
