subject = "كل واحد يفحط ويطعس حسب ثقافته"
author = "طارق مصطفى احمد"
posted = "2007-02-20"
text = "التفحيط والتطعيس هذا في السعودية فعلا ويكون بسيارة جيب او ما شابه انما في مصر بقه لدينا هواية التفعيص وبالتاكيد هذه الهواية معروفة لكل المصريين خاصة من محدودي الدخل لانهم كلهم بيمارسوها بس مش بعربية جيب ولا نيسان انما همه بيتفعصوا لوحدهم من زحمة المواصلات وماله مهو كله تفعيص."
