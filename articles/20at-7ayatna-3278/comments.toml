[[comments]]
order = 5
subject = "اختار التطعيس"
author = "أنس عمر بامرعي"
posted = "2008-11-11"
text = "وعليكم السلام ورحمة الله وبركاته<br />اولا اشكرك يا أ- عادل على طرحك للموضوع<br />انا اختار التطعيس ... انتم تسالون لماذا ...!!!<br />لأن التطعيس هناك مضاره ليس كالتفحيط<br />1- ان التطعيس له مكان معين وسيارات معيانة<br />2- نشاهد في التفحيط هناك ناس يخلون على السائقين في وسط الشارع<br />3- التفحيط يموت ناس كثيرون منه من سائقين او مشاهدين اما التطعيس فعدد قليل جدا من يموت<br />فقط هذا ما استطيع ان اخبرك به<br />ان اصبت فمن الله وإن أخطأت فمني ومن الشيطان<br />وأشكرك مرة اخرى<br />واذا كا هناك نقاط فارجو منكم اخباري بها<br />والسلام عليكم ورحمة لله وبركاته"
archived = "2010-03-14"
capture_url = ""

