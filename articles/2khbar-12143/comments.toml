author = "شعبان ابو عامر"
posted = "2009-05-24"
text = "الله أحيي المستشار المحمدي قنصوة واحسبه من اهل الجنة لاصداره الحكم العادل على مجرمين سفاحين لا اظن انهما اول مرة يقتلان بريئا مسكينا مظلوما بهذه الوحشية<br />واما المؤسسة الامنية المصرية فلابد ان تتوقف عن انتاج الوحوش والسفاحين<br />اعدام كل من هشام طلعت مصطفى ومحسن السكري لعنهما الله تعالى انتصار لكل مصري ولكل عادل في هذه الحياة اعدام هذان المجرمان وصلبهما يجب ان يكون عيدا قوميا في مصر ويجب ان يكون مطلبا شعبيا على نطاق واسع لانه ينقل الديار المصرية من قبضة المجرمين الى قبضة المحمدي قنصوة حفظه الله كم شابا مصريا بريئا قتله هشام طلعت مصطفى واما محسن السكري فكان يذبح ويقتل الاطفال والنساء والشيوخ مع شركات القتل الصليبية في العراق ولايؤسفني شيء مثل ترافع بعض المرتزقة والدنيئين عن هذان المجرمان ماذا لو ذبح احدهم ابنته او أ مه<br />الحزب الحاكم في مصر يجب ان ينظف من كثير من القتلة والسفاحين وماسبق دليل على ذلك"
