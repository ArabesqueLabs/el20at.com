subject = "(طيب ما الاول تحاسبو المحافظين اللى مولعينها)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-01-24"
text = "كلام جميل و نظرى<br />ما الاول تسنو قانون يعطى الحق للمواطن الغلبان الحق فى محاكمة و محاسبة المحافظ<br />اللى اصبح يحكم فى محافظتى اكثر من سلطة رئيس الجمهورية؟<br />و كان هذة المحافظة عزبة ابوة اللى و رثهالة؟<br />و عندكم محافظة الاسكندرية على سبيل الحصر و العدد فى اليمون؟<br />(موش كدة و لا أية!!!)"
