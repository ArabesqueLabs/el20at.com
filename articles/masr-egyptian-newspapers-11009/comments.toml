text = "هاااااااهااااااااااااهاااااااااااااا<br />كلام جميل<br />و كلام موش مكعقول<br />طيب الاول ما تحاكموا محافظ الرصيف اللى اهدر مئات الملايين من الجنيهات من اجل تشويهة محافظتنا<br />بلاش كلام فارغ ايها المساطيل<br />تحيا مصر و ليسقط محافظ الرصيف الاقرع؟!!!"
