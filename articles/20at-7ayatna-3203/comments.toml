text = "أنا شايف يا هدي إن هاني كان متفق معاكي من الاول أنك ما تشتغليش وماد انتي وافقتي على شرطه ده من الاول وسيبتي شغلك يبقى بجد تحمدي ربنا انه وافق ترجعي تاني . بس أنا قلتلك قبل كده أن الراجل زي الطفل لازم يحس أنه كل شئ في حياة مراته وانه محور اهتمامها<br />وعموما على رأي الست زينات صدقي تقريبا على ما اتذكر ان الخناق ده الفلفل والشطه بتاع الحياه<br />واحد مش متجوز وعايز يتجوز وربنا يستر"
