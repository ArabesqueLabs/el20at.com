text = "ماذا لو كتب زوجك مثل هذه المقالات ؟؟ ياترى هيكتب ايه<br />انا عل فكرة متابعك من زمان و حكاياتك بتفكرنى بي انا و زوجة الرجل الممل اللى هو انا<br />بس ياريت كل واحد او واحدة يحط نفسه فى مكان الاخر و يقرر هيعمل ايه<br />كل واحد يضع تصرفات شريك الحياة فى ميزان و يشوف العملية هتوزن ايه<br />و انا بقول للاخت الظريفة اللذيذة هدى ريحى المسائل و متسخنيش نفسك بس دائما فضفضى مع اخواتك مافيهاش حاجة"
