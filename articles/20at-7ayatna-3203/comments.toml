subject = "تلاكيك"
author = "واحد هيتجوز"
posted = "2007-02-09"
text = "و الله أنا شايف إنها أكيد تلاكيك من الزوج<br />بس الأزواج على حسب معرفتي الموضوع مش مشكلة بالنسبة لهم في الأول<br />المشكلة بتبدأ بعد الحمل و الخلفة و خلافه<br />بس مادام هو عايز يريحك يبقى إيه المشكلة , و خصوصا إن أي راجل محترم مابيحبش مراته تتعامل مع رجاله في شغل إذا كان الشغل ده لمجرد إنها زهقانه , أما إذا كان الشغل ده رسالة زي التدريس لبنات أو الطب فالوضع مختلف<br />و بالنسبة لموضوع الزهق ده ممكن يتحل عن طريق إنها تدخل في أنشطة خيرية أو دعوية و خلافه"
