[[comments]]
order = 6
subject = "ازيك يا أبله"
author = "لينا"
posted = "2007-02-11"
text = "في عنصر مفقود في الموضوع<br />اشمعنا هاني على طول اجاباته وتصرفاته سلبيه لابعد حد وكأنه سلبي في كل امور حياته<br />اكيد في امور ايجابيه في شخصيته ... حتى الاشخاص المملين معانا اكيد بيكونوا ممتعين في نقاط اخرى من حياتهم .<br />التفاصيل الي من هالنوع اكيد هتساعدنا في تقييم شخصيه هاني والتفاعل مع الحدث اكثر<br />يعني مثلا انا متهيألي اني سي هاني بيقعد لا بس بيجامه مقلمه ابيض في رمادي وكل الزراير مقفوله لحد فوق وعامل شعره على جنب وحاطط نظاره صغنونه قاعد بضهره مستقيم وماسك الريموت كنترول بيشوف قناة الجزيره بس .<br />وانك لو كلمته في اي موضوع هيرد عليك بصوت واطي وبالعافيه تسحب منه كلمتين<br />يعني هاني مستحيل كدا طول الوقت اكيد انه بيضحك<br />وبيهزر احيانا ولو بالغلط يعني<br />واكيد بيحب هدى<br />واكيد ممكن يمر عليه ايام يبقى ايجابي في نقاط معينه ومتفهم<br />محتاجين قليل من التوازن في حياتكم عشان نستمتع بالقراءه<br />بالتوفيق يا أبله ..."
archived = "2010-03-14"
