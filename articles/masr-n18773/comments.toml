subject = "الريس والريس وقال الريس ونام الريس"
author = "كوز العسل"
text = "ياريس يااللى مفيش زيك ولاحد يشبة لك ومالكش نائب ولاشريك مشبعتش بالذمة حكم واوامر وسلطة ووفلوس بالهبل مزهقتش من كتر الاستماع للمنافقين واصحاب المصالح اللى خلو بلدنا ترجع مية سنة لورا فى ظرف تلاتين سنة من حكمك نرجوك ونتوسل اليك ان ترحل وتاخد معاك معظم المقربين لك من اعداء مصر والمصريين ومتخافش سيادتك مصر حتبقى باذن اللة عظيمة وكبيرة بايدين ولدها اللى بيحبوها مهمن كان اللى حاكمها حاكم عادل اوفرعون فاسد"
archived = "2008-12-12"
capture_url = "https://web.archive.org/web/20081212162126/http://masr.20at.com:80/newArticle.php?sid=18773"

