[[comments]]
order = 3
subject = "الاخبار والمانشيتات المنرفزة التى نقرأها عن المتخلفين والهمج فى الخارج"
author = "هاها هاهاها"
text = "شوف يا اخى تصرف الناس المتخلفين فى الخارج<br />رئيس وزراء اليونان المتخلف استقال لان شرطى او ضابط شرطة اطلق النار على صبى ومات - انما عندنا ضباط الشرطة قتلوا اربعة فى اسبوع واحد بالرصاص وضابط منهم هدد سيدة انة يقلعها ملط فى الشارع قدام الناس فالست ماتت بالسكتة القلبية - وبعدين لا وزير الداخلية استقال ولا رئيس الوزارة استقال - فى ذمتك مش الناس بتوعنا اعصابهم جامدة ومش خيخة زى بتوع برة ولا متخلفين زيهم<br />بعد الحادث الارهابى فى الهند الاسبوع الماضى قدم وزير الداخلية استقالتة لان الهجوم حصل وفية اهمال ادى الى نجاح الهجوم وترك الحكومة لان حادث حصل<br />انما عندنا مجلس الشورى ولع و المسرح القومى ولع ومظاهرات المحلة وضرب النار الحى ووزير الثقافة ووزير الداخلية زى الاسود مفكروش يتخلوا عن المهمة المقدسة ويستقيلوا - يستقيلوا ازاى هما عبط<br />وقطار الصعيد احترق ومات فية 3 الاف بنى ادم ووزير النقل زى الفل<br />شوف الحضارة بتاعتنا<br />شفت المحافظ والوزراء بعد حادث الدويقة راحوا المستشفيات يسلموا على المصابين ويتصوروا هناك وما بيفكروش يقدموا استقالتهم<br />هنا بقى الفرق<br />اطمئن يا مواطن<br />عندك حكومة قلبها حديد وجلدها سميك وما عندهاش ريحة الدم وكل دة لمصلحة الوطن<br />اما خبر الصلاة للعيد فى الاسماعلية والتليفزيون بيذيع النشرة فحالة السادة اللواءات المقاتلين فى الجيش الثانى العواجيز المهكعين تبين ان عندنا مقاتلين اشاوس فوق الخمسة وسبعون سنة"
archived = "2008-12-12"
capture_url = "https://web.archive.org/web/20081212162126/http://masr.20at.com:80/newArticle.php?sid=18773"

