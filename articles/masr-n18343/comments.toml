posted = "2008-11-15"
text = "أخر سؤال مش فاهم لازمته ايه .. اللي هو افتراض حاجة وعايز رد على الأفتراض الوهمي دا<br />دا غير أن عنوان الموضوع مش مناسب مش بيعبر عن اللي جوا الموضوع<br />اما عن الفكرة في حد ذاتها زي ما شفتها في الجروب فهي هيايلة بس اصحاب العقل بس اللي يفهموها"
