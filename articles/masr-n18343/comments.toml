author = "سلمان البحريني"
posted = "2009-07-10"
text = "هونوها وتهون اخواني واخواتي…<br />السبب في زيادة العوانس هي كثرة النساء وقلة الرجال، وهذه الظاهرة من علامات الساعة التي اوضحها لنا النبي صلى الله عليه وسلم..<br />والحل وافضل الحلول مكرووهه عند النساء ألا وهي تعدد الزوجات وراح تنحل المشكلة بإذن الله تعالى..<br />اما بالنسبة للرجال فهم موجودين ولا غبار عليهم.. وهم اهل المساجد اسأل الله لهم التثبيت .."
archived = "2010-02-08"
