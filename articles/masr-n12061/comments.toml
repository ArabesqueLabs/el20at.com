[[comments]]
order = 0
subject = "ضع عنوان التعليق"
text = "اتقى الله فيما تفتى فيه . لأنها لو دامت لغيرك لم تصل اليك.<br />خاف يوما سوف تسأل عن كل ما تفتى به امام الله عز وجل.<br />أيعقل ان يكون كل هؤلاء العلماء دون علم وأنت العالم الوحيد الذى اراؤه صواب."
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025010613/http://masr.20at.com:80/newArticle.php?sid=12061"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
text = "واحد جاي في عصر حسني مبارك حيكون ايه يعني العز بن عبد السلام يلا الله يهديه<br />من أول يوم شفته بعد ما حلل الربا ولا جري ورا الصحفي في الشارع عشان يضربه ولا لما خلي صفية العمري تبوس ايديه قدام الكاميرا وهو فاشخ ضبه ولا ايه ولا ايه منه لله"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025010613/http://masr.20at.com:80/newArticle.php?sid=12061"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "سيد طنطاوي من غير لا استاذ ولا دكتور ولا شيخ لا سمح الله راجل معروف عنه أنه باع دينه من أجل المنصب الذي اعطته له الحكومة منذ سنوات<br />فمنذ أن كان مفتي ثم شيخ للأزهر ( للأسف ) فقد تدنس الأزهر بتولي هذا الـ ( .... ) منصب شيخ الأزهر<br />فمكانه الطبيعي ليس ذلك بل مخبر في مباحث أمن الدولة وليس أكثر من ذلك<br />وأقول له وبالله التوفيق<br />إن أول من تسعر به النار ( عالم ) وإني أراك هو ، ولذلك اتق الله ولا يغرنك بالله الغرور .<br />لا تستكبر في الأرض بغير الحق فإنك سوف تكون أكبر خاسر والله سوف يتم دينه ولو كره الكافرون<br />واذا اردت التعليق على فتواك فأقول لك :<br />أما أنك تعلم أنك منافق وهذه مصيبة كبيرة .<br />وإما أنك من كثرة ما نافقت في حياتك لا تدري أأنت على صواب أم خطأ وهذه مصيبة أكبر<br />المصيبة يا ناس إن ما يسمى بـ ( مجمع البحوث الاسلامية ) يدافع عنه ،،، اي فساد ،، لا اله الا الله هل وصل الفساد لهذه الدرجة والله وكإني في مكتب للحكم المحلي أرى وأشاهد الرشاوي والتلبيس يجري هنا وهناك ...<br />اللهم لا تؤاخذنا بما فعل السفاء منا<br />هذه شهادة مني اقابل بها ربي يوم القيامة<br />وسيعلم اللذين ظلموا أي منقلب ينقلبون"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025010613/http://masr.20at.com:80/newArticle.php?sid=12061"

[[comments]]
order = 3
subject = "فتوى المحصنات"
author = "مفترى"
text = "هل يقصد مولانا ان التشهير بالمحصنات جزاؤة الجلد وان الصحفيين الاشرار قد شهروا بمحصنة وتكلموا عن شرفها<br />وهل لا سمح اللة الى بالة بالى وفى بال مولانا دة محصنة ؟<br />يا صاحب الفتوى او الفثوى هل سيادة الرئيس من المحصنات ؟<br />من المفروض ان ترفع رئاسة الجمهورية دعوى ضد الشيخ لسوء التشبية وفساد النية وسوء الطوية<br />شيخ الازهر يشتم رئيس الدولة ويقول علية من المحصنات<br />ياعم الشيخ رحت فى الكازوزة"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025010613/http://masr.20at.com:80/newArticle.php?sid=12061"
