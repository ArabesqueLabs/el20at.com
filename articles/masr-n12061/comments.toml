[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-10-24"
text = "سيد طنطاوي من غير لا استاذ ولا دكتور ولا شيخ لا سمح الله راجل معروف عنه أنه باع دينه من أجل المنصب الذي اعطته له الحكومة منذ سنوات<br />فمنذ أن كان مفتي ثم شيخ للأزهر ( للأسف ) فقد تدنس الأزهر بتولي هذا الـ ( .... ) منصب شيخ الأزهر<br />فمكانه الطبيعي ليس ذلك بل مخبر في مباحث أمن الدولة وليس أكثر من ذلك<br />وأقول له وبالله التوفيق<br />إن أول من تسعر به النار ( عالم ) وإني أراك هو ، ولذلك اتق الله ولا يغرنك بالله الغرور .<br />لا تستكبر في الأرض بغير الحق فإنك سوف تكون أكبر خاسر والله سوف يتم دينه ولو كره الكافرون<br />واذا اردت التعليق على فتواك فأقول لك :<br />أما أنك تعلم أنك منافق وهذه مصيبة كبيرة .<br />وإما أنك من كثرة ما نافقت في حياتك لا تدري أأنت على صواب أم خطأ وهذه مصيبة أكبر<br />المصيبة يا ناس إن ما يسمى بـ ( مجمع البحوث الاسلامية ) يدافع عنه ،،، اي فساد ،، لا اله الا الله هل وصل الفساد لهذه الدرجة والله وكإني في مكتب للحكم المحلي أرى وأشاهد الرشاوي والتلبيس يجري هنا وهناك ...<br />اللهم لا تؤاخذنا بما فعل السفاء منا<br />هذه شهادة مني اقابل بها ربي يوم القيامة<br />وسيعلم اللذين ظلموا أي منقلب ينقلبون"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025010613/http://masr.20at.com:80/newArticle.php?sid=12061"

[[comments]]
order = 3
subject = "فتوى المحصنات"
author = "مفترى"
posted = "2007-10-24"
text = "هل يقصد مولانا ان التشهير بالمحصنات جزاؤة الجلد وان الصحفيين الاشرار قد شهروا بمحصنة وتكلموا عن شرفها<br />وهل لا سمح اللة الى بالة بالى وفى بال مولانا دة محصنة ؟<br />يا صاحب الفتوى او الفثوى هل سيادة الرئيس من المحصنات ؟<br />من المفروض ان ترفع رئاسة الجمهورية دعوى ضد الشيخ لسوء التشبية وفساد النية وسوء الطوية<br />شيخ الازهر يشتم رئيس الدولة ويقول علية من المحصنات<br />ياعم الشيخ رحت فى الكازوزة"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025010613/http://masr.20at.com:80/newArticle.php?sid=12061"

[[comments]]
order = 4
subject = "شكرا لك الاستاذ مصطفى بكرى"
author = "د/ صيام"
posted = "2009-03-14"
text = "فارس عربي شجاع نخوته عربية اصيلة نشط في المجال السياسي والصحفي محبوب جدا على الصعيد المحلي والعربي..انه فارس الصحافة المصرية والعربية السيد مصطفى بكري...<br />ولد مصطفى بكري في محافظة قنا بجمهورية مصر العربية..وهو شخصية صعيدية قل مثيلها في هذه الايام..توجهه ناصري ويعد من القوميين العرب المناصرين للقضايا العربية بأسرها ومن المدافعين عن الشعب المصري بلا حدود..<br />يعد مصطفى بكري من الصحفيين المتمرسين في مهنة الصحافة وهو مؤسس ورئيس تحرير جريدة الاسبوع المصرية المستقلة..بالاضافة الى انه عضو مجلس الشعب المصري عن دائرة حلوان والتبين جنوب القاهرة.<br />عربيا :<br />من اروع الفرسان العرب في الدفاع عن قضايا الامة العربية المصيرية في فلسطين خاصة والعراق والسودان والصومال وكل شبر عربي ..فهو اشد المعارضين للتطبيع مع الكيان الصهيوني ..وكان في مجزرة غزة الاخيرة ثائرا لم يغمض له جفن في المعارضة لأي دعم للكيان الغاصب ولم يجف قلمه ابدا في الكتابة عن بطولات المقاومة الفلسطينية وفضح الاعتداءات الصهيونية على ابناء غزة الغيارى..<br />في قضية العراق كان كالمحارب صفا واحدا مع اخوانه المقاومين وتميز بحبه الجم للقائد الشهيد صدام حسين رحمه الله ..وهو من الذين كشفوا حقيقة ما ارساه بريمر في العراق من اسس متعمدة من اللحظة الاولى واوضح بما ليس فيه من لبس ان امريكا تدق على وتر الطائفية وتسعى الى هدم الدولة العراقية من خلال حل الجيش العراقي وتوزيع المناصب على اسس طائفية وعرقية..<br />وانا من الملايين الذين شاهدوا برنامجه على قناة الساعة الفضائية في اليوم الذي ركل فيه الصحفي العراقي منتظر الزيدي الرئيس الامريكي السابق جورج بوش بفردتي حذائه وهو يقدم كرنفالا احتفاليا بهذه المناسبة وكان وجهه يشع نصرا وفخرا بتلك الفعلة الشجاعة ويتبسم بشكل يدخل القلوب بلا استئذان من تعليقات المواطنين المصريين والعرب.<br />محليا :<br />يقف مصطفى بكري المواقف الشجاعة دائما والتي تصب بمصلحة المواطن المصري (الغلبان)..ففي اي قضية تشغل الرأي العام تجده السباق نحو الوقوف جنبا الى جنب مع المواطن ضد المسؤول..ولن ننسى ابدا قضية العبارة السلام 98 وكيف ان بكري جعل باب صحيفته مفتوحا لاهل الضحايا وكيف انه وقف معهم حتى في المحكمة..ذلك ليس غريبا على فارس الصحافة المصري مصطفى بكري صاحب القضايا الجماهيرية من لقمة العيش الى اكبر موضوع يشغل المواطن البسيط.<br />هنيئا لك سيدي العربي الاصيل قلمك الذي لن يسكت ابدا مادامت اصالة عروبتك وصعيديتك تعلو الهامات..سلمت لنا قلما هو قبلة كل عاشق للكتابة والكلمة."
archived = "2010-03-14"
capture_url = ""
