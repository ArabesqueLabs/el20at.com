subject = "مثلا لما"
author = "نيفين نيفى نوفا"
posted = "2007-05-14"
text = "مثلا لما الدني تمطر و ميكونش معايا شمسيه<br />مثلا لما اقسم باكو شيكولاته مع انتيمتى و احنا ماشيين بنغنى تانى تانى تانى ..زراجعين انا و انت تانى<br />مثلا لما اقرا الرواياتو القصائد اللى بحبها<br />مثلا لما اسمع فيروز و هى بتغنى اديش كان فيه ناس<br />مثلا لما اشاغل القطط بتوعى<br />مثلا لما اشرب فنجان قهوه ف الفيشاوى مع اصحابى و احنا بنحلم بمصر اللى بتتولد من جديد ف ساعه ضلمه ما يعلم بيها الا ربنا على راى البراء<br />مثلا لما بضحك مع عمرو اديب ف القاهره اليوم<br />مثلا لما ادخل عشرينات و الاقى الحبايب و هما عارفين نفسهم<br />مثلا لما ادون ف مذكراتى يوم جميل عدى<br />مثلا لما اقعد ف راس البر على اللسان<br />مثلا يوم ما ترجع صاحبتى اللى سافرت و معرفش عنها حاجه<br />ياااااه يا عشرينات قلبتو علينا المواجع"
