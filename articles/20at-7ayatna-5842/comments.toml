subject = "م"
author = "م"
posted = "2007-05-14"
text = "السعاده الحقيقيه هى فى التقرب من الله ثم تاتي كل ما ذكرتي يا أستاذه السعاده الخصها لكي في كلمتين فهي تكمن فى ما ليس في يدك فأحيانا تشعر وانت مفلس انى سعادتم تكون فى الفلوس وحينما تأتى ايضا لا تشعر بالسعاده قد تشعر انها فى مثلا حب يطرق بابك يخطفك وحينما يأتى الحب ترى نفسك ايضا غير سعيده وهكذا فالسعاده الحقيقيه هى الرضا بما مقسوم لكي فى الحياة الدنيا والسعي بكل حب الى الله للفوز بالجنه في الاخرة فيا شباب عيشوا الحياه بطولها وعرضها عيشوا مرها قبل ان تتذوقوا مرها فدوام الحال من المحال ."
