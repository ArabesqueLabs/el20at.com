[[comments]]
order = 1
subject = "سعادتي زوال الطواغيت"
author = "مسلم"
posted = "2007-05-14"
text = "ما من شيئ في الحياة يزيدني بهجة وسعادة قدر زوال الطواغيت وعلى رأسهم الطواغيت الخمسة الكبار<br />ال سعود<br />حسني<br />الاسد<br />ملك الاردن<br />برويز مشرف<br />بزوال الطواغيت تتنفس الامة الحرية ، والنفس الحرة هي النفس المبدعة المنتجة<br />فاسعد أيامي يوما ينزاح عن الامة طاغوت"
