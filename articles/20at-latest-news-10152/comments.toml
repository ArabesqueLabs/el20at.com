order = 0
subject = "حفظ الله الشيخ"
author = "عبدالله"
posted = "2008-10-01"
text = "الحقيقة ان هؤلاء الغربيون لا يستحون فهم يقتلون البشر بدم بارد ويبيدونهم بافتك الاسلحة وامضاها كما حصل في العراق وافغانستان وغيرهما ولايتكلمون عن حيوانات التجارب وعن تلك التجارب الفضيعة التي تجرى على الفئران والخنازير والقرود وغيرها وقد انتهز الفرصة الاوغاد من الملاحدة العرب وكتاب المارينز وخدام الصهاينة في الاعلام المعادي للاسلام مواقع اكترونية وصحف ومجلات للتشهير بالشيخ الفاضل والسخرية منه وهو ماقال الا حقا وهذا دأب السفلة من الملاحدة لان الانسان اذا الحد فان اول ما يسقط فيه اخلاقه"
