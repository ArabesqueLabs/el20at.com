subject = "فقراء طلخا يتجمهرون لشراء فراخ ميتة ملقاة من مزرعة"
author = "قرف"
posted = "2008-05-18"
text = "نشرت جريدة البديل اليوم الخبر التالى فى مدينة طلخا الملاصقة لمدينة المنصورة يوجد مزرعة دواجن - الفراخ اللى فيها اصابها انفلونزا الطيور وماتت - عدد الفراخ 35 الف فرخة ميتة الناس هجمت على الفراخ الميتة شوال الفراخ الميتة يباع بخمسة جنيهات للفقراء الجريدة عاملة صور للحادث لما الناس وصلت لحالة انها تاكل الميتة يبقى اية يبقى كفر والعياذ باللة تبقى مش بلد ومفيش حكومة ومفيش اى حاجة خالص ولا يوجد اى تنمية ولا حتى مهلبية يبقى كل اللى بنسمعة كدب يبقى حسنى لما ييجى يخطب بيجيبوا شوية مجندين من مباحث امن الدولة يهتفوا بالروح بالدم نبقى بنمثل على بعض تمثيلية سخيفة والناس بتاموت من الجوع"
