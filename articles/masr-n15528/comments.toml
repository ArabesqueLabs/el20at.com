subject = "وقعدنا 26 سنة نستنى المثتثمرين اللى كل شوية حسنى ي"
author = "السيد نصر الحسيني"
posted = "2008-05-12"
text = "قالك السياحة وتنمية السياحة وعدد السياح زاد الى عشرة مليون فرد زاروا مصر طيب جميل يا حكومة بقر ضاحك مين اللى استفاد من السياح اذا كنا بعنا جميع فنادق الدولة اللى كانت بتعمل دخل للخزينة العامة بعناها للسعوديين والاسرائيليين والاجانب كم واحد مصرى بيمتلك فندق كبير علشان يستفيد من السياحة القرى السياحية كلها ملك الاجانب اية اللى بيخش لخزينة الدولة من السياحة ... اللى فى الشرم والقرى السياحية من اسرائيل واكرانيا وروسيا البيضاء هما اللى بيلموا الغلة من السعوديين والخليجيين والاجانب اية اللى بنستفيدة من السياحة مصنع زى البيبسى والكولا اللى كان بيعبى شوية مية صفراء عليهم معلقتين سكر وشوية صودا وبيدخل لخزنة الدولة فلوس باعوة لواحد من اصل يمنى الناس مش هتدفع ضرايب لانها ببساطة معندهاش ميزانية الشرطة 9 مليارات جنية لية وعلشان اية خربت البلد اقعدوا على تلها اللة يخرب بيوت اهليكم"
