[[comments]]
order = 6
subject = "دخل السياحة"
author = "ahmed"
posted = "2008-05-18"
text = "الي الأخ نصر: اولاً السياحة مش بس زي مانتا بتقول، السياحة هي المطاعم والتاكسيات والفرق الموسيقية وسواقين الأتوبيسات السياحية والمرشدين السياحيين ونعم ليست كل الفنادق مملوكة لغير المصريين ولكن حتى الفنادق الغير مملوكة للمصريين يعمل بها مصريين من مدير الفندق حتى الشيال. وصول السياحة من 2 مليون عام 1987 الي 10 مليون ده انجاز يحسب للحكومة بالتأكيد. ثانياً: الخصخصة نجحت في معظم الحالات في تحويل شركات خاسرة الي شركات رابحة. انظر الي بنك بيريوس او شركة ايديال. مرتبات العاملين في الأتنين تضاعفت ودي الحالة العامة في معظم الشركات التي تمت خصخصتها. القطاع العام طول عمره فاشل وكلنا عارفين كده؛ موظفين مبيشتغلوش وقاعدين علشان يقبضوا في اخر الشهر. ثالثاً: الأستثمارات الخارجية المباشرة السنة اللي فاتت عدت 11 مليار دولار!! دي كلها وظائف لو انتا مش عارف، الأسبوع اللي فات، شركة اوراكل فتحت مركز الدعم الدولي في القرية الذكية بيوفر دعم فني مش بس للشرق الأوسط، ولكن كمان لأميركا وأوروبا. المركز ده بس بيوظف 520 موظف بمرتبات عالية جداً وفيه عدد من المراكز المماثلة في القرية الذكية ومرتب الخريج اللي بيعرف لغات اجنبية بيبتدي من 2000 جنيه. القطاع الخاص مليان وظائف بمرتبات كبيرة، حتى تاكسي العاصمة مش عارف يلاقي سواقين بدخل شهري يصل الي 1200 جنيه في الشهر"
archived = "2010-03-14"
capture_url = ""
