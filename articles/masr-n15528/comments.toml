subject = "القرية السياحية وشركة اوراكل والدعم الفنى وحزمنى ي"
author = "هه"
posted = "2008-05-03"
text = "صبيان الحزب الوطنى يبطلوا كلام فارغ<br />اوراكل اية يا جهلة<br />اسرائيل عندها قرية اسمها بير سبع اللى كان متحاصر فيها طيب الذكر البكباشى عبد الناصر<br />اسرائيل عملت فيها مصنع بيصنع البرسيسور بنتيوم 4 اللى بيركب فى جميع كمبيوترات العالم<br />مكسبة السنة اللى فاتت 6 مليار دولار<br />6 مليار دولار<br />قرية ذكية اية وبدنجان اية<br />انت بجهل اهلك سمعت عن وادى السيلكون فى الهند<br />معظم اجهزة التحكم ابتداءا من الغسالة الاتوماتيكية وكروت التشغيل فى جميع المكائن ومصصمى برامج الكنترول هنود اعتبارا من دبى وحتى المانيا هنود<br />قرية ذكية بأمارة اية - بتعمل برامج لمباحث امن الدولة لتتبع المواطنين والتضييق عليهم وكذلك البطاقات الشخصية<br />كل سنة وطيب<br />ابقوا ارتقوا شوية ببرامج التثقيف الحزبى المتخلفة<br />وابقوا حفلات الرقص فى الفنادق اللى بتحول كل دخلها للخارج"
archived = "2010-03-14"
