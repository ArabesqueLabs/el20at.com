text = "الرئيس قال انةهيصرف العلاوة بعد تدبير موارد حقيقية للخزانةالعامة بواسطة مجلس الشعب والشورى ومجلس الوزراء<br />وطبعا المصدر الوحيد للموارد هى الضريبة<br />وظنى انة هيعطى علاوة 30 % وهياخد ضرايب من الناس 50 %<br />ودى مش حل<br />الحل هو<br />مرتب خريج الجامعة بالاسعار الحالية 3000 جنية فى الشهر<br />واجر العامل 1000 جنية فى الشهر"
