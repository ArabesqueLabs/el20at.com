[[comments]]
order = 3
subject = "اكيد احنا مصرين وملناش مصر تانى"
author = "الملك فاروق"
posted = "2008-05-03"
text = "السيد المحترم كاتب التحقيق كان من اواجب عليك اظهار تحقيق اخر فبل هذا التحقيق وهو متى زادت الاسعار وبصورة جنونية وزايادةفى السلع الاساسية اسرد لك ان من يوم ان اصبح مجلس الوزرا من رجال الاعمال واخذ كل شى فى الارتفاع لماذا من لة المصلحة فى ذلك ومن المتسبب بس صدقنى الازمة ازمة ضمير واصبحنا نعيش فى غابة حقيقية والقونين لا تتبق الا على الضعفا بدليل اكيد ساعدتك قريت عن اسرة وجيرانها 16فرد اتجبسو علشان قرض 500 جنية واكيد عرفت ان الحكومة والبنوك كانو بيثفوضو مع اصحاب القروض بل وتفاوضو فعلا وبعضهم ردو القروض ولاكن بعد ان استسمرو المال وسدد و القروض من فوايد المال صدقونى العيب من القانون القانانون افة فى المجتمع اذا لم تسن قوانين وتتبق على الجميع سواسية لا فرق بين غفير او وزير الكل واحد لن تتقدم هذة البلد خطوة للامام انت بتتكلم على علاوة شوف طن الحديد بكام ودى سلعة استراتجية وهى عصب الاقتصاد المصرى ويقوم علية صناعات كثيرة اراضى الدولة تملكت لمن وجى تقولى علاوة حقوق الشعب فين المفروض يكون فى عدالة فى التوزيع الناس بالها مشغول باةوانت تقولى علاوة المفروض الدولة تقسم هذة الاراضى على الموطنين بلا مقابل وخاصة الفقرا المشردين القاهرة لم تعد تتحمل سكانها والامراض زادت هناك اكبر من العلاوة فى ناس بيخدو معاش السادات 70 جنية وليس لهم دخل اخر وهتلاقى نصهممات فىطوبير العيش البلد دى فى خير كتير بس للاسف مفيش عدالة فى التوزيع اما تتكلم عن العلاوة فانت تتكلم عن فقرا مصر وهذة حقيقة الموظف المصرى يجوز ان تنفق ذكاة المال علية وادنى مرتبات يتعطاة الموظف المصرى وانا بتكلم عن الموظف المصرى المحدود مش الى مرتبة بيوصل لمليون ويمكن اكتر ياخونا الناس فاهمةبس للاسف محدش بيسمع ولا بيحس بالناس فى قضاية كتير اتكلم فية يمكن قلبهم يحن على الناس ويعطفو علينا"
archived = "2010-03-14"
