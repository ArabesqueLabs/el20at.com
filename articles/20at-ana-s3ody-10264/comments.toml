subject = "قراءة نقدية لرواية العذاب والألم سقر ."
author = "نبيلة منصوري ـ أبها"
posted = "2008-10-24"
text = "قراءة نقدية لرواية العذاب والألم سقر .<br />صدرت رواية سَـقـَر عن الدار العربية للعلوم ببيروت كثاني عمل للكاتبة عائشة الحشر وكان عملها الأول<br />مميزاً بحق وتستحق الكثير من التقدير لشجاعتها في طرح قضيا المرأة السعودية بجرأة وثقة في<br />كتابها الأول ( خلف أسوار الحرملك).<br />نأتي الآن إلى سقر.<br />بداية ً العنوان صادم جداً. بل يكاد يكون مخيف. فسقر جزء من جهنم التي سيعذب فيها الله العصاة.<br />فما علاقة العنوان بمضمون الرواية.؟.<br />تقع الرواية في 160 صفحة تقريباً من الحجم المتوسط. ركزت فيها الكاتبة مادتها تركيزا ً عالياً جداً وجعلت<br />لكل كلمة في ال160 صفحة أهمية بالغة بحيث لو سقطت جملة ما من الكتاب أو طـُمِست فإن القاريء<br />سيضيع ولا يتمكن من فهم ما يجري. أي ليس هناك الكثير من الكلمات والجمل الزائدة عن الحاجة والتي<br />توضع من قبل بعض الكتاب لمجرد (مط) الرواية<br />الجمل في سقر على مقاس الأحداث بالضبط. وهذا يعني أن تلاحق الصفحات لتعرف ما يجري بسرعة شديدة.<br />وأرى أن هذا الأسلوب يكون عيبا ً وميزة في نفس الوقت.<br />عيب في الكتابة لأن الكاتبة لم تعط الشخصيات فرصة كافية للنمو في عقل القارئ.<br />وميزة لأن من يمسك الرواية في الساعة الواحدة ظهراً (مثلي أنا) لن يتركها في الثالثة والنصف<br />إلا وقد انهاها. لأن القارئ متعب من شدة التشويق ويريد أن يعرف ماذا سيحدث من جهة ولأنه<br />مستمتع ومتعاطف مع قصة الحب التي تضمنتها الرواية.<br />تقع أحداث الرواية في مدينة أبها. وتعالج موقف المجتمع من الحب. وإن أردنا الدقة فإن الرواية<br />تصور نتائج ما يفعله المجتمع بالعشاق<br />وتتناول أيضاً جهل المجتمع بالطب النفسي ولجوء الناس إلى المشعوذين أوالمعالجين الشعبيين<br />والشيوخ لكي يزيدوا المريض مرضاً لأنهم لا يدركون أبدا ً مشكلته النفسية ويتخيلونها عين أو جن<br />أو سحر. ولا يخرجون عن هذه الاحتمالات الثلاثة.<br />إحدى بطلات الرواية تعاني من مرض عقلي يسمى الفصام البرانوي وهذا المرض يجعل المريض<br />يسمع أصواتاً يصورها له عقله لكنه لا يدرك هذا. أي أنه يسمع أصواتاً غير موجودة ويصر على<br />أنها حقيقية وموجودة. ثم يتعاطى معها بعد ذلك وكأنها حقيقة ويعيش في عالمه المرتبط بتلك الأصوات.<br />إن عدم إدراك الحالة ـ لعدم وجود ثقافة كافية لدى الناس تحميهم من تدمير بعضهم ـ يجعلهم<br />يتعاطون مع الأمراض النفسية والعقلية بأساليب تضاعف المرض وربما تنهي حياة المريض.<br />ساء حال البطلة أسماء ولم يتمكن الطبيب من علاجها لأن أبويها وبحسن نية يذهبان بها إلى<br />الشيوخ معتقدين أنها مصابة بسحر أو عين أو جن .<br />في الرواية نرى كيف أن الضغوط تجعل الناس يبتكرون طرقا مختلفة من أجل اللقاء إذ أن حتى<br />طالبات المدارس لديهن حيلهن لكي يلتقين بالشباب. حيث في الرواية أن إحدى الفتيات تمثل<br />دور المصروعة ويأتي حبيبها ويأخذها من المدرسة منذ الصباح.<br />البطلين الرئيسين مها وعبدالله يعذبان القارئ بنهاية قصة حبهما. لكن هما مثال لقصص العشاق<br />في مجتمع يغذي الكره ويؤمن بحرمة الحب.<br />في الرواية الكثير من أسماء الكتب وبعض الأغنيات . إضافة إلى قصيدة كتبها البطل عبدالله من أجل<br />حبيبته مها بعد أن سكر حتى ثمل.<br />كان يمكن الاكتفاء بتلك القصيدة الجميلة والإشارة فقط إلى أسماء الأغنيات ولا حاجة إلى كتابة كلماتها.<br />في النهاية يدرك القارئ أن هذا الجحيم الذي يعيشة الأبطال يكاد يتساوى مع سقر التي يأكل فيها<br />ساكنوها يوم القيامة ويشربون ويتحدثون لكنهم يتعذبون (حسب تعبير إحدى الشخصيات).<br />بشكل ٍ إجمالي الرواية من النوع الكلاسيكي الراقي تنساب لغتها البسيطة لتصف مجريات الأحداث<br />بسلاسة برغم قسوة تلك الأحداث.<br />نبيلة منصوري. أبها"
