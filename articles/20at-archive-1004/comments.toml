subject = "كيفيه ممارسه العادة السربه"
author = "تمارا"
posted = "2007-11-10"
text = "الله يا شباب انه العادة السريه حرام وانا اقلكم كيف تعرفوها بالنسبه للشباب يقوم الشاب بوضع مادة لزجه مثل الصابون علي يدة في الحمام ومن ثم يقوم بوضع يدة علي القضيب (الزب) علي شكل دائره ومن ثم يقوم بتحريك يدة امام وبالخلف ويتخيل بنات عاريات وهو يتخيل انه في السرير ينيكهم ومع تخيله ومع تحريك يدة يخرج من الشاب شئ يسمي المني ويخرج بسرعه وعند خروجه يشعر الشاب انه مرررررتتتتتتاح وفي حاله نشوه وبعد هذا يقوم يتنضيف الحمام لكي لا تعلم امه انا اللي قلي واحد صاحبي في الجامعه وانا كنت بسمعله وفي حاله نشوه كنت اما بالنسبه للبنات"
archived = "2010-03-14"
capture_url = ""

[[comments]]
