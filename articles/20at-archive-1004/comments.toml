text = "السلام عليكم<br />والله ياناس هذا شي مخزي ..<br />والي يبي يعالج صحيح ويقلع عن هالعادة يروح للمواقع المتخصصه الطبية مو عند الشباب !!<br />هذا من المجاهره بالمعصيه وهو شي كبير .. يعني الواحد يسوي معصيه ,, يستر على نفسه ..أن وش استفدت اذا قلت ايش تسوي ؟؟<br />وبالنسبة للعلاج :<br />أنا بسألكم عيال او بنات ..<br />إذا كنت في قمة هياجك/ت وقمت اوقمتي بالإنزال : ألا تشعر بالندم والحزن على هذا الواقع الي انت مبتلى فيه ؟؟<br />تحس انك تكره العاده والجنس كله صح ولا لا؟؟<br />طيب الي تعود عليه مايقدر يتركه صح ؟؟<br />طيب المخدرات تدرون وشلون يفكون الناس منها ؟؟<br />يقللون له الجرعه لين يتركه ..<br />طيب ومثل عادتنا ..<br />أبعد عن المناظر المغرية للغريزة ..<br />في حال الرغبة فيها شف لك اي شغله تصرفك عنها ..<br />اصبر يوم وبتتعب احرص ماتسويها الا اذا كنت في غاية الشهوة ..<br />وكل فترة قلل الأيام على نفس الطريقة ..<br />قال تعالى \\\" واستعينوا بالصبر والصلاة \\\"<br />إذا تعبت صلي ..<br />وادع الله بحراره انه يشيل هاذي العادة عنك ,,<br />انت كانك ماتخاف الله اهتم بمصلحتك مع خطأك بحق الله ..<br />كل الي سلكوا هذا الطريق ماتركوها إلا بزوال العفه او امراض او عيرها ومنها الفضايح ..<br />انت ماشي بها الطريق الى متى ؟؟<br />وعندي عتب للي يحطون ارقامهم ويخدعون البنات بالحلول ليش الكذب ؟؟<br />على العموم نبيكم تدعون لنا .."
