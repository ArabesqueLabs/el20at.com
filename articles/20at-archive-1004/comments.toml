subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-09-23"
text = "العادة السرية<br />إن اسباب الاستمناء وممارسة العادة السرية<br />- ضعف الوازع الديني<br />- الفراغ والشعور بالوحدة<br />- التوتر العصبي<br />- التعرض للمثيرات الجنسية أو التعرض للاستشارة الزائدة<br />- التهيج في الجلد بسبب مرض<br />- وجود مشكلة عاطفية او القلق، الحزن، والهم<br />- التقصير في المدرسة أو الكلية أو الجامعة<br />- الحرمان من العطف والمحبة داخل البيت<br />اثار العادة السرية<br />إن أغلب الآثار الناجمة عن العادةالسرية هي آثار نفسية، ولا نعني بذلك أن العادةالسرية ليس لها تأثير على الناحية الجسمية، ولكن أضرارها النفسية أعمّ وأخطر.<br />وتأثيرها على الناحية الجسمية أو القدرة الجنسية يأتي بصورة غير مباشرة من خلال تأثيرها على الحالة النفسية؛ بما تسببه من شعور بالذنب، والإحباط، والعجز أمام هذه العادة، وفقدان الثقة بالنفس.<br />لكن من يمارس العادة السرية يشعر بالتشتت الذهني، ويشعر بسبب الخيالات المختلفة التي ترد على ذهنه بعدم الإشباع الكامل لغريزته، وبالتالي عدم الاستقرار والارتياح النفسي.<br />وحسن استخدام هذه الغريزة وحفظ الفرج يعطي الإنسان شعورا بالثقة في النفس؛ فيبقى سليما من هذه الناحية طيلة حياته.<br />ويمكنننا أنا نلخص أن كل من يمارس العادة السرية يصاب بـ :<br />- اضعاف الجهاز العصبي الذي قد يؤدي بدوره إلى اضعاف الجسم كله<br />- الفتور<br />- العياء<br />- الخجل والحياء<br />- الصمت والوحدة وانحباس اللسان<br />- شحوب اللون ، إذ يميل إلى الاصفرار<br />- فقدان الذاكرة<br />- الصراع الذي يسبب الألم الشديد<br />- تأنيت الضمير<br />- القلق على أداء الجهاز التناسلي<br />- سرعة القذف<br />خيارات العلاج :<br />- أشغل نفسك في أوقات الفراغ بما يفيدك ويرضي دينك كالقراءة أو ترتيب المنزل<br />- إبتعد قدر الامكان عن غرفة النوم ولا تخلد إلى فراشك إلا إذا أصابك التعب<br />- العمل على تأمين رفقاء صالحون تقضي معهم معظم أوقاتك<br />- إبتعد عن شرب المنبهات كالقهوة والشاي والفلفل والكاكاو<br />- تجنب مشاهدة المسلسلات الغرامية أو الكتب الفاسدة والصور والافلام الخلاعية (تجنب كل ما يثير شهوتك)<br />- تجنب دخول أو تصفح المواقع الالكترونية المشبوهة<br />- إهتم بغذائك وتأكدي أنه يحتوي على جميع العناصر الغذائية المناسبة<br />- مارس الرياضة في الهواء الطلق<br />- حاول أن تحّل مشاكلك النفسية (القلق والاضطراب)<br />كلمة أخيرة :<br />إن النصيحة المثلى هي تجنب التعرض للمثيرات والالتزام بغض البصر، وأن تبتعد عن ممارسة العادة السرية وتسعى للزواج التزاما بالحديث الشريف \\\\\\\\\\\\\\\"يا معشر الشباب من استطاع منكم الباءة فليتزوج فإنه أغض للبصر وأحصن للفرج، ومن لم يستطع فعليه بالصوم فإنه له وجاء\\\\\\\\\\\\\\\"."
