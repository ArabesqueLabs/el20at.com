text = "انا كيميائي اعمل كمندوب بشركه ادويه ولكني اري ان الصيادله دخلهم مرتفع جدا في مصر يمكن الفئه الاولي فحتي الصيدلي ممكن يعطي الاسم صاحب ومدير باجر بالاضافه لعمله وده بيحقق له دخل مرتقع<br />واعتقد ان نقابه الصيادله اعطت لهم حقوق كثير جدا منها عدم قانونيه العمل لاي خريج اخر كمندوب دعايه ويطبق هذا القانون بالشركات الحكوميه مع العلم ان هذه المهنه رقم 1 فيعا خريجين اداره لانها لاعلاقه لها بالادويه ثانيا مجرد ام صيدلي حديث التخرج يمسك مدير صيدليه في مستشفي اول تعيينه ودي مهنه برده شخص دارس اداره وحركه كخزون اعتقد كده النقابه اعطت للصيادله اكثر من حقوقه<br />وبعدين نطالب بحقوقنا بس ندي اللي علينا<br />كل صيادله المستشفيات ولله الامر من قبل ومن بعد اساس عملهم الرشوه ادفع لتحصل علي الاوردر<br />والصيدليات الخاصه حدث ولاحرج علي اعلي نسبه فساد في مصر 99 % من محروق لعينات لادويه غير مرخصه ............. الخ"
