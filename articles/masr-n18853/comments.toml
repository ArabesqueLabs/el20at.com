order = 0
subject = "طيب والخريجين اللى بلا عمل وبتوع المعاش المبكر يقع"
author = "قهوجى"
posted = "2008-12-17"
text = "انا طالب فى الجامعة<br />وعارف ان مصيرى القهوة - رغم شهادة الاليكترونيات اللى ها احصل عليها<br />طيب نقعد قين<br />ويا بشاوات الملايين اللى خرجوا معاش مبكر وهم فى الثلاثينات يقعدوا فين - احنا شعب عاطل<br />المساجد وقفلتوها<br />والمصانع وبعتوها والقهاوى وعايزين تقفلوها<br />طيب نقعد قين<br />نعمل مظاهرات بقى ونعمل تحرش ونسلى نفسنا باى حاجة ونلف فى الاسواق ونحتك بالستات<br />اية الافكار اللى بتطلعوا بيها دية<br />قفل المقاهى هو اللى فاضل وهو اللى هيحل مشاكل الشعب"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218144149/http://masr.20at.com:80/newArticle.php?sid=18853"
