subject = "مخالفة"
author = "ليث ضاري"
posted = "2007-10-23"
text = "بهذه التصريحات يخالف القس شنودة التعاليم الدسقولية مخالفة صريحة<br />فقد ورد فى مقدمة الدسقولية -المصدر الثانى للتشريع المسيحى- حكم بوجوب اطلاق اللحية:<br />\"يجب ايضا الاتنزع لحيتك لتفسدها او تغير شكل الانسان الى غير طبيعته لان الناموس قال\"لا تحلقوا شعر لحاكم\"-لا5:21 - لان الله خالقنا خلقه و لان هذا يليق بالنساء فاما الذكور فحسبهم ان هذا العمل لا يليق بهم و انت اذا صنعت هذا لترضى الناس و تقاوم الناموس تصير مرذولا قدام الله الذى خلقك كصورته اذا كنت تريد ان ترضى الله ابعد عن كل ما يبغضه و لا تصنع ما لا يرضيه\"<br />ولمن لا يعلم ... التعاليم الدسقولية هى المصدر الثانى للتشريع المسيحى بعد الكتاب المقدس وهى عبارة عن 39 بابا و تشتق كلمة دسقولية من الاصل اليونانى\"-)idaskalia\"و معناها تعاليم و هذا الكتاب هو مجموعة تعاليم الرسل القديسين عن بعض انظمة الكنيسة\"كما جاء فى مقدمة الكتاب\"<br />وهي تباع في مكتباتهم ودار كتابهم ... ولكنهم لا يعلمون عنها شيئا<br />هم للأسف يكتفون بأغمض عينيك وإتبعني ... وإفتح قلبك ... والإيمان لا يخضع للعقل<br />والمفاجأة أيضا أن الحكم بوجوب ستر المرأة المتزوجة لكامل جسدها (الحجاب) بل ووجهها أيضا (النقاب) مذكور في التعاليم الدسقولية ... وكذلك نهيها عن التزين لغير زوجها<br />من لا يصدقني فليذهب لأقرب مكتبة متخصصة في الكتب النصرانية وليشتري كتاب تعاليم الدسقولية ... وهو رخيص بالمناسبة<br />اللهم إهد النصارى حتى يؤمنوا قبل أن يروا العذاب الأليم"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222233240/http://masr.20at.com:80/newArticle.php?sid=12009"

