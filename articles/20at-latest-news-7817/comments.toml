subject = "غزة"
author = "ابوياسر"
posted = "2007-12-17"
text = "الاخوة الكرام انا مقيم في مدينة غزة ومنزلي يطل مباشرة على ساحة الكتيبة والحقيقة ان حماس لم تدعي ولم تقول لا على لسان ناطقيها ولا في اعلامها ان عدد من حضروا لمهرجانها مليون وتركت التقديرات للمراقبين المستقلين ولصحفيين واصحاب الخبرة ..لكن بصدق وأمانة من اجتمعوا في مهرجان حماس فاقوا من حضروا في مهرجان فتح علما بأن المهرجان هو لعرفات وشاركت فيه كل فصائل منظمة التحرير وكثير من عناصر حماس ..بينما من حضر لمهرجان حماس هم مؤيدو حماس فقط ..<br />المهم هو ما أرادت توصيله حماس لكل الدنيا انها حاضرة وبقوة وبرغم الحصار والتجويع في عاصمة المقاومة غزة وأن ادعاء فتح بمسيرة المليون عار عن الصحة تماماً"
