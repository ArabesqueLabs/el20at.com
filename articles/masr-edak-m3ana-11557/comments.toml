text = "عايز تحلم - تحلم باية<br />انك تبقى دكتور وتتخرج من كلية الطب ويبقى مرتبك 240 جنية وغيرك بيقبض 3 ملايين جنية فى الشهر فى جريدة بتخسر بالمليارات<br />تحلم باية<br />انك تدافع عن الوطن وتحرس الامن وانت بتقبض 400 جنية وغيرك بيقبض 3 ملايين جنية<br />تحلم باية<br />مفيش احلام<br />طفى انوار مخك<br />ابحث عن اقرب بياع سجاير بانجو او اشترى قرش حشيش واطلق الدخان الازرق<br />مفيش احلام<br />لان فية ناس غيرك سرقوا كل احلام الشعب"
