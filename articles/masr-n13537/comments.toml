text = "انا ماشوفتش الفيلم بس ما اعتقدش ان حاجه زي الشذوذ ده انتشرت في مجتمعنا للدرجه دي علشان يجي في يعقوبيا وفي الفيلم ده<br />ثانيا موضوع التحرش والاغتصاب ده كان ممكن يستبدله خالد يوسف بمشاهد توصل المعنى من غير ما تخدش حياء اللي بيتفرج<br />ولا حضرتك ايه رايك؟؟؟؟؟"
