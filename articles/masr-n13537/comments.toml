subject = "خالد يوسف : متخلف من ظهر عبيط"
author = "طيف بدر"
posted = "2007-12-29"
text = "كل المشخصاتية عبارة عن موتزقة و مصابين بشذوذ عقلي و نفسي و يريدون تخريب المجتمع المصري تماما كالمومس التي تريد إفساد غيرها من العفيفات<br />أيها المخدعون ببريق خالد يوسف و أهل المسخرة عن نور الله اعلموا أن من أحب قوما حشر معهم و أن كل جنيه ننفقه لهؤلاء النصابين المتاجرين بآلامنا هو تعاون على الإثم و العدوان<br />أنظروا إلى إيران بجانبكم كيف أصبحت قوة إقليمية عظمى و من أكبر صناع السيارات و من السباقين في مجال الطاقة النووية بينما نحن فرحانين أوي إن سي خالد يوسف عمل مشهد شذوذ جتسي<br />بلا خيبة<br />http://alayasser.maktoobblog.com"
archived = "2008-02-09"
