[[comments]]
order = 7
subject = "مش مهم"
author = "مسلم  اسكندراني مصري"
posted = "2009-02-02"
text = "لست محترف في النقد السنمائي لكن علي الاقل خالد يوسف يقلد يوسف شاهين في اشياء كثيرة منها<br />اختيار ممثلين ضعفاء و محاولة تلميعهم مثل عمرو سعد في فلمين فعلها يوسف شاهين مع سيف عبد الرحمن<br />ايضا اختيار عدد كبير جدا من الممثلين ايضا الانتاج الضخم نسبيا ايضا صفه مشتركة بين خالد و يوسف شاهين<br />التأثير البالغ في الممثلين للدرجة التي تجعل الممثل يفقد الاحترافية في الاداء و الابداع ايضا محاولة الاشترك في الفيلم كممثل و كانة يقلد ابية الروحي او علي الاقل يحاول<br />لذلك اتوقع ان خالد يوسف سوف يقوم باخراج خمسة افلام علي الاقل تتناول سيرتة الذاتية فعلها يوسف شاهين من قبل حيث ان افلامة نحو الثلاثين خمسها تتناول حياتة الشخصية ايضا سوف يتجة للرمزية الشديدة في افلامة<br />ايضا سوف يصر علي الفاظ بعينها مثل وسخة و ابن الكلب و ما الي ذلك<br />اما اذا استمعت الية شخصيا تجده يقول كلاما لا يفهم معناة اصلا مثل مفهومة عن الليبرالية و الابداع و الابتكار<br />اسف ان كنت اطلت عليكم<br />شكرا"
archived = "2010-03-14"
capture_url = ""
