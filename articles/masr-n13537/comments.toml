[[comments]]
order = 2
subject = "اثارة كاذبة ومفتعلة"
author = "واحد معدى بالصدفة"
posted = "2007-12-25"
text = "مضمون الفيلم هابط - وقصة مفتعلة - تبغى فى المقام الاول جيب المشاهدين<br />وهذا المخرج الفاشل لن يكون ابدا تلميذا ليوسف شاهين ولا حتى خليفة لة - لان يوسف شاهين صنع افلاما وطنية زى الارض تتعلق بوطنية الشعب وكفاحة وتمسكة بالارض رغم الفقر والجوع ونقص الماء<br />اما هذا الذى يربط الاحياء الشعبية ويسميها عشوائية بالارهاب وكذلك كل من يلبس جلابية بيضاء ويصلى بارهابى واننا عندنا احياء تغص بالارهابيون فهذا تضليل وكأن عندنا سيارات مفخخة فى الشوارع وقتلى كل يوم فى الحوارى وكأننا العراق مثلا او افغانستان<br />مصر دولة امنة جدا ومسالمة جدا ولا يوجد عندنا عنف ولا كلام فارغ<br />ولكن يوجد فقر فى كل مكان والفقر هو سبب كل المصائب ومن اسبابة الطلاق واطفال الشوارع والسرقات<br />اما حكاية الاغتصاب فهذة قصة ممجوجة وبايخة وكاننا فى شيكاغو<br />طيب يا اخى فى السعودية الاسبوع الماضى كان فية حادثة اغتصاب جماعى لفتاة ومش معنى كدة ان كل المجتمع كدة<br />احنا لية بنوسخ صورة مجتمعنا<br />فية مشاكل اة - بس لا نبالغ ونفهم الناس ان دى قضية منتشرة والحقوا احنا خلاص بقينا زفت وهباب<br />افلام مواضيعها هايفة وكل هدفها جذب المراهقين - واشاعة الفاحشة والجمل البذيئة<br />مخرجين هم<br />فلا عجب ان تنهار السينما والمسلسلات المصرية لتصعد على حسابها السورية"
archived = "2007-12-28"
capture_url = "https://web.archive.org/web/20071228074452/http://masr.20at.com:80/newArticle.php?sid=13537"

[[comments]]
order = 3
subject = "للاخ الفوقى كتكم الارف مالتوا البلد"
author = "بحب السيما"
posted = "2007-12-25"
text = "خالد سويف مخرج جامد جداا ويناقش الواقع بحرفية عالية جداا ولا بيحاف من احد وعشان كدة انا بحب هذة الشخصية واقدرها وهو يستحق ماهو فية الان من انة من احسن مخرجى مصر وبالنسبة للاخ الفوقى سنما سورية اية البتتكلم عليها هو فى حاجة اسمها اصلا سنما سورية انا عمرى ما شفت سنما سورية قوية ولا حتى ضعيفة وبلاش الحقد على السنما المصرية كدة كتكم الارف ماليتوا البلد"
archived = "2007-12-28"
capture_url = "https://web.archive.org/web/20071228074452/http://masr.20at.com:80/newArticle.php?sid=13537"

[[comments]]
order = 4
subject = "فيلم ستحق .. النجاح :)"
author = "إبراهيم"
posted = "2007-12-26"
text = "طبعًا العنوان ده ، بالمناسبة، يمكن عشان أفكرك إن خالد يوسف من زمان بيكسب، يمكن هما اللي مش واخدين بالهم، لا أعتقد إن (إنتا عمري ) اتنسى، حتى اللي كرهوا هانس سلامة فيه ، لسه فاكرين نيللي كريم، وكذلك ويجا ، لغاية انهاردة الناس بتتكلم عنه ، إن اختلفت مع النهاية الخالد يوسفية :-) تقريبًا ، وكذا خيانة مشروعة ، خالد يوسف قدر يقدم لنا سينا شاهين بطريقة عصرية، ودجه يمكن اللي خلى جو يستعين بيه (لأول مرة ) في هي فوضى، عشان الناس تقول اتفرجنا على حاجة لجو، ....<br />أما عن حين ميسرة فأعتقد إن محدش دخله مطلعش مكتئب، ودي رسالة خطيرة، ومهمة جدًا أجاد خالد يوسف في توصيلها، و فعلاً أتفق معاكي إن أطفال الشوراع وما دار بينهم كان أقسى بكثييير من الاغتصاب، ربما، ولكن الناس ما علقتش كثير عليه ، من جهة أخرى لم أر عند خالد يوسف شيئ من الابتذال ، وده يحسب له ! يعني مش دغيدي خاااالـص ! !<br />كان فيه شوية أوفر ف موضوع الكمبيوترات واللاب توب، والتوك توك ، اللي حسيتها محاولة عصرنة الفيلم، وهيا مش محتاجاه خااالص، يعني الآخر كان فيه كمبيوتر واحد و إراهبيين برضه، مكنش محتاج أحمجد بدير لخمستاشر كمبيوتر عشان يبقى خلية !!، تحول أحمد بدير مكنش مستساغ على فكـرة، ياريت لو حد فاكر مبرر تحول، غير إنه جبان يقول لي عليه ، شكرًا يا دعاء<br />رغيت كثير أنا :-)"
archived = "2007-12-28"
capture_url = "https://web.archive.org/web/20071228074452/http://masr.20at.com:80/newArticle.php?sid=13537"

