text = "والله بصراحه انا عن نفسي اقدم المذاكره على المباريات واحب اقول للشباب انه لو اتفرج المباره والمباره كانت مهي حلوه مزاجك حينخبص وما حتقدر تذاكر وكذا خسرت المباره والاختبار لاكن المفروض نشوف الاهم الي هو المذاكره لانك لما تذاكر حتستفيد لكن لو ماذاكرت والمباره انخبصت ماحتستفيد مره ولاحتذكر وكذا انت الخسران .. والله يوفق ياخوي علي"
