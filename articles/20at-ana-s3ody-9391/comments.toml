text = "بصراحة أنا مرت علي بطولة كأس العالم 1994-1998-2002 على التوالي وأيام إختباراتي سواء في المرحلة الثانوية أو الجامعة بس والله كنت أقدم إختباراتي والمذاكرة عليها لأن دراستي هي مستقبلي س هذه مايمنع إني أكون متابع للمباريات ولو بالنتيجة فقط عن طريق سؤال الأصدقاء<br />عمومأ لو فاز الفريق أو أنهزم أنا ماراح أستفيد أكثر من لو أني شديت حيلي ونجحت العكس النجاح هو شخصيتك<br />أرجو من الجميع فهم رأيي وأني لست ضد الرياضة<br />ربنا يوفقك يا أستاذ علي"
