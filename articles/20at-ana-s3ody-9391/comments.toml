subject = "المستعد هو الإنسان الناجح"
author = "محمد بامشموس"
posted = "2008-06-21"
text = "البعض يكون مستعد للإختبارات منذ فترة و البعض ينتظر إلى يوم الإختبار وهو يعلم أنه موولع بكرة القدم والدواري الأجنبية<br />فتأتي المباريات والنهائيات فيشغل ذهنه وفكره ووقته فيضيع الكثيير<br />فالمستعد لايهمه كثير أما الآخر ماذا يفعل يشاهد أم يّذاكر ؟؟؟ ونذكر الشباب بمقوله معروفه<br />الوقت كالسيف إن لم تقطعة قطعك.....<br />وتحياتي للإعلامي الصاعد بقوة الأستاذ علي بن حاجب"
