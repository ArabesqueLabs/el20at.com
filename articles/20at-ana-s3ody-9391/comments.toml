text = "إن كان من تعليق فبداية على المجهود الرائع الذي يتواصل به هذا الإعلامي الرائع عبر هذه البوابات من مواضيع يطحها على الساحة ومواكبة للحدث _ أشكرك من أعماق قلبي _ ولا أستطيع إلا أن أقول إبداع ساخن لسخونة الأحداث التي تكتب عنها ...<br />أما من ناحية الموضوع فهو لم يترك تعليق وهذا حال الساحة للعقول والأفهام والنفوس<br />يبقى أن الطالب إذا تربى على معرفة الأولويات فهو بالتأكيد لن يتلتفت لمثل هذه البطولات وسيبقها شي ثانوي يتابعه متى ما لم يتعارض مع مهمة من مهمات حياته<br />أتمنى التوفيق لجيل الأمة وشبابها<br />تحياتي...."
