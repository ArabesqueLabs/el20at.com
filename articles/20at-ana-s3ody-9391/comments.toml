[[comments]]
order = 4
subject = "ترتيب الالولويات"
author = "ABDULLAH MOHAMEED"
posted = "2008-06-22"
text = "من الأمور التي تعلق بها شبابنا هذه الايام وأصبحت جزء من حياتهم اليومية - فنحن لانمانع ولانحرم وإنما نطالب بترتيب الأولويات ، فليس يعقل أن يكون الطالب ملتزم باختبار ويشاهد المباراة ولو كان فريقه ونجومه الذين يعشقهم ويحبهم ، فحرام كما ذكر في التعليقات أن يضيع مجهود 3 أشهر من أجل مباراة ، وأرى أن المسئولية الأخرى تقع على أولياء الأمور فهل يعقل أيضاً أن اسمح لابني أن يشاهد المباراة وعنده اختبار في اليوم التالي بل سمعت ان أحد هم اشترك في قناة الجزيزة في هذه الايام خصوصا فأين أولياء الامور؟؟!! - وفي رأي لا يتعارض ذلك ولو كان الطالب في المرحلة الثانوية أو الجامعية فضغوط الوالدين ومتابعتهم تؤتي أكلها .<br />تحياتي لك أ/ علي والى الامام دوماً"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "البطوله هذي طعمها غير"
author = "MohNaD"
posted = "2008-06-22"
text = "اولا تحياتي لك أخوي علي وعلى المجهود الرائع المبذول<br />الموضوع في وقته ومن المواضيع المهمه للطلاب وغيرهم<br />انا طالب في ماليزيا الأن ومع ان المباريات تأتي عندنا متأخره جدا إلا اننا لا نفوت ولا مباراه حتى ولو كان عندنا إختبارات....<br />هنا الشعب كله يشاهد المباريات وترا كثير من المدرسيين والطلاب لا يحظروا للمعهد بسبب مشاهدة المباراه ليلا...<br />وهنا لايوجد فرق بين الرجل والمراه في مشاهدة المباراه فترى المرأة ةالرجل يشاهدوا المباريات وأيضا يمكن ان ترا المراه متعصبه أكثر من الرجل...<br />وأخيرا تقبل مروري...<br />وبالتوفيق والنجاح الدائم<br />YOUR BROTHER MOHANAD"
archived = "2010-03-14"
capture_url = ""

