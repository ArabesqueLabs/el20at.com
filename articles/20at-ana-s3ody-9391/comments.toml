text = "أولا : أحب أقولك ماشاء الله عليك أخوي علي بصراحة تقرير رائع وشيق ..<br />ثانيا : الله يعين طلابنا والله حالتهم صعبة وخصوصا وقت الاختبارات زادت حلاوة البطولة ..<br />الله يكون في عونهم وربنا يوفقهم بس حرام الواحد يضيع سنة كاملة عشان مباراة أو بطولة >;>;>; لاحقين عليها<br />أخيرا :<br />تمنياتي لك بالتوفيق والاستمرار بالنجاح والتميز خطوة بعد خطوة ..<br />يعطيك العافية ولك التوفيق وفالك البيرق !!!!"
