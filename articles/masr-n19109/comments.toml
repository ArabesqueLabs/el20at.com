[[comments]]
order = 1
subject = "حتى اذا جاء وعد الاخرة جئنا بكم لفيفا"
author = "ابومحسن"
text = "من علامات يوم القيامه قبض العلم وقيادة الرؤوس الجهاله للعالم الاسلامي والموضوع باختصار وعندما كنت اسمع فضيلة الشيخ محمد الشعراوي تفسير القران رحمه الله رحمة واسعة وفي احد مقاطع القران التي تخص اليهنود وقال حتىاذا جاء وعد الاخرة جئنا بكم لفيفا لفيفا يعني كل اليهود اللي في الدنيا حيجوا في هذه المنطقة يعني الان 6 مليون وهما 15 مليون يبقى ناقص 9 مليون<br />س: يه يا شيخ يا شعراوي حيجوا كلهم في هذه المنطقة<br />ج: لان المسلمون او حسب تعبير الشيخ الشعراوي (الايمان) لا يستطيع تعقبهم في كل مكان في الارض فلابد ان يتجمعوا حتى يضربهم الايمان ضربة واحدة ......... وهذا الكلام ثابت في تفسير الشيخ الشعراوي<br />اذن حضور اليهود الى هذه المنطقة من علامات يوم القيامه وحتكتمل العلامه عندما يأتي جميع اليهود في بلاد العالم<br />فالحرب مع اليهود لها ميعاد الا وهو بعد ان يكتمل عددهم وكل اليهود في العالم يحضروا هذا هو موعد الحرب مع اليهود<br />وهذا هو كلام الفقهاء الكبار وعلماء الدين مثل الشيخ الشعراوي<br />اذن لا فائدة من قتالهم الان وما يجب فعله الان هو الاستعداد لهم لساعة الصفر<br />عمالين نضيع وقتنا وقوتنا واموالها في كلام فارغ<br />الان هو الذي يجب عمله هو تاييد المواقف السياسية العربية والوقوف خلف السياسيين العرب وقد نجحوا نجاح باهر في اقامة الدولة الفلسطينية في الضفة والقطاع غزه دا انجاز سياسي مهم جدا كان لا بد من المحافظة عليه بدلا من محاولة تدميره<br />حكام المسلمين ليسوا خونه حكام المسلمين بحكم موقعهم على راس القياده يعلمون هذه المعلومات ويعلمون انه لا جدوى من حرب اسرائيل الان وتم اقامة الدولة الفلسطينية في الضفة والقطاع بعد جهود مضنية اشترك فيها السادات وحسني مبارك والملك حسين وياسر عرفات والملك فهد<br />واخيرا ما احب ان اضيفه<br />ان تجمع اليهود في فلسطين من علامات يوم القيامه ولم يكتمل تجمعهم حتى الان وكل اليهود سيأتون حسب الاية القرانية حتى اذا جاء وعد الاخرة جئنا بكم لفيفا يعني لسه 9 مليون يهودي حيجوا تاني<br />حرب اليهود تبدأ بفعالية بعد ان يكتمل تجمعهم حسب ما سمعته من الشيخ الشعراوي بانهم يتجمعون حتى يضربهم الايمان ضربة واحدة لان الايمان لا يستطيع ان يذهب اليهم في كل مكان يعيشون فيه<br />يجب المحافظة على ثمرة الجهاد السياسي الذي قام به الزعماء العرب السادات وحسني مبارك والملك حسين والملك فهد وياسر عرفات التي تكللت باقامة الدولة الفلطسنية في الضفة والقطاع<br />سلام"
archived = "2009-01-04"
capture_url = "https://web.archive.org/web/20090104060346/http://masr.20at.com:80/newArticle.php?sid=19109"

[[comments]]
order = 2
subject = "المسلمون وافتقاد القيادة الروحية"
author = "ابومحسن"
text = "القيادة الروحية دي انها اتعلمتها من الاقباط يعني البابا شنوده يمثل للمسيحيين في مصر القيادة الروحية<br />والشيعة ايضا عندهم قيادة روحية ومرجعية يعني الخوميني وحسن نصر الله والسيستاني كل دول قيادات روحية ومرجعيات للشيعة<br />للاسف هذه النظرية مغيبة تماما عند اهل السنة والجماعة اللي هما احنا<br />يعني القيادة الروحية والمرجعية عند الاقباط والشيعة قيادة سمع وطاعة يعني القيادة تأمر والرعية تسمع وتطع<br />مع ان احنا اهل السنة والجماعة وعندنا السمع والطاعة بند اساسي في تكوين هذه العقيدة الا اننا ليس لنا قيادة روحية او مرجعية دينية يسمع كلامها المسلمون ويثقون بها<br />علىالعكس تماما وبكل اسف اهل السنة والجماعة يستهزئون بعلمائهم ويستخفون بهم وعلى راس ذلك للاسف الشديد شيخ الازهر<br />يا حسرتاه ويا وكستاه على اهل السنة والجماعة<br />ولذلك انا ادعو الى احياء فكر اهل السنة والجماعة وعلى المسلمين انتخاب قيادات روحية لطائفة اهل السنة والجماعة يقتدون بأمرهم<br />سلام"
archived = "2009-01-04"
capture_url = "https://web.archive.org/web/20090104060346/http://masr.20at.com:80/newArticle.php?sid=19109"

[[comments]]
order = 3
subject = "نهاية هذا النظام"
author = "مصرية جدا"
text = "بسم الله الرحمن الرحيم<br />حرب48 كانت السبب في الانقلاب ونهاية فاروق<br />حرب67 يعتبرها الناصريون لحظة وفاة ناصر الحقيقية<br />كامب دافيد كانت السبب في قتل السادات<br />حرب غزة2009 هيا بداية سقوط النظام<br />لم يتعرض النظام لضغط خارجي وداخلي بهذا الشكل , كما انه يعتمد بشكل اساسي على بوش ولا نعرف كيف سيتعامل معه اوباما<br />المهم ان هذا النظام انتهى"
archived = "2009-01-04"
capture_url = "https://web.archive.org/web/20090104060346/http://masr.20at.com:80/newArticle.php?sid=19109"
