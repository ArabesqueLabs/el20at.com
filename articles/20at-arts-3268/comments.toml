subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-04-03"
text = "انا حاببة انصح الاخت دعاء بحاجة صغير ةقبل ما تبدأ مشوارها الإعلامى , علشان تبقى مقدمة برامج ناحجة وليكى طابعك المميز -اللى بتدورى علية طول مقالك- مش لازم إنك تقللى من قدر غيرك وتظهريهم على انهم شياطين وملاعين وان انت الملاك اللى هيجى علشان ينقذ البشرية منهم !,هالة سرحان ونشوة الروينى نجحوا علشان اجتهدوا -بصرف النظر عن تقييمك الاخلاقى ليهم-تعبوا واجتهدوا فى شغلهم لحد ما كونوا اسمهم ومكانتهم ,إذا كنتى فعلا هتقدمى برنامج بيلمس الواقع الحياتى للناس بشكل ما بيحصلش فى بقية البرامج اللى بتشوفيها ,معتقدش إنك محتاجة تقولى اللى بتقولية دة , كل اللى محتاجاة انك تركزى وتبطلى تفتشى عن عيوب غيرك وتتكلمى عليها بالطريقة دى ..<br />اما لو كان الموضوع كلة دعابة من الموقع ,فدة يبقى شىء اغرب !,بس مش غريبة على الاخوان ,اللى معظمهم ماشيين بسياسة اتحشمى يا بلد !و فاكرين انهم كدة هيبقوا حلوا مشكلات مصر ولما الناس تبطل تكلم فى الجنس ولما الفنانين يتحجبوا ويقعدوا فى بيوتهم ويستبدلوهم بوجوة اعلامية محجبات ,هتبقى مصر يوتوبيا والحياة هتبقى لونها بمبى !<br />اتمنى الموقع ما يحجبش تعليقى !"
