[[comments]]
order = 8
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-04-02"
text = "بس العموم حلو البرنامج دا وانا عايز تعرضولي المشكله بتاعتنا دا الي هي مع الدوله بسم الله الرحمن الرحيم<br />الموضوع ماساة اسره<br />اكتب ماساة اسره ضاع املها في عيان السلطه واستهتار المسؤلين وانا الان اكتب الي السيد رائيس مصر واب كل شاب وفتاه واتمنا من الله ان تراعوا الله في حياة الارواح البريئه من التدمير بسبب اهمال المسؤلين وسعيهم وراء المال والسلطه<br />الحادثه<br />بصراحه اخي الكابتن الشهيد ايمن عبد المنعم محمد الشربيني كان كابتن بنادي بيلا الرياضي ومقيد بسجلات الاتحاد المصري لكرة القدم لعام 2000/2001 م وكان صديقه المقرب له حسام غالي بالرغم من ان الشهيد كان لاعب ممتاز واحسن من حسام غالي شوفوا الحال دلوقتي هو فين حسام وبيتعقده معاه بكام مليون . ولكن الاهمال الذي اخذ روحه دون شعور بالاهمال.ولقد ذهب الشهيد مع فريقه لتادية مباراه امام نادي شبين الكوم والذي لقي مصرعه عند احتكاكه بعمود كهرباء لا يبعد اكثر من مترين من الضربه الركنيه وقد تم نقله بسيارة الشرطه لانعدام سيارات الاسعاف وقد راحت اخر انفاسه في مباراة الاهمال وكما انزل عرقه في حرم الملعب كانت هناك في نفس هذا الملعب اخر انفاسه والذي خرجت من روحه بسبب اهمال الوزارات ومن المعروف ان اتحاد الكوره المصريه كان يشرف وينظم هذه المباريات ولابد من وجود لجنه لمراعاة السلامه والامان لكلا الفريقين وكان من المفروض ان الملعب كان غير صالح ممنوع اعطاء تصريح من قبل اللجنه لاتحاد الكوره بالعب عليه مدام ملعب فاسد ذي الاتحاد .وشبكة الكهرباء الذي بنت عامود مكهرب وبدون تغطيه اسلاكه المميته في حرم الملعب والذي ادي الي قتل هذا الكابتن الذي لا يستحق هذا الاهمال من جميع المسؤلين في شبكة الكهرباء والاتحاد المصري لكرة القدم الظالم والغير منصف<br />ومنذ هذه الكارثه التي المت بنا عام2000 ونحن نسعي في المحاكم وليس بخفي عن سيادتكم ما الم بقضائنا من طول امد وعدم الحكم في قضيه ما الي بعد عمر طويل...... ولاجدوي من حكم منذ هذه الفتره الطويله فلاءي طريق نحن ذاهبون هل لو كان هذا الكابتن ضمن احد الانديه الكبري او البلاد الذي يحترم فيها حياة الانسان لكان وضعه هكذا الاجابه بالنفي طبعا وهل حادث العباره التي راح جراءة ارواح ابرياء ليس مطابق لهذه الكارثه او الحادثه القريبه من اذهننا هي حادثة محمد عبد الوهاب بالرغم من انه كان مريض بالقلب كما قالو الناس في البيت بيتك بانه كان القلب عنده ضعيف والملايين الذي اخذتها عائلته بسب اهمال الاطباء المصريين في نادي الاهلي بعدم الكشف علي حياة اللعيبه قبل وبعد المباريات ولكن اخذو حق هذا اللعب الذي قال لنا الله عز وجل عن عدم ترك الحق .. اهاذه الحوادث لا تتشابه مع بعضها البعض فلماذا كانت الاجراءت السريعه التي كانت ضد مرتكبي حادث العباره ومسائلة المقصرين ولماذا هذا الاهمال من جانب القضاء للبث في هذه القضيه التي اودت بحياة اسره بكاملها ..فاننا في شدة اسفنا من اهمال الوزراء والمسؤلين الذين من الواجب عليهم ان يحافظو علينا ولكن انهم يدمرو حياة شباب مصر واتمنا من الله ان نري المساواه في المعامله والانصاف علي الارض ونحن في عصر الديمقراطيه وانصاف الضعفاء من الاقوياء ونحن الان في عصر سيادة الاب والرئيس العادل والد كل اسره الذي حث القضاء الحسم وانصاف البشر واعطاء حقوق الناس والذي قال في التليفزيون وقال ان القضاء قضاء عادل الاب والرئيس محمد حسني مبارك اتمنا من الله ان القضاه يراعو ضمائرهم ويضعون انفسهم في نفس المكان والموقف وان يتقوا الله في ان حل هذه المشاكل والقضايا المتاخره منذ زمن بعيد سوف تقوم بحل مشاكل كثيره في حياتنا الصعبه الذي نعيشها الان ونناشد الاب محمد حسني مبارك بان يعطي تصريح للقضاه بان القضايا لا تاخذ اكثر من سنه لحلها ولكم جزيلا من الشكر واتمنا ان تعطو الحق لاصحابه ولكم الشكر<br />من اسره ادمرت بسبب اهمال<br />مسولين غير شرفاء الي الحق"
archived = "2010-03-14"
