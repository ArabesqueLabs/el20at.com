[[comments]]
order = 1
subject = "المشكلة في هوايدا طه وامثالها"
author = "ابومحسن غربة 25 سنه"
posted = "2007-05-04"
text = "المشكلة مش في التعذيب المشكلة في امثال هويدا طه اللي بيتاجروا بالام الناس علشان خاطر يشتهروا ويبقوا اغنياء<br />المشكلة ان كل واحد بيدور على مصلحته كل واحد عايز يهرب من الفقر زي هويدا طه عماله تفكر ازاي تكسب فلوس كويسه وتبقى مشهوره اكتر من عمر خالد تعمل ايه مفيش غير التعذيب والام الناس بالضبط زي الولية بتاعة قناة روتانا علشان خاطر تشتهر وتكسب فلس كويسه مفيش غير الجنس اللي تشتغل فيه وبالفعل اشتهرت وبقت غنية وعندها فلوس كتير<br />المهم ان الحكومة بهذا الفعل قدمت خدمة لهويدا طه واعطتها دفعة قوية للشهرة والنجومية واللي بيدفع التمن الشعب الغلبان المسكين<br />نداء الى الحكومة المصرية: لو سمحتوا ما تساعدوش الناس دول على الشهره"
archived = "2009-03-09"
capture_url = "https://web.archive.org/web/20090309104010/http://ana.20at.com:80/20at/masr/live/5673-9888.html"

[[comments]]
order = 2
subject = "سمعه البلد هى اللى هتروح ورا الشمس"
author = "نيفين نيفى نوفا"
posted = "2007-05-04"
text = "انا شايفه ان الست هويدا مكنش فيه داعى تيجى من الخليج لحد مصر و تتعب نفسها علشان تعمل فيلم وثائقى موجود مقاطع منه على كل موبايلاتنا<br />و ع النت و عارفينه كويس<br />لكن لو الموضوع للجزيره تيجى اوى طبعا<br />علشان الجزيره تذيع و تشبع لطم<br />انا بضم صوتى لصوت الاستاذ خيرى رمضان لما قال ان منع مرور الشرايط ف المطار هو اللى ادى طعم البهارات للبرنامج بتاع الست هويدا<br />ارحمو البلد<br />مهياش ناقصه"
archived = "2009-03-09"
capture_url = "https://web.archive.org/web/20090309104010/http://ana.20at.com:80/20at/masr/live/5673-9888.html"

[[comments]]
order = 3
subject = "يا جماعه خليكم واقعيين"
author = "أسكندراني بأمريكا"
posted = "2007-05-05"
text = "أنا مش مصدق اللي أنتم كاتبينه .لو سافرتم بره مصر حتكتشفوا إن سمعة مصر و صورتها أمام كل العالم أوحش مما تتخيلوا. وذلك ليس بسبب هويدا طه أو غيرها ولكنه بسبب الفساد في بلدنا. وبدل ما نشوف المشكله وندرسها بنهاجم اللي يتكلم بصراحه. المشكله موجوده والصوره الورديه لمصر هي وهم صنعه الإعلام المنافق في خيالنا . ياريت نحاول نحل مشاكلنا ونبطل الأتهامات للغير وبدل ما نفكر في سمعتنا نفكر في كرامة الشعب المصري اللي متداسه في الداخل والخارج"
archived = "2009-03-09"
capture_url = "https://web.archive.org/web/20090309104010/http://ana.20at.com:80/20at/masr/live/5673-9888.html"

[[comments]]
order = 4
subject = "توضيح"
author = "أسكندراني بأمريكا"
posted = "2007-05-06"
text = "أنا فعلا أعتقد أن كشف الفساد وفضحه هو أحسن وسيله للقضاء عليه . وإن كنت أفضل أن نفعل ذلك بأنفسنا فقيام جهة أخرى بذلك يجب أن يحفزنا على مراجعة أخطاءنا و تصحيحها وليس مهاجمة هذه الجهة وإلقاء اللوم عليها .فالمشكلة موجوده بالفعل و نمت بمرور الأيام دون حساب المخطئين.<br />و يجب علينا إن كنا نخاف على سمعة بلدنا ألا نقوم بالخطأ وإن فعل بجهالة فلا يجب التستر عليه و زى ما قالوا في الأمثال \" أمشي عدل يحتار عدوك فيك \"<br />هذا مجرد رأيي الشخصى وشكرا لسعة صدركم"
archived = "2009-03-09"
capture_url = "https://web.archive.org/web/20090309104010/http://ana.20at.com:80/20at/masr/live/5673-9888.html"

