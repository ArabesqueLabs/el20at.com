subject = "بنحبك يا مصر"
text = "مع تحيات<br />أحمد بهجت،أحمد عز،محمد أبو العنين،محمد منصور،ابراهيم كامل،حسين سالم،حمزة الخولى،محمد شتا،محمد نصير،مصطفى البليدى،ال غبور،ال يعقوب،ال ساويرس،طلعت مصطفى،محمد فريد خميس،ال الهوارى،محمد جنيدى،حسن راتب،حسام أبو الفتوح و غيرهم"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043937/http://masr.20at.com:80/newArticle.php?sid=14097"

[[comments]]
order = 9
subject = "نداء عاجل الى شباب مصر"
text = "كيف تصبح إنسان ناجح<br />بكل بساطة عليك بالتالي:<br />--اجعل هدفك في الحياة هو الراحةوالاسترخاء<br />-- حب سريرك فهو مملكتك الوحيدة<br />-- ارتاح بالنهار لتتمكن من النوم بسهولة في الليل<br />-- العمل شيء مقدس، لذلك لا تقترب منه أبداً<br />-- لا تؤجل عملك للغد طالما يمكنك تأجيله لبعد الغد<br />-- اعمل أقل ما يمكنك عمله، وحاول أن تجعل غيرك يؤدي عملك بدلاً منك<br />-- لا تقلق لن يموت أحد إذا لم تفعل شيئاً، بالعكس قد يتأذى البعض عندماتعمل<br />-- إذا أحسست بأن لديك رغبة في العمل،استرخي قليلاً حتى تزول تلك الرغبة<br />-- لا تنسى : العمل مفيد للصحة ، لذلك اعطي المريض فرصة ليعمل"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043937/http://masr.20at.com:80/newArticle.php?sid=14097"

[[comments]]
order = 10
subject = "ومصر بتاعتنا فى اعماق اعماق قلوبنا"
author = "مش عارف"
text = "احنا ولاد البلد المطحونين المطرودين من مصانع بلدنا اللى باعوها وشردونا تحت اسم المعاش المبكر<br />احنا اللى طلعونا معاش مبكر واحنا لم نكمل الثلاثين وقالوا لنا روحوا موتوا<br />احنا الشباب المتخرج واليائس والعاطل والمتصعلك فى مقاهى النت ومقاهى الشيشة<br />احنا اللى فقدنا اى امل فى امتلاك او استئجار شقة او عمل خطوبة لحبيبة القلب بنت الجيران<br />احنا اليائسون فى عصر الحرامية<br />احنا بنحب بلدنا اكتر منهم - وبنحبها فى كل لحظة مش فى يوم محدد - فى كل نفس بنتنفسة<br />بنحلم ببكرة<br />بنحلم بيوم يموت فية الحرامية ويحكمها الشرفاء ويبقى لنا حق فى بلدنا<br />بنحب مصر<br />كلنا بنحب مصر"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043937/http://masr.20at.com:80/newArticle.php?sid=14097"
