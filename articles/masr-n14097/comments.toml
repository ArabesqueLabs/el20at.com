subject = "الى الاستاذ معصراوى"
text = "واكيد حضرتك ما سمحتش ظروفك السعيدة بالذهاب الى احدى مقار مباحث امن الدولة<br />او لم يقودك حظك العاثر الى الاشتباك مع الامن المركزي وشم رائحة الغاز الذي يطلقوه<br />اقرأ كلمات الاغنية كويس يا استاذ حتلاقي اللي كاتبها مصري ابن مصري مطحون في تراب مصر"
archived = "2008-02-07"
