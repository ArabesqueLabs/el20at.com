text = "أجي يعني ؟؟؟<br />فيها بوفيه ولا لأ؟؟؟ حتي يبقي علي حساب مصر يا بشر ..<br />عموما بإذن الله نيجي كلنا ....<br />يارب<br />يارب مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المرضي .... \"ولا بلاش أكتب كده؟\"<br />mohamedmat@hotmail.com<br />يالا ..تقدروا تنورنا ....<br />مش حاسكت<br />http://mesh7askot.blogspot.com/"
