[[comments]]
order = 0
subject = "عشان انت مصرى"
text = "عشان انت مصرى<br />عشان انت مصرى لازم تعانى<br />وتفقد كرامتك بكل المعانى<br />وتحرق فى دمك سنين مش ثوانى<br />واوعى تصدق كلام الاغانى<br />بتاع الحضاره وكانى ومانى<br />ده كله هجايص مايدخل ودانى<br />عشان انت مصرى العذاب بيناديك<br />بتبدا فى يومك حاجات بترازيك<br />فى نومك فى قومك تعكنن عليك<br />تضايقك ولسه العماص فى عينيك<br />مافيش ميه تشطف صابونه فى ايديك<br />وجسمك ملزق وريحتك عاديك<br />فتلبس وتنزل وفيك اللى فيك<br />ورايح لشغلك حتحتاج مواصله<br />ادى المترو واقف وكهربته فاصله<br />وفى الميكروباص خناقه وحاصله<br />اوتوبيس فرامله عايزالها وصله<br />وتوك توك ده تايه ومحتاج لبوصله<br />بتوصل لشغلك بدم اتحرق<br />فى زحمه وكتمه وحر وعرق<br />رئيسك سايبلك كومه ورق<br />ده غير دمغه ضايعه وملف اتسرق<br />وفى كام مواطن عامللك قلق<br />بيشكى تقول له روح اندعق<br />وعركه وهوجه وشاى اندلق<br />ومخك خلاص من الصداع اتفلق<br />هترجع لبيتك ده لو كان فى بيت<br />هتوصل هتندم ياريتك ماجيت<br />مراتك بتصرخ خلاص استويت<br />عيالك بتطلب وهات كيت وكيت<br />تزعق تهاتى ياناس اتهريت<br />ولاحد سامعك مهما هاتيت<br />عشان انت مصرى وده للاسف<br />فلازم تاسى تعيش تتقرف<br />وكل الاساسى فى حياتك ترف<br />فتنسى الكرامه وتنسى الشرف<br />وتسرق وتنصب او تنحرف<br />ودمعك بيجرى وجرحك نزف<br />مش انت اللى مصرى؟؟؟ جتك القرف"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043937/http://masr.20at.com:80/newArticle.php?sid=14097"

[[comments]]
