[[comments]]
order = 7
subject = "بجد يا جماعة تعالوا ننسى"
author = "بجد يا جماعة تعالوا ننسى"
text = "رغم ان القصيدة عجباني جدا لشاعرنا الكبير احمد فؤاد نجم لكن بجد تعالوا ننسى مشاعر القرف و نحاول نرجع نحبها تاني و البلد دي احسن من غيرها بس لو فكرنا نطورها كشباب منستناش اللى يطورها و بجد لازم نستغل اليوم الى في حب مصر و كل واحد عندة حل لمشكلة يقولها يمكن نلاقي حل<br />و متنساش اغنية مشربتش من نيلها ..طب فكرت تغنيلها"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043937/http://masr.20at.com:80/newArticle.php?sid=14097"

[[comments]]
