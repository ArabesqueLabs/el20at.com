subject = "كُتَّاب عصري لتحفيظ القرآن الكريم"
text = "سعت \"قناة الحافظ\" بتوظيف التكنولوجيا الحديثة لحفظ القرآن الكريم وتعليم التجويد والقراءات، بما يوفر الجهد والوقت على الحفظة والمحفظين، وقد اتخذت القناة من الوسطية والاعتدال منهجًا لخدمة كتاب الله، وترسيخ مبادئه، ليكون منهجًا وسلوكًا لمشاهديها اقتداءً بالرسول الكريم"
archived = "2008-02-07"
capture_url = "https://web.archive.org/web/20080207043937/http://masr.20at.com:80/newArticle.php?sid=14097"

