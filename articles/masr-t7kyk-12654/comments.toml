text = "هو النظام المصرى معلموش شعارة السرمدى الابدى لا ارى لا اسمع لا اتكلم<br />وانة علشان ياكل عيش لازم ما لوش دعوة باى حاجة والا يرجع يقعد جنب امة<br />متنفعش الفرعنة فى بلاد الغير<br />ومحدش يقول لى عرب<br />فالعرب لا يحتقرون فى الجنسيات العربية غير المصرى<br />ودى حقيقة مرة اوصلنا اليها رجال السياسة بتوع بلدنا ولاد الوسخة"
