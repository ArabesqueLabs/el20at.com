subject = "فلسطين لاتسألي أين العرب"
author = "مصري"
posted = "2008-01-28"
text = "فلسطين لا تسألي أين العرب فكلهم قد احترفوا الهرب<br />كلهم قد ذهبوا إلى جحورهم وناموا و تركوك بين الدخان واللهب<br />فلسطين لا تصدقي عهودنا فعهودنا بهتان وصدقنا كذب<br />فما زال بيننا عرق من أبي لهب فلسطين لا تسألي أين الرجال<br />فرجالنا نساء والقتال ليس على البال هي كلمت حق أقولها<br />ما همني بعدها لا موت ولا اعتقال لو كان بهم رجل واحد<br />لشذ سيفه وشحذ أسنانه وجاء لفلسطين للقتال<br />لكنهم كلهم أشباه رجال أسماء رجال<br />أما أنت يافلسطين أطفالك أبطال<br />شامخون كالجبال شامخون كالمآذن<br />في وسط العواصف والرياح يحملون على أكتافهم أكفانهم<br />ما همهم لا موت ولا جراح فلسطين..<br />كلهم باسوا الأحذية و الأيادي كلهم يقامرون على شرف بلادي<br />كلهم صم بكم لم يسمعو نداء الجهاد<br />فلسطين يا حبيبتي ويا أغلى قدس<br />إسرائيل أفعى بخمسين ألف رأس وأنا لا املك إلاّ خمسة أصابع وهذا الفأس<br />محمد أبو زيد"
archived = "2010-03-14"
