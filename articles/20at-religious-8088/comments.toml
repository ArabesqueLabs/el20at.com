subject = "قصيدة للشاعر فاروق جويدة"
author = "مصري"
posted = "2008-01-28"
text = "هل في الأرض ناس كالعرب؟<br />مـــن قــال إن الـعـار يـمـحوه الـغضب<br />وأمـامـنـا عـــرض الـصـبـايا يغتـصب<br />صـــور الـصـبـايا الـعـاريـات تـفـجرت<br />بــيـن الـعـيـون نــزيـف دم مـــن لــهـب<br />عـــار عــلـى الـتـاريـخ كــيـف تـخـونـه<br />هـمـم الـرجـال ويـسـتباح لـمـن سـلـب؟‏!‏<br />عـــار عـلـى الأوطــان كـيـف يـسـودها<br />خــزي الـرجـال وبـطش جـلاد كـذب؟‏!‏<br />الــخـيـل مــاتـت‏..‏ والــذئـاب تـوحـشـت<br />تـيـجـانناعـــار‏..‏ وسـيـف مــن خـشـب<br />الـعــار أن يـــقـع الـرجال فـريـسة لـلعجز‏<br />مـن خـان الـشعوب‏..‏ ومن نهب<br />لا تـسـألـوا الأيـــام عــن مــاض ذهــب<br />فــالأمـس ولـــى،‏والـبـقـاء لـمـن غـلـب<br />مــــا عـــاد يــجـدي أن نــقـول بـأنـنـا‏..‏<br />أهــل الـمـروءة‏..‏ والـشهامة‏..‏ والـحسب<br />مــــا عـــاد يــجـدي أن نــقـول بـأنـنـا‏..‏<br />خــيـر الـــورى ديـنـا‏..‏ وأنـقـاهم نـسـب<br />ولــتـنـظـروا مـــــاذا يـــــراد لأرضــنــا<br />صــارت كـغـانية تـضـاجع مــن رغـب<br />حــتــى رعـــاع الأرض فـــوق تـرابـنـا<br />والـكـل فــي صـمت تـواطأ‏..‏ أو شـجب<br />الــنـاس تــسـأل‏:‏ أيــن كـهـان الـعـرب؟‏!‏<br />مـاتوا‏..‏تـلاشوا‏.‏ لا نـرى غـير الـعجب<br />ولــتـركـعـوا خـــزيــا أمـــــام نــسـائـكـم<br />لا تـسـألوا الأطـفـال عــن نـسب‏..‏ وأب<br />لا تـعـجـبوا إن صـــاح فـــي أرحـامـكم<br />يــومــا مــــن الأيـــام ذئـــب مـغـتـصب<br />عــــرض الـصـبـايا والــذئـاب تـحـيـطه<br />فـصـل الـخـتام لأمــة تـدعـي‏’‏ الـعـرب‏’‏<br />عرب‏ وهل في الأرض ناس كالعرب؟‏!<br />‏بـطـش‏.‏ وطـغـيان‏..‏ ووجــه أبــي لـهـب<br />هــــذا هــــو الـتـاريـخ‏..‏ شــعـب جــائـع<br />وفـحـيح عـاهـرة‏..‏ وقـصـر مــن ذهـب<br />هــــذا هــــو الــتـاريـخ‏..‏ جــــلاد أتــــي<br />يـتـسـلـم الـمـفـتـاح مــــن وغـــد ذهـــب<br />هـــــذا هـــــو الــتـاريـخ لــــص قــاتــل<br />يـهـب الـحـياة‏..‏ وقــد يـضن بـما وهـب<br />مــــا بــيــن خـنـزيـر يـضـاجـع قـدسـنـا<br />ومـغـامـر يـحـصـي غـنـائـم مـــا سـلـب<br />شـــــارون يــقـتـحـم الـخـلـيـل ورأســــه<br />يـلـقـي عــلـي بــغـداد سـيـلا مــن لـهـب<br />ويـــطــل هـــولاكــو عـــلــي أطــلالـهـا<br />يـنـعـي الـمـساجد‏..‏ والـمـآذن‏..‏ والـكـتب<br />كــبـر الــمـزاد‏..‏ وفـــي الـمـزاد قـوافـل<br />لــلـرقـص حــيـنـا‏..‏ لـلـبـغـايا‏.‏ لـلـطـرب<br />يــنــهــار تـــاريـــخ‏..‏ وتــســقـط أمـــــة<br />وبـــكــل قــافــلـةعــمــيـل‏..‏ أو ذنــــب<br />ســـــوق كــبـيـر لـلـشـعـوب‏..‏ وحــولــه<br />يـتـفـاخـرالـكـهـان مـــن مـنـهـم كــسـب<br />جـــاءوا إلــى بـغـداد‏..‏ قـالـوا أجـدبـت‏..‏<br />أشـجـارها شـاخت‏..‏ ومـات بـها الـعنب<br />قــــد زيــفــوا تــاجـا رخـيـصـا مـبـهـرا<br />’‏ حــريـةالإنـسـان‏’..‏ أغـلـى مــا أحــب<br />خــرجــت ثـعـابـيـن‏..‏ وفــاحـت جـيـفـة<br />عــهـر قــديـم فــي الـحـضارة يـحـتجب<br />وأفــاقـت الـدنـيـا عــلـي وجـــه الــردى<br />ونــهـايـة الــحـلـم الـمـضـيء الـمـرتـقب<br />صـلبوا الـحضارة فـوق نـعش شـذوذهم<br />يــا لـيـت شـيـئا غـيـرهــذا قــد صـلـب<br />هــي خـدعـة سـقـطت‏..‏ وفــي أشـلائـها<br />سـرقـت سـنين الـعمر زهـوا‏ أو صـخب<br />حـــريـــة الإنـــســـان غـــايــة حــلـمـنـا<br />لا تـطـلـبـوها مــــن ســفـيـه مـغـتـصـب<br />هـــي تـــاج هـــذا الـكـون حـيـن يـزفـها<br />دم الـشـعـوب لـمـن أحـب‏..‏ومـن طـلـب<br />شــمـس الـحـضـارة أعـلـنت عـصـيانها<br />وضـميرها الـمهزوم فـي صـمت غرب<br />بــغــداد تــســأل‏..‏ والــذئــاب تـحـيـطها<br />مـــن كــل فــج‏.‏ أيــن كـهـان الـعـرب؟‏!<br />‏وهــنــاك طــفــل فــــي ثــراهـا ســاجـد<br />مــازال يـسأل كـيف مـات بـلا سـبب؟‏!<br />‏كــهــانـنـا نـــامـــوا عـــلــى أوهــامــهـم<br />لـيـل وخـمـرفــي مـضـاجع مــن ذهـب<br />بــيـن الـقـصـور يــفـوح عــطـر فـــادح<br />وعـلي الأرائـك ألـف سـيف مـن حطب<br />وعــلـى الـمـدى تـقـف الـشـعوب كـأنـها<br />وهـــم مـــن الأوهــام‏..‏ أو عـهـد كــذب<br />فــــوق الــفــرات يــطــل فــجــر قـــادم<br />وأمــــام دجــلـة طــيـف حــلـم يـقـتـرب<br />وعـلـى الـمـشارف سـرب نـخل صـامد<br />يـروي الـحكاية مـن تـأمرك‏..‏أو هـرب<br />هــــذي الــبــلاد بــلادنــا مــهـمـا نـــأت<br />وتــغــربـت فــيـنـا دمــــاء‏..‏ أو نــســب<br />يــــا كــــل عـصـفـور تــغـرب كــارهـا<br />ســتـعـود بــالأمــل الـبـعـيـد الـمـغـتـرب<br />هــــذي الــذئـاب تــبـول فـــوق تـرابـنـا<br />ونـخـيـلنا الـمـقهور فــي حــزن صـلـب<br />مـــوتـــوا فـــــداء الأرض إن نـخـيـلـهـا<br />فــــوق الـشـواطـئ كــالأرامـل يـنـتـحب<br />ولـتـجـعـلـوا ســعــف الـنـخـيـل قــنـابـلا<br />وثــمــارهــا الــثــكـلـى عــنـاقـيـد اللهب<br />فــغــدا ســيـهـدأ كــــل شــــيء بــعـدمـا<br />يـــروي لـنـاالـتـاريخ قـصـة مــا كـتـب<br />وعــلـي الــمـدى يــبـدو شــعـاع خـافـت<br />يـنـساب عـنـد الـفجر‏..‏ يـخترق الـسحب<br />ويــظــل يــعـلـو فــــوق كــــل سـحـابـة<br />وجــه الـشـهيد يـطل مـن خـلف الـشهب<br />ويــصــيـح فــيـنـا‏:‏ كــــل أرض حــــرة<br />يـــأبــي ثــراهــا أن يــلـيـن لـمـغـتـصب<br />مــــا عـــاد يـكـفـي أن تــثـور شـعـوبـنا<br />غـضبا‏..‏ فـلن يجدي مع العجز الغضب<br />لــــن تــرجــع الأيــــام تـاريـخـا ذهـــب<br />ومــــن الـمـهـانـة أن نـقـاتـل بـالـخـطب<br />هـــــذي خــنـادقـنـا‏..‏ وتـــلــك خـيـولـنـا<br />عـــودواإلـيـهـا فــالأمـان لــمـن غــلـب<br />مـــــــا عـــــــاد يــكــفـيـنـا الـــغــضــب<br />مـــــــاعـــــــاد يــكــفـيـنـا الـــغــضــب<br />قصيدة للشاعر/ فاروق جويدة"
