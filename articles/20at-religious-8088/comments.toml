subject = "الله يحييك ياخوي يا مصري على هذا التعليق"
author = "فلسطيني اصيل"
posted = "2008-06-13"
text = "يسلمو اخوي المصري على هذا التعليق وارض الكانانه ان اشاء الله فيها الخير لفلسطين وللامه الى يوم القيامة<br />ولن يركع الشباب المصري امام الطواغيت ولا غيرهم<br />بل يدا بيد مع اخوانهم الفلسطينيين نحو التحرر من كافة اشكال الظلم والحتلال والطغين<br />وتحياتي للشعب المصري الابي"
