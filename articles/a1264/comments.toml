[[comments]]
order = 6
subject = "أبحث عن وطن بديل"
author = "عادل شاكر عضو حزب وطنى"
posted = "2008-04-08"
text = "أبحث عن وطنٍ يؤوينى ... أبحث عن ضوءٍ لعيونى<br />أقرأ خارطة الأوطـان ... لاأجد طـريقــــاً دلونـى<br />أرضى تلفظنى بجـفاءٍ... بيتـى لا يشـعر بحنينى<br />أهلى فى وادِ الأفـراح... وأنا مشـتعلا بظنــونى<br />أدرى لو أدرى لأنحلت... عقدة أيـــامى وسنينى<br />أقتات لأنضو أسـقاما... ذبلت أقلامى وجفــونى<br />جهزت حقائب أسفارى...ونشرت شراعاً لسـفينى<br />أنتظر ريـاحاً تملؤها... كى أبحـرنحـوك ضمينى<br />ياأرضاً تقت لرؤياها ... طرقاتك بـعض شـرايينى<br />فى ساحةِ قلبى يتقافز.. ويغـرد بالعشــق قرينى<br />والحفل السامر قنديلاً...ودفــوف أكـف محبينى<br />أنهارك ياوطنى حلماً... بالفيض تـزيد فتـغنينى<br />وسماؤك تقطر أمطارا..ديما وسـلاماً يحمــينى<br />لا أطلب أكثر لاأطمع...فسعادة يومٍ تكـــفينى<br />أطفأت سراجك ياوطناً..قد حانت لحظة تكـفينى<br />عادل شاكر"
archived = "2010-03-14"
capture_url = ""

