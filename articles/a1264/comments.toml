[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-04-08"
text = "حزبٌ وطنىٌ أم حزناً وطنياً عام<br />يرفل بالعز ومضبطةً تمحو الآثام<br />ما قال سرور صفقنا وأبتسم جمال<br />الشعب يموت بلا جدوى فالنائب نام<br />البلد تموت وقاتلها بائع أوهام<br />وجموعاً تصرخ من شدة وطء الأقدام<br />النهر يباع وتقريباً باعوا الأهرام<br />الشارى ديفيد بوكالة مولانا سام<br />ياوطناً يسكن أعطافى إنى إنسان<br />يحيا بهوامش دفتره يقتات حطام<br />عدلاً أرجوه بلا ظلمٍ وبدون هوان<br />وأرى أولادى من حولى خيراً وسلام"
