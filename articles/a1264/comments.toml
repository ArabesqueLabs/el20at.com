[[comments]]
order = 9
subject = "الحزب الوثنى الديموقراطى"
author = "حساااااااااااااااااااام"
posted = "2008-10-23"
text = "الحزب الوطنى الديموقراطى عايز كل الناس تطاطى واحنا كرهنا الصوت الواطى لا لا مش حنطاطى<br />الحزب الوطنى هما الى سارقين البلد عندى فى ديرتى الى بينجح كل سنة بتوع الحزب الوطنى ومبنشوفهمشى الا فى الدورة الى بعديها فالحمد لله الديرة دى نجح واحد من ناس مكنتش بحبهم اسمهم اخوان مسلمين (وعلى فكرة مطلعوش ارهابين) والنائب بتاعهم عامل مكتب فخم جميل للعايز يقابلة وعندة مشكلة مش كدة وبس دة انتا لما تدخل حتلاقى لوحة اعلانات لزظائف خالية مش كدة وبس دة عملنا مراجعات فى الثانوية العامة لافضل المدرسين والمدرسين مش اخوان بل افضل مدرسين ومش كدة وبس دة غير القوافل الطبية المجانية الى كانت بتعدى على القرى وغير حملات نظافة الشوارع الى عمرها محصلت بالاتقان دة على ايد الاخوان وحجاااااااااات تانية كتيييييييييييييييييييييير قولى بقى على اى حاجة عملها الحزب الوطنى لينا قبل كدة الحزب الوطنى خيرة لاعضائة بس ويا رب يظهر الحق ونخلص من ام الظلم الى علينا دة وعلى فكرة انا معرفتش ادى صوتى فى انتخابات مجلس الشعب الى فات لانى مش حزب وطنى"
archived = "2010-03-14"
capture_url = ""
