subject = "هما عيزين كده"
author = "الليجر"
text = "هما عيزين كده عيزين الناس تخف شويه اصل السكان هيكلو اكل الا غنيه خيفين على نفسهم من الجوع ههههههههههههههههه وبعدين داهما لو عيذين يعملو كل خمسه متر نفا هيعملوهم فى اال من شهر حتى بس هيا المسالاا كده ذى مانا اولة"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090622/http://masr.20at.com:80/newArticle.php?sid=17304"
