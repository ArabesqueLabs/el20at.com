[[comments]]
order = 0
subject = "انفاق مين - انتم بتحلموا"
author = "عبد الجبار"
text = "يا عزيزى انفاق اية - الدولة بتتسول علشان تدفع المرتبات وانت شايف بيعملوا اية فى المدرسين علشان الكادر - معندهمش فلوس يدفعوا والخزينة فاضية واللى انباع انباع وفلوسة سافرت على بنوك سويسرا<br />انفاق اية ومشاريع اية - علشان الناس بتموت وهى بتعدى الشارع - ما يموتوا يا اخى عندنا كتير<br />مفيش فلوس<br />الفلوس اللى جاية على قد الامن المركزى ومباحث امن الدولة<br />فية ضباط امن دولة الواحد بيتدرب بمليون دولار - بيروح سفرية فى امريكا يتعلم الضرب الخاطف يعنى اطلاق المسدس اسرع من الخصم وبدون تنشين واصابة مؤكدة وبعدين يبعتوة اليابان يتدرب على الكارتية والجودو ويصرف الشىء الفلانى<br />وبعدين يرجع يشتغل حراسة لوزير لشخصية مهمة زى احمد عز او جمال مبارك وبعدين يتقاعد يشتغل عند رجل اعمال زى هشام مصطفى يبعتة يقتل فلانة وفلانة وفلانة<br />الفلوس تنصرف هنا كويس<br />انما انفاق - يبقى اية الغم دة"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826090622/http://masr.20at.com:80/newArticle.php?sid=17304"

