[[comments]]
order = 2
subject = "يا ساتر يا رب على النفاق و التملق"
author = "متابع يتعجب"
posted = "2008-10-06"
text = "وصل النفاق و التملق إلى هذا الحد. هذا المهرج الذي يدعي أنه محامي ناقص يقول إن البلوى اللي كابسة على أنفاسنايبق نبى و رسول كمان. للعلم الجاهل ده لازم يفهم إن الإسلام ما يعرفش لا قديس ولا غيره دا من إختصاص راتزينجر بطريك روما. ما فيش عندنا غير المولى عز و جل اللي من أسمائه القدوس حتي خاتم الأنبياد صلي الله عليه و سلم لا إسمه مقدس و لا هو مقدس فالجاهل الكافر ده يروح يستغفر ربنا على ما فعله. ا مبارك حينفعه و لاسرور و لا نظيف يوم الحساب. و إزاي المحكمة الموقرة تسيب الكلام ده يعدي من غير تأنيب الحصان ده؟ و فين الأزهر و مطبلاتيه وفين القرضاوي و الغزو الشيعي( أنا مش شيعي) يجي يشوف السنه بتوعه بيقولوا إيه. أعوذ بالله من الكفر و الرياد."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الى الكذاب والدجال زخاري والمنافق والغبي"
author = "مباحث اسكندرية"
posted = "2008-10-06"
text = "يا غبي سيب الاساتذة تتكلم يا غبي يا مهزأ يا حقير<br />جبت الشتيمة والاهانة لجدك زخاري<br />مبارك والعادلي وطنطاوي ما فيش حد فيهم عايز يبص في وشك وجبتلك الادلة قبل كده<br />عايز ايه تاني<br />وفيها ايه يعني لما مبارك بالعربي تبقى باراك بالعبرية ايه المشكلة<br />طيب ما هي يوسف بالعربي يعني جوزيف بالعبرية<br />ايه المشكلة يعني بتدخل زي الجيص ليه كده عامل نفسك فله وعامل نفسك ابو العريف<br />وانت حماااااااااااااااااااااااااااااااااار وكشفت نفسك واللي بيتفرج على زكريا بطرس ما بيحبش مبارك ولا اي حاجه خالص"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "(مباحث الاسكندرية) طظظظظظظظظظظظظظظظظظظظظظظظظظ فيك"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-06"
text = "خليك كدة زى الكلب انبح للصبح؟<br />و حياة الغالى عندك يا واطى قولى اسم امك و عنوانها اية؟علشان اروح ليها و ابوسها بس؟موش هعمل حاجة و حشة قبيحة معاها و اقسم لك؟<br />و حياة امك ابقى (ركب ليها عداد ركوب؟!!!) بعدين مباحث الاداب و المرور بلاسكندرية يمسكوها؟هااهااااااااهاااااااااااااااااااااااااااا<br />هى اجرة امك اليومين دول بقت باية؟(اليورو و لا الدينار و لا الريال و الدولار و لا الشيكل؟)اكيد امك تخصص يهود من العبيد بتوع الفلاشا السود؟<br />ما هى تخصص(شرم الشيخ) يا بارم شنب طيزك (الحمرا) يا خول يا شرموط يا حقير يا بطيخة يا شيليان ياقرع بلا سكين!!!!<br />اتفو عليك و على امك!!!!!!!!<br />بوسهالى يا ننوس عين(مباحث الاسكندرية)"
archived = "2010-03-14"
capture_url = ""

