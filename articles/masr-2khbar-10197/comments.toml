text = "أنا أفتكرت أنى دخلت خرابة بالغلط. أيه السفالة والسوقية اللى بنقرأها دى. واحد حيوان( مع الأعتذار لكل الحيوانات) ويبدوا أنه موظف فى الحزب الواطى الغير ديمقراطى بدأ فى التعليق بسفالة متناهية فى مرة سابقة والظاهر أن حكاية الشتيمة دى عجبته وللأسف فى بعض المعلقين وقعوا فى الفخ ونسوا الموضوع الرئيسى (كما أراد لهم) ومشوا على نفس المنوال. فرجاء من الأخوة المحترمين أنهم يسيبوا هذا .... الغير محترم فى برميل ال.... اللى هو بيقبض منه. .. ورجاء من الأخوة عدم التجريح فى الأخوة المسيحيين لأنهم أخواننا وأصدقائنا... يللا ياحيوان أبدأ"
