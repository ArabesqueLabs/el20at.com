[[comments]]
order = 9
subject = "موش عارف انتم لية(بتحقدوا على مبارك و الحزب الوطنى"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-07"
text = "الى جميع المناظرين !!!<br />ممكن سؤال باللة عليكم؟<br />لية انتم موتورين من (مبارك) و (الحزب الوطنى) و (المسحيين) و رجال الدين (المسيحى) و رموزة؟<br />هم و العياز باللة كانوا عملوا حاجة و حشة ليكم و لا اية الحكاية بالضبط؟<br />لو كان عبد الناصر (رحمة اللة)على قيد الحياة!<br />هل كان منكم اى رجل يعتقد انة من الشجاعة ان يهاجم الجميع هكذا زى الكلاب المسعورة؟!!!<br />أشك و لا اعتقد؟!!!<br />معلش (ديمقراطية مبارك)ياولاد الكلب جعلتكم تتطاولوا و تسبوا و تتكلموا كيفما تشائون؟<br />نصيحة لوحهة اللة تعالى(هوهوا ياكلاب للصبح هو هو هو هو هو هو هو)<br />صحيح الكلاب هتفضل طول عمرها كلاب؟<br />(موش كدة و لا اية)!!!!<br />مع الاعتذار للفنان(فؤاد المهندس)رحمة اللة<br />و السلام ختام يا كلاب يا ولاد الكلاب<br />و بوسولى مرشدكم(مهدية عاكفة) على الحقدو الشر و الجهل<br />و باى باى باى باى يا قبيح الشكل و اسود القلب و غبى الفهم و اعمى النظر و متغيبين العقل<br />و سلمولى على ماما امريكا و بابا اسرائيل<br />و موتوا من الغيظ نحن على قلوبكم حتى قيام الساعة؟<br />حتى و لو كرهتم يا جهلة يا مشركين؟!!!<br />(كم من فئة قليلة غلبت فئة كثيرة باذن اللة)<br />و انبحوا يا ولاد الستين و سخة يا كلاب يا مسعورة<br />و(شالوم) (شالوم) (شالوم)<br />و(انتهى الدرس يا ابن الغبى) سلام بلا ختام<br />وبرضة احنا بنحب(مصر)يابن (العرص)<br />اكتر منكم لانها هى و طننا الحقيقى و ليس و طننا المغتصب بحد السيف!!!<br />شالوم"
archived = "2010-03-14"
capture_url = ""

