[[comments]]
order = 2
subject = "علقة لكل مطحون"
author = "عكاوى"
posted = "2008-11-25"
text = "علقة سخنة تيك اواى لكل مطحون فى اقرب قسم شرطة<br />قسم البونيات والشلاليت والتلطيش على القفا يقدم خدماتة بمناسبة العيد<br />نوصل خدماتنا للمنازل<br />تم قتل اربعة مصريين برصاص الشرطة فى 3 ايام<br />خدماتنا وصلت لاسوان فقد ارحنا مواطنا بطلقة فى راسة تحت بند الموت الرحيم"
archived = "2010-03-14"
capture_url = ""
