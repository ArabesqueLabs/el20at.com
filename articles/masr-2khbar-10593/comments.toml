[[comments]]
order = 0
subject = "الموكوس فى بلاد الفلوس"
author = "صديق السعدنى"
posted = "2008-11-24"
text = "فية كتاب رائع لعمنا الكاتب الساخر محمود السعدنى اسمة الموكوس فى بلاد الفلوس<br />ويظهر ان الجروب دة يائس على الاخر<br />زعلانين علشان البلد انباعت وبتنباع<br />كلة هيرجع تانى<br />هيطلع واحد صعيدى شارب من بز امة زى عبد الناصر ويرجع حقوق الناس دى تانى<br />ولسة فى الجراب يا حاوى<br />يا خويا جاتكوا وكسة"
archived = "2010-03-14"
