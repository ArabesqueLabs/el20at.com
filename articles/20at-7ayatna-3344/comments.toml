text = "انا من رايي ان لا يقعن البنات في الحب لان كله اوهام ووجع راس لان الحب الحقيقي هو ياتي بعد الزواج وان الشباب ياتون هلبنات تسلية واتحدى مو لو كل ساعه مع وحدة ما يكو ن اسمي لولو<br />لان اذا كنت متزينة ناظرولك الشباب مو بس لوحدك<br />ويضحكون عليك ويرمولك الرقم هنا ياتي ذكاء البنات اذا كنت ذكية فعلا ما تاخذينة او تاخذينة وبعدين تشقينة عشان ايفكون عنك<br />طيب؟<br />ابسالكم سأل؟؟!!!!!!<br />الحين اذا واحد شافك حلوه وعطك الرقم متاكدة اذاشاف وحدة ثانية زينة غرك ما يناظرها او يغمز لها او يعطيها الرقم او يسويلها اي حركه نصيحة مني لا تخلون الشباب يقصون علكم<br />احنا يا بنات اذكى من الشباب<br />والشباب ما في اغبى منهم<br />يلى طولت عليكم<br />بايييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييي"
