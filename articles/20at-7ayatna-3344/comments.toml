text = "حبيبـــــــــــــــــــــــــــــــــــــــى.........<br />تذكر معى حينما اسميتك بدر السماء...<br />واسميتنى وردة الصباح....<br />ولى ان اقول اسفة<br />لا استطيع ان احرم غرامى من حبك...<br />لا استطيع.....<br />ان احرم عيناى من رؤيتك...<br />لا استطيع.....<br />ان احرم يدى من لمس يديك...<br />لا استطيع.....<br />ان اخدع نفسى واقول لا احبك...<br />لا استطيع ان اتجاهل احساسى المشتعل نحوك...<br />لا استطيع.....<br />ان احب واعشق غيرك...<br />اتعتقد سواك كاد لا اعتقد انا...<br />فكيف وانت قصر احلامى<br />وبدر زمانى<br />انت كلى وكيانى<br />انت نظر عيونى<br />لعيونك سوف اصبر<br />لا هقاسى ولا هعانى<br />لن اقول هنساك<br />ولكن هقول ستنسى حبك ؟<br />ستنسى من احببت ؟<br />اذا نسيت فانا لا انسى<br />هذا قدر من الله<br />فلن ازيد بخفوقى المعذبة<br />النهايــــــــــــــــــــــــــــــة<br />احبك بجنون ولكن احب غيرك لا<br />فأنا اعشقك بجنون<br />فارجو منك؟؟؟<br />مهما طال الفراق<br />لا تنسانـــــــــــــــــــــــــــــــــى"
