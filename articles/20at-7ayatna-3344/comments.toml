text = "بحبها جدا لدرجة اننى ل افكر الا فيها ولكننى لا أستطيع ان اعترف لها وما يؤلمنى هو انها تمشى امامى على استحياء وانا اعتقد انها تريد منى ان اكلمها وعندما اراها انظر اليها وهى تقف مع اصحابها وتنظر لى ايضا ومع كل هذا انا لست متاكد من حقيقة شعورها وهى فى الحقيقة تشغلنى ليل نهار واكون مثل المجنون فى البيت بعدما اراها ول استطيع الأعتراف اها وكتبت فيها قصائد كثيرة وانا شاعر جيد<br />شكيت الى معلمى الحديث واوضحت السبب فيما فتنى سقما واعياء<br />الفيت اليوم طارئــــــــــــــة فشعورى متوهج كحراقة الشمس فى الرمضاء<br />اياه..لو تعلمى من الشعور ما اخفى لماتركتنى فى الرمضاء مستاء<br />واخفائى شعورى ليس بطاقتى وانما لشعورى بين قضبان الحياء رثاء<br />ارجوكم ساعدونى كيف استطيع ان اتخلص من الخجل واصارحها"
