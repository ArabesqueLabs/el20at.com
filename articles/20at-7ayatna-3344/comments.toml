[[comments]]
order = 10
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-03-19"
text = "قصيدة * روض المحبة * من تاليفي /الطنطاوي الحسيني<br />روض المحبة\"<br />أبصرتها فارتشفت وقلبي ريحانا = شاهدتها روضة ولمحت أفنانا<br />أم جنة من جمال تهوى ساكنها=طيب النخيل بها قد حف رمانا<br />ما عدت انظر قد أغضيت من طرفي = خوفا من الآثم يمحو كل ما كانا<br />حارت من الصد فاحتدت تساءلني= ما لي أراك رميت الحب ظمأنا<br />هل أنت تهوى وقلبك في صبابته ؟= أم ان قلبك حجر راق أوثانا<br />عاجلتها أمهليني إنني أربٌُ= وقصتي أنني أريد إحسانا<br />أمني نفسي الهوى لكن بلا حجب = لا في الحرام آو الإثم الذي شانا<br />أمنيتي في الحل ألقى من أهوى= من قلبي الولهان يغرف منه تحنانا<br />فانفجر سيل الدمع من عينيها في عجل= هل أنت صدق الهوى في الحب ترعانا<br />جاوبتها يا درةً بالحب عامرةً= مهلا عليا ارهفي للحق آذانا<br />إنً الغواية لو حلت بعاطفةٍ= نجني هنا الخزي بل والأخرى نيرانا<br />يا نبتة الإسلام درب الحق ملحمة = راوحنا في فلكها البسام أزمانا<br />هيا أريدك ان تكوني سيدتي = لا عبدةً تعشقين الغيً أدرانا<br />ابغي جناك هوىً لكن بلا سرفٍ = نبني على شرعة الرحمن أركانا<br />كي تنجبي الأبناء يعشقون مكرمةً = ربيهمٌ بالروح يفتدون أوطانا<br />ولتغرسي بهم أصولَ الدينِ مخلصةً = كي يستقى البرعمٌ الريانٌ إيمانا<br />ولتحملي في الدرب كل معضلةٍ = ولترتدي الصبر و الإيمان قرأنا<br />يا مهجة القلب هذا ما نؤمله = من ذا الجمال نريد الخير هتانا<br />هذا هو الحب الحقيقي له هدف وغاية في الحياة<br />روض المحبة نوعٌ اسمه شرفٌ= بل عزةٌ ما لها إلا سجايانا<br />كوني ببتك بستانا لأبنائي = دنيا وفي الأخرى كوني ليا بستانا<br />كوني لحوري في الجنات سيدةً = ترضى الإله فيرضى عنا مولانا<br />إن نتخذ دروب الحقٍ معبرةً = هاكٍ العطايا والجنًات مثوانا"
archived = "2010-03-14"
capture_url = ""

