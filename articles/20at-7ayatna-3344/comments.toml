text = "ولو انت كنت كلمتنى كنت هتعرف انى مش انا وهى اوهو الله اعلم<br />ممكن اى حد يدخل باى اسم يعنى انا لو لاقيت حد داخل باسم نايت<br />اعرف ان انت واظن فيك ظن وحش لا طبعا عارف ليه لان مش انت<br />بس اللى عامل الاسم ده ولا انا اللى اسمى شمس بس ممكن اى حد<br />يكتب شمس لا تغيب صح ولا ايه ويعنى حتى لو كنت انا وانا<br />متاكدة انى مش انا اللى دخلت فى اسلوب احسن من كده مش تريقة<br />اقولك زى مانت قولت ماتديش لنفسك الفرصة انك تتكلمى معايا كده<br />اوبالاسلوب ده لا ياوائل انا مش كده ولا عمرى هقول لحد كده"
