text = "كان الحب بالنسبه لي شيء مجهول ماكنتش بصدق أي قصة حب أسمعها وكنت بقول هو فيه حد بيحب حد كدا؟؟ وكنت بستغرب لما واحد يكسر الدنيا علشان بيحب واحده وعايزها وكنت بقول هو معقول واحد عايز واحده قوي ولا كلام وخلاص كنت بقول هو فيه واحد بيخاف علي واحده قوي علشان بيحبها<br />لما بتتطلع كلمة بحبك من حد بيبقي حاسس بيها وإيه الطعم اللي بيحسه وياتري السعاده اللي بنشوفها علي وجوههم دي حقيقيه وياتري فيه واحد بيحب واحده علشانها هيه وعلشان بيحبها يستني طلباتها ويقولها تؤمري بس في حدود كرامته<br />الأن أنا بقولكم انا عرفت الجواب وبتذوق طعم الحب ول أول مره بكتب عن الحب وبقول إن الحب شيء جميل بيخلي الحياه حلوه وخصوصا إن حبيبي بيحبني أكتر من إني بحبه ببق سعيده إما بسمع منه كلمة بحبك بيبقي طعمها حلو وبحس إني طايره ببقي أسعد لما يرن عليه ويكون عايز يكلمني<br />أحلي الأوقات وأنا بقضيها معاه<br />وعايز أقولكم إنه حبني أكتر لإني غلبته لما قلتله كلمة بحبك فضلت ست شهور مش راضيه أقولها وجه لكن هو كان بيقولي وبيكتبلي<br />وجهه اليوم اللي كتبتله فيه إنت حبيبي في رساله<br />لكنننن انا بحبه لله وهو بيحبني في الله<br />هوعلمني إزاي أحبه ؟؟؟"
