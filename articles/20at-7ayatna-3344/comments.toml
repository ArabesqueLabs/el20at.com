text = "يابهاء انا اسفة انت المفروض باعتلى رد انى مش هاعرضك فيه لا معلش<br />دى وجهة نظرى بس اوعى تزعل منى<br />ليه انت بتقول انى مش هحب هو مش من حق كل انسان انه يحب<br />وبتقول انى باين من كلامى انى لسه بحبه<br />لا يابهاء واللهى انا مابحبه وعلى شان يعنى انا برفض اللى يتقدملى<br />لا واللهى ماعلى شان انى لسه بحبه<br />ويابهاء الناس دى كلها لو فضلت فاكرة حبها القديم عمرها ماهتحب خالص<br />بس انا بقى مش من الناس دى انا نسيته ونسيت حبه<br />وزى ما الناس بتقول<br />اللى فات مات<br />والماضى ده فات بس احسن حاجة انى ماشغلش بالى بيه<br />بس تعرف الشخص التانى اللى قابلته اسمه احمد وانا عرفت انه دايما بيسال عليا<br />تعرف انا بتكلم معاك ليه على شان مش لاقيه حد تانى اتكلم معاه<br />ونفسى اتكلم مع كل اللى فى الموقع ومع الناس كلها<br />ونفسى رحاب تدخل وترد عليا<br />واوعى تزعل يابهاء انى بعارض كلامك<br />بس تعرف انا زى مانت قلت عايزه احب غيره<br />وغيره ده موجود بس مش على شان بردوه الحب القديم<br />بوص اعتبر انى ماقولتيش حاجة عن الحب القديم ده خالص<br />لانه اتنسى خلاص<br />وبشكرك جدا يابهاء معلش بقى انا صدعتك<br />بس اعتبرنى زى اختك"
