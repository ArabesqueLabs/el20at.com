text = "ازيكم يا جماعه ازيك يا رحاب ازيك يا أيه الله على فكره منقدرش على زعلك وبعدين انا بدخل بس والله سعات الموقع مش بيفتح عندى<br />على فكره انا محتار اوى يا احمد وقريت كلامك كلمه كلمه وبعدين اللى كتب الكلام والشتيمه قال ان مش انتا وبرضو اعتذر انا عن نفسى سمحته سواك كان هو انتا او مش انتا بس فى حاجه كويسه اوى ممكن ترجع الايام القديمه اننا نقفل الصفحه دى ومنجبش سيره اللى حصل تانى ونتعامل مع بعض بما يرضى الله ونعامل ربنا فى كل كلامنا ومنقولش فلان وفلانه ولا قولنا وقال<br />انا عن نفسى والله بدخل علشان اطمن على كل اللى هنا لانى معتبرهم اخواتى وانتا يا احمد لو هتقفل الصفحه من دلوقت احنا اخوات<br />انا وانتا ورحاب وأيه الله ودارين وكل واحد حب يدخل الموقع ويحترم اللى فيه اكيد هنحترمه ويكون اخ جديد لينا …"
