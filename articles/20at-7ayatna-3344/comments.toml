author = "عيش حياتك مع غيرى"
posted = "2009-12-26"
text = "ادى اللى كان بيقول مفيش حد فى حنانة اخد اللى عايزو لما امن قلبى خانة اترية لاكان بيحبنى ولا ناوى خيرى كان قلبى طيب لما يوم صدق وعودو كدب عليا وبجرحة ليا اثبت وجودة ولاقتنى بخسر فى النهاية حاجات كتير حكايت وقت وتعدى ومش هتعب وانا لوحدى دنا هرتاح هعيد حساباتى وتغير ولونى فهمت متغير مابقتش انسبة ومش هحسيبة على اللى قالة ماهغلتط القلب من الاول نادالة اهى مرحلة وعدت وشوفت نصيبى اية انا مش هدمع لما كون واقف قصادو ولا عمرى ابدا هسالة الى استفادو دنا هبتسملة وهسلم علية"
