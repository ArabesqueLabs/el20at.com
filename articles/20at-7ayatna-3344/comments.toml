posted = "2009-07-25"
text = "العفو ياوائل بس احب ارد على كلامك ان حب الشات ممكن يكون حقيقة وينتهى بالزواج<br />والنجاح لاكن مش كل اللى بيدخلوا الشات بيحبو ممكن يكون حب اخوى او صداقة<br />وكل اللى فى الشات بيبقو عاوزين الايميل بتاع الواحدة على شان يتعرفو عليها اكتر<br />ليه مانت اتعرفت عليها من الشات قدام الناس كلها ليه عاوز الايميل بتاعها على شان<br />تتكلمو لوحدكو وفى ناس اعوذ بالله بتفتح الكاميرا عندها على شان تشوف بعض واكتر<br />لما تكون بنت وولد وممكن ياوائل الولد يعمل حركة فى البنت ماهى غلبانة بقى يكون<br />مثلا معاه موبايل وهو شايفها فى الايميل عنده بالكاميرا يروح واخد صورة ليها بالموبايل<br />بتاعه يبقى كده انتهت البنت لانه ممكن ياخد الصور يفبركها وينشرها على النت بس مش<br />كل الناس بتعمل كده اللهم احفظنا يعنى ياوائل ممكن 95 فى المائة اللى بيدخلو الشات<br />بيكون حبهم وهم ومحكوم عليه بالفشل لانها ممكن تكون كدابة او هو كداب ومش كل الناس<br />صريحة مع بعضها دول اللى مابيخافوش من الله عز وجل معلش انا خرجت عن الموضوع<br />كتير اوى بس انا بقول اللى انا حساه واللى فهماه بس فى النهاية اعتقد ان حب الشات وهم<br />ولا ينتهى بالزواج وشكرا على مواضيعك الحلوة ياوائل"
