posted = "2009-11-30"
text = "الى من هوتها روحى وغنى لها قلبى وبكت لها عيونى وشرد لها عقلى الى اجمل ماراتهة عينى من جمال وسحر ويذهب عقول من يشاهدوة بعينهم ويحسوة باجسادهم ويشعرون انة الخيال ............?<br />الخيال الذى ليس لة مثيل ..... عندما تنظر لة تشعر بانك تملك الدنيا بما فيها عندما تجلس معها تشعر بانك تجلس مع نساء العالم اجمع ....عندما تمتلكة بيديك تشعر بانك تمتلك ماليس لة مثيل فى الكون (تمتلك نساء العالم جميعهم ) ....فيها مايغريك فى التفاحة التى تتمنى ان تغرس فيها انيابك ....فيها من القطط ما يغريك ان تدعبها بيديك فتميل على ظهرها بدلال ورقة فيها ما لا فى مثلها من فتيات العالم (ليس مثلها لان ليس لها مثيل)<br />انتى الوحيدة التى لايمكن ان انسى ماراتة فى عينيك اول ما راتها عينيانتى الوحيدة التى حركت مشاعر من داخلى بقوة وبرغم كل الظروف التى بيننا.....انى احـــبـــــــــــــــــك .......احبــــــــك..احبـــــك بشدة احبك مثل حب الطير للطيران ...احبك مثل حب السجين للحرية .... احبك مثل حب الزهور للمياة من الاخر<br />احــــــــــــبـــــــــــك.....احبك وكم احبك ...احبك ...نفسى<br />اجد مايعبر عن مشاعرى ولاكن لااجد كلمة اكبر من"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

