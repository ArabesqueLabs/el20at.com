text = "على فكرة ياوائل واللهى العظيم ولا من غير حلفان انى انا واثقة فى نفسى اكتر من اى حد<br />وانا مابحبش الكدب انا مادخلتش الشات من ساعة اخر مرة لما قلتلك هدخل وانت لاقيت اسمى والنت فصل وانا واللهى العظيم مابدخل اى شات ولا بكلم حد غيرك ولو مش مصدق<br />مش مهم عارف ليه ؟؟؟ لان ربنا معايا وشاهد وشايف ان انا مادخلتش الشات ولا مرة<br />ده حتى زمان اول ماتعرفت عليك كنت ساعات بكتب او بدخل باسم شمس اوشمس لاتغيب<br />كانت بتطلع بتاعة بتقول غير الاسم على شان فى حد داخل بالاسم ده فكنت بغيره وساعات<br />كنت بدخل باسم sun وكل الكلام ده كان من زمان اوى وبعدين انا لو بدخل الشات زى<br />مانت بتقول كنت هدخل هنا فى الموقع ده واكتبلك لاكن ده انا بقعد بالشهر اواقل مابدخلش<br />هنا يبقى هدخل الشات واكلم اللى انا معرفهمش واضيع وقتى معاهم وعلى فكرة انا لو كنت<br />دخلت الشات انت عارف انى انا بقولك انى دخلت الشات وانا اصلا مابدخلش غير لما بقولك<br />على شان اكلمك صح ولا لا ولو مش عاوز تصدق ماتصدقش براحتك"
