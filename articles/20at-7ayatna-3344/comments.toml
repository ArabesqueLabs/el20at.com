text = "اسكنتك روحا بصدري...و خبأتك طفلا بين اجنحتي و جوارحي<br />يهتز كياني اذا ما سمعتك تبكي<br />زرعتك بلحظات عمري...بثوانيها و ساعاتها...و تفاصيل لياليها الدامسة...<br />غرست غلاك في وريدي ...في شراييني...و في دمي...<br />كم اشتقت اليك ...بكل ذرة من جسدي...و مع كل تنهيدة في رئتي...<br />كم اشتقت الى لمس حبة حنان من كفك....و قطف حبة عطف من جنانك<br />كم اشتقت الى مداعبة ملامح وجهك...و ملاعبة خصلات شعرك...<br />كم اشتقت ان اخطفك من الوجود...و اعصرك في زجاجة عطري الملائكي...<br />حتى اتنفسك دائما بمسامات جسدي و جزيئات حواسي..<br />اتيتك عروسا بفستان ابيض لؤلئي ...بيميني باقة ورد من الياقوت و الزمرد...و بيساري الشمس و القمر<br />و على رأسي طرحة خجولة...تتراقص عشقا و هياما....و جلست كالأميرة انتظرك على احر من الجمر"
