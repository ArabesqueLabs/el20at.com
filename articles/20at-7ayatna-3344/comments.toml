text = "ايه ياوائل مالك حزين اوى كده مش عارف تحب ولا مش لاقى اللى يحبك<br />كل واحد ياوائل بياخد نصيبة واوعى تزعل على اى حاجة فى الدنيا<br />وليه صعب ان تختار من تحب<br />وليه تكره من كنت تحب وانت بتحبه<br />وليه صعب ان تقع فى الحب فى الزمن الخاطئ<br />وانت تقدر تخلى الزمن جميل ومناسب لك<br />معلش ياوائل ياريت ترد بس على اسألتى وبعدين انا برد عليك<br />فى كل موضوع بتكتبه وانت بتقول انا هرد على تعليق كل واحد<br />وانا بصراحة مش شايفة انك بترد على تعليق اى حد ياريت من<br />فضلك ترد على تعاليقاتى ياوائل ان ماكنش هيضايقك"
