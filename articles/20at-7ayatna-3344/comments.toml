text = "ماانت برضوه المفروض اللى تفهمنى وبعدين يا وائل انا قلتلك مش انا للى كاتبة بحبك<br />يا احمد موت وانا قلتلك الكلام ده وقلتلك لما تدخل على الشات انا هفهمك وبعدين<br />انا بقول مبروك لان انت ووعد بتتكلمو هنا على الموقع ده بلكتابة يعنى زى اى حد<br />لكن هى عمالة تكتبلك كلام وشعر وحاجات حلوة وانت بتقول انا قررت واختارتك انتى<br />يبقى ده معناه ايه؟؟؟معناه انك بتحبها وعلى فكرة اتكلم براحتك بالاسلوب اللى انت<br />عاوزه معايا عارف ليه؟؟؟لان انت اسلوبك خلاص بقى كله عصبيه وكنت بتزعل<br />الاول لما انا كنت بكلمك باسلوب وحش وكل ماتكتبلى بتفضل تقوللى ماتكلميش بلاسلوب<br />ده معايا ده اسلوب سخرية وفاكر بردوه لما قلتلى ماتديش لنفسك الفرصة انك تتكلمى<br />معايا بلاسلوب ده فاكر ياوائل حتى لو ماكنتش فاكى عالعموم انا فكرتك...<br />ودية بردوه الواحد المفروض يزعل منها وارجع واقولك بردوه انت اللى غلطان انت<br />اللى المفروض كنت تفهمنى من الاول وبعدين المفروض ترد على كل كلمة بكتبهالك<br />مش تكتب على تعليق وتسيب اتنين ....عالعموم انا مسافرة مصر دلوقتى وراجعة يوم<br />الاثنين مع السلامة ياوائل واحب افكرك ان انا بتمنى الخير والسعادة لاى حد حتى لو<br />كان وحش"
