text = "انا برد على موضوع وائل بص ياوائل فى ناس احيانا بتكدب على شان تجمل من نفسها<br />يعنى مثلا واحد عنده عربية يقول انا عندى 3 عربيات على شان يجمل من نفسه ده<br />يعنى مش عارف كده انه بيكدب بس عارف ان مش هى دى الحقيقة وممكن لما حد<br />يقوله انه كداب يزعل لانه بيحسب انه كده مابيكدبش وعلى راى الناس دى كدبه<br />بيضه وعمر ماكان فى حاجة اصلا اسمها كدبه بيضه او كدبه سوده وعمر الكدب<br />ماكان بينفع صاحبة غير انه يبقى عاوز يجمل اكتر من نفسه<br />وبالنسبة لموضوع الشات هو مش حرام ياوائل يعنى انا وانت عارفين بعض من<br />الشات وعمرنا ماقولنا اى حاجة غلط وبنتكلم قدام الناس كلها وبنصلى فى وقت<br />الصلاة كده احنا بنستخدمه عادى مجرد تعارف لاكن فى ناس ربنا يكفينا شرهم<br />بيدخلو للاغراض السيئة وبيقولو عادى وممكن يحصل تعارف بينهم بس تعارف<br />عن طريق الغلط لانهم داخلين بغرض انهم يقولو كلام وحش وسئ وممكن لانهم<br />مش محترمين يحصل بينهم مقابلات اعوذ بالله يبقى هم دول اللى احنا نقول عليهم<br />بيستخدمو الشات استخدام سئ ومش كل اللى بيدخل الشات بيبقى مش محترم<br />وشكرا على الموضوع الجميل والرائع ده ياوائل"
