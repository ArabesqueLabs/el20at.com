text = "قلبى ياربى مالوش اللى انت اغلى حبيبى ظلمنى وسابنى كنت بحبة وفجاء غدر بى كنت عايشلة وهو حرمنى القلب خلاص مش حمل اسية كل جراحة بتقتلة فيا ولا حبيبى اسيو عليا قلبى ياربى مالوش اللى انت كل ماقول خلاص هرتاح القى زمانى شايلى جراح وارجع تانى ياعينى اتجرح قلبى ياـــــــــــــــــــــــــــــــــــــــــربى مالوش اللى انت كل اصحابى خانو عليا كل الخلق بتجرح فيا هى الاسوة بقيت حنية قلبى ياربى مالوش اللى انت"
