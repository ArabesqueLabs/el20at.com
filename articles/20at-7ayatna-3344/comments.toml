text = "انا بحب واحد كانت زملتى فى اتجارة الخمس سنوات وكونا زى السمن على عسل اول نص سنة وبعدين ادخلو ولاد الحلال الىبحبونا ويحبولنا الخير وخالوا حيتنا لا توطاق او خالوا فى بيينا مشاكيل كتيرة وهي بطبعها غيار بتغير كتير حتى من نفسها<br />الموهم كونت بحارب علشان المشاكيل دى متكبرش وتبوز كول حاجة والحمد لله هيد المشاكيل قولت كدة فيش مشاكيل تانى بس ولاد الحلال مبيسبوش حد فى حالو جوم على امتحانات الدبلوم الى المفروض يكون الواحد هادى واعصابوة رايقة جوم ضربى الكومبلة بتاعتهوم بس كانت قوية اوى وعانيت فيها كتير علشان افهمها انها متسمعش لحد تانى بس مفيش فايدة سواء من المدرسة او من بنت خالتها والحمد لله ادينا اهوة بقالنا ثلاث سنوات مع بعد بس المشكالة انى بقالى حوالى سنة ونص مشوفتهاش بس بتكالمنى على فطراط بعيدة لما تكون عارفة تكالمنى وانا لما بكالمها بمبعرفش اكالمها انا بخالى اختى هيا الى تكالمها علشان اطمن عليها ومش عارف اشوفها خالص انا خايف تضيع من علشان معيش شغل ومش عارف اروح اقدم ليها وهى مستنيانى اروح ادقدم ليها بفارغ الصبر بس اعميل اية معاية الشقة جاهزة ومعييش شغل ادقدم بية وادينى بدور على اخرى وبدعى كتير وربنى الحمد لله واقف جمب عبدوه الخلبان وبحمد ربنى على كول شياء<br />ياريت تقولولى اعمل اية يا اصحابى"
