author = "عبد الرحمن عبد الله"
posted = "2007-03-21"
text = "أنا كنت بأحبها من زمان وكنت دائما أتابع حركاتها وكلما ذهبت إلى مكان أحاول أن أختلس النظر ، وفي يوم ربنا جمعنا ببعض على الأكل فاستجمعت كل قوتي وغمزت لها لقمة ووضعتها في فمها وابتسمت ، فقمت أعطيتها كوب من الماء وشربتها بنفسي فقالت لي إن ديه من أجمل شربات الماء اللي شربتها في حياتي .<br />بعد كده شربنا الشاي مع بعض وأخذت شفته من كوبها وأخذت شفته من كوبي .<br />اتفقنا إننا نكرر هذا الأمر في اليوم التالي<br />بعد فترة أصبحت عادة لدينا إحنا الإثنين<br />قررت إني أصارحها بحبي في يوم الاحتفال السنوي ليها فقربت منها وجيت أقول لها تراجعت ولكن جمدت قلبي ورحت ( بست إيديها ) وقلت لها بحبك وكل سنة وأنت طيبة<br />على فكرة أنا نسيت أقول لكم كلكم إن حبيبتي هي أمي الغالية يا ست الحبايب يا حبيبة<br />كل سنة وأنت طيبة ولك سلام من زوجتي وإبنتي"
