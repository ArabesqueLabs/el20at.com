[[comments]]
order = 1
subject = "سوسو"
author = "سوسو العسول"
text = "يعنى هيا جت عليه يا امور ما كله فى اللذاذة ولا عشان شعبان طيب وعلى نياته ما عندك المهرج عادل امام وشوية الممثلين الكبار اوى اللى واكلينها والعه يحيى الفخرانى ونور الشريف وشوية الحريم الكسر يسرا والهام ونبيله يا راجل اقعد ساكت طب ده شعبان احسن منهم على الاقل مش بيدعى الثقافة"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217103130/http://masr.20at.com:80/newArticle.php?sid=18829"
