[[comments]]
order = 0
subject = "اعمال هامشية لا تنفع فى الاقتصاد"
author = "زيزو"
posted = "2008-01-03"
text = "طبعا هذا الانسان وجد طريقة او تحايل ما ليأكل رزقة - وبطريقة حلال واحسن من السرقة والبلطجة واشياء اخرى<br />ولكن ماذا يضيف عملة لاقتصاد البلد ؟ لا شىء<br />كمئات الالوف من الوظائف لا تفيد الاقتصاد فى شىء ولا تضيف اى شىء للناتج العام<br />وماذا لو كان هناك توجية من جهة ما وتم استثمار هذا المبلغ فى ورشة انتاجية ما تنتج جزءا مثلا مثلا مثلا من فانوس رمضان الذى نستوردة من الصين<br />او تعاون بالمبلغ فى شراء ماكينة نسيج تنتج قطعة من ملابس اطفال<br />نريد احد ان يخطط فى هذا البلد المنكوب فى قياداتة واحزابة - مثلما فعلت ماليزيا والصين<br />انما رجل اعمال فى النصب وتوزيع اسلاك لقنوات احيانا خارجة على الاداب من اقمار اروبية لشباب يعانى من البطالة وشرب البانجو والسهر والنوم حتى العصر<br />هذة ليست طريقة طبيعية لاكل العيش"
archived = "2008-01-05"
capture_url = "https://web.archive.org/web/20080105002653/http://masr.20at.com:80/newArticle.php?sid=13686"

[[comments]]
order = 1
subject = "وما أفتى به الأستاذ عمرو خالد بحرمانيتها القاطعة و"
posted = "2008-01-04"
text = "ما احنا قلنا قبل كده ان عمر خالد دا راجل محاسب ما لوش علاقة بقضية الفتوى دي على الاطلاق<br />عمر خالد محاسب<br />وجدي غنيم محاسب<br />محمد حسان خريج اعلام<br />محمد حسين يعقوب مدرس ابتدائي<br />المرشد العام مدرس تربية رياضية<br />ابو الفتوح دكتور<br />العريان دكتور<br />عمر التلمساني محامي<br />والى اخره<br />كل دي ناس مالهاش علاقة بقضية الفتوى على الاطلاق<br />المفتي بداية لازم يكون خريج كلية اصول الدين ولازم يكون عنده مؤهلات تانية<br />ولكن بداية لازم يكون خريج كلية اصول الدين<br />علشان كده لازم الجمهور يفهم ذلك ويرفض الفتوى من غير المتخصصين<br />وصدق رسول الله صلى الله عليه وسلم عندما قال<br />\"إن الله لا يقبض العلم انتزاعًا ينتزعه من العباد، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يبق عالمًا اتخذ الناس رءوسًا جهالاً، فسئلوا فأفتوا بغير علم فضلوا وأضلوا\"،"
archived = "2008-01-05"
capture_url = "https://web.archive.org/web/20080105002653/http://masr.20at.com:80/newArticle.php?sid=13686"

[[comments]]
order = 2
subject = "مؤهلاته تؤهله للفتوى الدكتور محمد سيد طنطاوي"
author = "اكتب اسمك هنا"
posted = "2008-01-04"
text = "أ. د. محمد سيد طنطاوي<br />أرسل هذا التعليق بواسطة :<br />تاريخ ومحل الميلاد: 8 / 10 / 1928 ، بجرجا محافظة سوهاج.<br />درجة الإجازة العالية:<br />عام 1958 من كلية أصول الدين جامعة الأزهر.<br />درجة العالمية (الدكتوراه):<br />عام 1966 في التفسير والحديث من كلية أصول الدين جامعة الأزهر بتقدير ممتاز.<br />سنة: 1960 بوظيفة: إمام وخطيب ومدرس بوزارة الأوقاف.<br />سنة: 1968 بوظيفة: مدرس تفسير وحديث بكلية أصول الدين جامعة الأزهر.<br />سنة: 1972 بوظيفة: أستاذ مساعد بقسم التفسير بكلية أصول الدين بأسيوط.<br />سنة: 1976 بوظيفة: أستاذ بقسم التفسير بكلية أصول الدين بأسيوط.<br />سنة: 1976 بوظيفة: عميد كلية أصول الدين بأسيوط.<br />سنة: 1984 بوظيفة: أستاذ بقسم أصول الدين بكلية الدراسات الإسلامية والعربية بنين بالقاهرة.<br />سنة: 1985 بوظيفة: عميد كلية الدراسات الإسلامية والعربية بنين بالقاهرة.<br />سنة: 1986 بوظيفة: مفتي جمهورية مصر العربية.<br />سنة: بوظيفة: شيخ الجامع الأزهر."
archived = "2008-01-05"
capture_url = "https://web.archive.org/web/20080105002653/http://masr.20at.com:80/newArticle.php?sid=13686"

[[comments]]
order = 3
subject = "مدد يا سيدى الطنطاوى"
author = "سلامات"
posted = "2008-01-04"
text = "ومن يكون الطنطاوى ؟ يحمل شهادات كالحمار يحمل اثقالا بدون ان ينفع الناس ويتصدى لمشكلات الحياة اليومية كما ينفع اصحاب الشهادات غير الازهريين الذين يلتقون بالشباب ويعايشون مشاكلة ويجدون حلولا لها<br />اننى كمواطن امى فى الدين احترم خريج كلية التربية الرياضية وخريج كلية التجارة الذى يشارك الناس همومهم واحزانهم<br />ولا احترم حامل الشهادات الازهرية وفاقد الشخصية الذى يقبل الحاخامات والقساوسة ويؤخذ اموال من اعداء الاسلام ليحدد النسل ويؤازر ظلم الحكام ويصدر لهم فتاوى جاهزة ومشفية على حسب المزاج هو وسعادة المفتى خريج التجارة<br />ان المرشد خريج التربية الرياضية لم يصدر ابدا فتوى ولم يقل ابدا بالحلال والحرام ولكنة مثال المسلم الصابر المجاهد بكلمة الحق الذى لا يخاف وكل الناس تحترمة حتى سجانية<br />فيا طنطاوى قبل الحاخام كما تشاء واحمل شهادات فى الطهارة فكلامك غير مقنع وشخصيتك با هتة ورمز مهين لرجال الازهر الشجعان"
archived = "2008-01-05"
capture_url = "https://web.archive.org/web/20080105002653/http://masr.20at.com:80/newArticle.php?sid=13686"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-01-04"
text = "فتوى عمرخالد بحرمانية الوصلات هى فتوى مدفوعة الأجر وسواء كانت الوصلات حلال ام حرام فهذا هو الجديد فى عالم الفتوى أن يفتى رجل الدين ويأخذ مقابل على فتوته ولا عايزين تقولوا انه لم يحصل على اجر مقابل فتوته"
archived = "2008-01-05"
capture_url = "https://web.archive.org/web/20080105002653/http://masr.20at.com:80/newArticle.php?sid=13686"

[[comments]]
order = 5
subject = "الى سلامات"
posted = "2008-01-04"
text = "يا اخ سلامات احنا عارفين ان شيخ الازهر يعتبر وزير من الوزراء دا كلام مفروغ منه<br />ولكن احنا ضربنا مثل للمفتي ان المفتي لازم يكون معاه شهادات وضربنا مثل بشهادات شيخ الازهر<br />لكن هو وزير في الوزارة ما يسري على الوزراء يسري عليه<br />ومع احترامنا الشديد للاخوة الدعاه الذين يعملون في حقل الدعوى ننبه عليهم بأن الفتوى خط احمر وليس تخصصكم<br />مهما كانت الفتوى صغيرة وصدق رسول اله صلى الله عليه وسلم عندما قال (أجرأكم على الفتوى أجرأكم على النار)"
archived = "2008-01-05"
capture_url = "https://web.archive.org/web/20080105002653/http://masr.20at.com:80/newArticle.php?sid=13686"

[[comments]]
order = 6
subject = "تصريحات الرئيس"
author = "مطحون"
posted = "2008-01-05"
text = "الرئيس بيقول فى تصريحات دورية كل يومين مرة وكل ما يقابلة صحفى انة مع محدودى الدخل وان الدولة بتدعم محدودى الدخل<br />ثم يأتى معنى التفسير العملى للتصريحات التفسير العملى والفعلى : -<br />تطليع ميتين ام محدود الدخل وهد حيلة وتوصيلة الى مرحلة الانهيار المعيشى الكامل<br />يا اخى قرفنا وفلقتنا من تصريحاتك الغبية<br />كفاية"
archived = "2008-01-07"
capture_url = "https://web.archive.org/web/20080107062217/http://masr.20at.com:80/newArticle.php?sid=13686"
