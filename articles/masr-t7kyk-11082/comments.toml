subject = "ومدونوا مصر فى المعتقلات"
posted = "2009-01-27"
text = "التدوين عندنا مخاطرة<br />وبعدين ييجوا بتاع امن الدولة نص الليل ياخدوك على معتقل برج العرب بتهمة انك اخوان او بتفتح مواقع ارهابية<br />سلم لى على البدنجان الاسود المصرى وابقى اعصر لى ليمونة على ------ والا بلاش"
