[[comments]]
order = 1
subject = "الى بيخاف ما بيعملش"
author = "المدونون هم الامل"
posted = "2009-01-27"
text = "الى بيخاف ما بيعملش و الى بيعمل ما بيخافش<br />اومال احنا عايزين ايه .. فاكرين نفسنا هناخد حريتنا واحنا مأنتخين على السرير<br />ولا واحنا بنعصر ليمون زى ما انت بتقول ...<br />المدونون فى الموضوع بيتكلموا صح جداً ... انا مش عارف الناس الى بتعترض لمجرد الاعتراض دى<br />موضوع متميز جداً .. وياريت بتوع الحزب الواطى يسكوتوا ومايتكلموش"
archived = "2010-03-14"
capture_url = ""
