text = "[quote name=\"يا فيس بوكك يا مبارك\"]برادعي مين والناس نايمين<br />الفيس بوك بتاع حسني مبارك فيه 76 مليون مصري<br />قال برادعي قال<br />الانتخابات الماضية كان العبط بيجروا ولا ايمن نور<br />ودلوقتي البرادعي<br />طيب ما هو ايمن نور لسه موجود<br />لا دلوقتي الموضه البرادعي<br />انا عايز اعرف العالم الهبل مش عايزين جمال مبارك وعايزين واحد عايش بره على طول في الغرب<br />حيعملكم ايه دا العوانس ولا الشحاتين ولا المسرطنين ولا العاطلين<br />بطلوا هبل وعبط يا بتوع ايمن نور<br />عايزين يعارضوا وخلاص اي معارضه هما معاهم<br />سلام<br />__________________________________<br />مش شريف الدواخلي ولا البراء اشرف[/quote]<br />و رحمة اللى خلقنى انت اعبط اهطل انا سوفته على النت<br />طب بزمتك .... انت مصدق حرف من اللى انت قلته ده ؟<br />لو قلت اه هقلك انت كداب ابن كدابة<br />دا لو ... و انت اكيد مش هتكدب ... ولا ايــــــه ؟<br />76 مليون عضو مرة واحدة ؟ دا الناس الفعالة على الفيس بوك بالكاد مغطية 120 مليون<br />و المصريين اللى بيعرفوا يستخدموا نت اصلا حوالى 2 مليون"
