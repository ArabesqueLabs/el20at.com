text = "انا مش قادر افهم اتللى بيأيدوا مبارك او جمال بيأيدوه ليه..!!؟<br />السبب واضح وصريح انهم من المستفيدين بالفساد الذى انتشر فى عهدهم<br />واذا لم يكن اعطونى انجازاتهم على مدار ولايتهم فى الـ 30 عاما السابقين<br />ولا تصبحوا غوغائيين وتسبوا وتهينوا من يؤيد البرادعى والا انتوا من امن الدوله بقى..!!!!؟<br />اتقوا الله .. اتقوا الله ان كنتم تعرفون الله"
