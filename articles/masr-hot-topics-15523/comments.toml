author = "يا فيس بوكك يا مبارك"
posted = "2010-03-01"
text = "برادعي مين والناس نايمين<br />الفيس بوك بتاع حسني مبارك فيه 76 مليون مصري<br />قال برادعي قال<br />الانتخابات الماضية كان العبط بيجروا ولا ايمن نور<br />ودلوقتي البرادعي<br />طيب ما هو ايمن نور لسه موجود<br />لا دلوقتي الموضه البرادعي<br />انا عايز اعرف العالم الهبل مش عايزين جمال مبارك وعايزين واحد عايش بره على طول في الغرب<br />حيعملكم ايه دا العوانس ولا الشحاتين ولا المسرطنين ولا العاطلين<br />بطلوا هبل وعبط يا بتوع ايمن نور<br />عايزين يعارضوا وخلاص اي معارضه هما معاهم<br />سلام<br />__________________________________<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304053336/http://www.20at.com:80/masr/hot-topics/15523-2010-02-28-19-47-21.html"

