author = "انتهى معك حول"
posted = "2009-06-01"
text = "نفس تجربة نقابة المهندسين<br />قالوا عن الاعضاء المنتخبين انهم من الاخوان ويساندهم الاخوان والنتيجة المحزنة التى الت اليها نقابة المهندسين هى فرض الحراسة على النقابة وتعيين مجلس من امن الدولة لادارة نقابة المهندسين ولمدة 15 سنة<br />15 سنة ونقابة المهندسين تحت الحراسة كانها كشك سجاير او كانتين بيبيع عصير<br />ما نخشاة الان هو فرض الحراسة على نقابة المحامين<br />واظن ذلك قادم قريبا<br />فافكار النظام مكررة بغباء"
