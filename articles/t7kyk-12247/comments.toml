subject = ""
author = "ابومحسن غربة 27 سنه"
posted = "2009-06-01"
text = "كل مهنة لا بد وان يكون لديها اخلاقيات<br />والمحاماه مهنة لها خصوصياتها الانسانية حيث ان المحامي يساعد الناس في استعادة حقوقهم الضائعة مثل الارامل والايتام والنزاعات المدنية والمالية بين الناس والمظلومين في القضايا الجزائية وخلافه من هذه الاعمال<br />فلا بد للمحامي ان يكون على خلق عظيم وان يكون زاهد في هذه الدنيا لا يبتغي الا مرضاه الله سبحانه وتعالى والمفروض المحامي يكون تحت رقابة الدولة<br />اما باه كون المحلامين عايزين يتجوزوا ويشتروا شقق تمليك ويشتروا ارض ويدخلوا اولادهم مدارس اجنبية ويشتروا عربيات ويلبسوا بدل وكرافتات فهذا كله ضد تحقيق العدالة لان اللي حيجيب دا كله الموكل الغلبان اللي جاي يوكل المحامي علشان خاطر يساعده<br />فضحية المحامي الاولى هي موكله اللي عايز يكسب من وراه<br />والموضوع يطول شرحه والعملية منهاره<br />ولازم نبدأ من كلية الحقوق لازم يتم تدريس اخلاق المهنة من كلية الحقوق ولازم يبقى فيه توجيه معنوي للمحامين يمنعهم من الانحراف<br />ولازم المحامي ياخد دعم من الدولة ويكون تحت رقابة الدولة<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""

