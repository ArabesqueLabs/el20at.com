posted = "2009-06-02"
text = "نداء الى نقيب المحامين الجديد<br />عايزينك بقى تبقى رجل تغيير ورجل اصلاح وتصلح وتغير من المحامين<br />وقولهم كفاية<br />اكل اموال الناس بالباطل<br />وقولهم<br />انما يأكلون في بطونهم نارا وسيصلون سعيرا<br />وقولهم<br />اخر اية نزلت في سورة البقره<br />واتقوا يوما ترجعون فيه الى الله ثم توفى كل نفس ما كسبت وهم لا يظلمون"
