subject = ""
author = "المحامي والداعرة"
posted = "2009-06-01"
text = "لا فرق بين المحامي والداعرة<br />الاثنان يبيعان شرفهما من اجل المال<br />ولا فرق بين محامي من الاخوان ومحامي من الاقباط ومحامي من الوطني<br />كلهم كلاب<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />الا من رحم ربي<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش شريف الدواخلي ولا البراء اشر"
archived = "2010-03-14"
