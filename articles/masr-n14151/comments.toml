text = "خبيب قلب بابا - واية الجديد<br />طيب يا زكى مين اللى رمى سعاد حسنى من البلكونة فى لندن<br />ومين اللى رمى اشرف مروان من البلكونة فى لندن<br />ومين اللى رمى ابن السيد بدير العالم الالكترونى من البلكونة فى اسكندرية<br />خبيبى انت لازم يسكت<br />هذا الدرس الرابع فى المقرر الذى يدرس فى اكاديمية"
