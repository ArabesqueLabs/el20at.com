subject = ""
author = "جوز فايده كامل"
posted = "2009-06-15"
text = "النبوي اسماعيل كان جوز فايده كامل وجبت سطر من على النت كده يضحك<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />وعندما راحت فايدة كامل المطربة والمحامية ، وعضو مجلس الشعب ، وزوجة وزير الداخلية (النبوي اسماعيل) تصرخ<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />اللي اعرفه ان فايده كامل مطربه<br />لا دي طلعت محاميه وايه كمان عضو مجلس الشعب<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />يا عيني على المحاماه والمجلس الموقر<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />المحامين كلهم رقاصين واعضاء المجلس مسقفتيه<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />فايده كامل محاميه يعني اول ما يقولوا محكمة<br />تنزل غنا<br />ــــــــــــــــــــــ<br />جتكم نيله ايها المحامون<br />ــــــــــــــــــــــــــــــــــــــــــــــ<br />مع تحيات مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-03-14"
capture_url = ""

