author = "الطغمة الفاسدة"
posted = "2009-06-16"
text = "رجال السلطة يتزوجون الفنانات<br />السيد عبد الحكيم عامر تزوج الفنانة برلنتى عبد الحميد وقعد يدلع نفسة معاها وساب الجيش يندبح فى سيناء<br />والسيد النبوى اسماعيل تزوج الست فايدة كامل مطربة الاغانى الوطنية وقعدت تغنى علينا وفتحت لها ابواب الاذاعة والميكروفانات ايام سطوة زوجها وزير الداخلية ثم بعد اعتزالة راحت لمجلس الشعب - تهبب اية مش عارف - وقالت انها محامية ومش فنانة<br />يا حلاوة يا حلاوة<br />عزائنا للفنانة عضو مجلس الشعب المحامية فايدة كامل على وفاة زوجها<br />اللة يكحمة"
archived = "2010-03-14"
