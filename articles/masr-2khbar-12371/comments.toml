subject = ""
author = "من العجيب"
posted = "2009-06-15"
text = "ومن العجيب ان تخرج جثتة من المسجد وهو لم يدخلها ابدا حيا<br />ومن العجيب ان يصلوا على الجثمان وهو من كان يعتقل المصلين ومن يرتادوا المساجد<br />ما كان لهم ليدخلوها الا وهم خائقين<br />من المفروض ان تخرج جثتة من سجن القلعة او ليمان طرة مقر شغلة وتعذيبة<br />اما المساجد فلها اهلها<br />الا ان لعنة اللة على الظالمين"
archived = "2010-03-14"
