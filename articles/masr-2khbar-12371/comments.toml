author = "وزير الداخلية"
posted = "2009-06-16"
text = "كان وزير الداخلية لما تم اغتيال السادات<br />واظن انة كان متواطىء بالتقصير فى الحراسة فتم اغتيال السادات لصالح جهات اجنبية<br />وهو صاحب اعتقالات خريف الغضب التى اعتقل كل رموز مصر السياسية والدينية والحزبية ورموهم فى السجون والسادات وقف وقال على احد الرموز الدينية واظنة الهضيبى اهو مرمى فى السجن زى الكلب<br />هذا الرجل صاحب قصة خريف الغضب باعتقالاتة التى سببت هياج فى مصر انتهت بموت السادات شر موتة"
