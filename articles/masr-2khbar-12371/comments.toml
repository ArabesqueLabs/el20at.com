text = "اللهم ارحمنا دنيا و اخرة :cry: :cry: :cry: :cry:<br />و اغفر لنا زنوبنا فى دنيانا<br />و اغفر لمن ظلمونا فى دنيانا و خاصة رجال وزارة الداخلية بمصر<br />و نجنا عذاب القبر و النار :cry: :cry: :cry: :cry: :cry: :cry: :cry:<br />استجب لنا ياللة فانت مجيب الدعاء<br />اللهم تقبل من<br />امين"
