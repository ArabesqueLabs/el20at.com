author = "الحسن البصرى"
posted = "2009-06-16"
text = "مرت جنازة - رجال يحملون نعشا فية ميت - وخلف النعش المشيعون يسيرون ورائة<br />مرت الجنازة امام بيت سيدنا الامام حسن البصرى --- فوقف ومن معة احتراما لمرور الجنازة - وتبسم الامام<br />فسالة اصحابة الذين يحيطون بة - لماذا تتبسم يا حسن يا بصرى وهذة جنازة لاحد الموتى<br />فقال الامام<br />(اتبسم<br />لانى شاهدت امواتا يشيعون ميت ----- امواتا يشيعون بعضهم بعضا)<br />هل الذين حضروا جنازتة يعلمون انهم ميتون يشيعون ميت - وان دورهم غدا<br />اة لو تتعظون<br />ولانكم تظنون انكم مؤبدون فيها"
archived = "2010-03-14"
capture_url = ""

