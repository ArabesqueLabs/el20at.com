subject = ""
author = "معلم اعتقالات"
posted = "2009-06-15"
text = "معلم من ضمن معلمين الاعتقالات بالجملة بحق او ظلما وعدوانا<br />وسيقف امام اللة وخصومة الذين عذبوا فى المعتقلات والذين انضربوا على قفاهم ووضعوا فى الزنازين جوعى وبلا ادمية سيقفون جميعا امام الديان وستجزى كل نفس بما عملت<br />هؤلاء كلاب السلطان ينهشون فى لحوم الناس ليرضوا خادمهم ليظلوا فى كراسيهم وينسون الموت<br />كم معتقل برىء دعى علية<br />كم زوجة هوجم بيتها للتفتيش مع الفجر وانتهكت ادميتها دعت علية<br />سينزل جثة هامدة فى القبر بلا حرس ولا بروجى ولا سلام سلاح وسياكل الدود الجسد وسيحاسب حسابا عسيرا<br />قد تكون لهم بعض المحاسن ولكن ظلمهم اكثر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = ""
author = "نهدى هذا الخبر"
posted = "2009-06-15"
text = "الى كل الفراعين والجبارين<br />الى الظلمة الذين يجلسون على كراسى السلطة ويعتقلون الناس ويعذبوهم<br />لكل ظالم نهاية<br />ولكل متجبر خاتمة فى حفرة ويهال علية التراب وسط لعنات الناس<br />ماذا اخذت معك الى القبر ؟<br />الا تلاحقك صرخات المعذبون فى السجون ووقاحة رجالك وزبانيتك فى المعتقلات<br />لكل ظالم نهاية<br />ولكل كلب مدور وخرابة يموت فيها<br />لم تحترم ادمية المواطن المصرى الضعيف ولا انسانيتة<br />من الممكن ان يغتقل اى انسان وفى اى دولة ولكن مع احترام كرامتة والمحافظة على انسانيتة ولكن هتك الاعراض والتنكيل بالمساجين لا يفعلة الا مجرم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
