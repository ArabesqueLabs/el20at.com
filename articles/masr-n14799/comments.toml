subject = "باركك الرب المسيح اتلو يا حبيبي ايات  الانجيل ا"
author = "مش بحبك"
posted = "2008-03-23"
text = "7: 1 ما اجمل رجليك بالنعلين يا بنت الكريم دوائر فخذيك مثل الحلي صنعة يدي صناع<br />7: 2 سرتك كاس مدورة لا يعوزها شراب ممزوج بطنك صبرة حنطة مسيجة بالسوسن<br />7: 3 ثدياك كخشفتين توامي ظبية<br />7: 4 عنقك كبرج من عاج عيناك كالبرك في حشبون عند باب بث ربيم انفك كبرج لبنان الناظر تجاه دمشق<br />7: 5 راسك عليك مثل الكرمل و شعر راسك كارجوان ملك قد اسر بالخصل<br />7: 6 ما اجملك و ما احلاك ايتها الحبيبة باللذات<br />7: 7 قامتك هذه شبيهة بالنخلة و ثدياك بالعناقيد<br />7: 8 قلت اني اصعد الى النخلة و امسك بعذوقها و تكون ثدياك كعناقيد الكرم و رائحة انفك كالتفاح<br />7: 9 و حنكك كاجود الخمر لحبيبي السائغة المرقرقة السائحة على شفاه النائمين<br />7: 10 انا لحبيبي و الي اشتياقه<br />7: 11 تعال يا حبيبي لنخرج الى الحقل و لنبت في القرى<br />7: 12 لنبكرن الى الكروم لننظر هل ازهر الكرم هل تفتح القعال هل نور الرمان هنالك اعطيك حبي<br />7: 13 اللفاح يفوح رائحة و عند ابوابنا كل النفائس من جديدة و قديمة ذخرتها لك يا حبيبي"
archived = "2008-03-27"
capture_url = "https://web.archive.org/web/20080327213254/http://masr.20at.com:80/newArticle.php?sid=14799"

