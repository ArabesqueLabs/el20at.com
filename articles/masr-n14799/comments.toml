subject = "هل اقترب فتح روما"
author = "مش لازم"
posted = "2008-03-23"
text = "هل اقترب فتح روما<br />بابا الفاتيكان يتهم الاسلام بالارهاب<br />روما التي يوجد فيها الفاتيكان موعودة بالفتح الإسلامي المبين بإذن الله :<br />ما رواه أحمد والدارمي وابن أبي شيبة والحاكم وصححه ووافقه الذهبي، عن أبي قبيل قال: كنا عند عبد الله بن عمرو بن العاص، وسئل: أي المدينتين تفتح أولاً: القسطنطينية أو روميَّة؟ فدعا عبد الله بصندوق له حَلَق قال: فأخرج منه كتابًا قال: فقال عبد الله: بينما نحن حول رسول الله -صلى الله عليه وسلم- نكتب، إذ سئل رسول الله -صلى الله عليه وسلم-: أي المدينتين تفتح أولاً: قسطنطينية أو رومية؟ فقال رسول الله -صلى الله عليه وسلم-: \"مدينة هرقل تفتح أولاً\" يعني قسطنطينية \" رواه أحمد<br />والقسطنطينية قد فتحها محمد الفاتح رحمه الله ...... وبقيت روما ..... وبمشيئة الله قد اقترب فتحها ......<br />وَيَوْمَئِذٍ يَفْرَحُ الْمُؤْمِنُونَ [ 4] بِنَصْرِ اللَّهِ يَنصُرُ مَن يَشَاءُ وَهُوَ الْعَزِيزُ الرَّحِيمُ [ 5] سورة الروم<br />الإسلام ينتشر يسرعة رهيبة رغم قلة الإمكانيات المادية ورغم الحصار ...... والسبب ببساطة أن الله قد تكفل بحفظ هذا الدين وإظهاره على العالمين :<br />هُوَ الَّذِي أَرْسَلَ رَسُولَهُ بِالْهُدَى وَدِينِ الْحَقِّ لِيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ وَلَوْ كَرِهَ الْمُشْرِكُونَ [ التوبة الآية 33]<br />يُرِيدُونَ لِيُطْفِؤُوا نُورَ اللَّهِ بِأَفْوَاهِهِمْ وَاللَّهُ مُتِمُّ نُورِهِ وَلَوْ كَرِهَ الْكَافِرُونَ [ الصف الآية 8]<br />وَاللّهُ غَالِبٌ عَلَى أَمْرِهِ وَلَـكِنَّ أَكْثَرَ النَّاسِ لاَ يَعْلَمُونَ [ يوسف الآية 21]<br />قال النبي صلى الله عليه وسلم : \"إن الله زوى لي الأرض - أي جمعها وضمها - فرأيت مشارقها ومغاربها، وإن أمتي سيبلغ ملكها ما زوي لي منها \" رواه مسلم<br />انشروا هذا الموقع وهو لقسيس أمريكي اعتنق الإسلام وهو الان من كبار الدعاة الى الله وقد أسلم على يديه خلق كثير :<br />http://islamtomorrow.com<br />منقووووووووووووووول"
archived = "2008-03-27"
capture_url = "https://web.archive.org/web/20080327213254/http://masr.20at.com:80/newArticle.php?sid=14799"

[[comments]]
order = 2
subject = "لفاتيكان يهون من تقرير عن اغتصاب الراهبات"
author = "مش كاتب"
posted = "2008-03-23"
text = "لفاتيكان يهون من تقرير عن اغتصاب الراهبات الفاتيكان يقول إن حوادث الاغتصاب محدودة أقر الفاتيكان بأن الراهبات الكاثوليكيات تتعرضن للتحرش من جانب القساوسة، لكنه هون من حجم المشكلة مشيرا إلى أنها محدودة وقد جاءت تعليقات الحاضرة الكاثوليكية ردا على مزاعم وردت في هذا الصدد في أسبوعية ناشيونال كاثوليك الصادرة في الولايات المتحدة وقالت الصحيفة إنها رصدت بعض الحالات التي حملت فيها الراهبات من القساوسة ثم أجبرن على الإجهاض عقب ذلك وقد استند المقال التفصيلي الذي نشر في الصحيفة إلى خمس تقارير أعدت من قبل رجال دين كاثوليك في الفترة من عام أربعة وتسعين وحتى الوقت الحاضر الراهبات عرضة للخطر واعترف المتحدث باسم الفاتيكان جواكين نافارو فولز بأن قيادة الكنيسة الكاثوليكية تعرف بهذه المشكلة التي كانت موجودة في منطقة جغرافية محدودة حملة عالمية لكن التقرير الذي نشرته ناشيونال كاثوليك ريبورتر تناقض مع ما قاله المتحدث حيث رصد ثلاثة وعشرين دولة وقعت فيها هذه الانتهاكات من بينها الولايات المتحدة وإيطاليا والهند وإيرلندا والبرازيل وكان الأب روبرت جي فيتيلو، الذي يترأس حاليا حملة الأساقفة الأمريكيين من أجل التنمية البشرية قد ألقى محاضرة حول المشكلة نفسها في عام أربعة وتسعين ونقل عنه القول إنه سمع شخصيا قصصا مأساوية عن نساء متدينات إجبرن على ذلك وقيل في التقرير إن النساء اللواتي تعرضن لهذه المأساة لم يجدن كثيرا من التعاطف عندما اشتكين وفي تقرير صدر عام أربعة وتسعين قالت الراهبة ماورا أودوني المؤهلة كطبيبة، إن راهبات من الكنائس المحلية قدمن مناشدات حارة إلى المسؤولين الكنسيين الدوليين يطلبن فيها المساعدة وقالت إن الراهبات المتضررات حاولن تقديم شروح إلى السلطات الكنسية حول هذه القضية لم تجدن آذانا صاغية وأكد الفاتيكان في رده الرسمي على هذه المزاعم أن الكنيسة الكاثوليكية تعمل على حل هذه المشكلة التي يجب ألا تغطي على الأعمال الجيدة التي تقدمها طبقة رجال الإكليروس وقال بيان للفاتيكان إن بعض الحوادث السلبية لا ينبغي أن تجعلنا ننسى الإيمان القوي الذي تعبر عنه الغالبية العظمى من الرجال والنساء في النظام الكهنوتي لكن أحد رهبان المذهب البنديكتي قال للصحيفة الأمريكية إنه يعتقد أن الكنيسة الكاثوليكية تواجه مشكلة خطيرة للغاية وقال إنه يعتقد أن ما يجري الحديث عنه من انتهاكات تحدث بالفعل، مشيرا إلى أنه لا يعرف معدل حدوثها، لكن يتعين مناقشة القضية"
archived = "2008-03-27"
capture_url = "https://web.archive.org/web/20080327213254/http://masr.20at.com:80/newArticle.php?sid=14799"
