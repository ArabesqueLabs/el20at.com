[[comments]]
order = 3
subject = "هل كتاب الله دعوة للتبرك أم التحرك؟"
author = "مش شريف الدواخلي ولا البراء اشرف ولا عبدالله الطحاوي"
text = "القرأن دعوة للهداية يا طحطح<br />دعوة للايمان<br />دعوة للتوحيد<br />دعوة الى الالتزام بمنهج النبي محمد صلى الله عليه وسلم<br />ولكن يا طحطح فيه حاجات على مستوى الفرد<br />وفيه حاجات على مستوى الاسرة<br />وفيه حاجات على مستوى الدولة<br />اولا نتكلم على الحاجات اللي على مستوى الفرد<br />ان الفرد بيقرأ القرأن حتى يتقرب الى الله سبحانه وتعالى وحتى يشغر بأن الله معنا<br />وايضا لتراكم الحسنان يا طحطح زي ما انت قلت فيه حديث للرسول صلى الله عليه وسلم ان اللي يقرأ القرأن كل حرف بعشرة حسنات (لا اقول الم حرف ولكن الف حرف ولام حرف ومين حرف)<br />يعني يقرأ القرأن لتراكم الحسنات يا طحطح وكل واحد على اده<br />وكل واحد بيتحرك بالقرأن على اده يعني مثلاعلي ابن ابي طالب لما قرأ القرأن مستحيل حيكون زي عبدالله بن ام مكتوم لما قرأ القرأن او اي صحابي مغمور اخر<br />ولما حسن البنا يقرأ القرأن مش معقول حيكون زي واحد جربوع زيي لما يقرأ القرأن<br />يعني انا لما اقرأ القران حتحرك بالقرأن باني حدعو الناس اللي ما بتقرأش قرأن انهم يقرأوا قرأن او حعلم الاطفال الصغيرين قراءة القران<br />فيه ناس بتقرأ القرأن ممكن تعمل عصيان مدني وتعمل مظاهرات<br />فيه ناس بتقرأ القرأن ضربت البرجين بتوع امريكا<br />فيه ناس بتقرأ القرأن اغتالت انور السادات<br />فيه ناس بتقرأ القرأن خطفت طائرات<br />وهكذا يا طحطح<br />وكل دا ليه<br />فيه غياب العلماء وغياب دورهم<br />علشان خاطر كده يا طحطح انت بتقول دعوة للتحرك<br />دعوة للتحرك دي كبيرة اوي اوي اوي انت مش ادها يا طحطح<br />دي عايزه المشير طنطاوي<br />سلام يا طحطح وسلملي على شريف وبراء"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918100326/http://masr.20at.com:80/newArticle.php?sid=17597"

[[comments]]
order = 4
subject = "رد على فقرة (كسبنا صلاة النبي)"
author = "مش رضوى حسن ولا مروى صلاح ولا دعاء الشامي"
text = "اولا غلط لما تدخل صلاة النبي عليه الصلاة والسلام في الموضوع بهذه الاسلوب<br />رغم ظروفنا الصعبة والسيئة على جميع المستويات فنحن كسبنا صلاة النبي صلى الله عليه وسلم وحنفضل نصلي على النبي زي ما ربنا امرنا ويارب تكون اخر عهد لنا بهذه الدنيا الصلاة على النبي صلى الله عليه وسلم<br />بالنسبة للفقرة بتاعة كسبنا صلاة النبي يا استاذ فيه حاجه اسمها علامات يوم القيامة لطفا يرجى مراجعة علامات يوم القيامة الصغرى<br />كل اللي انت بتقوله دا من علامات يوم القيامه ولازم المسلم يحسن التعامل مع هذه العلامات<br />ما هو اصل مش معقول ربنا مش حيقوم القيامة علشان خاطركم<br />يعني مثلا زي قبض العلم من علامات يوم القيامه قبض العلم ويتخذ الناس رؤوس جهالة<br />خلاص الناس حتعمل ايه قبض العلم ولازم احوالنا تبقى تعبانه<br />واهه انا والله وانا بكتب سامع صوت عمر خالد في التلفزيون اهو في زمن قبض العلم واحد محاسب عمال يتكلم بيعمل اللي عليه وامره الى الله لان مفيش علماء<br />سلام"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918100326/http://masr.20at.com:80/newArticle.php?sid=17597"

