subject = "يعني اية العمل"
author = "m&h"
posted = "2008-09-21"
text = "ايوة يعني نبطل قراية قران ولا اية ....... اية ياعم الاسلوب دة في حد بيتكلم كدة ..... يعم براحة واحدة واحدة على الناس ...... واحد ميعرفش شكل المصحف اساسا .... بدا يقرا وبيتهته ومش فاهم حاجة .... اقولة يتك القرف منتش فاهم حاجة واوعى تقراى لحد لما تفهم وبعد كدة تعالي اقرا .... هيقولك خلاص لما ابقى افهم بقى .... يعم خلي الناس تقرا وتتلعثم ويا خدو اجرين اجر القراة واجر التهتهه ... وانشاء الله واحدة واحدة بيفهمو القران ....<br />يا كاتبي العزيز الالوان مش ابيض واسود بس فية رمادي ..... واحنا ناس على ادحلنا نفهم شوية ونحاول نفهم شوية تانين<br />الهم ارحمنا برحمتك واعتقنا من النار واشقينا من يد رسولك شربة هنية لا نظما بعدها ابدا"
