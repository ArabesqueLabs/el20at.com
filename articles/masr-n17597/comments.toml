[[comments]]
order = 18
subject = "انة قمة اليأس - ولا امل اطلاقا- اقرأ كتاب  السلوك"
author = "مش مصدق"
posted = "2008-09-21"
text = "من سوء الحظ اننى اقرا كتابا اسمة السلوك فى اخلاق الملوك عن شخصية الانسان المصرى وطبيعة الفهلوى المغروسة فية<br />نادى المحتسب فى القاهرة ايام الدولة المملوكية بالاحتفال بشفاء السلطان من كسر فى يدة حيث استمرت الزينات اسبوعا كاملا وطلعت الكوسات بالبشائر تضرب والطبول تدق ولم يبق اميرا الا عمل فى بيتة فرحا وعلى حد تعبير صاحب الكتاب وقد اسهب المقريزى فى وصف الاحتفال<br />تقام الاحتفالات وترفع الزينات لان بسلامتة شفى من جذع فى ايدة وعلى الشعب ان يفرح بالعافية لشفاء سيادتة<br />وحاليا<br />ما الفرق بين القاهرة المملوكية والقاهرة الان<br />موكب سيادتة بيمر فى الشارع لالقاء خطاب او افتتاح محطة مجارى فتغلق الطرقات والميادين ويصطف الالاف من العسس والبصاصين فوق اسطع العمارات وفى البلكونات ويمنع السير والخروج وتتعطل مصالح الناس وتتوقف الحياة<br />فهلوة الشعب المصرى تجعلة لا يهتم<br />المتنازعون على السلطان والنفوذ لا يهموا الشعب فى اى شىء<br />الفلسفة فى تلك الكتاب تقول<br />ان حكمة المصريين فى انظمة الحكم<br />ان الدنيا لمن غلب فيصفق لة وينعى على من دالت دولتة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
