text = "لما نزلت هذه الاية سال المسلمين عن القوة قال لهم صلى الله عليه وسلم الا في القوة الرمي يعني القذائف من اعلى الى اسفل<br />مين سمع هذه ااية واتحرك<br />اعداء الاسلام ونخص بالذكر المسيحيين تركوا تعاليم المسيح ونخص بالذكر من ضربك على خدك الايمن فادر له خدك الايسر<br />وتحركوا باية واعدوا لهم ما استطعتم من قوة ومن رباط الخيل ترهبون به عدو الله وعدوكم اللي هما المسلمين للاسف<br />وزيوا ما انتم شايفين هزمونا بقرأننا القوة اللي هي الطيران الحربي ورباط الخير الدبابات يعني البرية والطيران<br />تحركوا باية قرانية<br />وتركو لنا من ضربك على خدك الايمن فادر له خدك الايسر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 15
subject = "خللى السلاح صاحى -- واوجاع جيل الضياع"
author = "حفار قبور"
posted = "2008-09-20"
text = "نحن جيل الضياع<br />ضيعنا كل حاجة<br />وهربنا من المسئولية<br />رايت بعينى الصواريخ المصرية الظافر والقاهر مكدسة او مخزنة فى صالة فى احد المصانع والتى صنعت بايد مصرية ومساعدة خبراء المان - وكانت تطلق بنجاح الا انها لم تكن بدون اجهزة توجية صنعها الاباء الناصريون ولكننا الابناء فى عصر السادات سخرنا منها ورميناها فى الزبالة ولم نطورها - والنتيجة ان صواريخ حزب اللة فى لبنان متطورة اكثر منا<br />ضيعنا كل تعب الاباء<br />مصانعنا المخصصة لانتاج السلاح تنتج الادوات المنزلية والحلل والبوتاجازات<br />اليهود الذين كنا نحاربهم شرق القناة اصبحوا فى شوارع القاهرة وفى حارات القرى يبيعون البذور والمبيدات المسرطنة<br />نحن اضعنا البلد<br />جيل الضياع الفاشل الذى هرب الى دول الخليج وترك البلد لسماسرة العقارات ومنتجوا الشيبسى والسراميك وقطع السجاد الرديئة والموكيت<br />اليس هذة هى صناعات كبار السماسرة الملقبين برجال الاعمال<br />انما صناعة القوة فقد ضاعت واضعناها<br />اوجعنى كلامك واعدوا لهم مااستطعتم من قوة<br />ليس عندنا اى مقومات للقوة<br />كلها معونات<br />مالذى نصدرة للخارج<br />ما هو انتاجنا<br />مسخرة<br />انتاج اسرائيل ال 5 مليون انسان يعادل جميع انتاج الدول العربية المحيطة بها بالاضافة الى دول الخليج<br />العدد فى الليمون<br />والسبب<br />افتقاد العدل<br />رئيس وزراء اسرائيل استدعتة الشرطة للتحقيق على مدار 4 شهور من اجل خمسين الف دولار اخذهم هبة من صديق واضطر للاستقالة ونحن نوزع ارض الدولة بالمجان على الحبايب والنسايب لدرجة ان احدهم حصل على ارض فى الساحل الشمالى تعادل محافظة الشرقية وبالمجان<br />لا تتكلموا عن واعدوا لهم ما استطعتم من قوة<br />تكلمواعن<br />نحن فى خدمكم وفى طاعتكم وشحتونا للة<br />ضيعنا البلد<br />ربنا ينتقم مننا جميعا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 16
subject = "الى حفار القبور (قل للذرين كفروا ستغلبون وتحشرون ا"
author = "مش يائس"
posted = "2008-09-21"
text = "يا استاذ حفار القبور ما فيش حاجه اسمها حفار القبور<br />اقرأ حال الجزيرة العربية قبل الاسلام<br />وقولي بالله عليك ازاي ناس زي دول في اقل من 100 سنه تبقى دولتهم من اسبانيا الى الهند<br />انه النبي محمد صلى الله عليه وسلم<br />منهج النبي موجود وزي ما قلت لحضرتك اعداء الاسلام سرقوه مننا وتركوا الخيبة بتاعتهم<br />الخيبة بتاعتهم<br />من ضربك على خدك الايسر فادر له خدك الايمن<br />وجم في قرأننا (واعدوا لهم ما استطعتم من قوة)<br />هو دا الكلام المضبوط<br />وعايز اقول كلمة هنا<br />النبي محمد صلى الله عليه وسلم بشر بفتح القسطنطينية وفضل كل قائد يجي يحلم بأنه يفوز بهذه النبوءة المحمدية<br />الى ان جاءت الدولة العباسية كانت بتحكم نص العالم<br />وبعدين جم المغول والتتار قضوا على الدولة العباسية تماما<br />بعديها بخمسمائة سنه جه محمد الفاتح وفتح القسطنطينية<br />ما تفقدش الامل<br />النبي محمد صلى الله عليه وسلم بشر بفتح روما<br />واحنا حالنا الان حال المسلمين ايام المغول والتتار<br />فابشر يا اخ حفار القبور"
