[[comments]]
order = 10
subject = "خطبة فقية جوعان بيقف كل يوم فى طابور الخبز"
author = "شحبور"
posted = "2008-09-19"
text = "اللهم وارضى عن الاربعة الاعيان الذين ذكرهم اللة تعالى فى القران: التين والزيتون والخوخ والرمان وارضى اللهم عن الستة الباقين من العشرة اطعمة المفتخرة الماوردية والمهلبية والشعرية بالزغاليل المربية والارز المفلفل باللحم الضانى المحشى المحمر والكنافة املنتبلة بالسمن وعسل النحل واللوز والسكر والقطايف الغارقة بالسمن متعنا اللة واياكم اجمعين<br />اللهم واهلك الثلاثة الفجار : العدس والبسلة والبيصار - عباد اللة من اراد خلع القبول ان تفاض علية فلياكل الموز بالسكر بين والدية وينهاكم عن اكل الحرام ولو كان من اطيب الماكول<br />اللهم وادم النصر والتاييد والثبات واجمع الشمل بعد الشتات ببقاء الرئيس السكر النبات ابن القنا فى اصلة من القصب الملوانى اللهم وايدة بارماح القصب وبسبائط البلح وبعناقيد العنب واجمعنا علية من اول النهار وفى وسطة واخرة وانصرة وانصر عساكرة فى الدنيا ننتفع بة يارب العالمين<br />واعلموا ان القشطة لا تترك وان المهلبية احسن وابرك واشهد ان اللحم الضانى سيد الاطعمة ومصلح للبدن فتهيؤا لاكلكم وشربكم واعلموا انكم بين يدى اللة غدا موقوفون وباعمالكم محاسبون"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = "الى المدعو شحبور المعلق السابق"
author = "مش بكرهك"
posted = "2008-09-19"
text = "لو كنت مسلم فاعلم انك كفرت بالله عندما قلت والتين والزيتون والخوخ والرمان وتستوجب التوبة والغسل ونطق الشهادتين من جديد<br />ولو كنت مسيحي وها هو الارجح يبقى من الاولى التريقة على ما يحدث من القساوسة في الكنائس وهو كثير ومضحك ومنها عندما شرب القسيس الخمر ويأكل الفطير لان الفطير لحم المسيح والخمر دم المسيح<br />ويستحسن ما اشوفش وشك في هذا الموقع مرة تانية لحسن حمسح بيك الارض<br />انا هنا الفتوة بتاع هذا الموقع ما حدث قدر عليا لا مسلم ولا نصراني"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 12
subject = "فتوة من غير مروة وحارس الافاق - الجهل المركب"
author = "انا"
posted = "2008-09-19"
text = "من انتم الذين تكفرون وتدعون الى الاستغفار واعادة الشهادة - ؟ هل انتم حملة مفاتيح الجنة ؟<br />الدين عندكم تكشير وقلب الوجة وتنصيب انفسكم بجهل اوصياء على عباد اللة<br />الكلام المكتوب منقول من كتاب ازهرى قديم مملوء بمواضيع لطيفة وقفشات نحوية ولغوية بين المشايخ والفقهاء وكذلك نوادرهم فى الولائم والمادب وو صف اطايب الطعام وما يؤكل فى رمضان<br />والفقهاء ليسوا مقدسين فى الاسلام اذ لا يوجد فى الدين الاسلامى رجال دين وكهنوت وقداسة كما فى بقية الاديان<br />وانصحك ان تترك الجهل المركب وتقرأ ما كتبة الاجداد بسعة صدر وبلا حساسية وان تثقف نفسك دينيا بدلا من الاتغلاق والانفلاق وان لا تنصب نفسك حارسا على دين انت لا تفقة فية شيئا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 13
subject = "اللهم وارضى عن الاربعة الاعيان الذين ذكرهم اللة تع"
author = "مش انا"
posted = "2008-09-20"
text = "الى المدعو انا<br />السطر اللي فوق هذا والعياذ بالله كفر صريح لانه استهزاء بكتاب الله وافتراء على الله واذا كان الله ذكر التين والزيتون والرمان في كتابه فهو لم يذكر الخوخ والعياذ بالله<br />وبيني وبينك علماء الدين انا حصور التعليق وخصوصا السطر الاول فيه وعرضه على عالم دين في صلاة الظهر يعني بعد 7 ساعات من الان وسوف انقل لك ما قاله عالم الدين واذا كنت انا اخطأت في التكفير حأقول ان انا اخطأت<br />ولكن اللي اعرفه ان الاستهزاء بكتاب الله وبكلام الله كفر هذه هي المعلومة اللي عندي وانا سوف انقل لك رأي الدين في هذا التعليق بعد 7 ساعات من الان<br />سلام<br />وانت برضه يااخ انا خذ هذا التعليق واعرضه على عالم دين وقولنا ايه النتيجة"
archived = "2010-03-14"
capture_url = ""

