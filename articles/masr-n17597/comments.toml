subject = "الكتاب اسمه \\'هز القحوف في شرح قصيد ابي شادوف\\' للشربيني"
text = "الى الاخ المعلق قبل السابق<br />الكتاب اسمه \\'هز القحوف في شرح قصيد ابي شادوف\\' للشربيني<br />وليس كما ذكرت<br />بس هذا كتاب عظيم جدا وتعرفت عليه عندما كنت ابحث عن معنا كلمة (كاني وماني)<br />ووردت \\\"كاني ماني\\\" في كتاب \\\"هزّ القحوف\\\" ص 23"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918100326/http://masr.20at.com:80/newArticle.php?sid=17597"
