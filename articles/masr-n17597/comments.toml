[[comments]]
order = 6
subject = "هل كتاب الله دعوة للتبرك أم التحرك؟"
author = "سؤال لاحمد عمر هاشم رئيس جامعة"
posted = "2008-09-18"
text = "مش انت اللي تتساءل هذا التساؤل يا استاذ عبدالله<br />علماء الدين هما اللي يسالوه لان فيه ضوابط فقهية في الموضوع<br />علشان خاطر ما يحصلش زي ما حصل مع خالد الاسلامبولي واسامة بن لادن (زي ما الاخ اللي في التعليق السابق اشار اليه)<br />علماء الدين الكبار امثال اساتذة جامعة الازهر هما اللي يتساءلوا هذا السؤال<br />انما بالحق هما فين العلماء دول مش موجودين على الساحة ليه لازم ندور عليهم لحسن باين عليهم مستخبيين<br />ولم يبقى في الساحة الا عمرو خالد ومعز مسعود ومصطفى حسني<br />يظهر ان هما دول علماء الدين الجدد<br />ولا حول ولا قوة الا بالله العلي العظيم"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918100326/http://masr.20at.com:80/newArticle.php?sid=17597"

