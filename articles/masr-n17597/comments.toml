[[comments]]
order = 1
subject = "ويؤجرون القتلة للقتل"
author = "من البلد التي قتلت فيها سوزان تميم"
text = "ويؤجرون القتلة للقتل انت تقصد محسن منير السكري الذي تم تأجيره لقتل سوزان تميم<br />فما بالك بأه لما يكون القتلة ضباط شرطة سابقين المفروض دخلوا كلية الشرطة لحماية القانون وحماية امن الناس وخدم عشر سنوات في وزارة الداخلية المصرية المفروض يكون خارج انسان تاني خالص<br />لكن للاسف لم يتعلموا في وزارة الداخلية او لم تعلمهم وزارة الداخلية الا انهم كيف يكونوا مجرمين وسفله وناخد الضابط اسلام نبيه مثالا لضابط وزارة الداخلية المصرية<br />كلهم اسلام نبيه (الا من رحم ربي)<br />لازم المصريين يشوفولهم حل في وزارة الداخلية دي وزارة لترويع المواطنين واذلالهم واهانتهم لا علاقة لها بالامن<br />وزارة الداخلية المصرية فاشلة في شغلها الاساسي الا هو حماية المجتمع من السرقة والقتل والنهب والخطف والاغتصاب والتهريب وتجارة الممنوعات كالمخدرات وشربها<br />مفيش حد يحاسب وزارة الداخلية في مصر<br />عايزين نعمل تحقيق مع الطلبة اللي اخذوا السنوية وجريوا على كلية الشرطة هما عايزين يدخلوا كلية الشرطة ليه<br />علشان خاطر بيحلم انه يبقى باشا او اهله بيحلموا بهذا الحلم<br />يا جماعة انا بكلمكم من خارج مصر من البلد اللي اتقتلت فيها سوزان تميم الشرطة كشفت شخصية محسن السكري بعد 5 ساعات فقط من الابلاغ عن الجريمة<br />الشرطة في البلد اللي انا فيها تعرف يعني ايه امن دوريات الشرطة بتمشي في الشوارع تشوف حد محتاج حاجه حد عنده مشكلة يحلوهاله<br />اقسام الشرطة مفتوحة لكل الناس وضابط الشرطة دا واحد في خدمتك لما تروحله يستقبلك احسن استقبال ويقدم لك ما في وسعه من خدمات وتسهيلات<br />ولذلك نرفع شكوانا هذه الى السيد/ حبيب العادلي وزير الداخلية المصرية لكي يبدا في تصحيح مسيرة وزارة الداخلية في مصر<br />يا سيادة اللواء حبيب العادلي وزارة الداخلية كده ما تنفعش<br />سافر وشوف وزارات الداخلية في البلاد التانية عامله ازاي<br />وشكرا<br />وشكرا"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918100326/http://masr.20at.com:80/newArticle.php?sid=17597"

