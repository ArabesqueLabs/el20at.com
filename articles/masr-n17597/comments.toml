text = "ذهب الشعراوي والغزالي والمراغي وجاء عمرو خالد ومعز مسعود ومصطفى حسني<br />معقولة يا اخوانه في بلد الازهر كعبة العلم على مدار الف سنه في العالم الاسلامي كله<br />وانا لا انتقص من قدر عمرو خالد ولا معز مسعود ولا مصطفى حسني ابدا فجزاهم الله خيرا<br />ولكن اين علماء الازهر<br />اين خريجي الازهر<br />كام كلية في مصر بتخرج علماء دين<br />بيروحوا فين دول"
