subject = "الله اعلم"
author = "ايمان رضا"
posted = "2008-09-29"
text = "موضوع رائع جدا جزاك الله خيرا فينبغى علينا جميعا أن نقرأ القران الكريم و نتدبر معانيه واذا توقفنا مع اية لا نفهم معانيها فلنبحث عن تفسيرها وبذلك نأخذ ثواب القراءة وثواب البحث والتدبر فى ايات الله الكريمة تطبيقا لقوله تعالى (أفلا يتدبرون)لعل الله يفتح علينا بها و بتطبيقها ندخل الجنة و يرضى عنا الفتاح العليم وأرجو أن يستمر الجميع فى قراءة ال قران وتدبر معانيه يوميا بعد رمضان حتى ولو أية ولكن أ.عبدالله طحاوى عنوان الفقرة الاخيرة(كسبنا صلاة النبى)هذا التعبير أخشى أن يكون حراما لأن صلاة المسلم على نبيه لها أجر من الله عظيم يبقى (كسبنا صلاة النبى) عليه أفضل الصلاة والسلام و ان كنت تقصد أنه ماذا يكسب الانسان بقراءة القران دون تدبر ولكن أخشى الوقوع فى الخظأ ووو الله اعلم ما رأيك"
archived = "2010-03-14"
