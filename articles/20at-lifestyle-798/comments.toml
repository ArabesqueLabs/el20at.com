text = "السلام عليكم. على الرغم من انى اول مرة اسمع عن الشيخة شرين الا انى من تعليكم عليها اعجبتنى جدا فهى مثال جيد للبنت المسلمة غير المتزمتة التى تحاول ان تضيف شيىء لبنات جيلها .شيىء اسلامى من الدرجة الاولى مغلف بشىء من المرح حتى تنصت لة الفتايات الصغيرات 0وفقها اللة الى كل ما هو خير"
