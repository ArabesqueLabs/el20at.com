text = "( اعارض بشدة العدوان على الدولة العبرية )<br />هو منذ خلق اسرائيل فى المنطقة استطاع احد العدوان على الدولة العبرية والا هى اللى بتعتدى وتقتل وتحتل ارض كل يوم - اية الكلام الماسخ بتاعك دة - انت بتغير جلدك لية يا ولد - ليكن فى معلومك ومعلوم اسيادك ان اسرائيل هى عدوتنا وعدوة اولادنا من بعدنا حتى يمكن تحرير الارض والمسجد الاسير -0 هل تعرفة - المسجد الاقصى - ولو بعد 500 سنة<br />احنا لينا تار يا ايمن وزلنا دم ساح على رمال سيناء والدم بالدم<br />احنا لنا تار كبير"
