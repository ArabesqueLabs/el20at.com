subject = ""
author = "كلة فى اللبوريا"
posted = "2009-06-14"
text = "انتخابات اية<br />المفروض السيد رئيس الجمهورية يعين كل الاعضاء اللى هو عايزهم ويبتهى الموضوع<br />بلا مجلس بلا زفت<br />بيغمل اية المجلس غير تنفيذ طلبات الحكومة وكانهم شوية موظفين فى السكرتارية<br />تعيين كل اعضاء مجلس الشعب امثل واحسن طريقة ومن الاخر كدة وبلاش تمثيل على بعض<br />اللبوريا ورمت"
archived = "2009-06-17"
capture_url = "https://web.archive.org/web/20090617225315/http://www.20at.com:80/masr/2khbar/12354-2009-06-14-06-04-40.html"

[[comments]]
order = 1
subject = ""
author = "الديمقراطية"
posted = "2009-06-14"
text = "شوفوا البلد مليانة ديمقراطية<br />الناس تنتخب اللى هى عايزاة وتحط مطالبها فى صناديق الاقتراع بحرية تامة<br />وبعدين الحكومة تاخد الصناديق دى تولع فيها<br />وتقدم صناديق تانية للجنة الفرز وامام كل المراقبين تفتح الصناديق التى اعدتها الحكومة وعملت اوراق انتخابية بمعرفتها تنجح اللى عايزة تنجحة وتسقط اللى عايزة تسقطة<br />ويكون الفرز سليم 100 %<br />وسلم لى على الاخوان<br />وعلى الوفد"
archived = "2009-06-17"
capture_url = "https://web.archive.org/web/20090617225315/http://www.20at.com:80/masr/2khbar/12354-2009-06-14-06-04-40.html"

[[comments]]
order = 2
subject = ""
author = "حبيب العادلي"
posted = "2009-06-14"
text = "وانا جاهز على الاخر<br />الحمد لله القضاه اللي كانوا بيشرفوا على الانتخابات راحو في ستين داهية<br />وما حدش حيقرفنا تاني<br />وعلشان خاطر اريحكوا وما تتعبوش نفسكم<br />75% للحزب الولطني<br />و25% للباقي اخوان بقا على وفد على مستقلين على بطيخ على شمام<br />كله مش حيزيد على 25%<br />يلا بقا هيصوا"
archived = "2009-06-17"
capture_url = "https://web.archive.org/web/20090617225315/http://www.20at.com:80/masr/2khbar/12354-2009-06-14-06-04-40.html"

[[comments]]
order = 3
subject = ""
author = "ريحوا انفسكم"
posted = "2009-06-14"
text = "كل مقاعد النسوان اللى فى الكوتة مش علشان تمييز الحريم فى بر مصر ولكن لا الحزب الوطنى حجزها لعضواتة مقدما<br />فمفيش لا اخوان ولا اخوانات<br />الحزب الوطنى معاة الكومى وهيقش المقاعد كلها وذلك قبل انتخابات الرئاسة القادم"
archived = "2009-06-17"
capture_url = "https://web.archive.org/web/20090617225315/http://www.20at.com:80/masr/2khbar/12354-2009-06-14-06-04-40.html"

[[comments]]
order = 4
subject = ""
author = "30 مليون جنية"
posted = "2009-06-14"
text = "عضو مجلس الشعب عن دائرتنا صرف 30 مليون جنية فى انتخابات مجلس الشعب الماضية - وهو عضو الان ويجلس فى القاعة فى تالتة اول مع مدرس الفصل الحاج سرور<br />هل صرف تلك الاموال من اجل الوجاهة والحصانة ؟<br />كلا<br />صرفهم بزينس واثتثمار<br />يعنى عوض ال 30 مليون عشر مرات وكانة مثتثمر ووظف اقربائة واولاد محبية فى البنوك والوزرات والكليات الغير مدنية بتاع الواسطة وكشف الهيئة<br />مجلس شعب اية<br />مفيش فايدة<br />رغم انة كان عندنا برلمان من قبل الاحتلال البريطانى وما يطلق علية مجلس النواب سنة 1864 ميلادية وكان مجلس النواب هذا يقيل الحكومة ويغير رئيس الوزراء<br />انما الان<br />الصورة زى الزفت<br />ولم نتعلم حتى من انتخابات لبنان ولا انتخابات اسرائيل ولا حتى ايران<br />ريحوا نفسكم<br />فالكل مصفق للنظام واولهم الاخوان"
archived = "2009-06-17"
capture_url = "https://web.archive.org/web/20090617225315/http://www.20at.com:80/masr/2khbar/12354-2009-06-14-06-04-40.html"

[[comments]]
order = 5
subject = ""
author = "مش ححبك"
posted = "2009-06-14"
text = "ولزومه ايه بس<br />اخوان<br />اخوات<br />مستقلين<br />اقباط<br />وطني<br />كفاية<br />كل دا لزومه ايه بس يا جماعة<br />لان كله حيشتغل من تحت جزمة سعادة الرئيس<br />سعادة الرئيس كيقول بخ كله حينزل تحت الكراسي<br />يبقى لزومه ايه بس<br />ـــــــــــــــــــــــــ<br />هو لزومه حاجه واحده<br />تعود بالنفع على اللي حيكسب في الانتخابات<br />حيبقى معالي النائب<br />حيبقى راجل باشا كبير<br />وياخد حقه من البلد الوسخه دي<br />بس مش حيعمل حاجه<br />حيعمل لنفسه وبس<br />حيخدم نفسه وبس<br />ـــــــــــــــــ<br />الا من رحم ربي"
archived = "2009-06-17"
capture_url = "https://web.archive.org/web/20090617225315/http://www.20at.com:80/masr/2khbar/12354-2009-06-14-06-04-40.html"
