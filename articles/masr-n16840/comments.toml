[[comments]]
order = 1
subject = "أنها لن تعتزل الغناء، ولكن ستتجه للأناشيد الدينية،"
author = "msh bhbk"
text = "صوت المرأة عورة<br />بعد الحجاب اتجهي الى طاعة الله ورسوله صلى الله عليه وسلم والسير على منهج النبي<br />اتجهي الى تعليم اطفال المسلمين تلاوة القرأن"
archived = "2008-09-19"
capture_url = "https://web.archive.org/web/20080919124828/http://masr.20at.com:80/newArticle.php?sid=16840"

[[comments]]
