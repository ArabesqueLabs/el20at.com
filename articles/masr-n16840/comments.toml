subject = "ههههههههههههه"
author = "مستر"
text = "النور طالع من وشها على فكرة الصورة اللى موجودة دى قبل الحجاب يا سيدى ربنا يهديها هى وكل بنات المسلمين بس بلاش شغل الدروشه ده"
archived = "2008-09-19"
