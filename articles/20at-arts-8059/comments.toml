[[comments]]
order = 6
subject = ""
author = "داني"
posted = "2008-07-18"
text = "أشكركم على هذا الموضوع المهم وأقو للأخ الي يقول مو السعوديه بس ؟<br />أقول ان هذه الرغبه الجنسيه الحيوانيه ليس لها دين ولا وطن ولا ثقافه يوجد اناس مثقفين وأصحاب دين وأأمة مساجد او قسيسين مسيحين اي رجال دين قريبين من الله أو مهندسين او رجال أعمال ويصدر منهم تحرش جنسي الى بناتهم او بنات أخواتهم أو العكس والحقيقه أعرف الكثير من هذه القصص حصلت مع بنات . وأعرف بنات مقتنعين بأن علاقتهم بأخيهم صح او بعمهم او خالهم وليس لديهم اي مانع من الاستمرار بها .<br />وتعرفت على العديد على الانترنيت وثرت هذا الموضوع مع عدة بنات . وتعترف بأنه يوجد علاقه مع أخيها وهي مدمنه عليها ولا تستطيع ان تغيرها او تتنازل عنها وانها هي وأخيها سعيدين بهذه العلاقه وبأعمار مختلفه لاتتعدى 20 سنه"
archived = "2010-06-15"
capture_url = "https://web.archive.org/web/20100615173135/http://www.20at.com:80/20at/arts/8059.html"
