author = "سعد الكلثم"
posted = "2008-01-19"
text = "اختي زين …<br />هذا من ضعف الوازع الديني وبعد عن الله سبحانه وتعالا …<br />وهذا من رفقه السوء او من التلفاااز …<br />فـ يجب مراعات الشخص لهذه الامور ولا يستهون فيها مهماااا كان …<br />اخوك :سعد الكلثم"
archived = "2010-06-15"
capture_url = "https://web.archive.org/web/20100615173135/http://www.20at.com:80/20at/arts/8059.html"

[[comments]]
order = 1
subject = ""
author = "بنت مكه"
posted = "2008-01-19"
text = "أولا اود شكر الاخت زين على هذا الموضوع الرائع الذي يستحق الوقف عنده والتأمل فيه جيد<br />فمشكلة زنا المحارم أصبحت كالنار تنتشر انتشار سريع في المجتمع ولكنها تنتشر بصمت<br />وذلك لعدة أسباب منها الخوف من المجتمع<br />ولا يرى من يصمت ويخاف من مجتمعه أن هذا المنزل الذي هو فيه لا يمت بأي صلة تذكر ببيوت المسلمين هذه البيوت التي يحرم فيها الزنا بأي حال أصبح أوليائها هم من يمارسون هذه الكبير<br />ولكن لا يسعنا في ظل هذا الصمت الا ان نقول<br />حسبنا الله ونعم الوكيل"
archived = "2010-06-15"
capture_url = "https://web.archive.org/web/20100615173135/http://www.20at.com:80/20at/arts/8059.html"

