subject = ""
author = "Mostafa"
posted = "2008-01-20"
text = "لقد سمعت من الشيخ (احمد ديدات) عليه رحمة الله ان التفسير العلمي لانتشار هذه الظاهره هو نشر اخبارها لان الانسان بطبيعة فطرته لا يمكن له ان يفكر في مثل هذه الاشياء الا بعد القراءه عنها وتكلم عن بحث نفسي اجري في اوروبا انه بسؤال المتورطين في هذه الافعال عن السبب قالوا انهم سمعوا بمن فعلها قبلكم فارجوا حذف هذا المقال من الموقع -على اهمية الموضوع- الا ان هذه الاحداث يجب ان تطوى ولا تروى والله ولي التوفيق.."
archived = "2010-06-15"
capture_url = "https://web.archive.org/web/20100615173135/http://www.20at.com:80/20at/arts/8059.html"

