[[comments]]
order = 0
subject = "حقهم"
author = "البدراوي"
posted = "2008-10-22"
text = "السلام عليكم<br />هي جامعة الازهر دي مابتخلص من المشاكل بس الاخوان عندهم حق دا حقهم انهم يسكنوا طالما بيجيبوا تقدير اما انهم جماعه محظورة اولا دا مالوش دعوا بالجامعه ولا المدينه وحتي لو محظورة هيا جامعة الازهر مش هدفا نشر الوسطية لما هيا مش عرفه تعمل كدا مع الطلبة بتوعها يبقي ملهاش لازمه والطيب خليه قاعد اهوا دخل معاهد وكان هيقسمه السنه دي لولا الاساتذة بيجامل رئيس الوزرا ربنا يهدهم ويرجع لنا الازهر منارة العدل والحق<br />سلامو عليكو"
archived = "2008-10-25"
capture_url = "https://web.archive.org/web/20081025200917/http://masr.20at.com:80/newArticle.php?sid=17993"

