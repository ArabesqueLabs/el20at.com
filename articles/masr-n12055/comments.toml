subject = "حد يقوللي ايه الفرق"
author = "pop"
posted = "2007-10-24"
text = "انا شايف ان كل المساوىء اللى كانت موجودة ايامه موجودة حاليا بمسميات مختلفة<br />الاقطاع - البوليس السياسي - الطبقية ماهى موجودة دلوقتى فيه حد مش شايفها<br />ماكانش فيه مجانية تعليم ...امال الدروس الخصوصية اللى حاصلة دلوقتى ببلاش ولا فيه طالب يقدر يستغنى عنها<br />وطنية و عروبة ..اول من حارب اسرائيل ...اسلحة فاسدة ..الحاشية نفس مبررات نكسة 67<br />بس الفرق ان ماكانش فيه حاجة فى العالم الا وموجودة فى مصر<br />سينما مسرح ثقافة خطوط مواصلات تصاميم معمارية<br />عامة اهو راح وبقيت السلبيات اللى موجودة فى كل زمان ولا تتغير بتغير البشر"
archived = "2007-10-25"
capture_url = "https://web.archive.org/web/20071025010608/http://masr.20at.com:80/newArticle.php?sid=12055"
