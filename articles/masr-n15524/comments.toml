[[comments]]
order = 2
subject = "موبايلز موبايلز"
author = "Ahmad Hima"
posted = "2008-05-03"
text = "أزمة عيش وموبايلات بالعبيط ، عمال المحلة وناس بتدور على موبايل للطفل علشان يبقي معاه من اول ما يتولد<br />ناس بتصرف فلوسها ع الفشل الكلوي والسرطان وناس بتشتري نغمات وتتصل بـ 0900<br />الموبايلات وانتشارها دليل على ازدواجية الشعب المصري<br />دكتور زويل كان مرة بيحكي بيقول كنت قاعد انا وكذا عالم تانين كلنا حاصلين على شهادات عالمية فى مجالات مختلفة محدش فينا كان شايل موبايل ، مصر اكبر دولة شوفتها بتستخدم الموبايل واستخدامه فى مصر يفوق استخدامه فى امريكا وكندا<br />دلوقتى بقي الموبايل متاح للأطفال مش للكبار وبس<br />مع انه المفروض متاح للي محتاجه وبس مش علشان واحد يقعد يرن بيه ويتمنظر وينتهك حرية الاخريين سواء فى موصلات او غيره<br />كمان سبب لي بيحصل دا اننا بنمشي ورا الناس يعني واحد يقول يعني ابني هيمشي من غير موبايل جديد وسط زمايله يروح يشتريله موبايل جديد اخر حاجة ويستلف الف جنيه علشان يجيبه يقوم الولد يتمنظر بيه يروح ابو واحد تاني يقوله والله لأجيبلك احسن منه وواحد منزلش مصر كمان ويتصل بعمه اللى مسافر الخليج وهاتلي معاك موبايل معرفش ايه معرفش كام وابعته مع اى حد نازل ولما تيجي نبقي نتحاسب وحلني على ما يسدد تمن الموبايل بقي الواد يتمنظر بالموبايل يروح واحد تالت ابوه يتصل باخوه اللى لندن ووالنبي يا ماي برازر اشتريلي موبايل اخر فيرجين من كشك الموبايلات اللى جنب ساعة بيج بين والولد ياخد الموبايل ويتمنظر وتستمر اللعبة والناس مش لاقيه العيش<br />وعجبي !!"
archived = "2010-03-14"
