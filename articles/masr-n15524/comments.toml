[[comments]]
order = 0
subject = "حاجة تقرف"
author = "لخص يا عم الأمور"
text = "حاجة تقرف وقلة أدب و زوق وعالم معندهاش نقطة احترام لنفسها فاكرينها عالم أبوهم يابني آدم يا محترم انت ميش قاعد في بيتكم ولو قاعد في بيتكم هتحترم نفسك وميش هتعلي الصوت كده ولاحظ ان ممكن يكون في حد تعبان أو عند أي ظرف ميش عايز يسمع حاجة كل موبايل من دول معاه سماعة إلبسها واحترم نفسك علشان الناس تحترمك.<br />في حاجة تانية بره الموضوع ده بس في حد شاف قانون المرور الجديد ، في حد يقدر يقولي إيه الهبل ده؟"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502204142/http://masr.20at.com:80/newArticle.php?sid=15524"

[[comments]]
order = 1
subject = "عادي كله عادي"
author = "الأسيوطي بك"
text = "عادي يعني انتم هتمثلوا ماللي يشغل يشغل اللى عايزة..... مش طالبه هدوء خالص يعني في ايه بس عاديييييييييييي وانا عن نفسي بتساينى اصوات الاغاني اللي في الموبايلات بدل الواحد ما يعكنن على نفسه ونعد نفكر نسمع اغاني"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502204142/http://masr.20at.com:80/newArticle.php?sid=15524"
