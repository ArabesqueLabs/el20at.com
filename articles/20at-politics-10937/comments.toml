[[comments]]
order = 2
subject = "من كانت حكومته شرعية فليرم حكومة حماس بحجر"
author = "ahmed"
posted = "2009-01-13"
text = "من كانت حكومته شرعية فليرم حكومة حماس بحجر<br />أ/ محمد سعد حميدة<br />بداية انا لست من الاخوان و لكنني من المسلمين<br />و لن ازعم انني على الحياد<br />بل انا متحيز و بكل كياني لحركة حماس<br />كفانا جنونا و كذبا ان ندعي الحياد بين الجاني و الضحية<br />يشرفني ان انحاز لحماس انحياز الاخ لاخيه في الاسلام و العروبة و الجوار و في الوقوع تحت دائرة الظلم ايضا<br />و ليس انحيازنا لحماس يجعلنا ندافع عنها بالحق و بالباطل و انما ندافع عنها في الحق و ننصحها ان جنحت الى باطل<br />هذا المقال هو استباق لخطط الاعلام المزور<br />لان حماس علمتنا السبق و عدم انتظار الضربة الاولى من الباطل<br />حكومة حماس هي حكومة شرعية بل هي الحكومة الوحيدة الشرعية في المنطقة باسرها<br />حكومة حماس حكومة شرعية استنادا للقانون و الدستور الفلسطيني فهي الحكومة الشرعية و هي الاغلبية البرلمانية (اغلبية اكثر من الثلثين)<br />و هي حكومة شرعية استنادا لمبادئ الديمقراطية -تلك التي يحكمونها عندما يحلو لهم و يجنبونها عندما تاتي عكس احلامهم- حماس معها اصوات ثلاثة ارباع الشارع الفلسطيني في الضفة و غزة قبل الصمود و نظنها زادت بعده<br />كما ان كل الانتخابات الطلابية و النقابية التي تمت فيما بعد توليها السلطة اتت النتائج في صالحها و بعضها في الضفة التي لا تسيطر عليها حماس<br />و هي حكومة شرعية استنادا للامر الواقع<br />نعم الامر الواقع الذي جعل كل حكومات المنطقة شرعية بصرف النظر عن اساسها الباطل<br />شرعية الامر الواقع الذي يتغنى به علماء السلاطين الذين لا يعلمون من الدين الا طاعة ولي الامر<br />حماس بحكم الامر الواقع هي الحاكم الفعلي لغزة<br />بل هي من انتزعتها مرتين مرة من ايدي الصهاينة و مرة من ايدي عملاء الصهاينة<br />و بحكم الامر الواقع لم يستطع الحصار الدولي و لا القصف الصهيوني المدعوم دوليا من زحزحتها<br />مما دفع بعض قادة و عقلاء الصهاينة يدعون ساستهم الى التفاوض مع حماس باعتبارها هي الواقع الفعلي الذي فشل الجميع في ازالته<br />حكومة فلسطين الشرعية التي تمثلها حماس هي الحكومة الشرعية سياسيا فهي خير من جمع بين المقاومة و التفاوض بلا طغيان ايهما على الاخر و لا يخفى على احد حجم المكاسب السياسية التي تحققها كل يوم بسبب الاسير الموجود لديها لدرجة ان قادة العدو تمنوا موته حتى يتخلصوا من استثمارات حماس السياسية بسببه<br />حكومة حماس تحمل الشرعية الاجتماعية لانها جزء من نسيج المجتمع الفلسطيني<br />فشهداء فلسطين في اي مخيم او منطقة فقيرة هم شهداء حماس و اقارب حماس و حلفاء حماس من الفصائل المجاهدة التي تشارك حماس اجر و واجب الجهاد و تحمل معها شرف المقاومة<br />فحماس من الفلسطينيين و فلسطين منهم يموت قادتهم وسط الناس و معهم و قبلهم احيانا و يقدمون ابنائهم للجهاد قبل ان يدعون الاخرين للجهاد<br />و صدق المفسرون المتعمقون في قوله تعالى (اولي الامر منكم) حين دققوا في كلمة \\\"منكم \\\"<br />فهل انتم يا حكام العرب و رجال اعماله و جنرالاته الكبار من شعوبكم ؟؟<br />هل يستطيع احدكم ان يمشي في الاسواق و يشتري كيلو طماطم ؟؟ (لا اظن ابدا)<br />حماس هي الحكومة الشرعية الوحيدة في المنطقة الممتدة من العراق الى موريتانيا<br />و شرعيتها سياسية و اجتماعية و دينية و واقعية و تاريخية و جغرافية و طبقا للقانون و الدستور و الديمقراطية و حقوق الانسان<br />فمن كان من حكام العرب لديه دليل واحد على شرعيته غير عصا الامن المركزي فليخرج لنا نفسه و يقول و هو ينظر للكاميرات ببصر حديد و يقول انا حاكم شرعي لدولتي<br />يا حكام العرب<br />حكومة حماس هي الحكومة الوحيدة الشرعية في المنطقة و من كان منكم يحمل مثقال ذرة من شرعية فليلقها بحجر<br />الكاتب السياسي/ محمد سعد حميده"
archived = "2010-03-14"
