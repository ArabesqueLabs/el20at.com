text = "في الحقيقة نشعر بالخزي والاسى عندما نرى هذه الحرفة الشريفة التي تجمع بين العمل الصالح والانساني ، اصبحت مجرد زينة وديكور للاجانب والسياح .. وهذا الأمر يجب ان يفجر في اوساطنا نقاش قبل فوات الاوان.. كيف نحافظ على وجود الكراب بيننا بعزه وقيمته التي تركها لنا اجدادنا.. كيف نبقي هذه الحرفة شامخة عوض ان تتعرض للمسخ والعولمة؟؟<br />وشكرا للزميلة ليلى على الموضوع."
