posted = "2008-08-22"
text = "المقال جميل ، فالاخت ليلي لفتت نظرنا لشئ كان ممتعا في حياة المغاربة ، وانت تتجول في السوق ، اذا عطشت فما عليك الا ان تنصت الى مصدر صوت الناقوس حتى تشرب …وباستمتا ع كذالك لانك تشرب وامامك لوحة فنية رائعة تنطق بكلام طيب وحلو : وهو كلام الكراب الذي يذكرك بالله و ببر الوالدين، ويودعك بالشكر والدعاء لك ولوالديك. بالله عليكم اليس هذا ممتعا حقا !! شكرا لك اخت ليلي أمزير على هذا المقال الجميل."
archived = "2010-04-13"
capture_url = "https://web.archive.org/web/20100413112951/http://www.20at.com:80/20at/lifestyle/9919.html"

