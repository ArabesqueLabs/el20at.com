subject = "زي غير لائق"
author = "حمزة البغدادي"
posted = "2008-02-20"
text = "للاسف زي قذر ونحن العراق ابتلينا به ومع العلم نحنو لا خليجيين ولا نعترف به لانه هو اللذي نكس العراق في الاحتلال وتسليم دول الخليجيه الهراق للولايات الامريكيه المجرمه واصبح حالنا حال القتل والتهجير والذبح والطائفيه حسبنه الله ونعمه الوكيل"
