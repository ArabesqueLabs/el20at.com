[[comments]]
order = 2
subject = "هههههه  ههه  والله عجب"
author = "f"
posted = "2008-02-21"
text = "والله من جد زيّ متعب تخيلوا حتى جابت لنا الصلع في روسنا تقول كأنه قدر كاتم بالذات في المناطق اللي جوها حااااااااااار<br />عاااد شوف كيف حدث ولا حرج حتى الثوب أحس أنه ثقيل و قال إيه قال الموضه في الثوب يكون ضيق عشان يمشي مثل البنت ..؟؟!! ويطلع شكله إستايل والله عجبي , وأزيدكم من الشعر بيت أذا عاد أحد يبغى يجرى قام سحب بطرف ثوبه على فوق \"إلأ وهوه طبجججججججججججج \" على الأرض هذا مثال لا تقول النك ما راح تجري .. وهذا مجرد رأي بدون أي إستفزاز."
