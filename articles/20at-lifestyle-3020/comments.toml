subject = "الناس اجناااااااااس"
author = "ريماااااااا"
posted = "2008-05-09"
text = "يااخي انت وياه كل منطقه في العالم لها زي خاص فيها .... وبعدين بالعكس وش فيه الشماغ والعقال رززززززززززززه وكشخه ماناقص الا الورعان يقولو (احس انه تقييييييييل ويتعب مررررررررررررره) ياحرام كسرت خاطري تصدق؟. عالاقل احسن من ازياء السودانيين هههههههههه الحمدلله والشكر<br />وافتخر صراحه ان العراق صارت ماتلبس هذا الزي ولا نتشرف مالت عليكم يا (آآآآني)<br />وجعععععععععععع .... السعودي الاصل هو اللي يفتخر بماضيه وعيال طرش البحر هذول صوتهم مو مسموع اصلا يللللللللللللله باااااااااي .... خرووووووج نهائي"
