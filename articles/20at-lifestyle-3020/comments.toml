[[comments]]
order = 6
subject = "قال غترة قال"
author = "EPS"
text = "لا و ياريتهم يصنعوها بنفسهم... اليوم سويسرا و انجلترا بيصنعوا الغتر و يبيعوها للفهمانين تبع جازستان. حتى العقال اللي كان حبل حقيقي لربط الجمل (أو عقل الجمل) من زمان غبروا تصميمه و صار مثل شريط موبيوس أو علامة انفينيتي و صبغوه أسود .... الله يكبر عقلكم (عقل من العقل في الدماغ و ليس جمع عقال)!"
