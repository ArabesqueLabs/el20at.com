[[comments]]
order = 0
subject = "الزمالك"
author = "خالد"
posted = "2007-05-09"
text = "لو تركت المساجد مفتوحه لتوجه اليها كل العابثين كفانا الذهاب في وقت الصلاة ولا داعي ابدا لان نحول بيوت الله ملاجئ وفنادق ونملئها بالعابثين. الحمدلله أن هناك من يسهر على رعايتها.<br />موضوعك غريب بعض الشيء وبرجاء توضيح القصد منه"
archived = "2007-05-12"
capture_url = "https://web.archive.org/web/20070512000907/http://masr.20at.com:80/newArticle.php?sid=10129"

[[comments]]
order = 1
subject = "دي تعليمات الأوقاف في كل مكان"
author = "أبو عماد"
posted = "2007-05-09"
text = "الأصل المساجد لا تغلق وكانت قبل ذلك ملاذ لأهل السبيل ممن قطعت بهم السبل وكذا لقاء أهل الطاعة من رواده فيصلون ويلتقون فتحدث الألفة والتواد بينهم أما علاج الظواهر السلبية فيكون بالأمر بالمعروف والنهي عن المنكر وليس بإغلاق المساجد في وجه المصلين حسب تعليمات الأوقاف وهذا يدل على أن هناك يد في الخفاء تريد ان تنقطع الصلة بين الناس وبين المساجد حتى لا يقوم بدوره في توعية الناس بحقوقهم وواجباتهم فلا يكون مصدراً للقلق للحكومات وإن تخلف دور المسجد في حياة المجتمع نتج عنه تفكك في الأواصر بين أفراده سواء على مستوى الأسرة أو مستوى الجيران او مستوى أخوة العقيدة.<br />يجب أن تكون هناك وقفة إرشادية توعوية لعلاج السلبيات وتمكين المسجد من أداء دوره هذا والله يقول الحق وهو يهدي السبيل"
archived = "2007-05-12"
capture_url = "https://web.archive.org/web/20070512000907/http://masr.20at.com:80/newArticle.php?sid=10129"

