posted = "2007-05-09"
text = "والله بصراحة الحرامية مش سايبين حاجه في حالها دا حتى بيسرقوا الحنفيات فاذا كان اغلاق المسجد حفاظا على محتويات المسجد من السرقة فهذا شيء ضروري<br />الاخ مدير الموقع الرمز الالكتدوني ساعات بيبقي راكب علي بعضه ومش مقروء شوفولنا حل ضروري"
