subject = "مغلق للصلاة!"
author = "مصـ( الخير )ـعب"
posted = "2007-05-09"
text = "وأنا في الكلية نزلنا نصلي الظهر اللي أذن واحنا في المحاضرة لقينا جامع الكلية الرئيسي مقفول رحت كتبت \"مغلق للصلاة\" على لوحة كبيرة وعلقناها على باب الجامع أنا وواحد زميلي!"
archived = "2007-05-12"
capture_url = "https://web.archive.org/web/20070512000907/http://masr.20at.com:80/newArticle.php?sid=10129"

