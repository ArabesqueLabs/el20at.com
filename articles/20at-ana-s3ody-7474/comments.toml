subject = "فتوى بتحريم تمثيل أدوار الكفار؟"
author = "حسب"
posted = "2007-10-30"
text = "اللجنة الدائمة للبحوث العلمية والإفتاء أصدرت فتوى في وقت سابق تحرم أن يمثل المسرحيون أدوار الكفار أو يتلفظون بكلماتهم حتى لو كان الهدف من المسرحية مثلا كشف مؤامرات الصهاينة ، مشيرة إلى أن المسرحية أو التمثيل على هذا الوجه لا يجوز، بل هو منكر<br />يعني إيه تمثيل مشاهد الكفار أو الصهاينة لا يجوز<br />كيف هذا<br />طالما هناك فتوى من هذا النوع أكيد سيتأخر المسرح"
