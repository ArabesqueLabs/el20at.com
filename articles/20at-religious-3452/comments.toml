[[comments]]
order = 3
subject = "الشكر"
author = "خادم القرآن"
posted = "2007-03-26"
text = "بعد التحية والتقدير<br />أشكركم شكرا يليق بجنابكم على الخدمة التي تقومون بها للإسلام والمسلمين<br />خدمة من اطلع عليها - ولو مرة - تجعله يتوب إلى الله ويستغفره ،<br />ولا يعيقه بعد ذلك شيء عن عبادة الله والإخلاص في العمل له ،<br />داعين المولى عزوجل أن يكلل أعمالكم بنجاح ، ويتوب علينا وعليكم وعلى المسلمين جميعا ،<br />والسلام عليكم ورحمة الله وبركاته . أخوكم في الله / خادم القرآن ، ومعلمه السنغالي"
archived = "2010-03-14"
capture_url = ""
