[[comments]]
order = 0
subject = "كلاب السلطة"
author = "معداوى"
text = "هذا الضابط المشبع غرور وعظمة كدابة علموها لة فى كلية الشرطة وعلموة ايضا انة فوق القانون وفوق الناس كلها وانة الحكومة نفسها يستبيح اعراض البشر وكرامتهم لارهابهم لمصلحة نظام بوليسى ديكتاتورى<br />عندما اتحرق هذا الضابط بواسطة المدونون الشباب الشجعان بالصوت والصورة وظهرت عورة الحكومة عارية وكريهة امام العالم كلة وعلى شاشات الكمبيوتر والتلفزيون ضحت الحكومة بكلبها المسعور لانقاذ ماء الوجة<br />كلاب الحكومة زى خيل الحكومة اخرتها الضرب بالنار<br />ماذا يبقى للضابط ابن الناس المؤدب وليس الواطى غير خدمة الناس وتفانية فى خدمتهم<br />لا يبقى للضابط ابن الناس الطيبين الا محبة ناسة وخدمتة لهم<br />ولعل هذا يكون عظة لكلاب السلطة لتفيق وتقف مع شعبها وليس مع اللصوص وسارقى الوطن<br />تحية لكل المدونون الشبان الذين كشفوا الفساد"
archived = "2007-11-09"
capture_url = "https://web.archive.org/web/20071109182735/http://masr.20at.com:80/newArticle.php?sid=12293"

[[comments]]
order = 1
subject = "مكالمة مستفزة"
author = "كتكوتة"
text = "في حلقة العاشرة مستء جاء اتصال من ضابط مجهول الهوية غاضبا لفرح الشاب عماد الكبير لانتصار القضاء له واخذ حقه وقال كلام كتير جدا واسلوبه كان محترم بس كلامه معجبنيش وقال انه يشعر بالدونية لان مهنته دونية واحنا بنقولله ان مهنة الشرطة مش مهنة دونية دي مهنة مرموقة والصغير قبل الكبير فاهم ولما بتسال طفل عايز تبقى ايه بيقول ابقى ظابط عشان اقبض على الحرامي وبمناسبة الحرامي بقى قال الظابط في المكالمة ان الناس بتكره ظباط الشرطة وانا عايزة اسال لما حرامي يدخل بيتنا ويكسر الباب ويسرق حاجات ب 19 الف جنيه ونروح نعمل بلاغ في قسم الشرطة والقسم يبعت بعد 18 ساعة عسكري يقف يتفرج على الشقة ومافيش حاى في ايده دفتر عشان يكتب فيه كلمتين تشفي غليلنا واختى الصغرى تجيب له ورقة وقلم عشان يحصر المسروقات ويكتب مواصفاتها فيجبر بخاطرها وياخد منها الورقة ويعد يشخبط فيها شوية ويبسيبنا ويمشي<br />نكره الظباط بتوع القسم اللي مشؤلين عننا ولا لا؟ والمفروض انهم بياخدوا رواتبهم مننا عشان يحمونا ويضوروا على المجرمين ويقبضوا عليهم ويرجعولنا حاجتنا ده يعني زي ما بنسمع ونشوف في الافلام انما لغاية النهاردة سنتين ولا حس ولا خبر والجميع يعلم ان القسم بيكون عارف المسجلين والبلطجية وتجار المخدرات وعارفين مين ممكن يكون ارتكب الجريمة كذا بس مافيش عندهم ضمير انهم يتحركوا الا لما يكون في مظاهرات او حاجة تانية مالهاش دخل بحماية المواطن طبعا مش كلهم في منهم محترمين جدا وعندهم ضمير عالي جدا بس الغالب دلوقتي هو النموذج الاول واكبر دليل على كده ان الشارع المصري بقى في منتهى التسيب من الالف الل الياء واسفة اسلوبي في شدة شوية بس انا استفزني ظابط الشرطة اللي بيتكلم وكانه من حق الظابط انه يعتدي على المواطن اخلاقيا طالما بيؤدي واجبه ياسلااااااااااام منطق غريب"
archived = "2007-11-09"
capture_url = "https://web.archive.org/web/20071109182735/http://masr.20at.com:80/newArticle.php?sid=12293"

[[comments]]
order = 2
subject = "الخراب عنوانة الشرطة"
author = "على السوهاجى"
text = "من اكبر مشاكل الشعب المصرى الان هى الشرطة وهى تاكل الاخضر واليابس وتوقف التنمية فى البلد وتضيع الميزانية وتتعدى المخصصات لها كل ميزانية وكل هذا من اجل حماية النظام ومطالب الناس هى<br />الغاء قوات الامن المركزى بالكامل وهى اصبحت تقف على ناصية كل شارع وحارة وهى مخصصة لقمع المظاهرات ومسلحة بالمدرعات والسيارات وكانها قوات مسلحة<br />الغاء سلاح البلطجية وهم مجندون بالملابس المدنية ومدربون على الكراتية وهم ظهير للامن المركزى ومخصصين لقمع المظاهرات وحماية الرؤساء والوزراء وةحراسة الشوارع اثناء المواكب وزاخر حادث لهم ضرب طلبة عين شمس كما انهم يقومون بتزوير الانتخابات ودفعهم لاعطاء اصوات لشخص معين<br />قوات مباحث امن الدولة والغائها تماما من المراكز والمحافظات وجعل همها حراسة الوطن من الجواسيس والمخربين من الخارج وليس تعذيب الشعب المصرى<br />هدف الشعب شرطة نظامية حديثة باسلوب حديث انما شرطة المماليك هية ميت هناك والصيع اللى مسميين نفسهم باشوات لية ما اعرفش<br />الى الامام يا اخت دعاء مقالك فية احترافية اكثر من قبل"
archived = "2007-11-09"
capture_url = "https://web.archive.org/web/20071109182735/http://masr.20at.com:80/newArticle.php?sid=12293"

[[comments]]
order = 3
subject = "و شهد شاهدمن اهله"
author = "ريما"
text = "بصراحة يا دعاء انا مبسوطة بتعليق البراء<br />هي اول مرة بنتقد اسلوب كاتب مقال بس بصراحة رغم اني معجبة بكتاباتك الا انو انك بتتناولي المواضيع احيانا بشئ من السخافة و انا اسفة على التعبير بس حاولت الاقي تعبير اكثر دبلوماسية بس بصراحة معرفتش<br />المفروض انك صحفية بس يا ترى ليش ما بحس عندك ثقافةكافية؟ مع تاكيدي اني حبيتلك بعض مقالات وحسيت اسلوبك فيها اقوى<br />انا اسفة اذا تعليقي رح يدايقك ...وموفقة"
archived = "2007-11-09"
capture_url = "https://web.archive.org/web/20071109182735/http://masr.20at.com:80/newArticle.php?sid=12293"

[[comments]]
order = 4
subject = "البراء والدواخلى"
author = "واحد وبس"
text = "الجوز الخيل والعربية<br />ما كل واحد فيكم يتلم والا انتم اعداء النجاح<br />عايزين نقرأ لكم حاجة<br />انما نقعد زى عواجيز الفرح نقول العروسة مناخيرها طويل وشعرها فرشة سلك بتاع حمام وهم عواجيز شعرهم واقع وركبهم سايبة وبيتلخلخوا<br />اخ براء اخ شريف<br />عايزين نشوف شغل مش احقاد<br />ربنا يكرمكم زى ما كرم سليمان الحلبى"
archived = "2007-11-09"
capture_url = "https://web.archive.org/web/20071109182735/http://masr.20at.com:80/newArticle.php?sid=12293"

