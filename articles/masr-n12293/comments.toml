subject = "ورب ضاىة نافعة"
author = "مش لازك"
text = "يقول المثل يا جماعة ورب ضاىة نافعة<br />بسبب هذا الموضوع وغيره<br />الضباط ماشيين زي الجذم دلوقتي"
archived = "2007-11-09"
