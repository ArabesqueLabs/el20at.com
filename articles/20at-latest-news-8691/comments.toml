text = "الحب فى القلب وكتابة الشعر فى النبى لن ترد عنه الإساءة فقد قيل فيه شعراعلى مدى العصور والغرب لايفهم الشعر العربى كفانا هدرا وضياعا لأموال المسلمين فلندافع عنه بإظهار حقيقة الدين الذى جاء به وبلغات العالم ."
