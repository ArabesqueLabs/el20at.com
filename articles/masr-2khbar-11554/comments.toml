[[comments]]
order = 2
subject = "هل يمكن التبرع بالاجهزة التناسلية مجرد سؤال"
posted = "2009-03-12"
text = "ايه رايكم يا جماعة لو نفتح التبرع بالاجهزة التناسلية<br />اصل الاجهزة دي علشان خاطر تشتغل صح عايزه فلوس كتير اوي عايزه شقه وشبكه ومهر ... الى اخره<br />وانتوا طبعا عارفين البير وغطاه<br />فاصبحت هذه الاجهزة عبء على اصحابها<br />ايه رأيكم لو يتم التبرع بيها للي معاه فلوس"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الى المعلق اللى فوق"
author = "اكتب اسمك هنا"
posted = "2009-03-12"
text = "الاجهزة التناسلية محدش عايزها علشان تتبرع بها<br />لانة يا حبيبى فية بدائل صناعية<br />الكل بيحب ييجى عندنا يبدل الكلية - اصل كلاوى المصريين هايلة ورخيصة واطفال الشوارع كتير - والفقراء مستعدين يبيعوا اى حاجة<br />انت سمعت عن الطالب الجامعى اللى باع كليتة لواحد عربى بتمن كمبيوتر لاب توب كان بيحلم بية<br />اصل مصر بتتقدم بينا<br />ويظهر انها تقدمت قوى واكتر من اللازم"
archived = "2010-03-14"
capture_url = ""

