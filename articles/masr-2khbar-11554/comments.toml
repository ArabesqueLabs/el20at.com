text = "شيخنا الجليل الدكتور الشيخ/محمد سيد طنطاوى<br />حقا انت خير الرجال من عقيدة و علم و دين و فهم و انسانية<br />رحمكم اللة دنيا و اخرة<br />هكذا تفكير الانسان المتعلم و المتحضر"
