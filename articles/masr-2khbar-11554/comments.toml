subject = "بعد ايه"
author = "عسكر"
posted = "2009-03-16"
text = "صراحه كده يا مولانا من يوم سلامك علي عدو المسلمين الصهيوني معظم الشعب اولا فقد الثقه في الازهر ثانيا نزلت من نظرنا.ربنا يغفرلك ويسامحك.بس عندي طلب من سيادتك يا ريت تاخد الحكومه معاك....بعيد عنك الشعب زهق"
