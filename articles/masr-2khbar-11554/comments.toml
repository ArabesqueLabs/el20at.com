subject = "اجدع نكتة النهاردة"
author = "سعدون"
posted = "2009-03-12"
text = "هو صاحب الفضيلة مولانا لسة عندة اعضاء فى جسمة صالحة للاستعمال - يا شيخنا دى عمرها الافتراضى انتهى من زمان قوى<br />ربنا يسترها معاك يا شيخ والاعمال بالنيات"
