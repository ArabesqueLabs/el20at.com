[[comments]]
order = 0
subject = "الاستاذ هيكل قال مصر رايحة فى داهية خلال السنتين ا"
author = "صعيدى من دشنا"
posted = "2008-06-01"
text = "بما اننى صعيدى وشارب لبن حمير وانا صغير<br />اقول - ازاى الحكومة معتمدة على ان الناس هتدفع ضرايب - وان الضرايب هتبلغ 166 مليار جنية وان الحكومة هتدفع مرتبات الامن المركزى وموظفى الحكومة ومباحث امن الدولة والمدارس والمستشفيات - دى حلم ابليس فى الجنة<br />الشعب المصرى معدم معندوش حاجة يدفعها<br />عندة بطالة وصايع وجاعد يعبى الظل فى ازايز<br />امبارح فية خبر اتذاع بيقول ان الشرطة قبضوا على 1800 فلاح من محافظة البحيرة لم يدفعوا ضريبة الارض الزراعية<br />وان الشرطة حبستهم<br />طبعا الشرطة هتأكلهم وتشربهم<br />انما مش هيدفعوا لانة ببساطة معندهمش حاجة<br />البلد رايحة فى داهية لانها مش هتقدر تصرف مرتبات الموظفين لانها باعت المصانع اللى كانت بتجيب دخل للخزينة<br />البلد داخلة على مرحلة افلاس وجوع<br />الناس هيقتلوا بعض فى الشوارع علشان خطف لقمة عيش<br />انا فهمت كلامك يا استاذ هيكل وانا فى دشنا<br />احنا رحنا فى داهية خلاص"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090722/http://masr.20at.com:80/newArticle.php?sid=16074"

[[comments]]
order = 1
subject = "ديون والتزامات دولية وفى المقابل سرقة وتدميرالبلد"
author = "كتكوت الحمير"
posted = "2008-06-03"
text = "مصر تحتضر وتترنح وشعبها ربط الحزام لغاية مااتقطع وسطة وكل مواطن حيدفع من دم قلبة وقوت ولادة وولاد ولادة علشان يسدد تمن فاتورة سرقة الحيتان فى العصر الميمون عصرقانون الطوارى والقوانين المساندة لخدمة الحرامية فى نهب البلد واقحامها فى دوامة ديون واستحقاقات دولية لاتنتهى وهذا مما جعل الفساد والمحسوبية تعيش فى ازهى عصورها دون حسيب او رقيب غير رب السماء العالم بكل ماتخفية النفوس وهواللى حيحاسب كل ظالم اومفترى ووقتها مفيش لاامن ولاحرس خاص كلة عريان زى مااتولد امام البارى عزوجل"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090722/http://masr.20at.com:80/newArticle.php?sid=16074"
