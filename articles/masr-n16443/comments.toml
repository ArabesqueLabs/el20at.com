[[comments]]
order = 1
subject = "ملحص التعليق المحذوف"
author = "مش ححبك"
text = "يا استاذ صمويل رمسيس<br />اسمك جسد المشكلة<br />صمويل اسم مسيحي<br />رمسيس اسم فرعوني<br />وهي دي المشكلة<br />المسيحيين بيعتبروا انفسهم هما الفراعنه والاقباط وهما اصحاب البلد<br />وبيعتبروا ان المسلمين عرب غزاه محتلين<br />وبالتالي الاستفزاز دايما بيجي من جهة المسيحيين<br />وليس المسلمين<br />لان المسلم في مصر سمع قول النبي محمد صلى الله عليه وسلم<br />استوصوا بالاقباط خيرا<br />ونرجو من الاخوة المسيحيين مراجعة تسميتهم بالاقباط لانهم بيتكلموا عربي وانجيلهم بالعربي<br />فنسبتهم الى لغة مصرية قديمة انقرضت لا مبرر له<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />وكفاية كده لحسن عشرينات تزعل وتحذف التعليق"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626152040/http://masr.20at.com:80/newArticle.php?sid=16443"

[[comments]]
order = 2
subject = "لماذا تكرهون الاسلام كل هذا الكرة وهل الاسلام يحث على كراهية الأقباط؟"
author = "من موسوعة التعليقات المحذوفة"
text = "لماذا تكرهون الاسلام كل هذا الكرة وهل الاسلام يحث على كراهية الأقباط؟<br />السلام على من اتبع الهدى<br />فلتقفوا وقفة حق ولتسألوا انفسكم لماذا تكرهون الاسلام كل هذا الكرة<br />هل حث نبى الأسلام على كراهية الأقباط؟<br />لا والله لقد قال رسول الله استوصوا بقبط مصر خيرا<br />وقال رسول الله من اذى ذميا فهو خصيمى يوم القيامة<br />فهل جزاء من اوصانا بكم خيرا ان تسبوه وتصفوة بهذة الصفات<br />تأدبوا يا قبط مصر فنحن والله لا نجرأ ان نقول على المسيح قولا سيئا<br />لأننا نقدرة حق قدرة ونعلم انة رسول الله وكلمتة ونحبه حبا والله لو تعلمون كيف نحبة<br />لاحببتمونا لاننا نحبة<br />وقرأننا قال فيكم \\\\\\\"لتجدن اقرب الناس مودة للذين امنوا الذين قالوا انا ***** ذلك بأن فيهم قسيسين ورهبان وانتهم لا يستكبرون\\\\\\\"<br />انتم تدعون على الأسلام ما ليس فية<br />تأدبوا مع نبينا ورسولنا لاننا نحب نبيكم ورسولكم المسيح ابن مريم"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626152040/http://masr.20at.com:80/newArticle.php?sid=16443"

[[comments]]
order = 3
subject = "استوصوا بالقبط خيرا"
author = "18-الراسل ابوبكر محمد سعيد"
text = "18-الراسل ابوبكر محمد سعيد<br />بسم الله الرحمن الرحيم<br />بدايتاً احب اقول حسبنا الله ونعم الوكيل في كل واحد اراد ان يجعل فتنة ما بين المسلمين والمسيحين فان مصر دولة الامن والامان لا فرق فيها ما بين مسلم او مسيحي فكلنا نعيش تحت سماء وطن واحد اكلنا من خيراته وشربنا من نيله والاخوه الاقباط لهم منا كل احترام وتقدير فنحن نشاركهم افراحهم واعيادهم واحزانهم فلماذا تفهموننا بهذه الافكار الغريبه فان اول من اوصانا بالاقباط خيرا هو سيدنا رسول الله صلى الله عليه وسلم فقال {استوصوا باقباط مصر خيراْ} وعمر بن الخطاب الذي جلد والي مصر وابنه بسب ان ابن الوالي قد اهان هذا القبطي فأمر عمر بن الخطاب من القبطي ان يضرب الوالي وابنه على وجه ..انا اقول في اي شخص يحاول ان يدنس صورة المسلمين والاخوة الاقباط اقول فيه اتقي الله فان الفتنة اشد من القتل وحسبنا الله ونعم الوكيل وقبل ان اختم مقالتي احب ان اقول لكل من تسول له نفسه ان يرمي الاسلام باية كلمه غير صحيحه فاني سأرد عليه ردا مقحما وان للاسلام ربن سيحميه ورجال دين وغيرهم وكل مسلم شهد بان لا اله الا الله وان محمد رسول الله سيقف لينصر دينه العظيم وصدق الله اذ يقول {ومن يبتغي غير الاسلام دينا فلن يقبل منه} صدق الله العظيم ........................وحسبنا الله ونعم الوكيل<br />الاسم :أبوبكر محمد سعيد<br />العنوان:محافظة الشرقية مركز ابوحماد قرية عمريط<br />تليفون:0185389449-0161586989-3480485-2273962"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626152040/http://masr.20at.com:80/newArticle.php?sid=16443"

[[comments]]
order = 4
subject = "طيب ما هو النصارى لهم مستشفيات خاصة بهم المستشفى القبطى وعيادات الدكاترة النصارى والمستشفيات الخاصة بتاع النصارى"
author = "لية"
text = "وبعدين احنا مغلولين منهم على الاخر<br />وكلام زكريا زفت على الفضائية وخنازير المهجر<br />احنا لما هنضربهم مش هنخليهم يروحوا المستشفيات - هنضربهم ضرب يودى المشرحة على طول<br />رهبان الدير ابو فانا شايلين سلاح والكلاب بيهوهو وعايزين ياخدوا ارض بالعافية وكانهم فوق القانون"
archived = "2008-07-01"
capture_url = "https://web.archive.org/web/20080701201029/http://masr.20at.com:80/newArticle.php?sid=16443"

[[comments]]
order = 5
subject = "نحن نكرهكم - وبصريح العبارة لا مكان لكم بيننا"
author = "مصرى"
text = "تلك الجالية المسيحية يجب ان ترحل والى اى مكان فهى جالية ليست طبيعية - انهم يكنون حقدا اسودا على الجميع وحتى على مسيحى العالم<br />انظر الى مهاجريهم - اقباط المهجر فى امريكا وكندا واستراليا - انهم لا يصلون فى كنائس المسيحيين الاخرين ويصرون على عمل كنيسة قبطية ويستوردون قسيسا من مصر ليقيم لهم الصلاة<br />واصبح لهم عدد كبير من الكنائس القبطية فى امريكا واستراليا وكندا<br />هم يعرفون سكتهم جيدا<br />الهجرة<br />لا مانع<br />مع السلامة يا اخويا انت وهو - سكتكم خضراء<br />انما تقعدوا عندنا وتشتغلوا طابور خامس - لا<br />وليكن معلوما ان كل نصرانى مراقب من عشرة مسلمين فى مصر يحصون تحركاتة وسكناتة وحركات مراتة وعيالة وكل الكلام الخايب اللى بيقولوة فى الكنيسة لما يقعدوا مع بعض وتلقين بعض القسس لهم بعض الاكاذيب عن الاسلام والقران وانهم الاصل وان مصر هترجع تانى مسيحية زى الاندلس وكل الكلام الفارغ واحلام اليقظة والاكاذيب"
archived = "2008-07-01"
capture_url = "https://web.archive.org/web/20080701201029/http://masr.20at.com:80/newArticle.php?sid=16443"

[[comments]]
order = 6
subject = "لله المجد في الاعالي وعلى الارض السلام وفي الناس المسره"
author = "مش ححبك"
text = "الاية الانجيلية التي فوق شعار النصاره على مدار 1400 سنه<br />الى ان وصل البابا شنوده الضابط السابق في الجيش المصري<br />وتغير الشعار بعد الاستقواء بامريكا واسرائيل<br />وتحولت البلاد الى فتن طائفية بسبب المسيحيين وبسبب تحريض اقباط المهجر بتوع جمع التبرعات"
archived = "2008-07-01"
capture_url = "https://web.archive.org/web/20080701201029/http://masr.20at.com:80/newArticle.php?sid=16443"

