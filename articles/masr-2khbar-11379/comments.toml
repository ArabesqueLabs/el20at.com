subject = "طبعا ضربة للسياحة --- هل سيتم تغيير وزير الداخلية"
author = "بسطاويسى"
posted = "2009-02-23"
text = "هل سيتم تغيير وزير الداخلية بسبب الحادث كما تم فى حادث الاقصر من قبل ؟<br />والا القدرة على التغيير اصبحت معدومة<br />والا الحل السهل تلبيس القضية لحداد مسلح مختل نفسيا<br />والا لعصابة حمادة وتوتو بتوع بومب المولد"
