[[comments]]
order = 1
subject = "طيب والعساكر بتوع المركزى اللى كانوا واقفين اية لز"
author = "مين هناك"
posted = "2009-02-23"
text = "ميدان الحسين كان مليان عساكر امن مركزى زى الرز<br />واحد جاهل مجند واقف فى الخدمة اللة اعلم شبعان والا جوعان وسقعان وبيعدى قدامة لحم ابيض فرنساوى والمانى وعريان وهو واقف بيبرق ويفتكر فى البنت ام الخير وحلاوتهم ونحمدة وبهانة والجاموسة فى الغيط والحمار والبرسيم<br />فى ذمتكم دول ناس ينفعوا يحرسوا منطقة سياحية<br />هو مالة - يحطوا قنبلة او يحطوا بدنجانة - هو بيبص لبتاع سندوتشات الكبدة وريقة بيجرى<br />لية ما يبقاش عسكرى امن محترف مدرب براتب ودى وظيفتة - عسكرى شرطة حقيقى مش مجند بيعد الايام علشان يرجع بلدهم<br />الميدان زى كل ميادين مصر مليان عساكر فلاحين وصعايدة مجندين وما يعرفوش السما من العمى<br />العملية فى الداخلية منظر وعدد"
archived = "2010-03-14"
capture_url = ""
