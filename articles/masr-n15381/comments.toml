text = "انتوا مكبرين الموضوع كدة لية الطالب ولا حصلة خاجة غير ان تم النحقيق معة فى مكتب رئيس الحرس بكلية الاداب وتم الافراج عنة بعد ريع ساعة تقريبا وبعدين الناس من حقها تعبر عن مافى داخلها والشخص البيتكلم عن القاطع السادات احب اقولك ان الشاب القاطع السادات فى الجامعة وقالة السادات انت من الارزال اصبح الان رئيس حزب ورئيس تحرير وعضو مجلس شعب حاليا وهو حمدين صباحى واسائل واتاكد لو مش مصدق يعنى كل الرغى دة بصراحة مالوش لازمة بلد مورهاش غير التفاهة عشان واحد قال كلمة لرئيس الوزراء رينا ياخد كل المتخلفين المتاخرين الى عايزين ياخدو البلد دة للخلف اخد عزيز مقتدر.......... قولوا اميييين"
