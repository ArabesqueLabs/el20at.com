subject = "تعليقات على الموضوع"
posted = "2008-04-22"
text = "22 Apr 2008 - 10:45<br />11- الراسل : carma_3<br />هو كان المفروض يستاذن علي الاقل لاعتبار السن ولا لشئ اخر والحدق يفهم<br />22 Apr 2008 - 10:07<br />10- الراسل : بلبل<br />انت اكيد نسيت اني انت في مصر.الكلام ده ممكن يحصل في دولة اوربيةاواي دولة فيها ديمقراطية مش ممكن يحصل في دولة اسلامية زي مصر<br />22 Apr 2008 - 10:05<br />9- الراسل : متابع<br />من حقك تعترض، ومن حقي أسجنك.<br />آهي دي الديموقراطية.. خلي العالم المتخلف (المتحضر) يتعلم من مصر أم الحضارات (7000 سنة). آهو ده اللي فالحين فيه، كلام وخلاص.<br />يا رب ارحم شعبك. صلوا من أجل مصر... يا رب ارحم.<br />22 Apr 2008 - 09:05<br />8- الراسل : خفرع<br />لا يوجد في مصر رئيس وزراء بحق وحقيقي !!! انما يوجد رئيس مجلس الوزراء !!!! ومعني هذا لا يتصرف كرئيس وزراء إنما يُنفذ التعليمات التي تتلي علية من رئاسة الجمهورية !!! ولا يُناقش ولا يُجادل إنما الطاعة العمياء !!! وإلا !!!!! لك في الجنزوري إسوة حسنة .... لعلكم تكونوا فهمتوا الدرس<br />22 Apr 2008 - 07:19<br />7- الراسل : عبدالحفيظ سابقا<br />طيب يانظيف افندي لو الطالب استاذن كنت هاتجاوب تقول ايه<br />ديه جاتلك علي الطبطاب ثم ان انهي ديمقراطيه يافندي التي تتجدث عنها سجن المتنصرين ولا التعذيب في سجون بلطجيه العادلي ولا ايه<br />الطالب من حقه يسالك وانت هربت من الاجابه يافندي<br />ياريت الموقع يتابع اخبار هذا الطالب هل اعتقلوه بامر نظيف افندي ولا قتل ولا فعلا فيه ديمقراطيه<br />22 Apr 2008 - 03:06<br />6- الراسل : عمر ناجي<br />مش من اللياقة برضه مقاطعة رئيس وزراء دولة و التحدث معه بهذا الشكل الشوارعى...... عيب ميصحش يا طالب و المفروض الطالب ده يتعاقب و لو حصل التهريج ده فى اي دولة تانية كان هيعتقلوه و يبهدلوه<br />و بعدان بقى الطالب ده كداب و منافق عشان لا رغيف العيش زي الفل و لا التعليم زي الفل و الاتنين اسود من بعض .... و الاهم من ده و ده مش سلطة رئيس الوزراء الافراج عن احد .... ما يمكن الطلبة اللى بيتكلم عنهم دول صيع او مجرمين او او او ...... الافراج يا طالب سلطة الجهات الامنية المختصة و وزير الداخلية ..... و مادام حضرتك عامللى فيها رجل متهز طولك و ورينا شاطرتك و روح قول الكلام ده لحبيب العادلي نفسه بدل من شغل التشويش و المقاطعة<br />والله يا اخوانا تلاقى الولد ده كان عايز يعمل شو قدام المزه بتاعته عشان تقول عليه ولد جرئ و مبيهموش !!!!!!!!!<br />عيل خايب<br />22 Apr 2008 - 00:38<br />5- الراسل : onon canada<br />دول عصابه يابوى عصابه حراميه وزعيمهم فى شرم الشيخ<br />22 Apr 2008 - 00:34<br />4- الراسل : الشريف/ جمال طه ت/ 0104710778<br />استعد للاعتقال فى أقرب فرصه حتى تعرف انك فى مصر وادخل على المدونة وانت تعرف حقوق المصرى فى الداخل والخارج<br />http://gamal51.blogspot.com/<br />22 Apr 2008 - 00:10<br />3- الراسل : Kamal<br />What did Si Bilal expect. The way to question the arrest of alleged criminals is to hire a lawyer, follow legal steps ,request a day in court, question the evidence and present proof ,in court. Causing a disturbance in public is not a civilized way of demanding justice.He was, I assume ,demanding the release of members of a banned party ,who have broke the law. .. But then , who said that there is a law in Egypt..? Therefore,I have to admit that may be Si. Bilal was right after all<br />22 Apr 2008 - 00:09<br />2- الراسل : عزت ابو اندرو<br />هى دة الديمقراطية بتاعت السادات ان تتكلم بما تشاء ثم تخرج وتكون هذة اخرمرة تخرج منها من الكلية وبعد ذلك بعدة ايام سوف لا يعرف احد طرقك وسوف تدخل الى طريق الظلمات لانك اعترض كلام الاسياد 0000000برجاء من كل المنظمات متابعة هذا الطالب ومعرفة ما سوف سحدث لة<br />22 Apr 2008 - 00:08<br />1- الراسل : زتونية<br />الطالب ده مش عارف عمل أيه ده خرج عن النص المكتوب فى المسرحبة واحرج اليطل امام المتفرجين"
