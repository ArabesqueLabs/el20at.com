subject = "عجبت لك يا زمن"
author = "جار القمر"
posted = "2007-10-07"
text = "كنت فاكر اننا هنخش موسوعة جينز فى تصنيع كمبيوتر او حتى صنع قلم رصاص او صناعة تكتك<br />او حتى نكفى نفسنا بالفول بدل استيرادة من كندا<br />انما نحن امة ضحكت من جهلها الامم<br />سجادة الصلاة - صناعة الصين<br />والمسبحة - صناعة الصين<br />والايات القرانية فى براويز برضة صناعة الصين<br />واحنا قاعدين ناكل ونخلف عيال ونتفنن فى النصب والتعذيب وفتح المعتقلات بدل ما نفتح مصانع<br />ويا بتاع صينية الكنافة طز والف طز فى فكرتك"
