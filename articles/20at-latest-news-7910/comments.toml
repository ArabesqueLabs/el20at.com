posted = "2008-03-10"
text = "السلام عليكم ورحمه الله وبركاته<br />انا صراحه تفاجأت من المقال لبعد درجه ولااعلم هل هو خطأ الصحفي او انه افتراء من صاحبه الموضوع (ريماس)<br />اللي ابي اقوله اتمنى من الممثله ريماس انها ماتنسب نفسها لغير دولتها اليمن لانها بكلامها هذا تظلم البنات السعوديات<br />ولا فيها شي لو اعترفت وقالت انها يمنيه ومازالت على كفاله السفاره الاماراتيه واللي مهوب مصدق كلامي يروح لسفاره الاماراتيه في الرياض ويتأكد بنفسه<br />قسم بالله انها يمنيه الاصل ولم تحصل على الجنسيه لحد الان واسمها الحقيقي ريم<br />والله على مااقول شهيد"
