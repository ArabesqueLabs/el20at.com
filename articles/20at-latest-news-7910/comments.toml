posted = "2008-08-18"
text = "تم التأكد من كلام ابو فهد وفعلا البنت تشتغل في السفاره الاماراتيه اللي في الرياض والمعلومات اللي قالها اخوي صاحب الرد الاول صحيحه .<br />تعقيب على كلام الاخت : السعوديه<br />استغفري ربك يابنت الناس منتي ملزومه انك تحلفين كذب عشان هالممثله الا ان كانك انتي هي نفسها ريم وشاريه الدنيا وبايعه الاخره لانك تعرفين انك مو صادقه وزود على كذا تحلفين كذب لا وبعد تقولين الله على ماقول شهيد !!!<br />وربي انك مجنونه لبعد درجه الله يقطع ابوها دنيا تبي تخليني احلف كذب عشان جنسيه<br />لاحول ولاقوه الا بالله<br />خافي ربك يابنت الناس قسم بالله ماحد نافعك في قبرك ."
