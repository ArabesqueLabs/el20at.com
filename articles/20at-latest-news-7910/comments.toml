subject = "فعلا الجنسيه يمنيه"
author = "شاهد"
posted = "2008-07-07"
text = "كلام اخوي ابو فهد صحيح وانا موظف في السفاره واعرفها زين وانا وياها في نفس المبنى واقابلها غالبا الصباح وانا داخل المبنى هذي ريم وانا والله مالي مصلوح اني افتري على البنت بس هذي الحقيقه جنسيتها ((يمنيه)) وقاعده تحوس عند الملحق في السفاره عشان تأخذ الجنسيه الاماراتيه بس لحد الان ماخذتها<br />واللي يقول انها تدرس في جامعه الملك سعود مع اخته هذا ورب الكعبه كذاب شلون تدرس وهي تشتغل معنا في الصباح في السفاره !!!<br />وانا كاتب هالرد كله خوفا على البنت من عاقبه امرها من خلال انتسابها لغير دولتها مع عملها بذلك<br />فقد روى البخاري ومسلم وغيرهما عن أبي ذر رضي الله عنه أنه سمع رسول الله صلى الله عليه وسلم يقول: ليس من رجل ادعى لغير أبيه وهو يعلمه إلا كفر.<br />واتمنى للجميع التوفيق"
archived = "2010-03-14"
