text = "الى الفلسطيز ابناء الزانيات المنيوكات بخيمات العهر و اللواط و النياكة قاطبة،<br />اولا انا منا من النوع الذي يعتذر اطلاقا ولا في اي ظرف....و عندك صفحة اليوتيوب و تفرج يالفلسطيزي المخنث المنيوك على نياكة خواتك.....<br />ثانيا: التخنث هو اختراع فلسطيزي اصلي...وهو متوافق مع بيع الارض و العرض لليهود الخنازير.....و متوافق ايضا مع ما يقوم به جنود اليهود مع خواتكم و امهاتكم المنيوكات على كل حاجز ...على راس كل شارع من ارضكم المغتصبة ...مثلها مثل طيازكوا .....يعني ودكم يصير الكم شرف بعد جلسات التحسيس اليومية من خنازير اليهود على بزاز و كساس نسوانكو الداعرات على كل حاجز تفتيش.....اما بالنسبة للمخنوث الفلسطيزي اللي وده يتجوز صاحبه ....فوالله لو اني اصير شايفك ....والله ...والله لاقطع رقبتك يامخنث.....يعني مو مكفيك انك فلسطيزي ابن زنا....و كمان مخنوث!....تفههههههههههه على شرفك و شرف كل من قال انا فلسطيزي .......خوات منيوكات فاقدي الارض و العرض و الشرف....و كمان مخنثين......تفووووووووووووووووو"
