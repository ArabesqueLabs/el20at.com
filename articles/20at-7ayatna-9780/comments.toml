text = "الله يعطيك العافية يا تامر على هذه المقالة التي تلفت انتباهنا إلى مشكلة هامة يجب التخلص منها بأي شكل حتى لو عنى ذلك اللجوء إلى الكلام البذيء . فهؤلاء الشواذ الذين دنسوا شوارعنا و مولاتنا و باراتنا و حولوا ليلة الخميس (مع العلم أنها ليلة فضيلة ) إلى مرتع للشواذ و عباد الشيطان . و هذا بالطبع مخطط يهودي يسعى لتشويه صورة الأردنيين و السودانيين و تحويلهم إلى شواذ (و العياذ بالله) .<br />و السلام عليكم و رحمة الله و بركاته ."
