subject = "الى اردني كخ...كخ"
author = "هايدي شومان"
posted = "2008-08-04"
text = "اول شي بحب احي الجميع الا واحد وهو...حثالة المجتمع ههههههههه ليش بتكابر على الفاضي والله انك بتضحك عارف ليش لانو انت كزاب احنا اغنى ناس بالاردن بعد رب العالمين وادا مش مصدق ...دور بالنت بتعرف ليش الكزب لولانا بعد رب العالمين طبعا كان ما عمرك حلمت بالاقتصاد وما عمرك اشتغلت بكل حياتك ولك انا عيلتي شوماااااااااااااااااان وبفتخر لاني الحمد لله عاطفة عليك ومعيشاك انت والي زيك انا يا محترم(بس بالعكس) بعشق الاردن لانها بلدي التاني وبحرص على مصلحتها لهيك شومان بتقدم للبلد كل خير( كل مشاريع الاقتصاد)... وامانة لاتفرح كتير لانو احناكمان بنعمل على مكافحة الحوثالة الي زيك ههههههههههه..... وبدال ما بتكتب (خخ خخ خخخ)هلا ادا بدك بتصدق عليك بفاين تنف فيه بدال ما توسخ شراشيحك ههههههههه..<br />مع تحياتي :شومان امبراطور الاقتصاد الاردني<br />ملاحظة: (والي مو مصدق يبحث عن عيلتي بالنت )"
