text = "يعني انته فعلا ينطبق عليك ما يلي:<br />-فلسطيزي مخنث فاقد للارض و العرض تستمتع بالايور اليهودية اللي نايكيتك و نايكه امك و خواتك ارخص شرموطات مخيمات العهر و اللواط و النياكة.<br />-تكره نفسك و حقيقة انك لوطي مخنث ابن زنا و تحاول الصاق تهمة الشذوذ بالاخرين لعلمك انها قمة النياكة و القذارة، فمحاولاتك الخسيسة لتشويه سمعة الشرفاء بانتحال اسماءهم لن تنفعك عندما تقابل وجه ربك يا مخنث يا داعر.<br />-اخيرا، انا اعتقد انني قمت بتزويدكم بموقعي\\\\صفحتي على الانترنت و فيها كل ما اريد قوله ...لذلك لن اقم بكتابه المزيد على هذه الصفحة لاقوام الفلسطيز سواء المخنثين او الاسوياء.....واما بالنسبة لي فانا لا اقوم بالاعتذار من احد ....خصوصا ابناء مزابل المخيمات المخنثين ....فانتم كلكم اصبحتم منايك مخنثين بعد ان بعتم ارضكم و عرضكم و شرفكم للخنازير اليهود.....وكس اخت كل فلسطيزي ابن زنا....الكويس قبل العاطل او المخنث..............و يكفيكم عارا في هذه الصفحة قطكم المخنث الذي يريد الزواج من صديقه.....و تفووووووووو<br />لا مزيد من الكتابة على صفحات طياز الفلسطيز !!!!!!!!!!!!!!"
