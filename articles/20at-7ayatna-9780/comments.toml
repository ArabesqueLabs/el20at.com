subject = "يب والله عيب"
author = "غسان"
posted = "2008-08-30"
text = "مرحباأنادخلت على الموقع بالصدفة لأنه شدنى الموضوع أنه يكون بأردنا الحبيبة هذا الشذوذ الموجود أصلا لكن أنه يكون بلجرأة هذه تفاجات وتفاجأت أكثربالكره الموجود بين المتواجدين اللى خليتوا زلمة محترم زى الأخ تامر يندم على أنه كتبه ياعيب الشوم عليكم فى عنصرية لكن المفروض أنها تنتهى ولكم يافلسطينية وأردنية أفهموا أنه الأردن بتأكل حالها هيك تفرقكم وسخافتكم هاى هى اللى بضعفكم عاجبكم اللى بصير بالدول اللى جنبكم بدكم تصيروا زيهم أغلب العشاير الأردنية والفلسطينية بينها نسب قديم وكثير من العشاير الأردنية ذات أصول فلسطينية قديمة والأن موضة العنصرية قوية بتلاقى أهل الجنوب بحبوش الشمال وطلع مصطلح رباع الحمايل أنا أردنى وأفتخر أنى أردنى من أصل فلسطينى وأفتخر بأصلى وزوجتى أردنية ومن أكبر عشاير الأردن وزوج أختى أردنى ومن أكبرعشايرالسلط وأتشرف بنسبهم كمايتشرفون بنسبنا فكل واحد بغلط بالأخر الغلط بوصله وللأخت هايدى شكلك صغيرة بالسن لأنه معرفتنا بعيلة شومان قديمة وجدى وجدك كانواأصحاب كثير واللى بعرفه أنه هذه العيلة محترمة ومتواضعة وتبرأبنفسها عن الدخول بهذه المهاترات أو أن تتفاخر بغناها والغنى اللهالرجاْ أن كانت التعليقات على أى موضوع راح تكون بهذه الطريقة فبلاش أحسن والسلام عليكم"
