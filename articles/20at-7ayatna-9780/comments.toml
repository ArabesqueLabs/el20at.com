text = "سامح طراونة كمان انتا ايه بابهيم انتا يا عاشق الزفت<br />متروح تنيل يابن المتخلفة الله !!!<br />اي ده ده الراجل مجنون والله مجنون بحق وحقيق !!!<br />يبني انت عيل بجد وعيل ايه دي عيل ده العيل لسا بيفهم اكتر من مخك الله مخ ايه اللي بتكلم عليه ده المجنون ده معهندوش مخ أساساً !<br />يله يا عاشق انتا مبزهقش من العبط والكلام الفارغ ده<br />ايه مره هايدي ومره طراونة وبراونة وبحيصي وبعيصي ايه الأسماء دي الغبيه المقرفة<br />يخرب بيتك يا معفن يا لبط يا اللي متختشييش<br />وسلام يا صاحبي"
