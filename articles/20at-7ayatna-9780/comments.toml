subject = "و طبعا الحمير افضل منهم .."
author = "ح مشعل :)"
posted = "2008-08-05"
text = "أخي الشيخ الشكسي شكرا جزيلا بارك الله فيك بس حقيقة اريد اقولك انا لا يهمني كلام السقط :-)<br />يعني مثلا اذا جاءك كلام لا يليق من طفل فهل ترد عليه او تلتفت له طبعا لأ ليش لأنه طفل لا يدرك ما يقول<br />و اذا جاءك كلام بذئ من مجنون هل تعبره ؟ طبعا لأ لأنه رحمة به هو غير مدرك و عقله لا يسعفه<br />و لو قطة مثلا شمختك فهل تضربها او تؤذيها ؟ طبعا لأ لانها حيوان لا يدرك هي ما تقصد تؤذيك و الرحمة مطلوبة للحيوان<br />فكيف لو جاءك الكلام البذئ من شئ ما اعرف شو اسميه كائن او شي اقل من الحيوانات حتى ؟ اكيد لا تعيره اهتمام بالمرة ،<br />أود ان تعرف شي اخي الكريم ، هذه الفئة مسكينة و الدليل انه مسكين يعرف نفسه في قرارة نفسه من الداخل هو يحتقر نفسه في الاصل لذلك يقول كلمة افتخر كل شوي يريد يقتع نفسه و يقنعنا انه مبسوط على نفسه و يفتخر بس الفكر السليم يأبى تصديق ذلك .. :-)<br />و يعرف انه اقل من الحيوانات لذلك غاية أمله انه يتشبه بالقط (قط ازرق من الخيال) لأنه يعرف انه حتى اقل من القط الحيوان المعروف .. لذلك اختار ان يكون قط ازرق<br />انسان او بالاحرى مسخ لم تسعفه فطرته و لا ثقافته و لا علمه و لا اخلاقه لم تسعفه جميعها و لم يهده تفكيره و لا عقله و لم يدله على الحقيقة.. محطم من الداخل ... اما هؤلاء فلا اعيرهم اهتمام ابدا و كلامهم سقط لا التفت له :-) بس مشكور اخي الكريم ..<br />و رسالة عاجلة الى الاخ تامر صمادي .. صدتك .. اخيرا ارى انه الكتاب في عشرينات يدخلون لمتابعة الردود على مقالاتهم .. لذلك ارجوك ان تتكرم و تهتم شوي بالتعليقات الغير لائقة السب تجاه الاخوة و الاوطان و في الاعراض!! كلنا عرب ..بدأت اقرف من هذا الموقع ففي كل موضوع ادخله لابد ان اجد ردود فيها بذاءات و سب في الاعراض عيب عليكم .. لماذا لا تتخذون اجراء لماذا لا تحذفون هذه الردود ؟؟؟؟؟ اريد افهم ... الله بيحاسبكم على كل هذا يعني اتعبت نفسك و دخلت تعطي ايميلك للاخت الكريمة هايدي طيب يا اخي اتعب نفسك شوي و احذف التعليقات و نبه الادارة انه موقعكم اصبح مكب نفايات كبير يحوي من السباب و البذاءة و الرائحة الكريهة اكثر من الكلام المهم ..<br />تحياتي للجميع السلام عليكم ورحمة الله و بركاته"
