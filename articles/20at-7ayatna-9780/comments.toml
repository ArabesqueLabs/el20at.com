text = "من المهم اثارة هذه المواضيع لكي ننبه الناس و ننتبه لوجود هذه المشكلة من حولنا في كل مكان و هذه الفئة التي تمارس شي لا تقبله الفطرة السليمة بالمرة .. و لكن اعتب على عشرينات انها في كل مقال مثل هذا تنشر اسماء المواقع الشاذة و كأنها تروج لها و نحن لسنا في حاجة لنشر اسم المواقع حتى نتحدث عن الظاهرة .. اتقوا الله شوي<br />اما الغير محترم الذي يفخر لكونه شاذ اقول له هنيئا لك .. فحتى الحيوانات اللي هي حيوانات لا تمارس العلاقة بهذا الشكل القذر و المنحط .. الحيوانات تمار س العلاقة ذكر مع انثى .. حتى الخنزير على فكرة .. فياريت شوي تنتبه على نفسك انك وصلت لمرحلة و لمستوى متقدم جدااااا في اسفل سافلين اسفل من الحيوانات و الخنازير .. لذلك لا يحق لك ان تسمي نفسك القط الازرق و الله انه القط يزعل و يقرف اذا عرف انه اشكالك تتسمى بهم .. مبارك عليك هالمستوى المنحط و اذا بقيت عليه فمبارك عليك الدرك الاسفل من نار جهنم ... الله يهدي اشكالك و يحفظنا من العذاب اللي ممكن يصيبنا لوجود اشكالك في كل العالم .."
