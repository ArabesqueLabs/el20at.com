posted = "2008-09-04"
text = "اكثر من يتكلم عن الشرف الشرموطة.. ولذلك انتم لديكم احساس دائم بالعجز لانكوا مش قد الفلسطينية والفلسطينية ما عمرهم حطوا واطي لحده واكبر دليل انهم صامدين في وجه اكبر كيان للطغاة في العالم وفي التاريخ كيان بني صهيون حبايبكم.. وهو يقارع كل الدنيا بمفرده رغم تامركم شعبا وحكومة ونظاما عليه وانتم وجحوش الخليج الجرب مثلكم.. وعليكم ان تعرفوا يا لواطيين ان اكبر نسبة لواط في العالم كلو سجلت في الشعب الاردني خرة الخرا عليكو وخرة على اللي بحبكوا يا اولاد العاهرات والشرموطات"
