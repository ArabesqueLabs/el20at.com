text = "فوفو أنا عايش بالأردن يعني كيف بالله عليك رح أعرف اللهجة الإماراتية وأنا عايش بالأردن .. مش متلك بصفحة ارفع راسك إنتا فلسطيني مستعير تعليق باسم : إماراتي والنعم عشان برضو تبين إلنا إنو الإماراتية بحبو الأردنية ومن هالكلام الفاضي .. على العموم أنا رح أسافر نيويورك عشان أكمل الماجستير هناك وقبل ما أسافر لازم أعمل اللي علي وأضل ملاحقك وعامل فيك اللي<br />ما انعمل إن شا الله .. هلأ رح أكمل السنة معك وأنا بلاحقك ومعذبك معي .. خلاص كلها شهر ومسافر إن شا الله ورح ترتاح وتنفك مني .. وسلام .."
