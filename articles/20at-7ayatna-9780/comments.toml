text = "اهو يا أخوان ويا أخوات عمالو يطنش ولا كنو في حاجة حصلت<br />ده عاشق فلسطي لو فعلاً مش عامل حاجة كان رد عليّه وقال اللي هوه عاوزه<br />وكلنه يا جماعة مردش , وده معناتو إنو هوه عيل لا حول له ولاوقوة !<br />ده عيل من العيال الخيبه دي اللي بنشفهم في اليومين دول !<br />ده فعلاً واحد مجنون , مش بعقلو , ده انصهج بجد !<br />يا راااااجل متفوق على دمك وتحسه على روحك حبتين أوي,مينفعش كده والله مينفع<br />يارب لك نلجأ في كل شيء اهدي عبدك الفقير لذاته [ عاشق فلسطين ] اللي مهوش عارف حاجة في الدنيا دي<br />ياااااااااااااااااااااااااااااارب العالميييييييييييييييييين ,<br />والسلام"
