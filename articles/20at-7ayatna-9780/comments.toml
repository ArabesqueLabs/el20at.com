[[comments]]
order = 50
subject = "طفل من أطفال البئس والشقاء ..."
author = "محمد نواف"
posted = "2008-09-02"
text = "لي عودة يا أخواني وأخواتي في القريب العاجل ..<br />انتظروني ..<br />وانتظروا ردي الحاسم والاخير على هذا المحترم الخلوق المؤدب ..<br />أنا سوف أرد عليه فقط لسبب واحد وهو بلا شك سبب جوهري ورئيسي وأساسي للرد على أمثاله مممن باعوا الشرف والأرض والعرض .. هذا وإن كان يعي ( عاشق فلسطين ) هذا الشيء !!<br />وسامحوني على ردي الأخير والحاسم على هذا المحترم .. فقد يحمل كلام جارح وحاد ولكن مافي قلبي أعجز عن كتمانه فيه .. فسأفرغ كل ما في صدري لكي أبرء ذمتي وأريح ضميري أمام الله وأمامكم ..<br />فهو .. للأسف الشديد لايعلم ولايدري مع من يلعب !<br />مسكين هذا المحترم ..<br />\" درويشٌ \" هو ..<br />ساذجٌ لايعرف ماهية الحياة ..<br />لينٌ هو لايعلم بان الحياة سوف تلعب كثيراً وكثيراً ...<br />يا عاشق فلسطين ( والخسارة هنا لفلسطين وأهلها على هكذا عشق ! ) المهم ..<br />أنت للأسف الشديد لم تعرف أنك إنسان .. فقد واريت الثرى عن إنسانيتك وانسخلت عنها .. !<br />لي عودة .. والكلام بيننا يطول ( فعذراً من الآن ) يا سادة !<br />ودي واحترامي الشديد لكم ..<br />وللعلم : الدنيا رمضان وهو لحد الأىن نازل يحط تعليقو بكل مكان ( حر هو ) ولكن من سيبقى للنهاية هو الفائز وهذا تحدي ..<br />وسوف ينخ ! نعم سوزف ينخ .. لأن الأمانة كبيرة وعظيمة ألم تعرف أيها العاشق لفسطين بأن الأمانة في يوم من الايام حملوها للجبال الشاهقة بطولها وعرضها .. فلم تستطع حملها .. لم تفدر .. وهي جبـــــــــــــــال !!<br />فمابالك بإنسان ؟! فالجبال نخّت أمام تلك الأمانة !!<br />وأنت أمين على حبك لفلسطين وعشقك لها بهذا الشكل يكون !<br />ويحك اقصر يا هذا ............................"
archived = "2010-03-14"
capture_url = ""

