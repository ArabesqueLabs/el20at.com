text = "بقول الإمام الشافعي _ رحه الله تعالى _ :-<br />يخاطبني السفيه بكل قبحٍ .. وأأبى أن أكون له مجيبا ..<br />يزيد سفاهةً، وأزيد حلماً .. كعودٍ زاده الإحراق طيبا ..<br />____________<br />هذه الأبيات مهداة إليك أيها المنافق المحترف !!<br />طبعاً أنا لا بلومك على جهلك وغباءك وتخلفك وانحطاطك.. لأنك تعودت على هيك من زمان !!<br />قال بدو يرد رد حاسم .. وبعيد وبكرر : تهديداتك وكلامك الفاضي ما بخوفني وأنا عارف حالي منيح وياما كترت تهديدات وما عملت إشي رد رد حاسم وأنا وراك وراك والزمن طويل ..<br />لنا لقاء وعودة إن شاء الله .. أخوكم عاشق فلسطين"
