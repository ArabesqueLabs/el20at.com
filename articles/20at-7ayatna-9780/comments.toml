text = "ع العموم موضوعك منيح والله يهدي الجميع وهذه الفئة الضالة المارقة الخارجة عن الشرع والقانون وعن الماهية المعلونة من قبل الجميع (( الشواذ )) .. ع فكرة الشاذيين موجودين بكل مكان فلا حدا يتفلسف براسي ويقلي موجودين بالأردن ومش موجودين بفلسطين لا يا نور عيوني موجودين باردن وفلسطين وكويت والإمارات وقطر والبحرين والسودان وكل مكان افهموا عاد لأنو الحمير فهمت .......... شكراً وتحياتي للجميع<br />إلى تامر الصمادي شو يا حلو هيئتك بدك تتعرف على هايدي شرمان ؟!<br />والله ماعرفناك !! محسسني !!<br />وإذا غاب القط يا تامر شو بصير ؟؟ بلعب الفاااااااااااااااااااااااااار"
