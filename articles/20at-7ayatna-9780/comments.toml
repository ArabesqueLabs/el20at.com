subject = "فلسطين أرض المقاومة"
author = "الشيخ الشكسي"
posted = "2008-08-04"
text = "إن فلسطين أرض المقاومة و الصمود و الشعب الفلسطيني شعب المقاومة و الصمود يتبرأ من هذا المدعو بالقط الأزرق و أمثاله من الذين خرجوا عن الفطرة الإنسانية فأصبحوا أسفل من الحيوانات . وأما الأخ ح مشعل فهو قال ما نفكر جميعاً به و أنا أعتقد أن ( ح ) ترمز ل(صالح) لأنه أخ صالح و صادق و أنا أوافق على كل ما قاله . أما بالنسبة للضال الذي تحدث عن شعب فلسطين بالسوء فهذا نابع عن جهله و سوء تربيته . و مع أني دعوت إلى الكلام البذيء إلا أني لم أقصد أن يكون بذيء إلى هذه الدرجة .<br />و السلام عليكم و رحمة الله و بركاته ( طبعاً ما عدا اللأزرق و الضال )"
