posted = "2008-08-04"
text = "الى البسة المخنوثة،<br />شكرا عمي!! خخخخخخخ<br />يعني واضح انك فلسطيزي ....وهذا فقط جاء تاكيد لكلامي على عهر و نياكه الفلسطيز فاقدي الارض و العرض و الدين و الشرف.....<br />اما بنت شومان السحاق،<br />والله مانا حاب اسيء لبنت لاني رجل اردني و عندي اخلاق اصيلة ...فلن افعل....فانا لست فلسطيزي باع ارضه و اشترى املاك و اسس بنكا بمصاري اليهود التي اعطوها له لقاء ارضه و عرضه...<br />اما مسالة من اغنى في الاردن فهاظا الحكي كان زمان.....اما الان فعشيره شوطان كلها تعادل ما يمتلكه شخص اردني واحد هو السلطي زياد المناصير-العبادي....كما ان الاقتصاد الاردني مفتوح لعدد من المستثمرين اللبنانيين و العراقيين والسعوديين و الذين تتجاوز ثرواتهم بمراحل ما يملكه ال شوطان بايعين الارض و العرض ....و بكفي جدك الاكبر شوطان ابو شخه الكف اللي اكله من الباشا عبد الهادي المجالي و ظل ماكل خرا و ساكل مثل البس (الازرق الشاذ الفلسطيني اللي عرف عن حاله اعلاه....وانا ما دخلني هه!!!)..... وسلامتها ام حسن.....خخخخخخخ"
