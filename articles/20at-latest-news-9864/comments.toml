text = "بدايه تطبيع !!!<br />لا على فكره البحرين ابدت التطبيع من زمان موش هي و بس لا و بلاد عربيه كتير عامله فيها بلاد ملهاش ف السياسة زي دول الخليج كولها و اكيد المغرب و تونس !!!<br />و مسأله انتو عاوز يجيب اليهود د موش مساله تطبيع و مبس د مومكن تسميها مسأله علمانيه للبحرين ... و ايه الموشكله مهو مابين النص مليون نسمه دول فيه كام واحد شواذ... ؟؟!!<br />ربنا بسترها علينا !!!!"
