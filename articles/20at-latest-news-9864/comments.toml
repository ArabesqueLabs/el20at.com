subject = "للقلسطيني المحترم الي رد على الاردني محمد نواف"
author = "اماني"
posted = "2008-10-13"
text = "....... الى المحترم كتتيير والمربى شكلك مربى ترباية مخيمات مبين من حكيك اللي بيخزي متل شكلك الواطي<br />الواحد لما بدو ينتقد بينتقد بادب واحترام مش بستخدم كل مصطلحات الشارع اللي مثل شكله<br />لما بدك تحكي عن الاردن بتحط ايدك على راسك ok لانه ما لمك غيرها انت واشكالك<br />حقائقكو ما بيعرفها الا الاردني لانه عاملكو باحترام وانتو مو شكل احترام<br />حتى اشكاللك ما بتتناقش<br />روح انقلع اقلب وجهك الي مثل الكندرة البالية حتى الكندرة احسن لانه بنستفيد منها<br />الاردن قايمي بيكو وبلاك وبلاكو احسن<br />تاني مرة لما بدك احكي اتغلم واتربى"
archived = "2010-03-14"
