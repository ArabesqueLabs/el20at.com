subject = "سؤال !!"
author = "حسين كامل"
posted = "2008-05-04"
text = "سؤال , هل غلاء الأسعار يجتاح مصر فقط بل يجتاح جميع دول العالم !! غلاء الاسعار يجتاح جميع دول العالم ومع ذلك لم نشاهد شعب من شعوب تلك الدول ارتدى الملابس السوداء او نظم اضراب !! الدول الاوروبية تعانى من ارتفاع الاسعار , الدول العربية بدون استثناء تعانى من الغلاء , دول الخليج شهدت ارتفاع جنونى فى الاسعار شمل كل شى لدرجة ان العاملين بتلك الدول قاموا بترحيل اسرهم حتى يتمكنوا من العيش وسط الارتفاع الجنونى للاسعار !! اذن مصر كغيرها من الدول تعانى من ارتفاع الاسعار العالمى ولكن لماذا نسمع اصوات المعارضة فى مصر بينما لا نراها فى باقى الدول !! السبب ان الحكومة تراخت فى مواجهة الاخوان المتأسلمين والعملاء والخونة فهولاء يتربصون بمصر وشعب مصر وامن مصر وينتظرون الفرصة لكى يغرسوا خناجرهم فى صدر الوطن . هولاء يتمنون الفوضى والدمار والتخريب والسرقة والقتل والنهب والدليل حينما فشل اضراب السادس من ابريل اصيبوا بخيبة امل وخرجوا على مواقع الانترنت يسبون الشعب الذى رفض الاضراب ولكن فى اليوم التالى تبدل الحال وانتشوا حينما عم الخراب والدمار مدينة المحلة الكبرى فهذا هو املهم وهذا هو حلمهم ان تحترق كل مصر مثلما احترقت المحلة الكبرى !! لذلك اتمنى من الحكومة المصرية واتمنى من الرئيس مبارك ان يقدم كل من شارك او حرض على الاضراب الى المحاكم العسكرية , اتمنى ان تتم معاملة مهدى عاكف الذى قرر المشاركة فى الاضراب معاملة تلك الفتاة التى تدعى اسراء والتى نظمت الاضراب السابق واتمنى من الحكومة ان تنتزع الريشة التى وضعتها على راس مهدى عاكف فلا فرق بين عاكف واسراء امام القانون .. واخيرا تحية من القلب الى رجال الدين اللذين حرموا الاضراب , تحية الى اقباط مصر وكنائسهم التى رفضت الاضراب , تحية الى كل صحفى حر وشريف كتب كلمة يحارب فيها الاضراب , تحية من القلب الى كل مصرى شريف سوف يخرج اليوم ويظهر فى شوارع القاهرة ليكون ظهوره فى شوارع القاهرة هو خير دليل وخير شاهد على فشل الاضراب"
