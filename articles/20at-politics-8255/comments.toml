posted = "2008-07-01"
text = "أريد أن أحبس عواطفيوأن أقيد ميولي وأن أربط على نبضات قلبي وأنا أكتب عن أحب إنسان الى قلبي واغلى رجل وأعز مخلوق على نفسي<br />محمد صلى الله عليه وسلم ؛ إسم على مسمى ؛ علم على رمز جمع المحامد وحاز المكارم واستولى على القيم وحاز على المكارم ؛ ومحمود عندالناس صلوات الله وسلامه عليه وآله وصحبه ما نجم بدا وطائر شدا ونسيم غدا ومسافر حدا ."
