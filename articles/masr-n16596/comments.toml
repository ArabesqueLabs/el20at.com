[[comments]]
order = 1
subject = "لن ننساك ابدا"
author = "اشرف"
posted = "2008-07-03"
text = "من المؤمنين رجال صدقوا ماعاهدوا الله عليه فمنهم من قضى نحبه ومنهم من ينتظر ومابدلوا تبديلا (صدق الله العظيم ) اللهم ارحمه رحمة واسعه واكرم نزله ياا رحم الراحمين"
archived = "2008-07-04"
capture_url = "https://web.archive.org/web/20080704104023/http://masr.20at.com:80/newArticle.php?sid=16596"

[[comments]]
order = 2
subject = "لا إله إلا الله"
author = "علي عبد المنعم"
posted = "2008-07-03"
text = "إنا لله وإنا إليه راجعون.. إن لله ما أخذ ولله ما أعطى..<br />والله إنا لفراقك لمحزونون يا د.عبد الوهاب.. ربنا يرحمك برحمته ويدخلك فسيح جناته، اللهم يسر حسابه بما نفع أمة الإسلام يارب، ونشهد يارب أنه كان نافعاً للإسلام والمسلمين فاجعل أعماله ثقيلة في ميزانه واجمعنا به في جنات النعيم..<br />اللهم لا تفتنا بعده ولا تحرمنا أجره يارب..<br />اللهم اغسله بالماء والثلج والبرد ونقه من الذنوب كما ينقى الثوب الأبيض من الدنس.. وآنس وحشته في قبره، واجعل قبره روضاً من رياض الجنة وثبته يارب عند سؤال الملكين يارب.. وآمنه من الفزع الأكبر ياررررب"
archived = "2008-07-04"
capture_url = "https://web.archive.org/web/20080704104023/http://masr.20at.com:80/newArticle.php?sid=16596"

