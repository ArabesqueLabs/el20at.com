subject = "مستشفى فلسطين و مستشفى دار الفؤاد"
author = "اكتب اسمك هنا"
posted = "2008-07-03"
text = "مستشفى فلسطين هى المستشفى اللى مات فيها المسيرى بعد ما رفضت الدوله تعالجه على حسابها<br />أما مستشفى دار الفؤاد فهى اللى مات فيها أحمد زكى و غيرهم , اللى عالجتهم الدوله على حسابها!!!"
