subject = "ربنا يشفى كل مريض"
author = "سلامات"
text = "الانسان المريض قريب جدا من اللة<br />ونفسيتة تعبانة وبيفكر فى المرض والدواء والشفاء والموت<br />ودايما بيتذكر اقاربة الذين ماتوا<br />يبقى يفكر فى حب اية وبدنجان اية وعلاقة حب اية"
