subject = "البرىء"
author = "نيفين نيفى نوفا"
posted = "2007-04-30"
text = "و الله يا براء الواحد فعلا ساعات بتدور الخواطر دى ف باله و هو بيبص للناس الغلابه دى<br />وبنقول عبد المامور<br />و مش عارفه ليه الناس دى كل واحد منهم بيفكرنى بالعبقرى حمد زكى ف فيلم البرىء<br />و فيه حاليا كليب شهير بيتم تداوله على الموبايلات حاليا لعسكرى امن مركزى و قدامه ظابط بيسخر منه و بيقوله ضمن الكلام حرب 73 كانت سته كام و العسكرى يقوله مش عارف يا باشا و اللى تشوفه يا باشا و لاطبع لا تخلو الخلفيه الصوتيه للكليب من اصوات ضحك و قهقهه<br />و كل دا و غيره بترسخ الفكره الموجوده ف عقولنا بان عسكرى الامن المركزه دجا ما هو الا puppet او دميه بيحركها رجال الشرطه<br />بس هل هى دى الحقيقه؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2010-03-14"
