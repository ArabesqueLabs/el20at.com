[[comments]]
order = 1
subject = "تبقى إنت أكيد في المترو!"
author = "marwa"
posted = "2008-08-05"
text = "جزاك الله خيرًا يا أستاذ مصطفى، فتحت جرحًا لا يندمل. \"يبقى انت في المترو\" ياله من تعبير بسيط جدًا وعميق جدًا، عبارة أرددها يوميًا وأنا ـ ولله الأمر من قبل ومن بعد ـ أركب المترو، ومع إني بألتزم بالأبواب دي من زمان بس للأسف القرار ده مش هينفع يتنفذ أبدًا لإنه ببساطة من سنين والأبواب دي متحددة فاللي كان عايز يلتزم كان التزم من زمان، يا سيدي الفاضل هل لك أن تتخيل مدى المعاناة اللي بأقابلها عشان ألتزم بالأبواب دي؟! يكفيني أن أذكر لك أنه في مرة انتظرت لأكثر من 45 دقيقة عشان أركب من باب الصعود، تفتكر كام واحد ممكن يعمل كده؟! مش بعيد كل اللي يقروا الكلام ده يقولوا عليّ مجنونة، نفسي السيد المحترم فارض الغرامات يحاول يركب المترو يوم واحد بس ويقول لي هينزل إزاي من باب النزول في عربة مكدسة بالركاب لا مجال فيها للتنفس. أستاذ مصطفي ياريت تكتب عن باقي مشاكل المترو وياريت حد يسمع ويفهم لإنه بصراحة معاناة نفسية لواحدة زي بتحاول تلتزم في بلد أصبح الأعم الأغلب من شعبها يتحلى بكمية لا متناهية من اللامبالاة وإنعدام الإحساس بقيمة الوقت ولا يراعي شعور غيره ولا ...ولا... القايمة لاتنتهي، بس أخيرًا إقتراح \"تيمنوا\" هو القرار الأصوب بس لو نلتزم!"
archived = "2010-03-14"
