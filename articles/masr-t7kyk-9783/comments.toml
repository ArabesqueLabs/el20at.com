[[comments]]
order = 2
subject = "لنا الله"
author = "المهندس/ناجي"
posted = "2008-11-15"
text = "مشكلة المواصلات قالو اهيحلها مترو الانفاق وجاء مترو الانفاق ليكون واجهه حضاريه لبعض الوقت وزي مايكون استكترو علي الناس وسيلة مواصلات مريحه نوعا ما شويه المكن خربان وشويه المراوح في المترو عطلانه وشويتين زمن التقاطر يزيد وبصفه خاصه مساء واللي يزيد الامر تلاقي في عز الناس ماهي عاوزه تروح اشغالها في الصبح تلاقي صوت تغريد السماعات بيقول لك معلش يا جماعه المترو ده مش هايكمل للمحطه واخره المحطه اللي جايه ودي كمان بقم يستكتروها فبقي المترو يخزن ويرجع تاني والحدق اللي يفهم بقا هو المترو ده هايكمل ولا ظروفه ايه خلاص بقا احنا حلينا كل ده مش باقي بس الا نحل الناس تطلع منين وتنزل منين بالذمه ده اسمه كلام أرحمونا يرحمكم الله."
archived = "2010-03-14"
