subject = "2 لواء امن دولة طلع معاش وعمل شركة امن وعايزك يلهط"
author = "من العصابة"
posted = "2008-08-04"
text = "الحكاية ببساطة ان احد السادة اللواءات عمل شركة امن على الورق من داخل شقتة واخد عقد من شركة المترو ان سيادتة ينظم الركوب والنزول وكان الناس شوية بطيخ هيحملوهم فى عربية نصف نقل<br />يعنى وسيلة لاسترزاق احد قيادات الامن اللى حموا الفساد والتخريب فى البلد<br />وبدل ما يشتروا قطع غيار وفرامل ويصلحوا المكيفات والتهوية ويحسنوا مرتبات السواقين وعمال الصيانة - يصرفوا الفلوس على الامن والركوب والنزول وتفتيش الناس ومعاك اية فى الشنطة يا افندى وشايلة اية ياست انت<br />بلد بتنهار<br />كل واحد بيلهط<br />والمثل بيقول ان خرب بيت ابوك خد منة قالب"
archived = "2010-03-14"
