subject = "كدب"
author = "Sherif"
posted = "2007-06-18"
text = "والله أنا بدأت أشك في نوايا القائمين على هذا الموقع لأن موضوع زي ده لا يمكن يمر مرور الكرام صحيح أن الحكومة المصرية في النهاية مش هتعمل حاجة بس على الأقل هتتناقله الصحف والمحطات الفاضائية فور حدوثه. يعني معقول محدش أخد أي خبر بالموضوع ده لا وكالات أخبار محلية أو عربية أو أجنبية غير إنتم؟؟؟<br />أنا صراحة شايف إن ده موضوع مفبرك هدفه الإثارة وجذب أكبر عدد من القراء ولا أساس له من الصحه. وده إن دل فإنه يدل على الإفلاس الثقافي."
