subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-10-05"
text = "بسم الله الرحمن الرحيم<br />أتقدم إلى سيادتكم بهذا الالتماس متمنياً أن تشملونى بعطفكم وكرمكم<br />حيث أننى معاق أبلغ من العمر 28 عام حاصل على ليسانس لغة عربية ودبلوم تربية وبتقدير جيد ودورات كمبيوتر<br />ومتزوج من يسرية عبدالله معاقة وحاصلة على ليسانس لغة عربية ونواجه صعوبات الحياة ولا نستطيع توفير أدنى متطلبات الحياة.<br />لذا نلتمس من سيادتكم الرأفة والرحمة والنظر إلى ظروفنا وأن تتكرموا بتوفير فرصة عمل لنا نحن الاثنين فى إى مؤسسة من مؤسسات الدولة على أن تكون قريبة من مسكننا<br />وشكراً لسيادتكم<br />مقدمه لسيادتكم<br />ناجى ابو الفتوح عطية<br />ويسرية عبدالله إبراهيم<br />الشرقية - الزقازيق - هرية رزنة<br />ت / 0552270549"
