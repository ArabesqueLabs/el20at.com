[[comments]]
order = 6
subject = "شىءلا يصدقة عقل"
author = "صفاء محمودعيد حسن"
text = "بسم اللة والحمد للة انة على كل شىء قدير ( ان ينصركم اللة فلا غالب لكم ) واللة انى لااصدق ما اقراءة احقا سنرى عن قريب الداعية النابغة عمر خالد على شاشة تلفزيون بلدة الذى اخرجتة منها وكائنة مجرم حرب والى الان وانا فى عجب<br />من هذا الامر عموما لقد قتل هذا الموضع بحثا من ذى قبل المهم الحمد للة ان الحق رجع الى اصحابة ويكون هذا بسمابة<br />الاعتذار لهذا الشاب المحب لبلدة وامتة عن مابدر من امة الحبيبة مصر ونحن جميعانعلم انة يحبها حبا جمى المهم اننا واللة افرحين بهذاالخبر كفراحتنا بالعيد وشوق شديد لرءوية هذا الحلم الذى كثيرا ما حلمنا بة الا وهو ان نراة على شاشة التلفذيون المصرى لاء واية عاى شاشة برنامج البيت بيتك حقا (شىء لايصدقة عقل )"
archived = "2010-03-14"
capture_url = ""

