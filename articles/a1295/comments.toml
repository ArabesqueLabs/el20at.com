[[comments]]
order = 2
subject = "انقذو شخص انقذ الكثير"
author = "الحسيني حمدي عبد الباقي"
posted = "2008-05-08"
text = "انا عارف اني المفروض اعلق بس انا بجد مش لاقي حل للمشكله دي وياريت اي حد يساعدني<br />بسم الله الرحمن الرحيم<br />نداء إلي كل رجال الخير<br />ندعوكم للمساهمة معنا في استكمال ملحمة إنسانيه من الدرجة الأولي،وهي قصة رجل عرف بالعطاء والمجهود الوفير في أعمال الخير، له بصمات واضحة في مسيرة العمل الخيري وساهم كثيرا في رعاية وكفالة الأيتام ورعاية المرضي والفقراء .والآن جاء الدور لرد الجميل .هذه الشخصية تعمل طبيبا بشريا أصيب في الفترة الاخيره بمرض في الكبد ومع تطور هذا المرض وصل إلي مرحلة تتطلب زراعة الكبد .وقد بدأت تكلفة العملية(900.000) تسعمائة ألف جنيه وبعد تدخل السيد وزير الصحة والسكان وصلت إلي(600.000) ستمائة ألف جنيه وبعد تدخل نقابة الأطباء ومجهودات أهل الخير وهيئة التامين الصحي أصبح المبلغ المطلوب حاليا (175.000) مائة وخمس وسبعون ألف جنيه<br />لـــــــذا<br />نرجو من كل رجال الخير المساهمة معنا في جمع هذا المبلغ المتبقي ونسال الله سبحانه وتعالي أن يجعل ذلك في ميزان حسناتكم إن شاء الله<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />للاستعلام<br />محمول:0120509455<br />بريد الكتروني :emad_hamdy969@yahoo.com<br />Emad_hamdy969@hotmail.com"
archived = "2010-03-14"
capture_url = ""

