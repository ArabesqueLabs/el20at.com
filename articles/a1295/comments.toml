subject = "ضع عنوان التعليق"
author = "باسمك يا عزيز  يا جبار يا فتاح"
text = "بسم اللة الحمن الرحيم (قل اللة اللةم مالك الملك توتى الملك من تشاء وتنزع الملك ممن تشاء تعز من تشاء وتزل من تشاء بيدك الخير انك على كل شى قدير)(الا ان نصر اللة قريب)(ان اللة مع الصابرين)ولما استحكمت حلقاتها فرجت وكنت اظنها لا تفرج فلقد دعونا اللة كثيرا ليعود الاستاذ عمرو خالد الى بلدة الحبيب مصر واستجاب الله لدعائنا ولقد تمنينا ان نراه علي شاشه الارضية وكنا نظن انها امنيه بعيدة المنال ولكن سبحان المجيب فليس هناك شى بعيد على الله فلك الحمد كل الحمد الهنا وكيف نحمدك ربنا"
archived = "2010-03-14"
