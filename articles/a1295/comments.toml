subject = "من اي مكان انت في قلوبنا"
author = "لمياء"
posted = "2008-06-21"
text = "الاستاذ عمرو خالد الله يبارك فيك وتكون سبب في هداية شبابنا وبنتناولا يهمك من اعداء الدين والحمد لله على رجوعك لبلدك وانا قصدي ببلدك هو الشباب والاهل مش الاعداء والسياسيين الي ميهمهمش الدين والله يعينك ويقويك ويزيد محبتك في قلوب الناس وسواء في مصر او في اي بلد اخري صوتك واصل لقلوبنا وعقلنا وهو ده المهم وربنا يزيدك من علمه وفضله"
