[[comments]]
order = 0
subject = "كل خلق الله حسن"
author = "دسوقي أحمد"
posted = "2007-06-28"
text = "السلام عليكم<br />أستاذ عبدالله تحية مني إليك فأنت أظرف البدناء الذين قابلتهم في حياتي<br />بس ليه ماتعملش ريجيم وتخس يامولانا حتي تكتب بعدها مثلا<br />كنت تخينا علي غرار كنت اخوانيا<br />نحافة ضد التمييز تيار بديل يعني<br />وأهو حاجة من التنوع الخلاق ياسيدنا<br />بس سيبك الجري نص المجدعة<br />تحياتي"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204819/http://masr.20at.com:80/newArticle.php?sid=10846"

[[comments]]
order = 1
subject = "لا تعليق ..بجد"
author = "محمد ممتاز - بيبو"
posted = "2007-06-29"
text = "لا تعليق بجد ..انا مش فاهم ازاى الموضوع يتكتب بالطريقة دى<br />يعنى كان اصلا مفروض يتكتب الموضوع على ناحية عامة مش خاصة للدرجادى<br />لا تعليق بصراحة<br />الموضوع مش هادف و تافه صراحة<br />احسن كان يتكتب الموضوع عن البدانة بصفة عامة و مشاكلها<br />و الصورة اللى فوق الموضوع مش هى الصورة اللى تبقى موجوده لانها مش كويسة خالص و لا تعليق فعلا مش قادر اكمل"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204819/http://masr.20at.com:80/newArticle.php?sid=10846"

[[comments]]
order = 2
subject = "فوائد لم يذكرها الطحاوي"
author = "سمير حسين أبو زعقوق"
posted = "2007-07-01"
text = "الأستاذ عبد الله الطحاوي لم يذكر فوائد أخرى للسمنة المفرطة ، لعلي الآن أذكره بأن التخانة في الجسم لا تعني تخانة في المخ ، فقد ذكر لي الطحاوي يوما أن بدانته كانت ومازالت لها دور مهم في تثقيفه ، والارتقاء بثقافته ، حيث تقلل البدانة من حركته ، وتدفعه للقراءة باستمرار ، فلو لم يكن الطحاوي بدينا لكان له برنامج رياضي يأخذ من وقته ثلاث أو أربع ساعات يوميا ، ما بين النادي والتمرين والعودة ، والاستعداد لبدء العمل ، لكن البدانة كانت سببا في أن يستغل الشيخ عبد الله هذا الوقت في التجول بين الكتب والمجلات وغيرها من وسائل التثقيف المختلفة ، لعلي أكون قد ذكرتك بفائدة أخرى للتخن كنت حكيتها لي من زمن وكلما رأيتك تقرأ تذكرتها ، وقد رأيت من الفائدة أن يعرفها القراء الكرام .<br />وأخيرا أتمنى لك المزيد من التخن ، لتزداد ثقافة وعلما ، وإن كنت ناوي تخس .. أنت حر"
archived = "2007-07-05"
capture_url = "https://web.archive.org/web/20070705204819/http://masr.20at.com:80/newArticle.php?sid=10846"
