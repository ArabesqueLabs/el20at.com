subject = "كيف باتت نسائهم والعذارى  ----- قصيدة للشاعر حافظ"
author = "ابو سعاد"
posted = "2008-11-03"
text = "نفس الحال<br />نفس الوجع<br />قصيدة 1905<br />سائل الليل عنهم والنهارا ----------------------------------------- كيف باتت نسائهم والعذارى<br />كيف امسى رضيعهم فقد الام ------------------------------------------- وكيف اصطلى مع القوم نارا<br />كيف طاح العجوز تحت جدار -------------------------------------------------- يتداعى واسقف تتجارى<br />رب ان القضاء انحى عليهم ------------------------------------------------ فاكشف الكرب واحجب الاقدارا<br />عشيتهم والنحس يجرى يمينا ----------------------------------- ورمتهم والبؤس يجرى يسارا<br />اخرجتهم من الديار عراة ------------------------------------------ حذر الموت يطلبون الفرارا<br />ايها الرافلون فى حلل الوشى ---------------------------------- يجرون للذيول افتخارا<br />ان فوق العراء قوما جياعا --------------------------------------- يتوارون ذلة وانكسارا<br />ان فوق العراء قوما جياعا -------------------------------------------- يتوارون ذلة وانكسارا"
archived = "2010-03-14"
