subject = "الإسلام ليس بحاجة لمثل هذه السخافات"
author = "عاشق فلسطين"
posted = "2008-06-09"
text = "إخوتي الكرام : إن الدعوة إلى الله وإلى الإسلام لا يكون إثباتها بمثل هذه الأمور السخيفة ....<br />وعن مقولة بأن هناك حديقة ألمانية أشجارها تشكلت على كلمة التوحيد وركعت لله عز وجل والإدعاء بأن ألمانيا أغلقت الحديقة<br />خوفا من انتشار الإسلام ما هو إلا جزء من لوحة فنان مصري<br />صحيح سبحان الله بكل وقت لكن إسلامنا الحنيف ليس بحاجة لمثل هذه السخافات ......"
