text = "جميل خاااااااااااااالص النشيد يا منى .. و الكلمات خطيرة ..و فكرة ان انا نحلم دى احلى من اللى بيقعدو يجيبولنا اكتئاب و يحبطونا و يحسسونا ان ما فيش امل,فجزاكى الله الف خيرا على الكليب ..و بالمناسبة انا بنت عم محمد السيد صاحب مدونة مش حاسكت..و بحبك فى الله يا منى"
