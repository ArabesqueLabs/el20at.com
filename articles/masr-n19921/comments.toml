[[comments]]
order = 1
subject = "قضت أمس الأربعاء بسجن مجدي حسين الأمين العام لحزب العمل المجمد والناشط الإسلامي لمدة عامين وتغريمه 50 آلاف جنيه مصري،"
author = "مش ححبك"
text = "طب سنتين سجن معقولة مش مشكلة اهو الواحد في السجن زي براه لا شغلة ولا مشغلة<br />لكن 50 الف جنيه مصري غرامه<br />يا دي الوقعة السودا<br />ودا حيجبهم منين دول<br />وحياتك انت ما حتلاقي في بيته كله --5 جتى"
archived = "2009-02-14"
capture_url = "https://web.archive.org/web/20090214125618/http://masr.20at.com:80/newArticle.php?sid=19921"

[[comments]]
order = 2
subject = "كل الطرق تؤدى الى ابو زعبل"
text = "محاكم عسكرية<br />محاكم امن دولة<br />محاكم جنائية<br />محاكم ادارية<br />محاكم الاسرة<br />محاكم الاحوال المستعجلة<br />كلة بيودى لابو زعبل او السجن الحربى<br />فية حرية اختيار للمواطن للمحكمة اللى هو عايزها<br />والاحكام جاهزة<br />والزنازين فاضية<br />وكل واحد بينضرب على الجنب اللى يعجبة"
archived = "2009-02-14"
capture_url = "https://web.archive.org/web/20090214125618/http://masr.20at.com:80/newArticle.php?sid=19921"

[[comments]]
order = 3
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
text = "مجدى حسين الاخوانى المتأسلم فاكر ان الحدود مفتوحة يدخل ويخرج منها بلا قيود او شروط !! نفس فكر الفلسطنيين عايزين نفتح الباب على البحرى ويدخلوا مصر كما لو مصر بلد بلا صاحب !! السؤال مجدى حسين حينما خرج متسلل عبر الحدود اخطاء او لا !! والاجابة اخطاء وعقوبة السنتين غير كافية !! الغريب ان العالم الصيع بتوع الوقفات وقفة الاحتجاجية خرجوا كالعادة الى الشوارع والارصفة ليقفوا ضد الحكم العسكرى !! ماذا يهمنى ان يكون الحكم عسكرى او مدنى الذى يهمنى ان مجرم ارتكب جرم ونال العقوبة مقابل ذلك الجرم !! كم اتمنى ان تعم المحاكم العسكرية تلك المحاكم التى لم يسطيع المتأسلمون السيطرة عليها حتى الان !! كم اتمنى ان تعم المحاكم العسكرية تلك المحاكم التى تمتاز بالقوة والحزم والحسم ضد اعداء الوطن من الاخوان المتأسلمين ومن هم على شاكلتهم ."
archived = "2009-02-15"
capture_url = "https://web.archive.org/web/20090215201355/http://masr.20at.com:80/newArticle.php?sid=19921"
