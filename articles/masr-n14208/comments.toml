subject = "الطنطاوى دخل فى النووى يا رجالة"
text = "الطنطاوى مفتى الحزب الوطنى اصبح يفهم فى النووى وهيفتى زى ما بيفتى فى شروط الاستنجاء وهيتكلم فى السياسة<br />مش عارف مين اللى زقة يقول بقين الكلام النووى دى<br />والا يمكن الشيخ فاكر النووى دة من نوى المشمش او نوى البلح<br />او يمكن قرات كتاب الشيخ النوواوى - او يمكن الووى جة من نويت اطلع روحكم<br />عم الشيخ - خليك فى الدين بس"
archived = "2008-02-19"
capture_url = "https://web.archive.org/web/20080219232541/http://masr.20at.com:80/newArticle.php?sid=14208"
