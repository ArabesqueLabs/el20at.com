[[comments]]
order = 1
subject = "البلد"
author = "الشاعر على سلامة"
posted = "2008-05-27"
text = "تحس ان البلد بتصحى من النوم<br />بتقول اة يا ضهرى<br />شعرها منكوش<br />وصوتها مبحوح<br />كأنها كانت نايمة<br />فى عشة الفراخ<br />اللى فوق السطوح<br />وتسند على مين ؟<br />دة الكل مدبوح<br />لا ضل راجل<br />ولا ضل حيطة<br />مفيش غير شوية زيطة<br />بتييجى شوية<br />و بعدين تروح"
archived = "2010-03-14"
