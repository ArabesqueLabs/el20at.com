text = "انه لشيىء عجيب بلد بها مسلمون وكانت قديما الولة البيزنطية النصرانية ودخلها الاسلام على يد محمد الفاتح \"الثانى\" يدخلها اقذر مبادىء الغرب وهى العلمانية ويطبقونها لدرجة انهم وهم المسلمون يحاربون الحجاب اعظم شيىء امر الله به المراة المسلمة لعفتها والحفاظ عليها ان لله وان اليه راجعون انها بلد بها مسلمون اسما فقط يسجل فى هويتهم مسلمون والاسلام برىء منهم ومن امثالهم"
