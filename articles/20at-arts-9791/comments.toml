subject = "لها ترنيمه جميله .....صدفة"
author = "ابوحنين الكريماوي"
posted = "2008-09-09"
text = "قصيدة (صدفة) ابدع ماغنته أنوار عبد الوهاب لم تشيري اليه فهي بمستوى (أغضب) وربما تفوقها بالاداء حيث تأخذ بيد المستمع الى عوالم خياليه بعيده يضاف لذلك التنوع بصوتها العذب واعطت لقصيدة صدفة روحية جميله فهي أغنيه متكامله اشتركت مع الملحن وكاتب القصيده في نجاحها لكن في فترة الثمانينيات اشتركت في مسرحيات هابطة المستوى كانت تسمى أنذاك(تجاريه) وبأدوار أقرب لان تكون كومبارس ربما لديها تبريرها الخاص لذلك كانت فيها أساءه لتأريخها وفنها الجميل"
