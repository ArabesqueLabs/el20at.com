subject = "فييييين"
author = "MODY"
posted = "2008-04-07"
text = "فين يا جماعة الكلام ده انا دخلت ملقتش غير دول بس :-<br />1250 – انهزام الصليبيين بالمنصورة بمصر خلال الحملة الصليبية السابعة، وأسر ملك فرنسا لويس التاسع.<br />1896 - إفتتاح أول دورة ألعاب أولمبية في أثينا.<br />1909 - المكتشف الأمريكي بيري يصل إلى القطب المتجمد الشمالي.<br />1917 - دخول الولايات المتحدة الأمريكية في الحرب العالمية الأولى.<br />1919 - بدء ثورة غاندي في الهند.<br />1992 - دول المجموعة الأوربية ال12 تعترف بالبوسنة والهرسك.<br />1994 - بداية الحرب العرقية في رواندا عندما أقدم متطرفون بإسقاط طائرة كانت تقل أول رئيسان لرواندا و[[[بروندي]] من أغلبية الهوتو.<br />1998 - باكستان تجرب صاروخ متوسط المدى قادر على الوصول إلى الأراضي الهندية.<br />هو احنا بتضحك علة نفسنا ولا ايه"
archived = "2008-04-07"
capture_url = "https://web.archive.org/web/20080407213241/http://masr.20at.com:80/newArticle.php?sid=15056"

