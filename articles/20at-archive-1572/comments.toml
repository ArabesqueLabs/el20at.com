subject = "صديقك تيمور"
author = "اكتب اسمك هنا"
text = "بصراحة ياسمير انا اكتر واحد ممكن مقدار موقفك عشان الا اول واحد كنت حاسس انك انت ولا الانسانة دى راح تتعلاقو بعض بس مكنتش اعرف فرق السن بس كانت عارف انكو راح تحبو بعض جدا برغم ارتباطك بانسانة تانية ولم عرفت انك سبتها اتاكدة اكنر منك انك راح تروح الا انسانة دى برغم فرقم الا بينك وبينها فى الشخصية اهى انسانة هادية وعاقلة وانت انسان مشعنن ودماغك ضربة زى واكيد انت فهيمنى بس انت كنت سرك معاة فى كل دة وكنت بحس انك كتير بتغير وانت معاة مش بتكون سمير الا انا وهو بنكون معفرتين فى كل شى بحس بتغير جزى وكامك انت مش انت بتكون شخص تانى من يومة عرفت منك معنا الحب وازى الانسان بيكون انسان تانى مع حبيبة الا بيحبة وان الحب ازى بيغير الانسان وفعلا انت حبك صادق وحرم الظروف تعمل كدة فيك وفيها ويحرمكم من بعض بس الا انا عايزة منك انك تتدافع عن حبك دة زى ما انا عارفك انك ما بتسيب حقك بساهل بس دى مش اى حق دة حبك الحقيقى والحاجة الحلوة الا لو خسرتها تعتبر خسرة كل شى ما تعمالش زى تخسر حياتك<br />صديقك الا بيحبك تيمور"
