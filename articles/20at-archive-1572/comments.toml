posted = "2009-03-20"
text = "انا موافقه ايه المشكله لما اتزوج من شخص اصغر منى او ايه المشكله لو الشاب اتزوج من بنت اصغر انا مش شايفه فيها مشكله لو الاثنين متفهمين ومش باين فرق السن البنت مهما بتكبر واخدت بالها من نفسها هو مش هياخد باله ابدا من فرق السن وبعدين فى بنات مش باين عليهم السن المشكله فى الاهل انهم يتقبلوا هذا الفرق لانهم بياثروا على الولد وعلى تفكيره دى اكبر منك والكلام اللى احنا عرفينه انما لو هو مقتنع بيها خلاص انا حصلى كده كذا مره لان شكلى اصغر من سنى فاللى بيشوفنى بيفكرنى صغيره ودى مشكلتى وحبيت شخص اصغر منى بس انا مكنتش عرفه ومش عرفه اعمل ايه بجد وانا مش عرفه هو عارف ولا مش عارف انى اكبر منه بس انا عرفت بالصدفه انه اكبر منى وحسيت بيخيبة امل فظيع لانى كل مره يحصلى الموقف ده وانا مكسوفه انه يعرف سنى يبعد عنى قولولى اعمل ايه فى حيرتى وخوفى ده"
