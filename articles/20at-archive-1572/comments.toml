subject = "حب عمري كله"
author = "جهينه"
posted = "2008-06-16"
text = "انا راي ان فرق السن ده مش مشكله في اي حاجه لان ياما رجاله كبيره وعقلها صغير جدا وغير قادره علي تحمل المسؤليه وياماما بنات صغيره وشكلها كبير جدا من غير اي حاجه<br />عامة يمكن دي وجهة نظر ليه لاني بصراحه مرتبطه بشاب اصغر مني 4 سنين ومع ذلك انا حاسه ان الدنيا كلها فيه بالنسبه الي وبجد بني ادم راجل ومتحمل المسؤليه لابعد حد وانا مقتنعه بيه جدا وحبيته بالرغم اني كنت من الاول عارفه سنه كويس وفعلا بحارب مع اهلي لاقنعهم بيه لان ممكن اخد اللي اكبر مني ومش نتفاهم او مش نرتاح يبقي ليه العذاب ومتهيألي ان الدين والاخلاق وتحمل المسؤليه هما المقياس الحقيقي اللي يترفض او يتقبل شخص سواء بنت او ولد عليه"
