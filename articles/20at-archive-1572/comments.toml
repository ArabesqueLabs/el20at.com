subject = "مواااافقة وبشدة جدا موت أوي خالص"
author = "DODOS"
text = "على فكرة بأه موضوع السن ده ولو انه مهم طبعا وبيفرق فحاجات كتيييييييييير أوي لكن مش هوا العامل الأساسي مطلقا لأن دي مسأله فروق فردية بين الأشخاص يعني المهم شخصية الرجل تكون قوية عاقلة متفهمة حنونة ونفس الشئ بالنسبة للبنت لازم تدي زوجها أو خطيبها حقة وتحسسة انه جوزها وحبيبها وصديقها وابوها وكل حاجه مهما كان فرق السن وده طبعا أكيد مش هاييجي غير بين اتنين الحب والتفاهم جمعهم مع بعض يعني تيجي كده تلقائية من غير قصد يعني هو يلاقي فيها كل المواصفات اللي عايزها ولما يلاقي فرق السن ده مش هايديله أي اهتمام خااالص وهي نفس الكلام لما تحس انه شخصية قوية وحنونة فنفس الوقت ومتفاهم معاها ومحتويها هي هاتلاقي نفسها بتتجاهل فرق السن ده خالص وانا أعرف اتنين كانوا أصحابي فالجامعة وهو أصغر منها بسنة ودلوقتي ما شاء الله اتجوزوا ومبسوطين جدا والحمد لله وعقبال طبعا سميييييييييييير وموكا لما نشوفهم كده فالكوشة ونقول يألف نهار أبيض يا ألف نهار مبروك , وفالآخر انا باوصي الشاب لما ييجي يختار بالحديث الشريف(....... فاظفر بذات الدين تربت يداك) , وباوصي البنوتة بالحديث الشريف (اذا جاءكم من ترضون دينه وخلقة فزوجوه ). هو ده الأساس اللي يتبني عليه بيت مسلم سعيد وللا اييييييييييييه؟؟؟؟؟<br />ححححححححححح بس خلاص ...."
