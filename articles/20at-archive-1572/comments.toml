text = "العلم يقول الافضل الرجل يكبر المراءة 5 سنوات<br />اختي متزوجه برجل يصغرها بسنة ونصف وتزوجته عن حب ولكن اهل الولد في البداية رفضو ولكن قال انل متمسك بها ويحبها ومقتنع فيها وتزوجا الكل كان ينظر لاختي بانها كبيرة بالسن ولا تناسب زوجها وبعد الانجاب بدات اكبر لدرجة انه بدا يطلب منها عدم الخروج معها ويقول لها وبكل وقاحة كل زوجات اصدقاتني صغيرات بالسن وفقط انا الوحيد بين اصدقائي تزوجت بامراة اكبر مني وانا محرج من هذا الامر وبدا يقول لها لا اشعر بانوثتك واشعر بحاجز بيني وبينك لا اشعربانك زوجتي اشعر بانك اختي او امي وحتى هي تقول لا اشعر به كزوج لااشعر بالمتعة الجنسية معه لانه اصغر مني"
