text = "الرجل عندما يقبل بزواج امراءة اكبر منه حتى لو عن حب سيكتشف بعد مرور السنين بان زوجته بدات تفقد بريقها حتى من الناحية الجنسية يبداالبرود الجنسي و حتى ابعد الانجاب تبدو كبيرة جدا بحيث ان الرجل يشعر باحراج ان خرج معها والمراءة من ناحية المعاملة تحب ان تسيطر على زوجها لانها اكبر منه سنا ويبدا هو يشعر بانه محتاج لامراءة صغيرة يكون امامها صاحب شخصية قوية والمراءة ايضا تحتاج لرجل يدللها فاذا كانت اكبر منه كيف تشعر بدلالها وانوثتها امام زوجها"
