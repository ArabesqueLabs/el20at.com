text = "الموضوع دة فعلا شائك لان العادات والتقاليد والمفهوم الشعبى ان اللى بيرتبط بانسانة اكبر منة لابد وان يكون لية مصلحة لكن لايروا او يفتكروا الرسول علية افضل الصلاة والسلام عندما تزوج السيدة خديجة رضى الله عنها وارضاها<br />لكن المهم فى الزواج التفاهم وان كانت فية المصلحة ومااروع ان يكون الحب هو اكبر مصلحة<br />وانا بجد عارف ان موكا غيرت كتير فى سمير وبقولها لسة فاضل كتير لغاية لما تغيرى فية وفى شخصيتة المشعننة على راى اخى تيمور وبقول لسمير حافظ عليها وابذل كل ما فى وسعك لتنالها وتتزوجها<br />واقولك حافظ على شغلك لانة هو الوسيلة لكى ترتبط بها وفى النهاية<br />ارجوا لكم ا"
