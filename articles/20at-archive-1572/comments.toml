text = "بسم الله الرحمن الرحيم<br />ابدا برسول الله صلي الله عليه وسلم تزوج من السيده خديجه وهي اكير منه في السن وطبعا كانت علاقه ناجحه.<br />لو اقتضينا برسول الله فمن الممكن ان نكوّن علاقه بين رجل وامرأه اكبر منه في العمر لكن تحت ظروف معينه وهي غالبا في نفس الظروف التي كان فيها سيد الخلق ....................... بلا تعقيد ربنا يوفقكم.<br />لكن رأيي انا لا اريد ان تكون زوجتي اكبر مني في السن وهذا لشخصي انا.مش معني كده اني معترض علي الموضوع ده وفي النهايه اقول مادام ان الرجل رجل والمرأه مرأه في المكان الصحيح وفي حدود الاسلام يبقي مفيش مشكله وبدعي لكل اثنين مرتبطين ان ربنا يتم عليهم بخير."
