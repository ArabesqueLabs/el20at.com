subject = "يا أمة ضحكت من جهلها الامم"
author = "عبدلله"
posted = "2007-01-25"
text = "امريكا تحشد الاساطيل في الخليج لحرب جديدة لا ادري ضد من ولعلها ضد ايران ، وإن كانت الحرب ضد ابران فما عسى تبقي ايران في الخليج أو تذر ، وأهل الخليج من العرب يلهون ويلبعون وكان الامر لا يعنيهم.<br />أفيقوا يا أيها السكارى واعلموا أن من يقودونكم مجرد سفهاء عملاء لا تعنونهم في شئ حتى لو متم عن بكرة أبيكم"
