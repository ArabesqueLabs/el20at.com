[[comments]]
order = 4
subject = "مصر ضيعت فلسطين من زمان"
author = "----"
posted = "2008-12-31"
text = "الملك فاروق دخل حرب فلسطين علشان فلسطين سنة 1948<br />الحرب بين مصر ودول العدوان الثلاثى سنة 1956 ايام المرحوم عبد الناصر حدثت بسبب تأميم القناة وانتزاعها من انجلترا وفرنسا ولا علاقة لفلسطين بها<br />الحرب التى جرت سنة 1967 بين مصر واسرائيل بسبب اغلاق مصر المضايق البحرية وخليج العقبة والحشود على سوريا وتم ضياع القدس وقطاع عزة والضفة الغربية ولم تكن الحرب اطلاقا بسبب فلسطين ولكنها تسببت فى ضياع كل فلسطين بسبب مصر وتلك حقيقة يعرفها كل طفل<br />الحرب سنة 1973 كانت لتحرير ارض سيناء المحتلة ولم تكن لتحرير فلسطين<br />اذن المصريون اضاعوا فلسطين<br />والحرب الوحيدة اللى عملتها مصر علشان فلسطين كانت ايام الملك فاروق سنة 1948"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

