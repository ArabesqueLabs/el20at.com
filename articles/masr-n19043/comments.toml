[[comments]]
order = 13
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2009-01-01"
text = "ايه اللي انتي كاتبه ده كسوفك من ايه ده بدل ما يكون عندك ذرة حس وطني ببلدك و تدافع عنها وسط الحملات القذره اللي بتتعرض لها جاي حضرتك و بكل عدم مسئولية تكتب مقال زي ده بجد منتهي الاستهتار و عدم التقدير لقلمك يا استاذ يا صحفي مهما كانت وزارة الخارجيه غلطت احنا لازم نكون ايد واحده و نقف جنب قيادتنا وقت الازمه حتي لو بنختلف معاها"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 14
subject = "يا كسوفى"
author = "خلبوص"
posted = "2009-01-01"
text = "يا كسوفى لما الكمبيوتر اللى قدامى كل اجزائة صناعة الصين<br />يا كسوفى لما الجزمة اللى اشترتها من العتبة صناعة الصين<br />والقميص والبنطلون صناعة الصين<br />والجلابية صناعة الصين<br />والساعة على الحائط صناعة الصين<br />والتليفزيون صناعة الصين وتايوان<br />والساعة فى ايدى صناعة الصين<br />والكراسات بتاع عيالنا واقلام الرصاص والاقلام الجافة والاستيكة صناعة الصين<br />يا كسوفى<br />فين انتاج بلادى<br />يا كسوفى<br />لما استيرادنا 10 اضعاف صادرتنا<br />يا كسوفى<br />لما ناخد مساعدات من دول تانية<br />يا كسوفى<br />لما جامعاتنا مش من احسن 500 جامعة على مستوى العالم<br />يا كسوفى لما فيش سيارة مصرية 100 % ماشية فى شوارع بلدى<br />يا كسوفى لما اشوف الشباب قاعدين على المقاهى بدون عمل"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 15
subject = "مصر تقف فى طوابير الخبز ومش فاضية لحماس"
author = "من الوطنى"
posted = "2009-01-02"
text = "نحن شعب غلبان وعشانا عليك يارب<br />وسنظل غلابة وعدمين لمدة 50 سنة قادمة<br />والحرب تكلفة وامكانيات<br />الحرب يعنى فلوس<br />يعنى اسرائيل تطلق ضاروخ او قنبلة ارتجاجية ثمنها 300 الف دولار لهدم بيت او جامع لا يتعدى ثمنة 10 الاف دولار<br />يعنى اسرائيل حينما تهدم بيتا فى غزة تتكلف ثمن هدمة بعشر اضعاف تمن هذا البيت<br />القنابل والصواريخ دى مش ببلاش ولا بيلاقوها فى باطن الارض<br />اللى بيضرب خسران اكثر من المضروب<br />ولكن العملية كثر فلوس<br />فلوس جاية لهم ببلاش<br />انما احنا<br />فلا احد طلب منا ان نحارب لانة عارف ان حالتنا تصعب على الكافر وشافوا شعبنا واقف فى الطوابير بيدور على رغيف عيش<br />والسياسة بتاعتنا ماشية جنب الحيط وبتقول لاسرائيل حاضر ونعم وطلباتك وتحت امرك<br />هو دة الواقع<br />احنا غلابة قوى يا بية<br />وبلاش عنتريات<br />طلقة الدبابة الواحدة بخمسين الف دولار - هنجيب من اين ؟ واحنا عايشين على المساعدات<br />سامحونا<br />ورحم اللة امرؤا عرف قدر نفسة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 16
subject = "اغلبوهم بالصوت"
author = "انسان"
posted = "2009-01-02"
text = "العرب بدل ميبقوا ايد واحده ويعماو اتحاد عربى اقوى من الاتحاد الاوربى ومن امريكا ومن الكيان الصهيونى المسمى بدوله اسرائيل<br />لا بدا العرب وبكل سزازجه يرمو بعض بالخيانه والتخاذل نظام اغلبوهم بالصوت<br />وبكده العدو يبقى ضرب عصفورين بحجر واحد قضى على فلسطين وفرق اكتر واكتر بين العرب (قصدى اللى فاضل من العرب)"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 17
subject = "لا يوجد خيانة ولا تواطىء ولكن يوجد عجز"
author = "شحبور الصعيدى"
posted = "2009-01-02"
text = "صعيدى يا بية وعندة بارودة بروحين<br />مفيش رئيس عربى خاين ولا متواطىء - ولكن فية رئيس عربى خايف<br />يعنى بالصعيدى كدة - لو اسرائيل اتهمت مصر بتهريب اسلحة الى غزة عن طريق الانفاق وان اسرائيل مش هتقدر تستحمل الوضع دة وهتدخل سيناء علشان تؤمن مواطينها وهتحتل شريط من سينا مثلا لغاية الممرات<br />يبقى الوضع اية<br />السؤال فى الازمة دى<br />احنا نقدر نعمل اية<br />الوضع منيل ومهبب<br />واقتصادنا مش هيستحمل حتى حشد قوات<br />السعودية هتنفع مصر<br />ايران هتنفع مصر<br />العرب هتنفع مصر<br />لا<br />لا<br />امريكا والنظام الحاكم والبنك الدولى دمروا اقتصاد مصر وباعوا مصانع الانتاج واجروا البلد مفروشة<br />فين السلاح او اى صفقة سلاح حديثة سمعنا ان الحكومة اشترتها للجيش علشان يحارب<br />مصر وضعها صعب جدا<br />والناس مجهزة الطائرات وقاعدة على الحدود للهروب<br />وكل المثتثمرين مستعدين يمشوا فى ثوانى ويسيبوا الشعب فى مهب الاقدار<br />بعيدا عن المهاترات - نحن فى خطر<br />وعلى جميع المصريين الاتحاد<br />والبحث عن حكومة انقاذ<br />من الممكن ان نتعرض لحرب من الغدر الاسرائيلى فى لحظة<br />دا راى واحد صعيدى - يمكن يكون مخى تخين ورضعت لبن حمير وانا صغير ولكن هذا رايى<br />فاعذورونى"
archived = "2010-03-14"
capture_url = ""

