text = "و67 مش محسوب ؟؟!!!!<br />من الأخر مصر عمله الى عليها و زيادة ... والى مش عجبه من كل الأخوه العرب ... يتفضل يروح لحكومته و يقولها تحارب!!!<br />حكومة فاسدة ايوة... بس مش اندال ولا خونة ... فألى لسانه بيكلوه وعياز يتطاول على مصر و المصريين.. يرو يشطر على أهل بلده الأول!!!!و لا يمسك سلاح و يروح يحارب ... و لا الحرب ده مسئولية المصريين بس؟ و بقية العرب اه؟كل العادةشاطرين بس بيتفرجوا على التلفزيون ويشتموا فى مصر...<br />روح يا شاطر انت و هو اشطر على أهل بلدك الأول!!!!!"
