text = "ازمة فى رغيف الخبز وتجويع الشعب المصرى المتعمد لالهاء الشعب عن الحرامية<br />وضع الشعب فى ازمات مستمرة وفقر وبطالة<br />تدعيم اسرائيل بوقود الغاز رغم دوخة الاسرة المصرية للحصول على انبوبة غاز او بوتاجاز<br />نجوع شعبنا وندعم اسرائيل<br />هل هذة حكومة تمثل المصريين<br />ام حكومة تمثل شارون و اولمرت"
