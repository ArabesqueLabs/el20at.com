[[comments]]
order = 6
subject = "بص فى الصورة كويس"
text = "لا - ما شاء اللة - وزير خارجية قلبة رهيف وحنين قوى - وشكلة عامل زى عبد الحليم حافظ فى فيلم ابى فوق الشجرة وهو بيسبل عينية للمثلة نادية لطفى<br />يا عم اية الحنية دى<br />مش انت قلت قبل كدة انك هتكسر رجل اى فلسطينى يعبر الحدود<br />لا - والبنت بتضحك ومسخسخة خالص<br />يا اللة - حاجة تفرح - ما هم كلهم يهود"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 7
subject = "رد على محمد اللي بيقول علي مع الحق والحق مع علي"
author = "مش كاتب"
text = "علي مع الحق والحق مع علي والخوارج انشقوا من شيعة علي واصبحوااعداء علي<br />وبعدين الشيعة ما بيحرروش حاجه ولا بينيلوا حاجه الشيعة سبابين وشتامين بس<br />القدس فتحها سيدنا عمر والجيش بقيادة خالد ابن الوليد وابو عبيدية بن الجراح وحررها صلاح الدين الايوبي وكلهم كانوا اهل سنه وجماعة<br />الشيعة بيحاربوا اهل السنه بس يا ابني ما بيحربوش اليهود على العكس هما واليهود ضد اهل السنه"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 8
subject = "رد على مصر ضيعت فلسطين من زمان"
author = "ابومحسن غربة 27 سنه"
text = "انا مش حأقدر اشتم واهزأ علشان خاطر انا صايم النهاردة<br />النهاردة الخميس وانا بفضل ربنا متعود اصوم الاثنين والخميس<br />بس كل اللي اقدر اقولهولك عيب تسيب نفسك جاهل روح اقرأ يا ابني وروح اتعلم قبل ما تعلق وقبل ماتتفلسف<br />روح اقرأ كتاب عن اليهود<br />من اول سيدنا ابراهيم ما اتجوز ستا ساره وستنا ساره خلفت سيدنا اسحاق وسيدنا اسحاق خلف سيدنا يعقوب وسيدنا يعقوب خلف 12 ولد اسمهم الاسباط وكانوا في فلسطين<br />12 سبط دول هما جدود اليهود منهم سيدنا يوسف اللي فيه سورة في القران متسميه باسمه<br />الموضوع طويل اوي يا روح امك<br />روح لواحد بيفهم وخليه يحكيلك بقية القصة لحسن دي قصة طويلة ماينفعش احكهالك في تعليق<br />وما لكش دعوه بمصر لحسن اقطعك<br />مصر دي كانت بتستلف فلوسكوا اللي انتوا حطينها في بنوك اليهود في سويسرا وبتدفع الفوايد بتاعتها"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 9
subject = "اللي حيرش مصر بالميه حرشه بالدم"
author = "ابومحسن غربة 27 سنه"
text = "مصر هي أمي ..<br />مصر هي أمي .. نيلها هو دمي<br />شمسها ف سماري .. شكلها ف ملامحي<br />و إن كان لوني قمحي .. ده من فضل مصر<br />ما تلاقيش مثالها .. ست كل عصر<br />عشة جنب نيلها .. تسوى ألف قصر<br />ولا وردة بلدي .. فيها عطر مصر<br />ولا سحر مصر .. ولا جو مصر<br />ولا .. ولا .. ولا<br />ده شئ ملهش حصر<br />روحوا زوروا مصر<br />و إنتوا تعذروني .. لما أقول يا مصر<br />مصر .. مصر .. مصر<br />فاتك نص عمرك ياللي ما شفت مصر<br />ده التاريخ ف مصر .. و الهرم ف مصر .. و الكرم ف مصر<br />و الحلوين ف مصر .. و الجدعان ف مصر<br />ادوني عصاية .. أرقص رقص مصر<br />.. روحوا زوروا مصر<br />و انتوا تعذروني .. لما أقول يا مصر"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 10
subject = "رد على بصو في الصورة كويس"
author = "مش ححبك"
text = "اولا بصو في الصورةكويس دي بتاعتي انا وانا اللي دايما بكتب هذا العنوان<br />لو سمحت ما تسرقش شغل غيرك خليك محترم ثانيا الراجل دا يبقى وزير خارجية بلدك<br />بيعمل كده علشان خاطر رغيب العيش اللي انت بتاكله يستمر"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 11
subject = "رد على مالنا ومال الحرب خلينا في شارع الحرم"
author = "مش ححبك"
text = "وانت كمان خليك محترم وعيب كده واقرأ كويس وروح لناس تعلمك<br />ما تسبش نفسك جاهل كده"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 12
subject = "ضع عنوان التعليق"
text = "ايه اللي انتي كاتبه ده كسوفك من ايه ده بدل ما يكون عندك ذرة حس وطني ببلدك و تدافع عنها وسط الحملات القذره اللي بتتعرض لها جاي حضرتك و بكل عدم مسئولية تكتب مقال زي ده بجد منتهي الاستهتار و عدم التقدير لقلمك يا استاذ يا صحفي مهما كانت وزارة الخارجيه غلطت احنا لازم نكون ايد واحده و نقف جنب قيادتنا وقت الازمه حتي لو بنختلف معاها"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 13
subject = "يا كسوفى"
author = "خلبوص"
text = "يا كسوفى لما الكمبيوتر اللى قدامى كل اجزائة صناعة الصين<br />يا كسوفى لما الجزمة اللى اشترتها من العتبة صناعة الصين<br />والقميص والبنطلون صناعة الصين<br />والجلابية صناعة الصين<br />والساعة على الحائط صناعة الصين<br />والتليفزيون صناعة الصين وتايوان<br />والساعة فى ايدى صناعة الصين<br />والكراسات بتاع عيالنا واقلام الرصاص والاقلام الجافة والاستيكة صناعة الصين<br />يا كسوفى<br />فين انتاج بلادى<br />يا كسوفى<br />لما استيرادنا 10 اضعاف صادرتنا<br />يا كسوفى<br />لما ناخد مساعدات من دول تانية<br />يا كسوفى<br />لما جامعاتنا مش من احسن 500 جامعة على مستوى العالم<br />يا كسوفى لما فيش سيارة مصرية 100 % ماشية فى شوارع بلدى<br />يا كسوفى لما اشوف الشباب قاعدين على المقاهى بدون عمل"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"
