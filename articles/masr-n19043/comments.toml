subject = "حكومات مين ؟ انهم المتحدث الرسمى باسم اسرائيل"
author = "هأو"
posted = "2009-01-05"
text = "ليفنى جاءت واخبرت الخارجية والحكومة ان الحرب على حماس ستستمر اسبوعين 15 يوم واعلنت الحرب من شرم الشيخ<br />علشان كدة العملاء منعوا القمة العربية<br />ووزراء الخارجية صدروا المشكلة الى الامم المتحدة وهم يعرفون انة مفيش فايدة<br />بعد ايقاف الحرب اى بعد 15 يوم قتال<br />سوف تتبرع السعودية والامارات وقطر وليبيا بمعونات تبنى البيوت والعمارات التى تهدمت وشوية مساعدات اكل وشرب<br />وطبعا يمكن يجيبوا حكومة وحدة وطنية بين الضفة وغزة تكون حكومة عميلة زيهم<br />هذا هو السناريو المتوقع"
archived = "2010-03-14"
