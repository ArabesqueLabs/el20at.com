[[comments]]
order = 0
subject = "المصرية متورطة حتى النخاع فيما يحدث من مجازر في غزة"
author = "مش لازم ولا ضروري"
text = "الحكومة المصرية ليست متورطه في شيء والحكومة المصرية ليس لها دخل بهذه القضية وعلى سكان غزه السمع والطاعة لولي الامر الفلسطيني محمود عباس وكفاية شغل الخوارج الذين خرجوا على سيدنا عثمان وقتلوه وخرجوا على سيدنا علي وقالوا له الحكم لله لا لك يا علي<br />كفاية بأه شغل الخوارج اللي ودانا في ستين داهية"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 1
subject = "الشيخ شاكر الحيران/ حماس خوارج ويجوز قتالهم"
author = "مش مهم"
text = "الشيخ شاكر الحيران ليس فقط بجوازقتل عناصر حماس بل وبدخول قاتليهم الجنة .<br />وكتب الحيران في فتواه التي نشرها موقع فلسطين برس الالكتروني في مكان بارز<br />يقول .ايها العساكر والضباط والقياديون اعلموا ان امن البلد في رقابكم وان الله<br />عاذركم فيما تفعلون فانتم الاسلام لا لااسلام يقاتلكم ان من يقاتلكم هم الخوارج<br />الذين خرجوا عن شريعتكم فطوبى لمن قتل منكم بايديكم وطوبى لمن قتلهم اوقتل<br />احدا منهم .<br />وهاجم الحيران رابطة علماء فلسطين وذهب الى تكفيرهم حيث قال .ايها الرابطون<br />خلف حماس في رابطة علما فلسطين انتم اول من تسعر بكم النار يوم القيامة وفي<br />رقابكم دماء الابرياءفقد كتمتم ماانزل الله من الهدى والبيانات وبعتم الدين بعرض<br />من الدنيا فحسبنا الله ونعم الوكيل"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 2
subject = "كلمة قليلة"
author = "محمد جمال الدين"
text = "يا كسوفى دى كلمة قليلة جداً جداً جداً<br />أحنا ممكن نقول يا فضيحتنا .. ياتخاذلنا ... يا تواطؤنا .... وممكن كمان نقف نولول ونقول ما كانش يووومك يا مصرى<br />ما كانش يومك الى ما تعرفش ترفع فيه عينك من على الارض ."
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "محمد"
text = "علي مع الحق والحق مع علي<br />وباذن الله سيحرر فلسطين شيعة علي ,,لا مصر ولا غير مصر<br />وماذا فعلت مصر الان فعلا الشعب المصري شعب عربي ولكنه عنصري"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 4
subject = "مصر ضيعت فلسطين من زمان"
author = "----"
text = "الملك فاروق دخل حرب فلسطين علشان فلسطين سنة 1948<br />الحرب بين مصر ودول العدوان الثلاثى سنة 1956 ايام المرحوم عبد الناصر حدثت بسبب تأميم القناة وانتزاعها من انجلترا وفرنسا ولا علاقة لفلسطين بها<br />الحرب التى جرت سنة 1967 بين مصر واسرائيل بسبب اغلاق مصر المضايق البحرية وخليج العقبة والحشود على سوريا وتم ضياع القدس وقطاع عزة والضفة الغربية ولم تكن الحرب اطلاقا بسبب فلسطين ولكنها تسببت فى ضياع كل فلسطين بسبب مصر وتلك حقيقة يعرفها كل طفل<br />الحرب سنة 1973 كانت لتحرير ارض سيناء المحتلة ولم تكن لتحرير فلسطين<br />اذن المصريون اضاعوا فلسطين<br />والحرب الوحيدة اللى عملتها مصر علشان فلسطين كانت ايام الملك فاروق سنة 1948"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

