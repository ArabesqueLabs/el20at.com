subject = "رئيس وزراء قطر عملها وفضحهم على الملاء"
author = "عاطف محمود"
posted = "2009-01-11"
text = "الجماعه الظلنطاحيه بتوع الانتخابات اللى نزلين تجريح فيك ياريت يكونوا سمعوا كلام الشيخ كويس رئيس وزراء قطرعلى الجزيره خربوها وقعدوا على تلها بس على فكره هما الجماعه دول كسبوا امريكا واسرائيل لكن فقدوا اهم حاجه تعرف هى ايه ياهوانت اسمك ايه صحيح<br />نرجع لموضوعنا الشئ اللى همافقدوه اللى اسموهم ايه دول هما اكثر من 99و99من المائه فى المائه بس مش عارف فى دورات الانتخابات القادمه حيجيبوا العدد بتاع كل مره ازاى ولايمكن سيدهم بوش حيرجع تانى للحكم ويجبلهم الاصوات تانى<br />اللهم انصراهل غزه اللى هما اهل سنه مش اهل شيعه واللى هما وهبوا حياتهم للدفاع عن الاقصى وبيدافعوا عن الارض والعرض اللى اجماعه اللى بهجموك مايعرفهوش"
archived = "2010-03-14"
