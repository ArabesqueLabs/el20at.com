[[comments]]
order = 0
subject = "المصرية متورطة حتى النخاع فيما يحدث من مجازر في غز"
author = "مش لازم ولا ضروري"
posted = "2008-12-31"
text = "الحكومة المصرية ليست متورطه في شيء والحكومة المصرية ليس لها دخل بهذه القضية وعلى سكان غزه السمع والطاعة لولي الامر الفلسطيني محمود عباس وكفاية شغل الخوارج الذين خرجوا على سيدنا عثمان وقتلوه وخرجوا على سيدنا علي وقالوا له الحكم لله لا لك يا علي<br />كفاية بأه شغل الخوارج اللي ودانا في ستين داهية"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

[[comments]]
order = 1
subject = "الشيخ شاكر الحيران/ حماس خوارج ويجوز قتالهم"
author = "مش مهم"
posted = "2008-12-31"
text = "الشيخ شاكر الحيران ليس فقط بجوازقتل عناصر حماس بل وبدخول قاتليهم الجنة .<br />وكتب الحيران في فتواه التي نشرها موقع فلسطين برس الالكتروني في مكان بارز<br />يقول .ايها العساكر والضباط والقياديون اعلموا ان امن البلد في رقابكم وان الله<br />عاذركم فيما تفعلون فانتم الاسلام لا لااسلام يقاتلكم ان من يقاتلكم هم الخوارج<br />الذين خرجوا عن شريعتكم فطوبى لمن قتل منكم بايديكم وطوبى لمن قتلهم اوقتل<br />احدا منهم .<br />وهاجم الحيران رابطة علماء فلسطين وذهب الى تكفيرهم حيث قال .ايها الرابطون<br />خلف حماس في رابطة علما فلسطين انتم اول من تسعر بكم النار يوم القيامة وفي<br />رقابكم دماء الابرياءفقد كتمتم ماانزل الله من الهدى والبيانات وبعتم الدين بعرض<br />من الدنيا فحسبنا الله ونعم الوكيل"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235808/http://masr.20at.com:80/newArticle.php?sid=19043"

