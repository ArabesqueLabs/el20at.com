[[comments]]
order = 7
subject = "الفيلم من اعداد و اخراج البراء اشرف و انتاج الجزيرة"
author = "مش لازم"
text = "تعرض الجزيرة يوم الاربعاء القادم تحت المجهر يتحدث عن الصحفيون الجدد و ظاهرة تدوين الفيديو و يتحدث عن تجربة انسى و انسى فيديو و يستضيف خديجة مالك ...الفيلم من اعداد و اخراج البراء اشرف و انتاج الجزيرة<br />ايوه يا عم براء شبتنا وسبت عشرينات ورحت تشتغل بره يا عم<br />اله يسهلك في الاخراج"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502204148/http://masr.20at.com:80/newArticle.php?sid=15533"

[[comments]]
order = 8
subject = "كان فى الحربية واتخرج بعد 11 شهر دراسة وبقى رئيس - يا حللولى يا حللولى هو احنا رحنا فى داهية من شىء شوية"
author = "زعبلة"
text = "من 3 ايام احتفل جمال مبارك فى العريش بعيد تحرير سيناء هذا ما نشرتة الجرائد وما قيل فى الجرايد الاسرائيلية انة كان بيدشن خط الغاز لاسرائيل<br />عقد غاز لاسرائيل لمدة عشرين سنة بتراب الفلوس علشان يشغلوا محطات الكهرباء الاسرائيلية<br />ومحطات مصر لم يصلها الغاز بعد<br />الغاز المصرى لم يصل المنيا بلدى ولكنة وصل الى اسرائيل<br />هل يستمد النظام المصرى شرعيتة من اسرائيل ؟<br />هل حبيب العادلى هو رئيس فرع الشين بيت الاسرائيلى فى مصر ؟<br />انا مش عارف<br />هل مصر دولة محتلة من اسرائيل ؟<br />الرصاص وقنابل الدخان وارصاص المطاطى اللى انضرب فى المحلة كان اسرائيلى الصنع<br />كل هم مصر وعمر سليمان مع حماس هو الافراج عن العسكرى شاليط اليهودى<br />مصر تتحدث مع حماس كانها الممثل الرسمى عن اسرائيل"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502204148/http://masr.20at.com:80/newArticle.php?sid=15533"

[[comments]]
order = 9
subject = "الحكومة المصرية مهمومة وزعلانة ولا تنام من اجل العسكرى شاليط"
author = "زعلان"
text = "اية اهتمام الحكومة القوى دة بالعسكرى الاسرائيلى شاليط<br />يكونش خالتة اللى عندنا<br />وخالتة زعلانة قوى على بنت اختها<br />اية القرف دة"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502204148/http://masr.20at.com:80/newArticle.php?sid=15533"

