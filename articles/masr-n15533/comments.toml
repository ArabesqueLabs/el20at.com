[[comments]]
order = 11
subject = "ياريس فرصة تاريخية ليك ولينا انك تعتزل الحياة السياسية وتشيل معاك شوية المحظوظين اللى ودو البلد فى ستين داهية على حسك طبعا"
author = "كابتن حالو"
text = "دى امنية ملايين الشعب انك تتخذ قرار زى كدة لانة لو ربنا ادا لك طولت العمر وعشت مية سنة كمان مش حتقدر تعمل زى مايقولولك انجازات لان البلد والشعب بقى على الحديدة وزى ماسمعنا انة فية ضرائب جديدة حتنزل مع الزيادة المزعومة ليبداء فصل جديد من فصول الدحك على الناس"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506060941/http://masr.20at.com:80/newArticle.php?sid=15533"
