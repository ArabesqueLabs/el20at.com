[[comments]]
order = 1
subject = "i love u"
author = "shams 22"
text = "حبك ياريس شلّنى<br />وعلّنى و غلّنى<br />ويكفينى منك اننى<br />عايش فى بلدك يازعيم<br />ده الشعب فى عهدك مهيّس<br />واللى تايه واللى تيّس<br />مش كفاية...ادينا متحرمناش ياريس<br />من الحنان ومن النعيم<br />ايه يعنى فاكهة مسرطنة<br />اولحمة حمير معفنة<br />او فراخ متهرمنة<br />ماهوبردو احسن من مفيش<br />زدنا كمان وكمان ياسيدى<br />ده انت بابا وانت ماما وانت تيزه وانت سيدى<br />ياريسنا يامبارك يامنور ياحبيبى<br />شمس 22"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502204148/http://masr.20at.com:80/newArticle.php?sid=15533"

