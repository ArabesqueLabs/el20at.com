subject = "منك لله يامروه"
author = "سواق تاكسى"
text = "ايه يامروه ده بالذمه ده موضوع يستاهل التعليق ؟؟؟ مسلسل فى الاذاعه !! يعنى تفتكرى فى حد هايسمعه ؟ ده حتى الناس نسيت شكل الراديو واللى عنده راديو هاتلاقيه مضبوط على جول f m ولا انتى بتعملى دعايه للمسلسل من دلوقتى --- على العموم الحمد لله انا الراديو عندى فى التاكسى مابيجبش البرنامج العام وده من فضل ربنا عليا"
archived = "2008-05-02"
