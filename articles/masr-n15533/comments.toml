[[comments]]
order = 5
subject = "كل سنه وانت طيب با ريس... كل سنه وانت راكب واحنا مش راكبين"
author = "مش مدير الموقع ولا شريف الدواخلي"
text = "كل سنه وانت طيب يا ريس<br />كل سنه وانت طيب واحنا مش طيبين<br />كل سنه وانت طويل واحنا قصيرين<br />كل سنه وانت تخين واحنا رفيعين<br />كل سنه وانت مبسوط واحنا زعلانين<br />كل سنه وانت كبير واحنا صغيرين<br />كل سنه وانت سليم واحنا عيانين<br />كل سنه وانت شبعان واحنا جعانين<br />كل سنه وانت مكسي واحنا عريانين<br />كل سنه وانت فاهم واحنا مش فاهمين<br />كل سنه وانت نايم واحنا صاحيين<br />كل سنه وانت ضارب واحنا مضروبين<br />كل سنه وانت طالع واحنا نازلين<br />كل سنه وانت فاكر واحنا مش فاكرين<br />كل سنه وانت هادي واحنا مش هاديين<br />كل سنه وانت غني واحنا مأشفطين<br />كل سنه وانت كبير واحنا صغيرين<br />كل سنه وانت فالح واحنا مش فالحين<br />كل سنه وانت سيد واحنا خدامين<br />كل سنه وانت داهس واحنا مدهوسين<br />كل سنه وانت ساكن واحنا مش ساكنين<br />كل سنه وانت متدلع واحنا مش متدلعين<br />كل سنه وانت متجوز واحنا مش متجوزين<br />كل سنه وانت شغال واحنا عاطلين<br />كل سنه وانت لابس جذمه واحنا حافيين<br />كل سنه وانت مبسوط واحنا مبوزين<br />كل سنه وانت بتضحك واحنا معيطين<br />كل سنه وانت هايص واحنا لا يصين<br />كل سنه وانت عايم واحنا غرقانين<br />كل سنه وانت مفتح واحنا مغمضين<br />كل سنه وانت عاقل واحنا مجانين<br />كل سنه وانت طايل واحنا مش طايلين<br />كل سنه وانت ناجح واحنا ساقطين<br />كل سنه وانت بتجري واحنا مكسحين<br />كل سنه وانت بتكسب واحنا خسرانين<br />كل سنه وانت محظوظ واحنا مش محظوظين<br />كل سنه وانت سريع واحنا بطيئين<br />كل سنه وانت انيق واحنا مبهدلين<br />كل سنه وانت ناصح واحنا مش ناصحين<br />كل سنه وانت جامد واحنا مش جامدين<br />كل سنه وانت ملك واحنا مملوكين<br />كل سنه وانت طاير واحنا زحفازين<br />كل سنه وانت كاسر واحنا مكسورين<br />كل سنه وانت ناهب واحنا منهوبين<br />كل سنه وانت واكل واحنا متاكلين<br />كل سنه وانت معلم واحنا مش معلمين<br />كل سنه وانت مذاكر واحنا مش مذاكرين<br />كلسنه وانت شاطر واحنا مش شاطرين<br />كل سنه وانت ساجن واحنا مسجونين<br />كل سنه وانت ذكي واحنا مش ذكيين<br />كل سنه وانت مخلف واحنا مش مخلفين<br />كل سنه وانت عايز واحنا مش عايزين<br />كل سنه وانت لاعب واحنا مش لاعبين<br />كل سنه وانت قطه واحنا مقطقطين<br />انت فاكرنا يا حبيب الملايين<br />مسكين حتفتكر مين ولا مين ولا مين"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502204148/http://masr.20at.com:80/newArticle.php?sid=15533"

