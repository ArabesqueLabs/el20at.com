author = "الفثاء والافتاء"
posted = "2009-11-09"
text = "المفتى منزعج وهيطير برج من نافوخة وفى امريكا اطلق تصريحات ورجع من امريكا يكمل تصريحاتة وكان النقاب خطر داهم يقوض الدين ويدعو الى الفسق والعصيان ومعصية الرسول<br />بسلامتة يفتى باللى هو عايزة<br />انما مزاج الناس تلبس نقاب - مال ام اهلك - وانا ارى انتشار النقاب بمعدل سريع جدا<br />خلاص يا مفتى انت قلت وشيخ الازهر والزقزوق قالوا انة مش من الدين<br />وهنعتبرة موضة يا اخى يبقى حرقك فى اية - عجبنا موضة النقاب والسيدات هيلبسوة ارتاح بقى"
