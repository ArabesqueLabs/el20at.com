text = "كشف وجه المراة من الاعجاز المستقبلي للاسلام<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />الاسلام اخرج وجه المرأة عن دائرة العورة والدليل على ذلك انه لا تصح صلاة المرأة وهي مغطية الوجه<br />والصلاة عماد الدين<br />وهذا من اعجاز الاسلام<br />لانه عندما اخرج وجه المراة من دائرة العورة تنبأ بان كشف الوجه سيكون له ضرورة في المستقبل<br />وجاء المستقبل وظهرت البطاقات الشخصية ورخص القياده وجوازات السفر والكرنيهات وخلفه وهذه الاشياء لا بد ان تتصور فيها المرأة وهي كاشف الوجه وتخرج المرأة وهي حاملة للاثبات الشخصية<br />فيا جماعة ما تضيعوش وقتكم في كلام فارغ"
