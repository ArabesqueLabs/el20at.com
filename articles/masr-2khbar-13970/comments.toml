posted = "2009-11-11"
text = "الي صاحب التعليق رقم 3 :<br />عارف مشكلتك ايه ؟؟ انك موش عارف انت بتقول ايه ؟؟<br />كلام كله باطل و حاطط فيه كلمة حق ( اعجاز الاسلام) عشان تزينه ... يا اخي الفاضل دليلك بتاع صلاة المرأه بدون تغطية الوجه دليل ساذج جدا لاني اعتقد انك عمرك ما شوفت نساء بتصلي ف المسجد او ف الشغل او ف محطة قطر او حتي ف مكان عام من غير ساتر اما بالنسبة للبطايق و الكارنيهات و جواز السفر فاانت برضه موش هتلاقي واحده ماشيه ومعلقة كارنيه ..<br />و بعدين اي اسلام اللي انت بتتكلم عنه انه اخرج الوجه من عورة المرأه يا اخي ده النبي صلي الله عليه و سلم قال \" لا تنتقب المرأة المحرمة و لا تلبس القفازين \" يبقي بدليل الخطاب ان المرأه اذا لم تكن محرمه تلبس النقاب و القفازين , و برضه حديث اسماء بنت ابي بكر لما كانت ف الحج و ده حديث اسناده ذي الشمس ..<br />يا ريت فضيلة المفتي كان اتكلم ف فرض النقاب و لا جوازه ... لا , ده طلعة من دايرة الاسلام خااالص"
archived = "2010-03-14"
