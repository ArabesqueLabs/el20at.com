text = "كان نفسي فضيله المفتي يعلق علي العري والسفور الي انتشر في شوارع مصر المحروسه مش يلقي بكل ثقله وهمه محاربه انسانه عفيفه تصون نفسها ودينها من كلاب الطرقات حسبي الله ونعم الوكيل اين الاولي يا فضيله المفتي انك تتكلم العرايا والسافرات ولا انك تسن اسنانك علي من يغطي جسده حتي لا يفتن الناس الله لا يكسبك انت وطرطور الازهر وكمان انا عايز اعرف هو زقزوق ده مش وزير الاوقاف ؟ مال الاوقاف والافتاء في الدين مش دده مهمته صيانه واداره اوقاف المسلمين ولا مهمته الفتوي ؟ ايه ياناس اللغط ده"
