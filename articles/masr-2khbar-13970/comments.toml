posted = "2009-11-09"
text = "يا فضبلة المفتي : انا عاوز اعرف انت بتجيب الكلام ده منين ؟؟؟ ما هو يا إما علماء القرن الثالث الهجري و انت نازل و الائمه الاربعه دول كانوا حاش لله مابيفهموش او كانوا بيدلسوا علينا يا أما العيب فيكم ... و بعدين فضيلتك جبت منين ان النقاب مكروه عند الامام مالك .... يا خونا يا ريت نرجع للكتب و المراجع اللي فضيلة الامام و المفتي اساسا اتعلموا منها و منبقاش ذي اللي قال فيهم عبد الله بن المعتمر \" لا فرق بين بهيمة تنقاد و انسان يقلد \" او ممن قال فيهم الشافعي \" من قلة فقه الرجل ان يقلد في دينه الرجال \" ..<br />مشكلتنا اننا عاوزين ناخد الدين - بالقطارة - تتحط ف (بوق ) كل واحد فينا من غير ما نتعب و ندور ف الكتب ...<br />ربنا يهدي الامة و يكشف عنا الغمة و الصلاه و السلام علي النبي و علي اله و صحبه و سلم"
archived = "2010-03-14"
