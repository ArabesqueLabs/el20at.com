[[comments]]
order = 0
subject = "مش عاجبك"
author = "هاهاها"
text = "واللة انا شفت اسوار مدارس عليها صور ماما غوريلا والاسد وقدمهم جنينة مليانة ارانب"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112212452/http://masr.20at.com:80/newArticle.php?sid=12385"

[[comments]]
order = 1
subject = "والله زمان"
author = "شاب مصري جاهل"
text = "هههههههههه<br />موضوع في الجون يا يمنى بس السؤال بشكل اصح هو فيه دلوقتي مدارس بتعلم في مصر ؟؟؟<br />عجبى"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112212452/http://masr.20at.com:80/newArticle.php?sid=12385"

[[comments]]
order = 2
subject = "واحد"
author = "الواحد مش عارف ايه اللي بيحصل"
text = "و الله ده انا بشوف و انا ماشي الصبح ادام المدارس العجب العجاب ، الواحد يشوف الطلبه قاعدين برة لغايط متأخر ده انا كنت ماشي من ادام المدرسة الساعة 9 مش عارف مستنيين ايه"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112212452/http://masr.20at.com:80/newArticle.php?sid=12385"

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "marosh"
text = "بس معلهش يا يمنى هو مين اللى بيرسم الرسومات دى .. طلبة المدارس اللى لسه بيتعلموا الرسم، ولا مدرسين الرسم اللى لسه متخرجوش"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112212452/http://masr.20at.com:80/newArticle.php?sid=12385"

[[comments]]
order = 4
subject = "الموضوع عادي"
author = "عادي"
text = "انا حست ان الموضوع غريب من اللي مكتوب عليه من بره ، لكن لما قريته حسيت انه عاااااااااااااااااااااااادي"
archived = "2008-01-12"
capture_url = "https://web.archive.org/web/20080112084327/http://masr.20at.com:80/newArticle.php?sid=12385"

[[comments]]
order = 5
subject = "تعددت المدارس و العبث واحد"
author = "نيفين نيفى نوفا"
text = "بصى يا يمنى المدارس عندنا نسخه مكرره من بعضها<br />نسخه باهته لا تعكس الا واقع تعليمى اشد بهتانا<br />يا ريت جت على الرسومات لا ده حتى التصميم الهندسى و المعمارى الخارجى للمدرسه كئيب وواحد ف كل قريه و محافظه ف البلد<br />و بنقول نطور تعليمنا ازاى<br />؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2008-01-12"
capture_url = "https://web.archive.org/web/20080112084327/http://masr.20at.com:80/newArticle.php?sid=12385"
