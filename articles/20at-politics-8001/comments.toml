[[comments]]
order = 2
subject = ""
author = "المدرس"
posted = "2008-01-12"
text = "نكتة<br />دخل المدرس الفصل وسأل التلاميذ<br />مين فيكم يقدر يقولى اسم حيوان بيطير - قوم يا محمود<br />محمود - الفيل يا استاذ<br />الاستاذ غاضبا - الفيل بيطير ؟ اية الغباء دة - اتنيل اقعد - انت ابوك بيشتغل اية ؟<br />لواء فى مباحث امن الدولة يا استاذ<br />الاستاذ مرتبكا<br />شوف يا حبيبى هو الفيل صحيح وزنة تقيل انما ممكن يطير لو شد حيلة شوية - شاطر يا محمود اقعد يا حبيبى"
archived = "2011-10-15"
capture_url = "https://web.archive.org/web/20111015011543/http://www.20at.com:80/20at/politics/8001.html"

[[comments]]
order = 3
subject = ""
posted = "2008-01-13"
text = "حضرتك بتسال ايه علاقة الموضوع بالنكته<br />بنت الحاج عبدالفضيل سالت الراجل وقالتله<br />في النهاية سألته: هل تتخيل نفسك في شخصية أخرى على الشاشة أم أنك تفضل الطباخ؟،<br />أجاب موضحا أنه تعلم الالتزام و\"لكل إنسان حدود\"<br />فهمت يا اسيوطي بيك (لكل انسان حدود)<br />دا كلام ضباط امن الدولة (لكل انسان حدود)<br />فالاخ بتاع امن الدولة اول ما قرأ لكل انسان حدود تذكر ضابط امن الدولة وهو بيبرقلوا وبيصرخ فيه وبيقولوا الزم حدودك يا مواطن<br />علشان كده رأع النكته دي"
archived = "2011-10-15"
capture_url = "https://web.archive.org/web/20111015011543/http://www.20at.com:80/20at/politics/8001.html"
