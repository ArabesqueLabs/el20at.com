subject = "ربنا يشفى"
author = "بنت مصرية"
posted = "2009-03-18"
text = "محجبة سابقة :<br />حقيقى بجد ربنا يشفيكى<br />لان انتى اكيد مش انسانة طبيعية<br />والحجاب فرض يا استاذة<br />والدليل قول الله تعالى : ( وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَى جُيُوبِهِنَّ )<br />بالنسبة لكلامك الباقى كله<br />مش هاتعب نفسى ف تعليق عليكى<br />لانى عارفة النهاية ايه<br />وعشان انتى كمان تعرفى النهاية ايه<br />احب افكرك بقول الامام الشافى :<br />( ما جادلت عالما إلا غلبته وما جادلت جاهلًا إلّا غلّبني )<br />ربنا يهديكى ويعيد إليك صوابك"
