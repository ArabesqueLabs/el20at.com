[[comments]]
order = 7
subject = "يا أمة ضحكت من جهلها الأمم"
author = "محجبة سابفة"
posted = "2008-08-08"
text = "أية صحوة تلك التى تتحدثون عنها ؟؟؟؟؟؟؟<br />نحن من أكثر الأمم المتخلفة على وجه الأرض !!<br />و الحجاب ليس لزاما أبدا على المرأة إطلاقا و هو عادة صحراوية قديمة لأنهم كانوا يعتبرون المرأة مجرد أداة للإشباع الجنسى ليس أكثر و كانوا يرونها عار يمشى على قدمين !!<br />و نحن إلى الآن نفرض الحجاب و نقول أن المرأة لزاما عليها أن تتحجب و نرى كثيرا من الملصقات التى تدعو إلى الحجاب مثل الحجاب قبل الحساب و الحجاب يا أختاه و غيرها من الملصقات المتخلفة التى تجعلنا نهتم بقضايا قديمة و قضايا ترجع لإى الحرية الشخصية للفرد على حساب قضايا أخرى أكثر أهميه<br />أفيقوا .. موضوع الحجاب هذا أخذ أكثر من حقه و السبب فيه هو المد الوهابى البغيض الذى إنتشر فى كل الدول العربية للأسف و الذى أنتج كل ما نحن فيه من إرهاب و تخلف فكرى و تخلف ثقافى و تخلف حضارى<br />صحيح صدقت يا حبيبى يا رسول الله عندما قلت (( لا يغير الله ما بقوم حتى يغيروا ما بأنفسهم )) صدقت و صدقت أقوالك و نحن لم نغير ما بأنفسنا بل نزيده تخلفا و رجعية و إنشغالا بأمور شخصية ..<br />أنظروا إلى فترة السبعينيات و الثمانينيات كنا متقدمين أكثر من ذلك و لم نتخلف إلا عندما أدخلنا الدين فى كل شئ<br />حتى أمريكا لم تتورط فى الحرب ضد العراق إلا عندما توهم المتوهم بوش بأن الله يكلمه و يدعوه للحرب ضد العراق !!!!!<br />إدخال الدين فى السياسة ينتج كاااااااااااااااارثة لا محالة فالدين علاقة بين الشخص و ربه أما السياسة فهى علاقة المجتمع و الحكام و المحكومين ببعضهم البعض ولا يمكن بأى حال من الأحوال أن نفرض رأيا سياسيا له أساس دينى على أى شخص أيا كان ..<br />السياسة مدنيه مدنيه مدنيه ولا علاقة لها إطلاقا بالدين و نحن نسئ إلى الدين كل يوم بإدخاله فى السياسة و فرض بعض القضايا الشخصية على الناس و تصويرها بأنها قضية دينية و قضية موت أو حياة و كأن الحجاب سيكون السبب فى تقدم الأمة رغم أن الواقع يقول العكس<br />محجبة سابقة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "محجبة سابقة"
author = "محجبة سابقة"
posted = "2008-08-08"
text = "أنت يا مهتدى يا من تقول أن المرأة العربية حقوقها محفوظة و لها لسان تطالب به عن حقوقها<br />المرأة العربية فقدت منذ زمن قدرتها على المطالبة بحقوقها لأن الطلاق دائما سيف مسلط على رقبتها ولا تستطيع تجاهله و لكنى هنا بصفتى محجبة سابقة و أيضا مطلقة بسبب الحجاب أقول لكل النسوة بأن الإحساس بالحرية لا يضاهيه أى إحساس آخر فعندما تكونى متزوجة من شخص يدعى أن المرأة حقوقها محفوظة و يرفض أول طلب لها فى خلع الحجاب فيجب أن تعلمى أنكى متزوجة من كاااااااااااذب و محب للتملك و ينظر إليكى على أنك عار يمشى على قدمين و مشروع إغتصاب يسير فى الشارع .<br />فهل تسمح يا مهتدى لإمرأتك بخلع الحجاب إذا كانت تلك هى رغبتها ؟؟<br />أتعجب من أن تكون مجرد قطعة من القماش حافظة للمرأة برغم إرتدائها لكل ما يبرز مفاتنها !!<br />و أتعجب أكثر من المنظق الذكورى القائل بأن المحجبات محصنات و مؤدبات و أن من هم غيرهن لسنا كذلك !!<br />و الله و الله و الله لقد رأيت فى عملى أشياء يندى لها الجبين تخرج من محجبات و منقبات !!<br />و هل شعر المرأة الظاهر هو من سيثير الرجل ؟؟ و الله إن الرجل المثلر من شعر المرأة فقط ليس برجل أبدا و الرجل الذى يعتبر أن الحجاب يحفظ المرأة و أن المرأة المحجبة لابد و أن تكون مؤدبة و شريفة و عفيفة لهو رجل واهم !<br />السبب الرئيسى لتركى للحجاب هو أننى رأيت كثيرا من زميلاتى المحجبات لا يملى عليهن حجابهن أى من الإلتزام الخلقى إطلاقا فعرفت بأن الحجاب ماهو إلا وهم و أكذوبة و سجن و عندما بحثت فى أصول الحجاب فى الدين وجدتها غير موجودة ولا أساسا إدعاءات الشيوخ بأن الحجاب فريضة !<br />عندها فقط علمت لماذا كان زوجى يمنعنى من القراءة و المعرفة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
