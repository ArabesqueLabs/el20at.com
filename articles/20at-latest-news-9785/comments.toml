subject = "اسلوب حلو...بس للاسف مو ديني"
author = "هايدي شومان"
posted = "2008-08-04"
text = "شكرا موضوع حلو ..بس للاسف ماحد بهمو هاي الايام مضمون الكليب لانو المهم تكون بترقص بنسبة للبنات وفيها دقة بنسبة للشباب عشان يشوفو ادا بتنفع يشغلوها بالسيارات ولا شو.....طيب لو هاد المطرب ما غنى يمكن كان خفف نسبة المطربين شوي لانو هلأ صار كل واحد بفتح تمو بصير مطرب... وعلى فكره هاد المطرب مفكر انو هيك بهدي غيرو لا بالعكس لما حد يسمع من حد انو الكليب حلو لانو عن الحجاب والصلاة رح يتشجع انو يشوفو حتى لوكان ما بسمع اغاني بفكرو ديني بس لا هو في مسيقى وطبل وكل شي يعني ....بدال ما نشوف شييشجعنا على الدين بنسمع شي يشجعنا على الرقص .....صح كلامي...<br />مع تحياتي ."
archived = "2010-03-14"
