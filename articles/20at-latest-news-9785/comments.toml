[[comments]]
order = 6
subject = "مياااو مياااو ... مياااااااااااااااااو"
author = "مهتدي"
posted = "2008-08-05"
text = "القافلة تسير و القطط تمومو .. مياو مياو مياو ... بس صحيح في علاقتك مع اللوطي الاخر انت شو بالضبط الرجال و لا المرة.. هههههههه يعني شو موقعك في هذه العلاقة الشاذة المنحطة ؟ طبعا ما تفرق انتوا الاثنين بتكونوا منحطين لكن على الاقل..لحظة شو كاتب ... اهاااا انت دائما في الطليعة ..امممم اها خلاص فهمناك ... الله ياخذك :-) ههههههههه<br />نحن نتعلم و نتقدم و الصحوة تزيد يوم عن يوم و لله الحمد :-) و اشكالك يصرخوووون و لانك قط و القط ما يفكر بالاساس فانته تكرر كلام عبيط ما اعرف من وين سامعه بس تكرر كلام و تخبيص غيرك قال شو تخلف و بربربربربربربر قال شو الحجاب طريقة لاستعباد النساء و سلب حقوقهم .. اقولك يا نذل ليش انت شو خصك تدافع عن النساء هما على عينا ور اسنا و حقوقهم محفوظة و ايضا لهم لسان يدافعون به عن نفسهم لو لزم .. انت شو دخلك ؟؟ و لا انت تعتبر نفسك من فئة النساء ;-) طبعا العلاقة القذرة تحتم عليك انك تعتبر نفسك امرأة يعععععع مع انك فشرت يا قذر.. :-) ...و الله انت ما تسوى ظفر امرأة شريفة يا ااا شو اقول فيك كلمة كلب خسارة عليك ... اسأل نفسك يا لوطي شو بيكون حال النساء لو ان كللللل الرجال اصبحوا لوطيين منحطين مثلك ؟؟؟؟ تف عليك :-)<br />و تحية معطرة و حلوة للشكسي اللي بيكون شيخ باخلاقه و صفاته .. بس شو نسوي :-) يا خرا القط شكلك مقهوور لوجود ناس فاهمة مثل الشكسي افهم منك عرفوا قيمة الحياة و الله هداهم لذلك انت الندم يقطعك و الحقد ياكلك فالى جهنم و بئس المصير .. و مومو على رااااااااااااااااااااااااااااحتك .. :-)"
archived = "2010-03-14"
