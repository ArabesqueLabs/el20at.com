posted = "2009-08-17"
text = "الى محجبه سابقه<br />اتقى الله واعملى انك ان لم ترتدى الحجاب سيكون لك من الله عذاب اليم<br />وهل بحثت عن الحجاب كما تقولين<br />يا عميااااااااااااااااااااااااااااااااااااء وماذا تقولين فى قول الله يا أيها النبى قل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن<br />ويقول الله فى سورة النور وليضربن بخمرهن على جيوبهن<br />انتى احقر مسلمه رأيتها فى حياتك واكيد انتى مسيحيه مدنسه تنتسبى الى الأسلام لكى تظهروا حقارتكم أيها الأعباط تحت قول مسلمه<br />لعنك الله فى الدنيا والأخرة حسبى الله ونعم الوكيل<br />بحبك يارب ومنايا ترضى عنى ... وعجلت اليك ربى لترضى"
