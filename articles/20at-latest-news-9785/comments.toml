posted = "2009-07-21"
text = "محجبة سابقة<br />من الواضح انك لست بمسلمة على الاطلاق والا لما تفوهتى بتلك الكلمات التى لاتخرج الا عن انسانة لم تذق حلاوة الايمان بالله ورسوله الكريم<br />كفى ادعاءات لانا لسنا بتخلفين مثلكم يا اعباط مصر<br />والقط الازرق ايضا انا واثق تمام الثقة انك نصرانى<br />فهنيئا لك كتابك المكدس وانعم بما فيه من قصص اباحية متوفرة بكثرة فى نشيد الانشاد وامثاله<br />لا اريد ان اتعمق اكثر فى فضح كتابكم الجنسى ولكن نصيحة منى ( اذا بليتم فاستترو )<br />فلا تضطرنى لفضحكم اكثر من ذلك"
