[[comments]]
order = 0
subject = "ازيك يا استاذ طحاوي"
author = "مش لازم"
posted = "2008-04-21"
text = "بالله تبلغ الاستاذ جورج رياض وهاني رمزي وبقية الشلة ان عدد المسلمين في مصر 94%<br />والاسلام في مصر في منتهى القوة والمتانة وتأكيدا على ذلك بريطانيا الصليبية جاءت واحتلت مصر 70 سنه بحالهم وبرضه الحمد لله المسلمين طلعوا حديد<br />يعني المسلمين فازوا بالضربة القاضية الفنية زي محمد علي كلاي زمان<br />والافضل ان الاخوة المسيحيين يرجعوا يرفعوا الشعار بتاع زمان ايام البابا كيرلس والباباوات اللي قابليه<br />لله المجد في الاعالي وعلى الارض السلام وفي الناس المسره<br />ويبطلوا الهبل والعبط بتاع عدلي ابادير"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421195105/http://masr.20at.com:80/newArticle.php?sid=15340"

[[comments]]
order = 1
subject = "إيه العقد دي؟"
author = "الليث الضاري"
posted = "2008-04-23"
text = "خليكم كده ورا اللي بيسوقوكم لحد ما تولعوا في البلد وإنتو أول ناس هتتولعوا بناركم بالرغم من إننا برده حنحاول ندافع عنكم"
archived = "2008-04-25"
capture_url = "https://web.archive.org/web/20080425105955/http://masr.20at.com:80/newArticle.php?sid=15340"
