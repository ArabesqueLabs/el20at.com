subject = "يا اهلا بالمعارك يا اهلا مين يشارك"
author = "مش لازم"
text = "والله عايزين يحولوها الى قضية طائفية احنا جاهزين<br />عدد المسلمين السنة 94%<br />وعدد بقية الطوائف كلها 6%<br />المسلمين جاهزين لكل الاحتمالات<br />بس هي الحكومة تسيبنا واحنا نوريهم<br />والمسيحيين ليس لهم اي حق في بناء اي كنيسه حتى الكنائس الموجودة الان ارضها ملك مصر الاسلامية والكنيسة مبنية عليها مؤقتا جدا وبتصريح مؤقت<br />لازم هؤلاء الحوش يعرفوا كده<br />وكمان فيه حاجه<br />المسيح جه وقال مبارك شعب مصر<br />وبناء عليه اصبحت مصر بفضل هذه المباركة الطيبة من نبي والله وامه الصديقة اصبحت اكبر دولة اسلامية وقلب العالم الاسلامي بلا منازع<br />يا اهلا بالمعارك يا اهلا مين يشارك"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050504/http://masr.20at.com:80/newArticle.php?sid=11464"

[[comments]]
order = 1
subject = "زوجات رجال الأعمال الخمسين اللاتي اعتصمن داخل الكنيسة،"
author = "مش بحبك"
text = "زوجات رجال الاعمال الخمسين<br />هو الاقباط ما عندهمش رجاله يعتصموا فبعتين النسوان<br />ولا هما بعتين النسوان الكنيسة وبالمرة القصيص يغفرلهم على طريقة برسوم المحرقي"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050504/http://masr.20at.com:80/newArticle.php?sid=11464"

[[comments]]
order = 2
subject = "كنايس اية"
author = "مرسى الزناتى"
text = "الدولة الاسلامية زى اوروبا ما بتعمل مع المساجد نعمل وياهم<br />هم عايزين كنيسة لية - علشان يغنوا فيها - يصلوا فيها<br />يعملوا صالة عادية زى صالة الافراح وفيها شوية دكك يقعدوا عليها ويغنوا زى ما هم عايزين<br />انما مبنى كنيسة وبرج ومناظر تلوث البيئة مش عايزين<br />عايزين يصلوا - لا احد ضد حرية الصلاة<br />بس مسموح بصالة فقط<br />انما رجال اعمال -نسوان شواطىء فهذا امر غير<br />ثما انة فى قانون الطوارىء ممنوع التجمهر - ازاى دول تجمهروا<br />والا قانون الطوارىء امريكا بتطبقة على المسلمين بس"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050504/http://masr.20at.com:80/newArticle.php?sid=11464"

[[comments]]
order = 3
subject = "العين الحمرا هى الحل من الاخر"
author = "مصرى بيحب مصر"
text = "مش عايزين ندى الموضوع اكبر من حجمة وبقولهم بلاش تصدروا النسوان فى الموضعات وخلوا الرجالة هى التتكلم وبعدين المسحين زودوها اوى اوى ومش هينفع كدة هو الشعب دة كدة لو سيبتلة الحبل شوية يقوم يزودها اوى هو دة الحصل مع المسحين عشان كدة هما محتجين واحد قوى يعرفهم ان اللة حق مش البيحصل معهم من المسئولين دة اسمة مسخ فاضح نفسى يروهم العين حمرة مرة واخدة عشان خاطرى وخاطر كل المصريين زى ما بتعملوا الاخوان المسلمين كدة ومضيقين عليهم اوى كدة ما الاخوة المسحين بالمرة واللة هيتلموا ومهنسمعلهم حس"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050504/http://masr.20at.com:80/newArticle.php?sid=11464"

[[comments]]
order = 4
subject = "والاستعباط ..والبرشمه ايضا!!. فى مارينا !"
author = "مشاغبون بلا حدود"
text = "منذ يومين دارت ماكينات البرشمه فى مواقع الهوس والخبلان لاقباط المهجر لتروج الاكاذيب حول اِعتداء محافظه مطروح لارض الكنيسه فى مارينا ! مما اضحكنى لمدى الاستهبال .....والاحداث التى دارت فى مارينا من اِختراع أزمه واِنشغال الامن والداخليه لموضوع يفهمه العقلاء فقط وافتعله المبرشمين .. وفى البدايه أقول أن الفضل لانشاء كنيسه مارينا هو الدكتور ميلاد حنا عندما بدا الساحل الشمالى - وللاسف تلك المنطقه منذ البدايه عشوائه التنفيذ فيها !!! وكان يلزم تخطيط ودراسات لمدينه ضخمه كبيره وتوازى مدينه الاسكندريه لمجتمع متكامل بكل الانشطه الانتاجيه من سياحه وصناعه وزراعه و..الخ فالان يعمل الساحل الشمالى فى الصيف فقط !!! وبقيه العام الساحل مهجورا وأطلالا ! -....المهم طلب د.ميلاد بناء كنيسه للمصطافين بمارينا ! ....و تم منح الكنيسة &--1637; آلاف متر بالفعل في منطقة مارينا بالساحل الشمالي دون مقابل مع أن أوقاف الكنيسه تديرها بنفسها ولايشرف عليها أى قطاع حكومى كجهاز المحاسبات والمفروض أن تدفع !،..... وبنيت الكنيسه ! ....والتى تم فيها مراسم زاوج فيها اخيرا للفنانه هاله صدقى ! - وهى مطلقه بتغير ملتها بنفسها ! واِستفادت بالخلع الذى فى الشريعه الاسلاميه - مع أنه لازواج للمطلقين كما يروجون ! ..... ولان محافظ مطروح من واجباته تنميه المنطقه فخصص للمشاريع السياحيه ! أرضا واِعترض كهنه الكنيسه !!!! بدعوى أنها تقدمت لشراء ارض &--1636; آلاف متر اخرى ودفعت 25 % !!!! ومعلوم بديهيا للعقلاء :أن تقدم الكنيسة بطلب للحصول علي الأرض لا يعني ملكيتها .....فمن يستهبل ويرى ان قطعه الارض الملاصقه لبيته ! وهى ارض فضاء تابع لاملاك الدوله ويذهب الى مجلس المدينه ويقدم طلبا ثم يذهب الى اى بنك ويحول مبلغ من المال لحساب مجلس المدينه ثم يعود ويقول تلك الارض ملكى !!! هو مختل ومجنون ومبرشم كمان ! . وهل اِكتشف الكهنه أن بدو الصحراء المسلمين بحاجه الى كنيسه !!!أم قطعه الارض تلك ستقام بها مشاريع تجاريه تابعه للكنيسه مثل مانراه داخل الان فى الكنائس من أنشطه تجاريه ومسارح وصالات نت ....وحتى وصلت الى شواء السمك داخل الكنائس ! أم بناء مصايف للكهنه والرهبان فى مارينا ؟ وسيهجروا القلايات اِياها ؟ اِن ما حدث فى مارينا هو اِستهبال واِستنطاع واِستعباط فى زمن (البحر يحب الزياده ) من تجمع افتعله الكهنه والمبرشمين ! ويلزم وقفه جاده لان البرشمه وصلت منتهاها !! وباقلام مأجوره تنشر فى المواقع ومنهم مراسل موقع بالقاهره يروج للاكاذيب و ينشر تقارير مبرشمه واِسمه ( ن .ش ) ويعمل مراسل كذلك فى راديو سواسوا ويكتب على هواهم ليقولوا له ( غرد يابلبل ) ! ولن ازيد .والى الفريق الشحات أقول اِستمر فى عملك ونفذ ما خطط له قطاع المشروعات بالمحافظه من مشاريع من اجل تنميه المنطقه وهذا واجبك ولا تلتفت للفارغى العقول لانك تضيع وقتك وانت محافظ منطقه حدوديه يفهم ذلك الوطنيين ولن ازيد ....واِذا اِدعّى احدهم بانه من (السكان الاصليين ) اِرسله فورا الى مستشفى العباسيه للامراض العقليه ذلك هو الحل ! واخيرا أين العقلاء من الاقباط ؟<br />ألا من عاقل لان مايحدث من شقاوه الكهنه يسبب شرخا بين المسلمين والمسيحيين فى مصر !<br />http://tarkalwzer1.maktoobblog.com/?post=467577"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050504/http://masr.20at.com:80/newArticle.php?sid=11464"
