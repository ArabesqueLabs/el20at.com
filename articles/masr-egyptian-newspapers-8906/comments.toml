[[comments]]
order = 1
subject = "فقه المنافقين"
author = "abu osama"
posted = "2008-04-27"
text = "لابد للأزهر ان يعمل فرع لفقه المنافقين علشان يبقوا معروفين .<br />ماذا تقول لربك يا زقزوق عندما يسألك عن قول رسول الله صلى الله عليه وسلم<br />افضل الجهاد كلمة حق تقال عند سلطان جائر وووهذا هو من نحن على سنته<br />فكيف نكون خارجين على سنته فانتم معشر شيوخ الحاكم تدمرون سنته وتجعلونا<br />امام الغرب كالنعاج الذين يسوقهم الحكم الى مصيرهم وهم لايدرون الى اين وما<br />تقول فى ما قاله سيدنا عمر بن الخطاب وهو الفاروق اطيعونى ما اطعت الله اى<br />انه اذ لم يطع الحاكم الله فلا طاعة له علينا فبدلا من ان تامر الخطبأ بقول الزور<br />فأمر الحاكم بطاعة الله نعم ان هذه الطاعة لاتاتى من انه الحاكم بل تاتى من<br />طاعته لله .وكيف يكون طائعا لله وهو يتولى الكافرين من دون المؤمنين فقبلته الى<br />الغرب اذا امره اطاع اما شعبه اذا ثار لآنه جائع فهى عصا الشرطة العميأ التى لاتفرق<br />ثانيا كيف يمتلك الملايين وشعبه جائع فعندما كان يخطب سيدنا عم وعلى المنبر<br />قال اسمعوا واطيعوا فرد عليه الرجل لاسمع لك ولا طاعة وكان السبب هو ان جلباب<br />سيدنا عمر اطول من جلبابه فما بالنا الان والملايين تملأجعبته وجرد شعبه من كل شىء<br />فلا تطلب من جائع ان يطيع يا شيخ الحاكم.والله ما تخلفنا ولا اذلنا حكامنا الا بسببكم<br />لو قلتم لحاكمكم اتقى الله ما كان هذا حالنا فقد قاله احد الصالحين لسيدنا عمر فولاه<br />اميرا لكى يعينه على الحكم . اتقوالله فمن ليس كعمر فلا يستحق ان يحكم دولة اسلام."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "عن اى حاكم تتحدثون سيدنا عمر بن الخطاب والا سيدنا"
author = "شنكوح"
posted = "2008-04-27"
text = "رئيس الدولة موظف بوظيفة عامة خاضعة للنقد والتغيير كأى وظيفة عامة<br />وليست وظيفة دينية او شرعية كان يؤم الخليفة حسنى جموع المسلمين فى صلاة الجمعة وعندة تفويض من جماعة اهل الحل والعقد<br />ثم لو رجعنا لحكام المسلمين ياعم زقزوق فعمر بن الخطاب مات مقتول<br />وسيدنا عثمان خرج علية المسلمين وحاصروة فى بيتة وضربوة وقتلوة<br />وسيدنا على برضة خرج علية الخوارج وقتلوة<br />الم يسمع قتلة هؤلاء الحديث الذى يرددة خطبائك<br />لا يوجد فى الدين اى شىء يمنع الخروج عن الحاكم الظالم الحرامى مغتصب السلطة والشرعية<br />ما ينادى بة الزقزوق تخلف عفلى عنة الزمن وهيخللى العيال يضحكوا علية ويعملوة مسخرة<br />مدد يا سيدى حسنى وبركاتك يا عم زقزوق"
archived = "2010-03-14"
