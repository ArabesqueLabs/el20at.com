[[comments]]
order = 5
subject = "اللى ما يعرفك يجهللك يا جمييييييييل"
author = "نيفين نيفى نوفا"
posted = "2007-10-22"
text = "واخداللى باللك يا هوبه.. يا جمييييييييييييييييل دى بتاعت حسب الله ف ريا و سكينه<br />بالنسبه للاخت و انتى مالك معلش اللى ما يعرفك يجهللك ما هى متعرفش انك ف امريكا يا باشا<br />قرات الاوفلاين و بعتللك انا كمان<br />بالنسبه للاسافين انا بقى بختلف معاكى يا هبهوب لان انا مش مهم الاسفين اللى ينضرب بينى و بين المنيجر انا الاصعب عندى الاسفين اللى ينضرب بينى و بين حد من زمايلى عن طريق زميل محترم اخر<br />و ده حصللى و هبقى احكيللك و انضرب على نطاق واسع من واحده ربنا يجازيها<br />هى دلوقتى سابت المكان و غار... اقصد سافرت بس بعد ما سابتللى حمل كبير و هو انى اصحح صورتى عند عدد كبير من الناس كانت شوهت صورتى عندهم<br />ابقى احكيللك التفاصيل بعدين<br />اما المللل متقوليليش عليه ده روحى روحى روحى روحى<br />الملل موجود يا هوبه بس بالله عليكى مش ساعات كتير بيبقى الشغل المنفذ الوحيد لتغيير جو البيت<br />الملل موجود موجود بس تحسى بالملل و تفضلى ف البيت و لا تحسى بيه و تخرجى على الاقل تشوفى وجوه جديده<br />و يا ريت قبل ما امشى 2 قهوه بالسكر و صلحه"
archived = "2010-03-14"
capture_url = ""
