text = "عارفه اول يوم كنت مكسوفه جداااااااااااااااااااااااا اولا كنت صغيره بنت 16 سنه كان في محل زي star bucks , كنت مكسوفه جدا من الامريكان وازاي هيبصولي وانا محجبه وازاي حعرف اتحرك وكدا اول يوم كستمر طلب مني قهوه بالسكر<br />تخيلي عارفه يعني ايه بالانجليزي وبسال اللي جنبي يعني ايه سكر كنت خايفه جدا ومرعوبه بعد كدا جسمي نحس وبدات<br />معاكسات من الزبائن علي الحجاب وانتي ليه وانتي ليه وحجات كدا لغايه لما ربنا اكرمني وتعبت وبطلت شغل الحمد لله<br />اتمني للجميع عدم الشغل في مكان زي اللي اشتغلت فيه عشان التعب اللي بيحصل والمرتب مش قد كدا في الاخر<br />بس بالنسبه لطالبه كان كويس يلا<br />مشفكوش في star bucks ابدا ."
