subject = "فاكره يا هووووووووووبه"
author = "نيفين نيفى نوفا"
posted = "2007-10-19"
text = "شفتى يا هبهوب<br />مش قلتللك مش هنعرف نتكلم ف العيد<br />فاكره يا هوبه لما قلتللك يا بختك علشان القهوه<br />عموما استنينى الايام الجايه اكيد هنتكلم<br />بالنسبه بقى يا دعاء للموضوع احب اقول اولا ان الصوره اللى فوق دى لا تمت للموضوع بصله بالنسبالى لان مكنش فيه استقبال بالورود و الرياحين كده<br />طبعا ف الاول بتبقى فرحانه و فعلا زى الاطفال يوم وقفه العيد بتجهزى الهدوم من بليل<br />و بتنامى ترسمى حلم جميل لمستقبل باهر ب career محترم و salary معتبر و توديع ايام البطاله المريره<br />و بتبقى كده ف الاسبوعالاول نشاط و حيويه و صحيان بدرى و....................<br />الواقع الاليم ان ان ااااااااان<br />و اول علاماته ان الناس ف المكان مش كلهم زيك بمعنى ان مش عارفه ليه الناس بتعتبر التعامل بذوق و اتيكيت حاجه غريبه و ان مصطلح ميرسى و بليز و حضرتك من العصر الماضى ده غير الاسافين اللى من تحت لتحت و تلاقى اللى لسه مديكى اسفسن تمام بيقابللم بابتسامه من الودن للودن<br />و تبداى بعد كده تصحى كل يوم بالشوز لان الشغل مرهق و النوم قليل خصوصا لو بتدرسى و بتشتغلى زى حالاتى<br />ثالثا و ده الاكثر الما ان العائد المادى و ان كان كبير الحمد لله بس لا يوازى كم الارهاق ف العمل<br />بس تعرفى بيفضل الشغل احد اركان الحياه الهامه اللى برغم استنزافه لينا بس حاجه اساسيه ف الحياه و ف اشعارنا بوجودنا و بان لينا دور"
