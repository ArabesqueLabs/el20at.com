order = 0
subject = "مشروع فى مجلس الشعب اعدتة لجنة السياسات لاخراج طلا"
author = "هاى"
posted = "2008-06-30"
text = "اخراج طلاب الثانوية العامة على المعاش المبكر - حسب مقترح لجنة السياسات<br />فرض ضريبة الف جنية على دفن الميت - يطلبها بطرس غالى وزير المالية<br />فرض ضريبة سنوية اسمها ضريبة شم النسيم على كل مواطن بمبلغ 50 جنية تحصل قبل يوم شم النسيم لتخفيف دعم الدولة لشم النسيم والبحث عن طريقة لايصالة لمستحقية<br />فرض رسوم على كل طفل بيتعلم المشى ولم يتجاوز العامين اسمها رسوم خطى العتبة<br />جمع فلوس صندوق النذور من الجوامع والكنائس لشراء استكوزا وجمبرى لقاطنى فنادق شرم الشيخ"
archived = "2008-07-04"
capture_url = "https://web.archive.org/web/20080704010826/http://masr.20at.com:80/newArticle.php?sid=16474"
