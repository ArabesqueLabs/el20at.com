subject = "جميل"
author = "محمود مهدى"
posted = "2007-04-03"
text = "موضوع جميل اوى ولكن بالنسبة لنقطة ( لا اجد شريكاً يشاركنى)مين اساساً بيفكر بالمشاركة<br />معندناش الوعى ده<br />معظم الناس بتفضل تعمل مشروع لوحدها"
