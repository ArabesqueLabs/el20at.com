[[comments]]
order = 1
subject = "عجبني جدا"
author = "خضر الجنايني"
posted = "2007-04-05"
text = "موضوع راشع شكرا إنكم نقلتوه يا عشرينات<br />أنا فعلا عندي مشكلة كبيرة في إيجاد شريك، محمود مهدي المعلق اللي قبلي أحب أقول لك إن في ناس بتفكر كده أنا معاك إنهم قليلين ومعاك إن عدم انتشار ثقافة الشريك كما يجب أن يكون عائق كبير قدامهم، بس ادعي لي ألاقي واحد ينفعني في مشروعي"
archived = "2010-03-14"
