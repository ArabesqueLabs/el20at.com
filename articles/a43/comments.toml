[[comments]]
order = 2
subject = "طبعا فانت رجل"
author = "كريمة"
posted = "2007-02-08"
text = "الحياة عبارة عن قصة تختلف فيها الفصول كما يختلف فيها الابطال، فما تراه يا سيدي الكاتب عيوبا في المرأة و اعترف ان هناك نساءا كدلك، قد يراه غيرك كل ما ينقص في زوجته التي هي متناهية في ترتيب حمامها و حتى لا تملك كل ما دكرت من ادوات تجميل و قوارير عطر و السبب انها لا تريد انهاك عاتق زوجها المسكين في مصاريف تعتبرها ثانوية، بل و حتى انها لا ترى محلات الملابس و لا تتسوق الا من اجل ابتياع حاجيات المنزل للاكل و طبعا فهو الدي يختار و هو الدي يرفض و هو الدي يدفع...و في الاخير و في حالة ثورة بسيطة و غالبا ما يكون هو قائدها يغمرها بعواصف من الكلمات التي تبقى ترن في الادن الى حين موعد عاصفة قادمة في اقرب حين، حيث لا يتوانى الرجل عن تدكيرها بانها ليست كالنساء لا تعرف اي شيئ سوى الطبخ و التنظيف...هده هي الدنيا فما تراه انت نقمة قد يراه غيرك نعمة و غيرك هدا هنا هو زوجي و قد يكون هناك ابطال أخرون و اصناف اخرى من الرجال...<br />إمضاء: صبورة لا حقودة و لا غيورة"
archived = "2010-03-14"
capture_url = ""

