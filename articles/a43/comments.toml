order = 0
subject = "الأشياء التي تكرهها المرأة في الرجل"
author = "زوجة"
posted = "2007-02-08"
text = "الأشياء التي تكرهها المرأة في الرجل<br />الاكتفاء بمشاغل العمل ومشاكله وإهمال الزوجة واللجوء إلى مشاهدة التلفزيون حتى يحين موعد الدوام المسائي للعمل! أو حتى يبح على خير !<br />سرعة الضجر من الزوجة والأولاد بمجرد الوصول إلى البيت فقد استنفذ طولة البال والصبر والهمة في العمل ومشاكل العمل<br />كثيرا من الرجال لا يفطنون إلى أن ربة البيت هي زوجة وأم وحاضنة ومربية تتفضل عليه بطهي الطعام وتنظيف وترتيب المنزل وحاجيات الرجل وعليه شكرها أو الدعاء لها كل يوم وهذا نالانفعله مع الخادمة حيث أن ما تأخذه من أجرة على عملها يحل محل الشكر !"
archived = "2010-03-14"
