[[comments]]
order = 4
subject = "ليست نساء مصر نقمه يا nilly"
author = "نسرين"
posted = "2007-11-28"
text = "النساء فى مصر هن اللاتى تُخدعن النساء فى مصر هن اللاتى تعملن ,,النساء فى مصر هن اللاتى يتحملن ويصبرن ويآسن<br />اينعم ليست كلهن سواء وهنالك من تنقم على حياتها وعيشتها وتسخط منها فهى وارده بجميع انحاء العالم<br />ولكن بالمعنى الذي اوضحته انت يا nilly ان المراه المصريه هى سخ من الله فانا اعترض وبشده على هذه اللهجه التى تُسئ للمرأه المصريه المكافحه الوزيره والسفيره والتى ستكون مستقبلاً رئيسه التى تعدت المناصب وتخطب الحجوزات ولن تستطع اى دوله أُخرى ان تكون بمنصبها<br />المراه المصري<br />لو لم اكون مصريه لوددت ان اكون امراه ومصريه<br />وتحياتي من القلب نسرين المصريه التى يسري فى عروقي نسيمها"
archived = "2010-03-14"
capture_url = ""

