author = "nilly"
posted = "2007-02-09"
text = "على فكرة فيه ازواج رجالة مظلومين والعكس ويلي بتقولو الستات دي مبالغ فيه شوية تلاقيها كل واحدة ماسكة سكينة لزوجها مساكين الرجالة المتجوزين خاصة في مصر كل واحد واخد بومة علشان كدة تلاقي كل واحد هربان من بيتو من ورا يلي بيشوفو من مراتو ..لا وايه مش عاجبهم وبيطلعو العلل في ازواجهم ..اشكرو ربنا واحمدوه انكم اتلميتو ولقيتو حد يعبركم يا ستات مصر...وشكرا ...بنت مش من مصر..."
