subject = "السيناريو المفقود"
author = "محمد عبد المقصود"
posted = "2008-04-28"
text = "السيناريو المفقود في أحداث 6 أبريل<br />أحداث السادس من أبريل كانت عنيفة وموجهة ولن أخوض في وصفها ومقدماتها ومؤخراتها كثيرا فقد قُتلت كلاما وبحثا غير أنني باستقراء وتأمل وجدت أن هناك يد خفية تستغل الأزمة الطاحنة التي تمر بها مصر أرادت أن تشتعل مصر نار تلظى تحرق فقراءها قبل أغنيائها فسخرت لها بعض المراهقين سياسيا الذين حسنت نياتهم وغابت عنهم الحنكة والرجاحة العقلية مع أنهم لا تنقصهم الوطنية.<br />ذلك أن صاحب المصلحة الأولى والأخيرة في إحراق مصر وضياعها لتلحق بالعراق وأفغانستان ولبنان بل وفلسطين أقولها و بملء ألفيه أن اليد الأمريكية الصهيونية هي المحرك الأساسي والمستفيد الأول والأخير لأن النظام المصري المتهرئ فقد مصداقيته عندهم وهم لا يرغبون في إحداث التوريث وأصبحوا متيقنين ببغض الشعب لهم ولكنها تدرك تمام الإدراك أنه لا بديل للنظام القائم إلا الأخوان المسلمين وهم لا يطيقون أيضا أن يرو الأخوان في سدة الحكم لذا تم التخطيط في غفلة العقل الواعي لأبناء مصر المخلصين للاستفادة من الدعوة العمالية للإضراب وتوظيفها لتحقيق مأربهم الخبيث حيث تمت الدعوة للإخوان عن طريق الشبكة العنكبوتية وتبناها من هم متيقن بتبعيتهم الأمريكية فإذا ما شارك الأخوان ستكون الهبة قوية والتفاعل كبير لما للإخوان من قوة شعبية في الشارع وقدرة فائقة على التنظيم والتحريك ولكن مع اختلاف واحد أن المشاركة شعبية عفوية من جميع الجياع والمنكوبين فتهيئ الفرصة للمغرضين والمأجورين المخربين أعداء الأمة والوطن أن يندسوا بين الحشود فيفعلوا فعلتهم التخريبية التدميرية فإذا بالبلد تتحول إلى بركان وإذا بالفوضى تعم والخراب ينتشر وتحترق البلد بأخضرها ويابسها وتكون النتيجة الآتي :<br />1. إما أن يتحرك الجيش لحماية البلد ويتم القبض على كل الأخوان والمنتمين إلى جماعتهم وإصدار أحكام للتخلص منهم وكبح جماحهم وفي ذات الوقت يتم التخلص من الزمرة الحاكمة وأعوانهم وإلغاء الأحزاب وعودة البلاد إلى مربع الصفر في ( 52 ) وبذلك يكون قد تحققت الرغبة الأمريكية الصهيونية في التخلص من القوتين المتفاعلتين وكلاهما غير مرغوب فيها ويبدأ التفاوض مع من تقدم لإنقاذ البلد والذين لاشك في وطنيتهم ولكن نخشى قلة خبرتهم السياسية التي قد تنحرف بهم هنا أو هناك وهذا أخف الضررين .<br />2. وإما أن تحدث الفوضى وتعم ولا يتحرك الجيش وتظل البلاد في عنفوانها يموج البركان الشعبي بأهلها دون رؤية لشاطئ في الأفق فيتلقف الناس أي آت (؟؟؟؟؟؟؟) ولو كان بوضياف أو كرا زاي وبذلك يتحقق لإسرائيل وأمريكا مرادهما فتقتضمان قطعت الكيك المصرية ثم تبحثا عن القطعة التالية ويسهل عليهما بعدها الانطلاق إلى السودان ومنابع النيل والقرن الأفريقي وإلى شمال أفريقية وغيرها<br />فهل نحن صادقون في اتهام الإخوان بالتقاعس والانتهازية بعد ذلك أم أنهم أصحاب بصيرة ورؤية واضحة لا يتعاملون مع ردود الأفعال ويسيرون حسب إستراتيجية واضحة , ونحن فقط أصحاب النظر القصير ولا نرى إلا تحت أقدامنا وقد تحركنا أحقاد قديمة نغلفها بالوطنية واللبرالية ... فرفقا رفقا بمصرنا الحبيبة ودعني أشد على يد الإخوان في موقفهم البطولي الوطني ."
