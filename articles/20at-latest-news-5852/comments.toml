order = 1
subject = "ولو كنت فظاً غليظ القلب لأنفضوا من حولك"
author = "واحد من الناس"
posted = "2007-05-14"
text = "والله لأعرف كيف يكون رجال ما يسمي بهيئة الامر بالمعروف والنهي عن المنكر فوق المساءله القانونيه ( هذه في حد ذاتها مفسده ) كيف لدوله تدعي أنها دوله محترمه ولا يسود فيها القانون على الجميع على حد سواء.<br />هل هذه اخلاق أمة محمد ؟؟ وهل هذا منهج محمد صلى الله عليه وسلم ؟؟<br />كيف يضرب الناس أو يهانوا او يساقوا إلي السجن بمنتهى البساطه ( منتهى القمع والله) أنا شخصياً سبق لي وان زرت السعوديه مرتين وسمعت بل وشاهدت مدى الذعر الذي يصيب الناس عندما تقف سيارة الGMC ( كما يطلقون عليها هناك ) التابعه للهيئه !! يا اخواني إذا كان ربنا سبحانه وتعالى قال \" لا اكراه في الدين \" مش بقى فاهم ازاي واحد يبقي ماشي في امان الله لا بيه ولا عليه ويلاقي بتوع الهيئه دول بيضربوه بالدره ( عصايه ) او يهجموا عليه ويسحبوه من قفاه علشان يروح يصلي في الجامع ( يا اخي الدين النصيحه ) أنصحوا وسيبوه لكن انك تضربوا علشان يصلي ( إن هذا لأمر عجاب ) ، او سيده فاضله ماشيه في حالها يهينوها او يضربوها قال علشان لابسه لبس شكله ازاي ، او واحده زي اللي المسكينه اللي خطفوها دي في المقاله حاجه مرعبه ( ده ولا طالبان ) يعني ايه هيئة تقعد تفتش في ضماير الناس بالطريقه دي ؟؟<br />ياعم اللي عايز يصلي واللي مش عايز حسابه عند ربه يوم الدين ( والله يهدي من يشاء ) يعني بالمنطق العجيب ده كان النبي صلي الله عليه وسلم بقى ضرب عمه ابو طالب علشان يسلم رغم انه كان مشرك وكان بيساعد الحبيب !!<br />وكمان على حد ما سمعت من أصدقاء مقيمين بالمملكه - إن رجال الهيئه دول فيهم نسبه كبيره من المجرمين التائبين و بيشغلوهم في الهيئه بعد فترة أنقضاء عقوبتهم ( قال علشان يتوبوا ) بقى واحد خارج على القانون اديله صلاحيات واسعه يضرب في الناس ويحبسهم واللي عايز يرحله من الوافدين يرحله .<br />ولا هو الموضوع بس إنك تصلي في الجامع في الصف الاول ولابس الثوب القصير والسواك ماشاء الله باين من جيب الجلابيه وبعد كده تخرج تفتري على الناس او تنصب عليهم وتآكل حقوقهم<br />أسلامنا رحمه وموده على المسلم و حتى على غير المسلم ( أدعوا إلي سبيل ربك بالحكمة والموعظة الحسنه ) مش بالعصايا .... بقى أخيراً ان أذكركم بقصة الاعرابي الذي دخل المسجد النبوي والرسول جالس مع أصحابه .... وإذا بهذا الاعرابي يتقدم ويبول في قبلة المسجد ( وفي حضرة من المصطفى صلى الله عليه وسلم ) ..... وعندها ثار الصحابه .... ويقال ان سيدنا عمر كاد ان يضرب عنقه .....فماذا كان من المصطفى صلى الله عليه وسلم ؟؟<br />قام صلى الله عليه وسلم وحال بين الرجل وبين الصحابه الذين كادوا ان يفتكوا بالرجل ( وقال لهم المصطفى : لا تروعوه ولا تقطعوا عليه بولته) وبعد ان انتهى الرجل من التبول أخذه المصطفى باللين ونصحه كيف يستتر عند التبول ؟ وماهي حرمة المسجد ؟ وهكذا )<br />هذا هو الاسلام السمح أظن ان الموقف نفسه لو حدث مع اي منا سيقوم أهل المسجد بالكامل عليه ضرباً وركلاً - صح ولا ايه ؟<br />أو تخيلوا الموقف ده حصل في زاويه صغيره للصلاه ( خد بالك مش المسجد النبوي ) وكان هناك واحد من بتوع هيئة الامر بالمعروف والامر عن المنكر دول تفتكروا ايه اللي كان هايحصل ؟؟؟ أكيد لو الموقف ده حصل في 2007 كان هذا الاعرابي هايروح بيتهم وهو فاقد لأحد أعضائه البشريه التي تسببت هذه الازمه !!"
archived = "2010-03-14"
