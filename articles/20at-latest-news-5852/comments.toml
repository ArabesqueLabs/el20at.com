subject = "تعقيب"
author = "علي"
posted = "2007-05-14"
text = "الخبر منقول من عدة مواقع ومنها موقع العربية الاخباري. الحصانه التي يتمتع بها رجال الحسبة او الهيئة كما تسمى بالمصطلح الجاري بالسعودية هم مجموعه تقوم يمراقبة الناس والاسواق من تصرفات تخدش الحياء العام او تعارض مع الشريعة الاسلاميةوامور مثل اقامة الصلاة واقفال الاسواقرغمآ -وليس كموعظة- وملاحقة السكاى ومصنعي الخمور بيوت الدعارة والمشعوذين وتفيذ بعض الاحكام الانية بصلاحيات غير مكتوبة بل تعتمد من مركز لاخر ومن شخص لاخر. بتصوره الوهابي واجتهادات عرفية واجتماعيه مع صبغة دينية باعتقاد انهم هم فقط من يعرف الدين- فهم اشبه ببوليس اداب مع شرطة امن وشرطة دينية. الحق يقال بانهم لهم دور مهم وضروري ليس بالسعودية ولكن باي تجمع اسلامي ولكن الاسلوب الذي يتبعه البعض منهم اسلوب جاف وتصرفات شخصية ومنظور ضيق ينفر الناس عن الدين ويشوه مفهوم الدين السمح والمحبة والتآلف. لا يوجد شر مطلق ولا خير مطلق انما يجب ان تقنن صلاحيات رجال الحسبة بتوثيقها بمجموعه قوانين وروادع لكي لا تنفلت الامور عن نصابها وتصبح الامور اشبه برجال السافاك بايران او برجال الشرطة السرية الايرانية شتازي الذين يتدخلون بحياة الناس ويكتبون التقارير وملاحقة الناس وتجريمهم بمجرد الشك والريبة."
