text = "انت سيد قرارك فبكلمة منك تستطيع أن تخرج من هذا السجن اللعين الذى اسمة السيجارة فأنت بذلك اصبحت عبداً للسيجارة تتحكم فيك كيفما تشاء وتتذلل لها وتجى ورائها تاركا كل شئ حتى اهم الإختصاصات كالأولاد والزوجة .. الخ<br />فرجاء ان تتخلص منها وتقارن بين حالتك فى الحالتين راحة ترك التدخين وعذاب اللهث ورائها"
