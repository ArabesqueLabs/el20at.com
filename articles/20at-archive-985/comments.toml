order = 0
subject = "لا لتدخين البنات."
author = "ايه - السويس"
posted = "2007-01-22"
text = "انا ظبعا مابدخنش ورايى من راى مهند ان تدخين الفتاه يتنافى مع تقاليد مجتمعنا وتعاليم ديننا والبنت اللى بتدخن بتبقى واخداه مبدا فى حياتها ان البنت زى الولد ومفيش فرق بينهم بس طبعا غلط هى اه بتصر نفسها بس اللوم فى الاخر هيجى على اهلها وعلى سوء تربيتهم ليها وممكن والله يكونوا مربينها كويس بس اصدقاء السوء هما السبب وياريت البنت اللى بتدخن ترجع لقول الله تعالى(ولا تلقوا بايديكم فى التهلكه) وعموما ربنا يهدى بنات المسلمين جميعا."
archived = "2010-03-14"
