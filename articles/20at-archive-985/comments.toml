[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "مهند. اسكندرية"
text = "اعتقد ان تدخين الفتاة او المرأة طبعا له علاقة بالاخلاق... البنت بتبقى عارفه ان التدخين شىء غير مقبول ومشين للبنت فى المجتمع.. وبالتالى فلما هى تدخن يبقى هى مش محترمة.. المعادلة بسيطة.. حاجة عيب.. تعملها ليه.. وعلى العموم انا مابدخنش ومابحبش السجاير.. ونظرتى للبنت اللى بتدخن بتبقى نظرة احتقار..ويمكن للشاب اللى بيدخن كمان..وصدقونى... التدخين فعلا ضار جدا بالصحة وبيدمرها... غير ان المدخن بتبقى صحته وحشه.. لكن بيبقى شكله كمان وحش.. شفايفه سودا وعينه حمرا وسنانه صفرا وريحته وحشه وكلها سجاير.... وكُحته مستفذة.. يعنى دمار من كله... يعنى التدخين لارجولة ولاشياكة ولااناقة ولاجمال..التدخين تدمير.."
archived = "2010-03-14"
