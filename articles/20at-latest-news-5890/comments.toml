[[comments]]
order = 1
subject = "الاسلام هو الحل"
author = "عاشقة الاسلام"
posted = "2008-09-30"
text = "بداية...الفتنة نائمة لعن الله من أيقظها...لكن لا ننسى أن المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف لذا وجب على أصحاب الفتنة من حركة فتح وأنا أقول البعض ليس الكل أن يلاقو المصير السيءالذي يستحقونه...أما أصحاب الشريعة وأبناء الحركة الاسلامية فعليكم بتقوى الله والاحتراز من قتل أي نفس بغير حق..لأن الظلم مرتعه وخيم جدا...فالحذر الحذر ولا تنسو أن حربكم وحصاركم هي حرب عقيدة...نصركم الله وأيدكم بما هو حق...."
