subject = "لا حول ولا قوة الا بالله"
author = "عبدس"
posted = "2007-05-16"
text = "السلام عليكم<br />لا حول ول اقوة الا بالله على حماس قبل فتح<br />الاتنين ازفت من بعض<br />الجهتين بتضحك على هالناس الغلابة<br />بيطلعوا يصرحوا ويحكوا كلام غيى اللى بيصير على الارض<br />بسم الله الرحمن الرحيم\"كبر مقتا عند الله ان تقولوا مالا تفعلون\"<br />وحسبنا الله ونعم الوكيل"
