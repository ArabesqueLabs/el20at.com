subject = "نكد في نكد"
author = "فوق العشرين"
text = "بغض النظر مين الي حاطط دماغه فوق التاني<br />نشوف بقى من ميزان العدل ومن المساواة<br />ولا ده يبقى كلام وبس<br />ده احنا بقينا في القرن الواحد والعشرين<br />في الاخر يا ليتنا ما عرفنا الزواج من اصلو<br />زوجة معذبة"
