[[comments]]
order = 0
subject = "ربنا يهديهم"
author = "محمد"
text = "للاسف في مصر المجتمع بيكون متحفز لاي حرب بين الاهل ، وتدخلات الاب والام من اي طرف بتفسد عليهم حياتهم وخصوصاً في المناسبات اللي زي العيد بيكون عندهم مقدرة رهيبة الي انهم يحولوه الي حلقة نكد مفيش بعد كدا واكنهم ميقدروش يعيشوا من غيرة كل دا لمجرد انهم واحده عايزة تثبت نفسها وكلمتها علي ابنها اللي للاسف غالباً بيكون موقفة سلبي جداً وبينكد علي نفسة وعلي مراتة واوللاده لو عندهم اولاد لمجرد ان الست امه عايزة تنتصر لنفسها<br />والاكل بقي لازم تاخر الاكل وياكل كتير وعصير وفاكة وزشاي بعده علشانلما يروح بيت اهل مراته ميقدرش ياكل حاجة فيحسوا ان في تكليف او انه مش عاجبة الاقل<br />وكله رافع شعار احلي من النكد مفيش"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "غريبة يا هدى"
text = "والله انا شايفةان الست هدى هي اللي حاطه حماتها فوق دماغها وراعقة ..وفيها ايه يعني كل البنات بتقضي اول يوم في بيتوت أهل زوجها ..وتاني يوم بتقضيه مع اهلها..فين المشكلة يعني؟؟؟ أوممكن تعدي على مامتها تقعدمعاها ساعةوهي مروحة بيتها..لكن فعلاالبنات دلوقت بتفنن في انها ازاي تكون ند لحماتها..وازاي تحسس ام الزوج ان خلاص يا حلوة راحت عليكي و ابنك بقى له اهل تانين ...انسيه و استعوضي ربنا فيه...غريبة اوي يا ست هدى"
archived = "2010-03-14"
capture_url = ""

