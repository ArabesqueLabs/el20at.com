text = "سواء اختلفنا او لم نختلف مع عمرو كونه يتم اختياره من افضل ميت شخصيه ف عام 2006 من قبل مجله التايمز اكيد دى حاجه تدعونا للاعجاب بالشخص ده<br />عمرو خالد الداعيه المودرن و الاكثر شهره و الاحلى لسانا و الاجذب صوتا و و الاكثر تعرضا للنقد و الذى دارت حوله الكثير من علامات الاستفهام هل سيدعمه البعض و يرفضه البعض ام سنكتفى بالفرحه له فقط<br />هذا ما ستسفر عنه الايام"
