text = "فين الالفاظ دى هو فى حد شتم عمور انا مش شايف كلمة قبيحة غير الامريكية الداعرة الصليبية بس دى مش موجهه لعمرو خالد على فكرة يعنى.<br />حته حته ايه وكله ايه احنا فى مجل بقالة دا احنا بنقول العراق وفلسطين اللى اى مسلم بيتكلم عنهم يعنى اولى بعمرو خالد بعد ما اتكلم عن النهضة والتنمية يقول كلمتين فى حق العراق ولا فلسطين.<br />ربنا هيسألك عن كلمتك هتقوله ايه ؟ السؤال دا تساله للداعية عمرو خالد"
