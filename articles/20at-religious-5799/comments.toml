text = "يا ريت نستخدم ألفلظ محترمه عن كده و إحنا بنتكلم علي ناس مش همهم غير رفعة هذا الدين<br />و بعدسن الراجل لما يتكلم في كله .. تقولوا يا عم خليك في حالك إنت هتعمل فيها بتاع كله<br />و لما يتكلم في حتته .. تقولوا فين ... و فيين ...... و فين ....<br />أنا بسأل فين عقولكم<br />و عيب - دا ربك هيسألك عن كلمتك<br />هتقول له إيييييه ؟؟"
