subject = "بحسب امرئ مسلم من الشرّ أن يحقر أخاه المسلم،"
author = "موحد بالله"
posted = "2007-10-22"
text = "استغفر الله لي ولكم وللاخ شـــــــــــــادي (وليس من الرجولة ان تسب رجل في ظهره)<br />واذكركم جميعا بقول رسول الله صلي الله عليه وسلم :<br />عن أبي هريرة قال قال رسول الله r: \" لاتحاسدوا، ولا تناجشوا، ولا تباغضوا، ولا تدابروا، ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخواناً، المسلم أخو المسلم، لا يظلمه ولا يخذله ولا يحقره، التقوى هاهنا، ويشير إلى صدره ثلاث مرات، بحسب امرئ مسلم من الشرّ أن يحقر أخاه المسلم، كل المسلم على المسلم حرام، دمه، وماله، وعرضه\"."
archived = "2010-03-14"
capture_url = ""

