subject = "حذف نعليق شادى"
author = "يوسف"
posted = "2008-04-03"
text = "ارجو ان يحذف تعليق الاستاذ شادى وبالنسبه للاستاذ عمرو خالد فارجو ان يستمع له المسلمون فى الغرب ويكونوا سفراء للاسلام فنحن نريد ان يعرف الغرب ما هو الاسلام وكيف يحترم المراه وانه كرمها ولن يعرف الغرب هذا الا من خلال المسلمون الذين فى الخارج منخلال التعامل معهم وهذا ما يدعو له الداعيه الاسلامى عمرو خالد من خلال برنامجه دعوه للتاعيش,واما عن شادىفبالاضافه الى انه صوره سيئه للمسلمون فارجو مره اخرى حذف هذا التعليق البذىء الذى وان دل يدل على مدى سوء اخلاق صاحبه"
