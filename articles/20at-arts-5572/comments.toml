order = 0
subject = "أحسن ناس"
author = "شرين منصور"
posted = "2007-04-24"
text = "السلام عيلكم كان فيه اغنية لداليدا زمان بتقول كلمة حلوة وكلمتين حلوة يا بلدي غنوة حلوة وغنوتين حلوة يا بلدي أملي دايما يا بلدي اني ارجعلك يابلدي وافضل جنبك على طول .. انا قضيت عمري كلو برة مصر وكنت بحب اسمع الاغنية دي دايماانا كنت دايما بشوف القاهرة في التليفزيون وكنت بزرو مصر اساسا شهر واحد في السنة وبرجع اسافر تاني انا زرت القاهرة مرة وانا صغيرة ورجعت زرتها من فترة قريبة بصراحة انا انبهرت جدا بخان الخليلي والحسين فيهم احساس غريب احساس بالراحة والسعادة الناس اللي هناك بشوشين جداااا ده بخلاف الأفواج الكبيرة اللي من مختلف الجنسيات اللي بتزور الاماكن دي الموقع رائع والمكان أجمل فعلا قطعة مصرية ساحرة أما عن اللي بيشتغلوا هناك فهما فعلا علامة من علامات مصر التي تنحفر في ذاكرة السياح وذلك لقدرتهم على التحدث بأكثر من لغة وده طبعا بسبب التعامل المتكرر لأعوام عديدة مع السياح ،اما عن القوة البلدي السياحية دي علامة اخرى من علامات القاهرة فعادة البنات مش بتحب تقعد في قهاوي بلدي بس الوضع في الفيشاوي يختلف لتجد جموع من الفتيات اللي استايل هناك مكان لن تكفيه كلماتي وتعابيري عن وصف ذلك المكان ..انا استغليت الفرصة وصورت العشوائيات ومناظر الجوامع صور عادية وكليبات لنها تستاهل الغريب في الموضوع ان وحدة ززميلتي تخالفنا الراي يا استاذة يمنى فلم يعجبها هذا المكان بالمرة وبتقول انها مش حتيجي المكان ده تاني غريبة مش كدة لو في حد رايو زيها يقول ليه؟ المهم انا انبهرت جداا بمسجد الحسين وصورت ما يحدث بداخله لني كنت بشوف الحاجات دي في التليفزيون بس لامستها في ارض الواقع انا على فكرة صورت المناطق دي بالصور العادية والكليبات ،،المقالة يا استاذة يمنى رائع ورقيق جدااا رجعتينا لأيام زمان ،بس انا نفسي اقرا موضوع عن المناطق العشوائية في مصر انا من وجهة نظري انها مناطق رائعة جداااااا ومناطق خلابة والسبب هو انخراط المساجد العتيقة والمميزة في انشائها في مناطق عشوائية تكاد تكون معدومة عايزين حد يهتم بالمنطق دي لأن بلدنا جميلة جدااااااا وكمان في منطقة عند الحسين هي عبارة عن هضبة خضراء المنظر رائع .ياريت نسلط الضوء على المناطق دي لأنها جديرة ان تكون مسار لموضوع .اما عن ثقافة الفصال فهي موجودة منذ الازل من ايام ماكان في نظام المقايضة والتبادل والثقافة دي فيها جديد مستمر .على العموم تعجز كلماتي عن وصف مثل هذه الاماكن وتخونني التعبيرات لالقاء قصيدة عن تلك الاماكن .على فكرة انا مصرية"
