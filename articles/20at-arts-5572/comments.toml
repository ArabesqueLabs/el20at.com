[[comments]]
order = 1
subject = "من منظور اخر"
author = "التوربيني...صبح صبح"
posted = "2007-04-24"
text = "السلام عليكم و رحمة الله<br />طبعا الموضوع جميل و ملئ بالزكريات و المشاعر و الروائح المصرية العتيقة.... و لكن الا نري شئ او بعض من الانانية و التجاهل منا حينما نتحدث عن مثل تلك الاماكن و ما بها من عبق التاريخ... و لا نتحدث عن قاطنيها و ساكنيا... الا يوجد شئ من العبث عندما نذكر ان العشوائيات هي من المناظر الرائعة و الخلابة... و ماذا عن الانسان المصري الاصيل .. صانع كل تلك الروائع , لماذا دائما يكون نصيبه التجاهل و النسيات,, لماذا هو دائما الجندي المجهول,, نهتم بالمناطق و الحدائق و الاثار ... نهتم بالسياح و الزبائن و الفتايات الاستيل... نهتم برواد المقاهي العتيقة و البازارات... و دائما ما يكون النسيان من نصيب عمال تلك الحدائق و بائعي تلك البازارات و خادمي المقاهي ... دائما ما ينتهي الحديث عند ذهاب كل السياح و الرواد و المشتريين,, وخلو الاماكن من زوارها.. ولا نتحدث ابدا عما يحدث بعد ذلك.. لا نتحدث عن من قدموا تلك الخدمات, يا تري ما هو برنامج ما بعد البرنامج... النوم في المحلات و العشاء بالقليل و البايت و الايراد الذي بالكاد يكفي و غالبا لا ... ترتيب المكان و تنظيفه و اعداده لليوم التالي... ياريت يا جماعة دائما ما نجعل من اخبارنا و مقالتنا و احاديثنا و لو سطرين عن هؤلاء...فهم مصر التي نتحدث عنها دائما,,, و لكنهم وراء الستار."
