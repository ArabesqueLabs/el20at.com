[[comments]]
order = 0
subject = "الدفاع السلبى  - انشروا ثقافة الدفاع السلبى بين ال"
author = "مواطن"
posted = "2009-01-17"
text = "حينما اطلقت حماس فى هذة الحرب صواريخ على المستعمرات الاسرائيلية وكذلك حينما صنع حزب اللة من سنتين<br />ماذا عملت حكومة اسرائيل ؟<br />طلبت من السكان النزول الى الملاجىء<br />وانتظم الطلبة بتوع المدارس الدراسة فى الملاجىء<br />من هنا لا خسائر بينهم<br />بينما العرب فى غزة او بيروت الجنوبية او العراق تسقط قنبلة او صاروخ فوق بيت فيموت العشرات من النساء والاطفال<br />فيا شباب<br />علموا الناس المدنيون الابرياء ان يتعلموا من العدو<br />ان يحفروا خنادق وملاجىء ويخزنوا مياة واطعمة لاوقات الشدة<br />تعلموا من عدوكم<br />تعلموا من الشدائد والحروب<br />ارجوكم لا تموتوا ببلاش<br />احفروا واحفروا<br />واللة خير حافظ"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203903/http://masr.20at.com:80/newArticle.php?sid=19331"

