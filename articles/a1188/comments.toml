subject = "غريبة بلا وطن"
text = "حلمي الوحيد في هذه الحياة ان اصطلح مع نفسي وانام بكل هدوء وراحة فانا غريبة لا اهل لي ولا اصدقاء ولا حب ولا وطن غريبة وانا مع اهلي واهلي غرباء عني وكل من حولي بقناع ,,,,,,,,,,,<br />انا في وطني ووطني بلا وطن<br />بكل بساطه انا فلسطينية وحلمي ان اتحرر او اموت"
