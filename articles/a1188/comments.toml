subject = "oosama"
text = "من فترة كبير ما دخلتش الموقع..وأول صفحة فتحتها النهاردة هى صفحة المقال ده..<br />وصراحة حاسس إن فيه حاجة غريبة..إما إدارة الموقع إتغيرت..أو الموقع مش هو عشرينات وأنا العملية ضربت معايا..أو إنى أنا مش فاتح النت أساساً دلوقتى وقاعد بحلم أحلام غريبة..!!!<br />الموقع ده حيرنى بصراحة ...إذا كان هذا الموقع الذى لا أنكر أنى أحبه جداً يعالج القضايا الشبابية بأسلوب دينى يحمل روح العصر ..ويثبت للناس أن فى ديننا فسحة وفيه متسع ..(وهذه رؤيتى للموقع من قديم)..فهل يصل الحد بنا لنوصل فكرتنا ..أن نعرض خلفية صوتية للمطرب ال....كاظم الساهر..!!!<br />أعتقد أننا بذلك نكون قد خرجنا عن فكرتنا أصلاًًًً<br />على كل حال ..فكرة المقال جيدة وأسلوب عرضه سىء وشكراًً"
archived = "2005-07-13"
capture_url = "https://web.archive.org/web/20050713084736/http://www.20at.com:80/article.php?sid=1188"

