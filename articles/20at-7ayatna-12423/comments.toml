posted = "2009-06-25"
text = "اخي الكاتب اشكرك دائما على مةاضيع الرنانة والتي تترك دائما اثراً خصوصاً على قلمي المتواضع<br />والذي لا يحمل في طياته غير التحية والسلام المردف اليك بآيات العطر الابيض اللممزوج برائحة عرق اهل العراق وويلات تعبهم المر<br />هنيئا لكم الجو الحار في هذه الاوقات وليس تحقيراً انما هي عبارة عن لمسة عطاء تعود عليها ابناء الرافدين في انهم يضلمون ولا احد مكترث بوضعهم فالعالم كله بحاجة الى نفط العراق وليس مواطني العراق كإبريق الشاي الذي يغلي على غاز النار وتصرخ صافرته وانت تتوانى في ان تسمع صريخه اعلى فاعلى"
