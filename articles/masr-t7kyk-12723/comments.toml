posted = "2009-07-21"
text = "اصل الموضوع في حكاية السينما هو ازاي يلمو الفلوس من جيوب الناس<br />هو دا اصل صناعة السينما في مصر<br />ازاي انا اعمل فيلم واكسب منه عدة ملايين والحرامية يقسموهم على بعض<br />هو دا اصل الموضوع<br />تقولي عشش الصفيح تقولي مشاهد ساحنه اي جاجه تجيب فلوس وخلاص"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = ""
author = "اية حكاية السينما"
posted = "2009-07-21"
text = "ما شاء اللة نقاد السينما فى الموقع على ودنة<br />انتم فاضيين بس لمواضيع الافلام الهايفة<br />مالها يا سيدى بيوت الصفيح<br />موجودة فى السعودية وفى قرى كاملة فى السعودية مبنية بالشينكو والشينكو هو اسم الصفيح فى دول الخليج<br />وفية غجر فى اوروبا وبيناموا فى خيام<br />اية يعنى<br />انا مش فاهم الهايفين اللى بيضخموا فى المواضيع زى ما قال المعلق السابق علشان يلموا فلوس الهايفين"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = ""
author = "العشوائيات"
posted = "2009-07-21"
text = "السيد رئيس الوزراء المبجل غير اسم العشوائيات الى اسم المناطق الغير امنة<br />طيب هى اتلعشوائيات فيها اية<br />فى غياب الدولة الناس اختارت قطعة ارض فاضية وعملوا شوارع وحارات وبنوا بيوتهم الفقيرة<br />وطبعا البيوت يسكنوا فيها بامكانيات فقيرة فمفيش ميادين ولا مدارس ولا مستشفيات ولا وجود لاى خدمات حكومية غير خطوط الكهرباء والماء<br />مطلوب اية<br />تنميتها<br />عمل مدارس ومستشفيات على اطرافها وصرف صحى فى حواريها<br />وبعد ذلك رصف شوارع تلك الحارات وانارتها<br />والناس اللى فيها مصريون محترمون يجند اولادهم فى الجيش والامن المركزى<br />طوروا تلك الاحياء التى نمت ولا زالت فى غياب كامل لدور الحكومة فى التخطيط<br />انما هى اجياء سكنية عادية وقليل من التطوير وتبقى زى الفل"
archived = "2010-03-14"
capture_url = ""

