text = "بجد الموضوع يمس المجتمع المصرى ونرجو مزيد من التفاصيل والتوضيحات وياريت لو كانت اراء الناس الى ساكنين فى العشش دى زايدة شوية فالموضوع علشان توضحلنا المعاناه اى هما بيعيشوها وسرد قصص ليهم اكتر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = ""
author = "abougoda"
posted = "2009-07-22"
text = "بجد حاجه غريبه<br />ناس فرحانه باانها بتظهر بصوره وحشه والناس بتتعاطف معاهم<br />وناس متضايقه انها وصلت بالصوره ده<br />ماهو فعلا السينما مش بتوصل الصوره الحقيقيه السينما بتوصل سيناريو مدبلج تقدر تخطف عقل المتفرج<br />مايهمش انه يتعاطف او غيره يهم ان انتاجها يكسب<br />يعني زي مامحمد عبد السلام قال<br />تبادل مصالح مش اكتر<br />وشكرا ليك عمرو علي التقديم الجميل واهتمامك بتوضيح صوره ممكن يكون ناس مخدوعه فيها وفي ناس مقتنعه انها مش حقيقه<br />في انتظار مزيد من تحقيقاتك"
archived = "2010-03-14"
