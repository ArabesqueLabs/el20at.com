text = "طيب فين الصور مش كان يصور الناس اللى اتكلم معاها وكمان صور للمنطقة اللى دخلها الصحفى والا مفروض بقى نتخيلها فى ددماغنا وكمان عاوزين نعرف ياترى بردة لبس الناس وشكلهم زى اللى بتجيبه الافلام فياريت الاخ الشهم اللى اتمنى انه يكون فعلاغامر ودخل المنطقة دية يورينا صور المكان والناس"
