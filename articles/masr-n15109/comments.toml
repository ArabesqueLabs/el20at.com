[[comments]]
order = 0
subject = "اناالسبب فى الطلاق لان دى سياستى تفريق الاحبة وجعل"
author = "الرئيس حسنى مبارك"
posted = "2008-04-09"
text = "طز فى اى واحد مش عاجبة الوضع الحالى اناححكمكم دلوقتى وبعد مااموت حتحنط وابقى مومياء وبرضة ححكمكم انا والشلة بتوعى اللى عاجبة عاجبة واللى مش عاجبة يخبط راسة فى السماء"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132058/http://masr.20at.com:80/newArticle.php?sid=15109"

[[comments]]
order = 1
subject = "يا أبتي انت مشرك نجس"
author = "ابومحسن"
posted = "2008-04-10"
text = "يا ابتي انت مشرك نجس لا تجلس على فراش رسول الله صلى الله عليه وسلم<br />العبارة دي قالتها ام المؤمنين ام حبيبة رضي الله عنها لابوها ابو سفيان<br />ومن هنا نستدل ان المرأة لا بد ان يكون ولائها لزوجها فقط<br />وكان يجب على هذه الزوجة ان تقف بجانب زوجها وهي تستاهل الطلاق"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132058/http://masr.20at.com:80/newArticle.php?sid=15109"
