[[comments]]
order = 0
subject = "دعوه للمعاكسات بالليل"
author = "جمال عبد الناصر"
posted = "2009-03-04"
text = "أولا الشركة المصري للاتصالات شركة فاشلة قلبا و قالبا و مكروهه من المواطنيين لأنها بتسرقهم علنا اذا انها تحصل منهم اشترك و خواص بدون ان يتحدث الشخص علشان الشركة تقدر تقاوم لابد من تخفيض اسعارها و إلغاء رسوم الاشتراك لأن الجميع انصرف عنها خلاص اصبحت موضه قديمه 0<br />أما بخصوص عروض شركات المحمول برضه ده تشجيع على الفساد لأن العرض يبدأ الساعة 12 بعد منتصف الليل مامعنى ذلك و لأن مين اللى هيتكلم بالليل طبعا مفهوم بنات و شباب و هيتكلموا فى ايه مفيش غير الحب و السكس علشان تطول المكالمة يعنى تشجيع الناس على الفساد لو الشركة عايزه تعمل عروض تعمل مثلا من الصباح حتى الساعة الثامنة"
archived = "2010-03-14"
capture_url = ""

