[[comments]]
order = 0
subject = "بحبك يا مصر"
author = "كتبت اسمي الحقيقي وبعدين خفت"
text = "فكرت ازرع لقمتي<br />ردت وقالت جنتي هتقضي مين<br />فكرت اكتب شكوتى<br />ردت وقالت ورقتى هتروح لمين<br />فكرت ابيع حريتي<br />ردت وقالت كلمتى هتبيعي مين<br />فكرت احبس دمعتي<br />ردت وقالت فرحتى هيهم مين<br />قررت اعيد حريتي<br />واصرخ واسمع دنيتي<br />وارفع شعار وطنيتي<br />وابني بنفسي سكتي<br />واقول كفايا سكوت بقي<br />امتى هتوصل كلمتى<br />وابني كياني وعزتى<br />وأوري بلدي همتي<br />اصرخ معايا يا ابن مصر<br />أصرخ وقول للظلم هص<br />اصرخ بصوتك انت بس<br />(نقلا عن منتدى قهوة كتكوب)"
archived = "2007-08-23"
capture_url = "https://web.archive.org/web/20070823062049/http://masr.20at.com:80/newArticle.php?sid=11122"

[[comments]]
order = 1
subject = "بلدنا العجيبة"
author = "جار القمر"
text = "وكنت فى طفولتى مع هذا الفريق<br />اطفال فى فى السن من السابعة الى العاشرة<br />يخرجون من بيوتهم ليجمعوا لطع او بيض الدود من على ورق القطن هؤلاء الاطفال ياسادة يظلون تحت الشمس من الثامنة صباحا حتى الرابعة عصرا تحت شمس يونيو ويوليو واغسطس<br />واحيانا يعملون بدون اجر ويتعرضون للضرب والتعذيب من الخولى الذى يعملون تحت امرتة<br />انهم يعلمون الطفل المصرى القهر وهو صغير والخوف وهو صغير<br />ثم بعد ذلك يجندونة فى الامن المركزى رمز القهر واهدار ادامية الانسان ليكون عبدا تحت امرة الباشا الضابط او دبورة<br />نعم يبدأ قهر الطفل وهو صغير تحت الخولى ثم عند الشباب فى الامن المركزى ليقف تحت الشمس جوعان وعطشان ومتغرب وخائف<br />ثم تسمع عن حقوق الانسان وحقوق الاطفال ومكتبة الاسرة ورعاية الطفل<br />يا ايها السادة امنعوا القهر عن الاطفال<br />ومفروا لهم مدارس وكتاتيب تعلمهم القراءة والكتابة وتعلمهم كيف يكونوا بشرا ولهم ادامية تحترم وتصان<br />السادة المسئولين فى مكاتب القاهرة المكيفة اذهبوا الى القرى والاحياء الشعبية وشوفوا كيف تحيا الناس<br />شوفوا الحارات المملوءة بالزبالة والناموس والذباب<br />شوفوا الاطفال اللى بياكلوا من الزبالة<br />شوفوا الاطفال اللى بيلموا دودة طوال شهر الصيف تحت الشمس المحرقة ويضربون لاتفة الاسباب<br />يا بلدنا يا عجيبة<br />مصر مش هى القاهرة بس<br />والقاهرة مش هى الزمالك وجاردن سيتى ومصر الجديدة<br />روحوا فرشوط وديروط<br />شوفوا مصر الحقيقية اد\\ اية تعبانة<br />وجوعانة وعريانة وعاطلة عن العمل<br />يابلدنا<br />يابلدنا"
archived = "2007-08-23"
capture_url = "https://web.archive.org/web/20070823062049/http://masr.20at.com:80/newArticle.php?sid=11122"

[[comments]]
order = 2
subject = "مصر"
author = "انا الخولى"
text = "يا ست دعاء دودة ايه ولطع ايه اللى انت بتتكلمى عنها لا عاد لطع ولا عاد قطن<br />والقطن الصينى اللى متنقى اللطع بتاعتة بأيادى صينية ومصنع فى مصانع صينية<br />هيريحك ويرح اولادنا وآبائنا وسادتنا خالص من وش القطن وخلينا بقى نشوف نفسنا شوية<br />نتفرج على الدش ولله در من قال \" لما رمانا الهوا ونعسنا واللى شبكنا يخلصنا \""
archived = "2007-08-23"
capture_url = "https://web.archive.org/web/20070823062049/http://masr.20at.com:80/newArticle.php?sid=11122"

