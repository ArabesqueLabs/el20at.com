subject = "اه يا بلد ..خربانة ...لكن ان شاء الله هتجوز :)"
author = "محمد الديري"
text = "انا مع راي ريهام حسن في ان الواحد ميتخلاش عن الزواج حتي لو الظروف قحط زي ما احنا عايشيين بسبب الحكومة الله ياخدها....<br />ومش عارف مروة محمد اول واحدة اتكلمت كلامها لا يعبر ابدا عن انها فتاة تملك احاسيس وحب ووجدان...بتقول انها عاوزة تتجوز علشان نظرة المجتمع فقط..!!!!!!!!!!!!!...........<br />يعني الواحد المفروض يتوكل على الله وياخد بالاسباب .... والارزاق بيد الله ..... وربنا يحرر مصر من احتلال الحزب الوطني"
