subject = "الى احمد الهواري"
text = "ربنا سبحانه وتعالى قال ادعوني استجب لكم<br />واذا سألك عبادي عني فاني قريب اجيب دعوة الداعي<br />وربنا سبحانه وتعالى علمنا الدعاء في القران<br />ومن ادعية القران العظيم رب لا تذرني فردا<br />لما عنوان المقال يقول رب زرني فردا<br />يعني مخالفة ما علمنا الله سبحانه وتعالى من الدعاء<br />ويعتبر عنوان هذا المقال يدخل في باب الاستهزاء بالدين<br />فلو سمحت والله تنبه لهذا"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084738/http://masr.20at.com:80/newArticle.php?sid=14644"
