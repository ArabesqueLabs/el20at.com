subject = "Fade in: We see a couple jumping from a bridge, into a wide river below."
author = "mesh"
text = "Fade in: We see a couple jumping from a bridge, into a wide river below.<br />Flash back to twenty-four hours earlier. Shawn Holloway (Selma Blair—Legally Blonde, Highway, The Sweetest Thing) is having a lousy day. Her boss/boyfriend takes her for granted, using her for fun and then running back to his wife in the morning. To top things off, her goldfish is floating at the top of the fishbowl—not a good way to start the day. Actually, she's having more than a lousy day—in her eyes, she is having a lousy life. She works as a loan officer in a bank, and hates her job and the people she must deal with. (Been there, done that.) In her eyes, her misery all goes back to her parents' divorce back when she was eleven years old and the father who deserted her. To make a long story short, she has decided to end it all. She summons some liquid courage and makes her way to the top of the building where she works, ready to decorate the pavement.<br />Meanwhile, in a separate storyline, Charlie Anders (Max Beesley—Glitter, Hotel (2001), the BBC's Tom Jones miniseries) is a hard-luck petty criminal from London's East End. How he came to America to ply his trade is not totally clear, but he's had a hard life; he emerged from a couple of years in the clink to find that his true love had left him, and that his daughter didn't even know he existed. He tries to maintain a crusty, cynical façade but it's mostly an act.<br />The two lives (and storylines) collide when Charlie and two of his buddies bungle a bank robbery at the bank where Shawn works. One of his accomplices is shot, his wheelman flees with the getaway car, and Charlie races deeper into the bank, trying to evade cops and security guards. He emerges on the roof, where he finds Shawn, preparing for her swan dive into the undiscovered country. He takes her hostage, but he has a problem: she's hard to force into doing anything, since she would really prefer that he just shoot her and get it over with. Charlie, desperate to survive, makes a deal with her. If she will play along and help him escape now, he will kill her later."
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084738/http://masr.20at.com:80/newArticle.php?sid=14644"

