text = "بجد لو هنتكلم عن كل شئ جميل بجد يبقي الجدير بالذكر هو استاذ اسامه منير بشكره علي مجهودااته العظيمه اللي غيرت منا كتير بجد ومن شبااب كتير في مصر وانا عمري ما انسي جميله عليه وعرفااني بفضله عليا تحيااتي الي عظيم الروماانسيه ورسول الحب اسامه تحياتي ليك يااسامه من مجموعه اكاديميه المستقبل محمد عصام / هبه رافت يوسف تحياتي"
