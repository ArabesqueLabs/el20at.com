[[comments]]
order = 5
subject = "اذل الحرص اعناق الرجال"
author = "سعدون اللى كان مجنون"
posted = "2008-05-01"
text = "يااخ مش ضرورى انا مش عارف ليه كلامك واسلوبك غير مفهوم ؟؟ شككتنى فيك وظنونى بدات تتحول ليقين1 ؟؟مش عارف ليه انا متخيلك لابس بالطو فى عز الصيف وماسك جرنال مخروم بتقرا فيه ولابس جزمه بتزيىء وتحت باطك عصايه ؟؟ ومع زلك اللى يسالك بتشتغل ايه تقولوه صحفى ورئيس تحرير ؟؟؟ياسيد مش مهم الاول هاجمت الاخوان المسلمين ووصفتهم بخوارج الامه ( وهذا حقك ولن نحجر على راى احد) ورديت عليك بان اضراب5 مايو مش عشان الاخوان لاء ده عشان جورج اسحق -- يعنى كان لازم تفهم ان ده مش اضراب اخوانى ده اضراب مصرى ايا كان انتماء المشاركين فيه ----- ثانيا ناس مين اللى عايزنى ابلغهم كلامك ؟ انت عايز تخلينى مرشد عندك ولا ايه؟؟ مش عايز تنسى شغلتك ابدا؟؟؟؟؟ واخيرا وليس اخرا كنت اتمنى انك تختار اىنموزج للثورات غير الثوره الايرانيه بالذات خاصة وانها ثوره دينيه قامت على مبدا الامامه وعصمة الامام وبما انك تحاملت على الاخوان ووصفتهم بالخوارج رغم انهم لايقدسون الائمه فما بالك بروافض الامه اللذين سبوا الصحابه وتريد ان تتخذهم مثلا وقدوه ؟؟؟ سبحان الله بالامس تسب الا خوان واليوم تمدح ثورة الرافضه ! هذا تخبط فى الفكر وعدم اتزان فى الراى---- ثم انت عايز الشعب يبحث على قائد قبل مايعمل اضراب ؟ يعنى انت حطتنا امام الامر الواقع مافيش قائد يبقى مافيش اضراب مش ده اللى انت عايزه ؟ ياسيد مش ضرورى الفكره مش فكرة مين اللى ينظم الاضراب ولا مين اللى نتفق عليه للحكم الفكره ابسط من كده بكتيييرالفكره فكرة شعب قرر انه لن يكون نكره فكرة شعب قرر ان يكون فاعل وليس مفعول به ايا كان الحاكم سواء كان مبارك او ايمن نور او حتى اسراء عبد الفتاح فقد قررنا الا نكون خراف تلهث خلف راعيها !!! ولا انت مش زينا ولا ايه ------ على فكره الجو بقى حر ابقى اقلع البالطو خلاص عرفناك---- وردا على سلامك لك منى سلامين وحته"
