text = "يااستاذ سعدون انا قلت ان الايرانيين قبل ما ينزلوا الشوارع ويعملوا عصيان مدني كانوا محددين هدفهم كلهم متفقين على شخص واحد اسمه الخوميني وهو دا سبب نجاح الثورة الايرانية ان كل الشعب كان متفق على واحد<br />في مصر الوضع بيختلف<br />الشعب المصري ما عندهوش اي رؤية مستقبلية والدليل على ذلك ان فيه ناس مرشحة اسراء عبدالفتاح لرئاسة الجمهورية<br />وهذا دليل على الهبل والعبط<br />وانا مش مخبر ولا بتاع انا مسلم سني ملتزم بتعاليم اهل السنة والجماعة في كل شيء واول شيء هو الحكم<br />واول مبدأ من مبادى ء اهل السنة والجماعة السمع والطاعة لولي الامر ما اقام الصلاه واسال علماء اهل السنة والجماعة حتى كمان فضيلة الشيخ محمد حسان ادان كل هذه الاعمال على قناة الرحمة الفضائية<br />وسلامي لك<br />واخيرا انا مسلم سني ملتزم بتعاليم اهل السنة والجماعة وعلمائها الاجلاء امثال الشيخ الشعراوي واحمد عمر هاشم والشيخ محمد حسان وفي السعودية الشيخ ابن باز وبن عثيمين وهم كثيرون ومن القدامى الحسن البصري<br />ومع ذلك اذا استفحل الظلم ممكن الانسان المسلم يثور بشرط ان يكون لديه رؤية مستقبلية ويكون محدد هدفه ويكون فيه اجماع من كل الشعب على البديل"
archived = "2010-03-14"
