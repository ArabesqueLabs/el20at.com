text = "اضراب وراء اضراب اعتصام بعدة اعتصام لغاية منوصل للعصيان المدنى اونوصل لحقوقنا وارادتنا المسلوبة والمنهوبة فى عصر سيدتك وفى الخمسة عشرعاما الماضية بيعت اراضى للدولة بمبلغ 800مليار جنية حسب ماسمعنا فى البى بى سى ودة كفيل بتسديد ديون مصر الداخلية والخارجية ونقل البلد نقلة حضارية معقولة دة غير تمن بيع شركات القطاع العام وتصاريح شركات الموبايل وغيرة وغيرة كتير علشان كدة ياريس بنقولك كل سنة وانت فى بيتكم ولافى شرم الشيخ معتزل الحياة السياسية وانت بخير وصحة وعافية"
