subject = "اذا كان الغراب دليل قوم"
author = "سعدون المجنون"
posted = "2008-04-30"
text = "الاخ اللى فوق انت عايز ايه بالظبط ؟؟ الاخوان وحشين يعنى ! ماشى ياسيدى على عينى وراسى ؟؟ بلاش يعنى نعمل الاضراب علشان خاطر الاخوان وحشين؟؟ طب ايه رايك هانعمل الاضراب علشان خاطر جورج اسحاق ولا ده كمان اخوانجى واحنا مش عارفين؟؟؟ بالله عليك سيبنا فى الهم اللى احنا فيه ووفر نصايحك الغاليه وابقى اقرا الحديث النبوى كويس مافيش حاجه اسمها(ظنظى) اللفظ الصحيح (ضئضئى)بالضاض يافالح مش بالظاء روح اتعلم الفرق بين الاتنين وابقى تعالى اتكلم ! جاتكو البلا مليتو البلد"
