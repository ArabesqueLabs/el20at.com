[[comments]]
order = 7
subject = "فمن سره زمن ساءته ازمان"
author = "سعدون اللى مابقاش مجنون"
posted = "2008-05-02"
text = "الاخ مش ضرورى (صدقنى والله انا ماكنتش ناوى ارد عليك خاصةاننا نتكلم فى موضوع سياسى بحت الا وهو (اضراب 4 مايو)لكن حضرتك واضح انك غاوى مجادله وجدال الى مالا نهايه وفى نفس الوقت اراك تلبس الحق بالباطل وتقحم الدين واسماء بعض العلماء وكانك بذلك الزمت خصمك الحجه وهذا ليس من شيم الكرام ولا من نبل الفرسان (ومع ذلك سارد عل كلامك والله المستعان وعليه التكلان ) اولا اعلم بان كلامك عن طاعة ولى الامر هو قولة حق ولكن يراد بها باطل !!! نعم انا معك فى ان طاعة ولى الامر واجبه ---- ولكن هل هى الطاعه المطلقه ؟؟؟ ام هى الطاعه المقيده !! ومقيده بماذا ! هل هى مقيده بالصلاه ذى ماحضرتك قولت فى تعليقك ؟ ياريتك تذكر لى النص الله يبارك فيك؟؟؟ لانه حسب علمى وانا العبد الجاهل امام علم العلماء---- ان طاعة ولى الامر مقيده بطاعة الله ورسوله وليس بالصلاه ذى ماحضرتك فاهم والايه الكريمه تقول(اطيعوا الله واطيعوا الرسول واولى الامر منكم) ولم يقل المولى عز وجل اطيعوا اولى الامر لان طاعتهم مقيده بطاعة الله والرسول ) هكذا فسرها جل علماء المفسرين واجمعوا على زلك ثانيا هل من حق الرعيه مخالفة الحاكم والخروج عليه دون اى رؤيه مستقبليه( حلوه حكاية رؤيا مستقبليه دى) مصطلح جديد فى الشرع اول مره اسمعه ماعلينا ؟؟ اسمع ياسيد مش ضرورى قبل ان نخوض فى هذه المسئله الخطيره يجب ان تعلم شىء مهم جدا الا وهو تسمية الامور بمسمياتها !! اذا كنت تقصد بالخروج على الحاكم هو قتله او الاعتداء عليه او مسه بسؤ فهذا فهمك انت وهو فهم خاطىء ومردود عليك وعلى من فسر الخروج بهذا الفهم من امثال علماء السلاطين وحاشية خلفاء الامويين وزبانية العباسيين وكل من صور للحاكم ان مجرد احتجاج الرعيه او الخروج للشوارع هو خروج عن طاعة السلطان وانحراف عن الشرع الحنيف يستوجب العقاب والتعزير واحيانا القتل والنفى والتشريد لان فى هذا درءا للمفسده وجلب للمصلحه (مصلحة الحاكم طبعا) ولكن اذا كان الخروج هو تعبير الرعيه عن رايها فى مسالة ما ارادو بها ارسال رسالة للحاكم او تنبيهه الى شىء ما فهذا هو عين الشرع ولنا فى سيد الخلق ( صلى الله عليه وسلم ) الاسوة الحسنه فى ذلك ؟؟ نعم؟؟ فبعد غزوة مؤته واستشهاد قواد الجيش وانسحاب جيش المسلمين بقيادة خالد بن الوليد من ميدان المعركه ورجوع الجيش الى المدينه المنوره ؟؟ ماذا حدث ؟؟ كان اول احتجاج ومظاهره شعبيه فى المدينه المنوره ؟؟ خرج اكثر اهل المدينه ومعهم كثير من ابناء الشهداء الاطفال وهم يهتفون ؟؟يافرار يافرار؟؟ اليس هذا احتجاج سلمى ! اليست هذه مظاهره ّ! ماذا كان رد المعصوم (صلى الله عليه وسلم) هل اعتبرهم خارجين على الحاكم ! هل اعتبرهم مثل زو الخويصره الذى اراد ان ينفى صفة العدل عن اعدل خلق الله ؟؟ لا ؟؟ بل كان رده صلى الله عليه وسلم بان قال لهم بل هم القرار بل هم القرار---- اليس هذا رسول الله اليس هؤلاء رعيته ؟؟ هل اتهمهم احد من المؤرخين بالغوغائيه او عدم وجود رؤيه مستقبليه( مش عارف ليه معلقه فى دماغى حكاية رؤيا مستقبليه دى) المهم ياسيد مش ضرورى ان خروج الرعيه على الحاكم للمطالبه بحق من الحقوق المشروعه دون تخريب فى ممتلكات الدوله هو حق مشروع كفله الشرع ولنا فى كلام سيد الخلق (عليه الصلاة والسلام ) وفى كلام اصحابه الاسوة الحسنه حيث ورد فى معنى الحديث الشريف ان احد امراء النبى من الانصار امر اصحابه بان يوقدوا نارا ثم امرهم ان يدخلو فيها على سبيل المزاح حيث انهم مامورون بطاعته فقال احدهم انما امنا بالله لنفر منها ولم يدخلوها فلما بلغ زلك لرسول الله قال والله لو دخلوها ماخرجوا منها قالوا يارسول الله اليست طاعة الامير واجبه ؛ قال انما الطاعة فى المعروف اوكما قال بابى هو وامى صلى الله عليه وسلم فنحن مامورون بطاعة ولى الامر فى المعروف وهذ كلام رسول الله ------ ثالثا او رابعا حتى لا اطيل عليك اعلم ان اختيار الحاكم من قبل الرعيه هذا من صميم الشرع وان كنا فقدنا ذلك منذ زمن معاويه رحمه الله فالحاكم الذى يولى غصبا وكرها فاقدا لشرعية الحكم وان اقر بعض العلماء بحكمه خوفا ان يبطش بالرعيه فكانو يتقون شره باقراره على الحكم وهم يعلمون فساده وظلمه ولنا فى الحجاج الثقفى الاسوة السيئه فى زلك---- خامسا انا لم اسالك انت سنى ولا شيعى ولا معتزلى حتى ترد عليا بذلك فهذا امر يعنيك وحدك وعل كل اعلم بان هؤلاء العلماء الافاضل اللذين ذكرتهم واستشهدت بارائهم هم انفسهم مع تقديرى وحبى لهم اجمعين وانا لست اهلا ان احمل حذاء احدهم الا انهم يختلفون مع بعضهم البعض فى مسائل كثيره جدا لا يتسع المقال لذكرها وان اتفقوا فى مساله قد يختلفون فى الاخرى وديننا لا يعرف الكهانه وكل يؤخذ منه ويرد الا صاحب المقام الشريف صلى الله عليه وسلم ( صدقنى والله انا اكتب هذا الكلام ليس تعصبا لراى او فكر معين ولكنى رايتك مره تشتم الاخوان وتتهم بالكفر( اوعى تقولى ماكفرتهمش ) كونك وصفتهم بالخوارج فهذا تكفير ومره تمدح الثوره الايرانيه والان تلوم الشعب المصرى لانه ليس له رؤيه مستقبليه كأ ن العيب فى الركاب مش فى السواق ثم فى الاخر تقول انا سنى وهذا راى علماء السنه مع انك لو سمعت رأ ى العلامه ابن باز رحمه الله فى امثال >د احمد عمر هاشم ومن هم على شاكلته كنت اتهمته انه من الزنادقه مش من الخوارج وبس ؟؟ ومع زللك نحن نقول العالم الذى يجتهد ويصيب فله اجران واذا اخطا فله اجر ونحن لسنا عندنا كهنوت اوعصمة الامام حتى نمشى وراء هذ او زاك ونحن مغمضى الجفون --- على كل عايز تعمل اضراب اعمله وماتخفش مشهو ده اللى هيدخلك النار والعياذ بالله وصدقنى اقلع البالطو الجو بقى ولعه"
