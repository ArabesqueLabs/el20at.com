order = 1
subject = "وحياة سماها وترابها المرشد هو اللي خربها"
author = "منقول من موقع الشيخ إبراهيم بن"
posted = "2008-04-30"
text = "الإخوان المسلمين هم خوارج العصر وهذا هو الدليل !!<br />لم تكن رؤية استثمار القرآن الكريم في خدمة الفكر والتوجه لدى جماعة الإخوان المسلمين بدعا من القول بل توارثوه أبا عن جد عن سلفهم الطالح \\\" ذي الخويصرة وأحفاده \\\" كيف هذا ؟!!<br />ذي الخويصرة احتج على رسول رب العالمين في قسمة غنائم حنين قائلا \\\" اعدل يا محمد فإنك لم تعدل \\\" فاتخذ من المال وقسمته ذريعة في الطعن بأمانة سيد المرسلين صلى الله عليه وسلم بدعوى الإصلاح كما يزعم وقد أجابه النبي عليه السلام بقوله \\\" ويحك من يعدل إن لم أعدل \\\"!!.<br />ثم أخبر النبي عليه السلام أنه يخرج من ظئظئ هذا الرجل قوم تحقرون صلاتكم عن صلاتهم وصيامكم عند صيامهم يقرؤون القرآن لا يتجاوز تراقيهم يمرقون من الإسلام كم يمرق السهم من الرمية \\\" ثم دعا عليه السلام إلى قتلهم مخبرا أن في قتلهم أجر عظيم عند الله تعالى .<br />أولئك يا سادتي الكرام هم الخوارج الذين رفعوا القرآن بأيديهم علي الخليفة الراشد علي بن أبي طالب رضي الله عنهم محتجين عليه بأنه حكم الرجال مطالبين بتحكيم القرآن وقد انتدب إليهم علي رضي الله عنه ابن عباس رضي الله عنه حيث جادلهم بالقرآن وأقام عليه الحجة والبيان وهكذا جماعة الإخوان المسلمين يتهمون حكام المسلمين بالجور وعدم العدل بين رعاياهم متهمين إياهم بالاستئثار بالمال دون رعاياهم متخذين من المال فقط وسيلة في تكفير الحكام ولعنهم والطعن في عقائدهم ونواياهم مغفلين ما هو أهم من المال وهي العقيدة وسلامتها من عدمه إذ غايتهم الدنيا والدرهم والدينار بغيتهم إن أعطوا منه رضوا وإن منعوها إذا هم يسخطون أما الدين وأحكامه فهو ذريعة ومطية يدغدغون بها عواطف العامة والبلهاء وبعض البلدان الإسلامية التي تمكنوا من الوصول فيها لمناصب عليا وقيادية خير شاهد حيث لم يقيموا بالقرآن رأسا بل بعضهم أبقى الحكم علمانيا كما كان لئلا يخسر رئاسته ومنصبه وكرسيه .<br />أحفاد ذي الخويصرة من خوارج سلفهم المشئوم اتخذوا من القرآن وسيلة في الطعن بعدالة إمام المسلمين علي بن أبي طالب رضي الله عنهم متهمين إياه بأنه يحكم الرجال!!.<br />خوارج العصر من جماعة الإخوان المسلمين اتخذوا القرآن وسيلة هامة جدا في الاحتجاج على الحكام فهم يدندنون حول الدعوة بضرورة تحكيم القرآن الكريم وقياداتهم من أبعد الناس عن نصوص القرآن الكريم ولنأخذ سويا بعض الأمثلة من ذلك أن بعضهم يبيح استماع الأغاني ويفتي عبر القنوات الفضائية بجواز ذلك وقد حرم القرآن الكريم استماع اللهو قال سبحانه \\\" ومن الناس من يشتري لهو الحديث ليضل عن سبيل الله بغير علم ..\\\" قال ابن مسعود والله الذي لا إله إلا هو إنه الغناء .<br />من مبادئ فكر الإخوان المسلمين تكفير حكام المسلمين والخروج عليهم ممتثلين قول أحد مؤسسي فكرهم حيث يقول : «... لعلك تبينت مما أسلفنا آنفاً أن غاية الجهاد في الإسلام هي قواعد الإسلام في مكانها واستبدالها بها. وهذه مهمة إحداث انقلاب إسلامي عام - غير منحصر في قطر دون قطر بل مما يريده الإسلام ويضعه نصب عينيه أن يحدث هذا الانقلاب الشامل في جميع أنحاء المعمورة، هذه غايته العليا ومقصده الأسمى الذي يطمح إليه ببصره إلا أنه لا مندوحة للمسلمين أو أعضاء الحزب الإسلامي عن الشروع في مهمتهم بإحداث الانقلاب المنشود والسعي وراء تغيير نظم الحكم في بلادهم التي يسكنونها» المرجع في ظلال القرآن سيد قطب ج3/ص1451 طبعة دار الشروق.<br />أسألكم بالله الذي لا إله إلا هو أليست هذه دعوة خروج وثورة صريحة على ولاة الأمر في كل قطر من أقطار الأرض غير منحصر في قطر دون قطر أصلها وأكدها وقتل من أجلها إمامهم وشهيد فكرهم فما رأي تلاميذ قطب في مجتمعنا وما تأويلهم لهذا النص الكريم للإمام الشهيد ؟!! ألا يعتقدون صحة هذا القول لإمامهم ووجوب العمل به ؟!!.<br />حقا هذه عقيدتهم مخالفين بذلك نصا صريحا في كتاب الله تعالى \\\" يا أيها الذين آمنوا أطيعوا الله وأطيعوا الرسول وأولي الأمر منكم \\\" فأين صراخهم بالعناية بكتاب الله تعالى ودعم حفظه أم يؤمنون ببعض الكتاب ويكفرون ببعض كحال أهل الكتاب من اليهود والنصارى الذين ذمهم الله تعالى في كتابه الكريم .<br />ثم أليس القرآن الكريم كله دعوة للتوحيد والعقيدة كما أشار إلى ذلكم شيخ الإسلام عبد الرحمن بن سعدي رحمه الله فإما دعوة للتوحيد وتحذير من الشرك وإما ببيان مكلات التوحيد والتحذير من منقصاته وإما ببيان جزاء الموحدين وعقوبة المشركين فأين الإخوان المسلمين من الدعوة إلى التوحيد الذي دعا إليه القرآن بل من أجله أنزل ومن أجل أرسل محمد وإخوانه المرسلين عليهم الصلاة والسلام ؟!! فأين دعوتهم هم للتوحيد وأين نصوص أئمتهم وقياداتهم ورموزهم وأين خطبهم وندواتهم ومحاضراتهم ومخيماتهم ومراكزهم وملتقياتهم الدعوية وجميع مناشطهم من قضية التوحيد التي هي قضية القرآن الكر يم وغايته ؟َ!َ!. هل من مجيب ؟َ!!<br />علم أحفاد الخوارج من جماعة إخواننا المسلمين عظم مكانة القرآن الكريم لدى المسلمين عموما والشعوب العربية خصوصا ومحبتهم الكبيرة لكلام الله وتقديسهم الشديد له دينا وطاعة وقربة لله فاستغلوا القرآن الكريم ورفعوه بأيديهم كما رفعه أسلافهم والكثير منهم والذي لا إله إلا هو من أبعد الناس عن القرآن كما أن الكثير من حفاظهم يقرؤون القرآن لا يتجاوز حناجرهم \\\" قراء فقط \\\" كما وصف أسلافهم بذالكم النبي عليه الصلاة والسلام.<br />ومن هنا يظهر لنا أوجه الشبه بين خوارج القرون الأولى وخوارج القرون المعاصرة \\\" الإخوان المسلمين \\\" في ثلاث مسائل:<br />أولا : أنهم يركزون على المال والمادة فقط ويجعلونها ذريعة ومعيارا ووسيلة في التهجم على السلطان وانتقاصه والثورة عليه وإيغار صدور رعيته عليه وإن كان من أتقى الخلق وهل هناك أتقى من محمد عليه الصلاة والسلام ؟!! .<br />ثانيا : الطعن العلني في الحاكم \\\" اعدل يا محمد ...\\\" وهكذا الإخوان المسلمين كفروا وفسقوا جميع حكام المسلمين ورعاياهم دون استثناء وإن شهدوا أن لا إله إلا الله ما لم ينتسبوا إلى فكرهم وحزبيتهم المقيتة وجماعتهم \\\" المؤمنة !! \\\"<br />ثالثا : إظهار محبة القرآن الكريم والمناداة بتحكيمه لمخادعة العامة وبلهاء الخلق ومخالفته والتحايل على نصوصه وأوامره باطنا .<br />ومما يؤكد تحايلهم وكذبهم :<br />قالوا وأشاعوا أعني – رموز الإخوان المسلمين – في مجتمعنا مزيدا في تضليل الأمة وإيهام البشر والتلبيس على الخلق في وصف خوارج مجتمعنا \\\" الفئة الضالة \\\" وحقيقة الأمر أنه لا صحة لمسمى الفئة الضالة بيننا والدليل أن هذا الاسم محليا لتفجيري وطننا فقط وليس عالميا لجميع المفجرين في كل قطر مسلم وحقيقة الأمر أن من يسمونهم \\\" فئة ضالة \\\" هم الصف الأول من جند الإخوان المسلمين في مجتمعنا وفي كل مجتمع الذين ربوهم على الخروج وسمموا أفكارهم وغذوا عقولهم وباسم الدين والقرآن بمعتقد منحرف ضال حينما يخرجون بهم في خلوات وجلسات واستراحات خاصة ليلقنوهم فنون مخالفة نصوص القرآن وليزجوا بهم وليقدموهم وليضحوا بهم في عدد من أقطار العالم الإسلامي أفغانستان والشيشان والبوسنة والهرسك والعراق وغدا الصومال وغيرها من البلدان الإسلامية المنكوبة سعيا لإقامة خلافتهم الراشدة المزعومة فهم والله شر من وطأ الأرض وهم والله شرمن تحت أديم السماء وهم والله دعاة الفتنة ومشعلوها فحسبهم الله ونعم الوكيل والله غالب على أمره ولينصرن من ينصره وهو جل وعلا من وراء القصد والمستعان على ما يصفون ،،،.<br />د. إبراهيم بن عبد الله المطلق"
