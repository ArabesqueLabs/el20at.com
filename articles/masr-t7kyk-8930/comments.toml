[[comments]]
order = 3
subject = "الى الاخ اللي فوق (سعدون)"
author = "مش ضروري"
posted = "2008-04-30"
text = "يا استاذ سعدون فيه فرق بين العمل المنظم والهبل والعبط<br />اللي بيحصل دا اسمه هبل وعبط وناخد الثورة الايرانية مثلا لذلك<br />الايرانيين عملوا اضراب وعصيان مدني بس كانوا كلهم (كل الايرانيين بلا استثناء) عايزين واحد بس يحكم اسمه ا لخوميني<br />علشان خاطر لما عمروا اضراب كانوا محددين هدفهم ونجح<br />لكن المصريين بيعملوا اضراب ليه<br />ناس عايزه المرشد وناس عايزه ايمن نور وناس اصبحت عايزه اسراء عبدالفتاح كله عمال يهبل ويعبط<br />يا استاذ سعدون لما المصريون كلهم يتحدوا على شخص معين يحكم البلد في هذه الحالة ممكن نعمل اضراب زي ايران كده<br />و المرشد العام اسمه المرشد العام ليه (مش عارف والله) هو اللي المفروض يقول الكلام اللي انا بقوله دا<br />طالما الشعب المصري ما فيش في ذهنه اي تصور لمين حيحكم في المرحلة المقبلة يبقى الاضراب دا اسمه هبل وعبط<br />وبعدين القضية اللي انت اثرتها في تعليقك وهي ظنظى) اللفظ الصحيح (ضئضئى)بالضاض يافالح مش بالظاء<br />دا اسمه خطأ مادي اثناء الطباعة اي واحد بيطبع على الكمبيوتر لازم يغلط<br />وزي ما قلتلك الشعب يعمل اضراب لما يكون كل الشعب متفق على شخص معين للحكم مثل الايرانيين لما ثاروا على شاه ايران كلهم كانوا متفقين على ان الخوميني هو اللي يحكم<br />ويا ليت تبلغ الناس بهذا الكلام لان اللي بيحصل دا اسمه زغزغة لامن واستقرار البلد وحيزيد الطينة بله وممكن يجي ناس في الحكم ازفت من الحكم اللي موجود<br />سلامي لك<br />وممكن بسبب ذلك يحي ناس ازفت بكتير من الحكم اللي موجود"
