[[comments]]
order = 1
subject = "يا مروة يا بنت الشيخ عبد الفضيل"
author = "يعنى انا"
posted = "2008-02-08"
text = "يا ست مروة يا محترمة<br />سرقة شوكة او سكينة او حتى فوطة من فندق ازعجتك وجعلتك تسهرى الليالى لتكتبى مقالا عصاميا<br />ولا يزعجك الذين يسرقون بنك القاهرة مثلا<br />او الذين يسرقون ارض الساحل الشمالى مثلا وليس بالفدادين ولا الامتار ولكن احدى الجرايد قالت انهم يسرقون بالكيلومترات المربعة<br />اين عائدات الشركات المباعة الفلوس اللى خدوها من بيع مصانع الاسمنت للايطاليين راحت فين وفى حساب مين فى بنوك سويسرا<br />مفيش احد من المسئولين بيرد على تساؤلات الناس - يبقى نظن بيهم ظن السوء"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142545/http://masr.20at.com:80/newArticle.php?sid=14135"

[[comments]]
order = 2
subject = "فوق الجميزة يا ما بكيت مع طه حسين وديستوفيسكي وجوج"
author = "علي لا شين"
posted = "2008-02-08"
text = "كان كلما سمع الأغنية الشهيرة تحت الشجر يا وهيبة يا ما أكلنا برتقال يردد مع نفسه فوق الجميزة يا ما بكيت مع طه حسين وديستوفسكي وجوجول وغيرهم من كبار الأدباء العرب والأجانب<br />ولان الفتى لم يكن يجيد السباحة في الترعة أو لعب الكرة في أجران القمح في القرية مثل أقرانه فكان ولا بد أن يبحث عن بديل لقضاء وقت فراغه الطويل وخاصة في الإجازات الصيفية عندما تغلق المدارس لأكثر من ثلاثة أشهر فوجد ضالته في القراءة ولكن كيف يحصل على الكتب ووالده فلاح بسيط لا يقوى بالكاد الا على توفير القوت الضروري لأفراد أسرته.<br />لقد هداه تفكيره إلى التوجه إلى أبناء طبقة الموظفين في القرية حيث كان يحرص أباؤهم على توفير الكتب لهم فوجد ضالته المنشودة لديهم ولكن مع شيء من العنت فلم يكن ينجح استعارة أي كتاب إلا بعد جهد جهيد وتعهد بإعادة الكتاب في أسرع وقت ممكن وحتى يفي بوعده كان يأخذ الكتاب ويتسلق شجره جميزة عتيقة ويظل معلقا بين أغصانها أوقاتا طويلة حتى ينتهي من قراءة الكتاب بسرعة لكي يعيده ويأخذ بديلا عنه وهكذا ظل في هذا المحراب ينهل من كتب الأدب العربي في البداية في انغماس شديد في روايات يوسف السباعي وإحسان عبد القدوس ويحيي حقي ويوسف إدريس ويوسف عز الدين عيسى وجورج زيدان إلى أن استهواه الأسلوب الأدبي الرصين لعميد الأدب العربي الدكتور طه حسين ومن عنده كانت البداية بداية الولوج إلى أدب الحزن والأسى والآلام الإنسانية وعذابات النفس البشرية.<br />ويتذكر الفتي كيف قرأ مجموعة طه حسين القصصية المعذبون في الأرض ولم ينسى حتى الآن قصة الآم الثكلي التي فقدت وحيدها تحت عجلات القطار ولا قصة دعاء الكروان وكيف دفع الفقر أسرة ريفية لا عائل لها إلى إرسال الأخت الكبرى إلى الخدمة في بيوت المدنية ليوقعها حظها العاثر في براثن مهندس زراعي أعزب ومغترب وسكير فيغتصبها وتحمل منه فيقتلها خالها لمحو العار وتذهب أختها الصغرى للخدمة عند نفس المهندس للانتقام لأختها ولكنها بدلا من ذلك تقع في غرام المهندس وتنسى الهدف الذؤ جاءت من أجله<br />ويتوقف الفتى أيضا عند إحدى القصص القصيرة ليحيي حقي وهي قصد السلم الحلزوني وهو سلم يقف راسيا في دائرة ضيقه يربط مطابخ الشقق بالخارج لكي يستخدمه الخدم دون المرور من الأبواب الرئيسية واستخدام السلم الرئيسي للعمارة وكان استخدام هذا السلم الحلزوني يعد بمثابة طابور ذنب مثل الذي يتعرض له الجنود في الجيش فاستخدامه يصاحبه عذاب جسدي ونفسي لا مثيل له وكان بواب العمارة يرغم صبي المكوجي على استخدام هذا السلم حتى لو كان في طريقه لتسليم الملابس المكواة لعميل في الدور العاشر<br />ومن صور العذاب أيضا التي لا تنسى الصورة التي وردت في إحدى القصص القصيرة للدكتور يوسف عز الدين عيسى التي تشير إلى طفل صغير لم يتجاوز عمره الخامسة وتوفت أمه وتركته وحيدا مع والده المشغول عنه دائما ويظل الطفل يبكي طوال النهار في نافذة منزله إلى أن يغلبه النعاس.<br />ولما اتجه الفتى إلى الأدب العالمي لعله يجد فيه ما يعوضه عن الحزن والأسى الذي وجده لدى كبار الأدباء العرب أوقعه حظه العاثر في الترجمة الرائعة لأعمال الأديب الروسي الكبير تيودور ديستوفسكي التي أبدعها المترجم سامي الدروبي السفير السوري لدى واشنطن في أوائل الستينات ليجد نفسه وسط وليمة من التحليل النفسي لنفوس مجموعة من البشر تتعذب كل يوم وذلك في روايات الأخوة كرامازوف والجريمة والعقاب والأبله ومعذبون مهانون.<br />ولما اراد الفتى الهروب من مآسي ديستوفسكي وقع في رائعة الأديب الروسي أيضا جوجول (المعطف) وهي قصة قصيرة تصور البؤس الذي يعيشه موظف حكومي فقير لا يملك سوا معطفا واحدا يلبسه ليلا ونهارا صيفا وشتاء<br />ولم يخرج الفتى من الكآبة والجو الحزين الذي كان يعيشه بسبب مشاركته الوجدانية إلى حد البكاء مع شخوص الروايات التي قرأها سوى انتقاله من القرية إلى القاهرة لالتحاقه بكلية الاقتصاد والعلوم السياسية ومزاملته لكبرى بنات الرئيس جمال عبد الناصر."
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142545/http://masr.20at.com:80/newArticle.php?sid=14135"
