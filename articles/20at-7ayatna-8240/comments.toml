order = 5
subject = "ما قصدت اكتب لصالح عيد الحب"
author = "نجلاء"
posted = "2008-02-17"
text = "أما المزارع أبو خليل الأغا، فقد افترش بمجموعة من أزهاره التي زرعها أحد شوارع غزة، عله يجد من يشتري تلك الزهور في عيد الحب، وهو يدرك تماماً أن ما سيجنيه من جلوسه هذا لا شيء سوى التعب ونفاد علبة سجائره!.<br />هون انا قصدت انه ما حدا بشتري، حتى لو كانت القضية اقتصادية وفقر مثلا، لكن ما حدا بشتري، لانه ببساطة ما بحتفلو فيه ابدا .<br />في غزة بزرعوا الورود فقط للتصدير مش اكتر وممكن لتزين سيارات الافراح.<br />اذا حدا فهم غير هيك مو ذنبي"
archived = "2010-03-14"
