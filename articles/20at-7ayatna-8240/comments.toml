text = "بجد يا جماعة لازم تراجعو نفسكم في الكلام اللي بيتكتب انتو بتتكلمو وكان الفلانتين ده عيد شرعي قبل به المسلمون واللي يقرا التقرير ده يفهم ان ده شئ طبيعي وعادي بل المفروض تذكره حرمت الموضوع ده واصل ايه ومين هو فالنتين يا جماعة مش علشان نوصل للشباب الروش والشباب الضايع نقوم نتنازل عن ثوابت عندنا بجد لازم تكون فيه وقفة يا جماعة كده غلط قوي"
