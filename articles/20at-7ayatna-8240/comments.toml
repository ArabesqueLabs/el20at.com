text = "يا صباح الغفله والضياع والذل الذى تمتع به الامه وشبابها...<br />تقليد الغرب حتى ليصبح الفالنتين عيد رسمى يهدى رجل لمراه لا تحل له الورد ويا عينى الشاب الظريف بيصرف اللى فى جيبه (كله)بل فى بيستلفه......<br />جميل ......... المفروض انا نهنى بعض والى مالوش صاحبه لازم يبحث عن صاحبه علشان نسعد اسياد الكفر<br />يا خسارة الامه (الشباب)-(الدعاه)-(الدول المحتله)<br />عذرا رسول الله<br />عذرا يا الله"
