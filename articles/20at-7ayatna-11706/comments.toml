text = "السلام عليكم ورحمة الله تعالى وبركاته<br />لا بد من حفظ حقوق الإبداع والابتكار، والتذكير بأن صاحب هذه الأفكار النيرة هو الباحث في الأوقاف: الدكتور فارس مسدور، منظّر صندوق الزكاة الجزائري، وصاحب فكرة الجامع الأعظم بكل تفاصيلها، وأيضا صاحب فكرة الشركة الوقفية للنقل، بالإضافة إلى المركبات الوقفية.<br />ولمن لا يعرف الدكتور مسدور ما عليه إلا أن يكتب اسمه في محرك البحث قوقل، ليكتشف بنفسه صدق المعلومات التي نذكرها، والدكتور أستاذ الاقتصاد بجامعة سعد دحلب بالبليدة الجزائر، وهو ناشط في العمل الخيري وله عدة مشاريع خيرية يطمح إلى تحقيقها إن شاء الله، من بينها مشروع المستشفى الوقفي الخيري للأطفال المصابين بالسرطان، ومركبات كفالة الأيتام، بالإضافة إلى حاضنات ريادة الأعمال الوقفية، وآخر فكرة كانت بنك القرض الحسن...<br />لا تنسونا من دعائكم الصالح"
archived = "2010-03-14"
