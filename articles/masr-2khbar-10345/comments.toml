[[comments]]
order = 2
subject = "ربنا يجلعنا من الامرين بالمعروف والنهين عن المنكر"
author = "بسمة الاسلام"
posted = "2008-11-05"
text = "حقيقى انا مشعارفه اقول ايه الواحد مصدوم من اللى بيحصل فى البلاد الاسلامية حسبى الله ونعم الوكيل,,,الحقيقة ده راجل ديوس ومريض نفسيا الديوس الذى لا يغار على اهل بيته فالنار اولى به ربنا ينتقم منهم ومن امثلهم فهم انجاس لايخافون الله ويتجرؤن على الله بارتكاب هذه المعاصى والفواحش (ربنا لا تؤاخذنا بما فعل السفهاء منا) والله الواحد فى كلام كتير جواه مش عارف يطلعه من الصدمة ,,لاحول ولا قوة الا بالله أنالله وأنا اليه راجعون..........من رأى منكم منكر فليغيره بيده فان لم يستطع فبلسانه فان لم يستطع فبقلبه وهذا اضعف الايمان ..فاضعف الايمان ان الواحد رافض لهذه المعاصى وانه بيحاول يعبر عن رايه بهذه الكلمات البسيطة التى سوف تشهد علينا يوم القيامة"
archived = "2010-03-14"
capture_url = ""
