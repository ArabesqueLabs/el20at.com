subject = "الانحدار الخلقى الذى وصلنا الية بعد تهميش مادة الد"
author = "لا لا"
posted = "2008-10-27"
text = "هؤلاء الناس ليسوا بشر اسوياء او طبيعىين<br />واحد غريب يعاشر زوجتة امامة ويكون راضى فهذا ينتمى لفئة التيوس والخرفان والخنازير<br />اى نوع من البشر هؤلاء<br />لا شعور بالعزة ولا الحمية ولا الغيرة<br />هذا ليس زوج ولكن زوج جزمة البعيد<br />المطلوب التخلص من تلك الجراثيم واعدامهم"
