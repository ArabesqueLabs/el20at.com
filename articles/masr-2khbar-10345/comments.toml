text = "انا مش قادر اصدق ان الحقارة والقذارة توصل للدرجادى خلاص لمجرد ان الزجين زهقوا من بعض يعملوا حفلات جنس جماعى ويتبادلو الزوجات اسوء حاجة البعد عن الدين والتدين."
