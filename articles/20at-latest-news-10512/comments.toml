author = "اكتب اسمك هنا"
posted = "2008-12-14"
text = "مع احترامي للمعلقين<br />فلملاحظ الحقد الدفين والجهل المعتم<br />اما ملكنا خادم الحرمين الشريفين فتعاليت عن الخمر<br />فداك راسي يابو متعب<br />رجل يسهر ويعمل لخدمة الاسلام والمسلمين ولاكن لا حياة لمن تنادي… شوف وش عمل للاخوه الفلسطينيين في مكه ولبنان ولاكن في الاخير منهم من ذهب للرافضه اعداء الامه الاسلاميه<br />والله … والله لن يرفع راية التوحيد لنهوض الا ابناء هاذا الوطن ولا نقول هاذا الكلام من روسنا بل ماورد عن رسول الله صلى الله عليه وسلم… فداك راسي ياخادم الحرمين ."
archived = "2012-04-28"
capture_url = "https://web.archive.org/web/20120428045114/http://www.20at.com:80/20at/latest-news/10512.html"

