text = "ا اخوية الي من الشأم ( والله جبت الديب من ديلوا )<br />(كنا نتمنى فقط أن نرى اللقطة إياها فيديو , لأنه نقلت على الفضائيات الحرة والكأسة غامق اللون , فكيف صار هنا بالصورة الثاتبة أبيض شفاف , أعتقد أن بوش فتح في البيت الأبيض سبيل زمزم .<br />ارى )<br />يا ثور انت شفت الكاس غامق عشين المشلح الي لابسو القصبة لونها دهبي والمشلح اسود يعني حتشوف الكاس نجفة<br />لا حول ولا قوة ال بالله"
