[[comments]]
order = 1
subject = ""
author = "مصري"
posted = "2008-11-16"
text = "السلام عليكم , انا تابعت الخبر بالتلفزيون وشاهدته اكثر من مرة ولكن هناك فرق واضح جدا بين ما فى كاس خادم الحرمين وبوش , كاس خادم الحرمين شفاف المحتوى كالمياة 100% , ومليان على الاخر , لكن كاس بوش او كؤوس الخمرا بتكون غامه شوية وناقصة او نص الكاس تقريبا , والمتابع لللقطة يجد ان الملك عبد الله لم ينتبة فى البداية لمطلب بووش وكأن الوضع جاء عفويا وليس مقصودا على الاطلاق وكان كرد فعل فقط ,<br />انا مصري ولكن احببت ان اوضح هذه النقطة عن خادم الحرمين الذى احبة من كل قلبي , ومثلى الكثيرين , متعه الله بالصحة والعافية"
archived = "2012-04-28"
capture_url = "https://web.archive.org/web/20120428045114/http://www.20at.com:80/20at/latest-news/10512.html"

[[comments]]
