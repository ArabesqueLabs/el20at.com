[[comments]]
order = 4
subject = ""
author = "سؤدد"
posted = "2008-11-17"
text = "يوما بعد يوم يزداد الفخر بقادتنا من محيطه الى خليطه هناك من طأطأ برأسه شامخا على اتفاقية احتلالية وأخر من يطالب بحوار الخرسان(الاديان )وهو لايجيد أية من اي دين ناهيك عن دينه ومن ثم جلس المسكين ليقرع كأسا دون ان يفقه ماذا تعني هذه الحركه؟ واذا قرعت الكؤوس حرم مافيها وان كان محللا! ثم الا من سائل يسأل ماذا جنى الاسلام ليتسكع على ابواب الجريمه طالبا التبييض لصورته؟ وهل هؤلاء هم المعنيون بصورة الاسلام الحقيقية؟ الكثير من الاسئله ولكن,حتى سامها كل مفلس! دعوتي لشبابنا الاعزاء ان يروا المشهد دون تزويق علهم يستطيعوا النهوض يوما ليغيروا ذلك الوافع المرير"
archived = "2012-04-28"
capture_url = "https://web.archive.org/web/20120428045114/http://www.20at.com:80/20at/latest-news/10512.html"

[[comments]]
order = 5
subject = ""
author = "Mennen"
posted = "2008-11-17"
text = "I agree that this cannot be Wine because for those who lived abroad and know the difference between water cups and wine cups, the wine cup has a smaller diameter (is smaller) whearas the water diameter is bigger<br />so obviously, if you take a closer look, the King\\'s cup is the bigger one and that\\'s why it cannot be a wine cup<br />And I understand why this picture has been taken off from tv since Arabs and Muslims more specifically won\\'t necessarily know the difference between the wine cups and water cups.. and thus make a wrong judgment<br />and that\\'s what happened<br />I\\'m not writing this for the sole purpose of defending the King, but it\\'s also not very Islamic of us to care and ask about other people\\'s lives or mistakes..<br />I mean \\\"men hosn islam el mar2, tarkeh ma la ya3nih\\\", right?<br />I\\'m not against the author of this article, but I\\'m just saying that we as Arabs like to pay attention to details that won\\'t help us go forward"
archived = "2012-04-28"
capture_url = "https://web.archive.org/web/20120428045114/http://www.20at.com:80/20at/latest-news/10512.html"

