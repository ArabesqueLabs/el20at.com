text = "لماذا يصرّ البعض على أنّ الكأس مملوءة بالماء لا بالخمر ويعتقدون أن خادم الحرمين لايشرب الخمر وكأنه مثل رعاع القوم(من البشر) الحمير، ياجماعة الملوك ليسوا كالرعاع وليسوا كهذه الأغنام العربية تسبح باسم الله وباسم الحاكم ليل نهار الحكام آلهة ولهم أن يفعلوا ما يشاؤون ((((أصلاً من يتابع فتاوى رجال الدين وكيف يختلفون من دولة إلى أخرى سيدرك أن هذه الأمة تافهة وحقيرة ومنحطة وهذه الأغنام لاينفع معها إلا النيـــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ …"
