posted = "2008-11-17"
text = "هذا الملك الله يخليه لنا يارب<br />والي يشك بهاذا الرجل العضيم فهوا مسكين<br />وبعدبن كاس خادم الحرمين شفاف المحتوى كالمياة 100%<br />لكن كاس بوش او كؤوس الخمرا بتكون غامه<br />بس حسبي الله عليكم يامن تشوهون صورة المسلمين"
archived = "2012-04-28"
capture_url = "https://web.archive.org/web/20120428045114/http://www.20at.com:80/20at/latest-news/10512.html"

