text = "ولزومه ايه من اصله مجلس الشعب<br />المفروض مجلس الشعب هو اللي يقرر كيف ستكون انتخابات رئيس الجمهورية<br />المفروض ان مجلس الشعب يراقب رئيس الجمهورية والحكومة<br />المفروض ان مجلس الشعب بيده قرار عزل رئيس الجمهورية اذا لزم الامر<br />لكن العكس هو الصحيح<br />مجلس الشعب يعمل من تحت جزمه رئيس الجمهورية<br />مجلس الشعب تحت رحمة رئيس الجمهورية<br />يبقى لزمته ايه<br />ايه اللي بيعمله مجلس الشعب<br />ايه هي انجازات مجلس الشعب طالما الحكومة ورئيس الجمهورية بيعملوا اللي هما عايزينه<br />مجلس الشعب دا بقا مجلس مصالح شخصية<br />وانتصارات فرديه وطموحات وانانيه وعالم زباله عايزين يبقى بهوات وبشوات الا من رحم ربي<br />مجلس الشعب ما لهوش دعوة بمصالح الشعب<br />المهم ان اعضاء مجلس الشعب عارفين كل ده لكن بيستعبطوا وبيستهبلوا<br />المهم في الموضوع ان عضو مجلس الشعب يحصل على لقب باشا<br />هو دا المهم والموضوع يطول شرحه"
