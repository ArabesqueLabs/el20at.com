[[comments]]
order = 39
subject = "الثورة اعطت اكثر مما اخذت"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-02"
text = "الكمال للة جل علاة<br />كيف كنتم تتوقعون من الثورة؟<br />الثورة قامت و هذا لا يكمن تجاهلة باى شكل من الاشكال<br />الثورة قضت على و ضع كان قائم<br />الثورة كانت لها من التجارب و الاخطاء<br />و لكن الثورة كان لها من الطيب الكثير ما اعطتة للوطن و الشعب<br />الثورة كانت لها من الاخطاء بقدر ما كان لها من نجاحات و حسنات<br />المحصلة الرئيسة للثورة انه اعطت و اعطت من الكثير؟<br />لكن الشعب للاسف اصبح طماعا و يريد كل شيئ بالمجان و هذة هى حقا (ام الكوارث) مع الاعتذار لصدام حسين رحمة اللة<br />لولا الثورة لما كنا نحن الان نتكلم و نتناقش و نقول ما كنا نريد ان نقولة<br />اعهد الملكى انتهى و عهد رجال الثورة انتهى و يجب ان نعيش الان عهد مصر بما عليها و بما لها؟<br />و كفانا النحيب و البكاء على الماضى !!!<br />نحن الان نعيش عهد جديد عهد اسمة (البقاء و التحدى و الاكتفاء)<br />فدعونا ننتج لناكل بدلا من ان نتكلم و نجوع<br />الثورة اعطت لمصرنا الكثير و لنكن دائما شاكرين؟<br />تقديرنا للثورة بما عليها و بما لهل<br />(الكمال للة و حدة) جل جلالة"
archived = "2010-03-14"
capture_url = ""

