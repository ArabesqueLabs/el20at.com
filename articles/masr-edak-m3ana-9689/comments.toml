text = "الى من يكتب باسم(البابا بندكيت)<br />معالش انا خايف اقولك علشان ما تزعلش؟<br />معلش هى كانت بتروح لراهب اسمة (بحيرة) من مكة؟<br />بس دة كان من زمان قوى قوى قوى؟<br />و عايز تعرف سمونى ايه؟<br />(ما انت عارف انا كان أسمى ايه)<br />و برضة ما تنساش تتفرج على قناة (الحياه) اللى بتتزاع على القمر (هوت بيرد)<br />(ابونا زكريا بطرس) فى انتظارك للشرح و التفسير مستعيا بكتبكم المسروقة و المزوره؟<br />و برضه ما تنساش تبوسلى و تسلملى على ماماااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا و تبوسهالى البوسة اياها؟<br />و برضه بحبك يا اغبى حمار<br />هااااااااااااااااااااااااااااااااااااااااااااااااااااااا هاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا هاااااااااااااااااااااااااااااااااااااااااااااااااااا<br />يا حمار (اللى بيتهم من زجاج لا يجب ان يرموا اسيادهم بالطوب)<br />صحيح اللى اختشوا ماتوا و عجبى عليكم من سعوب متخلفة غبيه جاهلة<br />هداكم و سامحكم الله العلى العظيم"
