text = "الرومان لم يستطيعو القضاء على المسحيين الارئوزوكس لان اللة باركنا و علما التسامح و المحبة و ليس القتل و الارهاب و التخطيط لقلب نظام الحم ايها الغبى الجاهل بالحقائق و التاريخ؟؟؟<br />الحمد للة كئيرا لقد اصبح الومان الان مسحيين و اصبحت الفاتيكان مقرا للكرسى البابوى لجميع دول العالم<br />كنت اتمنى منك الادب و ليست الالفاظ السوقية يا منحط التربية و النشئة و الثقافة و التعليم<br />لع اللة الاخوان المسلمين قتلة المؤمنين العزل من السلاح؟؟؟؟؟"
