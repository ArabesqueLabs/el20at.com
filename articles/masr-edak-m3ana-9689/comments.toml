text = "اعقد انة لعار كبير للكلاب امثالك ان تتكلم و تكتب؟<br />يابنى انت تقول و تكتب عن الدين الاسلامى ظثم تصبغ على نفسك القاب كهنوتية مسيحية؟؟؟<br />الا تعرف معنى ذلك يا حيوان؟؟؟<br />معنى ذلك انك تتجنب ان تقول انك مسلم؟؟؟ياللعار تتبرائى من دينك و عقيدتك لتسبنى و تسب اهل الذمة و اصحاب الانجيل اللذين اوصى بهم رسول اللة(صلعم)بهم خيرا!<br />ياحيوان انك الان ارتديت عن الاسلام و الاسلام منك برئى؟؟؟؟؟<br />, و اعتقد انة لا توجد و ساخة فى هذا العالم مثل الوساخة التى فى عقولكم و قلوبكم ياعضاء الجماعة الموبوئة الحقودة الموتورة الحالمين بحكم مصر يا جماعة يا اغبى خلق حيوانات اللة<br />عندما تتعلمون كيف ترتدو الاحذية ايها المتخلفين الحفاة ابقو تعالو احلموا بحكم مصر يا قتلة و خونة و جبناء<br />و معلش الجعان يحلم بسوق العيش يا روح ماما"
