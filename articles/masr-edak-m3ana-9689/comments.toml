[[comments]]
order = 16
subject = "ما هو اسمك حيى يعرف الشعب كم انت غبى و جاهل و منحط"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-19"
text = "لا يهمنى اذا كنت انا مصرى مسيحى او مسلم ام حتى يهودى<br />الاديان كلها من عند اللة<br />المهم ان اكون مخلص للوطن وهذا اهم شيئ عندى<br />اما الاخوان المسلمين من و خهة نظرى الشخصية فهم حقا الحثالة التى تنخر فى جزور هذا الوطن ليس الختلافا مع النظام و الشرعية ؟انهم عبدة الشيطان و الدمار و التخلف يستترون تحت عبائة الدين والتخلف و القتل و الاغتيالاتو التصفيات الجسدية؟<br />اين شجاعتك الادبية لاخفاء اسمك؟هل اسمك و العياذ للة عورة تخاف ان يروة البشر و يعرفو انك عورة من عورات الانسانية يجب التخلص منك بافكارك المتخلفة المريضة<br />الاخوان المسلمين ما هم الا افة تنخر فى المجتمع تريد للجميع الخراب ؟للجميع<br />الخراب للمسلمين قبا المسحيين<br />و الخراب للمسحيين قبل اليهود<br />و الخراب للجميع من اجل العودة بالوطن الى تخلف الماضى المظلم<br />الاخوان المسلمين ما هم الا جماعة ليست بمحظورة بل انها جماعة موبوئة مريضة مضللة خربة موتورة حاقدة تتاجر بالدين و تستخدم الدين لغسيل عقول الجهلة الاغبياء انصاف المتعلمين امثالك ايها المسكين ربيب القتلة المتحجرين المتخلفين مدعى الايمان و الصلاح و التقوى و الايمان؟؟؟<br />كفى هراء يا عديم الاسم و الصفة والاعتبار يا صاحب العورة المكشوفة<br />(الاخوان المسلمين تنبح و مصر الوطن تسير الى المستقبل)<br />المستقبل للحق و ليس لهذة الجماعة الموبوئة المتخلفة المحظورة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 17
subject = "للاسف ليت جماعتكم المحظورة المتخلفة الموبوئة القذر"
author = "ممدوح زكى زخارى _الاسكندرية-مص"
posted = "2008-08-19"
text = "هل لو كنتم قد ظهرت جماعتكم الموبوئة فى عهدهتلر؟<br />هل كانت لكم الان اية جذور؟<br />انتم جماعة تحتاجون الى الحديد و النار و لو كان الامر بيدى حقا لكنت قد دفنتكم احياء فى قبور من الجير الحى الحارق؟<br />حيث انكم امراض قاتلة فتاكة اشد فتكا و قتلا و انتشارا اسواء من الطاعون<br />لا تطيح بعقولكم الخربة و الصدئة احلام اليقظة من انكم سوف قد يحالفكم الحظ بحكم مصر يوما من الايام؟<br />مصر لديها الشرعية و الثبات لمواجهتكم و القضاء عليكم بالقانون ايها القتلة المتخلفين عبد الدمار و التخلف و الشيطان<br />(استغفروا اللة و سماحتة و سماحتة) ان اللة غفور رحيم<br />سامحكم و سامحنا اللة فى حق ما اقترفنا من جرم فى حق و طننا الواحد مصر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 18
subject = "احبو اعدائكم يا زخاري"
posted = "2008-08-19"
text = "سمعتم انه قيل عين بعين وسن بسن. واما انا فاقول لكم لا تقاوموا الشر. بل من لطمك على خدك الايمن فحوّل له الآخر ايضا. ومن اراد ان يخاصمك وياخذ ثوبك فاترك له الرداء ايضا. ومن سخرك ميلا واحدا فاذهب معه اثنين. من سألك فاعطه. ومن اراد ان يقترض منك فلا ترده<br />سمعتم انه قيل تحب قريبك وتبغض عدوك. واما انا فاقول لكم احبوا اعداءكم. باركوا لاعنيكم. احسنوا الى مبغضيكم. وصلّوا لاجل الذين يسيئون اليكم ويطردونكم. لكي تكونوا ابناء ابيكم الذي في السموات. فانه يشرق شمسه على الاشرار والصالحين ويمطر على الابرار والظالمين. لانه ان احببتم الذين يحبونكم فاي اجر لكم. اليس العشارون ايضا يفعلون ذلك. وان سلمتم على اخوتكم فقط فاي فضل تصنعون. أليس العشارون ايضا يفعلون هكذا. فكونوا انتم كاملين كما ان اباكم الذي في السموات هو كامل"
archived = "2010-03-14"
capture_url = ""

