text = "بعض القذرة ممن ينتسبوا للاخوان الجبناء يهاجمون رمز الحرية والتقدم ورمز شرف مصر ابن مصر العربى الاول جمال عبد الناصر<br />ماذا صنع الاخوان الصغار للاسلام و ماذا صنع ادعياء الدين الجهلة غير القتل والاغتيالات ؟<br />عبد الناصر نشر المعاهد الازهريةعبد الناصر بنى اذاعة القرأن الكريم واوصل صوت التفسير الى كل قرية فى مصر<br />عبد الناصر طور الازهر ليصبح الداعية طبيب كما يفعل الاروبيين فى بعثات التبشير فى مجاهل افريقيا<br />عبد الناصر جعل الشعب الحافى يلبس احذية<br />لافضل للاخوان<br />الفضل الحالى للتدين هم الجماعات الاسلامية<br />وكلاب طلاب السلطة هم الاخوان"
