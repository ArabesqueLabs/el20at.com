subject = "انتهت الثورة فى 1975"
author = "العمى عمى القلب"
posted = "2008-07-25"
text = "الاغبياء الذين يظنون اننا نعيش الثورة الان مضللين -- الثورة انتهت سنة 75 بعد حرب اكتوبر وقول السادات ان 95 % من اوراق اللعبة مع الامريكان نحن نعيش العصر الرأسمالى الامريكى منذ الانفتاح الاول للسادات<br />الثورة نظام اشتراكى تعاونى مبنى على مبدأ الكفاية والعدل وتكافؤ الفرص بين الافراد<br />نحن فى عصر الشركات متعددة الجنسية التى تستولى على الغاز المصرى وتصدرة الى اسرائيل<br />نحن تحكمنا السفارة الامريكية بواسطة السكرتير الثالث لها<br />فى الثورة المصانع ملك الدولة وليس هناك محتكر اسمة احمد عز<br />الثورة انتهت من زمان قوى<br />انتم لسة فاكرين<br />ثورة اية<br />عيب الثورة انها كانت ثورة بيضاء مفيش فيها دماء فرجع الرأسماليين والاقطاع مرة اخرى<br />الثورة القادمة سوف يتم اعدام جميع الخونة ومعذبى الشعب امثال مباحث امن الدولة والاخوان واعضاء الوطنى<br />لا بد من اعدامات ودماء وتطهير فى البلد<br />ولعل الثورة قريبة جدا"
archived = "2010-03-14"
capture_url = ""

