subject = "القس المشلوح زكريا بطرس"
author = "الام تريزا"
posted = "2008-09-06"
text = "يا زخاري انت عمال تقولي الجماعة المحظورة<br />طيب يا زخاري ما هو القس زكريا دا مشلوح من الكنيسة ايضا ومحظور<br />انت بتسمعلوا ليه اهو دا زي الجماعة المحضورة بامر من الكنيسة المصرية شلحوه من الكنيسة<br />غلط تسمعله لان كل كلامه كذب في كذب<br />وبعدين يا زخاري النبي محمد صلى الله عليه وسلم يتخلص في الاتي<br />لازم تقرأ عن حال الجزيرة العربية قبل الاسلام<br />وبعدين تقرا عن 23 سنه مدة السيرة النبوية<br />وبعدين تشوف ازاي غير النبي محمد صلى الله عليه وسلم اهل الجزيرة العربية وجعلها مهيئه لغزو العالم كله<br />وبعد وفاة النبي محمد صلى الله عليه وسلم وفي اقل من 100 عام كانت الدولة العربية من اسبانيا الى الهند<br />وفي السكه هزموا الفرس والروم<br />هو دا النبي محمد وتلامذته<br />وفي علامه فارقة في حياة النبي محمد واتباعه تتمثل في غزوة بدر وغزوة احد لتصبح قانون<br />المسلمين فازوا في غزوة بدر لما اطاعوا النبي محمد صلى الله عليه وسلم<br />واتهزموا في غزوة احد لما خالقوا النبي محمد صلى الله عليه وسلم<br />فالمسلمون ينتصرون بطاعة النبي وينهزمون بمعصية النبي صلوات الله وسلامه عليه<br />وحالة المسلمين اللي انت شايفها الان من هزائم ونكبات لم تحدث الا بعد ان خالف المسلمين نبيهم<br />وصدق من قال نحن قوما اعزنا الله بالاسلام<br />فلما ابتغينا العزة في غيره<br />اذلنا الله<br />وخلاصة الكلام يا زخاري طالما انت ما بتحبش الاخوان المسلمين لانها جماعة محضورة كان يجب عليك ان تبتعد ان زكريابطرس لانه محظور ايضا من الكنيسة ومشلوح منها"
archived = "2010-03-14"
