[[comments]]
order = 56
subject = "معسكرات الإخوان.. السرية"
posted = "2008-09-06"
text = "معسكرات الإخوان.. السرية!<br />أحمد البهنساوي - ولاد البلد:<br />طرقات شديدة على الباب وأصوات مرتفعة توحي بأن صاحبها شرطي...قادة \\\"الرهوط\\\" المقسمة داخل حجرات الشقة كانوا يعرفون طبيعتها إنها.. كبسة الحكومة \\\"المصطنعة\\\" التي تقيس مدى قوة أعصاب شباب الإخوان واستجاباتهم في المواقف الحرجة.<br />كل قائد جاهز لدوره.. التزموا الاستغفار يا إخوانا.. كل واحد يناجي ربه بأحب أعماله الصالحة.. تذكروا أصحاب الصخرة.<br />فجأة يفقد أحد الرهوط أعصابه ويتبارى أعضاؤه في القفز من الشباك، كان سقوطهم متتابعا مما لفت انتباه البوابين في المنطقة فامسكوا بهم علي اعتبار أنهم حرامية وطلبوا البوليس.. هوب جاءت الدورية الراكبة وصعدت إلى الشقة بلهفة شديدة.<br />وفي أحد الحجرات كان هناك رهط لم ينتبه لما يدور حوله واستغرق أفراده في الأذكار والتسبيح.. ومن ثقب الباب نظر قائد الرهط فوجد الموضوع قلب جد والعفريت حضر فهتف.. اتركوا الاستغفار وسريعا إلى الشباك!!.<br />الذراع.. الثقيلة<br />ما حدث لم يكن مشهدا من أحد الأفلام التي تتناول الإخوان المسلمين إنما مشهد حقيقي.. مشهد مأساوي من أحد المعسكرات التي دأب الإخوان على إقامتها على مر تاريخهم والتي تعد من أهم وسائلهم التربوية، وهى في مجملها أنشطة شبابية أفرد لها الإمام حسن البنا منذ قيام الدعوة أقساما خاصة تتبعه مباشرة، وكان يخرج في معسكرات وجولات الكشافة مرتديا الزى الرياضي محفزا الشباب على ممارسة هذا السلوك حتى يستكملوا عناصر التربية لاسيما حول قيم الجندية والسمع والطاعة.<br />وفي هذه المعسكرات يتم صنع مواقف حركية ميدانية يتم فيها قياس مدى انصياع الفرد وولاؤه، بالإضافة إلى بعض المناهج التي تناقش بعض القضايا الهامة والمطروحة على أجندة الجماعة المركزية مثل الايجابية والطاعة. أو قضايا أخرى عارضه يتم طرحها عن طريق محاضرات أو ورش عمل تتخلل برنامج المعسكر.<br />هذه المعسكرات كان من ضمن مهامها في الماضي جذب بعض العناصر الصالحة للالتحاق بالتنظيم الخاص الذي كان يمثل الذراع الثقيلة التي يشهرها الإخوان في وجه أعداءهم، وضم التنظيم الخاص بين صفوفه العديد من قيادات الجماعة منهم المرشد الحالي مهدي عاكف.<br />المعسكرات.. البديلة<br />إذا كانت المعسكرات الإخوانية في السابق تقام في مخيمات ومعسكرات صحراوية لغرس معاني الجهاد.. فهل معسكرات \\\"الشقق\\\" التي اضطرت لها الجماعة بفعل الضربات الإمنية تقوم بنفس الدور في الوقت الحاضر.. وهل لازالت على عهدها في إنتاج الفرد الطيع للقيادة الصلب أمام الدولة ؟..وماذا استجد في برامجها؟ وكيف يرصدها الأمن..<br />أسئلة شائكة لموضوع لم يتم تناوله من قبل للحظر المفروض عليه سواء من قبل الإخوان، الذين لا يريدون أن يكشفوا كل أوراقهم، أو حتى من جانب قيادات الأمن التي ترفض دوما الإفصاح عن أساليب كشفها لتلك المعسكرات، التي ترى أنها معسكرات تخريبية خاصة إنهم ألقوا القبض على 7 معسكرات في هذا الصيف.<br />ورغم ذلك اخترقنا هذا السياج الأمني الإخواني لنضع أمام الناس ما يخفيه الإخوان ويترصده الأمن.<br />ساعة معينة.. في توقيت معين!!<br />توجهنا إلى أحد الشباب المنتمي للإخوان ممن حضروا أحد معسكرات الجماعة هذا العام لكي يقص علينا تجربته.. طلب منى أن أمهله حتى يستأذن من قياداته المباشرة.. عاد بالموافقة مشترطا عدم الدخول في تفاصيل الأسماء والأماكن والتواريخ لأسباب يعرفها الجميع جيدا.<br />بدأ يسرد تفاصيل المعسكر منذ أن جاءته وصية من \\\"إخوانه\\\" بأن يتواجد في ساعة معينة في مكان معين حيث سينتظره شخص ما ليدله على مكان المعسكر الذي أتضح أنه في أحد الشقق بأحد المناطق النائية عن عيون الأمن!!<br />كانوا صائمين فبدأ البرنامج بأذكار المساء فالإفطار ثم حلقة تعارف بين أعضاء المعسكر ليتعرف من جاء لأول مرة على الباقين. بعدها صلينا العشاء وأوضح لنا قائد المعسكر الأهداف المرجو تحقيقها وتلخصت في السمع والطاعة وختم القران الكريم كله في فترة المعسكر.<br />ثم بدأنا بتلاوة أول أجزاء القرآن وبعدها نمنا واستيقظنا قبيل الفجر لنصلى قيام الليل حتى أذان الفجر وصلينا الصبح ثم تلونا أذكار الصباح وسبقها خاطرة ألقاها أحد الإخوة ثم أدينا بعض التمارين الرياضية واستأنفنا قراءة القران حتى طلوع الشمس وصلينا ركعتي الضحى لتكتب لنا اجر حجة وعمرة تامتين، كما نوه الحديث النبوي، ثم نمنا واستيقظنا لتناول طعام الإفطار واستئناف رحلة التلاوة كل أخ بمفرده حتى آذان الظهر.<br />واستمعنا لخاطرة أخرى لنستمع بعد ذلك إلى خاطرة عقب كل صلاة، والخاطرة تتناول جانب روحاني معين للمسلم، بعدها قرأنا القران ونمنا إلى قبيل العصر لنستيقظ حيث حان الغذاء الذي يحتوى على نفس أنواع الأطعمة التي تناولناها في الإفطار وأيضا في العشاء لتعويد الأخ على الصبر وروح الجهاد.<br />ثم صلاة العصر ومدارسة حول بعض المعاني وتلاوة أذكار المساء وورد الرابطة فصلاة المغرب واستمرار الرحلة القرآنية حتى العشاء ثم تناول العشاء والنوم للاستيقاظ لصلاة القيام والفجر وهكذا طيلة أيام المعسكر حتى ينتهي المعسكر بكتابة الايجابيات والسلبيات للاسترشاد بها في المرات القادمة.<br />كان المسئول عن المعسكر حازما حريصا على بث معاني المعسكر وتعزير \\\"عقاب\\\" المقصرين بالوقوف أحيانا أو بممارسة أي تمرين رياضي مع التذكير بضرورة اصطحاب نية الجهاد والمرابطة.<br />معسكر.. لأمن الدولة<br />المهندس أبو العلا ماضي الإخوان السابق ومؤسس حزب الوسط، وأحد نجوم المعسكرات الإخوانية من السبعينات إلى منتصف التسعينات، يؤكد أن المعسكرات وسيلة تربوية مهمة في إعداد وتغيير الشخصية وسلوكها وإحداث تجانس مع المجموعة التي يعمل فيها الفرد، وأيضا من حيث توصيل الأفكار التي يريد كل قطاع توصيلها من خلال تلك المعسكرات.<br />بل ويجزم أن هذه المعسكرات كانت السبب الرئيسي في التزامه ومواظبته على تلاوة القرآن وصلاة الفجر والدفاع عن الفكرة التي اعتنقها مع إخوانه في ذلك الوقت، وأشار ماضي إلى المضايقات الأمنية التي تعرض لها خلال تلك المعسكرات لأن الجماعة كانت ومازالت في عين القانون محظورة.<br />ويضيف أبو العلا ماضي قائلا: \\\"حصل أن كبست علينا قوات الأمن مرتين في الإسكندرية لكن ربنا نجانا حيث هربنا جميعا من المعسكر لتجد قوات الأمن مقر المعسكر خاويا من الإخوان. والمرة الثالثة كانت الأغرب ولكن المعسكر كان في رأس البر ويضم عددا من قيادات النقابات المهنية الإخوانية على رأسهم المنشق عن الإخوان مؤخرا مختار نوح والغريب في هذه المرة أن قوات الأمن حضرت المعسكر من أوله لأخره\\\"!!<br />ويرى أبو العلا أن المعسكرات في الماضي كانت تركز على الجانب التربوي والسلوكي أما الآن فتهتم بالجانب الفكري والحركي مشيرا إلى أن معسكرات الشقق السكنية ليس لها قيمة ولا تحقق أهدافها.!!<br />معسكرات.. مشبوهة<br />اللواء فؤاد علام نائب رئيس جهاز مباحث أمن الدولة الأسبق أكد أن هذه المعسكرات هي معسكرات مشبوهة لجماعة محظورة، والمقصود منها التجنيد وعمل تدريبات عسكرية من الممكن أن تستخدم في أعمال غير مشروعة بما فيها الانقلاب على نظام الحكم، مشيرا إلى أن تلك المعسكرات جزء من عمل التنظيم الخاص.<br />وعندما قلت له أن التنظيم الخاص انتهى والجماعة تقول أن التنظيم الخاص تم إنشاؤه لمقاومة<br />الاحتلال، رد قائلا: \\\"وكانت النتيجة إيه..عملوا ايه.. قتلوا النقراشي والخازندار وفجروا السينمات وحاولوا قتل النحاس وعبد الناصر وعملوا انقلاب في اليمن.. كل ده من التنظيم الخاص.<br />ونفى علام أن تكون أجهزة الأمن تتبع لعبة القط والفار مع الإخوان مؤكدا أنه يتم القبض على أي معسكر تتوافر عنه معلومات، قائلا: \\\"أي جماعة غير مشروعة وأي نشاط غير قانوني الأمن لازم يأخد منه موقف، مفيش حاجه اسمها لعبة القط والفأر\\\".<br />وأضاف فؤاد علام أن أحد طرق كشف تلك المعسكرات هي \\\"الموبايلات\\\" رافضا التوضيح.!! وفي نهاية كلامه أشار علام أن الجماعة ومعسكراتها كالموجة أوقات في صعود وأخرى في هبوط مشيرا إلى أن أنشط أوقات هذه المعسكرات كان في الأربعينات ثم انحسرت بشدة أيام عبد الناصر ثم بدأ النشاط مرة أخرى بعد أن جاء السادات. ومنذ اغتياله ومجيء نظام مبارك والجماعة تمر بمرحلة هبوط!!<br />قاتل.. السنانيري<br />في النهاية لا يمكن أن يسدل الستار دون اللجوء إلى أحد قيادات جماعة الإخوان المسلمين.. النائب الأول للمرشد العام للإخوان المسلمين د. محمد حبيب ذهبنا إليه وطرحنا أمامه كل ما سبق ليكتب بنفسه مشهد النهاية ويضع النقاط فوق الحروف.<br />بدأ حبيب كلامه قائلا: \\\"المسألة بيننا وبين الخصوم هي معلومات، فلا يجب كشف كل الأوراق. وكل ما أود قوله في هذا الموضوع أنها ليست معسكرات ولا تدريبات عسكرية ولا يحزنون.. ولكنها أشبه بالمخيمات التي ينتهز الشباب فيها فترة الصيف ليقضوا مصيفا أو فترة راحة ولكن في ظل رضا الله وعدم فعل شيء يغضبه\\\"!!.<br />ونفى نائب المرشد أن تكون برامج هذه المعسكرات أو المخيمات كما يقول أبو العلا قد تغيرت مناهجها من تربوية إلى حركية مؤكدا أنها منذ بدايتها وحتى الآن تعتمد على الجانب التربوي، وعندما واجهناه بكلام اللواء فؤاد علام نفى كل ما قاله من أنها معسكرات تعد لعمليات انقلاب.<br />وراح يتكلم على الطريقة التي تحدث بها علام عن الجماعة قائلا: \\\"فؤاد علام يكفيه أنه قتل الشهيد كمال السنانيري عام 81.. ويكفيه أن يداه ملوثتان بدماء الإخوان.. ويكفيه الآلام والآهات التي صدرت نتيجة تعذيبهم أثناء فترة تولية منصب نائب رئيس مباحث أمن الدولة كأحد الأعمدة الرئيسية لمحاربة الإخوان\\\"."
