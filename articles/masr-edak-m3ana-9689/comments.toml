posted = "2008-08-20"
text = "ارجو عدم الزج بالدين ؟<br />انا اناقش الامور الدنيوية و الوطنية ايضا<br />احب و طنى و احترم الدستور و القانون و الشرعية<br />اما ان اتمسح بالدين او بكلمات الدين مستغلا الحق الذى باطنة باطل فانتم حقيقة جماعة تستحقون الرثاء لحالكم المشين<br />انا من لا يخافون المجاهرة باننى غير متدين ؟ انا اولا اضع اللة فى قلبى و الوطن فى عينى<br />واحترم الدستور و القانون و الذين اصبحوا يجروا فى دمائى"
