text = "سيدى الفاضل<br />ليكن فى معلومك جيدا اننى لا اسيىء الى المسيحية او اى دين اخر؟<br />اننى اكن من الاحترام الكثير لكافة الاديان السماوية (اليهودية و المسيحية و الاسلام)<br />كيف لكم حقا ان تتهمونى بالاساءة الى المسيحية<br />اننى كنت انتقد و اهاجم شخص موتور من النظام من الجماعة اباهم (اللى بالى بالك)اعضاء الجماعة اياها؟؟؟؟؟؟(الجماعة الموبوئة) اقصد الجماعة المحظورة و التى تسمى (الاخوان المسلمون) و الاسلام منها براء؟!<br />حب الوطن من حب اللة<br />و حب اللة من حب الدين<br />و حب الدين هو حب اللة و حب الوطن ايضا<br />لهذا فانا احب اللة و احب الوطن و احب الدين<br />احب ذلك الثالوس المقدس"
