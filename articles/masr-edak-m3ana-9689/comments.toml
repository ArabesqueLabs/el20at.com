subject = "هزيمة 67 هى خسارة معركة وليست خسارة الحرب يا جهلة"
author = "برضة هو بسحنتة الغبية"
posted = "2008-07-24"
text = "الانجليز فى الحرب العالمية الثانية انضربوا من الالمان ضربا مبرحا وانهزموا هزيمة منكرة ومات اكثر من 50 الف بريطانى فى غارات مكثفة من الالمان فى معركة دنكرك وخرج تشرشل على البريطانيين قائلا - لقد خسرنا معولركة ولكننا لم نخسر الحرب<br />- الرسول علية السلام هزم فى غزوة احد وغزوة حنين<br />عبد النااصر قال لقد خسرنا معركة ولم نخسر الحرب<br />وانتصرنا فى حرب الاستنزاف وحرب العبور واكتوبر<br />اما الاخوان بتوع حلل الفتة والحضرة الشريفة والجلباب القصير والامراض النفسية واصحاب النظرية الغبية انهم على حق وغيرهم على باطل فمالهم والقتال -<br />انا انصح الحكومة المصرية بعرض الاخوان على مستشفيات الطب النفسى وليس وضعهم فى السجون<br />كلهم عقد وامراض نفسية<br />واللة المستعان"
archived = "2010-03-14"
capture_url = ""

