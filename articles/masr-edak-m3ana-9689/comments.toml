text = "ياهلالالالالالالالالالالالا بالمعارك<br />زخارى لا يخاف من الشرزمة القذرة الموبوئة و المسماة ب(الاخوان المسلمين)<br />من اين لهذة الجماعة الموبوئة بالاحذية؟اليست هى جماعة متخلفة حافية قذرة؟من اين لها بالاحذية؟؟؟؟؟<br />زخارى لا يهرب لا يهرب لا يهرب<br />اما انتم ايها الجبناء فالهروب عندكم ما اسهلة ايها الفئران الى الجبال و الجحور مثل افغانستان و الصحارى المقفهرة المتخلفة ايها الجهلة القتلة الموبوئة؟؟؟؟؟<br />استحوا استحوا استحوا<br />و استروا عوراتكم و رائحتكم القذرة النتنة<br />و لنا لقاء قريب يا ننوس عين ماماااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا"
