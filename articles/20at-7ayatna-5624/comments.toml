posted = "2007-04-30"
text = "الحديقة فعلا جميلة و أنا زرتها قبل كده و أنا فى مراكش بس فى اماكن كتير فى المغرب طبيعية فى منتهى الجمال بعيد عن الحديقة دي زى مدينة مولاى يعقوب أو الجبال حوالين مدينة فاس و مكناس<br />المغرب فعلا مش من الدول إللى بتروج لنفسها سياحيا بشكل جيد خصوصا فى الدول العربية رغم إن الطبيعة عندهم رائعة ، أتمنى إنى أزورها تانى فى يوم من الأيام و إنهم يحافظوا على بلدهم و طبيعتها بدون ما يغيروا فيها حاجة<br />أخوكم محمد من مصر"
