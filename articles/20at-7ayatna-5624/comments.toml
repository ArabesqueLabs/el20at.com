text = "لابد من الاشارة اولا ان الكتابة شبابية عشريناتية في بعض الاحيان وصحفية في احيان كثيرة ولكن المهم هو مزج الاثنين ليعطي موضوع صحفي ملفوف بصبغة عشريناتية .ولكن ليس المرء في البداية يصيب . على فكرة الصواب موجود 90في المائة واترك 10في المائة للممارسة والمداومة.<br />اخي حسين كول لي بعدة خرجتي بلا ماتكولها لي.<br />تحياتي"
