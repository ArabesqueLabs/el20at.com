subject = "يا جماعة دى اصول التنمية الحقيقية"
author = "اكتب اسمك هنا"
posted = "2009-03-18"
text = "هى التنمية كدة<br />الشباب ينام على الارصفة وفى البرد مستنى شغلانة ليوم واحد<br />يقوم عظمة يجمد ويتودك ويبقى جامد ويبقى راجل منتج لما يبقى عمرة 70 سنة لما يلاقى شغلانة<br />اما عائلات العيال دى فممكن ياكلوا جاتوة او بسكوت او شيكلاتة ويشربوا ازوزة<br />هى دى اللى عملتة النمور الاسيوية<br />احة يا مصر"
