author = "متنيل بستين نيلة"
posted = "2009-08-10"
text = "ايه نبعتها لجمال<br />بصفته ايه ابن الرئيس؟<br />طيب ما نبعت كمان لخالد جمال عبد الناصر وجمال السادات<br />بكرة يذيعو اغاني عبد الحليم اللي كان بقول فيها يا جمال يا حبيب الملايين<br />بطلوا بقى يا ولاد تييييييييييييييييييييييييييييييييييييييييييييييييييييت قرفتونا<br />وزهقتونا وماشفناش في حكمكم يوم عدل<br />انا مش عارف ربنا ما بيستجابش لدعانا عليكم ليه<br />حاسس اننا بقينا شعب ظالم حتى لنفسة عشان كده ربنا ما بيستجاب لدعانا<br />حد يشتري جنسيتي ياجدعان<br />خلاص ماعدتش عايز ابقى مصري"
archived = "2010-03-14"
