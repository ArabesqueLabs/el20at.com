text = "إن محمد علي إبراهيم يكتب بوقاحة وانحطاط في صحيفة يملكها شعبنا ، و لم يسلم منه أحد من المناضلين و المقاومين و الشرفاء . و لو عددنا له سقطاته العديدة اليوم بعد توليه منصبه الخطير هذا بما يقارب السنوات الأربع اليوم ، لصنفنا مجلدات . و لو استخرجنا السم الزعاف الذى تقاطر به لسانه على المقال الأسبوعى طوال هذه السنوات العجاف ، لأصبحت لدينا كمية تكفى لتسميم من فى الأرض جميعا ."
