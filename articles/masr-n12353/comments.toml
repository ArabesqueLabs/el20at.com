text = "إبراهيم السايح يتحدث عن هجوم هذا الـ (....) على جريدة الفجر ، فى بداياته ، فماذا لو قرأ له اليوم و هو يردح يمنة و يسارا ، و يعانى من سلاطة لسان سترديه فى النهاية ، فتارة يسب و يتواقح على هيكل و تارة أخرى يتكلم بانحطاط عن ناصر ، و ثالثة يطلق نباحه على سوريا أو إيران أو حماس أو حزب الله ، و حتى قضاة مصر الشرفاء لم يسلموا من لسانه و افتراءاته . ماذا كان سيقول فيه و هو الذى وصفه بالنفاق فقط لأنه هاجم جريدة الفجر فماذا سيكون رأيه اليوم ؟!"
