[[comments]]
order = 0
subject = "رؤساء تحرير الجمهوريه مقلب زباله"
author = "خالدالأمير"
text = "طول عمر الجمهوريه كده مقلب زباله ورؤساء تحررها كده بيحبوا الحكومه والدفاع عنها عليالفضي والملبان وكانهم ورثوا الجرنال عن ابائهم وانهم قاعدين فيه لم يعملوا كده شالوا سمير جابوا ابو الحدي وابراهيم وما اسخم منرجب ال ابراهيم وكلهم كده منافين زي ما قال السايح والجريده طول عمره عباره عن جرديه للمجاري ومقلب قمامه زي ماقال استاذنا مجدي مهنا"
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110195804/http://masr.20at.com:80/newArticle.php?sid=12353"

[[comments]]
order = 1
subject = "مش معنا هو"
author = "بسطويسى"
text = "الراجل حقق 146 مليون خسائر فى سنتين<br />يبقى راجل ناجح عند اللى عينوا اهلة<br />فية كبار حققوا خسائر للبلد بضياع جيلين من الشباب او ثلاثة اجيال قضوا عمرهم يتسكعون على المقاهى<br />وبعدين جمهورية اية ومين اللى بيقراها ويقرا فيها اية<br />شدوا الستارة او شدوا السيفون<br />كل حاجة فى البلد دى بقت خرة"
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110195804/http://masr.20at.com:80/newArticle.php?sid=12353"

[[comments]]
order = 2
subject = "عصر الفاشلين"
author = "مصرى"
text = "بصراحة وضع البلد غريب الفاشل اللى بيسرق هو اللى له كلمة مسموعة الشريف اللى بيحارب الفساد بيتعرض للسجن كلنا شايفين ابراهيم عيسى و عبد الحليم قنديل و آخرون الظاهر الوطنية أصبحت جريمة 0 جميع رؤساء تحرير الصحف الحكومية كلنا عارفين هم ليه فى المناصب دى رغم انهم بصراحة مفيش عندهم حاجة من الصحافة مش بأقول لكم ده عصر الرويبضه هو ده عصر الرويبضه"
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110195804/http://masr.20at.com:80/newArticle.php?sid=12353"

[[comments]]
order = 3
subject = "مش كده وبس"
author = "Shady Elkhateeb"
text = "ده كل اسبوع متخصص مقاله الاسبوعى فى الهجوم على حاجة من الاتنين<br />اما الاخوان المسلمين او الجرايد المستقله وخصوصا الدستور وابراهيم عيسى<br />وكل مايروح سفرية رئاسية يفضل يتغزل فى الحريم اللى شافهم هناك والمزز اللى فى البلد دى وحتى المزيعات اللى جايين معاه<br />واليومين دول متخصص فى الهجوم على الاستاذ/ محمد حسين هيكل<br />ابن امبارح مش عاجبه هيكل؟<br />مع انه ياجماعة والله الواحد افتكره اول ماجه راجل محترم لما كان بيتكلم بشكل معتدل وموضوعى<br />لكن دوام الحال من المحال"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113111957/http://masr.20at.com:80/newArticle.php?sid=12353"

[[comments]]
order = 4
subject = "أستغفر الله العظيم"
author = "أبو البنات"
text = "فيه أسماء كدة كل ماتيجي سيرتها أفتكر سؤال بنتي الصغيرة ..هوليه يابابا ربنا خلق الصراصير بالرغم إنها حاجة مقرفة؟؟<br />....أستغفر الله العظيم"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113111957/http://masr.20at.com:80/newArticle.php?sid=12353"

