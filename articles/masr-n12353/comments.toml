[[comments]]
order = 8
subject = "إنفراد: محمد على إبراهيم رئيس تحرير الجمهورية يسطو"
author = "محمد عصمت البطل كاتب وصحفى مصر"
posted = "2008-12-15"
text = "عام كامل من المحاولات الجاهدة لنشر الكلمات القادمة....عام من المداولات مع رؤساء تحرير صحف مصرية .....عام مع من يدعون الرغبة في حرية الصحافة والتخلص من براثنها وأهوائها وبعض أقلامها المكسورة...عام والنتيجة أن المصالح والعلاقات حالت أن تُنشر هذه الكلمات....لكن بعدما فرغ صبري....تأكد لى أن مهنة الصحافة في مصر تحتاج إلى ثورة تصحيح حتى تؤدى دورها الحقيقي...تحتاج إلى عقول وأقلام جديدة لا تُهيمن ولا تُسيًَر ...تعمل من أجل مصر وأبناءها ...لا من أجل مصالح أفراد أو جماعات أو دول ...من أجل سياسيون أو رجال أعمال أو معونات خارجية ...دعوة إلى كل زملاءى لتطهير الأيادي والأقلام ومراعاة الله في الكلمة التي ستقف أمامنا يوم القيامة شاهدة ووكيلة ...دعوة إلى كل من يقتبسون من الآخرين وينسبون لأنفسهم بهتاناً وزوراً ....ودعوة إلى قراءة هذه الكلمات...<br />منذ عام وقبيل المؤتمر العام للحزب الوطني الرابع بيومين تلقيت ورقتين تحويان مقالتين نشرتا في صحيفتي الجمهورية والأخبار....الورقة الأولى تحمل صورة ضوئية لمقالاًً للدكتور إسماعيل عبد الجليل الممثل الزراعي الحالي في السفارة المصرية بالولايات المتحدة الأمريكية ورئيس مركز بحوث الصحراء آنذاك ...وهو مقالاً نشر في جريدة الأخبار في عددها الصادر يوم السبت الموافق 15 من شوال 1428هجرياً --27من أكتوبر 2007 فى صفحة قضايا وأراء تحت عنوان بلدنا بتتقدم بينا ....بينما حملت الورقة الثانية صورة ضوئية لمقالاً لرئيس تحرير صحيفة الجمهورية الأستاذ محمد على إبراهيم تحت عنوان الحزب الوطني الواقعي ..والفقراء (4)..متى تلغى الحكومة الدعم ؟ وكيف يشعر به المواطن ؟ ... وهو مقال ضمن مقالات رئيس التحرير في الصفحة الثالثة بجريدة الجمهورية المعنونة بـمصر المستقبل والمنشور في عددها الصادر يوم الثلاثاء 18 من شوال 1428هـ - 30 من أكتوبر 2007<br />وقد يبدو أن هاتين الورقتين للوهلة الأولى وقبل النظر في سطورهما والإمعان في تفاصيلهما مجرد مقالتين للرأي ...إلا أن التدقيق فيهما يكشف مفاجأة من العيار الثقيل ....الورقتان تحملان مقالتين التصق فيهما التطابق الفكري بين كاتبي المقال...المقالتين تتحولان تدريجياً اقتباساً لبعض المصطلحات الدراجة أو أحياناً المستحدثة....القارئ سيكتشف تطابق وحدة الموضوع ووحدة الأفكار في المقالتين وكأن الكاتبين قد توحدا شعورياً وعقلياً لحظة الإبداع فأنتجوا مقالتين بروح واحدة تأخر الكاتب الثاني فى نشرها عن الكاتب الأول بثلاث أيام....ثم لا يلبث القارئ للمقالين أن يكتشف تطابق شبه كامل في جمل وعبارات ثم بالإستمرار فى التدقيق يستخرج جمل وعبارات منقولة بالنص وكأن كاتب المقال الثاني قد أخذ من كاتب المقال الأول عباراته ليضعها في مقالته وينسبها لنفسه....<br />عقب هذا الإكتشاف الخطير الذي تلقيته بشيء من الاستخفاف بادئ الأمر لعلها تكون طرفة أو مسحة أراد احدهم أن يفعلها بي ...انتقلت عن فوري لإحضار نسختين من جريدتي الأخبار والجمهورية المذكورتين أنفاً وإكتشفت أنها ليست طرفة أو ألعوبة بل هي الحقيقة ...والمقالتين نشرتا في التواريخ التي ذكرتها سابقاً والتطابق بينهما واضح والأمر جلل.... بكل وضوح سيكتشف القارئ أن الأستاذ محمد على إبراهيم رئيس تحرير الجمهورية لم يكن بينه وبين الدكتور إسماعيل عبد الجليل توارداً فكرياً بل سرق عباراته وجمله وسطا على أفكاره التي إستولدها الدكتور إسماعيل في مقالته في جريدة الأخبار المنشورة قبل ثلاث أيام من مقالة رئيس تحرير الجمهورية والتي لم يستحى أن ينقل منها وينشرها ثم يضع إسمه عليها ناعتاً كلماتها لشخصه غير عابئ بتقاليد أو مواثيق المهنة أو الشرف الصحفي الذي أقر إلتزام الصحفي فيما ينشره بمقتضيات الشرف والأمانة والصدق بما يحفظ للمجتمع مثله وقيمه وبما لا ينتهك حقاً من حقوق المواطنين أو يمس إحدى حرياته....وأكد على إن إحترام حق المؤلف واجب عند اقتباس أي أثر من أثاره ونشره....<br />فإذا نظرنا في متن المقالتين بالمقارنة نكتشف :<br />· أن الدكتور إسماعيل كتب يقول عن الحزب الوطني:واختار الحزب الوطني بفكره الشاب الجديد تحقيق إنتعاش إقتصادى غير قابل للانتكاسة.....بينما كتب محمد على إبراهيم يقول: وقد اختار الحزب الوطني بفكره الشاب الجديد ...لتحقيق انتعاش إقتصادى غير قابل لحدوث انتكاسة<br />· وكتب إسماعيل قائلاً عن جذب الاستثمارات:جذب الاستثمارات المحلية والأجنبية يستلزم جهوداً مضاعفة وإستثمارات حكومية باهظة لتحسين المرافق والخدمات الجاذبة كالطرق والإتصالات و...و.... فقال محمد على إبراهيم : ....بجذب إستثمارات محلية وأجنبية ...وهذا يستلزم جهوداً مضاعفة وإنفاقاً حكومياً ضخماً لتحسين المرافق والخدمات التي تجذب الاستثمارات وأولها شبكة الطرق والإتصالات ...<br />· و تكلم إسماعيل عبد الجليل عن الدعم فقال : ...عندما تنجح الحكومة في إيجاد الآليات الذكية لإلغاء الدعم الإجتماعى الحالي الذي تتجاوز قيمة 100مليار جنية ويتمتع به الأثرياء بنفس قدر الفقراء.......فقال محمد على إبراهيم : أن الحكومة عليها أن تلغى 100مليار جنية دعماً يحصل عليها الأغنياء والفقراء على حد سواء<br />· وعن دعم ورش الحرفيين لمصانع رجال الأعمال تحدث إسماعيل فكتب:فمن غير المنطقي أن يدعم راكبو الموتوسيكلات والأتوبيسات العامة وقود سيارات الأثرياء الفاخرة...أن تدعم ورش الحرفيين البسطاء مصانع رجال الأعمال بخمسين مليار جنية تمثل تكاليف الدعم الحكومي للطاقة !!.....فجاراه محمد على إبراهيم على نفس الوتيرة فكتب: الذين يركبون المترو والأتوبيس يدعمون راكبي المرسيدس والجاجور....وورش الحرفيين تدعم مصانع الحيتان بحوالي خمسين مليار جنية هي تكاليف الدعم الحكومي للطاقة<br />· فيتحدث إسماعيل عن ممارسات التعبير والنقد فيقول: ... أن ممارساتهم لحرية التعبير والنقد غير المسبوقة في تاريخنا ينفى في حد ذاته مزاعمهم ...كنا نتمنى إستخدامها في كشف الفساد بأسانيد دامغة وليس بادعاءات باطلة وفى طرح بدائل منطقية أمينة لسياسات الإصلاح الإقتصادي والسياسي بدلا من المزايدة على مواجع الشارع المصري والتشهير به.....فيتبعه محمد على إبراهيم في نفس السياق فيقول : ... أن ممارساتهم لحرية تعبير ونقد غير مسبوقين في تاريخنا تؤكد أن هناك تقدماً ملحوظاً في الحرية السياسية وتدحض مزاعمهم ...لقد كنا نتمنى أن يستغلوا هذه الحرية في كشف الفساد بأدلة يقينية وليس بادعاءات ومزاعم باطلة وفى تقديم خطط وبرامج جديدة للإصلاح الإقتصادي بدلا من المزايدة على الآم وأوجاع الشارع المصري والمتاجرة بها<br />· يقول إسماعيل في إقتصادنا فيقول: ...يجب أن نقر بحقيقة غير قابلة للجدل بأن اقتصادنا مصاب تاريخياً بعديد من العلل والأمراض التي تراكمت عبر سنوات طويلة .....ولا ينسى محمد على إبراهيم أن يتبعه فيقول: ... علينا أن نعترف بحقيقة هامة أن إقتصادنا مصاب بكثير من الأمراض التي لم ينفع معها علاج طوال سنوات<br />· وعن المسكنات يقول إسماعيل: ...ومن هنا كان هناك اختياران لا ثالث لهما أولهما استمرار العلاج بالمسكنات كما اعتادنا خلال عصور سابقة انتهت بنا إلى تضاعف حجم الأورام والمشاكل بفعل التراكم الزمني أو التدخل الجراحي بتوابعه الأكثر ايلاماً من المسكنات ......ولا ينسى محمد على إبراهيم كعادته فيقول: ...ووصل الأمر إلى الحد الذي أصبحنا مطالبين فيه بحالين لا ثالث لهما إما استمرار العلاج بالمسكنات أو إجراء جراحة عاجلة يشفى المريض بعدها<br />· وعن مزارع الدواجن يقول إسماعيل: ...وأن تنافس مزارع الدواجن الفقراء في استهلاك رغيف العيش المدعم بستة مليارات جنية ....فيجاريه محمد على إبراهيم فيُكمل: ...مزارع الدواجن تلتهم الدعم المخصص لرغيف العيش وهو سبعة مليارات جنية<br />· ويختتم إسماعيل مقاله فيوجز عن الحزب: ...يشهد محاسبة ومراجعة لانجازات وسلبيات ....وإعادة هيكلة قطاع الزراعة وإنشاء المحاكم الاقتصادية والعديد من الطموحات ... .........فينهيه محمد على إبراهيم نفس النهاية ويكتب : ستتم محاسبة ومراجعة انجازات الحزب ...وإعادة هيكلة قطاع الزراعة الذي يعانى من مشكلات ضخمة وإنشاء المحاكم الاقتصادية والعديد من الطموحات<br />والسؤال هل يمكن أن تتطابق هذه الكلمات والمصطلحات في مقال واحد وتتوحد فكرة الموضوع فتتكرر كـلمات كـ (أتوبيس-ورش الحرفيين-مائة مليار- تكاليف الدعم الحكومي للطاقة- خمسين مليار جنية-- مزارع الدواجن- هيكلة قطاع الزراعة- إنشاء المحاكم الاقتصادية- محاسبة ومراجعة لانجازات- المسكنات-25مليون موبايل...الخ)في مقال واحد ...ثم ينتقل الكاتبين في الحديث عن أفكار واحدة هي الحزب الوطني وجذب الاستثمارات ودعم ورش الحرفيين لمصانع رجال الأعمال وممارسات التعبير والنقد ومشاكل الإقتصاد والمسكنات ومزارع الدواجن....ثم ينهيا بعد ذلك المقالين بنفس الخاتمة...أنه حقاً زمن ما بعد توارد الأفكار...إن الأفلام السينمائية نفت فكرة توارد الخواطر وألجأتها لصديق لا يشك فيه ينقل كل الكتابات إلى شخص آخر ...فهل نريد أن نُصدق أن هناك توارد خواطر مشابه لتبرئة ساحتنا ...أرجو الا يكون هذا هو الإتجاه.<br />إتصلت سريعاً بالدكتور إسماعيل عبد الجليل لمعرفة تفاصيل الأمر لعل هناك خطأً...إلا إنه أكد وصِدق على الواقعة وقد بدا عليه الذهول لسرقة مقاله...وكأن لسان حالة يقول ما الذي يدفع كاتب كبير ورئيس تحرير صحيفة كبرى أن يفعل ذلك .....طرحت عليه عمل تحقيقاً صحفياً يجسد حجم المأساة ويكشف المهزلة ...قال لى الدكتور إسماعيل أنني سأجرى اتصالات ببعض معارفي من الصحفيين لإخبارهم وسأتصل بالأستاذ مجدي مهنا –رحمة الله عليه- لعله يكتب أو تجرى صحيفة المصري اليوم تحقيقاً عن هذه السرقة...لكنى وقتها وعلى خلفية معرفة سابقة بالدكتور إسماعيل خيرته بين ثلاثة أمور يمكن أن يكون إحداها الصحيح ...أولها أن يكون موقفه موقف مواطن عادى لا حول له ولا قوة ويتخذ موقفاً سلبياً ولا يتخذ أيه إجراء...وثانيها أن يتخذ موقف المواطن المواجه ويتقدم ببلاغ رسمي إلى نقيب الصحفيين ثم إلى اتخاذ المواقف القانونية لحماية حقه المعنوي وإن لزم الأمر المادي ..إما ثالث الأمور فقد طرحت عليه اللجوء إلى أسلوب دبلوماسي بمحاولة الحديث إلى محمد على إبراهيم في إطار حديث ودي يستفهم منه -قبل أية إجراء- عن ما جرى بالضبط لعل يكون الأمر فيه لغط..!!<br />ولعل هذا المطروح أخيراً قد لاقى قبولاً لدى الدكتور إسماعيل وقال لى :إن المؤتمر العام للحزب-يقصد الحزب الوطني- غداً وربما التقى الأستاذ محمد على إبراهيم ونتحدث سوياً !!<br />انتهت المكالمة ومنذ إجرائي لهذه المكالمة لم أسمع عن الأمر شيئاً ولم أتلقى من الدكتور إسماعيل أية اتصال يعلمني فيه بنتيجة لقاءه برئيس تحرير الجمهورية أو حتى إن كان لم يلتقيه في هذا اليوم ...إلا إنني أتذكر أن الدكتور إسماعيل قال لى في المكالمة الفائتة أن رئيس تحرير الجمهورية ربما أخذ ما جاء في مقالتي نوعاً من التفريغ لما أنتجته سياسات الحزب الوطني أو كنوع من التوحد الفكري لأبناء الحزب الواحد!!<br />ولعل هذه الكلمات تدفعني للتساؤل عن ماهية الخطة الإعلامية للحزب الوطني :هل هي خطة تقوم على وريقات توزع على رموزه وأعلامه وقياداته ليقتدوا بها حين كتابة مقالاتهم في الصحف ؟...أم أنها وريقات توزع لإعادة صياغاتها وكتابتها مرة أخرى ؟ أم أنها وريقات كُتبت لتوزع فيُسلمها مُستلميها إلى الصحف كما هي أو بتعديل طفيف لتبقى سياسية الحزب واحدة وإن تغير اسم كاتبها أو الصحيفة المنشورة فيها ؟!....وهذه التساؤلات التي تحتاج لرد من الأمين العام للحزب الوطني صاحب قرار تعيين الأستاذ محمد على إبراهيم !!<br />وتساؤلي الآن إلى الأستاذ الدكتور إسماعيل عبد الجليل وهو الآن في الولايات المتحدة الأمريكية يمثل مصر زراعياً في سفارتها...لماذا سكتَّ أكثر من عام متصل عن كشف انتهاك حقوق كلمات مقالتك الفكرية ....هل هذا أمراً يجوز السكوت عليه ...أم أنك أرتأيت أنك ستنفخ في قربة مقطوعة...كما إني لا أظنك قد تفهمت رأيي الدبلوماسي على وجه خاطئ فتفاهمت والأستاذ محمد على إبراهيم!!!<br />وقبل أن أرفع هذا المقال قررت أن أُجرى إتصالاً بالأستاذ محمد على إبراهيم لعل يكون له تبرير معاكس كأن يكون المقال في الأصل مقال قد قام بنشرة في إحدى الدوريات العربية ثم أعاد نشره في الجمهورية مثلاً ...أو يكون هناك من يكتب له بعض مقالاته عندما تكون إنشغالاته أكبر من وقت كتابة المقال ويكون من كتب له المقال هو من سرق في هذه الحالة....على كل حال فإن إتصالاتي به لم تأتى بفائدة فقد كان غير متاح والمكالمات غير مردود عليها ....وقد فكرت ثم ترددت في الذهاب إليه حتى لا أُتهم لاحقاً بمحاولة إبتزازه فأقلعت عن الفكرة.<br />يالها من مأساة قد لا يشعر بها إلا الصحفيون وأصحاب الأقلام الطاهرة...كبير البيت في جريدة الجمهورية سارق مقال أو قَُل تخفيفاً مقتبس ومعيد صياغة مقال ...يالها من مهزلة في حق واحدة من اعرق واكبر ثلاث صحف يومية في مصر ...يالها من مأساة حقيقية سيعيشها صحفيو جريدة الجمهورية....يالها من مأساة سيعيشها صحفيو مصر...واحد من رموز الصحافة يطعنها في مقتل ويفتك بكلمات ليست كلماته وعبارات ليست من بنات أفكاره وينسبها لنفسه..... ترى هل سيقال لجموع الصحفيين قول الشاعر الذي إستُحضر ولا بد من أن يكون<br />(إذا كان رب البيت بالدف ضاربُ فشيمة أهل البيت الرقصُ !!)<br />ماذا سيقول القراء علينا -نحن الصحفيين- في مواجهة هذا المقال اللعين...هل نحن سُرَّاق أفراح ... سُرَّاق عرق المفكرين والكتاب ... سُرَّاق الفكر .... ماذا نقول في مواجهة أنفسنا ....إن الشعور بالخجل سيظل يملئني إن لم نتبرأ من هذا الفعل وتتبرأ نقابة الصحفيين ونقيبها الأستاذ مكرم محمد أحمد منه....وتشكل مجلس للتحقيق مع الأستاذ محمد على إبراهيم بشأن مقاله في مواجهة مقال الدكتور إسماعيل عبد الجليل معتبرة-نقابة الصحفيين- مقالي هذا بلاغاً رسمياً إليها يرتقى إلى البلاغ لدى النيابة العامة حال عدم التحقيق الجاد المنصف على رؤؤس أعضاء نقابتنا ليأخذ المخطئ حقه وترد للمهنة جزءاً من كرامتها التي أهدرت ....ولينظر الأستاذ صفوت الشريف بصفته رئيساً لمجلس الشورى والمجلس الأعلى للصحافة في الأمر...ولينظر بصفته صاحب قرار تعيين الأستاذ محمد على إبراهيم في منصب رئيس تحرير الجمهورية خلفاً للأستاذ سمير رجب في المقالتين حال إدانته ليرى ماذا يصنع وما يجب أن يكون... فإن الأحلام والرؤى قد تأتى بالبعض إلى المناصب العليا لكنها حتماً لا تضمن البقاء يا سيدي الرئيس!!<br />إن ميثاق الشرف الصحفي الذي وافق عليه المجلس الأعلى للصحافة في 26/3/2008 يؤكد على التزام الصحفي بالواجبات المهنية وتحرى الدقة بعدم نسبة الأقوال والأفعال إلى مصادر غير معلومة .....فهل حضر وأقر الأستاذ محمد على إبراهيم هذا الإجتماع وهو عضوا في هذا المجلس!!<br />يا من تنتهكون حقوق الفكر وملكيته الم تعرفوا وتقرأو أن هناك قانوناً يسمى 96لسنة 96 بشأن تنظيم الصحافة .....فى فصله الثالث وتحديداً في مادته الثامنة عشر يتحدث عن واجبات الصحفيين ....تقول المادة فيه :يلتزم الصحفي فيما ينشره بالمبادئ والقيم التي يتضمنها الدستور وبأحكام القانون مستمسكاً في كل أعماله بمقتضيات الشرف والأمانة والصدق وآداب المهنة وتقاليدها بما يحفظ للمجتمع مثله وقيمه وبما لا ينتهك حقاً من حقوق المواطنين أو يمس إحدى حرياتهم....فهل قرأها الأستاذ محمد على إبراهيم!!<br />وإنني من وراء هذه الكلمات لا أتشفى في إنسان لأن ليس بيني وبينه عداوة ولكنى من دافع هذا الميثاق الصحفي مخطاً على مادته الثانية عشر خطوط وهى التي أيقظتني بعد عام...وهى تقول الصحفيون مسئولون مسئولية فردية وجماعية رؤساء كانوا أو مرؤوسين عن الحفاظ علي كرامة المهنة وأسرارها ومصداقيتها,وهم ملتزمون بعدم الستر علي الذين يسيئون إلي المهنة أو الذين يخضعون أقلامهم للمنفعة الشخصية....فإني أرى أنى وإن سكت عن ما قد سطرته في الكلمات السابقة فقد أكون متستراً على من أرتأيت أنه قد أساء إلى مهنة ورسالة الصحافة....فيا من أنتم قائمون على الكلمة أذكركم بقول الشاعر حتى تصونوها:<br />وما من كاتب إلا ســيفنى ويبقى الدهر ما كتبت يداه<br />فلا تكتب بأيدك غير شيء يسـرك في القيامة أن تراه<br />كاتب وصحفي مصري"
