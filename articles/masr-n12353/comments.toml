text = "هذا الصنم و الإله المزيف المدعو محمد على إبراهيم<br />لأنه لا يفل الحديد إلا الحديد .. فإننى أقترح على الغيورين من الكتاب المصريين أو حتى العامة ، و العامة من الدول العربية و الإسلامية المتضررة من سفالات المدعو محمد على إبراهيم و أمثاله ، أن يردوا له الصاع صاعين ، و سيكون الرد عليه حينئذ قصاص مشروع و عادل ، و لكم فى القصاص حياة يا أولى الألباب . فهو يحتاج إلى رجل \" شارب من بز أمه \" ، و لسانه أطول من لسانه ، و أكثر قلة أدب و وقاحة منه ، يعرفه مقامه جيدا و كويس . هذا البوق ( و لا يهم غيره من أمثال مهدى بندق و مجدى القمنى فى جريدة القاهرة مثلا لأن هذا البوق ) يشغل موقعا خطيرا فى جريدة من أهم و أشهر و أكبر ثلاث جرائد مصرية و هو على قمة إحدى أكبر ثلاث مؤسسات صحفية فى مصر ، بالإضافة إلى كونه عضوا فى ثانى أهم مجلس برلمانى بعد مجلس الشعب ، من المجلسين البرلمانيين الحاكمين فى مصر مما يعنى أنه ذو نفوذ و سلطة واسعة ، و حاصل على حصانة برلمانية ، و حاصل على كارت أبيض ( كارت بلانش ) يسمح له بقول و فعل أى شئ ، دون محاسبة ، و لو أنه توجد عدالة حقة و قانون فى هذا البلد لكان هذا البوق مودعا فى أحد سجون مصر الآن بتهمة التعدى على دول عربية و إسلامية شقيقة و صديقة ، أم أن الصديق العزيز اللذيذ هو ساركوزى و باراك .. و بتهمة السب و القذف بحق حركات مقاومة شرعية و مناضلة و شريفة ، و بحق قامة صحفية رفيعة و زعامة سياسية و عربية كبرى و تاريخية مناضلة و مثابرة و مجاهدة شريفة و نزيهة . و هو من الذين نالتهم و وقعت عليهم أيدى النظام و ولى النعم البيضاء ، و أنه من رجاله المخلصين و من صنائعه الذين اصطنعهم لنفسه و خدمه الذين لا يخالفون عن أمره .. كما أنه ضيف دائم على الطائرة الرئاسية ، كما أنه يحب اللحم و مغرم بالموائد و المآدب ، كما أنه مغرم بالحريم و المذيعات أينما ذهب يتغزل بهن و يشبب ، مما يوضح كم أنه دنيوى محب لمتاع الدنيا و زينتها و مغرياتها من طعام و نساء و مال إلخ . و بالتالى فهو عبد من عبيد الدنيا و يسهل تجنيده و توجيهه إلى أى اتجاه و أية وجهة .<br />هذا الــ (....) كتب الكثير من الافتراءات و كال الشتائم و فرش الملاءة كشغل النسوان الوسخة ، و الردح لسوريا تارة و إيران تارة أخرى و حزب الله تارة ثالثة و حماس تارة رابعة و قطر و البقية تأتى .. يضاهئ ما تفعله و تقوله جريدة الشرق الأوسط السعودية و أزلام النظام السعودى و محور الاعتلال .. و لم يمنعه أحد و لم يردعه أحد و لم يوبخه أو يعنفه أحد و لا هاجم و لا رد عليه أحد و لا فرش له الملاءة أحد .. إن هذا الصنم و الإله المزيف يشبه أبا سفيان بعد معركة أحــُد حين أخذ يدخل فى جدال و حرب كلامية تجاه المسلمين و النبى عليه الصلاة و السلام ، و أخذ يعيرهم قائلا اعلُ هبل العزى لنا و لا عزى لكم ، فصمت المؤمنون أما النبى فلم يصمت بل قال للمؤمنين \" ألا يجيبه أحد ؟ \" فسألوه و بم نجيبه يا رسول الله .. فأخذ يعلمهم و يرد زيد بن حارثة على أبى سفيان حين يقول اعل هبل فيرد قائلا الله أعلى و أجل و حين يقول العزى لنا و لا عزى لكم فيقول الله مولانا و لا مولى لكم ، و هكذا أفحم أبو سفيان و تراجع خائبا فلم ينتصر حتى فى الحرب الكلامية و هكذا فلتفعلوا مع أبى سفيان العصر الحديث .<br />و لو كان النظام الذى يحميه و يتمرس هو وراءه ، لو كان هذا النظام عاقلا و يمتلك أدنى قدر من الوقار و الرزانة و الحكمة و العقلانية لعزل هذا الشخص أو أخرسه و منعه من الكلام .. لو كان حقا يرعى الأخوة العربية و التسامح المذهبى و الطائفى ، و لو كان يراعى حدود اللياقة و آداب مهنة الصحافة و قواعد المهنية الصحفية التى لم يكن أبدا من بينها الردح و السباب الذى يقول به هذا الـ ( .... ) و ضع أى كلمة تريد فى الفراغ ما بين القوسين .. هذا الـ ( .... ) لابد أن تشن عليه حملة شعواء تزيحه من على مقعده بهذه الجريدة الثورية العريقة التى كانت يوما نبراسا و منبرا للثورة المجيدة و صوتا وطنيا صادقا للشعب المصرى و طموحاته و آماله و أهدافه العظيمة ، فهو عار عليها و عار على نقابة الصحفيين و على مصر كلها .. و لابد أن يجد من يرد عليه و يفحمه و يخزيه . لقد تجاوز هذا الـ (....) كل الحدود و تمادى متعديا على دول مجاورة و شقيقة و حركات مقاومة شريفة مستغلا الحبل المتروك له على الغارب و الضوء الأخضر عمال على بطال له ، مما أصابه بإسهال نفاق و ردح مزمن لا شفاء منه أزكمت أنوفنا رائحته كلما طالعنا هذه الجريدة العريقة . حتى أقدم على اتهام إيران و اصطناع تهمة إرهابية لها ، مقتبسا من كلام المساطيل و المعاتيه الذى تفوه به المدعو حيدر بغدادى على قناة الجزيرة يوم تفجيرات الحسين ، فاتضح بذلك أن كلام المساطيل هذا مبيت و مخطط له بفتح الطاء و أنه افتتاحية أوركسترا الردح و فرش الملاءة لهذا الصنم و أمثاله ، و ما أتعس من يتبع مسطولا فى كلامه أو يساير مجنونا فى جنونه أو يصدق معتوها فى عتهه .<br />هؤلاء يقدرون الرئيس الأمريكى الصليبى الإمبريالى فقط و ينددون بما فعله منتظر الزيدى ، و يعتبرونه إهانة رئيس دولة ، فماذا عن الإهانات تجاه الدول و الشعوب العربية و الإسلامية المقاومة و المجاهدة و الممانعة إننا نطالب بمعاملة بالمثل ."
