text = "أكثر ما يؤسفني هو الأسماء التي يحملها رئيس تحرير الجمهورية، محمد وعلي وإبراهيم، ليته يغيرها، كلما قرأت له مقالا أشغر بالغثيان وأقول يا إلهي ألا يشعر هذا الرجل بكراهة ما يفعل وحرمته وهو لا يكف عن الثغاء والشتائم يمينا ويسارا، ولا يكف يوما عن النفاق، ألا يدري أن الناس أصبحوا أكثر ذكاء وأنهم عما قريبا سوف يتوقفوا عن شراء جريدته المليئة بالأخبار الكاذبة والملفقة لصالح الحكومة."
archived = "2010-03-14"
