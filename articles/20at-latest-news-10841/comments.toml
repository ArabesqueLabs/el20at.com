subject = "أحسن الله عزاءكم"
author = "مسلم"
posted = "2009-01-01"
text = "يا قائمين على موقع عشرينيات مابقي الا نعزيكم في مصمم الأزياء الفرنسي ، بالله مالفائدة المرجوة من نقل خبر هذا الكافر ، والمسلمين الذين يموتون كثر ، وأقلهم شأن عندنا أعظم من هذا الكافر .<br />ماهو منهج هذا الموقع . عز الأسلام . ام ضرب كل ماهو مسلم . بأستغلال المواقف وتشويه الحقائق .<br />لكن فعلا . الجاهل عدو نفسه . عفانا الله مما ابتلاكم به."
