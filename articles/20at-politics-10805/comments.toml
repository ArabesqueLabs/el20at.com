subject = "الى المدعو غزاوي"
author = "مش ضروري"
posted = "2008-12-28"
text = "اتلهي على عيني ليه<br />لازم توضح الاسباب<br />ايه اللي انا قلته غلط<br />فيه حاجه اسمها علامات يوم القيامه واخد بالك ياابني<br />فيه ناس فاكرة ان ربنا مش حيقوم القيامه علشان خاطر عيونهم<br />يا ابني روح اتفقه في دينك احسن بلاش هبل وعبط<br />العالم في انتظار ثلاثة الان<br />1) المسيخ الدجال<br />2) المسيح النبي<br />3) المهدي المنتظر<br />وتجمع اليهود في فلسطين من علامات قرب ظهور الدجال لانهم سيكونوا اتباعه<br />سلام يا غزاوي وعيب لما تتهم الناس بالجهل وانت اجهلهم"
