subject = "ممكن اغنيه لعبد الحليم حافظ (العندليب)"
author = "مش حقولك"
posted = "2008-12-27"
text = "أحبك... أحبك... أحبك... أحبك... أحبك... أحبك...<br />كلمة بقالها أيام وليالي تدوب فيا<br />عايزة تروحلك وانتي بعيدة... بعيدة علي<br />أحبك<br />كلمة بقالها أيام وليالي تدوب فيا<br />عايزة تروحلك وانتي بعيدة... بعيدة علي<br />والكلمة اللي أنا عايش بيها<br />رح دوب كل الشوق فيها<br />وحقولها وأعدها وغنيها<br />حقول أحبك حقول أحبك<br />وعيش أحبك أعيش أحبك<br />أحبك أحبك يا حياة قلبي<br />يا عيني قلبي جرى ايه<br />الدنيا حلوَت كده ليه<br />يا عيني قلبي جرى ايه<br />الدنيا حلوَت كده ليه<br />يا صحابي يا أهلي يا جيراني أنا عايز أخدكو في أحضاني<br />يا صحابي يا أهلي يا جيراني أنا عايز أخدكو في أحضاني<br />مش قادر على فرحة قلبي<br />مش قادر أبداً يا حبايبي<br />مش قادر على فرحة قلبي<br />مش قادر أبداً يا حبايبي<br />والكلمة اللي أنا عايش بيها<br />رح دوب كل الشوق فيها<br />وحقولها وأعدها وغنيها<br />حقول أحبك حقول أحبك<br />وعيش أحبك أعيش أحبك<br />أحبك أحبك يا حياة قلبي<br />بحبها بحبها وفقلبي ساكن حبها<br />يا ريت يا شوق يا ريت يا شوق توصلها ويحس بي قلبها<br />بحبها بحبها<br />بحبها بحبها وفقلبي ساكن حبها<br />يا ريت يا شوق يا ريت يا شوق توصلها ويحس بي قلبها<br />بكرا خلاص حقولها روحي لها عقلي لها<br />وحقولها هي الهنا...هي المنا... كل المنا هي حياتي كلها<br />بحبها بحبها<br />بكرا خلاص حقولها روحي لها عقلي لها<br />وحقولها هي الهنا...هي المنا... كل المنا هي حياتي كلها<br />والكلمة اللي أنا عايش بيها<br />رح دوب كل الشوق فيها<br />وحقولها وأعدها وغنيها<br />حقول أحبك حقول أحبك<br />وعيش أحبك أعيش أحبك<br />أحبك أحبك يا حياة قلبي--------------------------------------------------------<br />تحياتي"
archived = "2010-03-14"
