[[comments]]
order = 4
subject = "فقه التعامل مع علامات يوم القيامه"
author = "مش ضروري"
posted = "2008-12-28"
text = "للاسف المسلمين ما عندهمش اي فقه للتعامل مع علامات يوم القيامه<br />يعني مثلا من علامات يوم القيامه قبض العلم وهذا هو الوقت الذي نحن نعيش فيه وبناء عليه تم رفع الحكم بالشريعة الاسلامية بناء على قبض العلم تجد جماعات ظهرت تطالب بتطبيق الشريعة الاسلامية<br />اليهنود دول وجودهم في هذا المكان من علامات يوم القيامه (لطفا يرجى مراجعة تفسير الشيخ الشعراوي في تفسير اية حتى اذا جاء وعد الاخرة جئنا بكم لفيفا) وما عندناش اي فقه للتعامل مع هذه العلامة<br />والشيعة خروج الشيعة يعني الثورة الايرانية وغزو العراق لخروج الشيعة من القمقم دا من علامات يوم القيامة واقتراب موعد ظهور المهدي المنتظر<br />المسلمين للاسف ما عندهمش اي فقه للتعامل مع علامات يوم القيامه<br />سلام"
archived = "2010-03-14"
capture_url = ""

