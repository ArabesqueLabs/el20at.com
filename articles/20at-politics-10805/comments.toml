[[comments]]
order = 9
subject = "وستنتصر غزة - والخزى لعملاء اسرائيل وامريكا"
author = "سلومة الاقرع"
posted = "2008-12-28"
text = "مقرات الشرطة كانت عامرة بعساكر الشرطة<br />وكان هناك عرض عسكرى يتم فى احد المقارات لتخريج دفعة ضباط شرطة واهليهم وقادة شرطة يحضرون حفل التخرج حينما سقط صاروخ عليهم<br />من هنا جاءت صدمة زيادة الضحايا فى اليوم الاول للغارات<br />النقطة الثانية والخطيرة<br />اين الدفاع السلبى لحماية الناس من الغارات - لماذا لا يحفر الناس حفر برميلية ويجلسوا بداخلها وقت الغارات - فاذا جلس انسان فى حفرة برميلية تحت الارض وسقطت قنبلة على بعد مترين منة فلن يصاب باذى<br />هناك مبدا عام فى الحروب<br />احفر او تموت<br />يا اهل غزة احفروا وتحصنوا<br />انا واثق انكم ستنتصروا<br />لم يهزم شعب بدأ المقاومة<br />الجزائر تحررت بمليون شهيد<br />وفيتنام تحررت بملايين الضحايا<br />لا تفزعوا من رؤية الشهداء بل زغردوا لهم<br />ولكن حسنوا دفاعاتكم السلبية<br />لا تموتوا فطيس"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "لا تخافوا - يا اهل غزة انتم اقوى من كل العملاء واق"
author = "مصرى"
posted = "2008-12-28"
text = "ان مات منكم الف شهيد فستلد النساء فى اليوم التالى الفين طفل بطل<br />الاطفال الذين يولودون وسط الانفجارات هم ابطال المستقبل<br />انتم اقوياء وابطال<br />اثبتوا وثابتوا ونصر اللة قادم<br />لا تخافوا ولا تفزعوا<br />اذا جاء نصر اللة والفتح ورايت الناس يدخلون فى دين اللة افواجا فسبح بحمد ربك واستغفرة انة كان توابا"
