[[comments]]
order = 1
subject = "بمناسبة الذباب"
author = "اكتب اسمك هنا"
posted = "2007-06-08"
text = "هو ممكن الرئيس بتاعنا اطال الله عمره يشوف ذبابة ويتعامل معاها ويهشها وكده يعنى واخر ما يزهق يشد فى شعره ويطلع يجرى وراها زى المجنون تخيلوا كده الراجل ده وهو بيجرى فى القصر الجمهورى وراء ذبابة والرئيس الامريكى مثلا يقوله فى ايه مستر بريذدنت .<br />ولا بالليل يقلق على صوت ناموسة لانه نسى يستخدم ريد وفى الاخر يحرق الاوضة زى كابتن ميزو"
archived = "2010-03-14"
