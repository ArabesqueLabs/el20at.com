[[comments]]
order = 0
subject = "و اعمال ادبيه كمان"
author = "نيفين نيفى نوفا"
posted = "2007-06-03"
text = "بعد ان الموضوع جميل و الاسلوب اجمل احب اقوللك اضف الى معلوملتك يا استاذ محمود ان الذبابه كانت ايضا ملهمه لكاتب ساحاول تذكر اسمه لكتابه عمل ادبى بديع عن ذبابتين وقعتا ف دواه حبر و استطاعت احداهما بالاراده ان اتنجو و فشلت الاخرى و الاسقاط على الانسان طبعا لتعليمه قوه الاراده<br />و ربنا يجعل كلامنا و كلام كل العشريناتيه خفيف على الذباب الصيف ده"
archived = "2010-03-14"
