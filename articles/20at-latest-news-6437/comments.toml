subject = "انظف حشيش فى العالم موجود فى السعودية"
author = "مصطفى مرزوق"
posted = "2007-06-25"
text = "مهندس بيشتغل فى السعودية بيقول ان الكفيل بتاعة بيجيلوة مندوب مبيعات الحشيش ويفرجة ويختار الحاجة بعد كدة يجى الكفيل ويفرق على المهندسين ويشربو مع بعض بعد الشغل واحيانا لما يبقى فية ظغط شغل يقعدو يوم كامل فى المكتب وبالطبع السجاير شغالة الحشيش احسن من البرشام والهرويين بس السؤال الكبير ازاى دخلت كل الكميات دى ومين وفين والبلد كل حاجة فيها ممنوعة انا بكرة اسرائيل واحب السعودية"
