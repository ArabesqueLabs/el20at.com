order = 0
subject = "علامات البؤس والجرب واضحة فى كل مكان"
author = "شرارة حسن شرارة"
posted = "2009-03-18"
text = "بعد غربة 30 سنة نزلت الى ارض الوطن - ومشيت فى شارع رمسيس والعتبة - العمارات قديمة من ثلاثينات القرن الماضى جربانة ومقشفة وكانة لم يخترع حاجة اسمها الوان وصباغة ودهان البيوت - عمارات شكلها يقرف تنتمى الى عصر ما قبل الحرب العالمية الاولى<br />والشوارع مملوءة بالدخان من عوادم السيارات المتهالكة القديمة التى لا يقل عمرها عن 30 او اربعين سنة وشكمانتها تبث الدخان فى الشوارع واشارات المرور لا تعمل واذا عملت فضوئها باهت وصغيرة وقديمة جدا واظن انها متركبة من ايام الملك فؤاد ابو الملك فاروق<br />والمصيبة ان وزير المالية عمل ضريبة على العقارات او هذة العمارات - ورايى ان اصحاب هذة العمارات فى حاجة الى دعم الحكومة لدهانها بالوان تليق بشكل عاصمة كانت فى يوم ما عاصمة الشرق الاوسط<br />نعم البؤس واضح على كل الناس<br />كل شىء بائس"
