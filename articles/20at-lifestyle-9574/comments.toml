text = "السلام عليكم<br />المشروع يقوم على حفظ عشر صفحات من القرىن الكريم يوميا وفترة التحفيظ هي للطلاب من بعد صلاة الفجر وحتى صلاة الظهر يتخللها نشاط رياضي بسيط ودروس في السيرة أو الفقه<br />وتكون هناك اختبارات كلما أتم الطالب حفظ ثلاث أجزاء أي بمعدل اختبار كل اسبوع<br />أما للطالبات فالفترة هي من الساعة السادسة صباحا الى الواحدة ظهرا"
