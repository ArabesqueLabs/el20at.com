posted = "2008-10-06"
text = "الحقيقة أنا مع أستخدام نظام الحوائط الحاملة لو أتنفذ صح لعدة أسباب<br />1- مقاومة أرتفاع أسعار الحديد و الأسمنت<br />2- كفايانا أبراج وزحمة ده أحنا سكنين على 2% تقريبا من مساحة مصر بيتهيألى أحسن لينا و لبلدنا أننا نتوسع أفقى مش رأسى<br />3- و اللى حيقول طيب و المياة و المجارى بالنسبة للمية أنا مش ححتاج ضغط عشان أرفع المية يمكن حعوز مواسير بقطر أكبر و طول أكبر لكن فكروا كده لو أحنا ملينا أرض مصر و عملنا مصانع و سيبنا الأرض اللى حولينا النيل تتزرع ممكن يبقى الحال أزاى لو كل واحد ساكن فى بيت صغير بدل من علب السردين اللى أحنا فيها و على فكرة كل المبانى القديمة فى القاهرة حوائط حاملة و لسة عيشة"
archived = "2010-03-14"
