order = 1
subject = "افيقوا  يا عرب يا مسلمين"
author = "من امة محمد"
posted = "2008-01-21"
text = "لحد امتى هتفضلوا كده يا مسلمين ياعرب<br />بكره هيجي الدور عليكم<br />حد وضع نفسه مكانهم وحس بالى بيعانوه<br />نفسنا نتحرك ونعمل حاجة<br />طبعا معندناش غير كلمة (يا عينى صعبنين عليا اوى يا حرام)<br />افيقوااااااااااااااااااااااااااااااااااااااا يا امة محمد<br />واعلموا انكم ستحاسبون على تخاذلكم وتهاونكم"
archived = "2010-03-14"
