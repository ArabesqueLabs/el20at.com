text = "موضوووع بليييد جداا وبكل صراااحه ليس له معنى .. والمضحك اكثر هي قصة الرشاقة .. بكل موضوعية لاحظو اهل هذه القبل وستكتشفون الرشاقة الحقيقية كيف تكون ..<br />ارجو غلق هذا الموضوع باسرع ما يمكن وقصة الرشاقة دعوها للاكل الصحي والرياضة فقط..<br />اما بالنسبة لهذا النوع من القبل فهو بالنسبة لي غير لائق ومقزز جدا<br />ليحيا التصافح \"اذا التقى مؤمنان وتصافحا غفر لهما قبل ان يفترقا \""
