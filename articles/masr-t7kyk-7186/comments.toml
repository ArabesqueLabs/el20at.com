[[comments]]
order = 2
subject = "وعلى رأسهم الكتلة البرلمانية للإخوان المسلمين"
author = "مش ضروري"
posted = "2007-09-26"
text = "العنوان جزء من سطر من المقال<br />بالنسبة للكتلةالبرلمانية للاخوان المسلمين<br />انتو عارفين طبعا ان الحكومة مانعة اي احزاب على اساس ديني<br />بصرف النظر عن انه خطأ ام صح ولكن هو دا اللي حصل والحكومة ترى اشياء نحن لا نراها<br />وطبعا الاخوان المسلمين ممنوعين من انهم يشكلوا حزب<br />وربنا قال في القران اطيعوا الله ورسوله واولي الامر منكم<br />فأنا من رايي عيب انا ادخل مجلس الشعب مستقل لان الحكومة عامله المستقلين علامة على انهم ليس لهم اي انتماء حزبي باي شكل من الاشكال<br />فأنا ارى انه عيب اوي ادخل مستقل وبعد كده اعلن انني ليا انتماء حزبي واشكل كتلة داخل البرلمان (غير قانونية)<br />المهم دا عامل زي الثغرات القانونية اللي يعرفها المحامين اللي بيتحايلوا على القانون فهذا تحايل على القانون<br />المهم<br />بسبب ذلك لغت الحكومة الاشراف القضائي على الانتخابات وابقوا قابلوني بأه على المحطه<br />كان المفروض نواب الاخوان يلتزموا بالاستقلالية داخل البرلمان ويعملوا بشكل فردي<br />لان المسلم صادق ولا يكذب ابدا ولا يتحايل<br />لكن هما طلعوا فالحين قوي فكانت النتيجة الغاء الاشراف القضائي على الانتخابات دستوريا<br />يعني وزارة الداخلية هي اللي حتشرف على الانتخابات وتوته توته وفرغت الحدوته<br />كان المفروض الاخوان يعرفوا دا من نفسهم<br />يعرفوا انهم لما يستغلوا ثغرة قانونية في المجلس الحكومة مس حتسكت وحتخرب عليهم وعلى غيرهم<br />المفروش الاخوان المسلمين يدوروا على مرشد كويس يفهمهم ويعلمهم<br />والمسلم لازم يكون اول انسان يلتزم بالقانون ولا يمنع انه اثناء ذلك يطالب الحكومة بتطبيق الشريعة الاسلامية"
archived = "2010-03-14"
capture_url = ""

