subject = "نتيجه طبيعيه لعشوائية الفضائيات"
author = "علياء"
posted = "2008-04-01"
text = "الموضوع جيد لانه عرض الفكره بشكل متزن و رصد امر اصبح بالفعل ظاهره حيث اصبحت الفضائيات مرتع لكل من هب و دب ليكون حلال المشاكل فنجد شخصيه غير متزنه مثل سماح انور ادعت انها تبنت طفلا يتميا و بعد عدة سنوات اعترفت بلا خجل او حياء انه ابنهاو تدعى قدرتها على حل المشاكل اتعجب كيف نقبل ان نستمع الى عقليه بهذا الإنحطاط الاخلاقى"
archived = "2008-04-04"
capture_url = "https://web.archive.org/web/20080404045921/http://masr.20at.com:80/newArticle.php?sid=14976"

