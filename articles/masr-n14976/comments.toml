text = "ميرو موضوعك هايل بصراحه يا جميلة على فكرة انا نفسي أشوفك خالص لأنك لذيذه وده واضح من شقاوة موضوعاتك معلش اني بدلعك بس انا حاسس انك زي اختي ممكن تضيفيني على ميللك انا ميلي samer122_2@hotmail.com"
