posted = "2008-04-08"
text = "لموضوع تم تناوله بشكل جيد واعتقد ان بثينة كامل من أفضل من يقدم هذه النوعية من البرامج ويحسب لها استعانتها بطبيب نفسي في برنامج ارجوك افهمني اما بالنسبة لاسامة منير فمن الممكن ان يقدم البرنامج بشكل افضل في حالة انتقاء المكالمات والابتعاد عن من هم في سن 15 عام"
