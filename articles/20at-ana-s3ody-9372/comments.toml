[[comments]]
order = 3
subject = "مستحيل"
author = "ابراهيم"
posted = "2008-07-01"
text = "اما انا فاشك ان يتغير القوم ونظامهم الاستبدادي في هذا البلد العجيب لاكثر من سبب وباختصار هؤلاء يجري في عروقهم اسعباد الناس وفي وقت كان الرق جرء من غابر التاريخ كان هؤلاء يبعيون في البشر حتى 1962 ولايزال تجار الرقيق احياء في بلادهم يحنون لذلك الماضي القريب .. الغريب ان هؤلاء يدعون الدين بل جعلوا من انفسهم اوصياء لدين الله. ولاتقل لي علماء وفتوى هؤلاء اجهل الناس بالدين وهم علماء سلاطين يفلحون فقط في تكفير الاخرين .. عموما الذي يذهب الى بلاد البدو الاجلاف يستاهلون أكثر من هذا .... بالله عليكم طبيب مصري درس الطب 6 سنوات وله خبرة سنوات في خاتمة عمرة يذهب ليعمل موظف عند بدوي إإإ تصوروا صاحب المستوصف بدوي تعطية حكومة التخلف ترخيص لفتح مستوصف!!"
archived = "2010-03-14"
