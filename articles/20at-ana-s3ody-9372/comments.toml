[[comments]]
order = 2
subject = "كفلاء الإنحطاط ودمار الإنسانية"
author = "أبو عمران"
posted = "2008-06-18"
text = "أين سيذهبون من الله ... والله سوف يجازون على قهر واستغلال ضعاف الناس<br />العامل مسكين يأتي ضعيف يريد لقمة العيش لكن حينما يشاهد جبروت كفيله يصدم ويقول أهكذا يتعامل المسلمين؟؟؟؟؟؟؟ لاسيما إن كان من الأعجميين ماذا سوف ينطق؟؟؟<br />(اللهم أصلح الأمور والهم الجميع الصواب والعودة إلى ما أمرت به يالله)"
archived = "2010-03-14"
