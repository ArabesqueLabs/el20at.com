[[comments]]
order = 0
subject = "أين الوطن؟"
author = "مطحونين في الغربة"
posted = "2008-06-18"
text = "نتغنى فقط بأوطاننا ولكن عند الجد لا نجدها<br />داخل الوطن لا نجد فرصة عمل<br />داخل الوطن نجد الغلاء الفاحش<br />داخل الوطن لا نجد رغيف العيش<br />داخل الوطن نحن غرباء أيضا<br />مهما كان فالكفيل أرحم مما يحدث لنا في أوطاننا"
