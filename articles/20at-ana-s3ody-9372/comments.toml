subject = "الله يفكنا من شرهم"
author = "ولد nice"
posted = "2008-06-18"
text = "الله يفكنا من شرهم في القريب العاجل باذن الله ..<br />ذلونا الله يذلهم .. قولوا آمين<br />يقول عمر رضي الله عنه: (متى استعبدتم الناس، وقد خلقتهم أمهاتهم أحرار )<br />ياويلهم من رب العباد يوم لا ينفع مال ولا بنون .."
