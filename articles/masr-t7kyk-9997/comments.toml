[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-09-03"
text = "متهيالي مفيش وجه للمقارنة<br />اعمال البر في رمضان وغير رمضان هيه جزء اساسي من اعمال الاخوان وبيعملوها من منطلق المفهوم الشامل للاسلام<br />بينما في المقابل الحزب الوطني بيعملها الان والان وفقط بهدف سحب البساط من تحت الاخوان<br />يبقي فين وجه التشابه اصلا وعلي اساس كان اختيار عنوان الموضوع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "رمضان كريم"
author = "اسماعيل الجمل"
posted = "2008-09-03"
text = "حلو قوى يا محمد ايوة كده بقيت تبص للمواضيع من وجهة نظر تانية انا شايف زى ما كانوا بيضحكوا علينا فى العربى ويقولوا تضاد يبرز المعنى ويوضحه ورغم ان المعنى واضح الا ان النية هى اللى مش واضحة واحنا مش بتوع حد يا استاذ محمد على العموم موضوع جامد جدا واتمنى انه يحصل ايام الانتخابات بدل اليفط القماش اللى ملهاش اى لازمة غير انها تبوظ شكل الشوارع ممكن بدلها تتوزع هدوم تدفى الناس المحتاجه وبرضة ثواب وبرضه تعليق رفيع كده لما اجى اعمل حاجة لله مش لازم اكتب على ضهرها فلان الفلانى ممكن نكتب فاعل خير وربنا يوفق الجميع ومستنين موضوع جديد يا استا ذ محمد"
archived = "2010-03-14"
