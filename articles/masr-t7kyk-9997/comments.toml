[[comments]]
order = 0
subject = "كل اللى ييجى من الصعايدة فايدة"
author = "ياسين"
posted = "2008-09-03"
text = "الاخوان دول ناس من الشعب رزقهم حلال وطعامهم حلال وبيعرفوا ربنا والقادر منهم بيتصدق تحت شعار ويطعمون الطعام على حبة مسكينا ويتيما واسيرا انما نطعمكم لوجة اللة لا نريد منكم جزاءا ولا شكورا<br />اما بتوع الوطنى<br />فلوسهم منين<br />حلال والا حرام<br />جاية من فنادق الشرم وخمارات ومواخير الغردقة<br />والا من الاحتكار والمتاجرة باقوات الناس<br />والناس بتاخد شنطة الوطنى تحت الشعار الشعبى الشهير خد مال الظالم وادعى علية<br />وشكرا لكل المحسنين من شعبنا على اهلنا الفقراء<br />وربنا يزيد الخيريين ويحط فى قلوبهم الرحمة ويطعموا الناس لقمة حلال<br />واهم حاجة هى الحلال"
archived = "2010-03-14"
