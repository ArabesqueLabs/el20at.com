subject = "ضع عنوان التعليق"
author = "سند"
posted = "2008-09-27"
text = "اعمال الاخوان الخيرية ليست مقتصرة فى رمضان فقط ولكن الاخوان دائما يسعون لفعل عمل الخيرات وان كان الحزب الوطنى يقلد الاخوان فى شنطة رمضان فاعلموا ان الفرق هنا النية فالاخوان يريدون الثواب من الله والحزبالوطنى يفعلها لاغراض شخصية والله اعلم"
