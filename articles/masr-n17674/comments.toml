[[comments]]
order = 0
subject = "خطفوهم لية ؟"
author = "ابو الزغاليل"
posted = "2008-09-23"
text = "العيال اللى خطفوهم عايزين يبقى لهم كم ارنب فى البنك - زى رجالة البيزنس - وكم فيلا فى من اللى بيطلعوا فى اعلانات القاهرة الجديدة - وبعدين فية رجالة برضة خطفوا ارض الساحل الشمالى وخطفوا مليارات من البنوك<br />على العموم بعد كم ساعة هيطلع واحد فى التليفزيون من قسم التصفية الجسدية بتاع الداخلية يقول لك تبادلنا اطلاق النار مع المجرمين وقد ماتوا جميعا وتم الافراج عن جميع الرهائن وقد عثر مع المجرمين على سلاح امدة بهم ابن لادن وقرشين حشيش من عند حزب اللة"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233402/http://masr.20at.com:80/newArticle.php?sid=17674"

[[comments]]
order = 1
subject = "المختطفين فيهم ستات وحريم والا"
author = "سامر"
posted = "2008-09-23"
text = "ماهو رحلات السفارى فى الصحراء الخالية لازم يبقى فيها شىء من الترفية<br />والعيال اللى خطفوهم لازم شافوا حاجة كدة والا كدة<br />وبعدين ممكن السياح نفسهم يبلغوا انهم مختطفين علشان يحصلوا على تامين ورعاية خاصة زى ما حصل قبل كدة فى جبال اليمن"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233402/http://masr.20at.com:80/newArticle.php?sid=17674"

[[comments]]
order = 2
subject = "يا وزارة الداخلية المصرية روحوا اتعلموا البحث الجن"
author = "محسن منير السكري"
posted = "2008-09-23"
text = "انا قرأت الكلام الفارغ اللي مكتوب فوق<br />الخلاصة يعني ما حدش عرف يقبض على الخاطفين ولا عرفتوا مكان المخطوفين<br />احسن حاجه وزارة الداخلية المصرية تروح تبيع ترمس احسن ما يعرفوش غير حاجتين<br />تفريق المظاهرات بواسطة الامن المركزي والقبض على الاخوان المسلمين والجماعات الاسلامية وتلفيق قضايا لهم بواسطة امن الدولة<br />روحوا هاتوا فرقة من شرطة دبي وهي تعرفلكم مين اللي خطف ومكان المخطوفين في 12 ساعة فقط<br />انا سافرت دبي وقتلت سوزان ورجعت تاني وافتكرت نفسي واحد شاطر في خلال خمس ساعات فقط اتقبض علي في بلدي وبين اهلي وناسي<br />هي دي الشرطة ولا بلاش<br />يا شرطة مصر روحوا اتعلموا العمل الشرطي والبحث الجنائي من شرطة دبي<br />سلام"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233402/http://masr.20at.com:80/newArticle.php?sid=17674"

[[comments]]
order = 3
subject = "فى ستين مليون داهية هم موش مصريين؟!!!"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-24"
text = "و اية يعنى<br />ما نقول انهم كانوا فى سفارى لزيارة صحارى و برارى و جبال الدويقة و المقطم<br />بس خلاص ؟<br />توتة توتة و خلصت الحدوتة؟"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233402/http://masr.20at.com:80/newArticle.php?sid=17674"
