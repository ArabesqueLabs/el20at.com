subject = "فراشات وزهور الوطن واولادة المناضلين"
author = "متابع"
posted = "2008-06-29"
text = "كل جيل مصرى من الشباب ولة شباب فى الطليعة<br />شباب الضباط الاحرار قام بالثورة على الملك<br />وشباب المهندسين بنوا السد العالى<br />وبنوا مجمع الحديد والصلب وشركة كيما وقلاع الصناعة فى المحلة وكفر الدوار<br />وشباب المعلمون بنوا نهضة تعليمية فى مصر<br />وشباب اكتوبر قام بالعبور ومنهم عبد العاطى صائد الدبابات الاسرائيلية ومحمد زرد بتاع النقاط القوية لخط برليف<br />وكذلك بطل الطلعة الجوية الشهيد عاطف السادات التى استشهد فى اول طلعة جوية على سيناء رغم انة اخ للسادات وكان من الممكن ان يجلس فى مكتب<br />ثم عندما دخلت مصر عصر النهب والحرامية دخلت مصر النفق المظلم خرج الشباب الصغير من امثال اسراء عبد الفتاح وشبابالمحلة الابطال واصحاب المدونات بحمل راية الكفاح السلمى وهو الوحيد المتاح حاليا<br />واجزم انهم سينتصرون<br />وسيهرب الحرامية<br />وستعيد مصر كل ما سرقة اللصوص ونهبوة<br />الى الامام يا شباب"
