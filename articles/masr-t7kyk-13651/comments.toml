text = "بالتأكيد العقاب البدنى هو من انواع الاهانه التى لا تليق بالانسان الذى كرمه الله و لكن الدنيا تغيرت و اصبح العقاب فعل مخالف للقانون و يعاقب عليه المدرس لما له من اثار نفسيه سيئه على التنشءهو بالنسبه لزمان اعتقد ان هناك عقاب فريد من نوعه تذوقناه جميعا و هو المد على الرجلين و هو فى رايى اكثرهم اهانه."
