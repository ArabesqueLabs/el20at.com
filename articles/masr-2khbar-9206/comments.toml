[[comments]]
order = 1
subject = "كيف تصبح مليونيرا فى ظرف سنتين فى مصر المحروسة ( ح"
author = "فلعوص"
posted = "2008-05-29"
text = "احمد باشا عز رجل عصامى يجب ان يكون قدوة للشباب<br />احمد عز وهو طالب فى الكلية كان فقير معدم وبيساعد نفسة فى الدراسة فى انة بيشتغل طبلجى فى فرقة موسيقية فى احد الفنادق - وهذا لا عيب فية ويشرف اى انسان<br />احمد عز بعد انتهاء دراستة و.... و......<br />قرر يبقى مليونير بفلوس الغلابة اللى زى واللى زيك اللى حطين قرشين فى البنك ينفعوا فى اليوم الاسود<br />ذهب احمد عز الى اوروبا وتعاقد على مصنع للحديد<br />عن طريق احد الكبار بتوع لجنة السياسات كانوا اتقابلوا فى لندن اثناء دراسة عز وشغل التانى هناك فى بنك اخد اقرار بنكى من احد البنوك المصرية بضمان سداد تمن المصنع<br />واتركب المصنع والبنك دفع 200 مليون بدون اى ضمان وكان رأس المال اللى مع احمد عز صفر<br />البنك دفع لة كل حاجة<br />وطبعا احتكر الحديد وكسب مليارات والبنك فلس وعلى وشك البيع وغير معروف ان كان سدد فلوس البنك ام لا<br />الطريق واضح<br />اتعرف على واحد واسطة يعطيك قرض بعشرات الملايين من البنك واعمل مشروع بفلوس الغلابة اللى حطين فلوسهم فى البنك<br />شركة الكيماويات بتاع دمياط جاية من كندا تعمل مشروع بفلوس قرض من البنوك المصرية يا حلاوة<br />كل واحد عندة قرشين فى البنك يسحبهم - ولاد الكلب بيشتغلوا بيهم ويعطوكم الفتات"
archived = "2010-03-14"
capture_url = ""

