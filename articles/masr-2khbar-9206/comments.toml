[[comments]]
order = 3
subject = "كابتن هيكل لو سمحت امته هتفتح ملفات كلاب ثورة يولي"
author = "رامز عباس"
posted = "2008-05-30"
text = "ايه يا هيكول باشا سكت علي ناصر علشان كان ماكلك كويس والسادات علشان كان مظبط الرضعه ودلوقتي لما الرئيس<br />الحالي معبركش جاي تتوعدنا احنا الغلابة والفقراء فينك من زمان يا عم ما عبد الناصر خربها وقعد علي تلها وسلم سيناء لاسرائيل وانت قولت ساعتها انها مجرد حبات من الرمال المهم ان يبقي بطل الابطال جمال<br />يا راجل افتح الملفات وارضي ضميرك ومتعملش علينا مثقف اوى اجدعها شاب من اي حته فقيرة ممكن يسمعلك ملخصات كتب التاريخ والادب والفن وهو فاهمها هيكول احسن لك تخليك مترح منتا واحنا شفنا كتير كشعب الدور علي الحكومه هي اللي هتشوف بقا مهي قرفت المصريين والمصريين مش مضمون تصرفهم سلام يا هكلل"
archived = "2010-03-14"
