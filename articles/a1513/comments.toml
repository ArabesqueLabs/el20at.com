order = 3
subject = "تحليل جميل للسيد أحمد القطب"
author = "علي (الكويت)"
posted = "2008-06-19"
text = "تقبع صور ومشاهد حلقات الجراندايزر في اذهان محبيه من جيل الثمانينات، ففي حلقاته واقع جميل اقرب للواقعية منه للخيال، حيث يتجسد الخير بشخصيات احبوا وأضحوا وعقدوا علي الدفاع عن الحق ونصرة اهله. استخدام تكنلوجيا متطورة في حلقاته والتى بمثابت تكنولوجيا غير متواجدة في تلك الحقبة من الزمن والتي تدريجيا نرى تحقيقها في زمننا هذا لهو نتاج عن عبقرية فذة في مجال الانيمي الياباني ومحققه المبدع (جو نجاي). فعلى سبيل المثال ... عدم السماح لأي شخص آخر لاستخدام آلة (الجرندايزر) إلا قائده (دوق فليد) فهي شبيه بتكنولوجيا (smart Key) او مايسمى بنضام البصمة في المركبات."
archived = "2010-03-14"
