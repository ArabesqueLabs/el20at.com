subject = "ثلاثة ارباع المليون شكوى"
author = "سفروت"
posted = "2007-10-16"
text = "دى حكومة اية اللى مليون الا ربع بيشتكوها<br />وبعدين العدد الهائل من القضايا دة مين اللى هيبص فية<br />التاريخ الفرعونى فية شكوى الفلاح الفصيح<br />وبيقولوا ان لو واحد مصرى لقى ورقة وسخة فى الشارع بيجرى يشيلها فى جيبة ويقول ايهى تنفع نكتب عليها شكوى<br />ايها المصريون الشكوى لغير اللة مذلة<br />كل واحد ياخد حقة با ايدة"
