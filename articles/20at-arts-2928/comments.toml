order = 0
subject = "الحكم عن جهل"
author = "العربى"
posted = "2007-06-22"
text = "كثير من الردود كانت استهزاء بالسعودين وعدم معرفتهم شى اطلاقا لا ادرى مالذى يجعل الكثير من المصريين بهذا التحامل<br />على اخوانهم بالمملكة وكلامى هذا ليس تعميم فهناك منهم من نتبادل معهم الود والاحترام ولكن لفت نضرى هذا الشى فى المواقع المصرية بذات عموما من يقول ذلك يعرف جيدا كيف سيكون وضع الانترنت غلى المستوى العربى اذا سحبت او اختفت المواقع السعودية والاعضاء السعوديين الفاعلين من مواقع ومنتدبات مميزة كثيرة ومتنوعة تهتم بالكميوتر والمساعد الرقمى واهتمماتها التى تتنوع على كافة المور التقنية مثلا نشر دين بكل الوسائل الممكنة الى الاهتمام والابداع فى امور مثل. برامج وبرمجة وتقنية وتصميم مواقع وبرمجة برامج بجهود شخصية وترفيه وطاقات الشباب السعودى الكبيره فى تعريب وشرح وترجمة انضمة تشغيل ونقلها وتطويرها بما يناسبنا ونشرها ليستفيد منها كل العرب رغم انا نسبة مستخدمين النت تمثل واحد فى المية من عدد السكان بسبب احتكار الاتصالت والمبالغة الكبيرة فى اسعار نقل بيانات الانترنت وعدم الجدية من ادارة التعليم فى نشر التعليم التقنى بشكل مرضى فى البلد ومع ذلك الطاقات القليلة التى حصلت على الفرصة لممارسة هوايتها اعطت بعد كبير وثراء وافضل من الكلام والثرثرة المرضية قم بجولة فى المواقع والمنتديات الكبيرة العربية فى كافة المجالات وستعلم من قام ببناها ودعمها ومن ثما تطويرها وتميزها"
archived = "2010-03-14"
capture_url = ""

