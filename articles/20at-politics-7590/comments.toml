subject = "إلى الأخ أدرني وبس"
author = "مصري وبس"
posted = "2007-11-14"
text = "اشكرك على استحمال ثورة غضبي لبلدي، ولكن يا اخي فاض الكيل، هو مفيش غير مصر، خلونا مرة واحدة نحس إن انتم معانا مش ضدنا.<br />أنا شعرت بإهانة من السخرية بالرسومات. على فكرة أول من نشر هذه الصور، هما شباب مصر الأحرار المدونين، اللي طلعوا باسمائهم وصفاتهم وتحدوا الظلم والتعذيب، والواجب شكر هؤلاء على جرعة الحرية اللي فتحوا بيها البيبان للناس واللي اتكللت جهودهم بالحكم على المعذبين بالسجن<br />مرة تانية، انا لم أقصد شخص محجوب، ولا الأردن .. لكني دافعت عن بلدي<br />والله تعالى يقول ( لا يحب الله الجهر بالسوء من القول إلا من ظلم) وانا الحقيقة أشعر بظلم العرب لمصر وربنا يخيب ظني"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "لايجب"
author = "اماراتي"
posted = "2007-11-14"
text = "السلام عليكم ورحمة الله وبركاته<br />اشكر القائمين على هذا الموقع<br />ومن وجهة نظري ان الرسام المحترف اخطاء برسم هذا الكاركتير<br />لانه قلل من الجهد المبذول في جمهورية مصر العربيه وقلل من اهمية اللعاب بين الاخوه العرب<br />واعتقد ان الرسام عايش في فترة الستينات لانه الرسومات الي رسمها ادل على حقبه سالفه واعتقد ان هذه الانهاكات قد توقفت واكل عليها الدهر<br />يجب علينا ان لانقلل من اي مجهود قامت به اي دولة عربيه وان لانكون متشائمين بل العكس يجب علينا ان نشجع معنويا ومادياً من اجل نجاح مثل هذه التظاهرات الرياضيه التي قد تنعكس على السياسه العربيه وتنجح<br />ومن وجهة نظري لايحق لاي رسام او اي شخص ان يقلل من شأن اي دولة كانت فهذا يثير الحساسيه بين الشعوب وخاصة بين الاخوه<br />اطيب التحايا"
archived = "2010-03-14"
