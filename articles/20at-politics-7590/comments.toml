[[comments]]
order = 16
subject = "إلى محمد نواف(مش هدافع عن صاحب التعليق الأول)"
author = "مصرى -عربى"
posted = "2007-12-11"
text = "يا سيدى الفاضل<br />رسام الكاريكاتير /عماد حجاج فى رسومه بيهاجم الأنظمه الأمنيه فى مصر و الفظائع اللى بيرتكبوها و دى حاجه معروفه لينا كشعب و معترفين بيها و الصحافه عندنا بتفضحهم كل يوم و بتسخر من اللى بيدافع عنهم<br />يعنى اللى عايز أقوله ان المعلومات عن الفظائع و السلبيات فى مصر معروفه لينا قبل ما تكون معروفه على مستوى العالم العربي و ده نتيجة أن فيه صحف عندنا قادره على أنها تقول رأيها بصراحه و تنقد النظام<br />احنا كمصريين عندنا القدره على نقد انفسنا و مواجهة سلبياتنا و السخرية على أنفسنا برضه إذا لزم الأمر<br />انما اللى بيستفزنا قوى هو تفرغ بعض الصحفيين فى باقى الدول العربيه على مهاجمة مصر و فضح السلبيات داخلها اللى احنا عارفينها و احنا اللى موصلينها للصحفيين دول و كأن أنظمتهم العربيه كامله بدون أى أخطاء أو سلبيات<br />تفرغوا لنشر السلبيات داخل المجتمع و نقد كل تصرف تقوم به الحكومه المصريه رغم وجود العديد من السلبيات حولهم فى دولهم و أنظمتهم لكنهم عاجزين عن التصريح بها حتى لأنفسهم<br />و لو مش مصدق سافر دوله عربيه شقيقه زى المغرب و شوف و صدقنى هتشوف العجب<br />انت تصدق أن دوله عربيه زى المغرب قدمت طلب إلى الاتحاد الاوروبى للإنضمام لهم و كأنهم بيتنصلو عن عروبتهم<br />حد من الصحفيين الأفاضل اللى تفرغو لمهاجمة مصر اتكلم ساعتها أو حتى ناقش لاموضوع و لو حتى على سبيل الدعابه فى أى جريده<br />اللى عايز أقوله فى الأخر أنى بأستفز قوى كمصرى لما شخص من دولة أخرى يتكلم بالسخريه عن بلدى و كأن بلده هى الجنه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 17
subject = "على راسي يامصري .. أنتا والشعب المصري .."
author = "محمد نواف الحمدالله ..."
posted = "2007-12-12"
text = "ياعزيزي أنتا إنسان كبير ومحترم .. والواحد ببين من طريقة كلامو .. بس بتعرف شغله ياخي كلنا بالهوا سوا ..<br />وأنتا أكيد فاهمني وعارف قصدي منيح .. ؟!!!<br />والله محي أصلك . وفي إشي كمان يا عزيزي نسيت احكيلك عنو ( موضوع الفلسطينية اللي بالأردن ) .<br />يا كبير الفلسطينية اللي بالأردن عايشين عنا عيشة شريفة كريمة ومحترمة وقديرة .. وأكر دليل على هاذ الإشي أنك لما تسأل أي واحد فلسطيني ( بس يكون ابن حلال وبفهم ووواعي .. مش تسأل كل ماهب ودب ) .. حيكيلك أنو فضايل وعطاءات الأردنيين ( حكومة وشعباً ) على الشعب الفلسطيني الشقيق لاتعد ولا تحصى ولكن لازم يكون في ناس ( وهاذ أمر وارد وطبيعي ) أنهم يخلقوا فتنة وعنصرية .. ويسوا مشاكل ونعرات قبلية بين الصفين ( الأردني والفلسطيني ) .<br />بس لابد للحق أن يحق . والحق حق وبنقال ولو على قطع رقبة ( أخي صححلي معلوماتي إذا أنا غلطان ) .<br />وشغلة ثانية بحب أظيفها أنو الشعب الفسلطيني غير أنو عايش بالأردن .ز وأسضاً فهو يتمتع بالجواز الأردني ( زيو زي الأردني بالضبط ) . وهاذ إشي مأكد ومفروغ منو . ولكن لاتنسى أنو الشعب الفلسطيني ( بشكل عام ولا أخص أحداً بالذكر )<br />أنو شعب لا بستنى مني أو منك أو من أي حدا عشان يحن ويعطف عليه .. أو أنه يمنن عليه بنعمتو وجميلتو عليه ..<br />لا يا كبير الشعب الفلسطيني شعب عظيم وكبير وواعي وهو أدرى بمصلحته تماماً .. والأردنيين والفلسطينيين أخوة .. وأنا هونه لما بحكي أخوة يعني مش بالمعنى اللي بكون بذهنك ( علاقة الأخ بأخيه ) .. لا بل العلاقة فوق هيك بكثير .. ولك حنا والفلسطينية عايشين مع بعض والأكل الي بينا واحد والألم واحد والجرح واحد والثورة والنضال والكفاح والعطاء واحد ... الخ<br />والله العظيم ومابذل عليك بحرف أنو أنا لما كنت بالجامعة ( حالياً أتدرب علي يد محامي لمدة سنتين ) .. كنا مجموعة شباب اللي كان منا أردني أو فلسطيني أو غيرو .. ماكان بينا تفريق أو تمييز عنصري لا بل بالعكس حتى معظم الشباب اللي كانوا معاي ساكنيين معاي بسكن الجامعة وعلاقتنا كثير حلوة وقوية حتى والله لدرجة بتفكر أنو حنا مش أصحاب أو حتى أصدقاء لا بتعتبرنا أخوة بحق وحقيق .. لأنو الإنسان بطبعو اجتماعي ولازم يعيش وسط ناس .. حتى يقدر يكمل حياتو .. وبرد أكرر وأعيد أنه لايوجد تمييز عنصري في الأردن بين الأردنيين والفلسطينيين .. وأنا ما بنكر أنو في فئة من الأردنيين عندهم التعصب العشائري أو القلبي ( اختار الإسم اللي بريحك هههههههه ) .. ولكن يعني ما بتجاوز أعداد أصابع أيدك الوحده .. يعني ومن الأخر كلنا أخوان وكل الناس خير وبركة .. وكلنا ولاد تسعة . ولايوجد حدا أحسن من حدا ( صح كلامي يا أخي العزيز ) . وكمان أزيدك من الشعر بيت .. لما قال الشاعر الكبير ( معلش نسيت اسمو ههههههه ) :<br />ليس الغريب غريب الشام واليمن *** إن الغريب غريب اللحد والكفن<br />وبيت ثاني لأمير الشعراء / أحمد شوقي في قصيدة \" نكبة دمشق \" لما قال :<br />نصحت ونحن مختلفون داراً *** ولكن كلنا بالهم شرقُ<br />ومشكور مرة ثانية .. وآسف إذا بدر مني كلام مسيء لألك بالأخص أو للشعب المصري بشكل عام .. وحياك ببلدك الثاني (( الأردن أولـــــــــــــــــــــــــــــــــــــــــــالممكلة الأردنية الهاشمية ــــــــــــــــــــــــــــــــــــــــاً )) . انتهى ،،،"
archived = "2010-03-14"
