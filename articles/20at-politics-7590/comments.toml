[[comments]]
order = 18
subject = "تحية إلى الشعب المصري الشقيق , وكووووول خرا يا بن"
author = "عاشق فلسطين"
posted = "2008-06-02"
text = "السلام عليكم ورحمة الله وبركاته ,إخوتي الكرام أريد أن أذكركم فقط بأن محمد نواف الحمد الله هو أردني أصل , ولكن أريد أن أثبت لكم فقط بأن أسفل شعب بالعالم كلو هم الشعب الأردني , مع إني أنا أردني من أصل فلسطيني , لكن لا تنسى بأن هناك تمييز وعنصرية كبيرة ورهيبة جدا بالأردن , وهي التمييز بين الأردني الأصل والأردني من أصل فلسطيني ....................<br />إخوتي أريد أن أثبت لكم فقط بأنو الأردني لا يمكن أبداً بأن يحب الفلسطيني , فهما شعبان متضادان ولا يمكن أن يلتئمان لماذا؟ كله بسبب أفعال وأخلاق هذا الشعب الحقير المشين بقيادة ملكهم المخنث الحقير السافل العميل , ولا تنسوا إخوتي الكرام<br />ما فعله الكلب القرد المخسوف بقبرو الملك حسين الله لا يرحمو البعيد في قبرو عندما قتل 33 ألف فلسطيني بالضفة الغربية<br />في أحداث أيلول الأسود , وشربهم من الشخ وأكلهم الخرا وكان محوط وحايط الضفة الغربية في جحيم وعذاب و وصدقت أخـي<br />مصري وبس عندما قلت بأنو الأردنيين هما أساتذة التعذيب , لكن الحمد لله الفلسطينيين داعسين على رقاب الأردنيين في الأردن<br />كلها حيث نحن 3 مليون فلسطيني بالأردن و400 ألف أردني معفن مش كلهم برضوا ... إخوتي الكرام : لولا الله العظيم ثم وجود الفلسطينيين الآن بالأردن ولا كانت الآن الأردن هي أخزى دولة على وجه الأرض , إخوتي الكرام : أريد فقط بأن أريكم نموذجا من نماذج الحقير السافل المنحط الواطي الساقط محمد نواف الحمد الله الذي قام بسب الفلسطينيين سباً قوياً وشتمنا بكافة أنواع الشتائم , ووصل به أن يعاتــــــب الله سبحانه وتعالى وحاشاه بأن الله هـــــــو الذي جمع كل أوساخ الدنيا وأنجاسها ووضعها بالفلسطينيين لكي يبتلي الأردنيين والله يا أخــــــــــي .......<br />إخوتي الكرام : لا أريد أن أتحدث كثيرا , ولكن اكتبوا بالبحث : (((((ارفع رأسك أنتا فلسطيني))))) واضغط على أول رابط , أو<br />بالأحرى هذا هو الرابط : http://www.20at.com/newArticle.php?sid=12273<br />لقد وجدنا أذىً رهيبا والله بالأردن من قبل الأردنيين , وأن أساس العنصرية والفلتان التربوي الفظيع هو نابع من أخلاق هذا الشعب السافل الحقير , وهذا الحقير الذي يقول بأن الفلسطينيين لا يجدوا ما يأكلونه , ولكن انظر من الذي جعل للأردن سمعة على الساحتين العربية والعالميـــــة في نفس الوقت , وأن جامعات الأردن الآن من أقوى جامعات العالم كلها , لماذا ؟<br />لأن كل العاملين فيها فلسطينيين وكل مدراء الجامعات ووكلائها وأساس قوتها ومتانتها وصلابتها وسمعتها هم الفلسطينيون ؟<br />فـللفلسطينيين أفضال كثيرة جداً على الأردنيين , بعد أن كانوا مجموعة بدو حثالة مشردين , وتذكروا بأن أغلب أصحـــــــــاب<br />الشركات والمؤسسات والبوابات السياحية هم فلسطينيون بالأساس , وهذا شئ لا يمكن إنكاره أبداً أبداً , لكن ادخلوا على<br />الرابط , وانظروا أول تعليق , فالسافل الخسيس محمد نواف الحمد الله له أربع أسماء ولا تؤاخذوني على بعض أسمائه النتنة :<br />الأردني , وأردني من السلط , ومشتهي نيك الفلسطينيات , نياك الفلسطيزية من الأردن , وأنا قد قمت بتهكير كمبيوتره واكتشفت كل هذه الأسماء , لذلك هو الآن قد منع نفسه من الدخول بعد أن قمت أنا بتهديده , انظروا كيف قام بالسب والشتم الفظيع التي تدل على أنه حيوانا لا يفهم ولا يتفاهم , وأنه قد نشأ وترعرع على قمة السقاطة والوطاوة والنذالة , ولم يكتف بذلك فقط , ولكن أنتم تعرفون بل وأعرف مني بأن أهل الأردن 98% من أهل البادية , وأهل البادية كما قال الله سبحانه وتعالى عنهم :<br />{الأعراب أشد كفراً ونفاقاً} فلا تستغربوا من هذا الحقير وغيره من الأردنيين السفلة بأن يقولوا لكم مثل هذه الأقاويل , فقد<br />سمعناها كثيرا منهم , فهم يتكلمون بمعسول الكلام , وهم أنفق ناس على وجه الأرض , وشكرا جزيلا لكم , ولكــــــن<br />أرجووووووووووووو من الجميع الدخول على الرابط واحكموا بأنفسكم , فأول تعليق وااااااضح وكافي على قمة الخنزرة والوقاحة<br />التي وصلوا إليها من خلال تعليقاتهم , الذين يقولون نحن الشعب الوحيد الذي تربى وترعرع على الأصالة والبداوة , ولكنهم في الحقيقة تربوا على السقاطة والممحنة وقلة الحياء , وشكرا جزيلا لكم وآسف على إطالة الرسالة , ولكن ما كان بقلبي أعجز من أن يكتبه القلم , واعذروني على الإطالة ....................<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ :::: ملاحظة خاصة :::: ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />يا محمد نواف الحمد الله , يا شيخ والله لأشرشحك وأخلي الكل يتف عليك , كفاية إنك أصلاً متفوف عليك ومدعوس عليك بالجزمة وعلى كل الأردنيين تبعونك يا بن الكلب , لسة والله لأخلي اللي بسوى واللي ما بسواش يدعس على رقبتك غصبا عنك يا كلب<br />يا واطي , ولأفضح بعرضك وشرفك يا شراري يا أردني يا معفن , واحد بـــــــــــــــــــــــــــدوي منافـــــــــــــق ,,,,,,,,,,,,,,,,,,,<br />البدو أنذال شُعث غبر الوجوه ان أمنتهم خانــــــــــوا<br />وإن شبهتهم بالكلب صاح الكلب لا بشعرة في ذيلي بألف ألف ترباني<br />الشعب الأردني شعب كلو خرا من السفلة والحقرا بستاهل ينداس بالصرماية القدييييييييييييييييييييييمة<br />وعلى العموم >;>;>;>;>;>;>;>; أنا فلسطيني وبحكيها بكل فخر , واللي مش عاجبو سيعتها بكون ماسحو عن الوجـــــــــود ......<br />واعذروني يا إخوة على الإطالة ولكن !!!!!!!!!!!!!!!<br />وللحديث بقية ودمتم بود .....<br />:::: عاشت فلسطين : من الفاء للنون , ومن النهر للبحر ::::"
