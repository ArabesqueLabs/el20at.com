[[comments]]
order = 7
subject = "مين ده"
author = "اكتب اسمك هنا"
posted = "2007-12-10"
text = "إلى الشىء الزباله اللى أسمه محمد نواف<br />ماظنش أن فيه حد قبل كده تطاول فى مناقشه لدرجه أنه يسب الأهل (الأم و الأب )<br />بس عشان انت كائن غبي و حمار و متخلف و فاقد للمنطق فى الكلام لجأت للأسلوب الرخيص ده فى الكلام<br />شخص وضيع فعلا و ميصدرش منه إلا كل ما هو وضيع مثله<br />و لو انا هاتبع نفس منطقك فده معناه ان كل الشعب الأردنى زيك و لو أنى عارف انه مش متخلف و حمار زيك و ده لأنك شىء مجرد شىء بس قذر<br />انت ماتستحق حتى عناء الكلام معاك لأن الكلام أو المحاوره معاك معناها أن ده قمه الجهل منى<br />و إلى إدارة الموقع لو سمحتم لا تنشروا كل تعليقات الأعضاء أو على الأقل نقحوها و لو ده هيكون فيه تعب أقترح أن كاتب المقال يكون هو المسئوول عن ما ينشر و ما لا ينشر من تعليقات<br />عشان مش كل حيوان متخلف زى ده افتكر ان عنده مخ بيفكر و أنه الوحيد اللى المبصر وسط العميان يكتب و يسب زى ما هو عايز"
archived = "2010-03-14"
