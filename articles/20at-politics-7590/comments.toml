[[comments]]
order = 8
subject = "إلى أخو العاهره المصري المخمج .."
author = "محمد نواف الحمدالله .."
posted = "2007-12-11"
text = "إلى ابن الحماره المنيك ابن الحرام ابن الزبايل .. أنت على أي أساس بتغلط على الأردنيين يا أخو الداعره الشرموطه .. ولك أنت لو فيك ذرة رجلوة كنت بتحكي هالكلام بوجهي .. مش من ورا الكمبيوتر يامره .. اسمع ياعرص ولك أنا زيك وعشرة من أمثالك بمرقهم من تحت باطي وولاحدا بدري عنهم بإشي ..<br />وياقرن الأردن أولاً دائماص وأبداً .. وفوق راسك دايماً .. ورح تظل فضايل جلالة سيدنا الملك فوق راسك وراس اللي خلفوك ..<br />وانت واحد نكره .. ومابتسوى قشرة بصله .. ولك اختفوووووووووووووووووه عليك وعلى شرفك المندعس عليه مليون مره ومره .. ونصيحه من واد بحب ينيك أختك كل يوم .. تلعبش معاي ماشي روح إلعب مع اللي قدك .. انت شكلك واحد فاظي وماعندك سولافه .. واعطيها شرده .. لأني لو شفتك في يوم من الأيام اعتبر حالك اكلت منسف هههههههههههههههههههههههههههههههه .. كس أممممممممممممممممك برعايتي"
archived = "2010-03-14"
capture_url = ""

