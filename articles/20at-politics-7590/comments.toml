[[comments]]
order = 13
subject = "يا أستاذ محمد نواف"
author = "اكتب اسمك هنا"
posted = "2007-12-11"
text = "انا ما بدأتش بالغلط<br />انت اللى بدأت و سبيت حتى فى ردك على صاحب التعليق الأول أستخدمت ألفاظ ماكانش يجب أن لأى شخص محترم يستخدمها<br />و حتى فى ردى عليك ما كانش فيه أي نوع من الغلط ولا السب لا فى الأهل و لا فى شعب الأرن زى ما أنت ادعيت<br />انا سافرت الأردن و ليا أصدقاء هناك كمان و مفيش حد فيهم بيتكلم بالأسلوب اللىأنت بتتكلم به ده<br />راجع كل ردودى الأولى لك هتلاقى انى ما غلطت لا فى الأهل و لا سبيت فى أحد<br />انا بحترم شعب الأردن جدا و بحترم الأردنيين اللى عايشين هنا فى مصر قوى و عمرى ما حسست حد فيهم أنه غريب هنا<br />زى ما انا عمرى ما حسيت انى غريب فى الأردن<br />أنما السؤال هنا بقى لك<br />ليه الهجوم الجارح ده على المصريين و السب فى العرض و الشرف فى مناقشه مفتوحه يفترض فيها عدم إستخدام الفاظ مباشرة تسىء إلى الأخر ؟<br />جاوبنى على السؤال ده لأنى بجد مش فاهم إذا سمحت"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 14
subject = "طيب ياكبير .."
author = "محمد نواف"
posted = "2007-12-11"
text = "يا أخ إذا أنتا شايف التعليق الأول أنو الأخ المصري قاعد عم بسب ع الرسام الكاريكاتر الأردني/ عماد حجاج \" أبو محجوب \"<br />وفوق هيك قاعد عم بغلط ع الأردنية أنهم ناس مابفهموا وناس لئما .. لا ياأخي حنا مو هيك ولكن في ناس مابتحب الخير للأردنيين .. عموماً .. أنا الصراحة ما غلطت بس كنت برد عليه (( السن بالسن والعين بالعين والبادي أظلم )) ..<br />هسه بالله عليك إذا واحد بسب على بلدك ولا على أهلك ولا ع أختك بالذااااااااااااات . بتسكتلو<br />لا والله ماظنيت .. أكييييييييييييييييييييييييييييد مليون بالميه مش ررح تسكتلو صح ولا أنا غلطان ياكبير..<br />ع العموم حصل خير .. وشكراً"
