[[comments]]
order = 5
subject = "إلى الأخ محمد نواف"
author = "مش مهم الأسم أنا مصرى و خلاص"
posted = "2007-11-25"
text = "أيه يا عم الحوارات دي<br />تاريخ أيه اللى نقرأه كويس و هو فيه كتاب تاريخ واحد بيتكلم عن الكلام الفاضى اللى أنت بتقوله ده<br />ثم تعال هنا يا عم العبقرى المثقف جبت منين المعلومات القيمه المهمه الرهيبه دي عن المؤامره الأسرائيليه الأمريكيه اللى حصلت و بين حسنى مبارك عن مؤامرة أغتيال السادات أيه المرجع بتاعك أساسا ولا هو كلام مجعلص واحد محفظهولك عشان تقوله و خلاص<br />و هو حضرتك مابتفتكرش فى التاريخ الملووح اللى انت بتقرأه غير الأحداث الحقيره بس يعنى مقرأتش ولا لسه ماوصلتكش معلومة ان الجيش المصري هو الجيش الوحيد على مستوى الجيوش العربية اللى قدر يحقق إنتصار على أسرائيل فى مواجهه مباشرة (فى الوقت اللى تم تبليغ موعد الهجوم على القوات الأسرائيليه من ملككم الرائع رحمه الله بقى الملك حسين و دي معلومه انا مش متأكد منها بس يقال أنها حصلت فعلا و سمعتها من أكثر من شخص)<br />يعنى اللى عايز أقوله من الأخر بلاش هبل و كلام عبيط من غير أساس<br />و على فكره منطقك غلط تمامايا أخ فى النقطه اللى أنت قلتها انى لو رحت الأردن مثلا و أتسرقت هقول أن شعب الأردن كله شعب سيء ، ده منطق ناس مابتفهمش و لامؤاخذه انا عمرى ما أحكم على شعب بحاله من حادث فردي حصل لي<br />و النبي يا ريس أقفل بقك و بلاش موضوع التاريخ اللي بيسجل ده لأن واضح ن أخر حاجه قرأتها كانت مجله ميكي ماوس أو يمكن مجلة حواء مش متأكد و الله"
archived = "2010-03-14"
