[[comments]]
order = 4
subject = "إلى صاحب التعليق الأول (( لمو لسانكم شوية )) .. مص"
author = "محمد نواف الحمدالله ..."
posted = "2007-11-20"
text = "أولا مرحبا ع الجميع .. بالنسبة للأخ المصري اللي كان بنتقد أبو محجوب وبشكل غير طبيعي وقاسي جداً وفيه إهانه وتجريح بحق هاذ الشخص، أنا بدي أسألك يا مصري بينك وبين أبو محجوب عداوة .. الزلمة قتلك أبوك ولا أخوك ولا أي حدا من عيلتك يعني .. أنا إنسان بكره إشي أسمو (( عنصرية )) .<br />ثانياً يا مصري أنتا ما عندك أسلوب بالحكي .. واسمحلي بهالكلمة (( تفكيرك تفكير محدود )) .. إنتا إذا شفت واحد من أي بلد عربي أو غربي .. وكان هاذ الشخص إنسان وضيع وسافل وووسخ وماعندو جنس الإحترام والتقدير، والعكس صحيح .. ع طول بتحكم ع بلدو وبتجمع الناس زيو .. لا يا مصري هاذ مش أسلوب ناس فاهمه وواعيه .. هاذ أسلوب غجري .. نوري ..<br />أو بالأحرى أسلوب بهيمي (( حيواني ))، أنتا عارف منيح إنو الأردن .. من أكثر الشعوب كرماً وشرفاً وعزةً وضميراً وكبريائاً ... الخ، طبعاً هاذ إشي مفروغ منو // أكيد // .<br />وبنالنسبة لموضوع الفلسطينيين .. فثق تماماً .. وتأكد تأكداً يقينياً بأنو الفلسطينية اللي عايشين بالأردن عايشين عيشة ممتازة .. ومابنقصهم إشي .. بالعكس حنا بالأردن مافي عنا هوه أدرني وهذاك فلسطيني، لا يا مصري، حنا عنا كل الناس متساويين مافي حده أحسن من حده .. وأكيد بتكون المعاملة للأولوية .. وأنا مابنكر أنو عنا بالأردن الأولوية لإبن البلد في الأشياء الأساسية (( الضرورية ))،وهاذ مش معناتو إنو الفلسطينية مافي إلهم حقوق وواجبات بالعكس تماماً .. وأنتا فاهم يا مصري، يعني لو يجي عندكو واحد من بلد ثاني (( يعني وافد بالنسبة للمصريين )) .. وأنتو المواطنيين الأصليين . وهاذ الشخص عندو شهادات وماشالله عليه بتعينوه ف مركز مهم وكان في واحد مصري زيو // مين بتعينوووووووووو ؟؟؟!!!!! // . أنا بجاوبك أكييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييد وميه بالميه إبن البلد .. يعني إشي بدوش حداقه ..<br />وكمان شغله يامصري .. ترى الشعب الفلسطيني مش مستني من نيت وجميلت الأردن أو مصر أو غيرها من البلدان .<br />بالعكس الفلسطيني عنا مثل أخونا وأعز كمان .. وببتملك الجواز الأردني ..<br />ثالثاً يامصري أنتا جاي تقيس الأردن ع خلقة واحد مصري معفن وأجرب وريحتو طالعة رجلو والقبر ويلا يلا شايف قدامو ..<br />طيب ،، إذا حنا زي مابتقول يامصري // الدولة الأمنية اللي بتحمي إسرائيل // .. طبعاً الكلام اللي حكاه محمد حسنين هيكل .. كلام محفظو إياه البقرة الضاحكة (( حسني مبارك )) . وأكيد دفعلوا أكمن جنيه لحتى ينخرس ويسد بوزو .. وبما إنو البقرة الضاحكة عميل وجاسوسي لأمريكا وملحقاتها .. فماباك الشعب المصري ؟؟!!!!! .. وأكبر دليل على ذلك العميل المصري الشهير (( نسي اسمو )) .. المهم كان يتجسس لصالح إسرائيل لفترة طويلة جداً . ولك ذلك كان يتم بأوامر البقرة الضاحكة وتوجيهاته وإرشاداته له .. وأنت تذكر جيداً يامصري تاريخكو الحقير من أول إنمسك الحكم فيها لهسه . وأكبر دليل / السادات الذي يعد من أغبى الجواسيس وأهبلها في تاريخ البشرية .. كان يظن هذا الغبي بأن تسول له نفسه وأن يلعب بالناااااااار .. ولكن تجري الرياح بما لاتشتهي السفن .. كان يتحدى أسياده (( أمريكا وفرنسا )) .. إلى أن قررت أمريكا بأتفاق مسبق مع إسرائيل وأخذ مشورة وموافقة حسني مبارك (( كان آنذاك على ما أعتقد يشغل منصب رئيس وزرائة )) .. على قتل السادات . وما كان من حسني مبارك أن وضع واحد من أفراد الشعب المصري .. وقام بإغتياله بمسدس كان عياره ((2.6 ملم )) .. وشائت الصدف . ياسبحان الله !!!!!!!!!!! .. أن تأتي الطلقة برأس السادات .. ولم تأتي يرأس مبارك ...<br />بم تفسر هذا الكلااااااااااااااااااااااااااااااااااااااااام ؟؟!!! لماذااااااااااااااااااااااااااا ؟؟!! ما الدافع ؟؟!! وهاذ ع فكره يامصري يلي كلك تقافة . ولا إشي من تاريخكو اللي بوطي الراس بالرمل .. (( فيض من غيض )) .. وتذكر جيداً إذا نسي الناس .. فالتاريخ لاينسى .. والتاريخ يسجل .. ويشهد .. وهونه بكفيكو فضايح .. لأنو ما بدي أصدم الناس بتاريخ مصر .. ونيصحة مني إلك أنك لما بدك تحكي وتتفلسف . إقرى تاريخ بالأول وشوف شو تاريخ بلدك ياحماااااااااااااااااااااااااااااااار<br />الله .................................................................. الوطن ......................................................... الشعب"
archived = "2010-03-14"
