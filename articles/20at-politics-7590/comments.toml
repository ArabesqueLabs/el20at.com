text = "بصو يا أخوانا ده عاشق فلسطين عندو كده حوالي ميت اسم واسم . ده الرجل ( أشك والله إنو راجل ) مريض نفسي ومنفصم وكل حاجة يعني .<br />والواد محمد نواف ده تعليقو لعاشق أساساً موجود بصفحة الشيخ - عمرو خالد اللي هيه (عالم سعودي يتراجع عن تكفير عمرو خالد ) .. وهزا التعليق كان مكتوباً هناك , فمن الذي أتى به إلى هنا وأقصد بالصفحة دي ,,<br />إنه عاشق فلسطين بكل تأكيييييييد ,<br />احذروا منه شديد الحذر وإياكم والوقوع في فخه الذي سوف يقع فيه عما قريب بحول الله<br />سلام"
