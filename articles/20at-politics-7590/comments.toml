subject = "يامصري .. يلعن شرفك ببلاش .."
author = "محمد نواف الحمدالله .."
posted = "2007-12-05"
text = "ولا يامصري تتوسخنش أحسن ما آجي أمسح بكرامتك الأرض .. أنتا واحد حمار ابن حماره وعليتك كلها حمير .. ولك أنتا مكانك الزباله يازباله .. ولك الشعب المصري متبري منك ومن أشكالك يامرتزقة الشعب .. ياهفت ( غبي ) ..<br />وأي إشي مش فاهمو تعال أنا حفهمك إياها بس أنتا حاول تفهم ياحمار أنا عارف أنك حمار بتفهمش بس يلا لعل وعسى تفهم ياحماااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااار ..<br />فعلاً ناس مابتعرف إشي جايه تتفلسف وتسوي حالها الكل بالكل .. أي كس أم اللي بزرك عرص أخو منيوكه عاهره داعره .<br />وآسفين للغلط بس ها>; الحمار طلعني عن طووووووووووووووري ."
