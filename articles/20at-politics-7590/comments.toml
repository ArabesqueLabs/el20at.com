[[comments]]
order = 10
subject = "و كمان مره للأهبل محمد نواف"
author = "اكتب اسمك هنا"
posted = "2007-12-11"
text = "جلاله ملك مين اللى على راسى يا أهبل يا أبن الهبله<br />انت بنى آدم شكلك كده ما بتفهمش حاجه و غبييييييييييييييييييييييييييييييييييييييييييييييييييييي<br />جلالة الملك ده فوق راسك و راس أهلك انت اللى كلهم مذلولين و هيفضلو مذلولين طول عمرهم<br />و بعدين ما انت كمان بتكتب من ورا الكمبيوتر يا حمار يا ابن الحمااااااااااااااااااااااااااااار و دى مش إهانه ليك صدقنى إنما دى إهانه للحمير أنك تنتسب ليهم لأنهم كفصيله حيوانيه اشرف منك مليون مره و أذكى و دى حاجه واضحه وضوح الشمس<br />انت أمثالك من البنى أدميين الحاقدين على مصر و المصريين انا ما أسمحله يجى يلحس نعل جزمتى احسن يوسخها بلسانه القذر<br />و بصقتى عليه حرام برضه لأنه هيعتبر إن ده إستحمام ليه من القذاره اللى هو فيها<br />يا عرص يأ أخو و أبن و أبو المنيوكه ده لو ليك أولاد اساسا و طلعت فى الأخر مابتعرفش زى ما أنا متوقع<br />ههههههههههههههههههههههههههههههههه"
