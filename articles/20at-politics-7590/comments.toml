order = 0
subject = "لموا لسانكم شوية"
author = "مصري وبس"
posted = "2007-11-13"
text = "مش عارف إذا كانوا عشرينات قرأوا الصور ازاي .. بس بالتأكيد محجوب يستحق زيارة موقعه، والرد عليه هناك .. الظاهر إنه مش واخد باله، إنه الأردنين هما اساتذة التعذيب في العالم العربي، طب المصريين كانوا رجالة ونشروا التعذيب بتاعهم، وكل يوم الصحف كلها بتتكلم من غير ما يهمها، نفسي بقى أشوف أردني واحد بيتكلم على حريته هناك، والأخ محجوب، اتحداك إنك تستطيع تنطق ولا ترسم نص الرسومات دي هناك وأنت عارف كويس جدا إن بيحصل أدها عشر مرات في الأدرن أولاً بتاعتك دي .. لأ نفسي تقولي .. إيه سر العلاقة الحميمية للأردنيين مع الفلسطينيين، والعنصرية البغيضة اللي في الأدرن للفلسطينيين .. يا راجل الفلسطيني أول ما يخرج من الأردن ويسألوه على جنسيته أول كلمة يقولها .. فلسطيني، حتى لو شايل جوازكم الأردني، من كتر ما زهقتوا الخلق في عيشتها، أتحداك يا محجوب، إنك تنكر انكم زي ما قال هيكل: الدولة الأمنية اللي بتحمي اسرائيل .. وأتحداك إذا كنت فلسطيني أو أردني إنك تنكر العنصرية البغيضة للأدرن، وأتحداك أنك تنكر أنها بتنتقل حتى لملاعب الكرة .. والصراع بين جماهير الفيصلي والوحدات، اللي خللت جماهير الفيصلي تطالب بخراب البيوت في كلامها.<br />أتحداك إنك تنكر إنك في يوم من الأيام ما تعلمتش من المصريين حاجة، أو ماكنش ليهم خير عليك.<br />إحنا بلدنا بقت فقيرة وإحنا عمالين ندافع عنكم وعن أعراضكم.<br />وبقت فقيرة، من كتر ما لمناكم وحمناكم، والنهاردة العرب راجعة ترد الجميل لمصر، في صور السخرية، والكلام العبيط اللي عمالين تقولواه من انتهاء دور مصر، وفقر مصر<br />يا محجوب .. كنا بنحب نشوف رسمك لما كان صادق .. مش مليان حقد على بلد، أقل شئ يترد ليها الجميل ..<br />والمشكلة ان كل العرب دلوقتي .. بيتمنوا اليوم اللي يصحوا من النوم مايلقوش مصر ع الخريطة.. خليكم في أحلامكم.. بلدنا في أجازة.. بس عمرها ما ماتت .. أنتم محتاجين تنزلوا تشوفوا الناس الحقيقية في مصر، مش على شاشات التلفزيون.<br />أما انتم يا مصريين .. فأبوس ايديكم اللي أدت كل العرب بلا حدود .. ورؤوسكم اللي نقلت العلم ليهم كلهم .. ولا عمرنا منينا على حد، بس الكيل فاض.<br />أنتم الورد الحر البلدي<br />يصحى يفتح أصحي يا بلدي<br />انتم خلاصة مصر يا ولدي<br />أنتم عيون المصريين<br />الأخ محجوب .. سمعت عن العالم المصري اللي كان راجع من أستراليا على بلده وعمره 65 سنة، وحظه الأسود بعته على مطار عمان ترانزيت، وتم تعذيبه في المطار الأردني، وشتيمته، وقالوا له أنت رايح على بلد الكفار اللي هي مصر .. لو انت فنان حقيقي وصادق، وعندك قضية .. تنشر وترسم عن العالم ده .. بس أتحداك انك تعملها<br />اقرأ الموضوع على عشرينات اللي شهروك ونشروا رسمك وآدي اللينك<br />http://masr.20at.com/newArticle.php?sid=12339"
archived = "2010-03-14"
