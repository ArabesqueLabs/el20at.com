subject = "البنى آدم الزباله محمد نواف"
author = "اكتب اسمك هنا"
posted = "2007-12-11"
text = "كده فاض الكيل<br />انت بنى آدم خول معدوم الرجوله و النخوه و الكرامه<br />و شكلك كده فيه واحد مصرى ناكك او اعتدى على شرفك قبل كده أو و الله أعلم اعتدى على حد من أهلك عشان كده انت متضايق قوى من المصريين<br />جايز يكون اللى انا بقوله ده حصل غصب عنك بس اللى الإحتمال الأكبر انه يكون حصل برضاك لأن أغلب الظن انك قواد و معرص كبير فى بلدك<br />عشان كده أنصحك انك تأخد بالك من أهلك كويس احسن يكون في حد مصري معاهم دلوقت<br />تمم على اهلك كل يوم و خد بنصيحتى بدل ما تطلع عقدك النفسيه على المصريين اللى الطفل فيهم بكتيبة رجاله من امثالك يا عرص يا أببن المووووووووووووووووووووووووووووووووووووووومس"
