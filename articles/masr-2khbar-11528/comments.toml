subject = "صحيفة اسرائيلية : 30 الف مصرى يعيشون فى تل ابيب"
author = "اكتب اسمك هنا"
posted = "2009-03-10"
text = "واكيد ال 30 الف شاب اللى فى تل ابيب خدم على الاقل نصفهم فى الجيش وممكن اسرائيل تعرف منهم ادق ادق الاسرار<br />وبالعربى اسرائيل مش محتاجة جواسيس - كل حاجة بتروح لغاية عندها<br />الخبر بتاع 30 الف مصرى يعملون فى تل ابيب منشور فى موقع مصراوى اليوم<br />يعنى كل حاجة فى البلد مخترقة<br />وكل المعلومات عريانة ومعروفة لاسرائيل<br />يبقى فايدة المخابرات العامة وامن الدولة اية<br />يا سادة احنا فى ورطة<br />احنا مش عارفين احنا بنعمل اية ولا عايزين اية ولا مين العدو ولا مين الصديق<br />البلد بصراحة بزرميط - سمك لبن تمر هندى"
