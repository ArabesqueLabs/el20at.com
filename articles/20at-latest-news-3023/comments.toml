text = "يقول الإمام الشافعي _ رحمه الله _ :-<br />نعيب زماننا والعيب فينا *** ومالزماننا عيبٌ سوانا<br />ونهجو ذا الزمان بغير ذنبٍ *** ولونطق الزمان لنا هجانا<br />وليس الذئبُ يأكل لحم ذئبٍ *** ويأكل بعضنا بعضاً عيانا<br />أعتقد بأن كلامي قد فُهم على أكمل وجه . ولاحاجة للتفسير أو الشرح بمقتضى ماتحدث به !!!<br />وعاشت الأردن أولاً .. حرة .. أبيه ..<br />منصورة بإذن الله تعالى .. الله ............................................ الوطـــــــن ........................... الملك<br />تحياتي ،،،"
