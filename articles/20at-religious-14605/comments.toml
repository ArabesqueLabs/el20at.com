author = "محمد حسين"
posted = "2010-01-04"
text = "السلام عليكم<br />يوم عاشوراء هو يوم حزن بمصاب الإمام الحسين (ع) سبط النبي محمد (ص) وليس بيوم فرح , فهل من المعقول ان يفرح الناس في يوم مصيبة ؟<br />انه يوم اسى وحزن لما فعل بابن بنت رسول الله من قتل وذبح من قبل بني أمية واتخاذهم ذلك اليوم عيدا<br />وهذه ليست كأي مصيبة وإنما استشهاد وتضيحة حيث ضحى فيها الامام الحسين (ع)بنفسه وأهله وأصحابه لحفظ الدين الاسلامي من الإنحراف , قال الامام الحسين (ع) : اني لم اخرج اشرا ولا بطرا ولا مفسدا ولا ظالما وإنما خرجت لطلب الإصلاح في أمة جدي اريد ان آمر بالمعروف وأنهى عن المنكر<br />فلماذا ثم لماذا التهنئة بيوم عاشوراء ؟؟؟!!"
archived = "2010-03-14"
