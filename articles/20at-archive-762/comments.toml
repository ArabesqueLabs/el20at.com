[[comments]]
order = 1
subject = "الله يسامح الجميع"
author = "أه من الأبواق"
posted = "2008-01-10"
text = "هذا الموضوع جاء بطريقة أسخف من المتوقع من أبواق الحكومات و الديكتاتوريات<br />فما دخل وليد جنبلاط بناصر قنديل ؟ و لماذا تلمحون أن الدروز يتمنون إنشاء هذا الكيان الدرزي و تتعمدون إخراجهم من الثقافة القومية و العروبة ؟ و لماذا تتناسون أن أول من تصدى لهذا المشروع كان وليد جنبلاط و أول من دعى إلى رفض التجنيد الإجباري للدروز في إسرائيل ؟ والله و الله أنكم لتدعمون هذا المشروع بمحاوالاتكم الدائمة الطعن بالدروز و دينهم و عروبتهم .... و لكن الدروز لا ينغمسون بالرد على هذه التفاهات لأنهم مدركون أنكم حتى لو حاولتم محي تاريخهم يستطعون مع كل فجر أن يصنعوا تاريخا يبدو أنه يشرق فيحرق قلوبكم .... هذا الكلام موجه لمن يتعمد الإساءة و ليس المصداقيه في الكتابه و هم قلة على كثرهم.............؟؟؟؟"
archived = "2010-03-14"
