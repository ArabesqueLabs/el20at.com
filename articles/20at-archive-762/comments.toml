[[comments]]
order = 4
subject = "الزعيم الوطني وليد بك جنبلاط"
author = "مهران سويد"
posted = "2008-09-25"
text = "لو كان لنا في فلسطين زعيم كوليد جنبلاط لكانت العالم باسرها رأت العلم الفلسطيني يرفرف فوق حيفا وجبال الجرمق والكرمل ويافا والقدس الشريف، وليد بك جنبلاط يحافظ على وطنه وإستقلال شعبه وتاريخ كيانه ، الفرق كبير بين الفكر الجنبلاطي القومي الوطني الموروث من الشجعان والفرسان الحقيقيون في آمتنا وشعبنا، وبين هؤلاء المرتزقة والعملاء الذين يتاجرون ويتآمرون على الوطن من اجل الغرباء ،وليد جنبلاط لبناني وتاريخه وتاريخ سلالته وطائفته الأصيلة مكتوب بأجمل الكلمات وباطهر السطور النضالية والمقاومة الشريفة الفعلية الثابتة على المبادىء الوطنية والقومية ، وليد بك حامل الراية بحماية الثغور ووريث السيف والقلم وصاحب الروح الفولاذية والعقول الإشتراكية التقدمية وبنور الحكمة العرفانية، لن يسمح لهؤلاء الاقزام ،الاوغاد، بسلاحهم الارهابي الاجرامي المسمم بالغدر والخيانة والتبعية والعمالة، وابواقهم الطنانة الرنانة وصرخاتهم الكاذبة المنافقة، ان تحول لبناننا الى ساحة فارسية علوية مجوسية شيطانية،تتآمر على ثروات وخيرات وموارد آمتنا وشعوبنا، وليد بك جنبلاط يقف لكم ولشياطينكم ودجاليكم بالمرصاد ويقول لكم انكم اعداء الوطن والشعب والحاضر والمستقبل وسيكون صاحب الأمانة بحماية الوطن ومواطنيه وإستقلالهم وحريتهم......الله معك يا بك"
archived = "2010-03-14"
capture_url = ""

