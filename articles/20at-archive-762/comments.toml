text = "نقول لهذا الصغير ناصر قنديل باب طيزو ان نظامك السوري يعيش ويتنفس الحياة بحماية الصهيونية والماسونية لنظامه، وانت ومكتبك الجاسوسي التفريقي الذي يعمل على غرس الفتن والتحريض في آمتنا وبين شعوبنا هو مكتب يساند الصهيونية افكارها بتفريق العالم العربي وتمزيقه ودماره، فامثالك رصاصهم طائش وفارغ وعندما نقرر فعسك ونسفك سندوس بنعالنا على لسانك القبيح"
