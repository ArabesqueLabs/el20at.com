order = 1
subject = "الشارقه الامارات العربيه"
author = "علي"
posted = "2009-01-16"
text = "قرفتونا كل شي بدعه كل شي حرام بيجي يوم حتى الهوا بتحرمو علينا شوفيها اذا الطالب دعا دعاء كافي تخلف شوفو الناس وين وصلو وانتو للحين كل شي عدكم بدعه الله يلعنكم ورسوله وملائكته شوفو غزه شو بيصير فيها شوفو العراق اعملو شي تركو البدعه والشرك الرسول يكول يخاطب الامه اني لا اخاف عليكم من الشرك.انتو صرتو احرص من الرسول انشاء الله بيجي يوم نصبح ما نلكيكم.علماء السلطان زبالة الامه خليكم بلحيض والنفاس وهاي الامور وفرج المرأه هاي المسائل الي بتحبوها أما غزه والعراق فهذي امور هامشيه والاف الناس الي استشهدو مو مهم بلنسبه الكم."
archived = "2010-03-14"
