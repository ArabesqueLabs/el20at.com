text = "السلام عليكم ورحمة الله وبركاته<br />جزاكم الله خيرا على التوضيخ ولكن ليا تحفظ مامصدر هذا الكلام يعنى هل هو منقول من جريدة ام ماذا فقط للتاكد من وجود جهة موثوق منها ونريد معرفة اين نشر هذا الكلام<br />وشكرا"
