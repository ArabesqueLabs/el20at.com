[[comments]]
order = 1
subject = "اكيد بيهزروا"
author = "محمد بن الجراح"
posted = "2007-01-31"
text = "السلام عليكم<br />اكيد الشباب كان بيهزر ، لان اذا كانت دي امنيتهم علشان يدخلوا الجنة في الفلوس و العربيات و الكلام ده يبقي فعلا احنا منعرفش حاجه عن الجنه ، يا شباب اعظم نعمه في الجنه و هي النعمه التي لا يساويها نعمة اخري هي النظر لوجه الرحمن الرحيم ، فالله سبحانه و تعالي يمن عليك علي الرغم من كل ذنوبك و تقصيرك و يجعلك تنظر اليه كانك تري القمر في الليلة الصافية ، كما انك ستري النبي صلي الله عليه و سلم و كذلك الانبياء السابقين و اصحاب النبي صلي الله عليه و سلم ، مش شوية قصور و علشان مراتي متزعلنيش و فلوس و لا عربيات ."
archived = "2010-03-14"
capture_url = ""

