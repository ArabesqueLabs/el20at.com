posted = "2007-03-14"
text = "بسم ا لله الرجمن الرحيم<br />اجمل ما في الجنة هو النظر الي وجه الله العظيم ورؤية النبي صلي الله عليه وسلم<br />انا بحلم ادخل الجنة علشان اشوفه واشوف الصحابة اللي فعلا ضحوا علشان الاسلام ودايما بدعي :\" اللهم كما امنا بيه ولم نره متعنا به في الجنة \"<br />الجنة بالنسبة لي هي دار الراحة، الدنيا ديه دار التعب والحزن مفيش حد فيها مرتاح ولا اللي معاه مرتاح ولا اللي ممعاهوش مرتاح"
