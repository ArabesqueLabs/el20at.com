[[comments]]
order = 4
subject = "أول تعليق أرسل بواسطة الأردني الحقير محمد نواف الح"
author = "عاشق فلسطين"
posted = "2008-06-20"
text = "للعلم فقط أول تعليق أرسل بواسطة محمد نواف الحمد الله , وأنا قد قمت بتهكير الأسماء المستعارة التي قام بها في صفحة ارفع<br />راسك إنتا فلسطيني وفي بعض الصفحات الأخرى أيضا , وهنا أول تعليق أرسل بواسطته , وأريد التذكير بأنه يعيش بالإمارات وتحديدا<br />بالشارقة , وأنا بإذن الله سأحاول أن أخرس لسان هذا الحقير , وللعلم أيضا أنا أردني من أصل فلسطيني أصيل ابن أصول ومن<br />طولكرم , وقد وجدت كل الإهانات والعنصرية الرهيبة الغير طبييعة بالأردن وهي التفريق والتمييز بين الأردني الأصل والأردني من أصل فلسطيني , وبالفعل أنا هنا بالأردن أدرس بالجامعة الأردنية ووجدت هذه الإهانات , وهم يكرهوننا ليوم الدين كرها أعمى لا نعرف ما هو سببه , لعلمكم فقط بأن الأردن يا إخوة عصبها الأساسي هم الفلسطينيون وهم أعمدتها , فاقتصاد الأردن قائم على أموال الشعب الفلسطيني , إخوتي أنا لا أنكر شخصيا بأن هناك أردنيين أصل محترمين , لكن أقسم بالله إنهم قليليين جدا جدا وقلة بنعدوا على الأصابع للأسف , وآسف للإطالة وعلى راسي كل فلسطيني وفلسطينية ......."
archived = "2010-03-14"
capture_url = ""

