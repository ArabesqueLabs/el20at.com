[[comments]]
order = 0
subject = "الشات اضر الفلسطينين وبنات العالم العربي معهم"
author = "الحق يقال"
posted = "2007-11-23"
text = "اول شئ اود ان اقوله مع كامل احترامي للشعب الفلسطيني ولمحنته ولكل الضغوط والاكراهات التي يعيشها بشكل يومي الا انني اود ان انبه قراء هذا الموقع المحترم ان الشباب الفلسطيني اضره الانترنت اكثر مما افاده فالشاب الذي سيقاوم وسيضرب بالحجارة مشغول بمحادثاته ادن ضاعت القضية وضاعت المقاومة. هناك امر اساسي يجب ان يعلمه الكل الشباب الفلسطيني الان اصبح يتلاعب بمشاعر بعض الفتيات والشابات من البلدان العربية الاخرى غير فلسطين على سبيل المثال اعرف فلسطينيا يكلم مغربيتين من اميلين مختلفين الاولى يتحدث معها بالنهار اما الليل فيخصصه للفتاة الاخرى التي تعمل والمشكل ان كل واحدة من هولاء البنات تعتقد انه يحبها هي فيتفنن هو بكلامه المعسول وبتلاعب بمشاعرها كماشاء ووصل به الامر ان يتوصل بمبالغ مالية طائلة من احداهن. المهم اخواني هناك قصص كثيرة عن الشبان الفلسطينين المستعملين للانترنت لكن اخواني ارجوكم القضية الاساس لاتنسوها واتركو الانترنت بعيدا."
archived = "2010-03-14"
