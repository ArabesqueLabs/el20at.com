[[comments]]
order = 1
subject = "اين محرر الصفحة؟"
author = "مسلمة"
posted = "2007-11-25"
text = "السلام عليكم<br />لم لا تفعلون خدمة الابلاغ عن مشاركات سيئة؟<br />الاخ نواف شتم وسب وتهجم على الفلسطينيين جميعاً ولم يحذف كلامه ولم يعدل! فهل هذه ديمقراطية ام حرية ام ماذا؟<br />اتق الله يا اخي الكريم،، فالله وحده يعلم حالهم هناك، ان ذكر التقرير صور للزواج او التعارف على الانترنت فهذا لا يعني ان هذا جل اهتماهم، ثم لتعلم ان الفلسطينيين اكثر العر ب تعليماً وعلماً وثقافة! الا ان لا عمل في الاراضي المحتلة فاتق الله فيهم وفي نفسك!"
archived = "2010-03-14"
