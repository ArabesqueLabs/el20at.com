subject = "الي  الاردني اللي كتب التعليق مع كامل حبنا واحترام"
author = "كتكوتة"
posted = "2007-11-28"
text = "الاخ اللي شتم الفلسطنيين قد حمل وزرا كبيرا لانه سب وقذف شعب باكمله قد يكون فيه السيء لكن اكثره كما نعلم جميعا مجاهدين شرفاء هم عند الله خيرمنا ومنه بالف مرة فماذا قدمت انت واعتقد انك من الاردن وهذا واضح من لهجتك ومن كرهك للفلسطينين ايضا فجميعنا نعرف انكم تكرهونهم لانهم يعيشون بينكم ويتزوجون ويعملون مثلهم مثلكم وهذا ما يثير حقدكم عليهم فاتق الله واستغفر وارجوك لاتؤذنا بالفاظك الغير محترمة مرة اخرى وغير مرحب بك في هذا المكان"
archived = "2010-03-14"
