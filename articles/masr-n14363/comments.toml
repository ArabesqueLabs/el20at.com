subject = "الى الدكتور احمد  والاخ مراقب"
author = "مش ضروري"
posted = "2008-03-02"
text = "اولا جزاكم الله خيرا<br />ثانيا: قل اللهم مالك الملك تؤدي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير<br />اللهم ولي علينا خيارنا ولا تولي علينا شرارنا"
