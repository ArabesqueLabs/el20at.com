[[comments]]
order = 0
subject = "المدنيون تبع مين بالضبط - والعسكريون تبع مين - وال"
author = "مواطن بسيط"
posted = "2008-02-25"
text = "فى اول سطر فى قانون الاحكام العسكرية انة ينطبق على العسكريون الذين يرتدون الكاكى ويخضعون للاحكام العسكرية سواء داخل السثكنات والمعسكرات او فى اجازتهم الميدانية<br />بمعنى انة لو شخص عسكرى ويرتدى الكاكى واثناء اجازتة قتل شخصا - فلا تقبض علية الشرطة العادية ولا يحاكم امام المحاكم المدنية والجنائية ولكن تقبض علية الشرطة العسكرية ويحاكم امام المحكمة العسكرية<br />هذا هو المعروف عالميا ومصريا<br />ولكن فى زمن الانحطاط الذى نحياة - لو راجل حرامى مدنى سرق فرخة من عشة فراخ من حق الرئيس ان يحاكمة امام محكمة عسكرية ونيابة عسكرية وحرس سلاح وكتفا سلاح ويروح فى الكازوزة<br />طبعا رئيس الدولة عسكرى ورئيس الحى عسكرى والمحافظ عسكرى والبلد كلها بقت معسكر اعتقال خاضعة للاحكام العسكرية<br />فمفيش احد يشتكى<br />العملية هيصة"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004231/http://masr.20at.com:80/newArticle.php?sid=14363"

[[comments]]
order = 1
subject = "الاخوان المسلمين جماعة سياسية لا علاقة لها بالدين"
author = "مش ضروري"
posted = "2008-02-26"
text = "الاخوان المسلمين مجموعة من الاطباء والمهندسين والمحامين والمدرسين والصحافيين يكونون جماعة سياسية هدفها الوصوف الى الحكم وان كانوا يريدون اقامة دولة اسلامية<br />ولا بد للانسان السياسي ان يتحمل كل شيء في سبيل الوصول الى هدفه<br />وعلى حسب علمي<br />ان الاخوان المسلمين لا يقبلون برئيس غير المرشد العام حتى ولو اقيمت الف دولة اسلامية<br />فالمرشد العام عندهم هو رئيس الدولة"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004231/http://masr.20at.com:80/newArticle.php?sid=14363"

[[comments]]
order = 2
subject = "اللهم فك اسرانا وارحم موتانا"
author = "مش لازم (منقول)"
posted = "2008-02-26"
text = "دعاء روعة للشيخ مشاري<br />اللهم آمننا في أوطاننا وادم نعمة الأمن والاستقرار في بلادنا اللهم من أرادنا وبلاد المسلمين بسوء فشغله بنفسه واجعل كيده في نحره يا حي يا قيوم برحمتك نستغيث اللهم فك أسرانا واسري المسلمين وارحم موتانا واقبل شهدائنا اللهم اعصم أسرانا من الفتن والدنايا اللهم احقن دمائهم وثبت قلوبهم على طاعتك اللهم إنهم جياع فأطعمهم وعراة فاكسهم ومساكين فارحمهم اللهم من أرادهم بسوء فاقلب سوءه على نفسه يا ارحم الراحمين يا غياث المستغيثين يا ذل جلال والإكرام اللهم عليك بمن إذانا وأذاهم اللهم عليك إنا نجعلك في نحورهم ونعوذ بك من شرورهم يا قوي يا عزيز<br />اللهم أمين اللهم أمين"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004231/http://masr.20at.com:80/newArticle.php?sid=14363"

[[comments]]
order = 3
subject = "الاخوان على الطريق للحكم شئتم ام ابيتم"
author = "مراقب"
posted = "2008-02-26"
text = "الاخوان هم الذين قاموا بثورة 1952 وعبد الناصر والسادات وزكريا محى الدين كانوا اعضاء فيها<br />ولكنهم تنكروا للاخوان وسرقوا الثورة منهم وابعدوهم عن الحكم بضغوط امريكية<br />وتعلم الاخوان الدرس<br />وهم قادمون<br />وكلهم اطباء ومهندسون ومدرسين ورجال اعمال صغار<br />وسوء الحالة الاقتصادية والفساد المنتشر فى كل مكان سيجعلهم ينجحون<br />ان اى رئيس قادم ايا من يكون حتى لو معة ملك من السماء لن يوقف ثورة الجياع والمحرومين<br />ان الازمة التى تحيا فيها الامة وتدفعها الى المجاعة سوف تؤدى الى ثورة جياع تحرق القاهرة مرة اخرى كما احترقت سنة 1950<br />وسوف ينزل الجيش الى الشوارع<br />وسيتولى الحكم<br />فانتظروا لواءا اخر او عميد يحكم بمساندة الاخوان<br />هذا هو المستقبل المنظور"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004231/http://masr.20at.com:80/newArticle.php?sid=14363"

[[comments]]
order = 4
subject = "ردا على الاستاذ(مش ضروري) والاستاذ (مش مش)"
author = "د.احمد"
posted = "2008-02-27"
text = "السلام عليكم ورحمة الله..<br />الأخ(مش ضروري)..<br />جماعة الاخوان جماعة على قدر عالي من التنظيم وكأي مؤسسة او رابطة او جماعة او أيًا ما كان المسمى..فمن الطبيعي ان يكون هناك رأس وقيادة كما هو الحال في أي هيئة راقية ومنظمة..<br />أما كون ان لها مرشد يمنع وجود أحد أعضائها كرئيس للدولة فهذا أمر غير صحيح..<br />لأن هيئة الرئاسة لن تكون ن الاساس محدودة بوجهة نظر رجل واحد وهو شخص الحاكم الأوحد كما هو الآن..انما مشروع الاخوان ان تكون هناك مؤسسة للحكم والرئاسة على رأسها الرئيس..وليس هو كل شيء فيها ..انما هو فقط أهم أعضائها..<br />هذه المؤسسة تفعّل فيها الهيئات الرقابية والتشريعية لمراجعة ومحاسبة الرئيس.<br />وفي حال وجود الاخوان في السلطة..فستبقى الاخوان جماعة دعوية تمارس انشطتها الدعوية بكل حرية..وتأتي المرحلة التي تستقل فيها هيئتها السياسية عن تنظيمها الدعوي ليعمل كلّ في مساره..وهو طرح موجود حاليا لكن سابق لأوانه نظرا لـتأخرّ البلاد سياسيا كما ترى الحال الآن.<br />الأخ (مشمش):<br />أؤكد لك أن آليات التطوير والتجديد داخل جماعة الاخوان-وانا احد افرادها-قادرة تماما على تطوير نفسها بفضل الله للأفضل..وبها مساحة من الحرية أؤكد انها لا توجد في أي مؤسسة اخرى .."
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004231/http://masr.20at.com:80/newArticle.php?sid=14363"

