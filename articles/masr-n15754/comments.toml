[[comments]]
order = 0
subject = "افكر فى المحافظين فى محافظات مصر وحكام الولايات او المحافظين فى الهند"
author = "السبعاوى باشا"
text = "من عشرين سنة كنت وقتها اعمل فى شركة هندية فى احدى دول الخليج<br />تذكرت هذة القصة وقد شهدت فى الاسابيع الماضية تعيين المحافظين الجدد فى مصر وهم من فئات مثلا ثلاثة من قادة الجيوش ورؤساء الاركان وكذلك اربعة من مدير امن المحافظات<br />وتذكرت القصة القديمة<br />حكام الولايات او المحافظين فى الهند يتم اختيارهم بواسطة الانتخابات من الشخصيات العامة من الولاية وهم يتولون عملية التنمية والتعليم والصحة ويختارون النظام الاقتصادى المناسب للولاية<br />فمثلا ولاية او محافظة كيرلا تطبق النظام الاشتراكى واخرى قربها تطبق النظام الرأسمالى<br />المهم الهنود الذين يعملون فى الشركة تلقوا خطابات من المحافظ بتاع ولايتهم يطلب شراء اسهم فى مصنع تحت الانشاء ويحتاج الى التمويل لاستكمالةوهذا المصنع مخصص لانتاج كروت الكترونية تستخدم فى الكمبيوتر او اجهزة التحكم<br />وهناك اغراءات للشراء فمثلا اذا اشتريت عددا معينا من الاسهم فمن حقك ان تلحق بوظيفة فى هذا المصنع عند رجوعك الى ارض الوطن<br />كما ان عائد تلك الاسهم اعلى من اى بنك فى الهند<br />اما المحافظين فى مصر<br />فكلهم يشتركون فى شىء واحد لم استطع تفسيرة<br />الغرام والولع بتغيير حجارة الارصفة<br />المحافظ من دول يتعين واول حاجة يعملها انك تلاقى عمال بيشيلوا حجارة الارصفة وبعضها من البازلت الاسود المتين والقوى جدا باستبدالها باخرى خرسانية<br />لية مش عارف<br />ويقطع الشجر المزروع فى الشوارع<br />ومحافظ زى بتاع الزقازيق ملىء الشوارع والميادين بتماثيل مزورة للفراعنة وكان دة هو التجميل<br />فين المصانع اللى الشباب هيشتغل فيها<br />فين الانتاج<br />فين التنمية<br />انا مش بقول شوفوا بيعملوا اية فى بريطانيا والا امريكا<br />ولكن اقول شوفوا الهند بتعمل اية<br />شوفوا اسرائيل بتعمل اية<br />لية عقليات القيادة عندنا تنتمى لعصر المماليك<br />اقسم باللة العظيم لقيادات بلدنا اننا فى القرن الواحد والعشرين ولسنا فى القرن السابع عشر ايام العسس والمماليك البحرية والمماليك البرجية"
archived = "2008-05-13"
