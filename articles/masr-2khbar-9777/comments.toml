subject = "قانون ابلة نظيرة -"
author = "ابو مطوة"
posted = "2008-08-03"
text = "قانون اية اللى هيحل المشكلة<br />الاول نصلح الشوارع<br />ونحط علامات المرور صح<br />ونعلم ضباط المرور قانون السير ونشيل بهايم الامن المركززى من جنب الاشارات<br />ونعمل كبارى علوية صح<br />ونعمل دورات توعية للسائقين<br />انما نعمل قانون ومفيش اماكن لانتظار السيارات - صاحب السيارة يشيلها معاة فى فى الشقة<br />يا وزير الداخلية - يا اخى قحة<br />قحة يا حكومة وسخة ويا مجلس المعرصين اللى وافقتم على القانون"
