[[comments]]
order = 1
subject = "فى رحاب اللة و فسيح جناتة المغفور لة فقيد الوطن و"
author = "ممدوح زكى زخارى"
posted = "2008-08-03"
text = "ضحكت كثيرا لدرجة النواح حيث لم اجد فى عيناى اية دموع حزن للبكاء حقا<br />تعلو معا الى الاسكندرية فقيدة البحر الابيض المتوسط لتروا باعينكم مهازل كارثة المرور بهذة المدينة العجوز الشمطاء المتصابية ؟<br />اين الشرطة فى تطبيق ذللك الحلم و الامل المفقود المدعو قانون المرور حقا؟؟؟<br />أين السادة الاكابر اسياد و اصحاب الوطن الباشوات و الملوك ضباط الشرطة؟<br />لقد اختفوا و هربو امن و طائة الحر الى احضان مياة البحر الفيروزية و تاركين الرعاع العبيد مواطنين الوطن فى الجحيم و اتون ارتباك حركة المرور بهذة المدينة التى مازلت اعتقد انها تخضع للوطن مصر و اعتقد ان قانون المرور المدعو بالقانون الجديد فى هذا الوطن يجب ان يطبقو لكن كيف؟<br />لا نرى اى تواجد امنى مرورى بشوارع هذا تعليمات عليا سرية صادرة من مدير ادارة المرور بالاسكندرية بعدم التعرض للمخالفين للقانون خوفا من انفجار الشارع الامنى خوفا من ضياع و فساد الموسم السياحى للاسكندرية و حالة الاحتقان بالشارع السكندرى المستشرية بين مواطنية؟؟؟؟؟<br />ليعزل مدير مرور الاسكندرية و مرحبا بابطال رجال الوطن ابناء الشرطة العسكرية المصرية فى عودة القانون و النظام المفقود الى الشارع المصرى<br />ليطبق القانون و يضرب بالحديد و النار علىايدى ضعاف النفوس الوضيعة المريضة ايا كانوا<br />و ذللك لبسط سطوة و قوة القانون المستباح من فئة و ضيعة تعتقد نفسها فوق القانون و سطوة و قوة و نظام الدولة الوطن<br />رجاء الى السيد اللواء وزير الداخلية بضرب هذة الئة الضالة الخارجة على القانون و ذللك بتطبيق القانون و مهما كلف ذلك الوطن<br />و ليكن (الوطن فوق الجميع)"
archived = "2010-03-14"
capture_url = ""

