[[comments]]
order = 0
subject = "فيلم مصرى اسمة - على من نطلق الرصاص او فيلم كتيبة اعدام"
author = "من المشايخ"
text = "فى موقع مجلة اعصار قرأت التالى<br />النشيد الوطنى ( لا علاقة لة بالحزب الوطنى )<br />بلادى بلادى بلادى بلادى<br />لك سخطى وامتعاضى<br />مصر يا ام الاذلة<br />البلاد نهباها شلة<br />والنظام بقى ريحتة جلة<br />هى دى ريحة بلادى<br />مصر يا ارض الجحيم<br />وعصا الشرطة فى المستقيم<br />وعماد الكبير مهما يولول<br />ما فى منقذ من الاعادى"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406094138/http://masr.20at.com:80/newArticle.php?sid=15022"

[[comments]]
order = 1
subject = "احوال مصر وسوريا سيئة لاجراءات الحاقهما بالعراق"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "كما تعلمون يا احبائي ان هناك شيء اسمه اسرائيل الصغرى واسرائيل الكبرى<br />اسرائيل الصغرى هي فلسطين الارض المقدسة عند اليهود كما قال سيدنا موسى ادخلوا الارض المقدسة التي كتب الله لكم ولا ترتدوا على ادباركم فتنقلبوا خائبين)<br />لما جه الدور على سيدنا داوود انطلق الى اسرائيل الكبرى من النيل الى فرات<br />يعني بعد فلسطين العراق وسوريا ومصر (من الفرات الى يا اسرائيل)<br />اجدادنا القدماء كانوا يضحكون كثيرا عندما كانوا يسمعون ان اليهود ممكن ان يرجعوا الى فلسطين<br />وعندما اقيمت اسرائيل على ارض فلسطين بدأنا نسمع عن من النيل الى الفرات يا اسرائيل كنا نضحك كثيرا<br />والضحك بدأ يتبدد الى خوف بعد غزو العراق طبعا السبب الارهاب او البترول<br />اما الحقيقة هي ان امريكا بتساعد اسرائيل في اسرائيل الكبرى كما ساعدتها بريطانيا في اسرائيل الصغرى<br />فيا اعزائي ما يحدث في مصر بيحدث في سوريا تماما وهي اجراءات ضم سوريا ومصر الى اسرائيل الكبرى<br />يعني الموضوع خارج السيطرة عن الحكومة والشعب والاخوان (الامر كله بيد الله سبحانه وتعالى)<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />حد فهم حاجه من اللي انا كتبته"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406094138/http://masr.20at.com:80/newArticle.php?sid=15022"

[[comments]]
order = 2
subject = "قانون المماليك - الحكم لمن غلب"
author = "مصرى"
text = "مش عايز ابن كلب يتكلم عن الديمقراطية والانتخابات والسخامات وجلا جلا تعالى يا ولة<br />نحن نحكم فى دول العرب بقانون المماليك المصرية الذين حكموا مصر لمدة 400 سنة<br />القانون لمن الحكم<br />بكلمتين<br />لمن غلب<br />الحكم لمن غلب<br />بالدراع<br />بالامن والشرطة والعسس والاعوان والاغوات والمال والفساد والافساد<br />ريحوا انفسكم<br />الحكم لمن غلب<br />اللى يصحى بدرى ويهجم ويقعد على دكة الحكم<br />الحكم لمن غلب"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406094138/http://masr.20at.com:80/newArticle.php?sid=15022"
