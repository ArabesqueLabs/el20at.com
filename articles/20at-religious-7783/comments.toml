[[comments]]
order = 0
subject = "أين أنت ياجميلة"
author = "آه يابلد"
posted = "2007-12-11"
text = "( المسجد الأعظم) ؟؟ أعظم ممن ؟؟ وأعظم لمن ؟؟ وأعظم بمن ؟؟ هل عظمته في فخامته؟؟ أم في إتساعه؟؟ أم في ارتفاعه؟؟ أم في مسرحه ومطاعمه وفندقه الخمس نجوم ؟؟ أم في ال800مليون دولار المرصودة له ؟؟ أم في مكتب \" ديسو سوبرين الكندي للدراسات الذي سيشرف فنيا عليه\"\" ؟؟ رهبان النصارى يهرعون إلى الجبال والصحاري والقفار ليعبدوا ثالوثهم رغم قدراتهم على بناء القصور فوق مياه المحيط!! بينما حكام المسلمين يتبارون في بناء أعلى مئذنة وألأجمل زخارف الدنيا والمساجد الملحق بها الملاهي والترفيهات بأموال اليتامى والعرايا والجوعى والمرضى والفقراء والعاطلين والعوانس في بلد المليون شهيد؟؟؟ بماذا تفاضلون ذلك المسجد الأعظم ؟؟ هل تفاضلون به المسجد المكي أو النبوي أو الأقصى ؟؟ هيهات هيهات ‍‍ فتلك المساجد الثلاث لا تشد الرحال إلا إليها وحدها فقط.. بما يعني أن فضلها لا يزول ولا يبارى ولا ينافس‍‍<br />إذأ بماذا تفاضلون به ؟؟ أتفاضلون به مسجد الحسن بالمغرب أم الحسين بالقاهرة أم غيرها ؟ 800مليون دولار قادرة على حل مشاكل مئات الآلاف من المرضى والجوعى والعرايا والسقام والعوانس واالعاطلين .. وهل تاريخ الجزائر يحتاج إلى هذا التبذير المقيت حتى يمكن أن يرويه هذا البناء ؟؟ ماهي الكنيسة التي تكلف النصارى ومنهم المكتب الكندي ذلك في بنائها هذا المبلغ رغم قدرتهم على أضعاف أضعاف ذلك؟؟ ما هو المعبد اليهودي أو الهندوسي أو البوذي الذي تكلف فيه أهله هذا المبلغ الرهيب؟؟ هل طلب الله منكم ذلك ؟ هل اوصاكم رسوله بذلك؟ يا أيها الجزائريون يا أيها العرب يا أيها المسلمون أنتم الوحيدون ودينكم الوحيد ورسولكم الوحيد الذي جعلت له ولكم الأرض مسجدا طهورا يعني بالفلاحي يمكن الصلاة على الأرض على التراب على الرمال على الجبال على الشواطئ على الحدائق على الجسور على الطرق على الحصى .. ولا يشترط أن تتم الصلاة في الطابق الرابع عشر الملحق به فندق خمس نجوم ومسرح ومطعم وانترنت ومئذنة 300متر ؟؟ إيه السفه ده ‍‍ ‍ ؟؟ إيه الهطل ده؟؟ إيه البذخ ده؟"
archived = "2010-03-14"
