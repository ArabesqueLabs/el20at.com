subject = "اتقوا الله في إخوانكم"
author = "عابر..."
posted = "2007-04-13"
text = "اتقوا الله في اخوانكم...طالبان...<br />هؤلاء الذين بشهادة الامم المتحدة الوحيدين الذين استطاعوا نشر الامان في بلاد الافغان...<br />واستطاعوا محاصرة زراعة وتجارة الافيون...والتي بشهادة الامم المتحدة تضاعفت بشدة بعد سقوطهم...<br />واذكروا شهادة مفتي الجمهورية المصرية السابق نصر فريد واصل الذي زار بلادهم وشهد على عدالتهم ودعا العلم الاسلامي لدعم دولتهم المسلمة الفتية...<br />ولا تنسوا أن اكثر ما يشاع عن قسوتهم لم يصلنا الا من خلال الاعداء ووكالات الانباء الصهيونية."
