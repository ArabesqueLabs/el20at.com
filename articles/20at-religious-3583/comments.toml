[[comments]]
order = 2
subject = "كما توجد مجالات إضافية للتعاون مثل دعم دولة القانو"
author = "الجمعية الافغانية للاصلاح والت"
posted = "2008-03-17"
text = "يهدف الجمعية الافغانية للاصلاح والتنمية الاجتماعية - أفغانستان إلى بناء وتعزيز هياكل الدولة، كما يهدف في الوقت ذاته إلى تعزيز قدرات الأفراد ويركز منذ 2002 على مجالات العمل التالية:<br />الطاقة (وخصوصاً الطاقات المتجددة)<br />الإمداد بمياه الشرب<br />التنمية الاقتصادية المستدامة (في المقام الأول توفير فرص للحصول على دخل)<br />التعليم الأساسي<br />كما توجد مجالات إضافية للتعاون مثل دعم دولة القانون وحقوق الإنسان، حيث يدور الأمر بالدرجة الأولى حول تحسين وضع النساء والفتيات وتعزيز آليات تنمية السلام."
archived = "2010-03-14"
