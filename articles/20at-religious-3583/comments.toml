[[comments]]
order = 1
subject = "كان النظام الحاكم وقتها ينتهك حقوق الإنسان"
author = "فضل عباس - أفغانستان"
posted = "2008-03-17"
text = "لقد تدخل المجتمع الدولي في أفغانستان لينهي الفترة التي كانت طالبان تحكم فيها بالقوة، حيث قاموا آنذاك بتحويل البلاد إلى معقل الإرهاب الدولي: فقد تم التخطيط لهجمات 11 سبتمبر/أيلول 2001 في أفغانستان. كما كان النظام الحاكم وقتها ينتهك حقوق الإنسان بأسوأ الطرق. كانت عمليات الإعدام تتم على الملأ وكأنها مناسبات عامة. كما كان المواطنون يتعرضون في الحياة اليومية للقهر وممارسات الضغط. أما النساء والفتيات فلم يكن لهن في حقيقة الأمر فرصة في الحصول على التعليم أو الوظائف أو الرعاية الطبية. حتى مُتع الحياة اليومية كانت ممنوعة: كانت الرياضة الشعبية المتمثلة في اللعب بالطائرات الورقية أمراً مستهجناً، كما كان سماع الموسيقى ممنوعاً.<br />كان موقع أفغانستان الجغرافي دائماً نعمة ونقمة في الوقت ذاته، حيث تتمتع بموقع محوري بين روسيا في الشمال وبين شبه القارة الهندية في الجنوب، وبين إيران في الغرب وبين الصين في الشرق. إننا ندعم أفغانستان كي تصبح عاملاً لتحقيق الاستقرار في هذه المنطقة الصعبة."
archived = "2010-03-14"
