[[comments]]
order = 1
subject = "إلى السعودي .. لماذا النفاق ؟!"
author = "محمد نواف الحمدالله ..."
posted = "2007-12-21"
text = "إلى السعودي لماذا يعني \" هيكل \" هل نسيت أو تناسيت غيره من الأدباء والروائيين وكبار النقاد والمحللين السياسيين سؤاء أكانوا عرب أم أجانب، يا عزيزي لاتقل لي هيكل ولا أحداً غيره، هناك أفضل من هيكل بألف مره ومره، ولكن العالم لا ينظر إلى الظاهر .. هم يبحثون على الظاهر لا على الخفي ؟! لماذا ؟!<br />أقول للسعودي، إنني احترم رأسك بشدة، وإنني أوافقك أن محمد حسنين هيكل مبدع لأبعد الحدود .. ولكن لماذا لا نرى إلا على النصف الفارغ من الكأس؟! لماذا لاننظر إلى النصف الباقي منها \" الذي به الماء \" .<br />أنا قصدي وبكل وضوح وصدق أن هيكل على العين والرأس، ولكن يوجد بهذا العالم أجمع ملايين الأشخاص هم أكثر كفاءة وقدرة ومحاورة، وهنا سوف اذكر لك بعضاً منهم لكي أثبت لك مدى صحة ودقة كلامي . وعلى سبيل المثال لا الحصر :<br />د. عزمي بشارة _ العضو المستقيل في الكنيست الإسرائيلي _، والروائي الفلسطيني الكبير القدير الشهيد / غسان كنفاني _ رحمه الله تعالى _ ، .. الخ وغيرهم الكثير والكثير واالكثير الذين إذا أردنا ولو على سبيل المثال جمعهم من شتى بقاع العالم سيحتاج ذلك لفترة طويلة تقريباً ؟!<br />بالنهاية، هيكل ليس سوى مثلهم بالضبط لاينقص عنهم بشيء ولايزيد عنهم بشيء .. شكراً ،،،"
archived = "2010-03-14"
