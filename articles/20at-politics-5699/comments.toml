subject = "وما ادراك ما هيكل"
author = "سعودي"
posted = "2007-05-06"
text = "بشكل حيادي بصراحة اذهلتني فدرة الرجل التحليلية والفكرية مع تقدمه بالعمر يزداد تألق وبغض النظر عن ما تتناقله ابواق السطات وبعض شطحاته ودفعاته عن نفسه في العصر الناصري والساداتي فهو رجل اقل ما يقال عنه انه مؤرخ وتاريخ حي بيننا وحسنآ فعلت الجزيرة حينما اعادة تقديمه للعالم وللمشاهد العربي بشكل محترم وحضاري. هيكل تكلم وفضح المكشوف اصلآ والمسكوت عنه وبلباقته المعروفة كشف بعض خفايا الدسائس والخيانات التي تمر عينا مرور الكرام."
