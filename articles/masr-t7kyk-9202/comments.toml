order = 0
subject = "الاسعار زى الفل والحاجات فى  السوق  - كل دى اشاعات"
author = "من المندسين"
posted = "2008-05-28"
text = "ربنا يخللى لنا الريس ويطول فى عمرة كمان وكمان<br />الاخبار الكاذبة بتوع العيال الهايفين اللى هم الاخوان والشيوعيين ان الاسعار غالية والناس مش لاقية تاكل - طيب ازاى<br />مثلا انا قدامى تقرير مقدم للرياسة من جهة امنية بناءا على طلب نقابة الاطباء ان ثلاث ارباع الشعب المصرى عندة مرض النقرس والمرض دة اسمة مرض الملوك ويأتى من كتر اكل اللحمة - الناس المفتريين بيفطروا لحمة ويتغدوا لحمة ويتعشوا لحمة - واللحمة عند الجزارين اكتر من الهم على القلب<br />والتقرير بيقول انة مطلوب فرض ضرائب تصاعدية على استهلاك اللحمة او جعل سعرها 500 جنية مثلا حتى نحد من استهلاك اللحمة محافظة على صحة الشعب<br />وصرح ابو جوزة عضو مجلس الشعب عن الحزب الوطنى انة يجب تصدير اللحمة الى اسرائيل حتى نحصل على العملة الصعبة<br />وكلة من خير الريس وربنا يزيدة من بركاتة"
archived = "2010-03-14"
