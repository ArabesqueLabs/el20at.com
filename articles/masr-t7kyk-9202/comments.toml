[[comments]]
order = 1
subject = "كل سنه وانت طيب يا ريس"
author = "مش رضوى حسن ولا دودي ام ننوشه"
posted = "2008-05-28"
text = "كل سنه وانت طيب يا ريس<br />كل سنه وانت راكب واحنا مركوبين<br />كل سنه وانت متجوز واحنا مش متجوزين<br />كل سنه وانت بايس واحنا متباسين<br />كل سنه وانت قالع واحنا مش قالعين<br />انت فاكرنا يا حبيب الملايين<br />فاكر الجعانين<br />فاكر العريانين<br />فاكر المضروبين<br />فاكل المشلحين<br />فاكر المسرطنين<br />فاكر المسروقين<br />فاكر المنهوبين<br />فاكر الغرقانين<br />مسكين يا حبيب الملايين حتفتكر مين ولا مين ولا مين"
archived = "2010-03-14"
capture_url = ""
