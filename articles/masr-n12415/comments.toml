[[comments]]
order = 0
subject = "ابو حصيرة وابو لحاف"
author = "ابو حصيرة"
text = "هى جت على ابو حصيرة ؟ هو دة اللى حارق النائب ومخلية متأثر خالص وكان ابوحصيرة والمولد بتاعة هما اللى دمروا اقتصاد البلد وخللى الاسعار تنط فى السما وتنشر العطالة والبطالة<br />يا عم طالب بالغاء قوات الامن المركزى وطالب بالغاء مباحث امن الدولة وطالب بتفعيل قانون من اين لك هذا ومحاسبة الحرامية واللى باعوا البلد<br />اللى باعوا البلد هم اللى عملوا مولد ابو حصيرة واللى بيحمى مولد ابوحصيرة الامن المركزى"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113230408/http://masr.20at.com:80/newArticle.php?sid=12415"

[[comments]]
order = 1
subject = "الحياة مولد"
author = "مصرى عندة الجنسية الاسرائيلية"
text = "ما عندنا 10 الاف مولد فيها اية لما يبقى مولد واحد لواحد يهودى<br />مش كلنا اتباع ابراهيم<br />والرئيس السادات كسر الحاجز النفسى<br />وكل يوم الرئيس حسنى بيقعد مع اولمرت<br />يعنى جت على مولد<br />ما فية 300 الف مصرى معاهم الجنسية<br />وفية مصريين فى الجيش الاسرائيلى<br />زعلانين لية<br />الشعبان سمن على عسل<br />بطلوا عقد نفسية"
archived = "2008-01-14"
capture_url = "https://web.archive.org/web/20080114032917/http://masr.20at.com:80/newArticle.php?sid=12415"
