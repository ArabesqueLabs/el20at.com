subject = "عجبت لك يا شعب؟؟؟؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-23"
text = "اقسم باللة العظيم ان شعبنا المصرى هذا للاسف الشديد يستحق ان يباد عن بكرة ابية؟حقا<br />ندفع حوالى 25 قرشا ثمنا للسجارة التى تدمر صحتنا و تقصف عمرنا و نحن سعداء بلهاء بما سوف تسببة لنا هذة السجارة القاتلة من مرض و موت سريع محقق؟؟؟<br />اما عندما تفكر الدولة متمثلة فى الحكومة المسكينة الضعيفة فى تحسين رغيف العيش و تطويرة بما يناسب حياتنا فالويل لمن يجاهر بهذا الرائى لصالح المواطن و الوطن<br />ماذا حل بنا يا عالم؟؟؟<br />اقسم باللة لو اننى كنت مسئول و بيدى القرار لكنت قد رفت ثمن رغيف العيش الى 50 قرش و حتى 100 قرش ايضا ؟؟؟<br />و اللى مش عاجبة فعلية ان يروح و يشرب من البحر؟؟؟؟؟<br />هذا قسم و وعد و اللة شاهد على ما اقولة<br />و للحديث بقية؟؟؟؟؟ انشاءاللة"
archived = "2008-08-23"
capture_url = "https://web.archive.org/web/20080823184056/http://masr.20at.com:80/newArticle.php?sid=17180"
