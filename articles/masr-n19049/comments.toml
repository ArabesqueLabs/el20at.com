[[comments]]
order = 0
subject = "على اخر الزمن .."
author = "محمد المصري"
posted = "2008-12-31"
text = "على اخر الزمن بيحرقو العلم المصري َ!! .. حسبي الله ونعم الوكيل فيهم .<br />انا مش عارف المفروض مصر تعمل لهم ايه يعني ..<br />ما العرب كلهم واقفين ايد ورا وايد قدام .. مصر ياما قدمت للعرب .. كانو العرب قدمو لنا ايه يعني ؟!<br />هما عايزنا ندخل حرب تانيه ونرجع 60 سنة لورا .. وهما يفضلو قدام .. انا مش فاهم ايه الناس الغبيه دى ..<br />من الاخر مش هانحارب .. يولع الوطن العربي كله فى سبيل الحفاظ على امن وسلامة ونهضه مصر .."
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103053955/http://masr.20at.com:80/newArticle.php?sid=19049"

[[comments]]
order = 1
subject = "مصر فوق الجميع"
author = "حسين كامل"
posted = "2008-12-31"
text = "الهجوم على مصر !!! لماذا !! لم نسمع احد تهجم على سوريا او ايران او حتى على اصحاب المشكلة الرئيسية وهم الفلسطنيين ممن انقسموا على انفسهم وحاربوا بعضهم البعض !! الجميع يهاجم مصر والسبب معبر رفح !! وهنا السؤال لو سمحت مصر بفتح المعبر هل ستتوقف اسرائيل عن ضرب غزة , العكس هو الصحيح سوف تضرب غزة وسوف تدك وتدمر المعبر من اتجاه غزة مثلما دمرت الانفاق التى تربط بين مصر وغزة ولكنها دمرتها من داخل غزة .. الهجوم على مصر ليس وليد اللحظة بل هو هجوم معد مسبقا والسيناريو جاهز ومعد بدقة فحماس تستفز اسرائيل باطلاق الصواريخ واسرائيل ترد على حماس بعنف ومع اول طلقة من اسرائيل على حماس ينطلق فى المقابل الهجوم على مصر من جانب حماس وحزب الله وايران فى الخارج والاخوان المتأسلمين فى الداخل , والاخوان المتأسلمين فى الداخل باعوا انفسهم لايران والدليل خروج مرشدهم العام منذ ايام ليطالب فى توقيت غريب بنشر المذهب الشيعى فى مصر !! لكن مهما حدث ستظل مصر اكبر من الجميع ."
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103053955/http://masr.20at.com:80/newArticle.php?sid=19049"

[[comments]]
order = 2
subject = "شعب من الناج يقتاتون (القات)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-01-01"
text = "حيوانات من النعاج تقتات ب (القات)<br />هذة هى اليمن رئيسا و تيوسا<br />اتفوا عليكم يا حثالة اللة فى الارض العربية<br />مصر و شعب مصر و علم مصر هم ما يستر بة عورتكم العفنة<br />ملعون ابيكم ايها الشعب النعاج"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103053955/http://masr.20at.com:80/newArticle.php?sid=19049"

[[comments]]
order = 3
subject = "الى (محمد المصرى)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-01-01"
text = "اشكرك على مصريتك ووطنيتكم<br />بارك اللة فيكم و فى مصر التى انجبتك<br />دع العرب الكلاب يشربون من بول الاستعمار و ياكلوا من برازهم العفن<br />ملعون ابو كل العرب و لتحيا مصر و الى الامام يا مصر<br />طظ فى كل العرب الجرب<br />و اتفوا عليهم"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103053955/http://masr.20at.com:80/newArticle.php?sid=19049"
