posted = "2009-01-07"
text = "عندما امربوش الحكام العرب بالمشاركه فى حرب تحريرالكويت سارع كل منهم بارسال خيرة ماعنده من قوات عسكريه<br />وعندما ضربت غزه الكل يشاهد ويدلى بتصريحات للفرقه الاعلاميه فقط الى متى هذا الهوان والذل والخوف من بوش هذا<br />انهم سوف يموتون ويحاسبون عن كل قطرة دم نزفت من طفل اوامرأه اوشيخ مات اوجرح ماذا هم قائلون اذا<br />عودواالى الله ولاتخافوا من بوش اوغيربوش اللهم يلغت اللهم فشهد"
