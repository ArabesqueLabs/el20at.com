[[comments]]
order = 1
subject = "الحجاب"
author = "الى الباحثين عن الحقيقة"
posted = "2008-08-18"
text = "ما أجمل الحجاب و من قال أن المحجبات فى شرنقة؟ أيجب أن تكون المرأة رخيصة لتستمتع بحياتها؟<br />مثال لو تريد شراء حلوى و أمامك المكشوفة و المغطاة مادا تشترى؟<br />مشكلتنا أننا نعتقد أن الدين ليس به بهجه و لكن الحقيقة أن بدون الدين لا توجد سعادة"
archived = "2010-03-14"
capture_url = ""

