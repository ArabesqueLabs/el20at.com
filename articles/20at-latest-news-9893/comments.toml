subject = "و فيها إيييييييييييه"
author = "ياسمين"
posted = "2008-08-20"
text = "لازم طبعا دعاة التخلف و الجاهلية يطلعو علينا من الجحور علشان يحرمو علينا عيشتنا<br />أراهن لو أصحاب التعليقات إللي فوق كانو شافو شكل الزي ده إيه قبل ما يبتدو الهجوم المنظم!!<br />ممكن حد يقوللى فيها إية إن البنت المحجبة تمارس رياضة بزى محتشم؟<br />حلوي إيه يا أستاذ إللى بتتكلم عنها!!..إلمثال ده بالذات عفا عليه الزمن<br />إنتو اللي مشوهين صورة الإسلام و فاكرين إن معنى الحجاب هو الإحتجاب و الإنعزال<br />و الأستاذة الباحثة عن الحقيقةمين قال(( ان حكمة الله تقتضي أن تكون حياة المحجبة محدودة النشاطات))...هو ربنا قالك كده؟؟ يعنى ممكن تقوليلنا إية دليلك على الكلام ده..ورد فين بالظبط؟؟ متهيألي الكلام ده مش موجود إلا في كتب الوهابية المتطرفة إللى كل همها هو خنق و عزل المرأة.<br />أعوذ بالله منكم و من أمثالكم."
archived = "2010-03-14"
