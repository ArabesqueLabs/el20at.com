subject = "عفواً من فضلكم"
author = "باحثة عن الحقيقة"
posted = "2008-08-18"
text = "السلام عليكم :<br />أحببت أن أوقف أي قارئ لهذا المقال لأسئل , أين يقف الحجاب الشرعي من كل هذا الكلام .<br />نشكر مصممة الأزياء على جعل الحياة سهلة للمحجبات ,لكن أليس الله هو الذي قال (( يريد الله أن يخفف عنكم و خلق الانسان ضعيفاً ) . ان حكمة الله تقتضي أن تكون حياة المحجبة محدودة النشاطات , فلماذا علينا اختراع الحجاب المناسب للنشاطات الرياضية اذا كانت تنافي الحجاب الشرعي .<br />في النهاية هذه و جهة نظر شرعية و ليست شخصية<br />و الله يهدي الجميع"
archived = "2010-03-14"
