text = "طيب بما اننا بصدد التحدث عن فرصة العمل فى موقعكم .. ماذا عن الحفلة التى وعدتم بها الفائزين فى مسابقة عشرينات منذ أكثر من شهر , وحتى اليوم لم يجر تنفيذها او حتى الاعتذار عن تنفيذها ؟ ارجو لكل المتقدمين التوفيق ... لكن ارجو ان توضح لنا ادارة عشرينات لماذا لم تف بوعدها حتى لحظة كتابة هذة السطور"
