[[comments]]
order = 0
subject = "الواقعية مطلوبة - من ينتخب قبطى او امرأة لتولى الحكم"
author = "ناسى اسمى"
text = "البرنامج الانتخابى للاخوان او غير الاخوان تراعى الواقعية - فلنفترض يا سيدى ان قبطيا او مصرانى رشح نفسة للانتخابات - لا اقول لرياسة الدولة ولكن عضوا لمجلس الشعب فى اماكن تواجد المسيحيين فى شبرا مثلا - هل سينجح ؟<br />التاريخ يقول انة ولا مرة واحدة نجح مصرانى فى الانتخابات فى شبرا لضئالة عددهم ولكن يتم تعيينهم فى البرلمان بواسطة قرار جمهورى<br />فما بالك لرئيس للدولة مصرانى يتم ترشيحة لرئاسة الدولة - احنا هنهرج - هنقول نكت<br />الاخوان فى برنامجهم واقعيين وكل الاحزاب كذلك<br />والواقعية بتقول كدة<br />لان 96 % من المصريين مسلمين<br />لنترك احلام الوهم جانبا وخللونا واقعيين"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327002824/http://masr.20at.com:80/newArticle.php?sid=20408"

[[comments]]
order = 1
subject = "انا مش شايف اي مشكلة لما مسيحي يبقى رئيس جمهورية"
author = "والله العظيم مسلم"
text = "يعني مثلا وانا في المدرسة كان مرة ناضر المدرسة الاعدادية بتاعتنا مسيحي وكان كل المدرسة مسلمين ايه المشكلة<br />ومرة شفت رئيس حي كان مسيحي ايه المشكلة<br />وفيه مرة برضه شفت مأمور قسم كان ضابط مسيحي وما حصلش حاجه<br />ومرة شفت مدير مستشفى كان مسيحي والمستشفى كلهم مسلمين وما حصلش حاجه<br />وايضا كان فيه محافظ مسيحي والمحافظة كلها مسلمين ايه المشكلة<br />اذا كان المسيحي ممكن يدير البلد افضل من المسلم فمرحبا به"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327002824/http://masr.20at.com:80/newArticle.php?sid=20408"

[[comments]]
order = 2
subject = "مع كل احترامى لراى المعلق السابق"
text = "الا انة يا اخى الكريم وضع رئيس الدولة التنفيذى غير الامثلة التى ذكرتها لموظفين سواء ناظر او مامور او مدير مستشفى لة رئيس ةرؤساء يراجعون ورائة<br />رئيس الدولة مش موظف عادى<br />يعنى مثلا هل ترضى بريطانيا وفيها 5 ملايين مسلم او فرنسا وفيها ستة ملايين مسلم او المانيا وفيها مليونين من المسلمين - هل ترضى هذة الدول ان يحكمها مسلم ؟<br />الوضع لرئيس الدولة مختلف"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327002824/http://masr.20at.com:80/newArticle.php?sid=20408"
