subject = "يا سلام يا مأمون فندي"
author = "بديع الزمان"
posted = "2008-11-18"
text = "إيه الذكاء اللي بيخر من عنيك ده! مش الشرق الأوسط دي بتاعة واحد من قبيلة موردخاي و أنت فاكر بذمتك زنهم دعوكم علشان أهميتكم و لا علشان فلوس البترول اللي رنتم أصلا سارقيه. بياعيب الشوم عليك إتلم و إسكت أحسن يعني مش كفاية اللى سرقته أمريكا من مال الله و برضاكم واللي راح منكم في لعبة الأزمة المفتعلة لا بخيبتك فرحان علي اللي جاي ما هو أنت فاكر مين حيدفع الفاتورة تفتك مثلا السفح بوش ولا المومس ميركيل و لا المعاتيه الباقين لا ياعم هم لم و لن يجدوا أغبي و أطوع منكم لذلك دعوكم و ليه نسيت شغلة المغفل الكبير بتاعكم ال ايه حوار أديان ال و ما هو الا تطبيع مع الحبايب و القرايب اختشوا بقي و لا هم اللي اختشوا ماتوا."
