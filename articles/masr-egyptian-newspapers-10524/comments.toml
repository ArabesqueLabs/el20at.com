subject = "محكمة مصرية تحكم على مواطن مصرى بالسجن المشدد 3 سن"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-17"
text = "حكمت احدى المحاكم المصرية على مواطن مصرى سب و شتم و قذف فى حق مواكن مصرى<br />بالسجن المشدد 3 سنوات و غرامة 10000 جنية مصرى كفالة لعدم تنفيذ الحكم؟<br />المواطن الصادر ضدة الحكم و صف المواطن المصرى المعتدى علية بانة(سعودى)<br />هااااااااااهاااااااااهاااااااهااااهاااااها<br />نكتة مهداة الى ابناء و طننا بالمنفى السعودى نتيجة لما لحقهم من ظلم و اهانة على ايدى هؤلاء الرعاع البرابرة<br />(عاشت مصر حرة) و عاشت السعودية فى ظلم و استبداد و جهالة و غباء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "و احد من اياهم مواطن من مواطنين الدولة المتخلفة ال"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-17"
text = "يحكى ان واحد من الحمير من مواطنى الدولة البربرية المتخلفة الى بتجلد ابناء ستها و تاج راسها مصر مات ؟<br />و جدت الملائكة الى كانت هتحاسبة ان افعالة السيئة مساوية لافعالة الحسنة ؟<br />فخيرتة بين دخول (جهنم ) و دخول(الجنة)؟<br />تعرفوا كانت اجابتة ابة؟؟؟؟؟؟؟!<br />لا انا عايز ادخل مسرحية ل(فيفى عبدة)<br />(حزمنى يا تيس)!!!!!!!!!!!!!!!!!!!!!!!<br />هااااااااا هاااااا هااااااااا هااااااااااااااااااا هااااااااااااا<br />صحيح امة من الاعراب الجرب المتخلفين الظلمة البرابرة<br />اتفوا عليكم و على نظامكم الاستبدادى القذر<br />الف مليون سلاما و رحمة عليك يا صدام انت خير من كان ليؤدب هذة المملكة المتخلفة بضرب (النعال) و (البصاق)عليهااااااااااااا<br />(مصر)ستكون مصر حتى قيام الساعة<br />و ابناء (مصر سيكونون اسيادكم مهما اعطاكم اللة )الى قيام الساعة<br />اتفوا عليكم يا حثالة الجرب يا رعاع يا مخنثين يا مريدى الاطفال و تاركى النساء؟<br />الف مليون اتفواااااااااااااااااااااااااا يا كلاب يا ولاد الكلاب"
archived = "2010-03-14"
capture_url = ""

