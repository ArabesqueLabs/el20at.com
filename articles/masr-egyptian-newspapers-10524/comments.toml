text = "كلاكيت موش المرة الاولى؟<br />هنكرر<br />و التاريخ خير شاهد؟!!!<br />تم جلد مربى فاضل ناظر يعمل بالتدريس بالسعودية بعد ان تم اغتصاب ابنة؟<br />و حاليا تم سجن و جلد طبيبان مصريان<br />و الباقية تاتى ؟<br />و لا من مجيب!!!<br />حقا تستحق السعودية لقب<br />(المملكة العربية الحيوانية البربرية المتخلفة السعودية)<br />حقا تستحق دورا حيوانيا<br />ليخرج السعوديين الانجاس من مصر الى غير رجعة و الى اوسخ و اقذر بلاعة مجارى هؤلاء الشواز مريدى الاطفال و الرجال و تاركى النساء للسحاق و اللواط<br />مليون الف أتفوا عليكم يا كلاب يا ولاد اوسخ الكلاب"
