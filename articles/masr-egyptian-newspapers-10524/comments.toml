subject = "أحدث نكتة عن أخواتنا (البرارة)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-18"
text = "يحكى ان ملكا من الملوك اياهم الجهلة الغير متعلمين اللى ما بيعرفوش يفكو الخط؟!!!!!!!!<br />دخل الى الحمام ليستحم و ينظف نفسة من الاوساخ التى فى عقلة و على جسمة؟<br />فعندما رأئى نفسة عاريا أمام المراه حكم على نفسة بالجلد 1500 جلدة و قطع رقبتة<br />ههههههههههههههههههههههها هاااااااااااااااااااااااااااااااااااااااااااااا هااااااااااااااااااااااااااااااااااااااااااااااااا ههههههههههههههههههها هههها هاااااا<br />(مهداة) الى أخواتنا الاطباء الشرفاء فى معتقل المغول و المحكوم عليهم ب 1500 جلدة و 15&20 سنة سجن؟<br />بالذمة دى احكام ام انتقام رعاع متخلفين برابرة!!!<br />(تحيا مصر حرة) و يسقط الجميع الجهلة الاغبياء!!!<br />أستجب لنا ياللة انك مجيب الدعاء"
