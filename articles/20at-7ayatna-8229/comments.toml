posted = "2008-02-13"
text = "يعني الناس بطلت تفكر إلاّ بالأكل وتعبي بطونها .. ياناس .. ياعالم .. اصحوووووووووووووووا ؟<br />وبعدين إحنا مش مخالفين معاهم على قضيتهم ( الدولمة * ) بس الأولوية لازم يكون إلها مكان بحياتنا ..<br />والأشياء والأمور المهمة والضرورية بحياتنا لازم نخلص منها أول بأول .. مش نحط الأشياء والأمور التافه السخيفة اللي ملهاش معنى بحياتنا في سلم أولوياتنا ...<br />كلمة أخيرة ،،، الله يعين أصحاب العقول السليمة .. ويانيالهم !!! أصحاب العقول \" المأجرة الطابق الفوقاني \" يعني المجانين<br />ياعمي في عالم ثاني هذووووووووووووووله ... آآآآآآآآآآآآخ آآخ .. آخ زمن أغــــــــــــــــــــبر !"
