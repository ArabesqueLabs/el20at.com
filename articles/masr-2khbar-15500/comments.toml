author = "المعلق السابق"
posted = "2010-02-28"
text = "مش عايزين واحد يكون اساتذة في العلاقات الدولية<br />احنا عايزين واحد يكون استاذ في<br />1) الارامل والايتام<br />2) العاطلين عن العمل<br />3) العنوسه<br />4) مرضى السرطان والفشل الكلوي<br />5) الاطفال المشردين<br />6) الفأر والغلاء<br />وخلافه من احتياطات الشعب المصري<br />حتجبلنا اساتذة في العلاقات الدولية ويلبسوا بدل وكرفتات ويدلعوا على حساب الشعب<br />اللي في الصورة دي ما ينفعوش ببصله<br />بص في الصورة كويس وحدق فيها وانت تعرف هما مين<br />بيضحكوا والشعب المصري بيتألم<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2010-03-14"
