[[comments]]
order = 3
subject = "ذكور مخادعون"
author = "زوجة مسلمة"
posted = "2007-03-11"
text = "حلم كل فتاة الحب والزواج والامومة والاستقرار النفسى والعائلى وتحافظ على نفسها حتى ياذن الله لها بالزواج ويتقدم لها الشاب بصورته الجميلة المقنعة وتوافق الفتاة وتتزوج منه وكلها امال بالسعادة الموعودة وبعد الزواج تكتشف الزيف فى شخصيته قلبه القاسىوبخله المادى والعاطفى وانانيته فهو لايحب الانفسه ولايخاف الاعلى نفسه ولايشيل الاهم نفسه وتجد روحها مع الوحدة والحرمان مثقلة بمسئوليات البيت اولا ويضاف اليها مسئوليات الاولاد بعد ذلك وتكتشف الزوجة المسكينة ان الزوج اراد بالزواج تكوين اسرة واولاد للمظهر الاجتماعى وليحمل الاولاد اسمه اما هى فما هى الا وسيلة لذلك او سلم لبلوغ المراد ويبخل عليها فى المال والمشاعر ولا يلبى احتياجاتها العاطفية والجنسية ولا يهتم بذلك اين المودة والرحمة انه بعيدا فى الشارع يبصبص للنساء والفتيات ويحاول الوصول اليهم ليشبع رغباته ويرجع لزوجته يعانى من الامراض الجنسية والصديد ياكل حيواناته المنوية وينقل اليها الامراض الجنسية القذرة غير عابىء بشىء هذا هو الزوج كذاب خاين بخيل مخادع وماذا تفعل الزوجة تقتلها الوحدة والحرمان وتحاول جاهدة البقاء على الاسرة والمحافظة على الاولاد من التشرد والضياع _اضاع زوجها شبابها وصحتها البدنية والنفسية ولولا ستر الله لانساقت وراء نزواتها لاشباعها فهى بشر واين الزوج لايهتم الا بنفسه ويمثل دور القيم على النساء وربما بفلوس زوجته وامام الناس يعمل الفلوس فلوسه هذه ماساتى مع زوج مخادع كذاب ضلالى تزوجنى وردة جميلة متعلمة مؤدبة وبعد ذلك استحل اموالى وحرمنى من حقوقى الزوجية بالسهر خارج البيت والهروب لحجرة الاولاد وبامراضه الجنسية ورائحته القذرة وامر الاطباء بعدم الممارسة حاليا ومع ذلك ثقته بنفسه عظيمة لماذا لاادرى ربما لان هناك نساء ترضى به على حالته هذه والطيور على امثالها تقع _ ماذا افعل لاحيا سعيدة ؟ اخاف الضعف البشرى يارب اعيننى ."
archived = "2010-03-14"
