[[comments]]
order = 0
subject = "نفسي اعرف"
author = "احمد"
posted = "2007-02-06"
text = "يا مسؤولين عشرينات بجد نفسي اعرف حاجة عشان بجد انتوا زودتوها اوي<br />انتوا ليه سايبين كل بلاد العالم وماسكين في السعودية<br />على فكرة انا مش سعودي انا مصري بس بجد عشان حاجة زادت اوي عن حدها يعني انتو سايبين بلاد الوطن العربي كلها<br />وماسكين في السعودية وكل شوية مقالة عن السعودية مرة ماكياج الامتحانات ومرة مش عارف راس السنة في السعودية ومرة انفاس السعودية ومش عارف شباب السعودية ودلوقتي الموضوع ده وكل ده في فترة زمنية قصير نسبيا وكأن مواضيع بلاد العالم كلها خلصت ومتبقاش غير السعودية<br />على فكرة انا واثق ان ناس كتير من زوار الموقع لاحظوا ده بغض النظر عن اتفاقهم او اختلافهم مع المواضيع المطروحة عن السعودية<br />بس يا ريت تهتموا ببقيت بلاد الوطن العربي الا اا كان للموقع سياسة معينة"
archived = "2010-03-14"
