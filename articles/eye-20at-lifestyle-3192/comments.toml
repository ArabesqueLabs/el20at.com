text = "نتمنى لكم الفرح والسلام والمحبة لأن السلام افضل من الحرب والمحبة افضل من الكراهية كما ان النور أفضل من الظلمة<br />سلام لكم في محبة الله.نتأمل زياراتكم الكريمة لموقع النعمة موقع مجلة النعمة يقدم كلمة الله الكتاب المقدس الإنجيل رسالة السيد يسوع المسيح قراءات مختارة مواضيع مصيرية قصص واقعية شهادات شخصية ترانيم ممتازة ردود مؤكدة كتب بنّاءة رسوم تسالي تأملات يوميات"
