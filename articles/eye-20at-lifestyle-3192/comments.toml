subject = "انتو حتشلونا؟"
author = "طالب ثانوية عامة"
posted = "2007-02-06"
text = "إذا كان طلبة السعودية اللي منهج الثانوية العامة اسهل من منهج تانية ابتدائي عندنا في مصر و يعملوا كده امال انا اعمل ايه؟<br />سعات بحس انه من اللي انا فيه ان مش حرام اني اولع في روحي واخلص<br />يا عم احمد ربنا عالمناهج بتاعتك بلا صعبة بلا قرف و اسكت لحسن تتسحب النعمة دي منك<br />ولا أراكم الله مكروها في عزيز لديكم و حسبنا الله في كل اللي مسكو الوزارة من اول سرور لحد يسري الجمل"
