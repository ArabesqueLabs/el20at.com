subject = "فعلا هذه الغرائب تحدث ولكنها تظل فردية"
author = "سعود"
posted = "2007-02-07"
text = "على فكرة قرأت في إحدى الجرائد موقف طريف<br />وقف أحد المعلمين لمادة الجغرافيا محتارا لبضع دقائق أمام إجابة أحد الطلاب المحيرة عن أحد الأسئلة وفشل في الفصل في صحتها، وكان الطالب أجاب على سؤال يقول «ما أسباب هبوب الرياح؟ بقوله «قدرة الله سبحانه وتعالى» ويقول المعلم «احترت في احتساب الإجابة صح أم خطأ فالمطلوب من الطالب ذكر عوامل البيئة التي تساعد على هبوب الرياح بعد قدرة الله تعالى"
