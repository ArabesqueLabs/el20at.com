order = 1
subject = "مش اسلاميين أساسا"
author = "أبو الحسين السلفي"
posted = "2008-11-15"
text = "و لا اسلاميين و لا بطيخ (( ننشر مفاهيم الديمقراطية )) هذا كلامهم في الموقع و المعروف أن الديمقراطية حكم الشعب لنفسه و الإسلام يقول إن الحكم إلا لله ........أما الديمقراطية فالتشريعم من الناس و الأحكام من الله و القوانين قابلة للمناقشة و للرد و للتعطيل أما احكام شرع الله فغير قابلة فلا نرمي الكلام على عواهنه و نصف كل من هب و دب من جهلنا فيه بالإسلامية ...."
archived = "2010-03-14"
