subject = "مفهوم خاطئ"
author = "لينا عبود"
posted = "2007-04-10"
text = "... لا شيء يدل على الاسلامين وقد كتب بالحرف الواحد انهم (ونفى السيد أن يكون الموقع تابعا للاخوان المسلمين قائلا إنه \"ينطلق من مجهود ذاتي لمجموعة من الشباب على الانترنت)<br />ثم أن عمرو دياب اخطأ في فهم موضوع التبرعات.. لان التبرع و فعل الخير ملزوم ومتفق مع السريه في فعله فلا نفعل الخير ونتصدق ونتبرع ومن ثم نملئ الدنيا اخبارا اننا تبرعنا .. التبرع يكون لوجه الله تعالى وليس لنيل استحسان موقع الكتروني وحذف القائمه السوداء .."
