order = 0
subject = "نكتة قديمة عن اسلوب العمل فى وزارة السلخانة المسماة داخلية"
author = "القرموطى باشا"
text = "النكتة قديمة قوى وبتقول<br />ان السيد الرئيس وعقيلتة كانوا فى زيارة الى منطقة الاهرامات - وشاهدوا جماعة من الاثريين يحفرون باطن الارض واستخرجوا تمثالا لاحد الفراعنة والتمثال جميل جدا ولكن ليس علية اى علامات ولا اى كتابة واستغرب وسأل الاثريين التمثال دة بتاع مين فأجابوة انهم مش عارفين ولا يوجد ما يدل علية<br />التفت السيد الرئيس الى وزير داخليتة الهمام وقال انا عايز اعرف كل حاجة عن التمثال دة<br />بعد ساعتين<br />اتصل وزير الداخلية بالرئيس<br />تمام يا افندم احنا عرفنا التمثال دة - دى التمثال يا افندم بتاع رع نفر امون من نزلة السمان وكان من حراس الملك ومات وعمرة 50 سنة بعد ان شارك فى معارك فيما وراء النهرين وجرح هناك<br />صاح الرئيس مبهورا هايل وجبتوا المعلومات دى من اين ؟<br />قال وزير الداخلية<br />ابدا يا افندم دى اعترافات التمثال نفسة"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090728/http://masr.20at.com:80/newArticle.php?sid=16076"
