text = "السلام عليكم ...ارجو من صاحب التعليق الذي يبدا بما وجه التعارض ان يتفهم الدين الاسلامي جيدا ....وعلى فكره العلماء عملو دراسة عن القران والموسيقة ووضعو سماعة في ادن شخص يسمع القران والشخص التاني موسيقى وعلوهم على الاخر فلاقو انو الموسيقى عملت اضرابات في الدماغ اما القران لا وهاد غير الامور الاخرى بس ما بدي اطول عليكو"
