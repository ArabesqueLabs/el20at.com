text = "اقول لكم بالحقيقة ان الموسيقى لم تستعمل لعلاج النفوس الا لان حدس النفس البشرية قال دلك . فادا اطمانت للموسيقى ما ينتقص هدا من قيمة القرآن في شيئ انما العيب ان ننسب الموسيقى للغربيين تجاوبت النفس مع الموسيقى وكفى ولو شاء بارئ الموسيقى وبارئ القرآن وبارئ النفس غير دلك لكان"
