order = 0
subject = "ثلاثة ينتظرهم العالم (المهدي والمسيخ والدجال)"
author = "ابومحسن (منقول)"
posted = "2008-12-30"
text = "المهدى المنتظر سيظهر فى اخر الزمان اسمه محمد بن عبد الله او احمد بن عبد الله وأنه من أهل بيت رسول الله صلى الله عليه وسلم من ولد فاطمه وأنه يشبه الرسول (ص) فى الخلق ولا يشبهه فى الخلق وأنه أجلى الجبهه(منحسر الشعر عن مقدمة الرأس) أقنى الأنف (أنفه طويله) يملأ الأرض قسطا وعدلا ,يقيم شعائر الاسلام,يحيى ما اندثر من سنة الرسول( ص) يكثر الرخاء فى ايامه من وفرة العدل يمكث 7 سنين ثم يأتى بعده الدجال ثم ينزل سيدنا عيسى فيتعاون مع المهدى على قتله.<br />فأذا قتل الدجال انهزم اليهود الذين يقاتلون معه وعددهم سبعون الف ثم يكشف الله أمرهم وعندما يتوارى منهم يهودى وراء أى شىء الا أنطق الله هذا الشىء<br />ياعبد الله المسلم هذا يهودى تعال اقتله وبهذا يقضى على أكبر فتنه من الفتن التى تحدث فى الأرض<br />ثم يعمل سيدنا عيسى على محو المسيحيه التى ارتكبت كل الحماقات بأسمه والتمكين للدين الحق وهو الدين الاسلامى<br />عن أبى هريره رضى الله عنه أن النبى صلى الله عليه وسلم :<br />والذى نفسى بيده ليوشكن أن ينزل فيكم ابن مريم حكما مقسطا فيكسر الصليب ويقتل الخنزير ويضع الجزيه ويفيض المال حتى لا يقبله أحد ,حتى تكون السجده الواحده خيرا من الدنيا وما فيها<br />ثم قال ابو هريره رضى الله عنه اقرءوا ما شئتم وان من أهل الكتاب الا ليؤمنن به قبل موته ويوم القيامه يكون عليهم شهيدا<br />أى ما من أحد من أهل الكتاب الا ليؤمنن بعيسى عليه السلام قبل موت عيسى حين ينزل الى الارض,قيل قيام الساعه.<br />ثم يحدث بعد ذلك النقصان ولا يزال الناس يبتعدون عن الدين شيئا فشيئا حتى يرتدون عن دينهم فتقوم الساعه وهم على ماهم عليه من رده وليس بعد الكمال الا الفناء والزوال.<br />كما قال الله تعالى سورة الفتح ايه 28<br />(هو الذى أرسل رسوله بالهدى ودين الحق ليظهره على الدين كله وكفى بالله شهيدا)<br />اللهم لا تميتنا الا وانت راض عنا<br />اللهم اغفر لنا ذنوبنا فلا يوجد احد غيرك نلجأ اليه<br />ربى لقد قلت ادعونى استجب لكم فاها انا ادعوك ان تهدى فتيات وشباب المسلمين<br />اللهم امين اللهم امين اللهم امين"
archived = "2008-12-30"
capture_url = "https://web.archive.org/web/20081230151736/http://masr.20at.com:80/newArticle.php?sid=19015"

[[comments]]
order = 1
subject = "دعاء"
author = "مش كاتب"
posted = "2008-12-30"
text = "اللهم أنت الله لا إله إلا أنت<br />نسألك بكل اسم هو لك<br />سميته نفسك، أو علمته أحد من عبادك<br />أو استأثرت به في علم الغيب عندك<br />أن ترفع الظلم والأذى عن عبادك المستضعفين في غزة<br />وأن تنصرهم وتؤيدهم<br />يا منّان يا منّان يا منّان<br />مُنَّ عليهم بكرمك وعفوك ونصرك<br />يا مغيث أغثهم<br />يا مغيث أغثهم<br />يا مغيث أغثهم<br />اللهم إن اليهود قد طغوا وتكبروا فأرنا فيهم عجائب قدرتك<br />اللهم زلزل الأرض من تحت أقدامهم<br />اللهم يا جبار يا علي يا قدير إنهم لا يعجزونك وأنت الأعلى<br />اللهم اقتلهم بددا<br />واحصهم عددا<br />ولا تغادر منهم أحدا<br />اللهم دمر اليهود والخونة<br />ورد كيدهم في نحورهم<br />واجعل الدائرة تدور عليهم<br />يا منّان لا إله إلا أنت<br />وحد كلمة المسلمين<br />ونقهم من الخونة ومن كل ما يريد بهم شراً<br />ورد كيد الغادرين في نحورهم يا رب العالمين<br />وآخر دعوانا أن الحمد لله رب العالمين."
archived = "2008-12-30"
capture_url = "https://web.archive.org/web/20081230151736/http://masr.20at.com:80/newArticle.php?sid=19015"

