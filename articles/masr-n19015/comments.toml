[[comments]]
order = 3
subject = "مظاهرات الهبل تعم مصر"
author = "مش فرحان"
posted = "2008-12-30"
text = "اللي بيتظاهروا مش فاهمين اي حاجه في اي حاجه<br />وهما مش عارفين بيتظاهروا ليه<br />اهو اي حاجه يتظاهروا علشانها<br />طيب ما هي اسرائيل بتعتدي على الشغب الفلسطيني من عام 1948 وكل سنه بنسمع عن مجذره للفلسطينيين وكان فيه مجزره اسمها (قانا) فاكرين في لبنان والدنيا قامت وقعدت تاني<br />انت مش فاهمين اي حاجه في اي حاجه<br />اسرائيل فاهمه كل حاجه وعارفه كل حاجه<br />لكن احنا يا خساره احنا نفهم في ماتشات الكوره بتاعة الاهلي والزمالك وافلام عادل امام ومحمد هنيدي واللمبي ويسرا<br />ونتفرج على الفضائيات اللي حزلتها الى امة مسخ<br />يا شماتة الاقباط فيها"
archived = "2008-12-30"
capture_url = "https://web.archive.org/web/20081230151736/http://masr.20at.com:80/newArticle.php?sid=19015"

