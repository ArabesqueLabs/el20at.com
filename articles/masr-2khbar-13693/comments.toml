author = "كامب ديفيد"
posted = "2009-10-13"
text = "فى ذكرى كامب ديفيد هذا العام اجرت صحيفة اسرائيلية استطلاع راى بين اليهود فى اسرائيل عن مدى رغبتهم فى اعادة احتلال سيناء مرة اخرى<br />وايد 90 % ممن اخذت ارائهم اعادة احتلال سيناء مرة اخرى<br />ولذات الشعر الاشقر فى الصورة ان تشرح لنا كيف يشعر اليهود باعادة احتلال بلادنا ثم تقابلهم وتسقيهم البارد والساخن فى مكتبها وهم يخططون لاعادة احتلال سيناء ويرغبون فى ذلك<br />العملية مفيش فيها ديمقراطية ولا سلام ولا بدنجان<br />العملية فيها عدوى وعدوك<br />فيها ارض مغتصبة وفيها بيت المقدس اسير<br />لا يوجد اى عذر لاى انسان يقابلهم وهم يخفون الخنجر بين ثيابهم"
archived = "2010-03-14"
