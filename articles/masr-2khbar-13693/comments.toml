text = "ملعون ابو اللى يتصل او يكلم او يقابل اسرائيلى كلب<br />ملعون ابن ملعون وابن كلب اللى يقابل اليهود<br />لان بيننا وبينهم دم<br />ولا يمحو الدم غير الدم<br />والثار قادم<br />فاى واحد او واحدة بنت وسخة بتقابل اليهود تبقى يهودية زيهم<br />__________________________________________<br />مصرى مصاب من الحرب"
