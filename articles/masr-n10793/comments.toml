capture_url = "https://web.archive.org/web/20070627154244/http://masr.20at.com:80/newArticle.php?sid=10793"

[[comments]]
order = 1
subject = "جميلة هذه المحظورة"
author = "علي بن حاجب"
text = "موضوع جميل جدا ...<br />وفكرة المجلة أيضا جميلة ، فهي ستجذب الناس لقراءتها من خلال اسمها<br />لكن سؤالي : هل ستستمر المجلة بعد الانتهاء من مشروع التخرج ؟؟<br />أم هو مشروع تخرج وخلاااااااااااص ؟؟!"
archived = "2007-06-27"
capture_url = "https://web.archive.org/web/20070627154244/http://masr.20at.com:80/newArticle.php?sid=10793"

