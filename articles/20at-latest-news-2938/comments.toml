[[comments]]
order = 0
subject = "لا يمكن"
author = "حمدى"
text = "واللهى العظيم انا مش قادر اسدق نفسى<br />بقى زيدااااااان يطلع مسيحى<br />لاحول ولا قوة الا باللة<br />يخرب بيت كدا<br />لا وبيقولها علنى وهو فى الجزائر فى الصحافة<br />حسبى ياللة ونعم الوكيل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "مصرى"
author = "مصرى"
text = "بالنسبة للاخ حمدى ايوة فعلا انا عرفت من النت انة قال انة يعتنق المسيحية<br />لكن ابوة مسلم بينما امة مسيحية<br />خلاص ياعم واحنا مالنا لنا ديننا ولهم دينهم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "عادى"
author = "وائل"
text = "انا كمان كنت فاكرة مسلم<br />لكن شفتة فى مباراة بيرشم علامتهم على صدرة<br />عادى<br />عادى<br />عادى<br />فككم منة"
archived = "2010-03-14"
capture_url = ""
