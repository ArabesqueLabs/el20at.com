text = "و الله ياخي ماتفرق ... هو مساله خلع الحذاء بره د انا بشوفها مساله عادية<br />يعني مثلا ليا واحد صاحبي كول مادخول عنده بالجزمة لازم يخبيني لحسن مامته تشوفني و تضطر اسفه انها تقوللي اقلع الجزمة و لما تكون مامته اعده و انا لسه حدخول بيقوللي يا عم اقلع الجزمة لحسن اومي موجوده ...<br />بس انا و الله ما فرقه معي<br />و بجد انا مثلا لما يكون ليا بيت مستقل حفضل ان اصدقائي يقلعو الجزم قبل ما يدخلو اما الناس الكبيره اسيبهوم هما وضميرهوم ..<br />و حكايه ان ف الغرب د لازم منقلعش الجزمة بحس انها بايخة شوية ... بس موش موشكله بجومله الرخامه اللي موجوده ف الغرب"
