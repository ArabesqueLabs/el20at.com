text = "الخبر بيقول - تم القبض على لص الدجاج<br />تفاصيل الخبر كما نشر بالجريدة<br />بناءا على تعليمات السيد اللواء مدير الامن وتوجيهات السيد العميد محسن نائب مدير الامن وبتخطيط العقيد ابو ضب تم تكليف المقدم ابو السعود رئيس العمليات بوضع خطة للقبض على اللص متلبسا فتنكر الرائد ابو شادوف فى زى بائع فراخ ليشترى من اللص وكان يعاونة النقيب حسام والملازم اسعد - ثم اقتحمت قوة برياسة الامين صميدة عشة الدجاج وضبط اللص متلبسا وهو يمسك الدجاج فتم احالتة الى محكمة عسكرية لانة يهدد الامن القومى ويسرق الدجاج"
