posted = "2007-05-02"
text = "فعلاً اخي الفاضل شواطئنا تشتكي من اهمال ابنائها لها .. كانت الفعاليه مبادرة لتوعية المجتمع بضرورة الحفاظ على شاطئنا أجمل مما كان ويكون ..<br />هل تكفي حملة جيل الشباب ؟؟ لا لان عمليات التنظيف لا تتم خلال يوم او يومين بل بالمداومه على ذلك ..<br />لكن كبداية فهو عمل رائع تكاتف فيه فريق العمل يد واحده على قلب واحد لهدف واحد نبيل الا وهو مدينتنا جدة لإظهارها بالمظهر اللائق بعروس البحر الأحمر ..<br />أشكرك على الموضوع<br />آلاء"
archived = "2011-02-24"
capture_url = "https://web.archive.org/web/20110224051001/http://www.20at.com:80/20at/ana-saudi/5679.html"
