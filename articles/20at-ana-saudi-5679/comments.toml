posted = "2007-05-02"
text = "لقد كانت فعاليات \" أجمل مما كان \" هي الاولى من نوعها التي يقوم بها شباب و شابات في جده لتوعية المجتمع و تاكيد اهمية الحفاظ على البيئه و بالاخص شواطئنا مما لها من اهميه جماليه لجده حيث يرتادها الكثير في العطلات الاسبوعيه.. و الجدير بالذكر ان الفعاليات قد سلطت الضوء على العمل الجماعي الهادف من اجل انجاح رسالة ان الشباب السعودي قادر على العمل الجاد..<br />واتمنى ان تتكرر مثل هذه النوع الفعاليات التى تقوم بتوعية المجتمع من الاطفال الى الشباب الذين هم اصل هذا المجتمع<br />سالي ابوشوشه<br />متطوعه في فعاليات اجمل مما كان"
archived = "2011-02-24"
capture_url = "https://web.archive.org/web/20110224051001/http://www.20at.com:80/20at/ana-saudi/5679.html"

[[comments]]
