author = "هبه حريري"
posted = "2007-05-02"
text = "دعوني اسلط الضوء على زاوية اخر كانت ربما خلف الكواليس في فعالية\"\" جمل مما كان \" .. انها كانت من تخطيط و تنفيذ و ادارة شباب و شابات حيث كان فريق العمل اكثر من 60 شاب و شابة مما يؤكد لكل من يزعم ان الشباب السعودي غير مسئول و غير قادر على الانجاز ووصل به الترف الى الامبالاه و السلبية.. تاتي هذه الفعالية لتؤكد رساله صامته للجميع ان الشباب السعودي قادر على الانجاز قادر على العطاء قادر على الاتقان قادر على ان يصلح ما افسده الاخرون. و كل ما يحتاجه الشباب هو الثقة و الدعم الحقيقي الصادق ..<br />و أهنئ كل من ساهم في انجاح الفعالية التي كانت حقا\" أجمل مما كان \"<br />هبه جمال حريري<br />\"نائبة رئيس لجنة جيل الشباب\""
archived = "2011-02-24"
capture_url = "https://web.archive.org/web/20110224051001/http://www.20at.com:80/20at/ana-saudi/5679.html"

