author = "ســـــــواح"
posted = "2007-05-02"
text = "اجمل مما كان لم تكن مجرد فعالية عابرة تطويها صفحات الايام !<br />فقد اثبتت جدارة ادارة وجدية ونجاح تعاون الشباب حيث ان اكبر عضو في لجنة التنظيم لم يتجاوز عمره 25 سنه ، وهي \" اي الفعالية \" كانت رسالة قويه لكل من شكك بقدرات وطاقات الشباب السعودي.<br />اجمل مما كان ان اردنا تشبيهها بسمفونية عمل فهي اجمل وارق سمفونية سمعتها في حياتي ، الهدف والرؤيه و ودقة العمل والتعاون ناعمه كانسياب الماء كنسيم الهواء كالبحر كالجمال !<br />قد عشقت هذه الفعاليه وعشقت اجواءها وكل من عمل فيها وجعلها تبصر النور ، فشهادتي فيها مجروحه ولكي اكون منصفاً لا أكثر فقد اجتهد كل عضو فيها لحد الاحتراق ، وتعلمت ان السبب في هذا الاجتهاد يختلف من شخص<br />لآخر ، قد يكون السبب المادة قد يكون السبب السمعه قد يكون السبب اثبات الذات ، لكن الجميع اتفق على انجاح هذه الفعالية مهما كلف الثمن .<br />اعلم ويعلم كل من عمل في هذه الفعاليه انها بداية باكوره اعمال للجنة جيل الشباب ، ولا اعلم حقيقة ان كنا سنعود لاجمل مما كان مرة أخرى ، لكنني اعلم انه وبهذه الفعاليه جدة اصبحت كما لم تكن من قبل ، أصبحت أجمل مما كان .<br />و اود ان اضفي الثناء والشكر على كل من ساهم وتطوع في هذا العمل الكبير وهذا النشاط النبيل .<br />اعتذر عن الإطالة<br />المخلص<br />عمار الصيرفي<br />رئيس اللجنة المنظمة لفعالية اجمل مما كان"
archived = "2011-02-24"
capture_url = "https://web.archive.org/web/20110224051001/http://www.20at.com:80/20at/ana-saudi/5679.html"

