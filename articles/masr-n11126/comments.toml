[[comments]]
order = 0
subject = "هذه الفقره تكشف اسباب التخلف الذي حكمت به علينا الحكومات الغبية المتعاقبة على مصر"
text = "وما أدراك ما البلدية للباعة، موظفو الحي الذين يجوبون الأسواق يلملمون البضائع من أصحابها بجريرة شغل الطريق.. فيجري الباعة يحملون ما يقدرون علي حمله من بضاعتهم.. فتقع الفاكهة والخضار علي الأرض لتهرسها أقدام المارة أو عجلات سياراتهم.. يأخذ الموظفون البضائع إلي مبنى الحي يقودهم أحد الضباط، ويذهب وراءهم الباعة لكي يحصل سعيد الحظ منهم علي بضاعته بعد دفع الغرامة المقررة ليعود إلي السوق في محاولة لبيعها مرة أخرى، لتعود البلدية من جديد.. وهكذا بمضي السوق.."
archived = "2007-08-09"
capture_url = "https://web.archive.org/web/20070809030617/http://masr.20at.com:80/newArticle.php?sid=11126"

[[comments]]
order = 1
subject = "هية كلة ماشى"
author = "احزان الفجر"
text = "اموت من الحزن حينما ارى طفلا يبكى<br />واحس كأن السموات تهتز لبكائة وخصوصا حينما يبكى من الجوع او الظلم او القهر<br />والفقر ضرب الاسر المصرية فى الصميم واصبح هناك اطفالا لا يجدون طعاما للافطار ولا الاكل<br />ان يقف طفل ليبيع ويساوم فى مكان ليس مكانة ويتعرض لموظفى البلدية ويقبضون منة ضرائب اسمها العوايد دائما تجبى من الباعة الجائلين<br />نعم يأخذون من الفقير والمسكين نعم يأخذون منهم حق معلوم اى ان لهم حق معلوم فى اموال السائل والمحروم<br />او كما يقولون من ليس عندة يؤخذ منة ومن عندة يعطى ويزاد<br />من تلك الاموال التى تدخل الخزانة يصرف منها على القصور والمرتبات<br />ثم تسمع فى التلفزيون عن فلانة راعية الطفولة وعلانة بتاع مكتبة الطفل<br />والطفل محتاج سندوتش وحذاء وتعليم اساسى<br />الطفل محتاج رعاية<br />ياكل الذين تظهرون فى التلفزيون تتحدثون عن اطفال وكانكم لم تشاهدوا اطفال مصر الفقراء ملعون ابوكم كلكم"
archived = "2007-08-09"
capture_url = "https://web.archive.org/web/20070809030617/http://masr.20at.com:80/newArticle.php?sid=11126"
