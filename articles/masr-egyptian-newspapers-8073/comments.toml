text = "انت بتقول قاعد على شلتة - شلتة اية يا روح ماما<br />دة عندة 60 مليار من الدولارات- وهو يساوى الدخل القومى ل 80 مليون انسان<br />ب 60 مليار يقدر يعمل مستشفيات قد مستشفيات اوروبا الغربية مجتمعة - ويغير العصعوصة اللى بتوجعة الى عصعوصة حديد فولاذ<br />دا كلة تمثيل فى تمثيل - علشان يثير شوية تعاطف - شوف يا عينى غلبان وعيان<br />دا ولد خطير - من طبلجى فى فرقة موسيقية فى احدالفنادق - الى صاحب 60 مليار - الى صاحب الحزب الحاكم<br />الى المرشح لرياسة الدولة مستقبلا<br />انة علامة واضحة على اكبر فساد حكم مصر منذ ايام الهكسوس"
