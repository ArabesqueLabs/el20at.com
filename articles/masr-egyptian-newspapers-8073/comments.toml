subject = "أحمد عز يتزوج شايهناز النجار والمهر 25 مليون جنيه"
posted = "2008-01-22"
text = "صحيفة: أحمد عز يتزوج شايهناز النجار والمهر 25 مليون جنيه 11/1/2007 9:51:00 PM<br />أحمد عز<br />تحدثت تقارير صحفية عن اقتراب عقد قران أحمد عز علي عضوة مجلس الشعب شاهيناز النجار حيث قدمت جريدة الدستور بعض التفاصيل عنه.<br />وكشف مقربون من المهندس أحمد عز أمين التنظيم في الحزب الوطني ورئيس لجنة الخطة والموازنة في مجلس الشعب ونائبة البرلمان المنتخبة عن دائرة المنيل ومصر القديمة في القاهرة وسيدة الأعمال شاهيناز النجار أمين سر لجنة السياحة والثقافة والإعلام عن اقترابهما من الإعلان عن خبر زواجهما وهو ما احتل صدارة اهتمامات النواب من الأغلبية والمعارضة في البرلمان.<br />ووصف بعض البرلمانيين هذا الخبر بالقنبلة الكبري مع بداية الموسم البرلماني الجديد، ويعتبر هذا الزواج في حالة إتمامه واقعة أول زواج بين نائب ونائبة من البرلمان في تاريخ الحياة النيابية المصرية وأن بداية التعارف القوي بين عز وشاهيناز كانت منذ نحو أربعة أشهر تقريبا حيث توطدت العلاقة بينهما وكانت تسبقها روايات حول علاقة أحمد عز مع إحدي الفنانات وهي فنانة رقيقة المشاعر..<br />إلا أن كبر سنها مقارنة بأحمد عز حال دون إتمام هذا الزواج حسب روايات مجلس الشعب، وكان أحد الفنادق الشهيرة الفور سيزون قد شهد العديد من الجلسات المتفردة بين عز وشاهيناز قبل الاتفاق علي تفاصيل الزواج بينهما وكان اثنان من رجال الأعمال الإسكندرانية قد سبقا عز إلي محاولات الزواج من نائبة البرلمان إلا أنها اختارت أمين التنظيم-بحسب الصحيفة.<br />وكشفت مصادر مقربة من الطرفين أن عز وشاهيناز سافرا أكثر من مرة معاً إلي سويسرا في إطار التحضير للزواج واتفقا علي إعلان زواجهما بعد انتهاء المؤتمر العام السنوي للحزب والذي سيبدأ أعماله السبت القادم إلا أن خبر الزواج قد تسرب عبر مقربين للطرفين رغم جميع محاولات التكتمل الشديد التي فرضها عز علي هذا الزواج وتحديد توقيت إشهاره وإعلانه.<br />وتعد شاهيناز النجار هي الزوجة الرابعة في تاريخ حياة عز الزوجية وكانت الأولي خديجة نجلة أحمد كامل ياسين نقيب الأشراف والثانية عبلة سكرتيرته الخاصة والثالثة كانت صديقة عبلة التي طلقها مؤخرا وجاءت شاهيناز النجار التي سبق وتزوجت أربع مرات حسب مصادر مقربة لها وهي صاحبة فندق النبيلة كايرو في حي المهندسين وإحدي شركات السياحة-بحسب الصحيفة.<br />ويتردد أن مهر شاهيناز الذي قدمه لها أحمد عز بلغ حوالي 25 مليون جنيه وكانت الشبكة خاتم ألماظ ثمنه مليون جنيه.<br />ويتردد بقوة أن شاهيناز النجار ستتقدم باستقالتها من عضوية البرلمان مع بداية الدورة البرلمانية الجديدة الشهر القادم حسب شروط أمين التنظيم وزوج المستقبل ."
