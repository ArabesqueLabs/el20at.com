text = "مفيش فرق بين احمد عز وحمدى رزق الاول بيسرق فلوسنا عبر حديد التسليح والتانى بيسرق فلوس السغوديين عبر قرائتة الصحف فى القاهرة اليوم<br />الاف دولار لية يعنى واحد زى حمدى رزوق ياخذة 7 الاف دولار شهريا من الاوربيت لية<br />اللة يرحمة مات من الجوع فى المنوفية؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
