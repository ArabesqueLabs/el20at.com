author = "فضونا من ام الهرم بق"
posted = "2009-08-17"
text = "ما تفضونا من ام الهرم بقى<br />مفيش مواضيع<br />ما سمعتوش عن الرى بمياة المجارى<br />ما سمعتوش عن غلو الاسعار ورمضان داخل على الناس<br />ما شفتوش انواع بلح التمر واغلاها بلح جمال مبارك"
