author = "الناس الفاضيه"
posted = "2009-08-16"
text = "الناس الفاضيه بقا ما وراهمش اي حاجه وفاضيين خالص ومركزين على الهرم اتبنا امتى<br />اصل خلاص كل مشاكلنا اتحلت وكل العيال اتجوزت وكل الشباب شغال والحمد لله ومرضى السرطان والفشل الكلوي خفوا كلهم واصبحوا كويسين خالص<br />ومش ناقص عندنا الا موعد بدء بناء الخرم<br />جتكم نيله<br />_________________________________<br />مش احمد الهواري ولا عبدالله الطحاوي (طحطح)"
