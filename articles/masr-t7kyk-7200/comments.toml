text = "على فكرة لو انتى الى فى الصورة انتى جميلة بس يجب ان تحررى انفسكم من كل الكلام بتاع الابهات والامهات<br />لازم شقة والله انا عندى كل حاجة وظيفة محترمة وشقة مفيش وحدة تحلم بيها لكن نفسى فى واحدة جادة<br />بس بدون شروط ابوها وامها وتحرم امى وابى اه على فكرة امى وابى مش عايشينى معيا انا فى دور وهما فى دور<br />الى عايز يكلمنى009746739432 او 009746995760 سلام يا كل الى عيزة تجوز"
