text = "يا محترمة انا شاب عندى خمسة وعشرين سنة بس لو تقدمت لوحدة اول كلمة الشقة وامك لا يعنى ترضى تجوزينى<br />انا اعمل محاسب بشركة فى دولة قطر براتب 4000 ريال ولسة بدور على واحدة توافقى ياحجة وتلاتين كلمينى على الرقم<br />دة 009746739432 وانا جاد جداا وعند الشقة بس فى الشرقية وابحث عن زوجة جادة"
