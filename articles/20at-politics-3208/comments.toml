subject = "إن الأقصي قد نادانا ..من سيعيد الأقصي سوانا؟؟"
author = "محمد السيد"
posted = "2007-02-10"
text = "آآآآآآآآآآآآآآآآآآآآآآآآآه ...<br />وتبققي فلسطين ... قضية الملسمين الأولي ...<br />فلسطين كانت النتيجة وليست السبب ...<br />فلسطين ..نتيجة سلالة ابن سلول التي تحكم الآن ..<br />فلسطين ... نتيجة نخب كثييرة فصلت فلسطين عن بقية الأمة ... وفصلت الأمة .... عن فلسطين ...<br />فلسطين ... نتيجة انشغال كل واحد مننا بحاله ... وغيابه عن حال بلده ...أولا .. وكان طبيعي ثانيا ... تغيب عنه فلسطين وما سواها ..<br />فلسطين ... نتيجة غياب الخلافة والمرجعية الواحدة للأمة ....<br />فلسطين ...نتيجة كل واحد مننا ...<br />فلسطين ....رغم كل ده .... راجعة ... راجعة ...<br />براية إسلامية .... وشريعة ربانية ... وبشارة محمدية ....<br />وبجهاد وببذل وتضحية ....<br />وإحدي الحسنين ..نصر أو شهادة ...<br />مش حسكت .... لا عن مصر ... ولا عن فلسطين ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديا الدستور المصري<br />mohamedmat@hotmail.com"
