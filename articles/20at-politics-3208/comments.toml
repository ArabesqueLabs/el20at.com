subject = "انتو مستنين ايه"
author = "الشيخ تامر"
posted = "2007-02-09"
text = "انتو مش عايزين حد يقول عليكوا انتم خنتو العهد ولا اسمه ايه اللى احنا فيه ده خوف ولاجبن ولا كل واحد فيه اللى مكفيه الناس دى اصلا معندهمش وفاء بالعهود ولا احنا مش واخدين بالنا من حاجه زى دى اصل الدنيا تلاهى بس معلش الايام جايه وبكره يصيبك الدور ومتلاقيش حد يعبرك بس انا متاكد ان ربنا مش هيسيب شوية القرده والخنازير دول يهدمو المسجد الاقصى عشان ربنا تكفل انه يحفظ دين الاسلام"
