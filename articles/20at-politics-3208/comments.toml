subject = "صمت رهيب"
author = "هاجر"
posted = "2007-02-10"
text = "فعلا يعجز اللسان عن التعبير لمادا الرضا بالدل و العار أرجو أن تفهموا يا مسلمين أنه ادا وجد في الكون من تخشوه وتخافون منه فأولى بكم أن تخشوا من يقدر عليكم وعلى غيركم ولا تقدرون عليه ولا غيركم يقدر عليه من يدرك الأبصار ولا تدركه الأبصار هدا لمن فهم حقيقة وجوده و مصير حياته أما من يغط في سباته فعدره أنه لا يفهم ودنبخ أنه لا يريد أن يفهم الأقصى ملك رجال علهم لم يولدوا بعد لكنه سيحرر بمجرد ولادتهم بادن الله"
