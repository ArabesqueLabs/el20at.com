subject = "لتكن(سيناء)عاصمة ابدية ل(مصر)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-03-24"
text = "لماذا لا تكون كل (سيناء)عاصمة ل(مصر)<br />و من ثم سوف تكون كل جزيرة سيناء مليئة بعشرات الملايين من المصريين و من ثم ايضا سوف تكون من اعتى القلاع الحربية فى العالم مقارنة بالكثافة السكانية الاسرائيلية الخفيفة مقارنة بتنعداد سكان عاصمة مصر الجديدة (سيناء)<br />و ارجوا أخذ هذا الاقتراح مأخذ الجد و فكرة للدراسة و التفكير الوطنى و الامنى و الاقتصادى و السياحى ايضا؟<br />للاتصال(20121714842)+"
