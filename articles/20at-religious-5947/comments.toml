subject = "ضع عنوان التعليق  اتقوا الله"
author = "اكتب اسمك هنا   عامر اللداوي"
posted = "2008-07-16"
text = "بسم الله الرحمن الرحيم إن هذا الكلام لا يرضي الله و لا رسوله فالشعب الأردني و الفلسطيني شعب أصله واحد و لكن المستعمر فرق بينهما و أكثر الشهداء دفاعا عن الأقصر أردنييون و الذين حموا الأردن يوم الكرامة31/3/1968 هم الفدائيون الفلسطينيون ، وإن كان الملك خائن و كلب إلا أن الشعب كشعب : شريف و مسكين و مضحوك عليه أي مضحوك على الفلسطيني و الأردني فدعوكم من العنصرية و اجعلوا ولاءكم لله للإسلام و إلا سوف سيستجتثكم الصهاينة"
archived = "2010-03-14"
