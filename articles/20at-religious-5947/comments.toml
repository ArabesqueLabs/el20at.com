subject = "قال أن تكون سعودي قال .. !!"
author = "محمد نواف الحمدالله ..."
posted = "2008-01-05"
text = "أن تكون سعودياً فهذا يعد قمة الغباء والهبل .. والخسارة !!<br />أن تكون سعودياً فهذا يعد قمة الخزي والعار .. وتنزيل الرؤوس للأسفل \" للأرض \" !!<br />أن تكون سعودياً فهذا ف \" على الدنيا السلام \" !<br />أخيراً ،،،<br />أن تكون سعودياً، فمن الأفضل أن تنتحر في أقرب وقت وفرصة .. لأنه لانريد أناس هم في الأساس \" حثالة المجتمع بأكمله \" !!"
