subject = "ضع عنوان التعليق"
author = "نونو"
posted = "2008-04-13"
text = "يا للهول اعتقد انك مخطئ تماما .. فلم يضع الله تعالى بيته الحرام في هذا المكان الا لأنهم لانه حافظون باذنه تعالى .. اما المفتاح فكما هو مذكور انه تسرب او ربما تم سرقته .. مثل اثار مصر المهربة عددها بالهبل في الخارج ... هذا بخلاق الاثار اللي سرقت ايام الحروب .."
