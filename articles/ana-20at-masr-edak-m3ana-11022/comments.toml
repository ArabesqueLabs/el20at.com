subject = ""
author = "حسين كامل"
posted = "2009-01-18"
text = "سوف تستمر حركة حماس فى اطلاق الصواريخ الورقية على اسرائيل من اجل استفزاز اسرائيل ولم يكفى حماس كل هذا الدمار الى لحق بغزة وسكانها وسوف يخرج علينا كوادر حماس عبر الفضائيات ليقولوا انهم انتصروا فى المعركة والدليل ان اغلب القتلى من الاطفال والنساء بينما هم بخير داخل الجحور والانفاق !! وهنا السؤال ماذا تريد حماس الارهابية !! حماس لا تريد شيئا بينما ايران فى الخارج والاخوان المتأسلمين فى الداخل هم من يريدوا تمزيق الصف العربى وتقليب الشعوب على الحكام واللعبة الايرانية الاخوانية مكشوفة فهم يريدوا تدمير الامة العربية من اجل حماية ايران !! كيف ولماذا !! لان توقيت اطلاق صواريخ حماس على اسرائيل يتلازم مع قرب قيام اسرائيل وامريكا بضرب ايران فكان على حماس ان تشغل اسرائيل بعمل عسكرى اخر يبعدهم عن ايران او على اقل تقدير تأجيل الضربة الايرانية على حساب دماء الشعب الفلسطينى !! اذن هل سنترك عصابة حماس تتحكم فى امن واستقرار المنطقة العربية بعد ان اضاعت استقرار وامن الشعب الفلسطينى ومزقت الصفوف بعد ان مزقت الدولة الدولة الفلسطينية المزعم اقامتها فى غزة والضفة .. نعم حماس ومن خلفها ايران مزقوا الصف الفلسطينى ومزقوا ايضا الصف العربى !! واخيرا اعتبارا من الساعة الثانية صباح اليوم سوف تتوقف اسرائيل عن اطلاق النار على غزة ولكن حماس الارهابية وبناء على الاوامر الايرانية سوف تطلق الصواريخ وسوف تعطى الذريعة لاسرائيل لقتل المزيد من اطفال ونساء غزة !! لعبه فى صالح الجميع !! لعبة فى صالح ايران وصالح حماس وصالح الاخوان المتأسلمين وصالح اسرائيل بالدرجة الاولى والضحية سكان غزة من الاطفال والنساء ."
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221045/http://ana.20at.com:80/20at/masr/edak-m3ana/11022-19207.html"
