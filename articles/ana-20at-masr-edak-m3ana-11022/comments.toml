posted = "2009-01-08"
text = "رحنا نبيع كبوش التوت ضيعنا القلب فى بيروت<br />رئيس ميت طالع من الترب وعامل مكياج تقيل قوى وميك اب زى بتاع النسوان علشان تحول صفرة الموت الى لون وردى<br />شكلة اخر مسخرة<br />وصابغ شعرة اسود غطيس<br />وبيقول لك القضية الفلسطينية<br />قعدت اغنى<br />الو الو الو بيروت من فضلك يا عنيا<br />دلوقتنى الشباب بيقولوا الو الو الو تل ابيب من فضلك يا عنيا<br />ترد تل ابيب<br />تقول عميل انت يا عنيا<br />جينا نبيع كبوش التوت ضيعنا القلب فى تل ابيب"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221045/http://ana.20at.com:80/20at/masr/edak-m3ana/11022-19207.html"

