posted = "2009-01-09"
text = "الاسم: ممدوح زكى زخارى<br />العنوان: حقا انمة رجل محترم اما انا فخطير على الامن القومى المصرى كما تدعى على كذبا وزارة داخلية مصر<br />ليتنى كنت ممدوح اسماعيل و ليس ممدوح زكى زخارى المصرى الذى منعت من السفر خارج مصر من 11 مايو 1992 و حتى و قتنا هذا انتقاما منى بسبب زيارتى الى دولة اسرائيل لغرض العلاج الطبى الغير متوفر فى مصر و كل الدول العربية و ايضا قيامى باداء مراسم التقديس بالقدس لكونى مسيحى مصرى؟ يشرفنى حقا ان يكون لى شرف التعرف بالشخصية الهامة التى ساعدت على اخراج السيد ممدوح اسماعيل خارج مصر من صالة كبار الزوار ليخرجنى انا كمان؟ مستعد لدفع مليون دولار امريكى لاى شخص يساعدنى على الخروج خارج مصر و ليعتبرنى ممدوح اسماعيل ولست ممدوح زكى زخارى جرجس المصرى المسيحى القبطى الشريف و لست القاتل؟<br />ـــــــــــــــ ـــــــــــــــ ــــــ<br />الاعتراف سيد الادلة يا زخاري<br />http://masr.20at.com/marquee/comment.php?id=84038"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221045/http://ana.20at.com:80/20at/masr/edak-m3ana/11022-19207.html"

