text = "كون ان حسني مبارك عنده ثمانين سنه فسيدنا عثمان بن عفان كان بيحكم الامة الاسلامية كلها وهو عنده ثمانين سنه<br />والمرشدالعام للاخوان عنده 80 سنه وما حدش معترض<br />والبابا شنوده عنده ثمانين سنه ويزيد وما حدش معترض<br />يعني الاخوان مش معترضين على مرشدهم<br />والاقباط مش معترضين على البابا بتاعهم<br />ليه بقا انت معترض على حسني مبارك علشان عنده 80 سنه"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221045/http://ana.20at.com:80/20at/masr/edak-m3ana/11022-19207.html"

