author = "ahmed ali"
posted = "2009-01-16"
text = "ازلام النظام المصري بدأوا يشنون على ايران حملات اعلامية غبية للأسف ليست سياسية بل انحدر بهم الحال و بدأوا يشنون عليهم هجمة عقائدية. كما يقول الأخوة المصرين ( مقدرش على الحمار قدر على البردعة ). بدأ الأعلام الرسمي لحسني و بقية الأعلام المستفيد منه بالأنضمام اليهم ببث الأكاذيب على ايران و حركات المقاومة الشريفة بعد مافضحتهم ايران و الأعلام الشريف. مصر تملك طاقات فكرية جبارة, لكن ازلام حسنى اللامبارك اغبياء و لديهم طاقة نفاق بلا دبلوماسية. اصحوا يابهايم, الناس فاهمة كل حاجة, بتكذبوا على مين؟."
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221045/http://ana.20at.com:80/20at/masr/edak-m3ana/11022-19207.html"

[[comments]]
