author = "شرارة"
posted = "2009-01-09"
text = "تم التنسيق مع شرارة للقضاء على حماس<br />وشرارة العربى يكرة اى حاجة فيها كلمة اسلام<br />ولان وشة فقر وقدمة قدم النحس الجيش الاسرائيلى واقف على حدود غزة بيضرب بيوت المدنيين بعد النحس الذى اصابة نتيجة تحالفة مع ابو مازن وابو جلمبو<br />ولكن شرارة قارىء جيد لاى ورقة تاتية من امريكا واسرائيل فهو يعلنها امام الميكروفونات بكل بجاحة<br />الان الجيش الاسرائيلى الذى هزم الجيوش العربية فى 6 ساعات واقف على ابواب غزة بقى لة 14 يوم<br />تبقى قوة لا الة الا اللة اقوى من اى سلاح"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221045/http://ana.20at.com:80/20at/masr/edak-m3ana/11022-19207.html"

