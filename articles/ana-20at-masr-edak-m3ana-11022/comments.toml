text = "المظاهرات بتصرخ وتقول<br />لا حزب اللة ولا حماس انت اللى فوق الراس<br />يا كبير يا كبير لبست بتوع حماس طراطير<br />يا محنى يا ديل العصفورةدا تاييد الوطنى فى المنصورة<br />بالطول والعرض اسرائيل والوطنى هيجيبوا حماس الارض"
