subject = ""
author = "نيفين نيفى نوفا"
posted = "2009-01-09"
text = "اهلا عشرينات محررين و محررات و معلقين ومعلقات<br />كنت متعوده كل ما تاخدنى المشاغل و اغيب عن عشرينات ارجع لكم بتعليق عنوانه اغنيه وحشتونى<br />لكن ف ظل العجز عن فعل اى شى بسبب غزه عجزت زى ناس كتير عن الغناء ون الكلام و التنفس احيانا<br />بس ده لا يمنع انى ارمى السلام على هبهوب اللى بقالى قرن مش عارفه اكلمهاو محمد السيد و عبدالله مفتاح وعلى محررين عشرينات اللى بحبهم و اللى عارفين نفسهم<br />كنت بقول عجزت عن فعل اى شى لان اسرائيل نجحت فى تصدير الشعور بالعجز لكل عربى لا مش لكل عربى لكل انسان بيرفض الظلم ايا كان موطنه<br />بالظبط زى ما نجحت ف تصدير القضيه الفلسطيني برمتها الى مصر<br />نجحت فى فرض سياسه فرق تسد و بصراحه دى فرصه انى اشيد بالدورالعظيم اللى قامت بيه قناه الجزيره اللى مش عارفه مبيجيلهاش ليه صاروخ ينسفها من الصواريخ اللى بتنزل على غزه ف الموضوع ده<br />و فجاه تحول الهجوم على مصر و القضيه الاساسيه اتنست اكتر ما هى منسيه و قعدنا بدل ما ننجد الناس اللى بتموت ف غزه بالمئات قعدنا كل دوله تشيل عن عاتقها اتهام موجه ليهاو على راس الدول مصر اللى تفانت ادارتها ف الدفاع<br />و من غير مانشعر نفزنا للاداره الاسرائيليه اللى كانت بتحلم بيه<br />و ده مش جديد لان دايما كان عند اللوبى الصهيونى حاجه يلهى بيها الناس عن القضيه الاصليه و لو قلبنا ف الانتفاضات السابقه هنلاقى كتير<br />و بتساعدها ف ده دول كتير على راسها الولايات المتحده<br />لو تفتكروا ايام الغزو ع العراق اسرائيل كانت طايحه ف البلد لكن انظار العالم كانت متجهه ساعتها للعراق<br />و المواقف التانيه كتير<br />و ده مش غريب زى ما الصمت العربى مش غريب و الشعر العربى سجل ده من زمن لما نزار قبانى قال<br />سقو ا فلسطين احلاما ملونه و اطعموها سخيف القول و الخطبا<br />عاشو على هامش الاحداث مانتفضو للارض مسلوبه و العرض مغتصبا<br />و مش غريب ان امريكا تعيش هى كمان على هامش الاحداث لان منطقى ده يحصل لما يكون اللوبى الصهيونى ف امريكا مسيطر على الاعلام و الاقتصاد<br />الناس اللى ف غزه و بيت لاهيا و لا جباليا و لا اى اى شبر ف فلسطين يا جماعه ملهمش الا ربنا"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221045/http://ana.20at.com:80/20at/masr/edak-m3ana/11022-19207.html"

