subject = ""
author = "مش لازم"
posted = "2009-01-18"
text = "الوصايا العشر للإمام الشهيد حسن البنا<br />*قم إلى الصلاة متى سمعت النداء مهما كانت الظروف<br />*اتل القرآن أو طالع أو استمع أو اذكر الله و لا تصرف جزءا من وقتك فى غير فائدة<br />*اجتهد أن تتكلم العربية الفصحى فإن ذلك من شعائر الإسلام<br />*لا تكثر الجدل فى أى شأن من الشئون فإن المراء لا يأتى بخير<br />*لا تكثر الضحك فإن القلب الموصول بالله ساكن وقور<br />*لا تمزح فإن الأمة المجاهدة لا تعرف إلا الجد<br />*لا ترفع صوتك أكثر مما يحتاج إليه السامع فإنه رعونة وإيذاء<br />*تجنب غيبة الأشخاص وتجريح الهيئات ولا تتكلم إلا بخير<br />*تعرف على من تلقاه من اخوانك وإن لم يطلب منك ذلك فإن أساس دعوتنا الحب و التعارف<br />*الواجبات أكثر من الأوقات فعاون غيرك على الإنتفاع بوقته وإن كان لك مهمة فأوجز فى قضائها"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221045/http://ana.20at.com:80/20at/masr/edak-m3ana/11022-19207.html"

