subject = "النول يدل على الجمود العقلى والتخلف العلمى والجهل"
author = "مش لاعب"
posted = "2008-06-09"
text = "الاستاذ احمد بلال الفاضل<br />نول اية اللى انت جاى تقول علية<br />دى بيفكر العالم بالقرون الوسطى<br />الات الغزل والنسيج الان تعمل بالكمبيوتر وتصنع الاف القطع فى وقت قصير وبذوق عال جدا<br />البشر الذين فى الصورة فى متاحف العالم لتدل على عصر الحجر والجهل<br />قرية السليكون فى الهند تصمم برامج لماكينات الغزل بيحيث تضع رسما على شاشة كمبيوتر متصل بالماكينة ليتم نسجها فى ثوانى بالابعاد والقياسات التى على الرسم على شاشة الكمبيوتر<br />العالم التى فى الصورة دى لا بد ان ينقرضوا ويموتوا<br />دة يدل على ان البلد ليس فيها اى تنمية ولا اى تطوير<br />وان الجهل يخيم على الجميع<br />ابقى سلم لى على جلابية نانسى عجرم"
archived = "2010-03-14"
