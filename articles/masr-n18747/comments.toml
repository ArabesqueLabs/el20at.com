order = 0
subject = "الصحافة عملت اللى عليها ونقلت الحقيقة"
author = "خروف العيد"
posted = "2008-12-11"
text = "البنات كانوا عايشين زى الاجانب يعنى جامعة وبوى فرند وميمنعش سيجارة بانجو فى العربية قبل المحاضرة ويتخللها اعداد وترتيب للسهر والسكر فى حفلات راقصة فى الديسكو او فى الفيلا حسب الظروف وطبعا الجنس شى اساسى فى المجتمعات الشبابية وبالذات لما المخدرات بانواعها واشكالها تشتغل مرة وحدة دى حاجة الحاجة التانية حكاية الولد الحداد اللى قبضوا علية ومثل الجريمة مش داخلة دماغى ياريت الصحافة تسلط الضوء شويا على القضية وتنورنا بكام خبطة صحفية عن الموضوع"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133632/http://masr.20at.com:80/newArticle.php?sid=18747"
