subject = "هذا ما وعدنا الله ورسوله وصدق الله ورسوله"
author = "على عاطف"
text = "النصر قادم - إذا إشتد الليل فأعلم أن الفجر قد إقترب والصبح ينير من بعيد فقوموا وتوضأوا لصلاة القيام وصلاة الفجر<br />والله إنى لأرى شمس النصر قد لاحت وشمس الإسلام قد قاربت أن تشرق من جديد<br />مرت الأمة بأكثر من ذلك وأكثر ويزيد ولكن مازال فى الوقت متسع لننجز المهمة ولا تيأسوا فليس اليأس من أخلاق المؤمنين<br />ونريد أن نمن على الذين إستضعفوا لنجعلهم أئمة ونجعلهم الوارثين"
