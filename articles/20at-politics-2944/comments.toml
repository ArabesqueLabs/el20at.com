text = "زمان كنت مفتخرة جدا اني فلسطينية.... محدش كان طايل راسي ... هلأ بحكي اخص على اهلك يا فلسطين... اهلك المنافقين الي بس بدهم رواتب و فلوس و مش بيهمهم الارادة و القرار ..... هنية انت خسارة في شعب فلسطين .... شعب جوعان بحياته ما رح يشبع ....... صح الكل محتاج لرواتب و فلوس عشان يعيشوا بس اسلوب اعتراض شعبي الفلسطيني على الوضع الدائر دليل على همجية و لا حضارة و نفاق شعبي الذي كنت اعتقد انه الشعب المكافح ...... هنية و الله انت خسارة فينا .... اسفة جداااااا يا فلسطين ... لا احترم شعبك الذي انا منه ... لكني ساظل اعشقك للأبد .... سامحيني و اتمنى ان يقرا كل فلسطيني وجهة نظري . بحبك يا فلسطين"
