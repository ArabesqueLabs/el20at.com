subject = "لا هنيه ولاغيرو بحلموا يأسسوا دولة فلسطينية  .."
author = "محمد نواف الحمدالله .."
posted = "2007-12-04"
text = "محمد اسماعيل هنيه .. رجل بمعنى الكلمة .. ولكن أين أفعاله .. التي كان ينادي ويصرخ من أجلها .. لم نر شيئاً منه سوى الضهور على المنابر .. وصراخه المتعالي .. وكلامه المعسول بالححج والمواعظ الواهية التي ليس لها أساس من الصحة ..<br />إذا كان يظن أبو العبد بأنه أعطى الشعب الفلسطيني وبالتحديد أهل قطاع غزة 100 دولار لكل عامل .. هذا لايعني أنه لم يلهف ويلطش ملاييين لا بل مليارات الدولارات .. حيث قام بتقسيمها عليه وعلى الزهار وأبو زهري وصيام وأيضاً إلى مشعل وغيرهم من قادة حماس .. يا أخ أبو العبد لاتظن الناس أغبياء .. لاتظن بأن الناس لايفكرون .. أو ليست لهم عقول من الأساس.<br />أبو العبد وزمرته .. لقد لهفوا تعب وعرق الشعب الفلسطيني .. وقاموا بصرفه على أنفسهم وعلى زوجاتهم وأبائهم وأقربائهم .. ونسوا بأن هذه الأموال لم يبذلوا فيها ولا شيء .. ولكن ؟!!! سوف يأتي يوماً ما .. ولا بد للحق أن يظهر .. وسوف يظهر لامحاله .. لأن الحق بالنهاية هو الذي سوف ينتصر على الباطل .. ولا تأسف ياهنية على غدر الزمان لطالما رقصت على جثث الأسود كلاب .. لاتحسبن برقصها ياهنيه تعلو على أسيادها تبقى الأسود أسود .. والكلاب كلااااب ..؟!!<br />وشكــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــراً ،،،"
