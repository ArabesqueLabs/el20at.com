[[comments]]
order = 13
subject = "إلى الذين يبصرون"
author = "سيرانة"
text = "يعني انا مش عارفة كل الاخوة اللي علقو على الموضوع علقو بناءً على شو؟؟؟؟؟؟؟؟<br />على قتل 3 اطفال على يد القوة التنفيذية (( والفاعل معروف ومعتقل وقامت القسام باختطاف موظف فتحاوي كرد على اعتقال القاتل))<br />على العموم تفصيلات الموضوع كبيرة واحب قبل اقتباس ردي ان اذكركم بفضيحة نعلين اللي مازالنا لم نعرف لماذا لم تلغة الاتفاقية حتى الآن<br />اسئلة بحاجة لاجابات منطقية<br />1 – لماذا يحاصر الشعب الفلسطيني بسبب انتخاب حماس بينما يسمح لوزراء حكومة حماس بحرية الحركة وزيارة الدول الاشد عداءا ظاهريا لامريكا واسرائيل وهي ايران وسوريا بينما حوصر القائد المرحوم ابو عمار بين اربعة جدران بسبب تمسكه بالثوابت الفلسطينية<br />2 – لماذا تم وقف المقاومة منذ استلام حماس زمام الامور ولم يتم الرد على جرائم الاحتلال في غزة التي سقط فيها اكثر من اربعمائة شهيد والف وخمسمائة جريح خلال الاشهر الاخيرة<br />3 – لماذا يسمح بادخال الاموال اللازمة لتمويل نشاطات حماس وقوتها التنفيذية ولايسمح بادخال اموال الرواتب للموظفين<br />4 – لماذا صحي ضمير الاتحاد الاوروبي لدفع سلف لذوي الرواتب التي تقل عن الفي شيكل بينما لا يدفع سلف لمن هم فوق ذلك من فئة المدراء فاعلى او لافراد الاجهزة الامنية رغم ان الغالبة العظمى من منتسبي الاجهزة الامنية تقل رواتبهم عن الفي شيكل<br />5 - لماذا يتم تعيين الالاف منذ استلام الحكومة الحالية مقاليد الحكم وبدون وجود هيكليات تسمح بذلك او اعتمادات مالية للنعيين ورغم شكوى الحكومة من وجود حوالي ثلاثون الف موظف بدون عمل<br />6 – لماذا لم يتم اعلان الدولة الاسلامية او تعديل القوانين لتتوافق مع الشريعة الاسلامية رغم وجود الاغلبية البرلمانية الكافية لاقرار هذه القوانين<br />7 – لماذا يتم الاصرار على تجويع الشعب مقابل امر لم يعد من الثوابت الفلسطينية وهو الاعتراف باسرائيل حيث تم الاعتراف بها من منظمة التحرير الفلسطينية ضمن اتفاقية اوسلو التي وجدت السلطة والحكومة الحالية استنادا لها والتي يحمل وزراء الحكومة جوازات سفر فلسطينية مكتوب عليها انها منحت بموجب اتفاقية اوسلو وماذا يتوقع من الشعب بعد تجويعه لعدة سنوات فيما يتعلق بالثوابت الني على راسها حق العودة للاجئين الفلسطينيين وحق تقرير المصير واقامة الدولة الفلسطينية وعاصمتها القدس الشريف<br />8 – لماذا لم يقود اعضاء المكتب السياسي لحماس الموجودين خارج فلسطين (الذين يحاولون تنصيب انفسهم كقيادة للشعب الفلسطيني منذ الانتخابات الاخيرة رغم عدم وجود أي رصيد نضالي لهم ) أي نشاط نضالي او شعبي ضد المصالح الامريكية والاوروبية للتعبير عن رفض سياسة حصار الشعب الفلسطيني<br />9 – لماذا لم تطرح حماس في برنامجها الانتخابي أي اطروحات سياسية محددة في برنامجها الانتخابي حتى نستطيع القول ان العشب صوت لصالح هذا الطرح السياسي بل اكتفت بالتركيز على قضايا محاربة الفساد المالي الذي يثير عواطف الشعب دون ان يكون هو قضيته الرئيسية مقارنة مع قضايا الوضع السياسي للقضية الفلسطينة ولماذا تخشى حماس من أي استفتاء على سياساتها اذا كانت مطمئنة لوجود الاكثرية معها<br />10 – لماذا تم اعلان التهدئة خلال زيارة بوش للمنطقة حيث طلب من الجميع توفير الهدوء خلال زيارته للاردن ثم انسخبت حماس من التهدئة بعد انتهاء الزيارة رغم انها لا تمارس أي نشاط عسكري ضد اسرائيل ورغم ان الانسحاب من التهدئة يعطي الذرائع لاسرائيل لتوسيع عملياتها العسكرية وايقاع المزيد من الخسائر بين الفلسطينيين خاصة في كتائب الاقصى وسرايا القدس وابوعلي مصطفى ودون وجود أي رد من كتائب القسام في الضفة الغربية او داخل المناطق المحتلة عام 1948 ورغم ان التجربة اثبتت انه لا خوف على قيادة حماس كما يدعي انصار الحركة حيث لم يتم المس باي منهم رغم احتجاز الجندي الاسرائيلي ورغم الخسائر الفادحة في ابناء غزة<br />11 – لماذا بدأت بعض الدول العربية تتحدى الحصار الدولي وتعرض صرف رواتب للقطاعات المؤثرة في اضراب العاملين مثل التعليم والصحة بعد استمراره للشهر الرابع ومن المستفيد اذا فقد الاضراب زخمه مع توفير الرواتب المنتظمه لثلث الموظفين فقط<br />12 – لماذا تصر حماس على تعبئة انصارها ضد القوى الوطنية الفلسطينية وخاصة حركة فتح وكأن هذه الحركة او قيادتها تملك زمام العالم وباشارة منها يفرض العالم الحصار على حماس او يرفعه عنها ولماذا يتم التهديد من قبل حماس بالفوضى واستخدام االعنف والقوة التنفيذية ضد أي محاولة لاستفتاء الشعب لاتخاذ اجراءات لفك الحصار المفروض عليه"
archived = "2010-03-14"
capture_url = ""

