[[comments]]
order = 21
subject = "يوم أن قابلت هنية قبل يومين من المعبر"
author = "سواح"
text = "لم أتشرف بجلسة طويلة مع الرجل لكنه مر من أمامي ومعه مرافقوه...تبادلنا التحية ومضى ودار الحوار التالي بيني وبين زميلي ...<br />أنا: انظر ماشاء الله الرجل وجهه كله نور<br />زميلي: فعلا كل بتوع الاسلاميين وجههم بيعكس نقاء قلوبهم وصفاء نواياهم.<br />أنا: حتى الحرس ناس ودودة جدا<br />زميلي: هو أصلا الناس دي مش بتحتاج حرس..شوف عبد الناصر مثلا كان بيمشي بين الناس ازاي.<br />أنا: طب يا عم انت ليه واخد موقف من حماس؟<br />زميلي: لأنهم بيشحتوا من العالم عشان يأكلوا ناسهم والفلوس دي أصلها أمريكي وإسرائيلي.<br />أنا: يا عم ما هي دي مسؤليته عشان يحل مشكلة الشعب حيعمل ايه يعني؟<br />زميلي: يحل مشاكله مع أمريكا وإسرائيل الأول.<br />لم نصل لحل وهذا ما جرى بمنتهى الأمانة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 22
subject = "اسماعيل هنية قال : دخلنا حكومة حماس لنكون شهداء لا"
author = "ساره من فلسطين"
text = "انا فلسطينة اعتز وافتخر بهذا اللرجل العظيم القوي الصارم الحازم الذي لم ولن يبيع ارضه ومقدساته من أجل الحصول على اموال والدعم الامريكي وجلوسه على الرصيف ليس ذللا بل العكس شرف وعزة وكرامة لانه اتى للسلطة للدفاع عن قضية فلسطين لا لأن يركب السيارات ويتفخفخ بها على حساب شعبه عندما استمعت لخطابة يوم الثلاثاء الموافق 19/12/2006 بكيت بكاءا شديدا احسست بأن هذا الرجل حريص امين على وطنه وابناء شعبه صادق بكل كلمة قالها وقال عباره سمعتها في خطابه يوم الجمعة للاحتفال بذكرى انطلاقة حماس قال نحن دخلنا حماس لنكون شهداء لا لنكون وزراء .والك يا سيرانه للأسف الشيديد لو في بفلسطين زيك كتير ما بظن انها ترجع القدس والمسجد الاقصى ما عاذ الله وبعدين اسئلي اسئلة منطقية عشان يكون الجواب منطقي وبكفي ترويج للأكاذيب"
archived = "2010-03-14"
capture_url = ""

