text = "اخي ما بها عملية الوهم المتبدد؟؟؟؟؟<br />اخي وما يبوس كونداليزا وبلير شو المشكلة ؟؟؟ برجع بقول الحرب خدعه<br />ومش معنى اني بسلم عليك اني بحبك او اني مش راح انقلب عليك في الوقت المناسب<br />وطبعا كفلسطينية بتمنى بل واثقة من عودة فلسطين والقصى وكنيسة المهد بس واثقه انها مش راح ترجع إلا ازا شغلنا مخنا ثم عضلاتنا وليس العكس<br />ولو اضافة الشتائم في كلامك لا يدل إلا على مستوى ثقافتك"
