text = "يا حيف على ناس والله بتستعر من شعبها , المنيح والعاطل بكل مكان , هي إجت على الفلسطينية بس بدهم رواتب وفلوس ,<br />كل الناس هيك بدها ولا كيف بالله بدها تعيش الناس , وفلسطين بتتبرأ منك لأنك بتكرهي ناسها اللي هما أشرف الناس .......<br />وأنا متأكد إنك مش فلسطينية لو إنك فلسطينية ما بتحكي هدا الحكي لأنك والله نزلتي من عيني بالمرة ......<br />عاشت فلسطين وعاش شعبها المكافح المناضل المقاوم الصابر ....<br />وعلى راسي كل فلسطيني وفلسطينية"
