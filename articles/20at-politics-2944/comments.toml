text = "ليس بسبب جلوس السيد هنية على الرصيف ..بل هي جلسة زادته اكبارا وجلالا في عيوننا<br />الغصة في الحلق مما يجري لهنية وحماس وكل الشرفاء<br />لماذا يحدث كل هذا ولم نحن صامتون ...<br />الى متى سيظل الفساد يرتع في بلاد الاسلام؟؟؟الى متى سنظل نرى حزب الشيطان يفعلون ما يريدون ونحن صامتون؟؟الى متى؟؟<br />ادعو الله من كل قلبي ان تنتخب حماس مرة اخرى..نعم هناك احتمال اكيد ان النية مبيتة للتلاعب بنتيجة الانتخابات لكن الله فوقهم وفوق الجميع..<br />فقط لندعو الله ان يثبت كل المقاومين وكل السائرين على نهجهم وان يثبت اهل فلسطين وان يكشف كل العملاء الذي كسروا ظهر فلسطين قبل ات يكسرها اليهود.<br />قال حماس هي من قتلت الاطفال الثلاثة قال!!<br />زمن عجيب غريب"
