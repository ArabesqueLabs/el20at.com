text = "حيا الله الرجال أمثالك يا اسد النضال ويارجل حمل حملأ اثقل من الجبال انت فخرا انت عزا لنا والله انت وحدك بكل قادة الخزي والعار الذين اتو لنا بالدمار انت علم لايجهلك البشر ولا الحجر انت قمر تتمنا النجوم ان تكون قريبا منلك لتتمتع في النظر<br />انا بدي أوصل شغلة بدي اقلول (سيرانة ولأبومازن ) سيرانا حماس اوقفت العممليات قبل ان تدخل الانتخابات بنصف سنة كما قلوا انه سيكون هدنة طلبا من ابو مازن رئيس الدولة وبعدين حماس ما بتطلب كراسي وحماس دليل على اخلاصها وخلاصها حكم عليها بالاقامة الجبرية وعدم دخول الاموال واغلاق المعابر من اول دقيقة تسلمة فيها الحكم حماس بلافخر شرفا لنا انها حركة اسلامة عريقة لن تبيع الوطن يوما من الايام (انا بنت حماس ولن يكتب التاريخ ان حماس باعت وطن )"
