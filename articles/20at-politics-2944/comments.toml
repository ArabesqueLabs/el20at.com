text = "أخي مجاهد لا أستطيع أن أكتب بعد الذي قلت تلك الصورة أثارت في نفسي الكثير لكني لم استطيع أن اعبر عن هذا الكثير بقليل أوكثير من الكلمات... تصطدم الكلمات بعضها ببعض كما يصدم الاخوة ببعضهم في فلسطين تنفلت مني الأساليب والمعبرات كما تهرب وتنفلت فرص الوحدة والتهدئة لكن مقالك اليوم هو الذي أخرج الشيء المكتوم بصدري فدمعت عيناي ورأيت أن لا أكتب بعد الذي كتبت عن هذه الصورة وماسيأتي بعدها من صور الله أعلم من أين تأتي وهل ستكون كلها حمراء ملطخة بدماء الأخوة والفرقاء .. أم خضراء بلون الزيتون الفلسطيني وصواريخ المقاومة المنطلقة إلى العدو الحقيقي الصهاينة المحتلون .. وأخير أحييك على مقال الرائع .."
