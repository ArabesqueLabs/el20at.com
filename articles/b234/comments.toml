subject = "مبروك لاخواننا المغاربة بعيد الاضحى المبارك"
author = "سلام جزايري"
posted = "2006-01-10"
text = "باسمي وباسم الشعب الجزائري اتقدم الى اخواننا المغاربة باحر التهاني بمناسبة عيد الاضحى المبارك وكل عام والامة المغربية والجزائرية خاصة والامة الاسلامية عامة وهم بخير وعلى خير ونسال الله ان يعيده علينا بالخير واليمن والبركات"
