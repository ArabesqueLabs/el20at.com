subject = "نداء لمن يسمي نفسه بمغربي"
author = "مغربية"
posted = "2006-01-13"
text = "اولا اريد ان اهنئ جميع امة اسلامية وخاصة المغاربة بهده مناسبة كريمة-عيد كبير-عيد مبارك سعيد وكل عام وانتم بخير<br />2-يامن يدعى نفسه انه مغربي اعرف انك لست مغربي يطريقة كلامك فالمغاربة متميزون بحسن كلام والكرم لا بلا هانة بدون سبب ولا جدوى .كما ان المغاربة يحبون جميع دول العربية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115906/http://www.20at.com/article2.php?sid=234"

[[comments]]
order = 5
subject = "المغرب"
author = "فورى"
posted = "2006-01-13"
text = "اولا ابدا بالسلام فالسلام عليكم ورحمه الله وبركاته الى جميع المسلمين عامه والى كل من يقرا تعليقي فنحن المغاربه براى العالم باسره اروع الناس و احبهم فنحن نحب الناس ولنا قلب وهبه الله لنا لاجل هدا الغرش واحب ان اؤكد كلام الاخت التى سبقتني بان الشخض السابق الدكر لايمس للمغرب باي علاقه واشكر الاخ الجزاصرى على تهناته للمغاربه واساله واسالكم الدعاء لاننى على ابواب الامتحان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115906/http://www.20at.com/article2.php?sid=234"

