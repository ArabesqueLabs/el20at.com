text = "ايه الهطل ده !!!! يخرب بيت السطحية ! هو مجرد إن عدد المحجبات زاد يعد دليل على تخلف المرأة وانحسار دورها !! فين يا حاجة الدراسات التي تدعم كلامك والتي تقول أن نسبة السيدات الفاعلات في الخمسينات أكثر منها اليوم.. طبعا كل ده هراء، فالمرأة الألان أكثر فاعلية بكثير، وحجابها لا علاقة له بالتمييز ضدها بل هو اختيار شخصي بحت.<br />بجد مقال هايف مفيهوش معلومة ليها معنى.. بس يالا أرزاق بدل ما رئيس التحرير يدك عشان متحفتيناش بمقالك ويضطر يرفدك وتقولي ان ده دليل على اضهاد المرأة !!!!!"
