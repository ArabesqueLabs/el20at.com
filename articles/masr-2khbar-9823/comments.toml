text = "ويعقب سائق سيارة باحتجاج \"لماذا لا يرقصن في بيوتهن\" مضيفا \"يفترض عليهن أن يخفن الله وليس الرجال فهن يظهرن العورات أمام بعضهن البعض\".<br />كده بقا اصبحت الامور واضحة<br />فهذه الشواطىء مرتع للسحاقيات"
