subject = "غالبية تلك النسوة من الخليج والسعودية"
author = "السمالوطى"
posted = "2008-08-09"
text = "وبما ان البلد بيعت مفروشة للاغراب وخيرها لغيرها وابن البلد ينضرب بالجزمة فى اقسام الشرطة وطوابير الخبز<br />فالحاصل فى الصيف هو ان الاسر الخليجية تاتى الى مصر - الرجل الخليجى يرسل اسرتة الى مصر او لبنان او تونس او المغرب وهو يشد الرحال الى بنكوك او باريس او لندن يستمتع بالحسان وينهل من اللحم الابيض ولا حرج علية اما اسرتة وبناتة واطفالة ففى بلد عربى مسلم بعيد عن العرى وما يقع فى اوروبا فى الحدائق والشوارع من انحلال وعرى<br />هؤلاء النسوة الخليجيات يرتدن تلك الشواطىء فى مصر ومحجبات ولهم طقوسهم الخاصة وقى اللة نسائنا منها<br />واحيانا تقلدهم بعض المصريات ولكن قليلات<br />فكل ما يجرى على تلك الشواطىء ليس مصريا خالصا<br />فلا تخلطوا المسائل"
archived = "2010-03-14"
