[[comments]]
order = 4
subject = "اندية الفتيات شواطىء الفتيات مدارس الفتيات  حمامات"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-08-09"
text = "ماذا تعرفون عن السحاق ( الشذوذ النسائي ) ؟<br />السحاقية مصطلح يشير إلى المرأة التي تمارس العلاقة الجنسية العاطفية بشكل<br />أساسي مع إمرأة أخرى ( اشتهاء المماثل بين الاناث )<br />أصل هذه الكلمة يعود إلى جزيرة ليسبوس حيث كانت مسقط رأس الشاعرة اليونانيـة<br />صافو التي كانت تمارس السحاق مع غيرها من النسوة اليونانيات في القرن السادس<br />قبل الميلاد.<br />يفضل بعض النساء إقامة علاقات جنسية وعاطفية مع غيرهن من جنس النساء ، وهذه<br />الظاهرة تعادل اللواط عند الذكور . هذا التصرف المخالف للطبيعة يعد من أوجه الشذوذ<br />الجنسي .<br />النساء الشاذات لا يختلفن عن غيرهن من النسـاء الطبيعيات من حيث اللجوء للإستثارة<br />الجنسية للحصول على الرعشة ، كالتقبيل واستثارة الثدي ... وبعضهن يعترفن بأنهن<br />يفضلن العناق والالتصاااااق الجسدي بغيرهن من النساء أكثر من إهتمامهن بإستثارة<br />أعضائهن الجنسية ، وهذا بحد ذاته يشير إلى أنه حتى المرأة الشااااااااذة تشدد على<br />الناحية العاطفية في علاقتها السحاقية .<br />تشعر المرأة التي تمارس علاقات سحاقية مع غيرها من النساء كما يشعر الرجل<br />وتتصرف كتصرفه ، فهي تقص شعرها وتمارس ألعاب الرجال وتغشى مجتمعاهم<br />وتكون في الغالب ذات عاطفة جنسية حادة .<br />إذا خطر لإمرأة سحاقية أن تغري فتـاة ، فإنها تبدأ بالتحايل عليها وإكتساب عطفها<br />بأن تظهر نحوها شيئاً من الحب والحنان العاديين ، ثم تتبع ذلك بالقبلات والعناق والنوم<br />في فراااااش واحد ، وبعد ذلك تعمل المريضة السحاقية تدريجيآ على إيقاظ شعور اللذة<br />والشهوة في نفس ضحيتها التي كثيراً ما تجهل أن وراء هذه المظاهر تكمن في علاقة<br />غير طبيعية ، فتقع بدورها في حب صاحبتها ، وتنتهي هذه العلاقة إلى إثارة الهيااج<br />الجنسي ومن ثم ممارسة السحاق ، وقد تدوم هذه العلاقة الشاذة سنوات عديدة .<br />إن السحاق مثل غيره من أوجه الشذوذ الجنسي بحـاجه إلى معالجة نفسية دؤوبـة<br />وطويلة بهدف مساعدة الشاذات على التخلص من وضعهن المعقد في المجتمع الذي<br />ينبذهن ويحاربهن .<br />في الحقيقة إن هذه الظاهرة أكثر إنتشارآ في الغرب تبعآ للإباااااحية الجنسية<br />والتهتك الإجتماعي والاحباااط والضغوط الاجتمااااعية التي يعاني منها السكان<br />وتسود ذلك المجتمع<br />وثبت في صحيح مسلم من حديث أبي سعيد الخدري قال<br />قال رسول الله صلى الله عليه وسلم قال: ( لا ينظر الرجل إلى عورة الرجل ،<br />ولا المرأة إلى عورة المرأة ، و لا يفضي الرجل إلى الرجل في ثوب واحد ،<br />ولا تفضي المرأة إلى المرأة في الثوب الواحد).<br />وما هذه العناية من الإسلام بشدة المحافظة على العورات . والنهي عن كشفها ،<br />إلا لما في حفظ العورات والابتعاد عن النظر إلى الفروج التي لا تحل من الاحتشام<br />وصيانة العرض ،وقمع الفاحشة ،وصلاح الأخلاق، ودرء المفاسد العظيمة المترتبة<br />على التفريط في ذلك ؛ فإن كشفها أمام الناس والتساهل في ذلك من المنكـرات<br />العظيمة .<br />للأمانه منقول وقد اضفت عليه بعض التلميحات"
archived = "2010-03-14"
