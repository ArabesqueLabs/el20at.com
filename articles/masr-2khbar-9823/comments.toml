subject = "في الصباح تغير السيدات ملابسهن لارتداء ملابس البحر"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-08-09"
text = "عمر ما فيه امرأة تلبس المايوه قطعة او قطعتين الا من اجل نظرات الرجال التي تجعلها تشعر بانوثتها وبعدين قولولي لما المرأة تتخفى عن الرجل حتتجوز ازاي<br />هما عارفين ومتأكدين ان فضول الرجال يمتد اكثر في هذه الاماكن<br />والتليون ابو كاميرا والبلوتوث يشتغل تماما واليوتيوب خير شاهد على ذلك"
