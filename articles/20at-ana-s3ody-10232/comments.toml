[[comments]]
order = 9
subject = "استخدام الآية فى غير موضعها"
author = "أيمن"
posted = "2008-10-16"
text = "كاتب المقال ناقل عن شاب سعودى اسمه عبد الله المهيدب :والحل كما أرى في تشكيلة هيئة الأمر بالمعروف والنهي عن المنكر ؛ كيف لا وقد قال تعالى في محكم كتابه الكريم: { ولتكن منكم أمة يدعون إلى الخير ويأمرون بالمعروف وينهون عن المنكر وأولئك هم المفلحون }\\\".<br />وكأن المهيدب ده واحد من علماء الأمة، الآية لم تقل إن الأمر بالمعروف يبقى بإنك تطلع تجرى ورا الناس فى الشوارع والبيوت وتشوف فلان يقرب إيه لعلانة الأمر بالمعروف هو الأمر بكل خير وتقديمه للناس فى أحسن صورة وبأحسن أسلوب ويا ريت المقالات التى بتنتشر لما تجيب آيات بعد كده تبقى توضح الحقيقة للقراء عن طريق حد عالم أو فاهم مش واحد صادف إنه كان معدى من قدام الكاتب ساعتها"
