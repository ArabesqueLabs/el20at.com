subject = "قال هيئة الأمر بالمعروف قااال"
author = "وانت مالك"
posted = "2008-10-10"
text = "وانت مال أهلك يا سي غامدي..ومال أهل هيئة الامر بالمعروف دي..يا اخويا شوف البلاوي اللي بتحصل عندكم كل يوم مش في العيد بس... و الله دي حاجة تخصنا مش محتاجين الهطل اللي عندكم هما اللي ينصحونا ..<br />وبعدين الأخ اللي بيتكلم عن المهور و بالبلاء الأزرق ده .انتو لسه بتتلكموا عن المهور و الشبكة ؟ اكتر المتحرشين بيكونوا متزوجين يا ابو العريف..أو عموما الراجل الناقص اللي ممكن يتحرش بواحدة مش بتفرق اذا كان متجوز ولا لأ"
