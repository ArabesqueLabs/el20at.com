subject = "ضع عنوان التعليق"
author = "بنت الاسلام"
posted = "2008-10-10"
text = "يا جماعة موضوع هيئة الامر بالمعروف والنهى عن المنكر ما ينفعش فى مصر وبعدين مش لما يكون نافع أصلافى السعودية ييقى ينفع عندنا، ياريت تقروا عن الحوادث اللى اتسببت فيها الهيئة بسبب تدخلهم فى حياة الناس وكتير من السعوديين رافضيين اصلا الفكرة ، لو كان ربنا فارض كل حاجة بالقوة يبقى ايه الفرق ما بين اللى بيطيع ربنا من جوا قلبه واللى بيطيع ربنا بالعافية عشان خايف من الهيئة ، ليه ما كانش في هيئة ايام الصحابة والتابيعين<br />الواحد ممكن يتقبل النصيحة من شخص عادى لكن صعب انه يتقبلها من موظف شغلته انه يراقب الناس ويشتغل رقيب عليهم"
