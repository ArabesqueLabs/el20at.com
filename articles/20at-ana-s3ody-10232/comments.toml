text = "أنا من السعودية و أحذركم لأني أحبكم.<br />تعرفوا ايش بيكون حل الهيئة؟ منع الاختلاط. إذا عندكم تحرش بالمواصلات فمعناته لازم تكون هناك مواصلات للنساء ومواصلات للرجال. تحرش بالشوارع؟ حيعملوا لكم شوارع للنساء و شوارع للرجال!! واللا بيقولوا لكم المرأة مكانها البيت أصلا!! هذولا ناس عقولهم متحجرة الله يحمينا ويحمي جميع المسلمين."
