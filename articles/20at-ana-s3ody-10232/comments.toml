[[comments]]
order = 12
subject = "ايهما أفضل؟"
author = "فتاة"
posted = "2008-11-17"
text = "يمكن يوجد بعض الأخطاء التى تقع فيها الهيئة عند التطبيق ويجوز ان هناك بعض التشدد المغالى فيه احيانا ولكن لا أحد ينكر انها تقوم بدور مهم جدا لحفظ المجتمع من الشرور و احب اقول للأخ أيمن ان وجود هيئة للأمر بالمعروف ده من صلب النظام السياسى فى الاسلام (وده بيتدرس فى الجامعات المصرية الحكومية يعنى مش كلام متحيز ) وبعدين الناس اللى بيقولوا ان محدش عارف ينزل الشارع هناك بسبب الهيئة (وان كان يعنى دى مبالغة ) طيب و عندنا هنا ومفيش هيئة البنات عارفين ينزلوا يعنى لوحدهم من غير ما يكونوا خايفين؟ والله بنات كتير كويسين وبيلبسوا محترم وبرده بيتعرضوا على أقل تقدير للكلام البذئ من الشباب اللى مش متربى ومحتاج اللى يربيه مادام اهله معرفوش يربوه واكرر حتى لو كان هناك بعض المساوئ والأخطاء التى تقع فيها مثل هذه الهيئات ولكن يظل نفعها اكبر بكثير من مساوئها خاصة مع تدهور المستوى الأخلاقى ."
archived = "2010-03-14"
capture_url = ""
