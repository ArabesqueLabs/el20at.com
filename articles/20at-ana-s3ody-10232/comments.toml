subject = "مش لازم هيئة امر بالمعروف"
author = "محمد الانصاري"
posted = "2008-10-09"
text = "اظن ان الغالبية هتتفق ان حل الموضوع الحقيقة مش بس في الرقابة الخارجية لا الموضوع محتاج تقويم سلوك الشباب نفسه<br />ثانيا ليه هيئة امر بالمعروف مش المفروض الشرطة ده يكون دورها حفظ الامن<br />وثالثا بالنسبة لدور المجتمع المدني فممكن تقوم بيه جمعيات او شباب متطوع مش شرط الموضوع يكون قايم على ناس مشايخ و نديهم سلطة ما اظنش اننا محتاجين لده"
