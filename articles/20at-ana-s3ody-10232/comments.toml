text = "بدل متقول ملكوش دعوة قول جزاك الله كل خير .<br />تشددنا في المهور وغالينا في تكاليف الزواج وزودنا البطاله وابحنا المناظر الخليعه واللباس المزري لبنات المسلمين ولم يعد هناك رقيب ولا محاسب وغابت القدوة الحسنة والتعليم اصبح عديم الفائدة وشيوخ الازهر دون هش او نش والاصل كله في اننا اضعنا امر الله فماذا ننتظر ..... اللهم جمع شمل المسلمين ... اللهم اعز الاسلام وانصر المسلمين"
