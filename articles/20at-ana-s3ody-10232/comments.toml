[[comments]]
order = 6
subject = "لا للهيئة"
author = "محمد عادل الزنكلونى"
posted = "2008-10-10"
text = "يا جماعة هيئة إيه بس ؟؟ دى بتسبب مصايب و مشاكل ربنا ما يوريكم<br />أنا عشت فى السعودية 5 سنين كانوا من أسود سنين عمرى بسبب الهيئة دى<br />مراتى مش عارفة لا تروح ولا تيجى ولا حتى عارفة تخرج تجيب دوا لوحدها رغم إن الصيدلية تبعد شارعين فقط لكنها لو خرجت ممكن تتاخد من الهيئة بحجة الخروج من غير محرم !!!!<br />أنا شخصيا وقفونى و فتشونى أكتر من مرة و أنا شايل زجاجة عصير ملفوفة إعتقادهم إنها خمر !<br />و قبل ما يفتشونى سمعت شتايم مكنتش أعتقد أبدا إنها ممكن تخرج من بتوع الهيئة !!<br />الخلاصة : الهيئة دى كارثة و معظم السعوديين بيتمنوا اليوم اللى تتلغى فيه الهيئة<br />لكن إحنا عندنا الشرطة هى اللى مفروض تحافظ على أمن كل الناس و عندنا القانون بيعاقب المتحرش و المغتصب بعقوبات رادعة .<br />ربنا يبعدنا عن الهيئة و بلاويها ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "شكرا للهيئة"
author = "مصري  بالرياض"
posted = "2008-10-13"
text = "صعب الهيئة تنفع عندنا<br />الاول احنا محتاجين الحكومة نفسها تتصلح , يعنى الشرطة هى الى بتعذب فى مصر وهي الى بتسرق وهي سبب البلاوي مع الحكومة الى بتمص دم الشعب ,<br />انا فى الرياض وولا مرة حد من الهيئة كلمني وشفتهم مرة واحدة بس<br />وبصراحه هما عاملين هيبه فى البلد , وفى ناس بتخاف منهم والى ماشي غلط هو الى بيخاف ,<br />الى ماشي صح محدش بيكلمه لا شرطة ولا هيئة ولا حاجة خالص , لان هنا او على الاقل فى مكانى بتتعامل كانسان مش كحيوان فى مصر ,<br />مص مش محتاجة هيئة مصر محتاجة مصاصيين الدماء يمشوا منها<br />محتاجة الناس تصحى الصبح تلاقى رغيف عيش تاكلة<br />محتاجة الناس متموتش بعضها فى طابور العيش<br />الناس محتاجة تلاقى مستشفى نضيفة وسرير تتعالج فية من البلاوي والاكل الملوث بالمبيدات المسرطنة والدم الى بيتنقل لها ملوث<br />الناس محتاجة ولادها تروح مدارس تتعلم مش تهرب من المدارس الى مفهاش مدرسين اصلا<br />الناس محتاجة لما تمشي فى الشارع تبقى مطمنه مش خايفة واحد امين شرطة يشتمها او يعاملهم كانهم عبيد<br />الناس محتاجة تلاقى وظايف تشتغل<br />الشباب نفسه يشتغل عشان يتجوز<br />كل يوم يرخصوا فى النت<br />ويفتحوا قنوات منيلة بنيله<br />ووصلات الدش بالكووووم وبلاش<br />والمخدرات والخشيش على ناصية كل شارع واصغر شاب يقدر يجيب فى اى وقت<br />ومحدش بيتعلم وكل بيدور على الشهادة وخلاص<br />وممنوع علية المساجد يدخلها وياما يبقى ارهابي<br />الناس خايفة بيتها يولع متلاقيش حد يطفية اذا كان مجلس الشوري البلد كلها بالجيش والشرطة وكام ورزاة وكام محافظة وفى 16 ساعه وفى وسط البلد واهم شارع أمال لو واحد بيته فى دار السلام هايعملوا اية<br />الناس غرقت , الناس اتسممت , النسا ولعت , كل حاجة حصلت فيك ياشعب مصر وانت صابر<br />لكن لغاية امتى ؟"
archived = "2010-03-14"
capture_url = ""

