text = "الذى قلتة فى المقالة ليس عشوائى او نبت شيطانى<br />كلا يا صديقى انة تخطيط مدروس لتدمير قدرات هذا الشعب وضياع هذا الجيل والجيل الذى يلية<br />كل ذلك ابتدأ بعد كامب ديفيد وتسليم مقدرات الشعب للعدو<br />يعنى مثلا ما معنى كلمة رجل اعمال التى شاعت وفاحت مع هذا النظام - هل تملك تفسير محدد لكلمة رجل اعمال - يعنى واحد تاجر اسمنت بيسمى نفسة رجل اعمال وتاجر حديد تسليح بيسمى نفسة رجل اعمال وواحد مستورد اقمشة وتاجر مينى فاتورة بيقول لك انا رجل اعمال وواحد مقاول بيبنى عمارات بيقول لك انا راجل اعمال<br />كل اثتثمار البلد دى فى العقارات - الحكومة بتختار واحد هى راضية عنة وتعطية كم كيلو مربع اراضى وتفتح لة البنوك ياخد منها قروض زى ما هو عايز ويبنى ويبيع فيلل للعرب ياتون لقضاء الصيف والتزوج من البنات الصغار زواج متعة ويروحوا وهذا يبقى من رجال الاعمال<br />المشروع القومى للدولة هو الشحاتة من الدول الاخرى<br />عندنا وزير فى الوزارة اسمها وزارة التعاون الدولى كل شغلتة المساعدات الخارجية والشحاتة والتسول ومتابعتها وجلبها<br />انما فية احد بيبنى مصنع ينتج ويصدر - لا -<br />كلة مستورد من الصين الشعبية"
