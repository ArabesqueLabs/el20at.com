text = "بحييك يا محمود على مقالك<br />واؤيدك بدرجة كبيرة<br />لكن لنا دور في خلق نماذجنا وقدوتنا<br />وإن لم نجدها أمامنا فلنستلهمها من الأجيال السابقة أو حتى من التاريخ<br />هذا أفضل كثيراً من أن نلقى اللوم على الأجيال الأكبر<br />ولعله من الأفضل والمحسوب لنا أن نكون نحن فعلاً صالحين بينما قدوتنا غائبة<br />أعجبتني مقولة رائعة : \" إن لم تجد الطريق ، اصنع أنت الطريق\"<br />تحياتي"
