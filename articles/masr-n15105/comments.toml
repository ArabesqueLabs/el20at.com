subject = "سيناء مكان خالى لتهجير الفلسطنيون"
author = "مخبول"
posted = "2008-04-09"
text = "اسرائيل تخطط وستنجح فى نقل الفلسطنيون من غزة وتخفيف الكثافة السكانية فيها بنقلهم الى غزة<br />هتعل اية مصر<br />ولا حاجة<br />مصر تركت سيناء خالية من السكان منذ تحريرها بعد حرب 73<br />والان جاء وقت استغلال سيناء بواسطة اسرائيل<br />فين جيش مصر<br />البعض بيقول انة على حدود ليبيا<br />والبعض بيقول انة لايوجد جيش<br />وانما قوات امن مركزى مجهزة بالعصى والشوم<br />ربنا يستر"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132053/http://masr.20at.com:80/newArticle.php?sid=15105"
