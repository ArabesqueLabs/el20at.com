subject = "نظريه المؤامره لمقتل اشرف مروان"
author = "samy"
text = "نظريه المؤامره لمقتل اشرف مروان<br />الظروف والحقائق التاريخيه<br />اشرف مروان شخصبه معروفه بالطموح تزوج بهدي عبد الناصر واصبح بذلك احد شخصيات الحكم عندما عين مساعدا لسامي شرف. عندما حصل اشرف مروان علي بعثه لدراسه لماجستير في لندن تعرف علي بعض افراد العائلات المالكه العربيه. احد هذه العلاقات كانت مع الاميره سعاد الصباح والتي كانت السبب في استدعائه الي مصر والتحقيق معه بسب حصوله علي اموال منها. في نفس الوقت كانت شخصيه طموحه اخري هي السادات لكن علي مستوي اخر. السادات يصبح صديق شخصي لكمال ادهم صهر ملك السعوديه العميل الاول للمخابرات الامريكيه ويكون علاقات جيده مع العائلات المالكه في الخليج من خلال منظمه المؤتمر الاسلامي المدعومه من المخابرات الغربيه خلال الحرب البارده. هذه العلاقات هي التي جعلت من الرئيس عبد الناصر لاختياره لنائبا للرئيس بعد هزيمه يونيو 1967. والقيام بدور التفاوض مع الامريكيين. السادات يرفض مبادره روجر ظنا بان جمال عبد الناصر سوف يرفضها. المبادره كانت تعني ماحصلت عليه مصر في كامب ديفيد. جمال عبد الناصريؤنب السادات علي الرفض والسادات يفاجئ بموافقه عبد الناصر و يتظاهر بمرض القلب ويدخل المستشفي. عبد الناصر يزور السادات في المستشفي ويطيب خاطره. عبد الناصر يموت فجاءه قبل بدء ا لمفاوضات مع الامريكين. السادات يصبح رئيسا للجمهوريه.<br />السادات ينقلب علي السوفيت ويختارالحل الامريكي واشرف مروان يختار الوقوف في جانب السادات ضد الناصريين واليسار في مايسمي بمعركه التصحيح ضد مراكز القوي ويقوم بدور اساسي في الصراع اللذي انتهي بانفراد السادات بالحكم مما ادي الي اختياره كاحد المقربين للرئيس السادات ومستشاره علي الرغم من صله القرابه للرئيس السابق. السادات يطلب اقامه سلام مع اسرائيل قبل الحرب علي اساس مبادره روجر ولكن طلبه قوبل بالرفض مع رساله\" ان يفعل شىء ما علي الجبهه\". فمبادره روجر قدمت للزعيم عبد الناصر وليس لرئيس جديد غير مؤكد استمراره في الحكم. السادات يجهز لحرب مرغما بالجبهه الداخليه والسوفيت لا يريدون مساعدته.<br />السادات مع رجاله ومن بينهم الشاذلي ومبارك وسياسيا مع اشرف مروان يرسما خطه الحرب. اشرف مروان والسادات يقوما بزياره الي السعوديه ويخبرون فيها السعوديون \"اللذين حاربوا المصريين لسنين في اليمن\" اصدقاء الامريكين بميعاد الحرب. ملك الاردن يطلب مقابله جولدر مائير ويخبرها بميعاد الحرب. اشرف مروان يسرب توقيت الحرب للمره الثانيه للاسرائليين في لندن دليللا علي النيه الطيبه من الحرب من جانب المصريين التي انتهت بالاعتراف باسرائيل.<br />الاسرائليون والانجليز والامريكان والسعوديون يكافؤ مروان و يعطونه الفرصه و ان يصبح احد اهم تجار الاسلحه في المنطقه ومن اغناهم و رجال الحكم المصريون يعتبرونه بطلا ومبارك يكرمه في ذكري الحرب. ولكن اشرف مروان لايثق في حكام مصر ويختار لندن كمقر له.<br />اثنين شاركوا في هذه الحرب وخسروا الاول هو الفريق الشاذلي الذي حاول تغير مجري الحرب ودفع الثمن غاليا والثاني ايلي زعيرا، رئيس الإستخبارات العسكرية الإسرائيلية الأسبق الذي صار كبش فداء عندما خدع الاسرائليون العالم وصرحوا ان المصريون فاجئوهم في يوم عطلتهم المقدسه وليعطوا حكام مصر نصرا اعلاميا داخليا ليحصلوا من خلاله علي مايتمنوه الاعتراف المتبادل و الصلح الانفرادي. ايلي زعيرا سكت طويلا واقتنع ان يكون كبش فداء طوال السنين الماضيه اما الان فيطالب ايلي زعيرا اليوم برد شرفه العسكري. فالرجل وقاده اسرائيل كانوا يعرفون ميعاد الحرب ولكنه سكت طوال السنين لكي يحكم الجيش المصري الشعب المصري بمرجعيه الانتصار في حرب اكتوبر. والان خرج ايلي زعيرا بالحقيقه منذ عده اشهر.<br />نظريه تحتاج الي تاكيد<br />لماذا قتل اشرف مروان؟<br />عندما كشف الاسرائليون سر دور اشرف مروان في حرب اكتوبر مؤخرا. لم ينفي المصريون ولا اشرف مروان انه بلغ الاسرائليون بميعاد الحرب ولكنه اكد ذلك وذكر ان الميعاد كان متاخرا اربعه ساعات. اعلن اشرف مروان في مقابله مع احد اهم مؤرخي حرب اكتوبر الاسرائلين والضابط السابق في الجيش الاسرائيلي اهارون بيرغمان مؤخرا انه يكتب مذكراته و بأنها ستكون حول أمور كثيرة في مصر، وكيفية عمل النظام هناك. اشرف كان سيقابل اهارون بيرغمان يوم مقتله.<br />الاشكاليه. من الخاسر من هذه المذكرات ومن المستفيد من اخراس الرجل للابد؟<br />الخاسر الاكبر في عمليه مقتل اشرف مروان هو الشعب المصري الذي لم تكشف له حقيقه ماحدث في اكتوبر علي يد احد صانعي الحدث. الخاسر التالي هي اسرائيل. فاشرف مروان شارك في عمليه اكتوبرالتي ادت الي اعتراف اكبر دوله عربيه باسرائيل كما كان له اصدقاء اسرئيليون عاتبهم منذ ايام علي كشف حقيقه علاقته بالمخابرات الاسرائليه. المخابرات الاسرائليه تظهر الان ايضا علي انها فشلت في حمايه احد مصادرها الموثوق بها خاصه امام الذين يشكون في ان جهاز المخابرات المصريه هي التي قامت بعمليه التصفيه. الظريف هنا انا الرئيس المصري ينكر ان اشرف كان عميلا لاسرائيل بعد مقتله بايام ويصرح بان دوره في الحرب لن يعلن الان. ويعلن في نفس اليوم وفاه احد الجواسيس المصريين لاسرائيل\" الفيلالي\" لكي تظهر كانها ثارا لمقتل اشرف. مصطفي فكري المعروف بصداقته للنظام يطالب كعضو من مجلس الشعب بارسال لجنه الي لندن للمشاركه في التحقيقات.<br />نظريه المؤامره.<br />اشرف مروان قتل علي يد المخابرات المصريه لان النظام المصري هو الوحيد الباقي الذي سيخسر الكثير من نشر لمعلومات عن حرب اكتوبر. اشرف مروان كان وسيطا بين رجال السادات وحكام اسرائيل. احد صناع القرار في مصر حسب تصنيف المخابرات الاسرائليه خطه الحرب. الحرب نفسها كانت الجواب علي الرساله التي تلقاها السادات من الامريكان عندما اقترح السلام مع اسرائيل,\" افعل شئ علي الجبهه\" السادات ورجاله ومن بينهم حسني مبارك وضعوا خطه الحرب وبعثوها اولا الي السعوديين لاخبار الامريكيين و ثم الي اسرائيل عن طريق اشرف مروان الذي فاوض الاسرائليون علي التكتيك والاستراتيجيه و خطه مابعد الحرب من مفاوضات تنتهي بالصلح مع اسرائيل. اي التكتيك ان يظهر الجيش المصري كمنتصر علي اسرائيل للمصريين. الاستراتيجيه الصلح الكامل عبر فك الاشتباك وفتح قناه السويس والصداقه الامريكيه المصريه.<br />اشرف مروان سقط عندما اعلن للمؤرخ الاسرائيلي اهارون بيرغمان مؤخرا انه يكتب مذكراته و بأنها ستكون حول أمور كثيرة في مصر، وكيفية عمل النظام هنا. اذا كشفت هذه المعلومات فالخاسر الوحيد هو نظام المصري ورجاله. فالنظام المصري يؤسس مرجعيته في الاستمرار في الحكم باعتباره بطلا لحرب اكتوبر.<br />من الواضح ان اشرف مروان كان علي علاقه ايضا ما بشله \"مصريون بلا حدود\" في لندن المعارضه لتوريث الحكم في مصر ومن بينهم اشرف السعد اللذي قابله قبل عده ايام من مقتله. من المعروف ان اشرف السعد يكن كراهيه كبيره للنظام المصري. من خلال هذه العمليه يرسل جهاز المخابرات المصريه رساله تحذير الي صناع القرار العالمين واغنياء مصر في الخارج ان حسني مبارك هو خط احمر. فمن الواضح ان حملات سعد الدين ابراهيم نجحت في الحد من تاثير النظام المصري علي مؤسسه صانعي القرار في الولايات المتحده الامريكيه واصبح النظام عاريا ومطمعا للكثيرين من الطامحين ومن الواضح انه كان يتم طبخ شئ ما في لندن لهز العرش المصري دفع اشرف مروان ثمنه.<br />سقط بنفس الطريقه التقليديه التي سقط بها حاملي اسرار النظام المصري عندما حالوا كشفها كسعاد حسني والليثي. والفاعل بدون ادني شك هو النظام المصري المرعوب من كشف اسراره."
