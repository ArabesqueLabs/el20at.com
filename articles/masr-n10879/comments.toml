text = "فعلا يا جماعه فيه صمت رهيب من قبل الحكومه و ده اللى اكده عمرو اديب ف القاهره اليوم امبارح<br />اصل احنا الحكومه عندنا كده<br />يا اما صمت رهيب يا اما تصريحات ناريه<br />فيها ايه لو ان فعلا الراجل ده اسدى خدمات جليله للبلد ان الحكومه تطلع تصريح تؤدى فيه واجب العزاء و تشيد بخدمات الراجل<br />ليه كل حاجه صعبه و معقده<br />حاجه فعلا تقرف"
