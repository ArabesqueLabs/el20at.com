subject = "كل فرد يساعد نفسه فى هدوء"
author = "نيفين نيفى نوفا"
posted = "2007-10-05"
text = "اولا استاذ احمد الهوارى الموضوع جميل و عجبتنى عباره كل فرد يساعد نفسه فى هدوء<br />و على ذكر الشيشه مش عارفه ليه يا جماعه كتير بسال نفسى احنا ليه بنقول دايما الشيشه غلط و مضره بالصحه و بنلوم جدا على الناس اللى بيشربو شيشه على القهاوى و كده و ىا داهيه دقى لو اللى بيشيشو بنات مع ان ال oriental atmosphere اساسه الشيشه او النارجيله بالفصحى<br />يعنى تعالة نتخيل كده الفيشاوى من غير الشيشه و من غير ريحتها اللى بعترف انها مميزه جدا ومن غير الاخوه (و الاخوات)المشيشين<br />هتحسو ان حاجه ناقصه<br />و دى مش دعوه للشيشه خالص و الله و للم و لن اكون من المشيشين بس هى خاطره بتجيلى لما بتتذكر الشيشه و بفتكر ازدواجيه نظرتنا لبعض الامور<br />تمام زى ما بننتقد المطربين و المممثلين مع ان مشاهده عمل فنى او سماع اغنيه شىء اساسى ف حياتنا<br />يللا<br />تخاريف رمضانيه"
