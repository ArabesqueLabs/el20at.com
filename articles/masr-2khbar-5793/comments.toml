subject = "امال فين ابن بهية وشريف الدواخلي وبقي الشلة"
author = "مش لازم"
posted = "2007-05-09"
text = "امال فين شريف الدواخلي وابن بهية وبقية الشله يلا تعالوا بقا عايزين نرجع زي زمان<br />وفين الكتاب الطيبين روضة عبدالحميد وهبة ربيع عايزنهم يرجعوا تاني<br />كل الناس القدام لازم يرجعوا<br />وانا برضه قديم بس انا لازم اغير اسمي المستعمار باستمرار علشان خاطر امن الدولة زي ما انتوا عارفين"
