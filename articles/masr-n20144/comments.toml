subject = "السياحة فى تونس والمغرب"
author = "اكتب اسمك هنا"
posted = "2009-03-01"
text = "يعنى واحد سائح يمشى وسط الجياع والعاطلين هيعملوا فية اية<br />طبعا هيحاولوا يخطفوا منة حاجة - يضربوة - يضايقوة - يشحتوا منة برازلة<br />علشان نبقى بلد سياحى صح - لازم يتغير الشعب ويبقى شبعان ومرتاح زى اسبانيا وزى نونس والمغرب ودبى<br />واقترح ان شركات السياحة تحصر المسار للسياح فى الاماكن الاثرية والفنادق فقط ولا داعى انهم يدخلوا وسط البلد والناس الفقراء يحتكوا بيهم<br />هتحصل مشاكل<br />وتقدر تقول عليها مشاكل فقر مش مشاكل ارهاب"
archived = "2009-03-02"
capture_url = "https://web.archive.org/web/20090302062606/http://masr.20at.com:80/newArticle.php?sid=20144"
