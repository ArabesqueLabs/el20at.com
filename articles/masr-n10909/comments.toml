subject = "التخان والبدنجان"
author = "شنبوا فى المصيدة"
posted = "2007-07-03"
text = "اية حكاية التخان هو البدنجان طلع والا اية<br />المشكلة فى التخين لما يتجوز ما بيقدرش يطلع السلم ولا يحل الواجب المنزلى المقرر<br />وبيبقى وزنة تقيل قوى وكانة كيس قطن على السرير<br />ودايما ملة السرير بتتكسر وبيعمل تلفيات غصبا عنة كرضوض عظام القفص الصدرى لما يفكر يعمل حاجة<br />ولذلك انصح زوجة التخين انها تعمل تامين شامل او تامين ضد الغير فى شركة تامين زى السيارات<br />لانة هيكسر حاجات وعامل زى الطور فى مخزن فخار<br />انما لو الزوجة تخينة فمرحبا باحلام الاجداد<br />مربربة وباين عليها الخير وبتدفى فى الشتا والصيف<br />عموما موضوع التخان كتر اليومين دى ويظهر ان الرز رخص والمكرونة ببلاش<br />وربنا يسلك المسائل ويهدى سر الجميع"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707010426/http://masr.20at.com:80/newArticle.php?sid=10909"
