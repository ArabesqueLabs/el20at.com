text = "الحقيقة ان دا من اروع الافلام المصرية اللي شفتها في حياتي<br />اخراج رائع ... تصوير الافضل .. موسيقى تصويرية لا يمكن ان تكون افضل من كدة ابدا ... اداء الممثلين عرفو يمثلو ادوار الصراع النفسي بحرفية غير عادية ... الديكور رائع<br />بالنسبة لي اروع مافي الفلم هو الصراعات النفسية في كل شخصية ... حيث اني لاول مرة ارى فلم عربي يركز على الجانب النفسي اللي دائما ما نهمله<br />و بانتظار افلام المبدع من بدايته المخرج محمد جمعة"
