order = 0
subject = "تحيا (مصر) و تسقط (اسرائيل و فلسطين)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-02-13"
text = "لتحيا (مصر) و لتسقط (اسرائيل و فلسطين)<br />لتبقى سوريا و منظمة حزب اللة و ايران و قطر يورونا شطارتهم و يحرروا (الجولان)اولا؟<br />هههههههههههههههههههههههههههها ههههههها هاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا<br />قال مغاوير قال<br />انتم مجانين باللة العظيم"
