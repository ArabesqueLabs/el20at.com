[[comments]]
order = 2
subject = "مصر اولا وطز فى الباقى"
author = "واحد معدى بس مهدى"
posted = "2009-02-24"
text = "البلد دى ( مصر ) لازم تنضف من دلاديل حسن نصر اللة وطز فى كل الدول العربية<br />بعد ماعلم بلدى اتحرق فى اليمن والناس داخلة القنصلية المصرية كائنهم فتحوا عكل الكلام خلص خلاص<br />حتى لو الحكومة غلطانة وحتى لو حسنى غلط انا مستعد اشيل السلاح بكرة ضد اى كلب عربى فاكر ان مصر هفية وبيحرق علمها وكفاية بقى كلام المهادنات"
archived = "2010-03-14"
capture_url = ""
