[[comments]]
order = 1
subject = "الجهاد الالكتروني على النت"
author = "محمد عبد المقصود"
posted = "2009-02-15"
text = "هذا باب عظيم من ابواب الجهاد يدي بيدكم ويد الله مع الجماعة علشان نقدر نعمل حاجة والقضية قضية دين وليس مجرد هواية ولكن الأمر جد خطير ولابد من المواجهة (( إذا لقيتم الذين كفروا زحفا فلا تولوهم الأدبار ))(( قاتلوهم بهذا السلاح الجديد الفتاك سلاح النت (( قاتلوهم يعذبهم الله بأيديكم ويخزهم وينصركم عليهم )) (( والله معكم ولن يتركم أعمالكم ))"
archived = "2010-03-14"
