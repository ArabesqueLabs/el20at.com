order = 1
subject = "يزيد ابن معاوية بعد جلوسة ملكا بعد موت ابية معاوية"
author = "مسلم سنى"
posted = "2009-01-20"
text = "يزيد اغتصب خلافة المسلمين واصبح حاكم بالعافية بعد ابية معاوية<br />وكان راى سيدنا على من قبل ان هؤلاء لا يصلحون للحكم -معاوية واولادة - لانهم من الذين عفا عنهم الرسول يوم فتح مكة حين جمعهم وقال لهم ما تظنون انى فاعل بكم - قالوا اخ كريم وابن اخ كريم<br />قال الرسول الكريم<br />اذهبوا فانتم الطلقاء<br />لايمكن ان يحكم الطلقاء الدولة الاسلامية والسابقون فى الاسلام يضهدون فى مكة والمدينة<br />معاوية قتل سيدنا على<br />ويزيد قتل الحس يالسم وقتل الحسين فى كربلاء<br />واسر بنات النبى وربطهم بالحبال وجروهم من كربلاء فى العراق الى د\\مشق فى الشام<br />ثم دعى يزيد الى سب ال البيت فى المساجد<br />من هنا يتعاطف ويتشيع المسلمين لال البيت<br />وردا على الشتائم سبوا الخلفاء الذين ولوا معاوية الحكم فى الشام وهم عثمان وعمر ردا على شتائم على واولادة<br />اذن الموضوع كان خلاف على من يحكم<br />خلاف على كرسى الحكم وانتهى<br />الشيعة مسلمون وهم اهلنا وامتدادنا ونحن نحبهم ونجل علمائهم<br />اقرأ كتاب خالد محمد خالد رحمة اللة كتاب اولاد الرسول فى كربلاء<br />خالد محمد خالد السنى اقرأ لة كتاب اولاد الرسول فى كربلاء"
archived = "2010-03-14"
