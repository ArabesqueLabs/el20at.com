subject = "السنة والشيعة واسباب ا لحقد المتبادل"
author = "ابومحسن غربة 27 سنه"
posted = "2009-01-20"
text = "با اختصار<br />السنة ينظرون الى الشيعة بأنهم سبابين وشتامين الصحابة رضوان الله عليهم ونحص بالذكر الثلاثة الكبار ابو بكر وعمر وعثمان وانتقل السب والشتم والاتهام الى ابنتا ابو بكر وعمر اللتان هما زوجتي الرسول صلى الله عليه وسلم وامهات المؤمنين وعثمان زوج بنتي النبي عليه الصلاة والسلام والعياذ بالله يتهمون السيدة عائشة بالـ(..........) قبحهم الله<br />الشيعة ينظرون الى اهل السنة والجماعة بأنهم هم الذين حاربوا علي ووقفوا بجانب الذين حرموا سيدنا علي من الخلافة وايضا هما الذين تسببوا في قتل الحسن والحسين واهل السنة من ذلك براء ولكن هذا معتقدهم<br />هذه هو ملخص اسباب الحقد السني الشيعي الذي ظل يتأجج عام بعد عام حتى استفحل الامر واصبح شوكة في ظهر الدين الاسلامي يستغله اعداء المسلمين على النحو الثابت الذي نراه الان يعني امريكا لم تدخل العراق لا من اجل البترول ولا من اجل اسلحة الدمار الشامل ولكن من اجل اخراح الشيعة من القمقم واحراج الدين الاسلامي كله وابراز قضية الشيعة والسنة كفرقتين متحاربتين متقاتلتين وستنشغل المنطقة كلها بهذه الفتنة من جديد.<br />هذا هو ملخص المشكلة<br />حد عنده حل<br />حسن البنا كان عنده حل علشان كده قتلوه فورا<br />اي والله لم يقتل حسن البنا الا لما اعداء الاسلام فوجئوا بانه عنده حل لمشكلة الشيعة والسنه<br />فيه حد غير حسن البنا عنده حل"
