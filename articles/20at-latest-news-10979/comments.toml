[[comments]]
order = 2
subject = "والذين جاءوا من بعدهم يقولون ربنا اغفر لنا ولإخوان"
author = "ابومحسن"
posted = "2009-01-20"
text = "الى الاخ المعلق السابق (المسمي نفسه مسلم سني)<br />انت ليس علاقة باهل السنة والجماعة<br />لو سمحت روح اقرأ كتاب عن عقيدة اهل السنة والجماعة<br />لماذا<br />لان كل هذه الروايات كاذبة<br />لان اهل السنة رفعوا السنتهم عن هذه الفتن كما رفع ايديهم عنها<br />واهل السنة يقولون<br />والذين جاءوا من بعدهم يقولون ربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان ، ولا تجعل في قلوبنا غلاً للذين آمنوا ، ربنا إنك رؤوفٌ رحيم<br />وقال النبي محمد صلى اله عليه وسلم خير القرون قرني<br />يعني الناس اللي عاشت في قرن الرسول هم خير الناس<br />ومعاوية ابن ابي سفيان ولي دم سيدنا عثمان لان لما قتل سيدنا عثمان زوجته بعتت قميصه الى معاويه وقالت له انت ولي الدم<br />وبرز معاوية ابن ابي سفيان كولي لدم عثمان يطالب بقتلته<br />والموضوع شائك وكبير اوي وانا قلت في تعليقي عايزين حد زي حسن البنا كده راجل كبير يوحد<br />وحياة والدك روح اقرأ كتاب عن اهل السنة والجماعة والتزم بيه<br />سلام ياصاحبي"
archived = "2010-03-14"
capture_url = ""
