text = "كرسى الحمام اللى مسمى نفسة زعيم انا عاوز اعرف زعيم على مين ولية اية ياعادل احة انت نسيت تاريخك ولااية ياعدولة زعامة اية وقرف اية انت يدوبك استلطفوك الناس فى وقت ما لما كنت بتهرج وبتمثل ادوار صعلكة وبتقف على المسرح كدة زى الارقوز"
