[[comments]]
order = 2
subject = "يظهر انة خايف وبيجعجع فى الكلام كتير ويظهر ان اخرت"
author = "اكتب اسمك هنا"
posted = "2009-02-01"
text = "هو بيعادى الجماعات دى لية<br />هو احسن من مين فى الفنانين - لية نور الشريف فى حالة وبيتكلم فى الفن بس<br />والا الواد دة عامل فركوكة وقعر مجلس كلام<br />ما تخليك فى حالك<br />انت مالك ومال حماس ومال الاخوان ومال غزة<br />ما تخليك فى المرض اللى ربنا ابتلاك بية بعد ما عملت مرقص والافلام المشبوهة الفاشلة<br />وبعدين خلاص يا عم انت هتاخد زمنك زمن غيرك ما تغور فى داهية بقى وخللى الشباب يتحركوا زى الهنيدى وغيرة"
archived = "2010-03-14"
capture_url = ""

