[[comments]]
order = 1
subject = "يظهر ان الواد عادل ابن عسكرى الدرك امام عايز يدخل"
author = "اكتب اسمك هنا"
posted = "2009-02-01"
text = "اللى دخل واحد زى دة فى السياسة اية ؟<br />يكونش فاكر نفسة اغبى من مجدى الدقاق<br />والا اكثر تفاهة وحقارة من جهاد عودة بتوع الوطنى الفاشلين"
