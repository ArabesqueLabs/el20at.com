[[comments]]
order = 5
subject = "مصر ام الدنيا"
author = "محمد صلاح عبد ربه"
posted = "2009-02-02"
text = "عادل امام كشف عن نفسه اخيرا حقيقة انه بطل من ورق وهو يبحث عن الاستوزار عند النطام وهدا حال كل انتهازي ووصولي لا تهمه المبادئ ولا القيم ولا الدين ولذلك بعد تجرئه على المقاومة وعلى الصحفي الكبير عبد الباري عطوان تراه يتجرا على العلماء وعلى الشيخ يوسف القرضاوي ماذا تنتظر من شخص متملق لا مبادئ ولا قيم له ياع انسانيته وادميته في مزاد النظام وينتظر الاجر من اشلاء الاطفال وجثت الشيوخ و النساء"
archived = "2010-03-14"
capture_url = ""
