order = 0
subject = "السقوط الفاضح في غزة"
author = "طيف بدر"
posted = "2008-01-21"
text = "انقطعت الكهرباء عن غزة لتغرق في ظلام دامس خيم على نفوسنا و عقولنا ...<br />انغلقت المعابر بيد العدو الفاجر و يد الشقيق العاجز و ما انقطع الأمل بالله العزيز القهار ...<br />كم عملية جراحية توقفت الآن ؟ كم بيت يعاني صقيع الشتاء الآن ؟ كم طفل يصرخ من الجوع الآن ؟<br />أيها العالم القذر المنافق ... لعنة الله على أصنامك و طواغيتك ... ما أبشعك و ما أحقرك !!! ما ذنب أهل غزة كي تقتلوهم تلك القتلة البشعة ؟؟؟ تقتلونهم بثقافة قتل الهنود الحمر و حرق أراضيهم .<br />هل أخطأ أهل غزة لأنهم رفضوا الحياة كـ \" جوييم \" ، أبوا الحياة كحشرات من الدرجة العاشرة ؟؟ ألا إنهم رفضوا التفريط في أرضهم و مفدساتهم و حقوقهم تمارسون عليهم تلك البلطجة الدولية ؟؟ أتقتلون قوما قالوا ربنا الله ؟؟ أتنقمون منهم أن يؤمنوا بالله العزيز الحميد الذي له ملك السماوات و الأرض و هو على كل شيء شهيد ؟؟<br />من ألوم ؟<br />ألوم اليهود و أمريكا ؟؟ ... ياللغباء !! ... و منذ متى يلوم الرجل أعداءه ؟؟<br />ألوم حكومتي ؟ حكومتي التي أغلقت معبر رفح بحجة أن الاتفاقيات الدولية تشترط وجود ممثل للإتحاد الأوروبي عند فتح المعبر و لكن ممثل الإتحاد الأوروبي لم يحضر !! و مصر ملتزمة بالاتفاقيات الدولية !! ما هذه العزة التي تتعامل بها حكومتي إزاء الإتحاد الأوروبي الذي جرمها في ملف \" حقوق الإنسان \" قبل يومين ؟ كم أفخر بسيادتك و استقلاليتي يا حكومتي الرشيدة القوية !!<br />حكومتي التي تمنح الغاز الطبيعي للصهاينة بربع الثمن الذي تبيعه للمصانع المصرية الوطنية بينما الحياة متوقفة في غزة<br />يا أهل غزة أعذروني ... أنا مصري عاجز ... أنا مصري ذليل !!<br />ألوم سلوليي فتح دايتون ؟ هم حثالة الشعوب و الأقوام و هم الواجهة المتعفنة و المسيئة للفلسطينيين الذين لا يتحرجون من الإعلان عن وقوفهم في خندق واحد مع العدو ضد أهل التوحيد و الإصلاح ، هم لا يتحرجون من إعلان سعادتهم عند قتل الصهاينة لمجاهد شريف<br />و لكن أين مشايخنا و دعاتنا و فضائياتنا الإسلامية مما يحدث في غزة ؟ أين محمد حسان ؟ أين محمود المصري ؟ أين مصطفى حسني ؟ أين خالد الجندي ؟...<br />أين ابن جبرين الذي حرم علينا الدعاء لحزب الله في حربه ضد اليهود بينما لم ينبس ببنت شفة على مجيء السفاح بوش إلى أرض رسول الله (صلى الله عليه و آله و سلم) ؟ أين كلام ابن جبرين عن الولاء و البراء عندما يرقص ملك السعودية مع جورج بوش ؟ بالله عليك يا ابن جبرين ... أيهما أشرف يا بن جبرين : سليل آل سعود أم حزب الرافضة ؟<br />أين محمد حسين يعقوب الذي استغرب أن يطلب الشباب دينا يأمرهم بمقاتلة إسرائيل لأن الدين \" مش على الهوى \" ؟<br />أين عمرو خالد الذي جعل من الإسلام مجرد فيلم رومانسي لا يهم المسلم فيه إلا شكله في العيون الزرقاء ؟<br />أما فيكم الحسن البصري ؟ أما فيكم ابن تيمية ؟ أما فيكم العز بن عبد السلام ؟<br />أصدق قول اليهود فيكم عندما دنسوا بيت المقدس و هم يهتفون \" محمد مات خلف بنات \" ؟<br />أهلي في غزة هاشم ... ماذا أقول لكم أنا المنعم المترف ... و لكن كونوا كما كان أجدادكم في شعب بني هاشم و تمثلوا كأن رسول الله بينكم الآن ؟<br />تذكروا بين الظلمات و الجوع قول الله تعالى : عَلَيْهِ فَنَادَى فِي الظُّلُمَاتِ أَنْ لا إِلَهَ إِلاَّ أَنْتَ سُبْحَانَكَ إِنِّي كُنتُ مِنْ الظَّالِمِينَ (87) فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنْ الْغَمِّ وَكَذَلِكَ نُنْجِي الْمُؤْمِنِينَ (88)<br />تذكروا : أَمْ حَسِبْتُمْ أَنْ تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَأْتِكُمْ مَثَلُ الَّذِينَ خَلَوْا مِنْ قَبْلِكُمْ مَسَّتْهُمْ الْبَأْسَاءُ وَالضَّرَّاءُ وَزُلْزِلُوا حَتَّى يَقُولَ الرَّسُولُ وَالَّذِينَ آمَنُوا مَعَهُ مَتَى نَصْرُ اللَّهِ أَلا إِنَّ نَصْرَ اللَّهِ قَرِيبٌ (214)<br />http://alayasser.maktoobblog.com/771744/%D8%A7%D9%84%D8%B3%D9%82%D9%88%D8%B7_%D8%A7%D9%84%D9%81%D8%A7%D8%B6%D8%AD_%D9%81%D9%8A_%D8%BA%D8%B2%D8%A9"
