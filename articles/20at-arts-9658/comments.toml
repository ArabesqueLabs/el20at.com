posted = "2008-08-03"
text = "من أكثر ما يضحكني (وشر البلية ما يضحك) حين أسمع الناس يتغنون بعبارات للبروزة فقط مثل الجمال جمال الروح! ..<br />عبدالقادر منصور - البعد الآخر وتريات ريفية: \" لن أربط حزام الأمان ولن أشده على معدتي، مرت المضيفة مبتسمة: من فضلك أربط الحزام، فربطت الحزام سريعا إنها سطوة الجمال ودكتاتورية سحر العيون\" !!!<br />بالمناسبة .. يوجد جميلات غير جذابات أبدا وتشعر أنهن مثل التماثيل الحجرية .. وهناك غير جميلات لكن بهن جاذبية ساحرة!"
