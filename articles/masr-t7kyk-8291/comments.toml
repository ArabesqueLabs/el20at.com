[[comments]]
order = 2
subject = "اذا كان رب البيت بالدف ضارب فشينة اهل البيت الرقص"
author = "ابو زلمة"
posted = "2008-02-23"
text = "واللة طريقة جديدة للمكافحة - نكافح البلهارسيا بالغناء - وازمة رغيف الخبز بقانون من المجلس التشريعى بعدم اكلة نهارا<br />ونعالج البطالة بفتوى من مولانا تقول اقعد فى بيتك وارتاح يأتيك النجاح - ولكل مجتهد خازوق<br />اية الحلاوة دى فى حل المشكلات<br />الشعب بتاعنا بقى عندة حول فى عنية - عندة عمى الوان - زهايمر فى التفكير<br />معالجة الايدز - يلزمة مصحات ومبانى ودكاترة واجهزة وكتيبات توعية توزع على الشباب المسافر للخارج فى المطارات والموانى<br />فى المدارس نحذرهم بلوح واعلانات وارشادات عن استخدام الابر والحقن وعدم استخدام الموسى عند الحلاق علشان الايدز وامراض سى ودى بتاع الكبد<br />الموضوع عايز فلوس وناس وتبرعات رجال الحديد والاسمنت والسيراميك والنساجون<br />انما الرقص - الرقص ينفع عند صفية حلمى<br />او فى ملهى بديعة"
archived = "2010-03-14"
capture_url = ""

