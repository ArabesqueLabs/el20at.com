[[comments]]
order = 6
subject = "السم فى العسل"
author = "م/ياسر صديق"
posted = "2008-07-06"
text = "السلام عليكم ارجو ان تتجاوبو مع رسالتى لانها من والد احد الطلبة الذين حضرو احد هذه الندوات انها وسيلة صريحة لازالة الحياء وازالة الدين من فكر اولادنا لنهم يدعون الاولاد لممارسة الرزيلة بطرق امنة واستخدام الواقى الذكرى بطريقة صحيحة وكلام اسف لا استطيع ذكره لانه خدش للحياء لكنى واجهتهم بكل الى حصل وهربو من المواجهة الثانية واحضار الشرائط المسجل عليها الندوات احذروهم بل حاربوهم ولا تكونو سلبيين واحذر ان ترسل اولادك لهم للعلم نشرت جريدة المصرى اليوم تحقيق عنهم وفضحتهم ولم يستطيعو احضار الرد الذى ينفى الاتهامات الموجهة اليهم<br />تم عمل استجواب فى مجلس الشعب عنهم وايضا فشلو فى الرد بالله عليكم من هؤلاء"
archived = "2010-03-14"
