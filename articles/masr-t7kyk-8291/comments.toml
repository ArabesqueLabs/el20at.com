subject = "صر توقف بث البركة؟!"
author = "مازن"
posted = "2008-02-21"
text = "قررت إدارة القمر الصناعي المصري نايل سات إيقاف بث قناة البركة.<br />وقال مصدر مسئول في النايل سات ان الادارة اتخذت قرار وقف القناة المتخصصة في مناقشة القضايا الاقتصادية من وجهة نظر اسلامية بسبب عدم استكمالها للأوراق الرسمية اللازمة لعملية البث.<br />الجدير بالذكر ان القناة بدأت عملها منذ أكثر من عام ويملكها عدد من رجال الدين الاسلامي بالإضافة إلى قناة الناس الدينية.. ويقول مالكوا القناة انها بمثابة خطوة في إطار منظومة متكاملة تهدف إلى الوصول إلى شرائح متنوعة ومتعددة من المشاهدين لبث الوعي بأبعاد الاقتصاد الإسلامي ومنظومته وقيمه."
archived = "2010-03-14"
