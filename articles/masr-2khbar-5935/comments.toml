subject = "الحكومة بتحييك الشعب"
author = "احمدابوصالح"
posted = "2007-05-20"
text = "هى الحكومة دية مش ناوية تجيبها لبر ابدااااااا مش هيستريحوا غير لما يخلونا تانى نركب الحمير عشان نوفر بنزين ربنا يرحمنا من دية حكومة فاشلة سؤاال هى الناس مش ناوية تتحرك ابداا يعنى لا مظهرات ولا اعتصمات ولا ديولة طيب طول ما محدش بيتحرك خلى الحكومة تعمل ما بدلهاا انشالة حتى تحيييييك الشعب"
