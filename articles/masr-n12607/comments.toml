subject = "((يكون بعدي أئمة لايهتدون بهداي ولايستنون بسنتي وس"
author = "اكتب اسمك هنا"
posted = "2007-12-08"
text = "((يكون بعدي أئمة لايهتدون بهداي ولايستنون بسنتي وسيقوم فيهم رجال قلوبهم قلوب الشياطين في جثمان إنس قال ( حذيفة): قلت : كيف أصنع يارسول الله ؟ إن أدركت ذلك ؟؟ قال : (( تسمع وتطيع وإن ضرب ظهرك وأخذ مالك , فاسمع وأطع )) رواه البخاري ( 7084) ومسلم ( 1847) باب ( يصبر على أذاهم وتؤدى حقوقهم )"
archived = "2010-03-14"
