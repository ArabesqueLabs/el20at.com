text = "\"إن الله لا يقبض العلم انتزاعًا ينتزعه من العباد، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يبق عالمًا اتخذ الناس رءوسًا جهالاً، فسئلوا فأفتوا بغير علم فضلوا وأضلوا\"،"
