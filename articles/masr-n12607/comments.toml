[[comments]]
order = 0
subject = "البخاري ( 7084) ومسلم ( 1847) باب ( يصبر على أذاهم"
author = "مش ضروري"
posted = "2007-11-28"
text = "بسم الله الرحمن الرحيم<br />يا ايها الذين امنوا لا ترفقوا اصواتكم فوق صوت النبي ولا تجهروا له بالقول كجهر بعضهم لبعض<br />صدق الله العظيم<br />وقال النبي صلى الله عليه وسلم في الحديث الذي رواه مسلم<br />((يكون بعدي أئمة لايهتدون بهداي ولايستنون بسنتي وسيقوم فيهم رجال قلوبهم قلوب الشياطين في جثمان إنس قال ( حذيفة): قلت : كيف أصنع يارسول الله ؟ إن أدركت ذلك ؟؟<br />قال : (( تسمع وتطيع وإن ضرب ظهرك وأخذ مالك , فاسمع وأطع ))<br />رواه البخاري ( 7084) ومسلم ( 1847) باب ( يصبر على أذاهم وتؤدى حقوقهم )<br />وقال النبي صلى الله عليه وسلم (( من كره من أميره شيئاً فليصبر عليه ,فإنه ليس من أحد من الناس يخرج من السلطان شبراً فمات عليه , إلا مات ميتة جاهلية ))<br />ولذلك ننصح الاخوان المسلمين ان يعودوا الى حلق العلم والمعرفة ويتفقهوا في دينهم ولا يلقوا بانفسهم الى المعتقلات<br />وشكرا"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 1
subject = "نداء الى فضيلة المرشد"
posted = "2007-11-28"
text = "النبي صلى الله عليه وسلم معلماً<br />إطلاق اسم المعلم على نبينا صلى الله عليه وسلم:<br />لا ريب أن مهمة النبي والرسول إنما هي تعليم أمته ودلالتهم على الخير قال تعالى: {هو الذي بعث في الأميين رسولاً منهم يتلو عليهم ءاياته ويزكيهم ويعلمهم الكتاب والحكمة وإن كانوا من قبل لفي ضلال مبين} [الجمعة:2].<br />{كما أرسلنا فيكم رسول منكم يتلو عليكم آياتنا ويزكيكم ويعلمكم الكتاب والحكمة ويعلمكم ما لم تكونوا تعلمون} [البقرة:151].<br />وخرج يوماً على أصحابه فوجدهم يقرؤون القرآن ويتعلمون فكان مما قال لهم: ((وإنما بعثت معلما))[1] . وقال صلى الله عليه وسلم: ((إن الله لم يبعثني معنتاً ولا متعنتاً ولكن بعثني معلماً وميسراً))[2] .<br />يقول معاوية بن الحكم: ((ما رأيت معلماً قبله ولا بعده أحسن تعليماً منه))[3] ، وفي رواية أبي داود: ((فما رأيت معلماً قط أرفق من رسول الله صلى الله عليه وسلم))[4] .<br />بص في الصورة كويس يا فضيلة المرشد<br />غلط يحصل دا باسم الاسلام يا فضيلة المرشد<br />غلط الاسلام يبقى بلطجه يا فضيلة المرشد"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 2
subject = "من لايخشى الحق"
author = "لاطاعة لمخلوق في معصية الخالق"
posted = "2007-11-28"
text = "الجامعة مركز لطلب العلم وستبقى قلعة لتخرج المدافعين عن حقوق الطلبة وهي المعيار لقياس الحركة في المجتمع ومعرفة دكتاتورية الدولة"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 3
subject = "لا تفرحوا"
author = "سالم"
posted = "2007-11-28"
text = "الجامعة هادئة والامن اخر تمام والكل مبسوط<br />الطلبة كان لهم نشاط ظاهر وامام اعين الجميع وفى الهواء الطلق وتحت المراقبة ودول شباب متحمس وعندة طاقة واللى بيعملوة يمكن يكون حاجة صحية انها تنفس الضغوط الداخلية فى نفوس الاولاد ويقولوا اللى فى نفسهم وينتهى الموضوع<br />انما افترض ان هؤلاء الشباب لجئوا الى العمل السرى<br />واشتغلوا تحت الارض بعيد عن اى رقابة ولا سيطرة<br />سوف يفرغ هذا الهدوء اغتيالات وبلاوى سودة سوف تفرزها الايام القادمة<br />يا اصحاب الامن فكروا بادمغتكم المصدية وخلوا الشباب ينفس عن روحة ويقول كلمتين بيوجعوة وفى الظاهر<br />ان الذى يحدث مؤشر خطر<br />فليستيقظ الجميع"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 4
subject = "ايه علاقة العرض بخيرت الشاطر ورفاقه"
author = "مها احمد زوجة رجل اخواني"
posted = "2007-11-28"
text = "حاجه غريبة اوي<br />بعد العرض دا ما اتعمل على طول<br />تم القبض على خيرت الشاطر ورفاقه<br />عايز اعرف ايه العلاقة بين دول<br />الامر الذي يؤكد ان العرض العسكري دا مدبر من قبل الحكومة (تلكيكه يعني) علشان يضربوا الجناح المالي للاخوان"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 5
subject = "قصة مختلقة"
author = "ازهرى"
posted = "2007-11-29"
text = "انظر الى الصورة جيدا لماذا كان الاشخاص الذين قاموا بالعرض ملثمين ويخفون ووجوههم ؟<br />علشان محدش يعرفهم<br />لية<br />لانهم لو اظهروا وجوههم الناس هتعرفهم ويقولوا دول مين هم<br />هل هم طلبة من الازهر ؟ والا فرقة من الداخلية<br />العملية كلها كانت تمثيلية بايخة علشان يقبضوا على الناس تحت غطاء ما<br />الذين قاموا بالعرض هم افراد من الداخلية مدربين ولهم زى موحد تبع خطة معينة"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 6
subject = "برافوا عليك يا ازهري انت ميه ميه"
posted = "2007-11-29"
text = "هو دا الصحيح<br />انت كده حطيت النقط فوق الحروف<br />لان بعد العرض دا مباشرة فوجئنا بالقبض على قيادات الاخوان المسلمين<br />يبقى العرض دا عرض مدبر من الداخلية وفعلا العالم دي مغطية وشها علشان خاطر ما حدش يكشف شخصيتهم<br />برافوا عليك يا ازهري"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 7
subject = "الإستعباط هو الحل"
author = "فيدو"
posted = "2007-11-29"
text = "الإخوااااااااااااااااااااااان عايشين بمبدأ نظرية المؤامرة<br />الحكومة مورهاش حد غيرهم تخطط لهم و تراقبهم و تسجنهم يا سلام .... صلاة النبي أحسن<br />انا مش من مؤيدي الحكومة خااااااااااااالص بس برضه مش بأيد الإخوان<br />لو كان العرض فعلا مدبر يا حبايبي مكانش الإخوان حيسكتوا و فضيلة المرشد كان حيطلع و يقول دول من الداخلية<br />و أعضاء الأخوان اللي في المجلس كانوا حيقدموا إستجوابات علشان يعرفوا مين اللي عمل التمثيلية<br />لكن الإخوان أخدوا الموضوع و سكتوا مش معقول يعني يسكتوا و هما علي حق ولا أيـــــــــــــــــــــــــه؟<br />حاسب النت يقطع عندك لحسن تكون الحكومة هيا اللي فصلته لأنك إخوان<br />سلام يا عسل"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 8
subject = "الى الاخ فيدو"
posted = "2007-11-30"
text = "يا اخ فيدو الاخوان الان اصبحت فكر وانتشر في كل الدنيا والمرشد العام ليس مسئول عن معتنقي الفكر<br />وطلبة الجامعات يحملون فكر الاخوان ويمشون على نهجهم ولكن ليسوا اعضاء في الجماعة والمرشد العام غير مسئول عنهم<br />يعني مثلا فيه 5000 معتقل على الاقل من الاخوان هما ليسوا اعضاء في الجماعة والمرشد العام غير مسئول عنهم<br />وبعدين هنا احنا بنقول احتمالات وفرضيات<br />تساءلنا ايه العلاقة بين العرض العسكري اللي عملوه الطلبة وعلى الفور تاني يوم تم اعتقال خيرت الشاطر ورفاقه<br />عندك تفسير تاني غير اللي احنا قلناه والاحتمال اللي قاله الاخ دا صح بنسبة كبيرة جدا ان لم يكن 100% فهو على الارجح صح بنسبة 99%"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 9
subject = "مفيش حاجة اسمها اخوان"
author = "مصرى"
posted = "2007-11-30"
text = "قلنا مفيش حاجة اسمها اخوان ولا لها مكاتب ولا فروع ولا تنظيم ولا دياولو<br />فية نهج الاخوان وفكر الاخوان ويسير علية بعض شباب الجامعات<br />وكثير من المتدينين فى مصر<br />والمرشد لا يمثل الا نفسة<br />والمصيبة بالنسبة للحكومة ان هذا الفكر ينتشر ولة انصارة بالملايين والحزب الوطنى محصور فى بعض مقارات وليس لة اى نشاط فى الشارع وهو حزب كرتونى عامل زى الشيطان محدش شافة لكن الكل بيتكلم عنة<br />المستقبل فى مصر لهذا الاتجاة الدينى الذى يقودة هؤلاء الشباب العاطلين عن العمل وضد الفساد والمفسدين وبتوع بيع مصر ومصانع وبنوك مصر للاجانب"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 10
subject = "إلى الأخ مش ضروري"
author = "محمد"
posted = "2007-11-30"
text = "رجاء يا اخ مش ضروري..<br />حاول تنفس عن ما يكن في صدرك ..عند أي طبيب نفسي ...<br />لعلك تلاقي حد عنده علاج لما أصابك من مرض عضال أصابك بلوثه عقلية ونفسية...<br />واضح إن معدلات الهوس في نافوخك تجاوزت الحد غير المسموح به ..<br />وبلغت مداها حتى أنك من فرط ما أثرت فيك تحاول جاهداً التخلص منها بإلقائها على من تقدر من الناس...<br />إنت بجد مريض نفسياً ومحتاج رعاية وعلاج ...أنا بتكلم جد ..إنت محتاج علاج نفسي مكثف !!"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 11
subject = "الاخ العزيز محمد"
author = "مش ضروري"
posted = "2007-11-30"
text = "ممكن اعرف انا اخطأت في ايه<br />تعليقي عبارة عن حديث للنبي محمد صلى الله عليه وسلم فقط<br />ممكن اعرف ايه الخطأ اللي فيه<br />الحديث واضح وصريح فيه رد على حديث رسول الله صلى اله عليه وسلم<br />وبعدين انا عايز بريدك الالكتروني اذا سمحت علشان خاطر نتناقش وشكرا"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 12
subject = "للأخ مش ضروري"
author = "محمد"
posted = "2007-12-01"
text = "يا مهووس...<br />المشكلة مش في الحديث النبوي ...المشكلة في استخدام الأحاديث في غير موضعها...وإسقاطها والاستدلال بيها واللعب بيها كسلاح لإرهاب الآخر أو المخالفيين...الإخوان وغيرهم...<br />ومشكلة عقلك المريض ...هي الإختلال في وزن الأمور....يعني بالنسبة لعقليتك الضحلة...بتهاجم معارضي مبارك وإبنه....سواء كانوا إخوان او غير ...وعمال تكفر فيهم...وتخطأهم وتأثمهم...بفتاوي وآراء مدعيين دين وفتوى هم للسلطنة أقرب من الإيمان...وعمال تنقل فتاوي لمن هم ليسوا اهل للفتوى...وفتاويهم كلها مسيسة ومرتبطة بالسلطنة...<br />وبالفعل إنت مريض بداء غريب...يعني شهوتك أصبحت في التعليق عمال على بطال...وتحديداً على كل المقالات المتعلقة بالإخوان...على الرغم من غن الموضوع مايستاهلش كل الهوس إلي إنت عايش فيه ده...الإخوان إختاروا ...يتحملوا إختيارهم...ووضع البلد زي الزفت...ومحتاج الناس تتحرك وتضغط على النظام علشان يتزاح من قلب مصر...<br />ورجاء كفاياك تعليق ...يا تقول كلمه كويسة تساعد محاولات الإصلاح وتدعمها...يا تحط لسانك في بقك...وتروح تتعالج...لإن الواضح إنك فعلا محتاج لعلاج وبسرعة...أحسن حالتك تستفحل وتروح لنقطة اللا عودة...بجد إن مهتز نفسياً وغير متزاً عقلياًً....<br />وبخصوص طلبك لإيميلي...فأنا كنت شاكك إنك مخبر أمن دولة...هتقولي إنك عندك ملف ومتصنف إخوان والكلام الفاضي ده...فده بيأكد خلل عقلك وتفكيرك...طلبك لإيمياي بيدعم شكي إنك شغال في أمن الدولة إلي في الشيخ زايد ...<br />أرجوك بطل تثبيط لهمم الناس ..."
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 13
subject = "الى الحمار مش ضرورى"
author = "هلفوت"
posted = "2007-12-01"
text = "هو اى حاجة تجيب لنا الحديث اياة اللى بتفسرة بخيالك المريض<br />وبعدين مبارك وابنة مش سلطان<br />دا موظف بأجر فى الدولة ومنتخب لتأدية وظيفتة فان فشل فى وظيفتة فمع السلامة<br />السلطان هو اللى بيورث السلطنة من ابوة يعنى بيورث العزبة يعنى او التكية من اللى خلفوة<br />والراجل بيقول انة ما ورثهاش<br />عايز تعملة سلطان لية<br />النظام جمهورى با الانتخاب يعنى نختار الصالح من الامة وبا الاجماع<br />واللى بيقعد على دكة الحكم بيبقى مستوظف بياخد مرتبة من الخزينة العامة اللى بتجيب فلوسها من الضرايب اللى بتدفعها بياعة الفجل واللى بيلف يبيع امشاط وفلايات<br />تقوم تقوللى السلطان ويضرب ظهرك وتطيع ابقى قول الكلام دة فى حتة تانية<br />الطاعة فى الاسلام لولى الامر الذى يؤم الناس فى الصلاة ومعاهم فى المسجد على طول وبيشوف الفقير والمسكين<br />عالم هم<br />ربنا ياخدكم"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 14
subject = "استفسار حول منهج الإخوان"
author = "منقول (مش حشتم"
posted = "2007-12-01"
text = "استفسار حول منهج الإخوان<br />نود من فضيلتكم إعطائنا كلمة حق في الإخوان المسلمين فالبعض يعدهم فرقة نارية والبعض يعد الخلاف معهم كأي خلاف سائغ , فنريد كلمة حق فيهم , أليسوا قد ألغوا عقيدة الولاء و البراء واتخذوا فكراً علمانياً تحت اسم الإسلام؟ فهل هم فرقة ضالة ويكفروا ما لم يعذروا بالجهل ؟<br />الجواب:<br />الحمد لله والصلاة والسلام على رسول الله، أما بعد،<br />الجماعة تجمع إلى الخير كثيراً من الدَخَن والبعد عن السنة والتعصب الممقوت والفتاوى الباطلة والتقليد الأعمى والمداهنات السياسية والإقرار بالبدع ولا أعنى أن كل شخص منهم فيه ذلك ولكن هذا فى جملة الجماعة فأنصحك أن تبحث عن أهل السنة وأتباع سلف الأمة فتكون معهم.<br />وأما إلغاء عقيدة الولاء والبراء واتخاذ الفكر العلماني فلا يجوز أن يقال عنهم ككل مثل هذا الكلام وإنما صدر كلام باطل عن أفراد كثيرين من دعاتهم وقادتهم لكن لا يعمم هذا الحكم على الجميع.<br />والصحيح أنه يعامل كل فرد فيهم بما يستحقه فمن كان على عقيدة فاسدة وبدعة عومل بناء على ذلك ويلزم تعليمه ودعوته إلى الله.<br />ومن أظهر عقيدة أهل السنة ومنهجهم عومل على ذلك وأظنك تعلم أن من المنتسبين للجماعة مع سلفية عقيدتهم الدكتور الأشقر والدكتور مصطفى حلمي والدكتور عبد الكريم زيدان حفظهم الله.<br />أفترضى أن يقال عن هؤلاء مع ما تعلم من سلامة عقيدتهم أنهم من الفرق النارية . وإن كان الانتماء لمثل هذه الجماعة على ما هي عليه لا يجوز للسكوت على كثير من المنكرات.<br />www.salafvoice.com"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 15
subject = "كلمة الشيخ الشعراوي لحسني مبارك"
author = "مش حشتم"
posted = "2007-12-01"
text = "كلمة الشيخ الشعراوي لحسني مبارك<br />وفيها تفسير معنى افضل الجهاد كلمة حق في وجه سلطان جائر<br />هذا المقطع كان لفضيلة الامام الشيخ محمد متولي الشعراوي قبل وفاته بفترة بسيطة كان المعروف عن الشيخ انه لا يخاف سوا الله وجريء ويقول الحق امام الظالم ولو كان فرعون لا يهاب ظلمه وجبروته وانه الوزير الوحيد الذى ترك الوزارة وترك السلطة وكل شيء للتفرغ الى الدعوة وحتى يقع فى دائرتهم المعروفه .<br />فكان هذا الحديث فى مؤتمر القي فيها الرئيس والقي الشيخ كلمته المشهورة والتى ستظل فى مسمع العالم الاسلامي كله والتى لن ينساها مسلم قد سمعها وهى :<br />وانى يا سيادة الرئيس اقف على عتبه دنيايا لأستقبل اجل الله فلن اختم حياتي بنفاق ولن ابرز عنتريتي باكتراء ولكني اقول كلمة موجزة للامة كلها حكومتا وحزبا ومعارضة ورجالا وشعب .. اسف ان اقول سلبي .. اريد منهم ان يعلموا ان الملك كله بيدي الله يأتيه من يشاء فلا تأمر لأخذه ولا كيد للوصول إليه فأن الحق سبحانه وتعالي حينما حكي حوار ابراهيم للنمروز ماذا قال له .. الذى حجا ابراهيم فى ربه وهو كافر قال ان اتاه الله الملك فالملك حين ينزله الله قال يأتي الملك لمن يشاء فلا تأمر على الله لملك ولا كيد على الله لحكم لانه لا يحكم احدا فى ملك الله إلا بمراد الله .. فإن كان عادلن فقد نفع بعدله وان كان ظالما بشع الظلم وقبحه فى نفوس كل الناس فيكرهون كل ظالما ولو لم يكن حاكما ولذلك اقول للقوم جميعاً والحمد لله قد تأكد لنا صدق الله فى كلامه بما جاء من الاحداث فكيف كنا نفسر قول الله ويمكرونا ويمكروا الله فكيف كنا نفسروا انهم يكديون كيدا ونكيدوا كيدا الله يريد ان يثبت - قيوميته - على قومه فانا انصح كل من يجول براسه ان يكون حاكما انصحه بان لا تطلبه بل يجب ان تطلب له فان رسول الله قال من طلب الي شيء اعين عليه ومن طلب شيء وكل إليه .. يا سيادة الرئيس اخر ما احب ان اقوله لك ولعل هذا يكون اخر لقائي انا بك .......... ( ووضع الشيخ يده على كتفي الرئيس وقال) ... اذا كنت قدرنا فليوفقك الله فإذا كنا قدرك فليعنك الله على ان تتحمل .<br />وكان هذا فعلاً اخر لقاء للشيخ فرحمه الله<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />منقول من منتدى سوالف"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 16
subject = "الى الاستاذ هلفوت والاستاذ محمد"
author = "مش ضروري ومش حشتم"
posted = "2007-12-01"
text = "طبعا اولا واخيرا انتو اخونا في الله ويغفر الله لنا ولكم<br />وانا احب الاخوان المسلمين وزعلان انهم بيضيعوا وقت ثمين في السجون والمعتقلات هذا الوقت كان يجب على هؤلاء الاخوة ان يعلموا الناس امور دينهم<br />المهم انا عايزكم تصوروا الحديث اللي فوق وتطلعوا بيه على اكبر عالم من علماء الحديث في مصر الاستاذ احمد عمر هاشم ورئيس جامعة الازهر وتخلوه يشرحلهم معنى الحديث او اي استاذ في جامعة الازهر<br />يا اساتذد الحديث واضح وصريح اننا ما نتدخلش في الحكم احنا ندعو الى الاسلام زي ما احنا عايزين وربنا سبحانه وتعالى هو اللي بيختار الحاكم وفق ما يراه هو سبحانه وتعالى والله سبحانه وتعالى له حكمة في ذلك<br />يلا بقى صوروا الحديث واطلعوا على جامعة الازهر وخلوا اي استاذ هناك يشرحلكم الحديث<br />وبلاش سب وشتم المسلم عيب لما يسب ويشتم<br />لاننا حنتقابل كثير اوي لان عشرينات ما شاء الله بتحب الاخوان وكل يوم والثاني تنزل موضوع عن الاخوان<br />والى اللقاء في الموضوع الاخلاني القادم<br />واكرر انا بحب الاخوان حدا واللي بيحب واحد ما يحبش يشوفوا في السجن او المعتقل"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 17
subject = "المعنى فى الحديث ضعيف"
author = "ازهرى"
posted = "2007-12-02"
text = "الحديث ورد كما ذكرت ولكنة ضعيف فى الاسناد وفى المعنى ولو عمل بة المسلمين لما حدث الاتى<br />اولا : لما خرج على بن ابى طالب او معاوية وهم من الصحابة ويعرفوا الحديث جيدا ان كان حقيقيا يخرجوا للصراع على كرسى الحكم ويموت ويسجن الاف المسلمين<br />ثانيا : خروج الحسين على يزيد وحرب كربلاء ولماذا لم يطلب الحسين ان يضرب يزيد ظهرة وياخذ مالة على حسب حديثك الضعيف والباطل<br />ان معنى الحديث يدعوا الى الاستكانة والذل الذى لم يحدث ابدا<br />ان احدهم وقف امام الخليفة عمر يقول لة فى المسجد وعمر من هو عمر يقول لة واللة لو وجدنا فيك اعوجاجا لقومناك بسيوفنا<br />ثم انة لم يرفع احدا من الاخوان السلاح ضد النظام هذا اذا كان فية اخوان اصلا<br />ولكن توجد معارضة<br />ويتم التنكيل بالمعارضة ويتم التشنيع عليهم امام الغرب الذى يكرة الاسلام بان النظام يحارب الاسلام والمتطرفين ويصفهم بالارهابيين ولكن الغرب فهم اللعبة والفولة وعرف اية اللى بيحصل<br />ثم ان جريدة امريكية نشرت ان ابن رئيس النظام يملك 750 مليون دولار - من اين جاء بهم ؟<br />طاعة اية يخرب بيت اهلك<br />ابقى طيع يا اخويا زى ما انت عايز<br />بس ابعد فكرك المريض عنا<br />وعلى فكرة ما فيش احد اخوان ولكن معارضة من اجل مصر"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 18
subject = "الى الاخ الجاهل اللي فوق"
posted = "2007-12-02"
text = "يا جاهل<br />البخاري ما فيش فيه احاديث ضعيفة يا جاهل وعلشان كده اسمه صحيح البخاري كل احاديثه صحيحة يا جاهل<br />وانا قلت احمد عمر هاشم مش واحد جاهل زيك جاهل وغبي واحمق<br />,وبعدين ما فيش مشكلة انتوا اعملوا انتوا جماعات مناهضة للحكم وهو يعمل اجهزة امنية ايه المشكلة"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 19
subject = "مين اللي مهوووس فينا"
posted = "2007-12-02"
text = "مين اللي مهووس فينا<br />اللي بيحب يشوف امن الدولة وهو بيقبض على الناس ويحطهم في المعتقلات<br />واللي بيحب يشوف الامن المركزي وهو نازل يقفل الشوارع ويضرب الناس وعمال يلم الناس في البوكسات<br />والا اللي عايز الناس تعيش في امن وسلام<br />مين اللي مهووووس انا اللي مهووووس ولا اصحاب الصورة اللي فوق دي هما اللي عندهم هوس"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 20
subject = "الى الاخ مش مهم"
author = "محمد"
posted = "2007-12-02"
text = "يا مهووس...<br />كلامك بيأكدلي وجهة نظري فيك....<br />انت فعلاً عندك هوس وخلل في تفكيرك...وبرجح إنك عايش أو عشت في ظل ظروف إجتماعية و أسرية صعبة...<br />حاول تهدي أعصابك مقدار شهريين من غير إنترنت وتعليق في المواقع...وصدقني هترتاح وتريح دماغك ودماغنا من الهطل إلي إنت عمال تتحفنا بيه كل شويه...<br />ورجاء خلال الفترة دي إعرض نفسك على طبيب نفسي...يمكن يلاقي ليك حل...مع تأكدي من إن علاجك بأيدك إنت مش مش عند حد تاني...<br />إنت فعلاً مختل....يا مهبول ...المشكلة مش في قوة أو صحة الحديث النبوي يا بغل....المشكلة في دماغك وما تحويه من عقل عليل إختل ميزانه ...الحديث سواء كان صحيح أو غير صحيح مينفعش إستخدامه بالطرق الملتوية إلي عقلك المريض بيصورهالك...<br />روح إتعالج...أرجوك"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 21
subject = "تمثيلية فاشلة"
author = "مخرج مسرحى"
posted = "2007-12-02"
text = "الصورة اللى فوق بتقول انها تمثيلية هزلية فاشلة علشان يقبضوا على قيادات الاخوان زى المهندس الشاطر وخلافة من الاربعين المقبوض عليهم بتهمة تبييض الاموال او غسيل الاموال او اى همبكة بتقولها الحكومة<br />اولا فى الصورة بتوع العرض لابسين قناع اسود وهذا لبس القوات الخاصة بتاع الداخلية انما شباب الاخوان بيربطوا على قورتهم شريط اخضر مكتوب علية لا الاة الا اللة محمد رسول اللة فهؤلاء ليسوا اخوان بالتاكيد<br />ثانيا قد يسأل سائل طيب الحكومة قبضت على الشاطر واللى معاة علشان عندهم شركات وفلوس ومشكوك فى مصدرها وهذا جميل عند رجل الشارع - لكن رجل الشارع بيسأل ايضا الفلوس والملايين اللى عند ولاد صفوت الشريف وولاد الشاذلى وولاد الرئيس منين مصدرها<br />تجارة حرة والا هدايا لهم من دول الخليج والا اية بالضبط<br />القانون يجب ان يطبق على الجميع<br />قانون من اين لك هذا ؟<br />انما ينطبق على الشاطر وما ينطبقش على سواريس لية<br />العملية فيها تخبط<br />ومحاكمة الشاطر ستكون تمهيدا لمحاكمات اخرى<br />وربنا يستر<br />فالكل رجلة فى الخية ودى احنا قاعدين نتفرج على امور المسخرة"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

[[comments]]
order = 22
subject = "الى الجاهل الي فوق"
posted = "2007-12-02"
text = "ما انا قلتلك يا جاهل روح للدكتور احمد عمر هاشم يعلمك ايه معنة الحديث يا غبي يا احمق<br />وخلي بالك الاخوان المسلمين كلهم ناس جهله زيك<br />حتى المرشد العام بتاعك عارف كان بيشتغل ايه مدرس العاب المرشد بتاعك خريج معهد التربية الرياضية<br />يعني جاهل زيك تمام ولانه جاهل قعد عشرين سنه في السجن هو نفسه مش عارف دخل السجن ليه<br />اما اعلماء الكبار اللي امثال الشيخ الشعراوي فسر القران في 20 سنه وافاد الامة الاسلامية كلها<br />روح يا ابني الله يسهلك"
archived = "2007-12-03"
capture_url = "https://web.archive.org/web/20071203172129/http://masr.20at.com:80/newArticle.php?sid=12607"

