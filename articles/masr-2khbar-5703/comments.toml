[[comments]]
order = 1
subject = "عايزين يبقوا مواطنين"
author = "أحمد المصري"
posted = "2007-05-03"
text = "يا أخت نهى كل الحكاية إنهم عايزين يبقو مواطنين و لو مواطنين درجة تالتة زى معظم الشعب المصري مسلمين و أقباط و نوبيين و ... و...<br />في ناس في مصر غيرك يا نهى و طبعا غير آل مبارك و عز الي بيجو فالتليفزيون من حقهم يعيشوا زيك."
archived = "2010-03-14"
