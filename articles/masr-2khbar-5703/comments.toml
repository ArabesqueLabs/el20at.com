[[comments]]
order = 2
subject = "انا مش بنت وزير وبرضه مش بنت غفير"
author = "نهى"
posted = "2007-05-03"
text = "انا اتفهمت غلط خالص على فكره يا احمد يا مصرى انا من الشعب اللى انت بتتكلم عنه انا مش بنت وزير او رجل اعمال انا عايشه نفس مشاكلكوااا ويمكن اكتر بس الحمد لله عندى حاجه اسمها الرضا وبقول حسبى الله ونعم الوكيل دا اللى فى ايدينا يا ريت تكون عرفتنى دلوقتى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "البدو والعودة الى الأضراب"
author = "مجهول"
posted = "2007-10-29"
text = "ياخت نهى انا من البدوووو انتى ما تعرفى ايش الى بيعملوه الحكومه فى الشعب البدوى<br />الحكومه تعامل بدو مصر مثل ا معاملت العراق للأكراااااااااد هذا الى اقدر اقوله لك<br />مافى واحد بدوى يمشى فى مشوار الا وهوا قلقان تعرفى من ايش من الحكومه<br />لو شافو بدوى يحزوه يقلون له<br />ادفع عشان تعدى ههههههههههه والله شئ عجيب الحكومه تشحت<br />من المواطنين كااااااااان الله فى عونا احنا ما بنشتكى غير لى الله<br />عشان الشكوه لغير الله مزله<br />وياريت الحكومه تعرف طبع البدوى ايش<br />وتحياتى للجميع بس انتى مش هتحسى غير لما تجلسى معا واحد بدوى وهو يحكى لك على كل شئ"
archived = "2010-03-14"
capture_url = ""
