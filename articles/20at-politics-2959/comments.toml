text = "بإذن الله ما بزداد هم حدا إلا شيعة فلسطين ومشعلي الفتنه فيها. واسأل الذي يتحكر لفتح السرقة ... اين الاموال التي اعترف هنية بإدخالها؟<br />واسأله عن الفلتان الأمني ... كم عدد ضحايا الفلتان في عهد فتح وكم عددها في عهد حماس؟<br />وحماس ما بدها تدفع رواتب كاملة لموطفي فتح بس قادره تدفع لمليشيا القتل خاصتها وفوقهم عيديات ... لماذا؟<br />اتسائل ... هل ينام آل صيا وآل هنية جياعاً؟"
