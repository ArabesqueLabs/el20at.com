text = "ازا انتخبت حد فأكيد مش حنتخب الحكومة اللى بتكفّر في الناس ولا اللى بتدفع مكافآت للى بطخ بإبن عمه واخوه وللى بقول نعيش عالزيت والزعتر وهو بنام وبطنه مليااان ولاكمان راح انتخب الحكومة الحرامية واللى ضيعت البلد صح كانت امشية حالنا بس بالمقابل هما ربحوا على حساب الشعب كتير وبالحالتين سواء فتح او حماس الضايع بيناتهم واللى تحت الرجلين حماس لزا انا بضم صوتى لصوت كل واحد بيفهم صوّت لانبل مناضل على ارض فلسطين وهو مروان البرغوثى وبدعى من كل قلبى انو تفرج عنه ولاد الكلب اليهود ويرجع لاهله وولاده ."
