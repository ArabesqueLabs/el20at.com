[[comments]]
order = 7
subject = "اصيل"
author = "فتحاوي"
text = "انا يا جماعة راح انتخب ، هل من المعقول انتخب ابن فتح،؟وهل انه صحيح ابن فتح راح يصير شريف ؟ مستحيل لانه ذنب الكلب اوعج دايما، انتخب واحد بحط ايده بايد اسرائيل، ولكم يا عمي هذول الفتحاويين انذال، انا عشت سنين بفتح كلهم بدهم يصيروا رؤوس، كلهم نور، عملونا السرقة، ضيعيوا المعنى الحقيقي للقضية الفلسطينية، صحيح حماس مش قادرة تدفع رواتبة كاملة، هذا لانها محاصرة، بس على الاقل شاركت الشعب همه، ان شاء الله ربنا بزود هموم الفتحاويين."
