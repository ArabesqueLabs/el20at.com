subject = "حماس؟"
author = "سيرانة"
text = "انا راح انتخب اللي كفرو الانتخابات ودخلوها<br />واللي شككو بنزاهتها قبل بدء فرز الاصوات ولما فازو صارت الانتخابات اشرف من الشرف<br />وراح انتخب اصحاب المليشيا السوداء<br />وراح انتخب اللي شفنا في عهدهم لجوع والفلتان الامنى والحرب الاهلية<br />وراح انتخب اللي كانو يبهدلو في البطالة المقنعة والفساد الاداري ولقيناهم حطو اكتر من الفي موظف معظمهم توجيهي وصف سابع بدرجة مدير C<br />انا راح انتخب اللي خلونا نشوف كيف الموظف الحمساوي بيقبض راتب والفتحاوي لاء<br />راح انتخب الحكومة العايشة في السماء ووعيها السياسي مازال جنين<br />طبعا راح انتخب حماس"
