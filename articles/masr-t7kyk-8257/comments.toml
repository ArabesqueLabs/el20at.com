[[comments]]
order = 1
subject = "بجد مش عارفة أقول ايه"
author = "واحدة مستفَزة"
posted = "2008-02-19"
text = "\"عمري ما هفكر في رسالة إلا لو ظلم كبير وقع عليا\"<br />أنت مش شايف ان في ظلم أكتر من انك لما تتخرج متلاقيش وظيفة و توصل لأربعين سنة من غير زواج!!!!!!!!<br />و ان كل الأكل مسرطن وحتى الهواء ملوث بالسحابة السوداء. حتى النتخب لما فاز رفعوا الأسعار عشان الناس ما تحتجش (ده لو احتجوا أساسا). بلاش ده حتى الناس بطلت علاج عشان الميزانية تكفى لآخر الشهر......<br />أنت مش شايف البلد رايحة فين ولا ايييييييييييييييييييييييييه.<br />بلاش حفترض انك ميسور الحال و انك مش حاسس أوى بالمشاكل. كمان 15 أو 20 سنة أبنك أو بنتك حيبقى بيلعن اليوم اللى اتولد فيه مصري و ده كل ده لأن سعادتك مش شايف ان فيه ظلم وقع عليك........<br />بجد كفايييييييييييييييييييييييييييييييييييييييييه يا ريت نفوق بقى من الغيبوبة."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "بجد مش عارفة أقول ايه 2"
author = "واحدة مستفَزة (مستفزة بالفاتحة"
posted = "2008-02-19"
text = "\"لو بعت رسالة للريس هأقوله فيها بحبك يا ريس، ومعجبة بالحرية اللى بيتمتع بيها الإعلام فى عهدك، بس للأسف للحرية دي سلبياتها.. وخير الأمور الوسط\".<br />ارجع و أقولك فعلا منتهى الحرية الأعلامية لما يحبسوا رؤساء التحرير لجرائد العارضة بسبب اشاعة وفاة الرئيس (و كأنه مُخَلد مثلا).<br />ياريت نفكر فى الكلام قبل ما نقوله....."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "رسالة لمين - ضحكتنى"
author = "غتت حبتين"
posted = "2008-02-19"
text = "بلدياتى من اهلى فى الصعيد قاعد وماسك ورقة وقلم<br />فسألة ابنة<br />بتعمل اية يا والدى ؟<br />رد علية بلدياتى<br />ها اكتب رسالة لعمك<br />فقال الابن<br />ولكنك لا تعرف الكتابة<br />فرد بلدياتى<br />طيب هو عمك بيعرف يقرأ يا ناصح<br />فية نعم حرية اعلام وفية كتابات بتعارض - انما كلة كلام فى الهواء - لتفريغ الشحنة النفسية عند الناس لانهم لو لم يتكلموا ويشتموا هيطقوا هينفجروا - انما اللى فوق محدش بيقرأ حاجة ولا بيشوف حاجة - عايشين فى ابراج بعيد عن الشعب<br />بيخافوا من الشعب لا يغتالهم او يموتهم - الشعب هو العدو الاول لهم<br />القيادة السياسية لا تقرأ غير تقارير الامن وامن الدولة وان كلة تمام وعال العال وشوية اقلية حاقدة معظمهم من الاخوان هم اللى بيشنعوا على الحكم<br />حبايبى اكتبوا رسائلكم الى اللة<br />رسالة الى اللة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "اكتب رسالة مواساة الى فقير"
author = "حسن ابو السعود"
posted = "2008-02-20"
text = "فى احد المدارس الخاصة جدا بتوع اولاد الناس الكبار - طلب احد المدرسين من الطلبة اولاد الكبار جدا ان يكتبوا موضوع تعبير<br />عن الفقراء فى صعيد مصر<br />فكتب احد الطلبة ابن احدهم الموضوع التالى<br />كان فية واحد فقير جدا فى الصعيد -ومراتة فقيرة جدا - واولادة فقراء جدا - وسائق السيارة بتاعتهم فقير جدا - والطباخ بتاعهم فقير جدا والسفرجى بتاعهم مسكين ورئيس الخدم عجوز وفقير والجناينى مسكين وبواب الفيلا مسكين<br />وكلهم فقراء ومساكين<br />نعم<br />هذا هو الفقير فى نظرهم عندة طباخ وسفرجى وسواق<br />منين شافوا الفقراء<br />كيف يحسون بالغلاء الذى يطحن الناس<br />والذين يعيشون من غير عشاء<br />هل هو زمن المماليك عاد من تانى بالمجاعات والاوبئة"
archived = "2010-03-14"
capture_url = ""
