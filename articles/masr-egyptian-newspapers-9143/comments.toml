[[comments]]
order = 8
subject = "كي نكون موضوعيين"
author = "علا"
posted = "2008-09-15"
text = "الاخ الاستاذ نبيل شرف الدين المحترم تحية طيبة و بعد<br />هناك -في ما اعلم- فرق بين الداعية و عالم الدين<br />شروط عالم الدين هي ماذكرت من دراسة منهجية لانه في اخر الامر سيفتي بالحلال و الحرام اي انه موقع عن رب العالمين كما ذكر ابن القيم في كتابه \\\"اعلام الموقعين عن رب العالمين\\\" اما الدعوة فنحن مندوبون اليها بامر الاية\\\"يايها النبي بلغ ما أنزل اليك من ربك\\\" و لحديث الرسول (ص) : \\\"بلغوا عني و لو اية\\\" المهم ليس شخص الداعية و انما المهم محتوي ما يقول و ما يدعوا اليه<br />و ليس مطلوبا منه الافتاء بل يحرم عليه فان اتفق ما يدعوا اليه و ما يدرس في معاهد الاسلام العريقة فلا اثم عليه<br />فما الذي خالف فيه معز مسعود و غيره من الدعاة العلوم الشرعية التي تدرس في الازهر الشريف؟"
archived = "2010-03-14"
capture_url = ""
