[[comments]]
order = 2
subject = "السلام عليكم"
author = "مصراوى"
posted = "2008-05-23"
text = "احترم وجهة نظر الجميع ولكن ارى ان اى مسلم ينبغى عليه ان يدعو الى الاسلام بالقدر الذى يعرفه ولايجب ان يكون من شيوخ الازهر او ممن يحفظون البخارى ومسلم ...<br />فأبو بكر الصديق ومع اول يوم فى الدعوة اسلم على يديه 6 من كبار الصحابة مع انه كان لايعلم من الاسلام الا قليل القليل.<br />الرسول صلى الله عليه وسلم يقول \"بلغوا عنى ولو اية\" كما يقول الله تعالى \"ومن أحسن قولا ممن دعا إلى الله...\".<br />وليس هناك عمل اسمه\"الدعوة\" بل من حق كل مسلم ان يكون داعيا بقدر ماعنده من علم.<br />ولا أرى اى سوءة فى ان ينزل الداعى الى الله بلغته وفكره الى مستوى المستمعين لو كان فى ذلك مصلحة للدعوة<br />يقول تعالى \"وماأرسلنا من رسول إلا بلسان قومه ليبين لهم\"...<br />فمستوى وعقلية الناس هذه الايام تفرض على الداعى ان يتحدث بلغتهم بعيدا عن التقعر او الطريقة الرسمية فى عرض الدين."
archived = "2010-03-14"
capture_url = ""

