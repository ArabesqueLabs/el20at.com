text = "واضح ان الدافع لكتابة المقال لا يخرج عن كونه مجرد \\\"حسد\\\" لهؤلاء الشباب الذين وصلوا الى قلوب الناس و إلى الأضواء.. بينما كاتب المقال.. -و اللي مش هانناقشه بنفس المنطق و نقول له ان بر ضه الصحافة بقت مهنة من لا مهنة له- يتمنى يطلع في أي برنامج في الفضائيات.. انشالله حتى يطلع يقول :\\\"تششششششششششششششششششش\\\".."
