subject = "نبيل شرف الدين كلب من كلاب اقباط المهجر"
author = "فاهم الاقباط"
posted = "2008-05-24"
text = "نبيل شرف الدين اتعرفت عليه ككاتب في موقع اقباط الولايات المتحدة وموقع الاقباط متحدون بتاع الكلب عدلي ابادير<br />انت راجل مسيحي مالك ومال الدين الاسلامي دعاه ولا مش دعاه دي مشكلتها احنا<br />بس اللي انا مش فاهمه انت بتتكلم عربي واهه وبتكتب بالعربي وانجيلك بالعربي ممكن افهم انت قبطي ليه يا روح امك"
