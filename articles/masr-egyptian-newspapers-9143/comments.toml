text = "طب هو راجل مسيحى مال امه بالدعاة الجدد ولا الدعوة الاسلامية مايروح يشوف المصايب اللى عنده فى دينه وفى كنيسته قبل مايتكلم....<br />جتكم نيله يااوساخ مليتوا البلد بس معلهش هييجى يوم ننضفها منك ومن امثالك ياعابد الصليب جزاء قلة ادبكم على الاسلام والمسلمين وتطاولكم على نبى الاسلام صلى الله عليه وسلم...<br />وسيعلم الذين ظلموا أى منقلب ينقلبون."
