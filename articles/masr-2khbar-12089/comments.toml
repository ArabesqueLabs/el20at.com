author = "المعلم مصطفى"
posted = "2009-05-17"
text = "بما انى معلم كبير فى البلد دى ودكانى معروف فى سوق البلح وبيعدى على قطع الغيار القديمة والاجزاء الخردة<br />فان مشى هذا الجرار لوحدة كدة مش مقبول<br />دى يا محترمين حكاية كدة عاملة زى حرق المخازن قبل الجرد او حريق مجلس الشورى<br />يعنى الحكاية دى بتخفى ورائها بلاوى<br />وطبعا الجرار ولع<br />ولما ييجى اجزائة عندى فى وكالة البلح خردة ها اعرف اية اللى وراء الحكاية<br />ممكن يكون عملاء حزب اللة حركوا القطار كدة<br />والا الحرس الثورى الايرانى عمل العملة السودة دى علشان اطماع فى المنطقة او فى الكوم الاحمر<br />على العموم امن الدولة هتستجوب القطار وستسجل اعترافاتة وتوزع على سفارات الدول<br />او ربما الجرار كان مسطول وشارب كام حجر حشيش غبارة استيراد حزب اللة من جنوب لبنان او ضارب بانجو"
archived = "2010-03-14"
