posted = "2009-05-17"
text = "سوء ادارة وحالة تسيب تسود الدولة من القمة الى القاع<br />قيادة الدولة ليس لها علاقة بالشعب ولكن كل اهتمامها فى حاجات وهمية ودور وهمى عايشة فية امثال مباحثات السلام وايضا حاجات هلامية مثل التهدئة ومحادثات الفصائل<br />كل الكلام دة لا يهم الشعب المصرى<br />انا لا يهمنى ان اصطلحت الفصائل او غرقت فى البحر<br />انا يهمنى الاقى وظيفة واكل رغيف عيش نظيف مش من قمح علف الحيوانات<br />يهمنى مستوى المعيشة بتاع الناس<br />انا لا يهمنى ايران عملت قنبلة ذرية او قنبلة بدنجان او استولت على شعوب المنطقة<br />انا يهمنى الناس الجوعى جوة مصر<br />الناس اللى بيموتوا فى الحوادث نتيجة نقص قطع الغيار والتسيب الادارى"
archived = "2010-03-14"
