subject = ""
author = "القطار الطائش"
posted = "2009-05-17"
text = "بيقول لك القطار كان واقف فى حظيرة الانتظار ومفيش فية سواق<br />وفجأة تلبسة جنى من عفاريت شمهورش الجبار تبع وزير المواصلات الجبار ابن منصور شيفرولية<br />قام الجن الملعون بتشغيل ماكينة الجرار وتعشيق السرعة الاولى هكذا بدون سائق - طبعا م ا هو عفريت ابن عفريت وجن مصور<br />ومشى القطار الطائش واثق الخطى بطلا يتبختر على موسيقى اتمخطرى يا حلوة يا زينة<br />اي واللة الاخبار بتقول كدة - القطار تحرك بدون سائق<br />ومشى القطار الطائش يستطلع احوال الرعية فكسر السيارات ومشى وحدة يشم نسيم الصباح العليل لمسافة 5 كيلو مترات<br />ويقال والعهدة على الراوى ان وزارة المواصلات ستدعوا لجنة صرف الجن من الهند لقراءة الاوردة وحرق البخور وعمل حجاب كبير فية تعاويذ شمهورش وتعليقة على مقدمة الجرار حتى لا يسير بمفردة مرة اخرى<br />وبسؤال الدكتور النفسى زعبولا صادق من جامعة القاهرة افاد ان كل هذا يعود لمرض الجرار النفسى واصابتة بمرض المشى اثناء النوم - خفف اللة عنا بلاء المرض<br />اما كبير الحمارين والعربجية فاقسم ان هذا الجرار ملعون وانة بيحرن كتير اثناء السير وانة بيعض ويرفس"
archived = "2010-03-14"
capture_url = ""

