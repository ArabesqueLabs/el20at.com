order = 0
subject = "اى وقف نارى واى تهدأة ومين اللى هايج وبنهدية  - كل"
author = "اكتب اسمك هنا"
posted = "2009-02-04"
text = "احنا هنفتح اكبر مصنع فى الشرق الاوسط لانتاج الفاليوم<br />لان دواء الفاليوم مفيد جدا للتهدأة<br />هذا اذا رضى احد ان يتناول اقراص التهدئة المصرية<br />وسلم لى على عبدة فاسوخة واحمد شراشيب"
archived = "2009-02-06"
