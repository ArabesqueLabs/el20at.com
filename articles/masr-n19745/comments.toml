text = "ما هى بقت هيصة ؟<br />واحد طلع مسدسة علشان يقتل اللى قدامة فا اللى قدمة قتلة الاول<br />واحد مأجور الحكومة للقتل والتانى ذو طبيعة اجرامية<br />يبقى القاتل والق4تيل فى النار وبئس القرار"
