text = "بعيد عن انك منافق و كداب ف مافيش داعى انك تشتم و تعمل فيها شيخ علشان اللى انت قولتو دة مش لايق على اللى قولتو ف الأول......أحب الأول أقولك انا مين ولونى مش مجبرة على كدة بس علشان أسبتلك أنكمتخلف و غبى.أولأ انا من اسكندرنية و متعلمة فى مدرسة أسلامية و أعرف فى دينى و حفظة القرأن اللى أنت متعرفش معن.و محجبة و متخرجة من أداب لغة عربية يعنى بفهم فىكل شى انت قولت ات البنات المصرية\"مش كلهم\"جهلة و عاهرات\".أحب أفهمك حاجة يا بتاع أنت يالى أسمك جيمس الكلبة اللى أنت بتيتكلم عنها دى أصلا هيا غلطانة انها رديت على غبى و رجعى زى حضرتك و أفتكر أنا رضيت عليك كدة لى؟.ولما تيتكلم على البنات المصرية أفتكر أنك أنت مصرى \"دة لو كنت عندك جنسية أو دين أصلا\"و لما تشتم أعرف أنك بتشتم بنات و أهل بلدك و المفروض بدل متشتم تغض بصركمش تقول\"حطو صور أجانب أحسن\".خلاصة القول أنك برضة معنكش أنتماء و جاهل و برَضة حيوان و سفية و بجد أسف لكل الناس اللى بتقرة التعليق دة لأن كنتش أتمنى أنى أغلط ف حد\"دة لو أعطبرنا أنك بنى أدم مش حيوان\"."
