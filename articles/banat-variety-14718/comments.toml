text = "ماعنديش كلام اقولهولك غير انك حقيرة بردك ماتدخليش كل البنات فى الحوار ومتعمميش لان فى بنات اشرف منك ومن اهلك ومتربيين صح على الادب والاخلاق انا على فكرة مثقف اكثر منك واعرف فى دنيتى اكثر مايعرف جميع اهلك ولو انا دخلت معاكى فى اى نقاش ثقافى او علمى هبينلك انك حشرة والحمد لله متدين غصب عن اهلك والحمد لله عندى نخوة والحمد لله ان اشكالك الواطية بعيدة عنى وبعدين هقولك حاجة اشكالى الا بتدعى للتدين والاحتشام هما دول او شوهوا صورة الاسلام يابتاعة كلية الاداب عجبى على زمن فيه الخسيس بيتشال فوق الراس والا عارف ربنا بينداس عجبى على زمن فيه الكلاب بقت صوتها اعلى من الاجراس على فكرة مش هسمح لنفسى انى اجادل مع متخلفة زيك ولاخر مرة يازبالة ياتربية زبالة ماتدخليش البنات كلها فى الحوار بينى وبينك ولمى نفسك وحاولى كدة تمسكى اعصابك ولا اقولك العباسية بيلموا فيها امثالك على فكرة مش علشان بقول راى ان اى واحدة معفنة زيك مالهاش حد يربيها تدخل وتهاجمنى وانتى اصلا شخصية متخلفة لانى كنت بتكلم مع واحدة وانتى دخلتى نفسك زى الصرصارة كدة فى الحوار علشان تتشاكلى لكن انا عندى حاجة اسمها راجون ممكن اريحك بها"
