text = "أسفة جدا لأن كلمتك بكلام أكبر من عقليتك التافهة دى أنا بجد بتأسفلك بس حضرتك يا متدين يا عاقل يا محترم أنا مغلطش فى أهلك.و بعدين أنت مشوفتش حجابى شكلو أية علشان تيتكلم.على العموم لأخر مرة هتقسفلك أنى مكنش عندى القدرة أنى أوصل لمستوى تفكيرك السطحى الدنئ دة بس حاول يكون أهتمامك ب حاجة أفضل من المواقع بتاعت البنات.....وبلاش تفتى فى الدين علشان أمثالك هم اللى مسوقين سمعت الدين بتعنا و من حيث أنى قليلت الأدب فأنا بشكرك على أدبك أنك غلط فالبنات كلهم قبل متغلط فيا و غلط ف بنات بلدك و أفتكر حضرتك انى غلط فيك علشان انت غلط فبنت معملتلكش حاجة.....أسفة لأخر مرة أنى أجهدت تفكيرك معايا علفاضى و ياريت تحاول تتعالج نفسين علشان أنت حالتك صعبة أوى و أسفة لكل اللى بيقرأ الكلام اللى أنا قولتة دة بس أنا زعلت أن فى كائن تافة كدة بيحقر من شأن كل البنات و كمان منافق و بيمثل أنو متدين و متربى و بيحمد ربة أنو من قرية....يلا لا عتب على من فقد عقلة"
