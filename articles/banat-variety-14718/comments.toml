text = "اول حاجة اقولهاك صدقينى انتى انسانة حقيرة وقذرة ومابتفهميش وزبالة اوك اكلمك بقا بالعقل الا الظاهر انه معدوم عندك باسف ان واحدة زيك خريجة كلية اسلامية وتانى حاجة انا عاوز اقولك الحمد لله انى من قرية ومابشوفش اهلى ولا جيرانى باللبس القزر الا بتلبسوه ولوكان الحجاب على بادى وبنطلون ده حجاب وتقولى انا محجبة انتى وغيرك ازاى حجاب على بنطلون وبادى وبعدين بتقولى حافظة القران ربنا يقويكى ويعينك احنا عالم جهلة يمكن تكونى افضل منى ممكن تكونى بسفاهتك وجهلك وقلة ادبك وعدم تربيتك احسن منى وممكن تكونى افضل من الا قولتى عليه متخلف وجاهل وسيس وغبى وحيوان بشكرك على قلة ادبك ومش بلومك بلوم الا رباكى قصدى الا ماعرفش يربيكى ورغم انى والحمد لله ماغلطش فى اى بنت محترمة متدينة وكل كلامى كنت بدافع عن التدين والمحجبات والحمد لله انا عند رايى ان المحجبات المتدينات الا عارفين ربنا على حق وليس تحجب ظاهرى بيسئ لللاسلام والمسلمين ولما انتقدت واحدة مابتتكلمش عربى رغم اننا كلنا عرب شتمتينى لالاسف المتخلفين الا زيك هما الا خلوا صورتنا سيئة وعادى بقا هوهوى كتير يامتحضرة لان الهوهوة منك بتريحك"
