text = "اسفة معلش نسيت حاجة يا بتاع النخوة انت النخوة أنك تحافظ على بلدك و عرضك و أهلك و مالك......مش تستعر منهم.و العالم الكلاب اللى أنت بتتكلم عنهم دول اللى بتقول أن أحنا بنقلدهم هيفضلو طول عمرهم كدة لأن مافيش راجل عدل فالبلدى يعرف يوقف لهم .ولا يقف لأختو علشان متلبسش اللبس اللى مش عاجبك دة.....ولا فى راجل برضة عندة نخوة يسيب أخوة بيتهد بيتة علشان عدوة يحمى نفسة و يدخل موقع مكتوب علية أنو للبنات فقط.....أتمنى انى أكون وصلتلك رسلتى و بدل متعمل راجل هنا و عندك نخوة روح أسترجل اللى بيسترجلو عليك و انت بتقول عليهم كلاب....لو لسة عندك كلام قولة بس يريت يكون بالعقل مش بالتفاهة"
