author = "الحكومه دلوقتى وقتها"
posted = "2009-12-26"
text = "الحكومه ..دلوقتى وقتها ..كل الشعوب بعدها ...لاعارفين ناخد من بلادنا فايده ...ولا نرجع حقها اللى اتنهب منها ..مبارك ونظيف اللى مسحوا ارضها ...لا خلو فيها خير لاهلها اللى عايشين فيها ... ولا حتى فكروا يفيدوا ولادها اللى طالعين منها ..الحكومه واكله شعبها ...شعارها ... الشعب فى خدمه الشرطه ...وحقك عمره ماهتاخده منها ...لا عمر واحد فينا ...هيفتح بقئه ولا هيهوب عندها ...عاملين زى الكتاكيت اللى فى علبه ...رجونا وطالعونا داخين منها .. لاعارفين نعترض عليها ..ولا نقولها عيب على الى طالع منها ..حقيقى الحكومه الوقت وقتها ... طالما الشعب مكبر دماغه ومتنازل عن حقها<br />ده اللى مخلينا منقدرش نطلب من الشرطه . حتى اذا الشرطه هتعمل كده<br />لان العيب مش فى الشرطه العيب فى شعبها اللى ساكت على حقها<br />اخوكم فى الله ( أحمد )<br />ونتمنى عصر سعيد ومبهر ان شاء الله<br />ابقوا قابلونى طبعا"
archived = "2010-03-14"
capture_url = ""

