text = "ياه نفسك فى ايه مره واحده انا بقى نفسى فى 3حاجات واللى همه اصعب 3 حاجات ممكن تتنفذ لمواطن مكتوب فى بطاته مصرى وهمه<br />انى حاصل على بيكارليوس تجاره بقالى 4 سنين وكل ما اقول ياشغل يقولك دورات خدت انجليزى من الجامعه الامريكيه واخدت اى سى دى ال فى الكومبيوتر وخدت صيانه وفى الاخر برده مفيش شغل لان اخر حاجه ما جبتهاش هيه الوسطه<br />وطبعا لو اشتغلت لقدر الله اكيد هتجوز البنت اللى مزنبها جمبى بقالها سنتين ويبقى كدا حققت تانى اصعب حاجه على حد مكتوب فى بطاقته مصرى<br />والتالته وبعد كدا لو اتحققو ال2 دول يبقى هيعش حياه كريمه ودى طبعا اصعب حاجه ممكن يوصلها اللى مكتوب فى بطاقته مصرى<br />يااااااااااااه الساعه بقت 8 الصبح اقوم انا بقى ادور على اول حلم يمكن الحكومه تعتق رقابتنا وتسيبنا لوجه الله"
