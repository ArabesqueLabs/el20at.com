text = "أنا نفسي أوي يدوا شقق للناس اللي ساكنة في المقابر<br />أنا مش قادرة اتخيل الأطفال اللي ساكنة هناك . . بيبقي أقصي حلمهم نفسنا ميطلعلناش عفاريت<br />نفسي يهتموا بالأماكن اللي الناس عايشة فيها تحت خط الحياة مش الفقر<br />نفسي التعليم يتغير . . أهم شريحة هيه الأطفال اللي بتتولد . . يا نأسسهم صح . . يا نسيبهم ماشيين مع التيار<br />نفسي الاعلام يتغير . . مش حرام يا ناس اسمع الأطفال في الشارع بيغنوا الحنطور . . إعلام غبي . . مفروض يجيبوا حاجات متأثرش بالسلب ولا سبيس توون وام بي سي ثري والغباء اللي في أفلام الكارتون . . قتل وقوة تمحي وجود الخالق والعياذ بالله وحاجات استغفر الله العظيم<br />نفسي كمان نتنفس هوا نضيف وناكل أكل نضيف . . نفسي كل واحد مسول يبقي عارف كم المسئولية اللي عليه ويتأثر بالصحابة رضي الله عنهم<br />والله دول عايزين دروس في الدين . . علشان نعيشها صح<br />ما لما الدين يتنزع من القلب . . يعملوا أكتر من كده كمان<br />وبرضه مش يحشروا نفسهم في الدين . . كل يوم فتوي . . حسبي الله ونعم الوكيل<br />وأختمها بقي أحسن . . لا إله إلا الله"
