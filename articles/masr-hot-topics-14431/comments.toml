text = "انا نفسى حاجة بسيطة جدا ومش صعب تحقيقها أن القانون يسود ويطبق على الكبير قبل الصغير وأن يستغل طاقات الشباب بالعمل بدل ما كل شوية نقول الزيادة السكانية بتأكل التنمية واللة عيب مش هانوصل لعدد الصين والطاقة البشرية ثروة والفلاح المصرى كان بينجب أولاد كثيرة كى يعملون معة ويساعدونة فى الزراعة الآن أصبح العدد الزائد عالة على الحكومة أرفعو الأجرائات الحكومية المعقدة عند أنشاء أى سبيلة عمل أمام الشباب وأقبقو حاسبوهم لما يكسبو مش تموتوهم بكثرة الأجرائات والرتوين ولو عايزين مساعدة بجد لكى تكون بالدنا أحسن بالد فى العالم أستطلعو الرئى الشباب وطموحاتهم وأحلامهم وسدقونى عندهم الكثير ولو من غير ما تنفق الدولة عليهم شئ ولكن فكو العوائق التى تعوق حركتهم واللة الموفق يارب حد يسمع ويعقل وشكر لمن ساهم فى طرح الفكرة والموضوع مصر بخير وشبابها بخير والحكومة بخير بس مترحموناش وسيبو رحمة ربنا تنزل علينا من غير عوائق"
