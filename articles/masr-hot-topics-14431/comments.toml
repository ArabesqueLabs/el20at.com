text = "يا جماعه والله الحكومه واحدها مش حتقدر تعمل حاجه بصو للدول التانيه تعداد سكانها ازاى الصين مثلا من اكبر دول العالم فى تعداد السكان لاكن من اقل دول العالم فى البطاله عارفين ليه عشان كل انسان فيها مش بيعتمد على نفسه ويقول الحكومه الحكومه كل انسان حكومه نقسه يبعد وينتج ويخطط مش مستنى كل شئ من الحكومه واحد صاحبى بيقولى انا نفسى الحكومه تزوجنى عشان عايز اتزوج قلتله وماله وتخلفلك كمان ههههههههههههههههههههههه بعنى والله احنا ظالمين الحكومه بشكل كبير وبرضو الحكومه يا جماعه زى ما الحكومه ليها سلبيات اكيد ليا ايجابيات واكبر شئ انا بشكر الحكومه عليه هو حمايه اراضينا ووطننا الغالى يا جماعه اسرائيل والله بتتلكك عشان تدخل لمصر من اى زاويه لاكن الخمد لله معانا قائد مضرم ومحنك عارف ازاى يوقفهم عن حدهم"
