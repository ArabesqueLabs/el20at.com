text = "انا نفسى الجنيه يبقى أحسن من الدولار<br />انا نفسى كل المتغربين يرجعو يعمرو مصر<br />أنا نفسى كل إنسان يشتغل بكل مراحل التعليم الى درسها<br />أنا نفسى كل مصرى غنى يفكر يجوز أتنين غلبانين لبعض مش شرط يكونو فقراء بس مساكين<br />انا نفسى أحسن بطعم الحلال من بلدنا بجد<br />نفسى اعيش انا وامى وابويا وأخواتى زى الاول فى بيت واحد نحب بعض ونرجع أيام زمان<br />أنا نفسى كل واحد زى عز الدخيله ولا نجيب سويرس ولا حتى منصور شفرليه ولا حتى الرئيس محمد حسنى مبارك يجوز كل شهر 5 عرايس وعرسان ليه ميعملوش كدة<br />بدل محال الدنيا اتشقلب الاب بيغتصب بتوة والام بتمشى على حل شعرها والاخ بيشرب مخدرات والأخت بتقتل عشقها ليه كل دة ليه أخبرنا الوحشه أكبر من أخبرنا الحلوة ليه كل جمعه فى ورقه فى الجرنال تسمى صفحه الوفياااات ليه ما فيش صفحه السعداء<br />ليه ليه<br />يارب أسعد كل الناس على فكرة العيب مش فى الحكومه العيب فى التربيه ...<br />يارب كل شخص محتاج منك حاجه لبيهالو ومتحوجهوش لأى عبد من عبادك انت منفذ كل شىء"
