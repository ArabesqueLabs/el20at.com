posted = "2009-12-29"
text = "انا عن نفسى نفسى الحكومة تعبر عن فكر مصر وعن بلدنا<br />زهقنا من الشباب اللى عاوز يهاجر بره بلده عشان فاكر ان مصر هية الحكومة<br />ومعاهم حق<br />لان لو الحكومة بتعبر عن مصر كانت مصر دى بقيت احسن دوله فى العالم كله<br />مكانش بقى فيها الحرامية والفساد والناس اللى بتتاجر بشعبها وباساسيتهم<br />ياجماعة الحكومة بتاعتنا بقيت مش عندها وقت تفكر فى مصر<br />بقيت حكومة الاقطاعيين ورجال الاعمال<br />كل حاجة للرفاهية وبس<br />اتمنى لدى تتغير<br />لانها احسن بلد فى الدنيا<br />نفسي المصرى يرجع لمكانته وهيبته بين العالم كله<br />واساله الملك حسين عن الضفادع البشريه بتاعة ايلات<br />والدبابات اللى اخدها السادات من ليبيا لمجرد انهم اهانوا مصر<br />ولا المياه فى السودان واللى حصل عشانها فى السودان واثيوبيا<br />يا جماعة زمان كانت مصر دولة وحكومة لكن دلوقتى مصر الدوله ، البلد ، الاصاله ، التاريخ بقوا لعبة فى ايد الحكومة<br />حسبى اللــــــــــــــه ونعم الوكيل"
