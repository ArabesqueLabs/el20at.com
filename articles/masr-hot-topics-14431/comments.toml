text = "انا بحب بلدي جدا جدا وكمان انا بحط نفسي مكان الحكومه في كل شيئ يعني حكومتنا معتدله ذيها ذي اي رب بيت ما يقدرش يحقق كل احتياجات البيت بتاعه, لكن انا نفسي جدا ان الحكومه تنظر للمتعثرين في السداد و اللي عندهم مشاكل في سداد القروض و المديونيات الصغيره و المتوسطه لاقل من 100000 جنيه بعين الرافه و المسانده لهم علي البنوك الاجنبيه المفتريه التي وجدت في مصر في الفتره الاخيره و التي تدبح المواطن المصري في الفؤاد و طبعا كلنا عارفين ان الناس بتاخد قروض عشان تعينها علي المعيشه او حتي لا ترمي كل مشاكلها علي الحكومه , فارجوا مساعده اصحاب القروض المتعثرين في السداد لان الدين هم باليل و مذله بالنهار ,وبالذات سيتي بنك الحرامي الذي نتمني ان تغلق كل فروعه في مصر رافه بالمصرين اشكركم"
