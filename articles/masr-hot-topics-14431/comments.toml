text = "كفاية بقه شعبنا الغلبان الغلبان غلبان مين بس مبقاش فى حد غلبان فى البلد دى غير نسبة قليلة جدا متتعداش 3%<br />وثانيا احنا لو نستاهل اكتر من كده كان ربنا ادانا لازم نجتهد علشان نوصل<br />عارف ان فى حاجات كتير غلط بس بطلوا ترموا كل حاجه على الحكومة والحزب الحاكم<br />يا جدعااااااااااااااااان اللى وراه عيلين مش لاقي يوكلهم مابالكم باللى وراه 100 مليون<br />وبطلوا تسمعوا كلام الناس اللى بتحط الاسلام واجهة وهما بيخربوا الدنيا بافعالهم ومصالحهم<br />عموما بتمني الشفافية فى كل شيىء من غير نفاق ووساطة وربنا يهدينا على بعض وبس عارف ان فى ناس كتير هتهاجمنى بس خلاص مش مشكلة مش هقري الردود"
