posted = "2009-12-25"
text = "انا مش بحلم بمستحيل<br />ولا بتمنى شيئ غريب<br />انا كل طلبي اللى بتمنا بجد أن الحكومه تحققه<br />أن يكون كل مسؤل فاتح بابه لينا<br />ويسمع شكوانا<br />وينصفنا على اى أنسان مهما كان وضعه<br />لأن احنا ملناش أى كرامه أمام أى موظف أو ضابط شرطه وبالأخص ضباط الشرطه<br />لو كل رتبه كبيره في الشرطه تفتح ببها وتنصف كل مظلوم ونعامل بعض على اننا بنى ادمين<br />ويصحا فينا الضمير وكل أمين شرطه شاف شغله بما يرضى الله مش العبد<br />وكل ضابط حكم بالعدل زى ما أقسم على كده<br />ولو الحكومه ترحمنا من الاتاوه اللى بندفعها في كل مكان وأقصد بذلك غرامات المرور<br />وفي أقسام الشرطه<br />اللهم أنى لا أسألك ردا\" لقضائك ولكني أسألك لطفك فيه<br />فأنت اللطيف وأنت الحكم العدل<br />فا يا من سميت نفسك اللطيف الرحيم<br />أسالك أن تلطف بنا و ترحمنا مما نحن فيه فنحن في حماك يا رب العالمين"
