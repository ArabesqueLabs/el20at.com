text = "وكأن مصر دولة مؤسسات !! وعلى فكرة الحكومات المصرية وخصوصا الاخيرة منها فيها كفاءات محترمة وتريد الاصلاح بحق ولكن ...<br />الحكومة المصرية غلبانة ومغلوبة على امرها ..الدولة كلها بكلها وكليلها تقاد من طرف شخص واحد فقط هو الرئيس .. والله لو اتفقت الحكومة والبرلمان والمجالس المحلية ومجلس الشورى على امر لا يقبله الرئيس لن يتم .. امال هو اللي احنا فيه من شوية ...<br />كيف تقاد امة عظيمة بهذا الحجم من قبل شخص واحد .. فحتى لو كان مخلصا كل الاخلاص فإنه لن يستطيع تحمل هذا العبء منفردا ... ولكنها المكابرة ."
