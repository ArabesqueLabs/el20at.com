text = "زي ما الحكومة بردو بتغلط وبتنهب في البلد الشعب بيعمل حاجة اوسخ من كدا اولا شعب عبيط وهفئ طب والنبي ازاي يتعمل قانون ضرائب العقارات والناس قاعدة ساكتة ولا في اي حاجة ولا مظاهرات ولا وقفة من الشعب ولا انقلاب ضدالحكومة .<br />الحكومة اتنصب عليها في ارض طابا الي باعوها ب 990 الف لواحد اسرائيلي وجيه يدخل اليهود يعيشوا فيها طبعا مصر قاللتلو لآ تعرفوا بعها بكام 400 مليون .<br />وغير الحوار التاني بتاع مصر للطيران والمصحف الحكومة اتنصب عليها في الحوار دا مليارات المليارات عشان كدا مش لاقيين فلوس فقالوا نفشخ الشعب ونعمل ضرائب العقارات<br />والي ينرفزني الشعب ساكت وبيضحك ويقولك الحكومة بتعمل فينا ليه كدا ...! فوقوا بقى واصرخوا"
