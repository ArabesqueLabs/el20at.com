posted = "2009-12-25"
text = "والله العظيم انا دمعت بحرقه من الى قراته<br />هل كل الى دخل علق قرا كل التعليقات يا جماعه هو ايه الى بيحصل بالظبط<br />احنا ليه ساكتين ؟؟<br />كل واحد فى اتجاه الحكومه فى اتجاه والرئيس فى اتجاه والشعب فى اتجاه وكلا منا فى اتجاه ونغفل عن ما هو مهم واهم مصر (أم الدنيا)<br />القانون بيطبق لوجهة نظر معينه لا نعلمها و اعتقد ان دول المعانوه هيا التى تعلم<br />وعلى فكره محدش يلوم الحكومه ولا يلوم الزمن ولا يلوم اى احد<br />لو كل واحد مننا عرف ما عليه وله لكنا فى احسن حال<br />غياب الوعى والاهتمام بالتفاهات<br />مش عارف والله بجد انا فى حيره ما بعده احيانا ايضا يراودنى ان الحكومه ناويه تخلى الشعب يتلهى فى اى شى والسلام<br />يارب بحق هذه الايام الكريمه يزيح الغمه عن المجتمع<br />ويهدى اخلاقنا ويحسن احولنا بالله عليكم<br />ادعوا ربنا وكانوا خالصين معه فى الدعاء<br />اللهم امين"
