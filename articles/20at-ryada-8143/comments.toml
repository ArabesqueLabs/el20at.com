subject = "فيروز يا كنز تحلامى و مروحتى"
author = "نيفين نيفى نوفا"
posted = "2008-02-04"
text = "انا سمحت لنفسى اسرق كلمات نزار قبانى اللى قالهافى دمشقلما قال دمشق يا كنز احلامى و مروحتى<br />الست فيروز زهره لبنانيه و قنديل ف الضلمه و شتاء ف تشرين<br />الصوت اللى يدخل قلبك من غير استئذان و من غير ما يخبط و تفتح له و تشرب معاه فنجان قهوتك<br />الصوت اللى بتحتاجه و انت فرحان و و انت زعلان<br />صوت و لا سلاسل حرير..اه يا فيروز<br />يا جماعه مش عارفه اقول ايه على فيروز و هى اغلى و اعلى و اسمى من اى كلام<br />انا ادفع عمرى كله مقدم و كاش و اشوف المسرحيه لايف"
archived = "2010-03-14"
