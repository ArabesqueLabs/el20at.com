subject = "برنامج رائع"
author = "ام الثبت"
posted = "2008-04-21"
text = "هذا انتم يا العرب ،، اذا شفتوا برنامج ناجح مامشى على مزاجكم و حسب توقعاتكم حطيتوا فيه الف مسبة ومسبة .. حتى انتقاد موضوعي ما عندكم !!!<br />الحمد لله على كل حال ، الان لو شاعر المليون البرنامج الوحيد الذي احيى الشعر العربي بشكل قوي و عمل له حضور على الشاشات ، هذا البرنامج لو كان فاز فيه سعودي ما كانوا خوانا شككوا في مصداقيته ..<br />عموما مسابقة مميزة و قوية اتمنى لها الاستمرار لانها احيت الشعر النبطي بقوة و أكدت ان الساحة لا تخلو من شعراء بارعين لا نعرفهم في كل البلدان و امتعونا بشعرهم الذي لم يخلو من حكم و امثال و معلومات و بناء شعري راقي ..<br />تحياتي لكم .. هارد لك للسعودية و الف مبروك لقطر البيرق الثاني على التوالي :-) و الجاي ان شاء الله اماراتي قولوا امين"
archived = "2010-03-14"
