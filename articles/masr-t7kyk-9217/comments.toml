order = 0
subject = "كلة تمام يا افندم"
author = "افندم"
posted = "2008-05-29"
text = "بلادى بلادى بلادى<br />لك سخطى وامتعاضى<br />مصر يا ام الاذلة<br />البلاد نهباها شلة<br />والنظام بقى ريحتة جلة<br />هى دى ريحة بلادى<br />مصر يا ارض الجحيم<br />والعصا فى المستقيم<br />والكبير مهما يولول<br />ما فى منفذ من الاعادى"
