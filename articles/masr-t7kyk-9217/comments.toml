[[comments]]
order = 5
subject = "ومازال مسلسل تكميم الافوة والقمع بحجة فرض النظام"
author = "سحس كينوود"
posted = "2008-05-30"
text = "لو الحكومة واثقة من نفسها انها بتشتغل لمصلحة البلد لية خايفة ومسلطة قانون الطوارى على الناس لمدة29سنة قابلة للزيادة لتشريع النهب واللعب بمصير الاجيال القادمة بحجة تنمية البلد كل حاجة بقت واضحة ومكشوفة المتعلم وغيرالمتعلم فهم اللعبة البلد تتعرض لاشرس هجمة فى تاريخها الحديث هدفها سلب ونهب اى حاجة وفى اى وقت واى حد يتجراء انة يقول كلمة حق يتهم انة بيخطط لقلب نظام الحكم حكم اية اللى انت جاى تقول علية حكم القوى على الضعيف المظلوم دة الحكم ساب مصالح الناس وقعديشتغل لحسابة لغاية مادب الخلاف بينهم كل واحد عاوز اكتر من التانى وفى الحالة دى تتدخل الرئاسة وتقسم الشغل بينهم وكل واحد يعرف نصيبة ويشتغل بية وبكدة النواب والوزراء والخفراء والعمد وبتوع الامن والمباحث بيشتغلوا على حس الراجل الكبير وتنفيذ اى حاجة تتطلب منهم لتحقيق الهدف المنشود وهو السرقة بقوة القانون دون اعتبار لادمية الشعب الضايع اللى مش عارف يعمل اية مع الناس الهمج دول"
archived = "2010-03-14"
capture_url = ""

