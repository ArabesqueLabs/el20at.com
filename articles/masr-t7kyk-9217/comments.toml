[[comments]]
order = 1
subject = "كمان سنتين طوارى زيادة ياحكومة الضرب فى الميت حرام"
author = "توريث هباش ابوقلاية"
posted = "2008-05-29"
text = "العالم المتحضر نتاج ديمقراطية حقيقية ودول مؤسسات انما عندنا الديمقراطية وحقوق الانسان منتهكة لحد الالغاء التام ودة يرجع للسبب الاول وهو تزوير ارادة الشعب وبعد كدة يبدا تراكم وتفرع الفساد ليصل الى كل بقعة فى المحروسة ودة بينتج عنة تمرير وتفصيل النظام بما يتلائم ومصالح اعمدة النظام الشخصية والخاصة وطبعا دة انعكس على حالة الفقر المتزايدة والتخبط بخطط التنمية والنتيجة طبعا ازديادثروات المحظوظين واللى دخلوا الوزارة لزوم تفعيل البزنس بحماية النظام والرئيس القادم غصب عن عين ابونا وسلملى على الديمقراطية وحقوق الانسان"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "لا توجد اى خطة تنمية لاى مكان فى مصر بل توجد خطط ب"
author = "ابو طفاشة"
posted = "2008-05-29"
text = "لا توجد اى خطط لاى تنمية ايا كان نوعها فى مصر فى الثلاثين سنة الماضية<br />هو كل واحد فتح ورشة فى القطاع الخاص - ورشة دوكو او ورشة اصلاح سيارات فى حارة سد باسم الاسطى بلية نقول علية مصنع<br />البلد اتكسحت<br />مفيش حاجة او عمود فقرى لاقتصاد بلد<br />مفيش انتاج<br />بلد عايشة تقريبا على تحويلات سبعة مليون مصرى فى الخارج بيعولوا سبعة مليون اسرة اعالة مباشرة ثم بيفتحوا ابواب رزق لعائلات اخرى اللى بيبنى شقة وهكذا<br />والا كانت الناس ماتت فى الشوارع وعلى قارعة الطريق<br />الاقتصاد مبنى على التسول من الخارج والمساعدات<br />فى العشرين سنة الماضية لم تبنى الحكومة مدرسة واحدة واللى اتبنى للاسف الشديد اتبنى بواسطة المعونة الامريكية<br />معونة الامريكان هى اللى بنت شوية المدارس فى قرى مصر<br />نعم الحكومة عملت وصرفت على مليون عسكرى فى الامن المركزى ومباحث امن الدولة وكل انفاقها فى هذا الاتجاة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "فكرجديد بسنتين طوارى"
author = "كسرولة الغرام"
posted = "2008-05-30"
text = "لاحقوق انسان ولاحق مواطنة ولاعيش بكرامةكل حاجة فى البلد بقت قمة فى السواء والحكم واهلة بيتغنوا بالانجازات الجبارة والمهولة فى مجال الفنادق والمدن الساحلية والجديدة لغاية مبقت مصر ماخور وطبعا مئات المليارات الناتجة عن بيع الاراضى للمستثمرين وزيهم قيمة استثمارات الاجانب علشان يبنوا ويشتغلوا ويدفعوا ضرايب اوكى الفلوس دى راحت فين دى كفيلة بنقل مصر نقلة صناعية متطورة وفك الهم والغم على الشعب الصابر الغلبان كان يفترض انة يستثمرالعائد المهول من بيع مصر لبناء الصناعة المتطورة والتكنولوجيا فى كل محافظة ومدينة الناس مؤهلة بس مفيش توجة عند الحكومة انه مصر تستغل الطاقات الموجودة ووضع الشخص المناسب فى المكان المناسب الحكومة عاوزة الشعب يخدم على السياح والسياحة وهى شايفة انة صناعة السياحة احسن واهم بكتير من اى صناعة ودة جزء بسيط من اللى يخلى حقوق الانسان والحيوان والشجر والحجر ضايعة فى بلد يحكمها نظام فريد ومتفرد على مستوى العالم لاينافسةاحد سوى نفسة"
archived = "2010-03-14"
capture_url = ""

