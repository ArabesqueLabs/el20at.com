subject = "الحزب الوطنى او النووى ذوالطاقة المتجددة  بالفساد"
author = "احمد طز"
posted = "2008-05-30"
text = "كل ساعة وكل يوم يفاجئنا الحزب الوثنى بقررات القصدمنها الامعان فى الاذلال لغاية مبقى العالم يدافع عننا ممثلا بمنظمات الامم المتحدة ومنظمات حقوق الانسان والمومياء الكبير فى اخر ايامة الى هلاك ان شاءاللة والوريث وشلتة شغالين توزيع ادوار وترتيب الامور بحيث انة كل حاجة تعدى بهدوءومن غير اى قلق داخلى اوخارجى لتستمرالطاقة المتجددة اوالنووية بتنفيذمالم يتم تنفيذة فى عصرالمومياء وتعيش مصر من عصر الى عصر فى اسوءاحوالها وسيبقى شعبها يتسول احتياجاتة الاساسية للعيش لعقود مقبلة"
