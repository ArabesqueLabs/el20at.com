[[comments]]
order = 0
subject = "ولماذا لا يحمى اليهود حدودهم"
author = "بالوظة"
posted = "2008-08-09"
text = "هل الحكومة الرشيدة مكلفة بحماية حدودنا والا حدود اسرائيل<br />وازاى الاريتيريين دخلوا البلد ودخلوا سيناء ووصلوا للحدود<br />هل هناك تعليمات من اسرائيل للحكومة المصرية بحراسة حدودها واطلاق النار على كل من يدخل اسرائيل وليس من يدخل مصر<br />هل قواتنا تعمل بالايجار لدى اسرائيل<br />نتلقى التعليمات من ليفنى<br />هل اصبحنا قزما امام اسرائيل وبنترعب منها<br />يا خوفى عليكى يا مصر يا مخروسة"
archived = "2010-03-14"
