[[comments]]
order = 1
subject = "محمية شرم الشيخ للبقر النادر"
author = "ابو على"
posted = "2008-08-10"
text = "على حسب اتفاقية فصل القوات وكامب ديفيد تتمركز كتيبة امريكية فى منطقة شرم الشيخ - كما ان شرم الشيخ قريبة من اكبر القواعد الجوية فى اسرائيل وتغطيها تماما وطبعا لا يمكن لاى قوات مصرية غير الامن ان تذهب الى الشرم ولا ان يطير فوقها طيران مصرى ومن هنا اجمع الجميع على جعلها مركز محمية للبقر الضاحك<br />حيث ان جوها حار جدا فى الصيف ليناسب البقر"
archived = "2010-03-14"
