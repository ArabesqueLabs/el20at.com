text = "انا عاشقة للتاريخ الفرعوني و دارسة له عن طريق الهواية بعد ان أنهيت دراستي الجامعية في المجال الذي قرره لى والدي و الآن أصبحت حرة لأدرس في المجال الذي كان حلم عمرى أن أخوضة و أعمل به و هو الآثار و تحديدا الآثار الفرعونية و رغم حزني لفدان هذا التمثال عن طريق الحيلة الرخيصة التي اتبعتها البعثة التي اكتشفتة في تهريبة و هي طريقة تليق بالعصابات و ليس بالعلماء إلا أنني يتنازعني أمران<br />الأول هو رغبتي باستعادتة و عودتة الى وطنة المشتاق مرة أخرى و أدعم الرائع مثلي الأعلى الدكتور زاهي حواس فيما يسعى الية<br />و الثاني هو ثقتي ان تمثال جلالة الملكة يحظى في ألمانيا بالإحترام و الإهتمام و الرعاية اللائقة به و التي لن توفرها له الحكومة المصرية و أنه حال عودتة الى مصر سيتحول من هذا السفير الهائل لمصر و الدعاية المجانية لآثارنا في الخارج الى مجرد رقم في سجلات المتحف و ربما تدهورت حالتة بالإهمال مما يدفعهم الى حجبة عن العرض للجمهور خوفا عليه من الإنهيار"
