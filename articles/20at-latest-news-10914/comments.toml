subject = "حتى اذا جاء وعد الاخرة جئنا بكم لفيفا"
author = "مش شاليط"
posted = "2009-01-09"
text = "المهم في الموضوع ان الصحافة وعلماء الدين والفنانين اللي هما بيمثلوا جهات الاعلام مش فاهمين حاجه<br />مش فاهمين الاية اللي فوق دي معناها ايه<br />مش فاهمين ان (لفيفا) دي يعني ان كل اليهود اللي في العالم حيجوا هذه المنطقة يعني 6 مليون جم وباقي 9 مليون جايين<br />والسبب ايه<br />انهم لما يتجمعوا كلهم في مكان واحد تجيهم ضربة من المسلمين ضربة واحدة<br />فالمفروض اننا نهيىء المسلمين لهذا ان فيه 9 مليون يهودي حيجوا"
