subject = "يااااااااااااا  محلا حياة العزوبية"
author = "هايدي"
posted = "2008-08-12"
text = "السلام عليكم .....ميرسي ميرسي ميرسي الك يا تامر الصمادي ....شو رايك انا دائما من اول المتابعين والمعلقين على مواضيعك الحلوه .........شو حلو هادا الموضوع ....وخاصة انو بتناول ارتفاع الاسعار ....بس.....اوعك يا تامر تتزوج ....خليك عزابي يا اخ ماانت شايف ارتفاع الاسعار شو نار ....هههههههههه...........ومو بس تامر لا انتو كلكن يا شباب ....ما تتزوجوا ابدا.. بس ادا مصرين على الزواج شو رأيكن نعمول مضاهرات على الصالونات ونكتب على اللافتات (يلا شباب يلا بنات بدنا نتزوج ....هجوم على الصالونات)ههههههههه...وهيك برخصولنا ....بس لازمنا الاتحاد شباب وبنات منشانكوا كرمال تتزوجوا ...انا بالنسبة الي نوووووووووو للزواج ....هههههههه<br />مع تحياتي :سنفورة بس كتير امورة"
