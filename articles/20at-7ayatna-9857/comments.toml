subject = "الى نااااااااااااااااصر(السخافة بانك تعلق على ردي"
author = "هايدي"
posted = "2008-08-13"
text = "انت اصلن غيران مني لاني مهضومة ودمي خفيف ورجائا ما تسب على طريقة تعليقي ...شوف حالك بعدين شوف غيرك(لا تنضر للناس بسوئتن فكلك سوءات وللناس اعيونو)ههههههههه ....حلو مو.....بعدين شو هاي انكشف امرك يا شومان ...عن جد ضحكتني بالله عليك تحكيلي شو الشي الي انكشف من امري .....ههههههههه...لك كلكن ما بتعنولي شي حتي حد يجي ويعلق علي ...وادا قصدك عن طريقة كلامي فهاد لانو ماما لبنانية الاصل ..(ائلب الطنجرة على تما بتطلع البنت لإما) وانت يا فصيح ما كتشفت شي.....وعلى فكرة انا هايدي شومان ...سنفورة ومو متلك مغرورة لا بالعكس انا كتير شطورة وامورة ..<br />مع تحياتي :هايدي شومان ...سنفورة بس كتير امورة.."
