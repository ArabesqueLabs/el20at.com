order = 0
subject = "تامر وشوقية شاهد على الإفلاس"
author = "محسن عبد الوهاب"
posted = "2008-06-19"
text = "مش عارف ازاي يكلموا عن ستكوم مسروق من أوله لأخره من ستكوم امريكاني اسمه dharma &greg والفرق الكبير بقة أن الأمريكاني أصل رغم التحفظ على نجاحه بس فين وفين<br />أحمد الفيشاوي أداء فاشل ومتكلف إلى أقصى درجة ومي كساب كارثة بكل معنى الكلمة وأهه رغم كل الفشل ده عمالهم بينتجوا جزء ثالث"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151036/http://masr.20at.com:80/newArticle.php?sid=16229"

[[comments]]
order = 1
subject = "الخطوة الأولى هي التقليد"
author = "LOLI"
posted = "2008-07-03"
text = "يا أستاذ محسن ممكن يكونوا بيقلدوا الستكوم اللي بتقول عليه ،بس في ناس كتير أعجبوا بالفكرة وضحكنا، صحيح مش طول الوقت بس ضحكنا وبعدين لو تامر وشوقية كان فشل مكنوش يعملوا منه جزء ثالث ومكنوش عملوا راجل وست ستات وأتوقع المزيد من هذه النوعية،،،،،، بس يارب نقلد الغرب في حاجات تانية كويسة"
archived = "2008-07-04"
capture_url = "https://web.archive.org/web/20080704083620/http://masr.20at.com:80/newArticle.php?sid=16229"

