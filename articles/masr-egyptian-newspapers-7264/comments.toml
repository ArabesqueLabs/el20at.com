text = "فعلا يا جماعه التقنيه الفنيه فى الصوره و التصوير و الاداء و الاخراج و السرد التاريخى ف المسلسل عاليه جدا و مش غريب انه ياخد اعلى الاصوات ف استفتاء اوربت و ان كان ياتى ف المرتبه التانيه _بالنسبالى _بعد سقف العالم<br />و مع انى بشاهد المللك فاروق تخاطيف واضح انه مسلسل جامد و كفايهالفنان الموهوب تيم الحسن علشان الواحد يشوف المسلسل و اكيد بعد رمضان نتابعه افضل<br />و نفسى برده اشوف دور صلاح عبد الله لان كل الناس بتتكلم عنه وفعلا مش قادره افهم امتناع التليفزيون عن عرضه فى حين ان مسلسلت هايفه كتير بتتذاع ..الموضوع شكله فيه انه"
