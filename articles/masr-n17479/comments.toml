[[comments]]
order = 0
subject = "واذا اراد ربك ان يدمر قرية"
author = "من الفسقة"
text = "هل القرأن يكذب ؟ كلا<br />الم يقل القران والشيخ امس فى شرحة فى الازهر كيف اذا اراد رب العباد ان يدمر قرية يامر مترفيها بالفسوق فيها ثم يدمرها تدميرا<br />امرنا مترفيها ففسقوا فيها فدمرناها تدميرا<br />ماذا فعل المترف طلعت مصطفى مع سوزان تميم ؟ اليس فسوق<br />وماذا فعل فاجر العبارة الذى قتل العباد فى قاع البحر وطلع براءاة<br />وماذا عن قتلة سعاد حسنى واشرف مروان<br />وماذا عن اكياس الدم الملوثة والمبيدات المسرطنة<br />وماذا عن تقديم فريد خميس رشوة نصف مليون لقاضى واستجوب امس<br />اليسوا كلهم من لجنة ما يسمى صبيان السياسات وهزل الانجال<br />اين السيد الرئيس<br />هل معتكف فى فندق مع السياح فى الشرم<br />ربنا ارفع عنا العذاب انا مؤمنون<br />اللهم لطفك<br />اللهم لطفك<br />واغفر للمسكين والضحايا الذين راحوا ضحية الاهمال والا مسئولية"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914210050/http://masr.20at.com:80/newArticle.php?sid=17479"

[[comments]]
order = 1
subject = "مصر اخدم نفسك بنفسك"
author = "ممدوح زكي زخاري جرجس يعقوب ـاسكندرية مصر"
text = "يا عم الحكومة ما بتقدمش اي خدمات<br />كل واحد يخدم نفسه بنفسه<br />خلاص انتهى عهد الكسكسي<br />معاك فلوس حتعيش ما عكس حتروح في ستين داهية"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914210050/http://masr.20at.com:80/newArticle.php?sid=17479"

[[comments]]
order = 2
subject = "كلاكيت ميت مرة (هنصور)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "قضاء اخف من قضاء<br />هية حكومة نظيف قادرة تجيب رغيف عيش<br />لمااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا<br />تجيب ليكم شقق؟<br />ما تصجوا بقى؟"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914210050/http://masr.20at.com:80/newArticle.php?sid=17479"
