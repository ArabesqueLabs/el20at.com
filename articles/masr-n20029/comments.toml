order = 0
subject = "أضرابات كل يوم"
author = "المصرى أفندى"
posted = "2009-02-18"
text = "الموضوع بعمق هو نتاج أحساس فئات كتير من الشعب أنه لا يوجد عدل فى البلد وبالتالى لا يوجد أنتماء وكل فئة بتدور على مصلحتها الفئوية. والحكومة أصبحت حكومة جباية فقط , تأخذ بأسرع ما بتدى , وأصبح تدخلها فى أى شىء تدخل عنيد وغبى ومؤذى , لا تسمع للرأى الأخر وكل وزير فاكر أنه بيفهم أحسن من الشعب. حتى أصحاب المعاشات قرفوهم فى عيشتهم. يجب أن نتأكد أنه لن ينصلح حال مصر ولن تتوقف معانات الناس ألى أن يسود العدل فى تشريع وتطبيق القوانين. ولن يتم ذلك ألا بتغير الأمخاخ الوسخة اللى بتحكمنا."
archived = "2009-02-20"
capture_url = "https://web.archive.org/web/20090220151205/http://masr.20at.com:80/newArticle.php?sid=20029"
