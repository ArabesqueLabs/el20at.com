[[comments]]
order = 2
subject = "الأخ ( واحد )"
author = "من السعودية"
posted = "2008-06-18"
text = "يا أخي ( واحد ) صاحب التعليق الأول ، أنا من السعودية ومحترفة أسواق ، وأحب أن أوضح أن أثمان الملابس في السعودية تختلف حسب نوعها ، فهناك النوع الرخيص الذي يباع في المحلات المخصصة لذوي الدخل المنخفض بالأسعار التي ذكرتها ولكن يعيبها أنها دون الجودة ، ولن تتحمل غسل ولبس ، وبالتالي هي خسارة لمن يبتاعها ، وهناك النوع المتوسط ، وتتراوح فيه البلوزة بين 150 و 400 ريال وهي من الماركات العالمية المعقولة ، ولكنها تعتبر ذات ثمن مرتفع للغالبية الذين يعانون من البطالة وتدني الأجور ، ويصرون على الظهور بمظهر لائق فمجتمعهم يفرض عليهم ذلك ، وهناك النوع الخاص بالـ vip وأسعاره كما ذكرت صاحبة المقال ، وربما تزيد .. لذا أنا أخالفك بتعميم الأسعار المذكورة ، فموجة الغلاء بذأت تفتك بنا ، وإن كانت معاناتنا أخف من معاناة أشقاءنا في الدول المجاورة ، ولكن أصدقكم القول لا أرى إطلاقا مبرر لوجود هذه المعاناة أصلا أو الاضطرار إلى تحملها ، وبلدنا يبيع برميل البترول بـ 115 دولار ، وعشان خاطر عيون أمريكا ومستر بوش نضخ المزيد من البراميل يوميا ، لنساعد الدول الصناعية .. أليس الأولى أن نساعد أنفسنا وإخواننا .."
archived = "2010-03-14"
capture_url = ""
