subject = "بلوزة ب 7300 جنية مصنوعة من فتلة دهب وفتلة فضة"
author = "واحد"
posted = "2008-06-15"
text = "البلد دى حصل فيها اية<br />دة اجرام<br />دا احنا عايشين فى وكر عصابات سرقة عينى عينك<br />البلوزة دى فى السعودية ب 50 ريال اى 70 جنية مصرى<br />والجزمة الصينى الحريمى فى مدن السعودية ب 20 الى 30 ريال بتنباع فى مصر ب 300 جنية<br />انا مش قادر استوعب اللى بيحصل فى بلدنا<br />فية احد ممكن يفهمنى - يا اما اشتم واقل ادبى واضيع ثواب العمرة"
