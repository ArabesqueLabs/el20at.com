subject = "غسيل اموال"
author = "مصراوى"
posted = "2008-06-16"
text = "محدش بيشترى طبعا<br />والى معاه يشترى بالمبلغ بيروح يشتريها من المانيا نفسها ويرجع (يمكن يكون اوفرله كمان......هاهاه)<br />امال ليييييه؟<br />عشان المحلات دى كلها غسيل اموال<br />محلات مفتوحة لشخصيات بتحقق ارباح من مصادر اخرى غير مشروعة<br />ولما الضرايب او المدعى العام او اى حد يقوله من لك هذا<br />يقول يا باشا المحل بتاعى فى سيتى ستارز ما بيبعش باقل من 7300 جنيه.....وباكسب!!!!!!!"
