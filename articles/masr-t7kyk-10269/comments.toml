text = "ما تروح ياواد يا صايع انت وهو تشوف مذكرتك ومستقبلك<br />سياسة ايه وانتخابات ايه ونيلة ايه<br />بلاش مسخرة وقلة ادب<br />ونوجه نداءنا للحكومة المصرية الفاشلة<br />انتخابات ايه اللي انتوا عمالين تعملوها يا حكومة صيع<br />انتوا دولة ملكية ديكتاتورية هتلرية لا تعترف بالراي الاخر<br />دولة يحكمها الجيش فقط<br />ليه بتضيعوا وقت الناس في الانتخابات والمسخرة دي وبتضيعوا فلوس الشعب<br />حرام عليكم بأه<br />كفاية كده خلاص الشعب المصري على وشك المجاعة حرام عليكم"
