[[comments]]
order = 1
subject = "أنا متفق معك أخ / مصري مخالف .. ولكن !!!"
author = "محمد نواف الحمدالله ..."
posted = "2008-02-18"
text = "كلامك كلعه صحيح وحقيقي بشأنه .. وليس عليه غبار .. وهذا أمرٌ مفروغ منه البتّه !<br />ولكن ! دعك من غنه كان .. وكان .. وكان !!! أخي إنها أفعالٌ ماضية .. أي إنها حدثت قديماً في عهده هو ومن كان مولوداً آنذاك هذا _ بشكلٍ عام _ .<br />ومن جهة اُخرى أرى بأن هذا الشخص .. ليس بطبيعي .. لديه قدرة هائلة عالية كبيرة ضخمة جداً في فن الأدب العربي وغيره من الآداب التي اطلّع عليها هذا الشخص .. هذا الشخص الذي له كتابات وروايات وحكايات وقصص وملاحم وبطولات أضف إلى ذلك كتبه التي نالت الشهرة العربية ( والعالمية أيضاً وبلا منازع ! ) .. أنا لا أدافع عنه نهائياً _ للتذكير فقط لاغير _ .<br />هذا كله بكف والكف الآخر أنه كان أعمى !!! يالها من معجرة بحق .. أخي تصور إنسانٌ أعمى وبهذا الكم الهائل من العلم والمعرفة ونحو ذلك .. يعني أنا مستغرب ومندهش شديد الإستغراب والإندهاش منه _ صراحة وبدون أية مجاملة _ وهذا رأي فيه .. بغض النظر والقطع عما فعله من مخالفات وانحرافات عديدة في حياته ! ويبقى الأمر سيّان ومثار جدل بين الأوساط الأدبية والفنية _ بشكل خاص _ .. والأوساط العربية _ بشكل عام _ .. وللمرة الثانية أعاود الكره لأقول لك بأنني لا أدافع عنه مطلقاً ولكن كتاباته وشخصيته تعجبني فقط لاغير ! وشكراً"
archived = "2010-03-14"
