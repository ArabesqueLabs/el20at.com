subject = "اعمى النظر اعمى القلب"
author = "مصرى مخالف"
text = "الانجليز والمستشرقين هم من قالوا علية عميد الادب العربى جزاءا على سبة للاسلام وتشكيكة فى قصص القران بعد كتابة الشعر الجاهلى<br />واذا كان هذا الاعمى عميدا للادب فماذا يكون العقاد وشوقى وحافظ ابراهيم وعلى الجندى واحمد باكثير وغيرهم من العمالقة<br />رجل خرج عن دينة وتزوج نصرانية ابنة قسيس فرنسى يكن كل الحقد للاسلام فاخرج قذارات فكرة فى كتابة الشعر الجاهلى<br />انا قرات كل كتبة السطحية التى تصيب بالتخلف كل من يقراها<br />وقرات كتب طة الحكيم وهناك فارق كبير<br />وطة حسين هو سلمان رشدى الذى تبناة الانجليز<br />فلا تخدعوا الاجيال<br />فا الرجل كان مجرد دجال صنعة الانجليز<br />هذا راى شخصى جدا وقد اكون مخطئا ولكن هذا ما احسة تجاة الرجل<br />وليغفر لى ولة اللة"
archived = "2007-11-01"
capture_url = "https://web.archive.org/web/20071101044134/http://masr.20at.com:80/newArticle.php?sid=12167"
