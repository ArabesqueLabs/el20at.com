subject = "حبابك عشرة في السودان"
author = "دينا"
posted = "2007-10-17"
text = "قليل هم من حاول أن يعرف السودان الحقيقي بعيد عن الصورة الظالمة التي يظهره بها الإعلام العربي و الغربي. شكرا لإنصافك للسودان و أتمنى أن تكون إستمتعت و إستفدت من زيارتك للسودان. مرحب بيكم في السودان و حبابكم عشرة على كل أراضيه"
