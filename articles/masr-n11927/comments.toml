text = "assalamu alikum ..<br />well, i read ur article by chance n believe me sudan is such a wonderful place..<br />maybe the place isnt yet v.well developed but they r goin fast on the curve ..<br />im studying in sudan .. sudanese r extremely friendly n welcoming ! the ppl r so nice n helpful ..<br />they care fo reachother and they never let feel that ur alone if ur a foreigner ..<br />they r still keepin on their awesome traditions and also have a well respected n recognized level of educational ..<br />maybe u 'll find some wicked ppl but that's also found in any other part of the world !!!<br />im not saying sudan is paradise .. its jst like everyother place in the world .. n if its happens that u had to live there; maybe ur going to have some hard time .. but after a while its will all seem ok and when time comes to go home u 'll find it real hard to say goodbye ..<br />when seeing somethin u should look to it both with ur heart n mind .."
