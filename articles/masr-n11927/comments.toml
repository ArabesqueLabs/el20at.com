[[comments]]
order = 4
subject = "ده كلام فاضي"
author = "العربي"
posted = "2007-10-22"
text = "مشكور يا اخي<br />بس الكلام اللي انت بتتكلمه ده كلام فاضي<br />انصحك بان ترحمنا من الهيافة والهباله دي<br />سودان ايه اللي بتتكلم عنه بمنتهي الشياكة والاناقة دي ؟؟؟؟؟؟؟ شكلك مش عايش معانا الايام دي<br />السوداني انسان لا يحب الا نفسه غالبا (هذا بينهم البعض) ناهيك عن كرهه الي الشعوب الاخري<br />اشعر وكأنك تسخر من السودان<br />الله يصلح حالنا جميعا"
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029011441/http://masr.20at.com:80/newArticle.php?sid=11927"

[[comments]]
order = 5
subject = "قال كلام فاضي قال"
author = "دينا"
posted = "2007-10-24"
text = "و الله يا أخ العربي أنا ما شايفة أي كلام فاضي غير كلامك ده. على أي أساس تتهم السوداني بإنه لا يحب إلا نفسه و بأننا نكره الشعوب الأخرى؟؟؟ لو بتتكلم عن أزمة الجنوب و دارفور فهي أزمات سياسية بين ناس كل همهم الثروة و السلطة و عشان يكسبوا دعم و مساعدة دولية لازم يظهروا بمظهر الضحية بالترويج لشئ يلفت أنظار الناس إليهم. و بعدين وريني أي بلد هذا الذي يخلو من حساسيات أو عنصرية بين بعض أفراد شعبه لكن لا يعني هذا إن الشعب في مجمله شعب أناني و لا يحب إلا نفسه. أما حكاية كرهنا للشعوب التانية برضو كلام معمم ما عنده أي معنى. السودانيين فتحوا بلدهم و بيوتهم و قلوبهم و إستقبلوا ناس من كافة أصقاع الأرض و أجناس كثيرة عايشة في السودان و يعاملون معاملة طيبة. و السودانيين برضو ضحوا بجزء من أرضهم و أغرقت بيوتهم و أراضيهم و آثارهم عشان تبنوا السد العالي. و السودانين برضو و منذ بداية أزمة فلسطين لم يتوقفوا عن مساندة الشعب الفلسطيني بالمال و المؤونة بالرغم من الظروف الإقتصادية و السياسية الصعبة. و السودانيين استقبلوا الإخوة الإثيوبيين و الإريتريين في عز أزمتهم و إختار الكثير منهم البقاء في السودان على الرجوع لبلادهم أو حتى الرحيل و غير كده كتير. يعني أرجو إنك تتحرى الموضوعية في كلامك بدل ما تطلق آراء مجحفة و غير دقيقة"
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029011441/http://masr.20at.com:80/newArticle.php?sid=11927"

[[comments]]
order = 6
subject = "السودان جميل لا جميلة"
author = "Omer ALSAYED"
posted = "2007-10-25"
text = "الشكر اجزله لكاتب المقال وهناك ملاحظة عامة وليست خاصة بمقاله فأهل السودان يذكرون السودان واستغرب لتأنيثه من قبل المصريين , اتمنى من الاخوة المصريين ان يعرفوا عن السودان قبل ان يتحدثوا عنه وللاسف حتى الساسين والعلماء والمختصين يهرفوا بمالا يعرفوا فهيكل مثلا عندما تحدث في قناة الجزيرة كان يبدو عليه ثقة الخبير العالم بينما هو يخلط الميرغني مع المهدي ويسوق مغالطات لايمكن لرجل الشارع البسيط ان يقع فيها وهذا الغرور ينسحب على كثير من الاخوة والاغرب اننا دائما عندما نلتقي الاخوة المصريين نفاجأ بجهلهم عن اقرب الاقطار اليهم والعكس تماما مع البريطانين مثلا الذين يدهشوك عن ما يعرفونه في تفاصيل التاريخ والجغرافيا والمجمتع السوداني, انصح اخواني بقليل من التواضع فإذا كانت مصر أم الدنيا فعلى الاقل ليست كل الدنيا \"ومن لم يهتم بأمور المسلمين فليس منهم\""
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029011441/http://masr.20at.com:80/newArticle.php?sid=11927"

