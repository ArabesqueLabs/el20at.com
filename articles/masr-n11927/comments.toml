subject = "ناس السودان حلوين"
author = "خريجة مشتاقه"
posted = "2007-12-15"
text = "اناخريجه من 3 شهور جيت السودان عشان الجامعة كنت حسب معلوماتي عنه متوقعة اني اعيش فيها ان شالله في عشة وجرب حياتي من غير ناس البيت<br />ماعايزة اطول عليكم واحكي قصة حياتي .حبيت السودان واتصدمت انو افكاري وتخيولاتي طلعت غلط .<br />في حتات كتيرة حلة بس عاوزين ليكم مرشد سياحي وضروري تتعلمو اللهجة السودانية .مامن النكات لكن من ناسا الحلوين (الله يدينا الجمال)<br />(كرهتكم صح )بس دا نقطة من بحر<br />داكلام من حنكوشة زي مايقولوا صحباتي<br />ومدلعة زي مايقولا اخوانى"
archived = "2008-02-14"
capture_url = "https://web.archive.org/web/20080214124015/http://masr.20at.com:80/newArticle.php?sid=11927"

[[comments]]
order = 11
subject = "ياااه على الذكريات"
author = "k.b"
posted = "2008-02-29"
text = "السلام عليكم<br />والله المقال عجبنى جدا..لانى أول مرة أشوف مصرى أو عربى بيتكلم كلام واعى عن السودان...ياريت كنت قريت المقال ده من 10 سنين كده .زودى كانت أول مرة أروح السودان<br />بس من ساعتها وهى فى قلبى<br />السودان بلد رائع واهله لن تجد مثلهم فى جميع الاقطار العربية..خدومين ويشيلوه الغريب فى عينيهم..وياما فى حكايات تتناقل وعشناها عن تعاونهم..وان صفت النية العنقريب بيشيل ميه<br />ذكرياتى بالسودان كانت أجمل سنين عمرى<br />أتمنى أرجع بس علشان اسلم على كل الناس الطيبين اللى قابلتهم هناك<br />تحياتى لكل السودانين ولاهل السودان الحبيب"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218013040/http://masr.20at.com:80/newArticle.php?sid=11927"

[[comments]]
order = 12
subject = "الجوع كافر ولا يتحمل"
author = "ابراهيم النوبي"
posted = "2008-07-01"
text = "هذا الكلام وإن بدا ايجابيا ولكنه غير صحيح في اكثره .. جميل ان يتكلم المصريون ايجابيا عنا .. يبدون انهم نووا التحبب الينا !! فامريكا صارت تنتج البترول من القمح وصعدت اسعار القمح وأخذ الجوع بتلالبيب القوم فهم تحملون كل شئ الا الجوع تداخل الجوع مع السياسة وتشابك ولحق بالامن والاستقرار !! إذن لا حل الا التوجه للسودان (الشقيق) ببركة الجوع الذي حل شمالنا صرنا اشقاء بعد ان كنا اشقياء .. اتجهت استثماراتهم نحونا ومعها الاستثمارات العربية الغافلة عنا بسببهم .. الآن ذكروا السودان !! كانوا يقفون ضد اي استثمار عربي في السودان عطلونا مشاريع التنمية عندنا سياستهم المثل السوداني القائل (فيها ولا اضفيها) ... المصريين على نوعين مثقف متعلم وآخر جاهل كلا النوعين يجهل السودان والشعب السوداني ويدعون معرفة السودان !! واتعجب من قناة الجزيرة ان تسأل المصريين وتستعين بهم في الشأن السوداني !! الجاهل المصري لا يشك اطلاقا انه افضل من السوداني يعني مصريته تعطيه الافضلية عن السوداني يكفي انه مصري ليكون سيد على السودانيين !! اما المصري المتعلم فهو يحتقر السودان والسودانيين .. انا شخصيا لا اثق في المصريين ولا اريد ان اراهم في بلادنا .. وانا اكره ان تجمعني المجامع بهم ولهذا السبب كنت ولازلت اطالب بانسحاب السودان من جامعة الدول العربية لا نريد اي ارتباط بالعرب التي تأتمر بمصر التي نعتقد انها سبب مشاكلنا .. نحن نفضل الارتباط بمصالحنا لا تخدعونا وتستغلوا عواطفنا .. اشقاء ! جيران ! عروبة ... الزمن زمن المصالح ليس العواطف .. ان السودان يفضل التعامل مع الشعوب التي تحترم نفسها والاخرين .. السودان في العهد الجديد اتجه للصين ماليزيا ايران وتركيا وسوريا .. اما هؤلاء القوم اولا عليهم ان يخرجوا من الاراضي السودانية في حلاليب وان يعترفوا بالحدود التاريخي بينا وهي مدينة اسوان هذه المدينة السودانية اسما وشعبا .. وان يردوا حقوقنا من مياه النيل منذ 1960وان يجلسوا مع دول حوض النيل بتواضع وعقد اتفاق جديد لمياه النيل بعد الغاء الاتفاقيات السابقة الظالمة لاسيما لتفاقية 1959.. ليعرف العرب جميعا ومصر خصوصا ان ليس لهم اي خصوصية في السودان .. وانهم مثلهم مثل غيرهم أن لم يكونوا اقل منهم ."
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218013040/http://masr.20at.com:80/newArticle.php?sid=11927"

[[comments]]
