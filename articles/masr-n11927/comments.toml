[[comments]]
order = 1
subject = "اجدع ناس"
author = "محبة لأهل السودان"
posted = "2007-10-17"
text = "السلام عليكم يا استاذ علي<br />ماشاء الله من اجمل المواضيع اللي قرأتها علي عشرينات<br />فعلا السودان جميلة جدا و اجمل بناسها ماشاء الله عليهم<br />انا كان ليا صديقة سودانية اتعرفت عليها في اليمن و كانت اقرب واحدة ليا بس للاسف اقترقنا لما رجعت مصر و بحاول اوصلها مش عارفة, يا ريت حد من اخواننا السودانيين في الخرطوم يساعدني<br />و كمان انا اتعرفت علي واحدة تانية هنا في امريكا و احنا لسه اصحاب .<br />طيبييييييييين جدا و متدينين برده و مثقفين كمان في امور دينهم و دنياهم<br />الف شكر علي المقال الرائع مرة تانية"
archived = "2007-10-19"
capture_url = "https://web.archive.org/web/20071019015016/http://masr.20at.com:80/newArticle.php?sid=11927"

