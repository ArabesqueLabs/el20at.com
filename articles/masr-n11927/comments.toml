subject = "شو حشر السوادنية المعفنين بالنص"
author = "محمد نواف الحمدالله ..."
posted = "2008-08-30"
text = "الله أكبر .. ولكو يا عالم . كل الناس تحكي إلاّ السودانية المعفنيين قوم ( الكشكوشة ) !<br />آآآآآآآآآآآآآآآآآآآآآآآآآي .. آآآآآآآآآآآآآآآآي .. آآآآآآآآآآآآآآ ي يازوووووووووووووووووووووووووووووووووووول .. داير عامل شنو !<br />آي دا قليك عصمان دا واحد كليب ابن كليب ! إنتا فين يا أبو بكر ؟؟؟ داير متخبي ورا العررررررررررريضه !<br />يازول بتاع الكرسيدا .. دا والله واحد شيطاااااان .. داير يقلك يازول عامل فيها خاطيب .. لكن !! ماهو خاطيب .. بس حركت مكاتب ييييييييييييييييييييييياي .. ههههههههههههههههههههههههههههههههههههههههههههه هع هع هع هع هع هع هع خخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخهههههههههههههههههههههههههههههه<br />والله السودانيين نهفه العاده . بكفي إنهم مساطيل وشغل نوم وتسطيل وهبل !<br />السوداني لما يصحى من النوم ع طول برد بنام !!!!!!! ( الطبع غلب التطبع ! )<br />خطرت على بالي نكته على السودانية .. بتقول : مرة واحد سوداني بإمتحان وهو بمحتن ولا القلم نزل من إيدو ووقع على الأرض .. قام حكا السوداني ( مشواااااااااااااااااااااااااااااااااااااااااااااااااااااررررررررررر , آآآي ، داير ليهو اسلم الورقة وأخلّص عمري !)<br />ههههههه وسلام يازول ياحبة بنادول !!!"
