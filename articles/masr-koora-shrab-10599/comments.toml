posted = "2008-11-25"
text = "والنتيجة ايه<br />النتيجة انه حيروح يسكن في الزمالك وحيبقى راجل مشهور في الدولة زي الذين سبقوه مصطفى عبده والخطيب وشوبير<br />والشعب المصري حيفضل زي ما هو حمار واهبل ويدفع فلوس للعيبة والممثلين وهو يفضل زي ما هو محل سر واقف على طابور العيش وطابور لحم الحمير والفراخ الميتة<br />مبروك يا ابو تريكه"
