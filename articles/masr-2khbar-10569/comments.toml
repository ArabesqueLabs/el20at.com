subject = "النقاب انتشر فى قريتى - لماذا ؟"
author = "فلاح مصرى"
posted = "2008-11-22"
text = "زمان كان لبس الفلاحات الجلابية والمنديل والطرحة والملس اللى هو دلوقتى اسمة العباية وكان لبس شرعى وعملى وحشمة وليس فية فتنة او اغراء لدرجة ان الشيخ الغزالى رحمة اللة كان بيتمنى ان السيدات فى المدن يتحشموا زى اهل الريف وقال خطبة فى اجتماع اللجنة التحضيرية للاتحاد الاشتراكى زمان عن ضرورة احتشام المرأة اما الشيخ المحلاوى بتاع مسجد سيدى بشر فوقف فى اللجنة التحضيرية للاتحاد الاشتراكى وفى حضور عبد الناصر وكان ايامها البنات والستات فى المدن بيلبسوا موضة المينى جيب وقف الشيخ المحلاوى وقال امام عبد الناصر وعلى الهواء - البنات والستات بييجوا يصلوا فى مسجد سيدى بشر وهى لابسة المينى جيب ولما تركع او تسجد الموضوع بتاعها بيبان من وراء - وقال - صلاة اية اللة يخرب بيوتكم<br />وضجت القاعة بالضحك وتدخل عبد الناصر وقال ان الشيخ بيمزح او بيرفة عنكم<br />وتانى يوم الاستاذ صلاح جاهين رسم كاريكاتير فى الاهرام مضمونة الشيخ الغزالى واقف وكلب بيجرة من الجبة وشوية نسوان رافعين الشباشب على الشيخ<br />وكانت معركة<br />اما الان وبدون اى دعوة او تحريض من احد الستان لم يتحجبوا فقط ولكن لبسوا النقاب<br />يا سلام احنا كنا فين ودلوقتى فين<br />اقول لكم<br />ان السبب هو انتشار الفقر وحالة القرف عند الناس والهروب من الحياة الدنيا لعدم الاستطاعة وعدم القدرة على المعيشة والاتجاة الى حياة الاخرة ونعيم الجنة<br />والا بماذا تفسر العرى ونوادى العراة فى مارينا والساحل الشمالى واللبس الفاضح والمسخرة على الشواطىء هناك<br />ناس عندها فلوس وعايشة حياتها وناس معندهاش وبتدارى وراء النقاب والحجاب<br />وطبعا ظهر الاسلام المتشدد<br />اذ منع الشباب اقامة مولد سيدى ابو العطية وهو ولى ولة مقام فى القرية ويقام لة مولد كل سنة فى القرية من مئات السنين ومنعوا حلقات الذكر والشيخ الصييت وقالوا ان هذا ليس فى الدين<br />بل تطورت الامور اكثر<br />ومنعوا الناس بعد صلاة العيد من الذهاب الى المقابر ومنعوا النساء من الذهاب الى المقابر<br />هناك صحوة اسلامية رهيبة وكان الاسلام ينتشر من جديد فى مصر<br />اسلام جديد نقى بعيد ىعن الخزعبلات<br />ومن يدرى<br />ربما فى رايىى ان كل هذا بسبب انتشار الفقر"
archived = "2010-03-14"
