[[comments]]
order = 4
subject = "بعيد عن الدين والاحاديث انا ادعو الى النقاب فهو ضر"
author = "طبيب مصرى"
posted = "2008-11-22"
text = "بعيدا عن اى محتوى دينى - ومن وجهة نظر شخصية بحتة - قد اكون مصيب او قد اكون مخطىء ولكنة مجرد رأى<br />فلنحافظ على النقاب وكان السيدات يلبسن فوق انوفهن فلتر او ماسك يمنع دخول الاتربة الدقيقة والدخان والتلوث الى الانف ومن ثم الى الرئتين<br />الجو الذى يعيش فية المصريون ملوث تماما ويعمل حساسية وضيق فى التنفس ومضار اخرى<br />ليكن النقاب عبارة عن ماسك او فلتر ترتدية السيدات لينقى لهم الهواء الذى يشمونة<br />النقاب لم يأتى اختراعة من فراغ او للعكننة على الرجال الذين يريدون مطالعة وجوة الجميلات ولكن فى الجو الصحراوى مثل اجواء بلادنا تتناثر الاتربة الدقيقة والرمال وتدخل الى الجهاز التنفسى<br />صدقونى طبيا انا اؤيد النقاب ويا ريت يرتدية الرجال ايضا حينما يكون الجو ملوثا او فية سحابة الدخان<br />رجاء كلامى هذا مجرد وجهة نظر وربما اكون مخطئا فسامحونى"
archived = "2010-03-14"
