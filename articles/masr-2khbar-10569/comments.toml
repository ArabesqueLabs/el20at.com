[[comments]]
order = 2
subject = "الأدلة النبوية الواضحة"
author = "منقول"
posted = "2008-11-22"
text = "يصر أنصار التيار الصحوي المتشدد<br />على تحريم كشف وجه المرأة<br />وكذلك تحريم اختلاطها مع الرجال في<br />الأماكن العامة ..<br />مع إن هذا يتنافى مع مع الأدلة النبوية الواضحة<br />والصريحة والتي تؤكد على إباحة كشف وجه<br />المرأة وكفيها من ناحية ..<br />وجواز اختلاطها بالرجال من ناحية أخرى كما<br />ذكر بعض العلماء ومنهم العلامة<br />المحدث الشيخ ناصر الدين الألباني<br />فيما يختص بحجاب المرأة ..<br />وماذكره فضيلة الشيخ الدكتور يوسف<br />القرضاوي في أكثر من مناسبة<br />فيما يتعلق بموضوع مخالطة الرجل للمرأة<br />وللعلم فإن كلمة الإختلاط كلمة<br />دخيلة على التثقافة الإسلامية<br />ولم ترد إطلاقاً في الكتاب أو في السنة الشريفة<br />ولا يخفى على الجميع<br />إن المرأة في عصر النبوة وعصر الصحابة<br />والتابعين<br />كانت تلتقي بالرجال في أماكن عامة<br />كثيرة ومناسبات دينية ودنيوية مختلفة ..<br />ولم يكن ذلك محرماً على وجه العموم<br />وقد كانت المرأة فيما سبق<br />تخرج للجهاد مع الرجال وتخالطهم<br />وتداوي جرحاهم وهو مارواه مسلم:<br />كان النبي صلى الله عليه وسلم<br />يغزو بالنساء فيسقين الماء ويداوين الجرحى<br />وقول المصطفى صلى الله عليه وسلم<br />خير صفوف الرجال<br />أولها وشرها آخرها<br />وخير صفوف النساء آخرها وشرها أولها<br />وهذا مايؤكد على أن المرأة كانت تختلط<br />بالرجال في المساجد لكن الأفضل لها<br />أن تكون في الصفوف الأخيرة<br />واليوم ومنذ أكثر 1400 سنة والمرأة<br />تختلط مع الرجال<br />في تأدية مناسك الحج والعمرة<br />ولو كان ذلك محرماً<br />لحرم من باب أولى في تلك الأماكن المقدسة !<br />وعن ابن عمر رضي الله عنهما قال:<br />إنْ كان الرجالُ والنساءُ<br />في زمنِ رسولِ الله صلّى الله عليه<br />وسلّم لَيتوضؤون جميعاً أخرجه البخاري<br />وعن أم الفضل بنت الحارث:<br />أن أناساً تماروا عندها يوم عرفة<br />في صوم النبي صلى الله عليه وسلم فقال<br />بعضهم: هو صائم وقال بعضهم : ليس بصائم<br />فأرسلت إليه بقدح لبن وهو واقف على بعيره<br />فشربه<br />وعن سهل بن سعد رضي الله عنهما قال:<br />لما عرس أبو أسيد الساعدي<br />دعا النبي صلى الله عليه وسلم<br />وأصحابه فما صنع لهم طعامًا ولا قربه إليهم<br />إلا امرأته أم أسيد<br />بلّت تمرات في تور من حجارة من الليل<br />فلما فرغ النبي صلى الله عليه وسلم من الطعام<br />أماثته له فسقته تتحفه بذلك<br />وحديث أنس بن مالك رضي الله عنه<br />أن جارًا لرسول الله صلى الله عليه وسلم<br />فارسيًا كان طيب المرق<br />فصنع لرسول الله صلى الله عليه وسلم<br />ثم جاء يدعوه فقال: ( وهذه ) لعائشة<br />فقال: لا فقال رسول الله<br />صلى الله عليه وسلم: ( لا )<br />فعاد يدعوه<br />فقال رسول الله صلى الله عليه وسلم : ( وهذه )<br />قال : لا<br />قال رسول الله صلى الله عليه وسلم : ( لا )<br />ثم عاد يدعوه<br />فقال رسول الله صلى الله عليه وسلم : ( وهذه )<br />قال: نعم في الثالثة<br />فقاما يتدافعان حتى أتيا منزله<br />أما فيما يتعلق بكشف وجه المرأة<br />فاللافت للنظر أن أكثر المطالبين بتغطية وجه<br />المرأة<br />يستندون إلى الآية الكريمة<br />( يدنين عليهن من جلابيبهن )<br />يقول الشيخ ناصر الدين الألباني<br />يصر المخالفون المتشددون على المرأة<br />على أن معنى { يدنين} يغطّيِن وجوههن !<br />وهو خلاف معنى أصل هذه الكلمة: \\\\\\\\\\\\\\\" الإدناء\\\\\\\\\\\\\\\"<br />ومعناها لغة التقريب كما ذكرت ذلك<br />وشرحته في الكتاب<br />وكما بينت أنه ليس نصّاً في تغطية الوجه<br />وأن على المخالفين أن يأتوا بما يرجِّح ما ذهبوا<br />إليه وذلك مما لم يفعلوا ولن يفعلوا<br />إلا الطعن على من خالفهم<br />ممن تبع سلف الأمة ومفسريهم وعلماءهم<br />وهذا هو الإمام الراغب الأصبهاني يقول في<br />المفردات<br />(دنا) الدنو: القرب ويقال : دانيت بين الأمرين<br />وأدنيت أحدهما من الآخر<br />ثم ذكر الآية وبذلك فسرها<br />ترجمان القرآن عبد الله بن عباس فيما صح عنه<br />فقال: \\\\\\\\\\\\\\\" تدني الجلباب إلى وجهها ولا تضرب به \\\\\\\\\\\\\\\"<br />وأضاف يزعم كثير من المخالفين المتشددين:<br />أن (الجلباب) المأمور به في آية الأحزاب هو<br />معنى<br />(الحجاب) المذكور في الآية الأخرى:<br />{ فاسألوهن من وراء حجاب} :<br />وهذا خلط عجيب حملهم عليه علمهم<br />بأن الآية الأولى لا دليل فيها على أن الوجه<br />والكفين عورة<br />بخلاف الأخرى فإن المرأة وهي في دارها<br />إذ إنها لا تكون عادة متجلببة ولا مختمرة فيها<br />فلا تبرز للسائل خلافاً لما يفعل بعضهن اليوم<br />لهن وقد نبَّه على هذا الفرق<br />شيخ الإسلام ابن تميمة<br />روى جابر بن عبد الله قال<br />شهدت مع رسول الله صلى الله عليه وسلم<br />الصلاة<br />يوم العيد فبدأ بالصلاة قبل الخطبة<br />بغير أذان ولا إقامة<br />ثم قام متوكئا على بلال<br />فأمر بتقوى الله وحث على طاعته ووعظ الناس<br />وذكرهم ثم مضى حتى أتى النساء<br />فوعظهن وذكرهن فقال :<br />تصدقن فإن أكثركن حطب جهنم<br />فقامت امرأة من سطة النساء أي : جالسة في<br />وسطهن سفعاء الخدين<br />( أي : فيهما تغير وسواد )<br />فقالت : لم يا رسول الله ؟<br />قال : لأنكن تكثرن الشكاة<br />وتكفرن العشير قال :<br />فجعلن يتصدقن من حليهن<br />يلقين في ثوب بلال من أقراطهن وخواتمهن<br />والشاهد هنا قوله \\\\\\\\\\\\\\\" من سطهن \\\\\\\\\\\\\\\" و \\\\\\\\\\\\\\\" سفعاء<br />الخدين \\\\\\\\\\\\\\\"<br />وفي الصحيح عن ابن عباس أيضا قال :<br />كانت امرأة تصلي خلف رسول الله صلى الله عليه وسلم<br />حسناء من أحسن الناس قال ابن عباس : لا<br />والله ما رأيت مثلها قط<br />فكان بعض القوم يتقدم حتى يكون في الصف الأول<br />لئلا يراها ويستأخر بعضهم حتى يكون في الصف المؤخر<br />فإذا ركع نظر من تحت إبطيه وجافى يديه<br />فأنزل الله تعالى :<br />( ولقد علمنا المستقدمين منكم ولقد علمنا المستأخرين )<br />ووجه الإستدلال هنا قول ابن عباس<br />حسناء من أحسن الناس مارأيت مثلها قط<br />خلاصة القول<br />إن القائلين بوجوب ستر المرأة لوجهها وكفيها وتحريم إختلاطها<br />ليس لديهم نص يدل على ذلك سواء من الكتاب<br />أو من السنة بل وليس معهم أثر واحد صحيح صريح عن السلف<br />يجب أتباعه اللهم بعض النصوص العامة أو المطلقة<br />والتي لا يمكن الإستدلال بها صراحة<br />على تحريم كشف وجه المرأة أو تحريم الإختلاط<br />وكذلك تفسيرهم لكلمة<br />( الخمار) و (الإدناء) و (الجلباب)<br />يخالف الأحاديث النبوية<br />والآثار السلفية والنصوص اللغوية"
archived = "2010-03-14"
