[[comments]]
order = 0
subject = "وقامت الثورة وانتهي زمن الباشوات"
text = "العنوان جزء من المقاله<br />خطأ<br />وقامت الثورة وابتدا مع الثورة زمن البشوات<br />بشوات من نوع جديد وفريد ليسوا كبشوات الملك نضاف محترمين من عائلات كبيرة<br />لا دي خالتك الثورة جابتلنا بشوات من زبالة البشر من قعر المجتمع من الحضيض وجم ركبوا على انفاس الشعب وما حدش عارف اي ثورة اللي حتمشيهم<br />كلم الباشا عدل يا كلب<br />اوم اجري الباشا بينادي عليك يله<br />معلش يا باشا سماح المرادي يا باشا<br />يا نشرة 9 ما تقوليش تاني وقامت الثورة الله يرضى عليكم ثورة ايه اللي قامت بس دا شوية ضباط صيع في الجيش المصري بترتيب بريطاني عملوا انقلاب عسكري وخربوا مصر خرابا يتعذر اصلاحه"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090413/http://masr.20at.com:80/newArticle.php?sid=11946"

[[comments]]
order = 1
subject = "ثورة مين اللى وصلتنا للى احنا فية"
author = "من الاوباش"
text = "الثورة خطفها شوية حرامية من الاخوان السذج<br />وركبوا البلد<br />واوصلتنا الى ان يحكمنا جنرالات متخلفين عقليا<br />وضاعت مصر<br />وقدامها مائة سنة علشان نصلح الدمار اللى عملة عصابة الاربعين حرامى<br />بتوع بيع البنوك والجامعات والشركات والمصانع<br />خربانة خربانة<br />خربانة"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090413/http://masr.20at.com:80/newArticle.php?sid=11946"
