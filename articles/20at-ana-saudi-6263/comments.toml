text = "أولا :اللي بيقول الحضارة الإسلامية ........... إياك تنسب الحضارة الإسلامية لبلدك<br />الحضارة الإسلامية قامت في الحجاز زي ما قامت في مصر ...... إنت مش عايش في الحجاز يا حمار إنت عايش في بلد مكانتش موجودة من 100 سنة .... بلد منسوبة لإسم مؤسسها .... طالما إنتو تنسب ليكو حضارة الإسلام ليه مسموهاش الدولة المحمدية؟؟؟؟ ولا الدولة الإسلامية؟؟؟؟ بدل السعودية ................. علي فكرة التاريخ ده إحنا مقلبينه مرة و اتنين و تلاتة إنتو معندكوش تاريخ أساسا<br />ثانيا: مصر الوحيدة اللي عندها جيش هزمت بيه إسرائيل ولا حتنكر دي كمان؟؟؟<br />إنتو عندكو جيش؟؟ لو أمريكا ضربتكو حتعملو أيه؟؟؟ (آسف أصلي نسيت إنكو عملا عند أمريكا)<br />و السادات أثبت للجميع إنه الوحيد اللي كان بيفهم لما راح و عمل إتفاقية سلام اللي دلوقتي حتلحسو طيز إسرائيل علشان تاخدو واحدة فيها نص شروطها أو حتي عشرها و مش عارفين<br />قول لي كده علي أي دولة تانية غير مصر أخدت حقها من إسرائيل (لا الإردن عرفت و لا سوريا و لا لبنان و طبعا فلسطين)<br />لو تعرفو ترجعو ليهم أرضهم ببركاتكم إعملوها"
