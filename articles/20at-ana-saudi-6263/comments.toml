subject = "السلام عليكم .."
author = "هيفاء"
posted = "2007-06-19"
text = "مساء الخير ..<br />كتكوتة .. كيف عرفتي ان السعوديين ينظرون للمصريين بهالمنظار .. هل عشتي بالسعودية أو سمعتي من أحد تعرفينة ..<br />أنا ماشفت أحد من قرايبي أو صديقاتي بينظروا هالنظرة .. عندي صديقتين مصريتين لما كنت بالمرحلة المتوسطة وحبيتهم وحبوني وكنا قراب من بعض .. عرفت مدرسات مصريات أحترمتهم و أحترموني عمري ما نظرت لهم هالنظره ..<br />و أظن مافية مصري أو عربي أشتغل أو تعب بالسعودية ألا و أخذ حقة .. و أظن بعد أن السعودية ساعدت في توظيف<br />الشباب المصري و ساعدتهم في مستقبلهم و فتح بيوتهم ..<br />الكل كان مستفيد مثل ما قلت قبل كذا مصالح مشتركة بين البلديين ..,<br />لية شاغلين أنفسكم بفلان كيف ما خذ فكرة عني أو كيف ينظر لي إذا كنت أنت أو أنتي عندك ثقة بنفسك<br />خلاص اللي ينظر لك هالنظره ترجع لة بالاخير صدقيني الدنيا دواره ماتبقى على حال ..,<br />الله يعزنا ولا يذلنا ..و الله يكفينا شر فتنة الحاقدين و اللي يبغون يفرقون بين الأخوان العرب ..,,<br />كل أنسان فعل خير راح يلقى خير وراح يحبونه الناس بغض النظر عن لونه او جنسيته او مكانته الماديه<br />وكل أنسان فعل شر راح ترجع له عواقب أفعاله مهما كان لابس ومهما كانت وظيفتة او جنسيته ..<br />عرفت ناس سيئين في حياتي من جنسيات مختلفة لكن أعرف أن هالأنسان مايمثل الا نفسه وما يمثل كل الناس ..<br />أنسوا هالأحقاد و فكروا كيف تعيشون بحياتكم متهنيين ومرتاحين وريحوا راسكم من هالتفاهات ..<br />تحياتي ..,,"
