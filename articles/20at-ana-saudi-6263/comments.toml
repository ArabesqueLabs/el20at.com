[[comments]]
order = 36
subject = "دعوها فإنها منتنة! <--- تعصب الجاهلية!"
author = "متجول!"
posted = "2007-06-24"
text = "روى مسلم من حديث أبى هريرة رضى الله عنه قال: قال رسول الله صلى الله عليه وسلم :<br />{يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَى وَجَعَلْنَاكُمْ شُعُوباً وَقَبَائِلَ لِتَعَارَفُوا إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ }الحجرات13<br />\"لا تحاسدوا ولا تناجشوا ولا تباغضوا ولا تدابروا، ولا يبع بعضكم على بيع بعض.<br />وكونوا عباد الله إخوانا.<br />المسلم أخو المسلم،<br />لا يظلمه، ولا يخذله ولا يكذبه ولا يحقره.<br />التقوى ها هنا ويشير إلى صدره ثلاث مرات.<br />بحسب امرئ من الشر أن يحقر أخاه المسلم.\""
archived = "2010-03-14"
capture_url = ""

