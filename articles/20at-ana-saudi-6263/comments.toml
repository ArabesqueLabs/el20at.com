text = "هديل العنزى يا أحقر من على الأرض أنت تقولي اسألوا البنغالين أو الفلبيين عن المصريين وأنا اقول لك أسالى أنت العالم كله عن السعوديين وشوفوا ايه رأيهم أحقر وأنجس شعب في العالم شعب الكلاب . تقولون بمصر الدعارة ، وجماع البنات مع بعضها في السعودية ماذا تسميه ، واللواط بين الشباب السعوديين ماذا تسميه ، وزنا المحارم بالسعودية وانتشاره بشكل كبير ماذا تسميه. النوم في المقابر أشرف من زنا المحارم ، الراقصات أشرف من السحاق وأشرف من اللواط يا أحقر إنسانة"
