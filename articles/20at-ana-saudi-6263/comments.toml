text = "تخيل المصرى الحر اللى حار 3 مرات دفاعا عن شرف فيرة بكل نخوة ورجولة ييجى علية اليوم ويسيب كلب سعودى لا ينتمى لغيرة من السعوديين المحترمين لكنة مسخ هجين يشتم فى المصرية الشريفة العفيفة ام الرجال<br />السعودى الوقح بيسال الخدمة ولا الدعارة ؟<br />ياايها الوقح الدعارة انتا واللى زيك من السعوديين الهايجيين تعرفوها لكن احنا لا احنا يانى كلب شعب من فجر التاريخ بيبنى وعمرة مااتوقف عن البناء<br />واذا كانت اخلاقهم كدة كنا عاوزين بناتنا تروح تخدم هناك<br />ياعالم فكونا من موال العروبة دى بقى خلونا نروح للناس الكفرة اللة عندهم انسانية اكتر من بهايم البترول دول<br />لية ياحسنى تحط رقبتنا تحت جزمة الكلاب دول ؟<br />ولية ياعشرينات تتدنسى قبر الشهيد<br />انتم مش مصريين<br />لاحول ولاقوة الا باللة"
