subject = "المصريات .. مكانس أم صاجات؟"
author = "سعودي"
posted = "2007-06-14"
text = "لا ادري لماذا كل هذا الحقد على السعودية<br />لماذا التهجم على السعودية بمناسبة أو بغير مناسبة؟<br />صحيح أن الشجرة المثمرة تضرب بالحجارة لكن ليس بهذا العنف المسترسل وهذه الوقاحه<br />، وكأن السعودية من كوكب آخر. أنا لا أدافع عن المملكة لأن أفعالها وإنجازاتها وقيادتها خير مدافع عنها.<br />اخزاكم الله ايها الحاقدين<br />سوف تبقى السعودية منار للاسلام<br />من اعتنى بالحرمين الشريفين غير السعودية<br />من طبع مئات الملايين من المصاحف ووزعها على المسلمين غير السعودية<br />من يساعد الدول الاسلامية التي تتعرض للزلازل والبراكين ويمد الجسور الجوية المحملة بألاف الاطنان من المواد الغذائية والطبية غير السعودية<br />من ينشر العلم ويدافع عن الاسلام من كيد الرافضه غير السعودية<br />من يبني المساجد في شتى انحاء العالم غير السعودية<br />اللهم احفظ السعودية وولاة امرها من شر الحاسدين وكيد الكائدين"
