subject = "حسبي الله و نعم الوكيل"
author = "alexomania"
posted = "2007-06-21"
text = "عشرينات .... أحب أهنيكم .....علي حرية الرأي اللي بيتمتع بيها الموقع<br />ببساطة دي مش أول مرة أنا أضيف فيها تعليق و إنتم تحذفوا التعليق ...ليه لا سمح الله؟ هل أنا بقول كلام عيب مثلا؟ أو كلام أبيح؟<br />طيب ما أنا بعت كذا report أبلغ عن تعليق في الموضوع ده و اللي كانت بتحتوي علي ألفاظ بذيئة لا يصح إنها تكتب في الموقع (المحترم)ده و برضه ما إتحذفوش<br />ولا علشان هما مش بيجيبوا سيرتكم في حاجة؟<br />ولا يمكن السياسة هنا اليومين دول بقيت ..دم دم عاوزين الناس تتلم<br />ويلا كله يغلط في كله و محدش خسران حاجة....... بس برضه حعيد الموضوع تاني :بسم الله<br />الموضوع ده مستفز لأنه بيمس مشاعرنا لأنه بيتكلم عن أمي و أختي وأمك إنت كمان<br />_كل الإحترام و التقدير للأخت المحترمة هيفاء ما شاء الله تعليقاتها بتدل علي مستوي العقلانية و الصفاء اللي بتتمتع بيهم<br />و أظن إن ده المفروض يكون حال المسلمين<br />يا جماعة ديننا عمره ما فرق بين مسلم و التاني لا بلون ولا مستوي مادي ولا حتي جنسية<br />_لأ إنت صومالي مش وسيم يبقي مش حتحج معانا<br />_أو إنت كويتي معاك فلوس يبقي كفايا عليك كده و بلاش ترمي الجمرات....<br />لو حد عمره سمع عن حاجة زي كده يبقي يقول لي.....<br />يا عشرينات لو جه علي بالكم إن كتر التعليقات دي نجاح للموضوع .... إنسوا<br />دول هما إتنين تلاتة اللي مدورين الشتيمة و عاجباهم الليلة دي<br />يا ريت نسمع بعد كده عن موضوعات تكون فعلا بتهم الشباب العربي ولا خلاص نسينا فكرة الموقع؟؟"
archived = "2010-03-14"
