text = "من اول سطر فى المقال و الكلام مستفز جدا جدا<br />اولا مصر مفيش بلد زيها فى الدنيا و اقدم حضارة فيكى يا مصر<br />نفسى حد يجبلى بلد كان ليها حضارة قديمة و لو فى اصلا مش هتيى بعظة حضارتنا تلقى الحضارة اللى طالعين بها السما عبارة عن حجرتين و حفرة فى جبل و يقولولك حضارة<br />السعودية انا بحترمها بس عشان الحرمين الشريفين بس لو هحترمها عشان حاجى تانية مفيش ناسها زبالة<br />تعالو شوفوا السعوديين فى الصيف فى تركيا و اللى بيعملوه ما هم طبعا محرومين و ما يصدقوا ينطلقوا بس انطلاق بوساخة<br />و مين اللى خلى السعودية سعودية غير المصريين<br />ما هى دى غلطتنا من الاول كنتم جعانين و حافيين فى الصحرا و احنا اللى ندفناكم و فهمناكم المدنية<br />قال مكنسة ولا ساجات ؟ تصدق انك واحد ملكش لازمة من الاخر كده حيوان و ده طبيعى لانك من بيئة حيونات و ده مش جديد علينا<br />جتكم الارف بدل ما نخاف على بعض يقولوا ايه لا السعودية استحالة تكون خدامة بس المصريين حرين<br />تعالو شوفوا السعوديات فلا تركيا فى الصيف يقلعوا هدومهم عشان يكونوا ذى الاجانب و ياريت بيقلعوا عدا بيقلعوا بفلحنة و بطريقة بيئة و دايما مش عرفه ليه ليهم ريحة معفنة"
