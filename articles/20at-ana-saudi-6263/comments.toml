[[comments]]
order = 38
subject = "المصريات معلمات السعوديات دوما وابدا ولن يكن خادما"
author = "مصرية غيورة"
posted = "2007-06-25"
text = "لا يخفي علي احد من العالم العربي دور المعلمين والمعلمات المصريات وفضلهم على جميع الدول العربية وبخاصة السعوديه وفي هذا يقول الشاعر \"قم للمعلم ووفه التبجيلا كاد المعلم أن يكون رسولاً\" فمن الأولي أن تعمل السعوديات خادمات عند المصريات لفضلهن عليهم منذ عشرات السنين ولو أننا نثق بالرجال السعوديين في بيوتهم لما رفضنا ذلك الامر ولكننا عايشنا الكثير من الأحداث داخل السعوديه التي كانت تدفع بالخادمات الاجنبيات للانتحار من سوء فهم الرجال السعوديين لطبيعه الخادمه فهي ليست خادمة في البيت فقط وإنما ؟؟؟؟؟؟؟؟؟؟؟؟ وهذا مالا يرضي الله ولا نرضاه لبناتنا وليس ناك رجل مصري يسمح لابنته او لاخته ان تعمل في مجال الخدمه في السعودية بالذات فحسنوا اخلاق رجالكم ونسائكم أولا ثم اطلبوا خادمات من اي بلد اخري الا مصر ومصر بلد الازهر الشريف وان كان يوجد عندنا شارع الهرم فانتم من رواد شارع الهرم وسألوا انفسكم."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 39
subject = "للى عندوا كرامه اليوم يغادر السعوديه والرزق على ال"
author = "الاحمدى"
posted = "2007-06-28"
text = "انا مستغرب من الاخوه فى مصر هذا التحامل على السعوديين ياخوانى اقسم بالله العظيم انا مستغرب مش عجباكم السعوديه ولا شعبها بلاش تيجوا لها شوفوا اى دوله تستقبلكم انتوا علماء وعباقرة العرب ليه انتوا ارخص عماله موجوده عندنا خليكم ببلدكم عمروها وخلوها بمصاف ارقى الدول<br />المساله سهله جدا انتوا اهل الديمقراطيه واحنا الحفاه العراه غيرو نظام بلدكم عيشوا فى بلدكم ليه تسافروا وتتغربوا عند ناس زباله زينا تتوقعوا لو منعت العماله المصريه راح نموت لا والله فى الف بديل سوريا الاردن لبنان الفلبين الهند شرق اوربا<br />بمعنى انتوا اهل الحضاره احتجاج عام وقولو الخليجين ما نصدر لهم عماله وصدقونى راح تعملو فينا الف خير والله<br />مسالة الخادمه المصريه دى مساله تخص الحكومه المصريه اعمل احتجاج وقولو مش عاوزين الوزيره انتوا بلد الحريه وسعد زغلول ومصطفى بكرى والرموز الهامه هذى بالوطن العربى والله والله تكونوا عملتوا فينا خير حتى الاستثمار امنعوه واتمنى من التجار الخليجين بيع جميع الاستثمارات للى فى مصر<br />يعنى احنا مش عاوزين نكون هم اضافه الى هموم المصريين خليهم يراتحوا<br />بس مش عيب تعمل اى حاجه تانيه شريفه<br />غير الخدمه فى البيوت<br />وخصوصا عند هؤلاء الحفاه العراه<br />هما لسه ما وصلو بس انته تقدر يامصرى يافرعون تمنع القرار<br />ياعالم ريحونا من هرش المخ أنا دكتور فى السعودية ومش عارف أخد حقى ومن مشاهدتى للعقول اللى محيطة بنا أقولكم اللى تحب تيجى تشتغل خدامة للعالة الحفاة تستاهل ضرب النار<br />وقاعد ليه بالسعوديه بكره ارمى الاقامه بوجه الكفيل وروح بلدك وافتح عياده هناك ملعون ابو الذل ولا عند الفلوس تهان النفوس<br />اتمنى الان كل مصر موجود بالسعوديه مغادرة البلد وتقولو كمان طز بالذل مقابل الكرامه ارفعوا راسكم وغيروا كل القناعات للى عندكم وغادروا البلد بدون رجعه ياالله عاوزين نشوف ابطال مصر وكرامتهم عاوزين نشوف رجال مصر"
archived = "2010-03-14"
