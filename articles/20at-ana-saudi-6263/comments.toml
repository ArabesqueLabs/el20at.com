text = "دعونا نحن السعوديين فأسألوا هنا المقيمين من الجنسيات من بنغلاديش وباكستان والهند .. فهم من يشيدون بالشعب السوداني وهم كذلك فهم شعب رائع وفي نفس الوقت يحتقرون ويكيلون اللعن والشتم للمصريين .. إسألوهم حتى لا تقولوا إننا متحاملون عليكم .. فأنت من جعلتم كل العالم يكرهكم بأفعالكم .. أيها الداعرون الفاسدون الماجنون الفاسقون . عليكم من الله ما تستحقون . فمصر هي بلد الدعارة والفسق والفجور ."
