author = "مصري درجة اولى"
posted = "2008-04-18"
text = "ياجماعة احنا المصريين مش محتاجين نغلط على شعب جاهل زي ده احنا احسن من كده بكتير<br />وبعدين اللي كتب الموضوع ده واحد ابن كلب مش بيفهم حاجة خالص يعني انتوا مستنيين ايه من<br />واحد خول زي ده وانا اسف على اللفظ بس انا مضطر لانه واحد وسخ من دولة اوسخ انتوا بالذات<br />ما تتكلموش عن الدعارة انتوا مش بتشوفوا ايه اللي بيحصل لانكم نيمين على ودانكم السعودية<br />اكتر دولة منتشر فيها الدعارة وده بفضل السعوديات طبعا فبلاش تكلموا انتوا عن الدعارة صلحوا<br />نفسكم الاول ياشعب قذر وبعدين تعالوا اتكلموا عن اي شعب تاني ده لو لقيتوا اللي تكلموا عليه<br />يا اوساخ الله يجحمكم خلتوني اكره العيشة علشان واحد وسخ كتب المقال ده خلانا نمسك في<br />بعض لانه انسان حقير لانه لو هو بيرضا ان امه او اخته تشتغل خدامه احنا مانرضاش لان احنا شعب<br />نضيف ياشعب اوسخ من الجزم"
