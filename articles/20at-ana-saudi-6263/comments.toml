text = "فلتكون تعليقاتنا مهذبة وموضوعية<br />1- الأخوة السعوديين اشقاء فى الدين والعروبة، والحقيقة التى لابد ان يعرفها المصريين انهم كمصريين - من ناحية الأصول الوراثية - اقرب للعرب منهم لقدماء المصريين... لذلك من يسب السعوديين وينابزهم بأنهم حفاه عراه فليعرف انهم احفاد لنفس الاجداد<br />2- من يختزل الدولة السعودية بقوله دولة بدوية جاهلة فهو الجاهل، فالبدو ليسوا جهلاء ،وهو بالتأكيد لم يدرس تاريخ شبة الجزيرة العربية، ، ولا يعرف التاريخ القديم او الحديث لشبة الجزيرة العربية، ويكفيه الدخول الأن على الوايكبيديا على الأنترنت ليعرف<br />3- المصريين فعلا اكثر الشعوب العربية قدرة على القيادة، واكثرهم ثقافة وذكاء، واقدرهم على بناء حضارة. وهذا كلام حكماء العرب جميعا بالأتفاق ولا خلاف عليه<br />3- يجب ان يفرق العرب بين حكامهم ومحكوميهم، فدراسة السمات النفسية للشعوب والمشكلات الإجتماعية وعلاقات الأفراد لا يجب ان تستنبط من السياسات الحكومية والتى لا تعبر إلا فقط عن اطماع ومصالح الحكام، وهذا الكلام يطبق على كلا النموذجين الغير ديموقراطيين المصرى والسعودى<br />4- لا يجب أن يمن المصريين على أخوانهم السعوديين بأخذهم بأيديهم إلى البناء، فالأيام دول ((يا ايها الذين امنوا لا تبطلوا صدقاتكم بالمن والأذى))<br />5- يواجه المجتمع السعودى مشكلة حقيقية مع الأخر ... والأمر لا يتوقف على قلة سعودية او شرذمة، كما تفضل بعض المعلقين، بل هو امر عميق فى النفسية البدوية التى تقدس القبيلة وتزهو بالعصبيات القبلية. ومن اكبر الأدلة على ذلك هو قانون العمل بالمملكة – وكثير من دول الخليج – والذى يربط المستقدم بـ \"كفيل\"، يعتبر ولى امره.. وهذا النظام غير موجود فى اى دولة من دول العالم المتحضر ولا حتى غير المتحضر ... فالعلاقة هى علاقة عمل من المفترض أنها قائمة على المنفعة المتبادلة والعقود القانونية.. وليس لطرف فيها الفضل على الأخر. ومثال أخر هو قوانين الزواج بالمملكة والتى لا تسمح بزواج السعودية من غير سعودى .. وهو مثال فى غاية التطرف يدل على عنصرية اصيلة .. النموذج الثالث هو شبه استحالة الحصول عل الجنسية السعودية<br />6- الأخ المعلق الذى اقترح أن يترك جميع المصريين ارض السعودية يمثل نموذج مثالى لدراسة العقلية السعودية تجاه الأجنبى.. فنظرة السعودى إلى \"العمالة الأجنبية\" - كما يحلو لهم أن يطلقوا عليها - هو أن السماح له بالتواجد فى المملكة هو من قبيل التفضل وليس بسبب الحاجة الملحة لليد العاملة سواء المدربة او البسيطة، والتى لولاها ما كان للمملكة أن تكون<br />7- نفس الأخ قال: سوف نأتى بالسوريين والسودانيين او الأسيويين ، فهنا اقرار بأهمية دور اليد العاملة الأجنبية، والتى إذا قررت جميعها مغادرة المملكة بناء على نصيحته، فقل على المملكة السلام<br />8- الأخ الذى قال بأستبدال العمالة المصرية بغيرها يفترض أن هذه الجنسيات المذكورة هى من المحبين للسعوديين وأنهم مقبولين داخل المجتمع السعودى. طبعا هذا الكلام غير صحيح بالمرة.. فما حدث هنا بين المصريين والسعوديين...حدث ويحدث بين السعودين والسوريين، والسعوديين والسودانيين ، زغيرهم كثيرين<br />9- عمل المصريين فى المملكة هو فعلا من قبيل الحاجة المادية .. ولولا ذلك لم يترك المصرى بلده ابدا .. وعلى فكرة .. لم يحدث على مر تاريخ مصر القديم والحديث أن ترك المصرى ارضه إلى غيرها إلا بعد الثورة والفقر الذى استشرى فى مصربعدها ، والحراك الطبقى وتطلع الفئات الدنيا إلى العلو فى الأرض، وظهور الذهب الأسود ببلاد الخليج، وتنامى القومية العربية القائلة بوحدة أرض للوطن العربى .. وطبعا للأسف المصريين صدقوا الهبل ده<br />10- الدول الأوروبية الغارقة فى النفعية والبرجماتية ساعدت العديد والعديد من الدول الأوروبية الفقيرة ودخلت معاه فى تكتل اقتصادى \"الأتحاد الأوروبى\" والسبب االأهم لذلك هو احتياج الدول الأوروبية الغربية الغنية لليد العاملة الأوروبية الشرقية الرخيصة (للأستغناء عن اليد العاملة المسلمة بسبب تنامى الأسلاموفوبيا)، فاليد العاملة الرخيصة ليست عيب او وصمة ، بل هى ثروة نحمد الله عليها، وتسمى الثروة البشرية<br />11- للأسف تعترف الدول الأوروبية بدور المهاجرين – وليس \"العمالة الأجنبية\" – فى نهضة وعمران اوروبا، وتنتشر فى الطرقات والمؤسسات الأوروبية ملصقات عن فسيفساء المجتمعات الأوروبية واهمية بناة اوروبا من غير ذوى الأصول الأوروبية. فمتى يعترف المجتمع السعودى بدور \"العبيد\" المستجلبين من بلادهم عبر مكاتب النخاسة – الأستقدام – .<br />12- اخيرا، المقال مستفز من أوله لأخرة، فالعنوان فيه قلة أدب وتلميح قذر، وهو ما تسبب فى كل تلك التعليقات الشاطحة .. فاتقوا الله .. ولا تتعاملوا مع الأمور الحساسة باستهزاء"
archived = "2010-03-14"
