text = "الموضوع من أوله لحد التعليقات اللي عليه كله كلام طبقي وفي منتهى التعجرف<br />من إمتى كانت شغلة شريفة أقل من غيرها بعض النظر أستاذه في الجامعة ولا خادمة<br />وليه بنتكلم عن الخادمات إنهم أقل منا و أقل حتى من البشر وكأنها مخلوقة من تراب نجس و سيادتكم مخلوقين من تراب الجنة!!!!<br />نسيتوا يا مخلوقات من طين أصلكم إيه ولا نسيتوا رسل الله و انبيائه كانوا بيشتغلوا إيه؟؟؟؟!!!!!<br />وياما أميرات في بلاد.... و دكاترة و مهندسات و محاميات و من أعلى الناس و ربنا عالم بحالهم بعيد عن عيون الناس<br />إتقوا ربنا في كلامكم و اللي زعلان قوي من إن واحدة سعودية تشتغل خدامة ولا واحدة مصرية إفتكر أصلك يا بني آدم... أصلك من طين زيك زي الخادمة"
