[[comments]]
order = 6
subject = "غلى كلاب السعودية"
author = "بس خلاص"
posted = "2007-06-13"
text = "طبعا مشكلة الخادمات دي مشكلة سخيفة اخترعتها لينا الست الوزيرة بتاعت الفرقعات كلها ..لكن المستفزفعلا ان عشرينات تنشر موضوع بيتكلم فيه محرر سافل وغبي عن المصريات بهذا الشكل ..وبيتكلم بطريقة (المواطن السعودي) لأن السعوديين من غباؤهم بيصنفوا الناس الى (مواطن) والمقصود به سعودي غبي..وغير مواطن وهو اي جنسية اخرى..وواخد نص الموضوع على لسان المواطن حمد مش عارف ايه ..مين يا اخويا حمد ده اسم النبي حارسه؟<br />العيب طبعا مش عليك ولا على حمد لكن العيب على عشرينات اللي وصلت بيهم الوقاحة انهم يشتموا ولاد بلدهم ويسمحوا للبهايم السعوديين انهم يتهكموا عليهم..ويقولوا تشتغل في الخدمة ولا في الدعارة و التسول...فهما من وساخة مخهم واخلاقهم القذرة شايفين ان الدنيا كلها دعارة لأنهم غرقانين في الدعارة طول عمرهم..لأن سفرهم في اي مكان خراج سجن السعودية فهو بالنسبة لهم ليالي جنس ودعارة و زنا...<br />اما داخل سجون السعودية فهما بيتلذذوا بممارسة الشذوذ الجنسي خاصة مع الاطفال...و بيتمتعوا ايضا بزنا المحارم ...يا سعودي يا اللي بترفع راسك ...اللي بيته من ازاز ميحدفش الناس بالطوب ..لأن انتو اخلاقكم قذرة ..ومبتلحقوش تنضفوا من اوساخكم يا كلاب ..<br />ارجع واقول عشرينات بقى موقع قذر لأنه بيبقى سعيد جدا انه ينشر موضوعات تخلي عدة اطراف يتموا في بعض..وبيشوفوا في كده نجاح منقطع النظير..يا عشرينات ياللي عاملين فيها ولاد بلد..عيب اوي تطعنوا ولاد بلدكم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "\"إني أخشى عليهم أهل نجد\""
author = "أحمد القطب"
posted = "2007-06-13"
text = "في المنطقة العربية توجد دول ثلاثة تم اصطناعها في ظروف خدمت مصالح الاستعمار الغربي وتخطيطه لمستقبل المنطقة، هذه الدول هي: السعودية، الأردن، وإسرائيل..<br />وكل من هذه الدول لا تحتكم على العمق التاريخي والحضاري الذي يدعم لها كياناً وإرادة سياسية فاعلة في المنطقة فضلاً عن أثر حضاري حقيقي.. ويمكننا الملاحظة أن النموذجين العربيين من هذه الدول الثلاث تستمد أسماءها وأسماء مواطنيها وجنسيتهم من لقب الأسرة الحاكمة (سعودي) و(هاشمي).<br />والسعودية دولة تضم مجتمعاً حديث عهدٍ بالحضارة والمدنية ضعيف التجانس من حيث البنية الاجتماعية لا زال يعاني من آثار تعصب قبلي ظاهر وطبقية مستترة، وليس غريب أن طفو آثار التعصب القبلي على الكيان السياسي الخارجي ليكتسي المجتمع السعودي بنظرة عنصرية مغرقة للجنسيات المحيطة به في المنطقة رغم تناقض هذه النظرة كلياً مع المنطق الذي تتعامل به السعودية مع دولة كالولايات المتحدة الأمريكية ومواطنيها..<br />أوجدت هذه المعطيات وضعاً غاية في التعقيد في نظرة وتعامل المجتمع السعودي مع المصري الوافد على بلاده للعمل على وجه الخصوص، فهذا المصري هو نفسه الذي دخل إلى نجد منذ قرن ونصف وهدم العاصمة السعودية الأولى وأنهى وجود الدولة السعودية في مهدها حين كانت حركة انفصالية خارجة على الخلافة..<br />وهذا المصري هو الذي دخل إلى السعودية منذ خمسين سنة كخبير واستشاري وطبيب ومهندس بناء وإعمار في وقتٍ كانت فيه الدولة السعودية الناشئة تجتهد للأخذ بأسباب التقدم الحضاري والمدني معتمدة على الدخول الهائلة التي حققها إنتاج النفط للدولة..<br />اليوم.. أصبح أهل السعودية يرون ذلك المصري رجلاً أو امرأة وقد صار سائقاً وحلاقاً وعاملاً أو خادمة بمنزل.. في الوقت الذي لازال فيه الكثير من هؤلاء السعوديين يترددون على مصر قاصدين شارع الهرم.. وما وراءه.. فصارت للعمل في أذهانهم على هذا النحو صورتان لا بديل لإحداهما.. إما خدمة يأنفون القيام بها بأنفسهم وإما متعة محرمة يقصدونها في أسفارهم.. وهي في الحقيقة صورة بعيدة عن الواقع كثيراً..<br />وقد صاروا على ذلك واهمين أنهم قد اجتازوا الفجوة الحضارية الهائلة التي كانت بينهم وبين شعوب المنطقة المحيطة حين صار أهالي تلك المنطقة يقصودن بلادهم للتكسب وطلب الرزق.. وهو تصور خاطئ بالكلية للأسف.. لأن ارتفاع المستوى المعيشي واستقدام العمالة من الخارج لم يكن أبداً مؤشراً على التقدم الحضاري والرقي الاجتماعي.<br />النقطة الغائبة عن الكثير من السعوديين اليوم.. أن المستوى المعيشي في مصر في العقد الأخير قد اختلف كثيراً عن ذي قبل.. وأن أولئك الذين يقصدون بلادهم لم يعودوا يمثلون صورة حقيقية للمجتمع المصري على الإطلاق، وفي المقابل فإن السعودية اليوم تحتكم على نسبة مرعبة من البطالة.. بين الذكور فما بالك بأوضاع الإناث..<br />وأما عن العاملات المصريات في الداخل والخارج.. فاسمحوا واسمحن لي أن أنقل إليهن كلمة وردت بحديث صحيح عن سول الله صلى الله عليه وسلم.. دون أن أعلق عليه.. حين كان رسول الله صلى الله عليه وسلم يستشير أصحابه في إرسال بعثة إلى بني سليم والتي انتهت بمذبحة بئر معونة.. قال لهم: (إنّي أخشى عليهم أهل نجد..).. وأنا اليوم أقول لكم ما قاله صلى الله عليه وسلم.. ولا أخفي ذلك .. إني أخشى عليهم.. أهل نجد."
archived = "2010-03-14"
capture_url = ""

