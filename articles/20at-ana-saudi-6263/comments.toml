text = "الناس اللي فاكرة إن مصر الدعارة و الدعارة هيا مصر ....عالم متخلفة من الأساس<br />نسيو إن مصر هيا الدولة العربية الوحيدة اللي فيها 4 أخدوا جوايز نوبل و المصريين قبل كده مسك منهم واحد أمين للأمم المتحدة ده غير المدرس اللي عندك في المدرسة يا كلب إتحداك إن مكانش مصري أو أستاذ الجامعة أو الدكتور اللي بتروح له لما تطفح كتير في الأكل -كالعادة- إصحو .... فوقو..... شوفوا حقيقة مصر .... يكفينا شرفا إن إحنا الدولة العربية الوحيدة اللي رافعة راسها قدام إسرائيل ....... أتحداكم إن كان عندك جيش أو حتي لو كان عندك أتحداك إن يكون عندك جندي زي المصري ..............لا حصلت ولا حتحصل ...... بلاش دي علشان إنت شكلك شيخ و بتفهم في الدين :P شوف مصر ذكرت كام مرة في القرآن؟؟؟<br />و أحاديث سيدك النبي لما قال (إستوصوا بأهل مصر خيرا فإن لهم ذمة و رحما) و لما قال (إذا فتح الله عليكم مصر فإتخذوا منها جندا كثيرا فإنهم خير أجناد الأرض) لو جت سيرة السعودية بقي في القران أو السنة إبقي إتكلم.... سيدك النبي جاب لك من الآخر .....يبقي تحط أي حاجة في بقك و تقفله أو تمسك حتة ثلج علشان تطفي بيها نار الحقد اللي جواك أو دور لك علي حتة طرية علشان..................<br />هههههههههههههههههههههههههههههههههه"
