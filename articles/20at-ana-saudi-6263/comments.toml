[[comments]]
order = 29
subject = "السلام عليكم .."
author = "هيفاء"
posted = "2007-06-15"
text = "سعودية ..<br />صحيح قلة أدب ..<br />لية وصلنا لهذا الانحطاط بالألفاظ .. و التطاول على بعض ..,<br />نحن أمة مسلمة و قال الرسول علية الصلاة والسلام (( المسلم من سلم المسلمون من لسانه ويده ))<br />وبعدين من قال أن نحن السعوديين أنكرنا فضلكم و ثقافتكم .. ولكن الظروف وضعتنا دولة أغنى عنكم ..<br />و أنتم دولة كثير شعبها .. وصعبة حياتكم .. كان الله في عونكم وعوننا ..<br />كل إنسان مسلم يجب علية أن يغار على المرأه المسلمة من أي جنسية و يحافظ عليها من المذلة و الحاجه<br />و انت يا رجل لا تذلها و تضطرها لهذا الذل من الانحطاط الأخلاقي .. ولكن العمل ليس مذلة سواء كانت خادمة<br />أم مدرسة كل إنسان على حسب حالته الأجتماعية و المادية ..<br />هناك سعوديات يشتغلن برواتب قليلة لا تكفي لحاجتهن المعيشية مثل ماعندكم يالمصريين ..عندنا طباخات و أيضاً خياطات<br />ومختلف الأعمال اللتي تدر القليل من المال ,,<br />لسنا أغنياء كثيراً عندنا المعيشة أغلى من عندكم و أيضاً العملة تختلف ..<br />ونحن نحترم المصريين الشرفاء ,,<br />لسنا أغبياء مثل ماتقولون فنحن لنا إنجازات مثل ما لكم من إنجازات .. وليس لكم الحق بإنكارها ..<br />كلنا انتفعنا من بعضنا البعض وهذا دليل على التعاون والتكافل بيننا ..<br />و أيضاً في كل دولة سواء سعودية أو مصرية أو عربية يوجد هناك أشخاص غير سويين بأخلاقهم وتصرفاتهم<br />و مثل مافية أشخاص سعوديين يذهبون لمصر للزنا عافانا وعافاكم الله هناك مصريين يمارسون نفس الشيء<br />و أنتم اللذين سمحتم لبناتكم بأن يكونو بهذه الصوره في بلدكم فأنتم بأيديكم ممكن تصلحون هذه الصورة بأن<br />تمنعوا مثل هذه الممارسات الغير شرعية في بلدكم .. وعموما ً أصبح حتى في الدول العربية نفس الشيء<br />و بلدنا ليس سجننا كما قلتم ولكن نحن نحاول على قدر ما نستطيع المحافظه على عاداتنا وتقاليد ديننا الشريف<br />حتى لو أخطأنا وكلنا خطائون و خير الخطائين التوابين ... و أيضاً يختلف كل إنسان بطريقة تفكيرة وتصرفة<br />وكل إنسان يتكلم عن نفسة فقط ولا يدخل الآخرين ويشملهم بالسوء ..<br />فليس كل سعودي ولا كل مصري سيء أو جيد يختلفون كلاً بطريقتة ..<br />و أنا كأمرأة سعودية أحترم كل إنسان يحترم نفسة .. من أي دولة عربية .. بغض النظر عن مكانتة الأجتماعية ,,<br />وعموماً أنتشرت الفتن الله يحفظنا ويحفظكم من شرها .. ويهدينا ويهديكم .. ولا يشغلنا ألا بطاعتة ..,,<br />أرجو منكم أحترام أنفسكم و أحترام الآخرين كسعوديين ومصريين و المحافظه على الألفاظ المحترمة هذا يدل على التربية<br />وعلى الحالة النفسة للشخص (( غيرة أو حقد أو تكبر )) والكل يعرف يقيم الشخص من طريقة كلامة ..<br />تحياتي للشرفاء ..,,"
archived = "2010-03-14"
