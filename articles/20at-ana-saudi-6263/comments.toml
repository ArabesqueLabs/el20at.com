text = "لا يخفىعلى كل ذي لب أن مصر تفوقت على كثير من الدول الأوربية في الدعارة .. فنساؤها ليس لهن هم غير هز الوسط والزنا .. فهم ملوك الدعارة والجنس وفضائياتهم خير دليل على ذلك .. فقنواتهم ليس فيها سوى البوس والجنس والأحضان وإبراز المفاتن والأرداف .. فهي بحق بلد يستاهل الحرق والمسح من على الخريطة .. معروف الزنا في مصر على قارعة الطريق فما من أن تعرف البغايا المصريات قدوم وافد من خارج مصر لا سيما إن كان من السعودية أو دول الخليج إلا ويهرعون لقرع بابه يعرضون عليه الاستمتاع بأجسادهن مقابل حفنة من الريالات .."
