posted = "2008-07-01"
text = "كما ان هناك مصريات يعملن بالرذيلة هناك ايضا سعوديات يعملن بها فليس من العيب ان يطلب احد خادمة سعودية ولكل شخص الحرية ان يعمل ما يشاء وما يفرض على الانسان العمل بالاعمال المخلة هي ظروف المعيشة والفقر فلابد للمسؤولين أن يحاولو مساعدة الفقراء والظروف المعيشية الصعبة حتى لا تهين المرأة نفسها<br />ولابد ان نعرف جميعا ان لا احد يقبل اان تعمل سعودية كخادمة وايصا المصرية نحن نتحدث عن كرامة المرأة العربية عموما<br />اما العمل المخل للشرف لأى إمرأة مهما كانت الظروف فسببه البعد عن الدين والتمسك به والخوف من الله"
