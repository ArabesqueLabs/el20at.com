text = "واللي عايز يعرف كلامي<br />يتفرج على برامج الحج ايام الحج طبعا<br />في القنوات السعودية<br />المذيع لما بيتكلم عن كسوة الكعبة لايمكن يقول ان مصر هي اللي كانت بتصنعها وتبعتها بموكب مهيب من اول مصر لغاية مكة تلاقيه يقول ( وقد كانت بعض الدول تطلب تقديم هذه الكسوة في بعض السنوات ايمانا منها بقدسية هذا العمل ) وكان وقتها السعودية كانت تقدر تعمل الكسوة بس هي ادت الشرف ده لبعض الدول اللي هي مين طبعا لا يمكن يقول<br />وبردو لايمكن يقول ان سقاية الحجاج كانت ممدودة من مصر لغاية الحرم<br />لان مكانوش عندهم امكانيات لسة تخليهم يعرفوا قدرات بئر زمزم العظيم<br />و بالمناسبة اللي نزل واستكشف منين بتنبع بئر زمزم وعرف خباياها كان مهندس مصري<br />وكمان لايمكن يقول عن التكية المصرية اللي كانت في قلب مكة وكانوا السعوديين بروحوا يقولوا للمصري هناك صدقه يا حاج<br />والتكية دي كانوا نفسهم يشتروها من جمال والسادات عشان يهدوها وينسوا الايام السودا لكنهم رفضوا ولكن الله يحرقه المرتشي مبارك اللي باعها لهم وحط الباقي في جيبه وهدوها ومسحوها من التاريخ<br />واسالوا السعوديين عن الموضه في اكمام الاتواب الرجالية<br />انه يكون الكم به تنية بالخياطة قبل الكوع لانه كانت هذه الاتواب من مصر ومعروف عن المصريين انهم اجسامهم اكبر من السعوديين عامة فكان الكم لما يكون طويل يقصروا بهذه الطريقة حتى اصبحت موضة وموديل لبعض الاتواب<br />وغيره وغيره ارجو ان لا اكون ازعجت احد بكلامي فانا لم اسيء الي احد ولا احب الالفاظ الخارجة وما قلته ماخوذ من ناس عاشو عشرات السنين في السعودية وعارفين تاريخنا وجغرافيتهم وشكرا<br />اما الاخوة السعوديين اللي اتكلموا فيما عدا هيفاء<br />فاقول لهم اذا نطق السفيه فلا تجبه فخيرا من اجابته السكوت"
archived = "2010-03-14"
capture_url = ""

