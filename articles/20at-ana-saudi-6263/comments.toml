[[comments]]
order = 16
subject = "تعقيب"
author = "مسلم"
posted = "2007-06-14"
text = "الأخ السعودي اللي قال من يهتم بالحرمين غير السعودية أضحكتني حتي النخاع يا بابا ..... هوة إنت فكرك إن الحرمين دول بتوعكو لاسمح الله؟ ولا فاكرين إن الأرض اللي نشر فيها الرسول محمد صلي الله عليه و سلم هيه هيا اللي إنتو عايشين عليها دلوقت؟ إصحي يا بابا صباح الخير إنتو عايشين في (الدولة السعودية الثانية) اللي حاربت الشريف حسين و حاربت اليمن علشان تبان و تظهر للوجود يعني مالآخر حاربتو المسلمين علشان تعملو دولة هل فكرك إن أرض الحجاز كانت كده؟ ولو الحرمين كانو في الأردن أو اليمن كنتو حتفضلو تخدموهم؟؟؟؟؟<br />سؤال آخر :يا تري لسة فاكرين حياتكو قبل تدفق خيرات البترول كانت عاملة إزاي ولا خلاص نسيتو .إللي نسي أنا ممكن أبقي أفكره..<br />و لما تقول إن السعودية بس هيا اللي بتهتم بالدول الإسلامية ألف مليون أحا<br />أمال اللي مصر بتعمله ولا قطر ولا الإمارات ولا حتي الأردن ده بيكون أيه؟ أيه كلهم كلاب و إنتو أسود العروبة و حامو حمي ديار الإسلام؟ إبقي سلم لي علي ولي الأمر اللي رابطكو بسلاسل و معيشكو في دنيا الأحلام الوردية و الله يا ولاد فكرتوني بأيام الإشتراكية قدامكم يجي70-80 سنة علي ما تبصو علي العالم ماشي إزاي<br />يلالا سلام"
archived = "2010-03-14"
