[[comments]]
order = 0
subject = "يا خسارة مفيش ضحايا او مصابين؟ يا بختك يا نظيف بعد"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-23"
text = "الى النيام المسئولين!!!!!؟<br />اذا كان هنال من مسئول!<br />الكل ناثم و خاصة تنابلة سلطان الوزراء (نظيف)؟ و سلطان العاصمة (وزير)؟؟؟؟؟!<br />استيقظوا يا تنابلة السلطان؟<br />موش كل مرة تسلم الجرة؟<br />رحمة بمصر شعبا و نظام؟ (اتقوا اللة )<br />انكم عورة فى شفافية و نقاء النظام؟<br />من اجل النظام اتقوا اللة و الوطن و المواطن المقهور؟!"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233407/http://masr.20at.com:80/newArticle.php?sid=17695"

[[comments]]
order = 1
subject = "ياربت يا نظيف جدا تموت تحت صخور المقطم  (استجب لى"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-23"
text = "انا مسيحى مصرى قبطى سوف اصلى مع اخوانى المسلمين المصريين ليلة القدر للدعاء عليك<br />بان تموت تحت ضخور المقطم اسوة بابناء و طنك المساكين؟الغلابة؟؟ الفقراء؟؟؟<br />لتكون خير عبرة لمن لا يريد ان يتعظ و يعتبر<br />اللهم تقبل من جميع كل المصريين(مسلمينو مسحيين)انك مستجيب الدعاء يا رب العباد"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233407/http://masr.20at.com:80/newArticle.php?sid=17695"

[[comments]]
order = 2
subject = "طبقات الجبال - طبقة صخرية فوق طبقة طين طفلى تنزلق"
author = "ابو هديل"
posted = "2008-09-23"
text = "فى سورة فاطر اية صغيرة عن الجبال وانها طبقات فوق طبقات وليس الجبل صخرة واحدة<br />يقول تعالى<br />ومن الجبال جدد بيض وحمر مختلف الوانها وغرابيب سود )<br />الحكومة المصرية باعت ارض المقطم العلوية لشركة اعمار دبى بتراب الفلوس - وشركة اعمار دبى بنت فيلل وقصور وحمامات سباحة ومساحات خضراء واسعة واسرفت فى استخدام المياة بدون شبكة صرف صحى جيدة - فتسربت المياة الى اسفل وتشربتها الطبقة الطينية الطفلة من الصخور واصبحت مثل العجين وهى تحمل فوقها صخور طبقة اخرى جيرية صلدة فحدث الانهيار<br />وطالما تاتى مياة من فوق الهضبة من عند اعمار دبى - فكل الجبل سيتساقط ولن ينتهى مسلسل الانهيارات"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233407/http://masr.20at.com:80/newArticle.php?sid=17695"

[[comments]]
order = 3
subject = "يا من تدعى كزبا اناسمك(الانبا بيشوى)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-23"
text = "عزيزى المحاور<br />لا يهمنى ماذا يكون اسمك الحقيقى و لا ماذا تهمنى ان تكون على اى دين انت تعتنق و تقتنع؟<br />نحن نتكلم على كارثة سقوط صخرة ضخمة من جبل المقطم؟<br />و عن الخطر الذى يتعرض لة ابناء مصر من موت متربص بهم فى اى لحظة؟<br />لا يهمنا عن المفاجات او القنابل التى تتحدث عنها؟انها لم تمنع الخطر المتربص بابناء و طنك<br />(لا يهمنا ان يكون القمص زكريا بطرس مسيحى ارثوزوكسى او بروتستانتى او حتى بوذى)او حتى(راقصة من شارع الهرم بدولتك؟؟؟؟.)<br />حقيقة و ليس كذبا لو كنت حقا تعرف من هو (الانبا بيشوى)لكنت علانية قد جهرت باحترامك لهذا الناسك رجل الدين ؟<br />اشكرك جزيلا على هذة المحاورة الخطاء؟<br />ارجو ان تتاتى من الشجاعة الحقة و تكتب اسمك الحقيقى بلا خوف او هاع او جهل؟<br />كن حقيقى و صادق مع نفسك اولا؟ و مع ربك؟<br />كيف تخاف الناس و لا تخاف ربك؟ حرام عليك!!!<br />رمضان كريم و كل محاورة و انت طيب يانبا بيشوى عبد الرحمن ابو اليزيد مصفى متولى عبد الشافى؟<br />اللة يشفيك من مرض الحقد!<br />انة مجيب الدعوات!!! اللهم امين يا رب العالمين<br />قل لى بالحق؟<br />هل تستحى من اتخاز اسمائكم عذرا ام انك مؤمن بالديانة الاخرى التى تتخذ من قسيسها اسما لك فخرا بهم؟<br />بارك اللة وورثك ملكوت السموات!<br />امين!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!؟"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233407/http://masr.20at.com:80/newArticle.php?sid=17695"

[[comments]]
order = 4
subject = "نحن (نخاف الرب و لا نخاف العبد)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-23"
text = "يا من تدعى كذبا و فخرا ان اسمك(الانبا بيشوى)<br />هذا شرف لا يجب ان تنالة؟؟؟؟؟<br />لانة كثير على من كانوا على شاكلتكم او نوعيتكم او ثقافتكم ان يتسموا بة؟<br />(نحن لا نخاف العبد لاننا نخاف فعلا الرب)<br />انار اللة بصيتكم و ازال الظلمة من قلوبكم و طهر ما فى نفوسكم<br />هداكم اللة و هو نعم المجيب!<br />امين يا رب العالمين"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233407/http://masr.20at.com:80/newArticle.php?sid=17695"

[[comments]]
order = 5
subject = "يا جماعة احنا بنتحاور عن سقوط الصخرة - اية اللى دخ"
author = "مسلم"
posted = "2008-09-23"
text = "الاخ زخارى واخ تانى نازلين تبادل اتهامات ساذجة<br />الموضوع ليس لة علاقة بالاديان - دى موضوع عام او راى عام وكل واحد بيعبر عن وجهة نظرة الشخصية ايا كانت<br />رجاءا خليكم حلوين<br />وبطلوا المهاترات التى بدون جدوى"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233407/http://masr.20at.com:80/newArticle.php?sid=17695"

[[comments]]
order = 6
subject = "الاخ المحترم الحاور مسلم اشكرك"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-25"
text = "الاخ مسلم<br />اشكرك على تعليقكم النبيل الهادف<br />مصر فوق كل اعتبار<br />اشكركم على تفهمكم النبيل<br />لم ابداء انا بالهجوم ظلكننى دائما ما اتعرض للهجوم بسبب و لائى لمصر و للنظام<br />الدين عزيز على كل انسانو لكن انت تتفق معى بانة يجب الرد بقسوة على مدعى الدين الحاقدين؟<br />الدين شيىء سامى و عظيم و لكن القلة الغبية التى تزدرى عقائد و ديانات الاخرين يجب ان يرد عليها بقدر ما تهجمت و يزاد<br />رمضان كريم<br />و كل عام و مصرنا و شعبنا و نظامنا بخير و سلام<br />تقبل عميق اعتذارى و اشكركم"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233407/http://masr.20at.com:80/newArticle.php?sid=17695"

[[comments]]
order = 7
subject = "يارب تسقط و زارة ابو طويلة النخلة! ملك النظافة نظي"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-25"
text = "الاولى سقطت صخرة الويقة؟<br />و التانية سقطت صخرة المقطم<br />و التالتة بازن اللة سوف تسقط نخلة ابو طويلة العملاق الابيض الغير متوسط مللك النظافة نظيفكو اللى اسمها (الوزارة)<br />يارب يارب يارب<br />انك مجيب سميع الدعاء<br />استجب لصراخنا يا رب العالميييييييييييييييييييييييييييييييييييييييييين و العباااااااااااااااااااااااااااااااااااااااااااااااااااااد!"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233407/http://masr.20at.com:80/newArticle.php?sid=17695"
