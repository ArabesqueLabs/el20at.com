posted = "2008-03-10"
text = "توضيح هام للأسئلة الواردة على شروط الاشتراك في المسابقة:<br />- أولاً لا يعني أن الحد الأقصى لأعمار المشاركين 25 عاماً، أننا سنمتنع عن تقبل أي موضوعات لمن هم فوق هذا السن، فيمكن لكل من يمتلك فكرة جديرة بالنشر أن يرسلها لنا لكي ننشرها، ولكن خارج نطاق المسابقة.<br />- لا يجب إرفاق تعليق مع الصورة المرسلة، فالصورة، كما يقال، يجب أن تعبر عن ألف كلمة.<br />- المواد المرسلة، سواء كانت مكتوبة أو مصورة أو ملتقطة، يجب أن تعبر عن اهتمامات واحتياجات الشباب، وتبرز آراءهم بكل وضوح.<br />- المسابقة مفتوحة لكل الشباب العربي، من داخل وخارج الأوطان العربية.<br />ورجاء من المعلقين عدم الخروج عن موضوع النقاش."
