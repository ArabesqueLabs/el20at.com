[[comments]]
order = 0
subject = "الموضوع هايف"
author = "ابو اسامة"
text = "اولا موضوع الحضرى ده موضوع تافه من وجهة نظرى لآن الاهلى اكبر من انه يتمثل فى لاعب واحد<br />ثانيا نفترض ان الحضرى اعتزل . يبقى دى نهاية الاهلى . وبعدين حضرى ايه وزفت ايه زجاجة الزيت بقت بتسعة جنيه<br />ختكوا ستين نيلة."
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004152/http://masr.20at.com:80/newArticle.php?sid=14412"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
text = "النادي الاهلي اللي احنا بنفكر فيه ما بيفكرش الا في مصلحة مجلس الادارة وشلة المنتفعين - مصلحة الحضري مش مهم المهم مصلحتهم الشخصية و طظ في مستقبل اي حد يفكر يرتقي - همه فاكرين الاهلي اخر المطاف و بيوهمو الناس دايما بكده - عموما الحضري هو البداية و الايام هاتتكلم"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004152/http://masr.20at.com:80/newArticle.php?sid=14412"

[[comments]]
order = 2
subject = "نقطه نظام"
author = "نيفين نيفى نوفا"
text = "يا جماعه ليه بنحب نجلد بعض<br />الموضوع ليه محورين مهمين<br />الاول ان ليه بنحب نجلد بعض بمعنى ان ليه بننسى حاجات حلوه كتيره عملهلنا انسان قصاد غلطه واحده<br />الحضرى خدم النادى و المنتخب كتير فبلاش ننسى كل ده علشان غلطه عملها<br />عارفه ان ناس كتير هيقولو طيب ما النادى اداله كتير اداله شهره و فلوس و ناس هتقول و دى غلطه عاديه دا ساب الاهلى ف ورطه و الموسم مخلصشى<br />و ده صح بس لو فكرنا شويه ف رغبه الحضرى ف الاحتراف ف اوروبا و ان دى رغبه كبيره عنده و ان سنه بقى 35 و حاولنا نلاقى اعذار ليه الموقف هتقل حدته جامد<br />لازم نقدر رغبات الحضرى حتى لو شايفينها تافهه يمكن هى تافهه لينا بس كبيره عنده<br />المحور التانى و الاهم ان النادى الاهلى عمره ما كان لاعب او goal keeper<br />الاهلى هو الاهلى<br />مش كده و لا ايه"
archived = "2008-03-02"
capture_url = "https://web.archive.org/web/20080302004152/http://masr.20at.com:80/newArticle.php?sid=14412"
