text = "بجد الكلمات رقيقة جدا ومؤثرة وتعبر عن تجربة ليست بالضرورة ذاتية ولكنها صادقة .. نبعت من قلب ووصلت إلى قلوب أخرى وانى اتساءل من الذى ينسى قلبا كهذا؟! ولكن فى الشطر 11 أشعر أن تغيير القافية إلى كاف المخاطب أفضل لتكون دقات قلبى ترفض أن تنساك وقلبى الذى كان كراهب فى محرابك وعصفورة تحتمى بين أغصانك فهو أكثر مناسبة وإلى الأمام"
