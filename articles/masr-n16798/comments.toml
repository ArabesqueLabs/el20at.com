[[comments]]
order = 8
subject = "داليا العقاد اسم ما فيهوش مزيكا"
author = "مش ححبك"
text = "اسم الصحفي لازم يكون فيه فن من اجل ينتشر الاسم ويحقق شهرة للصحفي<br />داليا العقاد اسم جامد وصعب وما فيهوش فن<br />يعني مثلا اسماء الفنانين<br />سعاد حسني محمود ياسين نور الشريف كده اسماء فيها موسيقى<br />واسماء صحافيين فيه مثلا هبه ربيع رضوى حسن تحسي كده ان الاسمين منسجمين مع بعض<br />بلاش داليا العقاد طبعا الاسماء عادة بتكون رباعية شوفي اسم الوالد ممكن يكون مثلا داليا علي داليا مصطفى داليا حسين او اسم الجد حتلاقيه انسب كثير من اسم العقاد<br />مع احترامنا الشديد للاستاذ عباس العقاد<br />سلام"
archived = "2008-07-21"
capture_url = "https://web.archive.org/web/20080721002239/http://masr.20at.com:80/newArticle.php?sid=16798"

