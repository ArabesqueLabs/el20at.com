[[comments]]
order = 6
subject = "صور من الناجحين في الثانوية"
author = "مش ضروري"
text = "بالنسبة لنتائج الثانوية فكما تعلمون ان الثانوية مفترق طرق وكشف سلوك الطلاب<br />يعني مثلا فيه عيال حريفة وحريته دوبوا الكتب في ميه وشربوها لماذا<br />علشان خاطر يدخلوا كلية الطب ويتخرجوا ويبقوا دكاترة ويبقوا اغنيا ويستثمروا في العيانين ويبقوا اغنيا على حساب المرضى وبدل ما يبقوا ملائكة الرحمة اصبحوا جلادين العلاج اللي يدفع<br />اللي معهوش يموت على باب المستشفى<br />يا سلام عليكم يا دكاترة مصر (الا من رحم ربي)<br />وناخد صنف ثاني من الناجحين في الثانوية بس المرادي الخايبين اللي حيدخلوا كلية الحقوق<br />دخلوا كلية الحقوق واتخرجوا واصبحوا محامين ومستثمرين ايضا<br />اتعلموا القانون وفهموا وكانت النتيجة الضحك على الناس والنصب عليهم واكل اموالهم بالباطل وهذا هو حال المحامين في مصر المحروسة<br />بياكلوا بالحرام بالكذب بالخيانه وايضا (الا من رحم ربي)<br />وناخد صنف تالت من اللي ناجحين في الثانوية اللي بيجروا على كلية الشرطة<br />يا ترى ايه هدفهم الشرطة في خدمة الشعب ولا اذلال الشعب وتضييع حقوقه واهانته<br />والمدرس اللي حيدي دروس خصوصية<br />وقس على ذلك كل خريجي الثانوية كل واحد عنده حلم على حساب الشعب<br />ويفضل الشعب صامد بيصارع البقاء<br />لك الله يا شعب"
archived = "2008-07-17"
capture_url = "https://web.archive.org/web/20080717163644/http://masr.20at.com:80/newArticle.php?sid=16798"

