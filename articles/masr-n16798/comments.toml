[[comments]]
order = 3
subject = "منه لله"
author = "واحدة مصرية"
text = "حسبي الله ونعم الوكيل في حسني مبارك واسرته<br />منه لله هو اللي خاربها وقاعد على تلها<br />سايب البلد تتأمرك ويتنشر فيها الجهل والخرافات<br />والفروق بين الناس في المادة بيزيد<br />يا إما ناس غنية ومش عارفة تودي فلوسها فين<br />يا إما ناس حالها يحزن<br />منه لله هو و اللي معاه ربنا ينتقم من اللي عايزين ينزعوا الدين من قلوب الناس واحدة واحد بداية بفصل الدين عن الكوسة بتاعتهم اللي بيسموها سياسة<br />حسبي الله ونعم الوكيل اللم انتقم فإنا مغلوبون"
archived = "2008-07-17"
capture_url = "https://web.archive.org/web/20080717163644/http://masr.20at.com:80/newArticle.php?sid=16798"

