text = "المفروض النائب الاخواني داعية اسلاميو<br />ودخل مجلس الشعب للدعوه الى الله سبحانه وتعالى<br />ما يصدرش منه الكلام دا<br />ما يقلش حراميه ولا كلام فاضي<br />يدعوا الى الله بالحكمة والموعظة الحسنه<br />وانا فاكر عمر التلمساني مره قال عندما سالوه من هم الاخوان المسلمون<br />قال رحمه الله الاخوان المسلمين (وقولوا للناس حسنا)<br />قال لهم اية قرانية<br />للاسف الاخوان المسلمين محتاجين دعاه الى الله يدعوهم الى الاسلام<br />يا خسارة دعوتك يا حسن البنا يا خساره"
