subject = "في حاجات أحسن ممكن نعملها"
author = "مسلم"
posted = "2007-02-27"
text = "أنا أشعر بأشمئزاز لما بشوف حد بيتفرج علي البرامج دي و يضيع وقته امامها اللي لازم انه هيندم في يوم علي أنه ضيعه يا شباب في حاجات كتيره نافعه لكم و لدينكم و للمسلمين أحسن من الهم اللي احنا قاعدين نشوفه في التليفزيون الأخت شيماء انت ممكن تلعبي رياضه او تتعلمي تلاوه القراءن او تتعلمي لغه اجنبيه تعرفي غير المسلمين بالاسلام...في حاجات كتير ممكن نعملها تنفعنا و تنفع غيرنا بس أحنا نخرج خارج الدائره المتخلفه اللي حبسنا أنفسنا بداخلها. والله المستعان"
