text = "[quote name=\"اسماء عوني\"]اللي بيتكلم عن انوثتي يبقى فاقد رجولته كل واحد بيتريق عليا يروح يخبي بناته واخواته ولما حد يقوله انت عندك اخت بنت يحط راسه في الرمل واللي بيتكلموا عن التحرش يروح يشوف نسبة المحجبات والمنقبات اللي بيتم التحرش بيهم<br />وبدل ما نقول لا للمتحرشين واللي بيأذوا البنات<br />:lol:[/quote]<br />بسى بئا يا ست اسماء بما انك طلعتى عن محور الاداب فى الحديث واسبتى لى بانك انسانة معقدة نفسيا ومجنونونا ومش متربيا وللاسف ابوكى وامك هيشيلو زنبك على قلة ادابك ...وعلى العموم انتى بتقولى (اللي بيتكلم عن انوثتي يبقى فاقد رجولته ) لو انتى عاوزا تتاكدى من رجولتى انا ماعنديش مانع تعالى واكيد برجولتى وعلى مدى مصدقيتى وهخليكى انتى الى تشهدى على مدا رجولتى بس انا خايف عليكى علشان انتى عندك ازا فى لسانك فا مش معقول هيكون فى لسانك وفى حاجة تانية ..يابنتى من الاخر انا هريحك روحى الاستاد مع الف سلامة ويارب يتحرشو بيكى يا رب وانا لو شوفتك هتحرش بيكى :lol: بصراحة انا المفرود كلنا نتحرش بل البنت دى واهو مافيش حد هياخد بالو عادى هى لمسة فى ئفشة كدا نفسى اشوفيك هناك بصراحة انتى ما ينفعش معاكى غير كدا :P"
