text = ":P [quote name=\"اسماء عوني\"][quote name=\"الطيب\"]مين قالك ان صوت e]<br />ده الدليل بتاع انك مش فاهم اساسا :lol: :lol: :lol: :lol:[/quote]<br />:lol: :lol: :lol: :P :lol: :lol: :lol:<br />لألأ بجد انتى طلعتى مستفذة جدا جدا جدا<br />وكلامك بيدل فعلا انك محدش رباكى خالص ولو كان فية راجل اشترك فى تربيتك فهوة (شورتها) واحب ابشرك يا هانم انك ان شاء الله لما تروحى الماتش هتتبهدلى<br />ومن كتر بجاحتك يارب يدوس عليكى ال80 الف الموجودين كلهم :zzz<br />وعلى فكرة انا بفهم اكتر منك لانى لما غلط اعترفت بغلطى<br />لاكن لدور والباقى عليكى :-* (يا شيخ الغفر) ولا تحبى اقولك يا (سوكة يا مجنونة)<br />وبعدين انتى واخداها بصدرك لية اهدى كدة وهدى العب وروحى الماتش الهى وانتى هناك يولعو فيكى بدل ما يولعو فى كوتش عربية اهوة على الاقل انتى ارخص منة بشوية<br />زابقى اسمعى كلام المعلقين الى قالولك اعملى عملية واقلبى ولما تقلبى ابقى تعاليلى وانا اعرفك معنى الرجولة اية يا (سوكا)"
