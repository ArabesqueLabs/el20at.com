text = "الأخت ( أو بمعنى أصح الأخ) أسماء عوني :<br />أحب أبشرك أن فيه دلوقتي عمليات تحويل جنس (يعني لو أنتي شايفه نفسك أرجل من كل الرجاله يبقى خلاص ..توكلي على الله وحولي نفسك لراجل )...<br />وبعدين لما أنت عايشه في السويد وشغاله في السويد وبتلعبي كوره في السويد (اللي هيه بالصدفه أغنى دوله في العالم تقريباً)، إيش عرفك أنتي بمصر وبنات مصر ورجالة مصر وعيشة مصر .. أنتي تلاقيكي لا شفتي مصر ولا جربتي زحمة مصر ولا صعوبة الحياه فيها ، وجايه تقولي لي أرجل من شباب مصر ورجالة مصر ، يا شيخه روحي، خليكي في السويد واقبضي باليورو واستمتعي بالخدمات الصحيه والتعليميه والمواصلات الفارهه الراقية ، وقال تقولي بربي إخواتي ، لو معاكي الجنسيه السويديه تلاقيهم بيدوكي معونات ليهم ومرتب أعلى ومش بعيد يكونوا هم اللي بيربوهملك أساساً ... اتفرجي على الماتش من السويد مع البوي فريند بتاعك ( أو الجيرل فريند بمعنى أصح) .....<br />بالمناسبه فيه في السويد مصحات نفسيه على أعلى مستوى ، أقترح أنك تروحي زياره كده شهرين كده ولا تلاته وهتحسي بالفرق والله ، الطب النفسي تقدم على الآخر ...ز"
