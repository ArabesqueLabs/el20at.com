text = "بسم الله الرحمن الرحيم<br />فيه ايه يا اخوانا<br />انتوا مكبرين الموضوع ليه كده<br />انا اكيد مع راي ان مش هينفع يكون فيه بنات في الاستاد ( مع كل الاحترام لبنات بلدي طبعا )<br />لكن الاستاد باذن الله مش هيكون فيه مكان حد يقف فيه اساسا مش يقعد كمان<br />و يا اخت ( أسماء عوني ) ارجوكي بلاش الهجوم ده<br />انتى في الاول خالص عبرتي عن رأيك غلط مش تيجي بعدين تحاسبي الناس على رأيهم<br />انتي في الرد الاول غلطتي لان مع احترامي ليكي انت ممكن تكوني بتفهمي في الكورة اكتر من بعض الشباب (بس مش كلهم )<br />و بعدين ده مش ماتش عادي لفريق من الدوري (ده ماتش حياة او موت زي ما بيقولوا )<br />و بعدين في ردك التالى انتى قولتي بعض الجمل جميله جدا و انا مؤمن بيها<br />ان البنت المصريه بـ 100 بنت من برة (مش 10 بس ) بس احنا كمجتمع شرقى لازم<br />نحافظ و نخاف على صورة بناتنا كرامتهم مش اكتر<br />كل الناس اللى ردت عليكي لازم يكون ده رد فعلها من كلامك اللى في اول التوبيك<br />بس اللى شاف باقي ردودك هيفهم انت قصدك ايه<br />و مع احترامى ليكي انت و كل بنات اغلى حاجه في الدنيا ( مصر ) ارجوكي بلاش تروحوا الماتش ده<br />خوفا عليكوا مش اكتر"
