text = "[quote name=\"احمد الاسكندرانى\"]بدون تجريح انا هاتكلم بصراحة بذمتكم يابنات ياللى بتروحو ا الاستاد انتو مش عارفين ومش مجربين اللى بيحصل من معاكسات وتحرشات ولا انتم عاجبكم كده بلاش بقى نضحك على بعض لو انتى مصممة تروحى يبقى انتى موافقة على اللى بيحصل للبنات فى الاستاد[/quote]<br />مش معنى حب بنت لبلدها يا استاذ انها بتروح الاستاد علشان اللى انت قصدك عليه ما هو مع احترامي لكل الشباب المحترمه بس مصر يعني ايه بنت تروح علشان تشجع منتخب بلدها تتعاكس و يتم التحرش بها ؟؟<br />انت لم اختك معاك في اي مكان هترضى بكده ؟؟؟<br />و اللى بيحصل في الاستاد ده مش غلط من البنات لا بالعكس<br />ده نقص دين و جهل و قلة ادب .....الخ (من الشباب طبعا )<br />بس بردوا ده مش بيخلي مسئولية البنات اللى مش محترمه<br />و بعدين يا اخي حب لبنات الناس زي ما بتحب لاختك بالزبط<br />و دى مش طريقة رد خالص :sigh:"
