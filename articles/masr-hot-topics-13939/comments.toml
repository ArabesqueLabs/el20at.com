posted = "2009-11-13"
text = "شيخ الغفر ( سوكا )<br />طبعا لسانك الطويل و قلة الادب شيء موش جديد عليكي و كل اناء بما فيه ينضح .. و ده واضح من مدونتك الهبلة اللي ما اخدتش 10 % من الردود اللي جتلك ف التوبيك ده .. فيه بس حاجه كده انتي قولتي ( وبدل ما نقول لا للمتحرشين واللي بيأذوا البنات ... نقول لأ للبنات ماتروحوش عشان المتحرشين هايبقوا هناك ههههه قمة التخلف والجهل والحقاره والجبن )<br />بذمتك موش مكسوفه من نفسك ... ماهو البنات لو مارحتش الشباب موش هايلاقوا حد يتحرش بيهم يا سوكا ;-) , عاوزه توقفي النتيجه من غير ما تبصي للسبب ..<br />و بعدين مين قالك اني معقد .. انتي اللي كل ما حد يكسفك تقولي حاجه من اتنين , ربنا يشفي او انت معقد ..<br />شيخ الغفر سوكا .... وقتك خلص , دماغنا بقه"
