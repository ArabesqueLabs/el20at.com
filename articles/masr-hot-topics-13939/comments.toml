posted = "2009-11-12"
text = "الاخت اشرف<br />والاخت واحد معدي<br />والاخت ايمان المحمدي<br />الاخ ابو يوسف<br />والاخت حسام العقبي<br />بما ان التعليقات دخلت في نطاق شخصي فانا بس احب اوضح<br />انا ما قولتش اني ارجل من الرجاله ولا اني راجل والعيب على اللي كتب الموضوع وحاطط نقط ومن غير ما تكملوا بقيت الموضوع وتقروه كله على بعضه بس دي مش مشكلتي<br />مدونة مكعب سكر<br />ادخلوا ودوروا براحتكوا واقروا كويس<br />انا ماقولتش تجمعولي فلوس يا اخ انت .. كفي نفسك .. انا من مصر وعشت في مصر سنين عمري كلها<br />واخواتي كبروا والحمد لله اخويا متحضر ومتعلم ومحترم ووموافق اني اروح<br />والاخت اللي بتقول في اخر كلامها<br />\" الا لو هي عايزه كده \"<br />ربنا يشفي .. مش هاقول غير كده<br />بالنسبه للاخت واحد معدي<br />انت شكلك واحد معقد مش معدي وواخد موقف من البنات كلها واظاهر كمان انك ماتعلمتش وفاكر ان الست دي معموله عشان تشتغل عند الراجل<br />مش عايزين نخش في منطقه جدليه اكتر من كده<br />بس اخر الكلام يعني<br />الجهل وحش .. حقيقي يعني وعلى راي محمود عبد العزيز الاناسن ضعيف :D<br />الكابتن اللي بيقول اني لوكال<br />ربنا يشفيك انت كمان يابني<br />فعلا عمار يا مصر"
