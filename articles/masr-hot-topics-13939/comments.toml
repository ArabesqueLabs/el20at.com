text = "السلام عليكم<br />تحيه لكل مصرى وتحيه لكل عربى وتحيه لكل مسلم<br />يا جماعه فى الاول المتش ده ترفيه لينا يعنى المفروض ان احنا منتعصبش عشان خاطر بنت قالت كلمه او ولد قال كلمه<br />بس انا عندى مبدء ليه اودى اختى للاستاد وانا عارف ا هيكون زحمه مووت<br />انا كاخ مش هعرف اسيطر على الناس كلها واكيد هيا تتلمس فقط<br />طبعا انا بقول لمسه خفيفه لو حد معدى جمبك او ونتا داخل البوابه وربنا يستر<br />فين بئى احترام والعفه للبنت الى هتكون عارف ان ممكن تتلمس هناك ولا انتى عايزه كده ؟؟ وطبعا 10 % هيروحو لان هما عيزين كده لا حول ولا قوه الا بالله<br />وفين الراجل المحترم الى يودى اخته او بنته او مراته وهوا عارف كده<br />يا جدعان المشكله ان معظم البنات مبئوش بنات فكرين نفسهم رجاله الموضوع عادى بالنسبلهم وده طبعا حرام تانى حاجه فين انوثة البنت وهيا عماله تشجع وتجعر وتقول مصر تالت حاجه بيتعبوا الباقى (_______ بلاش توضيح)،،<br />والرجاله مبئوش رجاله لان الراجل ميسبش الحريم بتوعو كده<br />انا اقول كلمه بسيطه الى كل وحده و وواحد،، شاب وبنت ،، راجل وست<br />اتقو الله يجعل لكم مخرجا<br />بس"
