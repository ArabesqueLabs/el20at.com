text = "بصراحه انا اعتقد ان فكرة ذهاب البنات للأستاد فكره جيده عشان يعملوا زي فيلم الزواج علي الطريقه الحديثه كده , \"عترييييييس , بص فـ عينيه يا حبيبيييييييي\" هاهاهاههاهاهاهاهاهاها<br />يارييييييييييييت كل واحده تقعد في بيتها بـ احترامها عشان شرفها وانا والله بتكلم بجد , البنت ولا الست اللي عايزه تروح تبقي مش خايفه علي شرفها واللي يوافق انه يودّي اخته ولا مراته ولا امه ولا صحبته يبقي مش خايف عليهم"
