text = "اللي بيتكلم عن انوثتي يبقى فاقد رجولته كل واحد بيتريق عليا يروح يخبي بناته واخواته ولما حد يقوله انت عندك اخت بنت يحط راسه في الرمل واللي بيتكلموا عن التحرش يروح يشوف نسبة المحجبات والمنقبات اللي بيتم التحرش بيهم<br />وبدل ما نقول لا للمتحرشين واللي بيأذوا البنات ... نقول لأ للبنات ماتروحوش عشان المتحرشين هايبقوا هناك ههههه قمة التخلف والجهل والحقاره والجبن<br />اكيد كل واحد فيكوا عنده عقده ما في كاية البنات دي بالذات<br />الاخت اشرف دي<br />:lol:"
