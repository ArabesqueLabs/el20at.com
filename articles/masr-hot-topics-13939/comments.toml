text = "انا بعشق الكوره والمنتخب والنادى الاهلى وبروح الاستاد من وانا صغيره مع والدى وعمى اللى هما مسكين اداره نوادى فى القاهره والجيزه . بس فى حاجه انا لما كنت بروح الاستاد بالذات كان والدى وعمى متاكدين ان الاستاد فيه مدرجات خاليه اولا عشان نستمتع بالمشاهده ثانيا عشان ميحصلش اى تحرش من بعض الشباب اثناء دخول وخروج المباراه بالرغم انى ببقى فى وسط والدى وعمى ,اما بقى بالنسبه للاخت المتعصبه اوى وبترض على واحد واحد ومش راضيه تقتنع ان ده لا مكانها ولا وقتها ولا ظروف الماتش تسمح تروح الاستاد فى يوم ذى ده هى حره لوعايزه تروحلى اتفضلى محدش من اللى بيكتب كومنت ماسكك دول بيقولوا رايهم مش اكتر بس اتنى اللى مسئوله على اللى ممكن يحصلك الا بقى لو انتى عايزه كده."
