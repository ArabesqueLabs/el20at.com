subject = "(الخمور)تصلح و تنشط الكلى و (الحاجة الساقعة)تسبب ه"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-24"
text = "للاسف و بعد الزياذة الرهيبة المفتعلة لاسعار (الحاجات الساقعة)<br />اتضح الاتى علميا و عمليا ان:_<br />(الحاجات الساقعة)كلها تسبب الاصابة بمرض السكرى و هشاشة العظام؟<br />امااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا ؟!!!<br />فهى و للعجب تعالج من :_<br />تصلب الشرايين<br />علاج و تخفيض الكولستورول بالدم<br />تنشيط الكلىو الكبد<br />و امراض اخرى كثيرة الخمور تعالجها و لكن اذا تم تعاطيها بالكميات المعقولة؟!!!<br />اليس امرا مضحكا و يستحق الدراسة؟؟؟؟؟!!!<br />و اهةةةةةةةةةةةةةةةةةةةةةةةةةةة يابلد بتاعت زيادة أسعار بكل تغابى و جشع<br />(الخمور) أصبحت تقارب أسعار (الحاجات الساقعة)<br />موش دى الكارثة بحق و حقيقى!!!<br />دى حاجات حرام و اللة العظيم"
archived = "2010-03-14"
