subject = "البلد الوحيد"
author = "محمد زيادة"
posted = "2008-11-21"
text = "للعلم مصر هي البلد الوحيد التي يتم فيها تعبئة البيبسي والكولا مرة أخرى.. لا توجد دولة في العالم الا مصر بها هذا النظام<br />فالأصل هو بيع الزجاجة كاملة بنفس سعرها، أما ترجيع الزجاجاة للبائع فهو امر كوميدي لا يحدث الا في مصر للاسف.<br />هذا بجانب اختلاف طعم الكولا في مصر عن غيرها."
