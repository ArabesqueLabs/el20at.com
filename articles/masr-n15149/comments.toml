[[comments]]
order = 3
subject = "الوطنى فاسده و الاخوان بتوع مصلحتهم"
author = "مصر"
text = "الاخوان للاسف الشديد طلعوا نفعيين بشكل يكسف هما مستعدين يبذلوا التضحيات من أجل مصلحتهم السياسيه<br />لكن مش علشان المصلحه العامه بدليل التراجع عن التحرك الشعبي العام مهما كانت الحجج و مهما كانت ظروف الجماعه صعبه"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073447/http://masr.20at.com:80/newArticle.php?sid=15149"

[[comments]]
order = 4
subject = "الاخوان للاسف الشديد طلعوا نفعيين بشكل يكسف هما مستعدين يبذلوا التضحيات من أجل مصلحتهم السياسيه"
author = "مش بحبك"
text = "الى الاخ اللي فوق<br />ممتاز ممتاز ممتاز انت جبت التايهة<br />الاخوان بيعملوا لمصلحتهم الشخصية الاخوان يا امها هما يبقوا في الصورة يا اما بلاش<br />الاخوان دول بقوا عاملين زي الشيعة بتوع حزب الله<br />انا بكره الاخوان انا بكره الاخوان<br />مع الاعتذار لشعبان عبدالرحيم"
archived = "2008-04-14"
capture_url = "https://web.archive.org/web/20080414220925/http://masr.20at.com:80/newArticle.php?sid=15149"
