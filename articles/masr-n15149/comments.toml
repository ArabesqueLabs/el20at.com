subject = "فقد الاخوان اى تعاطف بعد موقفهم المتخاذل من الاضرا"
author = "زعبلة"
posted = "2008-04-11"
text = "قوى الشعب العامل فلاحين وعمال وطلبة خدعوا بانسحاب الاخوان من الاضراب وفقدوا اى تأييد شعبى باتفاقهم مع النظام الحاكم الفاشل<br />ومهما قلتم فكلة باطل<br />لقد خزلتم ثورة 52<br />والان تخذلون ثورة الشعب ضد الديكتاتورية والحكم البوليسى القمعى<br />يبقى محش منكم يرفع راسة<br />يا منافقين"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073447/http://masr.20at.com:80/newArticle.php?sid=15149"

