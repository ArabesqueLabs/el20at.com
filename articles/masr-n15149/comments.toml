subject = "للإخواااااااااااااااان...... كفاية نفاق"
author = "أبن البلد"
text = "أنتم معاهم معاهم .... عليهم عليهم .... كفاية نفاق ..إسراء بكل الجماعة دى .. مفيش مصلحة مفيش مشاركة ..أنتم وجه تاني للنظام الفاسد..((((((((((((((( مـا أســـخم مــن ســـتي الا ســـــــــــيدي ))))))))))))))))))))))))))"
archived = "2008-04-12"
