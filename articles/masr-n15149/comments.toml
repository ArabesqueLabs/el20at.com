[[comments]]
order = 4
subject = "الاخوان للاسف الشديد طلعوا نفعيين بشكل يكسف هما مس"
author = "مش بحبك"
posted = "2008-04-13"
text = "الى الاخ اللي فوق<br />ممتاز ممتاز ممتاز انت جبت التايهة<br />الاخوان بيعملوا لمصلحتهم الشخصية الاخوان يا امها هما يبقوا في الصورة يا اما بلاش<br />الاخوان دول بقوا عاملين زي الشيعة بتوع حزب الله<br />انا بكره الاخوان انا بكره الاخوان<br />مع الاعتذار لشعبان عبدالرحيم"
archived = "2008-04-14"
capture_url = "https://web.archive.org/web/20080414220925/http://masr.20at.com:80/newArticle.php?sid=15149"

[[comments]]
order = 5
subject = "شباب أزهى عصور الديموقراطية"
author = "أبو نظارة"
posted = "2008-04-15"
text = "ايه الديموقراطية دي يا شباب ، هو أي حد تختلفوا معاه في الرأي يبقى منافق وخاين ومتخاذل ، مش شايفين ان ده هو نفسه اللي بيعمله النظام مع المعارضة ؟ ومش شايفين ان الاخوان ياما عملوا حاجات ووقفوا وقفات لوحدهم وهم بس اللي دفعوا تمنها غالي جدا وعمرهم ما قالوا عنكم أو عن أي حد ما وقفش معاهم كلام زي ده ؟<br />أرجوكم راجعوا أنفسكم ، مش علشان الاخوان ، لا والله ، انما علشان حرام النظام الديكتاتوري يعدينا ويبهت علينا بالشكل ده<br />لكم تحياتي"
archived = "2010-03-14"
capture_url = ""
