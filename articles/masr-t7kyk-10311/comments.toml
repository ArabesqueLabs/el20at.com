posted = "2008-10-31"
text = "لو كان لى من المال الكثير حقا؟<br />لاشتريت شقة و فيلا و قصر<br />من هشام طلعت مصطفى؟<br />يكفى انة طهر مصر من غانية مومس باغية من ممتهنى الفن و الرزيلة بنت حوارى و مجارى لبنان؟<br />لكن معلش (العين بصيرة و الايد قصيرة)<br />قلبى معك يا هشام"
