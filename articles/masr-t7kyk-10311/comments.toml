subject = "يا عيني على مراته وعياله"
author = "مش كاتب"
posted = "2008-10-22"
text = "الراجل دا متجوز يا جماعة وعنده عيال<br />يا فضحتهم يا فضحتهم<br />الست حتوري وشها للناس ازاي لما جوزها بيدفع ملايين في واحدة غيرها<br />جوزها مش محترم<br />جوزها بتاع نسوان<br />يا عيني عليكي يا مرات هشام طلعت مصطفى<br />ويا عيني عليكم يا ولاد طلعت مصطفى<br />حتودوا وشكم من الناس فين دلوقتي<br />معلش ابوكم طلع عرا"
