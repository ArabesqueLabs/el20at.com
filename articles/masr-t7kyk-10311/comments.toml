posted = "2008-11-02"
text = "يعنى جمال وعز وبقية الشلة مش عارفين انة سوزان تميم هى القير فرندبتاعت هشام زى ماكل واحد فيهم عندة قير فرند وكلة بيحكى لبعضة عن مغامراتة وحبة لدى وكرهة للتانية وبيتفاخروا بينهم وبين بعض انة انا حطير الموزة اللى معاك وكدة كلام بحكم الشراكة المتشعبة بين التلاتة حصل تنافس من جناح تانى برعاية الاخ المتدارى عن الاضواء السياسية وشغال بزنس تقيل مع شلة منافسة لشلة اخوة بتاع السياسات عارفينوة بتاع مصر بتتقدم بية هو وصحابة لوحديهم المهم القضية برمتها قضية تصفية حسابات وتكسير عظام"
