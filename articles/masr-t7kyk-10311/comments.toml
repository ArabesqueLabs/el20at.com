[[comments]]
order = 6
subject = "اشترى عندة شقة وفيلا واشترى اسهم فى شركاتة"
author = "شفيق ياراجل"
posted = "2008-11-01"
text = "هشام راجل عملى ووطنى وخلوق ومش نصاب يعنى عمرة منصب على حدوخدفلوسة يعنى اللى عاوز يشترى منة اهو منتجات عقارية مبتكرة ومدن سكنية جديدة ومطورة ببنية تحتية وفوقية واستثمار بيزيدمع الوقت حديقدريقولى العقارات فى مصر نزلت علىمدى التلاتين سنة اللى فاتوا طبعا لا منزلتش امابالنسبة للحكومة فهى ملزمة حسب الوعود الرنانة انة هى حتعمل مساكن وشقق لذوى الدخول الضعيفة من الفقراء والمساكين والناس المعدمة من الفقر اء ودة طبعا مش حيحصل فى العهدالميارك اللى احنا عايشينة ولا عصراللى بعدة لوكان ماشى على خطى ابوة لان النظام يرزح تحت مافيا فساد متغلغل فى جذور ومفاصل البلد من الصعب القضاء عليها فى المستقبل المنظور اما من ناحية هشام طلعت مصطفى فاقولة الذى اصابك ابتلاء من اللة وافتكرت تعليق جميل لاخ فاضل فى الموقع دة كان بيقول انة الزنا والغنى لايجتمعان وان اللة يمهل ولايهمل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "ايوة اشترى شقة عندة بس بشرط"
author = "كسرولة الغرام"
posted = "2008-11-02"
text = "انة رئيس مجلس الادارة الكبير والحقيقى يمشى هو ونظامة الفاسد اللى مقدرش يتواكب مع العالم وبقى مبسوط بتخلفة بسبب التمادى فى النهب والسرقة يمكن لمااخد شقة مثلا واقسطها على كام سنة فى الاخر حتبقى لى وملكى انما النهاردة انا وتمانين مليون بنتسرق كل طلعت شمس وفى الاخر حنسدد الديون المتراكمة من السرقات من قوتنا وقوت اجيالنا القادمة بدون ادنى مقابل الا انة احنا رضينا على نفسنا انة دة يحصل لينا واحنا قاعدين بنتفرج عليهم"
archived = "2010-03-14"
