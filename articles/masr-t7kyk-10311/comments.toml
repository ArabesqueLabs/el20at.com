subject = "انا واخد فى مدينتى فيلا منطقة 2 على الجولف كوست"
author = "شادى"
posted = "2008-10-27"
text = "بقالى اكتر من سنة بادفع وظامن حقى باذن اللة مع الناس دول وبعدين لازم نعرف انة هشام لسة متهم ماثبتش علية حاجة واتمنى من كل قلبى انة يخرج من المحنة اللى هو فيها ويرجع لولادة ومراتة وشغلة دى حاجة -الحاجة التانية اقسم باللة العظيم انى مبعرفش هشام مصطفى ولا قابلتة فى حياتى هو او اخوتة او موظفية او موردية ولالى علاقة مباشرة اوغير مباشرة ولو كنت اقدر اوصل للريس او حد يقدر يفك طلاسم اللغز المثير اللى شغل البلد"
