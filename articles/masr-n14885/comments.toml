order = 0
subject = "ثقافة السذاجة"
author = "اسامه صلاح"
posted = "2008-03-27"
text = "السلام عليكم ورحمة الله وبركاته مضمون الحوار يصابني بالاحباط الشديد من المحصلة النهائية لسطحية وسذاجة الفكر والتفكير والحكم والاختيار فنحن نختلف عندما لا يوجد مجال للاختلاف (فالامور واضحة دون تثقيف او شهادة دكتوراة او فتوي) اولا لا توجد حرمانية للتوريث حيث لا يوجد نص او سنة في هذا الشأن ثانيا التوريث من امور الدنيا التي اخبرنا الرسول الكريم باننا اعلم بشؤنها ( يعني حلال لنا ان نجعلها ملكية او مورثة او حكم يتغير سنويا او حتي كل مئة سنه فهذه شؤن دنيانا ) وبالتالي ترك الرسول الكريم موضوع الخلافة من بعده دون تزكية لاحد تركها لمن يراه الناس اصلح ويجتمع الراي عليه رغم كونه الاحق بتزكية وتوريث من يريد ثالثا : الحكم كشؤن دنيا سواء في نظام ملكي او رئاسي او فيدرالي خاضع لقانون دنيوي واحد وهو ( الحكم لمن هو الاصلح للشعب من حيث توفير الحق والعدل والامن والقدرة علي تنمية المجتمع وزيادة معدل رفاهيته وحريته) حتي في النظام الملكي اذا وصل للحكم من هو ليس كفء له ( يسقط فورا سواء من الشعب او بفعل طامع في الحكم اقوي منه) رابعا : الاختيار في علم الادارة لا يكون صحيح ولا يحقق نتائجه الا اذا توفرت البدائل المتكافئة لحظة الاختيار فيتوفر للمجتمع عنصر المفاضلة المربحة النافعة فيختار من يضيف له المكاسب والمميزات الاعلي وعلي هذا الاساس فلاختيار من واحد او اثنين لا يجوز علميا وليس دينيا خامسا : تكمن المشكلة الاساسية في المعروض للاختيار وحقيقتهم الزائفة التي يصورها الاعلام لنا ( كما في اعلانات التلفزيون الخداعة) وهكذا لا يعقل لاي ساذج ان مصر بكل اساتذتها و علمائها وقوضاتها ليس بها من تتوفر فيه الحد الادني من متطلبات تلك الوظيفة ليدخل في هذا العرض هذا ان لم يكن بها من هو اقدر علي تولي زمام الامور وهم كثير سادسا : دور الملك او الحاكم من الناحية التخصصية هو تمثيل الشعب والمحافظة علي نظامه وحقوقه عن طريق الية متخصصة في جميع المجالات وشرط تولي هذا الدور الاساسي هو عدم الطمع وانكار الذات امام رؤية الشعب والاصرار علي اقامة العدل والامن والمحافظة علي الحقوق الداخلية والخارجية وايضا القدرة علي ممارسة الادارة العلمية وبمعني اخر اي خريج لمدرسة الادارة وليس كلية الادارة قادر علي ممارسة هذا الدور اخيرا : لما الاختلاف بيننا والامور واضحة كالشمس والارض ولادة لخير اجناد الارض , لما ننظر لنصف الكوب المملوء كما يريد البعض ولا نري انه مملوء بالسموم وليس بالماء , تلك الثقافة البائسة هي نتاج جيل كامل من ابائنا الضعفاء الذين غيروا او سمحوا بتغيير سلوكنا وثقافتنا وطرق تفكيرنا ( مسؤؤلين - علماء - كتاب - معلمون الخ وكل من كان يحمل مسؤلية اكبر من تفكيره مسؤلية لم يتفهمها وظن غرورا انه قادر عليها وهي امانة العلم )"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174859/http://masr.20at.com:80/newArticle.php?sid=14885"

