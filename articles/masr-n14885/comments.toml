[[comments]]
order = 2
subject = "تعليمات الحاج فتحى لاعضاء مجلس الشعب ( منقولة بتصر"
author = "فتحى المسرور"
posted = "2008-03-28"
text = "العضو الزفت اللى ييجى الجلسة ما يتاخرش<br />واللى مش جاى الجلسة فى ستين داهية<br />واللى هيجيب معاة موبايل كاميرا علشان يصور هافقع عنية الاتنين<br />كلام فى الجلسة مفيش<br />تقعدوا مكشرين وتحترموا انفسكم<br />اللى مش هيسقف جامد ها اقطع ايدية<br />ترغى مع اللى جنبك ها اكسر سنانك<br />الكلام اياة عن طوابير لخبز والغلاء والسرقة تبطلوة لحسن اسكنكم القرافة<br />اللى هيجيب سيرة الحزب الوطنى والا لجنة السياسات - هتبقى وقعة اهلة سودة"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174859/http://masr.20at.com:80/newArticle.php?sid=14885"

