[[comments]]
order = 1
subject = "فعلا كلام مظبوط"
author = "جمال محمود معتوق"
posted = "2007-06-24"
text = "فعلا هذا ألكلام حكيم جدا جدا ألحل ألوحيد لوقف ألتمثيل على ألشعب ألمصرى هو انحلال ألمسرح ألذى يقع فى شا رع ألقصر ألعينى ونقله الى كل بيت مصرى فهما أولا بالمصاريف الذى تصرف على هؤلاء ألممثلين ألدجالين فهم يضرون ألشعب ألمصرى بحجة أنهم يعملو جاهدين من أجل هذا ألشعب ألطيب ألعبيط ولكن للاسف فهم يعملو لأجل مصلحتهم ألشخصية وهم بتمثيلهم ودجلهم يعملو جاهدين لمصلحة أسيادهم وألضحية هو ألشعب ألذى يعطيه صوته لتنبح ألأصوات"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "أسألهم"
author = "جمال محمود معتوق تانى"
posted = "2007-06-24"
text = "أسألهم ياأستاذ مدحت بشاى أسألهم هل أنتم أيها ألممثلين ألدجالين ذو ألأماكن ألبعيدة مثل ممثل سيناء أو دجال أسوان أو ألمنافق بتاع ألوحات ألداخلة أو ألخارجة أن يحضر و ألجلسات يوميا أم لأ أسألهم بعد ما تسئلهم عرفهم أنهم مخادعون للشعب كما قال ألكتاب ألأخضر ألليبى أو وزع عليهم كل واحد نسخة يقرأها يمكن ضميرهم يصحى وأسألهم أيضا أيها ألممثلين ألدجالين هل ألشعب ألمصرى يشارككم ألأراء فى بعض ألقضاية ولا أنتم فى وادى ألمصالح ألشخصية وألشعب فى وادى أخر يا ترى فى أى وادى هذا ألشعب ألمسكين هم هؤلاء ألدجلين عارفين أنه فى وادى ألغلاء ومشاكل اخرة مثل ألأسكان وألمقابر وألأستغلال وألتعذيب فى أقسام ألشرطة وأهانات أخرة ألخ ألخ ألخ"
archived = "2010-03-14"
capture_url = ""
