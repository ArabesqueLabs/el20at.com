subject = "باحث فى العلوم السياسية"
author = "محمد مجيد سيد إبراهيم"
posted = "2008-01-28"
text = "بسم الله الرحمن الرحيم<br />خباب فى البداية أود أن ابدى إعجابى الشديد بالمقال ، فانك استطعت وبمهارة الصحافى المتمكن من استخدام ادواته بمهارة أن تكتب ما تريد دون اخلال بالنص او مط بلا داعى ، كما انك كاتب ذو رأى وبصمة واضحة بلا انحياز أو خوف ، ونحن نفتقد بالطبع هذه الكتابات رغم مناخ الحروية ، فكما تعلم هناك أبواق كثيرة ولكن بلا معنى حقيقى أو هدف.<br />فى مقالك استطعت أن أقراء من بين السطور والذى ساعدنى على هذا بالطبع مهارة كاتب هذه السطور أن ما يقال شئ والحقيقة شئ آخر ، حقيقة وضع يراد به وضع مصر وفصلها عن باقى العالم العربى كما حدث فى سوريا، وارجو من الله الا تقع مصر فى هذا الأمر .<br />كما اننا نستطيع ان نجد وبصورة واضحة انه وحتى فى الآلم والمآسى التى تلحق بوطننا العربى نجد دائما المستفا واصحاب المصالح مثل هؤلاء الذين كنوا يطلقون عليهم \"سماسرة الحرب\"، واليوم أصبحوا \"\" سماسرة الأزمات\""
