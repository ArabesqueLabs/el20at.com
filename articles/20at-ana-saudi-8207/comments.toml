author = "غامدية اصليلة"
posted = "2008-03-06"
text = "يامغفل ياللي تقول العروس مو اصيلة والله انها بنت اسيادك .وهي من قرية معروفة في غامد وهي قرية المصنعة وقد سميت هذه القرية بهذا الاسم لان اهلها قديما كانوا يصنعون الاسلحة والسيوف وهذا شرف وليس عيب لانهم كانوا يدفعون بها عن شرفك وعرضك يا من تتحدث عن اعراض الناس ولكن الحسد يصنع اكثر من ذلك وما أنت ألا شخص حسود. ولايهم السحاب نبح الكلاب."
