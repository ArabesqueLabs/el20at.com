posted = "2008-02-22"
text = "الله يوفقهم واللي يقول خساره .. لا ماهي خساره دامها زواج وبالحلال ! ..<br />وبالنسبة للموضوع اللي يتكلم عن طرق أعلان الزواج .. فما ادري احس انها دعاية اكثر ماتكون باعلان الناس .. لكن اعتقد فيها جانب ايجابي بعد .. اللي هو انه اعلن النكاح في وسيلة منتشرة .. والله يوفقهم اذا كانت نيتهم صافيه ..<br />تحيـ1تي"
archived = "2012-02-02"
