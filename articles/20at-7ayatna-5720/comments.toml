subject = "رجلى وجعتنى من اللف"
author = "ديمة"
posted = "2007-05-04"
text = "ايه اللى يطلعك لوحدك من الحارة وانت صغير اكيد طيعا فى بلطجية<br />وايه اللى يخليك تطلع السطح وانت كبير اكيد فيه ساوبرس وحرامية<br />وايه اللى يخليك تسألنا احنا عن طوبجى اكيد فى ناس قديمة فى الشارع قد تساعدك فى هذه حل القضية<br />بس انا فى رأيى انك فعلا تعتبره الطوبجى بتاع زيزنيا<br />الموضوع حلو اوى يجد، تسلم ايدك"
