[[comments]]
order = 8
subject = "الى بتاع لا ترموها بحجر"
text = "لا ترموها بحجر تدل على انك مسيحي<br />وبعدين في تعليقك قلت المتأسلمين وهذا تعبير قبطي<br />الاقباط هما الذين يصفون المسلمين بهذ الوصف<br />يعني حضرتك مسيحي قبطي<br />ايه بقا المتاسلمين غلطوا في ايه<br />قلنا ان فيه حاجه اسمها علامات يوم القيامه اليوم اللي سيفصل الله بيننا وبينكم\\\\<br />وقلنا ان من هذه العلامات تشبه الرجال بالنساء وتشبه النساء بالرجال وهذا ايضا موجود عند المسيحيين اكثر من المسلمين<br />اخطأنا في ايه بقا يا حضرة القبطي الفيلسوف علشان خاطر حضرتك تقول هذا مقرف ومثير للغثيان<br />لما تحس بالغثيان مرة ثانية ابقا مصلك لمونه يا سيدي<br />وبعدين في تعليقك واضح اوي حقدك على العرب لان انت وامثالك اتربيت على كراهية العرب وعمر بن العاص<br />مع ان الرب بتاعكم على حد قولكم غير الانجيل وخلاه بلغة العرب<br />لما يكون انجيلك بالعربي وانت بتقرأه بالعربي ازاي تكره العرب يا ............<br />سلام يا قبطي وسلملي على الانبا بيشوي"
archived = "2008-08-17"
capture_url = "https://web.archive.org/web/20080817041505/http://masr.20at.com:80/newArticle.php?sid=17239"

[[comments]]
order = 9
subject = "المتاسلمون مرة اخرى"
author = "برضة انا"
text = "اختلفنا فى الرأى فعلى حسب العقلية الصلدة اكون نصرانيا قبطيا<br />كلا يا عزيزى فانا مسلم وموحد باللة وربما من ايام جدى الذى كان يعبد رع الالاة الواحد الاحد الذى تشرق لة السموات<br />ماذا تريدون بأحاديثكم التى ليست فى موضعها تماما<br />تحمل اولادها على كتفها وتتسول فى الطرقات<br />تمشى فى طريق المعصية وتاكل من ثدييها وتبيع شرفها لكل من يعطيها مالا<br />امرأة مكافحة تعول اولادها بعمل شريف قد يكون صعب ولكنة الشىء المتاح امامها<br />ندعوا لها بالتوفيق ام نقول التشبة بالرجال والتخنيث وعلامات الساعة وكلام لا يطعم اطفالها الجياع<br />اختلف معك فى الراى نعم ولكن يجب ان احترم رايك<br />وما يغيظنى هو اقحام الدين بطريقة او باخرى فى امور بعيدة عن الافتاء واخذ الرأى الشرعى من اصحابة واهلة فى الازهر<br />الرأى الدينى لرجال الدين الدارسين وليس بعض الهواة المتأسلمين الذين يفتون بغير علم<br />وعموما فليغفر لنا ربنا خطايانا وليسامحنا"
archived = "2008-08-17"
capture_url = "https://web.archive.org/web/20080817041505/http://masr.20at.com:80/newArticle.php?sid=17239"
