[[comments]]
order = 3
subject = "تشبه الرجال بالنساء وتشبه النساء بالرجال"
author = "مش لازم"
text = "تشبه النساء بالرجال وتشبه الرجال بالنساء:<br />قال رسول الله صلى الله عليه وسلم: \\\\\\\"من اقتراب الساعة تشبه الرجال بالنساء والنساء بالرجال\\\\\\\". رواه أبو نعيم في الحلية<br />ولقد فاجأنا الزمان بهذه المصيبة حيث إن الرجل يتشبه بالمرأة فيضع الحلي والقراريط كما تضع ذلك المرأة، وتتشبه المرأة بالرجل من حيث اللباس وقصات الشعر، وغير ذلك كما هو مشاهد في عصرنا. ولا حول ولا قوة إلا بالله"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002202/http://masr.20at.com:80/newArticle.php?sid=17239"

[[comments]]
order = 4
subject = "المخنثون والمسترجلات"
author = "مش ححبك"
text = "روى الإمام البخاري حديث عبد الله بن عباس، رضي الله عنهما حيث قال : «لعن رسول الله صلى الله عليه وسلم المتشبهين من الرجال بالنساء، والمتشبهات النساء بالرجال» .<br />وعنه أيضاً في البخاري : «لعن النبي صلى الله عليه وسلم المخنثين من الرجال، والمترجلات من النساء» .<br />والله عز وجل قد نهى النساء المسلمات أن يتمنين أن يكنّ كالرجال، وكذا نهى الرجال عن تمني ما للنساء، فقال تعالى: {وَلاَ تَتَمَنَّوْا مَا فَضَّلَ اللَّهُ بِهِ بَعْضَكُمْ عَلَى بَعْضٍ لِلرِّجَالِ نَصِيبٌ مِمَّا اكْتَسَبُوا وَلِلنِّسَاءِ نَصِيبٌ مِمَّا اكْتَسَبْنَ وَاسْأَلُوا اللَّهَ مِنْ فَضْلِهِ إِنَّ اللَّهَ كَانَ بِكُلِّ شَيْءٍ عَلِيمًا}[النساء : 32] .<br />و قال تعالى حاكيا عن قول إبليس اللعين{وَلَأُضِلَّنَّهُمْ وَلَأُمَنِّيَنَّهُمْ وَلَآمُرَنَّهُمْ فَلَيُبَتِّكُنَّ آذَانَ الْأَنْعَامِ وَلَآمُرَنَّهُمْ فَلَيُغَيِّرُنَّ خَلْقَ اللَّهِ وَمَنْ يَتَّخِذِ الشَّيْطَانَ وَلِيًّا مِنْ دُونِ اللَّهِ فَقَدْ خَسِرَ خُسْرَانًا مُبِينًا} [النساء:119]<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002202/http://masr.20at.com:80/newArticle.php?sid=17239"

[[comments]]
order = 5
subject = "لم تستمر حياة ولاء الزوجية طويلاً، فبعد طلاقها رفضت"
author = "مش شريف الدواخلي ولا البراء اشرف ولا عبدالله طحطح"
text = "طبعا ما هو مش معقول الراجل حينام مع راجل<br />جوزها طلقها لانه ما حسش فيها باي انوثة<br />والدليل على ذلك انه لفت انتباهها مهنة الجزار<br />ولا حول ولا قوة الا بالله العلي العظيم"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002202/http://masr.20at.com:80/newArticle.php?sid=17239"

[[comments]]
order = 6
subject = "لا ترموها بحجر"
author = "م0ش لاعب"
text = "المتأسلمون طلعوا لنا بالاحاديث التى لا تناسب الموقف وليس هذا موضعها وهذا مقرف ويثير الغثيان<br />الا تعرفوا ان هناك طيارات مقاتلات امريكيات تقود ال f16 وتطير من فوق حاملات الطيارات<br />وفى اسرائيل طيارات انثى تقود وتضرب اجدع شنب فى العرب<br />وزيرة الخارجية الاسرائيلية الصقر ليفنى التى شخطت فى اكجبررئيس دولة عربية وجعلتة يجيلة اسهال واتهمتة بعدم حماية الحدود<br />المقاتلات المسلمات فى الفتوح العربية ضرار بنت الازور هل كنا يتشبهن بالرجال<br />هل دولتكم المبجلة عملت مشاغل للبنات يصنعن الملابس الجاهزة ويجمعن الاف الصناعات الاليكترونية ابتداءا منن التليفون وحتى التليفزيون<br />عيالها ياكلوا منين - يشحتوا<br />كل واحد حافظ كم حديث يطلع لنا بية فى موقف غريب لا يطابق الواقع<br />منين قال انها مخنثة - دى حتى زى القمر وعندها عيال<br />ثم هل الجزارة اشق من عمل الفلاحة المصرية بالفاس فى الغيط<br />ثم انها لا تذبح الحيوانات - اللحم بييجى من السلخانة جاهز وهى مجرد بتقطع وتوزع وتبيع يعنى شغلانة سهلة<br />جتكم نيلة"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815002202/http://masr.20at.com:80/newArticle.php?sid=17239"

