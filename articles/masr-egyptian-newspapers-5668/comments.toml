subject = "البوس البوس"
author = "حسام المصرى"
posted = "2007-04-30"
text = "واضح جداً أن الريس سيتبواء بمصر كمان حوالى 200 سنة فى عصر التكنولوجيا<br />الأخ بيتكلم عن الأمن القومى المصرى طب ماهو فى أختراع أسمة الآمن القومى العربى ولا أنت ناسى أن أحنا مسلمين يعنى وهو أية الى يخليه بسمح بعبور المدمرات الأميركية من القناة أية الى يخلية يسمح بعبور حاملات الطائرات من القناة وهو عارف تماماً أنها رايحه تضرب مسلمين زينا<br />أية الى يخلى الدولار سنة 81 كان بـ 85 قرش ودلوقتى وصل 5.85<br />اية الى خلانا نوصل بالدين الداخلى الى 600 ملسار جنية مش الريس بتاع التكنولوجيا بتاعك<br />اية الى وصل بابطالة الى 7 مليون بنى أدم متلقحيين على النواصى مش القهاوى لان البشر دلوقتى مابقاش معاها فلوس تئعد على القهاوى<br />اية الى يخلينا نستورد 4 من أصل 5 أرغفة عيش من أمريكا<br />لية من سنة 81 مازرعش وعمل كفاية ذاتية ماهى دى برضة مسألة أمن قومى برضة ياأستاذ محمد<br />أية الى يخلى الأقتصاد المصرى خربان وبايض لحد دلوقتى حاجات كتير قوى وماتعدش يا أستاذ محمد على ولا أنت مش عايش معانا فى البلدى ولاأية<br />سيدى الرئـــيـــــــــــــــــــــــــــــــس مصيرك جــــــــــــــهـــــنــــم بأذن واحد أحد"
