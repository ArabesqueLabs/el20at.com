[[comments]]
order = 32
subject = "yemen"
author = "afaf"
text = "والله الموضوع مش بالجمال واذا اخذناها بالمبدأ هذا فعلى الدنيا السلام وبعدين انا قرأت اسم الرئيس جمال مبارك وعرشه هو في رئيس او ملك اسمه جمال مبارك اللي بعرفه حسني مبارك الروؤساء والملوك مواقف وكل من يقف مع القضية العربية او يدافع عن الشرف العربي هو جميل بنظري وانا ارشح الرئيس علي عبدالله صالح ليس لوسامته او شياكته المعروف بها ولكن لمواقفه الجادة والصريحة والشجاعة امام المتغيرات السياسية الحاصلة وكلا يرى الجمال بعين طبعه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 33
subject = "yemen"
author = "afaf"
text = "والله الموضوع مش بالوسامة واذا كنا سناخذ الروؤساء والقادة بوسامتهم فعلى الدنيا السلام وانا قرأت كل التعليقات السابقة فوجدت ان كلاً رأى الوسامة بعين طبعه يعني بالبلدي اللي قلبه بيحبه فمنهم من اختار ملك الاردن ولكنه تحدث عن الخيانه في الحكم ومنهم من اختار ملك قطر لمواقفه الانسانية ومنهم من اختار محمود وهنية وهذا نابع في رأي لقيادتهم للقضية الفلسطينية التي تشغل كل الرأي العربي ومنهم من اختار ملك المغرب ليس لوسامته ولكن لشياكته ايضاً ومنهم من ذكر اسماء ليسوا بروؤساء ولا ملوك مثل جمال مبارك متناسين والده حسني مبارك الرئيس الفعلي لمصر وانا سأفعل مثلهم فأنا ارى الرئيس اليمني علي عبدالله صالح هو الاوسم والاشيك ولانه رجل صاحب موقف في كل المحافل السياسية والانسانية فكما قلت كلاً يرى محبوبه بعين طبعه"
archived = "2010-03-14"
capture_url = ""
