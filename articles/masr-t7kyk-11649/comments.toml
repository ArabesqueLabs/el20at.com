subject = "منقول بتصرف من جريدة البديل"
author = "ابومحسن"
posted = "2009-03-21"
text = "وليه منقول بتصرف من جريدة البديل<br />امال الكتاب بتوعكم راحو فين<br />فين عبدالله الطحاوي فين شريف الدواخلي فين البراء اشرف فين ياسر ابو العلا فين احمد الهواري فين دعاء الشامي فين رضوى حسن فين مروى صلاح فين محمد الحنفي فين خباب فين مصطفى شحاته فين مروى عبداللطيف<br />كل دول ما يكتشوف ليه<br />راحو فين زعلانين ولا حاجه"
