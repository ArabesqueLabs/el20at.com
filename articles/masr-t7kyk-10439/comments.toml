[[comments]]
order = 1
subject = "الخراب الغير وطنى"
author = "المصرى أفندى"
posted = "2008-11-06"
text = "كما عودنا الحزن الوطنى فهو يستخدم سلاح البلطجية وهو من أسلحة الخراب الشامل التى يستعملها هذا الحزب الفاسد والفاشل ألا فى الأجرام .يستعمل هذا السلاح ضد الأحزاب الجادة وذلك بزرع البلطجية داخل هذه الأحزاب ثم يحركها للتدمير عند اللزوم. وهذا ببساطة دليل العجز والأفلاس والأحساس أنه مكروه من عامة الشعب. فبالله عليك هل هذه مناظر ناس أعضاء فى حزب هؤلاء أرباب سجون وبلطجية داخلين بسنج وأنابيب بيروسول ناس محترفين حرائق. وهذا دليل أخر على فرض ننوس عين أمه وأبوه على كل الشعب المصرى بالقضاء على أى معارضة محتملة. وعلى فكرة سنرى حرائق أخرى كثيرة لأن هذا هو السلاح الجديد فى يد حزب الفساد .."
archived = "2010-03-14"
capture_url = ""

