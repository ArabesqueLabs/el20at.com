[[comments]]
order = 0
subject = "يظهر ان العملية ولعت"
author = "حلو قوى"
posted = "2008-11-06"
text = "الحمد للة - اول مرة يقولوا ان الماس الكهربائى مش مسئول وان الحريق بفعل فاعل<br />حرق - يحرق - محروق<br />حرق سين من الناس مقر المارق الفاسق الماجن ايمن نور مقرة الذى لا ينقطع منة الغناء ولا الرقص صباحا ومساءا<br />ومن الغريب ان الحرق تم بعد انتهاء مولد سيدى الوطنى وانفض المولد وركب اولياء اللة الصالحون وساروا فى موكب المولد بالرايات والزينات والبخور بعد قرأوا الاوردة ودعوا الدعوات التى تمحق المعارضة وتحرق دابرهم<br />فبعد ان هدد التقى الواصل العارف احمد عز والشريف المعارضة بالويل والثبور وعظائم الامور استجاب اللة لدعائهم<br />وتم حرق مقر من مقرات المعارضة<br />اما دعوة سيدى المبارك فستحرق الوفد وبقية الاحزاب حرقة لا قيام بعدها<br />اما الاجتماع القادم فسيقرئوا ورد الزمخشرى ودعوات لحرق الجماعة المحظورة بجاز وسخ"
archived = "2010-03-14"
