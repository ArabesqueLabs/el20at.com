subject = "كتائب البلطجية تبع الداخلية سلاح الوطنى المدمر"
author = "الدكش"
posted = "2008-11-07"
text = "الى كل بلطجى يتمتع بحماية الداخلية لتدفعة فى تزوير الانتخابات وضرب الشرفاء مقابل التستر علية فى تجارة المخدرات او فرض اتاوات على الناس او ضرب الاشراف فى اقسام الشرطة<br />انتم فى عصر البلطجة الذهبى<br />الموسيقيين هربوا من النقابة خوفا من البلطجية الميرى"
