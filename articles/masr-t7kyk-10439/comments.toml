text = "المفروض النيابة بتنتقل لمكان الحادث وتبدأ بالتحقيق<br />اول المستجوبين المتضررين من الحادث<br />فاول سؤال بتتهم خد او بتشد في حد يكون هو اللي عمل كده<br />فيا ترى كانت الاجابة ايه"
