text = "كاتكوا الارف كل شخص بيقول انه مش مع مجانية التعليم دا دليل على انه ... التعليم حق لكل مواطن زى المية و الهوا و اكيد مجانية التعليم مش سبب فشله لكن الفساد و التخلف هما سبب فشل التعليم و يا ريت اى واحد زيكوا كدة يروح يتنيل و يخلى باباه يدفعله كام الف مصاريف و لولا بنى مش عايز اغلط بجد كاتكوا الارففففف"
