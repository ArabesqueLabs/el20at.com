[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "المجانية هي سبب تدني التعليم ا"
posted = "2007-11-22"
text = "المصاريف 14 جنيه في السنة، دى مهزلة ، دول ميجبوش حتي سنداوتش من مؤمن ولا كوك دوور. و الطالب من دول يروح يحب في زميلته و يبلط في الكلية 7 ، 8 سنين. طبعا مهو مش دافع حاجة.<br />من اجل مستقبل افضل ، يجب القضاء علي هذه المهزلة. الطالب المتفوق فقط هو الذى يجب ان يتمتع بالمجانية.<br />و بعدين هو مالو التعليم الصناعي يعني، يا فرحتي بالشباب كله معه شهادات جامعيه واعادلي علي الرصيف"
archived = "2007-11-24"
capture_url = "https://web.archive.org/web/20071124095349/http://masr.20at.com:80/newArticle.php?sid=12544"

[[comments]]
order = 2
subject = "دعوات لنشر الجهل"
author = "مصرى"
posted = "2007-11-23"
text = "التعليم فى مصر<br />حقائق تثير الرعب<br />عدد الجامعيين فى اسرائيل با النسبة لعدد السكان 50 ضعف مصر<br />اطفال دول الخليج يدرسون فى كتبهم الان ان الامية فى الوطن العربى تتركز فى مصر والسودان<br />وان عدد الاميين فى مصر يساوى مجموع الاميين فى الوطن العربى كلة<br />وان تونس لم يعد فيها اى امى<br />وتركيا اختفت الامية فيها من سنين طويلة<br />نحن اصبحنا اقل الدول نموا فى التعليم<br />وسوف نصبح ملطشة وقابلين للاحتلال عما قريب وسيكمون مستوانا مستوى الصومال واريتريا<br />يا عالم اصحوا وشوفوا الدول حواليكم بتتقدم قدر اية<br />دبى كانت قرية صيادين اصبحت اهم مدينة فى الشرق الاوسط وليس عندها بترول ولكن ادارة ناجحة<br />اصرفوا على التعليم<br />ولو كان بيدى لاعطيت الطالب مرتب علشان نشر التعليم<br />فوقوا وبطلوا الهباب اللى بتشربوة وشوفوا الدول حواليكم بتتقدم وانتم بترجعوا للوراء"
archived = "2007-11-24"
capture_url = "https://web.archive.org/web/20071124095349/http://masr.20at.com:80/newArticle.php?sid=12544"

[[comments]]
order = 3
subject = "___"
author = "FIDO"
posted = "2007-11-23"
text = "لتعليم المجاني ده حوار فااااااااااشل<br />إسرائيل اللي فخورين بيها مفيهاش تعليم مجاني<br />أنا تجارة إنجلش جامعة إسكندرية .... بدفع 5000 جنيه في السنة مش 200 جنيه<br />و في المقابل باخد كتب محترمة و الدكتور بيدخل يشرح بالابر توب علي الداتا شو و الأعداد في القاعات ميزيدش عن 100 و القاعات مكيفة<br />أنا مش قصدي حاجة بس الفكرة إن ده حيبقي حال كل الكليات في مصر لو الطلبة دفعوا مصاريف<br />ماهو الحكومة لو بتدعم التعليم مش حتدفع أكتر من يا دوبك مصاريف الدكاترة و الكهربا و المياه بس مش حيكون فيه تطوير<br />و بالمناسبة عندنا في كليتنا الطلبة المتفوقين في الثانوية العامة مش بيدفعوا مصاريف كبيرة<br />هاه الفكرة ناجحة ولا فاشلة؟"
archived = "2007-11-24"
capture_url = "https://web.archive.org/web/20071124095349/http://masr.20at.com:80/newArticle.php?sid=12544"

[[comments]]
order = 4
subject = "المعلق اللى فوقى"
author = "هباب"
posted = "2007-11-24"
text = "وكم ولى امر زى ولى امرك قادر يدفع رسوم 5000 جنية<br />لو على هذا المقياس يبقى اللى هيتعلموا جامعى 10 الاف طالب من 80 مليون مواطن<br />هيبقى عسكرى الجيش بصمجى وقدامة عسكرى اسرائيلى بيتعامل مع الكمبيوتر<br />لو الدولة دفعت اجر زى الاجور فى اسرائيل مثلا الطبيب بيتقاضى 10 الاف دولار فى الشهر والمهندس 10 الاف دولار<br />والعامل بياخد من 100 الى 200 يورو فى اليوم نبقى ناخد من عيالهم مصاريف<br />انما الموظف والطبيب بيتعين ب 300 جنية يعنى 50 دولار فى الشهر<br />وانت بعد تخرجك من الجامعة بتاع 5000 جنية رسوم ها تشتغل بكام وبمرتب كام<br />اين الخلل<br />واين الحل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "لنا الله"
author = "إيمان نبيل"
posted = "2007-11-24"
text = "انا مع القول اللي بيقول ان المجانية سبب تدهور التعليم والسبب التاني والارئيسي هو تدني الاجور وقلة الميزانيه المخصصه للتعليم واهدارها فيما لا يجدي فمثلا اتعميم الوجبه في جميع مدارس الجمهوربه وارجاع التهرب من التعليم بسبب الوجبه اوانها هتمنعه ودا كلام فارغ اوي ..وليس له اساس من الصحة ما احنا كنا في مدارس وعارفن ان معظم الطلبه بصراحه بيقرفوا منها او متكبرين انهم ياخدوها..<br />وقبل ما نكلم عن الغاء المجانية لازم يكون هنا مستوي معقول من الاجور ..<br />والا ازاي نلغي مجانية التعليم ودخل 50% من الشعب المصري اقل من 2دولار في اليوم اي تحت خط الفقر..<br />ولو ان المصاريف غليت في مقابل زياده ملموسه في الخدمات او تطوير المناهج وامدادها بمزيد من الوسائل التكنولوجيه الحديثه وتطوير المكتبات اللي اساسا معظم قاعاتها مقفوله..<br />اضف الي ذلك المعامله ال..... السيئه اللي بنتعامل بيها سواء من امناء المكاتب او من موظفين شئون الطلبه اللي بياخدا اجازه 3 ايم في الاسبوع وبيقفلوا بعد الظهر والطالب يخبط دماغه في اقرب حيطه..<br />الانهيار في التعليم منكل ناحيه..<br />واطراف كتيره مشاركه فيها..<br />ولكم الله يا ابناء مصر"
archived = "2010-03-14"
capture_url = ""

