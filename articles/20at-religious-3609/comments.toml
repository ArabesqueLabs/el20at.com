[[comments]]
order = 3
subject = "تبغى الصراحة"
author = "بندر الجهني"
posted = "2009-02-19"
text = "كل واحد في السعودية يسوي فيها وصي على الناس<br />ليبراليين وصحويين<br />والله ان الحر العاقل البالغ لما يسمع احد يقوله<br />سوي كذا وافعل كذا<br />انه يعتبر نفسه لا حر ولا عاقل بما ان فيه احد يوجهه<br />فكونا جميع الله لا يهينكم<br />احنا مسلمين<br />والقران والسنه واضحه<br />اللي يتبع الامر موفق<br />واللي يخالفه خالف نفسه<br />واذا احد عنده نصيحه<br />ينصح باللتي هي احسن او يكفنا"
archived = "2010-03-14"
