[[comments]]
order = 1
subject = "لنسمع الاخرين"
author = "ayat alla"
posted = "2007-04-22"
text = "جزاك الله خيرا ايها الكاتب على اهتمامك باحوال المسلمين،وجزاك خيرا عن حسن نيتك فى هذا الخطيب وانك التمست له عذرا. ولكن يمكن ان يكون هذا الخطيب كما ذكرت صغير السن وليس عنده الخبره الكافية فى إلقاء الخطب.<br />ويمكن ما دعاه ان يستخدم تلك الالفاظ بقسوة هى الحماسة الزائدة عند الشباب وخاصة فى أمر كهذا مما نراه من الفتيات اليوم (سامحهن الله تعالى ) اللواتى لا يعتبرن لأمر الله<br />ولنقول ان الخطيب اذا بحث بأحوال الناس أكثر وتقرب من جميع الاعمار عند العامة لتفهم الامر بصورة اوضح مما يراها هو<br />فالمعظم اليوم يأخذ رأيه وينشره وسط الناس ويفرض عليهم هذا دون أدلة أو براهين وسوء اختيار اسلوب مهذب مع من يحاوره،ولذلك هذا الخطيب لا يحتاج الى اللين فحسب وإنما يحتاج إلى سعة صدر ومعرفة الاراء أكثر من غيره لا من نفسه<br />(اللهم اهدى شباب الامة اجمعين فإنه ولى ذلك والقادر عليه)"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "هيا حرب"
author = "اصل الحضارة"
posted = "2007-04-29"
text = "ياجماعة واللة اللى حاصل دلوقتى حرب مكتومة بين جمهورية مصر العربية وبين السعودية فالسعوديون من ايام المللك عاوزين دينهم الوهابى ينتشر وبعد وقوع مصر اقتصاديا اصبحت الفرصة سانحة لهؤلاء الوجوة المكفهرة التى تعشق الموت وتكرة الحياة هؤلاء الكلاب ابتدعوا ماليس فى الدين رايتهم فى مكة لحية الشخص منهم طويلة ووجهة مكشر ويكاد يكفر كل البشر وفى يوم من الايام اصطدم بى احدهم صدمة كبيرة فحينما التفت وقلت لة خد بالك انفجر بركان الحقد والكراهية وقال لى خد بالك انتا ياولد الرقاصة مصرى جاى يعلمنا هؤلاء هم من سيحكموكم قريبا"
archived = "2010-03-14"
