[[comments]]
order = 0
subject = "إيه ده؟"
author = "معا>; محمود عامر"
posted = "2007-04-21"
text = "الحقيقة لهجة الكاتب في البدياة صدمتني جدا أنا كنت فاكره بيهزر لكن اتضح إنه فعلا ده رأيه في الليبراليين ومش عارف جابه منين يعني بصراحة هما الليبراليين دول كفرة مثلا وللا إيه؟<br />كمية الجهل الشديدة والدماغ المحشو بكلام غبي وأسلوب أصلا غير محترم<br />مش عارف أنا أول مرة أقرأ في عشرينات مقال به>;ه الفظاظة والسفالة والتخلف<br />مش فاهم بالضبط فيه إيه يعني؟"
archived = "2010-03-14"
