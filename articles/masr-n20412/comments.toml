[[comments]]
order = 0
subject = "مصر اصبحت اكبر مصنع ومصدر للفساد فى العالم"
author = "اكتب اسمك هنا"
posted = "2009-03-25"
text = "احنا اللى عملنا الفساد<br />واحنا اول ناس القيادة بتاعتنا اطلقت كلمة الارهابى على كل معارض وكلمة ارهابى اختراع مصرى 100 % وصدرناها الى الصديق بوش فى امريكا والجارة اسرائيل<br />احنا بتعذيب المعتقلين تعذيبا وحشيا فى السجون كبار قيادات القاعدة زى الدكتور اللى ابوة وعمة اساتذة طب فى جامعة القاهرة اصبح الرجل التانى فى القاعدة نتيجة التعذيب الوحشى والا ادامى للدكتور الظواهرى الذى كان يسكن فى قصر فى المعادى فهو ليس تربية كفر ولا كوم ولا نجع فى الصعيد فهو ابن ناس كبار ولكنة قسوة التعذيب الذى تجعل الانسان يكفر بكل شىء ويترك قصر ابوة لينام فى جحر فى جبال افغانستان<br />الفساد عندنا فى كل شبر من مصر"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327025501/http://masr.20at.com:80/newArticle.php?sid=20412"

[[comments]]
order = 1
subject = "ارجعى لبريطانيا"
author = "محمد السعداوى"
posted = "2009-03-25"
text = "ارجعى لبريطانيا وطنك وبلدك اللى بيحترمك ومهما بعدتى عنه بيقدرك ارجعى لبلد بيفهم يعنى ايه معنى كلمة انسان<br />انتى محظوظة جدا انك مش مصرية وبجد انا بحسدك على كده<br />على رأى واحد صاحبنا كان وطنى حبتين \"لو لم اكن مصريا لوددت ان اكون اى جنسية تانية \""
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327025501/http://masr.20at.com:80/newArticle.php?sid=20412"

[[comments]]
order = 2
subject = "تصحيح"
author = "محمد السعداوى"
posted = "2009-03-25"
text = "معذرة اصل الرجل الوطنى حبتين ده كان فاشل فى اللغة العربية نعيد صياغة الجملة \" لو لم اكن مصريا يبقى الحمد لله \""
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327025501/http://masr.20at.com:80/newArticle.php?sid=20412"

[[comments]]
order = 3
subject = "لو لم اكن مصريا يبقي احسن !!!"
author = "هوووبه"
posted = "2009-03-25"
text = "والله يا جماعه ان متفقه مع الست دي في كلامها كله وخاصه في حته الفساد , وشدتني حته إذا كانت لديه إرادة أن<br />يكون دولة عظمى في وقت قصير، لكن الشعب مسكين وطيب، ويرجع كل السلبيات إلى القضاء والقدر."
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327025501/http://masr.20at.com:80/newArticle.php?sid=20412"
