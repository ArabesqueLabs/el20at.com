[[comments]]
order = 5
subject = "Disk Man"
author = "English Youth"
posted = "2007-02-15"
text = "مش ممكن بجد ... أنا بصراحة وبأمانة عجبتني وخاصةً الجزئية بتاعة :<br />كل عام مع العيد..<br />ونحن نحيا الحب كقضية أبدية..<br />وأتمنى..<br />وأتمنى..<br />فلا تكفيني معك ألف أمنية.<br />البيت ده جميل بجد ... بس صحيح يا محمد مين أمنية دي؟!!<br />أما بالنسبة للجزئيات الخاصة بالمصطلحات الجديدة على سبيل المثال : قصيدة غزل جاهلية - كلمات الحب العنبرية - جمال وزينة شعبية ... فهي تدل على معاني كثيرة جداً.<br />أولاً بالنسبة لـ(قصيدة غزل جاهلية) : من المعروف أن شعر الغزل الجاهلي كان ينقسم إلى صريح وعفيف، فأي المعنيين تقصد .. العفيف أم الصريح، وهل بالضرورة أن ذكر الشعر الجاهلي يعني الرمز إلى جهل المحبوبة؟!<br />ثانياً بالنسبة لـ(كلمات الحب العنبرية) : واضح إن حضرتك بتشبه المحبوبة بالأستاذة الفنانة ليلى مراد ولكن بطريقة غير مباشرة وذلك لأن كلمة عنبرية مستقاة من فيلم عنبر والذي قامت فيه الفنانة ليلى مراد بدور رومانسي جداً جداً أمام فارس الرومانسية أنور وجدي.<br />ثالثاً بالنسبة لـ(جمال وزينة شعبية) : فلا نحتاج أن نقول لكم من هو جمال (مفيش غيره) أما الزينة الشعبية فلم يذكر هل هي من فراشة الحاج عبد العزيز الثعلب أم فراشة النجمة الذهبية وهل هناك لمبات ألوان وصوان منقوش ليكتمل معنى الزينة الشعبية؟!، أم يقصد بالزينة الشعبية الخلخال والحلق المخرطة والمنديل أبو أويا؟؟، ولماذا تم إختيار الزينة الشعبية بدلاً من الزينة الحديثة؟؟؟!!!<br />أرجو الرد سريعاً على العنوان التالي : الناقد الكبير/السيد عبد الرحيم خيري<br />عزبة النخل بجانب كشك هيصة للسجائر<br />بلوك 5 جنب الباب<br />elsayedkhairy@gmail.com"
archived = "2010-03-14"
capture_url = ""

