subject = "عندما يتحقق الحلم"
author = "Randa el tahawy"
posted = "2008-07-28"
text = "السلام عليكم<br />اولا مبروك موقع عشرينات لاني اول مرة زيارة لة<br />عندما يتحقق الحلم ويصل للنور يكون صغيرا<br />ولكن بكم وبمجهودكم سيكون كبيرا ان شاء الله<br />وصلوا الابداع ومنها الى القمة<br />راندا طحاوي"
