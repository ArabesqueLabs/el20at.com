[[comments]]
order = 0
subject = "احنا ولادك يامصر"
author = "واحد مننا"
text = "ارحمونا وارحموا الناس علشان ربنا يرحمكم<br />السلام عليكم و رحمة الله و بركاته<br />فلسطيني انا اسمي فلسطيني<br />نقشت اسمي على كل الميادين<br />بخط بارز يسمو على كل العناوين<br />حروف اسمي تلاحقني تعايشني تغذيني<br />تبث النارفي روحي وتنبض في شراييني<br />جبال النهر تعرفني مغاورها وتدريني<br />بدلت الطاقة الكبرىوقلت لأمتي كوني<br />صلاح الدين في اعماق أعماقي يناديني<br />وكل عروبتي للثأر للتحرير تدعوني<br />وراياتي التي طويت على ربوات حطين<br />وصوت مؤذن الأقصى يهيب بنا أغيثوني<br />وآلاف من الأسرى وآلاف المساجين<br />تنادي الأمة الكبرى وتهتف بالملايين<br />تقول لهم الى القدس الي قبلة الدين<br />الى حرب تدك الظلم تزهق روح صهيوني<br />وترفع في سماء الكون أعلام فلسطين<br />وتهدر كلمتي تمضي فلسطيني فلسطيني<br />فلسطيني"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062510/http://masr.20at.com:80/newArticle.php?sid=17572"

[[comments]]
order = 1
subject = "وماذا عساهم ان يفعلوا؟"
author = "برضة انا"
text = "الحكومة حكومة رجال الاعمال<br />يعنى كل جهود الحكومة وهدفها خدمة رجال الاعمال وتسهيل وتذليل الصعوبات امامهم<br />طيب وبقية افراد الشعب ال 75 مليون - ليهم مين<br />زى ما قراتم فى المقال - لهم الامن المركزى وامن الدولة وضباط الشرطة والاعتقالات<br />الاخ اللى فوق اللى بيتكلم عن فلسطين<br />انت شفت فى اى مكان فى فلسطين بيوت بالبؤس والفقر زى تليفزيونات العالم ما صورت بؤس وفقر بيوت الدويقة<br />فلسطين جنة بالنسبة لمصر<br />اليهود عندهم رحمة على الفلسطنيين اكتر من حكومتنا علينا<br />ابكوا مصيبتكم ومصيبة شعبكم وخللوا الفليسطنيين فى حالهم"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062510/http://masr.20at.com:80/newArticle.php?sid=17572"

[[comments]]
order = 2
subject = "انتم السابقون ونحن اللاحقون يا اهل الدويقة"
author = "مش رايح"
text = "مفيش فايدة في البلد دي<br />لا خدمات<br />لا تخطيط<br />لا انتاج<br />لا مشاريع<br />لا تطوير<br />لا تنظيم<br />لا تعليم<br />لا صحة<br />لا تموين<br />لا معاشات<br />لا لا لا لا<br />كل حاجه لا<br />مفيش غير الامن المركزي بس اللي بيتطور وعصيانه الغليطة<br />متخفوش يا اهل الدويقة<br />انتم السابقون ونحن اللاحقون<br />المفروض الدولة تبني محافظة اسمها محافظة الايواء العاجل<br />المباني كلها تكون خيم"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062510/http://masr.20at.com:80/newArticle.php?sid=17572"

[[comments]]
order = 3
subject = "لجنة سياسات دفن الموتى فى حزب غطينى يا صفية وصوتى"
author = "شرارة"
text = "وزارة الكوارث - رئاسة عبدة شرارة<br />جماعة دفن الموتى - وزارة الصحة سابقا<br />التخطيط للكوارث - لجنة السياسات<br />تبرير الحوادث وانها قضاء وقدر - فضيلة المفتى والفتاوى بانهم شهداء او اثمون طماعون يركبون البحر طمعا فى الثروة<br />لا تزعجوا الموتى - الامن المركزى وعمل خمسة اطواق امنية حول مكان الحادث ومنع التصوير والاعلام حتى يموت الناس بهدوء وسكينة<br />لجنة من رجال الاعمال الغلابة لتلقى المساعدات القادمة من الدول العربية لتحويلها الى القرى السياحية وتجميل مداخلها<br />ازلام الوطنى فى الفضائيات يبررون موت الناس دى بانهم لازم يموتوا لانهم بنوا بيوتهم بمجهودهم الشخصى فى اماكن خطرة وانهم رفضوا السكن فى فيلل القاهرة الجديدة<br />وزير الاثتثمار بعد ان راى الخرابات التى يعيش فيها الناس فى التليفزيون قال ان التنمية وصلت الى 8 فى المية<br />الكبير بعد ان شاهد الدمار قال انة لا رجعة فى الاصلاح وان اصلاح الاقتصاد ماضى فى طريقة<br />لواءات الامن الذين يحكمون البلد يبحثون افضل الطرق لاستكمال تحويل البلد الى سجن<br />واللة المستعان<br />ولا رجعة عن الاصلاح<br />بقلم عبدة خرابة"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062510/http://masr.20at.com:80/newArticle.php?sid=17572"

