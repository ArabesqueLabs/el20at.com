[[comments]]
order = 5
subject = "ما تيجوا نتحد مع اسرائيل و نهاجر ليها"
author = "خايف اكتبة بعدين؟؟؟؟؟!"
text = "و اللة الاتحاد مع اليهود اشرف لينا كلنا من الاتحاد مع كل العرب الكلاب اللى بتتفرج علينا فى محنتنا و شمتانة فينا<br />تصدقوا ان اسرائيل تطوعت مشكورة بارسال 6 طائرات كبيرة مليئة بكا المساعدات الانسانية و لكن الجبروت و الكبرياء المصرى رفضوا استلامهم<br />مش دة و اللة حرام ام حلال<br />ما تيجوا كلنا نهاجر و نهرب من مصر و نلجاء الى اسرائيل<br />اقسم انهم فى اسرائيل سوف يرحبون بناو يستقبلونا احسن استقبال"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062510/http://masr.20at.com:80/newArticle.php?sid=17572"

[[comments]]
order = 6
subject = "ونهاجر اسرائيل لية - ما هو اللى فى القصر تبعهم"
author = "برضة لا"
text = "يا راجل نهاجر لاسرائيل لية<br />انت شفت بيوت غزة والضفة نظيفة وجميلة والشوارع خضراء ومزروعة والبيوت السقف بتاعها احمر واخضر ومتغطى بالقرميد<br />انما اللواءات بتوعنا السادة المحافظين ورؤساء الاحياء ومجالس المدن وبتوع الامن جعلوا البلد معسكر صحراوى قبيح وتخصصوا فى جعل الناس يكرهون عيشتهم<br />السيد اللواء اركان حرب مدرعات ومحافظ لمحافظة - اكيد هيعمل شوارعها ميدان ضرب نار وهيحط سواتر واحجار وهيقطع الشجر وهياخد رشاوى ويستولى على اراضى الدولة ويتاجر فى العقارات<br />انما الناس يروحوا فى ستين داهية<br />وزير التضامن الاجتماعى المسؤول عن رغيف العيش كان لواء سابق فى الكلية الفنية العسكرية وكان عامل خطة ياكل الشعب عيش ويوزع عليهم الخبز بعد طابور الصباح وطابور المساء والهتاف تحيا جمهورية على بابا<br />اللى اختشوا ماتوا"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915062510/http://masr.20at.com:80/newArticle.php?sid=17572"

