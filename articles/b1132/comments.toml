subject = "مش زنبهم زنب الاعلام"
author = "محمود المصري"
text = "يا سيدي القاضل الناس منقسمه قسمين قسم مشغول بالتفاهات والموضه و لون الشعر ودي الطبقه المرتاحه و معاها فلوس 000000000 وناس مش فاضيه تنشغل بحاجه أصلا عشان بدور على لقمة العيش ومفيش علاقه بن الطبقتين والاعلام زي ما أنت شايف شغال على نانسي عجرم وغيرها عاوز الشباب يعرف الناس الي انت بتقول عليهم دول منين"
