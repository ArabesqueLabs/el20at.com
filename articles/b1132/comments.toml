[[comments]]
order = 7
subject = "مجرد رأى"
author = "محمد محسن"
text = "أنا عمرى24يعنى من الجيل اللى المخرج اتكلم عنة مع احترامى للشباب كام فى المية من شبابنا دلوقتى عندة استعداد انة يسيب كل شىء من كمبيوتر سماع اغانى مشاهدة أفلام التسكع مع رفاقة ويمسك كتاب ولو حتى كان حجمة صغير يمسك الكتاب ويتفرج لة ويقعد يقرأ القراءة محتاجة شىء من الصبر وللاسف العصر اللى احنا فية يسمى عصر السرعة وانا اعتقد انةمن الافضل ان يكون اسمة عصر اللهوجة(عذرا لاستخدام لفظ عامى دارج) واللهوجة كما نعرف هى عمل الشىء بسرعة وبدون تركيز وبدون اتقان فكيف ونحن فى هذا العصر الذى كل شىء فية بسرعة (حتى الاكل لم نعد نستمتع بة بسبب السرعة_الفاست فود والتيك اوى_ أن نستطيع ان نمسك كتاب ونقرأ صراحة انا لاأعرف العيب فى عدم القراءة يقع اكتر على عاتق من عاتق الزمن نفسة اما على عاتق الاباء الذين لم يشجعوا ابنائهم على القراءة ام على عاتقنا نحن الذين لم نحاول ان نستكشف ونجرب متعة القراءة انا لاأعرف هل تعرف أنت؟"
archived = "2010-03-14"
capture_url = ""

