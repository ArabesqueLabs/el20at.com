[[comments]]
order = 5
subject = "معجبنيش الفيلم"
author = "محمد"
text = "أعتقد ان هدف الفيلم الأساسي هو الاستهزاء بالمواطن العربي<br />يعتمد الفيلم على معلومة غير موثقة مجهولة المصدر فضلا عن استحلاتها عمليا<br />لن يعدم المواطن جريدة أو مجلة تستغرق منه ضعف هذا الوقت في يوم واحد<br />اعتمد الفيلم على سؤال اسئلة من طراز اسئلة الكلمات المتاقطعة بعضها لا يهم المواطن العربي في شيء مثل حكاية رئيس وزراء إيطاليا<br />سعيد أنا ان معلوماتي المتواضعة استاطاعت أن تجيب عن بعض هذه الأسئلة المستفزة<br />كلمة أخيرة لو قابلني مذيع في الشارع وسألني عن أسم رئيس وزراء إيطاليا لـ........ ولا بلاش الطيب احسن"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "معجبنيش الفيلم .... عليك نور"
author = "GyumRi"
text = "اعتقد ان العيب فى كدة مش الناس ...الاعلام هو السبب...انا لو جبت شيخ فى جامع و قالتلة مين مغنيت اةة و نص ...حيقول نانسى عجرم...دة مش عشان الشيخ هو الى متابع نانسى ... لكن عشان الاعلام هو الى مخلى نانسى ورانة ورانة ... فى كل قناة و كل جريدة و كل مجلة....و انا ميهمنيش اعرف مين رئيس وزراء مروتانيا و لا اطاليا....المهم للواحد يقرى المفيد...بس الاهم يلاقى الكلام المفيد"
