[[comments]]
order = 9
subject = "مين السبب؟!"
author = "ريم"
text = "انا عمرى 17 سنة وبصراحة انا مش من النوع للى بيحب قراءة الكتب الانى بعتمد على النت فى اى حاجة عوزاها<br />واعتقد ان الاهل هما الاساس للى يخلى والادهم يحبوا القراءة من وهمه صغيرين و يعودهم على قرائة الكتب المفيدة<br />بس انا مش من المتعودين....ولو جبتلى كتاب وقلتلى اقرئى الكتاب دة ....هما دقتين وبس وده يرجع لنوع الكتاب واسلوبه<br />وعلى فكرة لو رحت اى محل بيبيع كتب وسئلت اية نوعية الكتب للى بتتباع حتكون(كتب الابراج و النجوم).<br />و معظم الناس دلوقتى بتعتمد على الاعلام فى اخذ المعلومة الانها سهلة ومن غير تعب.<br />وعدم القراءة اعتقد انه بيرجع الاهل و الاستعداد النفسى للشخص لانه زى ماقلت بيعتمد على السهل.<br />وربنا يهدينا ... امين."
archived = "2010-03-14"
capture_url = ""

