text = "القراءة الثقافة العلم ..مفردات غابت عنا أكيد وإلا ماكنا في ذيل الأمم .ماأثاره الفيلم واقع نحياه ونلمسه .والعيب فينا نحن في الأساس لا الإعلام ولا السلطة ولا الغرب ولا الفقر ولا أي شماعة ممكن نعلق عليها خيبتنا ..أظن أن تقرير التنمية البشرية رصد مضمون هذه المهزلة من قبل.. المهزلة اللي خلت دولة المجر تقع في أفريقيا وجورج واشنطن ممثل حاصل علي الأوسكار ...آه يا أمة ضحكت من أجلها الأمم!!"
