[[comments]]
order = 12
subject = "لماذا دائما نحبط أنفسنا...."
author = "hatem"
text = "السلام عليكم و رحمة الله و بركاته ...اولا الفيلم جيد و يقيس بالفعل واقع نعيش فيها جميعا لا ينكره الا جاحد و لكن الفن رسالة صادقة توصل الحقيقة للناس ..أرى ان الفيلم جانب الحقيقة لانه انتقى شريحة معينة من الناس العديمى الفكر أو التوجه و لم يتوجه الى فئة الشباب الكثيرين جدا و الموجودين حاليا و يتمتعون بثقافة عالية و علم و دليل ذلك ادخلوا على منتديات العرب ستجد معظمها عن الموسيقى و الأفلام و الاغانى و لكن ستجد فى الموازاة منتديات الأدب و الشعر و العلوم و الثقافة .....و كذلك أردت ان أوجه سؤالا هل المشاهير الذين تم السؤال عنهم يعنون المواطن فى شىء هلى قدموا له قوت يومه هل قدموا له راحة البال ....و اذا نظرت للمجتمع الأمريكى مثلا فقد قاموا بعمل دراسة لمعلومات الشعب الأمريكى عموما وجدوا انهم لايعرفون الا كوبا و العراق و ايران و كوريا الشمالية و المكسيك و بعضهم يعرف اسرائيل و الأخر لايدرى هل مصر تابعة لاسرائيل أم انها دولة مستقلة .....عزيزى الجهل ليس فينا ...الجهل منتشر فى كل أرجاء العالم ....كفانا احباطا لدينا من الطاقات البشرية ما يفجر لنا كل ماهو رائع و عظيم و لكننا بأفلام كهذه نحبط الناس و نغرس فيهم انكم جهال و لا نغرس فيهم قيمة العلم ......شكرا"
archived = "2010-03-14"
capture_url = ""
