[[comments]]
order = 1
subject = "لالالالا بس أنا زعلان ....."
author = "محمد السيد طبعا..امال مين؟؟"
posted = "2007-04-26"
text = "انا قلت الموضوع حيمشي علي الناس الوحشين اللي مش كوبيسين دول بس .... لكن لقيتكم جبتوا سيرة أسامة الغزالي ... وبعدين يحيي حسين ....<br />الله عليكي يا مصر ....<br />بس أنا زعلان منكم ....<br />بقي تسيبوا عالم زي الفل من نوعية ... شلة الحلوين اللي ضحكوا علي الحكومة وخلوها تمسكهم الجرايد القومية ....\"مش عايز ضحك ..أيوة جرايد وقومية كمان\".<br />وتسيبوا واحد زي عمو فؤاد علام ... اللي خلاها تعمله خبير عسكري سياسي أمني إسلامي بتاع كله ...<br />ولا كل رجال الأعمال الهربانين ... واللي مش هربانين ....<br />ولا واحد زي سعد الدين إبراهيم اللي لطعهم قفا محترم قبل السجن وخلاله وبعده ...<br />ولا الجاسوس عزام اللي ريسنا حلف براس والدته إنه مش حيطلعه ويحترم أحكام القضاء...\"بس واضح سجنه بيقضيه بره سجون مصر\"<br />أما أكبر قفا بقي .... يوم مافتحوا الباب للتعديلات الدستورية ..... عفريت حضروه ومش عارفين يصرفوه ...<br />متبقوش تنسوا تاني بقي .... أحسن والله كده أزعل منكم ...<br />الله عليكي يارشيدة .... \"يووه تاني بتضحكوا ..أنا قصدي الحكومة مش معزة بكاااااااااااار\"<br />يالا بقي.... عقبال كل قفا ...<br />بس برضه مش حاسكت ...<br />مع افتتاح ولاد البلد الجديد ...تقدروا تشرفوا المدونة بقي<br />www.mesh7askot.blogspot.com<br />mohamedmat@hotmail.com"
archived = "2007-04-30"
capture_url = "https://web.archive.org/web/20070430031704/http://masr.20at.com:80/newArticle.php?sid=9946"

[[comments]]
order = 2
subject = "جديد اللى انتا بتقوله ... بجد طريقه مختلفه"
author = "بيبو"
posted = "2007-04-26"
text = "ايه ياعم اللى انتا كاتبه ده .. سمك لبن تمر هندى .. ايه الموضوع الملخبط ده ... ايه الخط اللى بيربط الشخصيات التى ذكرتها ببعض يعنى يا اما كنت تاخد وجهه من نافق الحكومه ووصل \"اداها على قفاها يعنى \" زى عبد الله كمال و بكرى وعادل حموده .... او فعلا الناس المحترمه زى نهى الزينى ويحيى حسين انما اللى انتا كاتبه ده مش صحافه .. محمود ايه ده يا محمود"
archived = "2007-04-30"
capture_url = "https://web.archive.org/web/20070430031704/http://masr.20at.com:80/newArticle.php?sid=9946"
