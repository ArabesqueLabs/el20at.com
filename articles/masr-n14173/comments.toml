subject = "الخبر عايز يقول اية"
author = "برضة رخم"
text = "نشر الخبر بالصورة دى وبالكلمات دى بيقول - يا اسرائيل احنا صاحيين وبنحميكى كويس قوى وحارسين حدودك وعاملين زى الدبدانات بنتحرس حدودك من اى تهريب - ارضى عنا والنبى - يا اسرائيل ارضى عنا وعن شغلنا واتكلمى كلمتين حلوين فى حقنا عند امريكا<br />واحنا خدامين جزمتك بس امريكا ترضى عنا وتسيبنا على الكراسى"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195730/http://masr.20at.com:80/newArticle.php?sid=14173"
