subject = "وزير أمين و لاول مرة"
author = "فلسطينية و افتخر"
posted = "2008-01-10"
text = "اولا أود ان أعبر لوزير الصحة المصري عن اعجابي و احترامي الشديد له لأنه أثبت فعلا بانه أول وزير عربي أمين و متحمل للمسؤولية و أناأناشد كل وزير يقرأ هذا المقال أن يأخذه قدوة حسنة و جزاه الله كل خير و يا ريت يزود جولاته المفاجئة أكثر و شكرا"
