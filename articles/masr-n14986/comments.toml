subject = "وزيرالدخلبة وحكومتة اتفضحوابجلاجل من اوروبا وامريك"
author = "حنفى نوكيا"
posted = "2008-04-03"
text = "مع احترامى للريس مبارك انت بتقراء مستقبل مصر بالغلط والناس اللى مفهماك ان الاخوان لو وبنقول لو وصلوا الى الحكم عن طريق انتخابات حقيقية حيرجعوا مصر مية سنة لوراء طبعا الكلام دة يسدقة اتنين يامجنون يامسؤل وحرامى ومتنفذ وحاجة زى كدة حتبوز علية وعلى مليون محسوب ومحظوظ صغير الهبش والسرقة0 انت ياريس ادى الضوءالاخضر لانتخابات حقيقية ميتوعدش بيها وزير داخليتك الناخبين والمرشحين بالويل والثبور وعظائم الامور"
archived = "2008-04-04"
