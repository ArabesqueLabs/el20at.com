[[comments]]
order = 8
subject = "اية اللى بيحصل دة ياحكومة يامفترية اعتقالات وضرب و"
author = "سيد قرارة"
posted = "2008-04-03"
text = "ولية الزيطة والزنبليطة والانتخابات بتاعت المحليات منتو عملتوا عملتكم فى انتخابات مجلس الشعب اللى فات ولاكان العدد الحقيقى لنواب الاخوان فوق المية ودلوقتى انا باقترح على الحكومة انها تلغى الانتخابات ويطلع وزير الدخلية اللى بيرهب ويرعب الناخبين ويعلن النتيجة فوز الوطنى بالدورى والكاس وبنسبة تلات تسعات ويريحنا ويريح نفسة على فكرة انا مش من بتوع الاخوان بس باحترمهم زيهم زى اى قوى سياسية نفسها تاخدفرصتها لادارة شؤن الناس ودة حق لكل مواطن شريف شايف انة يقدر يخدم مصر لان مصر بلدنا ليها حق علينا وبنحبها وكل واحد شايف انة يقدر يساهم بفكر وجهد وعمل منكرا لذاتة فى سبيل البلد والشعب وبالذات الغلابة والمساكين ف اهلا وسهلا - لية ياحكومة بتقفليها فى وش الناس"
archived = "2008-04-04"
capture_url = "https://web.archive.org/web/20080404045943/http://masr.20at.com:80/newArticle.php?sid=14986"

