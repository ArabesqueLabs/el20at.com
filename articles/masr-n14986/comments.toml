[[comments]]
order = 6
subject = "بلادَ السَّوادْ"
author = "أحمد مطر"
posted = "2008-04-03"
text = "بلادي تُسَمّي بلادَ السَّوادْ.<br />لِفَرْطِ القِري..<br />أم لِخَرْطِ القِتادْ؟!<br />فمِن عَهْدِ عادْ<br />تَهيجُ الشَّتائلُ فوقَ الروّابي<br />وتَسمو السّنابلُ بينَ الوهادْ<br />وإذ يَطمَعُ النّاسُ بالشّبْعِ منها<br />تَدورُ المناجِلُ يومَ الحَصادْ<br />حرائقَ تَذرو غِلالَ الرَّمادْ<br />بهذي البلادْ!<br />تَموتُ الثّعابينُ فوقَ الجبالِ<br />فتحيا العقارِبُ في كُلِّ وادْ.<br />تَغيبُ التّماسيحُ.. تبدو السَّحالي<br />يَروحُ القُرادُ.. يَجيءُ الجَرادْ.<br />بُيوضُ الزَّواحِفِ مِن كُلِّ نوعٍ<br />بهذي البلادْ!<br />يَدورُ الصِّراعُ كسوقِ المَزادْ:<br />بأيِّ اللصوصِ سَيُرعي الكَسادْ؟<br />لدي أيِّ جِلْفٍ يكونُ العِتادْ؟<br />علي أيِّ وَغْدٍ سيرسو الفَسادْ؟<br />وتَعلو الدّلاءُ.. وتهوي الدّلاءُ<br />فيُشرِقُ لَيلُ المُبيدِ الجَديدِ<br />ويَغرُبُ لَيلُ المبيدِ المُبادْ.<br />ويَجري البلاءُ بهذي البلادْ<br />كفيلمٍ مُعادْ!<br />بهذي البلادْ<br />تَسيلُ الدِّماءُ.. ويَجري المِدادْ.<br />تُعادُ البَسوسُ<br />وتَفني النُّفوسُ<br />وتأتي الدُّروسُ وتمضي الدُّروسُ<br />ولا تُستَفادْ.<br />كذلكَ كانتْ<br />كذلكَ أمسَتْ<br />كذلكَ تبقي ليومِ المَعادْ!<br />بلادي تُسَمّي بلادَ السَّوادْ..<br />لِطُولِ الحِدادْ!"
archived = "2008-04-04"
capture_url = "https://web.archive.org/web/20080404045943/http://masr.20at.com:80/newArticle.php?sid=14986"

