subject = "أقوال علماء السنه في جماعة الاخوان المسلمين"
author = "مش ضروري وعمري ما حسكت"
posted = "2008-04-02"
text = "أقوال علماء السنه في جماعة الاخوان المسلمين<br />1- فتوى سماحة الشيخ العلامه عبدالعزيز بن باز رحمه اللهسئل رحمه الله: أحسن الله إليك حديث النبي صلى الله عليه وسلم في افتراق الأمم قوله: (ستفترق أمتي على ثلاث وسبعين فرقه كلها في النار الا واحده) الحديث. فهل جماعة التبليغ على ما عندهم من شركيات وبدع، وجماعة الاخوان المسلمين على ما عندهم من تحزب وشق للعصا على ولاة الأمر...هل هاتان الفرقتان تدخلان في الفرق الهالكه؟<br />الجواب: تدخل في الاثنتين والسبعين، ومن خالف عقيدة أهل السنه والجماعه دخل في الاثنتين والسبعين، المراد بقوله (أمتي) أي أمة الاجابه أي استجابوا لله وأظهروا اتباعهم له، ثلاث وسبعون فرقه، الناجيه السليمه التي اتبعته واستقامت على دينه، واثنتان وسبعون فرقه فيهم الكافر وفيهم العاصي وفيهم المبتدع أقسام.<br />السائل: يعني هاتان الفرقتان من ضمن الاثنتين والسبعين؟<br />الجواب: نعم من ضمن الاثنتين والسبعين. (من شريط أحد دروس المنتقى في مدينة الطائف قبل وفاته بسنتين رحمه الله).<br />وسئل رحمه الله: سماحة الشيخ: حركة الخوان المسلمين دخلت المملكه منذ فتره وأصبح لها نشاط بين طلبة العلم، ما رأيكم في هذه الحركه؟ وما مدى توافقها مع منهج السنه والجماعه؟<br />الجواب: حركة الاخوان المسلمين ينتقدها خواص أهل العلم، لأنه ليس عندهم نشاط في الدعوه الى توحيد الله وإنكار الشرك وانكار البدع، لهم أساليب خاصه ينقصها عدم النشاط في الدعوه الى الله، وعدم التوجه الى العقيده الصحيحه التي عليها أهل السنه والجماعه. فينبغي للاخوان المسلمين ان تكون عندهم عنايه بالدعوه السلفيه، الدعوه الى توحيد الله، وإنكار عبادة القبور، والتعلق بالاموات والاستغاثه بأهل القبور كالحسين أو الحسن أو البدوي، أو ما أشبه ذلك، يجب أن يكون عنايه بهذا الاصل الاصيل، بمعنى لا اله الا الله، التي هي أصل الدين، وأول ما دعا إليه النبي صلى الله عليه وسلم في مكه دعا الى توحيد الله، الى معنى لا اله الا الله، فكثير من أهل العلم ينتقدون على الاخوان المسلمين هذا الأمر، أي عدم النشاط في الدعوه الى توحيد الله والاخلاص له وإنكار ما أحدثه الجهال من التعلق بالاموات والاستغاثه بهم والنذر لهم والذبح لهم الذي هو الشرك الاكبر، وكذلك ينتقدون عليهم عدم العنايه بالسنه: تتبع السنه والعنايه بالحديث الشريف وما كان عليه سلف الامه في أحكامهم الشرعيه، وهناك أشياء كثيره نسأل الله أن يوفقهم ويعينهم ويصلح أحوالهم. (نقلا عن مجلة المجلة عدد 806).<br />2- فتوى محدث الشام العلامه الشيخ محمد ناصر الدين الألباني رحمه الله<br />قال: \"ليس صوابا أن يقال إن الإخوان المسلمين هم من أهل السنه لأنهم يحاربون السنه\" (من شريط غتوى حول جماعة التبليغ والاخوان من تسجيلات منهاج السنه في الرياض).<br />3- فتوى الشيخ العلامه محمد العثيمين رحمه الله في حكم تعدد الجماعات<br />سئل رحمه الله: هل هناك نصوص في وسنة نبيه محمد صلى الله عليه وسلم فيهما إباحة تعدد الجماعات أو الاخوان؟<br />الجواب: \"ليس في الكتاب ولا في السنه ما يبيح تعدد الاحزاب والجماعات بل ان في الكتاب والسنه ما يذم ذلك، قال تعالى {إن الذين فرقوا دينهم وكانوا شيعا لست منهم في شيئ إنما أمرهم الى الله ثم ينبئهم بما كانوا يعملون} وقال تعالى {كل حزب بما لديهم فرحون} ولا شك أن هذه الاحزاب تتنافى مع ما أمر الله به، بل ما حث الله عليه في قوله: {وأن هذه أمتكم أمه واحده وأنا ربكم فاتقون}.<br />وقول بعضهم: إنه لا يمكن للدعوه أن تقوى الا إذا كانت تحت حزب؟<br />نقول: هذا ليس بصحيح، بل ان الدعوه تقوى كل ما كان الانسان منطويا تحت كتاب الله تحت كتاب الله وينة رسوله صلى الله عليه وسلم متبعا لآثار النبي صلى الله عليه وسلم وخلفائه الراشدين\" من كتاب جماعه واحده لا جماعات للشيخ ربيع المدخلي حفظه الله.<br />4- فتوى فضيلة الشيخ صالح بن فوزان الفوزان حفظه الله.سئل -حفظه الله- :هل هذه الجماعات تدجل في الاثنتين وسبعين فرقه الهالكه؟<br />فقال: \"نعم، كل من خالف أهل السنه والجماعه ممن ينتسب الى الاسلام في الدعوه أو في العقيده أو في شيئ من أصول الايمان، فإنه يدخل في الاثنتين والسبعين فرقه، ويشمله الوعيد، ويكون له من الذم والعقوبه بقدر مخالفته\"<br />وسئل: ما حكم وجود مثل هذه الفرق: التيليغ والاخوان المسلمين وحزب التحرير وغيرها في بلاد المسلمين عامه؟<br />فقال: \"هذه الجماعات الوافده يجب ألا نتقبلها لأنها تريد ان تنحرف بنا تفرقنا وتجعل هذا تبليغيا وهذا إخوانيا وهذا كذا...، لم هذا التفرق؟ هذا كفر بنعمة الله سبحانه وتعالى، ونحن على جماعه واحده وعلى بينه من أمرنا، لماذا نستبدل الذي هو أدنى بالذي هو خير؟ لماذا نتنازل عما أكرمنا الله سبحانه وتعالى به من الاجتماع والألفه والطريق الصحيح، وننتمي الى جماعات تفرقنا وتشتت شملنا وتزرع العداوه بيننا؟ هذا لا يجوز أبدا\"<br />من كتاب الاجوبه المفيده عن أسئلة المناهج الجديده، من إجابات الشيخ صالح الفوزان.<br />5- فتوى فضيلة الشيخ العلامه صالح اللحيدان حفظه الله<br />قال – حفظه الله -: \"الاخوان وجماعة التبليغ ليسوا من أهل المناهج الصحيحه فإن جميع الجماعات والتسميات ليس لها أصل في سلف هذه الأمه.<br />وأول جماعه وجدت وحملت الاسم جماعه الشيعه تسموا بالشيعه. وأما الخوارج فما كانوا يسمون أنفسهم الا بأنهم المؤمنون..\".<br />(فتاوي العلماء في الجماعات وأثرها على بلاد الحرمين: تسجيلات منهاج السنه السمعيه بالراض).<br />6- فتوى فضيلة الشيخ العلامه عبدالله بن غديان حفظه اللهقال –حفظه الله-: \"البلاد هذي كانت ما تعرف اسم جماعات لكن وفد علينا ناس من الخارج، وكل ناس يؤسسون ما كان موجودا في بلدهم.<br />فعندنا مثلا ما يسمونهم بجماعة الاخوان المسلمين وعندنا مثلا جماعة التبليغ وفيه جماعات كثيره، كل واحد يرأس له جماعه يريد الناس يتبعون هذه الجماعه ويحرم ويمنع اتباع غير جماعته ويعتقد أن جماعته هي التي على الحق وأن الجماعات الاخرى على ضلاله. فكم فيه حق في الدنيا؟<br />الحق واحد كما ذكرت لكم. ان رسول الله صلى الله عليه وسلم بين افتراق الأمم وأن هذه الأمه ستفترق على ثلاث وسبعين فرقه , كلها في النار إلا واحده . قالوا من هي يا رسول الله قال : (( من كل على مثل ما أنا عليه اليوم وأصحابي )).<br />كل جماعه تضع لها نظام . ويكون لها رئيس , وكل جماعه من هذه الجماعات يعملون بيعه, ويريدون الولاء لهم وهكذا .<br />فيفرقون الناس - يعني البلد الواحده – تجد أن اهلها يفترقون فرق , وكل فرقه تنشأ بينها وبين الفرقه الأخرى عداوة , فهل هذا من الدين ؟ لا , ليش هذا من الدين , لأن الدين واحد, والحق واحد. والامه واحده, الله جل وعلا يقول: كنتم خير أمه\" ما قال كنتم أقساما, لا, قال ( كنتم خير أمه أخرجت للناس )<br />وفي الحقيقه إن الجماعات هذه جاءتنا وعملت حركات في البلد؛ حركات سيئه, لأنها تستقطب وبخاصه الشباب, لأنهم مايبون ( أي: لا يريدون ) الناس الكبار هذولا ( أي: هؤلاء ) قضوا منهم مالهم فيهم شغل !<br />لكن يجون ( أي: يأتون ) أبناء المدارس في المتوسط وأبناء المدراس في الثانوي وأبناء المدارس في الجامعات وهكذا بالنظر للبنات أيضا .<br />فيه دعوة الآن لجماعه الإخون المسلمين , وفيه دعوة لجماعه التبليغ حتى في مدارس البنات .<br />فلماذالايكون الإنسان مع الرسول صلى الله عليه وسلم ......\".<br />(فتاوي العلماء في الجماعات وأثرها على بلاد الحرمين: تسجيلات منهاج السنه بالرياض)."
archived = "2008-04-04"
