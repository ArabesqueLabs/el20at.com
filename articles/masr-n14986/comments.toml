posted = "2008-04-02"
text = "يا جماعة الاخوان المسلمين دول لا يصلحون للحكم باي حال من الاحوال<br />لان الانسان اللي يعشق السجون والمعتقلات ما ينفعش يحكم<br />ناس ما عندهمش رحمة باسرهم بيسيبو ولادهم وزوجاتهم ويرموا نفسهم في المعتقلات علشان خاطر الشهرة السياسية<br />اللي ما عندهوش رحمة بزوجته وبأولاده عمره ما حيكون عنده رحمة بشعبه"
