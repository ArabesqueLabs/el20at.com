text = "سنة 2008 هتكون سودة على النظام<br />كل يوم مظاهرات واحتجاجات واعتصامات واضرابات<br />وستتطور الامور الى مجاعة<br />وستنتشر الحرائق فى كل مكان<br />وسيصحوا الناس ذات صباح وقد هرب النظام بفلوسة بطيارة خاصة وترك البلد<br />هل هناك حل غير الاخوان؟<br />قولوا يا ناصحين<br />من يحكم المجاعة<br />هل هناك قوة فى الشارع اقوى من الاخوان<br />مفيش - والسبب النظام الفاشل<br />يبقى تسكتوا<br />فى انتظار ما يكون"
archived = "2008-04-04"
capture_url = "https://web.archive.org/web/20080404045943/http://masr.20at.com:80/newArticle.php?sid=14986"

[[comments]]
order = 10
subject = "انا مش فاهم"
author = "محمد الانصاري"
posted = "2008-04-03"
text = "انا مش فاهم يعني ايه يسعون للتسلل للساحه الشرعيه<br />امال هوه عايز الناس لما تعوز تقول رايها تعمل ايه تقول في الساحه الشرعية ولا في السر وفي الساحات غير الشرعيه<br />هوه الراجل ده غبي ولا انا اللى غبي<br />ده ملهوش علاقه بان الاخوان صح او غلط<br />انا مستغرب الناس اللى قعده تنقد في الاخوان وتكتب راي علماء الاسلام فيهم<br />طيب فين راي العلماء في التعذيب والسجون وفي السرقه والنهب<br />وبعدين سواء كان الاخوان وحشين او حلوين من حقهم انهم يقولو رايهم وانهم يترشحوا في الانتخابات وبعدين الشعب يختار"
archived = "2008-04-04"
capture_url = "https://web.archive.org/web/20080404045943/http://masr.20at.com:80/newArticle.php?sid=14986"

