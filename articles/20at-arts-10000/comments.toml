subject = "بغداد...أبتسمي الارهاب ولى"
author = "ابو حنين الكريماوي"
posted = "2008-09-11"
text = "ابتسمي بغداد..حبيبتي.......عادت من جديد أزقتك الى الحياة..في هذا الزقاق يلعبون المحيبس...وهناك صبيه يتراكضون خلف كرة قولي تبا للارهاب الذي فرق بين هذا وذاك ....انهضي من جديد ولمي شمل أحبتك وفرقي بين أهلك صواني الزلابيه هذا رمضان يكحل عينيك وأحملي بين ذراعيك أطباق سحور العافيه .....وأمسحي دموع يتامى المفخخات لتنطلق مراجيح العيد القادم ...نبتهل لله أن يعم الامن والسلام أزقة بلدي"
