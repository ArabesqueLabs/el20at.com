[[comments]]
order = 1
subject = "نهلة إمام، مدرس العادات والتقاليد بأكاديمية الفنون"
author = "ابومحسن"
posted = "2007-10-01"
text = "يا اخ عمر الحناوي كيف حالك<br />اول مرة اسمع ان العادات والتقاليد ليها مدرسين وتخصص اكاديمي في كلية<br />وهذا شيء جميل جدا<br />وهو دا اللي يستاهل عمل تحقيق صحفي علشان خاطر تبين للناس ازاي العادات والتقاليد اصبحت مادة علمية تدرس في الجامعات<br />مش رسائل وخرابيط وكلام فارغ<br />ننتظر منك تحقيق عن مادة العادات والتقاليد<br />سلامي لك"
