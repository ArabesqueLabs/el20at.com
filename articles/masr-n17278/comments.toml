[[comments]]
order = 1
subject = "تفاءلوا بالخير تجدوه"
author = "أحمد زهران"
posted = "2008-08-18"
text = "بالرغم من براعة أخي أحمد في رسم هذه الصورة المكرورة من حياتنا إلا أنني لا أحبذ الخاتمة بقوله على لسان الحاج الكبير السن : \"ما فيش فايدة\" لأننا نعمق بذلك جراحاتنا ونقنع أنفسنا بأن الأمل غار في الأرض أو طار في السماء<br />وكنت أحب أن نذكر أنفسنا والناس بأنه لا يزال هناك أمل وتفاؤل ، فالتفـــاؤل يولد الأمــل، ومن الأمـــل يولد العمــل، ومن العمــل يولد النجــاح<br />التفاؤل هو الشعور بالرضا والثقة بالنفس والسيطرة على المشاعر المختلفة، وأعجبتني الحكمة البوذية التي تقول: \"إن لكل انسان شمسين: واحدة في السماء وواحدة بداخله، وإنه حين تغيب شمس السماء ويظلم الكون فلا يضيء للانسان سوى شمسه الداخلية، وإنه لهذا السبب لا بد أن يحتفظ بها متوهجة دائمًا في داخله\".<br />إن المتشائم لا يستطيع أن يمنع الأفكار السلبية من الدخول إلى عقله. ولكن يمكنه أن يمنع نفسه من أن يعيش عليها؛ فلماذا لا نحاول جميعًا أن نتحكمفي نفسياتنا ونسيطرعلى هذه الأفكار السلبية وتتفاءل. وكما قال الرسول الكريم: \"تفاءلوا بالخير تجدوه\"."
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819150521/http://masr.20at.com:80/newArticle.php?sid=17278"

[[comments]]
order = 2
subject = "اللهم سلم"
author = "وجيه سعد"
posted = "2008-08-18"
text = "الحقيقة انه يوما بعد يوم يزداد اعجابي بالازهري الأديب الاستاذ احمد خاصة في هذا النوع من القصص المؤثر من حيث جودة المضمون وبلاغة العرض ولكني اضم صوتي الى صوت استاذنا الفاضل الاستاذ احمد زهران في ان نجيد العرض لجرحنا الاليم نعم ان نحسن نقل وشرح واقعنا المرير نعم ولكن ان نستسلم له لا . لان ترسيخ عدم الجدوى قطع للامل وتثبيط للهمم وتوقيف للعمل فاذا بنا بدلا من ان نحسن في نقل الصورة استفزازا للامكانات المعطلة والطاقات الخاملة اذا بنا نمرنها وندربها على القعود والسكون . انا طبعا أؤكد ان الاستاذليس مراده ذلك كيف وهو احد جزيئات هذا التيار الجارف الذي بدأ يسري في شرايين هذه الامة لتنتبه من غفلة وتتحرك من سكون"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819150521/http://masr.20at.com:80/newArticle.php?sid=17278"

[[comments]]
order = 3
subject = "استدراك"
author = "أحمد عبد الحميد"
posted = "2008-08-18"
text = "الأستاذين الجليلين رجال ا<br />أحمد زهران ووجيه سعد<br />شكرا أولا علي مروركما وتعليقكما القيم<br />ثانيا بالنسبة للنبرة التشاؤمية الموجودة بالقصة<br />لا يعني بالمرة فقدان الأمل في التغيير ، ونفض اليد عن الإصلاح ، أو القعود للبكاء والنحيب علي ما ألم بالأمة<br />وإنما القصة في النهاية تعري واقعا مؤلما يتم دفنه وطمسه أمام عنتريات رجلي الأعمال أحمد عز وهشام طلعت مصطفي ، وغلبة أخبار المناضلين الكرويين الحضري وأحمد شوبير ، ونزوات الفاتنتين المفتونتين هيفاء واليسا ، ,ومسلسلات المراهقتين أبدا ودائما يسرا والهام شاهين<br />أبقاهما الله ذخرا للفن الهادف وال‘لام المصري الرائد ...<br />القصة تحاول أن تضع في الصورة عم عاشور اللي بيقبض من الأوقاف 195 جنيه في الشهر وعنده تسع بنات ( الله أكبر ) ونفسه ومني عينه يجهز الكبيرة فيهم قبل ما يتفضح أمام خلق الله<br />بتحط في الصورة الست زينب اللي جوزها الفلاح اللي بيطلع علي الله بيشتغل بيوميه 25 جنيه وأخرة المتمة -علشان فلاح ومالوش تأمين - لم مرض الكبدي أصابه وهد حيله ماعرفش يتعالج علشان ماعندوش تأمين ولا معاش<br />القصة بتحاول انها تحط في الصورة اللي الزوم بتاعها ضيق أوي وما عرفش يشوف غير نزوات حسام أبو الفتوح مع دينا ، وألبوم تامر حسني الجديد والدعاة الجدد اللي مش بنشوفهم إلا في التكييف إنها تطلع<br />صبري حسن صاحبي اللي متجوز ومخلف ومعاه بكالورويس حقوق وشغال ب300 جنيه في شركة أمن طبعا بعد ما بيدفع 35 جنيه تأمين<br />القصة بتحاول انها تحط في الصورة صاحبي الشيخ عاشور اللي قاعد بيشكي ليا انه بيقبض 450 جنيه من وزارة الأوقاف<br />بيخلصوا في عشر ايام في الشهر رغم انه واخد ليسانس أصول دين بتقدير عام امتياز مع مرتبة الشرف<br />بتحاول انها تحط في الصورة تلاتة اربع اصحابي اللي مش عارفين يقبضوا من جريدة الدستور المناضلة 50 جيه علي المقالة في القوت اللي بيهبش صاحبها ألاف مؤلفة من الهب والفضة والقناطير المقنطرة من توزيع الجريدة وفلوس الإعلانات ( الاعلان نصف صفحة واقف ب80 الف جنيه )<br />علشان الناس تحسد وتقر وتنق زي ما هي عايزة ( هم بيتأثروا بحاجة )<br />أما عن اللتفاؤل<br />ربنا يسهل كده<br />واشوفكم راكبين<br />عربية رايحة فيصل وواقفة بيكم في نصف الشارع<br />ساعتها<br />هاتمحوا من القاموس اللغوي بتاعكم كلمة تفاؤل<br />شرفتم مقالي"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819150521/http://masr.20at.com:80/newArticle.php?sid=17278"

