posted = "2008-08-19"
text = "يا الروقان دا يا محترم والله اعنقد انك عبرت عن ما يجول فى خاطر كثير من شعبنا العجيب مش عايز اقول طيب وغلبان لاننا احنا بسكوتنا على ال بيعملة النظام منبقاش طيبين بل نبقى اى حاجة تانية غير موضوع طيبين دة عموما تهانيا لك يا حبيب قلبي فكل مقالة لك او قصة او اى شيئ تكتبة يستحق التهنئة وعقبال مااهنيك لما شعبنا يتحرك ويقول لالالالا طويلة الامد لحد ماالنظام يعدل الحال او يرحل ويسيبها لحد تاني يحاول ينقذ السفينة لانها بتغرق ... ودمتم"
archived = "2008-08-20"
capture_url = "https://web.archive.org/web/20080820194750/http://masr.20at.com:80/newArticle.php?sid=17278"

