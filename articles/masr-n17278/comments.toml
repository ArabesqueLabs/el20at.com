subject = "يا أخي دا انت تيجي في الهايفة وتتصدر"
author = "احمد"
posted = "2008-08-20"
text = "سيادة اللوا أركان حرب اللي بيعلق علي موضوع الشاي ، كأن سيادتك ما عرفتش قبل كده ان تسعين في المية من المصريين اللي عندهم سكر مثلا مش بيبطلوا أكل محشي كل يوم خميس ، وضرب كنافة بسمنة بلدي في رمضان ، وشاي سكر زيادة بيحبسوا بيها بعد كل أكلة ، وقزقزة لبة كوسة وعباد ولب سوري وأحيانا حمص الشام في أي ماتش كورة حتي ولو كان بين قطبي الكرة المصرية سوهاج والسنبلاوين"
