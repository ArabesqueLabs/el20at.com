text = "يا عم انت يا بتاع الشاي<br />يا غلس يا رخم<br />الرجل من زهقه<br />قعد ع القهوة<br />وشرب شاي بخمسين قرش سادة من غير حليب<br />وكمان ع النوتة<br />انت مالك انت<br />دا انت غريب وغلس بشكل يا أخي"
