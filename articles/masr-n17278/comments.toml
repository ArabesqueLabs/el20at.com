posted = "2008-08-19"
text = "قصة قصيرة جامعه لحالنا الباس نسال الله السلامة من هذا الزمان<br />بس النهاية في رايي ضعيفة عن الواقع لان المفروض الراجل يموت قهرا<br />لانه كان المفروض يفرح باولاده اللي هيسندوه في كبره بس للاسف<br />الولاد عايزين اللي يسندهم و يساعدهم في شغلهم و بعدين جوازهم<br />و لا عزاء للمصريين"
