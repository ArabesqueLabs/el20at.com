[[comments]]
order = 15
subject = "الله ينور"
posted = "2008-08-20"
text = "قصه واقعيه لواقع نحياه<br />بل ويحدث ما هو اشد من ذلك<br />نسأل الله العفو والعافيه<br />وهو وان كان فى ظاهره يدل على التشاؤم الا انه يعكس الواقع بشكل كبير<br />فنحن لا نجد شخصا ما لديه كل هذه المشاكل ونراه مبتسم الثغر فرح الفؤدا<br />مرددا ( الحياه حلوه بس نفهمها الحياه غنوه ما احلى انغامهما )<br />واذا وجدنا شخص يفعل ذلك فلابد انه فقد عقله من هول ما يجد<br />القصه واقعيه وتحدث كثيرا ولست ارى لها نهايه افضل من ذلك<br />والا نكون بعدنا كثيرا عن الواقع<br />اما بالنسبه لمن يعيب فى كاتبها ويرى انه وعلى حد تعبيره ( كاتب كلمتين علشان يا خد بيهم .....الخ )<br />هذا ليس باسلوب رحمك الله !!<br />وان كنت ارى يا اخى ان هذه الصوره نراها جميعا ليل نهار فلما التهكم والسخريه !!!!<br />مع الاخذ فى الاعتبار ان شرب الشاى عاده اعتادها المصريون<br />ولو كانت نظرتك عميقه لما سخرت منه وقلت ذلك<br />فهو وان كان ينتقد الواقع الذى يعيشه هذا الرجل الا انه ينتقد ايضا<br />جهل هذا المجتمع وثقافته ازاء استعمال هذه الاشياء<br />فكثير منا نراه وقد استهلك المرض قواه الا انه لايزال يفعل ما يضره<br />ولن ابالغ اذا قلت انه احيانا يكون الانسان لديه سرطان بالرئه ولا يزال يدخن<br />وعجبي<br />تسلم الايادى"
archived = "2008-08-20"
capture_url = "https://web.archive.org/web/20080820194750/http://masr.20at.com:80/newArticle.php?sid=17278"
