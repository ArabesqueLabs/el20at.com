[[comments]]
order = 0
subject = "حكمك تأبيدة"
author = "الشاعرة دينا قدرى"
posted = "2008-05-03"
text = "تأبيدة --- -- - تأبيدة -- -- حكمك عدى التأبيدة<br />طهأنا خلاص م الحاشية خلاص والسنيدة<br />بعنا هدومنا -- -- بعنا عيالنا -- بعنا كمان الحديدة<br />شد رحالك -- -- لم جمالك -- لم الاسرة السعيدة<br />امشوا وفارقوا -- -- روحوا لديار تانية بعيدة<br />نشفت مصر وغطى الفقر عهدى ومحسن وتفيدة<br />دقنا فى عهدك كل المر واتغنى فى كل قصيدة<br />كل وعودك كذب فى كذب ما صدقت فى كلمة وحيدة<br />محروق وغريق بيدعوا عليك كل شهيد وشهيدة<br />فين العدل فين الانصاف قول يا كتاب قول يا جريدة<br />مصر الحلوة عايزة تفوق تبدأها صفحة جديدة<br />ما فيهاش ظلم ولا استعباد ولا ايام سودة اكيدة<br />ولا فرعون يخلف فرعون ننهى حكم التأبيدة<br />دنيا قدرى"
archived = "2010-03-14"
