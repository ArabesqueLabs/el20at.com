text = "زمان ايام طيب الذكر الرئيس ناصر كان ممنوع استيراد الياميش لانة كماليات والاولى ان نشترى القمح للناس ليأكلوا رغيف الخبز<br />وفى الحاضر نستورد الياميش ونستورد الزبادى من فرنسا ونستورد الكافيار لبعض الناس اللى فوق اما القمح بتاع الشعب فيروحوا فى ستين داهية واللى عايز عيش يقف فى الطابور وينذل وينضرب يالجزمة القديمة<br />ياميش اية<br />مين اللى معاة فلوس يشترى ياميش ومكسرات 2% من الشعب<br />مالة الزبيب المصرى<br />ومالة التين المصرى<br />فية مثل شعبى بيقول عريان ال......... يتأمز تأميز ويسأل باب الخمارة فين"
