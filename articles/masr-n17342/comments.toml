[[comments]]
order = 0
subject = "وقام بفتح كشك صغير بشارع الإسكندرية بمرسى مطروح"
author = "مش ححبك"
text = "يا مروة صاحب الكشك في مرسى مطروح<br />وانت طبعا ساكنه في القاهرة<br />كان لازم توضحي في المقال الظروف اللي خلتك تسافري مرسى مطروح او ازاي التقيتي بصاحب هذا الكشك<br />وشكرا"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060107/http://masr.20at.com:80/newArticle.php?sid=17342"

[[comments]]
order = 1
subject = "احدث نكتة فى الشارع عن حريق مجلس الشورى"
author = "مشرف"
text = "مبارك قال لصفوت الشريف<br />هو مشرف قدم استقالتة فى باكستان لمين ؟<br />رد الشريف<br />للبرلمان ياريس<br />فقال مبارك<br />احرقوة"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060107/http://masr.20at.com:80/newArticle.php?sid=17342"
