text = "موضوع جيدا جدا وهو بصراحة قضية الشيشة اصبحت عندنا في المغرب مشكلة كبيرة ما نفتأ ننهي مشكلا حتى نقع في آخر أشكر الكاتبة الكريمة على طرحها لهذه القضية وايضا ارى ان مواضيع الصحفية ليلى تلامس بدقة مواضيع مطروحة عندنا في المغرب<br />اتمنى لك استاذة ليلى مزيدا من التألق وننتظر منك مزيدا من المواضيع<br />شكرا شكرا شكرا"
