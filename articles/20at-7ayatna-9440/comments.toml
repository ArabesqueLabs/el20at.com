text = "فعلا و اللأسف ظاهرة الشيشة أصبحت في بلادنا آفة كبرى حيتما أدرت وجهك وجدت شبانا وشابات يدخنونها وهم في قمة النشوة و كانها اصبحت دليل على التحضر و الرقي كنا نظن اننا نقلد فقط الغرب لكن اصبحنا نقلد الكل فقط في الظامور التافهة لا غير"
