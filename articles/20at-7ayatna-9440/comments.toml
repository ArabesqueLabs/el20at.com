subject = "بلاء غريب  دخل على الثقافة المغربية"
author = "نادية العربي"
posted = "2008-06-26"
text = "المعروف على الشباب المغربي التقليد والتقليد الأعمى الذي لا معنى له ويا ليتهم اقتصروا على لبس السراويل الممزقة فالأمر أهون من أن يخرب الواحد منهم صحته ويلجأ إلى المستشفيات التي -وكما يعلم الجميع- تعيش حالة مزرية لا تساعد الوافد إليها إلا على الموت.. شكرا على إثارة الموضوع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "لابد من الحذر"
author = "مريم"
posted = "2008-06-26"
text = "السلام عليكم<br />فعلا موضوع يفتح بابا اخر للتسائل، هل فعلا الانفتاح على الثقافات الاخرى امر إيجابي أم لا، والجذير بالذكر أن لابد من الحذر فليس كل ما يلمع ذهبا، وظاهرة تدخين الشيشة ما هي الا واحدة من الامور التي يجب أخذ العبرة منها فالمذاق الحلو ما هو الا طعم للوقوع في مصيدة الادمان.<br />استمري اختي ليلى"
archived = "2010-03-14"
