[[comments]]
order = 4
subject = "القانون لايكفي"
author = "عابر سبيل"
posted = "2008-06-27"
text = "شكرا لك ياليلى على الموضوع الجميل والالتفاتة لهذا الموضوع.<br />في الحقيقة ربما المغرب اصبح اول دولة عالمية من حيث عدد القوانين في المجالات المختلفة... لكني اعتقد ان المغرب ليس بحاجة الى قانون منع الشيشة او التدخين الذي لازال يدخن في الاماكن العمومية رغم مرور سنة على ذلك... القوانين في هذا البلد لا تطبق الا عندما يتعلق بكبش فداء ..نحن بحاجة الى فعل وتطبيق وليس فقط اصدار المراسيم والقوانين .. هذه تمنع وتلك تبيح ..هذا مغربنا للاسف<br />الله يعفو وخلاص<br />مع خالص تحياتي لكاتبة الموضوع"
archived = "2010-03-14"
capture_url = ""

