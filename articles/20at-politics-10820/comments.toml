order = 0
subject = "اهداء غلى ملوك الطوائف"
author = "المصري العربي"
posted = "2008-12-31"
text = "للتاريخ حديث هام<br />ها هو التاريخ يعيد نفسه معنا ونُلدغ من نفس الجحر مرارا وتكرارا، ولا نتعلم من أخطائنا! لن أطيل الحديث، بل سأدع التاريخ يتكلم عنّا.<br />في أواسط القرن الخامس الهجري كانت دولة الإسلام في الأندلس تعاني من مرحلة هي الأسوأ في تاريخها، حيث تحولت من عهد الدولة الواحدة القوية وهو عهد الخلافة الأموية إلي عهد ملوك الطوائف. وفيه انقسمت دولة الإسلام إلي اثنين وعشرين دويلة، علي رأس كل واحدة منها مجموعة من الطامعين والمتغلبين بأسرة أو بثروة أو بعشيرة، وهم أبعد الناس عن الإحساس بقضايا دولة الإسلام في الأندلس التي كانت تعاني وقتها من تسلط القوى الإسبانية النصرانية في شمال الأندلس. ولا عزيمة لهم إلا في تحصيل الملذات واكتناز الثروات من أي سبيل. ولا يهمهم سوي الحفاظ علي كراسيهم ومناصبهم. و لا يبالون بحلال ولا حرام ولا مبادئ ولا أخلاقيات في سبيل تحقيق مصالحهم الخاصة. لقد وصفهم علاًمة الزمان الإمام ابن حزم بعبارات قوية وسديدة عندما قال في شأنهم: [ والله لو علموا أن في عبادة الصلبان تمشية أمورهم لبادروا إليها. فنحن نراهم يستمدون النصارى، فيمكنونهم من حرم المسلمين و أبنائهم ورجالهم، يحملونهم أساري إلي بلادهم. وربما أعطوهم المدن والقلاع طوعاً، فأخلوها من الإسلام وعمروها بالنواقيس. لعن الله جميعهم وسلط عليهم سيفا من سيوفهم ].<br />ونحن لا نستطيع أن نتهم الإمام الكبير ابن حزم بالتحامل علي ملوك الطوائف ووصفهم زورا بهذه العبارات القاسية. فهو مفكر عصره وأكبر علماء وقته وقد شاهد بعينه ما يرويه عن هؤلاء الملوك. والعجيب أنه قد مات سنة 456 هجرية وملوك الطوائف وقتها في عنفوان قوتهم و مقتبل أمرهم. ولكنه كان يري بعين بصيرته ما سيجري بعد ذلك من سقوط مروع. فلم تمضي سوي سنوات معدودة حتى حاصر الصليبيون الأسبان مدينة طليطلة العريقة حاضرة الإسلام وقلبه النابض في وسط الأندلس، وضربوا حصاراً خانقاً علي المدينة. وأخذ أهلها في الاستغاثة بالمسلمين في أنحاء الأندلس. والأقوات تنفد من عندهم يوماً بعد يوم. وملوك الطوائف لا يحركون ساكناً خوفا من سطوة نصارى إسبانيا. حتى المعتمد ابن عباد ملك إشبيلية وقرطبة أقوى ملوك الطوائف وأكثرهم قدرة وجهوزية علي إنقاذ المدينة المحاصرة، لأنه يشترك معها علي الحدود، ومملكته أقرب الممالك من طليطلة، ويملك جيشاً كبيراً قادراً علي مواجهة العدوان الإسرائيلي أقصد الإسباني، لم يحرك ساكناً ولم يبعث حتى برسائل تهديد للصليبيين. بل هوى لأحط درجات الإنسانية وتجرد من معاني الكرامة والعزة الإسلامية وتآمر مع النصارى من أجل أن يسمحوا له بتوسيع مملكته وأخذ قطعة من غنيمة طليطلة الكبيرة. ومع اشتداد الحصار علي غزة أقصد طليطلة، ونفاد المؤن والأقوات، واستمرار التجاهل من ملوك الدول العربية أقصد ملوك الطوائف، سقطت طليطلة. فما الذي جري بعد ذلك؟<br />حسب ملوك الطوائف أن نصارى إسبانيا سيقنعون بغنيمة طليطلة فقط. وظنوا أنهم إذا قدموا غزة أقصد طليطلة ضحية لإرضاء النهم الإسرائيلي أقصد الإسباني ستنتهي المشكلة. ولكن الواقع أن سقوط طليطلة كان مجرد البداية لحملة الإسترداد الصليبية الإسبانية المعروفة تاريخيا. وأن ملوك الطوائف سيدفعون ثمن خذلانهم لطليطلة غاليا. وأن سنن السقوط ستبدأ في العمل في تلك العروش والكراسي التي من أجلها تخلي معتلوها عن أبسط معاني الإسلام والشهامة والنخوة. لم تمض سوى سنوات قليلة حتى جاء المرابطون من عدوة المغرب بقيادة البطل يوسف بن تاشفين وأسقطوا حكم ملوك الطوائف وانتصروا علي الصليبيين وأعادوا لدولة الإسلام في الأندلس بريقها ومجدها الزائل أيام الحقبة المشئومة لملوك الطوائف.<br />دعونا نساهم لبقاء إسرائيل<br />رئيس شركة ستار بوكس للقهوة صّرح انه سيضاعف التبرعات لإسرائيل لقتل أوغاد العرب !! (وهو المعروف بأنه يدفع ملياري دولار سنوياً لإسرائيل من أرباح ستار بوكس<br />شركة فيليب موريس ( المنتجة لسجائر مارلبورو ) تدفع التبرعات بصفة يومية !!! في كل صباح تدفع شركة فيليب موريس للسجائر ما مقداره 12% من أرباحها لإسرائيل ومدخني العالم الإسلامي يستهلكون سجائر من<br />فيليب موريس بقيمة 100 مليون دولار‏ :وعليه فإن مدخني العالم الإسلامي يدفعون لإسرائيل كل صباح 12 مليون دولار ‏<br />على فكرة : تكلفة الطائرة اف 16 أحدث طراز نصف مليون دولار فقط ، يعني إننا ندفع قيمة 24 طائرة حربية يومياً<br />للأسف..........<br />ستار بوكس STARBUCS<br />ماكدونالدز McDonalds \\\\\\' &n bsp<br />برجر كينج BURGER KING<br />كنتاكي KENTUCKY<br />بيتزا هت PIZZA HUT<br />كوكا كولا COCA COLA<br />بيبسي PEPSI COLA<br />فردركرز FUDRACKERS<br />والقائمة يعرفها الجاهل قبل المتعلم<br />لنتوقف عن شراء البضائع الأمريكية والبريطانية فقط لشهر واحد<br />خصوصا البضائع التي يمكن الاستغناء عنها و لن يضر ذلك بسير حياتنا<br />أعد إرسال الرسالة لمن تعرف<br />أمريكا تخسر8.6 بليون دولار باليوم عندما لا تشتري بضاعتها فقط في شهر واحد<br />( فوفرها على نفسك و على بلدك(<br />أرجوك لا تنتظر، أرسلها لكل من تعرف<br />ثمنها 8.6 /7*30 = 36.68 بليون ........؟؟؟؟؟<br />أنا أعرف انك باستطاعتك فعلها، أرجوك أفعلها و لو كمسلم حقيقي<br />أخبر إخوانك<br />لنوقف شراء البضائع الأمريكية والبريطانية فقط لشهر واحد<br />سوف تكون تكلفة هذا الشهر عليهم 8.6 /7*30=36.86 بليون"
