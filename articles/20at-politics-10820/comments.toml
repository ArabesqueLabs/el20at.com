subject = "إلى الأخ المصرى العربى"
author = "إسلام"
posted = "2009-01-12"
text = "إنت أهبل يابنى ؟؟<br />يابنى بطل اللى بتوع الإخوان ماللين دماغك بيه ده !!<br />الكلام اللى بتقوله ده كله فى الهوا يا عم الحاج ..<br />أولا : الشركات دى اللى بيشتغل فيها فى كل بلد هم ولاد كل بلد ..<br />يعنى مثلا شركة زى ماكدونالدز فى مصر شغال فيها أكثر من 400 واحد مصرى و كلهم فاتحين بيوت و معتمدين على شغلهم تماما فى معيشتهم تقوم تيجى سيادتك إنت و شوية المرتزقة بتوع الإخوان و بكل سهولة تقطع عيشهم ؟؟<br />و بعدين إنت عارف إستهلاك العرب كلهم من كل منتجات الشركات اللى بتتكلم عنها دى لا يتعدى 5% فى كل شركة على أحسن الأحوال و ده طبعا إلى جانب إن منتجاتهم مالهاش بديل و متقوليش و النبى مكة كولا و الهبل ده علشان اللى شرب مكة كولا و بيبسى هيعرف الفرق كويس أوى (( ده مثلا يعنى ))<br />فيا حبيبى لو عاوز تقاطع قاطع و ماله بس الأول هات البديل لأكتر من 1000 أسرة على الأقل هتتشرد و تشحت بسببك إنت و أمثالك و هات كمان بدائل لكل المنتجات اللى إنت عاوز تقاطعها و بعدين إبقى قول مقاطعة .. يعنى من الآخر خليك راجل و أد كلمتك الأول و متأذيش أخوك المسلم و بعدين إبقى قول مقاطعة .<br />و رحم الله إمرئ عرف قدر نفسه يا عم الحاج إنت وهو"
archived = "2010-03-14"
