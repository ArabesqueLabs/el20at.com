text = "يه يا عم المصرى العربى ؟ إنت عاوز ترجع مصر لعصر الحروب تانى ؟؟ يا شيخ إتقى الله و حرام عليك بلدك<br />و بطلوا بقى تنفذوا أجندة خارجية ضد مصلحة البلد يا إخوان يا مسلمين<br />كل همكم إن البلد تخرب و ترجع تدخل تانى فى حروب و ضرب و خسائر بشرية و مادية حرام عليكم إتقوا الله فى بلدكم و سيبوكم من الشعارات الرنانة بتاعة القومية العربية و ما شابهها من أفوال و شعارات فارغة فمصر أهم من أى قومية عربية مزعومة و مصلحة و أمن مصر أهم من مليون غزة"
