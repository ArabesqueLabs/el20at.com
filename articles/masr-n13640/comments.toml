[[comments]]
order = 9
subject = "ميرووووو"
author = "مروة عبد الفضيل"
posted = "2008-01-02"
text = "يا شيري يا احلى بنوته في الدنيا انا قبل ما اجي الموقع كنت فاكرة انى هقابل مديرة الشغل بئه لابسه نضارة كعب كبايه ومش طايقه نفسها ولا طايقه حد نهائي لكن لما جيت الموقع لاقيت حاجه تانيه خالص بس لاقيت نفسي لازم اقولك يا استاذه شيرين وحضرتك وسيادتك والكلام ده لكن بعد كام اتصال كده بينا عشان اتفق على افكار لاقيت نفسي لوحدى بقولها يا شيري فهي بجد بنوته زي القمر وانا مش بنافق ولا حاجه وانتى عارفاني وفضلنا نبعت رسايل لبعض كتير واحلى حاجه بجد في شيري انها قريبه من كل المحررين جوه الموقع او المراسلين اللى من بره اللى انا منهم لكن عمرى ما افتكرت نفسي مش صاحبه مكان وبدخل اعد على الجهاز اللى انا عايزاه واسالوا في ده ام ننوشه او دعاء الشامي اصلها بتقول عليه قادرة ومفتريه مش عارفه ليه؟ه"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104082109/http://masr.20at.com:80/newArticle.php?sid=13640"

