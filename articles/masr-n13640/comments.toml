[[comments]]
order = 3
subject = "مش هنجتمع فى يومكوا اللى مش هيعدي"
posted = "2008-01-01"
text = "بجد يا شنشن انا كجندي مجهول فعلا لازم اقلك انا الز مديرة شفتها فى حياتي و بجد كل اللى انت كتباه و بيحصل شوفي انت عملتي ايه فى حياتك علشان ربنا يبعتنا ليك فعلا من كتر الشغب اللى فى الفصل ساعات شيرين تقولنا هنجتمع في يومكوا اللى مش هيعدي بقى ده و لا ايه و طبعا رغم النابرة الجادة الا اننا بنموت على نفسنا من الضحك على شكلها ..و كلام كتير على هذه الشاكلة بس بجد شنشن كما القبها و حمال الهموم يا صغير اللى هو الاستاذ على نائب شنشن فريق اداري رائع و محدش بيعرف يتعامل مع العشريناتية غيرهم على فكرة اطلقت على علي هذا اللقب لأنه دائما يغني لنا هذه الاغنية البديعة"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002320/http://masr.20at.com:80/newArticle.php?sid=13640"

