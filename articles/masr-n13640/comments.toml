subject = "الست المديرة"
author = "دعاء الشامي"
posted = "2007-12-31"
text = "ههههههههههههههه<br />مسخرة يا شيري بجد حلو قوي موت، نو واي ان حد ميضحكش وهو بيقراه، طبعا انت عارفه انا جبت نوواي دي منين، بس على فكرة التسعيرة كده غالية قوي عن السنة اللي فاتت يعني هنلاحق فدركرز ولا تشيللز ولا مش عارف ايه على راي استاذ عبد الله عموما سنة سعيدة علينا وان شاء الله يشهد العاتم افتتاح قسم الاطفال بنواته الاولى زيزو وتتبعه ننوشه باذن الله"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002320/http://masr.20at.com:80/newArticle.php?sid=13640"

