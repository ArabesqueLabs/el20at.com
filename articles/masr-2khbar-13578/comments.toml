text = "الموضوع انهم عايزين يبيعوا اى حاجة<br />اى حاجة يصرفوا بها على الامن المركزى وشد وجوة العواجيز ونفخ الكرمشة بالسيلكون<br />ولكن مفيش احد هيتقدم<br />لية<br />ببساطة لان الناس بتتخلص من تليفونات البيت لان ايجارة 36 جنية وكلة بيعتمد على المحمول<br />واخر اخبار التليفونات الارضية ان مليون ونصف مليون مشترك لغوا اشتراكهم ومش عايزين تليفون فى البيت لان المحمول ارخص"
