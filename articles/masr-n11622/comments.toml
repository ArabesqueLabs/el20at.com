[[comments]]
order = 0
subject = "بعض مشايخ الأزهر مطايا للسلطة التنفيذية"
author = "أكرم راضي"
text = "بعض مشايخ الأزهر مطايا للسلطة. وبعضهم لما بيبقى في السلطة بيقول كلام ولما بيخرج بتنفك حبسة لسانه. ولم أر محترما كالشيخ نصر فريد واصل.<br />تلاقي مشايخ الأزهر واخدين عهد على نفسهم ما يمسوش التليفزيون ويخلوا الناس تتفرج.<br />المعضلة الأساسية إن السيناريستات هما اللي هيلوصوا لانهم بيتلككوا على حاجة يمطوا بيها المسلسل، ولو اتحرموا من مشاهد الزوار ممكن المسلسل يخس 3 أو 4 حلقات."
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208032633/http://masr.20at.com:80/newArticle.php?sid=11622"

[[comments]]
order = 1
subject = "هى ناقصة"
author = "فرغلى"
text = "هى ناقصة فتاوى - الحكومة كل ما الامور تتنيل معاها - وطوابير الخبز تزيد والناس مش لاقية الرغيف تقوم تشغل الناس بفتوى او فثوى من احد المستشيخيين اللى جاب التايهة وكان مكنش قبلة الشعراوى وعبد الحليم محمود وشلتوت وغيرهم<br />يا عم الشيخ هى نا قصاك روح اتلهى على عينك وقول لنا اية راى الشرع فى التعذيب<br />واية راى الشرع فى الاعتقالات اليومية<br />انت مالك ومال السينما - كييف مشاهدة افلام<br />اللى اختشوا ماتوا"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208032633/http://masr.20at.com:80/newArticle.php?sid=11622"

[[comments]]
order = 2
subject = "مفقوع"
author = "آه يازمن المشايخ"
text = "سيدنا الشيخ المنجي:<br />هل قرأت أركان الزواج في الإسلام ؟؟<br />فشروط الزواج تتطلب (بلوغ )0و(أهلية )و(خلو من الموانع الشرعية) و(إيجاب) و(قبول )و(صداق) و(ولي) و(شهود)..<br />فلو كان الممثل مسيحيا والممثلة مسلمة فهل يعتبر الزواج منعقدا بينهما يامنجي؟ طبعا لا لوجود المانع الشرعي.<br />ولو كانت الممثلة متزوجة حقيقة فهل ينعقد زواجها شرعا بحسب قولك يامنجي؟ طبعا لا لوجود المانع الشرعي<br />ولو قال الممثل للممثل زوجتك ابنتي .(يقصد الممثلة) وهي ليست ابنته حقيقة فهل ينعقد الزواج ؟ لا طبعا<br />وفي كل حالات الزواج التمثيلي لا يوجد به شرط الصداق فهل ينعقد الزواج؟ لا طبعا لتخلف ركن المهر<br />ولو مات الممثل زوج الممثلة في الحلقة الرابعة فهل يصح زواجها في الحلقة الخامسة ؟ لاطبعا لأنها لازالت في العدة<br />ولو تزوجت الممثلة الممثل في الحلقة السادسة وتم تصوير مشهد لها في غرفة نوم ممثل تاني هل يجوز للممثل الأولاني يقتلها بجد باعتبارها زانية وخائنة وياخد تخفيف عقوبة ستة أشهر؟ لا طبعا لأن المحكمة مش هبلة و لا النيابة هبلة .<br />طب ياعم الشيخ المنجي أفتني في هذه المسألة:<br />تقول إيه في اللي اتجوز الشعب بدون مهر ولا صداق وبدون إرادة هذا الشعب والشهود (الداخلية) زور والولي( مجلس الشعب) زور والإشهار ( النتيجة) زور و( القبول ) زور وانت أحد شهود الواقعة ومش عايز تنطق ورجلك بتحدف ناحية التياترو دايما . وانت ساكت .. مين بقى اللي هايشيل الوزر ؟؟؟؟ إلا صحيح يامولانا هو ابن الوزر عوام؟؟؟؟؟ عوام باع أرضه.. ماتاخدشي في بالك ..ربنا يخليك لينا وللحركة الفنية وما يحرمك أبدا من .... الكواليس"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208032633/http://masr.20at.com:80/newArticle.php?sid=11622"
