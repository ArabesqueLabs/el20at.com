text = "و الله احنا ظالمين حكامنا دول<br />معذورين برده يا جماعه اصل الشماته وحشه<br />و دول مش هتبقى الشماته من واحد و لا اتنين لا دى هتبقى من امم باسرها<br />تخيلو انتو بقى لما امه تشمت ف شخص واحد<br />ده يموت بس من تاثير الشماته"
