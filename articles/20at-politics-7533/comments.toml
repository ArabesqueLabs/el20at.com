order = 0
subject = "إستعينوا على قضاء حوائجكم بالكتمان - إذا ابتليتم ف"
author = "أحمد الحكيم"
posted = "2007-11-06"
text = "بسم الله والحمد لله والصلاة والسلام على رسول الله،<br />يقول الحديث الشهير: \"إستعينوا على قضاء حوائجكم بالكتمان\" ويقول حديث آخر \"إذا أبتليتم فإستتروا\"، فلماذا نعتبر هذا خطأ لمجرد ان الغرب يفعل العكس.<br />من يعلم اكثر: النبي عليه الصلاة والسلام، ام الغرب واولمرت؟؟!!!<br />متى سنبدأ بستخدام عقولنا لتمييز الصواب من الخطأ، بدلا من ان نبقى نلهث وراء افكار الغرب ومعتقداته."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-11-06"
text = "لا لن ياتي اليومالذي يعلن فيه الحكام العرب انه مرض لانه يظن انه سخلد ابد الابدين ولا يريد ان يترك كرسي العرش لمن هو اكفا منه الا الي القبر..<br />شكرا لك يا اولمرت ايها لالصدوق الذي تحترم عقلية شعبك وتطبق الديمقراطية..<br />فهنيا لك بنيلك احترام وتقدير شعبك..<br />اما نحن فدعونا في ظلمات الحكام المستبدين ولا تحمونا من براثن الحاشيه الافاقين<br />ولا تحسبن الله غافل عما يفعلون"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ليس لأن الغرب قال"
author = "لبودي"
posted = "2007-11-11"
text = "إلى الأخ أحمد الحكيم<br />ألم يعلم المسلمون جميعهم بمرض رسول الله صلى الله عليه وآله وسلم، وظلوا يتابعون مرضه يوما بيوم؟<br />لم يخفِ عليهم أمر مرضه فضلا عن الكذب والتصريح بغير الواقع.<br />وهذا هو الحاصل في بلداننا العربية الموكوسة."
