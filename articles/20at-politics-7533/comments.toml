posted = "2008-06-20"
text = "لتعلموا بأن الهاشميون هم أول المتآمرين على الأمة الإسلامية , وهم أول من تآمر على فلسطين وشعبها وقاموا بذبح 30 ألف<br />فلسطيني بالضفة الغربية , هؤلاء هم الهاشميون الذين ينسبون أنفسهم إلى النبي صلى الله عليه وسلم والنبي صلى الله عليه<br />وسلم براء منهم ليوم الدين ............."
