subject = "أخونا الفاضل اللي علق"
author = "اكتب اسمك هنا"
posted = "2007-11-15"
text = "المرض مش بلوى نستتر منها يا ناااس .... على رأي جدتي : يا بنتي هو فيه حد كبير على العيا ... وكأنها حاجه عيب هنتدارى منها... ايه يعني لما يعيا .. وحشة في حقه!!!!!!!<br />ده بس عشان هو فرعون خايف و هو عنده 9000 سنة للناس تقول عليه قرب يموت<br />عايز يوهمنا أنه هيخلد على الكرسي خلاص"
