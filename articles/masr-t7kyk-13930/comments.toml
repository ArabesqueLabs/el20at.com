text = "اظن ان الذين تعبوا من الكلام فى مؤتمر الحزب الوطنى السنوى سينالوا ترفيها وراحة من عناء تعبهم وسهرهم فى كتابة الخطب وتدبيج المقالات وسيحجز لهم الحزب تذاكر فى الحفل ليجددوا شبابهم ويتذكروا الايام الخوالى<br />والا بماذا تفسر اقامة الحفل بعد انتهاء وختام المؤتمر ؟<br />خليهم يدلعوا شوية<br />ويرجعوا نشطاء لمحاربة الاخوان والجماعة المحظورة"
