text = "حسبى الله ونعم الوكيل<br />هى اكيد الحفله دى مش معموله للشعب المصرى عشان يروش نفسه....هى معموله لناس بعنهم .....ده استخفاف فظيع وعدم احترام لرغبه الشعب المصرى<br />لا الاه الا الله بقينا ندفع فلوس عشان نجيب الفحشاء لحد عندنا......لا ومش بس كده وبنروجلها وعملنلها حمله دعائيه بملاين ....هو ده الى نقاقصنا بيونسه فى مصر....اصل الشعب زهق ومل من الفضا والانتخه....,والنقاب بقى مينفعش فى الجامعه وبيونسيه حريه شخصيه ودليل على الرقى والتحضر والانفتاح<br />لاكن هقول ايه ...هو ده الى نستحقه...اصبحنا كغثاء السيل<br />رحمتك يا رب"
