author = "اخص على المحامين"
posted = "2009-11-05"
text = "موظف بريد بأسيوط يرفض ‏10 ملايين جنيه رشوة‏..‏ ووزير الاتصالات يقرر تكريمه<br />- محرر مصراوى -<br />رفض موظفو ادارة الحاسب الألى بمكتب بريد منفلوط بمحافظة أسيوط رشوة قدرها 10 ملايين جنيه من أحد المحامين نظير قيامهم بتسهيل اختراق شبكة الحاسب الألى للهيئة العامة للبريد والاستيلاء على مبلغ 40 مليون جنيه .<br />وكان عبدالرحمن فتحي محمد صفوت معاون مكتب بريد منفلوط قد فوجئ بزيارة من المحامي رمضان محمد شلبي رئيس جمعية تنمية شباب الخريجين بعزبة عبدالله محبوب‏,‏ يعرض خلالها عليه صفقة تتضمن إبلاغ المحامي بالشفرة السرية الخاصة بإيداع أموال البريد في البنوك‏,‏ علي أن يستغل المحامي ذلك في عمل إيداعات وهمية باسم الجمعية بمبلغ‏40‏ مليون جنيه‏,‏ ويقوم بسحبها بعد ذلك مقابل حصول المعاون علي عشرة ملايين جنيه‏.‏<br />_________________________<br />اتفوووووووووووووووووووووووووووو على المحامين هما اللي ضيعوا البلد"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = ""
author = "من سيحضر الحفل"
posted = "2009-11-05"
text = "من هم المصريين ومن اى طائفة سيحضر هذا الحفل ؟<br />طبعا الطائفة اياها<br />فية موظفين بيقبضوا مليون جنية شهريا من خزينة الدولة مثل السيد اللواء مدير امن سيناء مثلا حسب كلام الصحف<br />وفية رؤساء تحرير جرايد حكومية بياخدوا 10 % من قيمة الاعلانات فى الصحف وبيقبضوا ما لا يقل عن مليون جنية<br />وفية مدراء بنوك بيقبضوا من 50 الى 100 الف جنية شهريا<br />وفية مستشارون للوزرات بيقبضوا نصف مليون كل شهر<br />وطبعا طبقة الحرامية بتوع الاستيراد والتصدير والحديد والاسمنت<br />وكلها فلوس حرام ولازم تضيع فى الحرام<br />يعنى الحرامى هيبنى جامع والا كنيسة والا هيروح حفلات زى دى<br />ريحوا نفسكم<br />يولعوا فيها بجاز<br />طيب ما فية نوادى قمار فى الفنادق محدش بيتكلم لية"
archived = "2010-03-14"
capture_url = ""

