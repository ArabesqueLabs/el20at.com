text = "تحيه طيبه وبعد،،،،،،<br />السيد المهندس محمد البكري جوده قد تقدمت بأكثر من خطاب لسيادتكم فانني من ابناء العاملين فلم يصلني اي رد من سيادتكم فرجاء لسيادتكم النظر في تلك الشكوه فانني قدمت لسيادتكظروفي الاصه فانني اقوم مع والدي في قريه الصوامعة حيث ان والدي كبير فنين حيث أنه لم يقوم معه اي موظفين من الشركة فأنة متعهد علي اكثر من 75 محول كهربي فان حالته الصحيه فأنه لا يقدر علي المتابعه علي جمع هذه المحولات فانني اقوم بالعمل بديل منه بعلم من المهندس رئيس الهندسه فانني اعمل ليل نهار ولكم جزيل الشكر لسيادتكم<br />مقدم: مؤمن احمد عثمان احمد العنوان :سوهاج -ساقلته- سفلاق"
