author = "سيد الخمار"
posted = "2007-12-23"
text = "حيفضل بطل دوري العميان والكتع والمفلسين لان لو بقي لاعبي الاسماعيلي رفي ناديهم كان ا- الاهلك الذي تحول لمنتخب اندية وبدون سرقة لاعبي الفرق الاخري لايستحق القرن اكثر من المركز السادس وأسألو بركات منشطات او النخاس او الخايب او بيبو الطرود من جنة البهوات اللي خربو الكورة ا ظن ان القيعي ي حيفضل يطلع في الروح اسبوع زنب ما فعلة وخرب بيوت عمرانة منة لله والاهلك مستواة الحقيقي في المركز الخامس"
