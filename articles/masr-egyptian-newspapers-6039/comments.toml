subject = "بول مبارك طاهر"
author = "ابن البلد"
posted = "2007-05-28"
text = "نعم بول مبارك طاهر....فتوى عجيبة<br />لا تضحك ولا تظن انني اتكلم في السياسة أو أعرض بأحد، أو أسيء إلى أحد، ورغم ذلك فبول مبارك طاهر<br />هذه ليست نكتة..ولا حاجة وحشة..هذه حقيقة<br />لكن مبارك ليس اسما لشخص ولكنه صفه<br />فأرجو من يعرف تفسيرا لهذه الفزورة الحقيقية أن يكتب سرها<br />وأنا سوف افسرها غدا لكن دون ان نفرض على الآخرين أن يشربوا بول مبارك"
