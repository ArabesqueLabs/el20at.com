subject = "لا إفتاء بعد اليوم"
author = "جابر العطواني"
posted = "2007-05-27"
text = "لا إفتاء بعد اليوم أو لا إفتاء إلا بعد أخذ المشورة من صاحب المملكة المصرية المباركية ومن ولي عهده \"زعزوه المر بزيادة\"<br />تحولت البلد إلى أماكن دعارة وتحرش وفساد وذل ونهب وسجن والكبير مبرطع في شرم غاوز ينسى أيام طفولة وشبابة بعد أن كان بيشعبط في الأتوبيس . وبياكل الفول المسوس . هو وست الحسن سوزي صاحبة السمعه السيئة وولي العهد (زعزوة المر بزيادة). ياســــــــــــــــــــــــــــــــــــــــــــــــــــــادة الـبــــــــلـــــــــــــد عـــــــــــــــــــــــــــــــــــــــــــاوزة<br />http://ertu.org/23july/index.html<br />ثـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــورة<br />......................................................... مع تحياتي رئيس دولة العطوانيين ............................................."
