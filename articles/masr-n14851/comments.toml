subject = "مبروووووووك علينا احمد حسن"
author = "ريري"
text = "وااااااااااااااااااااااااااااو..مفاجاه جامده مووووووووت..ميرسي على الخبر<br />بجد كنت زعلانه جدا انه هيروح الزمالك..احمد حسن لاعب كبير ووجوده فى الاهلى لاشك مكسب طبعا<br />الف مبرووك علينا اللاعب احمد حسن..وان شاءالله يعمل موسم جميل"
