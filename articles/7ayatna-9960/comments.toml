author = "يااااااااااااااسمين"
posted = "2008-09-02"
text = "هاااااااااااااا اااااااااي…كيفكن…وكيف رمضان معكن …بحب قول للكل كل عام وانتو بخير وينعاد عليكن بالصحة والسلامة …بس بتمنى من الكل ما يضيع شهر رمضان على الفاضي من دون صلاة او عبادة عنجد بتمنى من الكل يستغل كل دقيقة من وقته في طاعة الله سبحانه وتعالى وما في مانع لما الواحد يتابع البرامج الدينية بس المشكلة لما يصير عنده ادمان على المسلسلات الي ما الها طعمة لانه بكون هيك ضيع شهر رمضان وبتكون راحت عليه وعلى فكرة كل شي بينعرض برمضان بقرفونا في طول السنة يعني معنى كلامي انه الي شايف حاله لازم يتابع كل شي معلش ينطر بعد رمضان يعني مو طايرة الدنيا…وهلا باااااااااااااا اااااااي"
archived = "2009-06-05"
