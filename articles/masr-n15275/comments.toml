[[comments]]
order = 0
subject = "لجنة الخيبه بمجلس الشعب"
posted = "2008-04-18"
text = "طبعا مجلس الشعب والشورى مليان لجان في جميع المجالات والاتجاهات<br />الا الخيبة<br />اقترح بانشاء لجنة الخيبة في مجلس الشعب لبحث مدى الخيبة التي وصل اليها الشعب المصري واخر هذه الخيبة اكل لحم الحمير<br />لطفا يرجى مراجعى موضوع الطحاوي بيه على نفس الموقع لتأكد من ذلك"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421195025/http://masr.20at.com:80/newArticle.php?sid=15275"

[[comments]]
order = 1
subject = "الى برلمان ا لعصابة الحاكمة - افرجوا  عن ا سراء  ع"
author = "انا من الشعب"
posted = "2008-04-18"
text = "البوبى بتاع النظام اللى اسمة العادلى بيخطف البنات من البيوت من امهاتهم<br />لا ياروح امك كلة الا البنات<br />تقبض على الاخوان ماشى<br />انما البنات لا<br />هنولع لك فى البلد 4 مايو<br />افرج يا كلب عن اسراء<br />يلعن ابوك"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421195025/http://masr.20at.com:80/newArticle.php?sid=15275"

[[comments]]
order = 2
subject = "حكومة رجال الاعمال ولجنة السياسات"
author = "زعبور"
posted = "2008-04-19"
text = "اعجبنى هذا الشعر العامى لاحد الشباب على موقع على النت<br />هما مين واحنا مين ؟<br />هما الامراء والسلاطين<br />هما بيلبسوا اخر موضة<br />واحنا بنسكن سبعة فى اوضة<br />هما بياكلوا حمام وفراخ<br />واحنا الفول دوخنا وداخ<br />هما بيمشوا بطيارات<br />واحنا نموت فى الاتوبيسات"
archived = "2008-04-21"
capture_url = "https://web.archive.org/web/20080421195025/http://masr.20at.com:80/newArticle.php?sid=15275"
