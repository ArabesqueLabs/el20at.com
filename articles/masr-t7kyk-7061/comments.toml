text = "مشكلتي اني الدغ قي حرف الراء ونفسي انطقو اوي وبدعي ربنا عشان انا مدرس وما ينفعش اكون مدرس ناجح والعيال تخاف مني وانا الدغ بدايق اوي اول ما اقول لحد اطلع بره اصلي الدغ انا علي فكرا زمان كنت الدغ في حروف كتير زي السين والزين والذال والحمد لله عرفت انطقهم وبقول يمكن ربنا خلقني كدا عشان ما تكبرش علي الناس وما اتكلمش كتير واخد سيئات عشان لدغتي دي بتخليني بخاف اتكلم وسط الناس لحسن يتريقو عليا وعلي كل حال الحمد لله في ناس كتير عندها بلاوي كتير ما جتش علي اللدغه دا انا بحمد ربنا ان في ناس اصلا ما بتتكلمش الحمد لله اوي وبعدين ربنا مدينا نعم كتير اوي لا تعد ولا تحصي والشبطان دايما يحب يخليك مركز علي نص الكبايه الفاضي اللي هو عيوبك يعني لا الحمد لله اوي وبغيظ الشيطان السلام عليكم ورحمه الله وبركاته"
