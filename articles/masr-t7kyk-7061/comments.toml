text = "انا والله بس ابكي عندي لدغه في حرف السين صرت مااعبرها وانا عمري 17 لمن تطلب مني المدرسه اقرا شي برتعش واخاف احد يسمعني والله تعبت بجد مع انها مو مره واضحه بس مسببه ليا ازمه نفسي ابغى حل بس يكون مو عند دكاتره"
