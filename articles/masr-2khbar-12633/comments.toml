author = "هو فية قانون يجرم تر"
posted = "2009-07-13"
text = "هو فية قانون يجرم تربية الطيور<br />وامتى طلع القانون دة<br />طيب والعصافير والزرازير<br />طيب وتربية الدقن<br />واية رايك فى تربية العجول قصدى العجول البشرية<br />سيدى المحافظ طيزك حمرا"
archived = "2010-03-14"
