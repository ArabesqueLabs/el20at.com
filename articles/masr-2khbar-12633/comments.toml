author = "هاها  هاها   هاها"
posted = "2009-07-13"
text = "سيادة اللواء المحافظ<br />من نكد الدنيا ان اللواء يبقى محافظ بدل ما يمسك مركز رعاية شباب او جمعية كشافة<br />سيادة اللواء هيحبس الناس<br />فاكر نفسة فى معسكر المستجدين بالجبل الاصفر<br />سيادة اللواء بكرة يحبس اللى يقابلة فى الشارع ومش حالق دقنة او ملمع جزمتة واللى يقابلة صاحى بعد الساعة عشرة فى الشارع هيديلة طابور ذنب ويوقفة داخلية ساعتين<br />لواءات اية بس<br />هى البلد جابت ورا من شىء شوية<br />سيادة اللواء شد نفسك وافرد صدرك واعتز بنفسك واضرب كعبك فى الارض وللامام معتدل مارش<br />بلد بنت وسخة"
archived = "2010-03-14"
