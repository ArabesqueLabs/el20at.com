subject = ""
author = "اين المستشفيات ؟"
posted = "2009-07-13"
text = "الناس عارفة كويس جدا حالة المستشفيات ومحدش بيهوب ناحيتها الا اللى واقع خالص<br />والناس عارفة ان اللى بيدخل مستشفيات الحكومة بيموتوة<br />واحد انحرق وراح المستشفى والدكاترة قالوا لمراتة روحى انتى وعلى حسب كلام الناس اديلوة حقنة موتتة فى الحال<br />وواحدة جالها حمى وراحت المستشفى واختفت ولا رجعوا حتى الجثة موتوها ودفنوها فى مكان مجهول<br />هذة انطباعات الاهالى عن مستشفيات الحكومة<br />بيموتوا الناس ومفيش فيها ادوية ولا علاج<br />وبيروحوا العيادات<br />وبيروحوا عيادات الجمعيات الشرعية والاخوان المسلمين<br />فارتاح يا سيادة المحافظ لانك مش هتلاقى احد تحبسة"
archived = "2010-03-14"
