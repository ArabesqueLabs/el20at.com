text = "ما قام كاتب المقال بسرده في بداية مقاله صحيح ، ولكن قد جانب الصواب و مال للتأليف او التلفيق لا أدري في النصف الأخير من مقاله ، فمعركة امدرمان قد انتهت خلال 120 دقيقة ، ساعتين وكان كل الأمر قد انتهى وتم القضاء على قوات التمرد ، استمر التوتر المصاحب لأي عملية عسكرية خصوصا مع إستمرار عمليات التمشيط والتعقب للمتمردين ، ولكن الاوضاع كانت هادئة للغاية<br />بخصوص المباريات و موضوع حظر التجول ، فحظر التجول قد تم رفعه عن (معظم) العاصمة القومية قبل عصر يوم الاحد ، وبالتالي المباراة لم تكن هناك حظرا للتجول ، كان التفتيش الدقيق للخارجين من مدينة امدرمان (مكان المباراة) خوفا من تسلل العناصر الهاربة من قوة التمرد.<br />بلاش تأليف يا صاحب المقال ، ولو كنت معجبا جدا بمستويات الأمان في مصر 1967 فيمكنك العودة (متى ما رغبت) ، اما لو قررت البقاء في سوداننا (فمرحبا بك) بس بلاش تأليف ، عشان إنت عارف !!!!!!!"
