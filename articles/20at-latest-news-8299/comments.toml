text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته<br />اول شي انشاءالله يدوم سيدي خادم الحرمين وولي عهده وال سعود كلهم حفضهم الله<br />ثانيا . والله ياجماعه انا مواطن سعودي مقيم بالكويت انا واسرتي وانا ابلغ من العمر 40 وعندي ثلاث بنات وولدين . قدر الله واقترضت فلوس ورفعوا علي قضيه واجراءا القضيه كثيره منها منع سفر وزادت ديوني يوم بعد يوم ولازلت على هالحاله وديوني تزيد يوم بعد يوم وماقدر اعود الى وطني الغالي المملكه واسرتي معي والسفاره مانفعوني بشي وانا الان معرض للسجن في اي وقت وتكفون ياهل الخير انا واسرتي نطلب النجده ياهل المملكه ياملك الانسانيه ياولي العهد سلطان الخير يا ال سعود الكرام ياهل الطيب ياهل الخير والله بس نبي نرد للمملكه تكفون تكفون والله مابي شي بس ارد انا واسرتي<br />s222-@hotmail.com"
