[[comments]]
order = 8
subject = "اكثر من رائع"
author = "مش زيهم ( مع الإعتذار لللأسماء المستعارة التانيه )"
text = "مقال اكثر من رائع يااستاذة مي وفيه تعبير فعلا عن جدعنة ولاد بلدنا برغم الظروف الصعبه اللي همه عايشين فيها وشجاعه منك فى موقف صعب زي كده مقدرش انا كبنت اني اقفه ، وانتماء رائع لبلد متماسك برغم الظروف الصعبه اللي بيمر بيها اهله ، واللي انا متأكده ان حياتك مش ورديه اوي فيه ومع ذلك لسه بتحبيه حب كبير زي ماهوه واضح ، وانا من المواقف القليله اللي مريت بيها سواء كنت ماشيه على رجلي او راكبه فعلا بلاقي ان ساعة الشده الناس كلها بتتبرع بكل شهامه بالمساعده<br />اما بالنسبة للسادة \\\" الأفاضل \\\" ( مش كاتب ) و ( مش ححبك ) ومش هوه ومش شريف والانا دول ، اللي انا متأكده انهم شخص واحد فبقولهم ياريت تشوفوا حاجه مفيده تعملوها غير التريقه على خلق الله المحترمين واللي بيعملوا حاجه اكيد مفيده لما بيقولوا عن مواقف كويسه علشان الناس يظهر جواها الامل تاني ، ومش محبطين لنفسهم ولغيرهم زيكم ولا عندهم قلة ذوق فى التعبير عن رأيهم فياريت تقولوا خير او تصمتوا .. وشكرا يا مي ويارب يكتر من امثالك ويقل من امثالهم"
archived = "2008-08-12"
capture_url = "https://web.archive.org/web/20080812064746/http://masr.20at.com:80/newArticle.php?sid=17172"

