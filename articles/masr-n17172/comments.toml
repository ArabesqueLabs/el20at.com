[[comments]]
order = 5
subject = "وحين شكرته وأعطيته \\\\"
author = "مش كاتب"
text = "الكلام دا يا مي معناه ان الموضوع متفبرك والواقعة غير حقيقية لان مستحيل سواق تاكسي في مصر مستحيل مستحيل بكل المقاييس حتديله فلوس ويرفضها<br />بأه سواق تاكسي في القاهرة حتديله اللي في النصيب ويرفق<br />دا انتي لما حتديله اللي فيه النصيب حيبص فيه كده وحيستقل المبلغ وحيقولك ايه يا مدام هو احنا بنشحت<br />لما تيجي تكتبي قصه يا مي لازم تكون واقعية علشان خاطر الناس تصدقها<br />سلام يا مي"
archived = "2008-08-12"
capture_url = "https://web.archive.org/web/20080812064746/http://masr.20at.com:80/newArticle.php?sid=17172"

