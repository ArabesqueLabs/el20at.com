[[comments]]
order = 10
subject = "NCHR"
author = "نهال"
text = "يا مي المقال جميل جدا وبما لانك حساسة جدا فانك هتفضلي شايلة جميل سواق التاكسى والميكروباص في عنيكي ، المهم بأه انك يا مي عربيتك عطلت في جسر السويس يعنيييي جنب بيتي ومكلمتنيش ، وبعد كدة وقفتي تاني في العباسية يعني كمان لتاني مرة جنب بيتي ومكلمتينيش وفضلتى سواقى التاكسى والميكروباص ... ok بس كان نفسنا نخدم ونرضلك جزء من جمايلك علينا<br />اما بخصوص الفرق بين ساكنى الدقي وعين شمس ف كلام وقصة مي محتواها ومعناها ابعد ما تكون عن هذة الملاحظات .... ]دة غير ان فكرة مي اعمق من ان الواحد يسيب القصة كلها ويركز في الدقي او الزمالك"
archived = "2008-08-12"
capture_url = "https://web.archive.org/web/20080812064746/http://masr.20at.com:80/newArticle.php?sid=17172"

[[comments]]
order = 11
subject = "mo.ziada@hotmail.com"
author = "محمد زيادة"
text = "بدون اسماء مستعارة أو غيره .. الحقيقة أن موضوعك ضعيف للغاية برغم كونه يحتوي على فكرة جميلة وهي \\\"شهامة المصريين\\\" التي يشكك كثير من الناس فيها الآن.. لكن للأسف حضرتك ركزتي على اشياء خاصة في الموقف، أفقدت موضوعك أهميته وجعلته \\\"بدون هدف\\\".<br />وأما بخصوص أحد التعليقات التي تنكر شهامة سائقي التاكسي في مصر، فلا يفترض تعميم الخير او الشر على كل البشر، فكما أن هناك بعض السائقين بالفعل لديهم جشع فهناك أيضاً الكثير ممن لديهم شهامة وأخلاق.<br />لكي خالص تحياتي وبالتوفيق"
archived = "2008-08-12"
capture_url = "https://web.archive.org/web/20080812064746/http://masr.20at.com:80/newArticle.php?sid=17172"

