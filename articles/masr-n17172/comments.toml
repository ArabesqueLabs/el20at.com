text = "زيديني عِشقاً.. زيديني<br />يا أحلى نوباتِ جُنوني<br />يا سِفرَ الخَنجَرِ في أنسجتي<br />يا غَلغَلةَ السِّكِّينِ..<br />زيديني غرقاً يا سيِّدتي<br />إن البحرَ يناديني<br />زيديني موتاً..<br />علَّ الموت، إذا يقتلني، يحييني.."
