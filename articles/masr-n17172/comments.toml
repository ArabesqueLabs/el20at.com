subject = "موضوعك جذاب وشائق"
author = "زهرة السوسن"
text = "تجربة شخصية رائعة فى التسجيل وجذابة فى العرض<br />عندك اصرار رائع<br />فية كتب مبسطة عن ميكانيكا السيارات بالعربى -ياريت تشترى واحد<br />وبعدين فية حاجة اسمها فحص السيارة قبل التحرك - الزيت - المياة -الفرامل - العجل<br />علشان ما يحصلش مشاكل بعد ما تمشى<br />كررى مقالاتك - بصحيح تجربة شخصية هائلة"
