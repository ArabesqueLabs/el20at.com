[[comments]]
order = 0
subject = "ميكانيكى سيارات محترف"
author = "انا"
text = "اية الحلاوة دى<br />طبعا كل نصائح السواقين لك رائعة وفاهمين جدا وكانوا خايفين على الموتور او الماكينة لا تقفش وتحتاج عمرة كاملة وتدفعى الشىء الفلانى غير العطلة وتدوخى السبع دوخات على ما تلاقى قطع الغيار سواء التجارى او من الوكالة<br />وكان يجب فور ارتفاع حرارة الموتور ان تتركى السيارة مكانها فى مكان امن وتخلصى مشوارك فى تاكسى وتدبرى نقل السيارة لاقرب جراج<br />وظنى من كلامك ان السيارة ستحتاج الى جوان وش السلندر لان الرادياتير بيدفع هواء من فتحة الملىء بالماء<br />على العموم تجربة صعبة لبنت زيك ماشية لوحدها بسيارة - تانى مرة خللى احد من اقاربك مثل اخوكى او خطيبك او جوزك يخرج معاكى لانة ممكن فردة كوتش تنام وتحتاج تغيير - هتعملى اية<br />يا بنيتى اسمعى كلام امك وخدى اى واحد من الاقارب وانت خارجة وبلاش بهدلة<br />بس برضة بنت بطلة وعندك اصرار على الوصول ولو فيها تخريب للموتور ابو رادياتير مثقوب<br />بجد شاطرة<br />لك تحياتى"
archived = "2008-08-12"
capture_url = "https://web.archive.org/web/20080812064746/http://masr.20at.com:80/newArticle.php?sid=17172"

