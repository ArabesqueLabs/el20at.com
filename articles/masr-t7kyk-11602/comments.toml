subject = "ما شاء الله.. ولاد البلد بيكتبو عن ولاد بلد بجد"
author = "أميمة الشاذلي"
posted = "2009-03-17"
text = "ما شاء الله بجد انا بحترم جدا اللي بيفكر في عمل مثمر لتوعية الشباب والناس عامة وبجد ربنا يوفق كل اللي عملو المجلة لانهم عرفو يشتغلو كفريق وتغلبو على كل الصعوبات والتحديات اللي بتواجه اي عمل محترم<br />وكالعادة عشرينات ومنها الصحفي اللامع خباب يمتعنا بمقال رائع آخر ويجعلنا نحس ان الدنيا لسة بخير وولاد البلد لسة موجودين"
