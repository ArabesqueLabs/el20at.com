text = "والله تستاهلوها وكمان تستاهلو ان المجله دى اخد المركزالاول على جميع مشاريع التخرج بتاعت الكليات التانيه بل وعلى كليه الاعلام نفسها وتخدوه بجداره لان المجله بجد تحفه وفيها حاجات كتير حلوه ده غير انكو كمان انفردتو من جهة نظرى بالجانب المهم ده فى الصحافه وهو العوده والحفاظ على الماضى وطول مافى شباب زيكو يبفكروا كده ويهمهم مصر حاضرها ومستقبلها وماضيها الاساس عشان منتوهش وعى رايى المثل من نسى قديمه اوماضيه تاه وطول مافى شباب زيكو عمرنا ماهنتوه"
