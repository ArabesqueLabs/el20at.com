posted = "2009-03-17"
text = "بجد مش عارفة اقول ايه انا فخورة جدا بالكلام اللى مكتوب عن اصالة لانى عضو فى فريق تحريرها . بس انا سعيدة جدا مش علشان اصالة اخدت مركز اول بين مشروعات التخرج الاهم من ده انها بجد عجبت الناس وده اهم عندى من اى حاجة تانية وهى فعلا مجلة عمرى لانى انا وكل فريق التحرير بقالنا 4 شهور بنحلم بالمجلة دى بين ايدينا علشان كده بقولهم الف مبروك علينا اصالة ."
