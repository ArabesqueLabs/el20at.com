author = "تقعد وتربع"
posted = "2009-06-27"
text = "يا سلام على الطبلية وايام الطبلية لما كنا بنقعد ونربع حولها وقت الاكل - كانت مفاصل الركب والفخذ بتتنشط وكانك فى القعدة والتربيعة بتعمل لها تليين وتمرين وطبعا التعود على الاكل على الطبلية فيها سهولة لست البيت لانها بعد الاكل بتشيل الطبلية وتركنها فى المطبخ وتظل ترابيزة السفرة نظيفة ومرتبة كما هى<br />بعد سنين طويلة حاولت اقعد على الطبلية لقيت مفاصل الركب والفخدين حصل فيهم تيبس وجمود والحركة مش لينة زى الاول فرجعت لترابيزة السفرة تانى<br />وكمان لما يكون شخص تخين فصعب انة يقعد على الطبلية وكذلك الناس اللى بتلبس ضيق ومحزق مش ممكن يقعد على الطبلية<br />الطبلية ضرورة فى البيت طبعا ولازم تكون فى الجهاز وفى اضعف الاحتمالات ممكن نخرط الملوخية عليها"
archived = "2010-03-14"
