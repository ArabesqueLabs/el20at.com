author = "رد الشبكة"
posted = "2009-06-27"
text = "انتشرت الان بين الاسر فى ريف الوجة البحرى عادة قبيحة مش عارفين مصدرها لانها لم تكن موجودة اطلاقا - وهى حكاية رد الشبكة للعروسة<br />اذ بمجرد ان يقوم العريس بتقديم الشبكة يقوم اهل العروسة تانى يوم برد الشبكة<br />ورد الشبكة عبارة عن مقطورة جرار محملة بكراتين وطشوت جميع انواع الخضار والفاكهة وكذلك خروف صاحى هدية لاهل العريس<br />انا مش عارف البدعة دى اصلها اية<br />وبالنسبة للطبلية فهى موجودة فى الجهاز ولكن بشكل عصرى جدا ومغطاة بالفورمايكا<br />وجهاز العروسة الفلاحة دلوقتى فية غسالة اتوماتيك وغسالتين برميل وغسالة اطفال وتلاجة 12 قدم وتليفزيون<br />واغرب ما رايتة فى زفة شوار عروسة فى قريتى هو جهاز كمبيوتر ضمن الجهاز للعروسة وهو بيلف حول القرية<br />فتخيل فى القرية جهاز الكمبيوتر بجانب الطبلية<br />واللة مش هزار والكلام دة حقيقى فى قريتى بجوار طنطا<br />وانا مصدوم من التطورات اللى العيال بيشتغلوا برة البلد فى الخارج عملوا التطورات دى"
archived = "2010-03-14"
