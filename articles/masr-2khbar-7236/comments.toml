text = "الراجل عشان بيقول الحق هيضيع<br />ده عبره لكل اللى يقف قدام مبارك<br />ايمن نور اتكل<br />وانت كمان يا استاذى هتتكل<br />لك يوم يا مبارك<br />حسبى الله ونعم الوكيل فيك ياحسنى يا مبارك يا ابن ............ صحيح حد يعرف ام حسنى اسمها اية ؟"
