[[comments]]
order = 1
subject = "زى الحديد"
author = "مش عيان"
posted = "2007-10-01"
text = "ابراهيم عيسى دة مفترى - ازاى يقول الراجل عيان<br />دة صحتة زى الحديد<br />احنا بس اللى يجيلنا التهاب الكبد سى وبى والسرطانات والفشل الكلوى وكل بلاوى الدنيا ودة علشان احنا بشر<br />انما هو مش بشر - حاجة كدة ما بتعياش - وهيعيش 5 قرون - وهيعمل البنية الاساسية عشر مرات<br />وهيبقى فى الحكم لغاية خمسين سنة قدام<br />اعدموا ابراهيم عيسى<br />وعلقوا جثتة على باب زويلة<br />واقفلوا الدستور والكستور<br />وكلة تمام يا افندم"
archived = "2010-03-14"
capture_url = ""

