[[comments]]
order = 3
subject = ""
author = "وجاء دور الخنازير"
posted = "2009-09-18"
text = "من اجل هذا خلق الله الخناير<br />خلق الخنازير لتأكل الزباله والفضلات<br />وامر البشر الا يأكلوها لان لها دور مهم في الحياه الا وهو النظافه<br />بس يا خسارة اضراب الزبالين جه في وقت صعب<br />يعني الزبالين عملت اضراب في مقتل<br />اثناء وباء انفلونزا الخنازير<br />والدولة بتدبح الخنازير<br />ما فيش خنازير تاكل الفضلات<br />يبقى اكيد الدولة حترضخ لمطالب الزبالين<br />1) انشاء نقابلة للزبالين<br />2) انشاء حزب للزبالين<br />3) الاعتراف بمهنة الزبال على مستوى الدولة<br />4) تدريس فن جمع الزبالة في المدارس<br />5) من حق الزبال ان يتقدم للزواج من اي واحدة بدون رفض<br />6) انشاء وزارة للزبالين<br />7) تخصيص سيارة لكل زبال تنقله من بيته الى مكان عمله<br />8) انشاء نادي اجتماعي للزبالين واسرهم<br />9) من حق الزبال الاشتغال بالعمل السياسي وتكوين احزاب سياسية<br />10) من حق الزبال ترشيخ نفسه لرئاسة الجمهورية<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مع تحيات/ مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = ""
author = "فى دول الخليج"
posted = "2009-09-18"
text = "الى المعلق السابق<br />فى دول الخليج ليس هناك زبالين ولا خنازير<br />اذا نزلت فى مدينة دبى وجدت الزهور فى كل مكان ولا تجد رملة او ورقة واحدة او كيس زبالة فى الشارع<br />ولا يوجد زبالين ولا خنازير ولا قرف<br />ولكن يوجد حاجة اسمها بلدية<br />والبلدية فيها اقسام وفيها مهندسين وعمال نظافة وليس على راس البلدية لواء اركان حرب متقاعد كما عندنا<br />الناس بترمى الزبالة فى صناديق على راس كل شارع وكل حارة<br />وتمر سيارات التقل الخاصة بالبلدية لترفع تلك الصناديق اتوماتيكيا داخل السيارة<br />الموضوع ان فية ناس بتعرف ادارة<br />مش ناس عايشة على الفهلوة وتمام يا افندم والوضع زبالة<br />رجعوا دور البلدية بتاع زمان اللى كان موجود ايام الانجليز وكانت شوارع القاهرة بتتغسل وبتترش كل يوم<br />استوردوا خبراء ادارة من دبى<br />واعترفوا بتخلفكم"
archived = "2010-03-14"
capture_url = ""

