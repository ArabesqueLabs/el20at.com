posted = "2009-09-18"
text = "المشكلة واضحة<br />قال لى صديق سودانى اسباب المشكلة ترجع الى<br />loose administration اى ادارة رخوة او ادارة متفككة وهذا راجع الى عدم العلم باصول الادارة الحديثة والادارة العسكرية تختلف عن الادارة المدنية<br />وحتى يرحل اؤلئك اللواءات من المصالح المدنية والمؤسسات المدنية فلن ينصلح حال هذا البلد<br />ماذا حقق هؤلاء اللواءات فى الجيش من نجاحات ليتولوا ادارة المؤسسات المدنية<br />كلة فشل فى فشل<br />اهم حاجة عندهم<br />كلة تمام يا افندم<br />لغاية ما ضربوا الطيران على الارض<br />وكلة تمام يا افندم"
