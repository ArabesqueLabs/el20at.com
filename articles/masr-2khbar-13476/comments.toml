posted = "2009-09-18"
text = "لما نظام ادارى لدولة مش قادر يلم الزبالة وينضف الشوارع<br />ولما الزبالة تقفل الشوارع واروائح تزكم الانوف يبقى النظام الادارى للدولة شكلة اية<br />يبقى لما مسئول يكلمك عن التنمية يبقى ابن منكوحة<br />ولما يستهبل اكتر ويقول لك هنعمل محطات نووية وهو مش قادر يشيل شوية زبالة من شارع يبقى هو اللى منكوح مع امة<br />جهاز ادارى فاشل<br />فية دولة فى العالم شرقة وغربة جايبة شركات اجنبية تنضف شوارعها<br />3 قحات وسبع شخرات على ولاد المناكيح"
