text = "يا جماعة اصل الزبالين عاملين اضراب<br />حتى الزبالين مش عاجبهم نظام البلد<br />عاملين اضراب<br />احوالهم المعيشية تعبانه<br />عايزين الحكومة تدخلهم الميه والكهرباء في العشش اللي ساكنين فيها<br />والحكومة ما وفقتش على طلباتهم<br />فالحكومة قررت كل واحد ينضف لنفسه<br />زي الامن كل واحد يحمي نفسه الامن مش فاضي لحد"
