text = "القمم العربة المتتابعة دائما ابدا بلا قررات حاسمة وان كان فلا تنفذ ولا تحترم داخليٍا ولا خارجيا. ما يفرسني هو صور الملوك و الامراء و الرئساء الضاحكة في كل قمة ذلك يذكرني بالمثل القائل ( قالو للقردة اتبرئعي قالت دة وش واخد علي الفضيحة )"
