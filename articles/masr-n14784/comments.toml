[[comments]]
order = 2
subject = "يلا يا طلبه هزؤوا المدرسين"
text = "قم للمعلم يا بني عجولا***واضربه حتى يرتمي مقتولا هاجمه بالكرسي واكسر رأسه***فالرأس كان مخرفا وجهولا واذا افتقدت من الكراسي عدة***أشهر عليه الساعد المفتولا والطمه فوق الوجه لطما موجعا***حتى ترى للدمع فيه مسيلا وإذا رأيت بوجهه نظارة***عاجل ( ببوكس ) يرفض التأجيلا وعليك بالأسنان حطم نصفها***كي لا ترى عضا ولا تقبيلا ! وعليك بالثوب العليه فشقه***شقا .. ليمشي عاريا مخذولا واجثم عليه .. كليث غاب جائع***واستدع صحبك إن شكوت خمولا قوموا عليه وحاصروه وحاذروا***أن ترحموه إذا استغاث طويلا إن الثقافة يا بني تحرر فعلام***ترضى أن تكون ذليلا ؟ والتربويون الكرام تأملوا***في الأمر .. حتى أبدعوا التحليلا قالوا دعوا الأولاد نخشى أنهم*** ( يتعقدون ) فيذبلون ذبولا ( وفرويد ) علم النفس أعلن أنه***من عقد الأولاد هد الجيلا الضرب يؤلمهم ويؤذي روحهم***الضرب ميراث القرون الأولى والتربوين الكرام .. مرامهم***أن يمتعوكم بكرة وأصيلا من شاء مزحا .. فالمدرس نكتة***أو شاء لعبا .. أحضر ( الفوتبولا ) أو مل درسا فليفارق درسه***من ذا يريد لك البقاء ملولا ؟! أو رام شتما كي يبل غليله***لا ضير في شتم يبل غليلا ! أو رام دردشة فذلك شأنه*** إن السكوت يعلم التغفيلا إن غاب شهرا فالغياب فضيلة***وغدا السؤال عن الغياب فضولا لا بأس إن دخل المدارس طالب***بسيجارة .. أو جاءها مسطولا فالتربويون الكرام شعارهم***لا ترهقوهم أنفسا وعقولا والتربويون الكرام قرارهم***من مس طفلا يغتدي مفصولا __________________"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084758/http://masr.20at.com:80/newArticle.php?sid=14784"

