[[comments]]
order = 0
subject = "كلهم راجعين يقعدوا جنب بابا وجنب ماما"
author = "مصرى"
posted = "2009-03-22"
text = "خلاص الازمة العالمية اللى وجعوا دماغنا بيها وان مفيش لها اى تأثير على مصر وان كل حاجة فل الفل وعال العال<br />بدأت الازمة تظهر<br />وسيعود الجميع من الدول العربية<br />واللى كان مسافر علشان يبنى بيت والا يشترى شقة يتجوز فيها وكان بيبعت فلوس بالدولارات تعيش فيها اهلة والناس ويستفيد منها البناء وبتاع المحارة والكهربائى وبتاع السباكة - كلة هينام ويضاف جنب بتوع المعاش المبكر والبطالة<br />وعلى الدولة ان تجند لهم ما يناسب العدد من امن مركزى وتوسيع المعتقلات<br />وان تعمل حسابهم فى رغيف الخبز وازازة الزيت وكيس السكر<br />وخلينا نايمين جنب البابا وجنب الماما ومفيش شغل فى بلادنا<br />سيعود حوالى اربعة ملايين مصرى من الخارج<br />والقيادة عندنا مشغولة جدا بالتهدئة بين اسرائيل وحماس ومشغولة جدا بالمصالحة بين الفصائل ولا حصل تهدئة ولا مصالحة ولا هيحصل اصلا لان اسرائيل مش عايزة<br />الايام السوداء قادمة"
archived = "2009-03-24"
capture_url = "https://web.archive.org/web/20090324011956/http://masr.20at.com:80/newArticle.php?sid=20359"

