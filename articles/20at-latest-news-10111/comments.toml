subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-09-21"
text = "قال النبي عليه الصلاة والسلام \\\"من استطاع منكم الباءة فليتزوج، ومن لم يستطع فعليه بالصيام فإنه له وجاء\\\". أوكما قال...<br />أي أن الصيام يحفظ للرجل قوته ويعينه على الصبر في نفس الوقت، كيف ذلك: الواقع أن تأخر الزواج قد يؤدي تدريجيا إلى الضعف الجنسي لأن العضو الذي لا يستعمل يضمر، بالتالي للحفاظ على القوة الجنسية علينا بالصيام وقد أثبت العلماء ذلك - كما ورد في التقرير. كما أن الصيام يعين الرجل على الصبر على الشهوات لأن انخفاص السعرات الحرارية في الجسم أثناء النهار وخاصة اثناء الظهيرة، يقلل من التفات الرجل إلى الشهوة. فالحمد لله على هذا العلم الذي علمه إيانا رسول الله صلى الله عليه وسلم، ولنعلم ان اتباع النبي في كل أوامره ونواهيه هو خير لنا حتى وإن لم نكن نعلم السبب."
archived = "2010-03-14"
