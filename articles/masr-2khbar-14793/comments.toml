text = "كباية الشاى ليست ترفا ولا كماليات فلكل شعب مشروبة فشعب يشرب الويسكى والنبيذ وشعب يشرب القهوة ونحن شعب نشرب الشاى<br />ومن شدة الفقر هذة الايام الاحظ كثيرون فى الشعب المصرى غير قادرين على شراء الفول والطعمية - بل بيعملوا كباية شاى الصبح قبل الخروج وبيغمسوا بها رغيف عيش<br />- بيغمس اللقمة فى كباية الشاى ويعتبر هذا افطارة<br />والسؤال لابن 11!!!!! اللى بيتكلم عن محدودى الدخل كل خطاب - عمل اية فى زيادة كيلو السكر 2 جنية مرة واحد فى اقل من شهر<br />هل المرتب زاد ؟<br />ابدا<br />كلام فى كلام فى كلام"
