subject = "خلونا صادقين ي"
author = "ليبي صادق"
posted = "2008-04-22"
text = "يا خوتي الليبييين خلونا صادقين مع انفسنا حتى انا راني شاب ليبي كيفكم وعايش كيفكم فالليبيين مستواهم المعيش متقارب الا القليل الناذر , شن عجبكم في ليبيا كل يوم بقرار الطالب ما يلقا مدرس والمدرس نفسه هو ايدرس بلا افلوس نصفهم منسبين وما يتقاضوا معاشات والا اغلب الفصول بلا نوافذ واما المستشفيات حدث ولا حرج لا دكاتره ولا دواء , تي هو حتى القروض عطاهنا بالربا بيش ندخلوا الحرام والنبي يا خوتي شنو حالت الشب اليبي اليوم لا وظيفه ولا راس مال بيش يخدم بيه رغم ان الدوله غنية بالمليارات دخلها ولكن موزعه على الحاشيه الحاكمة والافارقة اللي ماجانا منهم الا المرض والهروين والسرقة , تي وين الحكم هذاي ماسادك مافيش افلوس ايدخل الافارقه بيش ننصابوا بلامراض وانتم عافين اكتر مني كل شي في بلادنا وندعوا الله ان يصلحه ويصلحنا اجمعين .<br />والسلام عليكم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "فات القطار"
author = "شاب"
posted = "2008-04-22"
text = "تي وين الشباب ياخوتي انا شاب ليبي وضاع عمري هدرا كيف اغلبية الشباب الليبي الشاب طول عمره في نكد من الدراسه الابتدائية الى الاعداديه الى التانوية واذا كمل دخل كلية تبدا المشاكل اكبر يا داخلي ما فيش او الشاب ما يلقا بيش يدرس في بلد مثل ليبيا رصيدها بالمليارات وبعد اتكمل الدراسه دور وساده وارقد لا وظيفة ولا اتساعدك الدوله بقرض بيش تشتغل لانه حتى لو حصلت عمل فمعاشك هو 250 دينار هههههههه امتى اتكون روحك وتبني حوش واتدير سياره , تي هم حتى القروض اللي عطوهن عطوهن بالربا بيش انخشوا الحرام بالسيف والمشكله انا الشباب دخلوا لهذا الشي والنب مش ذنبهم ذنب الحكومه الفاسدة والحكم الجائر اللي راسه القذافي تي ليش اتدخلنا الحرام ونحنا غنيين عن الفائدة , وتو اتجي بعد 39 سنه من الحكم الجائر انتاعك واتقول نبوا انوزعوا التروة عليكم هههههههههه خلاص والله ماعاد يمشي علينا الطرح اي تروة اتوزعها بعد ما غلت الدنيا كلها افلوس اللي تبي تعطيهولنا ما ايكفن حتى اكل<br />والا اتمهد الطريق لابنك سيف الاسلام وهو لا سيف ولا منجل فالاسلام بري منه ومنك , اللي داير روحه ايقول شباب ليبيا الغد وحقوق الانسان في ليبيا والله ماعاد يمشي علينا الطرح هذاي ياما قلت انت ديمقراطية والسلطة بيدكم والتروة بيدكم كله كلام على ورق وبدت السلطه بيد ابناء عمك وحاشيتك والتروة عندكم تملكوا المليارات والناس في اللي ساكن في براكة ياراجل ومنهم من لا يملك سيارت اتوصله للمستشفى اتهى عهدك والله خلاص عليه وولدك والله ما يحلم بيها<br />ويا خوتي ما ايفوت عليكم شي راهو افعي ملمسه ناعم ولكن سمه يقتل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
