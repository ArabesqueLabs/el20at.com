subject = "ماتكذبش على روحك"
author = "ليبي صادق"
posted = "2008-08-13"
text = "نبي انرد على خوي الل عنوانه (شوف غلاء المعيشة خارج ليبيا) اتقول شوف الدول اللي بره معيشتهم غاليه والله انت شكلك مانك طالع بره ليبيا يا خوي قارن الغلاء اللي تتحدث عليه بالمعاش اللي ياخذو فيه تي انت ما تاخد حتى في معاش كناس في الشارع , والا بعد اقتول شوفو العمالة اللي داخله ليبيا وعايشين والله ما فلق ليبيا الا اللي كيفك تي العمالة اللي تتحدث عليهم اما مصريين عددهم 80 مليون وما عندهم دخل كيف ليبيا او افارقه فقراء تبينا نحنا الليبيين انعيشو معيشتهم وعندنا نفط الله لو بلادنا كيفهم صح القذافي ما عنده منين ايجيب الفلوس لكن نحنا بلادنا خيرات ما نقارن روحي بيهم والمفروض نحنا منخمموا في الاكل والشرب كيف ما تتكلم انت اتقول اتقول الناس جايين من بره ليبيا ويخدموا في ليبيا انت شكلك اتخمم في الاكل ولاشرب وحوش بس والله نحنا مش حيوانات يا خوي المفروض تفكيرك ما يتقزم لهذه الصوره خلي روحك حضاري واصلا تفكيرا اصبح هك اتفكر في الاكل والشرب بس من الفقر اللي انت عايشه لو انت متريح ومعيشتك كويسه رانك اتفكر انك اتدير مصتع او تدرس في الخارج او تعمل شي يستفيد منه كل الناس .<br />ونحنا وين الخبراء او الناس المتعلمه كلهم قضو عليهم قبل ما يولدو اصلا ما عندنا مدارس اتخرج ناس مثقفين وهو الشاب يخدم على البرويطه في سوق الخضره بيش ايحصل حق حذاء يمشي بيه للمدرسه او حق فطور .<br />والسلام عليكم"
archived = "2010-03-14"
