[[comments]]
order = 2
subject = "هلبة,, هلبــة !!"
author = "ليبي للمي الحي"
posted = "2007-06-05"
text = "للأخت هبة شاهين التي تكتب عن حياتنا في ليبيا و تقول هذه مصطلحات للشباب الليبي,, فأغلبها اما نطقها و كتابتها مغلوطة و أما هي غير موجودة,,<br />فكلمة \"صقع عليك\" هي لا تصف شي جديد او ماشابه,, انما تقال عندما نود ان نخبر المحكي له ان هذا الشي لا يستطيع ان يطالــه,, و بعض شباب الشرق يقولون \" اتحقه و لا اطقه \" يعني تراه و لا تسطيع ان تصل اليه,,<br />ها يابيك شو الجو منيح \" فهذه غير مستعملة لدينا,, فنحن نقول \" شني الجو,, منيح ؟\" و يرد \" الجو مليح او \" ماشية على الحاشية \" ان كان جيداً او يتأفف و يقول \" كساد\" او \"عايشين من قلة الموت \", اما \" لا بأس كنك \" فهي لكبار السن في بنغازي و ما جاورها,,<br />اما كلمة يا سيويدي فهي مغلوطة و نقول \" ياسويدي - تربحي \" فهي تعني الترجي \" بمعنى أخر \" بالله عليك \"<br />كلمة تحفونة و سنفورة.. بالكاد تذكر مرة في الشهر من كل الشباب,, فالكلمة الرئجة هي \" طرف \" و \" بعيصة \" و \" طيــار أغبر \"<br />\" مشلج \" هي أغرب كلمة وجدتها في هذا المقال,,<br />سنــفور لا تعني انه ذكي بل تعني انه وسيم و هي كلمة انقرضت منذ امد و الان نقول \" بيلو \" = من كلمة ايطالية و تعني جميل\" و فلتوز فهي ما جاء في المقالة \" ذكي و شاطر جداً \" او نقول \" الولد فلتة \" اي ان هذا الشاب نابغة<br />( يبرة & كو-نيا & حفرة ) اي فتنة و نميمة و كذلك نقول \" ميسا \" اي كاد ان يكون هناك شجار ب \" صارت ميسا بين فلان و فلان \"<br />شباب مصراتة لا يطلقون صفة متوع الجيلاتي \" و كان الكلمة غير ليبية \" بالكاد هم يقولون : سحانين و هي كلمة عامة تقال في كافة أرجاء ليبيا و كذلك \" زنيلو \"<br />و نقول أيضاً \" كتكوت \" اي انه شاب وسيــم و صغيــر في السن وحالته المادية جيدة<br />أما ان قول كتكوتة فهي من ضمن المصطلحات التي نطلقها على الفتيات الجيملات,,<br />المنطقة التي تتكلمين عنها,, موجودة في طرابلس و هي حي راقي و لكن هنــاك في هذا الحي توجد مستشفى الامراض العقلية و لا تقال ابدا قرقارش يعني مجنون.. انما نقول \" مختّش \" و \" فيوزاته مضروبات \" اي انه مجنون او نحوه..<br />و كلمة \"ولد قراقشي \" اي انه يعيش في ترف أو انه يهتم كثيراً بأناقته.. حتى تكاد زائدة عن الحد<br />\"واخد من زليتن\" هذه ثاني أغرب كلمة أسمعهــا,, فليس لها من الصحة في شيء..<br />فنقول حاله حال زليتني أي انــه اما انه تــاجر كبيــر او صــاحب ثروة.. بسبب سيطرة رجال اعمال زليتن و مصراتة على أهم أسواق ليبيا,,<br />و نقول زليــتني معبي,, اي انه غنــي<br />عندما يتزوج الرجل فتاة غير جميلة.. فنقول : \" طاح و ين ما ستراح \" عندما يكون الشخص غير محبوب اي انه لقي ما يستق .. و نقول \" ربي يصبر اللي جت فيه \" او \" ربي يصبره ماعندهاش عسل ينعقد \" اي انه هو رجل طيب و لكن لن يعقد الله عسلهم لانها غير جميلة .. و ربي يعقد عسلهم.. عندما نبارك هذا الزواج!!<br />فلو تفضلت ادارة الموقع مشكورة,, اما انها تعدل المقال كما تفضلت انا و باقي المعقبين.. او انها تحذف المقــالة,, لانها بصراحة تسيء ألينا او تسبب حساسيات من منطقة الى أخرى و هكذا<br />تشــاو بالكاكاو<br />هاذي تعني.. مع السلامة"
archived = "2010-03-14"
capture_url = ""

