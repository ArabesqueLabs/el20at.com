subject = "ليبيا الغد"
author = "ماتنخدعوا"
posted = "2008-04-26"
text = "انا شاب ليبي ووضعي المادي كيف اغلب خوتي اللبيين متملح كملت دراسه وما حصلت عمل وخذيت قرض وربي يغفر انشاء الله والله نادم عليه مش عارف ليش يعطوا في قروض ربويه رغم ان الدوله مش مستحقة , المهم انا نبي انبهكم يا خوتي على الرئيس الجديد سيف الاسلام هو ما ايجي حتى موس ابو خوصه كيف ما انقولوا مش سيف , رد بالكم تنخدعوا بيه بس ايقول نبو ا انديرو وشباب ليبيا الغد والنبي ساد من اللف والدوران تبي تحكم بعد بوك لالالا ساد اللي ريناه من بوك تيبوك والله كان ارحم منك اول ما شد الحكم اقل شيي كانت الدنيا رخيصه زمان والمعاشات اكويسه , اما السيف هذاي بنحسابوه بيطلع بشي ايفيدنا يالله يالله قال يجب ان يكون اقل معاش 200 دينار ههه والنبي 200دينار شنو بيديرن يا سيف ما ايوكلن حتى خبزه في 2007 واتقول 200 دينار انا قلت في 2007 لان الخطاب كان في 2007 حتى لو كانت المهنة غفير او سائق سياره او اي شي تي كيف اتقول 200 دينار هذا هو انت اللي تبي اتصلح الوضع والنبي روح على حالك وارقد رانا تعلمنا وماعاد اتمشوا علينا حاجه , نحنا نبو هالنبته تخلع من جذورها وايجي رئيس تاني بالك ايكون خير منكم<br />والسلام عليكم"
