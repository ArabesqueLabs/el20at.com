subject = "صقع عليكم"
author = "جهينة"
text = "والله لكل بلد الكلمات الشبابية الخاصة به ولكل جيل ايضا مثلا الجزائر يقوولون عن الفتاة الجميلة (زلّـــــــــــة) وعن الشباب الفلتوز او النابغة(خباش) وعن المكان البعيد او المشوار الطويل(دجبدة) و كذلك عن الانسا المجتهد(يدجبد) وعن اي شئ يكون طرحة ومش عادي يقولون(مهبول)يعني سروال,موبايل مهبول.<br />اما ببالنسبة لكلمة قرقارش في هي علي حسب علمي مستشفي للمجانين في طرابلس وليس في (مصراته)! وفي الجزائر تقال كلمة(صبيطار) علي الانسان المندفع والمتهور وتعني بالعربي قصدي بليبي مستشفي للمجانين يعني قرقارش"
archived = "2010-03-14"
