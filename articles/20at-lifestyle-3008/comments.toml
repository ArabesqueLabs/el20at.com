subject = "ليبيا"
author = "يحيى الرياني"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته<br />يبدوا ان الاخت التي كتبت الموضوع ليست بالليبيه بمعظم كلاماها خطأ وتعبيرها ليست بالصحيحية. مثل \"ها يابيك شو الجو منيح\" ليست ضمن اللهجة الشبابية الحاليه وكوني شاب لم اسمعها من قبل والأصح ان كتبت \" جوك مليح \". والمقال اغلبه خطأ فأرجوا من ادارة المنتدى حذفه, او مراسلة الكاتبة لكتابته بصورة صحيحة.<br />ومن قام بالتعليق علي الموضوع انما ردودكم تدل على شخصيتكم, وما نحن بالشعوب التي يسخر بعضها من بعض .<br />وكما يقال بالليبي \" الزين ديمه زين ما يتوارى ... والعِـفـن في الشـدّة تبـان عـواره \" .<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2010-03-14"
