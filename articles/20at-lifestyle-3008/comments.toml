text = "من الاشياء الغريبة التي ظهرت مؤخرا بين الشباب العربي هي التقاليع الغريبة حتى في الكلام<br />ولكنها ظاهرة قد تستمر و قد تختفي. اختفاؤها دليل انها ليست وليدة الشباب العربي<br />و استمرارها دليل انها وليدتهم و هي في وجهة نظري ابداع حتى ان لم تعجب الكبار<br />(هما هياخدو زمنهم وزمن غيرهم)<br />شكر خاص للكاتبة عل مجهودها"
