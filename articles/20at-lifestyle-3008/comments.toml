subject = "ساد يا قذافي"
author = "مش عارف شنو نكتب"
posted = "2008-06-16"
text = "وسارك ساد يا قذافي رانا تعبنا من كترت الكلام وسماعه , اتقول في خطابك للدول تعالوا شوفو مدرسة الديمقراطية في ليبيا ههههههه , انت في نفسك عارف انه الشعب الليبي يعرف انه هذا كذب لابال الدول الاخرى , الله يسترك فوتنا واطلع بره من ليبيا انت وابناءك , والا بتحساب ولدك سيف الاسلام يبي ايشد بعد هذا حلم ما تحلم بيه رد بالك ولو ايموت نصف الشعب الليبي ساد انت استعمرتنا 40 سنه ومن كذبه لكذبه , ليبيا خيراتها ما ينعدن وافلوس كيف التراب والناس اتخمم في حق الخبزه تي وين صار الكلام هذاي ياراجل , والا بتحابنا نبو انصدقو انه من سرق الفلوس هو القطط السمان او الامناء هههههههه والله هذي ضحكة ما اتصدقوها تي ماهو انت اللي امسبب في ذلك ايام المؤتمرات والمشاكل التي تحدث من اجلها بيش تبقى في مكانك والناس تلها في بعضها , وانت ما تقدرش عليهم الامناء ترا واحد ايقول عليك كلمه والا يتكلم على الحكم ( تنفيه هو واسرته كيف ما عملت في ناس واجده) .<br />المهم يا خوتي ماعليكم الا الدعاء الى الله ان ينزل عليه البلاء ويلهى في روحه بيش ايفك علينا<br />والسلام علسكم"
archived = "2010-03-14"
