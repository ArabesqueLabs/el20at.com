[[comments]]
order = 0
subject = "اه لو نكون ربعهم"
author = "محمد جمال الدين"
posted = "2009-01-12"
text = "وقال ايه<br />حرس الحدود المصرى .. فاكر انه لما يضربله طلقتين فى الهوا هما هيخافوا و يرجعوا<br />وياريت نكون ولو ربع الناس دى .. فى ايمانهم و صبرهم وتمسكهم بحقوقهم .. على الاقل ما كانش هيبقى ده حال المصريين دلوقتى<br />اكثر من 90% من حقوقهم مسلوبة .. و ساكتين مش عارف مستنين ايه ؟<br />على رأى زميلة مدونة عزيزة<br />لبيك يا فلسطين نحن الهئ مئ"
archived = "2010-03-14"
