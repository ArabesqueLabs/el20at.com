[[comments]]
order = 1
subject = "أبطال غزة"
author = "المصرى أفندى"
posted = "2009-01-13"
text = "تنهمر الدموع من أعيننا عليكم أيها الصغار الكبار وأنتم لم تنزل من أعينكم دمعه.. رأيت الأطفال المصابين على قناة الجزيرة أصابات جسيمة ومع ذلك لفان قلوبهم الصغيرة أمتلأت بالأيمان والصبر على قضاء الله.. أنهم أمنوا بربهم فأعطاهم من القوة والصبر ما يهد الجبال فكانوا أقوى من جنود العدو الأسرائيلى الذين يتحصنون داخل ألياتهم الثقيلة.. نسأل الله العلى القدير أن يتقبل شهداء غزة فى جناته ويجمل بالشفاء الجرحى وينصر المجاهدين فى سبيله .. رأيت الطفلين جميلة ولؤى كبار كبار فى عنان السماء."
archived = "2010-03-14"
