subject = "تطوير التليفزيون المصري بس من الخلف"
author = "موظف تليفزيوني"
posted = "2009-03-04"
text = "التطوير ليس بتنحية ابناء ماسبيرو عن العمل البرامجي او غيره ولكن التطوير يجب ان تسبقه خطوة اخري اهم وهي التطهير ؟؟<br />نعم التطهير من كل مدير او مسئول او صاحب مركز ساهم منذ القدم في هدم هذا الصرح المصري الأعلامي الأصيل.<br />ففي الفضائيه المصريه يحدث مثل ما يحدث في قطاع التليفزيون من انتكاسات وسقطات بفعل القائمين علي ادارتها .<br />انهم اصحاب المناصب الذين اصبحوا كالنبات المتثلق لا ينفع بل يحجب الرؤيه فقط<br />ناهيك عن السرقات والاختلاسات التي تتم بأسم القانون في كل ادارات الفضائيه المصريه وبالاخص بادارة الخدمات الانتاجيه<br />المحسوبيه والوساطه والمغالاه في كل شيئ الشيئ يشتري بعشره يكتب بالف علي الورق يله خلي المدير ياكل ومسئول المخازن يقبض وكله بيضحك علي كله<br />التطوير يا ساده يجب ان يكون من الجزور وليس من الاوراق واستئصال البراعم المسئوله عن نمو الشجره<br />ان العملين في ذلك الماسبيرو يقضون اكثر اوقاتهم فيه يعانون من الشد العصبي والارهاق النفسي للخروج بصوره جميله للمشاهد المصري وياتي بعد ذالك الاختيار من جانب القيادات من بين الاعمال من منها الصالح ومن منها الطالح ولكنهم للاسف كانوا يختارون اسؤ الاعمال البرامجيه لان اصحابها من اقارب وابناء القيادات من هنا تظهر لنا العيوب الحقيقيه<br />من هنا يكمن الفيرس يا ساده<br />كانت الفضائيه المصريه اثناء قيادة الاعلاميه الكبيره / ثناء منصور<br />فخر القنوات الفضائيه العربيه كلها وما ان بعدت عنها ثناء منصور حتي ماتت الفضائيه واصبحت مثل المركب صاحبة الالف قبطان.... هذا يامر بالسير يمين وهذا يقول يسار وهذا يامر بالتوقف<br />مسلسل غريب عجيب ما يحدث داخل اروقة ذلك الماسبيرو هناك من ينادي بتجديد البرامج كديكورات مثلا وتصرف مئات الالوف من الجنيهات ولكن تري في اي شيئ تصرف تلك النقود انها تصرف لتزيين مكاتب الساده رؤساء القنوات والساده رؤساء الادارات المركزيه وايضا لا ننسي اعادة بعض النقود من ما تبقي الي القطاع الاقتصادي علي سبيل ال ايه التوفير<br />وبعد ذلك نجد البرامج لم يتغير فيها شيئ لا في الديكورات ولا في موضوع البرنامج نفسه وبعد ذلك يريدون ازاحه العاملين ويتركون المتسبب الحقيقي في اهدار ملايين الجنيهات دون ان يصرف منها علي دورات تدريبيه للعاملين او حتي تطوير الاجهزه الهندسيه داخل الاستديوهات وبعد ذلك تنادون بالتطوير اي تطوير وعواجيز الكراسي القياديه ما زالوا جالسين علي تلها بعد خرابها.......؟؟؟؟<br />اين الكوادر الشابه لقد تم دفنهم في مقابر الروتين ولا عزاء لرؤساء القنوات<br />افبعد ذلك تريدون ان تتحدثوا عن التطوير .........................................يا أخي بلا وكسه بلا خيبه<br />كل من اتيتم بهم يا ساده من خارج المبني ليسوا الا عاملين حاصلين علي اجازات بدون راتب او انهم تركوا التليفزيون من سابق املين ان يجدوا ضالتهم في القنوات الخاصه وها هم يعودون من جديد ولكن لياخذوا ما تبقي من بين ايدي من كانوا اخوانهم وزملائهم في ذلك الماسبيرو في يوم من الايام ..........<br />وعمار يا مصر"
