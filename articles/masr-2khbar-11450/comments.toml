order = 0
subject = "اغلقوا هذا المبنى او بيعوة لمثتثمر رئيسى يعملة فند"
author = "لا يشاهد الاعلام الفاشل"
posted = "2009-03-02"
text = "اعلام فاشل<br />كل مخرج وكل مذيع او مذيعة جاب ابنة او بنتة الخنفاء لتشتغل مذيعة دمها يلطش او ولد دم امة تقيل<br />والنتيجة ان المشاهد فى القرى والمدن فى يدة الريموت وامامة 400 قناة يشاهد منها مايشاء ويرتاح لوجة المذيعة فى اى قناة تعجبة<br />اما المتحذلقات بتوع القنوات المصرية فالناس بتقفل عليهم<br />حتى الاحياء الفقيرة والعشوائيات والنجوع الناس التى ليس عندها اطباق بيلجأوا للوصلات - اجر الوصلة التى فيها 20 قناة فضائية هو 10 جنية فى الشهر<br />نعم اغلقوا هذا المبنى لانة رمز الفشل<br />ورحم اللة زمان صوت العرب التى كانت العرب من الخليج الى المحيط والتى ورثتها قناة الجزيرة من قطر"
archived = "2010-03-14"
