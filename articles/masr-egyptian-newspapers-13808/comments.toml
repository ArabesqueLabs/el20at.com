text = "مقال جامد جداا بس كلة تشائم من كل شىء واى شىء واعتقد ان الدنيا ليست بهذا السواد طالبت وحقق نمنع تسول الاطفال ودة حقك ونتمنى ان يظهر للنور وكمان النساء المتسولات وايضا حقك ونتمنى ظهور قانون يقضى على كل هذا العبث ...ولكن الدنيا كلها ليست تسول"
