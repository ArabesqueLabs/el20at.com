[[comments]]
order = 0
subject = "اللي اختشوا ماتوا"
author = "سعيد عطية"
posted = "2009-01-01"
text = "هذا هو رأي جماعتنا في سلوكها باختصار شديد ، وهو ايضاً رأينا جميعاً في جماعتنا نفسها<br />و علينا فيما هو آت ، ألا نقيم لجماعتنا أي وزن ، ولا نحسب لها أي حساب"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054047/http://masr.20at.com:80/newArticle.php?sid=19095"

[[comments]]
order = 1
subject = "الدولة الفلسطينية مكسب مهم كان يجب الحفاظ عليه"
author = "مش كاتب"
posted = "2009-01-02"
text = "طبعا كما انتم تعرفون ان فيه دولة فلسطينية اقيمت والحمدد له وهذا تقدم مهم في القضية الفلسطينية واصبحت هناك دولة اسمها فلسطين<br />المفروض اللي مسميين نفسهم حماس دول يراعو ذلك ويحافظوا على هذا الانجاز الكبير والمهم<br />والدولة الفلسطينية دي اتعملت بفضل مساندة مصر وجهود مصر<br />فيه دولة فلسطينية غزه دي مدينة من مدنها وفيه رئيس دولة وفيه مجلس فلسطيني<br />اللي بيحصل في غزه دا اسمه تمرد وخروج على النظام<br />الفلسطينيين دول اصبحوا شوية همج ومنظمات وبلطجه مش واخدين على نظام الدولة<br />مش عارفين ان فيه دولة لازم ننتمي اليها ولازم نحافظ على وجودها<br />شوية همج<br />هذا رأيي ورايي غير ملزم لاحد"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054047/http://masr.20at.com:80/newArticle.php?sid=19095"
