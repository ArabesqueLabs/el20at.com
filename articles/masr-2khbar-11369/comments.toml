posted = "2009-02-22"
text = "مين من الستات هتحط نفسها تحت حراسة 24 ساعة ومراقبة مستمرة وتستحمل<br />الفنانات مثلا - علشان الحارسة بعد فترة تروح تقول وتنشر كل اخبارها وتعمل لها فضيحة<br />والا ستات الاعمال وهؤلاء عايزين رجالة يحرسوهم ويبقى لهم مارب اخرى<br />لمين بالضبط<br />هيحرسوا كوندا ليزا رايس<br />اللة اعلم"
