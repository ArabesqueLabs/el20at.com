[[comments]]
order = 0
subject = "العصيان المدنى قادم"
author = "مراقب"
posted = "2008-03-29"
text = "السياسة الصبيانية التى اتبعها الحزب للبيع وافقار الناس بدأت تؤتى اكلها<br />الناس جائعة وعاطلة وليس لديها ماتخسرة<br />الناس لم تعد تخاف الحبس ولا الضرب ولا الاعتقال<br />يا حكومة الحقى نفسك<br />الفلوس اللى بتصرفوها على مليون ونصف عسكرى امن مركزى اصرفيهم على رغيف العيش<br />الامن المركزى مش هيعمل حاجة مش هيخوف الناس<br />خزينة الدولة فاضية والحكومة مش عارفة تزود مرتبات الناس ازاى<br />الصراحة من الحكومة للشعب مطلوبة<br />قبل العيار ما يفلت<br />وتخرب البلد<br />احقى يا حكومة صلحى حالك<br />الوزارة بتاع رجال الاعمال دى لازم تغور<br />وييجى دكاترة تقنوقراط محترفين يلحقوا يعملوا حاجة<br />يا حكومة اعملى حاجة قبل الغرق<br />ارجوكم"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174919/http://masr.20at.com:80/newArticle.php?sid=14906"

