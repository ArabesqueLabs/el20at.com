text = "هيا ايه الحكاية مش هتغرق البلد بس ياحكومة انتوا هتكونوا زي حكومة فرعون ( حسنى مبارك)سوف تلاقى مصير مأسوي لإإذن الله القادر على أن يقول للشيء كن فيكون \" اللى فات كان واللى جاي سوف يكون اطران علي راسكوا وراس اللى وراكم إلحقوا نفسكم من انتفاضة الشعب الجعان هتعملوا فيه ايه اكتر من كدة"
