text = "مسألة التحول من شخصية لأخرى هي مسألة مرتبطة بتربية الشخص وللأسف كثير منا لايحسن هذه الناحية ولايقوم على تأديتها بالشكل الأمثل فالتربية تقوم بالغالب عندنا على القمع والتغييب فينشأ الأولاد على مسألة العيب والنمطية التي يمشي عليها المجتمع دون معرفة بالمبررات وتصبح العبادة عادة والحجاب تقليد اجتماعي يزول بزوال القيد الاجتماعي<br />فلايدرك الكثير من شبابنا وبناتنا الغاية السامية والمعاني الروحية للأوامر والنواهي الشرعية<br />فلو عملنا على تعميق الأسباب الحقيقية من وراء الالتزام بالدين بعيداً عن التزمت والغلو ورسخنا في أذهان أبنائنا حكمة النهي لما نهى عنه الدين بطريقة تجعل كل فرد يحاسب نفسه دون رقيب عليه لوجدنا شخصية ناضجة قوية بذاتها لايزعزعها بريق التحضر الرخيص الذي يتناهب ويغزو العقول هذه الأيام"
