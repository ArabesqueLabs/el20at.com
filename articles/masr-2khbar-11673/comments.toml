text = "ان مسرحية ليلة عيد الميلاد عرض لا شك فية بانة عرض ناجح فقد رايت فى هذا العرض دنيا اخرى وناس اخرين وزمن اخر فقد انبهرت بكل ما يوجد على خشبة المسرح كاداء التمثيل والممثلة الرائعة ايمان امام عن مدى صدقها فى التمثيل واحساسها ورقتها العالية وايضا الممثلة سلمى غريب فانا احسست بانها شخصية اخرى غير الممثلة سلمى غريب المعروفة فقد ادت ادئها بشكل مختلف ورائع وايضا الفنان الجميل حمدى هيكل فقد كان غامض طول فترة العرض المسرحى فقد ادى دوره بموهبة كبيرة اما الفنان الرابع العبقرى من وجهة نظرى هو امير عصام فقد قام باداء دور صعب ليس سهل ولكنة اقامة باتقان وثبات فانا القى الية تحية كبيرة واحترام اما الدنيا الاخرى والزمن الاخر هو الديكور الرائع الذى قدمة د.صبحى فهو ايضا فنان عبقرى وايضا الموسيقى الرائعة الذى قدمها د.كريم والاضاءة والاكسسوارفكل هذة الاشياء لا تخرج عن مخرج عبقرى مثل ايمن مصطفى وكلمة عبقرى هى كلمة قليلة فى حقة فقد يوجد لدية الكثير من الافكار الاكثر من الرائعة فهو رجل امنحه كل الاحترام والذكاء وصدقة فى عمله الذى يعمل بة وكلنا نلقى لك تحية عن تعبك ومجهوداتك الرائعة اسرة عمل رحلة حنضل المسيرى"
archived = "2010-03-14"
