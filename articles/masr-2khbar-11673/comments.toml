text = "لقد قلت كل مايمكن قوله لقد امبهر كل من كان يجلس اثناء العرض ولكن هناك اشياء من المستحيل ان تنسى مثل حاله الصمت والثبات التى تميز بها الممثل الشاب امير عصام وكم التاثر الذى تميزة به الممثله سلمى غريب والارتياح الذى ظهر فى ضحكات الممثلة ايمان امام ولاانسى الجدية التى مثلها الممثل حمدى هيكل والموسيقى التى اثرت قلبى ومازلت ارددها حتى الان والاضاءة والتركيز على تفاصيل الاحداث وكل هذا يوضح المجهود الغير عادى للمخرج الرائع ايمن مصطفى"
