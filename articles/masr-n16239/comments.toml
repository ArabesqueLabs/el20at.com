order = 0
subject = "منتجعات الداخلية وخدمة الخمس نجوم"
author = "حرفوش"
posted = "2008-06-13"
text = "اة طبعا<br />عندنا منتجعات فى طرة وابو زعبل والواحات وبرج العرب وطبعا اشهرهم منتجع القناطر الخيرية اللى البنت الصادقة اسراء عبد الفتاح اعترفت ان الخدمة كانت فية 5 نجوم وان كل حاجة متوفرة<br />وطبعا الدكتور ايمن نور لما يخرج سليم دة اذا خرج من المنتجع هيكتب كتاب عن المنتجعات والخدمة فيها والمساج اللى بيعملوة لقفاة كل شوية<br />دة انا اسمعت ان وزارة السياحة بتحاول تقلد منتجعات الداخلية علشان السياح يستمتعوا<br />وقد نالت جائزة السبق الست اللى بتاخد كل اسبوع جائزة بصفتها الرائدة فى تحسين المنتجعات"
archived = "2008-06-15"
capture_url = "https://web.archive.org/web/20080615144150/http://masr.20at.com:80/newArticle.php?sid=16239"
