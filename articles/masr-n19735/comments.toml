[[comments]]
order = 15
subject = "لغبى اللى فوق - انتشر الاسلام بكل لغات الارض"
author = "اكتب اسمك هنا"
posted = "2009-02-07"
text = "فى مصر انتشر الاسلام بواسطة اللغة الهيروغليفية<br />حينما دخل عمرو بن العاص بجيش مكون من خمسة الاف عربى واستقر فى بالافة الضئيلة فى الفسطاط ترك امر جمع جباية الجزية الى الرومان المتمصرين ممن يعرفون با ايجبيتوس او الاقباط اما المصريين المسيحيين الاصليين فهم يعرفوا بالمصرانى وكلمة مصر داخلة فى الكلمة<br />هؤلاء الاقباط اذلوا المصريين ايما اذلال وقتلوا فيهم وعندى قصص يشيب لها الهول فى اضطهاد الاقباط للمصريين ولم يتم ابعداهم من جمع الجزية او الضرائب الا الوالى محمد على من حوالى 200 سنة<br />وكرهت الناس شخصية الملتزم النصرانى واسلموا لعل ذلك يخفف اضغط الرهيب عليه وساكتب قصصا من كتب التاريخ للاثبات<br />حتى حينما دخل الاتراك مصر من 400 سنة تركوا جباية الاموال للماليك الذين بدورهم اوكلوها الى الاقباط<br />انتشر الاسلام فى ايران بالفارسية<br />وفى الهند وافغانستان بالاردوا<br />وفى جزر الملايوا واندونسيا بلغة اهل كيرلا فى جنوب الهند<br />واعظم كتاب قراتة فى حياتى عن النبى محمد كان لكاتب هندى اسمة مولاى العلامة محمد على ومترجم للعربية"
archived = "2010-03-14"
capture_url = ""

