[[comments]]
order = 17
subject = "قالوا"
posted = "2009-02-09"
text = "كل سيارة تاكسى او ميكروباص فى مصر تفتح البيوت الاتية<br />بيت صاحب المال اى صاحب السيارة<br />بيت السائق<br />بيت الميكانيكى<br />بيت الكهربائى<br />بيت عسكرى المرور او امين الشرطة<br />بيت ضابط المرور<br />وكل الهم دة فوق راس السواق اللى لازم يسب الدين ويشرب بانجو ويقعد فى الغرز ويتعصب على الزباين ويسوق بهمجية كل دة علشان علشان يملىء الكروش اللى مدا ايديها على كمائن الطريق<br />سواق ميكروباص دفع غرامات فى اسبوع واحد 750 جنية على حسب قانون المرور الجديد وسواقين الميكروباص عملوا اضراب واحتجاج على كثرة الاكمنة ودفع الاتاوات وسبق ان جريدة الدستور على موقعها نشرت كليب لرجال الشرطة وهم يجمعون الاتاوات من السائقين فى عز النهار عينى عينك<br />الموضوع ببساطة فساد ادارى للدولة<br />لما دولة مش قادرة تنظم المرور يبقى ممكن تقدر تعمل اية<br />طيب العلاج اية<br />مضاعفة الاجور للعاملين فى الجهاز الادارى للدولة حتى لا يمدوا ايديهم - وبما ان خزينة الدولة مفلسة وتعتمد على الشحاتة والاعانات فمفيش فايدة<br />ويبقى الحال على ماهو علية"
archived = "2010-03-14"
capture_url = ""

