[[comments]]
order = 19
subject = "دعوة أم دسوقي لإبنها وهو رايح الشغل"
author = "مش حخاف"
posted = "2009-02-10"
text = "دعوة أم دسوقي لإبنها وهو رايح الشغل<br />الدكتور/ دسوقي أجدع ناس<br />ربنا يبعد عنك الأشرار ....... ويجعل لك في كل خطوة دولار<br />ويبعد عنك أولاد الأيه ......... ولا يخيبك خيبة الجنيه<br />ويجعل أعمالك كلها حسنات .... ويكفيك شر شهادة المخالفات<br />ويحوش عنك كل الشرور ........ ويكفيك شر كمين المرور<br />ويكون لك دايما في العون .... ويكفيك شر فاتورة التيلفون<br />ويجعل لك كل الناس حبايب ...... ويكفيك شر بتوع الضرايب<br />ولا يجعل عيالك محرومة ....... ولا يخيبك خيبة الحكومة<br />ويجعل أصحابك كلهم إخلاص ..ويكفيك شر سواقين الميكروباص<br />ويحميك يابني من إبليس .. ويكفيك شر سواقين الجيش والبوليس<br />وينور لك طريقك بالبركات ... ويكفيك شرالحفر والمطبات<br />بدعيلك وبدعي لكل أولادي .... يكفيكم شر الركود الاقتصادي<br />ويكثر في جيوبكو النقدية ... ويرحمكم من شر الدروس الخصوصية<br />ولا يحرمكم من أكل الفول .... ولا يخرب بيتكم بفواتيرالمحمول<br />وتقبلوا هذه الدعوات المجانيه بوافر من<br />التحيات والتشكرات وعظيم التقديراااااااات"
archived = "2010-03-14"
capture_url = ""
