[[comments]]
order = 0
subject = "طار فى الهوا شاشى وانت ما تدراشى"
author = "اسامة بن انبطاح اللى امة اصلاح"
posted = "2009-02-04"
text = "ايران اليوم ارسلت قمرا صناعيا ايرانيا بصاروخ صناعة ايرانية محلية<br />وانتم مشغولون بسواقين التوك توك<br />فية ناس بتشتغل<br />وناس بتدور على قروض اجنبية تشفطها<br />فيها مجتمعات بتصعد شابة ومجتمعات بتموت من التخلف والفساد<br />ونحن نغرق نغرق نغرق"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 1
subject = "وجهاز الشرطة فى مصر هو الذى يقود قاطرة الفساد فى م"
posted = "2009-02-04"
text = "الكاتب شاف واحد اعمى استخرج رخصة قيادة -- او رخصة قيادة صدرت لواحد اعمى<br />عايز تشوف بتوع المرور بيعملوا اية<br />بيعطوا تراخيص سير ( تجديد رخصة سير لسيارة اجرة ميكروباص - واللة العظيم تلاتة ركبتها اليوم - بدون اى زجاج فى النوافذ - عربية ماشية من غير زجاج غير الزجاج الامامى فقط ومفيش فيها انوار ولا اضاءة<br />سواق الميكروباص بيدفع اتاوة معلومة ومفروضة لعسكرى وامين الشرطة اللى بيجمعوا الفلوس ويوزعوها مع الضباط<br />الفساد رهيب فى جهاز الشرطة<br />اصبحوا متخصصين فى جمع الاتاوات فقط ولتخرب الدنيا بعد ذلك<br />المهم عندهم يقبضوا"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 2
subject = "الى الاخ اللي فوق بتاع ايران"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-02-04"
text = "يبتاع ايران<br />ايران دي زي اسرائيل بالضبط وامريكا بتساعدها زي ما بتساعد اسرائيل بالضبط<br />لان اصل مذهبهم زي اصل مذهب النصارى<br />مذهب النصارى الفه واحد اسمه بولس (يهودي)<br />واصل المذهب الشيعي الايراني اسسه واحد يهودي اسمه (بن سبأ)<br />فهما الاثنين زي بعض ولازم يساعده بعض<br />وطالما بيسبوا ابو بكر وعمر وبقية الصحابة وزوجات الرسول صلى الله عليه وسلم<br />يبقى امريكا ما تساعدهمش ليه ما هو هو دا منى امريكا واسرائيل<br />انهم يشوفوا المسلمين بيسبوا ابو بكر وعمر والصحابه وزوجات الرسول<br />واخد بالك<br />اما مصر زيها زي اي بلد سني اصبحت مغضوب عليها منذ ان استلم كفرة الصليب مقاليد القيادة في هذه الارض<br />والكلام كتير اوي ويطول شرحه<br />سلام يا صاحبي"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 3
subject = "الى الاخ اللى كاتب يشتم الايرانيين"
posted = "2009-02-04"
text = "خليك يا خويا وراء عمر وابو بكر ونام فى جهلك تجتر كلام معفن<br />فية ناس بتشتغل بتنتج<br />وناس تتنطع باسم الدين وهم شوية تيوس همة ان يملىء بطنة ويعاشر امرأتة فى الليل بحيوانية<br />فية ناس بتدرس الهندسة ومحركات الصواريخ ووقود الصواريخ وهندسة التحكم وناس قاعدة تقول دول بيشتموا عمر واو بكر<br />امريكا بتساعدهم - فركوك يا خويا<br />طيب امريكا ما هى حليف رئيسى للنظام المصرى ولا نزداد من السير ورائها الا فقرا<br />وامريكا لها قواعد فى السعودية ودول الخليج - لية السعودية بتوع الامر بالمعروف والنهى عن المنكر لم يصنعوا بندقية صيد العصافير<br />لية بيوع السنة واو بكر وعمر لم يصنعوا قنبلة فوسفور زى اسرائيل<br />لانهم عايشين فى الوهم والفتة والتنطع<br />تحية للقيادة الايرانية المنتخبة التى تقود نهضة علمية وتنموية رائعة<br />المنطقة فيها اربعة دول محترمة<br />فيها<br />اسرائيل اولا<br />ولبنان ثانيا<br />وتركيا ثالثا<br />وايران رابعا<br />اما الباقى فهى دول حيوانات مجترة يحكمها تيبوس الامن المركزى وامن الدولة وجماعات الامر بالمعروف والنهى عن المنكر"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 4
subject = "اشمعنا يعنى"
author = "مش لازم يتعرف"
posted = "2009-02-04"
text = "هو ليه الناس بتعلق فى سياق بره الموضوع خالص<br />واشمعنا الى بيعلق بيشتم وبيقول حاجات لا تتناسب مع واحد المفروض انه قارئ يعنى واحد مثقف ومحترم<br />والى يغيظ اكتر انها كلمات من مجهول . يعنى الشجاعة معدومة على الاخر<br />خليكوا رجالة .. مرة واحدة وادخلوا باساميكم .. مع انها مش هتفيد كتير بس هتبقى عنوان للى بيتكلم<br />لكن بالطريقة دى .. يبقى .. نقدر نقول<br />الكلاب تعوى و القافلة تسير<br />وانتوا يا عشرينات سايبين الدنيا كلها تعلق حتى قليل الادب منهم<br />فين المدريتور الى هنا . ارجوكم مش عايزين نشوف الالفاظ دى تانى .<br />دول ناس سئيلة يا جدعان .. الى هما عايزين يمضوا حضور وخلاص<br />وخاصة انهم مش بيتكلموا فى الموضوع<br />ولا حتى الى دخل يقول مبروووك<br />مبرووووك أيه بس .. نفسى اشوف حد بيعقب على الموضوع بصراحة و فى السياق."
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 5
subject = "الفساد فى بر مصر"
author = "بقلظ"
posted = "2009-02-05"
text = "صباح الخير يا امم على راى توفيق الدقن<br />الفساد فى مصر موضوع رهيب يوشك على نسف مقدرات البلد<br />الموضوع هو تكريم لواءات الجيش والشرطة<br />الحكومة تريد ان تكرمهم على خدمتهم للنظام وولائهم - لا مانع - ممكن تعطى كل واحد سيارة دفع رباعى وشقة او حتى فيلا - ولا اعتراض - ويقعد فى بيتهم<br />انما الحكومة توزعهم على مرافق الدولة واجهزة الخدمات وتعطيهم الدرجات القيادية<br />فمثلا ما علاقة السادة اللواءات وكلى احترام لهم - بمرفق السكة الحديد ومترو الانفاق - النتيجة شبة انهيار لهيئة السكك الحديد<br />مرفق مياة القاهرة - ما علاقتة بالسادة اللواءات<br />مصر للطيران ومطار القاهرة اصبح المستقر للواءات الطيران<br />وحتى قناة السويس اصبحت من غنائم لواءات البحرية ادارة وتطويرا<br />ومديرى مكاتب السادة الوزراء معظمهم برتبة لواء<br />متى ننتهى من حكم العسكر البغيض<br />ملعون ابو الثورة وملعون ابو جمال عبد الناصر ومن تبعة من ولاد الكلب بتوع جزم البيادة اللى ودوا البلد فى ستين داهية"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 6
subject = "مفيش فلوس فى البنوك"
author = "بعد غربة 30 سنة"
posted = "2009-02-05"
text = "ادخرت مبلغا خلال غربتى فى 30 سنة الماضية فى احد البنوك الوطنية لاعيش منهم واشترى العلاج ومتطلبات البنات<br />وذهبت الى فرع البنك لاصرف مبلغا مطلوب للعلاج فلطعنى موظف الشباك فى البنك ساعتين بحجة عدم وجود قلوس وانة بيصرف الفلوس لغاية 400 جنية<br />انما خمسة الاف جنية مفيش فلوس وعلى الانتظار<br />ولاحظت ان الناس بتصرف فلوسها من البنك علشان تاكل وتمشى حياتها<br />انما لم الاحظ احد يقوم بالتوريد او ايداع فلوس<br />والعملية خطيرة<br />الناس بتسحب ومحدش بيعمل ايداع يبقى العملية بعد 5-6 شهور هتوصل للخراب<br />الازمة العالمية ستطحن البنوك المصرية<br />وايام سودة قادمة<br />وربنا يستر"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

