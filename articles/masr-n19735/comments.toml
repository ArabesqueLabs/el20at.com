[[comments]]
order = 9
subject = "رد على طار في الهوا شاشي وانت ما تدراشي لاسامه بن"
author = "مش حتشيع"
posted = "2009-02-06"
text = "انت بتقول في تعليقك ان<br />ايران اليوم ارسلت قمرا صناعيا ايرانيا بصاروخ صناعة ايرانية محلية<br />ما سالتش نفسك امريكا سابتها ليه<br />سابتها لان تنصير العالم العربي مستحيل لاكن تشييع العالم العربي ممكن<br />هدم عقيدة التوحيد عن طريق التنصير بالنسبة للعرب مستحيل لكن هدم سنة النبي صلى الله عليه وسلم عن طريق التشييع ممكن<br />طالما انت شاطر اوي كده<br />ممكن تقول امريكا مسحت الارض بالعراق ليه<br />لان صدام حسين السني عرف اسرار القنبلة الذرية وكان بيصنع وحيعمل صواريخ فاتمسح بيه الارض<br />ليه بقا عمتك امريكا سايبا خالتك ايران تصنع وتضرب صواريخ وتعمل نووي<br />علشان خاطر الهبل والعبط اللي زيكم يعجبوا بايران ويتشيعوا ويسبوا صحابة رسول الله صلى الله عليه وسلم ويهدموا السنة النبوية الشريفة<br />فهمت يا... ولاما فهمتش<br />القذافي مرة عمل مصنع مبيدات حشرية خافت امريكا وقالت المصنع دا ممكن ينتج اسلحة جرثومية ضربته<br />ونفس الحكاية في السودان ضربة مصنع برضه كان ممكن ينتج<br />والكلام لاي دولة عربية اللي حيعمل اي حاجه الطيران جاهز وحيضرب<br />لكن ايران بقا على الحجر امريكا عماله تدلعنا لان هي الامل<br />اصحا وفوق قبل فوات الاوان"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 10
subject = "رد علىالى الاخ اللى كاتب يشتم الايرانيين"
posted = "2009-02-06"
text = "انت بتقول في تعليقك<br />خليك يا خويا وراء عمر وابو بكر ونام فى جهلك تجتر كلام معفن<br />ابو بكر وعمر خلفاء النبي محمد صلى الله عليه وسلم وهما اللي عملوا المعجزه بعد النبي صلى الله عليه وسلم بفضلهم هزم الفرس والروم وفتحت ايران والعراق والشام ومصر واصبحت للاسلام دولة قوية وانطلق المسلمين الى الاندلس حتى الهند<br />وقد كرمهما الله سبحانه وتعالى في مثواهما الاخير بجوار اشرف خلق الله سيدنا محمد<br />عرفت مين هما ابو بكر وعمر يا روح امك<br />وبعدين روح قول للشيعة اصحابك ان النبي محمد خاتم الانبياء والمرسلين والرسالة الاسلامية التي جاء بها محمد هي اخر اتصال بين الله والبشر الى يوم القيامه واخد بالك ياابني يعني كل حاجه مضبوطة ومرسومه قبل وفاة النبي صلى الله عليه وسلم<br />وقول للشيعة اصحابك ان ربنا سبحانه وتعالى اعلنها صراحة في القران وواضحة جلية ان الملك لله يؤتيه من يشاء من عباده<br />هو حر في ملكه يؤتيه ابو بكر يؤتييه عمر يؤتيه معاوية<br />هو حر في ملكه<br />وسلملي على حسن نصر الله"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 11
subject = "لا اسالكم علية اجرا الا المودة فى القربى - من هم ا"
author = "معجب بايران"
posted = "2009-02-06"
text = "فى التحيات مع كل صلاة<br />يقرأ المسلم<br />اللهم صلى على محمد وعلى ال محمد<br />من هم ال محمد - هل هم ابو بكر وعمر<br />الازهر الشريف اجاز العبادة على المذهب الشيعى فى الاسبوع الماضى فى فتوى لمجلس العلماء بالازهر<br />مجلس العلماء الشيعة فى قم حرم سب ابى بكر وعمر فى الاحاديث<br />نحن لا نتكلم عن ايران كدين وشيعة وسنة<br />نحن نتكلم عن ايران كحكومة وشعب لة تنظيم وتخطيط وتقدم صناعى يسير كل يوم خطوة الى الامام<br />اما عن سؤالك الجاهل لماذا لم تهاجم امريكا ايران وتضربها - فخيالك المريض صور انها حليفة لها لتهدم ما يسمى السنة<br />لا<br />ايران من الشعوب الحرة التى اصلها ليس عبيد ولا من اقنان الارض ومزروع فى جيناتهم الجبن<br />ايران لم تخضع لاى احتلال طوال عمرها الا لبعض عشرات من السنين بعكس بلد كمصر تحت الاحتلال منذ خلقة اللة ولا يصلح الا لحياة القذارة والعبودية<br />تكلمنى عن ابو بكر ولا تستطيع حكومات بلادك تنظيف الشوارع من الزبالة والناس تعيش فى عشوائيات تليق بالخنازير<br />ذلك واقع مر<br />الفقر فى كل مكان<br />هكذا هم العبيد اولاد العبيد الذين قال الخديوى توقيق للفلاح عرابى<br />وما انتم الا عبيد احساننا<br />وما انتم الا عبيد احساننا"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206074920/http://masr.20at.com:80/newArticle.php?sid=19735"

[[comments]]
order = 12
subject = "ما يعرف بالحضارة الاسلامية هى حضارة فى 95 % منها ف"
posted = "2009-02-06"
text = "للعيال الجهلة يروحوا يقرأو<br />كل الكتب الكبيرة فى التراث والحضارة الاسلامية اصلها فارسى<br />فالبخارى صاحب اكبر كتاب صحيح فى جمع الاحاديث النبوية كان من بخارى بارض فارس<br />وكتاب الحيوان للجاحظ مؤلفة فارسى ابن فارسى يقيم فى بغداد<br />وكتاب كليلة ودمنة صاحبها فارسى<br />وكتاب الف وليلة وليلة كتاب فارسى الاصل ترجم فى بغداد<br />وهكذا<br />وهكذا<br />فالحضارة الاسلامية هى حضارة الفرس<br />وهم حملة العلم الحديث<br />واطلقوا سفينة فضاء بصاروخ ايرانى اتخذ مدارة بنجاح<br />اما بتوع الفتة فيجتروا كلاما جاهلا<br />لو دخلت امريكا ايران هيضحضحوها<br />حاصر شباب الجامعات الايرانية مقر السفارة الامريكية فى بداية ثورة الخمينى ولم تجرؤ امريكا ان تطلق طلقة واحدة<br />لانهم شعب مكون من 80 مليون وشعب مقاتل بمعنى كلمة مقاتل الا اذا ضربوهم بالقنابل الذرية زى اليابان وفى تلك الحالة ستصل الاشعاعات النووية الى اسرائيل وتقضى عليها<br />عفوا سيدى عمر بن الخطاب وعفوا سيدى ابو بكر الصديق<br />فقد قابل عمر بن الخطاب شابا متدينا بشدة يمشى مطئطىء الراس فى خشوع ويحرك قدمية برهبة وشدة تدين وعيناة تنظر الى الارض - فبادر عمر الى الدرة وهى العصا التى معة وضربة بها قائلا<br />لا تمت علينا ديننا<br />يعنى<br />لا تستموت وتقول هو دة الخشوع والتدين وتلبس جلابية قصيرة بنصف ديل وتطلق لحيتك وتقول قال عمر وقال ابو بكر<br />بل اشتغلوا<br />اصنعوا صواريخ وقنابل وسيارات ومدرعات مثل ما تعمل اسرائيل<br />خليكوا شوية رجالة"
archived = "2010-03-14"
capture_url = ""

