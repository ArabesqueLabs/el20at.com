order = 14
subject = "رد على الحمار الذي يقول بالحضارة الاسلامية هى حضار"
author = "مش فارسي"
posted = "2009-02-07"
text = "هذا الكلام مردود عليه باية قرانية<br />لسان الذي يلحدون اليه اعجمي وهذا لسان عربي مبين<br />الحمد لله الحضارة عربية وقائمة على اللغة العربية والقران الكريم وانطلقت الى مشارق الارض ومغاربنا باللغة العربية وليس الفارسية<br />مش عارف ايه اللي خلا الكل مغرم بايران كده<br />ايه اللي حصل"
