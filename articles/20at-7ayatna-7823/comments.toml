subject = "متسوقة من العبدلي"
author = "اكتب اسمك هنا"
posted = "2008-01-21"
text = "أعذرني أخي محمد بس انت اكيد مو عايش بالاردن ، أو انك ما رحت على العبدلي الا لما عملت هاد التقرير ، لانه نسبة أكتر من 50% من الناس الي بيروحوا للعبدلي عشان يشتروا الملابس المستعملة هم من الطبقات الراقية لانهم بلاقوا بهاد السوق جميع الماركات العالمية وباسعار مناسبة و اكتر هاي الملابس بحالة اكتر من جيدة جدا ، صحيح في برضه نسبة كبيرة من الفقراء وذوي الدخل المحدود بس هاد ما بعني انه العبدلي سوق الفقراء، وأنا عن نفسي ولا فقيرة ولا اشي بس بلاقي في العبدلي كتير ملابس حلوة وبشتري كميات كبيرة الي ولكل افراد العيلة وباسعار مريحة."
