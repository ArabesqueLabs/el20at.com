text = "ياذا الجلال و العزة انقد المسلمين في غزة اللهم كن لهم عونا ونصيرا اللهم عليك باليهود الظالمين اهزمهم وزلزلهم اللهم ارنا فيهم عجائب قدرتك اللهم حرر المسلمين في غزة ياذا الجلال والعزة اللهم بدل خوفهم امنا اللهم اعز الاسلام والمسلمين و اذل الشرك والمشركين ودمر أعداء الدين يارب العالمين اللهم اصلح احوال المسلمين في فلسطين اللهم ألف بين قلوبهم ياذا الجلال والعزة اللهم انصرهم على اليهود . اللهم امين<br />.................................................................................................... كل الجزائر مع غزة .........سلام ."
