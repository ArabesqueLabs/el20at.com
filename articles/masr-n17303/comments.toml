[[comments]]
order = 14
subject = "مجلس الشورى وتورا بورا"
author = "من العامة والدهماء او الغوغاء"
text = "مصر عيانة<br />راسها فيها زاهيمر وتخلف عقلى عميق<br />مجلس الشورى كلهم ناجحين بالتزوير او معينين من رئاسة الحزن الوطنى<br />بيفرضوا قوانين وكان المصريين سكان تورا بورا<br />اعتقالات<br />حبس علشان مخالفة مرور<br />يبقى حرقة حلال باللى فية"
archived = "2008-08-25"
capture_url = "https://web.archive.org/web/20080825011048/http://masr.20at.com:80/newArticle.php?sid=17303"
