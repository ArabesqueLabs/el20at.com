[[comments]]
order = 5
subject = "فى ستين الف داهية"
author = "واحنا مالنا"
text = "يارب قصر العروبة وراس التين وعابدين يتحرقوا والعيلة كلها فية<br />كفاية 27 سنة طوارىء<br />كفاية اعتقالات<br />كفاية اذلال للشعب<br />اية القرار اللى طلعة مجلس الشعب او الشورى لصالح الشعب<br />هل اقال وزارة مرة واحدة - هل سأل رئيس الدولة عن مخصصاتة المالية وطريقة الانفاق فى القصور والسفريات لزوجتة وعيالة الى اوروبا بدون اى حدود<br />مجلس منظر<br />لا يحاسب الكبار<br />يبقى فايدتة اية<br />يولع بجاز"
archived = "2008-08-23"
capture_url = "https://web.archive.org/web/20080823233742/http://masr.20at.com:80/newArticle.php?sid=17303"

[[comments]]
order = 6
subject = "هما اللى ولعوا فية"
author = "سعفان"
text = "افراد الشعب العاديين ممنوع يمشوا من الشارع امام المجلس - مجرد المرور من امام بوابة المجلس يطلع لك خمسين امين شرطة وعسكرى ويقول لك امشى بعيد عن هنا - ممنوع<br />يبقى اللى لهم ملفات جوة المجلس هم اللى ولعوا فية<br />بعتوا واحد زابط زى اللى راح دبى وقتل سوزان تميم ورجع بالسلامة واخد 3 مليون دولار يبعتوا واحد زابط امن كان فى مباحث امن الدولة قبل كدة يولع لهم فى المجلس ويقبض برضة مليون دولار<br />يعنى ولع لوحدة - مستحيل<br />واحد من الحرامية الكبار من عصابة العيلة الحاكمة هو اللى ولع فية - واحد محمى فى جمال او علاء<br />خليهم يولعوا فى البلد<br />حبيبى انت وهو مصر تعيش اسوأ ايامها"
archived = "2008-08-23"
capture_url = "https://web.archive.org/web/20080823233742/http://masr.20at.com:80/newArticle.php?sid=17303"

[[comments]]
order = 7
subject = "ارض فضاء للبيع"
author = "سمسار"
text = "تعلن لجنة سياسات بيع مصر عن قطعة ارض فضاء مساحتها 10 الاف متر كانت سابقا ارض مجلس الشورى والبرلمان<br />تعلن بيعها لمثتثمر رئيسى وسيتم عمل عروض بمبلغ اساسى 5 مليار دولار<br />ويمكن اعطاء اولوية للجامعة الامريكية للشراء بسعر تفاضلى لتوسيع مبناا<br />للاستفسار يرجى مخاطبة السيد احمد عز وممدوح اسماعيل وهشام مصطفى4<br />الدفع فى بنوك سويسرا"
archived = "2008-08-23"
capture_url = "https://web.archive.org/web/20080823233742/http://masr.20at.com:80/newArticle.php?sid=17303"

