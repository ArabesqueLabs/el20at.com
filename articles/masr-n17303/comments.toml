subject = "سرقوها وسرقوها وسرقوها ثم من بعد ثم حرقوها"
author = "مش منوفى"
text = "بيقولوا الحرامى بيحب يخفى جريمتة وما يسبش اثر وراة<br />يولع فى المكان<br />وهو دة اللى حصل<br />بس فية حاجة محيرانى<br />لية احمد عز بعد الحريقة ما شعللت كان اول واحد موجود هناك يمكن قبل صفوت الشريف وفتحى سرور - كان بيطمن على اية<br />فية احد من الكبار بعتة علشان يطمنة ان الحريقة ماشية تمام وكلة على ما يرام<br />بكرة كل شىء يظهر ويبان"
archived = "2008-08-23"
capture_url = "https://web.archive.org/web/20080823233742/http://masr.20at.com:80/newArticle.php?sid=17303"

[[comments]]
order = 11
subject = "تعليقات من موقع قبطي"
text = "7- الراسل : Yes, i agree<br />You wrote: حبيب العادلى:حريق الشورى ليس وراءه عمل تخريبى and<br />I agree with Mr. Hebib because he himself has put the fire around the building. Thank you for this important information.<br />21 Aug 2008 - 13:58<br />6- الراسل : Coptic_Kid<br />برنامج الطبعة الاولي بيقول ان النار اكلت اوراق قضية (( اكياس الدم الفاسدة شركة هيدلينا وقضية العبارة السلام وقضية المبيدات المسرطنة يعني من الاخر عملية مدبرة<br />21 Aug 2008 - 12:40<br />5- الراسل : Very Egyptian<br />اعلان هام ..<br />بعد احتراق مبنى مجلس الشورى المصرى , تعلن الحكومة المصرية عن وقف عملية الشورى حتى يتم بناء مبنى جديد. المبنى الجديد سيتم بنائه على احدث طراز و سوف يتم افتتاحه فى عهد الرئيس الجديد جمال مبارك.<br />ملحوظة, الرئيس الجديد يتسلم الحكم اثناء فترة توقف الشورى .. بسبب عدم وجود مبنى زى مانتم عارفين.<br />21 Aug 2008 - 09:19<br />4- الراسل : Daniel Abdel Messeh<br />(أصدر الرئيس مبارك توجيهات بإعادة تأهيل مبني البرلمان المصري وتحديثه علي نفقة الدولة بالكامل، وبدأ عدد من أعضاء الشوري يتقدمهم محمد فريد خميس حملة لجمع التبرعات لعمليات الترميم، وبلغت الحصيلة حتي الآن &--1634;&--1632; مليون جنيه)<br />بس خلي عنكم انتم الاتنين ...لآ انت ولآ هـــو..... أحنا اللي هاندفع ولو الفلوس كانت طالعه من جيوبكم ..برضه أحنا اللي دافعينها وهاندفعها. أحنا الشعب اللي مش لاقي رغيف العيش... أحنا الشعب اللي مش لاقي يلزقها من فين والا فين... هاندفعها في الضرايب بعد ما ينضم ليهم ضريبه جديده اسمها ضريبه الشعب والشوري... وألا في التبرعات الاجباريه... والا في طوابع البريد.. والا الاخوه المسلمين المتخصصين في جمع التبرعات لبناء الجوامع من المواصلات العامه دلوقت يلاقي عندهم سبب أخر للجمع والضرب والسب والتعسف في حاله الرفض... من ناحيه هاندفعها ما تخافش هتندفع هتندفع...<br />20 Aug 2008 - 23:40<br />3- الراسل : سعيد ماســــــبيرو<br />لدي بعض اعتراضات علي توصيف الحريق علي انه انتقام من ربنا علي دير ابو فانا - انا معترض جدا يا جماعه دي خساره وطنيه حتي ولو لمجرد مبني قديم جميل - المباني دي بتفكرنا جميعا بأيام عزنا و تنسينا ايام عز<br />بس انا متغاظ بشده من واحد عنده 90 سنه و شعره لونه بني و لابس نظاره و له مكتب فخم في و هو ما يستاهل الا كرسي حمام خشب و طبليه يقعد عليهم<br />20 Aug 2008 - 23:32<br />2- الراسل : مصرى<br />حبيب العادلى:حريق الشورى ليس وراءه عمل تخريبى<br />يا فرحة امك بيك ياعااااااااااااااااادلى<br />20 Aug 2008 - 22:26<br />1- الراسل : وزير الملابس الداخلية<br />حبيب العادلي انت اكب كداب في الدوله واقول للرئيس المؤمن ده بدايه رد السماء علي افعالكم الدنيئه ضد الاقباط والجايات اكثر لان الهنا لن يترك حق اولادة وياريت وزير الملابس الداخلية يداري خيبته ويسكت"
archived = "2008-08-23"
capture_url = "https://web.archive.org/web/20080823233742/http://masr.20at.com:80/newArticle.php?sid=17303"

