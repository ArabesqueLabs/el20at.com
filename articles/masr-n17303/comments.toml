subject = "رد على اخر تعليق في التعليقات القبطيد"
text = "الاخ القبطي بيقول الهنا لن يترك اولاده<br />اللي انا اعرفه ان الهم عنده ولد اسمه المسيح فقط<br />ايه حكاية اولاده دي<br />هو مخلف تاني غير المسيح ولا ايه<br />استغفر الله العظيم عما تقولون وتعالى الله علوا كبيرا"
