[[comments]]
order = 0
subject = "لماذا نكرة النظام الحاكم؟"
author = "ابلة ظاظا"
text = "لانهم ببساطة ضد الشعب وعملاء امريكا واسرائيل<br />انتم نسيتم حصار المحلة واقتحامها ب 100 الف عسكرى واستخدام الرصاص الحى والسحل وربط المصابين بالجنازير فى المستشفيات<br />انتم نسيتم انة من سنة 1981 تم ايقاف التعيينات وعدم وجود اى فرص عمل حقيقية امام شياب مصر<br />انتم نسيتم بيع القطاع العام والبنوك وتكسيح مصر اقتصاديا واعتمادها على التسول<br />انتم نسيتم طوابير العيش<br />انتم نسيتم المحاكم العسكرية للشرفاء والبراءة لبتاع العبارة وبتاع اكياس الدم<br />انتم نسيتم المعتقلين فى السجون بدون اى تهمة<br />انتم نسيتم قانون المرور اللى سد نفس كل الناس<br />لو كتبنا على الفساد مش هنخلص<br />حكومة ضد الشعب<br />فساد ادارى<br />سوء ادارة<br />جرائم تعذيب<br />اذلال المواطن المصرى فى اقسام الشرطة وانتهاك كرامتة<br />نحن نتمنى ان نشوف ماحدث لصدام وعيالة يحدث عندنا ونصلى اللة من اجل ذلك"
archived = "2008-08-23"
capture_url = "https://web.archive.org/web/20080823233742/http://masr.20at.com:80/newArticle.php?sid=17303"

