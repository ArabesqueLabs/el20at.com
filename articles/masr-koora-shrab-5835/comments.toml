text = "يعنى لو افترضنا انهم فعلاً هياخدوا برأى الخبراء المصريين ... هيجيبوا منين معتقلات يحطوا فيها رببع سكان الأرض ؟؟ و فى الآخر يقولك ان ده إجراء مؤقت لحين انتهاء الأوليمبياد , و إنهم أول ما الأوليمبياد يخلص, كانوا هيفرجوا عن كل المعتقلين<br />بجد بجد ... لما بلد تستعين بمصر علشان تحل مشكله أمنيه , يبقى يا إما عاوزة تحطو المشكله , و تسحل اللى عملوها , و يمكن يعتقلوا رئيس الصين بتهمة التواطء مع جهات خارجيه ( ما هى الصين بالنسبه لمصر خارجيه ) من أجل استغلال حدث الأوليمبياد لقلب نظام الحكم , بس قلبه فين ؟؟ هنا وللا فى الصين؟؟ ... نظام عن نظام يفرق :D"
