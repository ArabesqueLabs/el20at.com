[[comments]]
order = 0
subject = "الاعمى ساعاتى"
author = "سبحان اللة"
text = "اولا احىى هذا الانسان العظيم الذى رغم اعاقتة تغلب على الصعوبات ونبغ واصبح خبيرا فى الكمبيوتر والبرمجة<br />ولكن الم يقل المصريون فى امثالهم الزمن لما يااتى يخلى الاعمى ساعاتى<br />طيب لايا سيدى انا مبصر ومعايايا شهادات فى الكمبيوتر وعاطل ومش لاقى شغل<br />اية الفايدة ان تكون عبقرى فى هذا الوطن<br />لا شيىء غير الضياع والتسكع وانتظار المصروف من الوالد وفقدان الامل فى اى شىء فى الحياة<br />الاعمى عندة مؤهل للتسول يحسد علية والكل سيعطية اما المبصر مثلى فمن ىيعطية<br />اقول لكم<br />لا الاعمى ولا المبصر لة ذكر او نصيب فى هذا البلد ولكن الذى لة الحرامى"
archived = "2007-06-27"
capture_url = "https://web.archive.org/web/20070627172120/http://masr.20at.com:80/newArticle.php?sid=10761"

