subject = "الفقر هو السبب"
author = "بياع فراخ فيومى"
posted = "2008-01-09"
text = "امرأة غلبانة ساكنة فى عشة فى الريف او فى العشوائيات مربية شوية فراخ يبيضوا بيضة لعيل من العيال او تبيعهم او تدبح الفرخة فى يوم مفترج او احد المواسم - اهو الفرخة بتحل المشكلة مادام سعر اللحمة غالى عليها<br />وبعدين ييجى موسم البرد والشتاء والحرمة بتخاف على الفراخ ليموتوا من البرد والسقعة - تقوم تحط القفص بتاع الفراخ معاها فى الاوضة اللى بتنام فيها وكلهم بيتنفسوا من هواء واحد فى غرفة مغلقة خوفا من البرد<br />تقوم المرأة تنقل الفيروس للفراخ او الفراخ تنقل الفيروس لها مش مهم<br />المشكلة ان الناس والفراخ بيناموا فى مكان واحد فى اوضة واحدة<br />يبقى الفقر هو اللى بيجيب المرض والموت<br />خللوا الناس تعيش عيشة ادامية<br />لية المرض لم يظهر فى المانيا او فرنسا<br />انما ظهر فى مصر ودارفور وتاميل نادو"
