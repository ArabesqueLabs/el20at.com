[[comments]]
order = 0
subject = "كشف الوجه من الاعجاز المستقبلي للاسلام"
author = "مش ححبك"
posted = "2008-10-25"
text = "عندما حصر الاسلام وجه المرأة عن دائرة العورة فهذا من الاعجاز المستقبلي للاسلام<br />لاننا في زماننا هذا فيه حاجه اسمها اثبات شخصية لم تكن موجودة من قبل<br />كل واحدة لا بد ان يكون معها بطاقة شخصية او جواز سفر او كرنيه كلية الى اخره من الاثباتات الشخصية<br />تماما كما قال القران والخيل والحمير والبغال لتركبوها وزينة ويخلق ما لا تعلمون<br />في هذه الاية ويخلق ما لا تعلمون تنبأ الاسلام بالسيارات والطائرات وخلافه<br />كذلك عندما حسر الاسلام وجه المرأة عن العورة فهذا تنبوء بالواقع الذي نعيش فيه هو واقع اثبات الشخصية<br />فالمرأة مطالبة ان تثبت شخصيتها في اي وقت وتكشف وجهها وتبرز البطاقة<br />فعندما اخرج الاسلام وجه المرأة عن دائرة العورة فهو من الاعجاز<br />سلام"
archived = "2010-03-14"
capture_url = ""

