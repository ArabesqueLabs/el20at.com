subject = "طب أيه السبب؟"
author = "هاني العدوي"
posted = "2008-10-25"
text = "أنا برده مش فاهم هوه عمل كده ليه ؟ وكمان لو البنت اللي بأول بنش كان صدرها باين كان عمل معاها كده؟ وبعدين هوه حلها وسط كلامه وقال حرية شخصية ولا أيه؟"
