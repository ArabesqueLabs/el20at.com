subject = "ما مفهوم الاحتشام"
author = "شاب خايف على دينه"
posted = "2008-10-25"
text = "هو لازم اللى يقعد فى البنش الاول لازم تكون بنت ومبينة مفتنها علشان طبعا الدكتور يشرح المحضرة كويس ابتسامة دحكة اى حاجة على الماشى لكن بنت ملتزمة ميعرفش يسرح المحاضرة حرام على نفسك وسنك ىا دكتور"
