subject = "فتنة اية - خناقة عادية وبتحصل كل يوم"
author = "لية"
posted = "2008-08-19"
text = "كل يوم فية خناقات بين مسلمين وغير مسلمين وفية ضرب وسرقة وتكسير واغتصاب بس محدش بيسال انت دينك اية علشان اتخانق معاك - دى حاجات بتحصل بين الناس - هو المسيحى لة شكل مختلف - ماهو مصرى زى اى مصرى تانى بيشتم ويسب الدين ويضرب وينضرب وكلة عادى<br />ابعدوا الدين عن الخناقات ومعاكسة البنات وخلينا نحب البنات المسيحيات اصلهم حلوين قوى وبعدين نتجوزهم ونعمل على وحدة عنصرى الامة<br />فتنة طائفية اية - دا احنا بنحب بناتهم على الاخر"
