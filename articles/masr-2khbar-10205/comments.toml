[[comments]]
order = 1
subject = "(اتلهلال الاحمر المصرى)أضمن و أسهل و أسرع"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-07"
text = "حل كنتم حقا تريدون مساعدة اخواتنا المحاصرين بغزة؟<br />ام كنتم تريدون المزايدة على بطولات و همية كلها من ورق و صور و اصوات كلها تذهب هباء فى الهواء؟<br />و (كما الذبد فى البحار) ايها الخرفان!!!<br />لماذا لم تذهبو بتبرعاتكم مباشرة الى (الهلال الاحمر المصرى)<br />و تكون مساعدتكم لنصرة اشقائنا بفلسطين فى الخفاء بدلا من المنظرة و الفشخرة علنيا؟<br />البطولات يجب ان تتم فى الخفاء و ليست محاولات الاستخفاف بعقول المصريين<br />افيقوا و استيقظوا ايها النيام تنابلة السلطان؟!!!<br />ايها (المتابطلين بسيوفكم الورقية) و<br />(حناجركم الحيوانية) و<br />(عقولكم الخاوية) و<br />(اسلام عليكم و رحمة اللة و بركاتة)<br />و السلام ختام"
archived = "2010-03-14"
capture_url = ""

