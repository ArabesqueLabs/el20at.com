text = "الى (لية)؟<br />لية قلة الادب و التطاول على رموز الدولة<br />انت صهيونى قذر و لا ابن نكاح حرام!!!؟<br />اين انتمائكم لوطنكم حتى تكونوا محترمين؟!!!!!!<br />أخشى ان تكون ابن نكاح سفاح فى الحرام يابن (ابائك المتعددين)"
