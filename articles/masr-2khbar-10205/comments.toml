subject = "لا تتعبوا انفسكم يا شباب"
author = "لية"
posted = "2008-10-06"
text = "القيادة السياسية بتاع الحزن الوطنى ورئيسها عندهم تعليمات من ليفنى ورايس انهم يحاصروا القطاع مع اسرائيل<br />الحكومة دى مع القيادة بتاخد تعليماتها من تل ابيب<br />فمفيش فايدة<br />لا تحاولوا<br />الامن كلة مسخر لخدمة اسرائيل وحدودها<br />وابقى سلم لى على نصر اكتوبر"
