order = 0
subject = "اضراب لية ولمين وعلشان اية"
author = "من المندسين"
text = "هى بلد مين بالضبط<br />مش هى بلد ضباط مباحث امن الدولة والمخابرات<br />مش المفروض يخافوا عليها زى اى واحد من الشعب<br />مش الشعب الخائف المرتعد اللى كل بيقول انا مالى خلينى اربى عيالى<br />دى مش بلدنا لوحدنا<br />مفيش اضراب تنانى ولا تالت<br />مفيش سمع لاى واحد الوطنية بتحرقة شوية<br />اسعار البنزين هتتضاعف والاسعار خلال شهر هتبقى 3 اضعاف الموجود والكل هيجوع بجد<br />انما تستاهلوا اللى بيجرالكوا<br />لما يبقى شعب اشجع مافية بنت اسمها اسراء عبد الفتاح<br />مافيش اضراب ومش هنشارك فى حاجة<br />ويارب يولعوا فى البلد"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113924/http://masr.20at.com:80/newArticle.php?sid=15610"
