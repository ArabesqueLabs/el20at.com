[[comments]]
order = 5
subject = "البقر والمعيز"
author = "على سلامة"
text = "مصر جميلة بجد<br />بس هو تقريبا فية حد<br />اعمى دخل بيها ف حيطة<br />الرفرف اليمين طار والمرايات<br />والموتور اتحرق وشوية حاجات<br />وانكسر البربريز<br />بس ممكن<br />انت عارف ان فية<br />علماء مصريين<br />فى بلاد الامريكان والانجليز<br />بس لما العصافير تبطل غونا<br />مش هتسمع غير البقر والمعيز"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406230145/http://masr.20at.com:80/newArticle.php?sid=14999"

[[comments]]
order = 6
subject = "ضع عنوان التعليق"
author = "اللى ماتتسماش"
text = "اولا لا يوجد الان رئيس يطلق عليه ولى الامر<br />فولى الامر هو الذى ينتهج الشريعة الاسلامية ومثله مثل القاضى يحكم بشرع الله<br />ونحن قانوننا وضعيا وفيه الكثير مما يناقض الشريعة<br />وانظر الى خطبة سيدنا ابى بكر<br />وان كان لا وجود للمقارنة هنا<br />ولكنها خير دليل على ما يجي ان يكون عليه الحاكم الصالح الذى يخشى الله ويتقى الله فى شعبه<br />يقول ((وليت عليكم ولست باخيركم) انظر من يقول هذا الصديق صاحب رسول الله<br />ويقول( فإن أحسنت فأعينوني، وإن أسأت فقوموني)<br />ويقول((أطيعوني ما أطعت الله ورسوله، فإذا عصيت الله ورسوله فلا طاعة لي عليكم\\\\\\\".))<br />وحكامنا الان اليسوا يعصون الله؟<br />اليسوا يوالون الاعداء ؟<br />اليسوا يحكموننا بالحديد والنار اذا فقط طالبنا بابسط حقوق الانسان؟<br />اليسوا حرمونا من مأكلنا ومشربنا وفى حقنا للحياة؟<br />الحق ان تقول للحكام اتقوا الله"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406230145/http://masr.20at.com:80/newArticle.php?sid=14999"

[[comments]]
order = 7
subject = "للجاهل بتاع ولى الامر ( مخبر حزب الحرامية الوطنى )"
author = "اى واحد"
text = "القرأن قال اطيعوا اللة ورسولة واولى الامر منكم - ( يعنى قال اولى -جمع ولى الامر - اولى جماعة - وهم فى تفسير الشرع اهل الحل والعقد وهم من يختارون الحاكم<br />فهمت يا جاهل<br />اولى الامر هم اهل الحل والعقد - وليس ولى الامر<br />ولا دخل للدين فى ولى امرك الحرامى الفاسد اللى قاعد فى الشرم 26 سنة فى اجازة مفتوحة ياكل جنبرى مشوى لغاية ما الشعب جاع وفضيحتة على شاشات تلفزيونات العالم"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406230145/http://masr.20at.com:80/newArticle.php?sid=14999"

