[[comments]]
order = 9
subject = "مستعد ان احترم حسنى مبارك اذا"
author = "مصرى غلبان"
text = "نشر اقرارة الضريبى فى جريدة الاهرام المصرية شان اى مواطن مصرى يحترم القوانين والدستور<br />- اعلان مبالغ وقيمة الانفاق على القصور الجمهورية ومصروفات الرئاسة امام مجلس الشعب<br />تبرير المبالغ التى يملكها هو واسرتة ومن اين لك هذا<br />اقرار ضريبى مفصل لكل افراد اسرتة والمخصصات المالية لهم من الخزينة العامة<br />فليفعل هذا ليسد افواة المتحدثين<br />ليبرأ زمتة امام الشعب<br />ولتحدث الشفافية والمصداقية بينة وبين الشعب"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406230145/http://masr.20at.com:80/newArticle.php?sid=14999"
