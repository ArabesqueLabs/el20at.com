[[comments]]
order = 0
subject = "روزا باركس"
text = "روزا باركس<br />ولدت تحت اسم روزا لويس ماكولي (بالإنجليزية: Rosa Louise McCouley\\\") (عاشت بين 4 فبراير 1913-24 أكتوبر 2005) كانت ناشطة من أصول إفريقية أمريكية، طالبت بالحقوق المدنية للأمريكان الأفارقة.<br />اشتهرت روزا باركس عندما رفضت التخلي عن مقعدها في باص عمومي لشخص أبيض، عاصية بذلك أوامر سائق الباص. فأطلق ذلك حركة مقاطعة الباصات في مونتغمري، والتي شكلت بداية عملية إلغاء التمييز العنصري الذي كان سائداً في ذلك الوقت، لتكون إحدى أهم الأحداث في تاريخ الأمريكان الأفارقة.<br />يلا يا جماعة لازم نقلد روزا باركس"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406230145/http://masr.20at.com:80/newArticle.php?sid=14999"

[[comments]]
order = 1
subject = "المحمول"
author = "عاطف مرجان"
text = "يا حالولى يا حالول<br />انا خلاص شلت المحمول<br />انا من بكره هاكون مسئول<br />هأكل لحمه وهارمى الفول<br />انا من بكره انا هأبقى البيه<br />والبس بدله بألف جنيه<br />واقعد بقى ويا البهوات<br />واقعد بقى ويا البشوات<br />وان سئلونى هقول شملول<br />انا من بكره هأربى فراخ<br />انا من بكره هأربى طيور<br />هأكل بط ووز ولحمه<br />بدل يا عم ما أعيش مسلول<br />انا من بكره هأروح على لندن<br />بعد بكره هأزورها باريس<br />هأعمل جوله فى كل اوروبا<br />وبعد بعده هأطير على سول<br />وارجع مصر راكبها الجامبو<br />وانام فى فندق ست نجوم<br />اقعد اكلم هذا وذاك<br />فى مشاريع تصنعها عجول<br />وان طلبونى فى المؤتمرات<br />وان سئلونى فى الاجتماعات<br />هأعمل ناسى كانى بفكر<br />كده او كده هيقولوا مسطول<br />بكره انا هاطلع فى الجرانين<br />ويعزمونى فى التلفزيون<br />وادخل بنك باسمى ورسمى<br />اطلب طبعا كام مليون<br />آخد القرض اهرب على بره<br />يقوم ماسكنى الانتر بول<br />يا حالولى يا حالول"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406230145/http://masr.20at.com:80/newArticle.php?sid=14999"

[[comments]]
order = 2
subject = "رغيف العيش"
author = "مرحان"
text = "رغيف العيش<br />نايم تايه ولا على بالى<br />باللى بيجرى من حواليه<br />سارح هايم مع احلامى<br />واللى بشوفه طبعا فى منامى<br />فجاه سمعته بصوته العالى<br />عمال بينادى<br />نبره صوته خرمتلى ودانى<br />قمت وطارت منى احلامى<br />ولاقتنى يا ناس بسمع فى كلام<br />زى الكرباج لما يطرقع<br />وانا من غيظى كنت هافرقع<br />انا قلت خير الدنيا اتقلبت<br />ولا مصر فى غانا اتغلبت<br />قاللى يا فالح يالله بسرعه<br />روح على الفرن وهاتلنا عيش<br />شغلى هيبدأ وانا هاتاخر<br />واياك تيجى تقولى مفيش<br />بره البيت وخرجت بسرعه<br />عمال اجرى تقولشى حصان<br />انا قلت قبل الزحمه ما تكتر<br />جوه طابور احجزلى مكان<br />عند الفرن وصلت واملى<br />فى اى طابور احجز لى مكان<br />قالولى فى آخر الصف يا فندى<br />وخلى فى ايدك مناديل هاندى<br />انا قلت امانه يا خلق الله<br />سيبونى ازاحم واترجاه<br />قالو لى احسن لك ترجع احسن<br />خدلك دور يا شبه الطور<br />ولا تريح جنب السور<br />جنب السور كان فى دكتور<br />سألته يا بيه ايه حصل ايه<br />وليه الناس عاملين كدا ليه<br />قالى ورايا عياده ومرضى<br />وانا ع الحال لا يمكن هارضى<br />لازم ازاحم فى الطوابير<br />والطوابير اشكال والوان<br />م الرجاله وم النسوان<br />اللى تصرخ واللى تصوت<br />واللى تزاحم فى الشباك<br />والاطفال م الحيره واقفين<br />مش طايلين<br />وسع يا أبنى انت يا بت<br />بته تبتك<br />قامت معركه ادخل فيها<br />اللى له واللى مالوش فيها<br />ناس مساكين صربوا بعض بالسكاكين<br />والافران شبابكها اتقفلت<br />والابواب بالقفل اتسكت<br />قلت لنفسى يا فرحه ما تمت<br />رجعت البيت قالولى جبت<br />قلت ما جبتش<br />رد ابويا وقالى يا الف خساره<br />اصلى ما خلفتش"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406230145/http://masr.20at.com:80/newArticle.php?sid=14999"

