subject = "حتى ترقص السما"
author = "ديمة"
posted = "2007-10-21"
text = "اكثر ما يعجبنى فى كتابتك الـتأثر الواضح بالكلمات القرآنية واقوال السلف، وواضح جدا عشقك الخاص لعالم الصوفية ومعانيه<br />جميل ان يجد كل منا ما يحول طينه الى جوهر او عنبر ولكنه غالبا يحدث لشىء ما دخلك لا خارجك فقط تبحث عن ذريعة للتطهير ..<br />موضوع اكثر من رائع ورفعنى قليلا عن الارض ولكن لم يفقدنى ملامستها"
