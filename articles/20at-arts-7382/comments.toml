[[comments]]
order = 4
subject = "حقيقة"
author = "حذيفة"
posted = "2008-11-04"
text = "كم جميل عالم التصوف وروحانية القلوب إنه ما نفتقده حقا في هذا الزمن<br />ولكن هذه الطرق تحتاج إلى تجديد فيزال منها ما تجب إزالته من رقصات وبعض الشركيات التي شابتها بسب الجهل<br />أما بالنسبة للمقال فلي عليه مآخذ:<br />أولها ما كتب نقلا عن السنائي في أن الإلحاد والإيمان يسيران على طريق واحد وهذا يعني أن الملحد على إلحاده فإنه على صواب!! وإن كان الامر كذلك فإن كوني مسلم وعدمه واحد!!!<br />وثانيها ما نقل عن ملا جامي وكلامه هو الجهل بعينه فكيف يجعل المثنوي من لحم على النار حراما وكيف يضع المثنوي على كفة ترجح القرآن!!!<br />هذا بإيجاز لا ندعو للغلو ولكن الطريق إلى الله سبيله الحب والمجاهدة لا الرقصات ."
archived = "2010-03-14"
