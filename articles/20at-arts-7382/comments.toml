subject = "موضوع جميل"
author = "احمد"
posted = "2008-02-02"
text = "اولا احب اوضح اعجابى بالموضوع وتفاصيله<br />ثانيا احب اقول ان الموضوع ده ادانى فكرة كويسة عن الصوفية خصوصا وانى قريت وسمعت (عك) كتير بيحصل من الطرق الصوفية لدرجة انى بقيت مش عارف مبدأهم ايه من الأساس !!<br />شكرا بجد على المعلومات اللى اتعرضت فى الموضوع ده واللى هتخلينى ادور على مصادر جديدة للمعلومات عن الصوفية القديمة خصوصا مش المعاصرة ."
archived = "2010-03-14"
