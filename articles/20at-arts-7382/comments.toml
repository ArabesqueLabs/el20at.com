subject = "ضع عنوان التعليق"
author = "مسلمة"
posted = "2007-10-29"
text = "مقال جميل ...و عالم الصوفيه عالم واسع لا تدركه كل العقول فخاطبوا الناس على قدر عقولهم<br />في رأيي ما ينفعش نقول للناس تصوفوا و هما اصلا منهم للأسف من لا يصلى الفروض الخمسة \"مفيش حد بيخلف غير لما يتجوز\"<br />و كمان الناس للأسف فاهمة التصوف عل انه تمسح بالاضرحة و دروشة و خلاص و ما يعرفوش انه مدرسة القلوب و اصلاحها"
