[[comments]]
order = 1
subject = "الجهل بالدين .. فينطلقون إلى آيات قيلت في أئمة الك"
author = "منقول"
posted = "2008-05-04"
text = "خوارج هذا الزمان ..!<br />خوارج هذا الزمان .. يُعرفون بصفات وخِلال:<br />منها: أنهم يُكفِّرون بالخطأ، وبالظن، والشبهات .. وبأمورٍ لا ترقى إلى اليقين .. بـل<br />وبأمور لا تكون في عالم الوجود والواقع!<br />يكفي أحدهم ليصدر التكفير في حق فلان .. أن يُقال له قِيل عن فلان!<br />ومنها: أنهم لا يَعرفون مبدأ إقالة العثرات .. ولا مبدأ اعتبار الحسنات .. ولا مبدأ اعتبار المقاصد عند ورود المتشابهات .. ولا مبدأ رفع الملام عن الأئمة الأعلام كما يقول بذلك شيخ الإسلام!<br />ومنها: أنهم لا يَعذرون بالجهل .. ولا بالتأويل .. ولا بعجز لا يمكن دفعه!<br />ومنها: قلة الإنصاف والعدل .. فهم لأدنى خلاف يُكفِّرون .. ويجرمون .. ويخلدون في النار!<br />ومنها: الجهل بالدين .. فينطلقون إلى آيات قيلت في أئمة الكفر والإجرام .. فيحملونها على المؤمنين الموحدين!<br />ومن ذلك كذلك أنهم ينطلقون إلى كتب أهل العلم فيكثرون النقل منها .. فيضعونها في غير موضعها المراد .. فيظن المغررون المضللون من الشباب أنهم بذلك علماء .. لأنهم استندوا إلى أقوال العلماء في تنطعاتهم وأحكامهم الجائرة على الآخرين .. وبشيء من المتابعة والتدقيق يجد القارئ الواعي أن هذه النصوص التي استدلوا بها من أقوال أهل العلم هي عليهم وليست لهم .. أو على الأقل ليس فيها أدنى دلالة على ما ذهبوا إليه!<br />ومنها: الحقد الدفين على المسلمين الموحدين .. تحت عنوان إحياء عقيدة الولاء والبراء كما يزعمون ..!<br />ولو قيل عنهم: أنهم يُحيون عقيدة البراء والبراء .. وليس الولاء والبراء .. لكان التعبير بحقهم أصوب وأدق !<br />ومنها: أنهم ينفون عن أنفسهم تهمة التكفير بالذنوب .. لينفوا عن أنفسهم مسمى الغلو أو الخوارج .. وهم ـ في حقيقتهم ـ يكفرون بلا ذنب كما تقدم .. ففاقوا بذلك الخوارج .. وسبقوهم سبقاً بعيداً!!<br />ومنها: أنهم يُعرفون بالكبر والتعالي على العباد .. لا يوجد عندهم كبير يحترمونه أو يرجعون إليه .. فالكبير والصغير عندهم سواء!!<br />هؤلاء هم خوارج هذا الزمان .. فاحذرهم .. وحذِّر الناس منهم .. واحذر أن تكون واحداً منهم وأنت لا تدري ..!!"
archived = "2010-03-14"
