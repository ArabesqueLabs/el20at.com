[[comments]]
order = 3
subject = "والله صعبان عليا الصحفي اللي في الصورة ده"
author = "مرمورة"
posted = "2006-06-02"
text = "والله صعبان عليا الصحفي اللي في الصورة دي الها عبه برضه ......انا حاولت بيني وبين نفسي كده افكر في اي انجازات من اي نوع في اي مجال وفي اي حته ......دماغي وجعتني ومين غير اي نتيجه ..بس برضه متظلموش الريس.....اصل المده اللي قاعدها قليله ..... يعني لسه اعماله الجليله ملحقتش تؤتي ثمارها .استنوا انتوا بس ييجي عشرين او تلاتين سنه كمان من حكمه .جايز لعل وعسي ..حاجه ادي انجاز كده وللا كده يكون مستخبي بس ربنا يفرجها ويظهر خلال السنين اللي جايه<br />استنوا بس انتوا ومتبقوش مستعجلين كلها 20 او 30 سنه .....بسييييييييييييييييييطه<br />لا للتمديد .....لا للتوريث.... نعم لتعديل الدستور<br />كي اسيغ الواقع المر ....احليه بشئ من عصير العلقم ........احمد مطر"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909220109/http://masr.20at.com:80/article.php?sid=437&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

