[[comments]]
order = 6
subject = "هو زعلان ليه"
author = "مصري مدحور"
posted = "2006-06-02"
text = "هو زعلان ليه مش هو اللي مصر يقعد في البلد يبقى يستحمل اللي يجراله ماحنا عايشين بره مصر واخر تمام صحيح عايشين زي العبيد ومحبوسين عن الدنيا كلها بس كل الناس بتقول احسن من مصر, وادي آخة حكم السيد الريس الزعيم قائد الضربة الجوية ولاد مصر هجوا ومش ناويين يرجعوا تاني, طلعنا دكاترة بس معرفناش نعيش ولا حتى ناكل عيش وربنا يخليلنا ابو جمال ملك ولدي النيل"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909220109/http://masr.20at.com:80/article.php?sid=437&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "هاى جيمى..قررت انتخبك رئيس...لو؟؟؟؟"
author = "مصرية"
posted = "2006-06-03"
text = "الحل الوحيدلك ياجيمى لفض الأشتباك بينك وبين رفض الشعب لك ..هو اعلانك لميثاق شرف مع الشعب المصرى..بنوده محددة وواضحة تلبى فيها مطالبه<br />1-التخلى عن الجنيية الأمريكية اليهودية واعلانك الأخلاص لجنسة الفقراء المصريين<br />2-التبروءبشكل كامل وتام من كل أفرادعائلتك وخصوصا الوالد الغير محترم ومن كل الجرائم التى ارتكبوهاطوال عهدهم الغابروايداعهم السجون بعد محاكمة علنية<br />3-اعادة كل أموال الشعب المسروقة فى الداخل والخارج الى خزانة الدولة الخاوية وتجريد الأخ علاء وأمثاله من كل ممتلكاتهم ومصادرة ثرواتهم التى كونوها من دماء المصريين<br />4-ادانة كل من سرق ونهب الشب المصرى وفضحه بالاسم ومصادرة ثرواتهم لصالح الشعب<br />5-انهاء قانون الطوارىء وتعديل الدستور وفق مطالب الشعب<br />6-الافراج عن المعتقلين السياسيين..وادانة كل من قام بتعذيبهم وانتهاك حقوقهم..وايداعهم السجون وعلى رأسهم حبيب العادلى..واغلاق هذا الملف الأسود الى الأبد<br />7-انهاء الفساد والمحسوبية وتطهير كل أجهزة الدولة من عملاء والد السابق ( باعتبار تبرؤك منه)<br />8-حل مجلسى الشعب والشورى والحزب الوطنى..وتطهيرهم من الهتيفه والبصمجيه والبلطجيه والتعهد باقامة انتخابات نزيهه<br />9-وضع استقالتك أمام مجلس الشعب الجديد لقبولها فور اخلالك بأحد هذه الشروط<br />10-اعلاء سيادة القانون والكل أمامه سواء<br />اذا قبلت هذه الشروط انا مستعده أنتخبك رئيس لمصر ..لكن ده معناه انك تسلخ جلدك على يد هندى أحمر وللأسف أصحابك الأمريكان خلصوا عليهم..وعندنا مثل مشهور بيقول (ديل الكلب لا ينعدل)..هااااارد لاك يا جيمى..يعنى برضه مفيش فايدة...أنتم أحقر الكلمات فى قواميس كل لغات الدنيا ..لالالالالالالالالالالالالالالالالالالالا للقرصان وسلالته وعصابته..ونعم..نعم..نعم ..لثورة الجيش والشعب على ال<br />اقرأ بقية التعليق .."
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909220109/http://masr.20at.com:80/article.php?sid=437&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

