[[comments]]
order = 1
subject = "يا اخى استحمل شوية"
author = "أبو أسامة"
posted = "2006-06-02"
text = "يا اخى اسستحمل شوية ما احنامستحملين من25 سنة وياما اهنتنا. اهنتنا يوم بعت البلد لشوية حراميةاتحكموا فى ارزاق الغلابة ونشروا البطالة وغرقواالعبارة<br />اهنتنافى كل انتخابات مزورة يفوز فيها<br />حزبك الوثنى اهنتنا باءعلامك التافه الى<br />خلاك حاربت فى اكتوبر لوحدك مع اننا يا اخى كنا شايفينك وانت قاعد فى غرفة من الزجاج اهنتنا يوم ما عدلت الدستور على مقاسك اقول ايه ولا ايه.معلش يا ابو جمال استحمل شوية<br />لا.............للتوريث<br />لا.............لبيع مصر<br />لا.............للظلم<br />لا.............للفساد<br />لا.............للتزوير<br />لا.............لأهانة الشعب"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909220109/http://masr.20at.com:80/article.php?sid=437&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

