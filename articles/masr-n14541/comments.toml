[[comments]]
order = 1
subject = "الاخوان - دعوة الى اللة"
author = "سنكوح"
text = "قرأت برنامج حزب الاخوان المزمع اقامتة<br />وبرنامجهم لا يختلف عن برنامج الحزب الوطنى<br />برنامج مبنى على الاقتصاد الحر الذى ليس فية للفقير مكان - ولا دور للدولة غير جباية الضرائب من شعب من المعدمين والفقراء والمساكين<br />فى الشعوب المعدومة الموارد كمصر لا غنى عن دور الدولة ودور الافراد والقطاع الخاص<br />انما دولة تترك مصير شعبها للمثتثمرين ييعملوا يمعملوش فهذا غباء وضياع للدولة<br />الدولة لازم تعمل مشروعات وقطاع عام يجر الاقتصاد وتسمح للقطاع الخاص بالاثتثمار<br />لم يعجبنى برنامج الاخوان للعمل كحزب<br />وافضل ان يظلوا جماعة دينية تدعوا الى اللة"
archived = "2008-03-10"
capture_url = "https://web.archive.org/web/20080310192750/http://masr.20at.com:80/newArticle.php?sid=14541"

[[comments]]
order = 2
subject = "الأخوان جماعة محظورة قانوناً"
author = "د. أحمد عزب"
text = "الأخوة المستغربين من القبض على اعضاء جماعة الأخوان المسلمين اقولهم ان السلطات اساساً متسامحة معاهم لأن الأنضمام لجماعة محظورة امر يعاقب عليه القانون واللي مش عارف هما ليه جماعة محظورة يقرا ازاي كانوا بيقتلوا السياسيين حتى قتلوا رئيس الوزراء المصري النقراشي باشا وفجروا القاضي الخازندار الذي حكم على قتلة رئيس الوزراء في الأربعينات وتم حظر الجماعة عام 1949 ورفعت الثورة هذا الحظر ثم رجعته تاني لما حاولت الجماعة الأستيلاء على الحكم عام 1954 وقتل الرئيس عبد الناصر. وعلى فكرة كل الجماعات الأرهابية اتت من رحم الأخوان المسلمين ومنها ابرز جماعتين الجهاد والجماعة الأسلامية اللي السيد عصام العريان كان عضو اساسي فيها. لو مش عايزين يتم اعتقالهم يا أما يسيبوا الجماعة يا اما يطعنوا في حظر الجماعة دستورياً اما خرق القانون فنتيجته معروفة مسبقاً..."
archived = "2008-03-10"
capture_url = "https://web.archive.org/web/20080310192750/http://masr.20at.com:80/newArticle.php?sid=14541"

[[comments]]
order = 3
subject = "هل تهرب الحكومة الى الخارج ؟"
author = "مراقب للاحداث"
text = "الدولة المصرية فى حالة شلل كامل<br />جرايد اليوم تقول<br />قتلى فى طوابير الخبز<br />الاطباء يستعدون للاضراب<br />حركة شلل فى وسائل النقل لعدم وجود بنزين ولا ديزل والسيارات متوقفة<br />عدم وجود ادوية والرجال يصرخون لعدم او اختفاء حبوب منع الحمل<br />ازمة فى الاسمنت والحديد<br />واحد من الشعب فى الاقصر يقول لنواب المجلس انة واولادة لم يأكلوا لحمة من 3 شهور<br />اين الحكومة<br />من يحكم البلد<br />العملية ماشية ازاى<br />من يسير حياة 70 مليون من البشر"
archived = "2008-03-10"
capture_url = "https://web.archive.org/web/20080310192750/http://masr.20at.com:80/newArticle.php?sid=14541"

[[comments]]
order = 4
subject = "وكنتم على شفا حفرة من النار فأنقذكم منها فاصبحتم بنعمته اخوانا"
author = "هذا رايي واله اعلم"
text = "قرات في كتاب للاخوان ان حسن البنا عندما جالس مع مجموعة من الشباب في بداية الدعوة اراد ان يسمي الجماعة الوليدة فتذكر الاية التي تقول وكنتم على شفا حفرة من النار فاصبحتم بنعمته اخوانا<br />وسماهم الاخوان المسلمون<br />يعني بيعة حسن البنا انقذتهم من النار<br />يعني جماعة تكفيرية<br />هذا رايي والله اعلم"
archived = "2008-03-10"
capture_url = "https://web.archive.org/web/20080310192750/http://masr.20at.com:80/newArticle.php?sid=14541"

[[comments]]
order = 5
subject = "اين قيادات الامة - نحن نغرق"
author = "uyt"
text = "القيادة الدينية مغيبة<br />لا يوجد قيادات سياسية فى الاحزاب<br />الحزب الوطنى اوصل البلد الى الخراب الكامل<br />الاخوان لا يصلحون لتولى الحكم<br />لا يوجد ضباط وطنيون للقيام بثورة مرة اخرى<br />هل نفتح احضاننا لاى احتلال قادم<br />الايام القادمة ستجعلنا مثل دارفور والصومال<br />ياشعوب العالم - مصر تريد خبزا - انقذوا الجياع"
archived = "2008-03-10"
capture_url = "https://web.archive.org/web/20080310192750/http://masr.20at.com:80/newArticle.php?sid=14541"

[[comments]]
order = 6
subject = "اصحاب العمم المائلة والنظام الفاشل"
author = "متعوس جائع"
text = "يختار النظام الفاشل لمن يتولون مشيخة الازهر مشايخ موالين ومسبحين بحمدة ويتحدثون عن الوئام والسلام ويمجدون الحاكم ايا كان<br />مشايخ بالبلدى كدة ما يملوش عين احد - تافهين بدون لون او طعم او رائحة زى النظام الفاشل تماما<br />والنتيجة انصراف الشباب عنهم وتوجههم الى الفتاوى على الفضائيات وسماع دروس الفضائيات ومحاضرات الفضائيات<br />والانجذاب نحو جماعة الاخوان<br />فسد الازهر والسبب النظام الفاشل ولا بد من يحل محلة<br />والاخوان ذهبوا والشباب معهم ليحلوا محل الازهر<br />اين مجلة الازهر التى كانت تتداول بين الشباب قديما - لا احد يقرأها الان لضحالة فكرها<br />الشباب يتجهون للاخوان بسبب النظام الفاشل مع الازهر"
archived = "2008-03-10"
capture_url = "https://web.archive.org/web/20080310192750/http://masr.20at.com:80/newArticle.php?sid=14541"

[[comments]]
order = 7
subject = "حزب ارنب نط الديمقراطى المخللاتى"
author = "غف"
text = "اوصلنا حزب ارنب نط الى الفقر الكامل ووصلت طوابير الواقفين لشراء الخبز من العباسية شرقا الى قصر عابدين غربا<br />الجياع لا يجدون رغيف الخبز<br />وحزب ارنب نط مسخر الامن والمباحث والدولة لانتخابات المحليات<br />وكان المحليات ومجلس الحاج فتحى سرور هتوفر رغيف الخبز<br />الافلاس للناس وصل للرأس<br />واقلية جالسة فى المنتجعات والشرم الشيخ يأكلون الجمبرى ويلبسون الشورت الاحمر ويصبغوا شعرهم ويمدون ارجلهم فى الشواطىء الازوردية<br />والبلد فى حالة فوضى كاملة وامس لم يكن هناك ديزل للعربيات والسواقين رفعوا الاجرة للضعف وتعطلت حركة الناس<br />لم يعد هناك بنوك ولا مصانع من بتوع عبد الناصر لنبيعها ونشترى بتمنها دقيق وخبز<br />بعنا كل حاجة<br />وبكرة والعياذ باللة اسود<br />ان حلت المشكلة اليوم هنجيب فلوس منين بكرة - اية اللى عندنا بينتج وبنبيعة ونجيب فلوس<br />الزراعة بعد ما باعوا مصانع الاسمدة - الزراعة خربت والارض بارت ومفيش اسمدة<br />الخطوة القادمة التى لا مفر منها لحزب ارنب نط هى اعلان مصر منطقة كوارث مثل الصومال و دارفور<br />فتح باب المعونات العاجلة للدول الخارجية لارسال القمح بالطائرات والقاء الاكياس على الناس من الجو<br />ثم ارسال قوات من الامم المتحدة لحماية الشعب من الامن المركزى"
archived = "2008-03-10"
capture_url = "https://web.archive.org/web/20080310192750/http://masr.20at.com:80/newArticle.php?sid=14541"
