subject = "و الله حرااااااااااااااااااااااااااام"
author = "ولاء"
posted = "2008-01-10"
text = "كل مسئول يفتكر اي حاجه يروح قايلها لنفسو ومنزل قرار بيها و احنا اللي نتعك فيها يبئا حرااااااااااااام و لا لأ و طبعا كان موقف بشع اول يوم نزلت فيي بعد القرار دا و المشاكل و الخناقات و الفكاهه اللي شوفتها اليوم دا خصوصا الصبح بدري و انا جايا الشغل و الرجاله اللي بيركبو عربية السيدات و السيدات اللي بتركب عربية الرجاله و اللي يشتم و اللي يغلس و اللي و اللي ............"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
order = 5
subject = "اسئلة ذكاء من المسئولين للمواطنين"
author = "عبير صلاح"
posted = "2008-01-10"
text = "الحقيقة مش عارفة ارد اقول اية ... دايماً المسئولين يحطو اسئلة صعبة علشان يشوفوا معدلات الذكاء وصلت لفين يعنى اية الحكمة من نقل العربيتين ومين المسئول يعنى قرار فردى ولا قرار مبنى على استقصاء من السيدات والبنات ومرتداين المترو لا اعتقد لانه لن يغير من سلوكيات المواطنين والمواطنات.. وبعدين دا محصلات طبيعية من اى مسئول مصرى يثبت انه عمل تطوير فى عهده حتى لو تطوير \" اهوج \" !! يعنى مش مهم يشغولوا المراوح والتكيفات فى عز الحر فى فصول الصيف مثلاً او يلزموا الناس بابواب الصعود وابواب النزول مثلا او يمنعوا الباعة الجائلين او المتسولين او يحسنوا الخدمة ويقللو التذكرة ....و اوو اووو .... آاااه لكن مهم جداً يحطو خطوط حمرا دايماً وابداً علشان نحل اسئلة الذكاء العالى بتاعت المسئولين ... ما شاء الله على ولاديك المسئولين النابغين فى حل المشاكل يا مصر"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
order = 6
subject = "ضع عنوان التعليق"
author = "د ميدو"
posted = "2008-01-10"
text = "لكن الاغرب من كده انك علشان تعد العربيات كان المترو مشى لكن الأول كان أول عربيتين للسيدات لكن دلوقتي الواحد يجيب المترو من أول ويبدأ العد علشان مايتلخبط أو على حد تعبيرك يا أستاذ خباب باشا و\"يخربط خرابيط\" يركب في العربتين الأولى والتانية بس ونخلى عم الحج اللي بنادى انه تم تحويل العربتين الرابعة والخامسة السيدات يقول أسهل \"بما ان هناك زيادة مفرطة فى عدد السيدات المتذايد يوميا تم تخصيص العربتين الأولى والثانية للرجال فقط ومن يخالف هذا القرار سوف يتم تعريضه للمسألة القانونية \""
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
order = 7
subject = "سيادة اللواء بتاع البيادة رئيس المرفق"
author = "بودى"
posted = "2008-01-12"
text = "ماهو رئيس المرفق سعادة لواء من الذين بيوظفوهم فى نهاية خدمتهم العسكرية لتخريب مرفق من المرافق المدنية-<br />الراجل طوال عمرة بتاع صفا وانتباة وللامام سر وللخلف در<br />مالهم ومال مرفق المياة والمواصلات والنقل ورؤساء الاحياء وحكام المدن<br />قلبوها معسكرات صحراوية باوامر غبية"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
order = 8
subject = "خباب بن الارت"
author = "مش لازم"
posted = "2008-01-12"
text = "كان خباب من المهاجرين الأولين وكان ممن يعذب في الله عز وجل<br />انا اول ما فتحت على الموضوع شدني اسم حضرتك<br />اسم صحابي جليل<br />اكيد ابوك كان رجل صالح علشان خاطر كده سماك باجل صحابة رسول اله صلى الله عليه وسلم<br />ادعي لوالدك"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
order = 9
subject = "المرررررج والاوبرااااااااااااااا"
author = "انا"
posted = "2008-01-23"
text = "في كل الاحوال سواء كانت العربيات في النص او في الطرف برضو بنتفعص وبنتبهدل ..خاصة عربيات السيدات ..اي نعم سهلت عليا اني اركب على طول بدل مامشي كل يوم مسافة طويلة لكن برضو المترو صعب جدا ..واصعبهم اتجاه المرج اللي بحس انه من اسوء المتروهات اللي موجوده ..سواء من جوة المترو او بره او حتى في مواعيد الوصول ..وبقول مش ممكن كم الفلوس والاعداد المهولة دي مش قادرين بيها يعملو مترو نظيف ...واستغربت اكتر لما روحت مترو الاوبرا وشفت الفرق البشع اللي بينو وبين مترو المرج وحلوان ..حسيت انه حاجة غريبة حاته كان هيجيلي اختناق من كتر النظافة .........واكيد هو ده سبب عدم تطوير المترو اللي عندنا ........."
archived = "2008-03-18"
capture_url = "https://web.archive.org/web/20080318110609/http://masr.20at.com:80/newArticle.php?sid=13755"
