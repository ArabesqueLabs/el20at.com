[[comments]]
order = 0
subject = "قرارات عشوائية"
author = "عشوائى"
posted = "2008-01-08"
text = "مسئول المترو المحترم اخذ قرارة البطولى بنقل عربات الحريم بناءا على حادثة وقعت وراح فيها خسائر وضحايا وناس اتعورت وماتت<br />حيث انة لما كانت العربة الاولى والتانية للحريم كان بعض السائقين الفاسقين يتركون كرسى قيادة المترو ويبصبصون للبنات والحريمات ويتركون اشارات المرور وينظرون الى الكعوب والنهود ويسرحون فى ملك اللة مما ترتب عنة حوادث قاتلة<br />من اجل هذا ومن اجل عيونهم الزائغة قرر صاحب القرار وضع عربات فى النصف بعيد عن السائقين الفسقة وسترهم بعيدا<br />ونحن نحيى اريحتة وشهامتة<br />كما ان بعض الاطفال كانوا يتركون امهاتهم ويذهبوا لمكان السائق ويلعبوا مهة الكوتشينة"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "عشوائية"
posted = "2008-01-09"
text = "يا سلالالالالالالالالالالالالام ..... هوه عشان السائقين فسقة وعنيهم زايغة ويدب فيهم رصاصة ... يبقى نشحتف الخلق ؟؟ طيب ازاى بقي ، طيب يعملوا بقى اختبار أخلاق وحسن سير وسلوك لسواقين المترو قبل ما يعينوهم ويشوفوهم عنيهم زايغة ولا لا ؟<br />دايما كده لما ما نعرفش نعالج المشكلة الأساسية نقوم نعالج المشاكل المترتبة علي المشكلة<br />وبعدين مين قال ان لما يبعدوا عربية السيدات عن السائق الاطفال هيبعدوا برضه ...ابدااااااا ، انا امبارح كنت راكبة العربية الاولي واتصمدت صحيح بس لقيتها فيها طفال برضه واشقيا جدا .<br />بس تعرفوا يا بنات جنسي كده احسن عشان لما يلبس المترو في المترو اللى قدامه نكون بعيد ، ولو يلبس المترو اللى ورانا في المترو اللي راكبين فيه يلبس في العربيات اللى ورا .. يعنى احنا بعيد ...خخخخخخخخخخخخخخخخ"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
order = 2
subject = "يا مترو خليك حنين"
author = "انا البرنس"
posted = "2008-01-09"
text = "المترو بتاع مصر ساعات بيمشى من غير فرامل - هو فية و احد فاضى يصلح الفرامل - وبيمشى احيانا بفضل بركة دعاء الوالدين والحريم الولايا اللى بيدعوا ان ربنا يستر<br />والمصيبة ان عدد عساكر الامن فى المحطات والمخبرين والامناء والسادة الضباط اكثر من عدد السواقين والميكانيكية وطواقم الاصلاح - وواقفين لا بيعملوا حاجة ولا محتاجة - بيبرقوا بغباء للى رايح واللى جاى وخصوصا لو كانت بنت حلوة<br />والاعطال على ودنة وقطارات بتتلغى وفى الصيف المكيفات خربانة<br />وبعدين عبدة بية مظهر اصدر فرمان موقع من ابو سلطانية بتغيير عربات الحريم لتكون فى النصف - طيب يا عبدة بية خليهم وراء خالص فى اخر القطار - يقول لك لا - لية - علشان نقرفهم شوية"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
order = 3
subject = "فوضي"
author = "إيمان نبيل"
posted = "2008-01-10"
text = "انا بقي هرصد من داخل عربه السيدات الجديده..قرات خبر نقل عبيه السيدات ..وبالتالي اول مره اركبه بعد التعديل بحثت عنها وسط العربياي اخيرا وجدتها ..ووجدت بجواري الساده الرجال قلت مش مشكله..اكيد لسه معوفوش..شويه ووجدت من يتحدث في الميكرفون السلام عليكم..قررت الهيئه نقل عربيه السيدات............ وعلي السادة الرجال مراعاه فروق العربيات والا تعرض للغرامه الماليه..<br />ربرغم ذلك لم يحرك ذلك البان احدا.<br />نظرت داخل العربات وهي مكتظه بالرجال وشويه بدا بعد الرجال يدركوا الحقيقه العجيبه..<br />وهم يتحدثون الي بعدهم هو العربيه كلها العربيات كلها بقت ستات ؟؟يعني اللي في النص واللي قدام..فرد الاخر وانا ايش عرفني شايفني انا اللي بسوق؟؟<br />بصراحه صعبوا عليا وكنت عايزه ابدد حيرتهم لكن قلت بعدين يعرفوا..<br />وشويه واحد بعد ما دخل وادرك انه وقع في عربه السيدات..بدات عليه علامات الخوف وكانه داخل عربه العفاريت..ومحتار يخرج يجري يمين ولا شمال..قلتله لا احنا في التانيه اجري شمال..<br />وواحده صحبتي قالت منهم لله هيجننو الناس(الرجال طبعا) الناس فعلا شكلهم مضحك ومبكي تخبط وتراشق بالالفاظ حتي وان امراه قالت دي عبت السيدات رد عليها رجل وقال انتي معقده؟؟<br />ةاخر طالب جويه يعلم من البدايه انها عربه السيدات..وبرغم ذلك اصر علي الركوب والجلوس وقال انا مش نازل ولما فشل زميله في اقناعه.وهم بانزول حلف ان هيقطع علاقته بيه لو نزل..<br />وانه مش نازل مهما حصل حتي لو دفعت الغرامه.."
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117042939/http://masr.20at.com:80/newArticle.php?sid=13755"

[[comments]]
