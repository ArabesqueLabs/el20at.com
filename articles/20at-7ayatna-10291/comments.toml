subject = "شعب يعيش رغما على كل شي"
author = "ابو حنين الكريماوي"
posted = "2008-10-19"
text = "ان هذه الظاهره بشعه ولاتعتبر مهنه لان الذي يمتهنها يجب ان تتوفر فيه الدرايه والدراسه والا ماذا يفعل الصيدلي في كلية الصيدله عندما كان طالبا .....لو الامور مثل مايفهمها باعة الرصيف لقرأنا على الدنيا السلام ..حتى الادويه في الصيدليات الاهليه تنقصها الشروط الصحيه في كيفية الخزن كذلك المذاخر وفي النهايه تحيه لهذا الشعب الذي يعيش رغما على كل الظروف التي تعيشها شعوب العالم"
