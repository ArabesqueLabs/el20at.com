[[comments]]
order = 1
subject = "واضح انك ضد العروبة وانك تكرة العرب جميعا وصهيونى"
author = "زفت عفاشة"
posted = "2008-03-13"
text = "من قال ان العروبة اتحاد واندماج ولهوايس تخرفها<br />هل صدقت انك كاتب واصبحت مفكر لمجرد انك كتبت مسلسل هابط او اتنين ازيعوا فى شهر رمضان وحققت بعض الشهرة<br />العروبة وحدة اهداف<br />دول مختلفة زى الاتحاد الاروبى كل دولة لها حكومتها ونظامها ملكى او جمهورى ولكن لها اهداف اقتصادية وسياسية وعسكرية تجمع كل الدول عليها<br />انت واهم وفكرك ضحل<br />العروبة نظام اقليمى للناطقين بالعربية ولا دخل للاجناس والالوان بها - زى الكومنولث البريطانى"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003206/http://masr.20at.com:80/newArticle.php?sid=14658"
