subject = "ولا خلاف مع رئيس الجامعة"
author = "Amr Azab"
posted = "2007-10-21"
text = "عميد طب الزقازيق السابق: تركت الكلية للعمل في السعودية.. ولا خلاف مع رئيس الجامعة<br />تلقت المصري اليوم تعليقاً من الدكتور عصام الدين محمد نور الدين، عميد كلية طب الزقازيق الأسبق، حول الخبر المنشور بالجريدة أمس، وأكد الدكتور عصام في رده أن رئيس الجامعة لم يطلب منه تغيير النتيجة لصالح ابنته.<br />وقال الدكتور عصام: لم يحدث علي الإطلاق أن طلب مني رئيس الجامعة، الدكتور ماهر الدمياطي، أي شيء يخص ابنته ولم يطلب مني أو من أي شخص تغيير نتيجة ابنته تحت أي ظرف أو بأي صورة وبشهادة جميع أعضاء هيئة التدريس بالكلية ورؤساء الأقسام لم يتدخل في أي شيء يخص ابنته، منذ التحاقها بالكلية منذ ثلاث سنوات وهي طالبة متفوقة ومجتهدة جداً بشهادة أساتذتها وزملائها.<br />وفي بداية شهر أغسطس الماضي بعد ظهور نتائج الكلية بشهر تقريبا، أرسلت لي جامعة أم القري عقدا للعمل بها وألحوا علي في قبولي العمل معهم، ولأنني عملت من قبل في مكة المكرمة لمدة خمسة أعوام ومرتبط بها معنويا وروحانيا ولي بها صداقات عديدة، فقد قبلت هذا الأمر، وتقدمت في 15 أغسطس الماضي بطلب إلي رئيس الجامعة بإعفائي من منصبي كعميد للكلية والموافقة علي إعارتي للعمل بجامعة أم القري، ولم يوافق رئيس الجامعة علي ذلك إلا لتحقيق رغبتي الشخصية للعمل بمكة المكرمة وبعد أن أوضحت له أن الكلية تزخر بالزملاء الأكفاء ذوي الخبرة التي تتيح اختيار عميد جديد للكلية من بينهم.<br />أي أن الموضوع بمنتهي البساطة أن جامعة عربية أرادت أن تستعين بأستاذ مصري للعمل بها للاستفادة من خبرته، ومنصبه هنا يمكن أن يشغله أي من الكفاءات العديدة، التي تزخر بها مصرنا العزيزة. ورئيس الجامعة حقق رغبتي الشخصية في ذلك وليس للموضوع أي أبعاد أخري<br />يا ايها الذين امنو اذا جاءكم فاسق بنبأ فتبينوا عسي ان تصيبوا قوما بجهالة فتصبحوا على ما فعلتم نادمين<br />والرد السابق نشر في المصري اليوم"
archived = "2010-03-14"
