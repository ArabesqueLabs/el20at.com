subject = "الشرقيه اول الزقازيق"
author = "مصطفي محمد مصطفي امين اسره فري"
posted = "2008-01-11"
text = "اولا :اود ان اعبر عن رائي بصراحه في هذا الموضوع وبدون تحيز يا ساده لماذا ينزل من شان نفسه وهو رئيس جامعه لعميد كليه عنده هذا اولا ثم وبحق ان الدكتور ماهر الدمياطي احد اعلام التعليم واهرمات مصر العلميه الشامخه فارجو ان لا نكثر من الشائعات التي لا يوجد لها اساس من الصحه ثم ان الدكتور ماهر الدمياطي ليس بيده ان يرفع درجه ولا ينزل درجه وهو بحق وكل طلاب جامعته التي تعلم بذللك انه لا ينحاز الا لصاحب الحق وانه ليس مضطر الي ذللك فكفي انها ابنه الدكتور ماهر الدمياطي رئيس الجامعه لو ارادو ان يرفعوا في درجاتها فمن الممكن ان يجاملوا الدكتور ماهر بدون وجه مباشر لاني اعلم كل العلم ان هذا الكلام ليس له اساس من الصحه واخيرا وليس اخرا فهذا رد اسره فريندز كليه حقوق الزقازيق<br />امين الاسره:مصطفي محمد مصطفي رائد الاسره:الدكتور :احمد عبد الحميد امين مساعد الاسره:احمد مدين"
archived = "2010-03-14"
