[[comments]]
order = 1
subject = "اعتذار الاهرام عن  ما نشر عن رئيس  الجامعة"
author = "شادي عبد الحكيم  كلية الزراعة"
posted = "2007-10-21"
text = "لا تجد الاهرام حرجا في ان تعتزر لرئيس جامعة الزقازيق الدكتو ماهر الدمياطي وابنتة ندي الطالبة بكلية الطب وكانت الاهرام قد نشرت مقالا بالامس تحت عنوان فراعنة صغار طلب فية كاتبة التحقيق في واقعة تغيير نتيجة الابنة من المركز 154 الي المركز الاول وهي قصة لا اساس لها بل ان الدكتور عصام نور الدين العميد السابق لكلية الطب قد كذب تلك الواقعة بالصحيفة التي نشرت تلك الاخبار الكاذبة وبالتالي فااننا نؤكد ان القصة التي اعيد نشرها بالامس قديمة ومختلقة وقد حدث رد مباشر في حينها من العميد نور الدين نفسة الذي لم يستقيل ولكنة طالب الجامعة بالموافقة علي اعارتة للعمل بمكة لظروف خاصة كما نوقشت القضية في برنامج حديث المدينة وقناة اوربت و برنامج 90 دقيقة وبمشاركة كل الاطراف وثبت عدم صحتة كما اتضح وقتها ان القضية مختلقة ولا اساس لها من الصحة فالطالبة نتيجتها علي الانتر نت ولم تتغير ولا صحة لتدخل رئيس الجامعة لصالح ابنتة اكد هذة الحقيقة الدكتور هاني هلال والمستشار يحي عبد المجيد والعديد من اساتذة جامعة الزقازيق و عميد الكلية السابق في اتصال تليفوني مع الاهرام ومرة اخري لا يجد الاهرام حرجا في الاعتذار حتي ولو كان علي راي لان ثوابت الاهرام كانت هي الصدق والموضوعية<br />ربما يكون هذا رد لاعتبار رئيس الجامعة وابنتة وتاكيد نزاهتهما في جامعة محترمة نفخر بوجودها علي ارض مصر"
archived = "2010-03-14"
capture_url = ""

