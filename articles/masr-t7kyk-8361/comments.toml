[[comments]]
order = 6
subject = "كيف تعيش سعيدا ؟"
author = "مجرب"
posted = "2008-03-01"
text = "نحن فى عصر حكومة ونظام حكم غير طبيعى - نظام تخلف عقلى وشيزوفرينيا وزهايمر حاد<br />يبقى حياتنا مش طبيعية<br />يعنى مفيش امل امام 99 % من الشباب انهم يحصلوا على شقة ولا فى المشمش<br />والحياة لازم تستمر<br />قلت لبنت الجيران حبيبة القلب مفيش غير سكة واحدة - لازم نتجوز فى غرفة فى شقة امى<br />والاوضة بتاعتى<br />يعنى عايزين سرير كبير بس<br />المطبخ بتاع امى<br />والسفرة بتاع امى<br />ونحن بأدبنا هنعيش مع امى<br />امها وافقت<br />وامى وافقت بشروط - هى لكم مطلق الحرية داخل اوضتكم اعملوا اللى انتوا عايزينة<br />لكن فى الصالة او المطبخ - يكون اللبس محترم - مفيش هزار ماسخ خارج اوضتنا<br />ممنوع استقبال ضيوف من خارج العيلة<br />الاولاد اللى هييجوا مسئولية ماما - تربيهم زى ما هى عايزة<br />امى هى اللى هتختار هناكل اية النهاردة والست زوجتى فى المطبخ تسمع تعليماتها بكل ادب وبدون اعتراض<br />وبعد سنتين من الزواج انا سعيد جدا<br />صدقونى ولا فى الاحلام<br />وزوجتى سعيدة جدا<br />لية ننفصل عن اهلنا فى شقة منفصلة<br />لية ما نبدأش معاهم<br />فكروا يا بنات ويا اولاد"
archived = "2010-03-14"
