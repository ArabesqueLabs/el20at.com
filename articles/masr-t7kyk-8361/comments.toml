text = "اولا اسلم علي نوووووووووفا , ازيك يا حاجه , بصبح او بمسي يا جميل ...... نلتقي علي الماسنجر ان شاء الله<br />امممم انا ليه اعتراض بس علي حته الراجل اللي بتعرفي انه بخيل ازاي<br />مثلا يعني ممكن في فتره الخطوووبه مبذر جدا وبعد ما الفاس تقع في الراس يبقي بخيل اعتقد انه مش من السهل معرفه الراجل البخيل<br />وبحي صاحب التعليق\" مش حيحصل \" جميل اوي التعليق دا بتفكرني بيارجال العالم اتحدووووووو<br />علي العموم السمك بيعرف يعوم علي راي اكرم<br />وسلام يا نفونتي فاصل ونواصل"
