order = 0
subject = "كيف تختار شريك حياتك؟"
posted = "2008-02-29"
text = "كيف تختار شريك حياتك؟<br />امضى عشرين سنه يدرس طبائع الشبان والشابات ، ويبحث عن صفات الشاب التي تنسجم مع الانواع المختلفه من البنات....<br />انه البرفسور ( والتر تومان ) كبير اساتذه علم النفس في الجامعه ( ايرلاجن ) بالمانيا ، حيث نشر نتائج ابحاثه في كتاب ضخم درس فيه تاثير حياه الاسره على شخصيه كل شاب وشابه ، وقال ان علاقه كل منهمافي طفولته باخوانه واشقائه تؤثر على شخصيته في شبابه. فالفتاه التي تبحث عن الثروه يجب ان تركز جهودها على الشاب الاكبر فانه ( عاده ) اكثرهم توفيقاونجاحا وهو عاده اقواهم شخصيه ، واقدرهم على فهم النساء.<br />واذا كانت تبحث عن الحنان فهي ستجده عاده في صدر شاب له اخوات اصغر منه سنا.<br />واذا كانت تبحث عن عريس ضعيف الشخصيه تستطيع ان تحركه كما تشاء ، فانها تجد هذه الصفات عاده في اصغر شبان الاسره ، فانه تعود على تلقي الاوامر والتعليمات ، ولم يتمرن على اصدارها !! والعروس التي تصلح لهذا الشاب عاده هي الاخت الكبرى ، ولانها تعودت ان تكون صاحبه الراي والسلطان !!!<br />واذا اردت ان تتزوج من عريس يهتم بها اكثر من اهتمامه بعمله ، فانها ستجد ان هذا العريس هو شقيق عدد من البنات الصغيرات ، مع ملاحظه ان هذا العريس لا يصل عاده في عمله الى قمه الجبل .<br />والعريس الذي له اخوات اكبر منه سنا هو شاب تعود على التدليل ، وخير عروس له هي فتاه لها اشقاء صغار اعتادت ان تدللهم وتعاملهم كاطفالها!! واكبر الشقيقات سنا هي عاده اقواهن شخصيه ، والشبان عاده يهربون من مثل هذه الفتاه ، فان الرجل يجب ان يكون هو السيد المطاع لا الكلب المطيع !!! واصلح عريس لهذه الفتاه هو شاب له اخوات اكبر منه سنا وتعود اطاعتهن !!!<br />والعريس الملائم لاصغر الاخوات هو اكبر اخوته ، فقد تعود ان يكون الحاكم بامره في البيت !<br />واخطر العرائس هي البنت الوحيده ، لانها عاشت مدلـله ، وهي عاده مسرفه ومحبه لنفسها ولا تحتمل النقد .... انها تتهرب الى بيت امها بعد اول خناقه مع العريس ، والرجل الذي يستطيع ان يكبح دلالها هو الشاب الذي تعود ان يكون سيدا !! فان هذه الفتاه تركع امام القوه .<br />وهذا ما قاله البروفيسور<br />م ن ق و ل وطبعا مو مقياس للاختيار"
archived = "2010-03-14"
capture_url = ""

