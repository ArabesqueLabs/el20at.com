subject = "مميزات العزوبية للبنات...."
author = "مش لازم"
posted = "2008-02-29"
text = "مميزات العزوبية للبنات....<br />1-تنامي براحتك وتتحركي في الفراش كما تشائين دون ان تخافي ان توقظي زوجك النائم<br />2-غطاء الفراش لك وحدك لن تستيقظي في منتصف الليل لتجديه اختفى<br />3-تستمتعين بنوم هادئ بدون صوت شخير مزعج<br />4-ريموت التلفزيون سيظل في يدك ......لك وحدك<br />5-اذا قمتي بتنظيف البيت فسيبقى على هذا الحال طويلا<br />6-يمكنك اكل البصل والثوم كما يحلو لك دون تردد لا نك نسيتي ان تشتري معطر للفم بالنعناع<br />7-اذا اصابك الغضب او الاكتئاب لدقائق وتفوهتي بأي شئ لن تجدي من يحلل كلامك تحليلا نفسيا ينتهي بضرورة عرضك على أخصائي<br />8-تستطيعين شراء اي شئ تريدينه مهما كان غاليا دون ان تسمعي العباره المشهوره ( هل كنتي بحاجه لشراء الاشياء التافهه التي كلفت ثروه)<br />9-لن تضطري لا ستضافة أصدقائه الذين يقضون السهره في الحديث عن ملكات الجمال والمذيعات<br />10-لن تضطري لمشاهدة جميع نشرات الأخبار وجميع البرامج السياسيه والبرامج الرياضيه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "مميزات العزوبية للشباب"
author = "مش ضروري"
posted = "2008-02-29"
text = ">مميزات العزوبية للشبـاب<br />> اولا : تنام على السرير براحتك زى الطيارة بدون ان يزقك حد او يوقعك على الأرض بتعمد<br />>ثانيا : مفيش ازعاج من المدام على اي صوت غريب او انها خايفة من الظلمة او اي شىء يقطع عليك منامك و راحة بالك<br />>ثالثا : تصيع زي ما انت عايز.. تطلع الصبح زي ما تحب و ترجع وقت ما تحب وتقعد مع من تحب, من غير ميعاد معين لرفع الشبشب<br />>رابعا : تتفرج على التليفزيون براحتك من غير المدام اللي بتموت فى هم و غم المسلسلات او برامج الطعام السقيلة<br />>خامسا : جعان؟؟ مفيش ابسط من كده.. اتلقح على اي مطعم و كل وجبة سريعة او حتى اطلب بالدليفري او حتى نام خفيف<br />>سادسا : الغسيل؟؟ سهل قوي.. غسالة فول اوتوماتيك او حتى هاف توماتيك تقضّي الغرض وتخلي غسيلك زي الفل و لا الحوجة<br />>سابعا : تلاقي وقت كافي لممارسة رياضتك المفضلة<br />>ثامنا والمهمة جدا : قرشك فى جيبك فى الحفظ والصون, بدون المحاولات المستميتة من المدام للاستيلاء على أموالك"
archived = "2010-03-14"
