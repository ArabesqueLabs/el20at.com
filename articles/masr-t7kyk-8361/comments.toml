[[comments]]
order = 3
subject = "نقابة اللي حب ولا طلش"
author = "مش حيحصل"
posted = "2008-02-29"
text = "نظرت من حولى وجدت هناك امرا غريبا، لقد وجدت انه لا يوجد احد الا وقد انكسر وانجرح من قصة حبه ومعظم الشباب بناتا واولادا درجوا تحت بند (اللى حب ولا طالش) و(اتقلبوا) شر (قلبة) واصبحوا (مقلوبين) كلقب لا رجعة فيه كان هو نتيجة قصة حب ملتهبة او تسلية من احد الطرفين او ان كان وقع تحت علاقة ثلاثية الابعاد التى تسمى (الحب من طرف ثالث) وما اشهرها هذه الايام لكن الا يحق لهؤلاء الـ(مقلوبين) ان تقوم الدولة بحمايتهم فما من شاب(مقلوب) او فتاه (مقلوبة) الا اضاعة فى الوقت وسرحان ليس له نهاية ونسيان الابتسامة وجرح القلب والكرامة ومعايرتها بانها اصبحت مقلوبة بدون ان يكون لها ذنب فى هذه القلبة القوية التى اجتاحتها.<br />لذلك ونيابة عن المقلوبين فى مصر اطلب او اؤمر الحكومة المختصة بانشاء نقابة خاصة بـ ( المقلوبين ) يطلق عليا ( نقابة اللى حب ولا طالش) وتعيين هيئة ادارية لم يتم قلبهم من قبل او على خبرة كبيرة باساليب القلب لحماية المقلوبين فى مصر ومحاولة تقليل هذه النسبة المرتفعة التى وصلت الى 180% وتقوم النقابة باحتواء جميع اللى حبوا وماطالوش على مستوى الجمهورية والاستعانة بسيدة عجوز تجلس مع كل عضو على حده وتعطى له النصائح المعهودة من السيدات الكبار مثل (ماتبكيش على اللى فرغ ماله ابكى على اللى اتوقف حاله) وبهذه النصيحة المباشرة يشعر الالعضو المقلوب بالحرج فى انه لسة (مابارش ولا القطر فاته)من اجل ان يجلس ويبكى على ماذهب انما يقوم بالبحث من جديد على من تعوضه عما مضى لانه لسة (بدارة) والعمر ادامه، ولا مانع من بعض التانيب والمعاتبة فتقول له (ماتبعش رخيص قال ماتتوصيش) وتتبعها بمصمصة شفاتها و(تزغده فى جنبه وتقوله ياما الناس قالولك وانت عاملى فيها فالح اوى) وتوفر ايضا النقابة جو ملائم لهم من حيث تعويض الحبيب المفقود بحبيب اخر يتم رد الاهانة اليه (قلبه) للحصول على نفسية سوية لدى الاعضاء ومن ثم يتم الشفاء، كما يجب تقديم محاضرات فى علم النفس والاجتماع توضح متعة الحياة بدون النصف الاخر فلا يوجد من يطلب هدية فى عيد الحب ولا عيد الميلاد ولا يوجد من يريدك ان تتذكر ميعاد اول مقابلة بينكما بالساعة والدقيقة وانت اصلا عندك زهايمر، وتوفير مشروعات لتضييع الوقت الذى كانوا يمضونه برفقة الحبيب وتعليمهم ان المقابل المادى العائد عليهم من المشروعات احسن مليون مرة من القعدة 6 ساعات على الكورنيش مع الحبيب وتضييع النقود فى اكل الترمس ومص القصب ، وعمل ندوات دورية والاستشهاد بامثلة اخرى لشباب تم قلبهم من قبل ونجحوا فى الخلاص من هذه الازمة وعرض تجاربهم على داتا شو كبيرة لزيادة الوعى وياتى فى النهاية صاحب التجربة لينهى الحلقة بمقولة تلخص كل هذه الدورات (اتجوز الارملة واضحك عليها وخد من فلوسها واصرف عليها) ،اذا تجرا الحبيب السابق وطلب العودة لا يهم فكل الحلول موجوده ويتم وضع برنامج خاص للرد على الحبيب السابق اللذى قلب العضو المقلوب بعنوان (خلى حبيبك على هواه لما ييجى اديله على قفاه)<br />واخر مرحلة بعد ان يعود العضو الى نفسيته الاولى وينسى ماحدث به ويكون قد اكتسب خبرات جديدة فى الحياة يتم عمل لقاءات خاصة بالاعضاء والعضوات ويتم استرجاع كل ما مضى من اجل التنكيد عليهم وتذليلهم بما فعلت معهم النقابة وتدفيعهم مقابل كل هذا.<br />لكن لا يجب على الاعضاء ترك النقابة الا اذا تزوجوا لعمل الاجراءات اللازمة لنقل الوراق الخاصة بكل عضو من نقابة(اللى حب ولا طالش) الى نقابة (المقهورين فى الارض) الخاصة بالمتزوجين والتى سنطالب بانشائها فى حديث اخر."
archived = "2010-03-14"
