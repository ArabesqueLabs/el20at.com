order = 0
subject = "سياسة الحكومة تشوية صورة الاخوان بعد ان اكتشفوا ان"
author = "مش معاهم ومش ضدهم"
posted = "2008-05-29"
text = "هذا السينارست ليس صاحب فكر او مفكر المعى انة رجل ترزى - تماما ترزى تعطية حدوتة يفصلها ويعمل حوار ويطلع مسلسل او فيلم والذى يعطية الحدوتة ليفصلها مباحث امن الدولة<br />فى انتخابات مجلس الشعب الماضية لو كانت الانتخابات نزيهة وليس فيها تزوير لكان 95 % من افراد مجلس الشعب اخوان<br />طيب الشعب بيحب الاخوان لية<br />لانهم ببساطة مش حرامية<br />وهل بتوع الوطنى حرامية ؟<br />طبعا - ثم اين هم بتوع الوطنى فى الشارع - نشاطهم اية فى الشارع - صفر<br />بتوع الاخوان عايشين فى وسط الناس بيحضروا افراحهم ويمشوا فى جنازات الغلابة ويقعدوا فى صوان العزاء حتى ولو كان عزاء لامرأة من عامة الناس وبياعة فجل<br />انما بتوع الوطنى بيمشوا فى جنازات عمر مكرم ويحضروا عزاء الكبار بس انما الغلابة طز فى ابوهم<br />الاخوان يملكون الشارع كلة<br />وهيافة الحكومة انها لما تعمل مسلسل علشان تشوية الاخوان - دا تفكير ساذج<br />وساذج جدا<br />وابقى قابلنى يا وحيد بعد ما تعكم العكمة وتحطها فى البنك"
archived = "2010-03-14"
