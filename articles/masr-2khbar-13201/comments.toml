text = "زرت المستشفى الحكومى فى بلدى<br />اقل ما يوصف بة انة زبالة او حظيرة مواشى او مزبلة<br />لماذا لا تقبل الحكومة ان يتقدم اهل الخير للتبرع لشراء سراير وملايات سراير واجهزة للمستشفى وتبييضة ودهان جدرانة وتغيير بلاطة حتى يصبح يليق بالاداميين<br />اذا كانت الدولة اعلنت افلاسها فلماذا لا تترك للناس فرصة التحرك لانقاذ ما يمكن انقاذة خدمة للغلابة<br />الخوف يحدث حينما يقبض امن الدولة على المتبرعين بتهمة انهم اخوان"
