text = "8) :o :-? :sigh:<br />اولا زى ما بيقولوا الريس عبد الناصر عمل مفاعل انشاص بقدرة 5 ميجاوات زى بتاع اسرائيل وقتها وزى بتاع الهند - حاجة كدة موديل علشان الابحاث<br />ثم ارسل الزعيم خالد الذكر العشرة الاوائل فى الثانوية العامة لنيل البكالوريوس والماجستير والدكتوراة من روسيا لسنتين متتاليتين وعادوا جميعهم يحملون الدكتوراة فى الطاقة النووية وهم اصل علماء مركز بحوث الطاقة النووية<br />ثم مات الزعيم ومات المشروع النووى وتقدمت الهند واسرائيل وعملوا قنابل ذرية<br />اما مصر فظلت بالمفاعل اللعبة ال 5 ميجاوات القديم قوى<br />حتى اشترى الرئيس مبارك مفاعل ابحاث قدرة 20 ميجاووات من كم سنة فاتت<br />وكل المفاعلات اللى عندنا ممكن تطلع شوية بودرة يستعملونهم فى ابحاث السرطان والعلاج<br />وانا كمصرى اتمنى ان يكون الخبر حقيقى ومستعد لفداء الحكومة بعمرى ان كان الخبر حقيقى وعندنا نووى<br />يارب يكون الخبر حقيقى - ولكن الامانى شىء والواقع المر شىء اخر<br />عندنا يورانيوم - لكن هم نشروا الخبر فى التوقيت دة لية<br />هل هناك مؤامرة تحاك<br />فية حاجة مبيتنها لنا زى العراق مثلا<br />ابتزاز<br />اللة اعلم<br />الامور ستضح ولكن الموضوع فية شىء مريب"
