subject = "نصاب"
author = "محمد احمد هلباوى"
posted = "2008-12-13"
text = "والله العظيم وهذا قسم امام رب العالمين ان هذا المدعو علاء حسانين ماهو الا دجال ونصاب وانا اعرفه عن قر ومالايعرفه الكثيرين عنه انه حرامى وناهب للاثار المصريه وناهبها بمساعدة كبار المسؤلين حسبنا الله نعمه الوكيل"
