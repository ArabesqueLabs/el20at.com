[[comments]]
order = 1
subject = "شيخ النصارى"
author = "على سهل"
posted = "2008-12-13"
text = "علاء محمد حسانين حاصل على دبلوم صنايع وهو من قريه تسمى(اسمو العروس)وهو ليس بشيخ ولا يحزنون ماهو الا احداللصوص المتخصصين فى سرقة الأثار المصريه وبيعها للدفيعه العرب امثال الخليجيين والمغاربه وهذا المشعوذ ماهو الا رمز للعصر الفاسد الذى نعيشه.....رحم الله الرئيس عبد الناص والرئيس السادات...هذا الدجال يعمل لحساب النصارى وممول منهم وحارس لكنائسهم ومرمم لها ومن العيب والحرام ان يطلق عليه لقب شيخ لأنه غيرصالح لحمل هذا اللقب العظيم...ندعو الله عزوجل ان يخلص مصر من هؤلاء الشياطين ولك الله يامصر."
archived = "2010-03-14"
capture_url = ""
