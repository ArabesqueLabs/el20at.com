subject = "أنا مع فكرة المقاطعة"
author = "واحد من الناس"
posted = "2008-07-01"
text = "أوافق الكاتب على أن المقاطعة بين الموالين والمعارضين قد انتشرت بطريقة كبيرة ومخيفة، ولكني أحب ان اضيف ايضاً، ان المقاطعة اخذت بعداَ \"سنياً- شعياً\" حيث قام السنة بمقاطعة محال الشيعة التجارية في بيروت تحديداً، وقد رأينا بأعيننا، كيف أصبحت المحال التجارية التابعة للشيعة خالية من الزبائن السنة....<br />أدعم فكرة المقاطعة، بل وأدعو لها، لانها سبيلنا لاستراد الحقوق الضائعة...<br />لن ننسى ما فعل بنا، ولن ننسى مواقف النخب المصرية التي وقفت ضدنا...<br />فكانت كلماتهم، والرصاص يخترقان صدورنا!!!!!!"
