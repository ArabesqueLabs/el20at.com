[[comments]]
order = 0
subject = "نقيبا للمحامين ام نقيبا للحرامية"
author = "محروق من المحامين"
posted = "2008-12-03"
text = "الا من رحم ربي<br />نقابة تحتوي سفلة ومجرمين البلد وحثالة القوم والمحامي لما يكبر شوية يكتب على الياقفه بتاعته<br />بالاستئناف العالمي ومجلس الدولة (يعني حرامي ونصاب ودجال على مستوى)<br />ولما يبقى حرامي اكبر يكتب على الياقفه بتاعته<br />(النقص والادارية العليا)<br />يعني تعالولي انا حرامي كبير اوي اوي اوي ونصاب ومحتال وماحدش يقدر عليا<br />الناس بتقول ان المحامي مهنة وحشه لانه بيدافع عن المتهم وهو يعرف انه غير بريء<br />دي حاجه تافهة جدا<br />تخيلوا ياجماعة لما توكل محامي في قضية ويبقى هو موكلك ويبيعك رخيص اوي اوياوي<br />اخص<br />اتفووووووووووووووووووووووووووووووو عليكم نقابةوسخه<br />وشاريهان الرقاصة كانت عايزه تشتغل محاميه والنقابة رفضت<br />ليه رفضت ما كلكم رقاصين ولاد وسخه<br />اتفووووووووووووووووووووووو عليكم نقابة وسخه حقيره"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235521/http://masr.20at.com:80/newArticle.php?sid=18707"

[[comments]]
order = 1
subject = "هذا الرجل فرقع لوز - ليس لة مبدأ ولا موقف - ويحب ا"
author = "مواطن من عامة الناس"
posted = "2008-12-03"
text = "هو يصلح ان يكون محامى ارياف فى بلدة ميت غمر - او كاتب فى جمعية زراعية يصرف للفلاحين التقاوى والمبيدات ويرش الدودة<br />وانصحة بالعودة السريعة الى قريتة فى مركز ميت غمر<br />فهو مجرد قروى ساذج بهرتة اضواء النوادى فظن انة شيئا فغلط فطول لسانة وانحبس ولة سوابق فهو خارج لسة من السجن يبقى ازاى يترشح وهو مفيش فيش وتشبية والا اية<br />وهو مثال واضح لفيلم الافاكاتو لعادل امام حيث كان يمثل شخصية المحامى حسن سبانخ"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235521/http://masr.20at.com:80/newArticle.php?sid=18707"

