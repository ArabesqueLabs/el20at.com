subject = "ربات البيوت شاركن في المظاهرة"
author = "مغربية مهتمة"
posted = "2007-10-12"
text = "هده المظاهرة شارك فيها حتى النساء بمافيهم ربات البيوت يعبرن عن سخطهن جراء ارتفاع الاسعار.<br />ايام الانتخابات تجد المرشحين يبداون بالفقير قبل الغني طبعا لان الطبقة الفقيرة هي الهرم الاجتماعي ولكن بعد ان<br />تنتهي الانتخابات اول من يدوسوهم باقدامهم القدرة هولاء الفقراء الدين انتفضوا ضد ارتفاع الاسعار وغلاء المعيشة."
archived = "2010-03-14"
