subject = "ضع عنوان التعليق مش دقيق"
author = "اكتب اسمك هناعابر سبيل"
posted = "2009-02-11"
text = "لماذا تقولون ليس هناك علاج؟ انا بقيت كذا سنة أعاني بسبب هذه الكلمة ولكن بعدين اكتشفت أن لكل حالات حب الشباب هناك علاج ولكن المهم انك تتعالج عند طبيب ولا تأخذ كلام الناس لان هناك اشكال كثيرة منه واسباب مختلفة، وانا حالتي كانت شديدة ومعقدة ولكن لها علاج وهو \\\"روأكيوتان\\\" وهو دواء غالي الثمن ويؤخذ بالفم ولمدة 4 شهور لكن الشفاء نهائي والحمد لله بس يجب متابعة طول العلاج لأنه مضر على الكبد والدم ويشوه الجنين للحوامل. نصيحتي لكم إذهبوا إلى طبيب محترف ومشهور وليس تقليدي لأن الطب الحديث فيه علاج مؤكد، واما الكلام المذكور أعلاه فأكل عليه الزمان وشرب."
archived = "2010-03-14"
