[[comments]]
order = 1
subject = ""
author = "التوريث فى التقرير"
posted = "2009-07-02"
text = "يتحدث التقرير عن الاصلاح السياسى والتوريث<br />ذلك رجما بالغيب<br />لا يستطيع احدا مهما كان بان يتنبا من هو الرئيس القادم<br />ذلك عند علام الغيوب يعطى الملك لمن بشاء<br />فلم يكن احد ان يتخيل ان السادات سيكون خليفة لعبد الناصر ولا مبارك خليفة للسادات<br />ولكنها المشيئة<br />وتلك الايام نداولها بين الناس<br />سيبوها للة ولا تشغلوا بالكم"
archived = "2010-03-14"
