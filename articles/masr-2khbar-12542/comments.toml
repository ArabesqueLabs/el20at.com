author = "يعنى اية استقرار"
posted = "2009-07-02"
text = "هو احنا كنا لسمح اللة بنفتح المدافع الرشاشة على بعض فى الشوارع وبنضرب بعض بمدافع الهاون وحى شبرا بيضرب العباسية بالراجمات وبعدين اخر النهار عربيات البلدية بتلف تلم الجثث من الشوارع وتدفنها فى مقابر جماعية<br />ابدا<br />ولم يحدث لا فى تاريخ مصر القديم ولا الحديث<br />الشعب المصرى شعب مسالم وطيب ومتحضر ولا يميل الى العنف اطلاقا حتى مع الاعداء<br />يعنى الانجليز احتلوا مصر ب 15 الف عسكرى سنة 1882 والفاطميون دخلوا مصر ب 3 الاف عسكرى واستولوا على الحكم وحولوا مصر الى دولة شيعية<br />الشعب المصرى طيب ومسالم وغلبان وعندة امن من اول الخليقة ومستقر فى ارضة الزراعية وبيزرع وبيقلع ومالوش دعوة باى حاجة"
archived = "2010-03-14"
