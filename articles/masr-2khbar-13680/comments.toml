author = "عبد الناصر والسادات"
posted = "2009-10-12"
text = "عبد الناصر وضع رهن عينية توصيل المياة النظيفة والكهرباء الى كل مكان فى مصر فقامت الوزرات فى عهدة بمد شبكات مياة الى معظم القرى فى البداية كانوا بيحطوا حنفيتتن او ثلاث حنفيات فى مدخل القرى تملىء الفلاحات منهم اوعية الشرب ووفر الكهرباء ببناء السد العالى<br />وفى عهد السادات وبعد ان تم بناء السد فى عصر ناصر انشأ هيئة كهرباء الريف وادخلت الكهرباء الى كل بيت فى قرى وعزب ونجوع مصر فتحية للسادات وتحية لناصر والان تم الغاء هيئة كهرباء الريف بعد ان اتمت مهمتها<br />اما موضوع المجارى فهو شىء مبالغ فية -- اذ ان العالم كلة يدعو الى استخدام السماد العضوى بدل من السماد الكيماوى والسماد العضوى يتكون من مخلفات البهايم ومخلفات البشر وخلطهم بالتراب واضافتهم للتربة الزراعية ومن زمان قوى متبع فى مصر ولا خطورة منة<br />المشكلة فى الصرف الصناعى ومخلفات المصانع الكيماوية التى ترمى فى النيل فهى مكمن الخطورة القصوى وفيها املاح ثقيلة كالرصاص تؤذى المخ والجهاز العصبى للانسان<br />اما محطات الكهرباء المقامة على النيل فتسحب كميات مهولة جدا من المياة وتستخدم فى تبريد المكثفات وتعود للنهر نظيفة"
