author = "دكاترة المكاتب"
posted = "2009-10-12"
text = "تقرا بين الحين والاخر تصريحات لبعض الدكاترة الجالسين فى المكاتب المكيفة عن تطوير الرى فى مصر<br />طيب يا دكتور نطورة ازاى - يرد عليك بجملة محفوظة مكررة من عشرات السنين ----- نلغى الرى بالغمر ونحول الى الرى بالرش<br />وطبعا اى فلاح بيقرا الكلام دة بيموت على نفسة من الضحك اذ ان الفلاح يعرف از رى زراعة المحاصيل غير رى ملعب جولف بالرش مثلا وهناك فرق كبير بين رى ملاعب الجولف بالرش ورى غيط مزروع بالذرة او القطن<br />فلو استخدمنا الرى بالرش مثلا فى محصول الذرة ونزل الماء من الرشاشات فى قلب لغلليغ عيدان الذرة فسوف يتعفن ويموت عيد الذرة فى الحال ولو رويت محصول القطن بالرش سوف تتناثر فصوص القطن الابيض وتسقط فى الطين وتتلوث ولا تصلح لاى شىء<br />ثم ان جو مصر جاف وليس رطب فستتبخر مياة الرش وتحتاج الى الرش كل يوم ونصرف مياة قدر الرى بالغمر خمسة مرات<br />الرى بالرش ينفع للخضروات والرى بالتنقيط ينفع لاشجار الفاكهة اما المحاصيل فلا يصلح لها غير الرى بالغمر<br />واسالوا الفلاحين قبل الكلام عن الرى ولا داعى لفتاوى دكاترة مكاتب لم تقم برى قصرية زرع فى حياتها<br />الحاج هريدى"
archived = "2010-03-14"
