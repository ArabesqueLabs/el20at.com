[[comments]]
order = 1
subject = "التحيز"
author = "محمد الحسينى"
posted = "2007-06-20"
text = "فعلاً المشكلة فى اننا لا نقبل بالخر واننا دائما على الصواب والاخر هو دائما على خطأ ولا يفهم اى شىء<br />المشكلة فى الاساس انه من ان جائت حماس وفتح لا تقبل بها ولا تريدها (مبدأ عدم قبول الاخر) وهذا هو الذى سبب كل المشاكل فعندما وجدت حماس ذلك اضطرت الى استخدام القوة مع اعتبار ان اسرائل وامريكا ومصر تعمل بجانب فتح (التحيز) وفتح تقول ان سوريا وايران والاخوان مع حماس (تحيز)<br />المشكلة هى فى كيفية قبول الاخر والاعتراف به ومناقشته اوالتعاون معه هى ثقافه غير موجوده فى العالم العربى ونميل دائما الى الحكم الديكتاتورى او قل ان شئت الحكم الفرعونى"
archived = "2007-06-20"
capture_url = "https://web.archive.org/web/20070620231811/http://masr.20at.com:80/newArticle.php?sid=10687"

[[comments]]
order = 2
subject = "الصحافه مش فتحه صدر يا ابنى"
author = "ملكش دعوة"
posted = "2007-06-23"
text = "لا حول ولا قوه الا الله ... للدرجه ديه الموقع مش لاقى حد يكتب فى زاويه المقالات فخلى واحد زى الهوارى يكتب مقال ... مش ممكن انا فعلا اتفاجئت يعنى انا فى الاول تصورت ان صورته نازله كإعلان ابحث مع الشرطه او ماشابه .. بس صعقت لما لقيت الصوره عشان هو كاتب مقال ...<br />طيب نقرا المقال ونشوف كاتب ايه ..<br />مبدئيا العنوان ... اول القصيده كفر يعنى يفترض ان ابسط قواعد المهنه بتقول ان المقال هو ارقى فن تحريرى و يفترض – لغايه ما قريت المقال ده – انه للكتاب الكبار فحسب او حتى اللى بيعرفوا يكتبوا ويوصلوا فكره معينه بكلام موجز يعنى المقال لو الواحد \" زهق فى نصه \" و ما كملوش يبقى الكاتب فشل ...<br />انما العنوان يجى على الصيغه \" البيئه ديه \" لا مش ممكن بس فعلا الاناء ينضح بما فيه ... اسلوب الحوارى والازقه مازال هو البطل<br />طيب انا قولت اكمل المقال بصراحه اصلى كنت مضايق شويه وعاوز اضحك فقلت ياله جاتلك حاجه تضحك عليها ...<br />المهم نخش فى الموضوع<br />بديهيا الكاتب المتمكن هو الى يقول بسرقه عينك من المقدمه للموضوع واتحدى انك تكون كملت الموضوع لو كانت المقدمه مش حلوه ... و طبعا مقدمه البروفسير الهوارى لا يمكن ان نقيس جمالها بمقاييس المهنه الطبيعيه لانها \" abnormal \"<br />جدا جدا يعنى هو الراجل كان عاوز يتكلم عن فلسطين – فى الزيطه يعنى – ما اى حد بيكتب اشمعنى انا – ده لسان حاله – فمش عارف يدخل ازاى فاكيد افتكر قعدت انس واحد صاحبه قاله فيها اعرف صاحبك وعلم عليه \" بالمطوه اللى فى جيبك \" فقال الله \" وجدتها \" هى ديه دخلت الموضوع - عافيه كده – واللى مش عاجبك فى الديسك ان هاغزه - !<br />ماشى كمل معاك ..<br />بعد كده جاب التايهه وقالنا ان فى ناس بتكتب مع حماس وناس ضدها – نورت المحكمه والله – احم هو لسه مطلع المطوه – طيب .. حلو طبعا نكمل .<br />و افتكس بعد كده ان فى 5 مقولات مرتبطه بتاييد حماس – هو عدهم خمسه عاجبكوا ولا لأ ... طيب واستفدنا ايه يعنى انهم خمسه ولا عشره .. الله الراجل بيقولكوا انه بيعرف يحفظ بدليل انه سمع الخمس مقولات ,.<br />طيب هو مش المفروض ان اهم عنصر فى المقال التحليل محللش ولو مقوله واحده ليه .. بصراحه اصله ميعرفش الا تحليل البول والبراز ...<br />احم ..<br />كونتيو<br />بعدين جاب خمس مقولات لتاييد فتح وبرضه قال بنفس اللفظ على المقوله الخامسه انها الاشهر .. فى الحالتين .. طيب غير الكلمه .. اه صح ...<br />هو اصلا عندك اطار مفردات قد ايه اصلا .. انا اسف<br />وبعدين ..<br />لا يا استاذ المقال – على اعتبار ان مقال يعنى – خلص ..<br />والنبى<br />طيب يعنى وبعدين .. انا استفدت ايه – لعله تسـآئل كل من قرأ المقال ...<br />لو انتى حد عصبى هاتتفع .. ولو كول .. هاتضحك وتكركر على الصحافه اللى عماله ترجع لورا ..<br />و اجمل ما فى المقال \" ملحوظه \" معلش فاكر نفسه فى بيذاكر لسه يا جماعه و خايف السؤال يجى فى الامتحان ...بيقولك بقى انا تعبت وسمعتلك 10 طرق عاوز تهيبر انتا براحتك وتفتكس عشره كمان .. ماشى<br />والموقع هاينشرهملك بس قول انتا تبع زعيم العصابه ...<br />واخيرا<br />تجلى الهوارى فى جمله رائعه<br />- تعرف صديقك من المواقف التي تمروا بها معا لتعرف أهو إلي جانبك أم إلى الجانب الأخر .. يعنى برضه تعرفه \" أهو – حلوه أهو ديه – إلى جانبك ولا هايسبك ويمشى لو شاف بنت معديه !<br />- الجمله جعلتنى اتسائل يعنى المقال لغته ايه لو هانصنفها .. عاميه اقرب للفصحى ام فصحى .<br />ولا ممكن نخترع تصنيف جديد انه لغه هواريه .. شويه فصحى وشويه عاميه<br />نصيحه بلاش تكتب وانتا معمر الطاسه قوى كده .."
archived = "2007-08-24"
capture_url = "https://web.archive.org/web/20070824211252/http://masr.20at.com:80/newArticle.php?sid=10687"

[[comments]]
order = 3
subject = "مش لازم عنوان يعنى"
author = "مش مهم خالص"
posted = "2007-06-24"
text = "انا عايزه اقول حاجه وهو انى الاستاذ الحقود اللى معلق قبلى بيقول لو زهأت من نصف المقال يكون الكاتب فاشل طب يا استاذ محضرتك قريت الموضوع كله اهو معنى كده ان الاستاذ احمد مش فاشل اضف الى ذلك انك لست ابراهيم نافع ولا جلال عارف عشان تسمح لنفسك انك تقيم اى حد وتاعب نفسك اوى على ايه كده وكاتب تعليقك ده كله اللى يفتقد لادنى مقومات الكتابه الصحيحه لانك فعلا انسان تحب الانتقاد لاجل الانتقاد وليس لانك انسان تحب ان تضيف جديد.<br />على فكرة كمان انت تافهه اوى وعشان درجة تفاهتك دى الاستاذ احمد رفض انه يعلق عليك وكمان لما نيجى ننتقد حد يا ريت يكون فى ذوق وادب مش تلبيخ وخلاص يا فاشل يا فاشل يا فاشل.<br />استاذ احمد انت شاب ومقالاتك لابد ان تكون بلغتك هذه فلا تتراجع لتصل رسالتك الى الشباب متابعين كتاباتك ولا تنصت لاشباه البنى ادمين وخاصة لو كانوا يريدون البحث عن هويه مثلما فعل الاخ السابق ذكرة فوقيه."
archived = "2007-08-24"
capture_url = "https://web.archive.org/web/20070824211252/http://masr.20at.com:80/newArticle.php?sid=10687"

