[[comments]]
order = 0
subject = "الدواء"
author = "حسب اللة"
posted = "2007-10-04"
text = "المثل الحكومى الشهير يقول جوع كلبك يتبعك قصدى جوع شعبك يتبعك<br />الطفل من الجوع راح المكتب بتاع الزقزوق يسال لية خصمتم من المسمى راتب اللى بناكل بية عيش حاف<br />هل قرأ الوالد الصمدية غلط<br />هل نسى ان يدعوا لرئيس الدولة بعمر مثل عمر نوح على المنبر وفى خطبة الجمعة<br />يا ايها الزقزوق لقد ضممت المساجدالاهلية كلها الى الاوقاف لتتولى انت الاعطاء والخصم والبصم<br />كما امم عبد الناصر المصانع انتم ولا فخر قد اممتم المساجد وجعلتوها قطاع عام<br />وعما قريب سيصدر فرمان من الباب العالى ببيعها الى مثتثمر رئيسى تحت الشروط<br />دفع رسوم خمسة جنية عن صلاة الصبح والعصر اما الظهر والعشاء ف 10 جنية والمغرب بالمجان منحة من السيد زقزوق<br />يا طفلى الغالى لا فائدة<br />عقابا لابوك على السماح لك بزيارة المكتب سيتم نقلة الى دنقلة عقابا<br />سلام"
archived = "2010-03-14"
capture_url = ""

