author = "المصرى افندى"
posted = "2007-10-05"
text = "لو انتا مسلم تبقى راجل قليل الادب متربتشى لان وزير الاوقاف عالم وراجل دين ولو كنت محترم كنت على الاقل تحترم نفسك فى كلامك لكن حقول اية ماهوا دة غرض الاخوان الاساسى اشاعة الفوضى والتشكيك فى العلماء"
