[[comments]]
order = 2
subject = "وزير اوقاف متفرنج"
author = "صادق شراب"
posted = "2007-10-05"
text = "انظر الى صورة الوزير منشورة واستنتج<br />الوزير صابغ شعرة وعامل نفسة شباب زى بقية بتوع الصبغة<br />الوزير مش باين فى قورتة اى علامة صلاة<br />لابس بدلة وحالق دقنة وشنبة وكانة وزير لصالة ديسكو<br />بيطلع علينا كل فترة والتانية باقتراحات غبية زى المؤذن الالكترونى وتوحيد الاذان واغلاق المساجد بعد الصلاة<br />اللى اختشوا ماتوا"
archived = "2010-03-14"
capture_url = ""

