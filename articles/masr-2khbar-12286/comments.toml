author = "الى المرشد"
posted = "2009-06-07"
text = "انا الحقيقة مش عارف انت مرشد في ايه<br />لما ربنا سبحانه وتعالى قال في القران<br />حتى اذا جاء وعد الاخرة جئنا بكم لفيفا<br />ولفيفا دي الشيخ الشعراوي قال انها تعني ان كل يهود العالم حيجوا فلسطين ولا يهودي حيبقى خارج فلسطين<br />وللامانة قال الشعراوي لننتهي من هذه المرحلة وتليها المرحلة القادمة<br />ليسوئوا وجوهكم ويدخلوا المسجد كما دخلوه اول مرة<br />ونحن الان في مرحلة حتى اذا جاء وعد الاخرة جئنا بكم لفيفا<br />المفروض بقا الفقهاء والعلماء يقولون لنا نتصرف ازاي في هذه المرحلة<br />اليهود كلهم راجعين فلسطين بنبوءة قرانيا<br />نتصرف ازاي يا فضشيلة المرشد"
