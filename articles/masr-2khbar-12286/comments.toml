author = "مجرد كلام حلو"
posted = "2009-06-07"
text = "طبعا كل الشعب عارف ان المشاكل هتنحل بخطاب يلقية اوباما وهو نفسة قال فى الخطاب ان الكلام دة مش هيحل المشكلة - لية - لان اسرائيل مش هتوافق<br />اسرائيل هى اللى توافق او لا توافق<br />اسرائيل هتوافق لية والدول العربية حولها شبة محطمة اقتصاديا وعسكريا<br />وانظمة عربية تعانى سكرات الموت ونايمة على السرير تحت قناع الاكسجين وتتحرك خطوات محدودة داخل قصورها ومن السرير الى طاولة الاجتماع لدقائق<br />نعم انظمة بتموت<br />الحل اللى يجبر اسرائيل على الموافقة هو القوة<br />لازم يبقى فية قوة اقتصادية تتبعها قوة عسكرية تجبر اسرائيل على الحل<br />تماما زى حرب 73<br />ابحثوا عن اقتصاد قوى اولا<br />ثم ابنوا قوة عسكرية محترمة - اسرائيل هتوافق فورا<br />لان اسرائيل لا تخاف الا من القوة<br />وتجربة حزب اللة وحماس احسن دليل"
archived = "2010-03-14"
