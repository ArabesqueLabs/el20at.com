text = "تصالح مع امريكا<br />امريكا بتمد يديها للاخوان<br />امريكا مع الاسلاميون وجعلتهم يحكمون فى العراق وفى افغانستان وهم يحكمون فى تركيا<br />وامريكا تتعامل معهم<br />والسفارة الامريكية اصرت على حضور الاخوان الخطاب بتاع اوباما<br />يعنى رد على الايدى الممدودة<br />افهموا شوية فى السياسة<br />ولما تحكموا لا تعلقوا ارجلنا فى الفلقة وتضربونا كل يوم"
