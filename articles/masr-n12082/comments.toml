[[comments]]
order = 1
subject = "الاسرة هى الااساس"
author = "واحد"
text = "البنت تمثل الاسرة التى تخرج منها<br />الرجل المحترم والسيدة المحترمة تكون بنتهم محترمة وحشمة وعارفة يعنى اية رمضان ويعنى اية صوم<br />امااللى بيروحوا الجامعة وكانهم رايحيين كبارية او حفلة زواج ووشهم ملطخ بكيلو بوهية من كل الالوان فهؤلاء من اسر غير محترمة او اصحاب ديانة اخرى يغيظون المسلمون فى شهر الصيام<br />وكل اناء بما فية ينضح<br />لكل ساقطة فى الحى لاقطة ان الطيور على اشكالها تقع"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 2
subject = "ربنا يهدى"
author = "ayat alla"
text = "رمضان فى الجامعة ليس بهذه الصورة الفظيعة فكما يوجد السىء يوجد ايضا المحسن<br />وبالنسبة للمنتقبة اللى جالسة مع الشباب ومافيش مانع شيك هاند اقول انها ليست منتقبة والله يسامحها على افعالها لانها تسيىء للمنتقبات فهى ترتدى النقاب شكلا وموضة وليست ترتديه عبادة لله عز وجل<br />لكن جملة اللهم انى صائم تتردد كثيرا بلا شك لان فى بنات لا تعرف ان رمضان هل هلاله ولسه عايشين حياتهم بطبيعة غريبة ربنا يهدينا ويهديهم جميعا"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 3
subject = "الفتاه التي ترتدي النقاب تجلس مع عدد من الشباب تضحك ولا مانع من \"شيك هاند\" بسيط،"
author = "واحد صايم"
text = "يعنى يا استاذة يا محترمة يا مسلمة وشاية نفسك بتنقلى تناقضات داخل الجمعة مفكرتيش للحظة ان التعميم والتخبيط فى المنقبات ملوش لازمة؟؟؟ وعلى العموم انتى تافهة واللهم انى صائم"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 4
subject = "مركزي"
author = "بيبو"
text = "أنا شايف إن الحتة بتاعة المنقبة دي ملهاش لازمة من كاتبة الموضوع .. لأنها مش موجودة ولو موجودة يبقى دي مش منقبة صح .. لإن المنقبة بيبقى عندها من الديانة ما يمنعها من إنها تختلط أصلا ..<br />وعلى فكرة الحديث بيقول \"إني صائم\" مش \"اللهم إني صائم\" لأن اللهم تدل على الدعاء والمقام مقام تقرير وليس دعاء، يعني تقرير أنك صائم فتذكر نفسك بهذه الكلمة"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
text = "أقل حاجة أقدر أقولهالك إنك مش صحفية أصلا...ولا عمرك حتكوني...<br />لو انت عندك أقل معرفة بالصحافة..أقولك بلاش...لو عندك أقل معرفة بأدب الإسلام وأخلاق الحوار مكنتيش هذا الكم من التفاهة والتدخل في شؤون الناس والحكم عليهم ولا كأنك ربنا...<br />قبل ماتتريقي علي المنقبة اللي بتسلم عالولاد, ولا عالبنات اللي لابسين بادي..افتكري قوله سبحانه وتعالي<br />\"يا ايها الذين امنوا لا يسخر قوم من قوم عسى ان يكونوا خيرا منهم ولا نساء من نساء عسى ان يكن خيرا منهن\"<br />وأخيرا, اللي تلبس نقاب حرة, واللي تلبس بادي حرة...شغل هيئة الأمر بالمعروف دة في السعودية اللي خلقت أمثالكم..مش هنا في مصر!<br />اللهم إني صائمَ!"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 6
subject = "الأسيوطي بك"
author = "الأسيوطي"
text = "مالكم يا جماعة بتهاجموا البنيه ليه كده هي عملتلكوا إيه بس لكل ده يا حقودين ورغم اني معترض جدا علي بعض مواضيعها ذي بدلة الرقص والانتقال فجأة لعمنا أبو العينين شعيشع ولا اعرف ما العلاقة بينهما لكن ما علينا ورغم كل ده الا انني اؤكد انها صحفية موهوبة جدا اقول هذا رغم اعتراضي على مواضيعها الساخنة."
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 7
subject = "ربنا يهدي"
author = "واحدةمنالناس"
text = "ربنا يهدي الجميع بس انا مش مقتنعة بالموضوع اصلا لان انا روحت جامعة قبل كده وملقتش حاجة زي كده<br />وبعدين انتوا كده سورة الاسلام يعني مكنش لازم حكاية المنقبة دي هو انتي موهوبة فعلا<br />ربنا يهدي الجميع"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 8
subject = "ضع عنوان التعليق"
author = "مش مهم"
text = "يا سلام عليكم بتعرفوا اوي انكم تواججهوا التناقدات وتدافعوا عن السلام بس لو حد صحفي قال حاجة هي صحيح بضر بالاسلام بس المؤسف انها موجودة في مجتمعنا وبنشوفها عوض المرة أأأأأأأأأأللللللللللللللللللللفففف...<br />يعني يارب يهدي البنات و الشباب و يعدي الشهر ده على خير ولو ان لازم نخاف ربنا في كل الشهوووووووووووووور و نتق الله شوية...<br />بس بالعكس برافو على الموضوع انا بحترمك و بقدرك انك ديما بتختاري مواضيع شائكة و ساخنة بس اللي بيجرح مش انها فيها كلام جارح على دينا ومجتمعنا بس اللي بيجرح و بيألم أكتر ان ده موجود فعلا في مجتمعنا... وماخفي كااااااان أعظم...<br />وكل واحد عارف أنا قصدي ايه و على رأي عادل الامام : اللي مافهمنيش يبقى أعمى...وياريت اللي مافهمش يخرج كده من الشارع و يبص وانا متأكده انه حيفهم...<br />بالتوفيق...<br />و رمضان كريم وان شاء الله سنة طيبة على كل المسلمين"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 9
subject = "بناتنا واخواتنا نحن فخورين بكم"
author = "مصرى"
text = "بتتكلموا عن بناتنا فى الجامعة - دول ازهار تقدر تقول حقل فل ابيض دول الشرف بتاعنا وهم كذلك<br />يا صحفية يا محترمة انا درست فى جامعة اوروبية - انت زعلانة علشان واحدة منقبة سلمت على زميلها سلام خفيف ولمس ايدها - انا شفت هناك بيلمسوا حاجات تانية - والبنات بتوعنا دول قطط مغمضة والمفتحة فيهم عندنا قفل موسجر قوى عندهم<br />مش هقول لك اية اللى كان بيحصل جنب اشجار حديقة الكلية والا فى دورات المياة والا فى الاسانسيرات بين الاولاد والبنات وجهارا نهارا ولا خجل<br />بناتنا ربنا يخليهم ويظلوا كدة واحنا بقينا فى دنيا كلها مليانة مفاسد والكمبيوتر والنت سهلت المسافات<br />ورات المياة"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 10
subject = "ضع عنوان التعليق"
text = "اولا شكرا علي التقرير انا شايف ان موضوع المنقبه ده حته زياده منك مش بيحصل واحنا في الجامعه وبنشوف ... الباقي كله تمام وبيحصل اكتر منه .... في نوعين من البنات مستفز جدا الاول اللي يلبسوا حجاب علي ما تفرج لابسه جينز رش ومعاه حجاب بصراحه ببقي نفسي اشده من علي شعرها بجد ربنا يهديهم بيدوا صوره مشوهه عن الحجاب .. .التانيه اللي تقولك اصل انا مش مقتنعه بالحجاب .. اصل امر ربنا مفيش حاجه اسمها اقتناع ده فيه سمع وطاعه .. اصله مش ماده اختياريه ده امر من ربنا ولازم تلتزموا بيه وربنا يسامح الدعاه اللي سهللكوا الموضوع ده ...وبالنسبه للولاد ما احنا لو سبناهم من غير ما نعبرهم ممكن يتعدلوا الموضوع عندهم منافسه كل واحده عايزه تثبت انها الاجمل االي لامه الشبابا حوليها<br />ربنا يهدي<br />zizo"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 11
subject = "يا بنت الحاج عبدالفضيل الكذب حرام في رمضان"
text = "يا بنت الحاج عبدالفضيل<br />فقرة المنقبة دي 1000% كذب لعدم معقوليتها لان مستحيل واحدة مغطية وشها ومستحمله النقاب حتعمل الحركات اللي انتي بتقولي عليها دي يعني لا مؤاخذه كذبة كبيرة<br />وعلشان خاطر ما نظلمكيش ممكن سكرتارية التحرير تكون هي اللي زودتها من عندها تمشيا مع سياسة الموقع وهي استفزاز القارىء"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
