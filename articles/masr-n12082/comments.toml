[[comments]]
order = 13
subject = "معلش اصلهم ميعرفوش"
author = "محمد"
text = "اولاً انا عايز اعرف ليه يا شريف يا دواخلي انت بتكره مروة كدا وعلي طول تدخل تشتم في مواضيعها بكام اسم متخلفين والكلام دا من زمان من ايام مكنت بتحضر اجتماع المراسلين في النقابة<br />ثانياً انا من جامعه القهرة وبشوف اكتر من دا من بعض المنتقبات وهما بين شده في الجهل وادعاء للدين وبين ناس تانية واخدين زي بس وسلكهم لا يعبر عنه باي صفه<br />مرة كنت قاعد في المدرج قبل محاضرة بنت منتقة قاعده ما اصحبها اللي منهم ولاد وبتفرجهم علي صور ومن باب الفضول بصيت علي الصور اللي بيتفرجوا عليها وبيمروا علي البنج طلع صورها وهي بالمايوا في الفيلا بتاعتهم<br />واكتر من مرة الاقي بنت منتقه او علي الاقل لابسه اسدال وبتهزر باديها مع الشباب عادي خالص وصتها عالي واكتر من مره حد يشوف مثال زي دا ويورح يكلمها بانن لا يليق بواحده تلبس الزي دا يكون هو دا سلوكها<br />وفي امثله كتير من دي بتدل انه موجود فعلاً ولو تحدثنا اعن لابس النقاب واخلاقهم لا تتناسب معاه فهنتكلم للصبح<br />التحقيق هايل يا مروة وصحفياً وفنيا ممتاز"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

