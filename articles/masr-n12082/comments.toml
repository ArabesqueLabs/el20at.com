[[comments]]
order = 15
subject = "الى الاخ محمد"
text = "يا اخي انا اللي هاجمت مروة عبدالفضيل وقلتلها يا بنت الحاج عبدالفضيل وانا والله العظيم ما شريف الدواخلي<br />وانا هاجمت حتة المنقبات دي لعدم معقوليتنا (فيه حاجه في القانون بالنسبة للمحامين اسمها الدفع بعدم معقولية الواقعة)<br />وكون ان واحدة تتنقب وتفعل افعال مثل هذه غير معقول وهما النصارى اللي بيقولوا الكلام دا علشان خاطر يسيئوا<br />للمسلمين والمنقبات وممكن المناقبة دي تكون نصرانية فانا مرة شفت واحدة منقبة ولابسة صليب في صدرها<br />واوجه نداء الى مروى عبدالفضيل انتي صحفية معروفة لكل الناس ما تعمليش لنفسك مشاكل مع الجماعات الاسلامية كده مش كويس عليكي"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 16
subject = "الفاتيكان يعترف باغتصاب راهبات من قبل قساوسة"
author = "برسوم المحرقي"
text = "الفاتيكان يعترف باغتصاب راهبات من قبل قساوسة<br />بابا الفاتيكان يوحنا بولص الثاني<br />اعترف الفاتيكان بصحة تقارير صحفية تحدثت عن انتهاكات أخلاقية في صفوف الكنيسة، وقالت إن قساوسة ورجال دين كبارا أرغموا راهبات على ممارسة الجنس معهم، وتعرضت بعض الراهبات للاغتصاب وأجبرت أخريات على الإجهاض.<br />وقال الفاتيكان في بيان له إن القضية محدودة ومتعلقة بمنطقة جغرافية محددة، لكنه لم يشر إلى هذه المنطقة الجغرافية، وكانت التقارير أكدت أن هذه الانتهاكات موجودة في 23 بلدا من بينها الولايات المتحدة الأميركية والبرازيل والفلبين والهند وإيرلندا وإيطاليا نفسها."
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 17
subject = "فيلم وثائقي يفضح تستر'بنيديكيت' على انتهاكات جنسية بالكنيسة الكاثوليكية"
author = "البابا شنوده"
text = "فيلم وثائقي يفضح تستر'بنيديكيت' على انتهاكات جنسية بالكنيسة الكاثوليكية<br />مفكرة الإسلام:نددت الكنيسة الكاثوليكية في بريطانيا لإذاعة فيلم وثائقي بثه برنامج أسبوعي في القناة التلفزيونية الأولى التابعة لهيئة الإذاعة البريطانية 'بي بي سي'.<br />واتهم الفيلم بابا الفاتيكان الحالي بالتستر على شكاوي انتهاكات جنسية ضد الأطفال، حينما كان كاردينالا.<br />لكن هيئة الإذاعة البريطانية دافعت عن الفيلم الوثائقي, واعتبرت حماية الأطفال قضية تهم الصالح العام بشكل كبير.<br />وقالت بي بي سي أمس الاثنين 2-10-2006 'إن برنامج بانوراما الأسبوعي الذي بث الفيلم اختار وثيقة شجّعت على التعامل بمنتهى السرية مع القضايا المتعلقة بانتهاك قساوسة للأطفال جنسياً وعدم عرضها على الرأي العام ,وقام 'بنيديكيت' بتطبيقها قبل أن يصبح بابا الفاتيكان, موضحة أن الوثيقة 'كُتبت عام 1962 وشرحت للمطارنة كيفية التعامل مع شكاوى انتهاك الأطفال جنسياً'.<br />وصرحت أن منتجي برنامج بانوراما طلبوا من الأب 'توم دويل' محامي الكنيسة الكاثوليكية السابق,- والذي طرده الفاتيكان لانتقاده الطريقة التي تعامل بها مع الانتهاكات الجنسية للأطفال - ترجمة الوثيقة. وأشار توم إلى أنها كانت سياسة واضحة للتستر على تلك الانتهاكات.<br />هذا ورفض أسقف مدينة بيرمنغهام فينسينت 'نيكولاس' ما ورد في برنامج بانورما وادعى' أنه مضلل برمته وملفق لأنه أساء التعامل مع وثيقتين للفاتيكان واستخدمهما بشكل مضلل كي يربط بين انتهاك الأطفال المرعب بشخصية البابا'.<br />وجدير بالذكر أنه تسبب تقرير مستقل أعد عن حدوث عمليات اعتداء جنسي متكررة ضد أطفال من قِبل الكهنة الكاثوليك في أيرلندا في أن يقوم بعض أعضاء البرلمان الأيرلندي بالدعوة إلى قطع العلاقات الدبلوماسية الرسمية بين أيرلندا والكنيسة الكاثوليكية في الفاتيكان، وذلك بالتزامن مع وعد قطعه وزير العدل الأيرلندي على نفسه أمام البرلمان بأنه سيعمل على استصدار قوانين جديدة تكفل حماية الأطفال من مثل هذه الانتهاكات."
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023232/http://masr.20at.com:80/newArticle.php?sid=12082"

[[comments]]
order = 18
subject = "المنقبات تانى"
author = "واحد معدى"
text = "على فكرة الموقع دة لايمثل الشعب المصرى او حتى الشباب المصرى والسبب واضح هوا تكاثف المتحدثين من الاخوان المسلمين فكل حوار بنشوفة فى الحياة بقدرة قادر يهاجموة بكل قوة ويحاولوا يفرضوا علينا الوصاية بالعافية وبيستخدموا الفاظ غيرمحترمة<br />بالنسبةلموضوع انقاب عاوز اقول لو حرامى حب يهرب من الشرطة ولبس نقاب يبقى النقاب وحش ؟ يعنى لو واحدة مش مقتنعة بالنقاب ودة موجود ولكن لاى ظروف لبستة وبتعمل حركات يبقى كل المنقبات وحشين ؟<br />بالطبع لا ودة اللى كاتبة المقال الموهوبة المحترمة حاولت وتوضحة ان واحدة محجبة ممكن تكون محترمة اكتر من واحدة منقبة بس دة ميمنعشى ان فية منقبات محترمات<br />يبقى اية لازمة الشتمة وطولت اللسان<br />يامسؤلين الموقع بجد الموقع دة كان كويس فى الاول بس دلوقتى لابد تنظفوا الموقع من الناس اللى عاوزة تفرض رائيها بالعافية<br />وشكرا"
archived = "2007-09-21"
