text = "مين قال يا ولاد ان المنقبات كلهم محترمات ده انا بشوف بعيني المنقبات وبيشدوا انفاس شيشة زي الحلاوة يا خي اتنيلوا علي عينيكوا فاكرين ان المنقبات دول ملايكة وشيوخ صح يا مروه ووالله انا بشوف اكتر من كده."
