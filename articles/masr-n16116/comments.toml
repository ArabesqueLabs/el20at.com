[[comments]]
order = 8
subject = "القاهرة"
author = "سالم ماضى"
posted = "2008-07-01"
text = "يا اخوة بلاش نتنازع فى كل شئ كدا<br />وبلاش نحكم على الصوفية بأفعال متطرفين منهم<br />الصوفية الحقيقية هى روح الإسلام<br />ونسأل الله ان قناة الصوفية تصحح مفاهيم غلط كتير عند الناس وتواجه تيارات الفتنة الموجودة وتوحد الأمة الإسلامية<br />وعلى فكرة أنا حاسس إن فيه صحوة صوفية موجودة ، وفيه اعتراضات كتير من الصوفية نفسهم على اللى بيحصل من مخالفات من متطرفى ومدعى التصوف .<br />ونسأل الله تبارك وتعالى أن يجمع الأمة الاسلامية على قلب رجل واحد .<br />وصلى الله على سيدنا محمد وعلى آله وصحبه وسلم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = ""
author = "امير سلطان"
posted = "2009-04-26"
text = "يا جماعه خلينا منصفين<br />السلفيه ملين الدنيا قنوات ومجلات ومواقع محدش اعترض وهمه اساسا ربنا الاعلم بيهم كفايه انهم في تفكرهم المتخلف .. اسهل حاجه عندهم التكفير او يخليك مشرك في لحظه او لو ملبستش لباس وجلبيه قصير تبقي أثم بالذمه مش دا عبط وهبل طيب ايه المشكله لما الصوفيه يبقي لهم قناه<br />يا اخي دا الشيعه لهم كذا قناه .<br />حد في مصر بئا شيعي ؟<br />واللي بيتشيع مش من القنوات من السيره الكويسه عن الشيعه زي انتصار حزب الله والغريب ان الناس كلهم فرحانه لهزمية اليهود والسلفيه زعلانين بالزمه اللي يزعل لهزيمة اليهود يبئا ايه وفوقت الحرب السلفيه يقولوا محدش يدعي لهم<br />ليه ؟ همه مش مسلمين زيهم زيك ومحدش يقدر يكفرهم طالما يبقولوا<br />لا اله الا الله محمد رسول الله<br />عيب بئه وبطلوا اجحاف"
archived = "2010-03-14"
capture_url = ""
