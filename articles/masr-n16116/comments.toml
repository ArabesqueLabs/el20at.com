[[comments]]
order = 6
subject = "فرق كبير بين الصوفية والدروايش والمعتزلة وكل الفرق المشبوهة ويبقى الاسلام الصافى البعيد عن الخرافات"
author = "دشنا البلد"
text = "تسمع جاهل يقول عن السيد البدوى القطب المجاهد<br />السيد من شباكة مد ايدة جاب الاسير من بلاد الخواجات بحديدة<br />يعنى تصور العامة ان السيد وهو جالس فى طنطا فى غرفتة مد ايدة من شبك حجرتة جاب الاسير من فرنسا مقيد بالحديد - هكذا<br />وينسوا هؤلاء المتدروشون الجهلة ان السيد البدوى حينما هجم الصليبيون على دمياط وتحركوا الى المنصورة بقيادة الملك الفرنسى لويس التاسع جمع السيد الفتيان من طنطا وحولها وخرج للجهاد ضد الصليبيين وعمل غارات وهجمات مرتدة على الجيش الفرنسى فكان يخلص الاسرى ويطلق سراحهم بالقتال والهجوم - ولذلك يطلق علية العامة جلاب الاسير وابو الفتيان - لم يعمل ذلك بالدروشة ولكن بالقتال والجهاد ضد محتلى البلد<br />وكذلك سيدى احمد الدسوقى من المجاهدين<br />اما فى فترة الضعف والدروشة<br />ففى قصة احمد عرابى فى التل الكبير قصة تدل على المسخرة والجهل<br />كان ضابط المدفعية يقف خلف 3 مدافع جاهزة للقتال ضد الانجليز ومر علية درويش ووضع علم على المدفع الاول وقال للضابط هذا مدفع سيدى البدوى وعلم على المدفع التانى وقال للضابط دى مدفع سيدى عبد العال وعلم على المدفع التالت وقال لة دى مدفع سيدى الدسوقى فسألة الضابط يعنى اية فقال الدرويش يعنى المدافع8 دى مش هتنهزم ابدا<br />وبعد ساعتين سقطت المدفعية الثلاثة غنائم للانجليز بدون طلقة واحدة<br />الاسلام واضح<br />وطريقة سهل<br />مفيش دروشة ولا صوفية ولا بيومية"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091203/http://masr.20at.com:80/newArticle.php?sid=16116"
