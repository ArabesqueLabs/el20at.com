[[comments]]
order = 2
subject = "كيف استطاع التصوف أن يحافظ على الإسلام في أفريقيا"
author = "ابومحسن"
posted = "2008-06-03"
text = "السؤال<br />كيف استطاع التصوف أن يحافظ على الإسلام في أفريقيا رغم جهود التنصير؟ وما هي المشاريع التي قدمها للناس؟<br />الإجابة<br />انتشر الإسلام في معظم أفريقيا وخاصة الأجزاء الشرقية والجنوبية منها بفضل السادة الصوفية، وعندما نتحدث عن الصوفية والتصوف في أفريقيا فإننا نتحدث عن أصحاب دعوة متكاملة كانت تعتمد على جهودها الذاتية، ولم يكن أهلها يتلقون أي دعم من أي نوع من أي جهة رسمية سواء في الدولة الإسلامية أو في الممالك التي كانت قائمة في هذه المناطق، واستطاع علماء الصوفة بإمكاناتهم المتواضعة أن ينشروا الإسلام في ربوع أفريقيا.<br />أما البرنامج الذي اتبعوه فإنه يبدأ من الخولة القرآنية، أي ما يعرف في العالم العربي بالكتاتيب؛ حيث أقنعوا الأهالي بإرسال أولادهم من الجنسين إلى هذه المدارس الصغيرة التي تبنى من العيدان والأخشاب، ثم بعد أن يكمل الطفل القرآن يبدأ في تلقي الدروس العلمية المبسطة في العلوم الشرعية واللغة العربية، وبعدها يكون داعية يرشد الناس إلى أمور دينهم.<br />وقد اتبع الصوفية إلى جانب ذلك نظام الطرق المعروفة؛ حيث ينتظم المريدون في سلك إحدى الطرق حيث يتلقون التربية الروحية المستقاة من أهل الصوفية القدماء، ويفتح المريد عينيه على بحر واسع من العلوم الشرعية والروحية.<br />وهذه الطرق هي التي حفظت للمسلمين في أفريقيا هويتهم الدينية، وبسببها لم يتمكن جحافل التنصير من النجاح في مخططاتها على الأقل في المنطقة الشرقية من القارة التي نسكنها."
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091203/http://masr.20at.com:80/newArticle.php?sid=16116"

