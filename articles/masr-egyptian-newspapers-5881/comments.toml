order = 0
subject = "نقل الكتب الكترونيا"
author = "محمد سليم حسين سلامة"
posted = "2007-12-16"
text = "الحل الامثل للقضاء على العفاريت تسجيل الكتب على السكنر وتطوير ها الكترونيا ووجود الكتب والمخطوطات والمشجرات الاصلية تحفظ فى خزائن مثل البنك المركزى وتفويت الفرصة على لصوص التاريخ بنشر هذة المخطوطات مباشرة داخل الدار على الكومبيوتر لكل من يريد المشاهدة نظير رمز لتطوير الدار وبالطبع اللصوص والعفاريت وحتى لوتم السر قة من على الكومبيوتر لن تسبب أزعاجا لأنها صورة وتسهيل نشر هذه المخطوطات والمشجرات التاريخيه لعامة الشعب لأنها جزئا من ثقافته والوزير فاروق حسنى لن تنساه مصر لأنة أيضا مابيخافش من العفاريت"
archived = "2010-03-14"
