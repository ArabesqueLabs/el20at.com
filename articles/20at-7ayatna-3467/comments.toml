subject = "حرام عليك"
author = "يارااجل"
posted = "2007-03-23"
text = "بقى ابوك كان عايزك تحفظ القرآن من صغرك وانت بتعاند ايه الجبروت ده يا خى يا ريت ابويا ضربنى من صغرى عشان احفظ جزء حتى .<br />وايه ياعم العداء اللى بينك وبين الادب الاسلامى ده يعنى قرأت واسلاماه مجبر وسيبت كتب محمد الغزالى وجريت ورا الروايات التانية ياعم اعصر على نفسك ليمونه تعال على نفسك شوية واقرأ واهو برضه حاجة جديدة .<br />انا مش بتصاد اخطاء لك والله بس انت اسلوبك عامل زى التلميذ اللى بيحكى هو عامل ايه فى المدرس الفلانى وضرب الناظر إزاى وعاكس المدرسة وهو مبسوط اوى من الحاجات دى بس عموما مقالك فى امور انسانية رائعة السرد"
