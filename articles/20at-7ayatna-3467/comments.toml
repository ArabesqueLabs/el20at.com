text = "بشكركم انكم فتحتوا الموضوع ده فذى مابيقولوا جه على الوجيعه<br />الحاله ماوصلتش لدرجه الكرهه أو العقوق لبابا _ لاسمح الله _<br />ولكن العلاقه فاتره او بمعنى أصح بارده<br />مش ذنبى ولاقصدى ولكن عصبيته المستمره وذعيقه خلانى أتجنب محادثه معاه<br />أو أكلمه فى مشاكلى ..... بخاف<br />وطبعا انا مش مستريحه وكنت اتمنى يكون لى أب حنين ذى مابشوف<br />لكن ده قدرى وربنا يصبرنى ويصبر كل اللى ذيى"
