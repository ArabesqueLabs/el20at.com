[[comments]]
order = 8
subject = "فالنصبر على آبائنا"
author = "ayat alla"
posted = "2007-04-28"
text = "رائع جدا هذا المقال والاروع منه عنوانه فلقد هزنى كثيرا عندما قرأته،ولك تقديرى بأنك لم تتلفظ بقول امام ابيك يزعجه بل كنت تفعل الاشياء التى كان يرديها منك وان كنت لا تحبها ولكنك سمعت كلامه فى نهاية المطاف،ولكننا معشر الشباب لدينا تمرد واضح ضد الراشدين من آبائنا واكابر عائلتنا،ولكنى لا انكر ان الاباء فى اوقات كثيرة يغالون على اولادهم ويشعرونهم بالذنب تجاه امور يمكن التفاهم فيها،ولكن فى نهاية المطاف نحن الصغار علينا طاعة الكبار لانهم لا يريدون فى النهاية الا ان يكون اولادهم افضل منهم فى الدنيا والاخرة.فلنكن ارحم بهم فى كبرهم واحترام رأيهم وتجنب مضايقتهم<br />ويحضرنى كلمة قالتهالى شيختى حفظها الله فى دروس فى بر الوالدين فقالت(يا ابنتى اعلمى ان الاباء عندما يكبرون يرجعون صغار مرة اخرى فيحتاجون مزيد من الرعاية والاهتمام والصبر عليهم فلا تنزعجى عندما تحدثك بصوت عال او تأمركى بشىء لاترغبيه فتمهلى عليها فهى كما كنت وانت صغيرة والايام ترد لكى الدين)<br />بالفعل اذا اخذنا الامور بتلك النظرة لن نسخط ابدا على ابائنا وسنكون اكثر الناس صبرا عليهم"
archived = "2010-03-14"
capture_url = ""

