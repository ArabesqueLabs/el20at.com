[[comments]]
order = 2
subject = "كلاب"
author = "مهتمه"
posted = "2007-10-18"
text = "الجيران اللي فوقي عندهم 3 كلاب كبار اوي، والراجل صاحب البيت مدلعهم وبيجيبلهم أكل بالهبل ولعب ويخرجهم ويفسحهم زي ما يكونوا ولاده، أول ما سمعت صوت الرعد أول حاجة خطرت على بالي ان الكلاب هجمت على صاحب البيت ونازله فيه قرم، وهو بيجري وعشان كده الحاجة عماله تقع وتعمل صوت فرقعة، والحقيقة كنت منتظرة نتيجة المعركة وباتمنى انها تنتهي لصالح الكلاب :-)<br />وعندي أمل ان صاحب البيت يلملم جراحه ويروح يودي الكلاب المفزعة دي في اي داهية ولا يقرمها زي ما قرمته ويروحوا المستشفى سوا<br />بس يا خسارة نأبي طلع على شونه وطلع في الاخر الصوت صوت الرعد<br />والكلاب قاعدة في اودتها (ماهو عاملها اودة) معززة مكرمة :sad:"
archived = "2010-03-14"
capture_url = ""

