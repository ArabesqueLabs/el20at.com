text = "شوية سحب وبتخبط فى بعضها ويطلع شوية شرار - خايفين من اية - لو الانسان عملة كويس ميخفش<br />انما من سوء اعمالكم وخوفكم من الموت اترعبتم<br />ياناس صلوا واعبدوا اللة<br />واعملوا خير<br />وادعوا لرئيس الدولة بطول العمر فى ليلة مفترجة زى دى"
