subject = "من اعتمد على غيره ذل"
author = "ابو اسامة"
posted = "2007-06-04"
text = "رحم الله الشيخ كشك وكاءنه يرى حالناامس واليوم فقد كان يقول من اعتمد على امريكا ذل ومن اعتمد<br />على روسياضل ومن اعتمد على عقله اختل ومن اعتمد على الله فلا ذل ولا ضل ولا اختل فقد اعتمد عبد الناصر<br />على روسيا وقد ضل ولو كان اعتمد على الله وامر بشن الحرب على هذا الكيان الاسرائيلى لما كان ما نحن<br />فيه اليوم ثم سلفه السادات بعد ان اعتمد على الله وامر بشن الحرب وانتصر اعتمد على عقله واختار سلام العميان<br />ولم يستغل النصر العظيم فى حرب اكتوبر وادى خلل عقله الى ما نحن فيه اليوم وقد اعتمد خلفه اللا مبارك<br />على امريكا وها نحن نجنى الذل اليوم ولم يعد لنا شاءن او كرامة. رحمك الله شيخنا فقد كنت ترى ببصيرتك مالم نراه ببصرنا"
archived = "2010-03-14"
