[[comments]]
order = 2
subject = "امستشفيات الحكومية - بكائية فى زمن الحزب الغير وطن"
author = "ش معبرك"
posted = "2008-11-28"
text = "الساعة العاشرة صباحا - ادخل اى مستشفى فى بلدنا - هتلاقى 3 الى 4 دكاترة موجودين فى المستشفى من اصل عدد 85 دكتور هم القوة العاملة والمعينيين على وظائف فى المستشفى - طيب باقى الدكاترة فين - فى عيادتهم الخاصة<br />يا حلاوة<br />ادخل عنبر المرضى<br />دراما من عصور السلطان قلاوون<br />كل مريض جايب قلة مية وحاططها جنب السرير يشرب منها ومع دخول البرد اللى جايب من بيتهم لحاف احمر او بطانية صناعة المحلة اللى بيضاء اللى سوداء واللى جايب راديو يسمع فية قرأن واللى مراتة جايبة مرتبة من البيت وفرشاها على الارض جنب سرير الحكومة ونايمة هى والعيال وحلل المحشى ولحمة الراس ورجول الفراخ بتتاكل<br />صدقونى منظر يعيدك الى ما كان يطلق علية البيرمستان ايام المماليك<br />طيب فين امكانية المستشفى<br />الادوية بتتسرق بين الصيادلة او بتتوزع على الحبايب<br />كلة بيتشفط<br />والاصل<br />ان كل عمارة بتنبنى فى البلد مش للسكن ودى من اسباب ازمة الاسكان نصف الشقق بتتحول عيادات لدكاترة بيكتبوا على اليفط بتاعتها الدكتور فلان حكبمباشى او رئيس قسم الولادة فى المستشفى الحكومى وهو ما بيرحش المستشفى الحكومى خالص وان اللى قاعد فى المستشفى الحكومى شوية العيال بتوع الامتياز<br />طيب احنا شاطرين فى اية<br />نصرف على المعتقلين والسجون اكل وشرب ولبس وعساكر حراسة بتاكل وتشرب وتنام وتركب مواصلات<br />فية 800 الف عسكرى امن مركزى بيلهطوا فى ميزانية الدولة<br />وفية ثلاثة ارباع مليون مسجون ومعتقل بياكلوا ويناموا على حساب صاحب المخل<br />وسلم لى على مجلس الكلام<br />واللى بيشرف على توزيع الميزانية<br />وعلى الادارة فى وزارة الصحة"
archived = "2010-03-14"
