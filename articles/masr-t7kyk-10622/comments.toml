subject = "البنية التحتية - عشرين سنة وانا اسمع ان الدولة بتص"
author = "ذاب اشر"
posted = "2008-11-29"
text = "يعنى اية بنية تحتية<br />طرق وكبارى ومدارس ومستشفيات ومدارس ومواصلات عامة - ذلك مفهوم البنية الاساسية فى اى دولة<br />انما البنية الاساسية فى مفهوم السادة اللواءات المحافظين هى ارصفة الشوارع<br />مثلا<br />اول ما يتعين لواء محافظ اول مشروع يعملة ان يهد حجارة الرصيف ويحط حجارة جديدة للرصيف<br />لية - مش عارف<br />والمصيبة يحط بلوكات خرسانة عالية العواجيز ما يعرفوش ينزلوا من عليها<br />وتتكرر تغيير حجارة الارصفة مع كل لواء محافظ جديد<br />يمكن انا متخلف عقليا فية احد يشرح لى معنى تغيير حجارة الارصفة اية ولية مع انها بحالة جيدة<br />وطبعا البلد بتتوزع على السادة اللواءات<br />فقناة السويس تدار بواسطة لواء بحرى تبع سلاح البحرية<br />ومحافظة اسيوط لواء شرطة<br />ومحافظات القناة ومرسى مطروح لواءات جيش ورؤساء اركان<br />ويمكن محافظتين مستشارين من العدل<br />وكلة ماشى فى تغيير التل توار او حجارة الرصيف<br />انما المستشفيات والمدارس والمواصلات والطرق فتلك قصص اخرى"
archived = "2010-03-14"
