subject = "أنذار"
author = "طبيب بس فى الخارج"
posted = "2008-11-27"
text = "أنا طبيب فى أحدى الدول العربية تركت البلد منذ 19 سنة لضعف حال الأطباء. مش ده الموضوع. الكلام عن أنتشار فيروس C فى مصر مش جديد ... ياجماعة الأخطر هو أنتشار مرض الأيدز فى مصر. والله العظيم شخصنا هنا مرض الأيدز فى والد أحد المصريين العاملين هنا وهو راجل كبير السن جاء لزيارة أبنه هنا وهو كان يعانى من حرارة غير معروفة السبب لمدة شهرين فى مصر وكان الأطباء فى مصر فقط يغيروله المضاد الحيوى طبعا لعدم وجود أى أمكانيات وخاصة وهو من (أرياف) محافظة جنوب القاهرة . وعندما وجدنا علامات لمرض الأيدزعليه طلبنا تحليل الدم وأخر ما توقعناه ( لأنه ليس من مجموعة الناس المعرضين لهذا المرض) وجدنا التحليل أيجابى وتأكد ذلك فى معامل وزارة الصحة هنا. وبسؤاله للوصول ألى سبب العدوى تبين أن السبب الوحيد أنه يتعاطى حقن فيتامينات كعادة كل المصريين وخاصة فى الريف. أنا أعرف وكل الأطباء يعلموا تماما أن غلى الحقن الزجاج (والأخطر البلاستيك) ما زال يجرى فى مصر وخاصة فى الريف. بل أن معدومى الضمير بيجمعوا الحقن البلاستيك من الزبالة ويغلفوها ويبيعوها تانى. الشىء الأخطر التانى هو عمل الغرز للجروح بأبرة وخيط موضوع فى مادة مطهرة ها يفة ومن مريض للتانى. والشىء الأخر أطباء الأسنان اللى بيستعملوا أدوات من مريض للتانى بدون تعقيم. وعلى فكرة هى دى أسباب أنتشار الفيروسات الكبدية فى مصر وبالتالى مرض الأيدز لأنه ينتقل عن طريق الدم . فمفيش حد يقدر يقول لا مش ممكن. التحذير ياجماعة من أنتشار مرض الأيدز فى مصر بشكل وبائى لا قدر الله وخاصة مع (عدم وجود) وليس فقط قصور الخدمة الصحية فى مصر. فأرجوا من كل واحد يخللى باله من هذه الأشياء الخطرة. وربنا يستر علينا كلنا .. اللهم قد بلغت....اللهم فأشهد..."
archived = "2010-03-14"
capture_url = ""

