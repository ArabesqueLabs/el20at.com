[[comments]]
order = 4
subject = "سيبك من الشكل"
author = "طبيب بس فى الخارج"
posted = "2008-11-28"
text = "خلينا نتكلم كلام علمى وبلاش المكلمة اللى أحنا عايشين فيها والحكومة خليتنا نكلم نفسنا زى المجانيين وهم سدين ودانهم. نحن ليس لدينا (نظام صحى) يعنى هدف وخطة للوصول للهدف وأستراتيجية كما فى كل شىء. أحنا عندنا عشوائية كما فى كل شىء. المستشفى أصبح عبارة عن مبنى والعمل فيه عبارة عن لعبة عسكر وحرامية. مفيش حاجة أسمها علاج مجانى. المسئولين بيفتحوا أقسام بأجهزة مستلفينها من هنا ومن هنا يتصوروا معاها وبعدين يغلق القسم أو يعمل برجل حمار. كل شىء المريض بيدفعه. وأحيانا التحاليل تجرى فى خارج المستشفى فى معامل ناس معينين. وكذلك الأشعة والأدوية. المريض بيسلك نفسه مع التومرجية والعمال والتمريض. الأطباء لازم يهربوا لأن مرتب الطبيب اللى أهله صرفوا عليه دم قلبهم لا يكفى لمجرد العيشة الكريمة المستورة.<br />المستشفى بتعتبر المريض الغلبان على أنه مصيبة والمريض الغنى كسبوبة .<br />ليس هناك نظام صحى كالمتعارف عليه دوليا: لا يوجد نظام أسعاف محترم من أول الأتصال للوصول السريع للأفراد المدربين للتجهيز الحديث. لا يوجد أقسام طب الطوارىءمحترمة. لا يوجد معمل أو أقسام أشعة مجهزة. لا يوجد نظام للوقاية من المواد عالية الخطورة أو الأخطار المهنية مثل أستعمال دواء أو غاز مكان أخر. لا يوجد نظام للوقاية من العدوى داخل المستشفيات. لا يوجد نظام للتخلص من النفايات الخطرة بالمستشفى. لا يوجد تجارب أفتراض توقف الكهرباء أو التعامل مع الحريق أو الكوارث الطبية. لا يوجد نظام لتدريب شباب الأطباء اللى هم نتاج جامعات ونظام تعليم متخلف.وزارة صحة مترهلة ونصف العاملين بها موظفين ليس لهم فايدة. عدم وجود كونترول على وصف الأدوية. أى حد يوصف أى حاجة والنتيجة فشل كلوى وأطفال معوقين.الرعاية الصحية الأولية عبارة عن أستراحات ومكاتب تطعيم وأستخراج شهادات مواليد ووفيات..... كفاية !!<br />الحل: أولا الأعتراف بالمشكلة. ثانيا بناء (نظام صحى سليم) مثل كل دول العالم المتحضرة.<br />منين: بناء نظام تأمين صحى مش تبع الحزب الوطنى للتصوير لكن بواسطة ناس محترمين بحيث يعالج المريض ويدفع نسبة من العلاج( وهو أصلا بيدفع الأن)<br />أخيرا التوقف عن الكلام اللى صدعنا والعمل أن كنا فعلا عاوزين مستقبل وألا حتكون بلدنا عبارة عن خرابة موبوئة بكل أنواع الأمراض وأحنا لسه بنكلم نفسنا..."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "لو كان فى يدى لارسلت بلدوزرات لازالة مراكز الموت و"
author = "اة"
posted = "2008-11-28"
text = "الحل الوحيد لمصلحة الناس الغلابة هو الازالة<br />بلدوزر يشيل كل القرف دة<br />والاهالى زى ما بيتعاونوا فى بناء المساجد يتعاونوا فى بناء مستشفى خاص بمدينتهم او قريتهم ويعملوا اعلانات ويعينوا الدكاترة الاكفاء فى مستشفياتهم ويعطوهم اجر معقول واللى ميشتغلش يروحوة ويجيبوا غيرة ويعينوا مجلس ادارة للمستشفى من الاهالى وليس اطباء<br />الطبيب لا يصلح ابدا ان يكون مدير<br />فى دول الخليج مدير المستشفى شخص ادارى يشرف على الحضور والانصراف والنظافة والمطابخ والاطعمة وسير العمل والمشاكل الطبية يتولاها الاطباء ورؤساء الاقسام<br />فشلت الدولة او بالمعنى الصحيح لا يوجد دولة لا فى التربية والتعليم ولا فى الصحة<br />الناس تدور لنفسها عن حل<br />فيا جمعيات اهلية تحركوا"
archived = "2010-03-14"
