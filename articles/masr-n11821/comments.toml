text = "ومن النكد ايضا ان يعينوا وزير للاوقاف متزوج من المانية وبينة وبين الاسلام اميال واميال بحجة انة متنور ومثقف ومتزوج المانية ويدعوا الى زيارة القدس وكان القدس مفتوحة للركع السجود ولا يشاهد الفلسطيني واقف وممنوع من الدخول الى باحة المسجد<br />كلهم مزمر ومطبل للتطبيع والتنصير وبيحبوا الغرب قوى<br />وكلهم طابور خامس ضد الاسلام<br />يعنى كل من تزوج من اجنبية موظفة فى الموساد او المخابرات البريطانية يرقى ويعطى الوظائف القيادية فى هذا البلد المنحوس"
