subject = "تشجيع التنصير بفتوى : مفتي الديار المصرية  و مفتي"
author = "اكتب اسمك هنا"
posted = "2007-10-09"
text = "تشجيع التنصير بفتوى : مفتي الديار المصرية و مفتي الممثلات .<br />الحمد لله والصلاة والسلام على رسول الله .<br />بدأنا ندافع عن لا اله إلا الله . كما كان الإسلام في مهده .<br />تلك مصيبة لم نكن نتوقعها .<br />فقد فاجأنا الإعلام بفتوى متزامنة من المفتي و عمرو خالد , يقولان بملء شدقيهما :لا عقوبة في الدنيا على من يترك الإسلام إلى دين آخر !!!!!!!!!!!!!!!!!!!!!!!!!!!<br />=== فعملا بعكس حديث النبي –صلى الله عليه وسلم ( لأن يهدي الله بك رجلا واحدا خير لك من حمر النعم )<br />فصارا عونا لمن يريد أن يترك الإسلام بتيسير الطريق على من يوسوس له الشيطان بترك الإسلام , فصارا عونا للشيطان على نفسه الضعيفة . فكم من الذنوب سيحملون إلى يوم القيامة لأجل بضعة دولارات و لأرضاء اليهود و النصارى ؟؟؟.<br />== قال الله سبحانه وتعالى ( من كان يريد العزة فلله العزة جميعا إليه يصعد الكلم الطيب و العمل الصالح يرفعه و الذين يمكرون السيئات لهم عذاب شديد ومكر أولئك هو يبور ) و ( استكبارا في الأرض و مكر السيئ ولا يحيق المكر السيئ إلا بأهله , فهل ينظرون إلا سنت الأولين فلن تجد لسنت الله تبديلا ولن تجد لسنت الله تحويلا )( فاطر 10 و 43 ).<br />== لقد صدرت الفتوى في أمريكا , و أعلن عنها في الجريدة الأمريكية ( الواشنطن بوست ) و نقلتها الجريدة المصرية ( المصري اليوم ).<br />ولقد ظهرت فتواهما في جريدة مشبوهة ( المصري اليوم ) في أول أغسطس سنة 2007 , ثم لحق بهما المدعو الدكتور يوسف القرضاوى , في نفس الجريدة في عدد الخميس 23 أغسطس من نفس العام , وقال بعدم قتل المرتد , ولكنه يجب عليه الا يجاهر بالردة لئلا تحدث فتنة ؟؟؟ وهو صاحب سوابق خطيرة في السباق المحموم مع عمرو خالد و المفتي في مداهنة اليهود والنصارى بتحليل ما حرمه الله طلبا لرضاهم ونقودهم ,فسافر الى فرنسا في أزمة الحجاب ليفتى للمسلمين هناك بشرعية خلع البنات المسلمات للحجاب في بلاد المسيحيين , و في بداية حرب العراق أفتى للجنود المسلمين في الجيش الأمريكي بشرعية المحربة مع الجيش الأمريكي ضد المسلمين في العراق , تماما كما فعل ( السيستاني ) و أفتى بتحريم محاربة الشيعة للجنود الأنجليز , لأنه يعيش هناك .!!!!!<br />== ذلك المفتي الذي جاءونا به , وهو لم يتخرج من جامعات الأزهر ,بل هو كما قرأنا عنه حاصل على بكالوريوس التجارة !!!!!!!!, وعمل ملحقا بالسفارة المصرية في باريس !!!!!, وتزوج فرنسية , ثم ألبسوه العمة الأزهرية ليضعوه على عرش الفتوى الإسلامية في مصر , ويتقاضى أربعة آلاف جنيه في الساعة في التليفزيون !!!!!!!!!المبتسم الضاحك دائما بمبرر و بدون --- الدكتور ؟؟؟؟ علي جمعه .<br />==== و رفيقه في الدرب : مفتي الممثلات و المغنيات المعتزلات , يأمرهن بالعودة إلى التمثيل و الغناء قائلا لهن أن في يوم القيامة ستقول الملائكة لهن : ادخلوا الجنة بفنكم ؟؟؟ والحاصل على شهادة الأيزو الأمريكية في سنة 2006 أنه الداعية الإسلامي بالأسلوب الأمريكاني ( هدم الإسلام من داخله )وهو رسول المخابرات الأمريكية إلى مصر منذ التسعينيات .<br />= و قد اعتمدا في فتواهما على تفسيرهما الكاذب لثلاث آيات من القراّن الكريم :<br />( لا إكراه في الدين ) و ( فمن شاء فليؤمن ومن شاء فليكفر ) و ( لكم دينكم ولى دين )<br />=== و الشيطان فقيه في الشر , فيبرر لهم الكفر بآيات من القراّن , يفسرونها على هواهم بوحي الشيطان .<br />و الآية الأولى تعني : لا تجبر الكافر على الإسلام . والثانية تعني التهديد لمن يكفر , ويقول الله فيها للكفار ( انا أعتدنا للظالمين نارا أحاط بهم سرادقها ) والظلم في القراّن يأتي بمعني الشرك بالله والكفر – كما قال تعالى في سورة لقمان ( إن الشرك لظلم عظيم ). و الثالثة تعني البراءة من دين الكفار تماما .فهل فيها آية تتعلق بترك الإسلام إلى الكفر ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />===== وهل يوجد دين آخر إلا الإسلام - يا أهل القراّن ؟؟؟<br />لقد قال لنا الحق سبحانه و تعالى إن الإسلام هو دين كل الأنبياء من قديم الزمان إلى اليوم , وأمرنا قائلا :<br />( إن الدين عند الله الإسلام ) و (_ ومن يبتغ غير الإسلام دينا فلن يقبل منه وهو في الآخرة من الخاسرين )<br />=============== و السؤال :<br />من هو الذي يترك دين الاسلام ؟<br />انه المرتد .<br />و قد سبق أن أوضحت في ردي على شبهات النصارى أن كتاب التوراة الذي بأيدينا ( العهد القديم ) فيه عدة أوامر من الله بقتل كل من يرتد عن دينه أو عن التوحيد أو يعبد غير الله ( تثنيه 13 و 17 ).<br />و سار على هذا الهدى المسيح حيث أمر أتباعه باتباع كتاب موسى بالحرف, بحفظه و تنفيذ كل ما جاء فيه عمليا – مرتين : الأولى في (إنجيل متى 5: 17 ) حيث قال ( لا تظنوا أنى جئت لأنقض الناموس ( التوراة ) و الأنبياء ( الزبور و نبوات الأنبياء ) ما جئت لأنقض بل لأكمل , الحق أقول لكم إلى أن تزول السماء و الأرض لا يزول حرف واحد أو نقطة واحدة حتى يكون الكل ) و ( الكل ) هو الإسلام . و المرة الثانية أوضح منها في<br />( إنجيل متى 23: 2 ) حين قال لكل أتباعه ( على كرسي موسى جلس الكتبة( الذين يحفظون التوراة ) و الفريسيون ( العلماء العاملون بالتوراة ) فكل ما قالوا لكم أن تحفظوه ( من التوراة )فاحفظوه و افعلوه (عمليا)<br />و لكن بحسب أعمالهم ( التقليد أو التلمود وهو البدعة )فلا تعملوا ) أي يعملوا بما أنزل الله في التوراة حرفيا , وفيها رجم الزناة و قطع رقبة المرتد و حرق الساحر و تعدد الزوجات وزواج المطلق ...الخ .<br />و للعلم فان اليهود والنصارى يقتلون المرتد منهم – ليس علنا و لكن غدرا – و أنا كنت منهم و أعلم ذلك تماما .<br />و جاء ديننا الحنيف , ملة إبراهيم حنيفا , بالشرائع الكاملة , وعلى سنن الأنبياء السابقين ,فجاءت الآيات القرآنية و الأحاديث النبوية تأمر بقتل المرتد .<br />ووضع العلماء الحدود و الشرائع , أخذوها من القراّن والسنة ,ومن تفسير الصحابة والتابعين , وهم أعلم أهل الأرض بكتاب الله وسنة نبيه .<br />و أذكر لكم أحكام من يجب قتلهم حدا ( شرعا ), من أشهر كتب الفقه , لعالم معاصر لنا , وهو أكبر العلماء عمرا على وجه الأرض الآن , نسأل الله له الشفاء والعافية و أن ينفعنا بعلمه , ويجازيه كل خير في الدنيا والآخرة عن أمة الإسلام .<br />انه كتاب منهاج المسلم – لفضيلة الشيخ / أبو بكر الجزائري . وهو الآن في المدينة المنورة وقد تجاوز المائة من عمره , وقد رأيته بعيني و حضرت له درسا في الحرم النبوي أثناء قيامي بالعمرة في شهر جمادى الآخر 1428 – الموافق 6 / 2007 .<br />ص. 422 : بيان من يقتل حدا :<br />( 1) المرتد : وهو من ترك دين الإسلام إلى النصرانية أو اليهودية أو إلى غير دين كالشيوعية والإلحاد وهو عاقل مختار غير مكره .<br />= حكمه : أن يدعى إلى الإسلام ثلاثة أيام و يشدد عليه في ذلك ,فإما يعود إلى الإسلام أو يقتل بالسيف حدا<br />لقول النبي صلى الله عليه وسلم ( من بدل دينه فاقتلوه ) رواه البخاري 4/75 . ولقوله ( ص) ( لا يحل دم امرئ مسلم إلا بإحدى ثلاث : الثيب الزاني و النفس بالنفس و التارك لدينه المفارق الجماعة )رواه النسائي 7/92,وابن ماجه 533 ,و أبو داود 4502 .<br />= حكمه بعد القتل :لا يغسل ولا يصلى عليه ولا يدفن في مقابر المسلمين ولا يورث , و ما ترك من مال يكون لبيت مال المسلمين و يصرف في المصالح العامه للأمة , لقول الله تعالى ( ولا تصل على أحد منهم مات أبدا ولا تقم على قبره انهم كفروا بالله و ماتوا وهم فاسقون ) التوبة 84 .<br />ولقول النبي ( ص ) ( لا يرث الكافر المسلم ولا المسلم الكافر )رواه الأمام أحمد 5/25, والحاكم 4/345 , والدار قطني 4/ 69 .<br />( 2) ما يكفر من الأقوال و الاعتقاد : ( و بالأولى انكار لا اله الا الله و الانتقال الى لا اله الا يسوع , و انكار القراّن و الاعتقاد في الكتب التي كتبها البشر )<br />1—كل من سب الله تعالى أو سب رسولا من رسله ( عليهم الصلاة والسلام ) أو سب ملاكا ( عليهم السلام ) فقد كفر .<br />2—كل من جحد فريضة من الفرائض الشرعية المجمع عليها كالصلاة والزكاة و الحج و الصيام و الجهاد في سبيل الله وبر الوالدين – فقد كفر .<br />3—كل من استباح محرما مجمعا على تحريمه معلوما بالضرورة من الشرع , كالزنا و الخمر و السرقة وقتل النفس بغير حق و السحر – مثلا 0- فقد كفر .<br />4—كل من جحد سورة أو أية أو حرفا من كتاب الله – فقد كفر .<br />5—كل من جحد صفة من صفات الله تعالى ككونه حيا سميعا بصيرا رحيما ... فقد كفر .<br />6—كل من أظهر استخفافا بالدين في فرائضه أو سننه ,أو تهكم عليه أو احتقره , أو رمى بالمصحف في قذر أو داسه برجله إهانة واحتقارا , فقد كفر .<br />7—كل من اعتقد أنه لا عذاب ولا نعيم , أو أنهما معنويان فقط فقد كفر .<br />8 – كل من قال أن الأولياء أو الأئمة أفضل من الأنبياء , أو أن العبادة تسقط عن بعض العقلاء فقد كفر .<br />و أدلة ذلك كله :<br />إجماع علماء المسلمين بعد قوله تعالى ( قل أبالله و آياته و رسوله كنتم تستهزئون , لا تعتذروا قد كفرتم بعد إيمانكم ) التوبة 66 .<br />و لقول الله تعالى ( فان طعنوا في دينكم فقاتلوا أئمة الكفر انهم لا أيمان لهم لعلهم ينتهون ) التوبة 12 .<br />ولقوله تعالى (يا أيها الذين آمنوا من يرتد منكم عن دينه فسوف يأتى الله بقوم يحبهم و يحبونه أذلة على المؤمنين أعزة على الكافرين يقاتلون في سبيل الله لا يخافون لومة لائم ...) التوبة<br />فهذه الآيات تدل على أن من استهزأ بالله أو بصفاته أو بشريعته أو برسوله أو بالاسلام أو بالقراّن أو ارتد عن الاسلام فقد كفر ويجب على المؤمنين أن يقتلوه .<br />== حكم من كفر بسبب ما ذكرناه : أن يستتاب ثلاثة أيام , فان تاب وإلا قتل حدا .وحكمه بعد موته هو حكم المرتد .وتوبته أن يشهد أن لا اله إلا الله و أن محمد رسول الله و يستغفر الله ويتوب إليه عما بدر منه من قول أو اعتقاد .<br />و من كفر تحت التهديد و قلبه مطمئن بالإيمان فلا شيء عليه ( سورة النحل 106 )<br />( 3 ) الزنديق :وهو من يظهر الإسلام و يخفي الكفر.<br />كمن يكذب بالبعث أو ينكر نبوة سيدنا محمد (ص) أو ينكر أن القران كلام الله , ولا يصرح بذلك لخوفه أو ضعفه .<br />= حكمه أن يقتل حدا إذا لم يتب بعد أن يستتاب . وحكمه بعد موته هو حكم المرتد .<br />( 4 ) الساحر : وهو من يعمل بالسحر .<br />إن كان في عمله أو قوله كفر فانه يقتل , لقول النبي ( ص )( حد الساحر ضربة بالسيف ), رواه الترمذي 1460 و الدار قطني 3/114 , ووافق على العمل به مالك و الشافعي و أحمد و الكثير من الصحابة و التابعين<br />وان كان عمله و ما يقوله ليس فيه كفر فانه يعزر و يستتاب , وإلا قتل , لأن السحر لا يخلو من قول أو فعل يكفر به , لقوله تعالى ( وما يعلمان من أحد حتى يقولا إنما نحن فتنة فلا تكفر ... ولقد علموا لمن اشتراه ما له في الآخرة من خلاق )البقرة 102 .<br />و أقول: فانظر يا عبد الله : هذه عقوبة المخالف لآية واحدة من كتاب الله و حديث للنبي ( ص) .فكيف بمن يترك عبادة الله بالكلية و يكفر بكتابه و نبيه محمد – صلى الله عليه وسلم ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />( 5 ) تارك الصلاة : هو المسلم الذي يترك الصلوات الخمسة تهاونا أو جحودا<br />= حكمه : أن يؤمر بها و يكرر عليه الأمر , و يؤخر إلى أن يبقى من الوقت الضروري للصلاة ما يتسع لركعه ,فان صلى و إلا قتل حدا , لقوله تعالى ( فان تابوا و أقاموا الصلاة و آتوا الزكاة فإخوانكم في الدين ) التوبة 11 ., ولقول رسول الله ( ص) ( أمرت أن أقاتل الناس حتى يشهدوا أن لا اله إلا الله و أن محمدا رسول الله , ويقيموا الصلاة و يؤتوا الزكاة , فإذا فعلوا ذلك عصموا مني دماءهم و أموالهم إلا بحق الإسلام ) .<br />هذا هو حكم الإمام مالك . وقال الإمام أحمد يؤخر ثلاثة أيام ثم يقتل إن لم يصلي .<br />== ومن ارتد – جاحدا أمرا معلوما من الدين بالضرورة , لا تقبل توبته إلا بإقراره التوبة عما جحد به , زيادة على النطق بالشهادتين و الاستغفار من ذنبه .<br />= والمراد بكلمة _( حد ) هو العقوبة الشرعية .<br />انتهى الموضوع من كتاب الشيخ ملخصا , ولنا تعليقات .<br />و كما رأيت أخي المسلم و أختي المسلمة ,أن أقل الأعمال التي تستهينون بها فيما يتعلق بالإيمان –قد يكون حدها القتل , إن أصر عليها . فما بالكم بمن ينكر الله ذاته و يجحد بكتابه , وينكر نبوة خاتم الأنبياء و أعظمهم<br />===== و ما بالكم بمن ييسر للناس كل هذا الكفر بفتوى تنتسب للدين من قمته ؟<br />= أرأيتم وفهمتم لماذا التلميع الإعلامي لهؤلاء حتى لأن لأمريكا تستدعيهم وتكرمهم , والفضائحيات المتشبهة بالإسلام تذيع لهم بغزارة و تعمل لهم الدعاية المأجورة بشباب على الإنترنت على مواقع تتشبه بالإسلام ؟<br />= أفهمتم الغرض من الإشاعات التي تطلقها أجهزة صهيونية بأبواق مصرية أن عمرو طردته مصر لأنه جعل فلان يطلق لحيته و زوجته ترتدي الحجاب , ليحبه الشعب الغلبان , ولكن الحقيقة تتضح في فرح القرن أن إشاعة الحجاب كذب 200 %, ولكن لم يتنبه أحد لأنهم صنعوا له شعبيه يقود بها الشباب خارج الإسلام بعد تفريغ الإسلام من الدين وجعله هيكلا هشا بدن تكاليف على الإطلاق .ثم يسحبهم إلى أحضان اليهود .<br />============= وتعالوا إلى تفسير بعض آيات القراّن الكريم المتعلقة بموضوعنا , من كتاب :<br />تفسير القراّن العظيم 0 لأبن كثير – عليه رحمة الله .<br />في المجلد الأول ص. 181 :في تفسير آية من يتعلمون السحر ( البقرة 103 )( ولو أنهم آمنوا و اتقوا لمثوبة من عند الله خير , لو كانوا يعلمون )قال : وقد استدل بهذه الآية من حكم بتكفير الساحر ومنهم الإمام أحمد وطائفة من السلف .و حده ضرب عنقه لقول الشافعي و أحمد ابن حنبل , أخبرنا سفيان ابن عيينه عن عمرو ابن دينار أنه سمع بجالة ابن عبده يقول : كتب عمر ابن الخطاب – رضي الله عنه : أن اقتلوا كل ساحر و ساحرة , قال : فقتلنا ثلاثة سواحر .أخرجه البخاري في صحيحه .<br />وصح عن( حفصه) أم المؤمنين أنها سحرتها جارية فأمرت بها فقتلت .<br />= وقال الإمام أحمد ابن حنبل , صح عن ثلاثة من الصحابة أنهم قتلوا الساحر .<br />=== وفي قوله تعالى ( لا اكراه في الدين )( البقرة 256 ) جاء في ص. 284 من المجلد الأول :<br />وجاء في صحيح البخاري – حديث النبي ( ص ) ( عجب ربك من قوم يقادون إلى الجنة في السلاسل ), ويعني الأسارى الذين يؤتى بهم إلى بلاد الإسلام في القيود , ثم بعد ذلك يسلمون وتصلح أعمالهم و سرائرهم , فيكونون من أهل الجنة .<br />و روى الإمام أحمد عن يحيى عن حميد عن أنس أن رسول الله ( ص ) قال لرجل ( أسلم ) . فقال : اني أجدني كارها .فقال ( ص) ( و إن كنت كارها ) . حديث صحيح .و لكن النبي لم يكرهه على الإسلام , بل دعاه إليه , فقال إن نفسه كارهة ,, فقال له النبي : أسلم وان كنت كارها فان الله سيرزقك حسن النية و الإخلاص .<br />قال العلماء : لا تكرهوا الكفار على الدخول في الإسلام . و ليست هذه رخصة للمسلم ليكفر بالله .<br />== وفي ص. 579 من نفس المجلد في تفسير الآية ( ولا تنكحوا ما نكح أباؤكم ...)النساء 22<br />قال : ولذلك حرمت أمهات المؤمنين لأنهن أمهاتهم, لكونهن زوجات النبي ( ص ) وهو كالأب لهذه الأمة , بل حقه أعظم من حق الآباء بالإجماع , وحبه مقدم على حب النفوس .<br />و قال عطاء ابن رباح في قوله تعالى ( ومقتا ..) أي يمقت الله فاعله ,و ( وساء سبيلا ) أي و بئس طريقا.<br />فمن فعله فقد ارتد عن دينه , فيقتل و يصير ماله فيئا لبيت المال .<br />و أقول لك يا عبد الله : انظر إلى مصير من ينكر أو يخالف هذه الآية من آيات كتاب الله , فما قولك فيمن تجرأ على إنكار حدا من حدود الله ؟ وما قولك فيمن تجرأ على مخالفة القراّن كله ؟ و أنكر ربه و خاتم أنبياء الله ؟<br />======== و في رواية ابن عمر – رضي الله عنهما – أن رسول الله صلى الله عليه وسلم بعثه إلى رجل تزوج امرأة أبيه من بعده , ليقتله و يأخذ ماله .<br />====== و قد أجمع العلماء على تحريم من وطئها الأب بتزويج أو ملك يمين أو شبهة .و اختلفوا فيمن باشرها بشهوة دون الجماع ,أو نظر إلى مالا يحل له النظر إليه منها , فقال الإمام أحمد أنها تحرم أيضا بذلك أبنائه .<br />= وفي ص. 660 من نفس المجلد , كتب في تفسير الآية ( وما كان لمؤمن أن يقتل مؤمنا إلا خطأ,....) النساء 92. فذكر الحديث السابق ذكره ( لا يحل دم امرئ مسلم إلا بثلاث ... والتارك لدينه ...) ثم قال : إذا وقع شيء من هذه الثلاث , فليس لأحد من الرعية أن يقتل الفاعل , إنما ذلك إلى الإمام أو نائبه .فتأكد قتل المرتد .<br />== و في ص. 44 من المجلد الثاني :<br />في تفسر الآية ( يا أهل الكتاب قد جاءكم رسولنا يبين لكم كثيرا مما كنتم تخفون من الكتاب ...) المائدة 15 .<br />كتب : فكان الرجم مما أخفوه .<br />== عن ابن عباس – رضي الله عنهما قال : من أنكر الرجم فقد كفر بالقراّن<br />وابن عباس هو ( ترجمان القراّن ) و قد دعا له رسول الله ( ص) بأن يعلمه الله تفسير القراّن . فتفسيره رباني .و أقول : انظر يا عبد الله لحكم من أنكر آية منسوخة قولا فقط من القراّن . وأشد منه من أنكر حد قتل المرتد المذكور في الآية التالية وغيرها مما سبق .<br />== وفي تفسير الآية ( يا أيها الذين آمنوا من يرتد منكم عن دينه فسوف يأتي الله بقوم يحبهم ويحبونه أذلة على المؤمنين أعزة على الكافرين يقاتلون في سبيل الله لا يخافون لومة لائم ...) المائدة 54 :<br />قال .<br />: نزلت في قتال المرتدين .<br />== وفي ص. 77 , في تفسير الآيات ( المائدة 41- 44 ) قال : من لم يحكم بما أنزل الله وتركه عمدا وهو يعلم , فهو من الكافرين, ومن جحد ما أنزل الله فقد كفر .<br />== وفي ص.85 , في تفسير الآية ( أفحكم الجاهلية يبغون ...) المائدة 50 – قال :من خرج على حكم الله تعالى إلى ما سواه مما وضعه الناس بلا سند من شريعة الله , فهو كافر يجب قتاله ,أي : يحكم الله بكفر ووجوب قتل من لم يحكم بشرع الله عمدا وعن علم . هذا هو حكم الله على المفتي وعمر خالد ومن مثلهما , والأمر موكول للحاكم و نائبه فقط .<br />===وفي ص. 410 في تفسير الآية ( فإذا انسلخ الأشهر الحرم فاقتلوا المشركين حيث وجدتموهم, وخذوهم واحصروهم واقعدوا لهم كل مرصد , فان تابوا و أقاموا الصلاة و آتوا الزكاة فخلوا سبيلهم , إن الله غفور رحيم ) التوبة 5- قال : اعتمد أبو بكر الصديق – رضي الله عنه – على هذه الآية في قتال مانعي الزكاة .فهي أشرف الأفعال المتعلقة بالمخلوقين .و أقول : فما بالك يا عبد الله – بالأفعال المتعلقة بالخالق .<br />=== وفي ص 413 , في تفسير الآية- التوبة 12 ( و إن نكثوا أيمانهم من بعد عهدهم و طعنوا في دينكم فقاتلوا أئمة الكفر ....) , قال : من هنا أخذ قتل من سب رسول الله أو طعن في الإسلام أو ذكره بنقص .<br />و هي عامة في المشركين وغيرهم . وفسرها بعض الصحابة على الخوارج , وهم مسلمين في الظاهر .<br />أقول : فتنطبق على كل مرتد – بالأولى .<br />== وفي ص . 447 , في تفسير الآية 66 من سورة التوبة (لا تعتذروا قد كفرتم بعد إيمانكم ...) قال:<br />الاستهزاء بالإسلام - كفر.<br />و بمناسبة تقرب عمرو خالد و عمر عبد الكافي و طنطاوي و القرضاوي وغيرهم – الى اليهود و النصارى , وخاصة في برامج عمرو عن التطبيع مع الكفار في سيرة الأئمة الأربعة – بالكذب – معتمدا مثل القساوسة على أن العوام لا يقرأون , أسوق إليكم الآيات التالية :<br />= ص. 417 – في تفسير الآية ( التوبة 23-24) ( يا أيها الذين آمنوا لا تتخذوا آباءكم و إخوانكم أولياء إن استحبوا الكفر على الأيمان ....) يأمرنا الله بمخالفة الكفار و عدم موالاتهم , ويتوعد الله من يواليهم بالعذاب .<br />== ص. 423 , يفسر الآية 29 من سورة التوبة , ( قاتلوا الذين لا يؤمنون بالله ولا باليوم الآخر , ولا يحرمون ما حرم الله ورسوله , ولا يدينون دين الحق من الذين أوتوا الكتاب حتى يعطوا الجزية عن يد وهم صاغرون ).و دين الحق هو الإسلام (الآية 33) : وقال : إن لم يسلموا , يدفعوا الجزية , وهم مقهورين مذلولين ,و محتقرين ومهانين , فلهذا لا يجوز إعزاز أهل الذمة ولا رفعهم على المسلمين , ولقوله ( ص )<br />( لا تبدءوا اليهود والنصارى بالسلام , وإذا لقيتم أحدهم في طريق فاضطروه إلى أضيقه )<br />= ولذلك اشترط عليهم عمر ابن الخطاب – رضي الله عنه – عليهم شروطا ( ذكرها ابن كثير عليه رحمة الله )<br />منها ألا يتشبهوا بالمسلمين في ملابسهم , و أن يشدوا الزنار( الرباط ) على وسط ملابسهم ( مثل الحزام )<br />و ألا يدعوا أحدا من المسلمين إلى الشرك , وألا يمنعوا من يريد الإسلام منهم ,وإلا سقطت عنهم حقوق الذمة فتستباح دماؤهم وأموالهم .<br />========= ص. 462 الآية 84 من سورة التوبة – في المنافقين ( ولا تصل على أحد منهم مات أبدا و لا تقم على قبره , انهم كفروا بالله ورسوله ,وماتوا وهم فاسقون ) قال : حب اليهود هلاك ,ومن والاهم منافق , ومن والاهم من المنافقين لا نصلي على قبره, ولا ندعو له .<br />======= هذا غير الآيات ( يا أيها الذين آمنوا لا تتخذوا اليهود و النصارى أولياء , بعضهم أولياء بعض , ومن يتولهم منكم فانه منهم , إن الله لا يهدي القوم الظالمين ) و الأحاديث ( من أحب قوما فهو منهم ) و ( من أحب قوما حشر معهم ) فقال ابن كثير – عليه رحمة الله – في المجلد الثاني – تفسير الصحابة رضي الله عنهم<br />أن من يتولاهم يموت يهوديا أو نصرانيا و يحشر معهم في يوم القيامة –أي إلى جهنم والعياذ بالله .<br />وقال عمر ابن الخطاب – رضي الله عنه في تفسير تلك الآية : فليتق أحدكم أن يموت يهوديا أو نصرانيا وهو لا يدري .<br />أخي المسلم وأختي المسلمة<br />لعلى أطلت عليكم<br />ألا إن الحق أحق أن يتبع<br />فالأمر إما جنة و إما نار<br />اللهم أنى بلغت اللهم فاشهد<br />سبحانك اللهم و بحمدك نستغفرك ونتوب إليك .<br />الحمد لله رب العالمين<br />وصلى اللهم وسلم على سيدنا محمد وعلى اله و صحابته أجمعين .<br />كتبه دكتور وديع في 27 رجب 1428"
