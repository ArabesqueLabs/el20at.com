text = "موضوع دمه خفيف جدا<br />ياريت يفضل فاتح المحل لتصليح الجذم ... محلات النت بقت كتيرة ومالهاش لازمة ..<br />أجمل حاجة انك تلاقى شاب متفائل ... ربنا يوفقه"
