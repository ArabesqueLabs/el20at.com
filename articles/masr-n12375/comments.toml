subject = "واية يعنى"
author = "واحد من البلد دى"
posted = "2007-11-11"
text = "طيب واية يعنى عايز يبقى دكتور ما يزعلشى - يبقى دكتور<br />طيب ماهو المفتى بتاعنا خريج تجارة تخصص ادارة اعمال وعمال يطلع فتاوى عمال على بطال<br />ايش يعنى جت علية<br />ممكن يبقى دكتور ومفتى كمان<br />زمن العجب"
archived = "2007-11-12"
capture_url = "https://web.archive.org/web/20071112212432/http://masr.20at.com:80/newArticle.php?sid=12375"

