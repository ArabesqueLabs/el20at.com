[[comments]]
order = 0
subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
text = "الموضوع لذيذ يا براء<br />و جامده صوره افيش ايظن جنب مدريه الين و العلم و المعرفه<br />و الاسقاط واضح و الرساله واصله"
archived = "2007-06-15"
capture_url = "https://web.archive.org/web/20070615033446/http://masr.20at.com:80/newArticle.php?sid=10586"

[[comments]]
order = 1
subject = "أنا كل أما بأفتكر اليوم ده.."
author = "مصـ( الخير )ـعب"
text = "بيرو حبيبي<br />أنا كل أما بأفتكر اليوم ده..<br />بأبتسم جدا<br />عاوزين نعمل حاجات تاني كده<br />بس أنت الشهادة لله تصويرك تحفة"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819051014/http://masr.20at.com:80/newArticle.php?sid=10586"
