[[comments]]
order = 0
subject = "السياحة الداخلية"
author = "Salma Adel"
posted = "2007-11-27"
text = "القاهرة القديمة مليئة بالكنوز و الآثار التى تجذب العالم كله إليها، أما بالنسبة لمصر فالسياحة الداخلية فى حاجة إلى تنشيط و دراسة أكثر، فكرة الموضوع أكثر من جميلة و اتمنى ان تكون بداية لسلسلة اعرف بلدك... فى انتظار المزيد من المزارات و الأماكن الإثرية"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128044042/http://masr.20at.com:80/newArticle.php?sid=12589"

[[comments]]
order = 1
subject = "اعرف بلدك"
author = "برديس"
posted = "2007-11-27"
text = "ليه فعلا ميتعملش على الموقع حاجة عن السياحة الداخلية في مصر و عن الأماكن اللي مش معروفة في بلدنا و نعرف أكتر و أكتر"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128044042/http://masr.20at.com:80/newArticle.php?sid=12589"

[[comments]]
order = 2
subject = "الله يا عشرينات"
author = "نيفين نيفى نوفا"
posted = "2007-12-10"
text = "فعلا يا عشرينات محتاجين ننشط سياحتنا الداخليه و نعرف الناس كنوزنا<br />الصور تحفه و الواحد فعلا يا جماعه لما بيدخل الاماكن التاريخيه دى و يتنسم عبق التاريخ بيبقى نفسه يعيش و لو يوم واحد ف المكان<br />موضوع هايل يا يمنى"
archived = "2008-01-27"
capture_url = "https://web.archive.org/web/20080127135645/http://masr.20at.com:80/newArticle.php?sid=12589"
