text = "شوية عيال مغفلين - سايبين فلوس المثتثمرين بقى والتنمية 7 % والرخاء بتاع الحزب الوطنى ورايحيين يهربوا الى اسرائيل<br />الجوعانة - دى حتى من غلبهم فى اسرائيل الحكومة بتاعتنا بتشحتهم وقود الغاز ببلاش<br />دى اية الفقر دة<br />يظهر انهم مش وش نعمة - سايبيين الخير اللى عندنا ورايحيين اسرائيل - امال مين اللى يقف فى طوابير العيش<br />حاجة قرف"
