order = 1
subject = "اسباب فشل اضراب 4 مايو - بين الحقيقة واحلام الحكوم"
author = "المنياوى باشا"
posted = "2008-05-25"
text = "لماذا فشل اضراب 4 مايو ؟<br />هل الناس بتحب الحكومة ؟ او الناس تابت وانابت وبطلت تعمل اضرابات - وقالوا خلاص حرمنا<br />كلا<br />اذن لماذا فشل الاصراب رغم اشتراك الاخوان ؟<br />هل كرها فى الاخوان زى صحف الحكومة ما قالت ؟<br />فشل الاضراب بسبب توقيتة السىء - الناس كانت خارجة من اسبوع اجازات شم النسيم وعيد الاقباط والخميس والجمعة والسبت اجازة<br />يعنى مين اللى هيقفل دكانة اسبوع ويسيب رزق عيالة<br />مين اللى هيبعد عن عملة اسبوع<br />مش ممكن - الناس راحت على شغلها لانها بقت بعيد عنة لمدة اسبوع<br />فشل الاضراب بسبب التوقيت السىء<br />والان الشباب فى الامتحانات وامتحانات الثانوية العامة جاية والكل مشغول<br />لكن الكل بيغلى من الداخل<br />حينما تأتى اللحظة القادمة فانسوا ماحصل فى 6 ابريل<br />انها مقدمات للحرب الاهلية<br />وربنا يستر<br />وبسبب اسعار الحديد ووقف عملية البناء فان 2 مليون حرفى مابين بتاع خرسانة ومبلط وكهربائى وبناء وبتاع محارة وقيشانى قد توقفوا عن العمل وقعدوا فى البيوت<br />ان الافق ملبد بغيوم الدم وربنا يستر مرة اخرى<br />اليس فى دولتنا رجل رشيد ؟<br />ربما لم يظهر بعد"
archived = "2010-03-14"
capture_url = ""
