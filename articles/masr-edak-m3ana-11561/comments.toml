[[comments]]
order = 6
subject = "تصوروا سبب الوكسة اية - الاخ ابو محسن لخصة فى جملة"
author = "انا"
posted = "2009-03-14"
text = "الاخ ابو محسن قال - من 27 سنة كباية الشاى كانت بقرش صاغ ودلوقتى بجنية<br />هو دة السبب<br />الموظف كان بياخد 20 جنية فى الشهر كانت بتساوى 30 دولار<br />الباشوات بتوع السياسات قالوا الموظف ياخد 30 دولار لية - خسارة فى جلد اللى خلفوة<br />خللوا الدولار ب 6 جنية تحت مسميات - منها تشجيع التصدير - اى تصدير مش عارف<br />يبقى الموظف المتخرج من الجامعة دكتور مثلاا راتبة120 جنية يبقى راتبة يعادل 20 دولار<br />يعنى تخفيض رواتب الموظفين بطريقة مشبوهة ومتعمدة مع ارتفاع الاسعار العالمى<br />الشعب البائس ضحية مؤامرة كبرى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "ثورة 23 يوليو بقيادة جمال عبدالناصر اوكست شعب مصر"
author = "مش ححبك"
posted = "2009-03-15"
text = "بريطانيا اللئيمة الخبيثة عبيدة الصهيونية العالمية كانت تحتل مصر وحز عليها انها تشوف مصر اكبر دولة اسلامية وفيها الازهر كعبة العلم في العالم كله<br />وبعدين جه وقت الانسحاب بعد ما فشلت فشل ذريع في تحقيق اي اهداف جوا مصر<br />فملاقتش الا فكرة الثورة انها تجيب شوية عيال حوش وصيع وبلطجية تدخلهم الجيش مع العلم ان الجيش في مصر كان لطبقة معينة فقط الا وهي طبقة الاعيان<br />فجابت الحوش دول والبلطجية وعملتلهم تنظيم وبعد كده ثورة وانتو عارفين الباقي بقا<br />يعني جيل الثورة اللي انا مولود على عهده فانا من مواليد 1956 والذين جاءوا بعد هذا التاريخ كلهم موكوسين<br />والان نحن في انتظار اجندة اوباما ويبدو ان السودان ومصر عليهم الدور<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""

