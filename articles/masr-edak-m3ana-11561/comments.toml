[[comments]]
order = 13
subject = "الحل بيد الله"
author = "مراد المنسي"
posted = "2009-03-24"
text = "مهما عملنا ومهما خططنا ومهما قولنا لن يتم تغيير حالنا لاننا لم نغير من انفسنا..<br />الذين يدعون انهم اقدر منا على قيادة السفينه لا ينظرون الا لمصالحهم<br />القاضي لا يريد شيء من سلك القضاء سوى وضع ابنه مكانه<br />وضابط الشرطه ( اذا كان ضابط فعلا ) لا يريد من مهنته سوى حشر ابنه مكانه<br />والممثل الذي ليس له قيمه في الحياه مشي في نفس الاتجاه ووضع ابنه او بنته على نفس طريقه<br />والاعلاميون مشوا في نفس الطريق فمنهم من وضع ابنه او بنته كمذيع لو مذيعه وهلم جرا<br />باختصار كل الوظائف العامه محجوزه مقدماً.<br />فهل نظر احد من هؤلاء الى ماده اساسيه في الدستور وهي تكافؤ الفرص؟<br />طبعا لا واذا نظر ورآها سيغض الطرف عنها لان ابنه او بنته اولى من تلك الكفاءه<br />واذا وجهنا نظرنا الى قمة الهرم سنجد ان اهم اولويات تلك القمه هي الزج بإبنه لشغل مكانه من بعده ,,,<br />والغريب ان الناس الموكوسه تبرر كل هذه الافعال لا لشيء سوى ان هذا ابوه قاضي وهذا ابوه لواء وهذا ابوه حرامي وهذا وهذا ولا تريد تقديم حتى احتجاج او اظهار الرفض حتى من باب الوكاسه<br />فهل تنتظرون من هذه البلد التي يجثم على انفاسها كل هذه الشرذمه من الناس التي لا تعرف شيء في الدنيا سوى مصالحها ان تتقدم ؟<br />من جهتي انا لا اعمل في اي مرفق حكومي ولا اريد ان يكون احد من اولادي عاملا في اي من مرافق الوسيه ولكن لي في هذه الوسيه حق اريد ان احميه وهو مستقبل البلد ومستقبل اولادي,,, ولا يجب ان ينظر الى كلامي بالمعنى الضيق فمعنى اولادي ان اي اب يجب ان ينظر الى مصلحه اولاده ولكن ليس على حساب اولاد الاخرين فلنرجه للكفاءه والمساواه في الشغل والعمل فهي اول شيء جدي نحو التقليل من اعداد الموكوسين...<br />مراد"
archived = "2010-03-14"
capture_url = ""

