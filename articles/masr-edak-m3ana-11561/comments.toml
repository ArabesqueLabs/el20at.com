text = "البنى ادم اللى اسمه زخارى ده كداب اوى وفشار زياده عن اللزوم ( ال يدفع مليون دولار ال) علشان يسافر -- طب ياموكوس لما معاك مليون دولار يعنى سته مليون مصرى عايز تسافر تهبب ايه ؟ ولا المليون دولار اليومين دول مالهومش قيمه ؟ هات ياعم 200الف جنيه بس وانا اسفرك معزز مكرم لاى بلد عايز تروحها وهناك تقابل حبيايبك مايكل منير وعدلى ابادير وتكمل معاهم مسيرة الخيانه المقدسه وابقى ادعيلى وانت واقف عند حائط المبكى"
