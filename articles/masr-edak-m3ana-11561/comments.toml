subject = "زخاري موكوس وممنوع من السفر علشان سافر اسرائيل"
author = "مش كاتب"
posted = "2009-03-14"
text = "الاسم: ممدوح زكى زخارى<br />العنوان: حقا انمة رجل محترم اما انا فخطير على الامن القومى المصرى كما تدعى على كذبا وزارة داخلية مصر<br />ليتنى كنت ممدوح اسماعيل و ليس ممدوح زكى زخارى المصرى الذى منعت من السفر خارج مصر من 11 مايو 1992 و حتى و قتنا هذا انتقاما منى بسبب زيارتى الى دولة اسرائيل لغرض العلاج الطبى الغير متوفر فى مصر و كل الدول العربية و ايضا قيامى باداء مراسم التقديس بالقدس لكونى مسيحى مصرى؟ يشرفنى حقا ان يكون لى شرف التعرف بالشخصية الهامة التى ساعدت على اخراج السيد ممدوح اسماعيل خارج مصر من صالة كبار الزوار ليخرجنى انا كمان؟ مستعد لدفع مليون دولار امريكى لاى شخص يساعدنى على الخروج خارج مصر و ليعتبرنى ممدوح اسماعيل ولست ممدوح زكى زخارى جرجس المصرى المسيحى القبطى الشريف و لست القاتل؟<br />ــــــــــــــــــــــــــــــــــــ<br />http://masr.20at.com/marquee/comment.php?id=84038"
