[[comments]]
order = 10
subject = "الى المعلق مش موافق"
posted = "2009-03-15"
text = "انا من مواليد عهد جمال عبدالناصر ولما كبرت شوية لقيت الناس اللي عاصروا الملك فاروق والملك فؤاد كانوا بيترحموا على هذه الايام الرخص والعيشة الهنية وكانوا بيقولولي 24 بيضة بمليم ونكله وكانت الناس بتبخر الشقق علشان خاطر تسكن تتصور من كتر الشقق كان اصحاب الشقق بيبخروا الشقق علشان خاطر يجيلها سكان<br />ومحمد عبدالوهاب قال انا اول ما اتعينت في القاهرة كان المرتب 5ر4 جنيه راح اجر شقة بخمشين قرش<br />لكن تعالى بقا وشوف فين يوجعك بعد ما جمال عبدالناصر مسك الحكم<br />ازمات في كل شيء واولهم ازمة الاسكان والخلوات<br />فيه حاجه غلط في تعليقي<br />وبتوع 23 يوليو دول شوية بلطجية<br />وبريطانيا سلمت فلسطين لليهود<br />ومش معقوله حتسلم مصر لناس محترمه<br />فيه حاجه غلط في كلامي"
archived = "2010-03-14"
capture_url = ""

