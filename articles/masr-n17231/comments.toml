[[comments]]
order = 0
subject = "البديل جريدة محترمة بعد الدستور وهى ثانى جريدة فى مصر"
author = "بسمة القمر"
text = "اصبحت جرايد الحكومة زبالة تعتمد على شوية اعلانات ما يسموا رجال الاعمال - وهم شوية حرامية<br />الجريدة الاولى فى مصر هى الدستور<br />تاتى بعدها البديل<br />ثم جريدة المصريون<br />وطبعا يريد ادعياء الحزب الوطنى التشويش على الصحافة الناجحة فيختلقوا قصص تافهة كخلع الحجاب وحفلات مش عارف اية<br />انا عايزة اقول ان حجاب المرأة فى مصر مش جديد -0 طول عمر الفلاحات المصريات بيلبسوا الطرحة والمنديل<br />وقاسم امين لما دعى لخلع الحجاب كان بيقصد بية ستات الطبقة الاستقراطية فى مصر اللى هم الاتراك وبعض المصريين اللى كانوا بيلبسوا اليشمك او الخمار المشبك<br />وبعدين الحجاب دة سترة من رب العالمين - يعنى واحدة شعرها اكرت وقصير وشكلة مش لطيف مش افضل تسترة والا كل يوم تروح تكوية بمكواة رجل علشان تفردة<br />والا واحدة عجوزة وبلغت من العمر ارزلة وشعر رأسها خف وابيض وبقى شكلة قبيح مش برضة سترة واجب والا تصيغة وتعمل عجوز متصابية<br />الحجاب شرعا وجمالا وسترة واحترام للنفس مطلوب<br />ولا مانع لدى البنت وهى لابسة الحجاب تلعب رياضة وتمشى على الكورنيش وتعيش فى حدود ادابنا كمصريين ومسلمين<br />الحجاب ستر لكل قبيح وجمال لكل بنت وامرأة"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814132800/http://masr.20at.com:80/newArticle.php?sid=17231"

[[comments]]
order = 1
subject = "الي الاخت بسمه القمر"
author = "حامد العزامي"
text = "بصي انتي كلامك معظمه صح اللي كنتي بتتكلمي فيه عن الجرايد بس لما روحتي ناحيه الحجاب باظ الموضوع ليه ؟لنتي نسيتي اهم مثل من الامثال اللي انتي قولتيها و هو مثل الشابه مش بارضو في بنات بتكون متعمده انها تنزل بشعرها سايب علشان انها بتكون بتحب تتعاكس انتي تقوليه عاليها ايه؟"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815215350/http://masr.20at.com:80/newArticle.php?sid=17231"

[[comments]]
order = 2
subject = "الحجاب مش واحدة بتلبسه و التانية بتخلعه"
author = "rania masoud"
text = "الحجاب فريضة فرضها علينا الله مثلما فرض الصلاة و الصيام و الزكاة. مش معنى إن في واحد بطل صلاة يبقى بيعتدي على الإسلام و إلا الناس كلها كانت بطلت تصلي. مش معنى إن واحد مبيزكيش يبقى الكل يقلده. ربنا حلل الحلال و حرم الحرام و ده لمصلحيتنا لأن ربنا غني عن العالمين، و في الوقت نفسه كمان الحرام بين و الحلال بين. إحنا مش هنضرب ممثلة خلعت حجابها و لا نعاقبها. و لا هنرفد و نزعل بنت في جريدة خلعت حجابها. مع إن خلع الحجاب ده يعتبر خلع لعفة البنت و حيائها لكن ربنا يهدينا و يهديهم. و افتكروا دايما يا جماعة: كذلك كنتم من قبل فمن الله عليكم. محدش ياخد كلامي كدعوة لخلع الحجاب. تاني بقول خلع الحجاب زي ترك الصلاة و الزكاة و الفروض المكتوبة في القرآن. و كل واحد يحاسب نفسه قبل ربنا مش المجتمع ما يحاسبه"
archived = "2008-09-01"
capture_url = "https://web.archive.org/web/20080901220420/http://masr.20at.com:80/newArticle.php?sid=17231"

[[comments]]
order = 3
subject = "موضوع شائك و حساس لا يجب الخوض فية"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "الحجان او النقاب او حتى الايشارب هذة موضوعات حساسة و شائكة للجميع<br />حقا لا يجب التكلم عنها او الخوض فيها<br />او حتى ابداء اى رد او الاستعانة باى فتوى<br />صاحب الثواب و العقاب هو اللة جل جلالة و هو خير من سوف يحاسب كل انسان على اى تصرف او فعل او قول<br />من نحن يا بشر لنحاسب البشر ايضا<br />ليعمل الجميع ما شائوا اما العقاب او الثواب فهو من عند اللة جلت قدرتة<br />لبس الحجاب او خلعة حرية لاى انسان و هو المسئول عن تصرفاتة و اعمالة سواء كانت صالحة او حتى طالحة<br />اغفر لنا ياللة و ارحمنا فنحن خطاة منذ الولادة و حتى الممات<br />ارحمنا فانت خير الراحمين ياللة يا قدوس"
archived = "2008-09-01"
capture_url = "https://web.archive.org/web/20080901220420/http://masr.20at.com:80/newArticle.php?sid=17231"
