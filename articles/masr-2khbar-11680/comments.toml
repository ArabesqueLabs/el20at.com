subject = "الاضراب الاولاني كان فرصه"
author = "مراد المنسي"
posted = "2009-03-24"
text = "الاضراب الاول الذي تم تنظيمه يوم 6 ابريل الفائت كان فرصه ولكن لم يتم استغلالها الاستغلال الامثل فقد علمت به كل طوائف المجتمع المقهور حتى بائعة الخبر تضامنت مع تلك الحركه فهل سيكون يوم 6-4 عيدا للاضراب فقط؟<br />اظن - وليس كل الظن اثم - ان افرصه راحت ويجب ان نبحث عن يوم غيره حتى لا نكون اضحوكه امام الناس<br />مراد"
