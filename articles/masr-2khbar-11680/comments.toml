[[comments]]
order = 1
subject = "دعوة المرأة لكي تضرب فيه صلاح للمجتمع"
author = "مش رضوى حسن ولا مروى صلاح ولا"
posted = "2009-03-24"
text = "اذا كان الاضراب دعوة للجلوس في البيت وعدم الذهاب للعمل<br />فالله سبحانه وتعالى اول من دعا المرأة لعمل اضراب ضد الجاهلية عندما قال<br />وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الاولى<br />تتصوروا دلوقتي فيه رجالة بيشترطوا ان البنات تكون بتشتغل علشان خاطر هي اللي تصرف<br />تتصوروا ان فيه بنات لما بتتجوز بتصرف على نفسها<br />وفيه رجالة بتشترط ان الست تكون مدرسة علشان خاطر تدي دروس<br />يا لطيف يا لطيف اللطف يا رب<br />اللهم ارحمنا من هذه الايام<br />ليه بقى اضراب 6 ابريل حلو واضراب ربنا وحش<br />وربنا قال في القران كرهوا ما انزل الله فاحبط اعمالهم<br />على كل مرأة ان تلبي نداء ربها في الاضراب على الجاهلية<br />وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الاولى<br />يمكن ينصلح احوال البلد<br />وندعو الرجال ان يسمعوا كلام ربهم ويعملوا اضراب على التنبله وقلة الادب والنوم<br />الرجال قوامون على النساء<br />يعني الرجالة لازم تصرف على النسوان علشان خاطر نساعدهم بأن يجلسون في البيت<br />واعوذ بالله ان اذكركم وانسى<br />واعوذ باله ان اكون من الذين قال الله فيهم اتأمرونه الناس بالبر وتنسون انفسكم<br />اعوذ بالله من ذلك<br />اللهم اصلح امة محمد يا رب"
archived = "2010-03-14"
capture_url = ""
