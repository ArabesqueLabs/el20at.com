posted = "2007-10-24"
text = "الحمد لله والصلاة والسلام علي رسول الله<br />تحية عطرة وتقدير كبير علي صاحب هذه الفكرة المباركة وياريت كل المسلمين تحاول تنفيذ هذه الفكرة ولو حتي في مدارسنا<br />وتحية لاذاعة الكوثر بس لي عتاب عندها لو كان يمكن ان تاخذ جزء من شركات المحمول وتعود بهم علي الفقراء وتحية لبلد المصريين الثانية التي نتمني ان نرجع الي ما كان سابقا أن نكون مصر والسودان وان تكون موحدة وغير مقسمة هي وبلاد المسلمين .."
