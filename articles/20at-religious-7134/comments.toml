text = "اللهم صل على سيدنا محمد في الأولين ...اللهم صل على سيدنا محمد في الآخرين<br />اللهم صل على سيدنا محمد في الملإ الأعلى إلى يوم الدين ...<br />اللهم صل على سيدنا محمد في كل وقت وحين ...<br />فكرة مبهرة حقا ، وتعميمها في المدارس والإجتماعات وغيرها أكثر إبهارًا<br />بارك الله في أصحابها ...<br />ولا تنسوا قول النبي الكريم عليه أفضل الصلاة وأتم التسليم \" من سن في الإســلام سنة حسنة فله أجرها وأجر من عمل بها لا ينقص ذلك من أجورهم شيئًا \" : أو كما قال صلى الله عليه وســلم"
