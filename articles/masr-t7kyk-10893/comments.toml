posted = "2009-01-07"
text = "موضوع متميز جدا يا رشا،،وفعلا لو كل واحد حط النجاح و التفوق أمامه أكيد هيحققه ولو متحققش يبقي راضى عن مجهوده وعن نفسه و أنه مضيعش وقت و عمل اللى عليه،و يارب الكل ينجح مش بس نجاح عادي لأ بتفوق إن شاء الله"
