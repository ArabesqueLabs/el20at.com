subject = "مذاكرة اية وامتحان اية"
author = "زلمكة"
posted = "2009-01-06"
text = "امتحان اية يا ابنى انت وهو<br />انا معايا بكالوريوس هندسة اليكترونيات واشتغل مساعد مبيض وبندهن الشقق ونصبغ الجدران<br />مذاكرة اية<br />خليكوا حلوين<br />اخرتها القعدة على القهوة وكل سنة وانتم طيبين<br />محدش عندة واسطة يدخلنى غزة اروح الاعب اليهود هناك مع المقاومة بدل القعدة"
