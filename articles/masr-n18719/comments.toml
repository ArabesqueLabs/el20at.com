[[comments]]
order = 1
subject = "عزر أقبح من ذنب"
author = "مصري مسلم مقهور"
text = "و الله يا أخ اللي اختشوا ماتوا. أين مشايخ الأزهر العمالقة الذين لم يحنوا رؤ سهم للسلطان فين شيخ زى الإمام المراغي اللي قال لفاروق بجلالة أدره لا و لا بلاش القدام دول نشوف الشيخ شلتوت و مواقفه و لا الشيخ السابق للمصقفاتي طنطاوي أقصد الشيخ جاد الحق. هل نسيتم إنه في مؤتمر شرم الشيخ اللي كان حاضره الفاح ربين و الفاسق كلينتون و السكران العربيد يلسين مع البقرة الضاحكة و فيها طالب كل من السفاح و الزاني الفاسق بعزل الشيخ جاد الحق من منصب الإمام الأكبر و تعيين الموظف طنطاوي اللي كان أباميها مفتي مكانه. لكن ربك أكرم الشيخ جاد الحق و جائه اليقين قبل أي فاسق ما يغلط في حقه. الحقيقة إن المطيباتي ده أعمى و لكن ده أعمي القلب أعوذ بالله هو ناسي إن قريبا سيقابل خالقه و لا الظاهر إنه راخر ماسوني مثل أسياده"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120559/http://masr.20at.com:80/newArticle.php?sid=18719"

[[comments]]
order = 2
subject = "عار عليه"
author = "مصرى للأبد"
text = "صدقت أنه أسوأ شيخ على وجه الأرض. وهو عار على الأزهر. وهو كاذب وفى عز النهار. ال أيه مش عارف شيمون بيريز !!! هذا الشيخ عايش فى القصور ويرهول كالطفل الصغير حيث يريد رئيسه. وليس رأيه الغريب بجلد الصحفيين ببعيد... ولذلك فهو كغيره من تروس هذه المنظومة الفاسدة والفاشلة سيظل فى منصبه مدى الحياة...<br />أنه عار على الأزهر وعلى مصر كلها.. للأسف الشديد."
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120559/http://masr.20at.com:80/newArticle.php?sid=18719"

[[comments]]
order = 3
subject = "لا تعليق"
author = "فهد"
text = "رحم الله الشيخ كشك فارس المنابر كان رجل لا يخاف فى الله لومة لام وصدق عندما قال اذا رايتم العلم يتودد الى الحاكم فاتهموة بالفسق وهذا الرجل غريب الا طوار وليس لدية اى قبول ولالاسف الشديد جدا انة صعيدى وجعلنا نخجل ان نكون صعيدة او نفتخر ان نقول ان ريس اكبر موسسة فى مصر صعيدى رحم الله الشيخ المراغى وعلماء الصعيد الا جلاء الذين اثبو للعلم ان الصعيد انجب رجال يخفون على الاسلام ولكن هذا الرجال ليس من الصعيد فى شى"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120559/http://masr.20at.com:80/newArticle.php?sid=18719"

[[comments]]
order = 4
subject = "احترموا شيخ الازهر يا مسلمين كما يحترم النصارى البابا شنوده عيب عليكم"
author = "مش ضروري"
text = "كون ان شيخ الازهر صافح رئيس اسرائيل المدعو بيريز فهذه مش مشكلة لان بيريز بالذات دونا عن كل المسئولين الاسرائيليين عرف بصداقته للعرب وهذا الموضوع ليس المشكلة لان شيخ الازخر كان في مؤتمر عالمي اسمه حوار الاديان وكل اعضاء المؤتمر لابد ان يكونوا حسني النية ودا موضوع طويل يطول شرحه وليس ما اريد ان اوضحه<br />ولكن خطورة الموضوع تكمن تكمن في الاستهزاء بعلماء الدين/// استهزاء المسلمين بعلماء دينهم هذا هو مكمن الخطر<br />شوفوا النصارى بيعتقدوا في باباواتهم ايه<br />يقولون ان الله يبارك في السماء اعمالهم على الارض<br />يعني اي عمل يعملوا البابا شنوده الرب يباركه في السماء<br />والله عندهم لا يغفر الذنب الا اذا غفره القسيس اولا<br />فعيب عليكم يا مسلمين لما تستهزؤو بعلماء دينكم<br />فشيخ الازهر عالم جليل ومفسر للقران ولكن ما ذنبه اذا كان الحاكم حول منصب شيخ الازهر الى منصب سياسي<br />يعني شيخ الازهر مثله مثل اي وزير لابد ان يقوم بتنفيذ اي عمل يكلف به من قبل الحكومة<br />ودا عيب مزمن في العرب كلهم هو الاستهزاء بعلماء الدين وشيخ الازهر ليس اول من يستهزأ به وليس الاخر<br />فاتمنى من الجميع اعادة النظر في الاستهزاء بعلماء الدين ونحترمهم كما يحترم النصارى باباواتهم<br />سلام"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120559/http://masr.20at.com:80/newArticle.php?sid=18719"

[[comments]]
order = 5
subject = "رد على صاحب تعليق مش ضروري"
author = "مصري مسلم مقهور"
text = "يا محترم تعليقك ده ما كانش أصلا ضروري فعلا. لعلم سيادتك الدين الإسلامي الحنيف لا يعرف شئ إسمه رجل أو رجال الدين. دي حاجة. ثانيا سيديك و سيدي أشرف الخلق أمرنا بأن نغير المنكر إما باليد أو اللسان أو القلب وهذا وصفه عليه الصلاة و السلام بأنه أضعف الإيمان> فسيادتك عايزنا نتخلى عن تطبيق آوامر رسولنا. أما ما يفعله إخوانا النصارى مع البابا شنودة فده شئ يخصهم و نحن لا نحاكي لا اليهود أو النصاري أو البوذيين و على الأقل السيد شنودة لم يستقبل كبير حاخامات الصاهينة في كنيسة المرقسية أو في أي كنيسة أخرى لإنه رافض ذلك. ِالثا هل فكرت لماذا لم يذحب أحد من (رجال الدين) كما أسميتهم سيادتك من السعودية لحضور المؤتمر اللي صارف عليه الملك بتاعهم. و كون إنك تدعي إن السفاح بيرز صديق للعرب ده يدل على أمر فظيع و هو يا إما إن سيادتك جاهل أو مسطول للأسف لازم الواحد يستعمل الكلام المش مظبوط لإنه ده اللي يوافق الموقف هو سي بيرزيز صديقك مش رئيس الدولة اللي كل يوم بتقتل في بشر زيك مش عايز أقول مسلمين أو عرب بأقول بشر ده بجانب الحصار المفروض على واحد و نصف مليون نفس و ملاحقة المساعدات لهم و متجيش تقولي ده سبابها خماس ده بالغض عن إحتلالها و إغتصابها لدولة و برضه جزء كبير من بلدك و هل يقدر جيش بلدك يروه سيناء . ؤ بعدين عايز تحللي إن المنافق صاحبك ما يقدرش إلا إطاعة الأوامر ما هو لو عنده كرامة ممكن يستقيل و لا ديل كمان مش ممكنة. و في النهاية يا صاحب الفضيلة اللي ما بيحترمش نفسه أو مركزه لايمكنك أن تجبر أى شخص أن يحترمه مهما كان هو إيه أو صفاته إيه أو عمله أو إنجازاته أو أو أو روح ربك يصلح أحوالك."
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120559/http://masr.20at.com:80/newArticle.php?sid=18719"

[[comments]]
order = 6
subject = "الله يلعن ابو الذل!"
author = "ahmed ali"
text = "ياعم الفقهاء على دين سلاطينهم. تعساً لك يا زمن. السيد الرئس يساند الجهد الدولي لمنع ايران من السلاح النوي و يشدد الخناق على اهل غزة و وزير خارجيته يهدد بالرد بعنف على اهلهالو فكروا يعبروا الحاجز.السلام عليك يا حبيبى يا ابا عبدالله الحسين ابن علي حفيد رسول الله حيث قلت في كلمات قليلة سطرت بماء الذهب ( ان لم تكونوا احراراً في دينكم, كونوا احراراً في دنيكم ). الله يلعن ابو الذل!"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120559/http://masr.20at.com:80/newArticle.php?sid=18719"

