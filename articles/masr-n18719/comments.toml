subject = "طنطاوى بية سيب الازهر فى حالة"
author = "الشيخ منصر"
posted = "2008-12-11"
text = "الازهر منارة للمسلمين فى العالم كلة مش مصر بس واللى عملة طنطاوى زعل كل المسلمين فى العالم لانة يفترض انة طنطاوى رجل دين او محسوب من القيادات الدينية ودينك وقرانك اللى بتعلم الناس اصولة بيحثك عن الابتعاد عن اللعب مع اليهودلانة يفترض انك قدوة الناس بتقلدك فى الحاجات اللى بتعملها وبكدة حيبقى زنبى فى رقبتك ليوم القيامة لانى حاخد اولمرت بالحضن وابوسة اقتداء وتقليدا لسيادتك وبكدة حتكون ولى من اولياء الحكومة والتطبيع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = "طنطاوي خليك في مكانك فلا يوجد اكفأ منك لقيادة الاز"
author = "مش كاتب"
posted = "2008-12-12"
text = "طنطاوي عالم جليل ومفسر للقران ونحسبه صالحا ولا نزكي على الله احدا<br />وطنطاوي ملتزم بتعاليم اهل السنه والجماعة ويعلم تماما ان علامات يوم القيامه الصغرى كلها ظهرت تقريبا ويعلم ان علامات الساعة وظهورها هي التي تتحكم في العالم<br />يعني مثلا وانا بسمع تفسير الشيخ الشعراوي قال رحمه الله انه عند اقتحام اليهود المسجد الاقصى واحتلاله هناك علماء سجدوا لله شكرا<br />ازاي يا شيخ يا شعراوي قال لانه مكتوب في القران وليدخلوا المسجد كما دخلوه اول مرة وهذه اشارة الى ان المسجد الاقصى سيحتل والعلماء سجدوا لله شكرا على صدق القران<br />فهمتوا ولا مافهمتوش<br />العلماء الكبار فاهمين حاجات احنا مش فاهمينها<br />العلماء الكبار فاهمين يعني ايه العلماء الكبار<br />اكرر<br />العلماء الكبار افهموا معناها كويس<br />لما علماء الدين الكبار يعملوا حاجه بيبقوا هما عارفين هما بيعملوا ايه لان الزمن غير الزمن والوقت غير الوقت<br />واسرائيل الان في العلو الكبير وقال الله تعالى ولتعلون علوا كبيرا<br />ومش شيخ الازهر بس اللي سلم على بيريز<br />تعالى شوف رئيس اكبر واغنى دولة في العالم لما رئيس الوزراء الاسرائيلي بيروح امريكا بيبقى واقف قدامه زي الكلب مع انه عارف ان اليهود قالوا على المسيح بتاعه انه ابن زنها<br />رئيس امريكا بيقعد ادام رئيس وزراء اسرائيل زي الكلب بالضبط ورئيس الوزراء الاسرائيلي عارف كده كويس ان حاكم الولايات المتحدة مجرد كلب عنده<br />من علامات يوم القيامه العلو الكبير لاسرائيل الاعصار المالي اللي حصل دا اسرائيل اللي مدبراه علشان خاطر تزل العالم كله<br />والموضوع طويل يطول شرحه<br />واخيرا ما لكوش دعوة بالعماء الدين الكبار لما يعملوا حاجه عيب لما تنتقضوهم<br />كلمة اخيره حضراتكم قاعدين على النت مش كده<br />السيرفر العمومي بتاع النت مفتاحه مع اليهود وبيتحكم فيه اليهود يعني اسرائيل بكره الصبح تقفلكم النت<br />فاهم يا ابني<br />سلام وياليت نسمع كلام العلماء الكبار امثال الشيخ الشعراوي وشيخ الازهر واحمد عمر هاشم وعلماء اهل السنه والجماعة اجلهم الله"
archived = "2010-03-14"
capture_url = ""

