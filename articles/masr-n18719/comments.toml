subject = "الى المعلقين (حلاق الصحة وازهري)"
author = "مش ضروري"
posted = "2008-12-13"
text = "ما انا قلتلكم ياحمير ان السيرفر العمومي بتاع النت مع اليهود يعني اسرائيل تقدر تقفلكم النت والله<br />السيرفر العمومي في عالم المال والاعمال مع اليهود<br />واديها عملتلكم اعصار مالي وجوعت العالم كله<br />الشيخ طنطاوي ياحمار انت وهو راح مؤتمر اسمه حوار الاديان فاهم يعني ايه يا حمار حوار الاديان<br />ايه هما الاديان الاسلام والمسيحية واليهودية<br />يعني رايح يتجاوز مع ناس عقلاء<br />واسرائيل بعتت بيريز لانه شخصية معتدلة يا حمار<br />ربنا يخلصنا منكم ومن غبائكم"
