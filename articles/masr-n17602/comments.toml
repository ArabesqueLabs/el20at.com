[[comments]]
order = 0
subject = "ونحن الغالبية من الناس نتفرج على مسلسل ناصر"
author = "ا لا لا"
text = "فى هذا الموسم مسلسلان<br />الاول الدالى وهويقال انة يمثل شخصية عثمان احمد عثمان صاحب شركة المقاولون العرب العملاقة ولا زالت عملاقة وقد بنى السد العالى اكبر مشاريع مصر القومية وقد كان رجلا متواضعا ومهندسا عملاقا ونظيفا وشهدت نقابة المهندسين اثناء توليتة نقيبا لها تطورا مذهلا<br />الا ان المسلسل انحرف وتعامل مع شخصيتة كانة احد رجال الاعمال الحاليين<br />المسلسل الثانى الرائع<br />هو مسلسل جمال عبد الناصر وهو يحظى بمشاهدة طاغية فى جميع انحاء الوطن العربى ومصنوع بحرفية عالية جدا وناجح جدا<br />وكونكم موقع اخوان فقد اسقطتم مسلسل ناصر من الاستطلاع<br />على العموم مش مهم استطلاعكم"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918104551/http://masr.20at.com:80/newArticle.php?sid=17602"

[[comments]]
order = 1
subject = "رأيي"
author = "إلهام محمد"
text = "أنا عن نفسي مش بتفرج غير على برنامج عمرو خالد و برنامج معز مسعود ، أما لو لقيت نفسي فاضية في وقت إذاعة الدلى بتفرج على جزء و بزهق فبقوم على طول ما بكملش الحلقة أبدا<br />انا بردو مقتنعة ان شهر رمضان للعبادة و الصيام و الصلاة و الة=وقت فيه لو ضيعناه يبقى احنا مقصرين<br />ربنا يرحمنا و يعيننا .....آمين"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918104551/http://masr.20at.com:80/newArticle.php?sid=17602"

