[[comments]]
order = 20
subject = ""
author = "أمة الله"
posted = "2010-02-19"
text = "الارتباط من مجاهد في سبيل الله يتوقف على مدى حب البنت للدنيا، و طبعا الحب و التعلق بالدنيا من الصفات التي لا يجب ان تتواجد في المسلمة قوية الإيمان، و هذا في حديث النبي ﷺ:<br />[ إذا تبايعتم بالعينة، و أخذتم أذناب البقر، و رضيتم بالزرع، و تركتم الجهاد سلط الله عليكم ذلاً لا ينزعه حتى ترجعوا الى دينكم]..،<br />و الحديث يوضح أن تمكن الهوي و حب الدنيا من قلب المسلم، إنما هو ضعف في الإيمان - الذي يشكل المصدر الرئيسي للقوة - ، بل إن ضعف الإيمان و غلبة الهوى من شأنه أن يستدعي غضب الله، و تتوالى العقوبات حتى يفيق المسلم من غفلته."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 21
subject = ""
author = "أمة الله"
posted = "2010-02-19"
text = "فضل الجهاد في سبيل الله :<br />الآيات الكثيرة، والأحاديث النبوية دالة على هذا الفضل، يقول تعالى:<br />1- {إن الله اشترى من المؤمنين أنفسهم وأموالهم بأن لهم الجنة يقاتلون في سبيل الله فيقتلون ويقتلون وعداً عليه حقاً في التوراة والإنجيل والقرآن ومن أوفى بعهده من الله فاستبشروا ببيعكم الذي بايعتم به وذلك هو الفوز العظيم} [سورة التوبة: آية 111]<br />2- ويقول تعالى: {الذين آمنوا وهاجروا وجاهدوا في سبيل الله بأموالهم وأنفسهم أعظم درجة عند الله وأولئك هم الفائزون * يبشرهم ربهم برحمة منه ورضوان وجنات لهم فيها نعيم مقيم * خالدين فيها أبداً إن الله عنده أجر عظيم} [سورة التوبة:الآيات20 ـ22]<br />،3- ويقول تعالى: {ولا تحسبن الذين قتلوا في سبيل الله أمواتاً بل أحياء عند ربهم يرزقون * فرحين بما أتاهم الله من فضله ويستبشرون بالذين لم يلحقوا بهم من خلفهم ألا خوف عليهم ولا هم يحزنون * يستبشرون بنعمة من الله وفضل وأن الله لا يضيع أجر المؤمنين} [سورة آل عمران: الآيات 169 ـ 171]."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 22
subject = ""
author = "أمة الله"
posted = "2010-02-19"
text = "بقية فضل الجهاد :<br />4- وروى الشيخان عن أبي هريرة -رضي الله عنه- أن رسول الله صلى الله عليه وسلم سئل: أي العمل أفضل؟ فقال: «إيمان بالله ورسوله\"، قيل: ثم ماذا؟ قال: «الجهاد في سبيل الله...»<br />5- «لغدوة أو روحة في سبيل الله خير من الدنيا وما فيها»، (الغدوة و الروحة مثل الذهاب و الإياب)<br />6- {لا يستوي القاعدون من المؤمنين غير أولي الضرر والمجاهدون في سبيل الله بأموالهم وأنفسهم فضل الله المجاهدين بأموالهم وأنفسهم على القاعدين درجة} [سورة النساء: آية 95]... فكيف لا نفضلهم و قد فضلهم الله تعالى..؟؟!!"
archived = "2010-03-14"
capture_url = ""

