subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2009-01-14"
text = "نحن لا نحتاج للجهاد بمعنى القتال الآن<br />ولكننا في حاجة لخطة واضحة وطويلة الأمد لإيقاظ هذه الأمة وتثقيفها وزيادة وعيها وتمسكها بدينها الوسطي الجميل<br />تريد ان تجاهد ؟ صلي الفجر .. اقرأ القران .. ثم اذهب لعملك أو دراستك ونيتك خالصة لله ... ادعى ربك أن يستخدمنا ولا يستبدلنا ... ذاكر ... اعمل .. تثقف ... حاول أن تفيد من حولك ..هذا هو الجهاد الذي نحتاج إليه"
