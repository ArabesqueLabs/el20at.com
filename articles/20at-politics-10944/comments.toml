subject = "الجهاد"
author = "عاشقة الجنة"
posted = "2009-01-14"
text = "ليس في كل يوم تفتح أبواب الجنة للشهداء هذه أبوابه السبعة مفتوحة على مصراعيها في غزة لنلحق بركب الشهداء لنمت وليكن الثمن الجنة ولايكن موتنا جيفاَ نتينة الرائحة بل ذكية الرائحة في جنان الخلد تحملها الملائكة ويتلقاه الرسول الكريم محمد عليه الصلاة والسلام إلى الفردوس الأعلى تحت عرش الرحمن."
