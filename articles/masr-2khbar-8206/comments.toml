subject = "ان للة وان الية راجعون"
author = "احمدابوصالح(صحفى) واتمنى اكون"
posted = "2008-02-10"
text = "فعلا واللة الصحافة فقدت احسن كاتب عمود فى مصر اللة يرحمة كان عمودة السهل الممتنع ويحب يقول الصدق حقا واتمنى وجود صحفيين يمشون على نهج الاستاذ /مجدى مهنا رحمة اللة الفقيد واسكنة فسيح جناتة والهم عائلتة الصبر والسلوان...........<br />بالنسية للاخين عطوة ابو مطوة وحمدى رزق بالزمة هو دة وقتة الكلمات بهذا الاسلوب بدل متترحموا على المتوفى واكيد دة مش كلام حمدى رزق الصحفى دة اكيد حد كاتب اسمة لان معتقدش ان دة اخلاق الاستاذ حمدى رزق.... وشكرا"
