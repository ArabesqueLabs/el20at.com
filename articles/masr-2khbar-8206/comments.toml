[[comments]]
order = 7
subject = "مصري بالكويت hameed63@gmail.com"
author = "محمد ابراهيم"
posted = "2008-02-13"
text = "انا لله وانا اليه راجعون ، لله ما اعطى ولله ما أخذ ولا نقول الا مايرضي ربنا والحمد لله رب العالمين ، حقيقة مصابنا جلل وخسارتنا عظيمة بفقد مجدى مهنا وأدعو الله ان يتجاوز عن سيئاته ويبدله دارا خيرا من داره واهلا خيرا من أهله وأن يلهم ذويه الصبر والسلوان ، فقد عزيز مثل مجدي مهنا تحديدا بهذا المرض الفتاك الذي ابتلي به المصريون أثار في نفسي شجون وأحزان جمة وتساؤلات عظيمة ليس من باب الاعتراض على قضاء الله اطلاقا وانما استغرابا واندهاشا من شي اعظم الا وهو :األا يوجد في مصر انسان شريف ؟ وخصوصاً مسئول شريف وخصوصاً طبيب شريف ، أيقف الاطباء والعلماء المصريون متفرجون على ملايين المصريين المصابين بهذا المرض الفتاك والله انه اعظم بلاءً من الطاعون والإيدز ولابد من تجييش جيوش الاطباء والعلماء والباحثين وتدشين حملة عالمية لإنقاذ الأمة فلقد سمعت منذ أيام اه يوجد أكثر من 15 مليون مصري مصاب ألا تهز قلوبكم هذه الأرقام ألا تعنيكم صحة أهليكم فإن كنت اليوم صحيحا معافى فمن يدريك ماذا يحدث غدا أتمنى لكم الصحة ولكني فقدت في السنتين الماضيتين من اقاربي ومعارفي واصدقائى مايزيد عن عشرة شباب في اواخر الثلاثينات واوائل الاربعينات منهم الطبيب والمهندس والمدرس والفلاح يعني المرض ليس ببعيد عن أحد عافاكم الله . سامحوني على انفعالي الذي ادعو الله ان يحمس بعض علماء وشباب هذه الأمة لبحث طويل وعميق ومحاولة اكتشاف جين المرض او دواء فعال له حتى وان اقتضي الامر ان تكون الحملة عالمية والطلب الصريح من منظمة الصحة العالمية والدول الكبرى بالمساعدة وسامحوني على الاطالة"
archived = "2010-03-14"
capture_url = ""
