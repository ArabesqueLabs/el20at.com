[[comments]]
order = 1
subject = "يدرككم الموت ولو كنتم فى حصون محصنة"
author = "واحد من البشر"
posted = "2008-02-09"
text = "يا من لة الدوام - ارحم عبيدك فى حياتهم واخرتهم<br />راح شابا رفع قلمة وصوتة الجرىء فى وجة اى ظلم ولم يخف او ينافق او يمسح جوخ ككلهم وليس بعضهم<br />راح بمرض الكبد الذى اصابة ربما من مبيدات مسرطنة استعملها فلاح برىء فى رش الفاكهة والخضروات فى حقلة واستوردها لة من اسرائيل يوسف والى عراب الحزب الوطنى<br />مات بسرطان الكبد<br />وكم مصرى مات بسرطان الكبد ؟<br />ارجعوا الى المبيدات الحشرية المسرطنة التى استوردها من العدو دهاقنة النظام ليتحالفوا مع العدو لقتل الشعب<br />طالما اثار موضوع المبيدات<br />ولكنة مات بها<br />والعبرة لكل المتحصنين بحصون فطاحل الاطباء واحدث الادوية التى تجلبها الطائرات احذروا الموت قادم لكم وستجزون الجزاء الاوفى<br />وانا للة وانا الية راجعون"
archived = "2010-03-14"
capture_url = ""

