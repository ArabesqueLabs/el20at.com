[[comments]]
order = 1
subject = "(هذى بلاد ...لم تعد كبلادى)"
posted = "2008-01-21"
text = "قصيدة العام لفاروق جويدة 1-1-2008<br />كتبها الشاعر متأثرا بعد ان شاهد جثث الشباب المصرى على شواطئ تركيا<br />عنوان القصيدة<br />(هذى بلاد ...لم تعد كبلادى)<br />كم عشت أسأل: اين وجه بلادى<br />اين النخيل وأين دفء الوادى<br />لاشيء يبدو في السماء امامنا<br />غير الظلام وصورة الجلاد<br />هو لا يغيب عن العيون كأنه<br />قدر ..كيوم البعث والميلاد<br />قد عشت اصرخ بينكم وأنادى<br />أبنى قصورا من تلال رماد<br />أهفو لأرض لاتساوم فرحتى<br />لاتستبيح كرامتى ..وعنادى<br />أشتاق اطفالا كحبات الندى<br />يتراقصون مع الصباح النادى<br />أهفو لأيام توارى سحرها<br />صخب الجياد ..وفرحة الاعياد<br />اشتقت يوما أن تعود بلادى<br />غابت وغبنا ..وانتهت ببعادى<br />فى كل نجم ضل حلم ضائع<br />وسحابة لبست ثياب حداد<br />وعلى المدى اسراب طير راحل<br />نسي الغناء فصار سرب جراد<br />هذى بلادى تاجرت فى عرضها<br />وتفرقت شيعا بكل مزاد<br />لم يبقى من صخب الجياد سوى الاسى<br />تاريخ هى الارض بعض جياد<br />فى كل ركن من ربوع بلادى<br />تبدو امامى صورة الجلاد<br />لمحوه من زمن يضاجع ارضها<br />حملت سفاحا فاستباح الوادى<br />لم يبق غير صراخ امس راحل<br />ومقابر سئمت من الاجداد<br />وعصابة سرقت نزيف عيوننا<br />بالقهر والتدليس ..والاحقاد<br />ماعاد فيها ضوء نجم شارد<br />ماعاد فيها صوت طير شاد<br />تمضى بنا الاحزان ساخرة بنا<br />وتزورنا دوما بلا ميعاد<br />شيئ تكسر فى عيونى بعدما<br />ضاق الزمان بثورتى وعنادى<br />أحببتها حتى الثمالة بينما<br />باعت صباها الغص للأوغاد<br />لم يبق فيها غير صبح كاذب<br />وصراخ ارض فى لظى استعباد<br />لا تسألونى عن دموع بلادى<br />عن حزنها فى لحظة استشهادى<br />فى كل شبر من ثراها صرخة<br />كانت تهرول ورائها وتنادى<br />الافق يصغر...والسماء كئيبة<br />خلف الغيوم أرى جبال سواد<br />تتلاطم الامواج فوق رؤوسنا<br />والريح تلقى للصخور عتادى<br />نامت على الافق البعيد ملامح<br />وتجمدت بين الصقيع اياد<br />ورفعت كفى قد يرانى عابر<br />فرأيت امى فى ثياب حداد<br />أجسادنا كانت تعانق بعضها<br />كوداع احباب بلا ميعاد<br />البحر لم يرحم براءة عمرنا<br />تتزاحم الاجساد فى الاجساد<br />حتى الشهادة رواغتنى لحظة<br />واستيقظت فجرا أضاء فؤادى<br />هذا قميص فيه وجه بنيتى<br />ودعاء أمى.. \"كيس \"ملح زادى<br />ردوا الى أمى القميص فقد رأت<br />مالا أرى من غربتى ومرادى<br />وطن بخيل باعنى في غفلة<br />حين اشترته عصابة الافساد<br />شاهدت من خلف الحدود مواكبا<br />للجوع تصرخ فى حمى الاسياد<br />كانت حشود الموت تمرح حولنا<br />والعمر يبكى و...والحنين ينادى<br />ما بين عمر فر منى هاربا<br />وحكاية يزهو بها اولادى<br />عن عاشق هجر البلاد وأهلها<br />ومضى وراء المال والامجاد<br />كل الحكاية انها ضاقت بنا<br />واستسلمت للص والقواد<br />فى لحظة سكن الوجود تناثرت<br />حولى مرايا لموت والميلاد<br />قد كان اخر ما لمحت على المدى<br />والنبض يخبو...صورة الجلاد<br />قد كان يضحك والعصابة حوله<br />وعلى امتداد النهر يبكى الوادى<br />وصرخت ..والكلمات تهرب من فمى:<br />هذه البلاد لم تعد كبلادي"
archived = "2010-03-14"
