[[comments]]
order = 4
subject = "اتمنى الاستفادة"
author = "القرني 2007"
text = "اتمنى انتكون تجربة هذا الشارع على مدن المملكة الباقية ولكن اذا وجد الوعي عند الشباب السعودي وبدوا يخروا في طالب معلومة نافعة البلد وتكون بعيدة عن مايدورا في هذا الشارع احضري والجميل والذي كلف هيئة التطوير الرياض المال الكثير الارتقاء بشباب السعودي................. واتمنى ان يعود بنافع على البلد<br />والسلام عليكم....."
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193518/http://www.harb.20at.com:80/newArticle.php?sid=4884"

[[comments]]
order = 5
subject = "الله يقويهم"
author = "فوفو قاهر اعداء النجاح"
text = "الله يقوي دولتنا وحكومتنا الرشيده على بذل كل ماهو مفيد للشعب والمدينه الذكيه عباره عن تطور قائم بحد ذاته<br />ولكن لدي تعليق على اخونا المصري واقول العلم بحر والانسان ماخلق عالم والتطور والتقنيه تأتي بعد العلم والتعلم واحب اقول لك ان امريكا هي اول من بنا المدينه الذكيه وهذا دليل على انكم انتو اللي قلدتوهم فأرجو منك اخي انك ماتتفوه بأي معلومه الا وانت متأكد منها وارجو التوفيق لدولتنا وحكومتنا الرشيده بالتطورات والانجازات المبهره"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193518/http://www.harb.20at.com:80/newArticle.php?sid=4884"

[[comments]]
order = 6
subject = "يلعن ابو السعودية"
author = "هعهعهعهعهعهعه"
text = "اقلك ياكلب منك لي انتو فاكرين انفسكو شطار لا يابابا وماما وعمو وخالو ومرتو واختو وستو<br />انا بقول كل خراك ياكلب يا عفن ياوسخه بلى بشكلك يا ورع<br />السعودية راحت فيها"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193518/http://www.harb.20at.com:80/newArticle.php?sid=4884"

[[comments]]
order = 7
subject = "مسكين من حقد على السعوديه"
author = "فوفو قاهر اعداء النجاح"
text = "اقولك انا ياروح امك وخالتك وعمتك السعوديه مهما سويتو ماراح تضيع اذا انتو ضايعين هذا شي راجع لكم وراجع للمراقص اللي عندكم اللهم لاشماته الواحد يطلع من بطن امه وهي ترقص وربي اللهم لاشماته الحمدلله على نعمة العقل واذا انتو حاقدين على السعوديع فهذا من فضل ربي والله يزيدكم قهر وحقد"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193518/http://www.harb.20at.com:80/newArticle.php?sid=4884"
