subject = "فكرة رائعة"
author = "ذكي"
text = "عسى أن يتم تعميم هذه الفكرة في كل أنحاء البلاد،حمى الله قيادتنا الرشيدة ووفقها لما فيه خير البلاد والعباد<br />وبهذه الفكرة ستكون الحياة كلها أون لاين"
