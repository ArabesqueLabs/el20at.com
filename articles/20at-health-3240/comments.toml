subject = "و ايه يعني"
author = "faheem-party.blogspot.com"
text = "و ايه يعني ما احنا في مصر عندنا القرية الذكية اللي بتطلعلنا الموز الذكي و الكوسة الذكية و القرع العبقري<br />وقريتنا الذكية موجودة من قبل أي شارع ذكي و حكومتنا الذكية هي أول حكومة ذكية في التاريخ<br />يا ريت الكل يبطل يقلدنا :)"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193518/http://www.harb.20at.com:80/newArticle.php?sid=4884"

