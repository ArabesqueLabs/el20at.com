subject = "عجائب"
text = "لنكة الموضوع الموجودة على الصفحة الرئيسية لا تفتح، الموجودة في العمود الأيسر تفتح... هل هذا له علاقة بالشاع الذكي؟<br />أم هي مسابقة لمن يتمكن الوصول للموضوع"
archived = "2008-05-22"
