[[comments]]
order = 8
subject = "ومارايك في الحسين سبط رسول الله"
author = "محمد سالم"
posted = "2008-04-11"
text = "ويبقي السؤال المؤجل الذي ارجو ان تساله لشيوخ السلطة<br />ماراي فضيلتكم في خروج الحسين بن علي رضي الله عنهما عندما خرج علي حكم معاوية رضي الله عنه ورفض اعطاء البيعه لابنه يزيد ---- وقاتلهم وقلة من المؤمنين حتي استشهد::::: فهل خرج الحسين علي سنة رسول الله<br />هل شيوخك الكرام اكثر فقها من الحسين رضي الله عنه.....<br />مع العلم اننا نتكلم في الحالة المصرية عن خطوات سلمية مثل الاضراب والا عتصام والتظاهر وماشابه ذلك<br />ومفيش كلام عن السلاح خالص.....حتي الاعتراض بالكلام بثير حفيظة شيوخكم<br />علي فكره يا بني ... انا مسلم سني...... اذكر ذلك من اجل اتهاماتكم الجاهزة ونفوسكم المريضة ولان ذكر الفتنة وما حصل للحسين يثير حفيظة شيوخكم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-04-11"
text = "الخيبة الكبيرة يا عمي.. والعسكر كتيرة.. ماليين الشوارع يابا بالشوم والبنادق.. دول مخبرين ودول أمن دولة.. دول بلطجية جاين مقاولة.. يا حضرة الأراجوز قوللي.. نعم عاوز إيه.. الخير حقيقي هيوصلي.. امدح نبينا وصلي عليه.. هيخدعوك علطول علطول لحد ما تدي صوتك.. تسأل عليه تلاقيه مشغول لحد ما يطلع روحك.. وتجوع مراتك وعيالك.. مافيش لا زيت بقي ولا سكر.. وهو عايش وبمالك.. بيمشي علطول يتمختر.. يفضل كده يسرق ويغش لحد الخازنة ما هاتنش.. ولما تلقي الحزب فشنك.. اعرف إنك تهت وضعت.. ياه دي الدنيا ضلمة والتوهة جاية.. مع السلامة.. مع السلامة.. مع السلامة في الجولة الجاية.."
