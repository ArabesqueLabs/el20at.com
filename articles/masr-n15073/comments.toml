text = "تعرف تتلهي وتسكت .... وتريحنا من فتاويك<br />ياتك القرف انت والي من عينتك......ابقي روح روح انت وطي للحاكم ومتنساش تاخدج شيوخك معاك<br />ياعم دور لك علي فيزا الي تورا بورا وريحنا<br />وان ملقتش ابقي روح علي نجد والقصيم ..... هيعجبك الجو هناك اوي ...."
