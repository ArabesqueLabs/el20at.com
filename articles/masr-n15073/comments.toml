[[comments]]
order = 2
subject = "حق اريد به باطل"
author = "abu osama"
posted = "2008-04-08"
text = "الى الاخ اللى بيتكلم عن طاعة ولى الامر هذا الكلام صحيح بشرط ان يطيع الله ورسوله لقول سيدنا عمر رضى الله عنه عندما تولى الحكم اطيعونى ما اطعت الله فطاعة ولى الامر ليست مطلقة لقول المصطفى عليه الصلاة والسلام<br />0افضل الجهاد كلمة حق تقال عند سلطان جائر وما اكثر جوره فكيف بالله عليك تكون الطاعة تامل يا اخى وراجع نفسك<br />فانت تعطى فكرة خطاء عن ديننا خير الاديان الذى ليس به خطاء او نقص وتصور المسلمين بانهم عبيد عند الحاكم<br />يجب عليهم طاعته فى اى شىء حتى لو امرهم بما لايرضى الله وهل يرضى الله عن حاكم جوع شعبه واتخذ من<br />الاعداء اولياء ويقول الله تعالى فى كتابه الكريم( يا أيها الذين آمنوا لا تتولوا قوما غضب الله عليهم ومن يتولهم منكم فانه منهم<br />فأتقى الله يا اخى ولا تعطى فكرة سلبية عن الأسلام والمسلمين فقد اتيت لك بدلائل من الكتاب والسنة والصحابة<br />لعلك تفهم ما تقول واسال الله ان يهديك لآن قولك هذا مثل الذى يقول لاتقربوا الصلاة ولا يكمل فلكى تكمل كلامك<br />فقل(( اطيعوا ولى الامر ما اطاع الله ))وهذا ما قاله سيدنا عمر الفاروق الذى حمل الدقيق على عنقه ليطعم الايتام<br />فاين هذا الذى جوع شعبه كله من الفاروق."
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132042/http://masr.20at.com:80/newArticle.php?sid=15073"

