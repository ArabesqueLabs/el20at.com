[[comments]]
order = 7
subject = "كما قال النبي -صلى الله عليه وسلم- (أدوا الحق الذي عليكم واسألوا الله الذي لكم ) أنت أدي الحق الذي عليك وأما الذي لك فسأل الله، أما الخروج لا يجب الخروج، هذا من شعار أهل البدع ويترتب عليه الفوضى، ويترتب عليه الاضطراب، ويترتب عليه تدخل الأعداء والدول الكافرة إلى غير ذلك من المفاسد التي لا أول لها ولا آخر. نسأل الله السلامة والعافية. نعم."
