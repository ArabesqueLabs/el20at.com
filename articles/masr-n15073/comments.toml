[[comments]]
order = 0
subject = "حذرنا الحكومة الغبية الاف المرات من ثورة الجياع"
author = "مش فاهم"
posted = "2008-04-07"
text = "للاغبياء فى الحكومة<br />لا تتحدوا الشعب<br />افرجوا عن المعتقلين فورا لتهدأة الناس<br />الناس لم تعد تخاف لانهم لم يعد لديهم ما يخافون علية<br />لا امن مركزى ولا جيش ولا اى شىء<br />هذا العام سيكون كئيب على مصر<br />وانا احمل النظام الامنى الارهابى شحن الشعب بالكراهية<br />يا حكومة فوقى بقة"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132042/http://masr.20at.com:80/newArticle.php?sid=15073"

