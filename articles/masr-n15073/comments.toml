[[comments]]
order = 4
subject = "مبارك وامثاله ليس ولاة امور لنا ولا بيعة لهم"
author = "اسامة"
posted = "2008-04-08"
text = "السلام عليكم<br />والله يا اخوة الواحد حزين لما يحدث في مصرنا وانا سأعلق على كلام الاخوة<br />الاخ ناقل الفتوى بارك الله فيك اخي ما نقلته يكون لمن حكم بكتب الله عز وجل فطاعتنا لولاة الامور تتوقف على ما يحكمون به فان حكموا بكتبا الله وسنته اطعناهم وبيعناهم واما ان وضعوا القوانين الوضعية وبدلوا شرع الله وولوا الكفرة والزنادقة ورضوا بسب الله وسب النبي على ارضهم فهؤلاء لا بيعة لهم وتسقط ولايتهم وهذا شبه اجماع لعلماء المسلمين وانظر في تفسير ابن كثير لايات سورة المائدة كذا رسالة العلامه الشيخ محمد بن ابراهيم رحمه الله بعنوان تحكيم القوانين واوصيكي بقراءة شرحه للشيخ الدكتور سفر الحوالي ..<br />الاخ الكريم ابو اسامه انا معك فيما قلت اخي ولكن تعرف ان الخروج له شروط ومنها ان تسقط ولاية الحاكم وهذا واقع وهذا ما اعقتده لكن اخي هناك شرط الاستطاعة والمقدره والمصالح والمفاسد فهل نحن نتملك القدره كي نزيح هذا الحاكم ام سيترتب على هذا جريان انهار من الدماء وقتل وتخريب كما هو حادث الان ؟<br />واما الاخ الذي يستهزأ ويقول للاخ ناقل الفتوى اهذب لتورا بورا والقصيم<br />انا لا اعرف انتمائتك ولكن احسن بك الظن فيا اخي الكريم الذين ذهبوا لتورا بورا هم افضل مني ومنك هؤلاء اول من دافعوا عن المظلموين وجاهدوا الطغاة وهذا معلوم لكل ذي عقل فضل عن انسان عالم بالامور واتمنى الا تستهزأ بهؤلاء ولا بمشايخنا مرة اخرى فانت لا تعرف ما يعتقده المشايخ حتى تقول هذا وتستهزأ<br />وانصحك اخي ان تعود لدينك هذا اول سبيل التمكين بل هو السبيل الوحيد والله ليس السبيل في كفاية وى غيرها بل التمكين في ان نطيع الله ونرجع لدينه ..<br />اسأل الله العظيم ان ينجينا من الفتن وان يحفظ مصر من شر الطغاة<br />والسلام ......"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132042/http://masr.20at.com:80/newArticle.php?sid=15073"

[[comments]]
order = 5
subject = "المحلاوية ارجل من كل شيوخك يا بتاع الخروج عن الحاك"
author = "محمد سالم"
posted = "2008-04-08"
text = "الي الاخ اسامة وردا علي كلامك .... تريد ان تعرف انتمائي ---- انا مسلم -----ايكفيك هذا الانتماء----- ام لابد ان اكون سلفيا<br />تتكلم عن احترام الشيوخ --- نعم نحترم الشيوخ الثقات الذين ينادون بالعدل والمساواة وتداول السلطة والرقابة علي الحاكم ومحاربة الفساد --- ويحافظون للمسلم علي كرامته وعزته ---- ولا يتعاملون مع الناس كانهم خدم وعبيد عندهم<br />اما الشيوخ الذين يحرمون الاضراب ومقاومة الظلم والفساد بحجة منع الفتن فهؤلاء اخرجوا انفسهم من دائرة الاحترام<br />وادخلوا انفسهم عن قصد او دون قصد الي دائرة مساندة الفساد والمفسدين ويكرسون حكم الفرد والديكتاتورية<br />-- الفتنة هي في وجود هؤلاء الشيوخ الذين يثبطون من عزم الناس علي مقاومة الظلم ----- انا اكتب اليك من المحلة الكبري واقول لك اين هؤلاء الشيوخ من قول كلمة الحق ؟؟؟<br />لماذا لاياتي احدهم الي المحلة عندنا حتي يري كيف يتعامل امن الحاكم الواجب طاعته كما يدعون مع الناس ؟؟؟<br />اين هم من كلمة الحق ؟؟؟؟<br />ما راي هؤلاء الشيوخ الجهابذة في اطلاق الرصاص الحي علي الناس المتظاهرين ؟؟؟<br />ماريهم في تزوير الانتخابات ؟؟؟<br />مارايهم في استعانة الشرطة بالبلطجية في التكسير والتحطيم والتحرش بالنساء في المحلة الكبري<br />اين هم ؟؟؟ لماذا لا اسمع لهم صوتا ؟؟؟<br />ام انهم منشغولون باعداد درسات فقهية معمقة عن الحيض والنفاس واطالة اللحية ومنع الخروج عن الحاكم ؟؟؟<br />والله ماراهم الا منافقون ---- منافقون ----------------- منافقون ----------- منافقون ---------- منافقون<br />اضغر شاب شارك في الاضراب اشرف من هؤلاء الشيوخ ---- لانه يعرف معني العزة والكرامة وعدم الاستكانه للظلم<br />*** ثم اين الخروج عن الحاكم ؟؟؟ هل رايتنا حملنا السيوف وخرجنا قاصدين قصر الخليفة اقصد قصر الحاكم<br />نحن نتكلم عن اضراب سلمي وهو حق يكفله الدستور والقانون والمواثيق الدولية<br />بالمناسبة الدولة السعودية الحديثة قامت بعد ان تمرد ال سعود واتباعهم علي حكم خليفة المسلمين العثماني ---- وشقوا عصا الطاعة واقاموا دولة منفصلة ....فما رايك فيهم ؟؟؟<br />هل كفر هؤلاء لانهم خرجوا عن الخليفة ولاحظ انه خليفة للمسلمين كلهم وليس حاكم لقطر او دولة<br />هل خرجوا عن سنة رسيول الله بفعلهم هذا ؟؟؟<br />انا شخصيا لا اعرف الاجابة ولا اعتقد ان هناك عالم يجرؤ ان يعطينا الاجابة الصحيحه علي هذا السؤال الا من رحم ربي<br />اما رجال تورا بورا فالله اعلم بهم وبغيرهم<br />اما عن نفسي فانا مقصر ا في حق ربي ومثقل بالذنوب والخطايا<br />وليس لي الا رحمة ربي<br />اسال الله الهداية لي وللجميع<br />والسلام"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132042/http://masr.20at.com:80/newArticle.php?sid=15073"

