subject = "و ينصحون الناس بالبر و ينسون انفسهم"
author = "نيفين نيفى نوفا"
posted = "2007-03-29"
text = "سبحان مغير الاحوال<br />القذافى هو اللى دلوقتى بيقول كدا<br />هو عارف و الناس عارفه مين باع نفسه لمين<br />متهيالى الزعيم القذافى قائد ثوره الفاتح يوجه الكلام دا لنفسه اولا<br />و يسلملى على الانتعاش الاقتصادى اللى حصلله بعد ما باع اللى بيتهم العرب دلوقتى انهم بيبيعوه"
