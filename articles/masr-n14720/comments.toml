[[comments]]
order = 0
subject = "ما قلنا - البلد بقى معسكر"
author = "عسكور"
text = "الجيش هيحل مشكلة الخبز - يا سلام<br />طيب ماهو وزير التضامن الاجتماعى المسئول عن رغيف العيش لواء سابق فى الجيش<br />ورئيس الدولة لواء<br />وثلاثة ارباع المحافظين لواءات<br />ورؤساء الاحياء وحكام المدن لواءات<br />ربنا يخللى لنا الجيش - اللى بدونة ما نعرفش نعمل حاجة<br />وهو اللى بيحل كل مشاكلنا"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002910/http://masr.20at.com:80/newArticle.php?sid=14720"

[[comments]]
order = 1
subject = "الرتب فى جيش كوستريكا"
author = "lkj"
text = "فى كوستاريكا فاسو وكذلك فى نيكاجروا بعض رتب الجيش<br />خباز اول - ومعجناتى تاسع - ومقطعاتى - وفران - ومتخصص تخمير - ومقمراتى عيش<br />وهذة الوظائف مهمة جدا<br />حيث قال القائد العسكرى الكبير بونابرت - ان الجيوش تزحف على بطونها - اى لما تكون شبعانة وواكلة كويس تقدر تحارب<br />فلماذا لا نقلد هذة الدول"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002910/http://masr.20at.com:80/newArticle.php?sid=14720"

[[comments]]
order = 2
subject = "عسكور انتة صح"
author = "كتكوت الحمير"
text = "احنا مش عارفين احنا بلد اشتراكى او راس مالى بلد مؤسسات ولا بلدبحكم عسكرى مدنى بيتقلب زى الحرباية وبيركب الموجة وقت اللزوم مين المسؤل عن ازمة رغيف العيش ياريس اكيد الشعب لانة بيكتر وبياكل كتير زى مايقولولك وينقلوا بكل كدب وافترا معاناة الشعب وانت ياعينى فى شرم برم"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002910/http://masr.20at.com:80/newArticle.php?sid=14720"

[[comments]]
order = 3
subject = "جتكونيلة فضحتونا"
author = "فران قرفان من العيشة وبيحب العيش"
text = "الهى وانت جاهى تنتقم من كل فاسد حرامى خلاى الناس مش قادرة على رغيف العيش لية كدة ياناس يامفترية متعمل حاجة يابتاع السياسات ياجمالو لية جيشنا المغوار اللى بتشهدلة سينا وكل الدول العربية والاعداء طبعا ببسالتة وشجاعتة وحسمة للمعارك بانجازات اسطورية طبعا بتوفيق من ربنا سبحانة وتعالى معقولة جيشنا المحترم يفرق عيش فى وقت السلم والرخاء بعد فشل كل اجهزة الحكومة فى حل مشكلة قوميةالاوهى رغيف العيش وتامينة وتوزيعة ياجمالو بالذمة عمرك كلت رغيف بلدى ولا خدتة معاك ساندوتش للمدرسة"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322002910/http://masr.20at.com:80/newArticle.php?sid=14720"
