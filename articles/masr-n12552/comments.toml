subject = "تحريم الحلال"
author = "abu osama"
text = "هو المفروض ايه ان احنا ما نساعدشى اخونا فى فلسطين هى دى يقظة حرس الحدود والله ليحاسبهم الله على ذلك<br />و حتى لو مسكتوا مليون طن هتتهمكم اسرائيل والله احنا فى زمن تحريم الحلال و تحليل الحرام هو الواجب علينا اننا نمد الفلسطنين بالسلاح ولا نمنعوا عنهم اجبنا يا فضيلة المفتى ."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205246/http://masr.20at.com:80/newArticle.php?sid=12552"
