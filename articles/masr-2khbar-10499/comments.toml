subject = "سيادة الرئيس لية ؟ هيتدخل علشان واحد مذنتب"
author = "لية"
posted = "2008-11-15"
text = "اية اللى دخل السيد الرئيس ؟<br />هو علشان دكتور يبقى خلاص<br />واحد وكان بيهرب من خلال ممرضة ادوية مخدرة ممنوع دخولها الدولة اللى بيشتغل فيها وهو عارف جيدا قوانينها وارتكب خطأ - يبقى نقف وراة بغباء<br />طيب ما فية عمال غلابة محبوسين ويمكن ظلما ومحدش بيجيب سيرتهم - والا الدكاترة على راسهم ريشة حتى ولو كانوا حرامية<br />القضاء السعودى مش بيفترى على احد<br />وكل واحد بيشتغل فى دولة بيحترم قوانينها ايا كانت القوانين واللى مش عاجبة ميروحش هناك ويقعد فى بيت ابوة<br />السيد الرئيس اكبر من ان نزج بة فى قضية دكتور مرتزق ارتكب اخطاء"
archived = "2010-03-14"
