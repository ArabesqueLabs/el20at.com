text = "عقوبة الجلد لا زالت موجودة فى السجون المصرية<br />واى سجين بيرتكب خطأ داخل السجن بيحكم علية بالجلد وبيحطوة على العروسة ويجلدوة<br />يعنى عقوبة الجلد مش بربرية ولا حاجة فى مصر انما عند غيرنا تبقى تخلف ورجعية<br />وفية اماكن تانية فى مصر بيتحكم فيها على منتسبيها بالجلد وبيربطوة على حاجة اسمها العروسة وبيجلدوة<br />صلحوا بلدكم اولا"
