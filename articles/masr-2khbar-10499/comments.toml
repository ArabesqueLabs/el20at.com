subject = "ده لو دكتور امريكى  يا خلايجة يا خصيان"
author = "محمد"
posted = "2008-11-15"
text = "ياسلاااااااام الدكاترة دلوقتى كخة وزبالة وحبايبنا المعلقين اللى فيهم وكيل نيابة واطلع على التحقيقات وعرف ان الدكاترة مذنبين وان دول الخليج هى دول العدل والقانون وشعبها اطهر شعوب الارض واحنا اللى بنروح هناك نلوث بلدهم والتانى اللى جايب مثال على وساخة الدكاترة فى الخليج ياريت تنضف مخك من الزبالة اللى فيه . اى مهنة فيها الكويس والوحش الفرق فى النسب يا عسل .<br />الكل بيتكلم كما لو كانت السعودية بلد العدل و المساواة ينعل ابو جهلكم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "السعوديه بلد التخلف والرجعيه"
author = "ايمان"
posted = "2008-11-16"
text = "الى الناس الهبله اللى مش عارفين حاجه .واللى بيقولوا ان القضاء السعودى قضاء شريف ونزيه .تقدروا تقولولى منين عرفتوت الكلام ده .السعوديه دى بلد فيها اوسخ قضاء على وجه الارض مش بس فى الحكم على المصريين اللى ممكن يغلطوا هناك لكن حتى على المواطنين السعوديين انفسهم بس محدش قادر يتكلم .والمواطن السعودى نفسه مش قادر يقول او يتكلم فى اى حاجه جوه بلده لانه لو اتكلم فى الساسه ولا الدين ولا اى حكم قضائى بيعتبروه كافر .كفايه قضيه البنت اللى اغتصبوها شابين هناك فى السعوديه مع العلم ان هذه الفتاه سعوديه اعتبرها القضاء السعودى المتخلف الرجهى الذى يامه مجموعه من الساديين والقتله انها مزنبه وحمواعليها بالجلد مئه جلده ولان البنت راحت اشتكت لبعض وسائل الاعلام هناك اعادوا الحكم من جديد وحكموا عليها متين جلده .والقضيه منشوره على النت للى حابب يطلع وغيرها من القضايا العديده ملوثه بها ايدى القضاه فى هذا البلد المتخلف الرجعى قولولى انهى عدل اللى ممكن يحكم على واحد بالجلد 1500 جلده .على الاقل فى مصر مفيش احكام خطيره زى دى وفى عندنا استئناف ووسائل اعلام مقروءه ومسموعه ومرئيه انا مش بقول ان القضاء المصرى عادل ونزيه ابدا بدليل قضيه العباره لكن مفهوش الساديه والوحشيه التى يعانى منها القضاء السعودى."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "(أنجس شعب فى أطهر أرض)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-16"
text = "أكرر العنوان و لالالالالالالالالالالا تعليق<br />(أنجس شعب فى أطهر أرض)<br />شعب و نظام وعدالة فى منتهى التخلف و الهمجية<br />يجب المعاملة لهم بالمثلو لسوف نجد السجون ممتلئة بهم فى مصر<br />انهم قلة من الشواز و المخنثينو البرابرة<br />كرامة اى مصرى ايا كان يجب ان تصان مهما فعل؟<br />جلد اى مصرى فى السعودية معناة الحقيقى<br />و لالالالا تعليق<br />(جلد الكرامة المصرية)<br />و لنبداء بسحل و جلد(النجاسة السعودية)<br />فى مصر<br />(عين بعين وسن بسن و البادى اظلم)<br />اتفوا عليكم يا عرب يا ولاد الكلاب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "(كرامة مصر فوق كرامة السعودية)ملكا و حكومة و شعبا"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-16"
text = "دعوة للشعب المصرى<br />عاملوا الكلاب السعوديين بحجمهم الحقيقى<br />و بلا مجاملات<br />حذاء المصرى الفقير من و جهة نظرى الشخصية اغلى من راس ملك يرأس نظام فاسد متخلف استبدادى عنصرى<br />قاطعوا السعوديين كما قاطعتوا الاسرائليين؟!!!<br />الاسرائليون لا يجلدوا البشر علانية؟<br />اما السعوديين فانهم ------------------------------------------- سرا و علانية؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "الى زخارى واشباهة الذين يكتبون تحت اسماء اسلامية"
author = "يا سلام"
posted = "2008-11-16"
text = "الذين يحقدون على السعوديون وعلى العرب عموما لانهم اهل الاسلام والشتيمة فيهم من مفهومهم انها شتيمة فى الاسلام طبعا احنا فاهمين احقاد الشنوديين واحقاد بشاى وكل الحنافس السوداء والابراص الحقيرة التى تتخفى زى البراغيت فى الشقوق<br />اولا<br />انتاج السعودية الصناعى اللى فى نظر اهليكم متخلفين اكبر من انتاج مصر الصناعى بعشرين ضعفا وصادرتها الصناعية فى كل مكان ابتداءا من البتروكيماويات الى الصناعات الحديدية والتحويلية وغيرها<br />ان السعودية مكتفية ذاتيا من القمح رغم انها ليس عندها نيل ولا ترع ولا يحزنزن ولا امطار<br />ان القضاء فى السعودية عادل جدا واكبر قضية يحكم فيها بما لايزيد عن شهر اما القضاء المصرى المكسح اللى القضية بتقعد فية عشرين سنة للحكم - فلا فارق بين الاثنين<br />لا مقارنة اطلاقا بين مصر والسعودية - بل قارنوا بين مصر والصومال او مصر وموريتانيا<br />هل تعلم ان استهلاك الرياض عاصمة السعودية وتعدادها مليونان من البشر من الكهرباء اعلى من القاهرة بضعفين والقاهرة فيها 15 مليون من البشر<br />هل تعلم ان انتاج السعودية من الكهرباء وهم 20 مليون مرة ونصف انتاج مصر بتعدادها الثمانين مليون<br />الدكتور سوف يجلد ويحبس لانة مجرم واخطأ والسعودية ليس فيها فساد ولا محاباة<br />وعلى الاصوات الحاقدة ان تخرس"
archived = "2010-03-14"
capture_url = ""

