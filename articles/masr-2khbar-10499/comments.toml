[[comments]]
order = 2
subject = "بلاوى الاطباء المصريين فى البلاد العربية تزكم الان"
author = "--"
posted = "2008-11-15"
text = "طبيب مصرى وزوجتة طبيبة كانا يعملان فى احدى المستشفيات الحكومية فى احدى دول الخليج<br />وبعد مدة اربعة سنوات تم انهاء خدماتهم فلم يعودا الى بلدهما ولكن افتتحا عيادة خاصة بهما فى تلك البلد<br />واشتغلا بالاعمال الخارجة على القانون<br />كانوا يجرون عمليات اجهاض للفتيات الصغيرات سرا نظير مبالغ طائلة جدا ومبالغ فيها نتيجة للفضيحة التى تحدث لو انكشف امر تلك الفتيات<br />ومرة بعد مرة انكسف امرهم امام بعض الرؤساء<br />فتم القبض علية وعلى زوجتة وحملا من بيتهم الى المطار راسا وتسفيرهم الى مصر<br />بعض الاطباء ينسى مهنتة الانسانية ويتفرغ لجمع المال وبأى طريقة ويجعل من الطب بيزنس يعمل منة ثروات وعمارات وعندما يقع تطلع النقابة تقول الحقوا الدكتور<br />المصريين مش عايزين يشتغلوا هيبدلوهم بالباكستانيين والهنود والعراقيين والفلسطنيين وما اكثرهم ومعظمهم يحملون جوازات سفر بريطانية وامريكية ومستواهم العلمى احسن من المصريين الف مرة<br />انا راييى الدولة ما تتدخلش الا اذا كان معار من جهتها<br />اما ان كان خارج بنفسة للارتزاق يبقى يحترم البلد اللى راح اليها ويحترم قانونها وعاداتها وتقاليدها<br />وبلاش قرف بقى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
