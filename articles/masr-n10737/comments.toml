subject = "يا عيني عليك"
author = "حدوقة"
posted = "2007-06-21"
text = "حبيبي شعبولا تعجبني صراحته وفعلايبين ان مصر بتحب الرئيس من اكبرها لاصغرها وياريت يا شعبولا تجهز كلمات الاغاني من دلوقت والالحان علشان تعرضها على الرئيس جمال مبارك .<br />شعبولا تأكدت طالما أمثالك موجودين هنهزم اسرائيل وحرر فلسطين والعراق ونبقى اخر فل ."
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625180438/http://masr.20at.com:80/newArticle.php?sid=10737"

