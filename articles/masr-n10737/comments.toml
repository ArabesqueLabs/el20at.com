subject = "جمال مدرب كرة سلة او بالكتيرمديربنك"
author = "يا حوووووووسنى تعال دوسنى"
posted = "2007-06-23"
text = "وماذال مسلسل خراب بيت مصر فى العهدالمبارك مستمروحيستمر بتوريث الاب لابنة ويقعديتفرج علية وهو بيسرق ويطمئن قلبة المريض بالسلطة على الاوضاع قبل ماربنا ياخدة وهناك باة كل واحد بعملة قدام عزيز منتقم"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625180438/http://masr.20at.com:80/newArticle.php?sid=10737"
