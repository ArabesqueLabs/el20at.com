order = 0
subject = "جمال مبارك رئيسا لمصر في دي حندق حق"
author = "مش ضروري"
posted = "2007-06-20"
text = "شعبولا ذكر في مقاله انه حيفرح لو جمال مبارك بقى رئيس لمصر وعنده حق وما فيش فيها حاجه لان الامور استقرت عندنا نحن العرب بصفة عامه من ايام الخليفة معاوية ابو سفيان ان كل حاكم بيرتب للحاكم اللي بعده سواء كان ابنه او اخوه او حد ثاني لكن لازم الحاكم هو اللي يوصي بالخليفة بتاعه والامور مستقره في مصر على هذا الاساس تاريخيا<br />مفيش غير لما جه جمال عبد الناصر وبرضه هذا القانون مشي وجاب انور السادات وعمله نائب رئيس جمهورية وفهمت الناس ان منصب نائب رئيس الجمهورية يعني انه حيحكم لو الحاكم مات ونفس الحكاية عملها انور السادات جاب حسني مبارك نائب رئيس الجمهورية والله بقى عم حسني من حقه انه يرتب للخليفة بتاعه مثل كل الحكام اللي سبقوه واذا كان الاختيار لابنه مش مشكله<br />لماذا<br />لان حاكم الاردن مات وابنه مسك مكانه ومجراش حاجه<br />حاكم المغرب مات وابنه مسك مكانه ومحصلش حاجه<br />حاكم سوريا مات وابنه مسك مكانه ومحصلش حاجه<br />حاكم البحرين مات وابنه مسك مكانه ومحصلش حاجه<br />حاكم الامارات مات وابنه مسك مكانه ،محصلش حاجه<br />ايه المشكلة المشكلة في مصر<br />ما هو احنا بنظام نائب رئيس الجمهورية ما لناش اختيار<br />ولما يجيب ابنه مالناش اختيار<br />يبقي ايه المشكلة<br />توكلوا على الله وبايعوا جمال مبارك خليفة للرئيس مبارك بس يوعدنا انه يطبق الشريعة الاسلامية"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625180438/http://masr.20at.com:80/newArticle.php?sid=10737"

