[[comments]]
order = 5
subject = "الموضوع يا اخ محسن مش موضوع حيثيات - هل هى قضية وا"
author = "حنبوزو لاوى بوزو"
posted = "2009-03-11"
text = "القضية قضية فساد<br />واحد اشترى سفينة خردة او مخردة وانتهى عمرها الافتراضى وخرجت من الخدمة فى اوروبا وعمل لها شوية تجديدات او عمرة صورية فى الماكينات ثم دفع رشاوى لعمل رخصة سير وتجديد فى وزارة النقل البحرى وادارة الموانىء وعمل شهادة صلاحية وهى ليس بها قوارب نجاة ولا سترات ( جمع سترة ) للعوم ولا اجهزة ارشاد وانذار<br />كل الامور كانت ماشية بالرشاوى وتمشية الامور بالفلوس<br />وحينما حدث الحريق فى غرفة الماكينات وامتد الى عنبر الشحن فى تلك الحالة يستخدم نظام اطفاء الحريق بواسطة الرغاوى او الفوم وهذا النظام لم تكن السفينة مزودة بة ولكن تم الاطفاء بالماء فملىء الماء العنابر ولم تكن هناك مضخات صالحة للعمل لضخ هذا الماء خارج السفينة فمالت السفينة على احد الاجناب وغرقت<br />موضوع حيثيات اية يا جماعة<br />دة موضوع واحد فاسد يقتل الناس عمدا ويجد حماية من الناس الكبار<br />المفروض السفينة كان يجرى لها تفتيش فنى ولا يسمح لها بالتحرك<br />ولكن كلة ماشى بالواسطة والرشوة والفساد<br />وربنا على المفترى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "المسئول ضمنيا عن غرق الضحايا وزير الداخلية ووزير ا"
author = "مش قايل"
posted = "2009-03-14"
text = "اولا - الحوادث ممكن ان تقع فى لحظة - اى طيارة معرضة للسقوط واى سفينة معرضة للغرق<br />كل ذلك امر وارد<br />وجميع دول العالم تعد لذلك وعندها فرق نجدة وانقاذ وكذلك نحن فى مصر عندنا فرق نجدة وانقاذ على الورق<br />طبعا السفينة لم تغرق فى لحظة او دقيقة ولكنها اخذت وقتا وارسلت برقيات استغاثة الى كل الجهات<br />والمفروض ان يكون ميناء سفاجة القريب قد استقبل الاغاثة<br />وكان من المفروض ان يطلب من القبطان تحديد موقعة والاحداثيات على الخريطة التى هو عليها<br />وكان من المفروض ان تطير طيارات هيلوكوبتر وهى للاسف لا تتبع الداخلية ان تطير بالقرب من السفينة وتلقى عوامات للناس الذين القوا بانفسهم فى الماء وان ترفع بعضهم من الاطفال والسيدات<br />وكان من الممكن ان تلقى طيارات الهيلوكبتر قوارب مطاطية للناس<br />وكان وكان وكان<br />الا ان السادة اللواءات لم يهتموا او لم يكونوا فى اماكنهم<br />فهم مشغولون بالوظائف المدنية كمحافظين ورؤساء احياء وفى مكاتب الوزراء - الا - عملهم الرئيسى فقد تركوة<br />ايها السادة لا تلوموا صاحب السفينة المجرم وحدة فهناك اخرون يجب ان يحاسبوا<br />والا كل واحد هيقول لك وانا مالى<br />صحيح هى البلد دى بتاع مين"
archived = "2010-03-14"
capture_url = ""

