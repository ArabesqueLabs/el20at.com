text = "الاول حكموا علية بالبراءة<br />وبعدين لقوها واسعة شوية فخلوها 7 سنين<br />اصل اللى ماتوا دول كانوا فراخ او كتاكيت<br />انا سمعت ان اللى يمشى فى الطريق المعاكس بيتحبس لغاية 3 سنين سجن فى قانون المرور الجديد<br />انما اللى يقتل 1350 بنى ادم ياخد 7 سنين<br />يا جماعة مفيش فايدة - كل واحد فى البلد دى ياخد حقة بايدة<br />ايوة كل واحد ياخد حقة بايدة<br />وهذا ملخص الكلام"
