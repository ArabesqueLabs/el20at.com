[[comments]]
order = 2
subject = "ملاحظة مهمة جدا في غرق العبارة"
author = "ابومحسن غربة 27 سنه"
posted = "2009-03-11"
text = "طبعا زي ما انتو عارفين انا بقالي 27 سنه غربة وسفر عن طريق الطائرات<br />لما الواحد بيركب الطياره اول حاجه المضيفات بيعطونا درس في اجراءات الامن والسلامه<br />وفيه حاجه مهمة جدا ان ممكن الطائرة تهبط هبوط اضطراري في المياه<br />فتحت مقعد الطائرة فيه حاجه اسمها سترة النجاه بيعلمونا في حالة الخطر ازاي نسحب سترة النجاه من تحت الكرسي ونلبسها وننفخها كمان علشان خاطر ممكن الطياره تعمل هبوط اضطراري في المياه وطبعا لابد ان يقفز كل ركاب الطائرة في المياه<br />هذا في الطائرة يا جماعة<br />الملاحظة هنا بقا<br />ازاي في المركب ما يكنش فيه اجراء مثل هذا<br />المركب اللي هيا ماشية في الميه واللي بكل تأكيد معرضة للغرق ما يكنش لكل راكب سترة نجاه وهي حاجه عامله زي القميص بدون كمان وبتتنفخ<br />معقولة يبقى فيه سترة نجاه في الطائرة<br />وما يكنش فيه سترة نجاه في المركب<br />حد عنده رد"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الى محمد جمال الدين"
author = "ابومحسن غربة 27 سنه"
posted = "2009-03-11"
text = "يا محمد جمال الدين فيه حاجه اسمها حيثيات الحكم<br />القاضي بعد ما بيقفل المرافعة بياخد ملف القضية للبيت وبيكتب حكم (دا اسمه حيثيات الحكم)<br />غلط المقدمة اللي انت كاتبها دي اثارة على الفاضي<br />7 سنين دا منطوق الحكم مبني على حيثيات الحكم<br />القاضي اللي كتب الحكم دا مستشار ورئيس محكمة مش بيلعب<br />روح هات حيثيات الحكم وانشرها لان حيكون فيها تبرير لان الحكم 7 سنوات بس<br />لان ممكن ربان السفينة يكون هو اللي متورط في غرق السفينه مش صاحب السفينه<br />ربان السفينه ممكن يكون اتصرف تصرفات خطأ ادت الى غرق السفينه<br />المهم كل دا مكتوب في حيثيات الحكم"
archived = "2010-03-14"
capture_url = ""

