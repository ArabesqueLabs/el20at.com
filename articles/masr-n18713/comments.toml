text = "خروف صغير قابل خروف كبير بعد العيد باسبوع - فسألة - اية الحكاية عدى عليك عيدين وما اندبحتش<br />رد الخروف الكبير - ابدا اصل انا مطلع شهادة ميلاد مكتوب فيها انى حمار"
