[[comments]]
order = 2
subject = "كبش مليح فية بلوتوث فى قرونة"
author = "ابو الشباب"
posted = "2008-12-03"
text = "الاغنام فى مصر نوعين<br />اغنام الوجة القبلى واغنام الوجة البحرى<br />فى الوجة القبلى<br />1= الخروف الاوسيمى - من قرية اوسيم مركز امبابة لون الجسم ابيض ما عدا الراس تكون غالبا حمراء الكباش منها لها قرون غليظة ومتوسط وزن الذكر من 50 الى 55 كجم<br />2- الصعيدى - لون الصوف يتراوح بين السواد والحمرة ولون الراس لون الجسم<br />اغنام الوجة البحرى<br />1- الرحمانى لونها احمر مخلوطة بالبياض ووزن الذكر من 55 الى 60 كجم<br />2- الفلاحى - لون الراس اسود او بنى تشتهر بلمعان الفروة<br />3- الغنم البرقى - فى شمال الصحراء الغربية نسبة الى برقة ووزن الذكر من 45 الى 50 كجم"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120547/http://masr.20at.com:80/newArticle.php?sid=18713"
