text = "ياناس حاتجن الشيخه الماذونايه حراااااااااام شرعا ماحصلتش من الف وخمسميت سنه00 والرسول قال لعن الله قوما ولوا امرهم امراه00<br />والقوامه فى الاسلام للرجل فى الزواج00 فعليه عقد العقد ولا تجوز الشهاده على العقد للنساء0000 فما بالكم بالعاقد نفسه"
