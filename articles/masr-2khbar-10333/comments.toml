subject = "زواجها لاى اثنان زواج باطل"
author = "شحبور"
posted = "2008-10-26"
text = "باطل زواجها - والناس نصحوا الشخص اللى عقد قرانة عندها ان يعيد عقد قرانة شرعيا امام قاضى شرعى او مأذون من القاضى الشرعى حتى يكون العقد امام اللة صحيحا<br />الدين مش موضة كل شوية نغير فية والا فستان بيتغير كل موديل<br />يا عالم<br />العبوا بعيد عن الدين"
