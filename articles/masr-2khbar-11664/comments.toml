subject = "قال محلل اقتصادى فى التليفزيون ان سبب الازمة الاقت"
author = "اكتب اسمك هنا"
posted = "2009-03-23"
text = "سبب البلاوى كلها هى حروب احمس وامنمحات لانهم ضيعوا كم بقرة فى الحرب وانهم انفقوا الذهب فى عمل تماثيل وتوابيت ولم يبنوا لنا مصانع وشركات وبنوك لنبيعها نحن للمثتثمرين ونكسب - يعنى بدلا من الهرم لو كانوا عملوا مصانع اسمنت مش كنا بعناها للايطاليين وكسبنا<br />منك للة يا امنمحات انت واحمس"
