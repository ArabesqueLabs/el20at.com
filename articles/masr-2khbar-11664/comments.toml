subject = "البطالة فى مصر حسب التقديرات العالمية 25 % والبطال"
author = "@--$%"
posted = "2009-03-23"
text = "البلد كلها فى حالة بطالة<br />بمعنى لو واحد عمل شغلة عربية بتبيع كشرى او عربية فول فى الشارع - هضيف اية للاقتصاد القومى - مفيش - صفر<br />واحد بيبيع فى كشك سجاير هيضيف اية للاقتصاد القومى - صفر<br />قهوة قاعد عليها شوية عاطلين - هتضيف اية للاقتصاد الوطنى - صفر<br />حتى اللى بيشتغلوا بيشتغلوا فى وظائف هامشية لا تنتج للبلد شيئا<br />ما شاء اللة على اسرائيل<br />الناتج القومى الاسرائيلى قدر الناتج القومى المصرى والسورى والاردنى واللبنانى 3 اضعاف"
