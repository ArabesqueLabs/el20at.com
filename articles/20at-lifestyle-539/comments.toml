text = "انا صاحب توك توك و بطلب توضيح مبرر لاستيراد التوكتوك مادامت الحكومة لن تسمح بترخيصه بوحدات المرور و ارجوكم لا يكون اللرد ان المستورد قطاع خاص فلا يتم دخول اى مستورد من الخارج الا بعد بحث أبعاد استعماله ."
