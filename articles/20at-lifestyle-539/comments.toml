[[comments]]
order = 3
subject = ""
author = "ناصر"
posted = "2008-09-15"
text = "السلام عليكم ورحمة الله وبركاته والله انا شاب ابلغ من العمر 18 سنة وسائق توك توك وكل اللى انا عاوز اقوله ان التوكتوك<br />وسيلة جميلة جداً ونافعة لوقتنا هذا لان الناس كثرت ومنا من يكن بيته بعيد ولا يستطيع المشى الى بيته كل يوم ولا سيما علي النقود او الاموال التى يدفعها ولكن لماذا لم تتعاون معنا مصر التى هى بلدنا وتجعل لنا تكاتك بالتقسيط نأكل عليها عيش ونفتح منها بيوتنا انا واحد من الناس بحكم انى اشتغل عليه فترة طويل تقارب 4 شهور بقول انه مشروع هائل جدا<br />وبفضل الله مكسبه مضمون وكمان السائق بيرزق من فضل الله من علي هذا التوكتوك بس كل اللى انا طالبه ان اى حد او اى شركة او اى مسئول انه يساعدنا في الامر ده وبس وارجوا من الحكومة ان لا تطاردنا في كل مكان بعد ان يتعاونوا معانا في وضع تكاتك بالتقسيط لانى انا لما اشترى واحد وبعديها ب10 ايام فقط يتمسك ويدغدغ وفي الاخر عاوزين 1500 جنيه هو انا اخدت منه ايه علشان اديكم 1500 جنيه فرجاء ساعدووووووووووو ووووووووونا ولكم جزيل الشكر لحسن قراءتكم لموضوعى والسلام عليكم ورحمة الله وبركاته"
archived = "2012-01-18"
capture_url = "https://web.archive.org/web/20120118095255/http://www.20at.com:80/20at/lifestyle/539.html"

