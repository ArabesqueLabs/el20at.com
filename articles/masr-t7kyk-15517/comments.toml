author = "شفتهم فى الامارات"
posted = "2010-02-28"
text = "شفت شباب هندى وباكستانى وبنغالى بيمشوا على اقدامهم على جوانب الطرق وكل واحد شايل حقيبة علة ظهرة فيها ملابسة وبينزلوا فى الجوامع وبعد الصلاة بيلقوا مواعظ وخطب لابناء جنسيتهم لشرح الدين وافهامة لهم وهم على خلق طيب وليس لهم اهداف سياسية وانما تجول ودعوة فى اى تجمع للمسلمين - وربنا يهدى الجميع - والسؤال هو لية امن الدولة فى مصر سايبهم ولم يتهمهم بقلب نظام الحكم وتهديد السلم الاجتماعى والسلم والتعبان وانضمامهم الى جماعة محظورة"
