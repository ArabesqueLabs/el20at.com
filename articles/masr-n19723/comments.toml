subject = "ويبقى الحال على ما هو علية ورغم انف القضاء وعلى المتضرر ان يخبط راسة فى اقرب حيطة"
text = "بيقولوا امريكى وصومالى وواحد مصرى دخلوا كهف وناموا 500 سنة<br />وبعدين صحيوا<br />الامريكى قال سنحارب فى العالم حتى اخر جندى<br />الصومالى قال لن نترك ولاية نيوجرسى تحت يد الامريكان مهما كلفنا<br />المصرى اول ما فتح عينية بعد 500 سنة سبات صرخ وقال<br />احنا اخترناك -- احنا اخترناك - احنا اخترناك احنا اختارناك"
