text = "لا نقول الا كما قال لنا سيد البشر أنه لا نجاة لنا إلا سبيل آل البيت الذين وصفهم النبي الأكرم (ص) بسفينة النجاة<br />فكيف تكون الأمة على هدي وهي مازالت تعتبر يوم مقتل صباح الهداية يوم فرح و سرور، حسبنا الله على الالمبطلين و المضلين. نسأل الله أن يعيد الأمة الى رشدها والى سفينة نجاتها."
