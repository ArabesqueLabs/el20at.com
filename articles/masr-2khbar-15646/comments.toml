text = "نسوان اغبياء<br />يعنى هما عايزين يتعينوا كدة من غير واسطة ولا<br />شوف يا نور عينى انتى وهية<br />ابن زابط الشرطة بيطلع زابط شرطة وابن القاضى بيطلع قاضى وابن الوزير بيطلع وزير وعندك زكى بدر والجبلى وغيرة<br />واللى ابوها مستشار هتطلع مساشارة<br />واللى ابوها فى مجلس الدولة هتدخل مجلس الدولة هى دى القوانين بتاع الاسطى كمبورة حاكم الولاية السادس عشر<br />فبلاش انزحة وتنطيط<br />اللى هتدخل لازم تكون وارثة الوظيفة عن احد من اهلها"
