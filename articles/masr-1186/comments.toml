[[comments]]
order = 1
subject = "يعني مش عارف مين؟؟"
author = "شيماء"
posted = "2006-11-20"
text = "السلام عليكم و رحمة الله و بركاتة<br />يعني صحيح مش عارف مين الي واقف ورا حسني و بقية شلة الوزراء النصابين هما عموما واحد من اتنين يا اما ........... يا اما...........<br />و انت طبعا عارف ........ الاولاني ميقدرش يرفض لابنة ............ التاني حاجة احسن مامي .......... تزعل و احنا مش قد زعلها لسمح الله.<br />الله يخرب بيوتهم كلهم بوظوا عقولنا.<br />ساعات كتير بسأل نفسي هي فين الثقافة الي سي حسس وزيرها , للاسف انمحت الثقافة في بلد المثقفين و ابصم بالعشرة ان كان اكتر من 2 من بين كل 100 طالب من مرحلة ما قبل الجامعة سمع عن فاروق جويدة او حتي عباس العقاد ( مش الشارع).<br />و الي عاوز يشوف حال الثقافة المصرية يبص لحال السينما و نوعية الافلام الناجحة التي يقبل عليها الجماهير امثال الليمبي و عليا الطرب بالتلاتة و ما شابه ذلك لقد انحصرت الثقافة المصرية في وسط ديناو شكمان قصدي حنجرة سعد الصغير."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112524/http://masr.20at.com:80/article.php?sid=1186"

[[comments]]
order = 2
subject = "ثقافة أمريكانو .. كله حلال لينا .. كله حرام على غيرنا؟؟؟!!!!"
author = "إبن بهية"
posted = "2006-11-21"
text = "بالأمس استضافت الإعلامية اللامعة منى الشاذلي علاء (صاحب مدونة منال وعلاء) ومالك (صاحب مدونة مالكوم إكس) والدكتور عودة (الراجل الطيب اللي عارف كل حاجه بس عايز يعيش في ستر من غير بهدلة كلاب لاحراسة) ، وأخيراً السيد طارق مراسل منظمة مراسلون بلا حدود التي رصدت في تقريها السنوي أن مصر ضمن قائمة العار فيما يخص حرية الانترنت (أتت مصر ضمن ثلاثة عشرة دولة حول العالم في قائمة العار) .. المهم أن هذا التصنيف جاء نتيجة للضغوط والاعتقال التي تعرض لها المدونون المصريون في العام الماضي ومازالوا .. المهم كان على الخط واحد من بتوع الداخلية من مساعدي بوبي جيمي (كلب حراسة جيمي مبارك حبيب العادلي) .. ممكن تسميه بوبي مساعد بوبي برضه .. المهم الأفندي البوبي صال وجال وحكى عن أنهم كالعادة حماة البلد وحماة الاستقرار والأمن والأمان وووو إلخ من الكلام الخيبان ده اللي قرفنا منه ومنهم .. لأنه كلام بلا طعمه زي إخوانا الشوام ما بيقولوا .. المهم سعادة البوبي استشهد بمعتقل حاليا اسمه كريم .. وقال أن كريم هذا مخرب وله أهداف خفية في زعزعة أمن البلاد ..<br />ليه يا عم كفالله الشر هو كريم ده (اللي أنا والله ما أعرفه) عمل إيه ؟؟؟ قالك يا سيدي أن كريم هذا المعتقل حالياً عندهم بخمس تهم كلها تودي في داهية .. قال إيه عايز يبوظ البلد بكتاباته على الإنترنت .. كتب إيه يخرب بيتك ؟؟ قالك ده كريم بيسب الأزهر والدين الإسلامي .. ياه .. بقى الواد كريم عمل كده ؟؟؟ لأ يا سيادة البوبي لازم تطلعوا عين اللي جابوه .. اشنقوه يا باشا .. ريحونا منه .. يستاهل الكلب ده .. ازاي يسب الأزهر وكمان الدين .. وفين ؟ في مدونته على النت ... اتنحنح سعادة البوبي ونفش ريشه وكأنه قبض على أسامة بن لادن وأيمن الظواهري مش حتة عيل طالب .. تلموذ لا راح ولا<br />اقرأ بقية التعليق .."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112524/http://masr.20at.com:80/article.php?sid=1186"

[[comments]]
order = 3
subject = "علاقة فاروق حسني بال\"الوراء\" !!"
author = "الشمحطجي"
posted = "2006-11-21"
text = "مقال ظريف ولطيف<br />بس في بعض الملاحظات ومن واقع مشاهدتي لتفاصيل الموضوعات إلي تطرق ليها المقال واسمحلي يا عبد الظاهر اوضحها :<br />1- وليمة لأعشاب البحر...الزوبعة التي اثيرت حواليها لم يكن الاخوان هم المحركين الرئيسيين فيها ..والي حصل إن جريدة الشعب رفعت سقف الهجوم على الوزير وهيجت مشاعر الطلبة وفي نظري هي كانت نوع من الحماقة الغير محسوبة لأنه كان في امور اهم كان ممكن الجريدة ترفع فيها سقف المعارضة اهم من موضوع رواية اطبع منها 2000 نسخة فقط اتوزع منها 1000 على قصور الثقافة المنتشرة في طول البلد وعرضها لكي توضع في المكتبات الخاصة بقصور الثقافة إلي من الاساس محدش بيدخلها و1000 باقية أخد منها حيدر حيدر 500 نسخة يوزعهم على النقاد وأقاربه وزملائه و500 اتعرضو في السوق محدش اشترى منهم 10 نسخ على بعض ...واتعملت هوليله على قلة فايدة<br />ونفس الحال ينطبق على وصايا في عشق النساء والي كاتبها صحفي شبه مغمور متوهم انه عنده موهبة في الشعر اسمه احمد الشهاوي اتشهر وعمل اسم على قفا واحد احمق قدم استجواب في مجلس الشعب حواليين ديوان شعر لم يقرأه احد !!<br />2- بالنسبة لسؤالك حواليين من يقف وراء الوزير؟!<br />اعتقد انه سؤال مهم خصوصاً في حالة فاروق حسني لأن السؤال ده شاغل بال ناس كتير لأن الموضوع من بداية تصريح حول الحجاب وكونه رجوع \"للوراء\".. من هنا اعتقد إن \"الوراء\" بالنسبة للوزير شئ حيوي ومهم من أيام رئاسة الوزير للمركز الثقافي المصري في روما وخروجة بالشورت والفانلة عليها قوس قزح في احتفال للشواذ جنسياً...نهايةً لتصريحه بأن الحجاب عودة \"للوراء\" ومن هنا اقول ان بقاء وزير عنده تاريخ من البلاوي زي فاروق حسني في الوزارة لمدة عشرين سنة ...ده دليل على ان الوزير واقف وراه راجل من \"الجامدين قوي\" ...<br />وربنا يستر على<br />اقرأ بقية التعليق .."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123112524/http://masr.20at.com:80/article.php?sid=1186"
