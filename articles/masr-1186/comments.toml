subject = "اكيد فعلا وراه واحد جامد اوى"
author = "واحد قرفان"
posted = "2006-11-20"
text = "والله صدق كاتب المقال فى ما قاله فى اخر المقال حين تعجب من بقاء هذا الوزير القذر فى الوزارة لأن اكيد وراه واحد جامد اوى وفعلا فهو وزير شاذ جنسيا واظنه لا يخفى على احد واعجب لبلد يكون مثل هذا الشاذ ممثلا عنها فى اى محفل وممثلا عن ثقافتها وكأنها ثقافة الشواذ ولا تتعجبون حين تعلمون بخبر مسابقة الشواذ التى كانت ستجرى فى مصر الجواب باين من عنوانه"
archived = "2006-11-23"
