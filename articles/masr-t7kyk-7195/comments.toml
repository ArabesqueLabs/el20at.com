text = "انا بالنسبالي كانت اغرب دعوة فطار على السرير و طبعاً انتو فاهمين و ديه كانت السنة اللي فاتت بس الحمد لله السنة ديه خلااااااص توبة بس يا ريت الناس كلها ضميرها يصحى و تبطل ذنوب رمضان كريم و ربنا اكرم<br />ان لله عتقاء من النار في شهر رمضان و ذلك كل يوم<br />يا اخواني استغلو رمضان و كرم الله علينا و نعي كلنا اللهم اجعلنا من عتثاء شهرك الكريم اللهم اغفر لنا ذنوبنا و اسرافنا في امرنا"
