[[comments]]
order = 8
subject = "انا أصدق السيد (الرئيس)؟بس ما عدا حاجة و احدة اسمها(وزارة الداخلية)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر (عضو بالحزب الوطنى الديمقراطى)مع و قف التنفيذ لكونى (مسيحى و طنى قبطى)"
text = "سيادة السيد/الرئيس مبارك<br />حقا انا مؤمن و مصدق لكل ما تقولة ما عدا شيئى و احد الا و هو كذب و تضليل و زارة الداخلية المصرية فى انتهاكات القانون و الدستور و جميع الاحكام القضائية و اخرها احكام (المحكمة الدستورية العليا) بخصوص عدم دستورية المنع من السفر خارج مصر ؟<br />وزارة الداخلية تكذب يا سيادة /الرئيس؟<br />و لكن كل ما تقولة يا سيادة /الرئيس حقيقى و انا مقتنع بة 100000% !!! ما عدا استمرار و زارة /الداخلية المصرية فى منع المواطنين المصريين من السفر و ادراجهم على قوائم اللمنوعين من السفر دون اية احكام قضائية؟ مخالفة للقانون و الدستور؟ و ايضا مخالفة لاحكام (المحكمة الدستورية العليا)أيضا؟؟؟؟؟؟؟؟؟؟؟<br />فى انتظار قرار سيادى من سيادتكمسيادة/الرئيس بتكتيف و غل سلكات و زارة الداخلية من انتهاك للقانون و الدستور و احكام القضاء مما يعطى لاعداء الوطن/مصر اية فرص كازبة لادراج مصر كذبا على قوائم الدول التى تنتهك حقوق الانسان ظلما و كذبا و رياء؟؟؟<br />سيادة /الرئيس<br />نحن فى انتظار صدور قرارتكم السيادية فورا و باسرع ما يمكن و تستطيعون؟<br />سيادة/الرئيس محمد حسنى مبارك انكم رئيس مصر و أعلى رأس بالبلاد؟<br />غلوا و كفوا يد و زارة الداخلية المصرية من تقييد حرية الشعب المصرى فى منعهم من و ضع اسمائهم على قوائم اللمنوعين من السفر بدون اية أحكام قضائية؟<br />تصرفات وزارة /الداخلية فى مننع المواطنين و ادراجهم على قوائم الممنوعين من السفر لهو اعتداء سافر على الدستور و النظام و القانونو كل الاعراف و المواثيق الدولية<br />و لائنا جميعا شعب(مصر) للوطن (مصر)و السلطة و الشرعية و النظام و لسيادتكمم انتم شخصيا سيادة الرئيس/محمد حسنى مبارك رئيس و طننا الواحد مصر<br />و طننا الواحد (مصر) يحكم من مقر رئاسة الجمهورية بمصر الجديدة و ليس يحكم من وزارة الداخلية بلاظوغلى من القاهرة بجمهورية مصر العربية<br />حفظكم و حماكم اللة و وفقكم"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003052/http://masr.20at.com:80/newArticle.php?sid=20206"
