[[comments]]
order = 3
subject = "الحاج دستور متفصل على مقاس التوريث"
author = "شخرم"
posted = "2009-03-08"
text = "دستور اية يا ابا الحاج<br />دة دستور مشبوة - دستور مرقع بميت رقعة -<br />طيب الدستور بيقول 50% من اعضاء مجلس الشعب عمال وفلاحين - الواقع بيقول ان 90% من اعضاء مجلس الشعب من بتوع البيزنس وكبار المحتكرين ورجال الاعمال وتجار الحشيش وكبار اللواءات بتوع الداخلية والجيش<br />دستور اية<br />هو فية دستور<br />ارجعوا لدستور 1923 اللى عملة الشعب المصرى الحقيقى ايام سعد باشا زغلول<br />انما دستور متفصل لنقل السلطة للابن بطريقة تبدوا وكانها دستورية وديمقراطية - العبوا غيرها<br />مطالب الشعب المصرى عمل دستور جديد"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003052/http://masr.20at.com:80/newArticle.php?sid=20206"

[[comments]]
order = 4
subject = "أكد فيها أن تشريف الرئيس مبارك يمثل إضافة ثرية‏ ود"
author = "مش رضوى حسن ولا مروى صلاح"
posted = "2009-03-08"
text = "شوف يا خويا<br />طالما حضور مبارك تشريف يبقى مبارك فوق القانون وطالما مبارك فوق القانون يبقى كل معارف مبارك واصحابه واصدقائه واقاربه واتباعه فوق القانون واتباع اتباعه فوق القانون<br />يبقى القانون بايظ<br />لان طالما حاكم الدولة لم يخضع للقانون ولا ينطبق عليه القانون يبقى قانون ساكسونيا ما ينفعش<br />وافكركم ايام كلينتون ايام فضيلة لوينسكي لما وقف كلينتون امام النائب يستجوبه وفي التلفزيونه وحان حالته يرسى لها<br />ولما كان كلينتون منتظر حكم الكونجرس في قرار عزله وعندما حكم الكونجرس بعزل نيكسون<br />حاكم الدولة يخضع للقانون<br />لكن طالما حاكم الدولة فوق القانون يبقى القانون بايض لان اي واحد يعرف مبارك او يعرف واحد يعرف مبارك حيبقى فوق القانون مثله<br />يا مستشار ماهر عبدالواحد انا لو منك استقيل فورا واروح اخرط بصل مع المدام في البيت احسن<br />سلام"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003052/http://masr.20at.com:80/newArticle.php?sid=20206"

