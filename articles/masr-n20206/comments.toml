subject = "مباحث أمن الدولة فى الإسكندرية تتلاعب بالنار"
posted = "2009-03-10"
text = "مباحث أمن الدولة فى الإسكندرية تتلاعب بالنار<br />مصطفى بكرى ، جريدة الميدان ، ومباحث أمن الدولة (قسم مكافحة التنصير) بالإسكندرية يتلاعبون بالنار<br />تفجرت اليوم الأحداث في منطقة محرم بك بالإسكندرية عقب صلاة العشاء و التراويح عندما خرج الأخوان من الجامع المقابل للكنيسة و هتفوا بهتافات معادية للمسيحية و الكنيسة والمسيحيين بسبب ما إدعته حريدة الميدان وجريدة الأسبوع الصفراء لصاحبها مصطفى بقرى عن عمل الكنيسة لمسرحية ( من سنتين<br />ادعوا انها تسئ الى الإسلام"
