[[comments]]
order = 11
subject = "الى مباحث الاسكندرية؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-03-11"
text = "يا مباحث الاسكندرية!!!<br />انا لا انسى و لكنى اتجمل؟<br />اذا كانت لطيزى حلمة؟ تقدر تقول لى باللة عليكم كيف اصبح (لكس أمك زنبور معل ببزار بحلمتين زينون للاضائة المبهرة )لتسهيل دخول اعضاء الحزب الوطنى (لكس امك الواسع)<br />موش كدة و لا أيهة؟<br />و ربنا يخلى لنا اللواء حبيب العادلى و يجعلة لنا رئيس وزراء لمصر خيرا من رئيس وزراء بلدنا ابو طويلة؟(احمد الوسخ)<br />و ملعون ابو كس امك يابن المرة المنكوحة ليل نهار؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 12
subject = "(الا يكفيك الاستمتاع برؤية تاج قضيبى و عضوى الوطنى"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-03-11"
text = "و لالالالالالا تعليق<br />يا متناك أسكندرية؟يابو طيزكبيرة و طرية و وسخة و متخرية؟<br />كس ام اللى جابت امك المنكوحةانى مشتاق انكاحك انت و الماما بتاعتك؟<br />لا دى موش الماما بتاعتك؟ دى الموزة بتاعتنا كلنا و اللى تبسط كل مشتاق و وراغب فى طيزها بالحرام (خلف خلاف)<br />افيهة افيهة افيهة<br />يابنى خلى امك المنكوحة تغسلها بماء النار للتطهير دى طيز كبيرة و سخة لغرض التصدير"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 13
subject = "(رحلة الى داخل كس ام مباحث الاسكندرية)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-03-12"
text = "الحمد للة اخيرا انا سافرت بعمق داخل كس امك يا (مباحث الاسكندرية)<br />و الحمد للة استمتعت كثيرا و ابتهجت كثيرا برؤية (كس امك) يابن النكوحة<br />ياااااااااااااااااااااااااااااااااااااااااة دة كان واسع جدا و مريح و ممتلئ قازورات من جميع دول العلم يابن الوسخى يا ابن المعرص يا خول<br />لكن للاسف انا شفت كس امك و و جدتة احسن من حلمة طيزى<br />ممكن تيجى تلعب لى فى (قضيبى الوطنى) يا منيوك"
archived = "2010-03-14"
capture_url = ""
