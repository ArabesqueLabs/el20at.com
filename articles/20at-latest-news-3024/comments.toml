subject = "مملكة النساء"
author = "كريمة"
posted = "2007-02-08"
text = "انا لست ملكة فليس هناك اكره الى قلبي من هدا النظام، و لست امير فقد دقت من المر ما يجعلني اخاف من كل مشتقات الرفاهية التي لم اراها يوما حتى في احلى كوابسيي (طبعا فانا لا اعرف ما هي الاحلام)، واقعية، قد اكون متزعمة شيوعية ثورية لكن لا تخفن مني، اقتراحي الى كل سيدة محترمة ملت من العيش وسط الرجال، الى كل أنسة ملت من انتظار فارس الاحلام و لم يحالفها الحظ الا في الإلتقاء بخيرة الاندال، الى كل متضررة مجروحة مكسورة، السعيدات ممنوع الاقتراب، اقتراحي هو كالتالي: ضعوا ثقتكم في، فانا منكن و لن اخدلكن ابدا ، انا كن ساكون رفيقة بكن لاني اعرف بمعاناتكم بحكم تجربني لكل انواع العداب، اطلب منكن التشجع و ارسال مساهماتكن حتى نتمكن من الوصول الى المبلغ المطلوب، سنشتري البلد المعروض للبيع، و سنطلق عليه اسم مملكة النساء و سنجلب كاظم الساهر يغني الاغنية في يوم الافتتاح و سيكون هو الرجل الاول و الاخير الوافد الى مملكتي، اقصد مملكتنا، سنعلن القطيعة ماع عالم الدكور الا الهاربون من رجولتهم رغم خوفي ان يضيق علينا المكان فما اكثر الهاربين من الرجولة ،لا قطيعة مع الجنس الدكوري بالمرة سنقوم بالتنقيب عن أبار البرفانات و سنستخدم فطرتنا في دلك سيكون بئر برفان لكل مواطنة في مطاع العام المقبل و سنتمكن من الاحتكام الى برنامج الطفل مقابل البرفان حتى نتمكن من جلب الاطفال للراغبات في الامومة، اعدكن بالكمال فقط تبرعن و لو بدرهن، و يمكن للرجال الدين يريدون المساهمة بالتبرع او تسجيل زوجاتهم للتخلص منهم ان يقصدو موقعنا و الله الموفق."
