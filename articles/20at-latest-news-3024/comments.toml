subject = "أهي دي البلاد ولا بلاش!!!"
author = "English Youth"
text = "يا سلام كده لو الواحد ياخد له بلد محندقة على القد ومش لازم حتى تمليك، هما يبقوا جدعان بجد لو عرضوها إيجار جديد، لأن كل سنة الإيجار حيزيد عن السنة اللي قبلها ومش حتحتاح غير شوية كنس في الشوارع وكام علبة معطر جو أو عود بخور علشان ريحة الجو... ويستلمها الزبون الجديد متشطبة سوبر لوكس ع المفتاح... بس وحياتكم عايزين نعرف اسم مقاول السيراميك هناك وياريت ميكونش مغلواني ونصاب ويسفلت الشوارع بورسلين كده بمزاج...<br />وطبعاً الواحد مش حيحتاج نقاش... إلا لو كنا إحنا اللي حندهن الهوا دوكو ... ونأيف شعب على مزاجنا كده ونريحه ع الآخر، وولا وزارات ولا حكومات ولا مصالح ولا أي شيء... وأول حاجة نعملها تكون سلاح نووي علشان أي كلب يهوب ناحيتنا نقطع رجله ونجيب خبره فوراً.<br />وإن شاء الله نزرع كل الفاكهة والخضراوات اللي ربنا خلقهم ويبقى عندنا كده إكتفاء ذاتي، وميبقاش لينا سفير في أي داهية تانية .. أقصد دولة تانية ... حنقطع علاقتنا بكل الجيران... ولما ينصبوني أنا أمير للبلد الفل دي كل الناس تحييني وتقول ... طويل العمر يطول عمره وينصره على مين يعاديه ... هاي هيء .... هيء هيء هيء... نياهاهاهاهاهاهاها...!"
archived = "2010-03-14"
