text = "لو فيه يأس من أصلاح الصديق ,ماكنتش هتلاقى حد صديق حد<br />لآن كلنا فينا عيوب ,ووالصاحب الجدع و الصح الى يحاول يغير من صاحبه للاحسن ,حتى لو صاحبه زعل منه لأنه بينصحه بس مصيره هيعرف ان صاحبه كان بيعمل كدة علشان خايف عليه.<br />وأهو كله بثوابه ."
