subject = "ولسة"
author = "fat7y"
posted = "2006-11-12"
text = "من أكتر من خمس سنوات كتبت قصة مستوحاةمن واقعةحقيقية حدثت في صعيد مصر<br />وكنت أتوقع ترحيبا من النقاد والقراء<br />صحيح أنها لاقت إستحساناًَ ولكن ما كنت اتوقعه هو ثورة وليس مجرد أعجاب<br />الشرف لايستحق الحماية في القانون المصري<br />ولكن المال / الشهرة / السطوة هي ما يستحق الحماية<br />وهذا لينك لتداعياتي الفكريةعن حادثة ( محاولة انتهاك عرض ) حدثت وكان لها رد فعل أقام الدنيا وأقعدها فجأة لدواعي أمنية<br />فهلا تفضلتم بلإطلاع عليه القصة بعنوان عوسجة<br />www.my stoory.blogspot.com"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211202/http://masr.20at.com:80/article.php?sid=1151"

[[comments]]
order = 3
subject = "بيقلدو الحكومه"
author = "ايمن امام"
posted = "2006-11-12"
text = "الموضوع ببساطه ان هؤلاء الذين ارتكبو هذه الافعال القذره بيقلدو الحكومه - مش الحكومه عملت كده فى الصحفيين والمعارضين ذكورا واناثا - ومازال من ارتكب هذه الافعال حر طليق - كيف تحاكمون هؤلاء الصبيه الذين ارتكبو هذه الجريمه ولاتحاسبون الاستاذ - الذى ارسى هذه السياسهالعفنه - ثم ماذا يفعل شباب فى سن المراهقه وهم يرون راقصه ترقص بخلاعه امامهم فى عرض الشارع - هل هؤلاء الشباب الذين ارتكبو الجريمه جناه ام ضحايا/ ايمن امام"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211202/http://masr.20at.com:80/article.php?sid=1151"

[[comments]]
order = 4
subject = "البقاء لله"
author = "عنتر مش لاقى سيفه"
posted = "2006-11-13"
text = "السلام علي من اتبع الهدي<br />انا لله و انا الي راجعون..<br />في حادث اليم و مأسوي..لا يعد الاول و لا الاخر.. انتقل الي رحمة الله تعالي الضمير المصري عن عمر يناهز سبعة الاف سنة..بعد حياة طويلة من الشرف و الكفاح و النضال كان خلالها الضمير المصري نموذجا يحتذي به و يضرب به المثل علي مستوي ضمائر العالم اجمعين.<br />كان ضميرا حيا يقظا .. تصدي لكل ما هو قبيح و شاذ..قاوم كل ما هو معتدي و جبار..و ناصر كل مظلوم و ضعيف.<br />كان ضميرا ناصع البياض , لا تشوبه شائبة, لا طالما بحثت و استفسرت كل ضمائر العالم عن سبب صفوه و نقاؤه..و ان كانت بعض هذه الضمائر قررت قتله و محوه من التاريخ.<br />انقل لكم خبر وفاة الضمير المصري و كلي الم و حزن علي هذا الفراق الذي طال كل جوانب الحياة..فقد فارقنا الضمير المصري فى العمل و في الشارع, في الجامعة و في البيت, حتي الاماكن التي كان من المفترض ان تكون المأوي الاخير له, وهي دار القضاء و اقسام الشرطة..فلقد اكتشفت انه الاماكن التي فارقها اولا.<br />و مع هذا الوداع الاليم..ازف اليكم خبر ميلاد الضمير العصري الجديد..الذي لا يعرف حق و لا باطل..الذي لا يعرف ابيه من اخيه.. ولا يفرق بين حلال و حرام..ضمير له هدف واحد فقط.. ان يتقارب من السلطة و الجاة و النفوذ..له غرض واحد فقط..طحن المواطن المصري الضعيف..له عدة سمات جديدة.زالعنف و القسوة و الشدة و عدم الرحمة..الكذب و النفاق و الجهل و السرقة...ضمير ولد من رحم الحرام و يعيش بالحرام و يأكل بالحرام و يتلذذ بالحرام.<br />يا ايها الشعب المصري..ليس لكم في هذا الزمان بعد الله سبحانه و تعالي الا انفسكم..لا تنتظروا العون و الخلاص و الفرج من احد..بقاؤنا علي ما نحن عليه هو الغذاء الامثل و المتنفس الوحيد لهذا الضمير الجديد حتي ينتشر و يترعرع و يكبر و يعم.<br />اقرأ بقية التعليق .."
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211202/http://masr.20at.com:80/article.php?sid=1151"

[[comments]]
order = 5
subject = "خلونا في الأهم ...."
author = "إبن بهية"
posted = "2006-11-13"
text = "قرر وزراء خارجية العرب كسر الحصار عن الشعب الفلسطيني .. ووو .. هكذا صرخ أحد الخرفان أو النعاج المجتمعين في قهوة عمرو موسى بميدان التحرير بالقاهرة يوم أمس .. طيب بعد إيه جاي تمأمأ يا تيس ؟؟؟ طبعاً سيقف الآن من يهاجمني قائلاً بأني كغيري من المصريين لا يعجبنا العجب .. وكان لازم نصفق لسرب النعاج الملمومين في قهوة موسى بالتحرير تعبيراً عن الفرح والانشراح الانشكاح بهذا القرار الشجاع.<br />كان يمكن أن نصفق ونفرح لو أن هذا القرار أتى منذ شهور .. أو حتى اليوم ولكن في وجود حكومة حماس وليس بعد إزالة حكومة حماس كما حدث اليوم برضه وبالتحديد #مش صدفة طبعاً# ، فالموضوع مرتب ومتوافق تماماً من الناحية الزمنية ، يتم التوصل إلى اتفاق بين حماس وعباس الأمريكي على ترك الحكومة وتشكيل حكومة بديلة لمن انتخبهم الشعب ويجتمع وزراء خارجية العرب ليعلنوا قرارهم بكسر الحصار في ذات اليوم الذي أعلن فيه التوصل لاتفاق.<br />طيب ما هو طبيعي لن يكون هناك حصار يا نعاج طالما ذهبت حماس ، لماذا كان الحصار من الأساس ؟ أليس حصاراً فرضه المستعمرون على حكومة حماس تحديداً لأنها لا تقبل ببيع الأرض والعرض؟ فإذا ذهبت حماس انفك الحصار أوتوماتيكياً يا خرفان ومش محتاج الموضوع للبقين الحمضانين اللي طلعتم بيهم دول عشان تعملوا علينا رجاله وتضحكوا على شعوبكم بيهم ، قال إيه كسرنا الحصار ؟؟؟ والنبي الناس دي ما عندهاش دم كده خالص ؟؟؟!!!<br />لا دم ولا حيا ولا عقل كمان ؟؟؟ ما هي مهروشة يا حمير ، لو فعلاً رجالة كنتم كسرتوه من شهر واحد بس ، لكن تقول إيه للنعاج؟؟؟ أنا لو مكان اسماعيل هنية كنت في اليوم التالي أعلن أنني لا أوافق على حكومة وحدة وطنية وسأظل أمثل الشعب الذي انتخبني وبخاصة أن إخواني العرب استفاقوا واستيقظوا ووقفوا بجانبي أخيراً وأعلن<br />اقرأ بقية التعليق .."
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211202/http://masr.20at.com:80/article.php?sid=1151"
