[[comments]]
order = 1
subject = "لو كتيبة دبابات اسرائيلية"
author = "مش فاهم حاجة"
text = "ماذا لو ارسلت اسرائيل كتيبة دبابات اسرائيل من المعابر واخترقت الحدود ودخلت سيناء<br />شوية عالم جوعانة اخترقت الحدود بسهولة جدا نظرا لعدم تسليح قوات الحدود وقلة عددها وشوية البنادق اللى معاها<br />اين يمكن ان تتوقف كتيبة الدبابات الاسرائيلية وتجد مقاومة مصرية ؟<br />شرق الممرات والا على شاطىء القناة<br />سيناء خالية من اى قوات<br />وكلنا هللنا لكامب دافيد<br />ومبروك سيناء رجعت لينا ولكن رجعت كيف والاعداء ممكن ان يستردوها فى ساعتين<br />على حكومتنا الرشيدة مراجعة بنود اتفاقية سيناء فى اول فرصة<br />اقتحام الفلسطينيين الحدود اوجد تساؤلات كتيرة فى الشارع المصرى<br />اللة يرحم الرئيس السادات"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043323/http://masr.20at.com:80/newArticle.php?sid=14162"
