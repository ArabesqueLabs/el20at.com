[[comments]]
order = 0
subject = "ضع عنوان التعليق"
text = "الكل كان بيعيب على الفلسطينيين وللأسف ما كنتش عارفة أرد عليهم من شدة صدمتى<br />خلاص نسينا اسراءيل... للدرجة دى احنا اغبياء ....<br />مش مكسوفين من انفسنا ... أنا مش باكلم بعاطفتى ... انا فاهمة خطورة دخولهم على مصر<br />لكن مين اللى ورا ده كله ؟!!!!! ياريت نفهم"
archived = "2008-02-12"
