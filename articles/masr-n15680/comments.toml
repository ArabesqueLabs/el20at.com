text = "هى دى بقى الخيابة و الاستعباط بعينة هى وصلت كمان المساوة فى شرع ربنا<br />نفسى واحده من اشاوسات المساواه تجاوبنى لية مش بيطالبوا بدخول الجيش ؟؟<br />لية لما تطلع الاتوبيس تفتكر انها انثى و تعيش دور مكسورة الجناح؟<br />لية لما تيجى فاتورة الكوفى شوب مابتحطش ايدها اللى تتشل فى جيبها وتدفع حسابها ؟؟؟؟؟؟؟؟؟"
