order = 0
subject = "نكتة قديمة"
author = "اها هاها"
posted = "2008-02-24"
text = "يحكى انة - رئيس دولة اروبية كان بيزور مصر وفى احد الجولات الميدانية عزم علية الرئيس بتاعنا ان يفرجة على الانجازات ومن ضمن الانجازات كوبرى 6 اكتوبر - وعندما وصل الى تحت الكوبرى وجد او شاهد الضيف الاروبى ناس بتتبول او تحت الكوبرى فا نقرف الضيف وجالة غممان نفس وقال اية القرف دة وقطع زيارتة ورجع لبلدة ومرت الايام وقام المسئول بتاعنا برد الزيارة وراح زار الدولة الاروبية دى وطالب من رئيس الدولة الاروبية زيارة اكبر كوبرى عندهم فأخذة الرئيس الاروبى الى اكبر كوبرى عندهم وهنا نظر الرئيس وقال - بص واحد بيتبول هناك اهوة جن جنون الرئيس الاروبى وطلب معرفة هذا الشخص فورا وجاءت التحريات بانة السفير المصرى هناك"
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226064640/http://masr.20at.com:80/newArticle.php?sid=14259"

[[comments]]
order = 1
subject = "اعذروا الناس"
author = "ابو الوطاويط"
posted = "2008-02-24"
text = "نحن اساتذة فى النقد والشجب والاستنكار - وكل واحد يقول مش انا دا واحد تانى لو كان هناك دورات مياة تحت الارض فى كل ميادين القاهرة وتحت الكبارى واماكن التجمعات وفى الجوامع او ملحقة بالجوامع والكنائس - لقضاء حاجة الناس المزنوقين فى زنقه - هل كنا نرى هذة المناظر المؤسفة ؟ هناك محافظ فى القاهرة مش شايف شغلة - ورئيس حى مش شايف شغلة ومهندس تنظيم بيضيع وقتة فى الثرثرة فى المكاتب ولا يوجد ميزانية ولا فلوس لمثل هذة الاشياء ولكن الفلوس مخصصة للمكافئات والمنح وتزويق مكتب سعادة المحافظ والسكرتارية شوارعنا بلا اشجار ولا ازهار ولا تجميل وكأن السادة المحافظون اللواءات سابقا حولوها الى مراكز تدريب للمجندين المستجدين وظهر القرف فى كل حياتنا بسبب عدم التنظيم وعدم اختيار الشخص المناسب لتولى الوظيفة العامة واخطرها وظيفة المحافظ المحجوزة لكل من كان لواءا سابقا"
archived = "2008-02-26"
capture_url = "https://web.archive.org/web/20080226064640/http://masr.20at.com:80/newArticle.php?sid=14259"

