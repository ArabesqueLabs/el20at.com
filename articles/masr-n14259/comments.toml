subject = "لا تتبول في شارعنا"
author = "http://asaadashour.blogspot.co"
posted = "2009-02-19"
text = "فكرة الموضوع هايلة خصوصا ان شوارعنا اصبحت تفتقد لكل اشكال النظافة.. وتخيل لما تكون المأساة مضاعفة وهي انك تجد احدهم واقف يبيع عيش أو عربية فول وعلى بعد خطوات قليلة جدا تجد حائط التبول والناس بتتعامل مع المسألة على انها مشهد ورائحة وتصرف طبيعي .. انا اسف بس احيانا كثيرة اشعر ان كثير من الناس فقدت الاحساس بالفرق بين القبح والجمال.<br />وده اللي جعل الناس لاتنظر للأمر على انه اختراق لآدميتنا جميعا.. احييكم على تناول هذه الموضوعات ويلا نبدأ حمله سويا تحت شعار لا للتتبول في شارعنا.<br />http://asaadashour.blogspot.com"
archived = "2010-03-14"
