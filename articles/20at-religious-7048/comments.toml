author = "فارس الخلافة"
posted = "2009-05-02"
text = "ان من يصف الخلافة بالرجعية هو انسان غير مؤهل قكريا وللأسف لا يفهم ما هي حقيقة الخلافة الاسلامية فهيتاج الفروض وبشر بها خاتم المرسلين صلى الله عليه وسلم: \".... ثم تكون خلافة على منهاج النبوة \"وهي في حقيقة الأمر عزة المسلمين.<br />وأذكر أن حدود الله وأحكامه قابلة في اي مكان وزمان للتطبيق وهي ليست موضة وذهبت كما يدعي البعض بل هي صالحة لأي مكان وزمان.<br />وأي مسلم عاقل لا يعمل لهذا الفرض فهو آثم<br />فاعملوا لاستئناف الحباة الاسلامية...."
