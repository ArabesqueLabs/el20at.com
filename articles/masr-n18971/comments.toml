subject = "شيعي ايه ومد ايه ومرشد ايه"
author = "مش شيعي"
text = "طيب ما هما الشيعة جم احتلوا مصر واصبحت مصر عاصمة دولتهم الفاطمية وهما اللي بنو الجامع الازهر لتدريس المذهب الشيعي<br />وبعدين حصل ايه<br />الشعب المصري رفض المذهب الشيعي وجه صلاح الدين وغير الازهر من المذهب الشيعي الى المذهب السني واسس الدولة الايوبية وعاصمتها مصر<br />الدولة الوحيدة اللي تبنت المذهب الشيعي هي ايران لاسباب يطول شرحها<br />وكل الشيعة العراقيين من اصل ايراني حيث انهم يحجون الى النجف وكربلاء ولا يرجعون الى بلادهم مرة اخرى"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 24
subject = "Read to Dr Zainab Abdel Aziz"
author = "Muslem Egyptian"
text = "تعقيب لا بد منه ..<br />ردا على الدكتور طارق عبد الحليم<br />بقلم الدكتورة زينب عبد العزيز<br />أستاذة الحضارة الفرنسية<br />أدهشتنى ردود الأفعال والتعليقات التى توالت حول مقالى المنشور بالمصريون تحت عنوان : \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"ترّهة إسمها : سنة وشيعة\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ، والتى تفاوتت لا بين التأييد والإنتقاد فحسب، وإنما تباين الإنتقاد فى لهجته أيضا، من عدم إتباع آداب الحوار فى الإسلام، إلى المغالطة والتجريح الوارد فى مقال السيد المهندس / الدكتور طارق عبد الحليم، المنشور فى نفس الموقع بتاريخ 22/12/2008 ، وهو ما سأتناوله بالرد حيث انه يضم إجمالا غيره من الإنتقادات..<br />وأول ما أبدأ به، كما أوضحته عدة مرات فى تعقيبى على تعليقات إخواننا المسيحيين ، أننى لست طرفا فى أى نزاع، كما أننى لا أنتمى إلى أى مؤسسة أو تنظيم، وكل ما يعنينى هو الدفاع عن دينى ، الذى بات يُقتلع بإصرار وشراسة مفروضة ومعلنة، وللأسف بتواطوء بعض المسلمين ، جهلا أو عن عمد ، من مختلف المستويات ..<br />ولتوضيح مدى التسرّع فى الرد وعدم فهم أو إدراك معنى ما كتبته، أحدد أننى لم أقل سوى : رجائى للقارىء بأن ينحى التراكمات جانبا، عند قراءة المقال، لفهم ما أود طرحه ؛ وكل ما قلته فى صُلب الموضوع هو: أن ننحّى الخلافات جانبا، \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"ن ن حّ ي \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ونتكاتف للدفاع عن الإسلام، فالتعاون دفاعا عن الإسلام لم يعد ضرورة فحسب وإنما أصلا هو فرض إلهى ونبوى! والمقال موجود بأرشيف الجريدة ويمكن لمن شاء أن يعيد قراءته. لذلك لا أرى ما الجرم الذى إقترفته لتنهال علىّ هذه الإعتراضات التى توّجها الدكتور طارق عبد الحليم بكل ما راح يكيله من فريات وإتهامات صريحة أو ضمنية تمويها لما قلته ..<br />وأبدأ بأن الرد العلمى يقتضى : فهم الموضوع الذى نتناوله بالرد، والرد علي النقاط الواردة أو مناقشتها.. أما العشوائية فى الرد والتكرار والسب المعلن او فيما بين السطور أو بالإنجليزية ، إعتمادا على التمويه وكيل التهم ، فلا يليق بمسلم ملتحى يحمل لقب تقنى وعلمى ويسهم فى توجيه الرأى العام بأى قدر كان .. وأهم ما آخذه علي الدكتور طارق هو :<br />* عدم فهمه لما كتبته، لذلك أرجو منه إعادة قراءة المقال عدة مرات حتى يستوعب ويدرك ما قلته فعلا ، دون تحميلى أية إضافات تحريفية للتشويش والمساس بمصداقيتى ، وهو ما تتبعه المدرسة الأمريكية فى سياساتها الهجومية الظالمة ، وخاصة دون القيام بأية إسقاطات ..<br />* أنا لا \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"أروّج\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" لأى حلم من أحلام التقارب الساذجة أو الإنفعالية ، فما أقوم به ليس ترويجا لسلعة من السلع البائرة يا حضرة الدكتور، وإنما أتمسّك بما قاله الله عز وجل فى القرآن الكريم، وما أوصانا به سيدنا محمد عليه الصلاة والسلام ، وخاصة ما راح يكرره فى خطبة الوداع التى تناولتها فى مقال سابق ، والمقال موجود بنفس الجريدة .. ومما يقوله الله سبحانه وتعالى وأتمسك به وأجاهد للإلتزام به :<br />- ولا تكونوا من المشركين، من الذين فرّقوا دينهم وكانوا شيعاً كل حزب بما لديهم فرحون (31-32/ الروم)<br />- واعتصموا بحبل الله جميعا ولا تفرقوا (103/ آل عمران)<br />- ولا تكونوا كالذين تفرقوا واختلفوا من بعد ما جاءهم البينات وأولئك لهم عذاب عظيم (105/ آل عمران)<br />- ولا تتبعوا السبل فتفرق بكم عن سبيله ذلك وصّاكم به علّكم تتقون (153/ الأنعام)<br />- أن أقيموا الدين ولا تفرقوا فيه (13/ الشورى)<br />* أما رسولنا صلوات الله عليه فقد حرّم دم المسلم على المسلم ، وساوى قيمة هذه الحرمة مرة بقيمة الحج ، وهو ركن من أركان الدين، و مرة أخرى سواها بالكفر فى نفس الخطبة ، وهو أسوأ ما يمكن لمسلم أن يقع فيه أو يوصف به ! \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"فالإختلاف والتنازع من أمر العجْز والضعف\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" وهذه أيضا من أقوال رسولنا الكريم فى خطبة اُحد ..<br />* أعتقد بعد قراءة آيات القرآن الحكيم وقول سيدنا رسول الله ، ستدرك يا دكتور طارق معنى ظلم قولك حول رفضى لوجود اختلاف وتقاتل بين المسلمين ، ذلك الرفض الذى وصفته قائلا: \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"فهو ما لا يقبله عقل ولا منطق ولا تاريخ ولا دين \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ، ثم قمت باستبعاد إحتمال تبرير فهمى هذا بأنه ليس \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"حسن نية وبراءة طوية \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"، لتسبنى بالإنجليزية بعبارة simpleton ، التى تعنى : غشيم وغبى يغرر به أو أحمق – وهنا لا يسعنى إلا شكرك ، فالشتائم لا مردود لها عندى !.. إلا ان الشهامة تقتضى أن تسبنى بنفس اللغة التى تكتب بها حتى يفهمها من يهللون لك ,,<br />* ولست مسؤلة عن كل ما حمّلتنى من تحريف للتاريخ وخلط فى المفاهيم وإتهامات، فأنا أعلم تماما متى نشأت الصهيونية والصليبية ، كما أعلم أن بداية ما أطلق عليه \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ترّهة \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ، بمعنى \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"تفريعة وتحوّل عن الطريق الرئيسى\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" وليس ترهة بمعنى \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" تفاهة \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" كما هو شائع خطأ وكما تصرّ أنت على استخدامها تحريفا وللمزايدة على قولى فى نظرك ، لذلك بدأت بشرحها فى بداية المقال من معجم لسان العرب لإبن منظور.. وأعرف ان مرجع هذا الصدع العميق بين سنة وشيعة، والبعيد كل البعد عن الدين، هم اليهود والنصارى ، الذين كانوا يحاربون الرسول صلوات الله عليه وواصلوا مكائدهم من بعده ونجحوا ، ويمكنك الرجوع إلى كتاب \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"بروتوكولات حكماء صهيون\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" لتفهم أصل التحريض .. وقد نجحوا فى تقسيم صفوف المسلمين لإبتعادنا عن الرسالة التى بلّغها لنا سيدنا محمد ، وحِدْنا عنها بالوقوع فى الصراعات، بل ونتمسّك بالصراعات والإبتعاد عن الرسالة بإصرار غريب .. وهنا لا يسعنى إلا أن أذكر بعبارة المؤرخ الفرنسى لانونيم ، المرافق للحملة الصليبية الأولى سنة 1005 ، موضحا : \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"أنها لم تنجح إلا بفضل إنقسام المسلمين واختلافاتهم \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\".. ويا لها من صفعة لمن يدرك معناها ومعنى ما نحن فيه ويتمسك باستفحال هذه الفتنة !.<br />* ولو كنت تتبع \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"العلم\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" و\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"المنطق\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" و\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"العقل\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" و\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"الدين\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" و\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"التاريخ \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" وكل ما رأيت اننى أفتقده ، لأدركت ان الغرب الصهيونى والمسيحى دأب على اختراق صفوف المسلمين ، منذ بداية إنتشار الإسلام وحتى يومنا هذا ، والعمل من خلال الأشخاص الذين ينجح فى اختراقهم أو فى استقطابهم .. فلو رجعت للتاريخ الذى \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"أجهله\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" تماما فى نظرك، لرأيت انه ما من مصيبة أحلت بالمسلمين فى أى عهد من العهود إلا وكان وراءها تنازل أو تواطؤ من واحد أو أكثر من \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"المسلمين\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" .. ولو تذكرت عبارة القس صمويل زويمر، كبير المبشرين فى مطلع القرن الماضى ، من أنه لن يقتلع الإسلام إلا أيديى مسلمين من الداخل ، لأدركت \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"بعلمك\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" و\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"ذكاؤك\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" معنى التبشير الصليبى الحالى الذى بات يتم علنا بسبب صمت أو تضامن بعض المسؤلين !..<br />* ولو رجعت إلى العلم والمنطق والعقل الذين لا أفقه فيها ذرة واحدة كما تقول، لرأيت كيف تم إستغلال المسلمين فى تنفيذ مآرب الغرب الصهيومسيحى فى هذه العقود الأخيرة ومن أهمها، كما يكتبونها صراحة ، فى حربهم ضد الأنظمة اليسارية ، حتى لا تكون هناك أنظمة بديلة عن الرأسمالية الإستعمارية ، التى يعانى منها العالم حاليا ، وإلا لما ظهرت عبارة \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"الولايات المتحدة كسلطة عسكرية متفردة فى العالم \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ! وهم يعيدون الكرّة حاليا بإستغلالنا فى حربهم ضد إيران ، الدولة المسلمة ، تنفيذا لمخطط الشرق الأوسط الجديد وكلها وقائع تناقش علنا .. مثلما تم غرس الكيان الصهيونى فى أرض فلسطين بالغدر والخيانة والتواطوء مع الغرب حتى نسلمها لهم \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"أرض بلا شعب لشعب بلا أرض\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" كما يريدون ..<br />* ولو رجعت إلى حقائق التاريخ التى \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"أحذفها\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" و\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"أنكرها\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" كما تقول، لعلمت ان المخابرات البريطانية أقامت تكتلا من هذه الخلافات منذ حوالى سبعين عاما ، وأن المؤسسة الكنسية غرست تكتلا آخرا من قبل الحروب الصليبية بكثير، وخاصة بعد إسلام العديد \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"جنود المسيح\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" كما يطلق عليهم فى تلك الحملات .. ولو تجولت بين الكتب أوالمواقع الإلكترونية ، كما فعلت انا \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"بجهلى\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ، لوجدت أن هناك أئمة من الوهابيين يبيحون دم الشيعة وأئمة من الشيعة يردّون بالمثل بداهة، رغم تحريم رسولنا لذلك، وكلها وثائق منشورة بأسماء من وقّع عليها .. ولا أعتقد - رغم \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"جهلى الشديد بالدين وبالتاريخ\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" فى نظرك، أن مثل هذه المواقف تمثل تطبيقا أو إلتزاما بما اُنزل إلينا من قرآن كريم ..<br />* ولو رجعت إلى المؤسسة الفاتيكانية ، لرأيت أن من أهم التنازلات التى قدمتها لها حفنة من أولئك المهرولين حديثا ، تلبية لمطالبها عبر مؤتمرات الحوار ، \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" أننا نعبد نفس الإله \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" نعم : أقروا وبصموا على ما معناه أننا نعبد نفس الإله الذى هو بالنسبة للكنيسة \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"ربنا يسوع المسيح\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"، وتلك هى الكلمة \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" السواء \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" التى خرجت بها المؤسسة الفاتيكانية لتواصل مسيرتها لتنصير العالم، الذى يجاهد بنديكت 16 للإنتهاء منه فى غضون هذا العقد، وفقا لما حدده مجلس الكنائس العالمى فى يناير 2001 .. فإلى متى سنظل نتنازل عن ديننا جهلا او عن عمد ؟!.<br />* ولو سمحت لى بسؤال يا دكتور ، بما انك توافق على كل ما جاء فى مقالى \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"من حقيقة تآمر الغرب الصليبى الداعم للوجود الصهيونى على الإسلام والمسلمين، وعلى أنهم لا يدعوا طريقا لإهلاك المسلمين والقضاء على دينهم إلا سلكوه، وأنهم لن يهنأ لهم بال إلا إذا قضوا على ما يعتبرونه الخطر الأعظم على دينهم ووجودهم من أعداء المسيح \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" .. هل ترى بعلمك ووعيَك وفهمك هذا ، ان تناحر المسلمين وتقاتلهم كفيل بصد هذه الهجمة الشرسة ، أم أنها تساعد على تنفيذها ؟! من الواضح أن \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"الخطأ المعيب على أقل تقدير\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" كما تقول والذى حملتنى معناه، يعود بكل جدارة على موقف من يعلم بكل هذه الحقائق، ويصر على التمسك بالتفريعات الجانبية، ويترك الأساس الذى يجب التكاتف للدفاع عنه .. فقد كنت أتخيل \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"جهلا\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" أن من يتقى الله فى دماء المسملين يكون نداءه : لنحتشد بكل قوانا ضد أمريكا وإسرائيل !<br />* وعار عليك ، نعم وأكررها : عار عليك أيها المسلم المثقف أن تحكم على عملى وعلى ما اقوله بأننى \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" أدارى خلفها حقائق التاريخ والحاضر\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"، و\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"أن هذا نهج آخر \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" ، وتتغافل وصفه لكى لا يؤخذ عليك ، وكأننى اقوم بالتزوير والتحريف ولى الحقائق كما تكرمت أنت وعملت فى مقالك وتسفيهك لما كتبت بكل ما كلته ، لمجرد أننى أعربت عن رأى مبنى على تعاليم القرآن الكريم وعلى وصية رسولنا صلوات الله عليه .. فكل كتبى ومقالاتى وأحاديثى تشهد بصراحة موقفى ووضوحه، بلا إلتواء أو تلاعب بالألفاظ ، وبلا أى تواطؤ مع أى إنسان أو مؤسسة ، وخاصة بلا إنسياق مغرض لأى تيار ! ..<br />* لو كانت كرامة السيدة عائشة وكرامة الصحابة، رضى الله عنهم جميعا، أهم وأكبر من كرامة قول الله سبحانه وتعالى، فأم المؤمنين والصحابة فى رحاب المولى، أما كلام الله عز وجل فى قرآنه الكريم فلا يضاهيه شيئا، وأمانة فى أعناقنا، علينا تكليف حمايته واستتبابه وليس العمل على إقتلاعه وضياعه !.<br />* أما عن تساؤلك من أنك لا تدرى \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" كيف سأقابل ربى يوم الحساب \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" بعد كل ما اقترفته من جرم برفضى وجود الفرقة والتناحر بين المسلمين ، فأؤكد لك أننى سألقاه بإذنه تعالى مرفوعة الرأس بعملى وإلتزامى بقوله ، وساجدة له حباً وخشوعاً ..<br />وأخيرا ، لا أملك سوى الإعتذار، لجميع من هللوا لرأي الدكتور، عن \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"جهلى\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" و\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"حماقتى\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" أو \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"غبائى\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" كما وصفنى بالعربية وبالإنجليزية، وعن عدم فهمى لمجريات الأمور، وعن تطاولى بأن تجرأت بالتعبير عن رأى ، مجرد رأى خلته - جهلا منى، أنه بسيط وواضح : أن ننحى الخلافات جانبا، ونتمسك بقول الله سبحانه وتعالى وقول رسوله الكريم، دفاعا عن الإسلام ، بدلا من التمسك بالإفك أيا كانت أنواعه ، وبالإتهامات والوقيعة أيا كان منبعها ، وبدلا من مواصلة التشبث بالإختلاف والتناحر على حساب ضياع جوهر الدين .."
