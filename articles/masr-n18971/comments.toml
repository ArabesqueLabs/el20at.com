subject = "ايه يا جناب المرشد العك ده"
author = "مش اخوان والحمد لله"
text = "كلامك ده بيحببنى فى الحزن الوطنى اللى بكرهه وبيأكد عندى انه احسن الف مرة منكم ومن فكركم ، المرشد وباقى الاخوان محتاجين يفرقوا بين العدو الظاهر و العدو الخفى ربنا يشفيكم ويعافيكم"
