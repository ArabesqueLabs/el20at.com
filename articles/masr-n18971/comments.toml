[[comments]]
order = 14
subject = "كلام المرشد واضح وصريح"
author = "نصير الغلابة"
text = "الشيعة وبقية المذاهب والفرق والطرق تضل ضئيلة العدد قياسا لغالبية المسلمين فى العالم من اهل السنة والجماعة ولذلك المرشد بيقول كويس يبقى فية مد اوشوية حراك للشيعة فى بعض الدول العربية والاسلامية ولكن بجهود ومرجعيات عربية مش تقولى ايران لان دول فرس مش عرب ولازم نقرا التاريخ كويس علشان نعرف الفرس والعجم بحق وحقيق"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 15
subject = "رد على سيد قطن (زخاري جرجس سابقا)"
author = "مش لازم"
text = "يا سيد قطن الاخوان المسلمين جماعة محظودورة نصف اعضائها في السجن وبرغم ذلك تحتل خمس مقاعد البرلمان<br />فهمت مين هما الاخوان يا حمار<br />وبعدين انت بتقول عليهم الخرفان<br />وانت اللي قلت قبل كده الخرفان تنكح النعاج المتأقبطين<br />سلام يا سيد قطن حاليا وزخاري سابقا"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 16
subject = "الى سيد قطن - زخارى وخنازير النصارى النجسة"
author = "برضة لا"
text = "سوف يحكم الاخوان المسلمون شئت ام ابيت<br />والاخوان المسلمون الان فى كل القيادات وفى جميع المستويات بحكم الطبيعة والاغلبية الساحقة<br />والحزن الوطنى نجح فى البرلمان بنسبة 20 % وليس الاغلبية وكل العالم يعرف ان امن الدولة ضغط على الاعضاء المستقلين لينضموا بالعافية الى الحزب الوطنى ومما يضحك لة ان بعض الاعضاء الاخوان من الاعضاء بعد الضغط عليهم انضموا للحزب الوطنى ليصير اغلبية عددية صورية فى البرلمان<br />فخلى الحسرة تحرق قلبك او خليها تاكلك<br />ومصير النصارى الهجرة عند قرايبهم الرومان<br />وستظل مصر اسلامية وقلعة الاسلام وكنانتة ورمز شموخة"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 17
subject = "مش اخوان بس باحترمهم"
author = "توفيق"
text = "انا باحترم راى المرشد بس لازم نعرف انة ايران دلوقتى اكبر خطر يهدد الامة العربية بتغيير الثقافة العربية الى ايرانية علشان تبقى متواكبة مع نشر المذهب الشيعى اللى مراجعة وقياداتة الدينية فى ايران زى مايقولو وبكدة حيدفع الخمس من دخل الدول والافراد المسدقين الكلام دة لملالى ايران ومن هناك تحرك الجبهات فى كذا دولة عربية من لبنان وفلسطين والعراق مرورا باليمن والحوثيين وشيعة الخليج فى السعودية والبحرين والكويت واكيد مصر والهدف بتاع الايرانين اكبر من نشر تشيع هدفهم محو الهوية العربية والدين الاسلامى السمح ونشر خرافات فارسية بعيدة عن الحقيقة"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
