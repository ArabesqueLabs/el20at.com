subject = "طظظظظظظظظظظظظظظظظظ فيكم ياولاد الوسخة يا متاسلمين فقط بالكلام"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "حسبى اللة و هو نعم الوكيل<br />مليون الف طظ و طظ فيكم وفى عقولكم الصدئة البالية<br />بلاش فتاوى متخلفين<br />مصر باقية و الاقباط باقيين و انتم يا جماعات الاخوان المسلمين اسما فقط ليس لكم اية اماكن سوى السجون و المعتقلات و بالوعات الجهل الاسوج و الحقد السام<br />اشربوا من بولكم العفن<br />ملعون ابو اللى خلفوكم فى الحرام"
