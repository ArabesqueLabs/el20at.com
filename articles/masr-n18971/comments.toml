subject = "دوختونا !"
author = "ahmed ali"
text = "و دي عاوزه اتنين. طبعا حكومة مصر تقف مع اسرائيل ضد غزة. انتو شفتو الريس كان بيسمع زي طالب مؤدب اللعينة تسيفي ليفني من قلب مصر العروبة و هي بتهدد بحرق غزة. وهي عملتها. حاجة تانية, انتو دوختونا بالمد الشيعي, و لا تكلمتو على المد الوهابي المدمر و الارهابي. يا عم المد الشيعيي عندي اهون من الوهابي. على الاقل الشيعة بتناقشك بعقل مش الوهابية يناقشك بقنبلة!!"
