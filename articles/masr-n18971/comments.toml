order = 27
subject = "والخرفان تنكح النعاج امثالك"
author = "مش لازم"
text = "احنا عارفين انك مسلم كل كلامك بيقول كده ومتأكد ان الاسلام دين الحق وعارف ان العهد القديم والعهد الجديد شوية كلام فارغ في فارغ وعارف ان القران هو كلام الله الحق وانت وكل المسيحيين عارفين هذا الكلام ودايما بيستشهدوا بايات القران العظيم<br />لكن المشكلة ان المسيحي الذي يعرف الحق ينقسم الى اثنين<br />واحد يجري ويعلن اسلامه زي (الدكتور وديع احمد) كده الاسكندراني<br />وواحد بيحقد على المسلمين ويستكبر عن الدخول في الاسلام وانت في هذه الحالة<br />انت في حالة الاستكبار والحسد<br />بلاش تغالط نفسك اكتر من كده يا زخاري<br />يا زخاري المصريون كلهم دخلوا في الاسلام واصبحت النسبة 94% مش ناقص الا 6% وهم في طريقهم الى الاسلام<br />روح يا ابني انطق الشهادتين وبلاش استكبار واستعلاء بالباطل<br />المسيح الحق ومريم الحق هما المذكوان بالقران<br />وربنا يهديك يا زخاري"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"
