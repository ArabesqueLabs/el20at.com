[[comments]]
order = 0
subject = "والشيعة هم اخواننا واهلينا"
author = "لية"
text = "المذهب الشيعى مذهب اسلامى صحيح زى المذهب الوهابى والحنبلى وابو حنيفة<br />انا لا اعادى ايران او حزب اللة علشان امريكا واسرائيل بيعادوهم والحكومة تتبع امريكا واسرائيل<br />انا مع حزب اللة وايران فى عدائهم لاسرائيل وامريكا<br />ونؤيد ان تمتلك ايران قنبلة ذرية ومصر تمتلك عشرين قنبلة ذرية<br />المرشد بيتكلم بعواطف راجل الشارع<br />وان كنت اعتقد انة جبان فى امور كثيرة من المفروض ان يتكلم فيها<br />واعرف ان الاخوان انتهازيون وبيهادنوا كثيرا رغم قوتهم فى الشارع"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 1
subject = "لا للشيعة"
author = "فهد"
text = "بسم الله الواحد الا حد وصلاة وسلام على سيدا البشرية سيدنا ومو لنا محمد علية افضل الصلا ة والتسليم الا خ العزيز لية اولا المذهب الشيعى ليس مذهب اسلامى صحيح والوهابية ليس مذهب بل هى حركة تطهير قام به الا مام محمد بن عبد الوهاب نحن لا نعادى ايران من اجل انه ايران ولكن يا اخى اقرا التا ريخ جيدا واعلم ان الشيعة هى سبب فرقة المسلمين وهم سبب هدم الخلا فة الا سلا مية اتحب ان تسب ام المو منين عا يشة او عمر ابن الخطاب او اى احد من صحابة رسول الله هو لاء هم الشيعة انت با لنسبة لهم نجس لا نك سنى اقراء الى الها لك الا عظم المغضوب علية الخمينى الذى يقول ان سيدنا محمد لم يبلغ الر سالة على اكمل وجة وان محمد لم يوافق فى اختيار اصحابة هو لاء هم الشيعة يا اخى العزيز الشيعة هم من حولا العراق بلد الحضارة الا سلا مية الى خراب اقراو التار يخ وتلعلمو الدروس جيدا احمدى نجاد هذا الذى يدعى ان وحى يا تية من السماء فهو شيعى متعصب عندما يقوم من نومة اول شياء يقولة اللهم العن الشيخين ابى بكر وعمر هولاء يتهمون ام المومنين عايشة حببة رسول الله ص بلزنا فهل هولاء مسلمين اقراء واسمع للشيزارى وللكلب ياسر الحبيب وللقمى واعرف يا اخى مع من تتعمل فهولاء اشر من اليهود واضل اقر الفتنة الكبرى واعرف من كان السب فيها فهم فى الا صل مجوس دخلو الا سلام صورين لخوفهم من بطش الا سلام عليهم اسال عن عبد الله بن سلول واسال عن شمر البجوشى واسال عن قال سيدنا عمر بن الخطاب الذى لهو مقام عند الشيعة يسمى ابونا شجاع الدين لماذا لا نة قتل سيدنا عمر ومن عمر فاروق الله فى الارض حمى حمى الا سلام بعد رسول الله اكبر الفتوحات فتحت فى عصر عمر ومنها بلاد فارس هل فهمت لماذ يكرهون عمر اما عن الا خوان المسلميسن فهم اتضج انهم جماعة طبل وزمر من غير فايدة ومهدى عاكف هذا سياسى فاشل ورحم الله الا مام الشهيد حسن البناء"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

