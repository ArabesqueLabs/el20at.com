[[comments]]
order = 11
subject = "والمذهب الشيعىيعرف اتباعة اصول الدين الحنيف ويعرفون اعداء الاسلام"
author = "مسلم سنى"
text = "رموز المذهب السنى سواء الوهابيون فى السعودية او العلمانيون فى مصر او باكستان اوليائهم الامريكان واسيادهم الانجليز الذين وضعوهم على كراسى الحكم<br />اما الشيعة فهم فى رباط وجهاد لاهل الكفر والاستكبار<br />ان حزب كحزب اللة الشيعى او صل صواريخة الى اماكن فى اسرائيل لم تستطيع جيوش السنة مجتمعة ان تطلق حتى حصوة تصل ارض اسرائيل وصمد حزب اللة شهرا كاملا بينما اكبر الجيوش العربية من اهل السنة هزم فى ست ساعات امام اسرائيل<br />هل الشيعة يختلفون عن السنة فى الخمس فروض ولا فى اركان الاسلام<br />انا ارى انهم اكثر اسلاما من ادعياء السنة واكثر رفعة للدين من اتباع امريكا"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 12
subject = "وشرق السعودية كلة شيعة والبترول السعودى يستخرج من ارض شيعية"
author = "واحد"
text = "الى عملاء امريكا الذين تسحبهم ورائها كما تسحب الكلاب<br />منطقة شرق السعودية كلها شيعة وفى خطط امريكا حليفتهم ان تفصلها عن السعودية وتضمها الى الكويت وتجعلها دولة شيعية<br />ودبى كلها او 90 % منها شيعة ايرانيون ويفتخرون بذلك<br />وسوريا تحكمها الاسرة العلوية فحافظ الاسد شيعى علوى من العلويين فمن الطبيعى ان يؤيد الشيعة فى ايران والشيعة فى حزب اللة<br />والمغرب تحكمه اسرة شيعية فاطمية وملك المغرب هو امير المؤمنين وسليل اسرة الحسن والحسين<br />والسودان تحكمة الطرق الصوفية كالمهدية والخاتمية وهم فى اصول تفكيرهم متصوفة شيعة<br />يبقى من<br />خادم الحرمين فى مكة والمدينة<br />وخادم الهرمين والسياحة فى مصر العلمانى<br />مرحبا بالشيعة<br />واهلا بيكم"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

