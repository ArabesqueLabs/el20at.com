subject = "شيخ خرف باللة العظيم"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "قالو زمان(ان لم تستح فافعل ما شئت؟)<br />و اليوم اقول لهذا الشيخ الخرف(ان لم تستح فقل ما شئت؟؟)<br />لا اكثر اللة من السفهاء امثالك!!!"
