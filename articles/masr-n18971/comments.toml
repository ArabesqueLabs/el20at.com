subject = "الى زخاري جرجس"
author = "مش ضروري"
text = "انت راجل اسكندراني<br />اذا كان ليه مشاكل مع الاخوان روح للدكتور ابراهيم الزعفراني في اسكندرية هو مسئول الاخوان هناك واتفاهم معاه<br />ودا الموقع بتاعه على النت http://zafarany.blogspot.com/<br />والمعلومة اللي عندك ان الاخوان اعداء الاقباط دي معلومة غير صحيحة لان الاخوان دلوقتي بينزلوا اقباط باسمهم في الانتخابات<br />احنا هنا مش اخوان ولا ننتمي الى اي حزب سياسي<br />معلقين ولاد البلد طهقانين من كل اوضاع مصر"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 20
subject = "العريان: الإخوان دعموا الأقباط في الانتخابات"
text = "العريان: الإخوان دعموا الأقباط في الانتخابات<br />كشف عصام العريان القيادي بجماعة الإخوان المسلمين عن أن الجماعة حرصت على دعم مرشحين أقباط في الانتخابات التشريعية الجارية؛<br />إيمانا منها بأن الأقباط شركاء في الوطن ومتساوون مع المسلمين في الحقوق والواجبات.<br />وفي حوار مباشر مع إذاعة إسلام أون لاين.نت، تحدث العريان عن مظاهر هذا الدعم، فأوضح قائلا: إن الجماعة دعمت مرشحًا مسيحيًّا في دائرة وادي النطرون (حوالي 110 كيلومترات شمال القاهرة)، لكن المرشح حريص على ألا نعلن عن ذلك بوضوح. وتابع: \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"يأخذ دعمنا شكل التحالف الانتخابي الحقيقي، حيث تعطي الجماعة أصواتها للمرشح القبطي\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"..<br />وأضاف: \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"كما أن اللجنة العامة المشرفة على الانتخابات في جماعة الإخوان تسعى من وقت لآخر للدفع بعدد من الأقباط للفوز بمقاعد في البرلمان القادم، كما تقوم اللجنة بإخلاء دوائر انتخابية للأقباط\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\".<br />واستشهد على النقطة الأخيرة بقوله: \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"أخلينا دائرة الوايلي للمرشح القبطي منير فخري عبد النور، ودائرة غربال بمحافظة الإسكندرية للمرشح ماهر خلة\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"."
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

