[[comments]]
order = 3
subject = "من حق الشيعة سب عمر وابو بكر اذا سب الامويون على ابن ابى طالب والحسن والحسين والسيدةفاطمة"
author = "مسلم سنى"
text = "نعم وبلاش كلام فارغ ومكرر وساذج<br />اول من سب على ابن ابى طالب وسيدنا الحسن والحسين والسيد فاطمة من على المنابر وفى خطب الجمعة هم الامويون اولاد معاوية وكانت خطب الجمعة تنصب على سبهم ولعنهم فرد الشيعة على ذلك بسب ابوبكر وعمر<br />الناس لم يبدأوا بالشتم ولا بالسب ولكن بنى امية الذين ورثوا الحكم وابطلوا نظام الخلافة هم من فعل ذلك<br />فلا داعى لان يتاجر علينا احد ويقول ان الشيعة يسبون الصحابة<br />احنا فاهمين التاريخ كويس<br />وعارفين امريكا بتزق مين من العرب العملاء علشان يهاجم ايران وحزب اللة وحماس"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 4
subject = "الى زخارى - جاء فى العهد القديم - حزقيال 232"
author = "مرقص"
text = "قال حزقيال عن الاقباط النصارى<br />ان لحمكم كلحم الحمير ومنيكم كمنى الخيل<br />وقال اشعياء 4020<br />عن الاقباط<br />والشيوخ عراة وحفاة ومكشوفو الاستاة جمع است - خزيا لنصارى مصر<br />اقعد يا زخارى وطلع الانجيل واقرا فى العهد القديم ولا تتكلم عن اسيادك واسياد ابوك"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 5
subject = "رد على مسلم سني"
author = "مش ححبك"
text = "للاخ مسلم سني اللي انت بتقوله دا مش كلام اهل السنة والجماعة ابدا<br />اهل السنة والجماعة بيقولوا تلك امة قد خلت لها ما كسبت ولكم ما كسبتم ولا تسئلون عما كانوا يعملون<br />اللهم كما رفعت ايديا عن هذه الفتن فارفع السنتنا عنها<br />هذا هو كلام اهل السنة والجماعة يا ابني"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 6
subject = "قصة أهولة و أختها أهوليبة. في حزقيال ( 23 : 22 ) يقول :"
text = "قصة أهولة و أختها أهوليبة. في حزقيال ( 23 : 22 ) يقول :<br />يا ابن آدم :<br />كان هناك امرأتان ابنتا أم واحدة وزنتا بمصر في صباهما ،<br />هناك دغدغت ثدييهما ،<br />وهناك تزعزعت ترائب عذريتهما.<br />واسمهما اهولة الكبيرة وأهوليبا أختها.<br />وزنت أهولة من تحتي ولم تترك زناها من مصر أيضًا لأنهم ضاجعوها في صباها.<br />وزعزعوا ترائب عذريتها وسكبوا عليها زناهم.<br />لذلك سلمتها ليد عشاقها الذين عشقتهم.<br />هم كشفوا عورتها.<br />فلمّا رأت أختها أهوليبة ذلك أفسدت في عشقها أكثر منها وفي زناها أكثر من زنا أختها.<br />عشقت بني أشور فرسانَا راكبين الخيل كلّهم شبّان شهوة.<br />وزادت زناها.<br />ولمّا نظرت إلى رجال مصورين على الحائط عشقتهم عند لمح عينيها إياهم.<br />وأرسلت إليهم رسلاً فأتاها بنو بابل في مضجع الحبّ ونجّسوها بزناهم...<br />وأكثرت زناها بذكرها أيّام صِبَاها الّتي فيها زنت بأرض مصر.<br />وعشقت معشوقيهم الذين لحمهم كلحم الحمير ومنيهم كمني الخيل.<br />وافتقدتِ رذيلة صباكِ بزغزغة المصريين ترائبك لأجل ثدي صباكِ.<br />الله هو من يعاقبهم فيوقعهم في الزّنا :<br />حزقيال ( 23 : 22 ) لأجل ذلك يا أهوليبة ،<br />قال السّيّد الرّب :<br />ها أنذا أهيج عليك عشاقك ،<br />ينزعون عنك ثيابك...<br />ويتركونك عريانة وعارية ،<br />فتنكشف عورة زناك ورذيلتك .<br />تمتلئين سكرًا وحزنًا كأس التّحيّر والخراب...<br />فتشربينها وتمتصّينها وتقضمين شقفها.<br />وتجتثّين ثدييك لأنّي تكلّمتُ.<br />فهوذا جاءوا.<br />هم الذين لأجلهم استحممتِ.<br />وكحّلتِ عينيك وتحلّيت بالحليّ.<br />وجلستِ على سرير فاخر...<br />فقلت عن البالية في الزّنا الآن يزنون زنًا معها.<br />(عامو 7: 16) وقال الرّبّ لمصيا: أنت تقول لا تتنبّأ على إسرائيل. لذلك قال الرّبّ: امرأتك تزني في المدينة وبنوك وبناتك يسقطون بالسّيف."
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 7
subject = "لماذا لانرمي هذه الكتب ياقداسة البابا ونحتكم للقرآن"
text = "لماذا لانرمي هذه الكتب ياقداسة البابا ونحتكم للقرآن<br />http://popekirillos.net/ar/books/pernaba/5.gif<br />[align=right]<br />المسيحيين لايعترفون بإنجيل برنابا لأنه يتكلم وبكل وضوح عن نبوة الرسول الكريم محمد . ونحن كذلك لانؤمن به لأن الله أبدلنا خير منه<br />وهو القرآن الكريم بالإضافه لوجود الكثير من التحريفات والتغييرات . قداسة البابا يرفض إنجيل برنابا ويحاول في هذه المره أن يبرر<br />السبب الرئيسي لرفض هذا الإنجيل . يقول قداسة البابا كلام مهم جـــــــــــــــــــداً<br />يقول قداسة البابا :- أو ماكان يمكن أن استخدام لفظة أخرى غير البراز ؟وهل هذا يمكن اسلوب يقوله المسيح ؟ لو أخذنا كلام البابا وجعلناه مقياس<br />على الكتاب المقدس لحذفنا الكتاب المقدس بالكامل.فأين قداسة البابا عن النصوص التي في حزقيال وفي سفر نشيد الإنشاد !!<br />فخذ على سبيل المثال هذه النصوص<br />(ترجمة الفانديك:حزقيال:4:12)<br />وتأكل كعكا من الشعير. على الخرء الذي يخرج من الإنسان تخبزه أمام عيونهم<br />(الترجمة العربية المشتركة:حزقيال:4:12)<br />وكل طعامك رغيفا من الشعير مخبوزا على نار من زبل الإنسان أمام عيونهم<br />ألا يمكن إستخدام لفظة أخرى غير ( الخرء و الزبل )وهل يمكن أن يكون هذا أسلوب يقوله المسيح ياقداسة البابا ؟ أليس البراز<br />هو نفسه الخرء ؟<br />فلو برنابا قال خرء بدلاً من براز هل يصبح إنجيله مقدس ؟ اليس المفروض وحسب مقياسك يجب<br />أن نرمي بحزقيال ونشيد الإنشاد وغيرها عرض الحائط لأنها تحتوي على كلمات غير لائقه وبذئه؟"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 8
subject = "ضع عنوان التعليق"
author = "فهد"
text = "ايها الجاهل المتنطع ملنا ومال بنى امية او العبا سين او الفا طمين نحن نتكلم عن سب صحا بة رسو ل الله ص الذى قا ل عنهم اصحابى كا لنجوم نحن نتكلم عن الا سلا م لا عن سنة ولا شيعة واشك انك مسلم اصلا ان كان بنى امية سبوا سيدنا على والا بيت رسول الله فجزاهم عند الله ولكن نحن مسلمين اسلمنا وجهنا الى الله تعالى وان كان على سيدنا على وابناة والسيدة فا طمة راضوان الله عليهم جميعل فنحن معشر اهل السنة اكثر ناس تجل وتقدر الا بيت رسو ل الله ص اما انت وامثالك يا من تولون دولة الكفر وهى ايران وحزب الشيطان بتاعك فان الا سلام منكم براء واتحدك ان كنت تقراء تاريخ اصلا فحسبى الله ونعم الوكيل فى كل من اراد بلا سلام سو ا"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

[[comments]]
order = 9
subject = "الخوف دلوقت من السنة اللى معجبين بالشيعة"
author = "ربنا يهدينا ويهديهم"
text = "للاسف كل واحد سمع كلمتين صدقهم والمصيبة انه عاوز يقنعنا بيهم .النجم اللى بيقول الامويين سبوا سيدنا على و السيدة فاطمة على المنابر بجد والله حرام عليك التخريف اللى بتقولو ده قبل ما تقول اى كلام اتأكد من مصدر الكتاب اللى بتقرأ فيه وبعدين المسلمين مش قاعدين بيلعبوا السنه اللى مش مؤدبين بدأو الشكلة وشتموا سيدنا على فالشيعة الملايكة مستحملوش وقاموا عن بكره ابيهم وسبوا الشيخين ده يا نجم كلام مصاطب .<br />حاجة كده لمعلومات جنابك بدون قراءة فى اى تاريخ السنه اكثر حبا وتقديرا لسيدنا على والسيده فاطمة شأنهم شأن سائر الصحابة رضوان الله تعالى عليهم أجمعين الشيعة هم من يسيئوا لآل البيت بأفعالهم وأقوالهم التى بها قدر كبير من الغلو"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235632/http://masr.20at.com:80/newArticle.php?sid=18971"

