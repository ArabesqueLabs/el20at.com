text = "هو في الأساس حكمه للبلد باطل وليس من حقه ان يجلس في هذه السلطة<br />- هل في الانتخابات الشرعية تقدم اكثر من نصف الشعب للانتخابات<br />- هل هي كانت انتخابات حقيقة فعلا ولا كلها تزوير وطلعت نسبة في الاخر 89% رغم انا من اول الناس اللي مش معي بطاقة انتخاب ولا حتى شفتها ."
