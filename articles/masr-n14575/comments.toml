subject = "من المخطئ"
author = "سيف ا لحق"
posted = "2008-03-11"
text = "هل ان فخامة الرئيس الموقر هو من اخطأ في حق الشعب أم ان الشعب هو الذي اخطأ في حق نفسه لأن صبر على الذل والمهانة ورضي بالظالم أن يقهر قوته ويمنع عنه حتى الخبز أن يأكله ، انا من رأيي أن من يرضى بالذل خوفا على نفسه من الموت يست أن يفعل به ذلك لأنه أصبح أن يخاف من بشر مثله ولا يخاف الله .<br />- لما لا نسأل نفسنا أن الله سلط علينا رجل ظالم لأننا نشرنا الفساد في البلاد رغم انه قليل وليس بالكثير من باقي دول العالم لأكن يوجد في أرضنا مفاسد ولو خشينا الله في أنفسنا وقمنا وألقيناه هو وأبنائه والحراميه اللي معه في البحر ده المفروض يون اقل شيء ،،"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234150/http://masr.20at.com:80/newArticle.php?sid=14575"
