[[comments]]
order = 0
subject = "ناصحوا ولاة الأمر وادعوا لهم بالصلاح"
author = "مش ضروري (نقلا عن موقع صيد الف"
posted = "2008-03-10"
text = "ناصحوا ولاة الأمر وادعوا لهم بالصلاح<br />أثر عن أحد السلف أنه قال: (لو كان لي دعوة صالحة لصرفتها للسلطان)، وإن الله ليزع بالسلطان ما لا يزع بالقرآن.<br />إننا أيها الإخوة نمر بمرحلة حرجة في تاريخ الأمة الإسلامية تحتاج منا إلى وقفة صادقة ومنهجية واضحة في التعامل مع هذه الأحداث التي تخرج الأمة من عنق الزجاجة، ومن هذه المحنة وهي أصلب عودًا وأشد تماسكًا، وإن أهم أركان هذا التماسك هم الحكام والعلماء والشعوب، وإن المنهج الشرعي مع الحكام حتى وإن جاروا: الصبر؛ (ما لم نرَ كفرًا بواحًا عندنا من الله فيه برهان)، {يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللهَ وَأَطِيعُوا الرَّسُولَ وَأُولي الأَمْرِ مِنكُمْ}(1)، وفي الحديث عن ابن عباس رضي الله عنهما قال: قال نبي الله ‘: ((من رأى منكم من أميره شيئًا فكرهه فليصبر فإنه ليس أحد يفارق الجماعة شبرًا فيموت إلا مات ميتة جاهلية))(2).<br />ولنا في هذا وقفات:<br />1- لا طاعة لمخلوق في معصية الخالق:<br />قال أبو بكر رضي الله عنه حين تولى الخلافة (أطيعوني ما أطعت الله فيكم، فإذا عصيت الله ورسوله فلا طاعة لي عليكم).<br />قال ابن عثيمين رحمه الله: (فإذا أمر ولي الأمر بمعصية من المعاصي فإنه لا يجوز لأحد أن يسمع له ويطيع؛ لأن ملك الملوك رب العالمين عز وجل، ولا يمكن أن يعصى رب العالمين لطاعة من هو مملوك مربوب)(3).<br />2- لا ننازع الأمر أهله:<br />يقول ابن عثيمين رحمه الله: (لا ننازع ولاة الأمور ما ولاَّهم الله علينا لنأخذ الإمرة منهم؛ فإن هذه المنازعة توجب شرًّا كثيرًا وفتنًا عظيمة وتفرقًا بين المسلمين، ولم يدم للأمة الإسلامية إلا منازعة الأمر أهله من عهد عثمان رضي الله عنه إلى يومنا هذا، ما أفسد الناس إلا منازعة الأمر أهله)(4).<br />3- نقول كلمة الحق ولا نخاف في الله لومة لائم:<br />نعم؛ نقول كلمة الحق أينما كنَّا ولا يتنافى ذلك مع النصح لولاة الأمر والدعاء لهم، فلقد كان هذا ديدن العلماء قديمًا وحديثًا كالإمام أحمد بن حنبل وشيخ الإسلام ابن تيمية وابن باز وغيرهم مع مراعاة القواعد الشرعية المعتبرة كالأخذ بأخف الضررين وغيرها.<br />4- نكف ألسنتنا عن أعراض الأمراء والعلماء في المجالس:<br />يقول ابن عثيمين رحمه الله: (تجد بعض الناس همُّه إذا جلس في المجلس ما يستأنس إلا إذا أمسك عالمًا من العلماء أو وزيرًا من الوزراء أو أميرًا من الأمراء أو من فوقه ليتكلم في عرضه، وهذا غير صحيح، ولو كان هذا الكلام يجدي لكنا أول من يشجع عليه...) إلى أن قال رحمه الله: (.. ولكنه لا يجدي، إنما يوغر الصدور ويكرِّه ولاة الأمور إلى الناس ويكرِّه العلماء إلى الناس ولا يحصل فائدة)(5).<br />قلت: والبعض عفا الله عنه يجرح الولاة في المجالس حتى إذا قابلهم فإذا به يقبل الأيادي ويظهر الولاء!! فلمَ هذه الازدواجية، أما العلماء المشهود لهم بالفضل فلحومهم مسمومة، ومن اجتهد فأصاب فله أجران، ومن اجتهد فأخطأ فله أجر، والماء إذا بلغ القلتين لم يحمل الخبث.<br />ومع ذلك كلِّه فإن الأمة بحاجة إلى علماء يفتح الله عليهم في أيام المحن وانتشار الفتن، يقولون كلمة الحق ولا يخافون في الله لومة لائم حتى ولو جلدت ظهورهم وصارت منازلهم في غياهب السجون؛ فلهم أسوة حسنة بالإمام أحمد رحمه الله.<br />([1]) النساء.<br />([2]) رواه البخاري.<br />([3]) شرح رياض الصالحين، 512.<br />([4]) محمد بن صالح العثيمين، شرح رياض الصالحين، 512.<br />([5]) محمد بن صالح العثيمين، شرح رياض الصالحين، 520."
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234150/http://masr.20at.com:80/newArticle.php?sid=14575"

