subject = "التعديلات الدستورية باطلة"
author = "قانونى"
posted = "2008-03-10"
text = "كيف يتم تعديل دستور وهو معطل اثناء التعديل وبعد التعديل<br />كيف تكلم الناس عن تعديل الدستور وهم خاضعون لقوانين الاحكام العرفية او احكام الطوارىء وهى تلغى الدستور تماما<br />الناس يعدلون شيئا يمارسونة<br />اما شيئا لم يرونة طوال 26 سنة ويعدلون فية فذلك شىء باطل شرعا وقانونا<br />الاحكام العرفية تلغى الدستور<br />وتطلق حرية الاعتقالات بدون اى سبب<br />ثم من قال ان حسنى مبارك كان سياسيا فى يوم ما<br />لقد كان طيارا محترفا ولا يعرف ابجديات السياسة با عتراف السادات نفسة<br />والنتيجة ما نرى"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234150/http://masr.20at.com:80/newArticle.php?sid=14575"

