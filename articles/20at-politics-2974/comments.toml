subject = "حقا إنه عالم عاهر !!"
author = "طيف بدر- مدونة آل ياسر"
text = "http://alayasser.maktoobblog.com<br />جملة سمعتها اليوم على الجزيرة : \"العالم الذي يسكت اليوم على الغزو الأتيوبي للصومال و الجرائم التي ترتكبها أثيوبيا بحق الصوماليين لن يكون ساكتا هكذا عندما يرد المجاهدون بقوة في عمق أدبس أبابا و ساعتها سيحددون من الجاني و من المجني عليه \"<br />إخواني في الصومال المظلوم ...ماذا أقول لكم و انا لست إلا إمرؤ يجلس أمام شاشة حاسوب و لكنكم أنتم تصنعون تاريخ البطولة و الكرامة بثيابكم البسيطة و أرجلكم شبه الحافية التي سحقت صراصير واشنطن من قبل... واشنطن التي تستعين اليوم بكلبها زيناوي عوضا عن صراصيرها السابقين في الصومال من تجار المخدرات<br />أحفاد بلال (رضي الله عنه) .. خير ما أقوله لكم هو قول الله عز و جل<br />الَّذِينَ اسْتَجَابُوا لِلَّهِ وَالرَّسُولِ مِنْ بَعْدِ مَا أَصَابَهُمْ الْقَرْحُ لِلَّذِينَ أَحْسَنُوا مِنْهُمْ وَاتَّقَوْا أَجْرٌ عَظِيمٌ (172) الَّذِينَ قَالَ لَهُمْ النَّاسُ إِنَّ النَّاسَ قَدْ جَمَعُوا لَكُمْ فَاخْشَوْهُمْ فَزَادَهُمْ إِيمَاناً وَقَالُوا حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ (173) فَانْقَلَبُوا بِنِعْمَةٍ مِنْ اللَّهِ وَفَضْلٍ لَمْ يَمْسَسْهُمْ سُوءٌ وَاتَّبَعُوا رِضْوَانَ اللَّهِ وَاللَّهُ ذُو فَضْلٍ عَظِيمٍ (174) إِنَّمَا ذَلِكُمْ الشَّيْطَانُ يُخَوِّفُ أَوْلِيَاءَهُ فَلا تَخَافُوهُمْ وَخَافُونِي إِنْ كُنْتُمْ مُؤْمِنِينَ (175)<br />آل عمران<br />أما هنا في دياري فنحن لم نتخلص من صراصير الليبراليين و ديدان المتصهينين السلوليين الذين وجدوا جحرانا تأويهم في الصحافة و الإعلام ، هذه الذئاب الداعرة التي لن تعوي إلا عندما تشتد ضرباتكم بحول الله تعالى على العدو الأثيوبي إمتثالا لأوامر أسيادهم خلف المحيط و إشباعا لنفوسهم المريضة الكارهة للإسلام و لليوم الذي ولد فيه محمد بن عبد الله (صلى الله عليه و آله و صحبه و سلم)<br />إِنْ تَمْسَسْكُمْ حَسَنَةٌ تَسُؤْهُمْ وَإِنْ تُصِبْكُمْ سَيِّئَةٌ يَفْرَحُوا بِهَا وَإِنْ تَصْبِرُوا وَتَتَّقُوا لا يَضُرُّكُمْ كَيْدُهُمْ شَيْئاً إِنَّ اللَّهَ بِمَا يَعْمَلُونَ مُحِيطٌ (120)<br />آل عمران<br />إخواني المجاهدون ...<br />قاتلوا الغزاة بسلاحكم و قبله إيمانكم بالله و قرآنكم و دعونا هنا نرد غيبتكم و نجعل أقلام الحشرات السلولية الحقيرة تكون عليهم حسرة ثم لا ينتصرون"
