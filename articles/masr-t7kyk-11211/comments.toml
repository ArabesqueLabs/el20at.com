[[comments]]
order = 0
subject = "يولد الانسان غبيا ويموت كذلك"
author = "اكتب اسمك هنا"
posted = "2009-02-07"
text = "محافظ مش غبى ولكن معتوة<br />سيادتة شاف ان الجرارات منظرها مش عاطفى او حضارى او شكلها بيئة خاص - فأخذ فرمانا او قرارا بالغاء الجرارات<br />سهل جدا ان نأخذ قرار ------ ولكن حينما اخذ قرار الغاء الجرارات لم يفكر فى البديل الذى يوصل للناس الانابيب الى بيوتهم<br />الناس عندة ليس لهم قيمة<br />ليتعذبوا او يطلع عين ابوهم او تتعذب تلك الام فى تحضير رضعة او وجبة لاطفالها<br />سيادتة طلع قرار<br />لو كنا بلد من الدول بتاع العالم الثالث او حتى السابع وهذا المحافظ جاء عن طريق الانتخاب - انتخب اهل المحافظة المحافظ بتاعهم - وكان هناك مجلس محافظة يجتمع ويتخذ القرارات - لم نكن نرى هذة العذابات للانسان المصرى<br />انا اسمى معاناة الناس هى قهر واذلال للانسان المصرى<br />ولكن<br />ولكن اية<br />يلعن ابوهم"
