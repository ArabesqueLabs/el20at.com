subject = "المحافظين المساكين"
author = "العاقل"
posted = "2009-02-07"
text = "كلنا نعرف ان أى محافظ يعين فى هذا المنصب من قبل السلطة و ليس من قبل الناس كما انه فى 90% من الحالات ضابط سابق أى قضى كل حياته المهنية فى خدمة السلطة وبالتالى عمله الحالى هو خدمة السلطة اى الحكومة أى النظام وبالطبع ليس خدمة الناس. كما أنه يعلم أن مدة بقائه فى هذاالمنصب متوسطها 2-4 سنوات ويجب أن يستغل كل ساعة منها لتأمين مستقبل أولاده و عائلته المساكين ..... فلمذا نظلم هذا المحافظ و أمثاله و نطالبهم بعمل ما نريد أو ما هو فى مصلحتنا .... لا سيما أننا لم نختاره ولم نعينه ولا نستطيع أن نزحزحه من موقعه مهما عمل ....<br />ملاحظة: الكثير من دول العالم الثالث مثل الهند و جواتيمالا و ماليزيا بل و موزمبيق يختارون محافظيهم بالإنتخابات الحرة المباشرة التى لا تتدخل فيها الحكومة إلإ للحفاظ على نزاهةو شفافية العملية الإنتخابية و ليس \\\"العكس\\\"!!"
archived = "2010-03-14"
