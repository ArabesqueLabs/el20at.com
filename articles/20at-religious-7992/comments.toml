subject = "يا شفيعي يا محمد"
author = "ناصع"
posted = "2009-01-01"
text = "لايجوز للمسلم أن يقول ياشفيعي يا محمد لأن الدعاء يبذل لله وحده لاشريك له دون الخلق لا للأنبياء ولا الملائكة ولا أحد من الخلق .<br />هذا للتنبيه."
