text = "اللهم أت سيدنا محمد الوسيلة والفضيلة والدرجة العالية الرفيعه وأبعثه اللهم مقاماً محموداً كما وعدته إنك لا تخلف الميعاد<br />وإرضى اللهم عنا وشفع نبيك فينا وتب علينا وأدخلنا الجنه من غير سابقة عذاب يارب العالمين ."
