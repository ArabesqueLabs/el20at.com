subject = "شالوم ياصاحبى"
author = "ديمة"
posted = "2007-04-27"
text = "انا متفقة معاك فى كل اللى قلته ما عدا السطر الاول والاخيٍ، بس اولا باهنيك على ثقافتك السكرية المذهلة<br />بس مش وموافقة ان اى اول سطر تقول دولة اسرائيل، ما ينفعش ومش معناها انى باحط راسى فى الرمل ومش عايزة اقر انهاموجودة بجيشها وبرلمانها، كان ممكن على الاقل خالص تقول اسرائيل بس من غير دولة<br />الحاجة التانية والاكبر ـ وهو رأيى الشخصى ـ ان احنا نص انتصرنا عسكريا فى 73 وده كلام الفريق الشاذلى اما بقى موضوع السلام فحرام دى كانت بيعة السادات عملها ودموع الفريق الجمسى تشهد على كده"
archived = "2010-03-14"
