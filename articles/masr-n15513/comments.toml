[[comments]]
order = 0
subject = "وأجراه مركز المعلومات ودعم اتخاذ القرار بمجلس الوز"
author = "مش شريف الدواخلي ولا رضوى حسن"
posted = "2008-05-01"
text = "ها ها ها ها ها ها ها ها ها ها ها<br />هو مجلس الوزراء عنده مركز معلومات ودعم اتخاذ القرار<br />لا حول ولا قوة الا بالله العلي العظيم<br />هما عندكم مركز معلومات ودعم اتخاذ القرار في الخيبة التقيله<br />ضحكتوني يا اخبار ولاد البلد عشرينات رويترز"
archived = "2008-05-01"
capture_url = "https://web.archive.org/web/20080501153438/http://masr.20at.com:80/newArticle.php?sid=15513"

[[comments]]
order = 1
subject = "لازم يربوا لان الفرخة الميتة بخمسة جنيه"
author = "مش مروة صلاح ولا مروة عبدالفضي"
posted = "2008-05-01"
text = "ما هو لما الفرخة الميتة يوصل سعرها الى 5 جنيه في السوق<br />يبقى من الافضل ان كل واحد يشتري كتاكيت يربيها على ايده افضل لان لما الواحد يشتري كتكوت ويربيه مش حيتكلف عليه خمسة جنيه<br />افضل ما يشتري فرخة ميته بخمسة جنيه<br />والواحد لما يموت بانفلونزا الطيور افضل من الحياة وهو بيتفرج على الطيور ولما يحب ياكلها ياكلها ميته"
archived = "2008-05-01"
capture_url = "https://web.archive.org/web/20080501153438/http://masr.20at.com:80/newArticle.php?sid=15513"
