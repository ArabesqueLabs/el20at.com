[[comments]]
order = 15
subject = "السجن للجدعان"
author = "أيمن"
posted = "2008-04-26"
text = "المؤمن مبتلى<br />كل الرسل والأنبياء اتعذبوا وابتلوا<br />أغلب علماء الإسلام والمجاهدين اتسجنوا<br />كل المناضلين من أجل الحياة والحرية والكرامة او حتى لقمة العيش شافوا أكثر من كده<br />ربنا يكتب لك تكونى يا إسراء واحدة من الذين استنوا سنة حسنة فتأخذى اجرها وأجر من عمل بها ليوم الدين<br />ويكتب لك أجر إنك سبب فى تنبيه شباب كتير<br />ربنا يكرمك بكل شكل قادر وكريم ويحميكى ويحفظك ويكتر من امثالك<br />ويقبل عمرة والدتك وما يحرمكوش من بعض أبدا"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428200356/http://masr.20at.com:80/newArticle.php?sid=15424"

[[comments]]
order = 16
subject = "اهدو بس شويه"
author = "amr"
posted = "2008-04-26"
text = "اهدوا شويه بس يا جماعه اولا الطبيعى ان اللى يدخل السجن ميتعذبش كفايه انه سجن لكن طبعا فى مصر الوضع يختلف .<br />ثانيا هتقولو طب مختلفش ليه مع اسراء عشان لو كان حصلها حاجه كان كل اخواتها واهلها يعنى اقصد المصريين الرجاله مكانوش هيسكتوا فرخجوها وسليمه كمان عشان نهدى ونتبط ونرجع ننام تانى ونقول دى تمثليه والسجن جميييييييل . خلي بالكو من نفسكوا سلااااااااام ويجعله عامر"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428200356/http://masr.20at.com:80/newArticle.php?sid=15424"

[[comments]]
order = 17
subject = "يا شعبي"
author = "amr"
posted = "2008-04-26"
text = "يا شعبي حبيبي يا روحي يا بيبي يا حاطك في جيبي يا ابن الحلال<br />يا شعبي يا شاطر يا جابر خواطر يا ساكن مقابر وصابر وعال<br />يا واكل سمومك يا بايع هدومك يا حامل همومك و شايل جبال<br />يا شعبي اللي نايم وسارح وهايم وفي الفقر عايم وحاله دا حال<br />أحبك محشش مفرفش مطنش ودايخ مدروخ وآخر انسطال<br />أحبـك مكبـر دماغـك مخـدر ممشـّي امورك كدة باتكال<br />وأحب اللي ينصب وأحب اللي يكذب وأحب اللي ينهب ويسرق تلال<br />وأحب اللي شايف وعارف وخايف وبــالع لســانه وكاتم ما قال<br />وأحب اللي قافل عيونه المغفل وأحب البهايم وأحب البغال<br />وأحب اللي راضي وأحب اللي فاضي وأحب اللي عايز يربي العيال<br />وأحب اللي يائس واحب اللي بائس و احب اللي محبط وشايف محال<br />واحبك تســـافر وتبعد تهاجــر وتبعت فلوسك دولار أو ريال<br />واحبك تطبـّل تهـلل تهبـّـل عشان ماتش كورة وفيلم ومقال<br />واحبـك تأيــّد تعضّـد تمجّــد توافق تنافق وتلحس نعال<br />تحضّر نشـادر تجـمّع كوادر تلمـّع تقمـّع تظبـّط مجـال<br />لكن لـو تفكـّر تخـطط تقـرر تشغللي مخك وتفتح جدال<br />وتبدأ تشاكل وتعمل مشاكل وتنكش مسائل وتسأل سؤال<br />وعايز تنور وعايز تطور وتعمللي روحك مفرد رجال<br />ساعتها هاجيبك.. لايمكن أسيبك وراح تبقى عبرة وتصبح مثال<br />هابهدل جنابك وأذل اللي جابك وهيكون عذابك دا فوق الاحتمال<br />وامرمط سعادتك واهزأ سيادتك واخللي كرامتك في حالة هزال<br />وتلبس قضية وتصبح رزية وباقي حياتك تعيش في انعزال<br />هتقبل ها حبك.. هترفض هلبـّك هتطلع هتنزل هاجيبلك جمال"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428200356/http://masr.20at.com:80/newArticle.php?sid=15424"

[[comments]]
order = 18
subject = "الي الواد التعبان اللي  بيتريق علي اسراء تاج راس ا"
author = "البرادعي"
posted = "2008-04-26"
text = "الي الواد المعرص اللي يتريق علي اسراء --- بقولك ايه ياروح امك --- لو انت راجل ومفتح كده طيب ايه رايك تدعو لاضراب ويدخلوك السجن ونشوف مرجلتك يامعرص ياللي مش كاتب اسمك<br />وساعتها هتتشهر برده والقنوات التلفزيونيه هتجري وراك ___ تعرف تبقي راجل وتعمل زي اسراء<br />تعرف تبقي بني ادام وتعمل زي اسراء<br />تعرف ماتكونش جبان وتكتب لنا اسمك واحنا وراك ياسيدي---- مادام انت شايفها لعبه -- جرب كده ياروح امك<br />تعرف ياله<br />انت غلول وحقود وزباله وقليل الادب كمان --- واخرك تشتغل مخبر درجة تاته<br />اتفوه عليك وعلي تربيتك الوسخه"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428200356/http://masr.20at.com:80/newArticle.php?sid=15424"

[[comments]]
order = 19
subject = "اسراء يا زهرة مصر"
author = "مين هناك"
posted = "2008-04-26"
text = "للعملاء خطافين البنات والعذارى ووضعهم فى السجون<br />اسراء بنت مصر فى السجن وبنت التمرجية البريطانية فى القصر<br />لم يحدث فى اى عصر اسود ايام الاحتلال او ايام الهكسوس ان قبضوا على الفتيات والعذارى ووضعوهم فى السجن<br />فى الوجدان المصرى كبيرة جدا وذنب لا يغتفر ان يقبض على بنت عذراء وتودع خلف القضبان بلا اى ذنب<br />ان هذا جبروت وفرعنة فوق الحدود على افراد الشعب<br />لماذا لم تظهر يا جبناء حينما قتلت السفينة الامريكية بمبوطى فى السويس<br />واسرائيل تصطاد العساكر المصريين على الحدود بدون ان يظهر من عندكم نفس يا جبناء<br />اسراء يا جبناء ليست لواء على كتفها سيوف ومقصات وتحت امرتها فرق وجيوش<br />اسراء بنت اسرة مصرية عريقة وشريفة اشرف من اسرة العادلى واشرف من اسرة مبارك<br />اسراء سوف تظل امل كل مصر وبنت كل بيت فى مصر<br />اسراء ابوها وكيل وزارة شريف مش حرامى ولا بياع ادوية فاسدة ولا صاحب عبارة غرقانة ولا بيبيع غاز لاسرائيل وامها وكيلة مدرسة ثانوى بنات يعنى بنت ناس ومتربية<br />تحية لك يا بنت مصر<br />وفتاة مصر الاولى<br />وفى عيون وقلب كل مصرى شريف<br />لا تنزعجى يا بنية فساعة الحرية قادمة قادمة والزبالة ستلقى فى مزبلة التاريخ"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428200356/http://masr.20at.com:80/newArticle.php?sid=15424"
