author = "مش ضروري"
posted = "2008-04-24"
text = "وفر فلوسك وتعبك ومجهودك يا شعب يا مصري يا مسكينن يا اللي طول عمرك بتدفع ضرايب وجباية واكرامية وتفتيح مخ<br />اديك مرمي في السجن وصاحبة الاضراب قاعدة في بيتها بتغني وتقول<br />ما تزوقيني يا ماما اوام يا ماما دا عريسي حياخدني بالسلامة ياماما<br />اصحا يا شعب مصر ما تسمعش كلام حد<br />طول عمر حكامك كده<br />اقرا التاريخ يا شعب مصر"
