text = "السلام عليكم<br />انا مش عارف لية الاخ \"مش ......\" نازل تريقة<br />كل ده عشان انت قاعد في البيت و بتتكلم و انت في الناشف<br />انما لو انت او اختك اللي معتقل ما كنتش قلت كدة<br />بلاش سياسة التخوين و الهوائية دي<br />امبارح الناس رفعتها السما و النهاردة الارض!!!!<br />انا بقول الحمد لله انها خرجت<br />و عقبال كل الباقيين<br />سلام<br />حسام"
