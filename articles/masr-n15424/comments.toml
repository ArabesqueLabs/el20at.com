[[comments]]
order = 0
subject = "اهو دا الشغل ولا بلاش"
author = "مش البراء اشرف ولا شريف الدواخ"
posted = "2008-04-24"
text = "اهو دا الشغل ولا بلاش<br />خلاص يا جماعة اسراء لعبت لعبتها وضربت ضربتها وخلاص<br />اشهر من ابو تريكا<br />واروع من عمرو دياب<br />واقوى من عادل امام<br />جتنا نيلة في حظنا الهباب يعني ما كناش احنا اللي نظمنا الاضراب دا"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428200356/http://masr.20at.com:80/newArticle.php?sid=15424"

[[comments]]
order = 1
subject = "حالة من البكاء الشديد والفرحة انتابت إسراء"
author = "مش لازم"
posted = "2008-04-24"
text = "طبعا ما هي مش مصدقة نفسها\\<br />ان اللعبة اتلعبت صح والخطه نجحت وودعت عالم الفأر بلا رجعة<br />مبروك يا اسراء فرحانلك من كل قلبي بس ما تنسيناش انا واصحابي مش مهم ومش ضروري ومش لاعب ومش هو حتلاقينا قاعدين على القهوة اللي جنب بيتكم على طول بنلعب طاولة وكوتشينه وبنشرب شاي وحلبه واهي ماشية والحمد لله"
archived = "2008-04-28"
capture_url = "https://web.archive.org/web/20080428200356/http://masr.20at.com:80/newArticle.php?sid=15424"

