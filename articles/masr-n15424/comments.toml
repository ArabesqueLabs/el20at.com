text = "والله دي حاجه حلوه خالص الواحد يعمل اضراب ويتسجن واهوه يضمن اكلته ونمته<br />والله يااخت ساره انا كنت من اشد المعجبين بشجاعتك لكن بعد ما شوفت الفيديو والثناء الجميل ده علي الشرطة اتغيرت<br />فكرتي 571 درجة<br />ده طلع ان الشرطة في خدمة الشعب صح والله كنا ظالمين الشرطة<br />احنا اسفين ياشرطة"
