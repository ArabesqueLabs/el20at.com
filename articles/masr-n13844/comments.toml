subject = "كفاية زعزعه في امن واستقرا ر البلد كفاية"
text = "كفاية يا من تدعون نفسهم الاخوان<br />كفاية زعزعه في امن واستقرار البلد<br />حرام عليكم كفاية سجون ومعتقلات كفاية<br />رافعين شعار نكرهك يا بوش تماما زي الحمار اللي اسمه جمال عبدالناصر ما كان عامل فضلنا نكره امريكا لغاية ما امريكا خلتنا نسف التراب في 67<br />يا جماعة الاتحاد السوفياتي بجلالة قدره ما قدرش يقف امام امريكا<br />بريطانيا مش عارفة تنفصل عن امريكا وكذلك الغرب كلده تابع لامريكا بريطانيا وفرنسا والمانيا<br />امريكا هي (المسيخ الدجال) ربنا سبحانه وتعالى هو اللي جابها وهو اللي حياخدها<br />امريكا دي مش شغلنا<br />الناس التافهين عملوا مقاطعة للمنتخات الامريكية البيبسي والشوكولاته ومش عارف ايه فوجئنا بأن امريكا بتحتل العراق<br />ما لكوش دعوه بامريكا لو سمحتوا اللي بيكره امريكا يرجع اللي خالق امريكا ويطلب منه الخلاص من امريكا<br />فربنا قال ادعوني استجب لكم ما يهبلش زي الجماعة اللي فوق دول ما هم عاملين"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117043050/http://masr.20at.com:80/newArticle.php?sid=13844"

