order = 5
subject = "طاعة ولى الامر - تعنى الطاعة المطلقة للامام - تعنى ولاية الفقية - تعنى المرشد العام"
author = "ها ها"
text = "ولاية الفقية - هو دة الشرع - زى حسن نصر اللة - زى الخمينى<br />هى دى معنى الولاية<br />اللى يقصد بها الاخ اطال اللة عمرة بتاع طاعة ولى الامر<br />شكرا يا سيدى على احاديثك المكررة<br />فهمنا الموضوع بتاعك<br />يعنى انت بتنادى بطاعة الفقية - او ولاية الفقية - شكرا<br />يا جماعة الخير - اطيعوا المرشد لانة هو الفقية الوالى على حسب تفسير الاخ<br />الا اذا كان بيقصد حسنى مبارك لما يلبس الجبة والعمامة ويمسك السبحة ويقول انا الخمينى - انا خليفة المسلمين<br />عقول بقى محشية جزم"
archived = "2008-01-17"
capture_url = "https://web.archive.org/web/20080117043050/http://masr.20at.com:80/newArticle.php?sid=13844"

