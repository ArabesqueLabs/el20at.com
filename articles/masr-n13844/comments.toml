subject = "طاعة أولى الأمر .."
text = "طاعة أولى الأمر ..<br />العلاقة بين الحاكم والمحكوم ، تستلزم أن يتقبل الأفراد طاعة السلطة الحاكمة فى أوامرها ونواهيها ، لأن الأصل فى هذه الأوامر والنواهي أنها بقصد تحقيق الصالح العام للجماعة والعمل على سير دولاب الحياة سيراً منتظماً .<br />ولكن الفرد بطبعه يأنف من فكرة الخضوع لغيره كائناً من كان ويسعى للتمرد على السلطة الحاكمة إرضاءاً لنزواته وغرائزه ومن هنا ارتبطت الأوامر والنواهي – القاعدة القانونية – بجزاء مادي يوقع على المخالف ، وصار هذا الجزاء ركناً من أركان القاعدة القانونية يميزها عن القواعد الأخلاقية .<br />وفى النظام الإسلامي حيث يرتبط الأمر والنهى بالإيمان بالله وعبادته ، فإن المؤمن الذى رضى بالله رباً وبالإسلام ديناً وشريعة ومنهاجاً وبمحمد صلى الله عليه وسلم رسولاً يجد فى نفسه وفى ضميره وفى مراقبته لله عز وجل الباعث على احترام أوامر الله تعالى ونواهيه ، فتتحقق فى نفسه تقوى الله عز وجل وثمرتها اتباع أوامر الله تعالى واجتناب نواهيه ، وحتى لو غلبته الشهوة وخالف أمراً لله تعالى فإنه يسارع إلى التوبة حتى يعفو عنه ربه .<br />ومن هذا المنطلق الإيماني الذى يجب أن يسود المجتمع المسلم نجد أن الجاني الذى ارتكب جريمته فى الخفاء يتقدم إلى أولى الأمر معترفاً بجرمه يسعى إلى تطهير نفسه من دنسها . تلك هى الطاعة فى النظام الإسلامى دين متبع ، وعمل يتقرب به العبد إلى الله تعالى ، ولهذا ربط الله تعالى الطاعة بالإيمان فلم يطلبها إلا من مؤمن يسعى إليها راغباً راهباً \" يَاأَيُّهَا الَّذِينَ ءَامَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنْكُمْ فَإِنْ تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ إِنْ كُنْتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ذَلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا \" ( النساء : 59 ) فقد أرشد الآية إلى وجوب طاعة الله فيما أمر به ونهى عنه فى كتابه ، وطاعة الرسول فيما بين ووضح وأمر فى سنته فهى نص فى وجوب شرع الله تعالى ، ثم أرشدت إلى وجوب طاعة أولى الأمر بالتبعية لطاعة الله ورسوله وليس على سبيل الاستقلال ، أى ما داموا قائمين على شرع الله منفذين له ، فإن حدث بينكم خلاف على أمر من الأمور فاحتكموا إلى كتاب الله وسنة نبيه حتى تصلوا إلى الحق إن كنتم على سبيل المؤمنين فتصيبوا الخير فى الدنيا والآخرة .<br />وأولوا الأمر هم؛ الولاة والأمراء أصحاب السلطة ، وهم العلماء العاملون أيضاً ، ويرجع إليهم الناس فى أمور دينهم ودنياهم .<br />ولقد تواترت النصوص التى تحث على طاعة الأئمة والولاة ويكفى أن ترجع إلى كتاب الأحكام من صحيح الإمام البخارى وإلى كتاب الإمارة من صحيح الإمام مسلم لتقف على جم غفير منها :<br />عن أبى هريرة قال : قال رسول الله صلى الله عليه وسلم \" من أطاعني فقد أطاع الله ، ومن أطاع الإمام فقد أطاعني ، ومن عصاني فقد عصى الله ، ومن عصى الإمام فقد عصاني (1).<br />قال الشافعى : كانت قريش ومن يليها من العرب لا يعرفون الإمارة فكانوا يمتنعون على الأمراء ، فقال النبى صلى الله عليه وسلم هذا القول يحثهم على طاعة من يؤمرهم عليهم والانقياد لهم إذا بعثهم فى السرايا وإذا ولاهم البلاد فلا يخرجون عليهم لئلا تفترق الكلمة (2)<br />وإنما أمر رسول الله صلى الله عليه وسلم بطاعة الأئمة والولاة لما فى ذلك من اتفاق الكلمة ، لأن الافتراق سبيل الفساد ، وهذا واضح فى كثير من النصوص التى تحث على الطاعة وإن كانت شاقة على النفس ، وإن كان الأمير عبداً تأنف النفوس من الخضوع له وطاعته .<br />\" اسمعوا وأطيعوا وإن استعمل عليكم عبد حبشى كأن رأسه زبيبة \" (3) .<br />\" ولو استعمل عليكم عبد يقودكم بكتاب الله اسمعوا له وأطيعوا \" (4) .<br />إن الطاعة فى النظام الإسلامى واجبة عند الكسل وكراهية الأمر كما هى واجبة عند النشاط والتحمس له ، واجبة فى العسر والشدة كما هى فى الرخاء واليسر ، واجبة فيما تكره كما هى واجبة فيما تحب ما لم تؤمر بمعصية الله \" على المرء المسلم السمع والطاعة فيما أحب أو كره ما لم يؤمر بمعصية ، فإن أُمر بمعصية فلا سمع ولا طاعة \" (5) .<br />وعلى هذا يبايع المسلمون ، على أن تظل الطاعة هى الرابطة بين الحاكم والمحكوم حتى وإن جنح الحاكم إلى الظلم والاستئثار بالمال ما لم يصل به الأمر إلى كفر بواح ظاهر .<br />عن عبادة بن الصامت قال : بايعنا رسول الله صلى الله عليه وسلم على السمع والطاعة فى منشطنا ومكرهنا وعسرنا ويسرنا وأثرة علينا ، وأن لا ننازع الأمر أهله ، إلا أن تروا كفراً بواحاً عندكم من الله فيه برهان (6) .<br />ولا يعنى هذا إقرار الظلم والسكوت عليه ، بل يجب على كل مسلم قادر أن يسعى إلى المعالجة بوسائلها المشروعة فالنصح لولاة الأمر واجب ، والأمر بالمعروف والنهى عن المنكر واجب ، والطاعة لا تكون إلا فى معروف ، ولهذا ورد فى حديث عبادة \" وأن نقوم – نقول – بالحق حيثما كنا لا نخاف فى الحق لومة لائم \" (6) .<br />إن طاعة ولاة الأمور ليست مطلقة ولا يمكن أن تكون كذلك فى نظام شرعى تحكمه ضوابط شرعية فأولو الأمر لا ينفردون بالطاعة فى كل ما أمروا به ، ولكن يطاعون فى الحدود الشرعية التى تحكم الحاكم والمحكوم ، فإذا ما تجاوز بعضهم هذه الحدود فلا سمع ولا طاعة<br />روى البخاري عن علىّ قال : بعث النبى صلى الله عليه وسلم سرية وأمر عليهم رجلاً من الأنصار وأمرهم أن يطيعوه ، فغضب عليهم فقال : أليس قد أمر النبى صلى الله عليه وسلم أن تطيعونى ؟ قالوا : بلى . قال : قد عزمت عليكم لما جمعتم حطبا وأوقدتم ناراً ثم دخلتم فيها ، فجمعوا حطباً فأوقدوا ناراً ، فلما هموا بالدخول فقاموا ينظر بعضهم إلى بعض ، فقال بعضهم : إنما تبعنا النبى صلى الله عليه وسلم فراراٍ من النار ، أفندخلها ؟<br />فبينما هم كذلك إذ خمدت النار وسكن غضبه ، فذكر للنبي صلى الله عليه وسلم فقال : لو دخلوها ما خرجوا منها أبداً ، إنما الطاعة فى المعروف \" (7) .<br />وقد كانت هذه القصة سبباً فى نزول قوله تعالى : \" أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنْكُمْ \" (8) الآية .<br />وروى مسلم فى صحيحه عن عبد الله بن عمرو بن العاص أن رسول الله صلى الله عليه وسلم قال : \" من بايع إماماً فأعطاه صفقة يده وثمرة قلبه فليطعه إن استطاع \" .<br />فقال له عبد الرحمن بن عبد رب الكعبة : هذا ابن عمك معاوية يأمرنا أن نأكل أموالنا بيننا بالباطل ونقتل أنفسنا ، والله يقول : \" يَاأَيُّهَا الَّذِينَ ءَامَنُوا لَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ إِلَّا أَنْ تَكُونَ تِجَارَةً عَنْ تَرَاضٍ مِنْكُمْ وَلَا تَقْتُلُوا أَنْفُسَكُمْ إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا \" الآية ( النساء : 29)<br />فسكت عبد الله ساعة ثم قال : أطعه فى طاعة الله ، واعصه فى معصية الله (9) فهذه فتوى عامة لكل من أمره أميره بمعصية الله كائناً من كان ولا تخصيص فيها البتة .<br />وأهل السنة والجماعة متفقون على وجوب السمع والطاعة لولاة الأمور ما لم يأمروا بمعصية الله . قال ابن تيمية : وكذلك وجوب طاعته – أى الإمام – فى كل ما يأمر به وإن كان معصية الله ، ليس هو اعتقاد أحد من المسلمين ، ولكن مذهب أهل السنة والجماعة أن هؤلاء يُشاركون فيما يحتاج إليهم فيه من طاعة الله ، فنصلى خلفهم الجمعة والعيدين وغيرهما من الصلوات التى يقيمونها هم ، لأنها لو لم تُصل خلفهم أفضى إلى تعطيلها ، ونجاهد معهم الكفار ، ونحج معهم البيت العتيق ويُستعان بهم فى الأمر بالمعروف والنهى عن المنكر وإقامة الحدود فإن الإنسان لو قُدر أن يحج فى رفقة لهم ذنوب ، وقد جاءوا يحجون لم يضره هذا شيئاً ، وكذلك الغزو وغيره من الأعمال الصالحة إذا فعلها البر وشاركه فى ذلك الفاجر ، فكيف إذا لم يكن فعلها إلا على هذا الوجه .<br />ويستعان بهم فى العدل فى الحكم والقسم فإنه لا يمكن عاقلاً أن ينازع فى أنهم كثيراً ما يعدلون فى حكمهم وقسمهم ، ويعاونون على البر والتقوى ولا يعاونون على الإثم والعدوان . أهـ (10) .<br />هذا هو منهج القصد والاعتدال ، منهج أهل السنة والجماعة بخلاف منهج الخوارج الذين يخرجون على المسلمين بأدنى ذنب ومنهج المرجئة الذين يقولون : لا يضر مع الإيمان ذنب لمن عمله ، ومن تتبع تاريخ المسلمين يجد منهج أهل السنة والجماعة ظاهراً بارزاً تعبر عنه أقلامهم ، وتبرزه مواقفهم .<br />مر أبو برزة الأسلمى على أبى بكر الصديق فوجده يتغيظ على رجل من أصحابه ، فقال له : يا خليفة رسول الله من هذا الذى تتغيظ عليه ؟ قال : فلم تسأل عنه ؟ قال : لأضرب عنقه . قال أبو بكر : لو قلت لك ذلك أكنت تفعله ؟ قال : نعم ، قال أبو بكر : ما كان ذلك لأحد بعد رسول الله صلى الله عليه وسلم (11) .<br />قال البغوى : فهذا يؤيد ما قلنا وهو أن أحداً لا يجب طاعته فى قتل مسلم إلا بعد أن يعلم أنه حق ، إلا رسول الله صلى الله عليه وسلم لأنه لا يأمر إلا بحق ولا يحكم إلا بعدل .<br />وحُكى أن عمر بن هبيرة كان والياً على العراق ، فقال لعدة من الفقهاء : إن أمير المؤمنين يكتب إلىّ فى أمور أعمل بها فما ترون ؟ فقال له بعضهم : أنت مأمور والتبعة على من أمرك فقال للحسن البصرى : ما تقول ؟ قال : اتق الله يا عمر ، فكأنك بملك قد أتاك فأنزلك عن سريرك هذا ، فأخرجك من سعة قصرك إلى ضيق قبرك ، فإياك أن تعرض لله بالمعاصي ، فإنه لا طاعة لمخلوق فى معصية الخالق (12) .<br />فهذان مثالان أسوقهما إلى عبيد السلطان فى كل موقع ، الذين يهملون واجب النصيحة ، ويفهمون الطاعة على غير وجهها فيقول قائلهم : ( أنا عبد المأمور ) !! وينسى أنه عبد الله وحده ، ويظن بذلك أن التبعية تقع على غيره بينما هو شريك فى الإثم والعدوان ، والله تبارك وتعالى يقول : \" وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَى وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ \" ( المائدة : 2) .<br />د. جمال المراكبى<br />(1) البغوى – شرح السنة ج10 ص41 ، والحديث متفق عليه ولكن بلفظ : أميري عند البخارى – ك الأحكام وبلفظ : الأمير عند مسلم – ك الإمارة .<br />(2) حكاه الحافظ ابن حجر فى فتح البارى عند شرحه لألفاظ الحديث ج13 ص120 .<br />(3) أخرجه البخارى ( 693 ، 696 ، 7142 ) عن أنس ، وعند مسلم ( 1837/36 ) من حديث أبى ذر نحوه .<br />(4) أخرجه مسلم وأحمد ( 4/69 – 70 ) عن أم الحصين .<br />(5) البخارى ك الأحكام ح رقم 7144 ، ومسلم ك الإمارة ح 1839 ، عن ابن عمر .<br />(6) مسلم ك الإمارة 1709 – 41 .<br />(7) متفق عليه .<br />(8) متفق عليه عن ابن عباس .<br />(9) مسلم ك الإمارة ح رقم 1844 .<br />(10) منهاج السنة النبوية ج2 ص 240 .<br />(11) صحيح . أخرجه النسائى ( 7/108 ، 109 ) ، وأحمد ( رقم 54 ) ، والمروزى فى مسند أبى بكر ( 66 – 68 ) .<br />(12) البغوى – شرح السنة ج 10 ص 45 ."
