text = "الحكم الاشتراكى : ان يكون عندك بقرتين تاخد الحكومة واحدة وتخليلك واحدة<br />الحكم الشيوعى : ان يكون عندك بقرتين تاخدهم الحكومة منك وتعطيك بعض اللبن<br />الحكم الفاشستى : ان يكون عندك بقرتين تأخذهم الحكومة منك وتسجنك ايضا<br />الحكم الرأسمالى : ان يكون لديك بقرتين تبيع احداهما وتشترى بثمنها ثورا ليلقح البقرة وينتج لك قطيعا تبيعة وتشترى بثمنة اسهم تعيش من العائد بتاعها<br />الحكم المصرى : ان يكون لديك بقرتين تبحث عنهما فى كل مكان فلا تجدهما لانهما ذهبا لانتخاب حسنى مبارك بنسبة 99 %"
