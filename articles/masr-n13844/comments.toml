subject = "بعد ان شاهدت الفلم اذكركم يا اخواني بقرب يوم القيامه"
text = "اشراط الساعة : هي علامات القيامة التي تسبقها وتدل على قربها والساعة تطلق ثلاث معاني<br />أولا: الساعة الصغرى : وهي موت الانسان ، فمن مات فق قامت قيامته لدخوله في عالم الآخرة<br />ثانيا: الساعة الوسطى : وهي موت اهل القرن الواحد<br />ثالثا: الساعة الكبرى : وهي بعث الناس من قبورهم للحساب و الجزاء<br />وقد قسم العلماء اشراط الساعة من حيث ظهورها الي ثلاث اقسام<br />اولا: قسم ظهر وانقضى<br />ثانيا: قسم ظهر ولا يزال يتتابع ويكثر<br />ثالثا: قسم لم يظهر الى الآن<br />[foq1]أشراط الساعة الصغرى [/foq1]1-<br />1-بعثة النبي صلى الله عليه وسلم<br />2- موت النبي صلى الله عليه وسلم<br />3- فتح بيت المقدس<br />4- طاعون عمواس<br />5- أستفاضة المال والاستغناء عن الصدقة<br />6- ظهور الفتن<br />7- ظهور مدعي النبوة<br />8- أنتشار الامن<br />9- ظهور نار الحجاز<br />10- قتال الترك<br />11- قتال العجم<br />12- ضياع الأمانة<br />13- قبض العلماء وظهور الجهل<br />14- كثرة الشرط وأعوان الطلمة<br />15- أنتشار الزنا<br />16- أنتشار الربا<br />17- ظهور المعازف وااستحلالها<br />18- كثرة شرب الخمر واستحلالها<br />19- زخرفة المساجد والتباهي بها<br />20- التطاول في البنيان<br />21- ولادة الأمة ربتها<br />22- كثرة القتل<br />23- تقارب الزمان<br />24- تقارب الأسواق<br />25- ظهور الشرك في الأمة<br />26- ظهور الفحش وقطيعة الرحم وسوء الجوار<br />27- تشبب المشيخة<br />28- كثرة الشح<br />29- كثرة التجارة<br />30- كثرة الزلازل<br />31- ظهور الخسف والمسخ والقذف<br />32- ذهاب الصالحين<br />33- ارتفاع الأسافل<br />34- ان تكون التحية للعرفة<br />35- التماس العلم من الأصاغر<br />36- ظهور الكاسيات العاريات<br />37- صدق رؤيا المومن<br />38- كثرة الكتابة وانتشارها<br />39- التهاون في السنن التي رغب فيها الاسلام<br />40- انتفاخ الاهلة<br />41- كثرة الكذب<br />42- كثرة شهاة الزور<br />43- كثرة النساء وقلة الرجال<br />44- كثرة موت الفجأة<br />45- وقوع التناكر بين الناس<br />46- عود أرض العرب مروحا وانهارا<br />47-كثرة المطر وقلة النبات<br />48- حسر الفرات عن بل من ذهب<br />49- كلام السباع والجمادات للانس<br />50- تمني الموت من شدة البلاء<br />51- كثرة الروم وقتالهم للمسلمين<br />52- فتح القسطنطينية<br />53- خروج القحطاني<br />54- قتال اليهود<br />55- نفي المدينة لشرارها ثم خرابها آخر الزمان<br />56-بعث الريح الطيبة لقبض ارواح المؤمنين<br />57- استحلال البيت الحرام وهدم الكعبة<br />58- التقليد واتباع سنن الامه الماضية<br />59- فتنة الاحلاس والدهماء<br />60- الفرار بالدين الى شغف الجبال من شدة الفتن<br />61- رفض السنة النبوية<br />62- تداعي الامم على الامة الاسلامية<br />63- قطع المال والغذاء عن العراق وغيرها من بلاد الاسلام<br />64- كثرة الروم<br />[foq1]اشراط الساعة الكبرى [/foq1]<br />1- المهدي<br />2- المسيح الدجال<br />3- نزول عيسى عليه السلام<br />4- يأجوج و مأجوج<br />5- الخسوفات الثلاثه<br />6- الدخان<br />7-طلوع الشمس من مغربها<br />8- الدابة<br />9- رفع القرآن واندراس الاسلام<br />10- النار التي تحشر الناس<br />هذا آخر ما يسر الله معه من علامات الساعة نسأل الله تعالى ان ينفع بها ، انه ولي ذلك والقادر عليه<br />وصلي الله على نبينا محمد وعلى آله وصحبه"
