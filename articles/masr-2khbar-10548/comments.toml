[[comments]]
order = 3
subject = "تحذير لكل المسلمين (كرهوا ما انزل الله فاحبط اعمال"
author = "ابومحسن"
posted = "2008-11-20"
text = "طبعا كلنا نعلم ان الجلد عقوبة في الشريعة الاسلامية وعلى سبيل المثال وليس الحصر شارب الخمر يجلد في الشريعة الاسلامية والزاني والزانية غير المتزوجين يجلدوا في الشريعة الاسلامية<br />فاي مسلم يحس بحرج من الجلد او باندهاش او باستغراب او يقول ان الشريعة الاسلامية لا يصح تطبيقها الان او احنا في القرن الواحد والعشرين ما ينفعش نطبق الشريعة او طلعنا القمر او طلعنا الشمس<br />تنطبق عليه الاية التي تقول كرهوا ما انزل الله فاحبط اعمالهم<br />الان مفيش شريعة اسلامية لان من علامات يوم القيامة قبض العلم والله سبحانه وتعالى رفع الشريعة الاسلامية عنا لاجراءات يوم القيامه<br />ولكن لازم المسلم يحب الشريعة الاسلامية ويتمنى من كل قلبه ان يعيد الله الينا الشريعة الاسلامية<br />اللهم حبب الشريعة الاسلامية الى قلوبنا يا رب<br />اللهم اعد لنا الحكم بالشريعة الاسلامية"
archived = "2010-03-14"
capture_url = ""
