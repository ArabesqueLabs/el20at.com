subject = "بطرس غالى الكبير حكم بالجلد على 15 مصرى فى احداث د"
author = "لى"
posted = "2008-11-19"
text = "مش جدك برضة يا بطرس هو اللى حكم بالجلد العلنى على الفلاحين فى احداث دنشواى<br />تحب نجيب لك الصور<br />دلوقتى جاى تقول الجلد مش عارف اية<br />اللى يدور يلاقيكوا انكم اس الفساد<br />والا دلوقتى اسيادك اتغيروا من انجليز لامريكان"
