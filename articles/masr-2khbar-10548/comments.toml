[[comments]]
order = 1
subject = "طيب يا غالى عند امك ما هو الجلد موجود فى السجون ال"
author = "غالى ابن ام بطرس"
posted = "2008-11-19"
text = "هو بيضحك على مين ؟<br />هو مش عارف يعنى اية العروسة فى السجون المصرية - والسجين بيربطوة فى العروسة ويجلدوة وبافتراء<br />الجلد فى الشريعة هو ان اللى ماسك العصا لازم يكون دراعة لازق فى جسمة وما يتمطعش وهو بيضرب وعمر الضرب بتاع الجلد فى الشريعة ما بيوجع لان لة شروط قاسية جدا والهدف منة اشعار المذنب بالذنب مش بالضرب<br />انما الضرب والجلد فى السجون المصرية فا انتقام وبيحضرة دكتور ومنتهى الحيوانية<br />ابقى يا نصرانى يا ابن بطرس الكبير بتاع احكام دنشواى اللى هو الكلب جدك الكبير افهم اولا يعنى اية جلد فى الشريعة وازاى بيتم وبعدين اتكلم<br />يلعن ابوكم"
archived = "2010-03-14"
capture_url = ""

