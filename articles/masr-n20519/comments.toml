[[comments]]
order = 6
subject = "ما تورونا شطارتكم و تتكلمو عن اخوانكم(البهائيين)ايها(المتأسلمين)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية_مصر"
text = "الى صاحب التعليق الاخير؟<br />بالزمة انتم عندكم دم ولا عندكم دم و لا عندكم دم؟<br />لالالا انتم عندكم (بهائيين)شرفاء و مؤمنين و ليسوا زوى عقليات و نفوس و قلوب جاهلة مليئة بالحقد و الجهل و الغباء<br />ها ها ها ها ها ها ها<br />سلموا لنا و للعالم على أسيادكم (البهائيين)<br />و بوسلى كس أمك المنور البهائى يا مؤمن؟<br />اتفواا عليك و على اهلك يا بن المنكوحة؟<br />أتفرجت على الرقاصة (دينا) المسلمة مع حسام أبو الفتوح على ال CD?<br />و لا اتفرجت على أمك تحت كوبرى غمرة و النكاح بقرشين؟<br />هاهاهاهاهاهاها<br />و كس امك اولا و اخيرا!!!"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408072943/http://masr.20at.com:80/newArticle.php?sid=20519"

[[comments]]
order = 7
subject = "ادارة(مباحث تنفيذ الاحكام )وصمة عار و جبة فى جبين مصر و النظام و العدالة"
author = "ممدوح زكى زخارى جرجس_الاسكندرية_مصر"
text = "اسباب الفساد فى مصر و النظام و العدالة هى فساد القائمين على تنفيذ القانون و الاحكام (بادارة تنفيذ الاحكام)احدى الادارات الفاشلة و المحتاجة تنظيف و غسيل و مكوى بوزارة الداخلية المصرية؟<br />أدارة تنفيذ الاحكام بؤرة من بؤر الفساد و المحسوبية و الرشاوى؟<br />كم من الالاف الاحكام القضائية و التى لم تنفذ عند رؤية سيدى (المعلوم)؟<br />بلاغ و رجاء الى السيد/المستشار النائب العام<br />ورجاء الى السيد/اللواء وزير الداخلية<br />باضرب بيد من حديد على المسئؤلين الفاشلين المرتشين (بادارة تنفيذ الاحكام)و فصلهم من الخدمة و سجنهم ايضا بسبب عدم تنفيذ الاحكام القضائية و استبدالها بتحصيل الاموال لانفسهم؟<br />من اجل الوطن مصر نطالب بالحزم و الشدة فى تطبيق القانون و خاصة تنفيذ الاحكام الصادرة بأسم الشعب !!!"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408072943/http://masr.20at.com:80/newArticle.php?sid=20519"

[[comments]]
