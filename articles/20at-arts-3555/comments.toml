subject = "تهمة رشيد غلام  الحقيقية"
author = "halima"
posted = "2007-04-11"
text = "تكمن تهمة رشيد غلام الحقيقية في كونه ينتمي لجماعة العدل و الإحسان ، هده هي التهمة الشنيعة التي منعت رشيد غلام من أحبائه و من جمهوره العاشق لأناشيده ، لقد حاولت السلطات المغربية مرارا التفاوض مع غلام و رفع الحصر الدي تقيمه على حنجرته العاشقة للمديح النبوي إلا أن التربية التي تلقاها رشيد في صفوف العدل و الإحسان لا تقدر بثمن .<br />حسبنا الله ونعم الوكيل"
archived = "2010-03-14"
capture_url = ""
