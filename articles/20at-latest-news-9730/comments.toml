subject = "لا فتح ولا حماس"
author = "محمد نواف"
posted = "2008-09-20"
text = "حركة المقاومة الإسلامية \\\\\\\" حماس \\\\\\\" .. منظمة التحرير الوطني الفلسطيني \\\\\\\" فتح \\\\\\\" ..<br />خياران نفس بعضهمها البعض ولايختلفان عن بعضهما البعض البته ؟!<br />خياران لا ولن ولم يفيدوا أو ينفعوا أو يقدموا أو يبذلوا شيئاً لهذا الشعب المحروم ؟!<br />خياران كلاهما يبحث عن الآخر ليقتله أو لينتقم منه أو ليمسحه عن الوجود .. على أساس أن كلاهما يريدان مصلحة هذا الوطن وشعبه .. ؟!<br />خياران يعرفان ويعوا ويفهموا جيداً ماهو \\\\\\\" المال \\\\\\\"، فبالنسبة لهم هذا الشعب لا يستحق هذا الشيء \\\\\\\" المال \\\\\\\" ؟!<br />خياران أتفه وأحقر وأقبح وأوطى وأسفل وأرذل من بعضهما البعض ؟!<br />خياران مليئان بالسلبيات والعيوب، ويفتقران بل ويكاد ينعاد عندهم الإيجابيات والحسنات، فبأي وجه حق نختارهما ليكونان أو ليمثلان هذا الشعب المغلوب على أمره ؟!<br />خياران .. وما أقساهم من خياران لنا، فهم الذين جلبوا لنا الأسى والحزن، الفقر والمرض، الجوع والعطش والحرمان، اليأس والقنوط، السرقة والنصب والنهب \\\\\\\"لإحتيال\\\\\\\"،الشفقة والرحمة، الخزي والعار، الذل والمهانة، ونحن ننسى أو بالأحرى نتناسى ماللذي قالوه وفعلوه وعملوه بنا وبهذا الوطن الحبيب ؟!<br />خياران .. أشبهما بخطان متوازيان مهما طال خطهما وبعد أكثر وأكثر، فمن المستحيل أن يلتقيان ولو لمره واحده ؟!<br />خياران مللنا وزهقنا من شعاراتهم الرنانة الناصعة البياض التي تهدف للتغيير والإصلاح، والتقدم والإزدهار، والعيش بأفضل وأحسن حالٍ ممامضى ... الخ ، ولكن !!! \\\\\\\" يقولون مالايفعلون \\\\\\\" ؟!<br />خياران لطالما وثقنا بهم ثقة عمياء، ووضعنا كل ما نملك لكي نضع بهم الأمل والتفاؤل بعينين يملؤهما نور الحب والإيمان، ولكن هم خدعونا وكذبوا علينا، فيا له من عارٍ عليهم وعلينا نحن الذين اخترناهم ؟!<br />خياران .. من هواياتهما أن يقوموا بفضح بعضهم البعض لا لشيء يذكر على الإطلاق ؟؟ وإنما لكي يظهروا لنا بصورة لائقة ومشرفة ومحترمة ؟!<br />خياران يظنان بأنهم قادرين على أن يسيطروا على أدمغة هذا الشعب العصي عن الموت، ولكن هيهات أن يسيطروا ؟!<br />خياران .. تزداد خيبتهما ومرارتهما على مر الأيام والشهور والسنين .. ودون أي أدنى فائدة ؟!<br />خياران ..<br />خياران ..<br />خياران ..<br />خياران ..<br />فسحقاً لهم من خياران اثنان !!!"
