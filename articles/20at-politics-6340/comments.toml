[[comments]]
order = 0
subject = "برااااااافو"
author = "Shima"
posted = "2007-06-18"
text = "تحية لاسرائيل و تحية للعقول الصهيونية و تحية للولاء الصهيونى<br />نعم لا تستغرب كلامى<br />الامثال المصرية الشعبية قالت لكل مجتهد نصيب و لم تحدد النصيب ده ف الدنيا ام الاخرة و على هذا<br />فان اسرائيل لا تضيع وقت بعقولها بل انها تحسب حساب المليون سنة القادمة<br />انها تعمل ف جد و نشاط<br />نعم بينهم مشاكل و كراهية لبعضهم البعض و لكن هدفهم اسمى و اعلى من التفرق و الشتات<br />انهم ينظرون لدولتهم بعد سنين و يعملون لتحقيق احلامهم<br />لم يوقفهم كرههم لبعضهم البعض<br />لم يوقفهم كراهية العالم لهم<br />لم يوقفهم اى شىء<br />اقول لهم برااافو<br />لكل مجتهد نصيب<br />و للاسف نحن نصيبهم ، كل شعوب الامة العربية<br />ارتضينا ان نكون طعاما رخيصا لهم بتشتتنا و تفرقنا و هواننا<br />انهم استعمروا ليس فقط فلسطين و العراق<br />و انما كل الشعوب العربية ليس فقط بالسلاح المادى<br />و انما سلاحهم الحقيقى ضرب العقول و المبادىء و القيم<br />ضرب الدين و الانسان<br />براااااااااااااااااااااااااااااااااااااااااااااااافو"
archived = "2010-03-14"
