order = 1
subject = "عايش فى الغيبوبة"
author = "توكى لوكى"
posted = "2007-03-04"
text = "ده اللى بان وظهر وما خفيا كان اعظم والله ياجماعة دى مش مشكلة كنتاكى فقط لكن مشكلة معظم مطاعم التيك اواى وكمان ده فى حاجات تانى فمثلا ظهرت الفئران فى الاماكن الراقية مثل كنتاكى لكن فى المحلات الاقل فى المستوى مانعرفش اية اللى بيحصل داخل مطبخهم وغرف عملياتهم على رأى عايش فى الغيبوبة"
archived = "2010-03-14"
