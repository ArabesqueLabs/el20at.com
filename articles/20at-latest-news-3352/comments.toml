[[comments]]
order = 0
subject = "الحمد لله انى مقاطعه"
author = "فتاه مصريه"
posted = "2007-03-04"
text = "اشكر جدا عشرينات على انها اخبرتنا هذا الخبر عندما علمت به والحمد لله برده ان انا مقاطعه كل المنتجات الغير مصريه سواء عربيه او اوربيه لكن الملابس بشترى اى حاجه بتعجبنى لان انا مش بعرف افرق بين مصرى وغيره وده كله للنهوض بانتاج بلدنا واقتصادنا هو دى سبب مقاطعتى ودى فكر فتاه عاديه مش فتاه متطرفه اى مش اخونجيه ولا شيوعيه ويخليكى لينا يا عشرينات"
archived = "2010-03-14"
