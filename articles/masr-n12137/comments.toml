[[comments]]
order = 1
subject = "حرام عليكم اتقو الله"
author = "واحد مفقوع"
text = "بالله عليكم يا ادارة يا محترمة دي صورة تحطوها في التقرير عن الفيلم ...بل اساسا ده فيلم يستحق حد يتكلم عنه<br />أنا مش عارف انتو توجهكم ايه انا حاسس ان انا مش علي موقع شبابي اسلامي<br />حرام عليكم اتقو الله"
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194210/http://masr.20at.com:80/newArticle.php?sid=12137"

[[comments]]
order = 2
subject = "النمرة غلط يا مفقوع"
author = "ومين قالك ان ده موقع شبابي اسلامي"
text = "يا اخ مفقوع ده مش موقع شبابي اسلامي ولو حد قالك كدة يبقى غلطان اما ان لو حضرتك اللي اكتشفت ده بنفسك فانت بجد عبقري العباقرة ويا بخت البلد بيك"
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194210/http://masr.20at.com:80/newArticle.php?sid=12137"
