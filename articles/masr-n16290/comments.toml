[[comments]]
order = 0
subject = "ازيك يا حمد"
author = "مش البراء اشرف ولا شريف الدواخلي"
text = "يا عم احمد الموضوع بايخ ومش عارفين نعلق<br />ليه؟؟<br />كان لازم تدخل في الموضوع يا الاخوان يا الاقباط يا جمال مبارك يا حسني مبارك يا حبيب العدلي يا مجلس الشعب<br />لان دول هما الفلفل والشطه بتوع القراء اللي بيخليهم يعلقوا على طول ويشتموا ويتخانقوا مع بعض<br />يا ليت تعيد كتابة الموضوع بسرعة وتدخل فيه الاشياء المذكورة عاليه<br />سلام وسلملي على شريف الدواخلي والبراء اشرف"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705181547/http://masr.20at.com:80/newArticle.php?sid=16290"

[[comments]]
order = 1
subject = "الفيس زفت"
author = "شفتة"
text = "الفيس احمر ومدود<br />فيس او فتيس عاملة دوشة للحكومة - علشان فية بنت من بنات مصر عملت جروب خليك قاعد فى البيت اسمها اسراء عبد الفتاح<br />واسراء عبد الفتاح لخبطت اللواءات والشنبات بتوع المسبحين حول العرش<br />ويا ريت اللى على العرش يستاهل<br />الفيس بوك الان تحت الرقابة<br />ولانها من عمل الشيطان<br />فاذا كنت معارضا للحكومة ومتدين ومسلم فتهمتك اخوانى اما اذا كنت نصرانى فتبقى تهمتك شيوعى<br />اما اذا كنت شابا من بتوع النت فانت تهمتك انك تحض على الكراهية والتحريض على قلب نظام الحكم بنشرك تحريضا على الفيس بوك وتهديد الوحدة الوطنية والسلم الاجتماعى وهى تهم ترسلك الى ايدى الحاج عشماوى ليعلقك فى المشنقة<br />او تكون ضيفا فى سجن او منتجع الواحات<br />لية شباب الهند ما بيكتبش ضد الحكومة على النت<br />ولا شباب اسرائيل بيكتب عن حكومتة على النت<br />لان هناك وسائل التعبير الشرعية متاحة امام الجميع بلا نفاق او خوف او واسطة"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705181547/http://masr.20at.com:80/newArticle.php?sid=16290"

[[comments]]
order = 2
subject = "برده بحب البلد ديه"
author = "متطلعة لمستقبل قوى لبلدنا"
text = "احنا الشباب من حقنا نعبر عن آرائنا حتى لو كانت من وجهه نظر السادة السياسيين أنها شغل عيال اللى قال يعنى هم سيبلونا فرصة للمشاركة الإيجابية والفعلية فى ممارسات أحزاب وشغل سياسة بشكل متطور مينفعش تكون ديه هى طريقة مناقشة وتعبير الشباب عن آرائهم من خلال تهييف كل شئ بنعمله اؤمال هنتكلم ازى لازم نستغل الوسائل المتطورة يا عالم داحنا وصلنا إلى أننا نقعد فى البيت علشان نعترض عايزين ايه مننا أكتر من كده اؤمال يا كبار نكون فكر واتجاه لينا ازى قولونا يا أولى الأمر والشئون ."
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130504/http://masr.20at.com:80/newArticle.php?sid=16290"
