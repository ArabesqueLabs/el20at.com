subject = "الحقيقه الغائبه"
author = "منى"
posted = "2007-12-14"
text = "بالنسبه لموضوع نصاب طوخ هيه الناس دي ماكانتش بتفكر وهيه بتديله الفلوس ماكنتش بتفكر الارباح اللى بيديهلهم منين<br />لعلمكم دول كانو بيبكوا امامه علشان ياخد الفلوس منهموكانو بيجيبو ناس يتوسطو وفى ناس كتير ربحو كتير وفيه اخدور فلوسهم هوه ماحسيهاش صح ولوكان عايز يهرب كان هرب من الاول ده كان عنده راس مال كبير اشمعنى الوقت ده اللى هرب فيه كان حلو وجميل اما كانو بياخدو ارباحههم ودلوقتى بقلى وحش انا عايزهطلب صغير من الاخبار اللى بتتنشر لازم الصحفى يتحقق من الاخبار قبل مايكتبها كل واحد بيكتب على كيفه ومن وجهت نظرههوه غلط وهاياخد جزاؤه لكن والد ذنبه ايه ملوش دعوه بالموضوع من اولهده انسان محترم وفى حاله لكن لازم يشوفو حد يعلقو عليه غلطاتهملازم نفكر قبل مانعمل اى حاجه ونشوف ديننا قاللنا ايه هوه ده الصح وشكرا"
