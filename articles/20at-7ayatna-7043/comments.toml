subject = "اذكيا واغبيا فى نفس الوقت"
author = "منى وهيب"
posted = "2007-12-15"
text = "يا ساتر يا رب افكار جهنميه المشكلة ان النصابين دول اذكيا وبيتعبوا جدا فى وضع الخطط والافكار النصبيه يعنى لو استغلوا ذكائهم وجهودهم واصرارهم ده بما يرضى الله ممكن ينجحوا ويكسبوا بالحلال لكن نقول ايه ........ خيبة زى التلميذ اللى يضيع ساعات طويلة فى عمل البرشام اللى حيغش منه وهو كده كده بيقرا وبينقل من الكتاب طب ماكان يوفر على نفسه ويستغل الوقت والمجهود ده فى المذاكرة بجد"
