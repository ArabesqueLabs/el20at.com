[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-12-12"
text = "أكد أحمد وجدي مدير نيابة طوخ بإشراف المستشار مجدي السنباطي المحامي العام لنيابات شمال القليوبية بحبس والد المتهم الهارب \"ريان طوخ\" ويدعي عادل جلال صبيح رئيس مجلس إدارة شركة الأصيل لتجارة المحمول وكروت الشحن بطوخ 4 أيام علي ذمة التحقيق بعد أن وجهت له النيابة تهمتي توظيف الأموال وتجارة كروت الشحن بدون ترخيص وسرعة ضبط وإحضار المتهم الهارب أحمد عادل وباقي المتهمين وهما هاني شوكت مدير الحسابات بالشركة ووائل محمد عبدالخالق وشهرته \"وائل ومبي\" لاستيلائهم علي 300 مليون جنيه من المواطنين من بينهم ضباط شرطة وأعضاء مجالس شعبية وعضو مجلس شعب بحجة توظيفها مقابل ربح شهري ثابت.<br />كما استمعت النيابة لأقوال 15 شخصا من المودعين الذين أكدوا أن المتهم قام بالاستيلاء منهم علي 10 ملايين جنيه لتوظيفها مقابل ربح 300% وعندما حاولوا الاتصال به في يوم صرف الأرباح الشهرية تهرب منهم وأغلق تليفونه المحمول.. كما تجمهر أمس أكثر من 300 شخص من المودعين أمام الشركة والمنزل والطريق الزراعي السريع مما أدي إلي توقف حركة المرور في الاتجاهين وحاول المتجمهرون اقتحام فيللا المتهم الهارب ظنا منهم أنه داخل الفيللا إلا أن قوات الشرطة تمكنت من محاصراتهم وأطلق بعض المودعين عدة أعيرة نارية علي الفيللا.<br />ومن جهة أخري فجر المستشار عدلي حسين محافظ القليوبية مفاجأة مثيرة في هذه القضية حيث أكد أنه طلب من أجهزة الرقابة الإدارية وأجهزة الأمن ومباحث أمن الدولة منذ شهر قبل اكتشاف الواقعة بضرورة اتخاذ الإجراءات القانونية حيال المتهم الهارب وأعوانه ومطابقة أعمالهم بشركات توظيف الأعمال المرخصة وبيان ما إذا كانت هذه الشركة تعمل بطرق قانونية ومشروعة من عدمه.. حيث أبلغت إحدي الشخصيات الهامة بتقديم طلب لترخيص شركة الأصيل حتي يكون لها سند قانوني للحفاظ علي أموال المودعين.. ولكني رفضت لأنها ليس لها سند قانوني وإنما تعمل بطريق غير مشروع وغير قانوني.<br />وأكد مصدر أمني رفيع المستوي أنه سيتم خلال ساعات ضبط المتهم الهارب وباقي المتهمين لتقديمهم للنيابة.<br />وكانت البلاغات قد انهالت أمام المقدم جمال الدغيدي رئيس مباحث طوخ من العديد من المواطنين بقيام المتهم الهارب بالاستيلاء علي أموالهم ويدعي أحمد عادل صبيح 33 سنة موظف بأحد البنوك وتجمهر المودعون أمام نقطة مرور طوخ وفيللا المتهم.. تم إخطار اللواء مبروك هندي مدير أمن القليوبية.. انتقل اللواء سيد شفيق مدير المباحث والعميد مدحت النادي رئيس المباحث والمقدم حسام الحسيني مفتش مباحث طوخ وقوات الشرطة المصفحة والكلاب البوليسية لتفريق المتجمهرين بعد أن أكدت أجهزة الأمن للضحايا أنه سوف يتم ضبط المتهمين خلال ساعات.<br />أكدت التحريات صحة ما جاء بالبلاغات وأن الواقعة بدأت عندما حاول الضحايا الاتصال بالمتهم الهارب للحصول علي ربحهم الشهري لكنه لم يرد فتجمع عدد كبير منهم أمام شركة المتهم وفوجئوا بإغلاق باب الشركة فتأكدوا أنهم وقعوا ضحية للنصب من المتهم وحاولوا اقتحام الشركة والمنزل إلا أن قوات الشرطة حاصرت المنطقة.<br />كما أكدت تحريات المقدم جمال الدغيدي رئيس مباحث مركز طوخ أن النصاب بدأ منذ عدة سنوات في تجارة المحمول وذاع صيته بمدينة طوخ واشتهر بأنه يقوم ببيع كروت الشحن بأسعار أقل بكثير من أي تاجر آخر وأنه كان يكتفي بتحقيق هامش ربح بسيط ليتمكن من بيع عدد هائل من الكروت حتي يتمكن من الحصول علي عمولات من شركات المحمول باعتبار أن شركته تحقق أعلي نسبة توزيع في القليوبية.<br />كما تبين للعميد مدحت النادي رئيس مباحث القليوبية أن من بين الضحايا عددًا كبيرًا من مدينة الخانكة وذلك بعد أن تلقي المقدم خالد بدر رئيس مباحث الخانكة بلاغات من 150 مواطنا بأن النصاب قد حصل منهم علي مبالغ تعدت 100 مليون جنيه وأنهم كانوا يحصلون علي أرباح شهرية تتراوح ما بين 10% و40% حتي فوجئوا بهروبه.<br />قال المودعون في تحقيقات النيابة إنهم سمعوا منذ عدة سنوات بشركة المحمول في طوخ وانبهروا بما يصرفون من أرباح شهرية.. المثير في الأمر وهو ما جاء علي لسان المودعين في تحقيقات النيابة أنهم كانوا يلجأون إلي الواسطة لوضع نقودهم لدي المتهم.<br />أشاروا إلي أنهم فوجئوا بهروب المتهم من بعض المودعين أصدقائهم.. وأوضحوا أنهم لم يتعاملوا مباشرة مع صاحب الشركة ولم يروه شخصيا وأنهم كانوا يعطون النقود المراد إيداعها إلي أحد الأشخاص في كل منطقة وهذا الشخص هو الذي كان يتولي التوقيع علي الإيصالات.<br />استمعت النيابة حتي الآن لأقوال أكثر من 70 مودعا بينما تجاوزت البلاغات المقدمة 120 بلاغا ومازالت البلاغات تنهال علي أقسام الشرطة بالقليوبية خاصة في مدينة طوخ موقع صاحب الشركة"
archived = "2010-03-14"
