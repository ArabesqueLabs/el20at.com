subject = "ياسلام على النصابين"
author = "mahmoud almasry"
posted = "2007-12-16"
text = "بنت أنسه يعنى شغاله فى محل موبيلات فى يوم من الايام دخل عليها رجل وعامل نفسه غلبان كدة قال للانسه عايز أشحن كارت على الهوا قالتله لحظه وهشهنلك قالها طب بصى خدى تليفونى عندك أهوة أشحنيلى على بال ما أجى قالتله ماشى سيبه خرج الرجل وبعد شويه المحل أتزحم راح جاى الرجل وسرق تليفونوا فى الزحمه ومشى وبعد لما المحل هدى وفضى راح جاى بيقولها فين التليفون بتاعى شحنتيلى قالتله والله التليفون كنت حاتاه هنا وأتسرقه راح النصاب منعج يعنى ايه التليفون اتسرق وراح ملبس الانسه انها حراميه وقالها انتى حراميه ونصابه فين التليفون يا حراميه راح ماشى الراجل وجايب ناس عايزين يكسروا المحل على اساس انه عايزة حقه بقه الراجل وهوة اصلا نصاب وحرامى اتصلت بصاحب المحل وايجة صاحب المحل عرف الموضوع قال للانسه اللى شغاله عندة روحى انتى وابعتيلى ابوكى راح ابوها وبعدين بعد دة كله انتهت على انى صاحب المحل وابو الانسه يدفعوا تمن التليفون 400 جنيه صاحب المحل 200 وابو الانسه 200 يبقى النصاب خد تليفونوا وخد 400 جنيه ومشى النصاب يعنى دة نصاب عالمى"
