subject = "مممممممممممممم"
author = "واحد من الناس"
posted = "2007-10-01"
text = "والله مش عارف انا عايز احكيلكو على نصباية صغيرة اتعرضتلها زمان وانا صغير (مع الاعتذار لهشام عباس)اخويا الكبير اخدنى من ايدى وودانى مكان بيقولو عليه مدرسة وقالى يلا علشان تبقى دكتور زى ما انت كنت عايز واجيبلك كراسات كتير واقلام وتكتب وترسم وتلون وفضلت احارب احارب لحد ما اتخرجت وقعدت على قهوة محترمة كل اللى شغالين فيها يعرفونى انا ودفعتىولحد دلوقتى مش عارف مين اللى نصب عليا وانا اتنصب عليا فايه (احلام الدكتور اتسرقت واحلام الشغل ضاعت واحلام العيشة الكريمة بدور عليها ومش لقيت غير كريمة وعايز حد يقولى نها فين اصلى بقالى سنين بدور على هند ومش لاقى مايسة وكل البنات بقت مايصة مع انى ياما بصيت لامى واتمنيت ان يكون عندى بيت زى بيتها والعربية اللى اتمنين اركبها شفتها بتقتل اصحابى )(حد يقولى مين نصب عليا وسرق احلامى ويقول لخالد وايمن اصحابى ويقول لوالدى ليه كان قادر ودلوقتى مش قادر )حد يمسك نصابين الاحلام اللى فككو احلامنا وقتلو كل امل فينا وحد يقولى مين اللى نصب على النصاب خلاه نصاب وساعتها هايهون بلاط السلم ورصيد الموبايل وكروت الشحن وركعتين الغلبان اللى اتسرق منه التاكسى لانه مش عارف ابسط قولعد دينه وعارف ان الموت على رؤوس الناس بس مش بينذرهم انذارات مباشرة ساذجة زى ما عمل ابو جلابية بيضا"
archived = "2010-03-14"
