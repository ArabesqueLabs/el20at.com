[[comments]]
order = 4
subject = "المتهم ضحية"
author = "تيتو"
posted = "2007-12-15"
text = "يا جماعه كلمة حق ...<br />أنا كنت شغال مع احمد عادل فى نفس المكان بس مش عاوز ازكر اسمه (على فكره هو بنك)..ده قبل مايستقيل ويتفرغ لشغله..وللأمانه احمد مؤدب جدا وخلوق جدا وابن ناس وشبعان جدا من زمان ورغم ان درجته الوظيفيه ماكانتش عاليه الا انه كان راكب عربية احسن من رئيس مجلس الاداره والكلام ده من زمان...وكان برضه من زمان عنده شغله الخاص بيه فى موضوع الموبايلات ده...<br />واللى افتكر انه حصل انه لما العمليه وسعت معاه فكر فى توظيف اموال الناس ولسبب او لأخر خسر او ماعرفش يلم العمليه لكن احمدمش ممكن يكون نصب او سرق لمجرد النصب ولكن هوه كمان ممكن يكون ضحيه فى الموضوع ده زيه زى الناس اللى سابوا فلوسهم معاه...<br />ربنا يوفق ويسترها ع الكل ويكفينا شر المستخبى.."
