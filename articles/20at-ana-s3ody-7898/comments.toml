[[comments]]
order = 8
subject = "البساطة..مفيش أجمل منها."
author = "عمار المصري"
posted = "2007-12-28"
text = "السلام عليكم..<br />كل سنة وكلنا بخير أولاً..<br />مسئلة نحتفل أو منحتفلش..يا جماعة إحنا ليه بنضيق الدنيا على نفسنا لدرجة إننا منشوفش غير رأينا وبس؟؟<br />فيها ايه لما ألاقى واحد مسلم أو مسيحي/سيان..وأقوله كل سنة وانت طيب أو هابى نيو يير حتى؟؟؟<br />فى شىء فى الدين للأسف بنستعبط لما منعرفوش اسمه(حُرمة الذات وحُرمة المحل)..<br />حُرمة الذات زى الخمر..مفيش فيها نقاش..لكن حُرمة المحل زى الأفلام الإباحية مثلا على النت أو التلفزيون..فوقت ما يكون فى شىء محرم فبتكون حرام محل..للمحل بس اللى وقتى دا..<br />لكننا للأسف..راضيين نعيش فى أضيق ما يكون..<br />القاضِ عياض بيقول كلمة روعه((كلما زاد عِلم الإنسان..كلما قل إنكاره))لأنه كل ما يكون عارف أكتر كل ما هيعرف إن الموضوع ليه آراءا كتيرو مش مقتصر على شىء واحد ومينكروش..<br />يااااااااااااااارب نكون على الأقل..قبلنا رأى غيرنا واحترمنا عيدهم ويعيدوا..ميعيدوش ليه يعنى..؟؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "حكمة حرام بالإجماع"
author = "اكتب اسمك هنا"
posted = "2007-12-29"
text = "الحمد لله والصلاة والسلام على رسوله وآله وصحبه وبعد<br />أولا السنة إظهار الشعائر الدينية الإسلامية بين المسلمين وترك إظهارها مخالف لهدي الرسول صلى الله عليه وسلم وقد ثبت عنه أنه قال عليكم بسنتي وسنة الخلفاء الراشدين المهديين تمسكوا بها وعضواعليها بالنواجذ الحديث<br />ثانيا لا يجوز للمسلم أن يشارك الكفار في أعيادهم ويظهر الفرح والسرور بهذه المناسبة ويعطل الأعمال سواء كانت دينية أو دنيوية لأن هذا من مشابهة أعداء الله المحرمة ومن التعاون معهم على الباطل وقد ثبت عن رسول الله صلى الله عليه وسلم أنه قال من تشبه بقوم فهو منهم والله سبحانه يقول وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان واتقوا الله شديد العقاب<br />وننصحك بالرجوع إلى كتاب اقتضاء الصراط المستقيم لشيخ الإسلام ابن تيمية رحمه فإنه مفيد جدا في هذا الباب<br />وبالله التوفيق وصلى الله على نبينا محمد وآله وصحبه وسلم<br />اللجنة الدائمة للبحوث العلمية والإفتاء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "مبروووووووووووووووووووووووووك على الأمة"
author = "نور"
posted = "2007-12-30"
text = "عندما كان يمر القائد صلاح الدين الأيوبي بين المعسكرات فيسمع همهة قراءة القرآن الكريم، كان يقول: من هنا يبدأ النصر، ولهذا فبشرانا جميعا بقناة الحافظ الفضائية، ونشكرك أخي علي على هذا الموضوع، وجعل الله جهدكم في ميزان حسناتكم، وأرجو أخي الفاضل أن تخبرني ما هو تردد القناة، وأرجو من الأخوة المشاركين أن يخبروني بتردد قناة الحافظ<br />ولنتواصى فيما بيننا أن نكون قرآننا يمشي على الأرض حتى يأتي النصر إن شاء الله"
archived = "2010-03-14"
capture_url = ""

