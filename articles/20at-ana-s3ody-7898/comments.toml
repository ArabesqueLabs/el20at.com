order = 0
subject = "علماء على مائدة القرآن"
author = "علي"
posted = "2007-12-27"
text = "لسلام عليكم ورحمة الله وبركاته<br />تخيلوا قناة فيها كل هؤلاء العلماء<br />الدكتور عبد الحي الفرماوي<br />الدكتور عبد الستار فتح الله<br />الدكتور أكرم رضا<br />الدكتور شوقي إبراهيم<br />الاستاذ حازم صلاح أبو إسماعيل<br />الفنان القدير وجدي العربي<br />كلهم جمعهم حب القرآن والرغبة في أن يكونوا ضمن حديث رسول الله صلى الله عليه وسلم \"خيركم من تعلم القرآن وعلمه<br />كل هؤلاء العلماء على قناة الحافظ والتي تهدف لخدمة القرآنوتقديم<br />علومه بطريقة سهله وبسيطة<br />قناة الحافظ طريقك لحفظ كتاب الله بيسر وتيسير"
archived = "2010-03-14"
