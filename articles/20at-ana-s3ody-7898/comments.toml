posted = "2007-12-30"
text = "السلام عليكم ورحمة الله وبركاته<br />فعلا أنا أشاهد حاليا البث التجريبي لقناة الحافظ الفضائية، وترددها 12360 أفقي، وشعارها: خيركم من تعلم القرآن وعلمه،ومشكور أخي على ها الوصية الغالية، ففي القرآن خيرا الدنيا والآخرة"
