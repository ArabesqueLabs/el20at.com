author = "هنضحك على بعض"
posted = "2009-08-04"
text = "الرغيف ابو شلن مين اللى بياكلة<br />الفراخ والبط فى عشش الفراخ لانة لا يصلح للاستخدام الادامى اصلا<br />لية<br />لان الحرامى مستورد القمح بيشترية بتراب الفلوس ويكسب في الطن خمسين دولار ويبيعة للحكومة والحكومة تدفع من الدعم للحرامى وتطحنة وبوساختة تعجنة وتوزعة للناس<br />المستفيد من الدعم الحرامى الاول اللى هو المستورد انما المستهلك الغلبان هيستفيد اية<br />لية الحكومة لا تستورد بنفسها القمح<br />والا الحرامية بينفعوا بعض تحت بند الدعم<br />وبدل الدعم لية الحكومة ما بتعملش مصانع وتوظف الناس دى بفلوس الدعم ويشتروا عيش نظيف<br />والا المحافظة على الفقراء للتهليب من ورائهم"
