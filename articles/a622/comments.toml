[[comments]]
order = 5
subject = "سنفور الوطنى"
text = "لا اجد شئ اصف به \"شعورى\" عند سماع النشيد الوطنى المصرى العظيم غير انه مثل \"شعورى\" دائما وابدا ومثل \"شعور\" كل المصريين, مجعد ويحتاج الى الكثير من الجاز ,كما انه ملئ بالقشر من كل شكل ولون: قشر لب قشر بيض قشر بطيخ ولا اعرف اى صابون سائل الى الان قادر على الحل"
archived = "2004-09-17"
capture_url = "https://web.archive.org/web/20040917094536/http://www.20at.com:80/article.php?sid=622"

[[comments]]
order = 6
subject = "رغم"
text = "رغم غني مخنوق من المشاكل اللي في بلدي واهمها الأخوة الطيبين اللي بيحكمونا لكن معلش<br />أنا فعلا لو قلت النشيد عينيا بتدمع غصب عني وبشكل فعلا كله حب للوطن"
archived = "2004-09-17"
capture_url = "https://web.archive.org/web/20040917094536/http://www.20at.com:80/article.php?sid=622"

[[comments]]
order = 7
subject = "بحب مصر قوي"
text = "أنا مش بس بحب النشيد الوطني وعيني بتدمع لما بسمعه. دي أي أغنية فيها كلمة مصر أو أهل مصر بتعمل فيا نفس التأثير. متتريقوش أنا فعلا بحب مصر قوي على الرغم من كل الظروف اللي احنا عايشينها."
archived = "2004-09-17"
capture_url = "https://web.archive.org/web/20040917094536/http://www.20at.com:80/article.php?sid=622"

[[comments]]
order = 8
subject = "محمد...... (منقول)"
text = "بسم الله الرحمن الرحيم ..<br />يعنى أيه نشيد - وطنى ..<br />أنا لا أعرف الا الحزب الوطنى بس .<br />(منقول من ساحة حوار إسلام أون لاين.نت)"
archived = "2004-09-17"
capture_url = "https://web.archive.org/web/20040917094536/http://www.20at.com:80/article.php?sid=622"

[[comments]]
order = 9
subject = "ياه"
text = "الاخوه الظرفاء<br />يعنى ايه حجاب!<br />رمز اسلامى وفريضه على كل من ارتضى اعتناق العقيده الاسلاميه<br />يعنى ايه نشيد وطنى!<br />يعنى رمز وطنى وواجب على كل من ارتضى هذا البلد وطنا له<br />اسالوا شهداء 73<br />الرسول عليه افضل الصلاة والسلام كان يعشق مكه وقال ذلك كثيرا كأنه نشيد يفخر بترديده"
archived = "2004-09-17"
capture_url = "https://web.archive.org/web/20040917094536/http://www.20at.com:80/article.php?sid=622"

[[comments]]
order = 10
subject = "وائل عباس"
text = "هنا القاهرة<br />البرنامج العام يقدم<br />برنامج : قل ولا تقل ...<br />قل : الحزن الوثني الغير ديمقراطي<br />ولا تقل : الحزب الوطني الديمقراطي ...<br />الله يرحمك يا سيد يا درويش<br />ولعنة الله على من اسماه السلام الجمهوري<br />وهو سلام لكل المصريين وان افقده من يحكموننا اي معنى جميل !!!"
archived = "2004-10-27"
capture_url = "https://web.archive.org/web/20041027191511/http://www.20at.com:80/article.php?sid=622"
