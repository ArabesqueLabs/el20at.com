[[comments]]
order = 1
subject = "الحمد لله"
text = "تخيلوا كنت بنصور ان انا الوحيدالمهتم باموضوع ده وكنت بتكسف لما اشوف العجوز الامريكانى مندمج اوى مع النشيد بتاعهم واحنا فى اى ماتش للمنتخب الموكوس بتاعنا هما اول بقين والناس تلغبط وياما كتبت فى بعض الخواطر عن الحالةدى زى ما تلاقى علم مصر مقطع ومتبهدل وبقالة مبت سنة متغريش فوق اى مصلحة حكومية اوبنك او جامعة ولا مؤخذة ما ينفعش تمسح بيه جذمتك ولكن صورة الريس اخر حلاوة ونضافة ومش بعيد تلاقى معينين لها حارس وعامل اه انا نسيت معلش<br />الوضوع عن النشيد بس كله موصل لكله انا عايز المشاركة اللى بعدية تكون النشيد المصرى كامل ومحادش يقولى اكتبه انت لانى حاولت و وقفت عند 00(يرعوا الزمام)"
archived = "2004-09-17"
capture_url = "https://web.archive.org/web/20040917094536/http://www.20at.com:80/article.php?sid=622"

[[comments]]
order = 2
subject = "انت تأمر"
text = "بلادي بلادي بلادي، لك حبي وفؤادي<br />مصر يا أم البلاد، أنت غايتي والمراد<br />وعلى كل العباد، كم لنيلك من ايادي<br />مصر انت أغلى درة، فوق جبين الدهر غرة<br />يا بلادي عيشي حرة، واسلمي رغم الأعادي<br />مصر أولادك كرام، أوفياء يرعوا الزمام<br />سوف تحظي بالمرام، باتحادهم واتحادي<br />بلادي بلادي بلادي، لك حبي وفؤادي"
archived = "2004-09-17"
capture_url = "https://web.archive.org/web/20040917094536/http://www.20at.com:80/article.php?sid=622"

