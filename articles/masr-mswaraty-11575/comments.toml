subject = "من اجل هذا قامت ثورة 23 يوليو المشئومه"
author = "اكتب اسمك هنا"
posted = "2009-03-16"
text = "طبعا زي ما انتو شايفين كده حكام مصر كان فيهم اثر من الخلافة العثمانية<br />فبريطانيا حبت تقطع صلة مصر بقضية الخلافة دي وراحت المخابرات البريطانية لمت شوية العيال الحوش ودخلتهم الجيش مع انه الزبالة كانت ممنوعة من دخول الجيش المصري لكن بريطانيا دخلتهم وساعدتهم في عمل التنظيم المشئوم<br />وقال ايه انسحبت بريطانيا من امام جمال عبدالناصر وعبدالناصر هو اللي طرد الانجليز وبعد 10 سنين راحت مصر في ستين داهية في هزيمة 67<br />منهم لله سفلة الثورة"
archived = "2010-03-14"
capture_url = ""

