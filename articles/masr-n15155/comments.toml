[[comments]]
order = 0
subject = "لماذا يستعدى النظام الشعب هل هو غبى الى هذة الدرجة ؟"
author = "مش فاهم"
text = "صبى عمرة 15 سنة يدة مربوطة بالكلابشات فى سرير - وهو مصاب كم يتحمل ويدة مربوطة على هذا الوضع - ساعة - ساعتين وبعدين ايدة تنمل ويبدأ الصراخ والبكاء<br />ماذا يريد النظام الامنى بهذة الصور ؟<br />اثارة الشعب المصرى<br />شحنة بالغضب<br />احداث تفجير تانى<br />ما يتلم الواد العادلى ويتنيل على خيبة اهلة ويسيب العيال تروح عند امها"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413151430/http://masr.20at.com:80/newArticle.php?sid=15155"

[[comments]]
order = 1
subject = "تخبط حكومة الزهايمر وبطرس غالى"
author = "قرفان"
text = "وزير المالية بتاع لجنة السياسات بطرس ابن بطرس غالى انفق مليونين من الجنيهات على اعلانات فى الفضائيات الخاصة تدعو الى جمع الضرائب<br />الوزير المصرى فى احد اعلاناتة التلفزيونية<br />الاعلان بيقول للمصرى لما تروح تحلق شعرك عند الحلاق اوعى تنسى تاخد فاتورة علشان تضمن حق الولة<br />وانا لفيت بلاد كتيرة قوى برة ولم ارى حلاق يعطى فاتورة<br />طيب واذا كان الحلاق فى بلدنا امى ولا يعرف القراءة ولا الكتابة يبقى يوظف كاتب يكتب لة فاتورة<br />الراجل دة عايش فى مصر<br />وعارف المصريين والا قرأ كلمتين فى كتاب<br />طيب انا شفت ناس زمان بيحلقوا ببيضة وبيضتين<br />ولسة الناس بتتريق لما يشوفوا واحد حلق شعرة ويقولوا لة الفرخة باضت<br />مليونين اعلانات كلام فارغ يا مفترى من دم الغلابة"
archived = "2008-04-13"
capture_url = "https://web.archive.org/web/20080413151430/http://masr.20at.com:80/newArticle.php?sid=15155"
