text = "العباسي خان اصدقائه بعد أن ساندوه في رئاسة الاتحاد ظن انه بذلك سيخلو له الجو ليبيع الحمام كيفما شاء داخل الاتحاد لقد ذهلت عندما علمت انه باع حمام باكثر من 200 الف جنية في عام واحد يا ريتني كنت رئيس اتحاد شغله عال العال ولا ضرائب ولا حجوزات"
