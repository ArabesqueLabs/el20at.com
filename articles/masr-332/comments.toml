text = "بجدجنان وحلوه جدا جدا<br />مبارك عليكم<br />تسلم ادين قلى ريش<br />تسلم دماغ قلى هيس<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
