[[comments]]
order = 0
subject = "رد على انت مع فتح ولا حماس"
author = "ابومحسن"
posted = "2007-06-18"
text = "انا مع اهل السنه والجماعة<br />وفتح اهل سنه وجماعه<br />وحماس اهل سنه وجماعه<br />واهل السنه والجماعة لازم يعرفوا عدوهم<br />وعلشان خاطر هما مش فاهمين انهم اهل سنه وجماعه يبقى النتيجة زي ما انتوا شايفنها<br />وعلى فكره يا جماعه صدام حسين ما كنش يعرف انه من اهل السنه والجماعه<br />عرف امتى<br />لما حبل المشنقه لف حوالين رقبته عرف ساعتها انه مسلم سني"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "دولا مين ودولا مين"
author = "بنت مصرية"
posted = "2007-06-18"
text = "دولا اهل فلسطين انا مع الحق الفلسطينى اينما كان ومع الشرعية والحق اما رأيى فيما حدث فى غزة فقد ترك غصة فى حلقى ان ارى الدم الفلسطينى يسفك بيد الفلسطينى لكنى احمل فتح المسئولية بالدرجة الاولى لانها عندما كانت تحكم لم نرى هذا الانفلات الامنى من اى فصيل من فصائل المقاومة لكن فتح مثلها مثل كل الانظمة العربية التى لاهدف لها سوى البقاء فى السلطة بأى ثمن حتى ولو كان الثمن هو بيع القضية والشعب الفلسطينى فمنذ تسلمت حماس السلطة ولاهم لفتح وخصوصا صقورها امثال محمد دحلان سوى اسقاط حكومة حماس بطرق غير شريفة وبالتواطؤ مع المخطط الامريكى الصهيونى وياللحسرة بمساعدة بعض الدول العربية وزاد الطين بلة تماديهم فى غيهم بخطف وقتل اامة المساجدوالقتل على الهوية فكان الضغط الذى ولد الانفجار والذى كنا لانتمناة لكن كان خطوة لابد منها لردع هؤلاء العملاء الخونة الذين باعوا وطنهم وقضيتهم بابخس الاثمان وحسبنا اللة ونعم الوكيل فى كل خائن وعميل فى الوطن العربى وما اكثرهم"
archived = "2010-03-14"
capture_url = ""

