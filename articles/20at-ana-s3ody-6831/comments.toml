text = "السباحه من وجهت نظري هي اجمل الرياضات على الاطلاق وبما انني مدربه سباحه اجد متعه بتعليم السباحه<br />وفي ممارسه السباحه رياضه وترفيه .... رياضه السباحه اكثر انوع الرياضه يلاحظ على الجسم التغير من ناحيه الوزن والمنظر ونلاحظ اكثر الشباب او البنات الممارسين لهذه الرياضه القوامي الجسم الرياضي<br />ومن يحتاج مدربه سباحه انا موجوده"
