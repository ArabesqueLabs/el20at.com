order = 0
subject = "عدد المسيحيين 4% يعنى اربعة ملايين"
author = "سعيد"
posted = "2008-03-02"
text = "فى فرنسا ستة ملايين مسلم<br />وفى بريطانيا خمسة ملايين مسلم<br />وتسرى عليهم القوانين المسيحية بعدم الزواج باكثر من واحدة اوذا تزوج اثنين يحاكم رغم سماح دينة بذلك<br />لماذا لا يقبل النصارى القوانين الاسلامية فى الزواج والطلاق<br />من حقهم ان يطلقوا وان يتزوجوا<br />العهد القديم الذى يؤمنون بة لم يحرم الطلاق ولم يحرم الزواج<br />ان هى الا رهبانية ابتدعوها"
