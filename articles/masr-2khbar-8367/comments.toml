[[comments]]
order = 1
subject = "أخييييييه حيقلدوا المسلمين"
author = "مش رايح"
posted = "2008-03-03"
text = "ايه دا دا المسيحيين ما عندهمش طلاق والحجاب الوحشة دي<br />ازاي يقلدوا المسلمين ويطلقوا ويعملوا حجاج زي دي<br />لا وايه كمان حيتجوزا بعد الطلاق زي المسلمين<br />وحياة ابوكم وامكم بكره حيبقى عندكم تعدد زوجات قريب جدا<br />والبابا شنوده حيتجوز زي شيخ الازهر"
archived = "2010-03-14"
