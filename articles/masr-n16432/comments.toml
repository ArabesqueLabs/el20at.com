subject = "كده صح استاذة السياسة تتكلم في السياسة"
author = "مش البراء اشرف ولا شريف الدواخ"
posted = "2008-06-25"
text = "كده صح<br />استاذة السياسة تتكلم في السياسة<br />لكن الدكتور عصام العريان طبيب بشري متخرج من كلية الطب ازاي يبقى رئيس المكتب السياسة لمنظمة الاخوان المسلمين"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151116/http://masr.20at.com:80/newArticle.php?sid=16432"

[[comments]]
order = 1
subject = "الاخوان المسلمون لا يصلحون لاي تجديد او اصلاح"
author = "مش ححبك"
posted = "2008-06-25"
text = "الاخوان المسلمون لا يصلحون لاي تجديد او اصلاح لان عقليتهم عقلية سجون ومعتقلات<br />الانسان اللي ما يخفش على اسرته على سبيل المثال وليس الحصر الزوجة والاولاد ويدخل السجن علشان يبقى سياسي كبير دا لا يستأمن على شعب<br />واذا كانوا سيقومون بتطبيق الشريعة الاسلامية فهذا مردود عليه<br />لان هناك خلفاء كثيرون ايام الخلافة الاسلامية جاروا على العباد بالشريعة الاسلامية<br />فالانسان اللي يقسوا على نفسه بهذه الطريقة لدرجة انه يدخل يقعد في السجن لمدد وصلت الى 20 سنه دا انا في رايي لا امل فيه في اصلاح اي شيء وخرجي السجون والمعتقلات لابد لهم من اعتزال الحياة السياسية فورا وعلى راسهم المرشد العام<br />ممكن يحكم مصر واحد زي عمر خالد لانه انسان طبيعي ما دخلش سجون ومعتقلات"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151116/http://masr.20at.com:80/newArticle.php?sid=16432"

[[comments]]
order = 2
subject = "شوية عقل يا جماعة"
author = "عبد الرحمن"
posted = "2008-06-25"
text = "السلام عليكم<br />من قال ان من يدخل السجونلا يصلح للاصلاح والتجديد ، يعني المظام لما يحب يتخلص من حد يحطه في السجن كام سنة وخلاص يحمد ربنا علشان مش هيكون له لازمة بعد كده<br />وأكبر دليل على كده الدكتور يوسف القرضاوي ،<br />ثم لماذا نشكك في نوايا الناس بهذه الطريقة السيئة وبأي وجه حق نحكم عليهم بانهم يدخلون السجن للشهرة ومن يرضى بالسجن والبهدلة علشان شوية سمعة<br />وبعدين مين قال انهم بيهملوا اسرهم أنظر إلى أبناء وبنات الإخوان المحكوم عليهم في المحاكمات العسكرية وهتعرف انهم ربوهم أحسن وأشرف تربية. والموضوع في الآخر موضوع أولويات..<br />أخيرا اللي دخلو السجون واتبهدلوا واتعذبوا هما دول الناس اللي مستعدة تضحي وتبذل للبلد كمان وكمان ................. مش غيرهم."
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151116/http://masr.20at.com:80/newArticle.php?sid=16432"

[[comments]]
order = 3
subject = "الاخوان يحكمون الان - اعتبار من الكادر الوسط وحتى"
author = "مش لاعب"
posted = "2008-06-25"
text = "الاخوان فى كل المصالح والجهات الحكومية وفى الجيش والشرطة وفى كل القيادات المتوسطة المدنية والعسكرية<br />ومش من دلوقتى<br />كلا<br />من ايام عبد الناصر وايام السادات<br />حاول عبد الناصر تنفيذ الاشتراكية ولكن الموظفين الصغار الاخوان عرقلوا تنفيذها باسلوب<br />ابقى عدى علينا بكرة<br />ختم النسر مش واضح<br />لا - عين النسر مغمضة فى الختم وهات لنا ختم تانى وتوقيع على الطلب واضح<br />يعنى محدش يقدر عليهم<br />دى حاجة متغلغلة فى الشعب<br />بقى القيادة العليا<br />واظن انهم باتوا قريبين جدا منها"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151116/http://masr.20at.com:80/newArticle.php?sid=16432"

[[comments]]
order = 4
subject = "امريكا بتلمع الاخوان يا جماعة"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-06-25"
text = "طالما واحدة سياسية كبيرة مثل الدكتورة اللي فوق كتبت مقال مثل هذا<br />يبقى المخابرات الامريكية شغالة كويس في تلميع الاخوان<br />زي فتحي سرور رجع من امريكا عايز يعمل حزب للاخوان<br />وبوش احرج مبارك في منتدى دافوس وقالوا ناس في الحكم ومعارضة في السجن<br />امريكا بتلمع الاخوان يا جماعة<br />الاخوان هما الكارثة القادمة لا محاله<br />وبكره نقعد على الحيطه ونسمع الزيطه"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151116/http://masr.20at.com:80/newArticle.php?sid=16432"

