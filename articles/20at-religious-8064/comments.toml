text = "الحقيقه ان للنقاش نشوه رائعه حينما يحتشد المُتناقشون بأفكارهم وارائهم حتى وأن اختلفت فهذا دليل على صحة المجتمع ثقافياً ما اجمل النقاش وأروعه بين مسيحي ومسلم ويهودي ولا ديني ولاكن بشرط ان يكون نقاش نابع من الشخص نفسه ومن رأيه ولا يمنع الاستشهاد بأدله من القرأن والسنه النبويه المطهره او اقوال فلاسفه وغيرهم من مفكرين اما ان يكون النقاش على طريقة copy-pasteكما فعل الاخ خالد وكأنه بذلك يُثبت لنا الأيه الكريمه اللتي فيما معناها كاحمار يحمل اسفاراً لا يدري مابداخلها من غث وسمين ومفيد وضار كنت اتمنى مناقشة الاخ خالد في كل الجزئيات واحده تلو الاخر ولكن لا استطيع لأنه مجرد ناقل لا اقل ولا اكثر اذا لا يحق لنا ان نناقشه الا ان كان هو الكاتب الفعلي وهذا من ادب الحوار 0<br />همسه للاخ خالد: اذا اردت النقاش فلك ذلك ولكن بشرط ان تكون انت الكاتب"
