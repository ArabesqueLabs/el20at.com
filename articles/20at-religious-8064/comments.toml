subject = "شتان بين هذا وذاكـ .. !!"
author = "غسان عويضه ( ابن المدينة المنو"
posted = "2008-08-15"
text = "السلام عليكم ورحمة الله وبركاته ،،<br />الحمدلله الذي أنعمنا بنعمة الإسلام وجعلنا أمة وسطاً وجعل فينا سيدنا محمد صلى الله عليه وسلم نبياً ورسولاً ..<br />أحب في بداية الأمر أن أشكر م / خالد المطرفي وأقول له جزاكـ عنا خير الجزاء وجعله الله في موازين حسناتك ..<br />شتان بين خالد و خالد ..<br />رجلٌ ملحد لا يعلم من أمره شيئاً .. فاسدٌ يأتي بالأخبار الكاذبة .. والأدهى إعترافه بالإلحاد آنفاً .. ! بل ويفتخر بذلكـ !!<br />إذا ً أحبتي هذا ينطبق عليه قول الله تبارك و تعالى \\\\\\\" يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا أَنْ تُصِيبُوا قَوْمًا بِجَهَالَةٍ<br />فَتُصْبِحُوا عَلَى مَا فَعَلْتُمْ نَادِمِينَ ) الحجرات آية 49 ..<br />وهذا حالنا يا معشر المؤمنين والمؤمنات أياً كان ملحداً أو كافراً .. لا بد أن نتبين من خبره وما صحة أحاديثه التي يستند عليهـا .. ووجدنا أنه \\\\\\\" فارغ الرأس \\\\\\\" لا يعلم عن أمر الإسلام إلا إسمه ..<br />أخيراً أقرأ لكل من مشى على نهجه أولئك الملحدين قول الله تعالى ( إِنَّ الَّذِينَ يُلْحِدُونَ فِي آيَاتِنَا لا يَخْفَوْنَ عَلَيْنَا أَفَمَنْ يُلْقَى فِي النَّارِ خَيْرٌ أَمْ مَنْ يَأْتِي آمِنًا يَوْمَ الْقِيَامَةِ اعْمَلُوا مَا شِئْتُمْ إِنَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ ) ..<br />وهذا تفسير ابن كثير للآية ..<br />\\\\\\\" إِنَّ الَّذِينَ يُلْحِدُونَ فِي آيَاتنَا \\\\\\\" قَالَ اِبْن عَبَّاس : الْإِلْحَاد وَضْع الْكَلَام عَلَى غَيْر مَوَاضِعه وَقَالَ قَتَادَة وَغَيْره هُوَ الْكُفْر وَالْعِنَاد . وَقَوْله عَزَّ وَجَلَّ \\\\\\\" لَا يَخْفَوْنَ عَلَيْنَا \\\\\\\" فِيهِ تَهْدِيد شَدِيد وَوَعِيد أَكِيد أَيْ أَنَّهُ تَعَالَى عَالِم بِمَنْ يُلْحِد فِي آيَاته وَأَسْمَائِهِ وَصِفَاته وَسَيَجْزِيهِ عَلَى ذَلِكَ بِالْعُقُوبَةِ وَالنَّكَال وَلِهَذَا قَالَ تَعَالَى \\\\\\\" أَفَمَنْ يُلْقَى فِي النَّار خَيْر أَمْ مَنْ يَأْتِي آمِنًا يَوْم الْقِيَامَة \\\\\\\" أَيْ أَيَسْتَوِي هَذَا وَهَذَا ؟ لَا يَسْتَوِيَانِ. ثُمَّ قَالَ عَزَّ وَجَلَّ تَهْدِيدًا لِلْكَفَرَةِ \\\\\\\" اِعْمَلُوا مَا شِئْتُمْ \\\\\\\" قَالَ مُجَاهِد وَالضَّحَّاك وَعَطَاء الْخُرَاسَانِيّ \\\\\\\" اِعْمَلُوا مَا شِئْتُمْ \\\\\\\" وَعِيد : أَيْ مِنْ خَيْر أَوْ شَرّ إِنَّهُ عَلِيم بِكُمْ وَبَصِير بِأَعْمَالِكُمْ وَلِهَذَا قَالَ \\\\\\\" إِنَّهُ بِمَا تَعْمَلُونَ بَصِير \\\\\\\" .<br />وعطرنـا م/ خالد المطرفي جزاه الله عنا وعن كل المسلمين خير الجزاء .. والله أشفيت قلوبنا بكلماتٍ أنارها الله ووضعها بقلبك يا فخرنا وفخر الإسلام بإذن الله .. لذا فجزاك الله خير الجزاء .. يقول الله تعالى ( يَا أَيُّهَا الَّذِينَ آمَنُوا مَنْ يَرْتَدَّ مِنْكُمْ عَنْ دِينِهِ فَسَوْفَ يَأْتِي اللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ أَذِلَّةٍ عَلَى الْمُؤْمِنِينَ أَعِزَّةٍ عَلَى الْكَافِرِينَ يُجَاهِدُونَ فِي سَبِيلِ اللَّهِ وَلا يَخَافُونَ لَوْمَةَ لائِمٍ ذَلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَنْ يَشَاءُ وَاللَّهُ وَاسِعٌ عَلِيمٌ ) ..<br />أحبك في الله يا م/ خالد المطرفي ..<br />فنكوووش أدعو الله أن يكون القرءان شاهداً لك لا عليك يوم تلقاهـ ..<br />فالقرءان إما حجة لك أو عليك ..<br />إعمل بما تحفظ .. << خذها نصيحة مني<br />أخيراً أدعو الله الكريم أن يوفقنا وإياكم لما فيه الخير للإسلام والمسلمين ..<br />وسلامٌ على المرسلين والحمدلله رب العالمين"
