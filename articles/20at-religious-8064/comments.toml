text = "ردا على المدعو خالد انبهك تأدب واحترم نفسك عندما تتحدث عن رسول الله لا تنادية باسمة فهو المكرم و المشرف على باقى سائر الانبياء فما بالنا بالبشر فهو سيدنا وحبيبنا وقرة عيننا . ثانيا انت لا تؤثر معك آيات القرآن وتتعجب من ذلك لا تتعجب فقد اتى فى القرآن ردا على شاكلتك ( افلا يتدبرون القرآن ام على قلوب اقفالها) فقلبك لم يدخل بة الايمان هذا ان كنت مسلم ولا اتوقع ابدا ذلك !!!!!!! فنحن نؤمن بالله ونشهد له بالوحدانية ونشهد لرسولنا سيدنا محمد علية الصلاة والسلام بالرسالة مصدقين ما نزل علية من آيات الله القرآن العظيم سبب هداية العالمين وشفاء لما فى الصدور ... فمت بغيظك"
