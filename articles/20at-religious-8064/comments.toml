subject = "بصلة حياتك ولا بطيخة حياتك، احنا مالنا"
author = "Fankoush"
posted = "2008-01-20"
text = "يا ست منى سليم من القاهرة، نشكر الرب الإله يهوه على إنه نور حياتك ولقيتي بوصله، عقبال يا رب كل المصريين الغلابة ما يلاقوا بصله يعملو عليها حبة تقلية ويعشوا عيالهم ويناموا، يعني هيا المسألة مش ناقصة شعوذه، أنا حافظ القرآن كله من عندي عشر سنين، وعمري ما اتعاملت مع الموضوع أكثر من إنه كتاب عبادات أو عمل أدبي جيد، أما إن الآيات بتعطر الفم وتروق الدم، وبوصلة وبصلة فده مستوى جديد من الإبيستمولوجي لم أعرفه من قبل ويفكرني بالراحل الدكطور مصطفى محمود بتاع شوف الفرخة سبحان الله،يعني هما المصريين المسلمين اللي غرقوا في مياه المالح دول هما هاجين من البلد ملقيوش البوصلة بتاعتك دي؟ ولا واحد من الكفرة اللي غرقوا دول كان حافظلوا ايه واحدة توحد ربنا، حرام عليكم انت معندكمش اخوات بنات، ولا هيا دي أزمة الطبقة الوسطى الجديدة في مصر، عين في الجنة وعين في النار، ماسنجر آه وسايبر سكس ممكن بس لازم آية قرآن أو إنجيل وكام فوروارد كده واديها علشان تكسب الثواب وتخش الجنة، إلهي أشوف فيكم يوم يا بعدا"
archived = "2010-03-14"
