text = "الى الاخ الي بيدعي انه حافظ القلران من عمره عشر سنين _ اقول يا اخي اتقي الله الذي خلقك وجعلك شييء ولم تكن قبل ذلك شيا تذكر كيف تدعي ان القران عملا ادبيا جيدا وهو معجزة خاتم الانبياء وكلام الله الخالق المصور ان كنت تريد التكلم فتكلم في مواضيع بحجمك لا تتعدى حدود الله ( الله يهديك وينور بصيرتك ويتوب عليك ) على فكرة انا ست اعرف الله حق قدره ولا ادعي التدين او الخوص في مجال الدين لكن بصراحة اسمئزت نفسي من كلامك"
