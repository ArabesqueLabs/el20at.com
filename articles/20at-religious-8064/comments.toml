subject = "سبحان الله"
author = "بنت مكه"
posted = "2008-01-21"
text = "بسم الله الرحمن الرحيم<br />عندما بدأت بقرائة الموضوع اعجبتني فكرة بوصلة الحياه وكم هو رائع ان نجعل ايه من كتاب اللهتكون شعار لنا في حياتنا<br />فكم من البشر شعاراتهم هي من أقول فلاسفه او مفكرين او شعراء وتثبت نجاحها<br />فماذا نقول نحن عندما يكون شعارنا كلمات الخالق البارئ<br />لافرق بين مسلم او مسيحي او يهودي ولا نختلف في مبدأ ان التمسك بكلمات الله هو طريقنا للنجاه وهذه الكلما اوجهها للاخ فنكوش فكاتبة الموضوع لايشترط ان تكون من الطبقة الوسطى لكي تكتب هذه الكلمات<br />ولك انت حرية ان تقرأ هذا الموضوع او لا<br />ولك حرية الرد ولكن في اطار يعكس على جميع من يقرأ الرد أنك انسان على قدر كبير من الثقافه والوعي الديني<br />أما كلماتك تدل على انك على قدر كبير من الثقافه والوعي الغذائي<br />ولا دخل للشعوذه بكلمات القران فلا تختلط لديك الاوراق وحفظك للقران واخذك عليه انه كتاب عبادات ليس الا لا يعني الا انك مثل كرت الذاكره يحفظ ولا يتجاوز الحفظ<br />أتمنى ان تحتفظ بأرائك التي ليس لها اي مكان هنا والتي لا تعني شئ وياليتك صمت ولم تتحفنا بردك البليغ<br />(( لتقل خيرا او لتصمت ))<br />أما بالنسبة للاخ خالد فعذرا انا لم اقرأ ردك لانه كلما زاد الشي عن حده انقلب الى ضده وردك مبالغ فيه<br />وليس للمراه وحقوقها وواجباتها اي مكان هنا<br />فياليتك تنتقي الردود بمايناسب المواضيع<br />تقبلو ردي<br />ودمتو بود"
