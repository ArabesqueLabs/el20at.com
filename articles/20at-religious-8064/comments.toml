author = "نيفين نيفى نوفا"
posted = "2008-02-04"
text = "و الله يا منى فيه سور و فيه ايات<br />اكتر سورتين بحسهم و ببكى فيهم مريم و يوسف و يمكن كتير بيشاركونى الراى<br />لكن بصراحه اكتر ايه بحبها و بحسها فى القران و كتير بقولها ف الصلاه فى سوره النور و هى فى وصف الله عز و جل<br />\"الله نور السموات و الارض..مثل نوره كمشكاه فيها مصباح..المصباح ف زجاجه..الزجاجه كانها كوكب درى يوقد من شجره مباركه زيتونه لا شرقيه و لا غربيه يكاد زيتها يضىء و لو لم تمسسه نار ..نور على نور\"\"و يمكن لانى جربت الشعور بالظلم قبل كده بحب جدا الايه\"و لسوف يعلم الظالمون اى منقلب ينقلبون\"بس مش فاكره الايه دى ف سوره ايه"
