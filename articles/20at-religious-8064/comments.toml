text = "بسم الله الرحمن الرحيم<br />هو الذي انزل عليك الكتاب منهُ ءايات محكمات هن أم الكتاب وأخرُ متشابهات فأما الذين في قلوبهم زيغُ فيتبعون ماتشابه منه ابتغاء الفتنة وابتغاء تأويله وما يعلم تأويله إلا الله والراسخون في العلم يقولون ءامنا به كلُ من عند ربنا وما يذكر إلا أولوا الألباب ( سورة آل عمران آيـــه 7 )<br />( إن ربك هو أعلم بمن ضل عن سبيله وهو أعلم بالمهتدين ، فلا تطع المكذبين ، ودوا لو تدهنوا فيدهنون ، ولا تطع كل حلاف مهين ، هماز مشاء بنميم ، مناع للخير معتد أثيم ، عُتُل بعد ذلك زنيم ، إن كان ذا مال وبنين ، إذ تتلى عليه اءياتنا قال اساطير الأولين ) سورة القلم ( 7 -14)"
