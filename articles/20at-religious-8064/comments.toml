text = "بسم الله الرحمان الرحيم سلام على كل الإخوة المشتركين وعلى أمة محمد صل الله عليه وسلم أما بعد،<br />قال الله تعالى في كتابه العظيم: (يريدون أن يطفئوا نور الله بأفواههم ويأبى الله إلا أن يتم نوره ولو كره الكافرون) (التوبة: 32). هنا التعبير القرآني يسخر من هؤلاء حين يشبه محاولاتهم في إطفاء نور الإسلام، كالذي يحاول أن يطفئ الشمس بنفخة من فيه، كأنما يحسبها شمعة ضئيلة من شموع البشر. وقال الله تعالى: (و لا يزالون يقاتلونكم حتى يردوكم عن دبنكم إن استطاعوا) ( البقرة آيه 217 ) كما قال الله سبحانه وتعالى: (هو الذي أرسل رسوله بالهدى ودين الحق ليظهره على الدين كله ولو كره المشركون) (التوبة: 33).<br />إذن يا ذاك الذي يدعو نفسه خالد فلا تضيع وقتك بمحاولة إطفاء نور الله وعندما تنوي الكلام عن رسول الله فاعلم عمن ستتكلم ولا تناديه باسمه فخالقه قال عنه في كتابه المجيد (محمد رسول الله) فكيف بك أنت يا عدو الله هو رسول الله وحبيبنا شاء من شاء وأبى من أبى، أخيرا أختم تعليقي بهذه الآية العظيمة: (قل موتوا بغيظكم إن الله عليم بذات الصدور إن تمسسكم حسنة تسؤهم وإن تصبكم سيئة يفرحوا بها وإن تصبروا وتتقوا لايضركم كيدهم شيئاً إن الله بما يعملون محيط) (آل عمران: 118 ـ 120) صدق الله العظيم. فلما لا تموت بغيظك."
