text = "الأخت الكريمة كاتبة الموضوع .. جزاكِ الله خير الجزاء على ما خطته اناملك من كلمات رااائعه .. يعلم الله كم أثرت بي وكم أسعد قلبي قراءتي لهذا الموضوع . لا أظن ان هناك حياة أروع من الحياة مع القرآن وفي ظل القرآن .. وقد تحدث عن ذلك كثير من علمائنا ومشايخنا الأفاضل وكتبوا عن ذلك مقالات وكتب كثيرة لروعة واهمية القرآن والحياة في ظل القرآن .. وقد قال الله سبحانه وتعالى (لو انزلنا هذا القرآن على جبل لرأيته خاشعا متصدعا من خشية الله و تلك الأمثال نضربها للناس لعلهم يتفكرون)في سورة الحشر ، لذا يتوجب علينا العيش في ظل القرآن لكي تخشع قلوبنا وترق ولا نكون ممن قست قلوبهم فتكون كالحجارة فإن الجبل خشع من القرآن فكيف بنا نحن ؟؟!! (أفلا يتدبرون القرآن أم على قلوب أقفالها) وكيف بمن يدعي ان القرآن كتاب عبادات فقط!!!!!!!!!!! عجبا له فالقرآن معجزة خالدة يعلمنا أروع الاخلاق والعبادات والطاعات والقصص والعبر لكي نتخذها منهجا في حياتنا ..<br />اللهم اهدنا دوما الى الحق واملأ قلوبنا بنور الإيمان والقرآن واعنا على العيش في ظل كتابك ولاتحرمنا لذة وحلاوة القرآن<br />واقول قبل النهاية شكراً لكِ فقد غرستي في نفسي فكرة سأظل أتبعها طوال حياتي بإذن الله .. سأضع آية لتكون بوصلة لحياتي .. بإذن الله وسأردد ذلك دائما ليكون شعارا<br />باارك الله فيكم ونفع بكم وثبتكم : )<br />عذرا على الاطاله"
