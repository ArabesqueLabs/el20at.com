subject = "رد للأخت \"الجوزاء\""
author = "خالد"
posted = "2008-01-21"
text = "إتفضلي ياأختي \"الجوزاء\"شوفي إنتِ إيه قيمتك بالقرآن وإيه دورك في الإسلام,<br />داه الكلام لكل إخواتنا النساء المسلمات.<br />المرأة في الإسلام<br />بقلم \"بسام درويش\"<br />ـ الزوجة والزواج في الإسلام<br />انكحوا ما طاب لكم من النساء<br />\"وإن خِفتم ألاَّ تُقسِطوا في اليتامى فانكحوا مـا طاب لكم من النساء مثنى وثلاثَ ورباعَ فإن خفتم ألاَّ تعدلوا فواحدة ، أو ما ملكت أيمانكم (لا ضرورة للعدل بين الإماء إذ ليس لهنَّ من الحقوق ما للزوجات) ذلك أدنى ألاَّ تعولوا (أي ذلك أقرب إلى أن لا تجوروا\". (سورة النساء 4 : 3)<br />الزواج نوع من الرق<br />\"النكاح نوع رق فهي (أي المرأة) رقيقة له (للزوج) فعليها طاعة الزوج مُطلقاً في كل ما طلب منها في نفسها مما لا معصية فيه وقد ورد في تعظيم حق الزوج عليها أخبار كثيرة: قال محمد: ’أيما امرأة ماتت وزوجها عنها راضٍ دخلت الجنة.‘ وكان رجل قد خرج إلى سفرٍ وعهدَ إلى امرأته ألا تنزل من العلو إلى السفل وكان أبوها في الأسفل فمرض فأرسلت المرأة إلى محمد تستأذن في النزول إلى أبيها فقال محمد: ’أطيعي زوجك. فمات فاستأمرته فقال: أطيعي زوجك. فدُفن أبوها فأرسل محمد إليها يخبرها أن الله قد غفر لأبيها بطاعتها لزوجها‘، وقال محمد: ’إذا صلّت المرأة خمسها وصامت شهرها وحفظت فرجها وأطاعت زوجها دخلت جنة ربها.‘\" (إحياء علوم الدين للغزالي)<br />كيف تعود المطلقة إلى زوجها؟<br />جاءت امرأة لعند محمد وقالت له: يا رسول الله إن زوجي طلقني وإني تزوجت غيره فلم يقربني إلا مرة واحدة ولم يصل مني إلى شيء فهل أُحلُّ لزوجي الأول؟ فقال رسول الله: لا تحلين لزوجك الأول حتى يذوق الآخر عسيلتك وتذوقين عسيلته! (صحيح بخاري)<br />العملية تُعرف باللغة الشعبية الإسلامية بـ \"التجحيش\"<br />لن يشفع للزوجة أي عمل حسن إن أغضبت رجلها<br />ذكر محمد النساء فقال: \"حاملاتٌ مرضعات رحيمات بأولادهنّ لولا ما يأتين إلى أزواجهنّ دخل مصلّياتهنّ الجنة\" (إحياء علوم الدين للغزالي)<br />ومعنى الحديث أن النساء حتى ولو حملن الأولاد وأرضعنهم وكن بهم رحيمات فإنه حتى المصلّيات منهنّ لن يدخلن الجنة إذا أتين بفعل لا يرضي الزوج!<br />الزوجة يجب أن تكون جاهزة للجماع في أي وقت يراه الرجل مناسباً:<br />قال محمد: \"إن من حق الزوج على الزوجة إذا أرادها فراودها عن نفسها وهي على ظهر بعير لا تمنعه ومن حقه أن تعطي شيئاً من بيته إلا بإذنه وإن فعلت ذلك كان وزراً عليها والأجر له ومن حقه أن لا تصوم تطوعاً إلا بإذنه وإن فعلت جاعت وعطشت ولم يُتقبّل منها، وإن خرجت من بيتها بغير إذنه لعنتها الملائكة حتى ترجع إلى بيته أو تتوب.\" (إحياء علوم الدين للغزالي)<br />كاد الزوج أن يكون إلهاً!<br />ـ قال محمد: \"لو أمرتُ أحداً أن يسجد لأحد لأمرت المرأة أن تسجد لزوجها من عظم حقه عليها!\" (إحياء علوم الدين للغزالي)<br />ـ لَمَّا قَدِمَ مُعَاذٌ مِنَ الشَّامِ سَجَدَ لِلنَّبِيِّ قَالَ ‏\"‏مَا هَذَا يَا مُعَاذُ‏\"‏‏.‏ قَالَ أَتَيْتُ الشَّامَ فَوَافَقْتُهُمْ يَسْجُدُونَ لأَسَاقِفَتِهِمْ وَبَطَارِقَتِهِمْ فَوَدِدْتُ فِي نَفْسِي أَنْ نَفْعَلَ ذَلِكَ بِكَ‏.‏ فَقَالَ محمد ‏\"فَلاَ تَفْعَلُوا فَإِنِّي لَوْ كُنْتُ آمِرًا أَحَدًا أَنْ يَسْجُدَ لِغَيْرِ اللَّهِ لأَمَرْتُ الْمَرْأَةَ أَنْ تَسْجُدَ لِزَوْجِهَا وَالَّذِي نَفْسُ مُحَمَّدٍ بِيَدِهِ لاَ تُؤَدِّي الْمَرْأَةُ حَقَّ رَبِّهَا حَتَّى تُؤَدِّيَ حَقَّ زَوْجِهَا وَلَوْ سَأَلَهَا نَفْسَهَا وَهِيَ عَلَى قَتَبٍ لَمْ تَمْنَعْهُ‏\"‏ (سنن ابن ماجه 1926 باب حَقِّ الزَّوْجِ عَلَى الْمَرْأَةِ)<br />ـ \"من حق الزوج على الزوجة أن لو سال منخراه دماً وقيحاً وصديداً فلحسته بلسانها ما أدّت حقه!\" (حديث أخرجه البزاز والحاكم والبهيقي في سننه عن أبي هريرة)<br />على الزوجة أن تفعل كل ما يأمرها به الرجل:<br />عَنْ عَائِشَةَ، قَالَ محمد: ‏\"‏ لَوْ أَمَرْتُ أَحَدًا أَنْ يَسْجُدَ لأَحَدٍ لأَمَرْتُ الْمَرْأَةَ أَنْ تَسْجُدَ لِزَوْجِهَا وَلَوْ أَنَّ رَجُلاً أَمَرَ امْرَأَةً أَنْ تَنْقُلَ مِنْ جَبَلٍ أَحْمَرَ إِلَى جَبَلٍ أَسْوَدَ وَمِنْ جَبَلٍ أَسْوَدَ إِلَى جَبَلٍ أَحْمَرَ لَكَانَ نَوْلُهَا أَنْ تَفْعَلَ‏\" (سنن ابن ماجه ـ باب حَقِّ الزَّوْجِ عَلَى الْمَرْأَةِ)<br />الزوجة أرض فلاحة يأتيها صاحبها متى شاء وكيفما شاء:<br />\"نساؤكم حرث لكم فأتوا حرثكم أنَّى شئتم وقدِّموا لأنفسكم واتَّقوا الله واعلموا أنكم ملاقوه وبشِّر المؤمنين.\" (البقرة 2 : 223)<br />وجاء تفسيرها في \"الجلالين\":<br />{نِسَآؤُكُمْ حَرْثٌ لَّكُمْ} أي محل زرعكم الولد {فَأْتُواْ حَرْثَكُمْ} أي محله وهو القبل {أَنَّى&--1648;} أي كيف {شِئْتُمْ} من قيام وقعود واضطجاعِ وإقبال وإدبار. نزل ردّاً لقول اليهود من أتى امرأته في قبلها من جهة دبرها جاء الولد أحول {وَقَدّمُواْلأَنفُسِكُمْ} العمل الصالح كالتسمية عند الجماع {وَ&--1649;تَّقُواْ &--1649;للَّهَ} في أمره ونهيه {وَ&--1649;عْلَمُواْ أَنَّكُم مُّلَ&--1648;قُوهُ} بالبعث فيجازيكم بأعمالكم {وَبَشِّرِ &--1649;لْمُؤْمِنِينَ} الذين اتقوه بالجنة.<br />صمت المرأة يعني الموافقة<br />قال محمد: لا تُنكح البكر حتى تستأذن قالوا يا رسول الله وكيف يكون إذنها قال أن تسكت (أي أن البنت العذراء يجب أن تستأذن بالزواج منها فلا يتم الزواج منها بإذن أهلها فقط ولكن كيف تعبر البنت عن رضاها بنظر النبي؟.. يقول النبي أن تسكت)<br />الدعارة بصورة زواج شرعي / الله يسمح لمحمد بالزواج من زوجة ابنه بالتبني<br />\"حُرمت عليكم أمهاتكم وبناتكم وأخواتكم وعماتكم وخالاتكم وبنات الأخ وبنات الأخت وأمهاتكم اللاتي أرضعنكم وأخواتكم من الرضاعة وأمهات نسائكم اللاتي دخلتم بهنَّ فإن لم تكونوا دخلتم بهنَّ فلا جناح عليكم وحلائل أبنائكم الذين من أصلابكم ( قالها بعد أن استغرب الناس زواجه من زينب زوجة ابنه بالتبني زيد بن حارثة )وأن تجمعوا بين الأختين إلاَّ ما قد سلف إنَّ الله كان غفوراً رحيماً. والمُحْصنات من النساء، إلاَّ ما ملكت أيمانكم: أي أن النساء اللواتي لهنَّ أزواج لا يحق للمسلم نكاحهنَّ إلاَّ إذا كن من بين إمائه فآنذاك لا يهم إن كان لهنَّ أزواج! كتابَ الله عليكم وأحِلَّ لكم ما وراء ذلكم أن تبتغوا بأموالكم مُحصنين غير مسافحين فما استمتعتم به منهنَّ فآتوهنَّ أجورهنَّ فريضة ولا جناح عليكم فيما تراضيتم به من بعد الفريضة: تحليل لزواج المتعة إنَّ الله كان عليماً حكيماً. (سورة النساء 4 : 23 ـ 24)<br />حق الرجل على المرأة أن تمسح قدميه بخد وجهها:<br />عن عائشة قال محمد: يا معشر النساء لو تعلمن بحق أزواجكنَّ عليكنَّ لجعلَتِ المرأة منكنَّ تمسح الغبار عن قدمي زوجها بخد وجهها. (الترمذي)<br />ـ المرأة عورة<br />ـ \"وقل للمؤمنات يغضضن من أبصارهنَّ ويحفظن فروجهنَّ ولا يبدين زينتهنَّ إلاّ ما ظهر منها ولَيَضربنَ بخُمرِهنَّ على جيوبهنَّ ولا يبدينّ زينتهنَّ إلاّ لبعولتهنَّ أو آبائهنَّ أو آباء بعولتهنَّ أو أبنائهنّ أو أبناء بعولتهنَّ أو إخوانهنّ أو بني إخوانهنَّ أو بني أخواتهنَّ أو نسائهنَّ أو ما ملكت أيمانهنَّ أو التابعين غيرِ أولي الإربَةِ من الرجال أو الطفلِ الذين لم يظهروا على عورات النساء ولا يضربن بأرجلهنَّ ليُعْلَمَ ما يخفينَ من زينتهنَّ وتوبوا إلى الله جميعاً أيها المؤمنون لعلّكم تُفلِحون.\" سورة النور 31<br />* لاحظ الخطأ اللغوي: من الرجال والطفل عوضاً عن الأطفال.<br />ـ قال محمد: أقرب ما تكون المرأة من وجه ربها إذا كانت في قعر بيتها وإن صلاتها في صحن دارها أفضل من صلاتها في المسجد وصلاتها في بيتها أفضل من صلاتها في صحن دارها وصلاتها في مخدعها أفضل من صلاتها في بيتها. والمخدع بيت في بيت وذلك للستر، ولذلك قال محمد: \"المرأة عورة فإن خرجت استشرفها الشيطان\" (إحياء علوم الدين للغزالي)<br />ـ قال محمد: المرأة عورة وإنها إذا خرجت استشرفها الشيطان وإنها لا تكون الى وجه الله أقرب منها في قعر بيتها. (صحيح ابن خزيمة، كتاب الإمامة في الصلاة وما فيها من السنن)<br />ـ قال محمد: خَيْرُ مَسَاجِدِ النِّسَاءِ قَعْرُ بُيُوتِهِنَّ‏.‏ (مسند أحمد)<br />ـ لا يَنْبَغِي لامرأةٍ دَخَلَتْ الإسلامَ أَنْ تَخْرُجَ مِنْ بَيْتِهَا مُسَافِرَةً إلا مَعَ بَعْلٍ أَوْ مَعَ ذِي مَحْرَمٍ مِنْهَا‏. (مسند أحمد)<br />ـ قال محمد: إن للمرأة عشر عورات فإذا تزوجت ستر الزوج عورة واحدة فإذا ماتت ستر القبر العشر عورات.\" (إحياء علوم الدين للغزالي)<br />\"للمرأة ستران: القبر والزوج.\" (عن ابن عباس، كنز العمال للمتقي الهندي)<br />محمد يصمم على اعتبارها عورة حتى اللحظة قبل موته. مما قاله قبل موته:<br />أيها الناس إنّ لنسائكم عليكم حقاً، وإنَّ لكم عليهنَّ حقاً ، لكم عليهنَّ أن لا يوطِـئنَ فرشكم غيركم، ولا يُدخلن أحداً تكرهونه بيوتكم إلاّ بإذنكم، ولا يأتين بفاحشة، فإن فعلن فإنَّ الله قد أذن لكم أن تعضلوهنَّ وتهجروهنَّ في المضاجع وتضربوهنَّ ضرباً غير مبرِّحٍ، فإن انتهين وأطعنكم فعليكم رزقهنَّ وكسوتهن بالمعروف، وإنما النساء عندكم عَـوَار لا يملكن لأنفسهنَّ شيئاً، أخذتموهنَّ بأمانة الله، واستحللتم فروجهنَّ بكلمة الله، فاتقوا الله في النساء واستوصوا بهنَّ خيراً. (العقد الفريد 4 : 57)<br />ـ معاقبة المرأة<br />معاقبة النساء بحجزهن في البيوت حتى الموت:<br />\"واللاتي يأتين الفاحشة من نسائكم فاستشهدوا عليهنَّ أربعةً منكم فإن شهدوا فامسكوهنَّ في البيوت حتى يتوفَّاهنَّ الموتُ أو يجعلَ الله لهنَّ سبيلاً.\" (سورة النساء 4 : 15)<br />مشاهد من عذاب المرأة في جهنم:<br />رؤية نبوية يرويها علي بن أبي طالب ابن عم محمد وزوج ابنته فاطمة فيقول:<br />\"دخلتُ على النبي أنا وفاطمة ووجدناه يبكي بكاء شديداً، فقلتُ له: فداك أبي وأمي يا رسول الله، ما الذي أبكاك؟ قال: يا علي ليلة أسرى بي (الملاك) إلى السماء رأيت نساء من أمتي يُعذَّبنَ بأنواع العذاب، فبكيت لما رأيتُ من شدة عذابهنَّ، ورأيتُ امرأة معلَّقةً بشعرها يغلي دماغها، ورأيت امرأة معلقةً بلسانها والحميم يصب في حلقها، ورأيتُ امرأة قد شُدَّت رجلاها إلى ثدييها ويداها إلى ناصيتها، ورأيتُ امرأةً معلقةً بثدييها، ورأيتُ امرأةً رأسها رأس خنزير وبدنها بدن حمار عليها ألف ألف لون من العذاب، ورأيتُ امرأة على صورة الكلب والنار تدخل من فيها وتخرج من دبرها والملائكة يضربون رأسها بمقامع من نار. فقالت فاطمة: يا حبيبي وقرَّة عيني ما كان أعمال هؤلاء حتى وُضعَ عليهنَّ العذاب؟ قال محمد: يا بنية، أما المعلَّقة بشعرها فإنها كانت لا تغطي شعرها من الرجال، وأما التي كانت معلقة بلسانها فإنها كانت تؤذي زوجها، وأما المعلقة بثدييها فإنها كانت تفسد فراش زوجها، وأما التي تشد رجلاها إلى ثدييها ويداها إلى ناصيتها وقد سُلِّطَ عليها الحيَّات والعقارب فإنها كانت لا تنظف بدنها من الجنابة والحيض وتستهزئ بالصلاة. وأما التي راسها راس خنزير وبدنها بدن حمار فإنها كانت نمامة كذابة. وأما التي على صورة الكلب والنار تدخل من فيها وتخرج من دبرها فإنها كانت منانة حسَّادة.\"<br />(من كتاب الكبائر للذهبي)<br />ـ قال محمد: إن الفساق هم أهل النار، قالوا يا رسول الله! ومن الفساق قال النساء، قالوا: أو لسن بأمهاتنا وبناتنا وأخواتنا؟ قال: بلى، ولكنهن إذا أعطين لم يشكرن، وإذا ابتلين لم يصبرن.\"<br />(كنز العمال للمتقي الهندي)<br />المرأة أدنى مرتبة من الرجل<br />المرأة شيء من الأشياء التي يقتنيها الرجل<br />\"زين للناس حب الشهوات من النساء والبنين والقناطير المقنطرة من الذهب والفضة والخيل المسومة والأنعام والحرث، ذلك متاع(*) الدنيا والله عنده حسن المآب\". (آية 14 سورة 3 آل عمران)<br />(*) متاع تعني مقتنيات وأشياء<br />أفضلية الرجال على النساء وضرب النساء<br />\"الرجال قوامون على النساء بما فضَّل الله بعضَهم على بعض وبما أنفقوا من أموالهم فالصالحات قانتات حافظاتٌ للغيب بما حفِظ الله واللاتي تخافون نشوزهنَّ فعظوهنَّ واهجروهنَّ في المضاجع واضربوهنَّ فإن أطعنكم فلا تبغوا عليهنَّ سبيلاً إنَّ الله كان علياً كبيراً.\" (سورة النساء 4 : 34)<br />الرجال أفضل من النساء لأن الله فضّلهم ولأنهم هم الذين يتولّون الإنفاق!<br />\"الرجال قوامون على النساء بما فضَّل الله بعضَهم على بعض وبما أنفقوا من أموالهم فالصالحات قانتات حافظاتٌ للغيب بما حفِظ الله واللاتي تخافون نشوزهنَّ فعظوهنَّ واهجروهنَّ في المضاجع واضربوهنَّ فإن أطعنكم فلا تبغوا عليهنَّ سبيلاً إنَّ الله كان علياً كبيراً.\" (النساء 4 : 34)<br />للذكر مثل حظ الأنثيين<br />\"يوصيكم الله في أولادكم للذكر مثل حظ الأنثيين.\" (آية 11 من سورة النساء)<br />لا تقارنوا الذكر بالأنثى<br />\"وليس الذكر كالأنثى\". (آل عمران 3 : 36)<br />حتى الملائكة لا يجوز تسميتهم تسمية الأنثى:<br />\"إن الذين لا يؤمنون بالآخرة ليسمون الملائكة تسمية الأنثى.\" 53 النجم 27<br />تسمية الملائكة بأسماء أنثوية تحقـير لهم<br />المرأة ذات عقل ناقص وشهادة امرأتين كشهادة رجل واحد<br />قال محمد: أليس شهادة المرأة مثل نصف شهادة الرجل، قلنا بلى، قال فذلك من نقصان عقلها. (صحيح بخاري)<br />قال ‏\"يا معشر النساء تصدقن وأكثِرنَ الاستغفار فإني رأيتكنَّ أكثر اهل النار‏\"‏.‏ فقالت امراة منهن جزلة وما لنا يا رسول الله أكثر أهل النار‏.‏ قال ‏\"‏تكثرن اللعن وتكفرن العشير وما رأيتُ من ناقصات عقل ودين أغلب لذي لبٍّ منكن‏\"‏‏.‏ قالت يا رسول الله وما نقصان العقل والدين قال ‏\"‏اما نقصان العقل فشهادة امراتين تعدل شهادة رجل فهذا نقصان العقل وتمكث الليالي ما تصلي وتفطر في رمضان فهذا نقصان الدين‏\"‏‏.‏<br />(صحيح مسلم، كتاب الإيمان)<br />\"واستشهدوا شهيدين من رجالكم فإن لم يكونا رجلين فرجلٌ وامرأتان ممن ترضون من الشهداء أن تضلَّ إحداهما فتذكّـر إحداهما الأخرى!..\" (آية 282 سورة البقرة)<br />نجاسة المرأة:<br />ملامسة المرأة تبطل الصلاة<br />\"يا أيها الذين آمنوا إذا قمتم إلى الصلاة فاغسلوا وجوهكم وأيديكم إلى المرافق وامسحوا برؤوسكم وأرجلكم إلى الكعبين وإن كنتم جنباً فاطَّهَّروا وإن كنتم مرضى أو على سفرٍ أو جاء أحد منكم من الغائط أو لامستم النساء فلم تجدوا ماءً فتيمموا صعيداً طيباً فامسحوا بوجوهكم وأيديكم منه ..\" (آية 6 سورة المائدة)<br />لا ثقة بالمرأة:<br />قال محمد: \"لا يخلونّ رجل بامرأة إلا ومعها ذو مَحرم\"<br />قال محمد: لا يخلونّ رجل بامرأة فإن الشيطان ثالثهما\"<br />\"أعدى عدوك زوجتك التي تضاجعك وما ملكت يمينك.\"<br />(كنز العمال للمتقي الهندي)<br />خالفوا المرأة:<br />قال الحسن: \"والله ما أصبح رجلٌ يطيع امرأتهُ فيما تهوى إلا كبّهُ اللهُ في النار.\"<br />قال عمر: \"خالفوا النساء فإن في خلافهنّ البركة.\" وقد قيل: شاوروهنّ وخالفوهنّ!<br />وقد قال عمر: \"تعِسَ عبد الزوجة.\" وقال الإمام الغزالي مفسّراً: وإنما قال ذلك لأنه إذا أطاعها في هواها فهو عبدها وقد تعس فإن الله ملّكه المرأة فملّكها نفسه فقد عكس الأمر وقلب القضية وأطاع الشيطان لما قال: \"ولآمرنّهم فليغيّرن خلق الله\" (آية 119 سورة النساء) إذ حقّ الرجل أن يكون متبوعاً لا تابعاً وقد سمّى الله الرجال قوامين على النساء وسمى الزوج سيداً فقال تعالى: \"وألفيا سيدها لدى الباب.\" (آية 25 سورة يوسف) فإذا انقلب الرجلُ مُسَخَّراً فقد بدّل نعمة الله كفراً ونفسُ المرأة على مثال نفسك: إن أرسلتَ عنانها قليلاً جمحت بك طويلاً وإن أرخيت عذارها فتراً جذبتك ذراعاً وإن كبحتها وشددت يدك عليها في محل الشدّة ملكتها.<br />قال الإمام الشافعي: ثلاثة إن أكرمتهم أهانوك وإن أهنتهم أكرموك: المرأة والخادم والنبطي.<br />(من كتاب، إحياء علوم الدين للغزالي)<br />المرأة لعبة:<br />قال عمر بن الخطاب لزوجته: \"يا عدوة الله، وفيما أنتِ وهذا، ومتى كنتِ تدخلين بيني وبين المسلمين. إنما أنتِ لعبة يُلعَبُ بكِ ثمَّ تُتْرَكين..\"<br />(من كتاب، تاريخ المدينة المنوّرة لابن شبّة) قال عمر ذلك حين أتته امرأته تسأله فيما وجد على قريبها عيّاض بن غنم الذي كان عمر قد ولاّه على الشام ثم بلغه أنه اتخذ لنفسه حماماً ونوّاباً.<br />وفي \"إحياء علوم الدين للغزالي\" جاء أن عمراً قال لزوجته: \"إنما أنتِ لعبةٌ في زاوية البيت. وجميعُ الملاعبةِ مع النساءِ لهوٌ إلا الحراثة التي هي سبب وجود الولد.\"<br />المرأة لا تصلح للحكم:<br />ـ لن يفلحَ قومٌ ولّوا أمرهم إمرأة (بخاري)<br />استقلالية المرأة:<br />لا تُطعِمُ المرأة أحداً دون إذن الزوج إلا إذا كان طعاماً قارب على الفساد:<br />قال محمد: لا يحل لها ـ للمرأة ـ أن تُطعِمَ من بيته ـ أي من بيت زوجها ـ إلا بإذنه إلاّ الرطبَ من الطعام الذي يُخافُ فساده فإن أطعمت عن رضاه كان لها مثل أجره وإن أطعمت بغير إذنه كان له الأجر وعليها الوزر!\" (إحياء علوم الدين للغزالي)<br />شروط دخول المرأة إلى الجنة<br />ـ أيما امرأة ماتت وزوجها راضٍ عنها دخلت الجنة (عن أم سلمة، كنز العمال للمتقي الهندي)<br />ـ إذا صلّت المرأة خَمسها، وصامت شهرها، وأطاعت زوجها، وحفظت فرجها، دخلت الجنة. (عن معاذ بن جبل)<br />ـ إذا صلّت المرأة خَمسها وصامت شهرها وحصنت فرجها وأطاعت زوجها، قيل لها: ادخلي الجنة من أي أبواب الجنة شئتِ. (عن أبي هريرة: كنز العمال للمتقي الهندي)<br />أقوال أخرى لمحمد في المرأة<br />• لا خير في جماعة النساء إلا عند ذكرٍ أو جنازةٍ، وإنما مثل جماعتهنّ إذا اجتمعن كمثل صيقل أدخل حديدة النار، فلما أحرقها ضربها، فأحرق شررها كل شيء اصابت. (عن عبادة بن صامت، كنز العمال للمتقي الهندي)<br />• \"خدمتكَ زوجتك صدقة\" (ابن عمر: كنز العمال للمتقي الهندي)<br />• \"إن الله كتب الغيرة على النساء والجهاد على الرجال، فمن صبر منهنّ إيماناً واحتساباً كان لها مثل أجر الشهيد.\" (عن أبي أمامة، كنز العمال للمتقي الهندي)<br />• فجور المرأة الفاجرة كفجور ألف فاجر وبر المرأة الصالحة كعمل سبعين صدّيقاً.\" (أبو الشيخ عن ابن عمر، كنز العمال للمتقي الهندي)<br />• \"خير النساء التي تسره إذا نظر، وتطيعه إذا أمر، ولا تخالفه في نفسها ولا مالها بما يكره.\" (عن ابن هريرة، كنز العمال للمتقي الهندي)<br />• \"لا تُسكنوا نساءكم الغرف ولا تعلموهنّ الكتاب.\" (عن ابن مسعود، كنز العمال للمتقي الهندي)<br />• \"انظري أين أنتِ منه، إنما هو جنّتكِ ونارك!\" (ابن سعد، عن عمة حصين بن محصن. كنز العمال للمتقي الهندي)<br />• \"لا تأذن المرأة في بيت زوجها إلا بإذنه، ولا تقوم من فراشه فتصلّي تطوّعاً إلا بإذنه\" (عن ابن عباس: كنز العمال للمتقي الهندي)<br />• \"لا تصومنّ امرأة إلا بإذن زوجها\" (عن أبي سعد: كنز العمال للمتقي الهندي)<br />• \"ليس للنساء سلامٌ ولا عليهنّ سلام\" (عن عطاء الخراساني: كنز العمال للمتقي الهندي)<br />• \"ليس للنساء وسط الطريق (عن أبي هريرة: كنز العمال للمتقي الهندي)<br />• إن الفسّاق هم أهل النار، قالوا، يا رسول الله، ومن الفسّاق، قال النساء، قالوا: أولسن بأمهاتنا وبناتنا وأخواتنا؟ قال: بلى، ولكنهن إذا أُعطين لم يشكرنَ، وإذا ابتلينَ لم يصبرنَ. (عن عبد الرحمن بن شبل: كنز العمال للمتقي الهندي)<br />• \"يا معشر النساء! إنكنّ أكثر حطب جهنم، لأنكنّ إذا أُعطيتُنَّ لم تشكرن، وإذا ابتليتنَّ لم تصبرن، وإذا أُمسِكَ عنكنَّ شكوتنّ، وإياكنّ وكفر المنعمين! المرأة تكون عند الرجل وقد ولدت له الولدين والثلاثة فتقول: ما رايتُ منك خيراً!\" (عن أسماء بنت يزيد: كنز العمال للمتقي الهندي)<br />• إيكنّ وكفر المنعمين! قيل: وما كفر المنعمين؟ قال: لعلّ إحداكنّ أن تطول أيمتها أو تعنس عند أبويها ثم يرزقها زوجاً ثم يرزقها الله منه ولداً ثم تغضب الغضبة فتكفره فتقول: والله ما رايت منك خيراً قط! (ابن عساكر، عن أسماء بنت يزيد، كنز العمال للمتقي الهندي)<br />• المرأة المؤمنة في النساء كالغراب الأعصم في الغربان، فإن النار خلقت للسفهاء، وإن النساء من السفهاء، إلا صاحبة القسط والسراج! (ابن عساكر عن أبي شجرة، كنز العمال للمتقي الهندي)<br />• ليس على النساء غزو ولا جمعة ولا تشييع جنازة. (عن أبي قتادة: كنز العمال للمتقي الهندي)<br />• أيما امرأة مات لها ثلاثة من الولد كن لها حجاباً من النار. (كتاب الجنائز عن أبي سعيد)<br />• \"لَحصيرٌ في ناحية البيت خير من امرأة لا تلد\" (إحياء علوم الدين للإمام أبي حامد الغزالي)<br />• \"امرأة ولود ودود أحب إلى الله من حسناء لا تلد إني مكاثر بكم الأمم\" (الإصابة في معرفة الصحابة لابن حجر العسقلاني وكنز العمال للمتقي الهندي)<br />• قال محمد: إن كان الشؤم في شيء ففي الدار والمرأة والفرس<br />• إنما المرأة مثل الضلع المعوج إن تركته انتفعت به وإن أقمته كسرته<br />• أيما امرأة استعطرت فمرَّت على قومٍ ليجدوا من ريحها فهي زانية وقال أيضاً: أحب إليَّ من دنياكم النساء والطيب، وجعلت قرة عيني في الصلاة<br />• الشـعر من إبليس.. والنســاء حبائل الشيطان (إبن كثير 4 : ص 24)<br />• تزوَّجوا الأبكار فإنهنَّ أعذب أفواهاً وأنتق أرحاماً وأرضى باليسير. (الطبراني)<br />موسوعة اللعنات على المرأة:<br />ـ إذا دعا الرجل امراته إلى فراشه فلم تأته فبات غضبان عليها لعنتها الملائكة حتى تصبح (صحيح مسلم: كتاب النكاح ـ صحيح البخاري، كتاب بدء الخلق)<br />ـ ‏\"إذا دعا الرجل امراته إلى فراشه فأبت ان تجيء لعنتها الملائكة حتى تصبح‏\"‏‏. (صحيح البخاري، كتاب النكاح).<br />ـ قال محمد: والذي نفسي بيده ما من رجل يدعو امراته إلى فراشها فتأبى عليه ألا كان الذي في السماء ساخطاً عليها حتى يرضى عنها‏\"‏‏ (صحيح مسلم: كتاب النكاح)<br />ـ \"إذا دعا الرجل امراته إلى فراشه فلم تأته فبات غضبان عليها لعنتها الملائكة حتى تصبح‏\"‏.‏ (صحيح مسلم: كتاب النكاح)<br />ـ إِذَا بَاتَتْ الْمَرْاَةُ هَاجِرَةً فِرَاشَ زَوْجِهَا لَعَنَتْهَا الملائكةُ حَتَّى تَرْجِعَ‏.‏ (مسند أحمد)<br />ـ \"لعن الله الواصلة والمستوصلة\" (حديث نبوي: المحلى لابن حزم)<br />ـ \"لعن رسول الله الواشمات والمستوشمات والمتنمصات والمتفلجات للحسن المغيرات خلق الله.\" (عن بن مسعود: المحلى لابن حزم)<br />ـ \"لعن الله القاشرة والمقشورة\" (عن عائشة: كنز العمال للمتقي الهندي)<br />ـ \"لعن الله المتشبهات من النساء بالرجال والمتشبهين من الرجال بالنساء\" (عن ابن عباس كنز العمال للمتقي الهندي)<br />ـ \"لعن الله المسوفات التي يدعوها زوجها إلى فراشه فتقول، سوف، حتى تغلبه عيناه!\" (عن ابن عمر: كنز العمال للمتقي الهندي)<br />ـ \"لعن الله المُفسلة التي إذا أراد زوجها قالت: أنا حائض.\" (عن ابي هريرة: كنز العمال للمتقي الهندي)<br />ـ \"لعن الله زائرات القبور\" (عن ابن عباس: كنز العمال للمتقي الهندي)<br />ـ لعن الله النائحة والمستمعة والحالقة والسالقة والواشمة والمستوشمة. (عن ابن عمر: كنز العمال للمتقي الهندي)<br />ـ لعن الله الخامشة وجهها والشاقة جبينها والداعية بالويل والثبور. (عن أبي أمامة: كنز العمال للمتقي الهندي)<br />حتى في الجنة، المرأة لخدمة الرجل:<br />من موقع الشبكة الإسلامية ـ المفتي عبد الله الفقيه.<br />جاء وصف نساء الجنة في آيات وأحاديث كثيرة، فمن ذلك قوله تعالى: \"ولهم فيها أزواج مطهرة وهم فيها خالدون\" (آية 25 سورة البقرة) والمطهرة هي التي طهرت من الحيض، والبول، والنفاس، والغائط والمخاط والبصاق، وكل قذر وكل أذى يكون من نساء الدنيا، وطهر مع ذلك باطنها من الأخلاق السيئة والصفات المذمومة، وطهر لسانها من الفحش والبذاء، وطهر طرفها من أن تطمح به إلى غير زوجها، وطهرت أثوابها من أن يعرض لها دنس أو وسخ.<br />قال عبد الله بن مسعود، وعبد الله بن عباس: \"مطهرة\": لا يحضن ولا يحدثن، ((أي لا يضرطن)) ولا يتنخمن.<br />وقال تعالى: \"كذلك وزوجناهم بحور عين\" آية 54 سورة الدخان، والحور: جمع حَوراء، وهي المرأة الشابة الحسناء الجميلة البيضاء شديدة سواد العين. قال زيد بن أسلم: \"الحوراء\" التي يحار فيها الطرف، و\"عين\" حسان الأعين.<br />وقال تعالى: \"فيهن قاصرات الطرف لم يطمثهن إنس قبلهم ولا جان فبأي آلاء ربكما تكذبان. كأنهن الياقوت والمرجان\" (آية 56ـ58 سورة الرحمن) قال الإمام ابن القيم: والمفسرون كلهم على أن المعنى: قصرن طرفهن على أزواجهن فلا يطمحن إلى غيرهم.<br />ومعنى \"لم يطمثهن\" أي: لم يمسسهن، أي ولم يجامعهن أحد، فهن أبكار. وأما قوله: \"كأنهن الياقوت والمرجان\" فقد قال الحسن وعامة المفسرين: أراد صفاء الياقوت في بياض المرجان، شبههن في صفاء اللون وبياضه بالياقوت والمرجان نقله ابن القيم عنهم.<br />كما قال الله في وصف نساء الجنة \"إنا أنشأناهن إنشاءً فجعلناهن أبكاراً عرباً أتراباً لأصحاب اليمين\" (آية 35 ـ 38 سورة الواقعة) وقوله \"عرباً\" جمع عروب، وهن الحسناوات المتحببات إلى أزواجهن. فجمع سبحانه وتعالى بين حسن صورتها وحسن عشرتها، وهذا غاية ما يطلب من النساء، وبه تكمل لذة الرجل بهن. وقوله \"أترابا\" أي: مستويات على سن واحد بنات ثلاث وثلاثين سنة.<br />وقد روى الإمام البخاري ومسلم أن رسول الله صلى الله عليه وسلم قال: \" لو اطلعت امرأة من نساء أهل الجنة إلى الأرض لملأت ما بينهما ريحاً، ولأضاءت ما بينهما، ولنصيفها على رأسها خير من الدنيا وما فيها\" وعن الإمام أحمد في مسنده عن النبي صلى الله عليه وسلم قال: \"للرجل من أهل الجنة زوجتان من الحور العين، على كل واحدة سبعون حلة يرى مخ ساقها من وراء الثياب\". وقد وصف الله أهل الجنة بأنهم في شغل، قال تعالى: \"إن أصحاب الجنة اليوم في شغل فاكهون. هم وأزواجهم في ظلال على الأرائك متكئون. لهم فيها فاكهة ولهم ما يدعون\" (آية 55 ـ 57 سورة يس) قال ابن مسعود رضي الله عنه: شغلهم افتضاض العذارى.<br />فما أعظم هذا النعيم وما أحسنه. والآيات والأحاديث في وصف الحور العين كثيرة ومن أراد الاستزادة يمكنه الرجوع إلى كتب التفسير والحديث، والكتب المؤلفة في وصف الجنة مثل كتاب: حادي الأرواح إلى بلاد الأفراح لابن القيم رحمه الله."
