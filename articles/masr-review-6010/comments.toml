[[comments]]
order = 0
subject = "و قد كان"
author = "نيفين نيفى نوفا"
posted = "2007-05-24"
text = "اول ما قرات عنوان المقال ف الصفحه الرئيسيه قلت فورااا ده اكيد احمد ندا<br />و قد كان<br />و كالعاده<br />الموضوع جميل غريب جديد<br />و عندى طلب يا ريت تتكرم يا استاذ احمد و تحققه و اظن انه هيعجب الكثيرين غيرى<br />يا ريت مقال او عده مقالات عن الموشحات الاندلسيه التى تتناول الصوفيه و الزهد لانى كان عندى مصادر ليها و للاسف فقدتها و احيانا بتكون ثريه جدا لغويا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "كما قالت نوفا"
author = "دبمة"
posted = "2007-05-26"
text = "والله انتى عسل يانوفا وباضسفى سطرسن تلاتة حلوين على كل موضوع تعلقى عليه، وانا معاكى ان الموضوغ عجبنى مش بس لانه حلو اوى لكن كمان لانه جديد ومااظنش فى كتير شباب بينا ممكن تبجوا لهم الجراءة ويكتبوا مقامة خاصة بهم حتى لو كان تعن الحلاق، وياريت فعلا نخلى فيه مساحة للادب بمختلف عصوره وتنوعاته"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "حلاق الغبرة"
author = "لو كنت أعلم"
posted = "2007-05-28"
text = "الحمد لله ربنا رحمنا من هذا الهم المقيم وإن كنت أري أبي وأخي به مرهقين<br />وكفاية كده كمل إنت يا عم الدماغ<br />موضوع مجنون كالعادة<br />بس حللللللللللوووووووو<br />أمري لله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "ديمه كيفك"
author = "نيفين نيفى نوفا"
posted = "2007-05-30"
text = "ديمه ازيك عامله ايه<br />فين من زمان من ايام موضوع القهوه متكلمناش ...بحييكى و بضم صوتى لصوته فى زياده مساحه الادب على الموقع<br />سامعين يا عشرينات<br />عايزين مساحه اكبر للابداعات الادبيه"
archived = "2010-03-14"
capture_url = ""
