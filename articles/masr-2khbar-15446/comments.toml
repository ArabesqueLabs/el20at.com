text = "الاهم من انتخاب فلان او علان مع تقديرى العميق لكل من يتصدر للعملالعام ان يكون هناك فرص متساوية ومتكافئة لكل مرشح وان توجد ضمانات لها حرمة الكتب السماوية لنزاهة الانتخابات ولاتتدخل وزارة الداخلية باى ذريعة فى الانتخابات ولنترك الامر للشعب كى يختار والشعب المصرى يتمتع بذكاء وبصيرة تمكنة من ان يختار الاصلح بهذا ينصلح حال الامة++++العامل الاهم ÷هو الشعب علية ان ياخذ الخطوة الاهم ويخرج للانتخاب ويختار ما يملية علية ضميرة فالعصمة للانبياء فقط وكفاية سلبية<br />واطالب كمواطن السادة رؤساء الجامعات السابقون والحاليون وكبار القضاة ان يتقدموا للترشيح مصر محتاجة للجميع والاستئثاربالحكم مهما كانت الاسباب هو سر تخلفنا سلبية الشعب جعلتهم يستخفون بنا"
archived = "2010-03-14"
