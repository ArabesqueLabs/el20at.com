author = "الناس النظيفة"
posted = "2010-02-23"
text = "صورة بتقول فية امل<br />اتنين من الناس المحترمين اللى بيحترمهم الشعب المصرى والعالم كلة بيحترمهم<br />بس يقدروا يعملوا اية لوحدهم من غير الشباب والرجال والشابات والسيدات ولاد مصر<br />يا ولاد مصر - مصر محتاجة لكم<br />فية اربعين فى المية تحت خط الجوع<br />الشعب المصرى جاع وتشرد فى اركان الكرة الارضية وتغرب وغرق فى البحار علشان بلدنا اتسرقت<br />بلدنا اتسرقت من بتوع حزب حلبسة الحرامية<br />انهضوا وغيروا بلدكم"
archived = "2010-03-14"
