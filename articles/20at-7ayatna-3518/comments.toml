subject = "المراة لا محل لها من الاعراب في مهنة الوقاية المدن"
author = "رجل الوقاية المدنية"
posted = "2008-02-08"
text = "ان كل ما يقال على دور المرآة في الوقاية المدنية هو سينما و اشهار لان كل من تخرجت من مدرسة هاته الهيئة تراها قابعة في احد المكاتب بدون شغل و لا مشغلة و تحت الرعاية الكاملة لرئيسها المباشر الذي يعاملها كجارية بكل ما للكلمة من معنى و الويل لمن تكلم او نوى التكلم معهم من الرجال فانه يجد كل انواع التنكيل و العقوبات لانه حاول حيازة ما هو في ملك الاعلى رتبة .الخلاصة هو ان منذ دخول المرآة هذا الميدان و هو في تراجع دائم و لكل من استعصى عليه فهم هذا المقال ان يلتجا الى اي رجل وقاية مدنية فسيعطيه كل ما اراده"
archived = "2010-03-14"
