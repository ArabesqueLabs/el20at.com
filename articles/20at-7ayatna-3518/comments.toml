subject = "الغاية تبرر الوسيلة"
author = "مغربية في بلاد العجم"
posted = "2007-04-04"
text = "ان المغاربة على العموم و المغربيات على وجه الخصوص مستعدون لفعل اي شيء لمساعدتهم على العيش الكريم فالمحظوظة من ينعم عليها الله بوريقات او زوج ينقذها ان لم تكن متزوجة طبعا و يرمي بها الى الضفة الاخرى و الفئة الثانية من المحظوظات من تجد وظيفة في البلاد سواء في الاطفاء او في الاشعال لا يهم المهم هو الدخل الشهري الذي يعينها ان كانت وحدها على تكاليف الحياة و ان كانت متزوجة فسيجعل زوجها يغض العين و يلعب دور الرجل المتفهم لكن في الحقيقة لا تفهم و لا خيار فالغاية هي المدخول الشهري و الغاية تبرر الوسيلة،"
