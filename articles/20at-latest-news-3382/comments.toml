subject = "اللى معاه قرش ومحيره يجيب حمام ويطيره"
author = "مصرية"
posted = "2007-03-07"
text = "بصراحة هى فكرة عجيبة لا نى انا اعرف انى دول الخليج مالهاش علاقة بالفن والثقافة وبعدين كل الاعمال بتاعة فرنسا انا رايى انهم بدل ما يصرفوا فلوس كتير على متحف اللوفر اللى فى ابو ظبى ممكن يعملوا حاجات تانية لبلادهم يعنى مثلا يحاولوا بدل ما هما بيصدروا البترول خام يصدروه مصنع ودة هيفيدهم وهيرفع من اقتصاد بلادهم اكتر بس نقول ايه اللى معاه قرش ومحيره يجيب حمام ويطيره"
