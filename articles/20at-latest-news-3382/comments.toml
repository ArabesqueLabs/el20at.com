subject = "عين الصواب"
author = "جمال"
posted = "2007-10-10"
text = "الاخت مصرية مين اللي قالك انه عندنا قرش محيرنا! اختي العزيزيه.<br />ممكن تخبرينا بالاشياء الثانية اللي ممكن نعملها ومعملنهاش. للعلم ده مشروع من ضمن الالف المشاريع في جميع المجالات واقصد بجميع المجالات :- جميييع المجالات. يعني بامكانك اختي العزيزه الاستعانه بالاخ جوووجل مع بعض الوقت وحاولي تبحثين عن استثمارات الامارات والخليج عموما وستجدين باذن الله ما يفرح قلبك ويجعلك تفخرين بالكثير من المشاريع اللتي هي في \"جميييع المجالات\".<br />نقطة اخري اختي انتي كيف عرفتي ان دول الخليج ملهاش علاقة بالفن و الثقافه, ماهو مقياسك. وان فرضنا انه ملناش علاقه , علي الاقل نحن في بداية الطريق وفي يوم من الايام سيكون لنا علاقه ان شاء الله. :-)"
