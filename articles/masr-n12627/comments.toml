subject = "بصو في الصورة كويس"
author = "اكتب اسمك هنا"
posted = "2007-12-01"
text = "انا عايز اعرف ايه علاقة الصورة بالموضوع<br />الصورة تدل على انه خلاص ما فيش امل<br />ودا ما يصحش في العمل الصحفي<br />المفروض ان الصحافة تعطي امل للناس<br />طالما مازال في نفس يبقى فيه امل"
archived = "2007-12-04"
