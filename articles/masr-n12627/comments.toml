[[comments]]
order = 0
subject = "ياريت تيجى على أد كدة"
author = "بسلة مسلمة مصرية"
posted = "2007-11-29"
text = "يا ريت بس كان على أد كدة<br />وياريت تكون دى أخر المصايب اللى فى مصر<br />لاء دى كمان كملت وتعالوا شوفوا<br />عقد الدكتور عبدالعظيم وزير محافظ القاهرة اجتماعا للمجلس المحلي الشعبي الاربعاء حول بيع مساحات كبيرة من الأراضي في منطقة المطقم لشركة إعمار بسعر المتر‏90‏ جنيها.<br />وأعلن وزير خلال الجلسة الساخنة أنه تنفيذا لحكم المحكمة الإدارية العليا فإنه لابد أن تحصل المحافظة علي حقها من قيمة بيع المساحة البالغة أربعة ملايين متر مكعب والتي تبلغ‏500‏ مليون جنيه وهي نسبة‏25%‏ من قيمة الأرض‏.‏<br />وقالت جريدة الأهرام إن الشركة اشترت متر الأرض بـ‏90‏ جنيها وتبيعه الآن بسعر ‏8‏ آلاف جنيه للمتر.<br />وأضاف المحافظ - ردا علي طلبات الإحاطة المقدمة من أعضاء المجلس - أنه لن يتم الترخيص لشركة النصر للإسكان بعملية البيع إلا بعد تخصيص ‏5%‏ من مساحة الأرض لإقامة مشروعات خدمية حيث إن هذه المساحة مخصصة للاستخدام السكني والترفيهي والخدمي في حين أن المشتري سيقيم عليها مشروعات سكنية فقط‏.<br />وأضاف: ان الارتفاعات التي قررها المستثمر ستسمح ببناء ‏40‏ برجا بارتفاعات‏72‏ مترا أي‏24‏ طابقا‏ مع أن المقرر هو‏17‏ مترا‏ أي الدور الأرضي وأربعة طوابق علوية‏.‏<br />وقال ان المستثمر يقوم ببيع الوحدات السكنية بأسعار مرتفعة جدا برغم عدم حصوله علي تراخيص البناء أو التقدم بمشروع تقسيم تفصيلي للارض واعتمادها من الاجهزة المختصة بمحافظة القاهرة‏.‏<br />وأوضح وزير انه لن تصرف تراخيص إلا من خلال شركة النصر وضرورة قيامها بالتقدم بمشروع تقسيم للارض وفي حالة تقدم شركة اعمار بمشروع التقسيم فمن الضروري التقدم بتوكيل من شركة النصر‏.‏<br />وأكد الدكتور وزير انه لن تمنح التراخيص إلا بعد حصول المحافظة علي حقها الذي أكده حكم المحكمة الادارية العام الماضي والذي اعطي ‏25%‏ من قيمة الارض تؤول للمحافظة بالاضافة إلي‏5%‏ من مساحة الارض لاقامة مشروعات خدمية‏.‏<br />وكانت المناقشات الساخنة قد كشفت عن أن الشركة أعطت للمستثمر حق الارتفاع المخالف إلي جانب بيع قطع أراض مخصصة للإسكان بسعر ثمانية آلاف جنيه للمتر الواحد‏ وعدم الحصول علي التراخيص‏ وعرض نماذج مبنية والبيع لمثيلاته دون وجود ترخيص‏<br />ودة اللى مش بس حيخلى اسراء وسماية يشحتوا ولا حتى يبيعوا مناديل فى أشارات المرور دة حيخلى البلد كلها شحاتين وربنا يخلى الحكومة وسيادة الرئيس<br />واليكم المزيد"
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204174013/http://masr.20at.com:80/newArticle.php?sid=12627"

