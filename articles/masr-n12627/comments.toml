[[comments]]
order = 8
subject = "الى الاخ tr اللي زعلان من شركة اعمار"
author = "اكتب اسمك هنا"
posted = "2007-12-02"
text = "انت بتقول ان اعمار هي اللي رفعت اسعار الشقق<br />والله انا سمعت رأي تاني ان العراقيين هجموا على مصر وبسبب ذلك ارتفعت اسعار العقارات<br />وبعدين اعمار دي شركة جائت من دولة عربية تستثمر في مصر يعني اولى من غيرها انت ما سمعتش عن الشركات اللي جاءت من الهند ومن بلاد الكفره تستثمر في مصر<br />شوف بنك اسكندرية مين اللي اشتراه وشوف بعد ما كان اسمه بنك اسكندرية بقى اسمه بنك ايه<br />الشركات العربية اولى من الشركات الكفرية"
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204174013/http://masr.20at.com:80/newArticle.php?sid=12627"

[[comments]]
order = 9
subject = "المجلس القومي للطفولة والأمومة ينقل التجربة المصري"
posted = "2007-12-02"
text = "المجلس القومي للطفولة والأمومة ينقل التجربة المصرية الرائدة إلى باقى الدول العربية لخط نجدة الطفل \"16000\"<br />11/22/2007 8:43:17 PM<br />22/11/2007<br />أشاد المؤتمر الأقليمى التشاورى الثانى لخطوط نجدة الطفل بمنطقة الشرق الأوسط وشمال أفريقيا . الذي عقد مؤخرا بدولة الإمارات – أبوظبى ، بخط نجدة الطفل المصرى \"16000\" وقوة آلياته فى تقديم الاستشارات الأسرية من خلال برامج الأرشاد الأسرى بما يمثل دعما حقيقيا للأسرة المصرية فى تقديم العون فى أساليب التنشئة الأجتماعية السليمة ، وقد كشفت تلك البرامج عن الحجم الحقيقى للمشكلات التى يتعرض لها الطفل نتيجة لضعف الوعي لدي الوالدين فى التعامل مع المواقف والمشكلات الحياتيه للأطفال وتقديم الدعم اللازم لهم صرحت بذلك السفيرة / مشيرة خطاب الأمين العام للمجلس القومي للطفولة والأمومة .<br />وقد شارك في فعاليات المؤتمر سبعة عشر دولة من دول المنطقة العربية بهدف تبادل الخبرات بين المعنيين بحقوق الطفل وآليات إنفاذ هذه الحقوق من خلال خطوط نجدة الطفل .<br />ناقش المؤتمر آليه خط نجدة الطفل كوسيلة لإرساء حق الطفل فى الحماية وحقه فى المشاركة من خلال التعبير عن رأيه فى كل ما يتعلق به من قضايا، وكذلك تجارب بعض الدول عربية فى مجال إنشاء خطوط النجدة مثل الجزائر ."
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204174013/http://masr.20at.com:80/newArticle.php?sid=12627"

