[[comments]]
order = 3
subject = "أحييك علي هذا الموضوع"
author = "محمد الخطيب"
posted = "2007-11-30"
text = "الأستاذ / أحمد حربية، تحية طيبة أيها الصحفي الجميل<br />أولاً، أحييك بشدة علي عنوان الموضوع اللافت للنظر بشدة، والذي أعتقد أنه يحوي معانٍ أدبية أكثر عمقاً من كونه مجرد عنوان لافت للانتباه.<br />المقال من المقالات المتميزة التي تسير برشاقة على الخط الفاصل بين التحقيق الصحفي و القصة القصيرة..و أرى في رأيي الشخصي أن ذلك النوع من الكتابة هو الأكثر القدرة علي صنع التغيير؛ فالتغيير يبدأ بلمحة إنسانية كتلك، تتكدس فيها مشكلات مجتمع ككل.<br />أتعجب من التعليق السابق في نفس الصفحة و الذي جاء (عفواً) غبياً.. حيث ترك صاحبنا الموضوع بالكامل ليسأل عما إذا كان الكاتب صحفياً أكاديمياً أم لا؟!.."
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204174013/http://masr.20at.com:80/newArticle.php?sid=12627"

