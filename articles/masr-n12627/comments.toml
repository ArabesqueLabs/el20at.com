[[comments]]
order = 5
subject = "الى بسلة مسلمة مصرية"
author = "عدس مسيحي مصري"
posted = "2007-12-01"
text = "انتي بتقولي يا ست بسلة ان اعمار اشترت المتر بـ 90 جنيه وحتبيع المتر بـ 8000 جنيه<br />اعمار اشترت الارض بـ 90 جنيه ارض جرداء لا زرع فيها ولا ماء<br />واعمال حتدخل فيها المياه والكهرباء وحترصف الشوارع وحتحولها على مدينة متكاملة على نفقتها الخاصة علشان خاطر كده المتر حيرتفع الى 8000 جنيه<br />شوفي بقه الارض البور دي عايه جهد اد ايه وفلوس اد ايه علشان خاطر تتحول الى مدينة وطبا الشركة دي عايزه تكسب مش حتشتغل لله لان دي شركة مساهمة الناس المساهمين عايزين ارباح<br />الواحد لازم يكون فاهم قبل ما يتكلم<br />وبعدين عيب عليكي لما تقولي بسله مسلمة مصرية عيب تتريقي على الدين الاسلامي لان دا يدخل من باب الاستهزاء بالدين<br />فان كنت مسلمة استغفري ربك وان كنتي مسيحية فاعملي ان الله قد قال (ومن يبتغ غير الإسلام دينا فلن يقبل منه)"
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204174013/http://masr.20at.com:80/newArticle.php?sid=12627"

[[comments]]
