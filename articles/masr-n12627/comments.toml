subject = "امومة وطفولة اية دا فقر دكر ركب البلد"
author = "tr"
posted = "2007-12-01"
text = "الامومة والطفولة هتعمل اية دا فقر دكر ركب الناس الناس مش لاقية تاكل علشان كدة بتشحت<br />وفية اطفال شوارع زى الكلاب الضالة<br />اما شركة اعمار للاخ المساهم فيها فهى السبب فى رفع اسعار الشقق والعقارات فى مصر الى 3 اضعاف<br />ولما تعرف اعمار ابقى تعال اتكلم عنها"
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204174013/http://masr.20at.com:80/newArticle.php?sid=12627"

