subject = "ضع عنوان التعليق"
text = "جاسوس يا ابن المتنا..... و اعدام كمان يا اهبل<br />تلاقي اللي قبض عليه كان عينه على اللاب توب قال اما اوديه في داهيه<br />دا ايه الشعب النتن دا و الحق ما بينكم ضايع<br />عالم اوساخ"
archived = "2007-06-28"
capture_url = "https://web.archive.org/web/20070628203928/http://masr.20at.com:80/newArticle.php?sid=10799"

[[comments]]
order = 2
subject = "بائع من البائعين"
author = "ابو اسامة"
text = "بتحاسبوه على ايه طيب حاسبوا انفسكم الأول هذا الشاب ما هوالا بائع من البائعين لبلده على الاقل عنده شوية حياء وباع فى السر<br />امال الى بيبيع عينى عينك محدش كلمه ولا سمعنا انه خد نص تاْبيدة حتى هو باع اسرار مع انى مش عارف ايه الاسرار الى عندنا اسرائيل متعرفهاش يكونشى صنعنا القنبلة واحنا مش عارفين طيب اهو شوية اسرار من البلد لكن انتم بعتوا<br />البلد بحالها لأجانب يبقى اسرار ايه الى خيفين يعرفوها كلها ايام وتبقى البلد بلدهم .على فكرة الموضوع ده هيخلينى اقول<br />لكم سر من اسرار الدولة بس انياك مخدش تاءبيدة (مبارك حمار) هذا هو السر بس محدش يقول"
archived = "2007-06-28"
capture_url = "https://web.archive.org/web/20070628203928/http://masr.20at.com:80/newArticle.php?sid=10799"
