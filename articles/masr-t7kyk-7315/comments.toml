text = "طيب يا دكتورة يا .؟؟؟ ما تروحى تشوفى الموضوع دا فالعراق انت مقرتيش الرساله اللى بعتتها واحدة عراقية مسلمة بتقول اغيثونا ارحامنا تحمل ابناء الصليبيين؟ انتى جايه تتصدرى هنا للمسلمين وسايبه الدول المتخلفة اللى بيقولو عليها متقدمة اللى الستات عندهم بيشتغلو فشركات اسفلت بيرصفو الشوارع وبيشتغلو سواقين تاكسى وجيالنا احنا جايه وواخده منهم كلام هما حتى مش بيعملوه ولا بيطبقوه ما بينهم ولو كان فى عندهم فعلا تاهيل جنسى زى ما بتقولى ففى هنا برضو تاهيل جنسى ولو عندك ف.....بتاع فيلم .........مالى البلد روحيله هاتيلك من عنده فيلمين.... ولا تلاتة واقفلى على ولادك وسيبيهم ...وافتكرى ان .... زى ... واكيد دا اللى عايزين يوصلو ليه عندنا وبرضو عن طريق الجزم ومع الاعتزار للجزم"
