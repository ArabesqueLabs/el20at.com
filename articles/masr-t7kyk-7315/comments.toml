[[comments]]
order = 6
subject = "سؤال للدكتورة ماجدة"
author = "رجل طيب"
posted = "2007-10-11"
text = "سؤال للدكتورة ماجدة<br />أرسل هذا التعليق بواسطة : رجل طيب<br />الاتحاد الاروبى هو الذى يمولها - جميل - ولكن يا دكتورة - يا متعلمة - هاتى الاحصائيات الدولية ةالمشورة لدول الاتحاد الاروبى فى العنف والاغتصاب والتحرش الجنسى فى جميع دول اوروبا واعملى مقارنة بينها وبين مصر<br />هذة الجمعيات اولى بهم ان يمولوها فى بلادهم<br />تجارة الجنس والدعارة فى شمال اروبا والسويد وهولندا والنساء العرايا فى الفترينات اليس هو من تجارة الرقيق واللحم الابيض<br />ماذا اصابنا هل اصبنا فى عمى الالوان<br />المرأة عندنا مكرمة الف مرة من عندهم<br />وانت يا استاذ شريف -لماذا تنكش فى المواضيع ذات الرائحة الهباب<br />هذة الجمعيات هى ستار للتجسس والمخابرات الاجنبية تحت مسميات مختلفة<br />ودول اروبا لاتهمها اوضاع المرأة وانظروا الاوضاع واوضاع المرأة فى العراق وما يلاقونة من امريكا<br />انتبهوا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "سؤال لكل الناس"
author = "اكتب اسمك هنا"
posted = "2007-10-11"
text = "طبعا انتو عارفين في مصر او في اي بلد اسلامي كل النسوان متبرجين وكل النسوان اللي ماشية في الشارع مثيرة للشهوة وكل القنوان التلفزيونية مثيرة للشهوة<br />الرجاله حتعمل ايه في هذه الحالة<br />هل من المعقول ان الواحد لما يحتاج الى زوجته يستأذن منها الاول ويشوفها متهيأة للقاء جنسي<br />طبعا مش معقول والمفروض الزوجة تكون عارفة ان جوزها ممكن يطلبها في اي وقت<br />والست مهيأة الى ذلك<br />والدليل على ذلك ولا مؤاخذة<br />انا بكلمكم من خارج مصر انا شفت بيوت دعاره ولا مؤاخذة<br />البنات في هذه البيوت اقسم بالله العظيم مثل المرحاض تماما<br />الراجل ما بياخدش معاهم اكثر من 10 دقائق والواحدة من دول عندها استعداد تجامع اكثر من 200 راجل في اليوم<br />اذن المرأة عندها القدرة انها تمارس الجنس في اي وقت وبدون اي اعذار<br />يبقى الكلام اللي كتدو عمو شريف الدواخلي دا كلام فارغ ي فارغ في فارغ وكان المفروض يعرف انه ما ينفعش في العالم الاسلامي خالص"
archived = "2010-03-14"
capture_url = ""

