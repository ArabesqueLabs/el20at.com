[[comments]]
order = 10
subject = "وملتها اية"
author = "قرفان"
posted = "2007-10-11"
text = "وماجدة عدلى دى ملتها اية - وبنت مين - ومتزوجة او انسة - وهل تعرضت لعنف جنسى من زوجها اذا كانت متزوجة - او من صديقها اذا لم تكن متزوجة<br />وما سر حماسها الشديد للموضوع دة<br />ثم اية اللى دخل دول اروبا فى موضوع زى دة<br />الموضوع لم يستكمل ياعم شريف وتحقيقك ناقص خالص<br />ثم بعض النساء عندهم مرض الساديزم وبيحبوا ينضربوا قبل المعاشرة الزوجية دول لازم ينحبسوا كمان<br />ثم اية اللى دخل الازهر فى الموضوع بتاع الدكتورة دى<br />ومقلتش الدكتورة دى طبيبة والا معاها دكتوراة فى الهشك بيشك<br />ياعم شريف انت شفت الموضوع عندها وبنجت<br />وهو عنوان المركز دة اية<br />بلغت المخابرات العامة<br />دا مركز ضد امن الدولة"
archived = "2010-03-14"
capture_url = ""

