order = 3
subject = "من اجل ذلك انا اؤيد حسني مبارك بشده"
author = "مش ممكن"
text = "من اجل هؤلاء الغجر لا بد من المسلمين ان يتحدوا جميعا في مصر لان في الفرقة والخلاف بين اخوان ووطني وحكومة وخلافه فرصة سانحة لهؤلاء الكلاب بالدخول وزعزعة استقرار مصر اما اذا اتخد المسلمين جميعا تحت اي راية حيظهر هؤلاء الشرذمة بعددهم الحقيقي وهو ستة في المية ويضعف املهم في تحقيق اي مكاسب<br />وخلي بالكم هما عاملين مشاكل جامدة لحسني مبارك في امريكا بسبب المادة الثانية من الدستور التي تنص على ان الشريعة الاسلامية هي مصدر التشريع<br />ولذلك انا اؤيد حسني مبارك بشده وارجو ان تكونوا كذلك وارجو من الاخوان المسلمين ان يعودوا الى رشدهم ويعملوا صلح سريع مع الحكومة وينسحبوا فورا من مجلس الشعب"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"

