subject = "الاقباط هم الذين يضطهدون انفسهم بعدم دخولهم للاسلام مثل بقية المصريين"
author = "مش لازم"
text = "وها هي قصة شماس سابق بالكنيسة دخل الاسلام شوفوا قال ايه<br />قصة أسلامي<br />بسم الله الرحمن الرحيم<br />* الحمد الله على نعمة الاسلام نعمة كبيرة لا تدانيها نعمة لأنه لم يعد على الأرض من يعبد الله وحده الا المسلمين.<br />* ولقد مررت برحلة طويلة قاربت 40 عاما الى أن هدانى الله وسوف أصف لكم مراحل هذه الرحلة من عمرى مرحلة مرحلة:-<br />مرحلة الطفولة:- ( زرع ثمار سوداء )<br />* كان أبى واعظا فى الاسكندرية فى جمعية أصدقاء الكتاب المقدس وكانت مهنته التبشير فى القرى المحيطة والمناطق الفقيرة لمحاولة جذب فقراء المسلمين الى المسيحية.<br />* وأصر أبى أن أنضم الى الشمامسة منذ أن كان عمرى ست سنوات وأن أنتظم فى دروس مدارس الأحد وهناك يزرعون بذور الحقد السوداء فى عقول الأطفال ومنها: -<br />1- المسلمون اغتصبوا مصر من المسيحين وعذبوا المسيحين.<br />2- المسلم أشد كفرا من البوذى وعابد البقر.<br />3- القرآن ليس كتاب الله ولكن محمد اخترعه.<br />4- المسلمين يضطهدون النصارى لكى يتركوا مصر ويهاجروا..... وغير ذلك من البذور التى تزرع الحقد الأسود ضد المسلمين فى قلوب الأطفال.<br />* وفى هذه الفترة المحرجة كان أبى يتكلم معنا سرا عن انحراف الكنائس عن المسيحية الحقيقية التى تحرم الصور والتماثيل والسجود للبطرك والاعتراف للقساوسة.<br />مرحلة الشباب ( نضوج ثمار الحقد الأسود )<br />أصبحت استاذا في مدارس الأحد و معلما للشمامسة وكان عمري 18 سنة وكان علي أن أحضر دروس الوعظ بالكنيسة والزيارة الدورية للأديرة ( خاصة في الصيف ) حيث يتم استدعاء متخصصين في مهاجمة الإسلام والنقد اللازع للقرآن ومحمد ( صلي الله علية وسلم ) .<br />* وما يقال في هذه الإجتماعات :<br />1- القرآن مليء بالمتناقضات ( ثم يذكروا نصف آية ) مثل ( ولا تقربوا الصلاة ...)<br />2- القرآن مليء بالألفاظ الجنسية ويفسرون كلمة ( نكاح ) علي أنها الزنا أو اللواط .<br />3- يقولون أن النبي ومحمد ( صلي الله عليه وسلم ) قد أخذ تعاليم النصرانية من ( بحيره ) الراهب ثم حورها و إخترع بها دين الإسلام ثم قتل بحيره حتي لا يفتضح أمره ........ ومن هذا الإستهزاء بالقرآن الكريم و محمد ( صلي الله عليه وسلم ) الكثير والكثير ...<br />أسئلة محيرة :<br />الشباب في هذه الفترة و أنا منهم نسأل القساوسة أسئلة كانت تحيرنا :<br />شاب مسيحي يسأل :<br />س : ما رأيك بمحمد ( صلي الله عليه وسلم ) ؟<br />القسيس يجاوب : هو إنسان عبقري و زكي .<br />س : هناك الكثير من العباقرة مثل ( أفلاطون ، سقراط , حامورابي .....) ولكن لم نجد لهم أتباعا و دين ينتشر بهذه السرعة الي يومنا هذا ؟ لماذا ؟<br />ج : يحتار القسيس في الإجابة<br />شاب أخر يسأل :<br />س : ما رأيك في القرآن ؟<br />ج : كتاب يحتوي علي قصص للأنبياء ويحض الناس علي الفضائل ولكنه مليء بالأخطاء .<br />س : لماذا تخافون أن نقرأه و تكفرون من يلمسه أو يقرأه ؟<br />ج : يصر القسيس أن من يقرأه كافر دون توضيح السبب !!<br />يسأل أخر:<br />س : إذا كان محمد ( صلي الله عليه وسلم ) كاذبا فلماذا تركه الله ينشر دعوته 23 سنه ؟ بل ومازال دينه ينتشر الي الأن ؟ مع انه مكتوب في كتاب موسي ( كتاب ارميا ) ان الله وعد بإهلاك كل إنسان يدعي النبوة هو و أسرته في خلال عام ؟<br />ج : يجيب القسيس ( لعل الله يريد أن يختبر المسيحيين به ).<br />مواقف محيرة :<br />1- في عام 1971 أصدر البطرك ( شنودة ) قرار بحرمان الرهب روفائيل ( راهب دير مارمينا ) من الصلاة لأنه لم يذكر أسمه في الصلاة وقد حاول اقناعه الراهب ( صموائيل ) بالصلاة فانه يصلي لله وليس للبطرك ولكنه خاف ان يحرمه البطرك من الجنه ايضا !!<br />وتسائل الراهب صموائيل هل يجرؤ شيخ الأزهر ان يحرم مسلم من الصلاة ؟ مستحيل<br />2- أشد ما كان يحيرني هو معرفتي بتكفير كل طائفة مسيحية للأخري فسالت القمص ( ميتاس روفائيل ) أب اعترافي فأكد هذا وان هذا التكفير نافذ في الارض والسماء .<br />فسألته متعجبا : معني هذا اننا كفار لتكفير بابا روما لنا ؟<br />أجاب : للأسف نعم<br />سألته : وباقي الطوائف كفار بسبب تكفير بطرك الإسكندرية لهم ؟<br />أجاب : للأسف نعم<br />سألته : وما موقفنا إذا يوم القيامة ؟<br />أجاب : الله يرحمنا !!!<br />بداية الإتجاة نحو الإسلام<br />* وعندما دخلت الكنيسة ووجدت صورة المسيح وتمثاله يعلو هيكلها فسألت نفسي كيف يكون هذا الضعيف المهان الذي استهزأ به و عذب ربا و إلها ؟؟<br />* المفروض أن أعبد رب هذا الضعيف الهارب من بطش اليهود . وتعجبت حين علمت أن التوراة قد لعنت الصليب والمصلوب عليه وانه نجس وينجس الأرض التي يصلب عليها !! ( تثنية 21 : 22 – 23 ) .<br />* وفي عام 1981 : كنت كثير الجدل مع جاري المسلم ( أحمد محمد الدمرداش حجازي ) و ذات يوم كلمني عن العدل في الإسلام ( في الميراث ، في الطلاق ، القصاص ...... ) ثم سألني هل عندكم مثل ذلك ؟ أجبت لا.. لايوجد<br />* وبدأت أسأل نفسي كيف أتي رجل واحد بكل هذه التشريعات المحكمة والكاملة في العبادات والمعاملات بدون اختلافات ؟ وكيف عجزت مليارات اليهود والنصاري عن إثبات انه مخترع ؟<br />* من عام 1982 و حتي 1990 : وكنت طبيبا في مستشفي ( صدر كوم الشقافة ) وكان الدكتور محمد الشاطبي دائم التحدث مع الزملاء عن أحاديث محمد ( صلي الله عليه وسلم ) وكنت في بداية الأمر اشعر بنار الغيرة ولكن بعد مرور الوقت أحببت سماع هذه الأحاديث ( قليلة الكلام كثيرة المعاني جميلة الألفاظ والسياق ) و شعرت وقتها أن هذا الرجل نبي عظيم<br />هل كان أبي مسلما<br />* من العوامل الخفية التي أثرت علي هدايتي هي الصدمات التي كنت أكتشفها في أبي ومنها :<br />1- هجر الكنائس والوعظ والجمعيات التبشيرية تماما .<br />2- كان يرفض تقبيل أيدي الكهنة ( وهذا أمر عظيم عند النصاري )<br />3- كان لايؤمن بالجسد والدم ( الخبز والخمر ) أي لا يؤمن بتجسيد الإله .<br />4- بدلا من نزوله صباح يوم الجمعة للصلاة أصبح ينام ثم يغتسل وينزل وقت الظهر ؟!<br />5- ينتحل الأعذار للنزول وقت العصر والعودة متأخرا وقت العشاء .<br />6- أصبح يرفض ذهاب البنات للكوافير .<br />7- ألفاظ جديدة أصبح يقولها ( أوذ بالله من الشيطان ) (لا حول ولا قوة الا بالله )...<br />8- وبعد موت أبي 1988 وجدت بالإنجيل الخاص به قصاصات ورق صغيرة يوضح فيها أخطاء موجودة بالأناجيل وتصحيحها .<br />9- وعثرت علي إنجيل جدي ( والد أبي ) طبعة 1930 وفيها توضيح كامل عن التغيرات التي أحثها النصاري فيه منها تحويل كلمة ( يا معلم ) و ( يا سيد ) الي ( يا رب ) !!!ليوهموا القاريْ ان عبادة المسيح كانت منذ ولادته .<br />الطريق إلي المسجد<br />* وبالقرب من عيادتى يوجد مسجد ( هدى الاسلام ) اقترب منه وأخذت أنظر بداخله فوجدته لا يشبه الكنيسة مطلقا ( لا مقاعد – لا رسومات – لا ثريات ضخمة – لا سجاد فخم – لا أدوات موسيقى وايقاع – لا غناء لا تصفيق ) ووجدت أن العبادة فى هذه المساجد هى الركوع والسجود لله فقط ، لا فرق بين غنى وفقير يقفون جميعا فى صفوف منتظمة وقارنت بين ذلك وعكسه الذى يحدث فى الكنائس فكانت المقارنة دائما لصالح المساجد.<br />فى رحاب القرآن<br />* وررت أن أقرأ القرآن واشتريت مصحفا وتذكرت أن صديقى أحمد الدمرداش قال ان القرآن ( لا يمسه الا المطهرون ) واغتسلت ولم أجد غير ماء بارد وقتها ثم قرأت القرآن وكنت أخشى أن أجد فيه اختلافات ( بعد ما ضاعت ثقتى فى التوراة والانجيل ) وقرأت القرآن فى يومين ولكنى لم أجد ما كانوا يعلمونا اياه فى الكنيسة عن القرآن .<br />* الأعجب من هذا أن من يكلم محمد صلى الله عليه وسلم يخبره أنه سوف يموت ؟!! من يجرؤ أن يتكلم هكذا الا الله ؟؟!! ودعوت الله أن يهدين ويرشدني .<br />الرؤيا :<br />وذات يوم غلبى النوم فوضعت المصحف بجوارى وقرب الفجر رأيت نورا فى جدار الحجرة وظهر رجلا وجهه مضىء اقترب منى وأشار الى المصحف فمددت يدى لأسلم عليه لكنه اختفى ووقع فى قلبى أإن هذا الرجل هو النبى محمد صلى الله عليه وسلم يشير الى أن القرآن هو طريق النور والهداية .<br />أخيرا – أسلمت وجهى لله<br />* وسألت أحد المحامين فدلني علي أن أتوجه لمديرية الأمن – قسم الشئون الدينية – ولم أنم تلك الليلة وراودني الشيطان كثيرا ( كيف تترك دين أبائك بهذه السهولة ) ؟<br />* وخرجت في السادسة صباحا ودخلت كنيسة ( جرجس وأنطونيوس ) وكانت الصلاة قائمة ، وكانت الصالة مليئة باصور والتماثيل للمسيح و مريم و الحواريين وأخرين إلي البطرك السابق ( كيرلس ) فكلمتهم : ( لو أنكم علي حق وتفعلون المعجزات كما كانوا يعلمونا ففعلوا أي شيء ... أي علامة أو إشارة لأعلم انني اسير في الطريق الخطأ ) و بالطبع لا إجابة .<br />* وبكيت كثيرا علي عمر كبير ضاع في عبادة هذه الصور والتماثيل . وبعد البكاء شعرت أنني تطهرت من الوثنية وأنني أسير في الطريق الصحيح طريق عبادة الله حقا .<br />* وذهبت الي المديرية و بدأت رحلة طويلة شاقة مع الروتين ومع معاناة مع البيروقراطية و ظنون الناس وبعد عشرة شهور تم اشهار اسلامي من الشهر العقاري في أغسطس 1992 .<br />اللهم أحيني علي الإسلام وتوفني علي الإيمان<br />اللهم إحفظ ذريتي من بعدي خاشعين ،عابدين ، يخافون معصيتك ويتقربون بطاعتك<br />و آخر دعوانا أن الحمد لله رب العالمين"
