text = "خلي بالكم يا جماعة عدد المسلمين في مصى 94% من عدد السكان بشهادة المخابرات الامريكية احفظوها كويس<br />عدد المسلمين في مصر 94% من عدد السكان<br />اللي بيعملوه الاقباط دا كله كلام فارغ ليس له اي اساس سوى انهم شغالين لحساب المخابرات الاسرائيلية والحاضر يبلغ الغايب والحاضر يبلغ الغايب"
