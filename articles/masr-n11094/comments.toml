[[comments]]
order = 7
subject = "لو كانوا مصريين حقا ؟"
author = "ابو الطيب"
text = "لو كانوا مصريين من اصل مصرى لكان عندهم حق الكلام<br />انما هم بقايا الرومان الذين يكتبون لغتهم بحروفها ويصلون صلواتهم باللاتينى وثضوا على اللغة الهيروغليفية حينما كتبوا كلامها باللاتينى<br />وانظر الى وجوهم امام اى كنيسة تلاقى العيون الخضر والشعر الاصفر واللون الابيض ستعرف انهم من اصل رومانى وقايا الاستعمار الرومانى<br />ليس لهم اى حق<br />والعاقلين منهم غادروا فى ستين كسحة الى اقاربهم الرومان فى امريكا وغيرها<br />وهم لا يزيدوا ابدا عن اربعة ملايين معقد نفسيا واخلاقيا وعندهم نتيجة النفسية المريضة عجز جنسى فاضح واسال البنات التى تتزوج مسلمين والزوجات امثال زوجة القس اياة<br />فى بريطانيا خمسة ملايين مسلم ولا حق لهم<br />وفى فرنسا سبعة ملايين مسلم<br />ماذا يريدون<br />كلام عال لا يودى ولا يجيب غير ان يثبت عمالتهم وخيانتهم<br />انسوا مشاكل الاقليات المعقدة المهددة بالتلاشى خلال فترة وجيزة قادمة<br />وكانوا فرحانين قوى لما امريكا غزت العراق<br />ولكن لما بضعة الاف من المسلمين زلوا امريكا ومعاها 23 دولة صليبية وموتوا المسيحيين فى العراق رغم وجود امريكا هناك ولكنهم لا يتعظون"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"

[[comments]]
order = 8
subject = "الى المعلق اللي فوق ابو الطيب معظم المسيحيين ليسوا من اصول مصرية"
text = "كلامك صحيح يا اخ ابو الطيب المسيحيين اغلبهم شعرهم سايح وعيونهم خضرا وبشرتهم بيضاء وهذه صفات اجنبية بحته وليست صفات مصرية<br />مع اننا نحترم جنسيتهم المصرية الحالية بشرط ان يكفوا ان القول انهم اصل البلد"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"

[[comments]]
order = 9
subject = "المجانين فى نعيم"
author = "وب واوات الفرعونى"
text = "و الله كل اللى علقوا على الموضوع مجانين و لا يفهموا أى شئ لا فى العلم و لا الثقافة و لا الحضارة و ميتهلوش الرد كمان يا حلوين روحوا ذاكروا أنثروبولوجى و تاريخ و جغرافية و ألسن و لغات قديمة و لغات حديثة و مقارنة أديان و تاريخ فرعونى و تاريخ الحضارة و بعدين أبقوا فكروا تتكلموا و تكتبوا علشان اللى يفتى فى حاجة ميعرفهاش يبقى لا مؤاخذة \"\"\" مش عايز أقول و معلومة توضح لكم الغباء المستعصى ان بعض الفراعنة منذ أقدم العصور حملوا صفات اوربية و أقوى مثال على ذلك الملك جددف رع ابن الملك خوفو بانى الهرم الاكبر يعنى قبل الرومان ب 4500 سنة كان أبيض و شعره أصفر و عنيه خضرة و كان فرعون مصر يا حلوين لان الفراعنة كانوا ممكن يتجوزوا من الأوربيين فى بعض الأحيان صباح الفل !!! اما المصريين اللى بتسموهم أقباط بطلوا يكتبوا لغة الفراعنة بحروف ديموطيقية و كتبوها بحروف مختزلة من اليونانى و الديموطيقى لكنهم حافظوا على اللغة و الهوية و الالحان و الموسيقى و العادات و التقاليد بعكس المصريين المسلمين اللى فرطوا فى كل حاجة مصرية و أرتموا فى حضن الغزاة و نسيوا لغتهم الأصلية و أتكلموا عربى و كتبوا عربى و اخدوا ادات عربية متخلفة جابتنا الاف السنين لورا أنصحكم أقروا شوية حتى ولو بالعربى"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"

[[comments]]
order = 10
subject = "لا حول و لا قوه الا بالله"
author = "mariam ali"
text = "ليه كل ما يكون فى مناقشه فى موضوع دينى ندخل نسىء لبعض<br />يا ترى الساده االى بيعلقوا معتقدين ان الأسلام يأمرنا بالأساءه للغير<br />بالعكس انتوا كده بتسيئوا للأسلام<br />يا ريت الحوار يكون فى حدود آداب الحوار"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"

[[comments]]
order = 11
subject = "المسلمين لسعوا والمسيحيين لاسعين بس فى السر"
author = "محمد زين العابدين"
text = "ان يبقى فيه مشاحنات طائفية ماشى ووارد فى ظل جو التعصب الدينى الموجود فى العالم كله .. لكن يوصل للبعض انه يتخيل ان للمسيحيين شكل معين ده يبقى جنان بعينه ..المسيحيين تلتينهم فى الصعيد سمر ورفيعيين والشمس ناقحاهم وحالتهم خره زى كل الصعايده .. انا كن بسال نفسى ازاى الشيعة والسنة بيقتلوا فى بعض ازاى لمجرد ان واحد اسمه عمر وواحد اسمه عبدالامير .. بس انا دلوقتى فهمت .. جتكوا ستين نيلة مسلمين ومسيحيين"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"

[[comments]]
order = 12
subject = "الجاهل اللى مسمى نفسة فرعونى"
author = "وبعض الفراعنة كانوا رومان"
text = "والديانة المسيحية نفسها الفها واخرجها فلاسفة الاسكندرية بناءا على القصة الشهيرة الاب ازوريس والعذراء ايزيس والابن حورس والصعود الى السماء وباقى القصة الخرافية<br />اما ان الاوان لنتخلص من الاقباط بقايا الاحتلال الرومانى<br />اما بالتهجير واما ان يسلموا ان كرها او طواعية<br />والموت لهؤلاء الخونة عملاء امريكا"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"
