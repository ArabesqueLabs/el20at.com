[[comments]]
order = 2
subject = "وأعدوا لهم ما استطعتم من قوة ومن رباط الخيل"
author = "مش ممكن"
text = "من مطالعة المقال الاقباط يحاولون ادانة الاسلام بهذه الاية واعدوا لهم ما استطعتم من قوه مع انها دليل على صحة الاسلام<br />وتعالوا بينا نشوف ازاي<br />في المسيحية الراي بيقول من ضربك على خدك الايمن ادر له خدك الايسر<br />الان امريكا اقوى واغنى دولة في العالم<br />يا ترى اخذت باي المبدأين واعدوا لهم ما استطعتم من قوة ومن رباط الخيل ترهبون به عدو الله وعدوكم ولا اخذت مبرا من ضربك على خدك الايمن ادر له خدك الايسر<br />بالطبع امريكا اخذت بالاية القرأنية لانها صحيحة والاية الانجيلية اية تخريف<br />مين هو دا اللي يضربك على خدك الايمن ادر له خدك الايسر<br />الصيح هو واعدوا لهم ما استطعتهم من قوة لذلك امريكا عملت بهذه الاية لانها صحيحة واية ربانية ويعمل بها كل البشر لانها اية الفطره يعمل بها الهندوس والسيخ والكفره قبل المسلمين واعدوا لهم ما استطعتم من قوة كل طائفة تعد ما استطاعت من قوه<br />فهمتوا يا اقباط يا بقر اما الاية الانجليلية والانجيل كله المعرب او المحرف اذا صح التعبير مكانه سلة المهملات ولا مؤاخذه"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"

