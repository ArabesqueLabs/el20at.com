subject = "المشكلة القبطية بدعة اسرائيلية"
author = "مش ضروري"
text = "كما تعلمون يا اخواني الاحباء انه منذ ما يقارب من خمسين او خمسة وخمسين سنه كانت مصر محتله من قبل بريطانيا العظمى كما تحتل امريكا العراق الان يعني مصير مصر كان في يد بريطانيا<br />وخمسين عاما ليسوا بالزمن الكثير<br />فلو كانت هناك مشكلة قبطية من اصله لكانت عرضت علي الاحتلال البريطاني ليبت فيها<br />ما هو اصل بريطانيا سلمت فلسطين الى العصابات الصهيونية بدون حياء او خجل<br />وبالتالي كان ممكن بريطانيا تسلم مصر للاقباط دا اذا كان فيه اقباط في البلد اصلا<br />فالمشكلة القبطية بدعة اسرائيلية لزعزعة الاستقرار في اكبر دولة عربية اسلامية على الاطلاق وبلا منازع وهي مصر<br />علاوة ان عدد الاقباط لا يسمح بأي شيء من اصله فعدد الاقباط ? في الميه من عدد السكان وعندي الدليل ثابت في مجلة التايم الامريكية<br />فسته في الميه لا يرتقي لآي حقوق كما قلنا وهو الموضوع كله موضوع اسرائيلي بحت وشوية العيال الصيع بتوع المهجر وعلي رأسهم الكلب عدلي ابادير وديل الكلب مايكل منير وواحد محامي فاشل عايز يسترزق في امريكا اسمه موريس صادق<br />وشوية الهبل دول فاكرين نفسهم اسرائيل وفاكرين امريكا حتحاربلهم<br />وفيه نقطة ثانيه ان المسلمين في العصور الزاهرة ايام ما كان الاسلام هو السيد في العالم هم الذين حافظوا على التراث القبطي وعلي الاديرة القبطية ولم يكن هناك اي مانع امام المسلمين بهدم الاديرة القبطية والقضاء على الاقباط بدم بارد كما حصل للارمن في تركيا"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820172341/http://masr.20at.com:80/newArticle.php?sid=11094"

