[[comments]]
order = 0
subject = "العيار اللى ما يصيب يدوش"
author = "صعيدى من دشنا"
text = "يكفى ان نشرات التليفزيون العالمية نشرت الخبر - يوم الغضب فى مصر - واصبحت سمعة النظام اسود من اعمالة<br />واصبح سمعة القيادة فى وسط العرب انها قيادة مهزوزة ومكروهة<br />انتم شفتم البشير المطلوب امام الجنايات الدولية بيتحرك فى وسط شعبة فى عربية مكشوفة وبيقف يخطب فى وسط الشوارع- انما اللى عندنا من الوزير للكبير بيتحركوا فى عربيات مدرعة وبيقفلوا الشوارع<br />لا - احنا لم نحصل ولم نتساوى ببلد اسمها قطر<br />خللى الامن مشدود<br />والقيادات لم تنم<br />وبعدين تقوللى الشرعية"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408072958/http://masr.20at.com:80/newArticle.php?sid=20537"

[[comments]]
order = 1
subject = "الامن المركزى كان محاصر كل مداخل ومخارج المحافظات"
text = "وعربيات لوارى كبيرة زرقاء فيها قوات مكتوب عليها التشكيلات واقفة على الطرق بين المحافظات - وكان فية هجوم عسكرى هيحصل على البلد"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408072958/http://masr.20at.com:80/newArticle.php?sid=20537"
