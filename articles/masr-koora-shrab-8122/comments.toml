subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-01-27"
text = "أنا معجب جدا بهذه المجلة وهذا الموقع لما له من احترام في قلبي ، ولأنه لم ينتهز أي فرصة لنشر مايسيء لأي عربي فللأسف كنت أقرأ موقع مجلة العربية وصدمت لما قرأت من فتنة قائمة بين الشباب العربي من سب ولعن ولا يوجد منهم من يعلق على لب الموضوع - بل تقوم كل جنسية عربية بسب الآخري بدون أسباب - وللأسف يساعد هذ الموقع العربية نت في نشر هذه الفتنة والفرقة أنا احي مجلتكم هذه وأكن لها كل الاحترام - وأنا من القراء لكم ولكني لم اعلم قدر هذا الموقع الا عندما دخلت الموقع الخبيث والذي أجزم أنه صنع بأيدي يهود وليس بأيدي عربية<br />أرجو نشر كلامي هذا والعمل على محاربة الفتنة القائمة في موقع العربية نت - أرجو وبكل قوة لو باستطاعة أحد وقف هذه المهزلة التي بتعث إلى الفرقة من جميع الدول العربية ايقافها لما بها من مهاترات عربية بين شباب العرب ولجميع العاملين على هذا مسبقا كل الشكر - مع تحياتي"
