text = "هلا اختي احب اقول اني مندوبة سعودية والعمل متعب لكن بالفعل العمل لايناسب المرأة السعودية ولكني اعمل به ولا اقوم بزيارة البيت بل عرض المنتوجات لديهم عبر الجوال او البريد ثم ارسال شركه تقوم بايصال الطلب للمشتري واتمنى الرزق الكبير و نقول الله يحفظنا ويحفظ كل السعوديات ويحفظ بلدي السعودية من كل شر وحسد وحقد فكثير من القلوب حاقده وحاسده نسال الله ان يكفينا الشر وشكرا"
