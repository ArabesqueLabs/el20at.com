subject = "مهنة مندوبة المبيعات لا تناسب المسلمات لا السعوديا"
author = "متجول"
posted = "2007-06-27"
text = "- لاشك أن مهنة مندوبة المبيعات التي تقتضي الطواف على التجار والبيوت لا تناسب المرأة المسلمة التي تريد الحفاظ على كرامتها وعفتها خاصة في هذا الزمان الذي كثر فيه الفساق لانها لا تأمن على نفسها من سوء استغلالها ومن المعاكسات، فضلا عن المشقة الكبيرة التي تتطلبها هذه المهنة!<br />- حكم عمل المرأة مندوبة إعلانات<br />سؤال:<br />انتشر في الآونة الأخيرة طلب من بعض الشركات كالدعاية والإعلان وشركات الأدوية وغير ذلك للمرأة للعمل كمندوبة إعلانات أو مبيعات ، ما حكم عمل المرأة كمندوبة إعلانات أو مندوبة مبيعات حيث الاختلاط بالرجال وارد ؟<br />الجواب:<br />الحمد لله<br />كل دعوة إلى بروز المرأة وإلى خروجها من مستقرها من أسباب انتشار الفساد وأنه سبب لظهور الفحشاء ،<br />والله تعالى قد توعّد على ذلك ، قال تعالى : ( إِنَّ الَّذِينَ يُحِبُّونَ أَنْ تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ وَاللَّهُ يَعْلَمُ وَأَنْتُمْ لا تَعْلَمُونَ ) النور/ 19 ، توعدهم بهذا العذاب الأليم<br />ومعلوم أن المرأة تتوجه إليها الأنظار وأن الشهوات الشيطانية تلاحقها وتتابعها<br />وأن المفسدين إذا رأوها ولا سيما إذا سمعوها تتكلّم وربما ترقق كلامها وربما يبدو شيء من زينتها ، من حليها أو ما يلفت الأنظار ونحوها ويفهم من الذين يرون أو يسمعون أنها قليلة الأمانة أو أنها ليّنة لا ترد يد العابث ، فيعاكسونها وربما أخذوا أو حفظوا أرقام هواتفها ويكون ذلك سبباً لكثرة الفساد وانتشار السوء ،<br />وهؤلاء بلا شك الذين يدّعون في الصيدليات أن يتولى عندهم هذه الإعلانات نسوة أو كذلك ترويج سلعهم أن يعطوا هذه المرأة أنواعاً من الأدوية ويقولون لها اذهبي وروجيها واعرضيها على المريض الفلاني وعلى المريض الفلاني وعلى الطبيب الفلاني والعيادة الفلانية ،<br />وهكذا لا تزال تتردد بين تلك الأماكن وتدخل تلك الأسواق والمجتمعات ولا شك أن هذا كله دعاية إلى بروزها أو إلى خروجها وبالتالي نبذها للحجاب ،<br />فهذه الإعلانات والدعايات يقوم بها الرجال بسهولة وهم الذين يتولون ذلك ويدخلون الأسواق ويمارسون مثل هذه الأعمال ، أما هؤلاء فدعوتهم إلى إظهار الفواحش والمحرّمات<br />فعلينا أن نحذرهِّم ونرفض إعلاناتهم ونحذر نساء المسلمين من الإصغاء والانسياق وراء دعواتهم أو التعامل معهم بأي شكل من الأشكال والله تعالى هو الرزّاق ذو القوة المتين .<br />الإسلام سؤال وجواب<br />الشيخ محمد صالح المنجد"
archived = "2010-03-14"
capture_url = ""

