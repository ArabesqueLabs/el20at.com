[[comments]]
order = 3
subject = "ماذا تنقمون على إخوانكم؟؟ دعوكم من تعصب الجاهلية"
author = "مصري عاش في السعودية فترة"
posted = "2007-07-01"
text = "الى المتضايقين من الموضوعات الخاصة بالمجتمع المسلم السعودي الشقيق...<br />الموقع مليء بموضوعات عن فلسطين والاردن ولبنان وتونس ومصر وغيرها من الدول العربية...<br />ولا داعي لسوء الأدب في الخطاب وفي انتقاء الالفاظ كمبدأ عام للحوار وإبداء الرأي...<br />أقول للمتضايقين من موضوعات السعودية...<br />ماذا تنقمون على إخوانكم؟؟ دعوكم من تعصب الجاهلية للوطن... وارتقوا لأخوة الدين!<br />وليكن حكمكم على المواضيع من مقاييس الشرع لا الهوى ولا اعتبارات التعصب الشعوبي فكلنا اخوة!"
archived = "2010-03-14"
