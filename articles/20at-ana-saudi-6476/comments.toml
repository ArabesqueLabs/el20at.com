[[comments]]
order = 4
subject = ".................. حمرا"
author = "السعودية بلد الارهاب 2"
posted = "2007-07-02"
text = "عاوز اقول للسعودى اللى عامل فيها مصرى يااخى انتم مش محترفين غير فى الحركة دى حتى الاعلام بتاعكم محترف انة يجيب كلام على لسان ناس تانية ماعلينا ؟<br />اعتقد انى كمواطن مصرى من حقى اشوف مشاكل بلدى اولا على الموقع بتاعى ولو حبيت اشوف مشاكل بقية الدول العربية يكون فية تنويع لكن مشكلة الموقع دة ان اكتر من 80% من الموضوعات العربية خاصة بالسعودية والمشكلة انة مادام عمل صحفى يبقى لازم يكون خبر<br />طيب باللة عليك قوللى فين الخبر فى مهرجان مكة خير ؟؟؟؟؟؟؟؟<br />ولا الخبر انة المهرجان دة بديل<br />بديل لاية بالظبط ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />انتم ياسعوديين عنكم وهم انكم قبل العالم الاسلامى زى الفاتيكان يعنى مع ان الاسلام ملوش وطن<br />اقول كمان ؟<br />طيب الفنانات المحجبات مين بيمولهم ؟<br />طيب الاغانى الدينية لية كلها انتاج شركات سعودية<br />علشان تفهمنى صح لو انتا عندك موضوع دينى جميل او انتم فى السعودية شايفين الحجاب او حتى النقاب فريضة وعاوز تنقللى وجهة نظرك مافيش مشكلة<br />لكن لو بتلح عليا وعاوز تجربنى اتبنى وجهة نظرك<br />هنا فية مشكلة<br />مثلا انتم فى السعودية ضد سواقة الستات للعربية انتم احرار<br />ممكن اتقبل دة كخبر ؟ لكن انك تحاول تفرضة عليا وتحاول تدخل الدين فية ؟ دة مرفوض والف مرفوض<br />علشان كدة موقع عشرينات لازم يعمل توازن بين كل الدول العربية فين موضات لبنان عاوزين نحس الشعب اللبنانى من الداخل او عاوز اتعرف على التوانسة كفاية بقى مواضيع مدفوعة من السعودية<br />اما بالنسبة لاساءة الادب فدة لانك خروف سعودى فاكر نفسك احسن من كل الناس ولو مش مصدق ؟"
archived = "2010-03-14"
