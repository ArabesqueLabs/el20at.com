text = "ياعشرينات فكونا بقى من السعودية انتوا العقد بتاعكو معاهم ينتهى امتى<br />يااخى زهقنا من السعودية جرب تييجى ناحية التفاح البنانى او الفراولة السورى او عسل ليبيا او تونس الخضرا ياشيخ تعالى ناحية الكويت<br />بجد انتوا مافيش عندكم غير تجميل السعودية<br />وبعدين يااخى كل بلد حرة بناسها السعوديين مش عاوزين بناتهم يشتغلوا دة المللك بتاعهم بيقول اللى يرضى على بنتة تسوق سيارة هوا حر ؟؟؟؟؟؟؟؟؟<br />يعنى يااخى هيا رايحة بيت دعارة ياجماعة وحياة ابوك فكنا من سيرة الناس دول هما بيفسروا الدين على هواهم والدين عندهم مخلوط مع العادات والتقاليد<br />ارحمونا ياعام<br />افففففففففففففففففففففففففففففففففففففففففففففففف"
