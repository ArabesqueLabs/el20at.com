text = "حدث خطأ مطبعي في العنوانوالصحيحهو<br />قاتل الله المعوقين لاخوانهم والمتحاملين الذين لايرون الا من انبوب اسود<br />ونقول للرجال الابطال الشم الكرام الله معكم وحسبنا الله ونعم الوكيل<br />((ولا تهنوا ولا تحزنوا وانتم الأعلون ..))** ((إن تكونوا تألمون فإنهم يألمون كما تألمون وترجون مالا يرجون )) **((حتى إذا استيئس الرسل وظنوا أنهم قد كذبوا جاءهم نصرنا )) *** ((وزلزلوا حتى يقول الرسول والذين امنوا معه متى نصر الله ألا إن نصر الله قريب ))<br />مهجتنا وحشاشة قلوبنا واعز من نفوسنا علينا إخوتنا وأخواتنا وأطفالنا وأمهاتنا وآبائنا ... وكل من في غزة حتى هوامها انتم اعز علينا من أنفسنا وبكل ما نملك نفديكم ونصر الله قد لاح والقرآن ملئ بالمبشرات التي لا يملكها إلا الله وحده<br />فإذا نزل القادة ساحات الجهاد وتقدم العلماء لقيادة الأمة وتميز الخبيث من الطيب وتمايز الحق من الباطل فقد لاح النصر في الأفق.. واشد ساعات المخاض ما قبل الميلاد وأحلك ساعات الظلام ما قبل بزوغ الفجر ..وها نحن في معمعتها فاصبروا فالنصر لاح*** فالله لن يتيركم أعمالكم سيهديكم ويصلح بالكم ويدخلكم الجنة عرفها لكم ** ولا تنسونا أن نكون ممن تشفعون لهم عند الله<br />ونقول للخونة والعملاء وناصري البطل وأحفاد القرود لقد فضحكم الله يا أحفاد بن سلول فكل مالكم وسلطانكم غلول غل الله أيديكم *** إن الله جامع الكافرين والمنافقين في جهنم جميعا **ودماء الأطفال وكل الشهداء في رقابكم ** وحسبنا الله ونعم الوكيل ** وحسبنا الله هو الذي أيدك بنصره وبالمؤمنين ** فاصبروا وصابروا ورابطوا **"
