[[comments]]
order = 0
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
posted = "2009-01-16"
text = "حماس المتأسلمة الارهابية وهى فرع من فروع الاخوان المتأسلمين هى سبب كل الكوارث التى حلت بالشعب الفلسطينى !! الحمدلله ان الله اظهر حماس المتأسلمة على حقيقتها وهذا انذار من الله الى الشعب المصرى الذى انخدع بعض منه الى الاخوان المتأسلمين !! ان الله يقول للمصريين ان مصير الفلسطنين سيكون مصيركم لو انخدعتم فى الاخوان المتأسلمين !! ملحوظة حماس المتأسلمة اعتنقت المذهب الشيعى بناء على التعليمات القادمة لهم من ايران واعتقد ايضا ان الاخوان المتأسلمين فى مصر اعتنقوا هم ايضا المذهب الشيعى والدليل ترحيب مرشد الاخوان المتأسلمين بانتشار المذهب الشيعى فى مصر ."
archived = "2010-03-14"
