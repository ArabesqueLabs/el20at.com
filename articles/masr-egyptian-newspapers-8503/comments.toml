[[comments]]
order = 0
subject = "مالك بالإخوان ياحمدي يارزق"
author = "حماده باشا المصري"
posted = "2008-03-16"
text = "فكرني حمدي رزق بكثير من الصحفيين وأصحاب المدونات اللي بيقولوا على نفسهم مستقلين أو مبيشتغلش عند حد ومش عميل لحد والكلام الكبير ده لكن ...<br />ساعة مايتكلموا عن الإخوان وكأن النظام أهداهم كرباج وقال لهم اضربوا ومتخافوش احنا ساندنكم<br />اشمعني متجوش إلا على المظلوم<br />أكثر من 800 معتقل فقط في أسبوعين علشان المحليات<br />محاكمات عسكرية لـ 40 من القيادات لأكثر من سنة إلى الآن ولا جديد<br />سجن تعذيب في المعتقلات واللي يموت فيهم ملهوش ديه<br />ليه كل هذا الظلم<br />ففي هذا المقال ومقالات كتيره كمان إما تدافع عن النظام أو تحرض النظام على الإخوان أو يغير الموضوع ويتكلم في أي حاجه في أي حاجه ساعة المعمعة<br />ربنا يريحنا من كل العملاء والمنافقين وكدابين الزفه<br />حسبنا الله ونعم الوكيل"
archived = "2010-03-14"
