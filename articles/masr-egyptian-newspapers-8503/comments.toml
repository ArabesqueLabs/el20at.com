[[comments]]
order = 1
subject = "ناس طمعانة فى المناصب وكاتب عايز يرضى اسيادة ولكم"
author = "ابوصالح"
posted = "2008-03-16"
text = "الاخ حمدى رزق بصراحة كدة انا لابحبك ولابحب الاخوان المسلمين انت بتكتب لمصالح دنايوية وعشان اسيادك فى الحكم يرضوا عنك والاخوان طامعين فى الحكم والمناصب وتحقيق اكبر قدر من النجاحات الدنياوية من انتخابات واى انتخابات انشااللة لو كانت محليات كما يحدث الان لكن للاسف نادرا لما تلاقى كاتب او حزب وجماعة بتعمل لحب الوطن وعيزة تساعد الناس للخروج من كبوتهم والنوم العميق الهما فية ورحم اللة الاستاذ مجدى مهنا الكاتب المحترم الكان بيدافع عن الناس البسطاء وبعدين عن رضا اسيادة كما يفع للاسف معظم الكتاب ومنهم عمنا حمدى رزق للاسف(وحسبنا اللة ونعم الوكيل)"
archived = "2010-03-14"
capture_url = ""

