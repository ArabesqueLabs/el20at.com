text = "قال تعالى :sad: ومن يبتغي غير الإسلام ديناً فلن يقبل منه)الآية<br />لماذا لم يطلب أحد منهم هذا الحوار المزعوم؟<br />ج/ لانهم لايعترفون بك قال تعالى :sad: ولن ترضى عنك اليهود ولا النصارى حتى تتبع ملتهم) الآية.<br />هل هناك محاولة في عدم التفرقة بين الأديان ؟<br />ج/ قال تعالى :sad: ويكيدون كيدا وأكيدو كيدا فمهل الكافرين أمهلم رويدا) الآية."
