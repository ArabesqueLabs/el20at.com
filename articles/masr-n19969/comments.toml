[[comments]]
order = 0
subject = "هى كل حاجة فى البلد دى سجن وحبس"
text = "اية حكاية العقوبة الحبس فى البلد دى<br />اذا عملت مخالفة مرور تتحبس<br />اذا شكلك لم يعجب اى ضابط فى الشارع - ممكن تتحبس اربعة ايام تتجدد بتهمة الاشتباة<br />اى مادة فى قانون العقوبات ينص على الغرامة والحبس<br />هو احنا عندنا سجون كتيرة والا اية<br />وعندنا فلوس كتير قوى نصرفها على اكل المساجين وشربهم وحراستهم<br />هناك احصائيات بتقول ان عدد المصريون فى السجون حوالى اتنين مليون<br />اللى مسجون فى قضية نفقة لزوجتة<br />واللى مسجون فى اتهام سياسى او انة اخوان او قضية تموين<br />رجاءا كفاية سجن<br />والا احنا بلد السجون من اول سجن سيدنا يوسف فى مصر والقائة فى غياهب السجن وهو برىء"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218123814/http://masr.20at.com:80/newArticle.php?sid=19969"

[[comments]]
order = 1
subject = "حلم الشباب المصري"
author = "http://www.alltalaba.com/board/index.php?showtopic=3154&pid=24591&mode=threaded&start="
text = "الحلم المصري<br />وزارات ورا وزارات<br />تنهب على حسنا<br />واللى بييجى يا دوب<br />مظبوط على قد نا<br />جايز فلوس الشبكة<br />والمهر ييجى إنما<br />تفضل فلوس الشقة<br />ودا شيء بعيد عننا<br />دا حلمنا طول عمرنا<br />شقة تلم نا كلنا كلنا<br />وفى أى مكان فى الأرض<br />عايزين الشقة يا ناس<br />تمليك كان واللا إيجار<br />وى ف ض ل تبقى بلاش<br />حلمنا وفى كل مكان<br />شقة لكل العرسان<br />كل الأقساط تتسدد<br />وتجيب عربية كمان<br />دا حلمنا طول عمرنا<br />شقة تلمنا كلنا كلنا<br />محتاجة الشقة م قد م<br />علشان تقدر تتقدم<br />ومرتب تلاتين شهر<br />ما يجيب شبكة ولا مهر<br />والفقر بيلغى بنود<br />ويذل ك آخر الشهر<br />وهتفضل عمرك تشحت<br />طول مانت جوه ف مصر<br />دا حلمنا طول عمرنا<br />شقة تلمنا كلنا كلنا<br />خل ى الأمانى حقيقة<br />وافتح ف دفتر حساب<br />يمكن تجيب الدبلة<br />أو حتى عشوة كباب<br />جايز هييجى اليوم<br />والشقة تيجى إنما<br />هتكون سنانك وقعت<br />قربت على ميت سنة<br />دا حلمنا طول عمرنا<br />شقة تلمنا كلنا كلنا<br />الشجرة وكانت بذرة<br />والهجرة وكانت فكرة<br />ومسيرها هتيجى الفيزا<br />لأوروبا واللا أمريكا<br />نتمنى الهجرة تكون<br />وتخيب أى ظنون<br />ما كتير الفرصة بتيجي<br />وربك دايما ف العون<br />وما د مت ف بلدك هين<br />تبقى الغربة هتهون<br />دا حلمنا طول عمرنامنقووووووووووول"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218123814/http://masr.20at.com:80/newArticle.php?sid=19969"
