[[comments]]
order = 0
subject = "يا اختي كميله"
author = "خالتو دودو جارتكم"
posted = "2007-12-31"
text = "ياعيني يا اختي، انتم السابقون ونحن اللاحقون ايه ياهبه ياحبيبتي صعبتي علي والله وفكرت جديا نعمل جمعية كل واحد ياخد زيزو عنده يوم خصوصا انه اكيد مش هايعترض لانه حفظ اشكالنا وممكن ينام مع اي حد مع ترتيب موضوع الوجبات والذي منه<br />بجد زيزو ده سكر بيحسسني انه طفل كبير يعني رجل بس قصير حبتين يعني تلاقيه كده ملو هدومه وقاعد معانا وبيحضر الاجتماعات ولا على باله اي حد البيج بوس موجود زوار موجودين هو بيعمل اللي يحبه على طول<br />ربنا يخليه يارب ونشوفه عشريناتي كبير"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002253/http://masr.20at.com:80/newArticle.php?sid=13629"

[[comments]]
order = 1
subject = "زوزي بتاعنا كلنا"
author = "اكتب اسمك هنا"
posted = "2008-01-01"
text = "بصى بقى يا هبة بصراحة ميصحش كدة بتتكلمي على زوزي كما القبه على انه ابنك لوحدك رغم انك عارفة اننا نعيش معه نصف يومه تقريبا فهو موظف ملتزم بيجي كل يوم فى ميعادة و يقعد على الماشية او المكتب بتاعه و نفضل بقى نحميه من اكل المهملات التي يلقيها على الارض و نحميه اصابعه من ان يغلق عليها الدرج كما اعتاد ترجعى يا هوبه زوزي بتاعنا كلنا و اصبخحملكيه عامة و لا تنسي اننى اول من وضعت صورته على الصفحة الرئيسية و جعلته طفل مشهور خالتو روزا"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002253/http://masr.20at.com:80/newArticle.php?sid=13629"

[[comments]]
order = 2
subject = "مصوراتي الموقع"
author = "محمد فاروق"
posted = "2008-01-01"
text = "بكرة تكبر يا زيزو وتعرف ان عمك \"محمد فاروق\" أكتر واحد صورك في الدنيا وانت صغير بموبايله القديم 6600 أو الجديد 3250<br />حتى انهم سموني مصوراتي الموقع."
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002253/http://masr.20at.com:80/newArticle.php?sid=13629"

