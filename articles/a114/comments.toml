text = "تحية إلى الأخ محمد سالم و شكر على العقلانية و الهدوء .<br />أسجل رفضي و اعتراضي على من يشتم الصحابة و ألاحظ أنه ليس إلا واحداً في هذا المنتدى .<br />أما \" العلمانية \" نيفي نوفا التي تقول : حسن نصر الله يفعل حسناً و لكن ( \" ربما\" كانت نيته سيئة و هو شيعي خميني ) و بالتالي فهو شرير و فاسد و كل مايفعله سيء في الجوهر رغم أنه يبدو جيداً في الظاهر .<br />طيب ما رأيك في أنا يا أخت نيفين \"العلمانية\" حيث لا تعلمين عني أي فعل صالح و هذا بديهي لأنك لا تعرفينني حيث أنني لست شيعياً فقط بل \" أفظع \" من ذلك بكثير ! إنني علوي ! فما هو رأيك في بناء على منهجك العظيم في الحكم على الناس ؟؟ هل أنا شرير ؟ عديم الأخلاق ؟ فاسد ؟ أستحق الذبح مثلاً ....؟؟ أخبريني لأنه يبدو أنك تعرفين الناس أكثر من أنفسهم و تعلمين بما في الصدور ؟؟ و يستطيع الباري الاستعانة بك ليقيم مدى صلاح البشر .<br />طبعاً الكلام موجه إلى نيفين نيفي نوفا و لكنه إلى كل من يقول مقالها !"
