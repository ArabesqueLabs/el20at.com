subject = "رحمك الله يا سند المستضعفين"
author = "حجازي"
posted = "2008-02-18"
text = "أعزي صاحب العصر والزمان وعلماء الامة بشهادة المجاهد الصابر والمحتسب الشهيد الحاج رضوان (الحاج عماد مغنية) وأدعو الله أن يسكنه فسيح جناته.<br />وأقول كلمة لكل الاحرار : لم تزعزع نفوس المجاهدين والصابرين في يوما من الايام كلام يطلقه أصحابه بسبب موقف أو تجربه أو حادثة مر بها في يوم من الأيام أو أشياء أخرى، لأن المجاهد في سبيل الله تكون له صفات منها أنه يصبر في سوح الجهاد، ويعلو على كلام وهذيان أصحاب النفوس المريضة التي لا تعرف ما تقول ولا تسمع إلا ما يتناغم مع هذيانها ولا تبصر إلا ما هو حولها. فهم في جهاد ، والجهاد به بذل وعطاء وجهد. ولو أتيح لـ الحاج رضوان أن يرد عليهم لقال (هداهم الله وغفر لهم)<br />وأنا أربئ بنفسي أن أرد على مثل هؤلاء الاشخاص الذين لا بد منهم في كل زمان ومكان ( ليميز الخبيث من الطيب)، فالسلام على الشهيد (الحاج رضوان) يوم ولد ويوم استشهد ويوم يبعث حيا.<br />وآسف على التطويل"
