text = "هل تعرف البيت القائل وطنى كم من هرم مجدته لم يكن يحمل طهر الصنم<br />اتمنى اولا انى اكون متذكره البيت بشكل صحيح<br />و هذا ما قصدته يا استاذ محمد<br />قصدت اننا بنمجد اشخاص و رموز و بنعملف حواليها هاله من النور الزائف كما فى حاله هذا الشيعى و فى حاله حسن نصر الله الشيعى الخومينى و للاسف تاريخنا مليان بناس مجدناهم و هما لا شىء ف عداد التاريخ<br />دا كان فى رسالتى الاولى و رسالتى الثانيه لو مكنتش فهمتها قصدت بيها اعلق على الشخص الشيعى اللى علق قبلى و اللى بيلعن اشخاص لا يستحق شرف ان يمسح نعالهم<br />اتمنى تكون الرساله واضحه ليك بالتحديد المره دى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 85
subject = "أين الثري من الثريا"
author = "محمد سالم"
posted = "2008-03-01"
text = "أولا وفي البداية كالعادة من هذه النقاشات العبثية يبدو أنني مضطر إلي أن أؤكد إنني مسلم سني من أسرة سنية<br />وأصدقائي كلهم بالطبع من أهل السنة بل أن بعضهم بدون مبالغة لا يعرف الفرق بين الشيعة والشيوعيين ويعتقد أنهم شيء واحد<br />هذه المقدمة ضرورية لأني اعرف أن الاتهامات تكون جاهزة في مثل تلك الحالات وقد نلت نصيبا وافرا من الشتائم والسباب علي هذا الموقع لأني كتبت يوما ما أمنت به وما زلت أؤمن به من بغضي للطائفية المذهبية والتعصب لأفراد أو لأفكار<br />لكن الحق أولي أن نتبع ......أما عن تعليقك ياخت نيفين وان كان يحمل بعض الصحة في بعض جوانبه إلا انه كأغلب التعليقات في هذه الصفحة تعليق ذو صبغة طائفية<br />ومتي تدخلت الطائفية انتهي دور العقل الذي تحاولين إيهامنا انك تتحدثين باسمه من خلال أسلوبك<br />ولقد ذكرتي اسم الشهيد عماد مغنيه واسم الشيخ حسن نصر الله كمثاليين علي الأسماء التي صنع حولها هاله من انصارهما بدون داع كما تدعين<br />وأنا لن أناقش معك ما قدمه هذان الرجلان لدينهما وللأمة الإسلامية لأني متأكد انك لن تقتنعي مهما قلت<br />ولكني اذكر انك كنت تتباكين علي صدام حسين غفر الله له وربما إذا ذكر عبد الناصر أيضا ستذكرين لنا إنجازاته وتتباكين علي أيام الزمن الجميل كما يسميه المثقفين المصريين بل قولي المخبرين كما تكشف لنا الوثائق كل يوم<br />فكثير من الأسماء صنعت حولها هالات بالحق أو بالباطل<br />لكن هيهات أين الثري من الثريا<br />الحق واضح لمن يريد أن يراه . والشيخ المجاهد حسن نصر الله لا يحتاج إلي شهادة مني أو من غيري بل إن أعماله وتضحياته ويطولانه وصدقه وأمانته وشجاعته يتحدثون عنه<br />أما من يشتمون ويسبون صحابة رسول الله او يسبون ويشتمون المجاهدين من أمثال السيد حسن نصر الله فهؤلاء لا يستحقون عناء التفكير في الرد عليهم فالمسلم ليس بسبايا ولا لعانا<br />ونسال الله الهداية للجميع و أن يقي امتنا شر الفتن ما ظهر منها وما خفي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 86
subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
posted = "2008-03-03"
text = "اولا يا استاذ محمد انا اذكر فعلا اننا اتكلمنا قبل كده من خلال الموقع بس مش متذكره امتى بس يمكن فعلا يكون ف موضوع صدام<br />و خلينى ابدا معاك من البدايه لان رسالتك حيرتنى جدا<br />المفروض انك قديم ف الموقع طيب ازاى بتتهمنى بالصبغه الطائفيه<br />اكيد بقى حضرتك متاببعتش كل تعليقاتى او تركت الموقع لفتره لانى فعلا مش ده اسلوبى خالص وم يمكن الاشخاصض القديمه و المحررين ف عشرينات يعرفو عنى كده<br />انا دايما بنحى الدين و الطائفه جانبا و بحاول اكون موضوعيه و حياديه بس اسمحللى فيه مواضيع مينفعش تحيد مشاعرك فيها<br />يعنى لما يكون شخص شيعى خومينى و بيعمل اعمال جليله يبقى نقف عنده شويه<br />يعنى ايه الاعمال الجليله اللى بيقدمها نصر الله للامه و هو مخالف لدين الام و صلب عقيدتها<br />ما بنى على خطا فهو خطا<br />و مع ذللك اقدر تحديه لليهود و لاعداء الامه و شكرنا ليه اعماله بس مش معنى كده اننا نجله و نقدسه و نحط صورته ف عربياتنا و اوضنا زى ما بشوف<br />مهما عمل ف الاول و ف الاخر شيعى خومينى<br />و بكرر خومينى و حط تحت خومينى مليون خط<br />و الخومينيه انه كنت لا تعرف هى اشد طوائف الشيعيه كرها للرسول<br />و مع ذللك علماء اجلاء كثيرون شككو ف نوايا نصر الله و يمكن نكون ةمخدوعين فى ماربه و لكن هذا بين نصر الله و ربه و لن اتدخل فيه"
archived = "2010-03-14"
