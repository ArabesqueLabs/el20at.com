subject = "الله يلعن الشيعه على العلمانيين على ابكره على انها"
author = "نيفين نيفى نوفا"
posted = "2008-03-06"
text = "لما قرات الكل كليله دى افتكرت فيلم الانسان يعيش مره واحده<br />فى كلمه كنت متعوده اقولها لابن بهيه لما كنا بنوصل بالحديث لباب مقفول زى ما انا وصلت معاك كده يا استاذ محمد و هى الاختلاف ف الراى لا يفسد للود قضيه<br />بس فيما يتعلق بان الرجال بافعالهم دى فيها شك و اذا كنت بتجل القرضاوى ارجع ليه فيما كتبه عن الرجال اللى بافعالهم امثال نصر الله و شوف قال بخصوصه ايه لان انا شايفه انه اذا فست العقيده فسد كل شىء<br />اما بقى بالنسبه لحكايه ان عبد الله مفتاح هيزعل فبقوللك اطمن لان عبد الله مفتاح مش سلفى و اساله لو كنت على اتصال بيه وده عكس ما ناس كتير فاهمه<br />مش كده و لا ايه يا عبد الله<br />اتمنى تدخل و توضح موقفك<br />الناس كلها فاكراك سلفى<br />عموما يا استاذ محمد سعدت بالتحاور معك<br />و لننتظر جميعا الفرز القدم"
