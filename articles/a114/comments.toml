[[comments]]
order = 94
subject = "إلى الكويتي الحمار عدو الإسلام"
author = "الفلوجه"
posted = "2008-03-06"
text = "يا حمار اقرأ هذا التقرير<br />الشهيد مغنية وطائرة الجابرية : إفتراءات يهودية بألسن عربية.... ظلموك يا شهيد المقاومة<br />من اطلع على حيثيات اختطاف طائرة الجابرية التي يتهم بها 'الشهيد المجاهد الحاج عماد مغنية' يدرك أن دليل الإتهام الموجه إلى الشهيد الكبير يتمثل في تعرف بعض الركاب عليه من خلال صورة شخصية له.<br />الغريب في الأمر هو المعلومة المعروفة والتي تؤكدها وسائل الإعلام المختلفة اليوم أن الموساد والمخابرات الأمريكية لم يحيطا بشيء عن شكل الشهيد سوى من خلال صورتين مختلفتين - وربما أكثر - لا يعلمون أي واحدة منهما هي الصورة الحقيقية لعماد مغنية.<br />فكيف اطلعت وتأكدت الأجهزة الامنية الكويتية حينها من كون مغنية هو الخاطف القاتل من خلال صورة غير مؤكدة له ..؟!<br />إن هي إلا ظنون لا ترتقي إلى مستوى اليقين ..؟!<br />أدلة أخرى على براءة الشهيد العظيم عماد مغنية من خطف طائرة الجابرية :<br />2 - توسط معمر القذافي.<br />من المعلوم والمشهور موقف حزب الله من معمر القذافي المتهم بخطف السيد الهمام موسى الصدر أعلى الله مقامه ، وتوتر علاقة الطرفين شائع ذائع ، فكيف يتوسط القذافي لخصومه وأعدائه ..؟!<br />3 - المطالبة بإلياس صعب.<br />إلياس صعب ليس عضواً في حزب الله هو والآخرين اللذين قد طالب الخاطفون بتحريرهم من سجنهم في الكويت ، بل حسب ما تجود به ذاكرتي هم أعضاء في منظمة التحرير ، ولذلك توسط لهم ياسر عرفات الذي دخل الطائرة حسبما أفاده مساعد الطيار العازمي في مقابلة سأعرضها حالما أتمكن من ذلك.<br />4 - لم تتهم الكويت عماد مغنية بتهمة اختطاف الجابرية ، وما قاله جابر الخالد وزير الداخلية اليوم لا يغير من هذه الحقيقة شيئاً ، فلماذا انتظرت الحكومة 20 عاماً لاتهامه وبالتحديد بعد استشهاده ..؟!<br />5 - الدليل الذي ذكرناه في أول الموضوع وهو عدم تأكد أعتى الجهات الإستخبارية في العالم من تحديد شكل وصورة عماد مغنية ، فكيف أمكن للأجهزة الأمنية الكويتية ذلك ..؟!<br />في كتاب ( أشهر الجرائم السياسية في للكويت ) للمؤلفين المحامي نجيب الوقيان والصحافي صباح الشمري وفي فصل اختطاف الجابرية يقول المؤلفان ص 284 :<br />ولقد اختفى هؤلاء الرجال دون أن يتم الكشف عن هوياتهم وجنسياتهم .. وهكذا فقد أسدل الستار على أطول عملية اختطاف بعد مرور ستة عشر يوماً منها ثلاثة أيام في مشهد وخمسة أيام في لارنكا وثمانية في الجزائر ..'<br />ولم يأتِ المؤلفان على أي ذكر للشهيد عماد مغنية سوى أنه في اليوم العاشر من اختطاف الطائرة ترددت أنباء مفادها أن زوجة عماد مغنية هي شقيقة خبير المتفجرات 'إلياس صعب' .. أي أن الأمر برمته لا يعدو كونه بضعة إشاعات هنا وهناك ..!!<br />دليل آخر :<br />قبل الخوض في هذا الدليل ينبغي الإلتفات إلى كون المجموعة التي اختطفت طائرة الجابرية قد تكون هي نفسها التي اختطف قبل أربع سنوات - أي 1984 - طائرة 'كاظمة' ويدل على ذلك أمران :<br />- مطالب الخاطفين في العمليتين كانت مشتركة وواحدة وهي تحرير إلياس صعب وستة عشرة آخرين من جماعته من سجون اكويت.<br />- زعم المضيف المصري الذي عاصر الإختطافين أنه شاهد نفس الرجل - قائد المجموعة - في كلتا العمليتين ، وإن كان كلامه محل شك كبير فربما أثرت الضربة التي ضربوها على رأسه في ذاكرته والله أعلم ..!!<br />هذا مع التنبيه إلى أن خاطفي الجابرية في لقاء صحفي في الجزائر قبل إخلائهم الطائرة أخبروا الصحافيين بأن لا علاقة لهم بخطف طائرة كاظمة.<br />6 - مضايقات السلطات الإيرانية لخاطفي الطائرة 'الجابرية'<br />لا أريد البدء في المضايقات التي تعرض لها خاطفو طائرة كاظمة في إيران ولكن سأبدأ بهذا الإقتباس من كتاب ( أشهر الجرائم السياسية في الكويت ) حيث ذكر المؤلفان فيما يتعلق بأول أيام الطائرة الجابرية في مطار مشهد ص 362 :<br />' وهبطت الطائرة وحطت وسط المطار .. واعتقد الركاب في بداية الأمر أنها حطت في مطار الكويت. وتم إغلاق المطار أمام عمليات الطيران ، وأخذ بعض القناصة مواقعهم حول الطائرة'<br />يقول المؤلفان فيما يخص اليوم الثالث من اختطاف الجابرية في ص 265 :<br />' وهدد الخاطفون بجعل الركاب الكويتيين يدفعون ثمناً غالياً إذا لم تلبَ مطالبهم ، وأنهم سيعتبرونهم أسرى سياسيين وطالبوا بإزالة الحواجز من ممر الهبوط ، وذلك تيسيراً للإقلاع ، مشيرين إلى أن السلطات الإيرانية تحاول كسب الوقت ، معلنين أن أساليب المماطلة ستشير إلى تواطؤ إيراني مع الكويت ، وأن إطلاقهم سراح بعض الركاب ليس ضعفاً وإنما علامة لحسن النوايا'<br />أما فيما يتعلق بالطائرة 'كاظمة' فقد جاء في نفس الكتاب الوثائقي ما يلي :<br />- في بداية دخول طائرة كاظمة الأجواء الإيرانية تصدت لهما مقاتلتان إيرانيتان من نوع فانتوم لمنعها من التوغل ، إلا أن طلب قائد الطائرة السماح لهم بالهبوط للتزود من الوقود الذي أعلن نفاده من الطائرة فسمحوا للطائرة بالهبوط في مطار مهرباد بطهران.<br />في اليوم الخامس طالب الخاطفون تزويد الطائرة بالوقود ، وإعادة شحن بطاريتها ، إلا أن المفاوضين الإيرانيين رفضوا تزويد الطائرة بالوقود ووافقوا على شحن البطاريات.<br />- في اليوم السادس تم اقتحام الطائرة واعتقال الخاطفين وقد ثمنت الكويت هذا العمل العسكري وشكرت إيران عليه.<br />يقول مساعد الطيارفي الطائرة كاظمة ص 189 :<br />' .... وكان الإيرانيون يماطلون في تنفيذ طلباتنا ولم يزودونا بالوقود لكي لا نقلع ، وكان الخاطفون في خوف من أن يقدم الإيرانيون على اقتحام الطائرة ...'<br />ومن المعلوم يقيناً أن 'عماد مغنية' أحد قيادات حزب الله المتحالف بإيران منذ تأسيسه فكيف يتعرضون لمثل هذه المضايقات وبهذا الشكل الذي يخيفهم من الإيرانيين ..؟!<br />واكبر دليل على عدم تورط الشهيد ان الطائرة بعد تحريرها من الخاطفين في الجزائر لم يتم تسليمهم من اجل محاكمتهم والتعرف اكثر على حيثيات عملية الاختطاف ولم يتم حتى الكشف عن وجوههم للملأ اضف الى ذلك الى ان الشهيد متهم بتفجير السفارة الفرنسية ايضا وهنا يجب ان لانغفل عن مدى قوة العلاقة بين فرنسا والجزائر فهل تقبل فرنسا باطلاق سراحة كي يعود لمحاربة اسرائيل !!!؟؟<br />وبشأن تفجيرات موكب الأمير الراحل الشيخ جابر الأحمد الصباح رحمه الله :<br />الكل يتذكر من آبائنا في بادئ الأمر إلى أين توجهت أصابع الإتهام وكلها كانت تشير إلى حزب الدعوة<br />وبعدما حدث الغزو الصدامي الغاشم على الكويت خرج ولي عهد الكويت حفظه الله و رعاه الشيخ سعد العبدالله الصباح<br />في بيان صرح فيه بأنّ من أستهدف موكب الأمير كان صدام و أتباعه الصداميون .<br />فلم أنتظر الكل كل هذه المدة ليصرحو بهذه التصريحات التي لا دليل عليها بعد 30 عاماً و بالخصوص بعد إستشهاد هذا البطل الضرغام ؟.!!!<br />كل هذه التصريحات كانت تستهدف التفرقة بالوحدة الوطنية الكويتية أولاً و تستهدف إشعال الكره و البغض لحزب الله ثانياً .<br />أعزائي الكرام .. سماحة السيد نصرالله لمّح في خطاب بالأمس القريب إلى موضوع الإفتراءات ضد الشهيد السعيد 'رضوان الله وسلام الله عليه'<br />وقال :<br />((( الحاج عماد مغنية من القادة الذين كان جهادهم وسهرهم وتعبهم وحياتهم كلها صدقة سر مع الله تعالى، هؤلاء جنود الله المجهولون في الأرض ، المعروفون في السماء، لا يدافعون عن أنفسهم، يدافعون عن الأمة والوطن قضايا والحق ولا ينتظرون مديحاً لأنهم مجهولون ولا يردون تهمة ظالم او كاذب أو مدع ٍ ، لانهم مستورون ، ولا يدافعون عن أنفسهم لأنهم لا يرون لأنفسهم وجوداً خارج معركة الجهاد والعطاء والتضحية. أما بعد شهادة هؤلاء فحقهم علينا جميعاً أن ننصفهم، ان نكشف للعالم وجوههم المنيرة وحقائقهم الصافية، وعطاءاتهم العظيمة.<br />اليوم ، حق الحاج عماد مغنية الشهيد على هذه الأمة أن تعرفه من اجلها لا من اجله، وحقه على الأمة ان تنصفه من اجلها لا من اجله، وحقه على الأمة أن تستلهم روحه ودرسه وجهاده من اجلها لا من اجله.<br />فرضوان اليوم، في رضوان الله وكل ما قد يقال عنه في دار الدنيا من ثناء أو مديح هو جزء من الدنيا الفانية التي لا تساوي شيئاً في حسابات أهل الآخرة الواصلين.)))<br />مغنية : البطل الذي أبكى جنرالات العدو<br />استشهد البطل العبقري والقائد الذي هزم أعتى جيش في العالم خلال حرب تموز عام 2006 في لبنان وأبكى جنرالات الکيان الصهيوني ، الشهيد الخالد عماد مغنية خلال عملية جبانة شارك فيها الموساد والـ (سي اي ايه) واستخبارات بعض الدول العربية العميلة لاميرکا.<br />وکان البطل الشهيد من عباقرة العمليات التي نفذت ضد الکيان الصهيوني طيلة اکثر من عقدين من الزمن ولقن العدو درسا عجزت عنه کل جنرالات العرب وجيوشها المهزومة دائما، بحيث کان اسمه يرعب جنرالات البنتاغون الاميرکي واسرائيل معا.<br />استشهد الشهيد البطل عماد مغنية ولا عجب ان يستشهد هذا الانسان العبقري وهو الذي كان مطاردا طيلة عشرين عاما من قبل اجهزة الاستخبارات الاميرکية والموساد وبعض الدول العربية القذرة وشاءت ارادة الله ان يکافئ هذا البطل المناضل بالشهادة ويجعله ضمن شهداء بدر وحنين.<br />کان الشهيد عماد مغنية في ريعان الشباب عندما اختار طريق الموت الزؤام والشهادة في سبيل الله واقسم ان يهب حياته لنصرة المستضعفين والشعب الفلسطيني المظلوم.<br />وهذا الشهيد الذي قد کافح من اجل صد اعتداءات الکيان الصهوني ضد الشعبين اللبناني والفلسطيني کان يعتبر النضال ضد اعداء الامة هدفا ساميا وسار على هذا النهج المقدس حتى نال شرف الشهادة.<br />وخلافا لما يدعي به الاعلام الغربي والعربي فان الشهيد مغنية رغم سمعته التي ارهبت الاعداء کان انسانا في غاية الرقة والعاطفة ويتميز بنكران الذات ، يبکي حينما يرى جثة طفل فلسطيني شهيد وفي نفس الوقت يصول صولة الفرسان على الوحدات الصهيونية في جنوب لبنان ويفتك بجنودها.<br />لم يقتل الشهيد البطل عماد مغنية اي انسان بريء مهما کانت جنسيته ولونه ولکنه کان يتربص باعداء الامة ويختار الزمان والمکان المناسبين ليوجه اقسى الضربات ضد هؤلاء الاعداء.<br />عماد مغنية کان عَلـَـما ً بارزا من اعلام هذه الامة دخل التاريخ من اوسع أبوابه وحطم أسطورة العدو الصهيوني وسجل انتصارات عسکرية باهرة وطوى صفحة سوداء من صفحات تاريخ هزائم الجيوش العربية امام جيش الکيان الصهيوني.<br />کان عماد مغنية الشبح الذي أدخل الرعب في نفوس جنرالات اميرکا واسرائيل والعبقري الذي يخطط بامکانيات محدودة ليفتك بجيش الکيان الصهيوني وخير دليل على ذلك ملحمة تموز الخالدة التي غيرت موازين القوى لصالح الشعوب المسلمة في المنطقة.<br />لقد رحل مغنية في غفلة من الزمن وبغدر من الاستخبارات الاميرکية والصهونية وبعض استخبارات الدول العربية التي من الاسف اصبحت تعمل الى جنب اجهزة استخبارات العدو لقتل خيرة شباب هذه الامة.<br />الشهيد عماد مغنية لم يکن شهيد حزب الله فحسب بل کان شهيد کل الشعوب الحرة والمناضلة حيث کان بمثابة حمزة بن عبد المطلب للامة الاسلامية.<br />کان الشهيد عماد مغنية حينما يذهب الى ساحات القتال في الجنوب يبث الامل في نفوس مقاتلي المقاومة الاسلامية ويقهر العدو مستخدما عبقريته العسکرية وکان يجتهد ويصيب."
