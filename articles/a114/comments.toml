author = "أبو مصطفى"
posted = "2008-02-13"
text = "سلام من الله عليك يا أبا مصطفى \"يرويدون أن يطفئوا نور الله بأفواههم والله متم نوره ولو كره المشركون \"<br />عشت أسداً أين منك الأسود يا حاج رضوان وزلزلت الصهاينة ومن ورائهم الاميركيين ببأسك ورحلت شهيدا غاليا عزيزا والتحقت بركب اخوانك الشهداء<br />لم يعرفك المقربون المقربون ولم يرك إلا القليل القليل فكيف هؤلاء السفهاء يكتبون ما يكتبون فهم لا يعلمون قدرك وجهلوا أمرك ولا يعرفوا من أنت قرؤا بعض الصحف فقاموا يحللون ويكتبون أين كانوا البارحة قبل الإستشهاد قالوا لهم اكتبوا فكتبوا فهم لا يعرفون ما يكتبون ولا ما يقولون هم وأسيادهم من رأى الحاج رضوان ؟ من عرفه ؟ من تكلم معه ؟<br />لا من يعرف صوته؟ فليأتونا بصوته إن كانوا على ما يدعون وينشرون يعلمون هنيئاً لك يا حاج عماد بالشهادة فغنه لا ينالها إلا ذو حظ عظيم وأعظم الله أجورنا وأجوركم"
