text = "والله إنها دنيا عجيبة غريبة .. بمجرد سماع خبر استشهاد هذا المدعو بمغينة .. دبّ ت في أنفسكم النخوة والشهامة .. وقمتم من أماكنكم كالكلاب المسعورة السكرانه .. او بالأحرى كالشخص الذي تصيبه صاعقة وتصعقه بعد سبا عميق!!!<br />والله لو كان هناك واحدٌ من الناس الذين علقوا من قبلي على موضوعه، ولو كانوا يملكون شيئاً عظيماً كبيراً ضخماً .. وهو بحد ذاته نعمة لاتعوض إطلاقاً !!! ياعالم ! ياناس ! هنالك ملايين من الناس يموتون ويستشهدون في سبيل الله تعالى وابتغاء مرضاته .. هنالك أناسٌ ضحوا بالغالي والنفيس .. هنالك أناس ٌ قدموا أرواحهم فداءً للوطن ولأمة جمعاء .. هنالك أناسٌ لو يعرفوا طعماً للسعادة في حياتهم .. هنالك أناس متزوجون ولهم أولاد . لم يروهم في حياتهم !!!!!!!!!!<br />ماذا تقولون أنتم ؟؟؟ إلى ماذا ترمون ؟؟؟ ماذا تقصدون ؟؟؟ ماذا تعنون ؟؟؟ عماد .. عماد .. عماد .. عماد !!!<br />والله أصبح بالنسبة لكم إلهاً تعبدونه من دون الحق ّ عز وجل .. والله لو سنحت لكم الفرصة وحالفكم الحظ بإنه لم يستشهد .. لكنتم لهثتم وسارعتم وركضتم وراءه تلهثون من رواءه كالكلاب الجائعة التي لم تأكل منذ قترة طويلة !!<br />لكنتم سجدتم وخرّيتم تحت قدمه وتطلبون منه السماح والغفران والتوبه وكإنه إلهاً باقٍ أو حتى سرمداً خالداً باقياً !!<br />زمن وكما يقولون ( أغبــــــــــــــــــــــــــــــــــــر ) ولكن !!! تبقى للحق الكلمة .. وسوف يأتي يوماً ما .. وسيعرف العالم والناس أجمعين .. بأننا أسيادٌ لاعبيدٌ .. وكل يوم يولد لنا شهيد .. وهذا العالم بطوله وعرضه .. بشماله وجنوبه .. لايساوي قطره أو ذرة أو حبة أو جزء أو .. أو .. أو من دماء الشهداء الأبرار الذي هم الآن في الفردوس الأعلى .. الذين هم في عليين .. وما أدراكم ماعليين ؟؟!! شهدائنا قاداتنا .. ورحم الله شهداء فلسطين فرداً فرداً .. لا على التعيين<br />اختتم قولي ببيت شعر .. الذي هو بالأساس لا فائدة منه الآن _ أقصد في وقتنا الحاضر _ .. حيث قال الشاعر :-<br />أجبني هل يفيق الشرق حقاً ********************* وينهض بعد أن أغفا وناما !!! هيهات أن يفيق ؟؟؟<br />لا أتوقـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــع بالمطلق !!!ّ"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 62
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-02-18"
text = "العزاء لكل الأحرار باستشهاد الثعلب البطل الشهيد السعيد الحاج رضوان<br />هناك فئة من العرب والمسلمين أعمى الله قلوبها عن الحقيقة وهي غير قادرة على مجرد التفكير في بطولة عماد وأمثال عماد من ابطال هذه الأمة<br />ولكن أنا أكتب تعليقي هنا لأذكر لكم أطرف ما سمعت من تعليقات في المواقع العربية \" العبرية التوجه \" بعد استشهاد القائد الكبير :<br />أحدهم كتب : وما يدريكم أن من مات هو عماد مغنية ؟ هل قام شخص فتح التابوت وتأكد ؟ إنها مسرحية يقوم بها حزب الله لإبعاد الأضواء عن هذا المجرم !!!!!!!!!!!!!!!!!!!!!!!!!!! وتصوير أنه قتل<br />أخر كتب وذكرني بالفيلم الهندي الذي أخرجته نفس العقلية بعد اعتقال واعدام صدام عندما أنكروا ان يكون من شاهدناه هو صدام وأخذو بسرد الأدلة \" القاطعة \" على ذلك .<br />إنه الجهل بثقافة المقاومة التي تعتبر دماء شهدائها أغلى ما تملك .<br />الكثيرون بدأو بسرد الأتهامات بالقتل والجرائم وكأنهم حاكموا الشهيد وأدانوه بالأدلة وكل ما تشدقت به أفواههم هي اتهامات رخيصة للموساد والمخابرات الأمريكية ,فمن كان يعرف عماد أصلا ليتهمه ؟<br />سئل عميل من CIA عن عماد وكان مكلفا ضمن فريق عمل للبحث والتقصي ثم القبض على الشهيد البطل فقال :<br />حتى لو كان يجلس بيجانبنا وتحدث معنا فلن نعتقله لأننا لا نعرف شكله ولا نعرف عنه شيئا على الأطلاق فهم فعلا كانو يبحثون عن شبح وسراب وهذه أسطورة نكران الذات عند هذا المجاهد القائد التي وصلت به أن ينكر ذاته لعشرات السنوات في خدمة قضيته .<br />إلى جنات الرضوان يا رضوان , أنت الشمس المضيئة في هذا الزمن المظلم وعلى دربك سائرون وسيعلم الذين ظلموا أي منقلب ينقلبون والسلام<br />1-"
