author = "ملوش لزمه بأه"
posted = "2008-05-07"
text = "أرسل هذا التعليق بواسطة : محمد نواف الحمدالله ...<br />والله إنها دنيا عجيبة غريبة .. بمجرد سماع خبر استشهاد هذا المدعو بمغينة .. دبّ ت في أنفسكم النخوة والشهامة .. وقمتم من أماكنكم كالكلاب المسعورة السكرانه .. او بالأحرى كالشخص الذي تصيبه صاعقة وتصعقه بعد سبا عميق!!!<br />والله لو كان هناك واحدٌ من الناس الذين علقوا من قبلي على موضوعه، ولو كانوا يملكون شيئاً عظيماً كبيراً ضخماً .. وهو بحد ذاته نعمة لاتعوض إطلاقاً !!! ياعالم ! ياناس ! هنالك ملايين من الناس يموتون ويستشهدون في سبيل الله تعالى وابتغاء مرضاته .. هنالك أناسٌ ضحوا بالغالي والنفيس .. هنالك أناس ٌ قدموا أرواحهم فداءً للوطن ولأمة جمعاء .. هنالك أناسٌ لو يعرفوا طعماً للسعادة في حياتهم .. هنالك أناس متزوجون ولهم أولاد . لم يروهم في حياتهم !!!!!!!!!!<br />ماذا تقولون أنتم ؟؟؟ إلى ماذا ترمون ؟؟؟ ماذا تقصدون ؟؟؟ ماذا تعنون ؟؟؟ عماد .. عماد .. عماد .. عماد !!!<br />والله أصبح بالنسبة لكم إلهاً تعبدونه من دون الحق ّ عز وجل .. والله لو سنحت لكم الفرصة وحالفكم الحظ بإنه لم يستشهد .. لكنتم لهثتم وسارعتم وركضتم وراءه تلهثون من رواءه كالكلاب الجائعة التي لم تأكل منذ قترة طويلة !!<br />لكنتم سجدتم وخرّيتم تحت قدمه وتطلبون منه السماح والغفران والتوبه وكإنه إلهاً باقٍ أو حتى سرمداً خالداً باقياً !!<br />زمن وكما يقولون ( أغبــــــــــــــــــــــــــــــــــــر ) ولكن !!! تبقى للحق الكلمة .. وسوف يأتي يوماً ما .. وسيعرف العالم والناس أجمعين .. بأننا أسيادٌ لاعبيدٌ .. وكل يوم يولد لنا شهيد .. وهذا العالم بطوله وعرضه .. بشماله وجنوبه .. لايساوي قطره أو ذرة أو حبة أو جزء أو .. أو .. أو من دماء الشهداء الأبرار الذي هم الآن في الفردوس الأعلى .. الذين هم في عليين .. وما أدراكم ماعليين ؟؟!! شهدائنا قاداتنا .. ورحم الله شهداء فلسطين فرداً فرداً .. لا على التعيين<br />اختتم قولي ببيت شعر .. الذي هو بالأساس لا فائدة منه الآن _ أقصد في وقتنا الحاضر _ .. حيث قال الشاعر :-<br />أجبني هل يفيق الشرق حقاً ********************* وينهض بعد أن أغفا وناما !!! هيهات أن يفيق ؟؟؟<br />لا أتوقـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــع بالمطلق !!!ّ"
