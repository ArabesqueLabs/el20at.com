text = "رحمك الله يا عماد يا شهيد هذه الأمة , ولن يبغضك أحد يا عماد إلا من جَهُل نسبه ولم يُعرف أيُّ رجل أباه ..<br />لن يبغضك يا عماد إلا المنافقون وأبناء الحيضة... لن يبغضك يا عماد إلا الذين يعيشون بألف وجه هم المؤمنون أمام الآخرين والسكارى في أنصاف الليالي هم المؤدبون أمام الناس ومعدومي الأدب والتربية أمام شيطانيهم وشهواتهم هؤلاء من سيبغضك لأنهم يعرفون منزلتك الرفيعة عند الله ويعرفون بأن مآلهم الدرك الأسفل من النار هم مع كبيرهم الذي علمهم السحر ..ألف معذرة يا عماد ولك من كل محبيك فن أصقاع هذه الأرض المعمورة ألف تحية وسلام لروحك الطاهرة وليبق اسم الله عاليا رغم أنوف المنافقين ..."
