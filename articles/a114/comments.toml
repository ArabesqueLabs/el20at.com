text = "هنا أسجل التهنئة لكل الإنسانيين على نفوق هذا الحيوان الوحشي ..<br />صارت ( الشهادة في سبيل الله ) مثل ( شهادة بعض الجامعات ) ..<br />كلاهما ( مزوّر وضحك على الذقون ) ..!!<br />أليس عماد مغنية هو من قام بنقل سلاح فتح إلى حركة أمل و حزب الله .. بعد مغادرة فتح والفلسطينيين بيروت عام 1982 .. وهو نفس السلاح الذي استخدمته أمل وحلفاءها لاحقاً في تصفية ما تبقى من مدنيين فلسطينيين في المخيّمات ؟<br />مجرم إرهابي زال .. والبقية سيأتيهم الموت<br />لا عزاء في هؤلاء<br />عليه لعائن الله تترى بكل نقطة دم بريئة أزهقها من غير ذنب<br />التهنئة لكل الأحرار والانسانيين ولا عزاء لعباد الكهنة والارهابيين .."
