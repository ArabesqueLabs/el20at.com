subject = "لشاتمي الشهداء !"
author = "m4r"
posted = "2008-02-14"
text = "من يشتمون الشهداء هم قلة تافهة لو تفكروا (و ذلك مستحيل ) بعقول لم يشأ الباري أن يمنحهم إياها :و نظروا إلى ذواتهم و ماذا يفعلون !<br />لوجدوا أنهم جبلوا على الكره و الحقد و الضغائن و العصبيات و أنهم لا يتقنون شيئاً إلا الشتائم و التكفير اللذان برعا فيهما دوماً و لم يفعلا غيرهما.<br />و عندما يتكلم دم المجاهدين الذين يؤدون واجبهم و يسعون للشرف الرفيع صامتين متواضعين فليخرس أمثال هؤلاء الشتامين الحاقدين لأن حديثهم زعيق نشز قميء أشبه بنفوسهم المريضة الطائفية الجاهلة الذليلة الممتطاة بالخزعبلات و الأضاليل و آمال الحكام و نزواتهم منذ فجر التاريخ .<br />و أنا حقيقة و صادقاً لا أعرف مذهب الشهيد و لم أسأل عنه و لم يذكر أمامي على التلفاز ، فإن كان سنياً فطوبى له من سني أبي كريم و إن كان شيعياً فطوبى له من شيعي حر عزيز و إن كان غيرهما فطيب الله ثراه الطاهر .<br />و ما الدين إلا فعل كريم و خير في اليد و اللسان و ليس قعوداً و كسلاً و شر في القول و الفعل ."
