[[comments]]
order = 90
subject = "الفرز قادم وسيتبين االخبيث من الطيب"
author = "محمد سالم"
posted = "2008-03-06"
text = "**مهما عمل ف الاول و ف الاخر شيعى خومينى<br />و بكرر خومينى و حط تحت خومينى مليون خط **<br />طيب اذا مكنش الكلام اللي فوق ده تعليق طائفي يبقي اسمه ايه<br />انت كل مشكلتك مع الراجل انه شيعي واما حكاية خوميني فمش فاهم قصدك ايه<br />الخومينية مش مذهب ديني ده مصطلح كثر استخدامه في وسائل الاعلام العربية اثناء فترة الحرب العراقية الايرانية وهو مصطلح سياسي مش ديني<br />شيعة ايران وشيعة لبنان اغلبهم من الطافة الاثني عشرية ومن الاخر محدش بيكفرهم الا السلفيين<br />مع العلم ان السلفيين مش عاجبهم العجب رغم ان الكلام ده هيزعل عبدالله مفتاح بس هي دي الحقيقه<br />الاخوان والصوفيه والعلمانيين والكل كليله بالنسبه لهم ناس ضلت الطريق يعني مجتش علي الشيعه بس<br />اما العلماء الثقات من امثال الشيخ يوسف القرضاوي تقدري ترجعي لكلامه عن مذهب الاثنا عشرية الشيعي<br />اما عن حكاية السب التي ذكرتيها فلا يفعلها الا السفهاء والمتطرفين من الجانب الاخر الشيعي كما يوجد عندنا متطرفون<br />والشيخ الشيعي محمد حسين فضل الله له فتاوي مشهورة بخصوص هذا الكلام<br />وانا بتابع قناة المنار وتصريحات قادة حزب الله وعمر ما ورد في كلامهم أي اساءة للصحابة رضي الله عنهم ولا يمكن تلفزيون المنار يعرض حاجه زي كده<br />وبعدين دول ناس منشغلين باهداف اكبر ويقدمون الشهداء كل يوم ومش فاضيين للشتائم<br />اما أي انسان سفيه او متطرف فهو يمثل نفسه ولا ينبغي ان نحاكم الملايين علي كلامه<br />وبعدين سيبك من الكلام اللي فات **** العبرة بافعال الرجال وليس باقوالهم ** العبرة بما يقدموه من تضحيات *** العبرة بصدقهم وشجاعتهم واصرارهم ووضوح الرؤية والهدف<br />والايام القادمة بما تحمله من احداث ستجعل الامور اكثر وضوحا لكل من انخدع من الشعارات الطائفية<br />الفرز قادم * * وسيتبين الخبيث من الطيب والمزيف من الاصيل"
archived = "2010-03-14"
capture_url = ""

