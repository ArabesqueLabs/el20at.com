text = "يقول الله تعالي<br />{يَا أَيُّهَا الَذِينَ آمَنُوا اتَّقُوا اللَّهَ وقُولُوا قَوْلاً سَدِيداً}<br />{لا يُحِبُّ اللَّهُ الجَهْرَ بِالسُّوءِ مِنَ القَوْلِ إلاَّ مَن ظُلِمَ<br />{ولا تَسُبُّوا الَذِينَ يَدْعُونَ مِن دُونِ اللَّهِ فَيَسُبُّوا اللَّهَ عَدْواً بِغَيْرِ عِلْمٍ}..<br />ويقول الرسول صلي الله عليه وسلم<br />المسلم ليس بالسباب او الفحاش او اللعان"
