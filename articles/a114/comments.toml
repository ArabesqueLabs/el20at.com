text = "اولا لن انزل الى مستوى الذين قالو ما قالو بالشهيد الحاج رضوان لانهم وبكل بساطة اقول لهم والله شهيدعلى كلامي اننا سوف نبقى على عهدنا ووعدنابازالة اسرائيل وامثال الذين تطاولوا على الحخ رضوان وسنلتقي بهم و سنقطع رؤوسهم لان الظهور و الله اعلم قريب ,قريب ,قريب وعهدا علي ان ابقاني من الاحياء او اخرجني من قبري ماتزرا كفني وشاهرا سيفي انا وان أذن لي ان اقطع رؤوس الذين كفروا واستباحوا حقنا واقول لهم ان الحاج رضوان هو اكبر \"والله اكبر من الجميع\" من اي خائن مثلكم انتم الذين حميتم اليهود اسأل الله عز و جل ان يحشركم مع اليهود في قعر جهنم ورحم الله الحاج المجاهد رضوان وحشرنا معهم في فسيح الجنان مع فاطمة و ابيها و بعلها و بنيها والسر المستودع فيها \"عليهم السلام\" السلام عليكم"
