subject = "إلى فأر المجاري المذعور الأول !"
author = "m4r"
posted = "2008-02-14"
text = "و ما تقول في أسامة بن لادن أيها النجس القذر أليس قاتل نساء و أطفال إن كنت تكره ذلك أصلاً !<br />عماد مغنية يا رعديد يا جبان نازل اسرائيل التي تدوس على رقبتك و رقبة حكامك و هزمها و أذلها و أذلك معها يا مركوبها و مركوب حاميتها الأميريكية ، عماد مغنية يا رعديد يا جبان قضى حياته في النضال و الجهاد دفاعاً عن بلده و أمته و توفي شاباً شهيداً و لم يمت على فراشه ، عماد مغنية يا ناقة الولايات المتحدة استمر بالمقاومة حتى آخر لحظة و آخر جهاده كان في حرب تموز و إعداده تجهيز المجاهدين بعدها ليعودوا أفضل مما كانوا ، عماد مغنية كان مطارداً من عدة أجهزة مخابرات و في مقدمها الموساد و السي آي إي لمدة طويلة جداً و هو كان يعمل تحت كل هذا الضغط و الإرهاب (( طبعاً سيطاردونه لأنه أذلهم و أعياهم و انتصر عليهم فهل يعقل أن يطاردوك أنت مثلاً أو أمثالك !!! بالطبع لن يفعلوا فأنتم مطية إن خسروها ما عادوا يجدون أكثر راحة من ظهرها و لذلك فهم حريصون عليكم ضد كل الأهوال فتارة يغارون عليكم من إيران و تارة من سورية و تارة من حزب الله و أنتم تقولون آمين !))ناهيك عن العملاء الذين كانوا يطاردونه و أنت أدرى بحقدهم ..<br />أخيراً :: هل لديكم يا معشر الشتامين إلا التكفير و التطرف الأحمق و الاتهامات الطائفية لتردوا بها علينا !<br />و عندما نحاججكم بالمنطق و العقل تردون بالمماحكات القذرة و الطائفية البغيضة أيضاً و أيضاً ...<br />و لكن إن كان عندكم شجاعة فكفوا عن التمترس و الشماتة الجبانة القذرة و شمروا عن سواعدكم مع الإسرائيليين و الأميريكيين ( و لكم سوابق في ذلك معروفة ) و دعونا نراكم مع الصهاينة ( لا تخجلوا ! ) في ميدان القتال إن كنتم فاعلين !"
