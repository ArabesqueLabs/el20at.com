posted = "2008-03-26"
text = "اولا رحمة الله عليك يا حامل لواء الشهداء نم هنيئا ثانيا احب اقول للجماعةيلي شتموا الشهيد البطل لو كنت بعرفكم لو مشبهكم ترى تشوفون شو بسوي فيكم يا احفاد القردة والخنازير واحب اقول ان كل جزائري هدا رايو فيكم كل الجزائريين يحبون ويعشقون القادة والزعما الكبار يلي وقفو ضد الصهيونية العالمية من عبد الناصر الى الملك فيصل غلى حافظ الاسد غلى شهيد العروبة رمز المقاوم صدام حسين بو عدي ولا انسى وكيف انسى قدوتي الرئيس الراحل بومدين اعود فاقول لكل من تسول له نفسه شتم الشهداء انا متاكد انكم صهاينة مندسين تحت العباءة الاسلامي او اقل شي منافقين احفاد ابن سلول مستعربين الله يعطيكم على قدر نياتكم يا يهود اكثر من اليهود والله ما كنت اظن انه في عربي يشتم واحد زي الحج رضوان اقول والله ما انساكم بالدعاء عليكم كل ليلة الله يهديكم او يديكم يا مخانيث واقول على لسان الشهيد الرمز وانى لي دلك ادا اتتك مدمتي من ناقص فتلك شهادة لي باني كامل والكامل ربي سلام لكل عربي مسلم غيور على عرضه."
