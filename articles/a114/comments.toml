text = "محمود لطفي عامر ـ رئيس جمعية أنصار السنة في دمنهور ـ وصف فكر الإخوان بأنه يتشابه وفكر الخوارج، وإن البيعات التي تتم لمرشدهم باطلة، لأنه لا يوجد بيعة إلا لحاكم.أضاف عامر لـ «المصري اليوم» أن تحقيق الإخوان لمكاسب في الشارع لا يعني أنهم علي حق لأن أحمد عدوية وشعبان عبدالرحيم حققا مكاسب والشعبية التي حققتها الجماعة ليست دليلاً علي صحة موقفهم، ولكن «لأنهم مش لاقيين رجالة يقفوا لهم»."
