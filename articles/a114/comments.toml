author = "نيفين نيفى نوفا"
posted = "2008-03-03"
text = "اما بالنسشبه لصدام حسين انا لا اذكر انى تباكيت على شىء ايامها الا اهانه الامه فى شخص صدام و ليس صدام نفسه<br />و موضوع عبد الاناصضر ده موضوع لوحده و ده اللى بياكدلى انك مش متابع تعليقاتى كلها<br />كل الناسش على الموقع يعرفون انى ضد عبد الناصر فى معظم افعاله و كان ليا مناقشات طويله مع ابن بهيه الله يمسيه بالخير عن عبد الناصر<br />انا لم و لن اتباكى على ايام عبد الناصر باى حال من الاحوال و لن ايسشمح لنفسى اذا اعجبتنى بعض اعماله ان اكون من دراويشه<br />زمن عبد الناصر ايه اللى زمن جميل<br />و ده كلام<br />بس اسمحللى اساللك بقى انت فين و ليه و ازاى بمعنى ازاى بتجل نصر الله و بتقول ف اخر رسالتك من يسبون الصحابه لا يستحقون كذا و كذا<br />حدد موقفك<br />اتمنى اكون وضحت الصوره شويه<br />مع الشكر"
