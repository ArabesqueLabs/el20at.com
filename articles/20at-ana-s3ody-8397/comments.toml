text = "حقا صدق الرسول عليه الصلاة والسلام<br />اعتقد طالما العرف لا يتعارض مع الشرع فاولى اتباع العرف لتجنب كل هذه المشاكل<br />والواجب الاستفادة من فترة الخطبة فى التعرف على الطرف الاخر وما اذا كان من الممكن ان يتوافقا فى حياتهما بعد ذلك وترك امور الرومانسية والعواطف لما بعد الزواج حتى لايفقد كل منهما عذريته الروحية بان يهدر عواطفه وفى النهاية يجد نفسه فقد شيئا لن يستطيع استعادته"
