author = "خالد المصرى"
posted = "2009-05-06"
text = ":o مريت بهذة التجربة ولكن بشكل اخر هو انى تزوجت فتاة عقد قرانها على رجل قبلى ولكن العرف عندنا بان من عقد قرانة على فتة تعتبر اجنبية عنة فلم يكن فى البداية لة ادنى تاثير ولكن المشكلة وانا لى سنوات طويلة من الزواج وانجبت اطفال وزوجتى متدينة جدا لكن كلمة مطلقة قبل الخول بها الموجودة فى عقد القران لها تاثير سلبى على حياتى رغم محاولة زوجتى ارضائى لذا اقول لكل ولى امر يجب ان يكون عقد القران قبل ايام قليلة من الدخلة"
