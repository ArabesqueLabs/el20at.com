text = "مع هذا التجول الذى يصحبك الى عالم الليل الساحر فى قاهرة المعز وبين ضوضائها وسكون نيلها بين حكايات من فيها وخيالات من يتمنى الانتماء اليها قدمت انت صورة اقرب الى الحقيقة بتفاصيل بسيطة يهتم بيها الجميع<br />فلا عجب اذا وصفت انت المحروسة ولا عجب اذا تمنيت انا من قمت بوصفها"
