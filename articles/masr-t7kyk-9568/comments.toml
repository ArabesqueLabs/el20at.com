subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-07-08"
text = "القاهرة اجمل واجمل بالليل امال فين الفنانين قهاوى وسط البلد والحرية وكل الناس متظهرش الا باليل القاهرة بلد تانية بالليل... حلو الموضوع بس كان ناقصه شوية اراء للفنانين لانهم اكتر الناس اللى بتشوف القاهرة بالليل القاهرة فى المقال محسسنى انها كلها باياعين ..والحبيبة فين والسواقين والناس الجامدة .. والناس اللى نايمة على الارصفة دول مش صهاليل .. الرجالة السكرانه اللى مش لاقية شغلانه تلمها .. والبنات اللى ملهاش اهل هم دول اللى صهاليل يلا معلش<br />واللى راجع اورجعه من وردية ليل طالع عينها القاهرة على قد ما هى صهاليل يا حاج محمد الا انها برضه شايلة كتيير"
archived = "2010-03-14"
