[[comments]]
order = 2
subject = "اللهم سلط الظالمين على الظالمين واخرجنا من بينهم س"
author = "محمد الحربي"
posted = "2009-02-21"
text = "المسمى عز الاسلام<br />يتهم من قال الحقيقه بانه يتلفسف<br />معتقدا ان الجميع اغبياء وهو ومن وافقه اذكياء<br />يامن تدعي العز وانت لاتعرف من اهان الاسلام ومن اعطى الضوء الاخضر للاعداء بالهجوم على الاسلام بداعي الارهاب وتهديد البشريه وعدم تنفيذ ما جاء في شريعة الدين من الجنوح للسلم ودعوة اهل الكفر للاسلام<br />صديقك الذي تدعي صداقته املا بوزارة او سبايا او غنيمه<br />قد انكشفت اوراقه واصبح اسمه قرين التكفير والتفجير والارهاب والفساد بالارض<br />يبدو لي انك نائم ولا تعلم<br />الرجل اصبح لا يسوى قيمة حبة خردل<br />اصحى يالحبيب<br />اصحى ايها النائم<br />اصحى وفتح عينيك جيداً<br />وحاول ان تركز على مستقبلك وعلى دينك وترك الادعاءات الفارغه<br />من عز وسيف وخداع<br />ولا نعلم<br />فربما لو استئمنك احد على<br />بقعة من تراب الارض لسرقتها<br />هكذا علمناكم<br />ونشهد ان الخوارج اشد على الاسلام من اهل الكفر"
archived = "2010-03-14"
capture_url = ""
