[[comments]]
order = 0
subject = "ان شاء الله قريب"
author = "بندر الجهني"
posted = "2009-02-19"
text = "يضحك على نفسه من يعتقد ان اسامه الذي يحرض والذي يفجر والذي يجند ليس بعميل<br />وللامانه قد يكون الذي نراه ليس اسامه بن لادن<br />ولكن شغل محترفين كما رائنا في اعلان شركة البريد العالميه فديكس عندما ظهر اسامه بن لادن في احد اعلاناتها لتبرهن للعالم انها باستطاعتها ان توصل اي مكان في العالم حتى كوخ بن لادن في جبال تورا بورا<br />هذا من ناحية<br />اما ناحيه اخرى<br />عندما يتفلسف علينا بعض الغوغاء بقوله<br />ان اسامه ترك الدنيا والمال لـ ولـ ولــ<br />طيب هو يقدر يطلع ويرجع وهو اعترف بنفسه في التحريض على التفجيرات في الرياض<br />هو يعرف ان السيف ينتظره<br />لاجل كذا ما رايح تشوفونه ويكتفى بالبربره من داخل الكهوف<br />الله يفكنا من شر فتنتهم ويدق الظلمه بالظلمه يارب ياكريم<br />ما شوه الاسلام مثل صاحب الصوره اعلاه<br />وما وما احد وقف ضد الدعوه الاسلاميه مثله<br />وما فيه احد قدم خدمه لامريكا واعداء الاسلام مثل قاعدته<br />والله يفكنا منهم اجمعين هم ومن سلك مسلكهم الخبيث"
archived = "2010-03-14"
capture_url = ""

