subject = "الحافظ.. احفظ الله يحفظك"
author = "محمود"
posted = "2007-12-29"
text = "حتى تكون قرآنا يمشي على الأرض:<br />حتى تتمكن من معرفة أيسر الطرق والوسائل لحفظ القرآن الكريم صغيرا كنت أو كبيرا<br />حتى تفهم أحكام التجويد والتلاوة وأسباب نزول آياته<br />حتى تتمكن من معرفة تفسيره وأحكامه ومعانيه والتعرف على الصور البلاغية والبيانية<br />حتى تتعرف على مدى إفادة التكنولوجية الحديثة للقرآن الكريم<br />حتى تتعرف على أهل القرآن الكريم وتعيش مع أعلامه وحفاظه<br />حتى تتمكن من دفع الشبهات عن القرآن .<br />وفي النهاية :<br />حتى تعيش بالقرآن ليكون نورا في حياتك وضياءا في قبرك<br />حتى تتمكن من ذلك كله:<br />طالع \"قناة الحافظ\" للقرآن الكريم على تردد: 12360<br />27500 افقي<br />وهي تابعة لباقة قنوات الناس الافضل فى العالم العربى وهم؛ الناس، الخليجية ، البركة، والصحة الجمال. \"الحافظ\" بحق تستحق المتابعة .. وتستحق أن نتكاتف جميعا لدعهما وتطويرها .. أليس كذلك؟"
