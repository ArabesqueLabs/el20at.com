subject = "هتسئا له حور الفردوس"
author = "طيف بدر"
posted = "2008-01-17"
text = "كان يبحث عن عروس فاختار الله له عروسه و عرسه<br />اللهم تقبل منه و من والده<br />هؤلاء هم فادة حماس ... لا نجدهم في البارات و لا نجد أبناءهم في مارينا و مارسيليا<br />هذه هي حماس و لعمري لن يخذلهم الله<br />حماس على درب محمد (صلى الله عليه و آله و سلم) فلا نكون نحن على درب أبي جهل و أبي لهب<br />حماس على درب أبي بكر الصديق (رضي الله عنه) فلا نكون نحن على درب مسيلمة<br />http://alayasser.maktoobblog.com<br />حماس على درب عمر بن الخطاب (رضي الله عنه) فلا نكون نحن على درب ابن سلول<br />حماس على درب علي بن أبي طالب (رضي الله عنه) فلا نكون نحن على درب ابن ملجم<br />حماس على درب الحسين (عليه السلام) و أتمنى من الله ألا نكون نحن المسلمين على درب أهل الكوفة"
