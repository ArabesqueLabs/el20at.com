subject = "الى المعلق قبل السابق"
author = "مش ححبك"
posted = "2008-08-03"
text = "الى المعلق قبل السابق اللي قال في تعليقه<br />يارب ارحم السادات و ارحم عبد الناصر و ارحمنا و ارحم مصر من العصابة اللي سرقها الأيام دي<br />انت اترحمت على جمال والسادات وما اترحمتش على حسني مبارك<br />وحياتك يا غالي لما يجي الحكم الجاي الذي لا يعلم عنه احد الا (المخابرات الامريكية) لتترحكم على حسني مبارك<br />تماما زي ما حصل في العراق<br />كان الشعب بيلعن صدام<br />ولما راح صدام الان بيبكوا على ايام صدام وصدق الشاعر حينما قال<br />دعوت على عمر فمات فسرني<br />وعاشرت اقواما فبكيت على عمر"
