author = "شايف"
posted = "2008-08-03"
text = "مشكلة ايران مع السادات انة استضاف الشاة قبل ما يموت فى مصر<br />ويقال ان الست جيهان لهطت مجوهرات الشاة ونقلتها امريكا والسادات خبط المليارات<br />هى دى الحكاية<br />مصر ليس لها علاقة<br />مشكلة ايران مع الشاة ومع اللى استضافة وخبط القروشات والمجوهرات ودفنة فى مقابر الملك فاروق<br />يقولوا علية فرعون - ماشى<br />فرعون برضة كان رجل محترم وربناقال لموسى واخوة انهم يروحوايتكلموا مع فرعون بادب - اذهبا وقولا لة قولالينا<br />طبعاالسادات قتل امين عثمان وقد قتل جزاءا وفاقا"
