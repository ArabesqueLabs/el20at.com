order = 1
subject = "نزعل من مين ؟؟؟؟"
author = "عبد الله المصرى"
posted = "2008-08-01"
text = "يعنى لو واحد مصرى أو جمعية مصرية شتمت مثلا غاندى هل من المفروض ان الهند تزعل من مصر كلها و تقطع علاقتها<br />بمصر ولا تحتج علي الشخص أو الجمعية دى ، المفروض ان مصر كانت اخدت موقف من الفيلم لكن مش من ايران كلها<br />طبعا هى مفاجأة ان الفيلم اتعرض قبل كده علي الجزيرة لكن عموما اكيد نوايا الجمعية الي انتجت الفيلم انها ضد<br />شخصية الرئيس السادات و وصفت عمليه الاغتيال بانها اعدام للفرعون و اكيد هما ميقصدوش الفرعون بمعناه الايجابي<br />و اكيد يقصدوا فرعون موسي لان الصحافة الاجنبية مثلا كانت بتوصف السادات علي انه فرعون القرن و عادى محدش<br />كان بيزعل المهـــــــــــــــــــــــــم لو المفروض اننا نزعل او ناخد موقف من حد فالمفروض انه يكون منتج الفيلم<br />مش البلد بتاعت منتج الفيلم و شكرااااااااااااااااا"
archived = "2008-08-07"
capture_url = "https://web.archive.org/web/20080807031218/http://masr.20at.com:80/newArticle.php?sid=17052"

