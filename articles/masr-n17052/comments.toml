order = 0
subject = "لا جمال عبدالناصر فرعون ولا السادات فرعون ولا حسني"
author = "مش ضروري"
posted = "2008-08-01"
text = "لا جمال عبدالناصر فرعون ولا السادات فرعون ولا حسني مبارك فرعون<br />لماذا<br />لانهم مسلمين موحدين وناقطي الشهادتين<br />ونذكر هنا ان جاء رجل الى رسول الله صلى الله عليه وسلم قبل احدى الغزوات مباشرة وقال له يا رسول الله اقاتل ثم اسلم<br />فقال له رسول الله لا اسلم ثم قاتل فنطق الشهادتين وقاتل ومات وقال النبي محمد صلى الله عليه وسلم فيه انه دخل الجنة دون ان يسجد لله سجدة واحدة (وهذا يبين اهمية الشهادتين وانهما دليل الاسلام)<br />وفرعون كان كافر بالله عز وجل وكافر برسوله كفر الجهود<br />وقد افتى علماء اهل السنة والجماعة الاكارم حفظهم الله<br />بأن ناطق الشهادتين والمقر بهما لا يجوز وصفهما بالكفر ابدا<br />وانه لا يجوز تطبيق الايات التي نزلت بحق الكفار على المسلمين ناطقي الشهادتين<br />القضية المهمة في الموضوع<br />ان الذين يطلقون عليهم الفراعنه<br />علماء اهل السنة والجماعة وصفوهم بالخوارج<br />هي دي الحقيقة<br />وخلاصة الكلام<br />جمال عبدالناصر<br />السادات<br />حسني مبارك<br />كل اعمالهم تدل دلالة قاطعة على انهم مسلمين موحدين وان كانوا يفعلون المعاصي والذنوب فاهل السنة والجماعة لا يكفرون بالذنوب والمعاصي<br />وواجب الرعية الدعاء لهم وتقديم النصح لهم<br />هذا هو منهج اهل السنة والجماعة<br />ومن يقول بخلاف ذلك فهو من الخوارج والفرق الضالة<br />حسب فتاوي علماء اهل السنة والجماعة<br />وما تسمعوش كلام الايرانيين والشيعة وحسن نصر الله وخلافه<br />لانهم اصلا لقبوا ابو بكر وعمر بالجبت والطاغوت<br />وقالوا ما قالوا في بنتيهما زوجتي رسول الله صلى الله عليه وسلم عائشة وحفصه<br />عليهم من الله ما يستحقون"
archived = "2008-08-07"
capture_url = "https://web.archive.org/web/20080807031218/http://masr.20at.com:80/newArticle.php?sid=17052"

