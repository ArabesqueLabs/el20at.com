[[comments]]
order = 0
subject = "جامد"
author = "فنانس"
posted = "2007-06-03"
text = "رائع يا استاذ على وأسلوبك اروع<br />وبالنسبة للتكيف وخطب الجمعة أريد أن احكي موقفا صغير حدث لي مع امام جامع في أحد أيام الجمعة، حيث تحدث عن قصة سيدنا نوح وذلك في نفس اسبوع غلاء أسعار البنزين والمواصلات في شهر 9 الماضي ومن حسن حظي اني تمكنت من الحديث معه بعد الخطبة وقولت له انا قصة سيدنا نوح عارفها من 5 ابتدائي ومش بتضيف لي جديد بس كنت عايز اعرف اعمل اية لما الاسعار تغلي اسكت ولا اتكلم .. قالي دي محتاجين نسأل فيها حد.<br />للأسف يا استاذ على بعض شيوخ الجوامع ليست لديهم معلومات دينية كافية"
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065709/http://masr.20at.com:80/newArticle.php?sid=10503"

[[comments]]
order = 1
subject = "ما هي بقت سبوبة"
author = "مقهورة"
posted = "2007-06-03"
text = "بصراحة في رأيي بعد ما بقت الأئمة في الجوامع تعين من قبل الحكومة بقوا زي أي موظف حكومي - إلا من رحم ربي-، بيدوروا على الحضور والانصراف ومعلوماتهم في مجال عملهم شبه سطحية وطبعا إرضاء رئيسهم في العمل شيء ضروري لزوم الترقيات والذي منه.<br />لما تتفرج على تمثيلية زي اللي في التليفزيون دلوقتي عن الإمام المراغي اللي وقف أدام الاحتلال ورفض يبلف الملك أيامها حتعرف ليه أتجهت الدولة لجعل الإمام موظف حكومي تعينه الدولة."
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065709/http://masr.20at.com:80/newArticle.php?sid=10503"

[[comments]]
order = 2
subject = "ضاعت العلماء فى زمن العلم"
author = "ابو اسامة"
posted = "2007-06-04"
text = "واللهى ما ضيعنا الا من يدعون العلم وهم اجهل الجهلاء يرتقون المنابر من اجل المال ياخذوا خطبهم من ساستهم<br />وحسرتاه على الازهر الذى كان منارة العلم والعلماء فى كل العالم الاسلامى لقد ولى امره شيوخا على موائد السلطان<br />يطوعون الدين على هواه ويعينون له من يرضاه يتكلمون ولا يملكون الا افواه ضاعت ضمائرهم يتكلمون عن عيد الام وهى<br />العراق تآن وتقول وضيعتاه اين انتم من عمر عندما قال له الصحابى اتقى الله فجعله من الحاكمين ومن الولاة .<br />ولكنكم يوم القيامة ستقولون وحسرتاه ضيعتم الامة فى زمن كنتم يجب ان تقودوا فيه الامة الى الحق والعدل<br />وحسبيى الله ونعم الوكيل."
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065709/http://masr.20at.com:80/newArticle.php?sid=10503"

[[comments]]
order = 3
subject = "one way"
author = "نيفين نيفى نوفا"
text = "استاذ على مقاللك رائع و البرجراف الاخير لخص موضوع يتكتب فيه مدونات تلخيص رائع يمكن بيفكرنى بتلخيصات العبقرى احمد رجب<br />و لكن اذا المعادله اتوزنت هيتحول كل دعاتنا الى ما ال اليه الشيخ قطب و كتير من شيوخنا اللى تسول ليهم نفسهم القاء خطبه متكيفش الحكومه و ساعتها بيتحولو ا لدعاه oneway لانهم بعد كده مبنشوفهومش زى ما انت قلت و الباقى معروف"
archived = "2007-06-06"
capture_url = "https://web.archive.org/web/20070606065709/http://masr.20at.com:80/newArticle.php?sid=10503"

[[comments]]
order = 4
subject = "دعاه one way"
author = "نيفين نيفى نوفا"
posted = "2007-06-09"
text = "موضوع جميل يا استاذ على و البرجراف الاخير لخص مدونات ياما اتكتبت ف الموضوع ده<br />و لكن الاتتفق معى انه لو قام الدعاه بالقاء خطب تكيفنا و متكيفش الحكومه سيكون مصيرهم كمصير الداعيه الذى ذكرته و هنا هنلاقى خيره دعاتنا بقو دعاه ,one way و ال way اللى اقصده كلنا عارفينه و يجعل كلامنا خفيف على ال way ده لانه عاده بيبقى way اللى يروح ميرجعش"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707113555/http://masr.20at.com:80/newArticle.php?sid=10503"

