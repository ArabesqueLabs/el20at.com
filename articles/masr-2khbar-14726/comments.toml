text = "اقرأ c.v لكل واحد فيهم<br />الاول عميد فى القوات الجوية ويظهر ان القوات الجوية على ايامة كانت بتمشى على قضبان فى الجو والراجل عندة خبرة فى السيمافورات الجوية ثم تم مكافئتة بتوليتة هيئة البريد او مصلحة البريد لينقل الى وزير المواصلات فابشروا<br />الثانى كان ملقب فى كلية الهندسة جامعة عين شمس بلقب احمد غبى غدر لانة ابن زكى بدر وزير الداخلية السابق سليط اللسان اللى وقف فى مجلس الشعب وقال انة هيلبس المعارضة طرح زى النسوان<br />احمد زكى بدر نال الدكتوراة سنة 1998 يعنى حتة مدرس رقى بسرعة الصاروخ ليتولى رئيس جامعة عين شمس وهناك دكاترة اسياد ابوة تخطاهم وحول جامعة عين شمس الى فرع تابع لامن الدولة او مركز للامن المركزى<br />اعتقد ان اول قرار سياخذة هو تبعية المدارس الى مامور قسم الشرطة التى تتبعها ويتلقى الناظر تعليماتة من ضابط امن الدولة<br />على وزارة التربية والتعليم الف سلام"
