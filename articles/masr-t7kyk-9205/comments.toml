[[comments]]
order = 3
subject = "تم تجديد قانون الطوارىء من يومين وسط استياء دولى و"
author = "من  الفئة المندسة"
posted = "2008-05-29"
text = "النظام الفاشل عايز يقول ان قانون الطوارىء بيحمى النصارى والمسيحيين من الاوغاد المتطرفين المسلمين<br />ثم من هم اللى قلبهم ميت للدرجة دى ويجيبوا مسدسات والضهر وعينى عينك ويقتل ويهرب بدون الناس ماتتلم وتصوت ويمسكوهم<br />دى كلة شغل مباحث امن الدولة<br />اللى قتلوا الناس فى محل الدهب هم مباحث امن الدولة او بلطجية الحزب الوطنى<br />انما<br />القصة بتفسر نفسها<br />دايما قصص الامن بايخة قوى ومهروشة"
archived = "2010-03-14"
capture_url = ""
