[[comments]]
order = 0
subject = "عصابات السطو المسلح ستنتشر نتيجة الجوع المنتشر بين"
author = "شايف"
posted = "2008-05-28"
text = "عادى جدا ما حدث<br />الموضوع ليس فتنة طائفية ولا بطيخ الموضوع انتشار الفقر والجوع وحاجة الشباب العاطل الى الفلوس وانتشار البانجو والحشيش وفساد المجتمع والتركيز على الامن السياسى وترك امن الشعب<br />اتوقع فى الفترة القادمة<br />زيادة عمليات السطو المسلح على المحلات والدكاكين ومهاجمة الشقق والبيوت السكنية من مسلحين بالسكاكين والخناجر وترويع الناس<br />ستنتشر حوادث السرقة عينى عينك بالقوة المسلحة<br />الكل عايز ياكل ويصرف ويعيش وبأى طريقة<br />ومطلوب من الحكومة تجنيد مليون عسكرى امن مركزى زيادة عن المليون الموجود لحماية الناس<br />او ان يحمى كل فرد نفسة وعائلتة بشراء مسدس او بندقية من السوق السودة لحماية نفسة واسرتة ويا روح ما بعدك روح على النظام الامريكى<br />عن نفسى لا بد ان اشترى حتة سلاح لاحمى اسرتى"
archived = "2010-03-14"
