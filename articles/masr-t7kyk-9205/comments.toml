subject = "مسكين يا حبيب الملايين حتفتكر مين ولا مين ولا مين"
author = "مش مروة صلاح ولا شريف الدواخلي"
posted = "2008-05-29"
text = "انت فاكرنا يا حبيب الملايين<br />فاكر الجعانين<br />فاكر المشردين<br />فاكر المضروبين<br />فاكر المسرطنين<br />فاكر المكسحين<br />فاكر الفارانين<br />فاكر المشردين<br />فاكر الغرقانين<br />فاكر المعتقلين<br />فاكر المسجونين<br />فاكر الهربانين<br />فاكر الضايعين<br />مسكين يا حبيب الملايين حتفتكر مين ولا مين ولا مين"
archived = "2010-03-14"
