[[comments]]
order = 2
subject = "سواق تك تك بيحشش ويشتم"
author = "بهنس"
posted = "2008-10-14"
text = "اضربت فى نافوخى وركبت تك تك مجبرا اخاك لابطل حيث كنت فى زيارة لواحد صاحبى لحضور مناسبة جوازة ركنت عربيتى فى البيت فى اكتوبر وعدى عليا واحد صاحبى نروح انا وهو بعربيتة للشرقية ابوحماد وبعدالفرح اصر صاحبى عليا انة ابات عندهم فى البلد وانزل بكرة طبعا صاحبى رجع علشان عندة شغل بكرة انا نمت هناك وصحيت الصبح ميسوط على الريف وجمالة فطرت وقلت انزل اتمشى شوى فى البلد ركبت مع سواق تك تك وقلتلة عاوز الف شوى فى البلد وبعدين ترجعنى لنفس المكان وحكرمك اخر كرم ونهاك ابيض باذن اللة المهم مشينا مفيش دقيقة الاوالتك تك انقلب بقدرة قادر طيارة بتلات عجل خفت قلت يااستاذ بالراحة انا طالع اتفسح راح مدينى سيجارة حشيش وقالى ولع قلتلة مبشربش حشيش هى سجاير وعاوز اسيبها عشان صحتى بصيت لقيتة ولع الحشيشة وابتدا يلقى محاضرة عن فوائد الحشيش ومزاياة انا حسيت انة دماغى ابتدت تلف وقلتلة استنا عندك ياتطفى الحشيش ياتنزلنى قعد يدحك قلتلة انا لازم انزل هنا فجاة عدى صاحب توك تك تانى من جنبينا ببص الاقى الاتنين اشتغلواشتيمة فى بعض شوى سحبوا مطاوى اتلمت الناس ومشت كل واحد فى طريق بصيت لقيت صاحب التك تك بيقولى تعال نكمل المشوار قلتلة خلاص انا بطلت بصيت لقيتة اشتغل شتيمة وردح لغاية مادفعتلة الاجرة خمس اضعاف اللى يستحقة وبعد فصل الرعب دة رحت متصل على صاحبى اللى عازمنى وراح باعت اخوة يجيلى وحكيتلة على اللى جرى وقعدنا ندحك بس انا باحذر كل اللى بيقروا التجربة بتاعتى انهم مايحولوش يركبوا تك تك باى حال من الاحوال"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "وانا كمان ركبت مع سواق محشش"
author = "داليا"
posted = "2008-10-15"
text = "ياااااه يا استاذ بهنس ده انت حظك من السما انك بعيد عن ركوب التوك توك اومال انا اعمل ايه ؟ انا بطبيعة شغلي احياناً ممكن ارجع متأخرة وبعد ما انتشر الهباب اللي اسمه التوك توك وقف حال الميكروباصات عندنا وكمان طفش التكسيات لدرجة ان بعض سواقيين الميكروباصات اشتغلوا على تكاتك ، المهم انا دايما بحب اختار السواق اللي اركب معاه يا اما راجل كبير وشكله محترم ياما شاب شكله ابن ناس شوية ، وركبت لك في بداية الشتا اللي فات مع شاب عنده حوالي 18 سنة كنت ركبت معاه قبل كدة وقعد يشكي لي من صعوبة منهج الدراسة عنده في كلية التجارة جامعة طنطا ، المهم قولت لك للولد ده هي الدنيا برد ولا الأنفلوانزا اللي عندي هي اللي عاملة كدة قالي مش عارف انا مش حاسس بأي حاجة ، وشوية يسأل ع الساعة بطريقة غريبة ، أنا حسيت انه مش متزن فقولت له هو انت كمان عندك أنفلوانزا ولا ايه ، المصيبة انه طلع محشش وقالي دول سجارتين ع الطاير كنت بجامل واحد صحبي في فرح ، ولك أن تتخيل بنت راكبة توكتوك لوحدها في الشتا الساعة 10 مع سواق محشش ممكن تكون مرعوبة قد ايه ؟؟؟؟ يلا الحمد لله اني وصلت بالسلامة"
archived = "2010-03-14"
capture_url = ""

