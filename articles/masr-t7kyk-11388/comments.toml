[[comments]]
order = 2
subject = "حين اعترض عدد من اليساريين في نهاية الاحتفالية على"
author = "مش كاتب"
posted = "2009-02-24"
text = "المشكلة ان الاخوان المسلمين ما بقوش اخوان مسلمين<br />تماما زي المسلمين ما بقوش مسلمين بقوا اسم فقط لكن الحقيقة هم ليسوا مسلمين<br />الاخواني المفروض يكون داعية اسلامي اولا مش داعية حزبي او سياسي<br />النبي محمد صلى الله عليه وسلم جاء داعية الى الله اولا وداعية الى التوحيد ونبذ الشرك<br />حسن البنا مؤسس الجماعة كان نفس الشيء عرفه العالم داعية الى الله سبحانه وتعالى<br />الان الاخوان دعاه حزبيين وانتخابات وسياسة<br />والموضوع يطول شرحه"
archived = "2010-03-14"
capture_url = ""
