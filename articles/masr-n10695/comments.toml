subject = "من قلبي"
author = "رغد (رغوووووووووودة )"
text = "بجد ياعمرو كل الحانك واغانيك تجنن وانا شخصيا بموت فيها وانا من اشد المعجبين بيك وانت مش مغرور ولاشايف نفسك ولا حاجه وياريت متزعلش من كل الناس اللي اتكلمو عليك اوغلطو في حقك وخليك كده دايما واثق في نفسك وعلى فكره انا بجد نفسي الاقي نمرتك نفسي اكلمك بجد ودي امنيه بتمنى تتحقق انشاء الله 0000وانا بتمنالك النجاح في حياتك وربنا يخليك لينا يااجمل واظرف وارق فنااان في الدنيـــــــــــــــــــا"
archived = "2008-01-16"
capture_url = "https://web.archive.org/web/20080116113657/http://masr.20at.com:80/newArticle.php?sid=10695"

