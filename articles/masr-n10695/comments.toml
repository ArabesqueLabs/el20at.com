order = 0
subject = "من عمرو دياب لعمر مصطفى يا قلبي لا تحزن"
author = "مش ضروري"
posted = "2007-06-19"
text = "الاخ عمرو مصطفى كما يقول الموضوع كان بيشتغل ملحن وبعد كده فضل يفكر ويفكر<br />طيب يا واد يا عمر انا اخذت ايه من التلحين<br />ما انا زي ما انا محلك سر<br />وطرأ على ذهنه عمرو دياب<br />وايه الفرق انا اسمي عمر وهو اسمه عمر<br />بس هو بيلعب بالملايين لعب حتى اخر اخباره (والكلام عن عمر دياب) ان الضرايب كانت عايزه منه ? مليون جنيه وعمل اشكال مع الضرايب المهم خفضولوا المبلغ من ? مليون الى ? مليون وكما تقول الرواية راح مطلع دفتر شيكات من جيبه وكتب شيك ب ? مليون.<br />فخطر على باله انه يجرب حظه في الغنا طالما الغنا بيجيب فلوس كويسه بالشكل دا وانتوا عارفين ان الشعب المصري اهبل وعبيط وبيشجع اي حاجه<br />يلا يا عمر مصطفي غني ولا يهمك غني ونحن من وراءك يمكن البلية تلعب معاك يابني ومره واحدة تبقي تبص تلاقي نفسك فوق فوق زي عمر دياب وتبقا غني وتسكن في الزمالك وتركب البودرا وتتجوز واحدة حلوه زي القمر<br />لا والاش يله لو مثلت بعد الغنا ياااااااااااااااااااه وتبقي زي عبدالحليم حافظ ولا محمد عبدالوهاب ملحن ومطرب وممثل يااااااااااااااه<br />معقوله يله وتبقى واحد مشهور والمليون تيجي ورا المليون وتبقي عضو في مجلس الشعب<br />يله يا ابني غني واكسب فلوس واركب البودره والزلمكه والسواق بتاعك وهو ماشي يشتم الناس ويقولهم وسعوا يا بقر لعمر بيك"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819022916/http://masr.20at.com:80/newArticle.php?sid=10695"

