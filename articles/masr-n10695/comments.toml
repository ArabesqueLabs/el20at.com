subject = "عمرو مصطفى ... أسم يواجه صعوبات وقريبا مطرب مصر ال"
author = "عطــر الأمــاكن"
posted = "2008-03-14"
text = "استغرب هذا الهجوم الغريب على الفنان المبدع عمرو مصطفى<br />أنا أضع كلماتي هذه وأنا استمتع بصوته العذب والحساس<br />لديه ألحان ( جهنمية ) ولكن مشكلتنا أننا نخلط بين التطور المحمود وبين التطور المذموم<br />عمرو مصطفى ملحن عصري متألق واستطاع أن يقدم أعمال جميلة تحتاج فقط للخروج إلى العالم العربي عن طريق شاشات ميلودي وروتانا والأم بي سي ..<br />أنا شخصيا لم انجذب لأي فنان عربي جديد سوى لعمرو مصطفى بعد عمرو دياب<br />يجذبني اللحن بشكل كبير .. وربما في بعض الأحيان قبل الكلمة<br />واصل يا عمرو ... فانت مبدع ولديك سلاح قوي وهو ( التلحين ) وهو السلاح الذي يعطي المطرب ثقة في نفسه وتغنيه عن الملحنين الآخرين"
archived = "2010-03-14"
capture_url = ""

