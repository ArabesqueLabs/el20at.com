subject = "حلو وكذاب"
author = "جورجية وسوفية"
text = "مع احتامي الشديد للملحن عمرو مصطفى والحانه(الي اغلبها مسروقةمن الحان عالمية)بس ولله مش للدجة هاي تشوف حالك ولاتنسى انو مص والوطن العربي متروسين ملحنين واغانيه ضاربة ومافي حكي . بس مش عارفة انا (ليه الغرور والكبرياء )وبعدين صوتك احلى وانت بتلحن فلا تتعبو بالغناء"
archived = "2008-01-16"
