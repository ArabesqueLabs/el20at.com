posted = "2008-06-25"
text = "انا عندى بيان هام جدا والانسان الشريف يجب ان يحمى المجتمع من هذا النصب<br />اولا الاسم ميلاد ناجح جاد اكبر مذور فى عقود التليفونات وايضا الموبيلات وايضا امير ناجح جاد وهذان الشبان عندهما سنترال للخطوط المسروقه وايضا الموبايلات التى لم يسدد فواترها وهذا نصب علنى ويجب على الحكومه اجرا الازم السنترال اسمه بوتى فى منطقه الخصوص شارع محروس الخراط الشهير بابو سعده"
