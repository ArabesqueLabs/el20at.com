[[comments]]
order = 53
subject = "من هو مصطفى بكرى ومحمود بكرى"
author = "د/محمد صيام"
posted = "2009-03-07"
text = "مصطفى بكرى هو الصحفى المصرى الكبير ورئيس تحرير جريدة الاسبوع المصريه<br />وهو ايضا احد اعضاء مجلس الشعب ( البرلمان ) المصرى<br />وشقيقه الصحفى الاستاذ محمود بكرىالرئيس التنفيذى لجريدة الاسبوع ورئيس قطاع البرامج السياسية بقناة الساعة وفى استمرار مستفز لمسلسل الاهانات الامريكيه للامه العربيه<br />وفى استمرار مستفز لمسلسل الاذلال الامريكى للامه العربيه<br />وفى استمرار مستفز لمسلسل التبجح الامريكى الحقير فى مواجه خنوع عربى غريب ومريب<br />اصدرت الادارة الامريكيه قرارا بثبوت تهمه العداء للساميه فى حق كل من<br />الاستاذ مصطفى بكرىوشقيقه الاستاذ محمود بكرى<br />والعداء للساميه جريمه كبرى لا تغتفر بموجب القانون الامريكى والقوانين الاوروبيه كلها<br />حيث يتعرض مرتكب هذه الجريمه للسجن الفورى بعد محاكمه صوريه اذا كان مقيما فى امريكا او احدى الدول الاوروبيه<br />ويوضع على قوائم الانتظار وترقب الوصول فى جميع المطارات والمونىء الامريكيه والاوروبيه اذا كان مقيما فى الخارج بحيث يتم القاء القبض عليه فورا وترحيله الى السجن لمواجهه عقوبه تلك الجريمه<br />وتوقم السلطات الامريكيه والاوروبيه بمطاردته عبر العالم كله ويمنع تعامل جميع المؤسسات العالميه معه وتصادر املاكه وامواله فى جميع البنوك الامريكيه والاوربيه لصالح اسرائيل فهو مجرم دولى بموجب القانون الامريكى والقوانين الاوروبيه !!!!<br />ولنعد معا الى اساس تلك الجريمه ( جريمه معاداه الساميه )<br />حيث نجد علماء الاجناس قد قسموا البشر من حيث الاصول الانسانيه الى عدة اجناس منها الجنس القوقازى والجنس المغولى والجنس الابيض والجنس الزنجى ......والجنس السامى والجنس الاصفر .....وغيرها<br />فالساميه ليست عقيدة دينيه مثل الاسلام والمسيحيه واليهوديه والبوذيه<br />وليست عقيدة اقتصايه مثل الراس ماليه والاشتراكيه<br />ولكنها تصنيف عرقى<br />والعرق السامى يضم بين افراده جميع العقائد الدينيه والاقتصاديه وغيرها من عقائد انسانيه<br />فالعرب مثلا كلهم ساميون على اختلاف عقائدهم الدينيه<br />والاسلام كعقيدة دينيه مثل المسيحيه والهويدهخ يضم بين اتباعه جمع الاعراق الانسانيه<br />فهناك اليهودى المغولى ( كل يهود شرق آسيا ) واليهودى الزنجى ( كل يهود افريقيا ) واليهودى الابيض ( كل يهود اوروبا )<br />فلو اقتصرنا تعريف العداء للساميه على حقيقته كعداء لعرق بشرى<br />تكون اسرائيل كلها على راس قائمه المتهمين بالعداء للساميه من منطلق عداءها للعرب الساميين<br />ولكن<br />فى اعقاب الحرب العالميه الثانيه<br />ونجاح اليهود باقناع العالم الغربى بصدق اكاذيبهم عن تعرضهم لخطر الابادة على يد القوات الالمانيه فيما اتفق على تسميته بالهولوكوست اليهودى<br />وفى ظل سيطرة يهوديه قويه على وسائل الاعلام الغربى<br />وفى ظل سيطرة يهوديه قويه على البنوك والمؤسسات الماليه الكبرى فى الغرب والتى انتقلت لتتحول الى سيطرة قويه على السلطات السياسيه فى الغرب وامريكا<br />وفى ظل الجبروت الامريكى الغربى فى العالم<br />تحولت تهمه العداء للساميه لتقتصر على العداء لليهود عموما واسرائيل تحديدا<br />رغم مخالفه ذلك للمنطق والعلم والواقع<br />فاصبحت اى محاوله لكشف الخطر اليهودى على العالم كله عداء للساميه<br />واصبحت اى محاوله لفضح اكذوبه الهولوكوست اليهودى عداء للساميه<br />واصبحت اى محاوله لكشف حقيقه الاجرام الاسرائيلى الحقير فى حق الامه العربيه عداء للساميه<br />واصبحت اى محاوله لكشف الخطر الاسرائيلى على الامه العربيه كلها عداء للساميه<br />لقد اصبحت هذه التهمه الظالمه سيف مسلط على رقاب كل الشرفاء فى العالم فى ظل الجبروت الامريكى ليتجنبوا مواجهه الخطر اليهودى على العالم كله<br />ويتجنبوا التصدى للاجرام الاسرائيلى على الامه العربيه<br />ويتجنبوا محاوله افاقه الامه العربيه للتصدى للخطر الاسرائيلى الكبير عليها<br />المدهش والمريب فى الامر<br />ان النظام المصرى اصيب بالخرس الغبى فلم تصدر منه كلمه واحدة ترفض هذا التصرف الامريكى الحقير<br />واصيب الاعلام الرسمى العربى بالخرس المهين وكان هذا الاتهام الحقير لم يوجه لاثنين من اكبر الصحفيين العرب<br />وللعالم كله اقول<br />كلنا مصطفى بكرى<br />كلنا محمود بكرى<br />لن نخشى ارهابكم<br />وسنصرخ دائما بالحق فى وجه العالم كله<br />اليهود حقيقى وكبير على العالم كله<br />واسرائيل خطر حقيقى وكير على الامه العربيه كلها<br />ولن نصمت<br />ستظل كلماتنا تصرخ<br />اسرائيل كيان غريب وحقير تم زرعه بالقوة والظلم والجبروت فى ارضنا<br />ولن نهدأ حتى نطهر هذه الارض منه<br />تحيه للفارس المصرى الشجاع الاستاذ مصطفى بكرى<br />تحيه للفارس المصرى الشجاع الاستاذ محمود بكرى<br />كلنا معكم"
archived = "2010-03-14"
capture_url = ""

