[[comments]]
order = 50
subject = "التاريخ السري لمصطفى بكري"
author = "احمد علي حسن- من نجع المعنى -ق"
posted = "2008-01-18"
text = "محمد مصطفى بكري- خريج كلية التربية بقنا- قسم اللغة العربية بتقدير مقبول -عام<br />1977. في مظاهرات 1977الطلاب في نفس العام كان يعمل محمد مصطفي كما كان اسمه في تلك الفترة مرشدا لضابط أمن الدولة بقنا عن الطلاب الذين يقودون المظاهرات. عمل بعدها جاسوسا لأمن الدولة على حزب التجمع. من حزب التجمع التقطه يحي الجمل وعينه مراسلا لمجلة المجاس الكويتية التى كانت ترأس تحريرها هداية السلم الصباح التي ماتت في حادث منذ أعوام قليلة. من التجمع أصبح عضوا في حزب البعث فرع العراق، وكان أيضا جاسوسا لأمن الدولة عن البعثيين المصريين. تزوج بكري من أمرأة قيل أنها كانت مع يحيى الجمل سرا ولما أراد أن يتخلص من المصيبة ألصقها بالصعيدي الهمام. أول مليون دولار دخل جيب مصطفى بكري كان عام 1987 عندما وزع الكتاب الأخضر كملحق في جريدة مصر الفتاة. يومها بدأت علاقته بليبيا وبأحمد قذاف الدم الذي موله منذ ذلك الحين. أحمد قذاف الدم ومن خلال شراكته ممع صفوت الشريف الذي كان مستلما ملف ليبيا قررا إصدار جريد الاسبوع لتخدم مصلحة الرجلين. بعدها بدأ بكري مشروعاته الخاصة على الجنب، منها علاقتة بصدام حسين، ثم علاقته بأمير قطر والجزيرة. مصطفى بكري بدأ ولد غلبان لرجل ضعيف في قرية المعنى كان يسوس خيل ألأشراف في عزية حامد ويسمى عندنا في الصعيد بالكلاف، أي المسئول عن إطعام الماشية. لايستطيع بكري أن يرشح نفسه في قنا لأن أسرته تنتمي إلى عبيد بيت حامد ولايلقي أي إحترام في قنا. فقط جاءه نصيب من الإحترام عندما كان في قنا محافظ فاسد أسمه عادل لبيب أغدق على بكري بالاراضي الزراعية . لذا لايخلو عدد من صحيفة بكري من مدح لعادل لبيب حتى عندما غادر قنا وأصبح محافظ الاسكندرية. سيأتي اليوم الذي تكتشفون فيه أن عادل لبيب هو أكبر محافظ فاسد وأن بكري جاسوس. من يريد المزيد من تفاصيل التاريخ السري لبكري يراسلني على بريد ahmedhassan1@gmail.com"
archived = "2010-03-14"
capture_url = ""

