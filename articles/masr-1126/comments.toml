subject = "قصيدة بكري"
author = "محمود المعناوي"
posted = "2008-09-24"
text = "مصطفى بكري فاسد والعهدة ع الراوي<br />سرق فلوس البلد لا سحر ولا حاوي<br />جاء من قنا \"البطن والجيب خاوي\"<br />سرق أراضي قنا لا حسيب ولا رقيب<br />كل اللى عليه بس يلمع عادل لبيب<br />أهطل ومغرور لا عقل ولا لبيب<br />لو حبيت تعرف راس الفساد اسأل عن عادل لبيب<br />كل فاسد وله ساعة<br />إلا مصطفى بكري له قناة الساعة<br />وبالروح والدم<br />نفدي فلوس قذاف الدم<br />روح ياشيخ بلا وطن بلا هم<br />المهم الجيب يتملي ملايين<br />من عيل صايع في قنا إلى رئيس تحرير<br />سره مكشوف بس هو اللي فاكر ان سره ف بير"
