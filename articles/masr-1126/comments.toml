text = "نقلا عن جريدة الاسبوع بقلم الاستاذ محمود بكرى رئيس التحرير التنفيذى للاسبوع / لأننا نسير فوق الأشواك&--8238; .. &--8236;ونتصدي للطواغيت&--8238; .. &--8236;ونقتحم حصون الفساد&--8238; .. &--8236;ونقاوم - بإباء - كل دعاوي التفريط في الوطن&--8238; .. &--8236;أو المس بأمنه القومي&--8238; .. &--8236;لأننا نخوض معاركنا لصالح أبناء هذا الشعب&--8238; .. &--8236;ومصرنا التي هي أعز وأغلي لدينا من فلذات أكبادنا&--8238; ..<br />لأننا نفعل ذلك&--8238; .. &--8236;فإن المقابل هو حب الناس&--8238; .. &--8236;واحتواؤنا في أفئدتهم&--8238; .. &--8236;وهو شعور يتملك الغالبية العظمي&--8238; &--8236;من المصريين الشرفاء &--8238;.&--8236;. بيد أنه&--8238; .. &--8236;وكما يقول المثل&--8238; '&--8236;فلكل قاعدة شواذ&--8238;' .. &--8236;والشواذ هنا هم هؤلاء الذين يخرجون علينا بين حين وآخر&--8238; .. &--8236;عبر بعض الاصدارات المشبوهة ومجهولة الهوية والتوجه،&--8238; &--8236;والمرتبطة ببعض دوائر الفساد والانحراف والتآمر علي الوطن&--8238; .. &--8236;أو عبر مواقع مجهولة علي النت تخصص مساحات واسعة&--8238; .. &--8236;لا لتتبني قضية،&--8238; &--8236;أو فكرة&--8238; .. &--8236;تدفع بها عن الوطن بعض مظالمه&--8238; .. &--8236;ولكنها تخصص رسالتها&--8238; .. &--8236;للهجوم علينا&--8238; .. &--8236;علي&--8238; '&--8236;الأسبوع&--8238;' &--8236;ودورها الوطني&--8238; .. &--8236;وعلي رئيس تحريرها وربانها&--8238; '&--8236;مصطفي بكري&--8238;'.&--8236;<br />يختلقون الحكايات التي هي أقرب إلي سيناريوهات الأفلام&--8238; .. &--8236;ويشبعون المواقع والإصدارات بأكاذيب رخيصة&--8238; .. &--8236;وافتراءات وضيعة&--8238; .. &--8236;ينهلون من مستنقع السواد والحقد الذي يملأ نفوسهم&--8238; .. &--8236;ويكسو قلوبهم&--8238; .. &--8236;متصورين أن اطلاق هذه الوقاحات سوف يحقق بعض مآرب أسيادهم في الاساءة إلي&--8238; '&--8236;الأسبوع&--8238;' &--8236;ورئيس تحريرها&--8238; .. &--8236;وان ذلك سوف يؤثر علي مصداقية ما تقوله الصحيفة وكاتبها الأول&--8238; .. &--8236;وكأنهم - لفرط سذاجتهم - &--8236;يتصورون أن الناس يمكن أن&--8238; &--8236;يصدقوا مثل تلك الترىهات والأكاذيب&--8238;.&--8236;<br />ولأننا&--8238; .. &--8236;آلينا علي أنفسنا منذ زمن بعيد&--8238; .. &--8236;ألا ندع ألاعيب الصغار،&--8238; &--8236;والكبار علي السواء تجرفنا عن مسارنا الحقيقي في الدفاع عن هذا الوطن وتبني قضايا شعبه&--8238; .. &--8236;والا نمنح هؤلاء المتاجرين بمصالح الوطن والشعب،&--8238; &--8236;شرف الرد عليهم أو منحهم قيمة لا يستحقونها&--8238; .. &--8236;لذا فنحن نؤثر كما هو عهدنا دائما ألا نرد بما يرفع من شأن هؤلاء&--8238; .. &--8236;الصغار علي وجه التحديد&--8238; .. &--8236;ولكننا نخوض التحدي في كشف أسيادهم،&--8238; &--8236;وتعرية من يؤجرونهم لمثل هذه&--8238; '&--8236;المهام القذرة&--8238;' &--8236;التي لا يقوم بها&--8238; .. &--8236;ولا يقدم عليها إلا من فقد ضميره&--8238; .. &--8236;وطاش صوابه&--8238; .. &--8236;وتحول من إنسان&--8238; .. &--8236;قادر علي التمييز بين الحق والباطل&--8238; .. &--8236;إلي أداة طيعة&--8238; .. &--8236;تؤدي دورها دون وعي&--8238; .. &--8236;تتهجم علي الشرفاء&--8238; .. &--8236;وترتكب كل الجرائم - كبيرها وصغيرها - دون وخزة ضمير&--8238; .. &--8236;أو شعور بالندم&--8238; .. &--8236;فكل ما يعنيهم هو المكسب،&--8238; &--8236;والمقابل،&--8238; &--8236;والمال الحرام الذي تمتلئ به بطونهم الشرهة&--8238; .. &--8236;ونفوسهم المريضة&--8238;.&--8236;<br />نسير في طريقنا&--8238; .. &--8236;غير عابئين بما تقذفه الاقلام الحاقدة&--8238; .. &--8236;والنفوس المريضة&--8238; .. &--8236;بل اننا حين يتصل بنا بعض الأحبة&--8238; .. &--8236;معربين عن دهشتهم لصمتنا عن بعض الافك والسواد الذي يجلل صفحات سوداء لصحف سيارة ومواقع مشبوهة&--8238; .. &--8236;نطالبهم بالصبر&--8238; .. &--8236;فنور الحق لابد قادم يوما&--8238; .. &--8236;وكشاف الصدق لا يضل طريقه مهما جارت الاكاذيب علي الحقائق&--8238; .. &--8236;وتسيدت الافتراءات بعض نفوس مرتكبيها&--8238; .. &--8236;نسير في دربنا&--8238; &--8236;غير عابئين&--8238; .. &--8236;لأننا لا نخشي شيئا&--8238; .. &--8236;فأقلامنا شريفة&--8238; .. &--8236;لا ترتفع إلا لرفعة الوطن&--8238; .. &--8236;ولا تكتب إلا بحبر الواقع&--8238; .. &--8236;ولا تتجه إلا صوب الطريق المستقيم&--8238; .. &--8236;ولا تنحرف أبدا عن مسارها&--8238; .. &--8236;تتخندق فوق خارطة مصرنا العزيزة،&--8238; &--8236;وأمتنا المرهقة&--8238; .. &--8236;والمتعبة&--8238; .. &--8236;لا تقبل أبدا أن تسلك درب الأجنبي&--8238; .. &--8236;أو تستقوي به علي مصالح الوطن&--8238; .. &--8236;مهما عظم حجم الخلاف مع سياسات حكامنا وحكومتنا&--8238; .. &--8236;فدرب الشرف لا يعرف المسارات المنحرفة&--8238; .. &--8236;فنحن ممن يتخندق في قلب الوطن&--8238; .. &--8236;ويدفع الثمن - مهما كان - راضيا&--8238; .. &--8236;ولكن من فوق هذا التراب فقط&--8238;.&--8236;<br />قلوبنا نظيفة&--8238; .. &--8236;لا تحمل حقدا&--8238; .. &--8236;ولا تعرف أمراض العصر&--8238; .. &--8236;ولغة التآمر&--8238; .. &--8236;ولعبة الرقص علي الحبال&--8238; .. &--8236;أو السير مع التيار&--8238; .. &--8236;نحمل للاصدقاء كل المعزىة والتقدير طالما انهم شركاء في درب الوطن&--8238; .. &--8236;ونتحول إلي لهيب لمواجهة المنحرفين والفاقدين للشرعية والباحثين عن الثراء بكل الطرق - أيا كانت&--8238;.&--8236;<br />تلك هي رسالتنا&--8238; .. &--8236;نقولها الآن بعد أن بدأت بعض الأدوات التي تم استئجارها للتعريض ب'الأسبوع&--8238;' &--8236;ورئيس تحريرها تتهاوي،&--8238; &--8236;وتتساقط&--8238; .. &--8236;وتدفع بعمل قدري ثمن كل ما ارتكبته من جرائم&--8238;.&--8236;<br />لقد اعتدنا الا نرد كما اسلفنا القول&--8238; .. &--8236;ولكننا تعودنا منذ زمن بعيد&--8238; .. &--8236;منذ اطلقنا حروبنا ضد الفساد والمفسدين&--8238; .. &--8236;الا نترك من اساء الينا يهنأ بما ربح من مال حرام&--8238; .. &--8236;ولكننا&--8238; .. &--8236;وبقدر ما نتجاهل أمثال هؤلاء الصغار&--8238; .. &--8236;بقدر ما نسلك كل الدروب القانونية والمشروعة لنكشف زيف كل ما ادعوه&--8238; .. &--8236;نتحمل في صبر،&--8238; &--8236;ونتجرع آلام الافتراء والكذب الرخيص&--8238; .. &--8236;ثقة منا في أن أبناء هذا الشعب الصابر المحتسب لا يصدق مثل هذه الترىهات&--8238; .. &--8236;ولكننا نواصل درب ردعهم من خلال المؤسسات القانونية والشرعية&--8238; .. &--8236;حتي يأتي يوم الحساب&--8238; .. &--8236;يوم لا ينفع المال الحرام أصحابه&--8238; .. &--8236;ولا تنفع الاكاذيب دعاتها&--8238; .. &--8236;ولعل ما حدث في الأيام الماضية&--8238; &--8236;،&--8238;. &--8236;عبر تلك الصورة التي نرويها هنا في&--8238; '&--8236;الأسبوع&--8238;' &--8236;بعد سقوط أحد الشتامين والمتهجمين علي الصحيفة متلبسا بالعشرات من جرائم التزوير والنصب والاحتيال&--8238;.. &--8236;لعله خير دليل علي أن الحق أبدا لا يضيع&--8238; .. &--8236;وأن طريق الصدق سينتصر لا محالة&--8238; .. &--8236;وأن الاباطيل والاكاذيب لن تجد سوي السجن،&--8238; &--8236;هو المصير المحتوم لكل من تجرأ وافتري ونشر الافك&--8238; .. &--8236;فهي لحظة الحساب&--8238; .. &--8236;التي وان تأخرت في الدنيا&--8238; .. &--8236;فهي قادمة ولا شك بعد الممات&--8238; .. &--8236;يوم يقف الخلق جميعا أمام رب العزة&--8238; .. &--8236;يسألون عما ارتكبوه في حياتهم من أفعال&--8238; .. &--8236;وآثام&--8238;.&--8236;<br />إنه انتقام القدر&--8238; .. &--8236;وهو درس وعبرة لكل من ارتضوا لأنفسهم أن يكونوا مجرد أدوات&--8238; .. &--8236;تمارس ساديتها دون وازع من ضمير&--8238; .. &--8236;أو خوف من رب العزة سبحانه وتعالي/ وقد تم سقوط المدعو ياسر بركات رئيس تحرير الموجز اخر الشتامون حيث قررت محكمة جنايات الجيزة تغريم ياسر بركات، رئيس تحرير جريدة «الموجز»، مبلغ أربعين ألف جنيه، فى القضية المرفوعة من مصطفى بكرى، رئيس تحرير «الأسبوع»، الذى اتهمه فيها بالسب والقذف فى حقه على صفحات جريدة الموجز.. وأكدت المحكمة فى حكمها إحالة دعوى التعويض للمحكمة المدنية المختصة مع إلزام ياسر بركات بالمصاريف.<br />صدر الحكم من محكمة جنايات الجيزة دائرة &--1633;&--1636;، برئاسة المستشار على عبداللاه طنطاوى، وعضوية المستشارين سليم عبدالحميد، ومحمد جمال عوض."
