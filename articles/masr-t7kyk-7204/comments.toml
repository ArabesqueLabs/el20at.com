[[comments]]
order = 8
subject = "احنا فين"
author = "عامل بسيط مبلط  ببكالويوس تجار"
posted = "2007-09-29"
text = "احنا فين<br />اتخرجنا من كلية التجارة بنفس التقدير - جيد - انا وزميلى<br />زميلى اشتغل فى بنك بمرتب 700 جنية فى الشهر علشان لة واسطة وقرايبة ماسكين وظائف كويسة<br />وانا قعدت سنتين فى البيت ادور على وظيفة والف على اى شغل<br />الاسطى عبدة بيركب بلا ط وقيشانى قال لى بدل القعدة تعال اشتغل صبى معايا وتحضر المونة وتعجن الاسمنت وتناولنى القصعة بتاع الاسمنت باجر يومى 10 جنيهات دة اذا جاء لنا رزق<br />البلد دى لبتوع الواسطة<br />الفقير مالوش مكان<br />يعنى بيصرفوا على الداخلية والامن 13 مليار جنية فى الميزانية فى السنة لو ال 13 مليار جنية بنوا بهم مصانع وشركات تنتج وتبيع والناس تلاقى شغل هيحصل اية<br />العمال عاملين اضراب علشان علشان يرفعوا اجورهم وبرة قوات امن مركزى بياخدوا مرتبات قدهم خمس مرات<br />الامن بيصرف كل دخل الدولة<br />وامن هيعمل اية مع الاضراب<br />انجازات ال 20 سنة اللى فاتت هى تبديد ميزانية الدولة على مليون عسكرى امن مركزى بتجهيزاتهم لضرب الشعب<br />سلام من مقهى النت لكل عمال المحلة"
archived = "2010-03-14"
capture_url = ""

