[[comments]]
order = 6
subject = "10 رمضان - تاني مرة"
author = "مصري"
posted = "2007-09-28"
text = "الحادث الان من عمال غزل المحلة يحدث في بلدان كثيرة فقيرة او نامية نتيجة التحول الراسمالي فهذه المصانع اسست في وقت الاشتراكية و منظومتها لا تصلح للمنظومة الراسمالية . الحكومة لا تريد ان تتفاهم مع العمال لانها ستعتبر ان هذا تنازل و سيفتح الباب امام اي اعتصمات اخرى - القيادة لا تريد ان تتدخل لانها مشكلة عمالية - نقيب العمال هو نقيب للحكومة لدى العمال - المجلس سيد قراره صائم ولا تعليق - اعضاء الحزب الوطني مشغولون بالانتخابات - هذه ليست اعتصامات الحقيقة ان هذه ثورة - ثورة بيضاء - ثورة الجياع - كانت الاعتصامات من قبل بالمئات - اليوم نراها بالالف - وان لم نهتم غدا تكون بمئات الالف - الحكومة تحتاج الى براجماتية اكثر في التعامل مع المشكلة بدلا من التقليل من شأن البسطاء - هؤلاء لم يجدو قوت يومهم فثارو - على الدولة بكاملها ان تستمع لهم وتشعرهم بأنها حاضرة و ليست الحاضرة الغائبة."
archived = "2010-03-14"
capture_url = ""

