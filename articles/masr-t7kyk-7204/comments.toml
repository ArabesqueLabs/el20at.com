text = "ايها ألأخوة ألأعزاء معلقين ألموضوع وكاتبه صدقونى مفيش فايدة فى هذا الشعب الجبان لامحلة ولا محافظات البلد كلها ولا اضراب ولاغير اضراب سيرجعون ساجدين لقبلة المصنع ورئيس مجلس المصنع ومحافظ ألغربية وسيركعو له ساجدين ويقولون راضينا بما قسمه لنا ادارة المصنع ونحن لادارة ألمصنع لحامدون أيها ألأخوة ألأعزاء مفيش فايدة فينا نسينا ألله فأنسانا أنفسنا وصدق ألله ألعظيم أذ يقول لا يغير ألله ما بقوم حتى يغيرو ما بأنفسهم"
