[[comments]]
order = 4
subject = "تحليل منطقي بقدر الإمكان"
author = "عبد الله المصري"
posted = "2007-09-27"
text = "معلش تحملوا التعليق ده<br />شركة مثل شركة غزل المحلة تنتج بالمليارات وتربح بالمليارات ورغم ذلك عمالها دخلهم في الشهر 150 جنيه .....<br />رئيس مجلس الإدارة طبعا وشلة المديرين (بياخدوا بلاوي بعيد عن السامعين )<br />أحمد عز ( هاتقوللي ايه اللي حشر احمد بيه عز في الموضوع )<br />اقولك ان احمد بيه عز ( وبيه دي علشان هوه صاحب جمال افندي سوزان) ده هو وأمثاله مثال نموذجي للناس اللي ما عندهمش رحمة ياكلوا مليارات ويسرقوا البلد جهارا نهارا والعامل أبو 150 جنيه لما يقول انا جعان وعايز آكل يرسلوا عليه كلاب الأمن المركزي المسعورة ( انا اقصد الضباط وليس الجنود والله ) فالجنود هم العصا واليد هي الضابط الكلب المسعور وابن الكلب ايضا<br />خلاص يا مصر بقيتي كده ...... يا إما سرقة عيني عينك وبأمر ابن الريس ومراته والريس من وراهم طبعا ( لا ننكر دورة الفعال في عمليات السرقة المنظمة لموارد البلاد والعباد )<br />يا أما ضرب في المليان لدرجة اعطاء الأوامر لكلاب الأمن المركزي بقتل المعتصمين الجعانين الصايمين<br />أي جبروت تعيشه هذه العائلة الفرعونية الملعونة<br />الله يحرق قلبهم على ابنهم اللي على رأي صاحبنا اللي فوق قارفيننا بيه ليل ونهار وهايموتوا نص الشعب علشان يمسكوه ريس على النص اللي باقي<br />وعجبي عليكي يا مصر متى ارى فيكي رجالة زي رجالة غزل المحلة ؟؟؟؟؟؟"
archived = "2010-03-14"
capture_url = ""

