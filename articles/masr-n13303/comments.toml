subject = "اخرتك السجن"
author = "ها ها ها ها"
posted = "2007-12-09"
text = "انت بتقولى ان فاطمة كان عندها مجوهرات واتبرعت بيها لبناء جامعة لخدمة الناس وان الست زلمكة عندها مجوهرات جاية هدايا من الخليج ومش عايزة تتبرع بيها<br />يا لهوى على كلامك<br />يا لهوى"
