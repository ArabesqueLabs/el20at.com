[[comments]]
order = 4
subject = "و مضت ايام الؤلؤ"
author = "نيفين نيفى نوفا"
posted = "2007-12-10"
text = "المشكله يا دعاء مش فى ان فيه مجوهرات او لا المشكله فين روح الاميرات<br />الروح الرفيعه الساميه اللى تتبرع و تضحى و تؤمن بالعمل العام و تراعى وجود الاخر المحتاج<br />الاميره فاطمه و غيرها من الاميرات دول علامات زمن جميل مضى<br />زمن لن يعود و لكننا سنظل نقرا عنه فى الكتب و نشاهده ف المسلسلات<br />و يمكن اللى شاف لقاء عمرو اديب مع الاميره فريال مؤخرا ف القاهره اليوم هيفهمنى<br />و مضت ايام الؤلؤ على راى احسان عبد القدوس"
archived = "2007-12-11"
capture_url = "https://web.archive.org/web/20071211164921/http://masr.20at.com:80/newArticle.php?sid=13303"

[[comments]]
order = 5
subject = "اصحاب المجوهرات فين"
author = "ابو لؤلؤة المجوسى"
posted = "2007-12-12"
text = "انتى سمعتى عن ماليندا زوجة ماركوس بتاع الفلبين ان كان عندها 4000 جزمة حريمى من كل الموضات ومن باريس وان الملحق الثقافى فى باريس كان بيشتريهم لها ويبعتهم فى الحقائب الدبلوماسية للعاصمة مانيلا<br />ومع ان الشعب الفليبينى كلة مساكين والمثقفات منهم بيشتغلوا خدم فى دول الخليج يعنى تقدرى تقولى شعب من الخدم والممرضات الفلبينيات فى كل مكان وحتى مصر فيها خدامات فليبينيات ب 400 دولار فى الشهر<br />الانظمة البوليسية الديكتاتورية محدش بيتبرع رغم فقر الشعب انما كلة بيسرق<br />يتولون الوظائف العامة ليتكسبوا من ورائها ويتلقون الهدايا<br />لا تذكرى عهد مضى بكل جمالة<br />ولا تقارنى الاميرات بممرضات الفلبين<br />الدنيا ارزاق"
archived = "2010-03-14"
capture_url = ""
