posted = "2007-12-08"
text = "السلام عليكم يا دعاء<br />ازيك و ازاي البنوتة؟<br />يا شيخة ضحكتيني علي الصبح ,هي مين اللي معاها مجوهرات دي ؟؟؟؟ ده جرام الدهب ب 123 جنيه!!!!!!!!!!<br />اهااااااااااااااه يا بلد عايزة جردل بنزين و عود كبرييييييييت"
