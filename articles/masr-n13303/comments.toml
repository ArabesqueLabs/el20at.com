[[comments]]
order = 1
subject = "لا فيه مجوهرات ونص"
author = "خاتم سليمان"
posted = "2007-12-08"
text = "ازاي مفيش مجوهرات ايوة فيه مجوهرات تكفي حل مشاكل البلد كلها لو اتباعت او حتى اتاجرت انا مختلف مع الاخ اللي فوقي خالص اذا كان خاتم جواز الست خديجة بارقام فلكية وفستانها معرفش بكم واتعمل فين يبقى ازاي مفش مجوهرات يعني واصلا اللي بيلبسوا الدهب دول الفقرا يا عمنا وبيتيهالي هي مش قصدها الفقرا خالص"
archived = "2007-12-11"
capture_url = "https://web.archive.org/web/20071211164921/http://masr.20at.com:80/newArticle.php?sid=13303"

[[comments]]
