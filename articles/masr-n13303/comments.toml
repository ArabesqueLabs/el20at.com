subject = "براوة"
author = "خريج جامعة"
posted = "2007-12-08"
text = "والله العظيم فكرة حلوة موضوع التبرع بالمجوهرات دي انا اول مرة اعرف اي حاجة عن الست فاطمة دي والواحد دخل الجامة واتخرج منها ولا الهوا حتى مفكروش يعملوا لها تمثال كده الست الكمل دي ولا خلاص بقى ابعوها ونسيوها ...الله يرحم الجميع"
archived = "2007-12-11"
capture_url = "https://web.archive.org/web/20071211164921/http://masr.20at.com:80/newArticle.php?sid=13303"

