author = "كلام فى حسن البنا"
posted = "2009-08-30"
text = "هل فى الوضع الحالى ممكن يظهر شخصية زى شخصية حسن البنا ؟<br />مستحيل<br />لية ؟<br />لان حسن البنا لما ظهر فى الثلاثينات كان الفساد الاخلاقى فى كل مكان<br />كانت بيوت الدعارة مرخصة من الحكومة ومنتشرة فى كل الشوارع<br />وكانت خمارات الخواجة ينى منتشرة فى كل مكان ووصلت حتى القرى<br />كان اربعة اخماس سكان مدينة الاسكندرية من الخواجات الايطاليين واليونانيين وبتوع مالطة والخمارات والنساء الساقطات تسرح وتمرح<br />ومدينة الاسماعيلية التى نشا البنا فيها كانت مدينة فرنسية والسويس وبورسعيد انجليزية ومسموح للمصريين العيش فى احياء الاربعين فيها فقط<br />حسن البنا ليس رجل دين<br />ولكنة شاب تخرج من كلية دار العلوم واشتغل مدرسا للغة العربية<br />هالة الفسادوالفجور فى كل مكان<br />وكبار الراسماليين والاقطاعيين اجانب ويهود<br />ثار<br />ولكن البطل الذى غير كل تلك الصورة والغى البغاء والترخيص ومصر كل شىء هو البطل جمال عبد الناصر<br />وجاءت الجماعات الاسلامية لتعيد اسلمة مصر<br />الفضل لجمال عبد الناصر وللجماعات الاسلامية التى نمت فى عصر السادات والتى حارب بها الناصريون<br />حسن البنا ليس رجل دين<br />ولكنة رجل صرخ فى البرية<br />انقذوا مصر<br />هكذا صرخ<br />هريدى الصعيدى"
archived = "2010-03-14"
