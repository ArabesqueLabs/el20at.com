archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"

[[comments]]
order = 12
subject = "70؟؟؟؟"
author = "ريما"
text = "كل عامو انتو بخير<br />ومش كتير يا دعاء 70؟ الله يكون عون حماتك<br />مبروك يا نوفا...و عقبال ما نفرح بالنونو الصغير...اخبار الماستر ايه؟"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"

[[comments]]
order = 13
subject = "حبايبى يا غاليين"
author = "نيفين نيفى نوفا"
text = "و الله حبايبى يا غاليين على راى فريد<br />لما اقول غاليين يبقى هوبه..اولا الله يبارك فيكى يا هوبه و لما هنتقابل هحكيللك كل حاجه علشان الموضوع كبير<br />وصلتنى ال offline<br />يا هوبه و زى ما تفقنا بعد العيد<br />متنسيش يا بت<br />و ريما ميرسى يا رورو و انتى بالمناسبه وحشانى<br />فينك بقى<br />بالنسبه للمجستير يبقى التعد<br />يل فى البلا للمره المليون على ما هو عليه و على المتضرر اللى هو حضرتى انى اخبط راسى ف اجمد حيطه<br />لسه متعطله و الله يا ريما ادعيلى<br />انا فعلا محتاجه دعوات الناس اللى بيحبونى ف الموقع"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"

[[comments]]
order = 14
subject = "انت الي وحشاني يا نوفا"
author = "ريما"
text = "ان شاء الله خير يا نوفا و بكرة تاخدي و رينا يفرحك<br />انا عقبال عندك انشغلت بالبابي... صار عندي بنوتة زي القمر...طبعا ا انا امها شو رح اقول يعني؟...هههه<br />و انزلت على عمان و ارجعت من شهر... بس هالعصفورة ماخدة كل وقتي... بكرة تجربي ان شاء الله"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"
