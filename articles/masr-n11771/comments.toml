[[comments]]
order = 8
subject = "الى احمد كمال معاك و لكن"
author = "نيفين نيفى نوفا"
text = "اولا الاخ اللى طالب يتجوزنى معلش انا انكتب كتابى للاسف<br />لو كنت جيت بدرى شويه<br />ما علينا<br />بالنسبه لكلام استاذ احمد كمال كلامك جميل جدا و زياره المقابر اكيد عظه و تذكره بالموت و فعلا بتريح النفس لانها بتفكرنا _و ان بكينا_باحبابنا بس انا بدعوك و بدعو كل الشباب اننا ف العيد و العيد بالذات نزور دور الايتام و دور المسنين لان صدقنى الناس دى سواء الاطفال الايتام او المسنين بيبقو فعلا مفتقدين احساس اللمه و العيله<br />و يا رب محدش ينحرم من الاحساس ده ابدا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"

[[comments]]
order = 9
subject = "عارفه يا بت يا نوفا"
author = "هوووووووووبه"
text = "دا تالت رمضان يعدي عليا بره مصر مش عايزه اقولك احساسي ايه<br />كل الللي حواليا فاطرين ومفيش احساس برمضان خالص مالص<br />وكل ما انيجي نعرف الادان نجري علي النتيجه لا في اذان ولا ديولو دا غير اللمه وماما واخواتي اااااااااه يا بت<br />يلا انا شاء الله رمضان اللي جاي نزله ومبروك كتب الكتاب يا نوفا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"

[[comments]]
order = 10
subject = "ضحيك هنايا فداه وحعيش على ذكراه"
author = "عاشق نفين"
text = "معلش يا نفين<br />يا هناه يا سعده اللي حيتجوزك<br />امه دعياله في ليلة القدر<br />انه اتجوز واحدة بالرئة والجمال بتوع حضرتك<br />وما عنديش حاجه اقولها خير اني اتمنى اني اشوفك سعيدة<br />وضحيت هنايا فداه وحعيش على ذكراه<br />وما اتحرمش من اني اقرأ تعليقاتك ابدا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"

[[comments]]
