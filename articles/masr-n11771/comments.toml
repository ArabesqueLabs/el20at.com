[[comments]]
order = 4
subject = "ربنا يزيد و يبارك"
author = "نيفين نيفى نوفا"
text = "اولا ازيك يه دعاء و كنت بعت تهنئه متاخره برمضان لكل العشريناتيه فى استفتاء المسلسلات بس دى فرصه اقوللك بنفسى رمضان كريم و ليكى و للبراء<br />اللى بتوصفيه ف موضوعك ده بيحصل فى اى افطار او حتى تجمع عادى لعيلتنا<br />و الله كانك بتتكلمى بلسانى<br />هنقول ايه<br />هى دى العيله المصريه"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"

[[comments]]
order = 5
subject = "انت فين"
author = "احمد كمال"
text = "هى دى مصر يا دعاء<br />بنحب اللمة ونحب الونس ونحب ريحة الريحة من قرايبنا<br />وفى رمضان يا دعاء والعيد لنا تقاليد<br />بنروح المقابر بعد صلاة العيد<br />وبنرجع من هناك على بيت اللى مات لة قريب ونعيد على اهلة ونواسيهم ونحسسهم ان لهم اهل<br />بنعلم اطفالنا زى اجدادنا ما علمونا انهم من غيرنا يروحوا بنفسهم يعيدوا على اعمامهم وعماتهم وخالهم وخالتهم<br />العيلة لها معنى عندنا<br />وفى صوان الميتم بتلاقى كل العيلة واقفين بياخدوا العزاء<br />وبتلا قى الستات مع بعض<br />بنحب التجمع فى المناسبات السعيدة<br />انا فى احد المرات قطعت الف كيلوا متر علشان امى قالت لى عايز اشوفك وقعدت معاهاساعتين بس<br />دى عادتنا ودى تقاليدنا<br />احنا مش خواجات<br />مطلوب نعلم اطفالنا اللمة ويعرفوا واجب العيلة الكبيرة<br />بكدة تبقى الحياة لها طعم ومعنى<br />شكرا ياست دعاء على موضوعك اللطيف<br />ماهو انت برضة ست من مصر"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120415/http://masr.20at.com:80/newArticle.php?sid=11771"

