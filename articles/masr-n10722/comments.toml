[[comments]]
order = 2
subject = "اجمل القناديل"
author = "نيفين نيفى نوفا"
text = "موضوعك جميل يل استاذ محمد و طبعا كل القناديل و منها محمد قنديل صاحب الرائعه 3 سلامات على راسنا من فوق<br />و لكن اسمحلى ان اقول ان اجمل و اعظم القناديل هو الاعلامى و الاستاذ و الصوت الذى يصل رغم انف الجميع الجميل حمدى قنديل<br />لكم اقدر هذا الرجل و احترمه و اعتبره فعلا صوتا اراد له الكثيرون ان يصمت و لكن ابى الا انه يوصل صوته<br />كنت اتابعه على القناه الثانيه ف التليفزبيون المصرى فى رئيس التحرير و الان اتابعه فى قلم رصاص على دبى<br />و اريد ان انتهز الفرصه لاوجه لهذا الرجل كل اخترام و تقدير و ان اقول له عفوا يا استاذ فهذا قدر الاشجارالمثمره"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625201239/http://masr.20at.com:80/newArticle.php?sid=10722"

