subject = "ضياع دلتا النيل اصبح من المؤكد والثابت"
author = "مصرى"
posted = "2009-03-03"
text = "كانت قريتى على احدى فروع النيل تبعد عن المدينة المجاورة 3 كيلومترات وتبعد اربعة كيلوميترات عن القرية التى تليها<br />كان ذلك من عشرين سنة<br />الان الصورة مختلفة<br />اصبحت قريتى احد احياء المدينة المجاورة واتصلت عمرانيا وبالمبانى بالقرية التى تليها<br />ضاعت الاف الافدنة الزراعية فى البناء رغم تجريم البناء على الارض الزراعية قانونا ولكن للاسف يطبق على الغلابة - انما لو مشيت حالك ودفعت المعلوم هتبنى فى اجدع حتة انت عايزها<br />واصبحت بيوت القرية مكونة من ثلاثة او اربعة طوابق<br />مطلوب فورا لان الذى يحدث كارثة<br />اعطاء الارض الصحراوية فى المدن الجديدة للناس تبنى عليها وبالمجان بعد عمل التقسيمات والشوارع والتخطيط<br />مطلوب جذب الناس الى الصحراء وايجاد فرص عمل لهم هناك وباقصى سرعة<br />غير معقول ان يصبح تعداد محافظة الدقهلية اكثر من اربعة ونصف مليون<br />والغربية 4 ملايين انسان<br />الخروج الى الصحراء هو الحل والمطلوب سريعا"
archived = "2010-03-14"
