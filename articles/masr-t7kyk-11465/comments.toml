subject = "ابني بيتك بالحداقه والفهلوه"
author = "مش حدق"
posted = "2009-03-03"
text = "مرة واحد كان عايش يفصل بدله ومعهوش فلوس فراح اشترى متر قماش واحد وراح للترزي علشان خاطر يفصله بدله<br />فقال له الترزي ازاي حفصل متر واحد بدله فقال له الرجل بالحداقه والفهلوه<br />فالترزي عمله بدله صغيرة جدا واعطاها للرجل<br />فالرجل قال له ازاي دا وانا حلبسها ازاي<br />فقال له الترزي بالحداقه والفهلوه<br />كذلك كل واحد يبني بيته بالحداقه والفهلوه<br />شد حيلك يا ابو حنفي يا محمود"
archived = "2010-03-14"
