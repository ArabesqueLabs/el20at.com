text = "كنت لا اصدق اننى سأرجع لاستخدام وابور الجاز تانى زى جدتى ولكن ازمة الانابيب رجعتنى لة تانى وهو دة الفكر الجديد<br />وستأتى ازمة البنزين قريبا ونركب الحنطور ونتحنطر<br />ويمكن يحصل ازمة فى البلاستيك كان نصدرة لاسرائيل مثلا ونرجع تانى للقباقيب<br />مين عارف<br />الازمة الجاية هتكون فى اية<br />المهم احنا عرفنا مكانك فجهز شوية قباقيب يمكن نستخدمهم فى قتل شجرة الدر"
