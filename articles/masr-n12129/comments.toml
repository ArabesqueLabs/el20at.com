[[comments]]
order = 0
subject = "أنا عارف مين اللي حياخد الجايزة"
author = "طالب جامعي معدته مهرية ولا مؤا"
posted = "2007-10-28"
text = "هوة مطعم هوهو بتاع المجمع النظري في الشاطبي طبعا هوة اللي حياخدها<br />دي مفيهاش كلام<br />أي نعم بيقلوا بزيت عربية و و مش مهتمين بالكلام المكلكع عن النظافة و الهبل ده كله<br />بس كل من هنا و ادعي لهم من هنا<br />و أبقي خد بالك من ديلك بعد كده"
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194154/http://masr.20at.com:80/newArticle.php?sid=12129"

