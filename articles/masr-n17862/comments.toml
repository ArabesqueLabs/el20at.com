author = "mohammed"
posted = "2008-10-16"
text = "والله نفس اللى حصل معايا بالضبط ونفس الشعور كل الفرق انى كملت السيجارة وماسيبتهاش اللا لما خلصت وبعدها والله كنت عايز اضرب نفسي علقة بس مش عارف واحتنقرت نفسي جدا وقعدت اضيع فى ريحة الدخان بأساليب كتيرة اشي نعناع ولبان وعصير وبيبسي وخلافه المهم زعلت جدا من نفسي يوميها وقررت ان شاء الله ما اقربش منها خاصة وانى ممكن اتعود عليها وتبقى مصيبة<br />الحمد لله انى ما جربتهاش تاني وشكرا ليك برضه __ وعلى فكرة اللى نفسه يجرب مفيهاش حاجة تعجب حد ومقرفة جدا بجد وخطوة مالهاش أى لزمة"
archived = "2011-06-10"
capture_url = "https://web.archive.org/web/20110610171237/http://www.20at.com:80/20at/arts/10235.html"

