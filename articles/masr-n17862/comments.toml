text = "دة انت بتحسى بشعور امى وجدتى - الكلام دة كان زمان وزمان قوى<br />الم ترى بنات الطبقة الهاى كلاس بيشربوا شيشة فى اى كافى شوب فى الفنادق وبيدخنوا امام الجميع بلذة وشعور بالسعادة ومفيش حكاية الذنب والغلط اللى انت شاعرة بيهم<br />سيجارة اية يا ست انتى<br />الشيشة دلوقتى هى الموضة وزى الفل"
