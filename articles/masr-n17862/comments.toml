[[comments]]
order = 12
subject = ""
author = "مش كاتب"
posted = "2008-10-14"
text = "انا في وقت من الاوقات كنت بشرب سجاير ولكن مش بكثره<br />وبعدين فوجئت بانني اصبحت عبدا للسيجارة وفوجئت بان السيجارة بدأت بعد ما اشرقبها بتتعبني اكتر<br />وهنا تدخل العزم والتصميم والارادة وذات مرة قررت ان انقطع عنها ولو السما انطبقت على الارض<br />ونجحت والحمد لله<br />لكن فيه عوامل مساعدة وخصوصا قبل النوم لان انت لو بطلت السجائر اكيد من حتعرف تنام<br />تشرب الاعصاب المهدئة مثل (التليو) و(الينسون) و(الحليب) الطازج النقي قبل النوم و(النعناع)<br />كل دي اشياء سوف تساعدك عن الاقلاع عن التدخين<br />بس الاهم من هذا كله الارادة القوية المتينة والتصميم<br />ولا للضعف والتخاذل<br />وزي ما قلتلك كل ما تحس انك مشدود للسيجارة اشرب الاعشاب المهدئة (التليو والينسون والبابوننج) واللبن الحليب الطازج النقي مفيد جدا قبل النوم لانك لو بطلت السجائر مش حيجيلك نوم<br />وهذا عن تجربة شخصية<br />وربنا يوفقك"
archived = "2011-06-10"
capture_url = "https://web.archive.org/web/20110610171237/http://www.20at.com:80/20at/arts/10235.html"

