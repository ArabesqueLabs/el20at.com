text = "تتقدم وزارة الصحه للسيده ولاء الشملول بوافر الشكر والتقدير لمساندتها فى حملتها ضد التدخين00<br />كما يتقدم الاخ حمدى اللول اشهر من تم تصويره على علب السجاير وهو فى الغيبوبع الى الاخت الفاضله<br />ويدعوها لاخد صوره معه لنشرها على العلب 00"
