text = "اممممم عارفه ياولاء اول سيجاره كانت لما خالو جه عندنا مره البيت وكان بيدخن امت انا واختي هدير مسكين بقي السجاره وعمالين قال ايه بندخن يعني مين اللي شافنا بابا وهو جاي لاقي رحتنا سجاير وكم امن الاسئله والشتائم والعلقه سخنه محترمه اه والله المهم انا لسه من كام يوم شايفه البتين دول<br />لما تلاقي البانجو في ايد حفيدو<br />والناحيه التانيه المطواه في ايدو<br />يبقي انت اكيد اكيد في مصر<br />وسلام يا كميل"
archived = "2011-06-10"
capture_url = "https://web.archive.org/web/20110610171237/http://www.20at.com:80/20at/arts/10235.html"

