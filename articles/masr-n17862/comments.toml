posted = "2008-11-10"
text = "اولا السيجاره بتلفت نظر اى شخص<br />ثانياشكلها كده جميل ولزيز وبتحس وانت بتشربها انك فوق فوق فوق ولا واحد فيكوا هيجى تحت ركابنا كده بشبريين<br />ثالثا لما بتكون مخنوق من حد ومليت منه اشرب سيجاره هلاقى انك بتاثر فيه وبدا يركز ف كلامك<br />رابعا كل اللى بيشربوا السجاير متفوقين ومن عظماء التاريخ كانوا مدخنين<br />خامسا التدخين مش حرام… التحريم لا يجوز الا بنص ,,,ونص التحريم غير متطابق مع السجائر<br />سادسا ف موضوع انها بفلوس وبتاثر ف الميزانيه… طيب ماكل حاجه ف الدنيا بفلووس وبتاثر ف الميزانيه"
archived = "2011-06-10"
capture_url = "https://web.archive.org/web/20110610171237/http://www.20at.com:80/20at/arts/10235.html"

