posted = "2008-10-21"
text = "إلى ميدو<br />دماغ ايه اللى بتظبطها؟<br />قصدي بتقضي عليها<br />دى بتجيب 80 مرض<br />اشهرهم سرطان الرئة<br />وانا شخصيا اعرف اتنين ماتوا بسبب السجاير<br />السجائر مهلكة للصحة والمال<br />وحرام شرعاً لأنها مضرة للنفس والآخرين والبيئة والمال<br />دا غير ان المدخن شخص متخلف غير متحضر<br />المتحضر لا يدخن"
archived = "2011-06-10"
