text = "والله حاجة تغيظ تعليقات البشر بقت غريبة<br />انت بتكتب رقم موبايلك ومنتظر ان حد هيعبرك ؟ روح يبني لدكتور نفسي يساعدك في مشكلة الاخلاق قبل مشكلة التدخين<br />دي قصة لو بتفهم روح ليوسف السباعي يحل ليك مشكلة النفاق !! مش هو كتب رواية أرض النفاق؟"
archived = "2011-06-10"
capture_url = "https://web.archive.org/web/20110610171237/http://www.20at.com:80/20at/arts/10235.html"

