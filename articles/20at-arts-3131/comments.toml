[[comments]]
order = 9
subject = "كالعاده رحت و كالعاده فلست"
author = "نيفين نيفى نوفا"
posted = "2007-02-01"
text = "و الله يا براء عندك حق ف كتير م اللى قلته<br />كالعاده رحت و ف عقلى انا و اصحابى من المجانين اللى بيصرفو فلوسهم ع الكتب رحنا وف عقلنا كتب معينه و خرجنا بكتب تانيه خالص فيما عدا حصولى اخيرا على نسخه حديثه و جيده الطبع من طوق الحمامه و بسعر كويس 15 جنيه بعد الخصم<br />روايه الاسوانى شيكاغو مغرقه المعرض فعلا بس اصدقاء وعدون انى استلفها فقل اوفر<br />و كالعاده حاولت اقول لنفسى كفايه انيس منصور و مقدرتش<br />و كالعاده حاولت اثنى نفسى من الاتجاه لكتب الادب الانجليزى و الاسعار نااااااااااار يا حبيبى ناااااار بس ما باليد حيله<br />المهم الواحد بيخرج من المعرض و هو بيقول و كل ذى عقل يشقى بعقله و اخو الجهاله ف السعاده ينعم<br />يا رب اكون قلتها صح<br />و بالنسبه لريما صدقينى و الله انا اشتلريت كتب مش عارفه هقراها امتى<br />المجستير خلص على جيبى و عقلى و حياتى كلها"
archived = "2010-03-14"
capture_url = ""

