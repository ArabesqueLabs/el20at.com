subject = "مكتبات ممنوعة زلازم تاخدوا بالكم"
author = "ياسر أبو عمار"
posted = "2007-01-29"
text = "لازم كل اللى رايح معرض الكتاب السنة دى يلاحظ ان فيه دور نشر قهر اصحابها وقبض عليهم وتم التحفظ على اموالهم وتشميع مكتباتهم وخسارتهم مبالغ طائلة قبل معرض الكتاب ،لانهم حرموا من المشاركة ،ومن هذه المكتبات \"دار التوزيع والنشر الإسلامية \"فى الوقت الذى يتاح فيه ذلك لدور نشر \"ولا بلاش احسن بعضهم يعمل حملة ضدى وانا مش رايق ارد على حملات الايام دى \"طبعا فهمتوا انا قصدى على مين ،كما يتم افساح المجال امام المجلات والكتب الاباحية حتى انك يمكن ان تشترى منها ما يكفيك لمدة 10 سنوات دون ان يعترض احد على ذلك ،اما دور النشر المحترمة فلانها قريبة من الاخوان يتم قطع ارزاق اصحابها والتحفظ على اموالهم ،وتشريد مئات العاملين فيها ،حسبى الله ونعم الوكيل ."
archived = "2010-03-14"
