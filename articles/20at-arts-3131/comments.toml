[[comments]]
order = 0
subject = "بجد حسدتك"
author = "ريما"
posted = "2007-01-27"
text = "تعرف يا براء انتو في مصر بنعمة كبيرة... توافر الكتب الادبية عندكم بهالشكل شي بثير حسدي ... تعرف صعوبة انك تحصل على كتاب بسعر معقول برة مصر؟<br />يوم دخلت الجامعة كانت فرحتي لكبيرة بشوفة المكتبة الجامعية... قضيت اول فصل و انا رايحة جاية استعير برويات ادبية... اصلي بحب هي النوعية من الكتب.. و لخيبة املي اكتشفت بعد سنتي الاولى اني تقريبا قرات كل الي بالمكتبة ... اصل مكتبة الجامعة كانت صغيرة و عالقد... و اهتديت اني اروح مكتبة الجامعة الاردنية... بس للاسف ممنوع دخولها الا لطلاب الجامعة الاردنية و حتى لما عملت بحث التخرج و احتجت بعض مراجع من هناك اطريت اترجا الامن يدخلوني رغم اني بحمل هوية جامعتي الي بتثبت اني طالبة و المفروض ان ابواب المكتبة مفتوحة لجميع الطلبة بغض النظر عن الجامعة الي بنتمو اليها... و قررت بعد هيك انضم لمكتبة عامة هي الاشهر بالاردن و هي مكتبة شومان... و للاسف برغم المجهود الذي يشكر عليه مؤسس هالمكتبة الي بتسمح للعامة الاستفادة من كتبها باشتراك رمزي قابل للاسترداد باي وقت الا انها ايضا كانت بضم عدد محدود من الرويات<br />وطبعا شراء الكتب من محلات بيع الكتب بكلف كتير... يعني رواية لاحلام مستغماني دفعت فيها 15 دينار ... يعني 150 جنية على اخر صرف للدينار مقابل الجنيه حسب معرفتي... فتيجي تحكيلي انك شاري رواية ب 8 جنيه يعني 80 قرش عنا... اسمحلي كيف ما بدي احسدك... اما معارض الكتاب الي بتعمل عنا فقلتها احسن ممنهاش فايدة لا بنوعية الكتب الي بتعرض و لا بالسعار العالية لهلكتب..... الله يسامحك رفعت ضغطي و انا صحتي مش مستحملة<br />و يارب ما اصيبكم بالعين و تصفوا زينا و اخد خطيتكم"
archived = "2010-03-14"
capture_url = ""

