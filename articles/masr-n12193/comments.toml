subject = "بلد بنت ستين ........"
author = "مخنوووووووق"
text = "بلد زبالة وحكومة زبالة وريس نصاب وشعب غلبان<br />كفاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااايه بقى<br />يارب خلصنا منه<br />يارب بقالنا سنين فى ظلم واستبداد<br />يارب لتاخد الشعب كلة وتريح الحكومة<br />لتاخد الريس والحكومة وتريحنا"
archived = "2007-10-31"
