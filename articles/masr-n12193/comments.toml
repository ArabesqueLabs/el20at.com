order = 1
subject = "المستحمر"
author = "لسيد"
text = "قرفنا من كلمة المثتثمر وصحتها المستعمر او المستحمر<br />وكلة على كلة بيتكلم فى الاستثمار والاستعمار والبركة فى الحمار<br />وانا اشجب سياسة الاستحمار تحت اسم الاستثمار<br />ولا عزاء للحمار"
archived = "2007-10-31"
capture_url = "https://web.archive.org/web/20071031232511/http://masr.20at.com:80/newArticle.php?sid=12193"

