subject = "منكم للة"
author = "بنت مصرية"
posted = "2009-03-24"
text = "حسبنا اللة ونعم الوكيل فى هذة العصابة التى تتولى هذة المناصب وتقف حجر عسرة فى طريق اى تقدم لهذة البلد وضد اىخير قد يفيد هذا الشعب المسكين فمصر بها اعلى نسبة من مرضى السرطان فى العالم وكأن هؤلاء الناس تعمل بالإتفاق مع اليهود لابادة هذا الشعب منكم للة وربنا يخلصنا منكم فى القريب العاجل اللهم اميييييييييين"
