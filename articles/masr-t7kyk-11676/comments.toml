[[comments]]
order = 1
subject = "الى الأخ المتنرفز"
author = "سعيد عطية"
posted = "2009-03-24"
text = "لا تتنرفز اوي كده ، و اعد قراءة الخبر جيداً ستجد ان الكثير من الجهات البحثية المتخصصة قد اجرت تجاربها المستفيضة على الدواء ، وانها اقرت بجدواه .<br />حقيقة تهرب وزارة الصحة من الإعتراف بهذا الدواء وغيره تكمن في مافيا شركات الأدوية العالمية التي يتحكم فيها يهود ، وتدفع رشاوى بمئات الملايين على مستوى العالم كله ، لوأد مثل تلك الأدوية ذات الفاعلية العالية ، لصالح ادويتها التي تباع بمئات المليارات ، وفاعليتها قليلة بحيث تضمن استمرار الشراء واستمرار الأرباح .<br />لسة متنرفز ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2010-03-14"
