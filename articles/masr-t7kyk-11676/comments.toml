[[comments]]
order = 3
subject = "حسبى الله و نعم الوكيل"
author = "مصرى أمه توفت من السرطان"
posted = "2009-03-24"
text = "بسم الله الرحمن الرحيم و الصلاة و السلام على سيدنا رسول الله أما بعد ,,<br />يجب البحث عن المصالح الشخصية و المؤسسية لمن يمنع هذا الدواء و للعلم المعاناة من الادوية الموجودة لعلاج السرطان أسوء من اى تصور - أعاذنا الله و إياكم من هذا المرض - لذا لا يمكن أن يكون الدواء الجديد أكثر سوءاً من الأدوية الموجودة و لمن يريد التأكد عليه التوجه إلى مستشفيات علاج السرطان المجانية و الأقتصادية و الفاخرة."
