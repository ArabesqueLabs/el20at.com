[[comments]]
order = 0
subject = "يجب وضعة فى مصحة عقلية -- هذا  ليس اختراع ولكنة اس"
author = "متنرفز"
posted = "2009-03-24"
text = "اختراع فى بير السلم - كل واحد مهفوف فى دماغة يقول لك انا عملت اختراع - زى اخونا اللى عمل ثلاجة بتشتغل بالفول والفلافل وتانى بيقول لك انا اخترعت حاجة بتمشى على قضبان اسمها ترماى<br />علشان تخترع وكلمة تخترع دى مش مقبولة اطلاقا - علشان تركب دواء معين لازم تكون شركة كبيرة فيها تخصصات كتيرة من الصيادلة والدكاترة المتخصصين بتوع علم الاعضاء ويجروا تجارب على فيران وحيوانات ويصرفوا مبالغ طائلة فى معامل متخصصة ويعرفوا اية التاثيرات الجانبية للدواء وينشروا نتيجة البحث فى مجلة طبية متخصصة ويناقشوا التركيبة فى مؤتمرات علمية<br />هى العملية استروبيا - اى متخلف يقول خدوا التركيبة دى وبعدين يصاب اللى بياخدها بالفشل الكلوى وتسمم الدم والشلل وبعدين يقول لك اختراع<br />بلغوا الشرطة عن هذا المجنون"
archived = "2010-03-14"
