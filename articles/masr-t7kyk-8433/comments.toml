subject = "قارىء فى بطون الكتب"
author = "الفاشل"
posted = "2008-03-11"
text = "كلنا عرفنا ما حدث فى النكسة او الوكسة<br />ومن اسباب النكسة - كما كتب السادة الخبراء المحليون والاجانب - هو وضع القوات على الارض - فقد كان سيادة المشير عامر يتوقع هجوم القوات الاسرائيلية على المحور الجنوبى والذى اوحى لة بذلك عبد المنعم رياض - ثم ان اسرائيل هجمت من الشمال<br />والسبب الثانى ان القيادة الغير رشيدة توقعت هجوم الطيران الاسرائيلى من جهة الشرق فجاء من الغرب من ناحية ليبيا<br />ويقال ايضا ان الفريق رياض هو الذى اغتال المشير بمسدسة<br />اما سبب موتة - فكان فى زيارة للجبهة وكان يستخدم الاسلكى كثيرا الامر الذى حدد الاسرائيليون موقعة وقاموا بقصفة بالمدفعية قصفة مركزة<br />استغلت القيادة الناصرية موتة لتمحى قصة هروب الضباط من الميدان وقالوا رئيس اركان الجيش مات فى خندق على الجبهة<br />وطبعا ممكن تقرأوا قصيدة نجم<br />ياما احلى ضباطنا وخبطنا تحت بطاطنا<br />المهم ليس هو الشهيد فقط<br />هناك رجال من القرى والنجوع مجهولين صدقوا ما وعدوا اللة بة وماتوا وهم يقاتلون وملتحمون مع العدو واحترقوا مع مدافعهم<br />ولم يتراجعوا خطوة واحدة<br />ومصر غنية برجالها الابطال المغمورين الذين يضحون فى سبيل مصر لا يبغون شهرة ولا مدحا<br />رحم اللة شهداء قواتنا البواسل<br />والنصر دائما لبلدى مصر<br />والناس تعطى حياتها عندما يسود العدل والحق والمساواة"
