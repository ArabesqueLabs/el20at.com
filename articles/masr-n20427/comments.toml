[[comments]]
order = 0
subject = "رحلة فى قاهرة المعز لدين اللـه"
author = "سامى عبد الغفار الباجورى"
text = "ماأجملك يامصر - احبك مهما بعدت عنك - أشتاق البكى والى شوارعك وحورايكى ومساجدك ومتاحفك وهرمك وتاريخك<br />اشتاق الى رؤية أولاد البلد\\ الجدعان - اشتاق لقعدة القهاوى وعبق التاريخ فى السيده والحسين - اشتقت لقلعة محمد على - أشتقت لحةى بولاق - مسقط رأسى ومازلت انتمى لهذا الحى العريق وأقتخر أننى تربيت بين جدرانه - وكم كنت أتمنى أن أكون مع المجموعه الرحاله - وسوف ألقاهم عن قريب - مع تمنياتى لرحله سعيده<br />سامى عبد الغفار الباجورى - مصر بالسعوديه - بريد ( samy@gacpcy.com )"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327230430/http://masr.20at.com:80/newArticle.php?sid=20427"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "احمد سليم"
text = "تعجبني فكرة الجروب و لكن لا اعرف كيف يمكنني التواصل معه هل هناك من يمكن أن يفيدني فنحنفي حاجه شديده لمعرفة جمال بلدنا"
archived = "2009-03-27"
capture_url = "https://web.archive.org/web/20090327230430/http://masr.20at.com:80/newArticle.php?sid=20427"
