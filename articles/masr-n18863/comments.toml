order = 0
subject = "اصحاب هذة الجروب نصارى يكتبون باسماء مسلمين"
author = "بس اسكت"
text = "شوية عيال تافهين بيستخبوا وراء اسماء مسلمين وهم كلهم عظمة زرقاء ومروحة اربعة ريشة<br />لا تنظروا الى التفاهات<br />الحجاب بقى موضة قديمة<br />دلوقتى فية النقاب<br />واللى مش عاجبة يضرب راسة فى راس اى خنزير"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218144204/http://masr.20at.com:80/newArticle.php?sid=18863"
