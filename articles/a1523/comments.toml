subject = "جزاكم الله كل الخير"
author = "لسلام عليكم و رحمه الله و بركاته"
text = "لا استطيع ان اقول اكتر من جزاكم الله كل كل الخبر يا رب و اللهم اجعله في ميزان حسناتك يا تامر يا رب<br />و يجازي كل المشتركين معاك كل الخير<br />و انا مع الاخت اللي بتعلق علي الموسيقي<br />فعلا انا معرفتش اسمع اي حاجه من الاغنيه<br />واني احبكم في الله<br />اختكم في الله ام خديجه"
archived = "2006-11-02"
