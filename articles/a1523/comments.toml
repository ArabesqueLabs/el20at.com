order = 3
subject = "السلام عليكم"
author = "ا شاء الله لا قوة الا بالله .. فكرة جميلة جدا ومجهود يحسب ليكم .. وفعلا العمر لحظة ..."
text = "بعد ما شوفت هذا العمر فضلت اعيد فيه تانى واتفرج بس المرات اللى بعد كدة كنت بتفرج بدموع عنيا .. لآن ديه مش حياة الاخ تامر فقط ، لا ديه حياتنا كلنا .. فيها نعم من الله كتيرة جدا وفيها عمر بيجى بسرعة جدا .. وكلنا إلى نهاية .. عاجلا او آجلا<br />ربنا يخرجنا من الدنيا على خير اللهم امين<br />بس ليا ملحوظة على الاغنية هى جميلة جدا وكلماتها حلوة اوى بس حسيت ان صوت الموسيقى عالى واعلى من صوت المغنى وحاولت اركز فى الكلمات ماوضحتش غير فى الاخر خالص .<br />وليا طلب آخر معلش هو انهم تخلوا الاغنية ديه Aduio منفصلة عن الفيديو وياريت لو تنزلوها فى الموقع عشان نقدر نحملها ونناجى بيها رب العالمين (( بعد ما تكونوا وطيتوا الموسيقى شوية !!!!!! ))<br />جزاكم الله خيرا وربنا يعز بيكم الاسلام .. اللهم آمين<br />السلام عليكم ورحمة الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143024/http://www.20at.com/article.php?sid=1523"

[[comments]]
