subject = "To Ashraf"
author = "i Ashraf. Im Tamer, the director. First i want to say something if u are really a good person without religion, try to be more polite when discuss with anyone to hear you. Second, I think u don belive in God. So U consider man is some chemical reactions, and there is noone create him. so Im above to talk or discuss with some bullshit chemical reactions."
text = "Thanx for your time. c u in the end of days:)"
