[[comments]]
order = 9
subject = "Ashraf"
author = "amer, I actually do believe in God who created the chemical reactions within us among many other things like our souls and conscience. However, I do not believe in organized religion as the ultimate path to fulfilling our spiritual needs and having a relationship with God. If you look at all the evil that was committed in the world, you'll find out that most of it was done in the name of religion and in the name of God. All organized religions are guilty, particularly the main three \"heavenly religions\"."
text = "So may be there are many good things about religion, but I don't believe that it should be above questioning, and I certainly don't believe that people should be RULED by it. The power ALWAYS ends up in the wrong hands. Look at Bush who is a fundamentalist Christian, and believes that he is saving the people of Iraq by sending them missionaries to convert them to Christianity. Because of his religious beliefs he has practically destroyed the world. I think Bin Laden is just like him, and anybody who think that their holy book gives them the right to feel that their religion is superior. I believe that one should have the freedom to be \"religious\", but not believe that he is better than others because of that. Christians in our country are treated as second class citizens and discriminated against terribly just because they are not Muslim. And we Muslims don't feel that bad about such injustice, because we really believe that we are the only ones who are going to heaven. All other people are beneath us.<br />As for your movie, I don't think I was impolite in my criticism. If you want to be a real artist, you'll have to put up with real criticism, and you should read what critics write in the international papers about works by the biggest names in the performing arts around the world. They rip them to shreds. And you are no better. What I wrote was very mild compared to what a newspaper critic would write. You are probably offended by the expression \"sentimental masturbation\" that I used to describe your religious subject. Well, the great Youssef Chahine described his \"Iskenderyya Kaman w' Kaman\" as just that: \"mental masturbation\". It is very interesting that, young and new as you are, you feel that you have the right to put yourself above criticism just because of the \"message\" that you believe that your film stands for. Goodness gracious. What will you do when you become a big director? God help the Egyptian cinema<br />You are actually a good actor. That's about the only thing that's good about the film. Maybe also the aesthetic conception of the film (life flashing before your eyes during prostration) was OK; even though the idea was used a lot before. But the rhythm of that \"flashing\" was too slow. The music, and the old age makeup were really poor. We have much more interesting music in our culture than this stupid music that gets played as easy listening on the FM Cairo Musical Program late at night. PARTICULARLY the song at the end was terrible. It was a bad version of the type of music that accompanies the propaganda videos or Al-Qaeda. But the main problem was the content. It displayed no critical thinking or any treatment whatsoever. It was just a sentimental, cheesy, representative and direct \"expression\" of a pre-programmed dogma that you feel - or think that you feel - strongly about. It has no thought. This may be OK as propaganda for those who are ready to swallow the bait and cry every time they watch it. BUT IT IS CERTAINLY NOT ART. What it boils down to is: sentimental masturbation. Sorry that this offends you, but this is what I think. You may manage to work your way up to the top, but you will never be a true artist of any consequence until you stop being self-righteous, start to dare to think, and be able to take harsh criticism.<br />And by the way, I know you are angry at my criticism and point of view about your work. But remember, I didn't judge you. I only judged your work, which is my right as audience, as well as a very well-educated performing artist. So, you have no right to judge me or presume to know what will happen to me at \"the end of days\". Only God will. And we do have a very good relationship despite the fact that you do not approve of how I approach it. I know. It is very hard for religious people to be objective. They think that their belief is the only right one, and all else are going to hell. How misguided<br />Peace"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143024/http://www.20at.com/article.php?sid=1523"

