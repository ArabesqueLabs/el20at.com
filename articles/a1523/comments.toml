text = "In your comment u talked about Bush and binladen. Im with You joe oh sorry Ash, i hate them soo much because they use the power to reach their goals but it doesnt mean that all Muslims anh christians who have loyalty to their relgion are bad. In this life there are bad people and good people whatever their believes. I belief in God and i belief that there is a lot of MUSLIMS bad. but i have my goal and my loyalty to ISLAM. Its my point of view I think.and let me say to ou something why ypu alywas take the bad examples look to AMR KHALED, at the last days he could make a conference in Lodon and he invites the world to co_oprate for better future and people from all over the world attended it. try to be fair man>.<br />abot your critisim about the movie i think u are a good audince and know abut cinema more. I have my advice try to go ahead to be director. I think it wil be better 4 you, and if u want i can guide you to put your leg in the 1st step.<br />Oh i forgot somethin important, anout cristians In my first movie my first assistant director was cristian and he was very happy to work with me and if u want his telephone number 2 ask him tell me.<br />Finally as u are agood follower to movies, sure you knoe KINGDOM OF HEAVEN, remmber the scene when salah eldein disscused with the hero of the movie about (palastine) remmber wwhat he said in the end of dicscusion He said :IM NOT THOSE IM SALAH ELDEIN.<br />and i want to say somthing to yoy dont compare me with others<br />IM NOT THOSE IM TAMER ASHRY TAMER ASHRY<br />Remmber this name because u will hear about me more in the future.<br />THNX FOR YOUR TIME, c u in the end of days<br />DISCUSSION FINISHED"
