[[comments]]
order = 1
subject = "نكهة النجاح"
author = "محمد باعشن"
posted = "2008-07-03"
text = "اخوي علي .. موضوع رائع ودائما تنكش الجروح هههههه<br />ليست جروحا بالمعنى المعروف ولكن فعلا انحرمنا من هذه الاماسي التي تطفئ نار الجهد الذي نقوم به والتي تعطينا دفعة معنوية لتقديم مزيدا من الابداع والتميز<br />من وجهة نظري ان حفلة النجاح باي مسمّى كانت وليمة او جائزة او هدية او اي فرحة لها دافع معنوي كبير على الفرد<br />تعلمت من الايجابية التفائل : ولن اضع نفسي بقائمة المحرومين بل ساعدها بكل ماهو مميز عند التخرج من الجامعة ان شاء الله<br />موضوع جميل وقواك الله .. وننتظر جديدك دائما"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "فرحة النجاح حلوة وخاصة اذا كانت بنسبة كويسه"
author = "Mawklee"
posted = "2008-07-03"
text = "اولا احب اشكر الاخ ( علي بن حاجب ) على طرحه هذا الموضوع واشكره على مواضيعه السابقة الي دائما ممتازة<br />ثانيا لمن تخلص اختبارات ويكون اخر يوم يووووه تحس في هم كان على راسك وراح الحمدلله وغير كدا لو كانت اخر سنه ( ثانوية عامة ) والكل يباركلك من الاصحاب والاحباب تحس في فرحة زايدة<br />ويقول أبي المراغي<br />اذا رأيت شباب الحي وقد نشأوا لا ينقلون قلال الحبر والورقا<br />ولا تراهم لدى الاشياخ في حلق يعون من صالح الاخبار ما اتسقا<br />فذرهم عنك واعلم انهم همج قد بدلوا بعلو الهمة الحمقا<br />وما اقول غير حظا اوفر للراسبين والف مبروك للناجحين"
archived = "2010-03-14"
capture_url = ""

