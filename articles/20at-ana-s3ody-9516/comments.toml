posted = "2008-07-04"
text = "اول شي جزاك الله خير على الموضوع الرائع والجميل<br />صراحة فرحة نجاح ثالث ثانوي تحسها من جد من القلب نفسك كدا تطييير( ههههه)<br />يعني لازم حفلة ولا عزومة حاجات زي كدا وخاصة ادا جبت نسبة حلوة ,<br />بس بعدين يبدا خوف او رهبة من اللي جاي تفكر تدرس اش وين تدرس اش تشتغل يعني المستقبل<br />الله يوفق الجميع وعفوا على الاطالة"
