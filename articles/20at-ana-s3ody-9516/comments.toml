posted = "2008-07-04"
text = "أولا : لن أمل ولن أفتر عن توجيهي الشكر لهذا الإعلامي المبدع الذ يضعك مع حدث على الساحة (تحـــــــــــيــــاتي)<br />ثانيا : في رأيى أن هذه الحفلات عادة جميلة تبعث في الروح قيمة الإنجاز الذي قامت به ولا ضير إذا قام بها الصغير أو الكبير<br />ومن ناحية أخرى فأنا ارى أن من يقوم بها كمبادرة هو الأب والأم فكما كانو يطالبون بالتفوق والنجاح فهم اليوم لابد أن يكافؤن ويعلنون عن فرحهم لأن (هـــــــــــــذه بتلك)<br />وأخيرا : فإن حفلات النجاح ليست للفرحة فقط بل لنثبت لأنفسنا أننا قادرون على النجاح في كل عام وتحت أي الظروف.<br />شكرا جزيلا0......"
