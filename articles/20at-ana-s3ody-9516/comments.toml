subject = "أحلى يوم عندي بعد الأختبارات يوم النتائج"
author = "وسيم جحيدله"
posted = "2008-07-03"
text = "أول شيء أحب أهني صاحب الموضوع (علي بن حاجب) على الموضو الأكثر من راااائع ونقوله يعطيك العافيه<br />وثاني شيء أنا عن نفسي أحلى يوم عندي بعد الأختبارات يوم النتائج أروح مع اصحابي أول ما استلم النتيجة يباركولي واقولهم اليوم الفلاني الغداء ولى العشاء عندي طبعاً بعد الاكل نجلس نسولف ونلعب كمبيوتر ونفللللللللهااا<br />هاذي هيا حفلتي."
