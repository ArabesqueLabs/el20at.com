[[comments]]
order = 0
subject = "mfas29@yahoo.com"
author = "السمالوطى"
posted = "2008-10-09"
text = "انا من اهالى سمالوط وانا شاهد عيان على الاحداث التى وقعت امس بسمالوط قامت قوة من الشرطة بالاغارة على احد المنازل للبحث عن مسروقات فعندما لم يجد ظابط الشرطة هذة المسروقات اشتعل غضبة وانهال على سيدة حامل بالسب والقذف ثم ضربها حتى فارقت الحياة فما ذنب هذة السيدة فى فشل ذلك الطابط فى خطاء تحرياتة ما ذنبها اذ انة لا يعرف كيفية اداء عملة انة اعتمد فى تحرياتة على مجرد اقاويل وليست دلائل عندما عرف طابط الشرطة ان السيدة تنزف فر هاربا كالفأر ولم يقوم بطلب سيارة الاسعاف لتلك السيدة<br />ماذا يفعل اهالى واقارب المجنى عليها قاموا بالتظاهر واغلاق الطريق الرئيسى وعندما قامت الشرطة بمنعهم وطبعا كلنا نعرف وسائلهم قام الاهالى باحراق سيارة الشرطة واما عن اصابة عميد الشرطة فهى مجرد اصابة صغيرة حيث اصيب عندما قام الاهالى بقذف الشرطة بالحجارة هذا ما حدث فى سمالوط"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042853/http://masr.20at.com:80/newArticle.php?sid=17858"

[[comments]]
order = 1
subject = "القوة العاشمة - للقبض على شخص  تتحرك كتيبة من الام"
author = "باسم"
posted = "2008-10-10"
text = "الناس قرفت<br />للقبض على حرامى او ولد صايع تقوم تجريدة او حملة تكفى لعبور القناة ومهاجمة نقطة من خطوط بارليف وكان زمان فى العصور السابقة يكتفى بارسال مخبر لاحضار المتهم<br />هل هى كتر الفلوس<br />لان ميزانية الداخلية اكبر من الجيش واكبر من التربية والتعليم وبتحظى ب بكل المجندين<br />رد فعل الناس المضغوطة اية<br />الاشتباك مع قوات الشرطة والمقاومة ويبقى الموضوع كانة يهود وسكان الضفة والانتفاضة<br />واذا لم تحترم الشرطة نفسها فقد يلجا الناس الى السلاح ومقاومة القوة بالقوة"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042853/http://masr.20at.com:80/newArticle.php?sid=17858"

[[comments]]
order = 2
subject = "ضابط والا مجرم برتبة"
author = "مصطفى"
posted = "2008-10-10"
text = "فى العالم المتحضر والهمجى<br />فى ادغال افريقيا وفى بلاد الواق واق واللى بيركبوا افيال - اى واحد بيشوف واحدة حامل بيخاف يلمسها ويقدم لها اى مساعدة<br />انما ضابط برتبة وشايف واحدة حامل فى الشهر التاسع ويرفسها بجزمتة الميرى فى بطنها ويضربها بدبشك البندقية على نافوخ راسها - دى يبقى مش انسان دى يبقى وحش ويجب قتلة<br />يبقى معدوم الانسانية<br />يبقى هو والجهاز بتاعة عايز الحرق<br />يبقى الصعايدة يعملوا لهم كماين فى الذرة والقصب ويقتلوهم<br />انهم اجرام<br />اللى يعرف لغة يكتب الى حقوق الانسان فى الامم المتحدة<br />يكتب الى محكمة الجنايات الدولية<br />يجب وقف الاجرام<br />وبأى طريقة"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042853/http://masr.20at.com:80/newArticle.php?sid=17858"

[[comments]]
order = 3
subject = "عايزين نحكي الحكاية من الاول من اول ما الباشا اخد"
author = "مش لازم"
posted = "2008-10-10"
text = "علشان خاطر نعرف ايه اللي بيحصل لازم نمسك الخيط من اوله<br />الباشا لما اخد السنوية العامة هو وزمايله البشاوات جريوا يقدموا في كلية الشرطة ليييييييييييييييييييييييييييييييه؟<br />من هنا نبدأ والاسباب اللي دخلوا ليها كلية الشرطة حتلاقيها بعيدة كل البعد عن امن مصر والعمل الشرطي<br />فيه حاجه اسمها في القانون تحريات جدية يعني ضابط الشرطة دا شغلته يعمل تحريات جدية<br />القانون بيقول لما ضابط الشرطة يجيلوا بلاغ يعني سين من الناس حرامي<br />المفروض ضابط الشرطة يتأكد من صحة البلاغ بالتحريات الجدية ولما يتأكد من صحة البلاغ عن طريق التحريات بالدليل القاطع يقبض على المتهم ويحيله الى النيابة العامة<br />لكن البهاية بتوعنا اللي دخلوا كلية الشرطة علشان خاطر يتمنظروا بالبلدة لما حد يبلغ عن حد يروحوا يقبضوا عليه ويعذبوه لغاية حاجه من الاثنين يا يعترف يا يموت<br />بالذمة دا كلام<br />دا عمل شرطي دا عمل رجال الامن<br />ولذلك نرفع نداءنا الى السيد اللواء حبيب العادلي وزير الداخلية ليقوم بتصحيح المسار الشرطي في مصر الا وهو منذ البداية<br />منذ حصول الطالب على الثانوية<br />لا بد من تصحيح الفكرة نفسها<br />لازم ضابط الشرطة يبقى زي ضابط الجيش<br />ما يبقاش باشا<br />غلط ضابط الشرطة يبقى باشا<br />غلط..... غلط.......... غلط<br />الشرطة سلطة خدمية ياجماعة يعني سلطة شغلتها خدمة الناس"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042853/http://masr.20at.com:80/newArticle.php?sid=17858"

