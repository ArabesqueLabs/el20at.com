subject = "استطلاع راى اقامتة احدى الجهات عن الشرطة"
author = "السعيد سالم"
posted = "2008-10-10"
text = "فى استطلاع راى اجرتة احدى المواقع على المصريين<br />كان السؤال<br />انت بتخاف من مين الحرامية والبلطجية والا بتخاف من الشرطة<br />واجاب 95 % من الذين ادلوا بارائهم<br />بنخاف من الشرطة<br />لا تعليق"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042853/http://masr.20at.com:80/newArticle.php?sid=17858"

[[comments]]
order = 5
subject = "أحنا فى أسرائيل ياجماعة"
author = "المصرى أفندى"
posted = "2008-10-10"
text = "أنا بأشوف تعامل الشرطة فى مصر مع الناس أصبح أشبه بتعامل أسرائيل مع المواطنين العرب بل أوسخ. يعنى المداهمات وترويع الناس والعنف المبالغ فيه والجديد بق أستعمال سلاح الببلطجية وده الشىء الأخطر. وخاصة عند التعامل مع الجماعات السياسية والمظاهرات. وطبعا الواضح أن الغرض من كل هذا هو تخويف الناس علشان يمشوا جنب الحيط ويرضوا باللى يعطيه لهم الفرعون. وهذا أسلوب ومنهج حكم وليست حالات فردية كما يصوروها لنا أننا سنحقق وسنعاقب ونلاحظ أن العقاب بيكون خفيف وبعد طول أنتظار لغاية مالناس تكون نسيت الجريمة. الأكيد أن العنف أصبح منهج (وهذا بشهادة قيادات شرطة شريفة)وهذا يحدث فى الأختيار والتدريب لهذه العناصر."
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042853/http://masr.20at.com:80/newArticle.php?sid=17858"
