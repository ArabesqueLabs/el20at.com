[[comments]]
order = 0
subject = "ما هي أشهر القضايا التي قمت برفعها علي مثقفين وفنا"
author = "مش كاتب"
posted = "2008-03-24"
text = "يا اخ اسماعيل المفروض تتابع سؤالك<br />هو جاوب على الشق الاول والشق الثاني وهل حكمت لك لم يجاوب كان المفروض ان تتابعه حتى تاخؤ منه الاجابة<br />ما نتيجة رفع الدعاوي القضائية هل حكمت لك المحكمة بشيء هو دا المهم"
archived = "2010-03-14"
