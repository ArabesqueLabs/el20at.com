[[comments]]
order = 1
subject = "شعر"
author = "مش لازم"
posted = "2008-03-24"
text = "يا قومُ لا تتكلموا إن الكلامَ محَرّمُ<br />ناموا ولا تستيقظوا ما فاز إلا النوّم<br />وتأخروا عن كل ما يقضي بأن تتقدموا<br />ودعوا التفهم جانبًا فالخيرُ أن لا تفهموا<br />وتثّبتوا في جهلكم فالشر أن تتعلموا<br />أما السياسة فاتركوا أبدًا وإلا تندموا<br />إن السياسة سرها لو تعلمون مُطَلسـم<br />وإذا أفضتم في المباح<br />من الحديث فجَمْجموا<br />والعدلَ لا تتوسموا<br />والظلمَ لا تتجهموا<br />من شاء منكم أن<br />يعيش اليوم وهو مكرّم<br />فليُمْسِ لا سمعٌ ولا<br />بصرٌ لديه ولا فـم<br />لا يستحق كرامةً<br />إلا الأصمُّ الأبكم<br />ودعوا السعادة إنما<br />هي في الحياة توهّم<br />فالعيش وهو منعّمٌ<br />كالعيش وهو مذمّم<br />وإذا ظُلمتم فاضحكوا<br />طربًا ولا تتظلموا<br />وإذا أُهنتم فاشكروا<br />وإذا لُطمتم فابسموا<br />إن قيل هذا شهدُكم<br />مرٌّ فقولوا علقم<br />أو قيل إن نهاركم<br />ليلٌ فقولوا مظلم<br />أو قيل إن ثِمادَكم<br />سيلٌ فقولوا مُفعَم<br />أو قيل إن بلادكم<br />يا قوم سوف تُقسَّم<br />فتحمّدوا وتشكّروا<br />وترنّحوا وترنموا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "اقبل يدى شيخنا الجليل حفظه الله"
author = "شريف الدواخلى"
posted = "2008-03-25"
text = "أنا بصراحة مش عارف ايه الحرب الشعواء على شيخنا الجليل يوسف البدى مد الله عمره وجعله زخراً للاسلام<br />الرجل نعم سفير الاسلام ، ولا انتوا عاوزين الناس كلها تكون علمانيين ، أو مدعى علم مثل الحاجة سعاد صالح و طنط آمنة نصير اللى صدقوا أنهم فى ايمان حفصة وعائشة \" أمهات المؤمنين \" وباتوا يفتون فى الدين ،<br />وهذا الرجل لا يسعى مطلقا للظهور الاعلامى فالكل يجرى وراءه وهو لا يجرى وراء أحد ويكفى أن كل الدعاوى القضائية التى رفعها كانت على جق ، ويكفى أن يثقل ميزانه موقفه الرائع من فضيحة تنصير \" الكلب المدعو محمد حجازى \"<br />و موافقته على الصلح بعد ذلك مع ممدوح نخلة ...<br />يعنى حاسس ان المحاور متحامل على الشيخ قوى وظاهر فى العنوان .. يعنى بعبع كلمة مش لطيفة خالص<br />وانما يمكن القول أنه فارس الاسلام وحامى حماه ضد كلاب العلمانية و قاذورات المثفقين الذى يستبيحون كل شئ وكل من يقف أمامهم يبقى \" متخلف رجعى ارهابى \"<br />دول عاوزين البلد كلها فسق ومجون يا جماعة يارب نفوق بس<br />سلام عليكم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الوجه والكفين ليس بعوره"
author = "مش رايح"
posted = "2008-03-25"
text = "الوجه والكفين ليس بعوره<br />واللي عايزه تغطي الوجه والكفين هي حرة في شأنها ولكن الوجه والكفين ليس بعورة ولابد للمرأة تصلي وكي كاشفة الوجه والكفين<br />فهمتوها ولا لسه ودا كلام النبي محمد صلى الله عليه وسلم اللي حدد عورة الرجل من الصرة الى الركبة وحدد عورة المرأة كل جسمها عورة ما عدا الوجه والكفين<br />وامهات المؤمنين حالة خاصة ولكن اي امرأة عايزه تقتضي بامهات المؤمنين يا مرحبا ولكن على اساس ان الوجه والكفين ليس بعوره"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "الله يرحمك يا شيخ يا شعراوي"
author = "ابومحسن"
posted = "2008-03-25"
text = "كل ما اشوف واحد عامل نفسه داعية<br />اتذكر فضيلة الشيخ الجليل محمد متولي الشعراوي<br />الله يرحمك يا امام الدعاه<br />الله يرحمك يا معلم الدعاه<br />الله يرحمك يا استاذ الدعاه<br />الله يرحمك يا سيد الدعاه<br />الله يرحمك يا شيخ الدعاه<br />الله يرحمك يا مفسر القران<br />الله يرحمك يا خليفة رسول الله<br />الله يرحمك يا مرشد المسلمين<br />الله يرحمك يا موجه المسلمين<br />الله يرحمك يا حبيب المسلمين<br />الله يرحمك يا كايد اعداء المسلمين<br />قبض العلم من بعدك يا شيخ يا شعراوي<br />وصدق رسول الله صلى الله عليه وسلم<br />لكن الحمد لله دروسك كلها موجودة ولا تغيب عننا ابدا<br />واحب اقول رفع القضايا ليست دعوه الى الله لكن الناس مرضى والداعية طبيب ولنا في رسول الله صلى الله عليه وسلم اسوة حسنه<br />سلام"
archived = "2010-03-14"
capture_url = ""
