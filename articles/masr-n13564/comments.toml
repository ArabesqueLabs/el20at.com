subject = "الفرن البلدى"
author = "واى"
posted = "2007-12-26"
text = "الفرن البلدى بيشتغل بالحطب او الخشب او الجلة<br />ولو ولعنا الحطب او القش وعمل دخان هييجوا بتوع امن الدولة ويقبضوا على الفاعل وياخد غرامة وسجن علشان الدخان بتاع القش مشى من الشرقية وعمل السحابة السوداء فى القاهرة<br />يعنى حرق القش بقى قضية امن دولة<br />وجاى تقولى الفرن البلدى<br />اللة الغنى<br />وربنا يحفظنا من السحابة السوداء"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229071522/http://masr.20at.com:80/newArticle.php?sid=13564"
