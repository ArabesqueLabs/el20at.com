subject = "دعوة"
author = "من السعودية"
posted = "2008-07-07"
text = "اللهم ارحم عبدك المسيري ، اللهم ارحم .. هل أقول آخر الشرفاء !! ، اللهم اجعل قبره روضة من رياض الجنة ، اللهم ارزقه الفردوس من غير حساب ..<br />أدعو من لم يتعرف على العلامة المسيري بعد ، أن ينضم لحملة أقترح أن يكون هدفها قراءة مقال واحد له فقط ( لن أقول كتاب واحد ) والأمر جدا ميسر فمقالاته في كل مكان على الشبكة ، فهذا علم نافع تركه الراحل إلى ربه لنا ، آمل أن يصدق عليه قوله عليه الصلاة والسلام ( إذا مات ابن آدم انقطع عمله إلا من ثلاث: صدقة جارية، أو علم يُنتفع به ، أو ولد صالح يدعو له ) رواه مسلم .. أحسبه كذلك ولا أزكي على الله أحدا ."
archived = "2008-07-07"
