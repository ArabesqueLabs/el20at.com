text = "أي حد يفكر فيها بديهيا حيلاقي إن حادثة الأميرة ديانا و دودي كانت مدبرة و لسبب بسيط و هوة إن ديانا كانت حامل إبن دودي(محمد الفايد)فطبعا هما مش بيخافو من حاجة قد إن ولي العهد و لو كان الترتيب رقم 10 يكون مصري مسلم<br />فما بالك لو كان هوة ولي العهد التالي (للي معندهوش معلومات يطلع علي شجرة العائلة الملكية في إنجلترا)"
