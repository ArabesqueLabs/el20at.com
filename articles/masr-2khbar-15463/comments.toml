author = "حماية دولية"
posted = "2010-02-24"
text = "امبارح فى الاخبار ان بعض اليهود فى اسرائيل طلبوا حماية دولية للمعابد اليهودية فى مصر - يعنى تدخل دولى فى الشؤون الداخلية - كلة دة علشان خبر اذيع من الداخلية ان واحد ترزى رمى جركن بنزين من بلكونة فى مبنى امام المعبد - يعنى خبر لا يستحق ان يذاع فى وكلات الانباء والمعروف ان معظم الاعلام فى اوروبا وامريكا ملك اليهود وهيقلبوا الدنيا<br />فية اخبار هايفة مش للاذاعة ولا النشر لانها بتؤذى الوطن ولها تأثير عكسى فى الخارج<br />هيعمل اية جركن بنزين وقع فى الشارع - ولا - حاجة ولا يمثل اى خطورة - نقوم نعمل من الحبة قبة ونهيص ونزعق وبعدين اسرائيل تطلب حماية دولية لمعابدها فى مصر<br />يعنى نلاقى قوات الامم المتحدة واقفة فى شوارع وسط القاهرة<br />اية الغباء دة<br />هو مين المسئول فى البلد دى"
