[[comments]]
order = 0
subject = "ولماذا لم تفتى الدكتورة بحرمة اعطاء الموظف راتب يو"
author = "زعلان"
posted = "2008-10-13"
text = "هو كل واحد يفتى على مزاجة ؟<br />من اين اتى الدكتور بالمعلومات فى كتابة ؟<br />نقلها من كتب اجنبية وترجمها وطبعها - هل الدكتور بتاعنا اللى ترجم الكتاب اعطى صاحب المؤلف الاجنبى حقة والا اقتبسها كدة بالعافية<br />ثم ان المفروض الدكتور يعطى نسخة للطلبة وهم يصوروا الباقى<br />او يخللى الطلبة يكتبوا وراة فى المحاضرات"
archived = "2008-10-17"
capture_url = "https://web.archive.org/web/20081017091917/http://masr.20at.com:80/newArticle.php?sid=17893"

