text = "نفسر برده اتعلم اشرب لبن<br />نفسى ابطل اشرب قهوه(صحتك يا بنتى)<br />نفسى ابطل احب القطط اوى<br />نفسى اتعلم اغير نظام اوضتى(انتى مبتزهقيش)<br />نفسى ابطل اترجى اصحابى يحبو 3فيروز و المسرح و روايه ذهب مع الريح<br />نفسى اقنع نفسى ان مستحيل تبقى فصول السنه كلها فصل الشتا<br />نفسى اتخلى عن طموحى الزايد (المشششتييير واخدالى باللك يا هبهوب)<br />نفسى ابطل احب البلد دى اوىو اقتنع بفكره السفر<br />نفسى ابطل ادور على حاجات تاهت من زمان و مش هترجع<br />نفسى اقنع نفسى انى مش هلاقى صحبتى اللى سافرت تانى<br />نفسى اغنى لكل زملكاوى انهارده اغنيه ميهمنااااااااااش"
