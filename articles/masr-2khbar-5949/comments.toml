subject = "ياسلام"
author = "علاء المصرى"
posted = "2007-05-20"
text = "يعنى انتا عايز تفهمنى ان قوات الامن المصرية اعتقلوا ناس قاعدين يروجوا للشامبو<br />مع الاسف الموقع دة بقى مشبوة وانتم مش بتروجوا للشامبو انتم قاعدين تشتموا فى مصر والمصريين وتزوقوا فى السعودية لو كنتم سعوديين كنت قلت معلش<br />لكن المعضلة انكم بالاسم مصريين والحمد للة ان الناس عرفت حقيقتكم وبطلوا يدخلوا الموقع الزبالة دة"
