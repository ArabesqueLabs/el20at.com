subject = "عندك حق"
author = "خيرى عاطف"
posted = "2007-05-20"
text = "بصراحه يا علاء انت عندك حق.. دة موقع فعلا زباله..انا قولت كدة من زمان.. بس بحاول ادخل عليه يمكن يرجع تانى زى الاول..لكن للاسف ما فيش اى فايده..دول شكلهم مدسوسين علينا احنا المصرين..مش عارف بالظبط عاوزين مننا ايه.. الخطير انهم بيفتقدوا المحايدة..وكله كله شتيمه فى الحكومه..وكأن الحكومه ديه ما بتعملش اى حاجه صح.."
