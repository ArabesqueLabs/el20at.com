subject = "بوادر افلاس حكومة مصر"
author = "شرارة"
text = "اصدر وزير ما يسمى بالداخلية المصرية قرارا او فرمانا للجباية وجمع المال باى وسيلة<br />قرار تجديد البطاقة الشخصية التى مر عليها 7 اعوام ورغم حالتها الجيدة - لية<br />لان المواطن الفقير سيضطر الى شراء استمارة التجديد ب 15 جنية<br />وهناك 3 ملايين مواطن مر 7 سنوات على استخراجهم البطاقة فيكون الدخل المتوقع 45 مليون جنية سيدخلون لخزينة الدولة لتصرفهم على جحافل الامن المركزى كعلف لهم وعربات ركوب وبرادع يلبسونها لتفريق مظاهرة او تامين المسار لسيادتة لما يروح حتة كان يفتتح محطة مجارى فيها طرمبتين مية وسخة<br />الحكومة تحلب الفقراء بكل الطرق<br />بينما تدعم رجال الاعمال بالاموال والاعفاءات ليسرقوا اكثر واكثر<br />وهذا هو مضمون العدالة الاجتماعية اللى رافعة سيادتة - حلب الفقراء حتى اخر نقطة<br />عن نفسى مش مجدد البطاقة - واللى مش عاجبة البطاقة القديمة - مش عايز اشتم"
archived = "2008-12-24"
capture_url = "https://web.archive.org/web/20081224111450/http://masr.20at.com:80/newArticle.php?sid=18915"
