[[comments]]
order = 0
subject = "(اللة _الوطن _الموت)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "عند الخطر الحقيقى<br />سوف تكون مصر بكل عناصرها صفا و احدا<br />و لسوف يكون شعارنا و هدفنا الوحيد و املنا الذى ليس لنا سواة هو:-<br />(اللة _الوطن _الموت)<br />الجيش هو الشعب<br />والشعب هو الجيش<br />و الشعب و الجيش هما (الوطن)<br />الذى لا و لن نفرط فى حريتة و كرامتة و استقلالة!!!<br />و ل(تحيا مصر)<br />رغم انف الحاقدين؟"
archived = "2008-12-10"
capture_url = "https://web.archive.org/web/20081210193013/http://masr.20at.com:80/newArticle.php?sid=17848"

[[comments]]
order = 1
subject = "حقا مين الشخصية الغريبة اللى محيرانا دى؟"
author = "و احد مستغرب جدا جدا جدا"
text = "أسمة(ممدوح زكى زخارى جرجس) من أسكندرية-مصر؟!!!<br />بيكتب بصراحة غريبة<br />و بيضرب فى مقتل من تحت الحزام<br />و بيسبب لنا حالة من الاندهاش و الزهول!!!<br />هل هو حقيقى ام شخصية من الخيال!!!؟<br />هل انت حقا يا(زخارى) ملاك ام شيطان؟<br />انت مصضرى صميم ام من وطن تانى؟<br />نفسى اعرف انت مين بالضبط!!!<br />انت عقدتنا من حياتنا<br />روح منك للة يا سقى!!!"
archived = "2008-12-10"
capture_url = "https://web.archive.org/web/20081210193013/http://masr.20at.com:80/newArticle.php?sid=17848"

[[comments]]
order = 2
subject = "الى المحاور(مستغرب جدا)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "انا واقسم باللة العظيم مصرى صميم<br />انا لست شيطانا و لا ملاك<br />انا مواطن مصرى مصرى مصرى<br />و لكننى مصرى غيور و احب وطنى<br />هى دى الحكاية<br />(نقول كمان و لا كفاية)؟"
archived = "2008-12-10"
capture_url = "https://web.archive.org/web/20081210193013/http://masr.20at.com:80/newArticle.php?sid=17848"

[[comments]]
order = 3
subject = "طب ياريت يارولا انة الكلام دة يبقى حقيقة"
author = "موزة"
text = "مش حب للحرب والفوضى ولكن لتنهض مصر من الكابوس اللى اسمة كامب ديفيد اللى على حسة نبيع الغاز لاسرائيل بارخص من السعر العالمى غصبا عن ابواللى خلفنا ومش بس الغاز دة اى حاجة محتجاهااسرائيل سواء كان بترول اوغاز اوطماطم مصر ملهاش حق تصدراى سلعة للعالم قبل ماتصدر لاسرائيل كفايتها وبعدين تقدرتصدرالفائض زى ماهى عايزة البند دة موجود فى المعاهدة المشؤمة وياريت الحكومة وحزبها الفلتة ينشروا بنودالمعاهدة كاملة علشان يعرفوا التمانين مليون حاجة يمكن تقربهم للتطبيع علشان تلاتين سنة سلام ومعاهدة ولغاية دلوقتى مفيش اى قبول للاسرائيلى اوبضاعتة فى مصر"
archived = "2008-12-10"
capture_url = "https://web.archive.org/web/20081210193013/http://masr.20at.com:80/newArticle.php?sid=17848"
