subject = "اشترية بجنية ونص وارمية فى حضن مراتة خوخة"
author = "ريتشارد قلب الحمار"
posted = "2008-11-20"
text = "جمال كويس وابن ريس بس ابدا ابدا انة ينفع ريس دة ابوة خرب بيوتنا على مدى تلاتين سنة وهو جاى بموافقة ابوة ومباركة وتاييد من صحاب ابوة فى الشغل والدحك على الناس وطبعا جمال نفسة عارف انة مسالة التوريث وتركتة اتقسمت بين اطراف رضيت بالمقسوم من فلوس واراضى وحقوق امتياز لمشاريع البلد الحالية والمستقبلية وناس حيبقى ليها حق اتخاذ القرار والسياسة بشرط نحمى الفريق الاولانى علشان عجلة التطور فى تنفيذ برامج السرقة بكل حرفية مهنية متوارثة ومنقوشة فى عقل وقلب كل عضو من العصابة وبكدة يكون التوريث من جيل الى جيل الى ان يرث اللة الارض وما عليها"
