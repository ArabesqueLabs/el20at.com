[[comments]]
order = 5
subject = "ريحة حاجة نتنة"
author = "المصرى أفندى"
posted = "2008-11-20"
text = "ريحة حاجة وسخة ياجماعة. أيوة دى ريحة زخارى الخارى على نفسه بتاع حزب الخراب الوطنى اللى خرب البلد ونهبها وفى الاخر عاوز يبيع للناس الترماى. رئيس العصابة نصح أبنه وقالله يابنى أنا قربت أموت فى داهية وعاوز أطمان عليك أنت وأخوك والولية. يابنى بلاش بيع القطاعى وخلينا نبيع اللى فاضل بالجملة. أرسملك ورق زى بتاع اللعبة بتاعة بنك السعادة وبيعه لولاد ال.... دول وبعدين نلاعبهم عليه كوتشينة ونكسبه منهم ونقوللهم ياللا ياد أنت وهو ألعب بعيد لحسن أسلط عليك البلطجية والمسجلين خطر أعضاء الحزن الوطنى ومعاهم أسلحة الخراب الشامل من السنج والبيروسول. يازخارى ياخارى قولنالك ميت مرة خليك فى زريبة الخنازير اللى أنت نايم فيها وبلاش تهوهو على أسيادك وتقل أدبك عليهم. أتفو عليك وعلى اللى خلفوك ياخنزير( مع الأعتذار لكل الحيوانات)"
archived = "2010-03-14"
capture_url = ""

