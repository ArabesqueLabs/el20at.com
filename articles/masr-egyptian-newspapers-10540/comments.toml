[[comments]]
order = 0
subject = "مين اللي باع الاول الحكومة ولا الشعب"
author = "مش حأقول"
posted = "2008-11-18"
text = "مين اللي باع الاول الحكنومة ولا الشعب<br />الاول ايام الملك فاروق كانت كل شركات مصر قطاع خاص وكانت البلد ماشية عال العال وزي الفل<br />جه عمك جمال عبدالناصر امم كل الشركات وعمل القطاع العام كويس<br />ايه اللي حصل في القطاع العام بوظ الشركات وبدأ الموظفين اللي فيه يسرقوه والكبير والصغير كان بيسرق من القطاع العام<br />واصبح عبء على الدولة واصبحت الدولة بتدعم القطاع العام<br />وتأكدوا تماما مهما تغيرت قيادات القطاع العام حيتسرق برضه لان الشعب المصري ولا مؤاخدة حرامي وكيفما تكونوا يولى عليكم<br />خلاص الحكنومة فلست خلاص ما تقدرش تدعم قطاع عام بعد كده<br />فبدأت تبيع القطاع العام واصبحت هذه الشركات الحكومة بدل ما تدعهما بالفلوس بتاخد منها ضرايب كويسة بتفيد الشعب المصري<br />وكده البلد رجعت زي ما كان الملك فاروق واسألوا الناس العواجيز كانت العيشة عال العال والحمد لله<br />بطلوما بقا وطنية زائفة وكلام جرايد"
archived = "2010-03-14"
capture_url = ""

