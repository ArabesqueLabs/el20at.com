subject = "من النوع الأول"
author = "لولو"
posted = "2007-05-02"
text = "بصراحة ولو مرة واحدة انا كنت من النوع الأول اهتميت بموبايلي وزوقته وكان عاجبني شكله بالسلسلة الجديدة والنور اللي بيطلعه تويتي اللي كان في السلسلة لغاية ما ضاع تويتي ولم أفكر في احد سواه."
