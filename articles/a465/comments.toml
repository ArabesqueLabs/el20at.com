[[comments]]
order = 6
subject = "مطر.. في مدح بوش"
text = "أهذا الذّي يأكُلُ الخُبزَ شُرْباً<br />وَيَحسَبُ ظِلَّ الذُبابةِ دبـّــا<br />وَيمَشي مكِبـــّــاً<br />كما قد مَشي بالقِماطِ .... الوَليدْ..؟<br />أهذا الغبيُّ الصَّفيقُ البَليدْ<br />إلهٌ جَديدْ ؟! ؟؟؟؟؟<br />أهذا الّذي لم يَزَلْ ليسَ يَدْري<br />بأيِّ الولاياتِ يُعنىأخوهُ<br />وَيَعْيا بفَرزِ اسمهِ إذ يُنادى<br />فِيحَسبُ أنَّ اُلمنادى أبوهُ<br />ويجعَلُ أمْرَ السَّماءِ بأمرِ الّرئيسِ<br />فَيَرمي الشِّتاءَ بِجَمْرِ الوَعيدْ<br />إذا لم يُنَزَّلْ عَليهِ الجَليدْ ؟!<br />أهذا الَذي لايُساوي قُلامَةَ ظُفرٍ<br />تُؤدّي عَنِ الخُبزِ دَوْرَ البَديلِ<br />ومِثقالَ مُرٍّ<br />لِتخفيفِ ظِلِّ الدِّماءِ الثّقيلِ<br />وَقَطرةَ حِبْرٍ<br />تُراقُ على هَجْوهِ في القَصيدْ..؟<br />أهذا الغبيُّ الصَّفيقُ البَليدْ<br />إلهٌ جَديدْ ؟!<br />أهذا الهُراءُ.. إلهٌ جَديدْ<br />يَقومُ فَيُحنى لَهُ كُلُّ ظَهْرٍ<br />وَيَمشي فَيَعْنو لَهُ كُلُّ جِيدْ<br />يُؤنِّبُ هذا، ويَلعَنُ هذا<br />وَيلطِمُ هذا، وَيركَبُ هذا<br />وَيُزجي الصَّواعِقَ في كُلِّ أرضٍ<br />وَيَحشو الَمنايا بِحَبِّ الَحصيدْ<br />وَيَفعَلُ في خَلْقِهِ مايرُيدْ ؟!<br />لِهذا الإلهِ... أُصَعِّرُ خَدّي<br />وأُعلِن كُفري، وأُشهِرُ حِقدي<br />وأجتازُهُ بالحذاءِ العَتيقِ<br />وأطلُبُ عَفْوَ غُبارِ الطّريقِ<br />إذا زادَ قُرباً لِوَجْهِ الَبعيدْ !<br />وأرفَعُ رأسي لأَعلـى سَماءٍ<br />ولو كانَ شَنْقاً بحَبْلِ الوَريدْ<br />وأَصْرُخُ مِلءَ الفَضاءِ المديدْ :<br />أنا عَبدُ رَبِّ غَفورٍ رَحيمٍ<br />عَفُوٍّ كريمٍ<br />حكيمٍ مَجيدْ<br />أنا لَستُ عبداً لِـعبْدٍ مَريدْ<br />أنا واحِدٌ مِن بقايا العِبادِ<br />إذا لم يَعُدْ في جميعِ البلادِ<br />ِسوى كُومَةٍ من عَبيدِ العَبيدْ.<br />فأَنْزِلْ بلاءَكَ فَوقي وتحتي..<br />وَصُبَّ اللّهيبَ، ورُصَّ الحَديدْ<br />أنا لن أحيدْ<br />لأنّي بكُلِّ احتمالٍ سَعيْد:<br />مَماتي زَفافٌ، وَمَحْيايَ عِيدْ<br />سَأُرغِمُ أنفَكَ في كُلِّ حالٍ<br />فإمّا عَزيزٌ.. وإمّا شَهيدْ !"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232335/http://www.20at.com:80/article.php?sid=465"

[[comments]]
