subject = "مطر"
text = "الأخ الذي أستعان بقصيدة أحمد مطر في هجاء بوش<br />ببلغ حضرتك إن إسم مطر ده أسمي في تعليقات عشرينات<br />وأنا صاحب فكرة التعليق بقصائد أحمد مطر<br />فأرجو مراعاة حقوق الملكية الفكرية .....!!!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232335/http://www.20at.com:80/article.php?sid=465"

[[comments]]
order = 8
subject = "مطر"
text = "في أمريكا يغدو اللص مديرا للنوادي<br />وفي أوربا يصبح اللص قوادا ورأسا للفساد<br />أما في عراقنا فتقطع الآذان والأيادي<br />ويصبح اللص عندنا زعيما للبلاد!!<br />*أحمد مطر*"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232335/http://www.20at.com:80/article.php?sid=465"

