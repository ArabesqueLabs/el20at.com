subject = "منصب شيخ الازهر هو شيخ الاسلام ولكن"
author = "مش قايل"
posted = "2008-12-14"
text = "انا سمعتة على التلفزيون البريطانى bbc بيقول باستهتار - حصار غزة طيب واحنا مالنا ومالهم وكان ناقص يقول ما يروحوا فى ستين داهية<br />لية يا مولانا يا شيخ الاسلام<br />انت مالك ومال شمعون بيريز بس وبتسلم علية بايديك الاتنين انما مسلمى غزة ااحنا مالنا ومالهم<br />هل هى دى الاحاديث النبوية التى تقولها على المنبر ليس منا من بات شبعان وجارة بات جائعا<br />والحديث اللى بيقول المؤمن للمؤمن كالبنيان يشد بعضة بعضا<br />اعتقد انهم اختاروا قزما لتولى هذا المنصب<br />او راجل صعيدى فرح بالكرسى والسفر بالطيارات وبيقعد فى مؤتمرات وبيشوف علية القوم وينام فى فنادق 5 نجوم<br />يا عم الشيخ انا لسانى طويل وعايز اشتمك بس برضة ها اقول اية - العيب على عينك فى الوظيفة دى<br />يا عم الشيخ انت لم تسمع عن السفينة اللى اخترقت الحصار وكانت جاية من قبرص وفيها اخت تونى بلير الكبيرة اللى بتشتغل راهبة<br />والا انت عايش مع اهل الكهف<br />والا عقليتك هى عقلية اهل الكهف"
archived = "2008-12-17"
