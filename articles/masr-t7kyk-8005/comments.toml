subject = "علاج الاكتئاب"
author = "على سرحان"
posted = "2008-01-13"
text = "علاج الاكتئاب بسيط جدا وغير مكلف<br />الانسان المكتئب يتوضأ ويصلى للة ركعتين<br />ثم يقرأ ما تيسر من القرأن<br />ويواظب على الصلوات الخمس فى جماعة<br />واذا لم يزل الاكتئاب فى يوم واحد - يزيد من تلاوة القرأن"
