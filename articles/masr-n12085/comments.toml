[[comments]]
order = 0
subject = "تسلم ايديكي وعينيكي يا منى"
text = "تسلم ايديكي وعينيكي يا منى، أيوة كده اللي يفتكر ذكرياتنا الحلوة وأيامنا الجميلة، الموضوع عشرة على عشرة، وعيشاه بقلبك، وكلمات محمد حمام أثرت الموضوع بشكل كبير، وخلتينا نسمع السمسمية وأحنا بنقرأ، تاني تاني تاني، أكتب عن الأيام دي تاني، وياريت عشرينات يعمله لينك مع الموضوع لأغنية بيوت مدينتي، لأن صاحب الأغنية مات بدون ما يسأل عنه حد..أعمله لينك لأغاني السمسمية ع المواضيع الحلوة دي.. مرة تانية تسلم ايديكي يا منى<br />لا تنسوا زيارتنا http://qawemwlayehmek.blogspot.com/"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027042302/http://masr.20at.com:80/newArticle.php?sid=12085"

[[comments]]
order = 1
subject = "الذاكرة لمن يملك ذاكرة"
author = "هيثم عبد الفتاح"
text = "السويس الاسماعيلية بورسعيد خط المواجهة أصبحنا فى حاجة لمن يذكرنا<br />قديما قيل : إن تواريخ الشعوب العظية تكتبها دماء الشهداء جمال عبد الناصر<br />وايضا قالوا : إن الثورة يفكر بها العقلاء ويقوم بها الشجعان ويجنى ثمارها الجبناء<br />وكذلك قيل : تُرى من يعيش ؟ من طأطأ الرأس عندما أز ّ الرصاص<br />تعيشى وتفتكرى يا منى العزيزة وتقلبى علينا المواجع مواجع زمن العزة لاننا نعيش زمن الانكسار"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027042302/http://masr.20at.com:80/newArticle.php?sid=12085"

[[comments]]
order = 2
subject = "وانتصرنا وقعدنا على تلها"
author = "من المخروبة"
text = "زمان قوى قبل الحرب كتب طالب فى مجلة الحائط فى احد الكليات مقالة عنوانها<br />يا خوفى لبعد النصر ترجع سينا وتضيع مصر<br />وقد صدق"
archived = "2007-10-27"
capture_url = "https://web.archive.org/web/20071027042302/http://masr.20at.com:80/newArticle.php?sid=12085"
