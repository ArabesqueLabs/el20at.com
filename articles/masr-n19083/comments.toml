[[comments]]
order = 0
subject = "عقدة نقص العرب الجرب الكلاب"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "من يحرق علم مصر انة فعلا كلب ابن كلب من حثالة العرب الجرب الكلاب<br />مصر باقية اى قيام الساعة<br />سواء شئتم ام ابيتم ايها الكلاب الضالة<br />ملعون ابو ابوكم يا كلاب يا عرب<br />اتفوا على اصلكم الوضيع"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054017/http://masr.20at.com:80/newArticle.php?sid=19083"

[[comments]]
order = 1
subject = "حكى لى فلسطينى من الخليل"
author = "ميرا مار"
text = "ايام الانتفاضة الاولى لاحظ اسرائيلى ان الفلسطنيين يحرقون اعلام اسرائيل بكثرة وكل مظاهرة وكل يوم تقريبا فى اوج الانتفاضة<br />ففتح دكان فى الخليل ليبيع للفلسطنيين الاعلام الاسرائيلية بسعر محترم جدا ليحرقوها<br />ومع اشتداد الانتفاضة زاد الطلب على الاعلام<br />فالحق بدكانة خياط يخيط الاعلام وحقق الرجل مكاسب محترمة جدا<br />عقلية حرق الاعلام دى لازم تتغير<br />احتج زى ما انت عايز واكتب رايك بحرية كاملة وقول اية الغلط ونعمل اية - انما الانفعال الهوجائى دة فليس لة اى لزمة ولن يحل اى مشكلة<br />بعض المتشددين يعتبر ان تحية العلم حرام<br />وفى بعض مدارس الخليج امتنعوا فى بعض الاحيان عن تحية العلم وقالوا انهم يفضلون ان يقولوا اللة اكبر<br />على العموم فى حالة الغضب الانسان ينقاد مع القطيع<br />ولكن عيب لا تحرقوا اعلام مصر<br />فالعلم ليس علم الحكومة ولكنة علم الدولة والشعب"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054017/http://masr.20at.com:80/newArticle.php?sid=19083"

[[comments]]
order = 2
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
text = "الاخوان المتأسلمين هم من يقوموا بحرق على مصر فى الداخل والخارج وهم خلف اى تحرك شعبى يتهجم على مصر ."
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054017/http://masr.20at.com:80/newArticle.php?sid=19083"

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
text = "ما هو اللى ما قدرش على الحمار يتشطر على البردعة<br />يعني احنا مش قادرين على اسرائيل اللى بتبيد شعب كامل وهتبيد مصر قريب .. وهنتشطر على الدول العربية عشان كام واحد حرقوا علمنا... طاب مين المستفيد في الآخر مش اسرائيل<br />اعقلوا يا ناااااس واعرفوا عدوكم الحقيقى<br />كفاية غباء بقى<br />ضحكتم العالم علينا"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054017/http://masr.20at.com:80/newArticle.php?sid=19083"
