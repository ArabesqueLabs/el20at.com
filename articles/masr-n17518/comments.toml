[[comments]]
order = 2
subject = "ينصلح حال البلد اذا تم اختيار المحافظ بالانتخابات"
author = "مسعود"
posted = "2008-09-09"
text = "لنفترض جدلا ان السيد الرئيس اقال المحافظ وعين بدلا منة لواءا من الداخلية او الجيش - طيب وبعدين<br />المحافظ الجديد مش عارف لية اختاروة ولا علشان اية اختاروة وهيفتكر ان دة تكريم فى الوظيفة دى قبل ما يطلع معاش<br />قبل اختيار المحافظ تشكل لجنة من الخبراء بوضع خطة تنمية وتطوير للمحافظة تشمل التعليم والصحة والصناعة والوظائف والنقل وكل المجالات وعى راسها الاسكان<br />ويختار شخص صالح لتنفيذ تلك الخطة ويحاسب على مقدار التنفيذ وما لم يتم تنفيذة<br />انما نختار محافظ علشان يقعد فى مكتب يشوف الحضور والانصراف ومش عارف مطلوب منة اية ينفذة<br />الوزير كذلك مش عارف هو جاى لية ولا اية المطلوب منة<br />الامور تسير بعشوائية كبيرة<br />وبصراحة مفيش احد بيعمل حاجة فى البلد دى<br />ولا توجد اى خطة<br />ولو واحد صحفى جرىء وراح سال محافظ وقال لة سعادة المحافظ انت عملت اية امبارح وهتعمل اية بكرة مش ها يعرف يجاوب<br />بدون برنامج عمل التغيير ما لوش اى لزمة<br />وابقى سلم لى على عبدة الاسكافى اللى قاعد على الفرشة مثتنى مثتثمر ينزل بالبراشوت علشان يجيب لة اكل ورغيف عيش"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914025955/http://masr.20at.com:80/newArticle.php?sid=17518"

[[comments]]
order = 3
subject = "طريقة الانقاذ - الناس امام الاحجار ادى زوبة زقة وا"
author = "واحد"
posted = "2008-09-09"
text = "انقاذ اية<br />مقاول انفار بلدى وشوية عمال تراحيل وصخور كبيرة وهيلا هوب وعلى طريقة ادى زوبة زقة وعيب ما تقلش لا<br />ويا للة يارجالة اللى يحب النبى يشيل المقطف دة وفين القروانة يا ابو صلاح<br />فين معدات الدفاع المدنى<br />وفين الروافع<br />وفين الناس اللى بتسبغ شعرها<br />الناس فى العالم كلة بتنكت على الانقاذ<br />هل الحكومة بتاعتنا عايشة فى القرن الواحد والعشرين<br />والا لسة عايشين فى عصر الفاس والمقطف والشادوف والمملوك جابر الاعرج<br />يا فضيحتك يا ابقلة ظاظا<br />الجيش هيعمل لكم اية<br />فية يا متخلفين ادارة اسمها الدفاع المدنى مخصصة للحاجات دى<br />فضحتونا"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914025955/http://masr.20at.com:80/newArticle.php?sid=17518"

[[comments]]
order = 4
subject = "لية هو انا نصبت على المامى بتاعتك و لا سرقت شرفها"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-09"
text = "لية يا عبيط تغلط فى الناس<br />طيب خليك راجل شريف و اكتب اسمك و اسم ابوك اللى فى شهادة الميلاد؟<br />او حتى تكتب لى اسم ابوك الحقيقى اللى امك الغير عفيفة زنت معة و جابتك من فى الحرام يابن السفاح؟!!!!!!<br />اية حكايتكم انتم كلكم اتسعرتم زى الكلاب اياهاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا؟<br />و كل تافه ينتحل صفة شرفية و يطلق على نفسة اسم راهب او قسيس اة راهبة من اصحاب الكتاب اللى اوصاكم بهم اللة و الرسول خيرا؟(انتم طلعتم كفرة بحق و حقيقى لانكم تتجاهلوا كلام اللة و رسولة؟؟؟<br />و انت بتقول على نصاب و حرامى لية؟؟؟<br />هو انا و العياذ باللة من الشيوخ النصابين اللى باعمل حجاب و لا عمل لامك لافك لها الربط اللى ماسك ابوك و مخلية تيس زى النسوان موش عارف يعمل حاجة مع تانت امك ؟مسكين ابوك يا خسارة طلع بيهنج؟ ما تيجى نعملة سوفت درنك يمكن ربنا يسهلة؟<br />و و حياة امك ما تنساش تبوسلى امك و تقولها تجيلى علشان اشوفلها حاجة بديلة من و كسة ابوك المربوط زى التيس"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914025955/http://masr.20at.com:80/newArticle.php?sid=17518"

[[comments]]
order = 5
subject = "الى اللي فوق"
posted = "2008-09-09"
text = "كل الكلام دا ما يهمنيش في حاجه قول اللي انت عايزه معاك للصبح انا تخصص اقباط مش انت اول قبطي حيقابلني انا فاهمكم كويس<br />بس اللي انا عايز اعرفه على النحو الثابت في تعليقك الاول<br />انت نفسك تبوس جذمة حبيب العادلي وطنجاوي ليه؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />واشتم زي ماانت عايز ولا يهمك معاك للصبح"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914025955/http://masr.20at.com:80/newArticle.php?sid=17518"

[[comments]]
order = 6
subject = "اكتب اسمك الحقيقى الاول يا جبان"
author = "انا أسمى (ممدوح زكى زخارى جرجس"
posted = "2008-09-09"
text = "عايز حقيقى تعرف لية انا عاوز ابوس جزمة العادلى و طنطاوى لية؟<br />علشان انت امك و حشانى من اول رمضان<br />و انا محروم من امك الجزمة القديمة؟!!!<br />علشان كدة انا مشتاق ابوس جزمة العادلى و طنطاوى بدلا من بوس و ش امك؟<br />و معلش انا برضة هاقدر اصبر على فراقها لحد ما شهر رمضان يخلص؟؟؟<br />و بعدين يتلم الشمل و الحب و السهر<br />و برضة باحبك يا حمار ما انت ابن الغالية حبيبتى"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914025955/http://masr.20at.com:80/newArticle.php?sid=17518"

[[comments]]
order = 7
subject = "القسيس ما يعرفش يغفر الا وهو راكب يا زخاري"
posted = "2008-09-09"
text = "اقولك ليه<br />لان الماما بتاعتكم متعودة تروح تغفر عند القسيس<br />وطبعا انت عارف القسيس بيغفر ازاي برسوم المحرقي اتفضح وهو بيغفر<br />فطبعا القسيس وهو بيغفر للماما بتاعت انت ممكن يحصل حمل<br />فانت مش عارف مين بابا القسيس ولا بابا جوز ماما<br />علشان خاطر كده المسيحيين بيقولوا للقسيس ابونا<br />فهمت ازاي يا زخاري"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914025955/http://masr.20at.com:80/newArticle.php?sid=17518"

[[comments]]
order = 8
subject = "و بعض الشيوخ كمان بيتغفر لهم و هم مركوبين؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-12"
text = "يا روح امك يا اهبل!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!؟<br />(عين بعين و سن بسن و البادى اظلم)<br />متنساش تبوسلى الماما بتاعتك و اللة هى و حشانى و معلش رمضان قرب يخلص؟ هانت و انا فى انتظارها فى الميعاد و المكان اياة اللى انت بتوصلها لى فية!<br />و اوعى تنسى تبوسهالى على الطريقة اياها؟<br />احترم رجال الدين حتى احترمكم و مفيش حد احسن من حد؟<br />(من ازى زميا فقد ازانى) حديث شريف<br />افهموا يا حمير يا و لاد مليون حمار و كلبة"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914025955/http://masr.20at.com:80/newArticle.php?sid=17518"

