[[comments]]
order = 0
subject = "حكومة اصلاح عسكرية تحت رئاسة اللواء العادلى او الم"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-09"
text = "الحل الوحيد للاصلاح هو تشكيل حكومة عسكرية بالكامل و تسمى (حكومة الاصلاح) جميع و زرائها من العسكريين و ليس من الناس الفافى بتوع النوادى اصحاب و حبايب و جيران و زملاء الراجل الطيب الدكتور الطاهر اللى زى المية؟<br />(لا لون)<br />(لا طعم)<br />(لا رائحة)<br />حكومة اصلاح و عطاءو تنظيف من غير(نظيف)<br />لك اللة يا مصر قيادة و شعبا!<br />و هذا هو الحل (حكومة اصلاح عسكرية)شريفة عفيفة عنيفة!!!"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914025955/http://masr.20at.com:80/newArticle.php?sid=17518"

