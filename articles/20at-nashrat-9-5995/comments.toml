subject = "حسبي الله ونعم الوكيل في المسؤلين عن القذاره دي"
author = "مصري مقيم بالرياض"
posted = "2008-02-19"
text = "يعني نخلص من الدعاره والقذاره من فيلم يعقوبيان يطلع لنا يوسف شاهين بقذاره أفلامه نخلص منه يطلع لنا تمليذه بفيلم شاذ وقذر وشويه نلاقي اللبناني جاي بحريمه يتعرض ويقول للنساء فقط<br />والله حرام عليكم إلي بتعملوه فينا ده , بدل ماتوجهو الشباب للصح وتحمسوهم للنجاح والعمل بتعرضولهم أفلام شذوذ وفسق ودعاره وجنس<br />حسبي الله ونعم الوكيل في المسؤلين وكل من ساهم في نشر الفساد ده في مصر<br />الحمد لله إني طفشت منها , اللهم يامقلب القلوب ثبت قلوبنا علي دينك وأهدي شباب وبنات المسلمين"
archived = "2009-02-04"
capture_url = "https://web.archive.org/web/20090204122331/http://20at.com:80/newArticle.php?sid=10348"

