text = "العرب كلهم كدة !!!<br />مبنعرفش ننقض ب أدب و نقول رأينا بإحترام زى ما ديننا قاللنا<br />احنا ممكن نقول رأينا فى الفيلم و ننقض سلبياته بحيث نخرج أفلام بعد كده تفيد بلادنا و ديننا و أمتنا من غير ما نهين حد و على فكرة لو نقدنا بالتريقة دى رأينا هايوصل احسن ل اصحاب العمل دة<br />و يا ريييييت بقى نبطل نطلق احكام على حد و احنا مش اهل لكدة !!!!<br />و انا واثق ان اغلب اللى بيتكلموا دول مشافوش الفيلم<br />احنا كده طول عمرنا نبص ل نص الكوب الفاضى و منشفش الإيجابيات و نفضل نتكلم من غير ما نكون فاهمين حاجة بأسم الدين (علماً بأن كثير من الأحيان بتكون فى أهداف أخرى و إحنا بنستخبى وراء عباءة الدين) و و الدين برئ مننا طول ما إحنا بنتكلم بس و مبنشتغلش و مش فالحين إللا إن إحنا نعض ل بعض و كل واحد فينا مش فاهم حاجة و مجربش لغة الحوار مهما كانت ميول الإنسان اللى قدامة (و لرسول الله -ص- القدوة فى ذلك).... و شكراً<br />عسى الله يهدى أمتنا أنها تفوق من الغيبوبة اللى هى نايمة فيها"
