[[comments]]
order = 112
subject = ""
author = "تائب من ذنبه"
posted = "2009-11-18"
text = "لا اقول الا ما قال الله عز وجل:<br />إِنَّ الَّذِينَ يُحِبُّونَ أَنْ تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ وَاللَّهُ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُون<br />فتعسا لمن سن سنة سيئة (المخرج+المنتج+الكاتب+الممثلون)عليهم من الله مايستحقون اولئك الذين هم رؤوس الضلال والانحراف والشذوذ<br />قال صلى الله علية وسلم من سن في الإسلام سنة حسنة كان له أجرها وأجر من عمل بها من بعده لا ينقص ذلك من أجورهم شيئاً ومن سن في الإسلام سنة سيئة كان عليه وزرها ووزر من عمل بها من بعده لا ينقص من أوزارهم شيئاً) خرجه مسلم في صحيحه<br />واياكم من النضر الى ما حرم الله فأنه قد كتب على بنوا ادم نصيبهم من الزنا وزنا العين النضر فحذاري من مثل هذه الافلام الخبيثه التي والله ما بثت الا لابعادنا عن دين محمد<br />اقول احذركم اخوتي من الولوج في الرذيلة فأننا سنلقى الله عز وجل من غير شيئ الا العمل الصالح ثم العمل الصالح .......ثم العمل الصالح ثم التبكير في الزواج فأنه وجاء كما قال نبيكم والسلام على من اتبع الهدى"
archived = "2010-03-14"
capture_url = ""
