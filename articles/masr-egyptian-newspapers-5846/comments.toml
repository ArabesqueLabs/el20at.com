order = 0
subject = "كنايس كنايس صدعونا من الاكاذيب !!!"
author = "ابو الافكار"
posted = "2007-05-13"
text = "والمساجد فقط للصلاه ! ومراقبه من الدوله وخطاب ظاهرى زى الباطنى !! والكنائس 24 ساعه مفتوحه وخطاب باطنى غير الظاهرى ! ولقد تجمع فيها المهاويس منهم وهتفوا لاسرائيل وشارون وضربوا الامن ! والكنائس الان دوله داخل الدوله فيها خدمات من مسرح لانتاج مسرحيات تسب الاسلام وتستهزأ من المسلميين ورحلات و قهاوى نت ! وجلسان اخراج العفاريت زى كنيسه مكارى ! وخلافه وشكل الكنائس تغير ادواره متكرره واسوارها عاليه عزلت الاقباط داخلها عن المجتمع المصرى جيتو يعنى !! ومفروض الكنائس فقط للعباده لسماع الوعظات وخلافه وليس تجمع انشطه وارتباطات بصيع الخارج من الاقباط المتصهينيين اللى زعيمهم قال علنا فى فضائيه دريم انا هاولعها فى مصر !! الحال غير الحال يابلبل وانت عارف عبد الناصر بنى الكاتدرائيه وهم الان يلعنوا ايام عبد الناصر"
archived = "2010-03-14"
capture_url = ""

