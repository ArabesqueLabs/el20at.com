[[comments]]
order = 8
subject = "استر يارب علي مصر المسلمين والاقباط"
author = "سيدالخمار"
posted = "2007-05-16"
text = "فعلا مصر في ازمة<br />شديدة والبوس والاحضان بتاعت اخونا شنودة واخونا تنطاوي معدتش يهم لازمة وحل الازمة فورا بسيط جدا 1-حقوق متساوية للجميع مسلم او مسيحي او حتي عفريت ازرق ياخد حقة يطلع زي مايطلع المعيار الوحيد التفوق واي منصب من الرئس للغفير من حق اي مسيحي اومسلم الصندوق هوة اللي يجيب مش الزوير واللي يعوز يبني جامع اوكنيسة هو حر بقانون واحد للجميع ثم نجد مسئول واحد في الدولة يخلع ملف القباط والمسلميين من ةامن الدولة وتبقي معالجة سياية ارجوكم ارجعوا لتقرير الغطيفي ز<br />حقوق المواطنة الكاملة -مش بتاعت اخونا جمال مبارك- هي الضمانة الوحيدة لتصبح مصر بلد عسل للكل وكلمتي لاخوتي الاقباط<br />انتم لنا نعم الاهل والصحبة وشلت يد من يمدها لكم بسوء ونا شخصيا اعتذر لكم بالنيابة عن اي ألم اصابكم من اهبل اوموتور<br />ونا المسلم وافضل اصدقلئي من المسيحيين بل لي شقيق مسيحي في الرضاعة ارجوكم ادخلو كل الاحزاب والنقابات شاركو لتبقي مصر وطننا نعيش فية وليست خرابة للفتنة الملعونة وعاش الهلال مع الصليب وعشت مصر للمصريين وتقبلوا تحياتي اخوكم الكاتب الصحفي سيد الخمار"
archived = "2010-03-14"
