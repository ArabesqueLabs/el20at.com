text = "بسم اللهالواحد بعد احترامى لكل المعلقين اسمحو لى ان اوضح بعض الا شياء اولا الا خوة لا يجوز ان حد يكفر حد وكلنا مسلمين ثانيا نحن نعز الا خوة الا قباط او المسحين لان كلمة قبط تعنى مصرى ما علينا الا سلام والقران واحديث رسول الله كل ذلك يقول لا اكرة فى الدين انا شايف ان الا خ الكاتب متعطف مع الا خوة المسحين ودة اكيد طبعا علمانى هو والا خ الصحفى محمد ميدو يقول القران الكريم ولن ترضى عنك اليهود ولا النصارى حتى تتبع ملتهم والله يا اخى الناس دى ما تكن لك ولى غير الحقد والكرة بمعنى لدينا اطفال ولوالا طفال تلعب مع بعض ويتعملون با لفطرة فا طفال المسحيى عندما عرف ان الذى يلعب معة اسمة احمد فقال لهة ان با با وما ما قالولى ملعبش مع حد اسمة محمد علشان دة وحش وبعد كدة تاتون انتم با فكاركم وتقولون المتخلفين ودعاة الفتنة والله ليشو دعاة فتنة ولكن دعاة محبة ولكن هم لا يرضون بذلك وان كنت زيك لية اصحاب مسحين ولكن عندما وجدونى التزمت وربيت اللحية انصرفو عنى وهذا ان يدل يدل على حقدهم على الا سلام وعلى الفتح الا سلامى ادعوكم يا دعاة التعايش ان تتقوا الله فينا وفى المسلمين والبلد بلد اسلامى مهما عماتو ولو تحسبة حسبة بسطة هتعرف فين الصح من الغلط ومش كل واحد هيقول انة صحفى ويتفزللك علينا هنيا لك بيهم واحضر دروسهم بس بلاش تظهر ان المسلمين متخلفين ودعاة ارهاب وتطرف واتحدى لو واحد بس مسيحى شاف الى شافة اى شيخ مسلم او الناس دى دافعة عن حقوق هذة البلد زى المسلمين وحسبى الله ونعم الوكيل فى كل من اراد سواء للاسلام"
