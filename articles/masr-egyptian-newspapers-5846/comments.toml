[[comments]]
order = 2
subject = "إنتم سبب الفتنة فى مصر !"
author = "محمد ميدو"
posted = "2007-05-15"
text = "الجهلاء مثل أبو الأفكار و الأخ التانى اللى كاتب بعده على طول هم سبب الفتنة الطائفية اللى فى مصر !<br />على فكرة .. أنا صحفى و دخلت مليون كنيسة علشان أعمل تحقيقات صحفية و أحاديث صحفية و الكلام اللى إنتم بتقولوه ده فى الهوا ..<br />الكنيسة أمن الدولة برضه مسيطر عليها و بيدى القسس تعليمات عن الخطاب الدينى اللى مفروض يتقال ..<br />و على فكرة برضه .. أنا حضرت كذا حديث لكذا قسيس مسمعتش منهم حد بيسبنا ولا بيلعنا ولا بيتمنى لينا الحرق زى ما كتير من أئمة المساجد بيعملوا معاهم ( مع المسيحيين يعنى )<br />أما بناء الكنايس فده مشكلة لوحده ... و حتى ترميم كنيسة أو بناء دورة مياه فى كنيسة عاوز تصاريح و موافقات من أمن الدولة و من رئيس الجمهورية و مؤخرا من المحافظ ! كل ده علشان الناس دى تبنى كنيسة !<br />و بعدين قولولى : هو إنتم يضركم إيه لو كان لكل مسيحى كنيسة ؟؟<br />ما إحنا لكل واحد فينا مسجد و بنصلى فى أى حته إحنا عاوزينها .. يعنى انا لو لقيت نفسى إتأخرت فى الشغل بفرش سجادة الصلا و أصلى أما المسيحيين فمش عندهم الحكاية دى .. يعنى لازم يصلوا فى كنايس و مينفعش يصلوا على الأرض زى المسلمين ..<br />طول ما أفكار زى بتاعتكم دى موجودة هنفضل طول عمرنا ورا ..<br />عمرنا ما هنبص للمستقبل ولا للتنمية ولا لأى حاجة عدلة طول ما إحنا مشغولين بأمور متخلفة زى اللى بتتكلموا فيها دى ..<br />العبادة و الدين علاقة بين الإنسان و ربه محدش يتدخل فيها خالص ..<br />إفهموا بقى .. إيه القرف ده ؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "ايه الحماسة دى كلها"
author = "لا جامد صحيح"
posted = "2007-05-15"
text = "ايه يعنى انت صحفى كلامك مقدس يعنى جاى من عند الرب وبعدين مفيش حد مسلم بيتكلم بالحماسة دى انت اكيد مسيحى ولو كنت مسلم مش مهم برضه<br />امن الدولة مسيطر على الكنيسة دى نكتة الصيف والله يستجرئ ظابط يدخل من غير اذن كانوا صلبوه عمركم شفتوا قسيس بيتاخد امن الدولة ويتنفخ انما الشيوخ فهذا مباح<br />عمرك ما شفت جامع زحمة خالص يوم الجمعة اللى المفروض يكون كده كل ايام الاسبوع انما موضوع جنابك كنيسة لكل مواطن فياريت الجهبذ يفهمنا ازاى لاننا جهله اعذرنا<br />وبالنسبة للشيوخ اللى بيقولوا ويتكلموا عن النصارى دى اقصى كلام ممكن يتقال ومعروف وبيتقال علنى انما انت تعرف ايه بيتقال عنك جوه الكنيسة ومسرحية كنت اعمى والان اعمى مش بعيدة زى م قال ابو الافكار فعلا خطابين خطاب ظاهرى عشان الاعلام وخطاب ليهم هما جوه الكنيسة انام المسلمين خطاب واحد وعلنى ومعروف للكل<br />بالنسبة لموضوع التنمية خلصت كل مشاكل مصر من فساد وظلم وفساد ووقفت عند الفتنة الطائفية"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "إلى الأستاذ بتاع الجامد"
author = "محمد ميدو"
posted = "2007-05-15"
text = "أولا يا عم الجامد أنا لا أسمح لك بإنك تشكك فى إسلامى فأنت لم تشق صدرى و تعرف ما بداخل قلبى ..<br />أما حكاية إن أمن الدولة مسيطر على الكنيسة فأنا شاهدت الحكاية دى بنفسى .. أمن الدولة بيقايض بناء الكنائس و ترميمها و إصلاحها بخطاب معين يوجه للمسيحيين داخل الكنائس و بتأييد الكنيسة للحزب الحاكم .. يا إما يعملوا كده يا إما مفيش بنا كنايس ولا ترميم ولا أى حاجة من الكلام ده كله ..<br />المسرحية اللى بتتكلم عنها أنا ما إتفرجتش عليها علشان كده ما أقدرش أتكلم عنها أصلا لأنى ماشفتهاش ..<br />أما النفخ فده له مليون طريقة ..<br />و موضع زحام المساجد يوم الجمعة دليل جيد جدا على التدين و على تمسكنا بديننا و أنا مش شايف إنه مشكلة أصلا علشان نتكلم فيها ..<br />موضوع كنيسة لكل قبطى أنا ذكرته على سبيل المبالغة لأنه عمره ما هيحصل طبعا و لكن أنا شفت بلاد كتير مافيهاش كنايس إطلاقا لكن مشفتش بلد مافيهاش جامع أو على الأقل زاوية صلاة صغيرة ...<br />كل رأيى إننا لما نحس كلنا إننا متساويين فى وطن واحد و لينا نفس الحقوق و علينا نفس الواجبات هنقدر نواجه كل الكلام اللى إنت بتقول عليه ده اللى هو الظلم و الفساد لأن الفتنة الطائفية بتفرقنا مش بتجمعنا و عمرنا ما هنقدر نواجه مشاكلنا التانية من غبر ما نكون إيد واحدة فعلا ...<br />أما عن كونى صحفى فده شئ أفخر بيه جدا .. و لما قلت الكلام ده مكنتش أقصد طبعا إن كلامى مقدس ولا حاجة لكن كل قصدى هو إن أنا فعلا رحت الأملكن دى و شفت اللى بيحصل فبها ...<br />أشكرك يا عزيزى على الرد المهذب و الذى لم ترق لغة الحوار الخاصة بى إليه ..<br />لك تحياتى"
archived = "2010-03-14"
capture_url = ""

