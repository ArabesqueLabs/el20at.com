subject = "مالكم يا جماعة ؟"
author = "مسيحى قبطى"
posted = "2007-05-17"
text = "هو كل ده ليه ؟؟؟<br />الدين المسيحى بيقول : باركوا لاعنيكم .. أحسنوا إلى مبغضيكم .. صلوا لأجل الذين يسيئون إليكم و بضطهدونكم ..<br />يبقى تعصب إيه و كره إيه اللى بتتكلموا عنهم ؟؟ ما انا طول عمرى متربى جوة الكنيسة و مفيش أى حاجة من الكلام اللى بتقولوا عليه ده بسمعها ! بالعكس ... لما حصلتلى مشكلة فى شغلى و كنت عاوز أشتكى نصحنى الأب الكاهن بأن أصلى أولا و أترك الله يتصرف فى الأمور حسب إرادته .. و صدقونى .. المشكلة إتحلت من غير شكوى ولا حاجة .. يبقى فين الكره و التعصب ده ؟؟<br />بصوا ... محدش بينكر إن فيه ناس من الطرفين متشددة و متعصبة .. يعنى فيه مسيحى متعصب زى المسلم المتعصب .. لكن التعميم هنا لا يجوز سواء على المسلمين أو المسيحيين ...<br />و لو سمحتوا أوضح نقطة صغيرة ... المشروعات اللى بتتعمل جوه الكنيسة دى بتتعمل لأنها هى مصدر الدخل الثابت الوحيد للكنيسة لأن وزارة الأوقاف طبعا مش بتصرف على الكنايس و هيئة الأوقاف القبطية يادوب إيرادتها بتغطى مرتبات القسس ..<br />أما عن حكاية المعجزات فده شئ العالم كله شاهد عليه و بيتك قدام الناس كلها و ما ننساش ظهور العدرا فى كنيسة الزيتون اللى شافه مسلمين و مسيحيين و تم فيه معجزات شفاء لا حصر لها ...<br />أقباط المهجر قد يكون معظمهم متعصبين نتيجة ظروف خروجهم من البلد ..<br />أما القنوات التى تسب الإسلام فهى بالفعل موجودة و أنا أحد المعترضين بشدة عليها لأنها لا تمثل تعاليم المسيحية فى شئ .. كما أعترض أيضا على القنوات التى لا هم لها سوى سب المسيحية لأنها أيضا لا تمثل تعاليم رسول الإسلام الكريم الذى قال : \" من آذى زميا فأنا خصيمه يوم القيامة \"<br />لنتقى الله جميعا فى وطننا و مستقبلنا ..."
