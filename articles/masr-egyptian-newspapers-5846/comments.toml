subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-05-17"
text = "كل الدوشة دى علشان كنيسة هتتبنى ؟؟؟؟<br />هتفرق معاكم فى إيه إن كنيسة تتبنى ؟؟؟؟<br />و تفرق معاكم فى إيه إن الكنيسة يكون فيها أنشطة تجارية خدمبة ؟؟؟<br />و تفرق معاكم فى إيه إن الكنيسة تطلع رحلات لأولادها لزيارة الأماكن الدينية ؟؟؟<br />و تفرق معاكم فى إيه إحنا نصلى فى كنيسة ؟؟؟؟<br />و لما يكون بلد فيها 30 و 40 أسرة مسيحية و مافيهاش كنيسة يبقى حرام ده ولا حلال ؟؟؟<br />إشمعنى إنتم لما بتخرجوا بره و تروحوا أى دولة بتبنوا فيها جوامع و تصلوا براحتكم رغم إنكم بيبقى عددكم أقل بكتير و محدش بيعنرض ؟؟؟<br />ما إحنا بنسمع شتيمتنا بوداننا كل يوم من ميكروفونات المساجد و محدش بيتكلم !!<br />و مسمعناش صوت حد فيكم لما مرشد الإخوان شتم مصر و اللى فى مصر فى حديث صحفى علنى تم نشره و تم إذاعة تسجيل صوت مهدى عاكف و هو بيسب مصر و المصريين .. ما إتضايقتوش من كلامه و جايين تتنرفزوا و تتعصبوا لما نيجى نبنى كنيسة ؟؟؟؟<br />كفاية بقى ... مش مكفيكم كل ده ؟؟؟؟"
archived = "2010-03-14"
