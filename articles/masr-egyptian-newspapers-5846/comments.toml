[[comments]]
order = 10
subject = "سيناريوهات الاكاذيب لبناء الكنائس"
author = "شيخ البلد"
posted = "2007-05-16"
text = "الليله الكبيره ياعم وسبوبه انفتحت لبتوع بره يكدبوا.... والنت الدش دخل البلد ياولاد ....انت فاكر ياشيخ الخفر من زمان لما كان فى النواحى اللى جنبنا بيت بيصلوا فيه واقولك انا قلبى حاسس ان فيه حاجه يا وله ! وانت تقول بلغت البندر ! ....والبيت بقى اربعه بيوت وسور محوط ومبانى للسما ولقينا كنيسه ظهرت فجأه ومش بس بيصلوا دى بقت ذى السوق من جوه اشى مسرح وفيديو وشرايط ورحلات باتوبيسات رايحه جايه وقال ايه بيقولوا قديس كان مدفون هنا وله بركات ومعجزات ظهرت لما بيقولوا الضى وهج بليل ؟... والنت والدش دخل البلد ياولاد ....وبتوع بره بيعتوا فلوس عشان يبنوا كنايس وبيقولوا انهم مضطهدين عشان الافرنج يدوهم ورق اخضر ويشغلوهم عندهم واهى سبوبه كمان؟......والغرابه ان انهم فى البلد ميه وخمسين واحد بس ازاى بنوا الكنيسه !!! لؤم يا وله....والنت والدش دخل ياولاد ....وشوفنا القسيس بيسب الاسلام هما عايزن اسلام على مزاجهم ... ودا جزء السيناريهات اللى كل ولد فاهمه فى البلد دا النت والدش دخل يا ولاد ....والليله الكبيره ياعم والملعوب انكشف والله حى والله ملوش شريك هو الواحد وملوش تانى الله حى ....والليله الكبيره ياعم يكتبوا ويقولوا اخوان... والنت والدش دخل ياولاد وشفنا بوش بيقول حرب صليبيه ودمروا مساجد العراق وحولوه جحيم ! واللعب تقيل والملعوب انكشف وكله ماشى فى الرايجه وبيروج لكن ربك كبير وانتده على الشيخ فضل يقرأ لنا سوره مريم اللى فى القرأن اللى مش هنتازل عنه ..الله حى ملوش شريك واحد احد ..والليله الكبيره والعالم فى الدش والنت شفناه وقريناه (مع الاعتذار لصلاح جاهين)و"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = "الى الجاهل الذى يقول انه صحفى"
author = "ابو الافكار"
posted = "2007-05-16"
text = "ادخل مواقع غجر المهجر الذين يدعوا انهم اقباطا وشوف بنفسك فيديوهات للقاءت معهم تعرف الخطاب الباطنى الدينى لهم والذين يدعوا فيه كذا بانهم السكان الاصليين فى مصر ! الم تسمع عنها !! انت كداب ولا صحفى ولا حتى مسلم ان من اياهم صبيه المواقع التى تسب الاسلام فقط وهل تريد مواقعهم ايها الكداب الجبان..... ولو انت صحفى لعلمت حسب تقرير الحاله الدينه لمركز دراسات الاهرام ان هناك 500 كنيسه بنيت سرا ويريدون ترميمها ! فهم فى ورطه لانه لايوجد اوراق رسميه لتلك الكنائس وحتى يتم اعتماد المخططات الهندسيه للترميم ! ولايوجد لديهم اى رسومات تدل انها كنيسه رسميه ؟ والكهنه يعرفون ذلك ويروجون للاكاذيب !! ولا مانع لدى لبناء كنيسه فقط للعباده وليس سوبر ماركت بانشطه تجاريه الكنيسه للعباده مثل المسجد ولكن الكهنه لكى يسيطروا علة عقول الاقباط يرودوها مركزا لبيع الاشرطه ومسرح و الخ كى يدر عائدا ويتمتع الكهنه بركوب المرسيدس والحياه الفخمه وهم فقط من يظهرون فى الفضائيات واقصوا المفكرين امثال د. ميلاد حنا وغيره ........فهمت هناك تجبر كنسى على الاقباط من الكهنه فهمت يا صحفى هههههههههههههه"
archived = "2010-03-14"
capture_url = ""

