subject = "كلامك مضبوكط 10/10"
author = "الدكتور"
posted = "2007-06-04"
text = "والله الكلام المكتوب دا تقريبا مضبوط مية ف المية اما بالنسبة للاخ بيبو مع احترامى لية والفرانكو اراب اللى كاتبة دا يبقى ما يعرفش حاجة عن مواطنين الامارات ز عزيزي الكلام اللى مكتوب دا فعلا هو تصرفاتهم انت لو عاشرتهم على الظاهر بس تلاقيهم زوق جدا ولو عايز منك مصلحة يبقى يعاملك احسن من اخوة و يبقى كريم جدا معاك<br />لو مفيش مصلحة منك او لو انة لو انة لية حق عندك يبقى اسوا شخصية عرفتها للاسف ممكن تلاقية يكلمك وكانك شغال عندة<br />مع العلم انا هنا شغال مهندس فى شركة كبيرة وكل تعاملاتى معاهم من اكتر من 5 سنين وعارف طبعهم كويس<br />اما بالنسبة للخ كاتب الموضوع دا فانى احيك على مقالتك الجميلة وعلى دقتها فى وصف ما يسمى بالمواطن"
