subject = "ضع عنوان التعليق"
author = "لينا عبود"
posted = "2007-05-09"
text = "مع احترامي لمجهودك في كتابة مقالك ..<br />ولكن ليس كل المواطنين بهذه الصوره.. واقصد بالمواطن اي مواطن في اي بلد عربي وان كنت قد حددت مسبقا هوية معينه للمواطن<br />ولكن ياعزيزي ليس كل الناس سواسية...<br />فهناك مواطنون يتركون انطباعا رائعا عن بلادهم<br />كما ان هناك مقيمون يتركون اسوء الانطباعات لدى الاخرين<br />كم حادثة اغتصاب واختطاف وقتل حصلت من قبل باكستاني او هندي او غيره<br />وكم عملية نصب كان ابطالها من المقيمين<br />اصابع ايدك مش سوا<br />وختاما ..<br />مواطنا ومقيما .. يجب ان يقيموا وزنا وتقديرا لما ينعمون به من مزايا وخيرات البلد الذي يحتويهم<br />ولا خير لعربي على اعجمي إلا بالتقوى<br />اختلاف وجهات النظر .. لا يفسد للود قضيه"
archived = "2010-03-14"
