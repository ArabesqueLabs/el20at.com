subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
posted = "2007-06-24"
text = "مش عارفه ليه بقيت بنظر لفيلم تيتانيك نظره مختلفه بعد سماعى لتسجيل الصندوق الاسود الخاص بالعباره السلام<br />من بعدها معدش الفيلم هو قصه الحب البديعه بين جاك و روز ابطال الفيلم اد ما بقى الكارثه الحقيقيه لغرق مئات الارواح<br />ز و فعلا فى كل مره بشوف الفيلم ببدا ف البكا من اللحظه اللى بتنطفى فيها انوار السفينه لان اللحظه دى فعلا اللى بتتجلى فيها بدايه النهايه<br />سفينه تغرق و ناس تموت علشان<br />ناس تبدع روايات و افلام و اخيرا مزادات و مكاسب ماديه"
