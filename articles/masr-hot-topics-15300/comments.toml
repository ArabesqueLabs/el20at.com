text = "و الله يا جماعه النظام الجديد فيه بصيص من الامل<br />بس ربنا يستر<br />فيما يتعلق بنقطه المدرس فهى سلاح ذو حدين بمعنى انها هترجع هيبه و احترام المدرس لكن فى نفس الوقت هتدى فرصه لضعاف النفوس من المدرسين اضطهاد الطلبه حسب اهواءهم<br />و هيبقى الحل ف المساله دى ان الطالب ياخد درس عند مدرس الفصل و يرجع ابوك عند اخوك و نبقى بندور ف حلقه مفرغه و بنلف حوالين بعض<br />معلش يا جماعه بقالى كتيييييييييير مكنتش بدخل عشرينات حد بس يقوللى الارشيف الارشيف منين"
