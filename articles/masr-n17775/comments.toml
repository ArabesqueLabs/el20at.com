subject = "عيد سعيد"
author = "عيد"
posted = "2008-10-01"
text = "عيد سعيد<br />تقبل اللة صيامكم<br />عيد سعيد<br />اعادة اللة عليكم جميعا<br />بالصحة والسعادة<br />والسنة الجاية<br />سواء كنتم صبيان والابنات<br />تبقوا متزوجين وفى بيت العدل<br />والمتزوجين يبقى عندهم دستة اطفال<br />واللى عملوا كل دة<br />يكونوا فى مكة والمدينة فى زيارة الحبيب رسول اللة<br />كل سنة وانتم طيبين جميعا"
archived = "2008-10-01"
capture_url = "https://web.archive.org/web/20081001204615/http://masr.20at.com:80/newArticle.php?sid=17775"
