[[comments]]
order = 0
subject = "ربما كان عندة حق"
author = "مش من الحزب الوطنى ولا اخوان"
posted = "2008-11-10"
text = "فى زمن الخليفة عمر بن الخطاب<br />امتلىء بيت المال بالنقود وزاد واراد الخليفة عمر ان يتصرف فية فجمع الصحابة ليعرض عليهم رأية فى توزيع هذا المال على الفقراء والمحتاجين زيادة على نصيبهم من بيت المال<br />فرفض الصحابة رأى عمر على توزيع تلك الاموال هكذا بدون عمل على الفقراء وقالوا لة<br />كلف الفقراء بعمل يعملوة ثم اعطهم اجرا من هذا المال فيستفيدوا<br />سألهم عمر - وما هو العمل الذى اكلفهم بة ؟<br />رد علية الصحابة - دعهم يحفرون ابارا للمياة واعطهم اجرهم<br />وفعل عمر ما اشاروا علية بة<br />ثم بعد مدة - جمع الصحابة مرة اخرى وقال لهم لقد حفرنا ابارا كثيرة جدا للمياة ولا زالت هناك اموالا فى بيت المال فماذا نصنع ؟<br />ردوا علية -0 دعهم يردمون ما حفروا<br />والهدف من القصة ان المال الذى يقبضة انسان يكون نتيجة عمل وتعب وعرق<br />ولكن عمر وفر لهم فرص العمل<br />والمطلوب توفير فرص عمل لهؤلاء الشباب وليس صرف بدل بطالة وهم جلوس فى البيت<br />مسئولية الرئيس او اى حاكم توفير فرص العمل"
archived = "2010-03-14"
