[[comments]]
order = 1
subject = "كلام الليل زي الذبدة تطلع عليه شمس النهار يسيح"
author = "واحد إنتم صعبانين عليه قوي"
posted = "2008-11-10"
text = "يا هناكم بريسكم المفكر الحنون ما هو لما ما بيموتش منكم كثير في العبارات و سقوط العمارات و إنهيار المقطم و المياه و الأكل المثمم وجد لكم حل أكيد بيجيب نتيجة &--1633;&--1632;&--1632;&--1642; و دي بسيطة يبعت شبابكم للعراق قال إيه علشان يعمروها طيب أهل العراق بيهربوا منها ليه أصلهم ناس مثل بقية العرب مرفهيين مش زي حبايبه اللي ساكنين جنبه في الشمال و ضيوفه الدائمين في شرم أو شرخ أهو بكده أكيد الداخل فيها مفقود و إن خرج فهو مولود. و على فكرة الحزب الواطي و مطيباتينه ميزيتهم إيه أن كل واحد له &--1633;&--1632; أماكن للحج طيب وإن كان العضو نصراني أو يهودي زي يوسف والي مثلا حيحج إزاي آه أنا نسيت إن حرامي الحرمين و مشايخه حللوها ماهو القرآن الكريم قال \" و على الناس حج البيت.. إلى آخر الأية يعني مش للمسلمين فقط، إنتم صحيح عندكم تيس مهتم بيكم قوي و عبقري في تفكيره بس هو عنده أصلا مخ حد يقدر يجاوب.<br />ربنا معاكم و لا بصراحة مفيش داعي لأن الشجاعة و الكرامة ما بقتش من شيماكم،"
archived = "2010-03-14"
capture_url = ""

