[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-01-22"
text = "اتفضلى ياست ايمان اشرحى يعنى ايه شذوذ ويعنى ايه سحاق, اتفضلى, اللى يخلى الواحد يبكى بجد ع الناس دول انهم فاكرين انهم بيوعوا الشباب وهم ابعد مايكونون عن ذلك بل هم ببساطه بيعرفوا اللى مش عارف ويخلوه يجرب , ياااربى......ويطلع سمير صبرى فى المسلسل ويتكلم عن دعاه الفضائيات اونهم مش فاهمين الدين صح,,لا انت اللى فاهمه ياباشا,,,,,,,,,مش عارف اقول ايه ع الناس المتخلفيين دول....واحده متبرجه وبتتعرى فى افلامها وبتعمل ادوار اغراء هى اللى هتوعى الشباب وبعدين يقولوا انهم بيأدوا رساله ,,ياسلام على الرساله,,,انما الناس اللى بيطلعوا زى محمد حسان والناس دى مبيعرفوش حاجه ومتشددين ومش فاهمين الدين صح,,, الحاجه غاده وسميه وغيرهم بطلعوا على الشاشه لابسين لبس مغرى جدا جدا وانتم عارفين طبعا لبسهم عامل ازاى وممكن يطلعوا بقمصان نوم ,,,واكيد طبعا ده بيحرك شهوات الشباب لان ببساطه ياساده مفيش شباب كتير قادر على الجواز ,,وسلملى على الرساله اللى بيقدموها....رسالة ايه اللى كل شويه يتكلموا عنها الرساله اللى اتقدمت فى مسرحيه مدرسه المشاغبين مثلا واللى جرأت الطلبه على المدرسين ولا الرساله بتاعات اللمبى اللى خلت الاطفال لسانهم معوج وبيقلدوا اللمبى فى كل حاجه وتلاقى اطفال مسميين نفسهم اللمبى وبوحه وعوكل,,وسلملى على الرساله,,, ولا الرساله فى عماره يعقوبيان وحين ميسره اللى خلت الناس تسال هو يعنى ايه سحاق ويعنى ايه شذوذ وهل فعلا حد بيعمل كده ,,,وقال بيوعو الشباب وسلملى على الرساله.<br />والله انتم السبب الاول فى بعد الشباب عن ربنا باللى بتعملوه ,,<br />ربنا يهديكى ياغاده وياسميه وياكل الفنانين ربنا يهديكم والله المستعان هو حسبنا ونعم الوكيل"
archived = "2010-03-14"
