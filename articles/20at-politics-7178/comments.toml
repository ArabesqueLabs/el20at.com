[[comments]]
order = 2
subject = "تصحيح معلومة"
author = "المطالع بن الكتاب"
posted = "2007-09-27"
text = "انا تعلمت بذات الجامعة و كنت عضو ادارة في حركة الرسالة الطلابية و هي اول حركة اسلامية في جامعات ال48 وتضم في ثناياها شتى الوان الطيف من الاسلاميين , اما جمعية اقرا فقد نشات بعد حركة الرسالة بسنتين وهي تابعة لتيار اسلامي محدد يسعى لبسط نظرية الرؤية الواحد في الجامعات ولذا فانه شطر الرسالة الى 3 تيارات اسلامية . يتم تعيين الادارات الجامعية التابعة لاقرا , ولكن الرسالة كانت تنتخبهم انتخابا .<br />كان يجب على الاخت ايمان المصري تحري الامانة التاريخية و ذكر المعلومات بدقة و خاصة انها كانت من اعضاء ادارة حركة الرسالة الطلابية.ان تجاهل الاخت ايمان للحركة التي انتخبت فيها من قبل كادرها يعزز ما ذهبنا اليه ان اقرا تسعى لفرض الراي الواحد و كتابة تاريخ يتوافق مع رؤاها(ابحث غوغل \"مدونة مبادرتن\"-)ا"
archived = "2010-03-14"
capture_url = ""

