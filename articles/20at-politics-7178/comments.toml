text = "انا بالجامعة العبرية<br />الدراسة هناك جدا متأزمة<br />وعلاقتنا مع الطلاب اليهود زي الزفت،الواحد بتمر عليه صعوبات كتيرة بس لازم يستحمل لانو الجامعة العبرية من أقوى الجامعات<br />الأساتذة جدا رائعين بس طبعا بيتعاملو معاك تعامل سياسي بحت في اكثر الاحوال<br />المقال جدا رائع<br />مشكورين"
