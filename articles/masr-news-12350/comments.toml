author = "الى المعلق السابق"
posted = "2009-06-12"
text = "حزب الله وايران دول شوية عيال حراميه وخونه وعملاء اسرائيل بطريق غير مباشر ولا يمثلون اي خطر على اسرائيل وامريكا بتساعدهم<br />والعدو الاول لامريكا واسرائيل هم اهل السنه والجماعة<br />ولذلك امريكا بتساعد ايران وحزب الله لضرب اهل السنه والجماعة<br />ولازم تعرف ان الشيعة دول شوية عيال سفله لم يقدموا اي خدمة للعالم الاسلامي<br />اهل السنه والجماعة هم الذين نشروا الاسلام في جميع انحاء العالم<br />الشيعة والخوارج لم يفعلوا اي شيء<br />الشيعة ما عندهمش اي حاجه الا سب امهات المؤمنين والصحابه<br />وبعدين حزب الله دي كلمة ذكرت في القران<br />الا ان حزب الله هم المفلحون<br />ونزلت في الصحابة رضوان الله عليهم<br />مش في كلاد الكلب دول بتوع حسن نصر الله سباب امهات المؤمنين<br />روح ياابني اتعلم واقرا واعرف دينك كويس بلاش موجة اانفلونزا الهبل والعبط اللي ما شيه اليومين دول<br />سلام ياصاحبي<br />_______________ _______________ _______<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-03-14"
