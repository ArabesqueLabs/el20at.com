subject = ""
author = "الى ال البيت"
posted = "2009-06-13"
text = "فيه حاجه اسمها الفكر الصوفي<br />الفكر الصوفي دول من اهل السنه والجماعة<br />واهل السنة والجماعة مسلمين ويحبون ال البيت ويعظمونهم ويقدرونهم وينزلونهم منزلتهم الصحيحة<br />والذي يحب ال البيت الذين هم سيدنا علي وفاطمة الزهراء والحسن والحسين لا يكره ابدا ازواج النبي امهات المؤمنين السيدة عائشة ام المؤمنين والسيدة حفصه ام المؤمنين والسيدة ام حبيبة ام المؤمنين<br />الذي يحب اولاد الرسول لا يكره ازواجه صلى الله عليه وسلم<br />والموضوع طويل اوي ويطول شرحه<br />ولكن اهل السنة والجماعة هم غالبية العالم الاسلامي وهم الذين قادوا الفتوحات الاسلامية على مدار 14 قرن واهل السنة والجماعة هما الذين في اقل من 100 سنه وصلوا بالدةولة الاسلامية من اسبانيا الى الهند<br />الشيعة ما عملوش حاجه<br />الشيعة بيلطموا ويسبوا وبس<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""

