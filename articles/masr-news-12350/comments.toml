text = "الى المعلق السابق<br />انت بتتكلم عن السنة ؟ يا اخى ضحكتنى - هما راحوا فين - وقصدك مين بيهم<br />نصف السعودية خمسة ستة مليون وربع سوريا - طبعا الخليج كلة فارسى وروح شوف جوامعهم فى دبى والبحرين والدوحة<br />وطبعا المغرب كلها تحت حكم امير المؤمنين سليل الفاطميين<br />يمكن قصدك مصر - وانت بجهلك لا تعرف ان امهات الكتب الشيعية فى العالم تمت كتابتها بواسطة علماء الازهر والفكر الشيعى نصفة مصرى على الاقل - وابقى روح اقف قدام جامع السيدة والحسين وانت تشوف"
