author = "نفلونزا الخنازير"
posted = "2009-06-13"
text = "حتى الان معظم المصابين فى مصر من الاجانب اكلة الخنزير<br />والخنزير لحمة محرم فى التوراة او العهد القديم والقران<br />وفى البرديات ذكر ان المصرى القديم اذا لمس خنزيرا كان يذهب ويلقى بجسمة فى النيل للتطهر من النجاسة<br />والمصرى القديم ايام الفراعنة كان يحرم لمس او اكل الخنزير<br />فكراهية الخنزير متوارثة من ايام اجدادنا الفراعنة<br />وللمحافظة على التراث الفرعونى يجب اعدام كل الخنازير وعدم تربيتها مستقبلا فى مصر"
archived = "2010-03-14"
capture_url = ""

