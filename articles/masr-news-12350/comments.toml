subject = ""
author = "االجهل بلا عنوان"
posted = "2009-06-13"
text = "والخيل والبغال لتركبوها ولكم فيها زينة حين تريحون وحين تسرحون<br />والزينة هى ان تتزين وتتجمل بها وتسر لؤيتها<br />ولا اظن ان احدا يسر لرؤية الخنزير الا اذا كان من نفس الفصيلة<br />واظن ان لمس الكلب يستلزم الوضوء من جديد وكذلك لمس جسد الانسان الميت<br />فالانسان المكرم من اللة بعد موتة اذا لمسة انسان وجب علية الطهارة اى الاغتسال والوضوء قبل الصلاة<br />وكذلك الخنزير الذى ياكل الجيف والقاذورات والوساخة وتعلق بة الجراثيم والميكروبات فعند لمسة وجب الاغتسال<br />اما الشعراوى فعلى عينى وراسى من فوق ولكن"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = ""
author = "الى المعلق السابق"
posted = "2009-06-13"
text = "يا اخي الكريم الخنزير لا هو نجس ولا يحزنون<br />زي ما قال الشيخ الشعراوي<br />الخنزير دا مخلوق ربنا سبحانه وتعالى خلقه ولكن له مهمة في هذه الحياه<br />الا وهي اكل القمامه وهذا شيء مهم للبيئه<br />الخنزير لا هو نجس ولا هو لا يغار على انثاه ولا كل الكلام اللي انت بتقولوه دا<br />الخنزير خلق لمهمة اساسية الا وهي مساعدة الانسان في التخلص من فضلاته<br />لذلك حرم الله ذبحه لان ذبحه يضر بالبيئه<br />وفي فتاوي بتقول ان الله حرم اكله لانه لا يغار على انثاه<br />كل هذا كلام باطل<br />والكلام الصحيح ما هو موجود في دروس الشيع الشعراوي<br />الخنزير مخلوق لمساعدة الانسان على نظافة البيئه<br />زي ابو قردان صديق الفلاح<br />الحكومة حرمت صيده لانه بيساعد الفلاح في اكل الدوده"
archived = "2010-03-14"
capture_url = ""

