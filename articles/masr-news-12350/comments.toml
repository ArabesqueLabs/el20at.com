author = "انفلونزا الكلاب - طز"
posted = "2009-06-12"
text = "هتعمل اية انفلونزا الخنازير<br />هتكون اخطر من فيروس الكبد سى ولا سرطان الكبد ولا الفشل الكلوى - هتعمل اية انفلونزا الخنازير فينا - ومين قال انها مش منتشرة من سنين - هو فية احد من الفقراء بيروح للدكتور والا بيكشف<br />فية مستشفى حكومى بيعمل تحاليل<br />انا رحت اعمل تحليل فصيلة الدم فى المستشفى الحكومى علشان التجنيد بعد انتهاء الدراسة وتحليل الدم والشهادة مطلوبة لتقديمها الى منطقة التجنيد<br />دفعت الرسوم اربعة جنيهات ورحت الى بنك الدم فى المستشفى لعمل التحليل واستلام الشهادة - الدكتورة طيب اللة ثراها كتبت من دماغها وبدون اى تحليل فصيلة الدم ا وعندما نبهتها انها معملتش تحاليل وكتبت فصيلة دمى غلط قالت لى توكل على اللة تحليل اية<br />زى الكشف على ال[ *** ]ان قبل الزواج - تدفع الرسوم - وبدون اى كشف يذكر ولا تحاليل يكتب لائق<br />هو فية احد فاضى لاحد<br />هما بيضحكوا على مين<br />مفيش بلد اصلا<br />سيبكوا من الكلام بتاع التليفزيون - البلد منهارة انهيارا كاملا"
archived = "2010-03-14"
capture_url = ""

