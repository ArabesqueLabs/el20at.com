subject = "قبلة الحياة"
author = "شيما"
posted = "2008-12-15"
text = "لأنى لا احب الكلام فى السياسة لكثرة المتكلمين و قلة الفاعلين ، فانى احببت الكلام عن هذا الموضوع .<br />ضرب رئيس دولة و خاصة اذا كانت امريكا و خاصة اذا كان جورج بوش \\\"الديمقراطى\\\" بالتأكيد ليس بالامر الهين و بالتأكيد يحمل من ردود الافعال الكثير و الكثير و الخطير .<br />اسماها قبلة الوداع ، و اسميها انا قبلة الحياة ، استطاعت – برغم بساطة الفعل – ان تعيد احساسا غائبا بنشوة التشفي فى رمز احتلال امريكي أذاق الكثيرين ويلات و ويلات ، و أراق من الدماء انهارا و انهارا .<br />قبلة الحياة لكرامة انسانية و عربية و اسلامية تشكو الى الله حالها تحت اقدام نجسة ملوثة بدماء الابرياء .<br />حافظ المرازى الاعلامى الذي استضافته منى الشاذلى رأى الموضوع بالنسبة للناحية المهنية لا يجوز و لا يصح . و انا اتفق معه خاصة اذا كان يقصد من ذلك الا تكون هذه الحادثة اشارة لفتح باب تجاوز الصحفيين و الاعلاميين و عدم تجرؤهم على تكرار مثل هذا الفعل .<br />و لكن من ناحية اخرى فهذا الصحفى انسان اولا ، عراقى ثانيا ، مُحتَل ثالثا ، يقف امام عدوه رابعا الذي جاء ليلقى النظرة الاخيرة على جريمته الشنعاء على ارض العراق بكل اريحية و ود متبادل مع نور المالكى . اعتقد النظرة من هنا تختلف تماما .<br />شجاعة ، جرأة ، احساس بحرية و كرامة مهدرة ، لتطلق على ما فعله منتظر الزيدى ما تشاء ، و لكن الاهم من المسميات انه استطاع بتلقائية ان دلت على شىء فانما تدل على انه فاض الكيل و جف النبع ، استطاع ان يخلع حذائه و يرمى به رئيس دولة امريكا جورج بوش ، هكذا بكل بساطة ، ليكرر فعلته مرتين متتابعتين بكلا فردتى الحذاء .<br />لماذا هو البطل في عين كثيرين ؟؟؟ ، لأنه فعل ، وضع مشاعره و افكاره و اتجاهاته ازاء ما يحدث على ارض بلاده و فى ابناء جلدته ، وضع كل ذلك فى حيز الفعل و لم يكتفي بأفعال العاجزين .<br />ربما فعله هذا ليس تحريرا لأرض محتلة ، او قتلا لعدو همجي مأجور ، و لكنه على الاقل تنفيس و تعبير عن رغبات مكبوته مشروعة و انسانية بحته ، استردادا لبعض كرامة مهدرة .<br />لن اقول محزن او مخزي ما فعله عراقيون تكالبوا على منتظر الزيدي ، و لكن اقول ، قريبا و قريبا جدا ستنهال عليكم انتم الاحذية و لكنها لن تكون احذية الشرفاء ، ستكون احذية انتم من انحنيتم لتنظفوها من دماء ابنائكم و اخوانكم .<br />اخشى ما اخشاه ان تكون قبلة الموت لمنتظر الزيدي ، و لكن حتى و ان كانت فيالها من قبلة يتمناها كثيرون من الاحرار ، و عزاؤنا وقتها بعض كلمات هى :<br />و ان كان من الموت بُد ... فمن العار ان تموت جبانا"
