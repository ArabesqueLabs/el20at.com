[[comments]]
order = 5
subject = "الحزب الإسلامي غير الثورة الإسلامية في العراق"
author = "هشام لبودي - مصر"
text = "أرجو من الأخ كاتب المقالة أن يتحرى الدقة في كتابته<br />فالحزب الإسلامي العراقي هو حزب إسلامي سني يتزعمه طارق الهاشمي نائب الرئيس العراقي الحالي، والحركات المسلحة السنية لا تتفق معه في توجهه السياسي، حيث يتبنى فكرة المشاركة في العملية السياسية حتى لا نترك الأمر كله بيد الشيعة، وللحزب الإسلامي قناة فضائية تسمى بغداد، والحزب الإسلامي مبني على فكر الإخوان المسلمين.<br />أما عبد العزيز الحكيم فهو زعيم حزب الثورة الإسلامية في العراق وهو حزب شيعي مدعوم من إيران، وهو ما يقصده الكاتب في مقاله، وله قناة فضائية تسمى الفرات، والثورة الإسلامية يؤمن بولاية الفقيه.<br />هناك فرق كبير جدا بين الحزب الإسلامي (سنة) والثورة الإسلامية في العراق (شيعة)."
archived = "2010-03-14"
capture_url = ""

