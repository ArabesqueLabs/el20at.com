subject = "النصر اتي انشا اللة"
author = "العراق الحر"
text = "الزوراء قنات الحقيقة تعرض صور وحقائق عن الذي يحدث في العراق وما يفعلة المجرم السفاح مقتدى والكافر الايراني الحقير عبد العزيز الحكيم وتدعو للمقاومة وطرد المحتل والجهاد في سبيل اللة وطرد الفرس الذين صيطرو على البلدوعاثو في الارض فساد ادعو من اللة ان يقف مع العراقين الشرفاء المجاهدين الصابرين لهم الدنيا ولنى الاخرة واللة مع المئمنين"
