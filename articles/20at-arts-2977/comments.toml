[[comments]]
order = 7
subject = "ملاحظة جديرة بالأهتمام"
author = "أبو حنين"
text = "أشكرك بشدة أخى هشام لبودى وأضم صوتى إلى صوتك فى ان كاتب المقالة يجب أن يفرق بين الحزب الأسلامى السنى والذى من قادته حسنى عبد الحميد وطارق الهاشمى وبين حزب الثورة الإسلامية الشيعى والذى هو المقصود فى المقالة.<br />اما رأيى الشخصى حول هذه القنوات فهو أنها تفرق أكثر ما تجمع بين أطياف الشعب العراقى إلا أنها لها حسنة وحيدة لكنها جليلة وعظيمة الا وهى فضح الكذب الأمريكى وتبدد الوهم المزعوم عن الجيش الأمريكى وتقذف فى قلوب الذين كفروا<br />الرعب وترفع من معنويات الأمة الأسلامية."
archived = "2010-03-14"
