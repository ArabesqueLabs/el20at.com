subject = "هو ده عادل امام وافلامه"
author = "منى وهيب"
posted = "2007-12-14"
text = "الناس اللى بيقولوا عن عادل امام وافلاه انها فيها استهتار وجراه على ربنا وعلى الدين طبعا كلامهم صح لكن للاسف عادل امام عنده خط تانى فى افلامه وهى خطه مع وحيد حامد الافلام الجريئة اللى بتكره الظلم والفساد واستغلال النفوذ وظلم البسطاء وبتشجع الناس على رفض الحكومة الظالمة واخد حقوقها يعنى هم ناس بيطالبوا بالحق والعدل لكن بعيد خالص عن اى رؤيه ايمانيه بالعكس دول رافضينها انا بقى مش بحب عادل امام لكن ماانكرش خفه دمه وايجابيات افلامه بشوف الحلو واكره الوحش واللى انا رافضاه وياريت يا جماعة نقول ربنا يهدى الناس دى لان قد يكون فيهم خير لان اما كان حد يدعى على انسان عاصى ايام سيدنا رسول الله كان يقوللهم ( لا تعينوا الشيطان على اخيكم) يعنى ندعى للعاصى بالهدايه احسن ده احنا يا جماعة المفروض ندعى للكافر نرفض تصرفاتهم وندينها لكن نتمنى الهدايه وعلى فكرة يا جماعة عادل امام بينفذ رؤيه مؤلف ومخرج لانه بجد ممثل شاطر لكن هو للاسف مابيفهمش اى حاجه خالص ولا يعرف يقول كلمتين على بعض فى اى حديث الا لو كانوا محفظينه بيردد وخلاص ويمثل قوى الثقافه واى حد بيفهم حيعرف انه مش فاهم حاجه"
archived = "2010-03-14"
