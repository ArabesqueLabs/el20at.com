text = ":-) شكرا يا مروة على الحوار وربنا معاكى الصراحة بوجى وطمطم من امتع الحلقات التى كانت تشجعنا على الصيام وانتظار الافطار ليتبعه مسلسل بوجى وطمطم وما زلنا حتى وقتنا هذا نحلم بالطفولة وهذه الحلقات تعيد فينا الطفولة الجميلة فشكرا جزيلا لك مع مزيد من التقدم والنجاح :-)"
