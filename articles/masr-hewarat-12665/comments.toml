text = "هايل يا مروة برافو عليكِ<br />حوار محكم وفي الصميم<br />ولكنى كنت أحب أن اعرف قناة عرضه<br />كل أمنياتي لمزيد من الإبداع<br />ملحوظة<br />شكر خاص لعلى على نقل الموضوع على الفيس"
