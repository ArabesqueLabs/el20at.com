text = "مع احترامى لكا افراد بوجي وطمطم الجديد انا بتمنالهم كل التوفيق يارب ويطلعوا جيل جديد متاثر بيهم زى ما تاثرنا احنا زمان ببوجى وطمطم<br />ولكن انا من الى سمعوها بصوت الفنان الراحل يونس شلبي والفنانه الجميلة هالة فاخر صوتهم فى ودنى ومش متخيلة انى اسمعها من حد غيرهم :oops:"
