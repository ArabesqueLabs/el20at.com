[[comments]]
order = 10
subject = "تخيل لما المحامي يتفق مع خصم موكله على موكله"
author = "مش ححبك"
posted = "2009-02-24"
text = "تخيل الطايفة الوسخه دي لما تكون موكل محامي في القضية ودافع اتعاب<br />وبعدين يجي الخصم يتصل بالمحامي بتاعك اللي انت عامله توكيل ويتفق معاه ضده<br />والمحامي يبيع موكله<br />اي والله العظيم دا حصل معايا<br />اتفوووووووووووووووووووووووووو خص على نقابة المحامين باللي فيها<br />نقابة وسخه<br />شاريهان خريجة كلية الحقوق وكانت عايزه عضوية في النقابة<br />معرفش النقابة رفضت ليه ما هم كلهم رقاصين ولاد قحبه"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203457/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
order = 11
subject = "هؤلاء الرجال العظام وبنائهم لاقتصاد مصر الحديثة با"
author = "من الحزب الوطنى الديمقراطى"
posted = "2009-02-24"
text = "تحت توجيهات الفكر الجديد للجنة السياسات قام هؤلاء العظام ببناء اقتصاد قوى دعم اقتصاد الدولة<br />المهندس البطل بانى مصر الحديثة المهندس احمد عز صاحب مصانع حديد عز عملاق الصناعة المصرية الذى اثتثمر رأس مال قدرة 40 مليار جنية فى صناعة الحديد<br />والمهندس البطل طلعت مصطفى الذى بنى مصر الحديثة باثتثمار رأس اموالة والتى بلغت 65 مليار جنية<br />هكذا هم البناؤون الجدد وتلك هى سياستهم وفكرهم الجديد فى بناء مصر العظيمة<br />رجال عاهدوا اللة على البناء<br />فوفوا العهد"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203457/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
order = 12
subject = "الى الاخ اللي فوق بتاع الحزب الولطني"
author = "مش وطني ولا اخوان"
posted = "2009-02-24"
text = "يا بابا الحزب الوطني دا من ممتلكات الدولة<br />وقبل كده ايام جمال عبدالناصر كان اسمه الاتحاد الاشتراكي العربي نفس المباني<br />في عهد السادات غيروا الاسم من الاتحاد الاشتراكي العربي الى الحزب الوطني<br />المباني ملك الدولة المصرية الاسلامية والاشخاص اللي فيه مصريين يعني كل حاجه فيه مصريه<br />الرجال العظام بتوعك دول حيروحوا كما راح الرجال العظام بتوع الاتحاد الاشتراكي<br />بس حيروحوا فين من ربنا ربنا قال فيهم (اولئك يحبون العاجلة ويذرون ورائهم يوما ثقيلا)<br />وربنا بيقول في قرأنه جل جلاله<br />وحتفضل المباني للشعب المصري"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203457/http://masr.20at.com:80/newArticle.php?sid=20059"

