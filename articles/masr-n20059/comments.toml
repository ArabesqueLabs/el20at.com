[[comments]]
order = 19
subject = "من نظام دولة كانت تحكم مصر الى نظام المماليك فى ال"
author = "مصرى"
posted = "2009-02-25"
text = "كيف كان المماليك يحكمون مصر ؟<br />حاكم مملوكى قاعد فى القلعة وحولة حراسة مشددة جدا ومعزول عن الشعب وليس لة علاقة بالشعب اطلاقا وفى داخل البلاد الاقباط يسومون المصريين العذاب ويضربونهم بالسياط ويجمعون الضرائب والمكوث والجزية تحت وظيفة اسمها الملتزم او المشد ويؤخذون تلك الاموال الى القلعة بعد ان يسرقوا نصفها<br />نفس الحال الان<br />نظام يعتمد على الجباية ومص وعصر الناس الفقراء وعلى راس نظام الجباية هذا قبطى اسمة بطرس غالى يقوم بدور الملتزم مثل اجدادة ويفرض نظاما صارما للجباية<br />فوزارة الداخلية تتقدم بقانون مرور جديد اقرة مجلس الشعب هدفة الجباية وجمع اكبر مبلغ من المخالفات والرسوم من السيارات والميكروباصات واللوارى<br />ووزارة المالية تتقدم بقانون جباية لعصر الصيادلة واصحاب الصيدليات بهدف الجباية<br />ووزارة العدل تتقدم بقانون يهدف الى عصر المتقاضين وزيادة رسوم التقاضى 10 اضعاف ويضرب المحامون الان<br />كل القوانين ترجع بنا الى عصر الجباية وعصر المماليك<br />والنتيجة زى ما حصل ايام المماليك<br />كثرة الهبات الشعبية وانتشار طبقات الزعار وشيوخ المنسر"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203457/http://masr.20at.com:80/newArticle.php?sid=20059"
