[[comments]]
order = 4
subject = "حكيم القرية او ابو العريف - حكاية من التراث الفلاح"
author = "فلاح مصرى"
posted = "2009-02-20"
text = "حكى لى فلاح عجوز بماسبة كلامى لة عن الاصلاح الاقتصادى تلك القصة التراثية الفلاحية المصرية<br />فى قريتنا كان يعيش شخصية مشهورة باسم ابو العريف<br />وابو العريف دة هو الشخص اللى بيعرف كل حاجة وعندة حل لكل مصيبة تقع فى القرية ويلجأ الية الصغير والكبير لحل اى مشكلة مستعصية - طبعا امال اسمة ابو العريف ازاى<br />وحدث ان كان فلاح يسحب بقرتة العطشانة فى شوارع القرية فمر على زير مملوء بالماء فمدت البقرة راسها داخل الزير لتشرب فانحشر راس البقرة فى الزير ولم يستطع الناس اخراج راس البقرة من الزير ولم يجدوا حلا<br />فساروا الى بيت ابو العريف - الحقنا يا ابو العريف شوف لنا حل راس البقرة محشورة فى الزير<br />فخرج ابو العريف معهم مؤنبا يا ويلكم من بعدى امال لما اموت هتعملوا اية من بعدى ؟<br />ووصل الى البقرة وتمعن فى الموضوع واخذ يفكر ثم يفكر ويفكر ويفكر<br />ثم قال لهم<br />لانقاذ الزير اقطعوا راس البقرة<br />فذبح الفلاحون البقرة وقطعوا الرأس تنفيذا لتعليمات ابو العريف<br />ولكن الراس انزلقت داخل الزير اكثر<br />وهنا شمر ابو العريف عن ساعدية وحاول مع الناس اخراج الرأس من الزير ولكن ابدا<br />ثم جلس ابو العريف يفكر ويفكر ويفكر<br />ثم قال لهم<br />اكسروا الزير واخرجوا الرأس - يا ويلكم من بعدى - هتعملوا اية لما اموت<br />فكسر الفلاحون الزير واخرجوا راس البقرة<br />وابو العريف مسرور<br />ثم بكى الفلاحون مرة واحدة وانفجروا فى البكاء<br />لقد خسروا البقرة ثم خسروا الزير بناءا على تعليمات ابو العريف<br />ما حدث فى الاقتصاد المصرى نفس الشىء<br />فهمت حاجة"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083120/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
order = 5
subject = "ديون وحمير"
author = "مش ضروري"
posted = "2009-02-21"
text = "قصة المعلق السابق جميلة جدا ومفيدة جدا وبتوصل المعنى الحقيقي للبسطاء واليكم هذه القصة (الايميلية) لتوضيح ما حدث للازمة المالية العالمية لان ابو العريف السمسار هو المسيطر على سوق العقارات اللي ودتنا في داهية الى القصة<br />طلب من خبير مالي أن يبسط للناس العاديين أسباب الكارثة التي حصلت في أسواق البورصة‏(‏الأسهم‏)‏فقال :<br />إن رجلاً ذهب إلى قرية‏نائية، عارضاً على سكانها شراء كل حمار لديهم، بعشرة‏دولارات.‏ ‏فباع قسم كبير منهم‏حميرهم.‏<br />بعدها رفع السعر إلى 15 ‏دولاراً فباع آخرون ‏فرفع سعره إلى‏ثلاثين، حتى نفدت الحمير من لدى أهل القرية.‏<br />‏عندها قال لهم: أدفع 50 ‏دولاراً لقاء الحمار الواحد.‏ ‏وذهب لتمضية نهاية‏الأسبوع في المدينة………<br />ثم جاء مساعده ‏عارضاً على أهل‏القرية أن يبيعهم حميرهم السابقة بأربعين دولاراً للحمار الواحد، على أن يبيعوها‏مجدّداً لمعلمه بخمسين يوم الاثنين ‏فدفعوا كل مدّخراتهم ثمناً لحميرهم.<br />ومن لايملك مالا اقترض‏واستدان على امل تحقيق مكسب سريع.<br />وبعدها لم يروا‏الشاري ولا مساعده أبدا..<br />جاء الأسبوع التالي، وفي‏القرية ‏أمران:<br />‏ديون،‏وحمير، فقط لا غير"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083120/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
order = 6
subject = "كلام فى اصلاح الاقتصاد لابو العريف - قلاع صناعة ال"
author = "شحتوف"
posted = "2009-02-22"
text = "ابو العريف بحث فى الاقتصاد<br />وجد عندنا صناعة موروثة وعريقة ابتدأها مصرى اصيل من ابوين وجدين مصريين اسمة طلعت باشا حرب<br />طلعت باشا حرب وجد الخامات المصرية اللى هى القطن والصوف فسمع مقولة الزعيم سعد زغلول ويل لامة لا تاكل مما تزرع ولا تلبس مما تصنع فانشأ بنك مصر ومنة جاء التمويل لمصانع المحلة الشهيرة<br />ولبس المصريون قماش الكستور المصرى وبناطيل وبدل صوف المحلة واستغنينا عن الصوف الانجليزى بالصوف المصرى<br />ابو العريف عايز اصلاح<br />الاصلاح بيقول<br />ثلاثة او اربعة رجال اعمال يعملوا مصانع متواضعة يشاركهم فيها اسرائيليون ويمكن برأس مال اسرائيلى مستتر بجواز ايطالى او فرنساوى ونصدر لامريكا ونعمل اتفاقية مع اسرائيل اسمها اتفاقية الكويز<br />طيب - ماشى - موافقين<br />بتصدروا لامريكا بفلوس كتير - قال لك حوالى مليارين<br />كلام لا غبار علية - طيب والشعب ال 80 مليون انسان يلبس من اين ؟<br />من يصنع لة ملابسة<br />ابو العريف قال لك - انا يهمنى ال 3 او 4 رجال اعمال بتوع الكويز اللى بيكسوا امريكا انما ال 80 مليون مصرى دول فمش تبعى - دول تبع الصين الشعبية - والصين الشعبية تعمل لهم قمصان واحذية وبناطيل وبدل وبلوفرات وجلاليب وكل اللى هم بيحبوة<br />الصين الشعبية هى مسئولة عنهم وعن لبسهم<br />طيب وقلاع الصناعة بتاع المحلة وكفر الدوار والراجل الطيب اللى واقف فى الميدان اللى اسمة طلعت باشا حرب<br />ابو العريف قال لك - لالا -- لالا دول عمال بتوع مشاكل وبيعملوا مظاهرات والمصانع دى بتخسر ولازم علشان الاصلاح نبيعها لمثتثمر رئيسى وهو يتولى بيع اراضى المصانع دى عمارات وشقق سكنية<br />نحن بتوع الكويز<br />الكويز وبس انما الشعب بيلبس من اين - فهذة شغلة الصين الشعبية<br />يا ويلكم من بعدى - هتعملوا اية لما اسيبكم واموت<br />تمسكوا بها بالنواجذ حتى لا تضلوا بعدى ابدا الكويز والمثتثمر الرئيسى وترجعوا بعدى زى طلعت حرب يلبس الشعب هدوم مصرية"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083120/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
order = 7
subject = "اللى نعيدة نزيدة - قول من تانى - وفى الليالى البار"
author = "اكتب اسمك هنا"
posted = "2009-02-22"
text = "تقدم 3 عرسان لخطبة فتاة وعرضهم عليها ابوها لتختار منهم واحدا مناسبا لها - فقالت لابوها<br />الاول محامى وهيقعد يقول لى المادة كذا فى القانون بتقول كذا والمادة التانية بتقول كذا ويا بابا مش ها اعرف اخد منة لا حق ولا باطل<br />والتانى دكتور هيقعد يقول لى سلامة القلب واجهاد القلب وان كل حاجة بحساب والنوم بحساب والاكل مسلوق ومفيش سهر وكل شوية كشف وتعقيم ونظافة ودة مش عايزاة<br />والتالت مدرس ولو حصل اننى لم افهم منة حاجة فى السرير هقول لة اشرح تانى واشرح تالت ومش فاهمة وهيقعد يعيد ويزيد ويكرر ويغير طريقة الشرح علشان افهم اصل المدرسين بيغيروا طريقة الشرح على حسب الوضع وصعوبة المسألة وبيحطوا احسن الحلول وهو دة اللى عايزاة يا بابا<br />تحبوا نعيد ونزيد واللى نقولة نعيدة تانى يمكن يفهموا"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083120/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
order = 8
subject = "الى الاخ المعلق السابق"
author = "مش ححبك"
posted = "2009-02-22"
text = "(الا من رحم ربي)<br />بالنسبة للعريس الاول المحامي بلاش منه مش علشان خاطر المادة والقانون<br />بلاش منه علشان خاطر المحامين دول طايفه وسخه بنت قحبه وشوية حراميه وسفله ولما المحامي يكتب على اليافطه بتاعته امام المحاكم الابتدائية يعني حرامي لسه صغير ولما يكتب على اليافطه بتاعته الاستئناف العالي ومجلس الدولة يعني الحرامي كبر شوية ولما يكتب على اليافطه بتاعته بالنقض والادارية العليا يعني حرامي كبير ووسخ وابن قحبه ويقدر يخلص اي حاجه بالتزوير بالغش بالاجرام ولو فضلت اقول في المحامين شوية السلفه دول مش حيكفيني موقع نت بحاله<br />تخيل لما المحامي يضلل موكله<br />تخيل لما المحامي يسرق موكله<br />تخيل لما المحامي يبيع موكله<br />تخيل لما المحامي يستغفل موكله<br />تخيل لماالمحامي ينصب على موكله<br />تخيل لما المحامي يبيع موكله<br />تخيل لما المحامي يتفق مع خصم موكله<br />اي والله العظيم كل دا بيحصل في الطايفه السفله دول<br />عليهم لعنة الله عليهم لعنة الله عليهم لعنة الله<br />اللهم العن هذه الطايفة الوسخه الحقيره<br />اللهم فرق جمعهم وشتت شملهم ويتم اطفالهم ورمل نسائهم واجعلهم غنية للشعب المصري يا رب العالمين<br />فانت ولي ذلك والقادر عليه<br />يا رب احرق قلوبهم يا رب زي ما حرقوا قلبي"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083120/http://masr.20at.com:80/newArticle.php?sid=20059"

