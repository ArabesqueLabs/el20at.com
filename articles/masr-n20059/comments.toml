subject = "_ - _ - _ - _ - _"
author = "و انتا مال امك بتبص على الأسم"
posted = "2009-02-25"
text = "الحمد لله انا اساسا قاطعت البرامج التافهه المملة ماشوفتش مره عملو حاجه مفيدة<br />ما فيش احسن من الطبعه الأولى صغير و بسيط و مختصر<br />بالنسبه لمواضيع مصر خلاص اتحلت اي حاجه عاوزنها نعمل بيها اضراب<br />انا لو سقط في الكلية و الله لأعمل اضراب"
