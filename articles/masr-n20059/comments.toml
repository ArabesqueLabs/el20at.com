posted = "2009-02-24"
text = "انت لم تقرأ بيت الشعر اللى قالة الشاعر لما تولى يزيد ابن معاوية الحكم<br />شئت لا ما شائت الاقدار ----------------------------------------------- احكم فانت الواحد القهار"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203457/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
order = 16
subject = "اللي بيحب ابنه يبعده عن الحكم"
author = "مش بطال"
posted = "2009-02-25"
text = "انا بحب ابني فدايما ابعده عن اي مشاكل ودايما احذره بصفتي اب عن مكامن الاخطار في هذه الدنيا<br />معاوية ابن ابي سفيان كان بيكره ابنه ولذلك ورثوا الحكم وتورط يزيد في قتل حفيد رسول الله صلى الله عليه وسلم واستباح المدينة والعياذ بالله والنتيجة انه لم يمكث في الحكم سوى ثلاث سنوات واتجنن ومات<br />يبقى بقى قولولي هل من المعقول ان يكون معاوية يحب ابنه<br />فيه حد يحب ابنه يلقي به في نار جهنم<br />وقس على ذلك حسني مبارك وجمال مبارك"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203457/http://masr.20at.com:80/newArticle.php?sid=20059"

