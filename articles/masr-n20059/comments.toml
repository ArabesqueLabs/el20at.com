[[comments]]
order = 2
subject = "ملاحظات على اضرابات الاسبوع الماضى"
author = "مصطفى"
posted = "2009-02-20"
text = "اضراب سائقى السواقين لعربات النقل والمقطورات<br />وثانيا اضراب الصيادلة<br />وكلاهما السواقين والصيادلة ليسوا موظفين عند الحكومة حتى يحضرهم امن الدولة ويهددهم بالرفت والطرد من الخدمة فيخافوا وينتظموا فى العمل<br />الموضوع هنا قطاع خاص - اشتغل النهاردة او لا اشتغل - انا حر وبفلوسى<br />وصل الحال من اضراب السواقين ان الموانىء توقفت ومصانع الاسمدة والاسمنت وتأثر نقل الدقيق من المطاحن الى المخابز ووضعت البلاد على شفى هاوية<br />وكذلك الصيادلة<br />وارتبكت البلاد والعباد<br />واتصل اعلى مسئول فى البلاد بالوزراء بحل المشكلة باى ثمن ولو حتى اراقة ماء وجة الحكومة التى رفضت مقابلة الصيادلة فى اجتماع مع نبيل العربى<br />ضياع هيبة الدولة ومومغة وجهها فى الطين رغم مليون عسكرى امن مركزى لارهاب الناس<br />كان لدى الدولة شركات نقل عام مجهزة باوناش ولوارى تنقل من الموانى والمصانع تحت امر الدولة باعوها بابخس الاثمان تحت بند بيع اصول الدولة المصرية<br />الان القطاع الخاص المصرى يتحدى<br />هتعمل اية حكومة المحروس والنظيف<br />انتظروا المزيد من الانهيارات<br />اتلقطاع الخاص بدأ المظاهرات والاضرابات ولن يدفع ضرائب الا اللى هو عايز يدفعة<br />ورجال الاعمال لا يدفعوا ضرائب بل يتلقون دعم الدولة بالمليارات<br />يبقى نصرف على المليون عسكرى امن مركزى من اين ؟<br />يبقى ازاى نجيب فلوس للدعم<br />نشحت<br />والا نسيب الحكم لناس بتفهم تيجى وتحكم البلد وتحاول ان تنقذ ما يمكن انقاذة<br />يمكن الحل يكون عند اسرائيل او اوباما"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083120/http://masr.20at.com:80/newArticle.php?sid=20059"

