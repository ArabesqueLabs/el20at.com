author = "من الحزب الوطنى"
posted = "2009-02-24"
text = "شوف يا ابنى من غير فلسفة<br />محمد على باشا واسرتة بنت مصر بالاستقرار والتداول السلمى للسلطة وبهذا بنيت البلد بناءا عصريا<br />والسياسات تخطط لنفس الشكل - التداول السلمى للسلطة من داخل الحزب الوطنى اللى بيعد الكوادر اللى تصلح للحكم<br />فالاستاذ جمال سينجح فى الانتخابات وستنتقل السلطة بسلاسة وبطريقة سلمية وهكذا اللى بعدة واللى بعد اللى بعدة<br />بكدة تتبنى البلد صح<br />انما تقولى الاتحاد الاشتراكى والاخوان فهذا كلام لا يصلح فى ظل التوازنات الدولية السليمة<br />هو انتم هتعرفوا احسن من لجنة السياسات"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203457/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
order = 14
subject = "الى بتاع الحزب الوطني"
author = "مش وطني ولا اخوان"
posted = "2009-02-24"
text = "ولا تقولن لشيء اني فاعل ذلك غدا الا ان يشاء الله<br />وقل اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء......... الى اخر الاية<br />يؤتي من يشاء من عباده<br />احنا مذهب اهل السنة والجماعة نؤمن بان قضية الحكم دي قضية ربانية مائة في المائة لا تدخل لبشر فيها الا ان يشاء الله يؤتي ملكه من يشاء من عباده<br />للحزب الوطني لغير الحزب الوطني كما يشاء هو سبحانه وتعالى<br />فريح نفسك بقا واستهدى بالله"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203457/http://masr.20at.com:80/newArticle.php?sid=20059"

[[comments]]
