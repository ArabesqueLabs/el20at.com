[[comments]]
order = 0
subject = "هذه هي حقيقة الفلسطينيين .. والحل بالأسفل"
author = "محمد نواف الحمدالله ..."
posted = "2008-08-15"
text = "يا ناس افهمو بانو كل شغل الدعارة والمنيكه كلو تحت رعاية فلسطيزيه كس إمكو من شعب خاسي الله يلعنكو واحد واحد ..<br />عني بعتو أرضكو .. وبعتو كل إشي بخصكو .. بعدين طلعتوا من أرضكو ورحتوا بكل هالدنيا وصرتوا تلفلفوا فيها دولة دولة .. والدولة اللي بتعجبكم بتبسطوا فيها وتقعدوا فيها ومستحيل تتخلوا عنها .. ومنها أرظنا ( الأردن الغالي * ) يالله كيف سويتوها يا ولاد القحبة الشرموطه المنيوكة الممحونة المفتوحة الداعره ؟! بس آآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآخ خليها بالقلب ترجح ولاتطلع لبرا وتفظح<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره ممحونة فالتات ودايرات وداشرات وصايعات بالشوارع .....<br />محمد نواف"
archived = "2010-03-14"
