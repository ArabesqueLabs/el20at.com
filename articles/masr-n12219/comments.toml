subject = "مقدمة جنان"
author = "تركي"
text = "تسلم ايديك يا مسيو طهاوي ده اللقب الجديد بتاعك لإني بجد كنت حاسس اني باكل الكلام ومتسلذ جدا وانا بقراه<br />مقدمة رشيقة وسلسلة وكلام ساخر لكن هادف وبصفتي بتاع فن اقولك اني المقدمة فنانة جدا<br />وبجد الفقرة دي مش معقولة \"يتزوجون كثيرا وينجبون قليلا، يكتبون عن الدين وأقل شريحة متدينة، الصحفي ديوان تاريخ وموال قلم.. وصرخة وكلمة، وشيشة ونظارة، وورقة وقهوة ع الريحة وحياة ع الريحة\".<br />زتصبحون على قلم بدون ورقة"
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205194026/http://masr.20at.com:80/newArticle.php?sid=12219"

