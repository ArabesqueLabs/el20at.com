subject = "تعبتللي دماغي"
author = "مروه عبد الفضيل"
text = "استاذ عبدالله بجد مش ممكن المقدمه دي حسستنى بأد ايه انت رايق رايق اوي واعدت اسأل نفسي كتير كانت حالتك ايه وانت بتكتب المقدمه دي يعنى كنت فرحان ولا زعلان كنت بتشرب شاي ولا قهوه ولا نسكافيه ولا بتشرب شيشه بجد هموت واعرف حتى كنت اعد فين وكتبتبتها مره واحده ولا على مراحل اسئلة كتير اوي بجد تعبت دماغي قوللى بئه كانت حالتك ايه يا ريس؟"
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205194026/http://masr.20at.com:80/newArticle.php?sid=12219"

[[comments]]
order = 12
subject = "وياريت تيجى على أد كدة"
author = "بسلة مسلمة مصرية"
text = "شوفتوا اخر الى بيحصل<br />الحكومة تنتقد تقريرا للسفارة الامريكية حدد نسبة الفقراء فى مصر بـ 52<br />انتقد الدكتور عثمان محمد عثمان وزير التنمية الاقتصادية التقرير الصادر عن السفارة الامريكية والخاص بنسبة الفقراء فى مصر.<br />وقال عثمان ان التقرير الامريكى حدد نسبة الفقراء فى مصر بـ 52% وهذا الكلام غير صحيح بالمرة وان نسبة الفقر فى مصر لا تتعدى 20% فقط.<br />واشار الى ان تقارير البنك الدولى اكدت ان من يزيد دخله اليومى عن جنيه ونصف لا يعد فقيرا مؤكدا ان خطط الحكومة المستقبلية سوف تقر الدعم بحوالى 40% فقط من المصريين وهم الاكثر احتياجا للدعم.<br />وقال عثمان ان مصر تحتاج الى 295و1 ترليون جنيه لدعم الاستثمار وذلك لتحقيق زيادة فى النمو الاقتصادى خلال الخمس سنوات القادمة.<br />وتوقع وزير التنمية الاقتصادية تراجع نسبة البطالة الى 5% خلال السنوات الخمس المقبلة مؤكدا ان قوة العمل فى مصر ستصل الى 82 مليون عامل خلال الفترة القادمة."
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205194026/http://masr.20at.com:80/newArticle.php?sid=12219"
