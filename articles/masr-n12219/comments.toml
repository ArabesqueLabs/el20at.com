subject = "الاقباط ومصلحتهم فقط وهم مع التوريث"
author = "من الانترنيت"
text = "الأقباط، وتأييد الكنيسة الأرثوذكسية تولي جمال مبارك الحكم خلفا للرئيس مبارك، وهو ما كشفه عضو الأمانة العامة للحزب الوطني الحاكم، رابح بسطا لجريدة الخميس في حديث له مع زميلنا السيد السعدني، قال فيه: أقولها بلا تردد بأن الكنيسة تؤيد جمال مبارك فهي كما فعلت مع الرئيس مبارك ستؤيد نجله جمال.<br />فالرئيس مبارك هو الرئيس الوحيد الذي استطاع أن يخترق الخط الهمايوني وأصدر قراراته بأن يكون ترميم وبناء الكنائس كأي دور عبادة أخري من اختصاص المحافظين ومن ثم أزيلت كل هذه المشاكل.<br />وبحكم عملي مستشارا قانونيا لإحدي المحافظات أؤكد أن مطالب الأقباط في مثل هذه الأمور تكون مخالفة للقانون أو عدم اكتمال الأوراق اللازمة للتصريح بالبناء فهي أمور قانونية ولكن البعض يحاول أن ينسج مثل قضية طائفية بعكس الحقائق.<br />الأقباط بالفعل في كل المناصب القيادية والدليل علي ذلك هناك وزراء مسيحيون وهناك محافظون أقباط وهناك قادة أقباط في الشرطة وفي المناصب السيادية الأخري، كما أن تعيينات الرئيس لمجلس الشوري شملت عددا كبيرا من الأقباط وكذلك في مجلس الشعب حتي في الأمانة العامة للحزب الوطني الحاكم هناك أكثر من عنصر قبطي، فبخلافي يوجد الدكتور بطرس غالي وثروت باسيلي ومني مكرم عبيد فأين بعد الأقباط إذن عن المناصب القيادية.<br />وسئل: البعض يؤكد أن أقباط المهجر يستقوون بالخارج؟<br />فقال: اعترف أنهم يستغلون حرية المناخ في الخارج ولكن بطريقة خاطئة وبسوء نية مبيتة.<br />وسئل: وما موقفك أنت من أقباط المهجر؟<br />هؤلاء لا يعرفون حقيقة ما يدور في مصر ولذلك يتطاولون علي النظام ويعارضونه بصورة تنم عن جهل تام بحقيقة الأوضاع في مصر وهذا يرجع إلي أنهم يستقون معلوماتهم من مصادر غير وطنية وغير رسمية ومن مصادر مغرضة ومن بعض المنظمات المأجورة التي لا يهمها سوي عدم استقرار مصر وتحاول إثارة الفوضي وعدم الأمن في الوقت الذي تشهد فيه مصر أزهي عصور الوحدة الوطنية.<br />أري ان الحل الوحيد هو فتح حوار معهم بطريقة ودية وعلمية حتي يتفهمون الوضع الحقيقي في ظل مناخ الديمقراطية ومبدأ المواطنة ."
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064855/http://masr.20at.com:80/newArticle.php?sid=12219"

