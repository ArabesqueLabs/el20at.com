text = "بصراحه الموضوع اكثر من رائع بيتكلم بنبض الشارع فى اسلوب وغلاف متناسق وفعلا اسلوب ممتع لكن الاحلى انه موضوع<br />بنظرة عيون لاتكذب ولكنها تتجمل بمشكله من الاف المشاكل بس فى الصحافه وملايين فى حيتنا<br />ادعوا صاحب المقالبمذيد من المقالات (مشاكلنا كتير جدااااااااااااااا)<br />محتاجه نظره لاتكذب ولا تتجمل"
