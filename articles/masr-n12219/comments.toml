subject = "كلام في الصميم"
author = "عبده البغدادي"
text = "إيه الجمال ده والحلاوة دي والطعامة دي ، بس على الله الواحد ما يحصلوش زي ما قلت \" كل شيء ضده.. عمره وعصره وصحته ومصدره ورئيسه ومطبعته.. \" وركزززززززززز على رئيسه ، ربنا ينور طريقه ، وما يجعلوووووووووش كده أبدا<br />وبعدين ما بالكوا بملف ديه مقدمته ، بقولك إيه ما تكتب انته الملف كله . وخليها بختم الطحاوي بك"
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205194026/http://masr.20at.com:80/newArticle.php?sid=12219"

[[comments]]
