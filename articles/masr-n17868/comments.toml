[[comments]]
order = 0
subject = "رؤساء التحرير الاربعة ليسوا مؤهلين اعلاميا"
author = "مش لازم"
posted = "2008-10-11"
text = "اتحدى اذا كان رؤساء التحرير الاربعة الذين في هذه الصورة من خريجي كلية الاعلام او الصحافة<br />لانهم لو كانوا فاهمين شغلهم ومتعلمين ما كانوش وقعوا في هذا المأزق<br />لان الطالب لما بيدخل كلية بيدرس في هذه الكلية منهج بيعلموا ويفهموا اصول المهنة وبيكتسب شخصية المهنة<br />زي المحامي والدكتور والمهندس<br />لكن لما يجي واحد محامي يشتغل صحفي تبص تلاقيه بينطح زي الطور وهو مش فاهم حاجه<br />وتأكيدا لذلك على سبيل المثال في مادة في كلية الاعلام اسمها (علم النفس الاعلامي<br />زي المدرس بيدرس مادة اسمها علم نفس تربوي<br />يعني فيه مناهج في كلية الاعلام بيعرفني ازاي ابقى صحفي واواجه المشاكل مع كافة التيارات<br />ممكن نقرأ السطر اللي جاي دا المأخوذ من المقال<br />ويحاكم «حمودة» أيضاً في قضيته مع «شيخ الأزهر»، وقنديل في قضية سب وقذف أقامها ضده أحمد عز، أمين التنظيم بالحزب الوطني ورجل الأعمال.<br />رئيس تحرير حمار هبش في شيخ الازهر لانه صحفي جاهل وحيوان وواخد الصحافة عافية وقلة ادب<br />والتاني عنده قضية سب وقذف يعني صايع ومش لاقي شغل وجه يشتغل صحفي وايه كمان بقى رئيس تحرير<br />انا يا جماعة بشتغل في الصف التصويري في الصحف والمجلات بقالي 30 سنه<br />وورد عليا اشكال ولوان من الصحافيين واشتغلت مع صحافيين خريجي كليات الاعلام<br />واشتغلت مع صحافيين من اياهم<br />شتان بين الاثنين دول صحافيين فاهمين شغلهم والصنف الثاني واخد العملية بالدراع<br />ولذلك نرفع شكوانا هذه الى المسئولين لتشكيل لجنة من اساتذة كلية الاعلام والصحافة ومن اعضاء نقابة الصحافيين لبحث الامر واتخاذ القرار<br />وشكرا والسلام عليكم ورحمة الله وبركاته<br />وارجو من الاخوة الصحافيين خريجي كليات الاعلام والصحافة يتبنوا هذه القضية"
archived = "2008-10-14"
capture_url = "https://web.archive.org/web/20081014020211/http://masr.20at.com:80/newArticle.php?sid=17868"

[[comments]]
order = 1
subject = "صفوت الشريف كان وزير الاعلام وهو ضابط مخابرات سابق"
author = "اديله ادي"
posted = "2008-10-11"
text = "من مهازل الاعلام في مصر تعيين ضابط مخابرات سابق السيد صفوت الشريف وزير الاعلام<br />ولا حول ولا قوة الا بالله العلي العظيم"
archived = "2008-10-14"
capture_url = "https://web.archive.org/web/20081014020211/http://masr.20at.com:80/newArticle.php?sid=17868"

[[comments]]
order = 2
subject = "يعنى اية كلية اعلام - الاعلام الموجة هذا فى النظام"
author = "مش لاعب"
posted = "2008-10-11"
text = "مقال ادبى فى نقد القصة والشعر هل يستطيع خريج الاعلام كتابتة وهل يفهم فى الادب والرواية والنقد الا اذا كان اديب موهوب وليس دارس<br />مقالات التحليل الاقتصادى والمالى - ما دخل كلية الاعلام بالاقتصاد وعالم المال<br />مقالات التحليل السياسى وقياسات الرأى العام - ما دخل كلية الاعلام بكل هذا<br />الحقيقة لا يوجد كليات اعلام فى العالم العربى او الخارجى<br />انتم هتطلعوا لينا بتقليعة<br />خريج الاعلام بتاع الاخبار ينفع يشتغل فى وكالة الشرق الاوسط للاعلام او بالاصح لا يصلح لاى وظيفة غير عرضحالجى امام اى محكمة ابتدائية<br />الرئيس السادات فى بداية الثورة كان رئيس تحرير جريدة الجمهورية<br />موضوع الصحفيين بقى موضوع ممل زى موضوع الاخوان واعتقالهم بقى موضوع بايخ جدا<br />وكل الكلام المقرف دة لا يتم فى اى دولة غير مصر سواء فى العرب او الخارج<br />متى تصل الحكومة الى النضج السياسى<br />وليكن معلوما ان لا احد يهتم بما يكتب فى الجرايد - الناس تلجا الى الاخبار فى الفضائيات والنت<br />عقلية الحكومة والامن لا زالت فى عصر الاتحاد الاشتراكى والصحف القومية ومحطات التليفزيون الحكومية<br />يا حكومة الدنيا اتغيرت<br />الاخبار تصل للناس من الف طريق اخرها طريق الحكومة واعلامها الفاشل"
archived = "2008-10-14"
capture_url = "https://web.archive.org/web/20081014020211/http://masr.20at.com:80/newArticle.php?sid=17868"

[[comments]]
order = 3
subject = "الشيطان يعظ"
author = "المصرى أفندى"
posted = "2008-10-13"
text = "الحيوان اللى علق فى الأول ونازل شتيمة وسخة على صحفيين هم أشرفمن اللى خلفوه و من رؤسائه فى العربخانة القومية اللى بيشتغل فيها( ده أن كان فعلا بيشتغل فى الصحافة) رؤسائه فى الصحافة التى تسمى بالقومية وفى الحزب الواطى الغير أنسانى هم عبارة عن عصابة من المرتشين وكلاب السلطة يتحركون بالريموت كونترول. أنت يامعفن اللى حتصنف الصحفى واللى غير صحفى. أذهب الى الجحيم عليك اللعنة( على رأى الراحل يوسف وهبى)"
archived = "2008-10-14"
capture_url = "https://web.archive.org/web/20081014020211/http://masr.20at.com:80/newArticle.php?sid=17868"
