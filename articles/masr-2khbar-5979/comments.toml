subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-05-24"
text = "انا اعترض على المساواة بين الرجل و المرأة . ليس لان الرجل افضل من المرأة او العكس و لكن لانك لا يمكن ان تساوي بين شيئين مختلفين. و برغم المساواة المزعومة فالمرأة في بلدنا لازالت مظلومة. و ما المانع ان تعمل المرأة لتحقق ذاتها ؟ فليس معنى ان تلك السيدة الفاضلة و اخريات اخترن هذا الطريق انة هو الطريق الصحيح الوحيد. فتامرأة انسان قبل ان تكون زوجة و ام لها طموح و احلام فما المانع ان تحققها ما دامت لا تضر احدا و تتحمل مسؤلياتها الاخرى . اما البطالة فأسألوا الحكومة و لا تلموا النساء .شكرا"
archived = "2010-03-14"
capture_url = ""
