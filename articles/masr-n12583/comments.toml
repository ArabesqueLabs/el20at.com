[[comments]]
order = 2
subject = "\" لو كان لي دعوة صالحة لصرفتها إلى الرئيس\""
author = "ابن الذين"
text = "\" لو كان لي دعوة صالحة لصرفتها إلى الرئيس\"<br />الحمد لله وبعد ؛<br />هناك بعض الأقوال أو العبارات تنسب إلى بعض الأئمة من أهل السنة والجماعة ، ويستشهد بها كثير من طلبة العلم في أُطروحاتهم أو مقالتهم ، وبعد التدقيق والتمحيص نرى أن نسبة هذه الأقوال ليست إلى أولئك الأئمة ليست دقيقة .<br />ومن هذه العبارات : \" لو كان لي دعوة صالحة لصرفتها إلى الإمام \" .<br />وهذه العبارة تنسب إلى الإمام أحمد – رحمه الله - ، والصواب أنها للفضيل بن عياض كما أسندها إليه غير واحد من العلماء .<br />نص العبارة :<br />روى أبو نعيم في الحلية (8/91) قال :<br />حدثنا محمد بن ابراهيم ، ثنا أبو يعلى ، ثنا عبد الصمد بن يزيد البغدادي - ولقبه من دونه - قال سمعت الفضيل بن عياض يقول : لو أن لي دعوة مستجابة ما صيرتها الا في الامام . قيل له : وكيف ذلك يا أبا علي ؟ قال : متى ما صيرتها في نفسي لم تحزني ومتى صيرتها في الامام فصلاح الامام صلاح العباد والبلاد . قيل : وكيف ذلك يا أبا علي ؟ فسر لنا هذا . قال : أما صلاح البلاد فإذا أمن الناس ظلم الإمام عمروا الخرابات ونزلوا الارض ، وأما العباد فينظر إلى قوم من أهل الجهل فيقول : قد شغلهم طلب المعيشة عن طلب ما ينفعهم من تعلم القرآن وغيره ، فيجمعهم في دار خمسين خمسين أقل أو أكثر ، يقول للرجل : لك ما يصلحك ، وعلم هؤلاء أمر دينهم ، وانظر ما أخرج الله عز وجل من فيهم مما يزكى الارض فرده عليهم . قال : فكان صلاح العباد والبلاد ، فقبل ابن المبارك جبهته وقال : يا معلم الخير من يحسن هذا غيرك .<br />وقد أوردها ابن عبد البر في جامع العم وفضله (1/641) بغير إسناد ، وقال سمير الزهيري في تخريجه في الحاشية : صحيح … وعبد الصمد بن يزيد هو المعروف بمردويه ، أبو عبد الله الصائغ ، خادم الفضيل بن عياض كان ثقة من أهل السنة والورع .ا.هـ.<br />ورواها أبو يعلى (2/36) في طبقات الحنابلة أيضا بدون إسناد .<br />وقد رد الشيخ بكر أبو زيد نسبة هذه المقولة إلى الإمام أحمد في التأصيل ( ص 76) فقال : ومنها : القولة المشهورة :<br />\" لو كان لي دعوة صالحة لصرفتها إلى الإمام \" . ونسبتها إلى الإمام أحمد – رحمه الله تعالى - .<br />وقد بحثت طويلا فلم أرها منسوبة إليه مسندة ، وإنما رأيتها مسندة للفضيل بن عياض – رحمه الله تعالى – بلفظ : \" لو أن لنا دعوة مستجابة ما صيرناها إلا للإمام \" .<br />أخرج هذا الأثر : أبو نعيم في العادلين ، وحلية الأولياء ، وابن عبد البر في جامع بيان العلم ، والبربهاري في شرح السنة وبين وجهها بقوله : \" وإذا جعلتها في نفسي لم تعدني ، وإذا جعلتها في السلطان صلحَ ، فصلح بصلاحه العباد والبلاد \" انتهى .<br />لكن في كتاب السنة للخلال بسنده عن الإمام أحمد ما نصه : وإني لأدعو له – الإمام – بالتسديد والتوفيق في الليل والنهار – والتأييد وأرى ذلك واجبا عليَّ \" انتهى .<br />ثم رأيتها منسوبة – غير مسندة – إلى الإمام أحمد – رحمه الله – في فتاوى ابن تيمية (28/391) ، وكشاف القناع (2/32) .ا.هـ.<br />قال شيخ الإسلام ابن تيمية في الفتاوى (28/391) :<br />ولهذا كان السلف – كالفضيل بن عياض وأحمد بن حنبل وغيرهما – يقولون : لو كان لنا دعوة مجابة لدعونا بها للسلطان .ا.هـ.<br />والله اعلم<br />عبد الله زقيل<br />zugailam@yahoo.com"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128044037/http://masr.20at.com:80/newArticle.php?sid=12583"

[[comments]]
order = 3
subject = "السمع والطاعة لولي الامر ما اقام الصلاه"
author = "مش ضروري"
text = "وقال النبي صلى الله عليه وسلم في الحديث الذي رواه مسلم<br />((يكون بعدي أئمة لايهتدون بهداي ولايستنون بسنتي وسيقوم فيهم رجال قلوبهم قلوب الشياطين<br />في جثمان إنس قال ( حذيفة): قلت : كيف أصنع يارسول الله ؟ إن أدركت ذلك ؟؟<br />قال : (( تسمع وتطيع وإن ضرب ظهرك وأخذ مالك , فاسمع وأطع ))<br />رواه البخاري ( 7084) ومسلم ( 1847) باب ( يصبر على أذاهم وتؤدى حقوقهم )"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128044037/http://masr.20at.com:80/newArticle.php?sid=12583"

[[comments]]
order = 4
subject = "عندما يكون هناك دستور"
author = "سعيد ابو السلمى"
text = "كل شىء على حسب القانون ممكن - من الممكن محاسبة رئيس الدولة ومعرفة مرتبة ونفقات الرياسة والقصور والتنقلات وكل شىء كونة اكبر موظف فى الدولة<br />رئيس الدولة هو موظف يؤدى خدمة عامة انتخب من قبل الشعب لادائها<br />وليس سلطانا ولا اماما كما علق الاخوة السابقين<br />وطبعا الكل يعرف اننا نحكم بقوانين الطوارىء او القوانين العرفية الموضوعة ايام الاحتلال البريطانى<br />وقانون الطوارىء يلغى العمل بالدستور ويجيز محاكمة المدنيين امام المحاكم العسكرية<br />وتحت قانون الطوارىء او الاحكام العرفية لا يجوز محاكمة رئيس النظام ولا تطبيق القانون ولا الدستور<br />فيا اخت نيرة لا يمكن محاكمة الرئيس ولا يمكن سجنة فى غياب الدستور<br />انما المعرض للسجن هو انت بسبب مقالتك التى تعكر صفو الرأى العام"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128044037/http://masr.20at.com:80/newArticle.php?sid=12583"

[[comments]]
order = 5
subject = "الرئيس مسجون فعلا"
text = "الرئيس مسجون فعلا ويعامل معاملة المساجين<br />يعني وهو قاعد في القصر بتاعه الحرس حوالين بيته والمخبرين<br />وممنوع يخرج الا لما يستأذن الامن ولو خرج من بيته الامن محاصره من جميع الجهات<br />ويفضل محاط بالامن لغاية ما يرجع بيته تاني<br />وهذه معاملة المساجين واوعوا تفتكروا ان الرئيس مبسوط بالرياسة<br />اؤكد لكم ان الريس بيلعن اليوم اللي بقا فيه رئيس"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128044037/http://masr.20at.com:80/newArticle.php?sid=12583"
