[[comments]]
order = 3
subject = "مبارك"
author = "سعيد"
posted = "2006-04-15"
text = "مبارك خان لادرخ كبير وهو قال طز ااشعاب مص رى و الوزار كيلاب نعم كلهم انذرو من حولكم يا شكوب ان شباب لا يوجد حت قروش قليله يا ايوه الوزير وا رايس هاذا كلاام نقوال ونكون مدفعين عن البلد عشان كلاب وزير ههههه بس حنا اقوء"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212752/http://masr.20at.com:80/article.php?sid=163&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "الحكوم طز طز طز طز"
author = "المجهول"
posted = "2006-04-15"
text = "انظرو من اليمين و اليسار والورا والامام اليش احن كدا الشعب فان فان لشعب حرة اين الحكوم والذلك الخمر والحشيش فى كل مكن الحكوم هى السبب الوحيد هى تخرب البيوت امنعو الخمر والحشيش انا لاخاف من احد لكنن شر فى عيونن الشعب اخاف من الشعب انا شاب عمرى 24 بس ....طيب يا ريس ااووزير هههههههه الجيل قدام من بعيد يا ممبارك اعتانو بشباب و البننات سلامم يا ريس من مجههول انتى هبابهه رايع الغيه محتجلك"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212752/http://masr.20at.com:80/article.php?sid=163&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "ميحرمنيش منك يا هبهوبتى"
author = "نيفين"
posted = "2006-04-19"
text = "نقول ايه بس يا هبهوب علشان نوصل احساسنا<br />يا حياتى الف شكر على الكروت الجميله دى<br />بت يا هبهوب انا بعتللك حاجه ابقى افتحيها<br />الكاريكاتير حلو اوى يا نصر"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212752/http://masr.20at.com:80/article.php?sid=163&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
