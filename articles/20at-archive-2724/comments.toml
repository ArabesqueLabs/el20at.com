posted = "2008-01-31"
text = "لقد ظهر المهدي بإذن الله تعالى و من أهل السنة في سوريا و من مدينة حمص السوريةبنسب عربي أصيل و ليس بنسب فارسي دخيل و بتفسير معجز للقرآن الكريم و بأدوية لكل أمراض العصر المستعصية و تقدمة أختراعات للعالم بالبينة و بالدليل المادي . هذا هو المهدي الذي ستفرج الأمور باذن الله و بأمر من الله تعالى على كل المسلمين و تزال الغمة عنهم و يندحر الطامعون بهم شرقاً و غرباً .www.abdulmunaemabbara.com/ARABIC.htm"
