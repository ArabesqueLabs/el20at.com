order = 3
subject = "المهدي المنتظر"
author = "العلامه (محي الدين عبدالله)"
posted = "2008-08-20"
text = ":: المهدي المنتظر رجل صالح تقى لايبحث عن الملك ولا على السلطه ولايعرف نفسه انه هو المهدي المنتظر ,, علامة ظهوره في مكة المكرمة ( وهي علامة على قدسية مكة – التي تحاول بعض الطوائف ان تجعل لها ندا ونقيضا حيث تحج بعض الفرق والطوائف الى أضرحة بنوها وزخرفوها ليجعلوها مقدسة ويجلبوا اليها أشياعهم ليبعدوهم عن بيت الله الحرام ,, ونجد هذه الفرق والطوائف تحج الى هذه الاضرحه بكل سكينة ووقار ويعتبرونها من الشعائر المقدسه وعندما يحجون الى الكعبة المشرفه يعلنون الفوضى والمظاهرات بحجة اعلان الجهاد ولكنهم في حجهم الى اضرحتهم يحجون بكل سكينة ووقار وليس لهم علاقة بالجهاد ) ,, ويخرج المهدي في موسم الحج وعلامة موسم الحج هذا هو تقاتل الحجيج والدم يبلغ الركب وهو أمر عجيب مخيف وكأن وباء نزل بأرض الحرم المكي ( وهي حكمة ربانيه ستكون علامة وآية لهذا الامام العادل المهدي المنتظر) ,, وبناء على ماقد سبق ان من جاءكم يدعي المهديه (انه مهدي منتظر) بعيدا عن هذه العلامات (مكه وموسم الحج واقتتال الحجاج) فليعلم الجميع انه كاذب ومنافق وليس بمهدي بل الكذاب .<br />:: المهدي المنتظر لم يدخل سرداب ولم يختفى وليس هو ابن العسكري كما تزعم طوائف واحزاب وفرق والدليل الاتي :<br />عندما رفع عيسى عليه الصلا ة والسلام الى السماء حيا رفع عندما بلغ الحلم وسن الرشد (لكي يفهم ويعي ماذا يحدث له – رغم أنه كلم الناس في المهد ,, ولكنه لم يرفع الى السماء الا بعد أن بلغ الحلم وبلغ الرشد ) ,, ولن يدخل الله انسان لم يبلغ الحلم ولم يبلغ الرشد سردابا وهو في المهد صبيا مئات السنين ,, وكذلك أصحاب الكهف الذين لبثوا في كهفهم 309 سنين لبثوا في هذا الكهف هذه المدة بعد أن بلغوا الحلم وسن الرشد ,, ولن يدخل الله انسان لم يبلغ الحلم ولم يبلغ الرشد سردابا وهو في المهد صبيا مئات السنين ,, وكذلك الخضر (ان صح انه حي لم يمت ) فلقد اذن له بالحياة بعد أن بلغ الحلم وبلغ الرشد ,, ولن يدخل الله انسان لم يبلغ الحلم ولم يبلغ الرشد سردابا وهو في المهد صبيا مئات السنين ,, وكذلك العزير عبد الله ورسوله أماته الله 100 عام ثم أحياه بعد أن بلغ أشده وبلغ الحلم ,, ولن يدخل الله انسان لم يبلغ الحلم ولم يبلغ الرشد سردابا وهو في المهد صبيا مئات السنين ,, وكذلك رسول الله صلى الله عليه وسلم لم يهاجر ويختبىء في الغار الا بعد أن بلغ الحلم وبلغ الرشد ,, ولن يدخل الله انسان لم يبلغ الحلم ولم يبلغ الرشد سردابا وهو في المهد صبيا مئات السنين وكذب من ادعاها من الطوائف والفرق الكذبه المنافقون .<br />المهدي المنتظر عندما سيظهر لن يكون تابعا لأي فرقة أو حزب أو جماعه أو طائفه ولكنه سيكون مسلم خالص لله تعالى وسيعمل على أقامة دولة الاسلام الموحدة حيث سيعمل على توحيد الدول الاسلاميه وانهاء كل الطوائف والفرق والاحزاب حيث لن يبقى شىء اسمه الطائفه الشيعيه أو السلفيه (التكفيريه أو الجهاديه أو السنيه) أو الصوفيه أو العلويه أو حركة الاخوان الي اخره من طوائف واحزاب وحركات وجماعات نهبت وسلبت عقول واموال الامه الاسلاميه ودمرتها بحجج منها حب آل البيت ومنها انهاء البدع ومنها قتل العملاء الى آخره ولقد قامت هذه الفرق والاحزاب بتفسيخ الامه الاسلاميه ونهشها ومن كان خارج هذه الفرق من المسلمين الموحدين بالله هو ضال كافر مرتد ويجب قتله ان صح السيطرة عليه ولقد قامت بعض هذه الفرق والطوائف منها من قتل المسلمين أكثر مما قتل من الكفار اليهود أعداء الله .<br />المهدي المنتظر وبعد ان يوحد الدول الاسلاميه هو الوحيد الذي سيحرر القدس الشريف من اليهود الانجاس في هذا العصر ان شاء الله تعالى حيث أن اليهود الان يشهدون آخر عصر سيحكمون فيه وبعد أن ينتصر عليهم المهدي المنتظر ويحرر القدس الشريف سيهرب عدد منهم وسيظهرون مع الدجال عند خروجه من ايران (من مدينة أصبهان) وسيخرج معه سبعون الف من اليهود ينصرون الدجال وبعدها سيحاصرون المهدي المنتظر وينزل عيسى عليه الصلاة والسلام فيقتل الدجال ويقول الحجر لكل مسلم تعالى ورائي يهودي فاقتله وهذه ستكون نهاية اليهود الابديه .<br />على كل مسلم أن يجهز نفسه ويعتزل كل الطوائف والاحزاب والفرق وينتظر الامام العادل المهدي المنتظر لكي يعمل على نصرته لوجه الله ولايعمل على نصر طائفته وحزبه ويتحدى ولى الله الامام العادل المهدي المنتظر حيث أن المهدي سيعمل على أنهاء هذه الفرق سلميا لمن اهتدت وبالحرب لمن تعارض حيث أن النصر والرعب يمشى بين يدى المهدي فحق أن يعز الاسلام بهذا الامام العادل ولن يعز الاسلام الا بالوحدة حيث قال الله تبارك وتعالى (واعتصموا بحبل الله جميعا ولاتفرقوا ) – صدق الله رب العالمين ,,<br />وليتهىء كل مسلم باستقباله فهو رجل صالح وليس معنى هذا الكلام أن تعتزل الناس الحياة العامة واقامة الصلاة وفعل الخيرات ولكن عليهم اعتزال الفتن ماظهر منها وما بطن وان يتقوا الله في كل شىء ويعتزلوا كل الفرق والاحزاب والطوائف وان يكونوا مع السواد الاعظم من المسلمين حيث أن الطوائف والفرق هي ربع العالم الاسلامي ولكن الباقيه من المسلمين لاينتمون الى حزب ولافرقه .وهم الناجون حتى و لم يظهر الامام المهدي المنتظر لانهم يعملون كل خير لوجه الله تعالى خالص ولايعملون الخير لاجل الجماعة او الحزب خوفا من قطع الاموال والمساعدات عليهم .<br />المهدي المنتظر وكما قلنا سابقا لم يدخل في سرداب ,, وهو كما البشر ,, و سيولد في عصره ويعيش في عصره وبالتالى كل ما قيل عنه من بعض الفرق هو كذب وأنه سيخرج معه قرآن جديد غير الذي بين يدينا الان هو كذب واليكم الدليل :<br />اولا : لن يقبل الله تبارك وتعالى أن يكون كاذبا حيث قال تبارك وتعالى (الْيَوْمَ يَئِسَ الَّذِينَ كَفَرُواْ مِن دِينِكُمْ فَلاَ تَخْشَوْهُمْ وَاخْشَوْنِ الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الإِسْلاَمَ دِيناً) فكيف يرضى الله تبارك تعالى لنا الدين وهو ناقص مدة 1429 سنه .<br />ثانيا : لن يقبل الله تبارك وتعالى أن يكون كاذبا حيث قال تبارك وتعالى (إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ) فكيف يرضى الله تبارك وتعالى بان نقرا قرآن خطأ غير محفوظ مدة 1429 سنة .ثالث : لن يقبل الله تبارك وتعالى أن نقف نصلى له جميع الصلوات وكل شهر في رمضان ( شهر القرآن _ ولو كان القرآن مزيفا لما كان استحق اسم شهر القرآن الذى نزل فيه القرآن ) وفي كل ليلة قدر حيث ان ليلة القدر خير من الف شهر (هل سيكون القرآن مغشوش وتكون ليلة القدر التي هي خير من الف شهر كذب وكل المسلمون كانوا يقومون فيها من غير علم وهم على باطل ؟؟ بئس ماتقول الطوائف والاحزاب لتخرج الناس من الدين فهم بذلك يتبواؤن اشد درجة في النار فهي مثواهم وبئس المصير . فليستيقظ الناس التي تنتمي الى هذه الفرق والطوائف الخارجة عن الاسلام فمصيرهم النار وليتركوا قادتهم وعلمائهم الذين اضلوهم وليفهموا فلن ينفعهم عذرا يوم يولاقون الله ويدخلهم جهنم فهذا لهم بيان وهذا لهم نذير وليتقوا الله ولن تنفعهم أشياعهم ولن تنفعهم ابنائهم ولاآبائهم ولاأمهاتهم بعد ماجائهم العلم والحق فلايمترون ولايكذبون .<br />(اللهم هل بلغت اللهم فاشهد – اللهم فاشهد – اللهم فاشهد)"
