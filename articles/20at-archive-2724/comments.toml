text = "يا شباب الاسلام لا تنتظروا المهدي ، فلم نتعبد بالانتظار بل تعبدنا بالعمل.<br />فكن أنت المهدي ، واعمل لخلاص الامة من الطواغيت وعلى رأسهم ال سعود وحسني ، ثم ابني دولة المؤسسات التي تقوم على العدل والحرية مستفيئة بظل الشريعة ."
