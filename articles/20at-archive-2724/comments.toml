author = "اكتب اسمك هنا    Amma"
posted = "2007-03-18"
text = "لا حول و لا قوة إلإ بالله ، يا موقع عشرينات كيف سمحتم بنشر تعليق هذا ال ...ROCKER<br />الا تعرفون أن الطائفه الأحمدية القادينية هذه طائفه ضاله و منحرفه و لا تمت للإسلام بصله ، و قد أجمع على تكفيرها كل علماء الإسلام و هذا الميرزا الذي يروج له صاحب هذا التعليق ما هو إلا مدع و كاذب و أفاق و عميل للبريطانيين الذين كانوا يحتلون الهند آنذاك ، استخدموه كأداة ليصرفوا المسلمين عن دين الله الحق و عن فريضة الجهاد ، فقد اسقط هذا الميرزا فريضة الجهاد عن اتباعه و زعم أن الجهاد اسقط بمبعثه - لعنة الله من كاذب فلا نبوة بعد رسول الله صلى الله عليه و سلم<br />وقد تصدى له كل علماء السنه فى الهند آنذاك و أثبتوا كذبه و كفره و لكن رجعت دعوته و جماعته فى الظهور و الإنتشار بسبب ضعف الأمه الاسلاميه و تكالب قوى الكفر الاستعماريه<br />يا أيها الذين آمنوا اتقوا الله و قولوا قولا سديدا"
