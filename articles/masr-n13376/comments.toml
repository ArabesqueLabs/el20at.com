order = 0
subject = "هو ايه الفقر ومين الفقير والشهاده عشان ايه"
author = "خالد الامير"
posted = "2007-12-16"
text = "والله مصليحي بيفكرني بزمان ايام الاتحاد الاشتراكي والتنظيم الطليعي وبدايه ثورة العسكر في يوليو كانوا بشترطوا بردو علي الطلبه الي عاوزين يتعلمزا بالمجان شهادة فقر بانب ان الارجل كان من اعذاء هذه التنظيمات لينضم مع باقي الشله في الحكومه من اعذاء هذا الزمن البائد مثل د/مفيد وعلي الدين وحبابنا الي لسه ليهم صوت عوزنا نرجع زي زمان قول للزمان ارجع يازمان وعاوز اعرف هو ايه تعريف الفقر في نظركم ومين الفقير ومين ال يستحق افا<br />كم الله"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212063505/http://masr.20at.com:80/newArticle.php?sid=13376"
