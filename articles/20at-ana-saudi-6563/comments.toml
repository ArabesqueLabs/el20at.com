subject = "محتار"
author = "محمود المدرس"
posted = "2007-07-04"
text = "{والسارق والسارقة فاقطعوا أيديهما جزاء بما كسبا نكالاً من الله} [المائدة:38]. وقد لعن الله تبارك وتعالى من ارتكب هذه المعصية، قال رسول الله (: \"لعن الله السارق؛ يسرق البيضة فتقطع يده، ويسرق الحبل فتقطع يده\" [البخارى]<br />لو نطبق ماورد اعلاه لكان سكان المعمورة بدون ايدي جميعا"
archived = "2010-03-14"
