[[comments]]
order = 1
subject = "لو نطبق ما ورد اعلاه...لكان سكان المعمورة يعيشون ف"
author = "أحمد"
posted = "2007-07-04"
text = "بالعكس يا محتار، لو طبقنا ما ورد اعلاه لكان سكان المعمورة يعيشون في امن وأمان،<br />والسبب ببساطة ان الناس بمجرد ان يعلموا بوجدو هكذا عقوبات رادعة، فإنهم سيمتنعون عن السرقة، وبالتالي سينخفض عدد اللصوص والقتلة والمجرمين وسنعيش جميعا في امن وامان.<br />اما انت فسبب قولك \"لو نطبق ماورد اعلاه لكان سكان المعمورة بدون ايدي جميعا \" هو انك إعتبرت ان تطبيق هذه العقوبات سيتم بأثر رجعي، وهذا غير صحيح."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ايها المحتاار"
author = "محمد"
posted = "2007-07-05"
text = "ثم انه يا ايها المحتار العقوبات الاسلاميه في المقام الاول للردع وليست للتطبيق الا في اضيق الحدود والا اصبحت سيفا مسلطا علي كل الناس فيجب ان ياخذ القضاء مجراه لاثبات الجريمه واثبات الجريمه في الاسلام من اصعب الاشياء ليس لان الاسلام يريد ان يهرب المجرم ولكن لان الحق يجب ان ياخذ مجراه للتاكد واخيرا لو علمت ان ابن الجيران اصدر فرمانا بان من يتحرش باخته سيحرقه امام الناس وانت تعلم ان ابن الجيران صادق في وعده وكلامه فهل ستعاكس حتي اخته ام ماذا"
archived = "2010-03-14"
