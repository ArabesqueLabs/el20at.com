subject = "رأى متواضع"
author = "المسكين"
posted = "2008-01-28"
text = "طبعا الموقف بتاع الاب مرفوض بس احنا عمرنا ما شفنا كده يعنى بالصريح انت بتخترع من مخك قصه وتألفها وبعد كده<br />تبدأ تقول شوفوا شوفوا المسلين ازاى فى حين ان القصه مخترعه وفى حين ان الاسلام يرفض الموقف ده ومش شفنا يعنى عالم طلع يقول الروايات حرام .<br />بجد واضح جدا ان انت عاوز تنشهر شويه فتكتب حاجه تثير السخريه منك وتستدعى القارئ الى الشعور ببلاهه فكرك والنقليد الزائف لكثير من الكتاب العلمانيين المتعالمين وليس لهم من العلم شئ ( مش كلهم طبعا )"
archived = "2010-03-14"
