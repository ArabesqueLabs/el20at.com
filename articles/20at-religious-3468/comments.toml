author = "اكتب اسمك هنا"
posted = "2007-03-22"
text = "ما هكذا يكون الحكم علي الناس أو الجماعات ولكن إن أردت نقدا هدفا أو بناءا(وليس للهدم) فكن كالصحفي الذي يحتال ليدخل السجن لينقل ما يدور بداخله بموضوعية وحيادية . . . أقصد أخرج مع هؤلاء البشر ولا تقيم فكرهم بشهادة عيل<br />ولكن قيم فكرهم بشهادتك أنت ورؤيت أنت ففيهم الدكتور و المهندس والمحاسبوغيرهم من النخب المثقفة"
