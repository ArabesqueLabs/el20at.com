subject = "اذا فلوسي حرام"
author = "محمد"
posted = "2007-11-25"
text = "بفلوسي يفسد اولادي واهل بلدي ويريدها بلد فاسده فاجره مثل اهل بيته<br />اصحوا يا اهل مصر<br />النصاري يقومون بالتبشير بكل ما يملكوا من مال وقدره بسبب الصحوه الاسلاميه لدي المجتمع العربي<br />بشرائي لخط موبنيل او اي منتج من منتجات هذا الفاسق فاني ادعوا الي الفسق والفجور واساعد عليه ومن دل علي خير فله اجر من عمل به ومن دل علي غير ذلك فكلنا يعرف النتيجه انت تختار<br />اذا فلوسي حرام"
