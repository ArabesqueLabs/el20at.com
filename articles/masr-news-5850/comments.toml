subject = "تانى ياعشرينات؟"
author = "مصرى واللة اعلم"
posted = "2007-05-14"
text = "دشن الاخ بتنجان مش عارف اية حملة لمقاطعة otv طيب الحملة دى فين مسمعناش عنها خالص فى اى موقع او جريدة واضح انها فى خيالكم وبس<br />وبعدين ياعشرينات انتم مهتمين قوى بالموضوع دة لية<br />يعنى الراجل عرض فيلم وهوا بالمناسبة مش درجة r معرفشى جبتوا الدرجة دى منين بس الفيلم بتاع 18 سنة دة بيكون فلم جنسى صريح<br />فبلاش تلفيق وانا فى الحقيقة شاكك انكم تكونوا بتعملوا حملة مدبرة لصالح نجيب ساويرس لان اللى مشافشى القناة اكيد دلوقتى شافها والقناة برامجها متميزة للغاية وكاءنكم بتعملوا دعاية مجانية للقناة<br />او دعاية مش مجانية ظ"
