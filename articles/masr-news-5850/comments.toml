subject = "جحا شايل الحمار هو وابنه  . جحا رما الحمار وابنه"
author = "oo0omo0o@yahoo.com"
posted = "2008-03-17"
text = "كل واحد وواحدة دخلين مش فاهمين حاجة يا عالم المظاهرات دي كانت زمان . وبعدين لو قاطعت قناة ساويرس هتسيب باقي القنوات علشان مش بتاعت مصري وبعدين انت مالك ان كان مسلم ولا مسيحي . الراجل دي يا جماعة مشغل ناس<br />وفاتح بيوت في مصر احسبها كام واحد شغال في موبينيل ( في البيع - التوزيع - خدمة عملا ء ) ورافع اقتصاد البلد ياريت<br />قبل متحاسب الناس حاسب نفسك ولو مش عجبك الوحش فية ياريت تعمل الكويس فيه يا جماعة انت لما بتتصل بخدمة العملاء بتقولك انت مسلم ولا مسيحي ولا تلاقي الاحترام . زي ماقولنا مش عجبك otvفي قناة الناس مش عجبك اقفل ؟"
