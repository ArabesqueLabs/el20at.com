author = "شيماء .."
posted = "2010-02-26"
text = "انا في تالتة كلية ترببية وسمعت الخبر دا من الموجه بتاعي في التربية العملي و للامانة الموجه قالنا مفيش ضرب غير لما نبقي علي بينة ان القرار دا حقيقي مش اشاعة :-x وكاننا هنقعد علي العصاية مستنين نضرب العيال انا مش هقدر اقول غير حاجة واحدة حسبنا الله ونعم الوكيل لان القرارات المتخلفة دي مش بس بتكره العيال في التعليم لكن كمان بتنزل اكتر واكتر من هيبة المدرس ...مش هتصدقوني لو قلتلكم ان انا ومعظم زملائي في الكلية بنندب حظنا وبنقول يا ريتنا مادخلنا المجال ده الله يرحم زمان لما كان الواحد يشوف مدرسه في الشارع يجري عليه وكانه لقي كنز ... ادعولي اخلص كليتي علي خير والاقي اي شغلانة تانية غير التدريس اللي بقي بيعقد المدرس قبل الطالب .ولا انتو فاكرين القرار ده هيبسطنا القرار ده معناه ان المرس يطلع عقده عالطالب والمدير يطلع عقده عالمدرس والموجه يطلع عقده عليهم هم الاتنين والوزير يطلع عقده عليهم ..وهكذا :o ونتحول كلنا من سلسلة مربين اجيال لسلسلة مرضي نفسيين. مش بقولكم ادعولنا"
archived = "2010-03-01"
capture_url = "https://web.archive.org/web/20100301100600/http://www.20at.com:80/masr/hot-topics/15479-2010-02-24-20-28-56.html"

