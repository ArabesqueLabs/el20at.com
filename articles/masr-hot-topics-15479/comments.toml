text = "انا 15 سنة اولي ثانوي معنديش غير كلمة واحدة للفاكر نفسه قال ايه وزير تعليم<br />يا ريت تروح تقعد ف بيتك احسن<br />كل يوم المدرسة بتقولنا قرارات غريبة جاية منه<br />ده واحد مقرف بجد ووالله مفيش حد بيحبه وهو اصلا واحد زفت وبجد نفسي اقوله كده ف وشه والتعليم مش هيتصلح ع ايديه ابدا والله يمكن يخرب اكتر"
