text = "الى الاخت ام يوسف بالزمة ده تعليق يطلع من واحدة المفروض انها تكون ام ومربية أجيال ، وتقول ان المدرس اللى ماسك خرزانة مدرس هزء ، والله ما حد خرب التعليم غير المدرسين اللى طلعوا أمثالك لدرجة تخللى واحدة كانت فى يوم من الأيام تلميذة لمدرس محترم وبعد ما كبرت تقول عليه هزء ، أنا مع الرأى ان فيه شوية مدرسين منهم لله ضروا بسمعة باقى المدرسين بالضرب وبإجبار الطلاب على أخذ الدروس وخلافه ، لكن الأغلبية من مدرسينا كانت ناس محترمة وبنكن لهم كل احترام ولما بنقابلهم فى الشارع بنسلم عليهم بأدب وبنبقى عايزين ناخدهم بالحضن بس أدبنا وتربيتهم لينا تمنعنا من ذلك وده كله وكلهم كانوا ماسكين عصاية يا ست ام يوسف يبقى ازاى امثال دول كانوا هزء فهمينى"
