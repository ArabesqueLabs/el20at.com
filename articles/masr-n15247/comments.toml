[[comments]]
order = 0
subject = "حكم اثلج صدرى"
author = "حسين كامل"
posted = "2008-04-15"
text = "حكم اثلج صدرى مع انى ارى ان الحكم غير عادل وكنت اتمنى ان تصل العقوبة الى الاعدام او على اقل تقدير السجن المؤبد لكن عزائنا الوحيد ان سنة السجن فى الاحكام العسكرية تعادل 12 شهرا بعكس الاحكام المدنية السنه تعادل 9 اشهر والافراج بعد نصف المدة , اى ان الشاطر سيبقى مسجونا لمده 7 سنوات بالتمام والكمال وهو زى الشاطر !! واخيرا 7 سنوات هو حكم غير عادل وغير كاف لمن يخونوا اوطانهم واتمنى من القضاء العسكرى فى المستقبل ان يكون اكثر حزما تجاه اعداء الوطن من الاخوان المتأسلمين ومن هم على شاكلتهم ممن خربوا ودمروا البلاد"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

