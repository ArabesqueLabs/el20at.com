[[comments]]
order = 5
subject = "يا فرحة عدلي ابادير فينا"
author = "مش هناك"
posted = "2008-04-16"
text = "يا اخوانا احزنا حزنانين حزن ما يعلم بيه الا ربنا<br />يا فرحة اعدائنا فينا<br />يا فرحة اليهود والنصارى فينا<br />لما المسلمين بيقتلوا بعض وبيسجنوا بعض وبيحاربوا بعض وبيعتدوا على بعض وبيكفروا بعض<br />النبي محمد لم يامر بهذا ابدا صلوات الله وسلامه عليه<br />النبي محمد صلوات الله وسلامه عليه علم الحاكم وعلم المحكوم<br />النبي محمد بريء من هذه الافعال حكاما ومحكومين<br />يا فرحة عدلي ابادير فينا يا مسلمين"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

