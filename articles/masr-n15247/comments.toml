[[comments]]
order = 3
subject = "الاخوان المسلمين ما عندهمش رحمه (بصو في الصورة)"
posted = "2008-04-16"
text = "الاخوان المسلمين دول ناس ما عندهمش رحمة بعكس ما وصانا به النبي محمد صلى الله عليه وسلم استوصوا بالنساء خيرا<br />علشان خاطر السياسة بهدلوا النساء معاهم ازاي<br />يا اخوانا فيه حاجه اسمها اهل السنة والجماعة اللي مصر تنتمي اليها بنسبة 94%<br />اهل السنة والجماعة ليهم علماء في مصر والسعودية والمغرب وباكستان وفي كل مكان فيه علماء اهل ا لسنة والجماعة<br />لم يفتوا ابدا بالسجون والمعتقلات وبهدلة النساء والاطفال بهذه الصورة"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
