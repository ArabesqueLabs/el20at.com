[[comments]]
order = 13
subject = "انا قلت عيب لما اشتغل بالسياسة ومجلس الشعب والنيله"
author = "للاخ اللي بيقول الدكتور أحمد ع"
posted = "2008-04-16"
text = "أنا مش هتكلم علي الدكتور أحمد ولا علي تأدييده المطلق للحكومة ولا اي حاجة خالص ...أنا هاسأل سؤال واحد بس<br />لما انتا شايف ان السياسة ومجلس الشعب عيب وبتطالبنا اننا نسال العلماء الكبار أمثال الدكتور احمد عمر هاشم ، أمال الدكتور أحمد عمر هاشم نائب في ايه بقا ان شاء الله ..مش في مجلس الشعب برضه وكمان عضو في الحزب الوطني ... الله هو مش عيب يا جماعة ولا ايه؟؟"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

