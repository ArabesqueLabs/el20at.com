[[comments]]
order = 15
subject = "فأصمهم واعمي ابصارهم"
author = "ميدو"
posted = "2008-04-16"
text = "لا اجد تعليقا يكفي للرد علي الذين اصيبوا بالعمي فيرون ظلمة الظملة بينما لا يرون نور الحق ؛ هؤلاء الذين ينتقدون المعتقلين لماذا ؟ّ لانهم اعتقلوا ؟ وكانهم هم الذين ارادوا ذلك لكنهم لن يعرفوا ما يبذله الاخوان الا لو امضوا ليلة واحدة في سجون النظام ؛ واختم كلمتي بحديث لرسول الله صلي الله عليه وسلم قال فيم معناه : ايها المؤمنون شمروا فان الأمر جد وتأهبوا فان الرحيل قريب وتذودوا فان السفر بعيد وخففوا أثقالهم فان ورائكم عقبة كؤودا لا يقطعها الا المخففون ؛ ايها الناس ان وراء الساعة أهوالا شدادا وأمورا عظاما وزمانا يتحكم فيه الفسقة ويتصدر فيه الظلمة فاعدوا لذلك الايمان ؛ عضو عليه بالنواجز وأكثروا من العمل الصالح واصبروا على الضراء تفضوا الي النعيم المقيم \" ؛ ونقول للظالمين صبرا سترون ما يلحق بكم في دنياكم قبل اخرتكم في اولادكم واسركم وسيعلم الذين ظلموا أي منقلب ينقلبون ."
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 16
subject = "كيف تنهض أمة بحبس العلماء"
author = "أحمد"
posted = "2008-04-16"
text = "اللافت للنظر أن كل المحكوم عليهم على درجة الدكتوراه ورجال أعمال<br />فكيف نطلب النهوض لهذه الأمة وأفضل رجالها فى السجن وما هو الجرم المرتكب<br />أنا شخصياً لا أدرى<br />اللهم هيأ لهذه الأمة أمر رشد يُعَز فيه أهل طاعتك ويُذَل فيه أهل معصيتك"
archived = "2008-04-20"
