[[comments]]
order = 17
subject = "للعقلاء و اصحاب الالباب"
author = "فتاة من نساء مصر"
posted = "2008-04-16"
text = "أحدثكم بلسان مصريه لا تنتمي للاخوان؛ واقول قول حق لوجه الله؛ واتسائل عن هذا التناقض الواضح في نفوس الرافضين للاخوان؛ تتهمونهم بامتهانهم نسائهم لانهم نادوا بحقهم في العمل السياسي؟؟<br />وهل السياسة بعيدة عن الدين؟ وهل اسلامنا ليس سياسة لحياتنا و بيوتنا و بلادنا؟<br />وهل اعدائنا من الصهاينة في فلسطين المحتلة و الصليبيون في العراق (كما سموا انفسهم علي لسان بوش بانها حملة صليبية ثانية) نسوا لحظة شرائعهم التي صاغوها بأيديهم حتي ننسي نحن اسلامنا و منهجه الشامل في حياتنا؟<br />وهل تطلب من زوجات و بنات مُحاكمين من علية القوم ومفكريه سواء مظلومين او لا؛ ان ينسوا ابائهم ولا يتواجدوا في نطق الحكم؛ وكان اولي بك ان تطلب من حماة البلاد ان يكفوا اياديهم عن النساء و الاطفال؛ فلا جرم لقتاه ذهبت لتنظر مصير اباها بان تضرب وتروع؛ او لمراة طرقت وحدها في الطريق وسلبت زوجها صاحب المكانة الاجتماعية المرموقة و نهبت اموالهم ولمت بهم المصائب والابتلائات؛ فلا جرم لها حتي تسب بابشع الالفاظ و تضرب ضربا مبرحاً وكانها مجرمة لا زوجة متعلمة وعلي قدر من الثقافة و المكانة الاجتماعية.<br />اقول قولي هذا؛ واشهد الله اني لست من الاخوان ولكني انظر لهم بعين العدل؛ ولا اتفق معهم ولا اختلف معم واري طرق كثيرة للجنة؛ ولا انكر طريقهم لها؛ واسئل الله ان يعينهم و يهدينا للطريق الصواب"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 18
subject = "خيرت الشاطر حيتسجن لحد مايلبسوا جمال  جلباب ابية ل"
author = "كوز المحبة"
posted = "2008-04-16"
text = "حكم ظالم وجائر القصد منة كما تمنى الحكومة نفسها اضعاف الاخوان ودة حلم بيحلم بية ذو الانفس المريضة من شرذمة وحثالةالمجتمع ليخلوا لهم الجو لنهب ماتبقى من المال العام واقحام البلد فى ديون تفوق الناتج المحلى الحكم سيزيدالاخوان اصرارا على المضى فى برنامجهم السلمى والناس يوم عن يوم بتكرة الحكومة وتصرفاتها وسلبيتها تجاة الناس ودة فى القريب العاجل ان شاء المولى عزوجل سيسارع الخطى فى زوال اسواءكابوس عاشة الشعب المصرى على مدى تاريخة تسبب فى اقل من تلت قرن من العودة بالبلد الى العصرالطباشيرى"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 19
subject = "اذا سجن خيرت الشاطر فكلنا خيرت الشاطر"
author = "مش ساكت"
posted = "2008-04-16"
text = "اذا سجن خيرت الشاطر فكلنا خيرت الشاطر<br />يلا يا جماعة بلاش نضيع وقت<br />يلا على القران والسنه<br />يلا على الدعوة الى الله سبحانه وتعالى مش حنسيب بيت لما ندخله وندعيه مش حنسيب قهوة لما نعد عليها وندعي الناس اللي قاعدين عليها<br />مش حنسيب شارع ولا حاره ولا دكان<br />يلا يا جماعة بلاش بكاء كلنا رجاله ونساءنا رجاله<br />يلا على الدعوة في المدارس والجامعات والمقاهي والنوادي والحواري<br />يلا يا جماعة<br />الاسلام هو الحل<br />الاسلام هو الحل<br />الاسلام هو الحل<br />الاسلام هو الحل<br />الاسلام هو الحل<br />اصرخوا يا جماعة في الشوارع<br />الاسلام هو الحل<br />الاسلام هو الحل<br />الاسلام هو الحل<br />مش عايزين نشوف حد بيبكي مش عايزين نشوف حد بيعيط<br />حسن البنا حي معانا<br />حسن البنا تلميذ سيدنا محمد صلى الله عليه وسلم<br />يلا ما تضيعوش وقت<br />في كل مكان الاسلام هو الحل<br />والايام بيننا ياحسين يا كامل"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 20
subject = "الله اكبر ولله الحمد"
author = "مش ساكت"
posted = "2008-04-16"
text = "الله غايتنا<br />والرسول زعيمنا<br />والقران دستورنا<br />والجهاد سبيلنا<br />والموت في سبيل الله اسمى امانينا<br />مش حنسكت<br />يا جماعة عايزين كل واحد يجمع تبرعات لنساء الاخوان المعتقلين كل واحد يجمع تبرعات بنفسه ويسأل عن زوجات المعتقلين ويعطيهم المبلغ<br />مش عايزين ننسى بعض لازم ننتصر على حسين كامل وامثاله لازم ننتصر على الفئران والصراصير"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 21
subject = "صفقة الإخوان و...."
author = "أبو عمار"
posted = "2008-04-16"
text = "بصراحة كنت قرفان من التعليق على الموضوع بسبب الشخص المتخلف اللى بدأ التعليق ، ولكن حين انتهيت من قراءة التعليقات تيقنت أنه مدسوس ، وسرتنى ردود الناس على هذا الـ ..<br />المهم التعليق الأخير بصراحة فى الصميم وبيدل إن الإخوان دول ناس مش بتوع مصالح ولا وجاهة ، لا دول بتوع تربية وتضحية من أجل هذا الوطن اللى اتظلم بنسبة المتخلفين - اللى حاكموا الإخوان- اليه<br />يا جماعة إن كان الشاطر اتسجن فليكن كل الشرفاء خيرت الشاطر<br />أيوة كل الإخوان هيبقوا خيرت الشاطر غصب عن الحكومة والريس اللى حاكمنا ظلم وزور وبهتان<br />إن شاء الله المدة دى مش هتكمل ، انا حاسس والله إنهم إن شاء الله هيطلعوا قريب جدا من السجن بعد البنى آدم ، ولا حرام والله أقول عليه بنى آدم ، ما يغور من على وش الدنيا والبلد ترتاح منه قريب ان شاء الله<br />واظن مفيش حد من الجماعة هواة الجعجعة الكدابة يفتح بقه تانى بحكاية الصفقة ومش الصفقة اللى كل شوية يقولوا الإخوان عملوها مع الحكومة ، والحكايات الخايبة المتشالة على الرف ورا الباب اللى بتطلع كل شوية ، والكلام الماسخ اللى ملوش طعم بتاع جريدة المصريو ن اللى مش لاقية حاجة تكتبها ، واضح الصفقة فعلا ولكنها صفقة بين الناس دى اللى باعت روحها لله تعالى والله اشترى \\\" إن الله اشترى من المؤمنين أنفسهم وأموالهم بأن لهم الجنة \\\" معلهش ياشاطر ويا بشر ويا جلبط ويا عبد المحسن ، الجنة تمنها مش سهل ، الجنة تمنها التضحية وانتم قبلتم تبقوا مع المصلحين فلازم نستحمل شوية دفع التمن"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

