[[comments]]
order = 8
subject = "ردا على إفتراءات"
author = "محبة الحق"
posted = "2008-04-16"
text = "كيف يثلج صدر سيادتك حكم ظالم على إناس مصلحين والله لو تعاملت مع واحد منهم لما قلت مثل هذا الكلام \\\"والله غالبٌ على أمره\\\" ولسوف نرى من الظالم ومن يقول الإخوان معندهمش رحمة من أجل ما فعل بنسائهم أسألك يا ترى هم من فعلوا بنسائهم هذا ؟أم أنهم ظلموا هم ونسائهم يعني لو أي رجل حبس ألن تخرج نسا}ه يوم محاكمته ( يريت سيادتك تحكم بس ميكنش حكمك متل حكم المحكمة العسكرية) وعلى فكرة أنا مش من الإخوان"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 9
subject = "يا خسارة يا ميت الف خسارة"
author = "واحد بيحب البلد"
posted = "2008-04-16"
text = "أنا كنت هابكي وانا بقرأ التقرير مش علشان التقرير نفسه ... ولا علشان الظلم الواقع علي الإخوان..لكن من التعليقات المكتوبة ..لسه في ناس بتفكر كده ... لما يبقا 40 واحد معتقلين ومسجونين وصدرت في حقهم أحكام لأنهم وقفو قدام الظالم وقالوله لا علشان كلمة حق قالوها عند سلطان جائر ...علشان الشعب الغلبان المسلوب حقوقه ويجي واحد قاعد في التكييف وبيتفرج علي المسلسل العربي بتاع كل يوم ويقولك دول ناس ما عندهمش رحمة والتاني اللي يقول دول سابو اهلهم للبهدلة ... للاسف دول ناس عايشين في التراوة ناس عمرهم ما هيضحو ولا هيفكرو يضحو في مرة علشان البلد علشان كلمة الحق علشان العدل ..وبعدين سؤال للاتنين دول هو النبي برضه والصحابة مش كانو بيتعرضوا للايذاء وكانو بيتضربو وبيتعذبو واهلهم برضه بيحصل فيهم نفس الكلام ..مقالوش ليه نريح دماغنا ونقعد في البيت والتراوة أحسن من البهدلة دي ..قل نار جهنم أشد حرا لو كانو يعلمون"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 10
subject = "هو النبي برضه والصحابة مش كانو بيتعرضوا للايذاء وك"
author = "الى المعلق السابق"
posted = "2008-04-16"
text = "هي دي المشكلة<br />النبي محمد صلى الله عليه وسلم وصحابته كانوا بيتعاملوا مع كفار اصلا كفرة بالشهادتين كفره<br />لكن الاخوان المسلمين لا يتعاملون مع كفره الاخوان المسلمين يتعاملون مع مسلمين موحدين في دولة اسلامية<br />فيه فرق بين المسلمين العاصي والكافر<br />هي دي مشكلة الاخوان المسلمين انهم اوهموا الناس بأن الحالة اللي احنا فيها مثل حالة النبي وصحابته<br />لا يا استاذ احنا هنا في دولة اسلامية والحاكم مسلم عاصي فقط ولا فرق بين المقارنة بين هذه الحالة وحالة الرسول مع كفار مكه<br />ويرجى مراجعة علماء الدين الكبار في هذه المسالة امثال الدكتور احمد عمر هاشم"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 11
subject = "اظن انا كلامي واضح"
author = "مش لازم ومش ضروري ومش"
posted = "2008-04-16"
text = "اظن انا كلامي واضح للاخوة والاخوات اللي انتقدوني<br />انا قلت ان علماء اهل السنة والجماعة لم يفتوا بذلك ابدا (السجون والمعتقلات)<br />ثانيا انا قلت عيب لما اشتغل بالسياسة ومجلس الشعب والنيله واعرض زوجتي وبناتي لما هو موجود في الصورة اعلاه<br />وبعدين يا جماعة دا راي شخصي والاخوان ناس بيحبوا الديمقراطية كل واحد يقول رايه هي دي الديمقراطية<br />والصفحة مفتوحة لكل واحد عايز يقول رايه وانا رايي مش ملزم لاحد ولكن الحرية التي ننشدها جميعا هي التي جعلتني اقول رايي<br />احنا حر في رايي ورأيي ليس ملزم لاحد"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420061605/http://masr.20at.com:80/newArticle.php?sid=15247"

[[comments]]
order = 12
subject = "آه يا وجع قلبي"
author = "آه يامصر"
posted = "2008-04-16"
text = "غصب عني حعلق .. اترى لما السيدة سمية ضربة بالحربة في قبلها وماتت شهيدة هل كان ينبغي لها ان لاتفعل علشان ماتتبهدلش .. فين انصر أخاك ظالما او مظلوما ...<br />بالنسبة لحسين كامل ... صدقني انا لو علقت عليك ممكن أسعدك .. لكن أقولك حاجة واحدة .. ربنا يسقيك من نفس الكاس وقتها مش حدعي عليك لكن حقولك ربنا يفك أسرك .. لأن الظلم طعمه مر ... ولو يهودي مظلوم المفروض نقف معاه مش مسلم .."
