[[comments]]
order = 1
subject = "واضح ان الولية دى بتتابع حلقات المفتش كورمبو"
author = "سحس بومب مساعد المفتش كرومبو"
posted = "2009-02-25"
text = "يا سلام على الخيال العلمى الواسع<br />تبعتهم من الحسين لحمية الزيتون وكان الشوارع كانت فاضية ومفيش اشارات مرور ولا فقدت اثرهم فى الزحمة<br />واضح ان الشاهدة قد تناولت جالون من منقوع البراطيش او بتستهبل<br />وبناءا على الخيال العلمى النشيط لماذا لا يكون الفاعل شوية عيال مسيحيين من بتوع المهجر او من بتوع الامن نفسهم<br />ما هى بقت هيصة بقى وكل واحد يتخيل اللى هو عايزة"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203612/http://masr.20at.com:80/newArticle.php?sid=20111"

[[comments]]
order = 2
subject = "كلام فارغ"
author = "كلام فارغc"
posted = "2009-02-25"
text = "كلام فارغ وهبل وعبط وعيب لما المصري اليوم تتداول هذه السخافات واريد ان انوه هنا ان وزارة الداخلية لا علاقة لها بالامن من قريب ومن بعيد دول شوية ضباط بيتمنظروا بالبدل بتاعتهم وبالكراسي اللي قاعدين عليها"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203612/http://masr.20at.com:80/newArticle.php?sid=20111"

