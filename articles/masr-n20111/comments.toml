[[comments]]
order = 4
subject = "المفتش كرومبو"
author = "اكتب اسمك هنا"
posted = "2009-02-25"
text = "عظمة على عظمة ياست اية دة دى مصر بقت احسن من الانتربول الدولى عشان فيها المفتش كرومبو والمفتشة كرمبة داحنا كدة ولاقضية مهما كانت معضلة هتقف قدامنا طب مايخلوا الست كرمبة تقول لنا مين ال ارتكب مجزرة بنى مزار<br />مش عارفة اية السزاجة فى تلفيق لتهم دى لا ية راحة باولادها ثم بقدرة قادر وقفت تراقب الفندق ثم تتبع من اخذ الكيس (ونسيت ولادها ) حتى وضعة تحت الكرسى ثم تسمرت عيناها بهذا الشخص وظلت تتابعة حتى انفجرت لان الاخ مستنى القنبلة تنفجر عشان لو مانفجرتش يروح يرجعها للبياع وياخد فلوسة ما اصل احنا لانثق فى اى منتج مصرى قوم اية حدث الانفجار والاخت كرمبة لم تخاف لاعلى ولادها وعلى على نفسها فاخدت عربيتها وعملت مطاردة غرامية للاخوة الحرامية ال خطفوا قلبها اقصد خطفواا انتباهها ---------كفاية كدة انا زهقت من العبط دة لكن هقول كلمة واحدة الداخلية فى مصر اكتر حاجة فالحة فيها بامتياز هى التلفيق وفى الحادثة دى ماتقولش ابحث مع الشرطة لالا قول ابحث عن ؟؟؟؟!!1"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203612/http://masr.20at.com:80/newArticle.php?sid=20111"

