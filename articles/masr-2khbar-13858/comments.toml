text = "دكتور نظيف دة راجل بتاع سبورة وطباشيرة ومدرج يشرح فية للطلبة بس<br />دة راجل معندوش اى رؤية سياسية ولا خطط تنموية - يعتبر موظف مثالى فى توقيع البوستة ووضع امضائة الكريمة على الطلبات التى تقدم لة ووظيفة رئيس وزراء مصر دى كبيرة قوى علية<br />ويظهر ان الضغوط زادت علية اليومين دول من العيال بتوع السياسات فضرب بقين الكلام دول بتوع جمال وصحة مبارك علشان يخفف الضغط عن نفسة شوية<br />انما الراجل تنفيذيا وسياسيا ليس لة اعتبار<br />عموما هى ماشية ببركة دعاء الوالدين وتحويلات المصريين فى الخارج"
