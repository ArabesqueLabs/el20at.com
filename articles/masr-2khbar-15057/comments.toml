[[comments]]
order = 1
subject = ""
author = "الف تحية لشرطة دبي"
posted = "2010-01-26"
text = "من 30 سنه كانوا بيصيدوا سمك الان عندهم اكفأ جهاز شرطة في العالم واحنا بقالنا 7000 سنه وعندنا اسوأ جهاز شرطة في العالم<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />بث مباشر من الدوريات لغرفة العمليات بشرطة دبي<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />كشف القائد العام لشرطة دبي عن تركيب 160 كاميرا تليفزيونية على دوريات الشرطة، وانه سيتم تركيب 100 كاميرا أخرى خلال 2010 ، مؤكدا دخول تقنيتين جديدتين سيتم الإعلان عنهما خلال المرحلة المقبلة.<br />وقال خلال المؤتمر الصحفي الذي عقد صباح أمس بمقر القيادة العامة لشرطة دبي بحضور العقيد كامل بطي نائب مدير الإدارة العامة للعمليات، والعقيد عمر الشامسي مدير غرفة القيادة والسيطرة، والعقيد د. خالد غانم مدير إدارة الاتصالات بغرفة العمليات، إن شرطة دبي أول جهاز امني في العالم يطبق تقنية الجيل الثالث للاتصالات."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = ""
author = "الضابط اسلام نبيه"
posted = "2010-01-26"
text = "كل سنه وانتو طيبين انتو فاكرني طبعا انا الضابط اسلام نبيه اللي وضعت العصا في مؤخرة سائق التاكسي عماد الكبير<br />بس انا طلعت حمار وصورته بالبلوتوث وبعت الصور لزمايلي وابتدا الفيلم ينتشر لغاية ما وقع في ايد واحد صحفي<br />حتى بالامارة واحد عندكو اسمو البراء اشرف نزل الموضوع بتاعي عندكم في عشرينات واخذت تلت سنين سجن بس طبعا انا ما دخلتش السجن دا انا قاعد في عزبة بتاعة واحد صاحب بابا اصل انا بابا لواء كبير في الشرطة وبابا قالي خليك هنا لغاية ما الناس تنسا<br />بس الحقيقة انا عايز اعترفلكم انا دخلت كلية الشرطة علشان خاطر البس البدلة واعاكس البنات والستات بس هو دا كل اللي كنا بنفكر فيه انا وزمايلي علشان خاطر الشرطة المصرية بايظه ومش نافعة في حاجه<br />المهم الموضوع ابتدا يتنسي وان شاء الله بابي قالي حرجعك الشرطة تاني بس اوعا تعمل كده تاني"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = ""
author = "ترقيات ضباط متميزين"
posted = "2010-01-26"
text = "نحن الرئيس الاعلى لهيئة الشرطة في مصر طبعا انتو عارفني من غير ما اكتب اسمي وغيرت اسم كلية الشرطة وسميتها على اسمي علشان خاطر انا صاحب البلد دي<br />قررت بترقية كل من الضابط اسلام نبيه والضابط محسن السكري وذلك تقديرا لجهودكم الكبيرة في رفع رأس الشرطة المصرية عاليا<br />يعني الواد محسن السكري دا بطل مصري كبير راح ركب الطياره الى دبي وضرب واحدة ست بالسكينه في رقبتها وجاب اجلها ورجع تاني من غير ما حد يعرفه<br />ادي الكفاءات الشرطية اللي عندنا<br />وبرضه الواد اسلام نبيه عمل حاجه كويسه جدا انه جاب واحد جربوع هزاه وحط العصايا في المؤخرة بتاعته ودا طبعا علشان خاطر يكرس هيبة الشرطة المصرية في نفوس الشعب الواطي.<br />ولذلك قررنا ترقيتهم الى الرتب الاعلى مع اعطائهم مكافئه مالية مناسابة ويحول القرار الى حبيب العادلي الخدام بتاعي لتنفيذ القرار"
archived = "2010-03-14"
capture_url = ""

