text = "معلش يا سعادة حبيب العالي وزارة مش نافعة<br />لماذا<br />لانها مبنية على مبدأ خاطىء وفهم خاطىء<br />الا وهو ان الطلبة بيدخلوا كلية الشرطة علشان خاطر يبقوا بهوات ويتعايقوا بالبدله والبنات والستات يجروا وراهم<br />هي دي الحقيقة<br />الطالب ما دخلش كلية الشرطة علشان خاطر الشرطة نفسها او علشان خاطر بيحب الامن<br />يا سيادة الوزير<br />الطلبة بيخشوا كلية الشرطة علشان خاطر يتمنظروا بالبدله والبنات والستات تجري وراهم<br />هي دي الحقيقة<br />ولازم الدولة تتصرف بسرعة قبل الانهيار الشامل"
