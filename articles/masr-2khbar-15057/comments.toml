[[comments]]
order = 5
subject = ""
author = "تكنولوجيا العسس"
posted = "2010-01-26"
text = "الشرطة المصرية عايشة عصر المماليك بكل افتخار - وعندها مبدأ واحد ماشية علية - وهو الاعتراف سيد الادلة - ويتم تنفيذ ذلك بالقبض على اى تعيس فى الشارع او بجوار الجريمة وينزلوا فية تعذيب لغاية ما يعترف بحاجة لم يعملها<br />يعنى اسلوب العسس<br />فلا تقولى اكاديمية ولا تقولى كلية - الواحد لما بيسمع لواء بيتكلم منهم فى برنامج فى التليفزيون بيحس ان دة كلام واحد قهوجى او عربجى او محدود الثقافة جدا واسلوبهم الوحيد التعذيب حتى الاعتراف<br />انما الناس بتوع دبى فدول ناس متحضرين وعندهم ادامية وبيحترموا الانسان فلا تقارن بين العسس وجهاز شرطى حديث مجهز باحدث ادوات التكنولوجيا<br />انا فى دبى حدثت حريقة فى بيتى وعندما ذهبت لاخذ اقوالى فى القسم - العسكرى كان قاعد قدام الكمبيوتر وبيسال ويكتب اجابتى على الكمبيوتر - محضر الشرطة بيتم على الكمبيوتر وبأدب شديد جدا"
archived = "2010-03-14"
capture_url = ""

