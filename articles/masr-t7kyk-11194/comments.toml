[[comments]]
order = 1
subject = "انا فى جامعة خاصة والمناظر الكريهة بتاع الحيوانات"
author = "ميزو"
posted = "2009-02-05"
text = "الكلية الخاصة مفيش فيها بهايم عساكر<br />فيها امن مدنى على الباب - بس<br />ولا يوجد اى مشاكل اطلاقا<br />وكل طالب فى حالة<br />لان وجود العساكر بيستفز الطلبة<br />ممكن الامن يبقى خارج الجامعة وفى الشوارع اللى حوالين الجامعة - انما جوة الجامعة فهذا شىء حيوانى"
archived = "2010-03-14"
