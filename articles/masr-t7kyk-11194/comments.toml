[[comments]]
order = 0
subject = "تغيير اسم جامعة القاهرة الى قشلاق  ارميدان"
author = "سعيد ابو النصر"
posted = "2009-02-04"
text = "بذمتكم دى صورة جامعة والا صورة ارض الطابور لكتيبة مشاة<br />علية العوض ومنة العوض فى التعليم فى مصر<br />وانصح السادة العسكر بعمل ميدان لاطلاق النار والتصويب على الاهداف المتحركة حتى يتفهم الطلاب المحاضرات على خلفية اصوات الطلقات والقنابل"
archived = "2010-03-14"
