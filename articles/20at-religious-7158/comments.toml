subject = "ربنا يبارك في حياة اف ام"
author = "متيم حياة"
posted = "2007-09-25"
text = "ربنا يوفق أسرة إذاعة حياة ويبارك فيهم وما شاء الله عليهم<br />فكرة الخيمة كثير حلوة ويا ريت كل رمضان تصير<br />ونتمنى حضور عدد كبير دوما"
