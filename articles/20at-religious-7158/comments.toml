[[comments]]
order = 1
subject = "اجواء رائعة"
author = "lara"
posted = "2007-09-27"
text = "بداية بارك الله فيك اخي علاء على انتقاءك المميز للمواضيع المطروحة ........<br />و اريد ان اشكر كل القائمين على الخيمة الرمضانية<br />و انا شخصياً تواجدت في احد لياليها وة اجواء اكثر من رائعة لم نعيشها من قبل<br />و كنا مفتقدينها حقاً ...<br />و ان شاء الله إلى الأمام دوماً ..."
