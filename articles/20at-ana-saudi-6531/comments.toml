subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-07-03"
text = "ايه التجميل اللى فى الموضوع ده انا مش عارفه الناس بتتكلم و خلاص عندكوا احقاد على السعودية و كل ما يحد يجيب سيرتها الناس تتشال و تتحط على فكرة انا حابة جدا موضوعات السعودية لانها بجد بتكشفلى هذا المجتمع الذى لا ارى منه سوى العباءة و الناس كلها خايفة تتكلم على البلاوى اللى جواه بالعكس الموضوعات اصلا بحس ان كلها ضد السعودية او بتكشف السعودية على حقيقتها واكيد كل بلد فيها الحلو و الوحش و كويس اننا نعرف الحلو و الوحش"
archived = "2010-03-14"
