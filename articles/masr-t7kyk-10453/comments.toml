text = "ابوة متهم بالارهاب لدى الامريكيين -- وجهادى من الطراز الاول فى نظر المتطرفين<br />هذا موضوع اخر<br />شركات بن لادن للانشاء والتعمير فى دبى والشارقة وابوظبى والسعودية ملك اخوة اسامة بن لادن تعمل بحرية وتنفذ اكبر المشروعات واعلاناتها تملىء شوارع الخليج ومحدش قال لهم انتم بتعملوا اية<br />واحد من العائلة انحرف - يبقى بقية ذنب العائلة اية<br />ولكنة الخوف<br />مش عارف احنا فى مصر دايما خايفين لية<br />طيب اهو راح قطر"
