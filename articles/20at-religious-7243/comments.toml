[[comments]]
order = 2
subject = "خير الأمور الوسط"
author = "محمد مصطفى"
posted = "2007-10-02"
text = "لست مع هوجة الفتاوى على التليفزيون والفضائيات لأن معظم من يتصدون للفتوى بها غير أهل للفتوى أصلا. كما أن الأصل في الفتوى أنها تكون لحاله بعينها ولا يأخذ بها غيرها إلا إذا تطابقت الظروف تماما. بخلاف الأحكام التي تكون عامه وتلزم جميع المسلمين. فلذلك فأنا ضد الإفتاء على التليفزيون<br />كما أن الأخذ والرد من كلام العلماء لا يجب أن يتصدى له إلا عالم عنده من الأسس العلميه ما تمكنه من تقييم الكلام وأخذه أو رده. أما أن يأخذ كل واحد بما يحب ويترك ما لا يحب بمزاجه فهذا بالطبع تمييع للدين واتباع للهوى.<br />على كل منا إذا قابلته مسألة حيرته أن يستفتي من يطمئن لقوة علمه وأمانته في الفتوى ثم يعمل بالفتوى سواء وافقت هواه أم لا ولايتركها إلا لفتوى ذات أدله شرعيه أقوى من الكتاب أو السنه أو كلام الصحابة والتابعين.<br />مش كل ما نحب نعمل حاجه غلط ندور على شيخ يحللها لنا ولو لم نجد من يحللها نقول استفتي قلبك!!<br />اللي عاوز يعمل الغلط يعمله براحته بعيد عننا بس مش لازم كمان يحاول يقلب الموازين عشان يخلي الغلط بتاعه هو الصح"
archived = "2010-03-14"
capture_url = ""

[[comments]]
