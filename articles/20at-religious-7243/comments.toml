subject = "غالبيه الناس اتجننت"
author = "منى وهيب"
posted = "2007-12-15"
text = "احنا بقينا فى زمن فيه ناس تقول عن كل حاجه حرام وناس تانيين عاوزين كل حاجه حلال يعنى ضيعنا بين افراط وتفريط ونسينا ان الاصل فى الدين الاباحة يعنى كل شىء حلال الا اللى ورد فيه نص تلاقى ناس عاوزة تحرم اللى احله ربنا ىتفطس الناس وناس عاوزاها سبهلله وكله عامل نفسه مفتى وكل واحد خصوصا فى مصر فاكر نفسه خبير فى 3 حاجات الدين والسياسة والكورة وكله بيفتى والناس قربت فعلا ماتعرفش احلال من الحرام وكله راح وقف عند طرفى النقيض والوسطيه اللى هى الاصل قربت تنقرض يا فرحة امريكا فينا حالنا بقى مهزلة"
archived = "2010-03-14"
