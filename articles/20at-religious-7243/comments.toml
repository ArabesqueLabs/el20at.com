subject = "الدليل"
author = "مصراوى"
posted = "2007-10-02"
text = "اخوانى الكرام أعزكم الله أولا وكل عام وأنتم بخير فأرى من بعض اخوانى فيماسبقأنهم يأخذون من الفتوى مع مايتوافق مع عقولهم فقط وقلوبهم أى نعم الدين الاسلامى وأحكامه تتوافق مع العقل ولكن لا يجب أن يقيس كل فرد الفتوى على عقله وقلبه هو لأن تقدير الله ليس كمثله تقدير ولكن يجب أن يقيسها على شيئ واحد وفقط يوحدنا جميعا ألا وهو الدليل وأقول أيضا أن بعض اخوانى يعللون التحليل والتحريم باجتهاد أى شيخ فأقول اخوانى أولا يجب أن تنظر لهذا الشيخ فان كان أهلا للاجتهاد ومن أهل الصلاح فخذ منه والا فلا لأنه قد يكون صاحب هوى جزاكم الله خيرا ووفقنى واياكم الى مافيه الخير والصلاح."
archived = "2010-03-14"
