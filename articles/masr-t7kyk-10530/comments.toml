subject = "نقيب المحاميين سامح عاشور، لأن الرجل ده على حسب سم"
author = "مش كاتب"
posted = "2008-11-17"
text = "المحامين بتوعه ولا شوية الحرامية والنصابين<br />نقابة المحامين ولا نقابة اللصوص والاونطجية والحرامية<br />ربنا ينتقم منهم منهم لله<br />تخيلوا يا جماعة لما الكلاب دول ينصبوا على موكلينهم يعني واحد يروح لواحد محامي علشان خاطر يمشيلوا في قضية والمحامي دا ينصب عليه<br />ربنا ينتقم منهم يا رب<br />وما اعتقدش ان فيه واحد محامي محترم في البلد الوسخة دي<br />المحامي المحترم ما بيشتغلش محامي بيشتغل حاجه تانية"
archived = "2010-03-14"
