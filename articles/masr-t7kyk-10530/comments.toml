[[comments]]
order = 7
subject = "بعد قراءة الصحف - شعرت ان الناس محتارة بين فيلم عا"
author = "مواطن مصرى"
posted = "2008-11-18"
text = "الحكومة نفترض وزعوا الصكوك او الاسهم على السادة المواطنين<br />رائع وصلنا لمرحلة انتهاء التوزيع وخلص الطبل والزمر وكل واحد اخد اسهمة او صكة - ولانة مواطن شريف واصيل ووطنى مش هيبيع السهم وهيحتفظ بية مع قسيمة الزواج وقايمة العفش بتاع مراتة<br />طيب وبعدين<br />الشركات دى خسرانة<br />يعنى السهم ما لوش ارباح<br />اية اللى استفادتة الحكومة واية اللى استفادة المواطن<br />مفيش<br />يبقى مش معقول - هل هما هبل<br />يبقى احتمال يفرضوا ضرايب على الاسهم<br />او احتمال السادة المساهمين يدفعوا بالتقسيط تمن اسهمهم<br />الموضوع زى الصحافة ما بتقول اصبح عامل زى الفنكوش<br />يعنى اية فنكوش - محدش عارف - الحكومة هتوزع اسهم لشركات خسرانة ليس لها اى عائد ولا اى فائدة غير البيع<br />واحتمال ان المواطن يقول انا شايل حتة ورقة ملهاش لزمة ويبيعها بعشر قيمتها - يعنى السهم ابو 100 جنية يبيعة بعشرة صاغ<br />ويلم الاسهم دى اصحاب النصيب ويبيعوا ارض الشركة ويسافروا<br />يظهر ان جرعة الفنكوش زادت قوى<br />فين عادل امام يشرح لنا معنى كلمة الفنكوش"
archived = "2010-03-14"
capture_url = ""

