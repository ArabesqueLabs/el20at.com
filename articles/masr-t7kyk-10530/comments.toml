[[comments]]
order = 0
subject = "انا مش كا ويرك عبيط"
author = "انا"
posted = "2008-11-17"
text = "ازاى اقبل ان واحد هيبيع او يدينى حاجة بتاعتى انا<br />حاجة بناها ابائى بجوعهم وحصارهم<br />انتم عارفين مصانع الدواء دى اتبنت ازاى<br />لما امم عبد الناصر القناة فرض الغرب حصارة على مصر - ممنوع تصدير اى نوع من الدواء لمصر<br />وقام اطباء وصيادلة ومهندسين مصر وبقروش الغلابة بنوا مصانع الدواء ليكون حصن مصر ضد اى حصار او مقاطعة - علشان الفقير يلاقى دواء مصرى رخيص صناعة ولاد بلدة<br />وفية مصريين كتير ماتوا من نقص الدواء ايام حصار الغرب<br />تييجى تقول نبيع مصانع الادوية<br />الانجليز منعوا تصدير الفحم لمصر ايام حرب السويس وكادت ان تتوقف القطارات لانها كانت بخارية تعمل بالفحم فتم التطوير لتعمل الجرارات بالديزل<br />العيال دول مش فاهمين ان المصانع دى اتبنت بالعرق والدموع والدم وقروش الناس الغلابة<br />ان كان واحد من الحكومة دى بنى مصنع يبقى لا مؤاخذة من حقة يبيعة انما يبيع ما بناة الاباء لابنائهم فهذا هو تخريب البلد بعينة"
archived = "2010-03-14"
