subject = "حنا زفت ميلاد او ميلاد هباب حنا الخنزير"
author = "اة"
posted = "2008-11-17"
text = "الواد هيوكلهم وهو مغمض لانة نجس زيهم<br />برضة لما قامت الثورة كانوا قبلها بيقولوا نحن مع راعينا دولة جلالة الملك وفى طاعة مولانا جلالة الملك<br />ولما نجحت الثورة - يقولوا لك الثورة استبعدت النصارى ومفيش فيهم ولا ضابط نصرانى - احنا مضهدين<br />وبيستبعدونا من الوظائف<br />خلوكوا بقرفكم بعيد عنا<br />دايما بتقوموا بدور الطابور الخامس<br />شوية جواسيس كلاب"
