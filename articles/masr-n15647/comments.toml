author = "wa7ed 2ensan"
text = "بصراحه الفيلم جميل جدا وفعلا توثيق لحاجات كتير حصلت في الوطن العربي وعجبني الجزء بتاع قناص تارجيست والجزء بتاع كريم البحيري_ ربنا معاه _ والجزء بتاع خديجه مالك الفيلم بصراحه كويس جدا<br />بس احب اسال البراء اشرف ايه رأيك في رد الفعل بعد الفيلم ؟ ويا ترى في حاجه عن الفيس بوك ولا لا؟<br />شكرا وربنا يوفقك"
archived = "2008-05-09"
