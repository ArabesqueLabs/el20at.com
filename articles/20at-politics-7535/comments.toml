[[comments]]
order = 6
subject = "ابن غزة"
author = "موسى"
posted = "2008-02-21"
text = "سلام الله عليكم جميعا نعم بحب اقول للكاتب انوا فى بعض النقاط مش واضحة ومش حتكون اصلا واضحة لان هذا العمل يتم عن طريق السرية ومش صح انك تكتب اسماء احد الاخوة المرابطين فى قطاع غزة وليس من الصح ان نوضح اكتر فاكثر لان العمل الجهادى يتم بالطرق الخاصة والسرية التامة وبارك الله فيكم اخوانكم فى قطاع غزة ابناء الجهاد والمقاومه ولكم منا الفس لام من جند فلسطين وجند الاقصى والقسام والجهادى والشعبى والفتحاوى وكل شرفاء الوطن الذين يوجهون ظرباتهم للعدو فقط وليس لابناء شعبهم تحياتى ابن قطاع غزة والسلام عليكم ورحمة الله تعالى مع احترامى للكاتب كلنا نقاوم لانوا ابن حماس مش احرص منا للجنه ونعيمها وايظا باقى التنظيمات كلنا نقاتل من اجل الله ومن اجل الدين ولا نفرق بين موتنا وكلنا لها"
archived = "2010-03-14"
capture_url = ""

