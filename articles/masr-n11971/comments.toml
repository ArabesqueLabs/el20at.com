[[comments]]
order = 0
subject = "لاعزاء للسيدات"
author = "بنت مصرية"
text = "اتمنى من كل قلبى ان يحدث هذا لكنى اشك فى ذلك لان هذ الشعب شعب ميت ولا شيىْ يرجى منة<br />اسفة انى بقول كدة واتمنى اكون غلطانة"
