[[comments]]
order = 1
subject = "التاريخ يعيد نفسة"
author = "مصرى"
text = "وسيعيد التاريخ نفسة يا دكتور وسيتكرر حريق القاهرة مرة اخرى كما حدث سنة 1951 وسيحدث نهب فى المدن كما حدث فى بغداد بعد الغزو الامريكى<br />المؤشرات تقول ذلك"
archived = "2007-10-24"
capture_url = "https://web.archive.org/web/20071024111912/http://masr.20at.com:80/newArticle.php?sid=11971"

[[comments]]
order = 2
subject = "حسبى الله و نعم الوكيل"
author = "eman"
text = "ربنا ياخدهم ولاد الكلب اللى مجوعين الشعب و سيبنهم كدة كلهم حيتعلقوا فى رقبة اعضاء الحكومة يوم لقيامة وربنا مش حسامح الظلمة ابدا . لكن المهم ان الشعب دة لازم يفوق من نومتة ويحاول التحرر من اى سلطة ممكن تذلة و تجوعة كفاية حراااااااااااااااااااااااااااااااااااااام ."
archived = "2007-11-24"
capture_url = "https://web.archive.org/web/20071124073418/http://masr.20at.com:80/newArticle.php?sid=11971"
