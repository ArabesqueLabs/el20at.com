subject = "للأسف ضاعت منك الفكرة بالأمثلة دي"
author = "محمد السيد"
text = "ممممممممممم ...<br />الموضوع الفكرة كويسين ....<br />إلا لوتغاضينا إن زلة بابا الفاتيكان مش زلة زلا حاجة ...<br />وتغاضينا إن مبارك مش دي أشهر زلاته ولا حاجة .... في لما قال البتاع ده .... ولما نصح بوتين إنه يطول في الحكم ....<br />وتغاضينا عن إن حوار المرشد ... كان فعلا فيه خروج عن سياقه ... وإنه صلاح الدين و قطز وبيبرس ومحمد علي .. مكنوش مصريين بس حكموا مصر بالحرية والعدل والإسلام فارتفع شأنها بين الأمم ..<br />وإن كمان ... اللي يقرا الحوار يلاقي فيه تعمد إنه يوقع المرشد في أي غلطة ...<br />وتغاضينا إن المثال التاني مكنش تصريح لوكالة الأنباء ولا حاجة ... ده قالها في مؤتمر ....<br />يعني .... الفكرة كانت كويسة ..... بس كان فيه زلاااااااااااااااااااات كتير أكثر من كده كانت ممكنتعمل تحقيق أحسن من كده ....<br />و برضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2010-03-14"
capture_url = ""

