[[comments]]
order = 6
subject = "جميل يا أستاذ بلال"
author = "واحد من الناس"
text = "مقال جميل و معبر انا اصحاب اكبر الزلات والاخطا بالفعل فكل فرد ممن ذكرهم بلال اساء الى دولته او جماعته او المؤسسة التابع لها (وبالفعل اغلبهم اخرجوا ما بداخلهم)اما بالنسبة لبلادنا فان الزلات كانت بالفعل اكتر من كدة زى ما قال الاستاذ محمد السيد بس للاسف للجميع سواء مبارك او المرشد او المفتى (وبالذات مبارك والمرشد) فلا يحكم مصر الا رجل بأختيار الشعب المصرى حتى لو عدنا الى حكم الاستانة فلا يحكم مصر الا رجل باختيار شعبها.اما اذا تكلمنا على ان محمد على وصلاح الدين و عظماء الدولة الاسلامية الذى بنوا فيحسب لهم بالطبع ما قدموه و لكن ماذاحدث بعدهم سقطت الدول الاسلامية واجدة تلة الاخرى لانهم ةكانوا بالفعل مستبدون مستنيرون فجاء بعدهم مستبدون اغبياء اضاعوا ما فعلوه أسلافهم من انجازات (للأسف الديقراطية المفتقدة فى مصر (جكومة واخوان ومعارضة) هى مفتاح كبير من مفاتيح التقدم)...علقت على جزء صغير جدا من أخطاء المرشد لان مبارك والازهر فقد الناس فيهم الامل والرجاء و مبارك مش محتاجين نتكلم عن ذلات اللسان فما فيه مصرنا الحبيبه من خراب يتحمل هو جزء كبير منه لكن مرشد الاخوان المفروض انه مرشد اكبر جبهة معارضة فى مصر(بأعتبار ان فيه فى مصر معارضة سياسية) و كل سنة وانتم طيبين abomehgen@hotmail.com"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "إلى أستاذة روضة"
author = "أحمد بلال"
text = "كل سنة و انتوا طيبين جميعا بمناسبة عيد الأضحى و عيد الميلاد المجيد<br />أ روضة<br />بالنسبة لكلام فاروق حسني هو مكانش زلة لسان, لان الراجل طلع في الفضائيات و اصر انه راي شخصي, و بعدين مكانش في تصريح, كان في جلسه خاصة على حد تعبير الوزير, فبالتالي مقدرتش اكتبه على انه زلة لسان<br />و شكرا :-)"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "زلة مبارك فى روسيا أنتم نسيتوها ولا إيه"
author = "أبو حنين"
text = "عايز أذكركم بذلة لسان شهيرة ثانية هذا العام لمبارك فى زيارته الأخيرة لموسكو حيث أجرت إحدى القنوات التليفزيونية الروسية مقابلة مع سيااااااااااااادته وسألته المذيعة عن تمنيانه للرئيس الروسى بوتين فقال أتمنى أن يحوز فترة رئاسة ثالثة لأن روسيا محتاجه له وبالطبع قامت الدنيا ولم تقعد لأنه كما تعرفون أن الدستور الروسى لا يسمح إلا بفترتين رئاسيتين فقط<br />وأعتبر المحللون السياسيون أن هذا تدخلاً فى الشأن الداخلى الروسى وأن سيااااااااته يريد أن ينقل الفساد والدكتاتورية من مصر إلى روسيا وطبعاً أخذ الرئيس فى الصحف والإذاعات يبرر ذلك بأنها ذلة لسان وأنا فى رايى أنها مش ذلة لسان بل هى إحدى أعراض مرض آلزهيمر الذى يعانى منه الرئيس مؤخراً لكبر سنه فهو الأن فوق السبعين سنة فمعلش يا جماعة ليس على كبير السن حرج .....................زوعجبى"
archived = "2010-03-14"
capture_url = ""

