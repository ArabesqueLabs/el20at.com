[[comments]]
order = 8
subject = "THE BIG STORY"
author = "hassan mohmmed"
text = "لو عدنا للتاريخ ، وبالتحديد إلى بداية التشيع لوجدنا أنهم أساس النكبات في العالم الإسلامي منذ ذلك الحين وحتى وقتنا هذا ، بالطبع لا أتكلم عن شيعة علي بن أبي طالب رضي الله عنه فهم صحابة كرام وقفوا معه وحاربوا معه ومن أجله ، وكما قال عمر بن عبدالعزيز رضي اله عنه عندما سُأل عن تلك الفتن ” تلك دماء طهر الله منها أيدينا، فلنطهر منها ألسنتنا ” ..<br />إن من أتحدث عنهم ، هم الذين يسبون الصحابة ، ويألهون الأئمة ، ويعتقدون بالتقية والرجعة وسائر الخزعبلات والبدع واتخذوا التشيع لآل البيت غطاءاً لهم ..<br />كانت بداية هؤلاء عندما أمر علي بن أبي طالب كرم الله وجهه بحرق الذين رفعوا منزلته لحد الغلو وآلهوه ، ونفى من كان على رأسهم مثير الفتن اليهودي عبدالله بن سبأ إلى بلاد فارس ..<br />وهناك ، قام ابن سبأ بإكمال ما بدأه من محاولة زعزعة للأوضاع وإثارة للفتن ، وذلك بنشره للتشيع لآل البيت هناك ظاهراً والبدع باطناً ، وقد ساعده على نشر التشيع في فارس عدة أمور منها :<br />- يعتقد المجوس هناك بالحلول - حلول الله في جسد بشر - وتناسخ الأرواح نسبة إلى أديانهم القديمة لذلك كان تقبلهم لفكرة أن علياً هو الله كبيرة جداً ..<br />- أديان المجوس القديمة - الزرادشتية والمانوية وغيرها - كانت تتمحور حول تقديس قبيلة معينة على آنها ظل الله في الأرض ، لذلك كانت دعوتهم إلى تقديس آل البيت سهلة كذلك ..<br />- زوجة الحسين رضي الله عنه - شهربانو - هي إبنة يزدجر الفارسية ، فـساعد ذلك كثيراً على التعصب لآل البيت بسبب المصاهرة ..<br />كانت هذه هي العوامل التي ساعدت على إنتشار التشيع في فارس ، وظهور المذهب الشيعي المحرف والذي لا يزال موجوداً في وقتنا هذا ، وبداية مسلسل النكبات المجوسية/الرافضية على بلادنا الإسلامية والتي سأوردها باختصار :<br />- قبل ذلك كله ، فإن إغتيال الخليفة عمر بن الخطاب رضي الله عنه كان على يد المجوسي أبو لؤلؤة ، ويحتفل الرافضة كل عام يوم مقتله بعيد إسمه ( عيد بابا شجاع الدين ) ويقول الملا باقر في كتابه زاد المعاد في حديث صنعوه بأنفسهم ” أن الله كلف الملائكة الذين يكتبون الأعمال بأن يتوقفوا عن كتابة الذنوب لذلك اليوم وثلاثة أيام بعده ” إنتهى<br />أي أنها إجازة مفتوحة للفسق والفجور ككل بدع الشيعة ! ..<br />- ثم نمر بسرعة على الشيعة - من غير الصحابة - الذين غدروا بعلي كرم الله وجهه وانفضوا عنه وعن الحسين من بعده !<br />- وظهر بعد ذلك أبو مسلم الخراساني ( الفارسي ) الذي كان أسقط حكم بني أمية عام 129 ، وانقلب على العباسيين عام 137 وقتله الخليفة العباسي المنصور . ( أحتاج لمزيد من التأكد من هذه النقطة )<br />- ثم ظهر بعده عدد من مؤيديه والمطالبين بدمه - ابو مسلم - مثل المجوسي سنباذ 138 ، والرواندية 141 ، ومدعي حلول روح أبو مسلم فيه ” المقنع ” 161 والذين حاربوا كلهم بني العباس .<br />- وظهر بعدهم البرامكة - نسبة إلى جدهم برمك خادم معبد النار في بلخ - وأظهروا الزندقة فقتلهم الرشيد عام 187 كما يقول ابن كثير .<br />- وظهرت بعد ذلك الفتنة العظيمة بين الأمين والمأمون ، وكان وراء المأمون الفرس لأن أمه - مراجل - فارسية فأثروا عليه وعلى عقيدته وكان ذلك واضحاً بشدة في فتنة خلق القرآن التي راح ضحيتها الكثير على رأسهم الشيخ أحمد بن حنبل رحمه الله بسبب أفكار المجوس !<br />- ثم بدأو بنشر الزندقة والفكر الإلحادي ، وساعدوا طاهر بن الحسين ( قاتل الأمين عام 198 ) على الإنشقاق على المأمون والخروج عليه فاستقل بخراسان .<br />- وظهر القرامطة عام 278 ، ونادوا بالتشيع لآل البيت والرجعة وبطلان ما عليه ملة محمد صلى الله عليه وسلم كما جاء في رسالة القرامطة لابن الجوزي ، وأقاموا مذبحة كبيرة في مسلمي الكوفة سنة 293 ، واعترضوا قافلة حجاج وقتلوا الرجال وسبوا النساء في 294 ، ثم أقاموا مذبحة أخرى في البصرة في السنة ذاتها ، واحتلوا حرم مكة وقتلوا الحجاج وسرقوا الحجر الأسود في 317 الذي بقي لديهم حتى 335 ، ونشروا البدع في كل مكان ومنها دار الصفوة في اليمن الذي هو كبيوت المتعة في إيران حالياً ، حتى قضى عليهم عبدالله بن علي عام 466 وتفرقوا واتخلطوا بفئات أخرى من الشيعة كالإسماعيلية والنصيرية .<br />- واستولى البوهيون - أسرة فارسية من نسل سابور - على العراق عام 334 وصار الخلفاء في تلك الفترة لعبة في أيديهم ، فخلعوا المستكفي بالله وجاؤوا بالفضل بن المتقدر - المطيع لله - ونشروا عقائدهم المجوسية تحت غطاء التشيع لآل البيت فأقلغوا الأسواق في عاشوراء 352 وأقاموا القباب وخرج الرجال والنساء يلطمون وينيحون على الحسين لأول مرة في التاريخ وأصبحت تلك البدعة الأن تقليدياً ومناسبة دينية مهمة لكل الشيعة ، هذه البدعة البوهية الفارسية المجوسية !!<br />- وسافر إلى المغرب عبدالله بن ميمون القداح - مجوسي من الأهواز - ونادى بالتشيع لآل البيت هناك وكانت تلك بداية الدولة الفاطمية في المغرب - نسبة إلى فاطمة الزهراء - عام 296 التي احتلت مصر عام 358 ، ومن أبرز حكامها - الحاكم بأمر الله - الذي إدعى الألوهية وبث الدعاة لنشر عقائد مجوسية كالتناسخ والحلول ، وزعم أن روح الله انتقلت لآدم عليه السلام ، ومنه إلى علي رضي الله عنه ، ومن علي إليه !<br />وظل الفاطميين الشيعة يعيثون فساداً حتى قضى عليهم صلاح الدين في مصر والشام عام 568 ليعيد هذه الأراضي للدولة العباسية ، ومن مخلفات الدولة الفاطمية ظهر الدروز في لبنان التي أنشأها الداعية المجوسي حمزة بن علي الزوزوزني - زوزون مقاطعة في فارس - .<br />- وفي عام 656 أسقط هولاكو الخلافة العباسية بمساعدة وزيره الفارسي - نصير الدين الطوسي - وخيانة وزير المستعصم بالله - الشيعي ابن العلقمي - الذي فتح أبواب بغداد لـ هولاكو !!<br />- ثم ظهرت الدولة الصفوية في فارس سنة 906 على يد إسماعيل الصفوي ، الذي أعلن أن الشيعة هذ دين الدولة وحارب السنة وقاتلهم في فارس كلها .<br />- و في 996 تولى الشاه عباس الصفوي الحكم ، والذي كان من أشد أعداء الدولة العثمانية - المسلمة - وحول حجاج إيران من مكة إلى مشهد وحج بنفسه إلى هناك سيراً على الأقدام إلى ضريح الإمام علي الرضا ( بن موسى بن جعفر بن محمد بن علي بن الحسين بن علي بن ابي طالب رضي الله عنه ) .<br />- وانتهت الدولة الصفوية عام 1135 على يد الأفغان والعثمانيين ، وحكم بعده الأفشار الشيعة ، والقجار الشيعة الذين استمروا في التنكيل بالمسلمين ، حتى حكمته أسرة بهلوي عام 1344 ..<br />- وخلال تلك الفترة ظهر البهائيون في إيران وهي خليط من اليهودية والمجوسية ولكن تحت غطاء التشيع .<br />- وأما النصيريون الذين ذكرناهم وكانوا في الشام فنشروا فيها بدعا على غرار تناسخ الأرواح وإنكار البعث - البعثيين - وكانوا سبباً في إحتلال النصارى للشام وبيت المقدس لمساعدتهم لهم ، وكانوا خير عون لـ فرنسا بعد ذلك ، ولا يزالون في سوريا حتى الأن ..<br />- وأما الدروز - في لبنان - فـ لفساد عقائدهم لاقوا كل ترحيب من الإنجليز ذلك الوقت وكل مساعدة ، ويعمل عدد كبير منهم حاليا في جيش الإحتلال الإسرائيلي ، وجزء منهم يحرسون الحدود اللبنانية الإسرائيلية لصالح الصهاينة ، وفي حرب 1967 م ذاق المسلمون في الجولان والأردن الويلات منهم ، وكذلك في حرب 1973 حوكم كثير منهم وأعدموا ، وهم على إتصال دائم بالصهاينة ويحلمون بإقامة دولة لهم في الجولان<br />- وقامت ثورة الخميني في 1399 التي زعم أنها إسلامية ، ولكن ما إن أستتب الأمر حتى بدأ في قتل وتعذيب المسلمين السنة في إيران ، ومن يراجع كتب الخميني ومقابلاته في مجلة الكفاح في المنفى يتأكد تمام التأكد بأنه كاذب فيما يدعيه !<br />كانت هذه باختصار شديد لمحة سريعة على أحداث التاريخ ، أمور كنت أنا نفسي أجهلها ولا أعرف عنها شيئاً حتى فترة قصيرة للغاية ..<br />والمتابع الفطن لهذه الأحداث ، يتأكد تمام التأكد بأن أغلب نكبات العالم الإسلامي جاءت من وراء الرافضة الفرس المجوس ، وتحت غطاء التشيع لآل البيت ..<br />ولا يخفى على أحد ما يدور حالياً في إيران نفسها من مضايقات شديدة للمسلمين السنة ، وفي العراق من قتل وتعذيب وتمثيل بالمسلمين السنة ، وفي جنوب لبنان تلك المنطقة التي يخشى اللبنانين دخولها خوفاً من الشيعة هناك ، ثم مؤامرة حزب الله الشيعي التي أدت إلى خراب لبنان ..<br />ولا ننسى طبعاً شيعة السعودية في مظاهرات عام 1407 في أقدس البقاع - مكة المكرمة - وأقدس الشهور والمواسم وأشدها حرمة - شهر الحج - .."
