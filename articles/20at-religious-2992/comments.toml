[[comments]]
order = 11
subject = "يا حسان قتال الاثيوبين اولي من تكفير الناس"
author = "محمد سالم"
text = "ياسيد حسان كلمة الحق خرجتامن لسانك عندما قلت انه لا يوجد سنه ولا شيعه في الاسلام....فلماذا تكفر من يقول لااله الا الله محمد رسول الله.........وانا عندما ذكرت السعوديه لم اقصدها كبلد وانما قصدت المنهج المتطرف الذي يري انه الحق المطلق الذي لا حق غيره....والذي كرس ادواته لتفتيت المسلمين ولبث الحقد والكراهيه والفرقه بين المسلمين.........الخلافات السياسيه حولوها الي صراعات طائفيه ليحققوا اهدافهم الدنيويه والتي لاعلاقه لها بالاسلام بل لها علاقه ببقائهم في الحكم وسرقه اموال الشعوب وتنفيذ رغبات المحتل.............انا ضد العملاء سنة كانوا او شيعه.... ومع المقاومه للمحتل سواء جاءت من سنه او شيعيه .....بعيدا عن كل السجالات الطائفيه<br />علي فكره نسيت اقولك حاجه ...انت كمان كانت افتراضاتك خاطئه في بعض الامور ...لانني مسلم سني ولست شيعيا كما توقعت لكني اكره الطائفيه ...وهي اخطر مايمكن ان يهدد امتنا الاسلاميه"
archived = "2010-03-14"
capture_url = ""
