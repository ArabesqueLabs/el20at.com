author = "العربي الحر"
text = "لست اخفي سرآ انشدادي لعنوان الموضوع ولكن اثار استغرابي فحواه فالكاتب العزبز مع دق نواياه لا ينظر الة الشيعة كلهم الا في كفه واحده وكانهم نسيج واحد متوزع بانحاء العالم ومركزيتهم تعود لايران وهذا غبن واضح وان لم يقل الكلام بصحيح العبارة فقد اوصل الرسالة وفهمنا فحواها. عام 2007 عام المسلين بغض النظر عن انتمائهم وفكرهم ومذهبهم.<br />الحق للجميع في مشاركة العالم انتصارات حزب الله وتفوق ايران وقريبآ بعون الله استقرار العراق وحكومة مستقلة ووطنية بغظ النظر عن اوصول وعفائد الحكومة فالمهم مصلحة الوطن بلا طائفية ولا عمالة للغرب وامريكا."
