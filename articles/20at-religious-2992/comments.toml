subject = "الأخوة الشيعة زودوها قوى"
author = "mego"
posted = "2007-01-16"
text = "بصراحة لما نتكلم عن الشيعة مش طائفية واللا حاجة احنا طول عمرنا ما عرفنا الفرق بين الشيعة والسنة ولا حطينا فى دماغنا الكلام ده قبل غزو أمريكا للعراق بل بالعكس احنا اتعاطفنا معاهم فى مواقف كتير (ومش ندمانين) ذى ملف إيران النووى وحرب لبنان الأخيرة اللى ماكنش لها داعى من الأساس وباعترف ان حزب الله حقق فى الحرب الأخيرة اللى غيره ماقدرش يحققه -طبعا على حساب أرواح الأبرياء- لكن كل شئ وله حدود والشيعة دول لو تمكنوا هيبهدلونا بجد مش هزار بالإضافة إلى اتخاذهم البدع عقيدة وغير كده وكده بلاش تتكلموا عن كوننا نحن السنة طائفيين بالعكس كفاية العبارات الطائفية اللى رددها الشيعة لحظة إعدام صدام مما يدل على إضمارهم العدواة والبغضاء للسنيين ولم يرددوا مثلا عبارات مثلا يفهم منها أنهم يريدون مصلحة العراق .. وبعدين يا سيدى قبل ما تتحمئوا الأول على الشيعة - اللى هموا بالفعل ولائهم لإيران والريس ما غلطش ولا حاجة لما قال كده - اتفرجوا على قنوات البث الطائفى اللى بتطلقها الشيعة وكفاية الأول عمليات الارهاب اللى بجد بتقوم يوميا ولحظيا فى العراق والاضطهاد الحقيقى للسنة العراقيين .. عموما ده كان رأى الشخصى واحترم اى رأى مختلف.."
archived = "2010-03-14"
