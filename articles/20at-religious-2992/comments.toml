text = "من وقف ضد الدولة العثمانية وحاربهم المصريين في عهد محمد علي ومن ثار ضد العثمانيين هم العرب ومنهم الامير عبدالله الاول وهو اردني والعثمانيين كانو ينهبون البلاد العربية ويجمعون الضرائب ولا تنسا الاسطور البحري الامريكي في بحر المتوسط عن مياة مصر وفتح مصر قناة السويس لتعبر السفن الحربية الامريكية والاوروبية لضرب بلاد المسلمين انا لست وهابي بس لايوجد فرق وهم من اهل السنة ولاتدخل الحكام بلشعب او المذاهب<br />والشيعة هم من يلعنون الصحابة ليل ونهار ويظنون بذالك يتقربون من الله وغير قتل وتهجير اهل السنة في العراق"
