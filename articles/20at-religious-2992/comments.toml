subject = "بل انتم اصل النكبات يا وهابيي"
author = "محمد سالم"
text = "والله يا وهابي ياللي فوق انتم ايها الوهابيين اصل كل النكبات والفتن والشرور<br />الستم انتم من وقفتم مع الانجليز ضذ الخلافه الاسلاميه العثمانيه ....وبعد ان كنتم خدما لالانجليز اصبحتم خدما للامريكان<br />تتباكون علي العراق واهله فلماذا سمحتم ان تنطلق الجيوش الامريكيه من السعوديه وقواعدها....ولماذا قدمت السعوديه كل الدعم اللوجيستي والمادي للقوات الغازيه<br />كفاكم نشرا للفتن وللطائفيه ايها المنافقون"
archived = "2010-03-14"
