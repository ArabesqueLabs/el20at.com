[[comments]]
order = 3
subject = "كفانا طائفية"
author = "أحمد بلال"
text = "الزميل العزيز مجاهد شرارة<br />أعتقد أن العنوان الذي كان يستحق الكتابة فيه هو هل يكون 2006 عام العرب بدلا من أن تقول هل يكون عام الشيعة, كفانا طائفية يا زميلي العزيز قد تكون كتبت الموضوع بحسن نية, و لكنك تستطيع على الأقل أن تحدد من التعليقات التي أتوقع أن يكتبها البعض هنا ما الذي سيفعله مقالك في نفوس الكثيرين و هو على الأقل انقسام إلى سني و شيعي, و كل منهم يدافع عن مذهبه, بدلا من أن يدافع عن انتصار المقاومة العربية في لبنان و التي لم نحس في لحظة واحدة أنها كانت مقاومة شيعية أو سنية. فقط كانت مقاومة لبنانية عربية إنسانية شريفة.<br />ما تقوله يا زميلي العزيز عن فشل عملية \"الوعد الصادق\" كلام غير صحيح بالمرة, فعملية الوعد الصادق كان المقصود بها اختطاف جنديين لمبادلتهما, و ليس معنى التأخير في المبادلة هو الفشل, و لعلك لا تعرف حجم الجحيم و المشاكل التي تواجه الحكومة الصهيونية من جراء استمرار خطف الجنديين, أما عن الحرب على لبنان فلم تكن هدفا لحزب الله, و إنما كانت دفاع عن الوطن, و هذا هو الهدف, و قد تحقق بالفعل, و لعلك أيضا لا تعرف مدى الانقسامات داخل الجيش الصهيوني الآن و مدى الانقسامات بين الحكومة الصهيونية و الجيش الصهيوني, و ما أقوله ليس من العنتريات و التغني بالأمجاد و إنما نتيجة متابعة يومية للصحف الصهيونية.<br />\"الوعد الصادق\" كان وعدا تحقق لحقيقة ملموسة, و عملية تبادل الأسرى ستتم إما عاجلا أم آجلا و هي ليست المرة الأولى التي يتم فيها تبادل أسرى بين حزب الله و الكيان الصهيوني و للعلم حزب الله لا يطالب بثلاثة أسرى فقط, بل يطالب بعدد كبير من الأسرى العرب, و على رأسهم المناضل الناصري المسيحي (أعتذر عن ذكر الدين و لكن ذلك فقط للتوضيح) سمير القنطار الذي أسره كيان العدو في عملية حملت اسم الزعيم جمال عبد الناصر, و من قبله في عملية مبادلة أسرى تم الإفراج عن المناضلة الشيوعية سهى بشارة (مسيحية) و أعتذر أيضا عن ذكر الدين فما يهمني هو الإنسان الشريف, حزب الله لا يطالب بالافراج و لا يدافع عن الشيعة فقط يدافع عن كل شريف.<br />أما عن فوز شيعة في البحرين فيا زميلي العزيز هم بحرينيون دخلوا الانتخابات على هذا الاساس و ليس على اساس انهم شيعة ؟ أم أن الديمقراطية في وجهة نظرك هي فوز السنة فقط, ثم أنني أرى برنامجهم الانتخابي برنامج يتحدث عن البطالة و الأجور و العمل و المهمشون و غيرها من النقاط الايجابية و هي ما ستعم على الشيعة و السنة و كل بحريني أيا كان دينه.<br />أعتذر للاطالة زميلي العزيز و لكن هناك ملحوظة بسيطة هي أنك ذكرت في بداية تقريرك \"منطقتنا العربية\" و لم تقل منطقتنا الشيعية و لا السنية و لا المسيحية و لا اي دين أو مذهب, فقط قلت العربية و تلك هي الحقيقة.<br />و شكرا لك"
