text = "دائما بيكون هناك بصيص من النور تضئ ظلام الليل مثل خيط الفجر ومع مرور الوقت ومع إصرار الفجر علي الظهور يتوارى الظلام خجلا امام نوره ليظهر يوم جديد كله اشراق وانتم يا أولاد البلد شعاع ضوء سيبدد الظلام الموجود ليظهر فجر يوم جديد وإن غدا لنظاره قريب<br />وفقكم الله"
