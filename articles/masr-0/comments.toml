text = "شوفو يا ولاد البلد أنا معاكم فى حب البلد منين ما تروحوا أو تيجم أنامعاكم فى حب الوطن معاكم فى العمل على تأصيل وطنيتنا على رجوعها إلى عزيمتنا وكسر كل يد تحاول كسر إرادتنا إحنا ولاد البلد معكم وتعيشى يا فرحة مصر وتعيشى يا ضحكة مصر وتعيش ذكراك يا من فديت بروحك مصر ورويت بدمك عصر الكرامة والنصر مش ناسيك أبدا مش ناسيك يا بتاع 48 و56 و73 أبدا مش ناسيك يلى رحت علشانى وعلشانهم وعلشان كل ألى عايشين دلوقتى متنعمين أبدا مش ناسيك وتعيشى يا فرحة مصر وتعيشى يا ضحكة مصرأنا منكم يا ولاد مصر أنا واحد من ولاد البلد"
