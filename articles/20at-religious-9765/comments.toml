posted = "2008-08-26"
text = "بدايةً أشكرك أختي ( منى سليم ) على هذا المقال الرائع، لا بل أكثر من رائع ..<br />الزهد شيء جميل أن يعيش الإنسان ويحيا به طوال عمره .. وأنا ما أتحدث عنه هو (( الزهد المعتدل )) .. وليس (( الزهد اللاطعقول أو \\\" الطاغي \\\" )) ..<br />أرجو أن أكون من الزاهدين دنيا وآخره .. وكذلك الجميه - بإذن الله - ..<br />وفقك الله أختي ..<br />تقبلي مروروي ..<br />محمد نواف .."
