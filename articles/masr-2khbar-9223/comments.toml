[[comments]]
order = 5
subject = "منظمات اقباط المهجر هي المسؤولة عن الاعتداء على ال"
author = "مش كاتب"
posted = "2008-06-01"
text = "اؤكد لكم ان كل هذه العمليات الاجرامية وراءها اقباط المهجر ونخص بالذكر المجرم عدلي ابادير والمجرم مايكل منير دول زعماء عصابات اقباط المهجر<br />والسبب هو<br />ان اقباط المهجر دول شوية حرامية وعايشين على جمع التبرعات من المسيحيين الغربيين والاعتداء على الاقباط هي الفرخه اللي بتبيض بيضة دهب كل ما يحصل اعتداء على الاقباط يصوتوا ويعيطوا للغربيين ويجمعوا تبرعات بالملايين<br />فاقباط المهجر هما اللي وراء الاعتداءات على الاقباط<br />واريد ان اتساءل فيه واحد اسمه ممدوخ نخلة مرة لقيته في موقع الاقباط متحدون عامل احصائية بتواريخ الاعتداء على الاقباط ولاحظت حاجه ان كل الاعتداءات في عهد البابا شنوده فقط<br />يعني المصلمين دخلوا مصر من 1400 سنه ويعيشون مع الاقباط<br />لم تسجل حالة اعتداء ضد الاقباط من قبل المسلمين لما في العهد المشئوم للبابا شنوده<br />اتحدى اي جهة لو تجبلي واقعة اعتداء حصلت على الاقباط قبل البابا شنوده الثالث"
archived = "2010-03-14"
capture_url = ""

