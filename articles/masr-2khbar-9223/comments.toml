subject = "غالبية المصريون قبل الاسلام كانوا موحدون واقرأوا ا"
author = "فرعونى موحد باللة من ايام اخنا"
posted = "2008-06-01"
text = "اية حكاية المسلمين والاقباط - احنا اسلمنا لاننا طوال عمرنا موحدين والاسلام قريبا جدا من دين اجدادنا ولا ننسى ان سيدنا ادريس مصرى من النوبة ويدعوا الى عبادة الرب الواحد<br />انما الاقلية المصرية المتأثرة بالرومان بتوع التثليث الام ايزيس والاب ازوريس والابن حورس وهؤلاء كانوا اقلية معدومة مثلما هم الان<br />الذين حرفوا ايزيس الى مريم والرب الى ازوريس وحورس الابن الى يسوع<br />نحن المسلمين اولاد الفراعنة الموحدون اتباع رع وامون<br />واهل التثليث بقايا الرومان والديانات الوثنية القديمة<br />وعمرو بن العاص دخل مصر بخمسة الاف فرد وكان تعداد مصر 5 مليون انسان"
archived = "2010-03-14"
