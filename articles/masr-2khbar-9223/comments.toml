subject = "اتمنى ومن كل قلبى ان الاعمال الاجرامية دى تبقى جنا"
author = "سحس كينوود"
posted = "2008-05-31"
text = "ياريت حكومة السرقة والتزوير تدى شوية اهتمام لامن الناس بدل مهيا مشغلة كل الطاقات الامنية لحماية النظام وسايبة امن الشارع لان البلطجة والسرقة بتحصل على كل المستويات ان كان سرقت شعب اوسرقة مواطن قاعد بيسترزق فى دكانة وقتلة لازم تعرف الحكومة والقريب والبعيد ان الاقباط جزء مهم من النسيج المصرى وبكدة مش حتقدر اى قوة فى العالم تاثر بينا اوتفرق بينا كمسلم اومسيحى لان الدين للة سبحانة وتعالى وكل واحد يعبد ربنا بالطريقة والمعتقد الى هو شايفة صح انما مصر فالينا كلنا احنا واجيالنا القادمة اللى حتغير الوضع الماساوى اللى عايشين بية بقالنا كتير بعيد عن اى عصبية دينية او غيرة"
archived = "2010-03-14"
