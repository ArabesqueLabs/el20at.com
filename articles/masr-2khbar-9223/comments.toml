subject = "لماذا الاقباط متأقبطين"
author = "مش ناقص"
posted = "2008-06-01"
text = "لماذا الاقباط متأقبطين<br />يعني ليه مسميين نفسهم اقباط وعاملين نفسهم اقباط<br />ومين اللي غرز فيهم هذه العنصرية<br />مع انهم بيتكلموا عربي والانجيل بتاعهم بالعربي<br />لماذا مسميين نفسهم على اسم احد اللغات المصرية القديمة<br />يا اقباط بطلوا هبل وعبط بأه وسيبوكم من التهريج"
