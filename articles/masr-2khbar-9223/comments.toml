text = "ادعوااللة ان يرحم الموتى ويشافى المصابين ويجبر مصيبة المفجوعين من الحوادث البشعة اللى الهدف منها مش مسلم اومسيحى انما العبث بممتلكات المواطنين وارواحهم فى غياب ونوم عميق من الحكومة المنهمكة فى امور الاستثمار والفلوس اللى مشفناش منها غير الجلدبسياط الغلاء والقوانين المجحفة بحق البنى ادميين"
