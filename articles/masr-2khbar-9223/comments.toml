order = 0
subject = "ليرجعوا الى قراهم فى الصعيد - ذلك افضل لهم"
author = "مخيمر الصعيدى"
posted = "2008-05-31"
text = "تلاحظ ظاهرة غريبة بين الاقباط لا احد يدرى اسبابها - هل هو الصراع على جمع الاموال والثروات بأى طريقة<br />تلاحظ انهم تركوا مهنة الاجداد اللى هى الزراعة وبدأوا من قراهم والنجوع فى اعماق الصعيد يبيعون الطين والارض ويجمعون اموالهم ويتجهون الى القاهرة والاسكندرية ويدفعون فى دكان صغير خلو ارض مبالغ هائلة من اجل ان يفتح دكان عصير قصب - وهناك ظاهرة ان معظم بتوع عصير القصب اصبحوا من الاقباط<br />والموسرين منهم اكثر يفتحون محلات لبيع مشغولات الدهب - اى يبحثون عن الشغلة السهلة اللى بتجيب عائد كويس<br />وطبعا محلات الدهب فى ظل المجاعة التى تعيشها البلاد تعتبر حلم الحرامية والهجامين - وبما ان الاقباط لا يحبون العنف وبمجرد ما يشوف سكينة هيغمى علية ويدفع الفلوس فهم صيد سهل للحرامية<br />العملية مش اقباط ومسلمين - العملية هى البطالة والفقر والمجاعة - يعنى الناس مش لاقية رغيف العيش وعايزة تاكل وتشوف واحد معاة ملايين فى الدرج ويسكت<br />كل واحد يحمى نفسة<br />يشترى حتة سلاح ويحطها فى العربية او فى الشقة<br />الجوع كافر<br />والشرطة مش لحماية الشعب - الشرطة لحماية الكبير والست وبتاعتة وابنة وبعد كدة تنحرق البلد<br />مظاهرات المحلة - الدولة خصصت لها 100 الف عسكرى<br />والسجون مليانة 18 الف معتقل سياسى بدون محاكمة ومفيش خرم ابرة فاضى فى السجن"
archived = "2010-03-14"
capture_url = ""

