subject = "طب ما ترجع انتا يا مخيمر ياصعيدي يا طائفي"
author = "د. أحمد حسن"
posted = "2008-05-31"
text = "يعني ده التعليق اللي ربنا قدرك عليه يا اخي؟ ولما انتا ناصح كده ليه ما بعتش الطين ورحت عملتلك دكان وجمعت اموال طائلة ولا ناقص مخ؟؟ يا اخي طيب ما ترجع انتا بما انك مخيمر وكمان صعيدي! احنا بصراحة زهقنا من وجود امثالك في المدن، انتا يدوب تعيش ورا الجاموسة"
