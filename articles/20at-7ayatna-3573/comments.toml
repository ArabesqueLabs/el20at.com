subject = "ضع عنوان التعليق"
author = "بدأت في التناقص"
posted = "2007-04-12"
text = "السلام عليكم، أخي الكريم (ع.ت)، كما عهدت في الجريدة الورقية، أو عبر هذا الموقع المحترم، فإنك لا تأتي إلا بالأفكار النيرة، والرائعة، فأسلوبك رائع، وفيه حبكة صحفية رفيعة.<br />لكن، نحمد الله عز وجل أن كثيرا من هذه العادات بدأت في التقلص، والاندثار بحمد الله.<br />تحياتي الأخوية<br />عبد الغني"
