text = "السلام عليكم موضوع جميل يحمل غرائبيات وعادات عجيبةن يحفل بها الوطن العربي والمطلوب ان ينصح الناس بالابتعاد عن هذه العادات البعيدة عن روح الاسلامن حتى لا يقع احدنا في الشركن وسدد الله كاتب المقال"
