subject = "مشى بوش اتى اوباما - الكل ماشى وبينفذ نفس الخطة بت"
author = "زعبولا والا شعبولا"
posted = "2008-11-09"
text = "اوباما زى بوش زى كلينتون الكل بينفذ سياسة دولة محطوط لها خطة ولازم يمشى عليها - مش زينا كل واحد بيدير الدولة كانها تركة ابوة الخاصة<br />عبد الناصر قلبها من اقطاعية راسمالية الى اشتراكية وتماثيل على الترعة وبمزاجة وبدون راى لاحد<br />والسادات حولها هو الاخر وبمزاجة من اشتراكية الى انفتاح السداح المداح وغير صداقة الروس لصداقة الامريكان ودخن البايب وعمل نفسة رجل انفتاحى وحط جنب اسمة رجل العلم والايمان وبعدين قلبها لرجل الحرب والسلام<br />ومبارك سابها تمشى زى ما هى عايزة وقال لك اقتصاد السوق والعولمة والسمسرة<br />الشعب الامريكى ماشى على سياسة واحدة<br />يبقى زعبولا بيحلم باية<br />فاكر اوباما دة هيبقى عمدة كفر البطيخ والا محافظ السويس<br />يا عالم ريحوا نفسكم شوية ومتضحكوش العالم عليكم"
archived = "2010-03-14"
