subject = "رئيس امريكا هو الظابط والرابط حاكم العالم"
author = "laweryasser@yahoo.com"
posted = "2008-11-10"
text = "اولا اشكر المجتهد الشاعر اسلام بيعبر عن رائيه من خلال فنه<br />ثانيا لوكان امريكا ماشيا على كاتلوج معد مسبقا زى مايروج الميؤسين مكنش يبقى ف رائيس ولا انتخابات<br />ولا حتى الشعب انتخب وريحوا دماغهم زى مالعرب بيعملوا انا بقول للى بيقولوا كده اسالوا نفسكم لو كان رئيس غير بوش كان حارب العراق؟ استحاله بدليل كلينتون رفض ان يدخل العراق طيل فتره ولايته ,,,ازا هنا الرئيس ليه الشرعيه ان يتخز اى قرار وازا ايا من المجالس سواء شيوخ ولا نواب اتفقوا على شيئ مش عاجبه, فالرئيس حق الفيتو (يعنى رئيس امريكا هو الظابط والرابط)"
archived = "2010-03-14"
