subject = "احنا اللى رخصنا نفسنا"
author = "مصراووووووووووووووووووووى"
posted = "2008-08-12"
text = "حسبى الله ونعم الوكيل<br />احنا اللى رخصنا نفسنا , المواطن المصرى لكرامة ولاقيمة له فى بلده , فكيف تريد ان يحفظ كرامتنا من هم اقل من المصريين شئنا , فلوس النفط جننتهم لاهم لهم فى الدنيا الا الأكل والسيارات والنساء,<br />احنا اللى خلينا رعاع العالم العربى يركبونا<br />-كانت اللى داست سواق التاكسى بالشيروكى فى ميدان طلعت حرب نالت جزائها-<br />بس اللى يسكت عن حقه يستاهل ياخد بالجزمة كمان , لكن لو جربت ترمى طوبة على اللى فى الحنطور ولا صاروخ ببريزة , هيفكر مليون مرة قبل ما يرمى حاجة تانى"
archived = "2010-03-14"
