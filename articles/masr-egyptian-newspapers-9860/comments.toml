order = 1
subject = "كانت القاهرة عاصمة المدن - اصبحت بجانب دبى وابو ظب"
author = "شايف"
posted = "2008-08-13"
text = "التخطيط العمرانى والجمالى لمدينة القاهرة ساذج جدا يقوم بة مهندس فى المحافظة قروىطة جدا قادم من جنب الساقية والمحراث او ضابط سابق فى الجيش قادم من معسكرات الصحراء جلف فى تصرفاتة فظ فى معاملاتة<br />اما المدن الجديدة فى الخليج فتقع كلها على شواطىء الخليج ولها كورنيشات رائعة منقولة حرفيا بواسطة شركات من مدن سيدنى فى استراليا او لندن حيث الخضرة والاشجار والحدائق ونوافير المياة والجمال الاثر والاخاذ<br />نحن يا سيدتى نسلى السائحين بالحنطور وكاننا فى قرية او عزبة<br />بينما القاهرة من الشمال من ناحية وراق العرب وجنوبا بعد حلوان الاف مصانع الطوب الاحمر التى تحرق الاف اطنان المازوت تبث الادخنة وتلوث الجو وتعمل سحابة دخان رهيبة يصر اللواءات انها قادمة من حرق قش الارز فى القليوبية والشرقية<br />ان التجميل فى العاصمة مفقود<br />اصبحت قرية كبيرة جدا مملوءة بجيوش البطالة واطفال الشوارع<br />وحتى الاضاءة فى شوارع القاهرة باهتة وفقيرة وضعيفة جدا ولا تقارن باى اضاءة مبهرة فى مدن الشرق الاوسط<br />اخرجوا الى البلاد حواليكم وشوفوا مدنهم وبعدين قارنوا وشوفوا قدر اية احنا رجعنا لوراء<br />ايها السادة حال مدينتنا اصبح صعب جدا"
archived = "2010-03-14"
