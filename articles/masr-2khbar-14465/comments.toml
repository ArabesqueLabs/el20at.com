text = "حاكم دولة الامارات الشيخ زايد علية رحمة اللة كان بيركب سيارتة بنفسة ويسوق بنفسة ويلف فى الشوارع وخلفة سيارة واحدة للطوارىء وكان بينزل يسلم على الناس ويسالهم عن احوالهم وكذلك اولادة من بعدة وجميع حكام دول الخليج - علشان كدة ارتقوا بسرعة<br />انما اللواء اركان حرب المحافظ الزبالة بتاع بورسعيد بيصرف الملايين علشان احتمال سيادتة يمر وممكن يخاف ويركب طيارة هيلوكوبتر"
