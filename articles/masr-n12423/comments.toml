text = "أحلي موضوع قريته في حياتي عن العنوسه....<br />المشكله في مجتماعتنا العربيه دي ..مش في مصر و بس ...لازم الوحده مننا تكون علي ذمة راجل عشان المتجتمع يعترف بيها كانسانه و كبني ادم متكمل في حد ذاته .... هي دي المشكله...<br />بس زمنا غير زمن بابا و ماما ...اللي كانو يتجوزو بدري اوي... احنا عندنا دراسه و بكالوريوس و ساعات كمان ماجستير و حجات تانيه...<br />احنا عندنا غلاء في المعيشه و ولاود و بنات معتمدين علي اهلم في الانفاق...<br />احنا ولاد و بنات متدلعين و خايفين من المسؤليه ...<br />فعشان كده بتأخر مقارنه فيهم...<br />بس يا بنتي انا بهنيكي علي روحك المرحه دي ..لان ساعات كتير بنات بتتكئب من كتر الزن علي دماغها من ورا الموضوع ده... و يا رب يا رب تتجوزي و تخلفي وتقولي لنا عن مشاكل الجواز...<br />ربنا يوفقك!!"
