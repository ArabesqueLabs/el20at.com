subject = "دعاء تيسير الزواج رائع جدا"
text = "دعاء تيسير الزواج رائع جدا<br />هدا هو الدعاء<br />اللهم زدني قرباً إليك..اللهم زدني قرباً إليك..اللهم زدني قرباً إليك..اللهم اجعلني من الصابرين..اللهم اجعلني من الشاكرين..اللهم اجعلني في عيني صغيرا.. وفي أعين الناس كبيرا... .اللهم اغفر ذنبي وطهر قلبي وحصن فرجي...اللهم سخر لي زوجا صالحا..اللهم جمله في نظري وجملني في نظره.... يا أرحم الراحمين..يا ذا الجلال والإكرام...اللهم آمين يارب يا حي يا قيوم..أسألك بكل اسم سميت به نفسك..أو أنزلته في كتابك..أو علمته أحداً من خلقك..أو استأثرت به في علم الغيب عندك..ان ترزقني زوجا يخافك ياارحم الراحمين اسالك من خيرك أكثر مما ارجو....اللهم وعظمني في قلبه..واجعلني ماء عينه ودم قلبه ودفئ حياته..واسعدني ولا تشقيني معه..يا أرحم الراحمين اللهم ارزقني بزوج صالح ..تقي ..هني ..عاشقا لله ورسوله .. ناجح في حياته .اكون قرة عينه وقلبه ويكون قرة عيني وقلبي \" اللهم يا جامع الناس ليوم لا ريب فيه اجمع بيني وبين زوجي اللي يكون غني بدينه واخلاقه وماله ويهنيني ويسعدني ويفرح قلبي يا من أمره بين الكاف والنون وإذا أراد شيئاً قال له كن فيكون ارزقني بزوج صالح وذرية صالحة تقر بهما العيون يا ودود يا ودود يا ذا العرش المجيد يا فعالاً لما يريد أسألك بعزك الذي لا يرام وبملكك الذي لا يضام وبنور وجهك الذي ملأ أركان عرشك أن ترزقني الزوج الصالح والذرية الصالحة الطيبة يارب ارزقني ولاتحرمني وسكن نفسي واسترني في الدنيا والاخرة وأغنني بحلالك عن حرامك يارب يا رحيم يا قادر على كل شي يا ذا الجلال و الإكرام أن ترزق جميع بنات المسلمين زوجة صالحا عاجلا غير آجل اللهم هب لي من لدنك زوجاً هيناً ليناً ديناً مرفوع ذكره في السماء والأرض وارزقني منه ذرية صالحة طيبة عاجلاً غير آجلاً إنك سميع الدعاء ... اللهم ارزقني زوجاً تقياً نقياً مخمون القلب .... اللهم أني أسألك زوجاً صالحاً ممن ترضاه من الرجال عندك وممن تقر به عيناي وعيناه تقربي \" اللهم اقذف في قلبي رجاؤك و اقطع رجائي عمن سواك ، حتى لا أرجو أحدا غيرك ، اللهم ما ضعفت عنه قوتي و قصر عنه علمي و لم تبلغه مسألتي و لم تنته إليه رغبتي مما أعطيت أحدا من الأولين أو الأخرين فخصني به يا أرحم الراحمين\" اللهم اشرح صدور اولاد ادم وبنات حواء اللهم ارزقني الزوج الصالح الذي تحبه وترضاه اللهم اني اشكو اليك ضعف قوتي وقلة حيلتي وهواني عن الناس انت ارحم الراحمين ورب المستضعفين وانت ربي الى من تكلني ؟ الى قريب يتجهمني ام الى عدو ملكته امري ان لم يكن بك علي غضب فلا ابالي غير ان عافيتك هي اوسع لي اعوذ بنور وجهك الذي اشرقت به الظلمات وصلح عليه امر الدنيا والاخره ان ينزل علي غضبك او يحل بي سخطك لك العتبى حتى ترضى ولا حول ولا قوة الا بك\" اللهم يافارج الهم وياكاشف الغم ياربنا ورب كل شي ومليكه سبحانك تباركت وتعاليت اللهم اني اسالك بانك انت الله الواحد الاحد الفرد الصمد الذي لم يلد ولم يولد ولم يكن له كفوا احد اللهم فرج كربنا واكشف غمنا وارزقنا من حيث لا نحتسب الله باسمك الوهاب الرزاق ارزقني واخواتي بالزوج التقي النقي انك على كل شي قدير اللهم ارزقنا فى صلاتنا ودعائنا بركة تطهر بها قلوبنا وتكشف بها كربنا وتغفر بها ذنبنا وتصلح بها أمرنا وتغنى بها فقرنا وتذهب بها شرنا وتكشف بها همنا وغمنا وتشفى بها سقمنا وتقضى بها ديننا وتجلو بها حزننا وتجمع بها شملنا وتبيض بها وجوهناوتجمع بيبننا وبين ازواجنا عاجلاا غير اجل وتعجل نصيبن يا أرحم الراحمين. وأسألك بأسمائك يا جليل، يا جميل، يا كفيل، يا عزيز، يا لطيف، يا مليك، يا ظهير، يا منير، يا نصير، يا معين. لا إله إلا أنت سبحانك إنى كنت من الظالمين. سبحانك لا إله إلا أنت الغوث الغوث يا دليل المتحيرين، يا غياث المستغيثين، يا صريخ المستصرخين، يا أمان الخائفين، يا عون المؤمنين، يا راحم المساكين، يا مجير المستجيرين، يا ملجأ العاصين. لا إله إلا أنت سبحانك إنى كنت من الظالمين. سبحانك لا إله إلا أنت الغوث الغوث اللهم ارحم ضعفي يااكرم الاكرمين يارب العالمين زوجني ياكريم ياودود ياودود ياودود ياودود ياذا العرش المجيد اللهم اني بك استغيث اللهم اني بك استغيث اللهم اني بك استغيث ان ترزقني واخواتي بالزوج الصالح اللهم امين اللهم يامن لطفت بعظمتك دون اللطفاء ..وعلمت ماتحت أرضك كعلمك بمافوق عرشك..وكانت وساوس الصدور كالعلانية عندك .. وعلانية القول كالسر في علمك .. وانقاد كل شيئ لعظمتك.. وصار أمر الدنيا والآخرة كله بيدك .. أجعل لي من كل هم وغم أصبحت فيه فرجا ومخرجا .. اللهم إنك تسمع كلامي ..وترى مكاني ..وتعلم سري وعلانيتي .. ولايخفى عليك شيئ من أمري ، وأنا البائس الفقير .. والمستغيث .المستجير ..والوجل المشفق المقر المعترف اليك بذنبه .. أسألك مسألة المسكين وأبتهل اليك إبتهال المذنب الذليل.. وأدعوك دعاء الخائف الضرير .. دعاء من خضعت لك رقبته .. وذل لك جسمه .. ورغـم لك أنفه .. اللهم يادليل الحائرين ويارجاء القاصدين ياكاشف الهم ويافارج الغم اللهم زوجنا واغننا بحلالك عن حرامك يالله ياكريم يارب العرش المجيد أرحمنا برحمتك ياأرحم الراحمين اللهم أني أسألك بأسمك العليم أنك عالم بحالي فبرحمتك يا رب يارب يارب زوجني برجل صالح يستر علي ويكون قرت عينن لي وأكون قرت عينن له يا رب يا رب يا رب ثم الدعاء بأسم الله الأعظم اللهم اني أسألك بأسمك الأعظم الذي إذا سالك به احد اجبتة واذا أستغاثك به احد اغثتة وأذا أستنصرك به احد أستنصرته ان زوجني يا رب يا رب يارب يا أرحم الراحمين يا أرحم الراحمين يا أرحم الراحمين با ذا الجلال والإكرام يا ذا الجلا والإكرام يا ذا الجلال والإكرام اللهم اني اسالك بدعاء ذي النون يوم دعاك في ظلمات ثلاث ظلمة الليل وظلمة البحر وظلمة بطن الحوت فستجبت له وأنجيتة لا إله إلا أنت أني كنت من الظالمين , لا إله إلا أنت أني كنت من الظالمين , لا إله إلا أنت أني كنت من الظالمين اللهم وارزقنا الزوج الذي يخافك ولا يعذبنا برحمتك ياارحم الراحمين ..........ترديد هذه الآيات مع الإستغفار:\" لو أنفقت ما فى الأرض جميعا ما ألفت بين قلوبهم و لكن الله ألف بينهم إنه عزيز حكيم\" (63)سورة الروم \"و من آياته أن خلق لكم من أنفسكم أزواجا لتسكنوا إليها و جعل بينكم مودةً و رحمةً إن فى ذلك لأيات لقوم يتفكرون\"(21) سورة الذاريات \"و من كل شئ خلقنا زوجين لعلكم تذكرون \"( 49)سورة القصص \"و ربُك يخلق ما يشاءُُ و يختارُ ما كان لهم الخيرةُ سبحان الله و تعالى عما يشركون \" (68)سورة الانسان \"و ما تشاءون إلا أن يشاء الله إن الله كان عليماً حكيماً \" (30)سورة الأنبياء \"لا اله الا أنت سبحانك انى كنت من الظالمين \"(87)سورة النبأ \"و خلقناكم أزواجا \"(8)سورة الفرقان \"ربنا هب لنا من أزواجنا و ذرياتنا قرة أعين\" (74 ) سورة الأنبياء \"ربى إنى مسنى الضر وأنت أرحم الراحمين \"(83)سورة يوسف \" إنما أشكو بثى و حزنى إلى الله وأعلم من الله ما لا تعلمون \"(86)سورة الأعراف \" هو الذى خلقكم من نفس واحدة وجعل منها زوجها ليسكن إليها \"(189)اللهم وزوج جميع بنات المنتدى وكل وحده تدخل الصفحه وتقراها يارب اللهم صلي على خير الأنام--------------------------اللهم امين اللهم امين اللهم امين"
