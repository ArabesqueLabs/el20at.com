[[comments]]
order = 90
subject = "نقلا عن مدونة عايزه اتجوز"
text = "النهاردة يا جماعة ..يوم تاريخي..يوم لن يتكرر مثله أبببدا في تاريخ البشرية..يوم مهم و فاصل و يعتبر من العلامات البارزة في تاريخ عالم التدوين بل العالم أجمع ..باختصار و من غير رغي كتير النهاردة -للأسف- عيد ميلادي<br />الكام؟؟؟؟<br />و ليه الأسئلة البايخة دي بأااااه؟<br />عموما انتوا مش غربا و اي حد لئيم شوية هيرجع يبص ع البروفايل و هيعرف ..ده غير اللي متابعين أصلا و حافظين<br />النهاردة و مع الأسف و الألم و الـ,,, مش عارفة ايه كمان<br />عيد ميلادي ال 29<br />ياااااااااااااه ..بأه عندك 29 سنة؟؟<br />مش قلنا بلاش التعليقات البايخة دي؟<br />زي النهاردة من 29 سنة الست الوالدة قررت ان هو ده الوقت المناسب لتترك بصمتها على وجه الخليقة و تضيف للدنيا إضافة عظيمة و مهمة ..اللي هي طبعا حضرتي<br />و لأن ال29 رقم مميز جدددددا في حياة أي بنت مصرية..فهو رقم له دلالاته و من اهمها ان خلاص العداد قرب يشطب و احنا بنلعب في الوقت بدل الضايع<br />و خلاص يا برايد بكره اللي يسوى و اللي مايسواش يديكي اللقب المعروف و اللي بقالك 3-4 سنين بتجاهدي و تكافحي عشان تلغيه من القواميس بدون فائدة ترجى<br />لكن ليها حل<br />..البروفايل من بكره هغيره..و هاشيل السنة<br />و كل البوستات اللي فيها سيرة لموضوع السن هتتظبط<br />و كل التعليقات هيتعملها مونتاج قبل ماتتعرض<br />أو على الأقل زي كل الستات على مستوى العالم -جمعاااء- هيفضل عندي 28 سنة لمدة 5-6 سنين جايين (طيبه أنا قوي..ماقلتش 24 والا 25 ولا حاجة)..لكن<br />لكن مش عارفة ليه ..مش فارقة معايا قوي؟؟؟<br />مش حاسة ان ال29 دول فارقين عن ال 25 قوي يعني<br />يمكن هاحس كمان شوية؟؟<br />يمكن جتتي نحست و أخدت على كده؟؟<br />يمكن عشان حواليا بنات كتير زيي و كلهم زي الفل؟؟<br />يمكن عشان لسه بيجيلي عرسان و لسه بارفض اللي مش مناسب و مش حاسة لغاية دلوقتي اني المفروض ألم التعابين بأة و أقبل أي حد؟؟<br />يمكن عشان فيه نسبة كبيرة من اللي بيزنوا على وداني بطلوا - عن يأس أو إستسلام- انهم يزنوا عليا أقبل أي منظر و خلاص؟<br />يمكن عشان شاغلة وقتي و مش حاسة قوي بالفراغ؟<br />يمكن عشان اهلي واقفين ورايا في كل القرارات؟<br />يمكن لسبب او اتنين ..و يمكن لكل الأسباب دي<br />بس برضه ..صعب ان حد يقوللي كل سنة و انتي طيبة السنة دي و أقوله و انت طيب<br />غالبا بارد و أقول<br />سعيكم مشكور"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

