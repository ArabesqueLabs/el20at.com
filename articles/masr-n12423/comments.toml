subject = "انطلاق البث التجريبي لقناة زواج الفضائية"
text = "انطلاق البث التجريبي لقناة زواج الفضائية<br />انطلق البث التجريبي لقناة زواج الفضائية مساء يوم الاثنين الماضي ، وقد صرح الدكتور \" علي المالكي \" مسؤول العلاقات العامة بالقناة أن ردة الفعل الأولية عن البروموهات التي بدأت القناة ببثها تجريباً كانت إيجابية للغاية ، وعكست مدى أهمية الموضوعات والقضايا التي انطلقت من أجلها القناة ، وأضاف \" المالكي \" أن العمل يجري الآن على قدم وساق بكافة مكاتب القناة في مختلف الدول العربية من أجل الانطلاق الفعلي الذي سعى فيه القائمون على القناة بفتح العديد من الملفات المهمة في المجتمعات العربية بشكل عام والخليجية على وجه الخصوص ، وقد اختارت القناة عبارة \" ببساطة .... من هنا البداية \" لتكون شعاراً لها ، وأوضح \" المالكي \" أن هذا الشعار تم اختياره كإيحاء للمشاهد بأن مجرد مناقشة قضايا مثل \" العنوسة و الطلاق \" كفيل بأن يفتح الباب للمناقشة والبحث عن الحلول ، وقد رصدت القناة جائزة مالية كبيرة تصل إلى \" 250\" ألف ريال لمن يقدم أفضل الحلول لمشكلة \" العنوسة \" في الوطن العربي وقد تم الإعلان عن ذلك صراحة على شاشتنا ، وأعتقد - والحديث مازال على لسان \" المالكي \" - أن استعراض القناة في أحد بروموهاتها لنسب<br />العنوسة في الوطن العربي يكشف حجم المأساة التي تعيشها بعض فتياتنا ، ويعكس مدى خطورة القضية الناتجة عن تزايد أعداد اللواتي تعانينها ، إضافة إلى<br />ارتفاع نسب الطلاق في المقابل وجميعها تمثل قضايا خطيرة لابد أن يلتفت الإعلام إليها ويناقشها بكثير من الواقعية والمصداقية ، وهو ما تسعى إليه \" قناة زواج \" وتطمح إلى تحقيقه ، وأضاف \" المالكي \" أن كل يوم في البث التجريبي للقناة سيشهد إضافة جديدة للمشاهدين ، حتى نصل إلى الشكل النهائي المتفق عليه ... وندعو الله أن نوفق في معالجة القضايا التي من أجلها انطلقنا ...<br />نستقبل كافة استفساراتكم وملاحظاتكم التى تساعد على تقدمنا لأن كافة جهودنا تبذل من أجل تكاتف الأسرة وعليه يجب أن نكون جميعاً كذلك متكاتفين ."
