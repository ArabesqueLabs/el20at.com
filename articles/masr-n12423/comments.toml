text = "طلب الزواج من الكاتبة يدل على انك انسان غبي والدليل على ذلك قولك لها<br />اذا كنت يا سيدتي الجميلة لديك الاستعداد لتكوني زوجة ثانية<br />وبعدين يا ولاء المفروض ما ترديش على الناس دي لانك بتطرحي قضية عامة مش عامله لنفسك اعلان زواج<br />والمفروض التعليقات \\ي تتشال على طول"
