subject = "لقد فتحتى جروحا.........."
author = "ALI AHMD"
text = "بسم الله الرحمن الرحيم<br />لا اعرف ماذا ستقدم او تأخر هذه الكلمة و لكن لا بد ان اكتب<br />كان الله فى عون جميع الفتيات و كذلك الشباب<br />حسبى الله و نعم الوكيل فى من كان السبب<br />اللهم نسألك العافية و ان تعوض على الجميع و تيسر لنا الحلال و تباعد بيننا و بين الحرام<br />و السلام ختام<br />اعلموا جميعا اننا ان لم يوفقنا الله فى هذه الدنيا فان الخير كل الخير عند الله يوم لقائة ولقد علمنا ديننا ان نكون اوثق بما عند الله اكثر مما فى ايدينا الان ، وكذلك ايها الاصدقاء لو اطلعنا على الغيب لحترنا الواقع."
