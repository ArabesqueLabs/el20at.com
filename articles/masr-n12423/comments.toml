text = "و اله مقالك اجا على الوجع... لسة من ساعة حاكيةمعي صاحبتي و قالتلي ما تخطبيلي يا ريما<br />صاحبتي برضة حاجة و تلاتين .. و هي زي الفل امورة و نغشة و حبابة و اهلها من خيرت الناس و بصراحةطيبتها زيادة عن اللزوم ومع هيك لسةما لقتش ابن الحلال<br />بس بصراحة كلو نصيب يا ولاء.. انا بعد ما اتجوزت عرفت انو النصيب غلاب<br />و على فكرة انت مش باين عليكي حاجةو تلاتين.."
