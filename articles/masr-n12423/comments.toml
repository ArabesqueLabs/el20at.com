[[comments]]
order = 79
subject = "التربية"
author = "احمد حسن"
text = "على العموم دة ردى وعلى فكرة احنا شعب مش متربى لو شعب متربى كان كل واحد احترم راى الثانى حتى لو غلط وحتى لو كان غبى زى الاستاز مبيقول المفروض يااستاز انك تحترم راية وتناقشة فى الموضوع مش تصدر احكام من دماغك تحاول تحاور كل شخص بطريقتة واقناعة بالصح مش احكم علية بالغباء او اتريق علية بسخرية على فكرة دى اول مرة فى حياتى اتكلم فيها على النت واظن هتبقى اخر مرة لانى ملقتشى الى يحاورنى بادب ولزلك رديت بقلت ادب على فكرة الشعب القطرى بيعامل كل الاجناس بكل احترام لزلك قطر افضلى من الهمجية المصرية الى عمرنا مهنتعلم طريقة الحوار ابدا<br />ولا احترام الاخرين حتى لو اغبياء وشكررررررررر سلاممممممممممممممممم"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

