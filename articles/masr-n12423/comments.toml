[[comments]]
order = 28
subject = "الى الابنة ولاء الشملول"
author = "ابومحسن غربة 26 سنه"
text = "يا ولاء انا في سن والدك تماما ولما قرأت الموضوع توقعت ان حيكون فيه معلقين سذج<br />لكن الموضوع قضية صحافية وقضية راي عام<br />المفروض القارىء يتعاطف مع القضية ما يتعاطفش مع الكاتبة<br />اللي تعاطف مع القضية وكل في مكانه ينظر حوله ويشوف العوانس اللي في منطقته ويطلب الزواج منهم<br />هو دا الكلام الصحيح وانا من المستغلين في العمل الصحفي بقالي 30 سنه<br />والكلام دا كنت حأقولي لابنتي لو وقعت في هذا الموقف<br />وللاخوة القراء التعاطف مع القضية المطروحة وليس مع الكاتبة<br />اللي تعاطف مع القضية ينظر الى العوانس في منطقته ويشفق عليهم<br />الكاتبة برا الموضوع<br />الا هل بلغت اللهم فأشهد"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145533/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 29
subject = "لم يكن فى قريتى اى عانس يا ولاء"
author = "فلاح مصرى عجوز"
text = "تصورى يا ولاء يا بنتى ان قريتى الفقيرة التى تعددادها 30 الف نسمة لم نرى فيها بنت عانس واحدة على ايام شبابنا<br />لية يا ولاء<br />لان كان فية كبار البلد وكبار العيلة - وهؤلاء هم اهم مافى المجتمع - كانوا بيقعدوا فى المندرة ( يعنى المجلس اللى بيجلسوا فية يشربوا شاى وقهوة ويقابلوا فية الضيوف ) ويتكلمون كانهم مسئولون عن العيلة والقرية<br />فى احد المجالس وكنت طفل سمعت الحوار التالى<br />يا شيخ محمد - البنت سعاد بنت الحاج ابو ابراهيم لسة محدش دق بابهم - اية رايك البنت دى يناسبها مين من الاولاد<br />يرد الشيخ محمد واللة يا حاج جابر اللى يناسبها الولد فلان ومتأخر عن الجواز رغم انة خلص الجيش<br />ويتفق الشيخ محمد والحاج جابر انهم بطريقتهم اللى ما تخيبش ابد يجوزوا الولد للبنت<br />ويقابلوا الولد فى الغيط ويشرحوا لة انهم عندهم عروسة لة وهيمدوة بالفلوس ويساعدوة ويخلوا الولد يقتنع<br />وبعدين يروحوا لابو العروسة ويقنعوة ان الولد دة تمام ومناسب وخليها على اللة<br />ويتم الزواج<br />دائما كان الكبار يتدخلون<br />اما الان<br />فلا يوجد كبار العيلة ولا كبار القرية ولا الصغير يحترم الكبير<br />انفلت العيار<br />كل واحد عامل نفسة الكبير وكل واحد عايش فى جزيرة لوحدة وقافل على نفسة الباب بالضبة والمفتاح<br />يا عالم ارجعوا لاصلكم<br />اقعدوا مع بعض وحسوا بمشاكل بعض<br />واللة فى عون المسلم ما دام فى عون اخية<br />انت يا بنيتى ضحية مجتمع انقلب حالة واصبح زى الغراب اللى بيقلد الطاووس<br />اسف بنيتى واكرر اسفى على الاستطالة"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145533/http://masr.20at.com:80/newArticle.php?sid=12423"

