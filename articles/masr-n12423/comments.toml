[[comments]]
order = 65
subject = "البحث عن عروسة في حديث رسول الله صلى الله عليه وسلم"
text = "تنكح المرأة لأربع لمالها ولحسبها ولجمالها ولدينها<br />صدق رسول الله صلى الله عليه وسلم وهو صلوات الله وسلامه عليه يوجه الجنسين في عملية البحث عن عروس فقال حديثه<br />1) اولا المال<br />يعني البنت لازم تشتغل ولازم يبقى عندها مال لانه من اسباب الترغيب منها في الزواج<br />2) حسبنا<br />اذا كان عندها حسب يبقى مشكلتها محلولة يعني لو كان ابوها لواء في الجيش ولا مدير عام ولا ولا ولا يبقى خلاص مشلتها محلولة واريد ان اذكر هنا ان الرئيس السادات كان عنده اخت عانس وتزوجها الوزير ممدوح سالم لانها اخت الرئيس<br />3) لجمالها<br />وطبعا جمالها دي مش محتاجه شرح<br />4) لدينها<br />يعني البنت لازم تبقى متدينة وتعرف دينها وربها لانه من احد الشروط التي يطلبها الشباب<br />طبعا فيه شرطين خارج ارادتنا وهو الحسب والجمال دول اذا كان البنت حظها كويس حيبقوا موجودين طبيعي<br />والشرطيتن التانيين في ايد كل بنت الا وهو<br />المال والدين<br />ممكن البنت تكون ورثة مال ولكن اذا ماكنتش وارثة هي ممكن تعمل المال ودا موضوع يطول شرحه لكن في ايد البنت<br />نيجي بأه لبقية حديث رسول الله صلى الله عليه وسلم فأظفر بذات الدين<br />يلا يا بنات خيركم من تعلم القران وعلمه<br />ما تضيعوش وقد يلا بينا نحفظ قران ربنا سبحانه وتعالى لو احنا شطار اوي حنحفظه في خلال 3 سنوات بس طبعا يكون لوجه الله الكريم وبعد كده نعلمه للاخرين وان شاء الله<br />يلا ما تضيعوش وقت<br />ادامكم المال والدين"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

