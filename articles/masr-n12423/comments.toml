[[comments]]
order = 1
subject = "العصابة"
author = "محمد القط"
text = "هو كل مصيبة تلزقزها في أم العصابة...من أنفسكم سلط عليكم ...وأينما تكونوا يول عليكم....<br />هو أينعم العصابة الحاكمة \"ربنا ينتقم منهم\" خلتها بلا على راس الجميع...إنما إلي يتسرق وميدفعش عن نفسه ...لامؤخزة ده يتقال عليه إيه ؟!!<br />ومضيقيش نفسك يا ست ولاء...كلها قسمة ونصيب...لعل ربنا مخبيلك خير بتأخير الجواز...ده لو كنتي فعلاً مش متجوزة !!"
archived = "2007-11-15"
capture_url = "https://web.archive.org/web/20071115121212/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "أولا ... عاجبني الموضوع جدا ... أسلوب راقي مميز ... والحقيقة دا انعكاس عن كاتبة قوية مميزة والأهم إنها عارفة هي عايزة تكتب إيه ... إنما يا جماعة المأساة أن العنوسة بمفهومها بدأت تمتد بصورة أشمل وتضم الجنس الآخر ... إيه مستغربين ...!! طب أنا أهو دكتور كويس ومش عارف أرتبط ... ما حدش يستغرب يا جماعة ... يمكن دي قلة الحيلة ... !!!<br />عموما المشكلة كبيرة فعلا ... والخوف أنها تكبر أكتر من كدا ... أنا بس عايز أقول للأخوة المتجوزين ارضو بنصيبكم ... وإللي فلت فلت ... تحياتي مرة أهرى للجميع خاصة صاحبة الموضوع"
archived = "2007-11-15"
capture_url = "https://web.archive.org/web/20071115121212/http://masr.20at.com:80/newArticle.php?sid=12423"

