subject = "بصى يا ولاء أحنا قاعدين متهنيين فى بيت أبونا والنصيب حيجلنا لحد عندنا إن شاء الله"
author = "الى نونه"
text = "يعني بعد كل التعليقات اللي فوق دي اللي انا تعبت فيها وشقيت علشان خاطر اوضح للبنات حاجات مهمة<br />بعد كل دا تقوليلي احنا حنقعد في بيت ابونا<br />يا هانم اقرأئي التعليقات اللي فوق كويس جدا جدا علشان خاطر تفهمي الموضوع<br />غلط كده تعدي في بيت ابوكي غلط<br />النساء كانوا بيروحوا للنبي يطلبون الزواج منه (اذا صحت الروايات)<br />مفيش واحدة تقعد في بيت ابوها اقرأوا التعليقات لو سمحتم كويس"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

