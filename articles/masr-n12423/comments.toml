[[comments]]
order = 92
subject = "روحى منك لله"
author = "نونة"
text = "حرااااااااام عليكى يا ولاء ..... بجد روحى منك لله<br />قلبتى عليه المواجع ... مأحنا قاعدين فى بيت أبونا ساكتين ومتهنيين وأيللى يقولولك ضل راجل ولا ضل حيطة دة هوة بقى الخطأ العلمى الحقيقى .... ضل الحيطة أحسن طبعآ وهية دى الحقيقة العلمية المؤكدة فى زمانا دة<br />خمسة جد .... الفكرة مش فى السن ولا فى الجواز الفكرة فى الزن فى نظرات الاهل والصحاب الفكرة فى إيللى حوالينا وأول ما البنت تكمل 20 سنة يقعدوا يعدولها بقى وهية فى الاول ولا واخدة بالها لكن أول متكمل 25 سنة يا نهار أسود فاضلى 5 سنين وأبقى 30 سنة وأما تدخل فى الحاجة والتلاتين يا خبر يا خبر<br />بصى يا ولاء أحنا قاعدين متهنيين فى بيت أبونا والنصيب حيجلنا لحد عندنا إن شاء الله<br />وزى ما قولتى حلويين حلاوة حقيقية أصلية كمان صحيح مش حاطيين عدسات ملونة لكن مالها العيون العسلية ومؤدبين ومحترمين ودمنا خفيف ...... وعلى فكرة تبقى مامته دعياله إيللى يتقدم للزواج مننا .... ومش حقول أكتر من كدة"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 93
subject = "يا جرحنى بلقمة ناشفة و العيش عندك طرى .."
text = "يا جرحنى بلقمة ناشفة و العيش عندك طرى ..<br />تقلان عليا ليه ارحمنى يا مفترى<br />_______________<br />طلعت فوق السطوح هز الهوا كمى ..<br />كل العيال اتجوزوا وانا لسة جمب امى<br />______________<br />يا حبشتكة يا حبشتكة .. القلب من الحب اشتكى ..<br />يوم دمع و حزن ويوم فرح و هشتكة<br />___________<br />حبيبى يا ناس حلقلى و سايق ف التنفيض ..<br />قلوله يرحم قلبى و ميعملش فيها عبيط<br />_______________<br />كان بينا شوق و محبة راحت بلوية بوزك .<br />الله يحرق المحبة و يحرق اللى يعوزك<br />____________<br />الواحد ممكن ينسى همه ! . و ممكن ينسى ورد شمه! ..<br />بس لا يمكن ينسى حبيب طلع عين أمه<br />__________________<br />اللى يشوفك يفتكرك فارس ف ساحته ..<br />ميعرفش انك حتى الشراب شحته<br />____________________<br />شكرا جزيلا على مرووكم ولكم تحياتي"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
