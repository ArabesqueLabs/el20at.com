subject = "ومين السبب في العنوسة"
text = "بمناسبة العنوسة كان فيه ابيات شعر اخذتها من احد مواضيع الاخت روضة عبدالحميد المحررة السابقة بهذا الموقع تجسد مشكلة عدم الزواج احب ان اضيفها الى هذا الموضوع<br />وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه<br />عايزينك ترجعي تاني يا اخت روضة عبدالحميد"
