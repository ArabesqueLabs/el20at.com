subject = "الى كفاية لا يحمد على مكروه سواه"
author = "مش مهم"
text = "يا اخت كفاية<br />على ما يبدو انك تجرعتي مرارة العنوسة<br />انا من رايي افضل من تجرع مرارة الطلاق<br />مرارة انك تخلفي عيلين وبعدين جوزك يطلقك ويا خدهم منك وما تعرفيش تشوفيهم تاني<br />وتفضلوا طول عمرك تبكي على اطفالك<br />ولا مرارة عقوق الاولاد<br />ما جربتيش انك تخلفي عيل ويبقى عاق<br />ما سمعتيش عن ولاد بيضرب امه<br />صدقيني والله يا اخت كفاية<br />العنوسة ارحم مليونين مرة من بلاوي كتيرة<br />الحمد لله انك عانس"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

