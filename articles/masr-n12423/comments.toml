text = "فى الاول ابد سلامى بلاسلام عليكم ورحمة الله تعالى وبركاتة<br />الى الاخت الفاضلة الاخت الكريمة الاخت الحنونة الاخت المتدينة الاخت اليى ربنا هيكرمها بامر الله تعالى انا شاب عمرى عشرون عاما لا اقول انى اريدك ولاكن او ان اقول انتى مش الاولى ولا الثانية ولا المليون تاكدى بجد بجد بجد من اخ والله العظيم انا مش عاوز من حضرتك الا وعد ووعد صغير تصلى وتصبرى اعوذ بالله من الشيطان الرجيم بسم الله الرحمن الرحيم فى اية من ايات الله تعالى تقول ( ان الله مع الصابريين ) مش عاوز اقولك غير انك تقولى يارب اكرمنى بعبدا فقير الى الله وبس متقوليش غير كدة فى كل صلاة وعدى يا اختى يا فاضلى وعلشان اقولك حاجة كمان ان مش الوحيدة فى البلد او فى الدنيا حطيها فى دماغك خلاص هتقوليلى اعمل اية طيب انا عمرى عديت الخمسة وعشرين اواواو تعملى اليى اخوكى فى الله انا هقولك علية نصيحة من اخ صغير انكم تقولى يارب اكرمنى بعبدا فقيرا الى الله ياااااااا وبامر الله تعالى ان ربنا هيكرمك بابن الحلال وهقولك حاجة مش احسن مكنتى اتجوزتى واطلقتى ولا اتخطبتى واتفشكلت واقولك حاجة كمان والله عمرها مكانت بالحلاوة ولا باطول ولا بلعيلة ولا باماديات ولالالالا اية حاجة المكتوب مش هتاخدى اكتر منة خالص ويا عالة اية بكرة قولى يارب يارب يارب يارب يارب يارب يكرمنى بابن الحلال العبد اللحوح الى الله سبحانة وتعالى والفقير اليك يا الله والسلام عليكم ورحمة الله تعالى وبركاتة اخوكى ع من الاقصر"
