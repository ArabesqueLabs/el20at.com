[[comments]]
order = 23
subject = "طالب القرب"
author = "عريس"
text = "باختصار شديد انا من المؤمنين بالتعدد وانه الاصل في شرع ربنا عندما قال تعالى { وانكحوا ما طاب لكم من انساء مثنى وثلاث ورباع ...} والاستثناء هو الواحدة ، كما انني الحمد لله مستقر في حياتي الزوجية ومتفاهم تماما مع زوجتي ولكنني لديا شعور قوي بان اتزوج للمرة الثانية لا لسبب الا لانه شئ حلال .. ليس من باب الشهوانية ولكنها طبيعة خلقها الله وحبى بها الكثير من الرجال ... ثم ان الرسول وصحابتنه والتابعين وتابعيهم لم يتوقفوا اطلاقا عند قضية التعدد لانها كانت بديهة من الاشياء الحلال ولم تكن تثير مشكلة اطلاقا لانها من صلب الدين والمجتمع ايضا وتساعد على نشر العفاف<br />فمثلا السيدة اسماء بنت عميس تزوجت سبع مرات ، كما ان السيدة حفص عندما ترملت ومات عنها زوجها في الحبشة لم يطق عمر بن الخطاب - رضي الله عنه- ان تبقى بلا زوج لمدة تقارب سبعة اشهر وعرضها بنفسه على كبار الصحابة حتى ابو بكر وكان الله قد ادخر لها الرسول -صلى الله عليه وسلم .<br />كما اننا لم نجد في كتب الفقه للسلف الصالح باب حول حكم الشرع في التعدد لانه لم يكن بحاجة الى حكم.<br />وانهي كلامي بانني ارى ان المجتمع سيطرت عليه الرؤية الكنسية وهي الزواج واحدة على التابيد ونتيجة الغزو الصليبي لديار المسلمين ركزوا على هذه المعاني التي صارت اصلا لدى الناس وتفنن الاعلام المقروء والمسموع والمرئ في تاكيد هذه المعاني وهي واحدة على التابيد والثانية ضرة والراجل اما فاجر واما قادر الخ هذه الافكار التي لا علاقة لها بالاسلام من قريب او بعيد .<br />ونهاية اذا كنت يا سيدتي الجميلة لديك الاستعداد لتكوني زوجة ثانية ارجو مراسلتي على هذا الميل aqamm44@yahoo.com"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145533/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 24
subject = "لدى اقتراح"
author = "ولاء الشملول"
text = "الأستاذ الفاضل عريس<br />سلام عليكم<br />اراك على دين وخلق باذن الله<br />احسبك كذلك ولا ازكيك على الله<br />ولكن لدى لك اقتراح طالما انك تفكر فى الزواج ليس شهوانية ولكن لاعفاف البنات غير المتوجات<br />فما رايك طالما انك قادر على الزواج مادياً من اثنين ان تعطي المال الذي ستتزوج به المرة الثانية لشاب وشابة للزواج فبدلا من ان تعف الفتاة فقط -وانك عففت نفسك فعلا بالزواج من الاولى -تعف في هذه الحالة شاب ايضا مع الفتاة<br />ولك الثواب والأجر عند الله<br />طالما انك لا تتزوج الثانية لشهوة يا سيدي ولا شهوانية<br />لمزيد من المعلومات راسلني على<br />walaa2012@hotmail.com<br />وشكرا"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145533/http://masr.20at.com:80/newArticle.php?sid=12423"

