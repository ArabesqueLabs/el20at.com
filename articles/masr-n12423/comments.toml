subject = "حرية"
author = "ولاء الشملول"
text = "الى صاحب تعليق - الى طالب القرف<br />يا عزيزى لدينا حرية راى كبيرة فى عشرينات<br />ومن حق اى انسان يقول رأيه طالما ليس تجريح ولا اهانة ولا سب ولا قذف<br />وانا صدقنى لم اتضايق ابدا من طلبه<br />وربنا يهدي الجميع<br />وعنوانى متاح للجميع لمن يريد للنقاش المفتوح حول القضية التى<br />اراها قضية راى عام<br />وقضية أمن قومي<br />وشكرا لك"
