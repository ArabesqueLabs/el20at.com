subject = "عفوا سيدتي: دعي زوجك يتزوج!"
text = "عفوا سيدتي: دعي زوجك يتزوج!<br />نشرت صحيفة «الوطن» السعودية قبل أيام خبرا طريفا بعنوان «الاعتداء بالضرب على عضو لجنة القضاء على العنوسة»، وخلاصة الخبر أن العضو الموقرة توجهت إلى أحد المستشفيات في جدة لإقناع زوجة مريضة بالسماح لزوجها بالزواج من أخرى وذلك بهدف الإسهام في القضاء على العنوسة، فانهال أبناء تلك الزوجة على العضو بالضرب المبرح، نقلت على أثره إلى مستشفى آخر منعا لتكرار الاحتكاك.. ومما يكمل غرابة الخبر وطرافته أن لجنة القضاء على العنوسة التي تنتمي إليها تلك العضو لم تحصل على تصريح رسمي من أية جهة رسمية لمزاولة نشاطها.<br />وبافتراض صحة الخبر، فإن أبسط ما يمكن أن ينعت به سلوك عضو لجنة القضاء على العنوسة هذه، أنه يفتقر إلى الحصافة والوعي والكياسة، فالمستشفيات المرتبطة عادة بالألم والمعاناة ليست المكان المناسب لنشر أفكار تلك اللجنة وأهدافها، وكون الزوجة مصابة بمرض عضال لا يعني بحال من الأحوال جواز مضاعفة أحزانها بالدعوة لتزويج زوجها. وما نال تلك الداعية من ضرب في تقديري لا يمكن اعتباره جزاء لها ولكنه بكل تأكيد يمثل رادعا لغيرها من تكرار نفس الخطأ، فهي لم تراع الظرف النفسي للمريضة ولا أسرتها ولا خصوصية المكان الذي اختارته لبث أفكار لجنتها.<br />وقد ذكرني ما حصل لتلك السيدة بذلك الرجل الغليظ المتجهم الذي اتخذ من المقابر ميدانا للاحتساب، وكان يفتقر إلى اللباقة النفسية للتوجيه والإرشاد والموعظة الحسنة، مما أدى إلى كثرة مصادماته واحتداداته مع أسر المتوفين إلى حد الاعتداء عليه بالضرب من قبل بعضهم.<br />وفي تقديري أن لجنة القضاء على العنوسة قبل أن تطلق دعاتها إلى ميادين العمل، كان عليها أولا أن تسعى إلى تدريبهم على أساليب الإقناع والحوار ودراسة الظروف الملائمة لطرح مثل هذه الأفكار، فالنوايا الخيرة لا تكفي وحدها لتحقيق تلك الغايات.<br />وكنت أتمنى على لجنة القضاء على العنوسة بدلا من الذهاب إلى المستشفيات ودعوة المريضات إلى السماح لأزواجهن بالزواج من أخريات، أن تسعى لإزالة المعوقات من طريق الشباب كي يقبل على الزواج، ومن تلك المعوقات: البطالة والمغالاة في المهور واحتفالات الأعراس وارتفاع أجور الوحدات السكنية، فلو نجحنا في إزالة تلك المعوقات وغيرها لما احتجنا أن نخوض في مسألة العنوسة، فالعنوسة هي نتيجة لمشكلات أخرى فشلنا في تقديم حلول لها.<br />وما يجب التنبيه له في هذا السياق خطورة أن يحمٌل البعض مصطلح العنوسة دلالات حادة من شأنها أن تدخل الكثير من الفتيات في نفق الأزمة النفسية بمجرد التأخر في الزواج، إذ أن التأخر في سن الزواج غدا مظهرا مرادفا لتغير الحياة، بحيث أصبح على الفرد أن يقضي سنوات أطول في التعلم وتكوين الذات من ذلك الزمن البسيط الذي خرجنا منه ولم نعد."
