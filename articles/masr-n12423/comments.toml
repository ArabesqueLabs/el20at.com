[[comments]]
order = 15
subject = "الطيبون للطيبات"
author = "انتظار الفرج"
text = "الزواج نصف الدين وعبادة يسال عليها من استطاعها و لم يقم بها و من توافرت له امكانياتها كالقبول و التيسيير و الصحة و الكفاءة و التناسب ............<br />انا لا اري السبب مادي فقط فكثيرا من الميسورين لم يتزوجوا و كثيرا من المطلقين ليسوا بسبب المال بل من منا اذا فكر في ان كل امر يجب ان يكون ينقصه شئ صحة.سترة.علم .اخلاق ام مال فمن منا يختار شئ غير المال<br />انا اراها ازمة اخلاق و دين و عقاب من الله او ابتلاء قد تكون ازمة العثور علي الانسان الصالح المناسب علميا و ثقافيا<br />شباب يفضلوا الزواج من الاجنبيات يعلم انها عاشرت غيره من الرجال و لكنه يبيع نفسه و نصف دينه<br />كثير من شبابنا استكتر علي نفسه الزوجة الصالحة و هناك من يري المراة عبدة له و يكون في راسه ان هذا دورها و عليها ان تقبل اقل المهور و ان كان عاجبها بل و تقبل ان تكون زوجة تانية و اهو اسمها اتجوزت و خلاص<br />و بعد الزواج ينهار المنزل لاهيف سبب اسباب ظهرت مرات عديدة بين ابوينا و جدودنا و لم يهدم البيت بسببها<br />في الاخر لا استطيع سوي ان اكلم من بيده الامور كلها و هو احكم الحاكمين يا رب اكفي الصالحات بالصالحين و اعف الصالحين بالصالحات علي الوجه الذي يرضيك فاذا انت اردت لن يمنع ذلك طاغية او حاكم او فاسد او مال فقط انت من تعفو و تمنح اللهم فرجك القريب و الصلاة و السلام علي خير المرسلين"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145533/http://masr.20at.com:80/newArticle.php?sid=12423"

