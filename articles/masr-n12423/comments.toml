[[comments]]
order = 8
subject = "كيف تصطادين عريساً"
author = "http://www.aljaml.com/node/10913"
text = "كيف تصطادين عريساً<br />لم تعد مكاتب الزواج أو الخاطبة الإلكترونية عند الكثيرات خاصة الواثقات من قدراتهن العقلية والنفسية والواثقات من أنفسهن أيضاً غايتهن للزواج ، إنهن يسعين بأنفسهن إلى ذلك ويوقعن الفريسة في شباكهن بأساليبهن الذكية ، رافعين شعار \"إسعى يا عبد وأنا أسعى معاك\" ، علي اعتبار أن الزواج رزق والسعي علي الرزق مطلوب ؟<br />- ليس الهدف الأوحد للبنات في المصايف الاستجمام ، بل بات هدفاً ثانوياً ذلك لان هناك هدف أسمي واجل ، هو التعرف على شاب وسيم ينفع يكون زوج المستقبل، لذا تجد معظم البنات خلعن لباس البحر ليرتدين أجمل ملابسهن على الشاطئ بماكياج أنيق للصباح ليضفي عليهن جمالاً خاصاً في ضوء الشمس ، مستلقيات على كراسي الشاطئ وعيونهن زائغة باحثة عن فتى وسيم .<br />هذا الروتين متبعاً كل صبح على الشاطئ إلى أن يأذن الله بابن الحلال ، أما مساءًا فإنك تمشي في المصيف وكأنك قد دُعيت إلى فرح دون علمك فالفتيات ليس لديهن ما يمنعهم من لبس بعض الأزياء البراقة اللماعة الشفافة، وإن لم يكن متعمدات ذلك فإن موضة الترتر والخرز السائدة تجذب إليهن الانتباه دون شك .<br />قد يلعب الحظ دوراً أكبر من جهود البنت في أسبوع المصيف ويخطفها فارس الأحلام على حصانه بعد تعرف الأسرتين عن طريق الصدفة ، وطبعاً هذا لا ينفي جهد تكتيك الفتاة وخطتها المرسومة من دلال وخجل وأدب وعناية بحماة المستقبل لترشحها لابنها إن لم يكن وقع فريسة بعد !!<br />تقول \" ع . ك \" ، متزوجة ولديها طفل عمره 7 أشهر : تعرفت على زوجي من خلال المصيف ولكني كنت مازلت في مرحلة الثانوية ، أمه كانت صديقة خالتي في العمل وكنا دائمي الذهاب إلي المصيف مع خالتي ، ومن هنا أتتني فرصة التعرف عليه ، وقع في حبي وأحببته ، لكنه لم يكن انهى دراسته الجامعية بعد . تعاهدنا على أن نكون لبعض ، وعرفت أمي القصة وكان دائم الزيارة لنا هو ووالدته في المنزل إلى أن استقرت ظروفه وتزوجنا ، ورزقنا الله بأحمد 7أشهر .<br />وتضيف \" ع. ك \" من خلال تجربتي أرى أن زواج المصايف إذا توافرت فيه صدق النوايا يكون زواجاً ناجحاً .<br />- الفائدة الوحيدة التي يعرفها الناس للمواصلات هي نقل الناس من مكان لمكان ، ولكن هناك فائدة أخرى لا تعلمها إلا الحاذقات الماهرات ألا وهي أن المواصلات - خاصة مع طول المسافات - أفضل من الخاطبة ، أي طريقة جيدة لاختيار العريس المناسب ودراسة ميوله وأخلاقه .<br />\" ي . س \" من الزقازيق صحفية وكانت تعمل بالقاهرة قبل أن تتزوج من صحفي يعمل بجريدة أخرى اعتادت مشاهدته يومياً في قطار الزقازيق بدأ الحديت عندما جلست بجواره يوماً ما وطلبت منه قلماً ، فلفت انتباهه الأوراق التي كانت بصحبتها وسألها عن عملها فأجابته أنها صحفية وقال لها أنه أيضاً صحفي ، في الحقيقة هي كانت تعلم لأنها رأت ذات مرة في يده ( أمر نشر ) ومنذ ذلك الحين كانت تتعمد الجلوس بجواره لأنه شخصيته أعجبتها ، حتى اعتاد هو أيضاً الحديث معها ومشاهدتها كل صباح ، فحقق لها رغبتها الدفينة عندما قرر التقدم لأهلها لطلب يدها .<br />أما \" ث . ش \" طالبة بالسنة النهائية بكلية الصيدلة جامعة 6 أكتوبر ، شدتها أناقة رجل كانت تراه في الاتوبيس الذي يوصلها للجامعة ، ومن حسن حظها كانت تركب الأتوبيس من بداية الخط ، كانت \" ث . ش \" مهتمة بأن تظهر بأبهى حلة أمام فتاها لتجذب انتباهه ، كانت تتعمد تارة الجلوس في أماكن ليراها وقت نزولها في محطة الجامعة ، وتارة أخرى تتعمد الجلوس بجواره ، ولكنها لم تكن تجلس بجواره بصفة مستمرة كي لا يعتقد أنها معجبة به ، استمر الحال هكذا طوال نصف السنة الدراسي الأول ، وفي التيرم الثاني بدأ هو في إلقاء تحية الصباح عليها ، وكانت تردها على استحياء شديد رغم أنها تتميز بجرأة شخصيتها ، ولكن هذه كانت ضمن خطتها للإيقاع به إذ كان يبدو عليه أنه خجول بعض الشيء ، وبالفعل نجحت خطتها ، وهي الآن مخطوبة لهذا الشاب .<br />- الآن حفلات الزواج لا تقتصر على وجود عروس واحدة فقط ، تقريباً كل البنات ينافسن العروس ليهربن من لقب \" عانس \" ليصبح حفل الزواج أو الخطوبة حلقة مفتوحة لاختيار شريك الحياة .<br />تتسائل \"أ . م \" طالبة جامعية قائلة : ما العيب في أن تسعى الفتاة وتبذل جهداً في البحث عن عريس بشرط أن يتم ذلك في إطار لا يقلل من شأنها ، ففي نظري هذا أمر عادي جداً وهناك فتيات كثيرات يذهبن للأفراح وليس في أذهانهن أصلاً موضوع العريس ، ولكن يحدث النصيب ويعجب بها أحد إخوة العريس أو أصدقائه ، ولكن في الوقت الحاضرلا وبكل صراحة نسبة التعمد وهاجس العريس متوافرة لدى نسبة كبيرة من الفتيات ممن يذهبن لهذه المناسبات خاصة وأن نسبة العنوسة في ازدياد .<br />أما \"م . ع \" مخطوبة ، ترى أن حضور الأفراح في الآونة الأخيرة بات من العوامل المحفزة جداً في الزواج خاصة للرجال كما هو الحال للفتيات ، بل إن هناك سيدات متخصصات \" خاطبة مودرن \" بفرز الأفراح ومعرفة العرايس والعرسان ومحاولة التوفيق بين \" راسين في الحلال .<br />وتستطرد \" م. ع \" في حديثها قائلة : المسألة في النهاية تبقى خاضعة للنصيب ولكن ، لا بأس من السعي .<br />\" هند عمر \" - طالبة جامعية - تقول حكاية فارس الأحلام الذي يأتي على حصان أبيض ليخطف الفتاة عفى عليها الزمن ، وبالتالي لم نعد ننتظر الفارس ، ولكن نسعى إليه بكل السبل المشروعة للزواج خوفاً من لقب عانس ، لذلك ليس معيباً أن تتأنق الفتاة وتتجمل لتبدو في أجمل صورها في المناسبات الاجتماعية ، بل إن الأمهات أيضاً والعمّات والخالات يقمن بدور \"الفاعل\" في هذا الأمر تشجيعاً لعروس المستقبل من خلال الحديث عن أدبها وأخلاقها أمام المعازيم!<br />\" ر. ن \" - مخطوبة - تؤكد أنه من حق أي فتاة في عصرنا الحالي أن تتنتهز أي فرصة فربما وجدت في النهاية العريس المناسب وليس معنى ذلك أن تهين ذاتها ولكن عليها أن تفعل ذلك بشكل لائق تماماًَ ، ففي حفل خطبتي ارتدت أختي ثوباً جميلاً للغاية وكانت سعيدة بي للغاية كوني أختها الصغرى وتعتبر نفسها مسؤولة عني نوعاً ما خاصة بعد وفاة والدي ، ومن هنا دفعتها الحماسة الشديدة للرقص كثيراً والغناء ، ولكونها غير متزوجة وأيضاً غير مخطوبة ، فقد فوجئت بخطيبي بعد الحفل يعلق بأن حركاتها ورقصاتها كانت مبالغ فيها كثيراً حتى أن أصدقائه ظنوا أنها مدعوة أو صديقة لي ترغب في اصطياد عريس .<br />\" ش . ع \" - زوجة - تحكي عن تجربة زواجها من إحدى المناسبات الاجتماعية ، حيث كانت بصحبة والدتها وإخوتها وذلك في إحدى الأفراح الكبرى ، ورغم هدوئها وعدم ميلها للرقص أو مشاركة الآخرين من الشباب والفتيات في الطقوس التي يقومون بها في الأفراح إلا إنها عثرت على نصيبها خلال هذا الفرح حيث أعجب بها شقيق العروس ليس من خلال وجودها او رؤيتها لها في الحفل ولكن عند رؤيته لها في شريط الفيديو وتم الالاتباط منذ 14عاماً ، تضيف \" ش \" قائلة : مسألة الزواج من خلال الأفراح ظاهرة قديمة ولكنها زادت في الوقت الحاضر ، إلا أنني أرى مبالغة كبيرة من الفتيات فهن يرتدين ملابس ساخنة ويبادرن للتمايل والرقص مع أصدقاء العريس ! ، لذلك فإنني لا أجد عيباً في الفكرة ذاتها ولكن يبقى الأمر متوقفاً على شخصية كل فتاة ، أو مدى قناعتها بما تفعله .<br />- وتحلل دكتورة سامية الساعاتي - أستاذ علم الاجتماع بجامعة عين شمس - ظاهرة البحث عن عريس في المناسبات بقولها : حضور الفتيات المناسبات الاجتماعية فرصة للحصول على زوج مناسب مسألة شائعة منذ زمن ، ولكنها أخذت أبعاداً أكبر في السنوات الأخيرة وذلك بسبب صعوبة الزواج ، وارتفاع نسب الفتيات اللاتي تجاوزن الثلاثين بلا حتى مجرد خطبة ، وعدد هؤلاء حسب الاحصائيات 9 ملايين في مصر وحدها ، ولا يخفى أن ارتفاع سن الزواج لبنت مرده إلى أسابا عديدة ، منها : زيادة نسبة تعليم الفتيات وخروج البنت إلى العمل ، فضلاً عن الظروف الاقتصادية الطاحنة والبطالة ، لذلك لم تعد تجد الفتاة أي غضاضة في ارتداء أجمل أزياء السهرة وأن تبدو في أحلى صورها فلربما أعجب بها أحد أصدقاء العريس ، واللافت أيضاً أن مناسبات العزاء كذلك أيضاً باتت تمثل فرصة ليرى الفتاة أي عريس مناسب ، فرغم الملابس السوداء والحالة النفسية ، إلا أن هناك حالات زواج حدثت بالفعل في مناسبات العزاء ، فالأمر بات عادياً طالما كانت الوسيلة مشروعة ومحترمة شريطة ألا تكون هناك مبالغة من جانب الفتاة لأن المبالغة تثير حفيظة الشباب وتأتي دائماً بنتيجة عكسية .<br />وتشير دكتورة سامية إلى دور الأم في تشجيع الفتاة وحثها على حضور مثل هذه المناسبات ، خاصة في ظل القلق المتوافر في من قبل الأمهات على مصائر بناتهن لاسيما ان كثير من الأسر تقيس تأخر سن زواج الفتاة بمعايير الماضي دون التنبه لظروف العصر الحالي وأزماته ، وكذلك في ظل المجتمع يبدو - للوهلة الأولى - منفتحاً إلا أنه في الواقع محدود العلاقات ، فكل أسرة أصبحت منغلقة على ذاتها ، وكذلك الجيران في مبنى واحد لا يعرفون بعضهم البعض إلا بشكل عابر ولعل هذا ما دفع بالعودة إلى زمن الخاطبة ، ولكن بشكل حديث الخاطبة الإلكترونية ومكاتب الزواج ، لذلك كله عادت من جديد ظاهرة زواج الصالونات والزواج عبر المناسبات الاجتماعية المختلفة .<br />- لوقت قريب عندما كانت تقرر البنت ارتداء النقاب، كانت تنقلب عليها أسرتها وخاصة أمها كي لا يفوتها قطار \"العدل\" أو حتى لا تتأخر في الزواج ، أما الآن فالوضع اختلف تماماً وأصبح الانتقاب والالتزام بحضور حلقات الدين في المساجد أقصر الطرق للزواج .<br />المسجد مجرد وسيط للتعارف، خصوصا خلال شهر رمضان الذي تتردد فيه الكثير من الفتيات علي المساجد، لأداء الفروض والنوافل المختلفة، حيث يطلب العديد من الشباب ممن يرغبون في الارتباط من أمهاتهم أو أخواتهم أو إحدى أقاربهم أن يبحثن لهم عن عروس مناسبة من بين الفتيات اللاتي يواظبن علي الصلاة بالمسجد، باعتبارهن أكثر التزاما من غيرهن.<br />وقد ساعد علي انتشار هذه الظاهرة حرص الفتاة المنتقبة علي تزويج قريبها الشاب من عروس منتقبة مثلها، وذلك لضمان حسن الخلق والالتزام الديني والدنيوي، وبالطبع يكون المسجد هو أنسب مكان يمكنها أن تتعارف فيه علي أكبر عدد من المنتقبات لتختار من بينهن العروس المناسبة، كما أن المسجد يتيح لها الفرصة لكي تراقب العروس المرشحة للزواج لفترة، وذلك لمعرفة مدي مواظبتها علي أداء الفرائض وحضور الدروس، ثم تبدأ في التعارف عليها، من خلال بعض الحوارات التي تكتسب من خلالها المزيد من المعلومات عن شخصيتها وأخلاقها وطباعها وميولها، لمقارنة ذلك بالمواصفات المطلوبة، أو علي الأقل لمعرفة حالتها الاجتماعية سواء كانت آنسة أو مطلقة أو أرملة.<br />تقول فتاة عمرها «18 سنة»: كنت أواظب علي صلاة الجماعة بأحد المساجد القريبة لمسكني، ولاحظت مراقبة إحدي السيدات لي وكانت تحاول في كل مرة أن تتحدث إلي ثم تتراجع، وعندما قررت ارتداء النقاب وذهبت للصلاة به لأول مرة، فوجئت بها تبارك لي علي هذه الخطوة في التقرب إلي الله، وتطلب مني عنوان مسكني أو رقم التليفون لكي تتصل بأهلي، وتطلب يدي للزواج من ابنها.<br />أما «ش.ج» «25 سنة» فتؤكد أنها في رمضان الماضي كانت تصلي التراويح بأحد المساجد، وكانت هناك سيدة تحرص علي الوقوف إلي جانبها دائما، وفي إحدي المرات صارحتها بأنها ترغب في تزويجها لابنها، الذي طلب منها البحث عن عروس، ملتزمة دينيا، من بين فتيات المسجد، وبالفعل تقدموا لأسرتها ووافقت علي الزواج، بعد أن وجدته الأسرة شابا ملتزما وجادا.<br />أما «ن.ع» 27 سنة فأخاها شديد التدين المتخذ الزهد في كل شيء منهجا لحياته، كوسيلة لإرضاء الله والتقرب منه، طلب منها أن تبحث له عن فتاة منتقبة أيضا علي أن تكون شديدة الالتزام، وتقبل أن تشاركه حياة الزهد، بكل ما فيها من مصاعب، وبالفعل بدأت تبحث له بين فتيات المسجد عن عروس تقبل هذه الشروط ، حتي تعرفت علي فتاة تحرم علي نفسها مشاهدة التليفزيون، ولا تشرب إلا من الإناء الفخاري كبديل عن المبرد الكهربائي، ولا تجلس إلا علي الحصائر بدلا من السجاد، خوفاً من أن يحاسبها الله علي هذه النعم، إذا ما لم توفيه حق شكره عليها، وهنا أيقنت «ن.ع» أن هذه الفتاة هي أنسب عروس لأخيها.<br />«و.ح» «24 سنة» تشير إلى أنها اقترحت علي أخيها الكثير من زميلاتها لكي يختار عروسا منهن، وذلك لتأكدها من سمو أخلاقهن جميعا، لكنه رفض الارتباط بأي واحدة منهن، وطلب منها البحث له عن عروس تكون أكثر تدينا، من اللاتي يواظبن علي أداء صلاة التراويح بالمسجد، لذلك قامت بإجراء العديد من الحوارات مع فتيات لا علاقة لها بهن، لكي تتقرب إليهن واختارت الأنسب له، وذلك حتى تعرفت علي فتاة حديثة التخرج، تبادلت معها الاتصالات التليفونية والزيارات، حتى يتعرف عليها هو الآخر وعندما أعجب بها تم الارتباط.<br />ولكن كيف يتعرف الشاب علي العروس المرشحة؟ الأمر ليس معقداً بل غاية في البساطة، فقط ينتظر الشاب خارج المسجد وعندما يشاهد قريبته في طريقها إلي الخارج، يتأمل جيدا الفتاة التي تسير معها، ويحاول أن يأخذ فكرة عامة عن مظهر الفتاة ومستواها الاجتماعي، ثم تتجرأ الوسيطة بعد ذلك وتطلب منها صورة شخصية ليراها العريس قبل أن يقرر الذهاب إلي بيتها ليطلب يدها، وفي أغلب الأحوال ينتهي الأمر بالتوافق ويتم الزواج سريعا، والله أعلم بعواقبه فيما بعد ."
