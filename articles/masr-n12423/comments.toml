subject = "من مذكرات عانس"
text = "من مذكرات عانس<br />هي: ألو : بوليس النجدة<br />الظابط: أيوة<br />هي: انت ظابط ؟<br />الظابط: تحت أمرك يا فندم<br />هي: انتم ممكن توصلوا عندى فى أد إيه ؟<br />الظابط: إيه بلاغك ؟<br />هي: هقولك.. أنا فى المهندسين.. عارفها شيك أوى<br />الظابط: أيوة<br />هي: ها.. ممكن تاخدوا أد إيه علشان تلحقونى.. ها<br />الظابط: يا هانم إيه مضمون البلاغ<br />هي: احتمال.. اغتصاب<br />الظابط: يعنى ايه ؟<br />هي: يعنى فيه احتمال كبير اقوى إنى أغُتصب<br />الظابط: يا هانم.. مفيش الكلام ده.. إحنا هنا علشان نتلقى بلاغات حوادث بتحصل<br />هي: يعنى أستنى لما يغتصبونى الأول وبعد ما ياخدوا راحتهم معايا أبقى أتصل بيكم وانا بستحمى تانى يوم مثلا<br />الظابط: أنا ما قلتش كدة.. يا فندم.. بس إحنا للحالات الطارئة.. وسيادتك ممكن تقدمى بلاغى فى أقرب قسم<br />هي: يا نهار اسود.. ما هى دى طارئة وبتحصل مرة.. هو أنا هيغتصبونى كل يوم<br />الظابط: مش القصد يا هانم<br />هي: جرى إيه يا ظابط.. ولا انت مش ظابط.. انت مش حاسس بمعاناتى ليه ؟!.. مقدرش أنزل أروح القسم.. ما ينفعش.. أصل الذئاب البشرية.. واقفين فى الشارع<br />الظابط: لمؤاخذة يا هانم فى السؤال.. سيادتك بقى عرفتى وتأكدتى منين إن اللى وافقين فى الشارع عاوزين يغتصبوا سيادتك ؟<br />هي: عرفت منين.. إلا عرفت منين.. ده أنا أنثى.. ومتفجرة.. وأفهم كويس قوى فى الرجالة وبصاتهم ده أنا تربية زنقة متروهات.. هئ هئ<br />الظابط: طيب يا افندم بلاش ساعدتك تنزلى من أساسه لغاية ما اللى عاوزين يغتصبوا سعادتك يمشوا<br />هي: جرى إيه يا ظابط.. بقولك لازم أنزل.. يعنى هيّ توحة أحسن منى فى إيه.. دى حتة معضمة وما فيهاش أى أنوثة ومعيوبة فى جسمها ، ولحقتوها قبل ما تغتصب.. جوزها من يومها شايلها فى عينه<br />الظابط: يا فندم أنا مليش دعوة بتوحة ولا غيرها سعادتك فيه بلاغ ولا مفيش<br />هي: يا سلام.. ما هو ده البلاغ.. كنت عاوزة أعرف انتم هتوصلوا عندى فى أد إيه علشان أحسبها ، وأنزل قبل ما توصلوا بدقيقة وأمسك فى عيل من اللى واقفين وأصرخ.. وألم عليه الشارع تروحوا قابضين عليه ، وبعد كدة أمشى فى الشارع كله.. أقول إنى كنت ح أغتصب.. يمكن راجل من القفوات يحس على دمه ويعرف إن فيه أنثى ومتفجرة ساكنة فى الشارع.. يجى يتقدم لى.. قطيعة تقطع الجواز وسنينه.. ألو.. ألو.. إيه ياختى ده.. ده باين قفل السكة قطيعة إذا كان بوليس النجدة ما استحملنيش.. قال عاوزة عريس.. لما أقوم بقى أرمي العيال بالطوب من البلكونة.. يمكن<br />منقوووووووووووووول"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 81
subject = "عندى تلاتة و عشرين سنة و خايفة اعنس"
author = "مش لازم"
text = "يا جماعة انا مش بس خايفة اعنس انا بحاول انى احضر نفسى لموضوع العنوسة دة من زمان انا و الله مش وحشة و بنت ناس و جامعية و والدى يعمل باحدى دول الخليج المشكلة عندى انى علاقاتى الاجتماعية ضيقة جدا و مليش اصحاب كتير لانى كنت عايشة مع اسرتى فى الخليج حتى لما جيت مصر معرفتش اعمل اصحاب كتير و البنتين اللى صحبتهم ايام الجامعة اتجوزوا و كل واحدة راحت لحالها و بصراحة قريبى مبشفهمش كتير يعنى كل واحد منهم مشغول بحالة حتى الجيران كل واحد منهم قافل على نفسة باب بيتة و محش بيكلم حد و للاسف لغاية دلوقتى كمان ملقتش شغل دة انا احيانا بفكر لية ميعملوش خلطبة زى بتوع زمان و انا اروحلها عشان تدورلى على عريس ازى كان البعض بيشعر ان الخاطبة دى تخلف فى ناس علاقتهم الاجتماعية ديقة اوى و محتاجين لحاجة زى الخاطبة .و على فكرة فى ناس كتير بيعنسوا عشان خاطر ان مالهومش حد يجبلهم عرسان و شكرا"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

