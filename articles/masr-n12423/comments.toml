subject = "تسعه من البنات لا يتزوجها الرجال, متزعلوش يابنات"
text = "تسعه من البنات لا يتزوجها الرجال, متزعلوش يابنات<br />السلام عليكم ورحمة الله وبركاتة<br />فتاة الأولى .. الغيورة<br />أول هذه الصفات التي ينفر منها الشباب في زوجاتهم في المستقبل هي الغيورة ,وهي هنا<br />بمعنى الشك ,فهم يطالبون ببعض الغيرة والتي تقوي الحب ولكنهم يرفضون الشك الذي<br />يعني الجحيم في الحياة فهم يريدون الثقة من زوجاتهم ولا يريدون أن يقدموا كشف حساب<br />عن كل خطوة يخطونها....<br />الفتاة الثانية .. المتملكةاما ثاني صفة فهي التي تتسم بحب التملك الزائد والسيطرة وهي تريد من زوجها الحب كله والخضوع والأستسلام لها فقط وتغضب إذا رأت زوجها يهتم بأحد آخر أو يحب إنسانأ غيرها فهي كمثال تغار من عائلة زوجها وأصدقائه ولكن هذه التصرفات قد تؤدي إلي مشكلات كثيرة فهي بذلك تقضي على شخصية زوجها وتسبب له المشاكل مع عائلته ويجب ان تفطن هي انها عائلته ولن يتخلى عنهم وهم لن يتخلوا عنه او يبتعدوا عنه فهي بذالك تجعله يكره الحياة الزوجية وهذا لا يعتبر حباً بل هو تملك وسيطرة...<br />الفتاة الثالثة.. المتمردة<br />هي الزوجة التي لا ترضى بمعيشتها وهي دائماً في حالة تدمر وشكوى من كل شيء ليست مقتنعة بما لديها ودائماً تريد المزيد وهي بذالك تضغط على زوجها حتى ينفذ لها رغبتهــــا<br />ولا يهمها من أين يأتي الزوج بكل هذه الطلبات وكيف يحصل على المال وهي نوع من الزوجات ( مدمر) لأنها تبحث عن نفسها وسعادتها وهي فقط والتي تتمثل في المال وليس في الحب وهي بذلك لا تحافظ على زوجها او بيتها وكثيراً ما تنتهي هذه الحالات باطلاق...<br />الفتاة الرابعة .. ألا مبالية<br />هي غير جديره بلقب الزوجة فهي لا تهتم بزوجها أطلاقاً ولا ببيتها ولا تحاول تلبية حاجاته أو مطالبه من حسن معاشرة او الأهتمام بشؤون المنزل اليومية وهنا يشعر الزوج بأنـــها لا تحبه او لا تهتم به وقد يؤدي هذا الى الشعور الى القسوى معها لمحاولة تقويمها ولكن اذا كانت الزوجة هذه صفاتها فمن الصعب تغييرها ويصبح الزوج غير مهتم بها ايضاً وغير متعاطف معها في اي شيئ مما يؤدي الى الفرقة وعدم الترابط فيجب التعود من الان على الأهتمام بالزوج ...<br />الفتاة الخامسة .. الطفلة<br />هي التي تكون على علاقة دائما بأمها ومرتبطة بها دائما ومعتمدة عليها في كل شيء وتتصرف بخجل وعدم تحمل المسؤولية وغالباً ما تكون امها هي المتحكمة والمسيطرة في المنزل كله فتلجأ إليها الأبنة في كل شيء مثلما كانت تفعل وهي طفلة وهي بذلك لا تصلح زوجة حتى لا تصلح أماً لأبنها لأن الأطفال سيصبحون منفصمين الشخصية وبالنسبة إلى الزوج فسيشعر بأنه قد تزوج حماته فهي التي تصرف كل أموره فيجب على الفتاة ان تتحمل المسؤولية والتصرف بنضج..<br />الفتاة السادسة .. الغائبة<br />هي غالبا ما تكون الفتاة العاملة إنما هناك فرق بين أن تعمل الزوجة وأن تغيب عن بيتها بمعنى أن هناك الكثيرات يعملن ولكنهن يقمن بجميع اعمال البيت ومهتمات بشؤون ازواجهن واولادهن ولا يعوقهن عملهن عن الأهتمام بكل هذه المسائل فلابد أن توازن الزوجة بين عملها وزوجها وأطفالها ولا تحرمهم منها بحجة عملها فيفقد زوجها الأحساس بقربها منه مما يؤدي إلى وجود هفوة ومشاكل بينهما...<br />الفتاة السابعة .. الضعيفة<br />هي الفتاة التي تعودت على الإستسلام لما حولها سواء عائلتها أو صديقاتها فهي تعجز عن أتخاذ أي قرار بنفسها ولا تحاول ان تبدي اية مشاورة او رأي .. ضعيفة الشخصية ومنقادة ولم تتعود على تحمل المسؤولية وغالبا ما يكون اهلها السبب في ذلك بقسوة الأب وصرامة الأم ويفقد الزوج في هذا الشريك الناصح الذي يشاوره في اوموره ...<br />الفتاة الثامنة .. الموسوسة<br />هي التي تتصور عن زوجها أسوأ الأشياء مثلاً أن يصاب ببعض المغص فتضخم الأمر وتعتقد في داخلها أنه أصيب بالمصران الأعور وعندما ترتفع درجة حرارته تقول قد اصيب بحمى وعندما يتأخر تعتقد أنه قد أصيب بحادث او وقع له مكروه .. ان بذالك تطارده بالوسواس والخيالات ...<br />الفتاة التاسعة .. الكاملة<br />هي التي تحرص على أن تفعل الشيء السليم وتبالغ فيه حتى يخرج بمنتها الدقة والأحكام حتى ولو كان على حساب أعصاب من حولها وهي تؤدي بذلك إلى درجة عالية من العصبية في الحياة الزوجية فهي تنشد الكمال في كل شيء فإذا ذهبوا الى صديقة فلا بد من تكون الهدية قيمة وغالية وفي غلاف جذاب وهكذا ... ويمكن لهذا الأحساس ان يدفع بزوجين الى التوتر والأنفعال ويمكن أن يتحول الزوج إلى رجل عنيد ويتمرد على كل ما تفعله ولو كان من أجله ولا يهمه أرضائها ..<br />والأن أبحثي يا عزيزتي عن نفسك عن أية صفة من هذه الصفات أنتي تمتلكي<br />تحياتى"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

