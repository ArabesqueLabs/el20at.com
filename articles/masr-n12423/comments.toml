[[comments]]
order = 52
subject = "عجيبه"
text = "المشاركة (39)<br />من: اسامة نبيل<br />التاريخ: 24-06-2007<br />العنوان: السلام عليكم<br />بسم الله الرحمن الرحيم<br />في البداية ارحب بكي.. لكني في الحقيقة مستغرب ان هذا الراي يكون من موقع ينتهج المنهج الإسلامي... أو هكذا يقال إلا إذا كانت هناك اشياء أخرى وكان إسلام أون لاين أحد الخروقات التي يخترقنا بها الغرب للتأثير علينا بشكل أو بأخر..<br />اذكرك يا ناهد بأن الله عاتب نبيه داوود عندما حكم لصالح الأخوين الذي قال له إن أخي له 99 نعجة ولي نعجة واحدة ويطلب ضمها له.. عاتب الله داوود لأنه لم يستمع لرأي الأخر.. ربما كان للقضية مدخل أخر وربما نتيجة أخرى.<br />انتي استمعتي لوجهة نظر واحدة ربما امرأة واحدة وربما امرأتين لكنك بالتأكيد غفلتي عن آراء أخرى تعيش في زهو من العيش مع أزواجهم من الملتزمين كما تسمينهم.. ثم هل نحن أصبحنا كمسلمين موزعين على ملتزم وغير ملتزم وأصبح كل واحد يحارب الأخر.. لا نحن مسلمون فقط.. ولن نقبل أي توزيع أدوار إلا أن لكل فرد رقيب وعتيد يتابع تصرفاته التي سيحاسبه عليها الله يوم القيامة.. ولسنا نحن من يحق له محاسبة الناس على تصرفاتهم لأننا مثلهم نخطئ ونصيب.. السيدة ناهد أو الآنسة ناهد لقد أخطأتي حين عممتي حكمك على كل الناس وأخطأتي أكثر عندما اعتبرتي الملتزم أخواني ورغم أني لست واحدا منهم إلا أني مختلف معك تماما.. ولي طلب أخير هو أن تحاولي التقرب ممن تزوجن من رجال غير ملتزمين واحكمي عليهن مثلما حكمتي على المتزوجين من ملتزمين.. أنا متأكد أنك ستغيرين رأيك لأن المرأة التي تخشى على نفسها من رجل يمنعها العمل اعتقد انها تخشى أكثر رجل لا يقدر المسئولية.. وصدقيني وأنتي انثى وتعلمين ذلك أن المرأة تحب رجلا تعيش تحت حمايته لانها انثى أكثر من أنها تلتقي رجلا تعيش معه وتكون هي صاحبة القرار..<br />شكرا لكي ووفقكي الله<br />اسامة نبيل<br />صحفي بالدستور<br />المشاركة (40)<br />من: ولاء الشملول<br />التاريخ: 24-06-2007<br />العنوان : مجرد حجر فى بركة راكدة<br />مقال أكثر من رائع أستاذة ناهد<br />اتفق معك تماماً<br />فالمواهب النسائية المدفونة كثيرة بفعل المجتمع أو الرجل أحياناً اخرى<br />بارك الله فيك وفى قلمك<br />قرأت المقال قبل ان ترسليه على اسلام اون لاين"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 53
subject = "سبارتاكوس Spartacus"
text = "سبارتاكوس Spartacus العبد الذي خاض الثورة ضد الرومان التي سميت ثورة العبيد الثالثة(ت في عام 71 ق).محيث اسر وبيع كعبد لاحد الرومان الذي كانت لدية مدرسة لتدريب العبيد لاستخدامهم كممبارزين ومصارعين في حلبات خاصة تقام لاجل المتعة. ثار هو والعبيد الاخرين الذين كانوا معه. والحقو هزائم عديدة بالجيش الروماني إلى ان قتل في اخر معركة وبموتة انتهت الثورة وصلب العبيد الاخرون في الساحات العامة.<br />[تحرير] فيلم سبارتاكوس<br />قام المممثل الأمريكي الشهير كيرك دوجلاس ببطولة فيلم سبارتاكوس عام 1960م ، حيث جسد شخصية سبارتاكوس وقصة الثورة التي قادها ضد الرومان."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

