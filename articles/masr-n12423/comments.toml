subject = "حكايتي"
author = "Amr_not_Amr"
text = "طيب كله بيشكتي من الماديات والفلوس ... أنا هاحكي لكم حكايتي ببساطة ...<br />أنا واحد إنسان -يعني بشر- خلقة ربنا ... دخلت كلية طب نتيجة ضغوط دولية وإقليمية ... وفي سنة تالتة طب كان خلاص هييجي عاهات نفسية بسبب الكلية ... سبتها &--65271;ني شاطر في أحد مجالات الكمبيوتر النادرة بفضل الله ... واشتغلت الحمد لله على طول ... أول شغلي كان مرتب 800 جنيه ... بعد سنة مرتبي بقى 3000 جنيه تقريبا ... يعني إيه؟ يعني مافيش مشكلة في الفلوس ... وحصل ا&--65269;تي ...<br />1- رحت ا&--65271;ول اتقدمت لإنسانة اخترتها ... من أول ما شفتها في شغل رحت بعت لها ومن غير لف ولا دوران وصلت لها إني عايز اتقدم لها ... واتقدمت بعد جمع المعلومات المبدئية المطلوبة ... وأهلها ما رفضوش ورحبها أحسن ترحيب وأنا كنت سعيد ... هيا كانت أكبر مني ... بس مش هتفرق معايا أنا عايز واحدة تساعدني في طموحي وتسندني ... جه أهلي رفضوا رفض شديد للغاية ... والدي ووالدتي يعني ... ليه؟ أصلها مش جميلة قوي وقال إيه أنت -اللي هوا أنا يعني- تستحق أحسن منها ... وكمان أكبر منك وكلام كده مالهوش لزوم ... عملت كل اللي في وسعي وكانوا عند رفضهم ... وأنا ما اقدرش اتزوج واحدة أهلي مش قابلينها ... أنا عايز واحدة أسعدها ومش هاسمح لحد يأذيها في يوم بكلمة ...<br />2- بعدها أختي رشحت لي واحدة صاحبتها ... أصغر مني ... وناس محترمين ... رحت شفتها واتعرفت على والدها -برة البيت طبعا ا&--65271;ول- وبعدين كلمت والدها في الموضوع ... ويا عم الحاج أنا الحمد لله باشتغل ومرتبي كويس ولو عايز تأخر إتمام الزواج لغاية ما ربنا يكرم بنتك وتخلص دراسة مافيش مشاكل و وضعي كذا كذا في الدراسة وعايز أعف نفسي ... هوا كان إنسان ذوق بصراحة ... طبعا فهمته إني مش موافق يعني إنما لسه محتاج أقعد معاها ونتكلم مرة ع ا&--65271;قل معاه برة البيت عشان استقر على رأي .... بس هوا اختصر عليا الطريق ورفض ... رفضت ليه يا عم الحاج؟ أصلك مش معاك شهادة ... طيب ما أنا فهمتك إني مش ضايع ولا حاجة وإني بالفعل عندي فرص شغل في شركات متعددة الجنسيات وإني بفضل الله متميز جدا في شغلي بشهادة الجميع ...<br />فدول مرتين ... بعدها نفسي اتسدت ... آه والله اتسدت ... يعني لما إنسان الحمد لله -سمعتي طيبة والناس تعرف عني كل خير بستر ربنا عليا - وباشتغل ومرتبي يفتح بيت كويس وأهلي ناس كويسين اجتماعيا وماديا ... وشغال مهندس يعني شغلانة كويسة ... واترفض ... يبقى ده إيه؟ غباء يعني وللا قلة دين وللا إيه؟ ... وعلى فكرة اترفضت أكتر من مرة لنفس السبب يعني المثال ده ما كانش المرة الوحيدة ..."
archived = "2007-12-10"
capture_url = "https://web.archive.org/web/20071210235700/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 46
subject = "ممتاز"
author = "مها بدوي"
text = "والله العظيم 100 100 ياولاء على فكرة مقالك ده زي العسل والسكر وأنا في رأي إنه معبر بطريقة جميلة عن كل الأحاسيس اللى بتمر بها البنت اللي شر بره وبعيد عانس على فكرة أنا متزوجة وعندي طفلين بس بصراحة عندي اصدقاء كتير لسه مش متزوجين وعلى فكرة في أوقات كتيره أنا بحسدهم إنهم مش متزوجين لإن للأسف عدد كبير من الأزواج المصريين فاهمين الحياة الزوجية والرجولة غلط لدرجة إنهم بيخلوا الست تتمنى إنها لسه بحريتها مش قصدي إننا بنعمل حاجة غلط لكن الأسئلة الكتير اللى من غير لزمة مملة وبتخلينا نكره العيش والعيشة واللى عايشنها (على رأي الأستاذ محمد صبحي) بس برضه أنا شايفه إنك جميلة وحلوة وزي العسل ولو عندي أخ مش متزوج والله كنت خطبتك له على طول بس نعمل إيه يا حبيبتي الرجالة إنطست في نظرها."
archived = "2007-12-10"
capture_url = "https://web.archive.org/web/20071210235700/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 47
subject = "إلى عمرو ومها بدوي"
author = "ولاء الشملول"
text = "العزيز عمرو<br />نحن بحاجة الى ثورة اجتماعية نغير فيها الكثير من مفاهيمنا ومعتقداتنا وتعاملنا مع الحياة<br />وانت ضحية لمعتقدات بالية نعاني منها جميعا<br />فى اوربا والدول المتقدمة لا يحدث ما حدث معك<br />اصدقائي فى الخارج يرون لى العجب من الزواج فى حجرة<br />او شقة استديو<br />او شقة 25 متر<br />او الزواج مع اهل احد الزوجين...مع عدم اكمال الدراسة يعني الناس برة بتتزوج وهي طلبة ويبنيان نفسيهما معا<br />ولكننا للأسف نأخذ من الغرب اسوء ما فيه<br />ونترك افضل ما يفعل<br />هذا يحدث فى الدول اللى الناس فيها مخها نضيف<br />لكننا للاسف عندنا فى دماغنا تراب وعنكبوت واشياء اخرى<br />وفى النهاية الشباب هو الذي يدفع الثمن<br />لكن لا تياس ستجد اه%"
archived = "2007-12-10"
capture_url = "https://web.archive.org/web/20071210235700/http://masr.20at.com:80/newArticle.php?sid=12423"

