[[comments]]
order = 73
subject = "ما تزعلوش يا بنات ان قلنا بصراحه"
text = "الولد بيحب البنت اللى<br />أولا : الولد بيحب البنت الرقيقة<br />رفعوا صوتكم يا بنات .<br />و أول ما تشوفى حاجه وحشة .. سورقى (يغمى عليكى) من كتر الرقة<br />عيطى كتير . العياط دليل<br />على الاحساس المرهف . أوائى له ..<br />نكدى عليه الليلة<br />ثانيا الولد بيحب البنت الرومانسية<br />اسرحى كتير كلميه عن القمر و حاجات من دى .قوليله شايف القمر يا عتريس<br />لازم تكونى هيمانه و انتى بتتكلمى . و يكون صوتك واطى<br />وشوشة<br />ثالثا : الولد بيحب البنت المؤدبه<br />قولى له انه اول واحد فى حياتك حتى لو كنتى متجوزة قبل كده و حامل فى توأم..<br />و لو سأل على انتفاخ بطنك قولى له كيس دهنى<br />و لو عارف و متأكد انه كان لك علاقات كثيرة مثله<br />دى كلها اشاعات ده هما اللى كانوا معجبين بيا لكن انا ولا سألت فيهم كلهم<br />رابعا : الولد بيحب البنت الاستايل style<br />كل ما تشوفى حاجه جديدة قلديها . يقولوا الموضه الشعر الاصفر<br />اضربيه اصفر .. الموضه القصير .. قصريه ..<br />مش مهم شكلك ايه .. ماتصدقيش اللى تقولك ما تخديش من الموضه الا اللى يناسبك ..<br />دى بتغير منك و مش عايزاكى تبقى على الموضه .<br />ملحوظه : لو مش عارفه ايه<br />الموضه اختارى لك واحدة معينة او مذيعة و<br />قلديها .. خليكى نسخة منها .<br />خامسا :الولد بيحب البنت الدلوعة<br />ادلعى ياختى انت و هى . ما تبقوش مسترجلين نفسكو كده .<br />سادسا : الولد بيحب البنت الجذابه اللى بتكون محور اهتمام الآخرين<br />فهميه ان في آخرين كتير معجبين بيكى<br />و قولى له : ارجوك اوعى تغير انا حواليا كتير .<br />ولا بيهمنى أبدا منهم ايه يعنى اكون حلوة فى عينهم .<br />ألفى قصص وهمية عن الأولاد الهيمانين فيكى و اللى انتى<br />مدوخاهم<br />بسحرك<br />و جمالك .<br />سابعا :الولد بيحب البنت اللى بتحسسه برجولته و تحسسه بنفسه<br />ايه ده ! .. ايه العضلات دى كلها<br />دى احلى عضلات شفتها فى حياتى .<br />يا سلام !! ايه الشيا كة دى كلها . انت أشيك ولد شفته فى حياتى .<br />مش مهم هو لابس ايه . انبهرى و خلاص ) .<br />يا سلام !! انت تقاطيع وشك حلوه بشكل ( حتى لو كانت ملخبطه<br />و طول مانتى قاعده اشكرى فيه خليه كده قاعد نافش ريشه . و فرحان<br />بنفسه .<br />ثامنا : اتمحكى فيه خليكى دايما معاه<br />كل شويه كلميه فى التليفون بأى حجة . قابليه فى كل حته يروحها<br />إعملى عليه كماشة . بحيث مايعرفش يفلفص منك<br />و لا يشوفش غيرك ادامه . روحى له الشغل<br />تاسعا عددى مواهبك<br />اكلك لازم مظبوط<br />قوليله انا ملحى فى الاكل لا كتير ولا قليل وبعمل شاى سكر زياده .<br />وبلون البيض المسلوق .<br />عاشرا : رغم حبك الشديد للحريه والانطلاق<br />قوليله انت مالك وقتى وتفكيرى مش عارفه اعمل حاجه الا انى افكر فيك<br />مليت على ايامى شغلت لى الزمن<br />النتيـــــــــــجــة<br />لو الولد وقع فى دباديبك و قال عاوز يرتبط بيكى : اوعى تقولى ايوه !<br />لااااا .. اتقلى شوية . اعملى نفسك يتفكرى .. سهريه ..<br />لوعيه<br />بهدليه .. لكن ماتتقليش العيار ليطير منك .<br />لو الولد ما سألش فيك و لا عبرك . و لا أخد باله منك أصلا<br />يبقى بنت تانيه سبقتك ليه .<br />ملحوظة : كررى الخطوات من 1 - 10مع ولد تانى بعد<br />جمع المعلومات اللازمة عنه<br />وربنا يقدم الى فيه الخير"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 74
subject = "انتو السبب فى العنوسة"
author = "احمد حسن"
text = "انا عايز اتجوز بس كل واحدة بتقول شقة وامك لالا عمتا انا عندى الشقة ومسافر وعايز انزل اتجوز انا اشتغل فى شركة فى دولة قطر محاسب فى الشركة براتب 4000 وابحث على زوجة جادة جداا وجميلة اه على فكرة انا عندى شقة فى الشرقية وعندى شقتين فى المعادى فايدة كامل وعايز وحدة جادة بدون شروط اه انا بقالى ثلاث ثنوات مسافر ومستعد للاى مطالب بس بمزاجى متبقاش فرض للتصال 009746739432 او 009746995760 الشقة 5 غرف و2 حمام ومطبخ وريسبشن الشقة0 27 متر يعنى الحصان يجرى فيها متشطبة سوبر لوكس من كلة يعنى الى تتجوزنى تيجى بهدومها<br />انا نازل فى 7- 2 - 2008 سلاممممممممممممممم"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 75
subject = "متزعلوش يا بنات"
text = "متزعلوش يا بنات<br />أغبى امرأة تستطيع أن تخدع أذكى رجل\"<br />\"المرأة قد تصفح عن الخيانة ولكنها لا تنساها\"<br />\"قلب المرأة لؤلؤة تحتاج إلى صياد ماهر\"<br />وأتذكر هنا قول سقراط:<br />\"عبقرية المرأة تكمن في قلبها\"<br />\"المرأة لم تخلق لتكون محط إعجاب الرجال جميعاً<br />بل لتكون مصدراً لسعادة رجل واحد..\" \"اتيان راي\"<br />\"عندما تبكي المرأة ..تتحطم قوة الرجل\" \"شكسبير\"<br />المرأة قلعة كبيرة اذا سقط قلبها سقطت معه\" \"أنيس منصور\"<br />\"الرجل لا ينسى أول امرأة أحبها..والمرأة لا تنسى<br />أول رجل خانها\" \"حكيم\"<br />أحسن طريقة لتجعل امرأة تغير رأيها هو أن توافق عليه<br />الشيطان استاذ الرجل وتلميذ المرأه .<br />المرأه مثل العشب الناعم ينحني امام النسيم ولكنه لاينكسر للعاصفه .<br />\"المرأة الفاضلة تلهمك..والذكية تثير إهتمامك<br />والجميلة تجذبك..والرقيقة تفوز بك\"<br />\"ستظل المرأة لغزاًمجهولاً ..في الوقت الذي يعتقد الرجل<br />أنه قادر على حله\"<br />قال الشاعر يصف حياء المرأة واحتجابها :<br />من الأوانس مثل الشمس لم يرها *** في ساحة الدار لا بعل ولا جار<br />\"حياة المرأة كتاب ضخم مكتوب على كل صفحة من صفحاته<br />كلمة ..حب\" \"شوبان\"<br />\"المرأة زهرة لا يفوح أريجها إلا في الظل\" \"لاينباي\"<br />\"اهرب من المرأة تتبعك..اتبعها تهرب منك\" \"فيلسوف\"<br />\"المرأة كالزهرة إذا اقتلعت من مكانها تتوقف عن الحياة\" \"شكسبير\"<br />قال بشار بن برد على لسان جارية حسناء: قالت ولا ذنب لي إن كنت جارية***قد خصني بالجمال الخالق الباري<br />إذا بديت رأيت الناس كلهم***يرمون نحوي بأسماع وأبصار<br />قتلت من كان قدامي بحسرته***وجن من كان خلفي عند إدباري<br />\"تظل المرأة في سن العشرين..حتى آخر لحظة من حياتها\"<br />تعلمت المرأة من الحية:الرقص..والغدر..وطول اللسان\"<br />طبعا ليسوا كلهم.<br />\"تشعل المرأة النار بإبتسامتها..وتحاول عبثاً أن تطفئها بدموعها\"<br />\"لا تكون المرأة أماً بولادتها بل بتربيتها لأولادها\"<br />\"المرأة بلا فضيلة.. كالوردة بلا رائحة \"<br />\"آخر ما يموت في الرجل قلبه وفي المرأة لسانها\"<br />\"\"قلب المرأة هو أسرع الأنسجة الى الكسر وأسرعها الى الإلتئام..\"<br />\"متى أطفأت الشموع تساوت النساء جميعاً\"<br />\"لو جردنا المرأة من كل شيء لكفاها شرف الأمومة\""
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

