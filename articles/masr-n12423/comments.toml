[[comments]]
order = 5
subject = "رائع يا ولاء"
author = "عمرو مجدي"
text = "كما عهدتك دائما، صحفية لامعة وكاتبة متمكنة من تلابيب الكلام ..<br />لم أكن أعرف إنك بلغت الثلاثين .. لكن مشكلتك ومشكلة كل شاب وفتاة في مصر والعالم العربي والله تصيب الإنسان بالكمد<br />لو أن أحداً من خارج كوكبنا نظر لعدد الفتيات اللاتي وصلن ال 30 أو 35 ولم يتزوجن، سيخيل إليه أن الرجال انقرضوا من كوكبنا .. ولو نظر أحدهم من خارج كوكبنا لعدد الرجال الذي بلغوا نفس السن ولم يتزوجوا لتخيل أن النساء انقرضن من كوكبنا!!<br />فين المشكلة . . المشكلة هنيجي يوم القيامة ونحن نمسك في زمارة كل مسؤول عربي، حكام النفط والنهد والذهب .. الذين أفقروا شعوبهم ليقتاتوا على همومه وطحنه في الحياة.<br />والله كثير من مشاكلنا في دنيانا فعلا سببها العنوسة سواء للشباب أو البنات<br />لكن نقطة مهمة جداً ذكرتيها ، وأحب أعلق عليها ..<br />قولتي إن كدا كدا مش فارقة ، لإن الزواج مش معناه الراحة<br />وهنا أختلف معك جدا .. صحيح إن الزواج الأيام دي بقى همّ ومسؤولية ومشاكل ، لكن نوعية المشاكل تختلف كثيراً<br />ومشاكل المتزوجين أرحم كثيراً من غير المتزوجين ، وتأثيرها على المجموع - أعني المجتمع - أخف ضراراً في المجمل<br />ثم إن مشاكل المتزوجين غالبا ناتجة عن أمراض أخلاقية، أو سوء اختيار تسببت فيها العنوسة وقلة العرض والطلب! يعني العنوسة أيضا هي أحد أسباب تزايد مشاكل ما بعد الزواج.<br />أما مشاكل غير المتزوجين فهي مشاكل مركبة ، وصعب حلها بخطبة شيخ أو موعظة واعظ ، أو نصيحة صديق .. ولكنها تتنوع ما بين بطالة وغلاء وزفت تسبب فيه ملاعيين حكامنا، وكذلك مشاكل اجتماعية وتأثيرات عولمة .. الخ، فهي إذن مشاكل معقدة ومركبة وتحتاج لسنوات للقضاء عليها ..<br />أحييك .. وربنا يرزقنا جميعا راحة البال .."
archived = "2007-11-15"
capture_url = "https://web.archive.org/web/20071115121212/http://masr.20at.com:80/newArticle.php?sid=12423"

