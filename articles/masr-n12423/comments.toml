[[comments]]
order = 68
subject = "القس لو بوستون احد المتهمين بالتحرش الجنسي بالاطفال"
author = "benkerishan.blogspot.com"
text = "فضائح القساوسة الجنسية تصرف الغرب عن المسيحية وهيبة الكنيسة الكاثوليكية على المحك<br />فضائح القساوسة الجنسية تصرف الغرب عن المسيحية وهيبة الكنيسة الكاثوليكية على المحك<br />القس لو بوستون احد المتهمين بالتحرش الجنسي بالاطفال<br />كتب السيد أبو داود :<br />انحرافات القساوسة الجنسية كانت بمثابة الزلزال الذي أصاب الكنيسة الكاثوليكية وأزعج الفاتيكان أيما إزعاج لأنه طعن في صميم مصداقيتها ، بل امتدت هذه المصداقية في نظر المواطن الغربي إلى المسيحية نفسها كدين . ولعل هذا ما دفع مجلة التايم الأمريكية إلى إعداد ملف شامل عن الموضوع أعدته الكاتبة جوانا ماكجيري تقول فيه :<br />» بعدما كثرت و تزايدت الاتهامات بالاعتداءات الجنسية التي يرتكبها الرهبان الكاثوليك و بعد التستر الرسمي عليها ، طالب الرومان الكاثوليك الغاضبون قادتهم و رؤسائهم بإصلاح الدين المسيحي . فالصدمة هي أن حالات كثيرة من هذا القبيل انتشرت كفيروس قاتل في نظر الرأي العام . فالأمر لم يعد يقتصر على بوسطن بل تعداه إلى لوس أنجلس و سانت لويس و مينوستا و فيلادلفيا و بالم بيتش و فلوريدا و واشنطن و بورتلاند و ماين و برايدج بورت و كونكنتيكت . و المريع في كل هذه الحالات ليس تفردها بهذه القضية بل في الشبه المرعب بينها. فقد تنوعت و تعددت الاتهامات الموجهة للرهبان الكاثوليك بالاعتداء الجنسي على الأطفال و اتهامات للكنيسة بالتستر عليها سواء القضايا التي تورط فيها الأب دان أو أوليفر أو روكو أو بريت \"<br />كان فرانك مارتينلي صبيا مشرقا يبلغ من العمر 14 سنة و أقسم كصبي الصليب بأن يصبح قسيسا فكان ينظر بتفاؤل بالغ لمستقبل مشرق حين اصطحبه الراهب لورانس بريت الذي كان أيامها شابا في مقتبل العمر و راهبا مؤثرا و نشيطا . اصطحبه إلى كاثدرائية سانت سيسيليا في ستامفورد بولاية كونكتيكات و سجله ضمن قسم للتلاميذ الجدد الذين كانوا تحت رعاية برايت في مافيريك . لم تكن العلاقة علاقة تلميذ براهب نزيه و طاهر كما اعتقد مارتينلي في أول وهلة . فخلال إحدى النزهات في واشنطن تحرش الأب بريت جنسيا بالصغير فرانك حين حصره في أحد الحمامات . و في طريق العودة اجبره الأب على التفاعل معه جنسيا و بارك الأب ذلك العمل و اقنع الصغير بأن ذلك هو الطريق لحصوله على العشاء الرباني . و ككل الأطفال التزم الصغير الصمت . فقد شعر فرانك بالعار والحيرة و الخجل من أن ينطق بكلمة واحدة.<br />و مارتينلي الآن يبلغ 54 سنة و لم يصبح قسيسا كما تمنى في صغره بل تزوج و له ابن و استقر في ميلووكي حيث يعمل كمستشار لإحدى المنظمات الخيرية . دمرت حياته بسبب الأسئلة الكثيرة التي لم يجد لها أجوبة و الغضب و الاكتئاب و فقدانه للالتزام الديني الذي كان ينشده . ولم يستطع فهم ما جرى له إلا في إحدى الليالي في سنة 1991 حين كان يتحدث بالهاتف مع أحد أصدقائه القدامى الذين كانوا معه في مدرسة الأب بريت في مافريك . فقد أسر هذا الصديق من كونكتيكات لفرانك بان الأب بريت اعتدى عليه جنسيا خلال تلك الأيام . يقول فرانك لمجلة التايم : (( انتفضت فجأة حين سماعي للخبر و تذكرت تلك الأحداث التي تعرضت لها )).<br />بدأ فرانك بعد ذلك زيارة عيادة نفسية لتلقي العلاج النفسي ، و حوالي سنة بعد تلك الحادثة أقام دعوى مدنية بالمحكمة الفدرالية بنيوهافن في كونكتيكات ضد بريت و كاتدرائية برايدج بورت التي كانت تدار بواسطة القسيس إدوارد ايغن.<br />و يذكر أن السلطات الكنسية في برايدج بورت اكتشفت ميول بريت الجنسية في بداية سنة 1964 و لكنها لم تبلغ عن ذلك السلطات المدنية و لا حتى الأبرشية و سمحوا له بالاستمرار في عمله في عدة مدارس دينية حول البلاد . و في سنة 1990 وحين اصبح ايغن أسقفا قابل بريت . يقول ايغن متحدثا عن تلك المقابلة( تكلمنا عن كل شيء و أعطى انطباعا جيدا, حيث أفصح عن كل التفاصيل خلال حوارنا \". و كنتيجة لذلك سمح ايغن لبرايت بالعودة إلى عمله السابق في برايدج بورت كقس مرة أخرى .<br />و في سنة 1992 اعترف برايت بالأمر للجنة خاصة شكلت لبحث المشكلة على نطاق محدود و لكنه استمر رغم ذلك في عمله . و جاءت اتهامات مارتينيلي و معها اتهامات من جهات أخرى لتدفع بالقضية إلى الواجهة.<br />و أسبوع بعد ذلك اخبر ايغن برايت بأنه لا يمكنه الاستمرار في عمله كقس . و في أواسط سنة 1997 قررت لجنة للمحلفين بان الكاثدرائية أخلت بواجبها حين لم تحذر مارتينيلي بميولات برايت الجنسية و فرضت عليها تعويضه بمليون دولار عن ما حصل له. و بعد استئناف الحكم تقرر إعادة النظر في مبلغ التعويض و استقرت القضية على ذلك .<br />و اليوم برايت هو في حالة هروب و ما يزال رسميا قسيسا رغم المطالبات المتكررة بطرده من عمله .اما ايغن فقد اصبح اليوم كاردينال و رئيس لأساقفة نيويورك و ربما الأسقف البارز في الولايات المتحدة كلها. و قد تزايدت الضغوط عليه لتوضيح موقفه ليس فقط بخصوص برايت بل بخصوص التستر على حالات كثيرة لقساوسة آخرين مثل برا يت حصلت حين كان في برايدج بورت. و من الناحية الأخرى فمارتينيلي لا يشعر بأنه حصل على التعويض المناسب فهو لا يهمه المبلغ المالي للتعويض بقدر ما يهمه اعتذار رسمي و علني أمام الرأي العام.<br />و لقد ألقت الآلاف من حالات مارتينيلي و المئات من حالات برايت بظلال من الشك على كنيسة الروم الكاثوليك و على القساوسة الأمريكيين الذين سمحوا لهذا المرض بان يستفحل . فالأزمة في تطور مستمر من سيئ إلى أسوأ , يوما بعد يوم مع اتهام 2000 من القساوسة بالاعتداءات الجنسية على الأطفال في كل البلاد و ارتفاع خطير لعدد المكالمات الساخنة لضحايا هذه الاعتداءات . الامر ليس كما صوره الكاردينال بيرنارد لو في بوسطن بالخطأ الكارثي و لكنه ضربة قاصمة للجهاز المالي و الروحي للمؤسسة الكنسية أيضا و إحباط كبير لكل رجل يلبس ( الياقة) الرومانية. فحقيقة دمرت حياة العديد من الناس و تزعزعت الثقة و مصداقية الكنيسة في معالجة المشاكل الاجتماعية.<br />كم من الوقت يلزم لتعلم هذه المؤسسات بان الأمر ليس فقط الجريمة في حد ذاتها بل هو أيضا متعلق بستار السرية الذي يلعنهم جميعا؟ لقد ظلت كنيسة الروم الكاثوليك وفية لصمتها طوال عقود حيال أفعال لا أخلاقية و جرائم بشعة و مقززة ارتكبت في حق أطفالها ، و لكن و في هذا الجو من المصارحة لم يعد بالإمكان إخفاء الأمر . فماذا سيقول القساوسة حين يقفون في الأعياد المقدسة ؟ و بماذا سيخاطبون تلاميذهم بعد كل هذه الفضائح التي تم التستر عليها لمدة طويلة؟ و كما يفرض على المؤمنين في كنيسة الروم الكاثوليك بان يؤمنوا بان يسوع المسيح سوف يقوم من جديد لينقذ أرواحهم فهم الآن يريدون معرفة كيف ستنقذ أولا الكنيسة نفسها"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 69
subject = "من اسباب العنوسة ايضا"
author = "شحرور لبنانى"
text = "بعض البنات لا يتزوجن رغم جمالهن لاسباب اجتماعية وعادات وتقاليد مجتمع<br />فأى حظ فى الزواج لاجمل الجميلات اذا كان ابوها ممن يعاقر الخمر او يصاحب الساقطات او ذو اصل وضيع فى المجتمع<br />او كانت الهانم امها سيئة السمعة ومن اصحاب المزاج والسهر صباحى خارج البيت مع من كل هب او دب<br />وضع الاسرة الاجتماعى والطبقى<br />عالج الفيلم المصرى بعض ذلك فى فيلم خللى بالك من زوزو للراحلة سعاد حسنى بنت الرقاصة<br />او من الاسباب ايضا الحكم على الاب فى قضية مخدرات او قضية اداب<br />هنا يجنى الاباء على بناتهم الجميلات"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 70
subject = "رد على ما تحسبوش يا بنات ان الجواز راحه"
text = "ما تحسبوش يا بنات ان الجواز راحة ...<br />وما تزعلوش يا بنات ان قلنا بصراحة ...<br />إن الجواز عمره عمره ما كان راحة<br />البنات:<br />قولولنا يا نصّاح ... مين ف الحياة مرتاح ...<br />حتى الحمام اللي طاير ... عنده - التعب ف الجناح ...<br />حلم السعادة الجميل ... من منبعه السلسبيل ...<br />ما يهموش لو يسيل ... على صخر أو تفاح ...<br />ومهما نتعب نقول ... تعب الحبيب راحة<br />مهما تقولولنا عليه ... رجلينا رايحة إليه ...<br />واللي يحب الحلاوة ... لابد يلسع إيديه ...<br />لابد من بعض نار ... ونص درهم مرار ...<br />و لما ييجوا الصغار ... القلب ترقص عينيه ...<br />ومهما نتعب نقول ... تعب الحبيب راحة ..."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

