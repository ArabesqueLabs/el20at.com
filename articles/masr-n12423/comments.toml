subject = "نعم معك كل الحق"
author = "ولاء الشملول"
text = "الى فلاح مصري عجوز<br />الله يفتح عليك<br />ما قلت هو المجتمع الاسلامي القويم والصحيح<br />هذه هى الكفالة الاجتماعية<br />هذه هى اخلاق الاسلام<br />الان فعلا انفلت العيار<br />وربنا يرحمنا برحمته ويسترها معانا<br />لكن هيسترها ازاى؟ ونحن لا نتقى الله ولا نرعي حرماته<br />واتقوا يوماً ترجعون فيه الله ثم توفي كل نفس ما كسبت وهم لا يظلمون - سورة البقرة- الآية 281<br />آخر آية نزلت فى القرآن على سيد الخلق محمد صلى الله عليه وسلم"
