subject = "ناقشنا المشكلة"
author = "مصطفى سعد"
text = "ناقشنا المشكلة بعواطفنا وبعض الاراء المتطرفة هنا وهناك<br />ثم مصمصنا شفايفنا وقلنا كل شىء قسمة ونصيب وانتظروا بكرة - يمكن - ولعل وعسى - وييجى ابن الحلال<br />سادتى وسيداتى المشكلة مشكلة شباب جيل وملايين تضييع اعمارها فيما لا يجىء وفى العبث<br />لماذا يحدث هذا ؟<br />هناك شىء فى المجتمع خطأ<br />اولا المرتبات للشباب لا تفتح بيوت والدولة تسرق الناس - لماذا لا يبدأ مرتب الخريج ب 3000 جنية<br />واجرة العامل اليومى 100 جنية<br />لماذا لا نعمل صناعات صغيرة للشباب ليس بطريقة الهواة الذى تعملة الحكومة بتوجية الشباب لتربية دودة القز وتوزيع اسطوانات البوتاجاز والمسخرة التى نراها ولكن بطريقة الصين الشعبية بصناعة من الابرة الى الصاروخ<br />لا بد للعقلاء ان يجدوا حلا للجيل القادم والجيل الحالى الذى يضيع عمرة عبثا<br />فاذا لم يتحرك احد<br />فلربما كان هذا نذيرا بحرق الاخضر واليابس فى هذا البلد<br />وافوض امرى الى اللة ان اللة رؤوف بالعباد"
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145533/http://masr.20at.com:80/newArticle.php?sid=12423"

