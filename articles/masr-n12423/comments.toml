subject = "الى الاخت اللي عندها 23 سنه وخايفة تعنس"
text = "فيه واحد معلق قبليني بثلاثة او اربعة تعليقات اسمه احسن حسن طالب واحدة وهو بيعمل في قطر كلميه يمكن تتفك عقدتكم انتو الاثنين وها هو تعليقه مرة ثانية<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />انتو السبب فى العنوسة<br />أرسل هذا التعليق بواسطة : احمد حسن<br />انا عايز اتجوز بس كل واحدة بتقول شقة وامك لالا عمتا انا عندى الشقة ومسافر وعايز انزل اتجوز انا اشتغل فى شركة فى دولة قطر محاسب فى الشركة براتب 4000 وابحث على زوجة جادة جداا وجميلة اه على فكرة انا عندى شقة فى الشرقية وعندى شقتين فى المعادى فايدة كامل وعايز وحدة جادة بدون شروط اه انا بقالى ثلاث ثنوات مسافر ومستعد للاى مطالب بس بمزاجى متبقاش فرض للتصال 009746739432 او 009746995760 الشقة 5 غرف و2 حمام ومطبخ وريسبشن الشقة0 27 متر يعنى الحصان يجرى فيها متشطبة سوبر لوكس من كلة يعنى الى تتجوزنى تيجى بهدومها<br />انا نازل فى 7- 2 - 2008 سلاممممممممممممممم"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 84
subject = "العنوسة وانهيار المجتمع"
text = "العنوسة وانهيار المجتمع<br />العانس، إذن، كما نعرفها عمومًا، هي البنت البالغة التي لم تتزوج، أو هو الرجل الذي لم يتزوج. فـالقاموس المحيط أطلق هذا اللفظ على المرأة كما على الرجل؛ وهذه ملاحظة جديرة بالاهتمام. لكن... قبل الدخول في مناقشة العنوسة، أسبابًا ونتائج، لا بدَّ من تعريف مفهوم الأسرة ووظائفها بشكل مختصر. لفظ \"الأسرة\" مشتق من الأسر، وهو التقييد أو الشد بالإسار؛ أي أنه يتضمن معنى الإحكام والقوة.<br />الزواج .. حلم يداعب خيال كل فتاة لتتوج ملكة علي عرشها ، وتمارس غريزة إنسانية أودعها الله قلب المرأة غريزة الأمومة .<br />ولكــن في زحمة الحياة وتعدد مسئوليتها بالإضافة إلى الظروف الاقتصادية الصعبة التي تواجه الشباب في العالم العربي اليوم يكاد هذا الحلم أن يتوارى في أغلب المجتمعات العربية ويوشك أن يتحول إلى سراب تلهث وراءه الفتاة العربية بعد فوات الأوان .. وبخاصة بعد أن ارتفعت نسبة العنوسة بصورة مخيفة تهدد أمن واستقرار تلك المجتمعات سواء على الصعيد الاجتماعي والاقتصادي أو حتى على المستوى الأمني حيث أصبح الزواج مشكلة تعجز أمام حلها المعادلات الحسابية لتشكل في النهاية ظاهرة – أو كابوس – بات شبحا يهدد ملايين الفتيات في العالم العربي .<br />تسعة ملايين شاب وفتاة عانس في مصر و264 ألف حالة طلاق سنويا * مليون ونصف عانس في السعودية * و48% نسبة الطلاق في الإمارات و46% في الكويت 35% و34% في البحرين و38% في قطر<br />** ففي مصر كشفت دراسة رسمية أعدها الجهاز المركزي المصري للتعبئة العامة والإحصاء<br />ارتفاع نسبة غير المتزوجين بين الشباب المصري إلى 37% ، وأن عدد الشبان والشابات العوانس – الذين تجاوزوا الخامسة والثلاثين من دون زواج – وصل إلى أكثر من 9 ملايين نسمة من تعداد السكان البالغ 64 مليون نسمة ، بينهم 3 ملايين و773 فتاة وقرابة 6 ملايين شاب غير متزوج .<br />كما كشفت الدراسة عن أن عدد المطلقين والمطلقات بلغ 364 ألفا و361 مصريا ومصرية ، وأن عدد عقود الزواج التي تم إبرامها رسميا في مصر عام 1999 بلغ 520 ألفا بنسبة 8.2% من السكان ، مقابل 405 آلاف عقد زواج في عام 1990، أي بزيادة قرابة 115 ألف عقد زواج ، في حين بلغت عقود الطلاق التي تم استخراجها عام 1999 نحو74 ألف حالة بنسبة 1.2% مقابل 67 ألف شهادة عام 1990.<br />كما سجلت الإحصائية وجود ألف حالة زواج عرفي بين أصحاب الشركات وسكرتيراتهم.<br />الطريف أن الإحصائية شملت أيضا وجود نحو 5 آلاف مصري متزوج من 4 سيدات ومن هؤلاء الأزواج من يحمل درجة الدكتوراه أو درجات علمية مرتفعة وليس أصحاب المهن أو التجار وحدهم في حين زاد عدد من يجمعون بين زوجتين فقط إلى قرابة مليون مصري<br />وأكد خبراء الجهاز أن هذه الأرقام ترجمة فعلية لظاهرة خطيرة بدأ يعاني منها المجتمع المصري<br />لاسيما في السنوات الأخيرة ، وهي ظاهرة العنوسة التي استهدفت الفئات الوسطى، محملين الفتيات والأسرة المسؤولية عن تفاقم تلك الظاهرة بسبب تغير مفاهيمهن عن الزواج ، مما جعل الشاب يقف عاجزاً عن توفير الحد الأدنى لمتطلبات الفتاة وأسرتها أما وزارة الشؤون الاجتماعية المصرية فقد أعلنت بدورها أن 255 ألف طالب وطالبة – يمثلون نسبة 17 في المائة من طلبة الجامعات – قد اختاروا الزواج العرفي،<br />بينما أعلنت وزارة العدل في أحدث إحصائية لها عن زواج 200 ألف فتاة مصرية من أثرياء أجانب كبار السن ، مؤكدة أن هناك اتجاهاً يسود بين الشباب المصريين للارتباط بزوجات من روسيا ودول الاتحاد السوفيتي السابق وأوروبا الشرقية ، حيث يرتبط الشاب بفتاة متعلمة وجميلة ، لأن هذا الارتباط لن يكلفه سوى منزل مؤثث .<br />وفي الوقت الذي أعلنت فيه وزارة الشؤون الاجتماعية المصرية ارتفاع معدلات الزواج العرفي بين طلبة الجامعات ، فقد أكدت دراسة للمركز القومي للبحوث الاجتماعية والجنائية بمصر وجود أكثر من 15000 دعوى لإثبات بنوة المواليد من زواج عرفي أو زنا ، والزيادة المطردة في أعداد اللقطاء الذين يعثر عليهم أمام المساجد أو المساكن أو في صناديق القمامة ، وعودة ظاهرة قتل المواليد من سفاح ، فضلا عن تفشى الانحلال في المدن الكبرى ..<br />وربما كان من الضروري هنا أن نشير إلى أن الانحلال الخلقي والزواج العرفي ليس الطريق الحتمي لهروب الفتاة العانس من دوامات القلق والخوف و الاكتئاب ، فمن البديهي أن ذلك يرتبط في نهاية المطاف بمدى تدينها وبثقافتها وتعليمها ، بالإضافة إلى طبيعة شخصيتها بالقطع ، فإذا كانت الفتاة ذات شخصية ضعيفة فإن الانحلال والزواج العرفي يكونان أقصر وأسهل الطرق التي ترتمي الفتاة في أحضانها وتسلم لها قيادها .. أما إذا كانت الفتاة تتمتع بشخصية قوية فإنها تنأى بنفسها عن ذلك ، ولكنها في الوقت نفسه قد تضطر ـ رغبة في التخلص من شبح العنوسة ـ إلى القبول بأي زوج يتقدم إليها ، حتى لو كان اختيارها اختيارا غير متكافئ ( تشير إحصائيات وزارة العدل المصرية ـ مثلا ـ إلى زواج نحو 200 ألف فتاة مصرية من أثرياء أجانب كبار السن ) ، وهو ما يفضي في النهاية إلى طلاق مؤلم ، سواء أكان طلاقا محسوسا أو معنويا .. وكم من زوجات وأزواج يجمعهم بيت واحد إلا أنهما منفصلان نفسيا ومعنويا !!<br />فالعنوسة، في الأساس، ظاهرة اجتماعية؛ وهي انعكاس مباشر للوضع الاقتصادي السائد. وارتفاع معدلات العنوسة عند الذكور والإناث مرتبط بالوضع الاقتصادي، والتطور التعليمي والثقافي والدراسي، وتحديد السن الملائمة للزواج. والظروف الخاصة التي تسهل الزواج أو تعرقله مرتبطة بالمجتمع، وتتغير مع التغيرات المرتبطة بالتعليم والعمل والمهور وغير ذلك"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 85
subject = "شكلها يقطع الخميرة من البيت"
author = "رخم"
text = "البنت اللى عاملة نفسها زكية وكاتبة مقالة بتقول فيها انها عانس - اكيد شكلها مكعبر وعاملة زى النسناس - وشعرها اكرت زى الفرشة السلك - ودمها يلطش - وسنانها ملخبطة وضبها طالع لبرة - اعوذ باللة على واحدة اسمها بنت الشملول<br />والمصيبة اللى جذبت الشباب وخلتهم يتعاطفوا معاها انها نشرت صورة بنت زى القمر ومحجبة واخر جمال بجانب المقال لتخدع القارىء ( شوف انا حلوة ازاى وعانس )*<br />انما الحقيقة لو شفتها على الطبيعة لوليت منها فرارا ولا ملئت رعبا<br />اكيد من شكلك البشع بقيت عانس<br />والمصيبة كذابة كمان<br />روحى يا شيخة الهى عزرائيل يفتكرك وقبر يضمك"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

