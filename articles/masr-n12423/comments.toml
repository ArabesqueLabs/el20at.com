[[comments]]
order = 59
subject = "فَاسْمَعْ وَاَطِعْ"
text = "وَحَدَّثَنِي مُحَمَّدُ بْنُ سَهْلِ بْنِ عَسْكَرٍ التَّمِيمِيُّ، حَدَّثَنَا يَحْيَى بْنُ حَسَّانَ، ح وَحَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الرَّحْمَنِ الدَّارِمِيُّ، اَخْبَرَنَايَحْيَى، - وَهُوَ ابْنُ حَسَّانَ - حَدَّثَنَا مُعَاوِيَةُ، - يَعْنِي ابْنَ سَلاَّمٍ - حَدَّثَنَا زَيْدُ بْنُ سَلاَّمٍ، عَنْ اَبِي سَلاَّمٍ، قَالَ قَالَ حُذَيْفَةُ بْنُ الْيَمَانِ قُلْتُ يَا رَسُولَ اللَّهِ اِنَّا كُنَّا بِشَرٍّفَجَاءَ اللَّهُ بِخَيْرٍ فَنَحْنُ فِيهِ فَهَلْ مِنْ وَرَاءِ هَذَا الْخَيْرِشَرٌّ قَالَ نَعَمْ ‏.‏ قُلْتُ هَلْ وَرَاءَ ذَلِكَ الشَّرِّ خَيْرٌ قَالَ ‏\"‏نَعَمْ ‏\"‏ ‏.‏ قُلْتُ فَهَلْ وَرَاءَ ذَلِكَ الْخَيْرِ شَرٌّ قَالَ ‏\"‏ نَعَمْ ‏\"‏‏.‏ قُلْتُ كَيْفَ قَالَ ‏\"‏ يَكُونُ بَعْدِي اَئِمَّةٌ لاَ يَهْتَدُونَ بِهُدَاىَ وَلاَ يَسْتَنُّونَ بِسُنَّتِي وَسَيَقُومُ فِيهِمْ رِجَالٌ قُلُوبُهُمْ قُلُوبُ الشَّيَاطِينِ فِي جُثْمَانِ اِنْسٍ ‏\"‏ ‏.‏ قَالَ قُلْتُ كَيْفَ اَصْنَعُ يَارَسُولَ اللَّهِ اِنْ اَدْرَكْتُ ذَلِكَ قَالَ ‏\"‏ تَسْمَعُ وَتُطِيعُ لِلاَمِيرِ وَاِنْ ضُرِبَ ظَهْرُكَ وأخذ مالك فَاسْمَعْ وَاَطِعْ ‏\"‏ ‏.‏"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

