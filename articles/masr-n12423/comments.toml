[[comments]]
order = 36
subject = "الشباب: نار العنوسة أفضل من جنة مكاتب الزواج الوهمية"
author = "نقلا عن المصري اليوم الالكترونية"
text = "الشباب: نار العنوسة أفضل من جنة مكاتب الزواج الوهمية<br />كتب هشام عبدالحليم &--1634;&--1635;/&--1633;&--1633;/&--1634;&--1632;&--1632;&--1639;<br />«لراغبي الزواج.. السنون تمر ولا تعود.. فلماذا وضع اليد علي الخدود؟!».. هذا هو الشعار الذي رفعه صاحب أحد مكاتب الزواج، مؤكدًا في إعلانه أن هناك طبيبات ومهندسات وسيدات أعمال وآنسات ومطلقات وأرامل لديهن سكن كامل للمعيشة، وأن التعامل سيكون بمنتهي الجدية والأمانة والسرية.<br />قامت «هي» بكشف أسرار هذه المكاتب ومعرفة رأي علماء الاجتماع في جدواها.. فأكد منصور محمد صاحب أحد تلك المكاتب أنه اتجه لإنشاء المكتب عندما وجد أن الكثير من أصدقائه الشباب يرغبون في الزواج، ولكن لا يقدرون علي دفع تكاليفه، وكانوا يسخرون من ظروفهم،<br />ويقولون «لو في واحدة تاخدنا بشنطه هدومنا بس نلاقيها فين؟» فقلت لنفسي لماذا لا أكون «الوسيط» الذي يجمع بين الطرفين، وقمت بحملة دعاية ضخمة، وأول الذين أقدموا علي تسجيل أسمائهم كانوا من الشباب واستغرق الأمر بعض الوقت حتي تقدمت أول فتاة.<br />وأضاف منصور: ولكن في نهاية الأمر نجح المكتب، والدليل علي ذلك تلقيه الكثير من الاتصالات للاستفسار عن الأمر لأن الأمر جديد عليهم.<br />ويتقاضي منصور إزاء هذه الخدمات &--1634;&--1632;&--1632; جنيه كإثبات جدية من البنت المتقدمة، ثم يحصل علي نسبة من المهر والمؤخر الذي تحرص البنات المتقدمات علي أن يكون كبيرًا ضمانًا لحقهن إذا «غدر» بهن الزوج، وتكون النسبة من &--1637;% إلي &--1633;&--1632;% وذلك علي حسب المستوي الاجتماعي والاقتصادي للشخص المتقدم.<br />وقال منصور إنه يتعرض للعديد من الانتقادات والسخرية من المحيطين به، إلا أنه لم يلتفت إليها لأنه «صاحب رسالة».<br />ورفض منصور أن نتحدث مع إحدي السيدات المسجلات في مكتبه بسبب السرية في المعاملات، وقال: تكلمنا مع أحد الشباب ويدعي محمد إسماعيل الذي أكد أنه قرأ إعلان أحد المكاتب فقام بالاتصال به بحثًا عن الزواج وهو لا يمتلك غير راتبه الشهري الذي لا يكفيه هو، فكيف سيزوج نفسه وقد بلغ عمره &--1634;&--1640; عامًا ولم يدخر مالاً<br />وأضاف محمد أن المسؤولين عن المكتب طالبوه بأن يتقدم بصورة البطاقة و«c. v» يشمل كل بياناته من مستواه العلمي وظروفه الاقتصادية والاجتماعية وعدد كبير من الصور الشخصية علي أن «يلبس بدلة» أثناء التصوير حتي يبدو مظهره جيدًا ثم ينتظر أن تراه إحدي البنات وتطلب مقابلته.<br />كان رأي البنات متناقضًا فهناك من أيدت الفكرة وهناك من رفضت.. وتؤيد سها عرفه الفكرة وتقول «أليس الزواج أفضل من أن يطلق علي الفتاة لقب «عانس» الذي يظل يطارد البنات، فأنا أريد الزواج ومعي مال وهناك شخص آخر ينتمي إلي أصل طيب وأخلاقه جيدة وليس معه مال فلماذا لا».<br />أما سحر محمد فقد أكدت استحالة أن تقدم علي الاشتراك في مثل هذه المكاتب لسبب بسيط وهو أنه إذا كان زملاؤنا في العمل لا نستطيع أن نتفهم طبيعة شخصيتهم ونصدم فيهم، فما بالنا بشخص أقابله لأول مرة ولا أعرف عنه أي شيء غير البيانات التي قام هو بكتابتها ولا يوجد دليل علي صحتها.<br />وأكدت نهي شريف &--1634;&--1637; سنة أنها تفضل ألا تتزوج نهائيا وسوف تتقبل الوضع بدلاً من أن تتزوج «أي حد» لأن عدم الزواج في هذه الحالة أفضل.<br />ورفضت الأم صفاء فرج رفضًا باتًا التعامل مع تلك المكاتب سواء كان المتقدم ابنها أو ابنتها قائلة: «لو بنتي لن أرضي عشان دائمًا سوف تتعامل علي أنها أقل، ولو كان ابني سأرفض لأن عينه ستظل مكسورة والأفضل للاثنين أن ينتظرا حتي يتزوجا الزواج المناسب».<br />ووافقت وفاء إبراهيم ربة منزل علي هذا المبدأ برفضها الذهاب إلي تلك المكاتب لأنها ببساطة مكاتب تهيئ لزواج فاشل، لأن الرجل من المفروض أن يقوم بالإنفاق علي البيت، وقالت بلكنة ساخرة: عند أول خلاف سوف يقول الرجل «انتي بنت بايره لم تجدي أي زوج يقبل بك» وتقول له البنت «أنا جبتك من الشارع وصرفت عليك».<br />الدكتورة نهال بركة أستاذ علم الاجتماع فلها ملاحظات علي هذه المكاتب، أولها أنها لا تتبع أي جهة رقابية ومن المفترض أن تراقب أنشطتها وزارة الشؤون الاجتماعية.<br />وأن يتم اللقاء في وجود أهل الفتاة وهذا أمر مهم جدًا ولا تنازل عنه، فالبنت تحمي نفسها بوجود أحد أفراد عائلتها معها، ويتبادل الطرفان المعلومات بشكل مباشر، وبذلك يكون المكتب قد أتم دوره.<br />وأضافت الدكتورة نهال: إذا تمت مراعاة هذه الملاحظات فأعتقد أن هذه المكاتب ستساهم في تهيئة مشروع زواج ناجح."
archived = "2007-11-28"
capture_url = "https://web.archive.org/web/20071128145533/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 37
subject = "دلونا على الحل يا ناس (اليس منكم رجل رشيد)"
author = "رجل رشيد"
text = "كيف نواجه الطوفان العنوسة ...<br />[center]كيف نواجه الطوفان ؟<br />العنوسة ناقوس خطر يهدد الأسر العربية !<br />خطر من نوع خاص يلاحق البيوت العربية، فرضته الظروف والتغيرات الإقتصادية والإجتماعية على الشباب من الجنسين، وبدأت رحلة البحث عن حل من جانب الدول والمنظمات الأهلية والأفراد لمواجهة هذه الظاهرة، فهناك من قال بتعدد الزوجات ، وآخر إقترح زواجًا بالتقسيط، وهناك من أنشأ جمعيات لتلقي طلبات الزواج ، وإتاحة الفرصة للتعرف بين من لحقتهم العنوسة ؛ رغبة في تحقيق حلمهم المنشود ببناء بيت جديد واسرة سعيدة...ترى ما هي فصول القضية، والسر وراء تضخم خطر العنوسة عربيًا ووسائل الحد من تفاقم هذه الظاهرة...؟.<br />ظاهرة تلاحق الشباب من الجنسين<br />ورد في القاموس المحيط أن العانِس هي \"البنت البالغة التي لم تتزوج، والرجل الذي لم يتزوج، ويقال: \"عنست الجارية، أي طال مكثُها عند أهلها بعد إدراكها \"بلوغها\" حتى خرجت من عداد الأبكار ولم تتزوج قط\".<br />فالعانس إذن، هي البنت البالغة التي لم تتزوج، أو هو الرجل الذي لم يتزوج. فـالقاموس المحيط أطلق هذا اللفظ على المرأة والرجل على حد متساو؛ وهذه ملاحظة جديرة بالاهتمام، ولكن المفهوم الشعبي يرى أن العانس هي المرأة لا الرجل.<br />وفي المجتمعات التقليدية يطلق مصطلح عانس على الانثى بعد عمر ال35 ،وذلك لأن مفهوم البنت هناك يعتمد على اعدادها لتكون محط انظار رجل يختارها كي تكون زوجته، وعندما لا يأتي هذا الشخص فهذا يعني أنها بارت.<br />بينما توجد نسبة كبيرة من النساء اللاتي لم يتزوجن حتي 40 أو 45 سنة، ويفسر البعض ارتفاع سن الزواج في عصرنا الحالي بأن البنت في عمر 25 سنة يكون لديها نضوج فكري كامل ،<br />فاذا وجدت من يناسبها ثقافة وفكراً وفهماً تزوجته ،واذا لم تجده فهي تفضل الانتظار وعدم الزواج.<br />كما ان البنت تنهي دراستها الجامعية في عمر ال25 سنة تقريباً، واذا أرادت ان تتخصص في دراستها سوف تصل الى الثلاثين ،وبهذا لا يحق أن يطلق عليها هذه التسمية خصوصاً وأنها تملك الحرية الشخصية الكاملة في القرار.<br />أرقام مخيفة<br />وتدق الأرقام ناقوس الخطر، كاشفة حجم المأساة التي تعايشها غالبية الأسر العربية، وقد أكدت دراسة حديثة ، أجراها مركز الدراسات الاجتماعية في مصر أن 9 ملايين فتاة مصرية فاتهن قطار الزواج.<br />وكشفت الدراسة أن 35% من الفتيات في كل من الكويت وقطر والبحرين والإمارات بلغن مرحلة العنوسة، وانخفضت هذه النسبة في كل من السعودية واليمن وليبيا لتصل إلى 30%، بينما بلغت 20% في كل من السودان والصومال، و10% في سلطنة عمان والمغرب، في حين أنها لم تتجاوز في كل من سوريا ولبنان والأردن نسبة 5% ، وكانت في أدنى مستوياتها في فلسطين ، حيث مثلت نسبة الفتيات اللاتي فاتهن قطار الزواج 1% فقط، وكانت أعلى نسبة قد تحققت في العراق إذ وصلت إلى 85%.<br />وأشارت الدراسة إلى أن نسبة العنوسة متدنية في منطقة بلاد الشام ومرتفعة في منطقة الخليج العربي ومصر.<br />بينما أوضحت الإحصائيات أن العنوسة لا تقتصر علي النساء فقط، فهناك نسبة كبيرة من الرجال يعانون من هذه الظاهرة، حيث أكدت دراسة أخري صادرة عن المركز القومي للبحوث الاجتماعية والجنائية بمصر، أن نسبة غير المتزوجين من الشباب من الجنسين في مصر بلغت بشكل عام حوالي 30%، وبالتحديد 29.7% للذكور و28.4% للإناث.<br />وطبقا لإحصاء أجرته وزارة الشؤون الاجتماعية والصحة اللبنانية، فإن نسبة الذكور غير المتزوجين ما بين 25 وثلاثين سنة تبلغ 95.1% ، والاناث 2 .83%. .<br />وفي سوريا بينت الأرقام الرسمية أن أكثر من 50% من الشبان السوريين لم يتزوجوا بعد، بينما لم تتزوج60% من الفتيات ، اللاتي تتراوح اعمارهن ما بين 25 و29 عاما، وبلغت نسبة اللاتي تخطين 34 عاما دون زواج 2.37% وهو ما يعني أن أكثر من نصف النساء غير متزوجات...<br />وأشارت نتائج دراسة أردنية مماثلة إلى تأخر عمر الفتيات عند الزواج الأول إلي 29.2، بينما يتأخر إلي 31.9 سنة لدي الذكور، وفي الجزائر كشفت الأرقام الرسمية ، التي أعلنها الديوان الجزائري للإحصاء أن هناك أربعة ملايين فتاة لم يتزوجن بعد ، بالرغم من تجاوزهن الرابعة والثلاثين، وأن عدد العزاب تخطى 18 مليونا من عدد السكان البالغ 30 مليون نسمةكما أعلنت دراسة نفذها الديوان الوطني للأسرة والعمران البشري بتونس تزايد نسبة العزوبية .<br />ارتفاع نسبة العنوسة في الوطن العربي<br />حيث تجاوزت 52% لدى الإناث في الفئة العمرية من 25 : 29 سنة، بينما تصل إلى حدود 90% لدى الذكور من نفس الفئة العمرية.<br />وتظهر نسبة العزوبية كذلك لدى الفئة العمرية الأكثر خصوبة 30 : 40 سنة إذ تقدر بـ 32% لدى الإناث وقرابة 60% لدى الذكور.<br />غلاء المهور والتعليم<br />وحول اسباب تفاقم الظاهرة، عكف خبراء الاجتماع وشئون الأسرة المصريين والعرب ،علي دراسة الأسباب التي تقف وراء الظاهرة الاجتماعية وكيفية مواجهتها والتخفيف من سلبياتها علي الشباب والفتيات والمجتمع كله،جاءت الأزمة الاقتصادية وضيق ذات اليد في مقدمة الأسباب التي أدت إلي تفاقم المشكلة، فكما يقول د. رشاد عبداللطيف ، أستاذ علم الاجتماع : إن الأزمة تتمثل في ارتفاع تكاليف الزواج ، التي أصبحت فوق طاقة كثير من الشباب بدءًا من صعوبة الحصول علي مسكن، رغم توافر نظام الايجارالجديد، ولكنه في أحوال كثيرة لايناسب دخل الشباب.<br />في الوقت نفسه ، تصر معظم الأسر علي إختيار العريس الجاهز، غير عابئة بالقيم الدينية التي تدعو إلي تزويج الشاب المتدين ، والتسهيل عليهم ، بصرف النظر عن دخولهم .<br />وأضاف د.رشارعبداللطيف أن هناك مجموعة من القيم الضاغطة في الأسرة ، تتمثل في التباهي بقيمة الشبكة ،والمؤخر ،وجهاز العروسة ،وإقامة الأفراح في فنادق خاصة، مما أدي إلي ارتفاع تكاليف الزواج وصعوبته هذه الأيام.<br />وأضاف أن هناك عوامل ساعدت علي استمرار تفاقم الظاهرة، تحددت في وجود بدائل غير مشروعة ، مثل انتشار الزواج العرفي ، وزيادة إقبال الشباب علي الإنترنت، وهي طرق بديلة وخاطئة لجأ إليها كثير من الشباب ؛ للتخفيف من الشعور بالأزمة والرغبة في الارتباط بالجنس الآخر.<br />وأوضح الدكتور عبداللطيف أن الفتاة أكثر تأثرا بالعنوسة من الناحية النفسية والاجتماعية، خاصة مع قلة توافر فرص العمل ،وارتفاع اشتراكات النوادي ، مما يجعلها تقع فريسة لمشاعر التعاسة والاكتئاب.<br />ونصح كل فتاة، فاتها قطار الزواج ، أو تأخر كثيرا أن تجد لنفسها فرصة لشغل وقت فراغها وبناء شخصيتها بالاستفادة من وقت الفراغ في أعمال البيت ، وممارسة أي حرفة داخل المنزل ،والاستفادة من القروض متناهية الصغر في إقامة مشروع صغير يدر عليها دخلا ويشعرها بالنجاح في الحياة وتحقيق الذات.<br />ولعب التغير الاقتصادي ، الذي ساد منطقة الخليج دورًا كبيرًا في زيادة الخلل ، حيث بدأت الأسر في تقليد من هم أعلى منهم اجتماعيا ، مما أدى الى المغالاة في المهور ، والبذخ في الأفراح ، وإرتفاع أثمان الشبكة، والأثاث، وفخامة البيوت .<br />تعليم الفتيات سبب رئيسي وراء تفاقم الظاهرة<br />غلاء المهور والتعليم<br />وحول اسباب تفاقم الظاهرة، عكف خبراء الاجتماع وشئون الأسرة المصريين والعرب ،علي دراسة الأسباب التي تقف وراء الظاهرة الاجتماعية وكيفية مواجهتها والتخفيف من سلبياتها علي الشباب والفتيات والمجتمع كله،جاءت الأزمة الاقتصادية وضيق ذات اليد في مقدمة الأسباب التي أدت إلي تفاقم المشكلة، فكما يقول د. رشاد عبداللطيف ، أستاذ علم الاجتماع : إن الأزمة تتمثل في ارتفاع تكاليف الزواج ، التي أصبحت فوق طاقة كثير من الشباب بدءًا من صعوبة الحصول علي مسكن، رغم توافر نظام الايجارالجديد، ولكنه في أحوال كثيرة لايناسب دخل الشباب.<br />في الوقت نفسه ، تصر معظم الأسر علي إختيار العريس الجاهز، غير عابئة بالقيم الدينية التي تدعو إلي تزويج الشاب المتدين ، والتسهيل عليهم ، بصرف النظر عن دخولهم .<br />وأضاف د.رشارعبداللطيف أن هناك مجموعة من القيم الضاغطة في الأسرة ، تتمثل في التباهي بقيمة الشبكة ،والمؤخر ،وجهاز العروسة ،وإقامة الأفراح في فنادق خاصة، مما أدي إلي ارتفاع تكاليف الزواج وصعوبته هذه الأيام.<br />وأضاف أن هناك عوامل ساعدت علي استمرار تفاقم الظاهرة، تحددت في وجود بدائل غير مشروعة ، مثل انتشار الزواج العرفي ، وزيادة إقبال الشباب علي الإنترنت، وهي طرق بديلة وخاطئة لجأ إليها كثير من الشباب ؛ للتخفيف من الشعور بالأزمة والرغبة في الارتباط بالجنس الآخر.<br />وأوضح الدكتور عبداللطيف أن الفتاة أكثر تأثرا بالعنوسة من الناحية النفسية والاجتماعية، خاصة مع قلة توافر فرص العمل ،وارتفاع اشتراكات النوادي ، مما يجعلها تقع فريسة لمشاعر التعاسة والاكتئاب.<br />ونصح كل فتاة، فاتها قطار الزواج ، أو تأخر كثيرا أن تجد لنفسها فرصة لشغل وقت فراغها وبناء شخصيتها بالاستفادة من وقت الفراغ في أعمال البيت ، وممارسة أي حرفة داخل المنزل ،والاستفادة من القروض متناهية الصغر في إقامة مشروع صغير يدر عليها دخلا ويشعرها بالنجاح في الحياة وتحقيق الذات.<br />ولعب التغير الاقتصادي ، الذي ساد منطقة الخليج دورًا كبيرًا في زيادة الخلل ، حيث بدأت الأسر في تقليد من هم أعلى منهم اجتماعيا ، مما أدى الى المغالاة في المهور ، والبذخ في الأفراح ، وإرتفاع أثمان الشبكة، والأثاث، وفخامة البيوت .<br />وفي الوقت الذي اعتادت فيه الأسر على استقرار سن الزواج للفتاة عند 15 إلى 20 سنة،اتجهت الفتاة إلى التعليم العالي الجامعي ، وما فوق الجامعي، واقتحمت مجالات كثيرة ومتنوعة في العمل ؛ لاثبات وجودها ، فوصلت إلى سن ما فوق الـ 25 سنة دون أن تدري !.<br />وقد استفادت الفتيات من الانفتاح في دفع مسيرتها العلمية والعملية ، حيث كانت استفادة الشاب مقتصرة على الجانب المادي ، الذي جذبه إلى تقليد العالم الخارجي في الأسفار واقتناء السيارات والموبايل ، فيما اتجهت قلة منهم إلى التعليم، وهذا أدى الى تفاوت كبير في المستوى التعليمي بين الشاب والفتاة ، فأحجم هو عنها خوفا من تعاليها عليه نتيجة عدم التكافؤ، ورفضت هي الاقتران بمن هو أقل منها خوفا من اضطهاده لها والتعامل معها بعنف ليقتل فيها احساسها بالتميز.<br />وفي بقية الدول العربية، تزداد الظاهرة إثارة، فيما تبقى ذات الأسباب متماثلة الى حد كبير، ففي مصر التي ارتفع سن الزواج فيها إلى ما فوق الـ30 ، وكان ذلك نتيجة لمحاولات الفتاة تكوين نفسها اقتصاديا ، فضلا عن سعيها الحثيث التعليم لتحسين مستوى أسرتها الاقتصادي، بات التعليم والاستقلال الاقتصادي الذي يحققه عمل المرأة في القطر السوري ، سببا في عنوستها، وكان العامل الاقتصادي الذي يقف عائقا أمام الشباب في تحمل مسئوليات وتكاليف الزواج سببا أيضا في عنوسة الشباب.<br />مصريات يقترحن تعدد الزوجات لحل المشكلة !<br />SIZE=5]الزواج من أجنبية<br />وفي دول الخليج العربي ، أصبح الزواج من أجنبية سبب آخر وراء ظاهرة العنوسة ،إلى جانب الأسباب الاقتصادية والاجتماعية، وهو زواج المواطنين من أجنبيات والذي أثر على قضية الزواج من المواطنات.<br />وقد أكدت الدراسات ان نسبة 60% من الإماراتيين ، الذين تزوجوا زواجا ثانيا من أجنبيات، طلقوا زوجاتهم المواطنات، بينما جاء تشدد الأسر تجاه بناتهم سبب آخر في إرتفاع نسبة العنوسة، بعد أن أغلقت الأبواب وبإحكام في وجه الفتيات ، خاصة في الأسر الفقيرة ،التي لم تنل حظا وافرا من الثقافة والتعليم ، مما ذاد من صعوباتها في المجتمع الإماراتي .<br />وفي محاولة لبحث أسباب الظاهرة داخل الإمارات، أجرت مجلة \"مودة\" الوطنية ، وهي مطبوعة شهرية تصدر عن صندوق الزواج ، إستطلاعاً لآراء عينة قوامها 250 فتاة من الإماراتيات ، اللاتي لم تتح لهن فرصة الزواج ؛ بهدف التعرف على أسباب ظاهرة العنوسة والحلول المقترحة لها.<br />وقد أظهرت النتائج أن 73% منهن بين 30 إلى 34 سنة، و20% من الفئة 35 إلى 39 سنة و7% يبلغن 40 سنة فأكثر.<br />وفيما يتعلق بالحالة التعليمية بينت النتائج أن 61% حاصلات على مؤهل جامعي، و16% منهن حاصلات على مؤهل فوق متوسط، و20% حاصلات على الثانوية العامة، و3% حاصلات على الابتدائية أو الإعدادية، أي أن غالبية أفراد العينة من الفتيات المتعلمات.<br />كما أظهرت نتائج الاستطلاع أن 71% من هؤلاء الفتيات يعملن في وظائف مختلفة، و29% منهن غير عاملات، وكان السؤال الرئيسي لفتيات العينة عما إذا تقدم أحد لخطبتهن أم لا بهدف التعرف على فرص الزواج الضائعة وتحديد مسئولية ضياع تلك الفرص وأسباب ذلك، وكانت النتيجة أن 84% من الفتيات تقدم لهن خطاب و16% منهن فقط لم يتقدم لخطبتهن أحد.<br />ولوحظ من النتائج أن فرص الخطبة كانت عالية كلما قلَّ عمر الفتاة وارتفع مؤهلها العلمي وكانت من العاملات، فقد كانت نسبة الفتيات اللاتي تقدم لهن خطاب من فئة العمر 30 إلى 34 حوالي 89%، وانخفضت هذه النسبة إلى 74% عند الفتيات من فئة العمر 35 إلى 39 سنة، وكانت 65% عند الفتيات من فئة العمر 40 سنة فأكثر.<br />وبالنسبة للمؤهل العلمي، بلغت نسبة الفتيات اللاتي تقدم لهن خطاب من الحاصلات على المؤهل الجامعي حوالي 86%، وانخفضت إلى 85% عند الحاصلات على الدبلوم دون الجامعة، و83% عند الحاصلات على الثانوية، وانخفضت إلى 63% عند الحاصلات على الابتدائية أو الإعدادية.<br />وظهر من النتائج أيضاً أن 88% من الفتيات العاملات تقدم لهن خطاب، في حين انخفضت هذه النسبة إلى 75% عند الفتيات غير العاملات.<br />كما أشارت نتائج الاستطلاع إلى أن عدم إتمام الزواج من المتقدمين للفتيات اللاتي شملهن الاستطلاع يعود إلى أهل الفتاة بنسبة 23%، ورفض الفتاة نفسها بنسبة 38%، ورفض الأهل والفتاة معاً بنسبة 32%، ويعود بنسبة 7% إلى الشباب المتقدمين للفتيات الذين لم يستمروا في مشروع الخطوبة.<br />ولفتت النتائج النظر الى أن من أسباب رفض الزواج، أن المتقدم ليس من أقارب الفتاة أو عشيرتها، هذا إلى جانب أسباب أخرى يعتقد البعض أنها تعيق الزواج، مثل رغبة الفتاة في إكمال دراستها أو رغبتها في مساعدة أهلها.<br />وبالنسبة للفتيات من فئة 30 سنة فأكثر ، تمثلت أسباب ازدياد عدد غير المتزوجات منهن من وجهة نظر فتيات العينة ، في عدم تمسك بعض الشباب بتعاليم الدين الحنيف، والزواج من أجنبيات، وسيطرة الأهل على قرار اختيار الزوج، وتكاليف الزواج الباهظة، والعادات والتقاليد التي تفرض على الفتاة الزواج من الأقارب أو العشيرة والنظرة إلى الجامعية على أنها مغرورة ومتكبرة، والاهتمام بالشكل الخارجي للفتاة فقط.<br />مصريات يقترحن تعدد الزوجات لحل المشكلة !<br />كما تمثلت في النظرة للعاملة على أنها ستكون منشغلة بوظيفتها على حساب واجباتها الزوجية والأسرية، وطول فترة الدراسة وغرور الفتاة بجمالها أو ثروتها أو نسبها والتقليد والمحاكاة وغيرها من الأسباب.<br />وفي تونس ، أكدت دراسة للديوان الوطني للأسرة والعمران البشري إرتفاع عمر الفتاة عند الزواج الأول ، مع ارتفاع المستوي التعليمي ليصل إلى 31.9 سنة ، بين الحاصلات على التعليم العالي، مقابل 27.9 سنة بين الأميات، كما يرجع تأخر سن الزواج إلى ارتفاع تكاليف الزواج 47.4% ، يليه عامل التعليم و طول فترة الدراسة 43%.<br />وابرزت الدراسة أن 74% من النساء اخترن مواصلة التعليم في حالة تعادل فرصتي النجاح في الدراسة وفي الزواج أمامهن.<br />تعدد الزوجات<br />وفي مواجهة هذه الظاهرة، اقترحت بعض الطرق لحل مشكلة العنوسة في الدول العربية والاوربية، والتي اتسمت بعضها بالغرابة والطرافة ...نساء وسيدات مجتمع عاملات في مختلف المهن، وحاصلات على مؤهلات علمية يعملن متطوعات في تنظيم مؤسسي قائم وموجود ومسجل، وحدّن جهودهن بعد أن اقتنعن تماما بأهداف ورؤية جمعية \"الحق في الحياة\" مبديات كامل الاستعداد للتنازل عن حقهن في امتلاك الرجل غير منفردات بهذا الحق مرحبات بشريكة أخرى .<br />وهذه الجمعية قائمة على فكرة تشجيع تعدد الزوجات، وحيث أن طاقم الجمعية كله نساء مثقفات واعيات التقين حول هدف واحد هو حث الأخريات على تقبل فكرة تعدد الزوجات بل وإقناع النساء المتزوجات بتزويج أزواجهن، لما لذلك من آثار حسنة تعود على المجتمع.<br />وترأس هذه الجمعية الاعلامية المعروفة هيام دربك رئيسة تحرير مجلة المثقف العربى، وكانت قد تأثرت بموقف تعرضت له إحدى صديقاتها ، التي جاءت تبكيها وتشكيها معاناتها؛ لأن زوجها يريد الزواج عليها ولكنها أقنعت صديقتها بأن هذا هو حق لزوجها قد أقره الشرع، وهذا افضل لها بدلا من أن يتخذ له صديقة بالسر فيكون عاصيا أو حتى أن يتزوج بالسر فتعتبرها خيانة وحتى لا تتفشى الرذيلة في المجتمع، ومنذ تلك اللحظة جاءتها الفكرة التي كانت حاضرة في ذهنها قبلا وبموجبها سعت رئيسة الجمعية إلى إرساء هذه الفكرة وقامت بطرحها على مجموعة من النساء حيث لاقت الفكرة استحسانا من قبلهن وابدين استعدادهن للعمل في الجمعية.<br />ولقيت الجمعية تشجيعا من شيوخ الأزهر إذا كان الرجل قادرا على العدل بين اكثر من زوجة ماديا، أما القلب فكل شيء ثابت إلا التغير فالإنسان في تغير دائم والقلب قلاب كما يقولون فهذا الثابت في مكانه متغير في مواسمه وطقوسه وحسب الظروف.<br />وكرد فعل لما أعلنه الجهاز المركزي للتعبئة العامة والإحصاء حول عدد المصريين ، الذين<br />بلغوا سن الخامسة والثلاثين ،ولم يتزوجوا بعد، قام أحد نواب الإخوان المسلمين بالتقدم باستجواب<br />للدكتورعاطف عبيد، رئيس الوزراء عن خطط الحكومة لرفع المعاناة ومساعدة الشباب في تكاليف الزواج وتقديم تسهيلات لهم، سواء بطرح الشقق المغلقة بالمجتمعات العمرانية الجديدة بأسعار مخفضة أو من خلال توعية الأهالي بضرورة تخفيض تكلفة الزواج.<br />وأكد النائب محمد العدلي أنه تقدم بسؤاله لرئيس الوزراء بسبب ارتباط هذه القضايا الاجتماعية باستقرار المجتمع، وخطورة ارتفاع أعداد العوانس على الأمن القومي واستقرار المجتمع المصري.<br />كما تقدم النائب المستقل محمد خليل قويطة بطلب مناقشة لرئيس الوزراء، وقع عليه أكثر من 25 نائبا دعوا إلى فتح هذا الملف الشائك ومناقشته في جلسات خاصة، سواء من ناحية التأثير الاقتصادي أو الاجتماعي على تأخر الزواج لما يقرب من تسعة ملايين فتاة وشاب .<br />وأوضح قويطة أن الوصول إلى هذا العدد دون زواج يفتح باب المخاوف أمام الأسر إزاء تزايد حالات الزواج العرفي، خصوصا بين شباب الجامعات في ظل الصعوبات التي يواجهها الشباب لإتمام الزواج الرسمي ، بعد تزايد الطلبات من جانب أهل الفتاة، وهي أحلام تصطدم إلى حد كبير بالظروف الاقتصادية للمجتمع بصفة عامة ،وانتشار حالات البطالة بين شباب الخريجين في سن الزواج بصفة خاصة ، وهو ما يؤدي إلى العزوف عن الزواج.<br />وفي هذا السياق .. دعا عدد من نواب البرلمان المصري إلى إنشاء صندوق للزواج في مصر، على غرار صندوق الزواج الذي تم إنشاؤه بكل من دولة الإمارات العربية المتحدة والكويت، مما يسهم في حل مشكلة العنوسة في مصر بعد أن ارتفعت المهور وتكاليف الزواج.<br />وأضاف كل من النائبين: عبد الرحيم عبد الحميد وناريمان الدرمللي أن هذا الصندوق لا يتعارض مع مبادئ الإسلام، أو الشريعة الإسلامية، وإنما يأتي تطبيقا لمبدأ التكافل الاجتماعي الذي دعا إليه الإسلام.<br />وأشار النواب إلى أهمية أن يكون الصندوق تحت رقابة الدولة، على أن يقوم بقبول التبرعات من رجال الأعمال والقادرين، كما دعوا إلى تشجيع فكرة إقامة حفلات زواج جماعية.<br />واقترحوا إمكانية قبول الصندوق لجزء من أموال الزكاة؛ بهدف معاونة الشباب على نفقات الزواج، بدلا من عزوفهم عنه، نظرا لتكلفته العالية، وذلك كحل لحماية الشباب من الانحراف، وللحد من انتشار الزواج العرفي، داعين الدولة الى ضرورة القيام بدعم هذا الصندوق، والنظر إلى تجربة دولة الإمارات وقيامها بدعم الصندوق بمبلغ من المال لمساعدة الشباب المقبل على الزواج وغير القادر على تكاليفه، وهو ما تم أيضا في دولة الكويت.<br />الزواج بالتقسيط وسيلة سعودية للقضاء علي العنوسة<br />الزواج بالتقسيط<br />وفي السعودية .. اقترح مأذون شرعي في جدة فكرة جديدة لتسهيل الزواج على الشباب والفتيات الذين يبحثون عن الشريك المناسب وغير القادرين على إكمال نصف دينهم في ظل ارتفاع تكاليف المعيشة وغلاء المهور، وهي \"الزواج بالتقسيط\".<br />وأكد المأذون الشرعي أحمد سعيد العمري، طارح الفكرة ،أن أهمية الزواج بالتقسيط تأتي من منطلق التخفيف من تكاليف المهر والزفاف، والتي تقدر في المجتمع السعودي بـ 77 ألف ريال على الأقل، والتي غالباً ما يتحملها العريس وتشكل عبئا كبيرا على ذوي الدخل المحدود ممن تقل رواتبهم عن 1500 ريال، وذوي الظروف المعيشية الصعبة ممن لا يستطيعون فتح بيوت وحدهم، بينما من يتقدم للاستفادة من هذا المشروع لن يتحمل من تكاليف زواجه سوى المهر حيث يتم دفع الباقي على أقساط مؤجلة، جاء ذلك في حديثه مع صحيفة الوطن.<br />وقال العمري :\" إن الزواج بالتقسيط ليس فكرة عشوائية، إنما هو اقتراح منظم يصرح له من قبل الجهات الرسمية على اعتباره مشروعاً لمساعدة الشباب والفتيات على الزواج الميسر، ويؤسس المشروع تحت مظلة إمارة المنطقة أو إحدى الوزارات مثل وزارة العمل والشؤون الاجتماعية أو الشؤون الإسلامية أو الدعوة والإرشاد، وأن يؤسس بدعم المستثمرين من رجال الأعمال، ويتم إنشاء مكتب مقترح من قسمين يستقبل أحدهما طلبات الزواج من النساء والآخر من الشباب، ويقوم المكتب بالبحث عن الزوج أو الزوجة المناسبة للمتقدم بطلب الزواج، ويقترح العمري أن يضم المكتب قسماً للاستشارات الأسرية ولإصلاح ذات البين، ولحل المشكلات الأسرية من قبل علماء مختصين<br />ويهدف المشروع إلى حماية الشباب الذين يواجهون صعوبة في إتمام التزامات الزواج المالية من الانحراف بتيسير تكاليف المهر، فبدلاً من إثقال الزوج بالديون والمهر والأثاث والزفاف، يساهم المشروع بتقسيط أجور السكن وتأثيث المنزل، وكذلك البحث عن زوج أو زوجة مناسبين لبعضهما بعضاً وفق رغبات الطرفين فيما يكتفي الزوج بدفع المهر فقط، كما يساهم المشروع في حل مشكلات العنوسة وغلاء المهور والتخفيف من معاناة الشباب من متاعب الزواج، ويقلل من المشكلات التي تتسبب بها الخاطبات.<br />كما دفع ارتفاع نسبة العنوسة في المجتمع السعودي المفتي العام في المملكة الى تجديد دعواه الى السعوديات بتقبل منطق التعدد للحفاظ على البناء الاجتماعي للأسرة والمجتمع.<br />وقال مفتي عام المملكة العربية السعودية ،ورئيس هيئة كبار العلماء ، الشيخ عبدالعزيزعبدالله آل شيخ : إن تعدد الزوجات أمر شرعه الله لصالح المجتمع ، وأن على المرأة أن تقبل أن تكون زوجة ثانية ، أو ثالثة بإعتبار ذلك خيرًا من العنوسة، وأضاف أن زواج المرأة من رجل ذي دين وكفاءة وخلق ومعه زوجة أخرى لا عيب ولا نقص فيه ، بل هذا ما شرعه الله، وأكد مجددا على أن التعدد أمر مشروع ، وأن من يشكك فيه ضال، وكون الناس يخطئون ويسيئون التصرف ، فهذا يرجع الى نقص الناس ، وأن شرع الله ليس فيه نقص.<br />وقد أيدت غالبية الفتيات السعوديات خفض مهر الزواج إلى 10 آلاف ريال فقط لتسهيل إجراءات الزواج والحد من حالة العنوسة في المجتمع، كما اكدت نتائج استطلاع سعودي.<br />وذكر رضي الغمغام عضو لجنة التأهيل والتوظيف في جمعية القطيف الخيرية أن الإستطلاع أجري على 1000 عينة من الفتيات تتراوح أعمارهن ما بين 15 و35 سنة.<br />وأفادت نتائج الإستطلاع أن 58% وافقن على أن يكون المهر 10000 ريال، بينما وافقت30% على 20000 ريال و 8% وافقن على أقل من 10000 ريال، أي أن 66% يوافقن على خفض المهر إلى 10 آلاف ريال وأقل و4% موافقات على مهر 15000ريال.<br />وعن تكاليف ليلة الزواج فقد أظهرت النتائج أن 50% استقررن على مبلغ 5000 ريال، و20% على مبلغ 15000ريال، و18% على مبلغ 10000 ريال و12% على مبلغ 7000ريال.<br />وفي نفس الإتجاه ، لاقى مشروع تيسير الزواج بجمعية البر بالمنطقة الشرقية السعودية نجاحًا في دعم الشباب المحتاج للزواج والمساعدة على حل مشكلتي العنوسة وغلاء المهور، والتوعية بأهمية الزواج ،ومتطلباته والمساهمة في زيادة نسل المسلمين واحياء مبدأ التكافل الاجتماعي وتحقيقه.<br />وجاء في تقرير عن نشاطات المشروع ان هناك خدمات تقدم من قبل المشروع وتشمل مساعدات مالية ومساعدات عينية، وتشتمل اثاثا مجانيا وهدية للمولود الاول وخدمات مساندة تكون مجانية او بأسعار مخفضة.<br />وبين التقرير ان المشروع يقدم خدمة التوفيق بين راغبي الزواج للشباب والفتيات على حد سواء لتسهيل التوفيق بين الطرفين، وذلك عبر برنامج علمي مدروس يتم بكل سرية وامانة اسهاما من المشروع في المشاركة في حل ظاهرة العنوسة في المجتمع، مما جعل الطلبات في تزايد مستمر حيث تم تزويج أكثر من 90 رجلا وامرأة تحت شعار \"معا نبني اسرة سعيدة\".<br />وورد في التقرير ان المشروع قام بانشاء لجنة نسائية تقوم بدور التوجيه والارشاد للامهات والفتيات واستقبال الطلبات النسائية الخاصة بلجنة التوفيق بين راغبي الزواج، ومتابعة ذلك من خلال المقابلات واللقاءات لمعرفة الرغبات حيث يتم ذلك بكل سرية وامانة وقد تم مساعدة 1716شابا وفتاة وصرف لهم اكثر من 9.7ملايين ريال.<br />حل إماراتي<br />وفي الإمارات تم انشاء \"جمعية رباط المودة\" لوضع حداً لهذه الظاهرة، واوضحت أم حميد - وهو الاسم الحركي للمشرفة الإدارية للمشروع - فكرة المشروع بقولها : \"فكرنا في هذا المشروع لأننا رأينا كمّاً كبيرا من الصديقات وصلن إلى سن العنوسة، والشكوى من النسبة الكبيرة من المطلقات من الفئة صغيرة السن وعزوف الشباب عن الزواج والاتجاه إلى حلول ترضي احتياجاته بعيدا عن مسئوليات الزواج نظرا للانفتاح الزائد الذي شهدته البلاد، ومؤشرات كثيرة دفعتنا للبحث عن حلول وقد استفدنا من تجربة الكويت ومصر، وزرنا الكويت وأخذنا خلاصة التجربة ومدى نجاحها وتقبل الجمهور لها وحاولنا تكييف التجربة بما يتناسب مع مجتمع الامارات لان الكويت أكثر انفتاحا من الامارات، ونحن نعلم رغبة الأهالي في تزويج بناتهن وخجلهم من اعلان هذه الرغبة وعرضنا الموضوع على القضاة للبحث عن الاسلوب الديني واختصاصيين في مجال الأسرة في الأردن من جمعية \"العفاف\" الخيرية ومركز الأسرة في مصر.<br />ولذلك جاءت فكرة تكوين لجنة للتوفيق بين الطرفين، ولان هناك طرفا رجاليا فكان لابد من تكوين لجنة رجالية تستقبل طلبات الرجال، ومعظمهم عزاب ولكن هناك نسبة من المطلقين والأرامل وحالاتهم الاقتصادية متوسطة وفوق المتوسطة، أما المستوى العلمي فأكثرهم من حملة المؤهلات العلمية الذين يرغبون في الاستقرار وقد حملت طلباتهم مجموعة من الرغبات والشروط التي يجب توفرها في شريكة الحياة معظمها حول الجوانب الدينية والخلقية وان تكون في مستواهم العلمي والفكري ومن أسرة طيبة.<br />وفي السودان ، حيث الأرقام الفلكية لعدد العوانس، والعاطلين من الشباب عن العمل ،دعا الرئيس السوداني عمر البشيرالرجال في بلاده بتعدد الزوجات بهدف تقليل عدد العانساتالتي وصلت لأرقام فلكية في البلاد . وقد وجدت دعوة الرئيس البشير قبولا وسط أمهات العذارى،اللاتي تطارد العنوسة بناتهن، وفي المقابل بدأ بعض الرجال يستحسنون الفكرة غير أن أغلبهم ربط دعوة الرئيس بتسهيلات تقدمها الدولة للراغبين في الزواج ، وإعتبرعدد من النساء المتزوجات أن الاحاديث المتكررة للرئيس بدعوة أزواجهن للأكثار من الزوجات لزيادة عدد السكان، جعلهن يعشن حالة من القلق بعد أن وجدت دعواه قبولا وارتياحا وسط أزواجهن.<br />الحفلات الصامتة<br />وعلي الطريقة الفرنسية .. ابتكرت مجموعة من المتزوجين في العاصمة الفرنسية طريقة حديثة للقاء بين العانسين من الجنسين في فرنسا، وذلك عن طريق تنظيم احتفالات صامتة تكون مجالاً خصباً للتعارف عن قرب.<br />وكان ذلك نتيجة جهود المتزوجين حديثاً، الذين بات هم العنوسة يشغل بالهم أكثر من أية شريحة أخرى في المجتمع الفرنسي، فقد آلمهم وجود عزاب وراءهم بعد أن تزوجوا هم.<br />وقد كانت انطلاقة الفكرة في فرنسا بعد أن نضجت لدى فنانتين من نيويورك طرحتاها على زملاء لهما في فرنسا فكانت البداية في باريس.<br />وهذه الفكرة سهلة وبسيطة التنفيذ وتعتمد على الصبر وقوة التحمل والصراحة في الحديث، ويتجسد مبدأ الفكرة في منع التكلم وإحداث أي ضجيج، حيث سيدخل المجتمعون في نقاشات طويلة وعميقة لكن عبر الكتابة بدلاً عن التحدث وجهاً لوجه، هذا ما قاله فريدريك بوركاي وهو مؤسس الحفلة الثانية التي اقيمت في ضاحية تنجا في باريس.<br />وفي هذه الحفلات نجد الجميع يحملون أقلاما وكراسات صغيرة، منخرطين في نقاشات طويلة ومسلحين بأقلامهم، ويستمر النقاش بينهم على مدار ساعتين، حتى وإن طلبوا شرب الماء، فذلك يكون كتابياً، وهم أثناء ذلك يتنقلون من طاولة إلى أخرى يتساءلون ويستفسرون دون أن يحدثوا أصواتا أو صخباً.<br />وتقول إحدى المشاركات في هذه الاحتفالات وعمرها بدأ يتجاوز الـ28 سنة : \"أنه لأمر صعب أن تبقى في صمت لاسيما إذا كان المرء يتمتع بطباع الثرثارين، لكن هذه الطريقة نفسها تمكننا في الوقت نفسه، نحن معشر النساء من معرفة ما إذا كان الرجل القابع أمامنا يستطيع كتابة جملتين دون أن يرتكب أخطاء إملائية\".<br />وبعد مضي ساعتين من النقاش الهادئ والمقتصر على الكتابة حيث كل شيء يدون ويصبح مستنداً للطرفين، تبدأ مراسم الحفل بتوزيع الهدايا وتطلق الحرية للكلام حيث يستطيع كل واحد أن يتحدث مع جليسه والتعرف عليه شفهياً.<br />وفي النهاية .. يظل التساؤل قائماً، هل ستنجح الطرق السابقة فى القضاء علي هذه الظاهرة أم ستظل العنوســــــة مشكلة قائمة تبحث عن حل؟ وإن كان الدين والشرع الإسلامي الحنيف ، يبقى وحده حاملاً كلمة السر، والحل الأمثل والأكثر أمنًا وإقترابًا من القلب والعقل ."
