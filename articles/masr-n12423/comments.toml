subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
text = "اولا يا ولاء لو كل حد عدى التلاتين و متجوزش دمه هيبقى خفيف كده يا ريت كل البلد تبقى زيه على الاقل نضمن نضحك على همومنا بدل ما تقضى علينا<br />لو هنتكلم جد يا ولاء هى مش بس ازمه اقتصاديه بسبب العصابه اللى ربنا اكيد هينتقم منها لكن السبب فى تاخر سن الزواج احجام الشباب عن الحب و عارفه انك هتقولى ان الاحجام راجع للازمه الاقتصاديه و انا معاكى بس للاسف الشباب بيستسلمو بسرعه و بيياسو بشكل اسرع<br />لو كل اتنين اتمسكو ببعضهم و حاربو الناس و الظروف بحبهم الدنيا هتتغير كتير<br />صدقونى يا جماعه الحب هو طوق النجاه الاخير<br />و اوعى يا ولاء ترضخى لكلام الناس عن سنك و اوعى تتنازلى لمجرد انك عديتى التلاتين لان اللى عملو كده و اتجوزو لمجرد حمل لقب زوجه فشلو و فعلا زى ما انتى قلتى نسبه ضئيله من المتزوجين سعداء و انا افتكر كلمه جت ف فيلم اريد حلا على لسان صديقه لفاتن حمامه ف الفيلم لخصت القضيه ف كلمه لما قالت الجواز لو مكانش فيه اضافه جديده و سعيده للطلرفين يبقى ملوش لازمه<br />لازم تلاقى الحب و صدقينى هتلاقيه طالما عايشين و الشمس بتتطلع كل يوم<br />و ابقى اعزمينا ع الفرح يا جميل"
