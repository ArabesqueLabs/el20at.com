subject = "أفهموا الدين"
author = "محمد"
text = "لو إحنا كمجتمع وكأفراد بنتبع الشريعة السمحة لأختلف وضعنا كثيرا ، الحكام ليسوا هم السبب المباشر ، بل السبب الأصلي فينا إحنا ، يعني مثلا ننظر كم كانت تكاليف تزويج السيدة فاطمة بنت الرسول عليه الصلاة والسلام ، ثم نقارن بينها وبين مطالب الفتاة وإسرتها هذه الأيام ،...<br />ومن ناحية أخرى انتشرت ثقافة الرفض لما أحله الله ، فكم بنت ترضى أن تكون زوجة ثانية ؟ مع أن هذا شيء عادي جدا في الدول الخليجية لكنه هنا في بلدنا كأنه عار ... تفضل البنت وأهلها العنوسة على أن تكون ابنتهم زوجة ثانية ؟؟؟!!!!<br />أنا مثلا مازلت شابا (حاجة وتلاتين ) ومتزوج وأعول ، والحمد لله دخلي يمكني من الزواج بأخرى ، فلو كنا نحن - مجتمع وأفراد - لا نرى حرجا فيما شرعه الله لنا لقلت نسبة العوانس بشكل كبيير<br />ومن جهة أخرى لو كنا كمجتمع وأفراد وحكومات نتقي الله ونبعد عما يغضبه ، ، على الأقل نجتنب الكبائر ،، على الاقل نجتنب الآثم التي تكون نتيجتها أذآن بالحرب من الله علينا نحن !!!<br />إحنا إللي انتشر فينا الربا ، الفلاحين بيزرعوا بالربا ، والمصانع بتنتج بالربا ، والأفراد بيقترضوا بالربا ، ودة نتيجتة المباشرة حرب من الله علينا ... نحن ، تكون نتيجتها زوال كثيرا من النعم والتنغيص على المتوفر منها<br />وكان الله في عون الشباب"
archived = "2007-11-15"
capture_url = "https://web.archive.org/web/20071115121212/http://masr.20at.com:80/newArticle.php?sid=12423"

