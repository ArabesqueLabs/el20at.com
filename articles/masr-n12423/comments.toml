subject = "الصور كشفت السر"
text = "بخصوص الكاتبة الفاضلة ولاء الشملول طبعا كتبت المقال على اساس انها عانس والاخوة في الديسك اختاروا لها صورة وهي بنت في بداية المشوار علشان خاطر يجننوا القراء<br />ازاي صحبة الصورة دي تبقى عانس<br />اولا هي دي صورتها من حوالي اكثر من عشر سنين<br />وصورتها في موقع مجانين ربنا تكون صورة حديثة شوية<br />المهم عايز اقول للقراء وللبنات حاجه مهمة عن تجربة<br />فيه بنات بتدلع على العرسان وبتتأنزح عليهم وفيه بنات بتبقى حطه في مخها ان اللي حتتجوزه دا لازم يكون حاجه ما حصلتش وانسان فريد من نوعه وتفضل بأه كل ما يجلها واحد تطلع فيه القطط الفاطسه<br />دا وحش دا طويل دا قصير دا ما عندوش دا ما حلتوش دا مش عارف ايه<br />تفضل تدلع كده وتتأنزح على العرسان لغاية ما تبص تلاقي نفسها دخله في التلاتين وبعدين بتاخد سمعة انها بنت متكبره فتبص تلاقي نفسها عانس بجداره وعلى نفسها جنت براكش<br />فيا اخواتي البنات عليكم بحديث رسول الله صلى الله عليه وسلم اذا جاءكم من ترضون دينه وخلقه فزوجوه<br />وعصفور في اليد خير من دستة على الشجرة ويجب الاهالي ينتبهوا الى هذه النقطة<br />البنات المفروض اول ما يجلها اول واحد طالما يمشي حاله المفروض تتجوزه على طول<br />الجواز سترة يا بنات<br />حتى لو كانت في الدراسة تسيب الدراسة وتروح تتجوز هذا رايي<br />وفيه حكاية حقيقية حصلت<br />ان فيه واحدة كانت بنت عمده وكانت بتتأنزح على العرسان فأبوها لما زهق منها<br />حلف بالطلاق انا ما حتتجوز ابدا<br />وفعلا فضلت من غير جواز لغاية ما ابوها مات<br />ولما مات كان عندها 45 سنه اتجوزت"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

