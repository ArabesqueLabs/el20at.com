[[comments]]
order = 63
subject = "اين كنت ايام شبابى ؟"
author = "عجوز"
text = "ما شاء اللة<br />ولا حول ولا قوة الا باللة<br />بنت زى القمر ليلة 14 - زى لهطة القشطة - حمار وحلاوة وخفة دم<br />وكل دة ولم تتزوجى<br />الرجالة او الشباب انعموا فى نظرهم<br />عندهم عمى ليلى<br />عايشين فى عشوائيات الفكر والنظر<br />صباح كانت بتغنى على ايامنا غدينى جبنة وزيتونة وعشينى بطاطا - يعنى الفلوس مش المشكلة<br />المشكلة انة شباب خرع مش عايز يشيل مسؤلية<br />فكرتينى بكاتبنا توفيق الحكيم طيب اللة ثراة وكان بيصيف فى اسكندرية وطلعت ايامها موضة المايوة البكينى وشاف البنات لابسين البيكينى على الشط - فالرجل انزهل وقال<br />اين كنتن ايام كنت فى شبابى يا غجر ؟"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

