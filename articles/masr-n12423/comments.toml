[[comments]]
order = 97
subject = "مشروعية أن تخطب الفتاة لنفسها"
text = "وعن مشروعية أن تخطب الفتاة لنفسها دينيا يقول \"مسعود صبري\" الباحث الشرعي في \"شبكة إسلام أون لاين.نت\": لا بأس من أن تسعى الفتاة لتزويج نفسها بالوسائل المشروعة، مع المحافظة على كرامة وحياء الفتاة، ويضرب مثلا بما قامت به السيدة خديجة رضي الله عنها مع الرسول صلى الله عليه وسلم، حيث عرضت على الرسول الزواج منها، لكن بأسلوب غير مباشر من خلال قريبتها، التي أرسلتها لاستطلاع رأيه في هذا الأمر.<br />وأضاف: لكن الأصل هو أن يبدأ الرجل في طلب الزواج، ولكن لا بأس من أن تفعله المرأة متى رأت أن الرجل مناسب لها، ولا حرمة في هذا، بل إن هناك من يسميها سنة السيدة خديجة، وعامة الناس ليسوا جميعا على نفس المثال، فمن يرى أن هذا السلوك يناسبه فهناك من يرفضه، وهذا يتوقف على طبيعة الفتاة، وفى كل الحالات تستطيع الفتاة بأسلوب مهذب أن تلمح للشاب من خلال الاهتمام الزائد به، أو الحديث في الأمور الاجتماعية والحياة الشخصية، ما دام أن هذا في حدود اللياقة والأخلاق."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 98
subject = "نصيحة لكل بنت عايزه تتجوز"
author = "حكيم اخر الزمان"
text = "يا بنات يا حلوين , النصيحة بكل بساطة كلمة \"حاضر\".<br />ما تعرفوش اد ايه الكلمة ده ليها مفعول السحر على أى راجل, حتى لو انتوا ما تؤصودوهاش.<br />عشان كده البنات الأواريب (اللئيمة) تعمل الى هى عاوزاه و تقول حاضر؛ وتلاقى يا عينى جوزها ولا خطيبها ولا حبيبها طاير بيها ومش مصدق نفسه من السعاده و الهنا الى هو فيه و مش عارف ايه الى حيحصل له بعد ما تكون الفاس وقعت فى الراس و ما يعرفش يفلفص بعد كده.<br />و طبعا مفيش راجل عاقل انهارده يستجرى يقول لواحده \"قولى حاضر\" أو \"نفسى اسمع كلمة حاضر\"؛ ده تبقى وقعته سودا و يبقى تعدى على الذات العليا و خرق جميع المعاهدات الدولية بما فيهم اتفاقية جنيف الى تنص على حسن معاملة الأسرى و أطاح بجميع الأعراف و المواثيق الدولية عرض الحائط مما يستوجب فرض الولاية على مصر و العالم العربى و التدخل الأمريكى السريع فى المنطقة مع مشروعية استخدام القنابل العنقودية و اليورانيوم المنضب ضد هذا السافل الى كان عايز يسمع كلمة حاضر. آل يسمع حاضر آل. إجنن ده ولا جرى فى مخه حاجة.<br />تصدقوا بالله، مره واحده قالت لى حاضر كان حيغمى عليا.<br />جربوا و مش حتخسروا حاجة.<br />الى القاء فى نصيحة جديدة"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 99
subject = "أحد موانع الزواج عند الرجال (غير الى بتفكروا فيه)"
author = "حكيم اخر الزمان"
text = "طبعا يا قراء يا أعزاء التعليقات هنا اكلمت على كتير اوى من اسباب الإحجام عن الزواج فى مصر زى المشكلات الإقتصادية و الإجتماعية و أزمة السكن و غيرها. أنا عايز اكلم لو تسمحولى على مشكلة الرجل المقهور. ده طبعا حيكون من خلال تجربتى مع القهر من المجتمع عامةً و من المرأة بشكل خاص.<br />أنا (الحوافريت) ابقى آخر العنقود بعد بنتين (مفتريتين) و امهم ( وابوهم). بابا كان يشتغل فى الخارج فكانوا بيقولولى على طول \"انت راجل البيت\".<br />انا: يعنى ايه يا جماعه راجل البيت؟<br />هما: مش مهم تعرف. انت راجل البيت و خلاص.<br />انا: يعنى هى حاجه كويسة يعنى؟<br />هما: طبعا. ده احسن حاجه فى الدنيا.<br />أنا: خلاص، مدام احسن حاجه فى الدنيا يبقى انا راجل البيت.<br />تمر الأيام ومش مهم اوى هى كام يوم ولا كام سنة؛ اهو وقت و يعدى و خلاص.<br />هما: روح يا حبيبى هات الجورنال.<br />أنا: ياااه كمان شوية . الدنيا برد و عاوز انام شوية.<br />هما: يووووه ؛ انت ما بتعملش حاجة خالص. أمال راجل ازاى بقى؟ عايز يعنى اخواتك البنات ينزلوا ؟<br />انا: ما هما بينزلوا كل يوم يروحوا المدرسة. فرقت ايه يعنى؟ هو الراجل ده هو الى بيقوم الصبح فى البرد عشان يجيب الجورنال؟<br />هما: طبعا. امال يبقى راجل ازاى؟<br />انا: حاضر.<br />تمر الأيام. وقعت فى الشارع على رجلى و راجع البيت بعيط.<br />هما: ايه ده ايه ده ايه ده؟ فى راجل فى الدنيا يعيط؟<br />انا(فى سرى): اه متعور و بعيط , فيها ايه يعنى؟ ما كل الولاد الى فى سنى بيعيطوا. يكونوش مش رجالة؟<br />تمر الايام و السنين .....<br />المدرسة: ايه الدوشة ده. مين هنا بيكلم؟ انت .. تعالى هنا<br />انا: أنا يا ميس؟<br />المدرسة: أيوه انت. افتح ايدك. عشر ضربات بمسطرة 40 سم.<br />انا (فى سرى): انا انضرب؟ هى مش عارفة ان انا راجل البيت ولا ايه؟ آدى ايدى اهه.<br />لم تكن هذه المرة الأولى ولا الأخيرة التى اتعرض فيها للضرب على يد مدرساتى الفضليات-مس سامية و مس لبنى ومس ابتهاج و مس انشراح و .... و كل مرة كنت اقول \" معلش, ما يعرفوش ان انا راجل البيت\".<br />كفاية كده احسن طولت عليكوا. طبعا انتو عرفتوا انا مش عايز اجوز ليه؟<br />لو عاوزين تعرفوا بقيت الحكاية, ابقوا قولولى. ولو حد عارف ايه هو رجل البيت ممكن يخش السحب و يكسب مليون جنيه."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 100
subject = "البنات انواع"
text = "البنات انواع منها.....<br />البنت الناعمة<br />طبعا هذه البنت وهي نايمه في غرفتها الدبدوب والارنوب كلهم في احضانها واذا قامت من النوم ماتقوم الا الساعه وحده الظهر واللي تقعدها من النوم والشغاله طبعا تكلمها بالانجليزي بترجم لكم شنو قالت لها الخدامه..تقول قومي ماما وقت واجد تأخير ..والناعمه اول ماتصحى من النوم تفتح الستاره والشباك علشان الغرفه تتنفس وشغلت موسيقى رومانسيه عشان يكون الجو رايق وتاخذ حمام محترم وبعد ماتطلع من الحمام على المرايه تحط من هالكريمات ..لازم تحافظ على البشره..خلصت من المرايه وتتجه الان الى الاستشوار وبعدين تلبس البنطلون الجنز والبلوزه..وتنزل تاكل الفطور اللي يكون عباره عن كلوب ساندويش وعصير فريش<br />البنت الدفشه:<br />تقوم الساعه 8 الصبح وهي ماودها تقوم وتدخل امها عليها بالغرفه وتصرخ عليها قومي شبعتي نوم وترد الدفشه على امها ..زين زين الحين بقعد وتقعد تأففففففف ويطلع من فمها نار....الاضافه الى انها وهي نايمه كل دقيقه تطيح من على السرير ..وبعدين يدخل اخوها الصغير ويصرخ وجع يالله كفايه نوم.. وترد عليه :اطلع من الغرفه والا ارميك من الشباك الحين..المهم اخوها اللي اكبر منها يروح لها الغرفه يرفسها وبعد تلك الرفسه العنيفه تصحى من النوم<br />البنت الناعمة ماتتغدا الا الساعه4 ولا 5 ولا تتغدى الا على صيني وهندي ايطالي معدتها ماتستقبل اي شي<br />البنت الدفشه تتغدا الساعه 12 بالضبط ولا تتغدا الا كبسه ولحم او دجاج واذا خلصت تشرب البيبسي شربه وحده مافي مجال انها تتنفس ..وماتسمع الا اصوات مخفيه<br />البنت الناعمه: طلعتها تكون من بعد صلاة المغرب ماتطلع العصر تحافظ على البشره من ضوء الشمس<br />البنت الدفشه تطلع الساعه 2 القايله تروح مشي لبيت خوالها لحد ماتنقلب سمره<br />البنت الناعمه تروح ستار بكس او اي كافيه وقبل لاتطلع تمر على الصالون تحط هذاك الميك اب<br />البنت الدفشه تحط كحل يملا العين والروج تقول ماكله انسان واذا بتروح السوق مالها الا سوق الحراج<br />البنت الناعمه: اذا تبي تضحك(ههههههههههه) ويدها على فمها من الخجل والضحكه من الصعب انك تسمعها<br />البنت الدفشه: هاهاهاهاهاهاهاها... والحاره الثانيه تسمعها<br />البنت الناعمه اذا تحب تسمع اغاني ماتسمع الا ريكي مارتن طبعا لانه حلو وممثلها المفضل توم كروز لوسامته وميل جبسون وجيم كاري لخفة دمهم<br />البنت الدفشه:ممثلها المفضل بوهلال وعبدالناصر درويش ومطربها المفضل خالد الملا ومزعل فرحان<br />البنت الناعمه لما تتفرج على التلفزيون تقعد على كرسي وتحط رجل على رجل وتبتسم لان الابتسامه تضفي بشاشه على الوجه<br />البنت الدفشه تتسدح على الارض وتحط راسها على المخده وتمد رجلها وتحطها على التلفزيون واذا تبي تغير القناه دقت بأصبع رجلها وغيرت القناه<br />البنت الناعمه اذا تبي تحلم احلام اليقضه طلعت في حديقة بيتهم وقعدت على كرسي هزاز وقام الكرسي يروح ويرجع<br />البنت الدفشه تروح بالحوش وتمد السجاده اللي فيها خمسة وثلاثين لون احمر واسود وابيض وجابت كاس سته متر متروسه شاي<br />فى ايه مفيش احسن من البساطة.....خير الامور الوسط........"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 101
subject = "الى -- العنوسة رحمة يا بنات"
author = "حكيم اخر الزمان"
text = "لأ يا هانم العنوسة مش رحمة ولا حاجة. ده حجة الخايبه و الخايب كمان. أصل الأمور إن الناس تتجوز و الحياة تمشى. لو فى مشاكل نحاول نحلها.<br />الرجالة اجننوا و عايزين هايفا و نانسى و ال 4 cats و ...... البروزات دى كلها ( فى هوس جنسى و كبت عند الرجالة)<br />و الستات اتهبلوا من كلام جمعيات حقوق المرأة و الcareer path و شوية الأرشنات دول.<br />بصراحة لازم نقفل جمعيات حقوق المرأة و نسكت الستات المهابيل دول. و كمان نعرض صور هيفا و نانسى و شاكيرا قبل العمليات عشان الرجالة يصدقوا ان كل شىء ممكن يتصلح.<br />Hakeem_elzaman@yahoo.com"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 102
subject = "انظر الى الجانب المشرق"
author = "أســـد بغـداد"
text = "بسم الله الرحمن الرحيم انظروا دائماً الى الجانب المشرق من الحياة لا الى الجانب المظلم, فأذا قضيت الوقت بعد العمر سيسبب هذا الى الهرم المبكر والعنوسة التي تعانون منها لما لا نبرر هذه المشكلة بانها فترة نضوج وانصح بتعامل الناس بجاذبية وشفافية اكثر وعدم ترك اخلاقنا العربية ومزايا الفتاة العربية المحبوبة كل هذه من عوامل الزواج المتاخر وليش العنوسة كما تسمونها!"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

[[comments]]
order = 103
subject = "اقفلوا الموضوع بقى"
author = "واحد زهق"
text = "يعنى الموضوع بقى سخيف جدا --- بنت وضعت صورة لواحدة جميلة جدا - مش فى الواقع اطلاقا - لان الحقيقية سمجة جدا وتستحق العنوسة عن جدارة - وبتقول انا ضربنى السلك واهو با اعرض نفسى للزواج بطريقة مقززة وانا حلوة وامورة<br />والشباب افتكروا واحدة سهلة واللى كتب تليفونة علشان يتسلى معاها واللى تعاطف مع جمالها<br />وبعدين الموضوع بقى ماسخ<br />والا بنت الشملول بتاع موقع مجانين دفعت لكم حاجة<br />والا بتدوروا على عريس لها<br />قفلوا على الموضوع دة وخلصوا الفيلم الهندى البايخ دة<br />دة صحيح فيلم هندى بايخ"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209025034/http://masr.20at.com:80/newArticle.php?sid=12423"

