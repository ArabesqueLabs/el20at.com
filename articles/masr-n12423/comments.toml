text = "وصف رائع وتشخيص موفق لحالة العنوسة التي تمر بها كثير من فتياتنا، وحين يستطيع الكاتب أن يعبر عن عمق الأحاسيس والمعاناة التي يعيشها الناس بإسلوب بقدر ما يبكيك يضحكك، ويشعرك بانها معاناة شخصية له من شدة براعته في الخوض بالتفاصيل الصغيرة، يكون وصل أعلى مراحل الإبداع<br />وفقك الله .. صحفية مبدعة وكاتبة ناضجة"
