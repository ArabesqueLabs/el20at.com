text = "بجد انتي هايلة والله العظيم.. ودا مش مجاملة.. تعرفي انا بافكر نعمل ايه.. نعمل ثورة نختار حد يكون سبارتاكوس واحنا العبيد. يمكن. مين عارف.. يمكن يكون بكرة احسن.. وبجد لتاني مرة اتمنى لو نتعرف اتا زميل ليكي وباكتب في موجة وفي الدستور ياريت لو تضيفيني اكون شاكر.. انا اسمي اسامة نبيل ودا ميلي ossamanabail1979@hotmail.com.. بجد اكون شاكر لو نتواصل اهو زمايل مهنة وكمان اعتبريني من المعجبين بكتباتك.<br />اسامة نبيل"
