subject = "إحنا جيل مش متربي"
author = "ممدوح"
text = "بسم الله<br />أولا قبل أي حاجة ... ده مرة من المرات القليلة اللي أضحك فيها وأنا أقرأ مقال....<br />واضح أن الكاتبة عندها ثقافة سينمائية مصرية من الستينات والسبعينات متميزة ....<br />المهم ...<br />العنوسة فرع مش أصل ....<br />زي السخونة في الأنفلونزا .... السخونة عرض مش سبب المرض ...<br />قد تكون السبب في موت المريض لكنها تبقى نتيجة مش سبب<br />حالة المجتمع كله من انحلال أخلاقي وضياع للقيم .... تولد المشكلة<br />والدنا فلاح مصري عجوز اتكلم على جزء منهم من الموضوع ده .... عدم احترام الكبير<br />ودي واحدة من عشرات القيم اللي ضاعت ...<br />الكل بقى ريس الكل عايز يكسب بسرعة وبدون تعب<br />الكل عايز يضحك على الناس ومحدش يضحك عليه<br />إحنا جيل مش متربي ....<br />أنا واحد سني قريب من السن اللي الكاتبة بتتكلم عنه ومع ذلك لسه بعلم نفسي سلوكيات الرجولة<br />ليه علشان لا الأسرة ولا المجتمع علمني الرجولة<br />علمني الذكورة لكن مش الرجولة<br />الحفاظ على الكلمة (من ضمنها الحفاظ على المواعيد - الحفاظ على الوعد - قلة الكلام الفاضي)<br />بذل المجهود مع عدم الشكوى ... كتير ومنهم أنا أول ما أحس أني تعبت في عمل شيء سواء في البيت أو الشغل<br />اصرخ واملى الدنيا عويل .... بصوا أنا عملت أيه ....<br />ولو محدش قدر مجهودي ده يبقى هما حاقدين وحاسدين ومش مقدرين وابطل اللي أنا بعمله صح<br />كأني بعمل الصح علشان اللي حواليا<br />أنا متجوز وعندي ولد وبنت<br />وساعات كتير كنت بحس أني مش مؤهل للجواز ... مش مؤهل لتحمل تبعات الجواز ... مش بس المادية<br />لكن فعلاً النفسية والعصبية .... في أحيانا كتير بثور على أسباب تافهة .... واسكت في مواقف لابد فيها من الكلام<br />ساعات كتير بسيب تصرفات عبيطة تقلق بيتي وحياتي لو ببساطة خلتني راجل وعقلت هتتحل من نفسها<br />والدي الله يرحمه كاتب ليا في ورقة صغيرة للذكرى : نصحتي ليك اتق الله وخليك راجل في كل تصرفاتك ....<br />بس للأسف مش عارف أزاي أطبق النصيحة<br />المشكلة مش في الفلوس ولا العصابة ... وبرده مش في التدين<br />لأن تدينا في الغالب بيبقى اهتمام بالظاهر دون الباطن ....<br />المشكلة في القيم اللي تركناها والمعايير اللي أخدناها اسلوب لحياتنا"
archived = "2007-12-10"
