[[comments]]
order = 0
subject = "يا عاقد الحاجبين على الجبين اللجينى ان كنت تقصد قت"
author = "نيفين نيفى نوفا"
posted = "2008-01-07"
text = "و البيت اللى فوق ده بمناسبه عاقد الحاجبين دى يا منى<br />و ده اول تعليق ليا ف السنه الجديده<br />يصى يا منى انا اصحابى بيقولو ان دمى خفيف بس انا بطبعى بميل لمود الرومانسيه بكابه و ده اسمه ف الادب melankholy<br />و ف الولاد اللى بيجذب البنت مود التعالى على غرار يا واد يا تقيل اما حكايه ابو سمره السكره دى فمش بتمشى اوى صدقينى<br />عموما فعلا على راى عمنا اضحك للدنيا تضحكللك و برده صلاح جاهين قال غمض عنيك و امشى بخفه و دلع<br />النيا هى الشابه و انت الجدع<br />تشوف رشاقه خطوتك تعبدك<br />لكن انت لو بصيت لرجليك تقع<br />عجبى"
archived = "2010-03-14"
capture_url = ""

