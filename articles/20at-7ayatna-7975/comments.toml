posted = "2008-01-10"
text = "و سنة سعيدة عيكي انت كمان يا نوفا<br />بس فعلا الظروف و المكان احيانا بفرضو عليكي مود محدد<br />بس حبيت كتير بيت الشعر دة<br />تعرفي مع اني قرات كتير لنزار ما تذكرتش انو مر علي<br />ومنكم نستفيد يا عسل"
