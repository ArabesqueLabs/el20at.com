[[comments]]
order = 4
subject = "كان زماااااااااااااااااان"
author = "ريما"
posted = "2008-01-09"
text = "اولا كل عام و انت بخير يا نوفا<br />و هاد كمان اول تعليق الي بالسنة الجديدة<br />اما بالنسبة لخفة الدم....ممممممممم<br />و الله حسب الصحبة<br />كنت بضحك كتيييييييييييييييييير ايام العزوبية... بس هلا لا<br />و السبب مش جوزي ..اوعو تفكرو انو نكدي........ بتاااااااااااااااااااااتا<br />هو بس انا تغربت و ضيعت اللمة..و الصحبة و جمعات الاهل<br />بس بسترجعها بس انزل على عمان... يعني دمي خفيف شهرين بالسنة و الباقي جد اكتر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "خدعوك فقالوا"
author = "نيفين نيفى نوفا"
posted = "2008-01-10"
text = "لا و الله يا cipher كان بودى مكذبكش لكن و الله انا مش راجل خالص<br />و التعليق بتاع بت يا نيفين ده تقريبا عارفه من مين لان بت دى محدش بيقولهالى الا حد معين<br />ما علينا<br />تسلميلى يا ريما ويا رب سنه سعيده عليكى<br />بس صدقينى يا ريما الحزن و السعاده جوانا مش بالمكان اللى بنبقى فيه<br />مش نزار قبانى بيقول:<br />يا رب لكل جرح ساحل ..و انا جراحى بغير سواحل<br />كل المنافى لا تبدد وحشتى ..ما دام منفاى الكبير بداخلى"
archived = "2010-03-14"
capture_url = ""

