[[comments]]
order = 8
subject = "الحارث بن حلزه وليس اقرغ بن حلزه"
author = "للامانة منقول"
text = "الحارث بن حلزة واسمه الحارث بن ظليم بن حلزّة اليشكري، من عظماء قبيلة بكر بن وائل، كان شديد الفخر بقومه حتى ضرب به المثل فقيل «أفخر من الحارث بن حلزة»، ولم يبق لنا من أخباره إلا ما كان من أمر الاحتكام إلى عمرو بن هند (في 554 - 569 م) لأجل حل الخلاف الذي وقع بين قبيلتي بكر وتغلب. توفي سنة 580 م، أي في أواخر القرن السادس الميلادي على وجه التقريب.<br />[عدل] معلقته<br />أنشد الشاعر هذه المعلقة في حضرة الملك عمرو بن هند رداً على عمرو بن كلثوم. وقيل أنه قد أعدّها وروّاها جماعة من قومه لينشدوها نيابة عنه لأنه كان برص وكره أن ينشدها من وراء سبعة ستور ثم يغسل أثره بالماء، كما كان يفعل بسائر البرص ثم عدل عن رأيه وقام بإنشادها بين يدي الملك وبنفس الشروط السابقة. لما سمعها الملك وقد وقعت في نفسه موقعاً حسناً أمر برفع الستور وأدناه منه وأطمعه في جفنته ومنع أن يغسل أثره بالماء.<br />كان الباعث الأساسي لإنشاد المعلقة دفاع الشاعر عن قومه وتفنيد أقوال خصمه عمرو بن كلثوم. تقع المعلقة في خمس وثمانين بيتاً، نظمت بين عامي 554 و569 م. شرحها الزوزني وطبعت في إكسفورد عام 1820 م ثم في بونا سنة 1827 م. ترجمت إلى اللاتينية والفرنسية.<br />وهي قصيدة همزية على البحر الخفيف وتقسم إلى:<br />مقدمة: فيها وقوف بالديار وبكاء على الأحبة ووصف للناقة (الأبيات 1 - 14)<br />المضمون: تكذيب أقوال التغلبيين من (الأبيات 15 - 20) وعدم اكتراث الشاعر وقومه بالوشايات (الأبيات 21 - 31) ومفاخر البكريين (الأبيات 32 - 39) ومخازي التغلبيين ونقضهم للسلم (الأبيات 40 - 55) واستمالة الملك وذكر العداوة (الأبيات 59 - 64) ومدح الملك (الأبيات 65 - 68) وخدم البكريين للملك (الأبيات 69 - 83) القرابة بينهم وبين الملك (الأبيات 84 - 85).<br />وتعتبر هذه المعلقة نموذج للفن الرفيع في الخطابة والشعر الملحمي وفيها قيمة أدبية وتاريخية كبيرة تتجلى فيها قوة الفكر عند الشاعر ونفاذ الحجة كما أنها تحوي القصص وألوانا من التشبيه الحسّي كتصوير الأصوات والاستعداد للحرب وفيها من الرزانة ما يجعله أفضل مثال للشعر السياسي والخطابي في ذلك العصر.<br />وهذا مطلع المعلقة:<br />آذَنَتْنا ببَيْنهِا أَسْمَـــــاءُ ربَّ ثَـاوٍ يُمَلُّ مِنْهُ اُلْثَّـــوَاءُ<br />بَعْدَ عَهْدٍ لَنَـا بِبُرْقَةِ شَمّــاءَ فَأَدْنَى دِيَــارِهَا اٌلْخَلْصـــاءُ<br />فَالُمحَيَّاةُ فالصِّفـاحُ فَأَعْنـاقُ فِتَـاقٍ فَعادِبٌ فَالْوَفَــــــاءُ<br />فَرِيــاضُ اُلْقَطَا فأوْدِيَةُ الشُّرْ بُبِ فالشُّعْبَتَـانِ فالأَبْـــــلاءُ<br />لا أرى مَنْ عَهِدْتُ فيهَـا فأبكي اٌلْيَوْمَ دَلْهاً وَمَا يُحِيرُ اُلْبُكَاء<br />وَبِعَيْنَيْكَ أَوْقَدَتْ هِنْدٌ اُلْنَّــارَ أَخِيراً تُلْوِي بِها اُلْعَلْيَــــاءُ"
archived = "2008-10-23"
capture_url = "https://web.archive.org/web/20081023010910/http://masr.20at.com:80/newArticle.php?sid=17983"

[[comments]]
order = 9
subject = "هو الذي جعل في الاميين رسولا منهم يتلو عليهم اياته ويزكيهم ويعلمهم الكتاب والحكمة"
author = "مش رضوى حسن ولا مروى صلاح"
text = "وهذا يكفي<br />كما قال الشيخ الشعراوي الامية شرف فينا لان الامي كما ولدته امه لم يتعلم من بشر ولكن علمه من الله تعالى<br />والله لم يرد لنا ذلك اراد الله لنا الدعوى الى الله سبحانه وتعالى<br />وكما قال الشيخ الشعراوي على النحو الثابت في تفسيره<br />ان الله سبحانه وتعالى جعل هؤلاء الناس مطية للمسلمين يخترعون الاشياء ونحن نستخدمها"
archived = "2008-10-23"
capture_url = "https://web.archive.org/web/20081023010910/http://masr.20at.com:80/newArticle.php?sid=17983"
