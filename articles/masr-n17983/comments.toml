text = "بص يا استاذ ممكن اللى انت كاتبه صح<br />بس احب اعرفك حاجه ان الامه دى مش هاتنجح ابدا غير ازا نفزت اللى امرها ربها بيها<br />وشوف ايه الاسلام وازاى نرجع الدوله دى مسلمه تانى وهايحصل غصب عنى وعنك فى يوم من الايام<br />لانك ازا كنت بتؤمن بالقدر<br />فده قدر ربنا لينا"
