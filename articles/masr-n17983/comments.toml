[[comments]]
order = 2
subject = "امة تستعد لدخول ليل التاريخ بعد ان تمددت الصحراء والخيام على المواقع والمنتديات"
author = "لية"
text = "يعنى اية ؟<br />مش عارف دة اصلة جاى منين<br />يا سيدى العيب منا نحن<br />ادخل اى مدرسة ثانوىة فى مصر المحروسة وشوف الوضع التالى<br />فى مدرسة ثانوية 12 فصل فى الثانوية العامة -- منهم عشر فصول ادبى وفصلين علمى<br />لية - علشان يدرسوا جغرافيا وفلسفة وادب وكلام لا ينفع فى العصر الحديث - وبعدين تقولى الشاشة امريكية والكيسة المانية والموس صينى والهارد يابانى<br />لا يا سيدى<br />فية قرية اسمها الفالوجة فى فلسطين المحتلة فيها مصنع صدر السنة الماضية 4 مليار دولار قدر دخل قناة السويس هذا المصنع الاسرائيلى بيصنع البرسيسور بنتيوم فور<br />فية ناس دمرت التعليم فى بلدك<br />يعنى اية طفل فى اول اعدادى بيدرس لغات انجليزى وفرنساوى وعربى - فين وقت الفيزيا والعلوم والكيمياء<br />هل الطفل اليابانى بيدرس 3 لغات زى الطفل بتاعنا<br />نحن نمر بوقت مظلم وسينتج عنة كارثة كبرى مستقبلا"
archived = "2008-10-23"
capture_url = "https://web.archive.org/web/20081023010910/http://masr.20at.com:80/newArticle.php?sid=17983"

