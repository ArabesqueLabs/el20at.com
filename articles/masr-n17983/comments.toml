[[comments]]
order = 5
subject = "غياب التخطيط من البلد منذ 40 عاما"
author = "محمد نور الدين"
text = "تخيل الاثتثمارات اللى اتجهت للبطاطس والشيبسى والفوكس اتجهت لصناعة مكونات الكمبيوتر<br />تخيل مليارات الدولارات التى انفقت على فيلل وشاليهات فى الساحل الشمالى وتستخدم شهرين فى السنة لو وجهت المليارات دى لصناعة مكونات السيارات والحديد والصناعات الالكترونية كنا وصلنا لفين وكان حالنا بقى شكلة اية<br />تخيل المليارات التى انفقت على الغردقة وشرم الشيخ لو انفقت على بنية صناعية قوية كصناعة الكيماويات والالمنيوم والبلاستيك والات البناء والصناعات العسكرية كان بقى حالنا اية<br />تخيل جزيرة زى تايوان انتاجها الصناعى اللى بيصدر قد اية<br />بلد زى المانيا بتنتج سيارات المرسيدس وال بى ام دبليو والاودى وبلد جنبها زى ايطاليا بتصنع قطع غيار تجارية لها<br />لو كان عندنا جهاز تخطيط يختار مكان المصنع ويحدد مكان المصنع ويطلب من المثتثمرين عمل ذلك المصنع<br />لو كان جهاز التخطيط وجة المواطنين للاثتثمار فى صناعة الحديد فى الواحات واسوان وخلق مناطق جذب كان حالنا بقى اية<br />المواطن معاة فلوس لكن مش عارف يعمل بيها اية<br />محدش بيوجة - محدش بيرشد -- محدش عندة خطة<br />والنتيجة كل واحد بيعمل اللى على مزاجة<br />والكل استشيخ والكل بيفتى وناس فاضية تعمل تحرش تعمل بانجو تعمل افكار متطرفة ببساطة لانة فاضى"
archived = "2008-10-23"
capture_url = "https://web.archive.org/web/20081023010910/http://masr.20at.com:80/newArticle.php?sid=17983"

