[[comments]]
order = 1
subject = "انة محام و رجل قانون و مزور للاسف الشديد يمتهن السياسة للاسترزاق عارا علية"
author = "ممدوح زكى زخارى جرجس/الاسكندرية_مصر"
text = "من ذلك المدعو/ايمن نور؟حقا<br />محام درس القانون و يعرف جيدا العقوبات التى تطبق على اى مجرم يرتكب جريمة<br />فما بالنا نحن عندما نجد ذلك المدعو؟ايمن نور يقوم بتزوير توكيلات قضائية لتحقيق مكاسب و طموحات شخصية لة مستغلا المناخ السياسى الحالى<br />لو كان الامر بيدى لكنت قد طبقت حكم الشريعة و قطعت يدة و من ثم قطعت لسانة الطويل و جعلتة عبرة لمن لا يريد ان يعتبر ؟<br />هل نحن حقا سفهاء بان نقاد كلبهائم خلف ذلك المزور سليط اللسان طالب السلطة عن طمع و غباء و جهل و ؟؟؟<br />ايمن نور مجرم طبقا للجرم الذى اقترفة و فقا للقانون اللذى درسة و يطبق فى كافة المحاكم المصرية و فقا للواقع<br />الشعب المصرى الحر من الصعب علية ان يساق خلف ذلك المحام المزور طالب السلطة المسجون خلف الاسوار نتيجة لما اقترفت نفسة فى حق الوكن و الديمقراطية"
archived = "2008-08-12"
capture_url = "https://web.archive.org/web/20080812064701/http://masr.20at.com:80/newArticle.php?sid=16952"

[[comments]]
order = 2
subject = "لا بوش و لا بوش و لا بوش و لا حتى هوش حاحا شى شى"
author = "ممدوح زكى زخارى جرجس/الاسكندرية_مصر"
text = "السجين؟ايمن نور<br />لتكن لك ثقة فى رحمة اللة نتيجة لما فعلتة نفسك فى حق الوطن<br />لا بوش و لا الف بوش و لا الف مليون بوش يستطيع ن يطلب العفو عنك؟<br />(القانون قانون)<br />ارجو ان تكون قد استوعبت الدرس جيدا يا غبى؟<br />و انتظر رحمة اللة حتى يقضى امرا كان مفعولا"
archived = "2008-08-12"
capture_url = "https://web.archive.org/web/20080812064701/http://masr.20at.com:80/newArticle.php?sid=16952"
