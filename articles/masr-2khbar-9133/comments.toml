subject = "سيادة الرئيس وارساء الدييمقراطية في مصر"
author = "مش شريف الدواخلي ولا دودي ام ن"
posted = "2008-05-22"
text = "ما تستعجلوش على الريس يا جماعة<br />سيادة الريس بيرسي الديمقراطية الحقيقية في مصر<br />وهو عامل خطة لذلك محتاجه خمسين سنه خلص 27 سنه منهم<br />وان شاء الله بعد 50 سنه مصر حتبقى اكبر دولة ديمقراطية في العالم"
