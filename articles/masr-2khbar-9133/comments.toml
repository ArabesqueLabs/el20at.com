[[comments]]
order = 0
subject = "بوش مجرم حرب ولكنة قال الحقيقة كاملة فى خطابة ربما"
author = "من الشعب"
posted = "2008-05-21"
text = "كلام بوش اغضب الدكتاتورية والحكام الفراعنة<br />ولكنة من تحت لتحت تكلم عن الشباب الذين نسبتهم اكثر من 40 % من السكان ويستطيعون التغيير عن طريق النت والمحمول وربما يقصد ما حدث مع شباب 6 ابريل والفيس بوك فى مصر<br />وتكلم عن 75 % من الشعب الامريكى متدين ويصلى مرتين فى الاسبوع ولا يعتقلون وكان يقصد القاء القبض على الاخوان المسلمين بسبب تدينهم ومنعهم من دخول الانتخابات<br />الرجل تكلم بصراحة ولم يقل حاجة ضد الشعب ولكن قال ضد الحكومة وانا شخصيا سعدت بخطابة وكان صادقا<br />بعكس الكذابين الذين تكلموا عن الاصلاح والحرث فى البحر والنصب والاثتثمار فى السرقة والتهليب والبيع<br />كان خطاب بوش اكثر من رائع بالنسبة للشعب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "حاكم في السلطة ومعارضة في السجن"
author = "مش ضروري"
posted = "2008-05-21"
text = "يعني باختصار مبارك في السلطة والاخوان في السجن<br />هي امريكا عايزه ايه من الاخوان<br />يعني الاخوان حيخدموا امريكا في ايه في المرحلة المقبلة<br />سرور راجع من امريكا عايز يعمل حزب للاخوان<br />الاخوان عمالين يلعنوا امريكا في مواقعهم<br />وامريكا بتلمع فيهم وبتجهزهم للحكم<br />لازم الاخوان يعرفوا هي امريكا عايزه منهم ايه بالضبط"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "كل سنه وانت طيب يا ريس"
author = "مش دعاء الشامي ولا مروة صلاح"
posted = "2008-05-21"
text = "كل سنه وانت طيب يا ريس<br />كل سنه وانت متجوز واحنا مش متجوزين<br />كل سنه وانت واقف واحنا نايمين<br />كل سنه وانت شبعان واحنا جعانين<br />انت فاكرنا يا حبيب الملاييين<br />فاكر المكسحين<br />فاكر المضروبين<br />فاكر المعتقلين<br />فاكر المحبوسين<br />مسكين حتفتكر مين ولا مين ولا مين"
archived = "2010-03-14"
capture_url = ""

