subject = "الله يسعد ( مصر ) طول عمرها تجمع العرب وتفرح لفرحه"
author = "لايهم"
posted = "2007-12-07"
text = "الف مبروك للسعودية والعراق<br />لكن احـزننا شيء واحـد وهو تـعهد المشعوذ العراقي على قناة شهرزاد<br />تعهد بـفوز العراق على السعودية<br />يعني راح يعمل ربط للمنتخب السعودي عن التهديف<br />الله يستر .. راح نتابع ونشوف"
archived = "2010-03-14"
