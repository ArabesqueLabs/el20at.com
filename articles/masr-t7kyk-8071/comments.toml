subject = "بيانات العضو : أحمد ثابت أحمد طوغان"
posted = "2008-01-21"
text = "بيانات العضو : أحمد ثابت أحمد طوغان<br />أحمد ثابت أحمد طوغان أسم العضو<br />1926-12-20 تاريخ الميلاد<br />محل الميلاد<br />المؤهل الدراسى<br />المؤهل العلمى<br />مستشار دار التحرير للطبع والنشر ورئيس تحرير مجلة أمبسادورز العالمية التى تصدر من كندا الوظيفه الحاليه<br />رئيس تحرير مجلة كاريكاتير ورسام الكاريكاتير لمعظم الصحف المصرية منذ 1946 الوظائف والمناصب السابقه<br />البريد الألكترونى<br />أدب الرحلات والرسوم الكاريكاتورية التخصص الادبى<br />0000-00-00 تاريخ الانضمام الى الاتحاد<br />765 رقم العضويه<br />1. أيام المجد فى وهران ( 1954 ) أدب رحلات 2. قضايا الشعوب ( 1957 ) كاريكاتير سياسي 3. أيام من العمر ( 1971 ) أدب رحلات 4. الريح الصفراء ( 1968 ) أدب رحلات 5. كاريكاتير طوغان ( 1970 ) كاريكاتير اجتماعي 6. كاريكاتير طوغان ( 1996 ) كاريكاتير سياسي 7. حدث فى دولة ديموقراطيستان ( 1997 ) أدب ساخر 8. كاريكاتير طوغان ( 1998 ) كاريكاتير سياسي 9. يوميات رسام كاريكاتير ( 2000 ) كاريكاتير سياسي 10. مجموعة رسوم ( 2001 ) اتحاد الكتاب كاريكاتير سياسي المؤلفات الأدبيه<br />وسام العلوم والفنون من الطبقة الأولي 1977 جائزة حقوق الإنسان 1989 جائزة مصطفى وعلى أمين الصحفية 1987 درع قوات المثني العراقية 1997 المهرجان الدولي للكاريكاتير فى الإسماعيلية 2000 مهرجان الجونة الدولي 1999 الأوسمه والجوائز الحاصل عليها<br />من أقوال الاعلام<br />النقابات والهيئات التي ينتمي إليها: نقابة الصحفيين ـ نقابة الفمانين التشكيليين ـ اتحاد رسامي الكاريكاتير العالميين ( التابع للاتحاد الإوروبي"
archived = "2010-03-14"
