subject = ""
author = "الاعلامية الفلسطينية"
posted = "2010-03-14"
text = "لا أظن ان اسرائيل ستجرؤ على ذلك في هذا الوقت فلو انها ارادت هدمه لهدمته سابقا حينما اتيحت لها فرص افضل وخصوصا حينما اصبح هناك وعي اكبر حول قضية فلسطين والاقصى .. أما لوحدث ان هدمت اسرائيل الاقصى (لا سمح الله ) فسيغضب الحكام العرب ليس لاجل الاقصى وانما لتعكير مزاجاتهم بأخبار المظاهرات في بلادهم ولاضطرارهم لحضور قمة عربية طارئة للاتفاق على صيغة بيان الشجب والاستنكار بالاضافة لاخذ الصور التذكارية ثم شهران يمران بمظاهرات واحتجاجات ومشادات بين الدول العربية حول من المسؤول عن تعطيل السلام في المنطقة وبعدها … يعم الهدوء المنطقة ويصبح المسجد الأقصى معلما أثريا قديما ويدون في كتب التاريخ والمناهج المدرسة على أن سقوطه كان بفعل الزلازل الطبيعية والظروف البيئية ويكون الاقصى في خبر كاااااااااااااا اااااان . نبكيه كما نبكي الأندلس الآن ."
archived = "2010-03-16"
capture_url = "https://web.archive.org/web/20100316064059/http://www.20at.com:80/20at/politics/15754--16-.html"

