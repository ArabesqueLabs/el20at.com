author = "المشتاقة الى الجنة"
posted = "2010-03-15"
text = "من الواضح ان الحرب قد اوشكت وان يوم القيامة ليس ببعيد فقد قال رسول الله _صلى الله عليه وسلم_\"لن تقوم القيامة حتى يحارب المسلمين اليهود حتى ينطق الحجر والشجر يا مسلم يا عبد الله ورائي يهودي تعالى فاقتله\"فهيا بنا نلبي نداء المسجد الاقصى لبيك يا اقصى لبيك يا رسول الله"
archived = "2010-03-16"
capture_url = "https://web.archive.org/web/20100316064059/http://www.20at.com:80/20at/politics/15754--16-.html"

[[comments]]
