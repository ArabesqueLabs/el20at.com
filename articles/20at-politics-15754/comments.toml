text = "انا متاكد وواثق بان الله عز وجل لن يتخلى عن المسجد الاقصى المبارك . و بعدين اين هم روؤساء وملوك العرب والمسلمين من المفترض قيام حرب نقضى قيها على اليهود الملاعين اليس كذلك"
