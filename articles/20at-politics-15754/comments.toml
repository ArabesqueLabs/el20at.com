author = "حاتم"
posted = "2010-03-15"
text = "لا إله إلا الله محمد أشرف الخلق رسول الله ممكن يكون الكلام ده حقيقي والعرب يفضلوا ساكتين كده هيرضوا بالذل والهوان اللهم انتقم من اليهود بجد لو رضينا وسكتنا يبقى الذل والإهانه مش كتير علينا ومش كتير علينا اللي بيحصل فينا من الكفرة واليهود ربنا ينتقم منهم"
archived = "2010-03-16"
capture_url = "https://web.archive.org/web/20100316064059/http://www.20at.com:80/20at/politics/15754--16-.html"

[[comments]]
order = 6
subject = ""
author = "علي"
posted = "2010-03-15"
text = "حسبي الله ونعم الوكيل هو نعم المولى ونعم النصير هو الحافظ وهو الكافي بعد تخاذل الرؤساء الجبناء العرب المتهاونون والمتخاذلون مع اليهو القردة والخنازير فماذا ينتظرون ؟ هل ينتظرون هخدم الأقصى أولا ليتحركوا أو أنهم لن يحركوا ساكنا خوفا من أمريكا وإسرائيل ؟ إني لأدعوا على اليهود ومن عاونهم ولكن لابد لنا أن ندعوا على الرؤساء العرب الذين لا يشغلهم إلا الحكم والكرسي ولا يشغلهم أمور المسلمين وأمور شعوبهم … وإني لأتمنى منكم جميعا أنتفاضة وغضبة من أجل الأقصي على كل ظالم وفي النهاية يجب أن نقول حسبنا الله ونعم الوكيل"
archived = "2010-03-16"
capture_url = "https://web.archive.org/web/20100316064059/http://www.20at.com:80/20at/politics/15754--16-.html"

[[comments]]
order = 7
subject = ""
author = "وفاء السيد"
posted = "2010-03-15"
text = "اللهم لا تشمت بنا أعداء الدين ،، اللهم انصر الأقصى من أيدي اليهود والمغتصبين ،،،، اللهم اخذلهم واخزهم وزلزل الأرض من تحت أقدامهم ،،، واجعل ثغرهم في نحورهم ،، اللهم عليك باليهود في فلسطين،، وفي كل مكان يارب العالمين ،،، وحسبي الله ونعم الوكيل"
archived = "2010-03-16"
capture_url = "https://web.archive.org/web/20100316064059/http://www.20at.com:80/20at/politics/15754--16-.html"

[[comments]]
