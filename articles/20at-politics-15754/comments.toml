[[comments]]
order = 9
subject = ""
author = "صهيب العربي-مسلم يقظ"
posted = "2010-03-15"
text = "بسم الله والصلاة على رسول الله<br />خطب جليل زعزع الأركانا *** أحقا سيهدم في غد أقصانا؟؟<br />فهاج قومي وماجوا إذ همو سمعوا*** وقيل ان فعلوا سنحطم الطغيانا<br />يا ويح قومي جهلا بعد ما علموا ***ان الكلام خداع طفق يغشانا<br />إخوتي من الواعين<br />أهيب بكم أن تنظروا إلى ما تحت الأخبار وأن تمدوا أبصاركم إلى ما وراء الأكمة فإنها والله وراءها ما وراءها<br />إن المسجد الأقصى ليس بناية واحدة بل انه أرض ذات سور كلها مسجدنا<br />وإن هدمها لن يحصل لأنهم اتخذوا بعضه زورا وبهتانا معالم يهودية وعرفوه للعالم أنه من آثارهم<br />فلن يهدموه لا لأجلنا بل لمصلحتهم وليتخذوه ذريعة لبقائهم أمام العالم الغافل<br />لإن هدم المبنى القبلي من المسجد أو بعض المصلى المرواني أو مسجد قبة الصخرة فمازال المسجد مسجدنا هو الأرض تحتها<br />لكن هذا بعيد الوقوع والأخطر منه أن يكون هذا الخبر إبرة مخدر كي لا نثور عندما يستحلون بعض مسجدنا لأجل هيكلهم ونقول<br />\" اللحمدلله لساتو مسجدنا قايم وهيهم أخدوا قطعة منو أهون ما يهدموا \"<br />هذا هو المخطط الصهيوني القذر فلو هدم لاستيقظ البعض لكنهم أخبث من ذلك<br />أرجوا عموم النفع ومن الله الأجر"
archived = "2010-03-16"
capture_url = "https://web.archive.org/web/20100316064059/http://www.20at.com:80/20at/politics/15754--16-.html"

