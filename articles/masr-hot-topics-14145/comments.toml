author = "التضخم كيف وصل"
posted = "2009-11-24"
text = "ذهبت الى سوق المواشى لاشترى ذبيحة<br />زمان قبل سياسة الاصلاح الاقتصادى بتاع المحروس وابوة كان سعر الجاموسة 1200 جنية<br />دلوقتى وبسعر الاسبوع دة سعر الجاموسة فى السوق 13 الف جنية<br />يا شعب مصر يا اللى عايز تاكل لحمة سعر الجاموسة وصل الى 13 الف جنية<br />وفى ايام ناصر كان سعر الجاموسة 80 جنية<br />شايفين الاصلاح الاقتصادى اللى بيتكلموا علية<br />انا اتوقع ان الجيل القادم لن يستطيع ان ياكل اللحم اطلاقا ولن يراها اطلاقا<br />فرصة الحقوا كلوا لحمة قبل ما تبقى من التاريخ<br />والطالب يقول لزميلة انا جدى كان بيشترى كيلو لحمة - تصور<br />يا لهوى<br />الجاموسة ب 13 الف جنية<br />يا ما رحت فى الكازوزة يا جنية<br />كان مالة الاقتصاد ما كان حلو بتخربوا فية اية"
