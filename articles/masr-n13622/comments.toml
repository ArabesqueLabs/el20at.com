[[comments]]
order = 0
subject = "دعاء.. جارتي العزيزة"
author = "محمد فاروق"
posted = "2008-01-01"
text = "يارب يا دعاء تقومي بالسلامة ونشوف الأنسة ننوشة جنبنا بتلعب وتتنطط ..<br />عاوز أقول ان دعاء هي جارتي العزيزة في المكتب من اول 2007 لما جابولي كمبيوتر، وده طبعا من حُسن حظي الجامد جدا، لأننا بنراعي حقوق الجار زي الرسول ما وصانا خصوصا في \"الأكل\"..<br />كل سنة وانتي طيبة يا دعاء وبراء طيب والسنة الجاية تكون ننوشة بنكم بهجة البيت."
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104095201/http://masr.20at.com:80/newArticle.php?sid=13622"

[[comments]]
order = 1
subject = "بخاف اوي من ننوشة"
author = "اكتب اسمك هنا"
posted = "2008-01-01"
text = "انا طبعا بحب ننوشة جدا و نفسي اشوفها موت لكن بجد يا ننوش انا بخاف منك اوي على طول بطلب من دعاء انها توريهاني و هي بتتحرك جواها و ما ان اضع يدي و اشعر بزلزال جوه بجد بحس انى خايفة اوي و بأشعر جدا و احيانا عيني بتدمع لا اعرف لماذا تفعلين كل هذا بي يا ننوشة رغم انت اصلا لسه مطلعتيش من البيضة و طبعا البيضة هي دعاء"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104095201/http://masr.20at.com:80/newArticle.php?sid=13622"

[[comments]]
order = 2
subject = "م"
author = "مروة عبد الفضيل"
posted = "2008-01-02"
text = "الاستاذه دعاء للى ميعرفهاش كل ماتيجي الموقع ماورهاش حاجه غير انها ترغي كتييييييييييييييييير اوى واوقولها اسكتى بئه عايزه اشتغل لكن على مين لا حياة لمن تنادى والنهارده اللى هو يوم الاربعاء انججنتنى عشان نتمشي في الموقع شويه ا عشان ننوشه تتمشي معانا هى كمان وانا طبعا عارفه وهى مأنججانى كانت بتفكر في مين فى جوزها طبعا هى هتعمل بيه انا ايه يالا يا دودو تقومى بالسلامه مش هقولك طبعا كلمتى المعتاده عشان الرقابه"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104095201/http://masr.20at.com:80/newArticle.php?sid=13622"

[[comments]]
order = 3
subject = "هو ما فيش واحدة اتجوزت وحملت غيرك"
posted = "2008-01-12"
text = "ايا يا دعاء الهوسه اللي انت عاملاها دي<br />هو ما فيش واحدة اتجوزت وحملت الا انتي<br />عجيبه والله"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142503/http://masr.20at.com:80/newArticle.php?sid=13622"

[[comments]]
order = 4
subject = "الى ام ننوشه"
author = "نيفين نيفى نوفا"
posted = "2008-01-13"
text = "فاكره يا دعاء ايام فرحك لما علقت على موضوعك و قلتللك يمكن لما ييجى يوم فرحى احس بكلامك ومع انى كنت عايشه حاله حب بالفعل بس فعلا يوم خطوبتى حسيت بكلامك اكتر و اكتر<br />و اكيد هحس اكتر بكلامك لما اعيش الحاله دى<br />بجد احساسك عالى اوى و اول مره اشوف حد بيوصف الامومه بالبراءه و الطفوليه دى<br />بتفكرينى بنفسى كتير<br />يا رب ننوشه تيجى بقى و تنور حياتك انتى و براء"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142503/http://masr.20at.com:80/newArticle.php?sid=13622"

[[comments]]
