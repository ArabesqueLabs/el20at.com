posted = "2008-01-15"
text = "وان شاء الله لما تدخلي وتتجوزي حتحسي بحاجات احسن واحسن<br />انما ما قلتلناش النطع اللي حيتجوزك اسمه ايه"
archived = "2008-02-16"
capture_url = "https://web.archive.org/web/20080216142503/http://masr.20at.com:80/newArticle.php?sid=13622"

