author = "عزاء واجب"
posted = "2010-03-11"
text = "على كل الاحوال مات عالما وشيخا من شيوخ المسلمين<br />قد نكون اختلفنا معة او وقفنا معة<br />قد نكون اختلفنا معة فى تساهلة فى فتاوى الحجاب فى فرنسا والنقاب فى مصر<br />ربما فى فوائد البنوك<br />واختلفنا معة فى مقابلات الحاخامت اليهود وتساهلة مع الصهاينة<br />ربما ظروف قيادات البلد السياسية دفعتة الى ذلك<br />ربما كبر سن الرجل وانة اثر الدعة والتساهل وترضية الجميع<br />ولكن الفقيد على الجانب الاخر لة كتبة واجتهاداتة الدينية ولة تلاميذ ومريدون وطلاب<br />مات واحد من علماء المسلمين<br />والعزاء فية واجب<br />وطلب الرحمة والدعاء لة<br />والبركة فيمن يخلفة"
archived = "2010-03-12"
