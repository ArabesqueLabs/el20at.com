posted = "2010-03-10"
text = "عقبال ما يرجعوا كلهم فى صناديق الى قرية البضائع وعقبال سرور وزكريا عزمى وسيد والى والشريف وبقية العصابة<br />انا مش حاقد ولا كارة<br />ولكن الناس دى تخطت الاعمار الافتراضية وزمايلهم ماتوا من عشرات السنين<br />ابقى خللى احضان بريز والحاخامات تنفعك امام الديان<br />من هنا يبدأ الاصلاح<br />موت الفاسدين"
