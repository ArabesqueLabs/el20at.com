[[comments]]
order = 5
subject = "بعودة  يا أحمد"
author = "لو كنت اعلم"
posted = "2007-04-30"
text = "ممتاز موضوع القفا ده<br />بس إيه السبب في إنك كتبت عنه<br />يمكن لأنه عضو مهم ، زي ما الكابتن الشاعر الكبير الستاموني قال في فيلم الكيف( كل الناس غنوا للعين وللشعر وللخدود إنما عمر حد غنى للقفا)<br />أديني أسعدني زماني وشفت شباب زي الورد قاعدة تكتب موضوع عن القفا<br />بس موضوع حلو ، وإن كان الاستعراض اللغوي فيه اعلى من فكرة الموضوع شويتين<br />أما بالنسبة لموضوع الشيخ بتاعك<br />هو انا كل ما أقرالك حاجة ألاقيك متعقد من دراستك<br />يا أخي لولا القرف والبهدلة اللي شفتهم في دراستك ، ما كنش زمانك بقيت أحمد ندا اللي معقدنا ده<br />كلها تراكمات لبناء شخصيتك<br />بس واضح غنك معقد معقد يعني<br />الحال من بعضه عموماً<br />مبرووووووووووووك"
archived = "2007-05-31"
capture_url = "https://web.archive.org/web/20070531022712/http://masr.20at.com:80/newArticle.php?sid=9957"
