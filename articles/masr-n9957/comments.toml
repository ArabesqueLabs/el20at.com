[[comments]]
order = 2
subject = "كل قفا وانتم .."
author = "دبمة"
posted = "2007-04-26"
text = "معرفش هو الملف ده ايه، كل ما ادخل على الموضوع والمفروض انى مستعدة مسبقا للضحك اكتشف انى زعلانة اوى وفى حاجة قلقانى وقربت توجعنى .. يمكن قفايا<br />بس قفا الراجل المدرس بتاعك ده اقل حاجة وجعت مع انه اكيد ساعتها كان هم ما يتلم زى عصاية مس زفتة كريمة بتاعة الالعاب فى سنة تانية ابتدائى عشان كنت امينة الفصل وما عرفتش اسكتهم ، يومها ضربتنى عصاية نفسى الاحقها قانونيا من اجلها الى الـآن<br />لكن انت الشيخ بتاعك ده مهما عمل .. فهو خلى واحدة زيى النهاردة تحسدك انت و ناس تانية وتقول .. يابختكم بلغتكم<br />بابا كان بيقرا لى شعر وانا فى ابتدائى، وكان بيخلينى اطلع مترادفات واقعد احفظها، اكتر حاجة فاكراها<br />ان لا مفر = لا مندوحة =لا مناص = لا بد =لا خلاص<br />هذا هو اهم ما بقى فى عقلى من اللغة .واتذكره اليوم مع حديثكم عن بلدى اللصيقة بى كما القفا والقفا شخصيا، قكل يوم يتضح لى اكثر انه \" لا مفر\"<br />بجد ملف حلو اوى تسلم ايدكم كلكم<br />ولو حد يعرف زفتة كريمة .. يقولى هى فين"
archived = "2007-04-30"
capture_url = "https://web.archive.org/web/20070430031656/http://masr.20at.com:80/newArticle.php?sid=9957"

[[comments]]
order = 3
subject = "مكر مفر مقبل مدبر معا ..كجلمود ضخر حطه السيل من عل"
author = "نيفين نيفى نوفا"
posted = "2007-04-26"
text = "و هو دا احمد ندا<br />مش عارف ليه مقاللك فكرنى باكتر بيت من ابيات الشعر الجاهلى قعد مدرس اللغه العربيه يشرحهولنا<br />و مناظراتنا انا واصحابى عن الشعر لجاهلى و الشعر الحديث<br />و يا بنتى روحى اقرئيللك بيتين ف كامل الشناولى<br />طيب يا جماعه ما انا بحب كامل الشناوى<br />طيب قولى لنفسك<br />طيب ما تقرو انتو كمان الحصرى<br />و ماله شوقى<br />سيدى و تاج راسى<br />و نزار يا فالحه ..طيب نزار و لا ابن زيدون<br />يا تحف كل دول درر بس كل واحد ليه وقته و ليه طعمه يعنى لو الشعر الحديث القمر فالشعر الجاهلى هو الشمس اللى بيستمد منها نوره<br />ازاى يا ام العريف<br />يا جهاهلين الحصرى قال يا ليل الصب متى غده اقيام الساعه موعده فرد شوقى و قال مضناك جفاه مرقده و بكاه و رحم عوده<br />ياااااه يا ندا فكرتنا بالذى مضى"
archived = "2007-04-30"
capture_url = "https://web.archive.org/web/20070430031656/http://masr.20at.com:80/newArticle.php?sid=9957"

