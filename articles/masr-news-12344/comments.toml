[[comments]]
order = 10
subject = ""
author = "ضد الدستور"
posted = "2009-06-12"
text = "هو مش فية دستور فى البلد دى<br />وفية مادة رئيسية فية تدعو الى المواطنة وعد التمييز بين المواطنين على حساب الجنس والدين والعرق وان المواطنين كلهم سواء امام القانون<br />طيب لية اميز النساء واضع لهم عدد معين لازم يدخل ------ من حق اى امراة ان تترشح وحتى لو نصف مليون امراة يترشحوا واللى تنجح تدخل المجلس زى اى مواطن<br />انما فرض عدد معين لازم ينجح فهذا ضد الدستور وممكن ان يجر الوطن الى مشاكل هو فى غنى عنها<br />بكرة الكناسين يطالبوا بعدد مناسب لهم فى المجلس<br />والاطفال يطالبوا بعدد يمثلهم فى المجلس<br />والبهائيون يطالبوا بعدد فى المجلس<br />والارثوذكس يطالبوا بعدد فى المجلس<br />والكاثوليك والانجليون يطالبوا بعدد فى المجلس<br />ورجال الطرق الصوفية هيقولوا احنا عددنا 8 مليون ولازم يبقى لنا نواب<br />الموضوع مقدمة لتفتيت مصر<br />لان الناس اللى قاعدين على القمة اغبياء ودى مقدمة لعمل اعداد زى لبنان تدخل كل طائفة بها المجلس<br />ستتحول مصر خلال فترة بسيطة الى لبنان والمجلس هيبقى مجلس الطوائف<br />دى مقدمة للى جاى<br />ابشروا بالخراب"
archived = "2010-03-11"
capture_url = ""

[[comments]]
