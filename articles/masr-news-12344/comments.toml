posted = "2009-06-11"
text = "ولزومه ايه يا سيادة الرئيس صرف الفلوس والبعزأه دي بس<br />ولزومه ايه مجلس الشعب من اصله<br />طالما الكلمة كلمتك والشورة شورتك يا ريس<br />المفروض يا ريس مجلس الشعب هو اللي يتكلم في تغيير الرئاسة وتغيير اسلوب انتخاب رئيس الجمهونرية<br />مش انت اللي تتكلم في تعديل مجلس الشعب وتغييره<br />يا ريس ويا اعضاء مجلس الشعب ويا شعب مصر افهموا يعني ايه برلمان الاول<br />افهموه من امريكا وبريطانيا وفرنسا<br />رئيس الدولة ما لوش اي سلطة على البرلمان<br />البرلمان هو اللي ليه سلطة على رئيس الجمهورية<br />اصحوا بقا بلاش غباء وجهل ضحكتوا الناس علينا"
