[[comments]]
order = 8
subject = ""
author = "ابومحسن غربة 27 سنه"
posted = "2009-06-12"
text = "عن عبدالله بن عمرو رضي الله عنهما، قال: سمعت رسول الله صلى الله عليه وسلم يقول: \"سيكون في آخر أمتي رجال يركبون على سروج كأشباه الرِّحال، ينزلون على أبواب المساجد، نِساؤهم كاسيات عاريات على رؤوسهن كأسنمة البخت العجاف، العنوهنَّ فإنهن ملعونات، لو كان وراءكم أمة من الأمم، لخدمن نساؤكم نساءهم كما يخدمنكم نساء الأمم قبلكم\"، وعن عبدالله بن مسعود رضي الله عنه، عن النبي صلى الله عليه وسلم قال: \"المرأة عورة، فإذا خرجت استشْرَفَها الشيطان، وأقرب ما تكون من وجه ربها وهي في قعر بيتها\"، وفي رواية للطبراني، قال: \"النساء عورة، وإن المرأة لتخرج من بيتها وما بها بأس، فَيَسْتَشْرِفَها الشيطان، فيقول: إنَّكِ لا تمرين بأحد إلا أعجبتيه، وإن المرأة لتلبس ثيابها، فيقال: أين تريدين؟ فتقول: أعود مريضاً، أو أشهد جنازة، أو أصلي في مسجد، وما عَبَدَت امرأة ربها مثل أن تعبده في بيتها\"،"
archived = "2010-03-11"
capture_url = ""

