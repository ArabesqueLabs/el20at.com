posted = "2009-06-12"
text = "اصل الرئيس بتاعنا شاف فيلم محمود عبدالعزيز بتاع اغنية الكيميكا الكيميكا فاكرينه بتاع المخدرات<br />فكان فيه اغنية بتقول<br />اديني في الهايف وانا احبك يا نننس<br />اديني في الهايف وانا احبك يا نننس<br />فاكرنها<br />فحسني مبارك عنده المستشارين بتوعه اللي عمالين يقولووا الكلام الفارغ دا<br />واحنا بنقول اديني في الهايف وانا احبك يا مبارك<br />البرلمان كان كله اخوان والمرادي نسوان<br />فهل ينجح النسوان ما فشل فيه الاخوان"
