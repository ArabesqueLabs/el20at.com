subject = ""
author = "اطياف النسوان"
posted = "2009-06-12"
text = "والمفروض ان مقاعد السيدات تغطى جميع مجالات الحريم<br />فربات البيوت لهن نائبات<br />والموظفات والعاملات لهن نائبات<br />والفلاحات لهن نائبات<br />والعاملات فى ملاهى شارع الهرم والشقق المفروشة لهن نائبات<br />دى تفكير ناس متخلفين بيجروا وراء المظاهر الكدابة - يعنى لو واحدة ست قادرة على الخدمة الاجتماعية ولها نشاط بين الناس فية احد منعها ان ترشح نفسها وتدخل البرلمان<br />اية لزمة الكوتة ويبقى فية عدد لازم يدخل<br />بكرة واحدة مشهورة زى الست فيفى عبدة ترشح نفسها وكمان الست شيرين والستفتكات وتخل كمان موضة الفنانات المحجبات الست فلانة والست علانة<br />ال يعنى خلاص حلينا مشاكل البلد وفاضل ادخال النسوان مجلس الشعب<br />فابشروا يا مصريين مشاكل العنوسة هتنحل<br />ومشاكل البطالة هتنحل<br />وهيبقى فية فائض فى الميزانية مش عارفين نصرفة ازاى ويمكن نقرض البنك الدولى 50 مليار دولار<br />ابشروا يا مصريين"
archived = "2010-03-11"
capture_url = ""

