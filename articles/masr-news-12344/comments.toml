text = "مجلس شعب اية<br />ومجلس شورى<br />كل حاجة فى البلد دى بتمشى بتوجيهات سيادتة<br />وسيادتة بينصح العراق وسوريا واسرائيل<br />وسيادتة الحكيم<br />وسيادتة رجل الاستقرار والامن والامان<br />يبقى اية فايدة مجلس الشورى وفايدة مجلس الشورى<br />زمان لما اللحمة غليت وبقت بواحد جنية - طلع واحد يشرح للناس ان اللحمة غليت علشان البهايم دخلوا مجلس الشعب ومبقاش فية بهايم يدبحوها"
