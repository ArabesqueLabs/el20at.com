[[comments]]
order = 0
subject = "تابعت الكلام فى المؤتمر قليلا فسمعت كلاما مجرد كلا"
author = "من عامة الشعب"
posted = "2008-11-01"
text = "المتحدثون من الكبير الى الصغير بيتكلموا عن تحقيق العدالة الاجتماعية وحقوق الفقراء والصعيد ولم يقل اى واحد فيهم ازاى هيتم تنفيذ هذا الكلام<br />كيف نحول الاقوال الى افعال<br />ماهو البرنامج لذلك ؟ وماهى المشاريع وبالاسم والمكان التى ستنفذ لتحقيق ذلك<br />ماذا سنصنع لتحقيق ذلك ؟<br />ام ان الامر كلة<br />كلة كلام ابن عم حديد<br />مجرد كلام وكلام وكلام وبدون اى تنفيذ<br />انا اتحدى اى واحد القى كلمة فى المؤتمر يكون فهم الكلام اللى قالة - مجرد واحد صحفى كتبة وهو بيلقية<br />يعنى كلة كلام فى كلام<br />وشبعتا كلام<br />ورحمك اللة يا دكتور عزيز صدقى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "ركزوا كلامهم فى المؤتمر عن الاصلاح الاقتصادى"
author = "مش فاهم اى حاجة"
posted = "2008-11-01"
text = "كل كلام قادة الحزب الوطنى المبجل عن الاصلاح الاقتصادى<br />كلامهم على راسى من فوق لو كان عندنا اقتصاد اصلا - هو فين الاقتصاد دة<br />عن اى اقتصاد يتكلمون<br />عن الاقتصاد الامريكى والا الاسرائيلى<br />عمالين يجتروا المصطلح دة بدون اى معنى الاصلاح الاقتصادى<br />اقتصاد مصر مبنى اساس على<br />اولا تحويل المصريين بالخارج<br />ثانيا دخل قناة السويس<br />ثالثا شوية الغاز والبترول اللى بنبيعهم<br />بس<br />فية اقتصاد تانى<br />بنصدر سيارات وسلع هندسية وكمبيوترات ومواد عذائية - لا - وحاشا للة<br />السادة الجهلة بتوع الوطنى ارفعوا شعار بناء اقتصاد وليس اصلاح اقتصاد لان مفيش حاجة تتصلح عندنا الشوية المصانع وبعناهم<br />وسلام"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "(اللة يرحمك يا دكتور/مصطفى خليل)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-01"
text = "اللة يرحم الجميع<br />و خاصة دكتور/مصطفى خليل؟!!!<br />و اللة يرحم (الحزب الوطنى) كمان<br />و كلمة حق:_<br />(الحزب الوطنى )<br />خلاص<br />مبقاش وطنى كمان؟!!!<br />كنت عضو فى الحزب الوطنى و اكتشفق اننى كنت مخظئى بالانضمام الية؟<br />فانسحبت خيرا لى و للى الباقى من كرامتى؟<br />ملعون ابو السياسة و اللى يؤمنوا بالسياسة<br />ليؤمن جميعنا بمصر ؟<br />مصر فقط!!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "كل سنه وانت طيب يا ريس"
author = "مش مدير الموقع"
posted = "2008-11-01"
text = "كل سنه وانت راكب واحنا مش راكبين<br />كل سنه وانت واقف واحنا قاعدين<br />كل سنه وانت اكل واحنا جعانين<br />كل سنه وانت مبسوط واحنا زعلانين<br />كل سنه وانت طالع واحنا نازلين<br />كل سنه وانت مفتح واحنا مغمضين<br />كل سنه وانت بتضحك واحنا مبوزين<br />كل سنه وانت فالح واحنا مش فالحين<br />كل سنه وانت واكل واحنا متاكلين<br />كل سنه وانت ضارب واحنا مضروبين<br />كل سنه وانت دايس واحنا منداسين<br />انت فاكرنا يا حبيب الملايين<br />فاكر المحروقين<br />فاكر الغرقانين<br />فاكر المحبوسين<br />فاكر المسجونين<br />فاكر الجعانين<br />مسكين يا حبيب الملايين<br />حتفتكر مين ولا مين ولا مين"
archived = "2010-03-14"
capture_url = ""
