posted = "2009-11-03"
text = "تامل فى الوجوة الشايخة دى<br />كلها عاملة مكياج<br />وسابغة شعرها وبتحط بودرة وبتمثل علينا<br />انت فين يا عزرائيل<br />سايبهم يمثلوا علينا لية<br />اغسلوا وشكم وشيلوا الوساخة اللى انتم حاطينها<br />انتم مش نسوان يا ولاد الكلب<br />وانتم رجالة ربوا شنبات زى الرجالة<br />بطلوا تمثيل رخيص من بتاع الموالد"
