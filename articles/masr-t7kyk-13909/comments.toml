author = "جيمـي"
posted = "2009-11-03"
text = "هما أساساً ناس بتوع مسرحيات<br />يعنى سيادة الرئيس حسنى مبارك مظلوم على فكرة .. بقالو 28 سنة بيمثل ولسة ماخدتش أوسكار لحد دلوقتى .. بالذمة ده حلال ولا حرام .<br />بس أحمد عز برغم انه دخل مجال التمثيل بعد سيادة الرئيس بكتير بس أشهد له أنه سبق مبارك بمراحل وطور من نفسه ... ليه بقى مايخدش جائزة كان ولا اوسكار ولا أى جائزة تقديرية عالمية ... هما الناس الى بره مضطهدة المصريين وكفائتهم ( كفتتهم ) ليه .<br />و التانى الى بيمثل أنه أبن بلد ( جمال مبارك ) .. عارفين مشكلته أيه ... أنه مش عارف يبقى أبن بلد . فبيظهر فى كلامه وأفعاله أنه بيتصنع الجدعنة و انه لافف وصايع وعارف كل حاجة مشية إزاى .. فطبعاً في الآخر بيبان لكل الى بيشفوه أنه فاشل فى التمثيل .. يا خسارة ما طلعش للحاج ."
archived = "2010-03-14"
