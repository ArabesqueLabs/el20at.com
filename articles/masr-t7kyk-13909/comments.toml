author = "ثورة التحديث"
posted = "2009-11-03"
text = "ضحكت كتير قوى<br />لما الواد احمد عز قال عن جمال مبارك انة مفجر ثورة التحديث<br />ونسى يقول عنى انا العبد الفقير<br />اننى مفجر ثورة البطيخ<br />اة طبعا ثورة البطيخ<br />لازم الشعب كلة ياكل بطيخ ويكون بطيخ اسمعلاوى جاى من ارض الصمود والمعركة<br />والفقير بالذات ومحدود الدخل لازم ياكل بطيخ حسب البرنامج الانتخابى للمعلم ابو صليحة بطل الاصلاح الاقتصادى<br />ثورة البطيخ لصاحبها المعلم ابو حباجة موازية لثورة التحديث فى القاء الحواديث"
archived = "2010-03-14"
