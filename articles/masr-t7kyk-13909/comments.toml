author = "ضبش و ضباشة"
posted = "2009-11-03"
text = "كلة كلام فى كلام فى كلام<br />بيقولوا للناس كلام ويعملوا ضدة<br />وبيقولوا كلام للداخل ولما يطلعوا برة فى اوروبا وامريكا بيقولوا كلام تانى<br />طبعا احنا مش اغبياء للدرجة دى - 28 سنة والكلام بيتكرر<br />نفس الجملة من 28 سنة<br />الاصلاح الاقتصادى<br />هو فين الاقتصاد علشان نصلحة<br />ولما نقعد نصلح ونصلح امتى بقى هنبنى اقتصاد<br />كلة كلام ضبش فى ضبش فى ضباشة"
archived = "2010-03-14"
