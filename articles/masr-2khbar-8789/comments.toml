[[comments]]
order = 3
subject = "ربح البيع ياشاطر"
author = "هاني صلاح الدين"
posted = "2008-04-15"
text = "ما اشبة اليوم بالبارحة بالامس صهيب الرومي يخير مابين الثبات علي الحق وبين ماله فيختار الحق فيبشرة الحبيب صلي الله علية وسلم بربح البيع وام نحن الان نجد المفسدين لايخيروا احد بين خيارات بل تفرض العقوبات في حالة عدم الرضوخ لمنظومة الفساد الذي ينشره النظام في ربوع مصر المهروسة فجاهلية الماضي تخير بين الرحيل وبين المال لكن جاهلية الحاضر تحكم علي من خرج بدينة مهاجرا لله ومن اراد ان يواصل النضال علي ارض الوطن سواء بسواء ولا يسعنا الا ان نبشر ذمرة المجاهدين وعلي رأسهم الشاطر ببشرة النبي ربح البيح ابو زهرة وان الحق لمنتصر رغم أنف الفاسدين<br />وحسبنا الله ونعم الوكيل"
archived = "2010-03-14"
capture_url = ""

