[[comments]]
order = 5
subject = "تستحقون ضرب الصرم لانكم انتهازيون"
author = "مصرى"
posted = "2008-04-15"
text = "نسمع كلامكم نقول رائع<br />نصفق لكم ولموافقكم الكلامية والجدلية ولكن الفعل صفر<br />تنافقون النظام وتقتربون منة<br />انتم الحيطة الواطية للنظام كل شوية يضربكم على قفاكم وانتم خانعون<br />بنت زى اسراء بعشرة زى الشاطر ورفاقة<br />اسراء البنت فعلت<br />اما مرشدكم فى 6 ابريل يوم موقف الشعب المصرى كلة فى وجة النظام قال لا سامحونى الاخوان لن يشاركوا<br />لية يا سعادة المرشد - لان الاخوان عندهم الدورة الشهرية<br />تستحقون ذلك واكثر<br />لن يتعاطف احدا معكم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "حكم اثلج صدرى"
author = "حسين كامل"
posted = "2008-04-15"
text = "حكم اثلج صدرى مع انى ارى ان الحكم غير عادل وكنت اتمنى ان تصل العقوبة الى الاعدام او على اقل تقدير السجن المؤبد لكن عزائنا الوحيد ان سنة السجن فى الاحكام العسكرية تعادل 12 شهرا بعكس الاحكام المدنية السنه تعادل 9 اشهر والافراج بعد نصف المدة , اى ان الشاطر سيبقى مسجونا لمده 7 سنوات بالتمام والكمال وهو زى الشاطر !! واخيرا 7 سنوات هو حكم غير عادل وغير كاف لمن يخونوا اوطانهم واتمنى من القضاء العسكرى فى المستقبل ان يكون اكثر حزما تجاه اعداء الوطن من الاخوان المتأسلمين ومن هم على شاكلتهم ممن خربوا ودمروا البلاد"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "الى حسين كامل و مصري المعلقين السابقين"
author = "فاهمكم كويس"
posted = "2008-04-16"
text = "اولا من كلامكم عرفتكم انكم اقباط وخايفين من الاخوان المسلمين لانهم حيقيموا دولة اسلامية وحترجعوا اهل ذمة مرة ثانية وحتدفعوا الجزية عن يد وانتم صاغرون<br />مالكوش دعوة بالاخوان خليكم في الخيبة اللي انتوا فيها الاله المصلوب اللي مش عارف ينزل من على الصليب منذ 2000 سنه"
