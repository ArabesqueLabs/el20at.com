[[comments]]
order = 0
subject = "مقالة سيئة النية"
author = "مصرى"
text = "يعنى كل واحد يغير دينة زى ماهو عايز<br />يعنى اليابان متقدمة تكنولوجيا نبقى زيها بوزيون - انت بتخرف اية فى مقالتك<br />ويعنى اية الباب يفوت فيل وكلها اديان سماوية يعنى مش مشكلة اننا نبقى يهود مثلا<br />اللى يخرج من الاسلام مرتد ولا بد من قتلة<br />واللى مش عاجبة ما يدخلش الاسلام لانة مش لعبة بنغيرها كل شوية<br />كاتب قليل الحياء"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050538/http://masr.20at.com:80/newArticle.php?sid=11446"

[[comments]]
order = 1
subject = "الى الاخ مصرى"
author = "مصرى وموحد بالله"
text = "الكاتب ده الاسلام مش فى قلبه اساسا ! وفيه كتاب اسمائهم اسلاميه بس هم ابعد عن الاسلام ! مثله ولا اكراه فى الدين هى معناها ببساطه لااكراه الكافر على اعتناق الاسلام ! و معنى كلمه دين فى اللغه اى هو دين فى اعناقنا لخالقنا ! وايلاف ذلك الموقع الذى يجمع اوسخ الكتاب وينشر على هو الصهاينه والصليبيه ويشتم رموز مصر الوطنيه والاسلاميه فلا عحب ان ينشر لهذا الكاتب وايضا مواقع مهاويس المهجر تنشر له فلا تقلق وهذا الكاتب نكره وهو يدعى انه دكتور مهنس فلماذا لايكتب عن مشاكل فى الهندسه مثلا ومخال تخصصه انما هو ليس لديه شىء يكتب اى حاجه الا تخصصه الذى اعتقد انه لامهندس ولا دكتور"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050538/http://masr.20at.com:80/newArticle.php?sid=11446"

[[comments]]
order = 2
subject = "الاسلام"
author = "مسلم"
text = "انا مش عارف انتا بتفكر ازاي , يعنى عقلك ده شغال والا ايه انا مش عارف, ياعم انتا لو بتاع شورب وخمره عمرك ما هتقول كده<br />يعنى انا مش عارف انتا مسلم والا مسيحى والا يهودي والا ايه<br />بص انا واحد مثلا عايش فى كوريا الجنوبيه , بشوف البوذين والمسحيين واليهود واللى ملوش دين اساسا معتقدش انهما بيفكر زيك.<br />حتى حريه العقيده اللى بقت حجه عمرها متطبق بفكرك ده انتا دخلت العالم بفكر جديد , وفكرك الجديد ده لو فى حد غيرك موافقك يبقا يلاااااا السلااااام على الدنيا واللى فيها ,<br />يعنى هتيجى يا بني ادم بعد القرون دي كلها وتغير العقيده وجى تقول النت ووسائل الاتصلات والموصلات وميه الشرب<br />الاسلام اسلام لله , ولو جى انتا بتدعو بفكر جديد عمر ما هتلاقى حد يوفقك<br />وكما ن مفيش حاجه اسمها الدينات السمويه واحده .... دي انا مش هعلاق عليها علشان لو عيل صغير عارف دينه عمره ماهيقول كلمه زاي دي<br />وكان من الافضل انى معلقش اساسا عليك لان الموضوع عباره عن خطا فى حق الدين ,لكن من الواجب الشخصى تجاه دينى ان ارد انسان بتاع وسائل اتصلات زيك .<br />لاتراجع موضوع على امل اكتشاف خطا ما , موضوعك كله خطا واجبك الان خذفه"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050538/http://masr.20at.com:80/newArticle.php?sid=11446"

[[comments]]
order = 3
subject = "هل أنت من فهمت الدين؟"
author = "محمد من مصر"
text = "وهل الكاتب هو الذى فهم ولم يفهمه الصديق رضى الله عنه الذى حارب المرتدين؟<br />هل الكاتب هو الذى فهم الدين ولم يفهمه أهل العلم من قبله ؟<br />تب إلى الله فأنت بهذا على خطر عظيم<br />كيف تقول أن الله هو الذى يعاقب وأن الله يحاسب العباد ولا توجد أى عقوبة بالدنيا<br />لو فعلنا هذا مع المجرمين والقتلة ومروجى المخدرات لفسدت البلد<br />إن قلت هذا الأمر وهو الارتداد ممكن أن ننظر فيه ... كيف تنظر بعقلك وقد أنزل الله الحكم وهذا حكم الله فى المرتد أن يقتل<br />إن كنت جاهلا بالدين فتعلم ... فعلاج الجهل العلم ... وإن كنت معجبا بعقلك فاعلم أن الذى خلقك وخلق عقلك هو الله فلا تحاول أن تضع عقلك أمام أحكام الله<br />وإن كنت مريدا الحق راغبا فيه ادعوا الله أن يريك إياه ويبصرك به<br />الحمد لله الذى هدانا للإسلام وما كنا لنهتدى لولا أن هدانا الله"
archived = "2007-09-14"
capture_url = "https://web.archive.org/web/20070914050538/http://masr.20at.com:80/newArticle.php?sid=11446"
