order = 1
subject = "ضابط امن دولة غبى بالوراثة"
author = "مصطفى السعيد"
posted = "2008-06-17"
text = "عيل وكتب كلمتين من غيظة او من جوعة - اللة اعلم بحالة<br />الكلمتين اللى كتبهم الولد دة هيهزوا امن الدولة - هيقلبوا نظام الحكم - هيعملوا فوضى عامة - هيخلوا اسهم البورصة تنزل<br />ابدا<br />الزابط الغبى كان كفاية ضرب الولد قلمين وخلاة يكمل امتحانة وعادى جدا<br />افعال صبيانية<br />لا الولد هيحرك الفرقة الرابعة مدرعة ولا هيروح قصر عابدين<br />امن دولة اية مع ولد يا ولاد الوسخة وتلميذ فى الاعدادى<br />ضابط ابن ----- عايز يترقى او يتنقل من الصعيد لبحرى يقوم يعمل حركة غباء وراثى وتخلف عقلى فى دماغ اهلة<br />وضيع مستقبل الولد<br />هما دول ضباط امن الدولة<br />يا خيبة املك يا مصر فى زباببطك"
archived = "2010-03-14"
capture_url = ""
