[[comments]]
order = 0
subject = "هند قضية المليون"
author = "مش بحبك"
text = "المشكلة مش في الاغتصاب<br />المشكلة في الاستثمار<br />استثمار الاغتصاب<br />نعمل ايه<br />نعمل فيلم يعالج المشكلة ونحط فيه مشاهد اغتصاب قوية بنية اننا بنعرض المشكلة<br />والمشكلة مش كده<br />المشكلة ان المشاهد دي حتزغزغ شباك التذاكر واعداد خرافية حتشوف الفيلم<br />ويبقى كده ضمنا كل واحد مليون<br />والعروسة للعريس والجري للمتاعيس<br />والمنتج ياخد مليون والمؤلف مليون<br />والشعب المصري الاهبل العبيط اللي دفع الفلوس يفضل يفكر في المشاهد الاغتصابية<br />وكل عام وانتم بخير<br />والى اللقاء في ملايين اخرى"
archived = "2007-10-02"
capture_url = "https://web.archive.org/web/20071002234044/http://masr.20at.com:80/newArticle.php?sid=11590"

[[comments]]
order = 1
subject = "ايمان"
text = "انا مع اللى قال ان استثمار قضايا الاغتصاب امر ناجح فى الافلام و المسلسلات و حاجة كدة معمولة على قفا الشعب عشان يخدو منا ملايين فى كلام فارغ"
archived = "2007-10-02"
capture_url = "https://web.archive.org/web/20071002234044/http://masr.20at.com:80/newArticle.php?sid=11590"
