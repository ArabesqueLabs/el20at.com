subject = "إلى كل المصريين الخولااااااااااااااااااااااااااااا"
author = "مكسيم .. أنا سوري أه يانيالي"
posted = "2007-12-22"
text = "كس أمك يامصر يابلاد الخولات والشرموطات العرصات المنيوكات ..<br />كس أم كل واحد بحكي أنا من مصر ..<br />كس أم كل واحد بحكي مصر ..<br />كس أم المصرييين براس زب السوريين ..<br />كس أم مصر وأهلها وحاراتها ومدنها ومحافظاتها قراها والصعايده الأغبياء وعلى ام مبارك البقرة الضاحكة كس أمو لمبارك أخو منيوكه داعره ابن شرموطه ..<br />كس أم المصريين فرداً فرداً بلا استثنااااااااااااااااااء ...<br />كس ام الصعايده ..ههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه<br />ولكو كس أمكن وحده وحده براس زب كل سوري .. ولكو أنتو اجيتو من زبابنا نحنا السوريين !<br />الله .. سوريا .. بشار وبس .. تحية إجلال وإكبار للرئيس السوري الدكتور / بشار حافظ الأسد _ حفظه الله ورعاه _<br />سوريـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــا الله يحميكي ويحمي شعبك ورئيسك .."
