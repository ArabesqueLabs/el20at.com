subject = "إلى صاحب التعليق الأخير ( الدراما المصرية 2 )) ."
author = "محمد نواف الحمدالله ..."
posted = "2007-12-20"
text = "إلى المصري .. ياعزيزي كلامك هذا الذي كتبته يدل على أنك واحد من هؤلاء الناس الذين يريدون أن يطفؤا شمعة الدراما العربية الأصيلة ( سوريا ) . أقول لك ولمن يفكرون مثلك، أو يتجهون نفس الدرب ( الطريق ) الذي تنتهجه أنت وأمثالك ( أشكالك ) .. يا أستاذي الفاضل، أراك عبوساً، متبرماً، حاقداً، .. وأرى نار الغيرة والقهر تلتهب في صدرك إلتهاباً زاد فوزق الحد الطبيعي له . يامثقف، هل تعلم بأن الناس باتت تكره شيئاً اسمه دراما مصرية ( لا مكان لها بين الدرامات العربية مطلقاً ) ؟!<br />وهل تعلم أيضاً بأن الناس قد ملت وضجرت من تكرار الدراما المصرية لنفسها ( فلا يوجد شيء جديد ولا جيد ولا حتى مفيد ونافع، ذا هدفٍ أو حتى ذا مغزى .. فكله يتكلم عن الجنس \" الدعاره \"، الحب، القتل والمخدرات، الثأر .. وهكذا دواليك ؟! ويبقى السؤال الذي لطالما حير ملايين البشر، مالذي يحاول المصريين فعله بدرامتهم التي لاتفقه بالدراما شيئاً البته ؟؟ ) .. وهل تعلم بأن الدراما السورية التي هي أساس الدراما العربية ( بلا منازع )، قد ساعدت على نمو وازدهار الدراما المصرية ( أكبر دليل على ذلك البحث على الشبكة العنكبوتية \" الإنترنت \" بواسطة قوقل .. فسوف تجد ما أقول عنه ) ..<br />رجائي لك أيها المصري المثقف، أن تعي وتفهم ما معنى دراما سورية أولاً .. يا أخي أنا شخصياً أكره الناس الذين يتفلسلون ويكثرون بالكلام .. ولكن دون جدوى ؟!!! .. فعلى ماذا تكثر في كلامك ؟!! .. صحيح، بأن الكلام مجاناً، أي ليس بمال أو نقود لكي تشتريه .. ولكن هناك مثل شعبي يقول لك \" خير الكلام ماقل ودل \" ..<br />وبالنسبة لي فأنا لا أدافع عن الدراما السورية هذا أولاً .. ثانياً أنا لست بسوري \" لكي لاتقول بأن هذا الشخص يدافع عن الدراما السورية لأنه سوري \" لا يأخي أن إنسان أدرني أحب الدراما السورية بشكل كبير لأنها بحق دراما !!! .. ثالثاُ لا تحرق دمك وتغليه كثيراً لأن الدراما السورية ليس عليها غبار أو حتى كلام طالع نازل \" كما يقولون \" .. هي دراما إنسانية قبل كل شيء .. هي دراما اهتمت بالإنسان بإعتباره هو المحور الرئيسي فيها .. ولأن الإنسان كالطائر يحب الحرية ولايحب أن تفرض عليه القيود، أخي .. أعود لك وأكرر كلامي لاتغضب مني .. وراجع حساباتك قبل أن تتفوه بأي حرف !! لأن شخصية الإنسان تتحدد بكلامه وثقافته العلمية ؟!<br />هل تعرف شيئاً ؟؟! أنا أشفق وأعطف عليك وعلى الذين يفكرون مثلك لأنهم مساكين مخدوعيين ونائمون بالعسل وغفوتهم كبيرة ومن الممكن أن يبقوا هكذا إن لم يفهموا معنى\" الدراما السورية \" ..<br />كلمة أخيرة لابد منها ،،، يا مصري (( علمتني الحياة أن احترم عقول الناس .. ولكن !!! الأ أثق بها !!! )) .."
