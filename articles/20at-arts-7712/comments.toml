subject = "الدراما المصرية 2"
author = "مصري و الحمد لله"
posted = "2007-12-18"
text = "سخريتك من الدراما المصرية لا يثبت إلا شيئ واحد جهلك الفني<br />مستواك الفني = 0% أولا معروف علي مستوي الوطن العربي كله إن أول دراما كانت الدراما المصرية في العالم العربي و كان ليها السبق في المجال الفني كليا (سينما مسرح إذاعة تليفزيون) ولا يستطيع أيا كان أن ينكر هذا ..... بالتواريخ و الأرقام<br />ثانيا : لكل جواد كبوة ولكن هذا لا ينكر أن الدراما المصرية إستردت عافيتها وبريقها و طرق جذبها للمشاهد العربي<br />هل تستطيع أن تقارن بين المسلسلات المصرية و السورية من حيث تكلفة الإنتاج أو عدد المسلسلات شهريا؟<br />في أي تحقيق صحافي لا يستطيع أي شخص أن ينكر سيطرة الأعمال المصرية علي الصدارة<br />تليها السورية مساوية للدراما الكويتية (آخر تحقيق لشبكة إم بي سي) أما عن أعمال أردنية فلم نعرف و لن نعرف عمل أردني خالص.....<br />دليل آخر علي صدارة الدراما المصرية هو جذبها للممثلين العرب للعمل بها و هذا ليس إلا لقوتها و معرفة هؤلاء النجوم أنهم لن يصلوا إلي الشهرة إلا عن طريق الأعمال المصرية......<br />و لن تستطيع أن تذكر لي ممثل مصري تواضع و مثل في مسلسل سوري لأنه لن يؤثر ذلك إلا بالسلب علي شهرته الفنية<br />أولاد الليل . الملك فاروق . حدائق الشيطان و غيرها و غيرها<br />مسلسلات مصرية أبطالها سوريين ولكن تضاف لحساب من؟ الرصيد المصري أم السوري؟<br />سترد عليا و تقول إن مجيء الفنانين السوريين لمصر هو دليل ضعف الدراما المصرية وليس دليل قوتها<br />وهل جذب الإعلام الأميركي لفناني العالم أجمع دليل علي ضعف هوليوود؟؟؟؟<br />هل تستطيع أن تقارن بين القصرين بباب الحارة؟؟؟؟؟؟؟ مثلا؟<br />الدراما المصرية عرضت قضايا لم تفكر الدراما السورية حتي في طرحها<br />الصراع بين المخابرات المصرية و الإسرائيلية... الفدائيين علي الجبهة فترة الإستنزاف<br />لا نكنر أن الدراما السورية جيدة في النوعية التاريخية من الدراما و لكن هذا لا يعني أن الدراما التاريخية هي كل شيء<br />و الدراما المصرية قدمت أنواع كالميني كوميديا (تامر و شوقية.أحمد إتجوز مني)... دراما التشويق (سطور الرعب \"سيطرح قريبا\"-)<br />رأفت الهجان ... العميل ألف وواحد هل لمثل هذه النوعيات من الدراما مثيل في الدراما السورية؟؟<br />شيء أخير هو أنه لا يوجد شيء إسمه دراما أردنية لم نسمع عنها مثلما لن نسمع عن الدراما العمانية أو اليمنية<br />و كفاكم عنصرية و إعترفوا بالحقيقة و ليست سوريا هي منبع الدراما<br />مصر كان فيها دراما و سينما و مسلسلات إاعية بينما سوريا لم يكن فيها محطة بث تلفزيوني واحدة وقتها<br />فمن أين يأتي المنبع ؟؟؟؟؟<br />و عندما سألت من يشاهد في هذا الوقت الدراما المصرية؟؟ أثبتت أنك أجهل من الجهل<br />الدراما المصرية يكفيها فخرا أن هناك 70 مليون مصري علي اٌلأقل لا يشاهدون غيرها و راضون تماما عن أعمالها و يحبوا فنانيها حبا كثيرا ؟ و إلا لماذا لا تزال الفضائيات تعطي الصدارة و الأولوية في فترات البث للدراما المصرية طالما لا يشاهدها أحد مصريين أو غير مصريين؟<br />جد لنفسك تربة إدفن نفسك فيها انت و حقدك الدفين علي كل ما هو مصري"
