text = "أولا أنت لم تجب عن أي سؤال سألته لك مثلما أنا جاوبت علي فتاويك<br />ثانيا أسلوبك في الكلام يدل علي ثقافتك فأنا لم أغلط في الدراما السورية ولا السوريين فهنيئا للمصريين جميعا حسناتك<br />اللي باين عليها كتير و حتكفينا كلنا<br />ثالثا إجابتك دائما هم هم هم لا يريدون هم يكرهون هم لا يشاهدون ... من هم الذين تتحدث بلسانهم؟<br />أسرتك؟ عائلتك ؟ سكان حيك؟ سكان بلدك؟ هل وكلك العرب للتحدث بالنيابة عنهم؟<br />شيء أخير إذا كان مصدر بياناتك هو google فأنت تثبت لي مدي جهلك و إعتقادك أنك تبحث في موقع (سماوي) معلوماته لا تخطيء و موثوقة و غير قابلة للتحريف<br />و يا ريت لو حتعقب تكون بترد علي كلام مش مجرد داخل تشتم و تدينا من حسناتك و خلاص"
