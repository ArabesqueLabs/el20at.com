text = "أولا جزا الله خيرا أخي المصري الذي ناقش و رد و تحدث بإنخفاض صوت و أدب و هذا دليل علي علو المقام<br />ثانيا و كما قال أخي من قبل كلنا نقول لك جزاك الله خيرا علي حسناتك التي نالتهم جميعا فهنيئا لهم<br />ثالثا أنت قلت من قبل أنك لست سوري إذن فمن أين أتيت بهذه اللهجة السورية الصرفة؟؟؟<br />هل تريد أن تكون وكيل السوريين الذين لا يرضون عن مستوي الفن في مصر؟ إذن كلهم لا يعرفون الأدب في الحوار مثلك؟<br />كلهم يتطاولون علي أعراض إخوانهم؟؟؟؟؟؟ لا أظن أنك تمثل الشعب السوري لأنهم أنزه من ذلك<br />و بما أنك تقول إنك علي صواب لماذا لم تجاوب علي من يناقشك؟ لماذا تتهرب بالسب و التطاول ؟؟<br />هذا أكبر دليل علي ضعفك ..... و يثبت جهلك الأزلي ..... و أمثالك هم من شوهوا صورة العرب و أخرونا لأيام الجاهلية الأولي بينما الغرب الآن لا يجد حرج في أن يقول البريطاني أن الأمريكي أعلي منه مكانة إعلاميا أو أيا كان<br />أنا أعلم جيدا أن كلامي هذا مضيعة للوقت مع من ختم علي قلوبهم بالجهل و التخلف و أخيرا لنا معاد يوم القيامة حينما نعرض علي المولي عز و جل لأقتص من طولة لسانك و حقدك و تداعيك علي أعراضنا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "لا تنسي من هم أسيادك"
author = "محمد أحمد عبد القوي"
posted = "2007-12-21"
text = "هذا الجاهل اللي بيدخل و يشتم في المصريين أسياده و خلاص !!!!!<br />هوة من حقدة و غباؤة إتعمي؟ إطرش؟ إصنج هههههههههه<br />أولا إنت نسيت إن المصري يا بابا اللي إنت مستحقره ده هوة العربي الوحيد اللي واخد نوبل ومش مرة ولا إتنين لا ده تاريخ و موسوعة بيفخر بيها كل مصري عارف المصريين مكانهم أيه في الشرق و الغرب !!!!<br />عاوز تقارن مفيش مشاكل<br />يمكن نسيت إن مصر هيا البلد الوحيد اللي ذكر في القرآن؟<br />نسيت أحاديث الرسول صلي الله عليه و سلم : إذا فتح الله عليكم مصر فاتخذوا منها جندا كثيرا فإنهم خير أجناد الأرض<br />نسيت إننا حررنا أرضنا كلها و إنكم لسة إسرائيل حاطة إيديها في ............ و ماسكة منكوا الجولان؟<br />عندكم الرئيس بيكسب ب99.8% و يجي إبنه من بعده يكسب ب99.9% متقوليش وحيا ة أمك إنكوا بتحبوا ده دافنينه سوا يا حبيبي<br />تحب تاخد كمان ولا لسة؟<br />الظاهر إن أسيادكوا المصريين سيبوا لكم الحبل شوية فنسيتوا إنهم هما اللي عملوا لكم كل العز اللي غنتوا فيه دلوقتي<br />سلام يا خيو"
archived = "2010-03-14"
