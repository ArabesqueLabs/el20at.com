subject = "لا يوجد عنوان"
author = "عابر سبيل"
posted = "2007-12-25"
text = "الحمد لله طالما رأيت و تأكدت من مستوانا -نحن أهل مصر- في الحديث و المناقشة و لا يخرج عن قاعدة الأدب إلا قلة قليلة !!!!<br />و الحمد لله عندما أردت أن أتابع هذه المناقشة كطرف محايد ليس إلا لأنني لست متابعا للدراما عموما<br />رأيت أن إخواني المصريين كانوا فعلا بيتحدثوا بعقلانية و أدب و كل كلمة قالها الأخ السوري ردوا عليها<br />لكن.......... هل هو رد بأسلوب محترم يليق بما يريد أن يوحينا بأنه علي مستوي ثقافي عالي؟؟؟؟<br />رده بهذا الأسلوب يدل علي ضعف ...... لأنه لو رد بأسلوب محترم فهو أول العارفين أنه لن يستطيع أن يرد بعقلانية في المناقشة<br />لذلك و كما قال واحد من المعلقين من قبل هنيئا للمصرين جميعا من حسناتك !!!!!!!!!<br />و لو كنت أنت فعلا سوري فهذا ليس دليلا علي حبك لبلدك بالعكس ... أنت تشوه سمعة الشعب السوري و لا أظن أنه يناقش بهذا الأسلوب القذر و إلا رحمة الله علي المحترمين<br />جزاكم الله خيرا إخواني علي هذا الأسلوب المشرف في النقاش<br />و السلام عليكم و رحمة الله"
