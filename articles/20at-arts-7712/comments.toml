subject = "إلى صاحب التعليق الأول ( الدراما المصرية ) .."
author = "محمد نواف الحمدالله .."
posted = "2007-12-04"
text = "إلى الأخ المصري صاحب التعليق الأول \" الدراما المصرية \" .. ياعزيزي أنت تقول أن الدراما المصرية هي التي أثرت على الدارما العربية، وأنها علمتها ومازالت إلى الآن، وقلت أيضاَ بأنك لن تسمح لأي شخص مهما كان بأن يقلل من قيمة الدراما المصرية حتى ولو كان / حاتم علي/ ..<br />اسمح لي يا أخ بأن أقول لك وبكل وضوح وشفافية .. وبعيداً عن الكذب والنفاق .. أنك لاتدري شيئاً عن الدراما العربية وبالتحديد الدراما الأردنية والدراما السورية .. أنت تقول الدراما المصرية .. وهي بالأساس ليست سوى مجلة تافه ووضيعة لاتحمل أي معنى حقيقي لقيمة وجمال الدراما .. بل وفوق ذلك لقد زادت الطين بله \" كما يقولون \" .. إن الدراما المصرية بات مستواها في الحضيض، لا وبل وصل مستواها إلى أسفل السافلين .. إن الدراما المصرية لا ولم ولن تقدم شيئاً يذكر على الإطلاق .. بل إن الدراما العربية وأخص بالذكر هنا الدارما الأردنية والسورية .. هما اللتان كان لهما الأثر الكبير في مجمل الدراما العربية .. وبالتالي انعكس هذا الشيء على باقي الدرامات .. يا عزيزي المصري .. قلي من يشاهد الآن \" في وقتنا الحاضر \" أي عمل درامي مصري سواء أكان مسلسل أو فلم أو حتى مسرحية ؟!! ..<br />أرجوك .. ورجائي حار لك ولمن يفكرون مثلك .. بأن يرجعون إلى أصل الدراما ؟؟ ومن أين ظهرت ؟؟ وكيف؟؟ ومتى ؟؟ ودوافعها .. وأسبابها؟؟ ونتائجها ؟؟ .. إنني أقولها وبكل فخر واعتزاز بأنه لايوجد بعد ولاقبل الدراما السورية .. فعلاً أفضل المسلسلات والأفلام والمسرحيات والروايات والقصص وغيرها الكثير .. هي نتاج إبداع سوري قوي .. عميق .. مأثر لأبعد الحدود .. أن الإنتاج السوري بكل مايحمله من معايير ومقاييس لاتتوافر في أي عمل درامي مصري أو غيره .. بل وأنه من سابع المستحيلات بأن نقارن الدراما المصرية بالدراما السورية \" فرق السماء والأرض \" .. هناك فرق شاسع وكبير جداص بين كلتا الدرامتين .. ومن أهم هذه الفروق بأن الدراما المصرية دراما تعتمد على الحوار الركيك الخالي من لفت أنظار المشاهدين وشد انتباههم وجعلهم كأنهم يعيشون المشهد نفسه .. وهذا لن يحدث ولن يطبق على أرض الوقع .. ولا حتى بالأحلام الوردية .. ولكن لاننكر بأن الدراما المصرية لها تاريخها ولها فنها ولها دعامات أساسية صبلة ومتينة وأيضاً عامل الممثلين حيث أن الممثلين القدما ء كان لهم أثر ولا يزال لهم أثر .. ولكن ليس كما في السابق .. وبالنسبة للدراما السورية فهي بحق دراما مكتملة من جميع الجوانب وهادفة لأبعد الحدود .. فمن الخيال أن ترى عمل فني سوري ويكون أبطاله سوريين غير هادف أو ذا مغزى أو حجة .. بينما تجد ذلك في الدراما المصرية \" وما أكثرها \" ؟!!!<br />إن الدراما السورية ومنذ تأسيسها إلى الآن لم تنسى بتاتاً .. بل إنها تقفز قفزات فنية سريعة ومذهلة .. من ناحية الإنتاج وكل شيء .. وهنا يجي ذكر فضل الممثلين السورين الذين اسهموا بتطور وتحديث الدراما السورية، وأخص بالذكر عميد الفنايين السورين الأخ / صباح عبيد .. فهذا الشخص تعجز الكلمات عن وصفه .. وكذلك فنان الشعب .. الفنان القدير الكبير / رفيق الدين السبيعي .. وأيضاً فنان يصعب أن تماثل شخصاً يشبهه في التمثيل والأداء الرائع .. والفنان الكبير المبدع المتقن لجميع الأدوار / خالد تاجا .. وهنا والله بأن هذا الفنان مهما قلت عنه فا توفيه حقه .. وهو عامود بارز من أعمدة الفن السوري الراقي ومن أوائل الذين اسهموا بتأسيس الدراما على كافة صورها وأشكالها .. والفنان المميز الذي دائماً وعد بالأفضل والجديد فنان الجماهير والمحبوب / أيمن زيدان .. فهذا الشخص من بداية مشواره الفني قدم الكثير وأعطى ولا زال .. ومن مسلستلاته والتي حازت على اقبال كبير وضخم جداً من كافة المشاهدين، من مثل : \" يوميات مدير عام \"، \" الكواسر \" ، \" الجوارح \" ، \" الطويبي ، \"حنين\" ، \" يو ميات جميل وهناء \" ، \" أخوة التراب \" ، \" عصي الدمع \" .. وغيرهم الكثير والكثير والكثير ، فعلاً مبدع وكبير يا أيمن . وأيضاً إلى جانب الكثير من الفنانيين السوريين والفنانات السوريات .. الذين لو قمنا بذكرهم لن نتهي ..<br />وهنا لابد من كلمة أخيرة نوجهها لكل شخص يحب الدراما العربية بشكل عام .. يجب عليه أن يشاهد الكثير من الدرامات السورية الرائعة .. لكي يعي ويفهم الدراما على أصولها .. لأنها وبلا أدنى شك هي أم الدراما العربية في الوطن العربي أجمع وبلا منازع .. يكفي كل إنسان سوري بأن يقول أنا سوري \" أه يانيالي \". نقولها وبلا نفاق أو \" تمسيح جوخ على قولة إخواننا السوريين \" . بأن سوريا هي التي صنعت الدراما وهي التي أنشئتها وقامت على تحديثها وتطويرها من كافة الجوانب . حتى وصلت لنا كما هي الآن . فشكراً جزيلاً للدراما السورية التي رفعت اسم الدراما العربية بالمحافل العالمية .. حيث لا يوجد مكان للدراما العربية سوى العودة إلى بلدها الأم \" سوريا \" لكي تتقدم وتنجح وتزدهر .. وإلى الأمام الفن السوري .. لا تغضبوا يا أخوان ولكن الأخ المصري كتب كلاماً لايدخل الرأس ولا يتقبله نهائياً .. وتبقى الدراما السورية هي الأساس والباقي \" غيرها من الدرامات التي لابأس بها \" .. فروع ضعيفة لها .."
