subject = "إلى ( m m m )"
author = "الشيخ الشكسي"
posted = "2008-08-23"
text = "جل من لا يخطئ . بالنسبة لرسالتك الأولى فأنا لست فضيلة الشيخ الشعراوى و لا الدكتور محمد العريفى و أنا أشكرك لمقارنتي بشيخين جليلين مثلهما . أنا لست سوى رجل شكسي يفعل ما بوسعه لهداية الشباب . أما بالنسبة لكتبي فدار النشر هي الأجيال و موقعه على الإنترنت www.al-ajyal.com و يمكنك طلب الكتاب و يتم ايصاله إليك عبر البريد . و ستجدين في كل واحد من كتبي إهداء خاص لفضيلة الشيخ الشعراوى الذي كنت طالباً لديه في إحدى مراحل حياتي .<br />و على فكرة إن إتقاء الله هو ميزتي . و السلام عليكم و رحمة الله و بركاته ."
