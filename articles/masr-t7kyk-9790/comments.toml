subject = "للشكسى للمرة الثانية"
author = "m m m"
posted = "2008-08-23"
text = "ارى انك قد تجاهلت كلامى ولا اعرف سبب ذلك ولكنى مصرة على ان اقول ما فى نفسى<br />اود ان اعلم اذا تفضلت دار النشر التى تتعامل معها حتى يتاح لى التاكد والحصول على هذه الكتب المذكورة مع العلم بانى قد قمت بالبحث عنها على شبكة الانترنت ولكنى لم اجد شئ عنها<br />ارجو منك افادتنا وارجو الرد على هذه الرسالة والرسالة السابقة حتى تثبت انك على حق"
