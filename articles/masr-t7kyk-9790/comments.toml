[[comments]]
order = 7
subject = "إلى اكتب اسمك هنا"
author = "الشيخ الشكسي"
posted = "2008-08-21"
text = "سامحك الله و هداك . مع أنك وصفتني (واد بيلعب) و (يتسلى بالمشايخ) إلا أني سأحترمك . و أود أن أعلمك أني لست بمازح و لا ساخر بل إنني آخذ الدعوة إلى الله بكل الجدية بل و أعتبرها هدف حياتي . و إن السبب الوحيد لدخولي هذا الموقع هو دعوة الشباب و هدايتهم . و أما عن موضوع التمثيل فأعتقد أنكم أسأتم فهمي فحمادة هلال مثال للشاب الملتزم الذي يستخدم الفن للدعوة . و أنا أود الإعتذار من dodo على ردة فعلي المبالغ بها . و في النهاية أقول لكل المشككين أن يقرأوا أحد كتبي المتوفرة في جميع المكتبات ( الخطير في القرآن و التفسير ) ( الحديث في السنة و الأحاديث ) ( الناس في الفقه و القياس ) ."
archived = "2010-03-14"
capture_url = ""

