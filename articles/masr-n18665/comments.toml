[[comments]]
order = 0
subject = "كلام على القهوة لا يقولة اى جهاز اعلامى"
author = "قهوجى"
posted = "2008-11-30"
text = "الناس على القهوة بتقول ان سعر البترول نزل من 140 دولار الى 50 دولار وكذلك سعر الغاز نزل الارض ومدخول الحكومة من الغاز والبترول نزل الارض<br />وكذلك قناة السويس تتعرض لمؤامرة حيث ان القراصنة فى الصومال مدعومين من اسرائيل وامريكا لخطف السفن واجبار الشركات على تحويل سفنها الى راس الرجاء الصالح<br />وطبعا دخل االقناة هيقل<br />وبعدين<br />الحكومة مش هتلاقى فلوس تدفع مرتبات ولا تقدر تقدم اى خدمات ولا تصرف على الجيش وعلى قوات الامن<br />طيب وبعدين<br />بتوع بيع القطاع العام واللى نهبوا فلوس بيع المصانع والشركات الرؤس الكبيرة الفلوس اللى سرقوها ضاعت فى البورصات والازمة المالية وعايزين يعوضوها وعلشان كدة اخترعوا عملية الاسهم والصكوك ليعوضوا خسائرهم<br />يعنى كل الناس عارفين اننا رايحين فى ستين داهية<br />دا كلام الناس فى القهوة<br />ادخل واطلب شيشة وكباية شاى وهتسمع اللى عمرك ما سمعتة"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195212/http://masr.20at.com:80/newArticle.php?sid=18665"

[[comments]]
order = 1
subject = "كلام فى اتوبيس الصعيد بين اتنين بلدياتى هذا ملخصة"
author = "يبا"
posted = "2008-12-01"
text = "بعد اختيار السعودية فى لجنة العشرين دولة عالميا لمناقشة الاقتصاد العالمى بعد الازمة المالية وقيام وزير المالية بالتصريح ضد السعودية ورد الوزير السعودى علية بان اقتصاد السعودية من اكبر الاقتصاديات فى المنطقة ولا يقارن بمصر وحدوث اختلاف استدعت قيام الصحف المصرية بالهجوم على السعودية بحجة جلد الطبيبين وتوتر العلاقة<br />وقبلها خسرت مصر العلاقة مع سوريا<br />يبقى مين فى المنطقة مع مصر<br />مفيش غير اسرائيل<br />هنيئا لمصر بصداقة اسرائيل<br />فبكدة نبقى على الطريق الصح<br />وعلشان كدة طلع يقول لك دائما مصر اولا<br />دائما مصر اولا<br />دائما مصر اولا<br />دائما مصر اولا"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195212/http://masr.20at.com:80/newArticle.php?sid=18665"
