[[comments]]
order = 1
subject = "واقع الحال"
author = "ممدوح زايد"
posted = "2008-11-19"
text = "الافضل فى التعامل مع الحمقى هو عدم الرد او الاهتمام بهم فرحمة الله عليك ياسادات ، دعونا فقط فى مصر نفكر كيف نعيد لمصر مجدها بالعمل والجد والاجتهاد واصلاح امورنا ونغير انفسنا حتى يساعدنا الله لنحمل الرايه كما هو الشىء الطبيعى لا ان ترى اناسا سيدوا انفسهم بلا داعى نظرا لتوافر براميل النفط لديهم جيوب وارصدة ممتلئة وعقول خاوية فمن العجيب ان ارى فى الخليج اناسا كل امكانيتهم ان يجلس اسفل نخلة ويعبث بانامله تجده يجرى فى اروقة الامم المتحدة ليبحث لنفسه عن دور وبالطبع يغرس ارجلنا فى التخلف اكثر واكثر"
archived = "2010-03-14"
