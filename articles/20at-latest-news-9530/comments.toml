order = 0
subject = "أفعال الحمقى"
author = "محمد حمدى"
posted = "2008-07-06"
text = "من المتوقع أن تسبق أفكار الرئيس السادات عصره , وأن يحاربه أبناء جيله وحقبته التاريخيه لا لشىء سوى أن عقليتهم لم تستطع مجاراة عقليته المتميزه .. لكن من الغريب أن نجد من يظل فى ثباته على الباطل طيلة هذه السنوات , حتى بعد أثبت الواقع تميز فكر السادات , فبينما تقع مرتفعات الجولان والأراضى الفلسطينية تحت الإحتلال الإسرائيلى , نجد أن مصر هى الدولة الوحيدة من دول المواجهه مع إسرائيل التى استطاعت إسترجاع أرضها بشكل كامل , وبعد كل هذا يتهمون السادات بالعماله ؟!"
archived = "2010-03-14"
