[[comments]]
order = 0
subject = "اللى عايز يتعلم فساد ييجى عندنا"
author = "من المفسود بيهم"
posted = "2008-09-24"
text = "فساد اية<br />امبارح سواق ميكروباص كان ماشى على طريق المناشى والقناطر - ولد بلطجى طلع على السواق بالمطوة ووقف الميكروباص وطلب من الركاب والسواق ان كل واحد يسلم لة الموبايل والفلوس اللى معاة يعنى عملية سرقة تحت تهديد السلاح<br />المهم الركاب اتلموا على البلطجى والنسوان بالشباشب وضربوا البلطجى علقة محترمة وسلموة للشرطة<br />قعد فى الشرطة ساعتين بالضبط وتركوة<br />ورجع البلطجى تانى موقف التكاسى وهدد السواق انة هيضربة بالجزمة<br />الدولة بتحمى البلطجية<br />تروح اى مصلحة علشان تمشى معاملة - بدون ان تدفع رشاوى يبقى مفيش حاجة هتحصل<br />داخل مطار القاهرة نفسة دفعت رشوة 300 جنية لعامل بيشتغل عند بتوع الجمارك وطلعت تليفزيون جماركة 4000 جنية<br />الفساد فى كل ركن فى البلد<br />والسبب<br />تدنى او انعدام الاجور<br />نظام اجور من باسعار من 300 سنة فاتت ايام ما كان كيلوا اللحمة بعشرة صاغ<br />اول خطوة اصلاح فى البلد دى تصحيح نظام الاجور<br />وزى ما الاسعار عالمية تبقى الاجور عالمية"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233412/http://masr.20at.com:80/newArticle.php?sid=17707"

[[comments]]
order = 1
subject = "عندنا نظيف باشا ؟ازاى مصر تكون غير نظيفة!!!!!!!؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-24"
text = "و اللة العظيم التقرير دة غير صحيح<br />يا غبى ازاى تكون مصر غير نظيفة و عندنا نظيف<br />يا ناس اختشوا و خلوا عندكم شوية دم و فهم؟<br />(صحيح اللى اختشوا ماتو من النظافة) يا نظيف؟"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233412/http://masr.20at.com:80/newArticle.php?sid=17707"

[[comments]]
order = 2
subject = "نظيف رجل مقيد اليدين وبينفذ سياسات اللى عينوة فى ا"
author = "سالم"
posted = "2008-09-25"
text = "نظيف راجل متعلم وفاهم ويقدر يعمل حاجات كتير ولانة مهندس يقدر يبنى ويخطط ويعمر وينمى<br />لكن اللى عينوة فى المكان دة - مش عايزين<br />دة راجل بينفذ اللى عايزة السيد الرئيس والسيد رئيس لجنة السياسات فى الحزب الحاكم<br />نظيف مش هيخترع<br />انما لو اطلقوا يدة فى وظيفتة البلد هتمشى زى الساعة<br />للجميع ان يتذكر ان هناك لجنة سياسات اقوى من اى حكومة واعضائها معروفين من بتاع العبارة لهشام مصطفى"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233412/http://masr.20at.com:80/newArticle.php?sid=17707"
