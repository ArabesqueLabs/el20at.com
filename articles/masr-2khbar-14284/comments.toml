text = "اولا لانتاج غاز وقود من الزبالة او من روث البقر يلزم تخزينها فى خزانات اسمنتية او حديدية مصمتة تحت الارض بعيد عن التجمعات السكانية وترك البكتريا تتفاعل مع المخلفات لنتنتج غاز يسمى غاز البيوجاز قابل للاشتعال وهو غاز سام واذا تسرب من الخزان سيقتل الناس حولة - ولانتاج مثل هذا الغاز يحتاج الى تجهيزات وارض فضاء ومواسير ومحابس ومشاعل وقود مخصصة لهذا النوع من الغاز ولا يصلح موقد البوتاجاز المنزلى لحرقها<br />طبعا ممكن تكون فكرة حامت فى مخيلة راعى خنازير فتكلم بقين كلام لصحفى لم يفهم شيئا<br />ثم اين الصور لهذا المشروع ؟<br />ابقوا لاحظوا انكم بتعرضوا موضوعات على ناس متخصصة وبتفهم فى الحاجات دى"
