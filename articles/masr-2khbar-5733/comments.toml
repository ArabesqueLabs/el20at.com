subject = "مع الاعتذار للزملكاويه"
author = "نيفين نيفى نوفا"
posted = "2007-05-06"
text = "يسعدنى انى اقول ان اكبلا نصر احرزه الزماللك على الاطلاق كان على بنى سويف<br />ز الله مش من عادتى انى اعيب ف قريق غير اللى بنتمى اليه بس الرساله دى( لبعض) الزملكاويه اللى عارفين نفسهم و اللى بصراحه بستغل الموقع علشان اوصلهم صوتى<br />و احب اقولهم كله سلف و دين<br />و تانى الكلام للبعض و ليس كل الزملكاويه<br />و برده هما عارفين نفسهم"
