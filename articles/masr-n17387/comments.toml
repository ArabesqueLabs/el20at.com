subject = "الأراجوز"
author = "عبد الفتاح نيازي"
text = "يرجع فن الأراجوز إلى فترة تنامي الوعي القومي بين أبناء الشعب التركي في أواخر عصر الدولة العثمانية ، والسعي الحثيث من جانب القوميين الأتراك للتقليل من شأن اللغتين العربية والفارسية اللتين كان المثقفون الأتراك يتقنونهما .. فكان ما أطلق عليه مصمموه اسم \\\" قره گوز \\\" ومعناها (أبو عين سودا) ؛ حيث كانت الدمية المستخدمة في تجسيد هذه الشخصية ذات عين سوداء جاحظة .. وكانت القضية المحورية للقره گوز هي السخرية من المثقفين الأتراك وكل من يتكلم بالعربية أو الفارسية وهو لايجيد لغته التركية ، وبعض هذه المواقف جسدها الفنان الراحل فؤاد المهندس مع الفنانة شويكار في مسرحية سيدتي الجميلة .. وأبرز من قدم هذا الفن في مصر الفنان الراحل محمود شكوكو .."
archived = "2008-09-15"
