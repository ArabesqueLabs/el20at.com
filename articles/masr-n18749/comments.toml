[[comments]]
order = 0
subject = "فكرة حلوة"
author = "مايسة"
text = "الموضوع جميل يا أستاذ محمد قكرة جميلة فكرتني باول شريط والله كانت ايام حلوة قيل الام بي ثري والنت"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207000022/http://masr.20at.com:80/newArticle.php?sid=18749"

[[comments]]
order = 1
subject = "محمد جمعة، 22 سنة، طالب بكلية أصول الدين،"
text = "هو لسه فيه كلية اصول دين في مصر<br />الله يرحم اصول الدين والله يرحم الشيخ الشعراوي والشيخ الغزالي"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207000022/http://masr.20at.com:80/newArticle.php?sid=18749"

[[comments]]
order = 2
subject = "دبحونى بقزازة وبربور على الحيط"
author = "ومش هو"
text = "اول شريط اشتريتة فى حياتى كان<br />بربور على الحيط ودبحونى بقزازة للمطربة بقاليظوا"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207000022/http://masr.20at.com:80/newArticle.php?sid=18749"

[[comments]]
order = 3
subject = "وهو دا حال الدنيا السي دي زحلق شريط الكاست كما زحلق شريط الكاست اسطوانات البيكب والريكوردر"
author = "مش سامع"
text = "زمان كان فيه حاجه اسمها البيك اب كانت اسطوانه كبيرة سوداء تتحط على جهاز البيك اب وبعدين فيه دراع كده يدلع من البيت اب عليه سن مدبب يركب على الاسطوانه وتدور الاسطوانه ونسمع اللي متسجل عليها<br />وكمان كان فيه حاجه اسمها الريكوردر كان بيركب عليه شريط زي شريط الكاست كده بدون علبه بس اد الشريط الموجود جوه الكاست حوالي 15 مرة<br />جه الشريط الكاست واختفى البيك اب والريكوردر<br />وجه السيدي واختفى شريط الكاست<br />واكيد حيطلع حاجه تانية حتخلي السي دي يختفي<br />وهذا حال الدنيا"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207000022/http://masr.20at.com:80/newArticle.php?sid=18749"
