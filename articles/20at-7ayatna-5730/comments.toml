[[comments]]
order = 7
subject = "تحفة تحفة"
author = "واحد من الناس"
posted = "2007-05-15"
text = "هاهاهاهاهاهاهاهاهاهاها ... مش ممكن قعدت أضحك لوحدي زي المجنون و انا بأقرأ القصة دي تحفة يا أيمن فعلا .... بس نسيت مشهد مهم جدا و هو مشهد الأم اللى بتيجي لأحمد علشان تترجاه يسيب منى (قال يعني منى لاقيه حد تتجوزه) و أحمد يوعدها بأنه يسيبها و يروح شارع جامعة الدول يأجر مزتين يتصور معاهم (تصوير بس) و يعطي الصور لأم منى اللى بتدسهم فى وسط كتب منى علشان تعرف ان أحمد خاين و غدار و منى طبعا تنهار و الأم و الأب يفرحوا جدا و يكلموا المعلم كندوز الجزار اللى عاوز يتجوزها مقابل الحساب المتأخر على أمها و ابوها و طبعا فى الاخر عارفين النهاية أحمد ييجي زي \"الدوهول\" يدفع حساب اللحمة و الكبدة و يتجوز منى ....."
