text = "استاذ حسن مدرسنا فى الثانويه كان بيقولنا انتو عايشيين فى دور عبدالحليم ولازم يكون فقير ويتقدم لبنت الباشا وطبعا الباشا ابوها عاوز يجوزها لابن عمها عشان الثروه ماتتبعترش وتروح لحد غريب تزعل البنت وتالوا انا معاك يا(وحيد او احمد)<br />الشهامه جزء من شخصيته يرمى ايديها من على كتفه ويقولها انا مش راجع الا لما اثبتلك قدراتى<br />وابا قابلنى يا حلو انت وهو<br />يلا حل يابنى انت وهى..........."
