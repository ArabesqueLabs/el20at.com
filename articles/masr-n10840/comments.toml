[[comments]]
order = 0
subject = "لكل أجل كتاب"
author = "المغترب"
text = "سبحان الله<br />جايز جاله اكتئاب من الوثائق اللى أفرج عنها الموساد اللى بتشير انه هوه اللى سرب موعد حرب أكتوبر<br />وجايز مش انتحار يمكن تصفية جسدية .... وبعدين ايه حكاية كل اللى ييجى يكتب مذكراته يلاقوه منتحر فجأة كده انا كده عمرى ما أفكر اكتب مذكراتى أبدا"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819202512/http://masr.20at.com:80/newArticle.php?sid=10840"

