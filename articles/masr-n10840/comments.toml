subject = "أنتحار الأسرار !"
author = "أبو كمال"
text = "أنتحار الأسرار يتم دائما فى لندن ... يا ترى موساد .. أم مخـابرات !<br />علشان خاطر ذكرى أبوك يا جمال أنشر المذكرات بدل الكلابات !!"
