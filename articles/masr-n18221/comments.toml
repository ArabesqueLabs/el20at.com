[[comments]]
order = 2
subject = "لدي حلم..كما أن لديهم حلم"
author = "مجدي سعيد"
posted = "2008-11-06"
text = "عبد الله باشا الطحاوي..صاحب اللقطات الذكية دائما<br />لا هاقول وجعتني<br />ولا هاقول شركتهم وشركتنا<br />هاقول زي ما قال مارت لوثر كنج: لدي حلم<br />وهاقول زي ما قال مصطفى كامل لا معنى لليأس مع الحياة ولا معنى للحياة مع اليأس<br />وهاقول زي ما قال الرسول إذا قامت الساعة وفي يد أحكم فسيلة فإن استطاع ألا تقوم حتى يغرسها فليفعل<br />وهاقول زي ما بيقول المثل الصيني: بدلا من أن تلعن الظلام أوقد شمعة<br />لدي حلم إذا..وفي سبيله سأغرس الفسائل..وأزرع البذور..وأوقد الشموع، ولن أقف بإذن الله أمام المنحنيات والمنحدرات ألعن الظلام"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"

[[comments]]
