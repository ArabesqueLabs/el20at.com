[[comments]]
order = 0
subject = "فرق كبير بين العشوائية والتخطيط"
author = "مصرى - من البلد دى"
posted = "2008-11-05"
text = "فى خبرتى العملية تجربتان<br />اشتغلت مع شركة امريكية فى مجال التركيبات - كان المشروع يتم تنفيذة فى سنة اى 365 يوما<br />فتح مدير المشروع الورق امامى او مخطط التنفيذ - فى يوم كذا سيتم وضع الاساس الخرسانى وفى يوم كذا سيتم وضع الجزء الفلانى وفى تاريخ محدد سيتم تشغيل ذلك الجزء وفى التاريخ الفلانى الساعة كذا سيتم اختبار الجزء العلانى<br />نظام عمل مخطط بالدقيقة والساعة واليوم ولا مجال للتكاسل اطلاقا ويتم التنفيذ ايا كانت الظروف والاحوال<br />ومن العجيب ان الذى على الورق بالدقيقة والثانية تم تنفيذة<br />واشتغلت مع شركة مصرية<br />صدقنى مهزلة<br />تبدأ مشروع وتنهى جزءا منة ثم تتوقف لعدم وجود اعتمادات وتكلم المدير يقول لك انت مستعجل لية - يا سيدى بكرة - الشهر الجاى - انت زعلان لية - انت مش بتاخد مرتبك - اقعد فى مكتبك واشرب شاى واقرا الجرايد -<br />مفيش تخطيط لاى حاجة<br />كلة ماشى الاوى - تعرف حاجة اسمها شغل الالبنضة<br />تمام زى الراجل عضو مجلس الشعب اللى وقف قدام الرئيس يقول لة خمسة وخميسة من كل عين تحسدك<br />دة اسمة شغل البنضة<br />جميع اعمالنا بتم بشغل الالبنضة والنتائج طبعا عشوائية وانتشار العشوائيات - عشوائيات فى الفكر عشوائيات فى الاقتصاد عشوائيات فى البناء - عشوائيات فى البناء والاحياء والمدن<br />مفيش تخطيط ولا مخطط لاى عمل<br />سالوا قائد عسكرى فى حرب 1967 كيف انهزمتم فقال لهم العملية كانت ماشية استروبيا<br />وما بين كلمة استروبيا وكلمة البنضة ضاعت البلد"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"

