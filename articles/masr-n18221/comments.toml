[[comments]]
order = 4
subject = "ابو غندور"
author = "من المعارضة"
posted = "2008-11-07"
text = "هو لية الفكر الجديد بتاعنا ارقى من امريكا<br />يعنى مثلا بعد نجاح اوباما - لية ما يدبروش مصيبة لمكين بتهمة ان فية واحد شافة بيضحك وبيتلقى تاييد من محظورين ويحطوة فى السجن زى ايمن نور عندنا<br />ازاى المعارضة تنجح - المفروض الاخ بوش يسرح رؤساء ومديرى الامن والمباحث ويغير المحافظين ورؤساء التحرير وبتوع لجان الانتخابات علشان بتاع المعارضةنجح وازاى واحد اسود من المحظورين ينجح<br />بوش المفروض يقطع خط الرجعة على اوباما ويطلب من انصارة فى الكونجرس تغيير الدستور وسط التصفيق الحاد وانت مخلص البشرية علشان يظل رئيس مدى الحياة لغاية اسنانة ما تقع ويزرعوا لة اسنان جديدة وبرضة تقع ويزرعوا غيرها اربع مرات<br />المفروض يظل بوش فى الحكم لغاية ما يقعدوة على الكرسى ويعملوا مكياج لة شد وش وصبغ شعر وتلوين خدود علشان يكمل المسيرة اللى بدأها بغزو العراق وافغانستان ويقضى على الارهاب ويقبض على اسامة بن لادن<br />الفكر الجديد بتاعنا ارقى<br />واحد صديقى مات من الضحك لما قالوا لة فية ازمة كبيرة ازمة مالية والاسهم ضاعت والبنوك راحت فى داهية - قال الحمد للة بفضل فكرنا الجديد معندناش فلوس تضيع وكل الفلوس اللى فى بنوكنا يدوب تمن عمارتين او شركة متوسطة فى دبى<br />بالفكر الجديد عندك 70 مليون عاطل او بيشتغلوا اعمال هامشية واللى بيشتغل بجد لا يزيدوا عن عشرة مليون<br />سلام للبطالة الرهيبة<br />سلام للفقر المشين<br />سلام للفساد المتفشى فى كل مكان<br />واجمل تعليق قراتة فى جريدة الاسبوع دة<br />ان اعظم انجاز تم فى مصر هو ادخال نابليون للمطبعة عندما غزى مصر وكذلك ادخال الحزب الوطنى التوك توك فى العصر الحديث"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"

[[comments]]
order = 5
subject = "الرئيس الامريكي الجديد مسلم كفر  بالله لا تنتظروا"
author = "مش ضروري"
posted = "2008-11-07"
text = "ابوه كان اسمه حسين وتربى وترعرع في بيت مسلم ثم ترك ملة ابائه واجداده وتنصر وكفر ولبس الصليب واكل الخنزير<br />لا تنتظروا خيرا من هذا الكلب<br />فهو متفق مع اليهود على كل حاجه علشان خاطر كده نجح<br />اسود الوجه والقلب<br />اللهم افضحه اللهم افضحه وامته وهو مفضوح"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"

[[comments]]
order = 6
subject = "الاجندة اليهودية في الشرق الاوسط و(الكلب الاسود)"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-11-07"
text = "طبعا اجندة بالانجليزي يعني ادجندا والمعنى مش زي ما المصريين عارفينه او الاجندة اللي بتتباع اول السنه علشان خاطر اي واحد يكتب فيها اشياءه اليومية<br />اجندة بالانجليزي يعني جدول اعمال للمستقبل<br />وجدول الاعمال اليهودي في الشرق الاوسط او في هذه المنطقة تم وضعه منذ مئات السنين بواسطة اليهود<br />ويتم تسخير الاخرين لخدمة هذه الاجندة ومن ضمنهم طائفة البروتستانت او بوس طنط<br />ونرجع وراءا قليلا ونشوف اجندة الكلب بوش ضرب البرجين وغزو افغانستان والعراق وطبعا العراق علشان خاطر الشيعة يخرجوا من القمقم<br />الاجندة في هذه المرة محتاجه لرجل قذر اسود الوجه والقلب ومسلم وكفر بالله ولبس الصليب<br />يا سلام الرجل المناسب في المكان المناسب في الوقت المناسب<br />انا سمعت والله طراطيش كلام كده والله اعلم ان امريكا عايزه تفتت السودان من اجل اخراج المسيحيين من القمقم<br />اصل المسيحيين في السودان 30%<br />وسمعت كلام طراطيش كلام انهم عايزين يعملوا دولة مسيحية بجزء من السودان ومصر اصل عدد المسيحيين في مصر لا يرتقي الى دولة على الاطلاق فكلم 6% بعد الاكراميات<br />فالاجندة القذرة بتقول تفتيت السودان من اجل اخراج المسيحيين من القمقم لانشاء دولة مسيحية بجزء من السودان ومصر<br />المهم ان المسلمين في مصر بيلعبوا مع بعض عسكر وحرامية او بمعنى ادق امن دولة واخوان والمرشد الاهبل محتاس في الانتخابات مش ينبه المسلمين.. لخطورة الاحداث القادمة<br />لا لا لا دا هو لا زم يقضي على فرعون اولا ويجلس مكانه<br />افيقوا يا مسلمين وعودوا الله الله وعدوا الى اهل السنة والجماعة فهذا هو طوق النجاه من الشر القادم<br />سلام"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"

[[comments]]
order = 7
subject = "ولنا ايضا احلامنا"
author = "بفتة المنجد"
posted = "2008-11-09"
text = "نحلم بان نقف فى طابور العيش ساعة بدل ساعتين<br />ونحلم بان نعرف نعيش بمرتب 300 جنية وهم يدوب يشتروا جزمة وبنطلون<br />وبنحلم نروح قسم الشرطة علشان نعمل فيش وتشبية منطلعش من هناك بقضية اتجار مخدرات والا قضية اداب<br />وبنحلم بوظيفة للولد فى اى مكان بدل قعدتة فى البيت<br />وبنحلم بستر البنت وتزوجها وشراء شوية عفش لها<br />وبنحلم ان الاسعار تثبت<br />وبنحلم ان يزيل عنا الهم والكمد ويبعد عنا ولاد الحرام"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"

[[comments]]
order = 8
subject = "اجنته ايه وامريكا ايه دحنا العرب"
author = "laweryasser@yahoo.com"
posted = "2008-11-10"
text = "ليه منعملش اجنته لينا واللهى العرب اقوى من 100 امريكا لو حققنا الاتى<br />1-- اعطاء مصر فلوس البترول العربي كلها لمده 4 سنين لتبنى جيش قوى وانشاء مجمع للابحاث العلميه العسكريه ووجود جيش وقياده مصريه وقواعد فى كل دوله عربيه من المحيط الى الخليج وانشاء درع واقى للطائرات ف المغرب وايضا ف الجزيره العربيه وانشاء جهاز مخابرات عربي واختراع السحابه الالكترونيه الحربيه الصناعيه واختراع السحابه الكونيه ...<br />2 -- منع اى دوله عربيه ان تستورد اى منتج له مثيل ف دوله عربيه اخري ,,تحديد سعر عربي للسلعه.,, انتاج سيارات عربيه<br />تناسب الطقس العربي والطبيعه الصحراويه انتاج قطار سريع بضائع وركاب يغزوا الدول العربيه كلها وانشاء كارت الاكترونى للشخصيه لكل مواطن عربي يتحرك بيه بحريه وسهوله (زى البسبور) بس الفرق انه هيكون اجباري زى البطاقه<br />3 --انشاء برلمان للمناظرات يتناظر فيه اى شخص عن فكره ومعتقداته يكون مقره مصر لان مصر هى الدوله الوحيده الخبيره سياسيا ومعتدله الرأى وكمان مصر فى وسط العرب<br />4 --منع اى اختراع جديد __فى العالم غير عربي__ ان يدخل داخل البلاد الاازا تم الكشف طريقه اختراعه وشراء حق التصنيع وينتج عربيا ويتم انشاء مجمع للابحاث العلميه والمتطوره يتم من خلاله ارسال بعثات وتبادل علماء من كافه دول العالم لان العلم للعالم كله ملوش دوله<br />5 _ انشاء معمل عالمى للابحاث الوراثيه والاجنه والجينوم والنانو تكنولجى وابحاث الطبيه المتخصصه لاكتشاف علاج لامراض المستعصيه يستفاد بيه العالم كله<br />6 -- تكوين لجنه عربيه للصراع العربي الاسرائيبى مكونه من خبراء قانون وبيلوجيين و جغرافيين وتكون محايده وقرارتها ملزمه<br />ولها كافه الصلحيات تبحث الارض لمن ؟؟؟<br />وليا افكار تانيا كتير اوى كده كفايا عرفتوا ان العرب اقوى من اى امريكا ولا حتى الصين هتيجى فينا حاجه<br />اوعوا تسمعوا كلام الميؤسيين الميأسون لاء احنا كبار وكبار اوى وامريكا عارفه كلامى كويس<br />العرب قادمون رغم انف الميأسون"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"

[[comments]]
order = 9
subject = "المعلق السابق - الكلام اللى كاتبة بيفكرنا بكلام طي"
author = "المفتش كرمبو"
posted = "2008-11-10"
text = "الى المعلق السابق<br />بلاش الاحلام الناصرية الواسعة قوى دى - خليك جوة حدود بلدك - وقول لنا فكرك وفلوس بلدك المسروقة مش بتاع البترول ازاى تنمى وتبنى بلدك با مكانيات بلدك وناس بلدك وشعب بلدك<br />فلوس البترول بتروح للى بيطلعوا البترول من باطن الارض اللى هم الامريكان وتتحط فى بنوك امريكا ويعطوا دول البترول جزء منها ليعيشوا بها<br />الفكر بتاع الحزب الوطنى بيقول ما تبنيش حاجة خالص بل بيع اللى عندك والمثتثمرون الاجانب هم الذين سوف ياتون ويبنون البلد - كدة اهو - علشان سواد عيونك هيبنوا البلد - بس نوفر لهم الفنادق والبنية الاساسية زى الخمر والنسوان علشان يبنوا البلد<br />وكلام وزير الاثتثمار ورئيس الوزراء كلة عن المثتثمرين اللى هييجوا مصر يبنوها<br />شوف محدش هيبنى اى بلد الا عيالها وفلوسها<br />بس لازم يبقى فية خطة وقيادة تشرف على التنفيذ مش شوية حرامية وافاقين"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"

[[comments]]
order = 10
subject = "نعيب زماننا"
author = "فتاه من الصعيد الجوانى"
posted = "2008-12-05"
text = "الفكره موش باراك هيعمل أيه مع العرب الفكره أن الأنتخابات أثبتت أن المواطن الأمريكى موش عنصرى يعنى لما يكره الأسلام والمسلمين لازم العيب فينا ,أحنا اللى موش عارفين ندافع عن أنفسنا أحنا اللى وضعنا أنفسنا فى موقف المتهم أصلا وبقينا من الضعف أننا بنتشبث بجذور باراك المسلمه ولما يدافع عن أسرائيل نلعنه للدرجه دى أصبح مفعول بنا مانعمل زى أسرائيل نعمل محطات فضائيه كبيره فى أمريكا محطات مهمه موش رقص وروتانا والذى منه أو حتى نشترى ساعات مدفوعه فى المحطات الكبيره نتكلم عن نفسنا موش قاعدين نندب حظنا ماهو الفلوس كتير ونازله ترف تحت أقدام البغايا"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133617/http://masr.20at.com:80/newArticle.php?sid=18221"
