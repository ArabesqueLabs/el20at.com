subject = "يا رب يكون هذا الرجل جورباتشوف الامريكي"
author = "مش ححبك"
posted = "2008-11-06"
text = "يا رب يكون هذا هو اخر حكام امريكا كما كان جورباتشوف اخر حكام الاتحاد السوفياتي<br />يا رب فكك الولايات المتحدة كما فككت الاتحاد السوفياتي يا رب<br />اللهم فرق شملهم وشتت جمعهم ويتم اطفالهم ورمل نسائهم انك على ما تشاء قدير يا رب"
archived = "2008-12-17"
