[[comments]]
order = 12
subject = "فتحتى على نفسك فتحه"
text = "يا بنتى استعدى لكم هائل من التعليقات اللى هتلوم عليكى مجرد انتقادك ولوبصوره غير مباشره لبعض سلوكيات واحد اخوانى ولازم هيتقلك اتقى الله واحمدى ربنا انك زوجه الاخوانى والكلام ده وكان الاخوانى ده نبى منزه لا يجوز التعليق على تصرفاته ولا حتى ذكره بما لا يرضيه واالى انا شايفاه ان فى حاجات تانيه كتير انتى ماردتيش تقوليها يمكن خايفه جوزك يزعل لما يشوفها عامه احسن والا كانوا الاخوان اهدروا دمك ولا امروا بجلدك فى ميدان عام لتكونى عبره لمن يحاول مجرد ذكر الاخوان بما لا يرقى لهم"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

