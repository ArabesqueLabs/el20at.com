subject = "الخلع هو الحل"
author = "ابو يوسف"
text = "الموضوع ده عجبني قوي يمكن الفكرة غريبة ومش مهمة بس مكتوب بطريقة كويسة<br />ومعلش لو الاخوان دخلوا علقوا ما يا اما الناس تتغازل في غرام المرشد واتباعه يا اما يتشموا من ابتاعه<br />بس لي نقطة خلاف<br />الموضوع خارج كانك مسيرة يعني انت زعلانة ولا فرحانة من الي بيحصل<br />لو مش عجبك صحيح ما تطلبي الخلع<br />ولو عجبك طيب جيبي للراجل الغلبان جوزك حاجة كويسة عملها لك في حياته<br />بس خير"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 6
subject = "انت لابسة نضارة سوداااااااااااااا"
author = "سليمان"
text = "اتفق مع محمود سعيد حول انك اختزلت التجربة جدااااااااااا .أنا متأكد ان حياة الإخوان أكثر حيوية وصخبا من الرتابة التى تتحدثين عنها وفيما يبدو أنك تتحدثين اخوان فى نجع يقع فى اقاصى الصعيد...<br />من الله على أن وهبنى أماً من الإخوان وتعمل فى العمل الخدمى ...أو ان صح التعبير الإخوانى فى لجنة البر ...هذه البروتكولات ان صح بعض ما فيها الا أنها خنيقة جدااا .أمى يعتبرها كل الإخوة والأخوات من المتزوجين حديثا ..أماً لهم لا أستغرب أن أكون فى اى نشاط اخوانى وأتقابل مع عدد منهم فيبادروا بالسؤال عن أمى أو يوصونى بإرسال السلامات للأم .أمى فى المناسبات والأعياد تزورهم تباعا فى منازلهم ولا يخلو الأمر من هدايا ....واذا ما حدثت مشكلة عند أخ ما فيكون أبى مصطحبا أمى للم الشمل.<br />أما الكتبية ..فأمى تفرح كثيرا لحضور الإخوان فى بيتنا ..عندما كنت فى الجامعة ..كان أقل لقاء مجمع يحضر فيه 30 أو 40 من الشباب وكانت فرحة أمى كبيرة جدااااااااااا وكانت أمى تقول بيتنا لازم يكون طول عمره للدعوة .<br />أمر هام ...بعد تخرجى لم تكن مسألة دفع الإشتراك أمر مفروض على .....الإخوان قالوا لى الأمر متروك لظرفك...أمى كان لها رأى آخر قالت لى لا بد أن تدفع ........<br />فى بيتنا لنا طقس نجتمع يوميا بعد العشاء كل البيت حتى الأطفال ونقرأ جزءا من كتاب الله ثم يتولى بابا وعمرى ما قلت له أبى شرح آيه وحينما يأتى موعد أختى الصغيرة ..يقرأ أبى معها الفاتحة..........<br />أخت مها....أنت فى نعمة كبيرة حاولى التعايش معها ..قدمى حسن النية والترحاب ....هناك أمور لا تعجبنا ...حاولى التعايش معها....أما أمر زوجك والإشتراك فهناك من الأزواج من يصرف فلوسه على أى هلس أو شىء...احمدى ربنا ان ربنا رزقك زوج صاحب رأى وفكر وعنده قضية وفى دعوة وسطية مش متشدد ....ويأمرك بالنقاب والمكوث بالمنزل وكله هيبقى حرام .."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 7
subject = "مها أحمد \"بكابوظا في المدرسة\""
text = "مها أحمد \"بكابوظا في المدرسة\"<br />نشرت في 2007-07-19<br />تستعد حالياً الفنانة مها أحمد للقيام ببطولة الفيلم السينمائي الجديد \"بكابوظا في المدرسة\" والذي يعد أول بطولة سينمائية مطلقة لها، والعمل فكرة وكتابة زوجها الفنان مجدي كامل.<br />وتجسد مها شخصية طالبة ثانوية عامة فاشلة يتكرر رسوبها عدة مرات ورغم أنها رياضية ولاعبة جودو متميزة، إلا أنها تشاغب الزملاء والأساتذة في المدرسة، بينما يركز الفيلم على ضرورة التواصل بين الأجيال، بحسب صحيفة \"الرأي العام\" الكويتية.<br />وعلى صعيد آخر تستعد مها لتقديم برنامج \"ما تيجي نطبخ\" على إحدى القنوات الفضائية في رمضان، حيث تقدم فيه قضايا فنية في إطار المطبخ الفني وكيفية تحضير الفنان لدوره، الذي يقوم بتمثيله في الأعمال الدرامية مثلما تقوم ربة البيت بالتحضير لعمل الأكلات المفضلة."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 8
subject = "حيرتينا يا ستى"
author = "ياسر أبو العلا"
text = "أيوة ماشى كويس اللى انتى قلتيه يا ست الكل ، طيب إيه المطلوب ؟ دى أولا يعنى إيه بقى ثانيا ؟<br />ماذا تريدين أن تقولى للقراء الذين جذبهم العنوان ليقضوا وقتا فى قراءته ؟<br />ما المشكلة بجد إن زوجك أو الأخ زوجك يأتيه أصدقاؤه ولا يرون طرف جلبابك ؟ انتى شايفة ان دى حاجة مش كويسة ؟<br />والله حاجة تحير يا ستى .<br />المشكلة إن الكلام عن الإخوان طعمه حلو ، يعنى كل واحد عاوز يكتب والناس تقراله يروح ناتش موضوع عن الإخوان وخلاص.<br />تصدقوا أنا شاكك إن الموضوع ده يكون كاتبه أى واحد عارف تقاليد الإخوان وعامله على أنه حديث زوجة إخوانى .<br />وهذا النداء أوجهه إلى زوج هذه الفاضلة أن كانت الرسالة صحيحة ..<br />يا عزيزى لماذا أجلست زوجتك المصون فى قاعة مستقلة يوم فرحك ؟ كان يجب أن تجلسها فى قلب الشارع حتى يتفرج عليها الرايح والجاى ؟<br />وبعدين يا عمى ازاى واحد يجيلك ويقف ورا الباب من غير ما يتفرج على السيدة حرمك ؟<br />لازم تفتحله الباب وتقف تتساهر معاه شوية ..<br />يا راجل إيه التزمت والانغلاق والانقفال اللى انت فيه ده ؟؟<br />مش تخليك راجل سبور ؟؟؟<br />كفاية الصراحة احسن الواحد ناوى يخرج عن شعوره ."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 9
subject = "هى ايه اللى مضايقها"
author = "ayat alla"
text = "انا شايفة انها تتكلم عن المعاملات الخارجية اكثر ما بتتكلم عن طريقة حياتها مع زوجها فأنا شايفة انها مش متضايقة من زوجها اكثر ما هى متضايقة من اصحاب زوجها لكن الشكوى من معاملة زوجها مش واردة فى الحديث اذا هى بتعرض الشكل العام للحياة الخارجية ودى حاجة ممكن تتغير .<br />وشىء اخر اللى كاتبة عن مها احمد واخر ادوارها هى مش شايفة ان الموضوع بعيد تماما عن التمثيل ولا هو اى كلام وخلاص"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 10
subject = "ما انتي عارفه من الاول..لزمتها ايه؟"
author = "إيمان نبيل"
text = "ان مش فاهمه انتي عايزه ايه..وايه المشكله لما يزوركم اصدقاء زوجك العزاب ان تختفي ولا تسلمي عليهم ما هو ده المفروض يحصل في كل بيت مسلم احنا مش اخوان وبنعمل كده..<br />وبعدين اتجوزتيه ليه من الاول منتي عارفه انه اخوان ..ومالها الطريقه دي في التعارف علي الاخوات..<br />في ازواج كتير لا ليهم في التور ةلا في الطحين ومهملين زوجاتهم"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
