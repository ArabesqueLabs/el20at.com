subject = "المقال انتقلت لمساحة للراي بدون صورة"
text = "المقال انتقل الى مساحة للرأي بدون صورة الكاتبة<br />وهذا يدل دلالة قاطعة على ان مها احم دي شخصية وهمية لا وجود لها وانا متأكد ان الكاتب واحد راجل وجاهل كمان"
