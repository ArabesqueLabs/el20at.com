[[comments]]
order = 1
subject = "لا يوجد حاجة اسمها اخوان"
author = "حسام السيد"
text = "اولا كونك تعرفت على شاب كان منتمى للجماعات الدينية فى الجامعة دا حاجة تانية خالص<br />هل كان زوجك مسجل فى قوائم واسماء الجماعة واين يستطيع الانسان ان يسجل اسمة فى جماعة الاخوان ؟<br />لا يوجد حاجة اسمها اخوان ولكن هناك اتجاة دينى عند بعض الشباب فبيعملوا جماعة زى جماعة الصحافة وجماعة الرحلات وجماعة السياحة<br />كل المعارضة اللى بتعارض الحكومة يبقى اسمها اخوان علشان برة فى الغرب يفرحوا لما النظام يموت المسلمين زى الاخ مشرف فى باكستان بيعمل<br />كون السيد زوجك متمسك بدينة فدى حاجة طيبة وتحفظك وتصونك والاعايزاة ياخدك الخمارات والمراقص ويفتح لك قزايز الويسكى<br />احمدى ربنا انة بعت لك واحد صالح<br />وربنا يوفقك فى الحلال معاة<br />فية ناس متدينين يعرفوا ربنا ودول بيشدوا ازر بعض فى الانتخابات وخلافة<br />انما لا يوجد تنظيم اسمة الاخوان"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "يجب أن تشكري المولي علي إهدائه هذا الزوج لك إنها نعمة فلا تدخلي أفواه الاخرين إلي أذنيك حتي لا تفسد حياتكما بيدك و يكبر عذرك أمام الله<br />أتمني يا أختي الكريمة أن تسمو بنفسك قليلا ..........و أخلصي النية لله عز وجل قبل كل شئ .....تذكري أن زوجك لا يعمل من أجل الاخوان لكن يعمل من أجل نصرة شريعة الرحمن و من ثم فكوني مطيعة له حاملة لهمه تفوزي برضاه و من ثم رضا رب السماء<br />أما و إنك قد يصيبك بعد الضجر أو النفور ............فأحذري مداخل الشيطان لأنه قد يفسد عليك حياتك ز من ثم فإن زوجك قد لا يخسر شيئا فالدعوة ستسير و الله بنا أو بغيرنا و سينصر الله دينه لا محالة ..........و أنت فقط ستصبحين خاسرة<br />ألا تعلمي أن الامة تحتاج إلي رجال مضحون و فتيات مضحيات .......أقليل علي الله بعض التعب و بعض الوقت و بعض الفراق<br />أحمد الله علي نعمه و أشكريه يا أختي و لا يكن في صدرك حرج و لا تسمعي كلام الاخرين<br />فإنها و الله فتنة جديدة تدق قريبا علي أبواب الاخوان المسلمين و لن يصبر بها غلا من صبره الله فأثبتي علي دينك و اصبري نسأل الله الناة من الفتن<br />يا مقلب القلوب و الابصار ثبت قلبي علي دينك"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

