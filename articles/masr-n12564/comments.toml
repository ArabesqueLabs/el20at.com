subject = "أظن كده كل الآراء واضحة"
author = "ياسر أبو العلا"
text = "تسلم إيدك يا أستاذ فتحى إنت وباقى المعلقين اللى ظبطوا الموضوع ، وأظن كده الأخت اللى كاتبة المقال عرفت رأى الناس فى اللى كتبته ، أعتقد إننا لازم نقرأ تعليقها أو تعليق الأخ الفاضل زوجها على هذا الكلام الراقى الذى لم يتعرض لأحد بسوء ، علشان حد يوضح لنا بس الغرض من كتابة التقرير بهذا الشكل .<br />تحياتى لكم جميعًًًًًًًأ ، وأتمنى أن لا يكون كلامى مس أى شخص بأى أذى ، فالغرض الرئيسى هو الوصول للأفضل ...حفظ الله الجميع ."
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

