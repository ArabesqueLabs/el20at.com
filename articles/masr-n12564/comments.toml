[[comments]]
order = 35
subject = "فيفهم زوجي من ذلك أن عليه أن يأتي ليأخذ العصير والجاتوه"
author = "مش لازم"
text = "الكاتب الكذاب قال انها خبطت على باب المطبخ ليأخذ زوجها العصير والجاتوه<br />وبعدين في مكان اخر من المقال قال الكاتب<br />تبقي قواعد الاستقبال واحدة حتى في تقديم واجب الضيافة الذي لا يخلو من الينسون والقراقيش أم عجوة وملبن<br />يعني قواعد الاستقبال واحدة عند الاخوان هي تقديم اليانسون والقراقيش او عجزه وملبن<br />ولما الاخوانجي جه عنده الضيوف قدملهم عصير وجاتوه وهذا يدل دلالة قاطعة على ان المقال ملفق"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 36
subject = "ليدور حوارنا طيلة الوقت عن الشيوخ المفضلة لدينا والدعوة والمساجد، يتخللها فاصل أدعية لي ولزواجنا."
author = "ابومحسن"
text = "ليدور حوارنا طيلة الوقت عن الشيوخ المفضلة لدينا والدعوة والمساجد، يتخللها فاصل أدعية لي ولزواجنا.<br />هذا السطر يدل دلالة قاطعة على ان المقال متفبرج وكاتبه جاهل وغبي وليس امرأة<br />لان النساء (مهما كانت ديانتهم) اذا التقوا سويا ولو لأول مرة يتغلب عليهم الطابع النسائي وعلى الفور يتكلمون معا في الامور النسائية الحياتية كالطبيخ والحمل والولاده وتربية الاولاد والعلاقات الزوجية وخلافه من الاشياء النسائية<br />وبذلك اثبتنا للمرة الثالثة ان الكاتب اولا رجل ثانيا غبي وحمار وجاهل<br />ومعلش خلتوني شتمت وانا صايم النهاردة الاثنين ربنا يسامحني<br />وسوف اتبع السيئة الحسنة تمحها وسوف اتصدق بمبلغ من المال"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 37
subject = "نحليل صحفي وأجتماعي للمقال"
author = "وفاء السعداوي"
text = "إذا حللنا مضمون الكلام سنجد أن كاتبته أحسنت فى تصوير اسلوب الأخ ومنهجه فى حياته الأسرية l من حيث أرادت أن تشوهه فأبرزت صورته كزوج محترم محافظ يصون زوجه وبيته ومنضبط متمسك بعاداتنا وتقاليدنا التى تربينا عليها منظما يوازن بين بيته ودعوته وواجباته العائلية والإجتماعية بل انها ردت بقلم معارض عما يثار عن التسيب والتجاوزات ، ولا أشك أن هذه قصة غير حقيقية \" مفبركة\" لأن من تحمل كل هذا الرفض شكلا وموضوعا من الألف إلى الياء على المتدين ومنهجه فى الحياة على كل المستويات لايمكن أن تقبله من البداية زوجا لأنه لابد أن يكونا قد تفاهما على الصورة التى يرسمانها لحياتهما بكافة تفاصيلها قبل الزواج وحتى إن لم يحدث فلابد أن يكون الأخ الفاضل قد تصرف امامها بهذا المنطق أم أن كاتبة هذا الكلام تريد اقناعنا أنها فى لحظة واحدة اكتشفت أنها أصبحت زوجا له ووجدت نفسها فى هذا العالم الذى لا تتوافق معه على أى مستوى كما أن بنت تفكر بهذه الطريقة لايمن أن تختار إنسان محافظ فضلا عن متدين ولا استبعد أن يكون كاتبه رجلا من أصحاب الأقلام المغرضة"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 38
subject = "الحرب على الالتزام"
author = "ابن الحرمين"
text = "السلام عليكم<br />هذه حرب شرسة على الالتزام ومع كل الاختلاف مع الاخوان المخالفون لاهل السنة والجماعة ومع هذا يجب احترام الالتزام والسلام عليكم"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 39
subject = "دعوة لمراجعة سياسة عشرينات"
author = "إيمان"
text = "بداية اعتقدت أن روح الدعابة مقبولة بقدر لا تزيد عن حده اعتدت عليها في مواضيع بعض صفحات عشرينات لجذب اهتمام الشباب من حولهم وهذا يعجبني غالبًا لكن تفاجاءت باستمرار هذه اللهجة بعد توالي قراءتي لكمالة المقال الذي برأيي لا يختلف عن مقالات الجمعيات التي تتهكم على تقالدينا وعادتنا وقيمنا التي يحلم الغرب بها بل وبشهادة منه يراها مدعاة للعجب ونقطة لصالحنا ولتميّزنا الإيجابي. الإخوة والأخوات قاموا بواجب الدفاع عن ديننا وعادتنا وبالمقابل الاعتراض على هذا المقال المستهزأ حد الإشمئزاز!<br />كيف يسمح موقع عشرينات وإن كان من باب التعبير عن الرأي، وإن كانت صاحبته حقيقية أن تتعرض فيه القيم والثوابت دعابة و\"تريقة\" فلا أفهم ماذا تعيبه صاحبة المقالة على المسلم؟!<br />ولو وجدت هدف، كنت عذرتها على الأقل...لكن هل وصلت المرأة لهذا الحد من التسفيه للعمق والفهم الصحيحين؟!<br />هل انعكست المفاهيم حتى أصبح الحق باطل والباطل حق؟!<br />هل انتهت كل قضايا المرأة ولم يبق إلا هذا لتكرس له عشرينات صفحة في سيرفرها؟!<br />هل يستحق فعلًا نشره وتحريره وضبطه وتكريس جهد لترتيبته ونسخه ولصقه؟!<br />أنا لا أضخم الأمور، فليس الأمر مجرد مقالة نشرت وانتهى الموضوع بعد نقلها بعد الاعتراضات هذه الى مساحة الرأي<br />لاااااااااااااااااااا<br />نحن هنا نسجل اعتراضنا ان تنظر عشرينات لهذا المقال بعين فاحصة، فإذا تم الموافقة على نشره هذا يعني خطأ في إدارته كموقع اسلامي يسعى لتحقيق هدف سامي.<br />شخصيًا ارى واجب الاعتذار عن نشر هذا المقال فلا يعذر عشرينات بنشره الا اذا كان خطأ تم استدراكه<br />واذكركم بقوله تعالى: وما يلفظ من قول الا لديه رقيب عتيد.<br />نحن نريدكم ونريد ان نكون معكم مساحة رأي لكل من يحترم هذه المساحة ويعرف حدودها، فقد أسميتموها مساحة لأنها صاحبة حدود ولها مكان ومسؤولين وليست في الفضاء عبثًا...<br />وموقع عشرينات تميّز في مسيرته باجتهادات طيبة...فليدم على ذلك ولتكن هذه المساحة كالأرض الطيبة لا تنبت إلا طيبًا<br />فلا بأس من نقد ناصح، وتصحيح لمسار، وضحكة بكلمة...لكن ضمن الشرع والأخلاق والقيم!<br />تحياتي"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 40
subject = "رد على ايمان"
text = "وتعبتي نفسك ليه يا ايمان كل التعب دا كله وعملتي دعوة لمراجعة سياسة عشرينات<br />انتي مش عارفه اننا قاعدين على النت ياماما وليه عشرينات تغير سياستها اصلا<br />طالما فيه مواقع تانية فيها كل السياسات اللي يعجبك واللي يعجب غيرك<br />اذا ما كانتش عاجباكي عشرينات دي مسالة بسيطة عندك محركات البحث يا ماما دوري على اللي يعجبك وانسي عشرينات دي من اصله<br />سلام يا ايمان"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 41
subject = "رد على ابن الحرمين"
author = "مش ضروري"
text = "الاخوان المسلمين ليسوا مخالفون لاهل السنة والجماعة يا اخي الكريم وعقيدة اهل السلف هي عقيدة الاخوان المسلمين<br />لكن مشكلة الاخوان انها عندما بدأت ايام حسن البنا بدأت الدعوة الاسلامية 90% وعشرة في المية سياسة<br />الان الاخوان المسلمين 95% سياسة و5% دعوة<br />غلب عليها الطابع السياسي ونسيت الطابع الدعوي<br />وبعدين غاويين سجون ومعتقلات يا اخي ما اعرف ليه مع ان هذا ضد الفطرة البشرية لكن يا اخي بيرموا نفسهم في سكة المعتقلات لدرجة انهم بيعملوا (سي في) معتقلات وانا شفت دا مع جوز بنت خيرت الشاطر عامل سي في معتقلات<br />لكن هما ناس كويسين وما بيخالفوش اهل السنة والجماعة ولكن للاسف اضاعوا الدعوة الاسلامية في السياسة<br />ربنا يهدينا ويهديهم"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"
