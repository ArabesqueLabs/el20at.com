subject = "مكنتش حأعلق والله .. وقلت لهم ميعلقوش"
author = "محمد السيد"
text = "لم أرد التعليق ... للثقة التي تملؤني باهتمام الإدارة في عشرينات بمسألة التعليقات .. وإنها مقياس المواضيع في الفترة الحالية ....<br />وبمجرد قراءتي له . توقعت عدد كبير من التعليقات .... وقد كان ...<br />ولم أنو التعليق إلا بعد قراءة تعليق الأستاذ فتحي عبد الستار ....<br />ومن بعده .......<br />لا تعليق ....<br />يارب .. مش حاسكت ...<br />لا للتمديد ... لا لتوريث ... نعم لتعديل الدستور المصري \"مش ده الحل ولا الكلام المناسب ..بس مضطر أكتب كده\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />http://mesh7askot.blogspot.com/"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 25
subject = "عودى لزوجك أختنا ."
author = "عمر محمود"
text = "السلام عليكم جميعاً<br />بداية وأنا أحسب أن الكلام ها هنا محل نظر الجميع<br />هل يا شباب الالتزام صار الدين والصحبة الصالحة عيباً ؟ أم أن أختنا لا تدرى ؟<br />أنا واحد من هذه الفئة التى تتحدث عنها أختنا ، وزوجتى مثل أختنا تماماً بتمام ، ولكننا طالما نسعد بتلك الزيارات ، ونأنس بتلك الصحبة ، لطالما كانت تلك المواعيد زاد لنا فى حياتنا ، وكانت هذه النفقات باب خير وزيادة فى دخلنا المالى ، وتلك الليالى التى نغيب فيها عن بيوتنا من أجل كتيبة أو انتخابات أو حتى أى سبب يدعونا للخروج .... كم كانت سبباً فى زيادة الشوق بيننا ، كم هى سعيدة حياتنا بتلك الدعوة المباركة دعوة الإسلام .<br />لماذا لا تنظرى أختنا لأمر زوجك وزواجك من زاوية مشرقة ؟<br />لماذا هذه الأصوات التى تنادى بالإنفصال ؟<br />لماذا كل صغير وكبير صار ينادى بفسخ العلاقات الوثيقة ؟<br />لماذا صار الرباط المقدس لعبة فى أيدى اللاعبين ؟<br />لماذا كلما غضبت زوجة سمع العالم بحالها ؟<br />لماذا صارت البيوت مشاعاً لكل قاصى ودانى ؟<br />أنصح أختنا بجلسة مصارحة مع زوجها وأنا واثق من نتيجة طيبة تستقيم بها الحياة التى اختارها الله لهما .<br />وسلامى للجميع"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 26
subject = "الى الاستاذ فتحي عبدالستار"
text = "يا استاذ فتحي عبدالستار انت راجل صحفي واللي بيحصل في عشرينات دا سياسة موقع الناس اللي بتموله عايزه كده<br />انت بتصدق ان فيه واحدة اسمها مها احمد والموضوع فيه حجات غلط على الاخوان انا بقالي 30 سنه اخوان وكل الكلام المكتوب معظمه غلط يعني مثلا هي بتقول وكان التعريف يتم عن طريق أنا زوجة فلان الفلاني وهذا ليس صحيح الست بتقول انا ام فلان او بتقول اسمها ا لحقيقي اذا لم تكن مخلفة.<br />وبعدين في موضع اخر بتقول عندما يأتي أخ وزوجته، يتقدم الأخ أولا ليدق جرس الباب وتقف زوجته خلفه ببضع خطوات وهذا ليس صحيح العكس هو الصحيح الست هي اللي بتدق الباب اولا والزوجة ببتكون في استقبالها واذا فتح الاخ الباب بيفسح لها الطريق لتدخل الى داخل المنزل مع زوجته ثم بعد ذلك يستقبل الاخ اخوه<br />ومغالطات كثيرة يطول شرحها يدل على ان كاتب المقال ليس له علاقة بالاخوان<br />المقالات المكتوبة في عشرينات حاجه من اثنين<br />يا اما يخلوا المعلقين تشتم في بعض ودا واضح جدا في موضوعات الاقباط والاخوان والثورة وخلافه<br />يا اما المقال يغيظ القارىء ويخلوه يتفرس زي الموضوع المطروح امامنا دا<br />والسر في ذلك يكمن في شخصية الجهة التي تنفق على هذا الموقع"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 27
subject = "قل أنا أخواني ....ولا تقل إخونجي"
author = "عن مدونة مستنية الفرج"
text = "قل أنا أخواني ....ولا تقل إخونجي<br />اخواني واخواتي<br />تدوينتي اليوم<br />هي رجاء<br />هي همسة<br />هي طلب<br />كم اشعر بالضيق إن وصف أحدهم نفسه أنه أخونجي<br />او وصف أحدهم شخصاً آخراًُ أنه أخونجي<br />او تحدث هي عن نفسها فقالت أنا أخونجية أو تحدثت عن اخري ونعتتها بالاخوانجية<br />تقفز امامي صورة كمال الشناوي في فيلم احنا بتوع الاتوبيس وهو يستجوب احدهم<br />عن نور الشريف<br />بقي اخوانجي امتي؟<br />واتذكر ما تعلمته في المدرسة حول اللغة العربية والاوزان<br />فكلمة اخونجى هي نفس وزن كلمة خمورجى"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 28
subject = "الأدب المرفق بالغل الأسود"
author = "وسام فؤاد"
text = "كان اول تعليق لي على ما كتبتيه الأدب الذي يغلف الغل الأسود. أنا لن أقول كما قال سابقي.. لكن هذا ليس منتقد نأخذه على الجماعة التي نأخذ عليها الكثير، لكن ما وجدناكي تتحدثين سلبا إلا عن الود والزيارة والصلة، وهي امور لو ضايقتك لكان من السهولة بمكان ألا تقحمي نفسك فيها. لكننا كمجتمع نشكو من التمزق والفردانية التي جعلت مجتمعنا ضعيفا برغم تراحمه، وألعوبة برغم ضخامته.<br />الحمد لله الذي أبقى في المصريين من يعرف للود والأخوة والزيارة معنى ساميا يحافظ عليه."
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 29
subject = "مقال مكتوب بإحتراف الصحفيين"
author = "محمد السقا"
text = "عموماً أنا أزعم أن لي بعض الخبرة بالكتابة الصحفية المحترفة وأعتقد أن (مها) - طبعاً مش هأقول الأخت مها عشان ما تزعلش وطبعاً مش هأقول الأستاذة مها لأنها أضغر مني في السن - طبعاً أنا بأرد بنفس أسلوبها- المهم: مها كتبت المقال ده باحتراف الصحفيين والذي معناه عند المتخصصين والمحترفيين من الصحفيين إياهم إنهم بيكتبوا مقال يمكن فهمة على عدة وجوه بحيث تتطلع من المقال مش عارف بالظبط صاحبه عايز يقول ايه؟ وده اللي عملته مها ............. وده طبعاً من الأشياء اللي بتحسب على هذا النوع من المقالات ولا تحسب له.<br />.. لكن لا أخفيك يا مها إني عجبني المقال قوي لأنه في نظري ( صورة تجريدة مرسومة بحرفية لواقع زوجات بعض الإخوان)<br />وعجبني كمان لانه صريح وبيضرب في العمق....<br />وعجبني فيه كمان غنك قدرتي تقولي اللي نساء كتيير من هذا الوسط المحترم الطيب (الوسط الإخواني) مش قادرين يعبروا عنه ، مش لأنهم خايفين أو مجبورين لا سامح الله ... لأ ولكنهم يإما بيكونوا:<br />فاهمين كويس إيه اللي بيعملوه ازواجهم وليه بيعملوا كده ... وفي الغالب بتكون الزوجة كمان بتعمل نفس الحاجات اللي انتي ذكرتيها دي بل وهي تربي ابنائها عليها وتعتز بها.<br />أو بيكونوا ( الزوجات يعني) تعودوا على هذا الأمر واعتادوه ومع الزمن بتتكشف لهن حسنات هذا النمط من المعيشة في ظلال الفساد اللي احنا عايشين فيه.<br />ما ذكرتيه حقيقي ويحدث ... ولكن الشيئ الذي لم تذكريه هو مدى رضاءك عن هذه الصورة ؟ وما الخطأ تحديداً؟ وما العلاج من وجهة نظرك؟<br />ماذكرتيه حقيقي ولكن ... انت ذكرتي نصف الحقيقة؟؟ هل تفهمي ما أقول وما أقصد؟؟؟؟ نصف الحقيقة .... ها فهمتي ولا لسه.؟؟؟ طيب أوضح .... مع اني ماكنتش عايز اتكلم ؟؟؟ زوجك المحترم ده كيف تجديه عندما تكوني مريضة أو تعبانة؟<br />زوجك ده ماذا يفعل ب 93% من راتبه؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />زوجك هذا يدفع ال 7% لمصلحة من؟ ولماذا؟ وماذا يعود عليه من ذلك؟ هذه ال 7% تذهب إلى العمل الخيري والمساجد والاعمال الدعوية....<br />تعرفي حضرتك إن علبة السجاير الكيلوباترا المعفنة بكااااام؟؟؟؟؟؟؟؟؟؟؟ يعن زوجك لو بيدخن بس هيدفع من راتبه أكثر من 10% لصالح كشك السجاير اللي تحت البيت.<br />وطبعاً زوجك العزيز ده هيقضي ما لا يقل عن خمس ساعات يومياً على أحد المقاهي مع شلة الأنس.<br />وماتنسيش إنه يوم الجمعة ده كان هيستناه بفارغ الصبر عشان يقضي ليلة حمراء في وسط البلد.<br />او على أحسن تقدير هيفضل نايم زي شوال القطن طول اليوم .<br />ولكن ................ في النهاية المقال طرقت نقاط قوية وحساسة بس أتمنى تضيفي ليها شوية حاجات توضح رأيك وتوضح الحل لان فعلا في اخوة (أقصد أزواج من الاخوان) بيستهبلوا دعوياً أو منخرطين قوي في العمل الدعوي ولكن البيت مهم وزوجتك مهمة والبيت المسلم هو الأساس، ومن ضمن مهمات الزوج انه يراعيك ويحطك جوه عنيه - خاصة ان واضح ان حضرتك انسانة تحترم وتقدس المشاعر الانسانية- ومن مهماته كمان انه يعلمك ويعرفك إن الله ودين الله أحب الي النفس من أي أحد وأن هذه الأمة تحتالج لبذل وتضحيات ابنائها لتنهض وانه خير لكي أن تكوني في زمرة حاملين ههذه الدعوة المباركة حتى لو كنتي محشورة مع الاخوات والثلاثين عيل أحسن ما تكوني واحده تافهة لا قيمة لها ... أو تكوني زوجة لراجل هليث،<br />شكرا على المقال الصريح الذي هو في نظري ( صورة تجريدية واقعية مرسومة باحترافية ومعبرة عن واقع البعض)"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 30
subject = "انا ادرى منك يا \"مدام أخ\""
author = "منى 1"
text = "السلام عليكم ورحمة الله وبركاتة<br />اولا يا أخت مها أو هكذا سأدعوكى كما أخترتي لنفسك أسماً وقالت اهو يخرجنى من العنوسة وبس زيك مثلا ، بيكون النتيجة زيك بردوا<br />اولا أود أن أعبر لكٍ عن شكرى الكثييييييير لك ، فلقد أثبتي لنا دائماً صدق مقولة أهمية زواج الأخواني من أخوانية تنشأت في هذا الجو ولا ترضى بغيره ، أما من أرتضت بعريس جالها وخلاص ، فلاشك لن يعجبها الجو ، وكنتى خير مثال ، فأشكرك ، بل سأقوم بالدعاية لموضعك بنفسى لانك خير مثل وافضل برهان ودليل.<br />بخصوص ما كتبتيه من ان زوجك لا يسمح للرجال رؤية طرف جلباباك ، فالصراحة معاكى حق ، لازم يعرضك على اصحابه واحد واحد ، لانك \"أدنى\" من أن يحافظ عليكى ، ويعاملك معاملة الؤلؤ الذي يحفظ بمحارته ، ولأنك أرخص من أن يرفض أن تتلوث عينيكٍ برؤية غيره.<br />أما بخصوص الأخت اللي بتقول على جوزك الأستاذ ، فبردوا معاك حق ، لان جوزك _لأنة تزوجك _ أقل من أن يحترم ، ولأن هناك أمور لا تعرفيها انتى طبعا تتعلق بصيغ الحب وتعبيراته ، بخصوص ان لا تسمحى لاحد حد ان ينطق اسم زوجك ، لأنه لك وحدك ، طبعا انا مقدرة ان كلامى مش هيعجبك لانك مش هتفهميه ، اللي تفهمه واحدة عايشة مع زوجها في هيام وعشق وغرام او حتى حب ، لكن انتى انتشلك من العنوسة وبس...ولا عندك رأي تانى؟<br />الصراحة الراجل مفروض ان كتر خيره انه انتشلك من العنوسة ، وبعدين يا قمره محدش ضربك على ايدك تجوزى اخوانى ، ولا وجدتى ان معه هيكون حياتك أكثر أماناً من غيرهم؟ ، وجدتى انه ممكن يتقي الله فيكى وميبيتكيش بعلقة ويصبحك بعلقة كما تستحقي بصراحة ...ارزاق بقي هتقول ايه. بس هو غلطان انه اجوزك فعلا."
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 31
subject = "ضع عنوان التعليق"
author = "منى 2"
text = "وبعدين هو انتى يا مدام كنتى فكرا ان جناب \"الأخواني\" هيعملك فرح يجيبلك فيه شعبان عبد الرحيم ، ودينا وشكارة؟<br />امال ذهلتى ليه لما المدامت ملئوا القاعة؟ ولا هو هبل وخلاص؟ خسارة فيكى ،،، كان لازم يلبسك بدلة رقص ويقعدك وسط الرجالة ...هو ده اللي يستحقه أمثالك.<br />ومين قال يا قمر ان زيارة الاخوات بنقضيها تواشيح واستغفار و حضرة؟؟؟ معلش انتى اللي كنتى سخيفه مع الناس وكانوا بيحاولوا يفتحوا مواضيع مشتركة ، لكن يا قمر انا بروح في الاخوان آخد دورات تجميل وأزاى أعمل حمام مغربي وأزاى احط مكياج ..........شوفي ازززززززززاى!! طبعا ده بجانب تغذية الجانب الديني.<br />اما بالنسبة انك تبقي أخت ، فده بعينك...انتى فكراها سهلة كده؟؟ دى درجات ومراتب ياقمر ، ولا عشان قالت لك تعالي حفلة بقت هتجندك في الصف؟ امثالك أصلاً الصف يلفظهم (حتى لو دون علمهم ).<br />بخصوص فيلم الكتيبة ، الراجل غلطان فعلا ، لازم يعمل زى باقي الرجاله اللي بيسهروا على القهوة ومراتتهم متشفهمش غير لحظات يوميا ويمكن مش كل يوم ، اما بخصوص حرصه على الموعد ، محدش قال انه هيسيبك \"تولدى\" ويروح الكتيبة ، مبتحصلش يا خفيفة الظل.ومفيش حاجة اسمها الاخ المسؤل هيقول له سيبها تتحرق وتعالي ، اللي متعرفيهوش ان عندنا الازواج بياخدوا توصية احيانا بحسن التقرب للزوجه ، وانهم يجبولها هدايا ويساعدوها بالبيت ، وده تماذج حصلت امامى فعلا ، لدرجة ان اخت خمنت ان زوجها واخد امر بغسل المواعين مرة وقعدت تهذر معاه وتغلس عليه ،<br />في حد بيعمل ده يا مزمل غير الاخوان!!."
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 32
subject = "أنا أدرى منك يا مدام أخ"
author = "منى 3"
text = "وصفيح ساخن إيه ياحلوة اللي حياتكم بتتحول له، للمرة الالفين بقولك محدش ضربك على ايدك ، وبعدين يا قمر جوزك يديهم 7% 70% ده شىء ميخصكيش لانه مش من حقك تحاسبيه فلوسك بتروح فين ، والأهم من ده وده ، انك طبعا هعذرك على جهلك الفلوس دى بترد له لو أعتقل بيجيبوا له محامى وبيصرفوا على البيت ، وممكن يجيبوا له الحاجات اللي اتسرقت بيد الامن ، ده كمان لو مات بيتصرف على البيت..معذورة على جهلك ، وعشان تبقي فاهمه ممكن الاخوان اللي يكونوا جابوا له الشغل ده اساسا ، يعنى عشان ميبقاش بياخدوا بس ياحرام وانتى جعانه بقي ورايح يدى لهم وسيبك تموتى ياغلبانة.<br />حكاية الانتخابات اه حقيقة ، ايه المشكلة انه يتشغل فيها شوية ، فعلا امثالك محتاجة ان زوجها يتشغل بمحرمات وعلاقات تانية عشان تقول حقي برقبتي ، ومحدش شدك من شعرك وقال لك روحي الافطار ، حتى ممكن تروحى ساعة واحده فقط ، وكتر خير البيت اللي بيستضيف 30 اسرة ، وفي حاجات متفهمهاش عن التربية واهمية ان الاطفال يختلطوا باطفال ، وطبعا اطفال الاخوان اهم أئمن أطفال يختلط بهم دون قلق (طبعا لك قاعدة شواذ) ومفترض واحد زى جوزك لانه اتجوزك ميصليش التراويح ..مش كده؟ وكمان مفروض يقعدك تاكلي في طبق واحد مع اخوة ، مهو ده مستواك ، وبعدين ملوش حق جوزك فقط وليس باقي الاخوة يعمل مكتبة ، ميصحش فعلا ،<br />اما بالنسية للمقاطعة ياظريفة ، القصة وما فيها \"الصحة\" المنتجات الغذية بتضر الصحة ، وبالتالي منتجات<br />وبعدين الموضوع ده لذيذ جدا ، ليس له هدف الا الفرقعة ، ورغم كده ده يتناقض مع الرسالة الاعلامية ، ومفروض الغلط مش عليكى ، الغلط على اللي مكلفك بموضوع زى ده ، و زمان علمونا أن من فات قديمه تاه ، واللي نسي الناس اللى ساعدوه في بدء حياته يبقي ناكر الجميل<br />ملحوظة : أنا أخوانية أباً عن جد ، وأخواتي تزوجن بأخوة ، وبفضل الله في منتهى السعادة ، ومجتمعي كله اخوانى وكل الزوجات سعيدة وان كان هناك ما ينغص الحياه بين الحين والآخر ، او شواذ القاعدة ، او اتنين ينفصلوا ..فهو امر طبيعي جدااا"
archived = "2007-11-27"
capture_url = "https://web.archive.org/web/20071127095455/http://masr.20at.com:80/newArticle.php?sid=12564"

