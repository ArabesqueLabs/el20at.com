subject = "عشرينات اهتم بالمواد المنشورة"
author = "احمد الراشد"
text = "ارجو من السادة المسؤلين عن موقع عشرينات ان يهتموا بالمادة المقدمة للقراء وان يقدمو مادة هادفة تستحق القراءة بدلامن قراءة مقال مبهم لا تعرف في النهاية مغزاه وأود من صاحبة الموضوع ان تقول هذا الكلام لزوجها هو اقدر ان يحل مشاكلها كلها بدل من مضيعة الوقت في كتابة سفاسف الامور"
