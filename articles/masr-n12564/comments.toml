[[comments]]
order = 17
subject = "حاجة تقرف"
text = "يمكن انا فهمت غلط ..أنا محستش ان الزوجة الفاضلة دي عندها مشكلة او ان لها تحفظات على زوجها و الاخوان بتوعه<br />لكن الغريب و الغبي في الموضوع ان كل الطقوس و السلوكيات و التعاليم الاخوانية دي حاجات طبيعية جدا وبتحصل في اي بيت محترم<br />يعني كتير جدا من البيوت المتحفظة بتعمل كده الرجالة مش بتقعد مع الستات في الزيارات العائلية ..عادي يعني<br />ليه دايما عايزين تحسسونا ان الاخوان دول مجموعة من الملائكة تمشي على الأرض ..ايه القرف ده"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

