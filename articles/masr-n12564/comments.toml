[[comments]]
order = 20
subject = "تعليق واحد إخواني"
author = "أيمن سيد"
text = "الأخت الكريمة كاتبة الموضوع<br />وللا بلاش كلمة أخت أحسن تزعلك وانت مش عايزة لقب أخت<br />عندما قرأت موضوعك أحسست بنوع من الخنقة والملل الشدشد ليس لأني إخواني ولكن لأن الانتقادات اللي حضرتك بيتقوليها سمجة حبتين<br />أولا ماحدش أجبرك على الزواج منه لكنك قبلتيه بمحض إرادتك ممكن لأنك خايفة تعنسي مثلا لكن دي مشك مشكلتنا دي مشكلتك انت<br />ثانيا احمدي ربنا لأنه رزقك بواحد يعرف حقوق ربنا وحقوقك وبلاش البطر دة وتخيلي نفسك مع واحد لا يعيرك ولا أخلك أي اهتمام أو حفظ للحقوق أو حتى مع واحد عادي لا يهمه شيء سوى الأكل والشرب وللا بقى حضرتك كنتي عايزة أدهم صبري واحنا مش واخدين بالنا<br />ثالثا اشتراك الإخوان اللي واقف في ظورك ومخللي حياتكم على صفيح ساخن هاتلاقسه أقل بكتييييييير قوي من فاتورة التليفون الللي بترغي فيه طول النهار وأقل من تكلفة عزومة لأهل حضرتك وأقل وأقل و أقل بس احنا كدة الحاجة اللي رايحة لله عنينا هاتطلع عليها<br />رابعا لو الأخوات عايزينك تعرفي طريق حلقات المسجد مش عيب وأظنه أحسن بكتير من جلسات النميمة والقيل والقال يمكن تسمعي حديث أو تعرفي معنى آية أو حتى تفيضي عليهن من علمك الغزييييييييييير وللا التليفزيون أحسن لحضرتك؟؟؟<br />خامسا كونه يقتطع جزء من وقته لله دة مش عيب بل لأنه راجل مؤمن برسالته وبيضحي في سبيلها والمفروض إنك تعينيه مش تخنقيه وتخمقينا معاكي<br />سادسا المثل الشعبي بيقول عيني فيه وأقول إخخخخيييي طبعا دة لأن حضرتك قاعدة فاضية عمالة تسردي المثالب والعيوب اللي هي أصلا مش عيوب لكنها مجرد فقاعات عمالة ترميها علينا واحدة فاضية والفاضي يعمل قاضي"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 21
subject = "هي ديه عشرينات"
author = "ما حدش ليه دعوه"
text = "هي ديه عشرينات تحط حاجات غريبة ومتخلفة عشان الناس تخش وتعلق وخلاص ويبقى موضوع متحطله تعليقات وخلاص<br />لو الست اللي كاتبة الموضوع مش عاجبها حياتها يبقى تخرس وتتكتم وتقول لجوزها أنا مش عاجباني عيشتي وهو كراجل مسلم فاهم هيديكي حقك الشرعي ويسرحك سراحا جميلا<br />لكن شغل التريقة بتاع الطحاوي وتلامذته بلاش منه أحسن<br />جاتكو القرف مليتو البلد"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 22
subject = "أين المشكلة ؟؟؟!!!!"
author = "فتحي عبد الستار"
text = "الأخت الكريمة كاتبة المقال ..<br />حقيقة لا أدري أين المشكلة فيما كتبت، فأنا حقيقة محتار، هل تكتبين هذا الكلام للإشادة بزوجك وأخلاقه وتدينه أم لانتقاده؟؟!! وإن كان يبدو من روح الكتابة أنك تنتقدين، ولكنك - حسبما ارى - لم تذكري إلا أشياء تفخر بها كل زوجة، وكثير من الفتيات والزوجات يتمنين أن يكن مكانك لينلن هذا الفضل والأجر.<br />عفوا إن قلت إن حديثك هذا يذكرني بالمثل الشعبي القائل: (ملقاش في الورد عيب قال أحمر الخدين) !!!.<br />إن ما ذكرته عن زوجك وعن إخوانه وعن مراسم الزفاف والضيافة والاحتفالات ما هي إلا آداب إسلامية أصيلة بصرف النظر عن كون زوجك من الإخوان أو من غيرهم !!.<br />كما أن العمل في دعوة الناس إلى الخير وإلى التمسك بدين الله عز وجل، والتعاون مع الغير على القيام بهذا الأمر لهو فخر كبير لمن يقوم به (وتعاونوا على البر والتقوى).<br />فإن كان زوجك يقوم بهذه الأفعال فهو نعم الزوج، ويجب عليك إن أردت الثواب والأجر من الله أن تعينيه على هذا وتشجعيه لا أن تسخري منه وتنتقديه على الملأ.<br />أما إن كنت غير مقتنعة بالمنهج وبالفكرة وبالطريق فهذا هو خطأ زوجك الوحيد حيث لم يبحث عن زوجة تشاركه اهتماماته وتتفهمها وتساعده في القيام بواجباته، واختارك على أسس أخرى متنازلاً عن أشياء كثيرة.<br />لا ترهقي نفسك أختي الكريمة وتتحملي حياة لا تحبينها وزوجا لا تقبلين سلوكه، صارحيه بما عندك، واطلبي الانفصال أكرم لك وله، وابحثي عن زوج آخر يلبي لك رغباتك ويعرضك سلعة رخيصة أمام الناس ولا يكون له هم في حياته سوى السعي لإرضائك بصرف النظر عن إن كانت طلباتك هذه ترضي الله أم تغضبه!!.<br />ملحوظة:<br />كتبت هذا الرد على اعتبار أن الكاتبة زوجة حقيقية وكلامها حقيقي، وإن كنت أشك بل أكاد أكون على يقين من أن الكاتبة نسجت هذه القصة من وحي خيالها، والله أعلم بالنيات.<br />واتقوا يوما ترجعون فيه إلى الله."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
order = 23
subject = "إضافة"
author = "فتحي عبد الستار"
text = "بعد أن قيل لي إنك شخصية حقيقية تكتب باسم مستعار أحب أن أقول:<br />كنا سنتفهم حديثك تماما ونعتبره لو أنك تكلمت عن تقصير زوجك في واجباته الزوجية والمنزلية بدعوى الانشغال في الدعوة، أو إهانته لك بالسب والضرب والمعاملة السيئة، أو تناقضه مع ما يدعو إليه بأن يكون داخل المنزل شخصا آخر غير الذي خارج المنزل، أو أو أو .. لكنك لم تتحدثي عن أي من هذه الأشياء، وهذا دليل على أنه رجل كريم الخلق يحسن معاملتك وعشرتك، وقد رددت له الجميل بطعنه في ظهره بكلامك هذا.<br />ماذا يقلن إذن الزوجات اللاتي يهينهن أزواجهن ويقترن عليهن ويضربونهن ويسبونهن؟؟<br />ماذا يقلن الزوجات اللاتي يهجرهن أزواجهن إلى المقاهي والنوادي وأماكن اللهو والمجون والعربدة؟؟<br />ماذا يقلن الزوجات اللاتي لا يغار أزاجهن عليهن ويتركهن للذئاب تنهش لحومهن وأعراضهن؟؟<br />ماذا يقلن الزوجات اللاتي يأتي أزواجهن بأصدقاء السوء وزوجاتهم إلى بيوتهن وبدلا من أن ينعمن بفاصل الأدعية الذي تسخرين منه، ينزلن عليهن سيلا من الغيبة والنميمة والكلام الفاحش؟؟؟<br />ماذا يقلن الزوجات اللاتي بدلا من أن يضع أزواجهن في البيوت مكتبة الكتب الدينية التي تضايقك يضعون الكتب الصفراء وشرائط العهر والفسق التي تدمر البيوت؟؟؟<br />هل كنت ستسعدين مع زوج من هؤلاء؟؟؟ أخشى والله أن يسلب الله عز وجل منك هذه النعمة نتيجة جحودك لها وعندها فقط تعرفين الحقيقة وكم خسرت!.<br />نعم إن الإخوان بشر، وغير منزهين عن الخطأ، ولكنك لم تتكلمي عن أخطاء، وإنما تكلمت عن إيجابيات تفخر بها هذه الجماعة ومن ينتمي إليها."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

[[comments]]
