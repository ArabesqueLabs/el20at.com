subject = "و ماله"
author = "karam"
text = "وماله كل الكلام اللى قلتيه ده راجل عنده هدف عايز يحققه ممكن نختلف معاه او نتفق لكن في الاخر ما هياش ممارسات اجتماعية شاذة - الله يخليك ما تفهمنيش غلط- كتير من الاسر بتعمل كدة وكل واحد حر يختار حياته بطريقته والزوجة - اى زوجة- تسستم - من system - على كدة او فى انفصال وخلع وخلافه<br />ناقص بس توضحي لى وللناس معنى الكتيبة دى يعنى إيه وهى حاجة وحشة واللا إيه"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205317/http://masr.20at.com:80/newArticle.php?sid=12564"

