subject = "تناقض ام ماذا؟"
author = "هبه"
text = "السلام عليكم<br />اعجبتني نقطتان:<br />الاولى ان الزواج تم عن طريق زميل مشترك !! زميل مشترك !! زميل مشترك !!<br />والثانية انك تعترضين على ان العزاب لا يرون طرف جلبابك !<br />فأي تكريم هذا الذي ترفضين؟<br />مع انني ارى ان الموضوع بحد ذاته مستفز، الا انني لا يمكنني ان اتفق معك الا على نقطة واحدة؛ كثرة ارتباط الملتزمين باخوانهم احياناً على حساب اسرهم وراحتهم! من الجميل ان يكون هناك لقاء مرتب ، ولكن من الاجمل ان يكون قصير، منظم، ولا يكون على حساب امور اخرى !<br />شكرا"
