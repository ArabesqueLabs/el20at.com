text = "طالما انتي شاطره اوي كده يا مها احمد<br />ما تقوليلنا عمل ايه في فض غشاء البكاره بتاع حضرتك مهم الناس تعرف الاخوانجي بيفض غشاء البكاره ازاي<br />وبروتوكولات الاستمتاع بحضرتك ممكن تحكيهلنا بالتفصيل"
