author = "محمد"
text = "جوزك بيدفع 7 % ده معناه إنه اولا دخله فوق ال 300 جنيه...ثانياً مش مؤيد هو فوق مؤيد ممكن يكون منتظم أو عامل....<br />بس الدنيا عند الإخوان مش بالصرامة دي...ومفتكرش إن \"التنيين الدعوي\" لسة موجود...إنقرض في ظل حالة الخناق الاقتصادي..الموضوع تسديد ومقاربة مش أكتر...والإخوان أبسط من كده....ومندمجين بدرجة كبيرة مع بقية المصريين المعذبين....<br />يا أخ ياسر..يعني إنت مفهمتش...الست بتعرض ما تتعرض ليه وخلاص...هو لازم يكون من ورا كل حاجة ...حاجة تانية...بسط الأمور وخليها احمدي ..."
