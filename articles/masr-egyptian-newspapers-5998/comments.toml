subject = "جمهورية العطوانيين"
author = "جابر العطواني"
posted = "2007-05-27"
text = "كلاب أنتم يارجال السياسة تتكالبون على الدنيا كأنها لكم وحدكم لذلك قررت إقامه دولة العطوانيين على أنقاض جمهورية المباركيين الكلاب لنسوي من اليوم أكبر عمليه إنقلابيه في تاريخ البشريه ... كم أنك كلب كبيرررررررر يا مبارك انت وزبانيتك<br />لنلقاك مع بداية شرارة المعركة وانت ذليل ."
