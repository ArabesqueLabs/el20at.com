subject = "ارهابيه بنت ارهابى"
author = "طارق الوزير"
posted = "2007-05-23"
text = "تلك جميله المنظر قبيحه الاحساس هى ارهابيه بنت ارهابى ! فابوها ليفنى كان عضوا بأحد المجموعات الارهابيه الصهيونيه التى نفذت العديد من المجازر للفلسطينيين ! و حتى على جنود الانجليز ايام الانتداب البريطانى ! فقدخطفوا اربعه جنود انجليز وشنقوهم فى شقه بالقدس وجدوا الابعه معلقين مشنوقين ! ولقد كان ابوها عضوا فى تلك المجموعه الارهابيه الصهيونيه....وشكرا للوزير عمر سليمان لتلك الصفعه لهؤلاء الكلاب الصهاينه"
archived = "2010-03-14"
