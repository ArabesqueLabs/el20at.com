posted = "2007-05-23"
text = "(يا ايها الذين امنوا لاتتولوا قوما غضب الله عليهم ومن يتولهم منكم فانه منهم)هذا قرآن يا سادة اى ان من يقابل هؤلآ القوم<br />وهم يقتلون اخوننا فى فلسطين فانه مثلهم اى انه من يحكمنا يهودى ولا ايه يا شيخ الازهر قصدى يا شيخ الحزب الوطنىوحسبى الله نعم الوكيل"
