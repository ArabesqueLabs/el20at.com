subject = "عملاء قطاع غزة في خدمة المحتل"
author = "مصر هى أمي"
posted = "2007-05-27"
text = "كلهم كلاب سواء عمر سليمان أو غيره ....... الوفد الامني الاستخباراتي قاعد بيعمل ايه في قطاع غزة<br />اصحوواااااا يا بشر هو حسني وكلابه فيهم خير ابدا داى كلهم لصوص .<br />كان اقتصاد مصر ايام الحرب اقوى من الان ايام الحرب كانت الاسعار اقل عشرات المرات من الان<br />كان الجنيه بـ 7 دولارات ولكن بعد تعويب (تفتيص)الجنيه اصبح الدولار 6 جنيه يا ويلنا وسواد ليلنا من ايام جايه<br />ان لم نستيقظ لابد من ثورة على الظلم والبطش دي ارضنا وارض اجددنا لابد من تحريرها من الخونه والمرتشين .<br />اذا بحثت في مباديء ثورة يوليو لوجدت ان كل مبادئها ضاعت في الهواء اصبحنا متخلفين عن الدول الحاله الاقتصادية زفت<br />الحاله الاجتماعية ازفت والتعليم اصبح سطحي والنهب والسرقه عادت عيني عينك . اما باقي القطاعات فحدث ولا حرج .<br />عااااااااااااااااااااااااااااااااااااااااااااااااااااااااووووووووووووووزززززززززززززززززززززززززززززززززززين ثــــــــــــــوووووووووووووووررررررة .<br />يا الله يا أبناء مصر ثورواااااااااااااااااااااااا على الظالم والقهر .... فلا نامت أعين الجبناء .............."
archived = "2010-03-14"
