text = "ايه الى جايب البرادعى مصر ايه جاى يعمل هو ميتا زار مصر علشان يجى يركب رئيس علينا هى حماره<br />يا عم شكرا كفايه الى احنا فيه هو يعرف ايه عن مصر هو عاش حياته كلها بره عند الغرب وادى علمه للغرب هو لو صح مصرى وبيقول انا مصرى كان ادى علمه لمصر بدل طاير على بره .<br />هو جاى يخربها زى مخرب العراق ولا ايه .<br />ده جاى يتبلطج علينا . واحنا موافقين بالرئيس محمد حسنى مبارك سواء كان هو او ابنه جمال على الاقل هوما فهمين البلد ماشيه ازاى لاكن هو عاش عمره كله بره وجاى يتريس علينا لالالا وبنقول لالا .<br />ارجع من مكان مجيت وخد الى جو معاك وقول ليلى بعتوك دى مصر<br />والحمد لله على النعمه الى ادهالنا ربنا ونحمد ادينا وش وظهر ونقول الحمد لله<br />والسلام عليكم ورحمه الله وبركاته"
