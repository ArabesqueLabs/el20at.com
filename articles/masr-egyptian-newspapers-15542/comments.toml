text = "طب البرادعي عايز يغير الدستور<br />يخلي سلطات الرئيس محدودة و يدعم الرقابة على الحكومة من مجلس الشعب<br />و كمان الانتخابات تبقى سليمه يعني المجلس احنا اللي هنختاره مش هو اللي هيعينه<br />طب هينفذ أجنده أجنبية إزاي؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />بيقولي إن البرادعي بره إدارة البلد و ميعرفش الإدارة بتاع مصر ماشيه ازاي.... ازاي عايزينه يبقى ريس؟<br />الراجل بره نظام الادارة و ميعرفش ازاي اراضي مصر و مشاريعها بتتباع ببلاش للي يسوى و اللي ميسواش<br />البرادعي ميعرفش ازاي الميه تتخلط بالمجاري و الاكل يبقى فيه امراض و ملوثات و سرطانات و لا ازاي المليارات بتاع الشعب الغلبان ياخدها ناس تتعد على أصابع اليد<br />فعلا لو عايزين البلد بالطريقه دي يبقى البرادعي مينفعش<br />الطلبات السبعه للجمعية التي يرأسها البرادعي واضحه و لا يوجد فيها ما هو ضد أي مصري سوى المستفيدين من الفساد و التزوير<br />عموما<br />إذا كانت طلبات البرادعي هي أجنده غربية<br />و إذا كانت الإصلاحات التي يطالب بها خيانة<br />فاللهم أعشني خائنا و أمتني خائنا<br />و احشرني في زمرة الخائنيين"
