text = "هؤلآ هم اناس كل همهم المال لا يريدون دولة ولا استقلال لانهم مستفيدين من الوضع الحالى<br />التنازل عن الحقوق مقابل المال وكلهم يعيشون عيشة الامراء ولا يهمهم الشعب الفلسطينى مثلهم مثل رئيسهم<br />مثل جميع الحكام العرب."
