[[comments]]
order = 1
subject = "مليونرات الفتنة"
author = "ابو اسامة"
text = "هؤلآ هم اناس كل همهم المال لا يريدون دولة ولا استقلال لانهم مستفيدين من الوضع الحالى<br />التنازل عن الحقوق مقابل المال وكلهم يعيشون عيشة الامراء ولا يهمهم الشعب الفلسطينى مثلهم مثل رئيسهم<br />مثل جميع الحكام العرب."
archived = "2007-06-20"
capture_url = "https://web.archive.org/web/20070620204708/http://masr.20at.com:80/newArticle.php?sid=10685"

[[comments]]
order = 2
subject = "اقتلو الثعبان الدحلان"
author = "فهد الاسلام"
text = "الاخ الكريم طيف بدر قرات تعلقك اسلوبك جميل جدا وجزك الله خيراء ونفع الله بمثلك الاسلام اما عن هذا الدحلان فحرم ان تتط رجليه القذرة ارض مصر هولاء العملاء الفتحوين فهم فعلا فتحوين يردون ان ينفتحو على اسريل وامريكا ولا يهمهم القضية اصل للكى الله يا حماس لك الله يا اسلام كل شى اسلامى محارب من هولاء الذين يعدون علينا من المسلمين اقتلو راس الا فعة دحلان الجبان"
archived = "2007-06-20"
capture_url = "https://web.archive.org/web/20070620204708/http://masr.20at.com:80/newArticle.php?sid=10685"
