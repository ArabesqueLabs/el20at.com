[[comments]]
order = 3
subject = "غزه"
author = "محمد"
posted = "2008-03-04"
text = "اتفق علماء المسلمين علي ان الاخوان المتآسلمين من الفرق &--1639;&--1634; التي في النار حيث انهم باحثين سلطه وحكم متاجرين بالدين : ومن مظاهر الجماعة وأصولها أنهم يُغلقون عقول أتباعهم عن سماع القول الذي يخالف منهجهم، ولهم في هذا الإغلاق طرقٌ شتى متنوعة:منها إشغال وقت الشباب جميعه من صُبحه إلى ليله حتى لا يسمع قولاً آخر،<br />ومنها أنهم يحذِّرون ممن ينقدهم، فإذا رأوا واحداً من الناس يعرف منهجهم وطريقتهم وبدأ في نقدهم وفي تحذير الشباب من الانخراط في الحزبية البغيضة أخذوا يحذِّرون منه بطرق شتى تارةً باتهامه، وتارةً بالكذب عليه، وتارةً بقذفه في أمور هو منها براء ويَعلمون أن ذلك كذب، وتارةً يقفون منه على غلط فيُشنعون به عليه، ويضخِّمون ذلك حتى يصدُّوا الناس عن إتباع الحق والهُدى وهم في ذلك شبيهون بالمشركين يعني في خصلةٍ من خِصالهم حيث كانوا ينادون على رسول الله صلى الله عليه وسلم في المجامع بأن هذا صابيء وأن هذا فيه كذا وفيه كذا حتى يصدُّوا الناس عن إتباعه.<br />من مظاهرهم أيضاً أنهم يرومون الوصول إلى السُلطة وذلك بأنهم يتخذون من رؤوسهم أدوات يجعلونها تصل, وتارةً تكون تلك الرؤوس ثقافية، وتارةً تكون تلك الرؤوس تنظيمية، يعني أنهم يَبذلون أنفسهم ويُعينون بعضهم حتى يصل بطريقة أو بأخرى إلى السُلطة، وقد يكون مغفولاً عن ذلك، يعني إلى سُلطة جزئية، حتى ينفُذُون من خلالها إلى التأثير وهذا يتبع أن يكون هناك تحزب، يعني يقرِّبون مِنهم من في الجماعة, ويُبعِدون من لم يكن في الجماعة فيُقال: فلان ينبغي إبعاده، لا يمكّن من هذا, لا يمكّن من التدريس، لا يمكّن من أن يكون في هذا، لماذا ؟<br />والله هذا عليه ملاحظات ! ما هي هذه الملاحظات ؟<br />قال: ليس من الشباب ! ليس من الإخوان ونحو ذلك.<br />يعني: صار عندهم حب وبغض في الحزب أو في الجماعة، وهذا كما جاء في حديث الحارث الأشعري أن النبي صلى الله عليه وسلم قال: (( من دعا بدعوى الجاهلية فإنه من جثاء جهنم )) قال: وإن صلى وصام ؟ قال: (( وإن صلى وصام، فادعوا بدعوة الله التي سماكم بها ربكم المسلمين والمؤمنين عباد الله )). وهو حديث صحيح. كذلك ما جاء في الحديث المعروف أنه عليه الصلاة والسلام قال لمن انتخى بالمهاجرين وللآخر الذي انتخى بالأنصار قال: (( أبدعوى الجاهلية وأنا بين أظهركم! )) مع أنهما اسمان شرعيان, المهاجر والأنصاري, لكن لَمَّا كان هناك موالاة ومعاداة عليهما ونصرة في هذين الاسمين، وخرجت النصرة عن اسم الإسلام بعامة صارت دعوى الجاهلية، ففيهم من خِلال الجاهليةِ شيءٌ كثير، ولهذا ينبغي للشباب أن يُنبهوا على هذا الأمر بالطريقة الحُسنى المثلى حتى يكون هناك اهتداء إلى طريق أهل السنة والجماعة وإلى منهج السلف الصالح كما أمر الله جل وعلا بقوله { ادعُ إلى سَبيل ربِّك بالحِكمة والموعظة الحسنة وجادلهم بالتي هي أَحسن }.<br />أيضاً من مظاهرهم بل مما يميزهم عن غيرهم أن الغاية عندهم من الدعوة هو الوصول إلى الدولة هذا أمر ظاهر بين في منهج الإخوان بل في دعوتهم. الغاية من دعوتهم هو الوصول إلى الدولة أما أن يُنجَّى الناس من عذابِ الله جل وعلا وأن تُبعث لهم الرحمة بهدايتهم إلى ما يُنجيهم من عذاب القبر وعذاب النار وما يدخلهم الجنة, فليس في ذلك عندهم كثير أمرٍ ولا كبير شأن, ولا يهتمون بذلك لأن الغاية عندهم هي إقامة الدولة ولهذا يقولون الكلام في الحكام يَجمع الناس، والكلام في أخطاء الناس ومعاصيهم يفرِّق الناس فابذلوا ما به تجتمع عليكم القلوب، وهذا لا شك أنه خطأ تأصيلي ونية فاسدة, فإن النبي صلى الله عليه وسلم بين أن مسائل القبر ثلاث, يُسأل العبدُ عن ربه، وعن دينه، وعن نبيه صلى الله عليه وسلم فمن صحب أولئك زمناً طويلاً وهو لم يَعلم ما يُنجيه إذا اُدخل في القبر فهل نُصح له ؟ وهل حُبَّ له الخير ؟ إنما جُعل أولئك ليستفادَ منهم للغاية، ولو أحبوا المسلمين حق المحبة لبذلوا النصيحة فيما يُنجِّيهم من عذاب الله، علَّموهم التوحيد وهو أول مسؤول عنه........))"
archived = "2010-03-14"
