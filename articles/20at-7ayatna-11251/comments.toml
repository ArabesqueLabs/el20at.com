text = "انا اود الرد على الاخت \"محللة عاطفية \"<br />انا لا ارى ان من الذوق ان تتكلمي عن المراسل تامر المسحال وعن زوجته بهذه الطريقة لانك لا تعرفينهم ...<br />والمراسل تامر يشهد له بالاخلاق .. والشجاعة وتجلى ذلك من خلال حمله للامانة وبكل اخلاص ونقله للحقيقة وللواقع المأساوي الذي كان في غزة ..<br />وراينا كم تعرض الصحفيون للاستهداف المباشر في الحرب فيجب علينا جميعا ان نقدم لهم تحية اجلال واكبار لا ان نتدخل في شؤونهم الخاصة او نتلفظ بالفاظ منافية للرقي"
