[[comments]]
order = 0
subject = "القمع أساس المللك"
author = "T.R"
posted = "2007-05-10"
text = "الحاكم يضرب بالطبلة<br />وجميع وزارات الإعلام تدق على ذات الطبلة<br />وجميع وكالات الانباء تضخم إيقاع الطبلة<br />والصحف الكبرى .. والصغرى<br />تعمل أيضا راقصة<br />فى ملهى تملكه الدولة<br />لا يوجد صوت فى الموسيقى<br />أردأ من صوت الدولة<br />الدولة منذ بداية هذا القرن تعيد تقاسيم الطبله<br />\"العدل اساس الملك\"<br />\" الشورى - بين الناس - أساس الملك \"<br />\" الشعب - كما نص الدستور - أساس الملك \"<br />يارب الكون شبعنا من ضرب الطبلة<br />لا أحد يرقص بالكلمات سوى الدولة<br />لا أحد يزنى بالكلمات<br />سوى الدولة<br />\" القمع أساس الملك \"<br />\" شنق الإنسان أساس الملك\"<br />\" حكم البوليس أساس الملك\"<br />\" تأليه الشخص أساس الملك\"<br />\" تجديد البيعة للحكام أساس الملك\"<br />\" وضع الكلمات على الخازوق\"<br />\"أساس الملك \"<br />طبله ... طبله ...<br />والسلطة تعرض فتنتها<br />وحلاها فى سوق الجملة ...<br />لا يوجد عرى أقبح من عرى الدولة ....<br />** مقطع من قصيدة ( عزف منفرد على الطبلة ) لنزار قباني - الله يرحمه"
archived = "2010-03-14"
