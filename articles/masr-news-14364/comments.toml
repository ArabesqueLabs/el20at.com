author = "الاخوان - طز - فشنك"
posted = "2009-12-13"
text = "الاخوان خيال ماتة للنظام<br />والنظام بيقدمهم ذريعة امام الغرب اما ان نحكم نحن ال مبارك الشريف او يحكم الاخوان امتداد لاخوان غزة<br />وجود الاخوان رغم تسميتهم بالمحظورة هو انبوبة اوكسجين تنفس النظام ليفرض الاحكام العرفية والمحاكم العسكرية ونظام الطوارىء وكان البلد فى حالة حرب<br />اذن الاخوان عملاء للنظام الفاشل لانهم المبررات لكل المساوىء<br />الا ان ظهر البرادعى<br />والبرادعى ليس اخوان<br />وهنا وقع الجميع النظام والاخوان فى حيص بيص ومش عارفين يعملوا اية<br />من راييى ان الاخوان يشوفوا لهم شغلة تانية ويبعدوا عن دماغ اهلنا<br />خلينا وراء البرادعى لغاية ما نشوف"
archived = "2009-12-14"
