[[comments]]
order = 1
subject = "تداعيات الارتفاع غير المبرَّر للإسمنت"
author = "مش ححبك"
text = "ازاي بقا غير مبرر<br />اصل الراجل اللي ماسك الاسمنت ابن عم الراجل اللي ماسك الحديد<br />وبعدين اللي ماسك الحديد معاه 40 مليار<br />واللي ماسك الاسمنت معاه 15 مليار بس<br />فالراجل بتاع الحديد اللي معاه 40 مليار بيعاير ابن عمه بتاع الاسمنت اللي معاه 15 مليار بس وبيقوله يا شحات<br />فالراجل بتاع الاسمنت اللي معاه 15 مليار بس اضطر لرفع سعر الاسمنت علشان خاطر يرفع رصيده الى 20 مليار علشان خاطر يبقى غني زي الراجل بتاع الحديد<br />فنرجو من الاخوة الشباب بتوع مشروع ابني بيتك انهم يستحملوا شوية ارتفاع الاسعار بتاعة الاسمنت علشان خاطر الراجل بتاع الاسمنت زعلان انه معهوش غير 15 مليار بس وعلشان خاطر الراجل بتاع الحديد يبطل يعايره ويقوله يا شحات<br />معلش يا شباب طلعوا اللي تحت البلاطه علشان خاطر بتاع الاسمنت اللي عنده 15 مليار يقدر يرد على ابن عمه اللي عنده 40 مليار<br />سلام يا شباب"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203400/http://masr.20at.com:80/newArticle.php?sid=20101"
