subject = "الشيء القرضاوى اوالشيك اوالشيخ القرضاوى"
author = "شكوكو"
posted = "2008-10-15"
text = "اصلة اللى بيفعد فى الخليج الدفع كلة بالشيكات علشان مبالغ كبيرة مفيش حاجة اسمها فكة والشىءبا لشيىء يذكر الشيخ القرضاوى كنت باتفرج علية احيانا فى قناة الجزيرة بس لما عرفت انة اتجوز واحدة عندها خمس طعشر سنة غيرت رايى فى سماحتة"
