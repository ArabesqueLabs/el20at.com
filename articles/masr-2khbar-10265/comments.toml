[[comments]]
order = 1
subject = "هذا الشبل من ذاك الأسد"
author = "EasternBird"
posted = "2008-10-15"
text = "والله قصيدة رائعة تكاد الدموع تتفطر من بين أبياتها<br />رحمك الله يا شيخنا الفاضل ورحم اسرتك من العدو والصديق<br />وقفت معتدلا بجوار الحق فما تلين لمتطرف ناعق من هنا أو هناك<br />وكانت مواقفك دائما عنوان شخصيتك الفذة ورايك الحر وهدفك النبيل<br />وكعادتهم لن يدركوا قدرك الا بعد وفاتك حفظك الله<br />وحينها سيبكون ولكن اي بكاء ينفع ؟<br />اللهم وحد صفوف المسلمين"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "للاخ المسئ للقرضاوى عيب عليك ده اكبر من ابوك"
author = "محمد السعداوى"
posted = "2008-10-16"
text = "وانا ارى انك اخذت الكل بسيفك ولم تقف مع الحق ، يا استاذ عبد الرحمن لحظة تروى مع النفس فانت فى بعض كلامك تتحدث كما يحدثنا من ملكوا عقولنا فى جريدة الدستور ومن ساروا على خطاها بأن الاهم هو درء الفتن حتى لا يقتلنا عدونا بما يملك من تدمير<br />لكنى اسألك واسأل اصحاب العقول من صنع ولا يزال يصنع الفتن من الذى من خلفنا عدو ومن امامنا صديق ؟؟<br />أجيبوا يا اصحاب العقول ناصعة البياض !!!!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الى المدعو شكوكو"
author = "مش كاتب"
posted = "2008-10-18"
text = "ممكن نعرف المعلومة دي جبتها منين حضرتك<br />بس لما عرفت انة اتجوز واحدة عندها خمس عشر سنة غيرت رايى فى سماحته<br />الشيخ القرضاوي اتجوز واحدة عندها 15 سنه اسمها ايه ومنين وعرفت منين انه اتجوز<br />اولا كون انك تسيء للقرضاوي فالقرضاوي ليس احسن من النبي محمد فالنبي محمد يساء اليه ليل نهار وهناك مواقع كاملة على النت للاساءة بالنبي محمد صلوات علله وسلامه عليه<br />وهناك ايضا من اساء الى الله وقالوا عليه ثالث ثلاثة وقالوا عليه جل جلاله انه انجب ولدا والعياذ بالله فهذه اساءة الى الله<br />فلما تقول ان القرضاوي تجوز واحدة عنها 15 سنه قولنا بقية التفاصيل وادلتها ما تضربش سهم كده وتهرب<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""
