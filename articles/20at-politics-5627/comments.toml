text = "كفو أيديكم عن الوطن أمركيين كنتم أم يهود أم غلاة المتطرفين من السنة أو الشيعة أو أياً كانو أرحمونا يرحمكم من فى السماء أننا نعيش فى كابوس وليس فى وطن لا أعرف لمصلحة من تخرج الفتاوى بتكفير السنة من جهة وتكفير الشيعة من جهة أخرى أرحموننننننننننننا عاصمة الرشيد سقطت والقاهرة ستسقط هى الأخرى لن يبقى شئ بعد ذلك مع فتاوى تكفير المسيحيين فى قادم الأيام هذا هو السيناريو المتوقع لنا فى مصر الرحمة الرحمة الرحمة الرحمة"
