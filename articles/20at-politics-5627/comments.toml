subject = "جدران و نفوس تعبة"
author = "لينا عبود"
posted = "2007-05-07"
text = "يا منى..<br />وقد اضفت للقلوب جدار اخر .. يثقل الحزن والهم في القلب<br />انه جدار يفصلنا عن هناءة البال في الوطن<br />وعن الأمل في عودة الأمان<br />وعن المواطن الذي طالما كان حلمه العيش المحترم<br />علينا ان نكسر ذاك الجدار الذي فصلنا به عدونا عن واقعنا واعموا عيوننا عن ما يسلب منا بطيب خاطر احيانا وبالقوة احيان اخرى<br />ان حطمنا الجدران الوهميه في عقولنا بأننا فاشلون .. بالتأكيد سنتمكن بعدها من تحطيم جدران المحتلين والمعتقلات<br />موضوع رائع<br />ويلامس النفس<br />لينا"
