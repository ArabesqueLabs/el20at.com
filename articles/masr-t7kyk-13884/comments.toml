author = "قدوة حسنة"
posted = "2009-11-01"
text = "رجل اعطاة اللة العلم فوهبة للناس<br />ومن فلوسة الحلال لم ينسى الفقير والمسكين فبنى الجمعية الخيرية وعيادات تعالج الفقراء بالمجان ومسجد للركع السجود والف الكتب التى تقوى ايمان الناس<br />من اجل هذا احبة البسطاء وفقراء الناس وبكوا علية عند موتة ومشوا فى جنازتة<br />رجل ترجم الايمان الى عمل لخدمة الفقراء وما اكثرهم فى بلادنا<br />فى وقت كان يسارع هو الى الخيرات كانت ارازل الناس زى عز وغيرة يمصون الفقراء ويحولون المليارات الى بنوك سويسرا<br />مصطفى محمود شكرا رسالتك وصلت الى ايدى الفقراء<br />فجزاك اللة خيرا واسكنك فسيح جناتك"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = ""
author = "علي"
posted = "2009-11-01"
text = "جزاه الله عن الامة الاسلامية كل خير<br />الفضل لله أولا واخيرا ثم لجهود هذا العالم الجليل في جعلي اتفكر في خلق الله وفي عظيم ملكوته.<br />كما انه مثال للعالم العابد الذي عرف الله وارشد الناس اليه وهو حجة علينا بان الدعوة لله لا تقتصر على المشايخ وعلماء الدين ولكن كل شخص منا قدر استطاعته<br />رحمته الله عليه<br />وسيخلف فراغ كبير في حياتنا برحيله<br />اللهم أجمعنا به في دار الخلود والنعيم"
archived = "2010-03-14"
capture_url = ""

