author = "إيمان"
posted = "2009-11-01"
text = "ربنا يرحمه<br />بجد مصطفى محمود ده ابويا ومعلمى الاول يكفى انى ابتديت احب القراءة وانا لم اكمل العشر سنوات بسبب حبى الشديد لكتبه .. مش عارفة أقول حاجة غير انى 70% من اللى اعرفه ومن اللى سعيت عشان اعرفه كان هو السبب فيه من كلمة قريتها فى كتاب ليه أو سمعتها فى حلقة من برنامجه .. يكفى انى لغاية النهاردة بفتح كتبه لما احس بالضيق اوى من الدنيا عشان احس انه بيكلمنى واتبادل معاه الافكار.. ربنا يرحمه بجد هو علم جيلنا كتير اوى وكان ليه فضل علينا كتير أوى..ربنا يرحمه<br />الفاتحة"
archived = "2010-03-14"
capture_url = ""

