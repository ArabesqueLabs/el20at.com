text = "للدكتور مصطفى محمود فضل كبير عليّ بعد ربنا سبحانه وتعالى<br />1- أول كتاب (كامل) قرأته في حياتي كان \"حوار مغ صديقي الملحد\" وأتذكر كيف أثر في وجعلني أريد أن أصبح داعية إلى الله<br />2- أتذكر أنني قرأت كتاب \"أينشتاين ونظرية النسبية\" عدة مرات رغم أنني كنت طالب أدبي باكره العلوم.. لكن الكتاب كان ممتع جداً وجعلني أحب قراءة كتب العلوم..<br />3- أتذكر أن أحد أقاربي كتب الله له الشفاء في إحدى المراكز الطبية لمستشفى محمود اللي في منطقة الإعلاميين بالعجوزة<br />اشهد يارب انني تعلمت منه الكثير.. فأجره على ما علمني"
archived = "2010-03-14"
capture_url = ""

