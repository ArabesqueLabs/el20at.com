text = ":-| :zzz<br />رحم الله الدكتور مصطفى محمود، حلقاته كانت في غاية الفائدة والمتعة والصدق فهو رجل يحب العلم ولا يتاجر به ..<br />اتذكر جيدا حلقة أثرت في اهل بلدتنا جميعا وربما تتذكروها معي..\"حلقة القراميط\" د. مصطفى يومها حكى عن طبيعة تغذية القراميط وقال انها بتتغذى على الفضلات وان فيه ديدان تربى تحت جلدها ومن يومها غابت القراميط عن مائدتنا إلى اليوم وربما إلى يوم الدين ليكون حديث الستات اوعي يا اختي تجيبي قراميط ده مصطفى محمود قال فيها ديدان.. وغابت القراميط<br />تعلمنا منه الصبر وحب الخير والتفكر في ايات الله ومخلوقاته"
