author = "جيمي"
posted = "2009-11-01"
text = "الراجل ده للأسف لم ياخذ حقه كما يجب .<br />فلو الجنازة كانت لمطرب مشهور أو فنان كبير أثري العالم بقبلاته الساخنة للفاتنات على البلاج .. لكانت الحكومة اوفدت مبعوثين لها و يحضر الوزراء لتقديم واجب العزاء بشخصهم، معربين عن حزنهم ومرارة إفتقادهم له .<br />ويا سلام إن كان رجل أعمال كبير .... :cry: مش عايز أقولكم كانوا عملوا ايه .<br />كانت الجرايد تانى يوم هتشتغل على إعلانات المواساة و تقديم العزاء و الوزراء و الحكومة و رجال الأعمال الى زيه هيتسابقوا علشان الى يحجز أكبر مساحة من الصفحة<br />وتيجى شركة زي موبينيل مثلاً ولا عز الدخيلة وتروح فاردة صفحتين كاملين ف نص الجورنال علشان الى بيقراه من الأمام يشوف النعى و الى بيقراه من الخلف يعدى عليه برده :-x<br />ربنا يرحمه .. ويسكنه فسيح جناته ، يعنى لا خد حقه وهو عايش ولا بعد ما مات .<br />ربنا يرحمه بقدر الإفادة الى أستفادها الملايين عبر الوطن العربى بل و الغير عربى كله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
