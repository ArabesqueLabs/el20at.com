[[comments]]
order = 1
subject = "العلمانى حر يكونزى مايكون مش لازم بقى يعلمن غيره"
author = "منى وهيب"
posted = "2007-12-14"
text = "لو كان رايك ان الافلام اللى من النوع ده فن يبقى احسن رد عليكى هو الرد العبقرى اللى قاللك علمانيه سليم احسن من منى سليم وعلى راى الاخ محمد السيد مفيش اى نموذج عدل شفتيه خالص فى مناجاة الناس مع رب الناس هو ربنا ده واحد صاحبنا حاشا لله اى انسان بيتعرض للحزن والفشل وعدم القدرة على تحقيق احلامه لكن المؤمن عارف ومتاكد ان نظرته قاصرة وان اللى حصل مهما كان هو عين المصلحة اللى القدر بيكشفهالنا كتير بعد كده وحتى لو اذى برضه المؤمن عارف انه لو صبر جزاؤه كبير عند ربنا عشان كده الحديث الشريف بيقول عجبا لامر المءمن امرة كله خير اذا اصابته سراء شكر واذا اصابته ضراء صبر وخلى بالك من بقيه الحديث( وذلك للمؤمن فقط) وعلى العموم اما توفيق الحكيم كتب حديثى مع الله الشيخ الشعراوى رد بكلمه حكمة وقال رايت رجل يبدو بالغ ذو طفولة فى العقيدة وكل النماذج اللى حكيتى عليها مجرد ناس كبروا فى كل شىء وظلت عقيدتهم طفلة عشان كده بيتكلموا بعقليه ومنطق الاطفال"
archived = "2010-03-14"
capture_url = ""

