[[comments]]
order = 2
subject = "تفريق طوابير الخبز وتشتيتها والقبض على مخن يقف فيه"
author = "مباحث امن الدولة"
posted = "2008-03-20"
text = "جريدة مصرية امس نشرت هذا الحل امس<br />هو اللواء العادلى مش فاضى الا للقبض على المرشحين للمحليات وعمل محاكمات عسكرية لشوية من الاخوان<br />وسايب العملاء اللى بيشوهوا وجة النظام المعطن العجوز العكر ويقفوا طوابير ويطلعوا فى تلفزيونات العالم<br />يقبض ويبعت البلطجية اللى بيصرفوا فى فلوس الخزينة على كل من يقف فى تلك الطوابير<br />صحيح شوية جرابيع واقفين طوابير<br />وخللوا الرئاسة تسيب مقرها فى شرم الشيخ من 26 سنة وتيجى القاهرة علشان الغوغاء والصيع الغلابة<br />اقبضوا على كل من يقف فى الطابور<br />شغلانة سهلة باعم العادلى"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322003007/http://masr.20at.com:80/newArticle.php?sid=14772"

[[comments]]
order = 3
subject = "هل يصنع الجيش والشرطة الخبز على البنادق والا المدر"
author = "جاهل عايز بفهم"
posted = "2008-03-20"
text = "الرئيس المبجل طلب من الشرطة والجيش حل ازمة الخبز<br />مبلغ علم اى جاهل مثلى ان الشرطة والجيش لديها مخابز بتشتغل وبقدرات على قدر عدد الجنود<br />انما مخابز تكفى الشعب كلة - الجيش هيحتفظ بها لية - والا الشرطة<br />العملية بالكاد مخابز تكفى جنودها - ازاى بقى هيحلوا مشاكل الرغيف<br />مطلوب بناء مخابز جديدة اتوماتيكية تنتج بكميات كبيرة فى الاحياء الشعبية - تقيمها التموين او احد الشركات<br />انما اتخاذ قرارات على ضرب - الحقوا حريقة فى الجبل الاحمر"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322003007/http://masr.20at.com:80/newArticle.php?sid=14772"

[[comments]]
order = 4
subject = "المشكلة استخدام الرغيف كعلف للحيوانات"
posted = "2008-03-21"
text = "ـ هذا ليس له علاقة بتوسيع أو رأب الفجوة الغذائية لأنه لو تكلمنا عن الفجوة الغذائية فهي عبارة عن عرض وطلب، إنتاج واستهلاك فالأراضي الزراعية في مصر في تزايد مع الوقت في حين تم استصلاح مئات الآلاف من الأفدنة وإضافتها للرقعة الزراعية بمساعدة ودعم من الحكومة وأيضاً بمساعدة الشركات الخاصة، فمسألة الدعم لابد أن نفصلها تماماً عن الأمن الغذائي أو الفجوة الغذائية الموجودة في مصر،.<br />بل يمكن لها أن تساهم في زيادة الاهتمام أو تقليل الهدر في استهلاك المواد الغذائية، فهل يعقل أن رغيف الخبز ثمنه في مصر « 5 قروش»، أي ما يعادل «سنت واحد» في حين أن تكلفة رغيف الخبز الحقيقية تتعدي «الجنيه» أي «ربع دولار»، لذلك عندما يجد المستهلك بأن رغيف الخبز سعره رخيص، فبالتالي قد يحدث سوء استخدام للمنتج وبالتالي تصرفات غير منطقية، وتلك تجربة عاصرتها شخصياً، ودعيني أقول لك انه لو أحضرنا رغيف الخبز .<br />(نقلا عن جريدة عربية)"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322003007/http://masr.20at.com:80/newArticle.php?sid=14772"

[[comments]]
order = 5
subject = "لماذا الدعم - بيعوا لنا بالاسعار العالمية بس اعطون"
author = "حمار ببردعة فى عزبة الحاج"
posted = "2008-03-21"
text = "اللاخ اللى بيقول ان الرغيف الدولة بتبيعة ب 5 قروش وتمنة الاصلى 40 قرش - يا سيدى ماشى وهو احنا قلنا حاجة - يشيلوا الدعم ويبيعوا الرغيف بجنية بس فية حاجة واحدة المرتبات فى مصر تبقى زى فرنسا او امريكا - بلاش زى اليونان<br />بلاش زى الهند وباكستان<br />يا محترم البلد دى محطمة ومنتهية فية دكتور طبيب بيشتغل بعد التخرج ب 130 جنية يعنى ب 50 دولار فى الشهر يعنى اليوم بتاعة بدولار ونص وعايزة يشترى رغيف العيش بالسعر العالمى<br />الدولة بتسرق الناس وبعدين تقول لهم الدعم<br />دعم اية ياحرامى انت وهو"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322003007/http://masr.20at.com:80/newArticle.php?sid=14772"

[[comments]]
order = 6
subject = "مراويتو"
author = "دودو ام ننوشة"
text = "لhبجد انا بقى اقول لكم سر عن مروة وهو سر المعذرة يعني زمان كنت لو اي حد مضايقك ومش عارف تاخد حقك منه روح اقف جنب مروة شوية وهي تعتذر لك بالنيابة عنه ههههههههههه طبعا ده من باب زيادة الادب الجامد انا كنت اتشال واتحط جنبها وهي تفضل مكملة برضه بس دلوقتي ما شاء الله بقت تحط صباعها في عين التخين وكل من جراء جلوسها بين العشريناتيه الجامدين<br />مراويتو كما اناديها هي نفسها الاستاذة مروة بتاعة فريق بداية"
archived = "2008-03-22"
capture_url = "https://web.archive.org/web/20080322003007/http://masr.20at.com:80/newArticle.php?sid=14772"

