subject = "لأ ..كده تدخل في الكتابة النقدية عدل"
author = "أحمد عبد الحميد"
text = "بداية أسلوبك في العرض بسيط ورائع يا حاج علي ..ما شاء الله<br />أحمد حلمي لو اتجه في المشوار ده انه يكون لأفلامه ( حتي ولو كانت أفلام كوميدية ) قضية هتبقي إضافة ليه هايلة<br />أحمد عبد الحميد<br />aa_hameed@hotmail.com"
