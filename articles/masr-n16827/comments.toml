[[comments]]
order = 12
subject = "مش ممكن"
author = "اسامة المصرى"
text = "واللة فلم عالمى واحمد حلمى ممثل يمكن يغير شكل السينما المصرية للعالمية الحقيقية لان فضل يمشى فى سكة صعبة يمكن عادل امام نفسة ميقدرش يمشى فيها واحترافية تمثيلة للدور دة كانت هايلة واعتقد انة لو دخل اوسكار احسن فلم اجنبى 2008 ممكن يعمل حاجة"
archived = "2008-08-08"
capture_url = "https://web.archive.org/web/20080808000844/http://masr.20at.com:80/newArticle.php?sid=16827"

[[comments]]
order = 13
subject = "الفيلم الأفضل"
author = "العمـــــــــــــــدة"
text = "أفضل أفلام هذا الموسم على الإطلاق ولمواسم قادمة أخرى فظهرت قمة إبداع احمد حلمي ولم نجد أي نوع من أنواع الابتذال كما هو معتاد ان يشاهد في أفلام البيزنس<br />لقد أثبت أحمد حلمي وتحدى الجميع أنه بإمكانه عمل فيلم درامي خالص مع بعض المواقف الكوميدية العابرة التي لم تؤثر في درامية الفيلم بل أثرته وأضافت عليه جو من الفكاهة في بعض اجزائه<br />أقول وبكل ثقة ........ أحمد حلمي ............ شكرا على الإزعاج"
archived = "2008-08-09"
capture_url = "https://web.archive.org/web/20080809025409/http://masr.20at.com:80/newArticle.php?sid=16827"

[[comments]]
order = 14
subject = "مش مصدقة نفسي"
author = "مريم"
text = "اللي كتبته يا علي حلو وكل حاجة وأحلى مافيه إنه ماحرقش الفيلم لأي حد بيقراه... ودي أكتر حاجة بتكرهني في النقاد والتحليل اللي بيكتبوه عن الفيلم... واللي المفروض إن الواحد يقراه علشان يا يتشجع يدخل الفيلم يا ما يتشجعش ولا يتعب نفسه ويدفع فلوس على الفاضي<br />بحمد ربنا إني مقرتش أي شيء عن الفيلم قبل ما أروح النهاردة.... الفيلم بجد معدي وموضوعك ما أشبعش عندي الرغبة في التعبير عن كل اللي حسيته ناحية الفيلم... أحمد حلمي فعلاً عبقري.. والفيلم فيه قيمة عالية جداً... مش حقدر أقول أي شيء أكتر من كده بس مش خسارة تذكرتين سينما في الفيلم ده علشان لازم يتشاف مرتين."
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819163155/http://masr.20at.com:80/newArticle.php?sid=16827"
