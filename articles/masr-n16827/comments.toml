subject = "كده لازم أروح الفيلم"
author = "أول مرة يعلق"
text = "أنا أول مرة أعلق بس انت اضطرتني يا عم علي ... أسلوب جميل وخلتني لازم أروح الفيلم .. بس لو ماعجبنيش هتدفع ومش اللي انت دفعته في أوديون لأني هروح جلاكسي عارف جلاكسي بكام .."
archived = "2008-07-21"
