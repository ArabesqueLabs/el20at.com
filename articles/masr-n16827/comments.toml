[[comments]]
order = 0
subject = "فيلم اكثر من رائع"
author = "محمود محمد"
text = "الفيلم بجد فوق رائع وبيناقش مشكلة بجد ناس كتير بتبص ليها بإستهزاء وسخرية بينما هي مشكلة حقيقية وبتحصل بحق وحقيقي ، انا شخصيا اعرف شخص مر بالمشكلة دي ، حاجة مؤلمة فوق الوصف بجد ، لكن المشكلة إن الناس اللي داخلين الفيلم عايزين يضحكوا وبس ، علشان كده الناس كانت عمالة تشتم في الفيلم ، وانا اتخنقت اوي لدرجة إني زعقت مع واحد في الفيلم ، انا عمال أدمع وهوا قاعد ورايا عمال يألس ويتمسخر ، بجد فيلم هزني من جوة وفيه جرعة ضحك معقولة برده ، لكن فيلم انساني جدا وخصوصا لو انت عندك إحساس فعلا إن دي قضية حقيقية ومشكلة واقعية جدا وممكن تحصل لناس كتير ، انا احيي احمد حلمي أنه عمل الفيلم ده واحييه إنه اكتشف نفسه وما كررش نفسه تاني ، الف تحية بجد لأحمد حلمي"
archived = "2008-07-19"
capture_url = "https://web.archive.org/web/20080719151432/http://masr.20at.com:80/newArticle.php?sid=16827"

[[comments]]
order = 1
subject = "موضوع جامد مووووووووووووت"
author = "مروة عبد الفضيل"
text = "استاذ على بجد طريقتك النقدية تحفه وهايلة بعد كده بئا هستطلع رأيك في الافلام كلها ومش هحتاج خلاص اراء نقاد زيتنا في دقيقنا وفرت والله يا استاذ علي مكالمات واتصالات"
archived = "2008-07-19"
capture_url = "https://web.archive.org/web/20080719151432/http://masr.20at.com:80/newArticle.php?sid=16827"

