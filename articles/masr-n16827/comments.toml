[[comments]]
order = 10
subject = "عالمى يا حلمى !!"
author = "فؤاد"
text = "احمد حلمى عمل فيلم مينفعش حد يقول عليه فى غلطه<br />ايمن بهجت : نفسى اعرف دماغه بتروح كده ازاى !!<br />خالد مرعى : مخرج عبقرى .<br />محمود حميده : الراجل ده استاذ و طبعا مش محتاجين نقول عليه كده .<br />الفيلم رووووعه و لازم كل الناس تشوفه ."
archived = "2008-08-05"
capture_url = "https://web.archive.org/web/20080805075750/http://masr.20at.com:80/newArticle.php?sid=16827"

