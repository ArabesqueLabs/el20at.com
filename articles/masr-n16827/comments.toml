[[comments]]
order = 4
subject = "تحية للعملاق الجديد احمد حلمى"
author = "محمد مصطفى السيسى"
text = "انا دخلت الفيلم وانبهرت<br />لأ انبهرت دى كلمة يسيطة<br />أحمد حلمى ياجماعة ممثل دراما تراجيدى تقيل قبل ما يكون كوميديان ده حسيته فى مشهد فى فيلم صايع يحر اللى متابع سينما بجد هيفتكر المشهدز<br />تحية كبيرة لحمد حلمى لكتر من سبب:<br />اولا انه اكتشف الطريق اللى كنير خايفين منه وهو اكتشاف الذات<br />ثانيا انه طلع الحمد لله عند تةقعاتى وامنياتى من زمان انه يقدم فيلم رومانسى او تراجيدى بيور والحمد لله أجمد حلمى حققلى أمنيتىز<br />أحمد حلمةى عغلامة مضيئة فى سينما الزمن ده يارب ربنا يكرمه وياخد المكان الصح داما<br />أخيرا انا بطلب منه انه ما يفكرش غير فى حاجة واحده هى انه يعمل السينما اللى عايزها ويجدد ويغلمر بس اهم حاجة يعمل الفيلم صح من غير غلطة وأكيد دايما جمهوره هيفضل وراه وهيكسب جمهور جديد كمان<br />تحية كبير ة ليك من كل جمهورك فى المنصورة بجد الفيلم عاجب الناس هنا اوى"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727020546/http://masr.20at.com:80/newArticle.php?sid=16827"

[[comments]]
order = 5
subject = "فيلم عااااااااالى جدا"
author = "مروه احمد"
text = "اولا احب احيك بجد يا استاذ على الكلام حلو اوى وبجد اسلوب رائع<br />بالنسبة للفيلم بجد انا بشكر احمد حلمى على الفيلم ده بجد فيلم ملهوش حل انا فعلا عيطت كذا مره فى الفيلم بالرغم من انى بعرف امسك نفسى ادام الناس بس المره دى مقدرتش تمثيله بجد فوق الوصف..وفعلا ناس كتير كانت داخله تضحك وبس وعشان كده معجبهومش...هى المشكله الوحيده كانت فى الاعلان انه اثبتلهم اكتر انه كوميدى...بس فى الاخر بجد فيلم عااااااااااااااالى اوى اوى ولازم ادخله تانى ان شاء الله"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727020546/http://masr.20at.com:80/newArticle.php?sid=16827"

[[comments]]
order = 6
subject = "اسف على الازعاج"
author = "آسف على الإزعاج"
text = "اسف على الإزعاج فيلم جامد جدااااااااااااااااااااااااااا<br />شكراً أحمد حلمي<br />أنصح كل الناس تدخل الفيلم.. شكراً أيمن بهجت قمر<br />شكراً خالد مرعي<br />آسف على الإزعاج يا إخوانا"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727020546/http://masr.20at.com:80/newArticle.php?sid=16827"

[[comments]]
order = 7
subject = "اسف على الازعاج"
author = "اسف على الازعاج"
text = "أنا دخلت الفيلم.. وهو على فكرة حلو أوي.. ونفسي أدخله تاني لكن للأسف السينمات غالية أوي.. هاستنى لما يبقى معايا فلوس وهاخشه مرة تانية<br />اسف على الازعاج جامد جدا وعايز أقول إن أحمد جلمي تفوق على نفسه في الفيلم.. وعايز أقوله شكراً على المجهود اللي عملته في الفيلم أنت وكل فريق العمل<br />اسف على الإزعاج هو فيلم الموسم.. وكل عام وأنت بخير يا عم بوشكاش ودبور والبيبي دول وحسن ومرقص.. اسف على الازعاج هو التووووووووووووووووب"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727020546/http://masr.20at.com:80/newArticle.php?sid=16827"

[[comments]]
order = 8
subject = "من حبى فى احمد حلمى نفسى اجوزة"
author = "سهر"
text = "احمد حلمى نجم هايل لة مستقبل انا فى اى فيلم بالفة بافتكرة والفيلم الجديد دة هيضرب وهيكون من الافلام التاريخية انا نفسى اقابلة وامثل معاة لانة بحد ممثل تحفة الفيلم تحفة والناس الهبلة مش عوزين يتفهمو الموقف كويس هوزين يضحكو وخلاص فى البلا الاخرى الناس بتقدر الفن الحقيقى هنا عوزين محمد سعد بلد تحب الكوسة"
archived = "2008-07-27"
capture_url = "https://web.archive.org/web/20080727020546/http://masr.20at.com:80/newArticle.php?sid=16827"

