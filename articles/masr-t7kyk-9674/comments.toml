order = 0
subject = "ناطق الشهادتين لا يصح ان يوصف بالفرعون"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-07-21"
text = "مجرد نصيحة<br />فضيلة الشيخ محمد متولي الشعراوي افتى بان ناطق الشهادتين لا يكفر ابدا ويوم القيامة يستحيل ان يكون ناطق الشهادتين وان ارتكب الكبائر ان يكون كالذي جحد بهما (والكلام للشيخ الشعراوي رحمه الله)<br />وفتوى ثانية للشيخ الشعراوي ايات الكافرين في القران التي نزلت بحق الكافرين لا يجوز وصف ناطقي الشهادتين بها<br />وهذا من الكوارث التي ابتلي بها المسلمين تطبيق ايات القرأن ايات المنافقين وايات الكافرين على انفسهم"
archived = "2010-03-14"
