subject = "عينها منك"
author = "فاعل خير"
posted = "2009-03-19"
text = "والله انا كنت معدي بتفرج علي المواضيع الهبله اللي موجوده هنا دي استفزني الموضوع واستفزني الرد أكثر لأن اكيد الكلام دا اتقال أمام كاتب الموضوع والتي قامت بالتعليق من مخزونهم الفكري لأن الكلام دا مبيتقالش في كل البيوت سوري يعني في البيوت ال..... وأهو ربنا يسهل يا أحمد وتساعدها انها تغور لأن واضح انها عينها منك وبتفهمك بس بالشفرة"
