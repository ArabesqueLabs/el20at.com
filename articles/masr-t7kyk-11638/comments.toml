[[comments]]
order = 3
subject = "الناس خبيتها السبت واحد وأنا خبتي ماوردتش علي حد"
author = "محمد الحنفي"
posted = "2009-03-19"
text = "يا فتاح يا عليم يا رزاق يا كريم اصطبحنا واصطبح الملك لله هو انا هلاقيها منك يا ابني ولا من اخوك ولا من مين بالظبط يا آخر صبري .. طبعا اهالينا محسسين الواحد أنه أدهم صبري يعني تركب الباخرة وتنزل علي ضهر جمل في نص الصحرا وتعوم وتاخد غطسين هناك وتضرب سبعة بأيدك اليمين زي أبو العربي وخماشر بأيدك الشمال وتاخد حبيبتك علي حصان أبيض وتجري بيها وبعدين تاخدوا طيارة تطلعوا علي جزر القمر تقضولكوا سنتين عسل .. لكن هنقول إيه في انهاية برضة امك يعني أول قلب ضمك وحبك واللي سهرت .. كل سنة وكل ام طيبة وربنا يقرب البعيد عن اهله واللي طهقان من امه يروح يجري عليها ويصالحها بس يجيبلها هديه وياكل بعقلها حلاوة أولا علشان متطينش عيشته ويبوس أيديها ولو حكمت يقعد تحت رجليها واللي زعلان من حد ميشيلش منه لأن مفيش حاجه تستاهل وعشان الحب هو اللي بيدوم فحب أمك واصحابك وأهلك وزمايلك وربك قبل كل دول والسلام ختام .. اخوكم محمد"
archived = "2010-03-14"
capture_url = ""
