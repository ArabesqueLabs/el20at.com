[[comments]]
order = 2
subject = "كسر رقبتك على صدرك - دى كلام يا مقصوف الرقبة"
author = "اكتب اسمك هنا"
posted = "2009-03-19"
text = "ايقى تعالى قابلنى فى سوق الجرسة لو نجحت<br />لو فلحت ابقى تعالى شخ على قبرى<br />جاتها خيبة اللى عايزة خلف وتروح للشيخ وتقولة اعمل لى عمل<br />الناس خيبتها السبت وانا خيبتى فيك ملهاش حد"
archived = "2010-03-14"
