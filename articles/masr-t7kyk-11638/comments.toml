text = "جامد موووت الموضوع وافتكاسة حلو اوىىى في برضويا احمد هطين عشتك وابئا قابلنى لو فالحت ده انتى مالكيش لازمه وبلاش تاخير ما بلاش منها الشغلانه دي احسن فضحتينا في المنطقة عايزة تسافري ان شاء الله بس لما تتجوزي وتغوري"
