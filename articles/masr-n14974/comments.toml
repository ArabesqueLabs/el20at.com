text = "وظهرت صورة - طيب واية الفايدة - ما اتكلمتش وقالت حاجة لية - كانت صرخت فى البرية وقالت اى حاجة<br />ساعات لما اتقل قوى واضرب كم حجر حشيش وينتشر الدخان الازرق حواليا<br />اشوف امى اللى ماتت من عشرين سنة بتبطب على وتقولى معلهشى يا زقلمة<br />ويظهر ان الحشيش زمان كان رخيص وبيضربوا حجارة عينى عينك فى الكنيسة وتحدث تهيؤات مش مضبوطة ولما يناموا بيبقى نصهم اللى تحت عريان<br />نظرة يا عدرة"
