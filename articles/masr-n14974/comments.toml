subject = "ضع عنوان التعليق"
text = "سواء ظهرت السيدة مريم أو لم تظهر فلها التقدير و الاحترام في الاسلام حتى ان سورة من القرآن الكريم سميت باسمها وهي رمز العفة لدى الجميع .. وعذرا يا شباب ارجو عدم الدخول في صراعات و كلام فارغ لا معنى له<br />فهؤلاء من وصانا بهم رسول الله صلى الله عليه وسلم و السيدة مريم هي أم المسيح عيسى عليه السلام نبي الله وعبده فرجاءا عدم اهانة الأديان بحجة الدفاع عن دينكم سواء كنتم مسلمين أو مسيحيين"
