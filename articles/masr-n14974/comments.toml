subject = "فوجئ الجميع بصورة للعذراء وسط الصخور وكأنها تبارك هذا المكان"
author = "نظرية الهبل على الجبل"
text = "قصة نقل جبل المقطم(معجزة حقيقية)<br />هذه المعجزة حقيقية 100% ومعروفة لدى الكثير من المصرين وخصوصا دارسى التاريخ تمت على يد القديس \"سمعان الخراز\"<br />بداية أبدأ بقصة القديس \"سمعان الخراز\"<br />انه رجل بسيط احترف مهنة دباغة الجلود خاصة انه كان من أهالي منطقة مصر القديمة.. وكانت هذه المهنة ومازالت منتشرة في هذه المنطقة.. ولم تكن هذه المهنة تقتصر علي دباغة الجلود فقط بل تمتد إلي الصناعات الجلدية ومايترتب عليها مثل صناعة واصلاح الأحذية.. وقد كان معروفا عنه الزهد والبساطة والتدين الشديد.. وتؤكد الوثائق ان سبب فقده عينه اليمني انها وقعت علي ساق إحدي السيدات عندما خلعت حذاءها لاصلاحه.. عندئذ أخذ المخراز الذي بيده وطعن به عينه التي تطاولت ونظرت إلي ساق السيدة.. وتدفق الدم من عينه اليمني وفقد بالتالي بصره جزاء للخطيئة التي ارتكبها.. ومن هذا التاريخ نذر نفسه بأن يقوم بجوار عمله بحمل المياه تبرعا منه وتوصيلها إلي منازل العجزة والمسنين والأرامل كل يوم بدون مقابل<br />قصة نقل الجبل<br />نرجع إلي الوراء.. إلي عشرة قرون مضت وبالتحديد عام 979 أيام الدولة الفاطمية.<br />من الثابت تاريخيا أن مدينة القاهرة كانت إحدي المدن القديمة التي بنيت في العصور المختلفة. فالتاريخ يؤكد لنا بالوثائق أن أولي هذه المدن كانت 'بابليون' أو قصر الشمع وهي الآن مصر القديمة وقد أسسها البيزنطيون.. وثانيها هي مدينة 'أم دنين' وهي الان قلب القاهرة أو علي وجه التحديدمنطقة محطة مصر وما حولها.. وثالث هذه المدن مدينة 'الفسطاط' والتي تقع بالقرب من عين الصيرة وأسسها عمرو بن العاص.. أما رابع هذه المدن فكانت مدينة 'العسكر' التي تقع بين الفسطاط وجبل المقطم وقد أسسها العباسيون.. وخامس هذه المدن كانت مدينة 'القطائع' التي تقع بالقرب من مدينة العسكر وعلي وجه التحديد بجوار جامع ابن طولون وأسسها أحمد بن طولون.. أما آخرها فكانت مدينة 'القاهرة' وهي المنطقة التي تضم الجامع الأزهر وماحوله.. وقد أسسها الفاطميون في عهد المعز لدين الله الفاطمي في عام 969 ميلاديا..<br />وفي كتاب 'سيرة القديس سمعان الخراز' 'الدباغ' يتحدث عن الرواية المتعلقة بالمنارة:<br />من المعروف أن الحاكم المعز لدين الله الفاطمي كان محبا لمجالس الأدب ومولعا بالمناقشات الدينية ولهذا كان يجمع رجال الدين من المسلمين والمسيحيين واليهود للمناقشة في مجلسه شريطة أن يتقبل الجميع مايثار بلا غضب أو انفعال أو خصام..<br />وكان من ضمن أفراد هذا المجلس رجل يهودي اعتنق الإسلام لكي يصبح وزيرا في الدولة هو 'يعقوب بن كلس' ويتردد أنه في إحدي هذه الجلسات التي كانت تضم الجميع.. بطريرك الأقباط في ذلك الوقت الأنبا ابرام السرياني.. والوزير يعقوب بن كلس اليهودي الأصل ومعه زميل له يدعي موسي.. وفي هذه الجلسة حاول اليهوديان أن يوقعا الحاكم مع الأقباط فقالا للحاكم بأننا وجدنا في انجيل النصاري آية تقول 'ان من له إيمان مثل حبة خردل لكنتم تقولون لهذا الجبل انتقل من هنا إلي هناك فينتقل ولا يكون شيئا غير ممكن' وبالتالي فعليك بصفتك الحاكم أن تطلب من البابا البطريرك أن ينقل الجبل الجاثم شرق القاهرة وإن لم يستطع يكون دينهم باطلا ويجب إبادتهم!<br />وقبل أن ينفض المجلس طلب الخليفة المعز من البابا إبرآم السرياني اثبات صحة هذه الآية.. أي اثبات إمكانية نقل جبل المقطم إذا صحت الآية.. وبعد أن صلي البطريرك طلب من الخليفة مهلة ثلاثة أيام حتي يثبت له هذه المعجزة<br />ورجع البابا ليجمع شعبه ويطلب منهم الصوم ثلاثة أيام مع الصلاة المستمرة واعتكف هو ورجال الدين داخل كنيسة العذراء بالمعلقة.. وفجر اليوم الثالث ظهرت السيدة العذراء للبابا أثناء غفوته وأخبرته بأن يخرج إلي الشارع فسيجد رجلا يحمل جرة ماء وبعين واحدة.. إن هذا الرجل ستتم المعجزة علي يديه.. وأسرع البابا إلي الشارع ناحية السوق فوجد فعلا رجلا بهذه الأوصاف فأمسك به وأدخله الكنيسة وأخبره بأن اختير لتقع معجزة نقل جبل المقطم علي يديه.. واضطرب الرجل وأخبر البابا بأنه رجل فقير ويعمل اسكافيا فكيف يقع الاختيار عليه؟!<br />ولكن البابا البطريرك أكد له أن السيدة العذراء ظهرت لتبلغه بهذا الأمر.. ووافق<br />الرجل واشترط أن يتكتم حقيقة أمره طالما هو حي علي الأرض.<br />كان هذا الرجل يدعي سمعان الخراز نسبة إلي مهنته التي كانت موزعة بين دباغة الجلود والاسكافي وهو من يقوم بإصلاح الأحذية.. المهم انه طلب من البابا البطريرك أن يصعد إلي الجبل ومعه رجال الدين حاملين الأناجيل والصلبان والشموع.. وأيضا المجامر مملوءة بالبخور ويقفون في جانب أعلي الجبل وأن يصعد الخليفة وحاشيته ورجال الدولة أعلي الجانب المقابل من الجبل.. وأن يصعد الشعب أيضا ليري ويشاهد الجميع هذه المعجزة التي وعد بها الرب.<br />وفي الموعد المحدد.. أي بعد ثلاثة أيام من الصوم والصلاة خرج الخليفة المعز من داره ممتطيا جواده وخلفه حشد كبير من حاشيته ورجال الدولة متوجها إلي جبل المقطم وهناك وجد في انتظاره البابا ابرام السرياني ومعه رجال الكنيسة والشعب خلفه.. وقف الخليفة ومن معه علي جانب من الجبل.. وعلي الجانب المقابل وقف البابا ابرام ورجال الكنيسة والشعب خلفه.. وكان من ضمن أفراد الشعب سمعان الخراز الذي وقف خلف البابا مباشرة..<br />وبعد أن قام البابا بالصلاة طلب من شعبه أن يرددوا كلمة 'كيريالسيون' وهي كلمة باللغة القبطية معناها يارب ارحم اربعمائة مرة.. بواقع مائة مرة كل جهة من الجهات الأربع شرقا وغربا وشمالا وجنوبا.. وبعدها سجد البابا وشعبه ثلاث مرات.. وعندئذ شعر الجميع بزلزلة غاية في القوة تجتاح الجبل.. وفي كل سجدة يتحرك الجبل.. ومع كل قيام يرتفع الجبل إلي أعلي وتظهر الشمس من تحته ثم يتحرك من مكانه إلي هذا المكان الذي استقر به.. وفزع الخليفة كما فزع الجميع وقال بأعلي صوته 'عظيم هو الله تبارك اسمه' ثم طلب من البابا أن يكف حتي لاتنقلب المدينة.. وما إن هدأت الامور حتي تلفت البابا باحثا عنه سمعان الخراز فاكتشف انه اختفي تماما!..<br />وقد أكدت الوثائق أن الجبل انتقل فعلا من بركة الفيل بالسيدة زينب إلي هذا المكان ليفسح مساحة كبيرة استطاع الخليفة المعز أن يعمرها وتظهر القاهرة الحالية.. وقد عثر علي مخطوطة بدير الانبا انطونيوس تضم اسم المقطم لهذا الجبل فقد سمي بالمقطم أو المقطع أو المقطب لأن سطحه كان متساويا أي متصلا ثم صار بعد المعجزة ثلاث قطع.. واحدة خلف الأخري.. ويفصل بينهم مسافة..<br />ودى قصة بناء كنيسة القديس \"سمعان الخراز\"<br />ونترك قصة حياة سمعان الخراز ونرجع إلي جبل المقطم الذي انتقل ليحتل مكانه الحالي.. ففي عام 1969 صدر قرار من محافظة القاهرة بنقل الزبالين وجامعي القمامة إلي مكان في حضن جبل المقطم ويتبع حي منشأة ناصر.. وتجمع في هذا المكان 15 ألف نسمة هم الزبالون وعائلاتهم.. كان المكان مهجورا.. مجرد منطقة منبسطة وسط مغارات جبل المقطم.. وهناك بنوا مساكن لهم عبارة عن عشش من الصاج.. وكانت المنطقة محرومة تماما من أية خدمات أو مرافق.. عاش هؤلاء حياة وسط ظروف صعبة.. في الفجر ينتشرون لجمع القمامة بواسطة عربات بدائية تجرها حمير وعند الغروب يأوون إلي عششهم التي يسمونها زرائب لقضاء الليل مع الحيوانات التي يربونها مثل الماعز والخراف.. وأيضا الخنازير التي تفضل أن تلتقط طعامها من أكوام الزبالة.. أما السيدات والأطفال فلهم مهمة أخري.. هي فرز القمامة واخراج كل نوع علي حدة.. الزجاج والورق والصفيح وهكذا.. وكل نوع يعاد بيعه إلي مصانع لإعادة تصنيعه من جديد.. وأصبح واضحا أن هذه المهنة تدر أرباحا كبيرة لدرجة أن ظهر بينهم معلمون كبار اسرعوا ببناء مساكن وعمارات شاهقة واختفت العشش الصفيح وظهرت بدلا منها العمارات بالحديد والأسمنت المسلح..<br />ومع مرور الزمن تكاثروا حتي أصبح عددهم 40 ألف نسمة يسكنون في هذه المنطقة وبجوارهم مغارات الجبل خاوية تسكنها الحيوانات المفترسة والضالة..<br />وتشاء العناية الالهية ان ترسل إليهم في عام 1974 شابا تقيا من حي شبرا يدعي فرحات في محاولة فردية منه لدراسة أحوال المنطقة ورغبة شخصية في محاولة ما يحتاجونه من رعاية وخدمات لتوصيل مطالبهم إلي الجهات المسئولة.. وأخذ الشاب يتردد علي المنطقة.. وفي احدي المرات شاهد صخرة تظلل مكانا هادئا يصلح للصلاة.. انبهر من هذا المكان فكان يأوي إليه للصلاة بمفرده وبعد عدة مرات اصطحب معه شخصين آخرين وأصبح الثلاثة يصلون في هذا المكان بصفة مستمرة..<br />وفي أحد الأيام وأثناء قيام الشاب فرحات وصديقيه بالصلاة في هذا المكان هبت عاصفة شديدة وتطايرت أوراق كثيرة من أكوام الزبالة ملأت المنطقة.. وبعد أن هدأت العاصفة لفت نظر الشاب فرحات ورقة استقرت أمامه وتأملها فوجدها ورقة من انجيل سفر أعمال الرسل أي انها ورقة من الانجيل.. واعتبر الشاب أن استقرار هذه الورقة التي تحمل كلاما مقدسا في هذا المكان هو اختيار من الرب ان تقام كنيسة في هذا المكان..<br />وبالجهود المتواضعة تم إنشاء أول كنيسة في هذا المكان سميت باسم القديس سمعان الخراز علي أساس أن هذا القديس تمت علي يديه معجزة نقل جبل المقطم إلي هذا المكان.. وكانت الكنيسة عبارة عن جدران من الصاج أما سقفها فمن البوص.. تماما مثل بقية المساكن قبل أن تتحول إلي قلاع حديثة<br />وتطورت هذه الكنيسة بعد أن ضاقت بالمصلين إلي تحويلها إلي مبني عبارة عن أعمدة من الخرسانة تكسوها في السقف بقماش خيام.. وكان المشرف علي كل هذا نفس الشاب فرحات ويعاونه اثنان آخران وعندما زارها البابا شنودة الثالث اعطاهم مبلغا من المال استطاعوا بعده أن يعهدوا إلي أحد المهندسين الذي وضع تصميما رائعا للكنيسة الكبيرة الآن التي شيدت داخل المغارة الكبيرة وتسع إلي 20 ألف نسمة وداخلها يوجد رفات القديس سمعان الخراز الذي تمت علي يديه معجزة نقل جبل المقطم.. وطبعا رسم البابا شنودة الشاب فرحات إبراهيم قسيسا لهذه الكنيسة باسم القمص سمعان إبراهيم.. وتطوير العمل في هذه المنطقة حتي أصبحت الآن تضم 8 كنائس داخل مغارات الجبل.. كما تضم مستشفي ودار حضانة ووحدة خدمة اجتماعية ومركز تدريب مهني ومدرسة.. وغيرها.. وغيرها.. كلها خدمة لأهل المنطقة دون تمييز بين الدين أو الجنس أو اللغة أو الجنسية.. الجميع يتلقون الخدمة بلا مقابل.. كما زودت هذه المنطقة التي أطلق عليها اسم دير سمعان الخراز أو الدباغ باستراحات وخدمات لزوارها.. ورقي القس سمعان ليصبح قمصا اعترافا له بجهوده في هذه المنطقة..<br />ويبدو ان هذه المنطقة وغرائبها شدت انتباه سائح بولندي جاء لزيارة مصر منذ 5 سنوات فشعر ان عليه رسالة لابد أن يقدمها لهذا المكان.. شعر بحنين غريب للاقامة في هذا المكان.. وفعلا أقام بعض الوقت استطاع خلاله أن ينحت لوحا من الخشب للقديس سمعان الخراز وعندما اعجب به القمص سمعان راعي الكنيسة ورئيس الدير طلب منه أن ينحت تماثيل تحكي سيرة القديسين داخل الصخور لتكون بمثابة معرض يحكي سيره القديسين لزوار هذا المكان الغريب.. ولم يكذب البولندي ماريو خبرا فقد استقر في مصر وأقام داخل هذا الدير وتزوج من مصرية من صعيد مصر وتفرغ لنحت صخورهذا الجبل لتتحول إلي متحف لتماثيل القديسين.<br />والزائر لهذا المكان يستطيع بسهولة أن يجد أيضا صورة للعذراء ظهرت وسط الصخور عندما كانوا ينحتون صخور الجبل لتفريغها كسقف لهيكل الكنيسة.. فوجئ الجميع بصورة للعذراء وسط الصخور وكأنها تبارك هذا المكان"
archived = "2008-04-04"
