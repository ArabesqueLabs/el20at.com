subject = "ماما زمنها جاية .... جاية بعد شوية جايبه لعب وحاجات"
author = "قسيسه"
text = "انا من سكان مصر الجديدة يا جماعة وبالضشبط ميدان الجامع يعني جنب الزتون جدا<br />مرة زمان طلعت هذه الاشعة ان العدراء مريم بتظهر في كنيسة الزتون وكانت الناس يا عيني بتروح من العشاء تفضل واقفة لحد الفجر<br />وترجع وما تلاقيش حاجه<br />فمره وهما واقفين طلع المسيح وقالهم ماما زمنها جاية جاية بعد شوية<br />ها ها ها ها ها<br />وساعات برضه المسيحيين بيطلعوا اشعات انها بتظهر في اسيوط<br />اصل انا كنت زبون دائم في موقع الاقباط متحدون فمرة لقيتهم بيقولوا ان العذرار مريم ظهرت في اسيوط<br />وما المسيح ابن مريم الا رسول وامه صديقه كانا يأكلان الطعام"
archived = "2008-04-04"
capture_url = "https://web.archive.org/web/20080404045916/http://masr.20at.com:80/newArticle.php?sid=14974"

