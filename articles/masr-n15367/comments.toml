[[comments]]
order = 1
subject = "طابونة الحاج ابوجمال وولدة زغلف"
author = "سلعوة"
posted = "2008-04-22"
text = "الطابونة اليومين دول فيها العجن شغال على ودنة<br />ابوك الحاج عمال يفرق زيادات ويعمل اعفاءات وشغال على ودنة سفريات مش طايق القعدة<br />مرة راح على موسكو يناقش الرفيق بوتين فى التعاون فى مجال الفضاء وارسال سفينة فضاء صناعة مشتركة وبالمرة ياخد كم جلسة تدليك مساج فى العضلات المخوخة<br />وسفرية تانية شد الرحال على عاصمة النور باريس علشان يشوف احتياجات فرنسا من الدقيق والقمح والتعاون الوثيق بين رجال الاعمال فى مصر احمد عز وتسهيل اعمالة مع رجال الاعمال الفرنسيين وبالمرة يدخل مستشفى ويعمل شوية فحوصات<br />ومرة تالتة الى السعودية يوشوش فى ودان الامير مش عارف باية مش الامير فاهمة هو الناصح اللى رايح يشرح<br />الدنيا تساهيل<br />والطابونة مش لا قية دقيق<br />والعيال لمخابيل عايزين يعملوا اضراب<br />وقنابل الدخان صنع اسرائيل بتنباع باليورو واهى سفرية وتتدبر"
archived = "2008-04-24"
capture_url = "https://web.archive.org/web/20080424011636/http://masr.20at.com:80/newArticle.php?sid=15367"
