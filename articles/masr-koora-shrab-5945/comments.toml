subject = "الاهلى لن يسمح بذلك"
author = "محمد ممتاز - بيبو"
posted = "2007-05-28"
text = "توالى على مر السنوات الماضية مدربين للنادى الزمالك و الاسماعيلى بداية من الالفية الجديدة الا وقتنا هذا و لكننا لم نرى من هم احمق او ذى ذكاء محدود مثل اتوفيستر المدير الفنى السابق للنادى الزمالك الذى رحل بفضيحة مدوية من طراز جوزيه سام 6 بعد هزيمته امام نادى القرن الاهلى القاهرى المصرى بسداسية و كلنا نعرف مدى التصريحات النارية البلهاء الذى اطلقها هذا الرجل عام 2001 بعد ان هزم الاهلى 2-1 بعد عودة الاهلى ظافرا من توسن بعد ان قضى على احلام الترجى التونسى بالتعادل معه ف استاد المنزه 1-1 وقتها فأجانا اتوفيستر بتصريح غريب من نوعه قائلا بانه يستطيع هزيمة الاهلى بعد ان يستيقظ من نومه و لكن جوزيه اطاح به فى الدور الثانى بفضيحة و ها هو خرج الينا باتريك نوفو المدير الفنى الفرنسى للنادى الاسماعيلى دراويش الكرة المصرية و الذى قاد منتخب غينيا ( بقيادة الاخوة بانجورا ) فى كان 2006 الماضية و التى احرزت لقبها مصر بتصريح غريب قبل مبارة الاهلى قائلا بانه سيكتسح الاهلى برباعية نظيفة و يعيده الى القاهرة بالدموع و ليس بالدرع و سيكرر انجاز الدور الاول عندما هزم الدروايش الاهلى فى ملحمة بطلها الاول الحكم الاماراتى على فريد الكاره جدا جدا للنادى الاهلى و اضاف ان الاهلى فريق عادى و لكنه يملك مدرب جيد ."
