subject = "كرسى هزاز ودستور هزاز"
author = "ايمن امام"
posted = "2007-03-27"
text = "السلام عليكم= كرسى هزاز ودستور هزاز كله أزاز ينيم المواطن بره مرتاح وعندنا كل اربعه على كرسى بالمقلوب طبعا - المشكله فى التصميم لايصلح للمصريين لانه مالوش رجول للقعاد ماانا قلت لكم كل اربعه على كرسى - وبمناسبه الدستور العظيم - اقترح توزيع كرسى لكل اربعه مواطنين وياعينى على الديمقراطيه المستديره الخشبيه لما تدخل فى جسد المواطن تشعره بألالام ومعاناه الناس لما تشبع ديمقراطيه وتشرب ديمقراطيه وتلبس ديمقراطيه القرأن والانجيل والتوراه قابله للمناقشه والتفسير على حسب هوى الاله ابن رع المنوفيه- وخادمه هامان اطول هامان فى تاريخ مصر المعاصر- اما الدستور - فهو كالقماش الكستور تلبسه صيفا وشتاء تلبسه ليلا ونهار - تلبسه نائما ومستيقظا المهم تفضل لابسه-ايمن امام"
