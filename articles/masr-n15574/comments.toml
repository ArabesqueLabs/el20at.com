text = "ممتاز يا ولد يا ممتاز لقد عبرت عن المشاعر الصادقة لكل منافق للسلطة أما باقى المصريين فيحسدونك على هذاالقدر العظيم من النفاق الفج.<br />يا رجل لقد سمعت بعض كلماتك يتفوه بها بعض المتدينين وهو يخاطب بها ربه خصوصا عندما تقول (لمن غيرك نشكو؟! من مين غيرك نطلب) سامحك الله."
