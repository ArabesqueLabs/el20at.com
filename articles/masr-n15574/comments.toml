[[comments]]
order = 9
subject = "أشج الخلجات يابشررررررررر"
author = "محمد السيد"
posted = "2008-05-06"
text = "أيووووووووووووووووة يا جدعان ..<br />إيه ده هو في حد بيوصل للدرجة دي؟ انا مش مصدق الكلام يمكن اول مرة اكمل حاجة من النوع ده بتاعة عيد الميلاد لآخرها. معرفتش والله اسيبها في النص ...<br />أيييييييييييييييييييييييوه ياعالم ...<br />لمن غيرك نشكو؟! من مين غيرك نطلب!! لمن غيرك نروي احلامنا وآمالنا في مستقبل نملك فيه القدرة علي ان نحقق طموحاتنا،<br />ليه ياسيدي .. أقول ايه بس؟<br />وفي كل حاجة.. بره وجوه.<br />بنحبك.. لأنك مابتعملش حاجة إلا بعد ماتحسبها صح.. ويكون قرارك في الصميم..<br />أشِتم يعني ولا أعمل ايه؟؟<br />012 ولا 010 ولا 011 ولا أرضي<br />ياعالم حد يقول له اننا في سنة 2008 .. الحاجات دي فضيحة مش انجاز ..<br />طول عمرك سباق بالخير..<br />يخرب بيت كده ياشيخ ... تعالي لي يا أمه<br />إحنا نسينا أيام زمان.. إحنا ادلعنا ياريس في عهدك<br />لا بقي ... ده كتير كتيييييييييييييير<br />الله يجازيكم يا عشرينات .. هي ناقصاكم يعني<br />لا للتنكيد ... لا للتزويق ... نعم لشيل البنى آدمين اللي تشل دي<br />mohamedmat@hotmail.com"
archived = "2008-05-13"
capture_url = "https://web.archive.org/web/20080513091904/http://masr.20at.com:80/newArticle.php?sid=15574"

