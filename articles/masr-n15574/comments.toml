[[comments]]
order = 5
subject = "لن أُنافق"
author = "أحمد مطر"
posted = "2008-05-05"
text = "وَنَافِقْ<br />ثمَّ نَافِقْ ، ثمَّ نَافِقْ<br />لا يَسْلَمُ الجَسَدُ النَّحِيلُ مِنَ الأَذَى<br />إنْ لَمْ تُنَافِقْ<br />نَافِقْ<br />فَمَاذَا في النِّفَاقِ<br />إذَا كَذَبْتَ وَأَنْتَ صَادِقْ؟<br />نَافِقْ<br />فَإنَّ الجَهْلَ أَنْ تَهْوِي<br />لِيَرْقَى فَوْقَ جُثَّتِكَ الْمُنَافِقْ<br />لَكَ مَبْدَأٌ ؟ لا تَبْتَئِسْ<br />كُنْ ثَابِتَاً<br />لَكِنْ .. بِمُخْتَلَفِ الْمَنَاطِقْ<br />وَاسْبِقْ سِوَاكَ بِكُلِّ سَابِقَةٍ<br />فَإنَّ الحُكْمَ مَحْجُوزٌ<br />لأَرْبَابِ السَّوَابِقْ<br />õõõ<br />هَذِي مَقَالَةُ خَائِفٍ<br />مُتَمَلِّقٍ ، مُتَسَلِّقٍ<br />وَمَقَالَتِي : أَنَا لَنْ أُنَافِقْ<br />حَتَّى وَلَوْ وَضَعُوا بِكَفَيَّ<br />الْمَغَارِبَ وَالْمَشَارِقْ<br />يَا دَافِنِينَ رُؤُوسَكُمْ مِثْلَ النَّعَامِ<br />تَنَعَّمُوا<br />وَتَنَقَّلُوا بَيْنَ الْمَبَادِئِ كَالْلَقَالِقْ<br />وَدَعُوا الْبُطُولَةَ لِي أَنَا<br />حَيْثُ البُطُولةُ بَاطِلٌ<br />وَالحَقُّ زَاهِقْ !<br />هَذَا أَنَا<br />أُجْرِي مَعَ الْمَوْتِ السِّبَاقَ<br />وَإنَّنِي أَدْرِي بِأَنَّ الْمَوْتَ سَابِقْ<br />لَكِنَّمَا سَيَظَلُّ رَأْسِي عَالِيَاً أَبَدَاً<br />وَحَسْبِي أَنَّنِي في الخَفْضِ شَاهِقْ !<br />فَإذَا انْتَهَى الشَّوْطُ الأَخِيرُ<br />وَصَفَّقَ الجَمْعُ الْمُنَافِقْ<br />سَيَظَلُّ نَعْلِي عَالِيَاً<br />فَوْقَ الرُّؤُوسِ<br />إذَا عَلاَ رَأْسِي عَلَى عُقَدِ الْمَشَانِقْ !"
archived = "2008-05-13"
capture_url = "https://web.archive.org/web/20080513091904/http://masr.20at.com:80/newArticle.php?sid=15574"

