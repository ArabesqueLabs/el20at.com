[[comments]]
order = 7
subject = "لا أعلم قط أكثر إمتيازا منه"
author = "ابو عمر"
posted = "2008-05-05"
text = "أتحفنا رئيس تحرير جريدة قومية كبرى بمناسبة عيد ميلاد الرئيس بمقالة من العيار الثقيل والتي لا يأتي بمثلها إلا رئيس تحرير جريدة قومية كبرى.وبإمكان القارئ أن يقف عند كل كلمة في هذا المقال (الجامد أوي) بلغة هذا الزمان. ولكن ما شد إنتباهي و أثار إعجابي فقرة النسيان وفقدان الذاكرة والتي يقول فيها \" نسينا القطارات ماركة اللي يحب النبي يزق!! نسينا زمن كل حاجة بالبطاقة من قطن العرايس لحد قماش التيل والبفتة والدبلان.. نسينا زمن المجاري اللي طافحة وطلمبات الميه البحاري ووضع النواية جوه الزير.. نسينا ياريس زمن زوار الفجر وزوار الصبح والظهر والعشا.. نسينا اللهو الخفي ونسينا نشوف النجوم في عز الظهر. \"<br />فعلا القطارات زمان كانت تحتاج زق أما الان فهناك القطار أبو جزرة و قطار الصعيد المحترق والقطار الذي يخرج من طريقه و يدخل البيوت.<br />فعلا زمان كانت كل حاجة بالبطاقة و كنت تحصل عليها بعد مجهود شديد أما الان فأغلبية الشعب الفقير لا يستطيع شراء أبسط الإحتياجات من الخبز و الفول.<br />فعلا كانت المجاري طافحة أغلب الوقت ولكن كانت هناك شبكة مجاري أما الان فكل العشوائيات لا توجد بها شبكة مجاري من الأصل ولا عزاء للصحة العامة و النظافة.<br />فعلا كان هناك زوار فجر ولكن كانت لهم أوقات محددة أما الان فالمواطن المصرى معرض لبطش السلطة طوال ساعات اليوم و كان التعذيب فى المعتقلات أما الان فالتعذيب والمعاناة في كل قسم شرطة أو حتى أي كمين مرور.<br />وقد ختم المقال الجبار بانه مش طماع و لا يريد الكثير من الرئيس ولكن يبدوا أن بيننا بعض الطماعين فنرجوا من الله فى العام القادم أن نكون قد شفينا من حالة النسيان و فقدان الذاكرة .<br />و أخيرا كل سنة و الريس وقطه طيبين."
archived = "2008-05-13"
capture_url = "https://web.archive.org/web/20080513091904/http://masr.20at.com:80/newArticle.php?sid=15574"

