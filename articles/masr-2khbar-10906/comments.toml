subject = "فقدنا الرمز البطل فى بلدنا - فنبحث عن الرمز البطل"
author = "مفيش"
posted = "2009-01-08"
text = "فى سن معينة يبحث الانسان عن القدوة البطل<br />مثلا<br />كان فريد شوقى فى السينما البطل الرمز الذى يضرب العصابات ويبهدلهم ويفرق الاشرار زى توفيق الدقن ومحمود المليجى<br />ودلوقتى مفيش<br />كان عبد الناصر البطل السياسى الذى يدغدغ احلام الجميع<br />كان الفريق الشاذلى رئيس الاركان البطل<br />كان ابو العز مدكور بطل الطيران بعد النكسة<br />وعبد المنعم رياض البطل<br />دلوقتى كلهم هاموش<br />يبقى ندور على بطل من برة<br />بطل مستورد<br />بطل لم نستطع صناعتة محليا"
archived = "2010-03-14"
