subject = "مبروك قانون المرور الجديد"
posted = "2009-02-15"
text = "موت الناس دى بسبب الفساد<br />فساد ضباط المرور - لانهم<br />بياخدوا فلوس علشان يرخصوا سيارات بدون فرامل او عجل سليم<br />بياخدوا فلوس علشان يطلعوا رخص قيادة سيارات لناس لا تعرف قيادة السيارات وبيدفعوا فلوس<br />نزيف دم الناس الغلابة دى على الاسفلت بيقول ان عندنا جهاز شرطة مرور فاسد<br />قانون المرور مش هيصلح المرور<br />صلحوا شرطة المرور اولا"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218023546/http://masr.20at.com:80/newArticle.php?sid=19975"
