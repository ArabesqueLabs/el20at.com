subject = "و انا كمان"
author = "نيفين نيفى نوفا"
posted = "2008-02-04"
text = "طيب انا بقى يا جماعه فرحى ان شاء الله يوم 102<br />و برده خايفه جدا محدش ييجىلان ان شاء الله مصر هتكون بتلعب النهائى<br />و علشان كده كتبت ف كروت الدعوه الاتى:ملحوظه:ف حاله وجود مصر ف النهائى و ده اكيد شوفو الماتش و بعدين تعالو و يرجى اصطحاب الاعلام المصريه علشان نحتفل كلنا<br />واصحابنااكدولنا انا و حبيبى انهم جايين بس بجد مش هقدر ازعل من اى حد هيتاخر لان بصراحه لولا ان فرحنا كنت لا انا و لا هو ممكن حاجه تعطلنا عن الماتش<br />و عزاؤنا الوحيد اننا نشوف الاعاده و امرنا لله<br />بس بصراحه فكره انى اعرض الماتش ف القاعه مجتش على بالى خالص<br />تعرفو و الله فكره مجنونه و هبدا افكر فيها"
