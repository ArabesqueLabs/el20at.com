text = "لم نسأل يوما شبابنا لماذا يرودون هجرة ومناقشة معهم ؟ فلابد هناك سباب جعلها فكرة تسيطر عليهم و بما اني مغربية ساجوب انا علي هدا سؤال. اني في مغرب لما تعيطي فرصة شغل لشبابنا تسبق اصحاب معرفة او اصحاب طبقة برجوازية<br />اما طبقة متوسطة عليها انتطر فرصة اخر فلماذا لايفكر في هجرة وكرهي وطنهي بما ان هناك دولة اخر ممكن ان تجعله يعيش بكرمتهي وحقوقيهي انا شخصيا الوم الدولة اكثر ا الوم شبابنا وتاكد لو اعطيت فرصة لشبابنا سوف يحدثون معجزات و يحون فكرة هجرة من دماغهم."
