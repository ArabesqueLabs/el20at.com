subject = "مفجر ثورة المجارى"
author = "المصرى أفندى"
posted = "2008-11-06"
text = "أحنا فعلا فى زمن فى منتهى الغرابة لما يقف اللى أفسدوا كل شىء فى البلد يتكلموا عن الأنجازات وعن الرخاء اللى الشعب عايش فيه.يمكن يكونوا بيتكلموا عن شعب ثانى أو بلد تانية غير مصر. لا والأنيل بقى هو مفجر ثورة التصحيح والتطوير. بس مفيش حد فسر لنا تصحيح أيه وتطوير أيه بالضبط.عصابة ورئيسها ضيعوا الماضى والحاضر وعايزين يجيبوا ننوس عين أهله علشان يضيع أى أمل فى المستقبل. يارب أمتى حنشوف نهاية هذا النفق المظلم بقى....."
