subject = "فكر جديد عليهم وقديم ومصدى بالنسبة للشعب"
author = "سباك صحى"
posted = "2008-11-06"
text = "كلام فارغ من محتواة اللحن بتاع مصر بتتقدم بينا مصر بتتقدم بينا بجد لوكان الشخص المناسب فى المكان المناسب وكل واحد من مكانة ومن موقعة بيشتغل وفق منظومة واحدة وهدف واحد اللى هو ازاى نستغل الامكانيات الموجودة لخدمة مصر @ انما جمال وشلة السياسات يجيبوا فكرة جديدة والشريف صفوت والحرس القديم الذى اصيبوا بالتخمة من كتر الهبش وبقى وجودهم شكلى لخدمة وحماية وتشريع وتوريث البلد لجمال مبارك داة طبعا بعد الاطمئنان انة مصالحهم وحقوقهم من السرقة حتبقى حق محفوظ ليهم ولولادهم حتى لو اعتزلوا السياسة او ماتوا والاعمار بيد اللة"
