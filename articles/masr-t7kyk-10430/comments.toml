posted = "2008-11-08"
text = "انا موظف حكومة مرتبى 900 جنية قدرت بفضل اصحاب الفكر الجديد انة ممتلكاتى تتجاوز 90 مليون جنية فى ظرف 5 سنين $$$$$$$ يعنى ياتاس مفيش حد موافق على الحكومة دى والتوريث اللى ابتدت خطواتة تجرى بسرعة مذهلة لدرجة انة بقينا مش عارفين مين الريس ومين اللى بيحكم * سيبك من انة مبارك يطلع فى التلفزيون فى استقبال رئيس اوملك زائر لمصر ! ولا حفلة افتتاح مشروع وهمى اوفاشل مقدما وطبعا منقول مباشر على التلفزيون وهو بيدوس على الزر مش عارف انا هو بيطلب شاى اومشاريب للى معاة ولا عاوزهم يطفوا النور علشان عاوز ينام شوى قبل مايروح للمدام"
