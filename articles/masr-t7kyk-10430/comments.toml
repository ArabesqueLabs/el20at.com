text = "فليحذر محدودى الدخل من السير فى الشوارع فان الثمار سوف تتساقط فوق راسة ويمكن تعورة - اصلها ثمار كتير قوى مثل ثمار الكوسة والبطاطا والقرع البلدى<br />ونحن نحسد الجميع على حصولهم من تلك الثمار بامارة ما كل واحد عندة يخت وحساب فى البنك وعربية دفع رباعى 4[4<br />واكثر اللة من تلك الثمار"
