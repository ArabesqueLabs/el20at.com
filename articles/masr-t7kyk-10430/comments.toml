subject = "خمسة وخميسة من كل عين تحسدك تنطس طوالى"
author = "ابو وائل"
posted = "2008-11-05"
text = "اثناء خطاب مبارك<br />وقف عضو مجلس الشعب من البحيرة وقاطع خطاب السيد الرئيس وهتف<br />خمسة وخميسة من كل عين تحسدك - تنطس طوالى<br />وتبسمت<br />اللة على الفكر الجديد<br />خايفين على الرئيس ابو 80 سنة من الحسد<br />اللة<br />فكر رائع<br />ملخص الفكر الجديد<br />كما شرحة السيد جمال الابن<br />ان الدولة مش هتعمل حاجة ولا ليها دعوة باى حاجة وانها بتدعم رجال الاعمال بس والقطاع الخاص<br />يعنى المسكين يتحط راسة فى الطين<br />والكبير خايفين علية من الحسد"
