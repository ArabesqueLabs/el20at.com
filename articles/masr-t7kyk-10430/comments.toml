text = "اللى بيسكت عن قول الحق حيبقى شيطان اخرس يعنى انتو بسكوتكم وتايدكم للى بيحصل فى البلد من ضياع حقوق وانتهاك حرية وادمية الناس ونهب البلد بما فيها بلا حسيب اورقيب تحت مسميات متعددة وهدف واحد اللى هو الامعان فى الضرر والاساءة للجيل الحالى والاجيال القادمة \\\" الااذا كان زى مانسمع انة انتوا اكبر المستفيدين من بقاء الوضع زى ماهو وعلى المتضرر ان يغور فى ستين داهية ومش عاوزين شوشرة علشان نعرف نشتغل ونامن نفسينا لحسن الراجل الكبير بعافية حبتين ويمكن يزول فى القريب العاجل ان شاء اللة"
