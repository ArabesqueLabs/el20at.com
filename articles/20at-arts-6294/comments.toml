[[comments]]
order = 1
subject = "اجمل اذاعه"
author = "nasa"
posted = "2007-06-16"
text = "يا عيني علي اذعه القران الكريم المصريه اجمل اذاعه والله العظيم وخاصه برنامج قطوف من حدائق الايمان الساعه 12 منتصف الليل كل يوم بس اظن انها انشئت 1964 بالضبط وكان اول برامجها مع الاعلامي الامع الله يرحمه احمد فراج وكان هو سبب اكتشاف الشيخ الشعراوي كمفسر للديار المصريه وبدات الخطوات الجميله واجمل شيء في اذاعه القران الكريم انها تتبع الازهر ومعتدله الاراء وسبحان الله الاذاعه الوحيده اللي عليها الاجماع من السلفيين والاخوان وحتي اشد التيارات واميعها هي اذاعه القران الكريم المصريه كفايه بس صوت عبد الباسط عبد الصمد فيها صح ولا ايه"
archived = "2010-03-14"
capture_url = ""

