[[comments]]
order = 5
subject = "حياة اذاعة اسلامية فريدة من نوعها"
author = "بيبو"
posted = "2007-06-21"
text = "فعلا يا جماعة تجربة حياة اف ام الاردنية رائعة<br />بجد اذاعة اسلامية فيها (دين واجتماع ورياضة واقتصاد) بتلاقي فيها حياتك كلها<br />وعايز اقول للشباب المعتزين باذاعة القران الكريم انها ان اذاعات القران على مستوي العالم العربي كلها اذاعات دينية متخصصة<br />لكن حياة اف ام هى اذاعة اسلامية تطبق قول الله عز وجل\" قل ان صلاتي ونسكى ومحياي ومماتي لله رب العالمين\"<br />اتمنى لها دوام التقدم كما اتمنى ان اري غيرها قريبا في بلداننا العربية"
archived = "2010-03-14"
capture_url = ""

