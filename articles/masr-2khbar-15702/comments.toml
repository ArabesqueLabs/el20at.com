text = "يا كايدهم يا غايظهم يا شيخ طنطاوي<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مبروك يا شيخ طنطاوي جاءك النصر من الله سبحانه وتعالى<br />انتصرت على الرؤوس الجهاله بتوع قناة الرحمة والناس<br />شوية عيال وهابية متغاظين منك علشان خاطر انت عالم دين واستاذ جامعة تعالوا نشوف العيال الوهابية<br />ــــــــــــــــــــــــــــــــــــــــــــــــــ<br />محمد حسان ـ خريج اعلام<br />محمد حسين يعقوب ـ دبلوم معلمين 5 سنين بعد الاعدادية<br />ابو اسحاق الحويني ـ خريج كلية الالسن ترجمة لغة اسباني<br />ـــــــــــــــــــــــــــــــ<br />دول التلاته الكبار العتاوله فما بالك بقية الصيع<br />ـــــــــــــــــــــــــــــــــــــــــــ<br />يعيش الازهر وعلماء الازهر<br />تسقط الوهابية والاخوانية<br />ــــــــــــــــــــــــــــــــــــ<br />يعيش الازهر وعلماء الازهر<br />يعيش الازهر وعلماء الازهر<br />الشيخ الشعراوي الشيخ احمد عمر هاشم<br />علماء اجلاء صحيح"
