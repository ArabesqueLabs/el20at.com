subject = "الخبز ثم الخبز"
author = "فلاح مصرى"
posted = "2007-09-27"
text = "هل يمكن ان تكتفى مصر ذاتيا بالقمح - يعنى خبزنا يكون من انتاجنا - نعم بسهولة شديدة جدا جدا جدا وذلك اذاكانت الدولة عايزة كدة<br />انما استيراد القمح من الخارج يسيطر علية لربعة عناتيل كبار ويكسبون الملايين من تجارتهم ويكدسونها فى بنوك اروبا<br />كيف ننتج قمحنا بايدينا ؟<br />القمح نبتة عشبية عمرها ثلاث شهور تحتاج الى مرتين فقط للرى خلال تلك الشهور الثلاثة<br />تروى فى حياتها مرتين فقط<br />وعندنا ارض من غرب اسكندرية وحتى مرسى مطروح صحراء صالحة لانبات عشبة القمح وهذا الساحل الشمالى تسقط علية الامطار طوال فصل الشتاء<br />يعنى ببساطة مطلوب بذر البذور وهى هتطلع لوحدها ومش محتاجة اى رعاية وفى ايام الحصاد نروح نحصد القمح<br />يعنى الزراعة على ماء المطر<br />وهذا بيتم فى سوريا اللى بنستورد منها قمح وليس عندهم نهر النيل وبيعتمدوا على زراعة المطر<br />مطلوب القاء بذور القمح فى الصحراء بالطائرات ثم تنبت عند نزول المطر وبعد 3 شهور نجهز الحصادات ونحصد القمح<br />والجيش المصرى البطل لة تجارب فى ذلك ونجحت والسيد الرئيس زارها واشاد بنجاحها<br />والبدو بتوع مرسى مطروح بيعملوها كل سنة والقمح العشب اللى بينبت بالمطر بيأكلوة للمعيز والجمال بتاعتهم<br />مش عايزين ننتج قمحنا لية<br />لية نخلى رغيف الخبز يتحكم فية الاجنبى<br />ويل لامة لا تاكل مما تزرع ولا تلبس مما تنتج<br />يابلدى يا مصر<br />اليس فيكى راجل رشيد"
