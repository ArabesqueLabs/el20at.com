subject = "ارشح الدكتور"
author = "سعد ابو حسين"
posted = "2007-11-11"
text = "ارشح السيد زعيط ابو معيط ونطاط الحيط اللى توزيع جريدتة صفر ليبقى ناضورجى الحكومة فى النقابة وكذلك بصاص الامن على زملائة<br />هذا وابشركم هذة المرة بانتخاب مجلس زى ما حصل فى اتحاد الطلبة فى جامعة عين شمس هيدخل البلطجية يوم الانتخاب ويضربوهم حتة علقة ويقولوا عليهم بتوع الاخوان<br />وينجح زعيط الامناوى<br />ولا عزاء لنقابة الصحفيين<br />وابقوا روحوا عمر مكرم"
archived = "2010-03-14"
