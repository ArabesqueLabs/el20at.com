subject = "بالتوفيق لهاني مكاوي"
author = "صحفي"
posted = "2007-11-11"
text = "اسمحوا لى أن أعرب عن تأييدي للزميل هاني المكاوى (من جريدة الأحرار) مرشحا تحت سن 15 سنة ، فهو مثال للصحفى النزيه الذي لم يستغل 10 سنوات هى مدة عمله فى وزارة التعليم .. فى المنفعة الشخصية كما اعتاد بعض الصحفيين المندوبون لدي مؤسسات ووزارة خدمية .. للأسف الشديد<br />بكل توفيق يا مكاوى"
archived = "2010-03-14"
