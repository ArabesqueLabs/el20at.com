[[comments]]
order = 14
subject = "انا حعرض الامر على عميد كلية اعلام القاهرة"
author = "مش رضوى حسن ولا مروى صلاح"
text = "بصراحة القضية دي انا اللي فجرتها<br />وحعرص الامر على عميد اعلام القاهرة الا وهي ان نقابة الصحافيين تقتصر على خريجي كليات الصحافة والاعلام<br />بس ما تخافوش المشروع دا حيبقى للعضويات الجيدة بس<br />اما القدام خلاص حيفضلوا زي ما هما<br />واعود واكرر ان الاعلام دا تخصص وتخصص صعب جدا لا يقل عن المحاماه بأي حال من الاحوال<br />وتعالوا نشوف في امريكا اليهود مسيطرين على الاعلام<br />علشان الاعلام بيسيطر على الناس وبيوجه الناس وبينجح الرئيس اللي هما عايزينه<br />يعني مثلا شوفوا هما عايزين اوباما يكسب في الانتخابات<br />بسبب الاعلام اوباما كل الناس بتتكلم عنه بعكس المرشح الثاني ما حدش يعرف عنه اي حاجه الا قليل جدا<br />وكل دا بفضل الاعلام<br />واخيرا في كل الدول العربية والاسلامية اعلامنا فاشل فاشل فاشل لعدم التخصص"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927231024/http://masr.20at.com:80/newArticle.php?sid=17693"

[[comments]]
order = 15
subject = "الزبيبة المفاجئة"
author = "مش ححبك"
text = "الفقرة اللي بعد عنوان الزبيبة المفاجئة ما يكتبهاش الا واحد شيوعي<br />لان انت بتتهم المسلمين والمصلين باتهامات مش صحيحة<br />الكلام دا انا قرأته قبل كده في مواقع الاقباط نفس الكلام دا بالضبط وكأنه منقول<br />يا احمد عبدالحميد وهذا الكلام انا قلتهولك في موضوع الازهر والازهريين<br />غلط كده على مستقبلك يا احمد عبدالحميد<br />حتعمل لنفسه سمعة مش كويسه"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927231024/http://masr.20at.com:80/newArticle.php?sid=17693"

[[comments]]
order = 16
subject = "رد على الأخ الأمور بتع الصحافة والإعلام"
author = "مناهج كليات الصحافة والاعلام بيدرسوها ليه امام طالما اي كلية ممكن تأضي الغرض"
text = "مناهج كلية الصحافة والاعلام<br />قسم الاعلام<br />الفصل الاول<br />مدخل الى فن الاعلام<br />مدخل الى الاعلام والاتصال (1)<br />نظريات الاعلام (1)<br />علم النفس العام<br />اللغة العربية (1) *<br />الحاسبات (1)<br />الفصل الثاني<br />جمهور وسائل الاتصال<br />مدخل الى الاعلام والاتصال (2)<br />الاتصال والاعلام في المجتمعات المعاصرة<br />اللغة العربية (1) *<br />الحاسبات (1)<br />الصف الثاني<br />الفصل الاول<br />الراي العام (1)<br />اعداد البرامج الاذاعية والتلفزيونية<br />علم النفس الاعلامي<br />مناهج البحث الاعلامي<br />اللغة الانكليزية (1)<br />الفصل الثاني<br />تقنيات اعلاميه (2)<br />الراي العام (2)<br />تشريعات اعلاميه<br />اللغة الانكليزية (2)<br />الصف الثالث<br />الفصل الاول<br />العلاقات العامة<br />الاعلام والانترنيت<br />شبكات فضائيه<br />نصوص انكليزية<br />الفصل الثاني<br />الاعلام والتنمية<br />الدعاية والاعلان<br />مقدمة في التحرير الصحفي<br />الصف الرابع<br />الفصل الاول<br />الاعلام البيئي(1)<br />الحرب النفسية (1)<br />الاعلام الدولي (1)<br />ادارة المؤسسات الاعلامية<br />علم الاجتماع الاعلامي<br />بحث تخرج (1)<br />حقوق الانسان<br />الفصل الثاني<br />اقتصاديات الاعلام<br />الحرب النفسية (2)<br />الاعلام الدولي (2)<br />الاعلام والعولمة<br />بحث تخرج (2)<br />الاعلام البيئي(2)<br />قسم الاعلام<br />الماجستير ( تحضيريه )<br />الفصل الاول<br />الاعلام والعولمة<br />الاعلام والمجتمع(1)<br />التخطيط الاعلامي(1)<br />الاعلام والديمقراطية (1)<br />الماجستير ( تحضيريه )<br />الفصل الثاني<br />القيادات الاعلامية<br />الاعلام والمجتمع (2)<br />التخطيط الاعلامي (2)<br />الاعلام والديمقراطية (2)<br />قسم الصحافه<br />الصف الاول<br />الفصل الاول<br />الراي العام (1)<br />مدخل الى الاعلام والاتصال (1)<br />مقدمه في التحرير الصحفي (1)<br />مقدمة في العلاقات العامة<br />اللغة العربية (1) *<br />الحاسبات (1)<br />الفصل الثاني<br />رقم المقرر<br />الراي العام (2)<br />مدخل الى الاعلام والاتصال (2)<br />مقدمه في التحرير الصحفي (2)<br />جمهور وسائل الاتصال<br />اللغة العربية (2) *<br />الحاسبات (2)<br />الصف الثاني<br />الفصل الاول<br />تحرير الاخبار (1)<br />فن الاعلان (1)<br />صحافه الكترونيه (1)<br />الصحافة والنظم السياسية<br />وكالات الانباء<br />اللغة الانكليزية (1)<br />الفصل الثاني<br />تحرير الاخبار (2)<br />فن الاعلان (2)<br />صحافه الكترونيه (2)<br />تشريعات اعلاميه<br />منهج البحث الاعلامي<br />اللغة الانكليزية (2)<br />الصف الثالث<br />الفصل الاول<br />ساعات المقرر<br />نصوص انكليزية<br />تحرير المقال الصحفي<br />الصحافة العربية والعالمية المعاصرة<br />تكنولوجيا صناعة الصحف<br />الفصل الثاني<br />التوثيق الاعلامي<br />الاخراج الصحفي<br />الحضارات القديمة<br />علم النفس العام<br />الصف الرابع<br />الفصل الاول<br />اللغة والصحافة (1)<br />التحقيق الصحفي (1)<br />الاخراج الطباعي (1)<br />ادارة المؤسسات الصحفية<br />الاعلام الدولي<br />بحث تخرج<br />حقوق الانسان<br />الفصل الثاني<br />اللغة والصحافة (2)<br />التحقيق الصحفي (2)<br />الاخراج الطباعي (2)<br />كتابة البرامج الاذاعية<br />بحث تخرج<br />الماجستير ( تحضيريه )<br />الفصل الاول<br />تقنيات اعلاميه(1)<br />العلاقات العامة (1)<br />الصحافة والانترنيت(1)<br />القيادات الاعلاميه<br />الماجستير ( تحضيريه )<br />الفصل الثاني<br />تقنيات اعلاميه (2)<br />العلاقات العامة (2)<br />الصحافة والانترنيت (2)<br />الاعلام والعولمه"
