[[comments]]
order = 7
subject = "كلام جميل ولكن"
author = "أحمد زهران"
text = "بارك الله فيك أخي أحمد ، كلامك واقعي وجميل، وأنت تعبر عن كثير من مشكلات البلد ولكن ليس أهمها<br />اسمح لي سيدي أن أقول لك إن أزمتنا أزمة قيم وأخلاق ودين مبعد عن الحياة أو مهمش<br />وأننا لو وجهنل دعاءنا لصلاح من ذكرت كان فيه الكفاية والغنى.. أنا أتفق معك أن من ذكرت هم أس البلاء ورؤوس الشياطين، ولكن ماذا يغنينا يا أخي إن ماتوا على ذلك ودخلوا النار، وقد علمنا رسول الله صلى الله عليه وسلم حينما قال بعد أن نطق يهودي على فراش الموت بالشهادتين - قال: الحمد لله الذي أنقذ بي نفسًا من النار<br />نحن نريد يا أخي أن يُنقذ الله بنا أنفسًا من النار، بدلاً من نُدخلهم بدعائنا عليهم النار<br />إننا نشفق - أخي أحمد - أن يكون هذا مصير الناس، ونسأل الله صباح مساء أن يعافينا مما ابتلى به غيرنا، وأن يتقبل منا أعمالنا.<br />أريد أن أذكرك أخي أحمد أن القلوب بين أصبعين من أصابع الرحمن - كما قال النبي صلى الله عليه وسلم - وأن الرجل يصبح مؤمنًا ويمسي كافرًا ويمسي مؤمنًا ويصبح كافرًا، فنسأل الله أن يثبتنا على الإيمان.<br />وأدعوك أخي أحمد ألا تحكم على بواطن الناس وسرائرهم فلنا الظاهر والله تعالى يتولى السرائر ، وقد قال النبي إذا رأيتم الرجل يعتاد المساجد فاشهدوا له بالإيمان<br />وعسى أخي أن ينتقل الذين يتصنعون إلى مرتبة المخلصين وما ذلك على الله بعزيز.<br />أنا أنكر معك الظواهر السلبية التي تكون في الدعاء من تكلف السجع من الإمام ومن علو الصوت بالبكاء والنحيب من المصلين ، ولكن ليس كلهم يتصنع فما أدرانا أخي الحبيب فربما تذكر المذنب ذنبه، ولامس الذكر والدعاء والقرآن قلبه في هذه اللحظة فجأر إلى الله بالدعاء<br />أنا أدعو لكل من ذكرت أن يهديهم الله إلى صراطه المستقيم وأن يبعد عنهم أصدقاء السوء<br />وأطلب منك أخي ألا تنسني بدعوة صالحة في هذه الليالي المباركة<br />بوركت وبورك قلمك وفكرك<br />أخوك/ أحمد"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927231024/http://masr.20at.com:80/newArticle.php?sid=17693"

