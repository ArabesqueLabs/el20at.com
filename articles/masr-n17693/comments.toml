text = "وانا سوف ادعو ان يخلصنا الله من الحزب الوطنى<br />وان يهدى الله الاخوان ويتركوا استعلاءهم على باقى التيارات الاسلامية والوطنية وان يتركوا الفخر الجماعى<br />وان يتركوا الاغترار بالعدد والاعتقاد بانهم وحدهم الذين يفهمون شمولية الاسلام"
