[[comments]]
order = 0
subject = "ازيك يا احمد عبدالحميد"
author = "مش كاتب"
text = "يا اخ احمد عبدالحميد حضرتك في مقال سابق قلت انك خريج جامعة الازهر من احدى الكليات العملية<br />ممكن نعرف اسم الكلية ايه ولا هية ما لهاش اسم<br />ضروري تقولنا اسمها ايه<br />وبعدين الموضوع دا موضوع انشا مدفوع الاجر يعني جالك تليفون وقالولك عايزينك تكتب في موضوع تتريق فيه على اللي بيحصل في المساجد في العشرة الاواخر وحندفعلك مبلغ كويس<br />سلام"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927231024/http://masr.20at.com:80/newArticle.php?sid=17693"

[[comments]]
order = 1
subject = "ربنا يهدينا جميعا الى ما يحب ويرضى"
author = "محمد السعداوى"
text = "طبعا اسلوب السخرية من كل شئ مش علاج للمشاكل مشكلة الصحفيين واخص بالذكر الاخوة بتوع جريدة الدستور انهم فاكرين نفسهم مفتحين ومدقدقين و فاهمين كل حاجة والشعب لسه بيرضع من البزازة .<br />وفى ظاهرة غريبة جدا فى الصحفيين بتوع اليومين دول الواحد فيهم فاكر نفسه الكامل المنزه عن النقص والعيب يعنى اغلبهم تلاقيه داخل الجامع مش بنيه العبادة الله واعلم بالنوايا بس من اسلوبه فى الكلام تحس بكده فعلا يدخل الجامع من اجل تصيد الاخطاء لا اكثر اللى محدش ينكر طبعا انها موجوده جوه الجامع وخارجه وبعد ما يحصل على الصيد الثمين يبدأ يحلل وينظر ويبين لنا قد ايه الموضوع صعب عليه وانه ياولداه تحمل مشقه عظيمة وبعد كده يخرج لنا باقتراحات بناءة من عينه اننا عيشين فى الدروشة وناسين رغيف العيش وكذا وكذا مثقف بقى يا جماعة"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927231024/http://masr.20at.com:80/newArticle.php?sid=17693"

[[comments]]
order = 2
subject = "ما لنا ندعوا فلا يستجاب لنا ؟"
author = "ابو هديل"
text = "مر الزاهد العابد ابراهيم ابن اسحاق بسوق البصرة فا اجتمع الية الناس وقالوا لة يا ابا اسحاق - ما لنا ندعوا اللة فلا يستجاب لنا ؟<br />قال : لان قلوبكم ماتت بعشرة اشياء هى<br />اولا :عرفتم اللة تعالى فلم تؤدوا حقة<br />ثانيا : زعمتم انكم تحبون الرسول صلى اللة علية وسلم وتركتم سنتة<br />ثالثا : قرأتم القرأن ولم تعملوا بة<br />رابعا: اكلتم نعمة اللة تعالى ولم تؤدوا شكرها<br />خامسا : قلتم ان الشيطان عدوكم ووافقتموة<br />سادسا :قلتم ان الجنة حق ولم تعملوا لها<br />سابعا : قلتم ان النارحق ولم تهربوا منها<br />ثامنا : قلتم ان الموت حق ولم تستعدوا لة<br />تاسعا : اذا انتبهتم من النوم اشتغلتم بعيوب الناس ونسيتم عيوبكم"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927231024/http://masr.20at.com:80/newArticle.php?sid=17693"

