[[comments]]
order = 9
subject = "يارب... يا رب... يا رب... يارب"
author = "داعي"
text = "ويارب تقتصر مهنة الصحافة على خريجي كليات الصحافة والاعلام يا رب والصحافة تبقى مهنة تخصصية كده زي المحامين والمهندسين والدكاترة واللي يشتغل صحفي وما يكنش خريج كلية الصحافة والاعلام يقبضوا عليه ويحبسوه يا رب زي اللي بينتحل وظيفة محامي وطبيب يا رب<br />ويارب كل واحد يشوف نفسه خريج كلية ايه ويروح يشتغل زي ما الكلية اخدها بتوجه<br />يعني اللي خريج كلية عملية من جامعة الازهر يروح يشوفله شغلانه بعيد عن الصحافة يا رب"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927231024/http://masr.20at.com:80/newArticle.php?sid=17693"

[[comments]]
order = 10
subject = "خريجي كليات الصحافة والإعلام"
author = "الأخ الأمور بتع الصحافة والإعلام"
text = "يعني يا عم الأمور هي جت علي موضوع الكتابة والصحافة والإعلام وقولت نخخصها ونأممها للناس خريجي الصحافة والإعلام<br />خطابك زي خطاب الأزهرية اللي نايمين في الدرة وعمالين يقولوا إزاي واحد عمرو خالد يشتغل في الدعوة ليه هو كان خريج كلية أصول ، أكل من عربية الفول اللي ورا جامع الأزهر زينا ، اتبهدل في القطر زي أهالينا ، حفظ شعر قديم تراثي مش فاهمين منه حاجة مكفرين بيه الناس اللي بتسمعنا ، وهو مالي نجاح لأخر الدنيا<br />طيب تعمل ايه مع أكثرية الصحفيين اللي شغالين في الصحافة وهم خريجي كليات غير الصحافة والإعلام<br />تعمل ايه مع عملاق الصحافة المصرية الريس هيكل خريج القسم الأوروبي بالجامعة الأمريكية ،مرسي عطا الله خريج الزراعة ، باتريك بورت دافول ولا كلير شازال، عمرهم ما التحقوا بمقاعد الدراسة في الجامعات و الكليات.وفهمي هويدي خريج أداب تاريخ ، وعباس العقاد حاصل علي الإبتدائية ، إحسان عبد القدوس خريج حقوق ، وائل الإبراشي خريج كلية تجارة المنصورة ، عبد الله الطحاوي اللي بيكتب في عشرينات خريج علوم كيميا الأزهر ماذا تفعل في كل الأدباء الأطباء ( يوسف إدريس- نجيب الكيلاني - -ابراهيم ناجي- علاء الأسواني - محمد المخزنجي ووووو)<br />انت مين يا عم انت"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927231024/http://masr.20at.com:80/newArticle.php?sid=17693"

