subject = "غزة تحت امراة القتلة"
author = "ابومحمد"
posted = "2008-05-29"
text = "حركة الانقلاب الحزيرانى الاسود منيت بخسائر فادحة فى كافة جامعات الضفة بعد الانقلاب الدموى وبعد ان كشف اللثام عن وجوه اللئام الذين خانوا الشعب والقضية ونكثوا بالعهد والاتفاق فى اقدس بقعة واطهر ارض فى مكةالمكرمة ..كذلك فقد عاقب الشعب الاردنى الاخوان المتاسلمين فى الانتخابات التشريعية الاخيرة وهذا ايضا ما حصل فى انتخابات مجلس الامة الكويتى حيث انتقم منهم الشعب الكويتى لانه كشفت حقيقتهم التى تلهث خلف الكرسى والجاه المستترة بعبائة الدين"
