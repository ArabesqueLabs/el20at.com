[[comments]]
order = 4
subject = "مع كااااااااااااااااااامل احترامى"
author = "نيفين نيفى نوفا"
posted = "2007-06-17"
text = "الى الاستاذ او الاستاذه صاحب او صاحبه التعليق السابق<br />مع تحفظى على اسلوب الكلام اعتقد انى من حقى انى ابدى اعجابى بكاتب اة كاتبه الموضوع و متهيالى ان ده شلىء متعارف عليه ف التعليقات و لا انت و لا انتى جداد ف الموقع و لو قدام ف الموقع يبقى صحى النوم<br />ثانيا انا من المعجبين باسلوب مروه لانها فعلا فى تقدم مستمر<br />ثالثا -و هو الاهم-اعتقد انى علقت على الموضوع لما قلت (موضوع بسيط يعبر ببساطه عن حياه انسانه بسيطه و و لكن يحوى العديد من المعانى بين السطور )<br />و اذا كان التعليق مش عاجب حضرتك فمن ابسط قواعد الاحترام انك متحجرش او متحجريش على راى حد<br />مع خااااااااااااااااااااااااااالص تحياتى"
archived = "2010-03-14"
capture_url = ""
