text = "واضح ان البنات ف عشرينات بدات تتفوق<br />الموضوع رائع يا مروه من اول اختيار العنوان الى اخر برجراف و الجمع بين المراتان<br />موضوع بسيط يعبر ببساطه عن حياه انسانه بسيطه و و لكن يحوى العديد من المعانى بين السطور"
