[[comments]]
order = 8
subject = "هل نحن رجال ؟"
author = "احمد ابوفرحة"
posted = "2008-07-02"
text = "السلام على المؤمنين<br />الحقيقة ان ازمة الشعوب المسلمة بشكل عام ليست في بعدها عن الدين , كلا و الله , بل الازمة ازمة رجولة.<br />فحين يرى ( الرجل ) اهل بيته يتابعون مسلسلا هادما للاخلاق و يرى اهل بيته مفتونين ببطل هذا المسلسل او ذاك , و لا يحاول ان يمنع ذلك لضعف او لهوى , فهذه احدى الكوارث الاجتماعية للشعب المسلم , و مما يزيد الطين بلة ان يتابع معهم منبع الفتنة و الفساد , فحين اذ يمكننا قراءة السلام على مجتمعنا المسلم , و بعد ذلك يبين لنا في اوضح صوره اسباب تأخر النصر من عند الله علينا .<br />في الواقع , ليست هذه اول مرة يظهر بها مسلسلات من ذاك النوع , بل في الحقيقة ان كل ما يجلبه لنا التلفاز من مسلسلات و برامج و اغاني و ما الى ذلك القبيل من نفس الصنف الهادم , و لكن تتفاوت الفتنة من هنا الى هناك.<br />و في اخر التعليق اؤكد ان كل ( رجل ) يسمح لنفسه و لأهل بيته بمتابعة المسلسلات الهابطة و الهادمة للاخلاق ليس برجل , و ان ظهرت معالم الرجولة عليه , و يكون ديوثا لا ينظر الله له يوم القيامة , اضف الى ذلك تفاهته الصاخبة و انحطاط تفكيره و عدم غيرته , وان كان يعد نفسه من المسلمين , فانه احد اسباب تأخر النصر.<br />واني هنا لأتساءل بألم بالغ : هل فعلا قد وصلت احوالنا الى هذا الامر ؟ هل فعلا قبل ( رجالنا ) ان تفتن زوجاتهم امام اعينهم و لا يحركون ساكنا ؟ هل فعلا قد نجح الغرب الى هذا الحد بهتك عوراتنا و افساد افكارنا ؟ هل نحن مهزومون الى درجة اننا فقدنا غريزة من الغرائز الاساسية التي وضعها الله لنا الا وهي الغيرة؟ والله لو احضرت كبشا الى زريبة كبش اخر لما كان الا وقد قضى احدهما على الاخر , هذه حال الحيوانات , و بعضنا قد دنا عن منزلة الحيوانات .<br />حسبي الله و نعم الوكيل ......حسبي الله و نعم الوكيل..........ولا حول ولا قوة الا بالله"
archived = "2010-03-14"
capture_url = ""
