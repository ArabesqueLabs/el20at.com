subject = "شكوى إلى إدارة الموقع !"
author = "كسلاوي"
posted = "2008-06-09"
text = "إلى إدارة الموقع :<br />السلام عليكم ورحمة الله تعالى وبركاته ، اعلموا يرحمني ويرحمكم الله ، أن الله تعالى قال في كتابه الكريم : { قل للمؤمنين يغضوا من أبصارهم ويحفظوا فروجهم ذلك أزكى لهم إن الله خبير بما يصنعون } . ولهذا ، أدعوكم بدعوة الله أن تمتثلوا لأوامر الله عز وجل وأن تزيلوا صورة الموضوع ، وإلا فلنا موقف يوم القيامة !"
