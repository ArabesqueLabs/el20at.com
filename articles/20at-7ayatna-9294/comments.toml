subject = "ما بينفع الحكي هاد"
author = "راني مسلم"
posted = "2008-06-19"
text = "ليه صار المسلسل ساقط على اي اساس حكمتو عليه انه ساقط والله العظيم في قيم اكثر من القيم الموجودة في المسلسلات العربية مع احترامي للجميع اللي بيقول عليه ساقط ما بيفهم<br />في نوعين من المتابعين للمسلسل<br />1- متابعة بسبب الابطال يعني كل واحد بيحب يشوف بطله المسلسل وكل واحدة بتحب تشوف بطل المسلسل طيب شو ذنبه بطل او بطلة المسلسل انه حلو<br />2- متابعة بسبب القصة ووقائعها والقصة تستحق فعلا متابعتها<br />لذا ارجو من السفهاء عدم التعليق بما هو غير مفيد"
