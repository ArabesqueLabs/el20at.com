[[comments]]
order = 3
subject = "الأم المثالية"
author = "Samirium"
posted = "2008-03-24"
text = "يا جماعة انا بدون تردد وتفكير بقول ان الأستاذة لمياء لازم تاخد جائزة الأم المثالية وده يمكن قليل عليها كمان وانا مش هتكلم عليها بس ولكن كمان والدهم اللى رد الرد الجميل ده لازم ياخد تحية كبيرة لأنه برده ده اثبت انه مش بعيد عن الموقف وهوة كمان ليه دور كبير ولو كان حتى بمؤازرته لزوجته واولاده بالكلام الجميل \"بارك الله لكما فى ابنائكم\" يارب فى الجنة مجتمعين ان شاء الله"
archived = "2010-03-14"
