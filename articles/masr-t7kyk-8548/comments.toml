[[comments]]
order = 0
subject = "وعندى ابتلاء من اللة تعالى مثلك ايتها الاخت الصابر"
author = "مبتلى من اللة"
posted = "2008-03-22"
text = "ذلك ابتلاء من اللة يجازى علية على قدر الصبر<br />وهؤلاء الاطفال رزقهم من اللة واسع جدا<br />بل يا اختى الصابرة نحن نرزق بسببهم<br />ولدى المعاق ذهنيا وهو فى الثالثة من عمرة كان يسمع الاذان فى التلفزيون فيترك طعامة ان كان يأكل او لعبتة ان كان يأكل ويقف متسمرا امام التلفزيون فى سكون حتى ينتهى الاذان فينشغل بعدها فى امورة<br />اؤلئك خلق اللة يرعاهم برحمتة<br />جزاك اللة خيرا<br />وثوابك فى الاخرة عظيم"
archived = "2010-03-14"
