[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-03-23"
text = "لزوجتى لمياء ، و ولدى عمرو و إبنتى نشوى: أحبائى صبرتم على كل ما فى الدنيا من خير و شر فأحبكم الله ، و أحبكم كل من تتعاملون معه من خلقه، ثبتكم الله و أثابكم كل الخير فى الآخرة بإذن الله كما وعدنا الله."
