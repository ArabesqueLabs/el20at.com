[[comments]]
order = 1
subject = "اتتم سبب المصيبة"
author = "محمد عبدالكريم"
posted = "2008-09-25"
text = "في حقيقة المر أثرتم شجوني بما أظهرتموه في عنوان رئيسي<br />انتم وامثالكم من وسائل الإعلام هما اللي بيعملوا كده الشباب بيقلد اللي بيشوفوه ويقرأه<br />حسبي الله ونعم الوكيل في اللي بيحصل ومنكم لله يااعلاميين<br />اتقوا الله فينا"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233526/http://masr.20at.com:80/newArticle.php?sid=17725"

[[comments]]
order = 2
subject = "وقاحة وكلام سافل لا يجب ان ينشر"
author = "عبد الشكور"
posted = "2008-09-26"
text = "اذا كانت هذة اخلاق وكلام الشوارع لمعلقى الرياضة والرياضيون<br />يبقى فية اسباب للانحدار الرياضى اللى وصلنا الية فى دورة بكين<br />لما الدولة تصرف على البعثة 80 مليون جنية مصرى اقامة فى فنادق واكل وتذاكر طيارات وبدلات ويرجعوا لنا بحتة ميدالية برونزية يبقى دة مسخرة وانهيار خلقى<br />الرياضة اخلاق اولا<br />انما الالفاظ السوقية دى بتبين الوضع المهين للاعلام الرياضى اللى بيقراة بنات وسيدات واطفال ولا مانع من ان تنادى ام طفلها فيرد عليها بهذا اللفظ القبيح<br />A7A<br />ساعتها هترد علية بشخرة"
archived = "2008-09-27"
capture_url = "https://web.archive.org/web/20080927233526/http://masr.20at.com:80/newArticle.php?sid=17725"

