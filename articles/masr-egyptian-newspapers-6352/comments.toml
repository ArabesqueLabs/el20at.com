order = 1
subject = "اللهم انصر رئيس جمهوريتنا"
author = "ابو اسامة"
posted = "2007-06-19"
text = "هو الاخ ده مش بتاع اللهم انصر رئيس جمهوريتنا بينه مسطول ما الحرب خلصت يبقى هينصرو على مين<br />على الشعب الغلبان هو كده ديما يفوق بعد الحكاية ما تخلص ولا جايز اتعدى من الاخوة الى بيناموا فى مجلس الشعب"
archived = "2010-03-14"
