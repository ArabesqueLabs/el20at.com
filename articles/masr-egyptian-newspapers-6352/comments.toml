subject = "أرزاق"
author = "جمال محمود معتوق"
posted = "2007-06-19"
text = "يأخ حسن دى أرزاق اذا كان ألدكتور هاشم عضوا أو غير عضو فى مجلسهم هذا لايهم ألمهم ألمهم أن ألأذان واحد لا أثنين فهو ألأذاننننننننن ألشرعى كما كان بلاللللللللللللل أما ألدكتور هاشم فهو راجل محترم ,اذا كان له مصلحة ما فدع ألخلق للخالق"
