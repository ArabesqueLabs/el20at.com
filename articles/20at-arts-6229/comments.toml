text = "السلام عليكم بداية معرض الكتاب الي كان في القاهرة وانا بسمع ان في كتاب اسمو تاكسي للكاتب خالد الخميسي واستنيت لما المعرض اتفتح في اسكندرية واول كتاب جبتو هو تاكسي وقريت لغاية دلوقتي تلت تربع الكتاب الكتاب بيلخص حياة المجتمع المصري بمشاكله وقد ايه ان في ناس وطبقة احنا عمرنا ما فكرنا فيهم ولا فكرنا انهم احيانا كتييييير بيبقى عندهم خبرة في الحياة احسن من اي خبير وعندهم ثقافة جامدة جدا واتعلمت درس قاسي جدااااااااا اني مستهونش باقل الناس حتى لو كان سواق التاكسي لأنهم بشر زيننا يمكن يكونو مرتاحين أكتر من اللي عندهم فلوس كتاب قيم جداااااا لكن بعاتب على الاستاذ خالد ان نقل حياة سائق حاجة جميلة بس ياريت تحفظت على الألفاظ اللي اتقالت لأنها تخدش الحياء بطريقة اني اتكسفت اقول لحد اقرا الكتاب ،بس بحييك جدااااااااا على الجراة انك تعرض المواضيع اللي اتكلموا فيها والخاصة احيانا بالنظام الحاكم واحيانا بالنظام الاقتصادي وغيرو ولكن بخلاف الالفاظ فالكتاب يحتسب في تاريخ الأدب المصري ..."
