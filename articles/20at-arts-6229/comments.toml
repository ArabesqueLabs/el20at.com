subject = "اسرار القاهرة التي نعرفها"
author = "ابو محمد"
posted = "2007-06-11"
text = "أسرار القاهرة التي نعرفها جميعًا<br />هيثم الحاج علي<br />تاكسي خالد الخميسي<br />ربما يكون أبرز ما في هذا النص (الكتاب) أنه يصعب على التصنيف الأدبي، فلا يمكن الادعاء بأنه رواية أو مجموعة قصصية، أو حتى مجموعة مقالات، لكن الحقيقة أن أهم ما يميزه هو شدة تماسه مع نبض الشارع المصري، عبر الدخول مباشرة إلى مناطقه التعبيرية الأشد حساسية وشفافية في آن واحد.<br />يتكون كتاب \"تاكسي – حواديت المشاوير\" من ثمان وخمسين فقرة منفصلة ومعنونة بالأرقام المسلسلة، وتدور هذه الفقرات كلها حول موضوع شكلي واحد هو رصد المؤلف -لا نسميه الراوي- لمجموعة من الحوارات التي دارت بينه وسائقي سيارات الأجرة (التاكسي) في الفترة من إبريل 2005 إلى مارس 2006، وهي الحوارات التي تعبر بوضوح عن توجهات الشارع المصري تجاه العديد من القضايا السياسية والاجتماعية، ويتمحور معظمها حول قضايا لها علاقة بالحالة الاقتصادية للطبقة الوسطى التي أنتجت معظم السائقين، الأمر الذي يمكن رده إلى اهتمام فنون السرد –منذ بدء ظهورها- بالمهمشين في المجتمع وبالتعبير عنهم، غير أن الشخصيات المهمشة هنا لم تقف عند هذا الحد الذي يتم فيه التعبير عنها بوصفها شخصيات رئيسية أو هدفًا من أهداف النص، ذلك أنها لم تكن مجرد نماذج إنسانية مختلقة، بل هي شخصيات حقيقية تم رصدها وانتزاعها من سياقها الاجتماعي لكي تتجاور بعضها مع البعض لتكون بانوراما للمجتمع في حراكه وتطور رؤاه.<br />تعدد الشخصيات والموضوعات<br />يقر المؤلف -منذ البداية– أن الشخصيات القائمة بالحوارات داخل الكتاب هي شخصيات متنوعة بتنوع شرائح المجتمع بين من لم ينل أي قسط من التعليم ومن يدرس للحصول على درجة الماجستير، منهم المتشائم جدًا، ومن لم يتخل عن الأمل، منهم من يحب عبد الناصر، أو يتشيع للسادات، أو يؤيد مبارك، منهم المتدين -مسلم أو مسيحي- ومنهم من يرى في عمله مهربًا والشيء المنطقي الوحيد في عالم عبثي، منهم الشاب الذي لم يتعد الحادية والعشرين، ومنهم الذي تعدى السبعين من عمره.<br />إن هذا التنوع الشديد في نوعيات الشخصيات لم يكن فقط بغرض عرض هذه النماذج، بل تعدى ذلك إلى هذا الشكل المتنوع في عرض الموضوعات التي تمثل بانوراما واهتمامات المجتمع المصري بداية من مافيا الدروس الخصوصية إلى التعديلات الدستورية، ومن غلاء الأسعار إلى غزو العراق، ومن تجبر رجال الشرطة المصرية على سائقي التاكسي إلى علاقات سائقي التاكسي بمن حولهم من شرائح اجتماعية أخرى.<br />هذه الخريطة المتنوعة من الموضوعات التي تمت معالجتها بحياد واضح هو الذي مثل أهم ما في هذا النص من مكونات اقتربت به كثيرًا من حيز الأدب على الرغم من اعتراف كاتبه بحقيقة الوقائع، التي كثيرًا ما تنتهي بمفارقة يبتسم القارئ لها أو يسخر حتى من مجرد احتمالية حدوثها، لكنها أسرار هذا المجتمع التي صار سائقو التاكس أهم من يتأملونها بوصفهم يجلسون داخل حدود عالمهم/ سياراتهم، محتمين بزجاجها من الشارع متأملين على الدوام الحركة الدائبة فيه، كما قال أحدهم في أحد الحوارات.<br />حياد الراوي<br />يبدو العنصر الأشد جاذبية في هذا الكتاب هو التأكيد ليس على إمكانية الحدوث -كما في الأدب- ولكن على الحدوث الفعلي بالصورة التي تجعل القارئ يقر بأن في الحقيقة ما هو أروع وأبدع وأكثر خيالا من الخيال، وهو العنصر الذي يبدو تألقه في رصد الراوي/المؤلف للأحداث دون تدخل واضح في مجراها فالكاتب -المؤلف- لم يتعد دوره أن يكون مفجرًا للحوار، بسؤال يهتم له ويحس بحدسه الصحفي أن هذا السائق أو ذاك ربما يكون له رأي فيه، ويكون هذا في الغالب مدخلا لأن يحكي السائق حكاية له حول الموضوع، وأحيانًا تكون بداية الحوار انفعالا واضحًا يبدو على وجه السائق، مثلما في الفقرة المعنونة برقم (2) تلك التي يبدو على السائق فيها الضيق الشديد، بالدرجة التي تدفع المؤلف لسؤاله عن السبب فيبدأ في حكاية قصته مع رجل الشرطة الذي استغله في توصيلة طويلة ولم يدفع له أي أجر، بل استغل عمله في الشرطة لكي يأخذ منه مالا بدلا من أن يدفع له أجره.<br />وهو الأمر الذي يسمح للمتلقي بأن يدخل مباشرة إلى لب الحكمة الشعبية دون الحاجة إلى ذلك الوسيط المسمى بالسارد، حيث نجد كثيرًا مقترحات اقتصادية وأحيانًا سياسية تفوق في حكمتها كثيرًا من التحليلات الأكاديمية، لتعبر عن رؤية ثاقبة نتيجة لمعايشة حقيقية لحركة الشارع بوصفه المرآة الأنقى لما يحدث في المجتمع، ويتجلى شكل السارد المحايد أو عدسة الكاميرا بوصفه ناقلا بلا محاولات لتجميل الوقائع أو ترتيبها أو محاولة إسباغ خطاب عليها إلا فيما ندر، وهو الأمر الذي سوغ الانفلات اللفظي –في بعض الأحيان– ذلك الذي تبرره أمانة النقل التي أخذها على عاتقه، حتى لو كان المنقول خارجًا عن نسق قيم المجتمع، لكنه معبر عنه بوضوح، وهو السبب المنطقي لذلك الشكل المحايد.<br />ولعل العمل الصحافي –بما فيه من قيم أمانة النقل– هو ما برر فكرة عدم الاختيار أو عدم الترتيب كذلك.<br />ومن هنا يبدو ذلك الشكل الذي اختاره المؤلف للراوي واحدًا من أهم عوامل خروج النص على هذا الشكل –عشوائي الظاهر نافذ العمق إلى الباطن– كي يكون وسيلته لمناقشة دواخل المجتمع، وهو الأمر الذي يقترب من دور بطولة يلعبه النص، أو قل هي جسارة إفشاء أسرار المجتمع، تلك الأسرار التي نعرفها جميعًا ونتداولها ولا نعتبر ذلك إفشاء لها بقدر ما يكون تدوينها خروجًا على اتفاق سري مبرم بعد إثباتها مكتوبة.<br />تدخل الراوي<br />خالد الخميسي<br />إذا كان الشكل الذي تحدثنا عنه ينتج عن نقل أمين بلا تدخل، فإن بعض المظاهر الأدبية الناجمة عن تدخل الراوي قد تسللت إلى النص، على الأقل في صورة بعض التقنيات الأدبية التي تخرج في الأساس من وجهة نظر مؤلف يعي؛ لكونه مثقفًا واعيًا يتحمل عبء كشف جوانب الأزمة المجتمعية.<br />ولعل من الممكن النظر بهذه الوجهة إلى عدد من آليات الكتابة التي ظهرت في النصوص، والتي يبدو من أهمها إعادة الصياغة والتأليف، حيث تبدو بعض النصوص أقرب إلى القصص القصيرة التي تدخلت يد الراوي في أحداثها ولغتها لتصبح صالحة للنشر علي القراء، ومنها مثلا حكاية الابنة –ابنة المؤلف- التي ركبت التاكسي للمرة الأولى في حياتها فسألها السائق عن اللغة التي تسمع بها أفلام الجنس، وهو الأمر الذي انتهى بالمؤلف -فى مشهد يقترب من دائرة لغة الشعر- لأن يقف فى مطبخه يسن خنجرًا ليعطيه لابنته تواجه به المجتمع، في إشارة إلى قصة يابانية قصها من قبل؛ إن هذه الإعادة لصياغة الحدث ليخرج فى صورة إشارات رمزية هو ما يمكن الادعاء بكونه خروجًا على أمانة النقل لصالح تحميل النص وجهة نظر للمؤلف يعبر هو عنها؛ ويشكلها فى صورة لغة مختلفة عما حدث فعلا؛ وهو الأمر الذى يتضح –أيضا– فى ترجمة عدد من الحوادث التى قام بها السائقون وتحويلها إلى الفصحى الميسرة؛ وهو ما لا يمكن تخيل حدوثه؛ الأمر الذى يجعل من اللغة عنصرًا ذا كفاءة عالية فى الوصول إلى كون المؤلف متحولا –أحيانا – من كونه مجرد ناقل إلى متحكم في سير واتجاهات النص.<br />وهو ما تدعمه تقنية العنوان الجانبي التي استخدمها أكثر من مرة؛ خاصة إذا نظرنا إلى العنوان بوصفه أداة تنظيم للمعلومات داخل النص؛ كي تكون وجهة نظر خاصة؛ وهي –كلها– أمور توجه النظر في الغالب إلى قضية إشكالية النوع في هذه النصوص بين كونها كتابة صحافية تعتمد على نقل الخبر وتكوين وجهة نظر عن طريقه، وكونها كتابة أدبية –قصصية– تعبر عن وجهة نظر خاصة للمؤلف عن العالم الذى يطرحه، وهي الإشكالية التي تبدو هي الأشد خطرًا في مثل هذه النوعية.<br />فبين الكشف الذي يأخذه النص على عاتقه وبين وجهة النظر الإخبارية والتاريخية وحتى الجمالية تقع هذه النصوص على الحد الفاصل بين الكتابة الصحافية والكتابية القصصية بمعناها الأدبي، وهو الأمر الذى يردنا مرة أخرى إلى الهدف النهائي الذى يخرج عن كونه مجرد تسلية أو إزجاء لوقت الفراغ. إلى كونه محاولة سبر أغوار صورة ظاهرة لمجتمع يبدو متحركا متماسكا في الظاهر؛ لكنه ينطوي على عدد من المفارقات لا يمكن إحصاؤها.<br />كتابة الأزمة ومواجهتها<br />إن هذه المفارقات توضح إذن أن الكتابة بما هي شرف تنطوي على أهمية مواجهة الأزمة التي يواجهها المجتمع، وهي الأزمة التي أعطت مشروعية الوجود لفن القصة القصيرة، وأيًا كان النوع الذي خرج عليه مثل هذا النص فإن مواجهة الأزمة المجتمعية والتاريخية بدت هي الهدف الحقيقي منه؛ حيث تبدأ مواجهة الأزمة من كشف جوانبها؛ وهو الأمر الذى استطاع المؤلف الدخول إلى عالمه الخفي من خلاله، حين احتك بهذا العدد الهائل المتنوع من الشخصيات التي تعبر كل منها عن شريحة أو اهتمام ما، ووسط هذا العدد يقف المؤلف ساردًا وحيدًا؛ لا يتغير على مدار النصوص جميعها، وإن تغيرت مواقفه وشخصياته، وكذا انفعلاته وحالاته المزاجية بين الهدوء والعصبية، بين التأمل والسير في تيار العبور السريع؛ لكنه وسط ذلك كله لم يتخل عن انطلاقه من إحساسه الواعي بوجود أزمة ما يجب التعبير عنها؛ لكي تبدأ مواجهتها، بل إنه في بعض المواقف لم يتوان في إبراز وجهة نظره الشخصية في صورة بدت فيها بعض النصوص كأنها مقصودة لهذا الغرض، الأمر الذى سحبه من دائرة الحياد –أحيانًا– ليكون مشاركًا في صناعة الحدث -لا مجرد ناقل له– بوعي شديد للدور الذي يجب أن يؤديه المثقف تجاه مجتمعه؛ ولعل هذا الوعي –كذلك– بأزمة الكتابة في مثل هذا التكوين الاجتماعي، هو الذي أدي بالمؤلف في بعض الأحيان إلى استخدام حيل صحافية للهروب من أسر دائرة قانونية قد تؤدي إلى سجنه، نظرًا لتعرضه إلى شخوص بعينها بأقوال ينقلها هو عن آخرين ويكتبها، وهي الحيلة التي أدت إلى تعميق فكر الأزمة الذي ينطلق منه الكتاب بأسره.<br />إن حواديت المشاوير لخالد الخميسي –إذن– قد استطاعت ببراعة فائقة الوقوف على دقائق لحظة اجتماعية محتقنة، ورصد هذه المكونات بوصفها صورة لما أصبح عليه المجتمع المصري، دون النظر باهتمام إلى الشكل الذي سوف تخرج عليه كتابة هذه الأزمة، ودون الاهتمام –كثيرًا شأن الأعمال الأدبية– بتحويل الحوادث إلى مقولات كبرى مطلقة، ودون محاولة إخفاء اسم المرض الخطير على المريض المأزوم."
