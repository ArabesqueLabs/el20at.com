text = "فعلا اطرف اغرب و اجمل التعليقات اللى ممكن تسمعها ف حياتك هى التى تاتى من سائق التاكسى الذى هو اما انسان بسيط لم يكمل تعليمه لظروفه الماليه او احد المتعلمين حاملى المؤهلات العليا و لكن اضطرته البطاله و ظروف حياته انه يشتغل كسائق و ف الحالتين بتلاقى نفسك ادام المواطن المصرى بكل همومه و مشاكله و بتجد نفسك و انت بتبص لوجهه بتلاقى عليه انعكاسات الوضع ف االبلد اجتماعيا و سياسيا<br />لم اقرا الكتاب و لكن واثقه انه اكيد كتاب جيد لانه بيحمل حواديت من قلب البلد دى"
