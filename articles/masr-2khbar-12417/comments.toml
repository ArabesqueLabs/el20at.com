text = "هو احنا هنلعب لعب عيال بايخ<br />يعنى فاكرين ان الحاجات الهايفة قوى دى هتهز النظام وتخوف الدولة<br />والا يمكن علشان يسرعوا فى عمل قانون الارهاب<br />فية شغل عيال كدة مش مفهوم فية صبيانية وطفولة خايبة<br />عايزين اية ؟<br />ربن يستر على البلدا"
