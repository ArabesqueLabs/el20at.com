author = "المفتش كرومبو"
posted = "2009-06-21"
text = "محافظ اسكندرية بعتلي وقالي الحق يا كرومبو فيه قنبلة تعالى شوف ايه حكايتها<br />ولما رحت مكان القنبلة عرفت ان اللي حط القنبلة واحد من تلاته<br />الاول ابراهيم الزعفراني بتاع الاخوان المسلمين<br />والثاني مرقص عزيز قسيس اسكندرية المعروف<br />وممدوح زكي زخاري جرجس ـ اسكندرية مصر<br />ولما سالت الزعفراني قالي<br />ازيك يا كرومبو انا بس كنت جاي اشوف المعبد بتاع اليهود دا بيعملوا فيه ايه وانا معرفش حاجه عن القنبلة ولا اللي حطها<br />ولما سالت مرقص عزيز قالي<br />ازيك يا كرومبو ها ها ها انا كنت بصلي العشا في الكنيسة وبعد صلاة العشا لقيت الناس بتصرح وبتقول قنبله قنبله وما شفتش مين اللي حطها<br />ولما سالت ممدوح زكي زخاري جرجس اسكندرية مصر<br />قالي<br />هيء هيء هيء يا كرومبوا انا ما شفتش قنبلة ولا زفت يا كرومبو اعملهم ايه ولاد الكلب دول منعني من السفر من سنة 1992 هيء هيء هيء يا كرومبو<br />انا عرفت مين اللي حط القنبلة ولو انت عرفت اتصل على عشرينات تكسب 1000 دولار اسبوعيا"
archived = "2010-03-14"
