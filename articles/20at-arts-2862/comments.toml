subject = "موضوع كول يامان"
author = "دح دح المانيا"
text = "والله من جد والغوالي انو هل موضوع اشي فاخر عل اخر يعني عن جد ذكرنا ب ايام الاردن والدووين والتلوين والمربعات والمستطيلات ونكشات المخ وكاني ماني وكيف حالك يافلاني والوحش ومرو والمضعضع وكردي وسروات وهل شلل المهويه الضاويه الفايعه اللي مش لاقيه شغله تشتغلها<br />المهم والله يا اخ طارق امشي عرمشي وكسدر عحواجبي موضوع طقع من الاخر يعني انا اول ما شفتو عل سريع حنيت للاردن<br />بس تصدق في كلمتين ولا ثلاث حاسسهم جداد مش مشكله بالصيف مننزل وننسخهم<br />بس يعني انا مش داري هاض اللي بدو يألف كتاب شكلو فاضي بال عن جد<br />بس اللي بالو افضى منو >;>;>;>; زيي <<<<< رح يشترو هل كتاب<br />واتوقع انو ينباع بشكل كبير بالاردن ولا وازيدك للدول المجاوره كمان<br />وما تستغرب اذا ترجموه للانجليزي وصارو يبيعوها ب اميركا وانا اترجمو لللالماني وابيعو ب المانيا<br />وبعدين بيدخل هل كتاب بموسوعة كتاب جينيس لاكثر الكتب مبيعا بالعالم<br />ما منا نطول هل حديث الساعه 8 ونص الصبح بدي اناملي كم ساعه يالله تصبحو عخير<br />Peace !!!"
archived = "2010-03-14"
