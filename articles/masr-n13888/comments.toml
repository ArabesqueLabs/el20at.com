order = 0
subject = "الامر ليس فى حاجة الى فتاوى احد"
author = "مصرى"
text = "الامر محسوم فى حكم المرتد عن الاسلام - وليس هناك اى حاجة لاى فتوى من ايا كان حتى ولو كان شيخ الازهر<br />بصريح النص - ان اى مرتد وبوضوح وليس هناك اى حاجة لشرح - الجزاء هو القتل<br />ليس هناك ادامية لانسان يغير دينة او معتقداتة من اجل طلاق امرأة او الزواج با امرأة اخرى<br />الدين ليس لعبة لهواة تغيير النسوان"
archived = "2008-01-21"
capture_url = "https://web.archive.org/web/20080121071101/http://masr.20at.com:80/newArticle.php?sid=13888"
