subject = "الكل بيعمل صيانة ولكن المشكلة فيمن يقوم بالصيانة"
author = "جميل"
text = "هل كان مجلس الشورى اللى ولع بجاز بدون صيانة ؟<br />كلا<br />الصيانة كانت تتم وتصرف عليها اموالا كثيرة<br />ولكن من يقوم باعمال الصيانة ؟<br />شركات ترسى عليها العطاءات وليكن بألف جنية كمثال - من الالف جنية تدفع رشاوى وهدايا للذين ارسوا عليها العطاء 50% من قيمة العطاء يعنى ياخدوا 500 جنية والشركة تكسب 300 جنية والصيانة تتعمل ب 200 جنية<br />يعنى صيانة اى كلام<br />سرقة عينى عينك<br />اسمها الحقيقى فساد<br />علشان كدة الطرق بايظة - والقطارات بايظة وكل المرافق متنيلفة بستين نيلة<br />بعض المحافظات كانت بترصف طريق - المقاول لازم يدفع لمكتب المحافظة ومهندسى الطرق و وووووو ويتبقى مبلغ صغير جدا يرصف بة الطريق اى كلام ويستلموا منة الشغل ويوقعوا الاوراق ان العمل تم على اكمل وجة وهم سرقوا فلوسة<br />اوقفوا الفساد اولا"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060057/http://masr.20at.com:80/newArticle.php?sid=17336"
