posted = "2008-01-13"
text = "رائع جدا يا شباب<br />واللة انا دايما اقول مصر ولادة<br />هى دى الافكار الحلوة اللى تبنى - لازم الشباب يبتكر ويجد حلول لمشاكلة<br />وشكرا يا اخ هوارى - على المقالة الحلوة التى تبث شيئا من الامل فى زمن الياس للشباب"
