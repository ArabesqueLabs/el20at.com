text = "علشان يرجعوا شايلين الكاس ومعاهم الفريق والجماهير تقابلهم فى المطار<br />هما اللى جابوا الكاس<br />عايزين يسرقوا فرحة الناس<br />بس يا خوفى وجودهم يربك اللعيبة ويرجعوا زى ما رجعوا من ام درمان<br />ما يقعدوا يتفرجوا فى البيت احسن ويسيبوا الناس فى حالها"
