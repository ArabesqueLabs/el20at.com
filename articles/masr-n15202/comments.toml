[[comments]]
order = 0
subject = "مروة عبد الفضيل"
author = "ميرا"
text = "ايه الكلام الجامد ده يا ريس بجد هايل وتعبيراتك مالهاش حل وعلى فكرة انت بالكلام ده حببت الناس في الحمير وهيزيد عليه الطلب في الايام الجاية وتحقيقك ده خلاني افكر اعمل بروفايل عن الحمار فانتظره قريبا"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161149/http://masr.20at.com:80/newArticle.php?sid=15202"

[[comments]]
order = 1
subject = "اذا ذهبت ام عمرو بالحمار - فلا رجعت ولا رجع الحمار"
author = "الحمار"
text = "طبعا الحمار الكبير انت عارفة<br />اما الجحش فمش عايز تعرفة<br />اما ام عمرو فانها لا تنوى الذهاب بالحمار بل تفضل الطيارات<br />ربنا يخللى الزمن الجميل اللى الناس اكلت لحوم الحمير والكلاب وبدل ما يقولوا شعر وغناء اصبحوا ينهقون<br />وياريتهم خللوا الناس ياكلوا حمير حية مدبوحة وانما اكلوا جيف الحمير المنتنة اى الجثث الملقاة على شواطىء الترع"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161149/http://masr.20at.com:80/newArticle.php?sid=15202"

[[comments]]
order = 2
subject = "الحمار"
author = "مدونة محمد شمس"
text = "قال بصراحة انا أحسن منكو<br />أحسن من ملايين فـ زمانكوا<br />مش شرَّاني ولَّا لئيم<br />ولا بتملَّق عند زعيم<br />واحسن ماكُل حق الناس<br />بقعد آكل في البرسيم"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161149/http://masr.20at.com:80/newArticle.php?sid=15202"

