[[comments]]
order = 7
subject = "نكته حقيقية يا طحاوي"
author = "مش لاعب"
text = "مرة واحد فلاح عندنا من البلد كان بيروح لواحد جزار يشتري لحمه رخيصه من عنده<br />وبعدين مرة راحله فلقى المحل مقفول<br />سأل ليه المحل مقفول قالولوا اصل الجزار في السجن<br />ليه يا جماعة قالولوا اصله كان بيبيع لحم حمير<br />قام الفلاح قال يا خبر ابيض دا انا يمكن كلت من عنده بتاع حمارين<br />ها ها ها ها ها ها ها اضحك من قلبك يا طحاوي ها ها ها ها ها ها ها ها"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161149/http://masr.20at.com:80/newArticle.php?sid=15202"

[[comments]]
order = 8
subject = "اكلت لحم حمير وقطط وكلام وفيران"
author = "مش هو"
text = "يا ما كلنا لنشن وبلوبيف وبسطرمه<br />والموضوع دا من زمان اوي من يوم ما بدأ يبقى فيه رجال اعمال في البلد بيفكروا في المكسب السريع والكبير"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502115719/http://masr.20at.com:80/newArticle.php?sid=15202"

[[comments]]
order = 9
subject = "تقرر انشاء مباحث مكافحة ذبح الحمير"
author = "مش عايز"
text = "يا طحاوي<br />انا النهارة كنت في الداخلية<br />اصل فراش البيه الوزير يبقى صاحبي جدا<br />وسمعت والله اعلم طراطيش كلام<br />انهم حيعملوا فرع في المباحث لمكافحة ذبح الحمير<br />كالتالي:<br />1) اي حمار يتولد يتعمله شهادة ميلاد وياخد رقم<br />2) في حالة وفاة الحمار يجب ابلاغ مكتب صحة الحمير<br />3) عرض الحمار على الطبيب الشرعي<br />4) التصريح بدفن الحمار<br />5) دفن الحمار تحت اشراف مندوب من وزارةالداخلية"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502115719/http://masr.20at.com:80/newArticle.php?sid=15202"

[[comments]]
order = 10
subject = "الحقني يا طحاوي"
author = "مش هناك"
text = "ازيك يا طحاوي شفت اللي حصلي يا خويا<br />طبعا يا طحاوي يا خويا انا من زمان وانا فيا شيء لله اي لحمه اكلها يجيلي روح صاحبها في المنام يعني مثلا لما اكل فرخه تيجي الفرنة تكاكي في المنام لما اكل ديك يجيلي الديك ياذن ليه في المنام لما اكل لحم معيز تجيجي المعزة اللي انا اكلت لحمها في المنام تمأمأ لما اكل لحم بقر تيجي البقره في المنام<br />وبعدين مرة كنت ماشي وشفت واحد بيعمل سجق ولقيت رحته حلوه اوي يا طح طح يا خويا نفسي هفتني على سندوتشين المهم اكلت السندوتشين وشربت وراهم ازازة بيبسي والحمد لله<br />اسكت يا طحاوي ما تفكرنيش وبعدين نمت يا طحاوي وسمعت في المنام صوت قطة بتنونو يا طحاوي<br />صحيت مفزوع وانا بصرح وبقول اكلت لحم قطة يا طحاوي"
archived = "2008-05-02"
capture_url = "https://web.archive.org/web/20080502115719/http://masr.20at.com:80/newArticle.php?sid=15202"
