[[comments]]
order = 0
subject = "اخصائى رؤوس"
author = "السيد الباتننوى"
posted = "2009-03-10"
text = "الحلاق فى اول حارتنا لما افوت علية واقول سلام عليكم ما يبصش ابدا فى وشى - دايما يبص لراسى ويشوف ميعاد الحلاقة قربت والا لسة شوية - ولما يشوف الراس تحتاج حلاقة بدل ما يرد السلام يقول لى يا سيد افندى ابقى عدى عليا بعد العشا<br />وبعدين بياخد 3 جنية فى الحلقة<br />وممكن تقول لة عدى عليا فى البيت - تلاقية جاب الشنطة واشتغل فى حلاقة الراس داخل البيت<br />وبعض زملائى لا يذهبوا الى الحلاق - مراتة بتحلق لة فى البيت علشان التوفير والازمة الاقتصادية<br />وانا ناوى اشترى عدة حلاقة واخللى مراتى تحلق لى انا والعيال<br />اصل العملية مش صعبة قوى"
archived = "2009-03-24"
capture_url = "https://web.archive.org/web/20090324011935/http://masr.20at.com:80/newArticle.php?sid=20232"

[[comments]]
order = 1
subject = "انا بطلت احلق عند الحلاق"
author = "مراد المنسي"
posted = "2009-03-24"
text = "طبعا الناس حتفتكر اني بطلت احلق وشعري راسي وذقني بقوا زي امنا الغوله<br />ولكن السبب يختلف وهو<br />اني بقيت اصلع والسبب التاني اني بحلق دقني في البيت لانها لا تحتاج الى حلاق<br />وبالتالي لا اعرف تمن الحلاقه كام عند الحلاقين وان كان الغالب انهم زودوها حبتين على الناس الغلابه"
archived = "2009-04-13"
capture_url = "https://web.archive.org/web/20090413152710/http://masr.20at.com:80/newArticle.php?sid=20232"

[[comments]]
order = 2
subject = "حقا انة رجل محترم اما انا فخطير على الامن القومى ا"
author = "ممدوح زكى زخارى"
posted = "2009-03-29"
text = "الاسم: ممدوح زكى زخارى<br />العنوان: حقا انة رجل محترم اما انا فخطير على الامن القومى المصرى كما تدعى على كذبا وزارة داخلية مصر<br />ليتنى كنت ممدوح اسماعيل و ليس ممدوح زكى زخارى المصرى الذى منعت من السفر خارج مصر من 11 مايو 1992 و حتى و قتنا هذا انتقاما منى بسبب زيارتى الى دولة اسرائيل لغرض العلاج الطبى الغير متوفر فى مصر و كل الدول العربية و ايضا قيامى باداء مراسم التقديس بالقدس لكونى مسيحى مصرى؟ يشرفنى حقا ان يكون لى شرف التعرف بالشخصية الهامة التى ساعدت على اخراج السيد ممدوح اسماعيل خارج مصر من صالة كبار الزوار ليخرجنى انا كمان؟ مستعد لدفع مليون دولار امريكى لاى شخص يساعدنى على الخروج خارج مصر و ليعتبرنى ممدوح اسماعيل ولست ممدوح زكى زخارى جرجس المصرى المسيحى القبطى الشريف و لست القاتل؟<br />ــــــــــــــــــــــــــــــــــــ<br />الاعتراف سيد الادلة يا زخاري<br />http://masr.20at.com/marquee/comment.php?id=84038"
archived = "2009-04-13"
capture_url = "https://web.archive.org/web/20090413152710/http://masr.20at.com:80/newArticle.php?sid=20232"

