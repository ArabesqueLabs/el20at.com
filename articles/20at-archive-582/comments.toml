[[comments]]
order = 14
subject = "اليهود المغاربه"
author = "أيمن صبري"
posted = "2009-01-25"
text = "يا جماعه والله العظيم مفيش فرق بين اليهود المغاربه وأي يهودي في العالم ( الصهاينه ) أعداء الأسلام . لأني شفت بعيني علي قناه تلفزيونيه فضائيه عربيه أثناء العدوان الهمجي والبربري علي المدنيين في غزه رمز العزه لافته في أسرائيل بالتحديد في الضفه مرسوم عليها سهم يشير الي منطقه ومكتوب تحته الي مستوطنة اليهود المغاربه . متصدقوش أي كلام تقرأوه ؟ اذاي اهل المغرب يقولوا اليهود عندنا ليس لهم علاقه بيهود أسرائيل ؟ . أفيقوا أيها الساده اليهود يهود . وعدوك عدو دينك فلعنة الله عليهم أجمعين في كل زمان ومكان . ولا نملك الا أن ندعو بدعاء نوح عليه السلام ( رب لا تذر علي الأرض من الكافرين ديارا * انك ان تذرهم يضلوا عبادك ولا يلدوا الا فاجرا كفارا ) أردت فقط التوضيح فاليهود يهود مهما أختلفت جنسياتهم ."
archived = "2010-03-14"
