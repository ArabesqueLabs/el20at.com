text = "يظهر ان ابو علاء بدأ الدعاية الانتخابية للفترة الرئاسية القادمة بدرى شوية<br />طبعا الالاضيش زى يوسف بطرس غالى ينزلوا يعكوا الدنيا ويفرضوا ضرائب وجباية وبعدين ينزل المعلم يصلح العملية ويؤش ورق الكوتشينة<br />وبعدين هيجيبوا عجز الموازنة من اين ؟<br />العجز 120 مليار جنية والضرائب العقارية هتجيب فى توقعاتهم اربعة مليارات<br />يعنى العملية ملخبطة وبطرس غالى هينشف راسة رغم كلام الريس والضريبة هتمشى هتمشى<br />كلمة يوسف بطرس غالى ما تنزلش الارض ابدا"
