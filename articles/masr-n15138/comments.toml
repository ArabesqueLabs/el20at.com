subject = "في الصميم"
author = "اسامه صلاح"
posted = "2008-04-10"
text = "السلام عليكم ورحمة الله وبركاته<br />مصر تحتاج لاحياء مفهوم المواطنة الصحيح واعادة تاهيل وتنشيئة الشعب ليكتسبوا الشعور بالمواطنة المفقودة.<br />يمكن مصر او بالتحديد المواطن المصري زمان كان فقير بس كان عنده آآمل سهلة التحقيق ليكون من الاغنياء ويزرع ارض ويبني بيت او حتي يفتح مشروع صغير او دكان وكان تحقيق الامن يتم اولا بواسطة صحبه وجاره الامين وعسكري الدرك الي بيلف الحارة والشارع علي رجلية جايز يكون جاهل بس عارف هو بيعمل ايه وعارف ان هدفه الاساسي حماية امن الغلبان وبتاع الفجل واولاد الشوارع من بطش الغني والفتوة جايز كان بيخاف منهم بس عمره ما ساب وجبه علشان خاطر خمسة جنية.<br />دلوقت مصر بشهادة مسؤليها في الداخلية ومجلس الشعب والشوري والحكومة انفسهم بيتبروا من هذا الجزء غير الصغير من الشعب (المهمش) وبيعتبروهم (غوغاء - شرزمة - بلطجية - مش مصريين) وبيتهموهم بعدم الانتماء او العمالة وهذا عن لسان بعضهم في العاشرة مساء علي الهواء اثناء مناقشة احداث المحلة ) وبيحملوهم مسؤلية الشغب في طنطا , لم يسأل هؤلاء المسؤلين انفسهم من هو السبب او ما هي العوامل التي افرزت تلك الغوغاء ؟ لم يسألوا انفسهم ماذا قدموا من خدمات ومساعدات وتأهيل ورعاية لتلك الغوغاء من خلال مناصبهم ومسؤلياتهم ؟ علي سبيل المثال وليس الحصر<br />رجال الدخلية ماذا فعلوا لاعادة تأهيل هؤلاء البلطجية (المسجلين خطر ) داخل السجون ماذا فعلوا للسيطرة علي سلوكهم بعد الافراج عنهم لضمان عدم اساءتهم للمجتمع ؟ هم فقط اكتفوا بتسجيلهم في سجلات امنية وتركوهم في تجمعاتهم المشبوهه (والحجة طبعا نقص الامكانيات وعدم الاختصاص او واحنا هنعملوهم ايه هنربيهم من جديد) نعم ربوهم من جديد تربية سليمة واعيدوا تأهيلهم والسيطرة علي سلوكهم ومساعدتهم لنفع انفسه والمجتمع , والا تكونوا فشلتم في مهامكم الاجتماعية ودوركم في اكساب المواطن مفهوم المواطنة.<br />اولاد الشوارع من هو المسؤل عنهم !!! دخلية - شؤن اجتماعية – مجتمع- اصحاب القلوب الرحيمة؟ محدش عارف!<br />كيف يطالب المسؤلين والنواب اي فرد برعاية المجتمع والمحافظة عليه. في نفس الوقت الذي لا يلقي هذا الفرد من المجتمع الا (الطناش -اهملة - ولم يقدم له الا الرمي في الحجز من حين لاخر) هذا بالنسبة للمهمشين او البلطجية<br />اما الجزء اللاكبر من الشعب فما هي دوافع ارتباطة بالمجتمع<br />امن ! نادرا ما تجد فرد احتاج مساعدة امنية ووصلت له في موعدها وبفاعلية انسانية بدون تليفون او كارت واسطة<br />صحة! هات لي واحد (موظف-عامل-معاش-منطوي)لم يعاني من المستشفيات والعلاج<br />توفيرالعمل ! هات لي واحد بيفكر يعمل مشروع او في المستقبل ويجد فرصة بدون معوقات وبيروقراطية منفرة<br />زراعة! الارض المستصلحة بتتاخد من الي عرقوا فيها علشان اخرون والارض الصالحة توزع علي المستثمرين والبور توزع علي شباب الخريجين وبعد اصلاحها تصادر نتيجة للديون<br />تعليم ! الوزير نفسه اتهمه بالفشل والخريجين لا تقبل شهادتهم للعمل بالخارج او في فرصة محترمة بالداخل.<br />توفير الغذاء! المجاعة قادمة يراها الجميع عدا (النواب) والكل يبحث عن الغذاء بشق الانفس والبعض في الزبالة<br />حلول تبعث الامل ! لا توجد حلول مطروحة الا ( الكلام المنظوم) معاد من نفس المصادر مع تكرار القسم علي الوفاء بالعهود<br />فساد ! لا توجد بشائر لمحاربة الفساد وحقيقة الامر لا سبيل لمحاربة الفساد لان النواب يطالبون الشعب بالبداء من انفسهم وهذا مستحيل مستحيل مستحيل عارف ليه,للاتي<br />لان المواطن (بالاسم) مجبر علي ممارسة الفساد وليس محب له ولا باختياره ,فلابد من دفع رشوة للحصول علي الحق في كل المجالات ومحاولة الحصول علي الحق بدون رشوة او ممارسة نوع من انواع الفساد تدخل في مجال القضاء والتقاضي والانتظار بالسنين للحكم في موضوع قد يكون تافهاو لا يحتمل الانتظارولماذ الانتظار طالما ممكن ان ينتهي الموضوع فورا بعشرة جنية( دخول كهرباء -دخول مدارس نقل من مدارس-علاج وعمليات - فتح نشاط تجاري - تصريح لاي حاجة - خروج كريم من الجمرك-...الخ) المواطن مجبر علي كسر اشارة المرور لانه لا يعلم هل الاشارة شغاله ولا عاطلة من خبرته الطويلة في المرور حتي عسكري المرور غير علامات المرور خلي الاخضر احمر والاحمر اخضر وما فيش اصفر.<br />المواطن مجبر علي فقد الثقة بالاخرين لان وصل الامانه لم يعد له قيمة حتي ولو مبصوم عليه ورد الحق اذا اترد يكون بعد سنتين في المحكمة يعني لو صحبك ولا اخوك نصب عليك وهو شبعان (طمع) وانت لا تملك غير هذا المال المنصوب فيه علي ( يبقي خربت لاعلاج طارئ ولازواج للبنات ولا تعليم اولاد ومن ثم انضمام لاولاد الشوارع) ولا منصف لك فالقانون لا يحمي المغفلين وفي هذا العصر يسميهم اهل الفتوي الطماعين .<br />حتي تعرض المواطن لبلطجة في الشارع امام ضابط المرور الذي لا يتدخل لانه غير مكلف بالامن العام وانتظاره لوصول النجدة بعد نصف ساعة علي الاقل من البهدلة حلها الامثل التنازل عن حقه لهذا البلطجي او ابن الزوات المدلع وعوضه علي الله.<br />اعدام المجتمع التوربيني وجرمه ولم يجرم من قام علي تربية التوربيني وتنشيئته الاجتماعية والمسؤل عنه فلا يعقل ان يكون هناك مواطن في بلد خارج نطاق المسؤلية(مسؤلية مجتمع وليس اسرة) لم يجرم المجتمع من تركه يسعي في الارض فساد طوال حياته, واتهمه النواب الافاضل بانه لادين له ولا انسانية والحقيقة انه انسان مظلوم ومجني عليه من المجتمع فلم يقدم له احد ولم يعلمه احد مفهوم الدين او مفهوم الانسانية ولم يساعده احد لاشباع رغباته الانسانية من مأكل وملبس وغريزة بطريقة انسانية شرعية ولم يجد من يوجهه بالحسني او بالقوة ان استدعي الامر.<br />وهكذا فهولاء الغوغاء مظلومين لان لا احد قدم لهم المساعدة والتعليم والتنشيئة السليمة ليكونوا مواطنين شرفاء بل الجميع يطالبونهم بالالتزام بالسلوك الصالح دون تقديم يد العون لهم.<br />لولا حسن حظنا لكنت وانت وهو توربيني او اولاد شوارع . ولولا الاهمال لظهر من تلك القوة البشرية المهمشة قدرات قد تفوق قدرات من يشمئز منهم ويسميهم كما يحلوا له لظهر منهم علماء وقادة واطباء اكثر ذكاء بكثير ممن لا يعلمون او يقدرون معني الانسان والقدرة البشرية<br />واخيرا اعلم ان رد اي نائب او مسؤؤل سيكون كالاتي ( ده كلام مش صحيح يعني ايه هو احنا حندخل كل بيت نربي الشعب وفين مسؤلية الاسرة و.. و....) ارد عليهم واقول لا<br />قم باعداد وتنفيذ برنامج تجميع واعادة تأهيل وتوزيع ومتابعة وقدم لهم المساعدة بانشاء مشروعات خاصة بهم او علمهم الزراعة وسلمهم ارض مصر الصحراء ليزرعوها بدل من المستثمرين الكبار,ايضا ان هؤلاء الغوغاء اما افراد لا اسر لهم واما اسر لا عائل او وظيفة او تعليم لهم فالافضل توفير العلاج والغذاء والتعليم والتوظيف لهم او لنصمت ولا نتهمهم بعدم الوطنية لان المصطلح الاكثر تعبير هو ( انسان فاقد المواطنة)<br />اما باقي اسر الشعب فهي لا تحتاج لمن يعيلها او يربي ابنائها ولكنهم يحتاجون من يترك لهم الفرصة والوقت للاعتناء باولادهم بدلا من ضياع الوقت في البحث عن حقوقهم فكلنا يبحث عن حقه وفقط وان لم يكن هنا فنبحث هناك وليس منا ما ليس له حق ضائع في العديد من المجالات.<br />اصلحوا التعليم واسرعو ا اجراءات رد الحقوق علي كل المستويات واسرعوا اجراءات التأمين وطلب الحماية والتدخل السريع للحماية الشخصية لاي المواطن انسان(شرطة- اسعاف- اطفاء) وحولوا الموارد الطبيعية الي منتجات نهائية وضاعفوا الرقعة الزراعية وفعلوا القانون لانتظام المرور واستعادة الاخلاق العامة بالشارع وحولوا السجون الي معاهد وجامعات لاعادة التأهيل و حلوا مشاكل الغوغاء اولا وقبل كل شيئ واصلحوا من القاعدة الي القمة ومن ثم احكموا الرقابة وامنعوا فساد (كل الموظفين في الاجهزة الخدمية الي هم من الشعب برده) لاعلاء شأن الخدمة المقدمة هذا ان اردتم استرداد روح المواطنة المفقودة والاصلاح الحقيقي للبلاد.<br />وشكرا<br />مواطن بشهادة الميلاد"
archived = "2008-04-12"
