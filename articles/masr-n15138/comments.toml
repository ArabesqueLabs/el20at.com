subject = "بالمنطق نظيف مظلوم"
author = "اسامه صلاح"
posted = "2008-04-10"
text = "ليست حكومة نظيف هي سبب تكوين هذه الازمات الاجتماعية والسياسية واالاقتصادية والرجل لم يفعل سوي تفجير الحقائق واظهارها للشعب مما نتج عنه تفجير الازمة والتعامل الوقتي مع الموقف ولكن لما هذا الغضب من حكومة نظيف هل نظيف هو الذي كون العشوائيات ورباها هل نظيف هو الذي باع الاصول هل نظيف هو الذي دمر التعليم هل نظيف هو الذي اهمل الزراعة والصناعة ...الخ فكل هذا التدمير لا يمكن ان يحدث الا علي المدي الطويل وليس فترة وزارية لم تكتمل !<br />ماشي يقال نظيف وياتي من ؟ ومن يأتي بمن؟ وهل من اتي بنظيف كان يعلم من هو اصلح واقدر منه وامتنع عن تعيينه اوهل سيبداء بالبحث من جديد عن من هو اقل مستوي من نظيف؟<br />المشكلة ليست في اقالة حكومة او تغيير وزير رغم ان هذا بالطبع من الضروريات المسكنة للموقف<br />وهنا يجب الا يكون الاعتراض المقدم من القوة المعارضة هوطالب المسكنات باقالة حكومة وفقط فهي اما لاتعرف العلاج او انها مشتركة مع الحكومة في سياسة المسكنات وهنا نسأل من له الحق في المطالبة بالعلاج عندما تنادي المعارضة والنواب الشرعيون بالمسكنات ( طبعا وبالمنطق هم الشعب) وماذا يحدث الان الشعب يطالب بالعلاج وترك المعارضة مع الحكومة<br />وهنا يكمن علاج (كل المشاكل والاحداث )"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073432/http://masr.20at.com:80/newArticle.php?sid=15138"

