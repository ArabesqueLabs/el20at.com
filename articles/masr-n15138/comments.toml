subject = "المهمة المستحيلة"
author = "اسامه صلاح"
posted = "2008-04-10"
text = "قد تكون المشكلة الاقتصادية والجوع هما القشة التي قصمت ظهر البعير ولكنهما ليس سبب اي انتفاضة او اضراب او مظاهرة في اي مجتمع لان الشعوب لا تتظاهر الا اذا احست بالتقصير والاهمال من الحكومة (وكم من شعب عاش فقير لقلة موارده ولم يشاغب ومنهم من نجح في زيادة موارده المحدودة بالعرق وهم سعداء)<br />ان السبب الاكيد للاحداث الاخيرة والاحداث المماثلة في الماضي والمستقبل والتي لم تتولد في يوم وليلة ولا عقد وعقدين هي اسباب اولا اجتماعية(معاناة في التعليم والصحة والامن والقضاء والخدمات والعمل)دام لاكثر من ربع قرن من الوعود الخادعةحتي كبر جيل من (البؤساء لا وطن لهم عمره يزيد عن 30 سنةوالبعض 40) وثانيا اسباب اقتصادية حرم فيها المواطن من الاستفادة بموارد بلاده الطبيعية او حتي مجهوده المدخر والضائع كما منع من استغلال تلك الموارد او تصنيعها او اصلاحها وهيئة الظروف لفشل اي محاولة لذلك سواء للجهل التعليمي والتأهيلي او للبيرقراطية المقنعة ففشل الفرد او المواطن في استغلال اي فرصة وحق لتحسين اقتصاد الاسرة وزيادة الانتاج الفعلي وبالتالي اهدرت الموارد والثروة البشرية واستغلالها الا في حدود عمال النظافة واكشاك السجائر والسخرة اذا اراد الفرد تحسين الدخل (او الهجرة وترك البلاد لاصحابها)<br />اسباب سياسية والتي افقدت المواطن الامل في التعبير عن متطلباته او المطالبة بحقه او عرض مشاكله او توفير برامج اصلاحية تبشر بالخير القادم فاقتصرت السياسة علي الوعود الكاذبة والنهج المتعالي والوحداوية في الرائ ومطبخ سياسية لا ينتج الا القوانين المدعمة لهذه السياسة لم يعترف يوم من الايام بتقصيره او انه شارك سواء بقصد او بدون قصد فيما وصلنا له اليوم<br />اما اليوم فمطلوب حل سريع وجذري ولا يؤثر علي المستقبل (ليس بيع الاصول او الاقتراض لحل المشكلة) والحكومة الحالية لا يمكنها تبني تلك الحلول (الكثيرة ) لان معناها الاعتراف بالاهمال الجسيم الذي يصل لحد الخيانه والاعتراف باخطاء الماضي والمحاسبة عليها وكذا معاداة كل مراكز القوة من رجال الاعمال والداعمين السياسيين المستفيدين من الاوضاع وبذلك فلا تملك الحكومة اي فرصة لتبني ( اعادة البناء من اول وجديد او ما يسمي بالاصلاح) وكذا لن تترك الحكومة اماكنها الا (براي الشعب بعد ان غيبته واجبرته علي التخلي عن الانتخابات والمشاركة )<br />واخيرا اي حكومة تعيسة الحظ سوف تأتي ستفشل لان المطالب والمجهود كبير وكذا الشعب نفذ صبره وغير خاضع لاستصاغة مفهوم التجربة او حقول التجارب . فسيذهب نظيف ككبش فداء ويأتي كبش فداء اخر وبعد عمر طويل امد الله في عمرة سيسير الشعب في الجنازة وتهتف الصحبة بمأثره ووطنيته ومشاركته الفعالة والايجابية الحكيمة لهموم الشعب في هذا العصر وستسقط جميع الاتهامات الموجهة الان علي النظام وعدم قابلية استجابة الشعب في تلك الاوقات كونهم بلطجية وهنا نقول مافيش امل ستاتي حكومة قد تحمل اجندة سياسية ولكنها لا تملك ادوات وموارد اقتصادية او اجتماعية للاصلاح الا بالمصارحة مع الشعب ونبش الماضي والبحث عن الحقوق الضائعة<br />(انهم لم يتركوا مجال للاصلاح قريب المدي تلك هي الحقيقة الغائبة)<br />ولهذا السبب اشك في قدرة اي من المسؤلين في الاقدام علي ترشيح نفسة لتولي الامور في المستقبل واكاد اجزم بان الجميع يدعون الله ليخرجوا من مناصبهم بغير فضيحة وما يمنعهم عن التنازل عن تلك الكراسي الا ثقتهم بفضح وكشف المستور بمجرد ترك هذا الكرسي ومنقم فلا مجال الا القتال لاجل المحافظة علي هذا الوضع حتي يامر الله بامر كان مفعولا"
archived = "2008-04-12"
