subject = "مغالطات"
author = "اسامه صلاح"
posted = "2008-04-10"
text = "السلام عليكم ورحمة الله وبركاته<br />البلطجية والغوغاء حجة ومبرر لكل من يريد ان يتنصل من اخطاءه او يرمي بها علي القدر والمجهول وكأننا نظيفي اليد وغير مشاركين في تكوين العشوائيات والبلطجية والغوغاء عبر خمسون سنه او انهم زرع شيطاني نبت في جنان الارض !<br />ومع ذلك ماذا فعل هولاء الغوغاء (المواطنون اصحاب البلد) كسروا نهبوا اضروا بالمال العام (كم الخسائر) مليون عشرة مئة مليون ( خطاء كبير لا شك ولكن مسبب وله دافع قد يكون الغضب او التسيب)<br />لنقارن الخسائر الناتجة عن حالة الغضب بالخسائر الناتجة عن حالة الطمع لصفوة القوم (الغير بلطجية والغير غوغاء) والذين تسببوا فيها بدون اي دافع يخفف من جرمهم<br />خسائر (تعليم-اقتصاد- تصدير -استيراد-زراعة-صناعة -ارواح وعبارات وقطارات-مرور-نهب - سرقة- عمولات -فساد -احتكار -رشاوي - قروض - نصب...الخ وطبعا عندكم الاحصائيات)<br />كم مليار عشرة مليار مئة مليار ولا مئات المليارات (بسبب الفساد)<br />الغوغاء والبلطجية يحاكمون ويسجنون ويتهمون بالخيانه ويضافوا الي جموع العشوائيات واولاد الشوارع ويضيع مستقبلهم واحلامهم , اما الفاسدين فلهم قوانين يحميهم ومحاميون ونواب شعب يدافعون عنهم وفوق كل هذا يتمتعون ويحققون احلامهم العير مشروعة دون يوم واحد حجز ( برجاء الايعترض احد ويقول ان هذه قاعدة شاذة وان كل الفاسدين في السجون والمتسببون في ضياع المال العام وفشل المشروعات يحاسبون)<br />فما الفرق بين هذا وذاك لنقارن ونحسب بالعدل و القيمة والدافع للجريمة والخطورة والفائدة ولا ننسي ان ما حدث في المحلة ايقظ كثير من الشعب النائم (وهذه الفائدة لا تقدر بثمن بالمقارنة بالخسائر )ولا ننسي ايضا ان كل تجربة تحتوي علي قدر من المخاطرة والتكلفة<br />واخيرا فلنفرج عن هؤلاء الغوغاء ممن السجون ان كنا نبحث عن رد الحقوق والعدل والمستقبل"
archived = "2008-04-12"
