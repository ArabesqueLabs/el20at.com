[[comments]]
order = 0
subject = "كلام ماسخ"
author = "مراقب"
posted = "2007-10-29"
text = "لا ينفع ولا يجدى اى ترتيب فى مسألة حكم مصر<br />فلم يخطر فى عقل اى مصرى ولو فى الاحلام ان يتولى السادات الحكم سنة 70<br />ةلم يخطر فى طيف خيال اى مصرى ان يتولى مبارك الحكم سنة 81<br />العملية كلها بزرميط<br />فيمن ياتى بة المقادير<br />لا تتوقعوا شيئا ولا تخططوا لشىء<br />وانتظروا<br />ربما الواد سيد الشغال<br />اما احلام كوندا بريزة فهراء"
archived = "2007-11-03"
capture_url = "https://web.archive.org/web/20071103050146/http://masr.20at.com:80/newArticle.php?sid=12157"

[[comments]]
