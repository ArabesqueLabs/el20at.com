[[comments]]
order = 2
subject = "الجيش والشعب هو الشعب والجيش"
author = "محمد ( صحفى شاب )"
posted = "2007-10-30"
text = "أسئلة ولها إجاباتها المنطقية<br />أولا من هو الجيش ؟<br />الإجابة هو أخ أو إبن أو قريب أو صديق .<br />ثانيا ماذا حدث عندما حاول عبدالناصر أول مرة عزل محمد نجيب ؟<br />الإجابة إنقسم الجيش إلى حزبين واحد مع عبد الناصر والثانى مع نجيب .<br />ثالثا هل من الممكن أن ينقلب الجيش على الشعب ؟<br />الإجابة لا لأننا فى مصر بمعنى أخر مهما كان العداوة بين الأخ وأخيه سيأتى اليوم الذى يتصالحون فيه إلا إذا كانوا أولاد حرام لا سمح الله ؟<br />السؤال الذى أحب أن أعرف إجابته من قراء هذه المقالة<br />تفضل من يحكم مصر شخص سياسى أم قائد عسكرى له خبرة فى التعامل مع جميع الطبقات والأفكار والعقليات إلخ<br />أتمنى من الأخوة الإجابه على هذا السؤال لأنه مهم بالنسبه لكم ولأولادكم والله المعان وهو وكيلنا"
archived = "2007-11-03"
capture_url = "https://web.archive.org/web/20071103050146/http://masr.20at.com:80/newArticle.php?sid=12157"

[[comments]]
order = 3
subject = "افضل ان يحكم مصر رئيس منتخب من برلمان منتخب وشعب ي"
author = "قارون"
posted = "2007-10-30"
text = "مشكلتنا بتكبر مع الايام ومفيش اى بوادرحل لغاية دلوقتى لان الشفافية والمصداقية مفقودة تماما بين الشعب ونظام الحكم فية ناس مستفيدة من الوضع دة ودول شوية صحاب ومحاسيب بيوجهو سياسة البلد الداخلية والخارجية وفق المصالح الخاصة لان البلد دلوقتى بقالها 26سنة والريس مش لاقى حدكفؤ انة يبقى نائب لية ومش واثق فى نفسة ولا بشعبية حزبة المزعومة انة يعمل انتخابات حرة ونزيهة ليثبت لينا وللعالم انة احترم اختيار شعبة ودى اعتقد اول خطوة فى الطريق الصحيح وبعد كدة لما الناس تسدق موضوع الانتخابات حيكون احساسها بالمسؤلية والوطنية اكبر"
archived = "2007-11-03"
capture_url = "https://web.archive.org/web/20071103050146/http://masr.20at.com:80/newArticle.php?sid=12157"

[[comments]]
order = 4
subject = "عبد الحليم قنديل بيحشش"
author = "مصراوى"
posted = "2007-10-31"
text = "عبد الحليم قنديل بيهرج<br />هو سعادتك فاكر يا ابوقنديل ان انت بس الى واخد بالك من الحاجات دى<br />الحاجات دى كلها مفهومة وكل حاجة معمول حسابها وكل السيناريوهات مدروسة وهايكون اشيك وارق انتقال سلطة فى دول العالم اثالث<br />وهاينضرب بيه المثل فى التخطيط وتسليم السلطة فى منتهى الصمت والهدوء والشرعية<br />العملية مطبوخة من زمان قوى وسعادتك بتحلم"
archived = "2007-11-03"
capture_url = "https://web.archive.org/web/20071103050146/http://masr.20at.com:80/newArticle.php?sid=12157"
