order = 1
subject = "هل سعادة الوزير استاذ طب حتى يقيم مستوى خريجى كليا"
author = "شايف"
posted = "2008-09-10"
text = "عدد طلبة الثانوية العامة قرابة نصف مليون<br />وعلى حسب سياسة التعليم حاليا فقد تم تقسيم الثانوية العامة الى ثلاث شعب هى الادبى والرياضيات والعلوم<br />ولنقل ان عدد طلاب الادبى حوالى 300 الف طالب<br />وعدد طلاب العلوم 100 الف طالب وهدفهم الرئيسى كليات الطب<br />وعدد طلاب الرياضيات 100 الف طالب وهدفهم كليات الهندسة<br />زمان كان التخصص علمى وادبى<br />تحت ادعاء ما فائدة الرياضيات لطالب الطب نقول هل يستغنى الطبيب عن استخدام الكمبيوتر والاجهزة الحديثة<br />وهل يستغنى المهندس عن الفيزياء والكيمياء<br />يا سادة افسدتم التعليم<br />شوفوا اليابان بتدرس اية لعيالها وانقلوة بالمسطرة<br />وشوفوا بريطانيا بتدرس اية لطلابها وانقلوة بالمسطرة<br />وشوفوا اسرائيل جنبكم بتدرس اية مقررات لطلابها وانقلوة بالمسطرة<br />بطلوا فتاوى<br />وما تسمعوش كلام الامريكان لان هدفهم تدمير التعليم<br />الفتاوى والاجتهادات غير مطلوبة<br />شوفوا غيرنا ودعونا نقلدهم فى كل حاجة الا 3 حاجات اللغة القومية والدين والتاريخ<br />تحضرنى قصة لرئيس وزراء بريطانيا تشرشل ايام الحرب العالمية التانية<br />ذهبوا الية قائلين<br />لقد دمر الالمان لندن ودمروها وهدموا كل شىء<br />سألهم<br />دمر الالمان كل شىء هذا صحيح ولكن اريد ان اطمئن عن التعليم والعدل فى المحاكم<br />ردوا علية<br />التعليم بخير والعدل فى المحاكم بخير<br />رد تشرشل<br />اذن لا تخافوا على بريطانيا طالما التعليم والحق بخير"
archived = "2008-09-14"
capture_url = "https://web.archive.org/web/20080914030000/http://masr.20at.com:80/newArticle.php?sid=17543"
