subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-09-10"
text = "بسم الله الرحمن الرحيم<br />الحمد الله على نعمة الأسلام وكفى بها نعمه والصلاة والسلام على أشرف الأنبياء والمرسلين سيدنا محمد وعلى أله وصحبه وسلم تسليما كثيرا<br />شنودة يعاني من عدوى هربز زوستر الفيروسية التي تؤثر على أشخاص لديهم نقص مناعة خاصة أولئك المصابين بالإيدز الذي ينتشر عادة بين الشواذ جنسياً كما تقول المكتبة الوطنية الأمريكية للطب<br />رابط المكتبه الوطنيه الأمريكيه للطب التي جاء فيها الخبر<br />http://gateway.nlm.nih.gov/robot_pag...102203766.html<br />ترجمة المقال<br />Gateway to the National Library of Medicine<br />U.S<br />البوابة إلى المكتبة الوطنية للطب<br />الولايات المتحدة<br />In order to evaluate the risk of developing AIDS after an episode of H.Z., we studied 134 newly HIV<br />seroconverted patients: 108 (80.6%) men and 26 (19.4%) women<br />لكي نقوم بتقويم خطر تطوير الأيدز بعد نشوء إتش. زد (هربس زوستر ) .، درسنا 134 حالة من حديثي مرضى إتش آي في 108 من الرجال بنسبة (80.6) % و26 من النساء بنسبة (19.4 %)<br />The average time from last negative to first positive HIV test was 6.7 +/- 3.5 months (R.: 1-12).<br />متوسط الوقت بين آخر تحليل سلبي إلى إختبار إتش آي في الإيجابي أولا كان 6.7 +/- 3.5 شهور (آر. : 1-12).<br />When first seen, 23 pts were stage II, and 64 in stage III. The mean follow-up time was 36.4 +/- 20.2 months (R.: 3-74).<br />وجد أولا أن، 23 حالة كانت في المرحلة الثّانية، و64 في المرحلة الثّالثة. وقت المتابعة المتوسط كان 36.4 +/- 20.2 شهور (آر. : 3-74).<br />During follow-up 11 pts (8.2%) had an episode of H.Z.; no correlation was found with age. H.Z. was significantly more frequent in homosexuals (p = .002)<br />أثناء فترة المتابعة 11 مريض بنسبة 8.2 % كان عنده إتش. زد(هربس زوستر).و لم نجد إرتباط بالعمر. و لكن إتش. زد (هربس زوستر ) كان الأكثر تكرارا في الشواذّ جنسيا (p =. 002)<br />A case-control analysis revealed a significant lower number of CD4+ cells in pts at diagnosis of H.Z. compared with pts without H.Z. at equal time from seroconversion (p = .003).<br />خلال تحليل السيطرة كشف عن وجود عدد أقل بكثير من خلايا CD4 + بين المرضى المصابين بالاتش زد (هربس زوستر) . بالمقارنة مع حالات بدون إتش. زد (هربس زوستر) . في مدة زمنية متساوية من (p =. 003).<br />Five pts with H.Z. developed AIDS later on.<br />خمسة مرضى من المصابين بالهربس زوستر (إتش. زد ) تطور إلى مرض الأيدز لاحقا.<br />The estimated risk of developing H.Z. in the cohort was 22% at 62 months from seroconversion; the risk of developing AIDS after H.Z. was 52% at 31 months, 76% at 56 months from H.Z..<br />الخطر المقدر لتطور إتش. زد (هربس زوستر ) في المجموعة الخاضعة للإختبار كان 22 % في 62 شهر من بدء ظهور المرض - و كان خطر تطوره إلى الأيدز بعد إتش. زد (هربس زوستر ) . كان 52 % في 31 شهر و 76 % في 56 شهر من الإصابة بالهربس زوستر ( إتش. زد )..<br />The risk of developing AIDS in pts who manifested an H.Z. was significantly higher than in pts with no episode of H.Z.).<br />خطر تطورالمرضى المصابون بالهربس زوستر إلى الأيدز كان أعلى جدا من المرضى الغير مصابين بالهربس زوستر ( إتش. زد ).<br />The occurrence of H.Z. during the natural history of HIV infection is an important clinical predictor of progression to AIDS..<br />حدوث إتش. زد (هربس زوستر ). أثناء التاريخ المرضي الطبيعي لعدوى الإيدز هو تنبوء سريري مهم من التعاقب إلى الأيدز. .<br />سلسلة فضائح النصارى الحاقدين<br />دفاعاً عن الرسول صلى الله عليه وسلم"
