[[comments]]
order = 11
subject = "بعيد عن شنبة"
author = "مش مهم"
text = "الحكاية انة لاول مرة فى تاريخ مصر تبقى ميزانية وزارة الداخلية اكبر من وزارة الدفاع<br />يعنى الداخلية بتاع ضرب الشعب مهاها كل الفلوس والامكانيات<br />والداخلية هى اللى بتحرس الحدود فى سيناء<br />يبقى الجيش اللى هو خطر على الحكومة فى الباى باى<br />يبقى الداخلية تختار المرشحين فى مجلس الشعب ومجلس الشورى وتنجح اللى هى عايزاة<br />تبقى العملية كلها فى ايد الداخلية<br />والداخلية تقول مين اللى يحكم مصر<br />ان شاء اللة تجيب عسكرى من الامن المركزى يحكم<br />القرار كلة عند اللواء حبيب العادلى<br />وانسى حكاية النقابات والانتخابات ومجلس السياسات كل دة كلام فارغ<br />كل دة تمهيد للاحتلال القادم<br />القوات الدولية فى لبنان وفى العراق وفى السعودية وبقت تحتنا فى دارفور وقريبا جدا فى الخمس سنوات قادمة فى القاهرة<br />ولا عزاء للصراخ"
archived = "2007-08-18"
capture_url = "https://web.archive.org/web/20070818212632/http://masr.20at.com:80/newArticle.php?sid=10923"
