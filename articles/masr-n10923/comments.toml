[[comments]]
order = 8
subject = "جمال مبارك حيكون رئيس مصر ايه المشكلة"
author = "مش ضروري"
text = "جمال مبارك حيبقى رئيس لمصر وعنده حق وما فيش فيها حاجه لان الامور استقرت عندنا نحن العرب بصفة عامه من ايام الخليفة معاوية ابن ابي سفيان ان كل حاكم بيرتب للحاكم اللي بعده سواء كان ابنه او اخوه او حد ثاني لكن لازم الحاكم هو اللي يوصي بالخليفة بتاعه والامور مستقره في مصر على هذا الاساس تاريخيا<br />مفيش غير لما جه جمال عبد الناصر وبرضه هذا القانون مشي وجاب انور السادات وعمله نائب رئيس جمهورية وفهمت الناس ان منصب نائب رئيس الجمهورية يعني انه حيحكم لو الحاكم مات ونفس الحكاية عملها انور السادات جاب حسني مبارك نائب رئيس الجمهورية والله بقى عم حسني من حقه انه يرتب للخليفة بتاعه مثل كل الحكام اللي سبقوه واذا كان الاختيار لابنه مش مشكله<br />لماذا<br />لان حاكم الاردن مات وابنه مسك مكانه ومجراش حاجه<br />حاكم المغرب مات وابنه مسك مكانه ومحصلش حاجه<br />حاكم سوريا مات وابنه مسك مكانه ومحصلش حاجه<br />حاكم البحرين مات وابنه مسك مكانه ومحصلش حاجه<br />حاكم الامارات مات وابنه مسك مكانه ،محصلش حاجه<br />ايه المشكلة المشكلة في مصر<br />ما هو احنا بنظام نائب رئيس الجمهورية ما لناش اختيار<br />ولما يجيب ابنه مالناش اختيار<br />يبقي ايه المشكلة<br />توكلوا على الله وبايعوا جمال مبارك خليفة للرئيس مبارك بس يوعدنا انه يطبق الشريعة الاسلامية"
archived = "2007-07-07"
capture_url = "https://web.archive.org/web/20070707010248/http://masr.20at.com:80/newArticle.php?sid=10923"

[[comments]]
order = 9
subject = "خلاص عيلت ياولاد ال!!! بلد"
author = "محمد"
text = "ده زجل وجدته في مدونة ظريفة اسمها (انا مش سياسي)<br />بابا يابابا<br />ياما نفسي في دروس خصوصية<br />اقتصادات وعلوم سياسية<br />عايز اكون زي حسن نافعة<br />مش زي بتوع السياسات<br />بس ياخايب<br />مش عاجبك تدريسي يابغل؟<br />لأه يابابا<br />بس انت ماعنكش اجابة<br />عن كل اللي محير فكري<br />ايه هو المجتمع المدني<br />ايه لازمة دية النقابات<br />ليه احنا بنحب نزور<br />ونحب كمان الانتخابات<br />ليه الناس عايزة الحرية<br />ليه بيطالبوا بالاصلاح<br />ايه هو الاصلاح اصلا<br />ليه الناس عملوا اعتصامات؟<br />والعمال عاملين اضراب<br />ليه بيقولوا كفاية يابابا<br />ليه الناس رافضة التوريث؟<br />دسترناهم وماهوش عاجب<br />لخبطنا كل القوانين<br />دسنا على المحكمة والقاضي<br />وولاد الرفضي صامدين<br />شوف يابني يازين العرسان<br />اسئلتك مالهومش اجابة غير حاجة واحدة<br />تلاقيها عند الداخلية<br />الشعب عايز ضرب الجزمة<br />ولاتشغل نفسك بسياسة<br />ولاتشغل بالك بالشعب<br />اضرب اسجن عذب اسحل<br />راح تنجح وتسوق الشعب<br />Comments (0)"
archived = "2007-08-18"
capture_url = "https://web.archive.org/web/20070818212632/http://masr.20at.com:80/newArticle.php?sid=10923"

