[[comments]]
order = 0
subject = "الغربه غربة النفس والاحباب"
author = "المكتائبه طول السنة"
posted = "2007-10-21"
text = "انا سعوديه كنت مقيمة بمصر عشت اجمل ايام عمرري ولما جيت السعوديه بداءت احس اني غريبه في كل شيئ حتى في الطعام والشراب انا حاسه بكل شخص مغترب مهما كان احيانا اجد المغتربين العرب والاجانب في السعوديه يشعرو بالسعاده اكثر من اي مواطن لدي صديقات مصريات وعر واجانب ارهم يشعر بالسعاده اكثر مني بجمعتهم واهاليهم وهناك من يشاركهم نفس المشاعر ويشعر بهم اما انا والله كل يوم اشعر بغربه ووحده شديده ضياع انا بصراحه اكتب كلماتي بدموعي والله الاحساس بالغربه في وطنك اسوا ء احساس تشعر انك ضايع انا والله العظيم لااعرف احد يشعر بالغربه والوحده مثلي فلكل شخص يتالم غيري اقول له احمد ربك انت بنعمه انك لاتشعر باحساسي القاتل اتوقف هنا عن الكتابه لاني تعبت... يارب ارحمني برحمتك واجد من يفهمني وارتاح"
archived = "2010-03-14"
