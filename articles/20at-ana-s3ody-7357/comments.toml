[[comments]]
order = 1
subject = "الى المكتئبه طوال السنه(كلنا هذا المغترب)"
author = "نيفين نيفى نوفا"
posted = "2007-10-22"
text = "اولا اتفهم شعورك قليلا لانى اكره الغربه بكل حواسى لانها حرمتنى اناسا يسكنون روحى<br />و فرقتنى عن انسانه من اغلى من لدى ف الوجود بس صدقينى كلنا هذاالمغترب<br />صدقينى لستى وحدك<br />فى داخل كل منا بعضا مما ذكرتيه ف تعليقك و اللى ابكانى فعلا..كلنا هذا الشخص المغترب و ان اختلفت ماهيه الاغتراب"
archived = "2010-03-14"
