subject = "الى اختي نيفين مع التحية"
author = "المكتائبة طوال السنة"
posted = "2007-10-28"
text = "عزيزتي نيفين انا دائما اقراء تعليقاتك واحترم ارائك ولي الشرف ان تتفهمي شعوري وتشاريكيني الاحساس فكم اسعدني جدا تعليقك فعلا احساس الغربة والوحده اسواء شعور ويزداد عندما يفرق بينك وبين اشخاص لم يسكنو قلبك فقط بل سكنو روحي ووجداني اسال الله ان يجمعنا في الجنة والدنيا"
