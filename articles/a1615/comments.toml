subject = "متعوده دايمااااااااااااااا"
author = "ا جماعه ليه كده"
text = "كل مره احنا(العرب)نيجى نتكلم مع بعض فى اى حاجه سواء رياضه أو سياسه او اى حاجه سؤاء كانت مهمه ولا تافهه حتى نشتم بعض ليه كده هو ده اللى دينا امرنا بيه هو ده اسلامنا وبعد كده نيجى نقول ان الحكام مختلفين و ان احنا ممكن نعمل ونعمل ياريت نتحد الاول على الاقل فكريا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152524/http://www.20at.com/article.php?sid=1615"

