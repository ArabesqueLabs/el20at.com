[[comments]]
order = 5
subject = "شكرا"
author = "كرا للانسة اللى كتبت تعليق فوقى لانى انا صاحب التعليق اللى فوقها و شايف انها بطبق الدين بالظبط عشان الدين الاسلامى العظيم مشاركة و ايجابية و هى بتحقق ده"
text = "الستات والبنات و المدامات و الجنس الانثوى عمتا بيمثل 52 فى المائة من الشعب المصرى و الذكور 48 فى المائة بس<br />ولما نطلب من الستات تقعد فى البيوت يبقى لا نسال البطالة جاية منين ده نص المجتمع عاطل ( قصدى البنات ) ومع ذلك مش كل الرجالة فى مصر بيشتغلوا يعنى البطالة فى مصر متفجرة عشان الفكر السلفى المتخلف اللى بينادى بعدم مشاركة المراة<br />المراة نفسها كانت بتشتغل ايام الرسول يبقى نيجى احنا و نتفلسف ونفتى حسب المصلحة و نقول لا الستات لا تشتغل<br />على فكرة انا مسيحى و عايز ايميل الانسة اللى كتبت التعليق اللى فوقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152524/http://www.20at.com/article.php?sid=1615"

[[comments]]
order = 6
subject = "مينا"
author = "صاحبة التعليق اللى بعنوان سمسمة لو انتى بتقصدينى بالاخوة الفاضيين"
text = "يبقى انتى وقعتى فى الغلط اللى انتى حذرتى الكل منه و وهو الخروج عن الموضوع<br />وللاخ اللى بيقول ( هو انتا اللى هتفهمنا ديننا)<br />القران بيقول ( واسالوا اهل الذكر ان كنتم لا تعلمون )<br />طبعا اول حاجة تبادرت لذهنك الضعيف هو انا اقصد نفسى باهل الذكر ( ده لانك عايز تتقاذف الكلام الجارح و مش عايز تقيم حوار و مناقشة سليمة )<br />لا يا سيدى انا لا اقصد نفسى باهل الذكر لكنى على وثيق الصلة بيهم<br />لى صديق فى كلية الشريعة اكتر اوقاتنا بنتكلم فى الدين( كلام مهذب عشان نطلع من المناقشات بحاجة )<br />على فكرة كل ما انا اقله نقطة معينة فى الاسلام عكس ما هو شايفها مش بيضايق ويجعجع ويقولى انتا هتفهمنى دينى<br />لا لا لا الكلام مفتوح طول ما الغرض هو فهم الاخر وياريتك يا اخ تقبل الاخر وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152524/http://www.20at.com/article.php?sid=1615"

[[comments]]
order = 7
subject = "إلى ميــــــنا"
author = "عني مهما عرفت في دينا برضه مش مستعدين نأخذ الفتوى منك لأنه أساسا لو عايزين نأخذها من مسلم مش من أي واحد بنأخذهافما بالك بمسيحي"
text = "شوف يا حبيبي دينا الإسلامي بيحرمش العمل للمرأة لكن إلي بيتحرم الإختلاط , التبرج .. إلخ<br />لكن يعني أحنا لازم نعرف أنو أحنا لو رجعنا لربنا كويس مش حيكون عندنا بطالة لأنو عدم تقوى الله ومشروع السرقة إلي شغال في البلد عامل عندها أنيميا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152524/http://www.20at.com/article.php?sid=1615"

[[comments]]
order = 8
subject = "فكروا في كلامكم"
author = "ايزه اقول لكل واحد بيتكلم عن دينه يا ريت يكون عارف هو بيتكلم في ايه لانه غلط انك تقول فتوى لا يوجد لها اساس من الصحة لان الاسلام لم يمنع الاختلاط حتى ان النساء ايام الرسول(ص)كانوا بيشتركوا في المعارك و الحروب مش بس ممرضات و لكن بيحاربوا ايضا و ماداب الاختلاط بيكون باحترام و ادب فأين المشكلة و لا انتوا عايزين تعملوا مجتمع للنساء و آخر للرجال و بعدين ازاي الرجل حيشوف المرأة علشان يتجوزها ولا يتجوز عمياني"
text = "لازم تفكروا صح و متلزقوش كل حاجة في الاسلام... حرام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152524/http://www.20at.com/article.php?sid=1615"

[[comments]]
order = 9
subject = "الجامعة ومشاكلها"
author = "اليا اذهب الى الجامعة كى اشاهد شاب وفتاة على جنب او اجدهما معا فى المدرج تصاحبهما المناقشات التافهه والذى او التى تقول ان الاختلاط ليس محرما ادليك بغزوات الرسول صلى الله عليه وسلم هذا ليس دليل لانه لا مجال للاختلاط فى ذلك الموقف اصلا فالرجال يحاربون والنساء تداوى الجرحى اما الان فالشباب يتكلم والبنات تستمع او العكس ونسمع من يقول اننا اصدقاء بأدب وفى القرآن الكريم \"ولا متخذات اخدان \"لم تعد هناك صداقة حقيقة بين الشباب وبعضهم فكيف تكون بين شاب وفتاة وما هو تفكيره تجاهك هل يحبك بجد من اجل الزواج ام مجرد وقت يضيع فقط ؟ اما كيف يتزوج هذا الشاب فان كان صادقا يكفى عندما يرى من يحب يذهب بدون تردد كى يتقدم لها اما غير ذلك فقد هدر للوقت وسفسطة لا طائل منها ومن لا تحب الالتزام بأخلاقيات الاسلام فلتتركه وتبحث عن دين اخر يلبى لها رغباتها نحن ننصح من يعترف بالذنب اما من يرفض الاعتراف بعدم شرعية الاختلاط او اى ذنب عموما فحلها كما ذكرت ."
text = "اما بالنسبةلمن يتكلم باسم الاسلام وهو غير مسلم اقول له شكرا على اهتمامك بالدين الاسلامى فهو يستحق ان يهتم به لكن ارجوا منك الا تفتى فى الدين لاننا كشباب مسلم لا نجرؤ على اصدار فتوى او التحدث فى شئ لا نفقهه وشكرا على سعة صدرك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152524/http://www.20at.com/article.php?sid=1615"

[[comments]]
order = 10
subject = "مينا لاخر مرة"
author = "ولا اوكى يا سمسمة انا اسف لانى فكرتك تقصدينى بالفاضيين وانتى مكنتيش تقصدينى"
text = "ثالثا الى الاخ اللى بيقولى احنا مش بناخد النصيحة من اى مسلم فما بالك بالمسيحى ( وطبعا هو بيقصدنى )<br />يا عمنا انتا والله العظيم لم تفهم كلامى<br />وانتا وقعت فى الغلط اللى انا عملت حسابه و هو انك افتكرتنى انى انا بقصد نفسى باهل الذكر مع انى اشرت الى انى مش من اهل الذكر لكنى على وثيق الصلة بيهم<br />يبقى النصيحة مش جايية من مسيحى<br />واهل الذكر اللى انا على وثيق الصلة بيهم صديق ليا محترم مسلم فى كلية الشريعة<br />يبقى النصيحة مش جايية من اى مسلم لا ده مسلم بيتعلم عشان يتخرج و يديك النصيحة<br />ثالثا احب اشكرك على الرد و اسلوب الرد المهذب اللى انتا كلمتنى بيه على طول فى تعليقك و يا رب كدا دايما مع الكل<br />رابعا منع الاختلاط بين الجنسين مسالة مستحيلة على اى مقياس منطقى<br />لان بمجرد تجاوز الفرد مرحلة المراهقة و دخوله مرحلة النضوج الفكرى بيبقى عنده الميل الى مصادقة افراد من الجنس الاخر اكتر من ميلة الى مصداقة ابناء جنسه<br />وعلى فكرة الميل ده مش بيبقى ميل جنسى لا ( الميل الجنسى ده فى مرحلة المراهقة و احنا بنتكلم فى مرحلة النضوج الفكرى وهى اطول مرحلة فى حياة الانسان )<br />الميل ده بيقبى ميل استكشافى اى هو عايز يقتحم حياة الجنس الاخر من باب الفضول بيبقى عايز يعرف بيحبوا ايه بيكرهوا ايه كدا<br />يعنى لما بتمنع الاختلاط بين الجنسين بتبقى بتمنع حاجة طبيعية لازم هتحصل<br />وطبعا انتم مش محتاج افكركم باضرار عدم الاختلاط بين الجنسين<br />الوقوع فى العادات السيئة وده طبعا مفهوم<br />يعنى بنقع فى غلط كبير عشان مش عايزين نغلط خالص<br />ومهما عملتم مستحيل منع الاختلاط اذا كانت السعودية اكثر الدول العربية و الاسلامية تخلفا و تزمتا فيها اختلاط اى نعم على خفيف لكن ده يدل انها فشلت فى منع الاختلاط تماما<br />يبقى الحل هو السماح للاختلاط و لكن يجب مراقبته و توجيهه و الاشراف عليه من قبل الكبار ذوى الخبرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152524/http://www.20at.com/article.php?sid=1615"
