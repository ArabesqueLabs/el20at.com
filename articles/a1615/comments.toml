order = 0
subject = "صيدلة حلوان"
author = "ش عارف والله انا داخل متحمس جدا السنة دى للدراسة زى كل سنة بس الناس السنة دى متغيرين كل واحد عامل لنفسة نيولوك والبنات ملونين السنة دى مع انهم مش كدة طب لية هما بيعملوا كدة على العموم ربنا يستر وأحب اقول للناس الجديدة الى لسة داخلة ان المرحلة دى احلا مرحلة فى حياتك قضيها بمعنى اصح بس متغضبش ربنا بس قضيها فى الذيذ واعرف انك فى كلية لهدف وربنا يوفق جمييعا"
text = "ولو انتا فى كلية صيدلة اى جامعة روح انتحر بسرعة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152524/http://www.20at.com/article.php?sid=1615"

