[[comments]]
order = 0
subject = "س ح م بؤرة فساد كبيرة"
author = "شادي"
text = "يا ريت تيجي بس على تأخر القطارات ساعة ولا اتنين... السكة الحديد بؤرة فساد كبيرة، كل حاجة ماشية غلط، أهم حاجة راحة ركاب المكيف الهاي لايف، ويتحرق ركاب الدرجة التالتة"
archived = "2008-04-26"
capture_url = "https://web.archive.org/web/20080426023946/http://masr.20at.com:80/newArticle.php?sid=15442"

[[comments]]
order = 1
subject = "واية اللى ش خربان فى البلد"
author = "خرابة"
text = "ماهى بقت اسمها الخرابة بتاع البقرة الضاحكة والعجل ابنها<br />الفساد ضرب فى كل مكان<br />عازين حكومة انقاذ وطنى"
archived = "2008-04-26"
capture_url = "https://web.archive.org/web/20080426023946/http://masr.20at.com:80/newArticle.php?sid=15442"
