subject = "بكل سهولة"
author = "مصرى"
posted = "2008-01-13"
text = "الغاء عقوبة الاعدام سوف يترتب عليه مصائب وكوارث منها : أن القتل والسرقة والاغتصاب سوف يكثر فى الدول التى ألغت عقوبة الاعدام ، لأن مرتكب هذه الجرائم يعلم أنه سينجو من العقوبات من خلال إختراق الثغرات التى تملأ القوانين الوضعية التى تحكمنا وحتى إن عوقب فإنه يعلم أنه لن يعدم فتصبح الجريمة سهلة جدا بالنسبة لمحترفى الاجرام ، ثم إن إلغاء عقوبة الاعدام فى الدول الاسلامية معناه تعطيل شرع الله الذى يقول : ( من قتل يقتل ) والله يقول : ( ولكم فى القصاص حياة يا أولى الألباب ) فمعنى إلغاء عقوبة الإعدام أن من يقتل شخصا لن يعاقب بالقتل الذى نص عليه القرءان لحماية أرواح الناس من انتشار القتل ..... فستذكرون ما أقول لكم"
