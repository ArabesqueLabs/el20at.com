subject = "و الة العظيم احنا شعب طيب و فاضى و فارغ وعبيط"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-05"
text = "الاتهام الموجهة ضد المحاسب هشام طلعت مصطفى عضو مجلس الشورى و ضابط امن الدولة(السابق) الفاسد و الغبى والنصاب و القاتل مازال تحت يدى القضاء<br />بدلا من الانتظار لسماع كلمة القضاء العادلة؟<br />تبارينا و تكلمنا و افتينا و حللنا واختلقنا اشياء قصص و حكايات كلها من الخيال المريض الفاضى الذى يعشش بعقولنا الفارغة<br />لنتفرغ لحياتنا و نبحث عن لقمة العيش بدلا من البحث عن فضائح و مصايب الناس<br />اللة يسامح كل الشناتين و الحاقدين و اولهم انا<br />اغفر لى ياللة و سامحنى!<br />انك مجيب الدعاء يارحم الراحمين ( امين)"
