subject = "ضع عنوان التعليق"
posted = "2008-04-06"
text = "وهنا ايضا فى احدى قرى محافظة الشرقية تغيب غالبية التلاميذ عن المدرسة الا القليل جدا منهم وهذة مجرد بداية وان شاء اللة الشعب يفوق من الغيبوبة ال هو فيها منذ اكثر من 56 عام ويستمر فى المطالبة بحقوقة"
