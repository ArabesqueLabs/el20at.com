[[comments]]
order = 1
subject = "المملكة المباركية"
author = "احمد سامح"
posted = "2008-04-06"
text = "المصريون مضربون حتي يتعطف ويتكرم حسني مبارك وجمال مبارك ويوافق علي تحويل مصر الي مملكة حتي يمتد الرخاء اللي ينعم به المصريون الي الاجيال القادمة وعجبي"
archived = "2008-04-09"
capture_url = "https://web.archive.org/web/20080409170859/http://masr.20at.com:80/newArticle.php?sid=15040"

[[comments]]
order = 2
subject = "تمسكوا بحسني مبارك واستفيدوا من تجربة العراقيين"
posted = "2008-04-06"
text = "اسرائيل ورائ الدعوه للاضراب<br />زعزعة نظام حسني مبارك وانهياره معناها الطوفان حيغرق الشعب المصري كله<br />تمسكوا بحسني مبارك واستفيدوا من تجربة العراقيين اللي كانوا بيكرهوا صدام حسين<br />وبعد ما مشي صدام حسين وجاء الطوفان بيتحسروا على انفسهم دلوقتي ويتمنوا ان يرجع صدام حسين"
archived = "2008-04-09"
capture_url = "https://web.archive.org/web/20080409170859/http://masr.20at.com:80/newArticle.php?sid=15040"

[[comments]]
order = 3
subject = "حدائق القبه"
author = "احمد اكرم محمد السيد"
posted = "2008-04-16"
text = "انا كل الا اقدر اقوله الله يعوض على الايام وتسلم روحك يا عرابى انت ومصطفى كامل وصدقونى لو يعرفوا ان الشعب المصرى هيبقا بالضعف ده مكنوش دفعوا عن البلد ولو خيفان من الامريكان ديننا بيقول من قتل يهودى دخل الجنه ومن قتله يهودى دخل الجنه فيا اهلا بالجنه دفعوا عن حققوكم وكفايه سكوت لحد كده الانسان الا حاسس انه مرتاح للعيشه دى ميتكلمش لاكن الا تعبان وبيحب البلد يصرخ ويتكلم لان الساكت عن الحق شيطان اخرس"
archived = "2010-03-14"
