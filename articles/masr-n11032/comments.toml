[[comments]]
order = 0
subject = "لا أفهم"
author = "مسلم"
text = "لا أفهم لماذا لا يقوم القس شنودة بإستخدام سر (مسحة المرضى) أحد أسرار الكنيسة السبعة ليشفي بدلا من كل هذا الجهد والتكاليف والمال في السفر للعلاج بالخارج<br />أفيقوا يا نصارى فنحن نخاف على مصائركم الأبدية<br />الرجل لا يملك لنفسه ضرا ولا نفعا ولم يشف نفسه فكيف يشفيكم"
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130459/http://masr.20at.com:80/newArticle.php?sid=11032"

[[comments]]
order = 1
subject = "نشكر الرب"
author = "كرم"
text = "نشكر ربنا على سلامة قداسة البابا شنودة ونتمنى له المزيد من الصحة والعافية له ولمن مثلة ممن يحيون بالمحبة والعشرة مع الله ...... وردا على الاخ المسلم الخائف على مصير المسيحيين الابدى اقول له : لا تخف علينا ولكن ليس كل ما تطلبة من الله تناله لان ليس كل ماتطلبة يكون خيراً لك....."
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130459/http://masr.20at.com:80/newArticle.php?sid=11032"

[[comments]]
order = 2
subject = "الى الاخ لا افهم"
author = "مصرى"
text = "الى الاخ المبارك (مسلم) شكرا على تعليقك ولكن لك ان تفهم ان سر مسحة المرضى لا يستخدمه القديس لكى يشفى نفسه ولكن لمجد اسم الله اى عندما تمرض انت او اى شخص اخر يعرف معنى سر مسحة المرضى و شكرا"
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130459/http://masr.20at.com:80/newArticle.php?sid=11032"

[[comments]]
order = 3
subject = "ابحث لكى تفهم"
author = "نانسى"
text = "انت مش فاهم لانك مش عارف ابحث ودور واللى يدور يلاقى دور واطلب من ربنا انه يفهمك وصدقنى لو دورت عشان بجد عايز تفهم اكيد هتوصل لنتيجة وساعتها انا واثقة انك مش هتكتب اللى كتبته ده تانى ربنا معاك ويوصلك لطريقه دور بجد لو بتفكر فى الأخرة"
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130459/http://masr.20at.com:80/newArticle.php?sid=11032"

[[comments]]
order = 4
subject = "صعبان عليّ"
author = "............."
text = "فعلاً حاجة مضحكة لما انت تبقى بتقول انك خايف على مصايرنا وانت قرآنك بيقول علينا \\\"لا خوف عليهم ولا هم يحزنون\\\" :)<br />ياريت زى ما قريت وعرفت حاجات عن أسرار الكنيسة تقرا وتعرف حاجات عن دينك... ومش شكرا"
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130459/http://masr.20at.com:80/newArticle.php?sid=11032"

[[comments]]
order = 5
subject = "القطيع الصغير"
author = "بولا"
text = "من أحد القطيع الي راعينا على الارض بعد السيد المسيح اتمنى لك الصحة الكاملة لتكمل رسالتك معنا ورد علي الاخ الذي لايريد أن يفهم ألا ما يريد فهمة أن البابا لايستعمل ألاسرار والمواهب التي يعطية الرب أياها لتخليص نفسة بل ليجعل أسم الرب ممجد ويجعل جميع الناس يفهمون"
archived = "2008-08-02"
capture_url = "https://web.archive.org/web/20080802130459/http://masr.20at.com:80/newArticle.php?sid=11032"
