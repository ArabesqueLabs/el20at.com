subject = "ابحث لتفهم"
author = "مسيحي"
posted = "2008-09-26"
text = "الي الاخ الذي لا يفهم انت لا تفهم شيئا عن سر مسحة المرضي ولا عن المسيحية فلا يصح ان تتكلم هكذا و مش انت اللي هتخاف علينا ولكن خاف علي نفسك الاول و علي مصائرك و شكرا علي محبتك الكبييييييييييييييييرة و علي فكرة خاف من ربنا في الكلام اللي انت بتقوله لاني انا كمان خايفة عليك من عقاب ربنا زي ما انت خايف علي مصاريفنا"
