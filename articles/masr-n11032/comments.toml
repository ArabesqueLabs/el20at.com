author = "مصرى"
posted = "2008-08-12"
text = "اخى العزيز : مسلم<br />عايز اقولك ان انا كنت مثلك فى يوم من الايام ولا افهم شيئا عن المسيحية وكنت فى غاية الجهل وهذا لاننى كنت اسمع فقط ولم ارى من قبل<br />ولكن بعد ذلك قرات وارجو منك ان تقرا انت ايضا لكى تعرف ما هو سر مسحة المرضى<br />(لا تفكر فى الامر كثيرا .. بل دع الامر لمن بيده الامر) من اقوال البابا كيرلس السادس"
