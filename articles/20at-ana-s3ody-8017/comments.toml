[[comments]]
order = 2
subject = "توضيح من كاتبة الروايه"
author = "ناصر"
posted = "2008-01-14"
text = "تلقيت من الكاتبة اميره القحطاني توضيح على ايميلي حول مانشر نصه كالتالي :<br />( وأميرة عاشت قصة حب في عسير قبل الرحيل،تلك الصور المختزلة دفعتها للتعبير عن هذا الكبت العاطفي من خلال\"فتنة\".)<br />استاذ ناصر ..<br />بس لو سمحت لي هذا الكلام الذي كتب في عشرينيات ليس صحيح ولا اعلم من اين اتيت بانني عشت قصة حب في عسير .. اتمنى منك فقط حذف الفقره السابقة كما ان الفقرة التاليه ايضا تم ذكر ( الاف النسخ ) وانا لم اذكر هذا .<br />النقطة الاخيرة انني اماراتية ولست سعودية والدي فقط جذورة من السعودية وتحديدا المنطقة الجنوبية .<br />مع التحية والتقدير والشكر الجزيل على جهودك .<br />( واعتبرت أميرة في حديثها لـ\"عشرينات\" أن روايتها التي وزعت آلاف النسخ \"خطوة أولى )<br />مع التقدير : ناصر القحطاني"
archived = "2010-03-14"
capture_url = ""

