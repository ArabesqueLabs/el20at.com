text = "الله يعينكوا يا شباب والله انا عارفة بحالكوا يمكن لاني بشوف شباب عيلتي الي بغزة متلكوا بيتعزبوا بس ما باليد حيلة ونحنا دايما بندعيلكوا وبندعي على الي كانوا السبب ...الله يوفقكوا لتصلحوا البلد وما تستسلموا لانكوا انتو شباب المستقبل...<br />مع تحياتي:هايدي"
