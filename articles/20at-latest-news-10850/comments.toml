subject = "اعتراف موقع عشرينيات بأسرائيل"
author = "مسلم"
posted = "2009-01-01"
text = "الواضح من نقل هذا الخبر وكأن القائمين على الموقع لايفرقون بين ماهو فلسطيني وماهو يهودي محتل مغتصب للأرض .<br />المعروف عند المسلمين ، أن اليهود المحتلين يغصفون غزة ويحاولون تدمير القطاع وقتل من فيه من المسلمين و إرعابهم<br />لماذا تقومون بنقل الموضوع وكأن اسرائيل صاحبة حق في ما تفعل .<br />سبحان الله تتكلمون على الناس وانتم مرقعين من الداخل والخارج."
