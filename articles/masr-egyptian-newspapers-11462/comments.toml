subject = "المخابرات الاسرائيلية وراء دعاوي حقوق الاقباط البا"
author = "مش كاتب"
posted = "2009-03-03"
text = "اريد ان اوضح هنا ان من حوالي 50 سنه كانت مصر محتلة من قبل بريطانيا كما تحتل امريكا العراق الان<br />واريد ان انوه هنا ان بريطانيا كانت تحتل فلسطين وقامت بتسليمها لليهود دون حياء او خجل<br />واريد ان انوه هنا ان امريكا احتلت العراق وقامت بتسليمها للشيعة<br />فعندما كانت بريطانيا محتله مصر لو كان هناك اقباط بالعدد الذي ابرزه المقال وهو 15 مليون لكانت قسمت مصر دولتين كما سلمت فلسطين لاسرائيل<br />واريد ان انوه هنا ان عدد الاقباط لا يتعدى 4 ملايين باي حال من الاحوال<br />ولو نفترض جدلا ان عدد الاقباط في مصر 15 مليون وسكان مصر 80 مليون<br />يعني 75 مليون على 15 مليون يعني خمس عدد السكان<br />يعني كل سته ماشين في الشارع فيهم واحد مسيحي<br />يعني كل 6 شقق في مصر فيهم شقة مسيحية<br />يعني كل 6 طلاب في مصر فيهم طالب مسيحي<br />وهذا غير حقيقي على الاطلاق فالفصل فيه 50 طالب بيكون فيه 4 او خمس طلاب مسيحيين<br />فكون ان الاقباط 15 مليون هذا هراء وتخريف ويقال ان الحكومة المصرية لا تريد اعلان عدد الاقباط الحقيقي لعدم احراج الاقباط<br />ولو كان فيه اقباط اصلا ايام الاحتلال البريطاني كانت بريطانيا سلمتهم حكم مصر او على الاقل قسمت مصر<br />لان عدد الاقباط لا يسمح باي حال من الاحوال بأن يكون لهم اي حقوق<br />واريد ان انوه هنا ان الاقباط المصريين افضل اقلية في العالم كله<br />وهم الطبقة البرجوازية في مصر واغنياء ويعيشون في افخم احياء مصر ومسيطرين على التجارة وتجارة الذهب<br />والمشكلة تكمن في تحريك اسرائيل لقلة من الاقباط لزعزعة امن مصر"
archived = "2010-03-14"
capture_url = ""

