[[comments]]
order = 2
subject = "اذل الاقباط الشعب المصرى تحت حكم العرب والفاطميين"
author = "مصرى"
posted = "2009-03-03"
text = "نعم استعبد الاقباط الشعب المصرى اكثر من 2000 سنة<br />اولا كلمة اقباط اصلها يونانى اجيبتوس وهم اليونانيون او الرومان الذين يعيشون فى مصر ويقومون بجباية الضرائب وجمع الجزية للحكام ايا كانوا عربا او رومان او مماليك او اتراك<br />عندما دخل عمرو بن العاص مصر بخمسة الاف عربى فى بلد تعدادة 8 ملايين مصرى جلس بخمس الاف عربى فى الفسطاط - وترك امور الادارة وجمع الجزية كما كانت ايام الرومان<br />كان الملتزم القبطى حولة قوة من الاقباط ينزل بها الى القرى ليجمع الجزية والضرائب وويل للفلاح الذى لا يدفع - كان الضرب بالسياط والقتل احيانا ومصادرة ممتلكاتة بواسطة هذا القبطى الملتزم<br />كان رعب الفلاح المصرى من الملتزم القبطى واذلالة لة رهيبا<br />وتحفل قصص التاريخ بقصص التعذيب للفلاحين على يد الملتزم القبطى الذى يجمع الدنانير والحبوب من الفلاح المسكين ثم يسرق نصفها ويرسل الباقى الى الحاكم فى العاصمة<br />حتى اتى حكم محمد على باشا من 200 سنة واوقف وظيفة الملتزم وابعد الاقباط عن الجباية وجمع الجزية<br />تاريخ اسود لهؤلاء الاقباط ذو الاصل الرومانى فى معاملة الشعب المصرى واذلالة<br />ومع ذلك يقولون انهم مظلومون ولاد الكلب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "المذهب القبطى مذهب هدام فى نظر الغرب"
author = "لية"
posted = "2009-03-03"
text = "حينما اتى لويس التاسع ملك فرنسا لغزو مصر وهاجم دمياط واحتل دمياط وتقدم فى اتجاة المنصورة فى طريقة الى القاهرة<br />وطبعا هزم فى المنصورة وتم اسرة وحبسة فى دار ابن لقمان<br />ماذا فعل لويس التاسع بعد احتلال دمياط ؟<br />الغريب انة لم يدمر المساجد<br />ولكنة دمر كنائس الاقباط واحرقها وسوى بها الارض لانها فى نظر الفرنسيين ملة ضالة وخارجة عن الدين المسيحى<br />والقارىء للتاريخ فى تلك الفترة يرى عجبا<br />وتركزت فى العصر الحديث دعاوى التبشير فى مصر - والتبشير ليس تحويل المسلمين الى نصارى ولكن لتحويل ملة القبط الى كاثوليك او بروتساتنت<br />وتوسل البابا وقتها الى الحاكم حتى يوقف بناء كنائس المذاهب الاخرى للبروتستانت والكاثوليك التى تبشر الاقباط وتحولهم الى مذهبها حتى صدر الفرمان الهمايونى بناءا على طلب الاقباط بعدم بناء كنائس الا بتصريح من الدولة<br />اذن الفرمان الهمايونى صدر بضغط من الاقباط والحاح ليمنعوا بناء كنائس البروتستانت والكاثوليك حتى لا يتم تحويل ملتهم الارثوذكية الى الملل الاخرى<br />والان يشكون من الفرمان الهمايونى<br />هل رايتم اجرام اكثر من هذا<br />متخصص فى شؤون الجماعات القبطية الارهابية"
archived = "2010-03-14"
