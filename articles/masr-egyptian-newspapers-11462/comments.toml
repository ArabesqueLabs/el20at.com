[[comments]]
order = 4
subject = "الخطيئة الأولى"
author = "Ashour"
posted = "2009-03-10"
text = "\" الخطيئة الأولى \" ..<br />بقلم الدكتورة زينب عبد العزيز<br />أستاذة الحضارة الفرنسية<br />عقيدة \"الخطيئة الأولى\" من أهم عقائد اللاهوت المسيحى، ويختلف مفهومها من مذهب إلى آخر. ففى الكاثوليكية تعد عقيدة \"الخطيئة الأولى\" عقيدة أساسية إذ أنها، كما يعرّفها بابا الفاتيكان فى مواعظه الأسبوعية، شديدة الإرتباط بعقيدة الفداء وتفسر معنى النعمة الإلهية فى المفهوم الكنسى، بمعنى : \" أن الإنسان يتحد بالله – الذى لا يمكنه أن يراه، بفضل النعمة \" .. ولا يمكن لشىء أن يهدم هذا الإتحاد، لكن الإنسان بحريته يمكنه رفض هذه النعمة أو إتلافها. والخطيئة هى كل ما يمكنه \"أن يهدم أو يمنع هذا الإتحاد بالله الذى بدونه لا يمكن للإنسان أن يحقق نفسه بالكامل للحصول على الخلاص وعلى الحياة الأبدية \" .. وهذا المعنى تكميلى ل \"الخطيئة الأولى\" التى إقترفها آدم، كما يقولون، والتى ادت الى سقوط الخليقة، لذلك يولد البشر فى حالة خطيئة بالوراثة فى المفهوم الكنسى.<br />وما لفت نظرى إلى هذه العقيدة هو تناول البابا بنديكت 16 موضوع الخطيئة الأولى ثلاث مرات متتالية فى الثالث والثامن والعاشر من شهر ديسمبر 2008 ، وذلك على حد قوله : \" لأهمية هذه العقيدة ، فلولاها تفقد المسيحية قاعدتها الأساسية \" !. وفى إحتفاله بعيد \"الحمل العذرى\" يقول أن هذا العيد يكشف لنا حقيقتان أساسيتان بالنسبة لإيماننا : أولا الخطيئة الأولى ، ثانيا الإنتصار الذى حققه المسيح على هذه الخطيئة \". ثم يتمادى فى الخلط بين الموضوعات إعتمادا على أول ثلاثة إصحاحات فى سفر التكوين ، ليشير إلى : \" أن وجود ما تطلق عليه الكنيسة الخطيئة الأولى شديد الوضوح بصورة ساحقة لا نقاش فيها \" ..<br />ويزايد البابا فى وجود الشر فى قصة الخليقة وسقوط أجدادنا آدم وحواء فى الخطيئة ليصل إلى قيمة السيدة مريم \" أم الفادى ، أم الله الذى أهان نفسه إلى أقصى حد ليعيد إلينا كرامتنا الأولى\" ، موضحا أن \"أم الله\" هذه هى \"حواء الجديدة ، زوجة آدم الجديد التى كان مقدرا لها أن تصبح أم كل البشر المفتدين\" !. وانطلق فى التشابه بين آدم والمسيح ليلحظ أمران : \" أن تاريخنا الإنسانى ملوث منذ بدايته من كثرة التعسف فى استخدام الحرية \" و \"ان هناك بداية جديدة فى التاريخ، وهذا التاريخ يوجد فى يسوع الذى هو إنسان والله ، ومع يسوع الآتى من الله يبدأ تاريخ جديد مبنى على قبوله امر الله\". ولا ندرك كيف يمكن للحرية أن تلوث التاريخ الإنسانى، ما لم يكن القصود ترسيخ دور الكنسيين وأن تستمر محاكم التفتيش بمجازرها إلى الأبد ؛ كما لا يمكننا فهم كيف يمكن ليسوع أن يكون \"إنسانا والله ، وان يأتى من الله \" ؟! ويجاهد البابا لفرض هذا الخلط الغارق فى الكفر والإلحاد على العالم وعلى المسلمين !!<br />وبرجوعنا إلى الإصحاحات الثلاثة الأولى، لسفر التكوين، التى إعتمد عليها البابا فى مواعظه هذه، وخرج منها باستنتاجاته ، نلاحظ فى الإصحاح الأول : \"وقال الله نعمل الإنسان على صورتنا كشبهنا. فيتسلطون على سمك البحر وعلى طير السماء وعلى بهائم الأرض وعلى جميع الدابابات التى تدب على الأرض. فخلق الله الإنسان على صورته.على صورة الله خلقه ذكرا وأنثى. خلقهم وباركهم الله وقال لهم إثمروا وأكثروا واملأوا الأرض\" (26-28) .<br />والواضح من الإصحاح الأول أنه لا توجد به كلمة خطيئة ، كما نفهم منه أن الله خلق الذكر والأنثى معا و\"على صورته\" ، كما يقول النص، وباركهما وطلب منهما ان يثمروا ويكثروا ويملأوا الأرض بذريتهما.<br />أما الإصحاح الثانى فنطالع فيه ان \"الله\" قد أصبح إسمه \"الرب الإله\" ، وأنه \"جَبَلَ آدم من تراب ونفخ فى أنفه نسمة حياة فصار آدم نَفْسَا حية \" (7) ، ثم غرس الرب الإله جنّة فى عدن شرقاً ووضع هناك آدم الذى جبله وأنبت من الأرض كل شجرة شهية للنظر وجيدة للأكل، ووضع وسط الجنة شجرة الحياة وشجرة معرفة الخير والشر.. ثم أخذ الرب الإله آدم ووضعه فى جنة عدن ليعملها ويحفظها وأوصى الرب الإله آدم قائلا من جميع شجر الجنة تأكل أكلا وأما شجرة معرفة الخير والشر فلا تأكل منها لأنك يوم تأكل منها موتا تموت (15-18).. والملاحظ هنا ان التحذير موجه لآدم لأن حواء لم تكن قد خُلقت بعد، وأن المسيحية منذ أولى خطواتها تفرض على الأتباع عدم إعمال العقل لعدم التمييز بين الخير والشر ..<br />ونغض الطرف عن التناقض فى ان الله قد خلق الذكر والأنثى معا وباركهما وطلب منهما ان يملأوا الأرض بذريتهما، فى الإصحاح الأول ، ثم نراه يخلق آدم وحده ويضعه وسط الجنة وحده ليعمل بها ، إلا أننا لانفهم كيف يمكن للمعرفة أن تقتل قتلا ! وهو ما يفسر موقف الكنيسة من العلم ومحاربتها للعلماء على مدى مسيرتها الدامية، لذلك عُرفت تلك المسيرة بعصر الظلمات ..<br />ثم حاول الرب الإله – كما يقول النص فى الإصحاح الثانى، أن يجد أنيسا يؤنس وحدة آدم، \" فأوقع الرب الإله سباتاً على آدم فنام. فأخذ واحدة من أضلاعه وملأ مكانها لحما. وبنى الرب الإله الضلع التى أخذها من آدم إمرأة وأحضرها إلى آدم. فقال آدم هذه الآن عظم من عظامى ولحم من لحمى. وهذه تدعى إمرأة لأنها من إمرءٍ اُخذت. لذلك يترك الرجل أباه وأمه ويلتصق بامرأته ويكونان جسداً واحداً (21-24).<br />ولا ترد بهذا الإصحاح أيضا أية إشارة إلى كلمة خطيئة. وإذا ما استرجعنا الإصحاح الأول نرى أن الله قد خلق الذكر والأنثى \"على صورته\" وباركهما وطلب منهما أن يثمروا ويكثروا. وما أن نطالع الإصحاح الثانى حتى نجد تناقضا واضحا إذ ان الرب الإله خلق آدم وحده، ثم خلق الجنة ووضع وسطها شجرة الحياة وشجرة معرفة الخير والشر. ووضع آدم وسطها وحرّم عليه الأكل من شجرة معرفة الخير والشر. ولا توجد أية إشارة ان المقصود من هذه الشجرة هو \"العلاقة الجنسية\" كما تم تحريفها عمداً. وعلى عكس الإصحاح الأول، حيث خلق الله الذكر والأنثى معا، قام الرب الإله بخلق آدم وخلق الجنة والأشجار ثم أنامه وأخذ ضلع من ضلوعه وملأ مكانه لحماً، ثم اخذ الضلع وكساه لحما وجعلها إمرأة وقدمها لآدم !<br />وهنا نتساءل: لقد كان آدم نائما حينما أخذ الرب الإله ضلعا من ضلوعه، فكيف عرف ان هذه المرأة عظمة من عظامه ولحم من لحمه ؟ علما بأن لحم هذه المرأة لم يكن من لحم آدم إذ يقول النص : \" فأخذ واحدة من أضلاعه وملأ مكانها لحما\" ، وهذه خطوة والخطوة الثانية هى : \"بنى الرب الإله الضلع التى أخذها من آدم إمرأة وأحضرها الى آدم\" ، أى ان لحم هذه المرأة من خلقة الرب وليست من لحم آدم كما يدعى النص !.<br />والأكثر دهشة من ذلك أن نجد آدم، أول البشر وأول الخليقة، يقول بفصاحة كاشفة للتحريف: \"لذلك يترك الرجل أباه وأمه ويلتصق بإمرأته ويكونان جسداً واحداً \" !! فكيف لهذا الآدم ان يدرك بفصاحته ويتحدث عن الأب والأم وهو أول خلق الله ولا أب له ولا أم بل ولا ذرية بعد ليعرف ان هناك ما يطلق عليه أبوة وأمومة ؟! ألا يبدو واضحا أن هذا التلاعب بالنص وهذا الحشر كل المقصود منه هو تدعيم فكرة تحريم الطلاق، ذلك التحريم الذى إبتدعته الكنيسة وفرضته قهراً ؟!. وهو ما يفسر كيفية تراكم الإضافات وفقا للأهواء والظروف، على مر العصور ..<br />ويدور الإصحاح الثالث حول موضوع الحية التى أغرت حواء بالأكل من الشجرة بعد ان أوضحت لها ان الرب منعهما لكى لا تنفتح أعينهما ويكونان \"كالله عارفين الخير والشر\" (5).وما أن أكلا حتى انفتحت أعينهما وعلما انهما عرايا \"فخاطا أوراق تين وصنعا لأنفسهما مآزر\" (7). ولا نعرف من أين أتيا بالخيط والإبرة لخياطة ورق التين السميك الذى ينشق ما ان ينثنى.. ثم سمعا صوت الرب الإله ماشيا فى الجنة فاختبأ ، وتبادلا التهمة حتى اوصلاها للحية، ثم صنع الرب الإله لآدم وإمرأته أقمصة من جلد وألبسهما\" (20) !وهو ما يتناقض مع مقولة غضبه وطرده لهما، كما لا يمكن لعاقل أن يتصور ان الله يعمل ترزيا لآدم وحواء !<br />وينتهى الإصحاح الثالث هو أيضا دون إشارة إلى كلمة خطيئة، إلا أن \"الله\" يقول عبارة كاشفة هادمة لفكرة التوحيد التى يزعمونها فى المسيحية الحالية : \"وقال الرب الإله هو ذا الإنسان قد صار كواحد منّا عارفا الخير والشر والآن لعله يمد يديه ويأخذ من شجرة الحياة أيضا ويأكل ويحيا إلى الأبد\" (22) ! وينتهى الإصحاح الثالث بآية \"فطرد الإنسان وأقام شرقى عدن الكروبيم ولهيب سيف لحراسة طريق شجرة الحياة\" (24)..<br />ونخرج من الآية 22 بنقطتين : الأولى، أن الرب الإله يؤكد ان هناك عدد من الآلهة وخشى ان يصبح الإنسان \"كواحد منّا\" ، أى من جماعة الآلهة ، وهذه الآية وحدها تنفى مزاعم الكنيسة بأنها ديانة توحيدية، حيث ان العهد الجديد جزء مكمل للعهد القديم والإثنان يكونان كتابا واحدا .. أما النقطة الثانية فهى أن \"الله\" خشى أن يأكل آدم من شجرة الحياة ويحيا إلى الأبد كالآلهة ؛ وهو ما ينفى فكرة الفداء والحياة الأبدية للبشر، كما تزعم الكنيسة، بما ان النص يحرّم الحياة الأبدية على البشر إذ أقام الرب حراسة مشددة بالسيف والنار على شجرة الحياة، وبالتالى يكون فداء يسوع باطلا بما انه مخالف لمشيئة الله ..<br />وبالرجوع إلى المراجع والموسوعات تبيّن أن القديس أغسطين هو الذى إبتدع هذا التحريف فى القرن الرابع، وأقره مجمع قرطاجنة عام 418 بخطاب من البابا زوزيموس (Zosime). وتقنين هذه العقيدة يرجع إلى قراءة غير سليمة لرسالة بولس إلى أهل رومية (5 : 12) التى فسرها أغسطين، فى معركته ضد القس بيلاجيوس، الذى كان يؤمن بأن الخليقة طيبة، بينما كان أغسطين يؤيد نظرة بولس التشاؤمية. ولم يكن بولس يتحدث عن إقامة عقيدة ما وهو يتحدث عن آدم وخطيئته مثلما راح يؤكدها أغسطين ، الذى أوضح ان الخطيئة تتوارث، بناء على الترجمة الخاطئة للقديس جيروم، عندما قرنها بخطيئة الجسد. فكلمة malus باللاتينية تعنى شجرة محرمة وشجرة تفاح، فدمج المعنيان. وهذا التعريف يتناقد مع نص سفر التكوين الذى يتحدث عن الشجرة الممنوعة وانها تعنى شجرة معرفة الخير والشر تحديدا ، وهى عبارة لا يمكن ان تعنى شىء آخر سوى الضمير، الضمير الإنسانى الذى يفرق بين الإنسان والحيوان..<br />ولم يتوقف الجدال حول هذه العقيدة المختلقة بين رجال اللاهوت، حتى فرضها مجمع ترانت سنة 1546، الذى فرض توريث هذه الخطيئة لكافة البشر وأنه لا يمكن إلا للمسيح ان يرفعها. ويقول القرار : \"ان المجمع يأمر ويقر ويعلن ما يلى فيما يتعلق بالخطيئة الأولى: أن الخطيئة توّرث جيلا بعد جيل حتى الأطفال\" !. ووفقا لهذه القعيدة فإن كل إنسان يولد فى حالة خطيئة لمجرد أنه من ذرية آدم !. وقرارات مجمع ترانت هى النصوص الوحيدة التى قامت بتعريف هذه الخطيئة لربطها بالجنس وفرضت اللعنة على كل من لا يؤمن بها أو يخالفها ..<br />أما المعاصرون فيقرأون سفر التكوين ويندهشون كيف أمكن لأغسطين أن يفهم بهذه الكيفية التحريفية ويقحم فكرة الجنس، ويربط بين النص وأقوال بولس، الذى كان يتحدث عن الشرع كحد فاصل بين الخير والشر !. وحتى مع وجود تناقض شديد الوضوح بين الآيات فيما يتعلق بتوارث الخطيئة، إذ ان سفر التثنية يقول : \"أنا الرب إلهك إله غيور أفتقد ذنوب الأباء فى الأبناء وفى الجيل الثالث والرابع من الذين يبغضوننى\" (5 : 9)، بينما نطالع فى حزقيال : \"النفس التى تخطىء هى تموت. الإبن لا يحمل من إثم الأب ولا الأب يحمل من إثم الإبن. بر البار عليه يكون وشر الشرير عليه يكون\" (18 : 20) !. وعلى الرغم من هذا التناقض فلا يوجد نص يورث الخطيئة على كل البشر إلا القرارات الكنسية التى تعدّل وتبدّل وتفرض وفقا للأهواء ..<br />وفى عام 2007 صدر للدكتور فيتو مانكوزو (Vito Mancuso) أحد علماء اللاهوت كتابا بعنوان \"الروح ومصيرها\" يفند فيه عقيدة \"الخطيئة الأولى\" و \"عقيدة الخلاص\" و\"بعث يسوع\"، إعتمادا على ان الإنسان يمكنه إنقاذ نفسه بعمله وبعقله وليس بالنصوص والعقائد المحرفة !. وقد أعيد طبعه سبع مرات وبيع منه ثمانين الف نسخة، وفقا لموقع الفاتيكان، وهو رقم مبهر بالنسبة لكتاب فى اللاهوت. وفيتو مانكوزو يقوم بتدريس مادة اللاهوت الحديث فى كلية الفلسفة بجامعة القديس روفائيل فى مدينة ميلانو، وحاصل على الدكتوراه فى اللاهوت من الجامعة البابوية فى لاتران !..<br />ولا نفهم ما هو الإنتصار الذى حققه يسوع عليه السلام على الخطيئة، وكيف يولد البشر فى حالة خطيئة بالوراثة، وكيف يمكن ان يكون ما تطلق عليه الكنيسة شدة وضوح الخطيئة بصورة ساحقة لا جدال فيها، وكل الفكرة من أساسها مبنية على خطأ فى القراءة وخطأ فى الترجمة وخطأ فى التفسير، وخاصة غياب نص صريح فى الكتاب المقدس برمته يتناول هذه العقيدة، المختلقة فى خضم صراعات لاهوتية ممتدة، بين رجال اللاهوت وسلطة المؤسسة الكنسية وسلطة الدولة، منذ إختلاق هذه العقيدة وفرضها حتى يومنا هذا ..<br />وردا على ما يؤكده البابا بنديكت 16 فى مواصلته لترسيخ هذه الفريات قائلا : \"لولا عقيدة الخطيئة الأولى تفقد المسيحية قاعدتها الأساسية \" ، لا يسعنا إلا أن نقول : إذا كانت المسيحية قائمة على عقيدة بمثل هذا التلفيق، المعتمد على التحريف والفرض قهراً وقمعاً على مر العصور ، رغم ثبوت زيفها، فلا شك فى أن المسيحية الحالية قد فقدت فعلا قاعدتها الأساسية بجدارة لا نقاش فيها لأنها قائمة على أكاذيب متراكمة!"
