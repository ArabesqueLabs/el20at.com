text = "تبرع لمؤسسة الأقباط لحقوق الأنسانأنقر هنا للتبرع باستخدام البطاقة الائتمانية<br />نظرا لأن البعض وجد صعوبة في التبرع للموقع حتى يستمر في أدائه المميز ويتطور لمواكبة المتطلبات التقنية، فيمكنكم من الآن التبرع باستخدام البطاقة الائتمانية. ودائما معا حتى نستطيع أن نكون صوتا لكم مسموعا في داخل مصر وخارجها، لمصر أولا ومستقبلها بأقباطها ومسلميها وإذا كان لك استفسار فقم بالاتصال بنا عن طريق البريد الإلكتروني ezb@copts-united.com<br />للتبرع بشيك المراسلة على العنوان التالى :Coptic Foundation For Human Rights:<br />The Account No. UBS Kontokorrent<br />Private CHF Konto-Nr. 230-443160.01A<br />Kunden-Nr. 230-443160<br />IBAN: CH10 0023 0230 4431 6001 A<br />BIC: UBSWCHZH80A Swift.-Nr. 431842"
