[[comments]]
order = 1
subject = "بعد الدكتور عبد الحليم محمود رحمة اللة لا يوجد شيخ"
author = "سعيد"
posted = "2008-12-03"
text = "هو الراجل كان فاكر ان بريز دة هو بتاع البهاريز اللى بتتحط على وش الفتة والا بريز دة بتاع البرايز اللى بتتوزع اكرامية<br />على العموم بريز هيعمل حلقة ذكر وحضرة فى مولد ابو حصيرة وهيفرق فتة ولحمة راس - ابقى احجز يا مولانا وقابل بريز هناك"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235526/http://masr.20at.com:80/newArticle.php?sid=18721"

[[comments]]
order = 2
subject = "احتروا شيخ الازهر يا مسلمين كما يحترم النصارى البا"
author = "مش ضروري"
posted = "2008-12-04"
text = "كون ان شيخ الازهر صافح رئيس اسرائيل فهذا شيء طبيعي لكن شيخ الازهر كان في مؤتمر اسمه حوار الاديان وكل اعضاء المؤتمر لابن ان يكونوا حسني النية ودا موضوع طويل يطول شرحه<br />والخطورة لا تكمن هنا<br />الخطومة تكمن في الاستهزاء بعلماء الدين/// استهزاء المسلمين بعلماء دينهم هذا هو مكمن الخطر<br />شوفواالنصارى بيعتقدوا في باباواتهم ايه<br />يقولون ان الله يبارك في السماء اعمالهم على الارض<br />يعني اي عمل يعملوا البابا شنوده الرب يباركه في السماء<br />والله عندهم لا يغفر الذنب الا اذا غفره القسيس اولا<br />فعيب عليكم يا مسلمين لما تستهزؤو بعلماء دينكم<br />فشيخ الازهر عالم جليل ومفسر للقران ولكن ما ذنبه اذا كان الحاكم حول منصب شيخ الازهر الى منصب سياسي<br />يعني شيخ الازهر مثله مثل اي وزير لابد ان يقوم بتنفيذ اي عمل يكلف به من قبل الحكومة<br />سلام"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235526/http://masr.20at.com:80/newArticle.php?sid=18721"

[[comments]]
order = 3
subject = "الله يلعن ابو الذل!"
author = "ahmed ali"
posted = "2008-12-04"
text = "ياعم الفقهاء على دين سلاطينهم. تعساً لك يا زمن. السيد الرئس يساند الجهد الدولي لمنع ايران من السلاح النوي و كل يوم يصافح رؤساء الكيان الصهيوني و يشدد الخناق على اهل غزة و وزير خارجيته يهدد بالرد بعنف على اهلها لو فكروا يعبروا الحاجز.السلام عليك يا حبيبى يا ابا عبدالله الحسين ابن علي حفيد رسول الله حيث قلت في كلمات قليلة سطرت بماء الذهب حينما كان يخاطب جيوش يزيد بن معاوية بن ابي سفيان عندما لحقوه لقتاله في العراق ( ان لم تكونوا احراراً في دينكم, كونوا احراراً في دنياكم ). الله يلعن ابو الذل!"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235526/http://masr.20at.com:80/newArticle.php?sid=18721"

[[comments]]
order = 4
subject = "يا شيخ أرحمنا"
author = "فتاه من الصعيد الجانى"
posted = "2008-12-05"
text = "لو كان فعلا مايعرفهوش تبقى مصيبه أن شيخ الأزهر مايعرفش رئيس أكثر الدل عداوه للأسلام<br />أما أذا كان بيعرفه تبقى المصيبه أكبر لأن يبقى شيخ الأزهر بيكدب وعارف أنه عمل حاجه غلط<br />قال زعلان أن حماس منعت المسلمين يحجو<br />طيب ماللى أنت بتصافحو ده يا مولانابيموت كل يوم عشرات المسلمين<br />لكم الله يا أهل فلسطين بين نار المعتدى وقسوه الأخ وفساد أبن العم"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235526/http://masr.20at.com:80/newArticle.php?sid=18721"

[[comments]]
order = 5
subject = "ما اجل اللة (احترموا شيخكم امام الازهر) حتى نحتركم"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-12-06"
text = "شيئى غريب حقا؟<br />ما المشكلة اذا كان الامام شيخ الجامع الاذهر كان قد صافح بيريز او لم يصافحة!!!<br />باللة عليكم كفى تخلف و عصبية و عنصرية؟<br />عيشوا الواقع و بلا تخاريف و احلام مرضى عنصريين متخلفين ثقافيا و عقائديا<br />انكم حقا مرضى(متاسلمين)<br />احترم الامام الاكبر شيخ الجامع الاذهر واشكر لة تصرفة المتحضر؟<br />لعنكم اللة ايها المتخلفون!!!<br />هااااااهااااااااهاااهاهاهههههههههههههههههههههههههههههههه<br />ضحكتم الحيوانات على تخلفكم دنيا و اخرة"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235526/http://masr.20at.com:80/newArticle.php?sid=18721"

[[comments]]
order = 6
subject = "(نقضة سوداء)"
author = "ممدوح زكى زخارى جرجس"
posted = "2008-12-06"
text = "اولا يجب الفصل بين الدين و السياسة<br />اليهودية ديانة مثل الاسلام و المسيحيى<br />اما العنصرية لعنها اللة فانها منهج استبدادى عنصرى<br />افهموا يا ...........؟!!!<br />الشهادة لللة عز و جل ان تصرف الامام الاكبر شيخ الجامع الازهر كان خير دليل عملى على ثقافة و تسامح الاسلام ديانة و عقيدةو تاريخ<br />كفى تخلف و هجوم شرس على رجل دين اسلامى مستنير مثقف متحضر عالم<br />اتفوا على الحقد اللى جاعل حياتكم وعقلياتكم متخلفة مليئة بالحقد الاسود؟"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235526/http://masr.20at.com:80/newArticle.php?sid=18721"

[[comments]]
order = 7
subject = "(أتقوا اللة فى أسلامكم و مصريتكم و انسانيتكم)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-12-06"
text = "حرام عليكم هذا الكفر و الغباء<br />أتقوا اللة<br />(من يتقى اللة)<br />(يجعل اللة لة فى الدنيا مخرجا)<br />لم يجرم شيخنا الجليل الامام الاكبر (شيخ الجامع الازهر)<br />تصرف تصرف الشجعان و الحكماء و العظماء!!!<br />نحن فى زمن التحضر و لسنا فى زمن التخلف؟<br />أتفوا على اهاليكم اللى معرفتش تخليكم تفهموا يا حيوانات"
archived = "2008-12-06"
capture_url = "https://web.archive.org/web/20081206235526/http://masr.20at.com:80/newArticle.php?sid=18721"

