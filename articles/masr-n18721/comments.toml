author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-12-08"
text = "سامحونى و مليون الف عفوا<br />أقصد ارق الامنيات و التهانى بعيد(الاضحى المبارك)<br />و كل سنة و الجميع بخير مسلمين مصريين و مسحيين مصريين و مصرنا ايضا بخير<br />جعل اللة جميع اعيادنا بخير و سلامة و سعادة"
