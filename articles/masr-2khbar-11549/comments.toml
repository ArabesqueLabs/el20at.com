author = "سيد ابو حفيظه"
posted = "2009-03-16"
text = "انا شايف ان الحكومة المحترمه اللي ما بتسرقش شافت ان الوزير كان بيسرق وبينهب فلوس الدوله الانتيكيه.طبعا مولانا نظيف الورع(صاحب 4بنوك في سويسرا)طرده من الوزاره ليه لانها لا تقبل اكثر من ذلك حراميه ينهبوا البلد.طبعا اثني مولانا علي وزير الكهرباء ووزير الماليه وغيرهم باعتبارهم المثل الاعلي للحراميه والفاسدين في مصر قصدي |الدوله الانتيكيهبتاعه محمد صبحي|.وطبعا اثنت الراس الكبيره علي العصابه يوه قصدى الوزاره بقياده الزعيم البوشى يووووه قصدي المنضفاتي نضيف.عموما صبرا يا شعبنا العظيم المهاود.كان معكم سيدابوحفيظه من امام مقر الحزن الوطني الديكتاتوري."
