subject = "وللمواطن راى"
author = "سعيد ابو السعود"
posted = "2009-03-12"
text = "اولا الوزير المقال او الذى تم تغييرة ليس من الوزراء رجال الاعمال وليس من الوزراء الذين امضوا فى وزارتهم اكثر من 22 سنة متواصلة كالوزير فاروق حسنى مثلا<br />بديل وزير الرى هو الوزير الجديد عميد كلية الهندسة وهو رجل اكاديمى بحت لم يخرج عن اسوار الجامعة ومعلوماتة نظرية بحتة ولم يعرف الحياة التطبيقية ولم يركب سيارة البوكس التى يركبها مهندس الرى ويسير على شواطىء الترع ويقابل الفلاحين ويشكون لة من قصر او طول النوبة للرى او تطهير المجارى المائية او مشاكل المياة الجوفية<br />يعنى الوزير القادم وزير بتاع مكتب يعتمد على مهندسى الوزارة القدامى لتمشية الحال<br />يعتى مفيش فايدة<br />اما وزيرة الاسكان الست مشيرة خطاب ولها كل الاحترام فهى قادمةلاقرار القانون الجديد للاحوال الشخصية الذى يعد الان فى لجنة السياسات والذى اكتمل تقريبا واهم بنودة هو تحريم تعدد الزوجات وعدم الجمع بين زوجتين وتجريمة قانونا مثل اوروبا وتونس اى اقتباس القوانين الكاثوليكية فى قانون الاحوال الشخصية<br />بس خلاص"
