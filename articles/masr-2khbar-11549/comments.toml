text = "قدم بهاء عطية (عضو الكتلة البرلمانية للإخوان المسلمين) بطلب إحاطةٍ إلى رئيس الوزراء ووزير الري والموارد المائية حول وجود تخريب متعمد بمشروع تطوير مولدات كهرباء السد العالي، خاصةً المولدين 3و4 اللذين ظهرت بهما عيوب خطيرة أثناء تركيبهما وأوضح عطية أن مصدرًا مسئولاً بشركة المحطات المائية لإنتاج الكهرباء بأسوان صرح أن هناك تخريبًا متعمدًا لمولدات السد العالي من قبل الأجانب تحت علم مسئولي الشركة المصريين!!! مدللاً على ذلك بتوريد شركة الكتروسيلا الروسية مولدات تحتوي على عيوب فنية لتركيبها في مشروع تطوير مولدات السد العالي ولم يتم اكتشاف تلك العيوب إلا بعد الانتهاء من تركيب العضو الثابت للمولد الرئيسي للوحدتين 3و4 - وتجدر الإشارة إلى أن جريدة الوفد قد نشرت في عدد الخميس 25/12/2008 خبرًا يفيد حصولها على&--8238; &--8236;تقارير ومستندات وصور خطيرة تكشف عن فضيحة فساد وإهمال في&--8238; &--8236;السد العالي،&--8238; و&--8236;تبين وجود مشكلة اهتزازات بالسد العالي&--8238; &--8236;تصل إلى&--8236;3&--8237;.&--8236;5&--8238; &--8236; بمقياس ريختر للزلازل؛ بسبب عمليات تطوير لأجهزة التحكم قامت بها شركة ألستوم العالمية &--8236;،&--8238; &--8236;كما قامت بتغيير الأرياش الروسية،&--8238; &--8236;وتدميرها حتى&--8238; &--8236;لا&--8238; &--8236;يعاد تركيبها مرة أخرى&--8238; &--8236;وتركيب رياشات بديلة&--8238; &--8236;غير مطابقة للمواصفات،&--8238; &--8236;مما استدعى&--8238; &--8236;سد جزء&--8238; &--8236;يصل إلى&--8238; &--8236;90&--8238; &--8236;سم من فتحات السد بالأسمنت والخرسانة المسلحة، مما أثر على&--8238; &--8236;أداء المولدات وحدوث اهتزازات وتشويه التصميم الأصلي&--8238; &--8236;للسد المصنف من الهيئات الدولية بأنه أعظم مشروع هندسي&--8238; &--8236;شُيد في&--8238; &--8236;القرن العشرين&--8238; - وأوضحت الجريدة أن تلك الاهتزازات قد تسببت بحدوث بعض الشروخ،&--8238; &--8236;والتي&--8238; &--8236;تتابعها إدارة الري&--8238; &--8236;منذ&--8238; &--8236;3&--8238; &--8236;سنوات على&--8238; &--8236;فترات متباعدة دون عمل أي&--8238; &--8236;علاج لها&--8238;، &--8236;كما حدث رشح خطير في&--8238; &--8236;الفواصل الإنشائية بين الوحدتين&--8238; &--8236;3&--8238; &--8236;و4&--8238; &--8236;بمحطة أسوان، &--8236;وتفاقمت المشكلة بداية العام الحالي&--8238; &--8236;وتم الاستعانة بمكتب تصميمات واستشارات هندسية بالأمر المباشر لعمل مقايسة لأسلوب معالجتها- كما تبين وجود مشاكل جسيمة في مشروع تطوير المولدات الذي&--8238; &--8236;يجري&--8238; &--8236;حاليًا، &--8236;مما اضطر وزارة الكهرباء لتأجيله،&--8238; &--8236;تبين أن المولدات الجديدة التي&--8238; &--8236;تكلفت&--8238; &--8236;600&--8238; &--8236;مليون جنيه طارت في الهواء تسخن عند التشغيل وتتوقف عن العمل بسبب السخونة نتيجة أنها من النحاس المفرغ&--8238; &--8236;عكس المولدات القديمة التي&--8238; &--8236;كانت من النحاس المصمت، مما&--8238; &--8236;يتطلب تعديل المولدات أو تعديل نظام التبريد&--8238;.&--8236;"
