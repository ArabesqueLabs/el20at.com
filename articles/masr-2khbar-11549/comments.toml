[[comments]]
order = 12
subject = "أزاي مبارك ونظيف يقبلوا بالوساخة دي في  وزارة الكه"
author = "مهندس في عزبة الوزير حسن باشا"
posted = "2009-03-13"
text = "من يحمي ويتستر علي وزارة الفساد<br />ووزير الكهرباء المصري ؟؟<br />من المتستفز أنك إذا تناقلت بين قنوات التلفزة الفضائية أو بين صفحات الصحف المصرية الحكومية فأنك لابد أن تصادف أما استضافة وأما مقالاً للسيد وزير الكهرباء المصري وهو يعانق السحاب متفاخراً بأنه أضاء المعمورة من الشمال إلي الجنوب ومن الشرق إلي الغرب حتي أصبحت مصر هي عاصمة النور مثل فرنسا ؟ فالرجل عاشق للدعاية والأعلان بطبعه وهناك مثل شعبي يقول أن من كثر قوله قل فعله وعمله ؟ وأنا أتعجب حين أقرأ آخر تصريح ناري لمعالي الوزير المذكور يقول فيه مؤخراً أن سياسات وزارة البترول المصرية هي السبب الأساسي في الخسائر الكارثية التي منيت بها شركات توزيع الكهرباء لأن وزارة البترول صدرت الغاز الطبيعي للأردن ومن ثم استخدمته الأخيرة لتشغيل مولداتها ومحطاتها واستغنت بذلك عن الكهرباء المصرية المنقولة للأردن عبر الشبكة الموحدة وحيث أن أسعار الغاز تقل كثيراً عن سعر الكهرباء المنقولة ؟! فإن الشركات لدية قد خسرت ؟ أي أن الرجل يعلق أخطاء فشل وزارته وهيئاته وشركاته وسياساته علي شماعة وزير البترول ؟ وعلي الرغم من الزيادات المضطردة والغير مبررة أو معقولة في أسعار شرائح الكهرباء والتي اكتوي بها المواطن المصري المعدوم الحيلة والدخل؟ ولو استمعنا أو قرأنا تصريحات وزير الكهرباء المصري والذي لا يمر يوماً إلا أن نشاهد صورته البهية في الصحف القومية لقلنا أن مصر هاتولع من شدة الكهرباء ناهيك عن الضغوط والأحمال التي تم أنتاجها في عصره الذهبي ؟ وكل ما أقوله كمواطن مطلع ومثقف للسيد الوزير ماهي المحطات التي أنشأت في عهدك الميمون ؟ وكم ميجا وات / ساعة أضيفت للشبكة القومية الموحدة منذ توليك زمام وزارة الكهرباء ؟ وهل تفسر لنا سيادتك أسباب أنقطاع الكهرباء لمرات متكررة ويومياً بجميع محافظات الدولة وخاصة في فصل الصيف ؟ وهل لاتعلم سيادتك أن هناك العديد والعديد من القري والنجوع والبلدات بل ومنازل بالقاهرة والمحافظات لا تحص ولا تعد لم يصلها كهرباء بعد ؟ ولا أقول لك أيه ياعم الكداب إليك هذه المقالة والتي قرأناها لأنجازاتك والمنشورة علي صفحات النت يمكن سيادتك تبطل \" هتش \" وتريحنا شوية من طلعاتك البهية في التفزيون والصحافة المأجورة؟<br />1- نشرت جريدة الوفد بتاريخ 7/7/2007 بالصفحة 3 النص التالي :<br />\" إهدار 95 مليون جنيه في محطة كهرباء اللآهون وهيئة المحطات المائية لتوليد الكهرباء أنهت تنفيذها عام 2003 والقابضة للكهرباء رفضت أستلامها وضغوط من وزير الكهرباء لإنهاء الأزمة والتعتيم علي تقارير جهاز المحاسبات \" .<br />2- نشرت جريدة الوفد بالعدد رقم 1221 المؤرخ 26/7/2007 بالصفحة 3 مايلي بالنص \" جهازالمحاسبات يطالب الكهرباء برد 52 مليون جنيه أهدرتها علي مشروع منخفض القطارة \".<br />3- نشرت جريدة الوفد بعددها رقم 6396 بتاريخ 29 أغسطس 2007 مايلي \" أختفاء 32.5 مليون جنيه في هيئة المحطات المائية للكهرباء والقيادات أنشأوا إدارة حسابات خاصة بهم لصرف المكافآت بعيداً عن الرقابة \".<br />4- نشرت جريدة صوت الأمة بعددها رقم 371 بتاريخ 21/1/2008 مقالة علي نصف صفحة نصها مايلي\" مفاجأة بالمستندات.. خطابات موقعة باسم الوزير بطرس غالي تكشف إهدار المال العام بمئات الملايين في وزارته ومخالفات مالية جسيمة تورط فيها قيادات كبيرة بوزارة المالية مع قيادات في الهيئة العامة لتنفيذ مشروعات المحطات المائية لتوليد الكهرباء وقد وصلت قيمة تلك المخالفات نصف مليار جنيه من ميزانية الدولة أهدرت علي مشروعات وهمية لم تنفذ بقطاع الكهرباء وحوافز للجان لا تجتمع \" والقضية منظورة بالنيابة الأدارية تحت رقم 22لسنة2007 ونص مقالة الجريدة منقول علي لسان المستشار الدكتور ابراهيم عبد الله بالنيابة الأدارية.<br />5- في أحدث تقرير للجهاز المركزي للمحاسبات 2008 جاء فيه 98 مليون جنيه مشروعات وهمية وقرض توشيبا طار في الماء في هيئة مشروعات المحطات المائية لتوليد الكهرباء .<br />6- في أحدث تقرير للجهاز المركزي للمحاسبات جاء به في هيئة تنمية واستخدام الطاقة الجديدة والمتجددة هناك 590 مليون جنيه غير مستغلة و90 قرش خسارة عن كل جنيه وورد به بلاوي وكوارث أخري لا يتسع المقام هنا لذكرها.<br />7- في أحدث تقرير للجهاز المركزي عن هيئة المحطات النووية لتوليد الكهرباء تحدث التقرير عن مبلغ 60 مليون جنيه لمشروعات متوقفة و17 مليون جنيه عجز جاري و705 مليون جنيه فوائد لقروض محلية ومصروفات إدارية وعمومية وبلاوي أخري كثيرة .<br />8- في هيئة كهرباء الريف 1.2 مليار جنيه رصيد دائنين والهيئة تستعمل الأيرادات للصرف علي المكافآت وهناك 119 مليون جنيه سحب علي المكشوف ورصيد القروض 8.5 مليار جنيه وبلاوي كثيرة ويمكن لسيادتك ياريس مبارك أن تقرأ تفاصيلها مع السيد رئيس مجلس الوزراء وأجهزتكم الرقابية علي موقع ( عالم المال ) تحت عنوان \" طاقة \" .<br />9- بجريدة الأهرام التابعة للحكومة؟بصفحة الحوادث الصادرة 17/9/2008 جاء فيها\" محاكمة 52 مسئولاً بوزارات الكهرباء والمالية والتنمية الأقتصادية لتسببهم في أهدار 102 مليون جنيه ؟ تم إنفاقها عن طريق هيئة المحطات المائية لتوليد الكهرباء في أجراء دراسات علي مشروعات لا طائل منها وأهدار 52 مليون جنيه علي مشروع منخفض القطارة بنفس الهيئة مع علم المسئولين بوزارة الكهرباء إستحالة أقامة المشروع لوجود أنشطة بترولية بموقعه حتي عام 2019 ؟ وأهدار 50 مليون جنيه أخري علي مشروع وهمي تحت مسمي \" الضخ والتخزين \" مع وجود دراسات سابقة تؤكد فشله ؟ وبنفس الجريدة جاء فيها حصول واحد من العاملين علي مكافأة سنوية بلغت في عام واحد 261 ألف جنيه ؟ وعدم سداد الهيئة 125 مليون جنيه ديون لبنك الأستثمار .<br />10 - وبتاريخ 17/9/2008 وبجريدة المصري اليوم نشر فيها\" إحالة 52 متهماً من الكهرباء والمالية للتأديبية تلاعبوا في صرف الموازنة والتحقيقات أكدت حصول المسئولين بهيئة المحطات المائية للكهرباء علي 12 مكافآة غير شرعية بلغت قيمتها 125 مليون جنيه ؟ وصرف 25000 جنيه أخري لخمسة أشخاص بالهيئة ( بأسماء وهمية ؟!) وأن مدير عام الحسابات حصل علي 11 مكافأة غير شرعية بينما حصل كبير الجيولوجيين علي 12 مكافأة وذلك خلال عام واحد فقط ؟<br />11- بتاريخ 17/9/2008 نشرت جريدة الأحرار بعددها الصادر بالصفحة رقم 5 وعن نفس هيئة المحطات المائية لتوليد الكهرباء \" عصابة الـ52 موظفاً تستولي علي أموال الدولة والنيابة تطالبهم برد المبلغ وتطالب بالتحقيق مع موظفي الجهاز المركزي للمحاسبات المتواطئين مع قيادات الهيئة المنكوبة.<br />12- طالعتنا جريدة المساء الأسبوعية الصادرة 25/10/2008 في عددها رقم 18806وعلي صفحتها الأولي وبالبنط العريض بخبر كارثي ومهزلة كبري للفساد المالي لم ولن تحدث في أي دولة من دول العالم المتحضر أو المتخلف حيث جاء فيها \" 52 وكيل وزارة ورئيس هيئة بالمحطات المائية لتوليد الكهرباء أمام المحكمة التأديبية العليا حصلوا ونهبوا وسرقوا أموال الدولة بملايين الجنيهات ونصبوا حتي علي وزارة المالية والسؤال الذي يطرح نفسه علي هذا الخبر أو المسخرة والمهزلة الكارثية هو كيف يتم تحويل 52 وكيل وزارة ورئيس هيئة من وزارة واحدة وهي وزارة الكهرباء ومن هيئة واحدة ؟ ثم هل وصل حجم الفساد المالي إلي هذا الحد الهزلي والكارثي في مصر ؟ وإذا ماتم تحويل 52 وكيل وزارة دفعة واحدة من وزارة واحدة؟ فكيف هو حجم وكم الفساد المستخبي في بقية وزارات وهيئات ومؤسسات الحكم في الدولة ؟ ثم أين السيد رئيس الجمهورية ورئيس الوزراء من هذه المسخرة والمهزلة الكارثية للفساد ؟ ثم ماذا ينتظر وزير الكهرباء من بعد لكي يقدم أستقالته أو يقال ؟ وأليست تلك الهيئة تابعة له ؟ أم تابعة لوزير كهرباء جزر القمر ؟ للأسف الشديد أن الوزراء عندنا وبقية دول العالم المتخلف يبدو أنهم من ذوات الدم البارد بعكس أقرانهم من وزراء العالم المتحضر من ذوات الدم الحار الوطني الذين يسارعون بتقديم أستقالتهم من فرط وطنيتهم وإحساسهم بالمسئولية حالة حدوث أخطاء في أي جهة تابعة لهم وربما لا تقاس بمثل هذه المسخرة والمهزلة الكارثية لنهب وسرقة المال العام كما حدث في هيئة وزارة الكهرباء أو هيئة علي بابا والـ 52 حرامي ولقد ورد ضمن أسماء المتهمين أسم / محمد الحارث الجزار الرئيس التنفيذي لهيئة المحطات المائية لتوليد الكهرباء وهو علي بابا ومعه بقية عصابة 52 حرامي ؟<br />13- أما الأنكد من ذلك كله هو قيام السيد وزير الكهرباء والطاقة الدكتور حسن يونس بتعيين المهندس / محمد الجزار الرئيس السابق لهيئة المحطات المائية وبعد خروجه للمعاش وعلي الرغم من أنه محال للمحاكمة التأديبية في القضية أو الفضيحة رقم 22 لسنة 2007 إلا أن السيد وزير الكهرباء بذلك بدي أنه \" يكافئه \" ؟! بتعيينه عضواً في مجلس إدارة شركة الأسكندرية لتوزيع الكهرباء وذلك تقديراً علي مايبدو من السيد الوزير له علي عبقريته الفذة في خراب الهيئة ونهب أموال الدولة وتبديدها والتربح والنهب فيها ؟ ولا عزاء هنا للشرفاء.<br />14- نشرت جريدة اليوم السابع في عددها 12 المؤرخ 6/1/2009 الأستيلاء علي 500 مليون جنيه بهيئة المحطات المائية لتوليد الكهرباء والنيابة الإدارية تكتفي بمحاسبة المتهمين تأديبياً ؟؟ والتواطؤ في عدم إبلاغ النيابة العامة ؟<br />15- قدم بهاء عطية (عضو الكتلة البرلمانية للإخوان المسلمين) بطلب إحاطةٍ إلى رئيس الوزراء ووزير الري والموارد المائية حول وجود تخريب متعمد بمشروع تطوير مولدات كهرباء السد العالي، خاصةً المولدين 3و4 اللذين ظهرت بهما عيوب خطيرة أثناء تركيبهما وأوضح عطية أن مصدرًا مسئولاً بشركة المحطات المائية لإنتاج الكهرباء بأسوان صرح أن هناك تخريبًا متعمدًا لمولدات السد العالي من قبل الأجانب تحت علم مسئولي الشركة المصريين!!! مدللاً على ذلك بتوريد شركة الكتروسيلا الروسية مولدات تحتوي على عيوب فنية لتركيبها في مشروع تطوير مولدات السد العالي ولم يتم اكتشاف تلك العيوب إلا بعد الانتهاء من تركيب العضو الثابت للمولد الرئيسي للوحدتين 3و4 - وتجدر الإشارة إلى أن جريدة الوفد قد نشرت في عدد الخميس 25/12/2008 خبرًا يفيد حصولها على&--8238; &--8236;تقارير ومستندات وصور خطيرة تكشف عن فضيحة فساد وإهمال في&--8238; &--8236;السد العالي،&--8238; و&--8236;تبين وجود مشكلة اهتزازات بالسد العالي&--8238; &--8236;تصل إلى&--8236;3&--8237;.&--8236;5&--8238; &--8236; بمقياس ريختر للزلازل؛ بسبب عمليات تطوير لأجهزة التحكم قامت بها شركة ألستوم العالمية &--8236;،&--8238; &--8236;كما قامت بتغيير الأرياش الروسية،&--8238; &--8236;وتدميرها حتى&--8238; &--8236;لا&--8238; &--8236;يعاد تركيبها مرة أخرى&--8238; &--8236;وتركيب رياشات بديلة&--8238; &--8236;غير مطابقة للمواصفات،&--8238; &--8236;مما استدعى&--8238; &--8236;سد جزء&--8238; &--8236;يصل إلى&--8238; &--8236;90&--8238; &--8236;سم من فتحات السد بالأسمنت والخرسانة المسلحة، مما أثر على&--8238; &--8236;أداء المولدات وحدوث اهتزازات وتشويه التصميم الأصلي&--8238; &--8236;للسد المصنف من الهيئات الدولية بأنه أعظم مشروع هندسي&--8238; &--8236;شُيد في&--8238; &--8236;القرن العشرين&--8238; - وأوضحت الجريدة أن تلك الاهتزازات قد تسببت بحدوث بعض الشروخ،&--8238; &--8236;والتي&--8238; &--8236;تتابعها إدارة الري&--8238; &--8236;منذ&--8238; &--8236;3&--8238; &--8236;سنوات على&--8238; &--8236;فترات متباعدة دون عمل أي&--8238; &--8236;علاج لها&--8238;، &--8236;كما حدث رشح خطير في&--8238; &--8236;الفواصل الإنشائية بين الوحدتين&--8238; &--8236;3&--8238; &--8236;و4&--8238; &--8236;بمحطة أسوان، &--8236;وتفاقمت المشكلة بداية العام الحالي&--8238; &--8236;وتم الاستعانة بمكتب تصميمات واستشارات هندسية بالأمر المباشر لعمل مقايسة لأسلوب معالجتها- كما تبين وجود مشاكل جسيمة في مشروع تطوير المولدات الذي&--8238; &--8236;يجري&--8238; &--8236;حاليًا، &--8236;مما اضطر وزارة الكهرباء لتأجيله،&--8238; &--8236;تبين أن المولدات الجديدة التي&--8238; &--8236;تكلفت&--8238; &--8236;600&--8238; &--8236;مليون جنيه طارت في الهواء تسخن عند التشغيل وتتوقف عن العمل بسبب السخونة نتيجة أنها من النحاس المفرغ&--8238; &--8236;عكس المولدات القديمة التي&--8238; &--8236;كانت من النحاس المصمت، مما&--8238; &--8236;يتطلب تعديل المولدات أو تعديل نظام التبريد&--8238;.&--8236;<br />* فضيحة فى كهرباء كفر الشيخ تحمل الشعب 120 مليون جنيه نقلاً عن جريدة العربى الناصرى العدد 1129 فى19/10/2008 بعد أقل من 6 أشهر من الانتهاء من إنشاء خط ربط كهرباء سيدى سالم كفر الشيخ المحمودية انهارت الابراج الرئيسية فى خط الربط ومع أول هطول للمطر لتصل خسائر قطاع الكهرباء الى مايقرب من 120 مليون جنيه حسب تأكيدات الخبراء .. بخلاف خروج ثلث محطات رئيسية بقدرات 220 كيلو فولت من الخدمة هى محطات سيدى سالم وكفر الشيخ والمحمودية ليترتب عليها فصل وخروج أكبر 8 محطات فرعية بقدرات 66 كيلو فولت وهى مطوبس والمندورة والمثلث وغرب البرلس والمحمودية وفوة والحامول وأبو غنيمة و قلين فيما تقليل الأحمال عن بعض المحافظات لسد العجز فى محافظة كفر الشيخ وأطراف البحيرة ..<br />انهيار الابراج وخروج محطات المحولات الرئيسية من الخدمة يمثل نتاجا طبيعيا للفساد الذى تشهدة الشركة المصرية لنقل لكهرباء خلال العام الماضى وفى تنفيذ مشروعات بمئات الملايين من الجنيهات يشوبها عيوب فنية خطيرة ..<br />مصادر تكشف خيوط الفضيحة التى تم رفع تقرير مفبرك يلقى بتبعات جريمة انهيار الاربعة أبراج الرئيسية و بارتفاعات 65 مترا للبرج - مرة واحدة وتصدع باقى الخط الذى يصل طولة الى 4 كيلو مترات للتصدع - على الامطار!! وهو رفض الوزير الاعتراف به والقيام بتكليف لجنة من قيادات الوزارة بحصر التلفيات والكشف عن أسباب انهيار الخط بعد 6أشهر من إنشائه ..<br />وفى اجتماع عاصف داخل محطة سيدى سالم مساء الاربعاء الماضى وبعد 12 ساعة من انهيار خط نقل الكهرباء الذى يربط بين محطات ال220 وهى الخطوط التى تتولى سحب الطاقة من محطات التوليد وتوصيلها الى عشرات المحطات ـ 66 بعد تخفيف الاحمال ـ تراشق قيادات الشركة المصرية بالالفاظ مع قيادات شركة المصرية للنظم الكهربائية التابعة لوزارتى الكهرباء وقطاع الاعمال بعد ان فجر مفاجأه وهى ان ممثلى شركة نقل الكهرباء بقطاع الدلتا لم ينتبهوا لتحذيراته من وجود عيوب فنية فى التنفيذ والتراخى فى الاشراف والتسلم و عن وجود فساد فى عمليات انشاء الخط الذى بدا العمل فيه شهر يناير الماضى وانتهى أبريل وقال صلاح الشاذلى ممثل شركة النظم المصممة للمشروع بأن الشركة المصرية رفضت تركيب خط أرضى يقوم بامتصاص الصواعق الناتجه عن العوامل الجوية السيئة وتفريغها بواسطة الخط الارضى لحماية جسم الابراج العملاقة من التصدع والانهيار .. بإضافة الى فقدان الاتصال بين محطة سيدى سالم 220 الرئيسية وبين باقى المحطات من جانب وبينها ومركز التحكم الرئيسى بالقاهرة أو حتى مركز التحكم الفرعى بالمنصورة ..<br />وصرح صلاح الشاذلى حسب تأكيدات مصادر أثناء الاجتماع فى وجه جلال حلاوة نائب رئيس المصرية لنقل الكهرباء ومحمد أبو طالب رئيس منطقة الدلتا قائلا.. سبق وحذرتكما من التسرع فى انشاء الخط وبه كم من العيوب الفنية بالخط وبمحطة سيدى سالم نفسها حيث إن أجهزة الوقاية تعطلت بالمحطة . مشيرا الى ان السرعة فى التنفيذ التى أكد عليها الوزير لم تكن تعنى تجاهل مراعاة المواصفات الفنية _ وأضاف الشاذلى قائلا انتم السبب فى انهيار الخط .. ولم يكن كشف المستور فى فساد المصرية لنقل الكهرباء هو السبب الوحيد الذى من أجله ثار ممثل شركة النظم فى وجه قيادات المصرية للنقل .. ولكن لمحاولة تلك القيادات تحميل شركة التصميمات المسئولية - وفى تصريحاته للعربى نفى المهندس حسنى الخولى رئيس الشركة المصرية للنظم قائلا إننا نسير وفق كود عالمى متشدد ولدينا برامج عالمية نستعين بها فى التصميمات وبدقة لا تقبل الخطأ ولو بنسبة واحد فى المليون وقال ان التنفيذ الذى يتم دون أشراف جاد من شركة النقل يمكن ان يسبب كارثة بسبب إهمال عامل فى ربط مكبس وأشار الى أن البرامج والتصميمات لو بها أى تجاوز لما لم تعط نتائج سلبية فى أى من المشروعات السابقة التى تصل أعمالنا فيها بنسبة 90% من حجم الاعمال فى الشبكة القومية للكهرباء!! وأضاف الخولى للعربى أنه كلف أحد مساعدية للمشاركة فى لجنة عامة لاعداد تقرير عن الحادث ولكنه يشكل لجنة حاليا من شركة النظم لاعداد تقرير أخر به كل التفاصيل والتحفظات على عمليات الانشاء والاشراف من قبل شركة نقل الكهرباء على ان يتم تسليمه للدكتور حسن يونس وزير الكهرباء والطاقة والخطير فى الامر ان ابو طالب اقترح على شركة النظم ان يعاد إصلاح الخط واستبدال الابراج المنهارة بأخرى الا ان شركة التصميمات اعترضت مطالبة خلال الاجتماع بضرورة إزالة الخط كاملا واستبداله بآخر وليس الابراج المنهارة فقط نتيجة لحدوث تقوس وانحرااف فى زوايا باقى أبراج الخط .والمضحك أن محمد أبو طالب مسئول منطقة الدلتا بدلا من لوم نفسه على تقصيره ومسئوليته فى تسلم أعمال بها عيوب فنية تسببت فى ضياع نحو 120 مليون جنيه على قطاع الكهرباء سوف يدفعها الشعب من جيبه قام بمعاقبة العمال والمهندسين الغلابة العاملين بالمحطات بالغاء بدل الورادى لهم .<br />من جنب أخر ثار الفلاحون الذين تضرروا من أنهيار الابراج والتى أتلفت محاصيلهم وأدت الى قتل العديد من رءوس الماشية المملوكة لهم وقاموا بمطاردة قيادات الكهرباء الذين استعانوا بدورهم بقوات من الشرطة لتمكينهم من المرور على الخط المنهار.<br />17- كشف تقرير حديث للجهاز المركزى للمحاسبات عن نتائج الرقابة المالية لقطاع الكهرباء والطاقة عن السنة المالية 2007 أن إجمالى قيمة المبالغ المنفقة على دراسات مشروع إنشاء المحطات النووية بالضبعة بمحافظة مرسى مطروح بلغ 881 مليون جنيه خلال العام الماضى، وأشار التقرير إلى أن تلك الدراسات لم تستطع تحديد المكان المناسب للمشروع حتى الآن أو الجدوى الاقتصادية له ومدى الاستفادة من المبالغ التى أنفقتها الدولة على المشروع مما اضطر هيئة المحطات النووية إلى الاستعانة مرة أخرى بالشركة الفرنسية التى قامت بدراسة الموقع لتحديث الدراسة، ونتج عن ذلك عجز فى ميزانية الهيئة بلغ حتى الآن 17.85 مليون جنيه عن العام المالى 2007، مقابل 11.705 مليون جنيه لعام 2008 بزيادة 5.353 مليون بنسبة 45.7 % ليصبح إجمالى العجز المرحل نحو 28.763 مليون جنيه.<br />التقرير لم يتوقف عند حد هذه المخالفة بل انتقل إلى مشروعين تقوم بدراستهما هيئة تنفيذ المحطات المائية لتوليد الكهرباء، هما منخفض القطارة بالعلمين بمحافظة مرسى مطروح والضخ والتخزين بمحافظة السويس، فقد وصلت قيمة الدراسات بالمشروع الأول نحو 52 مليون جنيه وأثبتت دراسات الجدوى الاقتصادية لمشروع منخفض القطارة عدم وجود جدوى اقتصادية بالرغم من دراسته أكثر من 32 عاما أى منذ عام 1976.<br />المفاجأة الكبرى جاءت بالتقرير النهائى للعام الماضى والتى أكدت استحالة تنفيذ المشروع قبل عام 2027 لأن وزارة البترول تستغل غالبية مساحة المنخفض كمناطق تنقيب واستكشاف واستخراج بمعرفة شركات أجنبية تم منح امتياز لها حتى عام 2027. أما مشروع الضخ والتخزين الذى تم الانفاق على دراساته بمبلغ 46 مليون جنيه، فقد ثبت قيام شركة السويس لمواد البناء والتنمية العمرانية والسياحية التعدى على الأرض المخصصة له منذ عام 1994 لإقامة مدينة سياحية، مما جعل الهيئة تقوم برفع دعوى قضائية ضد الشركة برقم 193 لسنة 1995 وإحالتها لمكتب وزارة العدل مما أسفر عن عجز فى نتائج الأعمال النهائية بلغ 13.555 مليون جنيه عن العام المالى 2007، فى مقابل عدم تحقيق فائض أو عجز فى 2006 ذلك نتيجة تجاوز المصروفات على 4 مشروعات خلال عام واحد نحو 235.871 مليون جنيه وذلك بزيادة قدرها 6 % عن المعتمد بقانون ربط موازناتها لنفس العام.<br />وجاءت المفاجأة الثالثة فى التقرير الصادم فى هيئة كهرباء الريف الذى أكد فى البند الثامن منه تضمن المخزون السلعى 505.138 مليون جنيه مقابل 469 مليون جنيه والتى تضمنت أصنافا راكدة بلغ ما أمكن حصره منها نحو 20 مليون جنيه تمثل 4 % من إجمالى المخزون مقابل 21 مليوناً و189 ألف جنيه، بنقص 792 ألف جنيه ولم يتم إيضاح رصيد البضائع لدى الغير والبالغ 14 مليوناً تم حسابها بالخطأ على حساب المستلزمات السلعية، وبلغ رصيد المدينين والأرصدة المدينة للهيئة لدى الغير نحو 4.408 مليار جنيه مقابل 3.450 مليار جنيه فى عام 2006 بزيادة نحو 958 مليون جنيه بنسبة 27.8 %<br />الغريب أن حساب أجور العمال عن العام المالى 2007 والذى بلغ 29.281 مليون جنيه قيمة المبالغ المنصرفة كأجور وحوافز وبدلات لم يتأثر بالمديونية. فى الوقت نفسه بلغت قيمة الدراسات والإشراف الفعلى المحصلة على المشروعات الممولة من الغير فى هيئة كهرباء الريف نحو 28.280 مليون جنيه، فى حين بلغت المصروفات الفعلية من أجور ومستلزمات سلعية بدون خامات ومستلزمات خدمية بدون مقاولى الباطن نحو 55.463 مليون جنيه، والتى قامت الهيئة بتمويل الفرق البالغ نحو 27 مليوناً و183 ألف جنيه من بواقى الشيكات المعلاة للغير فى الحسابات الدائنة على ذمه تنفيذ بعض المشروعات.<br />وجاء البند الأخير للتقرير عن إجمالى المبالغ المنصرفة على جميع المشروعات المنفذة للخطة بنحو 627.489 مليون جنيه بتجاوز يصل إلى 367.283 مليون جنيه بنسبة 141 % عن الاعتماد المعدل لنفس العام البالغ 260 مليون جنيه، ويتضمن المنصرف خلال عام نحو 403.140 مليون جنيه فوائد سابقة على بدء التشغيل تمثل نسبة 64.2 % والتى تزيد على المستهدف البالغ 10 ملايين جنيه بنحو 393.140 حيث تم تمويل المنصرف عن طريق زيادة الدائنين والأرصدة الدائنة بنحو 401 مليون و818 ألف جنيه وعن طريق قروض مباشرة من بنك الاستثمار بنحو 225 مليون جنيه ومنحة عينية بنحو 206 آلاف جنيه.<br />من جهته تقدم محمد العمدة، عضو مجلس الشعب عن دائرة أسوان، بطلب إلى مجلس الشعب لتحويل جملة المخالفات المالية المرتكبة داخل قطاع الكهرباء إلى النيابة العامة، مستندا فى ذلك إلى كونها مخالفات جسيمة.<br />وأكد فى حيثيات طلبه أن ما حدث فى الضبعة يعد بشكل صريح إهدارا للمال العام وصل إلى 881 مليون نيه فى عام واحد على دراسات لم يتضح منها حتى الآن الجدوى الاقتصادية للمشروع أو تحديد مكانه."
