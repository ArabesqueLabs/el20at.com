text = "اى فضل فى تركيب مولدات كهرباء اضافية يرجع للوزير ابن الكهرباء البار ماهر اباظة رحمة اللة وهو الذى نقل الكهرباء نقلة جبارة الى الامام<br />ان مشكلة التبريد فى مولدات الكهرباء من المفروض ان لا تظهر اطلاقا فى بلد زى مصر لان درجة حرارة مياة التبريد من ماء النيل هى فى معظم شهور السنة بين 12 و 17 درجة مئوية<br />اننا كنا قديما نستخدم الهيدروجين فى تبريد المولدات ثم نبرد الهيدروجين بماء النيل فى مبادلات حرارية داخل المولد وكانت الاسلاك مصمتة ومعزولة بعازل سيلكون من درجة f تحمل حرارة حتى 120 درجة مئوية<br />فى المولدات عموما لا يتم تغيير الجزء الثابت stator ولكن يتم تغيير العمود الدوار لتعرضة لاجهادات وشروخ داخلية واحيانا تزداد الاهتزازات على الكراسى بعد تشغيل اكثر من اربعين سنة<br />ان الشبكات بحالة سيئة جدا وبدون صيانة وقائية على الاطلاق ولا يتم حتى ابسط خطوات الصيانة للعواذل والاسلاك والابراج وعند حدوث اى ضباب او رطوبة تحدث شرارة بين العازل والبرج ويقطع او يفصل خط الكهرباء ولا توجد فرق لنظافة العواذل وغسلها دوريا بالماء المقطر<br />ان وزارة الكهرباء وزارة تدار بالكلام وان كل خبرائها قد هربوا منها او ماتوا او ابتعدوا عن الشر وغنوا لة<br />عندى كلام كتير ولكن يا صاحبى مفيش فايدة<br />والموقع لن يسمح"
