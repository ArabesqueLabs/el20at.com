text = "والله انا شايف اني الدكتور احمد نظيف حرام يكمل والمفروض يترك مكانة لشخص اخر اجدر واكفاء منة وحرام عليه الي بيعملوا فينا ده من يوم ممسك الحكومة والدنيا خربت والكوسة عمت والرشاوي بقت هيا النظام الاساسي في البلد وانا من اشد المعجبين بشخصية رئيس الجمهورية السيد الرئيس محمد حسني مبارك فهو اب لنا جميعا ومن اذكي الرؤساء علي مر العصور ونحن جميعا ننشاده باقلة حكومة نظيف الي وسخت البلد والله خسارة فيه الاسم فعلا اسم مش علي مسمي خالص"
