subject = "الى صديقى الفاهم الفهامة(موش طايق)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-03-14"
text = "عزيزى الاخ مشمش طايق!!!<br />أشكرك جزيلا اعتقد انك انت الوحيد فى مصرنا المحروسة الموكوسة اللى فاهمنى<br />و اقسم باللة العظيم ان السيسد اللواء/حبيب العادلى لديهة من الكفائة ليكون رئيس و زراء ناجح و معطى لمصر و انا ثقة من ما اقول؟<br />و ياريت بالمناسبة عندما ترن للسيد/الرئيس علشان يعين اللواء /حبيب العادلى رئيسا للوزراء يا ريت تخلية يوصى اللواء/العادلى ان يفتكرنى و يعينى فى اى منصب و زارى ايا كان و انشاء اللة سوف اكون فى خدمة الوطن ختى النفس الاخير؟ هذا اذا كان لى من العمر بقية!!!!!<br />بس يا سيدى انا اتمنى ان يسند لى شرف رئاسة و منصب /وزير الداخليةو<br />و اول قرار سوف اصدرة سوف يكون (الغاء قوائم اللمنوعين من السفر)<br />و ذلك حتى انظف مصر من امثالهم؟<br />مرة تانية اشكرك ياخ (مشمش الطايق)<br />و هذا هو رقم تليفونى علشان يتصلوا بى عند التشكيل الوزارى القادم بازن اللة قريبا؟<br />(0121714842)<br />و على فكرة عنوانى معروف جيدا للجهات الرسمية و هو موجود فىادارة مباحث أمن الدولة و المخابرات المصرية العامة؟<br />و برضة انا لا و لن انساك؟<br />و اللى اللقاء فى مناظرة اخرى؟<br />أكثر اللة من أمثالكم حبا و اخلاصا ووفاء لمصرنا الغالية<br />و تحياااااااااااااااااااااااااااااااااااااااااااااااااا مصرنا الغالية"
archived = "2010-03-14"
