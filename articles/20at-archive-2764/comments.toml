text = "بسم الله الرحمن الرحيم انا الطالب عز الدين حسين موسى من مدينه رام الله فانا لرغم سني فاني لا اصدق انه يوجد عنا فلسطين يوم كيوم عيد الاستقلال فانا اتمنى ان لا تاتي السنه الجديدة ونحن غير مستقلين كباقي الدول الخرى انا حزين بهذا السبب فانا اتمنى ان نستقل مثل باقي الدول انشاء الله"
