[[comments]]
order = 0
subject = "جبروت الدولة والنظام هو السبب"
author = "واحد"
text = "فى القرن الواحد والعشرين يصر النظام بغباء رغم انتقاد عدد كبير من الشعب وجمعيات حقوق الانسان على محاكمة المدنيين امام محاكم عسكرية - هذا كان يصح ايام الثورة البلشفية وايام موسولينى وفى بداية الثورات العسكرية<br />ولكن متخذ القرارات الغبية فى الحكم يصر على لف حبل المشنقة حول عنقة<br />ماذا لو حاكمهم مدنيا وعندة قضاة من الحزب الوطنى يحكمون بما يريد النظام لا بما يريدة الحق<br />انما الاصرار على المحاكم العسكرية وكانة ارهاب للناس<br />لم يعد احد يخاف من المحاكم العسكرية<br />ثم لماذا تلفيق تهمة لايمن نور - علشان تجرأ ورشح نفسة للحكم - يا سلام على الغباء<br />الاتحاد الاروبى محق<br />والاتحاد لن يتراجع امام جعجعات ابو الغيط وابو جاموس وفتحى موافقات بتاع مجلس الشعب<br />اغبى حكومة فى العالم - وافشل حكومة فى العالم عن جدارة"
archived = "2008-01-30"
capture_url = "https://web.archive.org/web/20080130043413/http://masr.20at.com:80/newArticle.php?sid=13889"

[[comments]]
order = 1
subject = "الى الاخ اللي فوق واحد من الناس"
text = "ثم لماذا تلفيق تهمة لايمن نور - علشان تجرأ ورشح نفسة للحكم - يا سلام على الغباء<br />يا اخ واحد من الناس هذه معلومة مش صحيحة<br />قضية التزوير قضية حقيقية وهي تزوير توكيلات تاسيس الحزب<br />وبعدين الحكم مش لعبة علشان خاطر واحد محامي صاحب مكتب يحكم مصر<br />انت عايز الناس تاكل وشنا<br />والامن يودي وشه فين<br />الحكم عايز واحد زي حسني مبارك فاهم ازاي يحكم<br />تقف عند بتاع الجرايد اللي جنب المحطة تلاقي جرايد المعارضة اشكال والوان عماله تشتم في الحكم وتشتم في الدولة وتشتم في الحكومة<br />وحسني مبارك ولا همه اي حاجه لانه عارف هو ماسك البلد ازاي<br />ورفع شعار انتوا قولوا اللي انتوا عايزينه واحنا حعمل اللي انا عايزه"
archived = "2008-01-30"
capture_url = "https://web.archive.org/web/20080130043413/http://masr.20at.com:80/newArticle.php?sid=13889"

