posted = "2010-01-19"
text = "ما استنبطه فى الغالب صحيح دكتور علاء<br />فانا كنت من المعجبات بالنقاب<br />واتمنى ان اكون بهذه الشجاعة وهذا الحب لدينى وكنت ادعو الله ان يّمن على بهذا الفضل<br />وحاولت التقرب اليهن لأتعلم تلك القوة فى ارتدائه وذهبت الى بعض الجوامع وبما انى البس الحجاب فقط كن يبتعدن عنى ويشعرننى بدونية وأكد لى هذا عندماجلست بجانب الداعية التى تلقننا الدرس وحاولت تقديم نفسي لها بعفويه باننى إبنه لأب صوفى وتربيت على افكار الصوفية ولم اكمل والله جملتى وجدتها وكأن عقرب لدغها وأعطتنى ظهرها وردت على بخشونه( روحى اقعدى بعيد الله يكرمك)<br />جعلتنى هذة الحادثة اكرة نفسي وندمت لأننى خاصمت الشعر والندوات والشعراء وقتها<br />وعندى الكثير من المواقف معهن<br />وعموماً أعتبر النقاب فضل وليس فرض كان أبى رحمه الله يقول لى يا ابنتى الحجاب هو حجاب القلب عن المعاصى أولا ً<br />فالتطهر الداخلى ابقى وأقوى كما ذكر فى القرآن الشريف<br />إن الله لا يغير قوم حتى يغيروا ما بأنفسهم"
archived = "2010-03-14"
