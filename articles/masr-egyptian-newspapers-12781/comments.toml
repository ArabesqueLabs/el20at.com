author = "دكتور محسن نبيه"
posted = "2009-09-02"
text = "اخى الكاتب مفهومك فى كلمه حبس المرأه خلف النقاب غير سليم ان المنقبه هى امرأه عاديه طبيبه مهندسه بائعه تتعامل فى المجتمع بحريه لا يعوقها النقاب فى شي هى تخرج وتعمل وترتادد المنتزهاتكأى امرأه عاديه<br />ان مشكلتك انك غير متخصص فى الدين ولذلك معلوماتك الدينيه سطحيه مثلى<br />كنت اتمنى ان تكتب مقالا اخر فيه رأى الفقهاء فيمن لا تلبس حجاب اصلا حتى تكون لك مصداقيه<br />وان كنت تقول ان الديمقراطيه هى الحل فمن الديمقراطيه ان تلبس المرأه ما تريد دون ان تجد من ينتقدها مثلك<br />ثم هل يا سيدى الكاتب انتهت كل مشاكلنا حت تشغل وقتك وقلمك ومساحه فى صحيفه لموضوع النقاب<br />رفقا بمصر ان كنتم تحبونها<br />كتور محسن نبيه (استاذ المخ والاعصاب)<br />ا"
archived = "2010-03-14"
