text = "الاسلام هو الحل اخى ولس الديمقراطية هى الحل<br />ليس استبدادا ولكنها الحقيقه بالرغم من مما ذكرته فى الاعلى وانا بالطبع اشير بان كلامك به 85% من الصحة , وأن كتيرا ممن يتمسكون بشكل الاسلام يفتقدون لروحة وحسن المعاملة مع الاخرين , ولكن هذا لايلقى اللوم على دين الاسلام الحنيف فالاسلام اصله حسن الخلق وحسن المعاملة وولم يقم اساسه على الهيئة .فقد كان البنى الامى والذى كان يتلقى الوحى سمعا ولم يكن متعلما كان احسن اهل الارض خلقا وللتأكيد ان دين الله الاسلام ليس به شئ من الحطأ وإنما الخطأ فى الناس ان معظم البلام على عهد الرسول الكريم والخلافاء فتحت بخلق الاسلام وليس بالسيف<br />وبما ان هؤلاء النساء الذى تتحدث عنهم هن اخواتى فى الاسلام فأنا اطلب منك ان تلتمس لهن العذر لانهن لايزالون فى اول طريق الاسلام وكفى بهن انهن يحاولن ان يعيدوا مجد الاسلام ولو جهلن بعض جوانبه :lol:"
