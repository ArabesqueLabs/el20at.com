subject = "عقوبة الجلد موجودة فى السجون المصرية - ربط المسجون"
author = "مصرى"
posted = "2009-01-20"
text = "فية ولاد وسخة ارثوذكس خنازير بيدخلوا يكتبوا ويشتموا اذا شافوا حاجة عن السعودية او الاخوان<br />الجلد موجود فى السجون المصرية ومع الحبس الانفرادى<br />وموجودة من ايام الانجليز<br />فمش عايزين انزحة<br />ويجب شرح الجلد فى الشريعة للبهايم وبالذات خنازير الارثوذكس<br />الجلد مش بكرباج ولكن بخيرزانة رفيعة<br />يضم الضارب يدة الى الجسم ويلصق الكوع بالجسم ويضرب بطرف اليد - يعنى لا يتمطع بايدة ويضرب<br />الضرب لا يوجع اطلاقا<br />ولكن العملية اهانة وتجريس امام الناس المجتمعين<br />البقر فهموا<br />وولاد الوسخة الارثوذكس فهموا اللى بيكتبوا باسماء اسلامية"
archived = "2010-03-14"
capture_url = ""

