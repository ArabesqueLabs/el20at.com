[[comments]]
order = 6
subject = "عيب"
author = "أحمد الشرقاوى"
posted = "2009-01-20"
text = "الأخ مصرى<br />أذكرك بأن إخواننا الأقباط شركاء معنا فى وطن واحد ولا داعى للشتيمة و التجرح و الكلام الخارج الذى تقوله<br />و أذكرك أيضا بحديث رسول الله - صلى الله عليه و سلم - \\\"و خالق الناس بخلق حسن\\\"<br />و أذكرك أيضا بأن إسلامنا لا يسمح لنا بأى شكل بإهانة أى شخص أيا كان دينه أو ملته و مهما إختلفنا معه<br />و بالنيابة عن كل مسلمى مصر أعتذر لإخوتنا الأقباط عن هذا الكلام الجارح الذى لا قيمة له<br />ولا حول ولا قوة إلا بالله"
archived = "2010-03-14"
capture_url = ""

