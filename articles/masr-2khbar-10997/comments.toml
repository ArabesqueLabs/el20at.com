posted = "2009-01-20"
text = "يا جماعة لازم نخلى بالنا إن فيه ناس بتحاول تعمل فتنى بيننا بأى شكل زى الشئ اللى مسمى نفسه (( مصرى )) و بيشتم فى الأقباط<br />صدقونى إحنا فعلا مش بنكرهكم بس الشئ ده تلاقيه إخوان أو من أقباط المهجر<br />المهم إنه حد عاوز يوقع بيننا و خلاص<br />و المفروض عشرينات تحذف التعليقات الجارحة المهينة دى و متساهمش فى نشر الفتنة بين الناس إلا إذا كان ليها أهداف تانية غير معلنة"
