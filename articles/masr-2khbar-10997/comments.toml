[[comments]]
order = 10
subject = "الى المعلق الكبير (مصري) انت اجدع واحد في الدنيا"
author = "مش ححبك"
posted = "2009-01-20"
text = "انا المعلق الاول يا اخ مصري<br />انت شرحت اللي انا كنت عايز اقوله بالتفصيل وشرحت الجلد في الشريعة الاسلامية والناس عرفت الفرق بين الجلد في الشريعة والجلد في سجون امريكا وسجون الدول العربية وسجون اسرائيل<br />وبعدين فيه واحدة اسمها مصرية قالت على السعوديين انهم بقر وطبعا دي مسيحية مصرية<br />بقر علشان خاطر بينفذوا شرع الله<br />لكن الانبا برسوم المحرقي لما يمارس الزنا في الكنيسة مع المسيحيات يبقى حاجه حلوه اوي<br />الجلد في الشريعة الاسلامية دلع بعكس الجلد في جوانتانامو وابو غريب<br />سلام"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = "الحضارية المسيحية في التعذيب"
author = "مش كاتب"
posted = "2009-01-21"
text = "\\\\\\'جوانتانامو\\\\\\' صورة طبق الأصل من أبو غريب<br />اتهم المعتقل البريطاني الذي قضي عامين في سجن جوانتانامو السلطات الأمريكية التي احتجزته هناك خطأ طوال هذه المدة بأنها عرضته هو ومعتقلين آخرين لأبشع أنواع التعذيب الوحشية مثل الضرب والحقن الإجباري بمواد مخدرة والحرمان من النوم والتقييد لفترات طويلة في أوضاع مؤلمة بالإضافة للاعتداءات الجنسية التي يتعرض لها بعض المعتقلين هناك من العرب والأفغان.<br />وقد وصف \\\\\\'جمال هاريث\\\\\\' كيف تعرض للضرب المبرح علي أيدي حراسه، فقد كان حارس السجن يقفز علي ساقه عندما يرفض أو يقاوم تعاطي الحقنة المخدرة التي تفقده الوعي لفترات طويلة ويؤكد أن المحققين داخل السجن أجبروه علي البقاء علي ركبتيه في أوضاع مؤلمة وتقييده بسلاسل من نوع خاص تنفذ إلي الجلد من شدتها.<br />وطبقا لروايته فقد علقه الحارس في السقف وهو مكبل بالسلاسل لمدة تزيد علي 15 ساعة داخل غرفة التحقيقات وعرضوه لهواء شديد البرودة حتي تبول علي نفسه وهو معلق."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 12
subject = "الى المعلق السابق - مفيش حاجة اسمها حضارة مسيحية -"
author = "ما فيش"
posted = "2009-01-21"
text = "المسيحية ليست دين ولا حضارة<br />انها فلسفة<br />فلسفة نتيجة الحضارة الرومانية<br />ملخصها<br />ان الانسان يولد مجرم ابن مجرم ويحمل الخطيئة فوق راسة وراس ابوة - وان ابن الرب يسوع قد وضع على الصليب ليموت تكفيرا لخطيئة ادم وليشيل الجرم عن بنى الانسان<br />هذة فلسفة<br />وفلسفة خيالية الى ابعد حد<br />خطيئة ادم تحمل الى بنى البشر<br />يعنى ابراهيم مات مجرما ويحمل خطيئة ادم<br />وكلهم حتى حادثة الصلب التى يزعمونها والدراما التى تصاحبها<br />كل ذلك نسفة القران باية واحدة<br />ولا تزروا وازرة وزر اخرى<br />اى ان الانسان لا يحمل خطيئة انسان اخر ومسئول عن عملة هو فقط - انا لست مسئولا عن اخطاء اجدادى ولا حتى جيرانى انا مسئول عن خطئى فقط - فلو قتل ابى انسانا فلن يحاكمنى احدا لان ابى قتل<br />فليس هناك حضارة او دين مسيحى<br />هناك حضارة رومانية"
archived = "2010-03-14"
capture_url = ""
