[[comments]]
order = 9
subject = "إلى مصرى"
author = "عمرو"
posted = "2009-01-20"
text = "من المقصود بالأرثوذكس ؟ يعنى إيه أرثوذكس ؟<br />أنا فهمت من كلامك و من التعليقان إن معناها أقباط لكن هو كل اللى بيشتم الإخوان و مش طايقهم يبقى قبطى ؟<br />طب ما أنا مسلم و أبويا مسلم و جدودى مسلمين و كلنا من أول الأجداد و كل أهلى و أنا شخصيا مش بطيق الإخوان ولا بطيق سيرتهم أبقى أرثوذكس أنا كمان ؟<br />إتقوا الله يجعل لكم مخرجا<br />أقسم بالله العلى العظيم إن أمثالك هم سبب تخلف الأمة كلها<br />و لله الأمر من قبل و من بعد"
