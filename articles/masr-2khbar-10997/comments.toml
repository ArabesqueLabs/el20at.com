subject = "بعدم توقيع عقوبة الجلد عليه إعمالا للمواثيق الدولي"
author = "مش ححبك"
posted = "2009-01-20"
text = "امال فين المواثيق الدولية في جوانتانامو وسجن ابو غريب وسجون اسرائيل<br />العهود الدولية على ميتين ابو المسلمين فقط<br />لكن هما يعذبوا في ميتين ابونا احنا بس<br />وبعدين اذا كان الحكم موافق لشرع ربنا فالف مرحبا<br />افحكم الجاهلية يبغون ومن احسن من الله حكما لقوم يوقنون<br />انا لو اخطأت خطأ وسيتم الحكم علي وفق احكام الشريعة الاسلامية حكون اسعد واحد في العالم لتنفيذ شرع الله حتى<br />وليه الزعل لما المصريين يغلطوا في السعودية يتحاكموا<br />ولما السعوديين يغلطوا في مصر يتحاكموا<br />ايه المشكلة"
archived = "2010-03-14"
capture_url = ""

