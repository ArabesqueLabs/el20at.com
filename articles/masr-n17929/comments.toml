[[comments]]
order = 0
subject = "البورصة لية -"
author = "سعيد ابو محمود"
posted = "2008-10-16"
text = "لية المضاربة على الاسهم<br />ويعنى اية بورصة ؟<br />نفترض اننى صاحب شركة وليكن اسمها شركة تسليك المواسير المسدودة - ومحتاج 10 مليون جنية اعمل توسعات سواء وهمية او حقيقية<br />يبقى امامى طريقين للحصول على العشرة مليون جنية<br />الطريق الاول اروح البنك اى بنك واخذ قرض ب 10 مليون جنية واسدد الفوائد والاقساط<br />الطريق الثانى<br />اطرح العشرة مليون جنية دول اسهم فى البورصة والناس الطيبين هيشتروا الاسهم وها اخد العشرة مليون ولا ها اسددهم ولا ها ادفع فوايد ولا اى حاجة والاسهم دى هتنباع من واحد للتانى للتالت للرابع بدون معرفة اى اصول لهذة الاسهم<br />نفترض ان البورصة لاى سبب كان انهارت تماما وراحت فى الباى باى وكل واحد راح يشوف اسهمة على الطبيعة دى اية<br />هيلاقى مقر للشركة - مكتب<br />ويمكن مصنع فية شوية مكن خردة او مخزن فية شوية كيماويات تالفة<br />بورصة اية ياعم الحاج<br />دى لعب قمار"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070848/http://masr.20at.com:80/newArticle.php?sid=17929"

