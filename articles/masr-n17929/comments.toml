subject = "الأسيوطي بك"
author = "الاسيوطي"
text = "الله الله كتير حلو الموضوع ده يا استاذة دعاء يا بنت عم حسن بس احلى حاجه عجبتني بصراحه ان الموضوع رغم اهميته الا انه خفيف يتقري مش مكلكع زي اللي بنقراهم في الاهرام والاخبار احسنتى يا استاذه دعاء"
archived = "2008-10-18"
capture_url = "https://web.archive.org/web/20081018070848/http://masr.20at.com:80/newArticle.php?sid=17929"
