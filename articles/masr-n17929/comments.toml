[[comments]]
order = 3
subject = "معنى البورصة الحقيقى"
author = "د/ حسام ممدوح"
posted = "2008-10-19"
text = "لا طالما تحقيق يبقى انا موش هتكلم غير فى وجود المحامى بتاعى...هههههههههه<br />بس بما انك اقتنعتى اخيرا انى عبقرى وراى هوه اللى يحل الموضوع ده...فشوفى يا ستى...<br />اولا ما هى البورصة؟؟؟ البورصة هى انثى البورص وهو من الزواحف لانها بتزحف على الحيطة...<br />ثانيا ما هى الفلوس..؟؟ الفلوس دى عبارة عن ورق اخويا بيسرقوا منى ولما اقوله انت مكنش معاك الفلوس دى كلها امبارح ؟ يقولى ما اللى كانت معايا ولدت...<br />ثالثا يعنى ايه استثمار؟ كلمة تتكون من 3 مقاطع<br />s المقطع الاول اس وده ترجمة حرف<br />المقطع الثانى تث ودى كلمة بيقولها الاطفال لما بياخدو حقنة...<br />المقطع الثالث مار دى النص التانى من كلمة حمار<br />وبذلك تكون الاجابة؟<br />عندما يذهب الحمار عشان يخلى فلوسه تولد بتقوم البورصة- انثى البورص- تقرصه وعشان كده بنديله تث- حقنة-و حرف<br />s<br />لا محل له من الاعراب"
archived = "2010-03-14"
capture_url = ""
