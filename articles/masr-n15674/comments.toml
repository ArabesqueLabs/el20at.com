[[comments]]
order = 0
subject = "جميل ورائع وماذا بعد ؟"
author = "سعد"
text = "الحمد للة نجحت خطة الاصلاح ولا عودة للوراء والمواطن سعيد ومبسوط جدا<br />كما ان الشعب سيظل متمسكا بالانجازات ولن ينجر وراء قلة حاقدة عددها صغير لا يتجاوز 75 مليون مصرى<br />كما نهنىء بالانجازات الرائعة التى حققها شعبنا فى مجال مباحث امن النظام والامن المركزى<br />ونشكر حكومة اسرائيل على مدها لنا بقنابل الدخان والرصاص المطاطى وسنقابل جميلها بمدها بالغاز الطبيعى بالمجان عرفانا وشكرا لها"
archived = "2008-05-09"
capture_url = "https://web.archive.org/web/20080509000058/http://masr.20at.com:80/newArticle.php?sid=15674"
