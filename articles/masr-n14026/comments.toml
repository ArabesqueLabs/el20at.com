subject = "سدوا مناخيركم والتحموا بالطبقات البيئه لان كتر البرطمه اخره هزاءه"
author = "محمد سيف"
text = "احنا فعلا بنعيش جو من الحرية بس مش عارفين نستخدمه عدل .. احنا فاكرين الديموقراطية ان حسنى مبارك يقول والله معاكو حق انا ماشى باى باى .. لا الديموقراطية طلوع عين ومسار طويل وجعير اقل وتنيسق مع اصحاب المصالح الحقيقة من ناس كادحه مش تصاوير فى الفضائيات ولطم فى جرنان الدستور.. محدش يقول بيقبضوا ع الناس لانهم طول عمرهم بيقبضوا ع الناس !!!!!"
