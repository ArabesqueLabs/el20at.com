[[comments]]
order = 2
subject = "الفقر \"وباء\" أصاب المجتمع المصرى في مقتل"
author = "تحقيق – أشرف جمال"
posted = "2009-03-03"
text = "الفقر \"وباء\" أصاب المجتمع المصرى في مقتل<br />* 64% من إجمالى سكان مصر يعانون الفقر..!!<br />* دخل الفرد فى أوروبا 17 ألف دولار سنويا.. وفى مصر 800 دولار فقط..؟!<br />* الفساد والرشاوى ناتج طبيعى لتفشى الظاهرة<br />* ارتفاع الأسعار + البطالة + العنوسة + الزواج العرفى = الفقر..<br />الكثير منا لا يعلم أن عدد المصريين الذين وقعوا تحت خط الفقر \"من حيث الانفاق\" قد بلغ قرابة الـ 15 مليون مواطن، وإذا أضيف عليهم فئة \"الفقراء المعتدلين\" فسوف يرتفع العدد ليصل إلى 48% من إجمالى سكان مصر.. أما عن عدد الفقراء \"من حيث الدخل\" فقد بلغ نحو 64% من السكان منهم 36% تحت خط الفقر... ولقد سجلت محافظات الوجه القبلى أعلى نسبة من حيث عدد الفقراء فوصلوا إلى 34.95$ من سكان تلك المنطقة.. وبرغم تحقيق مصر لمعدل نمو وصل إلى 4.4% خلال الفترة من 1980-1999، إلا أنه قد ارتفع عدد الفقراء بها حتى أصبح أكثر من نصف سكان مصر يقعون تحت خط الفقر، وبد بلغت فجوة الفقر داخل مصر إلى 14% مما وضع مصر فى المؤخرة مقارنة بغيرها من الدول العربية كالأردن وتونس والمغرب، وذلك لأن مصر ليست تعانى من فقر الدخل فحسب، وإنما تعانى أيضا من فقر القدرات.. فلقد بلغ معدل \"البطالة\" كأحد مرادفات الفقر نحو 9% بين الرجال و19.8% بين الإناث، هذا بخلاف عدم وجود نسبة وتناسب بين دخل الفرد ونفقاته التى تتعداه بمراحل.. فبالنظر إلى حال أى أسرة مصرية \"عادية\" فسوف نجد أن رب الأسرة يبذل قصارى جهده ويعمل ليل نهار لا لشئ سوى تلبية الاحتياجات الأساسية له ولأفراد أسرته، حيث أصبح الدخل الذى يتقاضاه رب أى أسرة بسيطة لا يتناسب والاحتياجات الأساسية التى أصبحت بمثابة \"مثلث الرعب\" والذى يتكون أضلاعه من \"الطعام والملبس والدروس\"... وأمام تلك الظاهرة التى تفشت بشكل ظاهرى لا يمكن إغفاله، كان من الضرورى التعرف على آراء الخبراء حول الفقر وأسبابه وأبعاده وكيفية الخلاص منه..<br />يؤكد الدكتور حسن عبد الفضيل الخبير الاقتصادى أن الشعب المصرى قد وصل لدرجة الإذلال، ليس فقط لأنه لا يستطيع أن يفى بمتطلبات الطعام والشراب لبيته فحسب، بل أيضا أصبح أغلب أفراد الشعب لا يستطيعوا تلبية احتياجاتهم الأساسية، ومع ذلك نسمع رئيس الوزراء يقول أن مصر لا يوجد بها مواطن ينام من غير عشاء...!! وهذا إن دل فسوف يدل على مدى استخفاف المسئولين بمعاناة الشعب.. ويقول د. حسن عبد الفضيل أن المواطن المصرى اليوم أصبح شغله الشاغل هو سعيه وراء لقمة العيش لكى يحقق الحد الأدنى من الاشباع نتيجة لحالة الغلاء الرهيبة التى أصبحنا نعيشها، فارتفاع الأسعار أدى إلى وجود أسر تنام من غير عشاء – عكس ما كان يمزح به رئيس الوزراء -، ويضيف د. عبد الفضيل أنه فيما يخص متوسط دخل الفرد فى الدول المتقدمة مقارنة بالدول الفقيرة فسنجد أن الدول المتقدمة يصل متوسط دخل الفرد بها ما بين 12 إلى 17 ألف دولار فى السنة، بينما يكون فى الدول الفقيرة من 3 إلى 5 آلاف دولار سنويا.. أما عن مصر فيؤكد الخبير الاقتصادى أن متوسط الدخل السنوى للفرد لا يتجاوز 800 دولار – أى أن أكثر من 15 مليون مواطن مصرى دخل الفرد فيهم أقل من دولار واحد فى اليوم وهذا أقل من حد الفقر..<br />ويرى الدكتور أحمد المجدوب الخبير الاجتماعى أن البيت المصرى ليس له نموذج موحد فى شكله مثلما يوجد نموذج للبيت الانجليزى الذى من الممكن أن يزيد أو يقل عنه، ولكن فى مصر لدينا نماذج كثيرة – أى أن البيت الواحد لا يمكن أن يعبر عن حقيقة الطبقة التى يمثلها – فالأسرة المصرية مرت بظروف أفقدتها توازنها، وجعلتها تعانى ازدواجية فى القيم والتفكير.. فالبعض منها ينفق أكثر مما يدخلها من مرتب على أساس المظهرية، فميزانية الأسرة فى العالم المتحضر توجد بها أولويات وأساسيات كالطعام الجيد والملبس والتعليم والثقافة، بجانب الادخار للاجازة.. ولكن ذلك لا يحدث للمواطن المصرى المطحون.. ويضيف د. أحمد المجدوب بأن الموظف الحكومى أصعب حالا من العامل البسيط، وذلك لأنه يعانى من ثبوت راتبه فى مقابل ارتفاع الأسعار من حوله، وهو ما قد يدفع البعض منهم لقبول الرشاوى وتغيير سلوكياتهم بالشكل السلبى وذلك لكى يستطيعوا الصمود أمام موجات الغلاء..<br />بينما تؤكد الدكتورة سهير عبد المنعم الخبير الجنائى بالمركز القومى للبحوث الجنائية والاجتماعية على تفشى جرائم الفساد والسرقة والرشاوى فى الآونة الأخيرة كنتيجة طبيعية لتغلغل الفقر للمجتمع المصرى، فلقد أصبح السارق والمرتشى مقتنعا تمام الاقتناع بأن ما يحصل عليه من رشوى ما هو إلا \"استكمال\" لراتبه الأساسى الذى لا يستطيع العيش به وحده، وهو ما يؤكد أن للفقر قوانينه الخاصة.. وتضيف الدكتورة سهير عبد المنعم بأننا إذا نظرنا إلى حال مجتمعنا اليوم وقارناه بما كان عليه سابقا فسنجد أننا فى كارثة حقيقية فرب الأسرة أصبح غير قادر على تلبية احتياجات أسرته، والشباب بدون عمل وتكاليف الزواج فى ارتفاع مستمر، حتى وصلت حالات \"العنوسة\" إلى قرابة 9 ملايين شاب وفتاة تعدوا سن الخامسة والثلاثين بلا زواج، كما تفشت ظاهرة الزواج العرفى، وبمرور الأيام وفى ظل استمرار الوضع الاقتصادى على ما هو عليه الآن سوف تتفشى العديد من الآفات والسلبيات داخل مجتمعنا الذى أصبح هشا..<br />ويشير الدكتور عبد السلام محمد المدرس بمعهد التخطيط القومى إلى أن حال المواطن المصرى أصبح فى تدهور مستمر، وذلك بسبب التغيرات التى طرأت على تحرير سعر الصرف، وكذا تدهور قيمة الجنيه المصرى، وارتفاع الأسعار للسلع الأساسية، وهو ما أدى إلى انخفاض قيمة المرتب الأساسى ولا سيما مرتبات القطاع العام، حيث أصبح لا يوجد نسبة وتناسب بين احتياجات ومصاريف المواطن وقيمة مرتبه مما دفع المواطن إلى البحث عن طرق أخرى (شرعية أو غير) لكى يفى بالمتطلبات المرجوة منه، ويؤكد د. عبد السلام أنه لكى تتحسن ظروف الأسرة المصرية فلابد من رفع أجور الموظفين بالحكومة والقطاع العام بالشكل الذى يتلائم مع مصاريفهم فى ظل الزيادة المستمرة فى الأسعار، وكذلك لابد من العمل بجدية على حل مشكلة البطالة وذلك بحيث يكون داخل الأسرة أكثر من شخص يعمل.."
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003020/http://masr.20at.com:80/newArticle.php?sid=20174"

[[comments]]
order = 3
subject = "طز فى التهدئة بين غزة واسرائيل وملعون ابو المصالحة"
author = "اكتب اسمك هنا"
posted = "2009-03-03"
text = "تولع غزة بجاز<br />وتروح التهدئة فى ستين داهية<br />ويا رب حماس تاكل فتح ويروحوا فى ستين داهية الاتنين<br />الحكومة والرياسة شاغلة نفسها بمشاكل برانية وسايبة الشعب يطلع عين امة ويعمل كل يوم اضراب علشان يعرف يعيش<br />احنا عايزين حكومة مصرية تعمل تهدئة مع رغيف الخبز<br />حكومة تصلح لنا التعليم والصحة والكهرباء<br />قرفنا من الانشغال بمشاكل الغير وترك مشاكلنا واحنا بنسف التراب<br />الشباب بيموت على شواطىء اوروبا والبنات قاعدين فى البيت عوانس وحكومتنا بتدور على التهدئة وجمع الفصائل وفتح ومش فتح<br />قرفنا"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003020/http://masr.20at.com:80/newArticle.php?sid=20174"

