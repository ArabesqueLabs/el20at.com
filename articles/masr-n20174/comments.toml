[[comments]]
order = 8
subject = "حقوق الحمير والكلاب والقرود ------- وليس حقوق الان"
author = "شحبور"
posted = "2009-03-06"
text = "هناك نكتة قديمة قوى<br />بتقول ان كلب هرب من صاحبة وبحث صاحبة عنة فى كل مكان ولمدة شهور حتى عثر علية على الحدود يحاول الهروب الى ليبيا فامسكوا بة وسالوة<br />انت بتهرب على ليبيا لية ؟<br />قال لهم<br />الحكومة وامن الدولة بيقبضوا على الحمير<br />قالوا لة<br />طيب انت مالك - انت كلب واللى بيقبضوا عليهم حمير<br />قال لهم<br />حلينى بقى لما اثبت لهم ويفهموا اننى كلب ومش حمار<br />مفيش حاجة اسمها حقوق<br />كلة بيتاخد مع بعضة العاطل بالباطل<br />الم تقرأوا فى الجرايد انهم اعتقلوا صبى عمرة 12 سنة وظل فى المعتقل 20 سنة بدون محاكمة او سؤال او اى من اهلة يعرف مكانة او مكان اعتقالة او ان كان حى او ميت<br />الانسان فى البلد دى لما بيدخل السجن او المعتقل بيتحول الى رقم وبينادوة برقمة وليس باسمة او اسم ابوة<br />منتهى الاذلال ان يتحول الانسان الى مجرد رقم او نمرة<br />المسجون نمرة سبعة هكذا ينادونة داخل المعتقل<br />وكل يوم تعذيب وكل يوم تكدير<br />حقوق انسان اية"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003020/http://masr.20at.com:80/newArticle.php?sid=20174"

