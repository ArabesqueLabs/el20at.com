text = "فية وزير فى العالم بيقعد فى الوزارة 22 عاما<br />ياة<br />فى مصر احنا بنحب نحتفظ بجثث الموتى ونعمل لهم تحنيط والحمد للة الطب تقدم وبقى المتحنط بيمشى وبيتكلم<br />واحد زى وزير الثقافة بقى لة فى الوزارة 22 سنة - لية - الثقافة لا تنبع الا من راسة هو بس وجفت من رؤوس باقى المصريين<br />فاروق حسنى 22 سنة فى الوزارة وغيرة وغيرة وغيرة وكلهم جثث متحركة<br />والمفروض مصلحة الاثار لا تترك ممتلكاتها تقرف الناس اكتر من كدة"
