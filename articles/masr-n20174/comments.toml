subject = "اى حقوق واى انسان"
author = "مصرى"
posted = "2009-03-03"
text = "الساعة الثالثة ليلا - باقى على الفجر ساعة<br />تنزل الى القرية سيارة فيها قوة من الشرطة ومعهم خفير من القرية ليدلهم على المطلوبين واماكن بيوتهم<br />يضعون سلما على جدار البيت ويتسلقون الى السقف ثم ينزلوا على السلالم ويدخلوا الغرف على اصحاب البيت النايمين سواء فتيات او سيدات ويرعبونهم والمسدسات والبنادق فى ايديهم<br />هل اتوا ليقبضوا على مجرم قاتل او هارب<br />كلا<br />ان الشخص الذى اتوا للقبض علية - علية مخالفة مرور او مخالفة اشغال طريق - او حكم نفقة او مخالفة رى<br />ويقبضون علية مكبلا فى الفجر الى مركز الشرطة حتى ياتى اهلة فى الصباح ويدفعون المخالفة المالية ويطلقون سراحة<br />هذة الوحدة التى تعتقل فى الفجر اسمها وحدة تنفيذ الاحكام - وربما الشخص لا يدرى ان علية مخالفة<br />هل هذة معاملة تليق بالحيوان فما بالك بالانسان<br />لو ان الضابط ارسل مخبر الى بيت الشخص يطلب منة دفع المخالفة فى الصباح - ماذا يحدث<br />لماذا ترويع الناس وامتهان ادميتهم ؟<br />مش عارف<br />من اى نظام فى العالم اقتبسوا هذا النظام<br />اظن ان المماليك لم يفعلوا هذا"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003020/http://masr.20at.com:80/newArticle.php?sid=20174"

