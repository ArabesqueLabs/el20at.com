subject = "حاجة مضحكة فعلا"
author = "المصرى أفندى"
posted = "2009-03-03"
text = "والله كلامك صحيح. أحنا ماعندناش حقوق ولا أنسان. البلد أصبحت عزبة من فوق مبارك وعيلته بيشخوا علينا وتحت بقى كل من هب ودب بيدى الشعب على قفاه. والحكومة بتشحت من أمريكا وتقول لها أحلى من الشرف مفيش أحنا مش بنمد أيدينا (بس مفيش مانع من المساعدات اللى من الأصدقاء) (وأحنا لا نقبل أى أنتقاد من أى حكومة أجنبية) بأحس أننا بنتفرج على تمثيلية من بتوع تليفزيون التخلف العقلى بتاعنا. سؤال بأسأله لرب العباد أمتى يارب حنشوف أخر النفق بقى أمتى ؟؟؟"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003020/http://masr.20at.com:80/newArticle.php?sid=20174"

