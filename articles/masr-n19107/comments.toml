[[comments]]
order = 0
subject = "الازمة ستشتد ويظهر تأثيرها فى منتصف 2009"
author = "شايف"
posted = "2009-01-01"
text = "فى منتصف عام 2009 ستظهر المشكلة بشكل حاد - هذا ما يتوقعة بعض الخبراء المتشائمين<br />فبعض دول الخليج ستستغنى عن العمالة وخصوصا فى مجال المعمار والانشاءات<br />وشركات القطاع الخاص ستقلص نشاطها لقلة المبيعات وقلة التصدير<br />والعائد من السياحة سيقل اكثر من 50 %<br />وطبعا سيزيد السرقات واعمال النهب<br />وكلها توقعات<br />ولكن يمكن ربنا يعدل الاحوال ونلاقى بترول ابو قرقاص ودشنا"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103055345/http://masr.20at.com:80/newArticle.php?sid=19107"

