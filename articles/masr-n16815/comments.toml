[[comments]]
order = 4
subject = "التكافل الاجتماعي من الاسلام"
author = "ابومحسن"
posted = "2008-07-19"
text = "الموضوع دا يا جماعة بيوضح نظرية التكافل الاجتماعي وهذه عادة عربية اسلامية اصيلة او زي التأمين الاسلامي الدفع بشرط المشاركة<br />وهذ النوع من التكافل تجده في الدول العربية والاسلامية<br />يعني مثلا لما واحد يعمل عملية جراحية بمبلغ 1000 جنيه لما كل واحد يودي حاجه بتخفف العبء عن الاسرة<br />او واحدة تخلف كل واحد يودي مبلغ من المال او هدية دهب تعين العروسين على هذا الحدث الطارى<br />لانه يعرف انه لما يحصل حاجه عنده الناس حتيجي وتجبله زي ما هو ودا للناس<br />الموضوع ممتاز يا استاذه رضوى"
archived = "2008-07-20"
capture_url = "https://web.archive.org/web/20080720094127/http://masr.20at.com:80/newArticle.php?sid=16815"
