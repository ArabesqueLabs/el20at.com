[[comments]]
order = 0
subject = "حجة البليد مسح التختة"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-26"
text = "سوف يخسر جميع طلاب الجماعة الموبوئة اياها اللى اسمها جماعة الاخوان المسلمين الانتخابات<br />ثم سوف يجروا و يتباكو و يدعون كذبا كعهدهم دائما بان امن الدولة زور الانتخابات<br />تذكروا هذا جيدا يا شباب مصر و امل المستقبل"
archived = "2008-08-27"
capture_url = "https://web.archive.org/web/20080827031358/http://masr.20at.com:80/newArticle.php?sid=17213"

[[comments]]
order = 1
subject = "ليتنى حقا كنت و زيرا للتعليم"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-28"
text = "الجامعات على كل اشكالها و انواعها محراب للعلم و البحث و الاجتهادو التحصيل و الاختراع و الابتكار------------؟<br />اما ان تتحول ساحاتها و اروقتها الى حلبات للقتال و المصارعة و الترغيب و التهويل ؟فهذا الشيئى لا يجب السكوت علية تحت اية مسميات ايا كانت؟؟؟<br />ليفصل اى طالب تسمح نفسة بالقيام باى صورة من صور التظاهر ايا كانت؟؟؟<br />و هناك الاف من الطلبة غى احتياج للعلم و ليس احتياج للتناحر و التظاهر و الاقتتال؟<br />الادب و النظام فضل على العلم<br />فكيف لكم بصور التخلف اياها من استعراض القوة متمثلة فى العضلات و السيوف و البلط و الخناجر و السكاكين و الجنازير و ارتداء الاقنعة على الوجوة كما القتلة و الاهابيين داخل الجامعاتو تسخير الشعارات الدينية لتاجيج نفوس هئولاء الصبية الصغار؟و تضليلهم؟؟؟؟؟<br />و اهههههههههههههههههههههههههههههههههههههههههههههههههة يا مصر!"
archived = "2008-09-01"
capture_url = "https://web.archive.org/web/20080901220400/http://masr.20at.com:80/newArticle.php?sid=17213"

[[comments]]
order = 2
subject = "نصيحة خالصة من القلب الى السيد الدكتور  (وزير التع"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-01"
text = "(أضرب المربوط ؟ يخاف السايب؟!)<br />للحفاظ على النظام و قدسية و طهارة الحرم الجامعى ؟<br />فعليك بتقوية و تدعيم السلطة الممنوحة للجان التاديب بالجامعات؟<br />ارفد 12 او 25 او حتى 250 من الطلبة اياهم معتادى التظاهر و التخريب و التخريف اياهم اعضاء(الاخوان المسلمون)<br />و من ثم سوف تجد كيف سارت الامور و الاحوال؟<br />من هدوء _ أمن _ نظام _ احترام _ تحصيل _ ------------------------------------------!<br />اشكركم و اللة معكم"
archived = "2008-09-01"
capture_url = "https://web.archive.org/web/20080901220400/http://masr.20at.com:80/newArticle.php?sid=17213"
