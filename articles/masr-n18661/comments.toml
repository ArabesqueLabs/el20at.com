[[comments]]
order = 1
subject = "اوعى تنسى البصل كمان و حياة والديك"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "بالذمة دة كلام وزراء مسئولين؟<br />فضحتونا يا بهايم<br />و متنساش البصل و حياة اهللك يا طور<br />على الاقل البصل هيمنع القبلات و بالتالى هيكون و سيلة خفية لمنع الحمل و زيادة السكان كمان"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195202/http://masr.20at.com:80/newArticle.php?sid=18661"

[[comments]]
order = 2
subject = "ها هااااا هاااااااااااااااااا بعد (خمسين سنة هنكون موتنا و فى التراب)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "بعد خمسين سنة؟<br />ابقى قابلنى فى الاخرة يا(طور)جبلى<br />انت عبيط و لا انت عبيط و لا انت حقيقى عبيط!!!"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195202/http://masr.20at.com:80/newArticle.php?sid=18661"

[[comments]]
order = 3
subject = "ويا دكتور يضاف اليها سم الفار"
author = "دكتور من غير الدك"
text = "وبعد نجاح تجربة اطعام الشعب القمح المخصص لعلف الحيوان واصبح الشعب بينهق ويرفس<br />الكتور اللى واخد الكتوراة بتاعتة من عند سيد كشرى او سعيد كفتة هيجيب وجبة طعمية ويا ترى يا دكتور الطعمية هتبقى اقراص والا كفتة ويا ترى الكشرى بالخلطة والشطة والا من غير<br />والشعب اللى هياكلها معندوش شفافية ولا يتمتع بالمواطنة<br />وبالمناسبة الوجبة دى هتتوزع مع الاسهم والصكوك والا دى نقرة ودى نقرة تانية<br />وبعدين الطعمية مش عايزة خبز ورغيف عيش والا الناس ها تكلها حاف"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195202/http://masr.20at.com:80/newArticle.php?sid=18661"

[[comments]]
order = 4
subject = "ويا ترى الاكل دة هيتاكل فى انهو زريبة"
author = "شبعان نهيق"
text = "بالمناسبة يا دكتور هتجيب عسل اسود من اين يكفى 70 مليون بنى ادم والا العسل الاسود هيتاخد فى العضل<br />يا راجل يا مليونير خليتوا عيشتنا سواد فى سواد - بالمناسبة المستشفيات الخاصة بتاعتك بتكسب كم مليون فى السنة<br />عسل اسود مخلوط بالزفت"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195202/http://masr.20at.com:80/newArticle.php?sid=18661"

[[comments]]
order = 5
subject = "احنا معارضة ومش هناكل وجبة الوطنى وهناكل خبيزة وبيصارة وكشك ومحشى"
author = "حلو خالص"
text = "يا عم ابعد عنا مش عايزين وجبتك<br />هناكل خبيزة ومخلل وبيصارة ومحشى كرنب ومحشى ورق خص حملاوى<br />وهنحللى ببدنجان مشوى وجزر مسلوق<br />دكاترة اخر زمن<br />ربنا يسد نفسكم يا"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195202/http://masr.20at.com:80/newArticle.php?sid=18661"
