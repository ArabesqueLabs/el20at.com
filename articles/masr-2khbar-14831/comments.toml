author = "علمنى الهيافة"
posted = "2010-01-11"
text = "طالبات جامعة الزقازيق دخلوا الامتحان عادى بالنقاب<br />وطالبات القاهرة منعوهم<br />طيب مالفائدة التى عادت على مصر من السماح او منع النقاب<br />مش ملاحظ اننا بقينا هايفين قوى<br />طيب ما كل واحد حر يلبس اللى هو عايزة<br />هل الاجراءات دى هتمنع النقاب من الشوارع والبيوت والا هتزيدها ؟<br />وبعدين كل مشاكل التعليم انتهت وباقى النقاب<br />متعنا اللة بالهيافة واكثر من امثال الطنطاوى وهلال والزقزوق"
