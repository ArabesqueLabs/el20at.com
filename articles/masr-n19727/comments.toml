subject = "استهبال اسمة اسعار الاوكازيون --- فية حاجة اسمها الانتاج الصينى"
text = "المواطن المصرى الغلبان بيشجع المنتج الصينى الرخيص<br />اية اللى هيخللى الناس تشترى قميص ب 70 جنية فى الاوكازيون والقميص الصينى زى الفل ب 15 جنية<br />وبعدين هى فين الفلوس اللى مع الناس<br />ما عمك نظيف والاخ بطرس غالى نظفوا جيوب المصريين"
