[[comments]]
order = 1
subject = "إرحمونا"
author = "محمد علي كلاي"
posted = "2007-12-14"
text = "علي فكرة الحوار ده كلام عالفاضي يا عشرينات و إن دل علي شيء يدل علي عدم متابعتكم للبرامج التعليمية<br />الموضوع ده إسمه التبادل الثقافي.ومهم جدا للناس تعرف إزاي زمايلهم في الدول التانية في نفس سنهم بيتعلموا إزاي و عايشين إزاي..... و أنا أفخر إني شاركت في يوم من الأيام في البرنامج ده<br />أولا هوة مش لأميريكا بس.... فيه لفرنسا و ألمانيا و إنجلترا ماليزيا و دول كتير جدا بتشارك في الموضوع ده<br />ثانيا .... فيه طلبة أمريكان بيجوا بدل الطلبة اللي سافروا و كانوا في مدرستنا ... هل معني هذا إننا عاوزين نغسل عقول الشباب الأمريكي؟<br />يا إمان بقي هما مستهدفين شباب الأردن مخصوص يمكن لجمالهم و عبقريتهم ولا أيه ربنا يشفي<br />ثالثا الجمعية اللي بترعي البرنامج ده في مصر إسمها أي أف أس .... وهيا جمعية محترمة جدا وبتهتم ببرامج تمويل العمليات التعليمية<br />أنا مسلم علي فكرة و الحمد لله .... بس نظرية المؤامرة اللي عايشين فيها دي ضحكت علينا العالم كله"
archived = "2010-03-14"
capture_url = ""

