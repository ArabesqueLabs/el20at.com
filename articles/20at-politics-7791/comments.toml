[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-12-18"
text = "من سخرية الاعلام العربي انه مشبع بالقيم الاشتراكية والشيوعية المترسبة منذ قيام ثورة يوليو المجيدة!<br />كلمة \"استعمار ثقافي\" تدل على ان الناس في الشرق الاوسط من ابناء حضارتنا هم مجموعة من المعاتيه الذين لا يحملون قيم ،وبمجرد ان حاول احدهم تغيير قيمهم سوف تتغير هذه القيم!<br />لو كان فينا خير،لمسكنا هؤلاء الطلبة الاردنيين وادخالناهم في دورة تعليمية قبل ارسالهم لامريكا،ونطلب منهم ان يكونوا سفراء للدول العربية بعدما فشل الاعلام العربي الفاشل في الوصول الى المواطن الامريكي!<br />سحقا...ألم ينتشر الاسلام في أكبر دولة اسلامية عرفها التاريخ وهي اندنيسيا بلا أي قطرة دم! بل عن طريق تاجر مسلم كان صادقا ومحبا للخير هدى الله على يديه امة كاملة!"
archived = "2010-03-14"
capture_url = ""

