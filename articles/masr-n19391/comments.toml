posted = "2009-01-20"
text = "طبعا لما بتكون توجهات القيادة السياسية وجميع الخطط والاستراتيجيات مبنية على حاجة واحدة اللى هى لم فلوس باى طريقة وباسرع وقت فى الحالة دى مبارك ومستشارية مش عاوزين يوجعوا دماغهم بغزة ويزعلوا اسرائيكا بس لما يقف الضرب وتبتدى المفاوضات وتنهال المعونات يخش حمامة السلام والدولار حسنى بية مبارك علشان يشوف حل لمشكلة المعونات دى وحتتقسم ازا ى وفين"
