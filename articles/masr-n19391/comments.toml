[[comments]]
order = 6
subject = "الى السيد المحترم الذى قام بالرد"
author = "حسين كامل"
posted = "2009-01-22"
text = "اولا تحية طيبة ,, ثانيا تعتقد ان اسلوبك فى الرد المصحوب بكم هائل من البذأت سوف يغضبى ( لا والله ) العكس هو الصحيح فانا سعيد بردك لكى اوضح للقراء اخلاق الاخوان المتأسلمين من الداعين الى حجابهم الاخوانى ونقابهم الطالبانى ويبدو من حديثك واسلوبك ان جميع اهل بيتك من المنقبات او ممن ارتدوا الحجاب الاخوانى ومع ذلك فانا حكمت على سلوكيات تلك الاسرة التى تنتمى اليها من اسلوب ردك الذى اوضح انك تربيت تربية اخوانية سليمة فهذا الاسلوب فى الرد اعتدنا علية من الاخوان المتأسلمين داخل مواقع النت وهو ليس بجديد او غريب علينا فنحن نعرفكم عن ظهر قلب , شكرا ولك منى اطيب تحية واتمنى فى المره القادمة ان تتماسك اعصابك حتى يكون الحوار بيننا مثمر ."
archived = "2009-01-23"
capture_url = "https://web.archive.org/web/20090123200633/http://masr.20at.com:80/newArticle.php?sid=19391"
