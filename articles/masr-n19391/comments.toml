[[comments]]
order = 3
subject = "الحجاب الاخوانى"
author = "حسين كامل"
posted = "2009-01-21"
text = "هذا الحجاب هو حجاب اخوانى وهو ليس اكثر من رمز للاخوان المتأسلمين ليقولوا نحن نسيطر على الشارع المصرى ولكن الحقيقة ان حجابهم الاخوانى انتشر بسبب الملايين التى انفقوها فى الدعاية لحجابهم الاخوانى مستغلين الفنانات والراقصات فدفعوا لهم الملايين حتى يتحجبوا !! والدليل ان ذلك الحجاب الاخوانى هو اكذوبة اذهبوا الى كورنيش النيل لتشاهدوا المحجبات فى اوضاع مخلة , اذهبوا الى السينمات لتشاهدوا المحجبات فى الصفوف الخلفية , اذهبوا الى المراكز التجارية لتشاهدوا الحجاب على بنطلون جينز وتشى شرت ضيق , اذهبوا الى الحفلات الغنائية التى يبسها التليفزيون لتشاهدوا المحجبات وهم يرقصون ويتمايلون وفى المقابل نجد الغير محجبات قمة فى الاخلاق والالتزام !! الحجاب الاخوانى اصبح زى شعبى للعامة والغوغاء والفقراء موحدودى الدخل والمتخلفين عقليا ممن وضعوا شعار الاخوان المتأسلمين على رؤسهم وهم لا يعلموا ان الاخوان المتأسلمين استغلوا رؤسهم كلوحة اعلانات ووضعوا عليها حجابهم الاخوانى ."
archived = "2009-01-23"
capture_url = "https://web.archive.org/web/20090123200633/http://masr.20at.com:80/newArticle.php?sid=19391"

[[comments]]
order = 4
subject = "الى ام حسين كامل"
author = "واحد"
posted = "2009-01-22"
text = "بدل الحجاب بكس امك هيلبسوا نقاب<br />البنات والستات هيلبسوا نقاب وهيعملوا كل اللى هم عايزينة<br />بس خللى بنات ونسوان اهللك النصارى الشراميط يمشوا فى الشارع وطيازهم عريانة علشان نعرفهم<br />اكتب باسمك الحقيقى يا زخارى يا ابن المتناكة"
archived = "2009-01-23"
capture_url = "https://web.archive.org/web/20090123200633/http://masr.20at.com:80/newArticle.php?sid=19391"

