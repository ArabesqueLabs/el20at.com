[[comments]]
order = 0
subject = "الحقيقة"
author = "اسامه صلاح"
text = "الحقيقة بدون شرح يادكتور (ثابتة بالتاريخ وبشهادة الشهود ومسجلة في الشهر العقاري) ان مصر ليس بها<br />اي مشكلة او نقص طبيعي وفق لدراسة التداريس والموقع الجغرافي في :<br />1- الارض الصالحة و القابلة للزراعة<br />2- المياة سواء جوفية او نيلية او تحلية مياه البحر<br />3- الطاقة بمصادرها المختلفة<br />4- الموارد البشرية والقدرات العقلية<br />5- الموارد الطبيعية (تتفاوت في النسب الا انها كافية لاقامة صناعات متخصصة في كثير من المجالات)<br />اذا ما هي المشكلة ؟ الاجابة سوء الادارة"
archived = "2008-04-15"
capture_url = "https://web.archive.org/web/20080415161122/http://masr.20at.com:80/newArticle.php?sid=15199"

