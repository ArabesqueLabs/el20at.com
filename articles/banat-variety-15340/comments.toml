posted = "2010-03-05"
text = "بسم الله الرحمن الرحيم<br />احب ان ارد علي بعض التعليقات بوجه عام<br />اولا يا جماعه ليه قلبتو الحكايه خناقه وده مسلم والتاني مسيحي الموضوع ابسط من كده كلنا بشر والدين لله وحده وهو اعلم بكل واحد فينا والمفروض ان يكون فيه تسامح وسلام بينا واعتقد تن ده اللي بتنادي بيه كل الاديان سواء الاسلام او المسيحيه او اليهوديه<br />ثانيا للناس اللي بتقول نتكلم في كل حاجه بس نبعد عن الدين انا مش معاهم لان الدين ده جزء لا يتجزاء من الشخص نفسه والمجتمع مفهاش حاجه اننا نعرض قصص اسلام مسحيات او العكس ويا ريت يكون فيه تسامح بينا اكتر من كده وبلاش التعصب لان خير الامور الوسط<br />ثالثا انا مش مع الناس اللي بتشتم او بتسئ للدين الاسلامي او المسيحي او اليهودي لاننا لو بصينا هانلاقي انها كلها اديان سماويه يعني كلها من عند الله ومصدرها واحد وكل الانبياء سواء سيدنا محمداو سيدنا عيسي او سيدنا موسي كلهم منزلين من عند ربنا<br />واخيرا احب ااقول قال الله عز وجل في كتابه (لكم دينكم ولي دين)واللي بيفضل بينا هي المعامله الحلوه والمعامله لوجه الله"
