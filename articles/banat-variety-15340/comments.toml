text = "مع احترامى للجميع بس الموقع دة عجبنى لاءنة بيفيد كل بنت فعلا وبيديها معلومات مهمة عن صحتها وجمالها وحاجات تانية كتير. لاكن اللى مش عاجبنى انكم تدخلوا موضوع الدين من ضمن الحاجات دى لاءن الدين دة حاجة تانية خالص ومينفعش ان اى حد كدة يتكلم فية وينتقد التانى كاءننا فجاءة قلبناها وعظة او خطبة . ياريت كل واحد يخلية فى دينة وميدخلش فى دين التانى سواء مسلم او مسيحى لاءن الدين دة بتاع ربنا. واعتقد ان مفيش حد هايتحاسب بنيابة عن حد تانى كل واحد فينا هايتحاسب عن نفسة وايمانة وبس."
