text = "اول حاجه الإسلام دين الفطرة السلمية<br />\"إن الدين عند الله الإسلام\" مش كل الناس تعرف دى<br />2 _ بنئول كل يوم الصبح فى أذكار الصباح والمساء<br />\" لا إكراه فى الدين قد تبين الرشد من الغى فمن يكفر بالطاغوت ويؤمن بالله فقد إستمسك بالعروة الوثقى لا إنفصام لها والله سميع عليم\"<br />وئبليها<br />\" الله ولى الذين امنوا يخرجهم من الظلمات الى النور والذين كفروا أوليائهم الطاغوت يخرجونهم من النور إلى الظلمات أولئك أصحاب النار هم فيها خالدون\"<br />\" لله مافى السموات ومافى الأرض وإن تبدو ما فى أنفسكم أو تخفوه يحاسبكم به الله\"<br />الأولى الله ولى الذين أمنوا<br />2 لا إكراه فى الدين<br />3 لله مافى السموات ومافى الأرض<br />وفى النهاية الدين كله لله والنجاشى ئال والحق والحق اقول فى ما معنى كلامه<br />ان هذا الكلام والمسيحية لا ينزل غير من عند إله واحد عند سماعه لسيدنا جعفر<br />احنا الى بنغلط فى دينا بالتعصب لازم نكون لبقين<br />بنئول اننا بندافع عنه واحنا الى بنكره الناس فيه<br />ولو كنت فظاً غليظ القلب لانفضوا من حولك<br />جزاكى الله خيراً<br />مش كان لازم الموضوع يترد عليه بهجوم<br />أشهد أن لا إله إلا الله ، وأن محمد رسول الله"
