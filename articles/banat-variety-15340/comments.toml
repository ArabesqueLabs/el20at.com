text = "ثالثا : لو زى ما انت بتقول المسيحين بيعتمدوا على امريكا فى كل حاجه ، تسمحلى اسئلك احنا ليه قاعدين فى مصر لغايه دلوقتى ؟؟ ولا ليه امريكا مجتش احتلت مصر علشان زى ما بتقول معتمدين عليها !!! اتكلم كلام منطقى كل العالم عارف ان امريكا كيان اقتصادى و سياسى ، يعنى مش هيقفوا مع حد ضد حد الا علشان اغراض سياسيه ملهاش دعوه بالاديان . يعنى مثلا مصر و الدول العربيه ليه مش بيدافعوا عن فلسطين ؟؟؟؟ عارف ليه ، لان كل بلد فيهم بتدور على سلامها و استقرارها هى قبل اى حاجه تانيه . و اكيد امريكا نفس الوضع<br />ده بالاضافه الى ان المسيحين يوم ما بيستنجدوا بحد بيكون بربنا ، هو اقوى من الكل و يقدر على كل حاجه . و معندوش حاجه اهم من مصلحه اولاده<br />سلام."
