text = "اسمحيلى انا اسئلك سؤال هو فى الحقيقه رد سؤالك<br />هو ربنا موجود فين ؟؟؟ اكيد الاجابه مش السماء على فكره .الاجابه ان ربنا موجود فى كل حته :-) ربنا فى الوقت الى فيه محافظ على و مخلى باله من حياتى فى نفس الوقت بيحافظ عليكى ..صح ؟ لا ده مش احنا ال2 بس , شوفى فى كام انسان !!! برده فى نفس اللحظه بيحافظ عليهم . و كمان الحيوانات و الزروع و الطيور :-) هل معنى وجود الكم الهاهل من المشغوليات دى ان ربنا بيتشغل بحاجه على حساب حاجه تانيه ؟؟ حاشا طبعا ... كل حاجه ماشه بعنايه تامه من ربنا<br />فهمتى عايزه اوصل لايه ! يعنى وجوده فوق الصليب عمره ما ينفى وجوده فى السماء او يخليه عاجز على انه يرزق الناس<br />هو فى اللحظه الى شايفنى فيها اذا كنت بعمل صح او لا ، هو شايفك برده ...ده مش لانه قاعد بيتفرج من السماء ، لكن لانه موجود معانا بذاته و شخصه وجوده معايا عمره ما ينفى وجوده مع باقى الناس و الا كانت خربت من زمان .مش كده برده ؟ :-)<br />اتمنى اكون وصلت لك الفكره .سلام"
