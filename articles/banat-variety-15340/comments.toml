text = "نفسى افهم المسيحين دول بيقولوا ايه صلوا على النبى كدا علشا الواحد مرارته هتتفقع ياجماعة ربنا عرفوه بالعقل وكلام الناس دى كله كلام غلط فى غلط ياجماعة يامسيحين احنا احسن منكم علىاقل احنا دينا بيعترف بدينكم وعمركم ماهتلاقى مسلم بيشتم فى المسيح لكن بالعكس وانا رايت كليبات من جوه الكنيسة من الاسيسين الا بيطلعوا يقولو كلام معسول قدام التلفزيون والناس وجوا الكنيسة بيشتموا فى الرسول صلى الله عليه وسلم الا هو اشرف من المسيحين والمسيحية كمان دينا بيعلمنا الطهارة وبيعلمنا الحب وبيعلمنا احترام اى حد كان كافر او مسلم سيدنا جبيريل فضل يوصى الرسول على جاره وجاره كان يهودى والنبى علمنا ازاى حتى لو جارنا يهودى نحترمه مش نشتم فى الكنايس ونطلع بره نقول كلام معسول ياجماعة مابيتنصرش غير واحد فاقد عقله والمسيحيين بيطلعوا به السما ويخلوه يشتم فى الاسلام والمسلمين والنبى لكن لما واحد بياسلم شوفوا بيبقا ازاى فرق كبير بينا وبينكم فرق كبير يالى كل همكم ازاى تخلوا امريكا ترفعكم احلى حاجة عددهم اربعة مليون ويقولوا احنا 15 مش عارف بتتكاثرو الضعفين فى 3 حبيبى يارسول الله وسلام"
