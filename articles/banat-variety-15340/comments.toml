text = "بسم الله الرحمن الرحيم اول كلامى اقولهولك فى ردى على الا بيقولوا المسيحية علمتكم ماتقابلوش الشر بالشر لالاسف ده كلام بس بتقولوه لكن مش بتطبقوه انا بحب ربنا جدا وبحب سيدنا محمد صلى الله عليه وسلم جدا سيد الخلق واشرفهم وان كنت بقول بحبهم فلازم اقول انا بحبهم ليه لانك يارسول علمتنا ازاى اننا مانشتمش حد مش مسلم ولازم نعترف بالاديان السماوية ولايمكن تلاقى مسلم بيشتم فى سيدنا عيسى او السيدة مريم تعالوا عليكم انتم وانا وانتى عارفين كويس جدا انكم مابتعرتفوش بسينا محمد وبتشتموا فيه وفى الاسلام فى كنائسكم ردى على وقولى مابيحصلش وانتى قولتى مابيحصل ارد عليكى انا بكليبات متصورة من داخل كنائس مصرية لالاسف انها فى مصر وبيشتموا فيها الرسول والاسلام بافظع الشتائم الاسلام الا قالنا لوجارك يهودى لازم توده لو كافر لازم توده الاسلام الا قالنا ان جارك لو كافر وماعندوش مال ولا اكل لازم تديله لكن لالاسف انتم معتمدين على امريكا فى كل حاجة ومفكرين انها شطارة ومجدعة ان امريكا بتحميكم لامش بتحميكم دى لالاسف مركباكم فوقنا لو سمحتى دراسة امريكية قالت عليكم اربعة ونصف مليون فى مصر وانتوا بتقولوا 15 مليون"
