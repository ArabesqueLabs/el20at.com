text = "وهو ودانا فى داهية غير المعونة<br />المعونة كانت من امريكا للحكومة المصرية بديلا لدخل القطاع العام الذى طالبت امريكا ببيعة والتخلص منة<br />وبعد انتهاء البيع ولم يعد للحكومة دخل غير الضرائب والمساعدات تيجى امريكا تقول لك هية<br />هتدينا قاعدة عسكرية والا نقطع<br />هتعيد تدويل قناة السويس<br />هتبيع الهرم<br />وفية عجز ضخم فى الموازنة والخزانة خاوية على عروشها<br />ببطء وبطريقة مدروسة وطويلة النفس سيعيدون احتلال البلد"
