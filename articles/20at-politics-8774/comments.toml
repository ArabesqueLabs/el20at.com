author = "عربية لبنانية جنوبية"
posted = "2008-04-14"
text = "بصراحة .. اتعجب حينما ارى كره بعض العرب لهذه الشخصية العظيمة ..<br />وحين يتم وصف هذا الرجل بأنه صفوي .. او فارسي او مجوسي !!!!<br />اين تعاليم الاسلام التي تقول بأن اكرمنا عند الله اتقانا ؟ وليس ( اعربنا) !!!!!!!!!<br />برأيي .. هذا الرجل عظيم .. ويستحق ان يكون قائدا لهذه الأمة النائمة .. ولا يهمنا اكان فارسيا ام شيعيا .. ام مسلما ؟؟؟<br />لماذا نرى الكثير من الشبان العرب معجبين بشخيصة غيفارا ؟؟ امن الضروري ان يكون من بلدنا او من مذهبنا حتى نجعله قدوة لنا ؟؟؟؟<br />وما اضيق هذه المعايير التي نسعى ورائها !!!!!!<br />لدينا عقل .. ودين .. والاثنان معاً برأيي يضعان لنا معايير لاتخاذ هذه القرارات والحكم على الاشخاص ..<br />وعندما نرى الادارة الامريكية والصهيونية .. كيف يستفزهما هذا الرجل .. فبرأيي .. هو جدير بأن ينال ثقتنا .. وحبنا واعجابنا . وتأييدنا ... نصره الله ووفقه ...<br />وفي جواب من يقول بأن الرجل يدعي القوة والشجاعة .. وهو فقط يطلق خطابات نارية .. بدون عمل !<br />فأقول .. يبقى افضل من الرؤوساء العرب .. الذين يرقصون مع بوش .. ويسلمونه الهدايا .. ويساهمون في قتل اطفال فلسطين والعراق ...<br />وشكرا ..."
