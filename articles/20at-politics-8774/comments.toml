[[comments]]
order = 3
subject = "إنسان عربي مسلم شريف حر"
author = "محمد نواف الحمدالله ..."
posted = "2008-04-16"
text = "الرئيس الإيراني الدكتور محمود أحمدي نجاد .. إنسان بسيط .. متواضع .. فقير لذاته ولله .. بكل صراحة وشفافية ونزاهة ..<br />أنا أحسد الجمهورية الإيرانية الإسلامية على هذا الرئيس .. فوالله عندما تنظر إليه لاتجده رئيساً أو ماشابه بل تجده إنساناً إيرانياً شريفاً حراً يغار على بلده وعلى البلاد العربيو والإسلامية .. هو جلٌ بحق .. هو رجلٌ عندما أدخل الرعب.. والخوف .. والفزع .. والحزن .. والقنوط .. واليأس .. والإحباط .. والإكتئاب .. في نفوس الإسرائيليين الصهاينة .. هذا الرجل قد زرع فيهم الفشل .. والإستسلام .. والهزيمة .. والخضوع .. والذل والهوان .. هذا الرجل الذي هز عرش أسطورة الجيش الذي لايقهر .. هذا الرجلالذي يتكلم عنه الجميع بلا استثناء ويصفونه بالرافضي الشيعي المخادع والمكار .. الخ .. ولكنه في حقيقة الأمر ليس إلاّ إنسان حمل على أكتافه هموم العالم أجمع .. فالكلام الذي يصدر عن هؤلاء الأشخاص يعتر كلام حساد ولايحبو الخير له .. أنا أحيي هذا الرجل العظيم .. هذا الرجل الذي لطالما أمعنت النظر إلى وجهه أحسست بمعنى الفقر المدقع الذي عاشه .. والهم الذي عاشه .. والحزن الذي رسم عل مقلتيه .. إنسان والله لو وجدته بالشارع ليسلم عليك هو أولاً قبل أن تسلم عليه .. إنسان من شدة تواضعه تخجل منه وتستحي أت ترفع رأسك .. والله يا نجاد بأنك رجل بكل ماتحمل الكلمة من معانٍ .. الطامة الكبرى تكمن بمن يشوه صورته ومكانته .. هو قبل كل شيء إنسان .. والإنسان ليس معصوماً على الخطاً .. وكل إنسان يخطأ .. وخير الخطآؤون التوابون .. ولو أردتم أن تحصوا عيوب وسلبيات نجاد لما انتهت .. وكذلك فإن لكل إنسان عيون وسلبيات .. وأنا كأقرب مثال توجد بي عيوب وسلبيات .. وكذلك كل إنسان به عيوب وسلبيات .. فلسي هنالك مخلوق على وجه الكرة الأرضة كامل ويتمتع بسمة الكمال غير الخالق _ عزّوجل _ .. كل العالم يعرف ويشهد من هو أحمدي نجاد .. فأحمدي نجاد قبل تسلمه لمنصب الرئاسة في الجمهورية الإسلامية .. قام بعمل تصفية شاملة عامة لجميع الوزراء الإيرانيون من حيث مايملكون من أموال وعقارات واستثمارات وسيارات .. وغيرها الكثير .. وقال لهم بأن لكل وزير يحق له امتلاك سيارة شخصية ( عدد واحد فقط لاغير *) وباقي السيارات التابعة للوزراة هي للإستعمال الوزاري فقط لاغير ولايجوز لهم استعمالها خارج الدوام الرسمي لهم بالوزارة .. وهناك أمورٌ كثيرة قد نظمها وضبطها مع جميع الوزراء وممن له علاقة لكي يعرف كل فرد ماله من حقوق وماعليه من واجبات وإلتزامات يجب الوفاء بها والتقيد بها وعم الخروج عنها بأي حال من الأحوال .. فهو بذلك يطبق شرع الله في الأرض دون زيادة أو نقصان .. فهو بحق نعم الإنسان المسلم<br />الملم لأموردينه ودنياه .. ومن أهم مايميز نجاد بأنك قد تجده في أي شارع من شوراع العاصمة ( طهران ) يتمشى وليس وراءه أو أمامه حرسٌ يحرسه أو خدمٌ يخدمونه .. فهذا إن دل على شيء فإنه يدل على بساطته العفوية .. وتواضعه الجميل .. وغالباً مايهتم نجاد بمظهره الخارجي ( هندامه * ) فهي لاتشكل له أهميه بالغة يجب الإهتمام بها وعدم تكرها .. وكم هو جميل بأن يكون الإنساتن على طبيعته وعلى بساطته .. والله ونعم الرئيس العربي المسلم الشريف الحر ...<br />شكراً .. وتحياتي للجميع ،،،"
