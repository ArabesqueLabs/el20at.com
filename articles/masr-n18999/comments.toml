text = "ايها الدعي الآفاق المدعو طارق الكذاب لأنك مجهول ودعي تبحث عن الشهرة والظهور فلم تجد إلا التلفيق والكذب للوصول إلى هدفك ولكن الحقيقة أنك لن تصل إلا غلى مزبلة الصحافة إذا تواصل كذبك ونفاقك يادعى"
