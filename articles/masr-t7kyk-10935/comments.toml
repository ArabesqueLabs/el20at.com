[[comments]]
order = 1
subject = "الى المعلق السابق ـ انت انسان ممتاز"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-01-13"
text = "تعليقك ممتاز يا اخي<br />ويا خساره<br />نحن العرب امة الحرب<br />نحن الذين علمنا الدنيا كلها كيف تكون الحرب<br />النصارى شعارهم من ضربك على خدك الايمن ادر له خدك الايسر<br />ونحن الذين علمناهم كيف تكون الحرب<br />الف سنه والمسلمين في حرب وحكموا نصف العالم كله<br />يا خسارة اليهود والنصارى سرقوا مننا الحرب وسرقوا مننا القران العظيم<br />وتركوا لنا من ضربك على خدك الايمن فادر له خدك الايسر<br />استيقظي يا امة العرب<br />استيقظوا يا ولد عدنان وقحطان<br />استيقظوا يا احداف اسماعيل<br />استيقظوا يا اتباع النبي محمد صلى الله عليه وسلم<br />نحن امة الحرب ولابد ان تعود السيوف مرة اخرى<br />لنا عودة ان شاء الله لنعلم العالم كيف تكون الحرب<br />وليدخلوا المسجد كما دخلوه اول مرة وليتبروا ما علو تدبيره<br />واي"
archived = "2010-03-14"
capture_url = ""
