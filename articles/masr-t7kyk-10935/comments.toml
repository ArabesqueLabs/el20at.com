subject = "اصابات كثيرة لا احدا لم يعلمكم معنى الدفاع السلبى"
posted = "2009-01-12"
text = "ضحايا كثيرون نتيجة عدم التوعية للناس بما يجب عملة اثناء الغارات<br />احفروا<br />احفروا حفر برميلية بجانب بيوتكم وانزلوا فيها وقت الغارات<br />احفر لاطفالكم تحت الارض خنادق تحميهم<br />نابليون قال لجنودة<br />من لا يحفر - يموت<br />احفروا واحفروا"
