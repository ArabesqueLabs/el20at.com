subject = "مدينة السلام -مصر"
author = "حكيم حسين الراعى"
text = "الحزب الوطنى يتحدى القانون<br />دخول عناصر جديدة للحزب الوطنى لقوائم المرشحين بمحليات السلام بعد انتهاء المدة المحددة<br />نما الى علمنا كمرشحين مستقلين لعضوية مجلس محلى محافظة القاهرة عن حى السلام انه هناك نيه مؤكده أن رجال الحزب الوطنى سوف يقومون بادراج ثلاثة اسماء كمرشحين للحزب الوطنى بدائرة السلام ( محافظة ) حتى لا حسم النتيجة بالتذكية – يذكر أن الكشوف التى تم اعتمادها من اللجنه المشرفة على الانتخابات والتى تم اعلانها فى ديوان عام محافظة القاهرة ورئاسة حى السلام والتى تم الحصول على نسخة ضوئية منها ... أوضحت أن عدد المرشحين لانتخابات حى السلام (12) اثنى عشر عضوا فقط جميعهم من الحزب الوطنى ولم يتقدم أحد من المستقلين لما يستوجب اعلان النتيجة بالتذكية للحزب الوطنى .. وبالنسبة لمرشحى لمرشحى المحافظة تم ترشيح عدد (6) سته فقط من الحزب الوطنى واربعة مستقلين منهم اتنين من الاخوان .. ويعد أيضا فوز بالتذكية .<br />ومن ناحية اخرى وبعد نشر خبر فوز الاخوان بمقعدين ( بحى السلام – محافظة ) بجريدة المصرى اليوم بعددها الصادر يوم الثلاثاء الموافق 18 مارس 2008 بالصفحة الاولى .. آثار حفيظة رجال الحزب الوطنى .. كيف وأين تم ذلك ، فكان لابد من تجاوز جميع القوانين واللوائح الموضوعة للانتخابات فقاموا بدفع ثلاثة اسماء ( للوطنى ) لقائمة المحافظة بحجة ( انهم كانوا يستوفون أوراق الترشيح ).... وذلك تم بعد غلق باب التقديم باسبوع !!!<br />مهدرا بذلك حق المرشحين المستقلين .. ويضاف الى سجل الحزب الوطنى تجاوزاته التى تخططت جميع الخطوط .<br />ومن ثم اذا كان الامر كذلك بأن الحزب الوطنى لا يحترم أى دستور أو قانون فما بالنا بالصناديق .<br />ومن ثم اذا تم الأمر كذلك سوف يعلن بعض المستقلين احتجاجا على ما يفعله رجال الحزب الوطنى من تجاوزات بلغت مداها وأيضا عدم الثقة فى انتخابات كانوا يدعون انها ستكون نزيهه وتتم بارادة الشعب وسوف نترك الساحة خاليه أمام مرشحى الحزب الوطنى فقط دون غيره لتكون بالتذكية وذلك حرصا منا على مصلحة اهالى الدائرة لعدم العناء أمام صناديق الأقتراع .. حيث انها تكون بالتذكية للحزب الوطنى ؟!!!<br />( مرفق طيه صور ضوئية من قوائم المرشحين حى وماحفظة عن حى السلام التى تم تعليقها بحى السلام ومحافظة القاهرة بعد انتهاء فترة التقديم لعرضها للمواطنين )<br />مهندس / حكيم حسين الراعى<br />المرشح لعضوية المجلس الشعبى المحلى لمكحافظة القاهرة ( حى السلام ) فئات - مستقل<br />ت / 22995935-22949131<br />فاكس/22995935<br />موبيل: 0101151313"
