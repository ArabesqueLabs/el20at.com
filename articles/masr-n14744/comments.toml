subject = "يا حبيبى دى بداية الفخ المنصوب"
author = "oi"
text = "دى حكاية مكشوفة<br />علشان البيت الابيض انتقد منع المرشحين من تقديم اوراقهم يبقى نعمل لعبة نقول للاجانب شوفوا اهو واحدة من اللجان نجحت بالتزكية<br />وبعد كدة عينك ماتشوف اللى النور - كل اللجان على مستوى الدولة الحزب الوطنى هينجح فيها بالتزكية<br />وبكرة تشوفوا"
