[[comments]]
order = 0
subject = "زنقة كلمة مغربية ومعناها حارة"
author = "ريا وسكينة"
posted = "2008-03-15"
text = "حارة الستات او زنقة الستات كانت سوق تعج بحريم وستات بحرى والناس الحلوة جيران سيدى المرسى ابوالعباس<br />وكنت تشوف فيها الجمال الاسكندرانى الاصيل بتاع بنات بحرى وكلمة ايوة ومن بحرى وبنحبوة<br />وكانت سوق مزدهرة وشافت ايام عز ايام سوق ليبيا والبضائع المستوردة اللى كانت بتيجى من ليبيا ايام الناصرية<br />انما ايام الفقر الوطنى<br />زى ما انت شايف الحارة خالية من المارة فى الصورة<br />كيلو الزيت ب 12 جنية<br />وشقة السندوتش فول ب 60 قرش<br />اللة يسد نفس اهلة زى ما سد نفس المصريين عن الحياة"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084753/http://masr.20at.com:80/newArticle.php?sid=14675"

