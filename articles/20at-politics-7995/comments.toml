subject = "ضع عنوان التعليق جعله مجرماً!"
author = "اكتب اسمك هنا أسامة صابر مصطفى"
posted = "2008-01-11"
text = "(مصطفى بكري) النائب في مجلس الشعب المصري يحتج على زيارة الرئيس الأمركي (جورج بوش) لمصر ويطالب الحكومة المصرية برفض زيارة \"مجرم حرب\" كهذا على حد قوله!<br />والنائب (المعارض) والذي تحيط بعلاقته برموز النظام علامات استفهام كثيرة، ابتدأت حين استقل الطائرة الرئاسية مع كوكبة الكتاب والصحفيين الموالين للنظام المصري.<br />وإن كان جاداً فعلاً في دعوته ومطالبته، فمن باب أولى أن يطالب بمنع زيارة أي مسؤول مصري لواشنطن وأولهم الرئيس المصري (حسني مبارك) نفسه، مروراً بابنه (جمال).<br />ومستر (جمال مبارك) فعلها سابقاً وحج إلى البيت الأبيض (في زيارة سرية افتضحت فيما بعد)، والتقى هناك مستشار الأمن القومي الأمريكي ووزيرة الخارجية الأمريكية وعرج بهم مجرم الحرب (على حد قول بكري) الرئيس الأمريكي (جورج بوش).<br />وساعتها لم نسمع النائب النزيه ينتقد زيارة (جمال) المشبوهة لأمريكا!<br />الخلاصة..<br />النظام المصري يريد في محاولة عبيطة ومضحكة أن يقلد الأحداث عندما يذهب الرئيس المصري لأمريكا وتتعالى أصوات نواب في الكونجرس الأمريكي تهاجم مبارك وسياسته. فيعطي الضوء الأخضر لبعض النواب المحسوبين على المعارضة ليقوموا بأدوارهم التمثيلية التي لم تحظ بكاتب سيناريو جيد.<br />أخيراً..<br />أتمنى ألا يتمادى النظام المصري في تمثيليته هذه، ويندمج النائب (الشرس) مصطفى بكري ويطالب بقطع المعونة المصرية عن أمريكا!"
