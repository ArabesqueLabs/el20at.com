text = "سامر المصري أنا فنان غير متعصب لبلدي<br />إيمان كمال –<br />أيام الغضب، تمر حنة ,تلك الأيام و أخيرا المسلسل الذي حقق النجاح على مستوى الوطن العربي باب الحارة و الملحمة التاريخية خالد بن الوليد أعمال كانت السبب في نجاح العقيد أبو شهاب أو الفنان السوري سامر المصري و الذي كان قد صرح من خلال برنامج العراب عن تخوفه من تمصر الفنانين السوريين عن ذلك و عن الجزء الثالث من باب الحارة كان هذا الحوار لعشرينات معه:<br />في تصريح من خلال برنامج العراب عبرت عن خوفك من الممثلين السوريين من التمصر ماذا كان قصدك؟<br />الخوف من أن يفقد الممثلون السوريين إهتمامهم بتقديم الأعمال في بلدهم سوريا و ليس الخوف من التمثيل في مصر بالعكس فمصر تضيف لأى فنان يعمل بها وتزيد من شهرته ولكني حريص على أن لا ينشغل أبناء الدراما السورية عنها.<br />هل معنى ذلك أنه من الممكن أن تقبل المشاركة في عمل درامي في مصر؟<br />إذا كان السيناريو و الحوار جيدان فلا مشكلة عندي أنا لست من النوع الذي يتعصب لشئ ..فكلنا عرب في النهاية والنجاح يعود للكل ومصر بوابة للفنانين كما يقال.<br />سمعنا أنك تقرأ الآن العديد من الأعمال الدرامية فما السيناريو الذي إستقريت عليه؟<br />أتفرغ لدوري في باب الحارة الجزء الثالث بالإضافة أنني أقرأ العديد من السيناريوهات الأخرى الآن لأختار منها ما أراه مناسبا فالنجاح الذي حققته في شخصية العقيد أبو شهاب وخالد إبن الوليد يجعلني أدقق كثيرا في إختياري للأدوار.<br />إذا ما الجديد الذي تقدمه في شخصية أبو شهاب عقيد باب الحارة بالجزء الثالث؟<br />العقيد سيكمل رحلته مع المناضلين و الفدائيين سواء ضد الفرنسيين بالشام أو الإنجليز في فلسطين بالإضافة لبعض الأحداث التي ستكون مفاجاءة لجمهوري و لكني لن أستطيع حرقها الآن.<br />هل سيتزوج من فريال كما طرحتم السؤال في نهاية المسلسل؟<br />يضحك ويقول: لنجعل الجمهور ينتظر المفاجأة من خلال تتابع الأحداث.<br />تم إستبعاد الممثل القدير عباس النوري من الجزء الثالث هل ترى أن ذلك سيؤثر على نجاح المسلسل؟<br />هذه خسارة كبيرة للمسلسل بكل شخصياته فأبو عصام كان من عوامل نجاح المسلسل لكن الأسباب خاصة بالأستاذ عباس النوري و أنا أحترم رأيه و خصوصياته.<br />هل تتوقع النجاح لباب الحارة في الجزء الثالث أم سيصاب الجمهور بالملل من التكرار؟<br />أتوقع أن يستمر النجاح خاصة بحب الناس لنا و لشخصيات المسلسل وأن هناك الجديد الذي نقدمه في الجزء الثالث.<br />ألم تخشى حدوث بلبلة عند الناس بقيامك بدورين في نفس الوقت \"خالد بن الوليد \" و العقيد أبو شهاب؟<br />على الإطلاق فلم أخشى شيئا لأن الدورين مختلفين و منفصلين تماما فخالد شخصية تاريخية إسلامية أما العقيد فهو جزء من تراثنا الشامي الجميل لذلك أحبها الناس.<br />معروف أن ظهور الصحابة و المبشرين بالجنة أمر غير مقبول دينيا و هو ما حدث في مسلسل \"خالد بن الوليد\" ألم تتخوف من رد فعل الجمهور خاصة أنه تم عرضه في رمضان ؟<br />المسلسل لم يسئ للإسلام و لكنه قدم مجموعة من الحقائق و الجمهور العربي ذواق ويستطيع أن يفرق بين الشئ السيئ الردئ والعمل الهادف.<br />برغم أن الدراما السورية أصبحت تنافس على القمة لكن السينما السورية لم تحقق نفس النجاح لماذا؟<br />السينما السورية مستمرة و تقدم نحو الأفضل ولكنها تحتاج الوقت لتبرهن على ذلك.<br />ما النقد الذي قيل عنك و أزعجك ؟<br />النقد البناء يسعدني و أتقبله دائما و لكن إنزعج من الإشاعات الكاذبة كالصور التي نشرت عني عبر الإنترنت و أزعجتني كثيرا حين أظهروني أشرب الخمر مع الفتيات في أماكن غير لائقة و هو شئ أثبت زيفه و لكن دائما هناك أعداء للنجاح.<br />أخيرا هل كنت السبب وراء إعتزال زوجتك الفنانة السورية نيفين عزام التمثيل؟<br />على الإطلاق فهى التي قررت ذلك من أجل التفرغ لتربية أبناءها فأنا تركت لها حرية الإختيار."
