[[comments]]
order = 1
subject = "كلاكيت عاشر مرة (الفن والدين والصحافة)"
author = "مش ححبك"
posted = "2008-09-16"
text = "اخطر ثلاث قطاعات مؤثرة هي الدين والفن والصحافة<br />المفروض نظرا لخظورةو هذه القطاعات الثلاث تكون هي الاولى بالتأهل الاكاديمي وهي اولى الا يعمل فيها الا المتخصصون<br />يعني الفن ليه معهد السينما والفنون المسرحية والدين ليه كلياته والصحافة ليها كلياتها الخاصة<br />تجد هذه الثلاث قطاعات مرتع لكل من هب ودب<br />اي واحد فاشل يشتغل ممثل اي واحد فاشل يشتغل واعظ ودعاية اي واحد فاشل تلاقيه بيشتغل صحفي<br />ولذلك لابد من خريجي هذه الكليات ان يطالبوا بعدم دخول اي شخص غير مؤهل اليها<br />تماما كالمحامين والاطباء والمحاسبين وغيرها لا يمكن ان يعمل في هذه المهن الا خريجي كلياتها<br />ولذلك ادعو خريجي كليات الفن ان يقيموا جمعية تطالب باقتصار العمل الا على خريجي هذه الكليات وتجريم من يخالف ذلك<br />كما يجرم اي حد يعمل في المحاماه بدون ترخيص لابد ان يجرم اي واحد يمثل بدون ان يكون لديه ترخيص ويكون مؤهل وكذك الصحافة وكذلك الدين<br />لان كما ان المحامي دارس مواد في الكية المفروض انها تؤهله الى العمل بالقضاء وبغير هذه المواد لا يصلح العمل القضائي<br />كذلك معهد السينما المفروض ان الطالب دارس مواد نظري وعملي وطلع روح امه علشان خاطر يشتغل ممثل<br />وكذلك كليات الصحافة والاعلام المفروض انهم دارسين مواد متخصصة نظري وعملي تؤهلهم الى هذا العمل<br />ايه يعني محمود ياسين ونور الشريف وبوسي ومش عارف ايه<br />عملوا ايه في رسالة الفن (حولوا رسالة الفن واصلاح المجتمع عن طريق الفن الى فسق ودعارة والناس بتدخل السينمات علشان الاثارة الجنسية اكثر من مشاهدة قصة الفيلم<br />وكذلك عامل امام ايه اللي احنا استفدناه من مسرحياته مدرسة المشاغلين وخلافه كلام فارغ وضحك فاضي ضيع الامة<br />يا جماعة الفن والدين والصحافة ثلاثة رسالات سامية لابد من الذي يعمل فيها ان يكود دارس دراسية اكاديمية<br />وشكرا"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918104546/http://masr.20at.com:80/newArticle.php?sid=17601"

