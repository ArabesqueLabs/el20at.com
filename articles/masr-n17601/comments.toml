[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-09-17"
text = "مين الى بيتكلم دة محمود ياسين بتاع انف وثلاثة عيون وافلام العرى والا حضان والدعارة والله حرام عليكم والله حلو خالص ان واحد زى دة بيتكلم فى الدين وبيقول احاديث عن رسول الله ص اى فن هذا الذى يتكلم عن فن السبعنيات والثمنانات الى كلة عرى ودعارة ومهما اتكلم مثل هولاء الجهال فان الدين لا ينفصل عن السياسة لان الدين الا سلامى دين ودنيا فلماذ اذان التشرع فان التشريع هو سياسة الا سلام ومن لا يرضى غير ذلك يخبط راسة فى الحيطك"
archived = "2008-09-18"
capture_url = "https://web.archive.org/web/20080918104546/http://masr.20at.com:80/newArticle.php?sid=17601"
