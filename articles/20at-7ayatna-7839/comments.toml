[[comments]]
order = 4
subject = "الموضوع صعب قوي"
author = "كريم عزمي"
posted = "2007-12-19"
text = "اولا كل سنة و انتوا طيبين<br />صحيح الموضوع بتاعكم ممكن يكون دعابة هزار و كده علشان العيد<br />بس صعب قوي انك تتخيل انك بتدبح حد تاني<br />مهما كان الهدف اضحية او انتقام او هزار<br />صراحة مهما كان كرهي لحد عمري ما اقدر اتخيل انى بدبحه<br />بس طبعا في الجانب السياسي الواحد بيتمنى لبعض الشخصيات ان ربنا ياخدهم<br />بس حتى الشخصيات دي في حد ذاتها مش نهاية المشكلة<br />ممكن لو ينفع نضحي بحاجة مفهاش لحمه<br />انا هطلب اننا ندبح الفقر و الجهل و التخلف<br />ساعتها هتلاقوا الاضحية اللى بجد و حقيق<br />مش بشر<br />كل عام و انت بخير<br />كريم عزمي"
archived = "2010-03-14"
capture_url = ""
