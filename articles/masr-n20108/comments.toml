order = 0
subject = "دراسة عبيطة - ما هو بتوع الباطنية انتقلوا  الى شبر"
author = "اكتب اسمك هنا"
posted = "2009-02-25"
text = "هى الدراسة اعتمدت على شوية احصائيات للحوادث والجرائم فى اقسام الشرطة فى الاحياء المختلفة<br />طبعا الزمان اتغير<br />وايام ما كانت الباطنية فى عز شبابها كانت البلد فيها فلوس وفيها ناس بتوع مزاج<br />انما دلوقتى الرجالة وجدوا بديل للحشيش فعال جدا اللى هو حبوب الفياجرا الساحرة وبتعطى نتائج مدهشة وبعيد عن طائلة القانون<br />وشوية المراهقين وشباب الجامعة نقلوا على البانجو<br />فخلاص راحت على الباطنية"
archived = "2009-02-26"
capture_url = "https://web.archive.org/web/20090226203405/http://masr.20at.com:80/newArticle.php?sid=20108"
