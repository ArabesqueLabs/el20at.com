order = 0
subject = "قانون المرور الجديد حبر على ورق و لا يطبق باى صورة"
author = "ممدوح زكى زخارى"
posted = "2008-08-04"
text = "الدولة محتاجة فرض القانون بالقوة و ليست بسن القوانينو المناقشات التافهة بمجاس الشعب او الندوات او المداخلات التليفزيونية<br />كفى نفاق من اجل مصر الدولة و النظام و القانون يجب مصادرة سيارة كل مواطن تسنح لة نفسة ايا كان بانتهاك حرمة القانون؟<br />القانون يجب ان يحترم و يصان كيفما نحترم الدستور و العلم و النشيد الوطنى و تراب الوطن و النظام الذى يحمى الوطن و الشعب<br />لا رحمة لكل من لا يحترم القانون ؟<br />للاسف هذة الحفنة المريضة نفسيا بهوس انتهاك القانون يجب قطع رقابها بتطبيق القانون بلا رحمة معهم<br />المنطقة العربية للاسف لا تجدى معها الديمقراطية و الحرية وتطبيق القانون معها<br />لتكن المصادرة بدلا من دفع الغرامات المالية و من ثم سوف تجدوا النظام و احترام القانون كيف يكون ليسا احتراما للقانون بل خوفا من مصادرة سياراتهم؟<br />لتكن تجربة تستحق التطبيق و كلى ثقة من نجاحها"
