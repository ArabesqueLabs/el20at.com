text = "ليه ياناس كدة حرام عليكم والناس الغلابة تعمل ايه ولا علشان بقينا بمنصب عالي ندوس علي الناس مش كفاية غلاء الاسعار يعني الناس تكفي ايه ولا ايه@ونضافة ايه اللي بتقولوا عليها دي فين النضافة دي مشيفينش يعني نضافة في البلد وياريت علي رسوم النضافة اللي ضيفينها علي الفاتورة دي المصيبة ان فاتورة الكهربا نفسها كل مالها بتزيد وبتيجي عالية احيانا بتوصل ل200 او300 جنيه ليه دا كله هو في البيوت في مصانع شغالة ولما الناس تسرق تجيبوا عليها اللوم ماانتوا السبب @ارحموا الناس حرام عليكم واتقوا الله من يتقي الله يجعل له مخرجا@انا بشكر طاهر حزين علي موقفه الرائع"
