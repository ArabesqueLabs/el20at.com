[[comments]]
order = 0
subject = "العالم العربي"
author = "الثعلب العربي"
posted = "2008-03-04"
text = "سياسة صهيونية حقيرة<br />أن ننشغل بأمور عن أمور أخرى<br />أن ندير ظهورنا الى أحداث ونترك وراء ظهرنا أحداثاً أخرى<br />كاريكاتير يسيء للرسول صلى الله عليه وسلم.. لتغطية ما يحدث في غزة من مجازر<br />الكارثة اننا لم نقم برد فعل لأي من الأمرين<br />بالنسبة للرسوم نادينا بمقاطعة الدانمارك<br />وماذا بشأن غزة؟<br />الا يغضب رسول الله ما يحدث من سفك لدماء المسلمين؟<br />لا شيء<br />دموع نذرفها لمشهد قتل او هدم او اعتقال في فلسطين<br />هذا هو رد الفعل<br />حتى مقاطعة الدانمارك البعض ينظر اليها على انها غير مجدية<br />فلنشتري منتجات الدانمارك اذا<br />لنعطيهم القرش الذي يقتلوننا به في غزة<br />بل لنعطيهم الخنجر ليقتلوننا به<br />ان فكرة المقاطهة للمنتجات الدانماركية هي فكرة ايجابية<br />ولكن ماذا عن المنتجات اليهودية الأكثر انتشاراً؟<br />لماذا لم ننادي لمقاطعتها؟<br />اهي اقل ضررا من الدانمارك؟<br />ماذا فعلنا تضامنا مع غزة؟<br />كيف تضامننا؟<br />لماذا لم نقاطعهم ؟<br />هل لاننا اعتدنا رؤية القتل امام اعيننا في فلسطين فلم يعد الامر جديدا بالنسبة لنا؟<br />أين ضمائرنا يا عرب؟<br />أين قلوبنا؟<br />هل غابت؟<br />أم نامت؟<br />لا والله لقد ماتت..<br />ماتت ضمائرنا ولكننا لم نصل عليها<br />ماتت الانسان بداخلنا<br />هانت علينا دماء اخواننا في فلسطين<br />فلم لا نهن على غيرنا؟<br />ان الاساءة للرسول في الصحف الدانماركية والحصار في غزة هما وجهان لعملة واحدة<br />والصهاينة يحاولون منع هذه العملة<br />ويحاولون ان يلهونا ببعض الورق المزور<br />فهل نقبل التزوير؟<br />هل نقبل أننشغل أنفسنا بخلافات فردية امام ابادات جماعية؟<br />أين الضمير العربي؟"
archived = "2010-03-14"
