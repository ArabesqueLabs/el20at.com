subject = "حكام اندال وشعوب ميته"
author = "سارة"
posted = "2008-03-08"
text = "حكام اندال وشعوب ميتة<br />ببساطة جدا هى ده المشكلة<br />الشعوب نايمة ومستسلمة<br />ولو فكرت تخرج<br />مش بتلاقى غير عصيان الامن المركزى<br />هو ده السبب للى احنا فيه<br />وطببعا غزة مش مهمة خصوصا ان مناصرتها هتجيب الضرب وامن الدولة وخلافه<br />اما الحضرى فاهه حاجة بنضيع فيها الوقت"
