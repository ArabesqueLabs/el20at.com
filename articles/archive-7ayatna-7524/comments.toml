[[comments]]
order = 274
subject = "فلسطين أولا أولا أولا"
author = "عاشق فلسطين"
text = "فلسطين أولا أولا أولا أولا وغصب عن كل الأردنييين<br />وخرررررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن وكس أخت الأردن أولا<br />وخرررررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الملك عبد الله ثانيا<br />وخرررررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الشعب الأردني الخرة المخري بخرة ثالثا<br />وتضل فلسطين رافعة رايتها غصب عن كل الأردنيين وعراسي كل فلسطيني وفلسطينية سواء بالأردن أو بأي مكان بالعالم<br />وما مرتزقة وفسقة ومنافقين وعملاء غيركوا يا خونة الدين يا أولاد الكلب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 275
subject = "شباب .. كس أخت هيك شعب فلسطيني أخو منيوكه !"
author = "محمد نواف الحمدالله ..."
text = "والله إنكو زهقتووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووني ياحيوانات يابقر<br />كس امكو برعاية الأردن أولاً .. وفلسطين تحت طيزي .. وداعس ع رقابكو يافلسطيزية .. يانور .. ياخنازير الداعرة ..<br />كس أمكو كل مالف عجل سيارة ..<br />كس خواتكو كل ماواحد حكى ..<br />كس شرفكو كل ماضحك واحد ..<br />الله يخزيكو ياشرامييييييييييييييييييييييييييط<br />ولك يافلسطيزي ياخفيف ..<br />وما إلك عنا بالبلد رغيف ..<br />روح .. وروّح ع فلسطيز .. وعيش ياقديش !!"
