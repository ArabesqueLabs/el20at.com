[[comments]]
order = 125
subject = "الى كل الفلسطينين والادرنيين"
author = "كبرياء انثى"
text = "لا اله الا الله على هالكلام ياعالم ولكم بكفي غيرو هالموضوع منشان الله شو هالكلام يا زفت يا نواف بترضى يجي واحد اردني يحكي هالكلام البيئة لاختك يا ولية يا مرة.. اتقى الله ولك خلص حرااااااام عليكم..<br />لعنة الله على كل واحد فيكم حكى كلام متل وجهو يا منحطين ان كنتو فلسطينية ولا اردنية اصلا لا الاردن ولا فلسطين بتتشرف تحوي اشكال متل اشكالكو يا انذااال ..ولكم اصلا ماضل فيكم نخوة ولا شرف ..<br />وكلنا العرب بنرميكم يالزبايل يا زبايل انتو ياللي ما خليتو فيكم شوية احترام.. كلكم انذل من بعض اردني وفلسطيني ..<br />بكفي حكي عن هالموضوع ..<br />لعنة الله عليكم يا نور .. اصلا هالكلام هاد ئليل فيكم يا فلسطينية واردنية وانا كنت بفتخر اكون فلسطينية اردنية هلاء راسي رح يسير بالارض من كلامكم يا حقراااااااااء,.,.خافو الله (الله لا يعطيكم عافية..)"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

