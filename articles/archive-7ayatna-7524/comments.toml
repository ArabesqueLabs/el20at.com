[[comments]]
order = 252
subject = "شو بدك ؟؟؟ ومن الآخر يعني !!!"
author = "محمد نواف الحمدالله ..."
text = "شو بدك ؟؟؟<br />شو اللي مظايقك بالموضوع ؟؟؟<br />إنتا شو حشرك ؟؟ وشو دخلك بالنص ؟؟<br />حدا عينك عليّ وصي .. ولا ولي أمر .. ولا أخ كبير .. ولا .. ولا .. ولا ؟؟<br />أنا مش فاهم .. يا أخي إنتا جاي تهديني إلي وناس كل اللي كانوا يسبوا وأجيت علي ّ .. يا أخي روح شوف الفلسطيزية اللي سبوا علينا حنا الأردنيين .. روووووووووووووووووح .. ولك فتح مخك الأجرب يا أجرب .. !!!\\<br />ولك اقراااااااااا التعليقات اللي قبلي وحده وحده .. وقارن مين بلش السب .. ؟؟؟<br />ع العموم ،،،<br />أنا مش موقف إلاّ لما أفششششششششش غليلي فيكو ياعرصات !!!<br />أنا والله نفسي لو إنه جلالة الملك عبد الله الثاني ابن الحسين المعظم حفظه الله لو إنه يصدر قرار بإلقاء قنبلة موقوتة وذرية على<br />فلسطين كلها لأنه شعب جبار وحقير وقذر وملعون , الملك حسين بن طلال الله يرحمه ما غلط لما ضرب الضفة في مذبحة أيلول<br />الأبيض مش الأسود زي ما بتسموها لأنه عارف شر هدول القوم البوم الفلسطينيين الملاعين أولاد الكلب والعرص , على كل إن شاء الله يصدر القرار هدا ويا ريت عن قريب , لأنه الجيش الأردني من أقوى جيوش العالم , وبقدرته دبح الفلسطينيين خلال ربع ساعة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 253
subject = "رد على محمد نواف الحمد الله"
author = "بنت السعودية"
text = "أولا يا حقير أنا أشرف منك يا كلب ومن كل بدوي زيك , أنا سعودية غصبا عنك وعن اللي خلفك , ولي الشرف بكوني فيا عرق فلسطيني , ما قحبة وشرموط إلا أنت يا حيوان , خليتني أفقد أدبي , ما رح اكثررر كلام معك لأنك واحد ثور حيوان بجمي ما تفهم أصلك حيوان , معفن , بعدين أنا سعودية حضرية مو بدوية متخلفة مثلكم , الحمد الله , لا تحسب حالك عشان واحد سعودي بدوي زيكم أهبل حيوان منحط مدحكم حسبتم السعوديين كلهم سوا, لا طبعا , اصلا لولا الله ثم إحنا اللي منعشين بلدكم يا هبل يا شحاتين ولا انتوا اصلا تترجونا ولو وصل الامر تبوسوا رجولنا , ولولا الله كمان ثم الفلسطينيين موجودين بالأردن ولا الحين كان هي أفقر دولة وأخزى دولة علىوجه الارض ,,, عيب عليكم تنكروا الجميل احمدوا ربكم انكم من احسن دول العالم , حمير والله انكم حمير , مستغربة انا من العنصرية والفلتان التربوي الغريب عندكم , قال اهل النخوة , والله على قولة بنت نابلس والطقعة والضراطة , بدو أنذال طول عمركم , وشكرا لكل فلسطيني وفلسطينية هنا (بالفلسطيني هون , هههههههه) , ويا حيوان السعوديات أو الفلسطينيات أشرف من ألف أردني مثلك ومثل الأردنيين حقونكم , ما أبغى كثر كلام فاضي , لأنو ما ينفع الجدال معكم , وشكلي أصلا ما رح أخش هنا بعد كدا أبدا , لاني مليت مرة من الصفحة هذه اللي وسخوها الأردنيين بزقهم المزقوق هههههه , يلا سلام , ....................................(كلنا فلسطين) .................... بنـــــــــــــــــــ السعودية ـــــــــــــــــــــت"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

