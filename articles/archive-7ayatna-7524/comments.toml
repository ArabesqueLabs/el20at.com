subject = "عشائر السلط"
author = "عربي مسلم"
text = "عشائر السلط<br />اولا : العشائر الاسلامية:<br />أ – الذين يعودون باصلهم الى فلسطين : نزحت العشائر الاتية من منازلها في الخليل وقضائها واستقرت في السلط بعضها نزلها من نحو 200 سنة والبعض الاخر من نحو 300 سنةوهذه العشائر هي :<br />الحياصات والدبابسة ويعودون باصلهم الى قرية \" يطة\" والنسور والحمامرة نسبة الى ال الحموري العائلة الوجيهة في الخليل[3] ولهم ابناء عم في بعض قرى الاردن والفواعير ولقطيشات ويذكرون انهم حسينيون.<br />ونزح من فلسطين الى السلط ايضا عشائر العمايرة ولهم اقارب في كفر عوان من اعمال اربد قدموا الى شرق الاردن من نواحي القدس و \" الخليفات\" واصلهم من احدى العشائر البدوية الفلسطينية وينضم اليهم العناسوة واصلهم من عين سيناء و \" الرمامنة\" نسبة الى قرية \" رمون\" من اعمال رام الله وقد استقروا في \" ام جوزة \" شمالي السلط.<br />ب : العشائر التي تعود باصلها الى الجزيرة العرببية : الجزازية (جزازي) ويذكرون انهم من قبيلة ولد علي من الرولة – ولهم ابناء عم في كفر الديك – نزلوا في بادىء امرهم \" الجزازة\" يجوار جرش واليها نسبتهم و \" الخريسات\" قدم جدهم من الخحجاز نزل ومن معه وادي خريس بعمان ومنه اسمهم استقر بعضهم في السلط وغيرهم في اربد \" والحدابدة\" وهم اشراف من اعقاب \"الحسين بن علي \" رضي الله عنهما والعربيات ويعودون بنسبهم الى \" شمر\" من قبائل نجد وتنتشر شمسر اليوم فضلا عن نجد في العراق وفي بلاد الشام ومصر وشمر هذه هي \" طيء\" العصور القديمة وتكثر في فلسطين القبائل والعائلات التي تعود بنسبها الى طيء كثرة ملحوظة كما تكثر فيها الاماكن التي ما زالت تحمل اسماء مننزلها من القبائل الطائية الى يومنا هذا .<br />ومن عشائر السلط : الزعبية(الزعبي) وقد قدموا من حوران وجبل عجلون وذكرنا نبذة عنهم في مكان اخر من هذا الكتاب والعطيات واصلهم من دير عطية بضواحي دمشق والعواملة نزلوا السلط من القسطل والحيارات نسبة الى جدهم \" حيار \" الذي كان اميرا على العرب في عام 752 هـ نزلوا السلط من قريتي صمد وايدون من اعمال اربد والحياريون من \" طيء\" من القحطانية راجع ما كتبناه عنهم وعن ابناء عمهم في فلسطين وغيرها في الجزء الاول القسم الاول من هذا الكتاب.<br />ومن امراء الحياريين \" مدلج بن ظاهر الحياري\" امير عرب الشام وقد كان ذا قوة وبطش يمسك الدرهم من الفضة باصبعيه ويقر كه فيذهب نقشه ويفت الحنطة بين اصابعه مات عام 945 هـ بقرية من قرى حماة[4].<br />وغيرهم من العشائر.<br />ثانيا:العشائر المسيحية:<br />أ?- الذين يعودون باصلهم الى دمشق\" التواضرسة نسبة الى تادرس,والشرابشة(مشربش) ولهم اقرباء في الكرك وبعض قرى اربد وحمص وجبل الدروز وغيرها,وقد نزح معظمهم الى عمان حيث يتمتعون باحترام الجميع .<br />ب?- الذين يعودون باصلهم الى حوران ( بما فيه جبل الدروز) \" الدبابنة ولهم ابناء عم في الكرك وفي الحصن والقراقشة[5] ولهم ابناء عم في الكرك ( الكرادشة ) والناصرة ( كردوش) والحصن من اعمال اربد قال مؤلف تاريخ الناصرة ( ص 247-248) \" والمرجح ان اصل اسرة \" كردوش\"من حوران وكل ما قدرت ان اقف عليه من احد شيوخهم موسى الكردوش الذي هو الان من اكبر شيوخ الناصرة سنا ان اقدم الجدود هم سابا واندرواس ولطف ولعلهم اولاد ميخائيل الكردوش المذكور في السجل الفاهومي سنة 1223 هـ :1818م\" . و\" المشاشفة ومنهم الزعامطة وهم ايضا من حوران و \" القعاورة\" او \" ال قعوار \" وهم غسانيون ولهم فروع في الناصرة ونصف جبيل والسلط وعمان والفحيص قال مؤلف تاريخ الناصرة 0 ص 245-246) عن ال قعوار ما ياتي : [ من اهم اسر الناصرة… اصل الاسرة من الدير ( قرب الفحيص) ومنه جاء فرع الى القسطل ومنه جاء فرع الى الفحيص بجوار السلط وكلها في البلقاء وتكنى فرع الفحيص بالسماري ومنه تفرعت فروع الى جهات اخرى منها فرع في نصف جبيل كنيتهم فيها السماري منهم الدكتور حبيبب سالم احد العشرة اعضاء للمجلس الاستشاري الاول للمندوب السامي البريطاني بعد الاحتلال توفي في نابلسوفرع جاء الى ام جبيل الان خربة بين تابور وعين ماهل ومن ام جبيل جاء منصور قعوار في ايام ظاهر العمر واستوطن الناصرة وكان مطانس قعوار شيخا على الروم في حكم سليمان باشا ونسله الان في السلط من اهم الاسر فيها ].<br />و\" الحدادين(حداد) \" وهم قسمان :اورثوذوكس واصلهم من حورا ن والقسم الثاني البروتستانت غسانيون ولهم ابناء عم في بعض القرى اللبنانية وفي محافظة اربد والسلط.<br />جـ – اللبنانيون : وهم \" الفواخرية (فاخوري)\" نزلوا بلاد السلط منذ اكثر من 300 سنة .<br />د – الفلسطينيون : وهم \" البشارات \" فرع من عائلة ( القرة ) بنابسل ويقيمون في السلط وعمان وغيرها .<br />هـ – الاردنيون : \" القماقمة (قمو)\" يقال ان جدهم كان يقطن في الدير بجوار والفحيص\" وفي القرن المضاي نزل احدهم \" الناصرة\" ويعرفون فيها باسم \"دار الحاج\" و ( النبور) ويقال ان اصلهم من (الربة ) من اعمال الكرك نزل بعضهم السلط وهم النبور وغيرهم الى حوران ومنها الى مرجعيون ويعرفون فيها باسم ( بيت نايفة) نسبة الى احدى جداتهم .<br />ويقسم النبور الذين نزلوا السلط الى ثلاث فرق : النبور والجوايرةوالحناترة قا حنا حردان الخوري مؤلف الاخبار الشهية عن العيال المرجعيونية والتيمية –ص 507 - :<br />[تتمتع فرق النبور بمكانة اجتماعية عالية في شرق الاردن وبالاخص ال جابر الذين ينزعمهم كبيرهم سعيد باشا ابو جابر المقيم في يادودة الخاصة بهم اما منازلهم في السلط فمشهورةوقد نزح معظمهم الى عمان حيث يتمتعون باحترام الجميع<br />أرجو أن تعلم فقط أن معظم عشائر السلط هي من فلسطين غربي النهر كما ذكر سابقا\""
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

