subject = "حُق لكَ أن تفخر .. أنت فلسطيني"
author = "فلسطيني أصيل (فلسطيني وكالصقر)"
text = "هل استوعب الإحتلال الدرس؟ هل فهم العالم المعادلة؟ هل استفاق عباس وباقي الزمرة من غيبوبتهم ووهمهم؟ ربما ! لكن الأكيد أن شعب فلسطين يضرب كل يوم أروع الأمثلة والدروس للعالم بأسره.<br />ثار العالم وتحركت قواه الظالمة العوراء من أصدقاء وأعداء فزعاً وجزعاً على جندي أسير كان يجلس في دبابته موجهاً مدفعها صوب أبناء شعبنا العزل ليطلق ويقتل وقتما شاء، وليسقط أبناء شعبنا شهداء وجرحى بالعشرات، تحرك العالم لإطلاق سراح مجرم حرب وقاتل محترف في جيش لا يوجد للأخلاق فيه مكان، وتحرك مع هؤلاء أبناء العمومة حرصاً على مصلحة الشعب الفلسطيني لإطلاق سراح المجرم شاليط أيضاً !!!!<br />لم يسمع العالم أو يشاهد محمد الدرة وإيمان حجو وهدى غالية وقبلهم وبعدهم الآلاف من الشهداء والجرحى الذين قتلهم بدم بارد أمثال المجرم الأسير، ولم تتحرك دول الجوار لوقف العدوان أو التدخل لتخفيفه، ولم يتردد عباس ولا الحكام العرب عن احتضان وتقبيل رئيس وزراء حكومة الإحتلال ودماء شهدائنا لا زالت طرية لم تجف بعد، لم يسمع العالم بكل ذلك ولم يسمع بأسرانا البواسل في سجون ومعتقلات الإحتلال.<br />بدأت أمطار الصيف تهطل والعالم يلوم الضحية لصالح الجزار السفاح، خُرقت كل قوانين وشرائع الكون فاستهدفت البنية التحتية في قطاع غزة بقصد تجويع وتعطيش الشعب الفلسطيني، اختطف ممثلو الشعب من وزراء ونواب، هددت القيادات بالتصفية، أقفلت كل الخطوط الهاتفية في وجه الضحية .....<br />هل خضع شعبنا؟ هل استكان؟ هل ثار على حكومته ومقاومته؟ هل سقطت الراية؟ أبداً , بل كان التلاحم والتضامن في أروع صوره، كان في صورة دروس للعالم أجمع تقول أننا ومهما اشتدت الهجمة لن نساوم أو نخضع حتى وان كانت هناك فئة فاسدة ومفسدة شوهت تاريخ ونضال شعبنا لسنوات، حتى وان كان عباس لا زال في غيبوبته التي ارتضاها لنفسه ليخرج بالأمس في لقاء مفترض مع الصحفيين حضره أركان زمرته فقط ليصول ويجول مبرراً مواقفه المخزية، وليكرر تفاهات سحب الذرائع وعدم جدوى المقاومة وغيرها من جمله التي حفظناها عن ظهر قلب، دون أن يتعرض للإحتلال بكلمة واحدة.<br />صور ودروس الكرامة والعزة كثيرة، ليس أقلها بيانات المنظمات الشعبية التي استحلفت المقاومة أن لا تسلم الأسير دون مقابل، وتصريحات أبناء الشعب من كل الاتجاهات ومنهم عيسى قراقع عن حركة فتح، والذي مسح تصريحات من يسمونه في العراق بلص بغداد وهو وللأسف الشديد رئيس كتلة فتح البرلمانية المدعو عزام الأحمد والذي كان انتهازياً بشكل غير مسبوق متشفياً شامتاً وداعياً عباس لاستخدام صلاحياته الدستورية لسد الفراغ السياسي، ما أقبحك يا لص بغداد، أمثالك هم من يسعدون الإحتلال ويكملون مخططه.<br />عظمة شعبنا وقوته في مواجهة الآلة العسكرية للإحتلال تجسدت في عملية \\\"الوهم المتبدد\\\" ليتبعها أسطورة نابلس البطل وليد الشحروري والذي واجه جيش الإحتلال جريحاً في معركة غير متكافئة لأكثر من 16 ساعة، استخدم فيها الاحتلال قنابل الصوت والدخان والدموع والكلاب والأجهزة الآلية، وصوت والدته إضافة للذخيرة الحية.<br />مواقف البطولة تجلت أيضاً في التحدي الكبير هذا اليوم بعقد جلسة التشريعي بحضور من يطاردهم الإحتلال دون خوف أو وجل، ولما الخوف؟ ألسنا أصحاب حق؟ إننا والله كذلك.<br />عظيم أنت يا شعب فلسطين بأبنائك وحكومتك ونوابك، عظيم أنت وشعوب العالم تتحرك نصرة لك كما تابعنا في أوروبا وأندونيسيا، حتى وإن كان أبناء أمتك العربية في سبات تلهيهم مباريات كأس العالم، عظيم أنت وقد توحدت في اتفاق وطني رغم كل محاولات العرقلة من أشباه رجال أوسلو، عظيم وأنت تقزّم أشباه الرجال لترفع هامتك فوق رؤوس المنبطحين المتاجرين بك وبقضيتك.<br />لن يضيرك يا شعبي العظيم سقوط البعض، ولن تضيرك أراجيف وأباطيل الإعلام الموجه المنحاز ضدك، ولن يفت في عضدك الكلام المثبط كالذي كتبه عمر حلمي الغول اليوم تحت عنوان \\\"متى تحل أزمة الرواتب\\\" ليكشف عن خباياه وأحقاده الدفينة، ولن تهزم بإذن الله.<br />رائع أنت يا شعب فلسطين وأنت تردد قول الشاعر :<br />يا كل العالم هل تسمع<br />إنا اقسمنا لن نركع<br />لن نركع أبداً لن نركع<br />ما دام بنا طفل يرضع<br />قد نبكي شوقا لا حزنا<br />يا كل العالم كي تسمع<br />فالعيش بذل لا نقبل<br />والموت بفخر ما أمتع<br />قبضاتنا اصلب من حجر<br />أجسادنا سد بل امنع<br />دموع رجالنا محرقة<br />للطاغي بل موت أفظع<br />يا كل العالم هل تسمع<br />ننبيك بأننا لن نخضع<br />قد عاد النجم يجاورنا<br />والحق غدا شمسا تسطع<br />وبلال قام يؤذن في أحياء القدس..<br />أجراس العودة فلتقرع<br />ما عدنا نخاف البطش<br />ولا قصف المدفع..<br />يا كل العالم هل تسمع<br />قد نبكي شوقا لا حزنا<br />يا كل العالم فلتسمع<br />إنا باقون إلى الأبد<br />..لن نركع أبداً<br />...لن نخضع<br />إرفع رأسك وافخر، حق لك ذلك في زمن الخنوع والخضوع، ارفع رأسك فالراية لن تسقط، والحق لن يضيع، طالما أن شعباً عظيماً كشعب فلسطين في الخندق، حق لك أن تفخر .. أنت فلسطيني، وحق لي أن أفخر أني فلسطيني.<br />لك الحق أن تفخر ..<br />فأنت من أرض أولى القبلتين..<br />وأنت من أرض الرباط..<br />وأنت من أرض ٍ وطأتها قدما خير البشر وأشرف الخلق والمرسلين محمد صلى الله عليه وسلم ..<br />وأنت من أرض ٍ أسرى به عليه الصلاة والسلام إليها..<br />ولك الحق أن تفخر ..<br />فأنت..<br />فلسطيني..<br />عربي ..<br />مسلم.<br />فلسطين بلد أنجب الأنبياء والمرسلين عليهم الصلاة والسلام...<br />فلسطين .. بها أولى القبلتين وثالث الحرمين الشريفين..<br />فلسطين .. البلد الذي اختاره الله عز وجل ليعلي راية الجهاد فيه .. ما دامت الحياة على وحه الأرض...<br />بالتأكيد سوف يكون أهلها أهلاً للشهادة .. باذن الله ..<br />خلقتني ربي فأحسنت تكويني .. ورزقتني شرفاً فجعلتني فلسطيني<br />وللحديث بقية , ودمتم بخير ........"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

