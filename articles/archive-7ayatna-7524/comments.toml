[[comments]]
order = 432
subject = "الى الاردنيين احفاد كلوب باشا"
author = "هاشم الفلسطيني"
text = "انا ما بزعل منكوا يا ارادنة.. بتعرفوا ليش.. انتوا حاقدين على الفلسطينية وعلى كل عربي حر.. لانكوا شعب خرة.. صرامي اولاد صرامي.. كلوب باشا وجنوده ناكوا امياتكوا بعلبة حلاوة.. وابائكوا واجدادكوا جماعة البصلة كانوا يحملوا البشاكير لكلوب باشا وربعة يا ابناء ابو حنيك.. انتوا بدو وثلثينكوا صاير لونه اشقر وعيونه زرق لانكوا من نسل الانجليز.. يا خدام اليهود وبوش يا هتافي سيدكوا شارون ويا لاعقي صرماية نتنياهو وباراك.. الطوفان جاي يا خريات ولازم ندس العصي في طيوزكوا ان شاء الله عما قريب.. بس ينتهي دور ما يسمى بمملكة الاردن التي اقتطعت من بلاد الشام وصارلكوا يا زبالة الشعوب دولة وانتوا مرزقة لمم من كل قطر اغنية"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

