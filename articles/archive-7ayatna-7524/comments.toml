order = 408
subject = "تذكييييييييييير لتعليق ما كتبت فيه إسمي"
author = "عاشق فلسطين"
text = "معلش حبيت اذكر انو فيه إلي تعليق في أوائل التعليقات مكتوب فيها :<br />إلى خالد الهزايمـــــــــــــــــــــــــــة >;>; ما تمدحش حالك أكتر عشان لا أفضحكوا أكتر يا حثالة<br />ونسيت أحط إسمي , للتذكير فقط وشكررررررررررررراً وتبقى فلسطين حرة أبية صامدة شامخة وفلسطين أولاً"
archived = "2009-04-05"
