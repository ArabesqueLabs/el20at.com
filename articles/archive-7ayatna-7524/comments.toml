subject = "احس حتى التفلة عليكم حرام يا عشرينات"
author = "بدأت أكره هالموقع"
text = "تفوووووووووووووووووووووووووو على موقع عشرينات<br />وين الادارة الوسخة ؟؟؟؟ وين الادارة ؟؟ حسبنا الله و نعم الوكيل فيكم الله لا يبارك فيكم<br />سب في الدين و الاعراض و بين الاخوة باب مفتوح للفتنة و الادارة تتفرج ؟؟؟؟<br />و الله يا عشرينات لا اقول الا حسبنا الله و نعم الوكيل فيكم و عسى ان تلقوا جزاءكم من الله .. يعني اي كلمة على موقعكم الوسخ على طول تتخذون اجراء .. بس الكلام على الدين و على الاعراض و على الاخوة مافي مشكلة خلوا الباب مفتوح و خلوا عداد الزيارات و عدد التعليقات يزيد !!!<br />حسبنا الله و نعم الوكيل"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

