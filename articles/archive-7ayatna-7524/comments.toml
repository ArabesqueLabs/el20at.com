subject = "الشهيد الاردني"
author = "أبن الشهيد"
text = "الاردني الشهيد رساله الى كل اردني وكل فلسطين<br />الى الاردنيه النشامى<br />الى شهداء الوطن ..........................................<br />الاردن وفلسطين بلد واحد ووطن واحد<br />الى عمي الشهيد عليان حسين على ابورمان *الاردني* السلطي* الذي استشهد على جبل المكبر في القدس الشريف<br />لا تقلق فانتا شهيد وطلبت الشهاده للحفاظ على الوطن والعرض وقول كلمة الله اوكبر واشهد ان لا اله الا الله وشهد انا محمد رسول الله<br />الاسلام اولا<br />والاردني اولا<br />والاردن اولا<br />فيا فلسطنية الاردن يا ااهوا المتاردنيين لوعلم الشهيد انه في يوم من الايام سياتي من هاذا الشعب الفلسطين شخص ويسب الاردن ويسب عرض الاردن هل تعتقد بانه سوف يذهب للدفاع عن فلسطين........حتى يستشهد ويموت هناك<br />هل تستطيع الاجابه؟؟؟؟؟<br />انا استطيع نعم سوف يذهب ولا يتتردد لانه يعرف انه واجب ديني ووطني ولن يتتردد<br />احذرو الياهود يا عرب<br />يا فلسطينيه هل انتم فلسطنيه<br />وهل يوجد شيئ على الخارطه اسمه فلسطين<br />ما ااانتم<br />اسرائيليين<br />من اسرائيل<br />نحن الاردنيين لسنا اعدائكم<br />نحن على استعداد ان نضحي بانفسنا واموالنا فداء لكم فاعرفو عدوكم<br />هل تعتقدو ان الشهيد رحمة الله عليه عليان ابورمان المكتوب اسمه على باب بوابة بلدية السلط الكبرى<br />لوسمع هاذ الكلام سوف يقوم بقتل اليهود ام الفلسطنيه قتلهو ام الدفع عنهم<br />حسبي الله ونعم الوكيل<br />khaled_algool@yahoo.com"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

