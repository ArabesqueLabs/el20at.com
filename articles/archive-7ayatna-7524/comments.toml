text = "ولك روووووووح رووووووووووح احمد ربك انو احنا الفلسطينية الي معيشينكم يا حلو ازا احنا بالاردن على قولتك بلدكم اكتر منكم يعني احنا داعسين على روسكم ولك انا فلسطيني وبفتخر قال اردني ولك انتو بتعرفو ايش يعني الكرامة يا حلو ولك والله والله انو احنا لو بطلع بئيدنا انو نساوي اشي كنا شوينا من زمان ايش بدنا نستنى اشكال زيك يحكو علينا"
