[[comments]]
order = 225
subject = "حان الوداع أيها الأحباب"
author = "بنت نابلس (Palestine First) بحبك يا فلسطين"
text = "أنا خلاص هلأ رح أروح من هده الصفحة , وبودع كل أحبابي الفلسطينيين والفلسطينيات , وبقول الله يوفئكم ويكون معكوا , ولأني أنا فلسطينية وبنت أصول رح أطلع من هده الصفحة اللي امتلت بالسبات والشتايم , فأنا بنصح كل حبايبي الفلسطينيين والفلسطينيات إنهم يطلعوا من الصفحة هده ويخلوا الأردنيين ينبحوا زي الكلاب , وأنا والله بعد هيك إن شاء الله ما رح آجي هون أبدا لأنه خلاص بكفي اللي عم بصير , بدنا نكون عائلين , والله ينصر شعبنا الحبيب الأسير المعاني والله يصبرنا وينصرنا عن قريب إن شاء الله , والله يكون في عون الجميع , والسلام عليكم ورحمة الله وبركاته .....<br />(((((بنت نابلس (Palestine First) بحبك يا فلسطين)))))"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

