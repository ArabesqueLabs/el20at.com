subject = "فلسطين وبس والباقي كلو خس"
author = "من فلسطين"
text = "ما اخوان انتو بتحكو انو الفلسطينيين مو متربيين وانتو يلي بلشتو بالكلام الوسخ واذا بتشوفو اول الكلام رح تلاقو انو ولا فلسطيني سب عليكو الى بعد ما انتو طلعتو كلامكو المتداول بينكم وهاد ما بدل الى على انتو شو؟<br />يعني اذا بتتدعو النخوة والضمير العربي العربي ها مو الاسرائيلي او الامريكي انا متأكد انو اي حد بيسمعكو رح يعرف انتو شو وانتو وين.ومع مين.!!!"
