subject = "اتقوا الله"
author = "عربي مسلم من جزيرة العرب"
text = "لا حول ولا قوة الا باللة<br />يا ناس والله كلنا امة واحدة وكلنا على ملة واحدة واعلموا اخوتي بالله إن اكرمكم<br />عند الله اتقاكم ولا فرق بين عربي ولا عجمي الا بالتقوى كلنا نعيش نفس الحال ونفس الأوضاع<br />خيرات الأمم كلها منهوبة في كل مكان في فلسطين اليهود يحتلونها والعراق الصليبيين يحتلونها<br />وكل الحكام من دون استثناء عون للمحتليين وجميع الحكام انكشفوا على حقيقتهم فلا داعي<br />ان نهتم في هؤلاء الرويبيضات علينا ان نهتم كيف نتخلص من هؤلاء الحكام سواء في مصر<br />او السعودية او الأردن او تونس وفي كل مكان هناك خونة وعملاء امثال هؤلاء الحكام الجبناء<br />الذين يريدون لأمتهم الذل والهوان والله في بلدي اعيش عيش الذل بسبب الحكام هناك في وطني<br />جهل وجوع وخوف وبطش بسبب هؤلاء الحكام بالله عليكم من منكم يعيش في وطن فيه عزة<br />وكرامة وعيش رغيد حتى اهاجر اليه واعيش فيه ما تبقى من عمري بشرف وكرامة دلوني<br />يرحمكم الله واكون لكم من الشاكرين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

