text = "الله على الأردنية اللي برفعو الراس ولكم روحو يا رب تعيشو طول حياتكم مهنين مكرمين مدللين معززين وضلكم تعايرو وتذلو الفلسطينية المهم أنا هسا بدي أرد على الجواااد اللي مسميلي حالو حمودي شكري ولك لما بدك تسأل اول إيشي بتسميلي حالك إسم زلمة رجال مو إسم دلع متل البنات والنسوان يا ابن المرا قال حموودي قال جد انكو الفلسطينة فاظين وما عندكو إيشي تحكو وقال شو البنات اللي بوسخو بالحكي والزلمة اللي فيهم هاد ازا كان فيهم زلام بحكيش كلمة جد انكو النسوان عندكو رجال والرجال عندكو نسوان وفش زلمة فلسطيني عندو ( إير = حمامة = زب) لا الحمد الله الشب عندكو عندو كس متلو متل مرتو ههههههههه يلا يا ابن الفاظية إسألتك وفرها على نفسك لإنو الكل زابلك ومش معبرك يعني إضلكاش تعيد وتزيد بنفس الحكي"
