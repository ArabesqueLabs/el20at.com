subject = "جاهلين"
author = "بنت ارض ال 48"
text = "اول شي كل واحد بقول انو فلسطين<br />مجرد بلد لا غير<br />بكون غلطان وجاهل<br />اول شي اعرفوا ايش هي فلسطين<br />بعدين تعالوا احكوا وتفلسفو<br />ارفع راسك لانك فلسطيني"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 355
subject = "الى اجهل خلق الله محمد النواف"
author = "بنت ارض ال 48"
text = "لا والله سيد محمد<br />يااااااااااااي صاير ليك لسان وبتعرف تحكي يا ساقط<br />شو السيره ؟؟؟ اها نسيت هسه عرفت<br />انت جاي اتفرغ طاقتك هون<br />لانه الشكل المرعب تاج راسك انت مش نحنا<br />خابط عليك وقابظ نفسك<br />شو حبيب امك جاي تعمل هون<br />اسمع يا ابن الساقط<br />بدك تحكي عن ناس .... احكي عن ناس مثلك<br />مش عن ناس اعلى من مستواك.... يا واطي يا ساقط<br />شو انا شايفه انك مش لاقيلك شغله يا حثاله المجتمع؟؟؟<br />يلا يلا يلا روح نظف كندره رئيسك اللي متل طبقتك<br />الحمدلله الحمدلله الحمدلله يا ربي انا ما كنا وما رح نكون وما نحكمنا وما رح ننحكم متل اشكالكم<br />الحمدلله كرامه الفلسطينيه فوووووووووووق<br />واللي بدوا يحكي كلمه واحده بس لازم يفكر الدهر كله بهاي الكلمه<br />يا جاهل<br />عنجد والله الجاهلين لازم يسكتوا ولازم نرميهم بالمزااااااابل يا مزبله<br />تفووووووووووه على هيك ناس جاهله مزبله<br />تبقى الاسود اسود والكلاب كلاب يا كلب<br />ييييييييييي عليي انا مش لازم اقلك كلب الك ولامثالك تعرف ليش .... لاني نزلت من مستوى الكلب.....<br />ولو كلمه الخنزير محلله كنت قلتلك اياها .... بس حرام الخنزير اشرف منك"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 356
subject = "شكرا لك أختي بنت أرض الــ 48"
author = "عاشق فلسطين"
text = "السلام عليكم ورحمة الله وبركاته , فعلا أختي هدا واحد ندل حقير واطي سافل منحط مخزي مخري عليه مدعوس عليه متفوف عليه<br />, وأنا متأكد يا أختي إنو لسة الشرشيح والبلغم المتفوف عليه ما زال ملصق بأسنانو ولثتو وتمو وشفتو وبرطمو وخنفورو كمان , هدول هما الأردنيين , أختي ولسة كاتب كمان إنو مشتهي نيك الفلسطينيات , لأنو الفلسطينيات ما بطلعوا بوشو وبعطوه بالجزمة عليه لو تكلم كلمة عليها , لكن شوفي الأردنيات يا أختي , ما فيش أوسخ وأعرص وأقحب منهم إلا من رحم الله مش كلهم برضوا , لكن الشعب الأردني شعب حقيييييير وواطي ووقح وسافل ومتخلف لآخر وأبعد الحدود , أختي لا تكتري كلام مع هدا البدوي الشراري السافل المنحط الكلب بمعنى الكلمة , حتى يا أختي والله الكلب أنظف منو لأنو الكلب حارس أمين ,<br />عندي هيك على الأخير نكتة أخييييييييييييييييييييييييييييييييييييييييييرة : (طبعا هده النكتة من أحد نكت حبيبة قلبي بنت نابلس) :<br />بقلك في واحد أردني بدو يتجوز وحدة فلسطينية , فإجا أبو الفلسطينية وقال للأردني : والله بجوز كلب ولا بجوز أردني , فصار الأردني يقول : أنا كلب وصار يعوي , شايفة كيف الإهانة , هههههههههههههههههههههههههههههههههههههههه<br />وهما أكلب من الكلاب . شكرا جزيلا لكم , تسلموا حبايب قلبي الفلسطينيين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 357
subject = "ليش عم تنجسوا لسانكم"
author = "بنت ارض ال 48"
text = "لكل اللي عم يعقبوا لهاد الحثاله<br />والله ما بيستاهل انكم تنجسوا السنتكم فيه<br />بعدين شووووو نسيتوا انو نحنا فلسطينيه<br />احم احم يا عمي وما حد قدنا<br />ما بنعبر حثاله<br />اي دخيلكوا مهو لمل الكلب بكون ينبح نحنا ايش نعملواااا؟؟؟<br />بنعطيه عظمه موووووووو فهو حرااام ابعتووووه للمزبله يمكن كفى نباااااح<br />الله يخلي الفلسطينيه يا رب فوق راس الجميييييييييييع وغصب عن اكبر راس كبير رح ينكسر من قدامنا<br />يا عميييييييييي فلسطينيه نحنا وما حد بجيب ظفر رجلنا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 358
subject = "إلى أعز ناس و أشرف ناس ( الفلسطينيين )"
author = "يوسف البحيصي ( فلسطيني و مثل الصقر يصعب اصطيادي )"
text = "الله يحيي كل فلسطيني على وجه الكرة الأرضية و بحية أخوي عاشق فلسطين و بحيي أختي بنت أرض ال48 و الله يحيي أصلكم انتم الاثنين و الصراحة دايما الفلسطينيين برفعو الراس في أي مكان في العالم حتى في ظلمات المحيطات<br />اللي لسا الإنسان ما وصلها .<br />و برجع بقول للأنذال الأردنيين أولاد الزناة إنو الأردن هي صحراء فلسطين و هذا شرف كبير إلكم يا أولاد الحرام<br />و السلام على كل من هو عربي أصيل و لا سلام على يهود العرب الأردنيين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 359
subject = "إلى يهود العرب الأردنيين"
author = "يوسف البحيصي ( قلتها في وله فلسطيني فلسطيني فأشمعت الأصم الأبكما"
text = "يا يهود العرب يا أردنيين و الله الصراحة انتم ناس إذا شفتو الطبلة بتتجمعو و إذا شفتو العصا بتشردو<br />و لكم انتم يصحلكم الشرف إنو أي فلسطيني بدوس أرضكم النجسة يا خون يا بياعين أراضيكم و أعراضكم<br />و لكم كل فلسطيني و عراقي لو يسحب أموالو من الأردن و الله و الله و الله لتموتو من الجوع يا أولاد الجعانة<br />أقسم بالله لتموتو من جوع و تصيرو توكلو العشب يا خواريف<br />و برجع بقلكم إنو شرف كبير عليكم انو الأردن هي صحراء فلسطين و اللي مش عاجبه يشرب من بحر غزة<br />و سلام الله على كل من هو عربي أصيل و لا سلام على من هم يهود العرب الأردنيين لإنهم ليسو على ملة الإسلام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

