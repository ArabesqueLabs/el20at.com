[[comments]]
order = 103
subject = "وحدوا الله يا جماعة بكفي مهزلة وسب وشتايم"
author = "كلنا فلسطين"
text = "السلام عليكم ورحمة الله وبركاته , بكفي يا إخوة من تبادل الإهانات والشتائم وغير هيك , بكفي كلنا مسلمين وكلنا شعوب وحدة<br />حرام اللي عم بنعملوا , الله يهديكم , أنا فلسطيني وبفتخر وبعتز وكل إشي , لكن مش لدرجة إني أسب وأشتم وغير هيك وحدوا الله يا جماعة الخير , اذكروا الله يذكركم {يا أيها الناس إنا خلقناكم من ذكر وأنثى وجعلناكم شعوبا وقبائل لتعارفوا , إن أكرمكم عند<br />الله أتقاكم} لا إله إلا الله محمد رسول الله"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 104
subject = "أنا بأيد كلامك"
author = "إلى الأخ العزيز : كلنا فلسطين"
text = "السلام عليكم , أخي العزيز : كلنا فلسطين , أنا بأيد كلامك ,وكل كلامك صحيح , لكن يا أخي لما بتزكر مدبحة أيلول الأسود لا<br />يمكن قلبي يغفر ويسامح الأردن كلها إلى يوم الدين , وتاني إشي العائلة الهاشمية بتقول إنه الحسين هو من الجيل التاني والأربعين من أحفاد سيد البشر صلى الله عليه وسلم , ولكن أولاد الرسول صلى الله عليه وسلم ماتوا وهما القاسم وإبراهيم في صغرهما , والله أعلم إذا كانوا بنات النبي الطاهرات صلى الله عليه وسلم كانوا تزجوا من قبل هيك الله أعلم , لكن أنا بتوقع والله أعلم والله أعلم والله أعلم إنه الرسول صلى الله عليه وسلم ما عنده أحفاد , وتاني إشي , اللي بكون من آل البيت الأشراف , لازم يطبق<br />شرع الله في أرضه , مش يروح يتقل المسلمين الضعفاء في فلسطين ويتآمر عليهم مع اليهود , على فكرة , كل اللي عم بصير<br />بغزة تحت رعاية ووصاية أردنية , لأنه نفس العائلة الهاشمية بتكره غزة والغزازوة مع إني مش غزاوي , لكن هده هي الحقيقة<br />وتاني إشي بدي أذكر كل الأردنيين اللي بتقول إنه الأردن أكرمت الفلسطينيين , صحيح أكرمتهم ولكن ليس بالمجان , وتالت إشي الأوسخ من هيك إنه الفلسطينيين لما بدهم يجواعلى الأردن من سفر وغير هيك لازم يعملوا فيزا وغير هيك , لكن النور<br />لما بدهم يخشوا بخشوا بدون فيزا ولا غيره , وين الإكرام عاد والفلسطينيين أغنى من أهل الأردن كلهم وهما اللي محتاجينهم<br />عشان ينعشوهم , لكن الله ما بسيب الظالم في حاله , وحسبنا الله ونعم الوكيل , وطباخ السم لازم يدوقه غصبا عنه .<br />والله يخلي فلسطين وأنا بحط الفلسطينيين والفلسطينيات على رأسي , لأني بتحدى أي شعب في العالم إنه يتحمل ما تحمله<br />الشعب الفلسطيني من الآم ونكبات , والله بتحدى , مع إني والله ما بحب العنصرية , لكن كل ما بتزكر كيف الأردن بتتعامل مع<br />الفلسطينيين بجفة وغلظة بكرههم كره شديد , وهدا هو الواقع ولكن الحمد لله أحسن كلمة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

