[[comments]]
order = 397
subject = "اخر كلمة في الموضوع لأني لا اريد زيادة التعليقات و اضافة قيمة على الموضوع المنحط و الحقير هذا"
author = "عابر سبيل و رايح بس كلمة قبل ما اروح"
text = "و الله يا اخي الكريم اذا كان موقع عشرينات سئ و حقير ( و هو كذلك و لكني لا اوافق ابدا على السباب الذي ذكرته في حقهم مافي داعي للالفاظ الغير لائقة مع بعضنا) ،، اذا كان الموقع سئ فماذا عن اصحاب التعليقات ؟؟؟ ماذا عنا نحن ؟؟؟<br />يعني هل نحن احسن منهم ؟ فتحولنا موقع و فتحوا مجال للناس تشتم و تسب و تنحط في الاسلوب فهل ضربونا على ايدينا لكي نتبادل السباب فعليا ؟؟؟ ...<br />اذا احنا نفوسنا كانت نظيفة و كان الاحترام و الاخلاق الرفيعه جزء منا كما امرنا ديننا صدقني مواقع مثل عشرينات يا اما تسكر او تنجبر ان تتعامل باحترام ... لكن الموضوع هذا و غيره لم ينجحه فتح باب السباب و لكن انجحه كثرة السباببين العرب ماشاء الله و مبدأ (احنا احسن ناس و احسن دولة و الباقي ... ) .. المشكلة مش في الموقع و لو انه موقع حقير و يحاسب على كل كلمة منحظة موجودة عليه و لكن المشكلة الرئيسية في الناس اللي اصبح السب و القذارة على لسانهم و عشان يدافع عن بلده لازم يلوث لسانة و يلوث الصفحة كلها بالقذارة ..<br />اقسم بالله ما نسوى نعال بدون الاسلام .... كفاكم تبجح و تعالي .. البلد الفلاني و الناس الفلانيين فيهم و فيهم .. بس خلاص .. اتقوا رب العالمين فضوها سيرة<br />يا اخي على الاقل كل واحد يترفع بنفسه و يخلي نفسه عزيزة عليه شوي و لا ينزل مستواها للكلام القذر البذئ انقرفنا من هالكلام و الله عيب عليكم ..<br />و فالكم الوحدة ان شاء الله ... سلام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

