subject = "الحب والرشاقه0162747437"
author = "ياسر0162747437"
text = "حبيبة قلبى التى لم تراها عينى لو كان صوتى حفيف الشجر لم يكفى اشتياقى اليكى لان صوتك تغريد البلابل ودليل على انوستك الطاغيه فتعالى تلامس يداى يديك او حتى اقبل شفتيك وانقب عن الورد وارتشف رحيق من فوق نهديكى واقتحم الجسور التى بين فخزيكىانا بحب الدوره الدمويه وبحب الهوا والنبض وبحب المداعبه الجنسيه والمممارسه وبحب المداعبه بين الفخزين وبحب المداعبه اعل الفخزين والمداعبه فى جسم المراه كل مكن فى جسمه وبحب ارضع فى الحلمه وبحب تقعدى عليه وتقومى وتقعدى برحت رحتك وبحب ادخل فخزى فى فخزك حت اليل الدامس وبحب المصمص وبحب ابوس بين الفخزين وبحب اعيش فى جسم المراه واعشقه واهزر معه وبحب القمصن القصير وبحب البس البكنى واحب اعيش حيتى مع وحده احبه من كل قلبى قبل كل شيئ حتى احفظ عليه لوحدى وبحب اعيش حيتى معه نيك فى نيك وبحب رفع رجله على كتفى وادخل فيه بكل حنين ورق اه واه بحب دخلت جدا ومن تعيش معيه وبحب المداعبه الجنسيه والممارسه قبل النيك وعايز تدخلنى بين فرجه ابوس فيه والحس فيه بحب مكان الفرج جدا وبحب وبحب وبعشق رجلين الستات جدا 0162747437"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 474
subject = "هههههههههه جت القحبة تكحلها وبدل كده عمتها"
author = "عربي من جزيرة العرب"
text = "هههههههههههههه صدج إنها غبية وحمارة هالفلسطيزية القحبة الممحونة اللي نقلت تعليقات اخواننا الأردنيين وتحسب إنها تفضحهم بس والحق إنها جت تكحلها قامت عمتها ههههههههههههههههه<br />1- الفلسطينيون همه اللي باعو أرضهم بإيدهم .. وهمه اللي راحو وتركو أرضهم وبيوتهم وكل إشي بخصهم .. وراحو ع بلدان ثانيه .. يعني (( جنوا ع أنفسهم براقش )) .. يعني خربو بيتهم بإيدهم وغيرو كثير من الشغلات .. الخ .. لأ وفوق كل هاذ بدهم الناس تحترمهم وتقدرهم وتوجبهم ويكون إلهم قيمه بالنسبه لإلهم .. هلا عمي .. أول اشي روحو رجعوا أرضكو .. وهاذ إذا قدرتوا ترجعوهااااااااااااااااااااا .. خخخخخخخخخخخ .. (( إبقوا قابلوني ع قولة إخوانه المصريين )) .. ماعلينا .. وأيضاً هاذ ثالثاُ<br />رابعاً و ليعلم الجميع (( كل الناس )) بأن للفسطينيين صفات (( والعياذ بالله منها )) .. لاتتوافر في الكافر نفسه .. تصورا .. وتخيلو هاذ الأشي .. يعني أنا هسه رح أحي صفاتهم بكل إختصار لأنو (( ماخفي كان أعظم )) .. ورح أبدا .. 1) الحقد والكره والحسد لكل الناس بشكل عام، وخاص (( للأردنيين )) .. مش عارف ليه ؟؟؟ مع إنو والله (( بكسر الهاء )) .. إنو حنا مفضليين عليهم خيرات الله .. وأكبر دليل أنو حنا مستقبلينهم عنا .. وبشتغلو عنا .. زينا زيهم (( لابنزيد عنهم بإشي وولا همه بزيدو عنا بإشي )) .. (( يعني أكثر من هيك ؟!! )) .. 2) الجشع والطمع وتمني زوال نعمة الغير .. (( يالله شوفوا لوين ؟؟؟ )) .. لا إله الله .. ماعلينا .. همه هيك أصلا ً كلهم على نفس الشاكله (( جيل بعلم جيل )) .. 4) النفاق والضحك عليك (( من ورا ظهرك يعني )) .. الله أكبـــــــــــــــــــــــــــــــــررر .. 5) نكران فضل الناس وجميلهم عليهم .. (( خير تعمل شر تلقى )) .. اللهم صبرنا على هذوووووووووووووووووووووله ((الـ......)) .. 6) ولما بدهم يعزموك (( طبعاً مش سواد في عيونك .. لأ .. لمصالحهم الشخصية .. بس على مين ؟؟ .. على بابا ياماما )) ..المهم ... بتطلع من عندهم على وشك المووووووووووووووت .. لأنهم وبكل بساطه .. وإنتبهوا لهاي الشغله كثير منيييييييييييح (( ببصقول في الصحن اللي بوكلو في قبل ماقدمولك إياه .. وطبعاً أنتا بتكنش عارف هاذ الإشي .. وبحكولك تفضل يهلا بالضيف .. ضيف الله .. وأنتا يامسكين (( المعزوم )) راحت عليك وأكلتها في حالك .. ؟؟!! لاحول الله ياربي ..... الخ وهاذ الي حكتوه (( فيض من غيض )) ..<br />ع العموم ... كل فلسطيني مايرفع راسوووووووووووووووووووووووووووووووووو .. لأنو دايماً كان عكس هيك تماماً (( راسو بالأرض ورح يظلو راسو بالارض )) .. وتحيا الأردن أولاااااااااااااااااااااااا خاوا عن اللي برضى واللمابرضى<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />2- ولكن يوجد أناس فلسطينيون يريدون اللعب بالنار .. ولكنهم خسؤا هم وأمثالهم .. فالأردن سيبقى تاج الروؤس كلهم .. وكل هذا وغيره من الكلام الذي قلته .. وهنا أكرر كلامي وأقول التاريخ أكبر شاهد على ماحدث من وقائع ومعارك عديدة .. والتاريخ يعيد نفسه كما يقولون .. والتاريخ ليس بإنسان لكي يخطاْ يا (( الوليد الفلسطيني )) وإنما كان يسجل ويشاهد على كل كبيرة وصغيرة ويدونها في كتب لكي يقرأها هذا الجيل والجيل القادم من بعده وهكذا دواليك ..<br />ومع هذا كله لايزال بعض الناس يحملون الكيد والغل فوقهم .. وشعارهم (( لا لبقاء الأردن )) ولكن خسؤا هم وأمثالهم من هؤلاء المرتزقة الذين لو أحصيتهم لايتجاوزون أعداد الأصابع .. فما أكثر الذين يقولون ولا يفعلون ؟؟ّ!!! الوليد الفلسطيني<br />أنت فلسطيني والله محي أصلك .. ولكن هل سألت نفسك ماهو جوازك ؟؟؟ ألم تسأل نفسك من أين تأكل وتشرب وأين تنام ؟؟؟ ألم تسأل لماذا يحقد الفلسطينيون على الأردنيون ؟؟؟ ألم تسأل لماذا كل مايقال عن اسم الأردن الفلسطيني ينتفض من مكانه وكأن صاعقة صعقته ؟؟؟ هذه الأسئلة وغيرها من الأسئلة تحتاج لإجابات مقنعة ومفحمة .. وليست إجابات أطفال صغار يا الوليد الفلسطيني .. ع العموم هذا البلد سيظل معطاءً كريماً .. فقد نشأ عى هذا الشيء وتربى وترعرع على الأصالة والبداوه<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />3- أولاً يا فلسطيني وقبل ما أعلق على كلامك اللي مثل وجهك .. ولك أنتا فقدت أدبك واحترامك وتقديرك للناس .. أنتا واحد حشرة . مرتزقة . تافه . واطي . حقير . وسخ . منحط وسافل ..<br />ولك أنتا لو فيك ذرة احترام وتقدير كنت مابتحكي كلامك هاذ اللي بدل إنك واحد مش متربي وأهللك \\\\\\\\\\\\\\\" وللأسف الشديد \\\\\\\\\\\\\\\" ماعرفوا يربوك .ز أخص . أخص على الزلم !!!<br />ولكو أنتو مين اللي سامعلكو، قاعدين عم بتعو وبتنبحو ياكلااااااااااااااااااااب !<br />جبلي واحد فلسطيني بفهم أو عندو استعداد يفهم !<br />أنا بقول أنو الشعب الفلسطيني ودع .. وعمرو مارح يصير بني آدم مادام هذوله الحثالة .. المرتزقة قاعدين عم بوسخو بسمعة فلسطين وأهلها .. هذوله اللي لو بدك تعدهم بطلعوش عدد أصابع إيدك !<br />هذوله اللي بحطهم من قائمة \\\\\\\\\\\\\\\" الأغبياء وبلا حدود \\\\\\\\\\\\\\\" ؟!<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />4- آآآآخ يالقهر .. لهدرجة القهر بسوي هيك ؟!! والله ماهقيتها من الفلسطينية .. تراكو والله منتو عايشين بهالدنيا .. جايين تحكو عنا .. ولكو روحو شوفو الشرموط العاهر الداعر أبو مازن .. ولا العميل الجاسوس الغزاوي ابن المقطعه ابن المخيمات اليي مش لاقي يوكل حلان أبر خنيث بالعالم .. ولا بهلول عريقات ابن الغبيه الهبله الخوووووووثه الشرموطه المنيوكه .. ولكو شوفو أبو ردينه كس أختو ابن حماره حتى حكي بعرفش يحكي .. أي كس أمو ويلعن شرفو .. ولكو شوفو الزبالة عبد ربه .. اللي بقرط بالراااااااااء .. أبو لدغه .. يازلمه روح زبّط حكيك .. كس أمك أنتا الثاني أخو شرموطه منيكوه شلقه عاهره داعره .. ولكو أنتو ناااااااااااااس شراميط ورح تظلو هيك .. وأنتو مش وجه نعمه .. ولا أنتو وجه خير بالمره .. ولكو شفت ناس بحياتي كثير بس زي الفلسطينية عمري ماشفت .. وسخين .. معفنيين .. مدوديين .. أنذال .. واطيين .. وقحيين .. سفله .. مرتزقة .. الخ<br />ولكو ليجي يوم ونعلي الراية الهاشمية خفاقة فوووووق فووووووووق فوووووووووووووووووووووووووووق للي مايعرف حده .. ورح تصير فلسطين جزءاً لا يتجزء من أردنا الغالي .. وحنا رح نعلهم ونربيهم لهذوله الحوش البجم الغجر النور الزبايل ..<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />5- أنا والله نفسي لو إنه جلالة الملك عبد الله الثاني ابن الحسين المعظم حفظه الله لو إنه يصدر قرار بإلقاء قنبلة موقوتة وذرية على فلسطين كلها لأنه شعب جبار وحقير وقذر وملعون , الملك حسين بن طلال الله يرحمه ما غلط لما ضرب الضفة في مذبحة أيلول الأبيض مش الأسود زي ما بتسموها لأنه عارف شر هدول القوم البوم الفلسطينيين الملاعين أولاد الكلب والعرص , على كل إن شاء الله يصدر القرار هدا ويا ريت عن قريب , لأنه الجيش الأردني من أقوى جيوش العالم , وبقدرته دبح الفلسطينيين خلال ربع ساعة<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />6- ولكو يافلسطيزيه لو في واحد منكو بفهم أو عند حتى استعداد إنو يفهم .. ولكو بقص إيدي إذا فلسطيزي بفهم .. مكلكو ع بعض شلة مساطيل هبايل مدودي معفنيين مفطسيين ريحتكو طالعه ... وفوق كل هيك أشرمك وأكلب وأنذل وأحقر وأوطى وأسفل وأرذل شعب في العالم بلا مناااااااااااااازع .. ماشالله عليكو محتليين الصداره أنتو .. أي كس أم شرفكو ولاد منيوكه عارهره داعره، عليم الله الواحد منكو بوساش قشرة بصلة .. بندعس ع شرفو وشرف اللي خلفو وخلفتو وبنتاك من اللي بسوى واللي مابسوى وختو وأمو وكل بنات عيلتو وكل بنات فلسطين بتناكو منا حنا الأردنية .. فلا عجب في ذلك بأن ترى هؤلاء الفلسطيزيه طالعين من زبابناااااااااا .. ولكو قسماً بالله إنكو الواحد بسألش عن حالو .. كل واحد بشتغل ع حالو .. وفش فيكو واحد أو حتى نص واحد أو ربع .. ياسادة زلمه ابن زلمه بنشد فيه الظهر.. كلكو شغل صياح وصراخ وجعجه .. وع الفاظي وقال شو قال فلسطين أم الدول أي كس أختها من دولة نايكينها اليهوووووووووووووووود واحد واحد .. ولكو اللي مش عاجبيتو العيشة بلادنا بوجه ع أقرب جسر وينخلع من بلادنا والخلعة اللي تخلع رقبتو وتخلخل عظامو وإنشالله بتكسر وبتشقف ميت شقفة وشقفة .....<br />>;;>;;>;;>;;ويحيا الأردن وكس أمك يافلسطين يابلد الشرموطات العاهرات الداعرات .. وكس أمكو ع أم الرئيس أبو مازن البهائي الواطي اللي ماعندو أصل أو شرف .. اسمعو منيح هونه حنا ملكنا هاشمي .. مش مثل رئيسكو اللي أصلو مش عارف من وين أكيد جاي عن طريق الحرام وعن طريق علاقة جنسية غير مشروعة .. يعني إذا رئيسكو مش معروفلو أصل فما بالكو بإنتو .. يعني الشعب !!!<br />ويلا يلاااا يلاااااااااا على بلدكو ياشراميط ولاد الشراميط .. ولاتنسو تلمو عفنكو قرفكو ووسخكو وهبلكو وتسطيلكو معاكو .. ماشي .. ههههههههههههههههههههههههههههه<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />7- بس وينكو .. أنتو كلكو الفلسطيزية اللي كتبو تعليقاتهم .. بدي أقلهم شغله وحده بس ..<br />إنو المراجل وشغل الزلمنة . وشوفة الحال وشد الحيل .. ونفخ الصدور .. وكل واحد عاملي حالو أبو عنتر ومش عارف شو ..<br />بكونش من ورا شاشة الكمبيوتر .. أو التطقيق ع الكيبورد .. اللي بدو يحكي إشي يجي ويتفظل ويحكي وجه بوجه .. كس أمكو شغل لقلقة وتجعير .. بس لما تصير الشغلة جد وحقيقة بتتخبو مثل البسس والقطط ياوسخين ياجرب يامعفنين .. الله يلعنكو واحد واحد .. قال شعب منضال قال .. بس بلااااااااااااااااش !!!<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />8- وأنا هونه بدي أقول كلمة وحده لهذولة الملقبيين بالفلسطيزيين .. يعني أنا مش فاهم .. ليش الواحد بعمل مع كل الناس خير وبساعدهم وبعاونهم، وبردوه بالمثل ؟.. إلا الفلسطيزيين .. بتعمل معاهم خير وبتساعدهم .. بروحو بقلبو ظدك .. وبصيرو مش معك بالمره . يعني فوق ما حنا مفظليين عليهم وعلى اللي خلفوهم وعلى كل فلسطيزي أجرب مقلعط مش لاقيله دفشة ولا دزه .. ويلا يلا تا شايف قدامو .. فعلاً !!! إنكو ناس حقرا وأنذال ووسخيين ومعفنيين وجرب ومفطسيين وهبايل وكلاب ولاد كلاب ولكو إنتو في دمكو الكذب والغش والحقد والنميمة والحقد والكره والضغينة واللئم .. الله مجمع فيكو كل وسخ وخره هالدنيا والعالم وحاطه فيكو .. سبحان الله !!! يعني الناس بتحاول إنها ( ه ) تحترمكو .. وتقدركو .. وتسويلكو مكانة ومستوى .. وإشي عليه القيمة والفايدة .. بس إنتو مامنكو فايدة بالمره .. يعني أنا الصراحة .. مش من طبعي أو حتى من صفاتي إني أسب سوى إنو شفت إنو فاظ الكيل .. والوعاء امتلا وصار لبرا .. فقلت فحالي وفنفسي صار لازم أتدخل وأسب وألعن وأفضحكو كلكو فرداً فرداً .. يعني أكبر دليل إنكو ناس شاطرة .. ومتفصحنه .. ورايقة .. وفاضية .. وماعندكو شغله ولامشغله . ولا حتى عمله .. إنكو نازليين سب فينا على ولا إشي .. يعني القافلة تسير والكلاااااااااااااااب ( اللي همه إنتو ) تنبح وتعوي ..!!!<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره فالتات ودايرات وداشرات بالشوارع .. يعني والله أنا بشفق عليكو من شعب ماكل خرا من جميع الأصعدة والجوانب المختلفة . يعني شعب كس إمو من شعب شرموووووووووووووط .. قال رنتيسي وياسين وأبو عمار ( أبو حمااااااااااااااااااااااااااار ) .. وكس أخت أسماءكو كيف هيه !!! إنتو اللي رح توكلو خراااااااااااااااا بالملعقة والشوكة والسكين ... وبالنهاية .. وكلمة أخيرة لكل أردني على وجه الكرة الأرضبة .. وووين ما كان .. بقلو وأنا هونه من موقعي ( الإمارات ) .. إرفع راسك لفوق لفوق لفوق وخليك عنيد وراسك يابس مش زي الحجر لأ أقوى من الحجر بكثييييييييييييييير .. وخلي عينك جاويه .. بتقدح شرارة .. قوية .. واللي بطلع فيك وخصوصاً إذا كان فلسطيزي .. مع إنو بسترجيش أو بالأحرى بقدرش أو إنو يحاول يرفع وجهو بوجهك .. وفي حال لو رفع شويه من وجهو الأجرب أخزقلو جوز عيونو .. وسوي براسووو خريطة العالم .. ونييييييييييييك خواته ال66مليون شرموطه وشرموطه .. ولاتنسى تنيك إمو ( لإنها هيه الأساس ) .. وبعد هيك إدعس بنص بطنو دعسة بنت كلب ( نصها موت ).. وشلحو أواعيه .. وافتح طيزو ونيييييييييييييييييييييييييكو لحد ما يغمى عليه ويطفي على الآخر . وبعدين كفين على الماشي ومرتبات يكونو على أكمن بوكس على شلوتين في زبو يخليه يبطل يخلف نهائي وبالمره .. وبعد هيك ( بدي أفرط من الظحك ) .. _ هذا إذا ظل عايش وعلى قيد الحياة وفيه روح وبتنفس _ .. على العموم شيك يعني .. هع هع هع ... وقلوووووووو بأعلى صوتك كالآتي :- ((( مظيع بوجهي شلن يا أخو العرصة ..... )))<br />ولكووووووووو .. نكناكو كثير كثيييييييييييييييييييييييييييييييييييير كثيييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييير .. وزهقنا من طياز وكساس وبزاز وشفايف وخدود بناتكو ونسوانكو يالفلسطيزيه .. وملينا منكو نهائي .. ومسحنا بكرامتكو وشرفكو أرض الأردن كلها/ ولفينا فيها شبر شبر .. ولعنا ظمايركو حى صفيتو بلا ظمير .. أي كس أختكو من متى كان عندكو ظمير .. يعني بالمشرمحي هزئناااااااااااااااااااااااااااااااااااااااااكوووووووووووووووووووووووووووو .. وخليناكو فرجه للي بسوى واللي مابسوى .. وعلكة بثم الجميع .. وسيرتكو وقصتو على كل لسان في العالم .. يعني خلصنا عليكو وقظينا عليكو .. يعني ياجهلة ( Game Over ) <<< يعني انتهت اللعبة ،،،<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />9- الله على الأردنية اللي برفعو الراس ولكم روحو يا رب تعيشو طول حياتكم مهنين مكرمين مدللين معززين وضلكم تعايرو وتذلو الفلسطينية ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />10- أخي السعودي .. والله إني بعزك وبحطك على راسي من فوق بس أنتا يعني، وبعيد عنك بتحكي مع حمييييييييييييير ( الفلسطيزيه ) .. يعني همه هيك الله خالقهم ناس حمير جحوش غجر نور بقر حوش بجم بفهموش .. يعني لويش تعب حالك على الفاظي .. سيبك منهم .. هذوله الكلام معهم بنفعش .. بدهم الواحد يدق راسهم مزبوط وينيك أعراظهم وشفهم ويحمل كل بناتهم الشرموطات المنيوكات الداعرات العاهرات البايعات شرفهم لمين مانكان ؟؟ والله دنيا غريبه .. صدقني ياأخي السعودي هاي الدنيا مش مخربها غير هذولة الفلسطيزية اللي همه حثالة ونذالة وحقارة وسخنة المجتمع العربي والعاملي .. لأنهم ناس بالأساس وبالأصل وسخيين وتافهيين لأبعد الحدود .. إتصور يا أخي السعودي . إنو الفلسطيزي بعرفش مين اخوه بمعن إنو اخو لو صرلوا اشي أو ظاقت فيه الدنيا وإشي طبيعي يلجاً لأقرب المقربيين إلو ( اللي هوه أخوه ) ويطلع أخوه ويحكيلي مابقدر أساعدك أو أخدمك .. يعني أتخيل السولافه أنتا .. فمابالك الشعب الفلسطيزي كل هيك !!<br />ع العموم .. ترى أخوي،،، الناس بأفعالها مش بأقوالها .. وكل فلسطيزي ابن داعره عاهره ابن مقطعه بلجيكي اخو بلجيكيه شرموطه .. كتب أي إشي عن الأردن _ بشكل عام _ بقلو ترى المراجل مش من تحت لتحت .. وتسب علي وعلى الاردنيين .. المراجل إنك تيجي بوجهي وتحكي كلامك وساعتها وشرفي لأكون مخلص عليك وماسحك عن الوجود .. ومخليك ملطشة الكل يصير يظرب فيك . وينيك بعرظ أختك وأمك .. وأنا ابن نواف الشرارات وقدها وقدود ..<br />وشكر خاص للشباب الأردنيين على فزعتهم ونشامتهم .. وحنا مايغمظلنا جفن حتى ننهي على هؤلاء المرتزقة الحشرات السفله .. وإذا سألتني ياخوي السعودي شو أمنيتك ؟؟؟ لأقلك نفسي ومناي .. وأمل وأمنيت حياتي .. إني أنهي وأقظي وأخلص على إشي اسمو فلسطين وكلاب فلسطين من خريطة العالم وأمسحهم مسح .. وأقظي عليهم قظاء مبرم .<br />وهاي هيه أمنيتي ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />11- اولا انا مش عارف شو بدي اقول عن الفلسطنية الصرامي اولاد الحرام مكاتل العشائر الاردنية الا خيرهم من لحم اكتافنا ولكو يا سقايط كيف تتجرأو انكو تجيبو سيرة الاردنية بلعاطل ما بكفيكو المطسا الي انتسطوها بالجامعة الاردنية من الزواهرة والخلايلة والخوالدة والخزاعلة وكل عشاير بني حسن انتي يا ديانا كرزون انك وحدة شرموطة وقحبة ومنيوكا انت وكل فلسطيني ابن حرام من شباب الاردنية وانت يا جرسون(كلسون) اصلا كل الزواهرة والعجارمة والأردن فوق راسك وراس كل واحد زي امثالك<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />12- اولا يا خواني انا عمري بحياتي ما عملت عنصرية لكن انتو (الفلسطنية *) الي بتخلو الواحد يعمل عنصرية لانكم اولاد حرام مشردين شغل لقلقة لعنكم الله وادام الاردنين فوق رؤسيكم دائما وابدا وتحياتي لعشائر الاردن كلها وسلا م *******<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />13- اولا يا خواني انا عمري بحياتي ما عملت عنصرية لكن انتو (الفلسطنية *) الي بتخلو الواحد يعمل عنصرية لانكم اولاد حرام مشردين شغل لقلقة لعنكم الله وادام الاردنين فوق رؤسيكم دائما وابدا وتحياتي لعشائر الاردن كلها وسلا م *******<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />14- احنا الاردنيين يا كلاااب نسيتو شو سوينا لكم يا كلاب يا فلسطينيين وكمان الي يقهرك مسوين زلام عندنا الكلاب تخسسسسسسسسسسسسسسسسسسسسسسسسسسسى شواربكم يا فلسطينيين يا مزبلة الشعب العربي وصدق اخي الي قال انه ديأنا كرزون اكبرررر شرررررررررموطه قحبه فلسطينيه منيوكه العن ابو زباب امها على ام كل فلسطيني مو عاجبه شباب الاردن واقووووووووووووله انه داعسين على راصكم يا كلاااااااب الارررررررررررررررررررررررردن اولا وشباب الاردن اولاااااااااااااااااااااا روحو شوفو بلادكو يا فلسطينيين الي الاسرائيليين قاعدين ينيكو خواتكم قدامكم وانتم زي القرون يا منايك جايين هنا تسووون زلام تخسسسسسسسسسسسسسسسسسسسسسسووووو يا عيال الخنزير يا عيال البقره ............. وشبااااااااااااااااااب الاردن اولا ... خاوا عن كل الفلسطينيين .....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />15- يا منيووكة ولك الي بركظو ورا السيارات هظوول فلسطيزية يا عايبة لإنو الأردنية والشكر لله مكرمين معززين مدللين ببيوتهم والفلسطيزية مدعوس عليهم وين ما كان سواء بالأردن وبفلسطيز وبسوريا وبلبنان وبمصر وبدول الخليج وبدول أوروبا وين ماكان مدعوس عليهم وبعدين إحنا ما نذلكم ليش بدنا نستنا عشان نذلكم ولكم إحنا ذليناكو ودعسنا على روسكو ونكنا بناتكو تشبعنا وبعدين إسرائيل أحسن منا يا عاهرة المنيح العترفتي انهم احسن منا طبعا ماإنتو بدكو مين يضل ينيك فيكو عشان هيك بتحكو أحسن منا .....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />16- انا بس حابب اوظح شغلة لكل العالم إنو الشاب الأردني بكون بدو يتجوز فلسطيزية على سنة الله ورسولو بس هما برظووش بتعرفو شو السبب عشان بحبو حياة المنيكة بحبو كل يوم ينيكهم زب غير عن التاني شوي يكون الزب طويل وشوي يكون الزب قصير وهيك يعني كل يوم زب عن التاني<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />17- أنا الصراحة أكره ناس بكرهم وبطيقهمش ولاحتى مستعد أطلع في وجهم الأجرب المعفن همه الفلسطيزيه .. سبحان الله كل ما أطلع بوجه فلسطيزي منيوك عرص ابن عرصه متعرص أخو تعريصه بنت قحب شرموطه عاهره داعره . بصيبني غثيان وبحس حالي بدي استفرغ وأراجع .. يخرب بيتهم هذوله البقر الجحوش الغجر النور البهايم . نفسي بتنسد نهائي لما أشوفهم أو إني ألمحهم بأي شكل من الأشكال .. خرا الخرا عليهم شو إنهم خراااااااااااااا<br />>;;>;;>;; وكيف صاروا من تحت أفظالنا اللي لابتنعد ولاحتى بتحصى !!! ترى والله يا سعودية أكثر ناس قرفنا منهم لهذوة الحثالة المرتزقة الخونه العملا الجواسيس اللي كلهم على بعظهم مش شايفهم !! هو حنا الأدرنيين .. يعني الله سبحان الله ( لا إعتراظ على حكمو ) بس هو جبلنا مجموعة من الوسخ والعفن والقذارة والحقارة والسفالة والنذالة والحيونه والهمجية والنورية والبجمية اللي مش طبيعية وكل إشي زفت ولا يطااااااااااق بالمره ونهائي !! وراح حاطو فينا وعطينا إياه .. وعلى مين راحت ياسعودية ؟؟؟ أكيد راحت علينا حنا الأردنيين .. وإجوا الفلسطيزية القواديين القحاب على بلدنا وخربوا فيها ونشروا فيها وسخهم وعفنهم بمختلف مناطة المملكة . مافي محافظة ماسلمت منهم ولاد المشلطات بالشوارع ودايرات على الكابريهات والديسكوهات والكازينوهات والبارات والخمارات والمراقص والنوادي الليلية .. يعني سعودية .. إذا بدك تلاقي الفلسطيزية فبتلاقيهم بهالأماكن (الكابريهات والديسكوهات والكازينوهات والبارات والخمارات والمراقص والنوادي الليلية .. الخ ) ترى سعودية أنا مابقول هالكلام من عدم !!!! كل واحد عارف حقيقتهم ومفظوحيين بكل مكان .. وأكبر دليل عنا بالأردن .. لما تروحي على لبنان نفس الإشي .. ولما تروحي على سوريا كمان نفس الإشي .. ولما تروحي على السعودية ( اللي هيه بلدك طبعاً ) .. ولما تروحي على دول الخليج بشكل عام ودون تحديد .. ولما تروحي على مصر .. ولما تروحي على العراق .. ولما تروحي بكل مكان بتلاقيهم بهااااااااااااااااااااااايم العادة ومفظوحيين هونه وهناك ..<br />فكيف بدك الناس تحترمهم وتقدهم وتسويلهم قيمة ومستوى .. لا يا أختي أنا شخصياً بتمنى إنو يحلو عنا الفلسطيزية ويطلعوا من عنا نهائي ويروحوا على بلدهم خلي اليهود ينكيوا بخواتهم وأمهاتهم وبناتهم وحده ورا الثانية ..<br />بعدين إذا ملاحظة معي إنو الفلسطيزية معروفين بسب الإسلام والدين والرسول ( صلى الله عليه وسلم وعليه أفضل الصلاة والسلام ) والذات الإلهية ( الله عز وجل * ) دون تفريق بين هذا وذاك .. فالكل بالنسبة لهم سواسية .. وما أحلاه من ساعة ومن لحظة لما يسب الفلسطيزي الله وربو .. هع \\\\\\\\\\\\\\\" هزُلَت\\\\\\\\\\\\\\\" ...<br />يعني ناس باعوا أرضهم .. وباعوا كل إشي بخصهم .. بعدين طلعوا من أرضهم وراحوا بكل هالدنيا وصاروا يلفلفوا فيها دولة دولة .. والدولة اللي تعجبهم يبسطوا فيها ويقعدوا فيها ومستحيل يتخلوا عنها .. ومنها أرظنا ( الأردن الغالي * )<br />>;;>;;>;; ع العموم هاذ اللي حكيتوا غيض من فيض .........<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />18- كس أمك يافلسطين كس أختك يافلسطين .. ينعن شرفك يافلسطين أبوكي على أمك يافلسطين<br />بدي أنيكك وأنيك بناتك ونسوانك كلهم . بدي أنيك أخت القدس أنا . شراميط منايك حيوانات عاهرات داعرات عرصات قحبات<br />ينعن أبو زلامك إذا كان فيكي زلام يافلسطينز (( طبعاً مافي كلكو مخانيث وشواذ وشغل لقلقه على الفاظي ))<br />ولكو ياحيوانات ياكلاب يانور ياغجر يابجم ياهوامل ياكسالى يااللي بعتو أرظكو وحطيتوها بظهور العرب كلهم ونحنا أولهم يابهايم العاده ! ولكو بعتوا أرظكوا . كس أمكو إذا كنتوا بتعرفوا إشي اسمو ((((((((((((((( وطـــــــــــــــــــــــــــــــــــــن )))))))))))))))))<br />الله ينعنكو من بين الناس والعالم . فظايح ومتخلفين وهبايل ....وانا من موقعي هونه بناشد الشباب ألأردنية إنهم يعنعن أبو تعريص كساس وبزاز وطياز وشفايف خواتهم للفلسطيزيه خخخخخخخخخخخخ<br />ولكو ع راس زبي كل فلسطيزي والهم ابن الممحونه العاهره الداعره الشرموط العرص اخو المطبلة المشلطة الداشرة الصايعة الفايعة بالشوراع اللي أمو بتنتامك من مليون مره ولكو روح شوف كس أمك يا ((( المشتاق لحور العين قال ابن فلسطيزي قال )) هعهع هعهعهع ولك كس أمك صار مغارة أصلاً كلكو على بعظكوا يافلسطيزية بتيجوش ظفر واحد أردني .. ولك خذ ظفري واقسموا نصين ولما تقسموا نصين اقسموا كمان نصين وإذا بتصير قد ربع اظفري .. هنيالك هنيالك .. عليك وعلى اشي اسمو فلسططططططططييييييييييز......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />19- يعني أنا مش فاهم .. إنتا ليش اله خالقك وخالق كل الفلسطيينة حمممممير وهبايل وبفهموش !!!<br />ولك بتعرف إنو أكثر واحد بنقهر منو وياريت لو إنو طالع بإيدي لأفشخ بعرظو وعرظ خواتو القحبات العاهرات الداعرات ..<br />ولكو أوسخ ناس = الفلسطينية .<br />أحقر ناس= الفلسطينية .<br />أكلب ناس = الفلسطينية .<br />أنذل ناس = الفلسطينية .<br />ألئم وأحقد ناس = الفلسطينية .<br />أشرمط وأقحب وأعرص وأنيك ناس وشعب = الفلسطينية .<br />أشرمط أرظ = فلسطين .<br />أكبر عدد للملاهي والكازينوهات والديسكوهات والبارات والخمارات وبيوت الشرمطه والدعارة = فلسطين ( وبالتحديد في رام الله وأريحا ويافا .. وعلى من حذا حذوهم ومشى على دربهم وشاكلتهم .. واكثر مرتاديها البهائي الواطي الخسيس أبو مازن الشرموط وشلتو .. إلا أن البهلول ( عريقات *) أكثر واحد بنيك بالفلسطينيات .. منتو معروفين شعب شراميط متعودين على هالشغلات .. عادي وطبيعي الأمر بالنسبة إلكو .... !! وماعلينا )<br />أزبل شخص= الفلسطيني ( مدعوس ع رقبتو وخاواااااااااااااااااا ) .<br />الكلب اللي بعوي وبنبح ليل نهار يعني 24 ساعة = الفلسطيني ( طبعاً مهو كلب \\\\\\\\\\\\\\\" Dog \\\\\\\\\\\\\\\" )<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />20- إلى أولاد الكلب الفلص الحيوانات الملاعين , الله يلعن فلسطين وأبو فلسطين , كس أمكم من ناس أكلب من كلاب , لما رحت الأردن هذي السنة ولما فازت السعودية على اليابان , وأن جالس أشجع بلدي الحبيبة السعودية (عاشت بلادي) شوية إلا ألاقي كم اردني وأنا متأكد مليون بالمئة إنهم فلسطينيين يرشقون سيارتي بالحجارة وشوية ألاقيهم يطيحون فيا ضرب إلين ما دخلت المستشفى ,ليش طيب كذا بس عشان ما عندهم بلد ؟؟؟ هذا دليل كبير على قهرهم وغيظهم الشديد مننا يعني<br />والله الحين رجعت السعودية وإني لما صرت الحين أشوف أي فلسطيني ودي أذبحه , أوسخ وأقحب ناس وخاصة الأولاد عندنا بالمدارس , والله ماخرب شبابنا غير أولادهم وبناتهم , ولا إحنا تقاليدنا السعودية أصيلة , أتمنى من مصر إنهاتضيق كمان وكمان على الفلسطينين خليهم يموتوا هالخونة الحقرا الكلاب المنايييييك المفتوحين بمعنى الكلمة حتى رجالهم عندهم غشاء بكارة , جنس ثالث وأنا ما عمري والله شفت أردني الا وكان عنوان الجود والكرم مع اني مو بدوي , لكنهم محترمين , ترى اللي يحب الفلسطينيين ربي يغضب عليه , واللي يكره الفلسطينين ربي يحبه لأنهم ناس منحطين سفلة , هذا الل حبيت أقولو وشكرا لكم , وأنا أقول لبنت السعودية بنت الكلب اللي جالسة تمدح بالفلسطينيين أقول لها انتي منخدعة فيهم , هذول منافقين بوجهين<br />ما فيهم خير , قالك كلنا فلسطين , روحي إنتي وفلسطيز حقتك , وشكرررا لك يا محمد نواف الحمد الله لأنك قلت كلمة الحق<br />على هذول الفلسطينين (الفلسطيزييين الكلاب) وما كذبت بأي كلمة عليه من الله ما يستحقون وشكرا لكم ......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />21- من يوم يومهم هالفلسطيزيين الخوانية المخانيث وهم سارقين بلدنا كس امهم على ام اللي يلحس ريولهم العفنة وعزك دام يالاخو الأردني اللي ماسح بكرامتهم الأرض ويالاخو السعودي اللي سماهم فلص وحتى الفلص وايد عليهم وعلى بو اللي خلفوهم ، والله العلي العظيم لو شوف فلسطيزي خواني ولد قحبة بنيج امه واخته ولاد القحبة لمن قتلوا الشهيد سيف غباس كس امهم وكس اختهم ويلعن ابوهم واحد بواحد ، ولو هم رياييل يطلعوا من الامارات ويردوا لفلسطيز مالتهم بلا ما هم سكارى وشمامين هيروين ومحسبين روحهم ف بلدهم يسبون كل الجنسيات الثانية والمدارس ضاقت من حقارتهم ولاد الخوانية القحاب .... وبسلامة كل نظيف ماسح فيهم الأرض .......<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مع تحيات البدوي ابن البادية (خليف العتيبي)"
