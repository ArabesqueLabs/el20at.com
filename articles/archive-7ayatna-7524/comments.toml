order = 444
subject = "الى البشارات"
author = "الياس خوري - معلول/الناصرة"
text = "هسة يا بشارات صرت اردني.. وصرت تحكي على اسيادك يا ساقط.. والا انسيت اصلك.. ترى اللي ما بعترف باصله ما اله اصل.. اصلك من الناصرة انت وكل عيلتك الهمل اللي ساكنين على طريق المطار وفي ام البساتين ونادي الجواد الان..<br />توزعت عائله البشارات بعد ان هَجروا من قرية معلول سنة 1948 فقسم منهم سكن في الناصرة وقسم يسكن في قرية يافه الناصرة<br />اليكم لمحة صغيرة عن قريتي اصل معلول.....التي ما زلنا نذهب مرة في السنة نحتفل في كنيستها بقداس عيد الفصح , ونزورها في فصل الربيع في حضن احراشها , ونمضي اوقاتا ممتعة...<br />تقع معلول غربي مدينة الناصرة على بعد 11 كيلومتر, ويمكن الوصول اليها من الشارع الرئيسي طريق حيفا بعد المجيدل بكيلومتر واحد,<br />معلول معناها \\\"المدخل\\\" او \\\"البوابة\\\" ترتفع 275 متر فوق سطح البحر, وادي الصفصاف يفصل اراضيها عن قرية المجيدل<br />كانت معلول من بين القري الاولى التي كان فيها مدرسة منذ سنة 1905<br />قرية معلول هي قرية مختلطة وتتكون من عدة عائلات مثل: علي الصالح, البشارات, سالم, السراحنة, عواد قط, حايك, معبوك....حيث كانت تربط العائلات علاقات ممتازة وحميمة ( حيث نراهم ايضا متجاوروا حتى عند هجروا من قريتهم ففي يافا الناصرة تسكن عائله علي الصالح بجانب عائلة البشارات , كذلك عائلة السراحنة مجاوروان لعائلة البشارات,<br />تميز اهل معلول بروح الدعابة اللطيفة<br />بلغ عدد سكانها سنه 1945 960 نسمة منهم 200 مسيحي<br />سقطت معلول في 16 تموز 1948 وهرب سكانها الى يافا الناصرة والناصرة, كما وهربت بعض العائلات الى لبنان وسوريا والاردن.......<br />هدمت القرية بكاملها ولم يبقى منها سوى اطلال المسجد والكنيسة والعين<br />المصدر: من قرانا المهجرة . تأليف: جميل عرفات"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

