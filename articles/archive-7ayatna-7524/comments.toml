[[comments]]
order = 232
subject = "فعلا الأردنيين هما أهل الشهامة والنخوة وليس كما قال الفلسطينيين"
author = "سعودي ينبعاوي"
text = "السلام عليكم ورحمة الله , أنا أبغى أبين بهذه الرسالة إنه الأردنيين الأصل فعلا هما أهل النخوة والشهامة والشجاعة والبطولة والعروبة الأصيلة , فعلا ما في بين السعوديين البدو والأردنيين البدو أي فرق , فهي نفس العادات والتقاليد البدوية الأصيلة , على كل أنا أبغى أوجه رسالتي لكل فلسطيني أبو فلص فلوصة مفلس إنه أوسخ ناس بالسعودية هما الفلسطينيين وهما سبب المشاكل الموجودة بالسعودية , مصيبتهم إنهم شايفين نفسهم وياخذوا حقهم بالقووووووة , وما يعجبهم العجب , وما يثمر المعروف فيهم , وكلهم أولاد كلب حقيريين لآخر درجة , ويا بالله علي إني أصاحب فلسطيني أبو فلص معفن محتل , الله يسامح الحكومة اللي استقبلت ناس معفنين زي هذول , الحكومة ما قصرت معاهم لكنهم زي ما هما , واللي فيه طبع ما يروح أبدا , على كل أنا بس حبيت أقول للأردنيين الأصل بس إنهم أحسن ناس فعلا شفتهم في حياتي وإنهم أشهم ناس والله يحفظهم وثاني شئ الحمد لله إنه الأردن جارة السعودية وانا رحت على الأردن ورحت بقصد السياحة , والأردن فيها طبيعة ربانية لاتوصف<br />وعلى فكرة الحين في أردنيين أصل زاروا بعض القبائل السعودية بغرض التعارف , ورحبنا فيهم أحسن ترحيب بلا كلام فاضي , قالك فلسطين , خليهم يروحوا على بلدهم ينقلعوا مفعنين وسخوا البلد بعفنهم ...<br />وأقول لبنت السعودية الكلبة إنه البدوي أشرف من ألف حضري , روحوا إنتوا يا الحضر مخربين البلد وكلكم طررررررررررررررررررررررررش<br />البحر معفنين زبالة وبقايا حجاج , روحوا شوفوا نفسكم , البدوي أشرف من كل الحضر ..."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

