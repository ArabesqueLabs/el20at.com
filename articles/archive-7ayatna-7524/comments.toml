[[comments]]
order = 2
subject = ""
author = "مهند جدعان"
posted = "2008-07-23"
text = "كان الاردن وسيبقى [يا وحش] حراسة وفي لاسرائيل وللصهيونية.. اطول خط مواجهة مع الصهاينة محروس برموش \"النشامى\" الذين باعوا الارض والعرض واجروا ارضهم للصهاينة 99 عاما..<br />الاردن [يا وحش] حراسة وفي لاسرائيل. هذا دوره وهكذا سيبقى الى ابد الابدين وينتهي الاردن بزوال اسرائيل العفنة فهما نظامان عفنان اوجد كل منهما لخدمة الاخر كخنجر مسموم في خاصرة الفلسطينيين والامة العربية"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211054927/http://ana.20at.com:80/20at/7ayatna/7634-12273.html"

[[comments]]
order = 3
subject = ""
author = "بدأت أكره هالموقع"
posted = "2008-07-27"
text = "تفووووووووووووو ووووووووووووو على موقع عشرينات<br />وين الادارة الوسخة ؟؟؟؟ وين الادارة ؟؟ حسبنا الله و نعم الوكيل فيكم الله لا يبارك فيكم<br />سب في الدين و الاعراض و بين الاخوة باب مفتوح للفتنة و الادارة تتفرج ؟؟؟؟<br />و الله يا عشرينات لا اقول الا حسبنا الله و نعم الوكيل فيكم و عسى ان تلقوا جزاءكم من الله .. يعني اي كلمة على موقعكم الوسخ على طول تتخذون اجراء .. بس الكلام على الدين و على الاعراض و على الاخوة مافي مشكلة خلوا الباب مفتوح و خلوا عداد الزيارات و عدد التعليقات يزيد !!!<br />حسبنا الله و نعم الوكيل"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211054927/http://ana.20at.com:80/20at/7ayatna/7634-12273.html"

[[comments]]
order = 4
subject = ""
author = "مها ابراهيم"
posted = "2008-07-29"
text = "سلام عليكم<br />أولا بحب أرد على الأردني اللي مع احترامي الشديد مش فاهم اشي في الدنيا اللي حواليه ،،، الفلسطينيه باعو أرضهم اه ،،لو انك مره وحده حاولت تقرأ في التاريخ كان ما حكيت هيك بس أنا بقلك اشي هوه صح لازم الفلسطينه يتبعوا معكم \" وأعرض عن الجاهلين وقل سلاما \" بس أنا حبيت أرد عليك عشان أفهمك شو الوضع بلكي فهمت شو بيصير حواليك ،، انا ما زعلت منك لا والله انا بس زعلت عليك ،، زعلت كيف انكم أتباع للملك تبعكم اللي باع فلسطين وكل دمارنا من تحت راسه،،، زعلانه انك جاهل وعمرك ما قرأت مراسلات حسين مكماهون ولا عمرك ما سمعت شو عمل الملك فيصل<br />احنا عارفين حالنا ومش رح أناقشك أكتر بموضوع أرضنا اللي راحت تحت تهديد السلاح والعنف والدمار،، مش رح أناقشك بانه في ناس طلعت من بلادها وتركت مصاريها في بيوتها لانها كانت حاطه أمل على الجيوش العربيه اللي جايه بعد يومين<br />مش رح أقلك مين اللي وقف الجيش الاردني والعراقي والمصري من انه يكمل قتاله في فلسطين ،،، روح اقرأ وشوف ،، ما تضلوا عايشين حياة البدو اللي مش فاهمين وين الدنيا رايحه<br />انا بس بدي أقلك احنا طلعنا بس بشرف بس عيب على اللي ببيعوا في أراضي الأردن لليهود ،، روح شوف قديش صارت نسبة الأراضي الأردنيه باسماء يهود في الوقت اللي ممنوع الفلسطيني االلي ما معه جواز اردني يشتري أرض ،،، اصحوا يا أردنيين يا نايميين وما تضلوا ماشيين تحت ملككم اللي مغميلكم عيونكم ومشيكم<br />روح شوف شو التسهيلات اللي بتنعطى لليهود في بلدكم وانتو نايمين ،،، بس شو بدي أقول<br />ما انتوا امه لا بتقرأ ولا بتكتب من وين بدكم تتعلموا هادا الحكي"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211054927/http://ana.20at.com:80/20at/7ayatna/7634-12273.html"

[[comments]]
order = 5
subject = ""
author = "محمد السروان"
posted = "2008-08-02"
text = "محمد نواف باختصار كس اختك ياابن الشرموطة الاردنية مع خالص الشكر لاختك مصيصة زباب الفلسطينية ولك الاردنيات بطلعو في باص القرية الفاطس و ريحتكم من ركوب الحمير الي هية حضارتكم تلويث للبيئة بوصلو المدينة يدورو على زبااااااااااااا ااااااااااااااا ااااااااااااااا ااااااب الفلسطينية بتعرف ليش يا ابن الزنا علشان انتو ما بتعرفو الى الجيش رجالكم كلهم بلجيش بتغيبو عن نسوانكم بلاشهر بطلعو على سدد المحلات التجارية علشان ينتاكو برجع الخرة منكم بلعب على طيز مرتة الي مطلقها عشريييييييييييي يييين مرة بقلها هييييييييي يامرة افتحي رجليكي بدي انيشك نيش هسع و العب عطيزش انا ما بدي اطيل الكلام اسئل امك مين ابوكككككككككككك ككككككك صاحب اي محل تجاري في الاردن يا ابن الزنااااااااااا اااا اااااا"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211054927/http://ana.20at.com:80/20at/7ayatna/7634-12273.html"

[[comments]]
order = 6
subject = ""
author = "محمد السروان"
posted = "2008-08-02"
text = "اللة ينصرك ياحمممممممممودة شكري يا قاهر الاردنين اولاد اصدقاء ازواجهم ما لقيت ارخص من البنات الاردنيات الحق يقال معلمات في مص الزبااااااااااا ااااااااااااااا ااااااااااااااا اب هادة الحلو فيهم خلي اخو الشرموطة الاردني يجيبلك اختة تمصلك ايرك وتحياتي الك ولاهل فلسطين ولكل شاب عندة كرامة لاخوانة الفلسطينين . وكس اخت احسن اردني خسيس عميل لاسرائيل تفووووووووووووو ووووووووووووووو ووووووووووووووو ووووووووووووووو ووووووووو عليكم متاسف يا اخوات العاهرات ازا بدي اسبكم اكثر بحكي يا اردنين تفووووووووووووو وووو ."
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211054927/http://ana.20at.com:80/20at/7ayatna/7634-12273.html"

[[comments]]
order = 7
subject = ""
author = "محمد السروان"
posted = "2008-08-02"
text = "انا فلسطيني وافتخر انا مابدي احكي كثير ومابدي ارد على الاردني المتعصب لانة جاهل مسكين بحكي المثل جاهرت العالم وغلبتة وجاهرني الجاهل فغلبني فلسطين ااااااااااااااا ااااااااااااااا اخ ما اغلى ترابك احنا العرب مش كويسين مع بعض مااشطرنا بس نشمت في بعض بدل ما تناصر اهل فلسطين يا جاهل لانة بلد عربي مسلم على الاقل روح دور على اصلك يا وسخ ان مش عنصري لاكن فلسطيني غصب عن رحمة شرفك واضيف الى معلوماتك انا من مواليد الاوسخ قصدي الاردن على فكرة مابدي تزعل مني ياجاهل ."
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211054927/http://ana.20at.com:80/20at/7ayatna/7634-12273.html"

