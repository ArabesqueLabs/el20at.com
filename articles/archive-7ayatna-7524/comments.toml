subject = "أنا فلسطيني , اسمي فلسطيني ......."
author = "فلسطيني أصيل (فلسطيني وكالصقر)"
text = "فلسطيني انا ، انا اسمي فلسطيني<br />نقشت اسمي على كل المياديني<br />بخط بارز يسمو على كل العناويني<br />حروف اسمي تلاحقني تعايشني تغذيني<br />تبث النار في روحي وتنبض في شراييني<br />جيال النهر تعرفني مغاورها وتدنيني<br />بذلت الطاقة الكبرى وقلت لأمتي كوني<br />صلاح الدين في اعماق اعماقي يناديني<br />وكل عروبتي للثأر للتحرير تدعوني<br />وراياتي التي طويت على ربوات حطيني<br />وصوت مأذن الاقصى يهيب بنا اغيثوني<br />والاف من الاسرى والاف المساجيني<br />تنادي الامة الكبرى وتهتف بالملايني<br />تقول لهم الى القدس الى قبلة الديني<br />الى حرب تدك الظلم تزهق روح صهيوني<br />وترفع في سماء الكون اعلام فلسطيني<br />وتهدر كلماتي تمضي فلسيطيني فلسطيني فلسطيني"
archived = "2009-04-05"
