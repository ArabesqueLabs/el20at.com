subject = "فلسطين وبس"
author = "فلسطيني وأفتخر"
text = "اولا مين غيرنا احنا الفلسطينيه اللي عمر الاردن يا اردني ياللي بتحكي اول شي وشوف عددكم وشوف عددنا وشوف انجازاتكم وشوف انجازاتنا وبعدين احنا اصلا لو نطلع من هالبلد كان بتخرب يا كبير بس والله ما زبايل غيركم"
archived = "2009-04-05"
