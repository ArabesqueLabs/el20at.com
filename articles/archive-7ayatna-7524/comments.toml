subject = "لك على راسي كل فلسطين الحبيبة وربي اروع ناس واشرف ناس بالكون"
author = "سوريا الاسد"
text = "يااردي ابل ماتحكي شي عن فلسطين روح شوف عيبك ياوسخة وتاني شي ياحبيبي فلسطين اشرف بلد بالكون وراح تضل والايام راح توريك اكتر مين فلسطين وحاجتك نباح متل الكلاب ياجرسومة هلال ابن سوريا الاسد<br />لو لم اولد سوري لتمنيت ان اكون فلسطييني تحياتي"
archived = "2009-04-05"
