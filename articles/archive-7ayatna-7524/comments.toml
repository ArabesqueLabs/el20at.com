text = "ولك انا بعرف انو الناس بتنخلق من الحيوان المنوي بس انت شكلو ابوك حاطط بلغمو في كس امك وطلعت اكبر بلغم بالعالم<br />انتو يا بكتيريا يا حشرة ردودكم مبينة من غل ومقهووريين ومش عارفين تردو انت ازا نايك كل بنات فلسطين انا يا حبيبي تركت كل بنات الأردن واجيت على امك واختك بس عشان ابدع واتفنن بمنيكتهم<br />ورووح كول خرا وادحش الصرماي بتمك يا بلغم"
