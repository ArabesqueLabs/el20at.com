text = "ولكو يا عالم افهمو انو الفلسطيزية مقهورين وحبيبي نواف الله ينصرك على كلامك والله انك انت الوحيد ابن ناس وابن حلال<br />وبعدين يا فلسطيزية الي مش عاجبك كلامي وبتحكي ليش بتقاوة على البنات يا بنت العاهرة ليش هو في شب فلسطيزي اصلن لو كان في شب فلسطيزي ما كان خليتو عايش على الأرض بس اشكر ربي انو كل الشباب الفسطيزي مخنثين عاشن هيك ما بنحكالهم كلمة والي حكت انو بنات فلسطييز هم اشرف واطهر بنات ولك انتي يا بنت النجسة جاي تحكي هيك انتي الي بعد ما تخلصي دورتك هاد ازا بتيجيكي لانو الشكر والحمد لله انو الفسطيزيات كل سنة عندهم ولد جديد قد ما بتناكو والله ما ببهمهم مين ينيكهم المهم شب ,,,,وقال كل بنت فلسطيزية عم بترد على التانية وبتحطلها تحية وشكر عاد بتلاقيهم كلهم ببيت دعارة واحد ومش شباب الي بتنيكهم لا هم بنيكو بعض لحالهم كل وحدة عندها عشر اصابع بتنيك فيهم عشرين فلسطيزية وازا احتاجو لمساعدة عندها الوحدة فيهم بزاز اكبر من القنبلة الذرية بتنيك فيها كس قد كس الدب وبعدين حبيبي نواف ولا يهمك انشاء الله كلامك راح ينتشر وينعمل في بس لما اشوف شب فلسطيزي بكل معنى الكلمة لانو كلهم مخنثين وازا لاقيت شب فلسطيزي بكون زبو نايك في كل بنات فلسطيز ومش بنات الناس وبس لا بكون نايم ولاد خالتو وعمتو وامو وخواتو"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

