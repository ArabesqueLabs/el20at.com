order = 507
subject = "ضع عنوان التعليق"
text = "قال الاردن بلد الامجاد<br />للي بحكي انو الاردن بلد الامجاد ولك الاردن اتفه بلد واحقر من انها تكون مملكة<br />ولك الله يرحم لما كنتو بدو رعيان واجو الفلسطينية وعملوكم بني ادمين يا رعيان يا تفه<br />ولك انتا وملكك ومملكتك ما بشتريكم ببصلة واحنا ما بعنا ارضا والله ما باعها الا الكلب الملك حسين وقرايبه ولك الهاشمية بريئين منكم ومن ملوككم الانجاس يا خون<br />ما تحكي عن الفلسطينية لانو اصلك بضل وسخ"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

