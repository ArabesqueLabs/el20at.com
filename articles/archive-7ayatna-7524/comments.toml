text = "والله إنك محترم وابن عالم وناااااااااس ..<br />على راسي إنتا والعموشيين كلهم سواء أكانوا داخل الوطن أم خارجه .. ( صدقني مابجامل لإنكو هيك فعلاً .. وناس أصحاب نخوة وشهامة وحمية وفزعة )<br />ولك يا محمد .. صدقني<br />لو كان هناك عنوان للأخلاق والكرم والشجاعة والشهامة .. فهمو أنت وكل آل العموش الكرام ..<br />وهلا بيك .. (وصب القهوة ياعليان لضيف الرحمان ) ههههههه<br />وشكراً<br />وبالنسبة للأخ >;>; عربي مسلم << صف على اليمين ^_^<br />وشكراً ،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،"
