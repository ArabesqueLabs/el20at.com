[[comments]]
order = 376
subject = "استغفر الله"
author = "استغفر الله"
text = "يا ويله من الله اللي فتح باب الفتنة بين المسلمين .. يا ويله من الله كل واحد بدل ما يوقف الشتايم و السباب زادها و زاد النار حطب .. اتقوا الله انتوا ما عندكم دين؟ ما تخافون من رب العالمين ؟؟<br />استغفر الله العظيم ..( و اذا خاطبهم الجاهلون قالوا سلاما ).. متى نطبق القرءان الكريم و نكون مسلمين بحق بدل ما نتفاخر بعروبتنا و وطنيتنا على الفاضي .. كل واحد منكم ما وداه فوق الا الاسلام ، و ليس للانسان شرف الا دينه ..<br />اتقوا الله و اتركوا العنصرية و الجاهلية هذي اللي قال عنها النبي صلى الله عليه وسلم (دعوها فإنها منتنة )<br />مافي داعي للاستمرار في الخطأ ، اتقوا الله و كل واحد يكفينا شره و يسكت"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 377
subject = "تحية للبطل مصطفى طلاس"
author = "عربي سعودي أصل"
text = "\\\"ياسر عرفات في تنازلاته لإسرائيل ، يشبه الراقصة الاستريبتيز لما تصعد عالمسرح بتشلح شيء من ثيابها<br />لكن الفرق بين ياسر عرفات والراقصة الاستريبتيز ، أن الراقصة كلما شلحت شيئا بان جمالها ، أما ياسر عرفات فكلما شلح شيئا بان قبحه<br />ياسر عرفات في البيت الأبيض كالكلب الأسود ... كالقط الأسود لا يجرؤ هناك على المواء بكلمة واحدة من أجل فلسطين أو القدس<br />طيب ليش يا ابن ستين ألف كلب<br />يا ابن ستين ألف شرموطة<br />لا تلد القحبة إلا قحبا\\\"<br />تحية لصاحب هذه الكلمات الخالدة وزير دفاع سورية الشقيقة سابقا (العماد مصطفى طلاس) الذي فضح الخائن النجس ياسر بعرات بن خرفات بن قرفات وعراه بالزلط ...."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 378
subject = "لا حول ولا قوة إلا بالله العلي العظيم"
author = "ابن فلسطين"
text = "السلام عليكم , طبعا إلي يمكن أكتر من ساعتين جالس عم بقرأ بالردود الوسخة التافهة , وبصراحة الأردنية زودوها بكتير عن حدها ومن حق الفلسطينين طبعا إنهم يردوا عليهم بمثل هدا الأسلوب , على كل بس تبين إنو من ردود الأردنيين بأنها ردود تافهة وردود جبناااااااااااااااا بمعنى الكلمة , على كل وبدي أرد على الإماراتي الكلب اللي عم بغلط علينا , إنو فعلا ما عمر الإمارات غيرنا إحنا الفلسطينية , لأنو إحنا أي مكان بنروحوا بالعالم بنعمرو وبنعطيه من خبرتنا , ولا إنتوا يا دول الخليج أصلكو من فصلكو والله ما بتعرفوا تركبوا بالأصل سلك كهربا عشان تيجوا تتفلسفوا علينا ,إحنا شعب الجبارين , إحنا شعب كما قال أخي عيسى بارك الله فيه نصنع المعجزات , وفعلا اكتبوا بالبحث : الروبوت صناعة فلسطينية 100% , وشوفوا إحنا رغم كل اللي بسير , لكن إحنا الحمد لله راسنا دايما مرفوع غصب عن كل الناس , وإلى الكلب عربي سعودي أصل , ولك يا حقير إنتا ما بتعرف قديش ياسر<br />عرفات ناضل وجاهد وضحى من أجل تحرير فلسطين , جاي تتفحصن علينا يا بن الكلب , على كل كتر الكلام أنا بزهق منو , لكن<br />المرجلة فعلا يا أردنيين تكون وجها لوجه , مش من ورا الكمبيوتر وبالتخبيط والتطقيق على الكيبورد , لأنو هده شغل نسونة , بدي<br />مقابلة وجها لوجه (فيس تو فيس) وبوجه شكري الخالص برضو للأخ يوسف البحيصي , وشكرا لكل الشباب الفلسطيني من رجال ونساء دافعو عن بلادهم وأنفسهم , معلنين التحدي والصمود , وعراسي كل فلسطيني وفلسطينية سواء كان داخل الوطن أو خارجه , والسلام عليكم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 379
subject = "black.knight.1987@hotmail.com"
author = "انا فلسطيني عربي..ولاكن شاء القدر ..."
text = "بسم الله الرحمان الرحيم...<br />اول ما ابدأ بكلامي مش حتأخر عليكو كلها كم توضيح هام وبختصاز<br />اول شي فلسطين هي المجد وهي الحياه لكل انسان عرببي مع احترامي لكل الدول العربيه...<br />انا رح اكيها بكل صدق وافتخار انا انسان عمري 20 سنه اعاني من الكثير ولن يحس ما بقلي الا الله بكل فخر انا انسان عربي فلسطيني بكل معنا الكلي ولك شاء القدر وجعلني ان اكون من سكان عرب 48 لسى لاني ليس عربي ولكن هاذ اختيار الله ولن قدر ان نقول ايا كلمه بعد كلة الله...ولك انا اختي ساكنه في فلسطين الحبيبه التي تزوجت من عدة اعوام واني اشتاق لها كثيراً ...واقول لها ان قلب وروحي معها ومع بناتها التي ينبض قلبي لضمهما مثل ايا خال...وادعو من الله ان لا يحرم غالي عن غالي وادم لها اجمل واكرب باقه من الورود لها ولكل اسرتها...<br />عندي كمان طعليك على ما علقو الخوا...ان رح تضلو هيك كل واحد حامل سلاح لتاني ومثل قشت الكبريت الي بتستنى بشعلت شراره لتهيك على الجميع ..ما رح تتحرر فلسطين ولا رح تتجمع الايادي العربيه بيد وعلى فلسطيني واحد....<br />اتمنى من الله ان كل ما خطت يداي باحبار نازفه وبقدر القدر ان يكون ما بدالي قد اتاح لكم كل الفهم وان لا اكون اسئت احد الزائرين لكم مني انا الازف على اوطار الدوع اجمل التحيه وبالاخص صاحب الموضوع والموضع....شكرا ً لجيع"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 380
subject = "إلى أولاد القحبة إلى كل من يسب فلسطين و ناس فلسطين"
author = "يوسف البحيصي ( فلسطيني و الكل مقهور مني )"
text = "يا أولاد الكلب أبو عمار هو الرقم الصعب<br />أبو عمار هو رمز و مجد الأمة العربية و تاج رؤوسكم يا أوغاد<br />أبو عمار هو الذي شق الطريق لعزة العرب<br />أبو عمار هو الذي قاتل من اجل دماء العرب و من أجل الحرية و من أجل و من أجل و من أجل<br />أبو عمار هو الذي كان فدائيا في فلسطين و في جنوب لبنان و في أغوار الأردن و رجل سياسي<br />يا أخي استحوا على وجوهكم بتسبوا واحد سوالكم مجد و عزة و الله كل من يسب على فلسطين أو رجل من رجال فلسطين فو الله إنه يستحق لقب يهود العرب بكل فخر و اعتزاز له"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 381
subject = "رسالة إلى أبو عمار و إلى رجاله الفتحاوية"
author = "يوسف البحيصي ( فلسطيني و الكل مقهور مني )"
text = "حنا رجالك يا أبو عمار نعشق لف الكوفية<br />فتحاوي انت الزلزال<br />صوت الفتحاوي شلال<br />و في دمي روح الختيار قيدي يا ناري قيدي<br />أحلى تحية للأسرى لمروان البرغوثي<br />راجع لكتائب الأقصى و الفتحاوي ما يموت<br />و على راسي كل فلسطيني"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

