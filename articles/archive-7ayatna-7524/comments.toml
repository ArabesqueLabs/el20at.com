subject = "الأردن أولاً .. رغم أنوف الحاقدين الفلسطينيين ..."
author = "خالد الهزايمــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــة"
text = "آآآآخ يالقهر .. لهدرجة القهر بسوي هيك ؟!! والله ماهقيتها من الفلسطينية .. تراكو والله منتو عايشين بهالدنيا .. جايين تحكو عنا .. ولكو روحو شوفو الشرموط العاهر الداعر أبو مازن .. ولا العميل الجاسوس الغزاوي ابن المقطعه ابن المخيمات اليي مش لاقي يوكل حلان أبر خنيث بالعالم .. ولا بهلول عريقات ابن الغبيه الهبله الخوووووووثه الشرموطه المنيوكه .. ولكو شوفو أبو ردينه كس أختو ابن حماره حتى حكي بعرفش يحكي .. أي كس أمو ويلعن شرفو .. ولكو شوفو الزبالة عبد ربه .. اللي بقرط بالراااااااااء .. أبو لدغه .. يازلمه روح زبّط حكيك .. كس أمك أنتا الثاني أخو شرموطه منيكوه شلقه عاهره داعره .. ولكو أنتو ناااااااااااااس شراميط ورح تظلو هيك .. وأنتو مش وجه نعمه .. ولا أنتو وجه خير بالمره .. ولكو شفت ناس بحياتي كثير بس زي الفلسطينية عمري ماشفت .. وسخين .. معفنيين .. مدوديين .. أنذال .. واطيين .. وقحيين .. سفله .. مرتزقة .. الخ<br />ولكو ليجي يوم ونعلي الراية الهاشمية خفاقة فوووووق فووووووووق فوووووووووووووووووووووووووووق للي مايعرف حده .. ورح تصير فلسطين جزءاً لا يتجزء من أردنا الغالي .. وحنا رح نعلهم ونربيهم لهذوله الحوش البجم الغجر النور الزبايل .. ونلتقي ،،،"
archived = "2009-04-05"
