text = "إلى الحمار الغبي المتخلف المصرقعى تصرقع ابن العيبة الزانية لا تجيب سيرة الأردن على لسانك لا أقصو وأطعميه للكلاب اللي زي يك كلب يا واطي يا خسيس يا حقير يا أنذل الأنذال .. يلعن شكلك ( عرفتك من أسلوبك الغبي يا غبي !! )<br />أنتو كلكو دار خوري خرا بشريطة عرفت علي يا وصخ يا أجرب يا مقطع يا فلسطيزي ..<br />واحد وصخ معفن .. ولك روح الله لايبارك فيك ولا بكل آل خوري الشراميط .. ولكو يا أخوان بنات آل خوري كلهم صايعات فايعات مصرقعات قسماً بالله إنهم بتناكو منا حنا الأردنية ..<br />(( صلاح فايز بشارات ))"
