text = "عربي مسلم .. مش عارف ؟؟؟<br />هل اضحك أم أبكي ؟!<br />والله ناس فاضية ...<br />أنا مش عارف الصراحة ليش الواحد بعصب بسرعة من الفلسطينية ؟؟؟ ( أريد جواب من الأخوان *)<br />يمكن الأخوان يدرون .. بس أنا والله أجهل<br />لعل وعسى الواحد يصير يحترمكو <<<<< لا حول ولا قوة الا بالله !<br />الله يهدينا<br />ع العموم ،،،<br />كثرة الحكي مابتنفع ...................... لانو ذنب الجلب بظلو اعوج حتى لو حطوه بالقالب اربعين سنه !<br />وانتا هكذا يافلسطينية<br />انا لا ايد ان أحمل جمايل عليكو .. ولكن نكران نعمة وقضل الغير عليكو ( حراااااااااااااااااااااام بالمطلق *)<br />لإنو اللي بسوي خير عندكو بتعتبروه سوا شر !!<br />للأسف .. وأقولها \" للأسف الشديد \" .. في بعضكو ازفت من الزفت ( معلش لا تواخوني على الفاظي ولكن الساكت عن الحق شيطان اخرس *)<br />وانا قلتها ... ورح اظلني أقولها لحد ما الله يوخذ امانته .. أنو الأردن برغم كل إشي فيها .. برغم اللي سوته واللي رح تسويه ..<br />برغم الحقد الدفين اللي في قلوب الفلسطينية على الأردنيين -<br />بشكل خاص _ ( مش عارف ليييييييييييييييييييه ؟! )<br />وبرغم النظرة المجحفة اللي كلها كره وحقد وانانية اللي بلاقيها بعين الفلسطيني ( معلش أغلبية الشعب الفلسطيني هيك .. واذا مش كلهم .. مممكن تلاقيلك من بين 10،0000 واحد منيح * )<br />معلش .. المسامح كريم .<br />ورغم كل أشي صار ورح يصير بالأردن يعني<br />رح تظل الأردن اولاً ............... أولاً ................ أولاً<br />والحريـــــــــــــــــــــة للجميع<br />ع فكره اللي بدى بالمشكلة كلها واحد من عندكو ( لا على التعيين * كل واحد عارف حالو *)<br />انا ماعصبت .. وولا انقهرت .. وولا فار دمي .. وولا انزعجت .. وولا تضايقت حت !!!<br />البعض منكو ممكن يستغرب ويقول في نفسو كل هالمسبات وكل هالسفلنه ( وبعديك ماعصبت وولا انقهرت *)<br />انا لما أشوف مليون واحد قاعد عم بسب بلدي ووطني وكل اشي بخصني .. وأظل ساكت ( لا والله .. انا الصراحة إذا ماطلعت الل في بالي وقلبي بمووووووووووووووووووت * )<br />عيب<br />عيب<br />عيبع العموم ////////////// الردود موجودة فوق بأعلى الصفحة للي حابب يتأكد إنو الفلسطينية همه اللي بدو ..<br />وياحبيبي على تعليقاتهم<br />انا مقهور من شغله وحده ................<br />إنو يعني عيب هالكلام اللي قاعد عم بصير وعلى ولا اشي نهائياً !!!<br />يلا ........... الله كريم<br />واعذرونا ياســــــــــــــادة ،،،<br />صحيح اللي سبو علي بتعليقاتهم الأخيرة .......... شايفين كيف الواحد بفووووووور دمووووووووووووووو !!!!!!!!!!!!!!!!!!!"
archived = "2009-04-05"
