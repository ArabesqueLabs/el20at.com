subject = "الزم حدودك"
author = "إلى الأخ : الأردني صاحب أول تعليق"
text = "أولا يا أخ الأردني بدي أقلك أول إشي : كل خرة , تانيا : بتقول إنه الأردن بلد العزة والكرامة والشرف والنخوة , لكن بدي أزكرك إنه<br />أصل الأردن هي بلد البجم والبقر والنور والغجر والتشرد والتخلف والبدونة ,وتالت إشي : شو هي بطولاتكوا وتضحياتكوا ؟ وينها , عارف شو هي بطولتكوا ؟ هي مدبحة حسين (بديش أسبه عشانه ميت) بالضفة الغربية الحبيبة , هده هي بطولاتكوا , ويا حيوان يا واطي إنتا بتقول إنه الفلسطينيين باعوا أرضهم بإيدهم , الفلسطينيين باعوا أرضيهم بإيدهم ,؟ يا كلب الفلسطينيين وين ما راحوا عمروا العالم , شوف كيف صارت الأردن أحسن دولة في العالم , ليه , لأنه كل اللي ماسكها فلسطينيين , مش أردنيين بدو متخلفين زبالة حثالة مشردين , وبعدين إنتوا فيكوا صفات أوسخ من اليهود والكفار , العالم كلها تحضرت وترقت وتطورت وإنتوا لسة جالسين في خيام الشعر تبعتكوا , وبعدين ما في دولة في الوجود اسمها الأردن , فالأردن كلها هي صحراء فلسطين , والتاريخ<br />الإسلامي يثبت ذلك , فعشان هيك انطم واخرس يا عديم الأصل , واللي ما له أصل هما النور , فالحقيقة إنكوا نور أنور من النور<br />اللي عندكوا , على القليلة النور اللي عندكوا فيهم ناس تحضروا والله , مش زيكم , إلا تتبدونوا, الله يعينكوا على مخكم المتيس<br />مع التحيات : بنــ فلسطين ــت"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 100
subject = "إلى كل الفلسطينيين السفلة"
author = "الأردن أولا وستبقى أولا"
text = "إلى كل فلسطينيوا الأردن السفلة الناكرين لجميل الحكومة الأردنية معاهم , تذكروا إنه الأردن هي أول دولة آوت اللاجئين الفلسطينيين من كل الشتات , وتذكروا إنه الأردن أكرمتكم بإعطاء الفلسطينيين الجواز الأردني اللي هو أحسن جواز في العالم<br />وأنا بوجه رسالتي إلى الحقير فلسطيني غصب عن الكل وعاشق فلسطين وابن فلسطين وبنـ فلسطين ــت وعلى الفلسطينيين<br />كلهم بوجه عام , إنه كل الكلام اللي قلتوه كله كذب وافتراء , هذول انتم يا الفلسطينيين , ولكن إن شاء الله تحيا الأردن ويحيا عبد الله الهاشمي الأصيل ويحيا الشعار الهاشمي , وإن شاء الله رح تكون فلسطين كلها للأردن , إنتوا لو فيكم خير روحوا على بلدكم بدل ما تضلوا عنا هون , روحوا انقلعوا يا حيوانات من بلدنا , لا تغصبوا حالكم على العيشة عنا , الله يلعنكم ويلعن عرقكم الواطي الندل"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

