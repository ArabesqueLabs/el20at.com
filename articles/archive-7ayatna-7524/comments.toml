subject = "ضع عنوان التعليق"
text = "اكد رئيس الوزراء الاسرائيلي السابق ايهود باراك انه وفي طل جلساته مع كبار المسؤولين الاردنيين لم يحدثه احدهم عن ضرورة قيام دولة فلسطينية مستقلة غرب نهر الاردن.. وتابع باراك قائلا ان الملك حسين اكد له شخصيا انه مع وجود قوات اسرائيلية على نهر الاردن وليس وجود اي قوة فلسطينية حتى ولو كانت غير مسلحة.. وشدد باراك على ان هذا الموقف الاردني هو نفس الموقف الذي يتبناه النظام الاردني منذ تاسيس دولة اسرائيل"
archived = "2009-04-05"
