[[comments]]
order = 337
subject = "لاتعليق !!!!!!!!!!!!!!!!!!!!!!!"
author = "أردني أبوي وأمي فلسطينية"
text = "إلى إخواني الأردنيين : الفلسطينية ما عمرهم كانوا أنجاس كما تقولون ،،، هم أهل نخوة و أصالة و تاريخ ... لاكن ربما أنتم ترون بعض الفلسطينيين عديمي المبادىء و المتعصبين كما يوجد أردنيين متعصبين كما رأيت في التعليقات أعلاه ...<br />أنا لا أقول هذا الكلام خوفا من فلسطيني أو أردني و الأصيل ما عمره هاب منية ... إنما أقوله للعقلاء ...<br />لماذا نرى دول الخليج تتوحد و تتعاون و نحن الأشقاء و ربما أكثر من أشقاء فهناك بعض العشائر من نفس الأصل موجودة في كلا البلدين و انا أولهم ... لماذا نرى أنفسنا متعصبين و متخالفين ...<br />دول الخليج تتعاون ... و دول المغرب تتعاون ... إلا الفلسطيني و الأردني ما زالوا (نقرهم من نقر بعض) ...<br />أنا أدعوا كل أصحاب النخوة و الشهامة بأن يجيبوني و يفهمونني لماذا ما زلنا نتخالف ...<br />أتدرون في الخليج ماذا يقولون عن الفلسطيني و الأردني ... إنهم يشمتون بنا نحن الشعبين لكثرة و إستمرار خلافتنا ...<br />فإستيقظوا من غفوتكم قبل أن تغرقوا في النوم ... و خوفي أننا غرقنا !!!<br />رسالة إلى الأخ محمد نواف الحمدالله .. عيب يا أخي أنتا عارف وأنا عارف وكل أردني وفلسطيني عارف حالو .. فعيب عليك هالحكي .. كلنا حبايب وأخوان وأهل ومافي إشي بينا يعني<br />وبعدين إحنا ( الأردن وفلسطين ) شعب مو شعبين هيك علملنا أبو حسين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 338
subject = "ما ضل على الطيز ريش غير مفعوص الذنب"
author = "عاشق فلسطين"
text = "يا أخ محمد نواف الحمد الله , إلك فترة كبيرة بشوف ما بتخش على الصفحة هون , لكن حبيت أخدمك خدمة حلوة وهي كيفية علاجك من مرضك الخبيث , أولا حبيبي , طريقة العلاج سهلة جدا وما بتوخد معك غير ممكن 10 دقائق بالكثير يعني , على كل هدي هي محتويات العلاج كالتالي :<br />1- وجود الحمام (هدا إذا كان عندكو حمام أساساً) .<br />2- وجود المرحاض .<br />3- وجود بعض الخرى في المرحاض والأفضل يكون إسهال .<br />4- تحضير الملح الإنجليزي .<br />5- وجود زيت الزيتون وبعض الأعشاب الطبيعية (آه الأعشاب تكون من مزرعة خرفان يعني بالعربي : برسيم) .<br />6- وأخيرا : تحضير كوب من القهوة التركية الساخنة وليسة العربية .<br />طريقة التحضيبر :<br />أولا يا محمد نواف الحمد الله لازم تدخل راسك على المرحاض وحتى منظرك رح يكون زي البغل (حتى البغل أحلى من وشك)<br />وبعد هيك تشوف وتتأكد من الخرى إنو يكون عليه شوية حبات سمسم ويكون لونو مخضر على الأخير وتكون ريحته نقية جدا يعني<br />منك تكون ما فيه عليها ولاشخة ولا غيرو , ثانيا , بعد ما تتأكد حبذا تكون الخرية (الككة) ناشفة بعدين تحط عليها زيت زيتون<br />وبعد هيك بتنشفها تاني مرة وبتحط عليها الأعشاب , وبعد هيك حط الملح الإنجليزي على القهوة التركية , ثم اشرب القهوة بالملح الإنجليزي ثم قم بشرب القهوة , رح تحس نوعا ما بالغثيان , بعد هيك كل الخرية (الككة) واصبر هيك 3 دقائق حتى يستوي<br />الخليط بالقالب , بعد هيك حبيبي رح يقوم الدوا بإعادة تكوين مخك وأعصابك وتطهيرها من الشوائب وتصحيح الأخطاء الموجودة<br />بالرجستري الخاص بمخك المتيس , والعملية رح تستغرق ممكن 4 دقائق ونص , بعد هيك خليك جنب المرحاض , لأنو الخرية اللي<br />رح تنزل منك ما رح تتحمل التوقف , خاصة إنو زيت الفرامل في طيزك رح يكون مخلص , والخرية اللي رح تنزل منك رح تكون بقايا<br />الشوائب اللي كانت بمخك وأعصابك , هذا والله تعالى أعلم , وإن شاء الله العملية بتنجح وتدعيلي معاك"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 339
subject = "كلام الحاقدين على فلسطين وشعبها"
author = "عيسى ابو الدبس ..فلسطين الخليل"
text = "بسم الله الرحمن الرحيم...كلام يقال هنا وهناك..يسمع الكثير ..اراء تختلف ن شخص لاخر..وحقد عربي على الفلسطينين يزداد يوما بعد يوم..الكل يحلم بان يسكن فلسطين..فكل العالم تتقاتل من اجل فلسطين..البقعه الصغيره المقدسه دينيا فيها ستحشرون..الشهيد فيها باربعين شهيد..وفيها شعب الجبارين..كما وصفخا الرسول الكريم..نحن في فلسطين بغض النظر عن كل الخلافات نطمح دائما الى الاعلى للعودة للدولة مستقلة خاليه من اليهود ..نحن قلنا فيها لاننا نحن من يحمي تلك الارض وليس من يحميها هم الاردنيون..اقسم بان الشعب الاردني لو يعيش اسبوع واحد في فلسطين لتمنى الموت قبل ان يعيش..ولا ننسى بانك الملك حسين لعنه الله في قبره واتى من بعده عبد اللخ الذين يدعون انهم من سلالة النبي هم من باعو فلسطين وتامرو على شعبها ولا تنسو ايها الاردنيين بان لولا الشعب الفلسطين اوقف العدو في معركة الكرامه لرايناكم تحت وطات اليهود تصرخون وربما تكونو قد رحلتو جميعا عنها وتركتوها ..فانتم لا يهمكم سوى فقط ان تحضرو الحفلات الماجنات والرقص والسكر والعربده..ولا تنسو جميعا انكم في الاردن حرمت عليكم مخيمات تافلسطينين فانت لا تستطيعون الدخول اليها رغم انفكم وانف كل من يتكلم عن فلسطين بلد الدين ولاسلام والسلام والمحبه والتسامح..فيها شعب لا يذل يدافع عن شرف الامه العربية في كل مكان تراه هنا في فلسطين وهناك بالعراق وهناك بافغانستان ولبنان وسريا ماذا تنظرون ايها العرب اما كفى سكر اما فاق ضميركم اما تحركت فيكم النخوة والرجوله الى متى ستبقون بلا حراك خاضعين للعدو محكومين لهم فكل الدول العربية محتله وشعبها لا يستطيع الكلام فمن من الشعوب العربيه لديه حرية غير الشعب الفلسطيني..ولا تنسو بان الشعب الفلسطيني هو افضل شعب عربي وعالمي يتقدم مع التقدم المستمر ويواكب العصر ولو خلقت له الظروف لوجدتوه من اقوى دول العالم<br />في النهايه رسالة الى كل اردني<br />اذا كان الشعب الفلسطيني هو شعب كما وصفتموه فهذا لان الاردن تقوم على اقتصادهم فالشعب الفلسطيني اذا سحب امواله من الاردن انتهت الاردن وانتهى شعبها فهي تعيش على خيرات هذا الشعب الرائع المكافح<br />مختصر الكلام<br />دع الكلاب تنبح كما تشاء.... ففي السماء رب يرى العباد<br />يحاسب ويراقب وبنظر الى...كل انسان وكل لسان يتكلم الظلم والافتراء"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

