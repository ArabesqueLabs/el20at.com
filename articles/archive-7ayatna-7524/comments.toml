[[comments]]
order = 324
subject = "كس أمكم يا فلص يا كلاب يا قحاب يا ممحونين"
author = "سعودي والنعم"
text = "إلى أولاد الكلب الفلص الحيوانات الملاعين , الله يلعن فلسطين وأبو فلسطين , كس أمكم من ناس أكلب من كلاب , لما رحت الأردن<br />هذي السنة ولما فازت السعودية على اليابان , وأن جالس أشجع بلدي الحبيبة السعودية (عاشت بلادي) شوية إلا ألاقي كم اردني<br />وأنا متأكد مليون بالمئة إنهم فلسطينيين يرشقون سيارتي بالحجارة وشوية ألاقيهم يطيحون فيا ضرب إلين ما دخلت المستشفى ,ليش طيب كذا بس عشان ما عندهم بلد ؟؟؟ هذا دليل كبير على قهرهم وغيظهم الشديد مننا يعني<br />والله الحين رجعت السعودية وإني لما صرت الحين أشوف أي فلسطيني ودي أذبحه , أوسخ وأقحب ناس وخاصة الأولاد عندنا بالمدارس , والله ماخرب شبابنا غير أولادهم وبناتهم , ولا إحنا تقاليدنا السعودية أصيلة , أتمنى من مصر إنهاتضيق كمان وكمان على الفلسطينين خليهم يموتوا هالخونة الحقرا الكلاب المنايييييك المفتوحين بمعنى الكلمة حتى رجالهم عندهم غشاء بكارة , جنس ثالث وأنا ما عمري والله شفت أردني الا وكان عنوان الجود والكرم مع اني مو بدوي , لكنهم محترمين , ترى اللي يحب<br />الفلسطينيين ربي يغضب عليه , واللي يكره الفلسطينين ربي يحبه لأنهم ناس منحطين سفلة , هذا الل حبيت أقولو وشكرا لكم<br />وأنا أقول لبنت السعودية بنت الكلب اللي جالسة تمدح بالفلسطينيين أقول لها انتي منخدعة فيهم , هذول منافقين بوجهين<br />ما فيهم خير , قالك كلنا فلسطين , روحي إنتي وفلسطيز حقتك , وشكرررا لك يا محمد نواف الحمد الله لأنك قلت كلمة الحق<br />على هذول الفلسطينين (الفلسطيزييين الكلاب) وما كذبت بأي كلمة عليه من الله ما يستحقون وشكرا لكم ......"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 325
subject = "ولا رابط حضرتك اشتغل معي غير تبع غزة والتفاصيل تحت"
author = "عاشق فلسطين الأبية"
text = "أولا حبيبي : اهل غزة مش فاضيين إلك يستعرضوا بأجسامهم , هده وحدة أردنية شركسية شرموطة بعجلون , فاهم يا حيوان ,<br />وبعدين ليش باقي الروابط ما اشتغلت ليه , هدا دليل على إنك واحد حيوان مقهور مغلول , فاضيين إلك أهل فلسطين يطلعوا عورتهم الناعمة الحلوة , روح انصرف يا كلب وكل الأردنيين كلاب أولاد كلب وسفلة ومنحطين وحقيرين وتافهين ومخريين ومخزيين ومتفوف عليهم ومدعوس عليهم طول عمركوا كلاب وشراميط , روحوا شوفوا بناتكوا واحد فيه مقطع فيديو لسعودي بدوي مع أردنية بدوية اسمها رانية , الممحونة رانيا فرحانة مع السعودي عشان جالس بعطيها فلوس , هدول إنتوا شغل ممحنة وقلة أدب , الله ياخدكم يا أكلب ناس على وش الأرض , والله شكلي خرفت , ولكوا إنتوا على أكبر خرة على الأرض ,<br />عشتي يا فلسطين يا موطن السناء والسلام , عاشت فلسطين : من الفاء إلى النون ومن النهر إلى البحر<br />بـــــــ أردن ـــــــــــــــلا بلا خرة يلطكوا إن شاء الله يا أولاد الكلب والحرام صرتوا تعرفوا تحكوا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 326
subject = "رانيا الفلسطيزية تقصد"
author = "مشتهي نيك الفلسطيزيات"
text = "الظاهر إنه في حجب لليوتيوب بفلسطيز لأنه من كتر فضايحون مش دارين عا حالون قاموا نازلين حجب بالمواقع ، اللي بتسميها عورات ناعمة بتكون لحالها فضيحة بجلاجل يا فلسطيزي يا ابن القحبة ، وقال شو؟ عورات ناعمة وحلوة هاد معناه إنه فعلا الفلسطيزيين شراميط ولاد ممحونة ، وبعدين لو قصدك على رانية الفلسطيزية اللي عاملين منها ملكة بالغلط ، منقول لأبو حسين يطلقها ويدعس عليها وعالفلسطيزية اللي جابوها هههههههه ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 327
subject = "أنا متأكد إنو هدا إسمك المستعار الجديد يا محمد نواف الحمد الله"
author = "عاشق فلسطين"
text = "انا متأكد إنك محمد نواف الحمد الله يا كلب يا واطي يا شرموط يا مفتوح يا بن الستين شرموطة كمان , شكلوا اللي بكتب واحد ما هي مبينة الشغلة مانتا إلك اسمين : الأردني ومشتهي نيك الفلسطيزيات , طب ليه مش مشتهي نيك الأردنيات , لأنهم معفنين متلك يا كلب يا كلب يا بن تسعمية كلب وأصلك أكلب من كلب إنتا والجرادنة , مشتهي تنيكهم عشانهم ما بعطوك وش , أولاد حرام سرف , على كل بحبش كتر الكلام لأنك واحد مخلول مجنون متخلف معوق منفصم الشخصية منحط تافه سافل واطي , وأنا متأكد إنو هده شرموطة أردنية شركسية يمكن بدوية كمان شو بعرفني , الملكة رانيا بعيد عنها هدا الإشي , مع إنها حقيرة لأنها نسيت فلسطيتينيتها ووطنيتها وهويتها الفلسطينية الأصيلة , وماتت في شي اسمو الأردن (الجورذن) هي بكيفها , وكل الأردنيين إلا من رحم الله خرة وقحاب والشواذ منكو كتير , خلاص أنا بديش أضل أتكلم وأنبح في صوتي , ورجااااااااااااااااااااااااااااااااااااااااااااااااااائي من كل الفلسطينيين والفلسطينات هون يسيبو هده الصفحة الموسخة بوسخ وأرف الأردنيين للأردنيين الكلاب الشراميط السرابيت الصعاليك , رجاءاً يا الفلسطينين لا تخشو على هاي الصفحة , أنا بنفسي رح أحلف يمين ما أخش هون خلاااااااااااااااااااااااااااااااااااااااص بس في النهاية إلي كلمتين أخيرة بس :<br />أجرب شعب وبلد بالعالم الأردن<br />أخرى شعب بالعالم الأردن<br />أسفل شعب بالعالم الأردن<br />أندل شعب بالعالم الأردن<br />أوطى شعب بالعالم الأردن<br />أوسخ وأقذر شعب بالعالم الأردن<br />أخون شعب بالعالم الأردن<br />أعفن شعب بالعالم الأردن<br />أحط شعب بالعالم الأردن<br />أحقر شعب بالعالم الأردن<br />أرذل شعب بالعالم الأردن<br />أكلب شعب بالعالم الأردن<br />أحون شعب بالعالم الأردن<br />أبقر شعب بالعالم الأردن<br />أحمر شعب بالعالم الأردن<br />أبغل شعب بالعالم الأردن<br />أكبر شعب متخلف بالعالم الأردن<br />أنيك شعب وبنات بالعالم الأردنيات الأصل<br />أمحن بنات بالعالم الأردنيات الأصل<br />أشرمط بنات بالعالم الأردنيات الأصل<br />أكبر زاوية قائمة بالطيز بالعالم هي أطياز الأردنيين<br />أكبر كس مفتوح الكس الأردني<br />هيييييييييييه جرادنة يا زبايل المجتمع وآخر كلمة إلي خلاص : (تحيتي للغالية طبعا بنت فلسطين) :ـ<br />يا خروات<br />يا زفتات<br />يا طيزات<br />يا خريات<br />يا شخات<br />يا فسوات<br />يا ظرتات<br />يا معرصين<br />يا نور<br />يا احقر ناس<br />يا حاقدين<br />يا ككة<br />يا شراميط<br />خخخخخخخخخخخ<br />يا اغغغغغغغغه<br />يا شخخخخخخخخخة<br />يا منيوكيين ( على ما اعتقد الجمع صح )<br />خخخخخخخخخ<br />تسلمو حبايبي الفلسطينييييييييييييييين<br />((((طبعا هاد كلو بنطبق على الأردنيين الأصل , وليس على الأردنيين من أصل فلسطيني , طيب شباب , يلا سلام))))<br />وشكرا لكل حبايبي الفلسطينيين والفلسطيينيات اللي أفحموا الأردنيين الأصل البجم الهمج النور الحوش التيران الحمير البغال"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 328
subject = "فلسطينية وبفتخر واللي مش عاجبو يوكل خرى وينتحر ويكتب بعد هيك على قبرو : ميت من القهر والغل والغيظ , حاولت أتحدى فلسطيني جدع وما قدرت"
author = "بنوتـ فلسطينية حلوة ــة"
text = "يا سلااااااااااااااااااااااااام عليكم يا الأردنية , صرتوا والله تعرفوا تحكوا , تعلمتوا كيف تحكوا وتتكلموا وتتحضروا كمان , عاملين حالهم آل ب<br />بتكلموا راقي , والله يمكن ليوم الدين مابتتحضروا , لأنو البداوة الخرة متأصلة فيكو , وشكرا كتير للأخ عاشق فلسطين لأنو كلامو كتير<br />مفحم مفحم بمعنى الكلمة , وفعلا هدي هي الصفات الموجودة بالأردنيين الاصل فعلا ما كذبت والله , والسعودي الكلب اللي جالس<br />بغلط علينا , الفلسطينييين ما ضربوك وطلعوا روحك إلا أكيد حكيت عليهم كلمة وسخة , لأنا إحنا ناس ما بنرضى الإهانة , حسبي الله ونعم الوكيل , والروابط الموجودة , متل ما قال الأخ عاشق فلسطين شكلها اللي مش من غزة , هي والله فعلا من عجلون أو الكرك شكلها أردنية شركسية , وتحدي كل التحدي إنها تكون فلسطينية , تحدي تحدي تحدي , والله بعد هيك ما رح أدخل هده الصفحة ابدا ورح أمسح اختصار الموقع من سطح مكتبي , لأني خايفة الكمبيوتر عندي يتفيرس من أرف الأردنية اللي حايطينو<br />هون , لأنو وسخهم ولا أي برنامج مضاد فيروسات بشيل أبوه , لأنهم ملاعين , يلا سلاااااااااااااااااااااااااااااااااااااااااااام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

