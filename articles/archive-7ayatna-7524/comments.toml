text = "سلام للجميع .. تحية لكل كلام طيب و تحية لعدولك للحق و العقل يا عاشق فلسطين<br />شوفوا هذا اللنك رجاء http://www.20at.com/newArticle.php?sid=15804<br />بتقولولي شو هذا ؟؟<br />هذا الله يسلمكم يوم الخميس15/5 قرأت موضوع في عشرينات من احقر المواضيع منقول من موقع اسرائيلي ..يا للهول ..اي نعم منقول من موقع اسرائيلي و بكل بجاحة عشرينات حطت في العنوان \\\\\\\"نقلا عن الموقع الاسرائيلي الفلاني كيت و كيت \\\\\\\" بكل فخر يعني ّّ!!<br />و اليوم الاحد 18/5 دخلت فلقيت انه الموضوع محذووووف و لكنهم نسوا يحذفوا الرد الذي كتبته لهم !!!<br />شوفوا ردي في الموضوع في الاسفل ... طبعا بعد التشكيك في مصداقيتهم عشرينات حذفوا الموضوع راح يطلعلكم قف مكانك و الموضوع الذي تبحث عنه غير موجود !!!!<br />تسالوا عن شو كان الموضوع ؟ .. بكل حقارة موقع اسرائيلي يحاول يضرب بين لبنان و السعودية في هذه الازمة و يلفق تلفيقات و عشرينات بكل بساطة تسوي كوبي بيست للموضوع ... و كان العرب ناقصين شقاق<br />حقارة يا عشرينات ..<br />و الاحقر .. أنكم حذفتوا الموضوع يوم انا علقت و شككت في مصداقيتكم و نواياكم .. بينما في هذا الموضوع تم سب المسلمين اللي هم اخوان من كل بلد من الخليج للمحيط و الطعن في اعراضهم و الاستهزاء بالدين امام عيونكم و ما حذفتوا و لا سويتوا ... !!!!<br />يعني نفسكم عليكم اكرم من الاسلام و من الدول العربية كلها اللي تنسب و من الاعراض !!؟؟؟<br />اي شئ يمسكم تحذفوه و اي شئ يمس غيركم عادي!!<br />حسبنا الله و نعم الوكيل فيكم .. بس انا ما الومكم .. انا الوم الناس اللي تمشي على هواكم و مب شايفين حقيقتكم ..<br />انا ادعو الجميع عن التوقف عن السب و الطعن في بعض احنا مسلمين و اخوان و ياريت اي محاولة من واحد سافل لاعادة الموضوع للسب يا ريت يتم تجاهلها من الجميع ..<br />و ادعو الجميع لتوجيه كل الانتقاد و الهجوم على عشرينات في كل موضوع يضعونه ياريت بالمنطق نرد عليهم و نقرا ما بين<br />السطور لنكشف النوايا .. هجومي شخصيا على موقع عشرينات و لكن ان شاء الله بكل احترام لأني من اهل الاحترام و ما انزل مستواي لمستوى الموقع الحقير ..<br />ياريت تدخلون اللنك و تشوفون الرد و الموضوع المحذوف .. قبل ما حد فيهم يقرا ردي هذا و يحاول يصحح وضع الموقع الزفت<br />تحياتي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 401
subject = "مين جاي يتفصحن ويتكلم على الفلسطينين"
author = "ضفاوية ..... فلسطين الغالية"
text = "يا سلاااااااااااااام عليكو يا ارادنه يا جحاش يا معفنين يا نور يا زبالة يا حثالة يا بدو يا مشردين يا خرا يا حَــــــوَش , صار إلكو لسان يا سقطه تحكو على فلسطين واهلها وتسلمو حبايبي الفلسطينيه افحموهم والعنو ابوهم والي خلفهم وانسفوووهم وفجروهم ولا تخلو منهم ذارية على وش الارض لأنهم شعب واطي وجعان وساقط ومتخلف بصراحة ..... أنا فلسطينية بالضفة , ما تخافوش يا اردنية مش عايشة بالاردن الخرة ولا بدي اعيشش فيها اصلا من حلاوتها ما هي الادن اصلا فلسطين بلاش جدال وكلام فاضي<br />انا بصراحة اكتر ناس بكرههم وبكره اطلع بوجوهم الجربه المعفنة , ونتا يا ساقط يا بن الساقطة محمد نواف الحمدج الله عاملي حالك رجال عشان حكيت اكم كلمتين يا واطي يا بن الكلب يا عديم الشرف والنخوة . ولا ومين كمان ياربي يا دلوعة ماما اللي كاتبة انها ضد تقديش الشخص الفلسطني , آل بتأمن بالقضية الفلسطينية , وانتوا يا الارادنة شعب حقير وزفت ولا يطاق<br />ولسة دوبي داخلة على موضوع قال إقامة المملكة الهاشمية الفلسطينية الكبرى , وهي ضم الاردن وفلسطين تحت ولاية ومملكة واحدة , لأ طبعا بالاحلام الوردية هاي المملكة بدناش ياهم<br />ولا مين جاي كمان يتفصحن علينا , غير الارادنة من السعوديين والاماراتية , مش عارفة شو الحقد الدفين على فلسطين<br />لا حول ولا قوه الا بالله بس . وحسبي الله عليكو جميعا<br />ومين جاي كمان يعمل سورة على الفلسطينين , عارف إنك هيك يا حقير بتكفر بس عشان تقهر الفلسطينيين , بالعكس هيك إنتا اللي ماكل خرا على راسك وعلى راس اللي خلفوك , ما الفلسطينية أخدوا حسناتك كلها وكفرت برب العالمين عشان تقرهنا<br />لسة أنا جديده بالصفحة ولكن هاد هو تعليقي فقط لاغير , مش رح انبح صوتي واكسر اصابعي مانا مسحت بكرامتكو وبشرفكو وعرضكو الأرض والبلاط يا مطفسين يا معفنين يا مطفرين يا شحادين يا مشرشحين , مش ملاقيين يا خرا الا تحكو عن فلسطين<br />واهلها والفلسطينية أشرف منكو وبتتمنوا اصلا يا كلاب تكونو فلسطينية لانها فلسطين قمة الشرف والاصالة الأصيلة لعنة الله عليكو ليوم الدين<br />مع تحيات , ضفاوية ................ فلسطين الغالية , عاشت فلسطين , وطز بالباقي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

