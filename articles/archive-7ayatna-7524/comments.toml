[[comments]]
order = 112
subject = "أف : كل هدول الفنانين من أصول فلسطينية ؟؟!!!!!!!!!!!!"
author = "بنوتـ فلسطينية حلوة ــة"
text = "لا إله إلا الله , معقولة هدول الفنانين من أصل فلسطيني , حتى عمرو دياب من أصل فلسطيني ,والله كنا معميين , بس ليه طيب<br />ناكرين أصولهم , هدا اللي مزعلني منهم , حتى أغلب اللي بعملوا في قناة العربية والجزيرة فلسطينيين؟ حاجة غريبة والله بالفعل!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 113
subject = "نفسي في حاجة بجد تتحقق"
author = "أردني وبكل عزة وفخر"
text = "أنا والله نفسي لو إنه جلالة الملك عبد الله الثاني ابن الحسين المعظم حفظه الله لو إنه يصدر قرار بإلقاء قنبلة موقوتة وذرية على<br />فلسطين كلها لأنه شعب جبار وحقير وقذر وملعون , الملك حسين بن طلال الله يرحمه ما غلط لما ضرب الضفة في مذبحة أيلول<br />الأبيض مش الأسود زي ما بتسموها لأنه عارف شر هدول القوم البوم الفلسطينيين الملاعين أولاد الكلب والعرص , على كل إن شاء الله يصدر القرار هدا ويا ريت عن قريب , لأنه الجيش الأردني من أقوى جيوش العالم , وبقدرته دبح الفلسطينيين خلال ربع ساعة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 114
subject = "رسالة عاجلة إلى الأخ : أردني وبكل عزة وفخر"
author = "عاشق فلسطين"
text = "إنتا عارف يا كلب يا واطي يا جزمة إنه ايش مسكت الملك الخرة تبعكوا على الفلسطينين ؟ عشان خاطر مرته الملكة رانيا وهدا إزا كان عامل إلها خاطر أصلا , ولا هو بكره حاجة اسمها فلسطين وأنا بأيد كلام الأخ : فلسطيني غصب عن الكل لما قال إنه الملك عبد الله التاني حاطط عينه زي البومة على فلسطين , الله لا يحققله حلمه , طالع زي أبوه (الإبن سر أبيه)"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

