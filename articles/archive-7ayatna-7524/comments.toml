subject = "اذا خاطبهم الجاهلون قالوا سلاما"
author = "المشتاق للحور العين ( طبعا ابن فلسطين )"
text = "بسم الله الرحمن الرحيم<br />(( انما المؤمنون اخوة )) صدق الله العظيم<br />بس للاسف من ردود اخوانا الاردنييين ارى غير ذلك ولااعرف لماذا كل هذا الهراء الذى لايجدى نفعا ولاضرر ؟؟؟؟<br />بإختصار فلسطيــــــــــــــــــــــــــــــــــــــــــــــــــــن اولا واخيـــرا غصب عن الكل ؟؟؟ طبعا مشيئة الاهية مو بكيفى ..<br />لماذا ؟؟ لانها مولد سيدنا المسيح وارض الانبياء ومسرى حبيبنا محمد صلى الله عليه وسلم .... صلوا على النبى ولاتبخلوا<br />لانها ارض المحشر والمنشر ... شو يعنى ؟؟؟ يعنى ياعزيزى وعزيزتى هى الارض الى كلنا راح ننحشر فيها يوم الحساب يعنى ما فى غير فلسطين باقى للابد وهاد كلام الله ولا اريد مزايدة ياجاهليييين امور متل هااى ففلسطين ستحشرون بها جميعا شئتم ام ابيتم ... اما الان من قرائتى لردوكم وجدت انكم ضعفاء الشخصية وجاهلون ولاتعرفون اصلكم وفصلكم واخشى ان تكونوا لاااصل لكم بذاتكم ..... فحقارتكم فى ردرودكم والمزايدة على شعب فلسطين تثبت انكم انذال العرب بعاهلكم عبد الله وحسين الاسبق المزعوم كل منهم ولا اعتقد انه يعيش هانئ فى حياته الاخرى لانه قاتل الابرياء وحليف العملاء ... مش قضيتى هااى نتركها لرب العالمين .... يعنى انا لهلأ مش حابب ارد بأسلوبكم النتن الحقير<br />ولكن قرأت ايضا عن شخص يقول لماذا يجب تقديس الفلسطينى ؟؟؟ ياحبيب البى ماحدا بقول نقدس الفلسطينى اوك ...<br />ماتقدسوا بكفى تقدس الى خلقك وتكون مطيع على اكمل وجه ... بعدين مسبات فاضية انا مابحب ارد عليها لانوا يااردنيين لازم تعرفوا حقيقة انكم لااصل لكم لانوا مافى اردن ولا شى اسموا اردن وراجعوا تاريخكم ؟؟؟<br />كما انوا مافى شى اسموا كويت ... كما انوا معظم ارض سيناء ملك لفسطين ولكن من ان قسمت فلسطين اصبح لامثالكم وطن على حساب الاخرين او اسيادكم نحن .... يلا معلش ..<br />بعدين قبل التطاول على اهل فلسطين فإعلم ان شعب فلسطين شعب اصطفاه الله على هذه الارض لانه يحبه وابتلاه لان الله اذا احب قوما ابتلاهم ... رضينا بما كتبت لنا يارب العالمين ...<br />نرجع لقضية تقديس الفلسطينى شوى ... انا واحد من الناس انصحكم بتقديس الشهداء الذى تقدمهم فلسطين بسلوك منهجهم للدفاع عن الاسلام وليس عن بلادكم المزعومة وعلى علم انوا مازالت تحت احتلال موساد اسرائيلى امريكى ... روح ياابنى دير بالك على اهلك نصيحة منى الك يااردنى ....<br />والصفات الى بتحكوها فى اهل فلسطين كلها افتراء شخصى منكم مابدى ارد على تفاهات تتفوهون بها ...لانى بعرف اهل فلسطين وعايش بينهم ... نحن نقدم الشهداء اطفالا ونساءا وشيوخا وبناتا وشبان ولانبخل على الاسلام او الوطن طالما هذا نوع من الجهاد فى سبيل الله .. واقلكم مابدى منكم جهاد فى سبيل الله لانكم مش ائدوا ؟؟ فى جهاد الشيطان ونحنا بدنا نمارس جهاد المنافقين لانوا النفاق ظاهرة كفر والعياذ بالله اخشى ان تستمروا عليها<br />لازم تعرفوا انوا احنا هدفنا الاول العدو وحلفائوا مين ماكانوا وشوفوا التعيس عبد الله تبعكم حليف الشيطان ؟؟ اتمنى انوا يموت وادهس على راسوا هالحقير ...<br />الفلسطينين اهل الشرف واهل الطيبة واهل الجهاد والاستشهاد وهم احب الناس الى الله<br />كما انهم الصابرين والصامدين رغم الاحتلال والكره لهم من اسرائيل وامثالكم الحاقدين<br />والحمد لله احنا راسنا مرفوع غصب عن كل العالم .. لانا ابناء ياسر عرفات .. رمز الثورة العربية مو رمز خيانة متل بعض القيادات ... والفلسطينين مشاريع شهادة الى يوم الدين وفلسطين ارض البقاء الى يوم الدين ومافى اردن ياحج اردنى ... ههههههههه ... فاهم عليا اذن فلسطين ارض المحشر والمنشر والارض بتكون اتحولت لرماد مع كل العالم ..<br />ولماذا فلسطين دون البلاد الاخرى ؟؟؟ بلد مليانة مقدسات وارض الرسالات وارض الاستشهاديين والاستشهاديات<br />لك ياعمى لو بدنا نذكر شو فلسطين بخاف عليك ماتتحمل الصدمة ؟؟<br />بعدين بإختصار لكل الى بسبوا على فلسطين من صفات المؤمنين الى ربنا ذكرهم فى كتابوا وعباد الله الذين يشمون على الارض هونا و اذا خاطبهم الجاهلون قالوا سلاما معنى ماذكر فى كتاب الله واضح يعنى ما فى داعى نرد على جاهلين متلكم والفاظهم نتنة بذيئة حاشا لله ان ارد على كلام يسئ اللى كمسلم<br />ارجو من الفلسطينية التعقل فى الرد لانوا رغم تفاهة الاخرون فنحن صابرون وصامدون رغم انفهم<br />وشاء من شاء وابى من ابى والى مش عاجبوا يشرب من بحر غـــــــــــــــــــــــــــــــــــــزة<br />مع تحيات المشتاق للحور العين ابن فلسطين الابية صـــــــــــــــلاح فلسطينى وراسى مرفوع بدينى<br />ومافى داعى ارد على السفهاء الباقيين ... منهم محمد نواف والهزايمة المهزوم نفسيا والباقيين بعرفوا حالهم<br />سلام يا ال اردنييين ال ..."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 219
subject = "بنت فلسطــــPــــــين"
author = "بنت فلسطــــPــــــين"
text = "شو هاد الأردنية إنخزو من حالهم بطلو يردو لإنو ما عندهم كلام يحكو الجاهلين المتتخلفين المعااقين والنكت والله رهيبة مش طبيعية أساسا أنا كتير مبسوطة عشان الأردنية صارو مهزئة ومسخرة وممسحة ومضحكة الأرانب هدول الأغبياء اللي ما عندهم عئل أكيد بقرأو الرد وما بسترجو يكملو القراءة لإنهم المشرشحين الملطشة إتهزئو كتير فما بحبو يكملو قراءة الرد عشان ما يحمر وجهم وينفئع متل البالوون ومو بس وجهم والمرارة إنفجرت والزياادة إنخزئت يا حيوانات والله أنا بدخل على هاد الموقع بس عشان أتفشش بالأردنية لإنهم هما الملطشة الوحيد بالدنيا وبقبلو على حالهم يتهزئو الخنااازير-_-"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

