[[comments]]
order = 403
subject = "بدون وساخة عند جد يقربلك يا أردني بس بدون ذكر أسماء"
author = "مش ارددني الحمدلله"
text = "ولك من ايمتى يا أردني صار يطلعلك لسان و تعرف تحكي نسيت ملن اللي علمك عالحياة و جابك أصلا<br />اتذكر ولا يا ناكر للجميل قال أردني<br />مواصفات الشعب الاردني :-<br />1- شعب نكدددددددددددددددددددددددددددددد و الدنيا مش واسعة نكده<br />2- شعب بيعيشش بدون الواسطات مستحييييييييييييييييييييييييييييييييييييل<br />3- شعب نصاب كذاب سراق ولكم بتسرقوا من بعض<br />4- شعب ما عليه أمان أبدااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا<br />5- شعب قيل و قال<br />و شعب ( سبحان الله كلهم صاروا زلام ) ولد عمي و ولد عمتي<br />ولا زلمة فيكم انا ساكن بالاردن واللي مش شايف هالحكي بكون أعمى بعيد عنكم<br />والله شو هالشخص التافه ما عندك سالفة روح عالأقل انا رجل و أعرف أصلي مو زيك يجي الواحد<br />امه وحدة و أبوه 10<br />يللا سلاااااااااااااااااام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

