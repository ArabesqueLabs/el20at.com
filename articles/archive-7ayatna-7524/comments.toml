subject = "الأردن أولاً ,,,,,,,,,,,,,,,,,,"
author = "صلاح بشارات"
text = "\\\\\\\\\\\\\\\"ياسر عرفات في تنازلاته لإسرائيل ، يشبه الراقصة الاستريبتيز لما تصعد عالمسرح بتشلح شيء من ثيابها<br />لكن الفرق بين ياسر عرفات والراقصة الاستريبتيز ، أن الراقصة كلما شلحت شيئا بان جمالها ، أما ياسر عرفات فكلما شلح شيئا بان قبحه<br />ياسر عرفات في البيت الأبيض كالكلب الأسود ... كالقط الأسود لا يجرؤ هناك على المواء بكلمة واحدة من أجل فلسطين أو القدس<br />طيب ليش يا ابن ستين ألف كلب<br />يا ابن ستين ألف شرموطة<br />لا تلد القحبة إلا قحبا\\\\\\\\\\\\\\\"<br />تحية لصاحب هذه الكلمات الخالدة وزير دفاع سورية الشقيقة سابقا (العماد مصطفى طلاس) الذي فضح الخائن النجس ياسر بعرات بن خرفات بن قرفات وعراه بالزلط ....<br />هذا هو الخائن الاكبر والاول والأعظم للشعب الفلسطيني ...<br />هذا هو المتخلف الغبي الأهبل المصرقع تصرقع الذي حمل فلسطين ديون ما أنزل الله بها من سلطان !! قبل أكثر من عشرين عام كانت ديون فلسطين لاتتجاوز المليار ونصف المليار .. أما الآن وبعد موته ( الله لايرحمو ) تجاوزت الــ 60مليار دولااااااااااااااااااااااااااااار !!!!!!!!!!!!!<br />الله يعيطك العافية أبو مازن ( الإيراني ) والدكتور فياض .. وعريقات وأبوردينة وقريع وزكي ( ممثل حركة فتح بلبنان ) .. والحبل على الجرار<br />يسلم فمك يا عربي سعودي الأصل ,"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

