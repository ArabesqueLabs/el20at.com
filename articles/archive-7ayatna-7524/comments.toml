text = "أنتم أيها الأردنيون ( شعب إذا ضرب الحذاء بوجهه صاح الحذاء بأي ذنب أضرب )<br />مين قال إنو القدس هاشمية أصلا لازم ما تنسبو القدس لأرض الأنجاس<br />و كمان انتو يا أردنيين ما شاركتو في تحرير الأقصى بحجر<br />و لكو استحو على حالكم و روحو ادفنو حالكم أحسللكم بلاش عار على الأمة العربية و الإسلامية"
