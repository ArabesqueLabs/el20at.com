[[comments]]
order = 319
subject = "ماشاء الله تبارك الله"
author = "فلسطيني اصيل"
text = "ماشاء الله تبارك الله , الموقع صار مزاد علني على منتدى على إعلانات على كلو , شو هدا , يعني أنا لما حطيت هلا مووضوعاتي<br />كتبتها بس بدون سب وشتم حبيبي , كتبتها بكلام مفحم وبأدب عالي الحمد لله رب العالمين , لكن مش راضي الادب يجيب نتيجة<br />معكو , بس والله يمكن إلي ساعتين بالتمام بس جالس بقرأ في التعلييقات سواءا من الفلسطينين او الاردنيين بس والله عيب يعني<br />هاد الاشي عيب يصير يعني , وانا متأكد ليوم الدين عمرو الاردني ما بحب الفلسطيني , هكذا رباهم النظام الهاشمي وغيرهم من<br />مرتزقة النظام الاردني العاهر , لكن مش مشكلة , إنتوا اللي مااكلين خرى في النهايه يعني لانو الفلسطينين هناك عايشين بخير<br />وكل شي لكن انتوا اللي جالسين بتتغنوا بالحريات /, الاردن بلد الحريات Jordan < The country of Freedom<br />ولكن برجوا من جميع الفلسطينيين والفلسطينيات اللي هون يتعقلوا ويردو بكلام متلي عشان يفحموا هدول الاردنيين الذين<br />يسمون انفسهم بالنشامى وهم نشامى بالمسبات والشتم و ليس نشامى الوطن , مع تحيات : فلسطيني أصيل ,<br />قالوا عنك راسك مرفوع وعيونك جاويــة .. قلتلهم العفو كلنا ناس .. بس أنا :::: فلسطينــي ::::"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 320
subject = "بدي اذكر بشغلة تانية"
author = "فلسطيني اصيل"
text = "حبايبي , بدل ما تيجو هون يا أردنيين تسبوا وتشمتوا فينا تعالوا نسوي منتدى جديد بدل ما تضلوا تنبحوا زي الكلاب هون , أنا بعرف<br />أصمم مما نتديات وجاهز لتصميم منتدى بشرط ان يستعد له الفلسطينيين والأردنيين لمواجهة بعضهم بعضا وبدي أذكر صحيح إذا كان<br />يا الاردنين فعلا الفلسطينية منيوكة وعاهرة وشرموطة على قولتكم روحوا يلا جيبولنا مقاطع فيديو أو صور عاهرات فلسطينيات يلا<br />خشوا على المنتدى الجديد اللي رح اعملوا وحطوا فيه روابط بالهبل , ونشوف التحدي احنا ولا انتوا , تحدي واحد إزا لقيتو ابالاصل<br />رابط فلم سكس فلسطيني , روحوا حطوا روابطكو على افلام الشذوذ تبعتكم لما واحد بدوي من تبعكم وخاصة عشيرة التل الاردنية لما بشوفوا واحد حلو بروحوا يخطفوه بالصحرا عشان يروحوا ينيكو فيه , هدول انتوا , لا تضلو هون وان جاهز لتصميم منتدى ورح اسميه كمان منتدى بالجو يعني فلسطين والاردن ورح تكون الشغلة تحدي , وبتمنى من موقع عشرينات يروح يمسح كل هده<br />التعليقات بسرعة بدون توقف لانو خلاص هده الصفحة ما لها داعي ازا كان في منتدى جديد , تفووووووووووووووووووووو<br />على اصلكوا يا جرادنة واحد ورا التاني ( هدا إذا كان إلكوا أساسا اصل)"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

