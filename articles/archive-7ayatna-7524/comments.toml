text = "خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />خررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن , خرررررررررررررررررررررررررررررررررررررررررررررررررررررررة على الأردن<br />لعنـــــــــــــــــــة الله على الأردن الخرة وعلى الأردنيين كللههـــــــــــــــــــــم"
