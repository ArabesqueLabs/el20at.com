[[comments]]
order = 387
subject = "ارفع راسك إنتا فلسطيني ............."
author = "فلسطيني أصيل"
text = "في ظل الوضع الفلسطيني الحالي وهذه اللجّة السحيقة المظلمة والتي أصبح فيه الحليم حيرانا وتائها، مفتقدا لبوصلته نحو هدفه، مختلطة عليه الأمور، كان لا بد من تذكيره وإعادة بوصلته النضالية إلى وجهتها الصحيحة ووضع النقاط على الحروف. فالفلسطيني حقا له أن يرفع رأسه عاليا..، فهو أصبح مدرسة عالمية في فنون التضحية والمقاومة والفداء والذود عن الوطن والكرامة. أينما حل الفلسطيني لاجئا أو طالبا للعلم أو للرزق في دول العالم المختلفة، له رهبة وسطوة في الحق يعرفها حق المعرفة من عيون ونظرات من حوله في المطارات أو السفارات أو الأماكن العامة.<br />هتلر عندما كان يريد أن يزرع معاني الصبر والتحمل والتحدي في أفراد شعبه لتحرير الأراضي التي اقتطعت من المانيا بعد خسارتها للحرب العالمية الأولى كان يخطب في شعبه قائلا: انظروا للدولة العظمى بريطانيا والتي لا تغيب عنها الشمس، كيف مرغ انفها قلة قليلة من شعب فلسطين متحدين ومقهقرين للإمبراطورية العظمى..فارفع رأسك ..أنت فلسطيني.. ومنذ زمن وأنت مدرسة عالمية في التضحية والفداء.<br />حسن نصر الله الذي مرغ انف الصهاينة في التراب يجيب عن سؤال حول مقارنة المقاومة اللبنانية الباسلة بالمقاومة الفلسطينية بان المقاومة الفلسطينية هي من علمته فنون التحدي والصبر والتضحية وتطوير وسائل المقاومة...فارفع رأسك ..أنت فلسطيني.. وهذه شهادة لا تعادلها أي شهادة .<br />في مواسم الحج والعمرة وعند اختلاط الفلسطيني بغيره من الحجاج والمعتمرين من مختلف دول العالم، يتبرك الحجاج بالفلسطيني بالسلام عليه أو مصافحته وينظروا له بعين الاحترام والتقدير لصبره ومقاومته لاحتلال فاق كل من سبقه في الإجرام وأصبح مدرسة عالمية في الإرهاب وفنونه، ومقابل هذه المدرسة الإرهابية الصهيونية شكل الفلسطينيون بنضالهم وتضحياتهم مدرسة عالمية في الصبر والتحمل وتقديم التضحيات..فارفع رأسك ..أنت فلسطيني..<br />في إحصائيات كثيرة بينت أن شعب فلسطين من أكثر الشعوب تعليما وكفاءة في تصدير الكوادر العلمية المختلفة ولمختلف الشعوب والدول، فأرض الأنبياء ومنذ آلاف السنين تصدر للعالم وحتى هذه اللحظة نور العلم والمعرفة والأيمان لتبيد ظلمات الجهل والتخلف المتمثلة في تخلف الصهاينة ومن لف لفيفهم ومن أمثالهم العرب (الأردنيين) ..فارفع رأسك ..أنت فلسطيني..<br />أمريكا وضمن فكر الصهاينة الجدد يريدوا أن ينشروا طريقتهم وفهمهم للحياة متوهمين أنهم يملكون القوة الأخلاقية والفكرية لذلك، بعدما ملكوا القوة العسكرية المعربدة والمجرمة في مختلف أنحاء العالم، فكرهم هذا يترنح ويتخبط على أبواب فلسطين كونها تشكل رأس حربة ضد المشروع الغربي الأمريكي الصهيوني، فمدرسة فلسطين بما تملك من القوة الأخلاقية والفكرية يتعلم منها العالم الإسلامي والعربي وحتى فنزويلا وكوبا .. وتنهزم أمامها أفكار الصهاينة الجدد والفوضى الخلاقة ..فارفع رأسك ..أنت فلسطيني..<br />فلسطين هذه تحوي في جنباتها مختلف الأفكار والأديان والاتجاهات، وتجرى فيها انتخابات حرة ونزيهة بشهادة العدو قبل الصديق، كنموذج راق فاق حتى الدول الغربية في حرية الفكر والمعتقدات، فلا حجر على الأفكار، ولا عصبية لغير العلم والمعرفة والفضيلة والتطور وتحسين الأداء..فارفع رأسك .. أنت فلسطيني..<br />مع كل هذا الكم من الضغط الخارجي والتدخلات التي ليس لها أول من آخر، ومع ما حصل من بعض العثرات، كل ذلك ما هو إلا غمامة صيف سرعان ما تتلاشى وتتبدد وتعود المياه الى مجاريها، فشعب قدم مئات الآلاف من الشهداء والأسرى والجرحى وحركات قادت النضال الفلسطيني وقدمت خيرة رموزها وقادتها على مذبح الحرية، وما زالت قافلتها تسير بخطى ثابته نحو التحرير والدولة الفلسطينية، لن توقف مسيرتها بعض التشويشات هنا وهناك، فالأخوة مهما تخاصموا وعصبوا وغضبوا وكالوا التهم لبعضهم البعض، سرعان ما تطغى رابطة الدم والدين والأخوة والوطن على ما سواها وتذهب مرحلة وتأتي بعدها مرحلة أخرى فهذه سنة الحياة.. :::فارفع رأسك.. أنت فلسطيني::: .."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

