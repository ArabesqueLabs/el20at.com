subject = "الى سليل النجاسة البشارات ابو دم ازرق"
author = "رياض الاغوات"
text = "انا متاكد انه دمك ازرق.. لانه بالفعل سيكون طبعا بلون العلمين الاسرائيلي والاميركي.. هذان العلمان الذي يقبلهما اسيادك الذين يحكمونك وهذان العلمان الذين يرفرفان فوق رؤوسكم وانتم مطأطين يا شعب الخسة والنذالة..<br />دمك ازرق ايضا على لون فريقكم المسخ الفيصلي هذا الفريق الذي اوجده نظامكم واوجد فريق الوحدات ليلعب على وتر الاقليمية والعنصرية ارضاء لاسياده في تل ابيب.. هذا الفيصلي الذي جمهوره الساقط ابن السقايط حفيد السقايط الذين هتفوا لشارون ونتنياهو.. لانكم بالفعل اوباش ولا يخرج منكم الا الزبالة يا قحاب العرب.. يا ابناء سميرة توفيق مطربتكم الوطنية المفضلة ويا احفاد رهيجة وبهجت.. زمن رديء الذي يجعل من حثالة امثالكم يدخلون على الانترنت ويتهجمون على الشرف العربي الوحيد الباقي في هذه الامة وهو الشعب الفلسطيني المجاهد القابض على الجمر رغم تامركم منذ العام 1921 عليه والى الان والمسلسل متواصل في الغدر والخيانة.."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

