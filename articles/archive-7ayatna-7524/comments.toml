subject = "بدي أعيدوو"
author = "عجبني الرد"
text = "أولاً أنا بدي أوجه شكر وتقدير لكل من : - ( أردني والنعم ) و ( الأردني ) .. وأنا هونه بدي أقول كلمة وحده لهذولة الملقبيين بالفلسطيزيين .. يعني أنا مش فاهم .. ليش الواحد بعمل مع كل الناس خير وبساعدهم وبعاونهم، وبردوه بالمثل ؟.. إلا الفلسطيزيين .. بتعمل معاهم خير وبتساعدهم .. بروحو بقلبو ظدك .. وبصيرو مش معك بالمره . يعني فوق ما حنا مفظليين عليهم وعلى اللي خلفوهم وعلى كل فلسطيزي أجرب مقلعط مش لاقيله دفشة ولا دزه .. ويلا يلا تا شايف قدامو .. فعلاً !!! إنكو ناس حقرا وأنذال ووسخيين ومعفنيين وجرب ومفطسيين وهبايل وكلاب ولاد كلاب ولكو إنتو في دمكو الكذب والغش والحقد والنميمة والحقد والكره والضغينة واللئم .. الله مجمع فيكو كل وسخ وخره هالدنيا والعالم وحاطه فيكو .. سبحان الله !!! يعني الناس بتحاول إنها ( ه ) تحترمكو .. وتقدركو .. وتسويلكو مكانة ومستوى .. وإشي عليه القيمة والفايدة .. بس إنتو مامنكو فايدة بالمره .. يعني أنا الصراحة .. مش من طبعي أو حتى من صفاتي إني أسب سوى إنو شفت إنو فاظ الكيل .. والوعاء امتلا وصار لبرا .. فقلت فحالي وفنفسي صار لازم أتدخل وأسب وألعن وأفضحكو كلكو فرداً فرداً .. يعني أكبر دليل إنكو ناس شاطرة .. ومتفصحنه .. ورايقة .. وفاضية .. وماعندكو شغله ولامشغله . ولا حتى عمله .. إنكو نازليين سب فينا على ولا إشي .. يعني القافلة تسير والكلاااااااااااااااب ( اللي همه إنتو ) تنبح وتعوي ..!!!<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره فالتات ودايرات وداشرات بالشوارع ..<br />يعني والله أنا بشفق عليكو من شعب ماكل خرا من جميع الأصعدة والجوانب المختلفة . يعني شعب كس إمو من شعب شرموووووووووووووط .. قال رنتيسي وياسين وأبو عمار ( أبو حمااااااااااااااااااااااااااار ) .. وكس أخت أسماءكو كيف هيه !!!<br />إنتو اللي رح توكلو خراااااااااااااااا بالملعقة والشوكة والسكين ... وبالنهاية .. وكلمة أخيرة لكل أردني على وجه الكرة الأرضبة .. وووين ما كان .. بقلو وأنا هونه من موقعي ( الإمارات ) .. إرفع راسك لفوق لفوق لفوق وخليك عنيد وراسك يابس مش زي الحجر لأ أقوى من الحجر بكثييييييييييييييير .. وخلي عينك جاويه .. بتقدح شرارة .. قوية .. واللي بطلع فيك وخصوصاً إذا كان فلسطيزي .. مع إنو بسترجيش أو بالأحرى بقدرش أو إنو يحاول يرفع وجهو بوجهك .. وفي حال لو رفع شويه من وجهو الأجرب أخزقلو جوز عيونو .. وسوي براسووو خريطة العالم .. ونييييييييييييك خواته ال66مليون شرموطه وشرموطه .. ولاتنسى تنيك إمو ( لإنها هيه الأساس ) .. وبعد هيك إدعس بنص بطنو دعسة بنت كلب ( نصها موت ).. وشلحو أواعيه .. وافتح طيزو ونيييييييييييييييييييييييييكو لحد ما يغمى عليه ويطفي على الآخر . وبعدين كفين على الماشي ومرتبات يكونو على أكمن بوكس على شلوتين في زبو يخليه يبطل يخلف نهائي وبالمره .. وبعد هيك ( بدي أفرط من الظحك ) .. _ هذا إذا ظل عايش وعلى قيد الحياة وفيه روح وبتنفس _ .. على العموم شيك يعني .. هع هع هع ... وقلوووووووو بأعلى صوتك كالآتي :- ((( مظيع بوجهي شلن يا أخو العرصة ..... )))<br />ولكووووووووو .. نكناكو كثير كثيييييييييييييييييييييييييييييييييييير كثيييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييير .. وزهقنا من طياز وكساس وبزاز وشفايف وخدود بناتكو ونسوانكو يالفلسطيزيه .. وملينا منكو نهائي .. ومسحنا بكرامتكو وشرفكو أرض الأردن كلها/ ولفينا فيها شبر شبر .. ولعنا ظمايركو حى صفيتو بلا ظمير .. أي كس أختكو من متى كان عندكو ظمير .. يعني بالمشرمحي هزئناااااااااااااااااااااااااااااااااااااااااكوووووووووووووووووووووووووووو .. وخليناكو فرجه للي بسوى واللي مابسوى .. وعلكة بثم الجميع .. وسيرتكو وقصتو على كل لسان في العالم .. يعني خلصنا عليكو وقظينا عليكو .. يعني ياجهلة ( Game Over ) <<< يعني انتهت اللعبة ،،،<br />والأردن أولاً .. أولاًُ .. أولاً ..<br />وجيشنا جيش الوطن .. سمينا بإسم الله .. نحمي الوطن والعلم .. بعيون عبدالله ...<br />وبدي أشوف تعليقات الأردنيين النشامى ... اخزقوهم يانشامى الوطن .. ونيكو أعراظهم .. للي بلا شرف !!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 207
subject = "كٍس امك يا قرن"
author = "عآشق صفد"
text = "ولك كس امكيبن الشلف يبم العايبه<br />ولك انته اصلا ما عندك شرف لو انته زلمه بتدخل فلسطين<br />ولك ااصلا كل الاردن فلسطينيه داعسين ع كٍس امهاتكم<br />ولك احسن اردنيه عندكم بتكوون شرموووطه<br />بالله عليك كم واح ناك اختك وامك احكي الصراحه كلنا بنحب الصراحه يبن لاعايبه ولك انته اصلا لو عندك شرف ما بتحكي هيك<br />بس انته ما عندك شف يبن الشرمووووطه<br />وكمان لا تنسى انكم انتوو عآيشيييين الحرام من وراه نيك خواتكم بتجيبوو فلووس لاتنسى طيب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 208
subject = "بنت فلســــPـــــين"
author = "بنت فلســــPـــــين"
text = "الله لا يوفئو يا لأردنية وين ما إندار وجهكو ولكم يا ولاد الكلب يا ولاد الشلف بس بدي أسألكم سؤال وتردو بصرااحة بالله عليكم يالأردنية في واحد مكنم بعرف إمو ولا أبو طبعا لأ لإنو المرا اللي جابتكم ليلة ما تلقحت كان في كسها أربعين زب والله أعلم الواحد فيكم يكون من أي زب ولكم يا ممسوح بكرامتكم الأرض يا متفوف عليكم نخعة وبلغم إحنا المرتزقة يا بزقة ولكم يصحلكم تكونو فلسطينة ورافعين راسكم بين العالم ولكم ما حد غير الفلسطينة عمر الأردن وخلاها بلد متل العالم والناس يا بجم يا نور يا ولاد النوووووورية ولكم إنتو اللي بايعين شرفكم وعرضكم عشان تعيشو يا شحاادين يا حيوانات ريتني أشوف فيكم يوم يا صراامي ولكم إنتو ما بتسوو صرماية الحمام اللي إلها مليون سنة عندي وحتى كتيرة عليكم إنتو شئفة خرا ولكم يا جراد يا هس هس يا دبان تفي عليكم وعلى أحسن واحد فيكم يا طيااز يا عرصات يا شلووكات لعنة الله عليكم من هون ليوم الدين ولكم إنتو عندك الشب زبو يساوي 10 متر ولما ينيك بنت بصير 20 واالببنت كسها 50 سم ولما تتناك بصير 100000 سم يا قواادين ولكم ما إنتوو مفضووحين بالمنيكة حتى وصلت فيكم تنيكو بعض بالشارع"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 209
subject = "رسالة إلى الاردنيين لكي نبين من هم الفلسطينيين (حبايب قلبي)"
author = "بنت السعودية"
text = "بسم الله الرحمن الرحيم , أولا أنا سعودية , وأمي فلسطينية , والله يعز الفلسطينين والله إني أموت فيهم , وأعزهم , وأحطهم على راسي , لأني تربيت معهم أحسن تربية , واحترموني وما عايروني ويعزوني أحسن عز الله يعزهم , وبعدين يكفيكم يا الأردنيين إنه لهجة الفلسطينيين لهجة لذيذة , مو زي لهجتكم البدوية مع إني أكره البدو في كل مكان بالعالم حتى بدو السعودية , لكن حتى بدو السعودية لهجتهم أهون وأفهم من لهجة بدو الأردن المعفنين , وأنا أصلا مو بدوية , أنا أصلا حضرية من أهل الحضر بمدينة جدة , وأنا عن قريب رح أتزوج واحد فلسطيني بإذن الله وهذا شرف لي والله , ثانيا : أنا رحــــــــــــت على الأردن للسياحة , ورحت على البتراء وجرش ووادي رم والعقبة , كل اللي شغالين فلسطينيين وليسوا أردنيين , وللأسف يعني شوف حتى عند الحدود الأردنية السعودية يعاملون السعوديين بإهانة وحقارة , مع إنه السعودية جارة الأردن وبينهم تعاون مشترك , فعشان كذا نحنا نعمل معاكم المعروف وما يثمر فيكم , ولولا الله ثم فلسطين الحبيبة ما كنتم بالوجود أصلا , والتاريخ يثبت ذلك<br />وبعدين أنا أشوف إنه الفلسطينيين أصلا داعسين على رقاب الأردنيين لأنهم هم الغالبية العظمى بمدينة عمان , وفي الأردن بشكل عام , وبعدين يا أردنيين بذكر إنه أغلب المدرسين في الجامعات السعودية وخاصة مدينة جدة أغلبهم فلسطينيين وبرضوا في المدارس , إذا هما في السعودية ما شاء الله رفعوا مستوى التعليم , فكيف بالأردن الحين أحسن دولة عربية في التعليم الجامعي , ليييييييييش ؟ لأنه كل اللي فيه فلسطينيين , على فكرة , أنا ما أقلك إنه ما في فلسطينيين سيئييين , لكن والله أكثرهم محترمين وعندهم عادات وتقاليد جميلة جدا , والله يحرر الشعب الفلسطيني الأسير الذي عانى من أضرار الحرب , وأسأل الله تعالى أن يوحد صفوفهم , وأنا أقول لمحمد نواف الحمدالله وللأردني إنه عيب عيب تغلط على الفلسطينيات , فواالله إنه الفلسطينيات أشرف من ألف حرمة , أنا اللي خلاني أحبهم إنهم يرضوا بالنعمة اللي ربي أعطاهم ياها , على كل أنا والله ما أحب اسب وأشتم مثلكم , والكلام اللي كاتبينه دليل كبير على تفاهتكم وسخافتكم وتخلفكم وهمجيتكم بكل صراحة , يعني حتى بدو السعودية مع إني والله ما أحبهم كثير لكن فيهم نسبة كبيرة جدا تحضروا وترقوا , وإنتوا مثل ما انتم بخيام الشعر , شئ غريب جدا , على فكرة , لولا الله العظيم ثم وجود الفلسطينيين ولا كان الحين الأردن أخزى دولة على وجه الأرض , وسلامي لكل الفلسطينيات وسلامي لحبيبتي بنت نابلس ويا ريت يا أخت بنت نابلس إن كان عندك إيميل عشان نتعارف أكثر<br />والسلام عليكم ورحمة الله وبركاته (كـــلـــنــــا فــلـــســـطـــيــــن) ..................... بنت السعودية"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 210
subject = "وين كنا ووين وصلنا !!!"
author = "محمد نواف الحمدالله ..."
text = "يعني أنا والله مش فاهم ياموقع الشرموطه ( موقع عشرنيات ) ليش تعايقاتي اللي كتبتهم إمبارح حذفتوهم ياولاد الساقطة .. كس أختكو من موقع فاشي أخو شرموطه .. ولكو فش واحد بالموقع زلمه ابن زلمه حتى ينشد فيه الظهر ..<br />وبالنسبة للأخت السعودية .. الله يخليكي ويرظى عليكي يوخيته .. لاتقعدي تتفلسفي بسمانا . وإنتي أصلاً وبالأساس<br />مابتعرفي الفلسطيزيه قدنا حنا الأردنيه .. يعني كيف بدك تعرفيهم قدنا حنا ؟!<br />أنا الصراحة أكره ناس بكرهم وبطيقهمش ولاحتى مستعد أطلع في وجهم الأجرب المعفن همه الفلسطيزيه .. سبحان الله كل ما أطلع بوجه فلسطيزي منيوك عرص ابن عرصه متعرص أخو تعريصه بنت قحب شرموطه عاهره داعره . بصيبني غثيان وبحس حالي بدي استفرغ وأراجع .. يخرب بيتهم هذوله البقر الجحوش الغجر النور البهايم . نفسي بتنسد نهائي لما أشوفهم أو إني ألمحهم بأي شكل من الأشكال .. خرا الخرا عليهم شو إنهم خراااااااااااااا .. يا أخت سعودية ،، أنا بحكي معك على أساس إنك سعودية وإنتي مابتعرفيهم وبس حنا اللي منعرفهم منيح ... ومنيح كثير كثير كثير .. أنا مابنكر إنو همه كانوا بالسعودية زي ماكانوا عنا ومازالوا عندنا حنا الطرفين ( الأردن والسعودية * ) ولكن وجودهم كان عنا أكثر بكثير من السعودية ووسخو عنا ولمو قرفهم وعفنهم لعنا .. وماخلوا حدا يعتب عليهم ... وكل الناس عارفين مين همه وكيف كانوا ..<br />وكيف صاروا من تحت أفظالنا اللي لابتنعد ولاحتى بتحصى !!! ترى والله يا سعودية أكثر ناس قرفنا منهم لهذوة الحثالة المرتزقة الخونه العملا الجواسيس اللي كلهم على بعظهم مش شايفهم !! هو حنا الأدرنيين .. يعني الله سبحان الله ( لا إعتراظ على حكمو ) بس هو جبلنا مجموعة من الوسخ والعفن والقذارة والحقارة والسفالة والنذالة والحيونه والهمجية والنورية والبجمية اللي مش طبيعية وكل إشي زفت ولا يطااااااااااق بالمره ونهائي !! وراح حاطو فينا وعطينا إياه .. وعلى مين راحت ياسعودية ؟؟؟ أكيد راحت علينا حنا الأردنيين .. وإجوا الفلسطيزية القواديين القحاب على بلدنا وخربوا فيها ونشروا فيها وسخهم وعفنهم بمختلف مناطة المملكة . مافي محافظة ماسلمت منهم ولاد المشلطات بالشوارع ودايرات على الكابريهات والديسكوهات والكازينوهات والبارات والخمارات والمراقص والنوادي الليلية .. يعني سعودية .. إذا بدك تلاقي الفلسطيزية فبتلاقيهم بهالأماكن (الكابريهات والديسكوهات والكازينوهات والبارات والخمارات والمراقص والنوادي الليلية .. الخ ) ترى سعودية أنا مابقول هالكلام من عدم !!!! كل واحد عارف حقيقتهم ومفظوحيين بكل مكان .. وأكبر دليل عنا بالأردن .. لما تروحي على لبنان نفس الإشي .. ولما تروحي على سوريا كمان نفس الإشي .. ولما تروحي على السعودية ( اللي هيه بلدك طبعاً ) .. ولما تروحي على دول الخليج بشكل عام ودون تحديد .. ولما تروحي على مصر .. ولما تروحي على العراق .. ولما تروحي بكل مكان بتلاقيهم بهااااااااااااااااااااااايم العادة ومفظوحيين هونه وهناك ..<br />فكيف بدك الناس تحترمهم وتقدهم وتسويلهم قيمة ومستوى .. لا يا أختي أنا شخصياً بتمنى إنو يحلو عنا الفلسطيزية ويطلعوا من عنا نهائي ويروحوا على بلدهم خلي اليهود ينكيوا بخواتهم وأمهاتهم وبناتهم وحده ورا الثانية ..<br />بعدين سعودية .. إذا ملاحظة معي إنو الفلسطيزية معروفين بسب الإسلام والدين والرسول ( صلى الله عليه وسلم وعليه أفضل الصلاة والسلام ) والذات الإلهية ( الله عز وجل * ) دون تفريق بين هذا وذاك .. فالكل بالنسبة لهم سواسية .. وما أحلاه من ساعة ومن لحظة لما يسب الفلسطيزي الله وربو .. هع \" هزُلَت\" ...<br />يعني ناس باعوا أرضهم .. وباعوا كل إشي بخصهم .. بعدين طلعوا من أرضهم وراحوا بكل هالدنيا وصاروا يلفلفوا فيها دولة دولة .. والدولة اللي تعجبهم يبسطوا فيها ويقعدوا فيها ومستحيل يتخلوا عنها .. ومنها أرظنا ( الأردن الغالي * ) يالله كيف سوها ولاد القحبة الشرموطه الداعره ؟! بس آآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآخ خليها بالقلب ترجح ولاتطلع لبرا وتفظح<br />ع العموم هاذ اللي حكيتوا غيض من فيض . وماخفي كان أعظم وأدهى وأمر بكيثيييييييييييييييييييييييييييييييييييييييييييييير ..<br />والله على الظالم .. ورح يجيهم يوم ورح يوكلوا أصابيعهم لأ بل يدهم ندم وحسرة .. وساعتها رح ندعس على طيازهم وأكساس وبزاز وطياز بناتهم وخواتهم وأماتهم بدون أي رحمة ولا حتى شفقة وشوفوا يافلسطيزية واسمعوا منيح ..<br />ترى خلص الوظع صار بدو رظع .. وولا حدا منا مستفيد من الي قاعد بصير هونه .. وكلانا خسرانيين . يعني ما أسهلها وأبسطها وأيسرها إني أظل أسب وألعن وأفظح بعراظكوا وشرفكوا ليل نهار .. نايم صاحي .. وكمان الأمر بالنسبة إلكوا سهل لأ بل أكثر من سهل وعادي وطبيعي ميه بالميه .. بس مين المستفيد بين الطرفين * أكييييييييييييد وبدون شك ولا حدا .. إنتوا اللي بديتوا .. وإنتوا اللي رح تسكتوا وتنخرسوا وتنطموا بالأول .. لإنو أساس المشكلة طالعة منكو .ز مش منا .. وإنتو اللي فتحتوا جروح ومواجع أليمة .. كانت منسية أو بالاأحرى تناسينها .. لإنو بدنا نفتح صفحة جدية مع بعظ .. وننسى اللي راح .. وإحنا من جهتنا أبدينا استعدادنا لهاذ الإشي بس إنتو راكبين مخكو .. ومش قابليين تصفوا النية معانا .. فذنبكوا على جنبكوا .. وإنتوا أحرار . وهاذ الأمر عايد لإلكو . يعني مهما تطلعتوا ونزلتوا ولفيتوا يمين ويسار وفوق وتحت ومن هون لهون .. رح تطلعوا براااااااااااااااااااااااااااااااااا العميلة نهائي ورح تصيروا مثل الكلاب أو بدون ( مثل ) . وبرد بكرر وبعيد إني أنا لما سبيت في أكثر من تعليق إلي لأنكو إنتوا اللي بديتوا وهاذ جزاكوا يا حوش .. بس هاذ مش معانتوا ظعف مني أو إني مش قادر اخرسكوا .. لا بالعكس تماماً أنا مافي أوسخ مني وأرذل مني في الوساخة والرذالة .. ولكن ! مع نفس الوقت بكون محترم مع المحرتم وحيوان مع الحيوان .. وهاذ طبعي وأنا إنسان أهلي ماخاب ظنهم لما ربوني تربية صحيحة وسليمة .. بس العتب على الناس اللي مثلكوا اللي بتخلي الواحد يغلط ويسب خاوا عنو . ومن طبع الأردنيين بلا استثناء أو تمييز بينهم إنهم محترمين مع الناس المحترمة وغير هيك لأأأأأأأأأأا وألف لأ .. المهم<br />ومن الآآآآآآآآآآآآآآآآآآآآآآخرررررررررررررررررررررررررررررررررررررررر يعني .. وبدناش لف ودوران .. ومابدنا حجج واهية ومبررات كاذبة .. أو أي إشي .. وأنا عند كلامي .ز بس إنتو هل فعلاً عندك كلامكو؟؟!! .. وقد كلمتكو ؟؟!! .. ومابتتنازلوا عليها مهما صار؟؟!! أنا مستني تعليقاتكو .. بس ياريت بأدب لأني زهقت السب وساعتوووووووووووووووووووووووووووووووووووووووووووووووووووو<br />واللي بدو يصب الزيت على النار ويزيد النار فيها .. بقلوا خلينا نتفاهم ونتحاور ونتناقش مع بعظنا بدون سب .. والعقل هو الأساس . وتحياتي للجميع ،،،،،"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

