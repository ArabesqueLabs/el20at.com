subject = "يااردني وياسعودي ويااماراتي زفت"
author = "بنت يافا"
text = "اول شي انا مش راح انزل مستواي لامستواكم ياكلاب<br />وتاني شي هادا كلام ولاد صغار اكبرو شوي وخلي فيكم شوية نخوه ورجوله<br />ويااغبياء هادا كلو كلام من وراى شاشه كلامكم زي الاطفال انتو لسه ماكبرتو وتفوه على اللي رباكم وعلى عشيرتكم واحد واحد<br />ولاصغار<br />وخافوا ربكم ياحمير<br />وفلسطين حتضل على راسكم كلكم ومش بكيفكم الا غصبن عنكم يابهايم امريكا"
