[[comments]]
order = 258
subject = "رسالة شكر إلى الأخ : المشتاق للحور العين (طبعا ابن فلسطين)"
author = "بنت السعودية"
text = "السلام عليكم ورحمة الله وبركاته يا أخ المشتاق للحور العين , معليش نسيت أشوف تعليقك الموجود قبل ثلاث تعليقات , شكرا جزيلا لك ولكل أهل فلسطين الأكارم حبايب قلبي , وبارك الله فيك وتسلم على هالرد الحلو اللي يجنن , وأنا شكلي ما رح أخش هنا أصلا بعد كدا لأني ما أبغى أجيب لنفسي وجع الراس مع هدول الأردنيين المتخلفين , وأنا أنصح الفلسطينيين والفلسطينيات<br />بشدة أن لا يدخلوا هنا بعد هيك أو إنهم يحطوا رد حلو ومناسب ومفحم ومقنع , ولكن الأفضل إنكم تسيبوا الصفحة هده للأردنيين<br />ينبحـــــو فيها زي الكلاب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 259
subject = "كس أمكو يافلسطيزيه على راسو لزبي أنا ينعن شرفكو يابلجيكيه يامقطعيين"
author = "عدنان صوالحه"
text = "كس أمك يافلسطين كس أختك يافلسطين .. ينعن شرفك يافلسطين أبوكي على أمك يافلسطين<br />بدي أنيكك وأنيك بناتك ونسوانك كلهم . بدي أنيك أخت القدس أنا . شراميط منايك حيوانات عاهرات داعرات عرصات قحبات<br />ينعن أبو زلامك إذا كان فيكي زلام يافلسطينز (( طبعاً مافي كلكو مخانيث وشواذ وشغل لقلقه على الفاظي ))<br />ولكو ياحيوانات ياكلاب يانور ياغجر يابجم ياهوامل ياكسالى يااللي بعتو أرظكو وحطيتوها بظهور العرب كلهم ونحنا أولهم يابهايم العاده !<br />ولكو بعتوا أرظكوا . كس أمكو إذا كنتوا بتعرفوا إشي اسمو ((((((((((((((( وطـــــــــــــــــــــــــــــــــــــن )))))))))))))))))<br />الله ينعنكو من بين الناس والعالم . فظايح ومتخلفين وهبايل<br />وانا من موقعي هونه بناشد الشباب ألأردنية إنهم يعنعن أبو تعريص كساس وبزاز وطياز وشفايف خواتهم للفلسطيزيه خخخخخخخ<br />ولكو ع راس زبي كل فلسطيزي والهم ابن الممحونه العاهره الداعره الشرموط العرص اخو المطبلة المشلطة الداشرة الصايعة الفايعة بالشوراع اللي أمو بتنتامك من مليون مره ولكو روح شوف كس أمك يا ((( المشتاق لحور العين قال ابن فلسطيزي قال )) هعهع هعهعهع ولك كس أمك صار مغارة ولككككككككككككككككككككك كهف مليان خرا فثمك .. ولك كس أمك اهترى وصدددددددددددددددددى هعهعهعهعهعه<br />اسمع انتا مش ق<br />نا اطلع برا هالعملية وخليك ساكت ياعرص<br />قال شو بتخبالي ورا الدين والإسلام والمسلمين ولك نحنا متربيين منك ومن شكيلاتك يازنديق ياكافر يافاسق يامنافق<br />أصلاً كلكو على بعظكوا يافلسطيزية بتيجوش ظفر واحد أردني .. ولك خذ ظفري واقسموا نصين ولما تقسموا نصين اقسموا كمان نصين وإذا بتصير قد ربع اظفري .. هنيالك هنيالك .. عليك وعلى اشي اسمو فلسططططططططييييييييييز<br />هع هع هع هع هع هع عه عهع هع<br />وعليهم يالربع عليهم .. انسفووووووووووووووووووووووووووووهم !"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

