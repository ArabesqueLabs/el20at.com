[[comments]]
order = 383
subject = "إلى يهود العرب ( الأردنيين )"
author = "يوسف البحيصي ( فلسطيني و الكل مقهور مني )"
text = "ولك البحيصي تاج راسك يا كلب ختفوووووووووه عليك يا حثالة المجتمع<br />و لك الأردن هاي تبعتكم الفلسطينيين همه اللي دافعو عنها من همالتكم لمن كانوا الفدائيين الفلسطينين يقاتلو في الأغوار<br />يا همل يا أردنيين انتو بس شغل كلام و بس يا كلاب يا يهود العرب<br />والله كل أردني بدو خازوق في طيزو عشان ينخرس الصراحة لإنكم<br />( شعب إذا ضرب الحذاء بوجهه صاح الحذاء بأي ذنب أضرب )<br />و برجع و بقلكم هاي الأردن تبعتكم هي صحراء فلسطين<br />و سلام الله على كل عربي أصيل و لا سلام على من هو أردني يهود العرب لإنهم ليسو على ملة الإسلام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

