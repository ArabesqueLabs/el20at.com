text = "الله يرحم سيدك يالأردني المعوق (المختل عقليا) ولك مهو كان يفكر عبدون إسم واحد وبكفي إنكوا كنت إتفكروا الملوخية حنة واتحطوها على روسكوا . ولك هو لولا الفلسطينيين عليكوا في هالبلد إنكان بتعيشوا. لا والله ما ظنيت. ولك بكفي إنوا أكبر رؤوس أموال لرجال أعمال فلسطينين الأصل يا معفن."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

