text = "اسمع ولا .. وفتح مخك منيح .. أيوا .. أنا ظفري بسوى كل الفلسطينية ( وإنتا أولهم * ) باللي قيها .. لاتسويلي فيها إنك صاحب دين وخلق ,.. وبتخاف ربك . وكل إثنين وخميس بتصملي .. و24 ساعة بالمساجد .. ومندراي شو !!<br />اسمع . ومن الآخر يعني .. بدك تفتح مخك منيح _ بحكيلك إياها لآخر مره _ ،،، أنا أشرف منك ومن اللي خلفوك، ولكن لما يوصل الإشي فوق حدو ساعتها .. بدي ألعن شرفكو واحد ورا الثاني .. هاي أولاً ...<br />ثانياً إنتا اللي ولعتوها .. وعليتوها .. وصبيتو عليها كااااااااااااااااااااااز .. يعني بالمختصر المفيد .. إنتو اللي خلقتو عنصرية بين الطرفين .. ويدكو تتحملو .. فاهم ولأ<br />إنتو المفروض تعتذرو لإلنا واحد واحد .. وتحمدو ربكو مليون مره ومره إنكو قاعدين ببلدنا مرفهيين معززين وعال العال ..<br />ولكو ناس غيركو مش لاقين يوكلو ..<br />اسمع شيل هالقناع . اللي إنتا متخفي فيه .. شيللللللللللللللللووووووووووووووووووووووو .. ولك تتخباش ورا ظهر الإسلام .. والدين والمسلمين والمؤمنين .. ولك إنتا مش قد هالشغله !!! ولك اصحا ياناااااااااااااااااااااايم يامسطووووووول ...<br />ولك بكفي .. نازل فيها مثاليات .. وحكم .. ومواعظ .. ودروس دينية .<br />ولك احكي لحالك هالحكي .. ولكو الواحد منكو مثل الحرباية بتخفا بميت لون ولون .. ول عليكووووووووووووووووووو ياكلاب ..<br />لما الواحد يحكي معاكو كزلمه .. بتحبوش هاذ الإشي . منتو شراميط .. بدكو الواحد يكون زيكو بالضبط .. بس والله والله والله<br />حاااااااااااااااااااااااااامض على بووووووووزكوووووووووووووووووووووووووو منيح هيك .. وفشرت إنتا وأحسن فلسطيني داعس ع رقابكوووووووووووووووووووووووووووو كلكو واحد ورا الثاني .. حلو الكلام ...<br />بتعرف ،،، أنا بشفق عليك وعلى اللي زيك .. ياخي إنات مساكين .. وعلى باب الله .. يعني دراوييييييييييييييش ..<br />ولك استحي على دمك .. عيب عليك .. عييييييييييييييييييييييييييييب .. فعلاً (( زمــــــــــــــن أغبـــــــــــــــــــــر )) !!!<br />ناس قاعدة بتحتمي ورا ظهر الإسلام والدين ..<br />ناس قاعدة بتشوةوبتحكم صورة الإسلام على حساب مصالحهم ..<br />ناس قاعدة بتنصح وبترشد .. وهيه بتسوس السبعة وذمتها ..!!!<br />ناس قاعدة تتفلسف وتحكي و و و و و و<br />إنتا اللي الله يهديك .. روح الله لايسااااااااااااااااامحك .. لادنيا ولا آخره ..<br />ولك إنتا حمار ابن حمار .. وماعندك مخ ((( وطبعاً مش بس إنتا كل الفلسطينية ماعندهم مخ نهائي ))) ولك إنتا لو قاري التعليقات اللي قبلي كلهم .. وفسرت كلامكو عنا يانور يابجم .. كنت بتلاحظ فرق كبير كثير بينا وبينكو ياحيوان يابهيم الداعره ..<br />ولك افهم افهم افهم<br />إنتا وللأسف الشديد مابتفهم ..<br />انا الحق علي قاعد عم بحكي مع حييييييييييييييييييييييييييط .. مع حيوان .. مع جحش .. مع بقررررررررررررررررررررر<br />ماشي<br />على العموم ،،،<br />الأردن أولاً .. أولاً .. أولاً .....................................................................................<br />الله ...................................... الوطـــــــــــــــــــــــن ..................................... الملك<br />وعشتم وعاش الوطن .............................................. والوطــــــــــــــــــن للجميع .......<br />على راسي كل الأردنيين .. عليهم ياالربع عليهم ...."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 246
subject = "الأخ المشتاق للحور العين أشرف منك ومن ألف واحد زيك يا بن الكلب"
author = "رسالة إلى الحيوان : محمد نواف الحمدالله"
text = "أولا بدي أوجه شكري الجزيل والخالص للمرة التانية للأخ المشتاق للحور العين على رسالته الممتازة , وبدي أوجه رسالتي للخرة الممحون الحقير المتخلف (بتشديد الخاء واللام) محمد نواف الحمد الله , أولا بدي أحكيلك إشي يا خرة إنه الأردنيين عارف مين هما أصلا وإنتا شو أصلك , مش بقلك إنو الأردنيين هم عبارة عن كومة من الخرة مخرية متخرية بخرا مخري بخرا , عارف يا محمد نواف الحمد الله إنتوا كيف ؟ شفت الخرة (الككة) المكبوسة فوق بعض في المرحاض , هدول إنتوا تماما , ما فرق أبدا , سبحان الله اللي خلقكم , اللهم لك الحمد كما عافيتنا , الحمد لله الذي عافني مما ابتلاكم به وفضلني على كثير ممن خلق تفضيلا , يا حيوان يا حقير يا منحط يا كلب يا واطي يا ساااااافل يا قذر لولا الله ثم إحنا يا كلب كان هلأ الأردن الخرة المخرية أخزى دولة على وش الأرض , على فكرة بدي أسألك سؤال , إنتا بتحسب الملك عبد الله تبعكوا دايم إلكم , احلم , إن شاء الله بكرة بموت وبصير<br />انقلاب وبنستعيد أرضنا إن شاء الله اللي أخدتوها , وسيعتها بنربي الأردنيين الأصل المعفنين , الله يئرفكوا إنتوا وخنافيركوا الطويلة<br />وأنا هيني بحكيلك وبكرة بتشوف , بعدين حبيبي بدي أذكرك صحيح , إنتا جالس بتحكي بدوي مع فلسطيني , ما دامك بتكره<br />الفلسطينيين ليه بتحكي بلهجتهم , هدا دليل كبير على إنكوا ما عندكمش اصل ولا فصل وكلكوا زي طيزي وكلكوا على زبي واحد ورا التاني , وكلكوا خرة ولا عمركوا رح تتحضروا , متخلفين معفنين , وشكرا لكل حبايبي الفلسطينيين والفلسطينيات وبدي من<br />حبايبي الفلسطينيين والفلسطينيات يردوا ويحرقوا ويفحمو الخرة المخرية المكبوسة فوق بعضها , وشكرا إلكوا حبايبي<br />((فلسطيــــــــــــــــــــــــــــــــــــــــن أولا غصب عن كل الأردنيين الملويين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

