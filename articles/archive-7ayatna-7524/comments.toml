[[comments]]
order = 291
subject = "عشيرة الشرارات"
author = "عربي مسلم"
text = "عرب الشرارات(13): يبلغ عدد بيوت هؤلاء العرب (1000)، يأتي قسم منهم في بعض السنين من البادية، فيدخل المعمورة مع بني عناز (الرولة) إلى لواء حوران، وفي بعض السنين يدخلون البادية مع بني صخر إلى لواء الكرك، ويبقى قسم في البادية من نجد والعراق، وأفراد هذه العشيرة أكثر من بني صخر وبنى عنازة بداوةً، وأكثرهم لا يعرفون الخبز ولا الحنطة، ولا يلبسون السراويل، وليس لهم بيوت شعر، فراشهم التراب، وغطاؤهم السماء، وغذاؤهم لبن إبلهم فقط، وقليل من التمر ويقومون على تربية الإبل فقط.‏"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 292
subject = "ضع عنوان التعليق"
text = "ياسعود باوصيك يالمنعور يالغـــــــالى واذكـــر وصاتى ايلا كبرت مصايبـــهـــــــــا<br />ياسعود ساسك كريم ومنزلك عالــــــى ومعنزن من خوال الطيب مكسبهــــــــــــــــا<br />باوصيك فى فرض ربك اول وتالـــــى لاجل الشفاعه ايلا رفعت مكاتبـــــهـــــــــــــا<br />باوصيك فى والديك بطيب الاعمالــــى تاصل بهم والقطاعــــه لاتقربــــهـــــــــــــــا<br />واتعب على الطيب لوبه قصف الاجالى وارق المعالى وشرف في مراقبهـــــــــــــــا<br />واعلم ترى فالليالى علقم وحالــــــــــى يومن تبسم ويومن فى مخالبــــــــهــــــــــــا<br />واعلم ترى فالرجال انواع واشكالــــى مثل الاصابع تخالف فى مراتبـــــهــــــــــــا<br />فيهم هذورن يحب القيل والقالــــــــــى ويفرح ايلا ولعت فيها شبايبـــــــــــــهــــــــا<br />وفيهم عجوزن وزوله زول رجالـــــى ماهــــــمه الا دنانـــيره يحسبـــــــهــــــــــــا<br />وفيهم سنافى كريمن يرخص المالـــــى يقضى لزومك ايلا حلــت نوايبـــهـــــــــــــا<br />والضيف لاجاه فى رحبن وسهالـــــــى يذبح له الحــــيل لوغليت جلايبـــــهـــــــــــا<br />والجار ياسعود لاترضى له اذلالــــــى قدرة وافزع معه لاجا نشايبــــــــهـــــــــــا<br />وادعه على كرمتك لاتجعله تالـــــــــى وان جاك داعيه للكـــرمه فوجبـــــهـــــــــــا<br />ولاتقفله مجلسك فى كل الاحوالــــــــى خله مشرع ولو شحت سحايبــــهـــــــــــــــــا<br />خله لمن يكسبون الطيب مدهالـــــــــى ولاخير فى جلستن يغيب طيبــهـــــــــــــــــا<br />واياك تجلس مع الخمه والانذالـــــــــى النفس عن دربهم ياسعود جنبــــــهــــــــــــــا<br />لاكثر مالك عزيز وعندهم غالـــــــــى وان قل مالك تواروا مع هبايبـــــــــــهـــــــا<br />واياك تسمع بربعك شور عذالـــــــــى واياك تسكت على رجلن يعـــــــي بهـــــــــا<br />رجلن بلا ربع مايسواله ريالــــــــــــى ربعك احزامــــك ايلا ثارت طلايبــــــــــها<br />ياسعود هذى وصاتى وسط مرسالـــى واذكر وصاتى ايلا كبرت مصايبهــــــــــــا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

