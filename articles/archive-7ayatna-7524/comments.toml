[[comments]]
order = 160
subject = "رسالة إلى الواطي العاهر المفضوح عرضه : الأردني ومحمد نواف الحمدلله"
author = "بنت نابلس Palestine first (بحبك يا فلسطين)"
text = "أولا يا الجراذن اسمكوا أولا مش موجود في اللغة العربية كلها , يعني حتى اسم الأردن الخرة (jorthan) جرذن من جردن , لأنه فعلا اسم الأردن جرذن وليس جدرن , يا أخي العزيز , روح شوف بناتكم الأردنيين الأصل قديش طول منخارها بيوصل لـ 5 سم , حبيبي<br />شوف عيبكم أول بعدين عيبوا على التانيين , مش زينا إحنا الفلسطينيات , ولك إحنا والله أحلا منكوا بكتير , عشان هيك الأردني الأصل لما بشوف وحدة فلسطينية ماشية بشوارع عمان بتأوم زبره فورا زي الجعانين وعينه بتبيض بياض بكحلها , لكن فشرتوا يا أولاد الكلب المناييك المخنثيين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 161
subject = "تقرير علمي غريب : أطول خرة (ككة في العالم) هي ككة الأردنيين (بالله بجد تقروا هدا المقطع النصي مرة تانية)"
author = "عاشق فلسطين"
text = "أثبت علماء الأحياء بعد تحليلهم لخرة (ككة) أردنيين أصل , فوجدوا إنه طول الخرة تبعهم متر ونص , عارفين ليه , من كتر ما بياكلوا<br />برسيم وعلف (لما بطفحوه إن شاء الله) , وتاني إشي أثبتوا إنه هده الخرة خرة نادر نوعه في العالم , لأنه الككة معروف طوله يعني بيوصل لنص متر بالكتير, لكن هدول لا متر ونص ويمكن أكتر , ولا وشوف بعد هيك وين الريحة بتكون , يا حبيبي , شفتوا خرة الحصان الله يعز الفلسطينيين (فقط) أديش طوله ؟ الأردنيين ضعفه , ولونه أخضر غامق وفيه عليه شوية براسيم , لا ولو شفته الإسهال تبعهم كيف , فيه إشي اسمه ملح انجليزي عشان يفرم الخرة جوة الطيز وينزل بسرعة , هدول بدون ملح إنجليزي ولا غيره , هدول عندهم دواء حتى مش راضيين الأردنيين يقولوا اسمه عشان فيها خلطة سرية لفرم الخرة جوة الطيز بسرعة :<br />1غيغا بت في الثانية , وتالت إشي صحيح , اندهش العلماء الأمركيين في عمان لما إجوا على نقابة الأطباء الأردنيين لما إجوا<br />يشرحوا جثة أردني أصل معفن , فوجدوا فعلا إنه جلده متأثر بالبلغم اللي انقذف على كس إمه وأبوه جالس بنيك في إمه زي<br />الجعان , فقالوا هده سبب تخلف الأردنيين , وإنه الجينات اللي فيهم خربانة على الأخير , فسبحان الله العظيم, ولله في خلقه شؤون , (((((مـــــــــنــــــقـــــــــــول للفائـــــــــــــــــــــــــــــــــدة))))) وشكرا إلك حبيبتي بنت نابلس والله يحفظك يارب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 162
subject = "أنا بأيد كلامك كله يا بنت نابلس"
author = "عاشق فلسطين"
text = "صحيح أختي بنت نابلس إنه الأردنين الأصل عشان ما عندهمش حمامات ولا زبايل الله يكرمك يحطوا فيه شوية الخرة تبعهم , بروحوا<br />بحطوه جنب المخيمات عشان يلصقوها في الفلسطينيين , على فكرة , المخيمات الفلسطينية أشرف وأطهر من هدول الحثالة , صحيح إنهم لاجئين وغلابة والله يكون بعونهم , لكن مش زي هدول الحثالة اللي بحطوه خراهم على راس غيرهم , حسبنا الله ونعم الوكيل , والله إنتوا يا الأردنيين لحالكوا بتجننوا بلد , مش عارف الملك عبد الله تبعكوا كيف ساكت عليكوا , والله لولا الله ثم إحنا الفلسطنييين ولا كان هو هلأ مخزي على وش الأرض فعلا والله , لكن على كل الحمد لله رب العالمين , وفلسطين رافعة راسها عالية عالية رغم خنافير الأردنيين الطويلة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

