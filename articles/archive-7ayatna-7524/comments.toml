text = "ولك يا منيك هاي طريقة انسيناها يا اخو شلكة لما كانت امك بترضع خصوات جاركوا.. اذا بدك بعبيلك الموقع اشرطة سكس لشرموطات الاردن وممن تعتبرونهن من بنات الحمايل والعشائر.. ولو كنت بتستاهل لوريتك شريطي مع قحبة اردنية من دار الطراونة (كركية) 7 مشاهد نيك وبمختلف الاوضاع اذهب الى اليوتيب وشاهد الشريط بنفسك بالكن تنمحن انت وخواتكوا ودورولك على فلسطيني ينيكك وينيك خواتكوا يا مقمل"
