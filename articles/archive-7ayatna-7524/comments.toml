subject = "كتاب الملكة نور مذكرات أم فضائح وأكاذيب (الموضوع طويل نوعا لكن أرجو قراءته كاملا)"
author = "فلسطيني أصيل"
text = "كتاب الملكة نور مذكرات أم فضائح وأكاذيب<br />كتب: sawama<br />البداية :<br />فلسطينيو الاردن سفلة كانوا يسرقون ويغتصبون ويرتكبون الجرائم وينشرون الفوضى في المدن الاردنية وهو السبب الذي دفع الملك حسين الى قتالهم وحربهم في ايلول \" و\" الجيش الاردني هو الذي خاض معركة الكرامة وانتصر بها لكن عرفات وجماعته سرقوا النصر ونسبوه لانفسهم \" .<br />هذه فقط عينة مما ورد في كتاب يوزع اليوم على نطاق واسع في الولايات المتحدة ومؤلفته ليست يهودية او صهيونية ولا تعمل في المخابرات الاسرائيلية مثلا ولا هي طابور خامس يهمها تشويه صورة الشعب الفلسطيني وقضيته العادلة ... وانما هي ببساطة \" الملكة نور \" وهو الاسم الحركي الذي اطلقه الملك حسين على مهندسة امريكية اسمها \" ليزا \" دخلت قصره كعشيقة قبل ان يتورط الملك بالزواج منها فتتورط في كل الفضائح التي عرفناها عن القصر الملكي وتكون السبب المباشر مع صديقها سميح البطيخي في الانقلاب الذي وقع داخل القصر قبل موت الملك حسين بأيام ... لتنتهي \" مؤرخة \" للاردنيين تكتب عن عاداتهم وتقاليدهم وتفضح اسرارهم وتنهش في اعراضهم دون ان تعرف كلمة واحدة باللغة العربية .<br />ما فعلته وتفعله المذكورة يعتبر وفقا للقانون الاردني اساءة للوحدة الوطنية وهي جريمة يعاقب عليها بالسجن خمس سنوات ... لكن \" ليزا \" لن تدخل السجن ولو لساعة واحدة ... لا بل ان من يتجرأ من الاردنيين مثلا ان ينتقد كتابها المسخرة سوف يدخل السجن ثلاث سنوات لان عمله يعتبر \" تطاولا على الذات الملكية \" وهي التهمة التي الصقت بالزعيم السياسي الاردني البارز ليث شبيلات الذي انتقد فيما نقد بكاء \" ليزا \" الحار في جنازة رابين ناسية او متناسية انها زوجة لملك عربي \" هاشمي \" احتل رابين ولا يزال نصف مملكته وقتل الاف الاردنيين ولا يزال يعتقل المئات منهم .... نور وزوجها بكيا وذرفا الدموع وانتحبا في الجنازة اكثر من زوجة رابين نفسها .<br />الفلسطينيون ليسوا وحدهم الذين تعرضوا للاساءة في كتاب \" ليزا \" ... فالملكة توزع في كتابها الاساءات على الجميع ... وبدأت طبعا بخصمها اللدود الامير حسن ولي العهد وزوج ابنته ناصر جودة وزير الاعلام والذي وفقا لما نشر انذاك سخر اجهزة الاعلام للترويج لعمه - والد زوجته - الى الكشف عن سذاجة الاميرة عالية ... ومرض الامير طلال بن محمد ... الى عشيقة الملك حسين ... الى ام قابوس والشيخة فاطمة وصدام حسين انتهاء بثقيل الدم معمر القذافي وزوجته ..... الى التهجم على الرئيس المصري حسني مبارك وزوجته ... انتهاء بتلفيق القصص وتزوير التاريخ ... ومنها ان عرفات وقع بالاسر خلال مجازر ايلول وان الملك اطلق سراحه وهذا كما هو معروف غير صحيح .<br />الكتاب صدر باللغة الانجليزية بعنوان \" Leap of Faith \" والترجمة بالعربية قد تكون \" قفزة عقيدة \" أو \" نفحة ايمان \" وهي الترجمة التي اختارتها جريدة الحياة اللندنية التي نشرت فصولا من المذكرات ونطت عن الكثير من الفضائح الواردة فيها .<br />يقع الكتاب في 467 صفحة وتجده معروضا للبيع هذه الايام في المطارات والمكتبات والاكشاك في طول امريكا وعرضها وهو ما لم يتوفر حتى لكتب مسئولين وصحفيين امريكيين كبارا مما يشير الى ان هناك جهة ما - غير دار النشر - دعمت هذا الكتاب ولها مصلحة في توزيعه على نطاق واسع بين الامريكيين ... بخاصة في هذا الوقت بالذات الذي تتعرض فيه القضية الفلسطينية الى مفترق طرق ... وتتكالب المصائب على الامة العربية .<br />لن تجد الكثير في المقدمة عن سيرة الملكة نور الشخصية اللهم الا اشارتها الى ان قاريء فنجان بشرها بأنها ستتزوج من عربي ارستقراطي ... هذه \" القدرية \" تتكرر كثيرا في كتابها ربما لتفسر الكثير من الاحداث او تبررها ... فهي اصبحت زوجة لملك عربي ليس لانها \" دست \" الى غرفة نومه من خلال \" علي غندور \" المتخصص بهذه القضايا وانما لان قاريء فنجان بشرها بذلك !!<br />ليزا تزوجت الملك وهي في السادسة والعشرين من العمر وكان يكبرها بستة عشر عاما ... هذه الى 26 سنة لا تكاد تجد لها ذكرا في الكتاب الذي يفترض انه \" مذكرات \" وادب المذكرات له اصوله طبعا ... ومع ذلك اشارت نور من بعيد الى احدى اهم المرويات عنها في الشارع الاردني بعد الاعلان عن زواجها من الملك وهي حكاية علاقتها بمحام امريكي افريقي وانجابها ولدا \" اسود \" منه ... وهو ما اوردته من ضمن مجموعة \" اشاعات \" قالت انها اطلقت عليها من قبل خصومها !! المهم ان نور لم تؤكد في كتابها انها كانت \" بنت بنوت \" ولا اظنها ستقنع احدا انها كفتاة امريكية بلغت سن السادسة والعشرين دون ان يكون لها \" بوي فرند \" !!<br />تعترف \" ليزا \" انها التحقت بالعمل في شركة عالية للطيران كمهندسة وكان ابوها نجيب الحلبي قد عين كمستشار لهذه الشركة بعد طرده من رئاسة شركة \" بان امريكان \" بعد اتهامه بالفساد والتسبب بانهيار الشركة ماليا ... ومن خلال صديقه علي غندور تمكن الحلبي الذي مات مؤخرا في واشنطن من زرع ابنته في قصر الملك ... نور تعترف ان \" الاشاعات \" ذكرت ان ام الملك زين قتلت زوجة الملك الفلسطينية \" علياء \" وان زرع فتاة امريكية كزوجة في القصر كان مخططا امريكيا الا انها تنفي هذا الاتهام بروايات عن علاقات حب صامتة ربطت الملك بها الى ان قال لها يوما \" انا مش قادر اتحمل ... اريد التحدث مع ابيك \" ... ثم تقول ان الملك وقع في غرامها عندما نظر في عيينيها لاول مرة الى اخر هذه المرويات التي تريد \" ليزا \" ان تضحك بها علينا لتبرر دخولها المشبوه الى القصر ناسية فيما يبدو ان الملك الذي تتحدث عنه ليس \" مراهقا \" وانه \" نسونجي \"معروف دوب قبلها ثلاث زوجات وعشرات العشيقات منذ ان كان طالبا في مدرسة \" هارو\" في لندن الى ان اصبح ملكا يبدل العشيقات اللواتي يوظفهن علي غندور في شركة عالية للطيران كما يبدل جواربه .... الملك حسين ليس من النوع الذي يحب من اول نظره !!<br />الامر الذي لم توضحه \" ليزا \" في كتابها هو السر في دخولها الى قصر الملك ومعاشرتها له ومخالطتها لاولاده الصغار ... فهي كما تقول مهندسة معمارية ولكن مروياتها تؤكد انها كانت تعمل \" بيبي ستر \" للملك واولاده وانها كانت تعيش مع الملك في قصره وتعد طعام الافطار له ولاولاده الخ .... الذي لا تعرفه \" ليزا \" هو ان علاقتها غير الشرعية بالملك كانت معروفة انذاك لرجل الشارع الاردني ... وان الملك اضطر الى اعلان الزواج بها للخروج من هذا الحرج ... فهو كملك عربي مسلم يزعم ان النبي محمد هو جده لا يستطيع ان يتخذ \" جيرل فرند \" على هذا النحو ... وكان الامير حسن ولي العهد اول من لفت نظر الملك الى هذه المسالة ... ولعل هذه تكون اول مواجهة او بداية للمواجهات فيما بعد بين \" نور \" و \" والحسن ؟ وهي المواجهات التي انتهت بطرد الحسن من ولاية العهد بمعاونة قوادين لنور هما قائد الجيش \" عبد الحافظ الكعابنة \" ورئيس المخابرات \" سميح البطيخي \" الذي كانت زوجته الانجليزية \" جيل \" تعمل كوصيفة لنور وتعد ابنها للزواج من ابنة نور .... الطريف انك لن تجد في كتااب نور اية تفصيلات عن علاقتها بالبطيخي ربما لان الاعلان عن تورط البطيخي بسرقة ثلاثة بنوك اردنية قد تم في الوقت نفسه الذي دفعت فيه نور بكتابها الى النشر الامر الذي وفر لها - كما يقال - الوقت الكافي لحذف فصل كامل كان مكتوبا عن البطيخي وكرمه وحسن سيرته وولاءه واخلاقه العالية وفضله عليها وعلى اولادها .....الخ .... كما انك لن تجد اشارة واحدة الى الفريق عبد الحافظ الكعابنة الذي لعب دورا في عزل الامير حسن لان هذا ايضا تورط بفضيحة بيع اسلحة الكلاشنكوف الفلسطينية الى تجار المخدرات في كولومبيا<br />تعترف \" ليزا \" انها رأت الملك وزوجته الملكة علياء اول مرة في المطار حين طلب منها ابوها ان تلتقط له صورة مع الملك والملكة ... ثم تحاول ان توهم القراء انها كانت تعيش حياة عادية بعيدا عن القصر فتعدد اسماء اصحابها وهم خالد عبد المجيد شومان حفيد مؤسس البنك العربي وزوجته سهى ... ومليحة عازار وفاتنة عصفور وعامر سلطي ... ورامي خوري رئيس تحرير \" جوردان تايمز \" ... وتوحي للقاريء انها هي التي ربت اولاد الملكة الراحلة علياء علي وهيا مع ان الشارع الاردني يعلم ان نور هي التي اتهمت بتوريط الامير علي بقصص لها علاقة بتعاطي المخدرات حتى تحرمه من ولاية العهد لانه اكبر ابناء الملك من ام عربية مسلمة... وانتهى الامر بعلي ان اصبح مجرد \" بودي غارد \" لاخيه عبدالله مع انه وفقا للدستور الاحق بالعرش .<br />اعتراف الملكة بعلاقتها وصداقتها برامي خوري - الشاب الاردني الاصل الذي يحمل الجنسية الامريكية - فسر لي \" لغزا \" طالما ورد على خاطري .... ففي مطلع التسعينات نشر رامي خوري في جريدته \" جوردان تايمز \" مقالا تحدث فيه عن مرض الملك حسين وعن ضرورة التساؤل عن مستقبل المملكة في ظل غياب مفاجيء للملك ... كان المقال مثيرا للتساؤل فعلا بخاصة وان الملك لم يكن يومها مصابا بالسرطان او لعله اخفى المرض عن الناس والصحافي لم يعتقل او يطرد من عمله بسبب هذا المقال حتى بعد ان ردت عليه ابنة الملك \" عالية \" من زوجته الاولى \" دينا \" واعتبرت مقاله غير لائق ... هذا التحرش بالامير حسن وولاية العهد تجد له ذكرا في صفحة رقم 417 من الكتاب ... ففي هذه الصفحات تزعم نور ان الملك واثناء تلقيه العلاج في مايو كلينك اطلع على مقال نشرته نيويورك تايمز مؤكدة انها حاولت حجب الجريدة عن الملك وان شخصا ما مررها اليه وان الملك غضب كثيرا مما ورد في مقال الجريدة .... الجريدة نشرت لقاء مع الامير حسن تحت عنوان \" الملك يموت والامير حسن ينتظر \" وجاء فيه كلاما منسوبا الى الحسن ان اخاه الملك حسين هو رمز ... اما هو - اي الحسن - فهو الاقرب الى المطبخ اي انه هو الذي يدير شئون البلد واكد وزير الاعلام ناصر جودة الذي هو زوج لابنة الحسن هذا الكلام الامر الذي دفع الملك الى التحدث عن هذا الامر في التلفزيون الاردني .<br />اليوم نستطيع القول ان \" ليزا \" كانت وراء نشر مقال \" رامي خوري \" في جوردن تايمز ... ربما لان من مصلحتها اثارة قضية ولاية العهد وقد تكون مقالة رامي خوري فعلا هي القشة التي قسمت ظهر البعير وخرجت بالمواجهة بين \" ليزا \" والامير حسن الى العلن .<br />بعد ان تفرش \" ليزا \" لكتابها بمقدمات من هذا النوع ... تبدأ بالتمهيد للتهجم على الفلسطينيين في الاردن ... ففي صفحة 54 وما بعدها تتحدث \" نور \" عن مدينة عمان قبل عام 1948 وكيف انها كانت مدينة جميلة تقع على سبعة تلال يتوسطها القصر ... الى ان جاء الفلسطينيون فبنوا العشوائيات بلا نظام فخربوا شكل المدينة وجمالها ... وتضيف ان الملك صاحب القلب الرحيم كما تصفه سمح لهم ببناء هذه البيوت التي غطت جمال القصر والمدرج الروماني الذي يطل عليه .... وحتى تكتمل الصورة الميلودرامية تزعم نور ان القصر تعرض لقصف بالصواريخ خلال مجازر ايلول وانه تبين ان طباخ الملك وهو فلسطيني كان يعطي احداثيات المكان للجهة التي تقصف القصر .<br />يبدو ان نور لم تقرأ لا كتب التاريخ ولا كتب الجغرافيا وبعضها صدر عن محافظة عمان ... وكلها تعترف بأن عمان لم تكن قبل عام 48 اكثر من قرية تنتشر على ضفاف \" سيلها \" خيم البدو وبعض البيوت العشوائية للشركس ... ولم تتحول عمان الى مدينة الا بوصول الفلسطينيين اليها فهم الذين بنوا عمان ... ومعظم قصور المدينة وفللها مملوكة لعائلات فلسطينية فكيف \" خرب \" هؤلاء المدينة الجميلة التي تتحدث عنها \" نور \" وعن اي قصر تتحدث ... الملك عبدالله نفسه - مؤسس الامارة - كان يسكن مع عشيقته \" ناهده \" في مخيم قرب قرية \" ماركا \" الى ان بنى له مهندس فلسطيني قصر بسمان .<br />يبدو ان هذه \" الفرشة \" عن الفلسطينيين ووسخهم وتخريبهم لجمال مدينة عمان اريد بها التمهيد لما هو اهم ... ففي صفحة 116 تتحول \" ليزا \" الى مؤرخ عسكري لتتحدث عن معركة الكرامة فتزعم ان الفلسطينيين سرقوا النصر من الجيش الاردني ومن زوجها الملك ... الملكة \" نور \" التي لا تعرف العربية لم تقرأ فيما يبدو ما كتبه كبار الضباط الاردنيين عن هذه المعركة ... ويبدو ايضا انها لم تشاهد قائد هذه المعركة الفريق مشهور حديثة الجازي الذي اعترف عبر فضائية الجزيرة وفي برنامج \" شاهد على العصر \" ببطولة الفدائيين الفلسطينيين الذين قاتلوا في الكرامة ... الجيش الاردني دخل المعركة عبر مدفعيته فقط ودون اوامر من القصر لان مشهور حديثة الجازي وهو ضابط وطني شريف هو الذي اعطى اوامره للمدفعية السادسة بقصف ارتال الدبابات الاسرائيلية التي كانت تعبر النهر والتي كانت لديها معلومات مسبقة بأن الملك حسين لن يتدخل في المعركة ولعل هذا هو الذي جعل الاسرائيليين يمتنعون عن استخدام سلاحهم الجوي لانهم توقعوا معركة سهلة في قرية الكرامة مع بعض الفدائيين ... القتال الحقيقي الذي وقع في وسط البلدة خاضه الفلسطينيون لانه لم يكن للجيش اي وجود في القرية اللهم الا بعض قوات \" الحجاب \" على طرف النهر وهؤلاء قاتلوا بشرف دون اوامر ايضا .<br />يبدو ان الحديث عن معركة الكرامة ... وكيف ان الفلسطينيين سرقوا النصر من زوجها الملك اريد به ان يمهد لما هو اهم في كتابها وهو الحديث عن الوضع في الاردن قبل مجازر ايلول ... وفي هذا المجال لم تترك الملكة جريمة سرقة او قتل او اغتصاب الا ونسبتها الى الفلسطينيين مبررة بذلك للمجزرة التي ارتكبت بحقهم فيما بعد .... ومرة اخرى تتجاهل الملكة ما كشف عنه لاحقا من ان معظم جرائم السرقة وقطع الطرق والاعتداء على الجنود كانت تقوم بها عناصر من المخابرات الاردنية بقصد تاليب رجل الشارع على الوجود الفدائي بخاصة بعد التعاطف الكاسح مع الفدائيين عقب معركة الكرامة .<br />يبدو ان \" ليزا \" تعتقد ان الشعب الاردني جاهل ولا يقرأ ... فالملكة التي عاشت عشرات السنوات بين الاردنيين لم تتعلم العربية ولم تنجح في اقامة علاقة واحدة مع اية قبيلة او عشيرة اردنية ... لذا تجدها تلجأ الى التفسير القدري للاحداث مستغبية القراء ... فدور الملك حسين في هزيمة حزيران يونيو بدأت تكشفه الوثائق ومنها مثلا تهريبه لطائرات الفانتوم الاردنية الى تركيا حتى لا يستخدمها عبد الناصر مع ان الملك دخل قبل ايام من الحرب في اتفاقية دفاع عسكري مع مصر بل وسلم قيادة الجيش لجنرال مصري هو الشهيد عبد المنعم رياض الذي استشهد بعد ذلك في معارك الاستنزاف ... كما ان الوثائق الاسرائيلية كشفت عن العلاقات والاتصالات السرية التي تمت مع الملك قبل الحرب ... ونشرت عرب تايمز من قبل جانبا من الاعترافات التي ادلى بها المقدم غازي ربابعة قائد الكتيبة الاردنية في القدس والتي اعترف بها انه وجنوده لم يقاتلوا وانهم غيروا ملابسهم بملابس مدنية وهربوا من القدس بعد ان دفنوا اسلحتهم في بيت مهجور لتحتل اسرائيل الضفة الغربية كلها دون قتال .<br />ليزا ... في صفحة 72 وما بعدها من الكتاب تستحمر القراء ... فتروي لنا ان الملك ذهب بنفسه خلال الحرب الى النهر للاشراف على القتال ... وتضيف ان غيمة سوداء ظهرت في السماء فوق الملك لتغطي تحركاته عن اعين الطائرات الاسرائيلية ... وظلت الغيمة تسير فوق الملك الى ان وصل الىالجبهة ... ثم عادت معه الى قصره في عمان قبل ان تختفي !!<br />بهذا الاسلوب الساذج تحاول \" ليزا \" ان تختصر هزيمة حزيران يونيو ونجاة الملك من القتل ليس لانه لم يكن يوما من الايام على قائمة المطلوب قتلهم اسرائيليا لانه عميل لهم وانما لان ربنا خبأ الملك تحت غيمة سوداء !!<br />يبدو ان \" ليزا \" سمعت بحكاية الغيمة التي ظللت الرسول عليه السلام فحورت القصة ونسبتها الى الملك استحمارا لعقلية القاريء ... ثم حتى تذكرنا بين فقرة واخرى ان زوجها هو حفيد النبي بل وتنشر صورة لها ولابنتها وهي في لباس الاحرام ... بل وتقول ان المطر لم ينزل في عمان الا في يوم عودة الملك من مايو كلينك .<br />اعتبارا من صفحة 92 من كتابها ... تبدأ الملكة \" ليزا \" بضرب العرب تحت الحزام ... ففي هذه الصفحات تتحدث عن محاولات الاغتيال التي تعرض لها الملك ... فتتهم المصريين في اكثر من موقع ... ثم تقول ان معمر القذافي طلب من الرئيس حافظ الاسد اسقاط طائرة الملك بصاروخ ارض جو ودفع مقابل ذلك ملايين الدولارات ... وتتناول محاولة الانقلاب التي تقول ان اللواء علي ابو نوار حاول القيام بها مع ان علي ابو نوار نفاها ... كما نفاها مشهور حديثة الجازي الذي قال ان حكاية ابو نوار ضخمت في ذلك الوقت لاسباب سياسية .... اما محاولات الاغتيال بالرصاص التي تعرض لها الملك مرتين وهو بصحبة خاله الشريف ناصر بن جميل فالذي لا تعرفه الملكة فيما يبدو ان الشريف ناصر هو الذي كان مستهدفا من العمليتين وان الذين اطلقوا عليه النار هم شركاء له في اتجارة المنخدرات لان الشريف الملقب بين الاردنيين باسم \" ابو شوال حز احمر \" كان مشهورا عنه انه اهم واكبر مهرب مخدرات في المملكة وكانت المخدرات تهرب بسياراته عبر الحدود بشوالات حز احمر !! وكان هذا الشريف يمارس هذه التجارة حتى وهو ضابط صغير في الجيش العراقي ... وورث هذه التجارة بعده شريف اخر من الاشراف الهاشميين يتولى قيادة قوات البادية التي اسسها كلوب لحماية الحدود الاردنية من المهربين .<br />في صفحة 118 تعترف \" ليزا \" بالعلاقات السرية التي ربطت الملك باسرائيل وتحاول الايهام ان هذه العلاقات بدأت بسبب التواجد الفلسطيني غير الشرعي والمكثف في عمان ... واستحمارا للقاريء تورد \" ليزا \" بعض القصص عن \" الارهاب الفلسطيني \" منها رواية تنسبها للامير علي ابن نايف ابن عم الملك حسين وزوجته الاميرة وجدان ... وكيف ان الفدائيين اطلقوا النار على منزلهم ردا على اطلاقات تأتي من محيط منزلهم المجاور لمنزل زيد بن شاكر وكيف ان اخت زيد بن شاكر \" الشريفة جوزة \" صعدت الى \" السطوح \" بناء على طلب من الامير علي لتطلب من الجنود التوقف عن اطلاق النار على الفلسطينيين حين اصابتها رصاصة قاتلة وكيف ان الامير علي الذي وصفته بأنه ضابط ذكي جدا قام بتهريب اسرته الى لندن !!<br />ما كتبته \" ليزا \" عن مجزرة ايلول يعتبر بحق مسخرة المساخر ... وتبسيطها للاحداث وتصويرها لزوجها الملك بانه كان ضحية تطاول الفلسطينيين عليه ... وتجاهلها لعدة الاف من الضحايا سقطوا في المخيمات والشوارع والاحياء الفقيرة برصاص الجيش عدا عن عمليات القتل بالبلطات التي تمت في مستشفى البشير وعمليات الاغتصاب والقتل في مدينة الزرقاء ومخيمها ... هذه صور لم ترها الملكة نور التي اكتفت بمرويات الامير علي ابن نايف والشريف زيد بن شاكر والاميرة وجدان ... هؤلاء هم شهودها على ما وقع في ايلول ... ومنها مثلا ان عرفات انذر الملك 24 ساعة لمغادرة الاردن ... وان الملك القى القبض فعلا على ياسر عرفات خلال معارك ايلول ولكنه اطلق سراحه لانه - اي الملك - رحيم القلب ... وان عدة قادة فلسطينيين وقعوا في الاسر واحضروا الى الملك فارتموا على رجليه وقبلوها فاعفى الملك عنهم الى اخر هذه القصص والحكايات التي فبركتها خيالات الملكة نور والتي لا تجد لها اي ذكر في اية وثيقة اردنية بخاصة القول ان عرفات وقع في اسر الملك خلال مجازر ايلول وان الملك اعفى عنه مع ان اي \" حمار \" قرأ وقائع ما جرى انذاك يعلم كيف خرج عرفات من عمان في طائرة النميري بعد ان تخفى بدشداشة كويتية .... ومع ان الاردنيين قبل الفلسطينيين يعلمون ان رجولة القادة الفلسطينيين المقاتلين في الميدان - ولا نعني السياسيين الفاسدين - تتنافى مع مرويات الملكة نور .... والا ما الذي دفع الملكة دينا ابنة عم الملك واول زوجة له الى تطليقه والزواج من احد قادة حركة فتح \" صلاح التعمري \" ؟<br />يبدو ان واضع الكتاب للملكة نور كاتب سيناريو لافلام هوليوود لان الملكة تنط في كتابها من لقطة الى لقطة غير مرتبطة بها ... فبعد اسطر فقط من حديثها عن مجرزة ايلول وكيف تدخل الجيش السوري ... نطت الملكة - في صفحة 124 - الى لندن حيث زارت مع زوجها واولادها قصر \" ام قابوس \" الفخم الذي يطل على نهر التايمز والذي تصيف به ام قابوس التي استقبلتها وهي تضع الكثير من الحلي الذهبية وذكرت الملكة جانبا من اوصاف \" أم قابوس \" وكيف انها كانت تسأل عن اسماء اولاد الملك واحدا واحدا وكيف وزعت عليهم الهدايا وكيف انها تحدثت معهم بالشأن السياسي والشأن العام الى اخر هذا المديح لام قابوس وسكرتيرتها \" مريم زواوي \" التي ستصبح فيما بعد من صديقات نور ... وكانت \" القصة \" ستكون اكثر تشويقا لو روت لنا الملكة نور حكاية قابوس والاميرة عالية التي رفضت الزواج منه وهي حكاية سمعتها شخصيا من محمد رسول الكيلاني رئيس المخابرات السابق الذي التقيته في منزل المرحوم احمد طوقان رئيس الوزراء السابق ... يومها وصف الكيلاني السلطان قابوس بأنه قزم واجرب وذلك ردا على سؤال للدكتور فواز طوقان عن سبب دعم الاردن العسكري لقابوس ضد ثوار ظفار.<br />الحديث عن قابوس وامه تجده في مكانين ... ففي صفحة رقم 124 كتبت عن زيارتها الاولى لقصر ام قابوس في لندن ... ولكنها وفي صفحة رقم 242 تطنب الحديث عن ام قابوس بشكل لافت للنظر ربما لان قابوس يأتي من ضمن القادة العرب الذي كانوا يسددون الفواتير الشخصية للملكة نور كما تعترف هي صراحة بل وتؤكد انها وزوجها كانوا \" عالة \" على الحكام العرب .<br />ومع ان \" ليزا \" تشتم معظم الحكام العرب وتحقرهم وتسخر منهم الا انها تكتب عن قابوس باعجاب شديد ... في حين تتهجم على والده السلطان سعيد ويبدو انها استقت المعلومات من زوجته \" ام قابوس \" التي لعبت دورا مشابها للدور الذي لعبته الملكة زين ام حسين ... اي اسقاط الزوج بالتعاون مع الانجليز لصالح الابن البكر ... واذا كانت الملكة زين قد اسقطت زوجها طلال بحجة انه مريض عقليا وحبسته الى يوم وفاته في مستشفى للمجانين في تركيا ... فان \" ام قابوس \" اسقطت زوجها سعيد بحجة انه بخيل وانه حجب سلطنة عمان عن العالم رغم ثراء البلاد وهو الاتهام نفسه الذي وجهه الشيخ زايد لاخيه شخبوط من اجل اسقاطه ... والطريف ان للمخابرات الانجليزية اصبع في وصول الثلاثة الى الحكم ... حسين وزايد وقابوس<br />ليزا تزعم ان السلطان سعيد وضع ابنه قابوس قيد الاقامة الجبرية لمدة ست سنوات كاملة قبل نجاح قابوس في الانقلاب على ابيه ونفيه الى الخارج ... ومن الواضح ان هذه المعلومات مستقاة من \" أم قابوس \" التي تقول الملكة نور في مذكراتها انها فعليا هي التي تحكم في سلطنة عمان .... ثم تضيف ان اخت قابوس - بعد موت امه - هي التي تحكم البلاد وتشير اليها صراحة في صفحة رقم 408 والاميرة العمانية اسمها \" امية بنت سعيد \" ... وتكشف ليزا جانبا غير معروف من حياة قابوس وهي ان السلطان يعزف الاورغ !! لكنها لا تتطرق الى طلاقه من ابنة عمه ... ولا الى بقاءه عازبا ... ولا الى الاشاعات عن شذوذه الجنسي ... وهي معلومات سأكتب عنها في عدد قادم .<br />ليزا جعلت الحديث عن قوة وسطوة \" أم قابوس \" مدخلا للحديث عن الدور الهام الذي تلعبه النساء في القصور العربية وتقول ان هذا الجانب غير معروف للاجانب خارج البلاد العربية لان النساء لا يظهرن الى الجمهور وفي الحياة العامة ... وهذا يؤكد ما سبق ونشرناه في عرب تايمز عن دور النساء بخاصة في مشيخة ابو ظبي بل وليزا نفسها لعبت دورا بارزا في تغيير خريطة الحكم في الاردن وضمنت لابنها ولاية العهد بعد ان خوزقت عمه !! لقد كتبت من قبل عن دور النساء في قصور الحكام العرب واستهجن البعض ما كتبته معتبرا ان فيه مبالغة ... وها هي الملكة نور تعترف وتؤكد هذا الامر ... وكان اخر فصل من فصول المؤامرات النسائية قد كتبته الشيخة مهرة ام ولي العهد الجديد في رأس الخيمة .<br />تعترف الملكة نور ان ام قابوس اغرقتها هي وزوجها بالهدايا ولكن من الواضح انها لم تخصص كل هذه الصفحات عن ام قابوس بسبب هداياها او بسبب قوة شخصيتها وانما بسبب دور قابوس في تغطية المصاريف الشخصية للملكة نور حيث يقول الاردنيون ان فواتير الملكة من مشترواتها في باريس تذهب مباشرة الى الديوان السلطاني وتسدد من حسابات \" ام قابوس \" بخاصة بعد ان هاجمت الصحف الكويتية الملكة نور ... وظهرت جريدة السياسة بعد حرب الخليج بمانشيت كبير يقول : الملك يتسول والملكة تتسوق ... ويبدو ان عدم تطرق الملكة لشيوخ الكويت ونسوانهم ارتبط ايضا بالسبب نفسه الذي جعلها تغير في كتابها او تحذف فقرات او صفحات عن البطيخي ... اي انها حاولت مراعاة تطور الاحداث في القصر الملكي قبل صدور الكتاب ... وكان الملك عبدالله قد حرص وتحت ضغط زوجته رانيا المولودة في الكويت ان يعيد العلاقات مع الكويتيين حتى ان رانيا وبعد اول زيارة لها الى الكويت كملكة قالت للصحف الكويتية :\" انا كويتية \" .<br />صحيح ان الملكة نور تركز في طيات كتابها على انها فقيرة الحال وان زوجها كان يعيش على تبرعات القادة العرب الا انها تنسى احيانا هذا الامر فتصف لنا جانبا من حياة البذخ التي تعيشها مع زوجها الذي ينفق الملايين من اموال الشعب الاردني على مناسبات لا علاقة للشعب الاردني بها ... ففي صفحة رقم 244 من الكتاب تصف الملكة عرسا اقيم قرب مادبا لابن صديقة انجليزية لها وكيف ان الملك نفسه اشتغل \" شوفير \" في العرس حين حمل العروس والعريس - وكلاهما انجليزيان - بطائرته الهليوكوبتر الى العقبة ليقضيا شهر العسل في قارب ... دون ان تقول لنا جلالتها ما الفائدة التي تعود على الشعب الاردني الفقير من الانفاق الباذخ على عرس لولد انجليزي !! وهل دفع الارنيون الملايين لشراء طائرات هليوكوبتر لسلاح الجو من احل هذه الخدمات !!<br />ففي صفحة رقم 134 تورد الملكة باختصار ما تسميها بالاشاعات التي اطلقت عليها وعلى الملك ... من وجود ابن قزم غير شرعي للملك يخفيه في امريكا ... الى وجود ابن اسود لها من علاقة غير شرعية بعشيقها السابق في دالاس .... الى انفاق عشرين مليون دولار لشراء قلادة من باريس .... الى قتل الملكة علياء .... الى شراء الملك لمزرعة في فلوريدا حتى يهرب اليها في حال وقوع انقلاب ... الى حكاية الملك مع احدى سكرتيراته ... وهنا تنسب الملكة الحكاية للاميرة عالية ابنة الملك فتقول: سافرت الى نيويورك بصحبة الامير طلال بن محمد الذي كان يعاني من مرض السرطان وطالت سفرتي الى ان اتصلت بي الاميرة عالية لتقول لي الحقي زوجك ... فقد ارتبط بسكرتيرة تعمل معه و اشترى لها بيتا في عمان والتقى فعلا بأهلها ... وتعترف نور ان علاقتها انذاك مع الملك كانت جافة وتقول انها عادت فعلا الى عمان وفاتحت زوجها بالموضوع وقالت له انها تحبه بما يكفي السماح له بالزواج من اخرى !!... وفي صفحة رقم 282 تتحدث عن اشاعة انتشرت في عمان عن وجود علاقة بينها وبين الممثل سين كونري الذي كان يصور انذاك في العقبة فيلم \" ديانا جونز \" !! وفي صفحة رقم 320 تتحدث عن الاشاعات بقبول الملك لهدايا من السيارات مملايين الدولارات من صدام ... \" الطريف ان احمد الجلبي اكد بعد سقوط بغداد انه عثر على وثائق تؤكد هذه المعلومات \" ... وفي صفحة رقم 333 تقول انها وزوجها عينا محاميا في امريكا لمقاضاة احدى الصحف الامريكية لنشرها جانبا من هذه الاشاعات ... وفي صفحة رقم 337 تقول ان الاشاعات امتدت لتتهم الاردن بتزويد العراق بالاسلحة \" والطريف ايضا انه تبين ان هذه ليست اشاعات فبعد سقوط بغداد عثرت القوات الامريكية والانجليزية على عشرات المخازن وكلها تتضمن اسلحة وذخائر تحمل اسم الجيش الاردني .... تجدر الاشارة الى ان لجؤ الملكات والاميرات في الاردن الى المحامين هو لجؤ صوري يقصد منه تبرير او نفي بعض المعلومات لا اكثر ولا اقل ... ولعل هذا يفسر لجؤ الملكة رانيا الى احد المحامين في نيويورك لتهديد جريدة \" عرب تايمز \" .<br />الصفحات من 354 وما بعدها تحاول الملكة ان تشرح جانبا مما وقع قبل موت الملك من تغييرات جوهرية في منظومة الحكم منها مثلا ان الامير حسن وزوجته كانا فعلا يجهزان لاستلام الحكم ... وان الامير عبدالله ولي العهد السعودي بكى لما رأى الملك حسين ... وتتناول اتفاقية وادي عربة وتكشف النقاب عن ان احد الموقعين من الجانب الاسرائيلي كان قد التقى الحسين وهو طفل حين زار الاردن سرا بدعوة من جده الامير عبدالله ...<br />في صفحة رقم 176 تتحدث الملكة عن حرب كادت تقع بين سوريا والاردن بسبب دعم الاردنيين لجماعة الاخوان المسلمين في سوريا والتي كانت تقوم بعمليات ارهابية في المدن السورية ... وفي صفحة 185من كتابها تشير الى الامير زيد بن الحسين عم الملك حسين وكيف ان الملك رفض ان يسمي ابنه منها \" حمزة \" باسم زيد حتى لا يربط ما بين ابنه وتاريخ قالت انه لا يسر للامير زيد ... والعجيب ان نور تتهم ابن الامير زيد \" الامير رعد \" الذي كان وزيرا للبلاط بكشف العلاقة التي اقامتها مع الملك قبل الاعلان الرسمي عن الزواج ... ويبدو انها هنا تنتقم لنفسها من رعد بالحط من ابيه زيد الذي تزوج من كاتبة تركية اسمها \" فخر النساء \" بعد ان طلقها من زوجها يوم كان سفيرا للعراق في المانيا وانجب منها ابنه رعد ... والطريف ان رعد هذا يطالب هذه الايام بعرش العراق !!<br />استطيع ان اؤكد لكم ان من يقرأ كتاب \" نور \" دون ان يكون ملما بالوضع في الاردن سيخرج بانطباع سيء عن الشعب الفلسطيني فقد حقرته ووصفته بابشع الاوصاف ونسبت اليه الكثير من الاعمال السيئة ... مع ان نور تعترف بان اعز صديقاتها هي سهى شومان وهي فلسطينية وفي معرض الايقاع بين المصريين والفلسطينيين تزعم نور في صفحة رقم 204 من كتابها ان الفلسطينيين والايرانيين والعراقيين هم فقط الذين فرحوا بموت السادات !!<br />في صفحة رقم 225 من الكتاب وفي معرض الحديث عن حالتهم المالية السيئة وكيف ان زوجها المسكين كان فقيرا - طبعا هي لم تتطرق الى المرتب الذي كان زوجها يتقاضاه من المخابرات المركزية التي عمل لصالحها بوظيقة عميل وبالاسم الكودي مستر بيف - تتحدث الملكة عن كرم زوجها الذي - كما تزعم - باع قصره في لندن حتى يرمم المسجد الاقصى !!<br />من يقرأ كتاب نور يدرك على الفور ان الملكة كانت \" تغار \" من السيدة مبارك حرم الرئيس المصري وباستثناء ابراهيم سعدة الذي رد على الملكة نور فورا بعد صدور كتابها لم نقرأ لاي كاتب مصري تعليقا على هذا الكتاب المهزلة الذي تعمدت فيه الملكة الاساءة الى الشعب المصري والى قيادته ... ففي صفحة رقم 237 من الكتاب تزعم نور ان الرئيس المصري حسني مبارك اشتكى لها من ممارسات جيهان السادات والدور الذي كانت تلعبه باعتبارها \" السيدة الاولى \" وكيف ان زوجته سوزان تحرص ان لا تلعب الدور نفسه ... ابراهيم سعدة رئيس تحرير أخبار اليوم رفض الرواية التي ذكرتها الملكة نور حول جهود الملك حسين والرئيس المصري حسني مبارك بشأن إقناع الرئيس العراقي المخلوع صدام حسين بالانسحاب من الكويت بعد غزو قواته لها.<br />نور ذكرت أن الملك حسين طار بعد غزو صدام للكويت الى الاسكندرية للتشاور مع الرئيس مبارك وبعد عودته أخبرها أنه حصل علي تعهد من الرئيس مبارك بأن الجامعة العربية لن تدين أو تواجه الرئيس العراقي بأي شكل من الأشكال الى أن يقوم زوجها بزيارة بغداد لإقناع صدام حسين بالانسحاب من الكويت. وأضافت الملكة نور كان مبارك يعرف أن زوجي أكثر القادة العرب فهما لجاره العراقي. وكان الوقت ملحا، فقد تزامن مع اجتماع وزراء خارجية الدول العربية في مقر الجامعة العربية بالقاهرة، حيث مارست الكويت والسعودية إضافة الى إدارة بوش ومارجريت تاتشر ضغوطا قوية على وزراء الخارجية العرب لإدانة العراق! لكن الملك الحسين كان يعرف أن صدام حسين لن يستمع الى صوت العقل إذا شعر بأنه محاصر. ولذا كرر لجورج بوش، ومبارك، وفهد:«امهلوني 48 ساعة فقط». الرئيس مبارك لم يكتف بالموافقة، بل زاد قائلا لوزير الخارجية الأردني:«خذ طائرتي الآن واذهب الى اجتماع الجامعة العربية في القاهرة لكي تكون مستعدا هناك». وأضافت الملكة نور: اجتماع الملك الحسين بصدام حسين صباح اليوم التالي، أي 3 أغسطس كان ناجحا، وأخبرني زوجي لاحقا أن صدام حسين كان مسرورا بالهزة القوية التي أحدثتها خطوته لدى الدول العربية، وقد بدأ بالفعل في التخطيط لسحب قواته من الكويت!! والبرهان على ذلك كان السحب الفوري لواحدة من الفرق العسكرية.<br />وقالت الملكة نور: وعندما اتصل زوجي بمبارك لإبلاغه النبأ السار، فوجيء بأن وزير خارجية الأردن وجد لدى وصوله الى اجتماع الجامعة العربية أن نظيره المصري د. عصمت عبد المجيد كان يقود الحملة لإصدار إدانة عربية للعراق. هناك تفسيرات متباينة قدمت لاحقا لهذه الضربة التي استبقت النجاح الذي حققه زوجي مع صدام حسين. لقد أصدر عدد من القادة العرب تعليمات الى وزراء خارجيتهم المجتمعين في القاهرة بإدانة العراق على رغم معرفتهم الكاملة بنجاح الاجتماع الذي عقده زوجي مع صدام حسين!!. وشهدت الأيام التالية تحرك الصحافة المصرية ضد زوجي، وتصويره على أنه «شيطان»، وهو ما لم أفهمه مطلقا.<br />في رده على رواية الملكة نور كشف ابراهيم سعدة بعض الاسرار التي احاطت بهذه القصة قائلا ان الرئيس مبارك ايقن ان صدام لن ينسحب من الكويت وانه يراوغ لكسب الوقت. واستخلص سعدة في المقال الى أن الملك حسين لم يحصل من صدام حسين على موافقته على الانسحاب من الكويت، لأن موضوع الانسحاب لم يتطرق اليه الحديث خلال اللقاء الذي تم بين الحسين وصدام في بغداد.. باعتراف الملك حسين في حديثه التليفوني مع الرئيس مبارك بعد عودته من لقاء الرئيس العراقي.<br />في صفحة رقم 306 تتناول الملكة حكاية غزو صدام للكويت وتقول ان الامريكان اعطوه الضؤ الاخضر ثم تبث في الكلام الكثير من السم في الكثير من العسل وهي تتناول الدور المصري فتحاول تشويهه وتنسب الى الرئيس المبارك الكثير من الاقوال والافعال التي نفاها ابراهيم سعدة ... وكيف ان الرئيس مبارك اتهم الملك حسين بالتواطؤ مع صدام وانه كان يعرف بأمر الغزو قبل ان يقع بل وان جزءا من الجيش الاردني كان يقاتل مع العراقيين في الكويت ... وفي صفحة 314 تزعم الملكة ان الرئيس الجزائري وملك المغرب اخبرا زوجها ان الرئيس مبارك هو الذي ينشر اشاعة تورط الملك مع صدام !!.. وفي صفحة رقم 316 من الكتاب تعرض الملكة حديثا قالت انه دار بينها وبين السيدة سوزان مبارك خلال حرب الكويت واعتراض الحكومة المصرية على ملاحظات الملكة نور التي قالتها للسيدة مبارك وتعليق زوجها على ان هذه هي طريقة المصريين الذين يريدون تفسير او تبرير موقفهم من الاردن !!<br />تواصل الملكة نور هجومها على الرئيس المصري في صفحات 318 و 319 .<br />الشيخة فاطمة الزوجة الرابعة للشيخ زايد تحظى بجانب من هذه المذكرات ... ومع ان الصورة التي رسمتها الملكة للشيخة فاطمة تبدو صورة كاريكاتيرية بخاصة زيارة فاطمة لعمان وهي تضع البرقع وطرد جميع الرجال من القصر واستبدالهم بالشرطة النسائية الى اخر هذا الوصف المضحك الا ان نور تعترف بان فاطمة ذات تاثير قوي على منظومة الحكم في الامارات .. وانها كانت تغدق الكثير من الهدايا عليها وعلى اولادها .<br />كتاب الملكة نور ظهر تقريبا في وقت واحد مع كتاب السيدة هيلاري كلينتون ... لكن الفرق بين الكتابين كبير ... فالسيدة كلينتون احترمت في كتابها عقل القاريء ... بينما تعلمت ليزا الحلبي \" نور \" الدجل والفبركة ... في كتاب هيلاري الكثير من الاسرار التي توضح جدانبا هاما من اهم الاحداث السياسية التي وقعتع في عهد زوجها بينما تنط \" نور \" عن هذه الاحداث بشكل عابر وتبسطها او تتناولها بسذاجة كما فعلت بالنسبة لمجازر ايلول التي اسفرت عن قتل الاف الفلسطينيين بينما لا تشير جلالتها الا الى الشريفة \" جوزة \" شقيقة الشريف زيد بن شاكر وكأنها الضحية الوحيدة لهذه الحرب .<br />الكتاب مليء بعد هذا بفقرات تؤكد ما قلته من ان واضع الكتاب هو قطعا كاتب سيناريو في افلام هوليوود ... فالملكة مثلا تتحدث عن موقف تعرضت له في لندن خلال شهر العسل ففي ذروة شهر العسل في لندن اختفت الملكة لانها رغبت في تغيير الأجواء حسب قولها والخروج لمشاهدة الأصدقاء. وبدلا من ان تزعج رجال الأمن في «غرين هاوس» القصر الرئاسي في لندن خرجت بهدوء الى الشارع واستقلت سيارة عمومية وذهبت للالتقاء باحدى الصديقات.<br />وما ان همت بالعودة حتى اكتشفت لذهولها انها لا تعرف العنوان ولا رقم الهاتف. الملكة نور حاولت مع صديقتها الاتصال بالسفارة الاردنية لمعرفة مكان سكن الملك، الا ان الوقت كان متأخرا والدبلوماسيون كانوا قد غادروا أماكن عملهم. وفي نهاية المطاف استطاعت الوصول للعنوان، وما ان وصلت المكان حتى وجدت الباب مغلقا فاضطرت للوقوف مطولا الى ان سمع أحد الحراس الجرس فجاء لفتح الباب لها.<br />من هي نور الحسين او ليزا حلبي او الملكة نور؟<br />الملكة نور اسمها الاصلي ليزا وهي ابنة مهاجر سوري من حلب اسمه نجيب الحلبي ولد لام امريكية في دالاس واصبح رئيسا لشركة بان امريكان قبل ان يطرد من منصبه وتحمله الشركة مسئولية الخسائر التي اصابتها ... وقد عملت نور او ليزا في شركة عالية للطيران بعد تخرجها من جامعة بريستون الامريكية .<br />ولدت نور في نيوجيرزي لام سويدية الاصل اسمها دوريس لانكوست ... وقد التقى بها الملك حسين لاول مرة في عمان حيث كانت تعمل كمديرة لدائرة التصميم في شركة عالية للطيران .<br />وللملكة نور شقيق اسمه كريستيان عمره 50 سنة وهو يعيش في \" مينلو بارك \" بكاليفورنيا ويعمل كمدير لاحدى شركات الكومبيوتر ... ولها شقيقة اسمها \" الكسا \" عمرها 48 سنة تعيش بالقرب من واشنطن .... وقد انجبت نور من الملك حسين اربعة ابناء هم حمزة - ولي العهد الحالي - وعمره الان 23 سنة وهاشم - وعمره 22 سنة - وايمان - وعمرها 20 سنة - وراية - وعمرها 18 سنة - .<br />وكان رئيس المخابرات السابق سميح البطيخي محسوبا على الملكة نور من خلال زوجته الانجليزية \" جيل \" التي كانت تعمل وصيفة لنور ... ويقال ان جيل كانت تترقب الفرصة لخطبة ابنة نور \" ايمان \" لابنها من سميح البطيخي لكن تورط البطيخي بفضيحة مجد الشمايلة وضع حدا لهذه العلاقة .<br />لقد ارتبط اسم الملكة نور بالعديد من التطورات التي وقعت داخل القصر الاردني قبل وفاة الملك وخلال مرضه ... فقيل ان رئيس الوزراء السابق عبد الكريم الكباريتي كان من \" زلمها \" وان صراعه مع الامير حسن كان بايعاز من \" نور \" ... كما كانت علاقة نور بالاميرة \" ثروت \" زوجة ولي العهد انذاك الامير حسن شبه مقطوعة وكان قرار الاميرة ثروت بتغيير ستائر القصر خلال مرض الملك حسين هو القشة التي قصمت ظهر البعير لان الملك تأثر بنميمة البطيخي وزوجته ورجال نور في القصر فاعتبر تغيير الستائر محاولة لخلافته وهو حي .<br />جريدة يديعوت احرونوت الاسرائيلية عرضت كتاب الملكة نور بشكل مختلف اختارت منه فقرات لم اتطرق اليها ... قالت الجريدة ان نور هو الاسم الذي أطلقه عليها الملك حسين، أما اسمها فهو ليزا حلبي، وهي مهندسة معمارية اميركية لأب سوري - لبناني واسمه نجيب حلبي، وهو رجل طيران مخضرم، ولأم سويدية الأصل واسمها دوريس. نور شاهدت الملك لأول مرة من خلف عدسة الكاميرا عندما كان عمرها 26 سنة. ليزا أو نور كانت متوجهة من ايران الى الولايات المتحدة فاقترح عليها والدها ان تعرج على الاردن لمقابلته.<br />وفجأة ظهر الملك وحاشيته في المطار حيث كان مع زوجته الثالثة عالية وابنته الكبرى. والدها الذي كان يعرف الملك جيدا ألقى اليها بالكاميرا وطلب منها ان تلتقط له صورة مع الملك. وبعد ان التقطت الصورة تقدمت لمصافحة الملك الذي صافح والدها وابتسم. بعد هذا اللقاء بثلاثة اشهر جاء خبر وفاة عالية في حادث.<br />نور تتحدث عن بداية حكاية الغرام بينها وبين الملك وتقول انه كان أعزب مطلوبا حيث حاولت كل نساء العائلات الميسورة في الاردن تزويج بناتهن له. نور حصلت على عرض عمل في شركة الطيران الاردنية في ذلك الحين. بعض الأصدقاء الذين عرفوا بميولها الصحفية دعوها للمشاركة في مؤتمر صحفي مشترك مع وزير الخارجية الاميركي سايروس فانس. وما ان لاحظها فانس حتى تعرف عليها على خلفية معرفة سابقة وقدمها للملك.<br />في اليوم التالي اتصل بها مسئول البلاط وقال لها ان جلالة الملك يدعوها لمأدبة غداء، المأدبة التي كانت بداية لسلسلة وجبات في القصر الملكي استغرقت ست ساعات، وفي لحظة معينة من اللقاء عرفها على أولاده الصغار، هيا ابنة الثالثة، وعلي ابن السنتين، وعبير ابنة الخمس سنوات اليتيمة الفلسطينية التي فقدت والدتها إثر سقوط دبابة اسرائيلية على منزل عائلتها. الملك طلب منها ان ترافقه في جولة في قصر الهاشمية وعرض عليها ان تقدم له النصح والمشورة باعتبارها مهندسة معمارية حول كيفية ترميم القصر ليصبح ملائما لعائلة ممتدة.<br />ليزا التي كانت أنهت عقد عملها كمهندسة معمارية في شركة الطيران الايرانية شخصت المشاكل المعمارية الا انها اعتذرت قائلة انها لا تملك خبرة كافية لمعالجة المشاكل الهندسية المدنية. الملك ذهل من رفضها لانه لم يعتد ان يُرفض له طلب.<br />على هذا النحو بدأت حكاية غرام سرية حافلة بلقاءات متقاربة، ليزا كانت تتوجه الى القصر في كل مساء وتنضم الى الملك لايواء الاطفال في فراشهم قارئة لهم القصص والأغاني الانجليزية.<br />على هذا النحو تواصل برنامج حياتها اليومي من السهر في القصر الى البيت فالتوجه للعمل في الصباح الباكر، وهكذا دواليك. وزن ليزا أخذ يتناقص لان الملك كان يلتهم طعامه بسرعة هائلة فكانت تخجل من البقاء على الطاولة لوحدها، أما ثلاجة الشقة فكانت فارغة لانها لم تجد وقتا لشراء الحاجيات.<br />الملك اعتاد الاتصال معها بعد ان تعود الى منزلها مستخدما شيفرة سرية اذ أسماها في هذه الشيفرة «نوفمبر». أما هو فكان اسمه «هوتل تانغو» وهي الأحرف الاولى من اسمه.<br />نور تتحدث في كتابها عن الوحدة التي كانت تعيش بها وعن قرارها عدم إشراك أحد في سرها، فعمان كانت رمالا متحركة من النمائم، والحكايات حول الملك ومن ستكون زوجته القادمة. والدها لاحظ ما يحدث بينها وبين الملك في احدى زياراته الى الاردن، وحذرها من المجتمع الاردني المغلق والحكايات الدائرة في القصر الملكي. وبعد ثلاثة اسابيع من ولادة حكاية الغرام هذه قال الملك لليزا التي كانت تقشر له تفاحة انه يريد التحدث الى والدها. ليزا طلبت من الملك مهلة للتفكير في العرض فهي قد وقعت في غرامه حيث انها لن تلتقي أبدا برجل ساحر وجذاب وذكي مثله من ناحية، الا انها لم تعرف اذا كانت ملائمة لأن تكون زوجته الرابعة من الناحية الاخرى. الامور التي كانت تحيرها هي: هل ترغب في ان تكون زوجة رابعة لشخص ما؟ وماذا بالنسبة للفجوة العمرية بينهما «16 سنة» وكيف ستتعايش مع أولاده الثمانية حيث ما زال اربعة منهم اطفال صغار محتاجون للعناية اليومية؟ وما هو معنى ان تكون المرأة زوجة للملك؟ وهل سيطرأ تغير دراماتيكي على الحياة التي تبنتها لنفسها؟<br />الأميرة بسمة، شقيقة الملك، كانت الشريك الوحيد في هذا السر، واقترحت عليها ان تفكر بالأمر جيدا. ليزا حاولت إشراك الملك في حياتها السابقة حتى يقرر اذا كانت ستستطيع ان تنخرط في الحياة الملكية. الملك فاجأها بقوله ان حياتها السابقة لا تعنيه ولا تهمه ورفض معرفة ذلك.<br />ليزا تلقت الدرس الاول في الحياة الرسمية في فترة التردد هذه من خلال دعوة لقضاء نهاية الاسبوع في القصر الملكي في العقبة حيث استضاف فرح ديبا زوجة الشاه السابق. الملك تحول خلال اللقاء الى شخص بارد ورسمي ولم يعد لطبيعته كشخص دافيء ومغازل الا بعد مغادرة فرح، حيث كشف النقاب لها عن ان زوجة الشاه قد عرضت عليه تحمل مسئولية أولادها اذا حدث شيء لها ولزوجها. الملك لم يكن يعرف في حينه ان الشاه مصاب بمرض خطير.<br />صبر الملك نفد بعد 18 يوما من الانتظار حيث فاجأها بعد ان انتهت من إيواء الاطفال وقال لها ان الوضع لا يمكن ان يتواصل على هذا النحو وانه سيقوم بالاتصال بوالدها.<br />«أنا متفاجيء بعض الشيء» قال نجيب حلبي على الهاتف وهو يسمع صوت الملك حسين قائلا له «يشرفني ان أطلب يد ابنتك». الوالدان طرحا تحفظات من هذا الزواج وطلبا من نور ان تفكر جيدا. والامر الذي أقلقهما هو التحديات التي تنتظر ابنتهما من هذا الزواج.<br />والدتها عبرت عن قلقها من ان ابنتها ستسكن بعيدا عنها ومن الفجوة الحضارية بين المكانين. ولكن رغم التحفظات وافق الوالدان وتوجهت والدتها الى باريس لشراء ثوب الزفاف. وحتى تلك اللحظة كان القرار سريا، الا ان الملك قرر اعلان الامر فأعلم أولاده والأمير رعد بن زيد الذي أوصل الامر للبلاط، وسرعان ما علمت عمان كلها بالمسألة.<br />سفر نور مع والدتها الى باريس ألغي بعد نشر الخبر، وبعد يومين نشر بيان رسمي حول زواج الملك الوشيك الامر الذي حول نور فجأة الى رهينة اذ نقلت حاجياتها على عجل الى القصر وتغيرت حياتها دفعة واحدة ولم يكن بامكانها حتى ان تودع زملاءها في العمل. في هذا الاطار عقد مؤتمر صحفي لاشهار الأمر وأخذت الصحافة تنبش في صغائر الامور مثل الفرق في السن وكون الملكة أطول من الملك بخمسة سنتيمترات. الصحافة أخذت تطاردها منذ تلك اللحظة، وهي من ناحيتها ترفض اجراء اللقاءات الا انها اضطرت في نهاية المطاف الى اجراء لقاء مع مجلة «بايبل» الاميركية نزولا عند رغبة المستشار الاعلامي في القصر.<br />إلا انها كانت تجربة قاسية زادت من عدائها للصحافة التي أخذت تنشر الاشاعات والأقاويل حول العروسين بلا هوادة ولا شفقة لدرجة ان الملك أراد تقديم دعوى تشهير ضد الصحيفة الاميركية التي ادعت ان نور مغرمة بالممثل شون كونري الذي كان يمثل في فيلم «انديانا جونز» في البتراء وان الملك اضطر لارسال حراسه لاعادتها الا انها رفضت ذلك. ومن الحكايات التي ابتدعتها الصحافة حولها ان الملكة زين، والدة الملك حسين، هي التي دبرت حادثة المروحية للملكة عالية، أو ان الـ سي.آي.ايه قد دبرت المسألة حتى تقوم بزرع نور العميلة الاميركية في القصر الملكي.<br />أو الادعاء بأن للملكة نور طفل أسود في اميركا وان والده يبتزها مهددا بفضح أمرها. كما قالوا انها اشترت جزيرة في الشرق الأقصى أو انها اشترت بوتيك راقيا في ماديسون في نيويورك حيث تباع ملابسها المستعملة.<br />مراسيم الزفاف استغرقت خمس دقائق فقط، نور أصرت على ان يكون ثوبها بسيطا جدا. وفي صبيحة اليوم التالي اعتنقت الاسلام من دون ضغط من الملك وانما كان القرار نابعا منها اذ رغبت في السير في أعقاب الملك في عقيدته. اقتراح أحد اصدقاء الملك كان استبدال اسم ليزا بـ «اليسر» وهو اسم ملكة فينيقية. الا ان الملك رفض لانه قريب من كلمة «اليسار»، وفجأة اقترح تسميتها «نور الحسين».<br />شهر العسل كان في فندق في احدى غابات ميريلاند، وغرق العريسان في السعادة في جناحهما بعيدا عن الحراس الذين تركوهما لوحدهما، الا ان هذه السعادة أوشكت ان تودي بحياتهما.<br />في مرحلة معينة من الأمسية سألت نور زوجها اذا كان يشم رائحة شيء غريب، فأجاب بالنفي، فما كان منها الا ان توجهت للنوم، وعندما كانت غارقة في نومها استفاقت على صوته وهو يهزها بقوة «إنهضي هناك حريق». هذا الحريق أوشك على ان يودي بحياة الملك والملكة اذ تبين ان المدفأة معطوبة وقد أوشكت على الانفجار.<br />نور تتحدث ايضا عن الجانب المعقد من حياتها مع الملك حسين، اذ انها بزواجها منه قد أخذت على عاتقها مسئولية تربية أبنائه الثمانية من زوجاته الثلاث. عبير الطفلة التي تيتمت مرتين من أمها البيولوجية ومن أمها المتبنية عالية سألتها ذات مرة: اذا توفيت أنت فهل ستقوم الخالة اليكسا «شقيقة نور» بتبنينا.<br />وخلال خمس سنوات ولد للملكين اربعة اطفال.<br />مهمة الملكة في متابعة الاولاد كانت معقدة اذ ان الأمهات في الصورة، وهذا أعطاها شعورا انهم يقومون باختبارها كل الوقت، ورغم رغبة الجميع بانجاح المسألة الا ان سوء الفهم حدث في مرات عديدة. في احدى الرحلات قام الاولاد بانتفاضة عائلية وقدموا لهما لائحة اتهام من 54 بندا.<br />نور تكشف في كتابها المحاولات العديدة لاغتيال الملك حيث أوشكت طائرات ميغ على اسقاط طائرته في أجواء سوريا. وان عرفات حاول تصفيته، وان الطباخ المصري قام بوضع حامض قاتل في طعامه.<br />وفي مرة اخرى حاول مساعد الطباخ المجند من قبل المخابرات السورية تسميم طعام الملك بكميات حولت مجموعة من القطط الى جثث هامدة في باحة القصر. كما وضعت كمائن لسيارة الملك في عمان، وفي احداها أطلقت النار على الملك. الملكة تقول انها حاولت ايضا حماية زوجها وحرصت في المناسبات الرسمية على الوقوف من خلفه في موقع استراتيجي للمساعدة في حمايته بجسدها اذا ما حاولوا قتله"
