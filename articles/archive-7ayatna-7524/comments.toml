[[comments]]
order = 471
subject = "الله اكبر من الكل"
author = "انا عربي"
text = "يا جماعة لا فرق بين عربي على اعجمي الى بالتقوى<br />ما حد فكر فيكم انو انا صليت اليوم ولا لأ بس نازلين ببعض من هالكلام الوسخ<br />الكلام هاد بدك على كل واحد فيكو ان كان فلسطيني ولا اردني ولا باكستاني ولا ايا كان<br />الله سبحانه وتعالى قال لا فرق بين عربي على اعجمي الى بالتقواه يا ناس احنا ما منكون شيء بدون الله سبحانه وتعالى تعالو نخلص من هالكلام ومنضل احنا عرب يعني مافي داعي ابدا لهالكلام لحتى نفش غلنا ببعض انا فلسطيني بس عندي اعز صديق الي وهوي اردني وابدا ما منحكي بهاي الامور الله وحدة يلي بيعرف ما في النفوس وان الاعمال بالنيات وكل واحد المهم ينتبه على حالو لانو هالكلام انت يا اخي يلي محاسب فيه وبتمنا تحكو بعقل لانو القيامة قربت ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

