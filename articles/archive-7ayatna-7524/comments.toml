subject = "فلسطين اولا غصبا عنكم يا ارادنة يا كلاب يا نــوَر يا خرة , بصير خير بس"
author = "أحمد الطراونة ... فلسطيني وبفتخررررررررررر"
text = "اف مستغرب كيف صار للاردنة لسان يحكو فيها اولاد السفلة المجرمين القتلة ابناء القرده الخنازير , على فكرة أرذل شعب بالعالم كلو<br />هو الشعب الاردني بس خليها عل الله لانكو فعلا شعب حقير وسافل وما بنطاق<br />طبعا انا مش مستغرب اني هلاقي هيك مسبات لانو هاد من صفاتكو يا بجم يا سقط يا ولاد الحرام , وبحيي كل فلسطيني هونه<br />وفلسطينية بنفس الوقت من كافة اناحاء العالم اللي قامو بحرق الاردنين وتفجيرهم<br />بس طبعا هدا النظام الهاشمي عفوا الهامشي اللي علمكو الحقد والحسد<br />ولسة بالضبط دوبي قاري عن موضوع ضم الضفة مع الاردن , مستحيييييييييييييييييييييييييييييييل والف لا بانو الضفة تنضم تاني مرة مع الاردن , جاي عبد الله الجرو ابن الكلب حسين يكمل مسيرة ابوه الخنزير المخسسوف بقبرو عليه لعنة الله اللي مسمي حالو<br />شريف , يا عمي احنا فلسطينية وما احد بجيب اظفر رجلنا, وكندرة فلسطيني بتسوى الشعب الاردني كلو لانكو شعب جبااااان<br />ومتخلف بصراحة , ودوبي لسة قاري بعض التعليقات مش كلها وفي من ضمنها تعليقات المنيوك القحبه محمد نواف<br />طبعا لانك اردني وما بتفرق معك هيك مسبات كاتب يا كلب بانو هناك فلسطينين يريدون اللعب بالنار , من بلش بالتعليقات يا خنزير يا تور ؟ إحنا ولا انتوا يا بجم يا نور يا اولاد الساقطة<br />بديش اكتر كلام خلاص اجاني الصداع , وعلى العموم أنا فلسطيني وبفتخر , والملك الكلب الحقير تبعكو اللي عامل حالو شريف<br />رايح مشتري فندق طيار بالسماء لما تطلع روحو والشعب يموت من الجوع , بكفي خلاص فضايحكو ملأت الكون كلو<br />فلسطيني وبفتخر واللي مو عاجبو يوكل خرى قبل ما ينتحر وينتحر ويكتب على قبرو واحد ميت من الغل والقهر حاولت أتحدى<br />فلسطيني وما قدرت , وأعلن شكري لكل الفلسطينية هونه وارجو المزيد من التعليقات المفحمة لهذا الشعب البلطجي الحقير الخراااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا<br />خرا خرا خرا خرا خرا خرا خرا خرا خرا خرا على الأردن خرا خرا خرا خرا خرا خرا خرا خرا خرا خرا خرا خرا خرا خرا على الأدن"
