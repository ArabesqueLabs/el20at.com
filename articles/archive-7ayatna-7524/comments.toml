[[comments]]
order = 64
subject = "ليس كل الناس ملائكة"
author = "قول الحق ولو بقطع السيف"
text = "اخواني تعليقي راح يكون بعيد جدا عن المجاملة او مختلط بالشعارات الرنانة انا انسانة امنت كثيرا ولازلت اومن بالقضية الفلسطينية وان كل مطالبهم هي مشروعة لكن انا ضد تقديس الشخص الفلسطيني. الانسان الفلسطيني مثله مثل غيره من البشر يخطا كما يخطا كل الناس يكفي فقط ان تشوفو شو عاملين في النت وفي الشات ومستغلين لاوضاعهم عشان يوقعو ببنات بتعاطفو مع اوضاعهم انا بعرف فلسطيني بيضحك على بنتين واحدة بحكيلها بحبك وانا فقير لدرجة انها بتبعث لو فلوس بشكل شهري ثاني يوم يكلم الثانية يحكيلها انا بحبك ومابعرف غيرك .الشباب الفلسطيني ماعاد بدو يقاتل ولا يقاوم صار بدو يتعرف من النت على بنات اوضاعهم كويسة ويطيرو عندهم لبلدانهم عشان يغيرو اوضاعهم لكن هدا لايعني ان القضية الفلسطينية ليست حقيقية اتمنى من الله ان الناس تصحى وتفهم كويس الدنيا ونبتعد عن تقديس البشر كلنا خطاؤون"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
