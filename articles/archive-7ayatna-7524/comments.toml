order = 388
subject = "الله يحيي كل فلسطيني"
author = "يوسف البحيصي ( فلسطيني و الكل مقهور مني )"
text = "سلام الله على كل فلسطيني ولا سلام على من يكره فلسطينيا لإنه ليس على ملة الإسلام<br />و أحب أن أحيي كل فلسطيني شارك بالتعليقات الرائعة التي ردت السفهاء الأنذال أولاد الزناة<br />و أشكر الأخت بنت يافا على تعليقها لابن الزناة الذي حرف في القرآن و هذا أكبر دليل على قهره و على مكيدته و هذا أيضا أكبر دليل على أن كل فلسطيني أشرف منه و من عشيرته كلها لإن عشيرته كلها أولاد حرام و لإنه منها .<br />و أحب أن أعيد و أقول لكم الأردن هي صحراء فلسطين و ارجعوا و ابحثوا عن أصل الأردن<br />و الفلسطينيون هم الذين دافعوا عن الأردن في غورها و في جنوب لبنان و في حتى العراق أوائل الحرب و أنا لا أمن على إخواني العراقيين بهذا لإن الفلسطيني خلق للكفاح و الصمود في كل مكان و هذا دليل على إخلاصه للعرب بعكس العرب تجاهه و خيانة الأنظمة العربية له و خوفها من أمريكا و إسرائيل على حساب الشعب الفلسطيني الأبي المقدام<br />و السلام على كل من هو عربي أصيل ولا سلام على من هو من أردني من يهود العرب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

