subject = "الفلسطينية السقايط"
author = "اسامة الزواهرة وقصي السعيدات"
text = "اولا انا مش عارف شو بدي اقول عن الفلسطنية الصرامي اولاد الحرام مكاتل العشائر الاردنية الا خيرهم من لحم اكتافنا ولكو يا سقايط كيف تتجرأو انكو تجيبو سيرة الاردنية بلعاطل ما بكفيكو المطسا الي انتسطوها بالجامعة الاردنية من الزواهرة والخلايلة والخوالدة والخزاعلة وكل عشاير بني حسن انتي يا ديانا كرزون انك وحدة شرموطة وقحبة ومنيوكا انت وكل فلسطيني ابن حرام من شباب الاردنية وانت يا جرسون(كلسون) اصلا كل الزواهرة والعجارمة والأردن فوق راسك وراس كل واحد زي امثالك<br />مع تحيات اسامة الزواهرة وقصي السعيدات (العجارمة والزواهرة )<br />اسامة :xpress3006@ yahoo"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

