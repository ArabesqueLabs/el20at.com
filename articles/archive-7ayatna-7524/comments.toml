text = "لن يختلف اثنان على خلق وسلوك ملوك الأردن منذ بناء هذه المهلكة بعد أن كانت عبارة عن ضفة لنهر الأردن .<br />ولكي يعيد التاريخ نفسه من جديد ؛ تمخضت الحياة بولادة أحفاد أبي لهب الهاشمي؛ فهم مازال يدعون هذا النسب ؛ الذي أدعوه لأهميته عند العرب والمسلمين بصورة خاصة؛ ولأنه نسب الرسول محمد (ص ). ولكن وكما يعرف الجميع أن أبي لهب عم الرسول الأعظم ؛ فليس هنالك خلاف على أن هؤلاء هم أحفاده أبي لهب بما أنهم تمسكوا بهذا النسب الهاشمي الكريم !!<br />وكما يقول المثل الشعبي العراقي والموروث عن أجدادنا ( خلف الملعون كلبا مثل أباه ) وهذا المثل البسيط والكبير المعنى لايبتعد عن هؤلاء حكام المهلكة الأردنية الهاشمية اللهبيه !!.ومنذ اليوم الأول لتسلط هذه العائلة السيئة الصيت والسمعة مقاليد الحكم في الأردن والى يومنا هذا ؛ والشعب الأردني بكل أطيافه ؛ والشعب العربي بكل أديانه يعاني من التخاذل والعمالة لملوك هذا البلد العربي المسلم!! حيث كان الملك طلال والذي اتهمته زوجته وأبنه وقادة الحكومة البريطانية ؛بالجنون ونفيه إلى تركيا لكي يتسنى للحسين بن طلال من زمام أمور الحكم في الأردن ؛ والذي استمر حكمه لسنوات طويلة نال منها الشعب العربي كؤس الخيانة والتآمر المستمر من هذا الملك ( السفلسي ).<br />ولم ننسى مواقفه أثناء الحروب العربية الاسرائيلية ؛ وما هو حجم الدور الذي كان موكلا إليه؛في نقل كل التحركات العسكرية والسياسية للحكومات العربية ونقلها للجانب الاسرائيلي بكل أمانة الأمناء ؛ في الوقت الذي كانت به إسرائيل في موقع المحارب لهذه الجيوش العربية ؛ والتي كانت بينها وبين الانتصار عمالة هذا السفلي المستمرة والتي أجهضت الانتصار العربي تحت انتصار القوة العسكرية الاسرائيلية ؛ وانتهت الحروب العربية بهزيمة نكراء مازالت طابعة على جبين هذه العائلة الحاكمة في عمان؛ وكان يستحق عليها هذا الملك أن يصنع له تمثالا من الذهب في الكنيست الإسرائيلي ؛ هذا ماذكره رئيس حزب العمل ( شمعون بيريز ) في مذكراته .!!.ولو انتقلنا الى عمالته ضد الشعب العراقي خصوصا؛ لوجدنا أن الدم العراقي الذي أهدر في الحرب العراقية الإيرانية والغزو الكويتي ؛ هو ثمن لثورة عبد الكريم قاسم سنة 1958 والتي أنهت الحكم الملكي في العراق ؛ وعلى أثر هذه الثورة العراقية التي قتلت أبناء عمومته ؛ أصبح الحكم العراقي جمهوريا حرا بقيادة الزعيم الراحل الخالد عبد الكريم قاسم ؛ ولكن الملك السفلسي ضمر شرا ليس لقاسم فقط ؛ وإنما لعموم الشعب العراقي ؛ حين خاطبهم قائلا : ( سأجعل في كل بيت عراقي نائحة سوداء ) وفي بداية الثورة الايرانية ؛ قال لنفسه: هذه هي فرصتي التي يجب أن استثمرها لدمار العراق وأهل العراق؟!. ودعي صدام حسين النائب في حكومة البكر لزيارة الأردن ؛ وكان لقاء الزرقاء القاتل عام 1979. ولكن هذه المرة كانت العمالة مشتركة مع الملك خالد بن عبد العزيز على العراق ؛ في توريط العراق بإشعال الحرب ضد الجارة إيران ؛ وكانت حرب غير متكافئة الأخلاق من كل الجوانب الإنسانية والسياسية منها؛ وتم للملكين المحروقين ولأمريكا ما كانوا يتمنوه ؛ ودخل العراق الحرب ونصبت في كل بيت عراقي نائحة سوداء مثل ما أراد الملك السفلسي ؛ لكي يأخذ بثار أبناء عمومته ملوك العراق السابقين بعد أن عزل صدام البكر الذي كان معارض لهذه الحرب والتي كان يعرف نتائجها سلفا . وأطلق الملك حسين وصدام الطلقة الأولى من المدفع العراقي باتجاه إيران ؛ لتعلن من قبل هذين المجرمين الحرب على ايران وعلى أبناء العراق ؛ وهذا ماعرضته كل القنوات المرئية في العالم؛ ولم تتوقف عمالة وخيانة الملك السفلسي إلى هذا الحد . بل تجاوزت ذلك بعيدا ؛ ليقوم هذه المرة بسرقة العراق وثرواته بطرق ملتوية وبتوقيع رفيقه في خيانة الأمة التي ينادي لوحدتها زيفا !! . وكان من أهم سرقات هذا السفلسي ؛ هو حينما أغرى الطاغية صدام حسين بعروض لفتح الحصار مقابل جزء من الأراضي العراقية الغنية في مواردها الطبيعية ؛ ومنها الغاز واليورانيوم . وسارت سياسته العمائلية إلى حدود تجهض الجنين الإنساني في رحم الحياة ؛ والأكثر أهمية من ذلك ؛ هو تدمير القدرة النضالية الفلسطينية في أيلول الأسود؛ وقتل الفلسطينيين الذين يناضلون من أجل حقوقهم المشروعة في التحرير وإقامة العدل الإنساني في فلسطين ؛ ولايسعنى هنا ذكر كل مؤامراته وجرائمه السوداء التي أرتكبها بحق الشعب الفلسطيني والشعب العربي بصورة عامة . وما أن انتقل هذا الملك إلى جهنم الحمراء ورمية خلفه حجار سجيل ؛ حتى بايع الحكام العرب عميلهم الجديد الذي تدرب على قيادة القطار الخياني في معاهد الغرب البريطاني ودهاليز البيت الأبيض وأقبية القبعات الصهيونية السوداء ؛ وتخرج بدرجة عميل ممتاز فوق العاده !! لكي يوصل عمالته التي تسلم أجندتها من والده الملك المحروق . ومنذ اليوم الأول لاستلام عرش الخيانة الأردنية ؛ وهو يقول :كان أبي لايعرف الخيانة على أصولها و فسوف أكون الأجدر منه بكل شيء!! . وهنا يقصد العمل الخياني والدور التآمري الذي سوف يقوم به والذي يسير على نغماته الآن بدقة متناهية الرسم والتخطيط ؟!!.<br />مانعرفه هو ؛ أن الحكومات التي تحكم الشعوب والتي أخرجت من بين أبنائها ؛ هي حكومات تسعى إلى ما يطمح إليه الشعب الذي انتخبها وسلطها ؛ لكي تقوم بعملها السياسي الذي يتماشى مع الطموح الوطني الشعبي بأكمل وجه ؛ وليس من الممكن أن يكون عمل هذه الحكومة متعارضا مع متطلبات الشعب الذي أوصلها إلى سدت الحكم ؛ وخاصة في القضايا المصيرية والوطنية ؛ لأنه الشعب يطالب الحاكم دائما بما يتطلع ويطمح إليه من أجل بناء الوطن وعزة النفس البشرية ؛ وليس لأغراض شخصية لاتتماشى مع مايصبوا اليه المواطن . ولكن الذي حصل في مملكة الدعارة الهاشمية ؛ تجاوز الحد المعقول لأخلاقيات الحكام الذي ينتسب إليهم هذا الملك الوارث للحكم ؛ من خلال التطبيع مع الصهاينة على حساب طموحات الشعب .. خاصة بعد أن رفضت الحكومة الأردنية وفدا من رؤساء النقابات المهنية والتي هي تمثل عدد كبير من شرائح المجتمع الأردني والتي طالبت الحكومة بوقف التطبيع مع إسرائيل ؛ ولكن حكومة فيصل الفايز ( وسع الله مخرجه ) رفضت هذا المطلب الوطني والذي هو مطلبا لعموم أبناء الشعب الأردني المقهور من عمالة ملوكه .؟! ورافضة أيضا الالتماس الذي تقدم به الوفد لإطلاق سراح السجين الأردني الذي قام بقتل عدد من الإسرائيليين وجرح آخرين منهم (أحمد الدقامسه) الذي قام بواجبه الوطني في قتل هؤلاء الصهاينة أثناء تأدية واجبه .. ولكن وكما نعلم أن وجود مثل هكذا حكومات وملوك جلبت ليس من أجل حماية الشعوب والاهتمام بأمورهم الحياتية ؛ بل جاءوا من أجل حماية إسرائيل وحماية المصالح التي تهم الكيانات الأخرى والتي هي أساسا من صنعت هؤلاء الحكام الخردة !!.<br />الذي أو د أن أقوله هنا أن الذين يتبجحون بأنسابهم التي ترتبط أغصانها بغصن الرسول محمد (ص) ليس من حقهم أن يتجاوزا الغصن الآخر الذي يربط محمد ( ص ) وهو الغصن الأساسي لكافة هذه الأغصان التي خرج منها رسولنا الأعظم ؛ وهو غصن أبي لهب .. فليس من المنطق أن يكون الذين ينتسبون إلى العائلة المحمدية بيعيدين عن عائلة أبي لهب . أليس أبي لهب عم الرسول ؟ أليس أبي طالب عبد مناف أخو أبي لهب ؟ أذن لماذا يتفرعن البعض على البعض الآخر بنسبه الذي يتصل إلى من انزل الله به سورة في القران ( تبت يدآ أبي لهب وتب ) والذي أشار الله من خلالها إلى يوم العذاب الذي سوف يناله أبي لهب ؛ الذي تتساوى أعمال الحكام الذين يتصل نسبهم به بأعماله الخيانية التي قام بها ضد الإسلام ونبيه ؛ وصدام أيضا ومن خلال الشجرة العائلية التي نسبوها له بعض المرتزقة من سلالة أبي لهب .ادعى أن شجرة العائلة التي ينتمي لها توصله الى الامام علي بن أبي طالب عليه السلام ؛ ابن أخ أبي لهب ... وليس بعيدا جدا أن يكون كل حكامنا العرب الأشاوس يعود نسبهم إلى نسب حكام الأردن والطاغية صدام حسين ؛ وليس عجبا من ذلك ..!!!!!!!"
