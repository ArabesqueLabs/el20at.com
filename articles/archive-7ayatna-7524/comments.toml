capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 276
subject = "مش هيك"
author = "عربي مسلم"
text = "بسم الله الرحمن الرحيم والصلاة والسلام على سيد المرسلين المبعوث رحمة\" للعالمين أما بعد : الأخوة والأخوات الأردنيين والفلسطينيين ( العرب المسلمين) لقد نزلت هذه التعليقات السخيفة على نفسي كالصاعقة عند قراءتها والتي تظهر سخف وجهل كلا الأخوين الفلسطيني والأردني وأيقنت بشكل قاطع أن سبب ضعفنا وإنتصار أعدائنا هو هذا التفرق غير المبر ، إن ما حدث سابقا\" هو غباء سواء في 1970 أو غيرها وأجبرنا عليه كلانا لأننا وضعنا العقل والدين جانبا\" وأحتكمنا للعصبية الجاهلية التي قال عنها خير البشر دعوها فإنها منتنه . يا أخوتي ليس بهذا تحرر الأوطان ولا ترتقي الشعوب وليس بهذا نصبح نشامى أو زقرتية وليس بهذا نفتخر أمام العالم بعروبتنا وديننا . لا تنسوا أننا نستنشق الهواء نفسة لا تنسوا أننا نقتسم الحلوة والمرة ليس من أخلاقنا نحن العرب مسلمين ومسيحين أن نتفوه بهذا الكلام وهذا المنطق نحن أجا وأرفع ، أنت ستري وأنا غطاءك أنت أخي وأنا أخوك قلبي معك وكذلك يجب أن يكون قلبي معك ، ما لنا ولمن ينتفع بذلك ... إسرائيل .. أعدائنا الذين يظهرون من يوم لآخر ... فلندع الماضي ولا نفتش عن العيوب فكلنا مقصرين بحق الأقصى وبحق مقدساتنا وبحق أعراضنا وحتى بحق أنفسنا ، فمتى نباهى العالم بأنفسنا كما فعل أجدادنا في مكة والمدينة ودمشق وبغداد والقاهرة والأندلس وحتى في مشارف الهند والصين .<br />أخوتي وأفتخر بذلك أردنيين فلسطينيين مصريين كويتيين سعوديين مغربيين سوريين لبنايين ليبيين يمنيين عمانيين إماراتيين قطريين بحرينيين سودانيين مورتانيين تونسيين جزائريين ومن كل مكان يتنفس فيه العربي صاحب النخوة والرجولة .. أخوتي هذه غفوة وسنفيق يوما\" ولن نفيق الا بالعلم والإجتهاد والحب الحب الحب الأخوة الأخوة الأخوة بيننا جميعا\" .... ألم تروا ماذا فعلت أوروبا توحدت من أشتات ومن أمم متفرقة .. ونحن<br />أستحلفكم لبالله أردنيين وفلسطينيين وقف هذا كله فورا\" وجزاكم الله خيرا\" بالله عليكم بالله عليكم يا أخوتي<br />والسلام على من سمع القول وأتبع أحسنه<br />أردني من الكرك"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

