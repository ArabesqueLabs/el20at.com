subject = "مبروك نجاح خطة الاستحمار : فرق تسد"
author = "سعيد مقابله"
text = "ليس كل الفلسطييين النشامى مثلك قطعاً لسانهم طويل ، وليس كل الأردنيين مثل من ترد عليه ألسنتهم طويلة فنحن من نؤمن بأننا شعب واحد نلفظكم يا مفسدون ، وفلسطين والأردن وغيرها بلاد الله"
