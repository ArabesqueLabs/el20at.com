[[comments]]
order = 221
subject = "أنا بدي أشكر الأخ : المشتاق للحور العين ( طبعا ابن فلسطين ) لأنه كلامه كتير مقنع وممتاز"
author = "بنت نابلس (Palestine First) بحبك يا فلسطين"
text = "انا بدي أوج شكري الخالص للأخ : المشتاق للحور العين ( طبعا ابن فلسطين ) لأنه كلامه كتير مقنع وممتاز , هيك هما الفلسطينية بعرفوا يردوا منيح مش زي الأردنية كله الرد سب وشتم وآل شو إنهم هما أهل النخوة والكرامة , ولك وين الكرامة إزا إنتوا هيك بتسبوا وبتلعنوا وكل شي , عيب عليكوا والله , على فكرة عندي نكت كتير كتير على الأردنيين , عندي نكتة هيك عالماشي :<br />في واحد أردني محشش سكران دخل على محل تسجيلات الأغاني والصوتيات , المهم دخل الأردني الأصل السكران على المحل وقال لصاحب المحل : عندك ألبوم أغاني الفنان عمر العبد اللات ؟ فقال إله صاحب المحل : آه موجود عنا .. قال الأردني الأصـ(ط)ـللصاحب المحل : طيب خليه يوخر سيارته شوية ... ههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه<br />لسة عندي أكتر من هيك , لسة استنوا علي رح أنزل قائمة كاملة كلها نكت بتفجر الواحد من الضحك عن الأردنيين , بس استنوا علي , شوفوا شو رح أعمل بالأردنيين الأصل ........"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 222
subject = "إلى جميع الفلسطينية أنتم من أشعل نار الفتنة والتمييز النعصري بيننا وبينكم .. وأنتم سوف تطفؤونها بأنفسكم !"
author = "محمود الرواشدة من السلط"
text = "إلى جميع الفلسطينيين وأخص بالذكر الأخ المشتاق إلى حور العين ( طبعاً ابن فلسطين ) ليش حضرتك عندك شك بحالك إنك مش من فلسطين ؟؟؟ هههههههههههههههه .. وبعدين مشتاق لحور العين حضرتك ؟؟؟ ياسيدي الله يهنيك بالحور العين .. بس اسمع أحكمها وأمكنها زين وعدل .. وشدّ ! ماعلينا هاذ مش حكينا ...<br />أنا أولاً .. ياجماعة الخير أردني أباص عن جد، وفحياتي كلها مافرقت أو ميّزت أو استثنيت أحد بين الناس سواء كان هاذ الإشي بالتعامل معهم أو غيرو وأنا مقتنع وعندي مبدأي ووجهة نظري الخاصة فيني إنو التمييز العنصر مشطوب وممحي وملتعن أبو سلسفيلو من قاموسي لأني بثق تماماً ومتأكد تماماً إنو التمييز النعصري بكل طرقه وأشكاله وخصائصة ومميزاته ونتائجه ..الخ لابقدم ولا بأخّر .. واللي بدي أقوله للأخ إنو أنا (وأعوذ بالله من كلمة أنا ) بحب الفلسطينيين كثير وأنا مابقول هالكلام هيك ! لأ أنا بقولوا لإني مقتنع إنو أنا أو غيري من الأردنيين مافي فرق بيني وبين الفلسطيني نفسو . كل الناس خير وبركه . واللي بيجي من الله حياه الله .. بس إنو توصّل الشغلة والعملية إنو بعض الفلسطينيين ( المحترمين المؤدبيين ) إنهم يغلطوا ويسبو فينا نحنا ( الأردنيين ) فهاذ عيييييييييييييييييييييييييييييييييييييب ياعالم ياناس .. اصحوووووووووا !<br />وشغلة ثانية بدي أنوّه عليها إنو الفلسطينيين بنوا الأردن وعمروها وسوها إشي كبير بعد ماكانت إشي صغير .. وصارلها سمعة ومكانة على الساحتين العربية والعالمية .. واقتصادها كبير وضخم .. وإنو معظم أو أغلبية رؤوس الأموال اللي داخله بالمشاريع الإقتصادية وغيرها هيه بالأساس أموال فلسطينية .. وأيضاً إنهم حولها من لاشيء إلى شيء عالي .. طيب أنا متف معاكوا بهالنقطة .. واللي بقول غير هالكلام بكون كذاب وبضحك على حالوا قبل مايضحك على الناس .. بس مش معناتوا إنو يعني ومثل مابقولوا البيت بيت أبونا وإجوا الغرب يسكونها .. وهاذ بالمختصر المفيد"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

