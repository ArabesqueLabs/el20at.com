subject = "الى البدوي ابن البادية (العتيبي)"
author = "سعد العتيبي - فلسطين المحتلة"
text = "تقول ان الفلسطينيين لا اصل لهم.. شخص تافه حقير نذل مثلك ماذا ننتظر منه ان يقول.. على العموم انا اتحداك ان كان لك اصل.. لانك من اسم عائلته يفترض ان تكون بدويا والبدو كرم و شهامة<br />البداوة رجولة و قوة .. ولكن الرجولة يبدو عندك وعند من هم على شاكلتك لهم صفات، الدخول في حرب مثلا؟ أو الحيافة؟ أو وش بالظبط ؟ او التهجم على اعراض الناس زورا وبهتانا من شان ترضي ملوك وحكام خونة تقول ان اصلهم معروف.. نعم اصلهم معروف انجليز على اولاد يهود على اولاد اميركان بل اتحداك ان لم يكونوا من ارذل الانجليز والاميركان على الاطلاق.. ولكن ذنبك طويل وهز الذنب طبع عند الاردنيين لانهم اناس اراذل يحكمون بالجزمة والبسطار وهذا دابهم منذ ان اسست لهم دولة مسخ مصطنعة هدفها حماية اسرائيل الصهيونية.<br />طبعا كلمة الرجولة صفة مانعة جامعه لأشياء كثير و صعب تفصيلها خصوصا لامثالك من الصرامي<br />البداوة اصل و فصل يا رخيص يا ساقط.. ومن كان ذو اصل وفصل لا يخوض في اعراض الناس.. ومع كرهي الشديد لمحمود عباس الذي تناولته فانه على الاقل اشرف من حكامك ومن اسيادك في تل ابيب وواشنطن ولندن.<br />اقول عاد شف غيرها… اولا انت تعرف و انا اعرف ان الحضر اصل و فصل مثل ما البدو اصل و فصل و الرسول من خير بطون العرب و ما كان بدوي بعدين مثل ما عند الحضر صناع او غيرهم ممن يدعي بعض المتخلفين انه مالهم اصل نفس الشي موجود عند البدو ، لالا و ازيدك في قبائل كاملة يعتبرها البعض مالها اصل و هي قبائل بدوية وعلى طول تراب فلسطين الطهور يوجد اكثر الناس حسبا ونسبا وهم ينتمون الى خيرة قبائل وبطون عربية اصيلة..<br />انا اتحدى ان يكون مثلك من عشيرة اعتز بالانتساب لها وهي العتيبي.. لاننا لا نفتخر ان يكون بيننا من هم على شاكلتك من المرتزقة والخونة وقليلي الحياء والادب الذين يركعون لاسيادهم ويخوضون في اعراض الناس<br />والله يوخذك اخذ عزيز مقتدر قريبا عاجلا ان شاء الله لان امثالك نكرة والى مزبلة التاريخ ان شاء الله"
