subject = "الى المدعو محمد نوااف لعنه الله والملائكة والمسلمين"
author = "المشتاق للحور العين ( طبعا ابن فلسطين )"
text = "بسم الله الرحمن الرحيم<br />وخير كلام ابدأ به هو كلام الله جلا وعلا (( ومايلفظ من قول الا لديه رقيب عتيد )) صدق الله العظيم<br />كم ينطق الجهلاء من الفاظ قبيحة وكلام قبيح فهو نابع من اصلهم وفصلهم وعاداتهم فهو يدل على تلك العادات التى يعيشونها نسأل الله البعد عن السباب والشتائم قدر مااستطعنا لان السباب او سب المسلمين يعنى الفسوق او الفسق<br />فمن سب مسلما فهو فاسق هكذا علمنا حبيب الله الرسول صلى الله عليه وسلم<br />وهنا نجد شخصا اقرب الى ابليس فهو يسب ويلعن ويهتك اعراض البنات .. ايها الخبيث محمد نواف من انت لتتلفظ بهذه الاقوال الساقطة مثلك على شخص لاتعرفه شيئا ولا يسب خوفا من الله ليس خوفا منك وانت عبد الى الله لاتسوى جناح بعوضة انت والعالم كله عند الله ..<br />لاريد ان ارد عليك بالمثل اقتداء بما علمنا اياه الحبيب محمد صلى الله عليه وسلم فى السنة الشريفة<br />ولا اريد ان ارد بالمثل لانى مؤمن بالله ورسوله والمؤمن ايها الجاهل مأمور بأن يكون كلامه مستقيماً لا اعوجاج فيه ولا انحراف، قال تعالى -: (( يا أيها الذين آمنوا اتقوا الله وقولوا قولا سديدا يصلح لكم أعمالكم ويغفر لكم ذنوبكم))<br />كما نهى المسلم أن يكون ثرثاراً أو متشدقاً أو متفيهقاً، قال - صلى الله عليه وسلم -: ((\"إن من أحبكم إلي وأقربكم مني مجلساً يوم القيامة أحاسنكم أخلاقاً، وإن من أبغضكم إلي وأبعدكم مني مجلساً يوم القيامة الثرثارون والمتشدقون والمتفيهقون\")) الرسول علمنا حسن الخلق وانا احب الرسول واقتدى بما يعلمنا لست مثلك جاهل ينطق بما لايدرى عقله اتدرى لماذا ؟؟ لانك فقدت العقل فهنا اصابك جنون وهستيريا لان الجميع يوضحون صورةتك الخبيثة انت وامثالك ياشيطان الدنيا ... واعلم اننى لن اسامح فيما قصدته بأخواتى المسلمات فهنا اقول حسبنا الله ونعم الوكيل<br />واعلم ان ردى على تافه مثلك سيكوون بكلام الله لان الحرب على النفاق تكون بكلام الله ورسوله المصطفى<br />ولايهمنى ماتنطق به من اساءة لى ففى الاخرة دار حساب ... وسيعلم الذين ظلموا اى منقلب ينقلبون ....<br />كما انوه للاخوة جميعا التحلى بالاخلاق المحمدية فى الرد على مثل هؤلاء التافهين الذين يسعون فى الارض فسادا<br />ومن هنا اعلن للجميع عن جعل هذه الصفحة دعوية انطلاقا من الان وذلك حتى يتأدب المنافقون فيها وحتى يعودوا الى دين الله ولايتلفظوا ويهتكوا اعراض المسلمين .. فلاتحزنوا اخواتى فإن الله منتقم جبار ...<br />اتدرون من المتشدق الذى ذكره الرسول فى حديثه السابق هو المتطاول على الناس بللسانه واما المتفيهق هو المتكبر وهذا حال الولد محمد نواف الضعيف نفسيا<br />واذكركم بقول الرسول صلى الله عليه وسلم :: (( من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت ))متفق عليه<br />فلعل يكون الناقص اخلاقا ودينا محمد نواف مؤمنا ويلتزم بكلام الحبيب محمد صلى الله عليه وسلم<br />الحلم زين والسكوت سلامة<br />فإذا نطقت فلا تكن مهذارا<br />ما إن ندمت على السكوت مرة<br />ولقد ندمت على الكلام مرارا<br />وكما قيل بأن البلاء موكل بالمنطق لذلك قال تعالى :<br />((لاَّ خَيْرَ فِي كَثِيرٍ مِّن نَّجْوَاهُمْ إِلاَّ مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلاَحٍ بَيْنَ النَّاسِ وَمَن يَفْعَلْ ذَلِكَ ابْتَغَاء مَرْضَاتِ اللّهِ فَسَوْفَ نُؤْتِيهِ أَجْراً عَظِيماً ))<br />واعلموا ان اكثر مايدخل الناس النار هو انظروا لحديث رسولنا صلى الله عليه وسلم لتعرفوا :: ولقد سئل النبي صلى الله عليه وسلم : (( عن أكثر ما يدخل الناس النارفقال :: اللسان والفرج )).<br />وها هو معاذ يقول له النبي صلى الله بعد الوصية العظيمة في الصيام والإيمان والجهاد<br />ألا أدلك على ملاك ذلك كله قال بلى يا رسول الله قال:<br />((امسك عليك هذا ))وأشار إلى لسانه قال يا رسول الله أو نؤاخذ بما نتكلم فقال صلى الله عليه وسلم (( ثكلتك أمك يا معاذ وهل يٌكب الناس في جهنم على مناخرهم إلا حصائد ألسنتهم ))رواه الترمذي<br />عباد الله : اعلموا يا عباد الله إنه قد أفلح وفاز من رزقه الله لساناً ذاكراً وشاكراً<br />واعلموا يا عباد الله أن العبد قد يشتري بكلمة طيبة رضوان الله والرحمة جل وعلا وبكلمة أخرى قد يسخط الله عليه ، قال صلى الله عليه وسلم :<br />((إن الرجل ليتكلم بالكلمة من رضوان الله تعالى ما يظن أن تبلغ ما بلغت يكتب الله عز وجل له بها رضوانه إلى يوم القيامة، وإن الرجل ليتكلم بالكلمة من سخط الله تعالى ما يظن أن تبلغ ما بلغت يكتب الله تعالى بها عليه سخطه إلى يوم يلقاه )) صحيح البخاري<br />ها هو أبو بكر يراه عمر وهو ماسكٌ بلسانه ويشير إليه ويقول هذا أوردني الموارد<br />و هاهوإبن مسعود على الصفا يقول وهو يخاطب لسانه:<br />يا لسان قل خيراً تغنم واسكت ن شر تسلم من قبل أن تندم.<br />وقال عمر( من كثر كلامه كثر سقطه ومن كثر سقطه كثرت زلاته ومن كثرت زلاته فالنار أولى به ).<br />عباد الله ينبغي للمسلم أن يحفظ لسانه فلا يتكلم إلا فيما يرجو فيه الربح والزيادة في دينه ودنياه فالله يقول(( وَقُل لِّعِبَادِي يَقُولُواْ الَّتِي هِيَ أَحْسَنُ إِنَّ الشَّيْطَانَ يَنزَغُ بَيْنَهُمْ إِنَّ الشَّيْطَانَ كَانَ لِلإِنْسَانِ عَدُوّاً مُّبِيناً ))لإسراء53<br />وقل لعبادي المؤمنين يقولوا في تخاطبهم وتحاورهم الكلام الحسن الطيب؛ فإنهم إن لم يفعلوا ذلك ألقى الشيطان بينهم العداوة والفساد والخصام. إن الشيطان كان للإنسان عدوًا ظاهر العداوة.<br />وقال تعالى : ((وَقُولُواْ لِلنَّاسِ حُسْناً )) البقرة<br />عباد الله:<br />إن كثيراً من الأمراض الاجتماعية من غيبة، ونميمة، وسب، وشتم، وقذف، وخصام، وكذب، وزور وغيرها … فللسان فيها أكبر النصيب،<br />وعن أبي سعيد الخدري - رضي الله عنه - عن النبي - صلى الله عليه و سلم - قال:\"((إذا أصبح ابن ادم فإن الأعضاء كلها تكفر اللسان تقول:اتق الله فينا فإنما نحن بك,فإن استقمت استقمنا ,و إن اعوججت اعوججنا))رواه الترمذى<br />إن المسلم إذا سمح للسانه أن يلغو في هذه الأعراض وغيرها كان عرضة للضياع والإفلاس في الآخرة، وشتان بين إفلاس الدنيا وإفلاس الآخرة.<br />روى مسلم عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: ((أتدرون من المفلس؟ قالوا: المفلس فينا من لا درهم له ولا متاع، قال: المفلس من أمتي من يأتى يوم القيامة بصلاة وصيام وزكاة، ويأتي وقد شتم هذا، وقذف هذا، وأكل مال هذا، وسفك دم هذا، وضرب هذا، فيعطى هذا من حسناته، وهذا من حسناته، فإن فنيت حسناته قبل أن يقضى ما عليه أخذ من خطاياهم فطرحت عليه ثم طرح في النار ))<br />ومن حفظ لسانه من كل سوء كان الجزاء عظيمًا والاجر كبيراّ ولذا قال صلى الله عليه وسلم((من يضمن لى ما بين لحييه (يعني لسانه) وما بين رجليه (يعني فرجه) أضمن له الجنة )) أخرجه البخاري<br />عبد الله<br />إن كنت تبغي العلا للجنان<br />فعليك يا صاح بحفظ اللسان<br />اخيرا الصفحة دعــــــــــــــــــويــــــــــــــــــة لذلك اطلب من الجميع ان يقوموا بنشر دين الله والتعليق بخير الكلام والبعد عن الهلاك وافات اللسانى لعلكم تفلحون<br />محمد نواف اتقى الله اتقى الله اتقى الله لعلك تصبح انسانا يستحق ان ننظر اليه بأعيينا ولاتستمر سيرا على اربع ارجل فننظر لك حيوانا لايفهم ولايتفاهم<br />اسأل الله ان يرزقنا بلسان طيب كلامه طيب وان يرحمنا ويرحم المؤمنين اجمعين<br />اخوكم المشتاق للحور العين .... اللهم انى بلغت اللهم فأشهد امين<br />الصفحة دعوية وكفى سباب لانه فسق اذا كان بين المسلمين ..<br />اللهم من يقرأ نصائحى ويتواصل على النطق بالخير ارزقه ماتحبه له من خير واجعله من اهل الخير وارزقه الجنة والخير من حيث لايحتسب اللهم امين"
