subject = "ضع عنوان التعليق"
author = "razeen"
text = "تحياتي الى هلال ابن سوريا الاسد ، والى مريانا اللبنانيه ، والى مصرية ، والى كل من ابدى كلمة طيبة في حق فلسطين وابناء فلسطين .. وبتشكرهم على شعورهم الرائع ونفوسهم الطيبه . واتمنى من الاخوة الاردنيين ان يهديهم الله ويرجعوا اخوة واشقاء دم ونسب مع الفلسطينيين ونكون يد واحدة ضد عدو واحد يتربص بنا جميعا وهم اليهود ."
archived = "2009-04-05"
