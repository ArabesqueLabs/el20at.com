[[comments]]
order = 312
subject = "إتقوا الله في انفسكم"
author = "فاعل خير"
text = "السلام عليكم ورحمة الله وبركاته<br />أقسم بالله انني اردني أبآ عن جد ولكن قلبي فلسطيني<br />اخواني واخواتي اتقوا الله بانفسكم ولا تدعوا مثل هذا الكلام يزرع بينكم شقاق فانت حين تشتم الاردني تشتم نفسك والعكس صحيح الاخ يشتم اخاه فكم من انساب ومصهارت وقد يدخل اردني او فلسطيني ينجر وراء هذه الترهاتو يشتم من له به صلة قرابه ودم فعن عقبة بن عامر رضي الله عنه قال : قلت : يا رسول الله ما النجاة ؟ قال : أمسك عليك لسانك ، وليسعك بيتك ، وأبك على خطيئتك \\\\\\\" ( رواه الترمذي وحسنه ) ..."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 313
subject = "عاشت فلسطين من الفاء إلى النون ومن النهر إلى البحر (فلسطين أولا) PAL 1st"
author = "بنوتـ فلسطينية حلوة ــة"
text = "مش عارفه شو احكي بس عن هدول الاردنيين الغجر النور المتخلفين فعلا , والدليل على هيك من قبل تعليقاتهم الموجودة بهده<br />الصفحة , حتى أنا مستغربة كتير كيف موقع عشرينات ساكت على متل هاد الكلام الوسخ الوقح الخسيس اللي بفتقر لنوع الأدب<br />والإحترام على كل , أنا بشكر بجد كل الفلسطينيين اللي علقو عالاردنية وبكلام مفحم وبخاصة الاخ المشتاق للحور العين (طبعا ابن فلسطين) وفلسطيني غصب عن الكل وحبيبة ألبي بنت نابلس وبنت السعودية الغالية شو عن جد ناس بتفهموا بالحكي , مش متل الحقير الواطي ابن الكلب محمد نواف الحمد الله , روحوا على الصويفية ولا حديقة الملك حسين شوفو أولادكوا يا اردنية كيف بتعكسوا بالفلسطينيات الشريفات العفيفات , والله ولا واحد منهم بأدر يستجري يعكس على وحدة فلسطينية لأنو عارف شو رح يكون مصيرو والسلام عليكم ورحمة الله وبركاته(السلام على الفلسطينيين فقط لأنو الأردنيين حرام حتى السلام ينقال إلهم)"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 314
subject = "كل الفلسطينية على ززب ابوي"
author = "شكيرا"
text = "كل الفلسطينية على كسسسي<br />واحلى تحية لزبار الفلسطينية من كثر ما ناكو امياتهم وخواتهم<br />تعالو احلسو كسسي وطييزي وبزازي اكسبو فيي اجر عند ربكم<br />مولعه على ززب مصنن فلسطيزي ههههههههههههه<br />كسسس اختكم جواسيس اخوة لشارون بالتبني<br />فلسطينية يلا كلكم على كسسسي خشوووو"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 315
subject = "وين كنا ................................... ووين وصلنا ؟؟؟"
author = "محمد نواف الحمداالله ..."
text = "ياحبيبي الشغلة كبرت وتطورت وتقدمت .. ياعيني ......................<br />خلص يا أخوان ترى واللع الشغلة صارت ميمعه وصارت كلها تخبيص بتخبيص .. ولحد هونه بكفي لإنها فعلاَ زادت عن حدها ..<br />وبدعو الأخت (( بنوتـ فلسطينية حلوة ــة )) إنها تحتمر حالها شوية يعني . وكلامها هاذ ملوش لازمة ومش ضروري ينحكى فيه ( طبعاص كذب ) ..<br />أنا على فكرة لو بدي كنت ظفت تعليقات كثيرة من جهتي .. بس أنا اتعمدت إني أراقب هالصفحة وإنها بالآخر وقفت عند تعليق محدد .. وقلت منيح هي في تقدم بالموضوع ... يعني هينا شوية وبننهي الموضوع (ولا مين شاف وولا من دري ) .<br />وبالآخر إجت الأخت ((بنوتـ فلسطينية حلوة ــة )) وخربت كل إشي .. بشتائمها ومسباتها اللي لابتقدم وولا بتأخر ..<br />هاذ بدل ماتهدي الوضع .. لأ قاعده عم بتصب زيت على النار .. ولك يابنت الحلال إنتي بنت قبل كل إشي ( إذا بتعرف شو معنى أنثى ) وهاذ كلامك مرفوض قطعاً وفير مقبول نهائياً فا يعني احترمي حالك شوية .. بدك تحكي عن بلد ( فلسطين ) احكي ماحدا ماسكك أولاحقكك بعاصية وقايلك لاتكتبي .. ولكن إنك تسبي وتشتمي فهاذ عيب .. عيب .. عيب<br />وأنا كذا مرة وفي أكثر من تلعيق لألي إني رفضت أسب وأشتم احتراماً وكرامة لذاتي أولاً .. واحتراماً وتقديراً لبلدي 00 الأردن أولاً 00 ولإنو عيب يعني ..<br />فا الله يرضى عليكي يا بنت فلسطين الحلوة إنك تبطلي هالتعليقات المخزية وتكوني شاطرة ومؤدبة ومحرتمة عشان احترمك وأقدرك يعني ..<br />إنتي أكيد وبلا شك محرتمة ولكن لو شوية ضبطتي حالك وما تنفعلي كثير .. وبس<br />وشكراً ،،،<br />تحياتي للجميع ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 316
subject = "مين غيرنا احنا الفلسطينيين يا جرادنة بنا الاردن تعليما واقتصاديا وعسكريا"
author = "son of Nablus (PAL 1st)J"
text = "السلام عليكم ورحمة الله وبركاتو , اولا انــا بجد يعني صعقت لما شفت متل هده التعليقات سواءا من الفلسطينيين أو الجرادنة , بس مين بدأ بالسب والشتم أولا , الأردني صاحب أول تعليق إحنا ما قلناش إشي لما إنك بتفتخر وكل واحد بفتخر بأصلو وبلدو وهاد إشي طبيعي كتير وجبلي في الإنسان ما بنعترض عليه , لكن ليش فجأة قلبت وصرت تسب على فلسطين وعلى الفلسطينيين والفلسطينيات , أولا بدي أقول يا حقير اتق الله في نفسك ولا تقذف أعراض المسلمين , لأنو لسان الأردنيين معروف زي الزفت حتى سبحان الله ما زال البلغم الشرشيح المتفوف عليه ملصق بلسانهم واسنانهم ولثتهم , تاني إشي كل اللي عم بصير بغزة من مجازر ومحرقات وغيرو من الحصـــار وتخنق الشعب الفلسطيني هي الأردن أولا طبعا , خوفا من وصول هاي الفصائل الفلسطينية المناضلــة للاردن لأن الأردن جزمة أمريكا وإسرائيل وبعد هيك يصير انقلاب وفوضى وحرب اهلية ومش بس تبع الأردن وتبع مصر وكل مكان , يعني إحنا الفلسطينية صرنا مكروهين من كل شعوب العالم إلا من رحم ربي , لكن مهما كرهتونا وعملتو فينا رح نضل صامدين ومقاومين حتى تحرير وطننا الفلسطيني الغالي من قطاع غزة للضفة ومن البحر إلى النهر , والاردن يا جرادنة هي بالأصل صحراء أو بادية فلسطين , ولا يوجد بالأصل أردن على وجه الارض ابدا مهما تحلفون وتنكرون اصولكم فإن أغلب أصول العشائر الاردنية هي من اصول فلسطينية وعراقية وسورية ولبنانية , لانه لا يوجد اردن بالاصل , راجعو تاريخكم منيح ما رح تلاقوا اصلا فيه اردن ولا سوريا ولا لبنان , فلسطين هي بلاد الشام وهي أرض الشام , وهده حقيقة مثبتة بافعل , بعدين يا جرادنة لما بتغلطوا على فلسطين , فلسطين أرض مباركة وهي ارض الانبياء ومسرى الرسول الكريم صلى الله عليه وسلم ومقام الأنبياء والصحابة الكرام والله سبحانو وتعالى ذكرها بكتابو الكريم فلا يمكن إنكار هده الحقيقة , ولا تنسوا يا اردنيين إنو إحنا الوحيدين اللي<br />عمرنا الأردن وبيننا فيها الصرح التعليمي الجامعي والعسكري والإقتصادي كمان , فيعني والله من العيب تنكرو جميلنا , ولا إنتو<br />شوية بدو معفنين حثالة مشردين كلكوا ما بتسووا على بعض 40 الف أردني , وبرجوا من الفلسطينيين والفلسطينات هون<br />إنهم يتعقلوا بالرد على هؤلاء التافهين المتخلفين اللي ولا بعد مليار سنة ما بتحضرو والله ....................................<br />مع تحياتي : ابن نابلس (فلسطين أولاً) بموت فيكي يا فلسطين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

