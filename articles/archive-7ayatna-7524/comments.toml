subject = "ايها الاردنيون القوادين"
author = "فلسطيني حتى النخاع"
text = "الأردن ما هو إلا دمية في يد إسرائيل فلا تتحدثوا يا ارادنة يا كلاب عن بطولات وهمية او حتى ان تحسبوا انفسكم على هذه ا لامة انتم اشد على الامة وخصوصا على الشعب الفلسطيني من اليهود انفسهم عبر تامر حكامكم التاريخي على كل ما هو عربي ومسلم ابتداء من التامر الخطير على دولة الخلافة العثمانية عبر خيانة الثورة العربية الكبرى وحتى اليوم وتامركم الاخير على حماس وحزب الله وصدام حسين<br />الله لا يوفقكوا ونسال الله عز وجل ان يرينا فيكم اياما سوداء كايام عاد وثمود.. لانكم شعب مخنث على دين ملوككم ليس فيكم رجل حر بل انتم مجرد امعات حقيرة وحشرات يجب ان تداس بالكنادر مع الاعتذار للكنادر لانها اشرف منكم"
