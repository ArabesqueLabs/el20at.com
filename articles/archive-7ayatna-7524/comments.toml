[[comments]]
order = 81
subject = "لا حوول و لا قوة الا بالله"
author = "عاشقة فلسطين"
text = "ولكم يا ولاد الداشرة انتو ما بتعرفو شو هم الفلسطينيين ولكم روحو زبايل منحطين مش ملاقييين غيرنا تحكو عنا و لكم انتو تتمنو تكونو فلسطينيين لانها اصلا شرف و بعدين يا خالد يا اخرى انسان يا ككة انت اكبر زيايل الاردن و لك الاردن اكبر سلة مهملات بالعالم مش عاجبك الفلسطينيين ولك هادي بتلمك و تلم اهلك و اهل اهل الي جابوك يا عرص يا ابن المنيوكة يا ابن الككة و بعدين يا ككة ما تحكي كلمة بعدين احنا مو خايفيين من المخابرات اذا كانت كل مخابرات الاردن فلسطينية كيف رح نخاف منكم يا زبايل المجتمع يا حثالة الزبايل تبعت المجتمع و انت معك حق يا روحي يا بكل فخر عربية عندك حق في كل كلمة حكيتيها عن بنات الاردن كلهم زييي طيزي و انتو يا جرادنة لما بدكم تطفحو ( بالسم انشاءالله ) منسف بتفتحو ايدكم زاوية 90 درجة كنتش اعرف انكم بالرياضيات هيك شاطرين خخخخخخخخ هذا اذا ما كان الزاوية كانت قد فتحة طيز امك"
