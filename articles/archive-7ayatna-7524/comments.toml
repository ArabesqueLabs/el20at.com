[[comments]]
order = 509
subject = "مصرية"
text = "ايه اللي جرا يا عرب أنا طول عمري أعرف ان الفلسطينين دول أحسن ناس دافعوا عن أرضهم وهم في رباط<br />واعرف برده إن الاردنيين يتشالوا فوق الراس ليه الشتيمة والتجريح والاهانه<br />معذرة الأخ اللي بدأ التجريح اللي هو أول تعليق هو اللي أشعل الخلاف ودة كان هدفه زي أمريكا وإسرائيل يوقع بين العرب بدل ما نساند بعضنا<br />يا خسارتك يا عرب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

