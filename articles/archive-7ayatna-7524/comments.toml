subject = "إلى كل من ينطق بلسانه النجس على أبي عمار بغير حق"
author = "يوسف البحيصي ( فلسطيني و الكل مقهور مني )"
text = "إلى من ينطق بلسان نجس عن الطاهر الشهيد القائد الرمز ياسر عرفات<br />و الله و تالله إن التراب العالق على كعب قدم أبو عمار يسوى كل رؤوس الأردنيين من الشباب و الرجال إذا كان لديهم رجال في الأصل و من النساء أكيد كلهم نساء و من الأطفال<br />فإن أبا عمار هو المجاهد و الفدائي في جنوب لبنان و في فلسطين و في أغوار الأردن<br />فأين ملوككم ؟؟؟<br />و أبن ممالككم ؟؟<br />إن أبا عمار هو أسطورة العرب و هو الرمز و الرقم الصعب فإنه هو الذي خلق للصعب<br />فإني لا أرديد أن أسمع على ألسنتكم النجسة سيرة أبي عمار لإنك أنجاس و أبو عمار شتان بينه و بينكم<br />يا أولاد القحبة لا أستثني منكم أحدا<br />فالقدس عروس عروبتكم<br />بالله عليكم يا أبناء الزنوة<br />هل هناك زعيم عربي جاهد و كافح ؟؟؟<br />هل هناك زعيم عربي سهر في الغار ليرد كيد المعتدين ؟؟<br />هل هناك رئيس عربي قبل جرح جريح ؟؟<br />هل و هل و هل ؟؟<br />أيها الاردنيون أنا لا أريد شتم ملككم لإن وجوده و عدم و جوده واحد<br />فلماذا أتعب لشتمه ؟؟؟<br />( أين الملوك التي التي كانت مسلطنة حتى سقاها بكأس الموت ساقيها ) .<br />فأريد أن أعلمك أن أبا عمار الآن في جنات النعيم في جنات الفردوس خالدا مخلدا<br />و أنتم أيها الأردنيون إذا دمتم تكرهون فلسطين لن تشموا رائحة الجنة<br />و سلام الله على كل من هو فلسطيني و عربي حر و لا سلام على كل من هو أردني لإنه كاره لفلسطين و ليس على ملة الإسلام . بقلم : يوسف البحيصي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 448
subject = "الضحايا المرضى من الحصار الاسرائيلي المصري الاردني على غزة يرتفع الى 193 شهيدا"
text = "أعلنت مصادر طبية وأخرى في اللجنة الشعبية<br />الفلسطينية لفك الحصار عن ارتفاع عدد ضحايا الحصار<br />الإسرائيلي المدعوم من الاردن ومصر ونظام الخائن محمود عباس والمستمر علي قطاع غزة إلي 193 حالة بسبب نقص الأدوية ومنع المرضى من السفر لتلقي العلاج في الخارج.<br />وأوضح رامي عبدو الناطق باسم اللجنة الشعبية لمواجهة الحصار أن المريضة<br />فوزية السيد فخر /59 عاما/، وأحد العالقين في قطاع غزة<br />توفيت لحاجتها إلى العلاج وعدم تمكنها في ظل الحصار المتواصل\\\\\\\".<br />وأضاف: \\\\\\\"أن المواطنة رجاء كامل أبو زيد، البالغة من العمر 17 عاما<br />والمريضة بورم سرطاني من سكان مدينة رفح توفيت جراء نقص العلاج وعدم<br />السماح لها بالمغادرة للعلاج\\\\\\\". كما توفي الطفل مصعب علي الشافعي 5 سنوات نتيجة حاجته الماسة الى السفر والعلاج نتيجة اصابته بتسمم حاد في الدم.<br />هنيئا لحكام العرب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

