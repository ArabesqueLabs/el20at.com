order = 391
subject = "فلسطيني بكل فخر"
author = "فلسطيني أصيل (فلسطيني وكالصقر)"
text = "أنا فلسطيني بكل فخر وامتنان<br />أعشق شعوب العالم بمختلف الأديان<br />أعشق الحرية والسلام والأمان<br />أعشق شعوباً ليس لها أوزان<br />بالفكر والحضارة والإيمان<br />وأعشق كل ما فيها<br />من تراب وتلال ووديان<br />وأرسم الصورة بمختلف الألوان<br />لا يمحوها تاريخ ولا نسيان<br />أكتب على الأوراق والجدران<br />أقولها بأعلى صوت لكل الأعيان<br />لا نخاف قذائف ولا نيران<br />يومياً تحتل الميدان<br />دباباتٌ ومدافع في كل مكان<br />تجتاح الأرض والشجر والإنسان<br />وتقتل بلا إحساس ووجدان<br />من يوقف هذا الطوفان ؟<br />من يوقف هذا العدوان ؟<br />من يعيد الأمل لأطفال بعد حرمان ؟<br />ولكن ..........<br />لا يهز فينا شعرة ٍ من إنسان<br />عراقياً أو فلسطينياً أو سورياً كان<br />بل يزيدنا عشقاً وحباً وحنان<br />وقلباً ينبض بالإيمان<br />نحن عرب ليس بيننا جدران<br />نحمل الراية والقرآن<br />ونتفجر كبركان<br />لا تهمنا إسرائيل ولا أمريكان<br />زوالهم حتماً كما قال القرآن<br />نحن شعوب مقاومة وتضحية لها عنوان<br />نحن شعوب ذات حضارة وتاريخ وميزان<br />ولكن .....................!!!<br />ميزان العداله مائل ، يا له من ميزان<br />سأكتب بكل لغات العالم والأديان<br />ليعلم القاسي والداني من حكام البلدان<br />حكام اللؤلؤ والمرجان<br />حكام المقام الرفيع الرُعيان<br />أيها الحكام !!!!<br />هل أنتم من عباد الرحمن ؟<br />رأيتم بعيونكم فلسطين والعراق ولبنان<br />يغمرها القتل والمذابح والنيران<br />وردكم ما شاء الله يفتت الأبدان<br />شجب واستنكار سريع الذوبان<br />ولكن تقول لكم شعوبكم<br />لن تدوم مناصبكم<br />وعارٌ عليكم<br />وعظم الله أجركم<br />التاريخ لن يرحمكم<br />ونوماً هنيئاً لكم<br />أنتم الضائعون في غبار الاندثار<br />والهاربون في قطار الاندحار<br />والحاملون باقتدار ألف عار"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 392
subject = "أنت فلسطيني ..في ذكرى النكبة , إرفع رأسك عاليا يا فلسطيني ولا تخضع .."
author = "فلسطيني أصيـــــل (فلسطيني وكالصقر)"
text = "…1…<br />بعد ايام قليله , سيحتفل الكيان الصهيوني بالذكرى الستون لمحرقتنا , وسيعملون ما بوسعهم لإقناعنا بأنهم نجحوا كليا بتكريس خرافه ’’عوده شعب الله المٌختار الى ارض الميعاد ’’ , وخرافه ’’بعث إسرائيل بعد قرون من الشتات ’’ …<br />وفي نفس اليوم واللحظه , سيعم على ملايين الفلسطينيين , اينما تواجدوا , وايما كان إنتماؤهم السياسي او الطائفي او الإجتماعي , شعورا مشتركا بحقيقه وعظامه الظلم التاريخي الذي لحق بهم , نتيجه تهافت العالم على المٌساهمه بتكريس الخرافه الصهيونيه , وبالتالي تكريس حرمان شعبنا من ابسط حقوقه الإنسانيه والوطنيه , وأقلها العيش بحريه على ارض وطنه …<br />…2…<br />هُم سيحتفلون غدا بالذكرى الستون لمحرقتنا , وسيطلقون الألعاب الناريه في سماء وطننا , وقد يرقصون بالشوارع والمقاهي والساحات العامه , لإظهار بهجتهم بنكبتنا , وفرحتهم بمأساتنا , وغبطتهم لدمائنا الغزيره التي أسالوها , وسيفعلون كل ما يعتقدونه مناسبا لإقناعنا بإنهم فعلا نجحوا بسرقه ماضينا وحاضرنا , وبأنهم فعلا نجحوا بتدمير مستقبلنا ….<br />هم إستدعوا بوش وميركل وساركوزي , وغيرهم من ’’عظماء’’ هذا الزمان , وقد يٌلزموهم بإعتمار الطاقيه اليهوديه , والإصطفاف امام ’’حائط مبكاهم ’’ المزعوم , يطأطؤن الرؤوس , ويتمايلون حمداً ل ’’ربهم’’ على هذه’’ اللحظه التاريخيه’’ التي يعيشونها , وبعدها قد يشربون معا نخب ’’ الخديعه الكبرى ’’ , وأطراف عيونهم الينا تنظر , تتأمل إنعكاسات المشهد على نفوسنا , آملين بأن يروا في عيوننا الهزيمه , والإقرار منا بأن ’’دولتهم ’’ اصبحت حقيقه تحظى بدعم ’’عظماء الكون ’’ , واننا إقتنعنا بالرضوخ لهذا ’’الواقع ’’ ….<br />هم سينفخون كامل عضلاتهم , وقد يستعرضون أحدث ما في ترساناتهم من قوه عسكريه , وطاقات تكنولوجيه , ومهارات إستخباراتيه , وخبث إعلامي , وأطراف عيونهم علينا تتلصلص , آملين ان تهتز مفاصلنا , وعلى الأرض ان نركع , رهبه وخوفا من بطش قوتهم , ومتمنين ان نحني الرؤس , ونبتلع مع ريقنا مطالبنا , وحتى منها جرعه الماء او لقمه العيش لأطفالنا , وان نكتفي فقط بما يقررونه لنا وقتما وكيفما شاؤوا ..وان نَخُرّ لهم شاركرين ’’الهبه والنعمه’’ ..<br />هم سيوعزوا غدا لكل كتابهم وصحافييهم ومثقفيهم بأن يحتلوا الصفحات الأولى من صحف ومجلات العالم , وان يتسابقوا للتربع امام شاشات التلفزه , ليهللوا لل’’معجزه ’’ الصهيونيه التي تحققت , ول’’تفوق شعب الله المٌختار ’’ , ولمناعته على ’’ارضه الموعوده ’’ , ولسان حالهم يقول لنا نحن الفلسطينيين والعرب والمسلمين ,( ’’إنتهى الأمر بكم , فهذه إراده إلآهيه تحققت رغم انوفكم , فإقبلوها طوعا او كرها , المهم إقبلوها ’’ )….<br />هم سيرسلوا لنا غدا بعضا من ’’كتابنا وصحافينا ومثقفينا ’’ ليشهروا اقلامهم , وليرددوا بألسنتهم , وبلغه عربيه نفهمها , خطاب صناع نعمتهم , وليشيروا الينا بأصابعهم المٌتعبه من عَدّ الدولارات والشيكلات , الى ما ’’جنته أيدينا ’’ نتيجه رغبتنا بالمقاومه , وليطالبونا ب’’الواقعيه’’ في التعامل مع ’’الحقيقه الصهيونيه’’ , وبضرورات خفض ’’توقعاتنا ’’ , والقبول بما هو ’’معروض’’ علينا .. وغيرهم سيشيرون لنا الى ’’اعدائنا الآخرين ’’ , وسيشحذون بنا الهمه والعزيمه , لنوجه بنادقنا الى قلوب ابناء جلدتنا , وكلهم امل بأن ينجحوا بإغراقنا في وحل مستنقعات حروب قبائليه عشائريه طائفيه ,تأكلنا بلهيب حممها , وبعضهم الآخر يشير لنا الى امكانيه الإستعانه ب’’بني إسرائيل’’ ليساعدونا على حسم تناقضاتنا ’’ الرئيسيه الجديده’’ , ولسان حال جميعهم يقول لنا ( ’’ انتم ضعفاء متنازعين , وعدوكم قوي موحد , ولا مجال لكم إلا بالتفاهم معه , والموافقه على حقيقته , وحتى الإعتماد عليه لحمايتكم من بني جلدتكم ’’ ) ….<br />…3…<br />نعم …<br />فبعد الأرض والوطن والإنسان , اصبحت إرادتنا هي المٌستهدفه …<br />لأنهم يعلمون جيدا ان من يمتلك الأراده والأمل قادر على إجتراح كل معجزات الأرض لتحقيق أهدافه , فما بالك بشعب يمتلك عداله قضيتنا , والحق أيضا ؟؟؟<br />وهم يعلمون ان من يمتلكه اليأس , يتخبط في اللحظه والمرحله , ويسلم لعدوه في اول المناسبات , فما بالك بشعب يعتقد بأنه محاصر, يواجه لوحده عدو ’’ فائق القوه ’’ , ويتلقى الضربات من ’’ الصديق ’’ قبل العدو ؟؟؟<br />…4…<br />تحت قناع الفرحه الذي سيعتمرونه غدا , سيحاولون إخفاء شعورهم المٌشترك بالخوف والهلع على صنيعتهم , ومصيرها , تماما كشعور السارق والظالم الذي يعلم في قراره نفسه أن ما تم إنتزاعه عن غير حق ,لن يدوم , وان الظلم , مهما طال الزمن , لن يسود …<br />تحت مظاهر القوه التي سيبرزونها لنا غدا , سيحاولون إخفاء حقيقه شعورهم المُشترك , بأن مشروعهم قد وصل ذروته بإستقطاب ما يقارب نصف يهود العالم , وأنه مهما كٌتب له أن يتقدم , لن يستطيع ابدا مواجهه ’’الرحم الفلسطيني ’’ الذي سيغرقه برجال مؤمنين بأن الحق الذي خلفه مٌطالب , أبدا لن يضيع …<br />تحت مظاهر السرور والغبطه التي سيبرزونها لنا غدا , سيحاولون إخفاء شعورهم بالفشل بحل المٌعضله الفلسطينيه , حربا او سلما , وأنها بالرغم عن أنوفهم , وال’’عظماء’’ الذين يقفون معهم , كانت ولا تزال وستبقى شاهدا على زيف قوتهم , وزيف خرافتهم , وعلى إنعدام خلقهم الإنساني …<br />تحت عضلاتهم المفتوله التي سيظهروها لنا غدا , سيحاولون أخفاء مفاصلهم التى ترتعد بعد ان إنكشف كعب كحيلهم في حرب لبنان , وظهر مقتلهم واضحا للعيان , أرض مكشوفه ومهدده في كل زواياها , بصواريخ شبه بدائيه , محموله من رجال مؤمنين بقوه الحق , ويرفضون الخضوع لحق القوه , و’’ تجمع كٌتل بشريه ’’ جمعتها ’’مصالح’’ , ولن تتردد وقت الشده عن حزم الحقائب والرحيل نأيا بنفسها عن العقاب الألي<br />5…<br />نعم ..<br />تحت المظاهر المُزيفه , يعملون على إخفاء حقيقه كيانهم, فهو ليس إلا عملاقا بأرجل من فخار ….عابر ولن يدوم إلا بمقدار إمكانيتهم ببث اليأس في نفوسنا , وإقناعنا بأننا لا نمتلك خيارا غير التسليم ب’’تفوقهم ’’ , وقبولنا للظلم بإسم الإعتراف بالأمر الواقع …<br />…6…<br />بعد ايام قليله , وتحت سحابه الألم والحزن والأسى التي ستتعدى كل الحواجز والجدران والحدود , وستربط كل فلسطيني الأرض قاطبه , ومعهم ملايين العرب والمسلمين , والأصدقاء محبى العدل والسلام , سيظهر لنا من جديد مصدر قوتنا الراسخه ….شعورنا المٌشترك بالظلم العميق الذي لحق بنا , والأمل الهادئ العميق المتجذر في عقل وقلب وضمير كل فرد منا بمستقبل من الحريه في وطن مستقل , والإيمان الذي لا يتزعزع بأنه مهما طال الزمان , فالحق سينتصر على الظلم , والمٌلك المسروق سيعود حتما لأصحابه , والمغتصب لن ينعم الى الأبد بثمار جريمته …فالحق الذي وراءه مٌطالب لن يضيع …<br />بعد أيام قليله , وتحت سحابه الألم والحزن والأسى , ستمتلئ قلوب ملايين الفلسطينيين , بشحنه جديده من العزم والأصرار المتحصن بقوه الحق التاريخي , وبحتميه إنتصاره , امام حق القوه , وسنتذكر معا مصير كل من إعتقدوا عبر التاريخ ان الجبروت والبطش قد يٌخضِع الفلسطيني البسيط , وهاهي اطلالهم تحت تراب وطننا شاهده بأنهم لم يكونوا إلا مجرد عابرين في تاريخ عامر وعابر وغابر , وما مصير غزاه اليوم بأفضل من غزاه الأمس , فهم أيضا لن يمروا وسيندثروا , مهما طال الزمان , تحت تراب أرض وطننا , هذه حتميه تاريخيه لا مجال للشك او التشكيك بها<br />…6…<br />ففي ذكرى النكبه<br />أرفع رأسك عاليا يا اخي ,<br />فأنت فلسطيني,<br />والفلسطيني لا يخضع …<br />ولأنك الحق ..<br />والحق حتما منتصر .."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

