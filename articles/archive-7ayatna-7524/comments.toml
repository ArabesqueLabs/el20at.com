subject = "ضع عنوان التعليق"
author = "مراد الملحم"
text = "بدي اكتب التعليق الي كتبتو الشرموطه المفضوحه ام ريحه طالعه سوسن الخضره مصاصه زباب شرموطه الرياض و الخبر الي مافي زب بالخبر والرياض الى مصتوه هاذي الشلقه الي كانت تتناك بارامكو من جميع الجهات واختها اريج الخضره مصاصه زباب كانت كمان تتناك من الامريكان نيك جماعي اما القرن عائض القرني اسم على مسمى كس اختك واحد سعودي خروف هبيلي خروف اخو ستين الف شرموطه تحكي غيرت مسار الحديث او غيرت مسار النياكه بدل ماصارت تتناك من كسها صارت تتناك من طيزها ولك هادول بنات حق فراش سهر وحشيش قله ادب كس اختكم ما بتجيبو غير الشراميط عشان يحكو عن فلسطين ولك كل زباب دخلت بكساسهم"
