text = "يا فلسطينه بشكل عام الاردن اولا و راح ضل اولا قلتو اه او لا فلسطين بيعتوها روحو دبرو حالكم و رؤساكم نهبوكم شو دخلنا احنا و انا بحكيها بوجهكم و بضهركم انو شعب كندره حثاله خاين شحااااااد و اذا عندكم رجال يحكي غير هاد الحكي قدامي وجه لوجه يجي الله يلعان فلسطين و كل من قال انا فلسطسيني تفووووووووووووو وووووووو"
