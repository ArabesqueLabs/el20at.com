[[comments]]
order = 87
subject = "الشعب الفلسطيني شعب جبار وقاهر"
author = "فلسطيني غصب عن الكل"
text = "يا أردنيين يا كلاب , عارفين لليوم الملك عبد الله تبعكم حايط عينه على فلسطين ونفسه يحتلها , لكن إن شاء الله بتنبظ عينه البعيد<br />وتاني إشي , إنه كل اللي عم بصير بفلسطين وخاصة غزة كله تحت رعاية أردنية حقيرة , لأنه هو بكره غزة وفلسطين كلها , لكن<br />الشعب الفلسطيني شعب جبار وقاهر , ورح يجي يوم يا أردنيين بإذن الله الواحد الأحد ونستعيد أرضنا وبلدنا مش الأردن (هي اصلا<br />الضفة الشرقية من فلسطين) ورح تشوفوا كيف الفلسطينيين رح يلعنوا أبوا الأردنية الكلاب , وحسبي الله ونعم الوكيل"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 88
subject = "عرب ومسلمين"
author = "عربية من اصل عربي"
text = "عنجد بكفي والله مئصرتو ببعض لشو كل هالكلام احنا كلنا عرب وكلنا اصل واحد لافي اردني ولا في فلسطيني ولا سوري ولا لبناني كلنا بلاد شام وكلنا بنحب بعض ليش هالكلام هاد ليش كل هالكره وليش كل هالعنصرية فلسطيني واردني<br />اعتزو بأصلكم بأنكم عرب وليس بانكم اردنيون او فلسطينيون انتو بانو عصر عايشين خلص والله كل هاللي عم بصير بالدنيا منكم ومن تمييزكم اصحو يا عالم اصحو وشوفو الغرب كيف عم يشمتو فينا شوفو كيف العرب صارو جرب من تحت كلامكم البذيئ عنجد خلص زودتوووها بكفي احنا كلنا عرب وبلاد الشام رح تضلها بلاد الشام ليوم الدين وكلنا فلسطينية واردنية بنحب بعض واكبر دليل انو العاهل الاردني ملكنا اخد وحدة منا يافلسطينية ويا اردنية ياللي عملو الملك هاد اثبت بانو ما تمييز ومافي عنصرية ومافي اشي اسمو فلسطيني واشي اسمو اردني احنا اهل احنا بلد وحدة ليوم الدين ..صفو قلوبكم يا جماعة وصلو عالنبي احنا لا بنكره الاردنية ولا اشي انتو حاطين ببالكم هالشي وبعدين يا فلسطينية كمان انتو حاطين ببالكم انو الاردنية بيكرهوكم ليش هالقناعات هاااااي ليييش؟؟؟؟؟!!! والله كلنا بلد وحدة وكلنا عرب ليش بدكم تميزو ربنا خلق القرآن بلسان عربي فصيح ما خلقو بلسنا فلسطيني او اردني حتى يفرجينا انو ما في تمييز اتقو الله يا مسلمين وشوفو يللي عم بسير برا شوفو اللي بتئتلو بالعراق وبلبنان وبكل البلدان واولهم فلسطين العربية العرب كلهم عم ينظلمو بس بإذن الله رح ترجع متل زمان ورح تحكم العالم (العرب ثم العرب ثم العرب) لا للعنصرية>;>;حبو بعض في الله اعظم انواع الحب هو الحب بالله صفو نيتكم وصلو عالنبي ما بدي ارجع اشوف هيك كلام بينكم ياعرب,, انا من اصل فلسطيني بس من جنسية اردنية وبحب البلدين ,, وكل بلدان العالم .. كونو بخير احبائي في الله.."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

