subject = "سياتيكم يوم يا عبيد اليهود"
author = "ابو شلاش"
text = "ميساء علي نعيم<br />قررت الزواج من احد اقربائها في الاردن<br />تم الزواج بالوكالة وتم اصدار عقد زواج بينهما من احد المحاكم<br />ولكنها تحمل وثيقة سفر عراقية وهي في العراق<br />وزوجها يحمل جواز سفر اردني وهو في الاردن<br />قام بتقديم طلب الى وزارة الداخلية لمنحها تأشيرة دخول للالتحاق بزوجها وفقا لعقد الزواج الذي بينهما<br />تم اصدار موافقة ومن وزير الداخلية الاردني شخصيا بهذا الشأن .<br />فكانت فرحة لا توصف من قبل ميساء واهل ميساء لانها سوف تخلص من هموم الوضع في العراق .<br />قامت ميساء بالسفر الى الاردن في يوم 20/7/2007 وتم منعها من دخول الاردن وقام ضابط النقطة الاردنية بالقول تارة ان رقم الكتاب غير واضح وتارة اخرى ان هناك اجراءات امنية مشددة تجاة كل فلسطيني قادم من العراق .<br />فقامت بالتوسل اليهم فقال لها ارجعي والا سامسح بك الارض او ساجلب من يرجعكي بالقوة وبقيت في االعراء ثلاثة ايام تتنقل بين النقطة الاردنية والعراقية لان اي عربي يخرج من العراق غير مسموح له بالعودة اليه ، وبعدها جاء زوجها الى الحدود وجلس معها وقال لضابط النقطة الاردني انا زوجها ولدينا موافقة بدخول الاردن وانا اريد زوجتي فما الحل !<br />فقال له ضابط النقطة الاردنية الحل بسيط ائت باي قاضي الى هنا وطلقها ولتعد ادراجها .<br />وبعد عدة محاولات يائسة عادت ميساء الى العراق بعد ان تعاطف معها ضباط النقطة العراقية وسمحوا لها بدخول العراقية ثانية .وعلى مسؤوليتهم ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

