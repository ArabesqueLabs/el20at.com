subject = "فلسطينيه رافعين راسنا على طول"
author = "مها ابراهيم"
text = "سلام عليكم<br />أولا بحب أرد على الأردني اللي مع احترامي الشديد مش فاهم اشي في الدنيا اللي حواليه ،،، الفلسطينيه باعو أرضهم اه ،،لو انك مره وحده حاولت تقرأ في التاريخ كان ما حكيت هيك بس أنا بقلك اشي هوه صح لازم الفلسطينه يتبعوا معكم \\\" وأعرض عن الجاهلين وقل سلاما \\\" بس أنا حبيت أرد عليك عشان أفهمك شو الوضع بلكي فهمت شو بيصير حواليك ،، انا ما زعلت منك لا والله انا بس زعلت عليك ،، زعلت كيف انكم أتباع للملك تبعكم اللي باع فلسطين وكل دمارنا من تحت راسه،،، زعلانه انك جاهل وعمرك ما قرأت مراسلات حسين مكماهون ولا عمرك ما سمعت شو عمل الملك فيصل<br />احنا عارفين حالنا ومش رح أناقشك أكتر بموضوع أرضنا اللي راحت تحت تهديد السلاح والعنف والدمار،، مش رح أناقشك بانه في ناس طلعت من بلادها وتركت مصاريها في بيوتها لانها كانت حاطه أمل على الجيوش العربيه اللي جايه بعد يومين<br />مش رح أقلك مين اللي وقف الجيش الاردني والعراقي والمصري من انه يكمل قتاله في فلسطين ،،، روح اقرأ وشوف ،، ما تضلوا عايشين حياة البدو اللي مش فاهمين وين الدنيا رايحه<br />انا بس بدي أقلك احنا طلعنا بس بشرف بس عيب على اللي ببيعوا في أراضي الأردن لليهود ،، روح شوف قديش صارت نسبة الأراضي الأردنيه باسماء يهود في الوقت اللي ممنوع الفلسطيني االلي ما معه جواز اردني يشتري أرض ،،، اصحوا يا أردنيين يا نايميين وما تضلوا ماشيين تحت ملككم اللي مغميلكم عيونكم ومشيكم<br />روح شوف شو التسهيلات اللي بتنعطى لليهود في بلدكم وانتو نايمين ،،، بس شو بدي أقول<br />ما انتوا امه لا بتقرأ ولا بتكتب من وين بدكم تتعلموا هادا الحكي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 515
subject = "قطر الدوحة حي الهلال"
author = "محمد السروان"
text = "انا فلسطيني وافتخر انا مابدي احكي كثير ومابدي ارد على الاردني المتعصب لانة جاهل مسكين بحكي المثل جاهرت العالم وغلبتة وجاهرني الجاهل فغلبني فلسطين اااااااااااااااااااااااااااااااخ ما اغلى ترابك احنا العرب مش كويسين مع بعض مااشطرنا بس نشمت في بعض بدل ما تناصر اهل فلسطين يا جاهل لانة بلد عربي مسلم على الاقل روح دور على اصلك يا وسخ ان مش عنصري لاكن فلسطيني غصب عن رحمة شرفك واضيف الى معلوماتك انا من مواليد الاوسخ قصدي الاردن على فكرة مابدي تزعل مني ياجاهل ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 516
subject = "مناصر حموووووودة شكري"
author = "محمد السروان"
text = "اللة ينصرك ياحمممممممممودة شكري يا قاهر الاردنين اولاد اصدقاء ازواجهم ما لقيت ارخص من البنات الاردنيات الحق يقال معلمات في مص الزبااااااااااااااااااااااااااااااااااااااااااب هادة الحلو فيهم خلي اخو الشرموطة الاردني يجيبلك اختة تمصلك ايرك وتحياتي الك ولاهل فلسطين ولكل شاب عندة كرامة لاخوانة الفلسطينين . وكس اخت احسن اردني خسيس عميل لاسرائيل تفووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووو عليكم متاسف يا اخوات العاهرات ازا بدي اسبكم اكثر بحكي يا اردنين تفووووووووووووووووو ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 517
subject = "قطر الدوحة حي الهلال"
author = "محمد السروان"
text = "محمد نواف باختصار كس اختك ياابن الشرموطة الاردنية مع خالص الشكر لاختك مصيصة زباب الفلسطينية ولك الاردنيات بطلعو في باص القرية الفاطس و ريحتكم من ركوب الحمير الي هية حضارتكم تلويث للبيئة بوصلو المدينة يدورو على زباااااااااااااااااااااااااااااااااااااااااااااااااب الفلسطينية بتعرف ليش يا ابن الزنا علشان انتو ما بتعرفو الى الجيش رجالكم كلهم بلجيش بتغيبو عن نسوانكم بلاشهر بطلعو على سدد المحلات التجارية علشان ينتاكو برجع الخرة منكم بلعب على طيز مرتة الي مطلقها عشريييييييييييييييين مرة بقلها هييييييييي يامرة افتحي رجليكي بدي انيشك نيش هسع و العب عطيزش انا ما بدي اطيل الكلام اسئل امك مين ابوككككككككككككككككككك صاحب اي محل تجاري في الاردن يا ابن الزنااااااااااااااااااااا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 518
subject = "اخر خبر"
author = "يوسف الشاهد"
text = "الاردنيون اولاد القحبات.. بعد ما اجروا ارضهم 99 سنة في الباقورة وجنوب البحر الميت طبعا غصبن عنهم لانهم ما بقدروا على زعل اسيادهم في تل ابيب وواشنطن ولندن.. بعد التاجير صاروا يبيعوا ارضهم عينك عينك.. واخر خبر اعلنت صحيفة يديعوت احرونوت في عددها الصادر اليوم ان اليهود استطاعوا استملاك الاراضي الواقعة من منطقة جلعد - البلقاء مرورا بمنطقة السرو غرب الفحيص غرب ماحص الى غرب دابوق مرورا بمنطقة بدر وحتى جبل نيبو - مادبا ونسبة الاستملاك وصلت حتى الان الى 35% والحبل على الجرار.. واولاد العشائر اللي بسميهم ملكهم \\\"نشامى\\\" بتمسخر عليهم.. ببيعوا في الارض وبسمسروا وهم عارفين لليهود المهم النشمي يروح يجوزله وحدة لبنانية تنيكه بدل مرته المعفنة اللي ماكلها القمل والبراغيث وكسها معطبن.. كس ام هيك شعب اخو شرموطة.. شعب مرتزقة شحاد عايش على المساعدات وعلى ظهر الشعب الفلسطيني اللي تامروا عليه عينك عينك منذ المقبور عبدالله الاول وحتى اليوم.. هذا شعب اكثر شعب متامر في التاريخ العربي المعاصر وسيكتب التاريخ بحروف من خرة سيرة هذا الشعب وسيرة دولته المصطنعة المسخ التي اقيمت لخدمة بني صهيون"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 519
subject = "معلومة عن محمد نواف الحمدالله"
