[[comments]]
order = 146
subject = "الأردني"
author = "هههههههه"
text = "شوف الفلسطينيات مش عارفين يردو وعاملات حالهم شريفات ولكم خلص تركتو طبع عنكم للعالم كلو انكم اجحب خلق الله وبعد كل الحكي بتيجيلك بنت او بنتين منهم بعملو حالهم عذراوات وبحكو عن العيب وبعدين بتحكو انو اللي استحو ماتو انا عارف منيح ان هاد الكلام الكم با فلسطينية والعالم كلو بشهد انو انتو الكم المثل اللي استحو ماتو وبعدين انتو بتحكو انو الأردن الضفة الشرقية تبعت فلسطين ولكم يا ولاد البندييق احسن ما تكون اليهود ما خدينها مش بكفي ماخدين غزة واالضفة الغربية وداعسين على اشرف واحد فيكم على القليلة احنا مكرمينكم معيشنكم احسن عيشة ومش ماخدين مقابل منكم وفوق كل هاد معطينكم جوازات ومش معبي عينكم صحيح انتو ما بعبي عينكم غير التراب روحو شوفو البلدان التانية ((شو عاملين بالاجئين الفلسطينية)) كيف مسحين فيهم بلاط الحمامات وخاريين عليهم ولكم الواحد فيكم لازم يبووس زب الأردنية عشنهم مفضلين عليكم والبنات الفلسطينة لما بدكم تحكو عن العيب تحكوش كلام وسخ عشان سدقووكم الناس انكم بتفهمو العيب وكمان ضلكمش تلحسو زباب الحيوانات لإنكم والحمد الله لحستو زباب شباب الفلسطينية كلهم فخلصتووهم وروحتو على زباب الحيوانات فكولو خرا وضلكمش تتمنيكو على الفاضي ولكم انفضحتو بالعالم كلو"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

