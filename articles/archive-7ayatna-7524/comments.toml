subject = "الاردن وتدمير العراق"
author = "الدكتور العراقي"
text = "قالوا \\\"مصائب قوم عند قوم فوائد\\\". ولسوء حضنا العاثر أن يرى حكام الأردن أن مصلحة بلادهم تقتضي خراب العراق وأن يبقى كذلك لا تقوم له قائمة إلى يوم القيامة. فلو تابعنا العلاقات الأردنية-العراقية منذ تأسيس هاتين الدولتين في أوائل القرن الماضي على يد بريطانيا، لوجدنا أن الأردن كان المستفيد الأكبر من هذه العلاقات وعلى حساب مصلحة الشعب العراقي وفي جميع العهود. أنا لست ضد المصالح المتبادلة ولا حتى ضد المصالح غير المتبادلة التي لا تضر بالجانب الآخر، ولكني ضد مصلحة تقوم على أساس تخريب البلد الآخر بدون رادع من اخلاق أو وازع من ضمير في الوقت الذي يمكن فيه تحقيق هذه المصالح على أساس النوايا الطيبة ولصالح الطرفين.<br />فالمعروف عن الأردن أنه بلد صحراوي فقير اقتصادياً وكان يعتاش على المساعدات البريطانية والأمريكية، وكان هو المستفيد الأكبر من الاتحاد الهاشمي في أواخر العهد الملكي. وبعد ثورة 14 تموز 1958 خسر هذه المصلحة فصار الأردن وكراً لحبك المؤامرات من قبل المخابرات الأجنبية وحزب البعث ضد الجمهورية الفتية، انتقاماً من الشعب العراقي الذي تجراً فثار على حكم كان غريباً عليه ومهيناً لكرامته وسارقاً لثرواته. واعترف الملك حسين لمحمد حسنين هيكل بذلك ودور المخابرات الأمريكية في دعم حزب البعث في انقلاب 8 شباط 1963 الدموي الأسود الذي يعتبر نظام صدام حسين امتداداً له.<br />والكل يعرف دعم الأردن لنظام صدام حسين، خاصة في حروبه العبثية ضد إيران وغزوه للكويت. فوقوف الأردن إلى جانب نظام المقابر الجماعية لم يكن بدوافع قومية كما يدعون، ولا بسبب الغباء السياسي أو قصر نظر كما يتصور البعض، بل بدوافع الثأر البدوي والخبث والدهاء لتخريب العراق والانتقام من الشعب العراقي على ثورة 14 تموز، ولأن المسؤولين الأردنيين وجدوا في تخريب العراق ضماناً لمواصلة نهبهم لثرواته طالما بقي العراق يحكمه نظام دموي غبي مثل نظام البعث الفاشي.<br />فكان عراق صدام حسين البقرة الحلوب، يجهز الأردن بالنفط الخام بما قيمته أكثر من 300 مليون دولار سنوياً مجاناً وحتى أيام الحصار الذي كان يتضور الشعب العراقي جوعاً. إضافة إلى صرف مليارات الدولارات من أموال الشعب العراقي على تبليط الطرق في الأردن وتطوير ميناء العقبة وبناء الأحياء السكنية للمحامين والصحفيين وغيرهم من المتنفذين الأردنيين من مرتزقة صدام حسين ومثقفي الكوبونات النفطية، حتى صارت الإستخبارات الأردنية جزءً من الإستخبارات البعثية العراقية. ولهذا لا عجب أن ينبري أكثر من 800 محام أردني للدفاع عن أشرس طاغية في التاريخ وتخرج المظاهرات الصاخبة لنصرة ولي نعمتهم صدام.<br />ومع دعمها لحروب صدام حسين العبثية، فقد عملت الحكومة الأردنية على الاستفادة من تلك الحروب إلى أقصى حد ممكن، حيث طالبت بمبلغ خيالي حوالي 13 مليار دولار كتعويضات عن \\\"الأضرار\\\" لحقت بالأردن جراء حرب تحرير الكويت. ولا أدري ما هي الأضرار التي لحقت بالأردن وهو الذي اختار أن يقف إلى جانب الجلاد في موقفه المخزي من حرب تحرير الكويت. والكارثة الأشد إيلاماً أن لجنة الأمم المتحدة لدفع التعويضات لم تتحقق عن صحة هذه الادعاءات ومعظمها باطلة. كما صادرت الحكومة الأردنية الأموال العراقية في مصارفها والتي تقدر بأكثر من مليار دولار، مدعية أنها مخصصة لدفع استحقاقات شركات أردنية. وهكذا أصبحت أموال الشعب العراقي نهباً للصوص والنصابين، كأكبر سرقة في العصر وبمباركة الأمم المتحدة المفترض بها أن تمثل الشرعية الدولية. لذا لا نستغرب أن شارك موضفو الأمم المتحدة في الرشوة والفساد الإداري ونهب الأموال العراقية من خلال تنفيذ برنامج (النفط مقابل الغذاء) لصالح صدام حسين وحتى تورط ابن كوفي عنان نفسه في هذه القضية التي تنتظر التحقيق أمام المحاكم.<br />وحتى بعد سقوط نظام الفاشية في العراق واصل النظام الأردني تحقيق المزيد من المصالح من وضع العراق المزري. فصار ملاذاً آمناً لفلول النظام الساقط، حيث احتضن عائلة صدام حسين وأسكنها في قصور مرفهة. كما وهرب إلي الأردن الألوف من البعثيين المجرمين وأثرياء الحروب ومعهم المليارات من الدولارات التي سرقوها من الشعب العراقي المحروم، ليشتروا بها البيوت الفارهة ويقيموا المشاريع الاقتصادية ويؤسسوا أوكار التآمر وتجنيد المخربين لمواصلة قتل العراقيين وتدمير البنى التحية.<br />ليس هذا فحسب، بل تتظاهر الحكومة الأردنية أنها تسعى لخير العراق، وهاهي تنظم الدورات العسكرية لتدريب قوات الشرطة العراقية!. ولكن هل كان ذلك حباً بالشعب العراقي وحرصاً على أمنه، كما يدعون؟ كلا، كان ذلك مقابل مليار ونصف المليار دولار لتدريب 1500 عراقي فقط، أي مليون دولار لتدريب كل شرطي. كان بالإمكان استثمار هذا المبلغ لفتح العشرات من مراكز التدريب في العراق حيث يوجد فيه الألوف من المدربين العراقيين في هذا المجال، الأمر الذي كان يساعد على كسب هذه الكوادر العراقية للعهد الجديد وكإجراء للتخفيف من وطأة البطالة ولتوفير العملة في بلد يعاني أشد المعاناة من الفقر والبطالة. وهذا يعكس مدى استفادة الأردن من العراق في جميع الأوضاع والظروف والعهود. وبخصوص تدريب العراقيين، سؤال نطرحه على الأردنيين، كيف عرف الإرهابيون في اللطيفية بقدوم الخريجين التسعة من ضباط الأمن العراقيين بعد أن غادروا الأردن متوجهين إلى مدينتهم كربلاء، حيث نصبوا لهم كميناً وقتلوهم جميعاً؟ إنه مجرد سؤال!!<br />ولكون الأردن بلد صحراوي، وشدة تمسك شعبه بالبداوة وقيم الصحراء، لذلك لا نستغرب أن ينجب أناساً من أمثال الزرقاوي وغيره من الإرهابيين الناقمين على الشعب العراقي وعلى الحضارة. فشعب تشرب بقيم البداوة يكون عصياً على التحضر لأن الصحراء تعزل سكانها عن الشعوب الأخرى، عكس البحر الذي يساعد على الاحتكاك بين شعوب المدن الساحلية فيعجِّل في عملية التطور ونشر الحضارة وروح التسامح. ولذلك تقف الشعوب الصحراوية ضد التغيير كما يقول هيغل، (والبداوة حضارة جامدة) كما يرى توينبي. لذا فلا نستغرب هذا الاندماج والتماهي بين سكان المدن العراقية الصحراوية مثل الرمادي والفلوجة مع الوافدين من المدن الصحراوية الأردنية مثل الزرقة، مسقط رأس الإرهابي أبو مصعب الزرقاوي.<br />وهذا ينسجم تماماً مع أيديولوجية البعث التي تمجد البداوة وتتغنى ب\\\"نقاء\\\" الدم العربي وعملت على إحياء حكم القبيلة والعشيرة والعائلة والنظام العشائري في العراق. وربما أطلقت السلطات الأردنية سراح هذا المجرم (الزرقاوي) قبل الحرب على صدام حسين من أجل تحضيره لمهمته القذرة التي يقوم بها الآن في العراق. فقد قرأنا قبل أسابيع أن حوالي 400 عائلة أردنية أعلمت السلطات في عمان أن أبناءها التحقوا ب\\\"المقاومة\\\" العراقية. وهذا جزء ضئيل من الرقم الحقيقي من الأردنيين الملتحقين بالإرهاب في العراق. وبحجة دوافع إنسانية، فتح الأردن مستشفى في الفلوجة، لا حباً بالعراقيين، بل وكما تفيد التقارير التي تنشر على مواقع الإنترنت الداعمة للإرهاب أن العاملين الأردنيين في هذا المستشفى يساعدون \\\"المجاهدين\\\".<br />وقد بلغت الوقاحة في تدخل الأردنيين السافر في الشأن العراقي، حتى أنهم يخططون بتنصيب الأمير حسن ملكاً على العراق، ويؤيدهم في ذلك مع الأسف عدد صغير من المرتزقة العراقيين الذين يطمحون أن يكونوا خدماً في بلاط الملك المنتظر، وبذلك ليتحول العراق إلى مستعمرة أردنية كما يحلمون، كما كان حال سوريا أيام \\\"وحدة ما يغلبها غلاب!\\\". وهاهو الملك الأردني يتدخل صراحة حتى في ترشيح الشخص الأنسب لمصلحة الأردن لحكم العراق، كذلك دفاعه المستميت عن حزب البعث ومطالبته بمشاركة هذا الحزب الفاشي في الحكم. فقد صرح هذا الملك قبل فترة أن أنسب شخص لحكم العراق أن يكون سني وعسكري. وفلان لا يصلح لحكم العراق لأنه شيعي... لا بل راح الملك يطالب بإلغاء الانتخابات العراقية المزمع إجراؤها في بداية العام القادم، مشككاً بنتائجها حتى قبل إجرائها. فهل هناك أكثر تدخلاً من هذا؟ ولماذا لا تتحرك حكومتنا للجم هؤلاء ووضع حد لهم في تدخلهم الفض في الشأن العراقي؟<br />لقد صرح السيد وزير الخارجية العراقي الأستاذ هوشيار زيباري قبل يومين أن \\\" فلول النظام السابق اجتمعوا في دولة مجاورة وقرروا تخريب الانتخابات وأنابيب النفط\\\". وأنا إذ أسأل، لماذا لا يسمي السيد الوزير تلك الدولة لفضحها.<br />خلاصة القول، هناك دول مجاورة مثل إيران وسوريا، تعملان صراحة لإفشال الديمقراطية في العراق وتحويله إلى فيتنام ثانية نكاية بأمريكا. وهناك دولة أخرى مثل الأردن، تعمل على تدمير العراق، رغم علاقتها الحميمة مع أمريكا، ولكنها تعمل ذلك لأنها ترى أن مصالحها الاقتصادية تقتضي إبقاء العراق مدمراً. لذلك نطالب الحكومة العراقية بالدفاع عن مصلحة الشعب العراقي ومواجهة هذه الدول وفضحها في المحافل الدولية وحتى تقديم شكوى عليها للأمم المتحدة لإيقافها عند حدها؟ فنجاح الحكومة يعتمد على دعم شعبها لها وليس على التستر على الدول التي تريد تدمير العراق."
