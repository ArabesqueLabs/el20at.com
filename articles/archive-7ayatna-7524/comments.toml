[[comments]]
order = 280
subject = "وكونوا عباد الله إخوانا"
author = "عربي مسلم"
text = "بسم الله الرحمن الرحيم بداية ( لا حول ولا قوة الا بالله)<br />يقول العرب مجنون الناس بتضحك عليه ومجنونك بتيلش فيه<br />وأقصد بهذا الكلام السيد المبجل محمد نواف الحمد الله الذي لم يلق بالا\" لإستحلافي له بالله ... وأسأله هل أصبح الله شيئا\" بسيطا\" الى هذه الدرجة بحيث لم تمنتنع عن هذه الترهات ؟ ثم الى السيد المحترم الذي رد عليه وأطلق أسم مستعار وسخيف لنفسه ( الأردن على ..............) فعلا\" أن كلاكما لستما بمسلمين ولا عرب ولا تمثلان لا الأردن ولا فلسطين الطاهرتين بل تمثلان شخصين مريضان لا يمتان بالعروبة والأصالة بشيء ..... إن كلام كليكما ومن على شاكلتكما هو نباح كلاب لا أكثر ولا أقل فأنتما لم تستمعا للكلام ولم تتبعا أحسنه وأنني أرجو لكما الهداية ...<br />لننته من كل هذا ولنبدأ أخوة متحابين<br />إن هذا يدفعنا الى أبعد من ذلك فنحن اليوم نعاني من مشكلة فتح وحماس الأخوة وهي فتنة لعن الله من أيقظها ...<br />اللهم أصلح بينهم يا عزيز يا قدير ( فالرابح من هذا الخلاف هو إسرائيل وإيران) وعلى حساب دم أطفالنا وأبنائنا وأقول أبنائنا ... نعم إن الطفل في غزة أو الضفة هو إبني ودمه يراق من دمي .....<br />صدقوني لن ترقى الكرامة العربية بهذا النهج وهذا التفكير المحدود<br />ما الأردن وما فلسطين لا فرق ( شماغ أحمر وآخر أسود ... أبي إرتدى ويرتدي كلاهما ... منسف ومفتول ... نستمتع بكلاهما .... ملوخية ورشوف لا فرق فكلاهما حلال أمي وأمك كلاهما طاهرتين ماذا بعد<br />يا أخوتي بالله عليكم لا تفسحوا المجال لأعدائنا للنيل منا<br />أعز أصدقائي كان من فلسطين .....<br />والله ثم والله أن كل من ينجرف وراء تلك الشتائم لا يمثل (فلسطين ولا يمثل الأردن) بلاد النخوة والمقدسات بلاد الرباط<br />والمجاهدين ولا أعترف ولن أعترف بإنتماء أي منهم لنا .....<br />نحن الأردنيون نعلن برائتنا من كل من يتلفظ بسوء على أخوتنا الفلسطينين وأطلب من أخوتنا أن يحذوا حذونا ويتخلوا عن كل من لا يستجيب للنداء<br />ولتكن صفحة للحوار والنقاش والأخوة<br />لا تنسوا أن نايف حواتمة أردني من السلط وهو من الأسماء اللامعة في تاريخ حركة المقاومة الفلسطينية منذ الستينات<br />ولنكن مهاجرين وأنصار لا محتلين ومحتلين<br />أخي محمد نواف إذا كان هذا الكلام يعطيك مزيدا\" من الصحة فأنصحك باللجوء الى أقرب مستشفى لإزالة المرض الخبيث منك<br />والأخ الفلسطيني الآخر الذي وضعنا في مكانة ( على ...........) أرجو منك تناول أقراص مهدئة عساها تشفيك وتعيدك الى رشدك أو أن عليك وزر المتضررين الى يوم الدين<br />فلسطين ... الأردن .... الى الكرامة والع7زة إنشاء الله وبجهود أبنائها البرررة<br />والسلام عليكم ورحمة الله"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 281
subject = "إلى عربي مسلم"
author = "محمد نواف الحمدالله ..."
text = "ولك كس أمك إذا بتفهم .. أنتا واحد اخو عاهره .. لاتفقه بالحياة شيئاً .. أنتا واحد اخو شرموطه .. ابن حرااااااام ..<br />ولك كس أمينها امك يا ابن القواده ،،،<br />يلعنك ويلعن اللي خلفك يا بن مرتي ............... ولك يلعنننننننننننننننننننننننننننننننك شو ابن زناااااااااااااااااااااا<br />ااااااااااخ يا الله .. من وين بطلعوا هذوله النفهات ولاد الشرموطه ( أولهم عربي مسلم *) كس أختك كل مالف عجل سيارة ...<br />يلعن امك شو انو كسها مفتوح زي المغاره .. ولك منيوك اخو شرموطه انتا واللي عاملين حالهم بفهمو<br />أي كس أختك إذا انتا فاهم ‘إشي ...<br />ولك رف عن ايرنا خلينا نفظح بعراض هذوله الفلسطيزية<br />فش فيكو واحد زلمه !!!<br />للأسف الشديد ................. الكل صار يحكي ويحكي ويحكي ... وياريتو بفعل .. \\وانتا أولهم يا عربي مسلم |<br />فعلاااااااااااااااااااااااً هزلــــــــــــــــــــت وقل منافعهااااااااااااااااا<br />وشكراً \\"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 282
subject = "يسب الرجل أبا الرجل فيسب أباه ويسب أمه ( من الكبائر)"
author = "عربي مسلم"
text = "بسم الله الرحمن الرحيم<br />أولا\" : يا محترم يا ابن الأصل هذا الكلام لا يليق بأردني أصيل ولا عربي ولا مسلم ولا حتى إنسان<br />ومعاك الى النهاية وأشبع غرائزك بجميع أنواع الشتائم ... بشرط أن لا تتحدث عن الرجولة والشجاعة<br />والتي لا تثبتها أقوالك وألفاظك .. ولكن ( من يهن يسهل الهوان عليه ما لجرح بميت إيلام)<br />الشجاعة والرجولة ليست بالإختباء خلف جهاز الحاسب والنقر على المفاتيح في غرفة مظلمة لا يعلم أحد مكانها<br />.... وملىء الأرض والأجواء بشتائم لا تدل إلا على أنك مدرب عليها بل محترف وحاصل على شهادة عالية في فن<br />القدح والذم والسباب ... أو أنك تعيش في بيئة ( حاشى لله أن تكون الأردن) وضيعة تملؤها الرذيلة .... وأقسم أن من أرضعتك ليست أردنية ..... فحليب أمهاتنا لا يحمل إلا الطيب والعفو والمسامحة ...<br />ولكن أذكرك بأنك لم تكن يزما\" وطنيا\" أو اردنيا\" لأنك جعلت الآخرين يسبوننا نتيجة\" لأعمالك ....<br />ولم يخولك يوما\" لا الشعب الردني ولا الملك عبد الله الثاني حفظه الله بأنه تتحدث بأسمه أو أن تدافع بهذه الطريقة الهمجية<br />ولكنه الفيروس الذي تعاني منه ...وقد نصحتك بمراجعة مستشفى لعلاج ذلك ......<br />وأود أن أؤكد أيضا\" أن الجميع يجب أن يتوقف عن ذلك فلسطيني أو أردني .....<br />وأن نتخلى عن هذه النفوس المريضة وهذه البكتيريا التي تنشر المرض بيننا ....<br />لا أنكر أن هنالك شحناء وأسى ولكن لينتهي هذا الآن ...... ليس لشيء ... إنما لإخراس هذه الفئة الضالة التي نسأل لها الهداية....<br />يا محمد وخسارة هذه الإسم فيك ...... لست مفوض عن الأردنيين بزرع الشقاق بيننا وبين أحد في العالم ....<br />أتحداك أن تكتب عنوانك بالكامل وأين تسكن بالتحديد......هذه إذا كان إسمل محمد..<br />كما أؤكد للمغفلين أمثالك من الطرفين بأن البعض أصبح يستخدم أسماء ومن بلاد عربية أخرى لتظهر بمظهر المناصر له وهذ ا كله ضحك على ذقونكم .... استيقظوا .... هم فقط ....مجموعة أبناء شوارع ... لا يتعدوا أصابع اليد من إختلقوا هذه الفتنة......... ووقع بها الجهلة..<br />أما الدكتور محمد عوض ..... ( والغريب أن كل المغفلين أسمهم لا يستحقونه وهو إسم أشرف الخلق عليه أفضل الصلاة والتسليم ) فهو مغفل آخر ولو أنه علمه أستغله في نشر الصورة الناصعة للمسلمين والعرب والسعي لرفعة الأمة وليس للحديث بأسلوب لا يتعدى أسلوب الحشاشين أو المخمورين .... لكان أفصل له ... أما أن يضيع وقته هو والآخر الدكتور التافه أسامة فوزي وموسوعة قلة الحياء الساقطة ( وييبيضيديا) ( لعنة الله على من أسسها وكتب بها) في التجريح بالأخرين ... فنقول لا أنتم خفافيش الظلام ..... وإنكسار الأمة بسببكم .......<br />مخدوعين جاهلين وضالين .... هذا أنتم ..... المحطئون من الطرفين .....<br />سنبقى مهذبين لإننا هكذا تربينا .... ولن نرد السباب بمثله .... ولكن بالدعاء لكم بالهداية<br />وسنبقى ملتزمين بأدب الحديث والحوار لأن الإناء ينضح بما فيه<br />ورجاء الى الأخوة الفلسطينيين لا تسبونا فنحن معكم وإذا أردتم الرد فالرد بالإسم على المسيء فقط .... فلار تشملونا بالبغض لمجرد سفيه منا لا نعترف بإنتمائه لا .... وقد يعاني من الأرق ولا يريحه إلا السباب لينام<br />عربي مسلم ومن الكرك أيضا\""
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 283
subject = "الى الجميع"
author = "عربي مسلم"
text = "نسيت أمر مهم ..... لا يوجد في المملكة الأردنية الهاشمية عائلة أو عشيرة أسمها الحمد الله ولن أسمع بها مطلقا\" فعشائر الأردن هي:<br />عشائر الشمال : أهل الجبل . بني خالد . العيسى . السرحان . النعيمات . بني حسن وهي من اكبر العشائر<br />بدو الوسط : بني صخر . عباد . العجارمة . العدوان . الدعجة . الشوابكة . الرقاد . الدبايبة . مصاروة سحاب . وبلقاوية مادبا مثل الشعرا والشاهين وغيرهم<br />بدو الجنوب : بنو حميدة . الحويطات . الحجايا . النعيمات . الإحيوات . السعيدين . العمرو وهي من أقدم العشائر . بنو عطية<br />وهنالك أيضا\" عدد كبير من العشائر في اربد وعجلون والسلط والكرك ممن لا يعتبروا من البدو مثل العبيدات وبني دومي وبني ياسين والبطاينة وغيرهم كثيرين لا يسمح الوقت بعدهم ولا ننسى عشائر السلط من عربيات وزعبية وحيارات ونسور وحياصات وعشائر الكرك الطراونة والمجالي والغساسنه والطفيلة من عوران وعقايلة والزيدانيين والرفوع وخوالدة وغيرهم ومعان من كراشيين والرواشدة ......الخ<br />ولكن لا وجود ل عشيرة تسمى ( الحمد الله ..... )"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

