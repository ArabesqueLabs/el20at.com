order = 343
subject = "إلى يهود العرب الأردنيين"
author = "يوسف البحيصي"
text = "أي واحد بحكي عن فلسطين و أعرف وين مكانه و الله و الله لأسلخ جلده<br />أقسم بالله يا كلاب العرب يا أردنييين<br />و حياة فلسطين و كل نبي دخلها لأادمره"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 344
subject = "إلى يهود العرب الأردنيين"
author = "يوسف البحيصي ( الفلسطيني العصامي )"
text = "أقسم بالله اللي بحكي عن فلسطين لأسلخ جلده<br />و أنا ساكن بالإمارات و حياة فلسطين و ناسها و كل نبي داسها<br />اللي بعرف وينه في الإمارات و واحد في الكلاب الأردنيين خليه يسب و يقلي و وين هوة في الإمارات و خاصة بمنطقة العين لآجي أورجيه مين أسياده الفلسطينيين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 345
subject = "أخي يوسف البحيصي"
author = "عاشق فلسطين"
text = "السلام عليكم ورحمة الله وبركاته أخي , عندك محمد نواف الحمد الله عايش بالإمارات على فكرة , وهو كاتب هيك في أحد تعليقاته<br />وبارك الله فيك , بدياك لو شفتو تلعن أبو أبوه الكلب الواطي هدا , لأنو شتمنا مضبوط , وبارك الله فيك ..."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 346
subject = "أخي يوسف البحيصي : هذا تأكيد لتعليق الحقير محمد نواف الحمد الله"
author = "عاشق فلسطين"
text = "السلام عليكم ورحمة الله وبركاته , أخي يوسف البحيصي : هدا أحد تعليقات محمد نواف الحمد الله الحقير الكلب الواطي ..<br />وهي بنفسو بحكي , رجائي الشديد اقرأ تعليقو وشوف شو بحكي ابن الحرام , وبارك الله فيك .......<br />(((وبالنهاية .. وكلمة أخيرة لكل أردني على وجه الكرة الأرضبة .. وووين ما كان .. بقلو وأنا هونه من موقعي ( الإمارات ) .. إرفع راسك لفوق لفوق لفوق وخليك عنيد وراسك يابس مش زي الحجر لأ أقوى من الحجر بكثييييييييييييييير .. وخلي عينك جاويه .. بتقدح شرارة .. قوية .. واللي بطلع فيك وخصوصاً إذا كان فلسطيزي .. مع إنو بسترجيش أو بالأحرى بقدرش أو إنو يحاول يرفع وجهو بوجهك .. وفي حال لو رفع شويه من وجهو الأجرب أخزقلو جوز عيونو .. وسوي براسووو خريطة العالم .. ونييييييييييييك خواته ال66مليون شرموطه وشرموطه .. ولاتنسى تنيك إمو ( لإنها هيه الأساس ) .. وبعد هيك إدعس بنص بطنو دعسة بنت كلب ( نصها موت ).. وشلحو أواعيه .. وافتح طيزو ونيييييييييييييييييييييييييكو لحد ما يغمى عليه ويطفي على الآخر .)))<br />هدا هو تعليقو يا أخي , وبالله لو امسكتوا انزل فيه ضرب ووريه مين هما الفلسطينيين بصحيح , خليه , هو بس شاطر يتفصحن<br />بالكلام , لا إحنا بدنا فعل مش بس كلام , بس ........................ وأنا وراك وراك يا محمد نواف الحمد الله والزمن طوييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييل"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 347
subject = "سجل أنا فلسطيزي"
author = "شاعر البونبون من فلسطيز الخرة"
text = "سجل ودون أنا فلسطيزي<br />بِعْتُ أرضي و شرفي بالـ Easy<br />وكُل واحد منا يقول زيزي<br />ما راح نرجع و نعود حتى لو ناكونا من طيزي<br />بِعْنا شرفنا و عَرْضنا بحبة موزي<br />لأننا كما قال القذافي شعب حقير و غبي و Crazy<br />نحن شعب الحفارين شعب الله المحتار و شعب Lazy<br />شعب كل رجالنا منايك و كل حريمنا شراميط، شعب اكبر Mazy<br />شعب ما بيستاهل يعيش لأنو شعب Hazy<br />نحن شعب خرة عايش على الرقص و الــ Jazzy<br />شعب عميل و سافل و يستاهل يموت ببندقية عوزي<br />العمليات الانتحارية ما تفيد يا عزيزي<br />حتى لو نكحونا على سجاد كاشاني و تبريزي<br />لؤماء و حقراء نحن بالفطريزي<br />الكل يكرهنا من العربي للماليزي<br />و من الافريقي و الاسترالي إلى الانكليزي<br />والمسلم والمسيحي و اليهودي و الهندوزي<br />مذكورين و معروفين بحقدنا حتى بتاريخ المقريزي<br />من طاح حظنا من الحمار عرفات للكلب حسن اللوزي<br />و من الخصوة أحمد ياسين و الحقير الفطيسة عبد العزيز الرنطيزي<br />و من السافل أبو اللطف القدومي الى الخنزير محمود عبوزي<br />و من اللئيم شعث الى الفاسد احمد قرعوزي<br />و من القحبة سها عرفات و الشرموطة حنان عشروزي<br />و من الشاذ أبو هنية و محمد دحلان القرقوزي<br />و من الملعون كنفاني للراقصة ليلى خالد سوزي<br />شعب خرة كله من الحقراء و السفلة يستاهل ينداس بالصرماية القديمة<br />سجل و دون أنا فلسطيزي حد النخاع<br />كلنا جبناء مثل الخراف عندما تقول ماع ماع<br />أرضنا و كرامتـنا و شرفنا كلها في خبر كان باع باع<br />و طيزنا مفتوح لا يفيد معه حتى اكبر الرقاع<br />نساؤنا شراميط يـبعن شرفهن من اجل النحاس اللماع<br />و هن اكبر مصاصات للأيـر و للخصية بلاع<br />شعب خرة و يستاهل يعيش بس في القاع<br />كل فلسطيزي هو حشرة ضارة بلا نفاع<br />سيأتي يوما و نُـنْـحر أنصاف و أرباع<br />شعب من الأنذال نحن و من إير الحمار لم نصل إشباع<br />و دائما متسولون و شعبا فلسطيزيا منحطا و كلهم جياع<br />يا رب اذبحنا واحدا واحدا بيد شارون الحبيب الشجاع<br />شعب سخيف و حماسنا و جهادنا الإسلامي بلا سماع<br />من الفطيسة احمد ياسين و الجيفة الرنتيسي المُـضياع<br />كل فلسطيزي هو خرة و لا يُـستساغ حتى لو خللوه بالنعناع<br />و يجب أن يكون قـتـلكم و نحركم و ذبحكم حلالاً زلالاً و مُـشاع<br />شعب خرة كله من الحقراء و السفلة يستاهل ينداس بالصرماية القديمة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 348
subject = "اضحك مع الفلسطيزي"
author = "الموسوعة الفلسطيزية"
text = "الف مليار بليون مليون زب في كل فلسطيزي أخو قحبة<br />اضحك مع الفلسطيزي<br />فلسطيزي راح عند الحكيم يشكو من مرض فسأله الحكيم عن حالته الجنسية فرد الفلسطيزي متعجباً: شو حكيم ما هو أنت عارف أنا ما عنديش جنسية، تفيدك وثيقة سفر مصرية........................<br />....................ها ها ها ها ها............ ما أغبى الفلسطيزيين............<br />في فلسطيزي بعد زواج 15 سنة فحصوا زوجتو لقوها ما مفتوحة و غشاء البكارة لسة موجود سألوه ليش يا زلمة لسة ما فتحت زوجتك، رد عليهم و بثورية و رافعاً يده بإشارة النصر ان شاء الله راح نفتحها ... شاء من شاء و أبى من أبى و اللي مش عاجبو يجي يفتح بكارة زوجتي ..<br />....................ها ها ها ها ها ............ ما أغبى الفلسطيزيين............<br />عن البخل الفلسطيزي - في فلسطيزي عايش في عمان – الاردن قال لابنو اذا نجحت بالامتحان راح اخليك تشوف سيارة البوظا.<br />....................ها ها ها ها ها ............ ما أبخل الفلسطيزيين............<br />المستحيلات الاربعة : الغول و العنقاء و الخل الوفي و الفلسطيني الشريف و النزيه.<br />....................ها ها ها ها ها ............ ما أغبى الفلسطيزيين............<br />تعريف للفلسطيزي: هو حيوان لكنه بروح حشرة القرادة يحب أن يعيش على دم الآخرين و يريد أن يسمن مثل البغال و من صفاته الحقد (إسألوا الكويتيين عن حقدهم) و الحسد (إسألوا الأردنيين عن حسدهم) و الجبن (إسألوا المصريين عن جبنهم) و الأنانية (إسألوا العراقيين عن أنانيتهم) و اللؤم (إسألوا اللبنانيين عن لؤمهم) و السفالة (إسألوا السوريين عن سفالتهم) و الطمع (إسألوا السعوديون عن طمعهم) و الصفاقة (إسألوا القطريين عن صفاقتهم) و البخل (إسألوا الإماراتيين عن بخلهم) و الغباء (إسألو الليبيين عن غباءهم) و النذالة (إسألو البحرينيين عن نذالتهم) و الفلسطيزي ما عندو مانع أن يحصل على النقود باي طريقة حتى و لو بالقوادة على زوجتو"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 349
subject = "عفوا من الأخ فلسطيني أصيل"
author = "فلسطيني من سكان سورية"
text = "الأخ فلسطيني أصيل ، نص الممثلين اللي بتقول عنهم فلسطينية غير صحيح ، ديما بياعة أمها دمشقية وأبوها نوري من دير الزور ، وزيناتي قدسية أصله شركسي من بلدة (قدسيا) مركز الشركس بدمشق ، ولينا حوارنة هي اسما وصفة حورانية درعاوية ، ولورا أبو أسعد سورية من حمص (منطقة الحمر) ، وباقي من ذكرتهم فلسطينيين ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 350
subject = "الأرادنة الجحاش"
author = "فلسطيني من سكان سورية"
text = "أقول للأرادنة الجحاش اللي نازلين سب وممحونين علينا يبطلوا قلة الحيا والسفالة تبعت اللي خلفوهم لأني لو طلعت الأردن ما بخلي منهم ذارية .... أنا يا دوب بعد ما نشرت تعليقي لقيت هالألفاظ الخره من الأرادنة الزفات المنحطين ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

