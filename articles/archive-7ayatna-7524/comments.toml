[[comments]]
order = 96
subject = "موطني موطني السلام والسناء والبهاء في علا مو طني"
author = "Plestine"
text = "ولكم تؤبرو قلبي ما أحلا تعليئااتكم يالفلسطينية,,,,, والشرشيح المتفوف عليهم((بلغم)) الأردنية وينهم وعرضي وشرفي إنكم ئطعتو ألبي عليكم حتى مش آدرين يردو بكلمة اللي شاطرين في مسبات وحكي وسخ وسفالة عنجد بس أشوف ردود الأردنية بعرف أصلهم أكتر أكتر بعرف ئـديش إنهم مربين وولاد عالم شو المسخرة حتى ما عندكم زوووء بالحكي جد إنو قليل عليكم كلمة سفلة<br />وأنا بدي أحي شكري على كلالامو اللي متل العسل<br />وصافي والفلسطينيــــA ــــــية وعربية مسلمة اللي كاتبة ياحيف على هيك شباب واللي كاتبة إلي الفافين الدلوعين اللي بسمعو كلام ماما وباباوفلسطيني غصب عن الكل ودودو dodo@hotmail وعاشقة فلسطين اللي كاتبة لاحول ولا قوة إلا بالله ولكم تؤبرو قلبي شو بتفهمو عنجد يا هيك الحكي اللي بنفهم وبدخل الراس يا أما بلا على القليلة عندهم زووء بالحكي وبفهمو كل حرف بحكو مو متل نوور الأردن اللي بس عليهم يسبو ويحكو كلام والعياذ بالله منو<br />مع تحيااتي بنت فلسطين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 97
subject = "فلسطين أول غصبن عن الي برضى والي ما برضى"
author = "فلسطينية وبنت ناس"
text = "آل أردنية آل ولكم روحو شوفو أرفكم وزبايلكم بشوارع بتكون والرواايح والعفن روحو إنتو مفكرين حالكم ايشي بتكتبو وإنت خيفين وريالتكم تحتكم المهم يعني كل واحد فيكم بروح على الحمام ما بعرف يرفع بنطلونو بروح بنادي الماما تبعتو ترفعلو اوكي كل شي كوم والكوم التاني انكم لما تتآتلو بفلقاات الجميد والدقدق الي بترسمولي اياه تحت تمككم زي البدو حتى البدو أحسن شوي وبعدين روحو لما توكولو منسف كلو زي الناس ما تطفحو زي (الغنم) كل واحد فيهم لما بدو يجي يوكل منسف بفتحلي ايدو على الزاوية (90)يعني قاائمة وبتبلشو تطفحو وتوكلو وتنقطو وقرف وبلإيدين اطورو شوي بلمعاالء كلو عيب والله يلا أشوف وااحد يرد فيكم يااولا المحترمين وكل الفلسطينية على رااسي من فوووووووووووء اما الاردنية بندعس عليكم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

