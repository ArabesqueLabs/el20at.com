text = "أولا: الأردن و فلسطين أرض واحدة بدليل إن الأردن أسست أول شيء على انها إمارة \"شرق الأردن\" أي شرق نهر الأردن أي أن غرب الأردن هو فلسطين.<br />ثانيا: أشك أن الحيوان اللي كتب أول تعليق ورمز لإسمه ب\"الأردني\" انه صح أردني... المقال بعيد تماما عن أي جدال فلسطيني/أردني.... يعني باختصار هذا جاي يولعها و مو معروف قرعة أبوه من ويييييين وأحلى شئ بكلامه هو كلمة \"التاريخ\" اللي زتا بالنص صحيييييح إن لم تستح فافعل ما شئت...... بلمرة فيك تكتبلنا شوي عن هاذ التاريخ ... ما راح اضغط عليك كتير بس خلال القرن 18.............. حاول ترد.........<br />ثالثا: الله يخليكم الأردن شيء و العائلة الملكية شئ ثاني زي ما فلسطين شئ وأبو مازن وشلته شئ ثاني و هام جر (عمم على باقي الأنظمة العربية).......... بظن المعنى وصل<br />رابعا : يا أخوتي طولوا بالكم شوي مش أي كلب بينبح جنبكم رح تردوا عليه............. نحن مسلمين قبل كل شئ"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 544
subject = "عربي شريف"
author = "سام"
text = "طيب يا شباب فلسطينية واردنية وكل الجنسيات العربية شو اللي عرفكم انو الشب الالي بلش المعركة اردني؟؟؟؟؟؟؟<br />وشو اللي عرفكم ما يكون يهودي يعني انتو بتتوقعوا انو في عربي بيكره الفلسطينية بهالشكل ؟؟؟؟<br />يا عالم زمان كانت الحرب علينا مشان يستولو على خيراتنا وارضنا وبالنهاية كل مخططاتهم فشلت وقرروا اخيرا يحاربونا باسلوب جديد اول شي يعلقونا مع بعضنا وعم نسمع الاخبار كيف بالعراق والسودان وفلسطين وكل بلد عربي الآن بتلاقي فيه تخاصم<br />وحركات مضادة للحكم ؟؟؟وهادا كله من تخطيط اليهود تحديدا ؟؟؟لك تصوروا هلأ مع ايران حاولو يزرعوا ناس لتعمل انقلاب على<br />الحكم لانهم درسوا الوضع منيح وتأكدوا انهم لا يستطيعو ان يحاربوها؟؟؟؟؟؟؟انا بس بدي الفت انتباهكم انهم بيزرعوا شباب ممكن يكونوا صغار ايضا الى ان يكبروا ويحصلو على مراكز اما سياسية او دينية وكلنا عم نسمع فتاوى غريبة ما بتمت للدين بصلة<br />هلأ نص صغير فيه شوية مسبات حرك كياننا ووصلنا لكره وشتم ولو منشوف بعض لنقوص بعضنا ؟؟؟انا براهن انو كل واحد بحاول يعمل شرخ هو يهودي استعماري ؟؟؟هلأ انا مو مهم شو جنسيتي بس قفوا واستفيقوا ايها العرب اللي عم يعلقنا ببعضنا يهود لا يمكن انو يكون عربي شريف مسلم ؟؟؟لك فيه واحد ما بكي وانهز كيانوا من اخر معارك غزة المشرفة فيه واحد شاف لؤي وهو عم يحمد الله رغم اصابته ولا البنت اللطيفة المعجزه وهي عم تضحك وتجامل رغم انو راحت رجليها ؟؟؟ولا الشب اللي راحلو 11ولد واجى عالمشفى وعم يحمد ربه بس فكروا شوي بتلاقوا اللي بيكره الفلسطينية يهودددددددد<br />وبضلو يحاولو يعلقونا ببعض انا اتحدى ان تقول اسمك ايها الاردني المسلم ممكن يصير نزاعات ومشاكل بس الدم ما بصير مي مهما صاريجب ان نعتبر اي شخص يبدا بشتم اي عربي بانه يهودي لذلك اتمنى عليكم بعروبيتكم ان توقفواالموضوع<br />ما عدا الذي بدأ النار !!!!حسابك عند الله لما اشعلته من حقد فهي النميمة ان كنت مسلم مع استبعادي لذلك كليا<br />ولكم جميعا فائق الاحترام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 545
subject = "باعوها البياعين"
author = "اليعربي"
text = "فلتعلموا بان لا احد من امتنا العربية مفضل على شعبنا الفلسطيني الذي ما زال يعاني من خيانات لقضيته ممن من زعماء امتنا العربية منذ الحرب العالمية الاولي ولغاية الان ، ان خلافنا ليس مع اخواننا الاردنيين ولا ابناء شعب مصر وغيرهم من الشعوب العربية المضللة اننا نتعرض منذ بيعت فلسطين على ايدي الخونة من قادة العرب وما زالوا يتأمرون على هذا الشعب المجاهد لا نريد مزايدات على شعبنا الذي ضحى ومازال يضحي وشرد وشتت في اسقاع الارض واناضل وجاهد ورابط وما زال فلنسموا فوق التفاهات والاقاويل الزائفة والنفاق والكذب والتضليل ان شعبنا كرم برباطه وجهاده من رسولنا الكريم صلى الله عليه وسلم وان شعبنا لهو راس حربة وبمساندة اخوته العرب من كافة سعوب امتنا المجيده ممتدة من المحيط الى الخليج وبدعمهم ثبت وصمدز<br />اخوتي العرب فلنبتعد ولنترك المهاترات التي صنعها الاستعمار وقوى الظلم المعادية للاسلام والعروبة الطامعين ببلادنا فلنعتصم بحبل الله ولنسموا فوق توافه الكلام انني كفلسطيني اعتز بانني اردني وعربي ويشرفني حمل اية جنسية عربية الاردن ارض الرباط دعمت وما زالت تدعم شعبيا بكافة طوائفها شعبنا في فلسطين وكافة الشعوب العربيه لهي درع واق وسند لقضية فلسطين، فلنبتعد عن انظمة الحكم التي لا تملك امرها ولنتحد كامة لنعيد فلسطين وامجاد امتنا وديننا رعاكم الله ووحد كلمتكم اخوتي..."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 546
subject = "الى اي اردني بنكر الجميل"
author = "فلسطين اولا"
text = "ولا يااردني ياقواد اي تاريخ اللي بتحكي عنه تاريخكم كله مخزي وخيااانة وانطردتو زي الكلاب من الحجاز وضحكو عليكو بصحرا الواحد مابيعيش فيها غير الضبان والبعير وانتو طبعا يابججم والله يسرلكم انه فلسطين احتلت من ورى خيانتكم وخيانة الدول العربيه حسبي الله عليهم واتهجرو الفلسطينيين الى الاردن وهم بنولكم اياها وشالوك من تحت المعزة وخلوك تكتب عالنت يابقرة ياثور الله يلعنكم شعب ناكر للمعروف خخخخخخخخخخخخخخخخ اتفي عليك <== طبعا هاي بنخامة في نص وجهك هههههههههه<br />سلام يابقر"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

