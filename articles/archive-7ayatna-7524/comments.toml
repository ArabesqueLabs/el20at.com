text = "هلا عنجد هالجماعة الارادنة مدري كيف مجبولين<br />ما بيتحاكو<br />عالحدود و لا في اوسخ منون بالتفتيش و التمييز<br />لك شايفين حالون ..على ايش مابعرف<br />سافرت بالبر مرتين عالسعودية<br />بتمر من الاردن ما بتشوف الا صحرا و رمل ..ماعندون الا عمان<br />والله يخلف على الفلسطينية اللي سووهم بنيادمين<br />فعلى شو شوفة الحال<br />عندي صباط شب لبناني بساوي كل شباب الاردن"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 486
subject = "الأردن أولآ"
author = "سـ عــــــــــــودي حر"
text = "سبحان الله الفلسطينيين هم اللي بنو الأردن ! وبنو السعوديه ! وبنو الإمارات ..<br />انا سعودي وادرس بالاردن من خمس سنوات . والله مارأيت شعب أنبل ولا أكرم من الشعب الأردني.<br />شعب تأمن بجواره على نفسك وعلى مالك وعلى أهلك ,<br />شعب أكبر دليل على كرمه أنه فتح بيوت ومدارسه ومستشفياته ووظائفه للفلسطينيين .<br />ولكــــن ماذا وجد من الفلسطينيين غير الحقد ونكران الجميل كعادتهم .<br />فأين مانظرنا نجد يتبين لنا حقد الفلسطيني وحسده ونكرانه للجميل .<br />والكويت مثال آخر 500 الف فلسطيني عاشوا وتربوا وأكلو من خيرات الكويت وأيام الغزو نهبوهم<br />فوالله ماقتل وسرق ونهب البيوت في الكويت غير الفلسطينيين والعراقيين الغزاه أنفوا عن هذه الحقاره .<br />وعندنـــا بالسعوديه منهم كثير .<br />تعاطفنا معهم ومع قضيتهم وتبرعنا بالملايين من الحكومه والشعب ,<br />وماذا وجدنا منهم .<br />واللـــه لا يأتي ذكر للسعوديه الا ويطلقون السنتهم القذره النتنه عليها وعلى شعبها<br />سبحان الله التاريخ يعيد نفسه .<br />بعد محرقة اليهود من قبل هتلر<br />حقد اليهود على الناس أجمعين .<br />واستدروا عطف شعوب العالم عليهم وعلى قضيتهم ومعاناتهم .<br />واستغلوا هذا الشي لتنفيذ مخططاتهم القذره .<br />وهاهم الفلسطينيون يعيدون التاريخ نفسه .<br />وليلتهم بس يحررون بلدهم ويرجعون لها .<br />لأنه فعلا مافيه بلد عربي أو غير عربي يرغب فيهم ..<br />يا أخي ليش تبني الاردن ؟؟؟<br />وليش تعمر السعوديه وتعلم شعبها ؟؟<br />روح لم شعبك , وعمر أرضك أستردها بعد بيعك لها .<br />ما أنكر ان فيه فلسطيني حر ومناضل بس وينه ؟؟ على الجبهه في فلسطين<br />مو بالاردن او ببلد ثاني .<br />وبعدين تعالوا نتكلم عن أخلاقياتكم ورجولتكم شوي .<br />أقسم بالله العظيم ماعمري شفت فلسطيني كريم !!<br />ولاعمري شفت فلسطيني عنده غيره ومربي بناته صحح<br />كلهم بناطيل لو ويست . وبلوزه للبطن وشررررررررمطه<br />واللي تعرفونه بس .<br />تطاول على الدين وسب الذات الإلاهيه والعياذ بالله .<br />أختصار ( أحقر إنسان على وجه الارض أشرف من الفلسطيني )<br />اتفووووووووووووووووووووووووووووووووووو على كل واطي فلسطيني على وجه الأرض<br />وبالنسبه للقحبه السعوديه اللي بتتزوج فلسطيني .<br />ما أستغرب شرمطتك لسببين الأول انك بقايا حجاج طررررش بحر وقذارة سفن .<br />والسبب الثاني أمك فلسطينيه .<br />تحيــــاتي لكل عربي<br />وخاصه شعب الأردن الكريم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 487
subject = "الرد على اللي كتب عنوان ولا اردن ولا خرى"
author = "اردنية وافتخر"
text = "اولا اللي قتل جلالة الملك عبدالله الاول حفيد رسول الله عليه الصلاة والسلام غصب عنك وعن الراضي والزعلان<br />اللي قتلو واحد خليلي فلسطيني كلب ابن كلب<br />وكمان يللي محسوبين علينا بشر انو اعطوني دليل واحد انو الملك حسين الله يرحمه مو من نسب الرسول عليه الصلاة والسلام<br />وبالمناسبة حلو مشاكلكم اول في فلسطين لما تحكوا انت فتح وانا حماس وتقتلوا بعض عشان هيك صيروا بني آدميين بعدين احكوا عن اسيادكم<br />وبعدين انتوا بعتوا ارضكم وما في داعي انخبي الحقيقة الا اذا انتوا ما بتعرفوا تاريخكم يا بشر والملك عبدالله الاول لما اجا عندو رئيس الاسرائيليين بهداك الوقت وجاب المال معاه طرد الرئيس من مكان المقابلة وقال له ان ياخذ ماله معه لان فلسطين ليست للبيع لكن ماذا نفعل اذا اهل البلد ما بدهم البلد<br />وارجوكم كل واحد ينتبه على كلامو ويصححو وما يطعن في نسب الشرفاء لانهم من نسل الرسول عليه السلام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 488
subject = "رد على عربي من جزييييييييييييييييزه العرب"
author = "هناااااااااااء فلسطينيه وبفتخر"
text = "اولا اشك انت عربي عنجد لانو انت الي ربدون ضمير وولا كرااامك ...هاد بدون ما اقرا كلامك كلووو لانو كلام سخييييف جدا وما الي قيمه وشكلك ماهوور من الفلسطينين كتييير بس الحمد الله كل واحد بيعرف حالو كتيير منيح ومو محتاجه احكي<br />والله لو انك زلمه بس وعندك كلامه اكتب رقمك الي بالامارات وشووف شو رح يصير فيك شاطر بالكلام بس ئابلي وجه ولوجه انت جبااااااااااااااااااااااااااااااااااااااب وحقير ع الكلام الي كتبتو واصلا شكلك بتخااف من الصرصوووره يا واطي تفوووووووووووو عليك<br />بس انا بدي تكتب لرقمك الي ع اساااس انك زلمه وشايف حالك وعندك كرااامه ال الله يستر ما تطلع فاافي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

