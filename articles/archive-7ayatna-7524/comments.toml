[[comments]]
order = 165
subject = "التقرير العلمي الغربي الغريب : أطول خرة في العالم (زهقت من إعادة الكتابة بالله اقروا المقطع زي الناس ) عشان نثبت إنه أخرى ناس في العالم الأردنيين) بسرعة بالله عليكم تقروه"
author = "عاشق فلسطين"
text = "ثبت علماء الأحياء بعد تحليلهم لخرة (ككة) أردنيين أصل , فوجدوا إنه طول الخرة تبعهم متر ونص , عارفين ليه , من كتر ما بياكلوا<br />برسيم وعلف وتاني إشي أثبتوا إنه هده الخرة خرة نادر نوعه في العالم , لأنه الككة معروف طوله يعني بيوصل لنص متر بالكتير, لكن هدول لا متر ونص ويمكن أكتر , ولا وشوف بعد هيك وين الريحة بتكون , يا حبيبي , شفتوا خرة الحصان الله يعز الفلسطينيين (فقط) أديش طوله ؟ الأردنيين ضعفه , ولونه أخضر غامق وفيه عليه شوية براسيم , لا ولو شفته الإسهال تبعهم كيف , فيه إشي اسمه ملح انجليزي عشان يفرم الخرة جوة الطيز وينزل بسرعة , هدول بدون ملح إنجليزي ولا غيره , هدول عندهم دواء حتى مش راضيين الأردنيين يقولوا اسمه عشان فيها خلطة سرية لفرم الخرة جوة الطيز بسرعة : 1غيغا بت في الثانية , وتالت إشي صحيح , اندهش العلماء الأمركيين في عمان لما إجوا على نقابة الأطباء الأردنيين لما إجوا يشرحوا جثة أردني أصل معفن , فوجدوا فعلا إنه جلده متأثر بالبلغم اللي انقذف على كس إمه وأبوه جالس بنيك في إمه زي الجعان , فقالوا هده سبب تخلف الأردنيين , وإنه الجينات اللي فيهم خربانة على الأخير , فسبحان الله العظيم, ولله في خلقه شؤون ,<br />(((((مـــــــــــــــنـــــــــقــــــــــــــول لــلــفــائـــــــــــــــــــــــــــــــــدة))))) وشكرا إلك حبيبتي بنت نابلس والله يحفظك يارب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 166
subject = "إلى الإخوة الأردنيين وإلى الإخوة الفلسطينيين"
author = "سعودي وأفتخر"
text = "السلام عليكم ورحمة الله وبركاته , أنا يا جماعة الخير انذهلت واندهشت لما قرأت الكلام المكتوب في الصفحة هذه كلها , شئ غريب جدا إنه يحدث ويصير بين الفلسطينيين والأردنيين هذا الشي , مع إنكم يعني شعب واحد المفترض تكونوا متحدين وما يكون<br />بينكم هذا الشئ أبدا , على كل أنا حبيت أقول لكل من الإخوة الأردنيين , إنه الأردنيين فعلا هم أهل الشهامة والنخوة بصراحة , لأني أنا سعودي من بدو الرياض ولما رحت على الأردن بقصد السياحة رحت وادي رم عند خيام البدو , فوجدت منهم كرم عظيم جدا بصراحة , وما في بيننا وبينهم أي فرق , حتى يمكن إنه الأردنيين الأصل فيهم نخوة أحسن مننا بصراحة لأنه كل أصل البداوة والعروبة فيهم , وثاني شئ إنه الأردن الشقيق جارة السعودية , فهذا شئ يعزز العلاقات بيننا , وثاني شئ بقول للإخوة الفلسطينيين الأكارم إنه برضوا ما ننسى فضل الفلسطينيين بصراحة في السعودية وما قاموا به من بناء نهضة المملكة وقد جرى<br />ذلك الإعتراف على لسان الملك فهد رحمه الله , بأن الذين بنوا المملكة العربية السعودية هم أكثرهم وأغلبهم فلسطينيين , ولا<br />ننسى فضل الفلسطينيين في التدريس المدرسي والجامعي , فأول من بدأ بتدريس الطلاب بالمملكة أغلبهم فلسطينيين وأردنيين ومصريين وسوريين , فنحنا ما ننسى فضل الأردنيين والفلسطينيين بصفة عامة , لكن أنا أدعوا إلى الوحدة وترك العنصرية<br />لأنه شئ ما له داعي أبدا , وهو اللي يسبب المنازعات وغير كذا مشاكل كثير , وبارك الله فيكم , وأسأل الله أن يعيد اللحمة إلى<br />الشعوب العربية والمسلمة اللهم آمين ..... وتحياتي لكم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 167
subject = "إلى الأخ .. سعودي وافتخر .."
author = "محمد نواف الحمدالله ..."
text = "أخي السعودي .. والله إني بعزك وبحطك على راسي من فوق بس أنتا يعني، وبعيد عنك بتحكي مع حمييييييييييييير ( الفلسطيزيه ) .. يعني همه هيك الله خالقهم ناس حمير جحوش غجر نور بقر حوش بجم بفهموش .. يعني لويش تعب حالك على الفاظي .. سيبك منهم .. هذوله الكلام معهم بنفعش .. بدهم الواحد يدق راسهم مزبوط وينيك أعراظهم وشفهم ويحمل كل بناتهم الشرموطات المنيوكات الداعرات العاهرات البايعات شرفهم لمين مانكان ؟؟ والله دنيا غريبه .. صدقني ياأخي السعودي هاي الدنيا مش مخربها غير هذولة الفلسطيزية اللي همه حثالة ونذالة وحقارة وسخنة المجتمع العربي والعاملي .. لأنهم ناس بالأساس وبالأصل وسخيين وتافهيين لأبعد الحدود .. إتصور يا أخي السعودي . إنو الفلسطيزي بعرفش مين اخوه بمعن إنو اخو لو صرلوا اشي أو ظاقت فيه الدنيا وإشي طبيعي يلجاً لأقرب المقربيين إلو ( اللي هوه أخوه ) ويطلع أخوه ويحكيلي مابقدر أساعدك أو أخدمك .. يعني أتخيل السولافه أنتا .. فمابالك الشعب الفلسطيزي كل هيك !!<br />ع العموم .. ترى أخوي،،، الناس بأفعالها مش بأقوالها .. وكل فلسطيزي ابن داعره عاهره ابن مقطعه بلجيكي اخو بلجيكيه شرموطه .. كتب أي إشي عن الأردن _ بشكل عام _ بقلو ترى المراجل مش من تحت لتحت .. وتسب علي وعلى الاردنيين .. المراجل إنك تيجي بوجهي وتحكي كلامك وساعتها وشرفي لأكون مخلص عليك وماسحك عن الوجود .. ومخليك ملطشة الكل يصير يظرب فيك . وينيك بعرظ أختك وأمك .. وأنا ابن نواف الشرارات وقدها وقدود ..<br />وشكر خاص للشباب الأردنيين على فزعتهم ونشامتهم .. وحنا مايغمظلنا جفن حتى ننهي على هؤلاء المرتزقة الحشرات السفله .. وإذا سألتني ياخوي السعودي شو أمنيتك ؟؟؟ لأقلك نفسي ومناي .. وأمل وأمنيت حياتي .. إني أنهي وأقظي وأخلص على إشي اسمو فلسطين وكلاب فلسطين من خريطة العالم وأمسحهم مسح .. وأقظي عليهم قظاء مبرم .<br />وهاي هيه أمنيتي وبسسسسسسسسسسسسسسسسسسسسسسسسسسسس وكس أمكو أولاً وآخراً يا أولاد الحرااااااااااااااااااااام .. يلي إنولدتو من زبارنا حيث إنها ادخلت بأكساس وطياز خواتكم وأمهاتكم فولدناكم .. حلوه صح<br />هههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه ومشكور للشباب الأردنيين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

