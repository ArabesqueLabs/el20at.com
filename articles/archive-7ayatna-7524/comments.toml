[[comments]]
order = 75
subject = "صحيح كلامك أخي : فلسطيني"
author = "عاشق فلسطين"
text = "فالحقير الملعون الملك حسين الله لا يرحمه قتل مش 30 ألف فلسطيني , قتل 70 ألف فلسطيني بالضفة الغربية الحبيبة , وغير هيك بدعي إنه من آل البيت و كزب والله كزب , هدول أشرار مش أشراف , لأنهم لو فعلا من آل البيت كان طبقوا شرع الله وتاني إشي بدي اذكر كل أردني أصل قحة إنه لولا الله ثم الفلسطينيين ما اتعمرت الأردن , وكيف صارت مخابرات الأردن من أول أقوى أجهزة مخابرات في العالم ليه ؟؟؟ , لأنه كل اللي بعملوا فيه فلسطينيين , وتالت إشي جامعات الأردن الخرة من أقوى الجامعات في العالم , لأنه كل اللي بعملوا فيه فلسطينيين فعشان هيك بذكر الأردنيين إنهم لاينكروا فضل الفلسطينيين في الأردن , لأنهم هما اللي عمروا الأردن وخلوا سمعتها في العلالي وحسبنا الله ونعم الوكيل , وبعدين في شعار اسمه الأردن أولا , فلسطين أولا وستبقى أولا , وبعدين فش أردن , الأردن كلها فلسطين يعني إنتوا احتليتوا بلدنا ولكن الله ما بسيب الظالم في حاله وحسبنا الله ونعم الوكيل , وأنا فلسطيني تاج راس كل أردني قحة , وفي شغلة كمان يا أخ : الأردني : إنتا بتقول صفات الفلسطينيين لا تتوافر في الكافر نفسه , طيب إنتوا شو صفاتكوا , قطع الطريق , والبدونة , وطول عمركوا رح تضلوا متخلفين .............................."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 76
subject = "أنا بأيد كلام الأخت : فلسطينية"
author = "ابن فلسطين"
text = "صحيح الأردن أخرى وأندل وأسفل وأحط شعب بالعالم , ما فيش أردن يا ناس , والله أصلها فلسطين لكن الأشرار اللي مسمين حالهم أشراف وهما اوطى من هيك احتلوا بلدنا , وحسين اللي بقولوا عنه إنه فيه الشهامة والشجاعة وغير هيك , وين الشجاعة ؟ الشجاعة إنه يروح يقتل أكتر من 60 ألف فلسطيني ؟ ليه ؟ عشانهم ضعاف ؟ الله يلعنه البعيد الخسيس .......<br />بس على فكرة بزكر الخرة الأردنيين الأصل إنه الشعب الفلسطيني شعب جبار , هلأ الحكومة الأردنية الحقيرة مش راضية تطلع نسبة الأردنيين من أصل فلسطيني ؟ عارفين ليه ؟ خايفين الفلسطينيين يتوصلوا لمقاليد الحكم ولمناصب عليا , بقولوا نسبة الأردنيين من أصل فلسطيني هي 60% , لكن الحقيقة إنه نسبة الأردنيين من أصل فلسطيني هم 92% , شوف كيف الخوف , لأنه الشعب الفلسطيني وين ما راحوا يا أردنيين يا حيوانات عمروا العالم بكامله , على كل ما بدي أكتر كلام , والأدرن أولا , هه , الأدرن آخرا وواطيا , وفلسطين أولا وأبدا , وأنا فلسطيني وبعتز وبفتخر بأصلي , وكل الأردنيين الخرة الكلاب اللي عاملين حالهم إنهم أهل النخوة والشهامة كلهم هما والصرمة واحد ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 77
subject = "ما تمدحش حالك أكتر عشان لا أفضحكوا أكتر يا حثالة"
author = "إلى خالد الهزايمـــــــــــــــــــــــــــــــــــة"
text = "بسم الله الرحمن الرحيم , يقول الله تعالى : {الأعراب أشد كفرا ونفاقا} هده الأية لحالها كافية ودالة على حقارة أهل البادية أين<br />ما كانوا وخاصة الأردن أولا باستثناء فلسطين الحبيبة الغالية , فأهل بادية فلسطين من أشجع وأشهم البدوان , لكن أنا بقلك<br />تمدحش حالك أكتر , لأنه إنتوا شعب حقير وواطي وسافل وملعون ومنحط ومتخلف ومهان ووقح لآبعد الحدود , على كل والله أنا<br />ما بحب كتر الكلام , والملك تبعكوا اللي بتفتخروا فيه , وبتقولوا إنه من آل البيت , هده أكبر كذبة على وش الأرض , لأنه والله يا أخيلو إنه فعلا من آل البيت , كان طبق شرع الله الحنيف في أرضه , وتانيا أنا بدي أرد على السفلة التانيين اللي بقولوا إنه الأردن وقفت وقفة أخوية مع فلسطين في حربها مع إسرائيل , (بدي أموت الحقوا علي بده ينفجر بطني من الضحك) إمتى الأردن وقفت مع فلسطين يا كلاب يا حثالة يا زبالة يا خرة , تذكر أيلول الأسود لما قام حسين الله لا يرحمه بقتل 30 أو 70 ألف فلسطيني , هده هي وقفة الأردن الأخوية مع فلسطين , مش هيك ولا لا , تاريخكم أسود , وطول عمركوا رح تضلوا خرة , وديل الكلب أعوج , وشوف , طباخ السم لازم يدوقه , يعني زي ما سوى حسين بأهل الضفة الحبيبة رح يسير بالأردن إن شاء الله , يعني اللي سواه حسين الكلب كأنه تف تفة ولحسها ورح يلحسها ابنه عبد الله , قال الأردن أولا , وأنا زعلان من الفلسطينيين اللي في الأردن راحوا وأخدوا الجنسيات الأردنية , كان سابوا الأردن وخلوها خرة بدل ما عمروها , لكن الله يهديهم , وأنا بقول إنه أكتر الأردنيين من أصل فلسطيني أكترهم والله ما بعترفوا بالهويات الأردنية , الواحد بعترف بأصله مش بالجواز , وأنا فلسطيني وبفتخر والله وبعتز كل الإعتزاز إني من هده البلد الطاهر اللي ذكرها الله في القرآن الكريم , وبكفيني فخر إنه بلدي هي بلد<br />الجهاد والنضال والمقاومة , والله يخلي الفلسطينيين ويخلي فلسطين وإن شاء الله رح يكون تحريرها قريبا , وتاني إشي اللي<br />بقول إنه الفلسطينيات مش محترمات , فبدي أقول إنه أشرف وأعفف وأطهر إمرأة على وجه الأرض هي المرأة الفلسطينية ,<br />ياخي بكفيك إنه دم الفلسطينيات خفيف , وحلوات ولذيذات , فعشان هيك اللي بسبهن بكون ناقص عقل"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 78
subject = "بكفي يا فلسطينية"
author = "ولــ الأردن ــد"
text = "بكفي هظا اللي بصير يا فلسطينيين , المرجلة إنه ما يكون بالإنترنت متخبي وسلاحه وراء ظهره , أقول المرجلة تعال سب والعن قدامي عشان تثبت إنك رجال , خايف إنه المخابرات تنيكك تحت الأرض , فعشان كذا أقول المرجلة يا فلسطينيين تعالوا سبوا<br />قدامي , وبعدين إذا كانت الأردن ما هي عاجباكم اطلعوا منها ما أحد غاصبكم تعيشوا فيها , سيبوا البلد لنا , البلد بلدنا الله يلعنكم يا كلاب يا وسخين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

