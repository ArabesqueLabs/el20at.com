[[comments]]
order = 128
subject = "بنت فلســــPـــــطين"
author = "4 ever"
text = "يا ربي على المسخرة جد إنو الأردنية سخيفين وتافهين والله بضحكو بكلامهم مش عارفين يردو كلو كلامهم سب وسفالة سدق حمودي شكري لما حكا إحنا الفرء بينا وبينكم إنو نحنا منحكي وإنتو بتسبو ,,,,وبعدين الأردنية ولعو وشرفي بتلالاقيهم آعدين بدهم يعيطو هاد إزا ما عيطو وإجت الماما مسحتلهم بربيرهم,,بعدين يا إبن الشلف يا نواف بتحكي عن الكبسة والملوخية ولك لسا بضلهم أحسن من حليب البقر والماعز والخرووف والغنم اللي بتطفحو((إنشاء الله محل ما يسري يهري)) ولك بكفي إنو أكتر بلد فيها بيوت دعااارة وسفالة ومنيكة هي الأردن وبكفي إنها أكبر سلة مهملات بالعالم متل ما حكت الأخت عربية مسلمة وبكفي إنها أكتر بلد فيها سرئة وعمليات إغتصااب,,وغير هيك عندكم الشب الأردني هواية عندو يئعد يفتح بالبنات متل كإنو عم بفتح علبة بيبسي,,,وكس أحسن بنت أردنية على أكبر زب أردني معفن ,,وبالختاام حابة أشكر كل فلسطيني حط ردو وعلى القليلة الفلسطينية بحطو ردود تنقرأ صح بغلطو وبسبو بس هما ((معصوومين عن الغلط عاادي)) والأردنية المئهوورين الغيوورين عنجد الغيرة تقتل صاحبها هع هع هع وهلأ حابة أوجه تحية خاااصة<br />للكاتبة ((طز بأكبر ككة وهي الأردن)) و ((فلسطينية وبنت ناس)) و ((Plestine)) و((عاشقة فلسطين)) و ((دودو dodo@hotmail)) و ((فلسطيــــAـــنية)) واللي كاتبة(( للفافين الدلوعين اللي بسمعو كلام ماما وبابا)) و ((عربية مسلمة (ياحيف على هيك شباب) )) مع تحياتي بنت فلســــPــــين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

