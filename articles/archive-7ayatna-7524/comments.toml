subject = "والله عيب"
author = "الوليد الفلسطيني"
text = "السلام عليكم.. صار لي بالضبط يا اخوان ساعه وربع وانا اقرأ ردود الاخوه من كل مكان. صدقا صدمت بكل هذه الردود التي تفتقر الي اي نوع من انواع الادب من كلتا الطرفين. ولكم حتى الاخ السوداني الي دخل يقول تعليق بسيط ما سلم من لسانتكم.... اتقوا الله .. وبجد عيب.. عيب .. عيب<br />وللاسف لم اجد رد مقتنع للموضوع الاساسي.. غير السب والشتم واللعن.. اذا كانت هذه طريقه الحوار في هذا الموقع .. وفي عقليه الشباب العربي.. فعلا الدنيا السلام .. .."
archived = "2009-04-05"
