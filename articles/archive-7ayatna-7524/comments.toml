subject = "فلسطيني أصيل"
author = "عاجل : أسماء جميع العاملين والمذيعين في قناتي الجزيرة والعربية وأغلبهم من الجنسيات الفلسطينية"
text = "بسم الله الرحمن الرحيم<br />طلال ابو غزالة ومؤسسته تمتلك العلامة التجارية للقناة من اصل فلسطيني،<br />وضاح خنفر المدير العام للجزيرة اردني من اصل فلسطيني ،<br />احمد الشيخ رئيس التحرير في القناة اردني من اصل فلسطيني ،<br />المذيع توفيق طة اردني من اصل فلسطيني ،<br />المذيع جمال ريان اردني من اصل فلسطيني ،<br />أحمد بشتو/ مصري ،<br />أحمد منصور/ مصري ،<br />المذيع محمد خير البوريني اردني من اصل فلسطيني ،<br />سامي حداد اردني بريطاني من اصل فلسطيني،<br />فيروز زياني/ جزائرية ،<br />الزبير نايل/ سوداني ،<br />ايمان بنورة والتي تظهر تحت اسم ايمان عياد حاليا امريكية من اصل فلسطيني ،<br />خالد الحروب بريطاني- فلسطيني ،<br />فيصل القاسم/ سوري ـ بريطاني ،<br />عبد الصمد ناصر/ مغربي،<br />خديجة بن قنة /جزائرية ،<br />احمد بركات المراسل في باكستان فلسطيني الجنسية،<br />المعز بولحية/ تونسي،<br />عزت شحرور في الصين فلسطيني الجنسية،<br />علي الظفيري/ سعودي من اصل يمني ،<br />عثمان البتيري في اندونيسيا اردني من اصل فلسطيني،<br />جلنار موسى/ لبنانية،<br />ليلي الشايب /تونسية،<br />محمد كريشان/ تونسي ،<br />ماجد عبد الهادي صحفي مراسل في القناة فلسطيني الجنسية ،<br />يوسف الشريف في تركيا اردني من اصل فلسطيني،<br />جمانة نمور/ لبنانية ،<br />وجد وقفي في واشنطن اردنية من اصل فلسطيني،<br />لينا زهر الدين/ لبنانية ،<br />حيدر عبد الحق/ عراقي،<br />صهيب الملكاوي اردني فلسطيني،<br />سهير الذهبي/ سورية،<br />محمد البنعلي/ قطري،<br />فرح البرقاوي فلسطينية،<br />لونة الشبل/ سورية،<br />ربي خليل اردنية/ فلسطينية ،<br />رشا عارف اردنية/ فلسطينية،<br />منقذ العلي/ سوري،<br />ناجي سليمان/ فلسطيني ـ أردني ،<br />سمير سمرين وزكارنة الاتنين فلسطينيين والتلاتة الآخرانيين دول بتوع اشارات لخرس.<br />اما قناة العربية فجنسياتهم كالتالي :-<br />المدير العام للقناة عبد الرحمن الراشد سعودي الجنسية ،<br />رئيس التحرير التنفيذي في القناة نبيل الخطيب فلسطيني الجنسية،<br />مذيعو النشرات :<br />1 ـ ابراهيم القاسم ـ سوري<br />2 ـ مي الشربيني ـ مصرية<br />3 ـ ميسون عزام ـ فلسطينية/بريطانية<br />4 ـ مهند الخطيب ـ اردني/فلسطيني<br />5 ـ منتهى الرمحي ـ أردنية/فلسطينية<br />6 ـ سهير ابراهيم ـ عراقية<br />7 ـ نجوى كاظم ـ لبنانية<br />8 ـ سهير مرتضى ـ لبنانية<br />9 ـ سومار جابر ـ لبنانية<br />10 ـ طالب كنعان ـ لبناني<br />11 ـ يوسف الهوتي ـ عماني<br />12 ـ زينة اليازجي ـ سورية<br />13 ـ طاهر بركة ـ لبناني من أصل فلسطيني<br />14 ـ سميرة ازغيدر ـ مغربية.<br />* النشرات الرياضية :<br />1 ـ ليليان تنوري ـ لبنانية<br />2 ـ لطفي الزعبي ـ أردني<br />3 ـ زياد عبيدات ـ أردني<br />4 ـ يوسف الحاج ـ جزائري.<br />* النشرات الاقتصادية<br />1 ـ دينا سالم ـ مصر<br />2 ـ حمدان جرجاوي ـ سوري من أصل فلسطيني<br />3 ـ مايا حجيج ـ لبنانية<br />4 ـ اسامة محمد ـ السودان<br />* مقدمو البرامج<br />1 ـ جيزيل خوري ـ لبنانية<br />2 ـ جيزيل حبيب ـ لبناني<br />3 ـ راوية العلمي ـ فلسطينية<br />4ـ احمد حسني ـ مصر<br />5 ـ هشام ملحم ـ لبناني يحمل الجنسية الأمريكية<br />6 ـ تركي الدخيل ـ سعودي<br />7 ـ احمد الزين ـ لبناني<br />8 ـ ايلي نكوزي ـ لبناني<br />9 ـ حسن معوض ـ فلسطيني"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 108
subject = "عاجل : أسماء الفنانين العرب من أصل فلسطيني (الرجاء قراءة المقطع كاملا)"
author = "فلسطيني أصيل"
text = "تنبيه قبل قراءة الرسالة : معنى : فلسطيني سوري أي : سوري من أصل فلسطيني<br />أولا- الفنانين المصريين :-<br />-الممثل الراحل حسن عابدين من اصل فلسطيني مقدسي<br />- عمر الشريف من اصل فلسطيني مسيحي واسمة الاصلي ميشيل شلهوب<br />- سليم سحاب قائد الاروكسترا في الاوبرا المصرية مصري لبناني من اصل فلسطيني يافاوي<br />-الراقصة نجوي فؤاد من اصل فلسطيني يافاوي<br />-الاخوين بدر وابراهيم لاما اول من اسس شركة للانتاج السينمائي في الشرق سنة 1926 من اصل فلسطيني وهم تلحميا الاصل وكان والدهم مهاجرا الي تشيلي وقدما منها الي مصر<br />- المخرج طارق العريان نعم من اصل فلسطيني ويحمل الجنسية الامريكية ووالدة المنتج الراحل رياض العريان<br />-المخرج الشاب عثمان ابو لبن من اصل فلسطيني<br />-عبدالسلام النابلسي لبناني من اصول فلسطينية (جدة كان مفتي نابلس)<br />-المنتج والممثل الراحل بدر الدين جمجوم من اصل فلسطيني خليلي<br />-المنتج حسين القلا من اصل فلسطيني<br />- المنتجة مي مسحال من اصل فلسطيني<br />- شيرين سيف النصر من اصل تركي وام فلسطينية الاصل من آل هاشم النابلسيون<br />- هالة صدقي من اب فلسطيني الاصل مسيحي وام مصرية قبطية<br />- عمرو دياب من ام مصرية واب من اصل فلسطيني يافاوى وهاجر والده سنة 1948 الي مدينة بورسعيد المصرية وحصل علي الجنسية المصرية وعمل في قناة السويس<br />- زهرة العلا من اصل سوري هاجرت الي مصر في بداية حياتها<br />-الممثل غسان مطر من اصل فلسطيني<br />-نادية لطفي من اب فلسطيني الاصل وام يونانية هاجر والدها منذ زمن الي مصر وهي مسيحية واسمها الحقيقي بولا<br />- صفية العمري من اصول فلسطينية من اب فلسطيني الاصل وام مصرية<br />-الممثلة الشابة فرح من اصل فلسطيني<br />-المغني لؤي من اصل فلسطيني<br />-المغنية رنين من اصل فلسطيني<br />-المغني خالد سليم من اصل فلسطيني<br />-المغنية سماح بسام من اردنية من اصل فلسطيني<br />ثانيا -الفنانين السوريين :-<br />-ديما بياعة فلسطينية سورية<br />- نادين سلامة فلسطينية سورية<br />-نسرين طافش فلسطينية سورية<br />-زيناتي قدسية فلسطيني سوري<br />-شكران مرتجي فلسطينية سورية<br />- لينا حوارنة فلسطينية سورية<br />-فرح بسيسو اردنية من اصل فلسطيني<br />- روعة السعدي واخواتها ووالداهم الكاتب هاني السعدي من اصل فلسطيني سوري<br />-اناهيد فياض فلسطينية سورية<br />-المخرج باسل الخطيب فلسطيني سوري<br />-عبد المنعم عمايري فسطيني سوري<br />-الكاتبتان ريم وامل حنا وشقيقهم الممثل رامي حنا من اصل فلسطيني<br />-مهندس الديكور ناصر الجليلي فلسطيني سوري<br />- حسن عويتي فلسطيني سوري<br />-صبا مبارك اردنية من اصل فلسطيني<br />-الاخوين وائل ونضال نجم اردنيان من اصل فلسطيني<br />-عبد الرحمن ابو القاسم فلسطيني سوري<br />- الملحن طارق الناصر اردني من اصل فلسطيني<br />-لورا ابو اسعد فلسطينية سورية<br />ثالثا- الفنانين الاردنيين :-<br />-سوبر ستار العرب ديانا كرزون من اصل فلسطيني<br />-رانيا الكردي من اصل فلسطيني<br />-ميس حمدان من اصل فلسطيني<br />-نادرة عمران من اصل فلسطيني<br />-عبير عيسي من اصل فلسطيني<br />-لارا الصفدي من اصل فلسطيني<br />-جوليت عواد من اصل فلسطيني<br />-المغني طوني قطان من اصل فلسطيني<br />رابعا- الفنانين اللبنانيين :-<br />- ماجدة الرمي من ام لبنانية واب فلسطيني الاصل من حيفا<br />- فيروز اسمها الاصلي نهاد حداد وهي فلسطينية الاصل من الناصرة بفلسطين<br />-المغني الشاب ايوان من اصل فلسطيني<br />-المغنية ملك الناصر من اصل فلسطيني<br />رابعا-الفنانين الخليجيين:-<br />-اسمهان توفيق من اصل فلسطيني<br />- السعودي حسن ابو حسنة من اصل فلسطيني<br />- باسمة حمادة : أردنية من اصل فلسطيني بجواز برازيلي<br />-عبد الناصر درويش من اصل فلسطيني<br />-المغني الاماراتي سعود ابو سلطان من اصل فلسطيني"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

