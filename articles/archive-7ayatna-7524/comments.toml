subject = "Let us see where Jordan and Jordanians Came From"
author = "Free Pali"
text = "رجل تركي ينحدر من جدة يهودية تزوجها \\\" محسن \\\" وانجب منها ابنه \\\" جدعون \\\" الذي يعرف بين العرب باسم \\\" عون \\\" ومنه انحدرت الأسرة الهاشمية التي حكمت في العراق والأردن والحجاز ...واليهودي كما هو معروف ينسب إلى أمه ... فابن اليهودية حتى لو كان أبوه عربيا أو مسلما يعتبر وفقا للديانة اليهودية يهوديا ... هذا الرجل اسمه \\\" حسين بن علي \\\" ويلقب بالشريف لانه تولى الإشراف على الحجاز بتوصية من ضباط حزب الاتحاد والترقي التركي وأكثرهم من اليهود .<br />هذا الرجل هو الذي تقدمه كتب التاريخ في المدارس الأردنية على انه بطل \\\" الثورة العربية الكبرى \\\" ... فمن هو هذا الرجل ... وما حكاية هذه الثورة ؟<br />أنهيت تعليمي الثانوي في مدرسة أردنية تتبع قسم الثقافة العسكرية في الأردن اسمها \\\" الثورة العربية الكبرى \\\" وكنت الأول على جميع مدارس الثقافة العسكرية في المملكة في امتحانات التوجيهية \\\" الثانوية العامة \\\" ... و\\\" الثورة العربية الكبرى \\\" يقصد بها الحركة التي قام بها شريف مكة حسين بن علي ضد دولة الخلافة الإسلامية بالتواطؤ مع الإنجليز وبقدر ما كانت أجهزة الإعلام في الأردن تتغنى بهذه المناسبة وبطلها بقدر ما كان تجاهل سائر الدول العربية لهذه المناسبة يدهشني بل وتغص كتب التاريخ الصادرة في الدول العربية بالكثير من الاتهامات لحسين بن علي والتي تبدأ بتخوين الرجل وأولاده ... وتنتهي بتحميل ذريته مسئولية ضياع فلسطين .<br />خلال حرب الخليج أطلق الملك حسين لحيته ولقب نفسه بالشريف حسين تيمنا بجد أبيه وقيل يومها أن صدام حسين وعد الملك حسين بإخراج السعودية من الحجاز واعادة تسليمها إلى الملك حسين على اعتبار أن الملك عبد العزيز آل سعود هو الذي طرد الهاشميين من الحجاز وقضى على طموح جدهم الحسين بن علي الذي وعدته به إنجلترا وهو أن تقوم بتعيينه ملكا على العرب إن هو ساعدها في القضاء على الخلافة الإسلامية .<br />كان مصدرنا لما يسمى بالثورة العربية الكبرى في الأردن مجموعة كتب وكراسات وضعها رجل ارزقي اسمه سليمان الموسى ... ومن يقرأ كتب هذا الرجل عن الحسين بن علي يخالجه شك بأن المذكور كان نبيا أو مبعوثا من السماء وأن صفات الفروسية والنبالة التي يتسم بها تخرج عن طاقة البشر وتقترب من صفات الالهة فعلا .<br />لكن خروجي من الأردن ... واطلاعي على مراجع تاريخية عربية وأجنبية محترمة عن الثورة العربية الكبرى وبطلها الحسين بن علي ... وتصفحي لوثائق المخابرات البريطانية السرية التي افرج عنها والتي تتعلق بالمذكور أصابتني بالدهشة ... والحزن ... لان حجم التزوير في التاريخ الذي يدرس للطلبة في المدارس والجامعات والمعاهد الأردنية يعتبر بحق فضيحة إنسانية وبشرية يدفع ثمنها المواطن الأردني كل يوم .<br />فمن هو الشريف حسين بن علي وما حكايته وحكاية \\\" ثورته العربية الكبرى \\\" التي فلقونا بها في الأردن ؟ ولماذا تصوره كتب التاريخ الصادرة عن القصر الأردني بأنه قديس ومناضل وشريف وعروبي ... بينما نقرأ عنه في الكتب العربية والأجنبية انه كان تركيا مشبوه النسب من جد يهودي اسمه عون ونسجونجيا وعميلا للأتراك والإنجليز وقاتلا ... بل ويحملوه مسئولية القضاء على الخلافة الإسلامية ويحملوا أولاده من بعده بخاصة عبدالله مسئولية ضياع فلسطين وتقاسمها مع اليهود ؟<br />كان \\\" عون \\\" جد الأسرة الهاشمية الحاكمة في الأردن والعراق قد ولد لابيه \\\" محسن \\\" من أم يهودية ... وابناء اليهوديات يعتبروا وفقا للديانة اليهودية من اليهود لذا نشأ \\\" عون \\\" أو \\\" يهوديا وكان يعرف بين اليهود باسم \\\" جدعون \\\" ... ويقال الشيء نفسه عن الملك حسين الذي رعته وربته أمه \\\" زين \\\" التي كانت تصطحبه إلى معابد اليهود في تركيا وبريطانيا ... والملكة \\\" زين \\\" هي التي اختارت لابنها زوجته الإنجليزية اليهودية \\\" انطوانيت \\\" ابنة العقيد \\\" توني غاردنر \\\" التي عرفت فيماا بعد باسم الأميرة منى والتي أنجبت للملك حسين أولاده عبدالله – الملك الحالي – وفيصل وعائشة وزين .<br />ولد حسين بن علي بن محمد بن عبد المعين بن عون في اسطمبول عام 1853 ميلادية وكان أبوه وجده آنذاك يقيمان تحت الإقامة الجبرية بقرار من السلطان عبد الحميد الذي اعتقل جده \\\" عون \\\" وكان أميرا على الحجاز بعد أن ثبت انه كان يقوم بسرقة قوافل الحج والاعتداء على النساء وفرض الإتاوات على أهل الحجاز وتحويل مكة المكرمة إلى وكر للدعارة ... وقد وجه السلطان عبد الحميد جيشا جرارا إلى الحجاز قام بمطاردة عون وعصابته وتم إلقاء القبض على عون وتسفيره إلى اسطمبول وظل حسين بن علي تحت الإقامة الجبرية في تركيا لمدة 16 سنة ولم يخرج منها إلا بعد الانقلاب العسكري الذي قادته مجموعة من العسكر في تركيا أكثرهم من اليهود عرفت باسم \\\" حزب الاتحاد والترقي \\\" .<br />قام السلطان عبد الحميد بتعيين الشريف عبدالاله بن محمد أميرا لمكة وكان الرجل معروفا بتقواه وورعه ولكن هذا ما لبث أن توفي بسبب تقدمه في السن فلما شغر المنصب قام العسكر بتعيين حسين بن علي أميرا على مكة رغم انف السلطان عبد الحميد فسافر الحسين مع أولاده الثلاثة فيصل وعبدالله وعلي عن طريق البحر إلى جدة ووصلها عام 1908 وكان في استقباله عدد من العسكر من أعضاء حزب الاتحاد والترقي إلى جانب والي الحجاز المشير كاظم باشا .<br />كان السلطان عبد الحميد الذي رضخ لضغوطات العسكر قد قسم السلطة في الحجاز إلى قسمين ... سلطة دينية رمزية روحية وهذه سلمها لحسين بن علي ... بينما سلم السلطة الأمنية والعسكرية لوالي الحجاز وهو المشير كاظم باشا ... وكان السلطان يهدف من ذلك إلى محاصرة حسين بن علي وأولاده ومنعه من العودة إلى سيرة جده \\\" عون \\\" في اغتصاب حقوق الناس وسرقتهم وابتزازهم والإغارة على قوافل الحجيج وسبي النساء .<br />كانت سيرة حسين بن علي الأخلاقية السيئة على كل لسان فقد كان الرجل يقيم علاقة آثمة مع \\\" أسماء \\\" أخت زوجته ولما اكتشفت زوجته \\\" عبدية \\\" هذه العلاقة ماتت من القهر وعمرها لا يزيد عن 27 عاما بعد أن أنجبت له أولاده الثلاثة عبدالله الذي اصبح ملكا على الأردن وفيصل الذي اصبح ملكا على العراق وعلي الذي اصبح ملكا على الحجاز .... وقبل مرور أربعين يوما على وفاة زوجته أراد حسين بن علي ان يحول علاقته غير الشرعية بأسماء إلى علاقة شرعية وذلك بالزواج منها إلا انه جوبه برفض الشريف علي بن عبدالله \\\" أخوها \\\" الموافقة على هذا الزواج بخاصة وان حسين بن علي كان يتخذ من إحدى الشركسيات واسمها \\\" مديحة \\\" عشيقة له انجب منها فيما بعد ابنته \\\" صالحة \\\" التي ماتت في الأردن عام 1994 وزعم حسين بن علي بعد ذلك أن مديحة كانت جارية عنده وان له الحق في معاشرتها لأنها مما ملكت يمينه .<br />بعد ذلك دخلت إلى قصره نورية اسمها \\\" عديلة \\\" عاشرها أيضا معاشرة الأزواج وانجب منها أولاده زيد وفاطمة وسرة ... أما زيد فقد عمل سفيرا للعراق في برلين وهو زوج الأميرة التركية فخر النساء التي تولت مناصب هامة في الأردن رغم أنها لم تكن تتحدث العربية وقد سرقها زيد من زوجها وهو أديب تركي معروف وانجبت لزيد ابنه رعد وزير البلاط الأردني الذي يطالب هذه الأيام له ولابنه فراس وحفيده مرعد بعرش العراق .<br />عاد حسين بن علي في مكة إلى سيرة جده \\\" عون \\\" أو \\\" جدعون \\\" من قطع الطرق والإغارة على قوافل الحجيج ... وكان حسين بن علي يهدف من هذه الأعمال إلى إحراج والي الحجاز المسئول عن الأمن المشير كاظم باشا واقناع السلطان أن الأمن في الحجاز لن ينصلح حاله إلا إذا جمع حسين بن علي بين المنصبين ... الديني والعسكري لكن المشير كاظم الذي ألقى القبض على بعض قطاع الطرق وقام بتسفيرهم إلى السلطان استطاع أن يثبت للسلطان أن حسين بن علي وأولاده هم الذين يديرون عمليات الإغارة والقتل والسرقة التي تتعرض لها قوافل الحجيج .<br />كانت القوات العسكرية في الحجاز تتبع الوالي المشير كاظم باشا ولم يكن لحسين بن علي سيطرة إلا على مفرزة حراسة تتبعه وتقبض مرتباتها من الوالي ... لكن حسين بن علي نجح في إنشاء ميليشيا أو مافيا من البدو كان يقوم بتقاسم غنائم السرقة وقطع الطرق معها ... وقد وسعت مافيا حسين بن علي من غزواتها التي لم تعد تقتصر على قوافل الحجيج وانما امتدت لتشمل قبائل عربية تعيش قرب مكة والمدينة حيث هاجمت هذه العصابات وبإشراف وقيادة عبدالله وفيصل مضارب عشائر بني الحارث قرب الطائف ... ثم اعتدى على عشيرة مطير فقتل رجالها وسبى نسائها وصادر ماشيتها وحرق خيمها فلجأت فلول هذه القبيلة وتلك إلى مضارب أمير نجد عبد العزيز آل سعود طالبة النجدة .<br />كان لامير نجد نفوذ كبير بين القبائل وكان يحظى باحترام كبير لانه كان ضد الغرباء مهما كانت جنساتهم وله الفضل في حماية الحجاز من الغزوات الأجنبية ... كما كان لامير نجد تحفظاته على الوجود التركي في الحجاز ممثلا بضباط الاتحاد والترقي المشتبه انهم من اليهود وممثلهم حسين بن علي ... لذا بدأ الطرفان يحشدان قواتهما لحسم الصراع .<br />بدأ حسين بن علي يستميل العشائر المحيطة بنجد من خلال الرشوة فانضمت إليه قبيلة عتبة ... بينما اقنع ضباط الاتحاد والترقي السلطان عبد الحميد بتحريك قوات تركية نظامية لاحتلال نجد ... والتقى الجيشان على مشارف قبيلة الدواسر حيث دارت معركة غير متكافئة وقع على أثرها سعد شقيق عبد العزيز آل سعود أسيرا في يد الأتراك .<br />وخلال توغل حسن بن علي في أراضى نجد اصطدم بمحمد علي الادريسي أمير عسير الذي أعلن العصيان على الدولة العثمانية ... واجتاحت القوات العثمانية وقوات البادية وميليشيا حسين بن علي أراضى عسير وارتكبوا فيها مذابح جماعية حيث استباحوا مدينة ابها فقتلوا كل الرجال فيها وسبوا النساء والأطفال ودفنوا المسلحين أحياء في آبار المدينة ... وقد وفر له أخوه \\\" ناصر \\\" الذي كان آنذاك يقيم في اسطمبول بصفته عضو مجلس الأعيان وكان مقربا من كبار ضباط الاتحاد والترقي الغطاء السياسي لدى السلطان ... وكلف حسين بن علي رسميا بالقضاء على الأمراء العرب في المنطق وبسط النفوذ التركي على الجزيرة العربية كلها وكان هذا يقتضي القضاء على إمارة اليمن التي يتزعمها الإمام يحي حميد الدين ... وامارة عسير التي يتزعمها السيد الادريسي ... وامارة نجد بزعامة الأمير عبد العزيز ال سعود وامارة شمر بزعامة الأمير سعود بن الرشيد .<br />هذه الإغارات والاعتداءات التي قامت بها القوات التركية بإشراف حسين بن علي على القبائل العربية والتي انتهت بقتل الرجال واغتصاب النساء وسبيهم واسر الأطفال حولت قصور حسين بن علي واولاده إلى معتقلات كبيرة للنساء و \\\" الاغوات \\\" ... والاغوات هم الأسرى الذين يتم خصيهم وتشغيلهم في قصور الحكام ... ووفقا لما ذكرته الأميرة بديعة ابنة الملك علي ابن الشريف حسين بن علي في مذكراتها التي نشرتها مؤخرا في لندن فان قصور جده حسين بن عليا واعمامها كانت تغص بالاغوات \\\" الخصيان \\\" وكانت مهمتهم رعاية النساء !!<br />عمالة حسين بن علي واولاده للأتراك وبالتحديد للضباط اليهود في حزب الاتحاد والترقي تمخضت عن مذابح كبيرة ارتكبها الشريف واولاده في الحجاز وهي المذابح التي ولدت عداء كبيرا للشريف واولاده في أوساط الحجازيين وانتهت بتوحد الحجازيين وراء أميرهم عبد العزيز آل سعود الذي تمكن من طرد الشريف واولاده من الحجاز وتوحيد القبائل تحت إمرته واعلان قيام الدولة السعودية .<br />عندما اندلعت الحرب العالمية الأولى انضم الأتراك ومعهم حسين بن علي واولاده لألمانيا ... ووجه حسين بن علي ابنه البكر علي على رأس قوة هدفها دخول فلسطين للانضمام إلى القوات التركية فيها التي تخطط لمهاجمة الإنجليز في مصر ... وفتح حسين بن علي خلال هذه الفترة خطا سريا مع الإنجليز وبدأ يلعب على الحبلين ... فهو ظاهريا مع الأتراك ممثلا بفرقة يقودها ابنه البكر ... وهو عمليا مع الإنجليز بناء على اتفاق سري أجراه حسين بن علي مع ممثل بريطانيا في مصر السير هنري مكماهون ... وتمخضت هذه الاتصالات السرية على تخصيص رشاوى نقدية لحسين بن علي كان يتسلمها من الإنجليز ابنه الأصغر زيد ووعد من الإنجليز بتعيين الشريف حسين ملكا على كل العرب إن هو غدر بتركيا وساعد في إسقاط دولة الخلافة .<br />هذه الاتفاقات أو الاتصالات السرية مع الإنجليز هي التي تمخضت عنها فيما بعد الحدود المصطنعة للدول العربية وطارت بموجبها ولايات اضنة واسكندرون التي اعترف حسين بن علي بأنها ولايات تركية وليست سورية ... وكان الشريف الغبي يعتقد أن بريطانيا ستفي بوعودها في الوقت الذي كانت فيه وزارة المستعمرات البريطانية تنجر خوازيق لحسين بن علي ... وللعرب كافة بالاتفاق مع فرنسا .<br />خلال مفاوضات واتصالات الشريف حسين مع الإنجليز نفذ ابنه فيصل والحاكم التركي لبلاد الشام جمال باشا مجزرة في أوساط الوطنيين العرب حين نصب لهم في دمشق وبيروت المشانق ... وكان حسين بن علي يهدف من خلال هذه المجازر القضاء على القيادات العربية والوطنية التي يمكن أن تعترض على طموحاته وطموحات واطماع أولاده ... فتم شنق الزعماء عبد الكريم خليل وصالح حيدر ومحمد المحمصاني وسليم عبد الهادي وعبد الحميد الزهراوي وشفيق مؤيد العظم وشكري العسلي وعبد الغني العريسي واحمد طبارة والعقيد سليم الجزائري والعقيد امين لطفي الحافظ ورفيق رزق سلوم وعارف الشهابي والدكتور علي النشاشيبي وغيرهم من الزعماء العرب .<br />الطريف أن عمالة الشريف حسين للإنجليز فرخت ثلاثة جيوش من البدو والمرتزقة يقودها ضباط إنجليز ... والجيوش الثلاثة تحولت فيما بعد إلى قوات غزو للأردن وسوريا والعراق ليس لمحاربة الإنجليز أو الأتراك أو الفرنسيين وانما لمحاربة الحكومات العربية المحلية والقيادات الوطنية في هذه البلاد ... فدخل عبدالله مدينة معان على رأس ما عرف باسم الجيش الشرقي واسس هناك بالتعاون مع الإنجليز إمارة شرق الأردن وارتكب مجزرة بحق قبيلة العدوان حين طلب من الإنجليز قصف مضارب القبيلة من الجو ردا على تهديدات زعيمها الشيخ ماجد العدوان بطرد عبدالله من الأردن .... ودخل فيصل على رأس قواته إلى العراق ليقيم مملكة فيها بزعامته بينما أعلن ابنه البكر علي نفسه ملكا على الحجاز .<br />والأطرف من هذا أن عبد العزيز بن سعود الذي احتل الحجاز وطرد حسين بن علي منها ووضع حدا للنفوذ الإنجليزي في المنطقة كان يتحسب لهجوم مضاد قد يشنه حسين بن علي من شرق الأردن بعد أن لجأ إلى هناك حيث يقيم ابنه عبدالله ... لكن عبد العزيز كان اكثر دهشة من حسين بن علي نفسه لان الابن \\\" عبدالله \\\" رفض استقبال والده \\\" ملك العرب \\\" في الأردن \\\" خوفا من منافسته له في حكم الإمارة فقام بطرده إلى قبرص حيث مات فيها مقهورا من جحود أولاده ... ومن غدر الإنجليز به رغم الخدمات الجليلة التي قدمها لهم ورغم مساعدته لهم في إسقاط دولة الخلافة الإسلامية .<br />هذا ملخص تاريخي سريع لما يسمى بالثورة العربية الكبرى ورئيسها \\\" الشريف حسين بن علي \\\" ... ولقب \\\" الشريف \\\" لا علاقة له بالشرف وانما هو لقب كان يطلق على الشخص الذي يتولى إمارة الحجاز ... تماما مثل لقب مشير وباشا وبيك ... وقد رأينا كيف أن ممارسات هذا الرجل واولاده الأخلاقية والدينية عدا عن ممارساتهم في قصورهم التي تغص بالنساء والخصيان لا علاقة لها بالشرف ولا الشرفاء ... وهي بعيدة كل البعد عن الدين الإسلامي ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 416
subject = "انا فلسطيني قح يا حمااااااااااار يا بهيم"
author = "أحمد الطراونة"
text = "يا حبيبي أنا فلسطيني قح من قضا الخليل بالضفة الغربية , جاي بدك تعلمني مين أنا , قال الطراونة ماشاء الله صاروا أردنيين أقحاح ونتا يا الهزايمة مش عارف حالك إنو كمان عشيرتك أصلها من فلسطين تحديدا بالضفة , والعشاير الفلسطينية اللي هاجرت الأردن هي كالتالي عشان أثبتلك بأنو لا يوجد أردن بالأساس : الحياصات والدبابسة ويعودون باصلهم الى قرية \\\" يطة\\\" والنسور والحمامرة نسبة الى ال الحموري العائلة الوجيهة في الخليل, والفواعير والقطيشات العمايرة والخليفات والرمامنة , بس للأسف الشديد طلعت جاهل ومحدود التفكير أبا عن جد يا خالد , دير بالك على حالك وما تطولش لسانك علي فاهم ولا لا ياخرااااااا<br />ما تتكلمش بكلام إنتا مش قدو مفهوم ..... وعراسي كل فلسطيني"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 417
subject = "رد على مزور التاريخ"
author = "فلسطيني اصيل"
text = "اولا ردا على الاردني<br />ان الاردن كانت با\\\\دية من بوادي الشام وكلها جهل ولا مفخره والفلسطينين هم اول من قام في بناء المملكه لانها كانت امارة<br />ولا فخر وبعترف الاردنيين الاصليين بفضل الفلسطينيه<br />وكلنا نعلم من قام في بيع الضفه الغربية الى اليهود ومن قام في تسليمها<br />وان من قام في بيع فلسطين لليهود معروفين على مستوى الشعوب هم لبنانيين من ال مرقص باعةا يافا وحيقا والساحل الفلسطيني<br />وعلى مستوى الحكام<br />كانت الدول العربيه في ذلك الوقت امارات وليست ممالك ودول وفي ثمن فلسطين قامت ثلاث ممالك اولا اللملكه العربية العودية والمملكه الاردنيه الهاشميه والمملكه في العراق وهذا هو ثمن فلسطين يا شاطر<br />زهذا لتاريخ وليس للمناكفات<br />وهذا ايضا من ناحية سياسيه اما من ناحية شرعية<br />نقول كما فال رسولنا الكريم لا فرق لعربيا على اعجميا الا بتقوى<br />وان فلسطين واارض راباط وجهاد الي بيوم الدين وان شعبها مرابط مجاهد وهو ساكن بها فقط<br />ولا اريد ان اطيل عليك ايها ااردني اقراء التاريخ الحقيقي ةليس التاريخ المزور الذي يمدح الحاكم وامملك ويغضب الله سبحانه وتعالى"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 418
subject = "مقتــطفــات من بستان الحيـــاة"
author = "فلسطينية وبكل فخر وعزة"
text = "1- الفلسطينينين عايشين بالأردن متنعمين !! مين حكى هالحكي ؟!<br />روح شوف أجهزة مخابراتكم شو بتعمل في الفلسطينين من إهانة و تنكيل !!<br />ولا شكلك نسيت أحداث أيلول الأسود لما الملك حسين قتل 30 ألف فلسطيني !!<br />لا الأردن ولا أي بلد عربي بيعامل الفلسطينين باحترام .. حسبي الله على كل أنظمة العرب !<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />2-عزيزي, ذكرت في رسالتك ان الفلسطينيين هم الذيين باعوا اراضيهم بانفسهم. ان لم تعطيني دليلا تاريخيا واحدا .. اسمح لي ان انعتك بالكاذب. ولاصحح معلوماتك عن بيع الاراضي الفلسطينييه , نعم تمت هناك بعض المبيعات للاراضي ولكن ان عرف السبب بطل العجب. صرخت بان الاردن اولا. يا عزيزي ان الاردن هو الخائن الاكبر للشعب الفلسطيني. وقد قامت حكومتكم مشكروه بمنع المواد الزراعيه عن الفلاحيين في الضفه ليبيعوا اراضيهم لاسرائيل بالتنسيق طبعا مع اسرائيل ( صديق الاردن الاول ). ثانيا, ارجوا من سيادتك ان تتكرم وتستفسر عن ايلول الاسود.. ان كان هناك رجل واحد في الاردن يخاف الله .( من الملك الى اصغر عبد ) فليقل حقيقه ايلول الاسود. وليس كلام الكتب ومذكرات وزراء الفساد الاردني.<br />ايلول الاسود مذبحه حقيره قامت بها الحكومه الاردنيه بحق الشعب الفلسطيني بادعاء انهم ارادوا ان يفتعلوا انقلاب في الاردن. وهذا غير صحيح. وان كان كذلك. فما دخل الاطفال والنساء. ( طبعا الجيش الاردني قام بالعمليه بغطاء جوي من سلاح الطيران الاسرائيلي) ..<br />ثالثا, قلت ان الاردن تعامل الفلسطيني مثل الاردني, وانا اقول لك ان الاردن نعم بالفعل كرمت كثيرا من الفلسطينيين ولكن ليس بالمجان. استفسر وسوف تجد الحقيقه.<br />واخيرا . نعت الفلسطينيين باقبح الالفاظ واشنع الصفات. وسوف اقول لك كلمه واحده فقط. لماذا كرم الله فلسطين على كل العالم؟<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />3- اردنية ارذل شعب بالعالم بديش اكتر كلام بس خليها عالله يا اردنية انت عفكرة شعب حقير لا يطاق ,<br />لعلمكم انو ازلم شعب بالعالم الشعب الفلسطيني و لكم لو عايشين عنا بالبلد بتعرفو شو بحكي و بعدين مين حكا فش مقاومة انزلو عغزة شوفوا المقاومة اليهود بسترجوش يدخلو عليها لغزة بس قصف بالطيارات اما تدخل قوة برية بطلعو كلهم مقتلين بلاش غزة يا عالم خدوا نابلس كل يوم المقاومة الله يعزها و ينصرها بتقتل يهود خدوا اي منطقة بفلسطين بتحداكم ان ما كل يوم بموت فيها يهودي ........<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />4- ولا مين غيرنا احنا الفلسطينيه اللي عمر الاردن يا اردني ياللي بتحكي اول شي وشوف عددكم وشوف عددنا وشوف انجازاتكم وشوف انجازاتنا وبعدين احنا اصلا لو نطلع من هالبلد كان بتخرب يا كبير بس والله ما زبايل غيركم<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />5-فلسطينية وبفتخر واللي مش عاجبو ينتحر ويكتب على قبرو واحد منئهر حاول يتحدا فلسطينية وما إدر..<br />أولا يا الأردنية بالله عليكم تحكولي إنتو شو أصلكم يا قليلين الأصل ياللي ما عندكم أصل أساسا الأردن ما كنلها خارطة إجت من العدم من ولا إيشي بعدين حبايبي إحكولي العااااهل الأردني من وين أخد ولك لف ودار ما لاقى أحسن من الفلسطينيات وهي الملكة رانيا طبعا وعلى القليلة فش شب فلسطيني بركض ورا أردنية آل شو بنات الأردن المدقدقات ونسوان الأردن لما يتئاتلو بتئاتلو بقطع الجميد متل النور والشب الأردني أول ما يصير عمرو 18 برمح ورا فلسطينية متل القروود ليش الجواب بسيط لإنو أبشع وأشنع بنات بالعالم هما بنات الأردن وغير هيك لإنو بنات فلسطين بنات إلهم أصل وعزة وشهامة وكراامة .......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />6-حقير الملعون الملك حسين الله لا يرحمه قتل مش 30 ألف فلسطيني , قتل 70 ألف فلسطيني بالضفة الغربية الحبيبة , وغير هيك بدعي إنه من آل البيت و كزب والله كزب , هدول أشرار مش أشراف , لأنهم لو فعلا من آل البيت كان طبقوا شرع الله وتاني إشي بدي اذكر كل أردني أصل قحة إنه لولا الله ثم الفلسطينيين ما اتعمرت الأردن , وكيف صارت مخابرات الأردن من أول أقوى أجهزة مخابرات في العالم ليه ؟؟؟ , لأنه كل اللي بعملوا فيه فلسطينيين , وتالت إشي جامعات الأردن الخرة من أقوى الجامعات في العالم , لأنه كل اللي بعملوا فيه فلسطينيين فعشان هيك بذكر الأردنيين إنهم لاينكروا فضل الفلسطينيين في الأردن , لأنهم هما اللي عمروا الأردن وخلوا سمعتها في العلالي ...........<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />7- صحيح الأردن أخرى وأندل وأسفل وأحط شعب بالعالم , ما فيش أردن يا ناس , والله أصلها فلسطين لكن الأشرار اللي مسمين حالهم أشراف وهما اوطى من هيك احتلوا بلدنا , وحسين اللي بقولوا عنه إنه فيه الشهامة والشجاعة وغير هيك , وين الشجاعة ؟ الشجاعة إنه يروح يقتل أكتر من 60 ألف فلسطيني ؟ ليه ؟ عشانهم ضعاف ؟ الله يلعنه البعيد الخسيس .......<br />>;>;>;بس على فكرة بزكر الخرة الأردنيين الأصل إنه الشعب الفلسطيني شعب جبار , هلأ الحكومة الأردنية الحقيرة مش راضية تطلع نسبة الأردنيين من أصل فلسطيني ؟ عارفين ليه ؟ خايفين الفلسطينيين يتوصلوا لمقاليد الحكم ولمناصب عليا , بقولوا نسبة الأردنيين من أصل فلسطيني هي 60% , لكن الحقيقة إنه نسبة الأردنيين من أصل فلسطيني هم 92% , شوف كيف الخوف , لأنه الشعب الفلسطيني وين ما راحوا يا أردنيين يا حيوانات عمروا العالم بكاملو ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />8- بسم الله الرحمن الرحيم , يقول الله تعالى : {الأعراب أشد كفرا ونفاقا} هده الأية لحالها كافية ودالة على حقارة أهل البادية أين ما كانوا وخاصة الأردن أولا باستثناء فلسطين الحبيبة الغالية , فأهل بادية فلسطين من أشجع وأشهم البدوان , لكن أنا بقلك<br />تمدحش حالك أكتر , لأنه إنتوا شعب حقير وواطي وسافل وملعون ومنحط ومتخلف ومهان ووقح لآبعد الحدود ....<br />>;>;>; تاريخكم أسود , وطول عمركوا رح تضلوا خرة , وديل الكلب أعوج , وشوف , طباخ السم لازم يدوقه , يعني زي ما سوى حسين بأهل الضفة الحبيبة رح يسير بالأردن إن شاء الله , يعني اللي سواه حسين الكلب كأنه تف تفة ولحسها ورح يلحسها ابنو عبد الله ....<br />>;>;>; تاني إشي اللي بقول إنه الفلسطينيات مش محترمات , فبدي أقول إنه أشرف وأعفف وأطهر إمرأة على وجه الأرض هي المرأة الفلسطينية ياخي بكفيك إنه دم الفلسطينيات خفيف , وحلوات ولذيذات , فعشان هيك اللي بسبهن بكون ناقص عقل<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />9- لكم يا ولاد الداشرة انتو ما بتعرفو شو هم الفلسطينيين ولكم روحو زبايل منحطين مش ملاقييين غيرنا تحكو عنا و لكم انتو تتمنو تكونو فلسطينيين لانها اصلا شرف و بعدين يا خالد يا اخرى انسان يا ككة انت اكبر زيايل الاردن و لك الاردن اكبر سلة مهملات بالعالم مش عاجبك الفلسطينيين ولك هادي بتلمك و تلم اهلك و اهل اهل الي جابوك يا عرص يا ابن المنيوكة يا ابن الككة و بعدين يا ككة ما تحكي كلمة بعدين احنا مو خايفيين من المخابرات اذا كانت كل مخابرات الاردن فلسطينية كيف رح نخاف منكم يا زبايل المجتمع يا حثالة الزبايل تبعت المجتمع ......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />10- بدكم يالاردنيه 100 سنة لما تتحضروا وتصيروا بربع الي احنا فيه تاني شي انتو بقر من الاخر يعني .....بكفي انو احنا في عنا ثالث الحرمين واولى القبلتين الي هو الاقصى ادامة الله فوق روسنا وروس الكل ... بعدين احنا 3 مليون فلسطيني بالاردن و1 مليون عراقي و1 مصري و400 الف اردني معفن مش كلهم برضوا ..... بكفي انو احنا زلام بيدينا بنرمي الحجر بدون خوف لا بيدنا سلاح ولا كلاشنكوف وبنحارب اليهود مو متلكم اذا الواحد حمل موس بفكر حالوا صار زلمة والله اعلم شو هو ......<br />>;>;>;بعدين يا زلام الاردنيه روحوا سبو في المخيمات يمكن يمكن او ليش اكيييييييد 100% ما راح تمشوا ع رجليكم ....بــــاي يا بقر وع راسي كل فلسطيني صامد....لكل شخص وطن يعيش فيه الا نحن الفلسطينيه لنا وطن يعيش فينا .......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />11- يا نور يا ولاد الشوارع انتو بتعرفو شو يعني فلسطين ؟؟ يا كلاب يا نور يا اردنييين لولا فلسطين انتو ما كنتو بالوجود يا ناكرين لفضل فلسطين عليكم يا ولاد الزبايل ولكم من الغيرة من الفلسطينيين بتحكو هيك و الله كل واحد منكم يا اردنيين مستعد يبوس رجل كل واحد فلسطيني عشان بس يفوت على فلسطين و مستعيد تبوسي الأيادي عشان يطلعو بوجهكم فلسطين يا ناكرين الفضل عليكم يا نور يا غشاشين يا ............... و الله لو اضلي احكي عن نورنتكم ما بخلص لانكم انور بلد بالعالم العربي كلو ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />12- يا أردنيين يا كلاب , عارفين لليوم الملك عبد الله تبعكم حايط عينه على فلسطين ونفسه يحتلها , لكن إن شاء الله بتنبظ عينه البعيد وتاني إشي , إنه كل اللي عم بصير بفلسطين وخاصة غزة كله تحت رعاية أردنية حقيرة , لأنه هو بكره غزة وفلسطين كلها , لكن الشعب الفلسطيني شعب جبار وقاهر ......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />13- ههههههههههههههههههه اما انو العكس حبيبي شوف رح اسئلك كم سؤال ؟<br />متى تأسسة الاردن؟<br />من وين جبتو العلم ؟<br />شو اصل نص المنتخب الاردني ؟<br />كم فلسطيني بالاردن ؟ و كم ا ردني ؟<br />>;>;>;يا حرام له له ئطعتو ئلبي والله جد انا حزنان عليكو<br />بس مين الكلب الي كان يحكي عن فلسطين حابب يتهزء شوي ؟<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />14- اهداء خاص لكل الاردن<br />ولكم يا غجر يا نور يا مشرشحين يا نوريين يا مشرتحين مش شايفين شي شكلكم<br />انتو بتعرفوو شو يعني بلد اصلا ووطن يا تيوس فكرووو شوي بتلائو انو الزبالة همي غزاة الوطن صار عدد الزبايل اكتر من عدد الاردنيين و الحشرات الل فيها يا قذارة يا بيئةة آل وطن<br />>;>;>; و ازا كلامي غلط روحو افتحو موسوعة غينيس للأرقام القياسية صفحة 273 ملاحظة ( حتى رقم الصفحة مخردع ههههه) مكتوب عن اكبر تجمع زبايل بالعالم موجود بالاردن و هو البلد الوحيد الحائز ع هاد اللقب حتى مصطلحاتكم غبية زيكم آل طقع روحو اطقعو حالكم احسن روحو بيعو علكة<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />15- أولا يا أخ الأردني بدي أقلك أول إشي : كل خرة , تانيا : بتقول إنو الأردن بلد العزة والكرامة والشرف والنخوة , لكن بدي أزكرك إنو أصل الأردن هي بلد البجم والبقر والنور والغجر والتشرد والتخلف والبدونة ,وتالت إشي : شو هي بطولاتكوا وتضحياتكوا ؟ وينها , عارف شو هي بطولتكوا ؟ هي مدبحة حسين (بديش أسبو عشانه ميت) بالضفة الغربية الحبيبة , هده هي بطولاتكوا , ويا حيوان يا واطي إنتا بتقول إنه الفلسطينيين باعوا أرضهم بإيدهم , الفلسطينيين باعوا أرضيهم بإيدهم ,؟ يا كلب الفلسطينيين وين ما راحوا عمروا العالم , شوف كيف صارت الأردن أحسن دولة في العالم , ليه , لأنه كل اللي ماسكها فلسطينيين , مش أردنيين بدو متخلفين زبالة حثالة مشردين .....<br />>;>;>; وبعدين ما في دولة في الوجود اسمها الأردن , فالأردن كلها هي صحراء فلسطين , والتاريخ<br />الإسلامي يثبت ذلك , فعشان هيك انطم واخرس يا عديم الأصل , واللي ما له أصل هما النور , فالحقيقة إنكوا نور أنور من النور<br />اللي عندكوا , على القليلة النور اللي عندكوا فيهم ناس تحضروا والله , مش زيكم , إلا تتبدونوا, الله يعينكوا على مخكم المتيس<br />مع التحيات : بنــ فلسطين ــت ................<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />16- أولا أقود وأشرمط وأمحن وأنيك وأوسخ وأقحب وأكسس وأعرص وأفتح بنات هما الأردنيات الأصل , وهدا إشي معروف , روح شوفهم في وادي رم وفي البتراء شو بيعملو الشراميط القحبات الملاعين بنات الحرام<br />>;>;>; كن الحمد لله إحنا الفلسطينيات في الأردن نسبة 1% مش محترم و 99% محترمات وعفيفات لأنه عنا<br />عادات وتقاليد وأصول شريفة فلسطينية , مش زيكو<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />17- لعـــــــــــــــــــــــــــــــــــنة الله على الاردن خسف يخسفكم يا ولاد الحرام ولك يا اردني يا حقير انتا اكبر مرة بالدنيا جحشة ولك تفو عليك يا تفافة يا زبئة يا خنزير انتا عميل مدعوس ع راسك ولك بتنكر لما الفلسطينية دعسوا ع راسك و شرشحوك<br />>;>;>; يا خنزير اختك مهرية ولك اختك خضرت من كتر المنيحة عفنت صار لونها اخضر تفو ع اكبر واحد فيكم يا متفوف عليك<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />18- خخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخخ الاردنيين عبارة عن ( معلش هتفلسف شوي اسمحولي يعني ) المهم عبارة عن مجموعة من الخرا مخرية متخرية بخرا مخري بخرا ( افهموها عراحتكم )<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />19- شوف عيبكم أول بعدين عيبوا على التانيين , مش زينا إحنا الفلسطينيات , ولك إحنا والله أحلا منكوا بكتير , عشان هيك الأردني الأصل لما بشوف وحدة فلسطينية ماشية بشوارع عمان بتأوم زبره فورا زي الجعانين وعينه بتبيض بياض بكحلها<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />20- يا خرة يا حيوان إنتا بتقول إنه الفلسطينيات فاتحين أكساس درجة الزاوية تبعتها مليون , على القليلة يا بن الحرام كس الفلسطينيات أنظف وأطهر من كس الأردنيات الأصل اللي طول شعر العانة عندهم 5 متر وشكله زي أشجار الغابة ......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />21- صحيح أختي بنت نابلس إنه الأردنين الأصل عشان ما عندهمش حمامات ولا زبايل الله يكرمك يحطوا فيه شوية الخرة تبعهم , بروحوا بحطوه جنب المخيمات عشان يلصقوها في الفلسطينيين ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />22- هل تعلم أن الأردن أجرب بلد بالعالم!!<br />هل تعلم أن الأردن أكتر بلد فيها قمل وسيبان وأن القمل وسيبان مدحوش بين الزباب والكساس!!!!!!<br />هل تعلم أن الأردنية لما بدهم يسقوو الزريعة ويتحموو ويغسلو السيارة الزلمة فيهم بمد زبو خمسة متر عشان يحمم ولادو ويغسل سيارتو ويسقي الزريعة (((((عشان يوفي ماااي))))) وإنو الشامبو هو الزبد ((الحيوان المنوي)) بدير نصو على شعر عيلتو كل هاد توفير!!!<br />شو رأيكم بالمعلوومات رهيبة صح<br />ولسا راح أجبلكم فضاايح أكتر من هيك بس إنتو أصبرو علي -_-<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />23- هيييييييييييه جرادنة يا زبايل المجتمع<br />يا خروات<br />يا زفتات<br />يا طيزات<br />يا خريات<br />يا شخات<br />يا فسوات<br />يا ظرتات<br />يا معرصين<br />يا نور<br />يا احقر ناس<br />يا حاقدين<br />يا ككة<br />يا شراميط<br />خخخخخخخخخخخ<br />يا اغغغغغغغغه<br />يا شخخخخخخخخخة<br />يا منيوكيين ( على ما اعتقد الجمع صح )<br />خخخخخخخخخ<br />تسلمو حبايبي الفلسطينييييييييييييييين<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />24- للعنة عليكي يا اردن مسخ يمسخك ............هههههههههههههههههههههه.............. ولكم يا ارادنة يا jordan يا جرادين قبل ما تيجو تتفلسو تعالو ضبو خواتكم ولكم خواتكم عفنو خضرو صار لونهم اخضر من المنيكة بستحوش اعوذ بالله منهم شيلوهم و انتا يا اردني ولك كم مرة بدي احكيلك انووووو دير بالك ع اهل بيتك بكفيهم شرمطة لونك زلمة كان ما خليتهم يشرمطو<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />25- ولكم انا بسافر الاردن الملعونة و بروح ع فلسطين يا كلاب و يا ريت في طريق تاني اقدر انط منو و ما ادخل ع الاردن ع السريع ع فلسطين الــــــــــمهم : لما نزلت من المطار حتى ولادين الكلب اللي مش شايفين اشي تبعون المطار حمالين الشنت الكلاب شفتهم بنص عيني بعاكسو بالبنات همي رايحين يشتغلو ولا يعاكمسو يلعن ابوهم بكندرة دليل على النورنة تاني اشي لما اجيت مرة بالسيارة على الاردن و طبعا النمرة تبعتها نمرة دولة من الخليج اقسم بربي الهمج قعدوا يركدو ورا السيارة زي اللي مش شايفين اشي والله انو منظر مخزي فضيحة عشنو نمرة السيارة لدولة برا يا همج تحكوش بلاش افضحكم اجيت كتير و شفت كتير<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />26- يا حرام يا اردنيه على الاقل فلسطين من شمالها لجنوبها حلوه و شبابها و بناتها<br />عمركو شفتو شب اردني حلو يا زلمه لو كان حلو بتكون امو فلسطينيه او بنت اردنيه حلوه حبيبي الحلاوه كلها والموضه طالعه من فلسطين يا زلمه ابشع شباب بفلسطين بكونو احلى من الاردنيه وبكفي نحن الي مفيعين الدنيا و لما تشوف واحد فايع اسالو من وين بحكيلك فلسطيني<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />27- وبعدين أنا أشوف إنه الفلسطينيين أصلا داعسين على رقاب الأردنيين لأنهم هم الغالبية العظمى بمدينة عمان , وفي الأردن بشكل عام , وبعدين يا أردنيين بذكر إنه أغلب المدرسين في الجامعات السعودية وخاصة مدينة جدة أغلبهم فلسطينيين وبرضوا في المدارس , إذا هما في السعودية ما شاء الله رفعوا مستوى التعليم , فكيف بالأردن الحين أحسن دولة عربية في التعليم الجامعي , ليييييييييش ؟ لأنه كل اللي فيه فلسطينيين , على فكرة , أنا ما أقلك إنه ما في فلسطينيين سيئييين , لكن والله أكثرهم محترمين وعندهم عادات وتقاليد جميلة جدا , والله يحرر الشعب الفلسطيني الأسير الذي عانى من أضرار الحرب , وأسأل الله تعالى أن يوحد صفوفهم ......<br />>;>;>; على كل أنا والله ما أحب اسب وأشتم مثلكم , والكلام اللي كاتبينه دليل كبير على تفاهتكم وسخافتكم وتخلفكم وهمجيتكم بكل صراحة<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />28- بإختصار فلسطيــــــــــــــــــــــــــــــــــــــــــــــــــــن اولا واخيـــرا غصب عن الكل ؟؟؟ طبعا مشيئة الاهية مو بكيفى ..<br />لماذا ؟؟ لانها مولد سيدنا المسيح وارض الانبياء ومسرى حبيبنا محمد صلى الله عليه وسلم .... صلوا على النبى ولاتبخلوا<br />لانها ارض المحشر والمنشر ... شو يعنى ؟؟؟ يعنى ياعزيزى وعزيزتى هى الارض الى كلنا راح ننحشر فيها يوم الحساب يعنى ما فى غير فلسطين باقى للابد وهاد كلام الله ولا اريد مزايدة ياجاهليييين امور متل هااى ففلسطين ستحشرون بها جميعا شئتم ام ابيتم ... اما الان من قرائتى لردوكم وجدت انكم ضعفاء الشخصية وجاهلون ولاتعرفون اصلكم وفصلكم واخشى ان تكونوا لاااصل لكم بذاتكم ..... فحقارتكم فى ردرودكم والمزايدة على شعب فلسطين تثبت انكم انذال العرب بعاهلكم عبد الله وحسين الاسبق المزعوم كل منهم ولا اعتقد انه يعيش هانئ فى حياته الاخرى لانه قاتل الابرياء وحليف العملاء .....<br />>;>;>; لازم تعرفوا انوا احنا هدفنا الاول العدو وحلفائوا مين ماكانوا ((وشوفوا التعيس عبد الله تبعكم حليف الشيطان))>;>;اتمنى انوا يموت وادهس على راسوا هالحقير ...<br />الفلسطينين اهل الشرف واهل الطيبة واهل الجهاد والاستشهاد وهم احب الناس الى الله<br />كما انهم الصابرين والصامدين رغم الاحتلال والكره لهم من اسرائيل وامثالكم الحاقدين<br />والحمد لله احنا راسنا مرفوع غصب عن كل العالم .. لانا ابناء ياسر عرفات .. رمز الثورة العربية مو رمز خيانة متل بعض القيادات ... والفلسطينين مشاريع شهادة الى يوم الدين وفلسطين ارض البقاء الى يوم الدين ومافى اردن ياحج اردنى ... ههههههههه ... فاهم عليا اذن فلسطين ارض المحشر والمنشر والارض بتكون اتحولت لرماد مع كل العالم ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />29- أنا والله ما حبيت الفلسطينيين وخاصة طبعا الفلسطينيات إلا لأنهم محترمين وشرفاء وفزاعين وعفيفين , وبعدين الحمد لله أغلب الفلسطينيين عنا فيهم ناس أغنياء غنى فاحش , واللي يعجبني كمان في الفلسطينيين إنهم ياخذوا حقهم بالقوة , وما يخافوا ولا ينخوا مثل بعض الناس (الله يستر عليهم مثل الأردنيين) .......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />30- ولا يا اخ محمد نوف الحمد الله أنا ما أسمح لك انك تغلط على حبايب قلبي الفلسطينيين والفلسطينييات لانهم فعلا اشرف منكم يا حثالة المجتمع والعرب .....<br />>;>;>; لكن اقول يا محمد نواف اني ما اسمح لك أبدا انك تغلط على الفلسطينيين لانك بكذا تغلط علي وعرضهم من عرضي وشرفهم من شرفي , والله اني احمد ربي اني عايشة ومتربية بين الفلسطينيين المحافظين اللي يقدروا النعمة ويحسوا بالمسؤولية وناس فعلا متربية وفاهمة ولذيذين , وكلهم حلوين مو زيكم يا الأردنيين لما رحت على وادي رم انفجع أشوفلي وحدة اردنية بدوية متخلفة شكلها زي السلقة ومنخارها طويل مع إني ما اتريق على خلقة ربي سبحانه , لكن هذي الحقيقة اللي بغيت اوضحها , على كل والله ما احب كثر الكلام , لأنكم يا الأردنيين فعلا سخيفين وهمج وغجر وبجم وبقر تماما<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />31- روحوا على الصويفية ولا حديقة الملك حسين شوفو أولادكوا يا اردنية كيف بتعكسوا بالفلسطينيات الشريفات العفيفات , والله ولا واحد منهم بأدر يستجري يعكس على وحدة فلسطينية لأنو عارف شو رح يكون مصيرو ......<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />32- روحوا على الصويفية ولا حديقة الملك حسين شوفو أولادكوا يا اردنية كيف بتعكسوا بالفلسطينيات الشريفات العفيفات , والله ولا واحد منهم بأدر يستجري يعكس على وحدة فلسطينية لأنو عارف شو رح يكون مصيرو ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />33- والاردن يا جرادنة هي بالأصل صحراء أو بادية فلسطين , ولا يوجد بالأصل أردن على وجه الارض ابدا مهما تحلفون وتنكرون اصولكم فإن أغلب أصول العشائر الاردنية هي من اصول فلسطينية وعراقية وسورية ولبنانية , لانه لا يوجد اردن بالاصل , راجعو تاريخكم منيح ما رح تلاقوا اصلا فيه اردن ولا سوريا ولا لبنان , فلسطين هي بلاد الشام وهي أرض الشام , وهده حقيقة مثبتة بافعل , بعدين يا جرادنة لما بتغلطوا على فلسطين , فلسطين أرض مباركة وهي ارض الانبياء ومسرى الرسول الكريم صلى الله عليه وسلم ومقام الأنبياء والصحابة الكرام والله سبحانو وتعالى ذكرها بكتابو الكريم فلا يمكن إنكار هده الحقيقة , ولا تنسوا يا اردنيين إنو إحنا الوحيدين اللي عمرنا الأردن وبيننا فيها الصرح التعليمي الجامعي والعسكري والإقتصادي كمان , فيعني والله من العيب تنكرو جميلنا , ولا إنتو شوية بدو معفنين حثالة مشردين كلكوا ما بتسووا على بعض 40 الف أردني ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />34- كرهتك يا الأردن >;>; أردني ومستعر من جنسيتي ومستعر من بلدي :::::::<br />تفووووه عليك يالأردن وعلى ملكك المعظم (العظمة لله سبحانه ) وعلى شعبك الزفت .. اقسم بالله العظيم اني اردني ومستعر من كوني اردني لكني ماخذ احدى الجناسي الخليجيه .... وهذا ايميلي والي فيه امه خير يضيفني عنه اشوف alminhaly-333@live.com<br />ولكم يلعن ابوها الاردن والي جابها والي خلفها والي بيفتخر فيها والي مخدوع فيها وطزززززززز فيها ...<br />وانت يالأردني اتمنى اشوفك فيس تو فيس عقولتك حتى تشوف الرجوله عأصولها ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />35- أجرب شعب وبلد بالعالم الأردن<br />أخرى شعب بالعالم الأردن<br />أسفل شعب بالعالم الأردن<br />أندل شعب بالعالم الأردن<br />أوطى شعب بالعالم الأردن<br />أوسخ وأقذر شعب بالعالم الأردن<br />أخون شعب بالعالم الأردن<br />أعفن شعب بالعالم الأردن<br />أحط شعب بالعالم الأردن<br />أحقر شعب بالعالم الأردن<br />أرذل شعب بالعالم الأردن<br />أكلب شعب بالعالم الأردن<br />أحون شعب بالعالم الأردن<br />أبقر شعب بالعالم الأردن<br />أحمر شعب بالعالم الأردن<br />أبغل شعب بالعالم الأردن<br />أكبر شعب متخلف بالعالم الأردن<br />أنيك شعب وبنات بالعالم الأردنيات الأصل<br />أمحن بنات بالعالم الأردنيات الأصل<br />أشرمط بنات بالعالم الأردنيات الأصل<br />أكبر زاوية قائمة بالطيز بالعالم هي أطياز الأردنيين<br />أكبر كس مفتوح الكس الأردني<br />((مش كلهم برضوا))<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />36- لا ننسى بانك الملك حسين لعنه الله في قبره واتى من بعده عبد الله الذين يدعون انهم من سلالة النبي هم من باعو فلسطين وتامرو على شعبها ولا تنسو ايها الاردنيين بان لولا الشعب الفلسطين اوقف العدو في معركة الكرامه لرايناكم تحت وطات اليهود تصرخون وربما تكونو قد رحلتو جميعا عنها وتركتوها ..فانتم لا يهمكم سوى فقط ان تحضرو الحفلات الماجنات والرقص والسكر والعربده..ولا تنسو جميعا انكم في الاردن حرمت عليكم مخيمات تافلسطينين فانت لا تستطيعون الدخول اليها رغم انفكم وانف كل من يتكلم عن فلسطين بلد الدين ولاسلام والسلام والمحبه والتسامح..فيها شعب لا يذل يدافع عن شرف الامه العربية في كل مكان تراه هنا في فلسطين وهناك بالعراق وهناك بافغانستان ولبنان وسريا<br />>;>;>;>;اذا كان الشعب الفلسطيني هو شعب كما وصفتموه فهذا لان الاردن تقوم على اقتصادهم فالشعب الفلسطيني اذا سحب امواله من الاردن انتهت الاردن وانتهى شعبها فهي تعيش على خيرات هذا الشعب الرائع المكافح ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />37- اعلم ايها العربي اينما تكون..واعلمي ايتها العربية اينما تكونين..بان فسطين وشعبها الجبار المكافح المجاهد المدافع عن كرامة العرب باكملهم ..الذين سطرو بدمائهم ارض فلسطين والعراق ولبنان وسوريا والاردن وافغانستان وكل مكان عربي..الذين وقفو في وجهة الغرب بقيادة اسرائيل وامريكا..الذين تكلموا وهتفو وصرخوا ووقفو بكل ما يملكون لكن..الخيانة العربية وتامر العرب على شعب لم يتجاوز الستة ملايين نسمه هذا الشعب الذي اشغل العالم باكمله ففي اي بلد تسمعهم يتكلمون عن فلسطين وجميع الانظار تتجه الى فلسطين وشعبها..هذا الشعب وهذه الارض التي باعها حكامنا لليهود بدا من الاردن وعلى راسهم الملعونين في تربهم المسمى الشريف خسين وابنه حسن لعنة الله عليهم .......<br />>;>;>; انكم لا تفقهون غير ذلك.بل الجبن فيكم والخيانة في دمكم..وحقدكم على فلسطين ياتي من منطق القوة التي يتمتع فيها الشعب الفلسطيني داخل المخيمات وسيطرته اقتصاديا على الاردن..حيث انه يحرم عليكم دخول المخيمات الفلسطينية<br />وان الشعب الفلسطيني شعب لا مثيل له..فالحقد نابع من الغيرة لان الشعب الفلسطيني يسكن في اجمل واحلى وتقدس منطقة بالعالم كله منتصف الكرة الارضيه فوقها باب السماء وشهيدها باربعين شهيد وشعبها شعب جبار من ولا شيء يصنع المستحيل ويصنع المعجزات ويفعل ما يريد بلا اي مانع او عائق........<br />كل الشكر للشباب فلسطين الذين يقفون هنا امام تلك الكلمات معلنين تحديهم للجميع بانهم شعب واحد رغم الخلافات ....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />38- يا سلاااااااااااااام عليكو يا ارادنه يا جحاش يا معفنين يا نور يا زبالة يا حثالة يا بدو يا مشردين يا خرا يا حَــــــوَش , صار إلكو لسان يا سقطه تحكو على فلسطين واهلها وتسلمو حبايبي الفلسطينيه افحموهم والعنو ابوهم والي خلفهم وانسفوووهم وفجروهم ولا تخلو منهم ذارية على وش الارض لأنهم شعب واطي وجعان وساقط ومتخلف بصراحة ..... أنا فلسطينية بالضفة , ما تخافوش يا اردنية مش عايشة بالاردن الخرة ولا بدي اعيشش فيها اصلا من حلاوتها ما هي الادن اصلا فلسطين بلاش جدال وكلام فاضي انا بصراحة اكتر ناس بكرههم وبكره اطلع بوجوهم الجربه المعفنة<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />39- اف مستغرب كيف صار للاردنة لسان يحكو فيها اولاد السفلة المجرمين القتلة ابناء القرده الخنازير , على فكرة أرذل شعب بالعالم كلو هو الشعب الاردني بس خليها عل الله لانكو فعلا شعب حقير وسافل وما بنطاق<br />طبعا انا مش مستغرب اني هلاقي هيك مسبات لانو هاد من صفاتكو يا بجم يا سقط يا ولاد الحرام , وبحيي كل فلسطيني هونه<br />وفلسطينية بنفس الوقت من كافة اناحاء العالم اللي قامو بحرق الاردنين وتفجيرهم بس طبعا هدا النظام الهاشمي عفوا الهامشي اللي علمكو الحقد والحسد ولسة بالضبط دوبي قاري عن موضوع ضم الضفة مع الاردن , مستحيييييييييييييييييييييييييييييييل والف لا بانو الضفة تنضم تاني مرة مع الاردن , جاي عبد الله الجرو ابن الكلب حسين يكمل مسيرة ابوه الخنزير المخسسوف بقبرو عليه لعنة الله اللي مسمي حالو شريف , يا عمي احنا فلسطينية وما احد بجيب اظفر رجلنا, وكندرة فلسطيني بتسوى الشعب الاردني كلو لانكو شعب جبااااان ومتخلف بصراحة , ودوبي لسة قاري بعض التعليقات مش كلها وفي من ضمنها تعليقات المنيوك القحبه محمد نواف طبعا لانك اردني وما بتفرق معك هيك مسبات كاتب يا كلب بانو هناك فلسطينين يريدون اللعب بالنار , من بلش بالتعليقات يا خنزير يا تور ؟ إحنا ولا انتوا يا بجم يا نور يا اولاد الساقطة ......<br />0000000000000000000000000000000000000000000000000000000<br />وآسفة كتير على إطالة الموضوع , واصبرو علي يا جرادنه الي فترة كبيرة ما بدخل الموقع , لكن اصبرو علي وصدقوني رح اسلخ جلودكم وظهوركو بإذن الله<br />مع تحياتي : فلسطينيه وبكل فخر وعزة ......"
