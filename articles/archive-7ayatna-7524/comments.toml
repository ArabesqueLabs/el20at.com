subject = "قال فلسطين قال ..."
author = "الأردني ..."
text = "أولاً اللي خلق اشي اسمو (( فلسطين )) .. خلق مليون بلد وبلد غيرو .. هاذ أولا<br />ثانياً كل واحد بفتخر وبعتز بأصلو .. ولكن يا أخواني مش لحد اللي يعني يكون (( فوق الطبيعي )) .. وأنا مش مختلف مع هاذ الإشي بالعكس أنا من أشد الناس وأقواهم برأي أنو كل واحد وأصلو .. ويكفيني ويكفي غيري من الأردنيين فخراً واعتزازاً بأنهم من المملكة الأردنيه الهاشمية ... بلد العزه والكرامه والشرف والنخوه والضمير العربي .. الخ .. والتاريخ أكبر شاهد على هاذ الإشي .. (( اللي مابعرف يروح يقرأ كتب تاريخيه ويشوف أمجادنا وبطولاتنا وتضحياتنا على مستوى العالم كلو .. ورحمة الله على المغفور له بإذنه تعالى الملك/ الحسين بن طلال - طيب الله ثراه- .. )) .. وهاذ كمان ثانياً<br />ثالثاُ الفلسطينيون همه اللي باعو أرضهم بإيدهم .. وهمه اللي راحو وتركو أرضهم وبيوتهم وكل إشي بخصهم .. وراحو ع بلدان ثانيه .. يعني (( جنوا ع أنفسهم براقش )) .. يعني خربو بيتهم بإيدهم وغيرو كثير من الشغلات .. الخ .. لأ وفوق كل هاذ بدهم الناس تحترمهم وتقدرهم وتوجبهم ويكون إلهم قيمه بالنسبه لإلهم .. هلا عمي .. أول اشي روحو رجعوا أرضكو .. وهاذ إذا قدرتوا ترجعوهااااااااااااااااااااا .. خخخخخخخخخخخ .. (( إبقوا قابلوني ع قولة إخوانه المصريين )) .. ماعلينا .. وأيضاً هاذ ثالثاُ<br />رابعاً و ليعلم الجميع (( كل الناس )) بأن للفسطينيين صفات (( والعياذ بالله منها )) .. لاتتوافر في الكافر نفسه .. تصورا .. وتخيلو هاذ الأشي .. يعني أنا هسه رح أحي صفاتهم بكل إختصار لأنو (( ماخفي كان أعظم )) .. ورح أبدا .. 1) الحقد والكره والحسد لكل الناس بشكل عام، وخاص (( للأردنيين )) .. مش عارف ليه ؟؟؟ مع إنو والله (( بكسر الهاء )) .. إنو حنا مفضليين عليهم خيرات الله .. وأكبر دليل أنو حنا مستقبلينهم عنا .. وبشتغلو عنا .. زينا زيهم (( لابنزيد عنهم بإشي وولا همه بزيدو عنا بإشي )) .. (( يعني أكثر من هيك ؟!! )) .. 2) الجشع والطمع وتمني زوال نعمة الغير .. (( يالله شوفوا لوين ؟؟؟ )) .. لا إله الله .. ماعلينا .. همه هيك أصلا ً كلهم على نفس الشاكله (( جيل بعلم جيل )) .. 4) النفاق والضحك عليك (( من ورا ظهرك يعني )) .. الله أكبـــــــــــــــــــــــــــــــــررر .. 5) نكران فضل الناس وجميلهم عليهم .. (( خير تعمل شر تلقى )) .. اللهم صبرنا على هذوووووووووووووووووووووله ((الـ......)) .. 6) ولما بدهم يعزموك (( طبعاً مش سواد في عيونك .. لأ .. لمصالحهم الشخصية .. بس على مين ؟؟ .. على بابا ياماما )) ..المهم ... بتطلع من عندهم على وشك المووووووووووووووت .. لأنهم وبكل بساطه .. وإنتبهوا لهاي الشغله كثير منيييييييييييح (( ببصقول في الصحن اللي بوكلو في قبل ماقدمولك إياه .. وطبعاً أنتا بتكنش عارف هاذ الإشي .. وبحكولك تفضل يهلا بالضيف .. ضيف الله .. وأنتا يامسكين (( المعزوم )) راحت عليك وأكلتها في حالك .. ؟؟!! لاحول الله ياربي ..... الخ وهاذ الي حكتوه (( فيض من غيض )) ..<br />ع العموم ... كل فلسطيني مايرفع راسوووووووووووووووووووووووووووووووووو .. لأنو دايماً كان عكس هيك تماماً (( راسو بالأرض ورح يظلو راسو بالارض )) .. وتحيا الأردن أولاااااااااااااااااااااااا خاوا عن اللي برضى واللمابرضى .. ونحيا الرايه الهاشميه لفوق دايماً .. ويحيا الملك .. وعليهم يالنشامى عليهم .. وتحياتي،،، التوقيع / قالوا عنك راسك مرفوع وعيونك جاويه (( قويه)) .. قلتلهم العفو كلنا ناس .. بس أنا *& * أردنــــــــــي *& * ..."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 59
subject = "فلسطين أفضل البلاد"
author = "مرابطة في أرض الرباط"
text = "مع احترامي الشديد لرأيك , لكن الله خلق فلسطين و كرمها و رفعها عن باقي بلاده , و فضل المقيمين فيها !<br />يكفي يا أخي أن بها جهادًا و رباطًا لا تروه أنتم في بلادكم !<br />و أغلب صحابة رسول الله هاجروا الى فلسطين و ماتوا فيها لما علموا لها من قداسة و عظمة !<br />كما أنها مهد الرسالات الثلاث , و و إليها سيحشر الناس يوم القيامة !<br />و لن أزيد أكثر .. فقداسة و عظمة أرض فلسطين شيء لا يحتاج إلى إثبات !!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 60
subject = "قال الأردن قال"
author = "فلسطيني"
text = "الفلسطينينين عايشين بالأردن متنعمين !! مين حكى هالحكي ؟!<br />روح شوف أجهزة مخابراتكم شو بتعمل في الفلسطينين من إهانة و تنكيل !!<br />ولا شكلك نسيت أحداث أيلول الأسود لما الملك حسين قتل 30 ألف فلسطيني !!<br />لا الأردن ولا أي بلد عربي بيعامل الفلسطينين باحترام .. حسبي الله على كل أنظمة العرب !"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 61
subject = "إرضو بالواقع يافلسطينيين .. وكفا مكاباااااااابره ؟؟!"
author = "الأردني ..."
text = "هههههههههههههه .. شفتو إنو الحقيقة بتزعل وبتجرح ؟؟!!<br />ع العموم أنا مش مستغرب منكو .. لأنو هاذ هوه طبعكو ؟؟ ومش رح تتغيرو ؟؟ (( كل واحد بعمل بأصلووو )) ..<br />فعلاً ذنب الكلب بظلو أعوج حتى لو حطوووووووووووه بالقالب 40 سنه (( أنا بحكي 40مليون سنه )) ..<br />الأردن أولا ً خاوا خاوا خاوا .. واللي عندو غير هالكلام يتشرف ويجي ويحكيه .. بس المرجال بتكنش من ورا الكمبيوتر .. وشغل الكلام .. أنا بحبوش .. اللي بدو يواجه الواحد لازم يجيه (( فيس تو فيس )) .. وهلا عمي ؟؟!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

