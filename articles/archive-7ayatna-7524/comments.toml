order = 511
subject = "كان الاردن وسيبقى كلب حراسة"
author = "مهند جدعان"
text = "كان الاردن وسيبقى كلب حراسة وفي لاسرائيل وللصهيونية.. اطول خط مواجهة مع الصهاينة محروس برموش \\\"النشامى\\\" الذين باعوا الارض والعرض واجروا ارضهم للصهاينة 99 عاما..<br />الاردن كلب حراسة وفي لاسرائيل. هذا دوره وهكذا سيبقى الى ابد الابدين وينتهي الاردن بزوال اسرائيل العفنة فهما نظامان عفنان اوجد كل منهما لخدمة الاخر كخنجر مسموم في خاصرة الفلسطينيين والامة العربية"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

