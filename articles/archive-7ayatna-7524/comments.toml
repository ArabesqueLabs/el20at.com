subject = "رسالة عاجلة إلى الأخت : أردنية أصل"
author = "ابن فلسطين"
text = "طيب يا أختي إنتوا يا أهل البادية لحاكلوا يهود , وخاصة طبعا أهل الأردن , وتاني إشي الكل هلأ صار يسب الله سبحانه وتعالى<br />والدين الحنيف في كل مكان (مع إني ضد كل واحد بسب الله سبحانه وتعالى جل في علاه حتى لو كان فلسطيني وقلة ما هم لأنه الحمد لله في وعي) وإنتوا يا البدو كفاية إنه ربنا قال فيكم : {الأعراب أشد كفرا ونفاقا} يعني انطمي وكلي خرة"
