order = 467
subject = "عاشو بنات وشباب فلسطين احرقوهم حرق وااذا في واحد اردني زلمة يحكي معي على هذا الايميل la-malo@hotmail.com عشان ادعس عليه برجلي ولو انها خسارة فيه"
author = "طنش كل الناس وادعس على اكبر راس مو لانك دهب والماس بس لانك فلسطيني مرفوع الراس"
text = "يا شباب وبنات فلسطين ولله ما قصرتو ولا حطيتو واطي<br />وهيك بدنا اياكم عشان كل العارف تعرف انو الفلسطينيه ما بحطو واطي لحدا<br />واحنا صح بنحب العرب والمسلمين بس الي بغلط ع فلسطين ويتهم بنات ورجال فلسطين بعدم الشرف فهذا يهودي كلب واط<br />ي يجب تنضيفة بل المبيدات الحشرية التي تنفع مع الحشرات امثالة<br />والي بحترم فلسطين وشعب فلسطين على عينا وراسنا من فوق<br />وفلسطين اكبر من انو واحد مريض نفسيا يكتب عنها وعن شعبها كلمات لا تليق غير ىباليهود على الانترنت لانها فلسطين<br />مسرى الرسول وارض المبارك فيها للعالمين<br />ومهما حكينا مش راح نوصف فلسطين ولا شعب فلسطين<br />بتعرفو بهاي الوقت بتذكر حسن جمجوم وفؤاد حجازي<br />لما قالو باسم العرب نحيا وبسم العرب نموووت<br />تعالو وشوف العرب كيف بطعنونا بضهرنا<br />وبكفي نحكي عن فلسطين<br />ولا ايا واحد مريض نفسيا وما عنده دين راح يقدر ينال من فلسطين<br />لانها راح تضلها اكبر من الجميييييييييييييييع<br />والحمد لله ربي خلقتني وابدعت في تكويني وزدتني شرفا وجعلتني فلسطيني<br />وتحياتي لجميع الشعوب العربيه الي بتوقف مع فلسطين من الحيط للخليج<br />والفلسطينيه عمرهم ما بحطو واطي لحدا<br />وكل ما واحد مريض نفسيا راح يفتح ثمة بكلمة عن فلسطين<br />ان شاء الله راح يطلع ميت فلسطيني وفلسطينيه يدعسو على هذا الثم الي ما بطلع غير الزبالة الي جواه"
