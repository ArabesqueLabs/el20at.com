subject = "الى الفلسطينيين"
author = "عامر بني صخر"
text = "ايها الفلسطينيون.. لا تنتظروا منا شيئا نحن الاردنيين.. انا اعلنها بكل صراحة لا يوجد في العالم شعب اتفه منا.. لانه كل واحد بسطاره في ظهره واحنا شعب خانع منافق هزيز ذنب.. ولا نحكم الا والصرماية على رؤوسنا.. اقدر للفلسطينيين نضالهم التاريخي وعدم تهاونهم مع اي شعب في العالم لانهم شعب مكافح لا يهمه تامر المتامرين ولا تخاذل المتخاذلين.. لقد عشت تجربة كوني خدمت في جهاز امني وكيف كنا نقوم بتعذيب المناضلين الفلسطينيين والسياسيين الفلسطينيين لا لشيء الا لانهم اذوا اسرائيل او حاولوا ايذائها او حتى فكروا بان ياذوها.. لقد كنا نحن من يسدي الخدمات الجليلة لاجهزة الاستخبارات الاسرائيلية ونساعدهم على اكتشاف خلايا المقاومة الفلسطينية وخصوصا في الضفة الغربية المحتلة.. التاريخ لن يرحم وسيكتب بحروف سوداء تاريخنا المظلم.. اما هؤلاء الاردنيين الذين يتحدثون عن الفلسطينيين بهذه الكراهية والحقد فلا تلوموهم هم مجرد امعات تربوا في مدارس العمالة والخيانة وكره الفلسطينيين وهذا ما طلبه الصهاينة من نظامنا الذي يلتقي معهم في كل شيء حتى لو طلبوا منه ان يحرق الشعبين الاردني والفلسطيني في سبيل تحقيق امانيهم وامالهم فهو لن يقصر فالوقود من الشعبين الفلسطيني والاردني والمستفيد هم الصهاينة وهذا ما جرى في حرب ايلول الفتنة التي اوقد شرارتها النظام واتباعه من اذناب الامريكان والصهاينة وهو لن يقصر في اعادة الكرة اذا ما طلب منه ذلك"
archived = "2009-04-05"
