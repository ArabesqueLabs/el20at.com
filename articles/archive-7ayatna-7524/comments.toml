subject = "انت اردني اكيد و لا ؟؟؟؟؟"
author = "سورلاي بسكاكت"
text = "الى الاخ اردني<br />اول سؤال خطرلي لما قريت ما كتبت قلت يا ترى اكيد اللي كتب هذا اردني عربي بيمشي فيه دم اردني؟ بصراحة ما بعرف الظاهر اذا كنت اردني فيه شي حادثة بالطفولة اثرت عليك بشكل كبير و حطمت شخصيتك لهذا اليوم و اذا كان هذا الشي صحيح فاعتذر لك نيابة عمن غلط معك و انصحك باللجوء لطبيب نفسي .<br />لو استعرضت التاريخ لعرفت انه اللي باع الارض مو الفلاحين بل الاقطاع و هذول اغلبهم من خارج فلسطينو نسبة الاراضي المباعة لا تتجاوز 2%من فلسطين و الباقي احتلال و مجازر للتهجير الم تسمع بدير ياسين مثلا<br />و تاريخيا لم يبتلى شعب مثل ما ابتلي به الفلسطينيين قيادات فاسدة محيط عربي هائم الكل ضايع و العدو له اجندة 100سنة و ينفذها بدقة و الشعب الفلسطيني مغلوب على امره مفقر مهمش مسروق منكوب<br />على فكرة لا ادافع عنهم لانني فلطسيني ولكن لانك تبالغ جدا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 264
subject = "إلى آخر تعليق .. سد بوزك ولك !"
author = "أردني من السلط"
text = "إلى آخر فلسطيني علق على الموضوع ..<br />مش كان أحسنلك لو كنت ساكت وحطيت بثمك الخرا, آه ..<br />يعني أنا مش فاهم .. إنتا ليش اله خالقك وخالق كل الفلسطيينة حمممممير وهبايل وبفهموش !!!<br />ولك بتعرف إنو أكثر واحد بنقهر منو وياريت لو إنو طالع بإيدي لأفشخ بعرظو وعرظ خواتو القحبات العاهرات الداعرات ..<br />ولكو أوسخ ناس = الفلسطينية .<br />أحقر ناس= الفلسطينية .<br />أكلب ناس = الفلسطينية .<br />أنذل ناس = الفلسطينية .<br />ألئم وأحقد ناس = الفلسطينية .<br />أشرمط وأقحب وأعرص وأنيك ناس وشعب = الفلسطينية .<br />أشرمط أرظ = فلسطين .<br />أكبر عدد للملاهي والكازينوهات والديسكوهات والبارات والخمارات وبيوت الشرمطه والدعارة = فلسطين ( وبالتحديد في رام الله وأريحا ويافا .. وعلى من حذا حذوهم ومشى على دربهم وشاكلتهم .. واكثر مرتاديها البهائي الواطي الخسيس أبو مازن الشرموط وشلتو .. إلا أن البهلول ( عريقات *) أكثر واحد بنيك بالفلسطينيات .. منتو معروفين شعب شراميط متعودين على هالشغلات .. عادي وطبيعي الأمر بالنسبة إلكو .... !! وماعلينا )<br />أزبل شخص= الفلسطيني ( مدعوس ع رقبتو وخاواااااااااااااااااا ) .<br />الكلب اللي بعوي وبنبح ليل نهار يعني 24 ساعة = الفلسطيني ( طبعاً مهو كلب \" Dog \" ) .<br />وشكراً هع هع هع عهع عهع خخخخخخخخخخخخخخخخخخخخ هخهههههههههههههههههههه"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 265
subject = "الى المدعو أردني من السلط ..."
author = "المشتاق للحور العين ( طبعا ابن فلسطين )"
text = "لا حول ولا قوة الا بالله ياااخى<br />قلنالكم اتقوا الله واسكتوا كلكم فلسطينى واردنى وبكفى فضايح ياعرب<br />ولكم افسدتم تارخ الاسلام يامسلمين ... حرررام عليييكم<br />بعدين يااردنى ماغلط عليك البنى ادم يااخى انت لسانك معدوم منوا الادب هيك تربايتك ناقصة ادب<br />اتقى الله ... سوف تحاسب على ذلة لسانك<br />فلسطين فوق الجميع لانها ارض المقدسات الاسلامية والقرأن خير شاهد ودليل<br />لانها ارض المحشر و المنشر والقرأن خير دليل<br />لانها الارض الابدية حتى قيام الساعة<br />اتقى الله راح تنحشر فيها ياابنى<br />ماجااى على بالى اعلق<br />مداخلة بسيطة<br />اسأل الله ان يهدينا جميعا لما يحب ويرضى"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 266
subject = "خلص يا أخوان مابصير هاذ الكلام ؟؟؟ اهداوا وصلوا ع النبي !"
author = "محمد نواف الحمدالله ..."
text = "ياجماعة ياجماعة .. خلص انسووووووووووووووووو<br />وآنا بعتذر لكل شخص أخطأت بحقو .. أو أسأت إلو .. أو سبيتو وسبيت شرفو وشرف خواتو ..<br />لن أقول وداعاً .. ولكن سوف أقول .. إلى اللقاء على أمل أن ألقاكم في يومٍ من الأيام ( وهو أتٍ لا محـــــــــــالة )<br />وأما بالنسبة للأخ المشتاق إلى حور الغين .. حقك علي وآسف<br />ولبنت السعودية .. آنا كمان آسف ..<br />وفلسطيني حتى النخاع .. أنا كمان آسف ...<br />ولفلسطينية .. أنا آسف ..<br />ولكل الفلسطينية اللي علقوا<br />((((((((((((((((((((((((((((((((((((((((((((((( سامحوني ))))))))))))))))))))))))))))))))))))))))))))))))<br />تحياتي للجميع ..<br />والأردن أولا ................. والراية هاشمية بعون الله .. وعلى الله"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 267
subject = "انتو ناس بقر والدليل تحت"
author = "حاقد على الاردن"
text = "خالد الهزايمة<br />ولكـ قبل ما تيجي تحكي وتزاود على فلسطين . . روح دور وابحث عن اصلكـ منيح<br />أنا متأكد ما رح ترجع تحكي<br />لأنك ما رح تلاقي أصــل<br />فلسطين تاج على راسكـ وعلى راس كل العرب<br />وباعتراف من الجميع<br />روح شوف الصحتفة<br />شوف مسؤولينكوا كيف بيخجلوا يطلعوا على التلفزيونات<br />ليش ؟؟!!<br />مش لأنو العار على وجوهكوا<br />مش بيكفي غزة واقفة بوجه اليهود لحالها<br />وهاد شرف للعرب<br />بس يا خسارة<br />العرب ما بيحبوا شي اسمه شرف<br />انت واحــد حقيـــر. . . وكـل واحد بيقرى كلامك بيعرف هالشي<br />طبعا رح تكره فلسطين وتحكي انها انتهت<br />كيف ما تحكي هيكـ وانتو سلمتوا زمان لليهود<br />بس احنا لأنا شرفاء وما بنرضى الذل . . . وهيكـ تربينا ما رضينا نسلم متلكم<br />بيكفي عاد<br />ارجعوا لعقلكم وفكروا منيح رح تعرفوا مين الشريف ومين الخاين<br />كم واحد من الاردن أو من العرب كلهم طلع يقول أنا ذد يللي بيصير بغزة<br />لا ليش يحكي هيكـ . . . طبعا هو مـع ! مش زمان سلموا لليهود همي<br />بكفينا نطلع مسيرات وتظارهرات كاذبة بس<br />عيب يا عمو عيب ^_^"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 268
subject = "بكره فلسطين"
author = "ابن الاردن"
text = "يا عمي احنا مع اليهود<br />فلسطين زمان بعناها<br />بلا كلام فاضي<br />خلي اليهود يذبحوكوا واحنا هينا بنتفرج<br />ليش اجي أدافع عنكوا وارمي حالي على الموت<br />الله ينكب فلسطين وينكب كل العرب<br />اللهم نفسي<br />المهم أعيش وأروح وآجي وأطش وأطلع مع الصبايا ويلعن ابو العرب كلهم<br />بلا فلسطين بلا هم<br />فلسطين زمان خلصت قضيتها<br />اللي مش عاجبه يعيش بفلسطين ييجي يصيع عنا واحنا بنرحب فيه<br />أما اللي بيحكوا مقاومة وكلام فاضي خليهم يذبحوا ومن طيزي ازا بيدور عليهم واحد عربي<br />خخخخخخخخخخخخخخخخخخخخخخ"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

