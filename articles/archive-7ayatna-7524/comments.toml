[[comments]]
order = 409
subject = "لفلسطين كلامي .. و ان لم يكن فيه خير فلها سكوتي"
author = "محب حقيقي"
text = "تتراشقون هنا بالسباب و الشتائم و الـ.... و هناك في فلسطين يتراشقون بالحجارة و القنابل و الرصاص!!!<br />بالله عليكم ، الى كل من يدعي حب فلسطين .. لا يكون اظهار حبها بالانحطاط في الكلام لنك لا تقدم اي شئ لفلسطين بهذه الشتائم انت فقط تظهر وجها قبيحا فلسطين بريئة منه ... واحد فيكم يقول لي ماذا استفادت فلسطين من كلامه؟؟؟<br />فلسطين لا تحتاج لمن يدافع عنها بهذا الاسلوب .. اتركوا فلسطين يفخر بالانتماء لها شباب حقيقيون يقاتلون هناك و يضحون و يرفعون اسم فلسطين عاليا مجبرين الجميع على حبهم و احترامهم و احترام فلسطين لما يقدموه ..<br />لفلسطيننا الف تحية ... مع حبي .. ان كان كلامي لن يفيدك يا فلسطين ،، فلأصمت .."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 410
subject = "ردا على كلام محب حقيقي"
author = "يوسف البحيصي ( فلسطيني و مثل الصقر يصعب اصطيادي"
text = "و ها أنا قد رجعت لأرد على كلام كل من هو حاقد على فلسطين<br />ولكن ردي هذه المرة على محب حقيقي و أقول له:<br />اصمت و مع احترامي الشديد لك<br />فعين بعين و سن بسن يا محب<br />فتالله إن هذا لنوع من أنواع الجهاد رد كل من يقف في وجوههنا من أولاد الزناة<br />و هذا مع احترامي الشديد لإخي الفلسطيني الأبي محب<br />و سلام الله على كل من هو كل عربي مسلم أصيل و لا سلام على من كره فلسطين لإنه ليس على ملة الإسلام"
