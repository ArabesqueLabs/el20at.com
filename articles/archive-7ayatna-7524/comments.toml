subject = "الى البدوان الرحل في صحراء فلسطين (الاردن حسب مسمى الانجليز)"
author = "طلال الشوبكي"
text = "الاردن: هي منطقة تقع في جنوب شرق بلاد الشام وهي جزء من فلسطين وكانت تسمى صحراء فلسطين حيث تتبع السلط نابلس والكرك الخليل وربة عمون القدس وهكذا ..<br />صحراء فلسطين (الاردن حاليا) هي جزء لا يتجزء من ولايات منطقة الشام في الدولة الاسلامية منذ عهد الخلفاء الراشدين رضي الله عنهم وبقية كذلك حتى انهيار دولة الخلافة العثمانية العلية ,<br />في بدايات القرن العشرين قام الاستعمار الانجليزي بمحاولات جاهدة لاحتلال اجزاء كبيرة من بلاد المسلمين و الدولة الاسلامية مثل شبه القارة الهندية ومصر وغيرها والعراق والجزيرة العربية واستعان بعدد من الخارجين على الدولة الاسلامية المفارقين لجماعة المسلمين وكان من ابرز هؤلاء آل سعود اللذين كانوا يسيطرون على مناطق في بلاد نجد والشريف حسين والي مكة واتصل الانجليز بهؤلاء وغيرهم من خلال جواسيسهم امثال مكماهون ولورنس العرب وغيرهم من الجواسيس اللذين اقنعوا هؤلاء الخونة وغيرهم في مهاجمة الدولة الاسلامية ووعدوهم بأقامة دولة عربية لهم -في هذه الاثناء كان يعد الانجليز انفسهم آل سعود بالخلافة التي سيقيمها الاستعمار كما ويعد الهاشمي في الوقت ذاته- وبالفعل قام هؤلاء الخونة بتولي الاستعمار الصهيو صليبي و طعن الدولة الاسلامية دولة الخلافة والمسلمين في ظهرها كانت اعظم فتكاً من جيوش الانجليز كلها التي احتلت الجزيرة العربية وغيرها.<br />وفي عام 1915 ثار الشريف الهاشمي على امام المسلمين وخليفة الرسول الكريم وخرج من مكة بجيوش تجمعة في وادي رم في بادية الشام لتنطلق منها( الثورة العربية الكبرى) التي حاربت المسلمين بجانب الانجليز ومكنتهم من استعمار بلاد الاسلام واستعباد المسلمين.<br />وكذلك كان لآل سعود دورٌ مماثل مرسوم من قبل جواسيس الانجليز قاموا به على اتم وجه في اعلان الحرب على الله ورسوله والمؤمنين وفي تولي الكفار المستعمرين بل والمحاربة عنهم ومن امامهم.<br />في عام 1917 ومع اعلان الكافر المستعمر انتهاء الحرب العالمية الثانية استتبت له الامور بفضل الخونة العرب ليكشف عن شيء من كذبه المعهود والمعلوم لكل من فقه القران واتبع النبي الامام.<br />لقد اخلف الشيطان المستعمر موعده مع خونة العرب فلقد كان قسم ديار المسلمين فيما بينه لتأخذ فرنسا سوريا ولبنان والانجليز العراق وفلسطين وشرق الاردن ومصر وبلاد الجزيرة العربية, على كل حال فلقد كشر الكافر المستعمر عن انيابه واعطى اليهود وعد بلفور اللذي وصفه آل سعود --انهم من حق اليهود اللذين شردوا على مر الزمان ان يستقروا وتكون لهم دولة انهم شعب مسكين--.<br />لقد القى الكافر المستعمر بالفتات للخونة( بل دعوني اسميه خلق لهم وظيفة اخرى وهي حماية هذه المستعمرات فاقام آل سعود حراساً امناء على مصالحه في الحجاز ونجد كما اقام مثلهم في سواحل جزيرة العرب .اما شريف العرب فلقد اصابته جلطة بعد ان ارداه الشيطان الانجليزي في جهنم فمات وقبر في قبرص بعد ان تعالى احد سادته عن مجرد الالتقاء به.<br />نعم فلم ينته دور الجواسيس الخونة بل اقامهم المستعمر حراساً امناء على مصالحه في منطقة شرق الاردن والعراق فأقام لهم ما سماه لهم الكافر المستعمر المملكة الاردنية الهاشمية ودولة العراق ووضع لكل دولة علم وجاسوس خائن وصنع له جيش حتى يستطيع من خلاله حماية نفسه من الامة وحماية مصالح الانجليز.<br />اما الجيش العربي اللذي هو من اللذين تابعوا خونة العرب اللذين ثاروا على دولة الاسلام فلقد اقام عليه الانجليز قائداً انجليزياً --- بشكل طبيعي كان هذا هو الحاكم الفعلي للبلاد(لتقريب الصورة مثل الجنرال الامريكي كيسي او من خلفه في العراق في قيادة القوات المستعمرة والاشراف على اقامة جيش من الجواسيس لحماية مصالحه فب المستقبل), وهكذا بالفعل فقد صنع الانجليز جيش للخونة في ما يسمى الاردن كان زعيمه(كلوب باشا) باشا حتى يلطف الموقف.<br />وهكذا عندما استتبت الامور للحارس الامين لمصالح الانجليزي المستعمر حتى اصبح يتقرب لسيده بما لم يطلب منه من خدمات فقد سلمت قيادة الجيش للجاسوس القائم على مستعمرة شرق الاردن (طبعاً كن هذا الجاسوس من الجيل الرابع للهاشمين الخونة وهو حسين بن طلال بن عبدالله بن الجد الخائن الحسين بن على شريف مكة).<br />ثم بقي هذا النظام الذي اقامه الكافر المستعمر حارساً اميناً مرضياً عنه من قبل الكافر المستعمر.<br />وفي عام 1998 توفي هذا الجاسوس اللذي بقي خادماً اميناً لمصالح الكافر المستعمر في الابقاء على هذه الامة متشرذمة تحكم بالظاغوت وبقي حارساً لليهود بعد ان صنع هو ومن معه من جواسيس الاستعمار في مصر وسوريا والسعودية وغيرها اقول بعد ان صنع من اليهود اللذين ضرب الله عليهم الذلة صنع منهم اسطورة, فهم الجيش الذي لا يهزم والدولة العظيمة في المنطقة .<br />وبالفعل بقي حارساً اميناً لليهود وللانجليز خائناً لله ولرسوله وللمؤمنين خائناً للمسجد الاقصى وفلسطين سيفه غليظ على كل مجاهد يدافع عن الامة والدين او داعٍ الى الله على صراط مستقيم.<br />ثم تولى مصالح الاستعمار آخر من عملاء الاستعمار كان اجرء على الله ورسوله والمؤمنين بز اقرانه في الخيانة وخدمة الاستعمار القديم الجديد.<br />استقبل شارون وبوش اعدى اعداء الامة في العقبة...........<br />ثم استقبل اولمرت اللذي كان لا يزال دم عائلة غالية على شاطىء غزة يقطر من فمه ويديه....<br />قال لصحيفة الفايننشل تايمز ان المشكلة لا تتعلق بالمتطرفين بل المشكلة في الاسلام نفسه........."
archived = "2009-04-05"
