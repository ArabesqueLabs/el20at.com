[[comments]]
order = 255
subject = "اي تاريخ"
author = "ابن الشام"
text = "يا اردني عن اي تاريخ تتكلم فادا دل كلامك فانه يدل على انسان جاهل لايعلم شي عن التاريخ يا ايها الجاهل ادا قلت تاريخ فانك تقول فلسطين صاحبت اقدم مدينة في العالم ادا قلت تاريخ فانك تقول فلسطين محور الصراع بين العالم الاسلامي والغربي مند القدم عندما تقول تاريخ تقول فلسطين مهد الديانات الثلاث وارض الانبيا ومسرا الرسول ص ............اما الاردن لم تكن في الخريطة الى من قبل 60 عام فقط وعندما تتكلم عن الاردن فانك تتكلم عن دولة قليلا منها من العراق ومن السعودية وسوريا وجزاء كبير بما كان يسمى في التاريخ الدي قراته انت صراء فلسطين الكبراء هدا هو التاريخ ايها الاردني اما الحاضر ما هي الاردن عبارة عن صحراء سكانها ليسم اردنين لا تملك اي ثروة تعيش على مصائب غيرها من الشعوب تتحدث عن اقتصاد اردني فعلم انه لايوجد في الاردن سواء 4 شركات اصحابها اردنين الاصل ادا بالفعل لايوجد اقتصاد فالاقتصاد الاردني رؤس امواله هم فلسطنين الاصل الاردن تاخد مساعدات خيالية من امريكا ودالك مقابل حماية حدود اسرائيل الشرقية اي انها تعيش على ظهر القضية الفلسطنية وادا تكلمت عن شعب فان الاردن دولة يحكمها عائلة سعودية وشعبها النسبة الاغلب منهم هم من اصول عراقية فاين انت ايها الاردني فانت ليس بحاكم وليس بمحكوم انه قدمة احصائية عبر شاشة التلفزة شاهدنا فيها انا الاردنين من اصول فلسطنية عددهم 3.5 مليون في الاردن وتجمعهم في عمان والزرقاء واربد وانه هناك 60000 الف عراقي و 50000 مصري وسوري ومن شرق اسياء وغير دالك يعملون في الاردن ولتعلم ان عدد سكان الاردن 5.5 مليون ادا انتم عبارة عن 90000 الف ادا انتم اقل من مليون فاي تاريخ واي دولة تتحدث عنها ادا انت لستم بشعب ولستم بحاكم ............... لكن انا الفلسطين ابن الاراضي المقدسة انا الدي ناضلت عبر التاريخ انا من دافعت عن شرف الامة الاسلامية والعربية نحن 15 مليون فلسطيني في الداخل والشتات اي اضعاف اضعافكم ..........فمن انت لترفع راسك وانا اطمل راسي ... خسيت انت والعرب وعملاكم...........انا من يرفع راسه وانتم من تطونا روسكم لامريكا وغيرها نحن الشرفاء في عصر قلة فيه الرجال"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

