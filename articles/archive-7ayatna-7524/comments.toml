[[comments]]
order = 188
subject = "إلى كل فلسطيني أخو قحبه"
author = "حمود المحيسن"
text = "احنا الاردنيين يا كلاااب نسيتو شو سوينا لكم يا كلاب يا فلسطينيين وكمان الي يقهرك مسوين زلام عندنا الكلاب تخسسسسسسسسسسسسسسسسسسسسسسسسسسسى شواربكم يا فلسطينيين يا مزبلة الشعب العربي وصدق اخي الي قال انه ديأنا كرزون اكبرررر شرررررررررموطه قحبه فلسطينيه منيوكه العن ابو زباب امها على ام كل فلسطيني مو عاجبه شباب الاردن واقووووووووووووله انه داعسين على راصكم يا كلاااااااب الارررررررررررررررررررررررردن اولا وشباب الاردن اولاااااااااااااااااااااا روحو شوفو بلادكو يا فلسطينيين الي الاسرائيليين قاعدين ينيكو خواتكم قدامكم وانتم زي القرون يا منايك جايين هنا تسووون زلام تخسسسسسسسسسسسسسسسسسسسسسسووووو يا عيال الخنزير يا عيال البقره ............. وشبااااااااااااااااااب الاردن اولا ... خاوا عن كل الفلسطينيين ............... الاردن اولااااااااااااااااااااااااااااااااااااااااااااااا ا تحيه من عشيرة الكلالده لكل العشائر الاردنيه فقط... والاردن اولاااااااااااااااااااااااااا(خاوا)"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

