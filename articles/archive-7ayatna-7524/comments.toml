subject = "الى ابن البادية العتيبي"
author = "بدوي فلسطيني"
text = "حنا بدو كل الارض ارضنا و كل السما لنا..<br />احنا مش بدو عبيد كلوب بوش كان يشتريهم بحفنة زبيب او قطعة حلاوة<br />احنا مش بدو كنا نشتغل جواسيس وكلاب اثر للانجليز<br />احنا مش بدو صرنا حراس نلبس طواقي خضر على من نصبهم الاعداء حكاما على هذه الامة<br />احنا مش بدو منافقين وخانعين وخانعين للي بدفع اكثر بصير ربنا<br />احنا مش بدو قضيناها صراخ وعنجهيات فاضية واحنا مهزومين من الاقزام قبل العمالقة<br />احنا مش بدو اجرنا ارضنا وعرضنا لليهود واحنا بنصفق لحكامنا وبنهيجن<br />ان البداوة بريئة براءة الذئب من دم يوسف ممن يسمون انفسهم بدو الاردن.. لانهم بالفعل اثبتوا انهم مجرد امعات وببغاوات وعلى دين ملوكهم ولو كانوا كفارا"
