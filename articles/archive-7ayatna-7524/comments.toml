subject = "الأخ الكريم عابر سبيل ورايح"
author = "عابر سبيل برضو"
text = "أخوي عابر سبيل ورايح (زي حالتي هيك) ، موقع إسلام أون لاين موقع إخونجي ابن قحبة ومدراؤه هم من إخونجية سورية الشراميط الخونة اللي بايعين عرضهم وشرفهم لشراميط السعودية وأميركا وبريطانيا مقابل السكر والعربدة اللي هم عايشين عليها ، فليش تتوقع منهم يغاروا على دينهم إذا عرضهم ما بغاروا عليه ، لك والله حيشا الخنازير لو شبهناهم فيها ..."
