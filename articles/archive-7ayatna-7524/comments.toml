[[comments]]
order = 331
subject = "قلتها في وله فلسطيني فأسمعت الأصم الأبكما"
author = "فلسطيني و مثل الصقر يصعب اصطيادي"
text = "سلام الله عليكم<br />أولا يا أردني الأردن هاي تبعتكم هي صحراء فلسطين و إذا مش عاجبك الكلام دور على أصل الأردن<br />و لا تحكي كلام إنت مش قدو يا أخي كل الأردنيين ليش مقهورين من الفلسطينيين هذا السؤال الخبراء و الفلاسفة اختلفوا عليه الصراحة انتو يا أردنيين ناس و العياذ بالله مكروهين من كل الشعوب<br />و احنا لمن نكون في الأردن بنكون متفضلين عليكم بنزين من سمعة البلد شوية ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 332
subject = "فلسطيني و مثل الصقر يصعب اصطيادي ( يوسف البحيصي )"
author = "قلتها في وله فلسطيني فلسطيني فأسمعت الأصم الأبكما"
text = "لا تأسفن على غدر الزمان لطالما رقصت على جثث الأسود كلاب لا تحسبن برقصها تعلو على أسيادها تبقى الأسود أسود ( الفلسطينيين ) و الكلاب كلاب ( الأردنيين )<br />برجع و بقول الأردن هي صحراء فلسطين<br />و أنا أحيي الوليد الفلسطيني<br />يجب على كل واحد أردني يتكلم و يعرف شو بتكلم و كمان شو جيب العبد ( الأردني ) يقعد في مكان سيدو ( الفلسطيني )؟؟؟"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 333
subject = "رد على السفيه محمد نواف"
author = "يوسف البحيصي"
text = "إذا نطق السفيه فلا تجبه فخير من إجابته السكوت<br />سكت عن السفيه فظن أني عييت عن الجواب و ما عييت<br />فإن كلمته فرجت عنه و إن خليته كمدا يموت<br />انتو يا أردنيين ناس فارطين الصراحة و الفلسطينيين اللي في الأردن همه اللي حاطين فيها السمعة الكويسة لإنو الصراحة سمعتكم خرة بين كل الشعوب سواء عربية أو غربية فيعني احنا اللي مزينينها إذا شفت للأردن زينة<br />و برجع و بعيد الأردن هي صحراء فلسطين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 334
subject = "ما ضل على الطيز ريش غير مفعوص الذنب"
author = "عاشق فلسطين"
text = "السلام عليكم ورحمة الله وبركاته (للفلسطينيين والفلسطينيات فقط) والسأم والخرة عليكم يا الأردنيين الأصل , لهلأ الاردنيين نفسهم مش راضييين ينطمو وينخرسو ويوكلو خرى مخرية مزقية بزق وخرى ناشف على الأخير ,<br />محمد نواف الحمد الله : ::: علاجك الوحيد يا عزيزي كالتالي :<br />المحتويات التي يجب توفرها لعلاجك :<br />1- توفر الحمام (هدا إزا كان عندكو حمام أساساً) .<br />2- وجود المرحاض .<br />3- يجب أن يكون المرحاض فيه شوية من الخرى .<br />4- ملح انجليزي .<br />5- تحضير زيت الزيتون وبعض الأعشاب .<br />6- وأخيرا كاسة قهوة تركية وليسة عربية .<br />طريقة التحضير :ـ<br />يجب عليك يا محمد نواف الحمد الله أن تدخل راسك إلى المرحاض يعني حتى رح يكون منظرك زي البغل (والله البغل أحلى شكلو<br />من وشك الخرى الملوي) ثم يا عزيزي تتأكد بأن الخرى عليها شويه حبات سمسم من اللي بتطفحه , وإن كان عليها سمسم<br />كان بها , بعد ذلك جيب زيت الزيتون وحضر الملح الإنجليزي , وسخن كاسة قهوة تركية , بعد ما تخلص , بس قبل ما تاكل<br />الخرى يا حبيبي وما تستعجل , لازم تحضر كاسة قهوة ساخنة بعد ما تخلص حط الملح الإنجليزي عليه , ودهن الخرى بزيت<br />الزيتون ونشفه بالأعشاب (آه الأعشاب ضروري تكون من مزرعة خرفان يعني بالعربي برسيم) وبعدين قبل ما تاكل الخرى حط<br />الملح الإنجليزي وبعدين كل الخرى , بعد 5 دقائق , الخرى رح يقوم بعملية تكوين مخك وأعصابك من جديد , ولما يخلص بعد هيك<br />وبعد ربع ساعة , روح على الحمام فورا , طبعا مستحيل تقدر توقف الخرا لأنو زيت الفرامل في طيزك رح يكون مخلص , لازم تعمل<br />كل شي في الحمام , ولازم تكون على وضع الإستعداد خلاص , هده طريقة لعلاجك عشان , لا تنسوني من صالح دعائكم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 335
subject = "عشتي يا فلسطين والله كبيرة وأهلك أكابر (طبعا بوجه شكري للغالي المشتاق للحور العين (طبعا ابن فلسطين)"
author = "عاشق فلسطين"
text = "السلام عليكم للفلسطينيين فقط<br />ولكو أوسخ ناس = الأردنييين الأصل<br />أجرب ناس = الأردنييين الأصل<br />أعفن ناس = الأردنييين الأصل<br />أخرى ناس = الأردنييين الأصل<br />أزفت ناس = الأردنييين الأصل<br />أحقر ناس= الأردنييين الأصل<br />أسقط ناس = الأردنييين الأصل<br />أكلب ناس = الأردنييين الأصل<br />أنذل ناس = الأردنييين الأصل<br />ألئم وأحقد ناس = الأردنييين الأصل<br />أقود وأشرمط وأقحب وأعرص وأنيك وأفتح وأكسس وأمحن بنات ورجال = الأردنيين والأردنيات الأصل<br />أشرمط أرض = الأردن طبعا<br />أزبل شخص= الأردني الأصل ( مدعوس ومتفوف عليه) .<br />الكلب اللي بعوي وبنبح ليل نهار يعني 24 ساعة = الأردني ( طبعاً مهو كلب وأكلب من كلب \\\\\\\" Dog \\\\\\\")<br />الشحات أربع عشرين ساعة عند الكباريهات والمراقص والمساجد = الأردني الأصل طبعا<br />لسة في صفات أكتر من هيك , بس اصبروا , علي ,<br />لازم قبل ما أروح أخلي ختامها مسك ان شا الله<br />تسلموا حبايب قلبي الفلسطينين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

