subject = "شيء من الحقيقة"
author = "ابن الرافدين"
text = "شيء من الحقيقة:<br />حينما سال لعاب الهاشميين بقيادة الشريف حسين بن علي لملك العرب ، لم يكن أمام الأمة التي كانت تعاني ويلات الأتراك إلا القبول ، وكانت الصورة السائدة آنذاك تقع تحت المقولة الشعبية \\\"نار الهاشميين ولا جنة الأتراك\\\" ، هذه العبارة تشبه تلك التي كانت تقال والفاتح على أبواب القسطنطينية ، حيث كان قساوستها يرددون \\\" والله لئن نرى عمامة الأتراك البيضاء في القسطنطينية ، خير من أن نرى قبعة الكاردينال الحمراء\\\" . ولو شئنا المضي قدماً في تحليل العبارتين لوجدنا أن هناك تشابهاً في ظروف كل من أهل القسطنطينية تحت الحصار ونظرتهم لإخوانهم الأوروبيين ، وظروف العرب أثناء مرحلة تردي الحكم العثماني ، غير أن الفارق هنا يكمن في أن الفاتح قد نشر العدل والطمأنينة ، فاستبدوا بالشعوب التي ظنتهم جاؤوا لتحريرها ، وتحولوا إلى دمىً تلهو بهم قوى الإستعمار، فمن فرنسا وطرد الملك فيصل من سوريا، إلى بريطانيا التي حولت الملك عبدالله الأول إلى سمسار ليس له إلا البيع والتهويد ونخر الجسد العربي المتآكل أصلاً.<br />الهاشميون في العراق لم يستطيعوا الوقوف بوجه العراقيين ، ولربما كان أهل الرافدين أكثر حكمة وواقعية حينما تخلصوا منهم، ولم يفعلوا ما فعله الأردنيون ، حيث قامت عشائرنا باستقبالهم ورفع شأنهم ، لتنال تلك العشائر التي آوت الهاشميين إلى مضاربها جزاء ذلك خداعا ومكراً انتهى بمحاصرة وقصف مدينة معان على يد عساكر عبدالله الحفيد وبأوامر رئيس وزرائه علي أبو الراغب .<br />الملك حسين وحكاية الثأر من العراقيين:<br />لا شك أن الملك حسين قد رأى في نفسه ملكاً وريثاً لجده الشريف حسين ، فبقي على أمل أن يمتد سلطانه من خلال سلطان أبناء عمومته في العراق ، غير ان الإطاحة بهم هناك جعلته يعيش مرحلة الوهن بوجوده في بلد ليس فيه من مقومات الدولة شيئاً ، ثم هو الملك الذي تربى على مائدة الإنجليز وفي كنفهم ، ثم هو الملك الذي بنى عرشه على مضارب عشائرنا واستغلها أسوأ استغلال ، فهل كان مثله سيحمل الهم القومي ، وهل لمثله أن يجعل الأردن نواة للمملكة العربية الكبرى ؟!! لا أظن ذلك وسيرته تثبت صدق قولي ، وما فعله هو وجده في فلسطين أكبر دليل على أن الهاشميين لم يسعهم إلا أن يكونوا اليد الطولى لإستعمار لم يكن قادراً على الإستمرار بصورته التقليدية.<br />في العراق كان دور الملك الحسين تآمريا منذ اللحظة الأولى ، أو لأقل منذ أن أوتي الفرصة ليقوم بذلك ، فهو الذي تقرب من صدام حسين على مدار حكمه الذي امتد قرابة الثلاثين سنة ، وأدخله كهوف الحروب ، وهو الذي لون العراق بدم العراقيين . لقد بدت حقيقة الملك حسين التآمرية في قضية العراق منذ اللحظة الأولى للحرب العراقية الإيرانية ، وترويجه لنظرية الدفاع عن البوابة الشرقية للوطن العربي ، ثم بإدخال الدول النفطية تلك المعركة لتحرق ثروتها في حرب لا مجال للنصر فيها ، وما كان الجوار الإيراني بكل علله أكثر خطراً من التوغل الإستعماري في الوطن الكبير والذي كان الهاشميون سدنته وأهل رفادته.<br />لماذا كان العراق مصب سخط الهاشميين؟<br />لأن العراقيين رفضوا بقاء الهاشميين على سدة الحكم فيه ، ولأن العراق سيكون حجر عثرة في طريق مخططاتهم ، وفي حال وجود قيادة مخلصة فيه فسيصبح خطراً على حكمهم في الأردن ، وبما أن الأردن صار بالنسبة لهم المربع الأخير في حركتهم بعدما فقدوا سوريا والعراق ، ثم ولأنه لا أمل لهم في الحجاز الذي أخرجوا منه، فإنه يتطلب منهم التشبث بهذا المربع على رقعة الشطرنج ، وفي حال خروجهم من الأردن ستكون النهاية غير محمودة العواقب، او لأقل الخروج دون عودة.<br />سياسة إحتواء وتوريط:<br />سياسة التوريط كانت على مبدأ \\\" كمثل الشيطان إذ قال للإنسان اكفر فلما كفر قال إني بريء منك إني أخااف الله رب العالمين\\\" هكذا كانت سياسة الملك حسين تجاه العراق، وهكذا وضع معادلته داخل حدود العراق وعلى أطرافه ، ولربما الذي شجع الملك على هذا الأمر قدرته على التأثير النفسي وحسن فهمه لنفسية الرئيس العراقي التواقة إلى صنع ذاته، حيث تكمن المقولة \\\"من مأمنه يؤتى الحذر\\\" ، وقد أوتي العراق وصدام من الجانب الذي ظنوه ملاذاً آمنا.<br />اما احتوائية الملك حسين للعراق فكانت من أجل أن لا يفكر الرئيس صدام بمد نفوذه من خلال انقلاب موال له في الأردن ، ولعل الذي أخافه من هذا الأمر هو أن صدام استطاع اللعب بورقة القومية العربية والمد القومي ولو على مستوى إقليمي ضيق ، وهذا المد كان قد لاقى قبولاً لدى الأردنيين ، ولدى ضباط الجيش وشيوخ العشائر الذين كانوا يتلقون المنح والهدايا، ثم هي المصلحة لدى الكثير من هؤلاء المتنفذين داخل المؤسسة العسكرية الأردنية والعشائرية ، حيث كانوا يرون في الرئيس صدام البديل للملك من بين القادة العرب من خلال برامجه التي امتدت خارج حدود القطر .<br />أثناء فترة سياسة التوريط والإحتواء كانت الحدود الأردنية مفتوحة تماماً للعراق ، ومن ميناء الأردن تم نقل تكنلوجيا السلاح العراقي الوهمي ، ومن نفس الميناء كانت تخرج تقارير المخابرات السرية للقوى التي تريد للعراق الوقوع في الفخ ، وهنا لا بد من الحديث بجرأة حول دور النظام الأردني التآمري ، إذ كان الملك يرمي الطعم للعراقيين ثم لا يلبث أن يخرج على الملأ ليلوم العراق أحياناً ثم يخرج مادحاً أحياناً اخر ، ليظل الأمر بين مد وجزر قرارات الملك والدور المسند له في اللعبة.<br />الأردنيون يتلقون الآثار السلبية لهذه السياسة:<br />سياسة الملك هذه جعلت الأردنيين يقعون في فخ النظام الذي اضطهدهم بالقوة أو بالمكر طيلة نصف قرن ، وليكون جزاؤهم كره الشعوب العربية ظناً أن الأردنيين يقفون مع الملك وسياسته ، ولعلي أجزم هنا أن الأردنيين وخصوصاً في فترة الملك حسين عانوا الكثير من الإضطهاد ، غير أن هذا الإضطهاد أخذ شكلاً آخر غير المألوف ، وغطى أعين العالم عن الدور العبثي وغير الإنساني الذي مارسه الملك خلال تلك الحقبة ليحكم القبضة على الأردنيين.<br />الهاشميون والورقة السنية:<br />من خلال سلسلة الحروب التي عاشها العراق نكاد نجزم أن الطائفية هي من صنع سدنة الإستعمار في المنطقة ، واللعب بورقة السنة والشيعة هو أمر مدروس بكل أبعاده ، إذ لا تكمن المشكلة في الوجود السني أو الشيعي ، وإنما بتسييس هذا الوجود بطريقة تخدم القوى التي تريد تشتيت المنطقة وتحويلها إلى تجمعات طائفية لا ترقى لإنشاء قوة إقليمية فاعلة.<br />ولعل المستنبط لتصريحات الملك عبدالله الأخيرة يجدها تصب في ذلك الإتجاه ، فمن يستطيع القول أن ملك الأردن يعرف من ثقافة المنطقة ما يمكنه من إصدار مثل تلك التصريحات، لكنه الدور المرسوم ، ودور الملك ليس لكونه من تربى في المدرسة الإنجليزية أو الأمريكية ، إنما لملك يحمل إسم الهاشميين ، ويذود عن مناهجهم لكن لمصلحة البريطانيين والأمريكيين في المنطقة، لأنه لا بد من أن يكون ثوب التصريحات عربياً إسلامياً سنياً لكي يجد صداه في المنطقة ، أو شيعياً لمن يريد أن يلعب ذات الدور من الجانب الشيعي.<br />خاتمة في الدور الأردني في المنطقة:<br />لا أشك أن الدور الأردني في المنطقة يتربع على قمة أولويات المخططات القادمة إلينا من الغرب، وأظن أن مقاصد الوجود الأردني دولة مستقلة بصورتها الحالية لا يتعدى هذا الدور المسند ، ولا تجد دولة كالأردن طريقها للبقاء إلا إذا لعبته بكل إتقان ، لذا لا بد من الوقوف امام هذه الفتن التي تشتعل في المنطقة ، وأول ما ينبغي فعله هو نشر وفضح هذا اللعبة بكل إسهاب وتفصيل ، وقد يكون القلم الحر النزيه في معركة كهذه أقوى من الرصاص ، لأن الذي ينقص شعوب المنطقة لا يتعدى الوعي ومعرفة ما يجري على حقيقته .<br />هناك إعلام مسخر لخدمة هذه الأهداف ، فلا بد من إعلام مضاد ، وهناك كتاب يزنون كل كلمة في مقالاتهم لأنها مدفوعة الثمن من قبل الأنظمة التي تتبناها ، غير أن أقلام كتاب الحقيقة تخط الحروف بدمائهم بعيداً عن زخرف القول وزوره، وهي أكثر قبولاً لدى الشعوب المظلومة.<br />حاضرنا الذي نعيشه اليوم لا شك مرير ، لذا لا بد من كتابته كما هو دون تزييف للحقائق ، ودون تحريف لما يجري على الساحة ، والغلبة دائماً للقلم الشريف الذي لا يصوغ الكلمة بالحبر ، لكنه القلم الذي يصوغ كلماته بدم صاحبه وجوعه وقهره .<br />ستضيق الدنيا بوجهنا ، فليكن ، وسنحرم كل حقوقنا ، لم لا ؟! غير انا سنظل نقاوم المؤامرة حتى نرى وحدتنا الكبرى ، ووطننا الكبير ينعم بالأمن والسلام ، لا تفرقنا الحدود ، ولا تحدد هويتنا ألون جوازات السفر ، لأن قلوبنا توحدت ... وحدها الوطن بهمومه وأحزانه ، ووحدها الوطن بالمسئولية العظيمة التي ألقاها على كاهل المخلصين من أبنائه.<br />أيها الكتاب ، رصوا أقلامكم وقاوموا الطائفية والإقليمية ، واصنعوا نصر أمتكم وشعوبكم، فإنني لا أخشى على اوطاننا العساكر والإحتلال ، لكنني أخشى عليه فرقة أبنائه ، ومع كل كلمة تقاومون بها مستعمراً أو غازياً ، اكتبوا رسالة وفاء للوطن الكبير واجعلوه فوق خلافات الرأي .<br />قاوموا حتى آخر قطرة من محابركم ... بل من دمكم ... وكونوا صفحة بيضاء في مرحلة حالكة من التاريخ ... وإلا فضعوا أقلامكم وبجانبها قصيدة رثاء للشرف والكرامة .<br />إن رسم المستعمر الحدود ، فاجعلوا أقلامكم بلا حدود ... مزقوا جوازات سفركم ، فالفكر الحر لا تحده ألوان جوازات السفر ... وأهون علينا أن نكون \\\"بدون\\\" على أن نحمل جوازات سفر مهترئة."
