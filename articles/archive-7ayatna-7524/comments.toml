author = "حمودي شكري"
text = "حبيبي اعطيني شعار للأردن غير الاردن اولا و ما دامك بتسب و بتحكي ولا شو الحئيئه ما عجبتك يعني العلم سرئتو وحطيتو مجمه سكتنا يا حبيبي خليك صريح و بعدين شوف اسال اي واحد احكيلو مين بتحب اردني ولا فلسطيني بحكيلك فلسطيني.<br />صحيح بتحكي روح حرر بلدك اول شي بس لو انت زلمه طلع فلسطين واحد من الاردن انا لو بصحلي اروح بروح من زمان مش مستنيك يا حبي اخر الزمن استنى اردني يحكيلي روح حارب على الاقل بنقاوم ما بعنا ارضنا لأسرائيل مش زيكو كل البحر الميت اسرائيليه وانتي مكيفين على حالكو وبعدين الملك عبدلله بعرف يحكي عربي؟"
