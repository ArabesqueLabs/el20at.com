[[comments]]
order = 214
subject = "كتاكيت الدمااار -_-"
author = "الفلسطيـــPـــنية"
text = "والله مش آدرة عنجد الأردنية مسخرة والله النكت روووووعة ورهيبة ومافي منها أحسن خلي الأردنية مضحكة للي بسوا واللي ما بسوا أساسا الأردنية خويفين بس شااطرين بالحكي والكلام الفاضي ولما تيجي تحكيلهم كلمة أو تستفزهم بحرف بصيرو متل الأرانب واللله بصيرو يعيطو وطز بأحسن أردني جربان طلع ولا لسا بدو يطلع أقسم بربي إنها الأردن أكره بلد عندي كلها جرب وقرف وووساخة وسفاالة ونواف الحقير إبن الحقيرة الكلب إبن الكلبة شايف حالو على الفاضي بتلاقي وهو عم بقرأ الردود تبعون الفلسطينية آعد يعيط وبروح للماما تبعتو تمسحلو بربيرو يا فافي يا دلوع يا مرة يا نسوان ما تفكر حالك إزا سبيت ولا حكيت كلمتين وسخين زي وجهك الخرا يعني دافعت عن بلدك يا أجرب بالعكس أساسا هيك عم تترك طابع عن حالك للناس إنو الأردنية أعفن وأحقر شعب بالعالم تفي عليك يا حيوان يا جرو يا كلب يا أكبر خنزير بالعالم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 215
subject = "هع هع هع هع بس كيف النكت لابئه ئلهم حطمو الصعايده"
author = "حمودي شكرري"
text = "بس يآ الفلسطيـــPـــنية سيبك منهم خلي النكت تحكم عليهم خليهم يسبو من هون لبكرا بس خايف يشوفو النكت ويصرلهم شي ههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه<br />طيب شوفو هاي<br />مسيحي دخل مسجد بالاردن و معاه سكين و قال: مين فيكم مسلم؟ ما حدا رد عليه إلا واحد شجاع قاله: أنا مسلم. اخده برا و قاله: عندي خروف بدي ياك تدبحه و تسلخه على الطريقه الإسلاميه قال المسلم: أنا بعرف أدبح بس شوف حد تاني يسلخ، بعد ما دبحلو الخروف .. دخل المسيحي المسجد مره تانيه والسكين كلها دم من الخروف و قال: مين مسلم كمان؟ اشروا المصلين على الإمام، رد الإمام عليهم: ' شو في .. هو لاني صليت فيكم ركعتين صرت مسلم خلاص'؟"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 216
subject = "الله على كلامك الحلو يا الفلسطيـــPـــنية"
author = "بنت نابلس (Palestine First) بحبك يا فلسطين"
text = "كلامك كتير بجنن يا أختي الفلسطينيـــ P ـية وبرضوا النكت بتجنن كتير , على فكرة الأردنيين كلهم زي صرمتي وجزمتي , طيب أنا عندي نكتة أحلى من هده بكتير : واحد مصري بسأل واحد أردني أصل : ايش الفرق بينكوا وبين البهايم : الأردني قال :<br />البحر الأحمر , ههههههههههههههههههههههههههههههههههههههههههههههههههههههه بدي أنفجر وأموت من الضحك , شوف كيف التخلف لوين صار , فعشان هيك الأردنية زي الصرصار لما بشرد وبنضرب بالصرمة , وأنا بوجه شكري الخالص لأختي العزيزة بنت السعودية وبقلها الله يخليكي ويحفظك حبيبتي وتسلمي على كلامك العسل"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 217
subject = "سأعود لاضع تعليقى فيما بعد"
author = "المشتاق للحور العين ( ابن فلسطين )"
text = "لتسكت كل الالسنة التى تتطاول المسلمين .. المسلم اخو المسلم ... انما المسلمون اخوة ... ارض المقدسات فلسطين ... الامة العربية كلنا واحد مابدى تفرقة<br />مقتطفات صغيرة ولى عودة لاضع تعليق يليق بى كفلسطينى ادافع عن العرب جميعا وكان الله فى عبد العون ماكان العبد فى عون اخيه المسلم"
archived = "2009-04-05"
