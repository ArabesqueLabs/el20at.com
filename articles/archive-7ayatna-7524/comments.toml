text = "يا متعرص بدك إيميلي بعدين مين حكالك إني حاطط عقلي بعقل بنات ليش هو في بنت فلسطيزية مهو واضح من كلامهم إنهم فلسطيزيات ولك الشب نفسو إستحا يحكي كلامها بعدين متل ما حكا حبيب الشعب ((الأر\\ني)) قلة لزلام اللي عندكم خلتنا نحط عقلنا بعقل بنات بعدين هسا بدي إياك تروح تحط إيييييرك بأكبر كش فلسطيزية عشان تروووء عشان شكلك إنحرء راسك وخف عقلك وإنجيت ومش عارف ترد على الأردنية ولو تموت ما حعطيك إيميلي المرجلة مش على الإيميلات والمرجلة مش بكلام يا واااااطي يا منحط يا سافل"
