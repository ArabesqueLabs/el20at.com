[[comments]]
order = 241
subject = "رسالة شكر لبنت نابلس وبنت السعودية وكل فلسطينى يتعقل فى رده واحذر من ,....."
author = "المشتاق للحور العين ( طبعا ابن فلسطين )"
text = "بسم الله الرحمن الرحيم<br />اول ماابدا به قول الله تعالى (( ياايها الذين امنوا ان جاءكم فاسق بنبأ فتبينوا ان تصيبوا قوما بجهالة فتصبحوا على مافعلتم نادمين )) صدق الله العظيم<br />بعد ان اتوجه بالشكر للاخت بنت نابلس وللاخت بنت السعودية حفظهما الله من كل شر ولسان مهما طال وعال<br />واوجه شكر لكل فلسطينى يلتزم بأداب الحديث مع الاخرين لاننا مسلمون<br />واحذر من شخص دخل بإسم السودانى ويسب على الطرفين وهذه خدعة صعب تمر علينا الفلسطينية والاردنيه هداهم الله حبوا يوقعونا بالغلط على اخوانا فى السودان والسعودية الارض الطاهرة المقدسة<br />واريد ان اذكركم بقول الرسول صلى الله عليه وسلم :: كل المسلم على المسلم حرام دمه وماله وعرضه ))) فإتقوا الله فى اعراض بنات المسلمين يااخوان الى عم تحكوا كلام لاينطقه الا لسان خبيث ولاتتطاولوا على الشيخ عائض القرنى حفظه الله لانه داعية جليل ... على فكرة زار غزة من فترة بسيطة لما فتحت العريش وكان هدفه رؤية المقاومة فذهب الى خط النار ليراهم وعند التقائه بهم اخد يقبل رؤسهم واسلحتهم ليتبارك برجال فلسطين المقاومين .....<br />فى اخ فوق رد على من اخوانا الاردنييين وبحكى عن العنصرية بس هو بسميها النعصرية يااخى انت مابتعرف شو هيا ؟؟<br />راجع نفسك واتعلم من جديد عسى انك تعرفها واعرف انوا فلسطين اولا واخيرا غصب عن الكل ... لانها ارض المحشر والمنشر وارض الرسالات هكذا اراد الله وان الله اذا اراد شئ يقول له كن فيكون ...<br />مرة تانية اوجه شكرى العميق واحترامى لبنت السعودية وبنت نابلس ودعوة بنت نابلس لترك هذه الصفحة لكلاب تبنح بها دعوة خير لانوا السب الغير اخلاقى او اى نوع منوا مرفوض فغادروها على بركه الله اهل فلسطين فهذا مكان لايليق بالرجال المغاوير (( صاحب التعليق اسموا محمود الرواشدة )) الله يرشدوا لطريق الخير ويزود علموا امين<br />تحيتى لابطال فلسطين الاسود فى الميادين ونساء فلسطين الخنساوات وبنات فلسطين الاستشهاديات<br />واطفال فلسطين اطفال الحجارة ... فارس عودة رمز لقوة يخشاها جيش اسرائيل الرقم الصعب<br />اخوكم المشتاق للحور العين ... اللهم ارزقنا احدى الحسنيين اما النصر او الشهادة ..."
