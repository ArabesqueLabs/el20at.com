[[comments]]
order = 453
subject = "الى الاردنيين المسخوطين من احفاد لواطيي البحر الميت"
author = "شرلوك هولمز"
text = "اكثر من يتكلم عن الشرف الشرموطة.. ولذلك انتم لديكم احساس دائم بالعجز لانكوا مش قد الفلسطينية والفلسطينية ما عمرهم حطوا واطي لحده واكبر دليل انهم صامدين في وجه اكبر كيان للطغاة في العالم وفي التاريخ كيان بني صهيون حبايبكم.. وهو يقارع كل الدنيا بمفرده رغم تامركم شعبا وحكومة ونظاما عليه وانتم وجحوش الخليج الجرب مثلكم.. وعليكم ان تعرفوا يا لواطيين ان اكبر نسبة لواط في جيش في العالم سجلت في الجيش الاردني.. ضباطا وجنود بنيكوا في بعض.. خرة عليكوا وخرة على اللي بحبكوا يا اولاد العاهرات والشرموطات"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 454
subject = "الاردنيين الجرب"
author = "ابو الزلف"
text = "الاردنيين الجرب صاروا وتصورا.. القمل كان ماكلهم اكل.. وكانوا اوسخ شعب على ظهر ا لكرة الارضية.. الفلسطينية سووهم بنيادمين وسوولهم دولة من لا شيء.. صاروا نواب واعيان وضباط وطيارين.. نسوا حالهم.. عرفوا فقط ان الفلسطينية جابوا معهم اكلة الملوخية.. نسوا انه الفلسطينية علموهم حتى كيف يوكلوا.. وطبخات الاردن اليوم اصلها كله فلسطيني المقلوبة والمسخن والمفتول والحلويات النابلسية وخصوصا الكنافة اللي ما كانوا يعرفوا كيف شكلها.. صاروا وتصوروا وصارلهم لسان يحكوا فيه هذا اللسان بدو قطع وانحط في طيازهم لانهم بالفعل اثبتوا انه احط شعب في العالم.. فوق ما كان انه بوش اصبعه سباعي وعلم الاردن في نجمة سباعية وشرج الاردنية سباعي يعني اصبع بوش بيجي في طيازهم لصم.. وهم بحبوا شارون كثير وهتفوله في ستاد عمان تسلم ايدك يا شارون الفلسطينية زعلوا لانه الارهابي شارون شو عمل مجازر في فلسطين وفي لبنان.. بس الاردنية كان قصدهم اشي ثاني انه شارون كان حاط ايده كلها في طيازهم وهم عبيد اولاد عبيد وسيبقون كذلك على مر التاريخ وان اعتقد ا لفلسطينية ان ما عمله الارادنة سيمشي هكذا بسهولة بعد كل هذا التامر وهذه الخيانات ابا عن جد فهم واهمون وان شاء الله قريبا سيعلم الذين ظلموا اي منقلب سينقلبون"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 455
subject = "إلى خوري المنيوووووووووك"
author = "صلاح بشارات"
text = "إلى الياس خوري ولك يلعن أبوك على أمك هبت حريقا بطيز أمك أجت المطافي تطفيها لقت أبوك بلعب فيها ويلعن أبوك على أمك هبت حريقا بكس أخت أجت المطافي تطفيها لقت أبوك حاط زبو فيهاااااااا ..<br />خوري ترى لاتنزل معي راس براس أنت مش قدي !<br />ولك انا أردني لحمي مر وعظمي قاسي ودمي أزرق !!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 456
subject = "الى ابن الستين شرموطة البشارات"
author = "الخوري"
text = "انت اردني ولحمك مر وقاسي.. كس امك على كس ام الاردن.. ولكوا كمان بتحكوا في اللحمة يا شراميط يا اولاد اللواطيين والمخانيث.. ولكوا لحم الخيانة اللي عندكوا بتوزعوا منه على العالم كله وبزيد.. يا شراميط يا اولاد الصرامي.. يا جزمة رايس العتيقة يا بسطار شارون يا جرابات بوش المعفنة يا اولاد القحاب يا انجس شعب في العالم يا اعته شعب في العالم كس امياتكوا اللي كساسهن معطبنة معفنة يا من كان القمل يوكل في طيازكوا والبراغيث اكلتكوا المفضلة.. والك انت اللي مش قدي يا اخو القحبة وبتعرف اذا بس اجتمعت فيك في يوم من الايام عهد علي ما اضربك الا ادس العصاة في طيزك لانه هاي قيمتكوا وما بستلذوا الا على اللي بنيكوا يا صرامي يا عبارات يا حثالة الشعوب العربية كلها.. ولك الفلسطينية بدهم يظلوا داعسين على وجوهكوا بالشباشب والصرامي لانه بدكوا مليون سنة ضوئية تصلوا لكعب كندرة اهمل فلسطيني يا ابن العواية يا ابن الداشرة يا اخو الممحونات"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 457
subject = "الى ابن العهر البشارات"
author = "ابو قنوة الفلسطيني"
text = "تقول ان لحمك مر وعظمك قاسي ودمك ازرق.. الا خسئت وخسىء كل اردني يعتقد بعنجهيته الفارغة انه بطل.. اعطوني بطولة واحدة قمتم بها على مر التاريخ.. تاريخكم المليء بالعمالة والخيانة.. وبانكم حمالي البشاكير لاسيادكم في تل ابيب وواشنطن ولندن..<br />من انتم ايها الاردنيون السفلة<br />قائدكم مرتزقة<br />وشيخكم قرصان<br />مكومون داخل الأقفاص كالجرذان<br />انتم جرذان وستبقون كذلك على مر الازمان"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 458
subject = "الملك الاردني يخشى على اسرائيل من ايران"
author = "ابو سطام"
text = "اعرب الملك الاردني عبدالله الثاني خلال رحلة استجمام في الولايات المتحدة عن خشيته من النفوذ الايراني في فلسطين داعيا اميركا الى الحد من هذا النفوذ وانقاذ اسرائيل من الانهيار بسبب تصاعد وتيرة المقاومة الفلسطينية!<br />وكان الملك يدافع بحدة عن امن الكيان الصهيوني وخطر صواريخ القسام على امن المستوطنات بشكل يكاد المرء يظن ان من يتحدث هو ارييل شارون وليس مسؤول دولة عربية.<br />وتطرق عبدالله الثاني الى عملية السلام معربا عن امله بان تستأنف هذه العملية بين الفلسطينيين والاسرائيليين.<br />ورغم انه لا عتب على هذا الملك بسبب تصريحاته المسيئة الى الجمهورية الاسلامية لانه تربى في احضان ام زرعتها الاستخبارات البريطانية في بيت القرار الاردني ولكن ثمة تساؤلات تطرح نفسها الا وهي : لماذا يذرف عبدالله الاردني الدموع على الصهاينة ولكنه لم ينبس ببنت شفة ازاء المجازر التي ارتكبها الكيان الصهيوني ضد اطفال غزة؟.<br />هل اصبحت العائلة الهاشمية في الاردن حارس البوابة للكيان الاسرائيلي واداة قمع لضرب المقاومة الفلسطينية ومنع اي حركة تحررية لهذا الشعب؟<br />قد يبدو الامر غير مجد لسرد التاريخ والتطرق الى سجل هذه العائلة المشبوهة طيلة 9 عقود من الثورة العربية الكبرى المشبوهة حتى الآن.<br />اذ كانت العائلة الهاشمية منذ عهد الشريف حسين وحتى الملك عبدالله الاول واولاده حارسا لمصالح بريطانيا التي بدورها زرعت الكيان الصهيوني بمساعدة العائلة الهاشمية في قلب المنطقة الاسلامية والعربية في فلسطين.<br />وكان الملك حسين في خضم الانتفاضة الاولى عام 1987 يذهب الى تل ابيب ويلتقي بقادة الكيان الصهيوني امثال اسحاق رابين وشيمون بيريز وارييل شارون لتطويق الانتفاضة واجهاضها.<br />وليس من باب المبالغة القول انه لولا العائلة الهاشمية ودورها المشبوه في المنطقة ومحاولاتها الرامية الى ضرب الوحدة الاسلامية والعربية لكان الكيان الاسرائيلي قد سقط منذ عقدين من الزمن.<br />ولكن العائلة المالكة في الاردن لعبت دورا مشبوها وهبطت بمستواها الى حد لعب دور عميل للاستخبارات الصهيونية والغربية والاميركية للمحافظة على بقاء الكيان الصهيوني اللقيط.<br />ومن تداعيات هذا التعاون الوطيد احداث ايلول الاسود عام 1970 حيث قام الملك حسين وبايحاء من الصهاينه واميركا بارتكاب مجازر جماعية ذهب ضحيتها 15 الف مناضل فلسطيني وتدمير مخيمات اللاجئين الفلسطينيين.<br />وكما الشعب الايراني فان الشعب الاردني ايضا يستذكر العلاقات الحميمة التي كانت تربط الملك حسين بشاه ايران المقبور والذي كان عميلا للكيان الصهيوني ودشن عدة قواعد في ايران لقيام اسرائيل بالتجسس على مصالح الامتين الاسلامية والعربية.<br />وكان الملك حسين يتقاضى راتبا شهريا ومساعدات مالية سخية من شاه ايران السابق لقاء خدمات استخباراتية يقدمها له الملك حسين ضد الحركات الفلسطينية المناضلة.<br />وعندما سقط شاه ايران وانقطعت المساعدات المالية التي كانت تذهب الى الملك الاردني السابق من جيب الشعب الايراني اظهر الملك حسين عداءه للشعب الايراني من خلال دعمه للدكتاتور العراقي المعدوم صدام حسين طيلة فترة الحرب.<br />واستورث ابنه عبدالله الثاني هذا الحقد على ما يبدو من ابيه واصبح يوجه شتى الاساءات الى الشعب الايراني بشكل خاص والشيعة في العراق بشكل عام.<br />والآن حينما تسعى ايران الى مساعدة الشعب الفلسطيني واخراجه من محنته الراهنة بدوافع اسلامية وانسانية يتفوه هذا الملك بكلمات بعيدة عن كل الادبيات السياسية اللائقة ويعرب عن قلقه بسبب قيام ايران بمساعدة الشعب الفلسطيني الذي لا يريد الا تحرير اراضيه من الاحتلال الاسرائيلي.<br />فإذن على الملك الاردنى ان يخشى على الشعب الفلسطيني اولا من الاعتداءات الصهيونية، ويقوم باغلاق السفارة الاسرائيلية في عمان ثانيا، ويسمح للشعب الاردني بالتعاطف مع الشعب الفلسطيني ثالثا وان يكف عن معاداة الشيعة ولا يعول الكثير على المساعدات الاميركية والصهيونية."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

