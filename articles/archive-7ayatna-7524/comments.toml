[[comments]]
order = 68
subject = "الوليد الفلسطيني .. أهلاً بك"
author = "الأردني .."
text = "إلى الشب الفلسطيني (( الوليد )) أريد أن أعرف لم أنت بالذات وخصوصاً وكل الفلسطينيين عموماً بلا استثناء .. وأغلبية دول الوطن العربي (( وبالذات دول مجلس التعاون الخليجي العربي )) تكرهون كرهاً ككره الكافر، وتحقدون حقداً أسودً حالكاً يكاد لايرى منه شيئاً على الأطلاق، وتتمنون لو كان الأمر بيدكم لقضيتم علينا فرداً فرداً وهذا بلا أدنى شك ممبتغاكم وأمنيتكم الحقيرة، المبتذلة، الوضيعة الخالية من خصل الخير .. تتمنون لو نموت اليوم قبل غدٍ .. بل في هذه اللحظة !!! فيا لها من فرحه لاتعدلها فرحه .. فيا له من حلم قريب المنال بالنسبة لكم .. فعلاً كما قال الشاعر :<br />إذا أنت أكرمت الكريم ملكته ** ** ** وإذا أكرمت اللئيم تمردا<br />هذا جزاء الحكومة الأردنية من قبلكم التي لم تبخل قط بمد يد العون والمساعدة الطيبة لكم ولأجلكم فقط .. أن المساعدات لتي تصل لكم سواء أكانت مساعدات غذائية أو دوائية أو مادية ... الخ، وهنا أخص بالذكر المساعدات المادية (( الأموال )) التي ترسل لحكومتكم الفلسطينية التي يرئسها/ محمود عباس \" أبو ماز ن\"، ورئيس وزرائه / سلام فياض وغيرهم من الوزراء وأعضاء النواب والذين لهم دخل بالحكومة الفلسطينية \" وجماعة منظمة التحرير الوطني الفلسطيني _ فتح \" .. اذهبوا إليهم واسألوهم أين المساعدات والأموال التي قامت بإرسالها الحكومة الأردنية على مدى الأعوام الأخيرة والأعوام التي سبقتها ؟؟!!! إذن هو ذنبكم أنتم !!! . ولسنا نحن كما تعتقدون . إنها أمور تخصكم وأنتم أحرار (( هذا الأمر مفروغ منه البتَه )) . وكمساعدة مني / لقد قاموا بإقتسام هذه الأموال عليهم حسب الأهم فالأقل أهمية /<br />أن المملكة الأردنية الهاشمية .. منذ أعلان الإستقلال وقيامها للآن لم تنسى ولم تتناسى دورها ووجابها اتجاه هذا الشعب<br />اتجاه هذا الشعب التي لم تضمد جراحه حتى الآن، أن المملكة حريصة كل الحرص وواثقة كل الثقة بأن هذا الشعب في النهاية هو الذي سوف يحدد مصيره .. أن النكبة(48م )التي أدت إلى تهجير ملايين الفلسطينيين وتفرقهم في شتى بقاع العالم أجمع .. كان أول من استقبلهم هم الأردن .. فكانوا خير المستقبيلن لهم .. ولم ينظروا إليهم نظرة فلسطني قد خرج من بلده لكي يعيش هنا .. لا والله . أننا لانفرق بين ذلك ولاذاك، بالعكس الإنسان الفلسطيني يعامل معاملة الأردني بحيث لايزيد ولا ينقص عنه بشيء . وهنا وجب التنويه بأن وقت النكبة والنكسة التي أدتا إلى التهجير القسري حيث مد الجيش الأردني يديه وقاتل بكل مايملك من قوة صفاً بصف إلى جانب النضاليين الفلسطينيين .. لقد استشهد الآف من الأردنيون إلى جانب الفلسطينيون معاً .. حيث كان الألم واحد .. الجرح واحد .... الخ .. لقد عاش الأردنيون معى الفلسطينيون عيشة أخ وإلى جابن أخيه .. وعلى سبيل المثال لا الحصر استشهد عدد كبير من عشيرة بني صخر ملا يقل عن ال1200 شخص دفعة واحدة .. إن من نتائج استقبال الفلسطينيون عندنا بأن أكرمناهم وأحببناهم .. جعناهم أخوة أحباب لنا .. قدمنا لهم شيء كبير جداً وأنتم تعرفونه الا وهو / الجواز الأردني/ .. وأن بعض الذين حصلو عليه اعتبروا أردنيون مثلنا تماماً وسوف أعرض بعض العائلات الشهيرة الفلسطينية الأصل التي حصلت على الجواز، وهم كالآتي: *الجرادات \" لهم أكثر من منصب رفيع بهذا البلد وهذا شيء مأكد بالإضافة إلى امتلاكهم كثير من العقارات والمؤسسات والمحال التجارية * الصوافطه \" معروفون عندنا حيث شغلوا مناصب كبيرة بالديوان الملكي الهاشمي شيء مأكد، بالإضافة إلى تدريسهم بكثير من الجامعات الأردنية والمدارس \" * البوريني \" عائلة غنية عن التعريف، ابحث بالنت \" * السوالمه * زعاتره * الجلامنه * المجايده * روبين.... وكثير من العوائل والعشائر الفلسطينية التي تتمتع وتحمل الجواز الأردني ( والي مش مصدق يبحث بالنت عن أصلهم وفصلهم أو يسأل مصدر موثوق قريب منو وأكيد رح يحكيلو نفس الكلام ) .. ولطالما كان الملك حسين _طيب الله ثراه _ من أشد وأقوى المدافعين عن قضية الشعب الفلسطيني بإعتبارها قضية عادلة .. ولكن يوجد أناس فلسطينيون يريدون اللعب بالنار .. ولكنهم خسؤا هم وأمثالهم .. فالأردن سيبقى تاج الروؤس كلهم .. وكل هذا وغيره من الكلام الذي قلته .. وهنا أكرر كلامي وأقول التاريخ أكبر شاهد على ماحدث من وقائع ومعارك عديدة .. والتاريخ يعيد نفسه كما يقولون .. والتاريخ ليس بإنسان لكي يخطاْ يا (( الوليد الفلسطيني )) وإنما كان يسجل ويشاهد على كل كبيرة وصغيرة ويدونها في كتب لكي يقرأها هذا الجيل والجيل القادم من بعده وهكذا دواليك ..<br />ومع هذا كله لايزال بعض الناس يحملون الكيد والغل فوقهم .. وشعارهم (( لا لبقاء الأردن )) ولكن خسؤا هم وأمثالهم من هؤلاء المرتزقة الذين لو أحصيتهم لايتجاوزون أعداد الأصابع .. فما أكثر الذين يقولون ولا يفعلون ؟؟ّ!!! الوليد الفلسطيني<br />أنت فلسطيني والله محي أصلك .. ولكن هل سألت نفسك ماهو جوازك ؟؟؟ ألم تسأل نفسك من أين تأكل وتشرب وأين تنام ؟؟؟ ألم تسأل لماذا يحقد الفلسطينيون على الأردنيون ؟؟؟ ألم تسأل لماذا كل مايقال عن اسم الأردن الفلسطيني ينتفض من مكانه وكأن صاعقة صعقته ؟؟؟ هذه الأسئلة وغيرها من الأسئلة تحتاج لإجابات مقنعة ومفحمة .. وليست إجابات أطفال صغار يا الوليد الفلسطيني .. ع العموم هذا البلد سيظل معطاءً كريماً .. فقد نشأ عى هذا الشيء وتربى وترعرع على الأصالة والبداوه .. فالأردني البدوي يسوى عن عشرة رجال من أيد دولة عربية في كرمه وعطائه ووفائه وشجاعته وقوته والأهم من ذلك كله نشامته وفزعته القوية .. (( أي إخلاصه وأمانته وصدقه ووفائه بالعهود وشرفه وضميره اليض دائماً وحلمه وجوده وبسالته ...... الخ )) .. وآسف على الكلام الكثر الذي كتبته في رسالتي ولكن الساكت عن الحق شيطان أخرس ..<br />انتهـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــى ،،،<br />مع تحياتي ابن السلط ( محمد نواف الحمدالله )"
