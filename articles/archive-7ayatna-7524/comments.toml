subject = "لعاشق فلسطين"
author = "أنا"
text = "اذا انتا عندك مشكلة مع المذكور اللي هو محمد نواف الحمدا لله أنا شو دخلني ؟؟؟؟؟<br />انتا أكيد عامل معاه مشكلة وصاير تشكك بالعالم والناس اللي بتعلق بالصفحات<br />يا ولد روح انقلع من وجهي مش فاضيلك لا إلك ولا الثانيحمد ؟؟<br />وبعدين انت ا اكيد ناشر تعليقك الطووييييييييييييييييييييل كثير بكل صفحة بدخلها هذاك الثاني ياولد روح حلوا مشاكلكوا بعدين عنا<br />مش ناقصين احنا وجع راس هونه من وين بدو الواحد يلاقيها يعني ولك القضية أكبر من خيلاتك وتصوراتك !!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

