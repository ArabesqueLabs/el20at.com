text = "ولك كس اخت الاردن بسدر منسف كس اخت اختو ملون وانا الصباغ كس اختو وانا نعسان كس اختو ع البسطه بشلن كس اختو من ياهو لهوتميل ايرري بطيز كل اردني والادنيه كس خواتكم واحد وحدة خوات منيوكه يلعن شرفكم خزات الملك ايري بشرف الملك ومرتو الشقفه الله يجعلني امسك حلمات بزاز شلطيف بزهاااااا المولع بنار زي مع تحيات طالب توجيهي نايك مرت الملك"
