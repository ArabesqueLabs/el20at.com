[[comments]]
order = 305
subject = "الأردن + فلسطين = شعب واحد مو شعبين هيك علمنا أبو حسين"
author = "محمد العموش"
text = ".. رغم الذين حاولوا ( أو يحاولون ) أن يصنعوا الفتن بين الطرفين ( الأردني والفلسطيني ) في أن يفرقوا ويقسموا هذين بين الشعبين الكريمين لا، ولن، ولم يفلحوا في مبتغاهم هذا .. لإن الشعب الأردني والشعب الفلسطيني ( أخوة ) ..<br />أدعو الجميع بلا استثناء أو تمييز أو تفريق ( أردني أم فلسطيني ) إلى توحيد الصفوف .. والتماسك، والتعاضد، والتآزر، والتلاحم، والتكافل في كل شيء .. لإننا لسنا بشعبين .. ولا نحن بدولتين ذوات سيادة مستقلة .. ولسنا ممن يتنكر للآخر، ويتصيد عيوبه .. ولسنا من أصحاب العقول المتحجرة .. ولا ومن أصحاب الحجج الواهية .. ولسنا بحاقدين ومكرهيين على الفلسطينيون .. نحن سنبقى شعب واحد .. كلمتنا واحدة .. شعارنا واحد .. لغتنا واحدة .. ديننا واحد .. عروبتنا واحدة .. كفاحنا ونضالنا واحد .. عزيمتنا وإصرارنا كالسيف تماماً .. هويتنا عربية واحدة بإذن واحد أحد .. شرفنا وعرضنا فوق كل شيء ( إلى أخواني الأردنيين والفلسطينيين الرجاء عدم السب أو الشتم أو التلفظ بألفاظ نابية، وكلمات بذيئة تخدش بالحياء .. لإن الشخص الذي يسب شرف أو عرض الآخر . بل هو يسب بشرفه وعرضه .. وهذا إن كان يفهم ويعي هذا الكلام) ..<br />أوجه كلمة أخيرة لكلا البلدين العزيزين ..<br />بأننا أخوة في الله .. وكلانا يحب الآخر .. وليس هناك من يكره الآخر ..<br />وأنا شخصياً أحب الفلسطينيين ولا أكره أحداً منهم .ز لإنهم شعب ( زلام ) وكلهم رجالٌ بعمنى الكلمة .. وإنني أحي كل فلسطيني غار على شرفه وعرضو وبلده وشعبه وناضل من أجل قضيته العادلة .. وكافح من أجل تحرير الأقصى والقدس وفلسطين الحرية .. ومات شهيداص من أحل الله .. والوطن ..<br />وتحية أردنية إلى كل أهل فلسطين<br />وشكراً ...<br />أخوكم / محمد العموش _ الأردن ( اربد )"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

