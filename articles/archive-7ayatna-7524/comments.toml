[[comments]]
order = 212
subject = "يااااااااااااي وينك يا انسه حمودي شو اشتئتيلي"
author = "حموووودي شكري"
text = "ههههههههههههه مالك بتحكي عن امي و ابوي على الاقل بسو اشياء بالحلال بعدين تعالي لتكوني مجربي ولي ؟<br />والله طلع ابوي فايع من وراي ولك نفسي اعرف الاردن اولا ع شو و انا رح ارجع اعيد اسئلتي لانو لهلا ما شفت رد عليهم<br />كم عدد سكان الاردنيه بالاردن و كم عدد الفلسطينيه ؟<br />شو اصل نص المنتخب الاردني ؟<br />من وين جبتو العلم تاعكو ؟<br />كس امكو يا زلمه شوفو نكت الاردنيه عليكو طيب اسمعي واضحكي يا مسخره :-<br />1) أردني راح يشتغل شوفير تكسي في الصين كل مايأشر له واحد يقول له : ما أنا هسه نزلتك<br />2) اردني فتح كفي شوب في الصين سماه ( فن جن شاي ) ..........<br />3)كان في مرة واحد اردني قرر يعمل عملية تجميل ليوسع عيونه قام فتحهم على بعض<br />4)مره اردني حكمو عليه بالإعدام شنقا وهمه بشنقوه أشرلهم بأيدو... فنزلوه... قلهم والله رحت ما أموت.<br />شفتو قديش انتو مضحكه و مسخره هههههههههههههههههه"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

