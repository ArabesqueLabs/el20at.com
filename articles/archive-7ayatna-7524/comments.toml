text = "له له له<br />طول بالك يازلمه !!<br />لسه بأول الدرب حنا ؟<br />ولا شو رايك<br />.. الوضع متناك من أساسو ..<br />ورح توكلو خرا لامحـــــــــــــــــــــــــــــــــــــــــــــــــــــــــالة !<br />لأنو هيك لازم يصير ..<br />يا خرا ياحيوان دبختنا بفلسطييييييييييييييييييييييييييييييييييييييييييييييزك .. أي كس أختك ع أخت فلسطيزك منيح هيك !!<br />شو هالعالم والناس الفاضية .. ياحمار روح حرر بلدك من زباب اليهود اللي نازلين نيك في أختك وبنات ونسوان فلسطين .. بدل منتا قاعدى عم بتنصح وبترشد .. أصلاً هاذ إنتو ببتغيروش .. حمير وبقر وحوش وبجم ونور وسفله وكلاب ولاد كلاب<br />انطم واسطت وكل رخاك واقعد ياساكتى ياإيري . ماشي<br />خليك كبير .. وتتفلسفش علينا .<br />وسلام ياوجه الحرااااااااااااااااااااااااااااااااااااااااااااااااااااااااااام !!!"
