[[comments]]
order = 69
subject = "ياحيف ع الزلم .."
author = "محمود الرواشدة _ إربد"
text = "فعلاً .. هزلــــــت وقل منافعها، إلى كل فلسطيني لا على التعيين، سوف يأتي يوم ما أيها الفلسطيني وستعرف تماماً مامعنى ( الأردن ) .. سوف يأتي يوم ما أيها الفلسطيني وستعرف تماماً كم أن هذا البلد ( الأردن ) حكومة ًوشعباً قد عمل المستحيل من أجلكم، ولأجلكم فقط إن الحكومة الأردنية المعطائه وشعبها الكريم كان يفكر يوم من الأيام بأن له أخٌ يريد مساعدته لكي يحيا بأمل وتفاؤل، لكي يبقى صامداً ثابتاً كله عزيمة وإصرار وتحدي، لكي يذكره بأنه إذا تأوه \" صوت لألم حقيقي يخرج من سويداء قلب الإنسان عندما يشعر بأن شيئاًما قد سلب منه بالقوة \" كان يقف معه وقفة عز وشموخ، وقفة قوية يملئها نور الحب والإيمان، وقفة تساعده على النهوض والوقوف من جديد ليكمل المسير معه، وقفه بحق لاتعدلها وقفه .. سوف يأتي يوم ما أيها الفلسطيني وستعرف تماماً كم أن الشعب الأردني لا على التعيين كان يشعر ويحس بالألم بالحزن بالأسى بالقهر بالجوع بالفقر بالمرض بالحرمان ..الخ ، كان إذا رأى منظراً من مناظر البؤس أو مشهداً من مشاهد الشقاء كان يبكي، نعم يبكي؟!!! لأنه عايش نفس الحالة ورآها بمقلتيه وسمعها بأذنيه وشمها بأنفه وشعر بها بداخل جسده ( قلبه وروحه )، والأهم من ذلك كله ذاق مرارتها وألمها وحزنها وتعاستها وشقائها وبؤسها وجوعها وحرمانها وفقرها وأساها .. سوف يأتي يوم ما أيها الفلسطيني وستعرف تماماً بأن الشعب الأردني والفلسطيني شعب لا ولن تفرقه الحدود والحواجز، شعب بجسد واحد إذا أحس إحداهما بألم شعر الثاني بنفس الألم، شعب إذا جرح جسده أقام الثاني بتضميد جراحه .. سوف يأتي يوم ما أيها الفلسطيني وستعرف تماماً كم أن هذا الشعب قد وقف معكم جنباً إلى جنب رغم كل شيء .. سوف تعرف أيها الفلسطيني وستعرف تماماً بأننا لا ولن نكون ذا أصحاب نية أوجميلةً عليك وعلى غيرك من أفراد شعبك وإنما الله هو الرزاق الكريم الذي بيده كل شيء .. سوف تعرف كل شيئ .. وكل شيء .. ولن تخفى عنك خافية لأنه هو الحق الذي لامفر منه لافي الدنيا ولا في الآخره .. فمتى يأتي هذا اليوم ياالله!!!! واعذروني على كلامي ولكن ......"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

