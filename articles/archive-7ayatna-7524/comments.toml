order = 426
subject = "ايها الفلسطينيين الحذر الحذر الحذر من العربان الجربان."
author = "فلسطيني وأفتخر ومستعر من عروبتي"
text = "اولا- احب ان اوضح في بداية موضوعي اني هنا لا اعمم هناك نقاط مضيئة وسط محيط القذارة العربي تستحق منا كل اجلال وتعظيم وتحية وهي تتمثل بالمقاومة العراقية البطلة والمقاومة اللبنانية الفذة (حزب الله) وهناك شرفاء عرب قلائل صادقين حقا وفعلا يتناثرون في بحر الظلمات العربي جميعهم احييهم جميعا واستثنيهم مما ساقوله في هذا الموضوع.<br />ثانيا-ما اريد توضيحه هنا ايضا هو ان ليس معني كلامي هذا هو الرغبة بالركوع لامريكا واسرائيل اطلاقا انا مع حماس ومع مقاومة اسرائيل وامريكا ومع كل الشرفاء الذين يقاوموها لان بعض من صهاينة فتح استغل اوضاع الشعب الفلسطيني في الشتات ليبرر تنازلاته المهينه للعدو الصهيوني وان كل العالم ضدنا فلنركع وانا لا استبعد ان كثير من صهاينة فتح يرغب بهذه الضغوط علي الشعب الفلسطيني في الخارج لكي يبرروا ما يرتكبوه من مصائب في حق الشعب الفلسطيني ما زالت مستمرة حتي اللحظة.<br />نأتي للموضوع بعد هذه المقدمة الطويلة ما الذي يحدث ضد الشعب الفلسطيني في البلدان العربية ولماذا؟وسأكون صريحا معكم بعيدا عن الكذب والشعارات البراقة والمجاملات سأتكلم بصراحة دون ان يغضب احد مما سأقوله لاني اقسم انه الحقيقة.<br />الا يحق للفلسطيني ان يكفر بالعروبة الا يحق للفلسطيني ان يدوس عروبته بقدمة ويبصق عليها ما الذي تفعلة الدول العربية والشعوب العربية واكرر الشعوب العربية مرة اخري ضد الشعب الفلسطيني هذه الشعوب العاجزة التي ترتمي تحت حكامها تتأوه كل ليلة مما يفعله بها حكامها هذه الشعوب القذرة تلقي بفقرها وفشلها وتخلفها علي الشعب الفلسطيني كل بلد مصائبها صار سببها الشعب الفلسطيني هل تتخيلوا ايها المحترمين وهذه تجربة شخصية حدثت منذ ثلاث اسابيع اخي الذي اتي من الامارات ليقضي اجازة العيد معنا طائرته وصلت الي مطار القاهرة الساعة السابعة والنصف مساء انتظرنا انا واهلي ونحن قادمون من سفر اربع ساعات من الاسكندرية للقاهرة لا ستقباله في المطار حتي الساعة الثانية بعد منتصف الليل حتي يخرج من قاعة وصول المسافرين ست ساعات ونصف كاملة سألنا احد العساكر لان القلق اكلنا قال: (لا عادي الفلسطيني بيغيب شويه)<br />الوقت يمر أتساءل في قرارة نفسي ما الذي يحدث؟<br />نسأل الضباط يا عم طيب في ايه ؟<br />طيب هم حيرجعوه علي الامارات تاني؟<br />ولا اجابة مريحة او شافية يمر الوقت تصل الطائرات يمر امامك القادمين من مختلف الجنسيات العربية والاجنبية جنسيات اوربية امريكية ايطالية افريقية من كل حثالات الارض يمرون امامك ولا مشاكل وخرج اخي لنا اخيرا في الثانية صباحا ،ما الذي حدث ؟<br />قال حجزوني<br />والحوار هنا بين الضابط وشقيقي<br />انت فلسطيني؟ نعم<br />انت تحمل جواز سلطة مضروب؟<br />لا يا سيدي هذا جواز تصدره السلطة لفلسطينيي الخارج لا ستعمال الخارج فقط<br />بس ده من غير هوية اسرائيلية يعني مضروب لا حظوا معي بدون هوية اسرائيلية يبقي مضروب المهم كل هذه الاسئلة ويرجع تاني في الحجز ومن ضابط لضابط ومن رتبه لرتبه لحد ما وقع علي ورقة لا يعرف ما فيها حتي اللحظة منعوه ان يقرا ما يوقع عليه من الاخر،طيب يوم الالربعاء الماضي حانت لحظة المغادرة لانتهاء الاجازة ،نفس الفليم حتي انه تأخر علي ميعاد الطائرة واخذ طائرة تليها بساعات مجرد وصولنا لمنزلنا في الاسكندرية مباحث امن الدولة تتصل بنا وتسأل عنه تضييق ما بعده تضييق يقوم به النظام المصري علي الفلسطينيين في مصر تضييق رهيب لا يتخيله احد مع ان فلسطينيي مصر لا يتعدي عددهم ال 60 الف نسمة علي اقصي تقدير اغلبهم من الشباب المتعلم والتجار ورجال الاعمال المتميزين ممن يوظفون لديهم مئات الآلاف من المصريين في مختلف التخصصات ومعظمهم معروفين بالاسم بل ان جامعة 6 اكتوبر الخاصة وهي بمصاريف باهظة تقوم علي الفلسطينيين اذا علمنا ان عدد الطلبة الفلسطينيين فيها يناهز ال 4000 طالب فلسطيني وحتي الطلبة الفلسطينيين هنا في الجامعات الحكومية يضخون في خزينة الدولة 30 مليون جنيه استرليني-طبعا استرليني لان الفلسطيني يدفع المصاريف للحكومة هنا بالاسترليني تخيلوا- اما عن الشعب المصري فكلمة حق هذا الشعب فيه فئة من المخلصين والوطنيين وهم تحديدا من التيار الاسلامي واليساري الناصري اما بعد ذلك فالشعب المصري هو شعب من الجهله والحمقي كلمة توديه وكلمة تجيبه وهو شعب يكره كل ما هو فلسطيني بشكل غريب حقا انا حيث اعمل في المدرسة الخاصة التي اعمل بها مجرد ما يسمع اي شخص اني فلسطيني وجهه وطريقة تعامله معي تتغير شعب متخلف الا يكفي ان هذا الشعب قد صدر للدول العربية انظمة التعليم الفاشلة عبر مدرسيه الفاشلين الذين دمروا انظمة التعليم العربي بنظام الدروس الخصوصية ونشر البطالة في العالم العربي عبر العمالة المصرية رخيصة الثمن لا وكمان يحمل كثير من المصريين الشعب الفلسطيني مسئولية غبائه وفقره بل ويمكن عجزه عن مواجهة نظام فاشي يتحكم فيه ويذله،وهو حال ليس ببعيد عن بقية الشعوب العربية فقد رأينا العملاء في العراق كيف يقتلون الشعب الفلسطيني وكيف ان عدد بسيط من الفلسطينيين مئات من الفلسطينيين عجزت عن استقبالهم الدول العبرية اسف العربية بينما استقبلت ملايين العراقيين وبين هؤلاء كثير من الخونة والعملاء واللصوص ومنهم من نشر الرذيلة في البلاد المضيفة،في حين مئات من الفلسطينيين عجزت عن استقبالهم بلاد الجرب اسف العرب وبينهم العلماء وذوي الخبرة في مختلف المجالات حتي فتحت لهم ارض البرازيل ذراعيها ،وهناك ما حدث مع الفلسطينيين في الكويت التي تحمل فيها الشعب الفلسطيني نتاج غباء قيادته السياسية وحقد الشعب الكويتي الكويتيين هؤلاء مصيبه والله ويقول لك الفلسطينيين صنعوا وفعلوا اثناء الغزو علي حين ان من حاول اطلاق رصاصة علي القوات العراقية كان من الفلسطينيين ومن سرقت و نهبت محالهم التجارية وممتلكاتهم كانوامن الفلسطينيين فكما قال فؤاد الهاشم الكاتب الكويتي والمعروف بكرهه للشعب الفلسطيني ان الفلسطينيين كانوا يسيطرون علي السوق الكويتي وكما قال باللفظ (من التوكيلات التجارية إلي مطاعم الفلافل) وفي لبنان التي ساهم الفلسطينيين مع اهلها في بنائها واسماء المهنيين والتجار ورجال الاعمال وخبراء الاعلام الفلسطينيين في لبنان موجودة لمن يريدها، في لبنان ياتي شعب وطنه مكب لنفايات النطف الخليجية ليحمل الشعب الفلسطيني سبب المصائب في بلده وينسي انه هو نفسه اكبر المصائب علي بلده في الحقيقة وفي ليبيا التي بناها الفلسطينيين حجرا حجرا منذ ايام الملكية ولعل اسم توفيق غرغور المليونير الفلسطيني الذي خرب بيته القذافي بما اممه من ممتلكاته وشركاته يعرفة الكثير بل إن المنطقة التي يقوم عليها مطار طرابلس الدولي الان كانت من ممتلكاته واسمها منطقة غرغور حتي اليوم وكان من المقربين للاسرة المالكة في ليبيا كما ان وصيفات الملكة والمترجم الشخصي للملك كانوا جميعا اردنيون من اصل فلسطيني وبعد الثورة ساهم الفلسطينيين في بناء ليبيا وكان اول رئيس وزراء في ليبيا بعد الثورة فلسطيني وهو محمد المغربي كل ذلك شطبه القذافي بجرة قلم عندما طرد الشعب الفلسطيني من ليبيا في منتصف التسعينات واثار ذلك فرحة كثير من الليبيين لمن لا يعلم وكثير منهم استولي علي محال او ورش او ممتلكات لكثير من الفلسطينيين وفي بلد كالاردن شعبها لم يكن اكثر من رعاة بدو يعلم الجميع كيف تصرفوا ضد الشعب الفلسطيني ابان ايلول الاسود وحتي اليوم جميعنا يعرف الشعارات التالية في الاردن(تسلم ايدك يا شارون انت هناك واحنا هون)(بدنا نتكلم علي المكشوف فلسطيني ما بدنا نشوف)(واحد اتنين طلقها يا ابو حسين) وغيره وغيره وغيره من اساءات سابقة وحاضرة وربما للاسف الشديد مستقبلية ما الذي يجعل الفلسطيني يفتخر بعروبته؟بل مالذي يجعله يقول انا عربي؟ بعد هذا السرد البسيط بالنسبة لما وقع لشعب فلسطين طبعا أنا أعلنها من هنا أنا فلسطيني وفلسطيني فقط ادعم المقاومة في فلسطين وفي العراق وافغانستان ولبنان لكني فلسطيني اولا واخيرا واسقط عني صفة العروبة تلك الكارت او الورقة التي لا تصلح حتي ان تكون ورق تواليت في حمام عمومي قذر وانتم ايها الفلسطينيين الحذر الحذر الحذر من العربان الجربان."
