subject = "فلسطين عالية عالية رافعة رأسها رغم خنافير (أنوف) كل القحاب الأردنيين"
author = "رسالة عاجلة إلى الشرموط القحبة القواد الواطي ابن الممحونة : محمد نواف الحمدالله"
text = "يا حيوان يا كلب يا شرموط يا عرص يا قواد يا واطي يا منيوك يا مكسوس يا بن الخنازير , الله يلعنكوا من شعب واطي فعلا , إنتوا هيك أثبتوا إنكوا فعلا شعب وااااااااااااااااااااااااااااااااااطي لآخر درجة , فعلا , هيك إنتوا ,وين الأصالة يا بن الكلب , هده الأصالة<br />ياخي عيب عليك , أم الحضارة فلسطين وأم التقدم فلسطين , مش الأردن الخرة الزفت , أصلا يا حيوان لولا الله ثم فلسطين ما كنتوا أصلا بالوجود يا تيوس , لكن فعلا , الأردنيين الأصل في كل مكان بالعالم مكروهين ومدعوس على رقبتهم , والفلسطيين ولله الحمد<br />داعسين على رقابكوا في الأردن ,روح اقرا الفضيحة المكتوبة , بالله ولد عمره عشر سنوات هز أردني أصل هز , لأنه الفلسطينيين<br />بعرفوا يربوكم يا أولاد الكلب , إحنا أهل الأصول والشهامة والعراقة مش إنتوا نحسا , مش قادر أتكلم من هيك (اللسان يعجز فعلا<br />عن وصف الحمير والبقر والغجر) وتحياتي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 121
subject = "بالله عليكم يا الفلسطينيين زيدوا الأردنيين وافحموهم"
author = "فلسطينية وبكل فخر وعز"
text = "أصلا هده الأشكال زي محمد نواف الحمدالله وغيرهم متل التاني خالد الهزايمة هدول أصلا ما بنتشرف نحكي معهم لأنهم ناس<br />واطيين وتبعون مشاكل , لكن إحنا الفلسطينيين الحمد لله أفحمناكم وقمعناكم يا الأردنيين , بالله هده ردود , يلا ردو علينا وافحمونا<br />إزا بتقدروا , والله يخلي فلسطين وهي العالية العالية العالية فوق رؤوس الببغاوات الأردنية"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 122
subject = "هذه هي حقيقة الفلسطينيين ( من خلال تعليقاتهم بالأعلى وكذلك الحل بالأسفل )"
author = "محمد نواف الحمدالله ..."
text = "ولك يافلسطيزيه يابنت القحب .. احكي اسمك مش ممكن أكون شامك وفاتحك سباااااااااعي وإنتي مش عارفه مين اللي ناكك وفتح كسك سباعي .. احكي اسمك ياشرموطه .. يابنت الداشرة العاهرة العاهرة .. بنت الفالته الدايرة بالشوراع .. ولك إنتي لوفيك ذرة أو جزء من الأنوثة كنتي مابتحكي كلامك هاذ اللي بسم البدن .. ولك إنتي وأشك فيكي إنك زلمه مش مره .. أي يلعن شرفك .. ولك نايك كل بنات فلسطيز وحده وحده .. وأولهم إنتي ياحلوة ياقمر ياعسل ياحلو إنتا ..<br />ولك إنتي بتعرفي إنتي عبارة عن بنت فلسطيزية .. مش معروفلها أصل من فصل .. ملهاش هوية أو حتى جواز .. فايعة صايعة دايرة فالتة داشرة بالشوراع .. بتترجى الشباب عشان ينيكها مش بفلوس لأا ببلاش كمان !!!!!!!<br />ولك إنتي مكانك المراقص والملاهي والبارات والخمارات والديسكوهات والكازينوهات وكلوووووووووووووو .. الله يلعن شو قحبة وشرموطة وعاهره . ولك منيوكة إنتي .. مافي عنك إشي اسمو أخلاق أو قيم أو مبادئ أو أحساس بتأنيب الظمير .. يعني بالعربي وبالمشرمحي وحده غبية وهبلة وتيسة وملطوشة وسطلة وريالتها شاطة لرجليها .. وكس أمك ع أم اللي خلفوكي بنت حراااااااااااااااام ..<br />اسمعي أنا بنصحك تروحي دوري عن أمك وأبوكي !!! ماشي .. هع هع هع هع خخخخخخخخخخخخخخ ههههههههه<br />فلسطيزنا .. فلسطيزنا .. مدعوس تحت طيازنا .. مش مره ولا مرتين ولا ثلاث ولا حتى أربعة ..<br />فلسطيزنا .. فلسطيزنا .. والكل يحكي فلس وقع تحت الطين .. ولقيناه في طياز أسيادنا الأردنيين ..<br />فلسطيزنا .. فلسطيزنا .. وما أدراك ماطيزنا .. طيزنا .. هي لكم يا أردنيين .. وأكساسنا كذلك ..<br />فلسطيزنا .. فلسطيزنا .. فلسطيزنا .. فلسطيزنا ... النشيد الوطني الفلسطيزي .. ههههههههههههههه ردو تا أشووووووووووووووووووووووووووووووووووووووووووووووووووووووووف !!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 123
subject = "منيح هيك !!!"
author = "محمد نواف الحمدالله ..."
text = "شو .. منيح هيك ولا كمان !!!<br />إذا بدكو ترى فيه .. مش إنو مافي يعني !!!<br />والله حاظرين حنا .. قدها وقدود !!!<br />بس وينكو .. أنتو كلكو الفلسطيزية اللي كتبو تعليقاتهم .. بدي أقلهم شغله وحده بس ..<br />إنو المراجل وشغل الزلمنة . وشوفة الحال وشد الحيل .. ونفخ الصدور .. وكل واحد عاملي حالو أبو عنتر ومش عارف شو ..<br />بكونش من ورا شاشة الكمبيوتر .. أو التطقيق ع الكيبورد .. اللي بدو يحكي إشي يجي ويتفظل ويحكي وجه بوجه .. كس أمكو شغل لقلقة وتجعير .. بس لما تصير الشغلة جد وحقيقة بتتخبو مثل البسس والقطط ياوسخين ياجرب يامعفنين .. الله يلعنكو واحد واحد .. قال شعب منضال قال .. بس بلااااااااااااااااش !!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

