text = "الله اكبر على هاي العمايل شو هاد اللي جالس بصير هلأء ؟ أي موقع هدا بسمح لتعليقات مخزية هيك , عيب عليك يا عشرينات<br />انكم هيك تسيبو الناس مفلوتين يعملو اللي بدهم ياه , بعدين يا اردنيين يا خرى يا كلاب يا معفنين يا زبالة العالم كلها شو دخلكو<br />بالموضوع يا حكراء ؟؟ الموضوع بحكي عن ايام فلسطين وذكريتها , شو دخلكو يا متعرصين تتكلموا وتجيبو سيرة فلسطين بالعاطل<br />ورب الكعبة بدي بس اشوف اي اردني بعد هيك يسب فلسطين والله لاسلخ جلدو<br />ونتا يا محمد نواف عامل حالك ازعر يا كلب يا واطي يا ساقط يامبلغم مشرشح بس خليني اشوفك بعد هيك بتخش هونه سيعتها<br />لانسفك والعن شرفك واكون ماسحك من وجه الارض يا بعيد يا خسيس ..........<br />وعلى العموم انا فلسطيني وبفتخر وانا احمل الجواز الاسرائيلي النجس , لكن شو بدي اعمل هيك الحياة وبدنا نمشي حالنا"
