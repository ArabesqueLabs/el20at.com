subject = "مهـــــــــــــــــــم اقرئووووو (عليك اللعنة يا اردن )"
author = "داعس ع راسكم"
text = "اللعنة عليكي يا اردن مسخ يمسخك ............هههههههههههههههههههههه.............. ولكم يا ارادنة يا jordan يا جرادين قبل ما تيجو تتفلسو تعالو ضبو خواتكم ولكم خواتكم عفنو خضرو صار لونهم اخضر من المنيكة بستحوش اعوذ بالله منهم شيلوهم و انتا يا اردني ولك كم مرة بدي احكيلك انووووو دير بالك ع اهل بيتك بكفيهم شرمطة لونك زلمة كان ما خليتهم يشرمطو بس انتا مرة حكتلك انو اسم ايميل اختك koesy_mole3@hotmail.com يا مسخرة يا مضحكة و للأخ الســــــــــــــعودي هدول الاردنيين انذال شاطرين بس بالمن و همي عم بهتو عليناااا قال شو افضال و انتا شايف بعينك اول رد مكتوب من واحد اردني دليل على حقارتهم و نذالتهم همي اللي بلشو اكبر دليل على الخنزرة و الحقارة تبعتهم بدهم يذلونا قال افضال يا خنازير يا اردنيين انتو ما بتعرفو كيف الكلاب ع جسر الاردن بعاملو الفلسطينية والله اسرائيل احسن منهمم بطل فيكم خير والله فشرتو ننذل لإلكم تفو عليكم روحو واحد واحد"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 177
subject = "شفتــــــــــــــــــــهم بعيـــــــــــــيني"
author = "bb"
text = "ولكم انا بسافر الاردن الملعونة و بروح ع فلسطين يا كلاب و يا ريت في طريق تاني اقدر انط منو و ما ادخل ع الاردن ع السريع ع فلسطين الــــــــــمهم : لما نزلت من المطار حتى ولادين الكلب اللي مش شايفين اشي تبعون المطار حمالين الشنت الكلاب شفتهم بنص عيني بعاكسو بالبنات همي رايحين يشتغلو ولا يعاكمسو يلعن ابوهم بكندرة دليل على النورنة تاني اشي لما اجيت مرة بالسيارة على الاردن و طبعا النمرة تبعتها نمرة دولة من الخليج اقسم بربي الهمج قعدوا يركدو ورا السيارة زي اللي مش شايفين اشي والله انو منظر مخزي فضيحة عشنو نمرة السيارة لدولة برا يا همج تحكوش بلاش افضحكم اجيت كتير و شفت كتير"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 178
subject = "احــــــــــــــــــــــلى تحيـــــــــــــــــة"
author = "مشجع الفلسطينين"
text = "احلــــــــــى تحية للتنين اللي فوقي و (انقـــــــــــهر يا اردنــــــــــــي) طز فيك عشانك يا خرة بعتت التحيات عشان تموت<br />هي اغنية لعيونك: عزاب و هم و توتــــــــــــــــــة توتـــــــــــــة هاي الاردن اخت منيوكة<br />رد عليهم يا مرا يا خرى<br />......................... ووالله كل اللي حكو صح صدق بصدق شواهد شافوهم بعينهم مش زيك تأليف انتا اساسا من الحاوية جابوك مش شايف اشي بحمد ربي والله بصلي كل يوم ركعتين اني مش اردني ههههههه"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 179
subject = "رسالة إلى الأخ العزيز : سعودي وأفتخر"
author = "ابن فلسطين"
text = "شكرا جزيلا لك يا اخي سعودي وأفتخر , وبارك الله فيك , على القليلة أهل السعودية البدو هما أهل الكرم والجود والفضل بصراحة<br />, أنا لما إجيت عمرة بالسعودية , كان واحد من أقاربي في السعودية وعزمني عند واحد سعودي من أهل الرياض , والله كانوا جدا محترمين وفيهم النخوة أكتر من الأردنيين الخرة , وعلى فكرة أنا بقول الله يخلي السعودية ويحفظ أهلها من كل شر ومكروه , والله ياخد الأردن أخد عزيز مقتدر , وأنا بقول للأخ سعودي وأفتخر إنه كل اللي عملوه الأردنيين الاصل في وادي رام من إكرام كله رياء وسمعة , ولا هما من أكبر وأوسخ المنافقين في العالم كله , وفعلا جرى الإعتراف على لسان الملك فهد الله يرحمه ويجعل داره ومثواه الجنة إنه أغلب العمائر والمباني في السعودية وبخاصة في مدينة جدة أغلبهم فلسطيينيين , وهدا شرف إلنا , واللي بنى الأردن كلهم فلسطينيين , فليش جلالة الملك الحيوان عبد الله بن الحسين الثاني المعظم ما بعترف إنه الفلسطينيين هما اللي بنوا وعمروا الأردن ؟؟؟ ليش ؟ عشان تعرفوا إنكوا أكبر ناس بتنكروا الجميل , وحسبنا الله ونعم الوكيل , وفلسطين حبيبة على كل قلوب الناس , إلا إنتوا اللي قلبكوا أسود معفن , والحمد لله رب العالمين , والفلسطينيين تارج راس كل الأردنيين مهما<br />طال الزمن ورح يضلوا الفلسطينيين بالأردن داعسين على رقابكوا ومستوطيين حيطتكوا إن شاء الله"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 180
subject = "واااااااااااااااااااااااااااااااااااااااااااااااال"
author = "لهلهلهلهلهلهلهلهلهلهلهلهلهلهلهله"
text = "الأردنيين فعلا هما عبارة عن مجموعة من الخرا مخرية متخرية بخرا مخري بخرا , فعلا وهو هدا الصحيح وأنا بدي تقروا التقرير العلمي الغربي الغريب لأنه فيه فضائح وبلاوي كبيرة وفضيحة كبيرة بشرف الأردنيين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 181
subject = "بدي أوجه شكري الجزيل إلى كل من : بنت فلسطـــــPــــين و bnt flsteen-R-yaay"
author = "عاشق فلسطين"
text = "شكرا كتير حبايبي والله يسعدكم ويخليكم وأن بحطكوا على راسي , فعلا هدا الكلام اللي حكيتوه هو الحكي اللذيذ والحقيقي لهدول الأردنيين المتخلفين الخرة , وعلى راسي كل فلسطيني صامد , وعلى راسي كل فلسطينية صامدة , والله يقوينا لتحرير بلدنا<br />فلسطين الحبيبة الغالية العالية فوق خنافير الخرفان الأردنيين الأصل"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 182
subject = "طريقة ممتازة جدا لإثبات وجود التخلف في الأردنيين الأصل"
author = "عاشق فلسطين"
text = "هناك طريقة ممتازة جدا لمعرفة كيفية وجود التخلف في الأردنيين الأصل , حبايبي الكرام (الفلسطينيين) بدكوا تعرفوا التخلف في<br />الأردنيين الأصل : اطلعوا على وجوههم مضبوط وخاصة بين الحاجبين , رح تلاقوا فيه بعض علامات التخلف , خاصة إزا كانت الحواجب<br />اللي فوق عينهم اللي زي البومة موصلة مع بعضها وشكلها زي القوس , وتانيا اطلعوا من تحت عيونهم برضوا , إزا شفتوا السواد<br />مكحول بلون أزرق هيك , اعرفوا إنه هدا هو التخلف , وبهيك بتثبت التخلف الموجود في الأردنيين الأصل<br />(((((مــــــــــــــــنــــــــــــــــــــــــــــقــــــــــــــــــــــــول للــــــفـــــــــــائــــــــــــــــــــــدة)))))"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 183
subject = "وهناك عدد كبير من يتصفون بهذه الصفة"
author = "عاشق فلسطين"
text = "أولهم طبعا محمد نواف الحمدالله وتانيهم الأردني وكل الأردنيين الخرة الموجودين هون كلهم مثبت فيهم التخلف بهده الطريقة , مع إني والله ما بحب أتريق على خلقة الله سبحانه وتعالى جل في علاه"
archived = "2009-04-05"
