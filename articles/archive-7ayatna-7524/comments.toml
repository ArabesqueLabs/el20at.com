text = "للاخ الاردني انت بتحكي انو كل واحد الو الحق يعتز بوطنو .. طيب انت ليش زعلان<br />و انت اكيد صاحب التعليق الي ما بينقرا في موضوع الرباط<br />بايش مزعلك و منرفزك اسم فلسطين عشان تفط ما تحط كل ما تقرا اسمو بموضوع؟<br />عمان حلوة و الله يسلمها لاهلها بس بلاش عنصرية عالفاضي ... و الادب مطلوب انت كاتب اردني يعني تعليقك رح ينسب للاردنية بلاش يفكرو كل الاردنية متلك"
