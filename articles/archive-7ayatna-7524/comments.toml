subject = "مشكور يا ابن الاردن بس كل واحد بيحكي باصله"
author = "فلسطيني اردني"
text = "لو سمحت يا شباب فلسطين ما حدا يجاوب هذا التافه؟؟<br />كل واحد بحكي باصله وهذا التافه بجوز والعلم عند الله انه اختو مجوزها واحد فلسطيني<br />ما حدا يجاوبه أكيد أكيد الفلسطيني بصرف عليه وعلى اختو ههههههههههه<br />ولك عيب عليك تحكي على اسيادك يا اردني يا تافه<br />ولك انا عايش بالاردن بس بشوف كل الاردنيين محترمين بس انت وانا متاكد انك ابن زناااااا والعياذ بالله<br />بس شو من نقول مشكور يا تافه!!!<br />اذا احنا الفلسطنية خواتنا شرموطات شو من نعمل خواتكم علموهم انحق علينا احنا اللي منستر على خواتكم بس خلص بدي ارد اقول يسلمووووووووووو كتير على حكيك اللي متلك ومتل اهلك يا تافه<br />انا ما بدي اسب لانو احنا الفلسطنية مو متلكم مع احترامي لبعضكم لانو بعرف قيمت الاردنية اللي علمتكم توكلو وتشربو ولك ما انتو ما كنتو تعرفووو شو الاكل<br />اسئلك انت يا تافه تعرف شو السكلوب؟<br />اكيد ما بتعرفه لانك ما شفتو على( ) امك<br />لأ يا حبيبي مو زي ما بتفكر<br />هدي اكله احنا الفلسطنية منحطها لاختك علشان تصيررررررر راقيه؟ههههههههههههههههههههههه<br />يسلمووووووووووووو يا طيززززززي على حكيك عنا<br />وانا وكل فلسطين منقولك يسلمووووووووووووووووو<br />وكمان ما تنسى كس اختك<br />هاهاهاهاهاهاهاهاها<br />(باي يا طيزي سلام يا طيزي)<br />هاهاهاهاهاها"
