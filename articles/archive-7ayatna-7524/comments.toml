[[comments]]
order = 361
subject = "إمارات زايد ضاقت بالخوانية الفلسطيزيين"
author = "إماراتي والنعم"
text = "من يوم يومهم هالفلسطيزيين الخوانية المخانيث وهم سارقين بلدنا كس امهم على ام اللي يلحس ريولهم العفنة وعزك دام يالاخو الأردني اللي ماسح بكرامتهم الأرض ويالاخو السعودي اللي سماهم فلص وحتى الفلص وايد عليهم وعلى بو اللي خلفوهم ، والله العلي العظيم لو شوف فلسطيزي خواني ولد قحبة بنيج امه واخته ولاد القحبة لمن قتلوا الشهيد سيف غباس كس امهم وكس اختهم ويلعن ابوهم واحد بواحد ، ولو هم رياييل يطلعوا من الامارات ويردوا لفلسطيز مالتهم بلا ما هم سكارى وشمامين هيروين ومحسبين روحهم ف بلدهم يسبون كل الجنسيات الثانية والمدارس ضاقت من حقارتهم ولاد الخوانية القحاب .... وبسلامة كل نظيف ماسح فيهم الأرض ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 362
subject = "فلسطين عروس العالم"
author = "عيسى"
text = "اعلم ايها العربي اينما تكون..واعلمي ايتها العربية اينما تكونين..بان فسطين وشعبها الجبار المكافح المجاهد المدافع عن كرامة العرب باكملهم ..الذين سطرو بدمائهم ارض فلسطين والعراق ولبنان وسوريا والاردن وافغانستان وكل مكان عربي..الذين وقفو في وجهة الغرب بقيادة اسرائيل وامريكا..الذين تكلموا وهتفو وصرخوا ووقفو بكل ما يملكون لكن..الخيانة العربية وتامر العرب على شعب لم يتجاوز الستة ملايين نسمه هذا الشعب الذي اشغل العالم باكمله ففي اي بلد تسمعهم يتكلمون عن فلسطين وجميع الانظار تتجه الى فلسطين وشعبها..هذا الشعب وهذه الارض التي باعها حكامنا لليهود بدا من الاردن وعلى راسهم الملعونين في تربهم المسمى الشريف خسين وابنه حسن لعنة الله عليهم الى يوم الدين وحتى ملك السعودية..فكلكم خائنون وكلكم عملاء للغرب..فمن منكم يدين او يستنكر اي عدوان الا بموافقة امريكية اسرائيلية...من المفروض انتم يا من تكتبون هنا عن الشعب الفلسطيني..وعن فلسطين...ايها الاردنية لولا الشعب الفلسطيني لما كانت لكم دولة..من المفروض منكم ان تكتبو وتشتمو حكامكم الذين باعو الارض واصبحتم انتم عبيد لهم ولغيرهم..من منكم يستطيع ان يتكلم ..من منكم يستطيع ان يقف في وجه ملكه ويقول له بانك اخطات من نمكم يستطيع ان يعارض الحكومه من ومن ومن..انك كالارانب في جحورها..كل ما تستطيعون عمله هو فقط..ان تاكلو وتشربو وتناموا ..ان تعملو جاهدين على احياء الحفلات الليله التي ينتهك فيها العرض والشرف والدين..كل ما تستطيعون عمله وقوله ان تقولو سمعا طاعة ايها الملك حتى لو كان القرار على حساب الكرامه والشرف والعرض والدين..<br />انكم لا تفقهون غير ذلك.بل الجبن فيكم والخيانة في دمكم..وحقدكم على فلسطين ياتي من منطق القوة التي يتمتع فيها الشعب الفلسطيني داخل المخيمات وسيطرته اقتصاديا على الاردن..حيث انه يحرم عليكم دخول المخيمات الفلسطينية<br />وان الشعب الفلسطيني شعب لا مثيل له..فالحقد نابع من الغيرة لان الشعب الفلسطيني يسكن في اجمل واحلى وتقدس منطقة بالعالم كله منتصف الكرة الارضيه فوقها باب السماء وشهيدها باربعين شهيد وشعبها شعب جبار من ولا شيء يصنع المستحيل ويصنع المعجزات ويفعل ما يريد بلا اي مانع او عائق........<br />كل الشكر للشباب فلسطين الذين يقفون هنا امام تلك الكلمات معلنين تحديهم للجميع بانهم شعب واحد رغم الخلافات"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 363
subject = "إلى كل إماراتي"
author = "يوسف البحيصي ( فلسطيني و مثل الصقر يصعب اصطيادي )"
text = "إلى إماراتي أقسم بالله انك ولد حرام و ابن كلب و ابن زناة أنا ما بسب كل الإماراتيين على شان شيخكم زايد كان رجال زين و رجال عدل بس انت الصراحة ولد حرام<br />ولولا الفلسطينيين اللي في الإمارات ولا عمركم بتتعلمون و لا عمرها الإمارات استوت من أصله الفلسطينيين يا إماراتي مفظلين على كل الناس و في أي مكان و غصب عن الجميع<br />و بذكرك لولا الفلسطينيين لم يعمروا بلدكم انت بتكون في عمان و لا في اليمن مافي معاك ولا درهم<br />و بعد انت ليش حاقد عالفلسطينيين أكيد الفلسطينيين ناكوا خواتك و أمك و ناكو كل بنات قبيلتك يالكلب يا ولد الحرام<br />أكيد أنا مـتأكد إنهم زاغبينك يالظانة<br />يللا اقلب و جهك ولا تكتب بعد تتعليق هني لإنك موب قد الكلام اللي يستوي هني<br />و لولا الفلطسنيين انتم بتموا ورا البعير يا كلب<br />و انتا أصلك عماني و لا يمني معفن شليت الجواز الإماراتي و استغنيت عن أصلك يا قليل الأصل<br />و سلام الله على الفلسطينيين و لا سلام على الأردنيين يهود العرب لإنهم ليسوا على ملة الإسلام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 364
subject = "إلى كل فلسطيني"
author = "يوسف البحيصي ( فلسطيني و مثل الصقر يصعب اصطيادي )"
text = "حياكم الله يا شباب فلسطين أينما كنتم<br />حياكم الله من بلاد الكفاح و الصمود<br />حياكم الله يا شباب فلسطين<br />ارفعوا رؤوسكم فنحن شعب لم يعد يخشى الردى أو يبالي برصاص أو حديد<br />نحن الشعب الجبارين<br />ارفعوا الرايات<br />ارفعوا الهامات<br />أنتم الشعب الصامد أمام كل شيء<br />أمام مدافع الدبابات<br />أمام زناد الأعداء<br />و أمام و أمام<br />ارفعوا رأسك فأنت فـــــــــــــــــــــــــــــــــــــــــــــلـــــــــــــــــــــــــــــــــــــســـــــــــــــــــــــــطـــــــــــــــيـــــــــــــــنــــــــــي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 365
subject = "إلى ابن الزناة محمد نواف"
author = "يوسف البحيصي ( فلسطيني و مثل الصقر يصعب اصطيادي )"
text = "وينك يا أخو العايبة يا أخو الزانية يا محمد نواف<br />يا جباااان فعلا انك اردني انا مش مستغرب انك خايف لإنو الخوف من صفاتكم يا كلب يا ابن الحرام<br />وينك بطلت تكتب يا هامل<br />على كل حال عارفك أردني هامل معلش معلش<br />و سلام الله على كل من هو عربي أصيل و فلسطيني و لا سلام على من هو أردني من يهود العرب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 366
subject = "رسالة شكر للأخ : يوسف البحيصي , والمحترم الأخ إماراتي والنعم بلاش عنصرية وكلام فاضي"
author = "عاشق فلسطين"
text = "السلام عليكم ورحمة الله وبركاتو , طبعا أنا ما كنت متوقع إنو الإماراتيين يعملوا هيك , لكن تبين إلي إنو كل الخليجيين بصفة خاصة<br />والعرب بصفة عامة بكرهوا الفلسطينيين , لكن على كل أنا ما بهمني , يكرهوا فلسطين والفلسطينيين , لكن تذكروا إنو الحمد لله<br />الفلسطينيين لما بروحوا أي دولة في العالم برفعوا راس هاي الدولة اللي هما عايشين فيها , وأقرب مثال الأردن , ثم الإمارات يا أخي إماراتي والنعم , لكن لا مشكلة , وأنا والله مش زعلان , ورح أبطل السب والشتم , بدي أصير عاقل , على كل , إحنا مش مشكلة خلي الكل يكرهنا , وأنا متأكد بأنو كل اللي بصير بفلسطين كلو من تآمر العرب وحسبي الله ونعم الوكيل , هيك إنتوا نفسكوا تنتقموا منا , ليه مش عارف , حبيبي أخي إماراتي والنعم : روح احكي لأمير الإمارات تبعكو إنو يرحل كل الفلسطينيين من الإمارات وخلاص , أغلب رجال الأعمال عندكو فلسطينيين , هيك ولا لا , وهده قناة سما دبي حكتها بكل وضوح , لكن كل العرب<br />بنكروا جميل الفلسطينيين , والحمد لله رب العالمين , يعني أنا بصراحة تعاملت مع إماراتييين بجامعاتنا بالأردن , لكن مش بأسلوبك الحقير النتن المعفن , بس ممكن كلها تبادل مصالح , على كل آخر كلمة إلي :{الأعراب أشد كفرا ونفاقا} وبارك الله فيكم أجمعين<br />وشكرا لكل حبايب قلبي الفلسطينيين والفلسطينيات اللي شاركوا هون , أنا بعد هيك مش رح أخش هون بعد هيك , بسبب<br />الإمتحانات هلأ المتراكمة علي , ولكن برضوا حتى بعد الإمتحانات , مش رح أخش هون نهائيا , لأني تعبت , وهالأردنيين جابولي<br />الطققان والفقعان ووجع الراس , بكفي هيك , وبنصحك أخي يوسف البحيصي إنك لا تعب حالك مع هدول البجم الهمج النور<br />الغجر المعفنين المنحطين السفلة الكلاب الأندال الساقطين الحقرا المخريين المخزيين المتفوف عليهم والمدعوس عليهم ليل نهار بجزم الفلسطينيين , هما عارفين حالهم جبنا , لكن بس مرجلتهم من ورا لورا , من ورا الكمبيوتر قصدي , بس , هاد هو سلاحهم , لكن مش هيك المرجلة , وشكرا لكم والسلام عليكم ورحمة الله وبركاته ........................................"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 367
subject = "إلى ولد القحبة يوسف البعيصي"
author = "إماراتي والنعم"
text = "اسمع يا ولد الخوانية القواد يوسف البعيصي قسم بالله لو بشوفك بنيجك ونيح اختك جدامك يا الكلب انت والفلسطيزيين الخوانية الحقيرين ، أنا إماراتي أصل وفصل ومن قبيلة كبيرة بعد ، واليمنيين والعمانيين اللي تسب عليهم أنظف وأشرف من الفلسطيزيين القواويد الكلاب اللي يحسبون روحهم في بلدهم ويغلطون عالكل ولمن يشوفون واحد ويسلوه عن جنسيته يقولون له: احسن منك انا فلسطيني قصدي فلسطيزي ، كس امكم واحد ورا واحد يالخوانية القواويد وحط هالبعصة في طيز امك يالبعيصي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 368
subject = "إلى ابن الزناة إماراتي و الميت طز"
author = "يوسف البحيصي ( فلسطيني و الكل مني مقهور )"
text = "يا إماراتي يا ابن الزناة يا ابن القوادة كما قال عاشق فلسطين أنهم أغلب رجال الأعمال في الإمارات فلسطينين<br />و الدليل على ذلك قناة سما دبي حقتكم<br />و بعد يا ولد المنيوكة علموك الفلسطينيين البعص و ما البعص أكيد بعصو أختك الفلسطينيين أسيادك و ناكوها عشان هيه قحب و تشتهي زباب الشباب و الله لو أشوفك لأنيك أختك القحبة بس انا بخاف يكون معاها الإيديز من كثر الزباب اللي دخلو كسها ( عيزها ) يالكلب أقسم بالله انك واحد مستغني عن بلدك واطي<br />إذا انتا مستغني عن أصلك الواطي و أنا بفتخر في أصلي اللي يرفع الهامات و الرؤوس إيش دخلك تحقد على أصحاب الهامات المرتفة ( الفلسطينيين ) أكيد سوو لكل بنات قبيلتك أشياء و أشياء<br />ياخي أقسم بالله لولا الفلسطينيين ولا عمرك بتدخل هذه البلد اللي انتا فيها<br />و أنا ما بسب على الإماراتيين على شان الشيخ زايد صاحب اليد البيضاء<br />و السلام على كل من هو فلسطيني و لا سلام على من هو حاقد على كل فلسطيني لإنه ليس على ملة الإسلام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 369
subject = "إلى اين تسير الأمة اليوم ؟ السؤال يطرح نفسه"
author = "عربي مسلم"
text = "بسم الله الرحمن الرحيم .. وبه نستعين .. ولاحول ولا قوة إلاّ بالله العلي العظيم .. والصلاة والسلام على أشرف الخلق والمرسلين .. محمد صلوات الله عليه وسلم ..<br />أما بعد ،،،<br />بداية ..<br />إلى كل شخص عرف معنى الحرية والصدق والعدالة .<br />إلى كل شخص ذا عقلٍ ودين وخلق .<br />إلى كل شخص يغار على شرفه وعرضه وكرامته .<br />إلى كل شخص فكر بعقله قبل عواطفه .<br />إلى كل شخص عرف معنى الإحترام والتقدير .<br />إلى كل شخص كانت أفعاله تسبق أقواله .<br />إلى كل شخص أراد أن يحيا ويعيش بشرف وعزة وكرامة .<br />إلى كل شخص أراد أن يعم السلام والخير والحب .<br />إلى كل شخص عرف قيمة الحياة ومعناها والأهم من ذلك كله \\\" كيف يعيشها \\\".<br />إلى كل شخص عرف قيمة ومعنى الحياة فهنيئاً له ..<br />إلى كل شخص يملك الرجولةوالشجاعةوالخوف \\\" عند السيطرة عليه \\\" .<br />إلى كل شخص أراد \\\" فعلاً \\\" أن يكون إنساناً بحق .<br />أخواني هذه بضعاً من الجمل الجوهرية التي أأمئن بها وأضعها دائماً نصب عيني لإنني واثق بأننا كلنا بشر وكلنا معرضون للخطأ ومن منا لا يخطأ ؟ أولا ينسى ؟ فخير الخطأوؤن التوابون وهذا ليس بمبرر أن يخطئ الإنسان دائماً .<br />أخواني سوف اكتب كل مافي داخلي لأبرء ذمتي فقط لاغير ,<br />لقد انفعلت انفعالاً لدرجة لايتوقعها الجميع بحيث لايمكن للجميع تصورها أو تخيلها ( والله على ما أقول شهيد ) .. لقد استشاط غضبي كثيراً وكثيراً وماعدت أتمالك نفسي فقلت في بادئ الأمر لعل المعضلة تنتهي عند تعليق أو تعليقين وتتنتهي الأزمة بعد ذلك لكن هيهيات أن تنتهي ( منذ البداية ) والكل مسؤول عن هذه المشكلة سواء أكان أردنياً أو فلسطينياً أردنيةً أو فلسطينيةً فالكل مسؤول،إلقاء التهم وتلفيق الكلام لغير كاتبه يعد حجة وسند ضعيف لا أساس له من الصحة بغض النظر عن الذي بدأ بالمشكلة فهذا لا يهمنا ولا هو من جوهريات حوارنا ونقاشنا<br />فالأهم من ذلك كله هو كيفية حل تلك الأزمة .. والخروج منها بحل يرضي جميع الأطراف دون الإقتصار على إرضاء طرف وإهمال الطرف الآخر ( وكأنه زيادة في العدد فلا يؤثر ) لا يا أخوان والله إنني حزين وكئيب فقد سكن اليأس والإحباط قلبي بعد قرآتي لجميع التعليقات ( سؤاء أكانت التعليقات منسوبة لأهل الأردن أو لفلسطين ) . والله ياأخواني صعقت وفجعت من التعليقات المدونة أعلاه. ياأخواني ماهكذا يكون الإنسان العربي المسلم الشريف الحر الذي يعرف معنى الإنسانية بأدق تفاصيلها وماهكذا يكون الإنسان العربي المسلم الشريف الحر عند سبه وقذفه وشتمه لأخوه الإنسان وماهكذا يكون الإنسان العربي المسلم الشريف الحر عند تحميل أخوه الإنسان فضائل وجمائل هي بالأساس من عند الله وما هكذا يكون الإنسان العربي المسلم الشريف الحر عند سبه لشرف وعرض أخيه الإنسان بلا سبب أو مبرر !<br />أخواني خلاصة قولي : حكموا عقولكم وضمائركم .. حكموا أنفسكم وروحكم .. قبل أن تتفوهوا بأي كلمة .. وليس فقط بكلمة لا بل بحرف فقط !<br />أرجوكم ورجائي حار لكم يا أخواني فما عدت قادراً أن أرى تعليقات كتلك التعليقات ( .............. )<br />أتمنى للجميع التوفيق والسداد دنيا وآخرة<br />أرجوكم<br />والسلام عليكم ورحمة الله وبركاته ,,,<br />عربي مسلم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 370
subject = "إلى كل من يحقد على الفلسطينيين تيجان رؤوسهم"
author = "يوسف البحيصي ( فلسطيني و الكل مقهور من )"
text = "إخواني أخواتي إن كل فلسطيني على هذه الأرض فلإنه تالله منصور بإذنه تعالى<br />و لكن بعض الشعوب تتساءل لماذا بعض من العرب يكيدون منهم ؟<br />و ذلك لإن الشعوب العربية الآخر مغراة بالأجانب و الغرب<br />و لأن الغرب زينوا لكم الحياة الدنيا و ضحكوا على عقول كل العرب عدا الفلسطينيين و القليل من الشعوب و الناس العرب<br />لماذا بعضكم علينا حقادا و نحن الفلسطينيون أهل الرباط و الجهاد<br />أهل الفداء و التحرير أبناء القدس الشريف أبناء القدس الشريف<br />لماذا ؟<br />لماذا ؟<br />بالتأكيد سيكون جوابي أن الغرب أخذوا عقولكم و لعبوا بها يحركونها يمينا فتتحرك يمينا يحركونها شمالا فتتحرك شمالا و كأنها الكرة<br />فيقوا أيها العرب إلى متى أنتم نياما إلى متى أنتم ستحقود على الفلسطينيين إلى متى ستظلوا عملاء الغرب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 371
subject = "سورة الفلسطيزيون (سورة فلاحية وآياتها تسع عشرة)"
author = "قرآن رابسو الكريم"
text = "ف ل س (1) ط ي ز (2) الفلسطيزيون (3) ما الفلسطيزيون (4) وما أدراك ما الفلسطيزيون (5) قوم مجرمون (6) بالناس غادرون (7) وللعهد ناكثون (8) تبت يدا أبي عمار وتب (9) ما أغنى عنه ماله وما كسب (10) سيصلى نارا وخراء ذات لهب (11) وامراته سها البغية حمالة الحطب (12) في جيدها عقد من لؤلؤ وألماس وذهب (13) يا أيها الذين آمنوا لا تتخذوا الفلسطيزيين أولياء ومن يفعل ذلك فقد خسر خسرانا مبينا وضل ضلالا بعيدا (14) وقال الفلسطيزيون يا عرب إننا لن ندخل قطاع غزة ما دام اليهود فيها فاذهبوا أنتم وربكم فقاتلوا إننا ها هنا قاعدون في الخليج نخزن الأموال والذهب الرنان ونشرب الجعة والخمر المعتق (15) لن ترضى عنك الفلسطيزيون ولا السفلة حتى تتبع ملتهم والله عليم حكيم (16) وقال الفلسطيزيون إن صدام حسين هو حامي البوابة الشرقية للوطن العربي ذلك قولهم بأفواههم يشابهون الذين أكلوا خراء لعنهم الله بكفرهم أنى يؤفكون (17) لتجدن أشد الناس عداوة للذين آمنوا الفلسطيزيين والذين أشركوا ولتجدن أقربهم مودة الذين قالوا إنما الفلسطيزيون فتنة فلا تقربوهم والله غالب على أمره ولكن أكثر الناس لا يعلمون (18) ولا تحسبن الفلسطيزيين الذين قتلوا في الضفة الغربية أموات بل أحياء في نهر الأردن يسبحون (19)"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 372
subject = "الله يلعنك ويلعن اللي جابك هون يا كلب"
author = "عاشق فلسطين"
text = "الله يلعن شرفك وعرضك يا محمد نواف الحمد الله , انظروا يا إخوة كيف وصل به أن يكفر ويحرف بآيات الله عز وجل , وكأن الدين لفلسطين وللفلسطينيين , الله يلعنك , صدقني رح أبلغ الجهات المعنية , أخليهم يجيبوك ولو بالإمارات يا كلب يا واطي<br />عشان أورجيك كيف تتريق , ومسميها سورة الفلاحية , مو مشكلة مو مشكلة , {ولا تحسبن الله غافلا عما يعمل الظالمون , إنما يؤخرهم ليوم تشخص فيه الأبصار} مش ربنا قال يا إخوة : {الأعراب أشد كفرا ونفاقا} وهدا محمد نواف الحمد الله يا إخوة , وهو اللي بعمل هيك , وهو بدوي وشراري في نفس الوقت , يعني البدو ناس ما بخافوا الله يانااااااااااااااااااس لا تنخدعوا فيهم , حسبي الله ونعم الوكيل , وصلت فيك الجرأة إنك تتطاول على رب العالمين بس عشان تسب الفلسطينيين , لكن ماااااااااااااشي ونهايتك رح تكون على إيدي يا محمد نواف واصبر علي بس , والله لأوريك وأشرشحك يا كلب يا واطي ................."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 373
subject = "كلمة ختامية ووداعية"
author = "عاشق فلسطين"
text = "السلام عليكم ورحمة الله , أنا هلأ بسبب الإمتحانات الجامعية , رح أضطر يمكن أسيب الإنترنت تلات أسابيع وبعين الله , بس على كل بدي أشكر كل فلسطيني وفلسطينية هون شاركو في تفحيم وتحطيم وتكسير وحرق الأردنيين البجم , ولكن نصيحة مني ونصيحة مني لك يا أخي العزيز الغالي يوسف البحيصي وإنتا فعلا إنك صقر , بنصحك أخي بأنك لا تخش هاي الصفحة ولا تعب حالك مع هالأردنيين , لأنك والله مهما عملت معاهم ما رح يجيب نتيجة , وأنا بنفسي خلاص حلفت على حالي إني ما أخش هاي الصفحة نهائيا لأنها القصة صارت مهزلة ومسخرة بجد يعني , وبارك الله فيكم أجمعين , والله يجمع شملنا ووطنا من القطاع للضفة ويافا وحيفا وكل أراضي فلسطين المحتلة , ولا تنسوني من صالح الدعاء , لأني بأمس الحاجة إليها , وشكررررررررررررا لكم (للفلسطينيين فقط) والسلام عليكم ورحمة الله وبركاتو ..................................<br />توقيعي الأخير : عاشت فلسطين >;>;>;>;>; من الفاء للنون , ومن النهر للبحر<<<<<<<"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 374
subject = "إلى ابن الزناة ابن العارية"
author = "يوسف البحيصي ( فلسطيني و مثل الصقر يصعب اصطيادي )"
text = "لعنك الله و لعنك الللاعنون لو أنت قد فعلتك هاي بتكتب اسمك<br />و لهدرجة انتم حاقدين عالفلسطينيين ولك ربنا و الرسول قال عنا نحن القوم الجبارين<br />لهدرجة انت حاقد يا ابن الزناة<br />و الله نحن المنصورون بإذنه<br />انت يا كلب بس توصل ل التراب الذي يعلق برجل الفلسطيني<br />يا ابن الزناة تبوأ مقعدك من النار<br />إذا كذبت على رسول الله متعمدا فتبوأ مقعد من النار فكيف على الله<br />تالله هذا هو الحقد<br />حقدك مثل حقد أبا جهل و أبا لهب<br />أنت و الله مذموم<br />و لماذا تفعل الفعلة و لا تكتب اسمك<br />هذا ليس من شيم الرجال<br />و الصراحة أول مرة أشوف واحد بحقده لهذه الدرجة توصل معاه بس أكيد الفلسطينيين ناكو أختك و أمك و عرضك<br />و لا أريد الحلفان لإنه شيء أكيد من درجة الحقد اللي انت فيها<br />و السلام على كل من هو فلسطيني و لا سلام على من هو حاقد على أي فلسطيني لإنه ليس على ملة الإسلام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 375
