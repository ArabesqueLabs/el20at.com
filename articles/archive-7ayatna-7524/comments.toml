subject = "\\\"الشريف\\\" حسين بن علي والأصول اليهودية"
author = "عرب تايمز"
text = "هذه صورة رجل تركي ينحدر من جدة يهودية تزوجها \\\" محسن \\\" وانجب منها ابنه \\\" جدعون \\\" الذي يعرف بين العرب باسم \\\" عون \\\" ومنه انحدرت الأسرة الهاشمية التي حكمت في العراق والأردن والحجاز ...واليهودي كما هو معروف ينسب إلى أمه ... فابن اليهودية حتى لو كان أبوه عربيا أو مسلما يعتبر وفقا للديانة اليهودية يهوديا ... هذا الرجل اسمه \\\" حسين بن علي \\\" ويلقب بالشريف لانه تولى الإشراف على الحجاز بتوصية من ضباط حزب الاتحاد والترقي التركي وأكثرهم من اليهود .<br />هذا الرجل هو الذي تقدمه كتب التاريخ في المدارس الأردنية على انه بطل \\\" الثورة العربية الكبرى \\\" ... فمن هو هذا الرجل ... وما حكاية هذه الثورة ؟<br />أنهيت تعليمي الثانوي في مدرسة أردنية تتبع قسم الثقافة العسكرية في الأردن اسمها \\\" الثورة العربية الكبرى \\\" وكنت الأول على جميع مدارس الثقافة العسكرية في المملكة في امتحانات التوجيهية \\\" الثانوية العامة \\\" ... و\\\" الثورة العربية الكبرى \\\" يقصد بها الحركة التي قام بها شريف مكة حسين بن علي ضد دولة الخلافة الإسلامية بالتواطؤ مع الإنجليز وبقدر ما كانت أجهزة الإعلام في الأردن تتغنى بهذه المناسبة وبطلها بقدر ما كان تجاهل سائر الدول العربية لهذه المناسبة يدهشني بل وتغص كتب التاريخ الصادرة في الدول العربية بالكثير من الاتهامات لحسين بن علي والتي تبدأ بتخوين الرجل وأولاده ... وتنتهي بتحميل ذريته مسئولية ضياع فلسطين .<br />خلال حرب الخليج أطلق الملك حسين لحيته ولقب نفسه بالشريف حسين تيمنا بجد أبيه وقيل يومها أن صدام حسين وعد الملك حسين بإخراج السعودية من الحجاز واعادة تسليمها إلى الملك حسين على اعتبار أن الملك عبد العزيز آل سعود هو الذي طرد الهاشميين من الحجاز وقضى على طموح جدهم الحسين بن علي الذي وعدته به إنجلترا وهو أن تقوم بتعيينه ملكا على العرب إن هو ساعدها في القضاء على الخلافة الإسلامية .<br />كان مصدرنا لما يسمى بالثورة العربية الكبرى في الأردن مجموعة كتب وكراسات وضعها رجل ارزقي اسمه سليمان الموسى ... ومن يقرأ كتب هذا الرجل عن الحسين بن علي يخالجه شك بأن المذكور كان نبيا أو مبعوثا من السماء وأن صفات الفروسية والنبالة التي يتسم بها تخرج عن طاقة البشر وتقترب من صفات الالهة فعلا .<br />لكن خروجي من الأردن ... واطلاعي على مراجع تاريخية عربية وأجنبية محترمة عن الثورة العربية الكبرى وبطلها الحسين بن علي ... وتصفحي لوثائق المخابرات البريطانية السرية التي افرج عنها والتي تتعلق بالمذكور أصابتني بالدهشة ... والحزن ... لان حجم التزوير في التاريخ الذي يدرس للطلبة في المدارس والجامعات والمعاهد الأردنية يعتبر بحق فضيحة إنسانية وبشرية يدفع ثمنها المواطن الأردني كل يوم .<br />فمن هو الشريف حسين بن علي وما حكايته وحكاية \\\" ثورته العربية الكبرى \\\" التي فلقونا بها في الأردن ؟ ولماذا تصوره كتب التاريخ الصادرة عن القصر الأردني بأنه قديس ومناضل وشريف وعروبي ... بينما نقرأ عنه في الكتب العربية والأجنبية انه كان تركيا مشبوه النسب من جد يهودي اسمه عون ونسجونجيا وعميلا للأتراك والإنجليز وقاتلا ... بل ويحملوه مسئولية القضاء على الخلافة الإسلامية ويحملوا أولاده من بعده بخاصة عبدالله مسئولية ضياع فلسطين وتقاسمها مع اليهود ؟<br />كان \\\" عون \\\" جد الأسرة الهاشمية الحاكمة في الأردن والعراق قد ولد لابيه \\\" محسن \\\" من أم يهودية ... وابناء اليهوديات يعتبروا وفقا للديانة اليهودية من اليهود لذا نشأ \\\" عون \\\" أو \\\" يهوديا وكان يعرف بين اليهود باسم \\\" جدعون \\\" ... ويقال الشيء نفسه عن الملك حسين الذي رعته وربته أمه \\\" زين \\\" التي كانت تصطحبه إلى معابد اليهود في تركيا وبريطانيا ... والملكة \\\" زين \\\" هي التي اختارت لابنها زوجته الإنجليزية اليهودية \\\" انطوانيت \\\" ابنة العقيد \\\" توني غاردنر \\\" التي عرفت فيماا بعد باسم الأميرة منى والتي أنجبت للملك حسين أولاده عبدالله – الملك الحالي – وفيصل وعائشة وزين .<br />ولد حسين بن علي بن محمد بن عبد المعين بن عون في اسطمبول عام 1853 ميلادية وكان أبوه وجده آنذاك يقيمان تحت الإقامة الجبرية بقرار من السلطان عبد الحميد الذي اعتقل جده \\\" عون \\\" وكان أميرا على الحجاز بعد أن ثبت انه كان يقوم بسرقة قوافل الحج والاعتداء على النساء وفرض الإتاوات على أهل الحجاز وتحويل مكة المكرمة إلى وكر للدعارة ... وقد وجه السلطان عبد الحميد جيشا جرارا إلى الحجاز قام بمطاردة عون وعصابته وتم إلقاء القبض على عون وتسفيره إلى اسطمبول وظل حسين بن علي تحت الإقامة الجبرية في تركيا لمدة 16 سنة ولم يخرج منها إلا بعد الانقلاب العسكري الذي قادته مجموعة من العسكر في تركيا أكثرهم من اليهود عرفت باسم \\\" حزب الاتحاد والترقي \\\" .<br />قام السلطان عبد الحميد بتعيين الشريف عبدالاله بن محمد أميرا لمكة وكان الرجل معروفا بتقواه وورعه ولكن هذا ما لبث أن توفي بسبب تقدمه في السن فلما شغر المنصب قام العسكر بتعيين حسين بن علي أميرا على مكة رغم انف السلطان عبد الحميد فسافر الحسين مع أولاده الثلاثة فيصل وعبدالله وعلي عن طريق البحر إلى جدة ووصلها عام 1908 وكان في استقباله عدد من العسكر من أعضاء حزب الاتحاد والترقي إلى جانب والي الحجاز المشير كاظم باشا .<br />كان السلطان عبد الحميد الذي رضخ لضغوطات العسكر قد قسم السلطة في الحجاز إلى قسمين ... سلطة دينية رمزية روحية وهذه سلمها لحسين بن علي ... بينما سلم السلطة الأمنية والعسكرية لوالي الحجاز وهو المشير كاظم باشا ... وكان السلطان يهدف من ذلك إلى محاصرة حسين بن علي وأولاده ومنعه من العودة إلى سيرة جده \\\" عون \\\" في اغتصاب حقوق الناس وسرقتهم وابتزازهم والإغارة على قوافل الحجيج وسبي النساء .<br />كانت سيرة حسين بن علي الأخلاقية السيئة على كل لسان فقد كان الرجل يقيم علاقة آثمة مع \\\" أسماء \\\" أخت زوجته ولما اكتشفت زوجته \\\" عبدية \\\" هذه العلاقة ماتت من القهر وعمرها لا يزيد عن 27 عاما بعد أن أنجبت له أولاده الثلاثة عبدالله الذي اصبح ملكا على الأردن وفيصل الذي اصبح ملكا على العراق وعلي الذي اصبح ملكا على الحجاز .... وقبل مرور أربعين يوما على وفاة زوجته أراد حسين بن علي ان يحول علاقته غير الشرعية بأسماء إلى علاقة شرعية وذلك بالزواج منها إلا انه جوبه برفض الشريف علي بن عبدالله \\\" أخوها \\\" الموافقة على هذا الزواج بخاصة وان حسين بن علي كان يتخذ من إحدى الشركسيات واسمها \\\" مديحة \\\" عشيقة له انجب منها فيما بعد ابنته \\\" صالحة \\\" التي ماتت في الأردن عام 1994 وزعم حسين بن علي بعد ذلك أن مديحة كانت جارية عنده وان له الحق في معاشرتها لأنها مما ملكت يمينه .<br />بعد ذلك دخلت إلى قصره نورية اسمها \\\" عديلة \\\" عاشرها أيضا معاشرة الأزواج وانجب منها أولاده زيد وفاطمة وسرة ... أما زيد فقد عمل سفيرا للعراق في برلين وهو زوج الأميرة التركية فخر النساء التي تولت مناصب هامة في الأردن رغم أنها لم تكن تتحدث العربية وقد سرقها زيد من زوجها وهو أديب تركي معروف وانجبت لزيد ابنه رعد وزير البلاط الأردني الذي يطالب هذه الأيام له ولابنه فراس وحفيده مرعد بعرش العراق .<br />عاد حسين بن علي في مكة إلى سيرة جده \\\" عون \\\" أو \\\" جدعون \\\" من قطع الطرق والإغارة على قوافل الحجيج ... وكان حسين بن علي يهدف من هذه الأعمال إلى إحراج والي الحجاز المسئول عن الأمن المشير كاظم باشا واقناع السلطان أن الأمن في الحجاز لن ينصلح حاله إلا إذا جمع حسين بن علي بين المنصبين ... الديني والعسكري لكن المشير كاظم الذي ألقى القبض على بعض قطاع الطرق وقام بتسفيرهم إلى السلطان استطاع أن يثبت للسلطان أن حسين بن علي وأولاده هم الذين يديرون عمليات الإغارة والقتل والسرقة التي تتعرض لها قوافل الحجيج .<br />كانت القوات العسكرية في الحجاز تتبع الوالي المشير كاظم باشا ولم يكن لحسين بن علي سيطرة إلا على مفرزة حراسة تتبعه وتقبض مرتباتها من الوالي ... لكن حسين بن علي نجح في إنشاء ميليشيا أو مافيا من البدو كان يقوم بتقاسم غنائم السرقة وقطع الطرق معها ... وقد وسعت مافيا حسين بن علي من غزواتها التي لم تعد تقتصر على قوافل الحجيج وانما امتدت لتشمل قبائل عربية تعيش قرب مكة والمدينة حيث هاجمت هذه العصابات وبإشراف وقيادة عبدالله وفيصل مضارب عشائر بني الحارث قرب الطائف ... ثم اعتدى على عشيرة مطير فقتل رجالها وسبى نسائها وصادر ماشيتها وحرق خيمها فلجأت فلول هذه القبيلة وتلك إلى مضارب أمير نجد عبد العزيز آل سعود طالبة النجدة .<br />كان لامير نجد نفوذ كبير بين القبائل وكان يحظى باحترام كبير لانه كان ضد الغرباء مهما كانت جنساتهم وله الفضل في حماية الحجاز من الغزوات الأجنبية ... كما كان لامير نجد تحفظاته على الوجود التركي في الحجاز ممثلا بضباط الاتحاد والترقي المشتبه انهم من اليهود وممثلهم حسين بن علي ... لذا بدأ الطرفان يحشدان قواتهما لحسم الصراع .<br />بدأ حسين بن علي يستميل العشائر المحيطة بنجد من خلال الرشوة فانضمت إليه قبيلة عتبة ... بينما اقنع ضباط الاتحاد والترقي السلطان عبد الحميد بتحريك قوات تركية نظامية لاحتلال نجد ... والتقى الجيشان على مشارف قبيلة الدواسر حيث دارت معركة غير متكافئة وقع على أثرها سعد شقيق عبد العزيز آل سعود أسيرا في يد الأتراك .<br />وخلال توغل حسن بن علي في أراضى نجد اصطدم بمحمد علي الادريسي أمير عسير الذي أعلن العصيان على الدولة العثمانية ... واجتاحت القوات العثمانية وقوات البادية وميليشيا حسين بن علي أراضى عسير وارتكبوا فيها مذابح جماعية حيث استباحوا مدينة ابها فقتلوا كل الرجال فيها وسبوا النساء والأطفال ودفنوا المسلحين أحياء في آبار المدينة ... وقد وفر له أخوه \\\" ناصر \\\" الذي كان آنذاك يقيم في اسطمبول بصفته عضو مجلس الأعيان وكان مقربا من كبار ضباط الاتحاد والترقي الغطاء السياسي لدى السلطان ... وكلف حسين بن علي رسميا بالقضاء على الأمراء العرب في المنطق وبسط النفوذ التركي على الجزيرة العربية كلها وكان هذا يقتضي القضاء على إمارة اليمن التي يتزعمها الإمام يحي حميد الدين ... وامارة عسير التي يتزعمها السيد الادريسي ... وامارة نجد بزعامة الأمير عبد العزيز ال سعود وامارة شمر بزعامة الأمير سعود بن الرشيد .<br />هذه الإغارات والاعتداءات التي قامت بها القوات التركية بإشراف حسين بن علي على القبائل العربية والتي انتهت بقتل الرجال واغتصاب النساء وسبيهم واسر الأطفال حولت قصور حسين بن علي واولاده إلى معتقلات كبيرة للنساء و \\\" الاغوات \\\" ... والاغوات هم الأسرى الذين يتم خصيهم وتشغيلهم في قصور الحكام ... ووفقا لما ذكرته الأميرة بديعة ابنة الملك علي ابن الشريف حسين بن علي في مذكراتها التي نشرتها مؤخرا في لندن فان قصور جده حسين بن عليا واعمامها كانت تغص بالاغوات \\\" الخصيان \\\" وكانت مهمتهم رعاية النساء !!<br />عمالة حسين بن علي واولاده للأتراك وبالتحديد للضباط اليهود في حزب الاتحاد والترقي تمخضت عن مذابح كبيرة ارتكبها الشريف واولاده في الحجاز وهي المذابح التي ولدت عداء كبيرا للشريف واولاده في أوساط الحجازيين وانتهت بتوحد الحجازيين وراء أميرهم عبد العزيز آل سعود الذي تمكن من طرد الشريف واولاده من الحجاز وتوحيد القبائل تحت إمرته واعلان قيام الدولة السعودية .<br />عندما اندلعت الحرب العالمية الأولى انضم الأتراك ومعهم حسين بن علي واولاده لألمانيا ... ووجه حسين بن علي ابنه البكر علي على رأس قوة هدفها دخول فلسطين للانضمام إلى القوات التركية فيها التي تخطط لمهاجمة الإنجليز في مصر ... وفتح حسين بن علي خلال هذه الفترة خطا سريا مع الإنجليز وبدأ يلعب على الحبلين ... فهو ظاهريا مع الأتراك ممثلا بفرقة يقودها ابنه البكر ... وهو عمليا مع الإنجليز بناء على اتفاق سري أجراه حسين بن علي مع ممثل بريطانيا في مصر السير هنري مكماهون ... وتمخضت هذه الاتصالات السرية على تخصيص رشاوى نقدية لحسين بن علي كان يتسلمها من الإنجليز ابنه الأصغر زيد ووعد من الإنجليز بتعيين الشريف حسين ملكا على كل العرب إن هو غدر بتركيا وساعد في إسقاط دولة الخلافة .<br />هذه الاتفاقات أو الاتصالات السرية مع الإنجليز هي التي تمخضت عنها فيما بعد الحدود المصطنعة للدول العربية وطارت بموجبها ولايات اضنة واسكندرون التي اعترف حسين بن علي بأنها ولايات تركية وليست سورية ... وكان الشريف الغبي يعتقد أن بريطانيا ستفي بوعودها في الوقت الذي كانت فيه وزارة المستعمرات البريطانية تنجر خوازيق لحسين بن علي ... وللعرب كافة بالاتفاق مع فرنسا .<br />خلال مفاوضات واتصالات الشريف حسين مع الإنجليز نفذ ابنه فيصل والحاكم التركي لبلاد الشام جمال باشا مجزرة في أوساط الوطنيين العرب حين نصب لهم في دمشق وبيروت المشانق ... وكان حسين بن علي يهدف من خلال هذه المجازر القضاء على القيادات العربية والوطنية التي يمكن أن تعترض على طموحاته وطموحات واطماع أولاده ... فتم شنق الزعماء عبد الكريم خليل وصالح حيدر ومحمد المحمصاني وسليم عبد الهادي وعبد الحميد الزهراوي وشفيق مؤيد العظم وشكري العسلي وعبد الغني العريسي واحمد طبارة والعقيد سليم الجزائري والعقيد امين لطفي الحافظ ورفيق رزق سلوم وعارف الشهابي والدكتور علي النشاشيبي وغيرهم من الزعماء العرب .<br />الطريف أن عمالة الشريف حسين للإنجليز فرخت ثلاثة جيوش من البدو والمرتزقة يقودها ضباط إنجليز ... والجيوش الثلاثة تحولت فيما بعد إلى قوات غزو للأردن وسوريا والعراق ليس لمحاربة الإنجليز أو الأتراك أو الفرنسيين وانما لمحاربة الحكومات العربية المحلية والقيادات الوطنية في هذه البلاد ... فدخل عبدالله مدينة معان على رأس ما عرف باسم الجيش الشرقي واسس هناك بالتعاون مع الإنجليز إمارة شرق الأردن وارتكب مجزرة بحق قبيلة العدوان حين طلب من الإنجليز قصف مضارب القبيلة من الجو ردا على تهديدات زعيمها الشيخ ماجد العدوان بطرد عبدالله من الأردن .... ودخل فيصل على رأس قواته إلى العراق ليقيم مملكة فيها بزعامته بينما أعلن ابنه البكر علي نفسه ملكا على الحجاز .<br />والأطرف من هذا أن عبد العزيز بن سعود الذي احتل الحجاز وطرد حسين بن علي منها ووضع حدا للنفوذ الإنجليزي في المنطقة كان يتحسب لهجوم مضاد قد يشنه حسين بن علي من شرق الأردن بعد أن لجأ إلى هناك حيث يقيم ابنه عبدالله ... لكن عبد العزيز كان اكثر دهشة من حسين بن علي نفسه لان الابن \\\" عبدالله \\\" رفض استقبال والده \\\" ملك العرب \\\" في الأردن \\\" خوفا من منافسته له في حكم الإمارة فقام بطرده إلى قبرص حيث مات فيها مقهورا من جحود أولاده ... ومن غدر الإنجليز به رغم الخدمات الجليلة التي قدمها لهم ورغم مساعدته لهم في إسقاط دولة الخلافة الإسلامية .<br />هذا ملخص تاريخي سريع لما يسمى بالثورة العربية الكبرى ورئيسها \\\" الشريف حسين بن علي \\\" ... ولقب \\\" الشريف \\\" لا علاقة له بالشرف وانما هو لقب كان يطلق على الشخص الذي يتولى إمارة الحجاز ... تماما مثل لقب مشير وباشا وبيك ... وقد رأينا كيف أن ممارسات هذا الرجل واولاده الأخلاقية والدينية عدا عن ممارساتهم في قصورهم التي تغص بالنساء والخصيان لا علاقة لها بالشرف ولا الشرفاء ... وهي بعيدة كل البعد عن الدين الإسلامي .<br />ولكن يبقى السؤال الأهم : لماذا قررت بريطانيا إقامة دولة شرق الأردن وتسليمها لعبدالله ابن حسين بن علي ... وكيف دخل عبدالله الأردن وكيف نصب نفسه أميرا ثم ملكا وما هو الدور الذي لعبه في اضطهاد الأردنيين ... ثم كيف تقاسم فلسطين مع اليهود ؟<br />هذا سيكون موضوعنا في حلقة قادمة ... فانتظروها ."
