[[comments]]
order = 386
subject = "ياللي عامل سوره على الفلسطنين"
author = "بنت يــــــــــافـــــــــا"
text = "يا طفل اللي كاتب سورة الفلسطينين<br />ولك حرام خاف ربك عامل كل هاد عشان تقهر الفلسطنين ياابن الحمار بالعكس هما اخدو حسناتك هادا ازا كان عندك حسنات ياواطي وقاعدين بضحكوا على تفاهتك ياحيوان ياكلب ياابن الكلب ياابن الزنوة يلعن ابو اللي جابك ابن حمار<br />قاعد تحرف بالقران ياواطي ولك انت واللي اكبر منك والاردنين والسعودين والاماراتين مابتغبروا على اعتق كندرة فلسطيني شهم يلعن ابو اللي خلفك شو حمار ابن حمار"
