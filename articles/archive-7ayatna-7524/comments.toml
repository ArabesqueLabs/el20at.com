text = "قال نشامة قال ولك انتو عندكم نشاامة روح شوف كيف بتشحدو على باب المساااجد وبتمثلو ياكزاابين يا خدااعين يا مناافقيين يا ولااد الحرام رووح شوف خوااتك المطعرساات المنيووكات كل سيعة مع وااحد بايعين شرفهم عملين كسهم للأجاار تعاال خود ستياانت اختك هيها بلحماااام عفنت عندي ما تيجي تتقاوى بلمسباات فاهم وماا تتكبر لإنو ما كبييرة إلا المزبلة يا مزبلة تجيش تفرجي حالك وروح زبط حكيك الي بترظا وما بعرف وخباايص الاردنين الي لسااتهم بطحفضو وبووكلو بإيديهم يلاا روح ياامسخرة أشووف رد بأكم من مسبة مفكر حالك بتكبر بعيوونا ولك بلعكس بنشخ عليك وإنت بلد وإحنا بلد يا إبن الحراام"
