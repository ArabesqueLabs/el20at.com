subject = "الصاعقة"
author = "الأردن وبس والباقي كلو طز"
text = "شو أخباارك آنسة حموودي وينك بطلت تبين أكيد نسم بدنك من الرد تبعي,,,إحكيلي كيفها إمك الدايبة بزبد زبو لأبوك إنشاء الله بخير وإحكي لأبوك إزا زبدو بلش ينقص قد ما بتشفطو إمك في عندي زلام فلسطينية حابسهم عندي بس عشان يبيعو زبدهم يعني لأمثال أبوك وبعدين إنت لازم تكتب تقارير عن اللي بصير بين إمك وأبوك بالليل بس أنا بعرف إنو الكلام بعجز عن الوصف عشان هيك جبتلك طريقة حلوة وهي إنو تحط كاميرا وتصووورهم وبعدين تنزل الفيديو عشان الكل يشوف بس أنا بشك إنو إمك ما بنيكها أبوك وبس لا بنيكها خالك وعمك وجدك وإنت وإخواانك وعلى رأسهم اليهود هدول بتفننو بالمنيكة يعني إمك بتكوون ماخدة راحتها ومستمتعة معهم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

