subject = "عدت من جديد"
author = "عاشق فلسطين"
text = "السلام عليكم , طبعا يا إخوان إلي ممكن اسبوعين أو أكتر ما دخلت الموقع , لكن كل مالي بشوف تعليقات أوسخ من اللي قبلها , ليه ما بعرف , على كل وبدي أذكر الجميع , أنا أساسا قرفت من الوضع وكلمت إدارة موقع عشرينات الحقيرة وكلمت المسؤول بأنو يحذف جميع هده التعليقات الوسخة والوقحة واللي بتفتقر لنوع الأدب , لكن ما عملوا شي , فهما شكلهم بحبوا المشاكل , على كل حبيت أذكرالجميع بأني كلمت إدارة الموقع لأنو بصراحة مهزلة بجد بجد بجد والله يا جماعة وعيب كل اللي بصير جالس , وبرجو من الجميع أردني وفلسطيني إنو يتوقف عن التعليقات الوقحة , رجاء خااااااص , والسلام عليكم ......."
