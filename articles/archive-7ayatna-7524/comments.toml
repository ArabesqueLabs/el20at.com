[[comments]]
order = 352
subject = "إلى ابن الزناة محمد نواف"
author = "يوسف البحيصي ( فلسطيني و مثل الصقر يصعب اصطيادي"
text = "إلى شعب من ملكهم باع قطعة من أرضهم إنها العقبة المبيوعة ( تعليق بس علشان أورجيكم انكم أولاد أنذال و أنتم من باع أرضه و عرضه<br />مقارنة بين الأم الفلسطينية و الأم الأردنية<br />الأم الفلسطينية : قوم يا ابني عالجهاد و المرابطة حوالين المنطقة ( قمة الشرف و النخوة و الرفعة و الأصالة و الدفاع )<br />الأم الأردنية : قوم يا ابن الحرام على النصب و السرقة و بس ترجع خذ أختك و قود عليها و حاول تجمع أكبر قدر ممكن لكسها عشان أختك ممحووووووووووووونة ( قمة الوساخة و و التعرصة و الدعارة و الوطاوة )"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 353
subject = "إلى ابن الزناة محمد نواف"
author = "يوسف البحيصي فلسطيني و مثل الصقر يصعب اصطيادي"
text = "يا محمد لو انك زلمة تواجهني يا حيوان يا ابن الزانية لو أصلا انتا فيك خير ما بتحكي عن فلسطين أرض الجهاد و الرباط<br />يا أخي انتو من شو مقهورين منا عشان فلسطين أرض الجهاد و أرض الله بارك فيها و يا أخي إذا انتم خونة و قمة الوطاوة و قمة الحيونة احنا شو دخلنا إذا انتم بتبيعو أرضكم و عرضكم احنا شو دخلنا و انتا يا محمد شكلو في واحد فلسطيني جاركم مورجيك الردى و بس الله يجعلني أشوفك و الله لأاشرب دمك بجمجمتك و خاصة لو كنت بالعين و الله انكم يا أردنييين شعب إذا ضرب الحذا بوجهه صاح الحذا بأي ذنب أضرب لا و أتحدى واحد أردني بقدر يتكلم في الإمارات انتو بس كلام على الشاشات يا همايل بس انتا قلي انتا وين ساكن و إذا مكانك بقدر أوصلو بأسرع وقت و الله لأاحط أصابعي في عينيك<br />و أخيرا بحيي كل فلسطيني و بقلكم اصبروا و صابروا و رابطوا و جاهدوا و دعوكم من أولاد الداعرة الأردنيين<br />و السلام على من هو فلسطيني ولا سلام على من هو أردني لإنه ليس على ملة الإسلام"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

