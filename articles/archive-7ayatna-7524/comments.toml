order = 506
subject = "ذرية ابو حنيك وأتباعه"
author = "نجم سهيل الفلسطيني"
text = "ذرية ابو حنيك وأتباعه<br />كلوب باشا ،والملقب بابو حنيك ،تمايل على أنغام الربابة البدوية كما لم تتمايل نخلة من نخيل العراق عندما تداعبها نسمات دجلة والفرات ،بالطبع قبل أن يتركها نابالم أحفاد ابو حنيك اعجازا خاوية ، وكرع من حليب النياق حتى تجشأ من فرط شبعه ، نموذج مثالي لتماهي الغزاة والمستشرقين مع الفريسة ،للتستر على اهدافهم ، وللاحاطة بالخريطة النفسية و الاجتماعية للمجتمعات الإسلامية، لسوقها الى المسالخ بلا اي ممانعة .<br />هز ابو حنيك فنجان قهوته باحدى يديه ،وبالاخرى كتب لنا مستقبلا، نقيم فيه ونقتات على لحوم فلذات اكبادنا لنحتفظ بالبقاء على قيد الحياة ،تركنا في وضع باطن الارض خير لنا من ظاهرها ،وقبل أن ينطق ابو حنيك كان تصفيقنا يسبق كلماته،حتى ناب عنا في خطط ملاقاة العدو.<br />استبدل ابو حنيك خطة هجوم الجيوش العربية التي تشكلت لنجدة فلسطين قبل ثمان واربعين ساعة من بدء المعركة ،فخسرت هذه الجيوش معركة تقرر فيها النصر والهزيمة قبل بدايتها ، نابت الانظمة عن جيوش لم تعد للمعارك ،وناب ابو حنيك عن جيش بعدده وعتاده ليحقق النصر، وعن ذلك يقول اللواء محمود شيت الخطاب وهو من قيادات الجيش العراقي : ( كان التغير مقصوداً ، والذي أراده كلوب باشا من وراء ذلك زج الجيوش العربية في مأزق حرج وذلك عن طريق كشف أجنحتها لقوات العدو مما ترتب على ذلك شل حركتها وقتل فعاليتها العربية ) .<br />التقدم التكنولوجي والعسكري والاستخباراتي والاقمار الصناعية التي ترصد كل شاردة وواردة لم تجعل بوش يغفل عن ابو حنيك ودوره في نصر بات تحقيقه صعب المنال، فقرر ارسال مزيدا من الجنود الى ارض العراق مع جعل اتقان اللغة العربية علامة فارقة ،ذرية ابو حنيك تعود مجددا ليس على ظهر بعير هذه المرة وانما على ظهر الطائرات العسكرية وقاذفات الحمم ، فبعدما تهاوت كذبة اسلحة الدمار الشامل ،وما يمثله العراق من خطر على الامن القومي الامريكي ، اصبحت المهمة مستيحلة ،وبلا نهاية، واصبح لزاما الاستعانة بذرية ابو حنيك ،فبوش ما زال يصر على أن غزو العراق لاجل تحرير العراق ،ومهمة ذرية ابو حنيك تسويق هذه الرؤية ، وعلى الشعب العربي عامة والعراقي التصفيق لهذه الرؤية ، حتى وان حفت جماجم الاطفال والشيوخ والنساء طريق بوش التي رسمها للوصول بالعراق الى (الديمقراطية) او حتى العودة بالعراق الى القبائل المتناحرة !!<br />أم حنيك ( كونداليزا رايس ) لم تحتاج الى الاقامة في الصحراء للتماهي مع الانظمة ، فابو حنيك كفاها شر الصحراء وذئابها وافاعيها والتي اشك انها تدجنت من فائض تدجين بعض انظمتنا العربية ،وعلى أي حال فالصحراء هجرها اهلها ، ووارثي الحكم لم يرثوا من قيمها الا ما ارضعه ابو حنيك لسابقيهم ، فبقي امتثال الدول العربية للاوامر كما لو أنها واقعة تحت الوصاية، فمع اشد الظروف التي تحيط بالولايات المتحدة والتي تهدد مستقبلها كقوة عظمى متربعة على العرش الدولي ما زال ميدان السباق نحو البيت الابيض عامرا بالمتنافسين العرب ، ومع انفضاض اكثر مؤيدي سياسة بوش عنه، هناك من العرب ما زال يتمسح بعتبات البيت الابيض حتى اصبح متامركا اكثر من بوش.<br />لم تقتصر ذرية ابو حنيك على ام حنيك وجنود بوش الناطقين بالعربية بلسان سقيم ، والذين يمكن للمرء أن يستوعب اهدافهم ، أما ما يعجز المرء عن فهمه فهو تناسل ابو حنيك في المحيط العربي ،فالطحالب التي تكاثرت على سطح البرك الراكدة من المتأمركيين ، والذين يحاولوا خلق عداء وهمي بين مكونات المجتمع الذي تعايش بسلام ردحا من الزمن في سبيل تبديد الطاقات في هذا العداء ، وأؤلئك الساعين الى النيل من المقاومة،وجيوش الاعلام التي ارتهنت للترويج لسياسة أمريكا والتبشير بجنة امريكا المفقودة في الوطن العربي ،ومن فتحوا ابواب الاوطان للغازي ، لم يحيدوا عن هذه الذرية .<br />لم يكن لي أن اسوق هذا المدخل لمازوشيا نفسية تستوطن الذات الجريحة ، وتتطلب جلد الذات لتهدئتها ،وإنما للتشابك المفزع بين الرسمي والشعبي في هذه القضية ،والذي يفرض علينا أن نعيد ترتيب أوراقنا من حين لاخر ،وأن نعيد قراءة ذاتنا ،إعادة لم تحثنا الادبيات العربية عليها كثيرا ،بل وقفت احيانا حائلا بيننا وبينها، ولكن السيل قد بلغ الزبى ،وهذا الانحطاط الحضاري يتطلب وقفات مع هذه الذات مهما كان ضوءها خافتا .<br />أما عن الموقف الرسمي ،فارتهان القرار العربي ،لقوى البغي والطغيان ، شكل الخنجر المسموم بجسد هذه الامة من قديم الزمان، ووصل هذا الارتهان الى الفاجعة التي حلت بالامة حديثا ، ارتهن القرار ولحقت به اوطان تقلصت الى حدود مساحة كرسي على طاولة مفاوضات ، ولحق بهما ثقافة وجذور امة ضاربة في اعماق التاريخ وذلك لنيل شهادة حسن سير وسلوك لهذه الانظمة من البيت الابيض، شهادة عنوانها معنا الخاصة ببوش بعد أن قسم العالم الى مع وضد ، ومن ليس معه فهو بالضرورة ضده ،في حربه التي يقودها ، ومن اجل تثبيت هذا العنوان تنعم ام حنيك باملاء اوامرها على رؤساء الاجهزة الامنية في بعض الدول العربية ،و ترسم لهم سياستهم الداخلية في التعاطي مع شعوبهم ،وتحت مسمى محاربة الارهاب ،المصطلح الذي حرم من أي اشاره الى معناه أو الى التعريف ليبقى شبح يطارد كل عربي ومسلم في صحوه ومنامه، وطريقا نحو تحقيق الاهداف الصهيونية بمخلب الادارة الامريكية.<br />لم تكتف الادارة الأمريكية بعدم وضع مفهوم محدد وتعريف لهذا المصطلح ، بل استبق بوش أفعاله في العراق وافغانستان ودعمه اللا محدود للكيان الصهيوني باطلاق مصطلح الحروب الاستباقية والتي تعفيه وتعفي دولته من تبعات ارهاب الدولة ،ومع ذلك بقيت الانظمة ترتعش وترتهن في قرارها خوفا من حشرها في هذه زاوية الاتهام .<br />أما الوقفة مع الذات فتبدأ من العاطفة التي سيطرت وما زالت تقيم بيننا ، والتي قادت الى تأليه الاشخاص على حساب المفاهيم والقيم التي تؤسس لغد أفضل ،ومررت علينا التزوير والغش والخداع ، ففصلتنا الشعارات الرنانة مسافة طويلة عن الاهداف التي سعينا اليها ،فقد ساقتنا الانظمة بتمسحها بشعارات القومية العربية ردحا من الزمن ،بحت حناجر كثيرة بالصدح بها ، في حين كان الاستبداد والديكتاتورية الذي يمثله النظام تنخر بجسد هذه الامة ، ،اصواتنا وتصفيقنا غطى على أنات من دفع في سبيلنا من دمه وحريته ولم نكلف أنفسنا عناء المقارنة بين الشعار والفعل حتى وفاء للمعذبين من اجلنا ،وما زال الحزب الحاكم حتى مع وقوع النظام ضد مصلحة الأمة يروج لسياسته على قيود هذه العاطفة ،يسوق أعضاءه بلجامها الذي ملأ الوجوه بالزبد من فرط الضغط ، وقد أوقع التناقض بين الاهداف التي يقوم عليها الحزب وتأييد النظام في سياسته الى نفي الحزب ليقترب من ذرية ابو حنيك من المتأمركيين .<br />وقد يقول قائل تختلف تقديرات المصلحة من رؤية الى اخرى ومن شخص الى أخر ،وهذا صحيح ولكن لا تختلف عندما تمس المجتمع وحق من حقوقه الذي أجمعت عليه البشرية كلها ومنها على سبيل المثال لا الحصر الحرية ،وحق التداول السلمي للسلطة ،وحماية حقوق الانسان .<br />وما شهدته مصر في الفترة الاخيرة من تعديلات للدستور وموقف الحزب الحاكم منها المثال الحي لما ذهبت اليه ،فمع معارضة الشعب المصري لهذه التعديلات والتي عبر عنها برفضه للاستفتاء حتى لم يتجاوز نسبة من اقترعوا 7% بقي الحزب الحاكم في موقف التبرير لهذه التعديلات متجاوزا رغبة الشعب في رفضها .<br />مكمن الخوف أن لا تستفيد الحركة الاسلامية مما ورطتنا به الانظمة وورطنا به انفسنا ،وأقصد الاكتفاء باشاعة الشعارات في المجتمع بدون سبر اغوار هذه الشعارات لترسيخها لتشكل قاعدة صلبة نحو انطلاقة صحيحة ، تخوف له ما يبرره باندفاع الولايات المتحدة الى مشروع ايجاد اسلام مفصل على المقاس الأمريكي ، مشروع جاد يتم تمويله بملايين الدولارات ويقوم على دراسات وخطط استراتيجية ، وعلى وقع هذه الخطط الأمريكية قامت احدى الحركات التي نخرت فيها العلمانية حتى نخاع العظم للترويج لنفسها على انها اسلامية ،ووجدت من يكتب عن اسلاميتها متخذا من قيم المقاومة والاستشهاديين سبيلا لهذا الترويج ،بدون ادنى حرج من كازينو أقيم في اساس دولة ،وجود هذه المحاولة ووجود من يحتفي بها دلالة على خلل فكري ارجو أن يقتصر على الكاتب ومن احتفى به .<br />وابو حنيك وذريته كشف عن خلل في مدى جديتنا في التطلع الى النهضة ،فالاحداث الجسام كثيرا ما أضاعت البوصلة حتى من يد النخبة أو استطاع النظام سرقتها لا فرق في النتيجة لعدم وجود تخطيط محكم يقود المجتمع نحو اهداف واضحة ،ومن اضاع بوصلته لا بد وأن تكون رياحه بكافة اتجاهاتها غير مؤاتية، وقفة بسيطة مع الذات أمل ان تكون دافعا للمزيد منها .<br />ابو حنيك وذريته تحيط بنا احاطة السوار بالمعصم تعيق فينا كل محاولة للتقدم وتهيىء فأسها للانقضاض على اي اخضرار في الاغصان مما يتوجب استدعاء كل المقومات الروحية لتقوم على صياغة الفرد والمجتمع صياغة تتجاوز القشور الخارجية ليساهم كل فرد وعن قناعة واستعداد للتضحية للانخراط بفاعلية في التطلع الى نيل حقوقه بطريقة سلمية والوصول الى التداول السلمي للسلطة في المجتمع ،ويتحتم استدعاء احتياط الوعي بعدما شهدنا ما شهدنا من تراجع الحريات العامة في اكثر من قطر عربي ،ومن محاولات التفاف على المقاومة الرافعة لهذه الامة ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

