subject = "Tfee 3ala Jordan"
author = "Free Pali"
text = "* مستر \\\\\\\" نو بيف \\\\\\\" No Peef هو الكود او الرمز الذي يرد ذكره في جميع وثائق المخابرات المركزية الامريكية السرية منذ عام1957 وحتى عام 1975<br />* مستر \\\\\\\" نو بيف \\\\\\\" هو اهم عميل للمخابرات المركزية الامريكية في الشرق الاوسط كما تذكر وثائق المخابرات ... وهو الاعلى اجرا فقد كان يتقاضى مرتبا شهريا مقداره مليون دولار وقد بدأ عمله كعميل للمخابرات المركزية الامريكية منذ عام 1957 اي منذ ان كان مستر بيف في الحادية والعشرين من عمره .<br />* مستر \\\\\\\" نو بيف \\\\\\\" - والبيف كما نعلم هو لحم البقر - لم يكن لحاما في احد المسالخ الحكومية العربية ... وانما هو للاسف ملك عربي هو المغفور له الملك حسين ملك الاردن السابق .<br />* اما الكشف عن علاقة الملك حسين - او مستر نو بيف - بالمخابرات المركزية الامريكية ومقدار الراتب الشهري الذي كان يتقاضاه منها ولمدة تزيد عن عشرين سنة فيعود الفضل فيه الى الصحافي الامريكي الشهير \\\\\\\" بوب وورد \\\\\\\" وهو الصحافي ذاته الذي فجر فضيحة ووترغيت التي اطاحت بالرئيس الامريكي .<br />* وللحكاية قصة نشرتها جريدة \\\\\\\" واشنطن بوست \\\\\\\" في عددها الصادر في الثامن عشر من فبراير عام 1977 ...وقد عاد الصحافي الامريكي الشهير \\\\\\\" بن برادلي \\\\\\\" رئيس تحرير الواشنطون بوست فاعاد سرد حكاية \\\\\\\" مستر بيف \\\\\\\" في مذكراته التي صدرت مؤخرا في امريكا بعنوان \\\\\\\" a good life .<br />* تحت عنوان \\\\\\\" المخابرات المركزية الامريكية دفعت الملايين ولمدة عشرين عاما للملك حسين \\\\\\\" كتبت الواشنطون بوست في فبراير عام 1977 تقول : \\\\\\\" علم الرئيس كارتر خلال هذا الاسبوع ان المخابرات الامريكية المركزية كانت تدفع مليون دولار شهريا للملك حسين شخصيا وان المبلغ كان يسلم للملك كاش بوساطة مدير مكتب المخابرات المركزية في عمان منذ عام 1957 ... وفي مقابل ذلك كان الملك يقدم معلومات هامة وخطيرة للمخابرات المركزية \\\\\\\" واضافت الجريدة \\\\\\\" ان المبلغ لم يكن جزءا من المساعدات التي تدفع للمملكة الاردنية بشكل رسمي وانما هو بمثابة رشوة وكان يدفع نقدا للملك حسين شخصيا الذي كان ينفق المبلغ على شراء السيارات \\\\\\\" واضافت الجريدة : ان المخابرات المركزية اعتبرت تجنيد الملك شخصيا ليعمل لديها كعميل من اهم انجازات الوكالة ... وقالت الجريدة ان هذا المبلغ هو الذي وفر للملك حياة البذخ التي عرف بها بحيث اصبح \\\\\\\" بلاي بوي برنس \\\\\\\" كما تقول الجريدة . واضافت الجريدة ان المخابرات احاطت الملك بمرافقات جميلات \\\\\\\" ... وختمت الجريدة مقالها بالقول ان الرئيس كارتر هو الذي امر بوقف دفع المبلغ للملك حسين لانه اعتبره امرا معيبا .<br />* يومها ... دافع الملك عن نفسه بالقول ان المبلغ كان يدفع له ليؤمن حراسات امنية لاولاده الذين يدرسون في امريكا ... وكانت هذه الحجة سخيفة لان الملك بدأ عمله مع الوكالة منذ عام 1957 بينما ولد اكبر ابنائه عبدالله - الملك الحالي - بعد ذلك بخمس سنوات .<br />* رئيس تحرير الواشنطون بوست التي نشرت المقال انذاك \\\\\\\" توم برادلي \\\\\\\" اعاد سرد تفاصيل الفضيحة في مذكراته التي صدرت مؤخرا ووصف فيها كيف التقى هو وبوب وورد بالرئيس كارتر الذي اكد لهما الخبر وطلب منهما عدم نشره حفاظا على سمعة الملك ومصالح المخابرات المركزية في المنطقة لكن الواشنطون بوست نشرت الخبر رغم ذلك مما ادى الى قطيعة بينها وبين كارتر .<br />* الصحافي المصري المعروف محمد حسنين هيكل التقط هذه الفضيحة في كتابه الجديد \\\\\\\" كلام في السياسة \\\\\\\" الذي نشره بعد موت الملك حسين ... وحاول ربط عمالة الملك للمخابرات المركزية بالنكبات التي اصابت منطقة الشرق الاوسط بسبب التسريبات الامنية التي كانت تتم للمخابرات المركزية الامريكية دون ان يعرف احد مصدرها وتبين انها كانت تتم من قبل موظف في الوكالة اسمه حسين بن طلال وكان يشغل وظيفة ملك في الاردن ويعرف في اوساط المسئولين في المخابرات الامريكية بالاسم الكودي \\\\\\\" مستر بيف \\\\\\\" .<br />* لهذا يقول هيكل : هرب الملك حسين 16طائرة حربية اردنية من طراز فانتوم الى تركيا قبل ايام من حرب حزيران يونيه حتى لا يستخدمها المصريون في الحرب ضد اسرائيل رغم ان الملك وقع مع عبد الناصر اتفاقية دفاع مشترك قبل الحرب بايام ... ولهذا ايضا لم يقاتل الجيش الاردني خلال حرب حزيران يونيو وانما انسحب وسلم الضفة لاسرائيل حيث تذكر المصادر الاردنية نفسها ان عدد قتلى الجيش الاردني خلال حرب حزيران يونيو لم يزد عن 16 جنديا فقط وهو امر مثير للسخرية بخاصة وان الملك لم يخسر في الحرب حارة او مدينة وانما خسر نصف المملكة ... واية \\\\\\\" طوشة \\\\\\\" بين حارتين في عمان يمكن ان تؤدي الى اصابة ضعف هذا العدد فما بالك بحرب بين جيشين يفترض ان الجيش الاردني خاضها .<br />* واكثر من هذا ... يقول هيكل ان الملك اعترف في لقاء مع البي بي سي انه طار شخصيا الى تل ابيب قبل حرب اكتوبر تشرين والتقى بغولدامائير وحذرها من الهجوم المصري السوري .<br />* التجسس ظاهرة معروفة عبر التاريخ ... لكنني لم اقرأ من قبل ان ملكا عمل بوظيفة جاسوس لدولة اجنبية مقابل مرتب شهري وان وظيفته هذه جعلته يسلم نصف مملكته للعدو .<br />* لعل هذا يفسر جانبا من اللغز في اختفاء كتاب \\\\\\\" كلام في السياسة \\\\\\\" لهيكل ليس فقط من الاسواق الاردنية التي لم يدخلها اساسا وانما ايضا من الاسواق العربية لان المخابرات الاردنية كانت مشغولة بلم النسخ من خلال شراء كل الكميات المطبوعة منه .<br />* الرشوة عرفناها ... ومستر بيف عرفناه ... والرئيس الامريكي الذي طرد مستر بيف من الوظيفة عرفناه ايضا ... ولكن الذي لم نعرفه بعد هو من هن \\\\\\\" الجميلات \\\\\\\" اللواتي غرستهن المخابرات الامريكية في قصر الملك ... وهل \\\\\\\" ليزا الحلبي \\\\\\\" واحدة منهن ؟<br />* مستر بيف انتقل الى رحمته تعالى واظنه يحاسب الان في قبره على بعض ما فعله بحق وطنه ودينه وامته ... ولكن السؤال المطروح الان هو : هل يوجد بين حكامنا العرب مستر بيف اخر ؟ ...<br />* ان اكثر ما نخشاه ان يقوم مسئول امريكي اخر بتسريب فضيحة مماثلة الى الصحف تمس رئيسا او ملكا عربيا ... وان يكون الكود السري للرئيس او الملك العربي من طراز \\\\\\\" مستر بيف \\\\\\\" ... مثلا \\\\\\\" مستر فاصوليا \\\\\\\" او مستر \\\\\\\" فلافل \\\\\\\" واذا كان لا بد للمخابرات المركزية الامريكية من تجنيد الحكام العرب في مؤسساتها فعلى الاقل نرجو منها ان تعطيهم القابا ورموزا كودية محترمة حتى نتمكن من نشرها في جريدة عرب تايمز دون ان نتسبب في قرف القراء منا ... ومنهم .... غفر الله لهم واسكن مستر بيف فسيح جناته .... ورزق العرب بحكام من طراز حكام اسرائيل ممن لم نسمع ولم نقرأ من قبل انه كان بينهم \\\\\\\" مستر بيف \\\\\\\" او \\\\\\\" مستر بطاطا \\\\\\\" وان اهدافهم المعلنة والسرية كانت ولا تزال اقامة اسرائيل الكبرى من النيل الى الفرات ... ويبدو انهم سينجحون في تحقيق هذا الحلم بخاصة وانه كان بين قادة خصومهم العرب من هم من طراز \\\\\\\" مستر بيف \\\\\\\" .... طيب الذكر"
