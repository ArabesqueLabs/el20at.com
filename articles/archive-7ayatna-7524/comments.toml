[[comments]]
order = 83
subject = "الاردن صحراء فلسطين"
author = "فلسطيني وأفتخر"
text = "مرحبا اولأ وليس اخرأ احنا الفلسطينيه تاج راس كل واحد فيكم يا اردنيه ومو كلهم لانو في ناس مش هيك بس قليل كتيير.....المهم بدكم يالاردنيه 100 سنة لما تتحضروا وتصيروا بربع الي احنا فيه تاني شي انتو بقر من الاخر يعني .....بكفي انو احنا في عنا ثالث الحرمين واولى القبلتين الي هو الاقصى ادامة الله فوق روسنا وروس الكل ... بعدين احنا 3 مليون فلسطيني بالاردن و1 مليون عراقي و1 مصري و400 الف اردني معفن مش كلهم برضوا ..... بكفي انو احنا زلام بيدينا بنرمي الحجر بدون خوف لا بيدنا سلاح ولا كلاشنكوف وبنحارب اليهود مو متلكم اذا الواحد حمل موس بفكر حالوا صار زلمة والله اعلم شو هو .... واحنا الشهيد عنا متل ايه بالقران .....بكفي انو في للقدس اغاني متل الناس والعالم مش عنقر بوريتك...مش بحكيلكم بقر وعمرك ما بتصيروا من البشر .....الله يرحمك يا ابو عمار يا تاج راسنا كلنا ....بعدين يا زلام الاردنيه روحوا سبو في المخيمات يمكن يمكن او ليش اكيييييييد 100% ما راح تمشوا ع رجليكم ....بــــاي يا بقر وع راسي كل فلسطيني صامد....لكل شخص وطن يعيش فيه الا نحن الفلسطينيه لنا وطن يعيش فينا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

