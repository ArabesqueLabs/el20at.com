subject = "فلسطينية و افتخر"
author = "الاحترام مطلوب يا أردنيين"
text = "احنا الفلسطينيين اطهر شعب و احسن شعب, ومو من مستوانا انه نرد على هيك أشكال, علشان هيك لا تحكي حكي أكبر منك يا ريت تحكي على أدك , يعني تسكت احسنلك يا محترم كتير كتير كتير يا أردني , سوري ما كان قصدي أهينك وأقولك محترم لانك الاحترام والادب تبروو منك , يا ريت لا تحكي على أسيادك , بكفي علمناك و علمنا اشكالك كيف تستخدم الانترنت , يوم المحشر يا أردني وين ؟؟؟؟ ازا مابتعرف فيك تسأل , أوه سوري ما كان قصدي أحرجك , لانه بعرف انك لا تفقه من العلم شيء , سوري على الاحراج ,مرة تانية بقولك الفلسطينيين معروفين باخلاقهم وأصلهم والكل بيعرف هاد الشي , ومو مستنيين واحد متلك يعرف عنا , ويا ريت تحفظ أدبك , وما تغلط على أي فلسطيني , و الكلام من صفة المتكلم , لذلك ما رح ننزل لمستواك الواطي , أي الى مستوى الحشرة سوري بل ادنى من الحشرة , كلامك مردود عليك و على أمثالك , صحيح الفلسطينيين ما تركوا أرضهم همه انغدروا و انت أكيد بتعرف هادا الاشي يا أردني , أنا حزنان على الاردنيين اللي انت منهم لاني بعرف انه الأردن بلد النشاما والكرم وهيك أنا بعرف الأردنيين أما انت أنا متأكد انك مو منهم , لانه فلسطين و الأردن كانت ضفة واحدة و انقست ضفتين , ضفة غربية و ضفة شرقية مع هيك بضل اولاد بلد واحدة , وبنضل عرب , يا ريت يا أردني يا محترم تفهم هاد الاشي وعيب تغلط على عربي مسلم واحترم شعاركم الاردن اولا , لا تخلي هاد الشعار يفهمه الناس انه أولا بالغلط و السب أعطي انطباع عن الاردن بأفضل صورة مو متل هيك صورة قذرة , خليهم يحكوا الأردن أولا بالفعل أولا , هادا , ازاكنت بتحب الأردن بافعل متل ما احنا بنموووت بفلسطين الحبيبة . عاشت فلسطيييييييييييييييييييييييييييييييييييييييين , عاشت فلسطييييييييييييييييييييييييييييييييين الحبيبة ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

