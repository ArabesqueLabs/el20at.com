text = "اود ان اطرح على الجميع سؤال من الذي رسم الحدود بين الاردن وفلسطين ومن جعل هذا القسم يسمى الاردن وهذا فلسطين الاصل فينا اننا مسلمون وما يجمعنا هو الاسلام وما يفرقنا هو الحدود التي وضعها لنا الكافر المستعمر ومن قرائتي لكل مداخلاتكم يتبن انكم ذوي فكر هابط لا يؤدي الى النهضة فهذا الاردني يعتز باردنيته وكانها ستنجيه من عذاب جهنم وهذا الفلسطيني يعتز ببلده واكنها ستتدخله الجنة وننسى ان بلال من الحبشة وسلمان من فارس وصهيب من الروم ومحمد من العرب كلهم سيدخلون الجنة لانهم مسلمون وليس لشيء آخر ثم ان جميع قادة الامة ورؤساؤها هم تبع للغرب الكافر وان كانت فلسطين محتلة من اسرائيل فان الاردن وباقي الدول العربية والاسلامية مهيمن عليها ومحتلة حتى النخاع من قبل انظمة الكفر والضلال مثل نظام الاردن او ذنب اسرائيل وما يسمى بالسلطة الوطنية<br />الحل يكمن بلفظ كل هذه الانظمة واستبداله بنظام الاسلام الذي جاء به محمد من عند الله واعدته ال الحياة يتحكم في كل صغيرة وكبيرة من نظام حياتنا فلا فخر بالملك ولا باب عمار<br />وانما العزة والفخر بالاسلام اولا وبرجال امثال عمر وعثمان وخالد وصلاح الدين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

