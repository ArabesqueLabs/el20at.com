subject = "انظروا إلى حقد الأردنيين الأصل على الفلسطينين"
author = "طالب فلسطيني بالجامعة الأردنية"
text = "بسم الله الرحمن الرحيم<br />الأردن بلد الحريات<br />أود ان انقل اليكم ما حدث اليوم 9/1/2003 في الجامعه الأردنيه<br />في الظهر خرجت مسيرة سلميه في الجامعه نظمها الاتجاهالاسلامي في الجامعه<br />الاردنيه حيث كان المتظاهرون يمشون في الشوارع داخل الجامعه حاملين الأعلام<br />الفلسطينيه والاردنيه ولما وصلت المظاهره الى منطقة كلية العلوم حوصر<br />المتظاهرون بالأمن الجامعي ولا أدري بالضبط ما حدث هنا ولكن بعد قليل وجدنا ان<br />جزءاًًَ من المتظاهرين ذهبوا الى شعبة الأمن وبدأوا الضرب بينهم وبين رجال<br />الأمن الجامعي ، ولقد رأيت رجلاًُ من رجال الأمن ورأسه يقطر منه الدم لكني لم<br />أعرف التفاصيل بعد . هنا سمعنا رجال الأمن يقولون ( لقد حشرناهم عند كلية<br />العلوم اذهبوا واضربوهم ولن يقع على أي منكم أي مسؤوليه ). وهذا بالضبط ما حدث<br />فأصبح رجال الأمن والطلاب الأردنيين الأصل يضربون كل من لديه لحيه من الشباب<br />حتى لو لم يكن له دخل في شيء وهذا ما رأيته بأم عيني. في القرب من كلية العلوم<br />يتم بناء كلية الملك عبدالله الثاني للتكنولوجيا فأخذ الطلاب الأردنيين يأخذون<br />الأخشاب الطويله ويضربون بها كل من لا يعجبهم وبهد ذلك أخذو (U.S.A) يمشون في<br />شوارع الجامعه وهي يهتفون<br />ويهتفون للأردن وكاننا كنا نهتف ضد الأردن والأردنيين<br />حتى أن احد المتعصبين الأردنيين خرج الى مكان عال وأخذ يكفر ويشتم فلسطين وكأن<br />الدين للفلسطينيين وذلك أمام الأمن الجامعي ودون ان يتدخل في ذلك حتى انه كان<br />يمسك(بالشيوخ) أي من يطلقون لحاهم من الشباب ويتركوا الأردنيين يضربونهم<br />بالأخشاب والأحزمه الجلديه دون رحمه<br />هذا والله ما حصل امام عيناي ودون مبالغه والله على ما أقول شهيد<br />والسؤال الآن الى متى سيظل الأردنيون يتغنون بالحريات وخاصة المسؤولين منهم وهم<br />في داخلهم هذا الحقد غير العادي على الفلسطينيين الذين هم عصب الإقتصاد الأردني<br />فعشان هيك إلهم حق الفلسطينيين إنهم يكرهوا الأردنيين الأصل من عمايلهم السودا تجاه الفلسطنييين , لكن بقول في النهاية إنو للأسف إنو الفلسطينيين اللي عم بعملوا بالمخابرات الأردنية خانوا دينهم ووطنهم وشعبهم اللي هما منا وفينا عشان خاطر<br />الأردن , وكل اللي حكوه الفلسطينيين والفلسطينيات عن الأردنيين من خلال التعليقات الموجودة بهاي الصفحة كلها صحيحة مئة بالمئة وليس فيها أي خطأ ...........<br />طالب فلسطيني - الجامعة الأردنية"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 227
subject = "أريد أن أوصل رسالة"
author = "بنت السعودية"
text = "السلام عليكم ورحمة الله وبركاته , أنا أبغى من جد أشكر المشتاق للحور العين (طبعا ابن فلسطين) لأنه كلامه جدا ممتاز ويخش الراس , فلسطين هي أرض الرسالات وقد كرمها الله على كل بلدان العالم , فعلا الشعب الفلسطيني شعب مبتلى من الله سبحانه وتعالى , بصراحة , اتحدى أي دولة عربية الحين تتحمل اللي جالس يصير بفلسطين , هذا فعلا يدل على إنه شعب صامد وصابر والله يقويهم لنصرهم إن شاء الله , وأنا والله ما حبيت الفلسطينيين وخاصة طبعا الفلسطينيات إلا لأنهم محترمين وشرفاء وفزاعين وعفيفين , وبعدين الحمد لله أغلب الفلسطينيين عنا فيهم ناس أغنياء غنى فاحش , ومنهم صاحب مطعم بروست البيك المشهور , وصاحبها فلسطيني من بيت أبو غزالة , وهو مطعم مشهور والبروست حقه مرة رهيب ويجنن , واللي خلاني كمان أحبهم إنهم يرضوا بالنعمة اللي هما فيه , ويحسوا بالمسؤولية بكل صراحة أقولها , وأنا أبغى أقول للفلسطينيين لا تاخذوا عن السعوديين فكرة سيئة , عشان أنا عارفة إنه في سعوديين بدوان كلاب دايما يغلطوا على الفلسطينيين , أنا أقول للفلسطينيين سيبوكم منهم , واللي يعجبني كمان في الفلسطينيين إنهم ياخذوا حقهم بالقوة , وما يخافوا ولا ينخوا مثل بعض الناس (الله يستر عليهم مثل الأردنيين) , بس مشكلة الفلسطنيين إنهم شديدين وعصبيين , بصراحة الشدة تطلع الرجال (الشدائد تصنع الرجال) والله ينصر الشعب الفلسطيني ويوحد صفوفهم , والله يصلح فيما بينهم , أنا أمي فلسطينية من مدينة غزة , وبصراحة من صغري ونا عايشة مع الفلسطينيين , مع أولاد خالتي وبنات خالاتي لما كنا صغار , والله كنا متونسين وكانت حياة حلوة بمعنى الكلمة , والحين كبرنا وصرنا أحباب أكثر من اول , وأنا مستغربة جدا من الأردنيين الأصل اللي فعلا ناكرين فضل الفلسطينيين عليهم في الأردن , أنا بصراحة أشوف إنه الفلسطينيين للأسف مضطهدين هناك من الأردنيين الأصل , ما أدري ليش يعني هذا الحقد كله ؟؟؟؟؟ على كل فلسطين على قولة المشتاق للحور العين أولا وأخير غصب عن الكل , مع إني سعودية حضرية من مدينة جدة لكن سبحان الله أحب فلسطين وأحب الشعب الفلسطيني , والحمد لله على كل حال , والسلام عليكم ورحمة الله وبركاته .... (كلنا فلسطين) ........................... بنت السعودية"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 228
subject = "الملح الإنجليزي لفرم الخرة جوة الطيز هو أصلا ملح أردني طفيلي أصل"
author = "بنوتـ فلسطينية حلوة ــة"
text = "السلام عليكم ورحمة الله وبركاته , أخي العزيز عاشق فلسطين , التقرير العلمي الغربي الغريب اللي كتبته هو صحيح , لكن فيه أخطاء , عفكرة أصلا الملح الإنجليزي والرجاء من الكل إنو يقرأ هدا المقطع كامل مكمل لأنو غريب نوعا ما , المهم : أخي عاشق فلسطين أصلا الملح الإنجليزي الموجود في الصيدليات لفرم الخرة جوة الطيز على قولتك هو ملح أردني أصل , لكن كيف تغير اسمه<br />من ملح أردني (طفيلي) إلى ملح إنجليزي , القصة وما فيها لأنه الأردن العميلة أكبر صديق وفي لبريطانيا , بريطانيا اندهشت لما عرفت بهدا الدواء , وقالت لازم يكون اسم الدوا هدا بإسم الدكاترة البريطانيين , وبعدين إجا الإنتداب البريطاني وكان رئيسهم هداك الوقت اسمه كلوب باشا وكان يلقب بـ (أبو حنيك) المهم , قال للملك عبد الله الأول , قالهم يعني إحنا اعطيناكم الضفة الشرقية من فلسطين بكاملها إلكوا , فقال كلوب باشا للملك عبد الله الأول , أعطونا هدا الدواء كهدية قيمة زي ما أعطيناكوا هدية ثمينة وهي الضفة الشرقية , أعطونا هده الهدية البسيطة , الملك عبد الله طبعا قال : أكيد خدوا هده الدواء , طبعا العشائر الأردنية غضبت هديك الأيام لما عرفوا بالموضوع لأنه هدا الدواء كان يعتبر إنجاز عظيم في عالم الطب , وكان ناس كتير من بدو الأردن انتفعوا بهدا الدواء , يعني أي واحد هلأ بيجي إله إمساك بياخد الملح الإنجليزي (الأردني الطفيلي الأصل) وعلطول بفرم الخرة جوة الطيز على قولتك يا أخي عاشق فلسطين , على كل هده هي الحقيقة الكاملة , على فكرة , نقابة الأطباء الأردنيين لهلأ زعلانيين على اللي صار , لكن كل يوم بقولوا : (((اللي فات مات))) وشو بدنا نعمل ؟ كان يعني نفسهم الأردن<br />تصير أحسن دولة في العالم من ناحية التقدم الطبي , فعشان هيك بدي أقول إنه الأردن أكبر دولة عميلة لليهود في العالم ,<br />حتى وصل الأمر فيها إلى إنو الأردنيين يحرموا حالهم من الشهرة في العالم , ولا كان هلأ الإقتصاد الأردني جدا منتعش , لكن<br />هما جنوا على حالهم , أحد أمراء العائلة الهاشمية قد عزمتهم قبيلة وعشيرة الدعجة والله اعلم على ذبيحة بمناسبة عيد الإستقلال , وفجأة أحد الأمراء يصاب بمغص شديد جدا (الملك عبد الله الثاني كان سيعتها أمير وكان عارف بكل إشي لكن تستر<br />على حاله خوفا من الفضيحة) المهم أخد هدا الأمير الدواء وانفرمت الخرية جوة طيزه ونزلت بسرعة , لكن هو برضوا هدا الأمير<br />زعلان كتير على إنه هدا الدواء تحول إسمه وقال قدر الله وما شاء فعل , على كل يا ريت إنكوا تكتبوا هدا الموضوع بأسرع وقت<br />للإفادة فقط بأن الأردنيين مع إنهم بدو وحثالة , لكن بالفعل استطاعوا أن يخترعوا أعقد دواء في العالم , وشكرا إلك كتير يا أخ<br />عاشق فلسطين ولا تحرمنا من مواضيعك الأخرى"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

