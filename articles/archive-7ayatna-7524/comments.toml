[[comments]]
order = 190
subject = "إلى حمود المحيسن"
author = "فلسطيني مسلم"
text = "انا بدي أقلك انك فقدت ادبك وفي حياتك مارح تكون بني ادم ورح تضل بقرة وما رح تصير تفهم يا تافه بس بحب احكيلك وطبعا انا متأكد انك ما رح تفهم الحكي انه احنا مسلمين بداية وعرب ثانيا وتربطنا وحدة الدم والمصير والاخوة الايمانية طبعا الحكي ما بدو نقاش فأنا بحكي قرارات غصب عنك لكن انت وامثالك حرام تكونو من هدا الشعب لانكم اساس الفتنة والفرقة بين الناس وبالتالي المشاكل المستمرة اللي ضد مصلحة البلد يا عديم الفهم وارجو انك تصحى وتصير تفهم ولما تكره حدا اعرف ليش انت بتكرهه بس انا شخصيا انت وامثالك ما بتأثرو على غبرة كندرتي وهاد الحكي عيب على كل حال اصحى قبل ما يجي يوم ما بفيدك الصحيان فيه"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 191
subject = "إلى الكلب عديم التربية والزوء : حمود المحيسن وإلى كل الأرنيين الكلاب"
author = "فلسطيني وبفتخر , واللي مش عاجبه ينتحر , ويكتب على قبره ميت من القهر , أردني خرة مقهور وما قدر يتحدى فلسطيني زلمة"
text = "ولك انا ياواطي ياقليل التربية بصرف مصاري الي خلفني ولك انا بصرف عليك وعلى مليون زيك يا حفاي يا صرماي ياواطيي ولك تعال هون يا كلب يا حقير ولككككككككككك اخ بس اخ لو امسكك يا قليل التربية والزوق اقلك اخرتني امسكك اي لامسح الارض بوجهك يا واطي يا متخلف طيب انا بفرجيك ياواطي<br />على فكرة فرصة سعيدة<br />نايس تو ميت يو<br />باي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 192
subject = "شو هدا الحكي , آل الأردنيين أهل الشهامة , والله والضراطة"
author = "بنت نابلس (palestine first) بحبك يا فلسطين"
text = "على فكرة هيك يا الأردنيين عقدتوها أكتر من أول , لازم تتربوا والله ما أنتوا متربيين أبدا , لكن على كل ما بحب أسب كتير لأني الحمد لله متربية وفلسطينية بنت أصول مش زيكوا متخلفين نور غجر بقر , آل الأردن , والله والضراطة والطقعة كمان , بس أنا بنصح<br />كل فلسطيني إنه لا يتعب حاله مع هدول البجم التيوس النور الخرة المخريين بخرة متخرية بخرا مخري فعلا والله .....<br />وتحياتي لكل أولاد شعبي المناضلين وإلى بنات شعبي الصامدات , بحبك يا فلسطين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 193
subject = "الأردني.."
author = "الأردني.."
text = "يا منيووكة ولك الي بركظو ورا السيارات هظوول فلسطيزية يا عايبة لإنو الأردنية والشكر لله مكرمين معززين مدللين ببيوتهم والفلسطيزية مدعوس عليهم وين ما كان سواء بالأردن وبفلسطيز وبسوريا وبلبنان وبمصر وبدول الخليج وبدول أوروبا وين ماكان مدعوس عليهم وبعدين إحنا ما نذلكم ليش بدنا نستنا عشان نذلكم ولكم إحنا ذليناكو ودعسنا على روسكو ونكنا بناتكو تشبعنا وبعدين إسرائيل أحسن منا يا عاهرة المنيح العترفتي انهم احسن منا طبعا ماإنتو بدكو مين يضل ينيك فيكو عشان هيك بتحكو أحسن منا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 194
subject = "الأردني.."
author = "الأردني.."
text = "أنا بس حابب اوظح شغلة لكل العالم إنو الشاب الأردني بكون بدو يتجوز فلسطيزية على سنة الله ورسولو بس هما برظووش بتعرفو شو السبب عشان بحبو حياة المنيكة بحبو كل يوم ينيكهم زب غير عن التاني شوي يكون الزب طويل وشوي يكون الزب قصير وهيك يعني كل يوم زب عن التاني وبعدين مش بتحكو إنو شرق الأردن فلسطيز والأردنية كلهم أصلهم فلسطيز طب ليش بضلكو تسبو وتوسخو بالحكي علينا كل هاد من الغييرة يعني إنتو بتسبو على حالكو منكو وفيكو بعدين الأردنية عمرهم ما عملو عنصرية بدليل إنهمو إستضافوكو عندهم بس الفلسطيزة لما إجو هما عملو العنصرية ولكو روحو شوفو كيف بعتو أراضيكو لليهود وببعدين نصبتو عليهم وصار بدكو الأراضي لما تكاثرتو عن طريق الحرام والزنا يا شراامييييييططططط"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 195
subject = "يا حرام عليكو يا الاردن"
author = "حمودي شكري"
text = "يا حرام يا اردنيه على الاقل فلسطين من شمالها لجنوبها حلوه و شبابها و بناتها<br />عمركو شفتو شب اردني حلو يا زلمه لو كان حلو بتكون امو فلسطينيه او بنت اردنيه حلوه حبيبي الحلاوه كلها والموضه طالعه من فلسطين يا زلمه ابشع شباب بفلسطين بكونو احلى من الاردنيه وبكفي نحن الي مفيعين الدنيا و لما تشوف واحد فايع اسالو من وين بحكيلك فلسطيني"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 196
subject = "الأردن وبس والباقي كلو طز"
author = "الصاعقة"
text = "يا ابن الدايبة بزبد زب أبوك كووووول جبل من الخرا وقبل ما تحطو بتمك كعبلو وإدحشو بكس أختك عشان يطرا وبعدين لزقو بسنانك قال مفيعين الدنيا ولكو يا نور يا بجم يا مرتزقة يا بزقة اللي طالعين من كساس مهرية أصلن إنتو مشرشيحين الدنيا ومشرشحين من الدنيا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 197
subject = "الأردني.."
author = "الأردني.."
text = "لسا برجع بحطلك حمودي جد رجال آخر زمن ولكو يا فلسطيزية إنتو كل رجالكو مخنثين وبحبو يدلعو حالهم وبعدين يا جحب المرجلة مش بالفياعة والحلاوة يا منيك المرجلة بالفعل فرجيني بالله شو عملت لبلدك يا فايع يا حلو بعدين منيح انك اعترفت انو كل هم الشب الفلسطيزي الموضة والحلاوة والفياعة متل النسوان وتاركين بلدكو لليهود يتلذذو بكساس أعراظكو قبل ما تتفايع يا جواد بتروح تقيل كساس الفلسطيزيات عن زباب اليهود وحرر بلدك بعدين تعال إحكي عن الفياعة والحلاوة والموضة يا نسوان ولك شكلها اختك فاتحة كسها على مدار اليوم بتسكروش من زب لزب الله يعينكو على عقلكو شو انكو تافهين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

