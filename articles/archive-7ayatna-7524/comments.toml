text = "وين الملاين الشعب العربي الضمير العربي وين الشرف العربي وين الغضب العربي وين<br />خلص بكفي مسختووها الفلسطينية بحكو والأردنية بطنشو فهمنا ياالفلسطينية إنكم بتحبو بلدكم وأنا معكم بالإيشي هاد لإني فلسطينية بس بالمقابل إنتو كإنكم بتحكو مع حالكم عبيتو الصفحة بهادل والأردنية مطنشين ولسا بعيدو وبزيدو بنفس الحكي زبايل حثالة سفالة والله فهمنا حكي على حكي إعملو إيشي إفعلو بكفي كلام وحكي وما تفهمو من هالتعليق إني مع الأردنية بالعكس أنا أكتر وحدة على وجه الكرة الأرضية بكره الأردنية بس زهئت حكي وكلام من دون فعل وين المرجلة وين زلام فلسطين ولكم فلسطين صرلها 60 سنة تحت أيادي الصهاينة وفش نصر واله والله والله حرام الفلسطينية تشردو وتئتلو والناس بتطلع والفلسطينية بتنادي وبتحكي وما بتعملإيشي وبعدين مع هالحكي وبعدين لمتى راح نضل ننصرخ عالفاااضي!!!!!!!!"
