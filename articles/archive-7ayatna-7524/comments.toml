author = "أردني ومستعر من بلدي ومن جنسيتي"
text = "تفووووه عليك يالأردن وعلى ملكك المعظم (العظمة لله سبحانه ) وعلى شعبك الزفت .. اقسم بالله العظيم اني اردني ومستعر من كوني اردني لكني ماخذ احدى الجناسي الخليجيه .... وهذا ايميلي والي فيه امه خير يضيفني عنه اشوف alminhaly-333@live.com<br />ولكم يلعن ابوها الاردن والي جابها والي خلفها والي بيفتخر فيها والي مخدوع فيها وطزززززززز فيها ...<br />وانت يالأردني اتمنى اشوفك فيس تو فيس عقولتك حتى تشوف الرجوله عأصولها ...."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

