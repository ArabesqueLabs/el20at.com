text = "ولكوا صارلكوا دولة يا مخانيث.. ولكوا اي واحد منيك بيجي بحكمكوا.. اللي اجوا من الحجاز حكموكوا وقبلهم الانجليز ناكوا عرضكوا ولم تطلقوا طلقة زي بقية الشعوب ولم تثوروا ولم تنتفضوا لانها اتخن شوارب فيكوا بنشرى بتنكة تمر او عرام طحين<br />وبعدين هسة اليهود حاكمينكوا على الاخر ولو قالولكوا ارموا حالكوا في البحر الميت لرحتوا رميتوا حالكوا لانكوا شعب متمسح شعب رزيل شعب منحط لا يطال كندرة اي فلسطيني.. انتوا شعب بغة ولا تستحقوا العيش"
