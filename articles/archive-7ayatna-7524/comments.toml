[[comments]]
order = 184
subject = "حوار من تحت الزنار بقلم الدكتور : محمد عوض"
author = "فلسطيني أصيل"
text = "البداية رسائل شتم للدكتور محمد عوض :<br />From : mike hearo <mikehearo@yahoo.com>;<br />Sent : Sunday, 10 April 2005 11:02:23 AM<br />To : mahmoodaoad@hotmail.com<br />Subject : الف تحية<br />الف تحية لكساس بناتك و مراتك و خواتك . ولا اكيد ما بتفرق معك هيك مسبات لانك فلسطيني من دون شرف و علشان هيك انتو الفلسطينية ما بتفرق معاكم . ولك كندرة واحد اردني بتسوا الشعب الفلسطيني كله يا كلاب تركتوا بلدكم و هربتوا و بتحطوا الحق على الناس . بلدكم ضاع لانكم خونه و بعتوه لليهود . روح اسال بنتك اي يهودي نام معاه مبارح و اكيد برضاها مش غصب عنها لانوه انتوا الفلسطينية همكم الوحيد تجمعوا فلوس حتى لو كان عن طريق كساس نسوانكوا . بس بحب اذكرك كيف الكويتين ناكوا نسوانك و اتنوا مبسوطين والسبب انهم اعطوكم فلوس يا منايك . و كس اختك اخو قحبة mikehearo@yahoo.com<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />From : Rafa E. AL QUTAISH <alqutaish@yahoo.ca>;<br />Sent : Sunday, 10 April 2005 3:03:55 AM<br />To : <mahmoodaoad@hotmail.com>;<br />Subject : الله يلعن شرفك يالبعيد<br />ولك يا اخو الشرموطة شو عملولك بدو الاردن. . . هل ناكوا أو قودوا على اختك وبنتك . . . خليك شوي عقلاني يا منيك . . . شعب الاردن استضافكم وخلاكم مثل البشر . . . في حين الفلسطينيين في سوريا ولبنان حاطين عليهم شيط مثل \"البهايم\" او اضل سبيلاً . . . الله يفرجينا فيكم يوم . . . سبو على الانظمة . . . حرية رأي . . . اما تسبوا على الناس والعشائر ذات الاصول العريقة . . . مش مثل حضرتك . . . ما حدى عارف صلعت عوض جدك منين . . . اتوقع ان اصله نوري أو منيك . .<br />وبعدين . . . متى كانت شرق الاردن لشكالكم؟؟؟ اذا بدك ترجع للتاريخ القديم . . . انتم نصابين ماهرين . . . بعتوا اراضيكم وبيوتكم وحتى سطوح بيوتكم لليهود قبل 48 وبعدين صرتوا اتطلبوهم فيها نصب على اصوله....<br />الله ينتقم منك ومن اشكالك الذين يزرعون الفتنه بين البشر. . .<br />يامنيك<br />alqutaish@yahoo.ca<br />حوار من تحت الزنار<br />د. محمود عوض<br />أدرجت أعلاه رسالتين عبر بريدي الإلكتروني كانتا ردا على مقالي المنشور في عرب تايمز بعنوان \" مرتزقة بنو هاشم \" وحقيقة جاءت عدة رسائل أخرى من هذا النمط وكلها لا تخرج عن تفجر الغيظ الشديد للكشف عن مكنون النظام الهاشمي وكان ما يجمع بين الرسائل كقاسم مشترك هو توصيف المرأة الفلسطينيه بأنها عاهره ومنيوكه ووصف الفلسطيني بأنه خائن باع أرضه وعرضه .<br />هذا كلام ليس فيه جديد فقد سمعناه من مطاريد البدو وحثالة الشركس على مدى عقود وهو لم يعد يهز شعره في بيضات أي فلسطيني بل على العكس فهم كلما كرروا هذه الشتائم نزداد يقينا بأنهم مقهورون وهي حالة نتمنى أن يكونوا عليها كنوع من العقاب الإلهي .<br />غير أنه في موقف الرد الصريح فلا بد من القول أن هؤلاء البدو والشركس وبقيادة ملكهم .. لم يبيعوا وطنهم وذلك لهذه الأسباب .. فالبدوي الأعرابي يفتقر لحس الإرتباط بالوطن فهو في طبيعته دائم الترحال ووطنه هو المرعى والعشب فمن أين إذن للبدوي وطن حتى يبيعه.<br />وأما الشركسي فقد طلّق وطنه بالثلاثه واستوطن شرق الأردن ليزعم بعدها أنه صاحب الوطن الأصيل في شبه تكرار سمج للصهاينة .<br />وأما بنو هاشم فذاك وطنهم على مرمى حجر في الحجاز وهم تغافلوا عنه واستبدلوه بشرق الأردن.<br />وعلى الأقل فالفلسطيني ما زال يطلب العوده ؟؟ فمتى سيطلب العودة فلول الشركس ومطاريد بني هاشم ؟<br />وأما الطعن في شرف الفلسطينيات فهذه واحده منهن هي ( رانيا ) توجوها عليهم ملكه وقبلها علياء شرفت التاج فوق رأسها بل وأميرهم محمد عقد على فريال إرشيد .. فهل على الأرض شعب يأتي بعاهرات ليكن ملكات وأميرات ( الملك عبدالله نام مع عشرات البنات الاردنيات من بنات العشائر ولكنه لما اراد الزواج اختار فلسطينية ) .. ولسنا ننكر أنه في كل شعب شواذ عن القاعده والفلسطينيه حين تزني لها رأسمالها من جمال ودلال وهي تقبض لكن الأردنيه تدفع قبل أن ترفع بل وأخذت تلجأ لملء حقيبة يدها بحبوب الفياغرا حتى لا تعود بخفي حنين .<br />إجمالا ليس كل الأردنيات ( يرفعن بالمجان ) فهذه أميرتهم هيا الحسين بيعت في مزاد الإسطبلات لعجوز متصابي فحمل أخبارها الركبان ..<br />هؤلاء الذين يزعمون بأنهم أردنيون لعلهم يتذكرون أنه لم يسبق في التاريخ أن حظي زطي غجري نوري بلقب باشا سوى عندهم .... هل نسيتموه إنه سعيد باشا النوري .. وعبر التاريخ لم تنفضح ملكه بقدر ما إنفضحت زين بقصة عشقها لفوزي الملقي - ابو هاني - ( راجعوا مذكرات خادم مصري في مجلة روز اليوسف أواخر الحمسينيات ).<br />الحديث عن نذالة من يسمون ( بالأردنيين وهم ليسوا أردنيين ) حديث يطول وذو شجون وهو يطيب للسامر وللساهر ولما كان الوقت من ذهب وهؤلاء القوم من تنك فقد رأيت أن لا أستطرد لتكون جولة أخرى تجعلهم حتى يخجلون من النظر في عيون نسائهم وأطفالهم .<br />أرادوا أن يحصروا الشتيمة بيني وبينهم فذهب بهم ظنهم أن أكتفي بالرد عليهم عبر البريد الألكتروني ولكنني آثرت أن يقرأ الناس من زوار عرب تايمز ذلك أنه إذا نشر الغسيل الفلسطيني والغسيل الأردني على الأسطح فبالتأكيد ستكون كلاسين الأردنيين رطبة بالمن لا بالسلوى .. وقد تتطاير مع الهواء كوفياتهم لتظهر عليها دمغتها الأصليه ( نجمة داوود ) .<br />أرى أنني أدخلته فيهم بدون بصاق ولكنهم يا أخي ( وساع للآخر ) فادفع بذراعك مع ذراعي فعسى يحوق في مؤخراتهم .<br />بحمار واحد باع الأردنيون جبل نزال .. فكم ترى يساوي الحصان الذي أهداه ملكهم لشارون ورده خائبا ؟"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

