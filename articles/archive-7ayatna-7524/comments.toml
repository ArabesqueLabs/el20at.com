subject = "حدث في الجامعة الاميركية ببيروت"
author = "ريم (بحرينية)"
text = "هذا الحوار جرى بين طالب فلسطيني واخر اردني يدرسان في الجامعة الاميركية في بيروت.. وانا شاهدة عليه..<br />الطالب الفلسطيني حصل على معدل 98.6 في الثانوية العامة وهو يدرس على حسابه في الجامعة بينما الطالب الاردني حاصل على معدل 69 وهو مبتعث من جهة ما في الاردن ليدرس الادب الانجليزي..<br />كان الطالب الفلسطيني محافظا<br />على اداء فرائض الدين في<br />الجامعة يتوضأ للصلاة, فصاح فيه الطالب الاردني غاضباً كيف تغسل قدميك في حوض نغسل فيه وجوهنا ؟<br />(إنها حيلة الذئب المعروفة مع الحمل). فقال له:<br />الطالب الفلسطيني: كم مرة تغسل وجهك في اليوم؟<br />الطالب الاردني: مرة واحدة في كل صباح طبعاً.<br />الطالب الفلسطيني: أما أنا فأغسل رجلي على الأقل خمس مرات في اليوم.<br />ولك أن تحكم بعد ذلك أيهما أكثر نظافة رجلي أم وجهك؟!!."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

