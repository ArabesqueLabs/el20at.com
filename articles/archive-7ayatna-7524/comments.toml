[[comments]]
order = 91
subject = "شكري ابن الكلب"
author = "الأردن أولا"
text = "ولك شكري يا ابن المنيووكة يعني ازا حكيت هالكلمتين مفكر حالك صرت ايشي ولك طز فيك وباكبر منيك فلسطيني<br />كلك عبعضك انت وكلامك ما دخل راسي آل العلم ومتى تأسست ليش انت من كل عقلك مفكر انو في ايشي بالعالم اسمو فلسطين ولك يا مشرد روح رجع بلدك ازا انت زلمة ولا بس جاي تتشاطر بكمن كلمة حكيتها اصلن انتو كلكو الفلسطينية هيك بتعيطو وبتشفقو الواحد عليكو وبدكو الناس تحرر بلدكو وانتو اعدين عالنت والشات والحكي الفاضي ولك كس اخت احسن فلسطيني روح حرر بلدك بعدين تعا احكي على القليلة في دولة اسمها اردن مش متل بلدكو تغيرت لإسرائيل ولا تحلم حتى بالحلم وانت نايم انها ترجعلكو بلدكو"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 92
subject = "اهداء لكـــــــــــل الأردنييييين (كلمة حق )"
author = "الفلســــــAـــــطينية"
text = "اهداء خاص لكل الاردن<br />ولكم يا غجر يا نور يا مشرشحين يا نوريين يا مشرتحين مش شايفين شي شكلكم<br />انتو بتعرفوو شو يعني بلد اصلا ووطن يا تيوس فكرووو شوي بتلائو انو الزبالة همي غزاة الوطن صار عدد الزبايل اكتر من عدد الاردنيين و الحشرات الل فيها يا قذارة يا بيئةة آل وطن .... السياح نفسهم لما يدخلوها بحرموو يرجعولها و مبسوطين بالبترا هايشين فش غيرها الله يثبت العئل و الدين يا رب و ازا كلامي غلط روحو افتحو موسوعة غينيس للأرقام القياسية صفحة 273 ملاحظة ( حتى رقم الصفحة مخردع ههههه) مكتوب عن اكبر تجمع زبايل بالعالم موجود بالاردن و هو البلد الوحيد الحائز ع هاد اللقب حتى مصطلحاتكم غبية زيكم آل طقع روحو اطقعو حالكم احسن روحو بيعو علكة و اللي مش عاجبو الحكي في مليون الف حيط عندكم اخبطو راسكم فيه<br />كلمة اخيرة ما تكتبولي شكر عشني وصفتكم احسن وصف بديش هالشكر تعجز كلماتي عن وصفكم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

