[[comments]]
order = 491
subject = "الى كل الاردنيين ... هام جدا!!!!"
author = "فلسطيني بكندا"
text = "انا فلسطيني واستغرب من كل الارنييي الي يكرهونا، ولكم شو عملولكم الفلسطينية حتى تكونو حاقدين عليهم لهدرجة؟ والله مرة سمعت شلة شباب اردنية كانو يسبو الطفل الشهيد محمد الدرة !!! والله انو اليهود يستحو يسبو طفل ميت !!<br />ولكم الفلسطينية خسرو بلدهم بسببكم انتو العرب، وكل ماكانو بدهم يحاربو اسرائيل يفشلو بسبب خيانة العرب، ايلول الاسود وحرب لبنان و مصر عملت اتفاقية السلام وتبرت من الموضوع كله!! مين اللي ضحك على الفلسطينية وباع ارضهم ؟ مو العرب اللي كل واحد صار يساوم على القضية؟ وبعد ماخذ اللي بدو اياه راح لف طيزو وقال انامالي دخل؟ مين هذولا الهاشميين؟ مين جاب الامير عبدالله ومقابل شو حطو امير على الاردن ؟ ومقابل شو ساعدته بريطانيا عشان يعمل مملكة الو ولاحفاده؟<br />ولكم الفلسطينية شعب منكوب بطالب بارضه بوطنه مابدو ينساه ، روح الافتخار اللي موجودة فينا هدفها انو ماننسا فلسطين، مو لانو احنا نكره الاردنية او اي جنسية عربية .<br />عيب عليكم عيب والله، ولكم لو انتو رجال ماترضو انو بريطانيا تحط عليكم واحد غريب يحكمكم خاوة فلسطيني معفن عنكم، اقول لكل اردني يسب ويكره الفلسطينية: انت رجل ؟ من عشيرة نشامة وشجعان ؟ روح ورجينا رجولتك وشجاعتك على العيلة المالكة (الهاشميين) اللي حاكمينك خاوة وراكبيين على ظهرك انتا وجدودك !!! مو تروح تتشاطر وتتمرجل على الفلسطينية !!! مابدك تشوف فلسطينية بالاردن ؟ روح اطلب من الملك او اقتلو وخذ الحكم لو انت رجل !!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 492
subject = "الآن فهمت"
author = "سفيان الثوري"
text = "أول شيء أريد ان أقوله أنني جزائري وأعيش في الجزائر وقد بلغني عن طريق صديق ما جرى ويجير في هذا الموقع من كلام وأعاجيب وإتهامات من هنا وهناك وشتائم أيضا<br />أتمنى أن يصل صوتي لكم جميعا كأردنيين وكفلسطينين أنا من الجزائر أقول لكم بالله عليكم كفى .................. بالله عليكم كفى جدالا عقيما وكفي من الكلام الذي لا يقدم ولا يؤخر كفى نشر غسيل أمام العالم كله كفى من الإتهامات الباطلة والتي بلا دليل<br />أريد أيضا أوجه رسالة إلى السيد الأردني أنه أدمى القلب قبل العين عما قاله بحق فلسطين ويضحك المسكين ويسخر من شعب فلسطين ويطالبهم بإرجاع أردهم وكأنها لا تعنيه كأن القدس لا تهمه يضحك لأنه مرتاح في بلده أدام الله عليها السلم والهناء يضحك من الناس التي تموت كل يوم وهي تدافع عن بيتها وأرضها ومقدسات الأمة .................... والله هذا هو العجاب بعينه<br />ثم الأخ الوليد الذي يحمل كل الشعب الأردني الواعي والمثقف أخطاء حكامه وينسب إليهم الخيانة العظمى والتفريط بمقدسات الأمة رغم كل الفضل الكرم الذي ينعم به الفلسطينيون في بلدهم الثاني الأردن<br />وكنت أود قرآءة المزيد غير أني تألمت كثيرا ولم أستطع الإكمال لأن معظم الكلام كان خارج عن نطاق العقل والنقاش السليم وتافه وساقط في كثير من الأحيان<br />ما أريد أن أقوله أن الحرية تأخذ ولا تعطى ولا تنتظروا يا فلسطينين لا أردني يحميكم ولا جزائري ولا غير ذلك نحن في الجزائر بقينا تحت الإحتلال 132 سنة وقيل عنا الكثير من الكلام الجارح والإتهامات التي بمعنى والتي بلا معنى ولكن في نهاية المطاف لم يخرج الجزائر إلى النور لا المغرب ولا تونس ولا ليبيا ولا أي بلد آخر .................. من أخرج فرنسا بعدما بنت وشيدت وإطمأنت بأن الجزائر أصبحت قطعة من فرنسا هو الشعب الجزائري وحد لا غير وهذا لا يمنع أن الثورة كانت تتلقى مساعدات من الدول المجاورة<br />فلهذا أخوتي الفلسطينيين لا تنتظروا أحد ولا تضيعوا الوقت فيكفي ما ضاع ولا تلتفتوا للكلام الذي بلا معنى<br />من ساندكم فهو مشكور .............. وهو يساند أمته ومقدساته ودينه وضميره<br />ومن خدلكم فلن يضركم وقد خان أمته ومقدساته ودينه وضميره<br />ويا أهل الأردن الكرماء ويا أهل سوريا الشرفاء ويا أهل لبنان الأبطال ويا أهل مصر الأنصار عليكم بالتوحد ونبد العنصرية والعمياء ورفقا بالفلسطينيين ولا تكونوا مع أعدائهم عليهم .....................................<br />أنا مع فلسطين ظالمة أو مظلومة<br />أخوكم سفيان الثوري<br />http://as7ab.maktoob.com/soufian11"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 493
subject = "الى السعودي (حر) وهو العبد لاسياده"
author = "مالك العمرو"
text = "طبعا اسمك المستعار لن يمر علينا.. ايها الاردني القذر.. كما هي عادتكم يا سقايط في الاصطفافات الماجورة مع السعودية والكويت ودول الخليج لانكم الشحادين بامتياز على ابواب الخليجيين وخصوصا السعودية.. اذا ملكوا الميت حسين مرض وراح على مايو كلينك واللي دفع الفاتورة ملك السعودية الحالي عبدالله.. مع انه حسين كان معه المليارات تركها لنور الاميركيانية من شان تبرطع فيها هي وعشاقها..<br />يا من تقول على نفسك سعودي حر.. وانت اردني حقير ونذل.. تقول ان الفلسطينية الفلسطينية كانوا شبعانين يوم ما كنت انت حافي وجعان والكرم اللي عند الفلسطينية امثالك بدهم سنين يتعلموا في مدرسة الكرم الفلسطينية.. واما شتمك وسبك للعرض فهذا ليس مستغربا.. لان فاقد الشيء لا يعطيه.. يا من امهاتكوا انتاكن من الانجليز ومن الاتراك ومن كل الحملات التي شنت على المنطقة طول عمركوا شعب خانع تافه لا يعرف معنى الجهاد ولا النضال ولا المقاومة وكل غريب اجا وحكمكوا بالصرماية.. وعلى كل حال حتى لو كنت سعودي يا منيك.. فقبل ان تسب على الشرفاء في هذه الامة اذهب الى اسيادك في البيت الابيض اللي حاكمنيكوا بالبسطار وانتوا مجرد نواطير على النفط الاميركي في جزيرة العرب انتوا وحكامكوا اللي اصلهم من خيبر"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 494
subject = "الى اردنية وافتخر"
text = "ما حدا باع الارض غيركم يا سقايط يا رخاص يا حثالة العرب.. انتوا وملوكوا قبضتم الثمن دراهم معدودة.. راجعي مراسلات الحسين مكماهون ورسائل المقبور عبدالله الاول اللي بتقولي عنه حفيد الرسول..<br />حكامكم نعم احفاد ابو لهب وابو جهل ليس الا..<br />واما انتم كشعب حثالة فستعرفون عاجلا ام اجلا انكم بعتم الارض والعرض.. والان الصحف الاسرائيلية تكشف عن بيع الاردنيين لعشرات الالاف من الدونمات في جلعد -السلط والزرقاء وطريق المطار وانا غدا لناظره قريب يا شرموطة يا كلبة بنت كلب يا بنت الخنزيرة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 495
subject = "عجبي"
author = "ابن سوريا"
text = "اعجب كثيرا لامر الاردنيين.. هذا الشعب النكرة في التاريخ العربي المعاصر... هم وحكامهم صنيعة الغرب الحاقد.. هؤلاء يطلقون على انفسهم كلمة نشمي ونشمية ونشامى.. وهم اوسخ واقذر خلق الله. ثم يتطاولون على من.. على الشعب الذي تامروا عليه وباعوا ارضه.. على شعب فلسطين الذي تحدث عنه رسولنا الكريم صلى الله عليه وسلم.. الشعب الطاهر والارض الطاهرة..<br />خسئتم ايها الارادنة القذرين فمصيركم الى مزبلة التاريخ"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 496
subject = "الى اردنية وافتخر (طبعا تفتخر بطيزها)"
author = "نسر فلسطين الشامخ"
text = "طبعا انا اتفق معك ان الذي قتل المقبور عبدالله الاول هو كلب ابن كلب.. اتعرفين لماذا .. لانه خائن.. خائن لانه لم يكمل على بقية افراد هذه الطغمة الزبالة الخرة.. كان عليه ان يكمل على المقبور حسين ربيب الصهيونية والامبريالية والماسونية العالمية..<br />اما انتم كشعب يا اردنية.. فلن اقول فيكم شيئا .. لسبب بسيط.. هو ان البهايم بتفهم اكثر منكوا.. وانتم مجرد حشرات يجب ان تداس بالاقدام مع الاعتذار من الحشرات.. وصدق فيكم الشاعر مصطفى وهبي التل حينما قال<br />بصرماية بعه فما هو موطني ولا اهله اهلي ولا انا اردني<br />فكل انسان شريف يجب ان يتبرا من هذا الشعب القذر المرتزقة.. الذين هم بالفعل يهود العرب"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

