subject = "الحمد لله بدأ الخير يظهر والحق يعلو"
author = "عربي مسلم"
text = "يا بن عمي همك همي .....<br />الأخت العربية ..... أضع كلامك تاجا\" مشرفا\" على رأسي ..... وبارك الله فيك وفي كل من يبادر الى بث الكلمة الطيبة ...ولنبدأ جميعا\" نحن الخيرين بطمس هذه الأصوات ... وليعلوا صوتنا ..... والحق يعلو ولا يعلى عليه<br />والعزة لله ولرسوله وللمؤمنين"
