text = "هل تعلم أن الأردن أجرب بلد بالعالم!!<br />هل تعلم أن الأردن أكتر بلد فيها قمل وسيبان وأن القمل وسيبان مدحوش بين الزباب والكساس!!!!!!<br />هل تعلم أن الأردنية لما بدهم يسقوو الزريعة ويتحموو ويغسلو السيارة الزلمة فيهم بمد زبو خمسة متر عشان يحمم ولادو ويغسل سيارتو ويسقي الزريعة (((((عشان يوفي ماااي))))) وإنو الشامبو هو الزبد ((الحيوان المنوي)) بدير نصو على شعر عيلتو كل هاد توفير!!!<br />شو رأيكم بالمعلوومات رهيبة صح<br />ولسا راح أجبلكم فضاايح أكتر من هيك بس إنتو أصبرو علي -_-"
