order = 70
subject = "الفلسطينية"
author = "ابن فلسطين"
text = "الاردنية ارذل شعب بالعالم بديش اكتر كلام بس خليها عالله يا اردنية انت عفكرة شعب حقير لا يطاق ,<br />و اللي تعليق عاللي بحكي انو الشب الفلسطيني داير عالشات و هالشغلات هو في ناس هيك وهيك بس هادي الفئة قليلة ما بتشكل 1% من شباب فلسطين اللي عالنت<br />لعلمكم انو ازلم شعب بالعالم الشعب الفلسطيني و لكم لو عايشين عنا بالبلد بتعرفو شو بحكي و بعدين مين حكا فش مقاومة انزلو عغزة شوفوا المقاومة اليهود بسترجوش يدخلو عليها لغزة بس قصف بالطيارات اما تدخل قوة برية بطلعو كلهم مقتلين بلاش غزة يا عالم خدوا نابلس كل يوم المقاومة الله يعزها و ينصرها بتقتل يهود خدوا اي منطقة بفلسطين بتحداكم ان ما كل يوم بموت فيها يهودي بس العتب عالاعلام اللي ما بجيب كلشي بصير عالعموم انا فلسطيني و مسلم و افتخر<br />ابن كتائب الاقصى - فلسطين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 71
subject = "يا ابن فلسطين .."
author = "خالد الهزايمـــــــــــــــــــــــــــــــــــة ."
text = "أولاً يا فلسطيني وقبل ما أعلق على كلامك اللي مثل وجهك .. ولك أنتا فقدت أدبك واحترامك وتقديرك للناس .. أنتا واحد حشرة . مرتزقة . تافه . واطي . حقير . وسخ . منحط وسافل ..<br />ولك أنتا لو فيك ذرة احترام وتقدير كنت مابتحكي كلامك هاذ اللي بدل إنك واحد مش متربي وأهللك \" وللأسف الشديد \" ماعرفوا يربوك .ز أخص . أخص على الزلم !!!<br />ولكو أنتو مين اللي سامعلكو، قاعدين عم بتعو وبتنبحو ياكلااااااااااااااااااااب !<br />جبلي واحد فلسطيني بفهم أو عندو استعداد يفهم !<br />أنا بقول أنو الشعب الفلسطيني ودع .. وعمرو مارح يصير بني آدم مادام هذوله الحثالة .. المرتزقة قاعدين عم بوسخو بسمعة فلسطين وأهلها .. هذوله اللي لو بدك تعدهم بطلعوش عدد أصابع إيدك !<br />هذوله اللي بحطهم من قائمة \" الأغبياء وبلا حدود \" ؟!<br />ابن فلسطين .. لاتكابر كثير . وخليك ابن ناس وعالم . وصير بني آدم خلي الناس تحترمك وتقدرك . وإذا ظليت هيك صدقني<br />رح يندعشس عليك زي مابندعس على النملة . أو الناس بتعتبرك خيال بخيال . يعني إنسان ما إلو وجود !!<br />اصحى . اصحى . ترى مافي وقت للنوووووووووووووووم ."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 72
subject = "يا حيف على هيك شباب"
author = "عربية مسلمة"
text = "إلى كل شاب وشابة عربية مسلمة .......<br />فلسطينية وبفتخر واللي مش عاجبو ينتحر ويكتب على قبرو واحد منئهر حاول يتحدا فلسطينية وما إدر..<br />أولا يا الأردنية بالله عليكم تحكولي إنتو شو أصلكم يا قليلين الأصل ياللي ما عندكم أصل أساسا الأردن ما كنلها خارطة إجت من العدم من ولا إيشي بعدين حبايبي إحكولي العااااهل الأردني من وين أخد ولك لف ودار ما لاقى أحسن من الفلسطينيات وهي الملكة رانيا طبعا وعلى القليلة فش شب فلسطيني بركض ورا أردنية آل شو بنات الأردن المدقدقات ونسوان الأردن لما يتئاتلو بتئاتلو بقطع الجميد متل النور والشب الأردني أول ما يصير عمرو 18 برمح ورا فلسطينية متل القروود ليش الجواب بسيط لإنو أبشع وأشنع بنات بالعالم هما بنات الأردن وغير هيك لإنو بنات فلسطين بنات إلهم أصل وعزة وشهامة وكراامة وآل شو آل الأردني بكل حقاارة ونذاالة جاي يعلق بكلالامو السخيف التافه ولك يا ككة إنت بتعرف شو الأردنية ......الأردنية هما عبارة عن حثالة من فلسطين لإنو فلسطين بتجع حثالة وزبالة وبتكبها في سلة النفايات وهي بتعرف إنو الأردن أكبر سلة مهملات بالعالم هع هع هع هع<br />يلا ككة أفندي روح إتفلسف على أمثاالك يا ضرطة يا فسوااا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

