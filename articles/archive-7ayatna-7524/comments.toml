subject = "................"
author = "محمد التميمي"
text = "أنا بالبداية فلسطيني أردني ( أي أنني أحمل وأتمتع بالجواز الأردني ) ،والله على ما أقول شهيد بإنو الناس الاردنيه ناس أولاد أصل وفصل . وأهل حمية ونخوه وشهامة وشجاعة وفزعه .. وأنا الصراحة زعلان لكلا الطرفين مع بعضهم البعض ..<br />طيب والله العظيم إني أنا متزوج اردنية وأخوي نفس الإشي ومافي بينا مشاكل وأصلاً احنا والأردنية اهل وحبايب وعمرنا ماحكينا إنو هاذ فلسطيني والثاني اردني قسماً بالله إني وأنا بقرا التعليقات اللي فوق إنو قلبي وجعني على اللي قاعد عم بصير فينا يعني لهدرجة أحنا اعداء وكل واحد منا حامل سلاحو ورا ظهرو ومستعد يقتل الثاني،، طيب ليش هيك يعني ؟؟؟؟؟؟؟؟؟؟؟<br />وبالنهاية الاردنية على راااااااااااااااااااااااااااسي من فوق وايضاً الفلسطينية (و بحكم إنها بلادي اللي عمري ما رح انساها ماحييت ) .. وطبعاً الأردن إلها معزة خاصة بقلوبنا والله يحفظ الأردن من كلب شر ومصيبة والله يطلو بجلالة مكلنا الهاشمي المعظ عبدالله الثاني الل يعمرو بحايتو ماقصر مع الشعب الفلسطيني الأبيّ<br />وأخيراً أدعو كل الاخوان اللي قاعدين بسبو وبشتمو على الفاضي يبطلو شغل الهبل هاذ ويرجعو لصوابهم لإنو الوضع مش مستحمل أكثر من هيك . ويا فلسطيني ( أرجو إنك توخذي كلامي بجدية شوي ) يعني والله نا بحكي عشانك مش عشان فلطسين ولا عشان الأردن لا بالعكس كلنا بالنهاية عرب والله إنكو بتخلو الواحد يبكي على هيك وضع !!<br />أختي إذا كان هناك شوية عقلانية ( ولاتتفميني غلط ) إنك تبطلي تسبي على الأردنية ّ!!<br />وكذلك يا عاشق فلسطين أنات كمان<br />وكل إنسان فلسطيني موجود على هاي الصفحة<br />محمد التميمي (( الأردن أولاً ,,, وفلسطين بالقلب ))"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 434
subject = "تواطؤ عبر الاردن - كتاب اسرائيلي"
author = "ابو قتادة"
text = "بسم الله الرحمن الرحيم<br />((تواطؤ عبر الاردن )) كتاب الفه اثنان من الصحفين والكتاب الاسرائيلين هما يوسي ميلمان ودان رفيف يوضح علاقة الاسرة ((المنسوبة الى بني هاشم ظلما وزورا وبهتانا)) باليهود وزعماء الحركة الصهيونية منذ بدايات القرن الماضي وسوف اسرد لحضراتكم ملخصا لما ورد في الكتاب مع الاستعانة الحرفية ببعض النصوص كما جائت في الكتاب وسيكون ذلك فيما بين الاقواس فيما يلي من الكتابة ويبلغ الكتاب اكثر من 200 صفحة مليئة بصور الخيانة والغدر اللتان كانتا ملازمتان للعائلة المالكة في الاردن هذه العائلة المنسوبة الى اشرف بيت على وجه الارض الا وهي بيت النبوة الكريم على صاحبه واله افضل الصلاة واتم التسليم .<br />وقد يقول قائل كيف نصدق ماجاء على لسان يهوديان عن اشخاص المفترض انهم ((مسلمون)) والجواب على ذلك يكون على النحو التالي :<br />1) جل ما ذكره الكتاب معروف عند الكثير من الخاصة والمطلعين وسبق تداوله بشكل غير متعمق في الكثير من المحطات الفضائية والصحف وغيرها .<br />2) أن الكتاب كتب من وجهة نظر اشخاص يهود ولم يكونوا يقصدون الاساءة الى تلك العائلة انما اردوا ان يوضحوا لليهود مدى اخلاص اولئك الحكام لاسرائيل ومدى وفائهم لتلك الدولة وعليه فلم يذكر الكاتب كلمة خيانة ولو مرة واحدة بحق اولئك الحكام انما وصفهم دائما بالشجاعة والعقلانية ...الخ .<br />3) أن هذا الكتاب لم يكن معظم المقاطع الهامة فيه من دون مراجع موثقة وقوية وسوف نورد في نهاية الجزء الاخير جميع المراجع والمصادر للمعلومات لذلك الكتاب حسب مااورده المؤلف .<br />وقد وصلني هذا الكتاب بواسطة أحد الاصدقاء من لندن حيث أنه ممنوع من التداول في معظم الدول العربية وقد اخترت أن يكون سردي للاحداث على جزئيين وعلى بركة الله نبداء :<br />((الجزء الاول ))<br />((عبدالله يستقر في الاردن))<br />يورد الكاتب كيف قام عبدالله جد الملك حسين قبيل الحرب العالمية الاولى بزيارة الى اللورد كيشنر المندوب السامي وحاكم مصر العام وأن هذه الزيارة أدت فيما بعد الى انشاء المملكة الاردنية الهاشمية حيث أتت الحرب العالمية فيما بعد ووجدت بريطانيا نفسها أنها محتاجة الى الشريف حسين بن علي والد عبدالله بغرض اعلان التمرد على الخلافة الاسلامية العثمانية التى دخلت الحرب ضد بريطانيا وفرنسا ولكن الشريف حسين اكتفي باعلان (( انه لم يستجب لطلب السلطان بالانضمام الى الجهاد ضد البريطانيين )) وتلك في حد ذاتها خطوة خيانة كبيرة حيث امتنع هذا الشريف عن تلبية نداء الخليفة بالجهاد والنفير العام وقد اتضح أن هدف الشريف حسين هو (( تجنيد الامة العربية لخدمة مصالح بريطانيا وحلفائها في الحرب ضد الالمان والامبراطورية النمساوية والاتراك ومقابل ذلك طلب من بريطانيا أن تصدر اعلانا مؤيدا للاماني الوطنية للعرب بزعامته اذا انه اعتبر نفسه الناطق بلسان الامة العربية )) وبرغم أن بريطانيا لم تعطي وعدا قاطعا للشريف بما يريد الاانه اعلن في يونيو 1916م الثورة العربية الكبرى ضد الخلافة الاسلامية العثمانية وقد اشتهرت تلك المراسلات بمراسلات حسين – مكماهون وفي تلك الفترة وبعد انتهاء الحرب بانتصار الحلفاء جاء وعد بلفورعام 1917م ملبيا لطموح الحركة الصهيونية بزعامة هرتزل . وفي نوفمبر 1920م وصل عبدالله ابن الشريف حسين الى مدينة معان الواقعة شرقي الاردن – والتى كانت جزءا من مملكة والده الشريف حسين حيث كانت تابعة للحجاز وكلمة شرقي الاردن تعني المنطقة الواقعة شرق نهر الاردن المار في فلسطين من الشمال الى الجنوب ويصب في البحر الميت وينبع شمالا من منطقة اليرموك المشهورة . وقد وافقت تشرشل على منح شرقي الاردن لعبدالله ابن الشريف حسين كنوع من رد الجميل للخيانة التى قامت بها الاسرة خصوصا بعد تزايد هجمات ال سعود مناطق الحجاز بدعم من بريطانيا ودفعت الحكومة البريطانية مبلغ 5000 جنيه استرليني سنويا لعبدالله ثم زاد المبلغ ليصبح في اقل من سنتين 150000 جنيه استرليني لتوطيد دعائم حكمه ولضمان شراء القبائل وتجميعها من حوله . وفي عمان تم الحاق اول ممثل بريطاني بعبدالله وكان يهوديا اسمه ابرمسون وفي عام 1923هـ احتاج عبدالله وكذلك عبدالعزيز ال سعود الى بريطانيا لمواجهة تقدم الاخوان الذين تمردوا على عبدالعزيز ال سعود وأرادوها جهادا لفتح البلاد الاسلامية المجاورة وتوحيدها وضمها فقد وصلت طلائعهم الى حدود مدينة عمان الحالية وكذلك وصل تقدمهم من ناحية العراق الى حدود البصرة فقامت بريطانيا بحرقهم بواسطة الطائرات بعلم وتخطيط بين كل من عبدالعزيز ال سعود وعبدالله بن حسين ملك الاردن وفي عام 1925م قام عبدالعزيز ال سعود وبالتنسيق ودعم من بريطانيا بطرد جميع ابناء الشريف حسين الى خارج الحجاز نهائيا والى الابد .<br />((كلوب باشا))<br />في عام 1930م دعي طابط بريطاني شاب يدعى جون باجوت غلاب ((كلوب باشا)) من الخدمة في العراق لكي يشرف على تأسيس جيش نظامي لهذه الامارة الصغيرة المصطنعة وبقي كلوب هذا قائدا عاما للجيش العربي في الاردن لمدة 26 عاما تالية ؟؟؟؟ أي انه كان قائدا للجيش الذي دخل الى فلسطين لتحريرها من اليهود عام 1948م ؟؟؟؟؟ . والتاريخ يؤكد أن هذه المملكة حكمت خلال تلك الفترة من ثلاثة اشخاص هم عبدالله بن حسين وكان مجرد واجهة لتنفيذ الاوامر الصادرة من الحكام الفعليين وهم (( كلوب باشا )) و (( المقيم البريطاني كيركبرايد)) .<br />(( مئيـــــر ))<br />(( ان معظم مميزات العلاقات الحالية بين الاردن واسرائيل تعود الى العلاقة الخاصة التى نشأت بين عبدالله والحركة الصهيونية انها عبارة عن شبكة علاقات معقدة من الاتصالات توجد- بعكس الرأي السائد الذي يرى في النزاع العربي الاسرائيلي نزاعا بين طرفين – لعبة مثلثة : اسرائيل و الاردن وفلسطين )) ص37 بيد أن اصل العلاقة لم يكن مع عبدالله ابن الشريف حسين فأصل العلاقة يعود الى عام 1919م عندما اجتمع فيصل ابن الشريف حسين مع وايزمن وذلك بتاريخ 3/2/1919م وقد وقع فيصل (( اتفاقية صداقة بين الدولة اليهودية وجارتها الدولة العربية وجاء فيها : تحدد بعد اتمام مشاورات السلام مباشرة الحدود النهائية بين الدول العربية وفلسطين من قبل لجنة يتفق على تعينها من قبل الطرفين المتعاقدين . عند انشاء دستود ادارة فلسطين تتخذ جميع الاجراءات التى من شأنها تقديم أوفى الضمانات لتنفيذ وعد الحكومة البريطانية المؤرخ في الثاني من نوفمبر 1917م ويجب أن تتخذ جميع الاجراءات لتشجيع الهجرة اليهودية الى فلسطين على مدى واسع والحث عليه وبأقصى مايمكن من سرعة لاستقرار المهاجرين في الارض )) ص 39 أيها الاخوة القراء ان هذه الاتفاقية وقعت عام 1919م في وقت لم تكن فيه اسرائيل قد ولدت بعد وهذا الشريف فيصل ابن الشريف حسين يوقع مع وايزمن بالاحرف الاولى اتفاقية لضمان تنفيذ وعد بلفور ولضمان الهجرة اليهودية الى فلسطين ...أي ظلم وقع عليكم ياشعب فلسطين من هؤلاء الطغاة اللهم أنتقم من الحكام الطواغيت الذين باعوا ارض الاسراء والمعراج من أجل 150000 جنيه استرليني سنويا باعوا الارض التى جاءها محمد ابن عبدالله صلى الله عليه وسلم – جدهم كما يزعمون – وصلى بها اماما بجميع الانبياء ثم عرج به منها الى السماء فهل رأيتم خيانة للتاريخ أكثر من ذلك ؟؟؟ حسبنا الله ونعم الوكيل .<br />وقد نشرت صحيفة التايمز اللندنية في 12 ديسمبر من عام 1918م تصريحا للشريف فيصل جاء فيه (( ان الفرعين الرئيسيين للعائلة السامية العرب واليهود يفهم كل منهم أخاه وكلي أمل بأنه بعد تبادل الاراء في مؤتمر السلام المرشد بمباديء تقرير المصير الوطني ستتقدم كل من الامتين بنجاح نحو تحقيق طموحاتها ان العرب لايضيقون ذرعا باليهود الصهاينة وهم عاقدون النية على معاملتهم على مايرام وقد أكد اليهود للوطنيين العرب نيتهم الحرص على أن تكون معاملتهم على مايرام في المناطق التابعة لكل طرف )) ص 39 سجل ياتاريخ خيانة تلك الاسرة لله ولرسوله وللمؤمنين .<br />وفي مارس من عام 1933م قال عبدالله ابن الشريف حسين مايلي : (( سيجد اليهود في كل العالم في شخصي لورد بلفور جديد ، وأكثر من ذلك لقد منح بلفور ارضا ليست له وأنا أتعهد بأرضي )) ص 41 صدق عبدالله لقد وجد اليهود في شخصه بلفور افضل من بلفور الحقيقي كما قال . وقد منحت الوكالة اليهودية الرمز(( مئير )) للشريف عبدالله بن الحسين في مراسلاتها واتصالاتها به .<br />((استرتيجية عبدالله بن حسين ))<br />قامت استراتيجية عبدالله ابن الشريف حسين في الاعوام 1947 الى 1951 على الاسس التالية :<br />1) العداء التام للزعامة الفلسطينية بقيادة مفتى القدس الحاج أمين الحسيني .<br />2) طموحه لاسترجاع مجد الهاشمين عن طريق اقامة اتحاد عربي يرأسه هو وأبناءه<br />3) اعتماد مطلق على بريطانيا في الامور العسكرية والمالية والسياسية وغيرها .<br />4) انعدام العداء للفكرة الصهيونية وفكرة اقامة وطن لليهود على اشلاء شعب فلسطين .<br />((وفي عام 1946م اعترف الملك عبدالله ل الياهو ساسون – من كبار دبلوماسي الوكالة اليهودية بأن هدفه هو التقسيم ومنع قيام دولة مستقلة للفلسطينين .)) ص 43<br />وفي 17/11/1946م التقى عبدالله بزعماء الوكالة اليهودية سرا في عمان وقال لهم مانصه (( انا موافق على التقسيم بشرط أن يكون على نحو لايجلب لي العار )) ص 44 وبعد اسبوعين من هذا الاجتماع اصدرت الجمعية العامة للامم المتحدة في 29/11/1946م قرارها بانهاء الانتداب البريطاني و بتقسيم فلسطين الى ثلاثة اجزاء هي 1) دولة يهودية تشمل معظم مناطق الساحل والنقب 2 ) دولة عربية في بقية مناطق القدس وضواحيها 3) دولة عربية في بقية مناطق فلسطين . قبل اليهود بذلك القرار ورفضه شعب فلسطين المسلم رفضا قاطعا وكذلك باقي الشعوب المسلمة والعربية والكثير من الزعماء العرب في ذلك الوقت . ويقول الكاتب (( اقتربت ساعة الحسم في الصراع على فلسطين وتركز ذلك على رجلين مركزيين هما بن غوريين وعبدالله بن حسين ولقد كانت استراتيجية الاثنين معا امرا واحدا هو منع اقامة دولة فلسطينية )) ص 45 .<br />((نكبة فلسطين والامة الاسلامية 1948م ))<br />لقد حول الطرفان العربي واليهودي سير الحرب ونتائجها الى اساطير وخرافات لم يكن لها صلة بالحقيقة فهي لم تكن اختبارا حرا للقوة لقد توقفت المرة تلو المرة بهدنات وبوقف اطلاق نار فرضتها قوى خارجية دعما وحماية لاسرائيل وتمكيننا لها واستمرت الحرب شكليا لمدة ثمانية اشهر ولكنها فعليا كانت اربعة اشهر وعلى اربع فترات متقطعة وذلك من يوم الهجوم العربي وحتى يناير 1949 حين طلبت مصر اعلان الهدنة صحيح أن الجيوش العربية كانت أكثر عددا وعدة الاانها كانت تخلو من القيادات الحقيقية الراغبة في القتال وليس أدل على ذلك من أن قائد الجيش الرئيسي في المعركة كان كلوب باشا الانجليزي الصليبي والذي كان قائدا للجيش الاردني فلقد حدد هذا الانجليزي بعلم وتنسيق مع عبدالله اهدافا تكتيكية محدودة ومال الى تقليص المواجهة مع اسرائيل الى الحد الضروري فقط ويقول الكاتب في الصفحة 48(( لقد كان واضحا ان عبدالله ماهو الا دمية بريطانية حيث لم يكن قادرا على تحريك جندي واحد الابموافقة كلوب و كيركبرايد)) ولم تدر معارك حقيقية بين الجيشين الاردني الا في القدس كان قائدها عبدالله التل القائد الاردني الذي تمرد فيما بعد على الملك عبدالله لوضوح الخيانة امام عينيه وقد قتله حفيده حسين بن طلال فيما بعد بتفجير مقره في عمان . واحتلت اسرائيل معظم ارض فلسطين البالغة مساحتها 27600 كم مربع وبقي منها 5600 كم تحت سيطرة الجيش الاردني وهي مايسمى بالضفة الغربية و 560 كم مربع هي قطاع غزة تحت السيطرة المصرية وما احتلته اسرائيل يعتبر ضعف مااعتمدته الامم المتحدة في قرار التقسيم الشهير ووقعت كل من الاردن وسوريا ومصر ولبنان اتفاقية الهدنة مع اسرائيل ورفضت العراق التوقيع على الهدنة وكان العراق قد بعث بجيش عبر الاردن للمشاركة في الحرب . وبذلك كانت اولى مأسي المسلمين عبر احتلال ثلثي فلسطين واقامة دولة اسرائيل على اشلاء شعب مسلم بتأييد ومباركة وتواطؤ الكثير من الزعماء العرب وخصوصا عبدالله بن حسين ملك الاردن .<br />(( الفلسطينيون يغتالون الخائن عبدالله في القدس ))<br />في 24 /2/1950م أجبر الملك عبدالله رئيس وزرائه التوقيع بالاحرف الاولى على اتفاقية سلام سرية مع اسرائيل قائلا له (( انتم توقعون وانا اكون شاهدا )) ووقع عليها من الجانب الاسرائيلي موشيه ديان ولكن الملك اضطر بعد اربعة ايام الى الغا ء موافقته على تلك الاتفاقية بعد ظهور ردود فعل غاضبة في العالم الاسلامي وبعد فرار عبدالله التل الى القاهرة حيث وصف عبدالله بأنه خائن وأداة في يد بريطانيا وأيد ماقاله بالعديد من الوثائق التى تثبت خيانة عبدالله وتسليمه ارض فلسطين لليهود وعليه قررت قيادات فلسطينية ابرزها الكتور موسى الحسيني وبالتنسيق مع عبدالله التل قتل عبدالله بن حسين وتم ايكال تنفيذ المهمة الى احد المجاهدين الفلسطينين وهو شكري عشو من مدينة القدس حيث كانت القدس قلب فلسطين النابض ومركز المعارضة لعبدالله وبتاريخ 20/7/1951م دخل عبدالله الى المسجد الاقصى لاداء صلاة الجمعة وكان برفقته حفيده حسين بن طلال بن عبدالله فخرج له من خلف الباب شكري عشو وأطلق الرصاصات على رأسه القذر فتناثر دماغه على ارضية المسجد الاقصى مدنسة اياه ومن ثم استدار شكري وحاول اغتيال حسين حفيد الملك ولكن رصاصات الحرس الشخصي كانت اسبق الى صدر ذلك البطل رحمه الله رحمة واسعة وأسكنه فسيح جناته اللهم أمين . لقد كان مقتل عبدالله تحذيرا لكل زعيم عربي يحاول يسعى للتوصل الى سلام مع اسرائيل ولكن جاء السادات بعد 27 عاما ليكرر مشهد الخيانة فكان أن لقي حتفه على يد بطل مصر الشهيد باذن الله خالد الاسلامبولي رحمه الله وأسكنه فسيح جناته اللهم أمين .<br />((الجزء الثاني والاخير))<br />(( حسين بن طلال حفيد الخيانة ))<br />عندما اغتيل عبدالله كان حسين في السادسة عشر من عمره وقد شاهد بأم عينيه منظر دماغ جده القذر منتورا على ارضية المسجد الاقصى فكان ذلك من أكثر المؤثرات في حياته وجعله أكثر خبثا وسرية في التعامل مع اليهود . وقد تولى والده طلال الملك بعد اغتيال جده وكان طلال على خلاف شديد مع الانجليز ويكره حياتهم ويكره كلوب باشا بشكل كبير ولم يرق له مسلسل الخيانات التى قامت بها الاسرة هذا في الظاهر ولكن الحقيقة أن طلال كان يكره الانجليز وكلوب باشا تحديدا لانه أطبق على زوجته زين مع كلوب باشا في وضع غير اخلاقي فقام باطلاق النار على كلوب باشا فاصابته الرصاصة في فكه لذلك كان يطلق عليه افراد وضباط الجيش الاردني لقب (( ابو حنيك )) ولكن مما زاد من حنق طلال وكرهه للانجليز أنه لم يستطع اقالة أو طرد كلوب باشا حيث كان كل شىء بيد الانجليز وعندما حاول طلال القيام بتجميع الضباط المخلصين من حوله واعادة ترتيب امور مملكته عاجله الانجليز بانقلاب أبيض بالتعاون مع زوجته زين حيث أعلن الديوان الملكي في أغسطس 1952م أن طلال بن عبدالله بن حسين رجل مختل عقليا ويعاني مصاعب نفسية وعليه فقد تم تعيين ابنه حسين ملكا على الاردن وتم نفي طلال الى استانبول ليعيش بقية حياته هناك منفيا الى أن مات هناك ولكن المشكلة أن حسين لازال صغير السن ولم يكمل تعليمه العسكري في بريطانيا وفي سانت هيرست لذلك قرر الديوان الملكي تعيين خاله ناصر وصيا على العرش الى أن يتم حسين تعليمه ويبلغ السن القانونية التى تسمح له بادارة الملك أو بمعنى اصح حتى تكمل بريطانيا تربيتها له على اكمل وجه . ومنذ ولد حسين بن طلال في 14/11/1935م تولت أمه زين والانجليز تربيته وادخل الى مدرسة مسيحية تبشيرية في عمان وكان طلال والده متعلقا به ويحاول جاهدا تربيته على الاخلاق العربية وابعاده عن تربية الانجليز ولكن دون جدوى فلقد كانت زين وبدعم من جده عبدالله و الانجليز الاقوى دائما والاكثر تأثيرا على حسين حيث فضلت أن يتربى الولد على التربية الانجليزية وبعد مقتل جده عبدالله وتولى أبيه الملك ارسل حسين الى كلية سانت هيرست في بريطانيا لاكمال تعليمه وقد ظهرت جليا مواهب حسين بن طلال للمخابرات البريطانية فلقد كان الملك الشاب زيرنساء ومولعا بالسيارات السريعة والنوادي الليلية شأنه في ذلك شأن جده عبدالله بن حسين . وبعد تخرجه من سانت هيرست عاد حسين الى الاردن في عام 1953م وتم تتويجه ملكا على الاردن .<br />(( مجزرة قبية أولى الخيانات الحسينية ))<br />في اكتوبر من عام 1953م هاجمت وحدة كومندز اسرائيلية بقيادة ارئيل شارون قرية قبية الفلسطينية الواقعة تحت سيطرة الجيش الاردني وقتلت 66 شخصا معظمهم من الاطفال والنساء وفجر المهاجمون أكثر من اربعين بيتا فلسطينيا على رؤس اصحابها وثار الفلسطينيون على الملك وجيشه فماكان من الملك الا أن أقال قائد القطاع المسؤل عن القرية العميد البريطاني (( أشتون)) بتهمة الاهمال ؟؟؟ ولكن الشارع الفلسطيني ظل يغلي وكذلك الشارع الاردني فما كان من الملك وبالتنسيق مع المخابرات البريطانية الا أن اعلن تعريب الجيش الاردني وطرد جميع القيادات الانجليزية في 1956م ارضاءا للمطالب الشعبية وخوفا من ثورة عارمة ضده وضد حكمه .<br />(( الاضطرابات تجتاح عمان 1958م ))<br />في ظل الغليان الشعبي العارم تجاه مايقوم به حفيد الخيانة اجتاحت الضفة الغربية والتى كانت تحت الحكم الاردني انتفاضة كبيرة مالبثت ان انتقلت الى عمان واصبحت المنطقة تغلى ضد حكم حسين بن طلال الذي لم يكن سوى امتداد لحكم عبدالله ولكن بشكل اكثر سوء وخيانة فما كان من حسين بن طلال الا ان استعان عبر اسرائيل ومباشرة من القوات الخاصة البريطانية نزلت الى شوارع عمان دعما للملك وقمعت مع الجيش الاردني كل مظاهر المعارضة لنظامه الهش .<br />(( تأسيس منظمة التحرير الفلسطينية ))<br />((كان عبدالكريم قاسم قد دعا عام 1960م الى اقامة كيان فلسطيني وفي عام 1964م انشأت الجامعة العربية بدعم وضغط من مصر منظمة التحرير الفلسطينية وتم تأسيس جيش فلسطيني )) وكان الهدف من ذلك من وجهة نظر مصر هو كبح جماح حسين بن طلال من التحدث باسم الفلسطينين والدخول في مشاريع سلام مع اسرائيل وتعطيل خططه للتسوية مع الاسرائيليين .<br />((لقاء حسين الاول بغولدا مائير1965م ))<br />بطلب من حسين بن طلال وبتنسيق مع الدكتور هيرتسوغ أحد زعماء الحركة الصهيونية التقى حسين بن طلال مع وزيرة خارجية اسرائيل ان ذاك غولدا مائير في شقة في باريس ويصف الكاتب اللقاء بما يلي (( عندما دخل حسين الغرفة وتقدمت غولدا نحوه لم يخف الملك انفعاله وتصافحا بحراره وتبادلا الذكريات عن عبدالله وتحدثت الوزيرة عن انطباعاتها وذرياتها عن لقائاتها بجده عبدالله )) ص91 وفي ذلك الاجتماع وحسب الكاتب طلب حسين من اسرائيل مسانتده ضد التيار الناصري وضد التنظيمات الفلسطينية وضد سوريا وطلب ايضا ان توافق اسرائيل على السماح له بشراء اسلحة امريكية مع تعهد الملك بعد استخدام تلك الاسلحة ضد اسرائيل وأنه سوف يقدم وعدا خطيا للولايات المتحدة بذلك ص 91 .<br />(( النكســــة 1967م ))<br />في الخامس من يونيو 1967م اجتاحت اسرائيل أجزاء واسعة من مصر وضرب طيرانها جميع القواعد الجوية المصرية وشل حركته تماما وكذلك فعلت في الجبهة السورية فشلت حركة البلدين تماما وبعد اثني عشر ساعة على بدء الهجوم الاسرائيلي وبعد أن تأكد للملك حسين سوء الوضع على الجبهة المصرية بداء الجيش الاردني باطلاق المدفعية على طول الحدود ويقول الكاتب (( لقد تأكد لدى الملك حسين بأنه اذا لم يفعل شيئا فسوف يوصم بالخيانة مدى حياته ففضل أن يشارك في الحرب ويفقد احدى الضفتين بدل من لايشارك ويفقد كلا الضفتين )) ص 95 وفعلا ماهي الا ساعات معدودة حتى سقطت القدس وجميع انحاء الضفة الغربية وبعض اجزاء من الاراضي الاردنية – الباقورة – ولقد كانت الاوامر للجيش الاردني بالانسحاب الاأن بعض ضباط الجيش وخصوصا في مدينة القدس ابدوا مقاومة عنيفة حيث تمردوا على اوامر الانسحاب وكذلك بعضا من كتائب ودبابات الجيش العراقي صمدت لساعات طويلة في قتال شرس حول مدينة قلقيلية واستشهد كافة افراد تلك الكتيبة العراقية ولازالت دباباتهم منكسة الى اليوم في منطقة جنين حيث نكسها الاسرائيليون ووضعوها كتذكار لانصارهم وهكذا سقطت كامل فلسطين وسيناء والجولان السورية خلال ساعات ودحرت اسرائيل اربعة جيوش عربية وقتلت عشرات الالاف من افراد الجيش المصري في ظل ظروف اقل مايمكن وصفها بانها خيانة لهذه الامة من قبل ساستها .<br />(( معركة الكرامة 1968م ))<br />تزايد نشاط المقاومة الفلسطينية عبر نهر الاردن مما شكل تهديدا مباشر لكلا الطرفين الاسرائيلي والنظام الاردني حيث أنه كلما تزايدت نشاطات المقاومة الفلسطينية كلما زادت شعبية هذه التنظيمات في الاردن وفي فبراير 1968م هاجمت اسرائيل قرية الكرامة الواقعة شرقنهر الاردن موجهة ضربة شديدة للمقاومة الفلسطينية ودمرت مراكزها وبدأت القوات الاسرائيلية في التغلغل فما كان من قائد الجيش الاردني في الاغوار اللواء مشهور الحديد الا أن أصدر أوامره دون الرجوع للملك بصد الهجوم الاسرائيلي ونشبت معركة حقيقية استبسل فيها افراد وضباط الجيش الاردني وكبدوا القوات الاسرائيلية خسائر فادحة ، بعدها يأيام وفي لندن العاصمة البريطانية التقى اللواء الاردني عامر خماش مع الاسرائيلي حايم بارليف وابلغ حاييم بارليف نظيره الاردني أن هناك افراد وضباط في الجيش الاردني يقدمون المساعدات للمقاومين الفلسطينين دون علم قيادتهم بذلك وأكد حاييم بارليف لرئيس الاركان الاردني أن اسرائيل لاتريد الحاق الضرر بالنظام الهاشمي ولكنها تستهدف التنظيمات الفلسطينية .<br />(( احداث ايلول 1970م ))<br />تصاعدت وتيرة المقاومة الفلسطينية وزادت شعبيتها حتى بين افراد البادية الاردنية المشهورة بولائها للملك ويقول الكاتب ((ان عددا ليس بقليل من افراد وضباط الجيش الاردني تركوا الخدمة العسكرية والتحقوا بتنظيمات المقاومة الفلسطينية لدرجت ان قبائل بنى صخر في جنوب الاردن ايدت ودعمت المقاومة الفلسطينية ودعمتها ووفرت لها التسهيلات )) ص 118 وبالطبع فان ذلك بات يشكل تهديداخطيرا للنظام الاردني ويقول الكاتب في ذلك (( اقلق التهديد لحكم حسين بريطانيا والولايات المتحدة لقد كانت المملكة الاردنية الموالية للغرب احدى دعامات الدول الغربية على مدى 20 عاما وخشي السياسيون في لندن وواشنطن أن يؤدى انهيار الاردن الى اختلال الامن في المنطقة – الاسرائيلي – فلقد كان الملك حسين يلقب في جميع المراسلات بلقب -ملك ذكي شاب- او B.Y.K.- )) ص 116 فما كان من الملك واجهزت مخابراته الى ان سعت وبشكل دؤوب الى افتعال احداث سبتمبر 1970م والتى أدت الى اخراج المقاومة الفلسطينية من الاردن ولكن النظام السوري في تلك الاثناء دخل على الخط واحتل اجزاء من شمال الاردن ظاهريا بغرض دعم الفلسطينين ولكن فعليا سعيا منه الى اسقاط النظام فما كان من الملك الى استعان بسلاح الجو الاسرائيلي ويقول الكاتب في ذلك (( طلب الملك من اسرائيل أن تامر سلاحها الجوي بمهاجمة ارتال الدبابات السورية فما كان من اسرائيل الا ان نفذت ذلك الطلب وقامت ايضا بنقل لواء مدرع كامل من الحدود المصرية الى اغوار الاردن استعداد لأي طارىء ودعما لنظام الملك حسين )) ص 121 . بعد الانتصار على المقاومة الفلسطينية التقى الملك حسين في اكتوبر 1970م بايغال ألون ويقول الكاتب (( كان فحوى المحادثة التى دامت ساعتين عاديا بيد أنه جرى فيها تعبير عن المشاعر لقد تعانق حسين وألون طويلا وكأنهما صديقان حميمان لم يلتقيا منذ امد بعيد وبارك الوزير الاسرائيلي للملك انتصاره في الصراع ضد المنظمات الفلسطينية وشكر الملك من صميم قلبه اسرائيل على الدعم السياسي والعسكري الذي وفرته له )) ص 125.<br />(( الملك حسين في تل أبيب 1972م ))<br />وافق الطرفان على عقد اجتماع سري بينهما ولكن المشكلة في المكان وبعد مداولات بين الجانب الاسرائيلي والخارجية الامريكية التى ايدت فكرة اللقاء اقترح الامريكان ان يكون اللقاء في تل أبيب فخشي الاسرائيليون أن يرفض الملك ذلك ولكن عندما عرض عليه الامر وافق على الفور (( وافق الملك على القدوم الى تل أبيب وقامت هليكوبتر عسكرية بنقله الى مكان قريب من متسادا بجوار البحر الميت حيث كانت في انتظاره طائرة هليكوبتر عسكرية اسرائيلية وكانت الشمس توشك على المغيب عندما مرت الطائرة في سماء القدس )) ص 127 ودار الاجتماع حول النقاط التالية وهي اقتراحات جولدا مائير :<br />1) اقامة ادارة اردنية في معظم مناطق الضفة الغربية 2) يسمح للاردن بتواجد قوات شرطة الى الضفة الغربية لحفظ الامن 3) يمنح سكان قطاع غزة الجنسية الاردنية 4) يسمح للاردن بادارة المسجد الاقصى من الناحية الادارية كتعيين الامام ومسؤلية الاوقاف ...الخ .<br />ولكن كانت أهم نقطة في هذا اللقاء والتى لم يشر اليها الكاتب بوضوح هو تحذير الملك حسين لغولدا مائير بخطورة الوضع على الحدود السورية والمصرية وأن مصر وسوريا قد تقدمان على خطوة دخول حرب جديدة مع اسرائيل ولكن الذي حصل فعليا هو ان اسرائيل لم تأخذ تلك التحذيرات على محمل الجد فكانت حرب اكتوبر 1973م والتى تم فيها ولو جزئيا سحق الجيش الاسرائيلي وهزيمته على يد الجيشين المصري والسوري .<br />الغريب أنه في عام 1967م وعندما تأكد النظام الاردني من هزيمة الجيش المصري والسوري دخل الجيش الاردني الحرب وانتهت بتسليم الضفة الغربية وفي عام 1973م وعندما تأكد النظام الاردني من انتصار الجيش المصري والسوري المحدودين على الجبهة لم يطلق النظام الاردني طلقة واحدة تجاه اسرائيل في وقت كانت فيه الحدود الاردنية مع فلسطين تخلوا من أي وجود عسكري اسرائيلي فهل هذا كان مصادفة أم ماذا؟؟؟؟؟."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

