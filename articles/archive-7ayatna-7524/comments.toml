subject = "للفافيات الدلووعين اللي بسمعو كلام ماما وبابا"
author = "بكل فخر عربية"
text = "للشباب الحلووين:::::::<br />بصراحة يعني ما قصرتو حكيتو الواجب ببعض<br />تعا لهون يا أردني (يختي كمييلة)) مش إنت حكيت كل واحد برجع بأصلو هلأ بشرفك تحكيلي إنت شوو أصلك على ما أظن فش جوواب لإنو ما عندك أصل ولا يا عسل روح شو بنات الأردن حوصفلك إياهم متل ما وصفت الفلسطينية أولا:((وجهم وجة بووومة)) ثانيا:(( منخارها منخار خنزير)) تالتا(( تمها تم حماار)) رابعا((عيونها عيون قرد)) والعياذ بالله والحلو فيها شعرها بس بتتفاجئ بالمصيبة الكبرى إنو بتكون مقملة والقمل بسبح هاايش بشعرها يع يع يع يع قررف شو هاد يا ماما<br />نرجع لكلامنا مش حكيت كل واحد برجع لأصلو ونذالتو وحقاارتو وإنت بكلالامك هاد الحمد اله عبرت بكل فخر عن أصلك الوسخ يا إبن الوطن الجميل آل الأردن أولا آل والله والضرااطة<br />يعو الأردن طز فيك وبأحسن أردني<br />واللي مش عاجبو يضربني بتخبى بالكيبوورد هههههههههه<br />شوفو ما أخف دم الفلسطينية يختي كمييييلة فش أخف من دمهم مو متل الأرنية كل واحد فيهم أجحش من التاني وبهوووش على الجل اللي بوقف في شعروو يا فافي وآل شو بحكي عن حالو زلمة<br />الأردن أول إسمعو::: أنا هيك عبرت بكمن كلمة عنكم لإنو لو بدي أحكي صفاتكم البذيئة ما بخلص من هون لبعد ملياار سنة<br />أردنيوووو هيهيهيهيههييههيهيه"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
