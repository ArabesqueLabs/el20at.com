text = "والله تخسي إلا هم .. قال نسكت قال .. والله لنخليهم يبوسوا ايدينا ورجلينا .. والله لنذلهم ذل عمرهم ماشافوووووووووووه ولادين الحرااااااااااااااام . كس أمكو يافلسطيزية ... كس كل واحد بقول انا فلسطيزي ...<br />وللحديث بقية !!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 278
subject = "شفى الله الـ ع ـرب !"
author = "مسلمه عربيه"
text = "السلام عليكم ورحمة الله وبركاته<br />بسم الله الرحمن الرحيم ..<br />بـ ظنكم آن امريكا جاهله ؟ او اسرائيل لا تقرأ<br />والله لا استغرب اذا اتقنو العربيه اكثر مننا<br />ع القليله لديهم مترجمين ( إن كنتم جــاهلون )<br />أنت وهو وهي .. :)<br />اسأتم للإسلام والله قبل إسائتكم لعروبتكم<br />لو قرأ هذا الكلام كآفر اقسم بالله لآ يفكر حتى يطلع على ديننا او معتقداتنا<br />سيكون بإعتقاده ان هذه الالفاظ طبيعيه في ديننا فلما يتنازل من وحل هو فيه إلى وحل اشر ( - بـ اعتقاده - )<br />اتقوا الله في كتاباتكم .. وتذكرو قوله عز وجل ( ومايلفظ من قول الا لديه رقيب عتيد )<br />تذكرو ان مامن كاتب الا سيفنى ويبقى الدهر ماكتبت يداه<br />والله انك محاسبون على كل كلمه<br />و والله انكم تسببتم للاسلام بشر عظيم بهذه التعليقات<br />اي موقع يسمح بهكذا سخافه !! ارجــو حذفهــا<br />سلام الله عليكم ولا حول ولاقوة الا بالله"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

