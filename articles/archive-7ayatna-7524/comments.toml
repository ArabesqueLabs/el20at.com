[[comments]]
order = 66
subject = "رد للسيد الاردني."
author = "الوليد الفلسطني"
text = "السيد الاردني, لا اود ان اطيل عليك الكلام ولا ان اتنزل لمستوى الكلام الهابط الذي في رسالتك.<br />عزيزي, ذكرت في رسالتك ان الفلسطينيين هم الذيين باعوا اراضيهم بانفسهم. ان لم تعطيني دليلا تاريخيا واحدا .. اسمح لي ان انعتك بالكاذب. ولاصحح معلوماتك عن بيع الاراضي الفلسطينييه , نعم تمت هناك بعض المبيعات للاراضي ولكن ان عرف السبب بطل العجب. صرخت بان الاردن اولا. يا عزيزي ان الاردن هو الخائن الاكبر للشعب الفلسطيني. وقد قامت حكومتكم مشكروه بمنع المواد الزراعيه عن الفلاحيين في الضفه ليبيعوا اراضيهم لاسرائيل بالتنسيق طبعا مع اسرائيل ( صديق الاردن الاول ). ثانيا, ارجوا من سيادتك ان تتكرم وتستفسر عن ايلول الاسود.. ان كان هناك رجل واحد في الاردن يخاف الله .( من الملك الى اصغر عبد ) فليقل حقيقه ايلول الاسود. وليس كلام الكتب ومذكرات وزراء الفساد الاردني.<br />ايلول الاسود مذبحه حقيره قامت بها الحكومه الاردنيه بحق الشعب الفلسطيني بادعاء انهم ارادوا ان يفتعلوا انقلاب في الاردن. وهذا غير صحيح. وان كان كذلك. فما دخل الاطفال والنساء. ( طبعا الجيش الاردني قام بالعمليه بغطاء جوي من سلاح الطيران الاسرائيلي) ..<br />ثالثا, قلت ان الاردن تعامل الفلسطيني مثل الاردني, وانا اقول لك ان الاردن نعم بالفعل كرمت كثيرا من الفلسطينيين ولكن ليس بالمجان. استفسر وسوف تجد الحقيقه.<br />واخيرا . نعت الفلسطينيين باقبح الالفاظ واشنع الصفات. وسوف اقول لك كلمه واحده فقط. لماذا كرم الله فلسطين على كل العالم؟ اجبني ؟<br />صحيح, بطولات الاردن. اين هي.. لو سمحت اذكر لي بطوله واحده ( من التاريخ وليس من الارشيف الاردني الكاذب ). ان الخيانه العظمى ولدت في الاردن. بن انفسكم. والا فلما قتل شيخ الاردن في فلسطين. ومن قتله.. هل تستطيع ان تجيب. لا اعتقد. مع العلم ان جميع الاردنيين يعلمون من قتله. ولما استلم المللك حسين الحكم صبيا. وهل هو الوريث الشرعي للاردن.. ارجوا ان تراجع التاريخ يا سيدي قبل ان تجيب.<br />واخيرا اقول لكم كلمه واحده , ان شعب فلسطين لم ولن يكونوا سواسيه. لانه منهم السيء ومنهم الرجال. رجال ذكرهم الله في كتابه العزيز ( رجال اشداء ). ارجوا ان تسمحوا لي اطالتي بهذا الموضوع. واعذرونا يا ساده...<br />الوليد"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

