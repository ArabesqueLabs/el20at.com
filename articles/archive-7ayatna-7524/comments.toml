subject = "ما ضل على الخم ريش غير ممعوص الذنب"
author = "فلسطينية وبفتخر واللي مو عاجبه ينتحر"
text = "ولكم مين الي جاي يحكي ويتفصحن ويتفلسف على الفلسطينية ....ما ضل الا السعودية الي الرسول بحاله احكى عنهم (اطهر بقعة في الارض فيها انجس ناس) روحوا انضبوا احسنلكم بكفيكم خلاعة وقلة حيه اصلا ما ابتشتري بلفون الا لتلاقي عليه لقطات اخرى من الخرة للسعودية يا خرة اتفوا على وجهكم وعلى وجه كل واحد بيحكي عن فلسطين.............وتعالوا هان لو في ذرة فهم وحدة عندكم كان ما خلو الامريكان يدخلوا العراق او الكويت بس شو بدنا نحكي الزبالة بيضل زبالة (اتفوااااااااااااااااااااااااااااااااااااااااااا على وجوهكم ما ابتفهموا )<br />وقال مين كمان الاردنية ( ما ضل على الخم ريش غير مفعوص الدنب) ولك يلي ابتحكي عن فلسطين ولك هي تاج راس كل اردني .....ولكم ابنعرف ناس اردنية بس مش بحفارتكم يا زبالة المجتمع كله<br />روحوا ضبوا اولادكم من الكبريهان والمراقص ما انتوا خربانين بدون هالواسطة<br />ولكم روحوا شوفوا السجون من الكبير للصغير الي عمره ما وصل تمن سنين بالسجن<br />روحوا انضبوا بكفيكم مسخرة (ونصيحة مني لألكم ما تحكوا عن اسيادكم هيك يا اذناب اليهود واميركا انتوا وحسين وعبدالله) الله لا يرحمكم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 234
subject = "أنا بدي أوجه رسالة عاجلة لحبايبي الفلسطينيين والفلسطينيات"
author = "عاشق فلسطين"
text = "السلام عليكم ورحمة الله وبركاته , حبايبي الفلسطينيين والفلسطينيات , زي ما قال الأخ العزيز المشتاق للحور العين (طبعا ابن<br />فلسطين) إنه رغم تفاهة الآخرون يجب أن نكون عاقلين فاهمين , وفعلا كل كلمة حكاها الأخ العزيز المشتاق للحور العين جدا ممتاز ورائع ومحرق للأردنيين الخرة , على كل أنا فعلا زي ما قال الأخ المشتاق للحور العين إنه على الفلسطينيين يجب عليهم التعقل في الرد , وإحنا المفترض نعمل زي ما عمل الأخ : فلسطيني أصيل لأنو فعلا ما بسب الأردنيين , لكن كلامو كتير مفحم للأردنيين , وخاصة مذكرات الملكة نور مع إنو طويل كتير لكن فيه فضائح كتير عن الملك حسين الله لايرحمه , وفي كل أحداث أيلول الأسود وشوف كيف كانوا الفلسطينيين مدخلين الرعب في قلوب الأردنيين , ورسائل الأخ : فلسطيني اصيل كتير ممتازة ورده جميل كتير وما فيها سب , فإحنا بصراحة بدنا نعمل متله , وبدناش نكون تافهين مع هالأردنيين الخرة , وأنا بشكر الأخت :<br />بنوتـ فلسطينية حلوة ــة على تصحيحها لرسالتي , وبرضوا بشكر الأخت بنت نابلس على رسائلها الممتازة , على كل حبيت<br />اخبر الكل هون إني مش رح أدخل بعد هيك هون عشان أسب وألعن وأشتم , رح أكون عاقل كتير وبدعوا كل حبايبي الفلسطينيين هون للتعقل متل ما حكى الأخ المشتاق للحور العين فعلا بارك الله فيه , وأنا بدي أوجه شكري الجزيل للأخت الفاضلة بنت السعودية لأنها فعلا محترمة كتير وما سبت ولا شتمت وكان كلامها نوعا معقول وكتير منيح , وبدي أوجه رسالتي<br />الشديدة اللهجة مع احترامي للحمير للحيوان سعودي ينبعاوي لأنه سب الفلسطينيين , أبو فلص كندرته على راسك وعلى راس<br />كل بدوي زيك , شكلهم الأردنيين علموكم شوية من أخلاقهم الخرة لإلكوا بعد ما زاروا القبائل السعودية قال عشان التعارف , لأ<br />والله شكلهم جايين عشان يعلموكوا على كيفية التريقة على الفلسطينيين , على كل لساني عاجز عن وصف الحمير , وسبحان<br />الله البدو وين ما راحوا أندال وخرة ومعفنين ومتخلفين حيث لا حضارة ولا تقدم , ما بديش أكتر كلام وأنا فلسطيني وبفتخر واللي<br />مش عاجبه ياكل خرة وينتحر ويكتب على قبرو واحد ميت من القهرررررر : حاول يتحدى فلسطيني جدع وما قدر , وشكرا كتير إلكوا يا حبايبي , وأنا بشكر الأخ السوداني , وهو صادق ونا معو لما قال إنه بعض الفلسطينين فيهم ضعاف إيمان , صحيح مش كل الناس سوا وزي بعض , ولله في خلقه شئوون , على القليلة أهل السودان بحبوا أهل فلسطين مش زي تبعون الأردن<br />يلا بديش أكتر كلام , وسلامي لكل حبايبي الفلسطينين والفلسطينيات في غزة والضفة وفي كل أنحاء فلسطين الحبيبة والله<br />يوحدنا ويرحمنا برحمته , اللهم آمين , والسلام عليكم ورحمة الله وبركاته"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 235
subject = "خلص سويتوهااااااااااا قصة يعني !!!"
author = "محمد نواف الحمدالله ..."
text = "خلص بكفي عاد ... سويتوها قصة وزيطة وزبليطة .. مناك إلو إنخرسوا وبكفي .. لحد هونه وبس !<br />خلاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااص .. هسه بكفي الي فات مات .. وحنا شباب اليوم ..<br />وبس . وبالنسبة للفلسطينية خلص خلص خلص عاد كبرتوها وهيه صغيرة ونصحتوها وهيه نحيفة .. وعلى شو ؟؟؟<br />يعني ف بلدكو ولا مش ف بلدكو فاتحين ثمامكو !!!<br />وبالنسبة للسعودي اللي قاعدين بتتمصخروا عليه .. طيب مش ممكن هاذ اللي مش عاجبكوا أحسن منكو كلكو .. ياسيداة ممكن أحسن مني كمان .. لاتحسبوا الناس قدامكوا بفهموش وأنتو الوحيديين اللي بتفهموا لأ لأ لأ ياعمو مش هيك القصة .. القصة إنكو بتنفخوا بحالكو كثيييييييييييييييييييييييييير وكثير كثير .. وبس<br />أنا بحرتم الناس المحترمة وغير هيك لأ<br />وعلى راسي كل واحد محترم ومؤدب سوا ء كان أردني ولا غيرو<br />انتهي ،،، وفلجتوني وطققتوني وزهقتوني وقرفتوني !!! منيح هيك ؟"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 236
subject = "شكرا لك يا محمد نواف الحمد الله"
author = "سعودي ينبعاوي"
text = "السلام عليكم ورحمة الله وبركاته , شكرا جزيلا لك يا محمد نواف الحمد الله وهذا دليل كبير جدا على طيبة ونخوة الشعب الأردني الشقيق وليس الفلسطيني الحقير , هذا الشعب الفلسطيني ربي ما سوى فيهم كذا أصلا الا لانهم فسقة ومنافقين وعملاء ولا تعاااال شوفهم لما يكفرون ويسبون الله جل وعلا وغير كذا بكثييير , الحكومة السعودية الرشيدة ما هي بقادرةعليهم من خبثهم الشديد , السعوديين كانوا إخوة للفلسطينيين وكانوا يقفون معهم في معاناتهم , لكنهم ناكرين جميل , اش تبغى تسوي , هما كذا<br />الله يلعنهم عمري ما شفت أكلب من الفلسطينين , على كل شكرا لك يا أخ محمد نواف الحمدالله عشاني رحت كثير على الاردن ورحت على الطفيلة هناك ورحت كمان على وارديرم وفعلا انتم يا الأردنييين اهل الطيبة والنخوة الشرف العربي زي ما قال الاخ الاردني , الفلص وين ما راحوا خربوا المكان اللي هما فيه , قالك عمروا العالم , والسلام عليكم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 237
subject = "بلا عنصرية"
author = "مراق طريق و القناص"
text = "الاسلام هو الحل لا بديل لفلسطين اما بالنسبه للاردن فهي في عيوني وفي قلبي وانا بعتز وبفتخر بكوني فلسطيني مضبوب في الاردن<br />ولكن في اكم من شغله حابب اوضحها بالنسبه للبلد الحبيب الغالي الاردن اولا غالبا ما نجد مسجدا بالاحياء الفقيره وغالبا ما نجد ملهى ليلي في الاحياء الثريه وعلى لسان الملك تبع الاردن سوف ننفي الاسلام اصلا يا حيبي بدي احكيلك اشي العاهر الاردني اصلو امريكي وانتا وبل فخر معتز فيه بينما هااااذمن ابر الاخطاء اما بالنسبه للقرد الاكبر الحسين بن طلال فهاذ راح زي الاسد سلم القدس على طبق من ذهب لاخوه شارون والشباب الطيبه صحابو صح يا حب ما بحكيلك انو الفلسطينيه كلهم جدعان بس بيكفي فخر انهم مش راضيين بأي ابن ________ يستلم الرئاسه الااذا ان بشرف وبرفع الراس التخاذل لملك ريطاني يعني الانهزام وكثير من الدلائل اللي انا بحكيلك اياها رح تتفاجأ فيها فخليك نايم وكل ونام وعيش حياتك زي البهيمهع احسن من ما تفتح عينيك وتشوف المزبوط بيكفي يا حب سب علينا لانو احنا دمنافاير وعينينا حاميات بلاش اناديلك ابو منذر يفقعك عينخليك بحال احسنلكواتر باقي التعليك للاخ المناضل ............ فليتفضل مشكورا احم احم مهو يا اخو اشرموطة منتو لونكم ازلام مش دورية شرطة بتنيك امكم ولكم الولد الي عمرو 5 سنين بقف في وجه دبابة يا خرفان انتو ولكم لو بدي احكي ما بخلص ولو بدي اكتب بخلص الحبر الي جوا البيوتر علشان هي بدي احكي كلمة هو في رجل واحد فيكم شريف هو البطل الشهيد ابو مصعب الزرقاو وجماعتو وبس يا خنازير انتو يلي بتسو العنصرية وخلص بكفي لا ني بدي اوح انام...."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 238
subject = "رد على كل من الأخ السعودي ،،، والمحترم الفلسطيني \" بلا عنصرية \" !"
author = "محمد نواف الحمدالله ..."
text = "أولاً صباح الخير على الجميع .. بما إنو الدنيا عنا صبح .. والواحد مش شايف قدامو .. وأنا الصراحة نص نايم ونص صاحي .. المهم<br />الأخ السعودي .. لا تتشكرني ياخوي .. تراك حنا ربع وأهل حميه ! وكل الناس خير وبركه ! ومافي حدا ياخوي أحسن من حدا .. لا بالعكس .. الإنسان بأدبو وبأخلاقو وبعلمو !! بس ياخوي الظاهر إنومافي فايدة .. وهذوله ( الفلسطينية ) الله يهديهم ويصلح بالهم .. مصرين على البهادل والشنططه من هون لهناك .. من بلد لبلد .. يعني والله ومثل مابقولوا يعني \" طلع الشعر على لسانا \" . ياخوي متنا وحنا نفهمهم إنو خلص صروا ولاد عالم وناس واحترموا الناس .. يعني هسه كان الوضع ماشي وعال العال .. بعدين آجى واحد فلسطيني ( وأنا مصر بديش أسبو لإنو مافي فايدة من السب نهائي ) .. على النقيض تماماً معاه . يعني هو بسب علي وعلى الأردنيين بشكل عام .. وأنا ساكت ومش فاتح ثمي بكلمة وسخة .. يعني شو ؟؟؟ كبرت يافلسطيني ؟؟؟ خلص لما صرت تسب كبرت وصرت زلمه ؟؟؟ محنا عارفينكو من يوم يومكو ..<br />سعودي ،،، هذوله عندهم مقايس أو معيار إنو الفلسطيني فيهم لما يكبر شويه ويصير يفعفط ويسب ويلعن ويكفر ويصيع ويشرب ويحشش ويعيش متوحش !! يعني كبر بالنسبة إلهم !!! مساكين ويانيالهم على عقولهم !!! والله ناس فاضي ومرتاحه وولا اللي عندها .. يعني ناس عايشه من القلّه !!! همه فاهمين !!!<br />أبصر ... أشك بأن تعليق الفلسطيني \" جاهــــــــــــــــــــــــــــــــــــــــل وغبي بآنِ واحد \" ترى يافلسطيني الأسلوب عندك معدوم .. يكاد لايرى بالعين المجردة .. مختفي مستتر .. غايص بالأعماق .. والحاله حاله .. والدنيا فوق حدر .. وكلو نايم بالعسل .. وإشي بشتغل .. وإشي بسب وبلعن وبكفر .. وإشي بطلع بالثاني .. والوضع بدو رضع .. ووين ارضعه !!!<br />وع كلب هاااااااااااااذ وغيرو ،،، كل شي ماشي مافي مشكله !!! أي شو هالشعب هاذ .. مش عارف ؟؟؟<br />ع فكره ،،، أنا لست ممن يغارون من هذا أو ذاك ؟؟؟ ولكن الواحد يقول الحق _ أحسن وأفضل _ ..<br />هاذ إذا كان عنا _ نحن العرب _ مخ لحتى نفكر فيه ونقيم فيه ؟؟؟ ولكن أين هو المخ ؟؟؟ مخ فاشوش !!!<br />وأنا قاعد عم بحكي عن العرب بشكل عام وبصغة عامة .. وبدون تحديد أو استثناء أو حتى تمييز .. وعلى سيرة التمييز بكل أشكالو .. فاا يعني خلينا ساكتين أحسن ...<br />كلمة أخيرة ،،<br />بكفي عاد<br />خلص<br />اهدوا<br />مافي إشي مستاهل<br />كلنا ولاد تسعه<br />وكل الناس خير وبركه<br />واللي بيجي من الله حياه الله<br />ونحو عالم أفضل وأحسن .. مليء بالحرية والخير والسلام . والأهم أن يحيا بعدل وشرف وكرامة !!!<br />ومعذرة إن أطلت عليكم ،،،<br />تقبلوا مروري ،،،<br />تحياتي للجميع ،،،"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 239
subject = "ضع عنوان التعليق"
author = "مراد الخطيب"
text = "بدي اكتب عن تعليق الشرموطه سوسن الخضره هاي العاهره مصاصه زباب الي تتناك من جميع الجهات صحيح غيرت مسار النياكه بطلت تتناك من طيزها صارت تتناك من كسها من كل خرم بجسمها هوايتها تتناك وتمص زباب هيك غيرت الشباب خلتهم قرون خنازير متحضرين عن طريق التعريص والنياكه مافي ايرررر وزب الى بلعتو من طيزها وكسها بين بزازها هي خواتها الشرموطات سمعتها بالرياض والخبر فايحه خرى كس اختكم على هيك تعليق اولهم القرن عائض القرني الخنزير القرن اسم على مسمى شكلها مصتلو زبو ولكو يا خوات الشرموطه تاخدو تعليق حضاري من وحده شرموطه بنت تين الف كلبه قحبي ايري فيكو واحد واحد اي حضاره ولك كانت تتناك بارامكو من الامبريكان نيك جماعي هي اختها اريج الخضره ام طيز كبيره مافي زب بالخبر الى مصتو تفوووووووووووووووو على اصلكو واحد واحد"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

