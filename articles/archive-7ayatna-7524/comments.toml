[[comments]]
order = 199
subject = "غريب كتير إنه في بدو بدخلو النت هده بشارة خير والله , هههههههههههه"
author = "بنت نابلس (palestine First) بحبك يا فلسطين"
text = "غريب كتير والله إنه بدوي أو غيره من بدو الأردن بخش على النت , غريب , هيهم بدأوا يتحضروا والله , وتحضرهم في النت هي السب والشتم وغير , هيك , والدليل على هيك إنه في بعض البدو الأردنيين اللي لسانهم زي الجزمة سليط مش بكتبوا قواد بكتبوا جواد وما بكتبوا قحبة بكتبوا جحبة , شوفوا كيف تحضروا الأردنيين في النت , وعقبال ما يتحضروا في كل إشي , ولكوا والله بدي أنجن<br />من عمايل الأردنية هدول , فعلا حثالة وزبالة المجتمع بمعنى الكلمة فعلا , ما كزبوا حبايبي الفلسطينيين لما قالوا إنكوا خرة متخرية مخرية بخرة مخري بخرة , والله إنكوا أخرى من خرة كمان , وأجزم من جزمة وأسفل من سافل , على العموم , بديش أكتر كلام , وتاني إشي بدي أقول للكلب الحيوان المنحط محمد نواف الحمدالله والأردني إني أنا أشرف منكوا ومن أمثالكوا , وكندرة الفلسطينيين على راسكوا يأ اردنية يا جراذنة , ورح تضل كندرة الفلسطينيين على راسكوا"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 200
subject = "الى حقراء الاردن"
author = "المرابط"
text = "عشنا وشفنا الاردنية صاروا يعرفوا يحكوا<br />يكفيكم ان الاردن اكبر الخونة العرب والاردن هي من بدأت الخيانة وهي من تحالفت مع بريطانيا ضد الدولة العثمانية<br />البدو اندال شُعث غبر الوجوه ان أمنتهم خانوا<br />وان شبهتهم بالكلب صاح الكلب لا فشعرة في ذيلي بألف ألف ترباني<br />ولك لولا الله ثم لولا الفلسطينية لما كانت هناك دولة تذكر اسمها الاردن<br />ولك احنا اللي عملنالكوا شوية قيمة بعد ما كنتوا شوية بدو معفنين مشردين مفلسين مخلفين"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 201
subject = "الأردني.."
author = "الأردني.."
text = "يا متعرصة يا بنت نابلس ولك إزا احنا جديد تحضرنا إنتو شو؟؟؟ يا جحبة يا كس مفتوح ولك انتو الجواادين زبابهم نهرو وهما بتقاتلو مين بدو يدخل زبو فيكي وبضل يدخل في حتى يوصل للأمعاء الدقيقة والغليظة وأصابعهم نهرو قد ما بتقاتلو مين بدو يدخل اصبعو في طيزك من ورا وتناطحو بروسهم عشان يلحقو يمصوو ببزازك وانت يا حمودي ولك مافشرت إمي تضل فاتحة كسها ليكون بتحكي عن امك بس لخبطت ولك إنت عيلتك كلها بتنيك بعضها من ورا ومن قدام عشان شوي يريحو الكس وشوي يريحو فتحة الشرج ولك انت بذااتك وبنفسك بتنيك امك واختك ما عندك مانع وكل الفلسطيزية على نفس الشاكلة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

