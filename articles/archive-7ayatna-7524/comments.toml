[[comments]]
order = 110
subject = "فضحية والله فضحية"
author = "فلسطيني ابن اصول"
text = "شوفوا الجبن والخوف في الأردنيين الأصل لوين , لهده الدرجة الفلسطينيين ربوا إلكوا الهلع والخوف ومأكلينكم خرة وسم هاري , شوفوا كيف الفلسطينيين مربيين الأردنيين , واحد أردني أصل ابن حرام جالس بسب الفلسطينيين قدام ولد صغير يمكن عمره 10<br />سنوات , مش عارف الولد نرفزه , المهم , هدا الولد صار يعيط عند أهله وحكالهم صار هيك وهيك وهيك , أهل الولد عصبوا , واحد من<br />الإخوة تبعون الولد راحوا على هدا الأردني الحشرة وكان بدوا ينضرب , أقسم بالله إنه صار الأردني الأصل يعيط ويترجى الشب إنه<br />يسامحه على اللي عمله , شوف كيف الجبن , فالله يقوينا على هدول الحثالة اللي عاملين حالهم أهل الكرامة والشهامة (النخامة) المتخلفين , كل الأردنيين الأصل بيجوا بتشحتوا عند أبواب المساجد , والله ما عندهم كرامة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

