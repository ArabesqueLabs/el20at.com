subject = "كس امك ياعربي يا منيك ياعرص ياكركي يازبالة"
author = "محمد نواف الحمدالله ..."
text = "ياشرموط .. رف عن ايرنا كس أختك شو خراااااااااااااااااااااا .. يلعن ابوك شو انك ابن كلب وعاهره وداعره ..<br />يا ابن الشلف ..<br />ولك تخلينيش اكفر !!!!!!!!!<br />ولك مين دازك علي .. مين هاذ اللي مسلطك علي يا ابن الزانية ...<br />اطلعمن راااسي لأقطعووووووووووووووووووو<br />وبعدين انتا واللي جابك ع راس زبي من فوووووووووووووووووق ..<br />اه صحيح .. سلم على أختك الحلوه (( نتاشا ))<br />هع هع هع هع هع ..<br />اسمع دير بالك على حالك ؟؟؟؟<br />وتكبرش راس علي ..<br />وتنفخش صدر على الفاضي ..<br />وتهزش ذنب يا كبير ..<br />ترى معوبة ابو شريك<br />.. انتا فاهم .. فش داعي اوضح !<br />يلا .. انبح ياكلب يا ابن الكلب ..<br />واذا ثاني مره بتجيب سيرة عشريتي على لسانك .. وشرفي لأقص لسانك واحملك اياها .. ماشي<br />وبلعن ابوك احو شرموطه .."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

