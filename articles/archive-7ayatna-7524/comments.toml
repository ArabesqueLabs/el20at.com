subject = "لكل من : ريما، عياش، ليست كل الناس ملائكة .."
author = "الأردني ..."
text = "اولا مرحبا ع الجميع .. شو فيه ؟؟؟<br />بالنسبة للأخت (( ريما )) .. خير ياطير ؟؟؟ شو اللي قاهرك بالموضوع ؟!!! .. إيش مش اللي عاجبك فينا ؟؟؟<br />ولا لأنو ذنبنا مقعدينكو عنا يعني .. ياستي .. اللي مش عاجبيتو العيشه عنا يروح .. يدور بالشوارع يعيش بالزبايل ؟؟ لأنو هاذ مستواه ؟؟ أو بعطيه أنا من عندي حل جذري يريحو أنو يظب غراضو ويروح ع أقرب جسر .. والله معو .. يروح يرمي حجارة ببلدو .. ويبوس كندرة البهائي أوب مازن وهنيه القواد .. هيك اشرفلو واحسنلو .. وهاذ هو ..<br />وللأخ عياش .. ولك أنتا مال أختك ؟؟ .. ولتبع الملائكة ؟؟ والع مني عراف شو أقول (( الكلمات تعجز عن وصف الحميييييييييييييييييييير )) .. وشكراً"
