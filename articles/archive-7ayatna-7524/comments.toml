[[comments]]
order = 27
subject = ""
author = "شيطان"
posted = "2008-08-21"
text = "فلتحيى اسرائيل قبل ان تضع الدول المستعمره هذه الحدود المصطنعه واصبح هناك الاردن وفلسطين كنا امه واحده شعب واحد فلماذا هذه العنصريه التى تلهب المشاعر وتولد الحقد حتى بين الاخوه اذا لم تعجبكم كلمه اخوه فنحن مسلمين واذا ايضا لم يعحبكم مسلمين فنحن عرب اذا نحن على مساحه صغيره جدا هنا لا نتفق هل تريدون ان ننتصر على عدونا مهما كان ؟ عدونا نحن انفسنا والحقد الدفين الموجود داخلنا لماذا تفتخرون كما كان يفخر اهل الجاهليه الله جعلنا ارذل الامم عندما عندما ابتعدنا عن طريق الله وتريدون ان نتوحد ! فعلا فلتحيا اسرائيل يكفيها فخرا ان فقط 25 مليون نسمه مسيطره على العالم بأسره ليس فقط بقوه السلاح لانهم فقط يفكرون مهما كان لونه او البلد الذي جاء منها او ولد فيه بمصلحه اسرائيل فمتى يكون عندنا وعي عدونا ونصبح فقط ان نحب انفسنا لا غير ذلك"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211054927/http://ana.20at.com:80/20at/7ayatna/7634-12273.html"

[[comments]]
order = 28
subject = ""
author = "زرقاوي"
posted = "2008-08-21"
text = "لا اعرف كيف يقاس الشخص انا مولود بالاردن وحاصل على الجنسيه الاردنيه وطفولتي وكل مراحل دراستي من الابتدائيه حتى انهيت دراستي الجامعه كانت على ارض الاردن ويقولون لي انت اصلك فلسطيني ليس لي لا من قريب ولا من بعيد بفلسطين حتى ولا ذكرى واحده فيها فكيف انسب حالي لها حتى لو كما يقولون انني من هناك افخر كوني ولدت على تراب الاردن واحمل جوازه فلينظر كل من يتلفظ على الاردن بسوء كيف اوضاع الفلسطينين في لبنان ومصر وسوريا حتى كما يفعل الكثير يستخدمون كلمه فلسطين للاستجداء فقط ليس اسرائيل هي الخلل الخلل موجود فينا نحن الفلسطيني مع احترامي له يكره حتى نفسه لماذا احب الاردن حتى الثماله حتى لو كل العالم اعتبرني غير اردني الزرقاء هي جنتي على الارض"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211054927/http://ana.20at.com:80/20at/7ayatna/7634-12273.html"

