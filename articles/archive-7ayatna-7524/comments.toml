subject = "رسالة عاجلة لمحمد نواف الحمد الله"
author = "بنت السعودية"
text = "أولا يا اخ محمد نوف الحمد الله أنا ما أسمح لك انك تغلط على حبايب قلبي الفلسطينيين والفلسطينييات لانهم فعلا اشرف منكم<br />يا حثالة المجتمع والعرب , واقول انوووو كل كلامك غلط بغلط وما ادري لييييش تفتري على الفلسطينييين , بصراحة في فلسطينيين<br />سيئين لكنهم قلال مرة ما يتجاوزا نسبة 1% والبقية كلهم محترمين جدا , لكن اقول يا محمد نواف اني ما اسمح لك أبدا انك تغلط على الفلسطينيين لانك بكذا تغلط علي وعرضهم من عرضي وشرفهم من شرفي , والله اني احمد ربي اني عايشة ومتربية بين الفلسطينيين المحافظين اللي يقدروا النعمة ويحسوا بالمسؤولية , والعفو كل العفو يا اخ المشتاق للحور العين , وناس فعلا متربية وفاهمة ولذيذين , وكلهم حلوين مو زيكم يا الأردنيين لما رحت على وادي رم انفجع أشوفلي وحدة اردنية بدوية متخلفة شكلها زي السلقة ومنخارها طويل مع إني ما اتريق على خلقة ربي سبحانه , لكن هذي الحقيقة اللي بغيت اوضحها ,<br />على كل والله ما احب كثر الكلام , لأنكم يا الأردنيين فعلا سخيفين وهمج وغجر وبجم وبقر تماما , وعلى قولة عاشق فلسطين<br />إنكم زق مزقوق مكبوس (خرة مكبوس) فوق بعضه ,هههههههههههههههههههههههههههههههههههههههههههههههههه<br />وشكرا لكل حبايبي الفلسطينيات وشكرا لك يا بنت نابلس والله يحفظك ويسعدك بالدراين ويسلمووووووووووووو على هالردود الحلوة يا حبايب قلبي الفلسطينييين والفلسطينيات , والسلام عليكم ورحمة الله وبركاته ... كلنا فلسطين .........<br />بنــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ السعودية ــــــــــــــــــــــــــــــــــــــــــــــــــــــت"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 249
subject = "ضحكه !"
author = "محمد نواف الحمدالله ..."
text = "تا أشوفك ياابن الممحونه الداعره العاهره .. ولك ياشلقه كس أمك ع أم كل الفلسطينين .. لكو فش واحد فيكو بعرف الشرف أو العرض .. كلكو ناس بقر .. همج .. حوش .. بجم .. جحوش .. بغال .. يعني بالمختصر المفيد ((( بهايم العاده ))) !!<br />ولكو ع طول صرتوا علي وقلبتوا ضدي .. ولكو ياكلاب ياولاد الكلاب .. كس خواتكو إذا بتفهموا .. كس أمكو إذا بتفكروا ..<br />كس اللي يبلعكو إذا عندو مخ من الأساس .. ولكوووووووو كل الفلسطينيين على راسووووووووووو لزبي .. وكس أمو لأحسن فلسطيني .. نايك خواته السته وستين شرمووووووووووووووووووووووووووووووووووووووووووووووووطه..<br />وبالنسبة لبنت السعودية .. ولك بديش أضح بعرضك وشرفك يابنت العاهره ياشرموطه .. يامفتوحه .. ياقحبه يابنت القحب .. ولك والله لأنيكك على الماشي .. ولك كس أمك إذا بتفهمي إشي .. ولك إنتي مو سعودية .. السعودية أصلاً متربيه من أشكالك مثل الخرااااااااااااااا .. إنتي وحده فلسطينية شرموطه ..<br />كس أمكو .. شو قرفتوني .. وزهقتوني .. وطققتوني .. وكس خواتكو ..<br />والأردن أولا ً .. وسيبقى أولاً .. لأبد الأبديين .. واسمه محغور في قلوبنا .. وسنظل نردده .. أبد الدهر ماحيينا ..<br />والله .. والوطن .. والملك .. وبس .. وجيشنا جيش الوطن سمينا بإسم الله نحمي الوطن والعلم بعيون عبدالله ...<br />أردنيه مش بس بالجنسيه<br />أردنيه وفائنا للعائله الهاشميه<br />أردنيه قبل الميلاد والسنه الهجريه<br />أردنيه بتشميرنا عاليد والمناسف البلديه<br />أردنيه مش تاعين الكبسه والملوخيه<br />أردنيه وعلمنا معروف بالنجمه السباعيه<br />ورمزنا الشماغ الأحمر ومالنا فروع ثانيه ..\"مش مثل شماغكو .. هههههههههههه . شماغ حمير وحشية ( الشماغ الأبيض)<br />ويلا يلاااا يلاااااااااا على بلدكو ياشراميط ولاد الشراميط .. ولاتنسو تلمو عفنكو قرفكو ووسخكو وهبلكو وتسطيلكو معاكو .. ماشي .. ههههههههههههههههههههههههههههه"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 250
subject = "انا لله وانا اليه راجعون يامحمد نواف عفوا خواااف ههههههه"
text = "على فكرة اذا سأل شخص عن الجبن والخوف وقلة العقل والمرض النفسى فأقول له انظر لذلك المدعو نواف ...<br />انا سبق وشرحت لمحمد زفات انوا كلاموا الحقير والتافه متلوا مابنفع لذلك انوا الامور توصل للكفر هون معاملتى الك تختلف لانى حأعاملك على انك مرتد وياحيف على واحد متلك يسب بنت تقيم فى الارض الطاهرة وعلى فكرة انت واحد متخلف عن جد اذا بتكفر وبتسب كلام وسخ هاد مابيعنى انك رجل لا لا لا مو راجل انت !! انت جبان وجبان لدرجة رهيبة لدرجة انى اانا اشفق عليك واخاف انك تموت بجلطة وانت كافر بعد ان سببت رب العزة ولك انا شرحتلك شو معنى الاخلاق والسباب بين المسلمين مشان هيك انت هلأ مو مسلم لانك كفرت بالله .. وشى تانى انت قدمت الاردن اولا حسب كلامك على رب العزة وهاد يعتبر شرك بالله ... قال تعالى :: (( الله لا اله الا هو الحى القيوم ))<br />بعدين بالنسبة للاخلاق انت لاتعرف ماهى ومش غلط انى اذكرك فيها مرة تانية لانوووووووووو الصفحة وافهمنى منيح ولا<br />الصفحة دعوووووية دعوووووية ورجلك فوق راسك .... سامحونى لانى اتلفظ بلفظ لا يليق بى كشخص طاهر ومسلم واتمنى رضى ربى ... مو متل الزفات محمد زفاات .... غريب امرو<br />احاديث على حسن الخلق ::<br />عن عبد الله بن عمرو بن العاص رضى الله عنهما قال : (( لم يكن رسول الله صلى الله عليه وسلم فاحشا ولامتفحشا وكان يقول : (( ان من خياركم احسنكم اخلاقا )) متفق عليه<br />عن ابى هريرة رضى الله عنه قال ان رسول الله صلى الله عليه وسلم قال : (( اكمل المؤمنين ايمانا احسنهم خلقا وخياركم خياركم لنسائهم )) رواه الترمذى<br />عن عائشة رضى الله عنها قالت سمعت رسول الله صلى الله عليه وسلم يقول : (( ان المؤمن ليدرك بحسن خلقه درجة الصائم القائم )) رواه الترمذى حديث صحيح<br />عن ابى امامة الباهلى رضى الله عنه قال : قال رسول الله صلى الله عليه وسلم (( انا زعيم ببيت فى ربض الجنة لمن ترك المراء وان كان محقا وببيت فى وسط الجنة لمن ترك الكذب وان كان مازحا وببيت فى اعلى الجنة لمن حسن خلقه )) حديث صحيح رواه ابو داود<br />اتمنى انك تفهم انوا الاخلاق كنز وانت فقير تحتاج الى كنز الاخلاق فإغتنم الفرصة قبل فوات الاوان وقبل ان يأتى يوم الحساب ويوم المحشر والمنشر فى فلسطين انتبه منيح ... فلسطين .... والحمد لله كبيرة يافلسطين لانك مو بس فلسطين اولا ... وفلسطين اخيرا ...<br />فيا اخى انا راح اعطيك دروس فى الاخلاق انى راح اعتبرك تلميذ ساقط اخلاقيا وعليا تربايتوا جيدا بما يليق بى كمدرس مسلم والله يوفقنى<br />بعدين انا هون مو لارد على كل واحد بغلط او اطلع لغلطوا كل واحد بغلط يحاسب عن نفسوا ... بس انتوا بلشتوا واتحملوا يا ابن الارذذن اوللللى ال اولا ال<br />مابدى اطول لانوا الحكى معك تفاهة ... وشكرى لعاشق فلسطين ولكن لى طلب ورجاء ان تحترموا اعلانى انوا الصفحة دعوية وكفى سباب يااخوان<br />وشكرى لبنت السعودية العفيفة الطاهرة غصب عن الكل وفائق الاحترام لاهل السعودية الكرام<br />انا اخوكم المشتاق للحور العين طبعا ابن فلسطين<br />مسلم واخلاقى ارثها من الحبيب محمدِ<br />وراح اضع بين ايديكم قريب اول درس فى الاخلاق مشان نويت اعلم محمد نواف الاخلاق المحمدية والحمد لله<br />انا مسلم وبعرف حالى ومابهمنى شو بحكى عنى لانوا فى الاخرة راح نشوف مين الخاسر ومين الرابح ؟؟؟<br />ياابنى الحق حالك قبل فوات الاوان .. واعلم ان من مات فى فلسطين فهو شهيد حتى لو كان فى فراشه<br />ماشاء الله عليكى يافلسطين و الله كبيرة واهلك اكابر"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

