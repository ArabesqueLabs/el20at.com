subject = "إلى من داخل بوابة التعليقات"
author = "يوسف البحيصي ( فلسطيني و الكل مقهور مني )"
text = "سلام الله على كل فلسطيني أنا يا إخوان وفقا للظروف و الامتحانات سأعود للتعليق هنا و لكيد كل من يحقد على كل فلسطيني فسأعود بتاريخ 28/5/2008 م و اعلموا جميعا أن الفلسطيني في أي مكان و في كل مكان يبقى حر أبي<br />و سلام الله على كل فلسطيني و لا سلام على من هو حاقد على كل فلسطيني لإنه ليس على ملة الإسلام"
