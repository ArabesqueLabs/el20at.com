[[comments]]
order = 272
subject = "تعليق على رسالة الأخ :- سعيد مقابله"
author = "محمد نواف الحمدالله ..."
text = "اقلك شغلة يازلمه فكك منهم يازلمه بكرا بيجوا عنااااااا وببوسوا ايدينا ورجلينا وجه وقفى عشان نحطهم ونظبهم عنااااااا ..<br />ولك اللي بقهر فيهم يا أخي ,,, إنو يعني الواحد بسوي معاهم خير ومنيح .. مابحبو هاذ الإشي لعاد شو بدهم ؟!!! والله حيرونا .. إشي بطقق وبزهق وبخري .......................................................................<br />ورغم كل إشي .. ورغم أنوف الحاقدين الخونه المرتزقة ......... الأردن أولاً .. وأولاً .. وأولأً ... وسيبقى أولاً ..<br />والأردن اسم محفور في قلوبنا ولا ولن ولم ننساااااااااااه أبداً مماحيينا .. وستبقى الراية الهاشمية مرفوعة عالياً خفاقة فوق جبال الأردن .......................................................................................... والأردن لنا لنا لنا ..<br />الله <<<<<<<<<<<<<<<<<<<<<<<< الوطن <<<<<<<<<<<<<<<<<<<<<<<<<<<< الملك<br />ويعيش الوطن والملك والشعب ........................................................................................................<br />أولاً وآخراَ كل واحد بعرف شو سواااااااااا .. واللهم لاشماته !!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

