subject = "سوسو المتووحش شل عرض الاردن"
author = "sniper"
text = "ياخواتك الشلوكه ياخوات اللبوئه ياخوات المفلووقه الله يجعلني معلم كس اخت الاردن ياخوات الفالقه يخوات ايري كس اخت الملك ع خواتوووو الشرموطات اللي بينتاكوو بالحدائق يااااا منايك اللي يجعلني امووت طخ بس اخت الاردن يلعن شرفكم مهوا كل الشرمطه بتصبر بالاردن ويحكوو تتطور ونعاصر الموضه شوو ياخوات القحبه اي موضه جد بطل عندكم شرف ياعديمين الشرف ولك خخخختفووووووو ع كسكووسهاا اخت الاردن خوات قحبه"
