subject = "ادعوا الله أن يفك الحصار عن غزة"
author = "فلسطيني أصيل"
text = "إخوتي الأكارم , أهلنا في غزة يموتون جوعا وألما وعطشا , ومرعبون لآخر درجة , سيبوكوا من الكلام الفاضي , الناس بتموت وإنتوا<br />جالسين بتتجادلو بكلام فاضي , اللهم انصر اهلنا في غزة , اللهم ارفع عنهم , اللهم قوهم , اللهم دمر دبابات اليهود الصهاينة , اللهم عليك بهم , فإنهم لا يعجزونك , لا إله إلا الله , محمد رسول الله , اللهم انصر المقاومين في غزة , اللهم قوي صواريخهم , اللهم<br />دمر اليهود , اللهم يا الله زلزلهم , اللهم دمرهم , اللهم إن اليهود عثوا في الأرض فسادا , اللهم إنهم قتلوا النساء والأطفال , اللهم<br />انصر المجاهدين , اللهم ارحم موتانا وموتى المسلمين , الله أكبر , الله أكبر , الله أكبر , وحسبنا الله ونعم الوكيل ............."
