subject = "أنا ضد العنصرية بس الفلسطينيين هما اللي بخلوا الواحد يعملوا عنصرية غصبا عنه"
author = "اسامة الزواهرة"
text = "اولا يا خواني انا عمري بحياتي ما عملت عنصرية لكن انتو (الفلسطنية *) الي بتخلو الواحد يعمل عنصرية لانكم اولاد حرام مشردين شغل لقلقة لعنكم الله وادام الاردنين فوق رؤسيكم دائما وابدا وتحياتي لعشائر الاردن كلها وسلا م *******"
