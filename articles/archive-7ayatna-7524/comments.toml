subject = "طززززززززززززززززززز"
author = "طز في أكبر أردني طلع ولا لسا بدو يطلع"
text = "ولك يا ولاد الاردن ياولاد الحراام انتو اشاطرين تسبو ولكم فرجيني واحد زلمة فيكم ولك كل واحد بريل على حاالو وإمو أبل ما ينام بطعمي سيريلاك كس أختكم جوديين ما بتفهمو راافعينلي علم الاردن وهو ما بسوى طيزي خلص بترجعو بتكاابروا يا ولاد الدااشرين ولك انت وياه انا مستعدة احلف يمين انو إمك جبتكم بلحرام أبصر مين عامل معها وجابتك هيك يا إبن ــــــــ أشوف واحد يرد فيككم على الفلسطينية يا ولاااد الدشر والئحيين روحو ضلو مع الجلعة ياا مؤدبيين آل الاردن آل الشحدين الفقرة بتلاقي بس البوابيج على بواب المساجد يوم الجمعة والناس بصلاة بسرئو البوابيج يلعن حتى القر بخليككم تسسرئوا بوابيج وقال بيجو بمزعو أواعيهم وببلشو يعيطو ويشحدو إستحو خلص طتيير زودتوها ياا مضحكة"
