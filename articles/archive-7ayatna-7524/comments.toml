subject = "انهيار النظم الملكية قريبا"
author = "السباعي"
text = "هل سنشهد زوال النـُظم الملكية من بقايا الإرث الإنجليزي في المنطقة ؟<br />السعودية والأردن نموذجاً<br />قبل أن تنهار بريطانيا العظمى وتتراجع قوتها وتنحسر هيبتها فتنطوي على نفسها كانت تتحكم بمصائر الشعوب في العالم وتتلاعب بالخرائط الدولية وتوزع الغنائم على أتباعها كيفما شاءت , سواء عن طريق المنح المالية وبالجنيهات الإسترلينية الذهبية أو من خلال توزيع الأراضي الشاسعة لتتحول لاحقاً إلى دول وممالك وإمارات عازلة .<br />وربما من سخرية الأقدار ومن عجائب ذلك الزمان الأغبر هو عندما انهزمت الدولة العثمانية على أيدي دول الوفاق أو الحلفاء , فجلس المندوب السامي البريطاني مارك سايكس مع المندوب السامي الفرنسي المسيو جورج بيكو على طاولة وأمامهم خريطة الدولة العثمانية والعالم العربي تحديداً , وبدؤوا يقسمون تلك الأراضي كغنائم وضيع فيما بينهم وعلى هيئة خطوط زرقاء وحمراء وسوداء , وكأنها أرث عائلي أو وقف , إلا أنهم والحق يُقال لم ينسوا عملائهم الصغار وخدمهم من بعض الفتات وأحياناً الحظوة المدروسة بتروي وعمق ؟<br />فبينما كان الصراع على أشده في أجنحة التاج البريطاني والتنافس قائم بين المندوب السامي في حكومة الهند البريطانية - السير بيرسي كوكس - وبين المندوب السامي الآخر للحكومة البريطانية في القاهرة السير هنري مكماهون .<br />حيث كان كل مندوب منهم يُحاول أن يبلي بلاءً حسناً في خدمة التاج البريطاني ويسعى لنيل رضى رؤساءه من خلال ترشيح وتجنيد العملاء والمتعاونين معهم من أجل خدمة حكومة بريطانيا العظمى .<br />حيث نجحت بريطانيا في تجنيد وتجهيز عبد العزيز بن سعود بالمال والسلاح وكذلك الحال مع الشريف حسين والهدف هو تحطيم دولة الخلافة الإسلامية واقتسام أوصالها .<br />وبعد أن انتهت المُهمة بنجاح تنصلت بريطانيا من وعودها وتركت عملائها يصفون بعضهم البعض بعد أن إستهلكتهم وحققت مآربها وخططها الإستراتيجية من خلالهم , فباتت تفضل التعامل مع طرف واحد في الجزيرة العربية وليست عدة أطراف .<br />فأستطاع عبد العزيز بن سعود من خلال التغرير وخداع أخوان من طاع الله بدعوة التوحيد , وبسبب خيانة الشريف خالد بن لؤي الذي انضم بدوره لجيش عبد العزيز بن سعود حيث نجحوا في هزيمة الشريف حسين ومن ثم طرده من الحجاز لاحقاً .<br />المُضحك أن بريطانيا كانت تتعامل مع عملائها الصغار في المنطقة بطريقة توبيخ الأطفال وأحياناً من خلال التعويض , وعن طريق التصدير للخارج على هيئة ملوك وحكام تابعين ؟<br />فمثلاً عندما خسر عبد الله وفيصل ووالدهم الشريف حسين حلم تأسيس دولة عربية تحت حكمهم ,<br />قررت بريطانيا تعويضهم على حساب بلاد الشام فمنحت للابن عبد الله كياناً عازلاً ومُصطنعاً أسمته إمارة شرق الأردن لتعويضهم عن خدماتهم الجليلة , وكذلك وهبت لشقيقه الآخر فيصل إدارة الحكم في سوريا الذي لم يدم له طويلاً بسبب رفض الفرنسيين !<br />وعندما هرب فيصل للندن وأخذ يستعطف الإرادة البريطانية السامية ويُعاتبهم على خذلانهم له رغم كل تضحيات والده وخدماته الجليلة للتاج البريطاني قررت بريطانيا إرضاءه من خلال إعادته كملك على العراق بعد الاستقلال المزعوم وهكذا !<br />وعندما منحت أراضي شاسعة فيما بعد للملك فيصل الحاكم في العراق , وبعد أن بكى عبد العزيز بن سعود في خيمة العقير بمرارة وفي حضرة سيده بيرسي كوكس متظلماً من تلك القسمة الضيزى , ربت على كتفه كوكس وقال له :<br />لا تحزن سوف أعوضك من أراضي الكويت وإمارة شرق الأردن فمنحه الخفجي وقريات الملح وهكذا تستمر المنح البريطانية على طريقة خذ من هذا وأعطي ذاك !؟<br />ومن خلال تلك القسمة وهذا النفوذ البريطاني المقيت نمت وترعرعت تلك الممالك والإمارات المُصطنعة والمدعومة بحد السيف البريطاني اللوثري كالفطر المسموم في المنطقة !؟<br />ثم سرعان ما ضعفت وتراجعت بريطانيا كصانع ومورد لتلك الأسر المالكة العميلة , فتحولت تلك الرعاية الأبوية للدن المالك الجديد وهو السيد الأمريكي الواعد .<br />فوجود تلك الأسر المالكة وبقائها في الحكم يعتمد على الدعم الخارجي والرعاية الدولية ولولا ذلك لسقطت وانهارت منذ عقود !<br />وبما أن أمريكا الآن تترنح في العراق وأفغانستان ودورها العالمي بدأ يتراجع بشكل رهيب , فأن بقاء تلك الممالك والحكومات الكرتونية سيبقى متوقفاً على نتيجة انتصار أمريكا في المنطقة وهذا الأمر يبدو بعيد المنال إن لم يكن مستحيلاً في هذا الوقت .<br />وربما هذا ما دفع بأعداء الأمس من صنائع الإنجليز وبقايا مزابلهم لكي يتحدوا من جديد من أجل البقاء والديمومة على تلك الكراسي الإليزابيثية المنخورة .<br />فجزيرة العرب مثلاً تُعاني الآن من مخاض عسير وتتعرض لعوامل ضغط شديدة تتزايد كل ساعة من خلال التذمر العام في ارتفاع الأسعار رغم زيادة أسعار البترول وكذلك الفساد المالي والإداري المُستشري في كل أركان البلد , ولهذا فمصير الأسرة السعودية أصبح في مهب الريح خصوصاً بعد انكشافهم أمام الشعب وتآمرهم المكشوف مع أمريكا وإسرائيل وضعفهم الكبير وفسادهم الكثير .<br />ومسألة التخلص منهم أو الثورة على نظامهم أو ربما حتى الانقلاب عليهم من داخل الأسرة بات وشيكاً جداً , بل حتى أن عرابيهم الأمريكان باتوا يرسلون لهم رسائل تحذيرية من المخاطر المُحدقة بهم وبنظامهم الآيل للسقوط !<br />أما حليفهم قزم الأردن فهو في وضع جد حرج والأوضاع الداخلية باتت تمضي من أسوء لأسوء , والشعب في حالة غضب واحتقان وغليان شديد بسبب الظروف المعيشية الصعبة وتفشي الفساد في الأسرة المالكة وبطانتها !<br />وربما ما قاله الأمير الحسن قبل عدة أسابيع في لقائه الخاص مع قناة الجزيرة فيه الكثير من الصحة , فقد وضع أصبعه على مكمن الجرح الأردني وذلك عندما صرح عن قلقه الكبير وتخوفه من المصير القادم لأسرته الحاكمة !؟<br />فعندما سألته ليلى الشيخلي إن كان قلقاً مما يحصل في الأردن الآن وفي المنطقة عموماً ؟<br />قال نعم هو قلق وأشار لمصير الملك فاروق في مصر ونهاية الشاه في إيران , وقال ربما سيحصل مثل هذا في المنطقة مستقبلاً !؟<br />لكنه لم يذكر مصير أبناء عمومته ملوك العراق مع أنهم الأقرب للحالة !؟<br />والسبب أظنه لم يرغب باستفزاز ابن أخيه الغر عبد الله الثاني والأخير , وربما خشي من أن يفهم كلامه من قبل المتربصين به على أنهُ نوع من التهديد والوعيد المبطن ؟<br />لأن العائلة المالكة السابقة في العراق هي أقرب مثال وأصدق تشبيه بوضع العائلة المالكة في الأردن الآن ؟<br />فالملك فيصل الثاني كان طفلاً وتحت رعاية وولاية خاله الفاسد عبد الإله الذي كان سكيراً ومقامراً أيضاً , حيث كان يجمع حوله عصابة كبيرة من الوصوليين والمُرتزقة شبيهة بعصابة الولد عبد الله الثاني !<br />وذلك أبيدوا دون رحمة في مذبحة قصر الرحاب , ولم ينجو منهم إلا الشريف حسين وزوجته بديعة وأبنائهم حيث فر مع أسرته لخارج العراق , والمُفارقة الغريبة أنهُ سلم من التصفية بعد أن لجأ للسفارة السعودية في بغداد !؟<br />وهنا يجب أن نعود للطريقة التي حكم بها هؤلاء الخونة إمارة شرق الأردن منذ أيام غلوب باشا أبو حنيك إلى أن أصبحوا مُلوكاً بالوكالة ؟<br />فقد يستسيغ البعض أيام حكم عبد الله وطلال وحتى الملك حسين والسبب أن في عهودهم كانوا قلة قليلة هُم المتعلمين في المُجتمع الأردني , وأبناء الشعب سواء كانوا بادية أو حاضرة لم يكن لهم طموح وتطلعات بل أن أغلبهم كان يعتبرون الهاشميين – أزلاماً لبريطانيا – أي رجال الإنجليز في المنطقة ومع مرور الزمن تقبلوهم كحكام وملوك لهم خشية من الهراوة البريطانية , مع أنهم شديدي العداء للغرباء حتى ولو كانوا عرباً من دول الجوار !؟<br />فتجد بعض الأردنيين الآن مثلاً يغضبون إذا ما تولى أردني من أصل فلسطيني منصباً رفيعاً في الدولة , بينما ملوكهم كلهم مستوردين من الحجاز جاءوهم مُحملين على ظهور البغال البريطانية !!!<br />ولا أعرف هل هي عقدة أكتسبها الشعب من أخلاق وطباع ملوكه المستوردين , وذلك عندما هزموا على يد آل سعود فتجدهم الآن يتملقون ويتمسحون بآل سعود ؟<br />وبما أن الفلسطيني مطرود من قبل الصهاينة ومُبعد عنوةً عن بلده ومازال يُقاوم لاسترجاع أرضه إلا أنه لا يجد القبول كما يجده اللاجئ لهم من ارض الحجاز مثلاً مع أنها أبعد مسافة للأردن من فلسطين !؟<br />وأقصد هنا قبولهم بالأسرة المالكة الهامشية التي تسومهم العذاب وتسرق أموالهم وتبعثر ثرواتهم ومع هذا تجد البعض يُمجد بهم وهو مستعد لأن يكون جزمة بالية ورخيصة ينتعلها أبو حسين !<br />وبالمُقابل تجد تحفظهم ورفضهم للقادم من أرض فلسطين مع أنهم من نفس العوائل والأسر المتداخلة !<br />ذلك التنافر وتلك الإشكالية استفاد منها النظام الأردني كثيراً في بقاءه , فقد نجح بالعزف على أوتار الأردني الأصلي والأردني المُجنس , وأتقن اللعب على تلك التناقضات لأنهُ استغلها أفضل استغلال ؟<br />فهو تارةً يتخندق مع الأردنيين بحجة أن الفلسطينيين المقيمين في البلد يشكلون خطراً على التركيبة السكانية , وعندما يحس بالتذمر والخطر من أهل البلاد الأصليين يتوجه للأردنيين من أصول فلسطينية ليجد الدعم منهم في حالة تمرد أبناء الأردن حاضرة وبادية !<br />أي أن الدخيل والغريب المطرود من بلده والذي أتت به بريطانيا ومنحته تلك الأمارة كتعويض أصبح يتلاعب بالأخوة والأشقاء في بلدهم , وبات يصنفهم حسب رغبته وفي كل مرحلة يتحول في حضن أحدهم وبهذا يُحقق الضمان والبقاء لنظامه القمعي .<br />ولو سأل كل مواطن أردني نفسه بعض الأسئلة :<br />1- ما الذي حققه الأشراف من نجاحات في مسقط رأسهم الحجاز حتى يوردوا لحكم الأردن ؟<br />2- هل تُعاني الأردن من نقص في الرجال أو هل عقمت النساء حتى يحكمها أشخاص مستوردين من خارجها ؟<br />3- لماذا تتحمل الأردن أرضاً وشعباً خيانة أفراد هم ليسوا أصلاً من مواطنيها وتحسب عليهم عمالتهم !؟<br />4- لماذا يأتي شخص غريب من خارج الأردن ويستولي على ثلاث أرباع ثروات البلد , وابن البلد الأصلي يُعاني الجوع والفاقة ؟<br />5- ما الذي يتميز به الملك عبد الله الثاني من شهادات ومقدرات عقلية عن بقية أبناء هذا الوطن الأصليين وخصوصاً النخبة منهم ؟<br />هنالك أسئلة كثيرة لو توقف كل أردني وحاول عصف أفكاره سيجد نفسه في ضحية في قسمة دولية ظالمة ليس لهُ فيها ذنب أو نصيب يذكر .<br />والذي قد تغير الآن أن شرائح المُتعلمين في الأردن قد اتسعت وتوسعت مداركهم وأن الشعب لم يعد بعقلية القرن الماضي عندما كان يقبل أن يحكمه الملك حسين وهم طفل !؟<br />أسئلة كثيرة يجب أن يطرحها أي مواطن عادي على نفسه وبعدها يُقرر إذا كان يقبل أن يكون تابعاً لتلك العائلة أو يتبرأ منها ومن خيانتها للأمة وتعاونها مع أعداء الإسلام .<br />فمن حق أي مواطن أردني بسيط وعاطل يُقارن نفسه بالملك الغر الحالي وسيجد أن الكفة ستميل لصالحه ؟<br />فهذا الملك بالإضافة إلى أنهُ مستورد مرتين , مرة عندما جاء جده عبد الله مطروداً من الحجاز , وأخرى عندما تم تصدير هذا الولد العابث من مزابل وبارات الملكة إليزابيث ليكون ملكاً متوجاً على الأردنيين وكأنهم مُجرد قطع أثاث في قصر رغدان لا رأي لهم ولا مشورة !؟<br />وفي رأيي أن أي أردني شريف من حقه أن يرفع صوته ويده بوجه هذا الغر المُقامر التافه ويقول له توقف يا ولد أنت وعصابتك وأخرج بكرامتك من بلدنا وإلا سيكون مصيرك كمصير أبناء عمومتك في قصر الرحاب في العراق .<br />وأما الزعم أن العراقيين قد خسروا عندما تخلصوا من أبناء الأفاعي كما أطلق عليهم والدهم الشريف حسين ؟<br />فالحق يُقال أن العراقيين هم الوحيدين الذين نجحوا في بتروا تلك الرؤوس العفنة المستوردة كما سيبترون تلك الرؤوس الدخيلة التي جاءت برفقة الدبابة الأمريكية والأيام ستثبت صحة ذلك .<br />إذن تخوف الأمير الحسن في محله وهذا الولد العابث لن يطول به المقام طويلاً خصوصاً إذا ما استمر على غيه وفساده وعبثه , والموعد هو عندما تندحر أمريكا وتشد رحالها حينها ستسقط تلك الرؤوس الخاوية وتنهار العروش على الكروش لأن سيدهم قد أنهزم ولم يبقى أمامهم الآن إلا التخندق مع بعضهم البعض لعل هذا يطيل في أعمار ممالكهم الورقية .<br />فهل سنشهد قريباً انهيار منظومة تلك الأسر المالكة والتي هي من بقايا مزابل إليزابيث وصنيعة الإنجليز والذين نصبتهم في الماضي بريطانيا ودعمتهم أمريكا بأساطيلها ؟<br />وما هو مصير تلك الأسر بعد رحيل أمريكا من المنطقة ؟"
archived = "2009-04-05"
