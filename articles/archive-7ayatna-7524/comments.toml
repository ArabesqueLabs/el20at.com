subject = "الأردن عالي عالي .. وفلسطين عفواً ( فلسطييييز ) تحت نعالي ( حفايتي ) ..."
author = "محمد نواف الحمدالله .. ."
text = "ولكو يافلسطيزيه لو في واحد منكو بفهم أو عند حتى استعداد إنو يفهم .. ولكو بقص إيدي إذا فلسطيزي بفهم .. مكلكو ع بعض شلة مساطيل هبايل مدودي معفنيين مفطسيين ريحتكو طالعه ... وفوق كل هيك أشرمك وأكلب وأنذل وأحقر وأوطى وأسفل وأرذل شعب في العالم بلا مناااااااااااااازع .. ماشالله عليكو محتليين الصداره أنتو .. أي كس أم شرفكو ولاد منيوكه عارهره داعره، عليم الله الواحد منكو بوساش قشرة بصلة .. بندعس ع شرفو وشرف اللي خلفو وخلفتو وبنتاك من اللي بسوى واللي مابسوى وختو وأمو وكل بنات عيلتو وكل بنات فلسطين بتناكو منا حنا الأردنية .. فلا عجب في ذلك بأن ترى هؤلاء الفلسطيزيه طالعين من زبابناااااااااا .. ولكو قسماً بالله إنكو الواحد بسألش عن حالو .. كل واحد بشتغل ع حالو .. وفش فيكو واحد أو حتى نص واحد أو ربع .. ياسادة زلمه ابن زلمه بنشد فيه الظهر.. كلكو شغل صياح وصراخ وجعجه .. وع الفاظي وقال شو قال فلسطين أم الدول أي كس أختها من دولة نايكينها اليهوووووووووووووووود واحد واحد .. ولكو اللي مش عاجبيتو العيشة بلادنا بوجه ع أقرب جسر وينخلع من بلادنا والخلعة اللي تخلع رقبتو وتخلخل عظامو وإنشالله بتكسر وبتشقف ميت شقفة وشقفة .. أي والله ( بكسر الهاء ) .ز أنو أنا مع الأردني الأصيل النشمي ( خالد الهزايمة ) وبقولو هذوله مش بس خسارة فيهم النعمة هذوله أصلاً مش وجه خير .. يا أخي العزيز هذوله حرام إنهم يعيشوا ف الدنيا .. هذوله مكانهم الزبايل لأ شو زبايل لسه الزبايل أحسن منهم ومن الي جابوهم .. ولك هذوله يا أبو هزايمة مكانهم الشارع مكانهم إنهم الملاهي والكازينوهات والبارات والمراقص الليلية وغيرها .... هذوله بناتهم بتلاقيهم بتناكو ع قرش واحد فقط لاغير .. وإن طارت بتناكو بص دينار !!! كس خواتهم ماعندهم شرف ولا خلق ولا حتى دين ..<br />ولكو الأردنيين اللي بتحكو عنهم إنهم بدو وهبايل .. ولكو هذوله أصل العرب الأصيل .. ولكو هذوله أساس العرب .. ولكو هذولة همه البدواة والأصالة والعراقة .. ولكو هذولة همه نشأة وبروز العرب .. ولكو هذوله البدو عندهم الأخلاق والقيم والعادات والتقاليد والمبادئ فوق كل إشي .. وعندهم الواحد لما يجي عليهم بحيو وبأهلو وبسهلو فيه . وبعد هيك بستقبلوه عندهم وبكرموه بغظ النظر إن كان هذا ابن فلا أو ابن علان بالعكس مافي تمييز أو استثناء بين البشر .. ولكو هذولة البدو اللي بتحكو عنهم مش زلام بسو عن كل فلسطين وأهلها وشعبها وباللي فيها .. ترى اللي بحكي غير الكلام الي معروف عن الدو واللي هو كثير كثير .. بكون كذاب ابن كذاب وواطي ابن واطي وماعندو أصل أو فصل .. صحيح منتو إنتو الفلسطينية ولاد حراااااااااااااااااام، لقطاء يعني أو بالأحرى ولاد زنا .. كس أمكو وخواتكو فش واحد فيكو ابن حلال وجاي عن طريق شرعي كلو بنيك بكلو عندكو ..<br />والأردن أولاً اسم محفور في قلوبنا .. ورح نظل نردده ونحكية ونعيد ونزيد ونكرر فيه لحتى آخر نفس فينا .. والأردن أولااااااااااااً ..<br />ويحيا الأردن وكس أمك يافلسطين يابلد الشرموطات العاهرات الداعرات .. وكس أمكو ع أم الرئيس أبو مازن البهائي الواطي اللي ماعندو أصل أو شرف .. اسمعو منيح هونه حنا ملكنا هاشمي .. مش مثل رئيسكو اللي أصلو مش عارف من وين أكيد جاي عن طريق الحرام وعن طريق علاقة جنسية غير مشروعة .. يعني إذا رئيسكو مش معروفلو أصل فما بالكو بإنتو .. يعني الشعب !!!<br />أردنيه مش بس بالجنسيه<br />أردنيه وفائنا للعائله الهاشميه<br />أردنيه قبل الميلاد والسنه الهجريه<br />أردنيه بتشميرنا عاليد والمناسف البلديه<br />أردنيه مش تاعين الكبسه والملوخيه<br />أردنيه وعلمنا معروف بالنجمه السباعيه<br />ورمزنا الشماغ الأحمر ومالنا فروع ثانيه ..\"مش مثل شماغكو .. هههههههههههه . شماغ حمير وحشية ( الشماغ الأبيض)<br />ويلا يلاااا يلاااااااااا على بلدكو ياشراميط ولاد الشراميط .. ولاتنسو تلمو عفنكو قرفكو ووسخكو وهبلكو وتسطيلكو معاكو .. ماشي .. ههههههههههههههههههههههههههههه"
