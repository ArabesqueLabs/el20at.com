[[comments]]
order = 270
subject = "أكبر شعب متخلف في العالم (بتشديد الخاء واللام) هو الشعب الأردني (الجرذني)"
author = "عاشق فلسطين"
text = "عدت إلكم من جديد , طبعا من خلال التعلقات الموجودة بهاي الصفحة وخاصة المتخلف البقرة الممحون محمد نواف الحمد الله والله<br />لا يرجعك تاني هون يا حقير , وأسفك عارض , هده التعليقات الموجودة بهده الصفحة دليل كبييييييييييير على تخلف الأردنيين الأصل<br />وليس الفلسطينيين , لأنو الفلسطينيين هما اللي رفعوا راسكوا يأ اردنيين يا كلاب يا خرة يا مفاعيص يا فلاغيص , طبعا والله أنا ما<br />بحبش كتر الكلام , لأني والله فلسطيني ابن أصول وعاقل وفاهم , وبقلك : لا يضر السحاب نبح الكلاب , فيسبوا هدول الأردنيين<br />ينبحوا زي الكلاب ويعووا ليل نهار , هما الخسرانين , وخرة عليكوا وعلى الملك الحقير تبعكوا وإن شاء الله الإنتصار قادم , رح<br />يتم تحرير غزة قريبا إن شاء الله ورح نيجي نستعيد ارضنا اللي هي الضفة الشرقية من فلسطين , ونصير أحسن دولة في العالم ,<br />وسيعتها بندعس على رقابكوا وعلى رقاب اللي خلفوكم يا أولاد الكلب , وأنا فلسطيني وبفتخر واللي مش عاجبو ياكل 100 خرة"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
