text = "اولا شو بتقربلك كل من سهى بشارات، نانسي بشارات، نادين بشارات.. ولك نكتهن من طيازهن اكثر من كساسهن.. ولك انا عيشتي كلها في امريكا والنيك اللي نكتوا لبنات البشارات بعدد شعر راسك .. اما بالنسبة للاردنيات عموما فامريكا فهن مموحانات على الاخر.. تعال شوفهن في احضان الفلسطينية يا منيك يا عديم الشرف.. يا ابن رهيجة"
