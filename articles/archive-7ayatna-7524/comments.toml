subject = "لاننى ابن الاسلام العظيم"
author = "المشتاق للحور العين ( طبعا ابن فلسطين )"
text = "قال صلى الله عليه وسلم :: (( انما الاعمال بالنيات وانما لكل امرئ مانوى )) او كما قال رسول الله صلى الله عليه وسلم<br />فيااخوانى الاعزاء ابناء الاسلام العظيم احسنوا النية مع الله اولا ثم مع العبد الفقير الى الله وكلنا الى الله عباد فقراء تسيطر علينا احيانا مواقف تمزق فينا الروح الايمانية وتدعونا حينها النفس الى الهوى اى ماتحب تدعونا الى السوء والعياذ بالله فما يحدث فى هذه الصفحة سوء و منكر اخشى ان يكون علينا لا معنا لذلك ان كانت وقفتك اخى محمد نواف مع النفس بنية صادقة فلتعتذر الى من اسئت وكذلك الاخرون لنكن جميعا ابناء الاسلام العظيم فيااخى اليوم فات وغدا لقاء الاموات ...<br />لاتجعلوا انفسكم تأمركم بالسوء فتصحبوا على مافعلتم نادمين وحاربوها واتقوا الله فيما تنطقون لعله يكون فى ميزانكم جميعا<br />وانا يااخى لا انكر اننا مسلمون متحابون فى الله يوم يظلنا الله فى ظله يوم لا ظل الا ظله جل وعلا لذلك اننى اتقبل تلك الوقفة الرجولية منك نعم انها النفس اللوامة اتدرون من تكون النفس اللوامة ؟؟ النفس التى تفعل السوء ثم تلوم نفسها و الله انها اقرب الى النفس الطيبة وابعد عن النفس الامارة بالسوء .. البعض سيسألنى ماتقول يااخ المشتاق ؟؟ فأنا اقول ان الله اقسم بهذه النفس فى كتابه الجليل قال تعالى فى سورة القيامة الآية \"2،1\" (( لا قسم بيوم القيامة ( 1) ولا أقسم بالنفس اللوامة (2) )) صدق الله العظيم<br />من هنا احب ان اذكركم بلمحة بسيطة عن انواع النفوس او اشكالها حسب ماورد فى الكتاب والسنة ::<br />تصنيفات النفس البشرية وما ذكر عنها فى القرآن والسنة<br />لقد وردت صراحة ثلاث آيات تبين مستويات النفس من حيث الإيمان ، فهناك النفس الأمارة بالسوء ، النفس اللوامة ، و النفس المطمئنة .. إضافة إلى النفس المسولة ، والنفس البصيرة ، والنفس المضطربة، والنفس الوسواسة. وهذا توضيح لكل نوع من هذه الأنفس :ـ<br />1ـ النفس المطمئنة :ـ<br />قال الله تعالى فى سورة الفجر الآية \"27\"(( يا أيتها النفس المطمئنة ارجعي إلى ربك راضية مرضية فادخلي فى عبادي وادخلي جنتي )) . صدق الله العظيم<br />النفس المطمئنة هي أرقى درجات الرفعة التي تصل إليها النفس البشرية ، فلم ترد النفس فى القرآن الكريم بهذه الصفة إلاَ في هذه الآية ولعلّ الوصول إلى الاطمئنان يحتاج الكثير من المسلم حتى يرقى إليه . فالنفس المطمئنة هي تفاعل ايجابي أساسه الإيمان ،فالروح التي أراد الله لها أن تكون نقية صافية مؤمنة تتفاعل بالعقل الذي آمن بالله من خلال التفكير بمعجزات الكون والخلق كافة .<br />شروطها :<br />1ـ أن تكون صادقة مع نفسها بمعنى أنها يجب أن تكون صادقة مع ذاتها .<br />2ـ أن تكون صادقة مع الله أي أن تكون صادقة مع خالقها الذي هو سبب وجودها .<br />3ـ أن تكون صادقة مع الآخرين أي أن تكون صادقة مع من حولها من الآخرين .<br />ويكون الإنسان راضياً عن نفسه عندما يكون الله تعالى راضياً عنه وهذه النفس مبشرة بالجنة ، مبتعدة عن الذنوب والمعاصي خالية من الأمراض والأنانية و التكبر.<br />2ـ النفس الأمارة بالسوء :ـ<br />قال تعالى في سورة يوسف الآية \"53\" (( وما أبرىء نفسي إن النفس لأمارة بالسوء إلا ما رحم ربى )) . صدق الله العظيم . وقال صلى الله عليه وسلم \" نفسك إن لم تشغلها بالحق شغلتك بالباطل \" .<br />من خلال هذه الآية نرى للنفس هنا مكانا للشر و الفتنة وتقترن بالهوى والشيطان وبفعل السوء ، والنفس الأمارة بالسوء تأمر صاحبها بفعل الخطايا و الآثام وارتكاب الرذائل وهى التى توسوس لصاحبها بشتى الو سائل مستعملة معه التحسين و التيسير وكل المغريات التى توقعه بلا شك فى الإثم و الخطأ ، فمثلاً أولئك الذين يعملون السحر و الشعوذة ويفرقون به بين المرء وزوجه أو بين الأخوة فما عملهم هذا إلا دليل على ضعف نفوسهم وعقولهم و سيطرة الشيطان عليها . فهذه النفس الحاقدة و المستهزءة سوف تخرج وتضخ مواد سامة مضرة بصحة الانسان و العديد من الأمراض النفسية التى تكون سبب للأمراض الجسدية كفقدان البصر و السمع و الشيخوخة المبكرة و كذلك أمراض السرطان و سقوط الشعر وحب الشباب وتسوس الأسنان ولا نقول أن كل تسوس أسنان بسبب الأمراض النفسية ولكن قد يكون 20% بسبب الشكولاة و20% الآخرين بسبب الالتهابات الحادة و60% بسبب الغيبة والنميمة .<br />3ـ النفس اللوامة :ـ<br />قال تعالى فى سورة القيامة الآية \"2،1\" (( لا قسم بيوم القيامة( 1) ولا أقسم بالنفس اللوامة(2) )) صدق الله العظيم .<br />تعتبر النفس اللوامة درجة وسطى بين النفس المطمئنة و النفس الأمارة بالسوء،<br />والرقى من النفس الأمارة بالسوء إلى النفس اللوامة يحتاج إلى الاعتراف بالذنب و غسل الذنب بالدموع والعودة إلى الله والتوبة النصوحة فى جادة الصواب (( وأما من خاف مقام ربّه ونهى النفس عن الهوى فإن الجنة هي المأوى )) .<br />وهى من أفضل الأنفس عند الله لأنها تعمل كرقيب على الإنسان حتى لا يقع فى المعاصي وتلوم صاحبها وتشعره بالذنب عندما يخرج عن دائرة الصواب إلى دائرة الانحراف ، أي هي بمثابة الناهي عن الخطأ و المرشد إلى الصواب .<br />4 ـ النفس المسولة :ـ<br />قال الله تعالى فى سورة يوسف الآية \"12\" (( وجاءو على قميصه بدم كذب قال بل سولت لكم أنفسكم أمراً فصبر جميل والله المستعان على ما تصفون )) .<br />وهى التى تزين وتسهل شيئا منكرا لصاحبها ليعمله ،وتسمح للإنسان بارتكاب المعاصى التى لا ترضى الله عز وجل وتجعل ارتكاب الذنوب أمر بسيط وهى النفس التى يقصدها الشيطان لضعف إيمانها وسهولة التأثير عليها . كماأن هذه النفس تظهر الشر على أنه خير مثل تزيين وتسهيل عملية الرشوة وهى حرام .<br />5ـ النفس البصيرة :ـ<br />قال تعالى فى سورة الذاريات الآيه \"21\" (( وفى أنفسكم أفلا تبصرون )) .<br />لقد كرمنا الله تعالى بالعقل والحواس من أجل أن نستخدمهما فيما هو نافع ، ونفخ فينا من روحه الخيّرة وهذا قمة التكريم . فهذه النفس هى التى تكون بصيرة بفعال العباد وتعرف ما يسلكونه من خير أوشر وتقوم بتبصير الإنسان بأخطاءه وتنبهه لها، ولقد أمرنا الله بأن ندرك أنفسنا وذلك بالوعى والإدراك وأن نعى ما بداخلنا لقوله صلى الله عليه وسلم \" من عرف نفسه عرف الله \" وهذا يعنى أن الإنسان عندما يعرف ذاته أى نفسه ويعرف ماذا يريد فى الحياة وماهى أهدافه سوف يستطيع بعد ذلك أن يعرف الله سبحانه وتعالى .<br />6ـ النفس المضطربة :ـ<br />وهى النفس التى لا تعرف الاستقرار فدائما فى حالة اضطراب وعدم استقرار فصاحبها إما متصف بالغرور أو النميمة و التكبر أو الأنانية فهذه كلها حالات اضطراب وكذلك الحقد والحسد والغيرة كلها تدل على النفس المضطربة والغيرة ليست دليل على الحب بل هى دليل على الكره وعدم الثقة والشك والغيرة تسبب للإنسان 26 عقدة نفسية و الغيرة تختلف عن الغيرية فالغيرية شىء جميل لأنه سوف تكون له غيرية عن الوطن و الشرف والعرض وغيرها .<br />وفى هذا السياق نجد أن الله تعالى يدعونا إلى التحول النفسى حيث قال رب العزة (( إن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم ))وهذا يعنى أن الله يطالبنا بالنظر إلى أنفسنا بغية تغييرها والعمل على إصلاحها فالتغيير النفسي ضرورة ملحة .<br />7ـ النفس الوسواسة :ـ<br />قال الله تعالى فى سورة ق الآية \"16\" ولقد خلقنا الإنسان ونعلم ما توسوس به نفسه )) . صدق الله العظيم .<br />فوسوسة النفس هى وسوسة الشيطان ، ومهمة الشيطان دوماً هى غواية الإنسان وتضليله حتى يصبح كل حرام حلالاً لديه فلا يكسب الدنيا ولا يكسب الآخرة<br />ولما كانت النفس محطة يستقر بها الشيطان شيئاً فشيئافإنها ذاتها تعيش حالة الشيطان فى الوسوسة .<br />فالشيطان يزين للعين المنظر الحسن ولو كان الانسان مؤمناً فهو أيضاً مستهدفاً من قبل الشيطان فقد يترك الإنسان يتعبد ويصلى ولكن ليس فى وقت الصلاة فإذا تأخر الإنسان عن صلاته مرة بعد مرة يستطيع الشيطان بعدها أن يؤثر فيه أكثر وأكثر حتى يلغى وقتاً من الأوقات ثم وقتين وهكذا حتى يبعده كلياً عن فرض من فرائض الله .<br />قال رسول الله ـ صلى الله عليه وسلم \" إن العبد إذا أذنب نكث في قلبه نكثه سوداء فإن نزع واستغفر وتاب وصقل ، وإن عاد زيد فيه حتى تعلو قلبه \" .<br />لقد أخذت النفس عالماً واسعاً من التحليلات النفسية والفلسفية لما فيها من ظواهر وعلامات كثيرة تشير إلى سير عملها ونشاطها ومجال حركتها ، وعلاقتها بالعقل والقلب والجسد ومن ثم علاقتها بالأهواء والنزوع نحو الشر أو الخير وجميع ذلك نجده فى القرآن الكريم .<br />يقول الله تعالى فى سورة الشمس الآيات (( ونفس وما سواها ، فألهمها فجورها وتقواها ، قد أفلح من زكّاها ، وقد خاب من دسّاها ))<br />فالنفس فى الخلق الأول وضع الله فيها الخيار والاختيار فهى ملهمة أن تعرف التقوى وتعرف الفجور فمن زكىّ النفس وارتقى بها يفلح ومن جعلها تتبع الهوى والشهوات تخيب ويخيب معها صاحبها ، فمن عرف أصول النفس عرف أن لا قدرة له عليها إلا بالإستعانة بخالقها عز وجل وعبادته وترفّعه عما يذم ويؤدى به إلى المهالك .<br />والنفس إذا تمكن منها الهوى والفجور يتملكها الشيطان فتلجأ النفس إلى القلب تطالبه باستعمال الجوارح فى الفجور . فخاطر النفس وخاطر الشيطان مذمومان محكوم لهما بالسوء ، كثيرون يقولون أن لا وجود للشيطان ويقولون إن النفس الأمارة بالسوء هى الشيطان ذاته ، والحقيقة أن النفس محكومة لحاكمين حكم الشيطان إذا غفلت عن ربها وحكم الروح والإيمان إذا جفت الشيطان وحاربته ورفضت غوايته ، والنفس ملجأ الشيطان ينفذ منها إلى كافة الجسد فإذا ضيقت عليه الخناق و ذلك عن طريق الايمان فإنه يخرج منها وإلا سيظل يمتلك زمام قيادتها يجرها إلى الفساد والافساد وتزيين المحرمات والسقوط فى مهاوى الشهوات .<br />فى الختام ...<br />اسأل الله لى ولكم الحب فيه .. اللهم اجعلنا اخوان متحابين متراضين ان تناقشنا بالتى هى احسن فهكذا اوصانا القرأن الكريم وان تحوارنا فلا غالب ولا مغلوب ان شاء الله<br />واوجه شكرى واحترامى الى كل من يتفهم القضية ويبعد الجدل والغضب عن روحه الطيبة بارك الله فيكم جميعا<br />فالاخ محمد نواف اخطأ كما الاخرون وعندما دخلت الى هذه الصفحة ورأيت ماكتب ادركت انه اردك الصح والحق فلا فائدة من الجدال ولتخمد الالسنة التى تحارب الحقيقة ...<br />بارك الله فيك اخى وجعل تلك الوقفة غفرانا لذنوبك جميعا اللهم ماوفقه لما هو خير له<br />وهنا ادعوا المدعو عدنان صوالحة الى توخى الحذر فى مخاطبة اهل فلسطين او غيرهم او اهل الاسلام بصورة اعم<br />ومن هنا ايضا انصح المدعو عدنان الصوالحة ان لايسب ولا يشتم حتى لا يعامل على انه فاسق كما بين لنا الرسول فى الاحاديت الشريفة عن السب والشتم فقال صلى الله عليه وسلم (( السباب بين المسلمين فسوق فمن سب مسلما فهو فاسق والقتل بينهم كفر فمن قتل مسلما فقد كفر كفرا ً اكبر )) او كما قال رسول الله صلى الله عليه وسلم<br />وادعو محمد نواف ان ينهى القضية مع اخوانا الاردنيين ولتكن الصفحة محضر خير لنا يوم القيامة<br />اخوانى و الله انى اتحدث من باب الحب والاحترام والشفقة على من لايدرك ماينطق لسانه وحاله لان يوم الحساب ات لامحاله<br />لا اريد ان اطيل .. فى النهاية ادعو لاخوانكم المجاهدين فى فلسطين واخص قلب الحصار غزة عنوان الصمود والضفة الابية والقدس المحتلة ... والله فى عون العبد مادام العبد فى عون اخيه المسلم<br />والسلام عليكم ورحمة الله وبركاتوا ,,, احبكم فى الله<br />اخوكم المشتاق للحور العين ابن فلسطين"
