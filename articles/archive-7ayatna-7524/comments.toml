subject = "نصحنا الناس و ما اتنصحوا ننصح الموقع نشوف يمكن !!!!!"
author = "عابر سبيل و رايح"
text = "بس انا عندي تعليق .. و ارجو من الجميع قراءته بعد السلام على من اتبع الهدى<br />بعد هالموضوع و التعليقات البشعة التي وصلت للسب بالاعراض و الدين .. تعليقي الوحيد .. انه لم اتصور انه موقع عشرينات يكون حقير لهذه الدرجة ... و لم اتصور مدى التهافت و الحقارة التي فيه و هو يدعي انه موقع اسلامي اساسا منبثق عن موقع اسلام اون لاين ... عيب عليكم يا عشرينات !!!<br />موضوع قديم مثل هذا يسب فيه الاسلام و المسلمين من كل مكان و تسب الاعراض علنا و لا يفعل صاحب الموضوع اي شئ؟؟؟؟؟ يعني معقولة محد من المشرفين في الموقع شاف التعليقات الوسخة ؟!<br />كيف سمحت عشرينات ان يصل الموضوع للسب بهذا الشكل و الحديث القذر ؟؟؟<br />اين مسؤوليتكم امام الله يا موقع يا محترم و كل هذا السباب و كل الفتنة هاي و كل الشقاق و البغض الذي يسببه السماح بهذه التعليقات سيكون في رقابكم و تحاسبون عليه يوم القيامة !!!<br />و لا انتوا تريدون هذه الشتائم و السباب لانه ماشاء الله جابتلكم جمهور واااسع ترا العرب اشطر منهم في السب مافي و الظاهر عشرينات تعرف هذا الشئ و الطريقة الوحيدة لانجاح اي مقال هي فتح مجال الشتايم فيه ، بدلا من انه الناس تتكلم في الموضوع الاصلي يصبح الموضوع كله شتايم يلا المهم زيادة عدد قراء الموضوع و تعليقاتهم ؟؟؟؟ صح يا عشرينات ؟؟؟<br />بعد كلللل هذا تعليقي الوحيد و قناعتي الجديدة انكم موقع حقيقة لا يستحق الوجود ...<br />نصحنا الناس و ما اتنصحوا ننصح الموقع نشوف يمكن !!!!! و لو اني ما اظن ..<br />حسبنا الله و نعم الوكيل ..."
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

