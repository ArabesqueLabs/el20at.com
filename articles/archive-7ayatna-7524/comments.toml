subject = "الاردن اولا في خدمة الصهيونية العالمية"
author = "صالح سيف"
text = "الاردن اولا في خدمة الصهيونية العالمية الاردن اولا في خدمة الماسونية الاردن اولا في خدمة الامبرالية وبساطير الانجليز والاميركان الاردن اولا في التامر على قضية فلسطين وشعبها الاردن اولا في التامر على المقاومة الفلسطينية الاردن اولا في التامر على حماس والجهاد الاسلامي وكل فصائل النضال الفلسطيني الاردن اولا في التامر على عراق صدام حسين الاردن اولا في التامر على سوريا وعلى الفلسطينيين في لبنان الاردن اولا في الوقوف بخندق الموارنة الشراميط في لبنان الاردن اولا في التامر على المقدسات وعلى قدسية ارض الاسراء والمعراج الاردن اولا في تسليم الضفة الغربية عينك عينك لبني صهيون الاردن اولا في تجريد اهل الضفة الغربية من السلاح وبشكل علني وصريح لافراغ الارض من سكانها وجلبهم لاعمار الدولة المسخ الانجليزية \\\"الاردن\\\" التي وجدت لاجل اسرائيل<br />الاردن كلب حراسة وفي لاسرائيل ولليهودية العالمية"
