subject = "أردني والنعم"
author = "Jordan First"
text = "شكري يا خرا شكلك بدك تهزيئة متل التهزيئة الأولى المشكلة انو الفلسطينية ما عندهم مخ وعقل عشان يفهمو والمشكلة التانية انك عارف اجوبتك وكل الفلسطينية اجوبتهم وحدة وكلامهم واحد سبحان الله مش مبينة الشغلة انو شخص واحد اللي بكتب لإنو الفلسطينية مخزيين من حالهم مش عارفين يردو ولما يردو بحكو نفس الحكي ولكم روحو اضحكو على امثالكم يعني ازا انتو بنضحك عليكم حنا الأردنية بنضحكش علينا وكلامك معاد زبالة حثالة وكلام وسخ زي وجهكم والله ما غيركم الزبالة والحثالة بكفي انكم مشردين ببلاد الله الواسعة وبكفي انو الأردن لاماكم وحوياكم وحاوية ارفكم واللي مش عاجبو ينقلع على اقرب جسر او يضل بالبلد الي هو فيها عشان يضل يتعاير وينتف علي وينسب علي بعدين احمدو الله انو الأردن هي الوحيدة بتعطي جوازات ولا سوريا ولبنان ومصر داعسة عليكو بورقة فعشان هيك الي عندو كلمة يضبها بلسانو بلا حكي ما إلو طعمة لإنكو إنتو اللي ولا إيشي مو حنا يا كلاب بس ضلكو عوو متل الكلاب واشهقو متل الحمير"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 137
subject = "الأردني"
author = "................"
text = "هسا إجو يتقاو بنات فلسطين ويحكو عن العيب والمسبات بعد ما فشو غلهم بالحكي العاهر روحي ضبي حالك انت واياها وبتحكو عن العيب وانتو طول نهاركم على الانترنت وببيوت المنيكة وبعدين تفكروش عشان الاردنية ساكتين يعني مش عارفين يردو لا هم ساكتين عشان بهتموش لكلامك الجحب والله يقويك حبيبي نواف على النشيد الوطني تبع الفلسطيزي وازا احنا منفتح ايدينا زاية 90 فانتو طول نهاركم فاتحين كساسكم زاية 1100000 وهسا احكولي انو احسن فتح الايدين ولا الكساس"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 138
subject = "الي الاردن الحيوان الي فوقي"
author = "داعس على راسكم"
text = "ولك انت يا اردني يامنافق يا مرة ياخنيييييييييييييييييث مش عاارف غير تحكي مع البنات اه ياحيوان هاد دليل النسونة يا بجم ولك احشي تمك بصرماي كبيييييرة انت اساسا مش عارف الي بتحكييه ياحيوان ولك انت شكلك مش عارف ايشي عن اهلك بيتك ولك خواااااااتك وإمك بلبلوتوث منشورين لونك بتهرف المرجلة ماكنت حكيت مع البنات ورديت علييهم يانسونجي يا جواد يا منحط ياسافل يااككة ياشرموط يامنيوك يا اخو المفتوحة والممزوعة والمهرية ولك انا عندي ايميل اختك kosey_mole3@hotmail.com والايميلب التاني maftoo7a _mmzo3a@hotmail.com هي دحشت بتمك صرماي وهي فرجيتك بعينك انو اردني وبنااتكم أكبر سفلة بلعاالم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 139
subject = "أهل العقول في راحة"
author = "عاشق فلسطين"
text = "بالله يا أحبابي فلسطينيين وفلسطينيات , لاتعبوا حالكم مع هدول البجم الغنم البقر , لأنتوا عقلاء , وأهل العقول في راحة , خلي<br />البدونة المعفنة تبعتهم تنفعهم , يلا يا أردنيين هيكوا شفتوا الموقع ويكبيديا نشر صورة استهزاء بالرسول صلى الله عليه وسلم ,<br />يلا خلي عبد الله الهاشمي اللي بتقولوا إنه من آل البيت يروح يدافع عن الحبيب صلى الله عليه وسلم , خليه , هدا إزا قدر , يلا خلينا نشوف عشان تثبتوا , لكن فشرتوا يا أولاد الكلب ......... (إلا رسول الله)"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 140
subject = "إحنا الفلسطينيات أشرف وأطهر وأعفف وأنظف بنات ونساء على وش الأرض يا محمد نواف الحمدالله"
author = "فلسطينية وبكل فخر وعزة (فلسطيـــن أولا)"
text = "أولا أقود وأشرمط وأمحن وأنيك وأوسخ وأقحب وأكسس وأعرص وأفتح بنات هما الأردنيات الأصل , وهدا إشي معروف , روح شوفهم<br />في وادي رم وفي البتراء شو بيعملوا الشراميط القحبات الملاعين بنات الحرام , ‘إنتوا في المرتبة الأولى , والمرتبة التانية هما العراقيات الشراميط , بس , لكن الحمد لله إحنا الفلسطينيات في الأردن نسبة 1% مش محترم و 99% محترمات وعفيفات لأنه عنا<br />عادات وتقاليد وأصول شريفة فلسطينية , مش زيكوا , اليهودي عنده مبدأ , لكن البدوي ما عنده مبدأ , وإنتوا زي هيك طبعا , خلاص<br />صفاتكم معروفة ومشهورة في كل مكان بالعالم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 141
subject = "تقرير علمي غريب : أطول خرة (ككة في العالم) هي ككة الأردنيين (بالله بجد تقروا هدا المقطع النصي)"
author = "عاشق فلسطين"
text = "أثبت علماء الأحياء بعد تحليلهم لخرة (ككة) أردنيين أصل , فوجدوا إنه طول الخرة تبعهم متر ونص , عارفين ليه , من كتر ما بياكلوا<br />برسيم وعلف (لما بطفحوه إن شاء الله) , وتاني إشي أثبتوا إنه هده الخرة خرة نادر نوعه في العالم , لأنه الككة معروف طوله يعني بيوصل لنص متر بالكتير, لكن هدول لا متر ونص ويمكن أكتر , ولا وشوف بعد هيك وين الريحة بتكون , يا حبيبي , شفتوا خرة الحصان الله يعز الفلسطينيين (فقط) أديش طوله ؟ الأردنيين ضعفه , ولونه أخضر غامق وفيه عليه شوية براسيم , لا ولو شفته الإسهال تبعهم كيف , فيه إشي اسمه ملح انجليزي عشان يفرم الخرة جوة الطيز وينزل بسرعة , هدول بدون ملح إنجليزي ولا غيره , هدول عندهم دواء حتى مش راضيين الأردنيين يقولوا اسمه عشان فيها خلطة سرية لفرم الخرة جوة الطيز بسرعة :<br />1غيغا بت في الثانية , فسبحان الله العظيم, ولله في خلقه شؤون , (((((منقول للفائدة)))))"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 142
subject = "وااااااااااااااااااااااااو ههههههههههههههههههههههههههههه بدي أنفجر وأموت من الضحك (اقروا التقرير العملي الغريب) واو"
author = "بنت نابلس"
text = "شكرا كتير حبيبي عاشق فلسطين على هده التعليق الحلو , والله غير أكتب هدا التقرير في كل المنتديات المشتركة فيها عشان<br />أفضح عرض الأردنيين الكلاب , ههههههههههههههههههههههههههههههههههههههههههه نفسي أضحك بس خلاص مش قادرة أبدا , وهو فعلا , روح شوف كيف حتى عشان ما فيش زبايل عندهم بروحوا برموا الخرة تبعهم جنب المخيمات أولاد الكلب عشان يلصقوها في الفلسطينيين , والله فضيحة ممتازة حلو كتير التعليق"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 143
subject = "رسالة رد إلى الخرة : الأردني"
author = "بنت نابلس"
text = "يا خرة يا حيوان إنتا بتقول إنه الفلسطينيات فاتحين أكساس درجة الزاوية تبعتها مليون , على القليلة يا بن الحرام كس الفلسطينيات أنظف وأطهر من كس الأردنيات الأصل اللي طول شعر العانة عندهم 5 متر وشكله زي أشجار الغابة , خليك ساكت أحسن إلك عشان فضايحكوا كترت , مع إني لسة جديدة بالصفحة , لكن لسة عندي فضائح أكتر من هده ,ورح أكتبها لكي يتبين للعالم أجمع<br />مين هما الأردنيين الأصل الأقحاح"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 144
subject = "أردنيين وما ننظام ومهرك يالأردن غالي .."
author = "محمد نواف االحمدالله ..."
text = "أولاً أنا بدي أوجه شكر وتقدير لكل من : - ( أردني والنعم ) و ( الأردني ) .. وأنا هونه بدي أقول كلمة وحده لهذولة الملقبيين بالفلسطيزيين .. يعني أنا مش فاهم .. ليش الواحد بعمل مع كل الناس خير وبساعدهم وبعاونهم، وبردوه بالمثل ؟.. إلا الفلسطيزيين .. بتعمل معاهم خير وبتساعدهم .. بروحو بقلبو ظدك .. وبصيرو مش معك بالمره . يعني فوق ما حنا مفظليين عليهم وعلى اللي خلفوهم وعلى كل فلسطيزي أجرب مقلعط مش لاقيله دفشة ولا دزه .. ويلا يلا تا شايف قدامو .. فعلاً !!! إنكو ناس حقرا وأنذال ووسخيين ومعفنيين وجرب ومفطسيين وهبايل وكلاب ولاد كلاب ولكو إنتو في دمكو الكذب والغش والحقد والنميمة والحقد والكره والضغينة واللئم .. الله مجمع فيكو كل وسخ وخره هالدنيا والعالم وحاطه فيكو .. سبحان الله !!! يعني الناس بتحاول إنها ( ه ) تحترمكو .. وتقدركو .. وتسويلكو مكانة ومستوى .. وإشي عليه القيمة والفايدة .. بس إنتو مامنكو فايدة بالمره .. يعني أنا الصراحة .. مش من طبعي أو حتى من صفاتي إني أسب سوى إنو شفت إنو فاظ الكيل .. والوعاء امتلا وصار لبرا .. فقلت فحالي وفنفسي صار لازم أتدخل وأسب وألعن وأفضحكو كلكو فرداً فرداً .. يعني أكبر دليل إنكو ناس شاطرة .. ومتفصحنه .. ورايقة .. وفاضية .. وماعندكو شغله ولامشغله . ولا حتى عمله .. إنكو نازليين سب فينا على ولا إشي .. يعني القافلة تسير والكلاااااااااااااااب ( اللي همه إنتو ) تنبح وتعوي ..!!!<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره فالتات ودايرات وداشرات بالشوارع ..<br />يعني والله أنا بشفق عليكو من شعب ماكل خرا من جميع الأصعدة والجوانب المختلفة . يعني شعب كس إمو من شعب شرموووووووووووووط .. قال رنتيسي وياسين وأبو عمار ( أبو حمااااااااااااااااااااااااااار ) .. وكس أخت أسماءكو كيف هيه !!!<br />إنتو اللي رح توكلو خراااااااااااااااا بالملعقة والشوكة والسكين ... وبالنهاية .. وكلمة أخيرة لكل أردني على وجه الكرة الأرضبة .. وووين ما كان .. بقلو وأنا هونه من موقعي ( الإمارات ) .. إرفع راسك لفوق لفوق لفوق وخليك عنيد وراسك يابس مش زي الحجر لأ أقوى من الحجر بكثييييييييييييييير .. وخلي عينك جاويه .. بتقدح شرارة .. قوية .. واللي بطلع فيك وخصوصاً إذا كان فلسطيزي .. مع إنو بسترجيش أو بالأحرى بقدرش أو إنو يحاول يرفع وجهو بوجهك .. وفي حال لو رفع شويه من وجهو الأجرب أخزقلو جوز عيونو .. وسوي براسووو خريطة العالم .. ونييييييييييييك خواته ال66مليون شرموطه وشرموطه .. ولاتنسى تنيك إمو ( لإنها هيه الأساس ) .. وبعد هيك إدعس بنص بطنو دعسة بنت كلب ( نصها موت ).. وشلحو أواعيه .. وافتح طيزو ونيييييييييييييييييييييييييكو لحد ما يغمى عليه ويطفي على الآخر . وبعدين كفين على الماشي ومرتبات يكونو على أكمن بوكس على شلوتين في زبو يخليه يبطل يخلف نهائي وبالمره .. وبعد هيك ( بدي أفرط من الظحك ) .. _ هذا إذا ظل عايش وعلى قيد الحياة وفيه روح وبتنفس _ .. على العموم شيك يعني .. هع هع هع ... وقلوووووووو بأعلى صوتك كالآتي :- ((( مظيع بوجهي شلن يا أخو العرصة ..... )))<br />ولكووووووووو .. نكناكو كثير كثيييييييييييييييييييييييييييييييييييير كثيييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييير .. وزهقنا من طياز وكساس وبزاز وشفايف وخدود بناتكو ونسوانكو يالفلسطيزيه .. وملينا منكو نهائي .. ومسحنا بكرامتكو وشرفكو أرض الأردن كلها/ ولفينا فيها شبر شبر .. ولعنا ظمايركو حى صفيتو بلا ظمير .. أي كس أختكو من متى كان عندكو ظمير .. يعني بالمشرمحي هزئناااااااااااااااااااااااااااااااااااااااااكوووووووووووووووووووووووووووو .. وخليناكو فرجه للي بسوى واللي مابسوى .. وعلكة بثم الجميع .. وسيرتكو وقصتو على كل لسان في العالم .. يعني خلصنا عليكو وقظينا عليكو .. يعني ياجهلة ( Game Over ) <<< يعني انتهت اللعبة ،،،<br />والأردن أولاً .. أولاًُ .. أولاً ..<br />وجيشنا جيش الوطن .. سمينا بإسم الله .. نحمي الوطن والعلم .. بعيون عبدالله ...<br />وبدي أشوف تعليقات الأردنيين النشامى ... اخزقوهم يانشامى الوطن .. ونيكو أعراظهم .. للي بلا شرف !!!"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

