[[comments]]
order = 308
subject = "كلمات حق"
author = "د. م عبيدات ___الاردني___"
text = "سلام وتحيه لكل الامه الاردنيه<br />كل واحد بيعمل بأصله<br />90% من فلسطينيين الاردن ناكريين للجميل الاردن بلد ضبتكو وحوتكو وعيشتكو وطعمتكو وعلومتكو واللي مش عجبيتو الاردن يطلع منها هسا .<br />وانتو يالفلسطينيه الشعب الوحيد اللي بيوخد جواز 5 سنين او سنتين<br />روحو شوفو سوريا و مصر<br />بسوريا والله وشوف عيني حاطين شيك حول المخيم واصلا فلسطينيه الداخل ممنوع يدخلو سوريا<br />اما مصر اكثر من 3 ايام ممنوع الاقامه فيها<br />-- داخل فلسطين في حقائق لا الاردنيه بيعرفوها ولا فلسطينية الاردن بيعرفوها مثلا بدو فلسطين (خاصه بير السبع) والدروز ما في داعي نعلق عنهم هدول كمان عرب و فلسطينيه دايما ابطال جبهة الجيش الاسرائيلي واهل فلسطين سيد العارفين و والله هالحكي من فلسطينة الضفه وغزه اللي الي 5 سنين متغرب معهم<br />بيضل مليون ونص عربي اسرائيلي طبعا هدول فلسطينيه كح بس للاسف كانو أول المعترفين باسرائيل وشبابهم بيحكي عبري احسن من اليهود و اكيد معهم جوازاتها وثلثينهم بيفتخر انو جوازه اسرائيلي خاصي في المانيا وفرنسا والشيك وبرطانيا<br />وكمان بيشاركو بالانخابات هادا كله من غير الخون ولا فلسطين من زمااااااااااااااااااان تحررت وهادا والله ما نتمنى<br />--احنا بنصدر رجال و ابطال بدون ما حدا يحتلنا ___ أي اميركا وروسيا من قبلها براسها ما سلمو من شبابنا ____(مجلة التايمز تعتبر الزرقاوي واحد من اكثر مئه شخصيه مؤثره في العالم) ومن قبلها روسيا روحو على افغانستان واسألو عن رائد خريسات وشباب العربيات (هذول السلطيه و شباب الدعسه واللي ما بيعرفهم يسأل عنهم في البقعه )<br />وفي فلسطين الشيخ كايد مفلح عبيدات غني عن التعريف أهل سمخ وطبريا بيعرفوه و للمزيد اقرأ كتاب العميل فردريك بيك . واحمد الدقامسه الكل بيعرفو<br />-- اما في أيلول الاسود الفدائيه بدو في المشاكل وكانو مفكرين حالهم ابطال وبدهم يحررو فلسطين بعد ما يحتلو الاردن ----لاااااااااااا عمي وقفو عندكو مش علينا -------- صارو يعملو مشاكل بدون اي سبب بس نكران لجميل اهل البلد والجيش طبعا قام بالواجب وما عليه اي عتب بنقدر نقول دفاع عن النفس"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 309
subject = "إلى الملقب بــ عبيدات .. معلوماتك قديمة ومعروفة يوب"
author = "جرادات"
text = "اسمع يا خوي :<br />أنتا عارف وأنا عارف وكل أردني في الأردن أو خارجها .. وأيضاًَ كل فلسطيني ( كمان ) عارف شو عملت وسوت الأردن تجاه الشعب الفلسطيني ( الذي نكن له كل الإحترام والتقدير والوفاء ) ..<br />يا خوي هم شعب عانا .. وضاق الأمرين معاً .. شعب مكافح منضال .. رغم اللي قاعد عم بيصير فيه واللي رح يصير ..<br />هو شعب ماعرف يوم للهزيمة والإستسلام .. وولاعمرو رفع الراية البيضاء نهائيــــــــــــــــــــاً ..<br />شعب لطالما دافع عن قضيته العادله .. واللي هي من أسمى القضايا وأشرفها وأطهرها بالعالم<br />ياخوي على مدى 60 سنة والشعب الفلسطيني يعاني ومازال إلى الآن ( والعلم عند الله متى بتتحر فلسطين ) .. وإنشاءالله إنها تتحرر فلسطين .. والقدس .. والأقصى وكل بقعة من بقاع هذه الأرض الطاهرة الشريفة العطرة .. لإنو إذا تحررت فلسطين من شمالها لجنوبها .. رح يتغير مصير المنطقة بشكل كلي .. ولا تنسى إنو إسرائيل كل شوية عم بتضعف وعم توكل خرا .. من يوم شارون لهسه ( الله لايموتو لشارون عشان يظلو يتعذب ويتألم ويصرخ من وجعو زي ماعذب الفلسطينيين ونكل فيهم وشردهم وخلاهم لاجئين .. لإنو يا أخوان الموت أهون في هاي الحالة أي زي حالتو يعني .. )<br />وإسرائيل إلى زوال بإذن الله .............<br />وشغلة ثانية حاب أنوه عليها .. واللي كثير أثار حولها جدل واسع ..<br />إنو الفلسطيني إنسان تخلى عن قضيتو . وهذا طبعاً كلام ما إلو أساس من الصحة أو الصدق . بالعكس تماماً<br />الإنسان الفلسطيني إنسان بكل ماتحمل الكلمة من معاني ولو كان فعلاً تخلى عن قضيتو لكان انعدمت المقاومة في فلسطين ( الضفة وغزة ) ...<br />وكمان شغلة بتتعلق بالإنسان الفسلطيني ..<br />إنو هو مخرب الدنيا .. ومسوي مشاكل وين مابروح ..<br />لا يا أخوان هاذا كلام ناس لاتفقه بالحياة شيئاً .. وهمها الوحدي إنها تنشر الفتنة والتمييز العنصري بين العرب ..<br />بس خسئؤا هم ومن معهم ومن يواليهم .. واللي على شاكلتهم ..<br />الإنسان الفلسطيني إذا دخل على أي بلد ( بغض النظر إذا كان هذا البلد عربي أم أجنبي ) بعمر وببني فيه وبعطيه من خبرتو وفهمو ..<br />لإنو إذا اشتغل بشتغل بضمير وبذمة .. بصدق وبإخلاص .. بتفاني .. وهذا حال كل فلسطيني ( وأنا للتذكير مش غرور ولا حتى تكبر بحكي عن الإنسان الفلسطيني بالذات دون غيرو .. لإنو هو هيك فعلاً ) ..<br />من الأردن أولاُ ( أخوانا وحبايبنا والله ) لسوريا ولبنان والعراق والكويت والإمارات والسعودية وقطر وبشكل عام كل دول الخليج ومصر وليبيا وبلاد المغرب العربي ................ وكمان في بعض الدول الأجنبية زي ( أمريكا وألمانيا ... الخ ) ..<br />طبعاً الواحد من الصعب أو حتى مستحيل إنو ينسى وقفة الشعب الأردني شعباً وحكومةً وملكاً ..<br />الملك حسين _ الله يرحمه ويجعل مثواه الجنة _ عمرو مانسي فلسطين .. وكان يساعدها ويشد على إيدها .. كان داعمها معنوياً ومادياً .. كان يحب الفلسطينيين .. عمرو مافرق بين أردني وفلسطيني .. وحالياً وللأسف الشديد صرنا بزمن أغبر ... حيث احتلت العضلات المفتولة والأجسام الضخمة للتفاهم .. بدلاً من العقول .. يعني وبالعربي وبدي احكيها .. صرنا بهاااااااااااااااااااااااااايم .. بطلنا نفكر !!! وصاروا النسا يحكوا عنا .. وصرنا علكة بثم اللي بسوى واللي مابسوى .. آآآآآآآخ<br />الأردن عمرها ما قصرت مع الفلسطينيين ولا بأي إشي .. وأكبر دليل على ذلك .. رح احكي عن حالي ..<br />إنا ياجماعة الخير أردني من أصل فلسطيني .. ومعظم أجدادي سافروا على الأردن من زمان .. وأتمتع بالجنسية الأردنية ( أكيد ) .. ولكن أما مش مولود بالأردن .. أنا مولود وعايش بالإمارات .. وبفتخر وبعتز بكلا بالبلدين ( الأردن وفلسطين ) ..<br />ولكن الواحد لاينسى بأن معظم الأردنيين إن لم يكن النسبة العليا منهم من أصول فلسطينية قح .. هم عرب أقحاح .. وهذا إشي معروف ومؤكد ..<br />أنا الصراحة عمري ماحسيت بفرق إذا كنت نازل على الأردن أو فلسطين .. لإنو وبالنهاية كلنا أخوة وعرب ومسلمين كنا أو مسيحيين ..<br />أنا اللي بقهرني إني اسمع تفريق بين إنو هذا أردني والثاني فلسطيني ..<br />قسماً بالله إنو أنا عايشت أردنيون الأصل وكانوا عنوان للكرم والطيب والجود .. بعرف صحاب إلي أردينين أصل عمرهم ماحكولي إنتا أصلك فسلطيني وعيروني فيه .. بالعكس<br />أشهد إنهم كانوا رجال وأسود .. سواء كانوا معي أو مع غيري ..<br />وكلهم من عشائر معروفة بالاردن ( الرواشدة _ المقابلة _ بني هاني _ المشاقبة _ الشمايلة .. وغيرهم كثير شو بدي اتذكر لأتذكر .. )<br />ومن الأخر يعني إحنا شعب واحد ورح نظل هيك . شئنا أم أبينا<br />تحياتي"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

[[comments]]
order = 310
subject = "تابع >;>;>;>; لكلامي"
author = "جرادات ........................."
text = "وكما قال الشاعر يا عبيدات :<br />ليس الغريب غريب الشام واليمن ************ إن الغريب غريب اللحد والكفن ..<br />سامع الغريب غريب اللحد والكفن ( يعني الموت ... افهم )<br />مش الغريب غريب الأردن وفلسطين وسوريا ولبنان والعراق والكويت ومصر والسودان والبحرين والإمارات واليمن وقطر ......الخ<br />فلا تتهبل وتحكي كلام بدل على غباءك ( ماشي )<br />لإنو الناس مش غبية زيك ..<br />على فكره أنا بشفق عليك وعلى اللي زيك .. للإنهم بفكرو بطريقة غبية وسطحية ومحدودة ..<br />مهو يا إما قاعدين عم بضحكو على حالهم وبكذبوا على الناس أو العكس صحيح ( يعني عاملين حالهم .... )<br />لاتقلي الأردن وفلسطين ..<br />مافي حدا أحسن من حدا ..<br />كلنا ولاد تسعة ..<br />ولك أنا مش أحسن منك وولا إنتا أحسن مني ..<br />كلنا سواسية كأسنان المشط بالضبط ..<br />ولاتنسى حديث الرسول ( عليه أفضل الصلاة والسلام ) : ( لافضل بين عربي وأعجمي إلاّ بالتقوى والعمل الصالح .. )<br />يعني معيار التفاضل اللي ذكرو الرسول ( صلى الله عليه وسلم ) 1) التقوى .... 2) العمل الصالح ...<br />فلا تألف وتحرف وتطلع أفلام ع كيف كيفك ؟!<br />والله مني عارف ليش بعدك عايش إنتا .. يازلمه روح انتحر أحسنلك ( الله يعنيك ويعين أهلك عليك ) ..<br />آخ آخ آخ<br />يلا ومع ذلك .................. الله كريــــــــــــــــــــم"
archived = "2009-04-05"
capture_url = "https://web.archive.org/web/20090405031935/http://masr.20at.com:80/newArticle.php?sid=12273"

