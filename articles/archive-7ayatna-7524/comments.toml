text = "معلومة لمن يهمه الامر.. اخته لمحمد نواف بعرفها من زمان… مصيصة زباب درجة اولى وقبل ما تتزوج كانت توكله خلفي.. الان تطورت من وراء ومن قدام ومن ثمها.. واللي مش مصدق يطلب عنوانها وهاتفها وانا على استعداد"
archived = "2009-02-11"
