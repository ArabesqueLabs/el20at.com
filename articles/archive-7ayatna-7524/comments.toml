text = "كسسسسس اخت الفلسطينية كلهم خاوت شرمووطة ناكني واحد فلسطيني بس ريحته طالعه وكشيت منه لانه ينيك امه واخته كمان<br />ال حكالي تيجي انيكك معهم يروح ينصرف منيك جواد عرص ابن عرصه<br />يلا تفوو على كساس ام كل واحد فلسطيني"
