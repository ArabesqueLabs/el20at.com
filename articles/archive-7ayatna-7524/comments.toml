[[comments]]
order = 106
subject = "الأردنيون هم فلسطينيون أقحاح (الرجاء قراءة هذا المقطع كاملا)"
author = "فلسطيني أصيل"
text = "رئيس وزراء الأردن علي ابو الراغب يعلن أن عدد سكان الأردن من أصل فلسطيني هو 43% من إجمالي السكان . الإعلان جاء كما يبدو لغاية في نفس يعقوب كما أنه أي ابو الراغب لم يذكر لنا إذا كان هو نفسه من أصل فلسطيني أم لا فالمعروف أن ابو الراغب فلسطيني من أصل نابلسي غريب الإحصاءات الأردنيه أنها تتباين بين فترة وأخرى فأحيانا تصل نسبة الأردنيين من أصل فلسطيني 70% وأحيانا 60% وأحيانا 55% .. وهو ما يعني أن النظام الأردني لم يقر رأيه على نسبة محدده حتى اليوم<br />هذا الغريب في تباين الإحصاءات الأردنيه يواكبه غريب وعجيب آخر هو أن هذه الإحصاءات لا تتطرق إلى النسب المئويه للأردنيين من أصول أخرى وإنما تركز فقط على الأصل الفلسطيني فمثلا .. لا تذكر الإحصاءات الأردنيه نسبة الأردنيين من أصل حجازي .. ولا نسبة الأردنيين من أصل شركسي أو غير ذلك .<br />في نسبة الجذور فإن النسبة الحقيقية للأردنيين من أصل فلسطيني تقارب أكثر من 90% لكن مرتزقة الأقليات في النظام الأردني يخشون هذه النسبة خاصة وأن الأغلبية الجارفه للسكان في أي بلد هي التي تحدد هويته وملامح تراثه وأصالة جذوره .<br />كثيرون هم الأردنييون من أصل فلسطيني يعملون جاهديين على إخفاء أصلهم الفلسطيني للأسف لأسباب معيشيه ونتيجة لضغوط ظروف الشتات الفلسطيني بل إن التستر على الأصل شمل ضمن ما شمل معظم رؤساء الوزارة الأردنيين من أصل فلسطيني علي ابو الراغب وعبد الكريم الكباريتي وسمير الرفاعي وزيد الرفاعي وعبد المنعم الرفاعي وطاهر المصري واحمد اللوزي وهزاع المجالي وسواهم هم فلسطينيون في أصولهم لكنهم حرصوا على الإدعاء بأنهم أردنييون أقحاح . حتى أكبر عشائر البدو .. عشائر الصخور هم من بدو النقب في فلسطين الحقيقة التاريخية التي لن يخفيها غربال الإحصاءات هي أن الهوية للغالبيه الغالبه لسكان شرق الأردن هي هوية فلسطينيه ولم يحدث إطلاقا أن تم الفصل بين إبن الكرك وإبن القدس سوى في الزمن الصهيوني والهاشمي فما الذي يخشاه النظام في عمان من الإقرار بأن 90 % من سكانه هم فلسطينييون ؟؟<br />إنه يخشى في النهاية حكم لأغلبيه .. وليس كما يزعم نشوء الوطن البديل .. فشرق الأردن كغرب الأردن هما وطن فلسطيني أصيل وليس بديل الصهيونيه إغتصبت قسما من فلسطين غربا .. والهاشمية إغتصبت جزءا من فلسطين شرقا .. الصهيونيه تضطهد الفلسطيني وجهد لشطبه غربا والهاشميون يضطهدون الفلسطيني ويجهدون لشطبه شرقا .<br />هكذا يلتقيان نظام عمان مع نظام تل أبيب"
archived = "2009-04-05"
