[[comments]]
order = 6
subject = "بصو للوجةه التي في الصورة والعياذ بالله"
author = "مش ححبك"
posted = "2008-08-09"
text = "(( صوور وجوه ماشاء الله يمكن يكون وجهك منهم ))<br />السلام عليكم ورحمة الله وبركاته<br />الحمد لله رب العالمين والصلاة والسلام على أشرف الأنبياء والمرسلين سيدناونبينا محمد ابن عبدالله خير من أرسل للعالمين .. أما بعد<br />هذا الموضوع أعجبني وللأمانه قمت بنقله لنستفيد منه جميعاً<br />إن الوجه هو واجهـة الإنسان التـي يقابــل بهـا المجتمـع، وكـل شخـص يحرص علـى أن لا يشوب هذا الوجـه أي شائبـة .. لا حسية ولا معنويــة .. فمــا بالك يـوم العرض على رب السماوات والأرض<br />... هناك لا تخفـى علــى الله خافيه .. فالمــوقف جـدُ عظيـم .. وحفـظ الوجـه فـي الدنيا هو حفظ له في الآخرة .. ففـي الوجـه جوارح إذا حفظتهـا حفظت دينك . اللسان . العين .. الأذن .وبداخله(( العقل)) وإذا لم تحفظه في هذه الدنيا .. فالموعد أمامك ..<br />وإليك بعض الصور لهذه الوجوه كما جاءت في القرآن الكريم نسأل الله أن يجعلنا من المنعمين.. والوجوه الناظرة لربها ...والمبيضة المسفره ... اللهم آمين<br />قال تعالى..<br />(( يوم تبيض وجوه وتسود وجوه فأما الذين اسودت وجوههم أكفرتم بعد إيمانكم فذوقوا العذاب بما كنتم تكفرون * وأما الذين ابيضت وجوههم ففي رحمة الله هم فيها خالدون ))<br />وقال تعالى ..<br />(( وجوه يومئذ مسفرة * ضاحكة مستبشرة * ووجوه يومئذ عليها غبرة* ترهقها قترة * أولائك هم الكفرة الفجرة ))<br />وقال تعالى ..<br />(( وجوه يومئذ ناضرة * إلى ربها ناظرة * ووجوه يومئذ بآسرة * تظن أن يفعل بها فاقرة ))<br />وقال تعالى ..<br />(( وجوه يومئذ خاشعة * عاملة ناصبة * تصلى نارا حامية ))<br />(( وجوه يومئذ ناعمة * لسعيها راضية * في جنة عالية ))<br />اللهم لا تجعلنا مما قلت فيهم ..<br />(( إن المجرمين في ضلال وسعر * يوم يسحبون في النار على وجوههم ذوقوا مس سقر ))<br />اللهم اجعلنا من المتقين الذين قلت فيهم ..<br />(( إن المتقين في جنات ونهر * في مقعد صدق عند مليك مقتدر ))<br />ومن الأعمال التي تبيض الوجه وتجل النور فيه<br />قيام الليل .. الخلق الحسن .. مراقبة الله في السر والعلانية<br />اللهم بيض وجوهنا يوم تبيض وجوه وتسود وجوه<br />اللهم آمين آمين"
archived = "2008-08-12"
capture_url = "https://web.archive.org/web/20080812064638/http://masr.20at.com:80/newArticle.php?sid=16920"

