[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "فهد"
posted = "2008-07-24"
text = "الثورة لم تقدم لنا شى سواء اقطا عين جدا مثل هولاء الذين فى الصورة الثورة لم تقدم الا ظلم وعدوان وطغاة من اول جمل هذا الى حسنى مبارك ماذا قدمت الثورة غير ذلك فهى ما كانت الا ثورة مصالح لعبد الحكيم عامر وشمس بدران وصلاح نصر وخا لد محى الدين وكل هولاء لم يقدمو لشعب المصرى غير الذل والهوان وسلا ملى على الثورة فثورتكم بدون قيم ولا مبادى"
archived = "2008-07-31"
capture_url = "https://web.archive.org/web/20080731152855/http://masr.20at.com:80/newArticle.php?sid=16920"

[[comments]]
order = 2
subject = "من التعليقات تحس اننا ذاهبون الى الجحيم فالناس مغي"
author = "برضة انا بغباوتة"
posted = "2008-07-24"
text = "الثورة حلم الاباء<br />طرد الاحتلال الانجليزى<br />اقامة حياة كريمة للناس<br />نصف بيوت القاهرة كانت بدون كهرباء<br />اليوم الكهرباء فى القرى والنجوع<br />العبودية بمعنى العبودية وسجون قطاع خاص فى قرى الاقطاعيين<br />الشعب كلة حافى والحكومة تعلن مشروع القرش لمكافحة الحفاء<br />الاجانب يسيطرون على الاقتصاد<br />الب<br />طالة والفافقة والفقر والجهل والمرض<br />ماهو هدف شباب اليوم؟ الموت غرقا على شواطىء اوروبا<br />الهرب من البلد<br />اين النضال والكفاح والتصدى للفساد<br />اخلقوا الحكومة التى تريدونها وعيشوا حياتكم فى كرامة<br />لا تسبوا الماضى الجميل<br />عليكم بتغيير الواقع المر وصنع حياة جميلة مرحة<br />قد يدخل بعضكم السجون ولكن ذلك ضeريبة التغيير وثمن الحرية والكرامة<br />اعرفوا طريقكم وهدفكم<br />وعليكم بالتغيير"
archived = "2008-07-31"
capture_url = "https://web.archive.org/web/20080731152855/http://masr.20at.com:80/newArticle.php?sid=16920"

