[[comments]]
order = 4
subject = "اللهم انصر الاخوان المسلمين على الظلمه والمجرمين"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-07-25"
text = "اللهم انا نشكو اليك ضعف قوتنا وقلة حيلتنا وهواننا على الناس انت رب المستضعفين وانت ربنا الى من تكلنا الى محكمة تتجهمنا أم إلى ظالمين ملكتهم أمرنا<br />إن لم يكن بك علينا غضب فلا نبالي ولكن عفوك أقرب لنا<br />اللهم انا نلجأ اليك ونفزع إليك ونعتصم بك ونتوكل عليك<br />فقد مسنا الضر وأنت ارحم الراحمين<br />اللهم إن الناس قد فزعوا للناس لقضاء حوائجهم وتفريج كربهم وتخفيف همومهم<br />اللهم انا لجأنا إليك وحدك لاشريك لك<br />أنت ربنا وخالقنا ورازقنا ومقدر أمورنا<br />ندعوك دعاء المضطرين وانت تجيب المضطر إذا دعاه<br />وندعوك كما أمرتنا فاستجب لنا كما وعدتنا<br />اللهم فرج همومنا وكرباتنا واجعل لنا من كل ضيق مخرجا ومن كل هم فرجا<br />اللهم سخر لهذا الظلم من يرفعه<br />وسخر لاموالنا من يردها لنا فانك ولي ذلك والقادر عليه<br />إنما أمرك اإذا أردت شيأ أن تقول له كن فيكون<br />يامدبر الأمور ومقدر الاقدار وعلام الغيوب<br />اللهم قيض لهذا الظلم من عبادك الصالحين من يرفعه<br />اللهم آمين آمين آمين"
archived = "2008-07-31"
capture_url = "https://web.archive.org/web/20080731152855/http://masr.20at.com:80/newArticle.php?sid=16920"

