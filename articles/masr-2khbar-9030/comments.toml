subject = "نطلب من حكومة اسرائيل الرحمة والعطف من خلال مندوبه"
author = "مصرى حزين"
posted = "2008-05-10"
text = "المندوب الاسرائيلى فى قصر عابدين يبيع الغاز لاسرائيل ببلاش ب 75 سنتا وسعرة العالمى 11 دولار<br />بيدعم المواطن الاسرائيلى حبيبة<br />انما الجاز والبنزين يغلى للسعر العالمى على المصرى الفرعونى ابن الكلب<br />محطات الكهرباء فى اسرائيل تشتغل بالغاز المصرى ابو بلاش اللى بيرسلوة اليها هدية بمناسبة الذكرى الستين لقيامها<br />ومحطات الكهرباء المصرية فى الجنوب والشمال والغرب تعمل بالمازوت علشان تعمل السحابة السودة فى القاهرة وتخنق الناس وتجيب لهم الربو وضيق التنفس وامراض الصدر<br />معروف ان الغاز الطبيعى من انقى انواع الوقود ولا يسبب التلوث<br />انهم يبيعون مصر جزءا جزءا لاسرائيل<br />مقابل ماذا<br />لماذا يرضون اسرائيل الى هذة الدرجة على حساب الشعب ؟<br />حتى ترضى امريكا على حكاية التوريث<br />حتى تقنع اسرائيل امريكا ان جمال يناسب اسرائيل<br />خلاص يا ولاد علية العوض فى البلد"
archived = "2010-03-14"
