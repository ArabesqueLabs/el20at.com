[[comments]]
order = 0
subject = "هذا القرار كان مطبق فى جامعة اسكندرية منذ اكثر من اربعين سنة وكانت الصفوف الاولى فى المدرج مخصصة للانسات - والموضوع لياقة وترتيب ولا علاقة لة بالتحرش"
author = "عجوز"
text = "انتم هتعملوا من الحبة قبة لية ؟<br />مقاعد البنات كانت محجوزة فى الصفوف الاولى فى المدرج ومحظور على اى طالب ان يجلس فيها وكانت البنات بتقف لغاية الصبيان ما يدخلوا وبعدين يدخلوا هم ليجلسوا فى اماكنهم<br />وكان الصبيان احيانا يدخلوا من باب المدرج الخلفى والبنات من باب المدرج الامامى<br />دى عملية لياقة وتنظيم واصول وتقاليد شعب<br />وعلى فكرة فى تلك الايام كانت موضة المينى جيب هى السائدة والجيبة فوق الركبة وشعر البنات السايب كان بيهفف على الخدين - بس كان فية ادب<br />وكان لا يوجد حاجة اسمها حرس جامعة ولا امن<br />وكان فية انتماء للبلد - وخلصنا الجامعة ورحنا للحرب فى ميادين القتال ورجعنا بعد حرب 73"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120531/http://masr.20at.com:80/newArticle.php?sid=18703"

[[comments]]
