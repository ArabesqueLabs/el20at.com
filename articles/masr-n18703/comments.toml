subject = "حملة كفى عنف"
author = "مش عنيف"
text = "ليس هناك من داعٍ لأن تتعرض المرأة للعنف الجسدي او النفسي وبالرغم من ذلك فان النساء في مجتمعاتنا الشرقية يعانين باستمرار من هذه المشكلة.<br />لا تترددي بالتعبير عن رأيكِ و عرض مشاكلك ومشاركتنا تجاربك<br />لست مجبرة على الصمت…فهو ليس الحل المناسب<br />قناة الآن تطلق حملة “كفى عنف” خلال شهر نوفمبر 2008 لمناهضة العنف ضد المرأة.<br />العنف يشمل العنف الجسدي والنفسي و انتهاك الحقوق المالية والاجتماعية والحرمان من التعليم وغير ذلك. ستخصص قناة الآن شهر نوفمبر لتسليط الضوء على مظاهر العنف ضد المرأة باشكاله المختلفة من خلال مقابلات واقعية، وتقارير واحصائيات، ولقاءات مع ناشطات في جمعيات تعنى بقضايا المرأة وشؤونها فضلاً عن مقابلات مع اطباء نفسيين و خبراء اجتماعيين. ستمد قناة الآن يد المساعدة الى كل امرأة تطلبها.<br />العنف يأتي باشكال مختلفة<br />• العنف الجسدي، النفسي، اللفظي، الجنسي و المادي<br />• العنف الاجتماعي و الاسري<br />• العنف الممارس عبر شبكة الانترنت<br />• جرائم الشرف<br />• الزواج بالاكراه واجبار الفتيات الصغيرات على الزواج من كبار السن<br />• الاعتداء الجنسي مثلاً على الابنة او الاخت…<br />• عنف النساء ضد النساء (على الابنة، الخادمة و في العمل)<br />• حرمان المرأة من حقوقها بعد الطلاق<br />• حرمان المرأة من حضانة او رؤية اولادها بعد الطلاق<br />• حرمان المرأة من حقها في التعلم والعمل<br />• اجبار الفتيات الصغيرات على العمل<br />• سوء معاملة الامهات المتقدمات في السن و عدم رعايتهن…<br />• ارهاب النساء عبرالاغتيالات السياسية للنسوة<br />• استخدام النساء في التفجيرات ارهابية<br />اذا تعرضت او تتعرضين للعنف فاعلمي انَ القانون بجانبك. السلطات في بلدك تحميكِ. لا تترددي في أن تتخدي الخطوة الاولى وتتصلي بالسلطات المعنيّة. نحن سنساعدك في ذلك. فالشجاعة هي كل ما تحتاجين اليه.<br />كوني شجاعة وانقذي نفسك من وضع لا داعي له على الإطلاق. كوني الهاماً لنساء اخريات يشاركنكِ الوجع نفسه.<br />إتصلي بنا:<br />شاركينا تجربتك او ساهمي معنا ان كنت ناشطة نسائية<br />ارسلي لنا رقم هاتفك وملخص عن مشكلتك ونحن سنقوم بالاتصال بكِ<br />Tel: +971 4 369 2087<br />Fax: +971 4 391 5349<br />Email: kafaonf@alaan.tv<br />www.alaan.tv<br />Dubai Media City, PO Box 500765, Dubai, UAE<br />كفـى عنـف"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120531/http://masr.20at.com:80/newArticle.php?sid=18703"

