[[comments]]
order = 0
subject = "ما بتفرق"
author = "شام مصطفى"
text = "بمنتهى الصراحة ما بتفرق معى الان لانى انسة وما بتضايق اذا شخص قالى يامدام لكنى لما اتزوج اكيد بتضايق اذا شخص قال لى يا انسة لان اكيد زوجى بيتضايق وانا اكيد بغضب لغضبه"
archived = "2007-06-30"
capture_url = "https://web.archive.org/web/20070630010654/http://masr.20at.com:80/newArticle.php?sid=10805"

[[comments]]
order = 1
subject = "يامدام ولا يا انسة"
author = "رائد"
text = "هههههههههههه<br />الموضوع ده مسخرة انا مش عارفه جه على بالك ازاي برافو عليكي يا حاجة، يووووووووووه قصدي ياانسة يانهار مالوش ملامح يمكن تكوني متجوزة يلا خليها يا مدام"
archived = "2007-06-30"
capture_url = "https://web.archive.org/web/20070630010654/http://masr.20at.com:80/newArticle.php?sid=10805"

[[comments]]
order = 2
subject = "بلاد الله لخلق الله"
author = "انسة لو سمحتى"
text = "ههههههه<br />الموضوع ده بيحصل فعلا و أنا أخدت بالى من اللى بيمعلوه البياعين فعلا بحس انهم بيستعبطوا علشان يخلوا فيه كلام بينهم و بين الزبونة فتشتري منهم<br />اقولك على موقف يضحك : مرة اختى دخلت تشتري من السوبر ماركت حلاوة و هي أصلا لسة ما اتجوزتش و شكلها كمان صغير بس كان في راجل جنبها هي بتقول للبائع :\"كيلو حلاوة لو سمحت\" و فس نفس الوقت الراجل اللى جنبها بيقول للبائع :\" نص كيلو حلاوة لو سمحت\"<br />قام البائع بصلهم بغيظ و قالهم :\" نص و لا كيلو حددوا بسرعة ؟؟\" ههههههههه"
archived = "2007-06-30"
capture_url = "https://web.archive.org/web/20070630010654/http://masr.20at.com:80/newArticle.php?sid=10805"

[[comments]]
order = 3
subject = "انتى الولية"
author = "كتكوتة وحلوة وقطوقطة"
text = "بصراحة مش بتفرق معايا بس انا عمرى ماحد بيقولى يا مدام لانى اساسا مافيش حد بيصدق انى مخطوبة لان شكلى صغير<br />بس بصراحة قبل ماتخطب وكتير فى الشغل لما كان حد يسالنى انسة ولا مدام كنت اقولهم قولو استاذة مش لازم نربط الناس بالحالة الاجتماعية مش هاقول للراجل يا متجوز عمرو مثلا او يا خاطب فهمى مثلا اشمعنى الست بقى اللى لازم تبقى مرتبطة بحد<br />وعلى راى احمد راتب فى المسرحية احنا عندنا لا بنقول لا مدام ولا انسة هو تعالى يا ولية وخلاص<br />بس بصراحة احلى كلمى نفسى اسمعها ويارب ربنا يكتبهالى<br />ام مربم"
archived = "2007-06-30"
capture_url = "https://web.archive.org/web/20070630010654/http://masr.20at.com:80/newArticle.php?sid=10805"

[[comments]]
order = 4
subject = "يا دكتور"
author = "امممممممممم"
text = "بصراحه وبالرغم من انى لسه انسه الا انى بضايق لما حد ينادى \" انسه \" يمكن علشان بحسها شتيمه وبتفكرنى انى المفروض اكون\" مدام \" او لانى دكتورة ومتعودة يقولواى يا \" دكتور\" بس انا ما عنديش مانع ينادوا \" مادموزيل \" دى بالنسبه لى الطف ."
archived = "2007-06-30"
capture_url = "https://web.archive.org/web/20070630010654/http://masr.20at.com:80/newArticle.php?sid=10805"
