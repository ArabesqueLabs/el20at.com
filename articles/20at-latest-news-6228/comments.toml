subject = "هم دول"
author = "فهد"
posted = "2007-06-12"
text = "هى دى ايران وسياسة الترهيب كانى دول الخليخ تحت رحمتها امال لما تمتلك القنبلة الذرية هتعمل اية فى دول الخليج والعرب كلهم يا جماعة المد الا يرانى اخطر علينا من المد الا مريكى الصهيونى انا مش بقلل من الا خر بس لايران اهداف تانية غير امريكا واسريل على الا قل احنا عارفين دول عاوزين اية لاكن ايران مش عارفنه عاوزة اية ايران عاوزة تعمل هلال شيعى وتمدد لدولة الفرس ودة على حساب العرب السنة اقراوء تاريخ ايران يا اخونا واعرفو عدوكم لو ايران عملت القنبلة بتاعتها مش هيبقى لينا وجود لانهم اشد كرة لينا من اليهود ليهم افكار غريبة زى ان المهدى بتاعهم الى موجود فى السرادب لية اكثر من الف سنة مش هيطلع الا مع التمدد الشيعى وافكار غريبة لا تعقل فى عصر كل حاجة ظهرت فية بلادلة وهم ليس لديهم ادلة فى اى شى حتى القران عندهم محرف وسيدنا عمر واب بكر وعثمان وام المومنين حبية رسول الله كفرة هل هذا كلام يعقل من احفاد المجوس والخمينى الذى قال عن سيد الخلق محمد انها لم يبلغ الرسالة كم هى ولو بلغها ما كان حدث خلاف بين المسلمين هل هذا كلام شخص مسلم لا والله بل كافر وابن كافر مجوسى قذر اكتب فقط للذين لا يعرفون ايران او الشيعة فلا تتعطف معهم كيف لمسلم ان يفضل الا مام على وابناه على رسول الله الم يقولو ان جبريل كان اتى بالرسالة على على ولكن اخطاء ونزل على محمد الم يقولو ان على هو من يدخل الناس الجنة والنار الم يتعملو معنا با لتقية والكذب والخدع التقية هى ان يظهر عكس ما بدخلة فاحذروهم ولا تتعطفو مع هذا النصر لله فكلهم واحد اقراو رية فى صحابة رسول الله الذين هم اشرف من الخمينى والقمى والجزايرى وعلماء الجوزة المنافقين الذين يعلموهم الحقد على اهل السنة والجماعة هذة نبذة مختصرة عن ايران والتمدد الشيعى فاحذرو اخوانى من الكلام المعسول وهذاالاحمدى نجاد الذى يقول انه ياتية نور من السماء هو الذى يحركة وحسبى الله ونعم الوكيل لكل من اراد للعرب والمسلمين سواء ولدولنا العربية"
