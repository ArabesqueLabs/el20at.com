subject = "مسرحية جحا يحكم المدينة"
author = "جحا"
posted = "2007-12-13"
text = "انتم فاكرين هيافات الحكام زمان ودلوقتى<br />فية حاكم مصرى من الفاطميين اصدر فرمان او امر عسكرى تحت حكم الطوارىء او الاحكام العرفية هذا الفرمان الغريب الذى سخر منة القاصى والدانى وضحكت شعوب المعمورة وكركعت علية هذا الفرمان ينص على ان الشعب المصرى لا ياكل الملوخية - ممنوع اكل الملوخية<br />لية يا خليفة الناس ماتكلش ملوخية - يرد يقول ان دة مزاج عند اهلة<br />وهل كان فى مقدورة ان يعين بصاص او امين يشوف الناس بتاكل ملوخية والا لا ؟<br />برضة طلع معتوة ومتخلف عقليا فى اخر الزمان يغلق المساجد فى وجة المصلين وممنوع الاعتكاف والسهر فى رمضان فى المساجد انما البارات والخمارات مفتوحة طوال الليل<br />ومهتوة اخر ينوى اغلاق المساجد علشان الناس متدعيش علية وتكون دعوتهم مستجابة<br />ومعتوة يريد اغلاق المساجد علشان الناس بتتظاهر هناك وبيعملوا لبش للنظام<br />يا ايها الجبابرة<br />ان اللة يمهل ولا يهمل واخرتكم السودة قربت<br />وان كانت دامت لغيرك ما كانت وصلت اليك<br />يخرب بيت ابيكم اذا كان لابوكم بيت"
archived = "2007-12-13"
capture_url = "https://web.archive.org/web/20071213185647/http://masr.20at.com:80/newArticle.php?sid=13388"
