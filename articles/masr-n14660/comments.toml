[[comments]]
order = 0
subject = "ضع عنوان التعليق"
text = "لا يا حضرة المفتي إننا نحن أيضا مسؤولون أمام الله على تقصيرنا تجاه الرسول عليه الصلاة والسلام وانا استغرب هذا المبدأ فهل يعقل أن يشتم شخص عزيز عليك أمامك ثم تقعد وتقول : هناك من كلف نفسه برد الشتيمة ... هل هذا يعبر عن المحبة أم عن ماذا .... ان هذا التهاونوالتخاذل هو ما أوصلنا لهذا الوضع"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003211/http://masr.20at.com:80/newArticle.php?sid=14660"

[[comments]]
order = 1
subject = "مفتى الحزب الوتنى"
author = "شلهوب"
text = "هو المفتى ظهر تانى - هو دة وقت ظهور البامية<br />مش انت يا سيادة المفتى اللى كل ما الحزب يقع فى مصيبة يزقك تطلع بقتوى تخللى الناس يتكلموا فيها ويسيبوا البلاوى اللى هما عايشين فيها من امثال فتاويك بارضاع الكبير ومش عارف اية اللة يسد نفسك<br />مش انت اللى ضحكت علينا الناس<br />هو الحزب الوطنى بيجيب الاشكال دى منين<br />وبعدين كلامك الجبان دة ميقنعش احد<br />الم تقرأ ما فعل الصحابة مع الرسول فى احد المواقف<br />واللة لا نتركك ابدا ولو خضت بنا البحر لخضنا معك - ولن نقول لك ماقالة اصحاب موسى اذهب وقاتل انت وربك انا هنا قاعدون<br />السلبيون امثالك هم سبب بلاوينا<br />اللى هيمس الرسول بكلمة هنسمعة بدل الكلمة السيئة الف كلمة سيئة<br />خليك فى حالك<br />سكت دهرا ونطق كفرا"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003211/http://masr.20at.com:80/newArticle.php?sid=14660"

[[comments]]
order = 2
subject = "الرسوم المسيئة الى الله سبحانه"
text = "قبل الاساءة الى الرسول بالرسوم والكلام<br />الاساءة بالرسوم والكلام الى الله<br />يعني مثلا النصارى راسمين واحد راجل ومصلوب ويقولون هذؤا هو الله (تعالى عما يصفون) فهذا الرسم مسيئ الى الله<br />هذه الاساءة بالرسم<br />الاساءة الى الله بالكلام<br />يقولون انه انجب ولدا (تعالى عما يقولون) وهذه اساءة بالكلام ايضا<br />فكلام المفتي صح<br />اما الاساءة الحقيقية للرسوم هم من المسلمين الذين يشربون الخمر ويزنون ويأكلون الربا ولا يحرمون ما حرم الله سبحانه وتعالى هم الذين يسيئون الى الرسوم حقا"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003211/http://masr.20at.com:80/newArticle.php?sid=14660"

[[comments]]
order = 3
subject = "يا مسلم انصر دينك ونبيك باجتناب الكبائر"
author = "ابومحسن"
text = "الشرك بالله<br />قتل النفس<br />السحر<br />ترك الصلاة<br />منع الزكاة<br />إفطار يوم من رمضان بلا عذر<br />ترك الحج مع القدرة عليه<br />عقوق الوالدين<br />هجر الأقارب<br />الزنا<br />اللواط<br />أكل الربا<br />أكل مال اليتيم وظلمه<br />الكذب على الله عز وجل وعلى رسوله<br />الفرار من الزحف<br />غش الإمام الرعية وظلمه لهم<br />الكبر والفخر والخيلاء والعجب والتيه<br />شهادة الزور<br />شرب الخمر<br />القمار<br />قذف المحصنات<br />الغلول من الغنيمة<br />السرقة<br />قطع الطريق<br />اليمين الغموس<br />الظلم<br />المكاس<br />أكل الحرام وتناوله على أي وجه كان<br />أن يقتل الإنسان نفسه<br />الكذب في غالب أقواله<br />القاضي السوء<br />أخذ الرشوة على الحكم<br />تشبه النساء بالرجال وتشبه الرجال بالنساء<br />الديوث<br />المحلل والمحلل له<br />عدم التنزه من البول<br />الرياء<br />التعلم للدنيا وكتمان العلم<br />الخيانة<br />المنان<br />التكذيب بالقدر<br />التسمع على الناس وما يسرون<br />النمام<br />اللعان<br />الغدر وعدم الوفاء بالعهد<br />تصديق الكاهن والمنجم<br />نشوز المرأة على زوجها<br />التصوير<br />اللطم والنياحة<br />البغي<br />الاستطالة على الضعيف<br />أذى الجار<br />أذى المسلمين وشتمهم<br />أذية عباد الله والتطول عليهم<br />إسبال الإزار والثوب واللباس والسراويل<br />لبس الحرير والذهب للرجال<br />إباق العبد<br />الذبح لغير الله عز وجل<br />فيمن ادعى إلى غير أبيه وهو يعلم<br />الجدال والمراء واللدد<br />منع فضل الماء<br />نقص الكيل والزراع<br />الأمن من مكر الله<br />تارك الجماعة فيصلي وحده من غير عذر<br />الإصرار على ترك صلاة الجمعة والجماعة من غير عذر<br />الإضرار في الوصية<br />المكر والخديعة<br />من جس على المسلمين ودل على عورتهم<br />سب أحد من الصحابة رضوان الله عليهم"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003211/http://masr.20at.com:80/newArticle.php?sid=14660"
