text = "ليس بغريب فى ان يتدخل القرد بوش الذى اعتبر نفسة واصيا على العالم فى شئون البلاد ويفرض العقوبات على من يشاء ذلك الرجل المتغطرس ولكن مهما طال الليل فان الصبح قريب وسيشاهد العالم نهايتك كما انتهى الكلب شارون الذى يعذبه الله الان بتعفن اجزاء من جسدة واستئصالها وهو مستيقظ ولا عجب هذة نهاية الظالمين المفسدين ستكون نهايتك يا بوش مثل نهاية عبد الله ابن ابى سلول ومثل همان وفرعون وامية بن خلف وقارون والنمروذ .....وستكون عبرة لكل ظالم معتدى على حرمات الله"
