order = 4
subject = "شفرة بوذا"
author = "طيف بدر"
posted = "2007-09-30"
text = "http://alayasser.maktoobblog.com/546534/%D4%DC%DC%DC%DC%DD%D1%C9_%C8%E6%D0%C7<br />قبل عدة سنوات و في أحد بلدان جنوب شرق آسيا قام النظام العسكري المجرم الجاثم على صدر شعبه بأبشع عمليات القتل و الإبادة و سفك الدماء و التهجير ضد الأقلية المسلمة في جنوب تلك البلاد و مر الأمر كمجموعة أخبار يومية تحتل مكانها في وسط نشرات الأخبار أو مساحة في الجرائد .<br />هذه البلد هي بورما - أو ميانمار- و التي أصبحت بؤرة اهتمام و ذكر و مندوحة جديدة يتكسب منها المسترزقون بحقوق الإنسان في الغرب و أذيالهم في ديار المسلمين مع أن نفس النظام الذي يثور عليه الرهبان البوذيون اليوم هو عينه الذي نكل بالمسلمين قبل عدة أعوام . اهتمام غربي و - عالمي بالتبعية - لما يحدث في ميانمار و مطالبات بدعم ثورة الرهبان و الضغط على العسكر و تحرير ميانمار من نظامها المستبد القمعي ، و وجدنا سكيرهم التكساسي جورج يشعر بالأسى لما يحدث في بورما يطالب العالم من على منصة الأمم المتحدة بالكف عن انتقاد إسرائيل و النظر إلى إيران و بورما !! مفهوم هذا الموقف الذي قد يجد فيه بوش و قادة الغرب ستارا للدعاية لإنسانية كاذبة و أياديهم لا تزال ملطخة بدماء الأبرياء حول العالم و لا سيما في فلسطين و العراق و لبنان و أفغانستان .<br />و لكن الذي لفت نظري فعلا هو سقوط الأقنعة في إعلامنا العربي بفعل ثورة رهبان بوذا و أظن أن هؤلاء الرهبان كما تمكنوا من إحراج جلاديهم فقد تمكنوا من فضح التناقض الذي يعانيه البعض بل و تأكيد الكثير مما تخفيه النفوس المريضة .فبين يوم و ليلة بات رهبان بوذا رمزا من رموز التحرر و النضال إلى جوار جيفارا و جان دارك ، لم يعتبر المفضوحون الرهبان البوذيين متسترين بالدين أو أنهم يستخدمون الدين لتحقيق أهداف سياسية و لم يصفوا هجوم النظام العسكري على المعابد البوذية بتجفيف منابع الإرهاب و مكافحة التطرف و لكن لأن هؤلاء القوم يريدون إلصاق كل نقيصة بالإسلام و المسلمين كالليبراليين و اليساريين و غيرهم من المستكبرين غلاظ القلوب فقد وقعوا في تناقض مضحك و فاضح عندما أرادوا المقارنة بين بلادنا العربية و بورما و طلبوا من علماء الإسلام (طبعا هم يسمونهم رجال الدين) أن يكون لهم في رهبان بوذا أسوة حسنة لمن كان يرجو مواجهة فساد السلطة و جبروت الحكام بدلا من الاهتمام – على حد قولهم – بتوافه الأمور و التكفير و التحريم و فقه الزواج و الطلاق و الحيض و النفاس - و نسى هؤلاء أن سجون الجلادين العرب تعج بالمعتقلين الإسلاميين الذين رأوا أفضل الأعمال إلى الله كلمة حق عند حاكم جائر و الأغرب أن نفس الأشخاص الذين رفعوا الرهبان إلى أعلى مراتب الكفاح و التحرر يصفون الإسلاميين بصفات نعلمها جميعا بل و نجدهم سندا للحكام في ممارساتهم ضد الإسلاميين بداية من التزوير و حتى انتهاك حرمات المنازل في أنصاف الليالي .<br />ما المقاييس التي ينظر بها هؤلاء لكي يلصقوا بثورة الرهبان كل فضيلة و يتعتوا ثورة الملالي في إيران بكل رذيلة ؟ لا أظن إنه حبهم لأبي بكر و عمر (لإبراء ذمتي من الله : الثورة الإيرانية كانت وبالا على أهل السنة و العرب إلا أنها صنعت لإيران وضعا مهيبا لم يكن ليحدث في الحقبة الشاهنشاهية )<br />ما المعايير التي أصبح بها جيفارا و الرهبان محرري أوطان بينما يصبح الحسم العسكري الذي قامت به حماس في قطاع غزة نذير شؤم و مرفوض ؟ و لو نظرنا إلى هذا التطهير المبارك لوحدناه استهدف جلادين قساة و بائعين للأوطان و الشعوب و لصوصا متاجرين بالقضايا و الآلام تكدست الأموال التي سرقوها في بنوك دبي و سويسرا و باريس و تونس .<br />هل أكون مخظئا إن وصفت هذه العصابات السلولية المتصهينة التي وجدت للإعلام سبيلا بأنها قصيرة النظر سقيمة الفهم ؟ إذن فلماذا ينظرون إلى البورميين الذين يسقطون برصاص النظام البورمي بانهم ثمن الحرية و الحياة الكريمة بينما ينظر ون إلى ما يقوم به المجاهدون في فلسطين و العراق و أفغانستان و الشيشان ضد المحتل على أنه اعمال عنف و تهور و اندفاع عبثي ؟<br />هل مكافحة الظلم و القهر تكون فقط بالاعتراض على الحاكم ؟<br />ماذا عن الأمر بالمعروف و النهي عن المنكر بين المجتمع ؟ أليس مكافحة الرذيلة و الفوضوية و إحياء حسن الخلق و الحض على رقي المعاملات مقاومة للظلم ... بل هي استئصال للظلم من منابعه ؟ فأصحاب السلطان الفاسد و أصحاب المنافع الضارة لا يسرهم سيادة الأخلاق و القيم الدينية عامة و الروح الإسلامية الواعية خاصة بين عموم الناس و إلا من سيطيع الطاعة العمياء\" و يقول : يللا نفسي\" و من سيحتسي الخمور و يلعب القمار و كيف لهذا الذئب أن بنهش فريسته ؟<br />بحثت عن المعايير لعلني أجد مساحة مشتركة للتواصل و التعايش معهم و لكني وجدته معيارا وحيدا ذكره لله تعالى في كتابه المجيد :<br />{ وَإِذَا ذُكِرَ اللَّهُ وَحْدَهُ اشْمَأَزَّتْ قُلُوبُ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ وَإِذَا ذُكِرَ الَّذِينَ مِن دُونِهِ إِذَا هُمْ يَسْتَبْشِرُونَ }الزمر45<br />يقول ربعي بن عامر (رضي الله عنه) لرستم قائد جيوش الفرس :<br />\"إن الله ابتعثنا لنخرج العباد من عبادة العباد إلى عبادة رب العباد ومن جور الأديان إلى عدل الإسلام، ومن ضيق الدنيا إلى سعة الدنيا والآخرة \""
