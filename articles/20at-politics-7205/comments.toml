subject = "تعليق على كلام طيف بدر"
author = "مسلمة"
posted = "2007-09-27"
text = "من هذا الشخص الغريب الذى يقول البوذية الجميلة هل انت مدرك ومتفهم اصلا معنى البوذية ؟؟؟وبالاخر تقول اللهم انى صائم لاحول ولاقوة الا بالله ربنا يهديك وينجيك من شر نفسك يا من تقول ان البوذية تدعوا الى السلام الروحى والمسلم بيده اعظم واكبر كتاب يدعوا للسلام والصفاء وهو القران الكريم ومعه سنة الحبيب محمد صلى الله عليه وسلم وتقول ان الرهبان البوذين هيطلعوا (بوذك )ما هذا ماشانك انت بجنوب شرق اسيا وانت من لهجتك مبين انك مصرى وتلميحك عن جماعة الاخوان لماذا غير كامل قولها بصراحة انهم يودون الحكم وان الناس مخدوعين فيهم"
