subject = "المبوذون"
author = "طيف بدر"
posted = "2007-09-27"
text = "http://alayasser.maktoobblog.com/538276/%C7%E1%E3%C8%E6%D0%E6%E4_%21%21<br />هل يمكن أن نسمي هذا يالإرهاب البوذي ؟<br />أم أن هذا استغلال بشع للدين و تمسح بأستار البوذية لاستعلاء كرسي الحكم و الوصول لأهداف سياسية ؟<br />كم أشعر بالانزعاج و الخوف و التوجس و \"الخضة\" لهؤلاء الذين أساءوا لجوهر البوذية و التي أسمع أنها تدعو إلى السلام الروحي و التوافق النفسي و التشعلق الهوائي و الاتجاه الحلزوني ، فلا يمكن بأي حال من الأحوال أن ننسب هؤلاء إلى البوذية الجميلة و لكنهم \"مبوذودن\" و ليسوا بوذيون .<br />استيقظ يا شعب ميانمار و لا تستجيب لدعاوي \"المبوذين\" الذين إذا وصلوا إلى كرسي الحكم سينقلبوا على الحرية و \"يطلعوا بوذك و بوذها و بوذي\"<br />للأسف شعب ميانمار أصبح مخدوعا بشعارات جماعة (الإخوا....) - آسف - أقصد (الرهبان البوذيون) و بدأ يعتنق أفكار غريبة يتبناها تيار (سا-لا-فيا--وا-ها-بيا) البوذي المتطرف القادم من كهوف التبت ... يا خسارة<br />الله أكبر . الله أكبر<br />بالإذن يا جماعة ... المغرب أذن و حروح أفطر و رمضان كريم و اللهم إني صائم"
archived = "2010-03-14"
