posted = "2007-03-21"
text = "ادأه كان سيىء جدا واوفر اوى اهتم بالشكل والحركات واللبس لكن الاداء كان وحش جدا اقدر اقول ان ده سببه الاستعجال<br />وكمان المخرج توسع جدا فى شخصيه جمال عبد الناصر يمكن يكون المخرج ناصري.....?,,,,, بس عندما كنت اشاهد المسلسل كنت احس انه لجمال عبد الناصر,, اغفل المسلسل كثير جدا من علاقاته مع الجاميلات اللى قاموا بالتمثيل معاه افلامه كنا نتمنى نعرف اكتر عن علاقاته معاهم ولم يتحدث المسلسل عن الخلافات بين فريد الاطرش .... لكن اعجبنى جدا اداء بعض الفنانيين لكن شادى وحش جدا الملابس كانت غير مطابقه لعصر حليم خالص حتى ان تفصيلات البدل كانت بتاعه عصرنا حاليا حتى الوان الكرافتات اما عن مشهد الوفاه كنت اتوقع انى هقطع كل المناديل اللى كنت محضرها للمشهد ده علشان البكاء من تأثيره ,,,,لكن المشهد كان باهت جدا ولم اتاثر به مطلقا وياخساره كم المناديل اللى اشتريه علشان المشهد ده"
