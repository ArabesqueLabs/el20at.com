subject = "مسلسل حلو"
author = "برافو شادي"
posted = "2007-03-10"
text = "فعلا المسلسل كان حلو جدا ومش فشل..بالعكس..وكل اللي عملوا الهوجة دي علشان يسقطوا شادي شامل كان بهدف انهم يبرزوا فيلم حليم الفاشل جدا جدا جدا جدا ..و العك اللي عملوه في الفيلم واستغلالهم للفنان الجميل احمد زكي وهو في عز مرضه..وأخرتها يجيبوا ابن أحمد زكي ..اللي لا شكل عبد الحليم ولا عنده موهبة ولا نيلة ..مش فاهمة اما شادي شامل معملش دوره كويس ..أومال مين اللي عمله كويس؟ هيثم احمد زكي؟؟؟<br />ممكن من عيوب المسلسل فعلا مكياج شادي شامل , لكن ده لم يؤثر على أداءه .. وأغلس و أبوخ حاجة في المسلسل كانت عبلة كامل ..اللي بقت تقوم بدور المعلمة في كل حاجة ..أفلام و مسلسلات ..بنفس الطريقة و الأداء وحركة العين وكل حاجة هي فعلا اللي كانت مملة"
