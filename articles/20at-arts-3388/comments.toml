subject = "رمي عباءة حليم!!!!"
author = "شرين منصور"
posted = "2007-03-09"
text = "الموضوع جيل والسئلة اروع بس بصراحة مش مصدقة ان ده هو شادي بس خير التغيير مطلوب من حين لأخر ..بس في حاجة غريبة عند الوسط الفني او ممكن اقول مرض اسمو تبرير الفشل بجملة واحدة (زحمة الخريطة الرماضنية)في اثناء فشل مسلسل في رمضان او جملة (زحمة الفلام السينمائية ووجود عدد كبير من فنانين مصر في الساحة السينمائية)مفيهاش حاجة لو قلنا الأسباب الحقيقية اللي خلت العمل الفني انو لم يوفق بس الكل عارف ان من لأسباب المكياج الoverاوييييي بصراحة كان وحش وفي كمان ان بعض الممثلين كتيير جدا لم يقنعونا كتير اوي بصراحة وانو شادي لبس عباءة حليم بطريقة زيادة اويييييي ،،الحاجة التانية المفروض التجربة اللي عاشها متبقاش اهواك واتمنى لو انساك على العموم يكفيه انو حاول سواء فشل او مفشلش بالرغم اني مش بعترف بلفظ الفشل لنو هو في الاخر اخد خبرة جامدة جداااا واتعلم حاجات يبقى فين الفشل ..على العموم النيولوك حلو وياريت نشوف عباءة شادي ومش عباءة حد لنو اللي بيتقمص شخصية حد مسيره غير موفق وجهة نظري....متابعة جيدة لمقالات محمود"
archived = "2010-03-14"
