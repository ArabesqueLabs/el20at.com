text = "شدوا حيلكم جميعا...<br />أزمة وتزول..<br />هأستأذنكم كل اللي هيدخل هنا في التعليقات يدعيلي ويدعي لكل اللي بيمتحنوا<br />سلام علشان ورايا امتحان كمان خمس ساعات و 28 دقيقة"
