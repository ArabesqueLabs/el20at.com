[[comments]]
order = 1
subject = "هي ناقصة ... لازم تفكرونا إنتم كمان ."
author = "محمد السيد"
text = "ياااااااااااااااااااااااااااه .......<br />بعودة الأيام .....<br />الواحد كان زمانه في إعلام دلوقتي ... و والله جايب مجموعها ...بس حنفول إيه في الزمن ...<br />ده غير إني كان زماني مخلص من كام سنة ... غالبا دفعة نص البشر اللي في عشرينات ... أو الدفعة اللي بعدها ...<br />بس حنقول إيه ؟؟؟<br />علي رأي محمد هنيدي في جاءنا البيان التالي ...<br />حسبي الله ونعم الوكيل فيك يا فخري .. بين قوسين يا مبارك ....<br />أمانة عليكم بقي .... بعدد السنين والمرات اللي تابعت فيها عشرينات ... وقضيت فيه أحلي ساعات النت .... دعواتكم<br />الامتحان يوم الخميس الجاي الساعة 10 الصبح .... يعني كمان ممكن في صلاة الضحي بتاعة الخميس تدعوا كمان ...<br />والأمانة التامية اسألوا في بيوت الشباب .. عايز حتة أبات فيها الكام يوم دول .... إهئ إهئ إهئ ...<br />وبرضه مش حاسكت ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2010-03-14"
capture_url = ""
