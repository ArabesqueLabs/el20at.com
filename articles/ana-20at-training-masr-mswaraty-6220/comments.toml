subject = "موازى لفيصل الهرم"
posted = "2007-06-01"
text = "الاخ كاتب المقال كان نفسى كمان يضيف مع نفس المشكله شارع الهرم عشان هى هى نفس السيرفيس ونفس البلطجه لسواقين السيرفيس وسماعات السوند القويه اللى ميقدرش واحد من الركاب يستاذاذن او يطلب من البيه السواق ان يوطيها شويه ويقلل ضجيجها اللى على طول الطريق بينفض فى العربيه واللى راكبينها"
