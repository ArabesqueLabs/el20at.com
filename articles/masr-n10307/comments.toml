[[comments]]
order = 12
subject = "لا اله الا الله سيدنا محمد رسول الله"
author = "الجندى المجهول"
text = "الحمد لله الذى انعم على بنعمه الاسلام دين الحق والتسامح والطيبه والاخلاق ولم نجد من قبل ان اى مسلم اساء لاى ديانه من الاديان السماويه ولكن بعض الكفره الملحدين الشواذ هم من اسائوا للدين الاسلامى ولرسوله الكريم وللعلم كل من يحب ان يشهر نفسه يسئ للدين الاسلامى لانه دين الحق ولا اخد يسكت على الحق"
archived = "2007-09-19"
