text = "- السلام عليكم ورحمة الله وبركاته<br />- قلت في تعليقي السابق ... ولن أعلق في هذا الموقع مرة أخرى إلا إذا هاجم أحد السفهاء ديني ... ولكني أستثني هذا التعليق لأنه واجب علي أن أقوله وذلك إمتثالا لقول الله عز وجل (بسم الله الرحمن الرحيم :وَإِذَا حُيِّيْتُم بِتَحِيَّةٍ فَحَيُّواْ بِأَحْسَنَ مِنْهَا أَوْ رُدُّوهَا إِنَّ اللّهَ كَانَ عَلَى كُلِّ شَيْءٍ حَسِيبًا)<br />- أخي الكريم (واحد من الناس) ... حياك الله وبياك ... وجعل الفردوس الأعلى من الجنة مثواي ومثواك.<br />- سبحانك اللهم وبحمدك ... أشهد أن لا إلاه إلا أنت ... أستغفرك وأتوب إليك"
