[[comments]]
order = 8
subject = "هذا تعليقى و ااسف على الخطا ف التعليق السابق"
author = "نيفين نيفى نوفا"
posted = "2007-05-23"
text = "الاخ الفاضل ابن الاسلام<br />اذا كنت قد بدات من حيث انتهيت انا فدعنى ابدا من حيث انتهيت انت و دعنى اقول انه يؤسفنى قرارك بعدم التعليق مره اخرى - و ان كان لك مطلق الحريه فى هذا-و اقول ان الموقع سيخسر بالتاكيد شخصيه متميزه و نضج فكرى اثبت للكثيرين انه ما زال لدينا القدره على التحاور بشكل حضارى<br />فيما يتعلق بموضوع دفاعك عن الاسلام انا معك قلبا و قالبا و لكن الا ترى انك من خلال التعليقات قد اتيت بايات من الانجيل و اخذت تفند الادله و صدقنى لو اننى احسست بصيصا من الامل لاذرتك و لكن هذا دفع الشخص الاخر للرد و تحول الموضوع الى ما يبتغيه الكثيرين من ايقاع الفتنه التى لعن الله من اوقظها<br />و لذا فانا لا افهم لماذا تصر على اتهامى بتللك التهمه العظيمه التى اوردتها فى النقطه السادسه من موضوع عذرا اليك يا رب"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034235/http://masr.20at.com:80/newArticle.php?sid=10307"

[[comments]]
order = 9
subject = "بقيه  تعلبقى"
author = "نيفين نيفى نوفا"
posted = "2007-05-23"
text = "و هى اتهامى باننى اثنيك عن الدفاع عن الاسلام..صدقنى انا اقسم بالله انا هذا غير وارد على الاطلاق فمن نكون ان ارتضينا عن ديننا هذا و لكن ربما ليس الخطا لديك و لكن لدى بعض الاشخاص الذين يتصيدون الفرص للايقاع بين الناس و قصدت الا نمكنهم فرصه لذللك<br />ايضا تقول اننى اتهم بعض الناس بالعقليه المغلقه و لكن انا قصدت ان هناك شخصيات بعينها من الممكن ان تتصيد لى خطا لاهداف فى انفسهم و هم معروفون لنا كمنعلقين و معروفون للكتاب<br />اريد اخيرا ان اوضح اننى لا تهاون ف الدفاع عن دينى و ربما ان قرات تعليقاتى فى مواضيع اخرى او انك من المداومين على الموقع ستعرف اننى لست الشخصيه التى تتخذ هذا المنحى الفكرى او لنقول العقائدى ابدا<br />وصدقنى سعدت بالتحاور معك و اشكرك على توضيح معنى الايه و اطمئن انا اعتبر موضوع المناظره هزار لانى بالفعل اعترف اننى لا امللك الاطلاع الكافى دينيا الذى تقتضيه المناظره"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034235/http://masr.20at.com:80/newArticle.php?sid=10307"

