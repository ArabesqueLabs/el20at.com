[[comments]]
order = 13
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-11-21"
text = "الى متى سنكون مطمع لبعض الدول ومن الاف السنين يجرى تجزئة مصر سوى طائفيا جغرافيا او اقتصاديا بارتفاع مستوى البطاله او الفقر بين الشعب واستغلال هذا لفعل الافاعيل بين الشعب نتمنى انيكون هناكوعى بين المسلمين والمسيحين<br />على حد سواء واليكم المثل الاعلىفى العرق الديمقراطيه والحريه التى يطالب بها ادول الكبار ولك الله يامصر"
archived = "2010-03-14"
capture_url = ""
