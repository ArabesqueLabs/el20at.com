[[comments]]
order = 0
subject = "لله المجد في الاعالي  وعلى الارض السلام وفي الناس"
author = "مش ضروري"
posted = "2007-05-21"
text = "يا جماعة عدد المسلمين في مصر ??? مسلمين سنه وبقية الطوائف والملل والنحل ?? فقط<br />علشان خاطر كده جماعة الاقباط كانوا دايما رافعين شعار<br />لله المجد في الاعالي وعلى الارض السلام وفي الناس المسره على مدار الف وربعميت سنه<br />ايه بآه اللي غير الاقباط مع ان عددهم ضعيف ولا يرتقي الى اي مواجهة مع المسلمين<br />اقولكم انا<br />ان متطلبات السلام الاسرائيلي (يعني علشان خاطر اسرائيل تعيش في سلام) لا بد من انشاء في مصر دولتين دولة قبطية مسيحية ودولة اسلامية عربية<br />وكل المشاحنات اللي بتحصل بين المسلمين والمسيحيين دي سببها الاقباط بتحريض من اقباط المهجر عملاء اسرائيل<br />علشان خاطر يثبتوا انهم لا يستطيعون التعايش مع المسلمين وبالتالي يسيروا في طريق الانفصال تنفيذا للمخطط الاسرائيلي<br />اصحوا يا مسلمين بسرعه"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034235/http://masr.20at.com:80/newArticle.php?sid=10307"

[[comments]]
order = 1
subject = "الجن يتكلم"
author = "واحد من الناس"
posted = "2007-05-21"
text = "طيب الاخ اللى كاتب اللافته دى مش كان يقولنا على الدليل اللى يثبت تورط البابا مع بابا العالم السفلى .... عموما لازم النيابة تستدعى الجن السفلى و تسأله لأن توجيه الاتهامات جزافا ده شئ خطير و لا يجب السكوت عليه و اقترح انشاء ادارة جديدة فى الشرطة اسمها ادارة مكافحة جرائم العالم السفلى و يعين ليها اللواء شندى الفلكى كمدير للادارة و يعاونه مجموعة ذات كفاءة عالية فى جرائم العالم السفلى و ليها خبرة فى فتح المندل و أخذ القطر و ابطال الاعمال .... ايه اللى انا بأقوله ده!! يلا ما هو الموضوع اصلا هرتله فى هرتله"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034235/http://masr.20at.com:80/newArticle.php?sid=10307"

[[comments]]
order = 2
subject = "تانى تانى تانى"
author = "نيفين نيفى نوفا"
posted = "2007-05-21"
text = "انا شايفه ان موضوع لافته على باب بيت مش امر مهم يخلى اى جهه ف مصر تتحرك(دا على اساس ان فيه جهات بتتحرك لو الامر مهم)<br />ما علينا<br />عموما خايفه الموضوع يتحول للى ال ايه موضوع ارض العياط و ما يحدث و يجرى هناك من مشاحنات و مناظرات كلاميه بين ابن الاسلام و مصرى اصيل و اللى بقول فيها انك لاتهدى من احببت و لكن الله يهدى من يشاء<br />خايفه الموضوع ده يبقى التطور الطبيعى و الامتداد لموضوع العياط و نلاقى نفسنا بنقول على راى عبد الحليم تانى تانى تانى راجعين انا و انت تانى<br />ربنا يستر"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034235/http://masr.20at.com:80/newArticle.php?sid=10307"

[[comments]]
order = 3
subject = "ما تخافيش يا نيفين"
author = "ابن الإسلام"
posted = "2007-05-22"
text = "- الحمد لله والصلاة والسلام على رسول الله<br />- ما تخافيش يا نيفين ... أنا لن أتدخل إلا كمدافع ... يعني لن أكون أنا البادئ<br />- وفي موضوع أرض العياط أنا كنت ساكت وكافي خيري شري ... وهو اللي استفزني لما طالب بتعديل الإسلام<br />- بالمناسبة ... إقرأي تفسير الآية التي ذكرتيها (إنك لا تهدي من أحببت) وسبب النزول لتعلمي أنه لا علاقة لها البتة بما كنت تريدين أن توصليه لي.<br />- وأحب أن أنتهز هذه الفرصة لأسجل إعجابي بمعظم تعليقاتك التي تنبئ عن عقلية محترمة ناضجة<br />- وأخيرا ... لمن يهمه الأمر ... أنا مسلم وكفى ... هذه الكلمة لا تحتاج إلى لقب آخر يضاف إليها ... يعني بالبلدي لست منتميا لأي جماعة أو حزب أو تيار ... مجرد مهندس أزهري والسلام<br />- سبحانك اللهم وبحمدك ... أشهد أن لا إلاه إلا أنت ... أستغفرك وأتوب إليك"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034235/http://masr.20at.com:80/newArticle.php?sid=10307"

[[comments]]
order = 4
subject = "اعتراف"
author = "نيفين نيفى نوفا"
posted = "2007-05-22"
text = "الاخ الفاضل اب الاسلام<br />بعد التحيه دعنى اعترف اننى صاحبه تعليق الرحمه الذى ورد فى موضوع ارض العياط و الذى تعمدت فيه اخفاء شخصيتى و لو ان بعض قدامى المعلقين سيعرفوها<br />ولذللك اسباب دعنى اوجزها فى ان الكثيرون سيفهمون الامر برمته خطا و ربما اجد من يقول لا تصدو عن سبيل الله و انت تعرف بعض العقليات المغلقه<br />و بالبلدى زى ما قلت و اسمحلى استخدم العاميه علشان اوصل فكرتى لاكبر عدد من الناس<br />و اسمحلى برده اساللك:هل تعتقد ان بامثال مناظراتك مع مصرى صميم ستصل الى ما تريد مع العلم ان كلا منكما قد بيت النيه مسبقا على الاختلاف على طول الخط و اظهار البراعه امام النفس و الاخرين و هذا لا يعنى انى انكر مجهودك و نيتك الصادقه بس صدقنى بيبقى واضح من كلام اللى قدامك اذا كان فعلا يريد اليقين كى يسلم ام انه فقط يريد التراشق اللفظى فقط لا غير و الموقع من زمان مليان بناس من النوعيه دى و المعلقين فيما بينهم اتفقو على عدم الكلام معهم لحد ما بالبلدى كده طفشناهم و اسماءهم معروفه و لا داعى لذكرها<br />كمان فيه ناس بستغل الكلام ده فى نشر مواقعهم التى قد تودى بالعوام و المراهقين و ضعاف الايمان الى الوقوع ف دائره الشك و صدقنى كتير ميعرفوش مواقعهم دى و ممكن يدفعهم الفضول للتجربه<br />بالنسبه للايه انا سمعت انها نزلت موجهه للرسول لكى يزيل اللع عن عاتقه مشقه هدايه من لا طائل منهم<br />ده على حد علمى لكن لو تعرف تفسيرها يا ريت تقوله<br />ارجو ان تكون الرسالع واضحه<br />و دايما بقول الاختلاف ف الراى لا يفسد للود قضيع"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034235/http://masr.20at.com:80/newArticle.php?sid=10307"

[[comments]]
order = 5
subject = "الأخت الفاضلة"
author = "ابن الإسلام"
posted = "2007-05-22"
text = "- السلام عليك ورحمة الله وبركاته<br />- اسمحيلي أبدأ من حيث انتهيت ... فعلا الخلاف في الرأي لا يفسد للود قضية<br />- من قال أنها كانت مناظرة؟؟؟ الرجل هاجم الإسلام ... فما دام في إمكاني أن أرد فلا يجوز لي أن أتخاذل.<br />- وفعلا أسلوبه كان يدل على نية مسبقة للإختلاف ... وللعلم ... لم يكن همي أن أدعو هذا الرجل للإسلام كما تخيلتي ... ولكن كان همي أن يعلم أنه من الصعوبة بمكان أن يهاجم الإسلام ولا يجد الرد المسكت ... وبفضل الله تحقق الهدف فلم نسمع له صوتا منذ فترة.<br />- عفوا ... أنا أظن أنه قد خانك التعبير حين قلتي (انت تعرف بعض العقليات المغلقه) ... وأنت من أدرى الناس أنه ليس من حق أحد أن يصدر حكما جازما كهذا على أحد ... فما يدريك؟؟؟ لعل الحق معه.<br />- ممكن ترجعي لموضوع أرض العياط - طالما أنت صاحبة التعليق - وتجيبيني عن النقطة السادسة في تعليقي (عذرا إليك يا رب)؟؟؟<br />- ده مجرد طلب ودي ... لحسن تفتكري إني باناظرك ولا حاجة (هزار ده والله)<br />- بعض تفسير الإمام الطبري للآية 56 من سورة القصص وسبب النزول:<br />هذه الآية نزلت على رسول الله صلى الله عليه وسلم من أجل امتناع أبي طالب عمه من إجابته , إذ دعاه إلى الإيمان بالله , إلى ما دعاه إليه من ذلك . ذكر الرواية بذلك : 20964 - حدثنا أبو كريب والحسين بن علي الصدائي , قالا : ثنا الوليد بن القاسم , عن يزيد بن كيسان , عن أبي حازم , عن أبي هريرة , قال : قال رسول الله صلى الله عليه وسلم لعمه عند الموت : \" قل لا إله إلا الله أشهد لك بها يوم القيامة \" قال : لولا أن تعيرني قريش لأقررت عينك , فأنزل الله : { إنك لا تهدي من أحببت } الآية<br />أرجو أن تلاحظي أن الرسول صلى الله عليه وسلم قد قام بواجبه ودعى عمه إلى الله ... أكرر ... دعى عمه إلى الله ... فهو عليه - ثم نحن بالتبعية - البلاغ ... وأما النتيجة - إسلام المدعو أو عدم إسلامه - فهو بيد الله تعالى وحده ليس بأيدينا.<br />- رسالة حضرتك واضحة ... ولن أعلق في هذا الموقع مرة أخرى إلا إذا هاجم أحد السفهاء ديني ... وأرجو أن تقرأي تعليقي (عذرا إليك يا رب) في موضوع أرض العياط جيدا ... و - دعيني أستعير أسلوبك - لا تبيتي النيه مسبقا على الاختلاف على طول الخط.<br />- شكرا لك<br />- سبحانك اللهم وبحمدك ... أشهد أن لا إلاه إلا أنت ... أستغفرك وأتوب إليك"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034235/http://masr.20at.com:80/newArticle.php?sid=10307"

