[[comments]]
order = 4
subject = "حرااااام"
author = "مسلم"
posted = "2007-04-28"
text = "قال تعالى : {واتبعوا ما تتلوا الشياطين على ملك سليمان وما كفر سليمان ولكن الشياطين كفروا يعلمون الناس السحر وما أنزل على الملكين ببابل هاروت وماروت وما يعلمان من أحد حتى يقولا إنما نحن فتنة فلا تكفر فيتعلمون منهما ما يفرقون به بين المرء وزوجه وما هم بضارين به من أحد إلا بإذن الله ويتعلمون ما يضرهم ولا ينفعهم ولقد علموا لمن اشتراه ما له في الآخرة من خلاق ولبئس ما شروا به أنفسهم لو كانوا يعلمون}<br />قال صلى الله عليه وسلم : «من أتى عرافاً أو ساحراً او كاهناً فسأله فصدقه بما يقول فقد كفر بما أنزل على محمد صلى الله عليه وسلم»"
archived = "2010-03-14"
capture_url = ""
