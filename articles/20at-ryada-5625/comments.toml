subject = "الدنبشة منتشرة بين المشجعين"
author = "دنابشي"
posted = "2007-04-28"
text = "كلمة الدنبوشي دخلت الى المملكة قبل عدة عقود ولايعرف لهذه الكلمة اصل في اللغة العربية ولكن من المرجح انها لفظة افريقية.<br />والدنبشة منتشرة بين المشجعين وجماهير الاندية في الوقت الذي لايعيرها بعض الاداريين في الاندية اي اهتمام."
