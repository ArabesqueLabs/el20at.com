[[comments]]
order = 0
subject = "لون من ألوان الدجل"
author = "قلم"
posted = "2007-04-28"
text = "يقول الشيخ الدكتور ابراهيم الخضيري ان الدنبوشي لون من ألوان الدجل الذي يروجه الدجالون المخرفون ويحاولون خديعة جمهور كرة القدم بجدوى مثل هذه الترهات وهو لون من ألوان السحر قال تعالى «ولا يفلح الساحر حيث أتى».<br />واستطرد ان استعمال الدنبوشي سواء في الرياضة او غيرها عمل محرم ولا يقوم بعمل الدنبوشي سوى شخص يتقرب من الجن والشياطين «بقربان» يطلبونه منه ولاشك ان مثل هذا الامر يخرج صاحبه من الملة ويوصل الى الكفر بالله عز وجل."
archived = "2010-03-14"
