subject = "الشركات العالمية"
author = "أحمد المصري"
posted = "2008-08-27"
text = "أحسن طريقة هي إرسال شكوى مباشرة إلي المصنع الأجنبي مهما كانت بلد الصنع.<br />عن تجربة الناس دي محترمة جدا و حيجيبولك حقك من الوكيل.<br />لكن مجموعة المرتشين و المنتفعين في جمهورية المهلبية تبقي بتضحك على نفسك إبقى خلي المحضر ينفعك."
