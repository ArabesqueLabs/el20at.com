order = 0
subject = "التجار يستوردون منتجات رديئة فنوكيا مثلا يتم تصنيع"
author = "عارف"
posted = "2008-08-25"
text = "افتح الجهاز قبل الشراء وشوف رقم مسلسل الجهاز والدولة الصانعة يمكن نوكيا صحيح ومصنوع فى بولندا والبطارية صينى وطبعا الاجهزة دى عايزة محافظة عليها ومحتاجة نظافة ولا تجعلها تسقط على الارض وتقع على البلاط او يدخل جواها تراب<br />او تعرضها لمجالات مغناطيسية عالية يعنى مفيش احد يحط الموبايل على التليفزيون مثلا<br />وبعدين اشترى من مكتب الشركة الرئيسى هتضمن ضمان بعد الخدمة"
