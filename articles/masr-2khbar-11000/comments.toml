subject = "اتفاقية ليفنى مع الادارة الامريكية تقضى بتدعيم الب"
posted = "2009-01-20"
text = "الاتفاقية تهدر السيادة الوطنية وتتعامل مع الشعب المصرى - البدو - بدون الحكومة - وسلم لى على امن الدولة واضطهادهم للبدو<br />فية لعبة كبيرة بتلعبها ليفنى<br />وشوية شوية هيسحبوا السيادة عن ارض سيناء<br />وعلشان كدة الحكومة المصرية رفضتها<br />العدو عدو<br />واليهود يهود<br />فهمت ياشيخ الازهر"
