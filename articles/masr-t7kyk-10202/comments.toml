subject = "كلام كتير نفسى اقولة عن هذة القصة الغريبة"
author = "كلام كتير"
posted = "2008-10-06"
text = "قرات هذة القصة فى مكتبة المدرسة الثانوى - ثم قراتها مرة اخرى بعد التخرج اثناء الخدمة العسكرية وطبعا شفت الفيلم عدة مرات<br />ولانى رجل من عامة الناس ومحتك بالمستويات الشعبية واعرف الشخصية المصرية جيدا وطباعها ووضع المرأة داخل الاسرة وبالذات وضع الزوجة والام والبنت<br />اولا السيد الاديب نجيب محفوظ كتب القصة من الواقع ولكنها ليست قصة لاسرة مصرية او شعبية ولكنها قصة تاجر من الشام مهاجر الى مصر ومستوطن فيها وساكن فى حى الحسين<br />المرأة المصرية مكرمة فى بيتها وهى كما يقول العامة ست البيت وكلمة ست البيت يعنى رئيسة البيت والكلمة كلمتها والشورة شورتها<br />الموظف المصرى بيقبض مرتبة ويسلمة مباشرة للست زوجتة وهى تتولى الانفاق والمصروف وتعطية مصروف الجيب ايضا<br />الكلمة الاولى فى البيت الفلاحى او الصعيدى بخصوص الذرع والقلع والزواج والطلاق واخد الثار هى كلمة الام<br />وكلمتها بتمشى على التخين<br />والبنت فلى البيت المصرى لها كل الدلال والحب من الاب قبل الام وهى زهرة من الزهور فى البيت ولا يتم اغضابها الا فى النادر<br />اذن القصة كتبت عن اسرة تعيش فى مصر وليست اسرة مصرية ولا تعرف شيئا عن طبائع واخلاق المصريين"
archived = "2010-03-14"
