[[comments]]
order = 6
subject = "هذه المعلومات غير صحيحة"
author = "بيبو"
posted = "2007-11-10"
text = "عزيزي محمد فاروق معظم المعلومات التي جئت بها غير صحيحة:<br />1:/ القبر المدفون بجانب الملك فؤاد هي فريال هانم ام الملك فؤاد وليس اخته<br />2:/الورود التي كانت بقبر شاه ايران كانت في زكرى ميلاده (26/10) وليس وفاته<br />3:/زوجة الخديوي اسماعيل اسمها ( جنانيار) وليس (جنهيار)<br />4:/معظم المعلومات التي جئت بها ليست على لسان عامل العهدة ( فهو لا يتكلم لغات و لم يعلق على مشاهدة المسلسل وهذا ما قاله واكده لي عامل العهدة ولكنك زدت وبالغت في صحة المعلومات وحقيقتها )"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133511/http://masr.20at.com:80/newArticle.php?sid=12163"

