[[comments]]
order = 9
subject = "كلنا لها"
author = "رانية"
posted = "2007-12-31"
text = "اعتقد ان حجم القبر وزخرفته ليست بالشيء المهم لان ضخامتها لا تدل ابدا عن عظمة اشخاصها و خير دليل قبر الرسول عليه الصلاة و السلام. اذا الموت ليس موت الجسد و انما موت الاعمال و الملك ما شاءالله وجد من ينصره بعد مرور العديد من السنوات. كما ان قبره وجهة للزوار حتى لا يصبح قبر الملك منسيا، و رم انه خلع من عرشه و لكن لا يمكن خلعه من قلوب الناس.<br />ملحوظة: امانة لكل من يقرأ ملحوظتي اذا زار قبر الملك ان يقرأ له الفاتحة نيابة عني و يبلغه سلامي . و هذا لاني من الجزائر ."
archived = "2010-03-14"
capture_url = ""
