subject = "ههههههههههههه"
author = "الله يخرب بيت احفاده"
text = "عشرينات مبقاش فيها غير الملك فارق كانه اتخلق عشان يشغلهم<br />فين الافكار"
archived = "2007-10-31"
capture_url = "https://web.archive.org/web/20071031045123/http://masr.20at.com:80/newArticle.php?sid=12163"

[[comments]]
order = 3
subject = "الملك فاروق .. مالذي فعله بمصر وبأهل مصر ؟؟؟؟"
author = "أيام الطفولة ..."
text = "الملك فاروق ... الله يرحمو .. رغم مساوءه الكثيرة التي طغت على محاسنه القليله .. أقولها وكلي ألم وحزن وقهر ومساعر كبت وضيق .. لأن مصر والشعب المصري .. يجب أن يعيش بكرامة وشرف وعزه ونخوه وضمير ... الخ .. ولكن ..<br />هذا هو القدر .. ويالسخرية القدر .. المهم .. الحمدلل حمدا كثيرا مباركاً ، وشكراً"
archived = "2007-10-31"
capture_url = "https://web.archive.org/web/20071031045123/http://masr.20at.com:80/newArticle.php?sid=12163"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
text = "أتيت القبور فناديتها<br />فأين المعظم والمحتقر<br />وأين المذل بسلطانه<br />وأين المذكى إذا ما افتخر<br />تروح وتغدوا بنات الثرى<br />فتمحوا معالم تلك الصور<br />فيا سائلي عن أناس مضوا<br />أما لك فيما مضى معتبر<br />أما لك فيما مضى معتبر<br />إيهاب"
archived = "2007-10-31"
capture_url = "https://web.archive.org/web/20071031045123/http://masr.20at.com:80/newArticle.php?sid=12163"

[[comments]]
order = 5
subject = "هذه المعلومات غير صحيحة"
author = "بيبو"
text = "عزيزي محمد فاروق معظم المعلومات التي جئت بها غير صحيحة:<br />1:/ القبر المدفون بجانب الملك فؤاد هي فريال هانم ام الملك فؤاد وليس اخته<br />2:/الورود التي كانت بقبر شاه ايران كانت في زكرى ميلاده (26/10) وليس وفاته<br />3:/زوجة الخديوي اسماعيل اسمها ( جنانيار) وليس (جنهيار)<br />4:/معظم المعلومات التي جئت بها ليست على لسان عامل العهدة ( فهو لا يتكلم لغات و لم يعلق على مشاهدة المسلسل وهذا ما قاله واكده لي عامل العهدة ولكنك زدت وبالغت في صحة المعلومات وحقيقتها )"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133511/http://masr.20at.com:80/newArticle.php?sid=12163"
