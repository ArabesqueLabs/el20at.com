order = 0
subject = "لمن الملك اليوم"
author = "خالدالامير"
posted = "2007-10-29"
text = ";لمن الملك اليوم لله الواحد القاهر ; ذكرني قبر الملك فاروق بهذه الايه القرانيه فلقد قرات عن حياه ملوك مصر والملك فاروق قبل عرض المسلسل واعرف ان فاروق مصر افتري عليه من قبل رجال الثورة ولكن هو اليوم في القبور وهم معه والباقون منهم سيكونون في القبر غدا فاين الملك والملوك وابنائهم جميعا في التراب فعلنا ناخذ عبره وعظه من التاريخ وافتراء بعض من زوروا التاريخ واعتقد ان النحاس باشا والوفد قد اوضح المسسل الكثير من الحقائق عنهم وهم ايضا من المفتري عليهم فاليوم ملك وغدا قبر وليتعظ المتعظون وذو الالباب"
archived = "2007-10-31"
capture_url = "https://web.archive.org/web/20071031045123/http://masr.20at.com:80/newArticle.php?sid=12163"

