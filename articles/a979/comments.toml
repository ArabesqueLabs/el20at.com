[[comments]]
order = 6
subject = "رسالة عاجلة إلى الأخ : رامي فيصل محمد عبد الرحيم و"
author = "عاشق فلسطين"
posted = "2008-05-21"
text = "السلام عليكم ورحمة الله وبركاته , أخي العزيز : رامي فيصل محمد عبد الرحيم , أريد أن أذكرك فقط بأن محمد نواف الحمد الله<br />هو أردني أصل , ولكن أريد أن أثبت لك فقط بأن أسفل شعب بالعالم كلو هم الشعب الأردني , مع إني أنا أردني من أصل فلسطيني , لكن لا تنسى بأن هناك تمييز وعنصرية كبيرة ورهيبة جدا بالأردن , وهي التمييز بين الأردني الأصل والأردني من أصل فلسطيني ................................................<br />أخي العزيز , أريد أن أثبت لك فقط بأنو الأردني لا يمكن أبداً بأن يحب الفلسطيني , فهما شعبان متضادان ولا يمكن أن يلتئمان لماذا؟ كله بسبب أفعال وأخلاق هذا الشعب الحقير المشين بقيادة ملكهم , أخي العزيز : لولا الله العظيم ثم وجود الفلسطينيين الآن بالأردن ولا كانت الآن الأردن هي أخزى دولة على وجه الأرض , أخي العزيز : أريد فقط بأن أريك نموذجا من نماذج الحقير السافل المنحط الواطي الساقط محمد نواف الحمد الله الذي قام بسب الفلسطينيين سباً قوياً وشتمنا بكافة أنواع الشتائم , ووصل به أن يعاتــــــب الله سبحانه وتعالى وحاشاه بأن الله هو الذي جمع كل أوساخ الدنيا وأنجاسها ووضعها بالفلسطينيين لكي يبتلي الأردنيين والله يا أخــــــــــي .......<br />أخي العزيز : لا أريد أن أتحدث كثيرا , ولكن اكتب في البحث : (((((ارفع رأسك أنتا فلسطيني))))) واضغط على أول رابط , أو<br />بالأحرى هذا هو الرابط : http://www.20at.com/newArticle.php?sid=12273<br />أخي العزيز : لقد وجدنا أذىً رهيبا والله بالأردن من قبل الأردنيين , وأن أساس العنصرية والفلتان التربوي الفظيع هو نابع من أخلاق هذا الشعب السافل الحقير , وهذا الحقير الذي يقول بأن الفلسطينيين لا يجدوا ما يأكلونه , ولكن انظر من الذي جعل للأردن سمعة على الساحتين العربية والعالميـــــة في نفس الوقت , وأن جامعات الأردن الآن من أقوى جامعات العالم كلها , لماذا ؟<br />لأن كل العاملين فيها فلسطينيين وكل مدراء الجامعات ووكلائها وأساس قوتها ومتانتها وصلابتها وسمعتها هم الفلسطينيون ؟<br />فـللفلسطينيين أفضال كثيرة جداً على الأردنيين , بعد أن كانوا مجموعة بدو حثالة مشردين , وتذكر أخي بأن أغلب أصحاب<br />الشركات والمؤسسات والبوابات السياحية هم فلسطينيون بالأساس , وهذا شئ لا يمكن إنكاره أبداً أبداً , لكن ادخل أخي على<br />الرابط , وانظر أول تعليق , فالسافل الخسيس محمد نواف الحمد الله له ثلاث أسماء ولا تؤاخذوني على بعض أسمائه النتنة :<br />الأردني , وأردني من السلط , ومشتهي نيك الفلسطينيات , وانظر كيف قام بالسب والشتم الفظيع التي تدل على أنه حيوانا<br />لا يفهم ولا يتفاهم , وأنه قد نشأ وترعرع على قمة السقاطة والوطاوة والنذالة , ولم يكتف بذلك فقط , ولكن أخي العزيز , أنت<br />تعرف بل وأعرف مني بأن أهل الأردن 98% من أهل البادية , وأهل البادية كما قال الله سبحانه وتعالى عنهم :<br />{الأعراب أشد كفراً ونفاقاً} فلا تستغرب أخي من هذا الحقير وغيره من الأردنيين السفلة بأن يقولوا لك مثل هذه الأقاويل , فقد<br />سمعناها كثيرا منهم , فهم يتكلمون بمعسول الكلام , وهم أنفق ناس على وجه الأرض , وشكرا جزيلا لك أخي العزيز , ولكــــــن<br />أرجووووووووووووووو من الجميع الدخول على الرابط واحكموا بأنفسكم , فأول تعليق وااااااضح وكافي على قمة الخنزرة والوقاحة<br />التي وصلوا إليها من خلال تعليقاتهم , وشكرا جزيلا لكم وآسف على إطالة الرسالة , ولكن ما كان بقلبي أعجز من أن يكتبه القلم<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ :::: ملاحظة خاصة :::: ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />يا محمد نواف الحمد الله , يا شيخ والله لأشرشحك وأخلي الكل يتف عليك , كفاية إنك أصلاً متفوف عليك ومدعوس عليك بالجزمة وعلى كل الأردنيين تبعونك يا بن الكلب , لسة والله لأخلي اللي بسوى واللي ما بسواش يدعس على رقبتك غصبا عنك يا كلب<br />يا واطي , ولأفضح بعرضك وشرفك يا شراري , واحد بـــــــــــــــــــــــــــدوي منافـــــــــــــق ,<br />البدو أنذل شُعث غبر الوجوه ان أمنتهم خانوا<br />وإن شبهتهم بالكلب صاح الكلب لا بشعرة في ذيلي بألف ألف ترباني<br />:::: عاشت فلسطين : من الفاء للنون , ومن النهر للبحر ::::<br />واعذروني يا إخوة على الإطالة ولكن !!!!!!!!!!!!!!!"
archived = "2010-03-14"
