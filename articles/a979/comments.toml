[[comments]]
order = 8
subject = "الأردن عالي عالي .. وفلسطين عفواً ( فلسطييييز ) تح"
author = "محمد نواف الحمدالله"
posted = "2008-08-05"
text = "أنا هونه بدي أقول كلمة وحده لهذولة الملقبيين بالفلسطيزيين .. يعني أنا مش فاهم .. ليش الواحد بعمل مع كل الناس خير وبساعدهم وبعاونهم، وبردوه بالمثل ؟.. إلا الفلسطيزيين .. بتعمل معاهم خير وبتساعدهم .. بروحو بقلبو ظدك .. وبصيرو مش معك بالمره . وفوق كل هيك أشرمط وأكلب وأنذل وأحقر وأوطى وأسفل وأرذل شعب في العالم بلا مناااااااااااااازع .. ماشالله عليكو محتليين الصداره أنتو .. أي كس أم شرفكو ولاد منيوكه عارهره داعره، يعني فوق ما حنا مفظليين عليهم وعلى اللي خلفوهم وعلى كل فلسطيزي أجرب مقلعط مش لاقيله دفشة ولا دزه .. ويلا يلا تا شايف قدامو .. فعلاً !!! إنكو ناس حقرا وأنذال ووسخيين ومعفنيين وجرب ومفطسيين وهبايل وكلاب ولاد كلاب ولكو إنتو في دمكو الكذب والغش والحقد والنميمة والحقد والكره والضغينة واللئم .. يعني الله مجمع فيكو كل وسخ وخره هالدنيا والعالم وحاطه فيكو .. سبحان الله !!! يعني الناس بتحاول إنها ( ه ) تحترمكو .. وتقدركو .. وتسويلكو مكانة ومستوى .. وإشي عليه القيمة والفايدة .. بس إنتو مامنكو فايدة بالمره .. يعني أنا الصراحة .. مش من طبعي أو حتى من صفاتي إني أسب سوى إنو شفت إنو فاظ الكيل .. والوعاء امتلا وصار لبرا .. فقلت فحالي وفنفسي صار لازم أتدخل وأسب وألعن وأفضحكو كلكو فرداً فرداً .. يعني أكبر دليل إنكو ناس شاطرة .. ومتفصحنه .. ورايقة .. وفاضية .. وماعندكو شغله ولامشغله . ولا حتى عمله .. إنكو نازليين سب فينا على ولا إشي .. يعني القافلة تسير والكلاااااااااااااااب ( اللي همه إنتو ) تنبح وتعوي ..!!!<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره فالتات ودايرات وداشرات بالشوارع ..<br />يعني والله أنا بشفق عليكو من شعب ماكل خرا من جميع الأصعدة والجوانب المختلفة . يعني شعب كس إمو من شعب شرممممممممممممممووووووووووووووووووووووووووووووووط .. قال رنتيسي وياسين وأبو عمار ( أبو حمااااااااااااااااااااااااااار ) .. وكس أخت أسماءكو كيف هيه !!!<br />إنتو اللي رح توكلو خراااااااااااااااا بالملعقة والشوكة والسكين ... وبالنهاية .. وكلمة أخيرة لكل أردني على وجه الكرة الأرضبة .. وووين ما كان .. بقلو وأنا هونه من موقعي ( الإمارات ) .. إرفع راسك لفوق لفوق لفوق وخليك عنيد وراسك يابس مش زي الحجر لأ أقوى من الحجر بكثييييييييييييييير .. وخلي عينك جاويه .. بتقدح شرارة .. قوية .. واللي بطلع فيك وخصوصاً إذا كان فلسطيزي .. مع إنو بسترجيش أو بالأحرى بقدرش أو إنو يحاول يرفع وجهو بوجهك .. وفي حال لو رفع شويه من وجهو الأجرب أخزقلو جوز عيونو .. وسوي براسووو خريطة العالم .. ونييييييييييييك خواته ال66مليون شرموطه وشرموطه .. ولاتنسى تنيك إمو ( لإنها هيه الأساس ) .. وبعد هيك إدعس بنص بطنو دعسة بنت كلب ( نصها موت ).. وشلحو أواعيه .. وافتح طيزو ونيييييييييييييييييييييييييكو لحد ما يغمى عليه ويطفي على الآخر . وبعدين كفين على الماشي ومرتبات يكونو على أكمن بوكس على شلوتين في زبو يخليه يبطل يخلف نهائي وبالمره .. وبعد هيك ( بدي أفرط من الظحك ) .. _ هذا إذا ظل عايش وعلى قيد الحياة وفيه روح وبتنفس _ .. على العموم شيك يعني .. هع هع هع ... وقلوووووووو بأعلى صوتك كالآتي :- ((( مظيع بوجهي شلن يا أخو العرصة ..... )))<br />ولكووووووووو .. نكناكو كثير كثيييييييييييييييييييييييييييييييييييير كثيييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييير .. وزهقنا من طياز وكساس وبزاز وشفايف وخدود بناتكو ونسوانكو يالفلسطيزيه .. وملينا منكو نهائي .. ومسحنا بكرامتكو وشرفكو أرض الأردن كلها/ ولفينا فيها شبر شبر .. ولعنا ظمايركو حى صفيتو بلا ظمير .. أي كس أختكو من متى كان عندكو ظمير .. يعني بالمشرمحي هزئناااااااااااااااااااااااااااااااااااااااااكوووووووووووووووووووووووووووو .. وخليناكو فرجه للي بسوى واللي مابسوى .. وعلكة بثم الجميع .. وسيرتكو وقصتو على كل لسان في العالم .. يعني خلصنا عليكو وقظينا عليكو .. يعني ياجهلة ( Game Over ) <<< يعني انتهت اللعبة ،،،<br />والأردن أولاً اسمو محفور في قلوبنا .. ورح نظل نردده ونحكية ونعيد ونزيد ونكرر فيه لحتى آخر نفس فينا .. والأردن أولااااااااااااً ..<br />ويحيا الأردن وكس أمك يافلسطين يابلد الشرموطات العاهرات الداعرات .. وكس أمكو ع أم الرئيس أبو مازن البهائي الواطي وهنية القواد اللي ماعندهمش أصل أو شرف .. اسمعو منيح هونه حنا ملكنا هاشمي .. مش مثل رئيسكو اللي أصلو مش عارف من وين أكيد جاي عن طريق الحرام وعن طريق علاقة جنسية غير مشروعة .. يعني إذا رئيسكو مش معروفلو أصل فما بالكو بإنتو .. يعني الشعب !!!<br />وكل فلسطيزي ابن داعره عاهره ابن مقطعه بلجيكي اخو بلجيكيه شرموطه .. كتب أي إشي عن الأردن _ بشكل عام _ بقلو ترى المراجل مش من تحت لتحت .. وتسب علي وعلى الاردنيين .. المراجل إنك تيجي بوجهي وتحكي كلامك وساعتها وشرفي لأكون مخلص عليك وماسحك عن الوجود .. ومخليك ملطشة الكل يصير يظرب فيك . وينيك بعرظ أختك وأمك .. وأنا محمد ابن نواف الشرارات وقدها وقدود ..<br />وإذا سألتوني شو أمنيتك ؟؟؟ لأقلكم نفسي ومناي .. وأمل وأمنيت حياتي .. إني أنهي وأقظي وأخلص على إشي اسمو فلسطين وكلاب فلسطين من خريطة العالم وأمسحهم مسح .. وأقظي عليهم قظاء مبرم هاي هيه أمنيتي وبسسسسسسسسسسسسسسسسسسسسسسسسسسسس وكس أمكو أولاً وآخراً يا أولاد الحرااااااااااااااااااااام ..<br />فلسطيزنا .. فلسطيزنا .. مدعوسة تحت طيازنا .. مش مره ولا مرتين ولا ثلاث ولا حتى أربعة ..<br />فلسطيزنا .. فلسطيزنا .. والكل يحكي فلس وقع تحت الطين .. ولقيناه في طياز أسيادنا الأردنيين ..<br />فلسطيزنا .. فلسطيزنا .. وما أدراك ماطيزنا .. طيزنا .. هي لكم يا أردنيين .. وأكساسنا كذلك ..<br />فلسطيزنا .. فلسطيزنا .. فلسطيزنا .. فلسطيزنا ... النشيد الوطني الفلسطيزي ..<br />واسمعوا يا فلسطيزية وآخر كلمه إلكو بدي أقلكو شغله وحده بس ..<br />إنو المراجل وشغل الزلمنة . وشوفة الحال وشد الحيل .. ونفخ الصدور .. وكل واحد عاملي حالو أبو عنتر ومش عارف شو ..<br />بكونش من ورا شاشة الكمبيوتر .. أو التطقيق ع الكيبورد .. اللي بدو يحكي إشي يجي ويتفظل ويحكي وجه بوجه .. كس أمكو شغل لقلقة وتجعير .. بس لما تصير الشغلة جد وحقيقة بتتخبو مثل البسس والقطط ياوسخين ياجرب يامعفنين يا شراااااااااااميييييييييططططططط.. الله يلعنكو واحد واحد .. قال شعب منضال قال .. بس بلااااااااااااااااش !!!<br />أردنيه مش بس بالجنسيه<br />أردنيه وفائنا للعائله الهاشميه<br />أردنيه قبل الميلادية والسنه الهجريه<br />أردنيه بتشميرنا عاليد والمناسف البلديه<br />أردنيه مش تاعين الكبسه والملوخيه<br />أردنيه وعلمنا معروف بالنجمه السباعيه<br />ورمزنا الشماغ الأحمر ومالنا فروع ثانيه ..\"مش مثل شماغكو .. هههههههههههه . شماغ حمير وحشية ( الشماغ الأبيض)<br />ويلا يلاااا يلاااااااااا على بلدكو ياشراميط ولاد الشراميط .. ولاتنسو تلمو عفنكو قرفكو ووسخكو وهبلكو وتسطيلكو معاكو .. ماشي .. ههههههههههههههههههههههههههههه<br />والأردن أولاً .. أولاًُ .. أولاً ..<br />وجيشنا جيش الوطن .. سمينا بإسم الله .. نحمي الوطن والعلم .. بعيون عبدالله ...<br />وبدي أشوف تعليقات الأردنيين النشامى ... اخزقوهم يانشامى الوطن .. ونيكو أعراظهم .. للي بلا شرف !!!"
