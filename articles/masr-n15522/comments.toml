subject = "نظيف يزور دمياط الثلاثاء القادم .. ويصدر قرار النق"
author = "مش كييف"
posted = "2008-05-01"
text = "نظيف يزور دمياط الثلاثاء القادم .. ويصدر قرار النقل رسمياً<br />دمياط: حلمي ياسين<br />قال مصدر في شركة أجريوم- رفض ذكر اسمه- إن أوامر صدرت أمس للعاملين في الشركة بدمياط بالاستعداد لنقل الشركة إلي العين السخنة.. وأضاف المصدر لـ«البديل»: الاستعدادات الأولية تجري بالفعل للانتقال إلي العين السخنة خلال ثلاثة أشهر..<br />وقال: صدرت أوامر بعد اجتماع رئيس الوزراء د. أحمد نظيف مع المدير العام لشركة أجريوم مايك ويلسون في القرية الذكية أمس الأول وأكد المصدر أن القرار الرسمي سيصدر للشركة يوم الثلاثاء القادم. وقالت مصادر في الشركة لـ«البديل» إن نظيف سيزور دمياط يوم الثلاثاء القادم، ومن المتوقع أن يعلن خلال الزيارة عن قرار وقف إنشاء المصنع. من جهة أخري بدأ مصنع موبكو في التشغيل التجريبي مساء أمس الأول.. وارتفعت أصوات الماكينات العالية، وسمعت في رأس البر والسنانية ودمياط الجديدة مع تصاعد أبخرة وأدخنة من المصنع بالإضافة إلي فرقعات ودخان كثيف ورائحة خانقة واستمر التشغيل التجريبي حتي الصباح الباكر. وقال عبدالرازق محمد عبدالرازق- المحامي- إن الأهالي سوف يتقدمون بشكوي وبلاغ اليوم إلي النائب العام ضد المصنع للتحقيق في هذه الجريمة التي تسبب أضراراً للمواطنين. وأضاف: سنرفع دعوي مستعجلة ضد نظيف والوزراء الذين أعطوا الموافقة للمصنع علي العمل<br />نقلا عن البديل"
archived = "2008-05-01"
capture_url = "https://web.archive.org/web/20080501153453/http://masr.20at.com:80/newArticle.php?sid=15522"
