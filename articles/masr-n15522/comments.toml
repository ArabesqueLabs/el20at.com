subject = "مبارك يستجيب لأهالي دمياط ويأمر بنقل مصنع \"أج"
author = "اصحا يا شريف يا دواخلي"
posted = "2008-05-01"
text = "مبارك يستجيب لأهالي دمياط ويأمر بنقل مصنع \"أجريوم\"<br />محيط – وكالات<br />الرئيس حسني مبارك<br />القاهرة : أعلن د. فتحي البرادعي محافظ دمياط أن الرئيس حسني مبارك أمر بنقل المشروع الكندي لإنتاج الأمونيا واليوريا \"أجريوم\" استجابة لمطلب الشعب الدمياطي، جاء ذلك بعد احتجاجات امتدت لأسابيع.<br />وذكرت صحيفة \"الجمهورية\" الرسمية المصرية أن البرادعي قال أمام الوقفة الصامتة التي شارك فيها أكثر من 10 آلاف مواطن دمياطي أمام ديوان عام المحافظة - : إن المشروع نقل إلي موقع جديد ربما يكون بالعين السخنة.<br />وأضاف المحافظ \"علي مسئوليتي الشخصية أعلن أن الرئيس حسني مبارك أمر بنقل المشروع استجابة لمطلب الشعب الدمياطي\".<br />\"توجيهات مبارك\"<br />وأكد المحافظ أن \"توجيهات الرئيس مبارك إلي د. أحمد نظيف رئيس الوزراء كانت قاطعة بضرورة موافقة أهالي دمياط علي المشروع قبل تنفيذه، وأمام الإجماع الشعبي علي رفض هذا المشروع الخطير كان لابد من نقله إلي موقع آخر\".<br />وتابع المحافظ قائلاً : الرئيس مبارك منحاز تماماً لجماهير الشعب ووصل إليه نبضها ورأيها فاستجاب للمواطنين لأنه لم يخذل أبناء شعبه أبدا.<br />أسلوب دمياطي متحضر<br />أطفال دمياط يرفضون تلوث مصنع اجريوم<br />وأضاف أن أسلوب الدمايطة المتحضر والراقي في الاعتراض علي المشروع الكندي كان مثار إعجاب وإشادة من كل أجهزة الدولة، داعياً المواطنين إلي الحفاظ علي هذا الانطباع والانصراف بهدوء وصمت.<br />وأكدت الهيئة البرلمانية لنواب دمياط في مجلسي الشعب والشوري خلال اجتماعها بالمحافظة أمس برئاسة سمير زاهر عضو مجلس الشوري التمسك بنقل المصنع من رأس البر لأن وجوده يدمر اقتصاد دمياط، والتقي المحافظ بأعضاء الهيئة البرلمانية وأبلغهم بقرار نقل المصنع، وبناء علي ذلك ألغي الجميع الوقفة الاحتجاجية.<br />السواد يعم المحافظة<br />وكان شهود عيان ذكروا أن آلاف من سكان محافظة دمياط رفعوا أمس الثلاثاء لافتات سوداء بأعداد كبيرة على البيوت والسيارات احتجاجا على إقامة مصنع \"أجريوم\" الكندي للسماد قرب مصيف رأس البر لتسببه في إحداث تلوث خطير للبيئة.<br />وقال الشهود إن المحتجين تظاهروا أمام ديوان عام المحافظة اليوم, مطالبين بوقف إنشاء المصنع.<br />استغلال الشركة للموقع<br />وتقول المصادر إن شركة \"أجريوم\" الكندية ستملك أغلب أسهم المشروع الذي يبعد عن مدينة دمياط عاصمة المحافظة حوالي ستة كيلومترات كما تبعد عن مصيف رأس البر القريب حوالي ثلاثة كيلومترات.<br />ويقول الخبراء إن المصنع تقرر إنشاءه في تلك المنطقة تحديداً للاستفادة من ميزات قرب الموقع من ميناء دمياط ومصانع لتسييل الغاز الطبيعي ومياه نهر النيل. ورفع المحتجين والأهالي لافتات سوداء كتب عليها عبارات \"لا لدمار الإنسان الدمياطي\" و\"لا لمصانع الموت\".<br />تلوث بيئي<br />ومنذ أسابيع ينظم سكان محافظة دمياط حملة لوقف بناء المصنع، مؤكدين أن الأبخرة والعوادم الناتجة عن تشغيل المصنع ستمثل خطراً على الصحة والبيئة في المنطقة. وكان الرئيس حسني مبارك تدخل في النقاش على اعتراضات سكان المنطقة مع عدد من مسئولي الحكومة وطلب منهم بحث الاعتراضات.<br />ويوجد في نفس المنطقة الصناعية أيضاً مصنع سماد حكومي، يستعد أهالي المحافظة لحملة احتجاج لنقله أيضا إذا نجحت حملتهم الحالية."
