subject = "المعاصي ممنوعة في رمضان وفي غير رمضان"
author = "مش لازم"
posted = "2008-09-09"
text = "الممنوع في رمضان على وجه الخصوص الاكل والشرب والجماع هذا هو الممنوع في رمضان او الذي اختص شهر رمضان بمنعها<br />1) الاكل والشرب<br />2) الجماع<br />لكن الذنوب والمعاصي ممنوعة طوال شهور السنه<br />الكبائر<br />للامام شمس الدين الذهبى<br />1. الشرك بالله<br />2. السحر<br />3. قتل النفس التي حرم الله إلا بالحق.<br />4. أكل الربا.<br />5. أكل مال اليتيم.<br />6. التولي يوم الزحف.<br />7. قذف المحصنات.<br />8. عقوق الوالدين.<br />9. قول الزور .<br />10. منع الزكاة<br />11. إفطار يوم في رمضان.<br />12. ترك الحج مع المقدرة عليه.<br />13. الكذب على الله عز وجل أو على رسوله صلى الله عليه وسلم<br />14. اللواط أو إتيان المرأة في الدبر<br />15. الزنا<br />16. هجر الأقارب وتقطيع الأرحام<br />17. غش الإمام للرعية وظلمه لهم<br />18. الكبر والفخر والعجب والتيه<br />19. شرب الخمر<br />20. القمار والميسر<br />21. السرقة<br />22. قطع الطريق<br />23. اليمين الغموس<br />24. المكس<br />25. أكل الحرام وتناوله على أي وجه كان<br />26. الانتحار<br />27. الكذب<br />28. الظلم<br />29. القاضي السوء<br />30. الطعن في الأنساب<br />31. الحكم بغير ما أنزل الله<br />32. أخذ الرشوة على الحكم<br />33. المحلل والمحلل له<br />34. الديوث المستحسن الخبث على أهله<br />35. تشبه النساء بالرجال وتشبه الرجال بالنساء<br />36. عدم التنزه من البول<br />37. وسم الدابة في الوجه<br />38. التعلم للدنيا وكتمان العلم<br />39. الخيانة<br />40. المنان<br />41. التكذيب بالقدر<br />42. المتسمع على الناس ما يسرونه<br />43. النميمة<br />44. اللعن<br />45. الغدر وعدم الوفاء بالعهد<br />46. نشوز المرأة على زوجها<br />47. تصوير ذوات الارواح<br />48. اللطم و النياحة و شق الثوب و حلق الرأس ونتفه والدعاء بالويل والثبور عند المصيبة<br />49. البغي<br />50. الاستطالة على الضعيف والمملوك والجارية والزوجة والدابة<br />51. أذى الجار<br />52. أذى المسلمين وشتمهم<br />53. أسبال الإزار أوالثوب<br />54. الكل والشرب في آنية الذهب والفضة<br />55. لبس الرجال للحرير والذهب<br />56. إباق العبد<br />57. من ادعى إلى غير أبيه وهو يعلم<br />58. الجدل و المراء واللدد<br />59. منع فضل الماء<br />60. نقص الكيل و الميزان<br />61. الأمن من مكر الله<br />62. اليأس من روح الله تعالى ، والقنوط من رحمته<br />63. أكل الميتة والدم ولحم الخنزير<br />64. تارك صلاة الجمعة و الجماعة فيصلي وحده من غير عذر<br />65. المكر والخديعة<br />66. من تجسس على المسلمين ودل على عوراتهم<br />67. سب أحد من الصحابة رضوان الله عليهم<br />68. الفجور عند الخصومة<br />69. تغيير منار الأرض<br />70. من سن سنة سيئة أو دعا إلى ضلالة<br />71. من أشار إلى أخيه بحديدة أو سلاح أو نحوه<br />72. الواصلة شعرها والنامصة و المتنمصة والمتفلجة والواشمة<br />73. الإحاد في الحرم<br />74. تكفير المسلم<br />75. المحرمات<br />76. من حال دون القصاص<br />77. نباش القبور<br />78. من مثل بالحيوان<br />79. الجواظ والجعظري<br />80. التحاليل على شرع الله<br />81. ضرب الناس وتعذيبهم بغير حق<br />82. التسخط وعدم الرضا عند البلاء<br />83. لبس القصير والضيق والشفاف من الثياب للنساء أمام الأجانب عنهن<br />84. من أعان على خصومة بظلم<br />85. التماس رضا الناس بسخط الله تعالى<br />86. إغضاب الإخوة في الله من الصالحين بغير حق<br />87. من زعم أنه ملك الأملاك<br />88. الكلام بما يسخط الله ـ تبارك و تعالى ـ:<br />89. الخلوة بالمرأة الأجنبية ، وخلوة المرأة بالرجل الأجنبي<br />90. مصافحة المرأة الأجنبية<br />91. سفر المرأة بغير محرم<br />92. سماع المعازف والموسيقى<br />93. إضاعة المال<br />94. جحود فضل الله ، ومنع حق الفقير في المال<br />95. مجالسة المبتدعة و أهل الأهوال<br />96. إتيان الزوجة وهي حائض<br />97. خروج المرأة ومرورها على الرجال وهي متطيبة متعطرة<br />98. أخذ الهدية على الشفاعة<br />99. عدم إيفاء الأجير أجره<br />100. سؤال الناس من غير حاجة<br />101. المماطلة وعدم تسديد الدين<br />102. الغيبة<br />103. صبغ الشعر وتغيير الشيب بالسواد<br />104. المضارة في الوصية وعدم العدل في العطية بين الأولاد<br />105. عدم العدل بين الزوجات<br />106. تعمد الرجل النظر إلى المرأة الأجنبية وتعمد المرأة النظر إلى الرجل الأجنبي<br />107. المشي على القبور والجلوس عليها<br />108. كفران نعمة الزوج<br />109. تأخير الصلاة عن وقتها بغير عذر<br />110. ترك الطمأنينة في الركوع والسجود أو غيره من أعمال الصلاة<br />111. مسابقة الإمام<br />112. كثرة الحركة في الصلاة لغير حاجة<br />113. الذهاب إلى المسجد لمن أكل بصلا أو ثوما أو ماله رائحة كريهة<br />114. هجر المسلم فوق ثلاثة أيام دون سبب شرعي<br />115. بيع الحر وأكل ثمنه<br />116. التسبب في لعن الوالدين<br />117. التنابز بالألقاب المكروهة عند من لقب بها<br />118. الدخول على الظلمة بغير قصد صحيح بل إعانة لهم على ظلمهم أو توقيرا و محبة<br />119. القول في القرآن وتفسيره بغير علم ،و الجدال و المراء فيه<br />120. المرور بين يدي المصلي<br />121. من أحب أن يقوم له الناس<br />122. اتخاذ أو بناء المساجد على القبور<br />123. قال الله تبارك وتعالى:sad:حرمت عليكم الميتة والدم و لحم الخنزير وما أهل لغير الله به والمنخنقة والموقوذة والمتردية والنطيحة وماأكل السبع إلا ما ذكيتم وماذبح علىالنصب وأن تستقسموا بالأزلام)<br />124. معاداة أولياء الله<br />125. النوم على البطن<br />126. أن يستر الله عليه ذنبا فيصبح يذكره عند غيره<br />127. أن يقول ((مطرنا بنوء كذا أو بنجم كذا))<br />128. أن يؤم قوما يكرهون إمامته لعيب شرعي فيه<br />129. الاطلاع على بيوت الناس دون إذن.<br />130. الكذب في الرؤيا<br />131. بيع النجش<br />132. إخفاء عيوب السلعة عن المشتري<br />133. اللعب بالنرد<br />134. أن يتناجى اثنان دون الثالث..<br />135. ابتداء الكافر بالسلام<br />136. البزاق في المسجد<br />137. ترك الرمي ونسيانه بعد تعلمه<br />138. التفريق بين الجارية وو لدها الصغير بالبيع ونحوه.<br />139. قطع شيء من أشجار حرم مكة المكرمة أو تنفير صيده أو أخذ لقطته<br />140. الخروج من المسجد بعد الأذان قاصدا أن يصلي وحده لغير عذر.<br />141. صيام يوم الشك<br />142. قضاء الحاجة على طريق المسلمين أو في ظلهم أو مواردهم<br />143. حبس الحيوان حتى يموت عمدا ،جوعا أو عطشا<br />144. ترك الأمر بالمعروف والنهي عن المنكر<br />145. تصريف السلعة بالحلف الكاذب<br />146. السخرية والاستهزاء بالمسلم<br />147. ذو الوجهين<br />148. نشر أسرار الاستمتاع من أحد الزوجين<br />149. سؤال المرأة زوجها الطلاق من غير بأس<br />150. الظهار<br />151. جماع المرأة الحامل من السبايا قبل الوضع<br />152. من خبب امرأة على زوجها ،أو مملوكا على سيده<br />153. نكث بيعة الإمام لفوات غرض دنيوي<br />154. التظاهر بالصلاح و التقوى في الملأ وانتهاك المحارم في الخلوة<br />155. اتخاذ الخيل وربطها فخرا و تكبرا ورياء<br />156. الجلوس على مائدة فيها محرم كالخمر أو القمار أو أي نوع من المحرمات<br />157. دعوى الإنسان على غيره بما يعلم أنه ليس له<br />158. الدخول إلى الحمامات العامة بغير إزار أو إدخال حليلته إليها<br />159. إيذاء المصليين برفع الصوت بقراءة القرآن أو بالكلام في المسجد<br />160. حداد المرأة أكثر من ثلاثة أيام على ميت إلا على الزوج<br />161. بيع أو شراء أو أكل ثمن أي شيء حرمه الله تعالى<br />162. أكل كل ذي ناب من السباع و كل ذي مخلب من الطير<br />163. أكل لحوم الحمر الأهلية<br />164. زواج المتعة<br />165. نكاح الشغار<br />166. الجمع بين المرأة و عمتها و خالتها<br />167. صيام يوم عيد الفطر أو يوم عيد الأضحى<br />168. رفع البصر إلى السماء عند الدعاء في الصلاة<br />169. التفاخر بالأحساب و الأنساب<br />170. الصلاة إلى القبور<br />171. بيع الثمار قبل أن يبدو صلاحها، و تأمن العاهة<br />172. أخذ ثمن الكلب أو المهر البغي , أو حلوان الكاهن<br />173. صلاة النافلة أو دفن الموتى في أوقات التحريم<br />174. بعض أنواع البيوع المحرمة: سلف وبيع و شرطان في بيع<br />175. المطالبة باسترجاع الهبة أو العطية<br />176. صيام الزوجة تطوعا وزوجهــــــــــــا حاضر أو تدخل في بيته أحدا إلا بإذنه<br />177. طلب المرأة طلاق أختها لتنفرد بالزواج<br />178. التشبيه بالكفار<br />179. تضليل الأعمى عن الطريق الذي يريده<br />180. الوقوع على البهيمة<br />181. لبس ثوب شهرة<br />182. أن يبيع على بيع أخيه أو يخطب على خطبته<br />183. قطع شجر المدينة أو تنفير صيد أو الإحداث فيها<br />184. الوطء أثناء العدة<br />185. إثارة النعرة والدعوى الجاهلية<br />186. ما يحرم على المتوفي عنها زوجها حتى تنتهي عدتها<br />187. التحاسد التناجش والتباغض و التدابر<br />188. ما يحرم على المحرم ـ في حج أو عمرة ـ لبسه<br />189. التداوي بمحرم<br />190. قتال المسلمين بعضهم بعضا ومحاسبة السخص بخطأ غيره<br />191. وفاء النذر في معصية الله<br />192. نظر الرجل إلى عورة الرجل ،و لا المرأة إلى عورة المرأة<br />193. عقد نكاح المحرم أو خطبته<br />194. الأكل بالشمال ، واشتمال الصماء ، والاحتباء في ثوب واحد يكشف عن فرجه<br />195. بيع الذهب بالذهب أو الفضة بالفضة بزيادة أحدهما (أي مع التفاضل)<br />196. بيع الذهب بالورق (الفضة)نسيئة<br />197. قتل المحرم للصيد<br />198. عضل المرأة أو إكراهها بعد موت زوجها على الزواج من أحد أقاربه<br />199. الزواج من زوجة الأب بعده<br />دا بخلاف المنهيات"
