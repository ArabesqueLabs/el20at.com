text = "فطريقك يا ولدى كلة محظور<br />وسنينك سوداء<br />والغلاء بيطحن فى الناس<br />صحيح الغلاء ظاهرة عالمية وهى ظاهرة صحية ولكن المرتبات فى مصر هى المشكلة يعنى كدة مفيش مرتبات<br />تشتغل على قد الكفاف<br />وان اتكلمت والا تظاهرت زى بتوع المحلة يبقى عايز تقلب نظام الحكم<br />طيب ما ينقلب والا يروح فى ستين داهية<br />نظام الخلافة هينقلب - كل واحد هيقول كلب وراح"
