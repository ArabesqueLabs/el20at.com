[[comments]]
order = 3
subject = "أجره من وزارة الصحة يتراوح بين 250 و 300 جنيها، وم"
author = "مش كاتب"
posted = "2008-03-28"
text = "أجره من وزارة الصحة يتراوح بين 250 و 300 جنيها، ومقابل النوباتجيات - السهر- 640 قرشا عن اليوم الواحد، وبدل عدوى 8 جنيهات في الشهر..<br />يعني نحسب الحسبه نقول المرتب تلتميت جنيه<br />وبعدين 640 نقول بيسهر10 ايام في الشهر يعني اربعه وستين جنيه و8 جنيه يبقى 72 جنيه يبقى المجموع 374 جنيه<br />واحد دكتور في مستشفى ابوه صرف عليه دم قلبه وفي الاخر الدولة بتديله مبلغ تافه<br />طيب دا عم فرج اللي بيضرب عندنا حقن في حلوان سالته مرة يا عم فرج انت بتكسب اد ايه في الشهر من ضرب الحقن قالي كل يوم بكسب 30 جنيه يعني في الشهر 900 جنيه ودا بس بعد الظهر لان عم فرج موظف صباحا<br />يعني ضريب الحقن بيكسب اكتر من الدكتور<br />يا اخ محمد السيد يبقى انت اكيد في مصر<br />هو انت محمد السيد بتاع مدونة مش حاسكت ولا واحد تاني"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174904/http://masr.20at.com:80/newArticle.php?sid=14895"
