subject = "انا الحقير بكل داء مبتلى، انا الكريه كليم جن العبق"
posted = "2008-03-27"
text = "انا الحقير بكل داء مبتلى، انا الكريه كليم جن العبقر. صعلوك قوم في سفاهة سيد، بلسان افعى عشيق رد المنكر. كل السواد و الانحطاط انا جامعه، كل السفالة و الوضاعة بمئزري. سفر القذارة يرقب .. كفايه كده"
