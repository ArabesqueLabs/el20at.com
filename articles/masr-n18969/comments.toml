subject = "تحقيقصحفى اكثر من رائع وكلة بالمستندات"
author = "احمدابوصالح"
text = "بصراحة تخقيق هايل وكلة بالصور والمستندات بجد ياريت تكون كل التحقيقات الصحفية بهذا الاسلوب ...بدل من التحقيات البدون مستندات ولاصور ولا يحزنون ... بجد عجبنى جداا هذا التحقيق لانة مستوفى كل الشروط ...تحية حاصة لكاتب هذا التخقيق الصحفى الرائع"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235627/http://masr.20at.com:80/newArticle.php?sid=18969"

