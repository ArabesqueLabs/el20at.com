[[comments]]
order = 0
subject = "ويبقى شعاع الأمل"
author = "مش لازم"
posted = "2008-11-27"
text = "أجيال ورا أجيال ... حتعيش على حلمنا<br />واللي نقوله اليوم ... محسوب على عمرنا<br />جايز ظلام الليل ... يبعدنا يوم إنما<br />يقدر شعاع النور ... يوصل لأبعد سما<br />ده حلــمنا ... طول عــمرنا<br />حضن يضمنا ... كلنا كلنـا<br />الحلم ما هو مستحيل ... مادام تحقيقه مباح<br />والليل لو صار طويل ... أكيد من بعده صباح<br />قول انت بكل ما فيك ... إن كان لك وإلا عليك<br />حــاول جـرّب وبتـوصـل ... شرف التجربة يكفيك<br />عرف زمانك من تكون ... ارضى طموحك اجتهد<br />افتح لمرآتك عيون ... يبصر بها من جاء بعد<br />اتحدى الكون وتمرد ... واتعلم تبقى جريء<br />مشـوار الألـف ميــل ... خـطـوة تبـدأ بـطـريق<br />محتاج العدل القوة ... علشان تقدر تحميه<br />ولعمري بكلمة وشكوى ... حقي بيرجع أراضيه<br />والحب اللي نارو شرارة ... وعيون مليان بشارة<br />بيعيد تكوين العالم ... أطفال بيدها حجارة<br />من أي مكان في الأرض ... ناطق بلسان الضاد<br />وبأعلى الصوت والنبض ... بنقول الوحدة ميلاد<br />أطفالنا بكل مكان ... ضيء عيون الأوطان<br />الحــق .. الحـــب .. الخيــر<br />رسالتنا بكل زمان<br />ومعانا غنوا وقولوا ... الفن ذا طوق ونجاة<br />من الحزن بنخلق فرحة ... من حرف طريق وحياة<br />كلمة صدق أغنية ... تتقال وتعدي بثانية<br />جايز من بعد سنين ... تتغير بها الدنيا<br />خلي الأماني حقيقة ... واحسب لوقتك حساب<br />كل الدروب الغليقة ... يفتح لها الحب باب<br />والغنوة بتلغي حدود ... ووطنها هو القلب<br />ومادام عايشين حـ نغني ... وما دام قادرين حـ نحب<br />والحب ما هو بالكلمة ... بالفعل وبالإحساس<br />كون ضي بسمة ونجمة ... ودليل في طريق الناس<br />حلمنا وفي كل زمان ... وحدة كل الأوطان<br />كل الخلافات حـ تزول ... وكفاية إنك إنسان<br />فنك وطنك في الغربة ... من وين ما تخطي دليل<br />غني للناس والصحبة ... حـ تلاقي الكون جميل<br />بلغات العالم حبُّ ... واختصروا سنين بثواني<br />قدر العصفور طيرانه ... وقدرنا نغني أغاني<br />الشجرة وكانت بذرة ... والقصة وكانت فكرة<br />ومادام بنحب ونحلم ... راح نوصل سكة بكره<br />نتمنـــى الحـلـم يكـون ... ونغـير آيــة سـكــون<br />مـا كثـير الحـق بيسـطـع ... ويقـولـوا علـيه جـنـون<br />ويبقى شعاع الأمل"
archived = "2010-03-14"
capture_url = ""

