[[comments]]
order = 7
subject = "هي دي الصحافة"
author = "جدو حبيبة"
text = "الموضوع أكثر من رائع : عمق في التناول وغزارة في المعلمومات وشمولية و بُعد نظر في التناول وفي التناول ومعايشة لشيللجانب الكبير المهمل من أولا البلد وهي دي صحافة أولاد البلد والمطلوب يابيبو يابو حبيبة مواصلة المسيرة على نفس النهج وعيش مشاكل ولاد البلد بعمق واطرح لها حلول وربنا معاك ويوفقك وينفع بيك وطنك ودينك وربنا يرزقك بعضو مجلس شعب من ولاد البلد يتبنى الموضوع رسميا علشان يكون فيه حل ملموس وكمان ياريت تواصل المسيرة لتغطية بقية أبعاد القضية ويكون ملف متكامل عن الصحة والاطباء ومعاناتهم وسلملي على حبيبة جدها"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235627/http://masr.20at.com:80/newArticle.php?sid=18969"

[[comments]]
order = 8
subject = "موضوع جديد عن الغلابة"
author = "صفاء صالح"
text = "الموضوع رائع طبعا بداية من اخنياره وحنى خطوات تنفيذه<br />بس عارف اخلة حاجة فيه ايه؟\\\\\\\\<br />انه بيتكلم عن الناس الغلابة المطحونين اللي مش لاقين حد يشتكوا ليه<br />عالعموم هوا تحقيق استقصائي رائع يا حضرة المحقق النشيط جدا"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235627/http://masr.20at.com:80/newArticle.php?sid=18969"

[[comments]]
order = 9
subject = "الله عليك يا خباب.. أستاااااذ كالعادة"
author = "أميمة الشاذلي"
text = "حقاً لا يمكنني أن أمنع نفسي من شدة الاعجاب بهذا التحقيق الرائع<br />مش بس عشان المعلومات الدقيقة اللي فيه.. لا وكمان الصور والفيديو والتسجيل اللي يخلي العمل ده من كامل متكامل من مجاميعه. بجد تحقيق رائع أرجو أن نسمع له صدى في الجهات المسئولة.. يعني في وزارة الصحة.. يا ليتنا كدة نكشف الفساد اللي في البلد عشان لو كلنا ما عملناش زي خباب مش هنعرف نصلح بلدنا<br />بداية العلاج الاعتراف بأنك مريض<br />وفقك الله يا خباب.. وفي انتظار تحقيقاتك التي اعتدنا على روعتها..<br />وبصراحة مش لاقية دليل على كلامي اكتر من تعليقات الناس على تحقيقك..<br />اللهم غير ما بنا الى ما تحب وترضى"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235627/http://masr.20at.com:80/newArticle.php?sid=18969"

