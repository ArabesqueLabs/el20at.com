text = "طبعا انا عارفه انت تعبت اد ايه ولكن ان الله لا يضيع اجر من احسن عملا وبجد الصور علت الموضوع اوى وقويته جدا تسلم ايدك وربنا يكرمك<br />البت سوسا بتقولك مجهود رائع وهتعلقلك فى البيت لما تروح"
