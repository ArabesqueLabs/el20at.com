text = "دائما كبير يا خباب وعملك كبير وكبير.. يعجز اللسان عن التعليق فالعمل المعروض تحقيق يستحق الإشادة ويعبر في ذات الوقت عن تميز قل نظيره.. هنيئا لإم حبيبة بأبو الحبيبة..<br />زميلك تامر الصمادي من الأردن"
