[[comments]]
order = 2
subject = "وزير الصحة رجل الاعمال مشغول بمستشفياتة الخاصة ال"
author = "مواطن"
posted = "2008-12-25"
text = "انت بتتكلم على الوحدات الصحية دلوقتى بس - دى ماتت من زمان قوى - ما هى تبع حكومة الحزب الوطنى<br />احنا بنعتمد على عيادات الجمعيات الشرعية الملحقة بالمساجد وبندفع فى الكشف ما بين جنيهين وخمسة جنيهات - يعنى ارخص واحسن من الوحدات الصحية والاخوة النصارى عندهم عيادات فى الكنيسة<br />بالنسبة للشعب والناس الغلابة وزير الصحة او وزارة الصحة مالهاش لزمة<br />ولا الحكومة كلها لها لزمة وممكن يروحوا يقعدوا فى بيوتهم والناس هتدبر حالها والبركة فى الاخوان<br />سيادة رئيس الوزراء بيتحرك فى شوارع القاهرة بموكب عشرين سيارة bmw ثمن السيارة الواحدة مليون جنية ومعاة ما يسمى تشريفة من لواءات وعمداء وضباط شرطة وموتسيكلات وكانة يتحرك فى تورا بورا او ولاية هلمند فى افغانستان وليس فى شوارع القاهرة اللى الناس ماشية فى الشوارع مبنجة من الجوع او من الفول<br />بعد تدخل الجيش والشرطة ووزارات الدولة ولمدة سنة تقريبا اذا لم تحصل على رغيف الخبز قبل العاشرة صباحا فلن تراة الا صباح اليوم التالى<br />وحدات صحية<br />ضحكتنى يا راجل<br />دا لو الدكتور موجود بيقول للولية الفلاحة روحى اشترى الحقنة واشترى القطن والشاش علشان نغير على جرح ابنك ونديلة حقنة المضاد الحيوى<br />يا حلاوة<br />دكتور الوحدة الصحية واخد غرفتين فى القرية ولما واحد بيروح لة الوحدة فى الصباح بيقول لة ابقى عدى على اخر النهار فى العيادة<br />عزيزى مفيش دولة<br />بح خلاص<br />مفيش احد بيحاسب احد<br />كلة انهار من زمان من بعد موت السادات"
archived = "2009-01-01"
capture_url = "https://web.archive.org/web/20090101235627/http://masr.20at.com:80/newArticle.php?sid=18969"

