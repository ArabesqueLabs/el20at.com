text = "بالفعل شيء بيستحق انو يتقدر وفكرة بتمنحنا كثييييييييييير من الامل بالنجاح ويا ريت انو كلنا نحط ايد بايد وندعم هالفكرة لاطول زمن ممكن بنشكر الاخ عبودة عبود واللي ساهمو بهالفكرة وطوروها وبنشكر شركة ماسة للدعاية والاعلان وشركة جوال ووزيرة السياحة والاثار على دعمهم للفكرة بشكل فعال ومشكورين"
