subject = "شكر لشركة ماسة للدعاية والاعلان"
author = "التوأم رحاب ونائلة"
posted = "2009-03-22"
text = "بسم الله الرحمن الرحيم<br />يعيطكم الف عافية , للنجاحات أناس يقدرون معناه ، وللإبداع أناس يحصدونه ، لذا نقدّر جهودكم المضنية ، فأنتم أهل للشكر والتقدير ..فوجب علينا تقديركم ...فلكم منا كل الثناء والتقدير .<br />بخص بالذكر شركة ماسة والمدير حسام الخليلي , والفنان عبودة عبيد والفنان علاء رضى والفنان احمد خليل , على ما بذلوه من جهد وعطاء لانجاح هذا المهرجان الرائع .<br />تحياتنا لكم التوام المشاركين في المهرجان رحاب ونائلة اشتية"
