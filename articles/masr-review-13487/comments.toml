text = "[quote name=\"افكار اقتصادية\"]انتو عارفين ان الحل الوحيد للثراء في مصر هو استهبال الشعب<br />عايز تعمل مليون جنيه<br />تقسمهم على مليون واحد اهبل من شعب مصر وكل واحد يدفع جنيه<br />باختصار<br />صاحب الكتاب دا لو كان سماله اسم ما كنش حد حيشتريه الا قليل<br />لكن جتله فكره جهنميه انه يكتب على الكتاب كتاب مالوش اسم<br />وهو دا سر ان الطبعة الاولى نفذت بعد اسبوعين<br />[/quote]<br />هو انا معاك ان اسم الكتاب جاذب جدا وينفع للتسويق.. لكن ليه تفترض ان الكاتب سماه كده عشان الفلوس ومش علشان هو فعلا قرر يسميه كده؟؟.. على فكرة الرجل أول حاجة قالها في الكتاب هي تفسيره لذلك الاسم.. ولو حضرتك الكتاب كله لآخره هتعرف انه يستحق الاسم ده، لأنه بيتكلم في كل حاجة وفي مواضيع كتيرة ومختلفة... حتى لو في ناس كتير بتنصب. إلى أننا لازم نفترض حسن النية برضه<br />وعامة حتى لو الرجل فعلا عمل كده عن قصد بغرض انه يبيع الكتاب فأحب أطمنك.. الكتاب مش كلام فارغ ولا حاجة... ده جميل جدا ورائع وأفيد مليون مرة من 22 عدد من جريدة الأهرام اللي الشعب كله بيشتريها عشان ياكل عليها أو يلف فيها سندوتشات فول"
