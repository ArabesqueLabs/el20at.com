text = "هو احنا ليه بقينا الطبيعى بتاعنا اننا نقل ادبنا ع الناس ونهاجم وخلاص<br />كل واحد ودماغه... الراجل عمل كتاب عشان عايز يقول حاجة ..<br />هو حر..<br />سعادتك عاوز تسمعها؟؟ ادفع 22 جنيه<br />مش عاوز... يبقى براحتك ماتدفعش ال22 جنيه..<br />هو مامدش ايده ف جيبك وسرق ال22 جنيه اللى خلاص جم وتعبوكم اوى...<br />على فكرة انا معرفش الراجل دة عشان فذلكة الشعب المصرى محفوظة,يقولك بس.. دى تبع الكاتب و اوعى ..فجأة يطلع عارف كل حاجة.. وانه قدامه البلورة المسحورة وفاهم كل حاجة وعارف نوايا الناس.. والمصيبة ان هو نفسه مش عارف هو عايز ايه؟؟<br />م الآخر يا مصريين ياريت نرجع محترمين, كل واحد يقول اللى هو عايزه بدون مايغلط ف حد ولا يعمل فيها عم بشندى وانه عارف نوايا الخلق كلهم..<br />علم الغيب عند الله وربنا بس اللى بيحاسب بالنيات.."
