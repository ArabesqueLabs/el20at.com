text = "سبحان الله, والله أكبر والحمد لله..<br />ايه يعني لما ندخل كلنا الجنة هو مضايق ليه. اه ان شاء الله كلنا هندخل الجنة والحمد لله ان الجنة دي مش بتاعته وبتاعت ربنا.. في ناس كدة تحس انها رخمة لاهوة عاوز يلتزم بالدين ولاهوة عاوز غيره يلتزم بالدين.<br />دة مش خداع بصر, دي هداية من ربنا والحمد لله وخير كبير مكانش علي ايام مرفت امين ولا حسين فهمي ايام ما امي وامك كانوا لبسين ميني جيب. دلوقتي الحمد لله ربنا هددي امي الدور بئة علي امك."
