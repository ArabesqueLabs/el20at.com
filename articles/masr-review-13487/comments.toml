author = "افكار اقتصادية"
posted = "2009-09-22"
text = "انتو عارفين ان الحل الوحيد للثراء في مصر هو استهبال الشعب<br />عايز تعمل مليون جنيه<br />تقسمهم على مليون واحد اهبل من شعب مصر وكل واحد يدفع جنيه<br />باختصار<br />صاحب الكتاب دا لو كان سماله اسم ما كنش حد حيشتريه الا قليل<br />لكن جتله فكره جهنميه انه يكتب على الكتاب كتاب مالوش اسم<br />وهو دا سر ان الطبعة الاولى نفذت بعد اسبوعين<br />الناس الهبل لما لقوا الكتاب مكتوب عليه بدون اسم نزلوا شري فيه<br />وتلاقي شوية كلام فارغ اللي جوا الكتاب<br />مبروك يا احمد العسيلي<br />يعني هي جت عليك<br />ما منى ذكي واحمد حلمي بياخدوا في الفيلم 5 مليون جنيه<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />مش احمد الهواري ولا عبدالله الطحاوي"
archived = "2009-09-25"
capture_url = "https://web.archive.org/web/20090925165528/http://www.20at.com:80/masr/review/13487-2009-09-17-13-04-03.html"

