text = "انا شايفة ان البنت لازم ما تتسرعش فى الجواز ولازم تفكر كويس علشان انا من وجهة نظرى البنت من غير جواز احسن من جواز وتعب اعصاب وتعيش مع حد بالعافية او تطلق وده بينعكس على الاطفال ونفسيتهم بيطلعوا معقدين حررررام بجد وبعدين ايه لقب عانس دى ده لقب سازج"
