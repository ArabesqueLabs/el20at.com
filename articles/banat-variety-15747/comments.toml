text = "اذا البنات فكرت بالمنطق ( مطلقة احسن من عانس) يبقى محدش يطلب من العريس مطالب كثيرة مدام انتوا نوين على الطلاق لان على كلام الدكتور بيقي همهم الجواز وبس والهروب من عدم الجواز ومش يبقى تفكيرهم فى تكوين اسرة وكده يبقي السلام ,,, وطبعا انا ضد التفكير ده لان يا اما اتجوز انسان ابنى انا هو بيت واسرة كويسة يا اما افضل فى بيت اهلى بكرامتى … وده راي"
