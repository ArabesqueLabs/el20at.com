[[comments]]
order = 0
subject = "وتغرق السفينة مصر"
author = "موجوع"
posted = "2008-01-08"
text = "يا بلدنا يا قلة العطشان<br />يا ضلة الحران<br />وبقية الاغنية التى كانت تذاع با استمرار<br />لية الحرامية حولوها الى سفينة تغرق والكل بينط منها فى وسط الامواج ليموت<br />لان المسئول او القبطان بتاع السفينة فى اجازة مستمرة فى المصيف وبيدلع فى الشرم وسايب كل حاجة تخبط تقلب والسفينة تنشال وتنهبد فى وسط الامواج بدون اى قيادة<br />العيال بيموتوا فى البحر زى الفيران التى تهرب من سفينة تغرق<br />والحرامية مبسوطين ويقابلوا بعض كل يوم الصبح وبدل ما يقولوا صباح الخير بيقولوا هنبيع اية من البلد النهاردة"
archived = "2010-03-14"
