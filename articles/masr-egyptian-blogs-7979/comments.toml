[[comments]]
order = 4
subject = "بلادي لم تتغير"
author = "ٍSB"
posted = "2008-01-27"
text = "بلادي لم تتغير ولكن شعبها هو الذي تغير (إن الله لا يغير مابقوم حتى يغيروا مابأنفسهم) لو حاول كل شخص في بلادي تغيير نفسه وصلاحها لو حاول كل شخص تغير مايقوم به من أعمال مشينة لأعمال خير لتغيرت البلد واصبحت جميلة لو لم تلقي القاذورات في الشارع وتحافظ على منزلك فقط لأصبحت البلد نظيفة - لكن الكثير منا لا يحاول ولا يجتهد لرفعة مصر هل حاول الأباء تربية أبنائهم على الوجه الصحيح - هل ابتعد المواطن عن رشوة الموظف الصغير الذي يأخذ الرشوة وغبر آباه بما يحدث لحاجته إلى المادة - كل منهم ليس له عذر فالراشي والمرتشي في النار - فلو حاول كل شخص انقاذ نفسه من الهلاك لأصبحت مصر كما نريد - يارب احفظ مصر وأهلها ولا تكلنا إلى من لا يرحمنا يارب"
archived = "2010-03-14"
capture_url = ""
