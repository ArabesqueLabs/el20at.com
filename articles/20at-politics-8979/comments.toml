text = "شكرا على هالموضوع الواقعي فعلا<br />انا بصراحة طالبة وبستنا رحلة المدرسة من سنة متل كل طلاب العالم<br />كان نفسي نروح على البحر لانو ماعمرنا دخلنا ولا شفنا او على رام الله لحتى نروح على مدينة الملاهي<br />هاد الشي الي بنطمح الو ما حنقول على حيفا ولا القدس ولا حتى قلقيلية خلينا واقعين شوي!!<br />يعنى كل اليوم رح يروح على الحواجز والطرق المسكرة ورح يرجعونااااا<br />لهيك رحنا ابل شي اسبوعين على منتزه بقرية من قرى مدينتي ونحنا بجنوب الضفة يعنى صعبب نروح على الشمال مع اني بتمنا<br />روحنا على 12 ونص الضهر<br />بالله عليكو هاي رحلة؟؟؟؟؟؟<br />بس والله انبسطنا وحسينا بفرحة انو طلعنا من المدرسة شوي وشفنا الجبال والشجر والطرق وتعرفنا على كم من اكلة...<br />هاي حياتنا<br />ولا زم نعيشها رغم انف الحاقدين<br />وحسبي الله ونعم الوكيل الي حارمينا كلشي بهالدنيا وحابسينا كاننا بسجن<br />وبنشوف بلادنا وبنتعرف عليها على الخريطة بشوف انو في عنا بحر ونهر ومناطق كتير حلوة على الخريطة<br />عى فكرة خريطة فلسطين فيها كللللللللل الالوان فيها الجبل وفبها السهل والهضاب في البحر والصحراا فيها كلشي<br />وحتضل بلادي احلى بلاد<br />وحيجي يوم الي اشوف في كللللل مكان واروح على كل شي نفسي اشوفو<br />وبنتأمل متل كل سنة وبنقول\\\"ان شاء الله السنة الجاية بكون الوضع احسن وبنروح على اماكن حلوة وبنطول فيها<br />بدون قلق وخوف \\\"وحتكون احلى حياااااااة<br />ودمتم بخير<br />\\\"كن املاً\\\""
