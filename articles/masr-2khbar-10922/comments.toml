subject = "مرة واحد سألنى على لوحة كبيرة قوى مكتوب عليها - دا"
author = "مصرى"
posted = "2009-01-11"
text = "قلت لة<br />دائما مصر اولا تعنى<br />ان مصر تيجى الاول وبعدها قليوب وبعدها بنها وبعد بنها طنطا وبعد طنطا كفر الزيات لغاية ما نوصل البحر فى اسكندرية<br />هز راسة وعوج الطاقية وقال لى العلم نورن<br />فية احد عندة تفسير تانى<br />انا مش فاهم غير كدة<br />يبقى يضربوا بعض بالجزم لية<br />يضربوا احسن بالبراطيش - وكلهم وطنى واخوان ومستقلين ليس لهم اى لزمة وليس لهم اى تاثير<br />ومجرد ديكور"
