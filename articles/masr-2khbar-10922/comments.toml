[[comments]]
order = 11
subject = "يا شماتة الاقباط متحدون فيكوا يا بتوع مجلس الشعب"
author = "مش لازم"
posted = "2009-01-12"
text = "جزمة الإخوان.. وهيبة البرلمان!<br />12/01/2009 - 12:00:30 CET<br />بقلم هانى دانيال<br />يبدو أن ثقافة خلع الحذاء لا تزال تسيطر على عقول الشعوب العربية وأصبح الاختلاف في الرأي أو الفكر أو الاعتقاد يقابله خلع الحذاء، وبلا شك ستؤدي هذه الثقافة الخاطئة إلى ترسيخ بعض القيم والمعاني اللا أخلاقية، وتؤكد أن المنطقة العربية لن تفوق من ثباتها العميق إلا بثورة حقيقية يقوم بها ثوار الفكر وليس الثوار بالمعنى المتعارف عليه في الشعوب العربية!<br />ومنذ أن انتشر خبر قيام أحد أعضاء مجلس الشعب من المنتمين للإخوان لحذائه ضد أحد زملائه بسبب الاختلاف معه في الرأي والقنوات الفضائية تناقش الموضوع وكأنه مفاجأة، غير مدركين بأن ما حدث هو تطور طبيعي لما تم مناقشته إبان الحديث عن الصحفي العراقي الذي قذف الرئيس الأمريكي بوش بالجزمة في إحدى المؤتمرات الصحفية ومدى الإسفاف الذي تم به معالجة إلقاء الجزمة على الرئيس الأمريكي وكأن العرب انتصروا في معركة \\\"الجزمة\\\" ولن ينهزموا بعد اليوم!<br />المدهش حقاً أن تأتي هذه الواقعة بعد أيام من حوار المرشد العام للإخوان المسلمين مهدي عاكف لجريدة اليوم السابع والذي دافع فيه عن حماس وقيادات حماس واتهم النظام المصري والأنظمة العربية بالعديد من الاتهامات التي قد تفوق العمالة للخارج خاصة وأن كلمة \\\"العمالة لأعداء الوطن\\\" هي التي جعلت نائب الإخوان يخرج عن شعوره ويرفع الجزمة في مواجهة زميل له!<br />موقع الاقباط متحدون"
archived = "2010-03-14"
capture_url = ""
