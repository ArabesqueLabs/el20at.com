subject = "الى محمد جمال الدين الاسلام لم يعلم احدا حب الوطن"
author = "ابومحسن"
posted = "2009-01-12"
text = "مفيش حاجه اسمها وطن في الاسلام بالمفروم الحديث (مفهوم الجنسية)<br />الاسلام علمنا الهجرة من الوطن<br />ولو كان الكلام كما تقول ما وصل المسلمين الى الاندلس والهند<br />الم تقرأ قول الله تعالى ومن يهاجر في الارض يحد فيها مراغما كثيرة وسعه<br />الم تقرأ قول الله تعالى اجعلتم سقاية الحاج وعمارة المسجد الحرام كمن امن بالله واليوم الاخر<br />والمقصود بها هنا ان الصحابة الغزاه في سبيل الله الذين هاجروا للفتح الاسلامي افضل من الذين قعدوزا في الوطن"
archived = "2010-03-14"
capture_url = ""

