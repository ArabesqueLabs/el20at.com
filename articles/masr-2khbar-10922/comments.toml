posted = "2009-01-12"
text = "مقارنة بين الإسلام و مصر فمصر أولا طبعا و هذا لا يحتاج إلى كلام أما الدين فه بينى و بين ربى الله ولا علاقة لأى أحد به و لذلك فهو يأتى ثانيا بعد الوطن فالإسلام لم يعلمنا أبدا حب الوطن بالعكس فهو يعلى من شأن القومية الإسلامية و العربية على أى وطن و هذا ما يستغله أعداء الإسلام يوميا بحجة أن الإسلام لا يقيم للأوطان وزنا<br />أما عن مجلس الشعب فرأيى الشصى أنه لا يوجد شئ بهذا المسمى أصلا"
