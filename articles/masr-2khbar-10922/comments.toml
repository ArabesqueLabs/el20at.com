subject = "يا شماتة الاقباط فيها يا عيال"
author = "مش البراء اشرف ولا شريف الدواخ"
posted = "2009-01-12"
text = "يا شماتة الاقباط فيها يا ولاد<br />يا شماتة عدلي ابادير ومايكل منير وممدوح نخلة ومدحت قلاده وبقية غجر المهجر يا شماتتهم فينا يا جدعان<br />دا الشيخ حسن البنا حل كل مشاكل المسلمين في سطر واحد<br />نتعاون فيما اتفقنا عليه وليعذر بعضنا بعضا فيما اختلفنا فيه<br />رحمه الله يا شيخ حسن فينك وفين ايامك وفين تلامذتك الكبار"
archived = "2010-03-14"
