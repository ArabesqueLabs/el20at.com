subject = "يعني دلوقتي لازم نختار مصر او الاسلام"
author = "محمود رزق"
posted = "2009-01-11"
text = "يعني ايه مصر اولا و لا الاسلام اولا و هو في مجال لاختيار زي ده اصلا<br />مصر اللى حمت الاسلام من التتار و المغول و كمان من عصور التخلف و الرده<br />دلوقتي عايزين يخيرونا بين مصر او الاسلام<br />انا بعلنها صراحة انا بختار الاتنين و لا خير في حياة بدون احدهما عاشت مصر حرة و الاسلام عزيزا<br />حسبي الله و نعم الوكيل"
