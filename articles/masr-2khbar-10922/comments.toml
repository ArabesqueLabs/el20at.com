subject = "لو كنت انا (الرئيس/مبارك)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-01-12"
text = "اقسم باللة العظيم لو كنت انا السيد رئيس الجمهورية لاصدرت قرارا جمهوريا بحل مجلس الشعب و سرحت السادة الاعضاء بصناديق تلميع و اصلاح الاحذية<br />شرفا لنا من المهازل الغير اخلاقية تحت شعارات العروبة و الوطنية الجوفاء<br />على الاقل تلميع الاحذية نوع من النظافة<br />اما خلع الاحذية فى مجلس الشعب فهو احط نوع منانواع الوقاحة؟<br />اتفوا عليكم يا حثالة ما تدعون انكم (معارضة) انتم حقا(حثالة)الحثالة"
