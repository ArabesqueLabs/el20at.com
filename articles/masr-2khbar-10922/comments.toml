[[comments]]
order = 9
subject = "مجلس شعب اية ؟ دا نصفهم نجح بالتزوير واولهم مصطفى"
author = "ابو نخلة"
posted = "2009-01-12"
text = "سميحة بالقزايز<br />مجلس اية يا ولاد الل ....................... دول كلهم مرتزقة<br />الداخلية عايزة تتخلص من لواء عضمتة جامدة تقنعة انة يرشح نفسة لمجلس الشعب وان زملائة هينجحوة بالتزوير ويدخل المجلس ويبقى رئيس لجنة<br />و بتوع المخدرات يتكتلوا ويصرفوا وينجحوا مرشحهم<br />الا ما رحم ربك<br />شوية اعضاء مستقلين شرفاء الحكومة بتطعن فيهم وتقول بتوع المحظورة<br />كل المجلس دة ما لوش اى لزمة<br />ينعقد ما ينعقدش - لا تاثير<br />وجعوا دماغنا فى قانون المرور الجديد - وجلسات ومناقشات واعتراضات وتليفزيون بيذيع والاخر صدر القانون<br />اية اللى حصل بعد قانون المرور الجديد<br />اتحلت المشاكل<br />كل حاجة زى ما هى<br />الجرايد بتقول انة تم عمل نصف مليار مخالفة فى 3 شهور تدر عائد على الداخلية اتنين مليار جنية<br />قانون اية يا ابا<br />مجلس شعب اية يا ابا<br />دول شوية حرامية<br />فى ظل دولة تفككت ويحكمها الامن من لاظوغلى"
archived = "2010-03-14"
capture_url = ""

