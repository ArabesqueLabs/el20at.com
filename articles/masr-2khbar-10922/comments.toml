subject = "مش فى الزمن ده"
author = "محمد جمال الدين"
posted = "2009-01-11"
text = "يا أساتذة : و خاصة الاستاذ صاحب التعليق الاخير<br />الكلام الى حضرتك بتقوله كان يبقى ممكن لو فى حالة غير حالة الفساد الى فيها مصر دلوقتى<br />الاسلام هو الى علمنا حب الوطن و علمنا اننا ندفع روحنا فداه للدفاع عنه<br />لكن فى نفس الوقت مافيش واحد عاااااااااقل يسأل السؤال ده<br />لأنه سؤال ليه اجابة واحدة بس وهى :<br />الاسلام ... لأن الاسلام هو من علمنا حب الوطن فبالتالى يكون الاسلام يسبق الوطن بخطوة<br />اعتقد من وجهة نظرى ان دى كانت المفروض تبقى الاجابة على السؤال<br />ولازم نفرق واحنا بنقول مصر بين .. مصر كوطن .. و مصر كشعب ... ومصر كحكومة"
archived = "2010-03-14"
