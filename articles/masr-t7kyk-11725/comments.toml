subject = "واحنا مالنا - استهلاك الفرد المصرى من الكهرباء واح"
author = "برضة لا"
posted = "2009-03-28"
text = "هو كل ما غراب فى الغرب يكاكى نكاكى وراة<br />طلعت موضة ثقب الاوزون - وطلع ان ثقب الاوزون دة فوق شمال اوروبا وامريكا وان الشرق الاوسط بعيد جدا عن مخاطر ثقب الازون ومع ذلك الاعلام والتليفزيون قرفنا وكل شوية يطلع لنا خبير فى الاوزون وغاز ثانى اكسيد الكربون الناتج من مداخن المصانع - ونسى ان مصنع واحد فى امريكا يعادل كل مداخن جمهورية مصر العربية فى نفث غاز ثانى اكسيد الكربون<br />ثم طلعت حكاية ترشيد استهلاك الطاقة<br />معظم الشعب المصرى بيستهلك من 50 الى 100 كيلووات ساعة فى الشهر بينما الفرد فى الخليج بيستهلك 3000 كيلووات ساعة وفى امريكا اكثر من اربعة الاف كيلووات ساعة<br />سكان مدينة القاهرة بتعدادهم 14 مليون نسمة بيستهلكوا كهرباء تعادل استهلاك مدينة ابوظبى بتعدادها الذى لا يتعدى نصف مليون نسمة<br />ترشيد استهلاك اية<br />نحن نعيش على الكفاف<br />وعايزين تسدوا نفسنا - ربنا يسد نفسكم<br />سيبوا الناس عايشة وهى راضية بالغلب"
archived = "2010-03-14"
