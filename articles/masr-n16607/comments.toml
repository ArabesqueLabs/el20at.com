order = 1
subject = "من المؤمنين من"
author = "مصرى"
posted = "2008-07-04"
text = "من المؤمنين من قضى نحبة ومنهم من ينتظر وما بدلوا لقول اللة تبديلا<br />اعداء اللة والوطن يعرفهم الطفل المسلم<br />والذين يأخذوهم بالاحضان على ارضنا هم يهود مثلهم<br />ومات مناضل بالفكر والرأى والكلمة وقد تكون الكلمة اهم من الصاروخ والقذيفة فى زمن يقول لك رئيسك الجبان ان جارك المسلم فى غزة وفى ايران اعدائك بينما يهود وكلاب العالم هم اصدقائك<br />مات شهيد<br />وشريف<br />وبطل"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182037/http://masr.20at.com:80/newArticle.php?sid=16607"

