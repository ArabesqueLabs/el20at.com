text = "صحيح والدليل على ذلك احتلال العراق<br />اسرائيل حتزول لما تبطلوا هبل وتنصروا ضعفائكم<br />عمالين تتغزلوا في المسيري<br />هو نبي يا جماعة<br />وما المسيري الا بشر مثلنا ياكل الطعام ويمشي في الاسواق ويدخل الحمام"
