[[comments]]
order = 20
subject = "وإنا لفراقك لمحزونون"
author = "محمد السيد"
posted = "2008-07-05"
text = "إنا لله وإنا إليه راجعون ....<br />إنتو قاسيين كده ليه يا عشرينات؟ ... أصعب وأقسي حاجة قريتها في رثاء الدكتور المسيري ..<br />مش عارف أكتب إيه ؟أو أعلق بإيه؟ لكن عارف إني لازم أكتب له حاجة ..<br />كان المثل الوحيد اللي باضربه لأخويا الصغير ...إنه يطلع زي المسيري .. وحوار تليفزيوني كنت بأفرجه له عليه ..<br />يااااااااااااااااااااه ... ع الناس دي ... ينفع نسأل هي ليه مش بتقعد معانا؟<br />هي الناس دي مش عارفة تعيش معانا؟.. ولا زمانا متخلبط للدرجة دي؟.. ولا احنا الي مش عارفين نقدرهم؟ .. غير لما ييجب يوم زي ده ونقعد نكتب ونكتب ونكتب .. ونستمر في الحياة لغاية ما نفقد اللي بعده ؟؟<br />آآآآآآآآآ ه لو ربع الكلام ده اتكتب في حياته؟؟<br />الله يرحمك يا أستاذنا ومعلمنا و .. وحد كبير أوي حنفتقده يوم بعد يوم ..."
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182037/http://masr.20at.com:80/newArticle.php?sid=16607"

[[comments]]
order = 21
subject = "الى الاستاذ شايف"
author = "مش شايف"
posted = "2008-07-05"
text = "يا استاذ شايف الاسلام ليس دين اشخاص<br />الاسلام دين مبادىء وقيم واخلاقيات ومثل عليا<br />وهذه الاشياء موجودة في القران والسنه<br />والفضل ينسب لله ورسوله صلى الله عليه وسلم<br />مثلا زي حسن البنا راجل موهوب وكلامه كله كان من القران والسنه اذن ينسب الفضل لاهله وهو الله ورسوله وليس لحسن البنا<br />الشيخ محمد متولي الشعراوي افاد الامه بعلمه الغزير وهذا العلم من القران والسنه اذن ينسب الفضل لله والرسول<br />ما اعدش اطبل واهلل واقول الشعراوي الشعراوي او حسن البنا حسن البنا وانسى القيم والاخلاق والمبادىء اللي ارشدونا اليها ولفتوا انظارنا اليها وهي القران والسنة وضرورة اتباعهما<br />مجرد نصيحة ملكش دعوة بالمسيحي خليك مع الاصل الا وهو القران والسنه<br />لان اتباع الاشخاص فرقوا الامة<br />ناس تبع حسن البنا وناس تبع محمد عبدالوهاب وناس تبع ناصر الدين الالباني وناس تبع حسن نصر الله وناس تبع الخوميني<br />هو دا اللي ودا الامة في ستين داهية حب الاشخاص غلط غلط غلط<br />خليكوا مع شخص واحد فقط اسمه النبي محمد صلى الله عليه وسلم<br />لا نتبع غيره<br />يارب تفهموا"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182037/http://masr.20at.com:80/newArticle.php?sid=16607"

[[comments]]
order = 22
subject = "حسن البنا مدرس اللغة العربية وخريج دار العلوم مالة ومال الشرع والدين"
author = "هاهاها"
text = "صحيح ماهو هدف حركة البنا او جمعيتة او جماعة الاخوان كما اطلق عليها<br />هل هو هدف سياسى - دينى<br />هل اتبع طريق الشيخ محمد عبدة الازهرى وعمل على احياء علوم الدين<br />كلا<br />الرجل اشتغل فى الاسماعيلية وهى مدينة شبة فرنسية وقتها وشاف العرى والوساخة والدعارة والخمارات فثار زى شاب مصرى ضد الاوضاع<br />هل كتب البنا فى الشريعة وتفسير القران<br />هل لة فكر يعتد بة<br />كلا انة رجل قال جملة واحدة هى تطبيق الشريعة فى الحكم<br />ازاى يا مولانا - مش عارف<br />والحقيقة انة نظم الشباب لمقاومة الاحتلال الانجليزى<br />ولكنة ليس عالم دين ولا لة نظرية واضحة فى اسلوب الحكم<br />هى ضبابية فى عقول الشباب<br />لو راى البنا غزة اليوم سينضم للقتال<br />لو راى شرم الشيخ هل يعجب الشيخ العرى والماخورات هناك<br />حسن البنا راح لحال سبيلة<br />ويبقى فكر المسيرى اعمق من تفكير البنا المدرس الساذج"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182037/http://masr.20at.com:80/newArticle.php?sid=16607"

