[[comments]]
order = 4
subject = "حد ما يعرفش المسيري صاحب موسوعة \"اليهود واليه"
author = "مش عايز"
posted = "2008-07-04"
text = "يا فرحتي اذا كانت اسرائيل بتنتقل من اسرائيل الصغرى الى الكبرى<br />يا فرحتي بالموسوعة<br />بلوها واشربوا ميتها<br />وبعدين حيبيع الميه في حارة السقايين كل حاجه عن اليهود موجووده في القران في سورة البقره وال عمران وخلافه<br />وفيه اسطوانة للشيخ الشعراني عن اليهود في القران فيها كل شيء<br />يا ليته ما تعب نفسه وكان صرف فلوسها على الناس الغلابه اللي مش لاقيين"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182037/http://masr.20at.com:80/newArticle.php?sid=16607"

[[comments]]
order = 5
subject = "حمك الله يا مسيري.. اللهم جازه بالحسنات إحسانا وبا"
author = "مش عايز"
posted = "2008-07-04"
text = "محمد فاروق عجم بتاه موضوع العتبه<br />انا لغاية دلوقتي مش شايف اي مبرر لكتابة موضوع التحرش بتاع العتبه دا يا عم عجم<br />بس كويس انك طلعت خريج اعلام جامعة القاهرة يعني صحفي متخصص مش زي بقية الشلة<br />الصحفي المتخصص ما يكتبش موضوع زي بتاع العتبة دا ابدا<br />سلام يا عجم"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182037/http://masr.20at.com:80/newArticle.php?sid=16607"

