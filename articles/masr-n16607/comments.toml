[[comments]]
order = 11
subject = "لو كان رقاصة او ممثل"
author = "شايف"
posted = "2008-07-04"
text = "لو كان رقاصة او ممثل او مخرج واخرهم يوسف شاهين كان اتعالج على حساب الدولة فى الخارج او عالجة طاقم طبى الرياسة زى بعضهم<br />انما اصحاب الفكر المتنور الذى يقود الامة ويوجهها الى الاتجاة الصحيح فليس لهم اى اهمية<br />المسيرى ليس نبى ولا ولى من اولياء اللة الصالجين ولكنة رجل من عامة المسلمين اوتى علما فلم يصمت ولم ينافق ولم يخاف وقال الحقيقة التى لا تعجب من هم على الكراسى<br />وكونة يسكن فى مصر الجديدة ليس معناها انة من الاثرياء فالرجل عمرة 70 سنة ومن كان يسكن فى مصر الجديدة والمهندسين من اربعين سنة كان من الطبقة المتوسطة اى الموظفين وكانت شركة مترو مصر الجديدة تشجع السكن فى حى مصر الجديدة وتعمل لساكينيها اشتراك بالمجان<br />تحية للرجل ودعوة لة بالرحمة<br />ويوم يموت اللى بالى بالك سنبصق علية جميعا<br />فنحن نحترم الشرفاء من ابناء الوطن<br />المجد والخلود لكل شرفاء الوطن"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705182037/http://masr.20at.com:80/newArticle.php?sid=16607"

