[[comments]]
order = 0
subject = "يا ريت المشكلة تبقى  ضرب بس"
author = "حسام"
posted = "2008-11-05"
text = "هى المشكلة ضرب بس<br />تبقى سهلة خالص<br />المشكلة ان التعليم على وشك الانهيار<br />المدرسون لا يدخلون الفصول ولا الحصص - تسيب ادارات المدارس<br />فية مدارس فيها فصول والعيال بتقعد على الارض<br />فية مدارس مفيش ولا طالب فى الثانوية بيحضر المدرسة وبيذاكروا فى البيت<br />فية فصول ملهاش مدرسين وبيشغلوا مدرسين ارزقية بالحصة زى عمال التراحيل<br />فية انهيار لمنظومة التعليم فى مصر<br />سيبوكم من مؤتمرات الهجص بتاع الوطنى والكلام الماسخ بتاع الخطب عن التعليم<br />التعليم فى مصر فى خطر"
archived = "2010-03-14"
