subject = "اللى ايدو ف الميه مش زى اللى ايدو ف النار"
author = "مونى"
posted = "2008-11-06"
text = "تعالو جربوا تقفوا ف فصل فيه 110 تلميذ تشرحوا وتسالو وتصححوا وتسكتو الفصل واللى اعصابو تفضل سليمه لى عندى جايزه كبيييييره _هو المدرس ده مش بنى ادم ويا ريتو كمان بياخذ فلوس زى الناس ولو حاول يزود دخله شويه بدرس خصوصى ولا حاجه بيلاقى الدنيا كلها مهاجماه_ ارحمو المدرس يرحمكم من ف الساء"
