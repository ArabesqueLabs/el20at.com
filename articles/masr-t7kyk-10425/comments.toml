subject = "فين الحيوان الجمل؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-05"
text = "انت فين يا جمل<br />لسة نايم فى البرسيم و مبطلتش اكل؟<br />ليك يوم تدبح فية بالسكين يا حيوان<br />(صحيح الحيوان هيفضل حيوان)<br />حتى و لو بقى زير او وزير"
