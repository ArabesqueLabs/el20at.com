[[comments]]
order = 1
subject = "شرارة الثورة"
author = "ابو اسامة"
text = "لقد اندلعت شرارة الثورة والغضب وسوف يتذكر التاريخ اهل المحلة بانهم اصحاب الشرارة الاولى للثورة ضد الظلم والطغيان<br />فالتنظر الجرايد الحكومية المفضوحة الى هذه الثورة وهذا الغضب و لتعلم انها فقدت المصداقية ولم تعد لها اى تأثير على<br />الشعب الغاضب . واعجب كل العجب من الجرايد المعارضة التى لم تصور مثل هذه الاحداث للرد على هذه الجرايد الحكومية<br />واحذرها من انها ان لم يكن لها الاسبقية فى النشر فسيكون مصيرها كمصير الاحزاب المصرية وسوف يتجه الناس الى<br />النت لآخذ المصداقية."
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412211510/http://masr.20at.com:80/newArticle.php?sid=15058"
