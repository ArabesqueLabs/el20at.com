order = 0
subject = "عندها حق"
author = "اكتب اسمك هنا"
posted = "2009-01-12"
text = "واللة عندهم حق فمعظم شعبنا وخاصة مجانين الكرة وهم كثر ناس تافهة لايشغل بالهم ولا يكدر صفوهم الا اخبار الكرة ومشاكلها فحت فى 2006 عندما كان هناك اكثر من الف مصرى يصرخون فى عرض البحر ويستغيثوا فلم يسمعهم احد لانة لاصوت يعلوا فوق صوت مباريات كأس الامم الافريقية لذلك لاامل فى هذا الجيل فى انجاز اى شيىء وسلم لى على الدورى"
archived = "2010-03-14"
