subject = "ايه الاي كلام ده"
author = "محمد الانصاري"
posted = "2009-01-12"
text = "ايه الاي كلام ده<br />ليه ما يتفسرش الموقف انه برغم اختلافتنا في حاجات كتير حتى في الكورة<br />لكن كلنا متوحدين في موضوع غزة ومتوحدين مع القضية الفلسطينية<br />طبعا انا مش عاجبنى اللى حصل في الماتش بين الجماهير<br />بس ليه ما نقلش ان حتى الجماهير ده اللى كتير منها دماغهم فاضية ومش في بالهم غير الكورة اتاثروا باللى بيحصل في غزة"
archived = "2010-03-14"
