text = "و الله لو سالتونى عن الناطقين الاعلاميين هقولكو مش هما دول بتوع نشجب نستنكر نندد<br />و لكمن ف النهايه كل منهم ياتى معبرا عن فكر و سياسه و توجه الجهه الناطق باسمها<br />و على المتضرر ان يخبط دماغه ف الحيطه"
