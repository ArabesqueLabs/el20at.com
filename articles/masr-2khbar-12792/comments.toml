text = "لا حول و لا قوة الا بالله ..تعليق مستفز و لم اكن اتوقعه . و لكن ما علينا .<br />اولا بجد ربنا يكرم الشباب اللى فكر ف الفكرة دى و هما دول و اللى زيهم اللى هيعزوا دينهم و يشيلوا مسئولية بلادهم و ارضهم .<br />و قل للمؤمنين يغضوا من أبصارهم و يحفظوا فروجهم إن الله خبير بما يصنعون\" و \" و قل للمؤمنات يغضضن من أبصارهن و يحفظن فروجهن\"<br />الخبر و الحملة مش بس للرجالة و الشباب و انما للفتيات و النساء . حملة مباركة ."
archived = "2010-03-14"
