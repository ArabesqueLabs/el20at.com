text = "و الحكومة ما محبب عليها تطبق الرقابة و بالمرة تحجب مواقع المعراضة، سواء إسلاميين أو علمانيين، و مواقع المدونين اللي بينقولا أخبار المخالفات و التعذيب و الإضرابات، و مواقع كل جهة معنية بمراقبة الحكومة و كشف التجاوزات، و بكدا تخلص من كل أعداءها علشان شوية ناس مخهم قفل مش، هم نفسهم بيتفرجوا على المواقع الإباحية و مش بيقدروا يمسكوا نفسهم."
