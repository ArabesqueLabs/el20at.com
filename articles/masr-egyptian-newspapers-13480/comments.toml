author = "صعيدي مهموم"
posted = "2009-09-18"
text = "الجنوب المنسى<br />فى جميع القطاعات فلا يكفى انه متخلف تنمويا واقتصاديا<br />بل أيضا صحيا .<br />حتى المشاريع التنموية التى يتحدثون عنها جلها مصانع اسمنت و ما ادراك ما تأثير هذه الصناعة على البيئة المحيطة بها وكأن قاطنى هذا الجزء ليس من مصر المحروسة<br />حسبنا الله ونعم الوكيل<br />مياه ملوثة - هواء ملوث - تربة تسقى بالملوثات<br />ويتسألون من أين جاءت هذه الأمراض<br />ومن ذلك الصيعدي الذي تسول له نفسه بالمطالبة بمثل هذه المنشأة ومحافظي المحافظات الاربعة المشار إليهم من الوجه البحرى أى انهم فترة ترانزيت وسلم لى على البدلات وأعضاء مجلس الشعب 50% عمال وفلاحين والنص التانى مش عارف خد الشهادة ازاي كل همهم البقاء لاكبر فترة ممكنة فى المنصب ومش مهم مصلحة الناخبين (الا من رحم ربى وقليل ما هم ).<br />لايغير الله ما بقوم حتى يغيروا ما بأنفسهم. فلا بد من رفع الصوت ولو بكلمة أه ليعلم من حولك أنك تعانى .المطلوب الايجابية يا سادة ياكرام"
