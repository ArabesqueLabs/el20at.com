posted = "2008-06-02"
text = "تخيلى يااخت بسمه انكى الان جثه هامده لاحولا لكى ولاقوه وتلبسين الكفن الشرعى للمسلمين ويحجبونك اتنتظرى ان تحجبى وانتى بالقبر والفرصه متاحه بالدنيا والله لوزوقتى متعه الستر بالحجاب والزى مارجعتى عنه (الدنيا بما فيها والله لاتسوى لحظه غضب من الرحمن)قبل ان تحاسبى جملتك المشهوره فكرى قليلا وكان روحك تقبض وتقفى بين يدى الجبار بماذا تبررين0 اكثر شى مستغرباله انك زكيه بس للاسف خانك زكائكتميزك وحب جماهيرك الك من اجل ثقافتك وثقتك بنفسك ولذا كنا نحترمك ونقدرك بس كل ماف وسعى اناقول اللهم ماحفظ المسلمين وثبتهم وابعد عنا الرياء"
