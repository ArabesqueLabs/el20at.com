subject = "شماتة أعداء الاسلام"
author = "صلاح المصري"
posted = "2007-12-13"
text = "إن مما يتسبب فى شماتة الكفار والمنافقين فى الاسلام واهله عدم احترام المسلمين لأوامر الدين خاصة الفرائض مثل الحجاب ، وما فعلته الأخت بسمة _ هدانا الله وإياها _ يجعل اعداء الدين يفرحون ويشمتون حين يرون امرأة مسلمة تركت الدعوة الى الله لتتحول الى سافرة متبرجة خاصة وهى تعلم الوعيد الذى توعد الله به المتبرجات ... وختاما ( لن ترضى عنك اليهود ولا النصارى حتى تتبع ملتهم )"
