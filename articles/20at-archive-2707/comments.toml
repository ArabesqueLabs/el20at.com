posted = "2008-02-25"
text = "هذا درس لمن يتبع الشبهات بدون علم شرعي فيسقط فريسة للشيطان وهي اعتادت علي اتباع المتشابه في برامجها بغير علم منها و لا من ضيوفها الضعاف دينيا و تسميهم علماء فحصلت الإنتكاسة ولا حول ولا قوة إلا بالله<br />(فأما الذين في قلوبهم زيغ فيتبعون ما تشابه من ابتغاء الفتنة و ابتغاء تأويله و ما يعلم تأويله إلا الله و الراسخون في العلم يقولون آمنا به كل من عند ربنا و ما يذكر إلا أولوا الألباب)"
