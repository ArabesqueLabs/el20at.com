[[comments]]
order = 3
subject = "فين فطار الاخوان المسلمين الصائمين الموحدين ولاالو"
author = "سرطان المخ"
posted = "2007-09-30"
text = "افطار الوحدة الوطنية اى وحدة اللى انتو بتتكلموا عنها الاقباط اخوة لينا فى الوطن وهما مايجوش خمسة مليون من تمانين مليون وعايشين معانا ووسطينا بدون متتدخل الحكومة وتنظم علاقتنا بيهم لانهم مصريين ومنا وفينا انما الدين دة ربنا حيحاسب كل واحد على معتقدة واعمالة لكن بيتهيئلى ان الحكومة هى اللى بتخلق الفروقات بين ابناء الشعب الواحد لاسباب داخلية ودى احنا بنعرفها اما الاسباب الدولية فسالوا ماما امريكا وطنط اسرائيل"
archived = "2010-03-14"
capture_url = ""
