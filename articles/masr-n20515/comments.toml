[[comments]]
order = 7
subject = "طريق العطور - الجو كلة معطر"
text = "قبل 30 سنة كنت تركب القطار من محطة بنها على احد الخطوط الفرعية ويمضى بك القطار اليابانى القديم بين حدائق الفاكهة فى ارض الدلتا فى نهاية مارس واوائل ابريل حيث الربيع فتأتيك الروائح الجميلة التى لا تنسى<br />فى مثل هذا الوقت الجميل تزهر جميع اشجار البرتقال واليوسفى والليمون والخوخ والكمثرى وشجر المشمش الذى يبدو وكانة خيمة بيضاء من كثرة الزهور البيضاء التى تغطية<br />كان القطار القشاش الذى يسير على شط ترعة مخترقا تلك الحدائق يمشى الهوينى فتهب عليك رائحة ازهار البرتقال والخوخ والمشمش حيث ينشر عطرة فى الجو وخصوصا قبل المغرب او ما بين العصر والمغرب<br />تخيل انك تسير فى جو كلة عطور طبيعية من كثرة الاشجار وكثرة الزهور والاشجار المغطاة بالزهور البيضاء<br />كنت استمتع كثيرا فى تلك الفترة وكنت اركب القطار لاشعر اننى اسير فى جنة اللة على الارض حيث تتجلى فى الربيع القصير الذى لا يتعدى اسبوعين<br />عدت من الغربة بعد السنين الطوال<br />ما رايتة كان اشبة بالمدق - صحيح الارض خضراء ولكن لا يوجد اشجار الا نادرا والارض مزروعة بالبرسيم ولا توجد روائح ولا جو معطر ولا يحزنون<br />وشعرت بالكابة والضيق - مش هى دى مصر<br />عندما نزلت من القطار - سألت الفلاحين - فين اشجار الفاكهة - راحت فين<br />قالوا لى<br />كسرناها - وقطعناها وارتحنا<br />لية ؟<br />قالوا بصوت واحد - الضرايب<br />الضرايب عندنا على الارض الزراعية تختلف عن الضرايب على الارض المزروعة باشجار الفاكهة - طلعوا حاجة اسمها ضريبة موالح وبطريقة جائرة - الفلاحون قطعوا كل اشجار الموالح اعتبارا من اشجار الجوافة والخوخ والمشمش والكمثرى وباقى قليل من العنب والبرتقال<br />حاجة تقرف<br />وتذكرت - لية طعم الخوخ الفريك اتغير والجوافة بقت زى اللفت والكمثرى القديمة لم يعد لها وجود وانما حاجة كدة مهجنة لها نفس اللون والشكل ولكن الطعم مختلف<br />اصبحت الطريق القديم الذى كنت اراة صورة مقربة للجنة على الارض طريقا جافا قاحلا اشبة بالمدق فى الصحراء<br />كم كثرت المدقات فى حياتنا"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408050130/http://masr.20at.com:80/newArticle.php?sid=20515"

[[comments]]
order = 8
subject = "درب الاربعين او مدق الاربعين كانت الجمال تقطعة فى اربعين يوما"
author = "واحد"
text = "السواح الايطاليين الذين تم خطفهم وهم فى رحلة سفارى على حدود السودان وخلصهم الجيش السودانى كانوا يمشون على مدق الاربعين وتم خطفهم - وحينما تسير على هذا المدق تشاهد بقايا هياكل عظمية لحيوانات ماتت على هذا المدق تتيجة العطش او الجوع -<br />وفى وادى قنا وهو يقع على هذا المدق سافرت مرة من الاقصر ومعى خروف هدية من الادارة فى الاقصر للعمال فى مكان عملهم فى الوادى وسارت السيارة فى وسط الجبال حوالى 11 ساعة على طريق مدق صخرى قاسى جدا يجعل عمر كاوتش السيارة يقل نتيجة القطع والتمزق من الصخور الحادة<br />وصلت منهك تعبان فنمت - وفى الصباح تسلمنا اشارة من الادارة تقول - افيدونا عن وصول الخروف بسلام<br />فقدمت استقالتى وعدت وقلت لهم الادارة بتسأل عن سلامة وصول الخروف الهدية بمناسبة المولد النبوى ولا تسأل عن سلامة الحمار اللى هو انا الذى يصطحب الخروف<br />كانت ايام<br />ولكنها كانت فرصة للتعرف على كل المدقات واعرف الناس الذين يعيشون بالقرب منها واماكن التزود بالماء"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408050130/http://masr.20at.com:80/newArticle.php?sid=20515"

