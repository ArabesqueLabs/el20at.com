[[comments]]
order = 0
subject = "المدقات وايامها السودة"
author = "lwfhp"
text = "اية هو الطريق المدق ؟<br />طريق فى الصحراء او بين الجبال - عادة اقصر مسافة بين نقطتين - مشيت السيارات فوقة مرات عديدة فدكت الرمال والصخور وعملت علامات يمكن السير فوقها مرة اخرى - الحقيقة هو طريق مدكوك بالسيارات العابرة - وكلمة مدكوك ادق من كلمة مدق او مدك ربما تكون التسمية الصحيحة<br />وذكريات الايام السوداء بتقول اننا كنا بنمشى على المدقات دى ليلا والسيارة مطفأة الانوار<br />وبعد تكرار السير على الطريق المدك او المدق تظهر علية الجرجرة ويقال الطريق مجرجر اى اصبح ارضة على شكل مرتفعات ومنخفضات كامواج البحر بفضل الرمال والصخور الصغيرة<br />وكثرة العبور على الطرق المجرجرة او المدقات تصيب الانسان بامراض العمود الفقرى وتاكل الغضاريف والم شديد فى منطقة العصعوص عند الفقرة اسفل العمود الفقرى والام شديدة بفضل الرجرجة وسوستة الكرسى بتاع السيارة"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408050130/http://masr.20at.com:80/newArticle.php?sid=20515"

[[comments]]
order = 1
subject = "فبعد انتقال مكان عملي لمحافظة السادس من أكتوبر أصبحت ألتحق بأتوبيس الشركة"
author = "مش رضوى حسن ولا مروى صلاح ولا حتى دعاء الشامي"
text = "سته اكتوبر ايه واتوبيس الشركة ايه<br />هو انتي مش بتشتغلي صحفية<br />ما تفهمونا ايه العبارة"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408050130/http://masr.20at.com:80/newArticle.php?sid=20515"

[[comments]]
order = 2
subject = "وتستخدم المدقات عموما للتهريب"
author = "غ"
text = "على الحدود بين الدول توجد مدقات فى الصحراء - والحمار يجيد السير على المدقات وحدة ولا يترك المدق ابدا حتى يصل الى نهايتة - فمثلا ينطلق الحمار من داخل الحدود الليبية محملا ببضائع التهريب ويخترق الحدود بمفردة سائرا على المدق حتى يصل الى المتلقى بعيد داخل الحدود المصرية فيتولى المهربون تنزيل البضاعة واطعام الحمار جيدا وتحميل بضاعة اخرى يحتاجة الجانب الاخر من الحدود ويطلقون الحمار عائدا فى الاتجاة الاخر على نفس المدق<br />واحيانا تقوم اسرائيل بطلعات جوية لمراقبة الحدود بينها وبين لبنان او سيناء ويراقبون تلك المدقات ومن يسير عليها<br />ومن اشهر المدقات فى مصر هو درب الاربعين او ممر الاربعين وهو مدق فى الصحراء يبدأ فى السودان بالقرب من دارفور وينتهى بالقرب من اسيوط ويتبعة تجار الجمال والمخدرات والسلاح<br />اما المدق التى تسيرين علية فهو مدق نص كم حاجة كدة صغيرة او توصيلة لاختصار المسافة وليس فية اى خطورة"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408050130/http://masr.20at.com:80/newArticle.php?sid=20515"

[[comments]]
order = 3
subject = "درب الاربعين او ممر الاربعين وهو مدق فى الصحراء يبدأ فى السودان بالقرب من دارفور وينتهى بالقرب من اسيوط"
author = "العنوان جزء من تعليق المعلق السابق"
text = "ايه يا عم اللي انت بتقوله دا<br />انت كده دخلت في ادجندة اوباما<br />من دار فور لاسيوط<br />دا كلام كبير اوي"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408050130/http://masr.20at.com:80/newArticle.php?sid=20515"

