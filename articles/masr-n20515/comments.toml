text = "طيب يا جميل لو واحد من قطاع الطرق البدو عينة زايغة واحلواتى فى عنيية وخطفك وراح وراء الجبل ---<br />يا سنة سوخة يا ولاد<br />لف سنة ولا تعدى قناة"
