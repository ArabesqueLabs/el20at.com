subject = "وعلى المدق لو تعطل الاتوبيس او انفجرت العجلة - هتعملوا اية ؟"
text = "موقف فى منتهى الصعوبة لما عجلة تضرب والاتوبيس فوق مطلع وعايزة تتبدل وطبعا السواق هيحتاج مساعدة وهتعملوا اية يا حلوين - لما تتلطعوا فى الشمس فى الصيف ساعة"
archived = "2009-04-08"
