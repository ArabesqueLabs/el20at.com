subject = "محدش فاهم حاجة"
author = "مصرى وبس"
posted = "2007-05-24"
text = "بقى هو عبدالله السناوى بقى خلاص من اتباع اللوبى السعودى فى مصر !!!!!!!!!!!! دى حاجة عجيبه والله . الظاهر ان الأخ ميمو ده لاهو فاهم حاجة لا عن الناصريين ولا القوميين ولا حتى عن السعودية ومش عارف ايه اللى ربط بين السناوى والسعودية هو يعنى علشان الرجل كتب مقال بيتكلم فيه عن العلاقات المصرية السعودية ودور مصر اللى بقى حاجة تكسف فى مقابل الدور السعودى المتصاعد يبقى اصبح من اللوبى السعودى وبعدين ايه علاقة الناصريين بالسعودية اصلا .............. حد فاهم حاجة ؟؟؟؟؟؟؟؟"
