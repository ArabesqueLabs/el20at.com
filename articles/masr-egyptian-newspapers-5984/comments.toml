[[comments]]
order = 2
subject = "قرفى وقرفك من الحكومة محتاج ماهو ابعد من الردح  لي"
author = "من ميمو الى مصرى وبس"
posted = "2007-05-24"
text = "افهمك يا استاذ مصرى مع انك فاهم .. المعارضة فى مصر دخلت فى مرحلة كيد النسا للحكومة .. المقال مكتوب بضيق افق والسناوى مشاكلة مع الدولة ممكن تتحل لو عينت هيكل مستشار .. ومتبقاش عايش ايام زمان ايام ما كنا عبد الناصر بيعتبر السعودية بلد رجعى .. الكلام ده خلص بالنسبة للناصريين على الاقل على المستوى العملى .. الكوبرى ده واضح انه مش مدروس بجد من الطرفين لانه لو كان جد كانت صحف الحكومة هللت يه قبل الهنا بميت سنه وبالرغم من كل الانحطاط اللى فى مصر لو رحت فتحت موقع هيئة الانفاق المصرية حتلاقى المشاريع كبيرة وبتاخد سنين على ما تتدرس زى الخط التالت للمترو اللى بيعملوا ليه دراسة مسحية بقالهم 6 سنين .. فارجوك غللى وغلك من الحكومة محتاج ماهو ابعد من الردح او صحن الكفوف"
archived = "2010-03-14"
capture_url = ""
