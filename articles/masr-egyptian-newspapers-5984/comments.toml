subject = "الحمد لله مبقيناش نقدر نحارب فى اليمن زى زمان"
author = "ميمو"
posted = "2007-05-22"
text = "الناصريين اللى زى السناوى نزلوا لاسفل درك بالطريقة دى عاملين زى الست الكيادة اللى بتقول لجوزها اختى وجوزها متهنيين وسعدا عينى على بختى .. الدور السعودى من زمان معروف .. برميل فلوس كبير .. الحنفية شغالة الايام دى كويس عشان عوايد النفط . طيب مش مشكلة .. كله فايدة لما تدفع شوية للسودانيين الغلابة .. او بعت فلوس للفلسطينيين بدل ما يشتروا اسلحة من امريكا عمرهم ما استخدموها او يشتروا فيها اسهم فى امريكا تتجمد عند اول عملية جهادية تتم .. موضوع الدور السعودى ده مشكلته انه شغل اعلام .. لان السعودية بلد متقدرش تدافع عن نفسها وتجربة عاصفة الصحراء مهياش من قرنين .. الحقيقة الحقيقة الحقيقة ان على الرغم من قرفى من مبارك لاسباب ملهاش دعوة بموضوع الجسر ده .. الا ان اللوبى السعودى فى الاعلام المصرى بقى مقرف ومقزز"
archived = "2010-03-14"
