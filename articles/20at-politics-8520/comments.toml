subject = "أيام لا تنسى"
author = "usama"
posted = "2008-04-13"
text = "نعم أيام لا تنسى وأذكر يوم دخول قوات الأحتلال منطقة الأعظمية والقصف الجوي علينا حتى كنت أتصور البيت يرقص رعبا من شدة الأهتزاز وعندما خرجت للشارع بعدما هدأت الأوضاع في عصر ذلك اليوم وجدت جثث بعض الصبية الشباب وأسلحتهم موضوعة قربهم ، و تم دفنهم في مقبرة خاصة في حديقة جامع أبو حنيفة وسميت مقبرة الشهداء ، وعددهم سبعة عشر تقريبا ، ثم دفنا الوجبة الثانية مساءا ولم يكن في جيوبهم ما يدل على هويتهم ومعظمهم من خارج الأعظمية، وتلت تلك الليلة عدة ليال حدثت فيها معارك الشوارع وتكبد ت القوات الأمريكية أكثر من مائتي قتيل لم يعلن عنها حيث كانت القنوات الفضائية تعرض قبلها لحظات سقوط الصنم. وأستمرت المعارك ......ليومنا هذا ولم تنتهي بعد."
archived = "2010-03-14"
