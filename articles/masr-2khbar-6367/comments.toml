text = "أنا مش عارف أقول ايه على حكومتنا ألزكية أحييها على ألافكار ألجميلة أم ريحة حلوة أولا أيها أصحاب دورات ألمياه أسف أقصد أصحاب ألبلد أخلو أخلو أخلو ألمقابر من ألناس ألاحياء أولا ثم حقوق ألناس للأسف أكيد تكلفة دورة ألمياه ألواحدة أقصد ألقعدة بلسيفون بالسيراميك تكلفة شقة ولو ألنية سليمة لهذا ألمشروع ألعملاق معناها أن عواطلية ألبلد يعملو وهذه ألمهنة شريفة على ما أعتقد وبارك ألله فيكم أيها ألأذكياء"
