[[comments]]
order = 6
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-08-22"
text = "جميع الأدوات الطبية والمحاليل لها عمر افتراضي ، يعني علينا أن نغير كل ما تحتويه الشنطة خلال 6 أشهر على الأكثر، لأن جو السيارة شديد الحراراة عن الجو الطبيعي، لذا فإن كل الأشياء التي تحتوي عليها الشنطة ستفسد خلال شهر واحد، أما بالنسبة للقرار ، فقد تحول الموظف العام في مصر إلى منفذ سياسة وليس له أن يدلو بدلوه في أي قرار هو نفسه سوف يطبقه على الجمهور ، لذا فإن كيفية أخذ القرار في مصر معروفة للجميع كيف تتم، ومنهم لله ، ولن أدعو عليهم كالثكالي لأني لست مقهورا، ولست مستلما ولكن عزيمتي حديد مثل الشرقاوي صاحب الموقع<br />د. حازم"
archived = "2008-08-25"
capture_url = "https://web.archive.org/web/20080825015235/http://masr.20at.com:80/newArticle.php?sid=16965"

[[comments]]
order = 7
subject = "النظام حلو!!! و يجعله عامر!!!!"
author = "rania masoud"
posted = "2008-08-28"
text = "بس مش لما يكون في نظام من أصله؟ يعني النضافة حلوة و النظام حلو بس نظموا نفسكم بنظام كويس و نضفوا نفسكم بصورة حضارية. يعني إيه إسعافات أولية؟ يعني لازم السائق و الركاب يكونوا على علم كاف بمبادئها. طيب لما السائق لازم يعرف الإسعافات دي ليه بقى سواقين الأتوبيس العام بيحطوا حاجات مخالفة في الأتوبيسات العامة؟ و لا السواقين اللي فوقهم بيبقى محطوط ممنوع التدخين بنص القانون 154 لسنة 2007 و الكمسري و السواق و واحد من صحابهم عاملينها غرزة و مطهقين الركاب؟<br />بدل منتكلم في الحاجات العبيطة بتاعة الإسعافات اسعفونا أنتم بحاجة توقف العربجية بتوع الأتوبيسات اللي مبيخافوش لا قوانين و لا غيره. كمان السادة السواقين المحترمين اللي بيركبوا على مزاجهم و بيقفوا بمزاجهم للي عايزينه و اللي بيزوغوا من شوارع غير الشوارع و اللي ... و اللي.. و اللي...<br />المكيف الصغير لما كان الله يرحمه مكيف كان بجنيه و كان العربية لما بتتملي بيتقفل الباب و خلاص على كده. دلوقتي بقى لما بتيجي تركب تلاقي السواق بيعبي و بيملا زي ميكروباصات الجمعية و الأدهى من كده إن الناس بتبقى على بعضها<br />و الله حد من بتوع اختراع الشنطة يبقى ينبه على لجنة مصممي الشنطة يحطوا مع الشنطة جهاز تنفس صناعي لأن النفس هوة الأساس، و ده يكون للركاب اللي بيتخنقوا من الزحمة و من التدخين بتاع السواق و الكمسري<br />و يا ريت كمان اللجنة تراعي ربنا و جهاز التنفس الصناعي ده ميسترخصوش و ينتهي الحال إنه يبقى جوزة... و أهوة بكمالة الغرزة بتاعة السواق و الكمسري<br />المثلث بقى و الله هيتحط على الأرض و لا على إزاز العربيات من ورا؟ و الله لو ع الإزاز يبقى خير و بركة أما الأرض فلو كان في مكان لبني آدم و لا عربية في الزحمة دي يحطوا رجلهم يبقى لهم الحق بدال ما يرصوا المثلثات ع الأرض عشان تتباع يرصوها عشان يوقفوا العربية اللي بيها عطل و ينبهوا اللي جاي من وراهم و قدامهم<br />و الخلاصة: هوة تمن اللحمة اللي ارتفع لخمسين جنيه و البنزين اللي اترفع منعرفش ليه و إزازة الزيت و أكل الغلابة و كل ده مستني لما كمان تحطوا مثلث و شنطة للإسعاف؟<br />هوة الإسعافات دي كانت فين لما الناس الحاجة غليت عليهم و ماتوا من الجوع و لا جتلهم أمراض و سكتات؟ و لا الإسعافات كانت فين لما المسئول السابق ملا البلد بالأغذية المسرطنة؟<br />و لا هوة من إمتى أصلا بتهتموا بإسعافاتنا و لا حجج لم فلوسنا و الاستيلاء عليها خلصت عشان تطلعولنا بحجة جديدة؟<br />يخرب بيت البهايم اللي مبتفهمش"
archived = "2008-12-18"
capture_url = "https://web.archive.org/web/20081218144125/http://masr.20at.com:80/newArticle.php?sid=16965"

