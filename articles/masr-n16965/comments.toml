text = "عفوا احنا حانروح بعيد ليه يا جماعه ببساطه شديده جدا فى واحد من الناس المحترمه فى البلد كان نايم خير الله ما اجعله خير حلم بالجزء التانى من الحلم الأول الى حلم فيه بالخوزه والحزام وقال لما اكمل باقى الحلم عشان اعرف انام وانا مرتاح الضمير و بعت جاب دفعه شنط فيها شويه زباله من مخلفات المصانع بالخارج و مثلث بلاستك معفن يتكسر قبل ما ماتفتحه . ولا تعليق . وعلى رأى الفنان احمد مكى( A7A) احاااااااااااااااااااااااااااااااااااااااااااااااااااااااااا"
