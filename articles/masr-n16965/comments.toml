subject = "لازم تدفع"
author = "أحمد المصري"
posted = "2008-07-27"
text = "نفس أعرف البهايم الي بتنزل القرارات دي مابتدرسهاش خالص؟؟؟؟<br />فيها إيه لو إدونا مهلة 3 أشهر بدل خلق أزمة جديدة و إحنا مش ناقصين (أزمة عيش و أزمة بنزين و أزمة الثانوية العامة و ....).<br />الناس دي متهيألي إنها مش أغبياء لا دول بيفكروا بمنتها الذكاء إزاى يخنقونا."
