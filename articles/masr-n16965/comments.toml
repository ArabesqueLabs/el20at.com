[[comments]]
order = 1
subject = "قانون ابن الدايرة والا ابن المثلث"
author = "حبيب عدلى كفتة"
posted = "2008-07-27"
text = "القانون ناقص - يشترط ان يكون فى السيارة ممرض وفى الاتوبيس دكتور<br />وان تكون السيارة مجهزة باسطوانة اوكسجين واكياس نقل الدم<br />وان يكون السائق حاصل على دورة تمريض<br />وان تكون السيارة من النوع المدرع والكراسى غير قابلة للاشتعال<br />وان يكون على تابلوة السيارة رزمة من اوراق البنكنوت فئة العشرة جنية لزوم رشوة رجال المرور والكمائن<br />وبعدين جابوا القوانين دى من اين<br />اى نعم فى الدول المتقدمة بيعملوا اسبوع للمرور وبيحصل توعية للسائقين انة يفضل ان الحاجات دى تبقى موجودة ولكن مش نص فى القانون<br />وصدق المتنى من الف سنة فى شعرة<br />وكم ذا بمصر من المضحكات ولكنة ضحك كالبكا"
archived = "2008-07-29"
capture_url = "https://web.archive.org/web/20080729010006/http://masr.20at.com:80/newArticle.php?sid=16965"

