subject = "امن ايه اللى انت جاى تقول عليه انت عارف قابلة معنى"
author = "مصرية"
posted = "2007-02-09"
text = "انا مش متفقة معاك يا دوعكى سمير على حاجة انت بتقول غطينى ياما وصوتى المفروض تقول غطينى ياما وصوتى وانا اصوت وراكى الطمى ياما وانا الطم معاكى اكشفى راسك ياما وادعى عليهم وانا امن وراكى ونبى لما شارون رجل سلام نبقى احنا الشياطين ال شارون رجل سلام ال يا سلام انا مش عارفة هما مفهوم السلام عندهم ايه هما اصلن بيفكروا ازاى ولما يقول بوش اسرائيل لها الحق فى الدفاع عن امن ترابها الوطنى اولا اسرائيل مالهاش وطن وكمان ترابها يعنى كفاية بيغيروا فى التاريخ عايزين كمان يغيروا فى التراب واللهى لو التراب ينطق هيقول انا تراب فلسطينى فلسطينى فلسطينى وبعدين يعنى بيقول امن ونبى امن ايه اللى انت جاى تقول عليه انت عارف قابلة معنى الامن ايه ولما كلب الست يقول انى هو بيحلم فى اليوم اللى يلاقى فيه الشرق الاوسط خالى من اسلحة الدمار الشامل ونبى نفسى اشوف سلاح من اسلحة الدمار الشامل اللى عندنا هو كلب الست ياإما عبيط او بيستعبط هو بيتكلم زى ما تكلموا فى العراق قاعدوا يقولوا كماوى ومش كماوى وبعد ما دخلوا البلد موروناش شوية كماوى نتفرج عليهم وبعد كدة يقولك اسلحة دمار شامل دة انا عندى احساس لو الحرب قامت عندى احساس اننا ممكن نحارب بالنبل\"نلبلة\" لاننا اصلن معندناش سلاح و قال يقولك اسلحة دمار شامل يلا كفاية كدة علشان انا زهقت من كتر الكلام وكمان الواحد صوتوا اتنبح"
archived = "2010-02-05"
