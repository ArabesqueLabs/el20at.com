[[comments]]
order = 0
subject = "راس الفساد"
author = "واحد"
text = "كان رحمة اللة علية المهندس عثمان احمد عثمان يملك اكبر شركات المقاولات فى مصر والعالم العربى وقتها وكان عملاقا - بنى السد العالى وكوبرى 6 اكتوبر ولكننا لم نسمع ابدا انة جرى وراء مغنية او راقصة او اقترب من الحكم او اقترب من الفساد<br />فى عصر الاضمحلال المصرى لرئيس تجاوز 80 عاما بقدرات عقلية محدودة وظهور شلة مفسدين تعرفوا على ابنة فى لندن وكونوا عصابة او تنظيما اجراميا مقرة لجنة اطلقوا عليها السياسات وهى مكان لتوزيع الغنائم والمسروقات وتدخلوا فى الحكم رغم انف العجوز وظهرت العبارات الغارقة واكياس الدم والمواد المسرطنة<br />ايها السادة انة ظهر بواسطة حصولة على مال المودعين بالبنوك واخذها قرضا واحتكر بة السلعة ثم ذهب الى البورصة يلهط منها باسهم وهمية يشتريها المغفلين<br />لو كان الشعب عندة وعى محدش يشترى اسهمة خالص"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819173901/http://masr.20at.com:80/newArticle.php?sid=17282"

[[comments]]
order = 1
subject = "احمد الجلبى مصر"
author = "زعبور"
text = "هؤلاء الذين طفوا على السطح فى مصر - صناعة امريكية - تماما زى الجلبى بتاع العراق واظن ان هذا الولد يعد ليلعب دورا ما فى مصر<br />لا تستغربوا اذا تولى الحكم<br />المخابرات الامريكية تدير مصر بطريقتها وكما جابت حسنى هتجيب احمد عز<br />ومهما عمل محدش يقدر يلمسة<br />نعم انهم يعدونة لدور ما - بعد ان عر فوا كرة الشعب لجمال مبارك<br />اكيد هذا الولد يعد لحكم مصر"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819173901/http://masr.20at.com:80/newArticle.php?sid=17282"

[[comments]]
order = 2
subject = "لو كنت انا عز بحق و حقيقى لكنت استقلت لاجل مصر و النظام و الحزب؟"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر(عضو بالحزب الوطنى الديقراطى)"
text = "انا مواطن مصرى مسيحى و عضو بالحزب الوطنىى االديمقراطى و لكنى غير راض عن تصرفات ذلك المدعو احمد عز اطلاقا؟؟؟<br />لو كنت انا حمد عز مخلصا للنظام و الدولة و الحزب و الوطن لاستقلت فورا و تنحيت عن العمل السياسى الذى كلة و جع دماغ و قلب ؟؟؟؟؟<br />و تفرغت لاعمالى التجارية التى كلها هى تجميع مال و ذهب و جواهر و ياقوت؟؟؟ (احمدك يارب)<br />حقا خطاء قاتل كل من يعتقد ان احمد عز سوف يكون رئيسا للجمهورية يوما ما؟؟؟<br />(احمد عز بدعة و البدعة ضلال و الضلال الى النار)<br />من اجل الوطن و النظام تنحى ياحمد يا عز و كفى النظام معاناة و سخرية بسبب تصرفاتك الطائشة و اكتفى بملياراتك و استمتع بالحياة و راحة النفس؟<br />ليكن الوطن و النظام و الحزب اه من احلامك و طموحاتك المريضة ؟؟؟<br />الوطن لة رجالة المخلصين الشرفاء امثال حسنى مباركو جمال مبارك و غيرهم من ما يعملون فى صمت؟<br />اما انت يا ابن عز يا واكل الوز حريا بك ان تبتعد و كفى لعب بالنار يا حمادة يا حديد زيادة!!!!!!!!!!!!!!"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819173901/http://masr.20at.com:80/newArticle.php?sid=17282"

[[comments]]
order = 3
subject = "نعم للرئيس مبارك و نعم لنجل الرئيس جمال مبارك و الف مليون لا لذلك المدعو عز"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر (الحزب الوطنى الديمقراطى) (zakhary2000@yahoo.com)"
text = "مخطئى من يعتقد ان بياع الخردة ابن عز سوف يكون رئيسا للجمهورية؟<br />لتذهب تقارير المخابرات الامريكية الى الجحيم؟؟؟<br />مصر لديها نظام و دستور و قانون و مؤسسات ديمقراطية<br />نحن ابناء مصر نبايع رئيسنا و نبايع ابن رئيسنا ايضا ليكون رئيسا لنا بع و الدة اعطاة اللة من موفور الصحة و العطاءو العمر المديد<br />حسنى يا مبارك<br />جمال يا مبارك<br />مصر و ابنائها معكم على طريق البناء و العطاء و الديمقراطية<br />(اللة معكم فمن عليكم؟؟؟)"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819173901/http://masr.20at.com:80/newArticle.php?sid=17282"

[[comments]]
order = 4
subject = "لا تحلم كثيرا يا زخارى انت والحزن الوطنى بتاعك"
author = "عبود"
text = "امريكا قالت لمشرف استقيل وقد كان كلبها فى باكستان فاستقال وكذلك كلبها شاة ايران وركلتة فى مؤخرتة ليدفن فى مصر<br />يبقى كلب امريكا فى مصر واخرتة اقتربت وقريبا جدا<br />اما تعاطف النصارى الارسوزكس فى مصر مع جمال مبارك فمعروف لان جدتة لامة نصرانية انجليزية وثقافة جمال ثقافة مسيحية مثل امة تماما<br />واذا كنتم بتحبوة مفيش مانع لدى المسلمين انة يمسك مكان البابا شنودة فالاثنين متقاربين فى الشكل<br />امريكا هى اللى هتقرر مين الرئيس<br />ايمن نور - احمد عز - مدير المخابرات - الدكتور الشاطر<br />انما جمال فرصيدة صفر مكعب"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819173901/http://masr.20at.com:80/newArticle.php?sid=17282"

[[comments]]
order = 5
subject = "الحسد"
author = "أحمد عبدالله"
text = "لا فائده فمعظم الاراء تنم عن حقد وفشل وحسد<br />للعلم أن ارتفاع أسعار الحديد ليست بيد أحمد عز وانما السوق العالمي وكل العالم يواجه أزمة ارتفاع الحديد<br />وكما تعودنا نحن المصرين أن نشتم ونقذف وندعي على بعض نسينا أن مصنع أحمد عز فعلا هو مصنع مصري وانتاجه يفيد مصر ويعمل بالمصنع عمال مصريين .<br />مثال دول الخليج مصانع الحديد فيها أصلا غير تابعه لمواطنيها وجميع العمال فيها هنود وبنغال وباكستانيين<br />وحتى اسعار الحديد فيها مرتفعه ويسمون الخليجي بالشريك النائم لانه اصلا ما يقبض الا فاتفيت ارباح شركاته بينما الهنود<br />هم المسيطرون.<br />كفانا سفاهة ولنقف مع بعض ونعترف بالحق أحمد عز شخص عادي ومصنع عز مصنع مصري حتى ان كان احمد عز يملكه فهو لا يملك العاملين فيه وكفايه نكذب على بعض ولننظر الى الطامعين في اسواقنا فالهنود قادمون أيها الفراعنه لنهب خيرات مصر التي نضيعها مع بعض.<br />فعلا مافيش فايده زي ما قلت يا سعد زغلول"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819173901/http://masr.20at.com:80/newArticle.php?sid=17282"

[[comments]]
order = 6
subject = "يا مرحب"
author = "ابو ضب"
text = "يا مرحب يا عم عز<br />اعمل اى حاجة بس بلاش سياسة وبلاش سرقة واعمل حديد مصرى 100 % مش جاى اصلا خردة واتسيح وعملت اسياخ<br />هات خامات الجبل واعمل حديد مصرى واربح بالمعقول - ابعد مما فية سياسة ا"
archived = "2008-08-19"
capture_url = "https://web.archive.org/web/20080819173901/http://masr.20at.com:80/newArticle.php?sid=17282"

[[comments]]
order = 7
subject = "احمدعز وسياسة الرقص بسيخ حديد على طريقة عشيقتة نانسى عجرم"
author = "محمدعلى باشا"
text = "اللى ميتسماش عز بعد ماسرق البلد والبنوك هو وحبايبة جاى دلوقتى على مدخرات المساكين الحالمين بمستقبل افضل ليهم ولولدهم عاوز ياخد اللى فى جيوبهم ويركبهم الديون"
archived = "2008-08-21"
capture_url = "https://web.archive.org/web/20080821001138/http://masr.20at.com:80/newArticle.php?sid=17282"
