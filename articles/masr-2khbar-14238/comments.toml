author = "حسنين ابو السعود"
posted = "2009-12-03"
text = "انذار خطر لما يحدث فى الشعب المصرى<br />انذار للجالسين فوق الكراسى فوق فى غيبوبة بعيد عن الشعب ولا يفعلون شيئا غير جملة غبية يقولونها - انهم مع محدودى الدخل ويدعمون الفقراء - مجرد كلام<br />اللى بيوصل الى مرحلة الانتحار ممكن يفكر مدام موتة بموتة يبقى ياخد غيرة معاة ويفجر نفسة فى اى هدف<br />محدش يقول ارهاب بعد كدة<br />انتم الذين يدفعون الناس الى ان يقتلوا انفسهم<br />اننا نسير فى اتجاة خاطىء"
archived = "2010-03-14"
