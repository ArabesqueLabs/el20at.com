text = "طبعاً لا يوجد شئ يبرر الإنتحار خاصة أنه حرام وأن الظروف بتتغير وأن الإنسان يحاول دائماً تهيئة ظروف يملؤها الأمل في الله وفي قدراته ويعلم أن دوام الحال من المحال ،ومهما طال الليل سيأتي النهار ، هذا من ناحية من ناحية أخري علي رجال الأعمال التكافل الإجتماعي حتي يسود المجتمع روح المحبة والإنتماء وأن يتخلوا عن الأنانية والطمع بل عليهم أن يخلقوا فرص عمل حقيقية برواتب تحمي الأسرة المصرية من العَوَز ومن الأمراض النفسية"
