author = "ضريبة الرفاهية"
posted = "2009-12-03"
text = "دة تبطر على النعمة بتاع الفكر الجديد<br />وانا ادعو الحزب الوطنى ان يستورد حبال جيدة ورخيصة للشنق واكيد كتير لن يبقى امامهم غير هذا الطريق<br />ومن فترة الاستاذ احمد عز كان قد طلع تصريح ان الزبالة فى الشوارع دليل الرفاهية<br />فعلا رفاهية يا استاذ"
