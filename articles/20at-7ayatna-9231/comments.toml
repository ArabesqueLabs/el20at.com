text = "كل الحرف باتت صامتة في ظل وقتٍ خُرست فية الأفوة ,, وتكسرت فيه رؤوس الأقلام عن التعبير ,, وتجمدت كل الصيحات الصارخة .. لكن لم يزل حنينُ الكثيرين ممن عشقوا الوطن وعشقوا ترابة ،، يريدون البوح بما في صدورهم ,, عن تلك الذكريات الجميلة ,, التي تسكنهم حتي في أحلامهم في أوقات فراغهم ,, تجعلهم ينتظرون وبشوقٍ قاتل بأن يُنهوا مهمتهم ,, ويعودا إلي حضنِ الأم الدافئ والأرض الدافئة \\\" غزة \\\" .<br />جميلٌ ذاك الحرف الذي يعطي الوطن حقة وأكثر ،، من كلماتٍ مؤثرة .. وجياشة ،،"
