posted = "2008-06-02"
text = "أخي محمد حيدر / سرني جداً وجودك هنا، وثق أن غزة تحتاجنا جميعاً إناثا أو ذكوراً، وثق أننا مهما اغتربنا سنعود ونحن نحمل بأيدينا نجاحنا، وفخر أهلنا بها ... ابق على ذلك العهد .. عهد الوفاء للوطن ... موفق ..<br />حبيبتي سماح / تثلجني تلك الزيارات الراقية من قلمكِ الشفاف، فتنثري عطرك ووردك في كل مكان تحلين به، لم تعد المسافات بيننا، فالمدى بين القلوب أقرب وأقرب ... كوني بخير دائماً ولاتحرمينا متعة التواصل مع كلماتكِ الطازجة ..<br />محبتي لكم جميعاً يا أولئك الواقفون على السلك، والحالمون بالرجوع<br />وإلى هؤلاء الذين ينبضون حباً وعشقاً لمن لا نقدر على الوفاء لهم مهما قدمنا ...<br />دمتم رائعين /<br />هبة"
