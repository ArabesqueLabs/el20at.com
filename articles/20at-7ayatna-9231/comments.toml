text = "ابنتي العزيزة / هبة محمد الأغا، أقرأ لكِ كمن يقرأ في كتاب مفتوح ، فإن كنت في السابق كاتبة عادية فأنتِ اليوم كاتبة على مستوى عالٍ من الفنية ، وهذا ليس مجاملة بل هي الحقيقة ، فتميزك في فن الكتابة يجعلك تكتبين بكل الشفافية والصدق ، حتى لو كان ذلك مقرون بالوجع ومختلط بالدموع ، أتمنى لك النجاح والتوفيق وأكيد ستفتح المعابر يوماً ما ، وتنتهي الغربة والألم ، لكن صبراً صبراً فالفرج قريب إن شاء الله ، ويتبقى تلك الذكريات متقوقعة في النفس ، لا أريد أن أطيل فقط أردت أن أعبر عن إعجابي بأسلوبك الرائع في الكتابة ، كبير احترامي وتقديري لك أيتها العزيزة .<br />أبو عبد الله ."
