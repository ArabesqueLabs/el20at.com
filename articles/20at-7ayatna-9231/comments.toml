posted = "2008-06-24"
text = "السيدة الكاتبة المبدعة / هبة محمد الأغا حفظها الله<br />السلام عليكم ورحمة الله زبركاته وبعد :<br />زنبقة نبتت على شاطئ غزة ورحلت لتنشر العطر في بيوت العلم في خليجنا العربي :،<br />نعم هو الوجع الذي يمزق القلوب لمن كان في الداخل او كان في الخارج ، وقد لمست الجرح بحرفك المتمرد ، رحمة بنا ففينا الكثير من الجروح ، نعم يا ست هبة لويت عنق حزننا فأشعلتِ جذوة الحنين لجرحنا الغالي فلسطين الوط الحلم ، ولا نملك غير البكاء ، لقد قرأت إضافات مجموعة الأعضاء المحترمين فوجدت حروفهم تنبض بالحنين المتوج بالدموع ، حماكِ الله ورعاكِ ووفقكِ لكل خير أيتها الكاتبة المبدعة ، وحتماً ستعودين بحول الله وقوته شاء من شاء وأبى من أبى ، كيف لا وأنت أنفاس من الجنوب مفعمة بعبق الأرض النامي في أرض القداسة .<br />ولم يبق أيتها المبدعة غير الدموع نطرزها بالحروف .<br />عمو أبو عبد الله<br />خليل انشاصي<br />غزة / فلسطين ."
