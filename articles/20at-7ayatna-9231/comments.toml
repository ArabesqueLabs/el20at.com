subject = "خانيونس / الشارقة"
author = "هبة الأغا"
posted = "2008-06-02"
text = "تحية لكل من حط رحل قلمه وكتب ,,<br />عمو مصطفى / وقوفك جانب حرفي لاينسى،، شكراً لك أبد الدهر ,,<br />الحبيب / محمد : كن كما انت، ننتظرك في باحة الإبداع ، وأنت تصدح بشعرك ونثرك .. مرور غالي ..!!<br />أخت لورا / سعدتُ بمرورك، وسمع الله السميع العليم المجيب منكِ دعواتك ..<br />أخي محمد السيد : كلمات أرقتنا كثيرة، فضاقت بها مخبآت الصدور، فكتبنا ..شكراً لمرورك الطيب ..<br />د. أبو كامل : سنعود بإذن الله، وسيفرح الوطن بعودتنا محملين بالعيد من جديد .. مروركم رائق، ويسرني أن يكون قلمي وطنُ لكم ...<br />أخي أيمن الأغا / بورك فيك على المرور والقراءة، و ربما كان خروجي من غزة هو الذي جعلني أستشعر قيمة هذه المدينة، مع عدم موافقتك في ظروف المعيشة هناك، فالمتاح في غزة قليل، واسأل أهلها ورعيتها عما يكابدونه في ظل هذا الحصار ..<br />كان الله في عون الجميع ومحبتي لكل المارين والمعلقين، والذين سيمرون ..<br />دمتم في رعاية الله<br />ابنة غزة الأبية، والحاضنة لأشواقها ..<br />هبة محمد الأغا<br />مراسلة موقع عشرينات / الشارقة"
archived = "2010-03-14"
capture_url = ""

