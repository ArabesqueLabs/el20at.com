[[comments]]
order = 18
subject = "تحية لكل الذين مرّوا"
author = "هبة الأغا"
posted = "2008-06-15"
text = "ربيع الحياة .. حيّاك الله، وفرج الله قريب بإذن الله ...<br />محمد حمدان، سلامك واصل يا ابن عم، والكل بيسلم، ومبارح كنّا عند القرايب والحبايب .. ومبروك للجميع<br />حنين / تسرني رؤيتكِ دوماً، وأنتِ تتنقلين بين أروقة الكلام، تحياتي لقلبكِ الطيب. ..<br />Beautiful mind / thanx dear, welcome<br />أخي نائل/ حياكم الله، ولا ينال المرء إلا ماكتب له حقاُ، ولكنه الحديث عن الهم الجماعي،فمعظم الطلبة المغتربين يعانون كذلك ..<br />مواطن في غزة / حياك الله أخي على المرور والقراءة، والحمدلله تطمئنني بذلك على حال الأهل هناك، فحديثك عن توافر الأشياء طيب خاطري قليلاً، وجعلني أشعر بالراحة تجاه الحياة في غزة، ويطمئنني أكثر أنني حينما أعود لن أحرم الهمبرجر _ الذي لم أتذوقه في غزة أبداً، فلم أكن يوماً من أبناء الزواد _ والجلاكسي وغيرها .. ولكن يدهشني أن الكثير من الأصدقاء والأهل _ والذين بإمكانهم دفع المزيد من الشواقل لشراء ( الشوكولا ) _ للتخفيف _ يشكون من قلتها، ويتوجعون اشتهاءً لها ولمشتقاتها، ويبدو أنني سأدلهم عليك لتوافر الكثير لديك، ولعلك لا تعرف أنني أدرس في كلية الآداب / قسم اللغة العربية وآدابها ، ولا علاقة لي بعلم الذرة ... وكل البلاد مفتوحة أمام الطموح حتى لو كان لدراسة النفوس البشرية المتعبة ...<br />ابن البلد / أهلا بك أخي هنا وفي مدونتي، ولعله قد غاب عن ذهنك أن هبة حينما تكتب، لاتكتب لاجل ذاتها، حتى ولو كان عزفاً منفرداً، فالكثير من طلبة فلسطين المغتربين يعيشون تلك الحالة، وغزة كلها تتشابه في تفاصيل حياتها، كما المشاعر أيضاً .. الحمدلله ، لحظات الألم قليلة، ولحظات الإنجاز أكثر وأروع، والتميز حليفنا، و مشاعر الشوق لايمكن حبسها ... دمت بخير وحياك الله ...<br />موطن خانيونسي / أهلا بك وبكل اهل خانيونس الكرام، ويسرني كثيرأً رؤية اسم خانيونس على صفحتي .. ولكن أعد القراءة مرة أخرى .. أراك لحنت ..<br />تحياتي للجميع ، سلاماً ..."
archived = "2010-03-14"
