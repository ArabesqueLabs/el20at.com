[[comments]]
order = 4
subject = "سردية في حب الكتوبر"
author = "الطحاوي"
text = "بجد أدهشتني وانا باعتبرها اصدق سردية واجمل وصف قيل في تلك اللحظة لاسيما الفئة التي تحدثت عنها وغالبا ما تغيب في قصص الصعايدة والفلاحين وكان القاهرة ليس لهم نصيب احييك واحي روحك وقلمك البسيط السهل والعميق وياريت متحرمناش"
archived = "2007-10-14"
capture_url = "https://web.archive.org/web/20071014234035/http://masr.20at.com:80/newArticle.php?sid=11773"

[[comments]]
order = 5
subject = "اختراع"
author = "البراء أشرف"
text = "صباح الفل يا أستاذ أحمد.. خليني أقولك إن اللي حضرتك كاتبه ده اختراع.. واختراع جامد قوي.. مش عارف نقدر نسميه ايه.. يمكن سردية زي ما عمنا الطحاوي بيقول.. ويمكن \"شهادة\".. شهادة حقيقية على ماشي مصري جميل.. مليان ضحك ولعب وحب وحرب..<br />بقدر ما استفزيت دموعي في بعض الأسطر.. بقدر ما اجبرتني على نسيانها لأبدأ في الضحك على سطور أخرى، ورغم إني قرأت لك من قبل مقال أو اتنين على عشرينات زماااااااان.. الا اني أول مرة آخد بالي من عبقرية سردك وحكيك..<br />أستاذ أحمد انت بتكتب زي ما بتتكلم.. وأنت لما بتتكلم بتجبر اللي حواليك على الانصات والتركيز.. وده اللي حصل مع تدوينتك العبقرية دي.<br />أشكرك بقدر ما أدخلت على قلبي السعادة.. فأنا منذ فترة ابحث عن تدوينات تستحق القراءة.. ولا أجد..<br />سلام يا صديقي العزيز.. وعلى أمل اللقاء قريباً<br />براء"
archived = "2007-10-14"
capture_url = "https://web.archive.org/web/20071014234035/http://masr.20at.com:80/newArticle.php?sid=11773"
