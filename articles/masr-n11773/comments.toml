[[comments]]
order = 1
subject = "كانت مصر لسة مصر"
author = "مصرى"
text = "هى مصر دلوقتى كانت زى مصر ايامها ؟<br />كان كيلو اللحمة بجنية واحد<br />ورغيف الخبز بقرش تعريفة<br />والجريدة بتلاتة تعريفة والبيبسىكولا بتلاتة تعريفة وكيلو الرز ب 5 صاغ وتذكرة القطر من القاهرة لاسكندرية ب 35 قرش<br />ولتر البنزين بشلن يعنى خمسة صاغ<br />كان كل خريج بيلاقى وظيفة محترمة<br />كان كل يوم بقيتفتح 3 مصانع<br />كان الجيش للجميع ابن الغفير وابن الوزير فى نفس الصف لابس كاكى ومفيش واسطة<br />كانت مصر مهزومة بس عفية<br />كانت المعتقلات فاضية والسادات خرج الكل والاخوان المسلمين برة المعتقلات<br />وكانت صيحة القتال للمسلم والمسيحى اللة اكبر<br />لاول مرة فى تاريخ مصر ييجى العيد والناس متعملش كحك علشان العيال بتحارب وفيهم ناس ماتت<br />كانت مصر المؤهلات العليا دخلوا الجيش وبقوا ضباط احتياط<br />كان العدو واضح ومعروف ومحدد<br />كان فية فلاح شرقاوى اسمة عبد العاطى صائد الدبابات ضرب لوحدة 22 دبابة<br />وكان فية الرائد محمد المشد<br />وكان هناك كل ولاد الارض من القرى والنجوع والكفور من بحرى والصعيد<br />وكان لازم ننتصر<br />وغنت شادية يا حبيبتى يامصر<br />ومصر كانت حبيبتنا<br />لانة كانت مصر لكل عيالها مش لفئة الحرامية<br />تحية لكل مصرى كان بيركب ظهر القطار ايامها علشان ينزل من الجبهة يشوف امة ويرجع تانى<br />لاول مرة فى تاريخ مصر الحرامية والنشالين ما يسرقوش ايام الحرب ولم تسجل اقسام الشرطة حالة نشل واحدة طوال ايام الحرب - سلام لكل رفاق الحرب القدامى<br />الجنة للشهداء<br />ولا نامت اعين الجبناءذ"
archived = "2007-10-14"
capture_url = "https://web.archive.org/web/20071014234035/http://masr.20at.com:80/newArticle.php?sid=11773"

