text = "يا حبيبى دى انفجار امريكانى<br />شوية بوليتيكا يا خبيبى - زى الافراج عن الواد ايمن نور<br />يعنى علشان النظام ياخد شوية عطف وحنان من برة - قبل الزيارة لامريكا - يعنى ونلم شوية عيال نحاكمهم ونهدى الانفجارات جوة البلد شوية<br />طيب مثلا اخبار اضراب المحامين اية النهاردة - اقلب يا ابا<br />كلة بوليتيكا"
