text = "ايوة احنا بنعارض النظام الحاكم وهو بيستغل كل امكانياتة وجهودة لمحاربة الاخوان لانة عارف انة هما الوحيدين المؤهلين لادارة وحكم البلد لكن بنحب مصر وحندافع عنها وحنقطع كل ايد اجنبية تلعب بامن البلد وحنقف فى صف الحكومة ضد من يزعزع الامن والاستقرار وقطع ارزاق خلق اللة وبعد ماتعدى الازمة ان شاء اللة حنقف شوكة فى زور الفساد ونواصل طريقنا فى سبيل الاصلاح والتغيير للافضل حبا ووفا لمصر"
