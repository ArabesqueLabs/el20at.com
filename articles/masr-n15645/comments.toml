[[comments]]
order = 0
subject = "اضراب لمين ؟ وعلشان اية ؟ الشعب مش حاسس"
author = "واحد خارج من المعتقل بعد 6 ابر"
posted = "2008-05-06"
text = "اضراب اية ولية ؟<br />هتضرب علشان مين<br />شعب جبان عايش فى غيبوبة<br />الزموا حدودكم<br />نحن كشعب تعودنا ان نكون عبيد<br />الانجليز احتلوا مصر ب 5 الاف عسكرى<br />وعمرو ابن العاص فتح مصر ب 3 الاف عسكرى<br />والفاطميين دخلوا مصر وحكموها بزفة دخلت البلد من غير ما حد يقول لهم رايحين فين<br />دا شعب ميؤس منة<br />اصلح حاجة لة ضرب الحذاء - وقد يكون حذاء امن مركزى او مباحث المهم ان ينضرب بالحذاء من غير ما يثور<br />اسرائيل احتلت سيناء فى 6 ساعات<br />والان لو ارسلت فرقة موسيقى الجيش الاسرائيلى لوصلت الى القاهرة والشعب يصفق لها<br />الناس حاسة بالياس<br />شعورى كلة مرارة<br />لا امل"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510093940/http://masr.20at.com:80/newArticle.php?sid=15645"

[[comments]]
order = 1
subject = "ولانة نظام حكم الامن المركزى - الحصاد صفر"
author = "جاهل"
posted = "2008-05-06"
text = "حسنى وشوية الحرامية بتوع الجباية هيقعدوا على خاذوق<br />هم رفعوا الاسعار علشان يزودوا الايرادات ويجمعوا الفلوس مش علشان 30 %<br />لا دى علشان سوزان تسافر كل اسبوع بطيارة لبلد ومعاها حاشية من 3 الاف واحد تتسوق وتشترى وتشد الوش العكر وتحضر مؤتمر مش عارف اسمة اية حرنكش ويعطوها جايزة اطفال الشوارع فى مصر<br />وحسنى يقعد فى الشرم يعزم من هب ودب ويؤكلهم جمبرى بالملايين<br />محصلة كل الزيادات دى مش زى حسابتهم<br />اية اللى هياخدة الريح من البلاط<br />الناس ليس معها اى حاجة تصرفها<br />اللى كان بينزل مشوارين هيبقى مشوار واحد<br />صدقونى بعد كم شهر الحكومة هتواجة نفس المصير<br />مش هتقدر تدفع مرتبات الناس<br />الانهيار قادم<br />هنبقى فرجة العالم<br />وهتحصل ثورة الامن المركزى تانى<br />البلد هتولع"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510093940/http://masr.20at.com:80/newArticle.php?sid=15645"

[[comments]]
order = 2
subject = "ايها المصريون كفوا عن النضال"
author = "مش رضوى حسن ولا دودي ام ننوشه"
posted = "2008-05-07"
text = "يا جماعة ما تتعبوش نفسكم<br />طول عمر المصري من ايام حتشبسوت ومينا ورمسيس بيدفع ضرايب وجباية وبس ولما جم رجالة الثورة زاد عليهم اكرامية وتفتيح مخ مفيش فايدة<br />وبعدين طول عمر مصر فيها مناضلين وما حدش بيوصل للحكم زي مصطفى كامل وسعد زغلول واحمر عرابي تعبوا نفسهم على الفاضي وبعد نضالهم الكبير كانت النتيجة مجرمين ثورة 23 يوليو<br />جمال عبدالناصر<br />السادات<br />جمال سالم<br />صلاح سالم<br />صلاح نصر<br />اعوذ بالله من الشيطان الرجيم"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510093940/http://masr.20at.com:80/newArticle.php?sid=15645"

[[comments]]
order = 3
subject = "بردية ايبور فى متحف لندن عن فرعون"
author = "مش شايف"
posted = "2008-05-07"
text = "من سبعين سنة بس اكتشفوا بردية مكتوبة باللغة الهيروغليفية لكاتب فرعونى بيوصف الحالة اللى كانت مصر عليها وقتها من 3 الاف سنة ويمكن لسة زى ماهية لغاية دلوقتى<br />البردية بتقول<br />النص<br />اصاب الدمار البلاد وضرب الجفاف والضياع مصر وعم الخراب وانقلبت المسكونة وكل ماكان بالامس هنا موجودا بات غير موجود - اصاب الارض التعب والخراب كما لو كانت ارض كتان قطعت اعوادة<br />ماتت الاشجار ما عادت تثمر وما عادت الارض تخرج الكلأ وانتشرت الحرائق واخترقت البوابات والابنية<br />انعدمت مصادر العيش وخلت المخازن من القمح والشعير والطيور والاسماك وفسدت وانعدمت الحبوب فى كل مكان لا شىء هنا - لا شىء سوى الجوع<br />هذا كتب قبل 3 الاف سنة<br />اما القرأن المنزل من رب العباد<br />بسم اللة الرحمن الرحيم<br />ولقد اخذنا ال فرعون بالسنين ونقص من الثمرات لعلهم يذكرون<br />وقال تعالى<br />وقالوا مهما تاتنا بة من اية لتسحرنا بها فما نحن لك بمؤمنين فارسلنا عليهم الطوفان والجراد والقمل والضفدع والدم ايات مفصلات فا استكبروا وكانوا قوما مجرمين<br />والتعليق<br />ان ربنا ارسل علينا الان الجراد اللى هم المثتثمرون الحرامية والقمل مثل احمد عز وجمال مبارك والضفدع حسنى والدم مراتة"
archived = "2008-05-10"
capture_url = "https://web.archive.org/web/20080510093940/http://masr.20at.com:80/newArticle.php?sid=15645"
