order = 0
subject = "ببغاوات الحكومة"
author = "ابو اسامة"
text = "ايوة هنا بقى تبتدى ببغاوات الحكومة تتكلم وتقول عن القيم والاخلاق اللى ميعرفوش عنها اى حاجة<br />ويبرروا الغش والتزوير اللى هما عارفين انه هيحصل ويتزرعوا بالشرف والفضيلة ومصر هى امى وهما<br />كل همهم بردو الدولارات الغير مباشرة يعنى ايه غير مباشرة يعنى من امريكا للحكومة ثم للببغاوات والهتيفة<br />بتوعها يعنى امريكا لازم تبصيها للحكومة علشان تبقى حلال وبكدا تبقوا يا عزيزى كلكم لصوص ومكشوفين<br />يعنى متفكرشى ان الكلام الاهبل اللى انت كتبه حد هيصدقوا فى ناس لسة بتفكر انتوا اللى بقيتوا اغبية ومش حاسين"
archived = "2008-04-04"
capture_url = "https://web.archive.org/web/20080404174316/http://masr.20at.com:80/newArticle.php?sid=14942"
