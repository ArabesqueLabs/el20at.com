subject = "قوة العدو هى السبب"
author = "مصرى"
posted = "2008-01-23"
text = "لماذا تعربد اسرائيل وتفعل ما تشاء بغير حساب لاى كان ومن يكون ؟<br />انها القوة الكاسحة<br />قوة السلاح - المدرعات والطيران والتدريب<br />وضعف من حولها من الدول الهزيلة يجعلها تتمادى اكثر<br />مطلوب ان نملك قوة رادعة يعمل لها الف حساب<br />مطلوب قوة تجعلها تخاف من جيرانها كما تخاف من حزب اللة<br />املكوا زمام القوة<br />فلا حق لضعيف او مكسح"
