[[comments]]
order = 1
subject = "معك يا(مبارك) اما الحزب(الوطنى الديمقراطى)فلالالال"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-01"
text = "نحن معك يا مبارك رئيسا للوطن وللنظام و للديمقراطية<br />نعم نحن معك يا مبارك سلطة و شرعية و نظام انت خير من يمثلنا<br />اما الحزب(الوطنى الديمقراطى)فلا و الف مليون لا و لا<br />قيادات الحزب الوطنى بالاسكندرية تدير الحزب و كانة (تركة الباشا بابا)و طابونة العيش بتاعة ابيهم<br />من اجل مصر تدخلوا لاصلاح ما اسفدته قيادات الحزب الوطنى الديمقرطى بالاسكندرية؟<br />قيادات الحزب تعمل فى السر على اقصاء المصريين المسحيين عن المشاركة فى الحياة السياسية<br />نحن معك يا مبارك الى اخر الدرب من اجل مصر و رفعتها و تقدمها<br />مبارك اللة معك و نحن و رائك رئيسا و قائدا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "الى الحيوان اللي فوق المسمي نفسه زخاري"
author = "اكتب اسمك هنا"
posted = "2008-11-01"
text = "يا حيوان يا غبي انت بتناقض نفسك<br />بتمدح في مبارك وبتشتم في حزبه<br />والله انت حمار يا اخي<br />الله يكون في عون الست اللي متجوزه حمار زيك"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "و انت مال اهلك زعلان كدة؟هو حزب ابوك و لا لمؤاخذة"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-01"
text = "و انت اية اللى مزعلك؟<br />مبارك رئيس الدولة و اعلى راس فى الوطن<br />اما الحزب فهو مجرد حزب ذى كل الاحزاب الاخرى؟<br />ما كلهم اخوات و قرايب<br />فهمت يا غبى<br />واشكرك على غيرتك على الحزب<br />ملحوظة هامة:<br />(انا عضو فى الحزب الوطنى الديمقراطى؟و لكنى اختلف مع قيادات الحزب بالاسكندرية)<br />انا و لائى لمصر و لزعيم و رئيس مصر<br />, انا و لائى فقط للسلطة و الشرعية و النظام<br />و ليس للحزب؟<br />و لية اكذب؟<br />الصدق خير و منجاه"
archived = "2010-03-14"
capture_url = ""

