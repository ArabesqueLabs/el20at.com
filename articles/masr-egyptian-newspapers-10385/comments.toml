author = "كسرولة الغرام"
posted = "2008-11-02"
text = "لازم نعرف انة اى حد عندة قط وبياكلة كويس اكيد حيبقى فى النهاية خائن وخايب لان دى طبيعة القطط والقط الممتاز اللى شغال بكل امانة واخلاص تلميع ومسح جوخ لسيدة وولى نعمتة والا حيترفد ويقعد فى البيت او يطلع معاش فياريت يريحنا القط الممل دة ويبعت سمومة وهمومة لسيدة على طريقة رسائل خاصة غير قلبلة للنشر لان اللى بيحصل دة عيب واللة عيب رئيس تحرير موظف عندة وبيمجد فى انجازات ماشفهاش غير خيالة المريض"
