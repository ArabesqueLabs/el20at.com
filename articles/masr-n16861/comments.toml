[[comments]]
order = 4
subject = "من لا يحترمنفسه فلا ينتظر من الناس احتراما"
author = "صرخه حره"
text = "أنا وان كنت أرى أن المقال تم تناوله باسلوب ساخر مبالغ فيه الا أن ما ورد به - ويؤسفنى ان اقول ذلك - حقيقه لا يجب ان نغفل اعيننا عنها فنكون كالنعام الذى يدفن راسه فى الرمال ظنا منه ان الصياد لن يستطيع رؤيته وهو على هذه الحال<br />يا اخوانى أولى خطوات الاصلاح هى ادراك ان هناك مشكله وثانيها هى مواجه هذه المشكله وهذا المقال الذى نحن بصدده يواجهها فعلاما الاستناكر وقول انه ومن الواجب احترام العلماء -كانوا احترموا نفسهم هما الاول - يا اخى من لا يحترم نفسه فلا ينتظر من الناس احتراما<br />سلم قلمك أخى الرائع"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 5
subject = "أنا أزهرى"
author = "الدرعمى"
text = "أنا أزهرى ما حييت وإن أمت **** فوصيتى للناس أن يتأزهروا<br />ولكن أى أزهر نرجوه ؟<br />أزهر علماء السلطة أم أزهر محمد عبده والشيخ الشرقاوى ؟<br />فالأزهر الان أصبح كالشاب الذى كممت شفتاه وهو معول عليه إخراج الناس من ظلمات الجهل إلى نور الحرية والتنعم فى فهم الإسلام فهما صحيحا وليس فهما تخديريا ينأى بنا عن حقيقة الدين<br />التى تجمع بين الدين والدولة وليس مجرد أذكار وأوراد تتلى صباح مساء<br />لك من أستاذى كل التحية على هذا الأسلوب الساخر الجميل الذى يصل إلى القلب قبل العقل فى ثوان معدودات<br />وشكر الله لك ."
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

