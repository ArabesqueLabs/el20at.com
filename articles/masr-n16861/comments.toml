[[comments]]
order = 12
subject = "ضع عنوان التعليق"
author = "أكرم سليمان - تمهيدي ماجستير"
text = "المغفلين اللي مكفرين صاحب المقال ، ومن ردوا ردا إيجابيا علي الرجل<br />لو نظروا بموضوعية للمقال ، وبدون تشنج أو انفعال فيه حاجتين ظاهرين جدا<br />أولا : الرجل بيتكلم عن وضع سيئ شايفه كل المصريين اللي بيصلوا وبيحضروا الجمعة وبيشوفوا العاهات المرمية من وزارة الأوقاف - إلا ما رحم ربي -<br />ثانيا : ان الرجل عايز يرجع بالمؤسسة الأزهرية لما كانت عليه من قبل كمؤسسة تعليميه وأكاديمية أخذت علي عاتقها نشر الفكر الوسطي ، وأنها في مرحلة كبيرة من التاريخ تصدت لمحاولات طمس الهوية ، وإحتلال وإغتصاب البلد ( مثال التصدي للحملة الفرنسية - خلع الوالي الفاسد خورشيد باشا وتوليه محمد علي مكانه- ثورة 19 ....ووو )<br />ان الأزهر جف عن إخراج قيادات ذات عقل واعي بهموم ومشكلات الوطن الذي نعيش فيه ويظهر ذلك جيدا في كلامه الأخير بالمقال ألا وهو<br />مدخلان أخرجت لنا مخرجات الخطاب المستأنس والفتاوى المسيسة عن تأثيم من لم يخرج في استفتاءات التعديلات وانتخابات الرئاسة، ولا ندرى لماذا لم يخرج لنا الشيوخ الجهابذة فتاوى في عدم إسناد الأمر لغير أهله، وحكم من سرطن العباد والبلاد.. أم هم خرس في عالم السياسة وقول الحق!.. فصحاء بلغاء في رضاع الكبير وطهارة وشرب بول النبي وجواز جماع الخادمة لأنها في منزلة الأمة والجارية.<br />رضي الله عن العز بن عبد السلام الذي هجر مصر لتدخل الملك الصالح أيوب في قضية نُظرت أمامه، سلام الله علي شيوخ وعلماء الأزهر الكرام الشرقاوي وعمر مكرم ومحمد عبده والمراغي والغزالي.. ولن أقل سلاما على عمائم السلطة.. ومشايخ الفتة!"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 13
subject = "نحب الأزهر محمد عبده والغزالي وليس أزهر طنطاوي وزقزوق"
author = "محمد صبحي"
text = "جزاك الله خيرا على هذا الموضوع<br />أحب أن أنوه إلى السادة المتشنجين من الموضوع بأن الأستاذ أحمد لا يريد الاستهزاء بالأزهر بقدر ما هو يريد أن يتحول الأزهر لخدمة مصر والمقاومة في شعبها المقهور<br />في ظلم الحاكم المستبد<br />في تخريج دعاة يسبحون ويحمدون للحاكم<br />في محاربة الفساد<br />في اهتمامهم بأمور الحياة كلها وليس السجادة والمسبحة<br />والأستاذ أحمد رجل خريج من الأزهر ويرى أن الأزهر كمؤسسة مستقلة هي عظيمة لحد ذاتها<br />لكن كونها تكون بوق للحكومة ومرتع للطنطاوي وزقزوق بس هذا يعد سبة في جبين الأزهر<br />يا جماعة يجب أن نفرق بين الأزهر الذي خرج محمد عبده والغزالي والقرضاوي قديما<br />وبين أمثال المشايخ المطبلين للحاكم الظالم والدعاة الذين لا يفقهون أدوات الدعوة الحق والذين يعيشون بالمستمع في الخطبة إلى مجاهل الأزمان والتاريخ والذي هي حق--الخطبة-- ساعة نوم يقضيها المستمعون في المسجد"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 14
subject = "رأى حـــــر مبــاشـــــــــر"
author = "مجهــــــــــــــول"
text = "اخى فى الله ، اتفق معك وقد لا اتفق معك فى كل ماقلت ، فإن المعيار الاحصائى لا يصلح حكجه لإنتفاء الصفه او نقض المبدأ ، فهذا رجل ازهرى قد يحلل علينا الخمور من اجل السياحه واخر قد يبيح الزواج بدون ولى او شهود مستندين بذلك على مصطلحات تدعوا للسخريه كالدين لله والوطن للجميع ، فهم علماء الفتنه ومشايخ السلطه ولكى اكون واضح اكثر ولا نغفل ان الازهر اخرج علينا الكثير والكثيير من العلماء والداعيين الذين لهم هيبتهم فى العالم الاسلامى فالأزهر يا اخى منارة العلم وقلعه العلماء وكعبة العلم والخطباء فى العالم الاسلامى فكفا بنا الشيخ محمد عبده والشيخ الشرقاوى والشيخ الشعراوى فهم اعطوا للدين الاسلامى واعطوا للعالم الاسلامى اكثر مما تستطيع تقديمه بقلمك الساخر ولكنى اتفق معك ان ما ورد بالمقال وما تناولته بأسلوب ساخر فإنه فيه من الحقيقه ( وللأسف ) ولكن لابد وان نحترم انفسنا وان نحترم علمائنا وازهرنا اكثر من ذلك فالأزهر اكبر بكثير من ان نجعله موضوع للمناقشه وان نكتب مقال وننتظر الرد عليه فإن علمائنا من افضل العلماء فى العالم الاسلامى ويكفينا ان علمائنا يعلمون الدين لكل العالم الاسلامى وعلى رأسهم السعوديه ولك رموز توضح ذلك على سبيل المثال كالشيخ الشعراوى رحمه الله ، فكيف نأخذ قلة من العلماء الفاسدين رموز لنا وللأزهر وعندنا ما يكفى مما قدمه الازهر للاسلام والمسلمين فـ للأزهر مواقف ايجابيه تجاه الامه الاسلاميه تكفى بكثير من ان نضعه محل نقاش وحتى ان كان الازهر محل نقاش لا يمكن بأى سبيل ان تطرح هكذا علنا فالأزهر اكبر بكثير من ذلك ، فإذا كان لا يعجبك اسلوب الخطباء فى المسامجد فلك الفرصه ان تقدم افضل مما يقدمون فى المساجد بدلاً من ان تطعن وتسب فى الأزهر والعلماء والخطباء فافعل ما لايفعلون ..."
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 15
subject = "لماذا لا نعترف بالحقيقه"
author = "لست ازهرريه ولكن مسلمه"
text = "الى كل من علقوا بالسلب او بالسخريه او بالادعاء ان من يريد اصلاح الازهر قبطي<br />انا كمسلمه لا ارى دورا للازهر ولو كان له دور فهو خفي جدا<br />ما دوره في الصعيد الذي يقومون الاقباط بتنصيره<br />وبالتعليق على الخطب ارى ان خطبائنا الافاضل لا يملكون القدره على القاء خطاب ديني شامل يظهر الاسلام في صورته الجميله الحقيقيه.<br />ارجو بدلا من دفن رؤسنا كالنعام علينا ان نعترف بالحقيقه ونحاول اصلاح ازهرنا واعادته منبرا يتعلم فيه المسلمون الاسلام الصحيح كما كان دوما."
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 16
subject = "الى لست ازهرريه ولكن مسلمه"
author = "مش ساكت"
text = "يا اخت ازهرية ولكن مسلمة بصي في الصورة كويس<br />مكتوب (جامعة الازهر)<br />الازهر اللي انتوا بتتكلموا عنه كان اسمه (الجامع الازهر) وليس جامعة الازهر<br />(الجامع الازهر) كان فيه ثلاث كليات فقط 1) لغة عربية، 2) اصول دين‘ 3) تاريخ اسلامي<br />وكان الجامع الازهر قبلة العلم في العالم الاسلامي كله على مدار الف سنه<br />جه عم جمال عبدالناصر اللي بريطانيا سلمته الحكم علشان خاطر يخرب ويدمر<br />وقال عايزين نعمل جامعة الازهر تضم كل الكليات علشان خاطر نطلع الطبيب الفقيه والمهندس الفقيه والمحاسب الفقيه كذبا<br />وفعلا عمل جامعة الازهر ونقل الثلاث كليات الازهرية الى جامعة الازهر<br />وبدل ما كان اللي عايز يدرس في الجامع الازهر تاشيرة الدخول هي حفظ القران الكريم كله<br />انتهى هذا الشرط<br />واصبح الثلاث كليات المتخصصة في الدعوة اصبحت ثلاث كليات عادية جدا واصبحت جامعة الازهر كجامعة عين شمس او القاهرة<br />حنعد نشتم في الازهر واللي جابوا الازهر وهما ما لهمش ذنب في حاجه<br />الدكتاتور جمال عبدالناصر هو اللي عمل كده<br />مين يقدر يرجع (الجامع الازهر) مرة ثانية ويعيد اليه الثلاث كليات ويعيد حفظ القران الكريم كله قبل الدخول الى الجامع الازهر<br />حد يقدر يعمل كده<br />لكن عيب بأه لما اشتم في الازهر وطنطاوي وزقزوق لان دول علماء برضه<br />والدولة هي اللي فرضت عليهم كده<br />واذكركم بالمفتي السابق نصر فريد واصل<br />اتكلم كلمه ما عجبتش الحكومة طيروه من الافتاء على طول<br />والموضوع طويل اوي وشائك ويطول شرحه<br />لكن احنا بنقول للناس التافهة اللي مش فاهمة حاجه واللي بيقولوا علماء السلطة وشيوخ الفته<br />باباوات النصارى قاعدين طول النهار في الكنيسة ما ورهمش حاجه غير الاكل والشرب<br />ومع ذلك النصارى عملهم ما قالوا عليهم باباوات الفتة<br />عيب هذا الكلام"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 17
subject = "يا جماعة أنا أقصد الكلام ده"
author = "أحمد عبد الحميد aa_hameed@hotmail.com"
text = "الإخوة اللي مكفنري ومكفرين أهلي علشان موضوع الأزهر<br />يا ريت نشوف إستطلاع ارأي ده<br />نازل في اسلام أون لاين وياريت نقرا كلام المشايخ والدعاه المذكور كلامهم في الإستطلاع<br />استطلاع: 37% من المصريين يقاطعون خطبة الجمعة<br />شريف الدواخلي<br />Image<br />علماء بالأزهر حملوا الخطباء المسئولية<br />الأكبر في تزايد أعداد مقاطعي خطب الجمعة<br />القاهرة- أظهر استطلاع رسمي للرأي في مصر أن 37% من المصريين لا يحضرون مطلقا خطبة الجمعة، فيما تزايدت أعداد الذين يمتنعون عن حضور الدروس الدينية بالمساجد لتصل إلى 61%.<br />وأعرب خبراء وعلماء دين بالأزهر في تصريحات منفصلة لشبكة \\\"إسلام أون لاين.نت\\\" اليوم الأربعاء عن صدمتهم من ارتفاع نسبة مقاطعي خطبة الجمعة، فيما لفت بعضهم إلى أن نسبتهم قد تصل إلى 80%، وطالبوا بضرورة دراسة أسباب هذه الظاهرة لمعالجتها.<br />واتفق هؤلاء على أن ضعف مستوى الخطباء، وعدم ارتباط الخطبة بواقع المسلمين الحالي، وراء ارتفاع هذه النسبة.<br />طالع:<br />* نص نتائج الدراسة<br />وجاء في نتائج الاستطلاع، الذي أجراه مركز المعلومات ودعم اتخاذ القرار بمجلس الوزراء، على 938 مبحوثا من جميع محافظات الجمهورية، أن 63% منهم يحضرون خطبة الجمعة سواء بشكل دائم أو أحيانا أو نادرا، فيما لا يحضرها مطلقا 37%.<br />وبالنسبة لمتغير العمر، ارتفعت نسبة من يحضرون الخطبة في الفئة العمرية 60 عاما فأكثر، لتصل إلى 72%، مقارنة بـ 62% بين الفئات الأصغر من 40 - 50 عاما، و53% بين الفئة من 30- 40 عاما، و64% بين الفئة من 18 سنة إلى أقل من 30 عاما.<br />المستوى التعليمي كان متغيرا مؤثرا أيضا؛ حيث ارتفعت نسبة من يحضرون الخطبة من ذوي المستوى التعليمي المرتفع لتصل إلى 69%، مقارنة بذوي المستوى التعليمي المتوسط 62%، وذوي المستوى التعليمي المنخفض 58%.<br />وأكدت النتائج عدم وجود علاقة تذكر بين نسبة من يحضرون الخطبة من حيث توزيعهم الجغرافي والإقامة بالحضر أو الريف.<br />وأجري هذا الاستطلاع الذي حصلت \\\"إسلام أون لاين.نت\\\" على نسخه من نتائجه، في مايو الماضي، بناء على دعوة أطلقتها وزارة الأوقاف لبحث المتغيرات الحياتية التي تعرقل توصيل رسالة الإسلام الصحيحة إلى كل أفراد الأسرة.<br />ظاهرة خطيرة<br />معلقا على نتائج الاستطلاع، قال الدكتور المحمدي عبد الرحمن، أستاذ التفسير بكلية أصول الدين بجامعة الأزهر: إن وصول نسبة من يقاطعون خطبة الجمعة إلى 37% هو \\\"أمر خطير ينبغي دراسته\\\".<br />وعن أسباب ارتفاع النسبة، قال د. عبد الرحمن: \\\"أهمها تكرار موضوعات الخطب، وضعف ثقافة الدعاة، وعدم معايشتهم لمشاكل الجمهور\\\".<br />ومع الرأي السابق يتفق الدكتور عبد المعطي بيومي، عميد كلية أصول الدين، وعضو مجمع البحوث الإسلامية، غير أنه اعتبر أن نسبة من لا يحضرون الخطبة أكبر من ذلك بكثير، وربما تصل إلى 80%، بحسب تقديره.<br />ورأى د. بيومي أن الانشغال بالعمل في الحضر وراء ارتفاع هذه النسبة، وطالب في الوقت نفسه بأن \\\"يتحلى الدعاة بالمعرفة الكاملة لحقيقة الدين من منابعه الشرعية، ليكون لدينا جيل جديد يستطيع الذود عن الإسلام أمام الغرب، وتعود ساحات المساجد ممتلئة\\\".<br />الخوف من التنكيل الأمني<br />أما الدكتور محمد المهدي، استشاري الطب النفسي بجامعة الأزهر، فأرجع تناقص عدد من يحضرون خطبة الجمعة إلى \\\"عدم وجود شخصيات كاريزمية تلتف حولها الجماهير، مثل الشيخ كشك، وإبراهيم عزت، والمحلاوي، علاوة على تفريغ الخطب من الموضوعات التي تمس حاجات المسلمين\\\".<br />ولفت د. المهدي إلى عوامل أخرى مثل \\\"خوف الشباب من كثرة التردد على المساجد حتى لا يتعرضوا للتنكيل الأمني، وقصر وقت الخطب إلى 20 دقيقة بحسب قرارات وزارة الأوقاف، وإغلاق المساجد بعد الصلوات الخمسة مباشرة\\\".<br />وفيما يتعلق بالدروس والندوات الدينية، أظهر الاستطلاع أن 39% من العينة يحضرون الدروس بالمساجد سواء بشكل دائم أو أحيانا أو نادرا.<br />بينما قال 61% إنهم لا يحضرونها مطلقا، في حين أكد 72% أنهم لا يحضرون الندوات الدينية التي تعقد خارج المساجد، بينما يحضرها 19% من المبحوثين.<br />وللعوامل الديموجرافية تأثيرها في هذه المسألة؛ حيث تصل نسبة حضور الدروس الدينية بالمساجد بين الذكور إلى 43%، مقارنة بـ17% للإناث، بينما تبلغ نسبة حضور الذكور للندوات الدينية خارج المساجد 24% مقابل 14% للإناث.<br />وبلغت نسبة من يحضرون الدروس بالمساجد من ذوي المستوى التعليمي المرتفع إلى 30%، مقارنة بذوي المستوى التعليمي المتوسط 34 %، وذوي المستوى التعليمي المنخفض 24%.<br />أما فيما يتعلق بالندوات، فتشير النتائج لعدم وجود علاقة بين المبحوثين الذين يحضرونها وبين فئاتهم العمرية ومستوياتهم التعليمية.<br />وزادت نسبة حضور الدروس الدينية بمحافظات الوجه البحري والحضري، مقارنة بالوجه القبلي (الصعيد)، وارتفعت النسبة في الريف مقارنة بالحضر، ونفس الأمر بالنسبة للندوات الدينية.<br />ضيق الوقت<br />أهم أسباب عدم حضور الدروس والندوات الدينية تجسدت في ضيق الوقت، والانشغال بتربية الأولاد، بنسبة بلغت 54%، تلاها عدم عقد الندوات والدروس الدينية بأماكن قريبة 17%، ثم الظروف الصحية 7%، وأن العادات والتقاليد تمنع خروج السيدات 6%، وتفضيل متابعة الندوات بالتلفزيون 5%، وأخيرا عدم وجود أماكن مخصصة للسيدات 4%.<br />وأبدى المبحوثون استعدادهم لحضور ندوات ودروس دينية في المستقبل بنسبة 61%، ووصلت النسبة بين الذكور إلى 61%، بينما اقتصرت بين الإناث على 50%.<br />وارتفعت النسبة في الفئات العمرية الأصغر من 18 إلى أقل من 30 لتصل إلى 64%، أما النسبة من 30 إلى أقل من 40 سنة فبلغت 72%، مقارنة بالمبحوثين من 60 سنة فأكثر؛ حيث وصلت 38%.<br />وبالنسبة لمستوى التعليم ارتفعت النسبة بين ذوي المستوى التعليمي المرتفع والمتوسط إلى 68%، مقارنة بالمنخفض 52%.<br />وعن العوامل الجغرافية، أوضحت النتائج أن نسبة المستعدين لحضور ندوات ودروس دينية ارتفعت في الحضر إلى 68%، والوجه البحري 62%، مقابل 56% بالوجه القبلي، بينما لا يوجد تفاوت بين المبحوثين من حيث الإقامة بالحضر والريف.<br />ويفضل 82% من العينة تنظيم هذه الندوات والدروس في المساجد، و52% أن يكون موعدها في شهر رمضان، و47 % يوم الجمعة، و30% بعد صلاة المغرب، و25% بعد صلاة العصر، و22% بعد صلاة العشاء.<br />الإنترنت والتلفزيون<br />واتفق عميد كلية أصول الدين بجامعة الأزهر مع نتائج الاستطلاع في أن انخفاض نسبة حضور الدروس والندوات الدينية يرجع لضيق الوقت، وانشغال المسلمين بأعمالهم؛ حيث يمكنهم الاستماع لها عبر الإنترنت والتلفزيون.<br />أما ضياء رشوان، الخبير بالحركات الإسلامية في مركز الدراسات السياسية والإستراتيجية بالأهرام، فوصف نسبة عدم حضور المبحوثين للدروس والندوات الدينية (61%) بأنها \\\"معقولة\\\"؛ نظرا \\\"لأنها عبادة تطوعية لا يشعر المسلم أنه سيأثم إن لم يحضرها عكس خطب الجمعة\\\".<br />واعتبر رشوان أن \\\"هناك قيودا على الدروس الدينية أكثر من خطب الجمعة، وهو ما يفسر قلة عدد من يحضرون الدروس مقارنة بخطب الجمعة\\\".<br />وعن رأيهم في الخطاب الديني، طالب المبحوثون بضرورة التطرق إلى سلوكيات الشباب والصلاة بنسبة 20% لكل منهما، بينما حلت التعاملات بين الناس في المرتبة الثالث بنسبة 15%، تلتها الأحداث الجارية 12%، والقرآن والسنة والسيرة 11%، وفقه المرأة وواجباتها تجاه زوجها 10%، والزواج والعلاقات الأسرية 9%، والصوم 7%، والزكاة والصدقات 4%.<br />وجاء مقترح زيادة عدد الندوات الدينية والوقت المخصص لها في مقدمة مقترحات المبحوثين لتطوير الخطاب الديني.<br />وعن صفات الداعية، رأى المبحوثون أنه يجب أن يكون مثقفا، وواعيا بأمور الدين بنسبة 29%، وقادرا على الإقناع بنسبة 27%، وسهل الأسلوب 22%، ويتمتع بالصدق والأمانة 20%، وأخيرا أن يكون هادئا بنسبة 6"
