[[comments]]
order = 10
subject = "تعرف تقول وقبر حرب بمكان قفر وقرب قبر حرب قبر عشر مرات"
author = "بنت الازهر"
text = "مالها خطبة الجمعة يااستاذنا دا انت تبقى ف عز الايام اللى بيتبدبح فيها اخوانك من فلسطي والعراق ووو<br />وهنا ف الخطبة تلاقيهم بيتكلموا عن التيمم وفرضية النقاب والحجاب قبل الحساب !!!!كتر خيرهم<br />خايفين على حالتنا النفسيه .شعب فقرى مالهوش غير ف الهم والغم<br />كله كوم ووقفات الازهر كوم تانى انت نسيت يوم ماوقفوا جنب غزة ساعة مالنور اتقطع عنهم يانهار ابيض ياجدع دول سدوا شوارع مصر ويوم تعديل الدستور والاضراب يوم6 ابريل وسايبينلك فن محترم زى محمد سعد اللمبى واللى بالى بالك وكركر وكتكوت عاوزين يدخلوا السرور على قلوب المسلمين يااخى مش كفاية اللى احنا فيه<br />بس مالها بقى كلية لغة عربيه لا لحد كده واقف انا خريجه لغة عربيه وطول الاربع سنين صراحه الدكاترة مراعيينا ع الاخر تيجى اخر السنه يقرر عليك فصلين من الكتاب وانت بقى مع نفسك مش زى الدكاترة اللى ضميرها ناقح عليها وتطلع عين اهلك طول السنه<br />والله عندنا دكتور كان يدخل كل محاضرة يحكى عن نفسه وانجازاته واد ايه خدم اللغة العربية ياعم ارحمنا وادخل ف المنهج ولا حياة لمن تنادى<br />لكن كلمة حق(الا من رحم ربى)"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 11
subject = "الى بنت الازهر المعلقة السابقة"
author = "سكرتير البابا شنوده"
text = "ممتاز يا بنت الازهر<br />ايوه كده عايزنكم تساعدونا خلينا نستريح من الكابوس دا اللي اسمه الازهر<br />فوتي علينا في مكتبي في العباسية علشان خاطر احليلك بؤك وهاتي معاكي صحباتك<br />طبعا انتي عارفة مكتبنا في العباسية ما يتوهش<br />ما تتأخريش عليا سلام"
archived = "2008-07-23"
