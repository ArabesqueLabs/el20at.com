order = 18
subject = "مباحث امن الدولة وخطب الجمعة"
author = "شايف"
text = "اى خروج فى الخطبة عن الكلام المعتمد من الاوقاف يتم جر الخطيب الى مباحث امن الدولة بعد خطبة الجمعة مباشرة<br />وهناك عينة تشوف النور وما ادراك ما مباحث امن الدولة<br />ما يقال فى خطب الجمعة مرتب ومراجع مع مباحث امن الدولة<br />لماذا تلومون المشايخ اذا تحدثوا فى التيمم ورضاعة الكبير والسلام وحب الاخر واليهود اولاد ابراهيم قرايبنا بينما الفلسطنيون ولاد الجبارين المفترين ويجب حصارهم فى القطاع وضربهم وقطع رجلوهم اذا تخطوا الحدود<br />الازهر بخير<br />ولكن رجال مباحث امن الدولة بتعليمات من الشين بيت او الموساد يدمرون الازهر<br />لان الازهر المكان الذى يقول حى على الجهاد<br />اصطفوا خلف الازهر<br />انها محنة وهتعدى"
archived = "2008-07-26"
capture_url = "https://web.archive.org/web/20080726085137/http://masr.20at.com:80/newArticle.php?sid=16861"

