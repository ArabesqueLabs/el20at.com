[[comments]]
order = 0
subject = "ايه الجمال ده"
author = "سلماوي"
text = "لا<br />لا<br />لا<br />ايه الجمال ده يا جدعان ، الرجل ده أسلوبه ساخر بشكل فظيع<br />وصف بالظبط اللي بيحصل في الأزهر ، وما يحدث من مشايخ الخطباء اللي صدعوا دماغات أهالينا بالقصص المضروبة<br />والكلام المكرر ، والشعر الغير مفهوم ، والانفصال عن الواقع اللي عايشين فيه<br />سلم قلمك"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 1
subject = "عفارم عليك"
author = "كريم الشاعر"
text = "أنا عايز أقولك إن أنا كنت في جامعة الأزهر وفصلت نفسي بنفسي بعد أن كنت أعشق تراب الأزهر الشريف بسبب هذه المازل لأن الكليات التي تخرج داعية بالذات يجب أن يدخلها الطالب وهو راغب في دخولها حتي يصبح الطالب داعية متميز أما في جامعة الأزهر فهي تعتبر عقاب والسلام ختام"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 2
subject = "ايها المسلمون احترموا علمائكم كما يحترم النصارى باباواتهم"
author = "مش ححبك"
text = "ولن أقل سلاما على عمائم السلطة.. ومشايخ الفتة!<br />اول ما قرأت الموضوع تنبأت باخر سطر في الموضوع عمائم السلطة وشيوخ الفته<br />لو سمحت لا داعي لهذؤا الكلام وادعو الناس باحترام علماء الدين المسلمين كما يحترم النصارى باباواتهم وعلى راسهم البابا شنوده<br />وبعدين انت بتقول انك خريج ازهر وكلية عملية<br />طيب عيب عليك يا اخي بعد ان اصبحت تنتمي الى رابطة خريجي الازهر انك تطعن الازهر بهذا الشكل القبيح"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

