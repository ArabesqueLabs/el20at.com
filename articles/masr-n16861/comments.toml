[[comments]]
order = 7
subject = "حتى وقت تخرجي منذ خمس سنوات من جامعة الأزهر بإحدى كلياتها العملية"
author = "مش مش"
text = "هي دي المشكلة<br />علمنه الازهر<br />الشيخ كشك اللي حضرتك بتضحك عليه مرة خطب خطبة في الازهر<br />وقال ان طول عمره اسمه الجامع الازهر وفيه ثلاث كليات فقط لغة عربية واصول دين وتاريخ اسلامي<br />ولما جه جمال عبدالناصر خلاه جامعة الازهر وعمل كل الكليات علشان خاطر يضرب التلت كليات بتوع الجامع الازهر"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

[[comments]]
order = 8
subject = "ومين يطلع سي احمد عبدالحميد دا"
author = "مش بحبك"
text = "عايزين نتعرف بحضرتك طالما انت طايح في الازهر وعلماءه والطلبة والخريجين<br />ممكن نتعرف بحضرتك انت بتقول انك خريج كلية عملية يعني الكلية العملية دي ما لهاش اسم ولا عيب تقول اسم الكلية<br />فممكن نعرف اسم الكلية وانت بتشتغل ايه بالضبط<br />هذا ضروري لان عيب واحد يطعن في كلية بقالها 1000 سنه وهو مجهول النسب والهوية مثل حضرتك<br />الكلام اللي انت كاتبه دا انا قراته كتير في مواقع الاقباط كتير اوي اوي لأن انا متخصص مواقع اقباط وعلى راسهم موقع الاقباط متحدون بتاع (بلاش الكلب) القط عدلي ابادير وموقع تاني للخنزير مايكل منير وغيره كتير اوي<br />فاكيد انت شاب مش لاقي شغل ونفسك تتجوز ونفسك تعيش حياتك فملقتش غير الاقباط تشتغل معاهم<br />وفيه مسلمين كتير بيشتغلوا مع الاقباط وبيسبوا في الازهر وبيسبوا في السعودية وبياخدوا فلوس كويسه<br />اكيد انت اتجهت هذا الاتجاه انت زي اي شاب نفسك تتجوز ونفسك تشتغل بصيت حواليك لقيت ما فيش فايدة ولقيت ما فيش غير سكه واحدة بس تخرجك من اللي انت فيه دا هي سكة الاقباط اشتم في الازهر والسعودية والوهابية وتقبض فلوس كويسه تتجوز بيها وتأجر شقه وتعيش حياتك<br />الازهر يا بابا رغم كل مشاكله ولكن مازال حارق دم اليهود والنصارى بس شكل الجامع من بره<br />الازهر هو اللي عمل العالم الاسلامي بعد الفتوحات الاسلامية يجي في المرتبة التانية الازهر كعبة العلم في العالم الاسلامي<br />معندكش فكره الازهر دا حارق دم الاقباط القبطي دا ساعة ما بيسمع كلمة الازهر بيقطع في نفسه<br />الازهر هو اللي صنع العالم الاسلامي كله<br />يلا بأه اسيبك انا بقا لشغلك اكيد انت عندك معاك في الكنيسة دلوقتي<br />يلا باي"
archived = "2008-07-23"
capture_url = "https://web.archive.org/web/20080723100834/http://masr.20at.com:80/newArticle.php?sid=16861"

