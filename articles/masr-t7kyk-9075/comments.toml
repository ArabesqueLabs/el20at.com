[[comments]]
order = 1
subject = "المشكلة مش فى الغلاء - المشكلة فى تدنى المرتبات"
author = "ين هناك"
posted = "2008-05-15"
text = "الغلاء عالمى - كل واحد عارف كدة كويس<br />والغلاء فى كل دول العالم<br />يعنى مرتب الخريج الجديد فى دولة الامارات 15 الف درهم يعنى عشرين الف جنية فى الشهر وكذلك فى الكويت وقطر والسعودية ودول اوروبا وامريكا ونصف هذا المبلغ فى الهند والباكستان<br />انما الراتب 390 جنية فى مصر هيعمل اية<br />احنا اصحاب الكهف<br />بنفتكر المرتب دة هيكفى زى ايام الجنية الجلد او الجنية الجبس<br />اصحوا ايها النيام المحنطون<br />ربنا ياخدكم"
archived = "2010-03-14"
capture_url = ""

