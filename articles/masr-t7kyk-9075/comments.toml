[[comments]]
order = 3
subject = "الى ابو محسن 26 سنة غربة"
author = "مش قايل"
posted = "2008-05-15"
text = "اخى الكريم<br />الارقام صحيحة<br />الخريج المواطن فى تلك الدول بيتعين على الدرجة الخامسة وبعد زيادة ال 70 % بيحصل 15 الف درهم<br />اما الوافد مثلك فمرتبة 3 الاف<br />انت مش عارف فى غربتك الدنيا حواليك شكلها اية"
archived = "2010-03-14"
