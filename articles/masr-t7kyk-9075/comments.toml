subject = "منظر الصورة يجنن"
author = "ابومحسن غربة 26 سنه"
posted = "2008-05-15"
text = "يا جماعة الصورة دي تجنن صورة عربية الفول والسندويتشات<br />تجنن الصورة<br />والله العظيم والله العظيم اول حاجه بعملها لما بنزل اجازة واول حلم بنفذه ان انا اقف اكل من على عربيات الفول اللي في الصورة دي<br />يلا انا نازل اجازة بعد رمضان على طول يعني حعيد في مصر ان شاء الله كل سنه وانتو طيبين"
