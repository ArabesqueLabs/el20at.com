[[comments]]
order = 4
subject = "الى الاستاذ مش قايل"
author = "ابومحسن"
posted = "2008-05-16"
text = "طيب يا استاذ مش قايل المرتبات بتتفاوت في الامارات من جهة الى اخرى<br />يعني اللي بيشتغل في الحكومة الاتحادية لدولة الامارات<br />غير اللي بيشتغل في الحكومة المركزية لامارة ابوظبي ودبي او اي امارة اخرى<br />غير اللي بيشتغل في الدفاع او الشرطة الراتب بيختلف<br />وما يسري على المواطن يسري علينا نحن الوافدين الجهة والمهنة بتتحكم في الراتب<br />وليس صحيح ان اي وافد بياخد 3000 درهم<br />واي خدمة من الامارات 00971508447534"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "مجاعة دارفور والصومال فى بر مصر بفضل منجزات حسنى و"
author = "مصرى"
posted = "2008-05-17"
text = "فى الصفحة الاولى لجريدة الخليج الامارتية عنوان<br />خليفة يقدم مليون طن قمح هدية الى الشعب المصرى<br />ببساطة اخبار المجاعة بلغ القاصى والدانى ولا زال حسنى يكلمنا عن المكتسبات والمنجزات وتحرير الاقتصاد<br />اصبحنا نتسول<br />بفضل منجزاتة يعطف علينا الجميع<br />ملك السعودية دفع مليارين بعد ازمة الخبز<br />وهاهو الشيخ خليفة تبرع للفقراء والمساكين بمليون طن قمح<br />ولا زلنا نحتفظ بمليون عسكرى امن مركزى لقمع الشعب"
archived = "2010-03-14"
capture_url = ""
