order = 0
subject = "والذي يوافق عيد ميلاد الرئيس مبارك الـ80،"
author = "مش كاتب"
posted = "2008-04-21"
text = "معلومة غير صحيحة يا رضوى<br />لان حسني مبارك مسك نائب رئيس الجمهورية سنة 1974 وقالوا ساعتها كان عنده 50 سنه<br />من 74 الى 2004 30 سنه<br />+ 50 يبقى ثمانين دا سنة 2004<br />واحنا سنة 2008 يبقى عمره 84 سنه<br />ربنا يديله طولة العمر"
archived = "2008-04-24"
capture_url = "https://web.archive.org/web/20080424011625/http://masr.20at.com:80/newArticle.php?sid=15361"

[[comments]]
order = 1
subject = "ابوحسنى مات فى كفر مصيلحة منوفية وعندة 105  سنة"
author = "مش لاعب"
posted = "2008-04-21"
text = "عندة 80 سنة او عندة 84 سنة اطمئنوا ابوة مات عند عمر 105 سنة<br />ربنا يديلة الف صحة<br />وما يموتش اللى بعد ما يخللى مصر 700 محافظة وتسكن فى الخيام زى دارفور"
archived = "2008-04-24"
