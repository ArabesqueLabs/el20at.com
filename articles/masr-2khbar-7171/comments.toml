subject = "ومين يعرف يضحك فى هذا الزمن"
author = "السوهاجى"
posted = "2007-09-24"
text = "محدش لة نفس يضحك<br />الناس مطحونة وحياتها كلها ضنك والكل متعلق من عرقوبة<br />هيضحك من اية ولية<br />الغلاء قرف عيشة الناس والبطالة مكدرة حياة الشباب<br />والحرامية بيشربوا بنجو وفى حالة توهان<br />الحياة بقت سودة"
