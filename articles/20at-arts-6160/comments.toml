[[comments]]
order = 8
subject = "مسيحيون عرب"
author = "أحمد"
posted = "2007-06-29"
text = "\"وأشار في حديثه إلى كنيسة القيامة وأن مفتاحها مع قبيلة عربية هم آل نسيبة\"<br />أنت حتما تقصد تمييزهم بأنهم مسلمون. فمسيحي القدس هم عرب كما ذكرت في مقالتك لاحقا.<br />بمناسبة المسيح الأشقر، فهذه المشكلة ليست قاصرة على مسيحيي الشام، هي مشكلة غزو ثقافي و فني يتعرض له العرب كلهم، يقع في نطاقها كذلك تسمي المسيحيين العرب بأسماء أجنبية أو بالصيغ الأعجمية للأسماء المسيحية التقليدية.<br />فكلنا نعلم أن الفنانين المسيحيين القدماء، من مصريين و عراقيين و شوام، صوروا العائلة الكقدسة بملامح عربية، و هي ملامحهم الحقيقية.<br />من يندبون في التعليقات دعم المسلمين للمسيحيين يجب أن يعوا أن الدعم ليس حصريا، و دعم المسيحيين العرب لا يعني قطعه عن المسلمين! ارحمونا من العنصرية و التعصب و افهموا أن سلامة الأقلية مسؤولية الأغلبية."
archived = "2010-03-14"
capture_url = ""
