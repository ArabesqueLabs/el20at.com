subject = "اه على عمان"
author = "ريما"
posted = "2007-06-14"
text = "ما في احلى من اعراسك يا عمان...... عرس اخوي على الابواب وما مصدقة انزل على عمان و يصير العرس<br />و اكتر شي مستنياه غدا العرس و سهرة الشباب من بعدو اكتر من الحفلة تاني يوم<br />رح نعملها على الطقوس القديمة اغاني ايام زمان ونلبس ثواب... زي ما كان يعملو اهلنا بالبلاد الله يرجعها باذن الله و يهدي شعبنا يخلص من هالفتنة<br />اه البلاد يعني فلسطين... احنا بنحكيلها لبلاد<br />ويحميكي يا عمان.. و يكتر افراحك"
