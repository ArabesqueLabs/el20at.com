[[comments]]
order = 5
subject = "فضايح .. \" عيني عينك \""
author = "خالد الهزايمــــــــــــــــــ"
posted = "2008-02-04"
text = "وبعدين مع هالشغله اللي بتوطي الراس .. بدل ماترفعو ..<br />يعني ضروري يعني الواحد يسوي عرسو بنص الشارع .. وكل ماهب ودب يجي على عرسه .. هاذ مش كلام ..<br />بعدين .. مش منظر حضاري ومتقدم للأردن بشكل عام أنا قاعد عم بحكي يعني ..<br />يعني سيبو هالأمور والأشياء الغبيه اللي بدلش غير ع تخلف وجهل وغباء وحمرنه وجحشنه على ولا اشي .<br />يعني بالعقل والمنطق .. أنا لما أسوي عرسي بنص الشارع .. وناس داخله وناس طالعه .. وإشي ببصبص وإشي ببصبصش .. وإشي نايم وإشي صاحي .. وإشي بوكل .. وإشي بوكلش .. و و و و و<br />يعني .. ومن الآخر، أنا بشوف شغلة الأعراس هاي شغلة قديمة وبدل على التخلف والغباء .. وغير هيك لأ<br />يعني شو ناقو الواحد لما يسوي عرسو بفندق .. ويكون فيه معازيم من أهلو وأصحابو وقرايبو .. يعني ناس معروفين بالنسبة لألو ولغيرو .. ويكون محترم .. مش شغل الغجرنه والنوره اللي بنشوفه بالأردن ..<br />بتمنى من كل قلبي أنو نعيد بهاي المسألة وندرسها أكثر من مره .. ويكون فيها شوية تأني وتروّي .. بوالنهاية ومثل مابقولو<br />العقل سيد الحلوووووووووووووووووووووووووووووول .. وأخيراً .. ماحدا يعل مني هاي وجهة نظري الشخصية فيني وأنا عبرت عنها .. وكل شخص إلو تفكيرو .. والإختلاف أمر وارد وطبيعي .. وعااااااااااااااادي لا بل أكثر من عادي<br />ودمتم ،،،"
archived = "2010-03-14"
