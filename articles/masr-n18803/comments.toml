subject = "مش عارف"
author = "محمد جمال الدين"
text = "مهنة زى اى مهنة فيها الحلو وفيها الوحش<br />او بمعنى اصح فيها الى معلوماته و لباقته تجنبه التعرض لمواقف \\\"سخيفة\\\" مع مصادره , وفيها الى مش عارف حاجة فى اى حاجة و عايز ياخد المعلومة ,حتى بتلاقيه بيجيب أحداث قديمة و معروفة للكل على أنها حاجة لانج و نيو لسة<br />بس بصراحة فيه مصادر مستفزة وخاصة الحكومية منها , و مش عارف ليه انا شايف دلوقتى انه وبرغم التكنولوجيا الهائلة الى المفروض تساعد الصحفى على التحقق من المعلومة لتجنب التسبب فى أضرار للغير عن طريق نشر معلومات غير مؤكدة و مغلوطة ,ولكنها كأى شىء سلاح ذو حدين فأصبح بعض الصحفيين يعتمدون على ما ينشر بشبكة الانترنت اعتماداً كاملاً فى استقاء المعلومة ونشرها ولا يحاولون التحقق من صحتها<br />عارفة ليه , لانهم دلوقتى اصبحوا ..\\\" البعض منهم\\\" عايزين ينشروا خبر علشان ياخدوا فلوس بس .. مش حباً فى نشر الحقيقة ولا المهنة .. وبيتهيألى انهم مش عارفين قواعد المهنة كمان .<br />ومؤيد تماماً لما قالته الاعلامية \\\"بثينة كامل \\\""
