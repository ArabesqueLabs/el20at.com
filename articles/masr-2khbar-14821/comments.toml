author = "الدنيا ربيع والجو"
posted = "2010-01-12"
text = "الدنيا ربيع والجو (((( بديع )))) قفلي على كل المواضيع<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />هو ايه اللي بيحصل دا<br />ـــــــــــــــــــــــــــــــــــــــــــــــــ<br />المرشد الجديد بايع المرشد القديم زمان<br />ودلوقتي المرشد القديم حيبايع المرشد الجديد<br />ومجلس شورى الجماعة ومكتب الارشاد<br />وحبيب استقال من مجلس الشورى العالمي ومكتب الارشاد العالمي<br />هو ايه الحكاية بالضبط<br />ممكن حد من اخوانا العلماء يقولنا ايه الموضوع لحسن انا عامل زي الاطرش في الزفه يعني زفة الاخوان المسلمين<br />ـــــــــــــــــــــــــــــــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2010-03-14"
capture_url = ""

