text = "انت عايز المرشد يبقى لواء اركان حرب<br />والا عايزة من اشباة الطنطاوى وزقزوق<br />دى جماعة للدعوة والارشاد من الشعب - يعنى ممكن يبقى فيها استاذ الجامعة والمدرس والنجار والميكانيكى ودول مش بتوع فتاوى ولا دة حلال ولا دة حرام - انت شفت المرشد طلع فتوى مرة من المرات - ابدا<br />دول ناس بيقولوا اعبدوا اللة وابعدوا عن الحرام"
