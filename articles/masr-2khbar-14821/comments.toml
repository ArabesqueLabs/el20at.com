text = "رد على الى المعلق السابق<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />النبي محمد صلى الله عليه وسلم كان قائد عسكري وكان القائد الاعلى للقوات المسلحة الاسلامية<br />ابو بكر الصديق كان القائد الاعلى للقوات المسلحه<br />عثمان ابن عفان كان القائد الاعلى للقوات المسلحه<br />علي ابن ابي طالب كان القائد الاعلى للقوات المسلحة<br />لو سمحت ما تعبش في طنطاوي<br />وبعدين الاخوان المسلمين جماعة سياسية هدفها الوصول الى الحكم<br />لا هي دعوه ولا ارشاد<br />____________________________<br />مش احمد الهواري ولا عبدالله الطحاوي"
