text = "يلا احسن احنا اصلن مش عايزين نشوف وشهم ويلا يمشوا بقى ونخلص منهم وعلى فكرة موضوع قتل جنوب مصريين اسرى دة موضوع حقيقى يعنى اللى يقتل الاطفال والنساء اكيد يقتل الجنود الاسرى لانى هما دول الاسرائليين مهما نضفوا هيفضلوا كلاب وخونة"
