text = "و لالالالالالالالا تعليق<br />ارجوا ان ينفذ العنوان خيرا من خراب بيوت اولياء الامور على ايدى اللصوص موظفى الدولة من حثالة المدرسين ممتهنى مص دماء الشعب<br />تحت مسميات (الدروس الخصوصية)<br />الموت للمدرسين مصاصى الدماء و اولهم الوزير المكتر الحيوان (الجمل)<br />الذى يحتاج قكعا و حقا الى (الزبح)"
