[[comments]]
order = 6
subject = "نتمنى ان لايكون هذا مجرد كلام"
author = "حياة العياش محامية وباحثة قانو"
posted = "2007-11-04"
text = "اخ وائل عبدالمنعم<br />هذا وانت مصري .. وقد وصلت المصريات الى المنصب القضائي والوزاري .. فكيف تريد تحجيم اعمالها بقضايا الأحوال الشخصيه؟؟ ومن قال ان الأحوال الشخصيه وخاصة في المملكة هي من القضايا السهلة ؟؟ قد تكون في مصر لأن قانون الاحوال الشخصية المصري قد لايتعدى ال30 صفحه .. ولكن هنا قضاء الاحوال الشخصية غير مقنن ويعتمد اعتمادا كليا على المذهب الحنبلي .. ولا يمكن الرجوع فيه الى السوابق القضائية .. بالتالي تجده اصعب من العديد من الأنظمة .. والترافع والمحامة تعتمد كثيرا على الذكاء والمكر والحنكة ولا اعتقد ان المرأة ينقصها هذا الأمر .. والا لما استطاعت التخرج من كلية الحقوق ابتداء .. الا تعتقد ان في رأيك اجحافا في حقنا؟؟<br />كثير من النساء برعن حتى في مجال الذرة والمنطق والفلسفة.. الا تعتقد ان هذا امر يخرس الرجال المتعلقين بنقصان عقولينا وكأننا بهائم هائمة محدودي التفكير .. قد تسبقنا العاطفة ولكن لا اعتقد انني سأبكي عندما اعلم ان 1+1=2<br />فهذه معادلات ومسلمات<br />ولا تكبر حجم المحاماة وكأن فيها معرفة لكيفية الخلق والاعجاز .. فالمحاماة كأي مهنة هامة في المجتمع ولا تعدو ان تكون طب الأدبي .. وكيف يقبل بالمرأة ان تكون جراحة ودكتوره وفي كثير من الاحيان المجالات الطبيه الدقيقه ( الا تعتقد ان هذه الأمور تحتاج ايضا الى عقل )؟؟؟؟<br />في النهاية اود شكر الجهات التي تفاعلت مع تذليل الصعاب امام المرأة لتدخل هذا المضمار وتنجح كأي امرأة في العالم برعت ونجحت على كثير من اقرانها في هذه المهنة والذين قد يكونوا رجالا<br />والتجربة في كثير من الدول على نجاحها هي خير برهان"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "اتمنى ان يتحقق حلمي"
author = "فتاة المملكة العربية السعوديه"
posted = "2008-07-12"
text = "اولاً: عمل النساء بالمحاماة ليس فيه اي محذور شرعي ابداً<br />ثانياً: الممنوع للنساء العمل فيه القضاء وليس المحاماة<br />ثالثاً: البحث عن لقمة العيش اترضى ايها المعارض لهذا العمل للمراة السعودية ان تصبح (خادمة ) لدى البيوت كقصة تلك الفتاة ام ان العمل كمحاميه سيكون افضل لها من سؤال الناس ؟ اظن ان هذا العمل افضل بكثيــــــــــر<br />رابعاً: اذا كانت لدي موهبه في حل القضايا والمحاماة عن المراة السعودية المظلومة احيانا من جانب الرجل وليس الدين أكرر ليس من جانب الدين فالاسلام حفظ حقوقها كاااااامله .. أكمــل فلامانع من عملها في هذا المجال<br />خامساً: المرأة السعودية صارت طبيبه لاتاتي لبيتها في الا في اخر الليل تسهر لاجل المرضى وعنايتهم وتعمل في البنوك في مكتب خاص لا يؤذيها احد فتستطيع ايضا ان تعمل كمحاميه تجلس في مكتبها وتستقبل النساء فقط لا يتطلب ان تظهر صوتها امام الرجال او تفتح وجهها وتتخلى عن تعاليم دينها ..<br />سادساً: سيطول نداءنا وكلامنا لنقنع الرجل السعودي ان يسمح لنا بهذا العمل لكن لامجيب لانه غير مقتنع اصلاً واعيد واقول ان فكرة التعليم كانت قديماً مستهجنه عند الرجل السعودي ولكنها اصبحت مهمة وستصبح مهنة المحاماة مهمة جداًُ..أملي غير منقطع ان اصبح محامية وسأتحدى الصعوبات<br />انتظرونـــــــــــي : **اول محاميه سعوديه **"
archived = "2010-03-14"
capture_url = ""
