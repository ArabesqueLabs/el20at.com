[[comments]]
order = 4
subject = "لا مشكله"
author = "وائل عبد المنعم       / وكيل ا"
posted = "2007-10-18"
text = "الموضوع لايستحق التفكير ولكن ارى ان يقتصر عملهم على مجال قضايا الاحوال الشخصيه ومتعلقاتها من نفقه وحضانه وخلافه لاسباب:<br />1_ حتى لا تطغى على عمل الرجل<br />2_ لانهن ناقصات عقل ودين مصداقا لقوله عليه الصلاة والسلام ولن يتمكنوا من الوصول لحلول باقى انواع القضايا بخلاف الاحوال الشخصيه لسهوله ووضوح المشاكل والمسائل المتعلقه بها<br />3_حتى لاتزيد معاملاتها واختلاطها مع الرجال لان الاصل مكان المراه هو المنزل وتربيه الابناء وخروجها للعمل هو الاستثناء مصداقا لقوله تعالى\"وقرن فى بيوتكن \"<br />والله اعلم والسلام عليكم<br />الكاتب\" عضو بالنيابه العامه<الادعاء العام>; بجمهوريه مصر العربيه"
archived = "2010-03-14"
