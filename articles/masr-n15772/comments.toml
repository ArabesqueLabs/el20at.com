[[comments]]
order = 6
subject = "يوسف إستس"
author = "مش البابا شنوده"
posted = "2008-05-15"
text = "يوسف إستس<br />من ويكيبيديا، الموسوعة الحرة<br />اذهب إلى: تصفح, ابحث<br />يوسف إستس (ولد 1944 م) هو أمريكي تحول إلى الإسلام، واسمه قبل إسلامه هو جوسيف إدوارد إستس أو جوزيف إيستس، ولد في الولايات المتحدة ونشأ في أسرة بروتستانتية مسيحية وأصبح قسيسا.<br />حصل على شهادة ماجستير في الفنون سنة 1974م وشهادة الدكتوراة في علم اللاهوت. بعد تعامله مع شخص مسلم مصري اسمه محمد اعتنق الإسلام سنة 1991 م هو وزوجه ووالده ووالدته، ثم تعلَّم بعدها اللغة العربية والدراسات الإسلامية من سنة 1991 م إلى سنة 1998 م في مصر والمغرب وتركيا.<br />ويعمل في مجال الدعوة في الولايات المتحدة وله أشرطة ومحاضرات بالإنكليزية"
archived = "2010-03-14"
capture_url = ""

