[[comments]]
order = 0
subject = "الى المحامي ممدوخ نخله مخلص الاقباط"
author = "مش مدير الموقع ولا عبدالله الطحاوي"
text = "الاقباط بيدعوا ان سوزان مبارك كانت مريضة بالسرطان وشفيت بشفاعة الباباوات الشواذ والماماوات السحاقيات<br />وهنا نتسائل لماذا الباباوات والماماوات لم يشفوا البابا شنوده الكبير اللي رايح جاي على بلاد الغرب يتعالج من مرض الهربس اللي جالوا من ممارسة الشذوذ الجنسي ومش عارفين يعالجوه<br />بصوا شوفوا غجر الاقباط بيقولوا على سوزان مبارك ايه<br />ونرد ونقول ان سودان مبارك وحسني مبارك هما اللي حمينكوا ولو تخلوا عنكم المسلمين حيخلصوا عليكم في 12 ساعة بالضبط يا شوية 6% من عدد السكان<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />انا سمعت ان سوزان كان عندها سرطان فى الدم والعدرا وابو سيفين وامنا ايرينى عملوا معجزة<br />ياريت كانوا سابوها<br />بس ده اللى سمعته من ناس هنا<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــتتت<br />الغريب يا جماعة ان الام الفاضلة جدا سوزان مبارك المفروض هي اول واحدة تدافع عن حقوق المسيحيين هي وباقي عائلتها المباركة وده لأن اله النصاري ده هو اللي انقذها من الموت وشفاها بشفاعة القديس العظيم ابي سيفين والقديسة تاماف ايريني .. وهي عارفة كدة كويس .. لكن هنقول ايه زي القطط ياكلوا وينكروا ... خوفهم علي كراسيهم اعمت قلوبهم ... فليكون الله مع اولاده ماريو واندرو وينقذهم من اعدائهم ... فلا يحتاجوا لزراع بشر .. امين"
archived = "2008-05-15"
capture_url = "https://web.archive.org/web/20080515003237/http://masr.20at.com:80/newArticle.php?sid=15772"

[[comments]]
order = 1
subject = "فهموني بأه تاماتا ايرلي شفت سوزان مبارك ازاي"
author = "مش شريف الدواخلي ولا احمد الهواري"
text = "عادت إلى السماء أمس القديسة تاماف إيرينى رئيسة دير أبو سيفين للراهبات بمصر القديمة بعد معاناة مع المرض و رحلة علاج طويلة امتدت إلى عدة سنوات فى مركز الحياة الطبى بمصر الجديدة و هو المكان الذى انطلقت منه عائدة إلى حبيبها و شفيعها القديس مرقوريوس أبى سيفين, و قد كانا على علاقة روحية سماوية قوية جداً إلى الحد الذى كانا فيه صديقين روحيين و يأتى أبو سيفين ليدور حول الدير بحصانه كل ما كانت تاماف تذهب للصلاة فى قلايتها بالدير حسب ما قاله شهود عيان من الرهبات و العمال بالدير...<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــتت<br />زي ما انتو شايفين ماتت وكل الامراض اللي في الدنيا كانت عندها<br />والنبي يا اقباط بطلوا جهل بأه ما حدش بيشفي حد الشافي هو الله الخالق<br />وبصوا كمان مكتوب ايه في الخبر<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />عائدة إلى حبيبها و شفيعها القديس مرقوريوس أبى سيفين, و قد كانا على علاقة<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />اهو هو دا الشغل ولا بلاش"
archived = "2008-05-15"
capture_url = "https://web.archive.org/web/20080515003237/http://masr.20at.com:80/newArticle.php?sid=15772"

