text = "الاقباط بيدعوا ان سوزان مبارك كانت مريضة بالسرطان وشفيت بشفاعة الباباوات والماماوات وهنا نتسائل لماذا الباباوات والماماوات لم يشفوا البابا شنوده الكبير اللي رايح جاي على بلاد الغرب يتعالج من مرض الهربس اللي جالوا ومش عارفين يعالجوه بصوا شوفوا غجر الاقباط بيقولوا على سوزان مبارك ايه ونرد ونقول ان سوزان مبارك وحسني مبارك هما اللي حمينكوا ولو تخلوا عنكم المسلمين حيخلصوا عليكم في 12 ساعة بالضبط يا شوية 6% من عدد السكان ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ انا سمعت ان سوزان كان عندها سرطان فى الدم والعدرا وابو سيفين وامنا ايرينى عملوا معجزة ياريت كانوا سابوها بس ده اللى سمعته من ناس هنا ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــتتت الغريب يا جماعة ان الام الفاضلة جدا سوزان مبارك المفروض هي اول واحدة تدافع عن حقوق المسيحيين هي وباقي عائلتها المباركة وده لأن اله النصاري ده هو اللي انقذها من الموت وشفاها بشفاعة القديس العظيم ابي سيفين والقديسة تاماف ايريني .. وهي عارفة كدة كويس .. لكن هنقول ايه زي القطط ياكلوا وينكروا ... خوفهم علي كراسيهم اعمت قلوبهم ... فليكون الله مع اولاده ماريو واندرو وينقذهم من اعدائهم ..."
