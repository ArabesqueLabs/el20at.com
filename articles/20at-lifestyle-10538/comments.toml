[[comments]]
order = 1
subject = ""
author = "سوريا وخفاياها"
posted = "2008-11-18"
text = "ان في اي مكان من المعمورة يوجد بشر جيدون وغير جيدون ومن السذاجة ان نعمم تصرفات الاناس الغير جيدة على باقي الناس . هذا من جانب ومن جانب اخر انا اتسأئل سؤال وواجهه الى الكاتبة راما احمد ( هل تقصدين ان سوريا اصبحت مكان الى الدعارة ؟؟ ) وهل تقصدين ان صبايا سوريا علمن فتيات العراق بهذا العمل ؟؟ ."
archived = "2011-02-02"
capture_url = "https://web.archive.org/web/20110202190843/http://www.20at.com:80/20at/lifestyle/10538.html"

[[comments]]
order = 2
subject = ""
author = "أبو الحسين السلفي"
posted = "2008-11-19"
text = "أمر طبيعي و ليس لالة الحرب دخل في حال الشيعيات بل لو كانت إيران هي المسيطرة والحكام كلهم شيعة تجد هذا الأمر طبيعي لإن زواج المتعة عندهم سنة مستحبة حتى ان السيستاني سئل هل يجوز اتخاذا المتعة مهنة ؟ فأجاب لا مانع و من أراد التاكد فليدخل لموقع السيستاني … و العجيب ان في كتب الشيعة تحريم الزواج فعن علي بن أبي طالب رضي الله عنه قال :<br />( حرم رسول الله صلى الله عليه وسلم نكاح المتعة ولحوم الحُمُر الأهلية يوم خيبر )<br />( الأستبصار للطوسي ج 2 ص 142<br />وكتاب وسائل الشيعة للعاملي ج 21 ص 12 )<br />وسئل جعفر بن محمد ( الأمام الصادق ) عن المتعة فقال : ( ماتفعله عندنا إلا الفواجر ) .<br />( بحار الأنوار للمجلسي – الشيعي – ج 100 ص 318 )<br />ولكن هل من متعظ ؟؟!!!!!"
archived = "2011-02-02"
capture_url = "https://web.archive.org/web/20110202190843/http://www.20at.com:80/20at/lifestyle/10538.html"
