author = "الكاتبة راما احمد"
posted = "2008-11-18"
text = "سوريا صاحبة فضل على العراقيين لكن الشيعيات العراقيات هن من اسئن للعراقيات ولم تعلم السوريات العراقيات الا الاخلاق الحسنة"
