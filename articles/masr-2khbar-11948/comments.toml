text = "العملية مش هزار<br />انتم شفتم الزبالة اللى عايشين فى وسطها - مرتع جيد جدا لاى فيروس او ميكروب<br />الناس دى حالتها اوسخ من الخنازير لان الخنزير عندة عذر انة عديم الاحساس - انما البنى ادميين اللى عايشين وسط الكم الهائل من الزبالة دى اليس عندهم احساس - والمصيبة كمان بيقاوموا السلطات علشان عايزة تنضفهم"
