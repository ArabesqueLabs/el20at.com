text = "السلام عليكم ورحمة الله وبركاته شكرا على تعليقك استاذ ياسر ابو العلا، ولكن هناك بعض التصحيحات الجلسة الاولى انا حضرتها بالفعل ولكني لم اسجلها لوجود مشكلة في الكاسيت، اما اسم د/ مرغني فهو سليم وفق ورقة تقديم الضيوف ووفق اسمه المدون على كارته الخاص داخل الندوة وهو محمد مرغني خيري"
