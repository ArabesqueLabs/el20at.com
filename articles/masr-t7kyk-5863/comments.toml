subject = "دمي ودموعي وابتسامتي"
author = "مش لازم"
posted = "2007-05-14"
text = "معلش يا اختنا الفاضله عنوان مقالك اثار في نفسي فيلم سينمائي قديم فضلت اتذكره وجعلته عنوان للتعليق<br />وبعدين احنا ناس متخلفين مش معقول بعد ???? سنه من فتح مصر بنعمل مؤتمر عن ثوابتنا اللي المفروض تكون في دمنا وهو اول كلمة في الفيلم ودموعي على الخيبة اللي احنا وصلنا اليها وابتسامتي للمستقبل المشرق الذي ينتظر مصرنا الحبيبه في ظل القيادة الحكيمه الرشيده"
