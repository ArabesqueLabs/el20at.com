[[comments]]
order = 4
subject = "تعقيب على التعليقين"
author = "ياسر أبو العلا"
posted = "2007-05-15"
text = "على فكرة أنا لا أحب ولا أجيد تصيد الأخطاء ، ولم أقصد ذلك إطلاقا حين كتبت التعليق ، وليس لي علاقة بأسلوب الأستاذ الدواخلى أو غيره ، ما كنت أشير إليه هو الإشادة بالموضوع بالطبع ، والإشارة إلى خطأ في الاسم \" وعلى فكرة يا أستاذة دعاء ما كتبتيه في التعقيب هو الصحيح بالنسبة لاسم الدكتور \" محمد ميرغنى خيري \" ، ولو راجعت الموضوع الأصلي ستجدين أنه مكتوب \" محمد مرغني غانم \" .<br />وهى غلطة بسيطة يقع فيها أي صحفي مهما ارتفع مستواه .<br />وبعدين أنا كنت بهزر معاكى يا ستى لما قلت إنك محضرتيش الجلسة الأولى ..وهذا اتساقا مع أسلوب الموقع ، يعنى المسألة مش محتاجة زعل طبعا .<br />أما الأخ اللي رمى التعقيب التانى ومشى فبصراحة مش عارف أقوله إيه :<br />أولا أسلوبك في النصيحة مش ولابد ، وبعدين أنا مش عريس يا سيدي ولا حاجة ، أنا كنت عريس من 5 سنين ونصف ، ثم إيه علاقة التعليق بتاعى بأخلاق المهنة ، بمعنى إيه الإخلال اللي أنا عملته في تلك الأخلاق !!! كلنا بنصلح لبعض يا سيدي .وأكيد ميصحش إنك تقولى عيب ، فعلا دى حاجة تزعل .<br />على فكرة أنا مبحبش اللي يطلع يدي نصايح للناس من غير لزوم ، عموما برضه شكرا على النصيحة ، وعلى فكرة أول مرة آخد بالى من اكتب إلى المحرر دى ، بس المسالة مش مستاهلة يعنى ، مفيش خطأ جسيم يستلزم إن محدش يقراه .<br />مرة أخرى يا أستاذة دعاء - أحييك على أسلوبك واوعى تكوني زعلتى ، إحنا مش قد جوزك<br />على فكرة هازعل جدا جدا لو كان اللي كاتب التعليق ده يعرفني ، لأنه أكيد عارف كان قصدى إيه من التعليق .<br />مع تحياتي للجميع ."
archived = "2010-03-14"
