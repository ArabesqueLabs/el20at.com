[[comments]]
order = 1
subject = "تصحيح بسيط"
author = "ياسر أبو العلا"
posted = "2007-05-14"
text = "العروسة دعاء ..أسلوبك سلس ويشجع على القراءة ، ولكن كنا ننتظر عرضا وافيا \" شوية \" عن المناقشات ، واضح انك لم تحضرى اول ندوة لانك \" كروتيها \" فى العرض ، صح كده ؟؟<br />عندى تصحيح بسيط إن الدكتور ميرغنى انتى كاتبة اسمه غلط ، فاسمه الدكتور ميرغنى خيرى ادريس \" ومش متاكد اسمه الاول محمد ولا لا\" معلهش هى ملاحظة بسيطة بس الراجل العظيم ده كان احد اساتذتى فى حقوق عين شمس وكنا نحبه ونحترمه ونحن فى الكلية ، وبالطبع زاد حبنا واحترامنا له بعد تخرجنا .<br />بالمناسبة - بعيد عن الموضوع - الراجل ده ابنه كان معايا فى الدفعة ورسب فى القانون العام الذى كان يدرسه لنا أبوه ، مش قلتلكم راجل محترم ؟؟؟وما يدفعك لحبه اكثر انه كان \" صولا \" فى الجيش ، ثم ذاكر الثانوية العامة والتحق بالحقوق ثم اعد الماجستير فالدكتوراة ووصل الى رئاسة قسم القانون العام بالكلية ، والمستشار القانونى لرئيسها ، قصة كفاح بافكر اكتبها بالتفصيل على الموقع ، ايه رايك يا هوارى ؟"
archived = "2010-03-14"
capture_url = ""

