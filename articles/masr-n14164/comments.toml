[[comments]]
order = 3
subject = "والله زمان يا حمد انا كنت زميلك فى اعدادى"
author = "محمد نعيم"
posted = "2008-02-19"
text = "استاذ احمد حستغرب جدا .. انه علقت قبل كده على مقالكنت كتبته عن اللغة القبطية وشفت صورتك على المقال وشبهت عليك وتذكرت بعد مده انك كنت زميلى فى اعدادية وقاعد معايا على نفس الدكة واسمك احمد القطب احمد سليمان مدينة نصر النموذجية وكنت فى فصل تالته اعدادى فصل بائس وصغير اضغر من اوضة الفران انا اسمى محمد نعيم القناوى واعتبر على الطرف التانى من توجهاتك السياسية .. والله الدنيا صغيرة"
archived = "2008-04-16"
capture_url = "https://web.archive.org/web/20080416160750/http://masr.20at.com:80/newArticle.php?sid=14164"

[[comments]]
order = 4
subject = "يا نهااااااااااار ابياااااااااااااااااااااض"
author = "أحمد القطب"
posted = "2008-02-20"
text = "يا نهار ابيض.... مش مصدق نفسي... انت كنت معايا في ثالثة خامس ؟ أيام رفعت وممتازة والناس الحلوة دي ؟ بس تصدق انا مش فاكر اسمك بالضبط... بس متهيألي انت اللي كنت بتسمع إذاعة لندن أياميها ؟ ووقفت جون مرة في ماتش من ماتشات الكورة بتاعة الفصل ؟"
archived = "2008-04-16"
capture_url = "https://web.archive.org/web/20080416160750/http://masr.20at.com:80/newArticle.php?sid=14164"

[[comments]]
order = 5
subject = "واخدنا الكاس - ولبسنا تاج الجزيرة - اية تانى"
author = "برضة رخم"
posted = "2008-02-23"
text = "ولما اخدنا الكاس وبقينا ست افريقيا - اية الجديد<br />لما بدأنا نلعب كرة فى مصر من 100 سنة فاتت - ما كانش ولا دولة افريقيا واحدة اسمها دولة - كانوا عالم عايش فى الغابات - عراة - بيركبوا الشجر زى القرود - وكانت اسمها افريقيا السوداء<br />دلوقتى اتقدموا ماشاء اللة<br />عندهم ديمقراطية<br />ومعندهمش طوابير خبز - ولا اكوام زبالة - ولا شباب مش عارف يعيش -<br />عايشين احسن مننا ميت مرة<br />فزت عليهم فى الكرة - دة الوضع الطبيعى - انما انت فين وموريتانيا فين"
archived = "2008-04-16"
capture_url = "https://web.archive.org/web/20080416160750/http://masr.20at.com:80/newArticle.php?sid=14164"

[[comments]]
order = 6
subject = "رابطه عشاق النكد"
author = "نيفين نيفى نوفا"
posted = "2008-02-26"
text = "انا بستغرب من الناس اللى بتصر على انها تبوظ الفرحه و خلاص<br />تلاقى الواحد من دول يقوللك و ايه يعنى خدنا بطوله افريقيا يعنى قضينا ع البطاله يعنى زادت المرتبات يعنى يعنى و مليون يعنى يرصهاللك تتضمن كل الماسى الموجوده على سطح الارض و الغير موجوده<br />ليه مبنفرحش<br />مصر خدت بطوله علشان نفرح و ننسى شويه و لو لحظه وضع البلد الهباب<br />بلاش نكد و كابه<br />انا بحس ان الناس دول زى جماعه قاعدين ف الضلمه و حد جابلهم شمعه صغيره ضوءها بسيط فقالو لا لا ضوء كامل لا بلاش<br />خليكو كده عايشين ف الظلام الفكرى بتاعكو<br />و بعدين على فكره هى منظومه<br />الرياضه و الاقتصاد و التعليم الى اخره<br />تعالو بقى نحلم بتقدم ف باقى اجزاء المنظومه بدل ما نتفه انجازاتنا و نكسر ماديفنا<br />طيب و لو كان المنتخب رجع بكفى حنين كنتو هتقولو ايه<br />كان زمانكو معلقين للاعبين المشانق<br />بلاش كده بقى"
archived = "2008-04-16"
capture_url = "https://web.archive.org/web/20080416160750/http://masr.20at.com:80/newArticle.php?sid=14164"
