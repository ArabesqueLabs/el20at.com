[[comments]]
order = 1
subject = "لا وممكن افقعك بجد يا فقع"
author = "محمد سعيد"
posted = "2008-02-14"
text = "انت فقع يا مفقوع ويمكن انت اتفقعت لانك فقع .. قسمتنا ونصيبنا ان مصر مؤنث ومعظم اسماء البلاد مؤنثة بس لانك مريض وكل حاجه حاجه بتاخدها على جوه .. والمؤنث بالنسبه لك مجرد شيئ بيتركب .. فعلقت تعلقيك المريض ده .. كلامك معقول جدا يا احمد يا قطب"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195722/http://masr.20at.com:80/newArticle.php?sid=14164"

