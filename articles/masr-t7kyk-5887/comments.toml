subject = "توضيح و استفسار"
author = "نيفين نيفى نوفا"
posted = "2007-05-17"
text = "اولا احب اوضح ان التعليق اللى فوقى على طول ده مش بتاعى<br />انا تعليقاتى بس اللى بعنوان الله يمسيك بالخير يا اكرم و شفتو نسيتونى اما اللى فوقى على طول ده مش بتاعى و يبدو ان واحد ظريف او واحده ظريفه دخلو باسمى..لان ده مش اسلوبى فى الرد<br />ثانيا يا استاذ شريف الدواخلى او ايا كان اسمك مش فاهمه ايه اللى انا قلته غلط لما اقول لمروه الموضوع لايت بس جميل<br />انا بجد مش فاهمه ..انا كل اللى قصدته ان ساعات مواضيع بتكون لايت بس مبتمسش الشخص اوى لكن انا و ده بالنسبه لى الموضوع مسنى لانى بحب الحيوانات الاليفه و على راسه القطط و علشان كده معتبره الموضوع جميل<br />و ده رايى اللى مش من حق اى حد يحجر عليه<br />ثالثا ليه التريقه و خبيره صحفيه و الكلام ده<br />انا مقلتش انى خبيره صحفيه ف يوم من الايام<br />يا ريت حضرتك توضح وجهه نظرك لانى فعلا مش فاهمه"
archived = "2010-03-14"
capture_url = ""

