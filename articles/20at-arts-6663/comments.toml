[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "ماجد رمضان"
posted = "2008-03-13"
text = "إذا زرت البتراء للمرة الأولى تنبهر وفي المرة الثانية تبدو أشد انبهاراً وكلما زرتها مرة بعد مرة ادركت أن هذه المدينة من أجمل المناطق الأثرية التي يمكن زيارتها ومن لم يزرها فقد فاته الكثير الكثير. أنصح الجميع بزيارتها لأنني صدقاً زرتها أكثر من عشرين مرة وكل مرة يشتد إعجابي بها أكثر."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "البتراء هي الاجمل على الاطلاق"
author = "محمد العالم"
posted = "2009-02-15"
text = "البتراء من اجمل المدن الاثرية هي ملكة عجائب الدنيا السبعة والي ما راح عليها بصراحة بكون ضيع نص عمرو<br />البتراء مدينة سحرية عشان هيك صارت من ضمن العجائب الدنيا وبالنسبة الي انا روحت عليها وما كفاني يوم واحد ضليت هناك ثلاثة ايام وكل ما غمقت بالمدينة اكتر ازداد اعجابي بعظمتها<br />صدقوني يا اخواني الاعزاء انها مدينة الاجمل على الاطلاق"
archived = "2010-03-14"
capture_url = ""
