[[comments]]
order = 0
subject = "والحزب الوطني يعرض حسني مبارك للبيع"
text = "بصفته رئيس جمهورية عظيم وانجازاته رائعة واستطاع العبور بشعبه الى المستقبل ونظرا لحاجة الحزب الوطني الى سيولة تقرر بيع رئيس الجمهورية<br />وعلى عينك يا تاجر<br />احسن من الحضري ميت مره"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234135/http://masr.20at.com:80/newArticle.php?sid=14546"

[[comments]]
order = 1
subject = "يا حنين"
author = "وليد"
text = "كان نفسي تالريس يتابع مشكلة الحديد او الأسمنت والمتسبب فيها وفي الغلاء اللي احنا فيه ومين وراه ومشكلة الشباب اللي بيموت اثناء الهجرة إلى اوربا بدل ما يتابع مشكلة الحضري واحترافه"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234135/http://masr.20at.com:80/newArticle.php?sid=14546"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "والله انا شايف ان الاهلى لابد وان يترك الحضرى لانة بضاعة فاسدة وسوف تفسد باقى اللاعبين ، ومما لاشك فية من يبيع دينة يبيع نفسة !!!!!!!!!!!!!!! واقول له اين حجاب زوجتك يا حضرى ؟ طبعا مش صبى نجار لازم يعمل كدة"
archived = "2008-03-11"
capture_url = "https://web.archive.org/web/20080311234135/http://masr.20at.com:80/newArticle.php?sid=14546"
