subject = "هو من علمني الحب"
author = "roeslinda"
posted = "2008-09-14"
text = "ذلك الشاب الوسيم هو من علمني الحب وعذابه اغرمت به منذ الصغر وامي كنت هي من دلتني عنه وعن بدايه طريق ابحث عن الحب بحثت الي ان وجدت المفتاح وايضا وجدت باب السعاده دخلت في عالم الفس بريسلي صوت واحساس كلمات وحب لم كون يوما اعرف ما هو الحب ورومنسيه دائما بعيده كل البعد عن رومنسيه ان دائما انجذب اغاني الصخبه ولكن ايوم انا رومنسيه جدا جدا جدا الي ذلك ايوم لم كون اعلم انه مات الحبيب منذ ثلاثين عاما لم اصدق ذلك ابد الذي عاشقته تلك السنين مات قبل اولد من اممكن تكون تلك اقوه صدمه فحياتي هل تعرفون عندما عرفت انه مات من تلك الفتره زهلت وسارت اضحك وابكي في نفس الوقت ولكن هي ده دنيا هنعمل ايه انا عن نفسي خلاص حاجه عاديه شكرررررررررررررررررررررررررررررررررررررررررا ليكي علي معلومات جميل وكلام اجمل وانا اويد na3omy لانه لم تترك لي كلام اقوله ........."
