subject = "عاشقه الفيس بريسلي"
author = "na3omy"
posted = "2008-09-14"
text = "انا عاشقه بريسلي الكل يعتقدانني مجنونه ومهووسه نعم انامجنونه بصوته ومهووسه باغانيه ليس من المعقول لا يغرمن الفتيات بذلك الشاب الوسيم صاحب الصوت الرائع يتميز بروح مرح وصوت عذب تلك موسيقي الروك اندر رول صدقونى هو من جعلني عاشقه او بل اصح مهووسه بكل انواع الموسيقه الغربيه لذلك لن يفرقنا الموت بل يكفني سماع صوته ليجعل قلبي ينبض الي اخر نبضه في حياتي واتمنا ولماذا اتمنا وانا اعرف ان ملك الغيتار لن ينسا من ذاكرة البشر وتاريخ سوف يقيد هذه..............."
