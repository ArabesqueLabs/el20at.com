[[comments]]
order = 0
subject = "لماذا يقبضون علىالشرفاء"
author = "مصرى عادى"
text = "احيانا اصاب بالغباء واسال اسئلة غبية ؟<br />لماذا يقبضون على الناس بدون اى اسباب جنائية ؟ هل الحكومة تخاف من هؤلاء الناس ؟<br />هل هم قادة الوية مدرعة او كتائب مشاة ويخشى ان يقوموا بقلب نظام الحكم<br />مواطن برىء اعزل ليس لدية حول ولا طول ولا يستطيع ان يتشاجر مع اى انسان يقول لة ضابط هايف وقاضى مخبول انت متهم بالتخطيط لقلب نظام الحكم<br />انت متهم بالاشتراك فى مجموعة محظورة<br />مش عارف متى هنتخلص من حكم المماليك وشرطة المماليك<br />وربنا يفرج عن المظلومين بحق الشهر الفضيل ويصيب بالشلل كل ظالم مفترى متفرعن على اللة"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"

[[comments]]
order = 1
subject = "ازمة اعتقالات مجلس الشورى المسئول عنها المرشد العام"
text = "طبعا كما تعلمون انه حصلت ازمة اخرى بين الحكومة والاخوان بمناسبة اعلان الاخوان دخولهم انتخابات مجلس الشورى<br />وكان يجب ان يعرف المرشد العام وخصوصا بعد ان فاز بـ 88 مقعد في مجلس الشعب والتداعيات التي حصلت والحكومة التي كشرت عن انيابها ضد جماعة الاخوان المسلمين كان يجب عليه تمشيا مع الحديث القائل كلهم راع وكل راع مسئول عن رعيته ان يعلم انها معركة خاسرة ولا يدخل فيها ابدا وكانت النتيجة اكثر من 500 معتقل<br />500 رب اسرة وابن حرقوا اكباد اسرهم بهذا الاعتقال<br />ونوجه نداء الى المرشد العام على ما يبدو انك ما لكش علاقة بالسياسة على الاطلاق فالسياحة فن وذكاء ومكر ودهاء وليست غشومية<br />وما يفعله الاخوان المسلمين ليس له علاقة بالسيارة على الاطلاق فهم بهذه الطريقة اشبه بالثيران التي نراها في حلبة المصارعة"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"

[[comments]]
order = 2
subject = "حلوة حكاية غشيم فى السياسة دى"
author = "إخوانى"
text = "الى الاخ المعلق اللى فات ، يا ريت يا عم الله يباركلك- يا اللى مش غشيم فى السياسة - تكتب صح الأول وبعدين ابقى علق ، وبعدين عيب قوى تتكلم عن مرشد الإخوان بالشكل ده ، الله يبارك لسيادتك المرشد ده اتسجن 20 سنة \" أظنها قد عمر سيادتك كله \" وله شغل برة مصر يا ريت تسأل حد أكبر منك عليه ، ده غير إنه عضو مجلس شعب سابق ، وغير كده حاجات يا ريت تسال عنها لو سمحت ، وكلها فى السياسة والله وقبل ما ينتخب مرشد كمان . وكفاية كده"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"

[[comments]]
order = 3
subject = "غشيم فى السياسة قال"
author = "شوكولاتة"
text = "اى سياسة ياروح ماما اللى انت بتتكلم عنها الناس دى اتسجنت واتلفق ليها تهم علشان يخلى الجو لحزب التزوير ليمارس نشاطة بكل حرامية ونشاط وبعدين المرشد حفظة اللة فى غنى عن شهادة امثالك"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"

[[comments]]
order = 4
subject = "تيران مين ياجاموسة"
author = "طارق"
text = "دول اللى اختاروهم ناخبيهم وفية زيهم تم تزوير نتائجهم لصالح حكومة الظلم والقهر وطبعا اتسجن مظاليم كتير بسبب الانتخابات الا لذنب وحيد اقترفوة الاوهو التصويت للحق ولمن يخدم مصالحهم وطبعا الحكومة البوليسية مش عاوزة حد يرفع صوتة اويقف فى وشها ويقولها كفاية ذل واهانة وامتهان لكرامة الانسان المصرى"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"

[[comments]]
order = 5
subject = "الى الاخ اخواني (انت جبت التايهة)"
text = "المرشد العام دخل السجن 20 سنه<br />والشيخ محمد متولي الشعراوي فسر القران في 20 سنه<br />ايهما خدم الاسلام"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"

[[comments]]
order = 6
subject = "رد على شوكولاته"
text = "بصي يا شوكولاته انتي بتقولي ايه<br />انت بتتكلم عنها الناس دى اتسجنت واتلفق ليها تهم علشان يخلى الجو لحزب التزوير<br />اهي هي دي الغشومية يا حلوه لان السياسي لازم يكون مفتح ويعرف الطرف الثاني بيفكر ازاي وبيدبر في ايه وبيخطط في ايه واخدة بالك يا شيكولاته"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"

[[comments]]
order = 7
subject = "رد على طارق"
text = "شوف يا اخ طارق لما الاخوان المسلمين كانوا دعوى اسلامية يعني تعليم الناس الدين والخير وارشادهم الى طريق الهدى زي الشيخ الشعراوي كده كنا اول ناس بنأيدهم<br />لكن لما بقوا حزب سياسي محض لا يفكرون الا في الوصول الى السلطة والله كل واحد حر اللي عايز يايدهم يايدهم واللي مش عايز هو حر كل واحد حر في الحزب اللي يختاره<br />وانا بنقض حزب الاخوان المسلمين نقض موضوعي<br />لطفا يرجى قراءة تعليمي مرة اخرى وشكرا"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"

[[comments]]
order = 8
subject = "انتخابات تحت نظرالعالم كلة مع تكافؤ الفرص وبعدكدة نشوف لمين الاغلبية"
author = "سكالوب بانية"
text = "لايستطيع مبارك اويجرؤ على هكذا خطوة لان زبانية الحزب لن توافق حتى لوكلف الامر خلع الرئيس لاى سبب كان مرض او زهايمر مش حيغلبو بتلفيق اى حاجة بشرط ان الوضع يبقى على ماهو علية بمبارك اوبدونة"
archived = "2007-09-22"
capture_url = "https://web.archive.org/web/20070922090434/http://masr.20at.com:80/newArticle.php?sid=12008"
