subject = "مصري في قائمة أفضل خبراء المال في العالم"
text = "مصري في قائمة أفضل خبراء المال في العالم<br />الشرقية أون لاين - 9/9/2007 م<br />إنجاز كبير حققه رجل الاقتصاد المصري «نبيل البوشي»، حيث اختارته هيئة الاحتياطي الفيدرالية الأمريكية من بين أفضل خبراء المال في العالم، واحتل المركز الـ 24 على العالم، متقدما أربعة مراكز عن ترتيبه العام الماضي،<br />علما بأنه الخبير المصري والعربي الوحيد بين 50 خبيرا تختارهم الهيئة سنويا، وكان الشيخ «حمدان بن راشد آل مكتوم» نائب حاكم دبي ووزير المالية والصناعة قد عين «البوشي» في منصب يقوم علي أساسه بوضع معايير تقييم أداء شركات إدارة المحافظ في دبي."
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"

[[comments]]
order = 8
subject = "قائد عام شرطة دبي : البوشي اجتهد فأخطأ"
author = "اتعلموا من الناس المحترمه يا مصريين"
text = "الخليج - نادية سلطان/<br />أكد الفريق ضاحي خلفان تميم القائد العام لشرطة دبي أن قضية رجل الأعمال المصري نبيل البوشي في حوزة النيابة العامة بدبي ودور شرطة دبي انتهى بعد تلقي بلاغات الشيكات المقدمة، واستجوابه فيها ومن ثم تم تحويله الى النيابة العامة التي امرت بتوقيفه على ذمة تلك البلاغات تمت تسوية أحدها والبقية قيد التحقيق في النيابة العامة.<br />وقال الفريق تميم: إذا أردت ان أتحدث عن البوشي أقول ان كل من حاول وجاهد ان يعمل من اجل عمل استثماري، وحاول إيجاد فرصة ولم يحالفه الحظ يجب ألا نقول عنه إنه محتال أو نصاب.<br />وأضاف: أنا كمسؤول أمني أقول يجب ألا يخلق الناس قصة على رجل واجهته اشكالية مالية لأن الواضح من ملابسات وظروف القضية ان الرجل لم يحالفه الحظ، فالتجارة فشل ونجاح والاستثمار فشل ونجاح، وخاصة في ظل الظروف العالمية الحالية.<br />وأفاد قائد عام شرطة دبي: أتوقع انه ربما كان البوشي حسن النية ولكنه اجتهد فأخطأ وكلمة نصاب أو محتال من الصعب ان ننعت بها مستثمراً لم يوفق، لافتا الى ان هناك شركات عالمية لها مجالس ادارات قوية ومن مئات السنين ولها اسم وتعرضت لاشكاليات في ظل الوضع الراهن.<br />وقال: أنا لا اعرف حجم قضاياه في مصر، ولا ظروفها وملابستها، ولكن اعتقد انه لو كانت لديه نية الهروب لكان استطاع قبل ان يكشف أمره إلا ان الواضح انه كان يعمل وكان يحاول ان يجد مخرجا للمطالبات المالية عليه ولكنه لم يوفق.<br />وفي ما يتعلق بأمر تسليمه للسلطات القضائية المصرية من عدمه قال الفريق ضاحي خلفان: انه بالتأكيد لن يسلم في الوقت الحالي، طالما عليه قضايا هنا في الامارات، ولكن بمجرد إنهاء مشاكله على خير وفيه طلب من السلطات المصرية لتسليمه فالمسألة تعود للمحكمة، لافتاً الى ان علاقات الامارات بمصر علاقات طيبة وجيدة ولا يوجد ما يمنع من تسليمه، ولكن القرار الاخير ليس في يد الشرطة ولكنه عائد للسلطات القضائية الاماراتية."
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"

