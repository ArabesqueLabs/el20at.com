subject = "دبى لن تسلم البوشى لمصر - معاملة بالمثل - لان مصر رفضت تسليم السكرى وهشام مصطفى لدبى من قبل"
text = "بتوع دبى مش بيلعبوا استغماية<br />زى مصر ما رفضت تسليم السكرى وهشام مصطفى لدبى فى قضية قتل المطربة اياها على ارض دبى ومصر قالت ان مفيش اتفاقية تبادل المجرمين مع الامارات<br />فا اعتقد ان دبى مش هتسلم احد لمصر<br />لان فية راجل هناك اسمة ضاحى خلفان"
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"

