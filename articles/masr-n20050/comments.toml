subject = "مصر عايزه الامارات تسلم البوشي ليه دي مصر اللي بتساعد الحراميه انهم يهربوا من مصر"
author = "مش ممدوح اسماعيل بتاع العبارة"
text = "عجبت والله ان مصر بتطالب بتسليم البوشي<br />لان مصر هي اللي بتهرب الحرامية من جوا مصر<br />واخرهم ممدوح اسماعيل هرب من مصر<br />هي الحكومة المصرية ما تتشطرش الا على الغلابا وبس"
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"
