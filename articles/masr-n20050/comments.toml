order = 0
subject = "انا اشجع امثال البوشى ومستعد لاضع فلوسى عندهم"
author = "بوشى"
text = "الحكومة خسفت بسعر الفائدة فى البنوك ارضاءا لرجال الاعمال<br />رجال الاعمال عايزين ياخدوا فلوس المودعين فى البنوك يعملوا بها مصانع ومشروعات ومش عايزين يدفعوا فائدة وضغطوا على الحكومة علشان تنزل الفايدة على المودعين الغلابة فى البنوك لصالح رجال الاعمال<br />انما امثال البوشى بيدفعوا عائد كويس والناس اللى وضعت فلوسها عندة متعلمين ومثقفين وفاهمين كويس<br />انما الامور لخبطت معاة فى الاسهم وخسر<br />بس انا افضل ان اضع فلوسى عند امثال البوشى بعائد كويس ولا داعى لملاليم بنوك الحكومة اللى بتعطى مدخراتنا لرجال الاعمال<br />سلام يا بنك يا مركزى"
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"

[[comments]]
order = 1
subject = "البوشي في دبي محبوس على ذمة قضايا شيكات بدون رصيد ومطلوب تسليمه لمصر"
author = "عايش في دبي"
text = "أولا:- يحبس المطلوب تسليمه / نبيل علي محمود البوشي - مصري الجنسية احتياطيا على ذمة طلب التسليم مدة 15 يوما يبدأ سريانها عقب انتهاء حبسه على ذمة الدعوى الجزائية رقم (2009/2645) ويراعى التمديد له في الميعاد.<br />ثانيا:- مخاطبة السلطات المصرية لإرسال أصل ملف استرداد المذكور بالطريق الدبلوماسي وفقا للاتفاقية المعقودة بين البلدين، على أن يتم ذلك خلال (30) يوما للتقرير بما يلزم."
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"

[[comments]]
