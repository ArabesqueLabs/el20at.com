[[comments]]
order = 4
subject = "وكأن المصريين لم يتعلموا درس الاحتيال عليهم بواسطة شركات توظيف الأموال"
author = "مش حرامي"
text = "حيعمل ايه المصريين<br />لما بنوك الدولة بتسرق مدخراتهم وبتضحك عليهم وبتديهم 6% واللي شغالين في البنوك بيلطشوا الباقي<br />كانت الفايدة 10% وعم نظيف نزل الفايدة وخلاها 6%<br />حرام<br />ظلم<br />على الاقل المفروض تكون الفايدة اقل شيء 15%<br />في ظل انهيار الاسعار لا يمكن ان تكون اقل من ذلك<br />علشان خاطر كده الناس بتلجأ لموظفي الاموال<br />علشان خاطر الواحد يحس انه مستثمر وبياخد حاجه من فلوسه<br />ونرفع ندائها هذا الى المسئولين في الدولة<br />6% ما ينفعش"
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"

[[comments]]
order = 5
subject = "يا جماعة البوشي كان بيستثمر الفلوس في البورصة يا جماعة"
author = "مش ضايع"
text = "البوشي مش حرامي ولا نصاب<br />البوشي مستثمر وكان بيستثمر هذه الاموال في البورصة<br />والبورصات راحت في ستين داهية<br />يعمي ايه<br />طيب ما هي فيه بنوك انهارت وشركات كبرى انهارت تماما وضاعت فلوس الناس"
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"

[[comments]]
order = 6
subject = "البوشي في قائمة أفضل خبراء المال في العالم"
author = "مش كاتب"
text = "البوشي في قائمة أفضل خبراء المال في العالم<br />الشرقية أون لاين - 9/9/2007 م<br />إنجاز كبير حققه رجل الاقتصاد المصري «نبيل البوشي»، حيث اختارته هيئة الاحتياطي الفيدرالية الأمريكية من بين أفضل خبراء المال في العالم، واحتل المركز &--1634;&--1636; علي العالم، متقدما أربعة مراكز عن ترتيبه العام الماضي،<br />علما بأنه الخبير المصري والعربي الوحيد بين &--1637;&--1632; خبيرا تختارهم الهيئة سنويا، وكان الشيخ «حمدان بن راشد آل مكتوم» نائب حاكم دبي ووزير المالية والصناعة قد عين «البوشي» في منصب يقوم علي أساسه بوضع معايير تقييم أداء شركات إدارة المحافظ في دبي."
archived = "2009-02-22"
capture_url = "https://web.archive.org/web/20090222123101/http://masr.20at.com:80/newArticle.php?sid=20050"

[[comments]]
