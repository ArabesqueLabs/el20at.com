text = "هي المدونة اللي مسخرة ولا عشرينات هي اللي مسخره ولا علاء القمحاوي هو اللي مسخره<br />فهمونا<br />يا عم علاء يا قمحاوي هي المدونات مجانية صحيح وببلاش وكل واحد بيكتب اللي هو عايزه ويسميها الاسم اللي هو عايزه بس عيب الاسماء دي"
