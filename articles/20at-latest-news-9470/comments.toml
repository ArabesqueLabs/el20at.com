subject = "مسلسلات تهدم الأسر"
author = "باحثة عن الحقيقة"
posted = "2008-06-29"
text = "السلام عليكم :<br />فعلاً انه لمن السخف الشديد أن يكون لمسلسلات لا تعكس شيئاً عن واقع حياتنا أن يكون لها هذه التأثير . .<br />أنا لا أتكلم انني ضد مشاهدة هذا النوع من المسلسلات , لكنني ضد التقليد و التأثير التي تفرضه علينا نحن العرب المسلمين .<br />سبحان الله , الآن المسلسلات التركية و قبلها المسلسلات المكسيكية , و الله أعلم ماذا سوف يأتي بعد .<br />اتمنى أن لا نسمع عن مزيد من حالات الطلاق , فالزواج ذكر في القرأن على أنه( الميثاق الغليظ ). فماذا سوف يقول الطليق يوم القيامة لله عز و جل<br />طلقت زوجتي من أجل مهند ‍‍!!!!"
