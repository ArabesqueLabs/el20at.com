text = "بصراحة انتو عارفين انو كل ممثل بحب يظهر افضل ما عندو كي يلفت انظار المشاهدين من حب و رومانسية و هذا كله تمثيل ليس واقع ولا حقيقة ولا يمكن ان يكون مهند او اي رجل او شاب بكل هذه المواصفات الظاهره التي سحرت قلوب المشاهدين ومع انني بنت ولكن الاغلب هم البنات يسحرن وينجذبن من كلمة احبك او عند سماع كلام رائع وجميل او سماع اسم مهند تفتح فمها و تشهق و كأنها سمعت خبر موت احد او يوم القيامة قد اتى هذه تسمى سخااااافة لا مثيل لها فيقو على انفسكم و انظرو من حولكم الى اخوانكم المسلمين الذين يموتون كل يومم من شهداء في فلسطين و العراق ولبنان...............................<br />و اشكركم لحسن استماعكم لما كتبته<br />عبير من الأرن"
