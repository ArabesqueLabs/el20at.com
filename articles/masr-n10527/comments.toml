posted = "2007-12-06"
text = "انا من اشد المعجبين بفكره فيلم اوقات فراغ والقضايا التى ناقشها الفيلم ..... وانا عن نفسى هادخل فيلم الماجيك عشان لازم نشجع الافلام التى تناقش الواقع بطريقه جيده عكس بالطبع افلام عائله السبكى اللى ابطال افلامهم هاذكرهملكم وانتوا احكموا ( عماد بعرور- سعد الصغير- دينا - هيفاء) مش كفايه كدا ولا ايه ارحمونا يا جدعان ...... متهيألى احسن ندخل الماجيك مش كدا ولا ايه ؟؟؟؟؟"
