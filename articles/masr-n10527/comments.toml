[[comments]]
order = 0
subject = "مش هيحقق"
author = "مش مهم"
text = "قمة الهايفة وقصة مكررة والله عيب ان نظهر شباب مصر فى كل الا فلام با لهايفة دى مصر فيها شباب زى الفل ملتزم يعرف الصح من الغلط لكن دول مش مصر دول والكاتب والمنتج والمخرج قمة الهايفة طبعا هو ماله اهو بيكسب خمسة مليون على حساب المغفلين العيال دى مش هم اللى كانت جابهم هالة سرحان واصلا مش عارفين مين هو امين جامعة الدول العربية ولا اسماء وزراء مصر والله عيب قوى ان دول يكونوا مصر جتكو القرف مليتوا البلد"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608122819/http://masr.20at.com:80/newArticle.php?sid=10527"

[[comments]]
order = 1
subject = "فيلم اوقات فراغ جامد"
author = "كتكوت"
text = "اعتقد ان النوعية دي من الافلام احسن بكتير من الافلام اللي من نوعية كتكوت اللي بنشوفها من وقت للتاني<br />بس يالايت نلاقي افلام عن مختلف فئات الشباب ونتكلم عن كل حاجة في مصر بصراحة وبوضوح ومنعملش زي النعامة اللي بتدقن راسها في الرمل"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608122819/http://masr.20at.com:80/newArticle.php?sid=10527"

[[comments]]
order = 2
subject = "التلقائية فى الاداء"
author = "the venom"
text = "لو بنفس تلقائية الاداء اللى شوفتها فى اوقات فراغ يبقى فيلم محترم وهينجح"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819201928/http://masr.20at.com:80/newArticle.php?sid=10527"
