[[comments]]
order = 3
subject = "طبعا هايحقق نجاح جامد وهيبقى زى القنبله لان القلا"
author = "dodo"
posted = "2007-10-30"
text = "بصراحه انا شايفه انه هايحقق اكتر من نجاح اوقات فراغ كمان لان دلوقتى احمد وكريم وعمرو بقوا معروفين وكل او معظم الشباب ف مصر بقوا بيحبوهم فعشان اوقات فراغ كان ناجح لازم اللى حب الفيلم بتاع اوقات فراغ وانا منهم على فكره هايدخل الفيلم بتاع الماجيك عشان يشوف الابطال ف صوره جديده وانا اول اللى هايدخلوه باذن الله لانى عجبنى اوى فيلم اوقات فراغ وخصوصا احمد حاتم بصراحه كان متميز وبرضه كريم قاسم وعمرو عابد الفيلم كله بصراحه كان ممتاز وربنا معاهم ف الماجيك لانه هايبقى فيلم رائع من القلا"
archived = "2010-03-14"
