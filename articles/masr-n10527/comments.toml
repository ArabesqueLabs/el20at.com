subject = "السينما والحياة"
author = "شاب  مصرى"
posted = "2008-01-06"
text = "السينما والحياة - - انا حاسس ان فعلا العنوان دا هو احسن عنوان يتحط ودا مكانه لان السينما فعلا بقت جزء كبير جدا جدا من حياتنا - - واظن ان الافلام الواقعية اللى من النوع دا هى اهم افلام وانجح افلام - - لكن برده يمكن ناقص فيها شوية حاجات او يتركز على حاجات وحاجات تانية لاء - - وعلى نوعية معينة من الشباب والشباب انواعهم كتير ولو كان فى توافق فى حاجات معينة بين كل الشباب لكن مش كل الشباب زى بعض - - يعنى ممكن نقول بداية موفقة جدا ."
archived = "2010-03-14"
capture_url = ""
