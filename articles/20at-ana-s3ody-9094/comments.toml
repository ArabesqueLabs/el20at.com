[[comments]]
order = 2
subject = "مؤامرة"
author = "ارفع راسك"
posted = "2008-05-17"
text = "فعلا هي مؤامرة واضحة وهذا الأمر لا يخفى على أحدوكل الدلائل واضحة<br />أما الأخ الأردني اللي فوق فمن قال أن عبدالله انسحب لسحب السعودية رعاياها من لبنان<br />هذه إشاعة روجها الأردنيين وتم نفيها في منتدى عبدالله الدوسري"
