[[comments]]
order = 3
subject = "ايه التخلف ده"
author = "د/محمد الفاتح محمود"
posted = "2008-05-18"
text = "عرب جرب صحيح كل همهم استار اكاديمى حتى بعد الفيديوهات اللى اتسربت منه واللى كله عرى وفجور ومحدش قادر يلمهم طبعا معندهمش مشاكل الرغيف زينا ولا فرص العمل مش معاهم البترول اللى سلموه لامريكا بقا دول يعرفو حاجه عن النكبه دا ازا عرفو يعنى ايه كلمه نكبه بس فالحين يشجعو الهايفيين والراقصيين بس وخلاص ودا مخلى اسرائيل متربعه ومش هممها حد بس الخير موجود فين عارفين فين فى مصر ومصر فقط بشبابها ورجالتها وبناتها اللى يشرفو اى واحدكفايه علينا اسراء عبد الفتاح دى بمليون واحده من بنات العرب اللى فالخين فى الكلام الهايف بسولى عتاب اخير على عشرينات انتو لسه ما اعلنتوش نتيجه المسابقه بتاعتكم لحد دلوقت ليه مستننين ايه فرحو الناس وعرقوهم ان زى ما فيه استار اكاديمى فيه استار عشرينات اللى هما شباب مصر اللى يفرح اللى هم الامل فى النهضه والتقدم وعدم التبعيه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "امنية ضائعة"
author = "بيبو المصرى"
posted = "2008-05-20"
text = "كنت اتمنى ان توفر مثل هذه الامكانيات الجبارة التى ينعم بها برنامج استار اكاديمىالى برنامج يوحد العرب ويقوى ثقافتنا العربية ويؤكد على اهمية تقاليدنا العريقة والصحيحة بدلا من ان يكون عرضا هزليا يحوى العديد من المأسى بدءا من الاختلاط المنحل والغير اخلاقى بين الشباب والفتيات وما يحويه من مشاهد خادشة للحياء مرورا باظهار بطوله مزيفة لشخص نرجسى مريض بجنون العظمة المسمى بقويدر واخيرا وليس اخرا المؤمرات والفبركة التى لا تخفى على احد كل هذا لم يمنع ان يظهر شخص دمث الاخلاق مثل الدوسرى بموهبته الخلاقة وقد مثل السعوديين باحسن صورة مثلما فعل من قبله النجم هشام بنفس الاخلاق الكريمة لكن من الواضح ان المعايير انقلبت واصبحت صورة الشاب المغرور او الشاب الناعم الذى يتمايل على انغام غربية تطغى على صورة الشاب العربى الاصيل ذو الموهبة الجادة مثلما طغت شخصية ميرهان المتحررة بشورتها الشهير وصوتها الضعيف على شخصية و موهبة وصوت قوى ومحترم مثل شاهيناز وضياء"
archived = "2010-03-14"
capture_url = ""

