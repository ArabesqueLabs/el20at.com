[[comments]]
order = 0
subject = "عبدالله ستار مهم صار"
author = "سعودي وأفتخر"
posted = "2008-05-17"
text = "عبدالله ستار مهما صار<br />ورفع رأس السعودية والخليج وكان الأقرب للفوز باللقب لولا حقد الحاقدين<br />وعدم نزاهة البرنامج اصبحت واضحة وضوح الشمس<br />لا أعرف ما سر دفاع مديرة الكاديمية عن محمد قويد رغم سوء أخلاقه<br />وبدلا من عقابه عاملين عنه ريبورتاج في حفلة البرايم<br />انهم اسوأ مثل<br />نعم للمقاطعة<br />لا ستار أكاديمي بعد خروج الدوسري"
archived = "2010-03-14"
capture_url = ""

