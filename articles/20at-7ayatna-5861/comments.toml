text = "ياجماعه ليه كده مش فاكرين فى حياتنا الا ذكريات الم بس لو شوفناه بمنظور تانى هنشوفها حب واشتياق للاحباب<br />وانا عن نفسى الذكريات الاليمه فى حياتى بنساها وساعات بينى وبنكم بعمل نسيها علشان هتتمحى من حياتى وكفايه انى عشتها بمررتها<br />اما ذكرياتى الحلوه ديما على بالى علشات تحلى دنيتى وتمحى اى ذره هم او زعل<br />تمنياتى ليكم ببسمه لا تفارق قلوبكم بذكره حلو فاتت وذكره قادمه اكثر منها سعاده"
