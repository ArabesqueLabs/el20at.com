subject = "مدن الاحزا ن"
author = "هوووووبه"
posted = "2007-05-14"
text = "مُدُنَ الأحزان..<br />لم أعرِف أبداً أن الدمعَ هو الإنسان<br />أن الإنسانَ بلا حزنٍ..<br />ذكرى إنسان ...<br />قلبتو المواجع ياعشرينات<br />ذكرياتي 9يوم سفري وتحضير الشنط ومش عارفه حرجع تاني ولهلا<br />وماما وهي بتعيط وانا كمان ...<br />يااااه بس لحسن اقلبها عياط بالمناسبه لو نوفا علقت النكته وصلتني<br />هم يضحك وهم يبكي.. يانوفا<br />علي العموم ياجماعه الاشعا<br />بتختصر اللي الواحد حسه مش عارفه اعبر يعني فالاشعا رمصد<br />ر تعبيرير<br />بس خلاص"
