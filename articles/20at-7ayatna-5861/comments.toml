subject = "لن تحيا بدون الذكري ... المؤلمة"
author = "محمد السيد"
posted = "2007-05-15"
text = "\"لم أعرف أبدا أن الدمع هو الإنسان .... أن الإنسان بلا حزن ذكري إنسان ...\"<br />دخلت في أوجع أركان القلب ... الجزء المبكي بداخلنا ... المحزن ... المفجع<br />... المؤلم ...<br />أصدق أفكارنا ومشاعرنا وأحاسيسنا ...<br />هل يمكن أن تجدي شيئا ... أصفي من حزن الذكري ... وأرقي من صدق الألم ...<br />؟<br />لم أكن أنوي التعليق ...اكتفاء بأحزاننا في حياتنا ... ولرغبة داخلية في البعد عن مثل هذا<br />الصندوق ... صندوق الذكريات ...<br />لكني آسفا .... أعلق ... والنية لم تكن موجودة ...<br />مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\"بس مش كده يعني\"<br />mohamedmat@hotmail.com<br />تقدروا تروحوا هناك دلوقتي<br />www.mesh7askot.blogspot.com"
