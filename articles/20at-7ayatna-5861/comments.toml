[[comments]]
order = 1
subject = "سلام على قلبي المتحطم بأحزان الماضي"
author = "اكتب اسمك هنا"
posted = "2007-05-14"
text = "السلام عليكم....<br />كان هذا اليوم الاخير من سعادة حياتي حين تركت البلاد<br />وكان اليوم الأصعب في حياتي<br />حين اخترنا دار الغربه على بلادنا الحبيبه<br />وحين اجربتنا الدنيا على ترك بلادنا من اجل امور سياسيه...لا علاقة انا فيهااا<br />وحين تركنا الاهل والاصحاب...بدموع لانعرف الي ستنتهي بينا<br />وحين سرنا على الحدود البلاد لنودعهاااا...وانا واهلي على الحدود ...حبست دموعنا...<br />ومن من بكى ومنا من الازمه نفسه<br />وكان الصمت قد عم المكان...وكلمتنا الاخيره ......مع السلامة ياعراق......<br />وحين احتله العراق<br />قد وجهت صدمه حقيقيه...<br />فقد جلبت بقاموس الاحزان لكي أرى كلمه تعبر عن مافي بداخلي لكن لم اوجدهااا<br />فبدت الجرح تنزف لحد يومي هذا وانا اشاهد مدن بلادي تأن وتتألم وتصرخ والاموات في كل مكان وفي كل يوم....<br />ماذا اذكر..!!؟؟ وماذا اقلب..!!؟؟.... من ماضي المؤلم<br />واذكر حين سمعت عمتي في التيلفون على امل من ان نلتقي بيها انا واهلي...لكن حدث ما لم يكون في الحسبان<br />قد........... توفيت........لا حوله ولا قوة الا بالله<br />في خبر تلفوني جأنا فجأ....ولم يكون الخبر الاخير في وفاتها فهناك عمامي وأقربائي قد توفيه منهم نعرف اسباب الوفات ومنم لا نعرف بال الله اعلم بيها<br />فعرفت الدنيا هي دار الامتحان....بلا شك<br />وان سعاده لا نرها هنا بال في الاخره..ان شاء الله<br />ذكريات تذكر ولا تعود<br />وسعاده ربما تعود<br />والبلاد تحتل ربما لا تعود كما كانت....<br />سلام على ماضي الحزين"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "للاحزان عوده"
author = "نيفين نيفى نوفا"
posted = "2007-05-14"
text = "هاى يا هوووبه<br />كان نفسى اخر مره نتكلم اكتر<br />و احنا ع المسنجر لما اتكلمتى عن الغربه دمعت بس دلوقتى و انا بقرا تعليقك عيطت<br />فكرتين بفراق الاحباب<br />الساعه 2 بعد نص الليل و انا صحبتى اللى معرفش عنها حاجه دلوقتى بنتكلم<br />خدى باللك من نفسك<br />و انت كمان<br />ابقى ابعتيلى<br />حاضر يا نيفى كل يوم<br />متعيطيش يا .....<br />مبعيطش يا نوفا<br />لا بتعيطى<br />و انا كمان بعيط يا ......<br />و سافرت و جالى منها اول جواب و رديت عليه التانى التالت الرابع......العشرين<br />و بعدين صممممممممممممممممممممممت<br />هى فين دلوقتى معرفش<br />دى كانت احدى اللحظات اللى متتنسيش<br />لحظه ما تعرف بجرح صديق لحظه متتنسيش<br />لما تفقد الثقه ف حد اقربللك من روحك لحظه متتنسيش<br />لما طعنات القدر لا تاتى فرادى لحظه متتنسيش<br />لما الظروف و الايام تجبرك تتخلى عن ناس بتحبهم و يرحلو و ياخدو حته من قلبك و عقللك و روحك ف شنط سفرهم لحظه متتنسيش<br />و كلها لحظات<br />و العمر لحظه"
