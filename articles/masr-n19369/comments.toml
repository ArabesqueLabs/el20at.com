[[comments]]
order = 0
subject = "شعبولا حيقدم برنامج اسمه المكوجي الناجح"
author = "مش مكوجي"
posted = "2009-01-21"
text = "كويس خالص انه حيبقى مذيع في الفضائيات وحيقدم برنامج مفيد لكل الشباب العاطل الفاشل الصايع اسمه المكوجي الناجح<br />لان شغل المكوه مش محتاج راس مال كبير ومش محتاج خبرة<br />فبرنامج المكوجي الناجح حيساهم الى حد كبير في حل مشكلة البطالة في مصر"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061936/http://masr.20at.com:80/newArticle.php?sid=19369"

[[comments]]
order = 1
subject = "والأستاذ ضياء رشوان خبير الحركات الإسلامية بمركز ا"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-01-21"
text = "حلوه اوي اوي اوي دي يا مصطفى شحاته<br />خبير في الحركات الاسلامية<br />يا سلام يا مصطفى شحاته المجاعة اللي في مصر والبطالة خلت الناس تفكر في حجات غريبة وعجيبه<br />اول مرة اعرف ان الحركات الاسلامية محتاجه خبير<br />عقبال الحركات القرعة<br />يبقى فيه خبير في الحركات القرعة<br />سلام يا درش"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061936/http://masr.20at.com:80/newArticle.php?sid=19369"

[[comments]]
order = 2
subject = "لكم الله يا خريجي كليات الاعلام"
author = "مش رضوى حسن ولا مروى صلاح"
posted = "2009-01-21"
text = "يا جماعة ممكن نقف مع بعض دقيقة حداد على خيبة خريجي كليات الاعلام<br />يا خسارة بيتخرجوا ويدوروا على اي شغل لان المكوجية والحرامية اصبحوا مذيعين دلوقتي ومتصدرين كل القنوات الاعلامية في مصر<br />دقيقة حداد على ارواح خريجي كليات الاعلام"
archived = "2009-01-21"
capture_url = "https://web.archive.org/web/20090121061936/http://masr.20at.com:80/newArticle.php?sid=19369"
