[[comments]]
order = 0
subject = "الغباء لة مسميات كتيرة"
author = "برضة انا"
posted = "2008-02-03"
text = "واحد او واحدة قابلت شخص بيدخن قال او قالت لة السجاير كخة ووحشة وبتجيب الواوا قام قال لها خلاص وراح رامى الولاعة وعلبة السجاير وقال توبة من بعد النوبة اشرب سجاير تانى<br />دا ينفع مشهد فى فيلم هندى بطولة زازا جابور او المرحومة راقية ابراهيم ومحمود المليجى فى افلام زمان<br />انا اخويا بيشرب سجاير وبقى لى عشرين سنة اسمعة محاضرات عن اضرار الدخان وكل ما اقرأ حاجة فى اى جرنان اجرى واقول لة عليها<br />ويرد عليا عمك الدكتور عندة 70 سنة وبيشرب سجاير كل يوم 3 علب وما جراش لة اى حاجة وفر كلامك<br />ثم انتم جايبين صورة المبروك عمرو خالد لية - هو دة اللى هيخللى الشباب ما تشربش سجاير<br />ابقوا تعالوا قابلونى فى سوق الجرسة"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093951/http://masr.20at.com:80/newArticle.php?sid=14069"

[[comments]]
