subject = "عايزين الناس تبطل حشيش وبانجو"
author = "اكتب اسمك هنا"
posted = "2008-02-03"
text = "يا عم عمر خالد سيبك من الحركات دي<br />سجاير ايه اللي انت شاغل نفسك بيها وانفلونزا الطيور ايه وبطيخ ايه<br />خلينا في الحشيش والبانجو<br />عايزين الشعب المصري يبطل حشيش وبانجو"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093951/http://masr.20at.com:80/newArticle.php?sid=14069"

[[comments]]
order = 3
subject = "الى الاستاذ برضه انا"
posted = "2008-02-03"
text = "كون ان السجاير بتجيب سرطان دي حقيقة علمية وكون اننا ندعي ان الناس تبطل السجاير دا برضه صح<br />ولكن فيه اولويات يعني اذا كان الشعب مدمن حشيش وافيون وبانجو يبقى من الاولى اننا نركز جهودنا في السكه دي<br />بس المشكلة ان عمر خالد راجل هاي هاي بتاع نادي الصيف والحكات الفخمه دي<br />والحشيش والبانجو موجود في الاحياء الشعبية وعمر خالد والشلة بتاعته ياي ما تقدرش تروح الحتت الوطيه دي<br />عمر خالد كفاية عليه نادي الصيد والنوادي الهاي هاي هاي"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093951/http://masr.20at.com:80/newArticle.php?sid=14069"

[[comments]]
order = 4
subject = "لماذا تهاجمون عمر خالد"
posted = "2008-02-03"
text = "هل لانه رجل يجذب اعداد هائلة من الشباب يلتفون حوله ليبسط لهم الدين و يجذبهم اليه<br />باسلوب لا ولم ولن يقبلوا او يفهموا غيره !!<br />والله لو كان \" بيتنطط \" على المسارح و يلتف حوله الشباب فى الملاهى الليلية ما كان احد جرؤ على مهاجمته !!<br />عمرو خالد انسان ناجح فى الدعوة الى الله ..<br />انسان يتقن و يجيد فن الدعوة الى الله .. غير اخرين نحترمهم ..<br />ولكن نهاب اسلوبهم المنفر الذى لا يذكرنا الا بالنار و العذاب !!<br />هل يجب ان يكون الداعى الى الله انسان متعصب غليظ فظ الاسلوب لا يقول الا كلمه الحق<br />دون التفكير فى اسهل و اقصر طريق لقلب المستمع !!<br />وعندما يظهر من يفهم عقلية هذا الجيل و يعرف كيف يصل اليهم .. يتهموه بالعلمانيه<br />و العماله و الكفر و موالاة الظلمه الفاسقين !<br />لا حول ولا قوة الا بالله .. استغفر الله العظيم !!<br />لماذا لم يهاجموا عمرو دياب مثلا !! .. او عادل امام و هو يستهزىء بالدين علنا فى الشاشات العربية كلها او ... او ... او .... او<br />لا يجوز مهاجمة رجل دين وداعية اسلامى .. وكونه يتواجد فى المجتمعات الغير اسلامية !!<br />فهل سيذهب للمساجد ليدعو الى الله مثلا !! .. هو يفكر بشكل سليم لان المجتمعات<br />التى لا يوجدفيها اسلام قوى هم احوج الى كلمة تعلمهم ما هو الاسلام و قيمه و مبادئه ..!<br />يا اخوة من فضلكم<br />لا تستجيبوا لهذة السياسات الخفية ,, تحقير من شان عالم دينى وزعزعة الثقه بالنفس و الدين<br />رجاءا دعوا الرجل فى حاله يدعو لله كما يريد .. والله يتقبل او لا يتقبل يحاسب ويعاقب او يكافىء<br />كلها بيد الله لا دخل لنا بذلك و لن يتحمل كل انسان الا وزره هو فقط .. ولن يجنى الا ما قدمت يداه<br />وارجو الا نرى موضوعات من هذه النوعيات الهدامة فى المنتدى ..<br />وان حدث فسيتم حذفها .."
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093951/http://masr.20at.com:80/newArticle.php?sid=14069"

[[comments]]
order = 5
subject = "الى المعلق السابق اللي فوق"
author = "اكتب اسمك هنا"
posted = "2008-02-03"
text = "انت تقول في تعليقك العبارة الاتية<br />ولكن نهاب اسلوبهم المنفر الذى لا يذكرنا الا بالنار و العذاب !!<br />هذه هي الزندقة هي عبادة اله بدون الخوف من النار<br />وكانت رابعة العدوية تقول الهم اذا كنت اعبدك لأدخل الجنة فاحرمني منها واذا كنت اعبدك خوفا من نارك فاحرقني بها ولكن اعبدك لانك انت الله<br />فهذؤه هي الزندقة<br />عبادة الله بدون الخوف من النار زندقة<br />وصدق الله العظيم عندما قال { تتجافى جنوبهم عن المضاجع يدعون ربهم خوفاً وطمعاً) اي خوفا من النار وطمعا في الجنة<br />يرجون رحمته ولا يخشون عذابه<br />فاذا كان عمر خالد لا يخوفكم من النار فهذه زندقة واسالوا أهل الذكر ان كنتم لا تعلمون<br />وفيه اخ جايب حديث فوق عن الرؤوس الجهاله حديث مهم جدا يحثنا على ان لا نأخذ الين الا من المتخصصين في اصول الدين"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093951/http://masr.20at.com:80/newArticle.php?sid=14069"

[[comments]]
order = 6
subject = "الى المعلق اللى فوق"
author = "نيفين نيفى نوفا"
posted = "2008-02-04"
text = "اولا بعتذر للاستاذ مصطفى هاشم لانى هخرج عن الموضوع<br />انا عايزه اسال الاخ او الاخت اللى كاتبين التعليق السابق<br />هل انت متاكد ان عباده الله بدون خوف من النار زندقه<br />و احب اعرف ايه مصدر المعلومه لانى بصراحه اول مره اسمعها<br />انا اعرف ان رابعه العدويه قالت بئس العبد من يعبد الله خوفا من ناره او طمعا فى جنته<br />لكن احب اعرف مصدر المعلومه دى و ايه الدليل عليها"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093951/http://masr.20at.com:80/newArticle.php?sid=14069"

[[comments]]
order = 7
subject = "الى الاخت نفين نيفي نوفا"
author = "ابومحسن"
posted = "2008-02-04"
text = "الزندقة هي الخروج عن منهج النبي عليه الصلاة والسلام والنبي محمد صلى الله عليه وسلم كان يخشى الله ويخشى عذابه ويخشى نار جهنم وكان يطمع في جنه الله وقال (فأسالوا لي الوسيلة) وهي مكان في الجنة يتمنى الرسول ان يكون هو الذي يفوز بالوسيلة<br />وبعدين يا اخت نفين انا وانتي نتعلم الدين من علماء الدين خريجي كليات اصول الدين<br />من غير ما اجبلك المصدر حضرتك شوفي اي عالم دين في المنطقة اللي انتي فيها ممكن يكون شيخ اقرب جامع عندكم واتاكدي من المعلومة<br />عبادة الله بدون خوف من النار (((((((((خروج عن منهج النبي صلى اله عليه وسلم ))))))))))<br />لانه صلى الله عليه وسلم علمنا كيف نخاف من النار<br />حتى بعد صلاة المغرب الرسول علمنا دعاء نقوله سبع مرات<br />الهم اجرنا من النار<br />اللهماجرنا ن النار<br />اللم اجرنا من النار<br />واخيرا<br />الزندقة هي الخروج عن منهج النبي صلى الله عليه وسلم<br />وانا وانتي يا نفين نسأل علماء الدين"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093951/http://masr.20at.com:80/newArticle.php?sid=14069"
