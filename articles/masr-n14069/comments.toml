subject = "عن عبد الله بن عمرو قال : سمعت رسول الله صلى الله"
posted = "2008-02-03"
text = "عن عبد الله بن عمرو قال : سمعت رسول الله صلى الله عليه وسلّم يقول : { إن الله لا يقبض العلم انتزاعاً ينتزعه من العباد ، ولكن يقبض العلم بقبض العلماء حتى إذا لم يبق عالم اتخذ الناس رؤوساً جهالاً فسئلوا فأفتوا بغير علــــم ، فضلوا وأضلوا } *."
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093951/http://masr.20at.com:80/newArticle.php?sid=14069"

[[comments]]
