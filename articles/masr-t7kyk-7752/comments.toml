[[comments]]
order = 0
subject = "وهيجيبوا فلوس منين ؟"
author = "ابو زهرة"
posted = "2007-12-08"
text = "كلام حلو وجميل وزى الفل بس اللى عايز يطبق الكلام دة هيجيب فلوس منين يفرقها على الناس<br />الاغنياء ما بيدفعوش ضرايب<br />اللى بيدفع الفقير<br />يبقى الفلوس هتيجى منين<br />الميزانية رايحة على جحافل الامن المركزى والمباحث<br />يلغوا الامن المركزى - هتتوفر ملايين بتاع اكلهم وشربهم ومواصلاتهم ولبسهم<br />وكل دة كلام فى الهجابص<br />هى الحداية بتحدف كتاكيت<br />يا ابويا دا كلام عالم ضربة بانجو رخيص من بتاع السبتية واحمد حلمى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "شبعنا من الاونطة"
author = "الاونطجى"
posted = "2007-12-08"
text = "الريس صرح وقال مش هيلغوا الدعم تفتكرو الكلام دة صحيح ولا اونطة امنيت حياتى ان الشعب المصرى يكون شيع من الاونطة الكل يوم بياكل منها دة يارب ارحمنا من الدنيا وبلاويها والبيجرى فيها"
