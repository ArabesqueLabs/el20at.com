[[comments]]
order = 2
subject = "طب هما فايدتهم ايه؟؟؟؟؟"
author = "كدة كتيييير"
posted = "2007-12-09"
text = "الحكومة تفرض علينا الضرائب دون مقابل فما فائدتها اذا؟؟؟ لا دعم لا علاج لا تعليم.....الخ بالظبط زي متروح تشتغل في شركة و يقولولك انت هتجيب المكتب و الورق و الاقلام و تدفع المرتبات و تجيب العملاء و تكسبو تدينا المكسب يا حلاوة ... طب ما الاسهل زي ما هتلغوا الدعم الغوا الضرايبو المخالفات و الحبشتكنات و سيبونا ندورها احنا"
archived = "2010-03-14"
