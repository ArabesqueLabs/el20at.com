[[comments]]
order = 3
subject = "هذة هي الدنيا"
author = "احمدابوسعيد"
posted = "2008-07-12"
text = "نعم اخوتي عندما ننظر الى احوال الناس في هذة الدنيا نجد من ينعم بالامن في مكانه و اخر يبحث عنه في كل مكان , ونجد من يملك الاموال ويفتقد للصحه أو السعادة أو الاولاد , ونجد ايضآ من لا يملك قوت يومه وعنده من الاولاد كذا وينام مرتاح البال مطمئنآ في فراشه . وفي النهايه الكل ميت حتى كاتب هذة الرسالة واما جنة واما نار اعاذنا الله منها ( اللهم ثبت الشيخ وجدي وكثر منه )"
archived = "2010-03-14"
