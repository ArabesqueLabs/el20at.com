[[comments]]
order = 0
subject = "يجب أن يغير وجدى غنيم من مبادئه"
author = "محمد حمدى"
posted = "2008-07-10"
text = "يجب أن يغير متبعى التفكير السلفى التشددى الرجعى أمثال الشيخ وجدى غنيم من مبادئهم القائمة على إنتقاد الحكومات والأفراد , وستظل مشكلة الشيخ وجدى غنيم دائما وأبدا مهاجمته لسلطات البلاد التى تأويه , أما عن النصاب الذى يتحدث عنه , فيبدو حديثه متضاربا عندما يعلن تاره عن أنه سيكشف أمره ويفضحه ثم يعلن تاره أخرى عن أنه أمتنع عن الحديث عن النصاب أمام القاضى لأن لديه أولاد !!"
