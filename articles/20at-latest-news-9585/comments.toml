subject = "ان بعد العسر يسرا"
author = "محمود غويص"
posted = "2008-07-11"
text = "الشيخ وجدى غنيم نسال الله العظيم ان يجعل كل هذا فى ميزان حسناتك<br />ثبتك الله على الحق<br />واقول لصاحب التعليق السابق سامحك الله وهداك فعلى الاقل احترم شيبة وسن الشيخ وجدى<br />وحسبنا الله ونعم الوكيل"
