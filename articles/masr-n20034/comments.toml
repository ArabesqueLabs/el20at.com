[[comments]]
order = 0
subject = "لية الفرنسيون راحوا"
text = "ما احنا لا نصلح لادارة اى شىء<br />ابعتوا للشركة الفرنساوى تانى تتجى تشغلة<br />واحنا نروح ننفع فى الامن المركزى"
archived = "2009-02-20"
capture_url = "https://web.archive.org/web/20090220151644/http://masr.20at.com:80/newArticle.php?sid=20034"

[[comments]]
order = 1
subject = "الموضوع بايض ليه امال فين السيد اللواء"
text = "ما هو كل حاجه في مصر اصبح المسئول بتاعها السيد اللواء<br />راح فين السيد اللواء بتاع مترو الانفاق"
archived = "2009-02-20"
capture_url = "https://web.archive.org/web/20090220151644/http://masr.20at.com:80/newArticle.php?sid=20034"

[[comments]]
order = 2
subject = "الغريب"
author = "متابع"
text = "الغريب في الأمر أن جهاز مترو الأنفاق صار مثالاً لمن ( يجيب الجنيه من بق العو ) .. فالنقود لا تنقصه .. ودليلنا علي ذلك انه باع كل شيء تقريباً لشركات الإعلان ...<br />1- سلالم المحطات<br />2- جدارن المحطات من الداخل ةعلي الرصيف .<br />3- تليفزون مترو الأنفاق .<br />4- بيع أرضية لأكشاك الجرائد والعطور وموبينيل والتميمي وغيرهم ..<br />5-علي جسم القطار من الخارج .<br />6-علي الجوانب المضيئة بداخل القطار نفسه .<br />ناقص يعلقوا اعلانات علي ظهور المواطنين ...<br />السؤال هو : الفلوس دي كلها .. بتروح فين ؟؟؟؟؟؟؟؟؟؟<br />صيانة .. حاشا لله .<br />تطوير .. أعوذ بالله .<br />تعيين سائقين وشراء قطارات لضبط زمن التقاطر .. أستغفر الله .<br />ده حتي بطلوا يرخصوا التذاكر في الأعياد ..<br />أكيد أكيد الهيئة بتخسر ...."
archived = "2009-02-20"
capture_url = "https://web.archive.org/web/20090220151644/http://masr.20at.com:80/newArticle.php?sid=20034"
