[[comments]]
order = 0
subject = "دعوة لاسكان السيد رئيس مجلس الوزراء و السادة الافاضل الوزراء ايضا؟"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "هل تخيلتم معى كيف تكون الاحوال عندما يتم الامر باسكان السيد الدكتور رئيس مجلس الوزاء و السادة الوزراء و السادة المحافظين الاجلاء فى منطقة (الدويقة) المنكوبة اياها هم و جميع افراد اسرهم الحبيبة الغالية لمدة سنة ميلادية كاملة بلا زيادة او بلا نقصان؟؟؟؟؟!<br />انها سوف تتحول الى جنة من جات اللة فى خلال 24 ساعة على اكثر تقدير<br />و يامحصل مثل هذا من قبل؟"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915031706/http://masr.20at.com:80/newArticle.php?sid=17555"

[[comments]]
order = 1
subject = "نكتة قذرة جدا جدا جدا او انها اشاعة مغرضة"
author = "و اللة العظيم انا خايف اكتب اسمى بعدين يسكنونى فى (الدويقة) يا ساتر استر"
text = "اسم باللة العظيم انى هاعت عندما سمعت بعض الشباب يتهامسون بصوت شبه عال<br />انة تم شنق السيد اللواء الوزير محافظ القاهرة على مدخل منطقة (الدويقة) و تمت تسمية مكان الشنق<br />(باب الدويقة)<br />عظة لمن لم يتعلم و يتعظ"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915031706/http://masr.20at.com:80/newArticle.php?sid=17555"

[[comments]]
order = 2
subject = "هم حقا شنقوة و لا اعدموة بجد"
author = "خايف اكتبة؟"
text = "اهداء الى الزير الوزير (محافظ القاهرة) ابن الوزير بالاسم و ليس الوزير بالنمصب<br />يا ريت يناسبك العنوان و تشنق او تقتل على(باب الدويقة)<br />رحمة على ارواح ضحايا الدويقة<br />و رحمة لحماية النظام<br />تقبل دعائنا يا اللة انك مجيب الدعوات"
archived = "2008-09-15"
capture_url = "https://web.archive.org/web/20080915031706/http://masr.20at.com:80/newArticle.php?sid=17555"
