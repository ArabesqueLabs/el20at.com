text = "و الله هذه المقالة أغضبتني فهي كاذبة و غير صحيحة و أنا مستغرب كيف تنشر مقالة كهذه على موقع في بلد إسلامي فالكلاب ليست ذكية بل إنها نجسة و من أنجس الحيوانات ما عدا كلاب الحراسة طبعاً فهي لماحة وشديدة الذكاء .<br />و السلام عليكم و رحمة الله ."
