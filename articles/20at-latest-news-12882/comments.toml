text = "يعني هي الكلاب مكروهة يا شكسي؟ لا طبعا بس العلم كل يوم بيكتشف حاجة جديدة في الدنيا اللي خلقهالنا ربنا وبعدين لما ربط بين ذكاء الكلب والانسان عشان يسهل عليك فهم الدراسة ما كان ممكن يربطها بأي حيوان تاني<br />بلاش نشوف كل حاجة بنظرة سوداء"
