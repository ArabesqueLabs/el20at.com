[[comments]]
order = 4
subject = "رد على تعليق المدعو قبطي"
author = "مش بحبك"
posted = "2008-06-02"
text = "الاقباط السكان الاصليين للبلد واصحاب الارض<br />يرجى مكالعة مقال اقباط مصر مسلمون لا نصارى واليكم الادلة للكاتب ابو اسلام احمد عبدالله على موقع بلادي نت فيه الرد الشافي على هذه الهلوسات<br />الاحتلال الاسلامى لمصر<br />فتح اسلامي وليس احتلال اسلامي والدليل على ذلك انتقال السكان الى دين الفاتحين واصبحت النسبة 94% مسلمين<br />الاقياط لا يعرفون الكذب ولا التقيه<br />دي واسعة اوي لان تقية الاقباط لله المجد في الاعالي وعلى الارض السلام وفي الناس المسره<br />وبالنسبة للكذب فقد قالوا ان الله هو المسيح وهذا ابشع الكذب<br />الرهبان الذين يتركون العالم لأجل التعبد<br />ـ لم نرى منهم عبادة وكل ما نسمعه عنهم اشياء سيئة<br />ـ الديانة الاولى فى العالم هى المسيحيه والعالم الاول مسيحى بكل مفرداته<br />قل هاتوا برهانكم ان كنتم صادقين (ما كان ابراهيم يهوديا ولا نصرانيا ولكن حنيفا مسلما"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091144/http://masr.20at.com:80/newArticle.php?sid=16085"

[[comments]]
order = 5
subject = "احذروا من الأقباط"
author = "مسلم مفتح عينه كويس"
posted = "2008-06-02"
text = "اخوتي المسلمين راقبوا افعال الاقباط عند حدوث اي خطر واي شئ يمسهم .. يهرعون للإستنجاد بامريكا وبالمهجر .. وهم في ذلك يفتحون بابا خطيرا للمهجر وامريكا للتدخل في شئون البلاد الداخلية .. بالمنطق اخوتي الذي يفعل هذه الفعلة ويهدد بإستخدام الامريكان والمحتلين عند اي خطر عليه .. ماذا سيفعل عند حدوث حرب وهجوم علي البلاد من الامريكان ؟؟ هل تظنون ان من يستنجد بهم عند كل خطر سيحزن ويقاوم ؟؟ لا والله انهم ليكونوا اول الخونة واول من يبيع البلد علي امل ان تكون لهم مكانة كبيرة في البلد بعد احتلالها وانهيار نظامها الحاكم .. راقبوا تصرفاتهم ومحاولاتهم الدائمة لإمتلاك اكبر قدر ممكن من الأراضي والممتلكات في البلد .. مثلهم مثل افعال اليهود.. احذروا اخوتي من الاقباط وتجنبوا وضعهم في مناصب قيادية او حساسة .. احذروا .."
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091144/http://masr.20at.com:80/newArticle.php?sid=16085"

[[comments]]
order = 6
subject = "اصل الاقباط - من اين هم ؟ ولماذا ظلوا فى مصر ؟"
author = "صعيدى من دشنا"
posted = "2008-06-02"
text = "اصل الاقباط بتوع مصر نوعين<br />نوع من اصل يهودى<br />تعرفون قصة خروج العبرانيين من مصر مع سيدنا موسى وهروبة من امام الفرعون وضربة البحر بعصاة لينشق ويهربوا الى صحراء سيناء - كل اليهود بنسبة 100 % لم يخرجوا مع موسى - ظل المرضى والمعاقين والمكسحين والجبناء وكبار السن ظل هؤلاء لم يخرجوا مع موسى ولم يهربوا من فرعون وهؤلاء هم اجداد الاقباط الموجودون الان وانزوا فى اديرة وقلايات فى اماكن بعيدة خايفين من الشعب المصرى ومعظم هذة الاديرة فى الصحراء بعيدا عن عيون الشعب المصرى<br />نوع من اصل رومانى<br />وهذا النوع تلاقية فى اسكندرية ووجة بحرى وشمال الصعيد وهتلاقى الشعر الاصفر والعيون الخضراء وهؤلاء بقايا الرومان الذين حاربهم عمرو بن العاص وابقاهم بعد الهزيمة يجمعون الضرائب كما كانوا قبل الفتح<br />اذن الاقباط ليسوا اصل ولا فرع البلد<br />دول شوية زبالة اجانب يجب طردهم الى حيث كلاب المهجر عند اقاربهم الرومان فى امريكا واستراليا<br />نصارى العراق طردوا جميعا من العراق بعد دخول الكلب الصليبى بوش العراق<br />هؤلاء يجب معاملتهم معاملة نصارى العراق<br />ويجب توقف تبجحهم"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091144/http://masr.20at.com:80/newArticle.php?sid=16085"

[[comments]]
order = 7
subject = "حتي الجهله يتكلمون"
author = "مسيحي مصري"
posted = "2008-06-05"
text = "مش عارف اقول ايه او اعلق بايه علي كل الجهل اللي مكتو والتعليقات السخيفه بجد واللي مفتح عينيه واللي عامل فيها مرشد وغيرهم بجد حاجا تحزن يا تري يا ابو جهل منك ليه انت مش بتعتبرنا مصريين وكلامك كله قزف واهانه يا تري دينك علمك كدا متهيالي لا فانت اسااس عار علي اسلامك وعار علي كل مسلم انك منهم لان الاسلام مامرش بكدا والاسلام نفسه قال عن الاقباط اللي بتتريق عليهم ولاتجدن اقربهم موده للزين امنو اللزين قالو انا نصاري لان منهم قسيسين ورهبان وانهم لا يستكبرون متهايلي انكم جاهلين بدينكم بس بتتكلمو من فراغ كمان لو تفتكرو حرب 73 يا تري وقتها كان المسلم وحده بيحارب ولا المسيحي بس ولا الاتنين لكن الجهل والتعصب الاعمي اللي بتنادو بيه حرام تتحسبو مسلمين ولا مصريين ويا ابو جهل منك ليه ورق الدير موجود للي يحب يشوفه ومن هيئه الاثار نفسها اللي محدداه يعني مش بيعتدو علي حد لكن اقول ايه في الجهل بجد خساره فيكم الكلام احنا مصريين زي بعض وكل اللي بنطالب بيه العدل ومعاقبه الجاني مسيحي او مسلم اه بالنسبه للقتيل اللي بتقول عليه اسال اللي جابوه مين اللي قتله ويا ريت تروح تشوف الرهبان دول والتعزيب والضرب اللي فيهم يا تري يا اخ لو شيخ حصل فيه كدا هتكون ردودكم بجهل كدا او بتخلف زي ما بتكتبو وكمان شوفا اللي حصل ليهم وقولولي في شرع مين دا ويا تري الاسلام قال كدا متهيالي لا دا الرسول وصي علي سابع جار ولا ايه"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091144/http://masr.20at.com:80/newArticle.php?sid=16085"

