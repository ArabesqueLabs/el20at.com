[[comments]]
order = 10
subject = "لا تنفخوا في النار فتحرقكم"
author = "مصري وبس"
posted = "2008-06-08"
text = "بين أونة وأخرى يظهر بعض المرتزقة للنفخ في النار والضغط على القيادة المصرية بورقة الأقباط والفتنة الطائفية وسريعا ما تستجيب القيادة لأرضاء السادة ويعاونها العمرء لتحقيق مأرارب الزملاء والدليل واضح فأحدات الزيتونحاولوا شعللتها ولم تجدي اللعبة أو تنطلي وفقدت كل المببرات وعلى الفور خد وهات ودار الأحداث في المنيا ورغم أنهم معتدين وقتلوا مسلم مسكين لكن لهم ظهر قوي ضربني وبكى وسبقني واشتكى<br />لكن المخلصين من ألقباط والمسلمين لم تنطلي عليهم اللعبة واتفرج على تقارير التلفزيون الناس غلابة وغلبانة وعايز تاكل عيش وتنام وهي تعبانة لكن نعمل ايه في المجرمين الله يطهر منهم البلد آمين<br />وهنا ادرك شهر يار الصباح فسكت عن الكلام المباح وترك للكلاب النباح ...<br />مولاي .. آوو ؤو أوْ"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 11
subject = "افيقوووووووووووووووووووووووا يامسلمى مصر"
author = "مصرى حتى النخاع"
posted = "2008-06-09"
text = "السلام عليكم<br />اولا اشكر عشرينات على الموضوع الهام.<br />ثانيا اقول لمسلمى مصر ...أفيقوووووووووووووووووووا مما يدبر لكم من النصارى وقساوستهم فالخطر داهم ان لم نتداركه ولا تصدقوا الكلام المعسول الذى يتحدث به قساوستهم على شاشات التلفاز من ادعاء المحبة والوطنية فالنصارى يجيشون الشباب ويخزنون الاسلحة فى الاديرة والكنائس بدليل الحادثة الاخيرة منتظرين اللحظة الحاسمة والتى لن يرحموا فيها المسلمون ...<br />تابعوا تعليقات القمص مرقص عزيز وعبد المسيح بسيط وغيرهم من كبار رجال الكنيسة واستمعوا الى تعليقاتهم فى غرفهم وعلى القنوات التليفزيونية ومواقع الانترنت وانتم تدركون تماما مايحاك لكم.<br />اكتبوا فى محرك البحث جوجل جملة \\\"الادمن نوكيا\\\" يتوعد المسلمين ويقول انه لو اصبح وزيرا للداخلية فلن يرحم مسلما طفلا كان او شابا او شيخا..................<br />استمعوا اليه بأنفسكم واستمعوا الى الادمن الاخر الذى يربط على كتفيه بعد تهديد المسلمين ويشجعه على ذلك.<br />النصارى يريدون ان يقضوا على الاسلام تارة بالتنصير واخرى بالقاء الشبهات وفتح القنوات السبابة لله والرسول واخرى بتوسيع املاكهم فى مصر الاسلامية حتى يحدث لمصر ماحدث يوما للأندلس مع العلم ان الاندلس كانت فى ذلك اليوم اقوى من مصر سياسيا واقتصاديا وعلميا ومع ذلك سقطت.<br />هل تعلمون اخوانى واخوتى المسلمين ان الكنيسة يأتى اليها دعم سنوى يقدر بمليار دولار وان الدولة ليس لها الحق فى الاستفسار عن الجهات التى تصرف فيها تلك الملايين.<br />اقردوا كتاب \\\"قذائف الحق\\\" للشيخ محمد الغزالى وهو موجود على الانترنت وسوف تتضح لكم الصورة كاملة عما يحاك لمصر المسلمة التى يراد لها ان الكفر بعد الايمان."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 12
subject = "الى كل مسلم ومسلمة"
author = "مصرى حتى النخاع"
posted = "2008-06-09"
text = "التقرير الرهيب من كتاب قذائف الحق<br />تعالوا نقرأ التقرير الذي وصفه الشيخ محمد الغزالى - رحمه الله - بـ (( التقرير الرهيب )) ... في كتابه الممنوع من التداول في مصر (( قذائف الحق)) ، يقول الشيخ - رحمه الله - :<br />\" كنت في الأسكندرية في مارس من سنة 1973 وعلمت من غير قصد بخطاب ألقاه البابا شنودة في الكنيسة المرقصية الكبرى في اجتماع سري أعان الله على إظهار ما وقع فيه ... وإلى القراء تقرير ما حدث كما نقل مسجلاً إلى الجهات المعنية :<br />بسم الله الرحمن الرحيم<br />نقدم لسيادتكم هذا التقرير لأهم ما دار في الاجتماع :-<br />بعد أداء الصلاة و التراتيل طلب البابا شنودة من عامة الحاضرين الانصراف ولم يمكث معه سوى رجال الدين وبعض أثرياء الأسكندرية ، وبدأ كلمته قائلاً :<br />\" إن كل شىء على ما يرام و يجري حسب الخطة الموضوعة لكل جانب من جوانب العمل على حدة في إطار الهدف الموحد \" ، ثم تحدث في عدد من الموضوعات على النحو التالي :<br />أولاً : شعب الكنيسة صرح لهم ( أي شنودة ) أن مصادرهم ـ في إدارة التعبئة و الإحصاء ـ أبلغتهم أن عدد المسيحيين في مصر بلغ ما يقارب الثمان مليون(8.000.000) نسمة ( هذا الكلام في عام 1973 ) ، و على شعب الكنيسة أن يعلم ذلك جيدًا ، كما يجب عليه أن ينشر ذلك و يؤيده بين المسلمين ، إذ سيكون ذلك سندنا في المطالب التي سنتقدم بها إلى الحكومة التي سنذكرها لكم اليوم . و التخطيط العام الذي تم الاتفاق عليه بالإجماع و الذي صدرت بشأنه التعليمات الخاصة لتنفيذه ، وُضع على أساس بلوغ شعب الكنيسة إلى نصف الشعب المصري ، بحيث يتساوى عدد شعب الكنيسة مع عدد المسلمين لأول مرة منذ 13 قرنًـا ، أي منذ (( الاستعمار العربي و الغزو الإسلامي لبلادنا )) ـ على حد قوله ـ ، و المدة المحددة وفقًـا للتخطيط الموضوع للوصول إلى هذه النتيجة المطلوبة تتراوح بين 12 ـ 15 سنة من الآن .<br />و لذلك فإن الكنيسة تحرم تحريمًا تامًا تحديد النسل أو تنظيمه ، و تعد كل من يفعل ذلك خارجًـا عن تعليمات الكنيسة ، و مطرودًا من رحمة الرب، و قاتلاً لشعب الكنيسة ، و مضيعًـا لمجده، و ذلك باستثناء الحالات التي يقرر فيها الطب و الكنيسة خطر الحمل أو الولادة على حياة المرأة ، و قد اتخذت الكنيسة عدة قرارات لتحقيق الخطة القاضية بزيادة عددهم : ـ<br />1- تحريم تحديد النسل<br />2- تشجيع تحديد النسل و تنظيمه بين المسلمين ( خاصة و أن أكثر من 65% من الأطباء و القائمين على الخدمات الصحية هم من شعب الكنيسة )<br />3- تشجيع الإكثار من شعبنا ووضع حوافز ومساعدات مادية ومعنوية للأسر الفقيرة من شعبنا.<br />4- التنبيه على العاملين بالخدمات الصحية على المستويين الحكومي وغير الحكومي كي يضاعفوا الخدمات الصحية لشعبنا، و بذل العناية و الجهد الوافرين، وذلك من شأنه تقليل الوفيات بين شعبنا على أن نفعل عكس ذلك مع المسلمين .<br />6- تشجيع الزواج المبكر و تخفيض تكاليفه، و ذلك بتخفيف رسوم فتح الكنائس و رسوم الإكليل بكنائس الأحياء الشعبية<br />7- تحرم الكنيسة تحريمًا تامًا على أصحاب العمارات و المساكن المسيحيين تأجير أي مسكن أو شقة أو محل تجاري للمسلمين ، و تعتبر من يفعل ذلك من الآن فصاعدًا مطرودًا من رحمة الرب و رعاية الكنيسة ، كما يجب العمل بشتى الوسائل على إخراج السكان المسلمين من العمارات و البيوت المملوكة لشعب الكنيسة ، و إذا نفذنا هذه السياسة بقدر ما يسعنا الجهد فسنشجع و نسهل الزواج بين شبابنا المسيحي ، كما سنصعبه و نضيق فرصه بين شباب المسلمين ، مما سيكون أثرًا فعالاً في الوصول إلى الهدف ، و ليس بخافٍ أن الغرض من هذه القرارات هو انخفاض معدل الزيادة بين المسلمين و ارتفاع هذا المعدل بين المسيحيين .<br />ثانيًـا : اقتصاد شعب الكنيسة : ـ قال شنودة : \" إن المال يأتينا بقدر ما نطلب و أكثر مما نطلب ، و ذلك من مصادر ثلاثة : أمريكا، الحبشة و الفاتيكان، و لكن ينبغي أن يكون الاعتماد الأول في تخطيطنا الاقتصادي على مالنا الخاص الذي نجمعه من الداخل، و على التعاون على فعل الخير بين أفراد شعب الكنيسة ، كذلك يجب الاهتمام أكثر بشراء الأرض ، و تنفيذ نظام القروض و المساعدات لمن يقومون بذلك لمعاونتهم على البناء ، و قد ثبت من واقع الإحصاءات الرسمية أن أكثر من 60 % من تجارة مصر الداخلية هي بأيدي المسيحيين، و علينا أن نعمل على زيادة هذه النسبة .<br />و تخطيطنا الاقتصادي للمستقبل يستهدف إفقار المسلمين و نزع الثروة من أيديهم ما أمكن ، بالقدر الذي يعمل به هذا التخطيط على إثراء شعبنا ، كما يلزمنا مداومة تذكير شعبنا و التنبيه عليه تنبيهًـا مشددًا من حين لآخر بأن يقاطع المسلمين اقتصاديًـا ، و أن يمتنع عن التعامل المادي معهم امتناعًـا مطلقـًا ، إلا في الحالات التي يتعذر فيها ذلك ، و يعني ذلك مقاطعة : المحامين ـ المحاسبين ـ المدرسين ـ الأطباء ـ الصيادلة ـ العيادات ـ المستشفيات الخاصة ـ المحلات التجارية الكبيرة و الصغيرة ـ الجمعيات الاستهلاكية أيضًـا ( !! ) ، و ذلك مادام ممكنًـا لهم التعامل مع إخوانهم من شعب الكنيسة ، كما يجب أن يُـنبهوا دومًا إلى مقاطعة صنّاع المسلمين و حرفييهم و الاستعاضة عنهم بالصناع و الحرفيين النصارى ، و لو كلفهم ذلك الانتقال و الجهد و المشقة . \"<br />ثم قال البابا شنودة : \" إن هذا الأمر بالغ الأهمية لتخطيطنا العام في المدى القريب و البعيد .\"<br />ثالثـًا : تعليم شعب الكنيسة : قال البابا شنودة : \" إنه يجب فيما يتعلق بالتعليم العام للشعب المسيحي الاستمرار في السياسة التعليمية المتبعة حاليًـا مع مضاعفة الجهد في ذلك ، خاصة و أن بعض المساجد شرعت تقوم بمهام تعليمية كالتي نقوم بها في كنائسنا، الأمر الذي سيجعل مضاعفة الجهد المبذول حاليًـا أمرًا حتميًـا حتى تستمر النسبة التي يمكن الظفر بها من مقاعد الجامعة و خاصة الكليات العملية \" .. ثم قال : \" إني إذ أهنئ شعب الكنيسة خاصة المدرسين منهم على هذا الجهد و هذه النتائج ، إذ وصلت نسبتنا في بعض الوظائف الهامة و الخطيرة كالطب و الصيدلة و الهندسة و غيرها أكثر من 60% !!!! إني إذ أهنئهم أدعو لهم يسوع المسيح الرب المخلص أن يمنحهم بركاته و توفيقه ، حتى يواصلوا الجهد لزيادة هذه النسبة في المستقبل القريب . \"<br />رابعًـا : التـبـــشــــير:قال البابا شنودة : \" كذلك فإنه يجب مضاعفة الجهود التبشيرية الحالية إذ أن الخطة التبشيرية التي وضعت بنيت على أساس هدف اتُّـفق عليه للمرحلة القادمة، وهو زحزحة أكبر عدد من المسلمين عن دينهم و التمسك به ، على ألا يكون من الضروري اعتناقهم المسيحية ، فإن الهدف هو زعزعة الدين في نفوسهم ، و تشكيك الجموع الغفيرة منهم في كتابهم و صدق محمد ( قلت : \" اللهم صلِّ عليه و على آله وسلم \" ) .. و من ثم يجب عمل كل الطرق و استغلال كل الإمكانيات الكنائسية للتشكيك في القرآن و إثبات بطلانه و تكذيب محمد ( قلت : صلى الله عليه و سلم )<br />و إذا أفلحنا في تنفيذ هذا المخطط التبشيري في المرحلة المقبلة فإننا نكون قد نجحنا في إزاحة هذه الفئات من طريقنا ، و إن لم تكن هذه الفئات مستقبلاً معنا فلن تكون علينا.<br />غير أنه ينبغي أن يُـراعَي في تنفيذ هذا المخطط التبشيري أن يتم بطريقة هادئة و ذكية ، حتى لا يكون سببًـا في إثارة حفيظة المسلمين أو يقظتهم .<br />و إن الخطأ الذي وقع منا في المحاولات التبشيرية الأخيرة ـ التي نجح مبشرونا فيها في هداية عدد من المسلمين إلى الإيمان و الخلاص على يد الرب يسوع المخلص ـ هو تسرب أنباء هذا النجاح إلى المسلمين ، لأن ذلك من شأنه تنبيه المسلمين و إيقاظهم من غفلتهم ، و هذا أمر ثابت في تاريخهم الطويل معنا ، و ليس هو بالأمر الهين ، و من شأن هذه اليقظة أن تُـفسد علينا مخططاتنا المدروسة ، و تؤخر ثمارها و تُـضيِّـع جهودنا، و لذا فقد أصدرت التعليمات الخاصة بهذا الأمر ، و سننشرها في كل الكنائس لكي يتصرف جميع شعبنا مع المسلمين بطريقة ودية تمتص غضبهم ..... ( قلت : هذا لا يحدث الآن .. فقد مات الذين يختشون ) ........و تقنعهم بكذب هذه الأنباء ، كما سبق التنبيه على رعاة الكنائس و الآباء و القساوسة بمشاركة المسلمين احتفالاتهم الدينية ، و تهـنـئـتهم بأعيادهم ، و إظهار المودة و المحبة لهم .<br />و على شعب الكنيسة في المصالح و الوزارات و المؤسسات إظهار هذه الروح لمن يخالطونهم من المسلمين ... \"<br />ثم قال بالحرف الواحد :<br />\" إننا يجب أن ننتهز ما هم فيه من نكسة و محنة...... ( يقصد ما قبل حرب 1973 و ما بعد نكسة يونيو 1967) ...... لأن ذلك في صالحنا ، و لن نستطيع إحراز أية مكاسب أو أي تقدم نحو هدفنا إذا انتهت المشكلة مع إسرائيل سواء بالسلم أو بالحرب \" ، .... ثم هاجم من أسماهم بضعاف القلوب الذين يقدمون مصالحهم الخاصة على مجد شعب الرب و الكنيسة ، و على تحقيق الهدف الذي يعمل له الشعب منذ عهد بعيد ، و قال أنه لم يلتفت إلى هلعهم ، و أصر علي أنه سيتقدم للحكومة رسميًـا بالمطالب الواردة بعد ، حيث أنه إذا لم يكسب شعب الكنيسة في هذه المرحلة مكاسب على المستوى الرسمي فربما لا يستطيع إحراز أي تقدم بعد ذلك . \"<br />ثم قال بالحرف الواحد : \" و ليعلم الجميع خاصة ضعاف القلوب أن القوى الكبرى في العالم تقف وراءنا و لسنا نعمل وحدنا، و لا بد من أن نحقق الهدف ، لكن العامل الأول و الخطير في الوصول إلى ما نريد هو وحدة شعب الكنيسة و تماسكه و ترابطه .. و لكن إذا تبددت هذه الوحدة و ذلك التماسك فلن تكون هناك قوة على وجه الأرض مهما عظم شأنها تستطيع مساعدتنا . \"<br />مطالب البابا شنودة<br />يقول الشيخ الغزالي - رحمه الله - :<br />\" ثم عدد البابا شنودة المطالب التي صرح بها بأنه سوف يقدمها رسميًـا إلى الحكومة :<br />1- أن يصبح مركز البابا الرسمي في البروتوكول السياسي بعد رئيس الجمهورية و قبل رئيس الوزراء.<br />2- أن تُـخصَّص لهم (( للنصارى )) ثمان وزارات<br />3- أن تُـخصَّص لهم ربع القيادات العليا في الجيش و الشرطة<br />4- أن تُـخصَّص لهم ربع المراكز القيادية المدنية ، كرؤساء مجالس المؤسسات و الشركات و المحافظين و وكلاء الوزارات و المديرين العامين و رؤساء مجالس المدن .<br />5- أن يُـستشار البابا عند شغل هذه النسبة في الوزارات و المراكز العسكرية و المدنية ، و يكون له حق ترشيح بعض العناصر و التعديل فيها.<br />6- أن يُـسمَح لهم بإنشاء جامعة خاصة بهم ، و قد وضعت الكنيسة بالفعل تخطيط هذه الجامعة ، و هي تضم المعاهد اللاهوتية و الكليات العملية و النظرية ، و تُـموَّ ل من مالهم الخاص.<br />7- أن يُـسمَح لهم بإقامة إذاعة من مالهم الخاص.<br />ثم ختم حديثه بأن بشّر الحاضرين و طلب منهم نقل هذه البشرى لشعب الكنيسة بأن أملهم الأكبر في عودة البلاد و الأراضي إلى أصحابها من (( الغزاة المسلمين )) قد بات وشيكًـا ، و ليس في ذلك أدنى غرابة ـ في زعمه ـ و ضرب لهم مثلا بأسبانيا النصرانية التي ظلت بأيدي ((المستعمرين المسلمين )) قرابة ثمانية قرون (800 سنة) ، ثم استردها أصحابها النصارى ، ثم قال و في التاريخ المعاصر عادت أكثر من بلد إلى أهلها بعد أن طـُـردوا منها منذ قرون طويلة جدًا ...... قال الشيخ - رحمه الله - ( واضح أن شنودة يقصد إسرائيل) و في ختام الاجتماع أنهى حديثه ببعض الأدعية الدينية للمسيح الرب الذي يحميهم و يبارك خطواتهم !!!!!!!!! \"-))<br />انتهـى كلام الشيخ محمد الغزالي - رحمه الله -<br />فما رأي القارئ الكريم المتابع للأحداث في مصر , هل المخطط جاري للآن ووصل لمراحل متقدمة أم ماذا؟؟؟؟"
