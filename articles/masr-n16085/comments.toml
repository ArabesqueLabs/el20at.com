[[comments]]
order = 0
subject = "القوالب نامت والانصاص قامت"
author = "مصرى"
posted = "2008-06-01"
text = "هى العملية تناحة<br />او يمكن بجاحة - ازاى عايزين ياخدوا ارض مش ليهم - ياللة اهم اخدوا نصيبهم والكنيسة واتهدت والارض واتحرقت ويبقوا يقابلونى لو عرفوا يبنوها تانى<br />وبعدين انتم بتكذبوا لية فى اخبار ولاد البلد وتقولوا ان تعدادهم 10 % - يا راجل يا كداب<br />فى اى تعداد ايام الانجليز المسيحيين زيهم عددهم لم يكن يتجاوز 4 %<br />ثم انهم ما بيخلفوش كتير زى المسلمين - يبقى ازاى اصبحوا عشرة فى المية<br />تعداد النصارى لا يتعدى 4 % على اعلى تقدير وفى محافظة اسيوط وهى المحافظة الوحيدة 10 %<br />خلوا اخباركم صادقة"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091144/http://masr.20at.com:80/newArticle.php?sid=16085"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "قبطى"
posted = "2008-06-01"
text = "يجب النظر الى الامور بموضوعيه فالمبانى التى تم توسيعها تم اخذ موافقتها من السلطات المسئوله اما عمليات الهدم والحرق التى تمت هذا امر ينم عن الطبيعة الوحشيه التى يتعامل بها الاقباط السكان الاصليين للبلد واصحاب الارض اما تعليق الاخ ( مصرى ) ينم عن مدى ايمانه الذى يشجعه على الحرق ماذا لو ان قبطى كسر لمبه مسجد ؟ اما عن الدير فهو فقد تم بنائه فى القرن الرابع الميلادى وقبل الاحتلال الاسلامى لمصر اما عن الكذب فتأكد ياعزيزى ان الاقياط لا يعرفون الكذب ولا التقيه وجهادهم هو جهاد النفس كما فى حالة الرهبان الذين يتركون العالم لأجل التعبد اما لو كانت العمليه بالكثره والعدد فأنت واهم فالمسيحى ايمانه تحدى القتل والزبح لاجل محبة لله وان الديانة الاولى فى العالم هى المسيحيه والعالم الاول مسيحى بكل مفرداته لكن مش مهم العدد المهم السلوك ولم اكن اتوقع ان يخيل لك عقلك المريض وطبيعتك الانتقاميه ان هذا شيئ حسن مافعله هؤلاء المخربون من هدم وحرق ارجوا ان تعالج حقدك وخيالك المريض"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091144/http://masr.20at.com:80/newArticle.php?sid=16085"

[[comments]]
order = 2
subject = "الكلاب متحدون"
posted = "2008-06-02"
text = "1-عدلى ابادير يوسف - رجل اعمال ، رئيس المؤتمر القبطى،رئيس منظمة الاقباط متحدون<br />2-مجدى خليل- كاتب ومحلل سياسى، عضو لجنة إدارة مؤتمر واشنطن<br />3-سليم نجيب - رئيس الهيئة القبطية الكندية<br />4-منير بشاي - رئيس جمعية اقباط كاليفورنيا<br />5-عادل جندي -كاتب وناشط قبطى ، باريس<br />6-وليم الميري- صحفى وناشط قبطى<br />7-ميلاد اسكندر رئيس الهيئة القبطية الاميركية<br />8-رائف مرقص -رئيس الاتحاد القبطى الدولى<br />9-الفونس قلادة -الاتحاد القبطي الدولى<br />10-ايهاب زكى- الاتحاد القبطي الدولى<br />11-فؤاد سمعان -الهيئة القبطية الاميركية<br />12-عادل حنا -الهيئة القبطية الاميركية<br />13-سعد اسكندر- الهيئة القبطية الاميركية<br />14-عماد يوسف- ناشط قبطي ، كندا<br />15-حلمى جرجس- رئيس الهيئة القبطية البريطانية<br />16- ابراهيم حبيب- الهيئة القبطية البريطانية<br />17-ناجى عوض- رئيس الهيئة القبطية الاوروبية، باريس<br />18- ملاك غبريال- رئيس الهيئة القبطية بكاليفورنيا<br />19-ماهر رزق الله- رئيس الهيئة القبطية بتورنتو<br />20-نبيه عبد الملك- اوتاوا كوبتس<br />21-شريف منصور- ناشط قبطى ، مشارك فى تنظيم مؤتمر واشنطن<br />22-صموئيل فاهد- رئيس الهيئة القبطية الاسترالية<br />23-جميل حلمى-الهيئة القبطية الاسترالية<br />24-فكرى ماكس- صحيفة المصرى، استراليا<br />25-منير داوود- ناشط قبطى ، نيوجيرسى<br />26- اقلاديوس ابراهيم- صحفى ، لندن<br />27- أرنست أوريجانيوس- رئيس الهيئة القبطية بتكساس<br />28-جورج فرج الله- الهيئة القبطية بكاليفورنيا<br />29-نبيل الشماع-ناشط قبطي<br />30-احمد اباظة- ناشط قبطي<br />31-فايز عبد الملك - محرر صوت النيل<br />32-صبرى جوهرة- استاذ بكلية طب اوهايو، ناشط قبطي"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606091144/http://masr.20at.com:80/newArticle.php?sid=16085"

