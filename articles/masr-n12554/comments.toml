subject = "كويس ادينا صدرنا حاجه"
author = "خالدالامير"
text = "كويس والله ادينا عرفنا نصدر حاجه رغم انني معارض وانتمي لحزب الوفد لكن احنا احسن من ليبيا ولبنان وسوريا وكوبا ورغم انه في عدم ديمقراطيه لكنني اج ان هناك تحامل نوع ما علي مصر ورئيسها ولكن هذا لا يعفي من ان المقال ذاكر حيقيقه موجوده وواقعيه واهو كله زي بعضه واحمد زي الحاج احمد"
