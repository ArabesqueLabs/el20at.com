subject = "جور السلطان لا ينقص فريضة من فرائض الله"
text = "جور السلطان لا ينقص فريضة من فرائض الله<br />واعلم أن جور السلطان لا ينقص فريضة من فرائض الله عز وجل التي افترضها على لسان نبيه صلى الله عليه وسلم، جوره على نفسه وتطوعك وبرك معهم تام لك إن شاء الله تعالى يعني الجماعة والجمعة معهم، والجهاد معهم، وكل شيء من الطاعات فشاركه فيه فلك نيتك، وإذا رأيت الرجل يدعو على السلطان فاعلم أنه صاحب هوى، وإذا رأيت الرجل يدعو للسلطان بالصلاح، فاعلم أنه صاحب سنة إن شاء الله لقول الفضيل بن عياض لو كانت لي دعوة ما جعلتها إلا في السلطان أنا أحمد بن كامل – أنبأنا هذا السند، وهذه إشارة أنا هذه رمز أصله أنبأنا لكن اختصر المحدثون \" أنا \" ويحذفون أنبأنا، حدثنا يكتبون \"ح\" - أنبأنا أحمد بن كامل قال: حدثنا الحسين بن محمد الطبري قال: أنبأنا مردويه الصائغ قال: سمعت فضيلا يقول: \" لو أن لي دعوة مستجابة ما جعلتها إلا في السلطان قيل له: يا أبا علي فَسِّرْ لنا هذا قال: إذا جعلتها في نفسي لم تعدني، وإذا جعلتها في السلطان صلح فصلح بصلاحه العباد والبلاد \""
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205251/http://masr.20at.com:80/newArticle.php?sid=12554"

