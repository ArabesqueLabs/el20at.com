subject = "طاعة ولاة الأمر واجبة وإن ظلموا!"
author = "مش ضروري"
text = "طاعة ولاة الأمر واجبة وإن ظلموا!<br />البلدوزر09-15-2007, 08:33 مساءً<br />نقل ابن حجر رحمه الله الإجماع على عدم جواز الخروج على السلطان الظالم : فقال قال ابن بطال :د((وفى الحديث حجة على ترك الخروج على السلطان ولو جار وقد اجمع الفقهاء على وجوب طاعة السلطان المتغلب والجهاد معه وأن طاعته خير من الخروج عليه لما فى ذلك من حقن الدماء وتسكين الدهماء)) فتح البارى 13/7 ونقل الامام النووى -رحمه الله - الإجماع على ذلك فقال في ((واما الخروج عليهم وقتالهم فحرام باجماع المسلمين وإن كانوافسقة ظالمين وقد تظاهرت الاحاديث على ماذكرته واجمع اهل السنه انه لاينعزل السلطان بالفسق....... )) شرح النووى 12/229<br />قال الرسول صلى الله عليه وسلم<br />((من أطاعني فقد أطاع الله ومن يعصني فقد عصا الله ومن يطع أميري فقد أطاعني ومن يعص أميري فقد عصاني )) رواه مسلم<br />وعن ابي هريرة -رضي الله عنه -(( قال قال رسول الله صلى الله عليه وسلم: (( عليك السمع والطاعة في عسرك ويسرك ومنشطك ومكرهك وأثرة عليك )) رواه مسلم ( 1836)<br />قال شيخ الإسلام ابن تيمية - رحمه الله -:<br />((فطاعة الله ورسوله واجبة على كل أحد , وطاعة ولاة الأمور واجبة لأمر الله بطاعتهم ,<br />فمن أطاع الله ورسوله بطاعة ولاة الأمور لله فأجره على الله ومن كان لايطيعهم إلا لما يأخذ ه من الولاية فإن أعطوه أطاعهم وإن منعوه عصاهم , فماله في الآخرة من خلاق ,<br />وقد روى البخاري ومسلم عن أبي هريرة -رضي الله عنه -عن النبي صلى الله عليه وسلم قال :<br />(( ثلاثة لايكلمهم الله يوم القيامة ولاينظر إليهم ولايزكيهم , ولهم عذاب أليم :<br />رجل على فضل ماء بالفلاة يمنعه من ابن السبيل ,<br />ورجل بايع رجلاً سلعة بعد العصر فحلف له بالله لأخذها بكذا وكذا فصدقه وهو غير ذلك<br />ورجل بايع إماماً لايبايعه إلا لدنيا , فإن أعطاه منها وفا وإن لم يعطه منها لم يف )) الفتاوى ( 35/16-17)<br />وقال الرسول صلى الله عليه وسلم (( لما سأله رجل :يانبي الله<br />أرأيت إن قامت علينا أمراء يسألوننا حقهم ويمنعوننا حقنا فما تأمرنا؟ فأعرض عنه ثم سأله فأعرض عنه<br />ثم سأله في الثالثة فجذبه الأشعث بن قيس فقال صلى الله عليه وسلم (( اسمعوا وأطيعوا<br />فإنما عليهم ماحملوا وعليكم ماحملتم )) رواه مسلم ( 1846)<br />( المفهم 4/55) قال القرطبي : ( يعني ان الله تعالى كلف الولاة العدل وحسن الرعاية<br />وكلف المُولَى عليهم الطاعة وحسن النصيحة فأراد :<br />انه إذاعصى الأمراء الله فيكم ولم يقوموا بحقوقكم , فلاتعصوا الله انتم فيهم وقوموا بحقوقهم<br />فإن الله مجاز كل واحد من الفريقين بما عمل .)) المفهم (4/55)<br />وقال النبي صلى الله عليه وسلم في الحديث الذي رواه مسلم<br />((يكون بعدي أئمة لايهتدون بهداي ولايستنون بسنتي وسيقوم فيهم رجال قلوبهم قلوب الشياطين<br />في جثمان إنس قال ( حذيفة): قلت : كيف أصنع يارسول الله ؟ إن أدركت ذلك ؟؟<br />قال : (( تسمع وتطيع وإن ضرب ظهرك وأخذ مالك , فاسمع وأطع ))<br />رواه البخاري ( 7084) ومسلم ( 1847) باب ( يصبر على أذاهم وتؤدى حقوقهم )<br />وقال النبي صلى الله عليه وسلم (( من كره من أميره شيئاً<br />فليصبر عليه ,فإنه ليس من أحد من الناس يخرج من السلطان شبراً فمات عليه , إلا مات ميتة جاهلية ))<br />رواه مسلم من حديث ابن عباس -رضي الله عنه - (1849) ورواه البخاري ( 7053)<br />وعن نافع قال : جاء عبد الله بن عمر الى عبد الله بن مطيع حين كان من أمر الحرة ماكان<br />من يزيد بن معاوية فقال : اطرحوا لأبي عبد الرحمن وسادة . فقال : إني لم آتك لأجلس , أتيتك لأحدثك حديثاً سمعت رسول الله صلى الله عليه وسلم يقوله , سمعته يقول :<br />(( من خلع يداً من طاعة , لقي الله يوم القيامة لاحجة له , ومن مات وليس في عنقه بيعة , مات ميتة جاهلية ))رواه مسلم<br />( 1851)<br />قال القرطبي في المفهم :<br />قوله ( ولاحجة له ) أي لايجد حجة يحتج بها عند السؤال فيستحق العذاب ,لأن الرسول صلى الله عليه وسلم قد أبلغه ماامره الله بإبلاغه من وجوب السمع والطاعة لأولي الأمر , في الكتاب والسنة ) انتهى كلامه .<br />وروى مسلم في الصحيح في باب ( فيمن خلع يداً من طاعة وفارق الجماعة )<br />عن أبي هريرة عن النبي صلى الله عليه وسلم أنه قال :<br />(( من خرج عن الطاعة , وفارق الجماعة , فمات فميتته جاهلية ومن قاتل تحت راية عمية يغضب لعصبة أو يدعوا لعصبة<br />أوينصر عصبة فقتل فقتلته جاهلية ومن خرج على أمتي يضرب برها وفاجرها ولاينحاش عن مؤمنها , ولايفي لذي عهد عهده , فليس مني ولست منه )) رواه أحمد (2/296) ومسلم (1848)<br />قال القرطبي في المفهم :<br />( قوله (من خرج عن الطاعة ....) بالطاعة : طاعة ولاة الأمر وبالجماعة : جماعة المسلمين على إمام او أمر مجتمع عليه . وفيه دليل على وجوب نصب الإمام وتحريم مخالفة إجماع المسلمين وأنه واجب الإتباع ))<br />ثم قال ( ويعني بموتة الجاهلية ) انهم كانوا فيها لايبايعون إماماً ولايدخلون تحت طاعته , فمن كان من المسلمين لم يدخل تحت طاعة إمام<br />فقد شابههم في ذلك , فإن مات على تلك الحالة مات على مثل حالهم مرتكباً كبيرة من الكبائر , ويخاف عليه بسببها الأَ يموت على الإسلام )) المفهم لما أشكل من تلخيص كتاب مسلم (4/59)<br />قال صلى الله عليه وسلم: (( من أتاكم وأمركم جميع على رجل واحد منكم , يريد أن يشق عصاكم , فاقتلوه )) رواه مسلم ( 1852)<br />وقال صلى الله عليه وسلم: (( ستكون أمراء فتعرفون وتنكرون , فمن عرف فقد برىء , ومن أنكر فقد سلم<br />ولكن من رضي وتابع قالوا : أفلا نقاتلهم قال :لا , ما صلوا )) رواه مسلم<br />قال الإمام النووي -رحمه الله - (( أما قوله فمن عرف فقد برىء وفي الرواية التي بعدها فمن كره فقد برىء فظاهره ومعناه :<br />من كره ذلك المنكر فقد برىء من إثمه وعقوبته , وهذا في حق من لايستطيع انكاره بيده ولالسانه فليكرهه بقلبه وليبرأ<br />وأما من روى ( فمن عرف فقد برىء ) فمعناه والله أعلم فمن عرف المنكر ولم يشتبه عليه فقد صارت<br />له طريق الى البراءة من إثمه وعقوبته بان يغيره بيده او بلسانه فإن عجز فليكرهه بقلبه<br />وقوله صلى الله عليه وسلم ((ولكن من رضي وتابع )):<br />معناه : ولكن الإثم والعقوبة على من رضي وتابع وفيه دليل على أن من عجز عن إزالة المنكر لايأثم بمجرد السكوت بل إنما يأثم بالرضى به او أن لايكرهه بقلبه او بالمتابعة عليه<br />وأما قوله صلى الله عليه وسلم (( أفلا نقاتلهم فقال لاماصلوا )):<br />ففيه معنى ماسبق : أنه لايجوز الخروج على الخلفاء بمجرد الظلم أو الفسق مالم يغيروا شيئاً من قواعد الإسلام )) انتهى ( شرح النووي على صحيح مسلم 12/243-244)<br />وعن عوف بن مالك عن رسول الله صلى الله عليه وسلم قال :<br />(( خيار أئمتكم الذين تحبونهم ويحبونكم ويصلون عليكم وتصلون عليهم وشرار أئمتكم الذين تبغضونهم<br />ويبغضونكم , وتلعنونهم ويلعنونكم,<br />قيل : يارسول الله أفلاننابذهم بالسيف ؟؟؟<br />فقال : لا, ماأقاموا فيكم الصلاة , وإذا رأيتم من ولاتكم شيئاً تكرهونه فاكرهوا عمله ولاتنزعوا يداً من طاعة . )) رواه مسلم<br />وفي رواية قال : لاماأقاموا فيكم الصلاة , لا مااقاموا فيكم الصلاة , ألا من ولي عليه وال فرآه يأتي شيئاً من معصية الله فليكره مايأتي من معصية الله ولاينزعن يداً من طاعة . )) صحيح مسلم بشرح النووي ( 12/244)<br />البلدوزر09-15-2007, 08:37 مساءً<br />وعن أبي ذر قال :<br />(( إن خليلي أوصاني أن أسمع وأطيع وإن كان عبداً مجدع الأطراف )) رواه مسلم(1837)<br />وعن ابن عمر عن النبي صلى الله عليه وسلم قال :<br />(( على المرءالمسلم السمع والطاعة فيما أحب وكره إلا أن يؤمر بمعصية ,<br />فإن أمر بمعصية فلا سمع ولاطاعة )) رواه البخاري (7144) ومسلم ( 1839)<br />قال القرطبي في المفهم :<br />قوله ( على المرء المسلم .....) ظاهرٌ في وجوب السمع والطاعة للأئمة والأمراء والقضاة<br />ولاخلاف فيه إذا لم يأمر بمعصية فإن أمر بمعصية فلا تجوز طاعته في تلك المعصية قولاً واحداً )) المفهم( 4/39)<br />وعن ابي هريرة رضي الله عنه قال :<br />أن رسول الله صلى الله عليه وسلم قال :<br />(( من حمل علينا السلاح فليس منا , ومن غشنا فليس منا )) رواه مسلم<br />وقال ابن تيمية :<br />(( فطاعة الله ورسوله واجبة على كل أحد وطاعة ولاة الأمور واجبة لأمر الله بطاعتهم , فمن أطاع الله ورسوله بطاعة ولاة الأمور فأجره على الله<br />ومن كان لايطيعهم إلا لما يأخذه من الولاية والمال وإن منعوه عصاهم فماله في الاخرة من خلاق.<br />وقد روى البخاري ومسلم عن ابي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال :<br />((ثلاثة لايكلمهم الله يوم القيامة ولاينظر إليهم ولايزكيهم ولهم عذاب أليم .........................................<br />ورجل بايع إماماً لايبايعه إلا لدنيا , فإن أعطاه منها وفا , وإن لم يعطه منها لم يف ))<br />وقال الإمام الصابوني :<br />(( ويرى أصحاب الحديث الجمعة والعيدين وغيرهما من الصلوات كل إمام مسلم ,براً كان أو فاجراً ويرون جهاد الكفرة معهم<br />وإن كانوا جورة فجرة ويرون الدعاء لهم بالإصلاح<br />والتوفيق والصلاح .<br />ولايرون الخروج عليهم بالسيف وإن رأوا منهم العدول عن العدل الى الجور والحيف )) (عقيدة السلف وأصحاب الحديث ص294)ط دار العاصمة<br />وقال الإمام البربهاري في ( شرح السنة ) :<br />((وأعلم أن جور السلطان لاينقص فريضة من فرائض الله عز وجل التي افترضها الله على لسان<br />نبيه صلى الله عليه وسلم ، جوره على نفسه ,وتطوعك وبرك معه تام لك إن شاء الله ,<br />يعني : الجماعة والجمعة معهم والجهاد معهم وكل شيء من الطاعات فشاركه فيه فلك نيتك .<br />وإذا رأيت الرجل يدعوا على السلطان فاعلم أنه صاحب هوى , وإذا رأيت الرجل يدعوا للسلطان بالصلاح فاعلم انه صاحب سنة إن شاء الله ))(شرح السنة ص114)ط دار السلف<br />وقال محمد الشهير ( بابي زمنين ) في كتابه (أصول السنة ) :<br />((قال محمد : فالسمع والطاعة لولاة الأمور أمر واجب و مهما قصروا في ذاتهم فلم يبلغوا الواجب عليهم ,غير أنهم يدعون إلى الحق ويؤمرون به ويدلون عليه<br />فعليهم ماحملوا وعلى رعاياهم ماحملوا من السمع والطاعة )) ( أصول السنة 276)ط مكتبة الغرباء الأثرية<br />وقال الطحاوي :<br />((ولانرى الخروج على أئمتنا وولاة أمورنا وإن جاروا ولاندعوا عليهم ولاننزع يداًُ من طاعة<br />ونرى طاعتهم في طاعة الله عز وجل فريضة ما لم يأمروا بمعصية , وندعوا لهم بالصلاح والمعافاة ))<br />( شرح الطحاوية ص371) ط شاكر<br />وقال ابن تيمية في الواسطية :<br />((ثم هم مع هذه الأصول يأمرون بالمعروف وينهون عن المنكر على ماتوجبه الشريعة ويرون إقامة الحج والجمع والأعياد مع المراء أبراراً كانوا أو فجاراً )) شرح الواسطية للفوزان ( 215)<br />وقال ابن تيمية -رحمه الله -:<br />(( ولعله لايكاد يعرف طائفة خرجت على ذي سلطان إلا وكان في خروجها من الفساد أكثر من الذي في إزالته ))<br />قال ابن حنبل -رحمه الله -:<br />((اجتمع فقهاء بغداد في ولاية الواثق الى ابي عبد الله يعني الإمام أحمد رحمه الله-وقالوا له :<br />إن الأمر قد فشا وتفاقم -يعنون إظهار القول بخلق القرآن , وغير ذلك -ولانرضى بإمارته ولاسلطانه .<br />فناظرهم في ذلك , وقال :<br />عليكم بالإنكار في قلوبكم ولاتخلعوا يداً من طاعة ,ولاتشقوا عصا المسلمين ,ولاتسفكوا دمائكم ودماء المسلمين معكم , وانظروافي عاقبة أمركم ,واصبروا حتى يستريح بر ويستراح من فاجر .<br />وقال :ليس هذا -يعني نزع أيديهم من طاعته -صواباً ,هذا خلاف الآثار )) الآداب الشرعية ( 1/195-196)<br />وأخرجها الخلال في السنة (ص133)<br />فانظر رحمك الله الى فقه الأئمة واتباعهم للآثار النبوية وتعظيمهم لدماء المسلمين .<br />دلوعة زوجها09-16-2007, 12:52 صباحاُ<br />http://islamroses.com/zeenah_images/jazak.gif<br />ســـما09-16-2007, 01:20 صباحاُ<br />البلدوزر<br />طرح رائع ومميز<br />جزاكـ الله كل الخير على هــذا الطرح<br />وجعله الله في موازين حسناتكـ<br />وأثابكـ الخير على كل ما تقدم ..<br />دمت بود"
archived = "2007-11-25"
