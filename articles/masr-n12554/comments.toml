[[comments]]
order = 5
subject = "يابتاع تعليق مش ضروري ..لا والنبي ياحبيبي"
author = "لأ بقى ..دة ضروري ونص كمان"
text = "إن الله الذي حرم الظلم على نفسه فقد جعله محرما على عباده وبين عباده.. وإن رسول الله - صلى الله عليه وسلم- الذي كان مبعوثا رحمة للعالمين- لم يرض بظلم ولم يشهد على جور ولم يأمر بالتخاذل والاستدبار والخنوع - و ليس في الإسلام ولا منه مقولة ( من ضربك على خدك الأيمن فأدر له خدك الأيسر كمان ) وإن عمر ابن الخطاب الذي (إن لم تعرفه) والذي تزن قلامة أظفره جميع السلاطين والزعماء والرؤساء والأمراء والملوك الذين تستجلب لهم يابتاع ( مش ضروري) كل أقوال الفقه المضروبة والمدسوسة و أحاديث الحق التي تريد بها وتروج للباطل يابتاع مش ضروري-- عمر ابن الخطاب هذا أقام الحد مرتين على ابنه - وعذر وضرب ابن امير مصر (عمرو بن العاص ) وهو بالنسبة للمصريين أميرهم .... لأ ياحبيبي ده ضروري<br />ونص.. من هو السلطان أو الأمير أو الحكام أو الملك الذي يحظر ( بحسب ما دسسته علينا ) الخروج عليه ؟؟ أنا أقول لك :<br />(1) هو الأمير أو السلطان أو الحاكم الذي انعقدت له البيعة في الزمن الماضي والانتخاب في الزمن الآني بيعة حرة أو اتخاب حر تنعقد عليه وتتجه إلية إرادة المسلمين بلا غش أو تزوير أو تدليس أو نصب أو إكراه أو احتيال أو ضرب أو سجن أو اعتقال ( فاهم؟؟)<br />(2) هو الأمير أو السلطان أو الحاكم الذي يضع الله ورسوله ودينه نصب عينية ويقيم شعائر دينه ( بالقدر الذي يعلمه ويرقبه الناس) ولا يمنع مساجد الله أن يذكر فيها اسمه ولا يمنع حدود الله أن تقام ولا يمنع فروض الله أن تؤدى وأن يحافظ على مال وأرض وعرض ومقدسات وعقيدة المسلمين .<br />(3) هو الأمير أو السلطان أو الحاكم الذي وإن أخطأ لم تبلغ خطاياه مبلغ التفريط في أراضي المسلمين وتسليمها وتمكين الأعداء منها .هو الذي لم تبلغ أوزاره مبلغ المساومة مع الأعداء ومعاونتهم وفتح بلاده وخيرات بلاده لهم لتعينهم على قهر وسلب ونهب بلادا مسلمة .<br />(4) هو الأمير أو السلطان أو الحاكم الذي وإن ظلم لم تبلغ مظالمه حد قتل الرعية وسجنهم واعتقالهم دون ذنب او جريرة وهو وإن فسق لم يبلغ فسقه الوقوف في صف أعداء الله ضد بني دينه وبني وطنه وتوسيد الأمر لغير أهله وتمكين المجرمين والسفلة و المنحرفين ليستذلوا رقاب الناس بغير الحق .<br />(5) وبعدين بقى تعالى لي هنا ..إمتى بقى يا حلو انت يحق للناس الخروج على الحاكم ؟؟ وانت قفلتها وسمكرتها وسكيت عليها بالضبة والمفتاح ... وبعدين فين ( لا طاعة لمخلوق في معصية الخالق ) وفين ( من قتل دون ماله ودون عرضه ودون نفسه فهو شهيد) وفين الراجل اللي قال للرسول بالفم المليان ( يا محمد إعدل فإنك لم تعدل) وهرع عمر لضرب عنقه إلا أن الرسول منعه وأجاب الرجل بما يرضي ربه وبالحق ؟؟<br />(6) وبعدين إيه رأيك في اليهود الكفرة الفجره المستبدين المستعمرين يقومون بمحاسبة حكامهم و مساءلتهم عن أية مؤاخذة سواء رشوة أو تربح أو استغلال نفوذ (( تقول عليهم إيه ؟؟ وشوف همه بقوا فين)<br />(7) وبالمقابل إيه رأيك في المسلمين اللي مشيوا وراك بالدفع الذاتي والرعب الأبدي من السلطة ومن جبروت حكامهم ومن بطش عسكرهم على مدى مئات السنين وحالهم اليوم يصعب على الكافر والاسرائيلي والامريكاني والهندي وكل طوب الأرض.<br />(_8) وأخيرا كل طلباتك ياباشا أوامر ..الخضوع موجود والخنوع متوافر و الانهزامية خد من قلبي وصر00 و طاعة الحكام فيما يغضب الله ورسوله والمؤمنين وفيما يثير قرف الشياطين انفسهم مفيش بعد كدة ... نفسي بقى أقولك حاجة .. ولا أقولك .. مش هاقولك .. مانت عارف ياحبيبي قصدي إيه من غير ما أقولك... مش ضروري"
archived = "2008-01-25"
capture_url = "https://web.archive.org/web/20080125105051/http://masr.20at.com:80/newArticle.php?sid=12554"

[[comments]]
order = 6
subject = "لأ دة ضروري ونص كمان"
author = "الأخ مش ضروري - خد الحتة دي كمان - هي تقيلة شوية عليك - بس ممكن تتهجاها"
text = "*** القارئ في تاريخ مصر الفرعونية والمتتبع لسية ومسيرة شعبها حتى تاريخه يجد أنه وعلى مر آلاف السنين وقد وطن وتوطن في روع وذاكرة وعقيدة المصريين عبادة الحاكم باعتباره إلها مقدسا فعبد المصريون حكامهم وبقيت حاشية الحاكم الإله كهامان وأمثاله توقد نار هذه العقيدة في قلوب المصريين مع حرص تلك الحاشية على استمرار توقدها وبقائها والنفخ في جذوتها لتستعر ... وحينما أشرقت أرض مصر بنور ربها ودخل الناس في دين الله أفواجا وعاشت مصر كمثل بلاد المسلمين التي فتحها الله على رجال الله ورسوله .عاشت العصر الذهبي للإسلام وذاقت من العدل والحق والأمن والحرية والقوة والمنعة والحكم ما لم تره ولن تراه في ظل انبعاث حاشية هامان التي عادت لترج لنا أن الحاكم أو السلطان أو الأمير أو الملك إن لم يكن إلها فهو بالقطع قدر إلهي وقضاء رباني لا يجوز دفعه أو رفعه او الوقوف في وجهه ..واشعلوا من جديد ذات النار التي سبق ان أشعلها هامان وترزق من خلفها من الفرعون ومن الشعب.. وهكذا - بعرف حاشية هامان أو فقهاء السلطان- ) ليس أمام المسلم الذي شهر سيفه في الماضي لعمر حين سؤاله رعية المسلمين عما إذا شاب حكمه اعوجاج فيرى في الحال برق سيف أحد الرعية المسلمين مشهرا في وجهه متبوعا بقول صادح أجش \"\" والله الذي لا إله إلا هو لو اعجوججت ياعمر لقومتك بسيفي هذا\"\" فيردف عمر حامدا شاكرا ربه كمثل ما أردف سليمان حامدا شاكرا ربه ..<br />أما مسلم اليوم فليس امامه سوى اعتبار السلطان أو الحاكم شبه إله و أنه قضاء وقدر وجب على كل مسلم و\"مؤمن\" التسليم له وعدم مناوءته و هو ما يصبو إليه فقهاء وحاشية السلطان الذين يستمدون وجودهم وشرعيتهم وسطوتهم من تأمين وتأليه سلطانهم وتمكينه من رقاب شعبهم .. من هنا تشتم رائحة تفوح بقوة لا يقدر أنفك على ردها أو تحاشيها تشير إلى جذوة نيران حاشية فرعون بقيادة هامان تحاول أن تنفخ فيها وتذكيكيها من جديد حاشية السلطان بقيادة فقهاء السلطان ... ولكن ألا ترى معي أن لكل شئ نهاية .. فمثلما أنقذت دابة الأرض ( لاحظ ضعف تلك الحشرة) الجن من البقاء والديمومة في العذاب المهين وفي سخرة نبي الله سليمان حين أخذت تأكل منسأتة التي مات وقت أن كان يستند عليها ولم تعلم الجن ذلك إلى أن سقطت المنسأة فسقط الجسد . فهنا توقف العذاب المهين الذي عاشته الجن بفضل ( دابة الأرض ) أليس في ذلك مغزى أن خلاص المعذبين من الشعوب ربما يأتي على شاكلة دابة الأرض تأكل قلب وكبد الطواغيت المستبدين قبل أن تسقط عروشهم خاوية عليهم .؟؟"
archived = "2008-01-25"
capture_url = "https://web.archive.org/web/20080125105051/http://masr.20at.com:80/newArticle.php?sid=12554"
