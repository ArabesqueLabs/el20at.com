text = "الجماعة بتوع الحزب الوطنى ما قصروا ماشاء اللة جايبين ايات وبينات تجيز جور الحاكم وضربة لهم بالبلغ والجزم بدون ان يحركوا ساكنا<br />مش المفتى بتاعهم بتاع البول والجلد للصحفيين<br />ربنا يستر ليطلع واحد يقول لنا ان حسنى مبارك ابن عم النبى"
