order = 0
subject = "بنصدر خارج الحدود"
author = "ytr"
text = "يا حلاوة واللة ولقينا حاجة نصدرها<br />بقت النظام فى مصر والشاويش على عبد اللة صالح وبتاع سوريا والقذافى والوريث فى كوريا الشمالية<br />انظمة ما شاء اللة عليها حاجة تفتح النفس<br />والخير كتير قوى على ايديها والناس غرقانة ديمقراطية وفلوس<br />ربنا يزيدنا من كرمة"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205251/http://masr.20at.com:80/newArticle.php?sid=12554"

