text = "كنا زمان نسمع عن اللى اختشوا بس ماكناش نعرف أنهم ماتوا ؟!!!<br />لو كنتي ما تعرفيش ياست عائشة إيه إللي بيحصل للخدم والمربيات في السعودية ياريت تكلفي خاطرك وتسألي !!!<br />ومش ضروري أقول إيه المهازل إللى بتحصل للخدم وإيه إللى ممكن يحصل لأمهاتنا وبناتنا وأخواتنا ...<br />ياناس حرام عليكم سيبوا المكاتب واطلعوا للشارع وشوفوا الوضع الحقيقي ..."
