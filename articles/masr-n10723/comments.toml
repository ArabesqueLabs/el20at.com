subject = "احب المصاريف"
author = "الجندى المجهول"
text = "الناس مش لاقيه تاكل واحنا نروح نرمى الاف الجنيهات فى المسخره وقله الادب حسبى الله ونعم الوكيل"
archived = "2007-09-19"
