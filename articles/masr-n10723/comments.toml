[[comments]]
order = 0
subject = "صيف الصرف الصحى !"
author = "باروما"
text = "آخر أسعار المتر فى الساحل حتى 30/6/2007 للقرى الجديدة طبعا !!<br />5500 جم اول صف ، 4500 ثانى صف ، 3500 ثالث صف و البركة فى المستثمرين الوطنببن<br />أخبار الساحل عام 2015 ( الساحل اغلق تماما أمام الجمهور العادى و تغير الأسم الى الأسمنت الشمالى) و على المتضررين اللجوء الى البرك و مستنقعات الصرف الصحى فلا تقلقوا فتلك من مخلفات الصحى الشمالى !!"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819050945/http://masr.20at.com:80/newArticle.php?sid=10723"

[[comments]]
order = 1
subject = "بهواك يا هوى المصايف"
author = "نيفين نيفى نوفا"
text = "الله يا جماعه احلى ايام السنه هى ايام المصيف<br />و فعلا الواحد بيروح واخد القرار انه يرمى همومه ف البحر بس عصب عننا بنلاقى نفسنا ادام البحربنفكر برده ف المستقبل و بنساله عن بكره<br />c'est la vie"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819050945/http://masr.20at.com:80/newArticle.php?sid=10723"

