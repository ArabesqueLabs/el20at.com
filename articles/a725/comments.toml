[[comments]]
order = 0
subject = "نهايتك يا بوش"
text = "أعتقد ان هذه الفترة ستشهد عقاب الله لبوش على ما اقترفته يداه في الفساد في الأرض وكأنه اله الكون<br />فهو مجرم بن مجرم مثل فرعون وهامان وقارون وسنال عقاب الله له في هذه الفترة إن شاء الله"
archived = "2004-11-09"
