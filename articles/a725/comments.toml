[[comments]]
order = 1
subject = "يا رب اتنين بوش كمان"
text = "انا نفسى ربنا يرزقنا باتنين تلاتة بوش كمان علشان تخلص الحكاية بقى ونشوف حاجة غير امريكا لانه اتنين منه يخربوها ان شاء الله"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109042425/http://www.20at.com:80/article.php?sid=725"

