[[comments]]
order = 3
subject = "ايه يا ميدو الكلام الكبير ده"
text = "يعني تنطيط وعفرته<br />بس حتة حلوة منك اوي موضوع سامي وسامية<br />فكرتني بمسرحية محمد صبحي لما اتكلم عن طارق يحي وطارق بتاع الاهلي<br />بجد 10/10<br />انا عن نفسي فرحت جدا لما بوش انتصر يالا عايزين نلخص في الحوار بدري بدري ورانا مشاغل يعني يضرب سوريا مايضربها اشمعنا هيا .. هايحمي شارون طب ما يحميه يعني هاتقف على بوش ونقول كخ .... هايطربأ العراق من فوق لتحت ما يطربأ ..هم مش عايزين يسمعوا الكلام ....<br />بس اشوفهم امامي قبل ما اموت ..نفسي اشوف جندي امريكي زي كده بروس وليس ولا زي توم كروز كده<br />واو بجد هايجنن ووقتها مش هانكون نحتاج ندخل سينما ونشوف الافلام الامريكية عيني عينك"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109042425/http://www.20at.com:80/article.php?sid=725"

[[comments]]
order = 4
subject = "هي نقطة روح الفردية اللي حتطلع روحه وروح الادارة ا"
text = "روح الفردية سمة الادارة وبوش في السياسة الداخلبة والخارجية...هي مربط الفرس اللي حتجب لك روح العنجهية الأمريكية..<br />سلمت يمين صاحب القلم اللي كتب.."
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109042425/http://www.20at.com:80/article.php?sid=725"
