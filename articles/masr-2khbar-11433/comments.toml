subject = "زواج سياحى اية ----- دا اتجار بالبشر"
author = "اكتب اسمك هنا"
posted = "2009-03-01"
text = "اكيد دة اتجار بالبشر<br />واحد خليجى ياتى عن طريق سمسار يعاين البنت او المرأة ويدفع لاهلها مبلغ من 20 الى 40 الف جنية وياخدها تقعد معاة فى الفندق شهر او شهرين يمارس معها الجنس الامن بعيد عن الايدز والامراض السرية وتخدمة وطبعا بيكتبوا ورقة زواج عرفى اى كلام بيرميها فى الزبالة بعد انتهاء اجازتة ويسيب المرأة او الفتاة ويرجع بلدى<br />دة مش بيحصل فى مصر بس لا ---- بيتم فى بنكوك ايضا<br />وفى فنادق دبى مع الروسيات ومع الافريقيات<br />اتجار بالبشر واستغلال فقر الناس<br />وطبعا لا تعليق من شيخ الازهر ولا المفتى"
archived = "2010-03-14"
