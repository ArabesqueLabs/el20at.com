subject = "حسينا الله و نعم الوكيل"
author = "hidaaya"
posted = "2009-03-28"
text = "جزاك الله أختي ليلى على هذا الموضوع ... ما دمت في المغرب فلا تستغرب؟؟؟؟ و هما فالحين غير يسدو المدرسة العراقية و كيبغيوا يخبيوا الصورة الحقيقية للمغرب : الفساد ، السيبة ، الفقر ، المخدرات، عبدة الشيطان.<br />شحال غادي يبقاو يضحكو علينا؟؟؟؟<br />الله يستر و الله يرود بنا لطريق الخير...<br />ما فاقدينش الأمل، الحمد الله لا زال صوت الحق يصدح و الشباب الملتزم بخير. و المستقبل للإسلام"
