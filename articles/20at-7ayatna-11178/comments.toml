[[comments]]
order = 3
subject = "الفسفور الابيض"
author = "محمد سلمان"
posted = "2009-03-19"
text = "كانت الحرب قد ازدادت حدتها ووتيرتها.. فكلما سقط صاروخ بالقرب من بيتها، كلما أحاطت هناء بمولودها وضمته في حنان.. لكن دخول الدبابات الصهيونية لشمال قطاع غزة، ومناداتهم عبر مكبرات الصوت بخروج المواطنين الفلسطينيين من منازلهم تمهيداً لقصفها وهدمها، أجبرت الناس، ومنهم هناء وزوجها على الخروج والذهاب إلى مكان أكثر أمناً.."
archived = "2010-03-14"
