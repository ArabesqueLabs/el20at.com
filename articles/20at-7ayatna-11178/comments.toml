subject = "حسبنا الله"
author = "محتسب"
posted = "2009-02-04"
text = "حسبنا الله ونعم الوكيل في اليهود وأعوانهم واذنابهم وعملاءهم والخونة الذين باعوا كل شيء من اجل كراسيهم وفيمن يشوه صورة المجاهدين والمقاومين اعلاميا وينحاز للباطل ضد الحق ولكم انتم يامن تنشرون وتظهرون وتوثقون الحائق من الله الأجر وان كان ذلك واجبكم"
