subject = "كن مدونا"
author = "بن كريشان"
text = "كن مدونا<br />بتاريخ &--1778;&--1637; فبراير، أرسلت أحد موظفات الشركه دعاء ديني بالإيميل الى جميع الموظفين، وهو ليس بالشيء الجديد عليكم ، فأنا لا أشك بأنكم تتلقون في العمل هذا النوع من الأدعيه المتخصصه في حل جميع العقد والمشاكل والأمور المستعصيه للمؤمن لتساعده على تسيير حياته ، ومع أنني شفت كل غريب وعجيب من أنواع الدعاء الأسلامي المنسوب الى صلعم، الا أن هذا الدعاء ينكحهم كلهم<br />&--1778;&--1637; من كل شهر هو يوم الراتب، المعاش، فهل تعلمون أن صلعم كان يدعو هكذا عندما يقبض معاشه<br />كتبت ُمنى طارش عتيق: هذا دعاء إستلام الراتب حتى يطرح الله البركة فيه فعلى المسلم ان يقول حين يستلم راتبه<br />الحمدالله الذي رزقني هذا المال من غير حول مني ولاقوه<br />اللهم إني اسألك خير هذا الراتب وخير مافيه وخير ماجاء فيه وخير مايذهب منه، وأعوذ بك من شر هذا الراتب وشر مافيه وشر ماجاء منه ويذهب إليه<br />اللهم أغنني بحلالك عن حرامك وبطاعتك عن معصيتك، اللهم ارزقني نعمة الشكر عند العطاء ونعمة الصبر عند البلاء، اللهم إجعله مالا حلالا في كل فلس منه وإغفر لي مادونه، اللهم أجعله في سبيلك وبارك فيه وارزقني أن أؤدي حقك منه يارب العالمين<br />آمين<br />الانعدام الفكري في بلاد الرمال، وخاصة في مجال العلوم والثقافه والمنطق العقلاني أعطى أفضل فرصة للجماعات الدينية، الله لا يعطيها عافية..أو يعطيها كل العافيه ، بالمعنى المغاربي للكلمه، لتنجح في زرع سيطرة الدين في العقول وفي القلوب.. فحولونا الى شعوب تائهة ضائعة لا ترى أمامها الا هذا الخضم الهائل من التخاريف الدينيه حتى صرنا نهيم بلا عقل كالبهائم، يضحك العالم علينا<br />ولكن ماذا نتوقع من أمة أفضل مالديها هو تشجيع النقل مقابل العقل، والدعوه للإتبّاع وقول بآآآع ولعن الإبتداع..أمة ترجح النصوص على التفكير و الرأي؟<br />لقد دخلنا فعلا مرحلة من الانحطاط، بإنتصار منطق الفكر الديني، وهيمنته على مناحي الحياة في مجتمعاتنا. كان هناك خبر في أحد الصحف الناطقه بالأنكليزيه في الإمارات عن مشروع إقامة معرض في دبي سيكون إسمه\" الحياة الحلال\" سيفتتحه أحد الشيوخ الذي يصل طول لقبه الى سطرين على الأقل ..ودعونى أترجم لكم مالمقصود بمعرض \" الحياة الحلال\"<br />معرض الحياة الحلال هو أول معرض من نوعه في العالم وسيقوم على الترويج لمفهوم ممارسة الحلال ومساعدة الناس على توسيع رؤيتهم لمفهومه ومعناه<br />\"الحياة الحلال\" هو مجموعة من القيم المتوفره للجميع ليجسدوا مفهوما يتعلق بالحياة بطريقة أفضل وذلك من خلال مجموعة من الإختيارات التي تشمل ولاتقتصر على الموضه واللباس، الأطعمه والمشروبات، المنتجات الصحيه، التعليم، العقارات والتمويل والسفر- سيقدم المعرض مجموعة من العارضين والموزودين والمصنعين من جميع أنحاء العالم<br />الحياة الحلال سيرفع من مركزدولة الأمارات كمكان لتمازج الثقافات حيث تصبح الحياة الحلال وإختيارتها.. سهلة وممكنة للجميع<br />إنه مثال أخر على إستلاب العقل بعد أن طغى الإسلاميون على فضاء الأنترنيت والكلمه المكتوبه وأجهزة التعليم والأعلام. ولكن مؤخرا فقط صار الملحدون واللادينيون وأصحاب الفكر الحر، يستغلون وسيلة جديده لم تكن معروفة هي البلو&--1696;ات او التدوين على الأنترنيت. ورغم قلة عددهم الا أنه اصبح سلاحا فتاكا.. يتساقط له الأسلاميون صرعى كالذباب أمام المبيد الحشري &--1664;يف &--1664;اف، لا تستطيع عقليتهم الدينيه السحريه له صبرا..إنه منطق العقل والحريه<br />لاتقولوا أنه ليس هناك من أمل لهذه المدونات العاقله امام بحر الجهاله الأسلاميه في الشبكة العنكبوتيه . مدونة أرض الرمال هذه كانت أحد هذه المحاولات، وقد كنت أنظر اليوم الى أحصائيات زوارها الذين وصلوا الشهر الماضي مثلا الى &--1777;&--1638;&--1641;&--1785;&--1640; حيث تكون معدل الزيارات أكثر من أربعة الاف كل اسبوع. هذا يفوق توزيع بعض صحفنا بالأمارات. وقد تستغربون تنوع البلدان التي يقرأ منها الناس ، تأتي على رأسهم مصر والكويت والمانيا وهناك غيرهم يفتحون المدونه في تايوان ومن روسيا والسويد وإيران والجزائر والسعوديه..الى أوكرانيا والبرازيل.. و مره رأيت زائرا من هندوراس ! الا أن الأغرب هو أن نصف هذا الرقم يأتي من الولايات المتحده حيث ينشط الدخول الى المدونه اثناء الليل. وبالنظر الى أربعة سنوات من قبل ، كان عدد زوار المدونه لايتجاوز سبعه لكل مقال ..مما يدل على وجود طلب كبير وحاجة لهذا النوع من الكتابه<br />نحن نحتاج الى زيادة في أصوات العقل لتحرير الناس من براثن الإسلاميين وكشف كذبهم وهو دور قومي ووطني مهم جدا. الأصوليه الأسلاميه بشموليتها تهمش دور الفرد مقابل المجتمع..تستولد الدكتاتوريه والعبوديه لهذا الفرد وتسحقه وتحوله الى أداة تستغلها للوصول الى القوه والتسلط والوجود .. أساس الحضارة الغربيه وقوتها ومنعتها أنها كانت ثورة على أستعباد الدين للعقل..فكانت ثورة محرره للفرد. عكس أهداف الحركات الدينيه الأسلاميه التي تستهدف دكتاتوريات ثيولوجيه ، لسحق وإستعباد الأنسان العربي المسلم وإذلاله..من أجل إعلاء شأن الدين..أقصد رجال الدين ..وهناك تجارب شعوب ندمت على ذلك، ماثلة أمامنا ، صور البرلمان الإيراني تعرض بكل وضوح كم كتمت العمائم..العقل<br />فإسمحوا لى ان أشارككم ببعض تجربتي متمنيا أن يقوم بعضكم بذات الشيء و يخطو بنفس الأتجاه<br />إنتشرت ظاهرة التدوين على الأنترنيت بشكل كبير وأصبح اليوم بأمكان أي شخص أن يخلق له مدونة يكتب بها. المدونات العربيه هي المستقبل للكتابة العربيه التي تعاني من قبضة الرقابة والحجب وهيمنة طابور من المستثقفين العرب المؤدلجين بأسم السلطه و من بقايا المرحلة القوميه القمعيه البائده، كما نشاهد في قناة الجزيره ويقع اللوم كله على الحكومات العربيه التي بعد أن مارست قمعا فكريا طوال الستينيات والسبعينيات أطلقت الأن يد الأسلاميين تعيث في عقولنا فسادا حتى أصبحت شعوبنا أووت..خارج مرمى العقل والمنطق<br />حقيقة إنني معجب بقدرة اللغه العربيه على المستوى الشعبي بتعريب هذه الظاهره بدون الأعتماد على مجمع اللغه العربيه الذي مازال يبحث في شاطر ومشطور وبينهما كامخ، ومازال محتارا في ماسيسمى جهاز الفاكس الذي أشرف على الأنقراض تكنولوجيا<br />كثير من المدونات العربيه، مثلها مثل ظاهرة المنتديات التي سبقتها تجتر كلام الاسلاميين وتردد نفس الموضوعات نقلا عن بعضها، وهذا يخلق فرصة إستراتيجية لتقديم مدونات متميزه ومختلفه عن الكم المتكرر الممل<br />أقصد هنا فرص تقديم مدونات لادينيه أو إلحاديه بطريقة إستراتيجيه لأنقاذ بلاد الرمال من قبضة الظلام والجهل والهلوسه الأسلاميه، وبالطبع ستحسب في ميزان صدقاتكم عندما تنيرون طريق تائه أعماه كذبهم على مر السنين<br />هناك كثيرون منكم يعلقون في مدونة بلاد أرض الرمال بطريقة رائعه ويظهرون قدرة تعبيرية وتحليلية وتفكيرية مثيرة للأعجاب، وليس لدي شك من ان لديهم القدرة على الكتابة والمساهمه مع الأخرين في هذه المهمه<br />الكتابه بطريقة مختلفه عن السائد الذي كسد ومله الناس من التكرار شيء مهم جدا ، فماتجده في مواقع الإسلاميين اليوم هو نفس الفكر الذي كان قبل ثلاثين سنه، أعيد تشكيله إسلاميا..هو مجرد إعادة تدوير القوميه العربيه بشكل إسلامي ، فبعد أمجاد ياعرب أمجاد، دخلنا في عجائب أن كنت ملحد! فأنت صهيوني عميل لأسيادك الأمريكان..ولا تنسوا أن ظاهرة التخوين كانت دائما عادة متأصلة في بلاد الرمال، لأنها تبرر قتل الناس وسفك دمائهم ، منذ أيام جمهوريات القمع القومجيه، التي في طريقها لتتحول الى جمهوريات ملكيه تورث الحكم للأبناء ..الى ثقافة الأنتحار الأسلاميه، والأثنان لم يتوانا يوما عن قتل الأبرياء وإقتراف جرائم الإرهاب..إنه وجه اخر لنفس المسخ<br />الساحة رغم أزدحامها بالغثاث الأسلامي في الواقع فارغة من المحتوى ومن المستوى وهذه فرصة لتقديم كتابات جديدة ذات جودة وعقليه<br />أتمنى ايها الأخوان والأخوات أن يبادر بعضكم بالمشاركة في كتابة مدونات تجذب القراء الى أفكار اللادينيه والليبراليه والألحاديه ، ولا تكونوا كالمسلمين قص ولزق ونقل و تكرار ..بل تأتون بأفكاركم أنتم التي تضيف الى الساحة وتزيدها عمقا<br />هناك مئات من المدونات التي تطارد نفس الموضوع وتنقله كما هو ، لا تفعل ذات الشيء بل حاول أن تعلق على خبر مختلف قرأته في الصحيفة اليوم أو شاهدته في التلفزيون، وإن كان هناك موضوعا في مدونة اعجبك كثيرا فبدلا من أن تنقله وتكتب عليه منقول..أضف إليه رأيك ..علق على كتاب، خبر او مدونة أخرى واضف اليها<br />كل إنسان لديه منظور يختلف عن الأخر،وأنت أيضا لك وجهة نظر خاصه قد تكون مثيرة للأهتمام، فلماذا لاتقدمها كأضافة ، لديك خبرات في الحياة مختلفه، ولديك تخصص علمي معين قد يقدم وجة نظر جديده ليست فقط مغايرة لما تقدمه النصوص القرءانيه وكتابات السنه الباليه ، بل وقد تكون أفضل منها ..ولا تهتم بنباح الإسلاميين على موقعك لا تجعلها تؤثر فيك..فأنت أنسان رأي حر..بالعكس أنا أجدها مفيدة جدا لفهم طريقة تفكيرهم..وأجدها كذلك مسخره عالأخر<br />إذا كنت تحب أن تجذب قراء منتظمين لمدونتك فيجب أن تكون أنت كذلك منتظما في كتاباتك، فبعد زيارات عده قد يسئمون الأنتظار ولايعودون أبدا. هذا يعني أن تلتزم بجدول معين من الكتابة قدر ما تستطيع، لاتهمل قراءك لفترات طويله. أنا مثلا لاحظت أنني أستطيع أن أكتب مرتين الى ثلاث في الأسبوع وذلك فقط في حالة توافر الوقت، ولكن مهما يكن فأنا ملتزم بأدني جدول وهو مقال على الأقل في الأسبوع..حتى لو حدث زلزال أو قامت القيامه. فالقاريء ، عزيزي القاريء يعود لأنه يتوقع أن يكون هناك المزيد<br />أحيانا عندما أعرف أنني سأكون مشغول! أكتب موضعين أنشر واحد حالا وأحتفظ بالأخر لأنشره خلال الفترة التي أكون بها مشغولا جدا ولا أستطيع الكتابه<br />كثف من قرائتك فهذا يحسن من معلوماتك ورأيك حول الفكره. أقرأ عن الفلسفه و تاريخ الأديان والعلم وهذا سيجعلك تكتب بطريقة افضل. حافظ على سرية شخصيتك أن كنت تكتب في الإلحاد وذلك لوجود عنصرية وكراهية شديده من المجتمع والأسلاميين والحكومات في بلاد الرمال. أحيانا قد لايكون هناك خطر خاصة إن كنت تكتب من دولا غربيه، ولكن ذلك ايضا قد يتسبب بزعل من قبل أبويك وأخوانك واصدقائك. فأن كان يهمك ان تساعدهم وتحبهم أن يقرؤا لك..فلا تظهر أسمك الحقيقي. أنا استلم أحيانا في الأيميل رسائل من اصدقائي في الأمارات يرسلون رابطا لمدونتي بدون أن يعرفون..إنني أنا من يكتبها<br />تعامل مع محركات البحث بطريقة ذكيه لتلتقط مقالاتك. أنا أتعمد إستخدام عناوين مشابهه لعناوين مواقع الأسلاميين الدينيه، فيجدني بعض زوارهم..وكم منهم كتبوا لي ليشكروني على تحريرهم من تلك الخرافات<br />لا تستسلم ابدا..كثير من المدونيين الرائعين يبدعون..ثم يخرجون ويتوقفون ، هناك الرسام الرائع لمدونة عرب من الفضاء ، وهناك مدونة ضفاف مخضبة بالجنون أمثلة. وفي فترة خشيت ان المدون الأماراتي صلعم سيتركنا..قبل أن يستكمل كتابة افضل &--1664;ارودي للقرءان في التاريخ<br />ُأكتب في كل مكان و في كل وقت أكتب وأنت تستمتع بالكتابه ، انا أستخدم الكومبيوتر المحمول في كل مكان..فقد كتبت في المقهى وفي البار وفي المطارات ..وعلى الشاطيء..وكم أوقفت القصواء تحت ظل شجرة بالصحراء قرب الطريق السريع ..لأكتب وأدون فكره<br />الموضوع الديني مثل المؤمن نفسه ، ممل جامد و بطبعه ثقيل الدم يعيش حالة من التوهان والدروشة المزيفة والشكلية المقيتة والإهتمام بالقشور وإعتناق التفكير الخرافى وإدمان الدجل والغرق فى الغيبيات وهجران أرض الحياة إنتظاراً لحل السماء....وستجده ينهار أمام السخريه وخاصة إن كانت لاذعة ذكية و مبنية على أساس معلوماتي صحيح<br />يستطيع منتقدي الأديان والملحدين والمتشككين واللادينين والليبراليين وجميع الشرفاء من دعاة الفكر الحر إستغلال ظاهرة التدوين لتمثيلهم وعرض وجهة نظرهم ..وأن كره الكافرون بهم<br />الأنترنيت جمعت كذلك كثيرا من اصحاب هذه الأفكار التنويريه من أنحاء بلاد الرمال ليجدوا متنفسا لهم من الغبار الذي يثيره المسلمون وكهنتهم. وعلى الأنترنيت كذلك ليس من الضروري أن تحظى مواقع الأسلاميين بأهتمام القراء، إنها كذلك فقط لأستفرادها بالساحه فلايوجد غيرهم اليوم، ولكن متى وجد البديل الأفضل كما رأيتم فسينتصر العقل على النقل، وسُتسحق العبوديه والدكتاتوريه أمام الحريه.. لامحاله<br />بن كريشان"
