subject = "شكرا على ارشادي للكتاب"
author = "حمزة"
text = "الانتحار ليس عيب..الجهل والأمية والبطالة والكسل هي العيوب..<br />كما أن انتحاره لا يدلني على أنه لم يجد السكينة بل يدلني على أنه وصل لليقين في أن الالحاد حقيقة..اذ لا أرى أن أي مجنون مهما بلغ جنونه سينتحر لو شك أن الله موجود..<br />بالمقابل أعتقد أن المسلمين لا ينتحرون لأنهم يخافون من الجحيم ولولا ذلك لانتحرو انتحار جماعي كليا ان كانو يملكون أدنى احساس بالخجل..<br />أتمنى أن تكون وصيته قد طبقت ولم يدفن في مقابر المسلمين المظلمة.."
archived = "2008-02-28"
