subject = "تركى ومغربية ------- يا حلاوة - الحمد للة لم يطلع"
author = "اكتب اسمك هنا"
posted = "2009-03-05"
text = "اية الهنا اللى احنا فية دة<br />تركى ومغربية - طيب وبمناسبة اية - بيكرهوا اية فى مصر - مالهم ومال مصر<br />فية احد من الناس مؤجرهم<br />ولما هى عصابة دولية اية البساطة والبدائية فى صنع القنبلة المزعومة<br />على العموم هنشوف رد الحكومة التركية ورد الحكومة المغربية"
