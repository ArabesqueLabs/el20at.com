[[comments]]
order = 1
subject = "بصراحه ومن غير زعل الشرطة المصرية لا تصلح لمثل هذه"
author = "منديل نفيسه نشف لسه ما نشفش"
posted = "2009-03-05"
text = "الشرطة المصرية واسلوب وزارة الداخلية المصرية وطبيعة ضابط الشرطة المصري وحالته النفسية التي يعيش بها في وسط المصريين وغروره وتلقيبه بالباشا كل دي عوالم تؤكد فشل الشرطة المصرية في التحقيق الحوادث التي من هذا النوع<br />لما يكون تركي ومغربية يدل دلالة قاطعة على ان الشرطة المصرية فشلت في اقتفاء اثر الجهاه وشافلتها اثنين عيال صيغ واخدو قرشين وحيعملوا تصريح صحفي بسيط وكل واحد يروح لحاله<br />الشرطة المصرية لا تصلح في البحث الجنائي ولكنها اثبتت جدارتها في تفريق المظاهرات"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "من نجار مسلح الى مغربية وتركي ها ها ها ها"
posted = "2009-03-05"
text = "الضباط بتوعنا بشاوات كبار يا دوب عليه يقول للمخبر اللي عنده روح اعملي تحريات<br />لكن القضايا التي من هذا النوع لازم الضباط الكبار يتنكروا وينزلوا بنفسهم<br />الباشا ما يصلحش للبحث الجنائي<br />في القضية اللي قبل كده قالوا نجار مسلح ودلوقتي مغربية وتركي<br />يا حلاوه"
archived = "2010-03-14"
