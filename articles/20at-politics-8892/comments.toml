text = "سلام عليكم جميعا<br />اسمعوني يا اخوان .. خليكم هاذئين و متماسكين لان الشعور بالنقص في العالم الغربي معروف منذ القديم<br />و من يريد ان ينصر محمد و ملة محمد عليه بالتفكير العميق و الرد بالمثل بأسلوب اكثر شدة و نتائج العصبية هي الفشل<br />لذلك ادعو كل من له قدرة لانتاج نفس العمل بأسلوب مبطن على رموزهم الدينية هو الحل الامثل"
