[[comments]]
order = 0
subject = "حسبنا الله ونعم الوكيل"
author = "بسلة مسلمة مصرية"
posted = "2008-04-25"
text = "لمتى سنصبر عل هذا الهوان !<br />يا عالم هى كده كده خربانا , ضربوا الاعور على عينه , ولا حتى حيسخطوك يا قرد .<br />هى موته ولا اكتر ماحنا كده كده متبهدلين نموت بقى بكرامه وعزة نفس .<br />وربنا مش حينصرنا الا اذا نصرنا دينه ونبيه عليه افضل الصلاة والسلام .<br />وعلى الكل ان يعلم انه لا قامة لنا الا بنصرنا لدين الله الدين الحق والرسول الكريم واعلى كلمة الحق .<br />قال الله تعالى وإن تنصروا الله ينصركم ويثبت اقدامكم .<br />لنا الله يا امة محمد لنا الله ."
archived = "2010-03-14"
