text = "كل هذا بسبب تجاهلنا لفكره حوار الاديان فهى السبيل الوحيد حتى يعلموا معنى الاسلام اما عن هذه اللقطه هى لقطه ساخره عن ما يسيئون للاسلام من المسلميين للاسف مش من منفز اللقطه راجعوا انفسكم يا مسلمون اليوم ...ستحاسبوا عن مافرطم فى الدين وتقاعسكم عن معرفه معنى الدين الاسلامى الدين ليس شكلى فقط الدين معامله اكرر معامله اكرر معامله"
