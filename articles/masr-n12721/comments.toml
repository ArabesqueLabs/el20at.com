subject = "نشط مصري بارز"
author = "مصري حزين"
posted = "2007-12-05"
text = "بقه وائل ده نشط مصري بارز ياخي حرام عليكوا....ده انسان مستبد الرأي و اناني لابعد الحدود و لا يرى الا مصلحته الشخصية و يتكالب على نسب الافضال لنفسه مثلما حدث في قضية عماد الكبير عندما خرج علينا هو بعض كدابين الزفة بنسب الفضل لذاته و هو كذب و افتراء فهذا الشخص لا يقرأ له اكثر من 1000 شخص فكيف بالله عليكم يصبح نشط مصري بارز ..على الجانب الاخر هو لا يعطي اح الفرصة للاختلاف معه في الرأي و هو شئ واضح في مدونته \"مدونة الوعي المصري - على مزاج صاحبها اللي مش بيشتغل عند حد\" اذا حاولت ان تعلق عما يكتب بطريقة ايجابية من الممكن ان تكون مضادة له في الرأي نوعا ما يحجب تعليقك فورا و من الممكن ان يسبك علنا... ارجو عدم اعطاء الناس اكبر من قدرهم و شكرا"
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205163048/http://masr.20at.com:80/newArticle.php?sid=12721"
