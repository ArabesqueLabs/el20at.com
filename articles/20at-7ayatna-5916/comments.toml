text = "انا من فلسطين<br />ندعوك لكي ترسم البسمة على شفاه من حرمها .. فلا تعتقد أن قلة ما يمكنك المساهمة به لن تجدي شيئا في خضم ضخامة معاناتنا..ريالا واحدا يوفر رغيفالنا.... وربما يروي عطشنا وربما يتحول إلى قلم رصاص أو دفتر لطلب علمنا...فلا تستهن أخي القارئ بما يمكنك المساهمة به...وأسرع بمد يد العون إلينا .... وما تساهم به سيبارك الله لك به في عمرك واولادك ومالك زيادة بركة من الله<br />إلى الغيورين على دينهم واتباع الحبيب المصطفى محمد عليه الصلاة والسلام<br />إلي الذين يتألمون لصرخات أطفال غزة الصادقة ..ندعوكم لأن تقفوا معنا وقفة المسلم مع المسلم في مساعدةمن أطبق عليهم عسر الحالي في هذه الايام المباركة نعرض عليكم وضعنا الصعب لمساعدتنا فمنا الطالب الفقير ، والمحتاج ، والمكلوم بما تجود به النفس)بإمكانكم إيداع ما ترغبون في إخراجه على رقم حساب..<br />رقم الحساب 610_057526_9500<br />اسم البنك البنك العربي بغزة<br />جوال 0598999272<br />انقلو رقم الحساب كما هو حتى الشحطة ( _ ) اللي بين الارقام اكتبوها زي ما هي<br />كفاكم دعوة محروم وصلته صدقة دعوة لكم في ظهر الغيب الله سامعها ومجيبها بإذنه"
archived = "2010-03-14"
