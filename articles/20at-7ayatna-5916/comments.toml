text = "السلام عليك ورحمه الله ويركاته 00 سيدي خادم الحرمين الشريفين ملك الانسانيه انني احد افراد هذا الشعب الكريم وانيي اسئل الله لكم دوام الصحه والعافيه سيدي انني اعمل في السلك العسكري وفي خدمه ديني وملكي ووطني حيث انني ارغب منك ياملك الانسانيه مساعدتي بما تجود به حيث انني اعول اسرتي وكذالك امي وابي واخوتي جميعا ويشهد الله انني لا املك من حطام الدنيا مثقال ذره سوى راتبي حيث انه لايغطي جميع اللتزاماتي حيث اثقلت كاهلي الديون وانني اسكن في شقه مستأجره ولا املك سوى سياره لاتتجاوز قيمتها خمسه الاف ريال وديون تتجاوزمئتين الف ريال حيث انني ارجو من الله ثم منك ياسيدي الكريم مساعدتي ويعلم الله انني في حال لايعلما الا فاطر السماوات والارض 189206061 الراجحي واسئل الله ان يمدك بالصحه والعافيه والسلام عليكم"
