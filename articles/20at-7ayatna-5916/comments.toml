text = "السلام عليكم ورحمه الله وبركاته 000 سيدي خادم الحرمين الشريفين الملك عبد الله اسئل الله ان يمد في عمرك وان يمن عليك بالصحه والعافيه سيدي انني ولدت على هذه الدنيا يتيما فقيرا حيث درست ولم استطع اكمال دراستي والتحقت بالسللك العسكري وتزوجت ولدي بنتين تزوجت بالدين ويعلم الله انني الا هذه اللحظه ونا لازلت اسدد الدين الذي اقترضته من اجل زواجي حيث انني لا امتلك بيتا او شقه علما انه قد اسكنني عمي في بيته الشعبي وذالك لفتره محدوده علما ان راتبي والله العظيم اوزعه نهايه كل شهر على الدائنين ولايتبقى لي شيئا حيث انني قبل اكتب رسالتي هذه اليلك طلبتني احدا بناتي حلوا ويعلم الله وهو عالم الغيب انني لم استطع تلبيه رغبتها حيث لا املك ريالا واحدا حينهافقد ظاقت بي الدنيا حيث انني اتمنا ان املك منزلا اعيش فيه انا وبناتي وزوجتي يجمعنا تحت سقف واحد ولانني لم استطع من تلك الديون فارجو من الله ثم منك ياخادم الحرمين مساعدتي والله يحفظكم ويرعاكم 300608010163290 بنك الراجحي علي عبد الله 0555534788"
