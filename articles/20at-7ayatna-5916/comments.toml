text = "نحن ثلاثه اخوه بنتين وولد توفى ابى وتوفيت امى وطالب اخى بحقه فى الميراث من شقه كان يمتلكها ابى ونحن اختين غير متزوجتين ولا نملك نصف ثمنها لنعطيه اياه وكل رجائى من الله ومن جلالتكم اقراضى انا واختى مبلغ مائه الف جنيه والسماح لنا بتسديدهم على اربع سنوات وجزاكم الله خيرا على الاهتمام انا من مصر وتليفوني المحمول 0102405262"
