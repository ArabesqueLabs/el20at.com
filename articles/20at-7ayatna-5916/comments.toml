[[comments]]
order = 10
subject = ""
author = "محمد"
posted = "2009-05-25"
text = "السلام عليكم ورحمة الله وبركاته<br />امابعد<br />ايها الملك الغالي يأيها الملك الذي يسمع الى ولده الصغير<br />ايها الأب الحنون اسمعني وحقق لي ماأتمناه أبتي انت الذي تقدر ان تساعدني<br />ايها الملك الأب نحنو عائله سعوديه<br />مقدمين في الظمان الأجتماعي ولكن لا نصرفه الأني دخلت معهد السباعي وهو يطلب كل ترم 9000 ولكن والله أن اهلي يتمنون أن يأخذو منه لكي يلبو رغباتهم و لكن يقولون لا هذا للمعهد وهم في امس الحاجه الى الضمان وأنا لست وحيد بل عندي اربع اخوات<br />ايها الملك الحنون لا اريد أن اطول بي رسالتي هذي التي اشكو لك منها حالي<br />ايها الأب اريد مبلغ من المال لكي احقق مااريد وهو مليون اريال لكي اسدد المهعد واشتري منها عماره لكي يأتينا منها مدخول شهري وهذي الأمنيه التي اريدها ان ابني لي مسجد فأنا انسان ملتزم واحب الله واريد يوم القيامه ان يكون لي شي اقدمه امام الله<br />فأيها الملك الحنون أنا شكيت لك ورتميت بين يديك لكي تساعدني فأرجو منك أن تحقق ما أتمناه هذا رقمي فأرجو المساعده 0553059587<br />وهذ ايملي mhmad587@hotmail.com<br />روح الله يحفظك ويخليك لنا ويسر امرك وأشوفك في الجنه<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621140325/http://www.20at.com:80/20at/7ayatna/5916.html"

