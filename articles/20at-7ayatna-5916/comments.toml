text = "السلام عليكم ورحمة الله وبركاته<br />الي خادم الحرمين الشريفين المللك عبدالله بن عبدالعزيز حفيظه الله<br />انا رجل معاق متزوج وعندي خمسة اطفال اعيش في شقه ايجار وماديتي ضعيفه<br />ولا يخفي عليكم ان الحال لايسر واني اطلب من خام الحرمين الشريفين الملك عبدالله حفظه الله مساعدتي<br />واني قد قدمت على قرض لبناء بيت لأسرتي ولا يخفي عليك سيدي انتظار هذه القرض منتذو 9 سنوات<br />فمال الحيله وانا ضعيف الحال ولا املك سوى العون والمساعده"
