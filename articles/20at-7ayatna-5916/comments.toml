posted = "2007-05-21"
text = "يا ليت كل الحكام العرب يقلدون الملك عبدالله<br />على الأقل كانت هناك مشاكا كانت حلت<br />ولكن اهم شئ ألا يقوموا باعتقال المتصلين"
