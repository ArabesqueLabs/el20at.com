text = "لى خادم الحرمين الشريفين الملك عبدالله بن عبد العزيز حفظه الله احتاج لمساعدة مالية انا بنت فقيرة عمري24 اعاني من ضعف السمع وحروق في الجسم وامراض جلدية واعصاب لم استطع الحصول على وظيفة بسبب ضعف السمع ولم استطع الزواج بسبب الحروق والامراض الجلدية الوالد ماعنده وظيفة احتاج فقط لدفع تكاليف المشتسفى والعمليات ارجوك ساعدني رقم الجوال الوالد 0556582332"
