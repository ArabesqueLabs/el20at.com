text = "السلام عليكم ورحمة الله وبركاته<br />الي خادم الحرمين الشريفين المللك عبدالله بن عبدالعزيز حفيظه الله انا داخل على الله ثم عليك<br />انا شاب سعودي متزوج وعندي اطفال و ارهقتني الديون والله اني اعجز عن شراء طلباتهم من حليب وغيره واحلم في تسديد تلك الديون وان امتلك منزل وسياره لعائلتي ونحن ابنائك وتحت عطفك والله ثم والله لا املك شي في ها الدنيا لا ارض ولا منزل ولا املك غير سياره فورد مؤديل 92 ولا تسوى غير اللفين ريال اطلب من الله ثم منك يا والدي مد يدك الحنونه والكريمه لنا<br />رقم الجوال / 0559900920"
