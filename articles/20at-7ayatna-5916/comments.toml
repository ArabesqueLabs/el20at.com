posted = "2009-07-20"
text = "يا سيدي الكريم انتم اهل الخير والكرم والمساعدة ….رجائي بالله ثم بشخصكم الكريم صاحب القلب الطيب مساعتي على تسديد ديوني حتى ارتاح منها انا وعائلتي ومساعدتنا بما تراه مناسبا ليكون عونا لي ولعائلتي في ظروفنا الصعبة التي نتعايش معها يوميا وعندي ما يثبت ذلك اناشدكم بالله العظيم مساعدتناوتكون مساعدتكم لنا سبب راحتنا وسعادتنا بعد الله تعالى….. وشعورنا بالراحة والطمانينة وتنتهي معاناتنا يا سيدي ارجوا ان يكون لرسالتي مكانا في قلبكم الطيب وان يكون ردكم قريبا فظروفي لا يعلم بها الا الله وانا اعيل اختي الأرمله ولديها 3بنات وعمتي التي تعاني من مرض السكري والغده وكذلك تتعالج في الصحة النفسية ولديها بنتان موعاقات الكبرى لايصرف عليها زوجها ولديها3بنات وأبن وزوجها يعاني من مرض السكري وغرغرينا في رجله وظروفنا تزداد سؤ كل يوم..<br />سيدي الكريم …. انا وعائلتي لا نملك الا الدعاء لله عز وجل بان يجعل مساعدتكم لنا في موازين حسناتكم وان يبعد عن شخصكم الكريم كل شر ومكروه وان يحفظكم الله ويرعاكم<br />ذهبه ال عثمان<br />0506144123"
