posted = "2010-01-07"
text = "يا سيدي الكريم انتم اهل الخير والكرم والمساعدة ….رجائي بالله ثم بشخصكم الكريم صاحب القلب الطيب مساعدتنا على تسديد الديون حتى نرتاح منها انا وعائلتي ومساعدتنا بما تراه مناسبا ليكون عونا لي ولعائلتي في ظروفنا الصعبة اناشدكم بالله العظيم مساعدتناوتكون مساعدتكم لنا سبب راحتنا وسعادتنا بعد الله تعالى….. وشعورنا بالراحة والطمانينة وتنتهي معاناتنا يا سيدي ارجوا ان يكون لرسالتي مكانا في قلبكم الطيب وان يكون ردكم قريبا فظروفناتصعب بسب الغلاء وزيادة الأجارات نريد منك أعطانا منزل ملك جزاك الله خير ساعدنا ما يبعدنا عن حاجت وطلب الناس فنحن من أبناء الوطن<br />سيدي الكريم …. انا وعائلتي لا نملك الا الدعاء لله عز وجل بان يجعل مساعدتكم لنا في موازين حسناتكم وان يبعد عن شخصكم الكريم كل شر ومكروه وان يحفظكم الله ويرعاكم"
archived = "2010-03-14"
