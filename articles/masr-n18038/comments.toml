[[comments]]
order = 6
subject = "ده مش أسلوب حوار"
author = "مواطن كل حاجة بيشوفها رخيصة"
posted = "2008-11-01"
text = "الحزن الواطي مش محتاج أن حد يتكلم عن جمال عيون أو إنجازاته فله من الجرائد ما يكفيه ومن الأفواه التي تستحق أن تلجم بالنيران ما يكفي .... أما أحمد فيجب ألا نهاجمه في شخصه فالهجوم موجه لما يمثله وأتمني من الجميع مراعاة أسلوب الحوار (( الاسلام هو الحل شرع المولي عز وجل )) طول ما احنا بعاد عن ربنا عمرنا ما هنكون في مقدمة الأمم."
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133612/http://masr.20at.com:80/newArticle.php?sid=18038"

[[comments]]
order = 7
subject = "(( الاسلام هو الحل شرع المولي عز وجل ))"
author = "الى الاخ اللي فوق"
posted = "2008-11-01"
text = "دا كلامك مظبوط ولكن يا اخي العزيز في حاجه اسمها علامات يوم القيامه<br />العلامات الصغرى<br />العلامات الكبرى<br />من العلامات الصغرى قبض العلم<br />ممكن تحللي الاشكالية دي والله ازاي حنطبق شرع الله في زمن قبض العلم<br />يا اخي الكريم انا بفضل الله بصلي جماعة في المسجد في بلد الازهر والله العظيم تلاته في اكبر المساجد المسلمين مش عارفين يصلوا جماعة صح ولا فيه امام يعلمهم الصلاه<br />ودا تصحيح لعلامات يوم القيامه قبض العلم والرؤوس الجهال<br />ممكن تروح للشيخ محمد عبد الله الخطيب بصفته الازهري الوحيد في مكتب الارشاد ونساله ازاي حنقيم دولة اسلامية في زمن قبض العلم<br />اظن سؤالي واضح<br />وشكرا"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133612/http://masr.20at.com:80/newArticle.php?sid=18038"

[[comments]]
order = 8
subject = "القرار الصعب"
author = "انا مانيش مصري"
posted = "2008-11-04"
text = "صدقوني راح تندمو عليها لو عملتوها الجزائر قبلكم كانوا يقولوا جبهة الانقاد وبدا فيهم التفجير والقتل والتهجير في كل مكان<br />السنه شوي والشيعه شوي والقاعده والتكفير وكوارت ليها اول ماليهاش اخر<br />مصر ام الدنيا وحلوه وفيها امان وخير وبركه حافظوا عليها شعب متماسك بلاش الدين في السياسه .<br />ونجاح الحزب الوطني مستمد من الدين لله والوطن للجميع فيه كل الاديان حتي الي ماعنداش دين<br />هده نصيحه لكل مواطن مصري مدوا ايديكم كونوا متكاتفين ."
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133612/http://masr.20at.com:80/newArticle.php?sid=18038"

[[comments]]
order = 9
subject = "ايه اللى بيحصل ده"
author = "مونى"
posted = "2008-11-06"
text = "انا شايفه كل الاخوه اللى علقو قبلى قلبو الموضوع من سياسى لدينى يا اخونا بلاش خلط الامور<br />الموضوع ببساطه ان احنا شعب مسير وليس مخير<br />يعنى احنا عاجبنا مش عاجبنا الحزب الوطنى والحكومه بيعملو اللى هما عاوزينو<br />وبالعكس الاستاذ احمد (من الحزب الوطنى)مش ابن البطه السودا ده وجودو ف المؤتمر دليل على ان احنا مغصوبين على كل حاجه"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133612/http://masr.20at.com:80/newArticle.php?sid=18038"

[[comments]]
order = 10
subject = "متنسوش مؤسس حزب الوطنى هو المحامى البارع مصطفى كام"
author = "laweryasser@yhoo.com"
posted = "2008-11-10"
text = "الحزب الوطنى الديمقراطى مظلوم لكن بجد هو حزب عظيم رغم انى مش منتمى له لكنه تحس انه عباره عن دوله فيها معارضيين ومؤيدين داخله ده غير اى مشروع قانون بيتناقش فيه ف الحزب قبل مجلس الشعب هاتولى حزب تانى ف مصر كده؟؟؟؟ خليكم واقعيين وسيبكم من كرهكم للحزب ......فيه عك اصلا لان الحزب المفروض ملوش علاقه بالحكومه ده القانون....لكن مش صح انك تعارض انتماء معين حزب وطنى ولا غيره ....اللى ماسك البلد هو الديمقراطى فيجب كلنا وراه<br />شاهدوا الامريكيين الجمهورين بعد ماكسب اوباما كلهم حيوه ونسوا انتمائتهم لكن مكرهوش الرئيس علشان هو مش من خزبهم ولا انتماءهم له ...لاء....هو ف الاصل مواطن امريكى"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133612/http://masr.20at.com:80/newArticle.php?sid=18038"

