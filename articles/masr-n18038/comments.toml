[[comments]]
order = 2
subject = "فعدد غير قليل من الحضور قال في نفس واحد \\\\"
author = "مش ححبك"
posted = "2008-10-30"
text = "تخلف وجهل ومرض<br />ليه بأه لانه شاب مثل اي شاب عايز يبدأ حياته<br />عايز يشتغل عايز يتجوز<br />فلم يجد الا هذه الجريده ليعمل فيها<br />تماما مثل عبدالله الطحاوي عمل في جريدة اسمها الكرباج صاحبها واحد صول<br />حيعمل ايه ما هو لازم يشتغل<br />فالاخ راح يعمل في جريدة الحزب الوطني ليس حبا في الوطني ولكن حبا في العمل ولم يكن هناك مجال اخر ليعمل فيه<br />فكون اننا نقول ييييييييييييييييييييه مش عايزنه مش عايزينه<br />دا تخلف<br />رجعية<br />ثانيا دا اسمه احمد يعني مسلم زينا زيه<br />سلام"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133612/http://masr.20at.com:80/newArticle.php?sid=18038"

[[comments]]
order = 3
subject = "الحزب الوطني من ممتلكات مصر المسلمة وليس ملكأ لاحد"
author = "مش رضوى حسن ولا مرو صلاح"
posted = "2008-10-31"
text = "حول مقولة (ييييييييييييييييييييييه) (مش عايزينه.. مش عايزيه) عندما عرف الصحفي نفسه بانه من جريدة الحزب الوطني<br />نرد ونقول<br />ان الحزب الوطني حزب مسلم سني تماما مثله مثل وزارة الدفاع جيشها جيش مسلم سني وبقية ممتلكات الدولة والحوب الوطني كل اعضائه مسلمين سنه والحمد لله ومصر دولة اسلامية يدين اهلها بالاسلام على المذهب السني بنسبة 94%<br />فالمطلوب الان هو اناس ينشرون هذا الفكر بين الناس ليوقظوهم من هذا الثبات العميق<br />مش عايزين حد تافه يقول يييييييييييييييه يييييييييييييييييييه مش عايزنه مش عايزينه<br />مش عايزينه ليه يا روح امك انت وهو وهي وهي<br />مش بشر زيكم<br />هو مصري مسلم سني وانتم مصريين مسلمين سنه<br />اصحوا بقا وبلاش شغل الاخوان الزفت دا بقا اللي فرقت مسلمين البلد"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133612/http://masr.20at.com:80/newArticle.php?sid=18038"

[[comments]]
order = 4
subject = "الاتحاد الاشتراكى سابقا هو الحزب الوطنى حاليا - نف"
author = "سحلوب"
posted = "2008-10-31"
text = "حزب تكون بقرار سيادى من فوق - المرحوم السادات بطل الحرب وبتاع كل الضربات البرية والمدرعة والجوية اصدر قرار بتكوينة<br />انما الحزب الللى كونة الشعب وكان لة قاعدة شعبية وطنية كبيرة بعد ثورة 1919 بواسطة سعد باشا زغلول فهو حزب الشعب<br />لماذا لم ينضم الناس لحزب الوفد ؟<br />لانة تبنى نهج راسمالى فج لا يتناسب مع امكانيات مصر المادية الفقيرة ولانة ابتدا فى شتم ثورة 23 يوليو ورموزها وطالب بهدم السد العالى فقرف منة الناس<br />ماذا يناسب مصر من الاحزاب ؟<br />تمام زى المانيا<br />فى المانيا حزب كبير ورائع اسمة الحزب الديمقراطى الاشتراكى المسيحى<br />نريد فى مصر حزب على وزنة<br />الحزب الديمقراطى الاشتراكى المسلم<br />يراعى امكانيات موارد البلد الفقيرة ويستغلها ويبعد عن حاجة اسمها البنك الدولى ويتخذ سياسة وطنية قومية بحتة"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217133612/http://masr.20at.com:80/newArticle.php?sid=18038"

