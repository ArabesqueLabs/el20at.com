text = "الأخ مش اللي فاكر إن التميز إنه يعترض وخلاص.. أنا عادة مش بعلق على الموضوعات.. ولا في عشرينات ولا غيرها.. بس استفزني أوي.. ده غير لغته اللي شايفاها محتاجة تهذيب.. يا ريت يدرس في الأزهر الشريف شوية علشان يتأدب بأدبه.."
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814132748/http://masr.20at.com:80/newArticle.php?sid=17225"

