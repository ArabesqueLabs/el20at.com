[[comments]]
order = 7
subject = "الاهلى رمز مصر"
author = "hamd"
posted = "2008-08-15"
text = "يا سيدى الفاضل يا صاحب اللغه الساخره من الاهلى انت وامثالك من الحاقدين على الحاجه الحلوه الوحيدة فى البلد التى تتيح للناس الفرحه والبهجه فى هذا الزمن المظلم بما فيه من ضغوط ومشاكل لا حصر لهالذلك سيظل الاهلى هو البطل وراسم البسمه وممثل الاغلبيه الساحقه الحقيقيه من هذا الشعب"
archived = "2008-08-15"
capture_url = "https://web.archive.org/web/20080815215337/http://masr.20at.com:80/newArticle.php?sid=17225"

[[comments]]
order = 8
subject = "اكره الاهلى والايدز"
author = "انور منصور الزملكاوى الشريف"
posted = "2008-08-16"
text = "انا عدو الاهلى الاول فى العالم فهو سبب كل ما تعانيه مصر من كوارث اقتصادية واخلاقية وضياع وفساد وانهبار الاخلاف نهايه الاهلى نهاية كل الموبقات والفساد وبداية الاصلاح انه سبب لكل الكوارث حتى الزلازل والبراكين والامراض المعدية (الايدز )تشجيع الاهلى من الكبائر والمنكرات والضلال تهاية الاهلى قريبة"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816224529/http://masr.20at.com:80/newArticle.php?sid=17225"

[[comments]]
order = 9
subject = "الى hamd"
author = "مش فالح"
posted = "2008-08-16"
text = "انت بتقول في تعليقك<br />سيظل الاهلى هو البطل وراسم البسمه وممثل الاغلبيه الساحقه الحقيقيه من هذا الشعب<br />لا يفالح دا تطاول على الحزب الوطني وانا ارفض الكلام بشده<br />ممثل الاغلبية الساحقة هو الحزب الوطني مش الاهلي<br />اقف عوج واتكلم عدل"
archived = "2008-08-16"
capture_url = "https://web.archive.org/web/20080816224529/http://masr.20at.com:80/newArticle.php?sid=17225"

[[comments]]
order = 10
subject = ",وفيها ايه يا بشر"
author = "NIDAAL"
posted = "2008-08-16"
text = "طب وفيها ايه يعنى لما الاهلى يكون فوق الجميع وهو فعلاً فوق الجميع .. و فيها ايه لو الزمالك فاق لنفسه وطور نفسه و يحارب مع الاهلى علشان خاطر يبقى هو الى فوق الجميع .. و فيها ايه لما ننتقد الاهلى .. طب فيها ايه لما ننتقد الزمالك<br />دول فى الاول و الاخر مجرد أندية مش رموز وطنية ولا دينية لا يجب التعرض لها .. ثم ان اساساً مافيش حاجة اسمها اعلام ولا صحافة سواء قومية او معارضة فى مصر .. كله له مصالح و بيختار الى يتذاع والى ما يتذعش على حسب مصالحه وبس<br />اما بالنسبة للى بيقول الحزب الوتنى ده .. فالحزب الوتنى ده تحت الشوز من غير لا مؤاخذة .. ده مستنقع المصالح"
archived = "2008-08-18"
capture_url = "https://web.archive.org/web/20080818031927/http://masr.20at.com:80/newArticle.php?sid=17225"

[[comments]]
order = 11
subject = "أتوكس على خيبتكوا يا بتاع الوتنى"
author = "NIDAAL"
posted = "2008-08-16"
text = "و الحزب الوتنى ده لا هو اغلبية ساحقة ولا بتاع ده كل الى فيه انضموا ليه بس علشان الكارنية و علشان لما اى حد يوقفك توريله الكارنية و تقوله انا وثنى يا باشا .. و كله شغال ... و غير كدة انت ماقولتليش انتوا عملتوا ايه فى التزوير ولا فى الصورة الى انا خدتها للمحامين بتوع الحزب الوتنى فى جلسة ابراهيم عيسى و هما حاطيين ايديهم على خدودهم من وكستهم .. لا وايه التلاتة صف واحد .. منظر تحفة ابقى ملى عينيك منه .. وفيه حاجات كتيييييير بس ربنا امر بالستر .. روح بقى شوفلك مكان تانى العب فيه .. قال ممثل الاغلبية الساحقة قال .. هو ممثل الاغلبية الساحقة فى عدد النصابين و الحرامية الى فيه .. بس خلاص ولا كلمة"
archived = "2008-08-18"
capture_url = "https://web.archive.org/web/20080818031927/http://masr.20at.com:80/newArticle.php?sid=17225"

