[[comments]]
order = 3
subject = "الاهلي فوق الجميع وطيران اسرائيل فوق الجميع"
author = "مش رضوى حسن ولا مروة صلاح"
posted = "2008-08-14"
text = "اسرائيل سابتلنا الكورة نلعب بيها ومسكت هيا في الحجات المهمة<br />سمعت النبي محمد صلى الله عليه وسلم بيقول في تفسير واعدوا لهم ما استطعتم من قوة) قال الا ان القوة الرمي<br />فتفوقت على العرب في (الرمي) وعملت سلاح طيران لا فيه زيه ولا حد اده سلاح طيران راح ضرب منظمة التحرير في تونس<br />تتصوروا ان طيران اسرائيل ضرب تونس يعني عدا مصر وليبيا وضرب تونس<br />وسابتلكم انتوا بأه الاهلي والخطيب ومصطفى عبده وابو تريكا<br />خليكوا نايمين واتفرجوا على ما تشات الاهلي والزمالك واللمبي وعادل امام ويسرا ومش مهم بأه اسرائيل والحجات التافة دي"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814132748/http://masr.20at.com:80/newArticle.php?sid=17225"

