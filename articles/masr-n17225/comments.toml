text = "والله يا اخت مش احمد الاحساس بالحرية شيء جميل<br />وانا موقع عشرينات وجدت فيه ضالتي<br />فيه حاجات في نفسي كانت كامنة طلعتها في عشرينات وموضوعات عشرينات بتيجي مظبوطة على احاسيسي ومشاعري<br />معلش سامحوني واستحملوني"
