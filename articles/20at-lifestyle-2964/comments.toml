subject = "هي ناقصةجنان"
text = "هوالموضوع ناقص جنان لما اجوز واحده تربيل العصبي في البيت وبعدين اضمن منين متعملش فيا وانا نايم او في العيال وغير التريق من ايحد ييعرف<br />والمصيبة الاكبر لو كان ليها بنت ازميلها في المدرسة هيقولها ايه ؟ يابنت المجنونة<br />ولما تيجي تتجوز مين هيرضي بيها<br />لايعم الله الغني ولا هومن قله السلام اخد العييانة"
