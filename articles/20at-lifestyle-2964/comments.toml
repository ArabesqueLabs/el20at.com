[[comments]]
order = 7
subject = "انت قلقتني"
author = "لولا"
text = "محمد انت قلقتني جداً لان خطيبي بالفعل بحس فيها بمشاكل نفسيه وانه بيدخل في صرعات وهميه كتير بسبب مشاكل من وجهه نظره هو واحساسة بالنقص ومحاولاته انه يثبت لكل اللي حوليه عكس كدا فبيبان انه مغرور ومتكبر نتيجة افعاله<br />ومش عارفه اعمل ايه هل استمر مع شخص زيه علي امل انه يتحسن ولا مشاكله النفسيه هتضغي علينا وتطفوا علي السطح وتدمر حياتنا"
archived = "2010-03-14"
capture_url = ""

