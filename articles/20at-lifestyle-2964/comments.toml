subject = "لسه عند موقفى"
author = "dero"
text = "موضوع بجد جديد ومهم يا محمد.. وعايز تفكير ..بس انا لسه على موقفى وحسمت الحكاية دى, انى هاحترم جدا للى بيتعالج نفسيا واعتقد ان كل واحد فينا مدام ساعات بيتعب عضويا يبقى بديهى ان الواحد ممكن يتعب نفسيا ..<br />وانا مقتنعة تماما ان لو خطيبى بيروح لدكتور نفسى هاروح معاه ..ومدام مرضه النفسى مش بيأثر على علاقتنا بعد كده او مش هايخليه اب و زوج متزن فا ليه لاء؟!؟!.. عادى جداااااااا"
