[[comments]]
order = 0
subject = "هو مش الدكتور النفسي زى دكتور الأسنان برضو ؟؟"
author = "محمد صلاح الدين"
posted = "2007-03-15"
text = "أنا بالفعل أتردد على طبيب نفسي ..<br />و بعد معاناة بينى و بين نفسي لإتخاذ هذا القرار و اللى بيرفضه كل الناس تقريبـًا،،<br />إلا من رحم ربى من العقلاء و المتفهمين و الراغبين فى مساعدتك بحق ..<br />و هو بيعالجنى - أو زى ما قالى - إن حالتى هى إكتئاب و هو نتيجة للإنطوائية<br />أما عن الإرتباط ..<br />ف أنا تكلمت معاه فى النقطة دية .. و إن كان فى بعض الأراء بتقول إن الإرتباط ها يساعدنى فى حالتى ..<br />لكن كان رأيى - و هو أييدنى فى الرأى دا - إنه يفضل التروى شوية لغاية لما أتحسن .. عاشان أقدر أختار بشكل أكثر وعى ..<br />و عاشان ما أظلمش من أختارها شريكة حياتى ..<br />أنا لا أخجل من الذهاب للدكتور النفسي ..<br />و لكن أخجل من وجود مشكلة .. لا أسعى لحلها ..<br />كما أن الألم النفسي لا داعى لتحمله ..<br />ربنا يخلي لينا الدكاترة النفسيين ..<br />بيساعدونا كتير .."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "إلى لولا"
author = "محمد صلاح الدين"
posted = "2007-03-15"
text = "إنه بيدخل فى صراعات و همية .. و مساحة خيال تؤثر على الواقعية .. و حاجات زى كدا ..<br />إنه فى إحساس بالنقص .. و بيحاول يعوضه بتصرفات تانية .. تظهره للأخرين بالغرور و التكبر<br />نفس الشيء عندى ..<br />و زى ما قرأت بعد كدا عن الإكتئاب .. إنه بيصاحبه مجموعة من الصفات .. يمكن دى منها ..<br />و الفيصل فى الموقف هنا ..<br />زى ما هو الفيصل معى ..<br />هو .. عنده رغبة فى التخلص من الصفات دى .. و عنده إستعداد للتحسن .. و لا العملية منسجمة معاه ..<br />لكن ماننساش .. إن أكتر إنسان فى الدنيا يحتاج للمساعدة .. هو من لا يستطيع أو يعرف أنه يحتاج للمساعدة ..<br />لكن كل شيء بقدر .."
archived = "2010-03-14"
capture_url = ""

