text = "انا ابغى افهم كل هالاهتمام بشباب السعودية وبنات السعودية مافية خطى الى الي تشوفونة في السعودية والفساد والخراب الي في بقية الدول صاير بسيط وعادي يااخوان اي دولة عربية او مسلمة المفروض ننتقد الاخطاء الي نراها فيها السعودية اوغيرها والحكاية نسبة وتناسب واذا كان المقصد طيب فالنصيحة للجميع والناس يختلفون في كل دول العالم فيهم الحسن وفيهم السيئ وليس معنى هذا ان نشن حملة على جنس معين وانما نقدم النصح والتوجية بصدق دون احقاد اوبحث عن الاخطاء لان كل ابن ادم خطاء وخير الخطاون التوابون مشارك سعودي"
