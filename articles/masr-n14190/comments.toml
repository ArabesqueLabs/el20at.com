[[comments]]
order = 0
subject = "اية الحكايةا"
author = "مش فاهم"
text = "شيخ الازهر لم يقل لنا انة على مدى الاربعة عشر قرنا منذ ظهور الاسلام - لم يذكر اسم امرأة تولت عقد القران او كتبت الكتاب لعريس وعروسة<br />دائما كان يقوم بهذا العمل القاضى الشرعى او ما اصطلح علية فى العصور الحديثة المأذون من القاضى الشرعى بعقد القران<br />يا عم الشيخ - اية السهولة او السبهللة فى الفتاوى دى<br />ربنا يديك الصحة ويطول فى عمرك وتعيش تفتى لنا لغاية ما توصل فى العمر 100 سنة"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195745/http://masr.20at.com:80/newArticle.php?sid=14190"

[[comments]]
order = 1
subject = "ربنا يرحمنا"
author = "نانا"
text = "عجبنى تعليق لبنت فى الثانويه على هذا الافتاء بتقول ، لايجوز للمراه ان تكون وليه لنفسها اى لابد من وجود ولى لها ده شرعا ، مادام الشيخ قال ينفع الماذون امراه تبقى هى ولية نفسها والرجل يولى امه وتبقى قعدة ستات فى ستات ، بجد الا مش قادره افهمه ازاى واحد زى ده كل يوم يطلع فتاوى كده وخلاص ، ومازال عايش ، اظن كلامى واضح الا زى ده عايز يفكك المجتمع<br />ويهدم الاسلام وقيمه ، ربنا يستر علينا"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195745/http://masr.20at.com:80/newArticle.php?sid=14190"
