[[comments]]
order = 2
subject = "هؤلاء هم الرصيد الحقيقي"
author = "أسامة"
text = "هؤلاء هم الرصيد الحقيقي لبلد صارت تتلقف رزقها ممن حولها ، وهؤلاء أيضا ً هم البوصلة الحقيقية لبلد ضاعت بوصلتها. أثلجت صدورنا يا دكتور جمال، وضربت لنا مثالا ً حيا ً على انسانية مهنة الطب، وعلى الكفاءة العلمية المصرية، وثق تماما ً بأن الله تعالى لا يضيع أجر من أحسن عملا ً في الدنيا قبل الآخرة بإذنه تعالى. شكرا ً لك ، وجزاك الله خيرا ً ، والشكر موصول لمعد هذا التقرير"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084743/http://masr.20at.com:80/newArticle.php?sid=14646"
