[[comments]]
order = 0
subject = "الحمد للة عندنا واحد ناصح بفضل توجيهات"
author = "اعلثturkish"
text = "بناء على توجيهات سيادتة واظهار الكفاءات الوطنية والعلمية والبحثية وتحت رعاية توجيهات السيد الرئيس نجح المواطن واصبح انسان يشار الية بالبنان<br />فتم اختيار مصرى من افضل 100 رجل فى العالم والفضل يعود لسيادتة"
archived = "2008-03-28"
capture_url = "https://web.archive.org/web/20080328084743/http://masr.20at.com:80/newArticle.php?sid=14646"

