[[comments]]
order = 0
subject = "ضرب الازواج"
author = "مصرى مضروب"
posted = "2007-11-06"
text = "الدكتور الباحث طيب اللة ثراة جاب احصائية بالنسوان المضروبات وقال انهم 35% طيب كم عدد الرجال المضروبين من الزوجات<br />انا مراتى اسمها الونش - خلينى كدة اتأخر برة البيت ساعة او ساعتين - وحياتك بتزغدنى زغدة تبلعنى روحى - وكلة تحت الحزام - وفى صمت ما عدا زغرة عينيها اللى تسم البدن<br />انما هنقول اية ايهى زوجة والسلام ومشى حالك وخف تعوم<br />بس ساعات بتبقى رقيقة ارق من ورق الورد ولطيفة ولا قطة مسالمة<br />وبردة فية ما بيننا مودة وحب وهى ام للعيال"
archived = "2007-11-08"
capture_url = "https://web.archive.org/web/20071108222934/http://masr.20at.com:80/newArticle.php?sid=12289"

[[comments]]
order = 1
subject = "نكتة قديمة قوى"
author = "ا هوة"
posted = "2007-11-06"
text = "كان احد الشيوخ بيخطب يوم الجمعة وبيتكلم عن العنف والضرب داخل الاسرة وفجأة سأل المصلين من على المنبر<br />اللى فيكم مراتة بتضربة يقوم يقف<br />فوقف كل الحاضرين فى الجامع الا واحد<br />فأشار الية الشيخ قائلا<br />انت بقى اللى غضنفر ومراتك ما بتضربكش<br />فقال الرجل الجالس<br />ابدا يا سيدنا الشيخ دا انا من كتر الضرب مش قادر اقوم"
archived = "2007-11-08"
capture_url = "https://web.archive.org/web/20071108222934/http://masr.20at.com:80/newArticle.php?sid=12289"
