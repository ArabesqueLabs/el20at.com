subject = "الزعيم"
author = "أحمد الترجمان"
posted = "2007-12-12"
text = "ان عادل امام يمثل الترمومتر لمشاعر الجماهير حديثه شيق لا تقاطعه لأن أذنك تستمتع بصوته و تسترجع أجمل لحظات<br />حياتك أثناء الفرجه على مسرحياته أو أفلامه يمتلك عبقريه فذه جعلته يظل على موجودا و متربعا على القمه لمدة 45 سنه<br />و افلامه في تطور مستمر ماعدا فيلم واحد (الواد محروس بتاع الوزير)كانت مغامره غير محسوبه بالمقارنه مع (الارهاب و الكباب)و الارهابي و يكفي عادل جمله واحده في يعقوبيان ليظل خالدا في تاريخ الفن وصف فيها اللحظه الراهنه من تاريخ الأمه قائلا (احنا في زمن المسخ)قالها باقتدار و من القلب و يستحق بكل الحب أن نقول له ربنا يخليك و تسعدنا كمان و كمان"
archived = "2007-12-13"
