text = "فعلا يابراء انا حضرت امبارح وشوفت العدد المهول ده \" بالنسبة للساقية \"وبصراحة المحاضرة تستحق الحضور كل من حضر خرج منبهر جدا ً بعرض الدكور طارق وطريقته فى الحوار وثقافته وأسلوبة فى الخطابة .."
