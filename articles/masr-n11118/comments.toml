[[comments]]
order = 0
subject = "ده حصل فعلااً"
author = "إبراهيم"
text = "هوا فعلاً ـ تقريبًا ـ ده حصل بحذافيره! ، بس المقارنة هنا مش متعادلة تقريبًا، بل و ظالمة لحد ما، أنا لا أدافع عن أحد الـ(جمهورين) ! ، لكن لا تنس أيضًا إنه لو كان وجيه عزيز كان هيبقى العدد (ممكن أكثر) !! ، وكذا لو عمر خيرت ( ده عشان ف الساقية يعني)، ولو عمرو أو تامر (براها) !!، ومن حقنا هنا نسأل أنهي أحسن ! لنعرف إن المسألة نسبية جدًا ، بس على فكرة المهرجان كان من الساعة 4، وجمهوره برضه ضعيف، وبعدين دي أفلام تسجيلية يا بيرو ، وتحياتي لوجودك"
archived = "2007-08-21"
capture_url = "https://web.archive.org/web/20070821145436/http://masr.20at.com:80/newArticle.php?sid=11118"

