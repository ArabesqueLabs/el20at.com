subject = "ضع عنوان التعليق"
author = "المجاهدة"
posted = "2007-06-19"
text = "للأسف حال الكثيرين في البلد دي... من أبناء الطبقة المكافحة بس عشان تعيش حياة شبه أدمية<br />اعرف للاسف حالات كده.. و لسه من اسبوعين او حاجة سامعة قصة عن رضيعة وقع البيت فوقها و ماكنش فيه غيرها في البيت عشان اهل البيت كلهم راحو يدوروا على لقمة عيش تأكلهم...<br />بس الحمد لله البنت دي البيت كله وقع عليها بس اقرب طوبة ليها من السقف كانت جمبها<br />سبحان الله انها طلعت سليمة :-)<br />ربنا يحفظ الجميع و يهدي الحال و المسؤولين يبتدو ياخدوا خطوات يساعدوا بيها الناس دي!"
