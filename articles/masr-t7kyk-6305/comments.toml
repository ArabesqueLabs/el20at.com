subject = "رائع جدا"
author = "قلمي الحر"
posted = "2007-06-17"
text = "السلام عليكم ورحمة الله<br />أولا : فكرة الموضوع واقعية جدا ورائعة وفيها رصد للواقع الذي تعاني منه أفراد مثل عم عيد<br />ثانيا : كتابة الموضوع تمتبكريقة جميلة ومعبرة وإن كان بعد إذنك تحتاج إلي ربط بسيط بين أجزاء المقال خاصة فيمايتعلق بفقرتين قرار الإزالة وأسرتين لكل شقة .<br />ثالثا : اهتمامك بمثل هذه الموضوع رائع جدا في ظل تهميش الحكومة لمثل هولاء المواطنين واغتيال أبسط حقوقهم في الحياة .....ربنا بجد يوفقكم ويكرمك ويساعدك على تقديم قصص إنسانية توقظ قلوب الناس من جديد ،والحكومة لو كانت لسه عايشة وعندها قلب"
