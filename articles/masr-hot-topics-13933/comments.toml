posted = "2009-11-10"
text = "[جمهورنا المصري الحبيب برجاء إتباع التعليمات الأتية:<br />السكوووول -لا لحضور المزز كفاية عليكم المكيف والعائلات ياريت مفيش بنت واحده تخش الاستاد واى طنط وعمو واولادهم يشوفوا الماتش فى بيوتهم - حيث إن التشجيع سيكون دامي.<br />الجمهور الجزائري الشقيق برجاء إتباع التعليمات الأتية:<br />1 - إن شاء الله بعد فوز مصر عليكم طلب حق اللجوء السياسي لمصر لتعذر عودتكم بعد مباراة 14نوفمبر.<br />2- لاقدر الله في حال التعادل أو هزيمة مصر فعليكم توفير منتخب بديل لمنتخبكم - عشان حتبقوا بلد المليون شهيد والمنتخب الفقيد.<br />3- ممنوع ضعاف القلب ومرضى السكر والضغط من الحضور حيث أنه سيكون أشبه بفيلم رعب.<br />4-بما أنكم تفتخرون بعدد الجمهور الجزائري الذي سيحضر من الجزائر و يشجع من الاستاد برجاء إعلامنابعددكم من أجل توفير اماكن في المستشفيات لمرضي القلب و السكر و الضغط حيث أنكم سترون ما لم ترونه طوال حياتكم وسيكون يوم تاريخي لكم في المباراة و في المدرجات و خارج الاستاد<br />5- اللي يخــــــــــــــــــــــــــــــاف يطلع برة.<br />6-سيكون أستاد القاهرة مقبرة لكل جزائرى فى مصر"
