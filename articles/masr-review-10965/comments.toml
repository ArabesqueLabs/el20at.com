[[comments]]
order = 4
subject = "دائما مصر اولا - -  - - امجاد يا عرب امجاد  -----"
posted = "2009-01-16"
text = "دائما مصر اولا<br />مبادرة اية<br />لازم نشيل مبادرة اسرائيلية وامريكية با اسم مصر<br />خللونا فى حالنا<br />عايزين مبادرة لرغيف العيش<br />ومبادرة لانابيب البوتاجاز<br />ومبادرة للبطالة<br />ومبادرة للفساد<br />ومبادرة للعشوائيات<br />امجاد يا عرب امجاد<br />والنبى حال اهل غزة تحت الحصار والحرب احسن من حالنا<br />السيد الرئيس قال من شهرين<br />دائما مصر اولا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "أيه ده .. هو لسة فيه حد بيتفرج على التليفزيون أساس"
author = "محمد جمال الدين"
posted = "2009-01-16"
text = "أ / دعاء<br />من الاساس مافيش حد بقى بيتفرج على التليفزيون اللا مصرى ده غير علشان برنامج البيت بيتك و مش علشان تامر بتاع ده .. ده علشان محمود سعد .. الى أتعمل عليه هجوم مخصوص من روز اليوسف بتاعة الحكومة علشان حاول يفهم و يتحقق من مدى مصداقية النبأ بتاع ان حماس مانعة الحجاج . و تامر بتاع ده .. أتعرف خلاص وبقى ورقة محروقة انه بتاع الحكومة و الكلام الى هيقولوا بيجيلوا فى ورقة قبل البرنامج زى خطب الجمعة كدة<br />للأسف .. ماعادش عندنا اعلاميين يحترمون أصول مهنتهم ولا يرضخون لأى جهة تريد تزييف الحقائق وتغييب الوعى<br />ألا القليل جداً من أمثال محمود سعد .. الى مواقفه تشهد له بالرجولة و بمراعاة و فهم ما يتوجب عليه فعله كأعلامى شريف<br />اعلامى شريف .. مايرضاش بالتزييف .. لا بيقول أنا أحبه ... ولا عايز ماكدونالدز فى رغيف<br />وده حال التأليف .. كل يقولك التكتيف .. و الرغيف .. والعيال عايزة تكييف<br />وبدون تكليف .. لو اعلامى قال أنا نضيف .. يقولوا عليه .. كان عايز ياكل بلوبيف<br />شريف .. نضيف .. عفيف ... يبقى أقلب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "البرنامج صح الصح"
author = "محمد جمال الدين"
posted = "2009-01-16"
text = "البرنامج بيقدم اسلوب رأيى الشخصى فيه انه جااامد جداً .. لأن زى ما حضرتك قولتى اننا مش بنخلى اطفالنا تشوف المناظر دى<br />و أعتقد لذلك السبب الجيل ده طالع فرفور زيادة عن اللزوم .. هههههههههههههههههههه<br />بس رايى ان لازم الطفل يتعرض للمواقف و المشاهد دى .. على الاقل علشان ما نشوفش صف تانى من الاتجاهات المختلفة و الكتيرة الى بتقول ان اسرائيل من حقها ان تعيش على ارض فلسطين .. ومن حقها انها تتقاسم المسجد الاقصى ... يعنى من الاخر ما يبقاش الاطفال عقولهم تعبانة .. فلازم يتكون عندهم خلفية عن الى بيحصل دلوقتى<br />مع مراعاة الاعمار طبعاً .. او ممكن القنوات تخصص ساعة يومياص لعرض تاريخ فلسطين و الاحتلال جه ازاى و ايه الى حصل ومين تصدى له و خسرنا ازاى .. والتفاصيل دى كلها .. لأن هناك قوى بتغيرها من الوقت للتانى عن طريق التشكيك<br />وأحنا دلوقتى نلاقى ناس كتير بتقول واحنا مالنا .. وهما الى جابوه بنفسهم وماسمعوش كلام السادات .. و دول خونة وكلهم عملاء .. بالأضافة الى .. دول كلهم اغنياء .... فمش عارف عقبال ما الاطفال دى تكبر هتكون الالة الاعلامية الصهيونية قدرت ترسخ أيه تانى فى عقول الناس الى بدورهم بيورثوه لولادهم"
archived = "2010-03-14"
capture_url = ""

