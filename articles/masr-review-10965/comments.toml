subject = "من يتفرج على تلك القنوات المتخلفة ؟"
posted = "2009-01-16"
text = "ازاى يا ست دعاء تتفرجى على القنوات دى - دى بتجيب التخلف والزهايمر بدرى قوى<br />انا احيانا لما احب اتفرج على عالم الحيوان با احب اشوف مجدى الدقاق وواحد بتاع علوم سياسية اسمة مش عارف اية جهاد فى جامعة قناة السويس بيتكلموا فى السياسة - وتكمل بواحد اسمة مش عارف اية الفقى فى مجلس الشعب<br />فية فى الدش 400 قناة على كل لون يا باتستة<br />ابعدى عن قنوات التخلف العقلى"
