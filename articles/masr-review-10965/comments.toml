subject = "الخبير العسكرى - تخصص جرى - بشر فى تلك القنوات - ا"
posted = "2009-01-16"
text = "الخبير العسكرى توتو - طلع على احد تلك القنوات - وقال حماس مين ؟<br />دول شوية عيال بدقون ومش فاهمين حاجة واسرائيل هتخش القطاع فى 6 ساعات وهيجيبوا هنية دة من قفاة ويحطوة فى قفص فى تل ابيب<br />ونمت<br />وصحيت تانى يوم وخفت افتح التليفزيون لا اشوف اسرائيل فى وسط غزة<br />وبعدين الظهر<br />بعدها ب 20 يوم لقيت الحرب لسة شغالة ومات الف وميت فلسطينى يعنى باقى 200 ويبقى العدد زى ضحايا العبارة"
