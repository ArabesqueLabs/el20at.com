subject = "الاعلام المصرى - اعلام فاشل"
author = "متابع"
posted = "2009-01-15"
text = "احاول ان اعرف القنوات التى يتابعها الناس البسطاء<br />للاسف قناة الجزيرة والمنار وقناة الناس هى ما يتابعة الناس لمعرفة الاخبار<br />للاسف لا احد يتابع القنوات المصرية ولا حتى العاملين فى مبنى التليفزيون المصرى<br />احسن حاجة يقفلوها ويروحوا يروحوا او يبيعوها لمثتثمر رئيسى"
