subject = "والفلوجة بتاعة العراق اللي امريكا مسحتها من على ال"
author = "مش ححبك"
posted = "2009-01-16"
text = "اهل السنة في العراق شاربين من كعانهم يا جماعة زي اهل غزه كده<br />وكان فيه بلد اسمها الفللوجة امريكا حاصرتها واقتحمتها وذبح اهلها كالنعاج<br />ومازال اهل السنة في العراق ويلهم ويلين من الاحتلال الامريكي وسفلة الشيعة<br />ممكن نجيب اطفالهم على التلفويون"
