order = 0
subject = "شكرا  لسعادة حامد راشد مساعد وزير الداخلية للشئون"
author = "مش ححبك"
posted = "2008-12-30"
text = "والمشكلة يا سيادة اللواء تبدأ من حصول الطلاب على الثانوية العامة<br />ليه العيال دول بيجروا على كلية الشرطة<br />لاسباب غير شرطية وغير امنية<br />بيجروا على كلية الشرطة علشان خاطر ـ كما سمعت من احدهم ـ (ياخدوا حقهم في البلد الوسخة دي)<br />فلازم كلية الشرطة وارجو ان تعود الى كلية الشرطة (وليس اكاديمية مبارك للامن) ان تعلم الطلاب ان ضابط الشرطة مكلف بخدمة المواطن ومكلف بحل مشاكل المواطن<br />وشكرا"
archived = "2008-12-30"
capture_url = "https://web.archive.org/web/20081230151749/http://masr.20at.com:80/newArticle.php?sid=19027"
