subject = "الا نضباط فى ادارة المدرسة والتزام هيئة التدريس"
author = "لا لا لا لا لا لا"
posted = "2008-09-18"
text = "من اين يأتى فساد التعليم فى مصر - هل هى المقررات الدراسية - الطلبة - المدرسون<br />المشكلة كلها فى ادارة الهيئة التدريسية بالمدرسة<br />تسيب فى ادارة المدارس - مدرس لا يدخل الحصة - ناظر غير كفء - مدرسات قاعدين يقمعوا البامية ويقشروا بطاطس والطلبة بيهيصوا فى الفصول<br />المفروض ن تتشدد الادارة المدرسية البايظة مع المدرسين والناظر يكون شخصية قوية ترهب اى مدرس مستهتر<br />والمدرس يشرح فى الحصة بما يرضى اللة والناظر ووكيل المدرسة يراقبة والفاشل يسيب المدرسة ويشوف وظيفة تانية<br />تسيب الهيئة التدريسية فى المدارس هى المشكلة"
