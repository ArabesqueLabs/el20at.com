[[comments]]
order = 1
subject = "كنت عارفه"
author = "محمود صبري"
text = "علي غرار اغنية شيرين المعروفة (كنت عارفة) اكتب هذا التعليق<br />لكن كنت عارف<br />ان الميعاد سوف يتم مده الي وقت لاحق لهذا لم ابعث بانتاجي من اجل هذه المسابقة حتي انفذ ما قررته بان ابعث في اخر وقت للمسابقة<br />ولي تعليق بسيط علي تعليق الانسة بسمة<br />شكرا ليه بقي؟"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420052616/http://masr.20at.com:80/newArticle.php?sid=15183"

[[comments]]
order = 2
subject = "انتي فين؟"
author = "محمود صبري"
text = "فين الاسم مصرية؟<br />ده الاسم اللي دخلت بيه انسة مش عارف اسمها<br />بس هي اللي كانت بترد علي كل تعليقاتي علي طول<br />ممكن لو حد يعرف هي مين يوصلها سلامي"
archived = "2008-04-20"
capture_url = "https://web.archive.org/web/20080420052616/http://masr.20at.com:80/newArticle.php?sid=15183"
