[[comments]]
order = 4
subject = "ياعم محمود"
author = "الاسم مصريه"
posted = "2008-04-28"
text = "ايوه يامحمود<br />وصلنى سلامك وميرسى ليك وعلى فكره<br />بسمه والاسم مصريه ---> الاتنين واحد<br />وبقول شكرا على مد الفتره<br />علشان كنت عايزه ابعت تحقيق غير مقال الرأى اللى مش عاجب عشرينات<br />الا قولى ياحوده هو مفيش غيرنا مشتركين فى المسابقه؟"
archived = "2010-03-14"
capture_url = ""

