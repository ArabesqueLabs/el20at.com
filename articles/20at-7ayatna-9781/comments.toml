subject = "قال توك توك قال"
author = "محمد نواف"
posted = "2008-09-09"
text = "هاذ اللي فلحتو فيه .. إنكو تطلعو أفلام بدل ما إنتو قاعدين ماكلين خرا وهوا من اليهود .. والله عالم فايقه ورايقه ..<br />ع العموم .. انا ما بتمصخر عليكو .. لأنو المصخره أحسن منكووووووو ..روحوا شوفو شعبكو ماكل خرا .. وأنتو قاعدين هونه .. توك توك ومابعرف شو ؟؟؟<br />تحياتي ،،،"
