text = "\"اجتمعت الجهود، وتضافرت الخبرات، وتوجَّهت النيَّات المخلصة -بإذن الله تعالى&--1648;- لتدشين موقع (الإمام العلامة) ليلة السابع والعشرين من رجب ، وهو يعد أول موقع على الإنترنت يُمثل مدرسة مميزة فريدة ذات فكر راقٍ،"
