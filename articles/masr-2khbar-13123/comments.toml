author = "الدويقه وابو هشيما"
posted = "2009-08-31"
text = "زفاف هيفاء وهبي<br />أقيم في بيروت الجمعة الماضية حفل ضخم، غداة عقد قران<br />الفنانة الساحرة اللبنانية هيفاء وهبي (35 عاما)، التي أسر<br />جمالها آلاف المعجبين في العالم العربي. وأكدت مسئولة في<br />المكتب الإعلامي لهيفاء أن عقد القران تم الخميس الماضي.<br />وكانت مصادر لبنانية قد كشفت عن أن زوج وهبي هو رجل<br />الأعمال المصري أحمد أبو هشيمه.<br />وهكذا كان عرس هيفاء الذي شغل الناس في بيروت وبات<br />حديث الصالونات، وكثرت التكهنات حول الترتيبات، وأسماء<br />المدعوين، وتكلفة السهرة، وغيرها من التفاصيل."
archived = "2010-03-14"
capture_url = ""

