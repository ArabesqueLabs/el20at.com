author = "احمد عز مهر 25 مليون"
posted = "2009-08-31"
text = "صحيفة: أحمد عز يتزوج شايهناز النجار والمهر 25 مليون جنيه<br />حفظاطبعأضف تعليق ارسل11/1/2007 9:51:00 PM<br />تحدثت تقارير صحفية عن اقتراب عقد قران أحمد عز علي عضوة مجلس الشعب شاهيناز النجار حيث قدمت جريدة الدستور بعض التفاصيل عنه.<br />وكشف مقربون من المهندس أحمد عز أمين التنظيم في الحزب الوطني ورئيس لجنة الخطة والموازنة في مجلس الشعب ونائبة البرلمان المنتخبة عن دائرة المنيل ومصر القديمة في القاهرة وسيدة الأعمال شاهيناز النجار أمين سر لجنة السياحة والثقافة والإعلام عن اقترابهما من الإعلان عن خبر زواجهما وهو ما احتل صدارة اهتمامات النواب من الأغلبية والمعارضة في البرلمان.<br />ووصف بعض البرلمانيين هذا الخبر بالقنبلة الكبري مع بداية الموسم البرلماني الجديد، ويعتبر هذا الزواج في حالة إتمامه واقعة أول زواج بين نائب ونائبة من البرلمان في تاريخ الحياة النيابية المصرية وأن بداية التعارف القوي بين عز وشاهيناز كانت منذ نحو أربعة أشهر تقريبا حيث توطدت العلاقة بينهما وكانت تسبقها روايات حول علاقة أحمد عز مع إحدي الفنانات وهي فنانة رقيقة المشاعر.."
archived = "2010-03-14"
