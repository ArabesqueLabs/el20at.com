[[comments]]
order = 1
subject = "كلمة المحظورة - كلمة قبيحة"
author = "اى واحد كان"
posted = "2008-03-12"
text = "واحد يقول لك انا محظور - ودى بالعامية المصرية انة لا مؤاخذة مزنوق وعايز يخش الحمام والا هيعملها على نفسة<br />وصحف الاسرة الحاكمة تطلق على جماعة الاخوان الجماعة المحظورة - محظورة فى اية - عايزة تدخل الحمام مثلا<br />وازاى الصحف القومية او صحف اسرة مبارك حيث يظهر الاب فى اول صفحة دائما اما الابن ففى الصفحة الثالثة وتاتى سيدة مصر فى الصفحة الرابعة قبل صفحات الاجتماعيات والوفيات - ازاى الصحف دى تسميها المحظورة ولهم فى مجلس الكلام 80 عضو ينطح عضو وكلهم والحمد للة السنة زى الكرباج<br />هى الحكاية اية - انا مش فاهم حاجة فى البلد دى<br />كل يوم اعتقالات وكل يوم افراجات<br />ومصادرة اجهزة كمبيوتر محمول<br />وسيبنا مصالح الناس واكل عيش الناس ورغيف الخبز وبقينا سباقين فى الاعتقالات ونتصدر صحف العالم فى اخبار الاعتقالات والمحاكمات العسكرية<br />يا عالم يا زبالة انسوا حكاية الاخوان وابذلوا جهدا فى توفير لقمة الخبز للشعب الجائع"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003156/http://masr.20at.com:80/newArticle.php?sid=14640"

