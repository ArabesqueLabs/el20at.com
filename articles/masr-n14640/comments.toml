[[comments]]
order = 4
subject = "منهى التناقض"
author = "محمد ميدو"
posted = "2008-03-12"
text = "لو بعدنا عن إننا ندخل الدين فى كل كبيرة و صغيرة البلد دى هتتصلح ..<br />اللى جايبنا لورا إننا كل حاجة بندخل فيها الدين ..<br />تلاقى ناس بطلت تتعامل مع البنوك علشان الشيوخ بيقولوا إنها حرام رغم إنها بتسبب منافع كتير للناس و ينسوا إنهم كده بيخالفوا القاعدة الفقهية اللى بتقول لا ضرر ولا ضرار ..<br />و قيس بقى مليون ألف حاجة على الكلام ده ..<br />مسخرة و الله إن كل واحد يفتى و يقول اللى على مزاجه .. و المسخرة الأكبر إن الشيوخ اللى طلعت البدعة دى ليهم حسابات فى البنوك و بيقبضوا بالفيزا كارد !!<br />يعنى يكون الشيخ من دول لسة قابض مرتبه حالا من البنك و كل شوية يضيف لرصيده اللى فى البنك و يطلع تانى يوم يقولك البنوك حرام !!!!!!!! منتهى التناقض ..<br />الكلام ده أنا شفته بنفسى أثناء عملى فى إحدى القنوات الفضائية اللى بتسمى نفسها قنوات إسلامية قبل ما أسيب الشغل بسبب إن الناس بتوع القناة مش راضيين يدونا مرتباتنا و فلوسنا و قالولنا من الآخر مالكوش حاجة عندنا و للأسف كلهم شيوخ بلا إستثناء !!"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003156/http://masr.20at.com:80/newArticle.php?sid=14640"

[[comments]]
order = 5
subject = "الاخوان في قلب الشعب ... والحزب الوطني هو المحظور"
author = "محمد الديري"
posted = "2008-03-13"
text = "الاخوان نسبة نجاح مرشحيهم في انتخابات مجلس الشعب 70% والحزب الوطني 35% يبقى مين المحظور...ده غير ان اغلب بتوع الحزب الوطني فازو بالتزوير العلني والله العظيم التزوير العلني!!!!!......كفاية حرام الشعب بيموت....انزل اي شارع او اي حارة وشوف الناس عاوزة الاخوان ولا الحزب الوطني .........شوف ...واسمع دعاء الفقراء والعواجيز والستات ..اللي بتقول ربنا يخدك يا مبارك وياخدك يا حكومة.......كفااااااااااااااااااااااااية"
archived = "2008-03-16"
capture_url = "https://web.archive.org/web/20080316003156/http://masr.20at.com:80/newArticle.php?sid=14640"
