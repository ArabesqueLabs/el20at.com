[[comments]]
order = 5
subject = "زقزوق المخرف"
author = "زهقان"
posted = "2007-06-27"
text = "انه من حق مباحث أمن الدولة هدم المساجد إذا انحرفت عن الصراط المستقيم واللي عاوز يبقى شيخ الأزهر يوريني.. أهلا أهلا ..أيها السادة . ولا نعرف ما هذه التصريحات المتلاحقة بشأن هدم المساجد وهي تصريحات لا نحملها محمل البراءة . .. والتي تعني ان القوم ..ناويين على نية سوداء تجاه بيوت الله .. ومن هنا نقول لشيخ الازهر ولزقزوق .. من يمد يده على أي مسجد يريد لها هدما سنقطعها له كائنا من كان .... ولن نبالي بموت أو قتل .. فنحن متنا من زمن بعيد ... ومجرد دخول القبر تحصيل حاصل . وما نعيشه اليوم أسوأ من الموت .. أن تهدم مساجدنا .. أمام أعيننا .. ونسكت ..فلم نتحول الى نساء بعد . وعليه ان كان طنطاوي يمرر هذا التصريح .. اعتماد على عزة فرعون قائلا بعزة فرعون .. {فَأَلْقَوْا حِبَالَهُمْ وَعِصِيَّهُمْ وَقَالُوا بِعِزَّةِ فِرْعَوْنَ إِنَّا لَنَحْنُ الْغَالِبُونَ }الشعراء44 أو يبغي عند أمن الدولة العزة .. {الَّذِينَ يَتَّخِذُونَ الْكَافِرِينَ أَوْلِيَاء مِن دُونِ الْمُؤْمِنِينَ أَيَبْتَغُونَ عِندَهُمُ الْعِزَّةَ فَإِنَّ العِزَّةَ لِلّهِ جَمِيعاً }النساء139 إلا أننا نقول .. ان العزة .لله جميعا .. ولله العزة ولرسوله وللمؤمنين . { وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَكِنَّ الْمُنَافِقِينَ لَا يَعْلَمُونَ }المنافقون8 .. نحن لا نخاف إلا الله ..وليلململوا حبالهم وعصيهم وعزة فرعونهم والملأ .. وليكن هذا الشعب واعيا للمؤامرة ولا يمررها الا على جثته .. والله ما بالينا ذبحا وهاقد جاء الدور .. لنقدم أنفسنا قرابينا لله .. ولا أن تهز أو تهدم طوبة من بيوت الله من موضعها . .. لقد تاقت أنفسنا للقاء الله.. ووجه الله الكريم .. تاقت أنفسنا للقاء محمدا وصحبة .. وكراهية للنظر في وجوه اللئام و أهل الردة والنفاق المتواجدة على الساحة الآن .."
archived = "2010-03-14"
capture_url = ""

