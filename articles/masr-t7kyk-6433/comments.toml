[[comments]]
order = 0
subject = "هيه نقصاك يا زقزوق"
author = "قرفان"
posted = "2007-06-25"
text = "بكفايه فلوس اوقاف المسلمين اللى مضمومه لميزانيه الدوله وبيشفطوا منها الوزراء لمكافات وحفلات وكباب ! وبعدين انشاء المساجد يخضع للعماره الاسلاميه وعلمائها هم فقط لهم الحق ان يكون رايهم الاساسى ! اما انت فقط لتكون حارسا على اموال الاوقاف وكيفيه صرفها فيما اراد المسلمين ! وعلى اقسام العماره الاسلاميه بالجامعات المصريه ان تخرج بتصريح يطالب بايقافك عن تصريحاتك الرعناء التى تطلقها من جهل ! وانا مسلم عادى عندما اذهب لاى مدينه فى مصر واريد الذهاب الى مسجد انظر الى السماء لاتبين مئذنه قريبه فاذهب الى المسجد ! فهل فهمت ايضا ماذى تعنى المئذنه؟"
archived = "2010-03-14"
