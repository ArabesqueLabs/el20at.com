[[comments]]
order = 2
subject = "الجل أهو إشتكى من شعره"
author = "موسى"
posted = "2007-06-25"
text = "معذور الوزير يا إخوانا لازم نوفر عشان الجل (( على فكرة احلى وزير بيحط جل ))<br />وزير ملزق كل مستشاريه من أمن الدولة ، وإسمه وزير الأوقاف أى أوقاف الله<br />يرحم تخيلوا المنصب ده كان يشغله الشعراوى ، لكن العيب مش عليه العيب على<br />اللى عينه وعين طنطاوى (( مأذون الفنانين)) وقال إيه الإمام الأكبر ، هى مصر<br />خربت من قليل ، والله البلد دى هتنهار ولو إنهارت لن تقوم لها قائمة ، أنا مش عارف<br />الناس ساكتة ليه ، باعوا البلد والدين والعرض ومابقاش فيه حاجة خلاص يتخاف عليها<br />صدق اللى بيقوله العرب علينا ، شعب تجمعه طبلة ، وتفرقه عصاية."
archived = "2010-03-14"
capture_url = ""

