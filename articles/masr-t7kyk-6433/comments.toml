text = "استنى بس قبل ماترمى القنبلة وتجرى<br />بتقول اعلنت مصادر اية ؟؟<br />مصادر فى وزارة الاوقاف ؟؟؟؟؟؟؟؟؟<br />يعنى اية<br />اية هوا مصدرك ولا كلام فاض عاوز تولع بية الدنيا وخلاص<br />ياجماعة اتقوا ربنا بقى انتم مسلمين انتم"
