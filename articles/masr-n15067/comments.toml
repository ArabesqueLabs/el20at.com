order = 2
subject = "إضراب يوم 4 مايو ، إنشاء الله يكون أخر عيد ميلاد"
author = "islam"
posted = "2008-04-08"
text = "ثورة ضد نظام مبارك الفاسد<br />إن من أهم تداعيات إضراب 6 أبريل هو إدراكنا بأن هذا الشعب لم يمت بعد وأن بجعبته الكثير لم يقدمه وأن بإستطاعته أن يعود مرة أخرة ليجتمع على هدف واحد وهو التخلص من النظام الفاسد المستبد الذى يحكمنا منذ ثلاثة عقود من الزمان<br />إضراب يوم 4 مايو ، إنشاء الله يكون أخر عيد ميلاد<br />أهم حاجة يا جماعة فى إضراب يوم 4 مايو أنه يحمل رسالة لرأس النظام نفسه و إن إحنا لم نختره مطلقا ً وأنه هو سبب الأزمات التى يمر بها الوطن - الغلاء ، الإحتكار ، الفساد ، عبارات غارقة ، عمارات منهارة ، غذاء فاسد ومسرطن ، التعليم فاشل راسب فى جميع المواد خلانا فى قاع الأمم ، الصحة مريضة مفرفرة والأرواح صعدت لبارئها ، الأمن لحماية النظام وبس ، محليات فاسدة كلها سرقة وتهليب ، وزارات تحمل أوزارها وأوزارنا إلى يوم الدين ، وزارة الداخلية باطشة ، وزارة الخارجية مطبعة عميلة منبطحة ، وزارة الزراعة فاسدة ومفسدة ، وزارة الصناعة أيام ما كان فيه صناعة وطنية بجد للأسف - وزارة خربة ، وزارة البترول والتعدين كلها سماسرة ومهلباتية وقومسيونجية سربت كل خير البلد مدعما ً للصهاينة ، وزارة العدل منقوصة العدالة ، وزارة المالية شفطت كل ما ليا فى البلد ، وزارة الإسكان سكنت الناس فى عشش ومقابر ، وزارة التخطيط خططت كويس لنهب وشفط ثروات البلد ، وزارة ( التضامن الإجتماعى ) التأمينات الإجتماعية أمنت مستقبل جمال مبارك فقط ، وزارة القوى العاملة والعمل عملت كل ما بوسعها لطرد شباب مصر بره مصر ، وزارة السياحة سايحة على حل شعرها ، وزارة الإستثمار قطفت كل ثمار البلد ورمته فى حجر علاء مبارك ، وزارة الإعلام ربنا عالم بحالها من سرقة و رشوة وتكميم الأفواه ونفاق وكوسة وواسطة وإسألوا عن العائلات فى ماسبيرو عائلة شلبى ( سهير شلبى ، أحلام شلبى ) وعائلة بسيونى ( أمين بسيونى ، علاء بسيونى ، تامر بسيونى ) وعائلة الزمر ( فريدة الزمر ، فايز الزمر ) وعائلة الأتربى ( سامية الأتربى ، سهير الأتربى ) كل دول عائلات فى ماسبيرو ، وزارة الثقافة تطبق الآيه \" وإقتلوهم حيث ثقفتموهم \" طبعا ده بالنسبة لأعضاء حركة كفاية ، وزارة الأوقاف ربنا يوقف حالها نهبت أراضينا كلها ده غير نهب حصيلة النذور فى مساجدها الصوفية ، وزارة النقل والمواصلات طبعا متخصصة فى نقل جثث شهداء الطرق وتوصيلهم إلى ذويهم ، وزارة الإتصالات تخصصت فى الدعم الفنى لشبكات الإنترنت وشبكات المحمول لمساعدة جهاز أمن الدولة لمعرفة فيما يتحدث المواطنون ثم الإتصال بهم جنسيا ً عند التقاءهم فى أقسام الشرطة ، وزارة التربية والتعليم تخصصت فى تربية الطفل المصرى على حب آل مبارك ، مجلس الشعب والشورى عشان التهليب والتصفيق ، والحزب الحاكم حزب فاشى فاشل حتى تأشيرة الحج بيتربحوا من وراها إيه الناس الكفرة دى ..... إلخ<br />وإن تعدوا مصائب النظام لن تحصوها<br />يا جماعة الإضراب ده مهم جدا للضغط على النظام من قوى خارجية زى ما تشوف واحد جارك مكفر أهله معاه بخيل مع مراته وأولاده لازم ولاده يحجروا عليه وياخدوا حقوقهم بالقوة طبعا الجيران مش هيساندوه أضعف الإيمان هينصحوه ويقولوا له لازم تراعى الناس اللى فى رقبتك دى ، أو واحدة كفرانة مع زوجها وأخر ما زهقت تروح تخلعه وتفضحه فى الشارع والجيران وأهله والمجتمع والمحاكم ، أهو إحنا كفرانين من زمان وعايزين نخلعه<br />وطبعا موقع الفيس بوك ده أكبر دليل على رأى الناس فى النظام الفاسد المستبد لأن لا هو القناة الأولى ولا التانية ولا جريدة الأهرام ولا الأخبار ولا الجمهورية ولا المساء ولا الصحيفة الغراء فى النفاق ولعق أحذية النظام ( روزاليوسف ) يعنى الموقع ده فيه ديمقراطية بجد مش ديمقراطية الفكر الجديد اللى هيقضى على ما تبقى من الوطن وهو فعلا بيعبر عننا إحنا يعنى إحنا لا حزب وثنى ولا غيره ولا جماعة محظورة ولا غيرها<br />إحنا كلنا ولاد البلد دى وعايزينها أحسن من كده عايزينها ترجع أحسن وأحسن مما كانت عليه قبل الحرامية والأونطاجية يمسكوا زمام أمورها ويخلوها فى ذيل قائمة الأمم<br />ملحوظة :<br />هناك تشابه بين مناخ البلد دلوقت ومناخ البلد ما قبل الثورة وأيضا ما قبل النكسة وأيضا ما قبل مقتل السادات يعنى النظام فى مصر لازم يتغير بكارثة .. للأسف<br />وطبعا لازم يكون هناك ضحايا أو من يدفع الثمن<br />بس الجديد فى الموضوع أن مناخ ما قبل الثورة كان فيه فقر وظلم طبعا ، بس كان فيه ديمقراطية<br />ومناخ ما قبل النكسة كان إستبداد ومعتقلات ، لكن كان فى تعليم وصحة وصناعة<br />ومناخ ما قبل مقتل السادات كان برضه ظلم وإستبداد ، لكن كان فيه إنتصار أكتوبر وكان فى ثروات قومية<br />أما المناخ السائد فحدث ولا حرج ، طبعا مفيش عدل ولا ثروات قومية ولا تعليم ولا صحة ولا صناعة وطنية ولا صناعة خالص أساسا ولا أية إنتصارات سوى إنتصارات منتخب حسن شحاته<br />للأسف الموجود دلوقت هو كل موبقات الزمن الفائت بالإضافة طبعا ًإلى التوريث<br />فلتكن الثورة ضد الظلم ، أو أضعف الإيمان كلمة حق فى وجه سلطان جائر"
archived = "2008-04-11"
capture_url = "https://web.archive.org/web/20080411220741/http://masr.20at.com:80/newArticle.php?sid=15067"

[[comments]]
order = 3
subject = "مصري"
author = "مصري أصيل"
posted = "2008-04-12"
text = "عن الدكتور محمد جمال حشمت - من الاخوان<br />حراك الشعب المصرى فى 6 ابريل لايمكن لأى عاقل أن يتجاهله من حيث الفكرة والإعداد والتنفيذ والأثار المترتبة عليه أما من حيث الفكرة فالجميع يأس من حراك قوى المعارضة بكافة فصائلها المفضى لإصلاح أو تغيير حقيقى فى مصر وقد فطن لذلك المستشار طارق البشرى حكيم مصر منذ أكثر من عامين وقال فى كتيب له \"أدعوكم للعصيان\" وهو يعلم أن الأمر يحتاج ثقافة جديدة وشعور جديد وتخلص من آفات كثيرة تحول بين الشعب المصرى والعصيان بنجاح وهو للحقيقة ما يستشعره كل مخلص يحب مصر ولكن الصعوبة كانت فى السؤال كيف؟<br />دعونا الآن من التنظير لكن الواقع الذى حدث هو أن الشعب المصرى فاض به من فجور وتعسف وإجرام الحزب الوطنى الحاكم فى التعامل مع الشعب المصرى معتقدا أن هيبة النظام لابد وأن تكون على جثث كرامة المصريين وحقوقهم !! وكذلك لضعف وتردى الأداء الحكومى الذى أعلن فشله رئيس الحزب الوطنى عندما لجأ للجيش وهو ما كان ينبغى عليه وقتها إقالة الوزارة فورا لا تركهم وهم يعانون من الفشل والغيظ ليخرج كل ذلك على دماغ الشعب المصرى !<br />لكن لأنهم شركاء العائلة وناهبى مصر ومازالت مشروعاتهم للإستيلاء على مصر لم تكتمل فقد استمروا فى أداء أدوارهم الفاشلة والخطيرة على مستقبل مصر !! ومن حيث الإعداد ظن الداعين للإضراب أن أحزاب تقتات من الحزب الوطنى وتحيا على دعمه لها وقوى شعبية لها مؤسساتها سوف تشارك بمجرد تحديد اليوم ! وهو ما ثبت صعوبته – وهو ما يتكرر اليوم بالدعوة ليوم 4 مايو القادم – ورغم ذلك شارك الغاضبين من النظام من كل فئات الشعب وأغلبهم لا ينتمون الى تنظيمات – ولاشك أن غياب الرأس يضعف أى عمل – فالحالة التى أوصلنا لها هذا النظام الفاسد الظالم المستبد حالة يرثى لها على أيدى فئات ترغد فى العيش بلا أدنى إحساس بالحرمان الذى يعيش فيه الشعب !!<br />ورغم كل ذلك فقد شارك الكثيرين ممن ينتمون الى تنظيمات مدنية أو شعبية فقد رفضت أسرتى مثلا الزوجة والأولاد الذهاب للأعمال والكليات بل طورد أحدهم للقبض عليه عند بدء الوقفة التى لم تتم فى وسط البلد بمجرد أن لمحوه ! وفى القاهرة فشلت فى الوصول لنقابة المحامين واستطلعت الأمر فكانت تلك هى الآثار:<br />نجح الإضراب فى إظهار الغضب الذى تتجاهله الحكومة ووسائل إعلامها الفاجرة التى وجب مقاطعتها اليوم قبل الغد وفشلت الحكومة عندما استنفرت كافة قواها الأمنية التى تخاطب بها الشعب منذ عشرات السنين ! ورغم أن الإضراب عمل سلمى سياسى كان يجب على الحزب الوطنى الفاقد للشرعية الشعبية أن يواجهه ويقتصر دور الأمن على الحماية والتأمين فامتلأت الشوارع والميادين خوفا وحذرا وهو ما يثبت نجاح الإضراب فى استنفار قوات الأمن ولا أستبعد تأهب قوات الجيش للنزول عند اللزوم !!<br />نجح الإضراب السلبى الممتنع عن الأداء بعيدا عن المواجهات أضعاف ما نجح الإعتصام والوقوف فى الميادين العامة! مثلما حدث مع أساتذة الجامعات فقد كانت أعداد من لم يمارس العملية التعليمية استجابة للجنة المؤتمر أكثر من 6 أضعاف من شاركوا فى الوقفات أمام إدارات الجامعات ! وهو ما يؤكد ضرورة التركيز على الأعمال الامتناعية كخطوة على طريق تفعيل الشعب المصرى واحتراما لسنة التدرج ، وفشلت الحكومة فى أن تظهر قوتها وتؤكد على وعى موظفيها الذى تتغنى به عمال على بطال ! لكنها أصدرت فرامانات وقرارات إدارية تمنع الأجازات وحولت المديرين الى مخبرين كما باقى المسئولين ! ليتابعوا الحضور والإنصراف حتى أن من كان له قريب توفى لم يتمكن من حضور جنازته بل قريب لى وصل الميت الى مقبرة لم تتح بعد حيث منع المكلف بالمهمة من الخروج من عمله بعد أن ذهب اليه فى الصباح !!! فشل المخبرين فى كل مكان فى الإقناع فكان لابد من التهديد والإجراءات القمعية وهو عكس ما يحدث عندما يكون المراد شحن الموظفين لأن مسئولا عجوزا أو شابا ، كبيرا أو صغيرا سيشرفنا اليوم بالزيارة ولا مستقبلين له !!<br />نجح الإضراب فى إثبات رغبة الشعب الحقيقية فى التغيير بعد أن فضحنا نظام الحزب الوطنى فى الداخل والخارج وفشلت هذه العصبة الحاكمة فى إقناع الناس بأنهم أحسن من يقود فى الوطن بل لقد خرج كل الكتاب والسياسيين والصحفيين الذين ينتمون للحزب الوثنى المزوراتى يتكلمون بلغة واحدة تطل من بين كلماتهم معانى النفاق والكذب والاستعباط وتجاهل الحقائق والتعامل مع المستمعين لهم كأنهم بلهاء فى تحدى للحس العام وإنكار ما يحياه الناس من غم وهم بالضرورة !! سقطوا للمرة المائة وسقطت لحوم وجوههم من الخزى والافتراء !<br />نجح الإضراب ليس فى الإمتناع فقط عن أداء الأعمال لكن فى التواجد بالشارع فى ظل حدود تحافظ على ممتلكات الوطن التى باعها الحكام لأنفسهم وشركائهم فى الداخل والخارج ولم يحدث مطلقا فى المحلة مثلا أن حدث أى إعتداء على وسائل الانتاج أو الممتلكات العامة أو الخاصة وهو ما كانوا حريصين عليه يوم 6 إبريل لولا قرارا خفيا بمنع تظاهرات العمال داخل المصانع هذه المرة ! والخطة كانت لاستدراج العمال خارج أسوار الشركة وإحداث حالة من الفوضى بالاستعانة برجال الداخلية من البلطجية والمسجلين خطر الذى يستعملهم دائما فى الانتخابات والمظاهرات يمكنه بعدها من القبض على كل من كان يرغب فى اعتقاله من داخل المصنع ولم يتمكن لعدالة قضية العمال وتضامنهم وحتى يغلق ملف المحلة وعمالها المزعج للبد !! هكذا تصور بغبائه المعتاد ! ورغم حدوث ما خطط له إلا أنه حول مدينة المحلة بعمالها وأهلها وكل الشعب المصرى الى قنابل ستنفجر لحظة ما ضد هذه المخططات الغبية ! وهو ما يعد فشلا ذريعا من الحزب وحكومته فى مواجهة قضايا العمال العادلة والتى ستتصاعد فى كل مصر وعندها سيندم هؤلاء الذين خططوا بصورة نمطية تتسم بالغباء والسذاجة لمواجهة أصحاب الحقوق بهذا العنف بدلا من إرجاع الحقوق لأهلها وك أسر مصر من تلك العصبة الحاكمة ، وهم – الذين خططوا – إما صادقين لا يلكون إلا هذا النمط المتخلف من التآمر أو أنهم يعانون مع الشعب المصرى ويأججوا الموقف لمزيد ن الاشتعال لعل حركة الشارع المصرى تنجح فيما فشلوا هم فيه لإحساسهم بالعجز والقهر داخل المنظومة البوليسية التى تحكم مصر<br />نجح الإضراب فى التواصل بوسائل تقنية حديثة ( انترنت- رسائل المحمول) بعيدا عن الجرائد المملة الكاذبة بينما فشلت حكومة الحزن الوطنى فى الضحك على الشعب بوعود زيادات الرواتب والأسعار التى انخفضت والتى نشرتها يوم الإضراب وهو ما يعكس أزمة العصبة الحاكمة ومعرفتها بحجم الظلم الواقع على الشعب بفضل سياستهم الفاشلة<br />باختصار نجح الإضراب فى كسر حالة الجمود التى أصابت الشارع المصرى العام المنصرم وفشلت الحكومة فى تبرئة نفسها من التهم التى تلاحقها داخليا وخارجيا فأثبتت ضعفها وهشاشتها بل وأكدت عدم شرعية وجودها بعد أن تحدت الدستور والقانون والشعب !<br />وتبقى التجربة محل دراسة وتحليل لمعرفة نقاط الضعف والقوة لتطوير وسائل الاحتجاج القليلة التى يملكها الشعب المصرى ولا نريد له أن يفقد تأثيرها بسبب تهور أو نظرة جزئية أو طمع فيما يرميه النظام الفاسد من لقيمات وهوما يصدق عليه قول بعض مفكرينه السابقين المزورين \"المتغطى بالحزب الوطنى عريان\"<br />يحيا شباب مصر وتحيا روح المقاومة التى بدت فى الإضراب الأخير وتحيا كل القوى الفاعلة التى تنظر الى بعضها اليوم لتبدأ صفحة جديدة فى التعاون التنسيق المشترك بعيدا عن الشعارات والاتهامات فإن أول ما تحتاجه أى أمة هو روح جديدة تسرى فيها ،روح مشبعة بالأمل بإمكانية الفعل التاريخى وتحقيق النتائج والتفوق على الأطراف الأخرى وهو ما بدا من جماهير الشعب فى مقابل استخذاء وضعف حكومى حتى لو تترس بالجنود والسلاح فى مواجهة شعب أعزلولا أجد ما أقوله فى ختام هذه التطوافة إلا قوله تعالى<br />\" فاتقوا وأصلحوا ذات بينكم وأطيعوا الله ورسوله إن كنتم مؤمنين\"<br />لأنه فى النهاية<br />\" وما النصر إلا من عند الله\"<br />\" وتلك الأيام نداولها بين الناس\"<br />صدق الله العظيم<br />دكتور محمد جمال حشمت"
