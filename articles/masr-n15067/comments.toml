[[comments]]
order = 0
subject = "الاخوان شماعة النظام امام الغرب"
author = "من الشعب"
posted = "2008-04-07"
text = "اصغر عيل فى مصر عارف ان فية اتفاق بين النظام والاخوان<br />النظام يعتقل فيهم كل شوية علشان يظهر للغرب انة ضد الاسلام والمتعصبين وانة علمانى متنور<br />ويتفق مع الاخوان فى الداخل<br />والشعب عارف كل حاجة وعارف ان كل الاحزاب احزاب ديكور وشقق ولا تتعدى مقارتها واغلبهم فى مباحث امن النظام<br />الشعب بشبابة عارف سكتة<br />وعارف طريق تحرير البلد من الذين يريدون ان يورثوة<br />وكان البلد عزبة او تكية<br />مصر عظيمة بشعبها وشبابها<br />ولا بد ان يهرب الحرامية وقريبا"
archived = "2008-04-11"
capture_url = "https://web.archive.org/web/20080411220741/http://masr.20at.com:80/newArticle.php?sid=15067"

[[comments]]
order = 1
subject = "شاخت كل النخب"
author = "ابو اسامة"
posted = "2008-04-08"
text = "نعم لقد شاخت كل الاحزاب والنخب فى مصر لانه ليس هناك تغيير فالاحزاب رضت بالفتات وبقت فى كراسيها دون حراك<br />ورضى الجميع وركن الى الدنيا والى بعض المناصب الزائلة حتى الاخوان فهم لاهم لهم سوى الحكم ولن يغيروا اى شىء ففكرهم هو نفس فكر الحزب الحاكم من السيطرة والرأسمالية فهم علمانيون فى داخلهم متدينون فى كلامهم ليخدعوا الشعب ولكن هيهات . ان كل هؤلآسيموتون لآنهم شاخوا لكن الشعب لا يشيخ والدليل ان الشباب الواعى هو من اطلق العصيان وقال للجميع فالترحلوا عنا بأفكاركم وشيخوختكم فقد عفا عليه الضهر ولم تعد مناسبة لحياتنا واوصلتنا الى ما نحن فيه ."
archived = "2008-04-11"
