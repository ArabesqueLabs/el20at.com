order = 0
subject = "الهيئة العامة لتسليك المواسير السالكة ولجنة حرامية"
author = "مش باين"
posted = "2008-11-15"
text = "بسبس نو -------------- بسبس نو<br />والشباب مش عارف يعبر عن رأية لية - دا احنا فى ازهى عصور الديمقراطية ولن ولم يكسر قلم حسب مقال القط اللى نايم فى الغيط و ابو الغيط جاب الجمل يشيل يشيل كتب المدرسة اللى بتدرس الديمقراطية<br />الشباب بيتكرع ديمقراطية<br />يبقى يعبر صح ويقول رأية صح هيخاف من اية ؟<br />زمان ايام مولانا جلالة السلطان فؤاد طيب اللة ثراة وكان يتجول فى شوارع القاهرة بالحنطور بتاعة وزى ما بيقولوا دلوقتى بيتحنطر - وقف احد المواطنين من الرعية على الرصيف وكان الحنطور طبعا مش مدرع ولا محصن ضد الرصاص ولا كانوا بيقفلوا الشوارع والمنطقة كلها اللى بيمر فيها جلالة السلطان فؤاد<br />وقف المواطن وهتف<br />يسقط جلالة السلطان فؤاد<br />ولان جلالة الملك سمع الشتيمة بودنة وهو داخل الحنطور المفتوح - فغضب وقال للحراس - ارفتوة<br />وامسك الحراس بالمواطن المتعوس وقالوا لة انت مرفود بامر السلطان<br />المواطن قال لهم انا مش موظف<br />رجعوا للملك فؤاد وقالوا لة يا مولانا دة مش موظف هنرفدة ازاى<br />رد الملك فؤاد<br />وظفوة وبعدين ارفدوة<br />دة كان زمان ايام الظلمات<br />انما فية سلاطين دلوقتى ما بتقلش ارفدوة ولكن بيقولوا خرموة<br />يعيش السلطان حسين والملك فؤاد<br />ولعن الايام السوداء اللى شفنا فيها ثورة العسكر<br />من حزب الوفد"
archived = "2010-03-14"
