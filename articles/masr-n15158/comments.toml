subject = "الشيخ العطار فى وصفة ديل الفار المنجى من الاضراب"
author = "شمهورش"
posted = "2008-04-14"
text = "قالت فتوى لابن زفتاوى حامل السنج والمطاوى انة من خرج بسبب الجوع على حاكمة عكاوى فهو زنديق وضال وجزائة الشوى والقلى فى طاسة زيت الحزب القناوى بتاع لجنة سياسات القهاوى<br />ولتجنب الضرب والعض واربط فى سراير المستشفيات عليك بعمل حجاب مكتوب بالحبر الجاوى ومعتمد من الشيخ طنطاوى وان تتبع الزقزوق فى الزواج من الالمانيات ففيهن تجد العفة ويفقهونك فى الدين وتقول كلاما جيدا فى الدين وتكسب الملايين<br />اما المظاهرات فهى من الموبقات ومن فعلها عليه ان يتطهر وان يستحم بجردل لبن ويلف سبع دورات حول مقر الحزب الوطنى وان يتعلق بالستائر والابواب ويقول كفاية عذاب"
archived = "2010-03-14"
