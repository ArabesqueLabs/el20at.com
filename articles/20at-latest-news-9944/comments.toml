posted = "2008-08-28"
text = "اما بالنسبة للاخ الي كاتب الي باسم محمد نواف انا بعرف انك مش محمد نواف الحمد الله ما تسألني كيف عرفت مو مهم المهم انو انا زهقت والله زهقت منكو عمري ما دخلت الموقع الا وبتكونوا عاملين مشكلة ورجائا ادا بدكو تضلو تعملو مشاكل خلص اعملوها بعيد عنا يا اخوان خدو ايميلات بعضكوا وتمشكلو عليها وسبو على بعض لما تزهقو المهم ما تدخلو غيركوا وبليز الي بدو يسب على حد يسب عليه شخصيا ما تدخلوا العرض والشرف وتقذفوا نساء المؤمنين لانو الي بيجي بأعراض الناس بلاقيها بعرضو وانت يا عاشق فلسطين ويا محمد نواف غلطوا ولازم تبدئو صفحة جديدة ومن هاي اللحظة خلص ما تسبوا على بعضكو ....يا رب كلامي يكون اثر فيكوا .......وطلب اخير لا تدخلوني بمشاكلكوا ....وما تشتمو امهات بعض ولا خوات بعض ولا تيجوا في الاعراض ابدا الي بدو يسب ويشتم يشتم الشخص الي سبو مو بعرضو وبشرفو وبخواتو احنا البنات لا تدخلونا بمشاكلكوا ابدا .....والله معكو سلاااااااااام"
