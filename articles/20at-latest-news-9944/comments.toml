text = "أرجو من جميع الإخوة والأخوات الزوار أن لا يغتروا بتعليق هذا المنافق السافل محمد نواف الحمدالله فهو يتكلم بأعذب الكلمات وهو أكلب شخص على وجه الأرض .. ادخلوا على الرابط الأول وشوفوا كيف مسباتو والله إنها مسباتي بسيطة لكن .. ادخلوا الرابط للي حابب يتأكد وشكراً ..."
