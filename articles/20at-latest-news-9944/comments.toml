subject = "اماااااااانة كل واحد يقرأ رسالتي  ويتقبل مروري(موق"
author = "هايدي"
posted = "2008-08-26"
text = "السلام عليكم انا هايدي اكيد تزكرتوني ...انا حابة ودعكو مو بس انا لااااا انا بحكي باسمي وباسم كل من صديقاتي (سالي) و(ياسمين) والغالي علينا (احمد) و(زهرة المدائن بنت بلدي) وكل الرفقات والغاليين علينا ....نحنا راح نودع هاد الموقع لانو صار فاشل والفشل مو من المراسيلين لا بالعكس احنا تحملنا كتير من (محمد نواف الحمدلله)الي نازل سب وشتم وبصراحة هو سبب فشل الموقع لانو خلاه مكان لالقاء الرديلة فيه عم يسب ويسب في الفلسطينية وخاصة انو كتير جرح فينا نحنا البنات وباعراضنا وامهاتنا بس يلا احنا ما بدنا حد يحبنا من الاردنية اصلن احنا مو هاممنا تحبونا ولا لاء لانو بكفينا انو كل دول العالم بتحبنا غانينا عن محبتك يا( محمد نواف الحمدلله )ويا خسارة هيك واحد ما لازم يكون اسمو( محمد )لانو تماما عكس محمد الصادق الامين ...وبس ورجائا ادعولنا حتى نحرر بلدنا ونرجعلها ونخلص من الجمايل الي بحملونا اياها والل على الضالم والمفتري ....وشكرا تقبلو مرورنا لاننا لن نعود على هاد الموقع ابدا...ابــــــــــــــــــــــــــــــــــداااااااا والله كرامتنا اعلى من هيك شي سب وشتم وما حد من ادارة هاد الموقع كلف خاطرو يحدف تعليقات( محمد نواف الحمد لله ) الله اعلم يمكن مبسوطين من كلامو ...<br />والسلام عليكم ورحمة الله وبركاتو..."
