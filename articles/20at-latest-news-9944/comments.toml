text = "ايه يبني عامل بنفسك كده ليه يا هايدي ( عاشق فلسطين ) يبني انتا مبتفهمش مبتستوعبش الكلام اللي انا بقلك اياه !<br />يبني متفوق على حالك بأه.كفاية كده ده انتا جااااااامد اوي اوي.<br />اسمع كده وفوق على نفسك شوية وصارح نفسك حبتين كده وقول اللي بقلبك يمكن اسعادك شويه ( والله مبهزرش بالكلام ده ) ده انا عارف انك متغاض وممحوق..طيب ليه كده بس ؟!!!!؟؟<br />يبني والله حيفكروك بنت والعياذ بالله لاحول ولاوقوة إلا بالله العلي العضيم والله اللي بالواق واق استوعبوا كلامي وانتا ولا كانك هنه زي ما بقول لحيط بالزبط !<br />لقد اسمعت لو ناديت حياً ... ولكن لاحياة لمن تنادي<br />وانتا كذلك لاحياة لمن تنااااااااااااااااادي<br />الله يرحم والدينا ووالديك<br />ولا إله الا الله"
