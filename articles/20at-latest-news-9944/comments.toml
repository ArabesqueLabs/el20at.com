[[comments]]
order = 11
subject = "شو هااااااااااااااااذ !!!!!!!!!!!!!!"
author = "محمد نواف"
posted = "2008-08-28"
text = "هايدي !!!<br />لو سمحتي انا محترم حالي لأبعد الحدود وصبري طويل فوق متتصوري وتتخيلي .. أنا بعمري ماسبيت إلاّ لأنو الكل قلب علينا بصفحة ارفع رأسك أنت فلسطيني شوفت بعد كمن تعليق إنو دخلوا فيه تمييز حقير فوق ما تتصوري الوضع هناك ..<br />انا قلت خلينا نهدي يا حبايبي يا نور عيني يا توحوش يا زلام يا عالم يا ناس يا يا يا راح صوتي وانا افهم واصيح وولا كإنو بني آدميين اللي بحكيلهوم وبعدين عاشق فلسطين واحد مريض نفسي ومنفصم شخصي وعندو جنون العظمة والإضطهاد ولعلمك بس أنا والله ثم والله ثم والله لا بعرفوا وولا بشرفني اني اعرفو ولا اعرف هيك وجه مذلول ومدعوس عليه ستميت مليون مره ومره .. أنا اللي بقلوا انو هاذ الإنسان عفوا الحيوان مش عارف ليش متقصدني بالذات!!!! انا متأكد إنو ضعيف شخصية وضيع نفس وماعندو ايمان بالله وكل حياتو انو \\\" عنتريات بعنتريات \\\" غبية .. والاخ حابب يسوي حالو يوبر مان ولا باتمان يعني من هذول الشجعان ( شكلو متأثر بالرسوم الشب ) المهم وأنا مابعرف اشي من اللي بحكيه وبعدين في كثير من تعليقاتو العشوائية المندثرة الغامضة العميقة جداً فيها كلام والله ( بكسر الهاء ) وبقسملك بالله و عرضتيه على طبيب نفسي وقلتيلو حللي شخصية الحيوان اللي كاتب هذا الموضوع لقلك هذا فاقد العقل والإتزان . فاقد نعمة كبيرة كثير ( العقل ) وحيقلك كثير وكثير !!<br />أنا ما بستهبل والصراحة انا بعترف وقر اني سبيت وشتمت وغير كثير من الفلسطينية سبوا وشتموا بالفاظ بذيئة جداً ورذيلة جداً للأسف منهم عاشق فلسطين وروحي شوفي التعليقات هناك واقراي كل تعليق مع اسم المعلللللللللللق ولا تنسي اسم المعلللللللللق وبعدين بقلي التافه عاشق اني الي اسماء مستعارة ومش عارف شو يا اخي والله انها قديمة نكتك ومش علينا يا حلو يا كبير !! غيرك جرب وحاول وحاول وطلع خرطيِ! وفاشوشي! وترللي ! وانا حاولت بعد فهمت الموضوع بالتمام اني احاول اهدي الوضع مش اصب زيت على النار ( زي ما سوى عاشق فلسطين ) بالضبط مفكر حالو كثير ذكي وهو في الواقع حمار خنطق منطق .... تقولي امو متوحمة على حمار قبرصي ( تركي ) !!!<br />يا بنت الحلال انا اعتذرت اكثر من مرة وقلت السموحة يا أخواننا لانو الواحد سبحان الله بنسى حالو وبصير يهذرب شمال يمين بتصر مع كل الناس وآنا من هون بعتذر مرة ثانية لأنو اللي بخليني يا أختي اسب لانو في ناس ما بتستهال تكون من فلسطين .. وأساساً يا اختي فلسطين في غنى عنهم وعن اشكالهم القبيحة القذرة .. فلسطين الها ناسها وأهلها الكرام .. فلسطين الها شعبها المغوار الأبيّ .. فلسطين الها زلامها ورجالها الأشاوس الحقيقيون وليسوا اصناف الرجال أو اشباه الرجال ( عاشق فلسطين ) لاحول ولاقوة إلا بالله<br />مابعرف انا اللي عندي حكيتو وبريت ذمتي وضمير عند رب العالمين وانا مرة بعترف غلطت ولكني بعد ذلك تراجعت وحاورت نفسي ولقيت اني غلطان فاعتذرت نيابةً عني وعن الاخوة الاردنيون وقلنا خلص فضوا لهالسيرة !! ولكن كيف بدها تخلص وعاشق فلسطين موجود !! والله ورب االكعبة الشريفة وابصم بالعشرة انو مش طبيعي هاااذ .<br />بك تصدقي براحتك !! مابدك تصدقي كمان براحتك !! لكني قلت اللي عندي<br />بالنسبة للاخ ابو استفهام والله مابرعف مين انت !! وليش بالذات بهاي الصفحة !!<br />ع العموم يا خوك هدّي لعبك شوي وانتا ابن ناس واصيل ومهو واضح عندي انك مصري جدع بس مش هيك ترد عليه لعاشق المهانة والذل !!<br />اتركوا خليييييييييييييه يكاكي لحتى يلاقي مسكين مابعرف شو معنى الإحترام والأدب والأخلاق الرفيعه ؟؟<br />مسكين مابعرف شو معنى الشرف والعزة والكرامة ؟؟؟<br />مسكين مابعرف شو معنى الحوار والنقاش البنّاء ؟؟؟<br />مسكين مابعرف انو الجهل بعمي الإنسان وغنو التخلف بنهي حياتو للإنسان وإنو الإنسان اولاص واخيراً يبقى انسان بانسانيته ومعرفته والله بعرف ناس متعلمين لحدود معينة يا اخي المصري يعني منهم مخلص توجيهي ومنهم موقف لف تاسع واشي عاشر بس ومنهم دخلوا معاهد ومنهم اخذو دبلوم وهيك اشي ولما تيجي تحكي معهم وربي المعبود انهم بفهموا اكثر مني ومنك والله على ما أقول شهيد يا أخي لما يحكوا بموضوع بتحسهم عارفين كل اشي وحتى التفاصيل الدقيقة بالموضوع ! وانا الصراحة بتعلّم منهم كثير يا أخي ناس طموحه بدها تواصل تعليمها ناس بتدرس بتجتهد بتثابر بتجد أما في ناس قاعدة بس للهبل والغباء وقراءة تعليقات وهكرات ومش عارف شو والله فاضيييييييييييييييين"
