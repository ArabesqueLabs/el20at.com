[[comments]]
order = 14
subject = "إلى نواف الحمدالله"
author = "خالد فضل الله"
posted = "2008-09-02"
text = "يا حقير يا نتن مش عارف من وين اصلك يلي عاملي فيها اردني اصلك من نابلس يا واطي صحيح انك قليل قيمة مستغنى عن اصلك دخلت عالروابط اللي كتبها الاخ وبتقول انك ما سبيت الا انو الكل قلب عليك .. ما هو باين من تعليقك الاول ومن كلامك باين عليك واحد ممحون وما سبيت الفلسطينية الا عاملين لك اشي الدنيا رمضان وما بدي اسب ونتا واحد مخنث عديم الشرف ولو انك زلمة وازعر وانا شاكك بذلك فاعطني رقم تلفونك وجوالك وايميلك ووين ساكن ووين عنوانك يا حيوان بتغلط .. وكعب الفلسطيني اشرف منك ومن عشيرتك ومن كل شعبك اللواطي المعفن يا شعب ابو حنيك ... فعلا احنا في زمان ردئ اللي خلى امثالك يقعدوا على النت ويعرفو يحكو منيح .. انتا عارف لو شفتك والله العظيم وهالقسم لاشرب من دمك بس زي ما حكيت وعالعهد حط رقم تلفونك وعنوانك وين وبعرف أجيك ولو كنت بالمريخ .."
archived = "2010-03-14"
capture_url = ""

