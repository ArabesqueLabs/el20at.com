subject = "وينك يا نواف"
author = "خالد فضل الله"
posted = "2008-09-03"
text = "وينك مسوي زلمة هون حط رقمك وانا رح أضل متابع للصفحة واشوف شو النهايه معك لاني لو شفتك رح ادعس على ثمك يا رخيص يا ساقط يا معفن يا كلب وانا ساكن بإربد واحكيلي وين ساكن بالاردن بالضبط عشان اجيك ولحالي كمان .. مش بقلك انك مرة ..<br />علاعموم بديش احكي كثير لكن حط رقم تلفونك وكل اشي بخصك ورح اجيك فورا .. وبصير خير"
