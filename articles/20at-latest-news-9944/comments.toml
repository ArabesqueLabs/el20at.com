subject = "وبعدين يعني ؟؟!"
author = "خالد فضل الله"
posted = "2008-09-05"
text = "تبين من تعليق الاخ الطويلة انك ساكن بالامارات بالشارقة مش بالاردن طب اوكي بس اعطيني ايميلك عشان اتواصل معك واعرف اتصرف معك مش بقلك بنت مش زلمه حط رقم تلفونك أو إيميلك بالكتير ورح أوصلك علطول ولو كنت بمثلث برموده بس عشان اورجيك مين هما الفلسطينية اللي بتغلط عليهم وانا بنصحك يا عاشق تتفشش فيه مضبوط لأني دخلت كذا صفحة برضواا وشفتك بتلاحقوا وهيك كويس بس انا مستني يا محمد نوواف ورح اضل متابع للصفحة واشوف شو هي النهاية وخير ان شا الله"
