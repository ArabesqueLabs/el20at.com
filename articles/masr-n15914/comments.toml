text = "تعرفي ايه عن باسم السمرة علشان تعملى معاه حوار فى موقع محترم<br />واضح ان الموقع لم<br />يا افندم ياريت تتعرفى اكتر على بيئة الممثل ده وظروف اكتشافه ودخوله مجال التمثيل ومن اكتشفه<br />حرام عليكم"
