subject = "تعليقى"
author = "محمد غراب"
text = "فى الحقيقة الفنان باسم السمره , فنان محترم و اخلاقه عاليه<br />و ان شاء الله ليه مستقبل مبهر و احب اقوله الى الامام دايماً"
