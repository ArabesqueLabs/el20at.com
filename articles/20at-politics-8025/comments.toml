subject = "لا أهلا ولا سهلا"
author = "mahmed"
posted = "2008-05-12"
text = "بسم الله الرحمن الرحيم<br />قال الله تعالى ( يايها الذين آمنوا لا تتخذوا اليهود والنصارى اولياء بعضهم اولياء بعض)<br />وقال تعالى ( ومن يتولهم منكم فانه منهم)<br />نرحب بالمجرم بوش في بلاد المسلمين ويده ملطخة بدماء المسلمين في افغانستان والعراق والصومال وفلسطين والصومال وغيرها.."
