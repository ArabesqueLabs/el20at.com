subject = "الصراحة يستاهل"
author = "صادق"
posted = "2008-10-06"
text = "لا تنسوا أنه والده وقف مع الكويت يوم كل العرب المنافقين أيدوا صدام في الغزو وأنه هو محرر العراق من الديكتاتوريه وإن اللي حصل بعد ذلك هو بسبب الطائفية و الجهل اللي في العراق ومعروف أنهم<br />أهل الشقاق و النفاق ومحمد بن راشد الوحيد اللي بنى بلده أقل شي أنهم عايشين بكرامه مو على الإعانات ولا على السياحة الجنسية لبناتهم"
