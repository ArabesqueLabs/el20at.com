text = "الرجل عبر عن الملك فاروق بتلقائية ولم يكذب لانة هيكذب على اية - فاروق كان بيحتقر المصريين ويقول انتم جبتوة من تحت الجاموسة 0 ( للذين يمجدون الملكية )<br />واتكلم عن الانجليز الكلاب اللى كانوا بيستعبدوا الشعب المصرى وعاملين رعب للشعب المصرى ولسيدات الارياف بالذات لانة كان بيحصل عمليات خطف وقتل لهم من قبل الانجليز<br />واذكر ان جدتى كانت تبكى بحرقة شديدة يوم وفاة عبد الناصر وكان واحد من اولادها مات ولما سالتها وكنت طفلا صغيرا انتى بتعيطى لية يا ستى على جمال عبد الناصر ردت جدتى بسذاجة الفلاحة المصرية اصلة هو اللى طلع الانجليز برة بر مصر ويمكن بعد ما يموت يرجعوا تانى<br />ثم بكت كثيرا على عبد الناصر لانة طلع الانجليز من مصر وكان واقف لهم زى الاسد<br />رحمك اللة يا جدو شرقاوى"
