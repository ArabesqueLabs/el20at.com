[[comments]]
order = 2
subject = "بنات العائلات لا يتزوجن من على قارعة الطريق"
author = "س"
posted = "2008-11-26"
text = "المعلق الفاضل السابق<br />ابحث حولك عن احدى قريباتك او جارتك وتكون هناك سابق معرفة باسرتها ووضعها الاجتماعى<br />واهم شروط الزواج فى الشريعة الاسلامية هو الكفاءة من حيث القدرة المعيشية والاجتماعية والتعليمية<br />فتش حواليك ستجد الكثيرات من اهلك ومن جيرانك يتمنون الزواج منك"
archived = "2010-03-14"
