subject = "الى سوسو المعلقة السابقة"
author = "مش خاطب ولا متجوز"
posted = "2008-11-26"
text = "طيب يا سوسو هانم ما هو انا موجود اهه مش خاطب ولا متجوز<br />وجاهز من مجاميعو<br />قوليلي اروح لمين ونلم الشمل وعشرينات تاخد الاجر والثواب"
