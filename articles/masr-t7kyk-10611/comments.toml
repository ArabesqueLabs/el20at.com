[[comments]]
order = 0
subject = "يعنى هتقعد فى البيت تعمل اية ؟"
author = "سوسو"
posted = "2008-11-26"
text = "زمان كانت البنت بعد الشهادة الجامعية بتلاقى شغل وبتخرج من البيت وتعيش فى المجتمع وتتعرف على الناس والناس تتعرف عليها لغاية ما ييجى النصيب<br />دلوقتى مفيش شغل الا لاولاد الناس الواصلين والكبار بس<br />انما الناس العاديين فمفيش حاجة خالص<br />انا سجلت للدبلوم ودفعت ما يقارب 800 جنية علشان اتجنب قعدة البيت - اهو اخرج والناس يشوفونى واشوفهم ويمكن اقابل ابن الحلال<br />انما ها اقعد فى البيت مفيش احد يحس بى ولا يعرف ان هنا فية بنت فصعب شوية<br />وربنا يستر كل البنات"
archived = "2010-03-14"
capture_url = ""

