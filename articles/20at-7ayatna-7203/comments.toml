text = "وصاحب الجلالة الملك محمد السادس حامل لعدة توشيحات وجوائز من ضمنها<br />جائزة الجمعية الدولية للرياضة بدون عنف في 11 شتنبر 1983<br />الحمالة الكبرى للجمهورية التونسية في غشت 1987<br />ميداليتين ذهبيتين منحتهما لجلالته المجلة الرياضية \"بطل إفريقيا\" التي تصدر باللغتين الفرنسية والانجليزية برسم سنتي 1988 و 1989<br />الجائزة الفخرية \" من أجل غرناطة 1999 \" من قبل مجموعات المحطات الإذاعية \" لاكاديناسير \" بغرناطة في دجنبر 1999<br />قلادة الحسين بن على ( الأردن ) في مارس 2000<br />وسام الاستحقاق للجمهورية الإيطالية في أبريل 2000<br />الوشاح الكبير للاستحقاق الوطني ( موريتانيا) في أبريل 2000<br />القلادة الكبرى لوسام السابع من نوفمبر (تونس) في ماي 2000<br />الحمالة الكبرى للوسام الوطني المالي في 14 يونيو 2000<br />الدكتوراه الفخرية من جامعة جورج واشنطن الأمريكية في 22 يونيو 2000<br />جائزة \" هيلير كيلير \"(منظمة أمريكية تضطلع بمهام الأعمال الاجتماعية وخاصة ما يتعلق بمساعدة فاقدي البصر) في 17 يوليوز 2000<br />قلادة وسام \" ايزابيل لاكاتوليك \" (اسبانيا) في 18 شتنبر 2000<br />جائزة \" عبد الرحمان الداخل \" التي منحتها لجلالته بلدية ألمونيكا بإسبانيا والتي تسلم لكبار الشخصيات التي تقوم بمجهودات جبارة من أجل توطيد العلاقات العربية الأوروبية في 27 نونبر 2000<br />\"درع الايسيسكو\" الذي يعد أكبر وسام تمنحه المنظمة الإسلامية للتربية والعلوم والثقافة إلى رِؤساء الدول الأعضاء في 7 دجنبر2000،<br />وسام \" أمية \" الوطني من درجة الوشاح الأكبر (سوريا) في 9 ابريل 2001<br />وسام الاستحقاق اللبناني من الدرجة الاستثنائية في 13 يونيو 2001<br />قلادة \" أبي بكر الصديق \" من طرف جمعيات الهلال الأحمر والصليب الأحمر العربية التي تعتبر أعلى وسام للمنظمة وذلك تقديرا منها لدور جلالته في العمل الإنساني والخيري وتضامنه مع الفئات المعوزة<br />مواضيع العضو<br />- Anglais : Leçon 1=se présenter<br />- صاحب الجلالة يؤكد الحرص علـى القيام بإصلاح عميق وشامل لقطاع القضاء<br />- لمن يهوى تصميم الكروت و غيره اليكم بعض مواقع الصور..<br />- إحمي طفلك من الربو بتناول ...<br />- جلالة الملك يخص قريبا رؤساء الأحزاب السياسية باستقبالات مولوية<br />صاحب الجلالة الملك محمد السادس<br />محمد السادس محمد بن الحسن، الملك الثامن عشر في الدولة العلوية.. تولى العرش 23 من يوليوز سنة 1999م بعد وفاة والده المغفور جلالة الملك الحسن الثاني..<br />ولد محمد السادس بن الحسن، -الملك الثامن عشر في يوم الأربعاء فاتح ربيع الثاني 1383 هـ الموافق ل 21 غشت 1963 بالرباط. التحق بالمدرسة القرآنية بالقصر الملكي فيفي سن الرابعة.<br />في 28 يونيو من عام 1973م حصل جلالته على شهادة الدراسات الابتدائية. وتابع دراسته الثانوية بالمدرسة المولوية حيث نال شهادة الباكالوريا عام 1981.<br />في سنة 1985 حصل جلالته على شهادة الإجازة في الحقوق من كلية العلوم القانونية والاقتصادية والاجتماعية بالرباط حول موضوع \\\" الاتحاد العربي الإفريقي واستراتيجية المملكة المغربية في ميدان العلاقات الدولية\\\".<br />وفي سنة 1987 أحرز جلالته بامتياز على الشهادة الأولى للدارسات العليا في العلوم السياسية. وفي يونيو 1988 نال بامتياز دبلوم الدراسات العليا لدكتوراه القانون العام .<br />ومن أجل استكمال تكوينه والاحتكاك بتطبيق مبادئ وقواعد القانون الملقنة في الكلية أجرى جلالته في نونبر 1988 ببروكسيل تدريب لبضعة أشهر لدى السيد جاك دولور رئيس لجنة المجموعات الأوروبية آنذاك.<br />وفي يوم 29 أكتوبر 1993 حصل جلالة الملك من جامعة \\\" نيس صوفيا أنتيبوليس\\\" على شهادة الدكتوراه في القانون بميزة \\\" مشرف جدا \\\" مع تهانئ لجنة المناقشة وذلك عن أطروحة حول موضوع \\\"التعاون بين السوق الاوروبية المشتركة والمغرب العربي\\\".<br />وأصبح جلالة الملك يوم 22 دجنبر 1979 رئيسا شرفيا للجمعية الاجتماعية والثقافية لحوض البحر الابيض المتوسط .<br />وفي 18 مارس 1982 عينه جلالة المغفور له الحسن الثاني رئيسا للجنة المنظمة للألعاب التاسعة للبحر الأبيض المتوسط التي جرت بالدار البيضاء.<br />كما عينه المغفور له الملك الحسن الثاني يوم 11 أبريل 1985 منسقا عاما لمكاتب ومصالح الأركان العامة للقوات المسلحة الملكية..<br />ورقي صاحب الجلالة في 12 يوليوز 1994 إلى رتبة جنرال دوديفيزيون.<br />ومنذ 1996 وجلالة الملك يتولى رئاسة الجمعية الملكية المغربية للحصان الركوب والرئاسة الشرفية لجمعية \\\" تافيلالت \\\" .كما يترأس جلالته منذ 1999 نادي الاوداية لرياضة ركوب الأمواج.<br />وقد تولى جلالة الملك محمد السادس منذ ريعان شبابه مسؤوليات جسيمة إذ كلفه والده الملك الراحل الحسن الثاني بمهام عديدة على الصعيد الوطني والعربي والإسلامي والإفريقي والدولي لدى رؤساء دول شقيقة وصديقة. وهكذا شارك جلالته في العديد من المؤتمرات الدولية والإقليمية.<br />كانت أول مهمة رسمية لجلالته خارج الوطن يوم سادس أبريل 1974 حيث مثل جلالة المغفور له الحسن الثاني في الحفل الديني الذي احتضنته \\\"كاتدرائية نوتر دام دو باري \\\" تخليدا لذكرى رحيل الرئيس الفرنسي جورج بومبيدو.<br />وقد أصبح ملكا للمغرب في 23 يوليوز 1999 اثر وفاة الملك الحسن الثاني .وقد تمت بالقصر الملكي بالرباط مراسم تقديم البيعة لجلالة الملك محمد السادس.<br />وفي 30 يوليوز 1999 أعطى جلالته تعليماته السامية من أجل الاحتفال بعيد العرش في 30 يوليوز من كل سنة كما وجه جلالته أول خطاب للعرش أكد فيه السير على نهج والده المغفور له الملك الحسن الثاني وايلاء أولوية خاصة لحل بعض المشاكل الاجتماعية.<br />ويتقلد صاحب الجلالة مهمة القائد الأعلى ورئيس أركان الحرب العامة للقوات المسلحة الملكية.<br />أول زيارة قام بها جلالة الملك محمد السادس للخارج منذ اعتلاءه عرش أسلافه المنعمين تمت في الفترة مابين 25 و 28 دجنبر 1999 حيث قام بجولة زار خلالها كلا من المملكة العربية السعودية ، دولة الامارات العربية المتحدة وتونس<br />وصاحب الجلالة الملك محمد السادس حامل لعدة توشيحات وجوائز من ضمنها<br />جائزة الجمعية الدولية للرياضة بدون عنف في 11 شتنبر 1983<br />الحمالة الكبرى للجمهورية التونسية في غشت 1987<br />ميداليتين ذهبيتين منحتهما لجلالته المجلة الرياضية \\\"بطل إفريقيا\\\" التي تصدر باللغتين الفرنسية والانجليزية برسم سنتي 1988 و 1989<br />الجائزة الفخرية \\\" من أجل غرناطة 1999 \\\" من قبل مجموعات المحطات الإذاعية \\\" لاكاديناسير \\\" بغرناطة في دجنبر 1999<br />قلادة الحسين بن على ( الأردن ) في مارس 2000<br />وسام الاستحقاق للجمهورية الإيطالية في أبريل 2000<br />الوشاح الكبير للاستحقاق الوطني ( موريتانيا) في أبريل 2000<br />القلادة الكبرى لوسام السابع من نوفمبر (تونس) في ماي 2000<br />الحمالة الكبرى للوسام الوطني المالي في 14 يونيو 2000<br />الدكتوراه الفخرية من جامعة جورج واشنطن الأمريكية في 22 يونيو 2000<br />جائزة \\\" هيلير كيلير \\\"(منظمة أمريكية تضطلع بمهام الأعمال الاجتماعية وخاصة ما يتعلق بمساعدة فاقدي البصر) في 17 يوليوز 2000<br />قلادة وسام \\\" ايزابيل لاكاتوليك \\\" (اسبانيا) في 18 شتنبر 2000<br />جائزة \\\" عبد الرحمان الداخل \\\" التي منحتها لجلالته بلدية ألمونيكا بإسبانيا والتي تسلم لكبار الشخصيات التي تقوم بمجهودات جبارة من أجل توطيد العلاقات العربية الأوروبية في 27 نونبر 2000<br />\\\"درع الايسيسكو\\\" الذي يعد أكبر وسام تمنحه المنظمة الإسلامية للتربية والعلوم والثقافة إلى رِؤساء الدول الأعضاء في 7 دجنبر2000،<br />وسام \\\" أمية \\\" الوطني من درجة الوشاح الأكبر (سوريا) في 9 ابريل 2001<br />وسام الاستحقاق اللبناني من الدرجة الاستثنائية في 13 يونيو 2001<br />قلادة \\\" أبي بكر الصديق \\\" من طرف جمعيات الهلال الأحمر والصليب الأحمر العربية التي تعتبر أعلى وسام للمنظمة وذلك تقديرا منها لدور جلالته في العمل الإنساني والخيري وتضامنه مع الفئات المعوزة"
