posted = "2008-11-09"
text = "شديدة اللهجة في افتتاح المناظرة الوطنية للرياضة مساء يوم الجمعة بمدينة الصخيرات جنوبي العاصمة الرباط دعا فيها الى النهوض بالانشطة الرياضية في البلاد.<br />وقال الملك محمد السادس في مستهل رسالته التي قرأها مستشاره الخاص محمد معتصم \\\"ومن التجليات الصارخة لاختلالات المشهد الرياضي ما تتخبط فيه الرياضة من ارتجال وتدهور واتخاذها مطية من لدن بعض المتطفلين عليها للارتزاق أو لاغراض شخصية الا من رحم ربي من المسيرين.\\\"<br />وقال العاهل المغربي ان هذه المناظرة تأتي في وقت تشهد فيها الرياضية المغربية تراجعات \\\"تجسدها النتائج الهزيلة والمخيبة للامال وهو ما لا نرضاه لبلدنا ولا يقبله كل ذي غيرة وطنية ولا يمكن أن تحجبه بأي حال من الاحوال بطولة وتألق بعض المواهب الفردية.\\\"<br />ودعا الملك محمد السادس المهنيين والسلطات التي تتولى تنظيم وادارة القطاع الرياضي الى التفكير فيما يمكن القيام به للخروج من هذه الاوضاع.<br />وعدد العاهل المغربي أهم مظاهر اختلالات الرياضة المحلية مشددا على ما اعتبره أدهى وأمر قائلا \\\"ان تحديد المسؤوليات غالبا ما لا يتم بشكل واضح في حين لا تتوفر عناصر الشفافية والنجاعة والديمقراطية في تسيير الجامعات والاندية ناهيك عن حالة الجمود التي تتسم بها بعض التنظيمات الرياضية.\\\"<br />وتابع العاهل المغربي \\\"ولتجاوز الازمة الحالية فانه يتعين وضع نظام عصري وفعال لتنظيم القطاع الرياضي يقوم على اعادة هيكلة المشهد الرياضي الوطني وتأهيل التنظيمات الرياضية للاحترافية ودمقرطة الهيئات المكلفة بالتسيير.\\\"<br />وطالب العاهل المغربي بضرورة اعادة تأهيل الرياضة المدرسية والجامعية \\\"اعتبارا لدورها الريادي في الاكتشاف المبكر للمواهب وصقلها.\\\"<br />وختم محمد السادس رسالته بالقول \\\"نحثكم على أن تجعلوا هذه المناظرة قوة اقتراحية تصدر عنها توصيات واقتراحات عملية تكون في مستوى التحديات التي تواجه رياضتنا الوطنية وتستجيب لتطلعات الجماهير الشعبية ومواطنينا في الداخل والخارج للمزيد من الانجازات و البطولات.\\\"<br />وقالت نوال المتوكل وزيرة الشباب والرياضة في تصريح لرويترز \\\"الرسالة الملكية كانت واضحة وهي بمثابة خارطة طريق لنا في السنين القريبة القادمة.\\\"<br />وتستمر المناظرة الوطنية للرياضية يوم السبت بخمس ورشات عمل ليختتم اللقاء بتقديم المخططات وتشكيل اللجنة التي سيعهد اليها بمتابعة تنفيذ الاهداف.<br />اكتب تعليق اخبر صديق طباعة<br />أضف التعليق<br />موقع ياللاكورة غير مسئول بأي شكل من الأشكال عن أي تعليق يقوم الزائر بنشره على الأخبار والمقالات وتقع كافة المسئوليات القانونية والأدبية على عاتقه<br />أرسل التعليق<br />بإمكانك إزالة التعليقات غير اللائقة أو البعيدة عن موضوع الخبر عن طريق الضغط على أيقونة (ابلغ عن تعليق غير لائق) وسيتم حذف التعليق أتوماتيكيا إذا أبلغ عنه عدد معين من الزوار<br />أحدث الأخبار<br />تعادل الزمالك والأهلي في دوري المحترفين لكرة اليد<br />بطولة الماسترز للسيدات: فينوس وليامس تقصي يانكوفيتش في مباراة رائعة<br />بن سليم نائبا لرئيس الاتحاد الدولي للسيارات<br />ناصر بن خليفة العطية \\\"سنعدل حلبة لوسيل لاستضافة تجارب فرق الفورمولا 1\\\"<br />الدوري الاميركي للمحترفين: الفوز الخامس على التوالي ليوتا جاز والالف مع مدربه سلون<br />بطولة الماسترز للسيدات: فينوس-يانكوفيتش وزفوناريفا-ديمنتييفا في نصف النهائي<br />ماسا يشارك باريكيللو في اغنية تهين شوماخر<br />بطولة الماسترز للسيدات: سيرينا وليامس بعد ايفانوفيتش تعلن انسحابها<br />الدوري الاميركي للمحترفين: براندن روي يسقط هيوستن<br />اطباء اميركيون ينصحون العداء الصيني ليو جيانغ باجراء عملية جراحية<br />Advertise on Yallakora | Contact Yallakora | Privacy Policy"
