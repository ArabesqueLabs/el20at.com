[[comments]]
order = 3
subject = "ايه يا عم دواخلى الشغل الجامد ده"
author = "شرين"
posted = "2008-02-09"
text = "ولو انى مش بحب اقرا فى الملف التجسسي لما يكون الكاتب هو بيبو \" دلع شريف يعنى مش عاوزين نسيح \" يبقى الواحد لازم يقرا عشان يتعلم ويستمتع ... اى خدمه ياعم ... بس بجد الموضوع مكتوب حلو جدا جدا و اسلوب فعلا اكثر من رائع بس تفتكر ها يدخلوك اتصالات يا جميل بعد كده"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043253/http://masr.20at.com:80/newArticle.php?sid=14149"

[[comments]]
order = 4
subject = "موضوع جرئ ولكن !"
author = "اسماء"
posted = "2008-02-09"
text = "احنا عارفين يا عم بيبو ان الصحفى الجيد هو اللى بيعرف يثير الرأى العام فى موضوع ماس باحتياجاتهم .. مفيش خلاف على كده .. اوك<br />بس تناول موضوع التجسس بالطريقة ديه ..اممم مش عارفه حاسه ان الموضوع كان ممكن يكون اجرأ من كده كتير طالما انت قررت انك تكتب عنه وما تقوليش يا بتاعة جيفارا .. يا بتاعة الحريه .. لا الموضوع مش جيفارا ولا حاجة .. الفكره كلها انك حد متميز و شغلك لا خلاف علي قوته بشهادة كل الناس قبل شهادتى بس الموضوعات ديه مش حاسه ان واحد شيخ زيك ممكن يكتبها مش لسبب الا لأنك محافظ لدرجة \" فى رأيى \" زائدة .. بس بشكل عام الاسئلة حلوه جدا جدا و غطت الموضوع كله ."
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043253/http://masr.20at.com:80/newArticle.php?sid=14149"

[[comments]]
order = 5
subject = "الموضوع حلو بس عشان انتا اللى كاتبه !"
author = "منى"
posted = "2008-02-09"
text = "بص يا جميل .. الموضوع فيه مشكلتين اساسيتين بدون مواربه \" الصورة لا تعبر عن اى شئ \" صوره هلاميه جدا<br />وثانيا بقى العنوان ساذج جدا \"سورى \" يعنى ايه كله بيراقب كله.. العنوان يعطى ايحاء ان الموضوع خواطر او افيهات .. مش شكل شغلك خالص يا استاذ ! بس شغل المحاور لم يغب عنك فى الموضوع"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043253/http://masr.20at.com:80/newArticle.php?sid=14149"

