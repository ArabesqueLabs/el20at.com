subject = "موضوع سخيف زى اللى كاتبه"
author = "البراء أشرف"
posted = "2008-02-09"
text = "عم شريف الدواخلى انتا مش روحت اسلام اون لاين ايه اللى رجعك الموقع تانى يا عم انتا<br />وبعدين ايه اللى كله بيراقب كله \" موضوع سخيف فعلا \" قوى<br />وتحس انه المفروض ينزل فى مجلة \" الاتصالات \"<br />ارحمنا بقى والنبى"
archived = "2008-02-12"
