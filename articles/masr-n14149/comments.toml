order = 0
subject = "امال الفقر راكب البلد لية"
author = "فواقرى"
posted = "2008-02-09"
text = "الفقر راكب البلد علشان كل الفلوس بتتصرف على الرقابة ومراقبة الناس الغلابة اللى لا بيهشوا ولا بينشوا وكل الميزانية فى الدول والحكام الغير شرعيين بتتصرف على مباحث امن الدولة والامن المركزى وفرق الكارتية<br />نفس الاسلوب فى النظام السورى واليمن والقذافى<br />امن الكرسى اولا"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043253/http://masr.20at.com:80/newArticle.php?sid=14149"

