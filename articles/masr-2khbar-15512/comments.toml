author = "يا برادعى يا امل"
posted = "2010-02-28"
text = "البرادعى امل مصر<br />هو وامثالة يستطيعون انتشالها من حكم الاغبياء والمتخلفين عقليا اللى ودوها فى ستين داهية<br />مصر اصبحت قزما تحت حكمهم<br />البرادعى امل مصر<br />فى نظام جديد ديمقراطى<br />واذا فشل البرادعى يبقى نصيب البلد دى هباب لان الدم هيبقى للركب<br />الناس جاعت وهتسرق وهتقتل علشان تاكل وتشرب وتعيش<br />لا بد من التغيير<br />ولا بد من رحيل الناس القذرة الاغبياء والاغبياء بالوراثة من هذة البلد<br />البرادعى على حق<br />وكل مصر وراء البرادعى"
archived = "2010-03-14"
