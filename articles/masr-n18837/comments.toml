[[comments]]
order = 0
subject = "ولا تحسبن ربك غافلا عما يفعل الظالمون"
author = "مواطن"
text = "كما ضرب جورج بوش بالجزمة - وكما رقد شارون مشلولا يتبرز على نفسة - لن ينسى ربك راس الجبروت المصرى<br />وبطش ربك قادم"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217101002/http://masr.20at.com:80/newArticle.php?sid=18837"

[[comments]]
order = 1
subject = "منظمة حقوق الانسان الدولية تطالب باعادة المحاكمة وحاكمة الضباط الذين قتلوا ابرياء فى المحلة"
author = "ل"
text = "هؤلاء الذين حكم عليهم - جاء بهم امن الدولة من الصور المنشورة وهم يسقطون صورة كبيرة لحسنى ويدوسون عليها بالاقدام<br />ولم يرتكبوا جرما"
archived = "2008-12-17"
capture_url = "https://web.archive.org/web/20081217101002/http://masr.20at.com:80/newArticle.php?sid=18837"
