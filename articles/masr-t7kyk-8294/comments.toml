subject = "الفاتيكان: القساوسة يعتدون على الراهبات"
posted = "2008-02-26"
text = "الفاتيكان: القساوسة يعتدون على الراهبات<br />روما ـ .نت/21-3-2001<br />كشف تقرير صادر من الفاتيكان عن قيام الكثير من القساوسة والأساقفة في الكنائس الكاثوليكية بالاعتداء الجنسي على الراهبات واغتصابهن وإجبارهن على الإجهاض أو تناول حبوب منع الحمل.<br />وذكر التقرير الذي نشرته صحيفة \"لاريبابليكا\" الإيطالية الصادرة عن الفاتيكان الأربعاء 21-3-2001 أن هؤلاء القساوسة والأساقفة يستغلون سلطتهم الدينية التي يتمتعون بها في العديد من الدول، خاصة دول العالم النامي لممارسة الجنس مع الراهبات رغمًا عنهن، مشيرًا إلى أنه تم الكشف عن العديد من حالات الاعتداء في 23 دولة، منها الولايات المتحدة، البرازيل، الفليبين، الهند وأيرلندا، وإيطاليا، بل وداخل الكنيسة الكاثوليكية (الفاتيكان) نفسها، بالإضافة إلى العديد من الدول الإفريقية!!.<br />وأشار التقرير إلى أنه تم الكشف عن عدد لا حصر له من حالات الاعتداء الجنسي من جانب القساوسة، الذين يقومون بإجبار هؤلاء الراهبات، إما على تناول حبوب منع الحمل، أو الإجهاض لمنع الفضيحة.<br />وقال التقرير: إن إحدى الراهبات الأم بكنيسة -لم يتم ذكر اسمها- أقرّت بأن القساوسة في الكنيسة التي تعمل بها قاموا بالاعتداء على 29 من الراهبات الموجودات في الأسقفية، وعندما أثارت الراهبة هذا الأمر مع كبير أساقفة الكنسية، تم فصلها من وظيفتها.<br />وفي كنيسة أخرى -وطبقا للتقرير- طالب القساوسة الموجودون بها، بتوفير راهبات للخدمات الجنسية!!.<br />وأشار التقرير إلى أنه وبعد اكتشاف مثل تلك الحالات فإنه يتم إرسال القساوسة المسئولين عن تلك الاعتداءات، إما للدراسة خارج الدولة أو إرسالهم لكنيسة أخرى لفترة قصيرة. أما الراهبات -اللاتي يخشين العودة إلى منازلهن- فيتم إجبارهن على ترك الكنسية، ويتحولن في أغلب الأحيان إلى عاهرات.<br />وقال التقرير: إن الفاتيكان يراقب الموقف، إلا أنه لم يتخذ حتى الآن أي رد فعل مباشر.<br />يذكر أنه كان قد تم الكشف منذ عدة شهور عن وجود شبكة كبيرة من القساوسة ورجال الدين في الفاتيكان في مناصب مختلفة يمارسون العادات الجنسية الشاذة، ويعيشون في حالة من الرعب؛ خوفًا من كشف أمرهم"
