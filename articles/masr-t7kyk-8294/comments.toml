subject = "وسيظل الاسلام هو الحل ما بقيت حياة"
author = "مسلم بس مش اخوانى"
posted = "2008-02-23"
text = "الاسلام هو الحل للفرد والجماعة والمجتمع وكل الشعب وكل العالم ما بقيت هناك حياة وما بقى هناك انسان<br />الاسلام هو العدل<br />هو حق الفقير والمسكين<br />ولكن واضعوا دستور هشك بشك بتاع ابلة سعاد بيقول لك ممنوع استخدام الشعارات الدينية فى الانتخابات<br />اليس فى المانيا حزب هو الحزب الديمقراطى المسيحى ولم يقل احد ان هناك شعارات دينية وان كلمة مسيحى مش دينية<br />اليس فى امريكا اكبر قوة هى قوة الكنائس الانجيلية التى انتخبت بوش وجعلتة ينجح فى الانتخابات<br />هل نشترك كلنا فى نوادى الروتارى العلمانية الكافرة فى مصر الجديدة علشان نعجب الست<br />الاسلام هو الحل غصبا عن اكبر راس واكبر جبار وسيقصم ظهرة<br />الاسلام سيشرق عاليا<br />والاخوان الاغبياء الذين سرقت ثورة 1952 منهم لن يكرروا اخطائهم<br />ويوما قريبا سيحكمون مصر<br />وسيطهرونها من الحرامية والفساد بعد ان عم الفقر والخراب كل مكان<br />وسيعيدون المصانع والبنوك والارض التى بيعت للحرامية<br />سيعيدونها للشعب الفقير المسكين<br />والاغرب ان الغرب وامريكا ستكون معهم"
archived = "2010-03-14"
