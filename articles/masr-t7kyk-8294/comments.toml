text = "\"وليس سراً أن جناح الإصلاح في جماعة الإخوان المسلمين كان قد نادى مراراً وتكراراً بالتخلى عن شعار\" الإسلام هو الحل \"وهو ما توافق مع فكر شباب الجماعة \" مش عارف جبت الكلام ده منين يا استاذ شريف ؟ من قال ان هناك جناح اصلاح داخل الجماعة يريد التخلي عن الشعار ؟!<br />هات تصريح لواحد يوحد ربنا يقول ان فيه تيار اصلاح داخل الاخوان يريد تغيير الشعار والمرشد رافض.. بلاش مدرسة روزاليوسف يا طحاوى"
