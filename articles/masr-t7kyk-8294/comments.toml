[[comments]]
order = 9
subject = "لبراهين الجليه..في عباطة السلفيه"
author = "http://benkerishan.blogspot.co"
posted = "2008-02-25"
text = "الشكر والتقدير للسلفيه ..فعندما يتعلق الأمر بطقوس التحريم في الأديان يقفز الأسلام بفضلها الى رأس القائمه ،وحتى لوقارنت إحصائية الذنوب في المسيحيه واليهوديه فستجدها تنحصر في الذنوب السبعه المميته، والوصايا العشر..الا أن الأسلام يقدم قوائم فضفاضه لا نهاية لها في المحرمات والذنوب، تتزايد كل يوم بتفاقم ملاريا الفتاوي التي تنهش في عقول الحمقى . وليس هناك حصر ثابت او متفق عليه بين علماء الشعوذه السلفيه لماهي الكبائر، وماهي الصغائر وما تعدادها؟ كما أنني استغرب كيف لم يخرجوا علينا بالذنوب الوسطى التي تأتي بين الكبائر والصغائر..و مابينهما من الستا<br />يجد المتأمل و الدارس لهذه الظاهرة الشاذه صعوبة كبيرة في فهم أسبابها ومصادرها. أعتقد شخصيا بأن هناك شرخان من السايكوباتيه يؤثران على النفس العربيه وهما ذهنية المؤامره وذهنية التحريم. وصعوبة علاج أسبابهما في بلاد الرمال يكمن في غرس هذه المفاهيم في عقول الأطفال مبكرا في المدارس عن طريق المناهج المؤدلجه والشاحنه لغرائز الأنتقام والحقد والكراهيه والتلويم للنفس و للغير المختلف وتحميلهم كل مآساينا<br />أعطنى طفلا أربيه حتى يبلغ سبعا..وسأمتلك عقله للأبد<br />صرت الاحظ مؤخرا أن قسم كتب اللغة العربيه بالمكتبة ينموا ليس فقط بزيادة الرفوف، بل بأعداد الكتب الغير دينيه والتي صارت مؤخرا أكثر من كتب الجان والعفاريت وأنواع الملائكه وأذكار المجذوبين<br />لا أدري لماذا إلتقطت هذا الكتاب بالذات ؟ ممكن لأن كاتبته إمرأه من مملكة الرمال الكبرى؟ فاشتريته تضامنا معها..الا أن بدريه البشر لم تخذلني فقد وقع في يدي أفضل ملخص لما كتب حتى الأن، في تفسير عقلية التحريم وتأريخها وأسبابها<br />رغم أن الكتاب يتناول التفاعلات وردود فعل المجتمع السعودي تجاه المسلسل الكوميدي طاش ما طاش ، الا أن الفصل الأول من الكتاب هو أروع جزء فيه، وينصح بقراءته لكل سلفي قصّر من ثوبه وأطال من لحيته وحمل السواك يلوكه عشية وضحاها كالمعتوه..أنه كتاب يقول لكل سلفي بصراحه: كم أنت عبيط<br />تتناول بدريه البشر موضوع ذهنية التحريم في المملكه بلغة مباشرة وسلسه، سهلة القراءة لا تتخفى خلف اللغه الأكاديميه والتوريه التي يتصارع معها كتاّب المملكه من الليبراليين واصحاب الخط الأصلاحي ، والتي ذكرتني بحالي - عندما قلت طز في الأزمنه العربيه- وشكرا لنصيحة آيا<br />وقف الأصوليون السلفيون من التعليم موقفا صعبا على إعتبار أنه المؤشر الأخطر للتغيير الذي دخل المجتمع، الذي لم يعهدوا قبله ، الاّ تعلم العلوم الدينيه من حفظ للقرآن والفقه والحديث، وقد كانت لشيوخ الدين منذ فترة تأسيس المملكة العربية السعوديه حتى يومنا هذا مواقف متعنته ومتشدده حيال مظاهره، حيث كان المعلم الوافد للمدن والقرى يحارب وينبذ، ويشدد على تجار السلع الا يبيعوه ومع تقدم الوقت ظهرت مواقف مشابهه كلها تتفق مع أصحاب هذه الذهنيه كانوا يجابهون كل ما أختلف عنهم بالمنع والمصادرة والتكفير<br />في شرح الكاتبه لتاريخ هذه الذهنيه يتبادر الى الذهن حقيقة أن التهديد مستمر لكيان المملكة السعوديه السياسي من قبل التسلط الديني منذ إنشاءها وأن حكومتها و المتنورين من شعبها ليس لديهم الا خيار واحد..هو تحديث المجتمع والعمل على نسف الوهابيه من أساسها، وأقتلاعها من جذورها والا فأن المصير الذي ينتظرهم وينتظر بلاد الرمال مظلم جدا<br />لامفر من المواجهة الداميه يوما ما مع هذه الآفه الخطيره ، الأمر الذي لابد أن سيحدث يوم ما. يتضح من السرد التاريخي الذي سألخصه لكم من الكتاب بأن حكام السعوديه يقومون طوال تاريخهم بمهادنة أفعى كانت وماتزال تسعى لتصفية ملكهم وتدمير مستقبل الأجيال في هذا البلد حالما تحين لها الفرصه، لقد كان الأسلوب الذي تعاطت به الحكومه السعوديه مع هذه المشكله هو إما تسليطهم على الشعب ..وإما تصدير هذا الخطر الى الخارج لتشتيته.. و أبعاده عنهم وذلك عن طريق مراكز الدعوه والإرشاد..و أخي صلعم يعرف ما فعلوا في شارقتنا الأبيه<br />كان جوهر هذه الحركه يقوم على الحفاظ على \" طهارة\" هذا البلد وهذا الكيان السياسي الذي أسسوه على الفكر التطهيري الجامد للأهبل السيكوباثي محمد بن عبد الوهاب- ليس الموسيقار بل عكسه تماما- . وهذا الهدف لم يتغير يوما وهاهو أسامه بن لادن يكرر بأن أهداف تنظيمه هو إخراج المشركين من جزيرة العرب ، بن لادن هو استنساخ لمسخ فرنكشتايني سابق..اسمه جهيمان العتيبي، سيأتي ذكره، بعد قليل<br />في حزيرن يونيو 1930 إحتج العلماء على إدراج مواد مثل الجغرافيا واللغات الأجنبيه والتخطيط الهندسي في مناهج مديرية المعارف المؤسسه حديثا، وزعموا أن التخطيط الهندسي هو تصاوير بكل حال، أما اللغات فاعتبروها وسيلة لمعرفة الأفكار الدينيه للمشركين وأثارت الجغرافيا بالذات نقمتهم لقولها بكروية اللأرض والذي إستمر إعتبار ذلك كفرا حتى أواخر القرن العشرين<br />كانت بدايات السلفيه في ظهور حركة تسمى حركة الأخوان- ليس لها علاقه بالأخوان المسلمين بمصر-1921-1927 وهي حركة سريه أنتشرت بين البدو لا أحد يعرف من وراءها، البعض يعتقد أن ورائها مؤسسين روحيين هم قاضي الرياض المدعو عبدالله آل الشيخ وقاضي الأحساء المعروف بالشيخ عيسى والمدعو عبد الكريم المغربي-مجهول الأصل- ..وكانت الحركة تتكسب بالغزو والسلب والنهب وقد حول الملك عبد العزيز هذه الى حركة مستقره بعد تجربته مع البدو الذين تخلو عنه وانضموا الى حملة إبراهيم باشا المصريه التي دمرت الدولة السعوديه الوهابيه الأولى<br />الأسلوب الذي إعتمد عليه الملك عبدالعزيز مع حركة الأخوان هو مفهوم \" الهجر\" بمعنى أن الأخوان يهجرون حياة القبيله وإنتمائهم لها، الى حركة التوحيد الوهابيه، وهو ما يحاكى إنتقال المهاجرين من مكه الى المدينه من دار لأخرى من دار شرك.. الى دار الأيمان الحقيقي. الى التخلى عن الحياة بين المشركين والكفره، والهجره الى أرض الطهاره ، تصرف معروف عند الجماعات الدينيه المتطرفه سواء التكفيريه الإسلاميه مثل هجرة بن لادن الى أفغانستان.. أم تلك التي نشأت في الخارج بما فيهم جيم جونز<br />الذى هاجر من الولايات المتحده الى غيانا الأستوائيه بأمريكا الوسطى، قبل أن ينتحر مع مائة وتسعين من أتباعه مع أطفالهم<br />كان الأخوان يلبسون العمائم البيضاء ويحلقون شواربهم ويطيلون من لحاهم التي يصبغونها بالحناء ويلبسون ثيابا قصيره تصل الى ركبهم أحيانا - مفكرين نفسهم رويدا المحروقي- وكانوا يحرّمون كل آلة موسيقيه ولم يشربوا القهوة لأنها غير معروفة أيام النبي صلعم وتحاشوا التدخين وكانه السم<br />إستخدم الملك عبد العزيز هؤلاء البدو الذين عرفوا أنفسهم بأسم الأخوان في الأستيلاء على الجزيرة العربيه. كان الأخوان يغيرون كذلك على شيعة العراق بأعتبارهم من المشركين<br />بعد سقوط الحجاز والأحساء في يدهم أخذ الأخوان في فرض الشريعة بالقوة وبقسوة لم تعهد من قبل وبطريقة عنيفه وبدون رحمه حتى ضرب بهم المثل وعم صيت قساوتهم وسذاجتهم الأفاق . أراد الملك الجديد عبدالعزيز أحتواء ُحكمه بدون إستثارة الأخوان فأسس جماعة الأمر بالمعروف والنهى عن المنكر. أعتبرالأخوان أن هذا تقليص من سيطرتهم فانقلبوا على الملك بحجة سفره للعلاج الى بلد مشرك..هو مصر<br />كانت معركة السبله وهزيمة الأخوان هي نهاية حركتهم كوجود سياسي..الا أنها لم تمت ابدا في ذهنية من جاء من بعدهم<br />عيّن الملك عبدالعزيز بعد ذلك فئة من الشيوخ والعلماء ليكونوا الجناح الثاني للحكم وكانوا يبادلونه الطاعه مقابل أخذه بالمبدأ الوهابي في حكم البلاد الجديده. ولكن كلما خطط الملك لأي تحديث، كلما عادت ذهنية التوجس والتحريم وقد ُأحرقت بالأحساء أول سياره شاحنة وصلت للمملكة السعوديه بأعتبار أنها من عمل الشيطان، ولم يكن الراديو والتلفزيون والكهرباء او الطائره.. بأفضل حال<br />في نوفمبر 1979 فوجئت السعوديه بحركة جهيمان العتيبي التي أستولت على الحرم المكي، بينما فشلت مجموعة تابعه له من الأستيلاء على الحرم المدني بعد معركة قتل فيها 250 شخصا كان بينهم يمنيون و مصريون وكويتيون. مع كثير من التعتيم على أسباب هذه الحركه الا أن بدريه البشر توضح أنها إنتفاضة ضد التغيير الذي كان هدفه تطهير المملكة من الفسوق ، حسب زعمهم وأخراج المشركين- الأجانب- من أرض الجزيره. جهيمان العتيبي كان ناشطا في الحركة السلفيه التي خرجت من تحت عباءة تعاليم الشيخ عبدالعزيز بن باز الدجال الأكبر و الذي كان يشغل منصب رئيس الجامعة الأسلاميه بالمدينه، ليتم أقتحام الحرم برضى السلطه الدينيه بعد الأتفاق على منع دور السينما وظهور المذيعات ولو محجبات على شاشة التلفزيون ومنع بث أغاني أم كلثوم وفيروز في التلفزيون ..وأطلاق يد هيئة الحسبه المسماه الأمر بالمعروف والنهي عن المنكر في مطاردة الناس والتنكيل بهم بأسم السلفيه . جهيمان لم يكن الا أعادة أستنساخ ذلك المسخ.. فرانكشتاين الذي بدأه الأخوان<br />بعد القضاء على الحركة الجهيمانيه وبعد سقوط أفعانستان بيد الشيوعيون ودخول القوات السوفييتيه لدعم الحكومه ضد مجموعات المجاهدين الذين كانت الولايات المتحده تسميهم مقاتلين من أجل الحريه! ولدت حركة الصحوه السلفيه التي كان من أبرز قادتها المليونير السعودي، اليمني الأصل اسامه بن لادن. ساهمت الحكومات الخليجيه والسي أن أيه بدعم هذه الحركه وتشجيعها وتشجيع الشباب العربي للهجرة الى أفغانستان والجهاد والذي أنتهى بوصول طالبان للحكم وتأسيس حكومه إسلاميه سلفيه مطهره. كانت حكومة الطالبان نموذجا في التشدد مشابها لحركة الأخوان التطهيريه في السعوديه الحلم الذي تمناه كل الظلاميون من خفافيش السلف.. وكأنها ولدت من جديد، السلفيه في أرض قبليه مشابهة للسعوديه. وظهر بن لادن مستنسخا جهيمان واسلافه من الأخوان<br />أستغلت حركة الصحوه الأسلاميه هذه وما أنبثق عنها بما يسمى القاعده تحرير الكويت على يد القوات الدوليه بقيادة أمريكيه وأعتبرت أن ذلك مخالف لأمر صلعم من تحريم دخول المشركين الأجانب ومن المسلمين الغيرملتزمين بمنهج السلف الطالح الى أرض الجزيره..نفس الهاجس السيكوباثي التطهيري الذي يسيطر على هذه الذهنيه منذ بداية حركة الأخوان<br />ثم تظهر حركات متشددة وأكثر تعنتا فالحركة السروريه وحركة سعد فقيه ، أمير المؤمنين السلفيين الأكثر تعصبا من اي حركه سلفيه في العالم، واين؟ .. في حماية الحكومه البريطانيه في لندن ..كلها حركات إستنساخ وأعادة ولاده لفرانكشتاين..و لنفس الذهنيه التحريميه المريضه<br />مثلت هجمات الحادي من سبتمبر 2001 منعطفا جديدا بنقل الحرب ضد الأسلام التطهيري الى مستوى العالميه، والذي مازالت هذه الحركات تهدف منه الى أبعاد الغرب والعالم وتحييدهم عن مساعدة أو تحديث المملكة ليستفردوا بها وليقوموا بتطهيرها سلفيا..فالهدف لم يتغير منذ البدايه<br />قامت الحركات السلفيه الجديده بأسم القاعده بجرائم ضد الأنسانيه والأمنين لم يسجل مثلها التاريخ منذ جنكيز خان فقامت بتفجير مجمعات سكنيه في السعوديه وتفجير قطارات وباصات وأنتحارات العراق اليوميه التي تتنافس في عدد الأبرياء القتلى ولم تترك طفلا ولا إمرأة ولا مسلما من غيره..أخرجت الى الوجود ثقافة الأنتحار الأسلامي بحث أصبحت السلفيه هي أبغض وأسوء ماعرف العالم ، اكثر من النازيه و أسوء من الحركات الفوضوييه التى عمت العالم قبل الحرب العالميه الأول..أنها لاتعرف الرحمه ابدا، و لن تمانع قطع رقبة اي إنسان.....من أجل الظهور في الأعلام<br />أن أكثر الأشياء خطورة هي وضع مقدرات الناس تحت تفكير أخرق مثل السلفيه<br />الكتاب لايخلو من قفشات كوميديه تثير الضحك وخاصة عندما تعدد الكاتبه سلسلة مطالب المحرمات التي ينادي بها أصحاب السلفيه وهذا بعض منها<br />تحريم الملاهي والتنزه<br />تحريم لعب الكره لأنها أنتقلت للمسلمين من الغرب وأنها من التشبه بالكفار<br />التلفزيون بلاء وشر يدعو الى الرذيله<br />الغناء بالغوا في تحريمه حتى ضرب الدفوف<br />أعتبروا التدخين من المسكرات<br />تحريم التصوير لكل ماله ظل وما ليس له ظل وجعلوه اصل الشرك<br />تحريم لباس الشرطه لأنه تشبه بالأفرنج<br />منع القبائل العراقيه والأردنيه من الرعي داخل المملكه على أنهم مشركين<br />تحريم التجاره مع الكويت<br />تحريم لبس البرنيطه<br />تحريم لبس البنطلون<br />تحريم السفر الى بانكوك ودبي<br />تحريم التحيه العسكريه<br />تحريم التصفيق لأنه ابشع المنكرات ويدل على التخنث<br />الفرق السلفيه تسمى نفسها أهل السنه والجماعه والفرقة الناجيه وأهل الأجماع و أهل الأثر وأهل الحديث والطائفة المنصوره، يستحقون وبكل جداره أن نضيف الى ألقابهم بعد قراءة هذا الكتاب..أهل جنون البقر<br />أن من يقرء الفصل الأول من كتاب بدريه البشر سيدرك مدى السذاجة و الغباء والسطحيه التي تقوم عليها السلفيه الدينيه الأسلاميه..سيعرف انها ليست أكثر من مجرد مرض نفسي . السلفيه لاتدعوا للخير أبدا.. بل هي في الواقع أحد مصادر الشرور في بلاد الرمال ، وفي العالم أجمع<br />بن كريشان"
