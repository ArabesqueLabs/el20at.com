text = "مرشدي الحجاج الاردنية من الاخباش الهرريه الذين يتبعون الحبشي الكذاب الذي فيه فتوى تحريم من الازهر وابن باز<br />= الاحباش ضللوا الحجاج ومنعوهم من المبيت بمنى علما ان هؤلاء يسيطرون ع وزارة الاوقاف الاردنية وتفجرت فضيحة بيعهم فيز الحج<br />=======ادخلوا ع موقع (((((((((منتدى مكافحة الاحباش)))))))) واعرفوا حقيقة هؤلاء الباطنية قتلة الحريري والشيخ حسن خالد مفتي لبنان السني"
