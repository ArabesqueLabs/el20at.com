[[comments]]
order = 0
subject = "من حقهم يعملوا اى اعلانات من فلوسنا"
author = "مواطن من المخروبة"
text = "شركات المياة الغازية البيبسى والكوكاكولا وغيرها كانت ملك الدولة وكان دخلها بيدخل خزينة الدولة - يعنى قزازة البيبسى بتتكلف مياة وصودا وسكر وشوية كولا بحوالى 15 قرش ويبيعوها ب 60 قرش والمكسب فيها عالى جدا ومضمون وسهل<br />راحوا الحرامية بتوع لجنة السياسات باعوها<br />وبتكسب ملايين<br />والملايين دى بتطير على برة على البنوك بتاعتهم<br />وبعد كدة الحرامية يفرضوا ضرايب على المعدمين - قال اية - ضرايب على العقارات - وكل واحد ساكن فى خرابة يدفع عليها ضرايب عقارية - العيال الحرامية جايبين قوانين الضرايب الامريكية وعايزين يطبقوة هنا فى وسط الفقر وطوابير الخبز علشان يجيبوا دخل للدولة<br />والدولة زى العالم كلة ما بيقرأ فى التلفيفزيونات - اعتقالات فى الفيوم - اعتقالات فى الاسكندرية - يوميا فية اعتقالات<br />فى نشرات العالم - الدولة الوحيدة اللى فيها اعتقالات هى مصر<br />ولما البرلمان الاروبى يتكلم - الحرامية يهيجوا وابوالغيط وابو حمار وابو مقطف يقفوا على الترعة وينهقوا<br />خربتوها بدرى بدرى<br />بيبسى قال"
archived = "2008-01-28"
capture_url = "https://web.archive.org/web/20080128040351/http://masr.20at.com:80/newArticle.php?sid=13918"

