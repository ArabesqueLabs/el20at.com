[[comments]]
order = 1
subject = "(أوساخ فى طهارة الثوب الابيض)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-17"
text = "تصرفات قذرة طائشة تصدر من صغار الضباط<br />لكنها للاسف الشديد تدنس من طهارة ثوب و نقاء الشرطة الابيض<br />رجاء للسيد اللواء /وزير الداخلية<br />الاهتمام بهذة التصرفات البربرية و القضاء على هذة التجاوزات ليس بالحلول الادارية بل باستخدام المطهرات الابدية من غزل و سجن و سحل و تشريد لهذة الفئة القليلة الضالة من ضعاف ضباط الشرطة الخارجين على القانون<br />انهم قذارة تحاول تدنيس ثوبكم الابيض"
archived = "2010-03-14"
