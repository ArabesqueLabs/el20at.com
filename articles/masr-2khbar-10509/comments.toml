[[comments]]
order = 0
subject = "اين المواطنة ؟ اين القانون ؟"
author = "مذعور"
posted = "2008-11-16"
text = "فى اى مادة من القانون فى اى مكان فى العالم وفى الدستور المصرى ان لو اجرم انسان وارتكب ابشع الجرائم انهم يربطوة فى سيارة ويسحلوة<br />ان كان دة مكتوب فى القانون وان السحل مباح يبقى رجال الشرطة ما قصروا<br />ثم اى قتل خطأ اللى القاضى حكم بية وهم تعمدوا ربطة فى السيارة وجرة على الاسفلت حتى الموت --- والا يمكن هو الا ربط نفسة فى السيارة ويمكن كان عايز ينتحر -----------<br />المشكلة فى القضاء الفاشل<br />لو القاضى حكم على القاتل بالاعدام يبقى الكل هيخاف<br />العيب مش فى رجل الشرطة - قد يكون رجل الشرطة ذو نزعة اجرامية زى اى مواطن ولكن اللى يوقف الحكاية دى القاضى<br />انما القضاة عندنا مشغولون بالسياسة وبالنادى وهم اللى عملوا التسيب والفوضى فى البلد<br />لو القاضى خبطة حكم كويس الباقى هيتلم<br />يظهر ان احنا عندنا قضاء فاسد<br />ومحدش يكلمنى عن نزاهة القضاء وبدنجان القضاء"
archived = "2010-03-14"
