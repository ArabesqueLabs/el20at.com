[[comments]]
order = 1
subject = ""
author = "المسلمين في الغرب"
posted = "2007-12-01"
text = "المسلمون في الغرب يعانون أشد المعاناة لدفن موتاهم إما من قلة المقابر او تعرضها لانتهاكات ونبش أو كتابة رموز عنصرية وغيرها<br />أما إذا كانت بلاد الحرمين تخصص لهم مقبرة فهذا والله كرم كالم لم يفتي العلماء بحرمته"
archived = "2010-12-28"
capture_url = "https://web.archive.org/web/20101228164321/http://www.20at.com:80/20at/ana-saudi/7689.html"

[[comments]]
order = 2
subject = ""
author = "الرهينة"
posted = "2007-12-01"
text = "بالتاكيد يجب ازالة هذه المقبرةمن بلاد الحرمين لان هؤلاء النصارى سوف يتخذونها مسمار جحا ان لم يكن الان فسوف يكو ن لاحقا ولا نريد ابدا لبلاد الحرمين ان يكون بها نصارى ابدا فهى لنا حن المسلمين فقط …وكفاية الى عندنا فى مصر … وبكرة نلاقى اسرائيل بتطلب حقها فى مقبرة اليهود فى السعودية"
archived = "2010-12-28"
capture_url = "https://web.archive.org/web/20101228164321/http://www.20at.com:80/20at/ana-saudi/7689.html"

[[comments]]
order = 3
subject = ""
author = "حظاظا بظاظا"
posted = "2007-12-02"
text = "طز فى السعودية على المللك بتاعها على شعبها كلهم بقر بتوع ارهاب وهما اللى عاملين الوش اللى فى دماغ العالم<br />قال االحمار بيسال عن الاحكام الشرعية فى مقابر المسيحيين فى بلاد المسلمين طب متسال يابن الغبية عن حكم وجود الهندوس فى بلاد المسلمين لو عباقرة كنا قلنا ماشى لكن دول عمال وبياخدوا اكتر من المسلم المغلوب على امرة فى بلدة<br />ياجماعة السعودية دى كذبة كبيرة ومغلفة بالدين"
archived = "2010-12-28"
capture_url = "https://web.archive.org/web/20101228164321/http://www.20at.com:80/20at/ana-saudi/7689.html"

