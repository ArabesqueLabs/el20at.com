[[comments]]
order = 8
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-01-04"
text = "اولى اشكر هذا الطرح العاقل المتزن ولن ابدي رائيي فيه لان المعقبين اوفو ووفو<br />تعقيبي على من ادعا ان اسمه بلاد الحرمين وشيوخ الارهاب<br />مقابل هااولى والله انهم اشرف من اخلاقك انت تريد ان تفرق بين العرب والمسلمين باسلوبك هذا<br />اسلوبك المصري لا تدل اخلاقك عليه فلذالك اعلم انك لست مصري ولا تنتمي لمصر<br />ردك لا يمت للموضوع بصله<br />انا احترم الموقع واستغرب ان يترك ردك ولم يحذف لذالك اضع ؟؟؟؟؟؟؟؟ لماذا لم يحذر رد هذا الشخص وقلة ادبه على دوله وشعب وحكومه وشيوخ مسلمين<br />والله لو قال كلمه باي شيخ من باكستان ولا من الستغال لما رضينا بهذا لانه قلة ادب<br />اطلب من الموقع حذف تعقيب هذا الغبي او سوف ارسل الصفحه لحجب الموقع كله عن السعوديه"
archived = "2010-12-28"
capture_url = "https://web.archive.org/web/20101228164321/http://www.20at.com:80/20at/ana-saudi/7689.html"

