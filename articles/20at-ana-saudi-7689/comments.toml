text = "مش عارف ليه كل واحد جاهل يفتى فى مواضيع ليس له بها دراية زعلان يا خيشه من دفن المسيحين فى مقبرة جده ياراجل ده احسن ليكم يمكن ربنا يعمل باجساد هؤلاء القدديسين معجزات على ارضكم علشان ربنا ينور بصيرة اللى زيك قول امين ياشيخ"
