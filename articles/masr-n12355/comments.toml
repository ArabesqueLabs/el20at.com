subject = "اعتذار من الموقع لعماد الكبير"
author = "كريم"
posted = "2007-11-11"
text = "المفروض الموقع المحترم ده يقدم اعتذار باسم عماد الكبير<br />وكمان الموضوع يتشال من هنا<br />ده فعلا لو ولاد طلعوا ولاد بلد بجد<br />وقبلوا ان الموضوع يتكتب هنا<br />يا ولاد البلد ياجدعان يالى العيب مش يطلع منكم"
archived = "2007-11-13"
