text = "شكرا للتوضيح<br />اتابع مقالات ولاد البلد<br />اصبحت كتابة دعاء الشامى تثير انتباة الناس بشدة معها او ضدها يعنى هناك تفاعل مع الكلام<br />يعنى باختصار بداية النجاح<br />ان الناس تنجذب لمقالاتك<br />الى الامام دعاء ربنا معاكى"
