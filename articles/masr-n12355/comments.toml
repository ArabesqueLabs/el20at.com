[[comments]]
order = 12
subject = "هل من حقي ارد؟"
author = "دعاء الشامي"
posted = "2007-11-11"
text = "السلام عليكم ورحمة الله وبركاته، انا بصراحة قررت اعلق لان الاخوة المعلقين اتفقول في فهم محدد للرسالة والهدف من الموضوع وللاسف الشديد هو فهم خاطيء فيما عدا البعض طبعا انا لا اعمم ولكن اقول معظم المعلقين حتى اكون منصفة ، بصراحة يا جماع انا عندي ردود لو يتسع صدركم لها اكون شاكرة جدا لكم:<br />اولا : انا لم اقصد اهانة عماد البمرة بالعكس فهو شخص احترمه واقدر ما مر به واقف بجانبه واتصلت به شخصيا لاهنئه على الحكم ولكن هدفي من الموضوع وصل لشخص واحد فقط وهو اني شايفه ان الضابط لم ياخذ الجزاء الرادع وعماد حيح اخذ حقه لكن ليس كاملا<br />ثانيا: لا يعني الحكم على الضابط ان الدنيا فل الفل لان هناك جانب معنوي لم يتم التعويض عنه وهو جزء شائك حتى بالنسبة لغير المتعلمة وليس للمتعلمة فقط<br />ثالثا: انا لم اورد اي كلمة على لساني سوى المقدمة والسطرين الاخيرين وهو مقصدي بالضبط(إذا كانت قضية عماد القانونية قد انتهت بالفعل وكانت آخر مراحلها ساحات المحاكم إلا أن القضية لازلت مستمرة في الواقع لان حياته من المفترض أن تبقى طبيعية وعادية برغم إن ما حدث له غير طبيعي.) فاين الاهانة هنا؟<br />رابعا:لم اتحدث في الموضوع من تلقاء نفسي ولكنه اثير في جلسة اصدقاء وبالفعل اجابات البنات كانت كلها رايحة في اتجاه واحد انا نزلت الشارع وسالت بنات جامعيات وموظفات وطبيب نفسي وعماد شخصيا وبالتالي لم اقصد اهانته<br />خامسا: مع احترامي لكلك من اختلف معي الا ان الموضوع يستحق الطرح لانها كرامة انسان اهين وسكوتنا عنه واتفاقنا مع الموجه السايرة انه خد حقه ويسكت بقى هو شء غير مقبول<br />اما بقى السؤال بتاع تتجوزيه ولا لا فانا لحسن الحظ بره السؤال خالص لاني متجوزة"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113112003/http://masr.20at.com:80/newArticle.php?sid=12355"

