[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "واحدة بتحب دعاء"
posted = "2007-11-10"
text = "موضوع وحش اوي ...انا آسفة يا دعاء لكن بجد مش عاجبنى التناول بطريقة اننا بنلومه على الشئ ده او بنوصمه بيه ....انا شايفة انه انسان محترم و احترم نفسه و بلده و مرضيش الاهانة و بلغ عن الظالم لغاية ما اخد حقه .<br />ده يستحق اننا نتعامل مع موضوع يتناوله بطريقة ارقى من كده شوية<br />اما لو كنتى تقصدي الموضوع في العموم فما كانش من المفروض تجيبى المثال شخص بعينه كان ممكن تخلى السؤال عام يعني \" تقبلى تتجوزي واحد اغتصب قبل كده ؟ \" و خلاص<br />مش علشان نعمل عنوان يشد الناس نجرح كرامة ناس تانية خاصة لو كانت الناس التانية دي مش ناقصة ....<br />اسفة لو طريقتى ضايقتك لكن انا بحب مقالتك هنا جدا و بتابعها و زعلت انك وقعتى في الفخ ده اللى بيقع فيه كتير من الصحفيين للأسف"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113112003/http://masr.20at.com:80/newArticle.php?sid=12355"

[[comments]]
order = 4
subject = "مش لازم الاسم ... ومش لازم الموضوع كله ..."
author = "محمد السيد"
posted = "2007-11-10"
text = "للأسف يا دعاء ....<br />تناولك للموضوع ..و لشخص عماد .. جاء بطريقة غير جيدة أبدا ....<br />زي التعليق اللي قبلي ... انت بتتكلمي بلهجة انها وصمة عار في تاريخه .. او إنه غلط لما أعلن الحكاية دي ... لأن ده حيفضحه وسط الناس ...<br />مش حلوة خالص طريقة كلامك يا أستاذة :-)<br />يارب مش حاسكت ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \"بس مش هي المشكلة\"<br />تقدروا تنورونا دلوقني ..مدونة مش حاسكت<br />http://mesh7askot.blogspot.com/<br />mohamedmat@hotmail.com"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113112003/http://masr.20at.com:80/newArticle.php?sid=12355"

