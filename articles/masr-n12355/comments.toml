[[comments]]
order = 0
subject = "ابنة عمة اوخالة"
author = "مصطفى"
posted = "2007-11-10"
text = "لا اعتقد ان واحدة متعلمة وترضى بية زوجا تمشى جانبة وواحد يقول لها مش هو دة اللى هتكوا عرضة ويعايروها بالراجل المنتهك عرضة<br />فى سلو بلدنا دا عار ما يغسلوش غير الدم<br />3 سنين سجن اية ؟<br />دا عايز بندقية الى فيها 36 طلقة ويتفرغوا فية<br />احنا شعب صعايدة لة عاداتة<br />يتشنق اة انما الشرف لا<br />حتة ضابط عيل ابن امة مش عارف تقاليد الناس اية<br />ولا واحدة عندها كرامة ترضى تتزوجة<br />اختارى مواضيع عدلة شوية يا اخت دعاء"
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110195825/http://masr.20at.com:80/newArticle.php?sid=12355"

[[comments]]
order = 1
subject = "عماد الكبير رجل في زمن انقرض فيه الرجال"
author = "اكتب اسمك هنا"
posted = "2007-11-10"
text = "حسب عماد الكبير انه قام بفعل قد يعجز عنه عشرات الرجال فتصديه للاجرام<br />وبحثه عن حقه رغم خطورة الطريق الذي مشي فيه ليدلل علي انه رجل قوي شجاع<br />سوف يكون نعم الرجل الحافظ الامين علي حقوق زوجته.قولكم بانه لن يجد زوجة ترضي<br />به ليس صحيحا وان كان فليس ذنبه.انما هو ذنب مفاهيم خاطئة لدينا.اننا بهذا نجعل الضابط<br />المجرم منتصر رغم وجوده في السجن.عماد مثل شريف وشجاع ينبغي ان يقلده كل مصري<br />حر.لا ان نتبرأ منه.فهذا عار علينا لو كنا نعقل."
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110195825/http://masr.20at.com:80/newArticle.php?sid=12355"

