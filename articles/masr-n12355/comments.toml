[[comments]]
order = 6
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-11-11"
text = "مش فاهمة ليه يا دعاء تدخلي اسم الراجل ده في الموضوع صحيح عنده حق اللي قال كان ممكن تقولي تتجوزي واحد مغتصب او معتدى عليه , لكن ليه نستغل ظروف الناس ونعمل فيهم كده ؟<br />وبعدين عماد الكبير مش مناضل سياسي , ده راجل محترم انتهكت الشرطة عرضه فسعى لأنه ياخد حقه , راجل غلبان وربنا أعانه على انه يقف في وش الظالم وخلاص ..يعني باختصار ربنا نصره .. ليه بقى رايحة تسألي واحدة طالبة في اعلام و البنات الساذجة عمالة تقول المستوى الاجتماعي و لأنه سواق ميكروباص ,,ليه اصلا نفتح موضوع زي ده ؟ ده حتى عماد نفسه حس بغباء السؤال !!!<br />فعلا يا دعاء الموضوع مش حلو خالص"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113112003/http://masr.20at.com:80/newArticle.php?sid=12355"

[[comments]]
order = 7
subject = "ايه القرف ده"
author = "اكتب اسمك هنا"
posted = "2007-11-11"
text = "يا اخي حرام عليكوا ايه الموضوع اللي مالوش لازمة ده؟؟؟ كفاية عماد اللي هو فيه خلاص بقى مادة خصبة للاقلام الفقيرة عشان تهيس و تكتب اي هفلطة؟؟ اتنيلوا اكتبوا عن مواضيع هادفة و كفاكم خوض في اعراض الناس"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113112003/http://masr.20at.com:80/newArticle.php?sid=12355"

[[comments]]
order = 8
subject = "الموضوع استفزاز"
author = "واحد مشاكس"
posted = "2007-11-11"
text = "الست دعاء بتستفز اعصاب الناس<br />بتخلينا نحس اد اية جرم الزابط دة وانة دمر انسان معنويا<br />الزبوط فاكر الناس حشرات او جمايس فى زريبة ابويا الحاج يحط العصايا فى اى حتة<br />القاضى حكم فى الجانب المادى اللى هو التعذيب انما الجانب المعنوى اللى هو الكرامة مالوش حساب عند القاضى<br />عماد لم بأخذ حقة كاملا وانما جزأ من الحق<br />شكرا يا دعاء<br />رسالتك وصلت<br />بس دة مكر فلاحى<br />انت فلاحة يا دعاء"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113112003/http://masr.20at.com:80/newArticle.php?sid=12355"

[[comments]]
order = 9
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-11-11"
text = "ياريت بجد تهتموا بالمواضيع اللى بتتكتب هنا<br />ارجعى لعقلك واكبرى بعقلك شويه<br />احنا شعب بيحب بعضه مش بيفرح فى بعضه<br />فكرى لو واحد زى عماد مثلا شاف الموضوع ده؟<br />تخيلى ايه احساسه بالظبط؟<br />مع احترامى ليكى وكلنا بشر لو كنتى انتى اللى نتهك حقك وشفتى الموضوع ده عليكى وباسمك<br />عيشى فى خيالك وشوفى احساسك هيكون ايه<br />وكفايه بجد كده<br />انا من زمان وانا بتابع الموقع لكن دلواقتى الواحد لازم يتأكد من المواضيع قبل ما يفكر فى اسم الموضوع"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113112003/http://masr.20at.com:80/newArticle.php?sid=12355"

