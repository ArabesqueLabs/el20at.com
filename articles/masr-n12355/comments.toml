[[comments]]
order = 15
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-11-13"
text = "اولا : انا لم اقصد اهانة عماد البمرة بالعكس فهو شخص احترمه واقدر ما مر به واقف بجانبه واتصلت به شخصيا لاهنئه على الحكم ولكن هدفي من الموضوع وصل لشخص واحد فقط وهو اني شايفه ان الضابط لم ياخذ الجزاء الرادع وعماد حيح اخذ حقه لكن ليس كاملا<br />انتى شايفه ان كلامك ده وطرحك للموضوع والعنوان مناسب لكلامك ده يا مدام دعاء ؟<br />وايه جاب العنوان للحكم على الضابط المسؤول؟<br />ايه جاب العنوان والموضوع ان عماد مش خد حقه كامل؟<br />لو انتى فعلا مش تقصدى اهانه لعماد يبئا طريقتك مش جيده فى التعبير عن اللى تقصديه ومحتاجه<br />انك تزودى اسلوبك بالطريقه المناسبه للتعبير عن اى موضوع<br />اه صحيح لو مش كنتى متزوجه<br />ممكن تتجوزى عماد الكبير ؟"
archived = "2007-11-13"
capture_url = "https://web.archive.org/web/20071113112003/http://masr.20at.com:80/newArticle.php?sid=12355"
