posted = "2009-01-12"
text = "ياجماعة أيه مشكلتكم؟ الطائرات الأسرائيلية طارت فوق سيناء... دى مش مهمة أبدا .. دى حاجة بسيطة... المهم المهم... أنها بعيدة عن جمهورية شرم الشيخ ... بعيد بعيد عن رئيس جمهورية شرم الشيخ .. على فكرة الجنرال وزير الدفاع بيقول لكم أتكلموا بشويش لحسن الباشا يصحى من النوم... رحمة الله على شهداء مصر الذين أرتوت بدمائهم الزكية رمال سيناء ."
