order = 0
subject = "(الحل هو حكومة اصلاح عسكرية9تضرب بيد من حديد  لفرض"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-21"
text = "هذة المشاكل المتراكمة او التى تطلقون عليها الكوارث ما هى الا نتاج حكومات ديمقراطية ضعيفة؟<br />الحل هو تشكيل حكومة اصلاح عسكرية لاصلاح الخلل الادارى الذى اصبح متفشى فى النظام الادارى لسير الامور فى الدولة<br />هذة الحكومة يجب ان تكون كلها من العسكريين الشرفاء و هذا القتراح يجب ان يكون للتنفيذ و ليس للدراسة<br />كفى اسناد رئاسة الحكومة و الوزارات الى رجال بيراقطيون من زوى الياقات البيضاء؟<br />نريد حكومة عسكرية تضرب بيد من حديد على كافة صور الفساد الادارى بكافة انواعة الظاهرة و المستترة؟!<br />من اجل مصر و النظام و الشعب"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011095231/http://masr.20at.com:80/newArticle.php?sid=17628"
