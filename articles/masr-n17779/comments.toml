[[comments]]
order = 4
subject = "كذاب ياخيشة"
author = "المصرى أفندى"
text = "أمام الكاميرات وعللى الميكروفون ياواد يابلية.عملتوا أيه؟ حررنا الرهائن يافندم.. والناس اللى خطفوهم؟ صفينا نصهم وقشرنا نصهم!! طب ماجيبتوش واحد ولا أثنين نستجوبهم بعد العملية الأنتحارية الكوماندوزية دى !! طب حتى عشان نقدر نمنع أن ده يحصل ثانى.. لأ .. عارفين ليه ؟ علشان العيال أصلا سابوهم يمشوا فى الصحراء لحد ما لقوا عساكر فى وشهم بالصدفة بعد كذا ساعة !! والغريب أن قواتنا المسلحة الباسلة مش محتاجة دعاية عن طريق الكذب يعنى غير مضطرين لذلك. والعالم كلة سيحترمك لما تقول العيال خافوا من قواتنا وسابوا الرهائن يمشوا قبل أحنا مانوصل.. فيها أيه دى ياعم الحاج.. أقوللك ليه علشان الناس لازم تحس أن البلد لسه فيها أنجازات شغالة ورامبو لسه بيحكمنا.. بس رامبو نسى أنه فضحنا وفضح نفسه ومرمط بينا الأرض على الفضائيات والأنترنت !! نسى أن العالم أصبح قرية صغيرة وأن كل شيجن أنكشفن وبان اليوم أو بكرة !! عارفين ليه لأنه ووزيره بيقعدوا على المصطبة بالليل يحكوا حواديت لأحفادهم قبل ما يناموا.... وعليه العوض فيكى يامصر.. حسبنا الله ونعم الوكيل"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011094808/http://masr.20at.com:80/newArticle.php?sid=17779"

[[comments]]
order = 5
subject = "امل دنقل - وقصيدة العسكريون"
author = "ام امل"
text = "قلت لكم فى السنة البعيدة<br />عن خطر العسكريون<br />عن قلبهم الاعمى وعن همتهم القعيدة<br />يحرس من يمنحة راتبة الشهرى<br />وزية الرسمى<br />ليرهب الخصوم بالجعجعة الجوفاء<br />والقعقعة الشديدة<br />لكنة ان يحن الموت<br />فداء الوطن المقهور والعقيدة<br />فر من الميدان<br />وحاصر السلطان<br />واغتصب الكرسى<br />واعلن الثورة فى المذياع والجريدة"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011094808/http://masr.20at.com:80/newArticle.php?sid=17779"

[[comments]]
order = 6
subject = "ضباط 50 % ثانوية عامة - شرطة او جيش"
author = "تامر"
text = "دايما بييجوا من الكفور والنجوع والقرى من وسط فقير<br />اول حاجة بيعملها لما يبقى ضابط انة يشترى نظارة بيرسول سوداء وبيلبسها بالليل والنهار وومكن تتعرف عليهم بسهولة فى الشوارع بدون زى رسمى - قفا طويل ونظارة شمسية بيرسول سوداء<br />الهدف التانى لاى ضابط جاى من الكفر<br />انة يسكن فى مصر الجديدة او مدينة نصر<br />لذلك هتلاقى معظم ضباطنا ساكنين فى مدينة نصر او مصر الجديدة<br />وبعدين تقولوا حرب وتحرير رهائن<br />رهائن مين"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011094808/http://masr.20at.com:80/newArticle.php?sid=17779"
