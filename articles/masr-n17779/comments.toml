[[comments]]
order = 1
subject = "الكدابين الثلاثة وحزب الكذب الوطنى"
author = "الاستاذ \\\\ الزناتى خليفة"
text = "من عشرة ايام وزير الخارجية المصرى ابو الغيط وفى حضور الست كوندى صرح انة تم الافراج عن المختطفين وانهم بصحة جيدة وسلام -- بعدها بساعتين نفت الخارجية الخبر الذى اذيع تليفوزينيا وقالت دة كلام مش مضبوط<br />بعدها بعشرة ايام السيد\\\\ المشير وفى اذاعة على الهواء قال للسيد الرئيس مبروك ياريس خلصنا المختطفين وقتلنا نصفهم<br />وهيص الحضور مبروك يا ريس<br />المستويات القيادية العليا دى بتكذب لية<br />وبيكذبوا على مين ؟<br />ومين اصلا بيصدقهم ؟<br />اذا كانت القيادات بتكذب على بعضها<br />السؤال الملح<br />هل يقدر او فى مقدور السيد الرئيس ان يغير تلك الوزارة - او ان الامور خرجت من ايدة<br />محدش عارف<br />انما شكل البلد بقى اخر مسخرة"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011094808/http://masr.20at.com:80/newArticle.php?sid=17779"

[[comments]]
order = 2
subject = "الجيش المصرى المفترى علية"
author = "مش لاعب"
text = "وظيفة الجيش فى اى دولة فى العالم هى القتال والتدرب على القتال وعمل المناورات والجاهزية القتالية فى لحظة<br />ثم تقوم الدولة بتسليحة بسلاح- حديث يتطور مع الوقت<br />ولكن المراقب فى الوضع المصرى يرى العجب العجاب<br />حدثت ازمة فى رغيف العيش نتيجة فساد وضعف ادارة وزارة التموين او الضمان الاجتماعى فتم تكليف الجيش ليخبز الخبيز ويحضر الرغيف ويوزعة وترك شؤون القتال والتدريب والتسليح<br />حدثت حريقة فى مجلس الشورى نتيجة اهمال جسيم وقصور فى جهاز الدفاع المدنى فتم استدعاء الجيش ليطفى الحرايق<br />وكذلك تم استدعائة فى الدويقة<br />ويتم تكليفة برصف الطرق وعمل كبارى<br />وابتعد الجيش عن امور القتال والتدريب<br />والنتيجة سيادة المشير يكذب امام الاعلام العالمى"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011094808/http://masr.20at.com:80/newArticle.php?sid=17779"

