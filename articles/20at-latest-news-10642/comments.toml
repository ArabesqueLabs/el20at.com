subject = "إعجاز العلمي في القرآن الكريم و السنة الشريفة"
author = "الشيخ الشكسي"
posted = "2008-12-01"
text = "إن كل الأبحاث العلمية الحديثة تأكد إعجاز القرآن و السنة فإن الاكتشافات التي تذهل الغربيين مذكورة في الإسلام منذ 1400 سنة فقد عملوا عشرات السنين ليصلوا إلى حقيقة أن الوجبات السريعة تضر بالجسد و العقل حقيقة مذكورة في الحديث النبوي الشهير قبل أربعة عشر قرنا . يالغباء الكفار .<br />و السلام عليكم و رحمة الله و بركاته ."
archived = "2010-03-14"
