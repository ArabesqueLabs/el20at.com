subject = "آكلة ومتابعة للوجبات الجاهزة"
author = "بأكلها من وقت للتانى"
posted = "2008-12-03"
text = "هو بصراحة الواحد مش عارف يعمل ايه فى عدم إستطاعتنا التنازل عن تناول الوجبات الجاهزة ده بتكون داخلة فى نظام حياتنا بشكل أساسى طبعا<br />ولا كمان غالية وبتضرنا نحاول بقى على قد منقدر حطه لينا البدائل يا جماعة الله يفتح عليكم"
