[[comments]]
order = 3
subject = ""
author = "الادارة الحديثة"
posted = "2009-12-04"
text = "مشكلتنا فى مصر هى الادارة<br />ا الموظف بيروح الشغل يقعد على المكتب ومديرة قاعد فى مكتبة ولا يكلفة باى عمل وكل هم اى مدير هو الحضور والانصراف ومين حضر متاخر ومين غاب اليوم<br />والمدير العسكرى او قائد الوحدة او قائد المطار اول حاجة بيركز عليها الامن - امن الوحدة وامن المطار ويتفقد المطبخ وسجن الوحدة وغرفة السلاح وطابور الصباح ومفيش اى شغل<br />انما الدول التانية لا<br />اشتغلت فى شبابى مع شركة امريكية لمدة سنتين الشركة اسمها وستنجهاوس<br />تحضر فى الصباح من البيت مباشرة الى مكتب مدير الموقع ويسلمك ورقة مطبوعة باسمك فيها برنامج العمل اليومى بالساعة والدقيقة وماذا ستفعلة وماذا ستنجزة ؟<br />وتذهب الى مكان العمل فتجد كل الخامات والعدد ومتطلباتك كاملة فتبدا العمل بدون راحة الا وقت البريك او الراحة المخططة<br />فى نهاية اليوم الساعة الخامسة مساءا تعود الى الغرفة الملحقة بمكتب المدير ومعك الورقة لتخبر بما انجز وما لم ينجز والاسباب<br />برنامج عمل صارم ومحدد بالدقيقة والثانية وموظفى تنفيذ جدول الاعمل والتخطيط يتابعون بكل دقة<br />الموضوع موضوع ادارة<br />مش كلام وشعارات ونحن نيام وما بنعملشى حاجة<br />اظن ان البرادعى مدير"
archived = "2010-03-14"
capture_url = ""

