[[comments]]
order = 3
subject = "تزوير فى قسم شرطة الرحمانية"
author = "وائل"
posted = "2005-12-04"
text = "ى انتخابات المرحلة التانية فى مركز الرحمانية حصل تزوير فادح لمرشح اسمة جمال محمد عامر كان من الطبيعى ان يدخل اعادة مع النائب الحالىاشرف صهوان وهوة ليش تبع الحزب فيقدرة قادر ظهر مرشح الحزب واسمة احمد قرقورة اللذىلحد الساعة9 باليل كان واخد 3000 صوت ومشى باعلانة للناس انة سقط وفجأة وجدناة حاضر مرة تانية الساعة 7 الصبح ولاتنسى انة لحد الساعة 7 كانوا بيقولوا ان الاعادة بين اشرف صهوان فئات وبيفاضلوا بين جمال عامر مستفل وعصام محمود اخوان وفجاة الساعة8 االصبح بعد حضور مرشح الحزب احمد قرؤقورة وجدناة طالع ومبسوط وركب العربية ومشى وبعدها بخمس دقائق لقينا النتيجة اعادة بين اشرف صهوان فئات مستقل واحمد قرقورةفئات حزب وطنى كيف حرام ولا حلال مع العلم انة طلع على حساب المرشح جمال محمد عامر تخيلوا ب7000 صوت وجمال عامر 6900 صوت شوف النزاهة وصلت لحد فين مع العلم انة جايب 3000صوت فقط حصل ازاى وودخال ازاى اللة اعلم اتمنى ان تاتوا لى بالاجابة افيدونى افادكم اللة على هذة الافادة التى يقولونن عنها انهـــــــــــــاازهــــــى عصـــــــور الديمقراطية وانا اقولها انا ازهى عصور النصب والضحك على الدقون ملحوظة الحمد لللة ان المرشح اللى تبع الحزب سقط وبالضربة القاضية مع تحيات موطن ارفان من اللى بيحكموا بلدة"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234607/http://egyvote.20at.com:80/article.php?sid=101"

[[comments]]
order = 4
subject = "فضيحة المنصورة"
author = "وائل"
posted = "2005-12-05"
text = "فضيحة تزوير جديدة فى المنصورة )<br />إلي أهلنا الكرام و جموع شعبنا الأمين و مواطني المنصورة النبلاء ... نضع الحقيقة بين يديكم كما عشناها و عشتم معنا فيها في انتخابات مجلس الشعب دورة 2005 و ما حدث من فتراءات و ظلم لايتصوره بشر ..1- الإثنين 28\\11\\2005 : تم إلقاء القبض و الاعتقال علي أفراد الإخوان المسلمين للحيلولة بينهم وبين الناس . فيتم إضعاف مرشحي الإخوان و زعزعة المواطنين من حولهما .<br />2- الثلاثاء 29\\11\\2005 : استمرار إلقاء القبض علي افراد الإخوان و مداهمة منازلهم و ترويعهم و ترويع نسائهم و أطفالهم وانتهاك حرمة منازلهم بقصد شغلهم عن متابعة حملتهم الإنتخابية و فض الجماهير من حولهم لدرجة إغلاق المقار الإنتخابية للإخوان واعتقال القائمين عليها و هم يمارسون عملهم في المقار أو من منازلهم أو أعمالهم أو حيث يجدونهم .<br />3- الأربعاء 30\\11\\2005 : مع استمرار مسلسل الترويع و الإرهاب الذي تمارسه الشرطه إلي حد أن رجال الإخوان تركوا منازلهم ليفوتوا الفرصة علي الشرطة و أمن الدولة ليتمكنوا من التواجد يوم الإنتخاب لاستكمال مسيرتهم إلي الخير و لاستمرار في مشروع الإصلاح بلا يأس و لا تردد و مع كل ذلك الترويع و الإرهاب الذي يعيشه من يحملون شعار\" الإسلام هو الحل \" نحتسب ما نلقي عند الله و نحمل الخير لكل الناس . و إذا بالسيد مدير أمن الدقهلية يجتمع بقوي البطش من معاونيه و ضباطه ليلقي عليهم ما تلقاه من سادته : مطلوب القبض علي من تبقي من الإخوان و كذلك مناديب مرشحي الإخوان و مطلوب بالأمر السريع و المباشر ألا ينجح الإخوان واتخاذ كل الوسائل التي تضمن ذلك من اغلاق اللجان الإنتخابية و طرد المرشحين و مناديبهم في اللجان و إرهاب أي مواطن تحدثه نفسه أن يذهب إلي الإنتخابات و استخدام القوة و البطش في مواجهة ال<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234607/http://egyvote.20at.com:80/article.php?sid=101"

[[comments]]
order = 5
subject = "مرحلة سابقة لاوانها"
author = "مواطنة مصرية جدا"
posted = "2005-12-06"
text = "احظت نبرات الغضب فب كل التعليقات التي قرأتها عن العملية الانتخابية في مصر .. و تعجبت كثيرا .. هل السبب اننا تعودنا الاعتراض على طول الخط دون دراسة للاحداث ام هل اصبحنا لا نستطيع ان نعيش الا في دور الضحايا؟ .. هل كان هناك مخالفات في هذه التجربة الانتخابية؟؟ نعم و هذا مثبوت .. ولكن هذه ليست المشكلة الاساسية.. اس الداء اننا لا نعرف كيف نحكم انفسنا .. انها اول مرة في التاريخ .. بالضبط كما تطلب من طفل صغير ان يقود سيارة في وسط الطريق و تطلب منه الا يصدم احج او شيئ و ان يراعي قواعد المرور ... انك تطلب المستحيل .. الطبيعي ان نتعلم اولا اسس و قواعد المرور و قواعد القيادة ثم نتولى القيادة .. نحن شعب معزول عن الحياة السياسية .. نحن بلد بلا احزاب .. احزاب تلعب دور الماكيت .. بناء فارغ ليس له وجود في الشارع المصري .. اتحدى اي من المرشحين ان يشرح لي انه قد انتخب بناء على توجه فكري او بناء على برنامج انتخابي .. الناخبين اما ينتخبون شخص بحكم العادة او بحكم النعرة العرقية (اقصد الاخوان المسلمين) او لمن يدفع اكثر .. نحن في سنة اولى ديموقراطية .. فلنعمل اولا على محو الامية السياسية ثم حاسبوا من تجاوز .. الانتخابات في هذه المرحلة من حياتنا تجربة سابقة لاوانها .. نحن شعب غير ناضج سياسيا"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234607/http://egyvote.20at.com:80/article.php?sid=101"

[[comments]]
order = 6
subject = "الى الأخت المصريه"
author = "د/عمرو"
posted = "2005-12-10"
text = "نا مش عارف انت قصدق ايه بالظبط..... ما احنا قلنا نعمل ال علينا ونروح نتعلم السواقه ... راحت الحكومه مكسره العربيه<br />وبعدين ازاى مش عايزانا نعترض ونزعل وننفلق كمان واحنا شايفين الشرطه (حاميه الشعب)تقف بجانب نظام مستبد ضد الشعب المصرى (...ال رايح يتعلم السواقه) وتفعل به مايفعله اليهود بشعب فلسطين.<br />وازاى تعتبرى ان اختيارالناس للاخوان (نعره قوميه)ليه ده مايكونش اختيار ديمقراطى حر للاصلح وله علشان ده مش اختيارك يبقى (نعره)ولاالظاهر انك لسه متعلمتيش السواقه"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234607/http://egyvote.20at.com:80/article.php?sid=101"

[[comments]]
order = 7
subject = "هل هناك فرق بين الفرعون القديم والفرعون الجديد"
author = "مواطن مصرى من مملكة الفرعون"
posted = "2005-12-23"
text = "ان الفرعون المصرى القديم هو ورجاله وكهنته يمارسون السحر والقهر والذل من اجل الحكم والمصالح الشخصية ... وكانت حياة مصرية قديمة ..... واخذت تدور عجلة الحياة الى ما نحن عليها .... واخيراً تحول الفرعون من فرعو نالى ريس والكهنة الى الحكومة والعجلة الحربية الى مصفحة ومازالت الحياة تجرى و مازال الفرعون هو وكهنته المضللين يمارسون السحر والذل والشعوذة والسرقة ."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234607/http://egyvote.20at.com:80/article.php?sid=101"

[[comments]]
order = 8
subject = "اسلام قبطي"
author = "وديع ااحمد"
posted = "2006-08-10"
text = "صة أسلامي<br />بسم الله الرحمن الرحيم<br />* الحمد الله على نعمة الاسلام نعمة كبيرة لا تدانيها نعمة لأنه لم يعد على الأرض من يعبد الله وحده الا المسلمين.<br />* ولقد مررت برحلة طويلة قاربت 40 عاما الى أن هدانى الله وسوف أصف لكم مراحل هذه الرحلة من عمرى مرحلة مرحلة:-<br />مرحلة الطفولة:- ( زرع ثمار سوداء )<br />* كان أبى واعظا فى الاسكندرية فى جمعية أصدقاء الكتاب المقدس وكانت مهنته التبشير فى القرى المحيطة والمناطق الفقيرة لمحاولة جذب فقراء المسلمين الى المسيحية.<br />* وأصر أبى أن أنضم الى الشمامسة منذ أن كان عمرى ست سنوات وأن أنتظم فى دروس مدارس الأحد وهناك يزرعون بذور الحقد السوداء فى عقول الأطفال ومنها: -<br />1- المسلمون اغتصبوا مصر من المسيحين وعذبوا المسيحين.<br />2- المسلم أشد كفرا من البوذى وعابد البقر.<br />3- القرآن ليس كتاب الله ولكن محمد اخترعه.<br />4- المسلمين يضطهدون النصارى لكى يتركوا مصر ويهاجروا..... وغير ذلك من البذور التى تزرع الحقد الأسود ضد المسلمين فى قلوب الأطفال.<br />* وفى هذه الفترة المحرجة كان أبى يتكلم معنا سرا عن انحراف الكنائس عن المسيحية الحقيقية التى تحرم الصور والتماثيل والسجود للبطرك والاعتراف للقساوسة.<br />مرحلة الشباب ( نضوج ثمار الحقد الأسود )<br />أصبحت استاذا في مدارس الأحد و معلما للشمامسة وكان عمري 18 سنة وكان علي أن أحضر دروس الوعظ بالكنيسة والزيارة الدورية للأديرة ( خاصة في الصيف ) حيث يتم استدعاء متخصصين في مهاجمة الإسلام والنقد اللازع للقرآن ومحمد ( صلي الله علية وسلم ) .<br />* وما يقال في هذه الإجتماعات :<br />1- القرآن مليء بالمتناقضات ( ثم يذكروا نصف آية ) مثل ( ولا تقربوا الصلاة ...)<br />2- القرآن مليء بالألفاظ الجنسية ويفسرون كلمة ( نكاح<br />اقرأ بقية التعليق .."
archived = "2006-12-07"
capture_url = "https://web.archive.org/web/20061207192535/http://egyvote.20at.com:80/article.php?sid=101"

