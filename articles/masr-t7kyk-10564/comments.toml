[[comments]]
order = 1
subject = "علاقة فقر البلد والناس بملابس النساء"
author = "تح"
posted = "2008-11-21"
text = "انتشر الحجاب منذ 15 سنة فى مصر والتزمت غالبية السيدات والفتيات بالحجاب وكنت ترى النقاب نادرا جدا<br />مع ازدياد الفقر فى بر مصر وجوع الناس<br />اصبحت تسير فى الشارع ونسبة كبيرة فى ازدياد ترتدى النقاب وتخفى وجهها<br />للفقر نتائج تجعل الناس تهرب من حياتها<br />وعلى رأى اللى قال الناس خسرت الدنيا تبقى هتخسر الاخرة كمان<br />بينما الاقلية الاغنياء عيالهم بينزلوا البناطيل وسرتهم ومؤخرتهم باينة سواء رجالة او نسوان وناقص يمشوا فى الشوارع بالمايوهات<br />البلد بلدهم<br />واحنا مالنا خلينا مع النقاب"
archived = "2010-03-14"
