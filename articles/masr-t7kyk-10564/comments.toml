[[comments]]
order = 0
subject = "تحت عنوان كلمة رقيع"
author = "مش قايل"
posted = "2008-11-21"
text = "تلك المشاهد التى نراها لشبان يقلدون الشباب فى الغرب فى الهيافة وليتهم يقلدنوهم فى العلم والبحث والاجتهاد<br />فلربما كان الشاب الغربى يرتدى تلك الموضة من الناطيل ولكن تراة باحثا ومهتما بالعلم وجاد جدا فى عملة ولكن شبابنا يقلد الهيافات وبس<br />زمان كان فية فى الثانوى ومدارس الثانوى مادة اسمها التربية العسكرية او الفتوة وكانت بتخشن الشباب المايع شوية<br />انما بعد كامب ديفيد لغوها بناءا على طلب اسرائيل<br />ومطلوب تجنيد هؤلاء الشباب وتعليمهم شوية خشونة"
archived = "2010-03-14"
