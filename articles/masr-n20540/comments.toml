[[comments]]
order = 0
subject = "صحفى ذكر على قناة الساعة ان الامن اصدر تعليمات للمكتبات بعدم بيع ورق ابيض"
author = "45"
text = "تخيل الامن لف على المحلات والمكتبات للتنبية على اصحابها بعدم بيع ورق ابيض علشان محدش يكتب شعارات اثناء الاضراب وارسل تليفونيا رسائل الى كبار المشاركين فى الاضراب بتصفيتهم"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408073023/http://masr.20at.com:80/newArticle.php?sid=20540"

[[comments]]
order = 1
subject = "يا ترى كام مليون جنيه تم صرفها من قبل الامن والشعب على هذا التهريج"
author = "مش ضروري"
text = "كان مليون جنيه تم صرفها في يوم واحد على هذا التهريج<br />والبلد مليانه مرضى سرطان وفشل كلوي مش لاقيين يجيبوا الدوا<br />يا خسارة يا مصر"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408073023/http://masr.20at.com:80/newArticle.php?sid=20540"
