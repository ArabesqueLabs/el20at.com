[[comments]]
order = 1
subject = "التريقة مش لطيفة"
author = "أحمد حامد"
text = "اولا حركة مواطنون ضد الغلاء حركة شعبية جديدة و لكن بها الكثير من الاعضاء المهمين و حتي لو كان محمود العسقلانى هو العضو الوحيد في الحركة يبقى احنا كنا لازم نشكره علي انه انسان بيفكر في الشأن العام<br />و أسس حركة ضد سرطان الغلاء حتى لو كانت حاليا صغيرة أو ضعيفة لانها معندهاش موارد او معندهاش خبرة<br />يبقى ان علينا ان احنا ننقدها نقد بناء مش نقد تهكمى و بعدين احنا فعلا شعب غريب يعنى نقعد نقول ايه ده<br />مفيش حد فى البلد دى بيتكلم عن الغلا و القرف الى احنا فيه و لما ييجي حد يتكلم نقول عليه ده العضو الوحيد<br />في الحركة الى هو مؤسس ليها مع كل احترامي لرأيك انا اشكرك علي متابعة المحاكمة و أختلف معاك<br />في أسلوب عرض الموضوع<br />www.mdedalghalaa.org و ده موقع الحركة علشان تتعرف عليها و تعرف اعضائها من غير<br />ضحك ولا كركره لأن الموضوع مش مستاهل"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004226/http://masr.20at.com:80/newArticle.php?sid=14354"

[[comments]]
order = 2
subject = "انت افتكرت نفسك صحفي بجد"
author = "حسام الزمر"
text = "السلام عليكم<br />الاستاذ شريف<br />لا يصح التهكم على الناس اللي بتبذل وقتها للصالح العام بهذا الشكل<br />و يبدوا و انت تتكلم و كأنك صحفي متمرس و صاحب رأي و خبرة و تجربة و للأسف انت لست أي شئ من كل هذا<br />انت مجرد خريج حديث<br />و كل ما قلتة لا يمت لعلم الاعلام بأي شئ<br />رجاء استخدام اداب الحديث و احترام من يقدمون شيء لهذا البلد حتى و ان قل<br />سلام<br />حسام الزمر"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004226/http://masr.20at.com:80/newArticle.php?sid=14354"

[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "المغترب"
text = "من زمان وانا بشوف اغلب الناس اللى بتعلق على مقالات بتهزأك وتمسح بيك الأرض وكنت مستغرب ليه متحاملين عليك او جايز حد بينك وبينه مسائل شخصية<br />النهارده عرفت هما بيعلقوا ليه بالشكل ده على مقالات<br />لأنك بنى ادم مهزأ ومش محترم وأرجوز<br />فعلا انت انسان قذر يا دواخلى وشكلك بتشتغل بالليل صبى عالمة"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004226/http://masr.20at.com:80/newArticle.php?sid=14354"

[[comments]]
order = 4
subject = "تعليق علي التعليق"
author = "أحمد حامد"
text = "بعد يومين من نشر الموضوع و بعد تعليقي علي الموضوع ظهر تعليقين بعد تعليقي الاول \"التريقة مش لطيفة\"<br />و الحقيقة ان حبيت اعلق علي التعليقين دول حيث ان هما يعتبروا غلطوا في كاتب الموضوع و الحقيقه احنا<br />ممكن نختلف و ننقد بعض لكن بدون ما نزعل من بعض يعني لا يوجد داعي ان استاذ حسام الزمر<br />او المغترب او انا او اي حد ، ان احنا ننقد بحده شخص الكاتب ،، احنا ممكن ننقد بحده رأيه وافكاره لكن<br />مش معقول ان احنا نقول عليه \"انسان قذر\" او \"مجرد خريج\" و كأن الخريج ده حاجه بسيطه أو قليله<br />انا من وجهة نظرى ان الكاتب غلط في نقله لاحداث المحكمه لان ابسط حاجة انه مكنش موضوعي في<br />نقله لاحداث محاكمة و خصوصا ان الموضوع منشور علي انه تحقيق مش مقال و ده مقال ذاتي و لا يحمل<br />اي صفات التحقيق الصحفي من موضوعية و توازن و ده من الجهة الصحفية اما من الجهة الاجتماعية أو السياسية<br />فانا طبعا لم يعجبنى التريقة علي القائمين بالمحاكمة و خاصة ان فكرة المحاكمة الشعبية التي تناقش<br />موضوع مهم زي غلاء الحديد كان لا بد من شكر اصحابها لجرئتهم للقيام بهذه المحاكمة و رغم هذا<br />ليس من حقنا ان نشتم شريف الدواخلي لأن فالاول و الاخر ده رأيه و هو حر فيه حتي لو كان مش عاجبني<br />ولا عاجب استاذ حسام و لا عاجب المغترب يكتب الي هو عايزه و ربنا يخليلنا الانترنت الي بيخلينا احنا<br />كمان ممكن نرد عليه و نكتب زي ما احنا عايزين لكن من غير ما نغلط فبعض ولا نزعل من بعض"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004226/http://masr.20at.com:80/newArticle.php?sid=14354"

[[comments]]
order = 5
subject = "اتعلم الكتابة وبعدين اكتب"
author = "abu osama"
text = "يا اخى اما تيجى تكتب علشان الناس تصدقك لازم تكون على الاقل بتعرف يعنى ايه كتابة خبر<br />اولا انت بتكتب الخبر ليه علشان تستهزاء الموضوع اللى انت كتبه بيتمناه كل المصريين ان كنت منهم<br />يبقى انت مش فاهم اى حاجة . ثانيا انت قولت انه هو العضو الوحيد ورجعت كذبت نفسك و ذكرت اسماء شخصيات محترمة جدا .وبعدين يا اخى انت بتكتب فى موقع يا ريت تعرف هو ايه ولاد البلد اللى انت بتسخر منهم دول هما ولاد البلد اللى خايفين عليها ولا انت فاكر نفسك فى موقع الحزب الوثنى."
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228004226/http://masr.20at.com:80/newArticle.php?sid=14354"

[[comments]]
order = 6
subject = "سياسة موقع وليس سياسة شريف الدواخلي"
text = "يا جماعة دي سياسة موقع مش سياسة شريف الدواخلي<br />المفروض تكون فاهمين ان الموقع المسمى عشرينات ليه هدف وليه رسالة يريد ان يوصلها للناس وليه ناس بتدفع<br />وانا متأكد ان الاستاذ شريف كتب الموضوع بصورة عادية لكن سكرتارية التحرير هي اللي غيرت الموضوع وجعلته بهذا الشكل ليتمشى مع سياسة الموقع"
archived = "2008-02-28"
capture_url = "https://web.archive.org/web/20080228095648/http://masr.20at.com:80/newArticle.php?sid=14354"
