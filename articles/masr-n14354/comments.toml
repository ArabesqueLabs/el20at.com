text = "احمد بية عز مجرد واجهة - قناع - انما المالك الحقيقى للمليارات هو احدهم ابن البية الكبير<br />ارحموا احمد عز - فهو حتة ولد اراجوز واللى وراء الاكمة ما ورائها"
