subject = "انا حره"
author = "نيفين نيفى نوفا"
posted = "2008-03-01"
text = "مش عارفه ليه اول ما بسمع اسم لبنى عبد العزيز بفتكر دورها فى فيلم انا حره و رغم انى معترضه على تغيير نهايه الروايه اللى بقلم احسان عبد القدوس الى نهايه تانيه تقتضيها شرقيه المجتمع الا انى لا انكر ان فعلا مكنش حد ممكن يعمل الدور زى ما لبنى عبد العزيز عملته<br />بحس انها ليدى و ان ليها عيون لا يغيرها الزمان<br />طراز فريد من النجمات صعب يتكرر و يصعب تواجدهطراز فعلا من الزمن الجميل"
