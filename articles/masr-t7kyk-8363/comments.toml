subject = "كلام صريح"
author = "محمد سند"
posted = "2008-05-25"
text = "والله انا اشكر المحرره على المقابلة دي لان فعلا كل كلمة فيها كانت شفافة وصريحة **<br />من المؤسف ان يكون حال السينما اليوم بهدا الشكل المشين ***<br />ولو ركزنا فسنجد ان كل شيء في تراجع مستمر ولا نحتاج غير مقارنة بسيطة بين اي شيء قديماً وحديثاً لنعرف الحالة التي آلت لها مستوياتنا الفكرية والفنية وحتى الاخلاقية والرياضة<br />نحن نحتضر كما قال اخي في مشاركته السابقة"
