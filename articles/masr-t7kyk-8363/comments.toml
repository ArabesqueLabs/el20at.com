subject = "السينما بس اللى فى تراجع"
author = "عصفور"
posted = "2008-03-01"
text = "كل حاجة فى البلد دى فى تراجع - واضمحلال - وفى سكرات الموت<br />نحن على شفا الافلاس العقلى والمادى<br />الا اذا سخر اللة لهذا الوطن رجال يحبون اللة ويكونون فئة من الناس فى رباط الى يوم القيامة<br />ينقذون ما يمكن انقاذة<br />رجال كاالشاطر ورفاقة"
