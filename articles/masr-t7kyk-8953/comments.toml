[[comments]]
order = 0
subject = "هل انت طحاوى من قبيلة الطحاوية اللى خانت احمد عراب"
author = "مجهول"
posted = "2008-05-03"
text = "انت منين يا طحاوى<br />انت من القبيلة اياها<br />هل انت موسوم بختم القبيلة<br />لم افهم كلامك انك تكتب من خلفية اسلامية فى ملف خلفيتة قبطية - يعنى اية<br />انا مصرى مسلم موحد باللة وجدى كان فرعونى برضة موحد باللة يؤمن بالاة الواحد الاحد - هل اقرأ عليك نشيد اخناتون الة التوحيد الذى يشرق فى السموات<br />يعنى اية خلفية قبطية - قصدك التثليث وازوريس وازيس الام والابن حورس التى تبناها اليونانيون وحولوها الى اسطورة الاب والابن والروح القدس<br />كلنا تعلمنا فى الكتاب عند سيدنا<br />وزرت قريتى يا طحاوى فوجدت الكتاب تطور - اى واللة تطور - وبدل من فلقة سيدنا والكتابة على اللوح وقلم البوص وابجد وهوز وكلمن وسحفظ وكرشت - لقيت شاب رجع من الخارج بعد غربة سنوات وعمل كتاب لتحفيظ القرأن على الطريقة الحديثة ووضع فية ثلاثة اجهزة كمبيوتر وبدل العيال ما كانت بتقعد على الارض -دلوقتى بيقعدوا على ترابيزات وطاولات ويحفظوا قرأن على الكمبيوتر ويلعبوا علية العاب ويبدأوا يرسموا الحروف فى كراسات<br />ولقيت فى الكتاب طفل قبطى اسمة ابانوب بيلعب مع الصغار وامة ممرضة فى مستشفى القرية<br />اما مهنة الصحافة<br />وانا مش عارف فلاح زيك اختار الصحافة لية - لان الفلاح المصرى بناء بيحب يبنى ويعمر يبنى معبد - يبنى هرم - زمان كان الفلاح هو وزملائة اللى بيبنى بيتة ويعمل اوضة التبن والزريبة - لية اختارت المهنة - زمان كانوا بيقول على الصحفى والمحامى مهنة من لا مهنة لة<br />واظن الاستاذ احمد بهاء الدين فى كتابة ايام لها تاريخ تعرض لقصة واحد صحفى اتزوج واحدة من الاشراف وطلقوها منة لحقارة المهنة<br />فأنا انصحك الا تقول انا صحفى بل قول انا كاتب<br />وعسانا نقرأ لك بعضا من الفكر<br />وعلى اللة الاتكال"
archived = "2010-03-14"
