subject = "قصيدة في حب الكتابة"
author = "دعاء الشامي"
posted = "2008-05-03"
text = "بجد ده مقال هائل ورائع وجميل ومش ممكن ولو فيه اي كلام تاني ممكن نوصفه به اعتبروني قلتها كلها مرة واحدة انا مش مصدقة نفسي فيه كلام حلو كده يتقال عن الكتابة ودروبها وخباياها انا حاسه انها ورشة عمل عن الصحافة والكتابة في نفس ذات الوقت طبعا استاذ عبد الله مش محتج شهادتي لاني مجرد تلميذه من تلاميذة اتمنى اكون شاطرة لكن فعلا افضل مقال قراته في هذه المساحة للراي وافضل مقال قراته على الاطلاق منذ فترة طويلة لم اجد هذه الانسانية والعذوبة في الكلمات والوصف ووضوح الفكرة معا"
