subject = "الى الاخ مجهول"
author = "طحاوي آخر"
posted = "2008-12-19"
text = "لابد لك من التحري اكثر في موضوع عرابي , فلم تكن قبيلة الطحاوي خائنة في مد يد العون لاخوانها فالشام وفلسطين فالوقت اللذي كانت قبائل ((فرعونية)) لا تهش ولا تنش في ذاك الوقت .<br />راجع التاريخ دون ان ترجم بالغيب مالا تعلمه عن عائلة الطحاوية التي كانت ومازالت تملك قوة ضاربة عبر العصور وحتى الان ..ولن اكثر (راجع التاريخ)<br />واريد ان انوه بأن اللغة (العربية اليد ) التي استخدمتها اقتباس من موضوعك اللذي كتبته ===> والكتابة على اللوح وقلم البوص وابجد وهوز وكلمن وسحفظ وكرش"
