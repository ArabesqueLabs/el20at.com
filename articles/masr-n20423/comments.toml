author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-03-28"
text = "دى فيفى عبدة ياحاج؟<br />ياريت الحمير تفهم(المقصود)كويس؟؟؟!<br />دة فىفىفىفىفىفى أسرار كتير علينا نفهمها !؟<br />المهم ان احنا نرقصهااااا علشان تتفهم<br />و سلمى على فيفى الغازية؟بنت عبدة الطبال<br />ورقصنى يا حمار<br />هههههاهههههاههههاههههاههههخا وهااااااااااااااا"
