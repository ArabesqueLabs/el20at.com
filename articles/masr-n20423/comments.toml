text = "الاولى وفاء مكى<br />والثانية فيفى عبدة<br />و الثالثة اهههههههههههههههههههههههههههههة يا بلد بتاعت مومس و خدامات الفن المنحطو خدامات بير السلم<br />فضحتونا دنيا و اخرة<br />مليون اتفوووووووا عليهم"
