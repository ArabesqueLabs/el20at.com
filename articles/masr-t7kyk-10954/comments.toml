text = "كان فيه بلد في العراق اسمها الفللوحة معقل اهل السنة والجماعة تم حصارها وذبح اهلها ونسائها واطفالها كالنعاج<br />لا حد جمع تبرعات<br />ولا حد عالج جرحى<br />والشيعة الكلاب كانوا واقفين بره المدينة يرقصوا<br />طيب ما حدش قدر يفتح بقه علشان خاطر امريكا هي اللي متولية المجزرة<br />طيب في غزه اسرائيل اللي متولية المجذرة باذن من امريكا واللي مش عاجبه الاساطيل الامريكية موجودة<br />ادخلوا الموقع دا بتاع الفلوجه<br />http://falluja.jeeran.com/falluja.htm"
