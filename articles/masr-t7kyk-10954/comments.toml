subject = "بطلوا منظرة وخيبه بقا يا دول عربية"
author = "مش لازم"
posted = "2009-01-14"
text = "الدول العربية الفاشلة اللي زي مصر والامارات عايزين يداروا خيبتهم يعملوا ايه يجيبوا الجرحى ويعالجوهم في بلدهم ويجمعوا تبرعات ويا لهوي يا لهوي<br />كل دا علشان خاطر يداروا كسفتهم وخيبتهم<br />في الامارات ومصر معالجة الجرحى دعايا لا قيمة لها<br />انا لو كنت رئيس جمهورية لسافرت اسرائيل فورا واجتمعت مع المسئولين هناك ولا ابرح اسرائيل الا بعد ايقاف هذه الحرب<br />الله يرحمك يا سادات كان رجل بصحيح وفاهم الشغلانه كويس<br />واسرائيل هي اللي قتلته لانها خسرت كتير اوي في وجوده<br />كانت قاعدة على حجر امريكا هي وبس<br />لكن لما جه السادات كانت سياسته عدم ترك امريكا ساحة مفتوحة لاسرائيل وعرف يعمل الممكن في زمن المستحيل<br />الله يرحمك يا سادات<br />اذا كنا مش عارفين نحارب ففيه حاجه اسمها ديبلوماسية ومفاوضات<br />المفروض وزير خارجية على الاقل يجري على اسرائيل ويحاول يحل المشكلة<br />لكن دول قاعدين في القصور المكيفة والخدم والحشم وقال ايه كل واحد يجيبه كام جريح يعالجهم ويجمعله شوية تبرعات وما بترحش<br />لنا الله"
archived = "2010-03-14"
