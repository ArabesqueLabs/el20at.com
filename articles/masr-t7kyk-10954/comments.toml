subject = "فعلا الحرب دي كانت ممكن تقف بالطرق الديبلوماسية ال"
author = "مش بحبك"
posted = "2009-01-14"
text = "فعلا فين الديبلوماسية فين وزراء الخارجية<br />يا ما الديبلوماسية منعت حروب<br />يعني الهند وباكستان كانوا على شفا حرب وراح وزير خارجية امريكا واطفأ نار الحرب الوزير اللي اسمه باول<br />وبرضه مرة حصلت حرب بين الجزائر والمغرب واوقفت بالطرق الديبلوماسية<br />وبالطرق الديبلوماسية سينا رجعت لمصر<br />وبالطرق الديبلوماسية اقيمت دولة فلسطين في الضفة والقطاع<br />وبالطرق الديبلوماسية لم تقم حرب بين امريكا وروسيا<br />اذا كانت وزارات الدفاع في بلادنا العربية في حالة خمول تام وبيات شتوي وصيفي<br />يبقى وزارات الخارجية المفروض تتحرك<br />ابو الغيط دا كان ممكن يسافر اسرائيل ويحل المشكلة<br />فيه حاجه اسمها ديبلوماسية المكوك زي كيسنجر فاكرين كيسنجر بعد حرب 73 حل مشاكل بين العرب واسرائيل بدبلوماسية المكوك<br />يعني يفضل ينتقل من طرف الىطرف لغاية ما يحل المشكلة<br />بلاش كلام فاضي<br />الى المعلق السابق انت ممتاز يا استاذ مش لازم"
archived = "2010-03-14"
