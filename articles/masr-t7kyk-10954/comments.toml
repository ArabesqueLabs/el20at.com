[[comments]]
order = 3
subject = "الهجوم الأمريكي على الفلوجة مايو إلى نوفمبر 2004"
author = "مش شريف الدواخلي ولا البرائ اش"
posted = "2009-01-15"
text = "الهجوم الأمريكي على الفلوجة مايو إلى نوفمبر 2004<br />بعد عقد الصلح استمرت العمليات المسلحة من قبل فصائل من المقاومة العراقية في مدينة الفلوجة بصورة متقطعة على شكل هجمات صغيرة وادركت الآدارة الأمريكية ان اجراءاتها في الفلوجة لم تكن مؤثرة في وقف فعاليات المقاومة العراقية وكانت الطائرات الأمريكية تقوم بغارات جوية على معاقل المقاومة في الدينة بين حين و آخر و بدأت بعض التقارير تطفو على السطح مفاده ان أبو مصعب الزرقاوي و منظمة القاعدة في العراق قد بدأت في بسط نفوذها على المدينة.<br />في نوفمبر 2004 بدات القوات الأمريكية استعداداتها لشن حملة عسكرية واسعة النطاق على معاقل المقاومة في الفلوجة و بدأتها بتكثيف حملاتها الجوية على المدينة. في 7 نوفمبر 2004 اعلنت الحكومة العراقية الانتقالية حالة الطوارئ لمدة 60 يوما وصرح رئيس الحكومة العراقية المؤقتة, اياد علاوي رسمياموافقته على الحملة العسكرية \"لتطهير المدينة من الأرهابيين\" حسب تعبير علاوي.<br />بدأت العملية التي اطلقت عليها عملية الفجر في 7 نوفمبر 2004 واعتبرت اضخم عملية في حرب المدن تقوم به المارينز منذ معركة مدينة هيو في فيتنام عام 1968. قامت القوات الأمريكية بالسيطرة على مستشفى الفلوجة واحكموا سيطرتهم على جسر جرف كاس شكر في الجهة الغربية من المدينة و بحلول منتصف النهار من نفس اليوم دخلت قوات المارينز حي نواب الضباط وبحلول الظلام سيطروا على الشارع الرئيسي في وسط المدينة.<br />في 13 نوفمبر و بعد 6 ايام من المعارك الشرسة اعلنت القوات الأمريكية انها سيطرت على المدينة وانها تقوم بمطاردة بعض \"جيوب المقاومة\". في 16 نوفمبر قامت شبكة NBC الأخبارية ببث مشاهد لجندي أمريكي كان يطلق النار على أحد الجرحى المقاومين واحيل هذا الجندي إلى المحكمة العسكرية و لكن تم تبرأته فيما بعد.<br />افادت التقارير انه خلال هذه العملية تم تدمير 60 مسجدا و 700 إلى 1000 منزل وقتل 71 جندي أمريكي و 1,200 مسلح و تم اسر 1000 مسلح حسب تقارير الجيش الأمريكي.<br />بعد سنة من هذه العملية بثت وكالة انباء ايطالية تقريرا في 9 نوفمبر 2005 وجاء فيه ان المارينز استعملوا قنابل MK-77 الشبيهة بالنابالم بالاضافة إلى الفسفور الأبيض والتي تعتبران من الأسلحة المحرمة عالميا حسب قرارات معاهدات حظر استعمال الأسلحة الكيمياوية والتي وقعت عليها الولايات المتحدة الأمريكية في عام 1983.<br />[عدل] السيطرة على مدينة الفلوجة<br />سمح لسكان الفلوجة بالعودة إلى منازلهم في منتصف ديسمبر 2004 بعد اجراء تدقيقات تحليلية على العائدين حيث زود العائدون ببطاقات شخصية خاصة من قبل القوات الأمريكية. استنادا إلى تقارير القوات الأمريكية فان نصف البيوت في الفلوجة و يقدر عددها 39,000 منزل قد تعرضت إلى اضرار و استنادا على تقارير من شبكة ان بي سي (NBC) الأخبارية فان 9000 منزل قد دمر و قامت القوات الأمريكة قامت بتعويض 2,500 طلبات بالتعويض عن الأضرار من اصل 32,000 طلبا بالتعويض قدمه اهالي المدينة. منذ نوفمبر 2004 تشهد المدينة هدوءا نسبيا و انخفضت عدد الهجمات المسلحة على القوات الأمريكية علما ان هناك هجمات متفرقة بين الحين و الأخر يقوم بها بعض فصائل المقاومة العراقية وكانت ابرزها أحد العمليات لأستشهادية بواسطة سيارة مفخخة في 23 يونيو 2005 التي اودت بحياة 6 من المارينز واصابة 13 منهم."
archived = "2010-03-14"
