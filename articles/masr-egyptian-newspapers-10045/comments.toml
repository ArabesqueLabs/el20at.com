subject = "كنت حروح في ستين داهية"
author = "ابو غزاله من الاخرة"
posted = "2008-09-09"
text = "طبعا انتو فاكرين الصورة المشهورة بتاعة العرض العسكري لما كان السادات في الوسط وانا على اليمين وحسني مبارك على الشمال ولابسين احنا التلاته الملابس العسكرية<br />فاكرنا<br />لما السادات انضرب كنت انا القائد العام للقوات المسلحة وكان حسني مبارك لا قيمة له في الجيش مجرد نائب رئيس جمهورية وما لوش اي حاجه في الجيش<br />وكان الامر بيدي ولما صوفي ابو طالب اصبح رئيس جمهورية قانونا بعد مقتل السادات اول قرار اعلنه ان حسني مبارك يبقى القائد الاعلى للقوات المسلحة<br />انا كنت اقدر الغي القرار دا واضربهم هما الاثنين بالجزمة القديمة<br />ولكن ما اعرفش ايه اللي سكتني نزل عليها سهم الله ووافقت وعملنا انتخابات سريعة لحسني مبارك واصبح رئيس الجمهورية والقائم الاعلى للقوات المسلحة<br />والحمد لله بعد فترة عزلوني عن المنصب بقرار امريكي فاكرين لما حسني مبارك رجع من امريكا وعزلنا والحمد لله<br />لما نزلت القبر وجالي الملكين يسالوني سؤال القبر<br />اول ما شفتهم تذكرت موت السادات وتذكرت ان الرئاسة كانت في جيبي بصفتي القائم العام للقوات المسلحة<br />وقلت الحمد لله ان ربنا سبحانه وتعالى لم يرد لي ذلك<br />فظلم 80 مليون مصري مش هينة عند الحساب"
archived = "2010-03-14"
