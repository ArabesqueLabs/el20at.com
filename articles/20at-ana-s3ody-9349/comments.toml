text = "ايش رايكم لو يلغوا التعليم نهائيا من المملكة عشان الطلاب يرتاحوا او يعطوهم الشهادة و هم جالسين في بيوتهم احسن و تبغون اولادكم يشتغلون في النهاية كيف و الاجانب تعليمهم تعليم من جد مومثلنا نطلع من المدرسة ما نفهم شي"
