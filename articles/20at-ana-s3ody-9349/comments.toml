[[comments]]
order = 2
subject = "مستقبلي ضاع"
author = "أســامــة"
posted = "2008-10-06"
text = "أنا أحد الطلاب المصريين المقيمين في السعودية فقد تسبب هذا القرار الخاطئ تماما ضياع حلمي ومستقبلي وتساوت الروؤوس بيني وبين الطلاب حيث من لايذاكر كمن ذاكر وإجتهد وتفوق في فهم المنهج كمن حفض المنهج وبعض ما يطب من المعل فقط مما قلل الإجتهاد والمزاكرة والحصول على أعلى الدرجات بغير حق فهل يعقل أن يكون إمتحان الذي يحدد مستقبل في الجامعة لا يكون في مساواة ولا عدل وهذا لايمكن أن يتححق حتى لو الوزارة وضعت المقاييس وما إلى ذالك أنا أنا شد مسؤولوا الوزارة ينزلون إلى قلب الحدث ويشاهدوا بأنفسهم هل هنااك عدل ومساواة في مستوى الإمتحان على مستوى الممكلة بالطبع لا ولا يجب أن ننسى أيضا أنا إمتحان الوزارة كان يصحح من قبل مراكز تصحيح بأرقام سرية لا يطلع عليها المصحيحين أمال الآن فالمعلم هو من يصحح ويرصد الدرجة ويستطيع تزويده بالدرجات بكل بساطة إلا من رحم ربي<br />هذا القرار تسبب في إمكانية تحقيق حلمي ودخول الكلية اللي أرادتها وحددتها لأإنهم في مصر غير مطالبين بإمتحانات قدرات السعودية فقط نعتمد على المجموع والنسبة المئوية"
archived = "2010-03-14"
capture_url = ""

