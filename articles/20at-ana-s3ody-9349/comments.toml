[[comments]]
order = 1
subject = "والله مسخرة"
author = "إنسانة واقعية"
posted = "2008-06-17"
text = "طبعاً سيؤدي لتفاقم الغش - مايبغالها ذكاء - وفية ظلم كبير للمتفوقين ،وظلم للطلاب لأنهم سيتخرجون من المدارس دون أي فائدة تذكر ، أسئلة وزارة المعارف في معظمها تحتاج لفهم أكثر من الحفظ أما أسئلة المدرسين فتعتمد على فقرات معينة من المنهج يقوم المعلم قبل موعد ألإمتحان بحوالي إسبوعين بتحديد أسئلة منها يحفظ الطلاب إجابتها ويضعونها في ورقة ألإمتحان دون فهمها على ألأغلب .<br />فلا حول ولاقوة إلا بالله"
archived = "2010-03-14"
