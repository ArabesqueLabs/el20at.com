text = "الى صاحب التعليق السابق<br />و انت مال اهل امك يا عبيط يابن الهبلة؟<br />هو الوحش و لا سمح اللة كان افترس (أمك)و العياذ باللة؟!!!<br />و ياريت تكتب اسم امك الحيقى علشان نعرف انت ابن مين مننا؟<br />ما ازواج و احباب امك و الحمد لللة بالملايين؟!!!"
