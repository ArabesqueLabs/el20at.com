subject = "يا(وحش) اتحداك ان تقاضينى؟!!!!"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-14"
text = "اتحداك يا وحش ان تقاضينى امام القضاء المصرى<br />لاننى سوف اثبت انك (وحش)من ورق هش أصفر!<br />و نتقابل امام اى محكمة تريدها!<br />قال(وحش)قال؟<br />انت (وحش)جدا جدا جدا؟<br />يامامااااااااااااااااااااااااااااا انا موش خايف منك يا(وحش)<br />هاااااااااااااااااااااااااااا هاااااااااااااااااااا هاااااااااااااااااااااااااااااااااااااااااااااااااااا يامامااااااااااااااااااااااااااااااااااااااااااااا<br />ملحوظة:ممكن ان تقاضينى امام (محكمة باب شرق الاسكندرية) بالاسكندرية يا(وحش)جدا جدا جدا"
archived = "2010-03-14"
