text = "حينما لا تستطيع فتاة او سيدة ان تسيرامنة مطمئنة فى الشوارع يبقى المجرمون نجحوا فى هدم قيم المجتمع - الاوباش مثل عادل امام بمسرحياتة المنحلة مثل مدرسة المشاغبين والاوضاع المخزية فى مسرحياتة مثل الزعيم وخلافة بالاضافة على التركيز على الامن السياسى وملاحقة المتدينيين وذوى الضمير وتفشى الفساد والنهب والبطالة وعدم الجدية والاستهتار فى الحياة<br />يا خسارة يا مصر<br />كانوا بيقولوا عليكى بلد الامن والامان"
