subject = "ربنا ينصرهم في الحكومة كما نصرهم على اليهود فطردوه"
author = "SLAMAMUSLM"
posted = "2007-03-21"
text = "الف مبرووووك على الحكومة الموحدة و على بال ما ألف لهم قصيدة<br />دي قصيدة كنت كتبتها في اندحار الصهاينة من غزة اتسلو بها<br />غــــــــــــــــــزة الــــــنــــــصــــــر\"<br />يا غزة النصر يا بوابة الفجـرِِ*** قـد جـاء نصـرُك رُغـم قهرنـا عمـري<br />يا من بنصرك فاض الدمع من فرح*** هلا فككت أيـدي الأقصـى مـن اسـرِِ<br />هلا نظرت بعين النصر مرحمةً*** لقدسنا يـا غـزة لا تنسيهـا فـي النصـرِ<br />يا من رأى النصر في عينين من نصرو*** احك لنـا بسمـة أو دمعـة تجـري<br />يامن رأى نجمها حين لاح في الأفق*** وقت انتصار الحق في الألواح والقـدرِ<br />صفها لنا غزة الياسين تبهجنا*** وتعلي رأسا كـرة قـد تـوارى فـي الحفـرِ<br />يا بنت ديني غزة القسَام تمنحنا*** مدار حلمٍ بديني يـا بشـرايَ فـي الصـدرِ<br />وماذا قال موج بحرها هزِجـا *** فـي روعـة النصـر حيـن ولَـو الدبـرِ<br />أراه قال لابن صهيون أيـا فـأرا*** إهـرب بجلـدك واهـدم بيتـك التتـري<br />هاذي الأسود الضواري لست تقدرها*** من صفحة القران ام من صنعة القـدرِ<br />أعطتك درسا في الأهوال تحفظـه *** ولهـا دروسـا ستعطيهـا مـع الفجـر<br />يا غزة النصر لست أواخر الغزو*** فحروف اسمـك مـن غـزوٍ ومـن كـرِ<br />فهاك ضفتنا قد ابديت سؤددها *** ثـم تليهـا القـدس نرخـص فيهـا للعمـرِ<br />أهلا بطهر ويا مرحى بمقدسنا*** لعمري طهـرُ الطهـر حـنَ منـك للطهـرِ<br />بمسجد الإسراء أقصانا وقبلتنا *** فليخسـأ الجبـن حيـن يدعـه فـي الاسـرِ<br />قالوا سلاما ام لاستسلامهم هرعوا***ما عاد حقٌ سليـبٌ بغيـر سيفنـا الحـرِ<br />ويسارعون الان في تقديم ذلتهـم *** للذئـب شـارون ويعطـوا كـل معتـذرِ<br />أيا قومنا أفيقوا ماذا يصنع السلمُ*** مع ناب ذئبٍ حقودٍ لا يلوي سـوى الخطـرِ<br />النصر دال على آثار من نصروا*** فامشوا بدربهم ما فـي الأمـر مـن سـرِ<br />ففي القرآن نصرُ الحق في -أعدوا -** فهل يستجدى نصراً من دوامـة الغيـرِ<br />هم المدعِي والمدَعَى والخصم والحكم *** وأيدهم ساوت بيـن الشـرِ والخيـرِ<br />يا غزة القسَـام ويـا غـزَات تنتظـر*** النصـر يأتـي بميعـادٍ مـن القـدرِ<br />حين يرى الله جند الحق قـد وفُـوا *** بعهـد ربـي فتأتـي مشيئـةُ الأمـر<br />بقول \"كـن\" مـن الجبـار يندبـه *** فتذعـن الأكـوان لخالقهـا بـلا نَهَـرِ<br />إن تنصروا الرحمان يا قومي ويا أهلي *** ينصركم القهار ويرفعكم على السررِ<br />ملوك دنيا بأمر الله تحتكموا*** وبشـرى أخـرى فيـا مرحـى بـذي الأُخـرِ<br />فبالكتـاب وسنـة احمـد تصلـوا *** لغايـة الفتـح أو مـن آيـة الفـجـرِ<br />يا غـزة العـز ليـت أنَـي بينكـمُ*** للثـم فمـيَ تـرب الريـف والحضـرِ<br />شهداؤك حاكـو الفتـح معجـزة *** مهمـا يحيـك أبـو لهـبٍ مـن الشـرِ<br />مذعـورَ دُحِـرَ وهامـانُ بجندهمـا *** أمـام جنـد الله فيـا لسـوءة الدحـرِ<br />اطل ضـوءك يـا بوابـة الفتـح *** مـن بعـد ظلـم وإظـلامٍ مـن الغـدرِ<br />بمشعلٍ وهنيـةٍ والزهـارُ معلنهـا *** وغزالهـا وبضيفهـا ومشيروالزهـري<br />والشيخ يوسف قد بل لظى القلـب*** نـورا وإسلامـا بالأوصـال يستشـري<br />وكتائب العز هذا وسام نهضتنا *** علـى جبيـن الحـق يجبـر كـل منكسـرِِ<br />حي الكتائب والشهـداء محتفيـا *** والشيـخ \"يـس\" مسـرورا بـذا الخبـرِ<br />وثلة الشهداء ريح عبيرها يزكي***تبـارك النصـر و فـوح مسكهـا يسـري<br />وغـزة هاشـم قـد بـرت بموثقهـا *** لديـن ربـي رغـم القهـر والمـرِِ<br />فبارك الله نصرا غطى عجزنا عنا*** وبارك الله جندا لـم يألـو عـن الأمـر<br />وحررَ الله أقصانا ومقدسنا*** وكـل ارض الوطـن شبـرا فـي مـدى شبـرِِ<br />ووحَد الله امتنـا و أرشدهـا *** بـدرس غـزة حيـن يطـوى فـي الصـدرِِ<br />قد حـرت ملئـي الهـوى هـلا أناديـك*** بغـزة النصـر أم بغـزة الفجـرِ<br />أراك غزوة أين الواو هل تبرق *** في صدر اسمك كـم يترائـى مـن قمر<br />وشكرا على المواضيع الجميلة الهادفة"
