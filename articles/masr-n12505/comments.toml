subject = "دة العادي"
author = "ملك الفاشلين....انا"
posted = "2007-12-06"
text = "المشكلة مش في ان الفيلم نمطى جدا، او حتي ما بيثرش أى شعور لا بالتعاطف ولا بالتأييد ولا بالاستنكار، او ملوش مضمون وممل كمان سيبكم من كل دة المشكلة الكبيرة(((( احنا عاملين زي الدبان يجي علي اي حاجة وحشة بس )))))) مشفتش حد اتكلم ازاي نحل المشكلة دية لازم كل واحد فينا يفكر ولا 10 سواني بس خلاص"
archived = "2007-12-23"
