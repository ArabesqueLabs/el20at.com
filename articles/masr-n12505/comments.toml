[[comments]]
order = 1
subject = "مفيش إبداع"
author = "أيمن"
posted = "2007-11-21"
text = "الفيلم بصراحة نمطى جدا، رتمه بطيء وكل الأحداث متوقعه، ما بيثرش أى شعور لا بالتعاطف ولا بالتأييد ولا بالاستنكار،<br />حتى توضيح إن اتنين بيحبه بعض دبدوب كبير، عشان يبين الواسطة كلام مصطنع، عشان يبين التطرف برده نفس القوالب اللى ما شفناش غيرها فى أفلام عادل إمام والمسلسلات كلها، واللى للأسف فيها قلة احترام للحديث النبوى،<br />وبعد ما الفيلم خلص برده نفس النمطية ومن غير أى إبداع الكلام اللى اتكتب على طريقة برامج الأطفال \"نتعلم من القصة ده إييييييييه؟\"<br />للأسف الفيلم من حيث المضمون والأسلوب نمطى وممل"
archived = "2007-11-22"
capture_url = "https://web.archive.org/web/20071122100228/http://masr.20at.com:80/newArticle.php?sid=12505"

