subject = "كل ده بسبب التكنولوجيا"
author = "الرهينة"
posted = "2007-12-01"
text = "يعنى الواحده لما تبقى متجوزة وتهرب من جوزها ده خيانه زى الى بتهرب من ابوها وعائلتها... انا شايفه ان النت والموبايل والتكنولوجيا هى السبب قبل كل ده لم يتواجد مثل هذه الظواهر .....انا مش ضد التكولوجيا انا اكتر واحده استفادت منها بس من الذى يستخدمها ؟؟؟؟يجب انيكون هناك رقابة من الاسرة على الفتاة التافهة عندما تستخدم التكنولوجيا لانها لازم تنحرف لو مافيش رقابة"
