[[comments]]
order = 7
subject = "الأخ بتاع العفاريت !!"
author = "ياسر أبو العلا"
posted = "2007-06-05"
text = "الأخ بتاع عفاريت النت ، اللى يقرا تعلقك يفتكر ان فيه حد ماسك عصاية وبيضرب أى حد يتكلم عن الاخوان ، بالعكس يا عمنا ، كل من هب ودب بيقول فى الإخوان ما قال مالك فى الخمر ، أو يمكن أكتر شوية ، اشمعنى لما حد يقول كلام سليم وحد بيقول له إن كلامك صح يبقى إنسان مش كويس ، يعنى هو الموضوعات متتظبطش إلا لو امتلأت بالشتيمة والكذب والتحريض والافتراء واختلاق الوقائع ولى ذراع الأحداث ؟<br />الإنصاف مطلوب فى أى حاجة ، يا أخى المطلوب إن الواحد لما ربنا يقدره ويمسك قلم ، أو يقعد أمام الكمبيوتر ويبدأ يكتب - عن أى حاجة فى الدنيا - إنه يراعى ضميره ويعرف إن ربنا شايفه وعارف إن كان كذاب ولا صادق .<br />بس .... إنت شايف إن ده صعب أو غير منطقى أو فيه مجاملة لأى حد فى أى حتة ؟<br />وبعدين يا عمى اللى بيكتبوا فى الموقع أساتذة - وأنا اعتقد إنك بتشتغل فى الموقع برضه- يعنى من الآخر مش مسنيين حد ينصحهم ، بس اطلع انت منها .<br />تحياتى لمروة تانى ، وتحياتى لعفاريت النت ، وليك انت كمان يا عمى علشان متزعلش وتقف لى على الواحدة ."
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608123840/http://masr.20at.com:80/newArticle.php?sid=10512"

[[comments]]
