subject = "مش فارقة"
author = "maro"
posted = "2007-06-06"
text = "السلام عليكم ورحمة الله وبركاته<br />راي ان ابن اخ مش فارقة كتير<br />وفي الاخر كلنا حنوقف قدام ربنا ومش حيشفع لنا الا عملنا<br />لا اخ ولا ابن اخ لا وحمل علينتا كمان ربنا اهو وربتكم الطريق عملتم ايه يعني جاية علي دماغنا"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608123840/http://masr.20at.com:80/newArticle.php?sid=10512"
