[[comments]]
order = 0
subject = "ولاد البلد"
author = "إبن أخ"
posted = "2007-06-03"
text = "الموضوع جميل جداً بالنسبة لي كــإبن أحد أعضاء مجلس الشعب عن الجماعة (المحظورة) على تعبيركم<br />نفس أسلوبي تماماً يا د/ مصعب الشاعر<br />(وقد شعرت في الكثير من الأحيان أننى لابد أن أخفى انتمائى للأخوان عند تعاملى مع المجتمع، لكن غالبا ما كان الناس يعرفوننى من أبى)<br />أظن هذا هو الحل الأمثل لي ولمن مثلي أن يحاولوا أخفاء أسم العائلة والاكتفاء باسم الأب فقط ولكن مهما كان البطاقة (بتكشف المستخبي)<br />شكراً لكي يا مروة على الموضوع الممتاز -في رأيي- وان كنت أعترض بشجة على تسمية الجماعة بـ (المحظورة) حتى وإن<br />سُبقت الكلمة بـ (يعتبرها البعض)"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608123840/http://masr.20at.com:80/newArticle.php?sid=10512"

[[comments]]
order = 1
subject = "برافو"
author = "ياسر أبو العلا"
posted = "2007-06-03"
text = "الله ينور يا أستاذة مروة ، موضوع جميل ، ويوجه رسالة أن الإخوان ليسوا ملائكة ، وهكذا يجب أن يعاملهم الناس ، فهم بشر يمكن أن تجد أبناءهم يلتزمون بأفكارهم أو يرفضونها ، ولم أسمع أن أحدا من الإخوان علق ابنه مثلا فى السقف لأنه يرفض أن يسير على نفس خطى والده."
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608123840/http://masr.20at.com:80/newArticle.php?sid=10512"

