[[comments]]
order = 3
subject = "يا بختهم"
author = "Adem EL-Mahdy"
posted = "2007-06-03"
text = "بسم الله الرحمن الرحيم<br />اولا موضوع رائع احييى الاخت اللى كاتباه على الاسلوب و الطرح<br />ثثانيا موضوع ابن اخ مش فارقه كتير عن اى اخ عادى بالعكس ,فى البيت ما حدش بيؤلهم انت رايح فين و جى منين و الام خايفه يبنى هايضيعوا مستقبلك و الكلام ده بيوت الاخوان بيبؤا عارفين الموضوع ده و عارفين (قل لن يجيرنى من الله احدد و لن اجد م دونه ملتحدا)<br />و يا ريت اى ابن اخ يستشعر كأنه السيدة اسماء لما جالها ابو جهل عندما هاجر مع حبيبنا النبى صلى الله عليه و سلم<br />و كلها فانيه و لا يبقى الا العمل و ليس عمل ايوه<br />www.ademelmahdy.blogspot.com"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608123840/http://masr.20at.com:80/newArticle.php?sid=10512"

[[comments]]
order = 4
subject = "بيقولو ابن اخ"
author = "بيبو"
posted = "2007-06-04"
text = "الموضوع رائع يا استاذة مروة لكن....<br />نفسى تلعبي اكتر على نفسيات ابناء الاخوان وظروفهم حياتهم عايشين الزاى<br />الجانب الانساني فى حياة ابناء الاخوان اظنه لازم الناس تعرفه وتشوفه<br />بيفكروا الزاى بيحبو ايه بيلعبو ايه بيصاحبو مين<br />حياتهم داخل مجتمع الاخوان ونفسياتهم فى المقابل نفسياتهم فى حياتهم مع اصحابهم العاديين<br />دى كلها حاجات الناس لازم تعرفها"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608123840/http://masr.20at.com:80/newArticle.php?sid=10512"

