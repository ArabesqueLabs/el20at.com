subject = "بالنسبة لكلمة محظورة"
author = "مروة صلاح"
posted = "2007-06-05"
text = "صاحب تعليق إبن أخ بالنسبة لكلمة محظورة التى ذكرت بالمقال والتى أوضحت أنها \"كما يعتبرها البعض\"، كنت اريد ان اوضح ان الكتابة الصحفية لابد الا تتاثر بالانتماءات الايدلوجية للصحفى، وأنها لابد أن تكون موضوعية.<br />وجزاكم الله خيرا"
