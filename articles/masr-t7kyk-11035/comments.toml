subject = "رد على مصري فاهم وليس من فصيلة البقر"
author = "مش لازم"
posted = "2009-01-25"
text = "يا مصري فاهم وليس من فصيلة البقر حضرتك تعبت نفسك اوي في التعليق الطويل دا<br />بس فيه حاجه انت نسيتها<br />ان السيد جمال عبدالناصر كان مستعد لتحرير فلسطين بالكامل ودخل حرب 67 لهذا الغرض<br />فوجئنا باحتلال اسرائيل لسينا بالكامل وسينا دي حجم فلسطين مرتين ونصف<br />علشان خاطر اسرائيل تترك سينا لمصر عملوا عقد مثل عقد الايجار عندنا في مصر<br />واللي عمل العقد دا محامي عؤر من امريكا<br />وفيه شروط وبنود كثيرة<br />اهم شرط في العقد دا اللي هوا اسمه معاهدة السلام<br />يعتبر العقد مفسوخا من تلقائ نفسه اذا مصر اخلت باي شرط من شروط هذه الاتفاقية<br />ومعنى فسخ العقد احتلال اسرائيل لسيناء مرة ثانية<br />وكل الافتراضات اللي حضرتك قلت عليها في تعليقك دي طبعا المحامي اللي كتب العقد بين مصر واسرائيل ما فاتتش عليه وعملها الضد في العقد<br />يعني انا عايز حضرتك تريخ نفسك على الاخر وما تتعبش اعصابك واللي بيعملوا حسني مبارك والحكومة المصرية هو الصح اذا كنتوا عايزين الادارة المدنية على سيناء تستمر<br />سلام يا صاحبي"
archived = "2010-03-14"
