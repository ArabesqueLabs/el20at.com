subject = "غزة هى صرة فلسطين وهى الدرع  الامامى لمصر"
author = "مصرى فاهم وليس من فصيلة البقر"
posted = "2009-01-24"
text = "نفترض ان اسرائيل تريد ضرب سوريا والهجوم عليها -------- وردت سوريا بدفع حزب اللة ليستنزف اسرائيل ويدخلها فى متاهات حرب العصابات ويثبت جيشها على الارض ويشتت مجهود القتال الرئيسى لاسرائيل ويخفف العبء على الجيش السورى الذى ربما ينزل ضربات قاتلة لعمق اسرائيل<br />اسرائيل قبل ان تفكر فى الهجوم على سوريا تفكر الف مرة فى حزب اللة<br />تلك حقيقة<br />وماذا عنا فى مصر لو كنا سلحنا حماس واعطيناها سلاح وجعلناها قوية كحزب اللة لتكون مقدمة لجيش الدفاع المصرى فى اعتداء اسرائيلى مستقبلى على مصر<br />قبل حرب 1967 كانت قوات مصرية موجودة فى غزة وكانت مدفعيات الجيش المصرى تصل الى جنوب تل ابيب<br />لماذا لا يكون تفكيرنا استراتيجى ؟<br />ولماذا لا نراعى مصلحة مصر العليا ؟ ولا ننظر ان كانت حماس اخوان او شيوعيين او حتى ملحدين<br />ايها السادة مصلحة مصر العليا اولا<br />وقوة غزة وقوة حماس هى قوة لمصر<br />الا اذا كانت مصر اصبحت صهيونية<br />ولا يفوتنى الا ان اكرر تسال الزعيم سعد باشا زغلول<br />وماذا علينا اذا لم تفهم البقر ؟<br />صحيح<br />وماذا علينا اذا لم تفهم البقر"
archived = "2010-03-14"
