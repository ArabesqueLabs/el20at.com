text = "تبقى اية<br />عايز تقول اية<br />عبد الناصر لم يكن يريد تحرير فلسطين - دا حشد القوات علشان يخف الضغط على سوريا وغلط واغلق خليج العقبة علشان حصار اسرائيل<br />الجيش المصرى فى 1967 استحمل بالضبط 6 ساعات حرب وقلع الجزم وابتدأ الجرى نحو بيوتة<br />لا احد يستخف بقوة اسرائيل النارية - دول ناس بتشتغل وبيعملوا قواتهم صح وبيتدربوا وبيتسلحوا وبيتجهزوا بكل جديد فى عالم السلاح<br />الدور علينا بنكافح علشان رغيف عيش وانبوبة بوتاجاز -- لية<br />اتفاقية كامب ديفيد اسمها الصح اتفاقية الاستسلام الكامل لاسرائيل"
