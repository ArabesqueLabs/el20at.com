subject = "النصر آت لا ريب فيه"
author = "Ashour"
posted = "2009-01-24"
text = "وقال الشيخ القرضاوي: أحب أن تثقوا أن النصر لإخواننا في غزة فهذا ما نؤمن به أشد الإيمان ونؤمن به علم اليقين وعين اليقين وحق اليقين. إن النصر آت لا ريب فيه ولكن الله سبحانه وتعالى له سنن يجري بها نظام هذا الكون، ومن سنن الله أن الأمور لا تأتي كما يهوى الناس، لابد أن تعمل السنن عملها حتى يحين الوقت ويأتي نصر الله.<br />وذكر بقول الله تعالى: \"ولقد نصركم الله ببدر وانتم أذلة فاتقوا الله لعلكم تشكرون\" قائلا: ونحن ننتظر يوما كيوم بدر ينصر الله فيه أهل الإيمان،<br />مطالبا بالصبر على أهل الكفر والظلم والبغي والتكبر والاستكبار.<br />ووجه القرضاوي حديثه إلى الذين يقولون إن حماس هي السبب في العدوان<br />بعدم تجديدها التهدئة قائلا: إن حماس صبرت طويلا وكثيرا على طول الحصار، الذي حرم أهل غزة جميعا من كل أسباب الحياة من الماء والغذاء والدواء والملابس والوقود والكهرباء، وبعد هذا يريدون تجديد التهدئة بالمجان؟! لا فالمؤمن والحر يقول نعم حينما تستحق أن يقولها، ويقول لا حينما تجب لا، وإخواننا قالوا لتجديد التهدئة لا، ومع هذا لم يعتدوا على أحد فهم يدافعون عن أنفسهم.<br />وتابع: بعض الناس يقولون إن حماس حولت القضية إلى مسألة دينية وهذا يقلب العالم ضدنا،ونحن نقول: حماس لم تحول القضية إلى دينية فهي في أصلها دينية.. اليهود حين تجمعوا من جميع أنحاء العالم، لماذا تجمعوا في فلسطين؟ لأنها بالنسبة لهم أرض الميعاد، فهم جمعوهم على أحلام وتعاليم دينية وتوراتية، فلماذا يراد منا نحن أن نلغي الإسلام من المعركة؟<br />وهذا ما أرادوه، يريدون أن يفرغوا القضية من جوهرها الديني، وحينما فعلوا ذلك هزموا الهزيمة تلو الأخرى؛ لأن اليهود دخلوا المعركة يهودا ولم ندخلها نحن مسلمين، دخلوها ومعهم التوراة ولم ندخلها ومعنا القرآن، دخلوها وهم يعظمون السبت ونحن لم نعظم الجمعه، دخلوا وهم يقولون الهيكل ونحن لا نقول المسجد الأقصى؛ ولذلك كان لابد أن نعيد المعركة إلى حقيقتها ندخل المعركة مسلمين نستعين بالله عز وجل ونستنصره على أعدائنا، ونقوي روح المؤمنين..<br />وبهذا عادت المعركة إلى طبيعتها ولهذا أعجبني صمود أهل غزة فرغم ما أصابهم من تجويع وحصار وشهداء لم يستسلموا أبدا.. إن شعبا مثل هذا لابد أن ينتصر بإذن الله، محال أن ينتصر الظلم على العدل والشر على الخير والإثم علي البر، محال أن ينتصر الفجور على التقوى."
