[[comments]]
order = 5
subject = "تعليمات الجهات العليا"
author = "Ashour"
posted = "2009-01-24"
text = "فهمي هويدي<br />اللعب في خبر مقتل ضابط الشرطة المصري علي الحدود مع غزة فتح عليَّ بابًا لم أستطع إغلاقه، لقد رويت في اليومين الماضيين كيف أن مصرع الضابط أثناء تبادل لإطلاق النيران مع بعض الفلسطينيين الذين قتل أحدهم وأصيب عشرة منهم أثناء محاولتهم اجتياز الحدود، هذه الواقعة نشرت كحادث مؤسف في البداية، ولكن الأجهزة الأمنية أعادت صياغتها بالكامل لتوظيفها سياسياً واستخدامها في حملة الكيد والتشهير، إذ حولتها إلي جريمة قتل عمد قام بها «ملثمون» من حماس بتعليمات من قيادتهم، في مؤامرة استهدفت إثارة الفوضي علي الحدود، هذه الصياغة الأمنية الجديدة التي عُممت علي كل وسائل الإعلام تجاهلت حقيقة أن تبادل إطلاق النار تم أثناء محاولة اجتياز الحدود، وأن ثمة قتيلاً وجرحي بين الفلسطينيين.. كما شددت علي أن العملية مدبرة بتعليمات من قادة حماس، وأن ضابط الشرطة الشهيد لم يكن يحمل سلاحاً وقتل غيلة وغدراً.. إلخ.<br />هذا الذي عرضته كان له أصداء متعددة استوقفني منها ما سمعته من بعض الزملاء المشتغلين في «المطبخ الإعلامي» وهو المصطلح الذي يطلق علي المواقع التي يتم فيها إعداد المواد الصحفية، والتي يكون العاملون فيها علي دراية بالتعليمات والتوجيهات التي تصدر عن الجهات العليا وتلك التي تحدد وجهة الخطاب الإعلامي، والخطوط الحمراء والخضراء التي ينبغي أخذها في الحسبان.<br />الدور الرقابي لم يكن غريباً عليَّ، وقد سبق وأن أشرت إليه حيث قلت يوم 6/12 إن إعلامنا موجه علي نطاق واسع، لكن ما كان جديداً هو التفاصيل التي سمعتها علي المدي الذي بلغه ذلك التدخل وبهذه المناسبة، وحتي لا أُفْهَم خطأ، أكرر أنني أحد الذين يؤيدون إقامة علاقات إيجابية بين الإعلام والسلطة ويعارضون الخصومة أو القطيعة بينهما، لكني أشترط أن تقوم تلك العلاقة علي أساس من الحوار والاحترام وليس التبعية والاستخدام.<br />كنت أعلم أيضاً أن الأجهزة الأمنية نجحت في اختراق كل وسائل الإعلام المكتوبة والمرئية والمسموعة، فذلك مفروغ منه بالنسبة للصحف القومية والتليفزيون والإذاعة، التي حولها الاختراق الكبير إلي أبواق للسلطة والأجهزة الأمنية، ولكن الجديد أن الأجهزة أدركت أن «المنابر القومية» تراجعت مصداقيتها بحكم اربتاطها العضوي بالسلطة، ومن ثم فإنها ركزت علي الصحف المستقلة، وحققت في أغلبيتها الساحقة اختراقات واسعة، مكنتها من استخدام تلك الصحف في شن الحملات علي المعارضين وتعبئة الرأي العام ضدهم، من خلال الأخبار المرسومة والمعلومات المغلوطة والصور المفتعلة، وما يسري علي الصحف المستقلة ينطبق بنفس الدرجة علي الفضائيات التي يفترض أنها مستقلة، ذلك أن هذه المنابر جميعها خاضعة للتوجيه الذي يتم بالتنسيق بين وزير الإعلام شخصياً وبين الأجهزة الأمنية، ولا مبالغة في القول بأن الاختراق إذا كان قد شمل الإعلام المحلي بجميع منابره وأشكاله، فإن ذلك الاختراق حاصل أيضاً بالنسبة لمكاتب الفضائيات العربية في القاهرة، وإضافة إلي مراقبة كل المواد التي تبث من القاهرة، من خلال أجهزة خاصة في مدينة الإنتاج الإعلامي، فإن سيف الإغلاق وسحب رخص البث مرفوع في وجوهها طوال الوقت، وقد نقل لي الزملاء أن وزير الإعلام بنفسه يهدد بإغلاق أي مكتب، يُشْتٍّم من أدائه أنه لا يلتزم بالتعليمات، وأي مشاهد يتابع تقارير مندوبي قناة «الجزيرة» مثلاً، حين يتحدثون عن الحاصل عند معبر رفح من الجانب المصري، ويقارنها بتقارير زملائهم المتحدثين عن ذات المشهد من الجانب الفلسيطيني لابد أن يلاحظ الفرق، إذ يدرك أن الأولين يتحدثون بحذر من يعلم أن وزير الإعلام يقف وراء ظهره منصتاً ومنذراً، في حين أن الآخرين ينقلون الصورة كما هي، مخاطبين المشاهدين وحدهم وعلي راحتهم.<br />حدثني الزملاء العاملون في «المطبخ» عن التعليمات التي تصدر من «الجهات العليا» داعية إلي التركيز علي مهاجمة حماس تارة، ودمشق تارة أخري، وإيران وحزب الله في مرة ثالثة، وقطر في مرة رابعة، وهذا الهجوم يخرج أحياناً في أخبار ومقالات منشورة، وأحياناً في حوارات تليفزيونية مرتبة، مزودة بالصور التي «تنضح» بها التعليمات، قالوا أيضاً إن وزير الإعلام والأجهزة المعنية يزوَّدون يومياً بأسماء المتحاورين في البرامج التليفزيونية المسائية، وأن الوزير كثيراً ما يتدخل لحذف أو إضافة أسماء بذاتها، وفي بعض الأحيان فإنه يتصل هاتفياً بأشخاص يدعوهم إلي المشاركة في المناقشات التي يقدمها التليفزيون للمشاركة في القيام بـ«الواجب».<br />هذه بعض المعلومات التي يمكن نشرها فيما نقلوه إليَّ في محادثات طويلة، وهناك معلومات أخري فضَّلت التريث في نشرها، لأسباب لا تخفي علي فطنتك، وأنت سيد العارفين!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "الحرب على حماس"
author = "Ashour"
posted = "2009-01-24"
text = "الدكتور عبد الستار قاسم<br />ما أن فازت حركة حماس بالانتخابات التشريعية حتى بدأت نشاطات تعطيل الحياة العامة الفلسطينية، وأعمال الإساءة والتضليل بهدف إفشال حركة حماس وإسقاطها وإعادة الأوضاع السياسية إلى ما كانت عليه قبل الانتخابات. تقريبا، كانت هذه النشاطات يومية، وبتكاتف جهات متعددة خارجية وداخلية، وتنوعت من إضراب عام إلى تفجير هنا أو هناك، ومن قتل وسفك دماء إلى برامج تضليل إعلامية. كانت هذه النشاطات مكثفة بحيث استهلكت جهود حكومة حماس وحالت بينها وبين تنفيذ أي برنامج عام.<br />منذ البدء، كان من المتوقع أن تقوم عدة جهات بالتعاون من أجل إعادة عقارب الساعة إلى الوراء وهي: القوى الداخلية الفلسطينية وإسرائيل والدول الغربية على رأسها أمريكا والدول العربية الدائرة في فلك واشنطون. كان من المتوقع ضرب حصار مالي على الشعب الفلسطيني، واستعمال آلام الناس واحتياجاتهم الغذائية واليومية للضغط على حماس، وتوتير الأوضاع الداخلية بهدف جر حماس إلى الاقتتال الداخلي. وكان من المتوقع أن يتم توظيف آليات إعلامية عالمية للتضليل وتحميل حماس مسؤولية تدهور الأوضاع الفلسطينية. وقد لاحظت، كمتتبع للأوضاع بدقة، كيف تم استعمال وسائل الإعلام والفضائيات بالتحديد، للكذب على الجمهور الفلسطيني وتحريضه، ولاحظت أيضا مدى التثقيف الحاقد الذي تقوم به أجهزة السلطة الفلسطينية ضد حماس بخاصة في صفوف حركة فتح.<br />طبعا لم تخل مسيرة حماس من أخطاء ذاتية، وقد سبق أن كتبت شخصيا حول هذه الأخطاء والتي منها ربطة العنق الحمراء والاكتفاء بردود الفعل دون الأخذ بزمام المبادرة، والتفرد بالمسؤولية واستثناء أصدقائها، والحرص على مشاركة مناوئيها. لكن حماس كانت ستتعرض لمختلف الضغوط حتى لو كانت منزهة عن كل خطأ ذلك لأن برنامجها لا يتوافق مع البرنامج الإسرائيلي الأمريكي.<br />طرد الأجهزة الأمنية<br />بذلت الأجهزة الأمنية في غزة جهودا كبيرة لزعزعة الأمن المدني للسكان وتحميل حركة حماس المسؤولية وذلك من أجل تأليب الناس على الحركة ودفعها إلى الاستكانة تحت وطأة الضغط الشعبي. حماس كانت حذرة جدا في الانجرار وراء الاستفزازات، لكن الغضب تملك العديد من عناصرها، ومنهم من استسلم للرغبة بالثأر والانتقام. تصاعدت الأعمال المخلة بالأمن المدني مع كل رد فعل عنيف من قبل عناصر حماس، ووصلت الأوضاع إلى حد الاقتتال الواسع وسفك دماء الفلسطينيين بالجملة بأيد فلسطينية أمام عدسات وكالات الأنباء العالمية والفضائيات. لحق بالشعب الفلسطيني أذى كبير وعار مشين.<br />حصل ما كان متوقعا وهو إقدام حماس على السيطرة على الأجهزة الأمنية. لم يكن من المتوقع أبدا أن تصمد الأجهزة الأمنية بوجه حماس، أو بوجه أي فئة فلسطينية مقاتلة مؤمنة بما تعمل ذلك لأن الأجهزة ليست مؤسسات حرب، وإنما مؤسسات للتأثير سلبا على النسيجين الاجتماعي والأخلاقي للشعب الفلسطيني ولتمكين الأمريكيين والإسرائيليين من المضي في مشروعهم التفاوضي. فضلا عن أن أغلب عناصر هذه الأجهزة ليسوا على استعداد للقتال من أجل قضية غير مقدسة، وهم هناك من أجل الراتب وليس من أجل الفتن والصراعات الداخلية.<br />أصيبت الدوائر الأمريكية بالذهول من سرعة سقوط الأجهزة الأمنية، على الرغم من أن إسرائيل لم تفاجأ وهي الأكثر معرفة بمستوى الانضباط والالتزام لدى كل من أفراد حماس وأفراد السلطة الفلسطينية. قدّر الأمريكيون أن مشروعهم بما يخص فلسطين قد أصيب بهزيمة كبيرة مما يؤثر حتما على مشروعهم العام في المنطقة العربية الإسلامية. ما كادوا يفيقون من صدمتهم بالجيش الإسرائيلي أمام حزب الله حتى صدمتهم أحداث غزة. يقوم المشروع الأمريكي ومعه الإسرائيلي على ضرورة تحويل الشعب الفلسطيني إلى أفراد يبحثون عن لقمة الخبز في كيان فلسطيني يعمل وكيلا أمنيا لإسرائيل، ولا شك بأن أي خلل في الموازين العسكرية الفلسطينية الداخلية سيؤثر بقوة على ما تم إنجازه وعلى ما يطمح الأمريكيون والإسرائيليون في إنجازه مستقبلا.<br />مشكلة دايتون<br />لم يكن الإسرائيليون راضين عن أداء كيت دايتون المنسق الأمني الأمريكي بين الفلسطينيين والإسرائيليين. لقد وجدوا فيه شخصا متهاونا مع الفلسطينيين، ويعطي السلطة الفلسطينية والأجهزة الأمنية وقتا طويلا لتنفيذ المهام الأمنية الملقاة على عاتقها. كان يفضل دايتون عدم الضغط أكثر من اللازم على السلطة وأجهزتها الأمنية حتى لا تقع بالإحراج أمام الشعب الفلسطيني وتخسر المزيد من شعبيتها، وكان يفضل تجريع الشعب الفلسطيني مسألة الدفاع عن الأمن الإسرائيلي تدريجيا وتحت ستار كثيف من الرشوات المالية.<br />لم تكن إسرائيل معجبة بمقاربة دايتون، وكانت ترى أن على السلطة الفلسطينية أن تعمل وفق الاتفاقيات المعقودة بالعلن وبوضوح، وأن مسألة التذرع بالإحراج يجب أن تسقط، وأن على من يتمتع بالأموال الغربية أن يكون جريئا في تلبية المطالب الغربية. طالبت إسرائيل بإزاحة دايتون، لكن الولايات المتحدة فضلت التريث خاصة أنه ليس من هيبتها إقالة أحد كبار ضباطها بسبب ضعف أدائه.<br />أتت سيطرة حماس على مقار الأجهزة الأمنية لتعزز التحليل الإسرائيلي في ضرورة الضرب بشدة على من يُسمون أعداء السلام من الإرهابيين ومن يوفرون لهم الدعم المادي والمعنوي والأخلاقي. بدأت إسرائيل وأمريكا بالتفكير في البحث عن وسيلة أخرى غير الأجهزة الأمنية، وعن أساليب جديدة للتجنيد في الأجهزة الأمنية الفلسطينية. لقد فشلت الأجهزة الأمنية بتركيبتها السابقة، ولا بد من البحث عن بدائل يمكن أن تصمد وتحافظ على السلاح الذي تقدمه إسرائيل أو دول عربية صديقة لإسرائيل. ما هي هذه البدائل؟ أغلب ظني أنها تتركز على صناعة جهاز جديد من المرتزقة الذين يعبدون المال والمتع والشهوات لكي يحلوا تماما مكان القيادات والعناصر الفتحاوية ذات التوجهات أو الميول الوطنية. ستكون هناك قيادات أمنية جديدة لا تعرف الله ولا تعرف الوطن ولا ولاء لها إلا لمصالحها، وتقود جيشا من الأغبياء والتيوس والمضللين الذين يظنون أنهم يحسنون صنعا ويدافعون عن الوطن.<br />رئيس وزراء جديد<br />في الوقت الذي انشغل فيه رئيس السلطة الفلسطينية بوصف ما جرى في غزة على أنه انقلاب يجب أن تتراجع عنه حماس، كانت الدوائر الأمنية الإسرائيلية والأمريكية تفكر في إستراتيجية العمل القادمة. رأت هذه الدوائر في رئيس وزراء جديد فرصة جديدة لامتطاء الشعب الفلسطيني بالمزيد ولتنفيذ ما تريدان تحت عنوان فلسطيني، بخاصة أن سنوات الحصار المالي قد دفعت العديد من الفلسطينيين إلى التفكير بالراتب على حساب القيم الوطنية والدينية. كان الهدف استقطاب الدعم المالي للشعب الفلسطيني في الضفة الغربية كغطاء لحملات أمنية تحمل في طياتها شعارات وطنية.<br />انزوى رئيس السلطة الفلسطينية جانبا أمام الدعم الغربي المقدم لرئيس وزرائه، واحتفظ لنفسه، أو سُمح له بالاحتفاظ بالوجود الإعلامي. هذا لا يعني أن رئيس السلطة غير معني باتخاذ خطوات أمنية، إنما قدّر الأمريكيون والإسرائيليون بأنه ضعيف وغير قادر على القيادة الفعالة، وأن عليهم أن يجربوا قيادة جديدة. أتت الرواتب، وامتلك رئيس الوزراء بعض القوة بفضل هذا المال أمام الشعب الفلسطيني ليكون الواجهة الفلسطينية لدايتون ولما يمكن أن تقوم به إسرائيل من نشاطات أمنية وعسكرية.<br />الحرب<br />وافقت إسرائيل على بقاء دايتون خاصة بعد أن تم تعزيزه بمنسق أمني أمريكي عام على مستوى المنطقة. انبرى دايتون لنمط جديد من العمل من الناحية الأمنية وأصبح أكثر جرأة في الطواف على المدن الفلسطينية، وأكثر حدية وجدية في التعامل مع الأجهزة الأمنية الفلسطينية. الآن هو يلقي الأوامر ويعطي التوجيهات، وتحاول وسائل الإعلام العالمية والمحلية أن تضلل الناس وتعزو الإجراءات الأمنية إلى رئيس الوزراء.<br />قرر دايتون أن يشن حربا على حماس وكل المقاومين الفلسطينيين من مختلف الفصائل الفلسطينية. وتنقسم خطته، كما يبدو، إلى التالي:<br />1- تعزيز التنسيق الأمني بين إسرائيل والأجهزة الأمنية الفلسطينية والإصرار على علنيته وإلزام القيادة الفلسطينية به كعمل مشروع ومطلوب من أجل المصلحة الوطنية الفلسطينية. التنسيق الأمني عبارة عن مادة واضحة للعيان وتمارس يوميا. الآن تتبادل الأجهزة الأمنية وإسرائيل الأدوار في القيام بالمهام الأمنية، ومن المحتمل جدا أن يكون النشاط الأمني مشتركا مستقبلا. الآن تقوم السلطة مثلا باعتقال بعض أفراد حماس، وبعد ذلك تدخل إسرائيل لتعتقل أفرادا من فتح؛ أو تفرج السلطة عن معتقل فلسطيني لتقوم إسرائيل باعتقاله في اليوم التالي.<br />2- تنسيق الأدوار في غزة بهدف إسقاط حكومة حماس إما من خلال القوة أو من خلال التمرد الشعبي. يقوم هذا على المحاور التالية:<br />أ‌- تشديد الحصار الاقتصادي والمالي على غزة إلى الدرجة التي لا يتهاوى فيها الناس جوعا وعريا. هذا عبارة عن مجهود عالمي تشارك فيه الدول العربية والسلطة الفلسطينية وإسرائيل والدول الغربية.<br />ب‌- تهديد الاستقرار الداخلي في غزة من خلال اغتيالات وأعمال تفجير واصطناع الأحداث بحيث تبقى حماس مشغولة بهموم يومية متعلقة بالأمن الداخلي المدني للناس، ويبقى الناس في حالة توتر قد تقودهم إلى التمرد على حماس. وقد قامت فئات بأعمال من هذا القبيل في غزة، وتم مؤخرا القبض على أفراد حاولوا زرع عبوة في احتفال الحجاج، وعلى شخص كان يحمل حزاما ناسفا.<br />ت‌- تكثيف الأعمال العسكرية الإسرائيلية لتطال كوادر وأفرادا وقيادات ومؤسسات ومراكز تابعة لحماس والجهاد الإسلامي ولجان المقاومة الشعبية، وذلك من أجل تكبيد الناس خسائر كبيرة تدفعها إلى التساؤل عن صلاحية حماس للقيادة والبقاء في الحكم. هذا ما نشهده على مدى أشهر في غزة والذي زادت وتيرته في الآونة الأخيرة بخاصة بعد زيارة بوش للمنطقة.<br />من خلال محاور العمل هذه يأمل الإسرائيليون والأمريكيون وفلسطينيون أن يثور الناس في غزة. أي أن أمريكا وإسرائيل تستعملان هموم الناس وآلامهم وأحزانهم من أجل تحقيق أغراض سياسية. وهذا هو الإرهاب بعينه وفق تعريفهما هما للإرهاب.<br />3- ضرب حماس في الضفة الغربية من قبل إسرائيل والسلطة الفلسطينية، وضرب المقاومين من حركة فتح من قبل إسرائيل. تقوم السلطة الفلسطينية بحملة شعواء ضد حركة حماس في الضفة الغربية، واعتقلت العديد من الأفراد وصادرت بعض قطع السلاح، وتقوم إسرائيل باعتقال أفراد حماس والجهاد الإسلامي وشهداء الأقصى أو قتلهم. بهذا تحاول إسرائيل وأمريكا إلغاء حماس وضرب بناها التحتية وتوفير الأجواء السياسية والاجتماعية المناسبة لقيادة فلسطينية جديدة تتمشى تماما مع المشروع الأمريكي الإسرائيلي. لم يعد هناك فكر ديمقراطي متداول في الضفة الغربية، وإنما هناك الآن أدوات وأساليب للقمع وانتهاك الحريات وإسكات الناس، ويتم توظيف وسائل الإعلام المحلية لخدمة هذا الغرض. من المهم الإشارة هنا أن وسائل الإعلام لا تعترض ولا يخرج منها صوت يصرخ دفاعا عن حرية الشعب الفلسطيني.<br />الفصائل الأخرى<br />على الرغم من ضعف الفصائل الفلسطينية الأخرى التي تؤيد السلطة، إلا أن المخطط حجز لقياداتها بعض المال لدفع الرواتب وتوفير السيارات ودفع أجور المكاتب. قيادات فصائلية كثيرة تتنكر تماما لمبادئ الفصائل ولفكرة التحرير والمقاومة، وتقف مدافعة عن المشروع الإسرائيلي الأمريكي عبر تبريرات وطنية واهية.<br />نابلس<br />عانت نابلس كثيرا من الفلتان الأمني الذي صنعته السلطة الفلسطينية. فإذا كانت السلطة حريصة على الأمن الفلسطيني فعليها أولا إسكات الفلتان الأمني ولو مؤقتا كمقدمة لتبرير خطوات التعاون الأمني مع إسرائيل. قامت الأجهزة الأمنية بأوامر عليا بإسكات المنفلتين والمنفلشين، ولاحقت السيارات المسروقة وشعر المواطن النابلسي بالارتياح. لا شك أن الناس في نابلس مسرورون لهذا التطور الداخلي.<br />تحاول السلطة الفلسطينية أن تستغل هذا التطور الآن للإقدام على خطوات أخرى تنسيقية مع إسرائيل معتمدة على صورة حسنة صنعتها لنفسها. يشاهد الناس في نابلس هذه الأيام عمليات دخول الإسرائيليين للمدينة بشكل شبه ليلي أو يومي، ويشاهدون جهود السلطة في اعتقال من يشتبه أنهم مقاومون فلسطينيون.<br />هل سينجحون؟<br />تقديري أن السلطة تمارس أعمالا تسيء لها وتخفض من شعبيتها. يظن الأمريكيون والإسرائيليون أن عمليات القمع القائمة حاليا ستحقق لهم أهدافهم، وهم حقيقة لا يتعلمون من تجاربهم. صحيح أن الناس يريدون الراتب، ويريدون إطعام أطفالهم، لكن أكثرهم غير مستعد لمقايضة الوطن بالراتب. سيمتدح بعض الناس الحكومة القائمة حاليا في الضفة الغربية وسيشكرونها على ما تقوم به من جمع للأموال، لكن ذلك لن يطول ما دامت السياسة العامة لا تصب في استعادة الحقوق الفلسطينية. أي أنهم سينجحون جزئيا ومؤقتا.<br />الأعمال التي يقومون بها تولد الكراهية والبغضاء والأحقاد بين الناس، وتولد الرغبات بالثأر والانتقام. إنهم ينجحون في بث كراهية شديدة بين أبناء فتح وأبناء حماس مما سيترتب عليه نتائج سيئة على المجتمع الفلسطيني. شعب فلسطين يدفع الآن ثمنا باهظا في نزاعاته الداخلية، وسيدفع مزيدا من الثمن مستقبلا.<br />المقاومة<br />من يظن أن طاولة المفاوضات الحالية ستؤدي على إقامة دولة فلسطينية لا يعرف بأسس ومقومات التفاوض، ولا يعرف بالعلاقات الجدلية التي يفرضها ميزان القوى، والتي يفرضها النظام الأخلاقي المستند على قوة جماهيرية.<br />لم يشتد عود الفلسطينيين لدرجة تقوده إلى طاولة مفاوضات حقيقية يسمع فيها العدو صوت الأوراق وهي تُضرب على الطاولة، ولا مجال أمام الشعب الفلسطيني إلا العودة إلى الذات وإعادة ترتيب أوضاعه الداخلية. وبما أن المقاومة عبارة عن أسلوب أساسي في اكتساب القوة وإظهارها فإن على الشعب الفلسطيني أن يتمسك بكل مقاوم حتى لو اختلف معه عقائديا وسياسيا. سواء كنت مسلما أو غير مسلم، قوميا أو وطنيا، متحزبا أو غير وتحزب، من واجبك عدم التفريط ب حماس والجهاد الإسلامي ومناضلي شهداء الأقصى ولجان المقاومة الشعبية. بل من الواجب دعم المقاومين ومن والاهم، وإذا كان لنا معهم خصومات عقائدية وسياسية فإن يوم التسوية لا يأتي قبل التحرير."
