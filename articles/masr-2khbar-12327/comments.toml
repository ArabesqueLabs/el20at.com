text = "اذا كانت بدأت فى ارقى وانظف احياء القاهرة - ماذا سيحدث لو وصلت للعشوائيات والقرى والنجوع والاحياء الشعبية حيث اكوام الزبالة وانفجارات المجارى والتكدس السكانى<br />ربنا معانا<br />وستضرب السياحة فى مقتل<br />ربنا معانا<br />وكل واحد يقعد فى بيتة ويصلى فى بيتة ويمتنع عن الزحام فى المترو والمواصلات<br />اللهم ارفع غضبك عنا<br />اللهم ارفع عنا غضبك"
