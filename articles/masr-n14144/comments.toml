subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-02-09"
text = "رحم الله مجدي مهنا كان من أشرف الرجال وندعو له أن يتجاوز عن سيئاته و يدخله الجنة بدون حساب"
archived = "2008-02-12"
