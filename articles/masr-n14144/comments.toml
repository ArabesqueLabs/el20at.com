[[comments]]
order = 0
subject = "والفقيد حاصل على بكالوريوس إعلام جامعة القاهرة عام"
posted = "2008-02-09"
text = "كده مية مية<br />الصحافي لازم يكون خريج كلية الاعلام<br />فهمتوها ولا لسه<br />زي المحامي بالضبط لازم يكون خريج كلية الحقوق والطبيب والمهندس<br />الصحافة ليست اقل<br />وعلى الصحافيين خريجي كليات الاعلام والصحافة ان يطالبوا بذلك"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043248/http://masr.20at.com:80/newArticle.php?sid=14144"

[[comments]]
order = 1
subject = "وتشيع الجنازة يوم الإثنين من مسجد الشرطة"
posted = "2008-02-09"
text = "اعوؤ بالله من الشيطان الرجيم<br />حرام عليكم ما لقيتوش غير مسجد الشرطة بتاع حبيب العدلي والامن المركزي وامن الدولة"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043248/http://masr.20at.com:80/newArticle.php?sid=14144"

