[[comments]]
order = 3
subject = "الدوام للة"
author = "زعلان"
posted = "2008-02-09"
text = "صرح وزير الصحة المثتثمر الكبير وصاحب اكبر مستشفى عالمى خاص فى مصر ان عدد مرضى فيروسات الكبد سى و دى قد انخفض من 12 مليون مواطن الى 8 ملايين مواطن فقط - وعندما سألة السادة الصحفيين عن السر فى انخفاض عدد المرضى وهل هو التقدم الطبى فى عصرة وعصر الديمقراطية وكثرة المستشفيات التى بناها للشعب -- رد الوزير<br />رد الوزير لا فض فوة<br />العدد انخفض من 12 مليون الى 8 مليون انسان لان المرضى ماتوا<br />وهذا واحد من المرضى قد مات<br />وينتظر على نفس الطريق 8 مليون مواطن<br />والدوام للة وانا للة وانا الية راجعون"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043248/http://masr.20at.com:80/newArticle.php?sid=14144"

[[comments]]
order = 4
subject = "وللة الامر من قبل ومن بعد"
author = "واحد"
posted = "2008-02-09"
text = "ليجهز كل واحد فيكم كفنة ويتسلح بصالح الاعمال<br />فالكبد يتجول فى شوارع مصر ويحصد الناس<br />لا امان<br />الخوف والفزع يملىء المدينة<br />نحن شعب موبوء<br />الغوث ثم الغوث يا اللة"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043248/http://masr.20at.com:80/newArticle.php?sid=14144"

[[comments]]
order = 5
subject = "زمان حمدى رزق"
author = "عطوة ابو مطوة"
posted = "2008-02-09"
text = "فى زمان يقراء صحافتة كل مساء حمدى رزق ،ويكتب كل صباح فى صحافتة عبداللة كمال ،فلا مكان للشرفا ء مثل مجدى مهنا ،ومبروك مقدما لحمدى رزق مكان عمود مجدى مهنا مع العلم انة مش هايجى رئيس لتحرير المصور ."
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212043248/http://masr.20at.com:80/newArticle.php?sid=14144"

