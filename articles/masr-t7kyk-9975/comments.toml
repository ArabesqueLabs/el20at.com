[[comments]]
order = 0
subject = "عروسة من غير شبكه ولا شقة ولا عفش ولا مهر ولا اي ح"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-09-01"
text = "يا علياء يا ابو شهبة العروسة اصبحت من غير اي حاجه خالص<br />لا شبكه<br />لا شقة<br />لا عفش<br />ولا مهر<br />بس عروسة<br />فراية فتحه<br />وتضرب هي والعريس عقد عند اي واحد محامي<br />وخلصت المسالة<br />بلاها مصاريف على الفاضي يا شيخة<br />وكل دا بسبب البعد عن منهج النبي محمد صلى الله عليه وسلم<br />سلام يا عليؤتي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "جايز هيجي اليوم والشبكة تيجى إنما"
author = "مش رضوى حسن ولا مروى صلاح ولا"
posted = "2008-09-01"
text = "وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "ولا بد من يوم محتوم اشترى لك دبلة"
author = "شبكة"
posted = "2008-09-01"
text = "والشبكة جوز دبل<br />والشقة غرفة فى شقة امى<br />والعفش سرير ودولاب وتلفزيون وطقم حلل وبوتاجاز مسطح<br />ولازم تستمر الحياة"
archived = "2010-03-14"
capture_url = ""
