text = "القمامة الاهم هي الاحتلال الغاشم وبعدها المسارعة الى انقاذ الذاكرة العملاقة للحضارة هناك بعد رمي قمامة المنبطحين والخونة والعملاء والمطبلين والاذناب الذي يزورون الحقيقة ويبيعون الوهم .....بعدها تامم الشخصية الوطنية والحضارية فلا نجد قمامة لنتسابق حول جمعها"
