[[comments]]
order = 0
subject = "اي حاجه تجيب فلوس"
author = "مش ححبك"
text = "يا استاذة مروة فيه حاجه اسمها اكل عيش<br />وطبعا حضرتك عارفة الحالة في مصرنا<br />كل واحد بيحاول يهرب من المجاعة<br />الاخت ايناس الدغيدي بتعمل افلام تجيب فلوس<br />وطبعا انتي عارفة ان الجواز في مصر اصبح مع ايقاف التنفيذ بسبب الخطط الخمسية المتوالية لحكوماتنا الرشيدة التي بدأت فور مغادرة الملك فاروق البلاد خمسه وخمسين سنه خطط خمسية (خمسه وخمسين على خمسه) يعني 11 خطة خمسية اوصلتنا الى هذا المستوى<br />الست ايناس الدغيدي دي عايزه تكسب فلوس على اد فكرها ومفيش قدمها غير الجنس تكسب منه فلوس<br />ست شاطره<br />زي مثلا الناس اللي بيشتغلوا في الحديد<br />ما لقوش غير المقابر لسرقة حديد الشبابيك والابواب بتاعتها وياسر ابو العلا عمل موضوع عنها<br />المهم ان كل واحد بيحاول يهرب من المجاعة بطريقته الخاصة وايناس الدغيدي ما عندهاش غير افلام الجنس تكسب منه<br />معلش لنا الله"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806112608/http://masr.20at.com:80/newArticle.php?sid=17060"

[[comments]]
order = 1
subject = "االشذوذ لماذا ؟"
author = "مش عاارف"
text = "بين النساء احيانا يكون الشذوذ اكثر متىعة اذا كان الزوج مقرف ؟<br />اسألوا زوجها - هل انت مقرف ومقزز ؟<br />العلاقة بين الانثى والانثى اكثئر متعة للشاذة"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806112608/http://masr.20at.com:80/newArticle.php?sid=17060"

[[comments]]
order = 2
subject = "لا تصلح كماكينة للشذوذ او الطبيعى"
author = "بؤرضة"
text = "دى امرأة مخوخة - ضربها السلك - منظر من برة - شذوذ اية - دى عندها هشاشة عظام - وايلة للسقوط<br />ادفنوا موتاكم -يرحمكم اللة"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806112608/http://masr.20at.com:80/newArticle.php?sid=17060"

[[comments]]
order = 3
subject = "شاذة الفكر وعديمة الاخلاق"
author = "سواق تاكسى"
text = "ايناس الدغيدى عندها شذوذ فعلا عندها شذوذ عقلى وذهنى؟؟ ده غير الشذوذ اللى فى؟؟؟ واثر ده كله بيظهر فى افلامها وطريقة تدخينها للسيجاره وعروق وجهها الشاحب وعدم اهتمامها بنظافة اسنانها وحبها للحديث عن الجنس فى اى مناسبه حتى لوكانت سرادق عزاء احد الممثلين ولو مش مصدقنى اسالو هاله سرحان او يسرا؟ فهذ الثالوث الشاذ له من الاسرار والخفايا مايندى له الجبين"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806112608/http://masr.20at.com:80/newArticle.php?sid=17060"

[[comments]]
order = 4
subject = "ضع عنوان التعليق"
author = "واحد مصري"
text = "الملعونة دي قالت قبل كدة ان غلمان الجنة للجنس<br />الله يحرقها<br />ربنا يخلصنا من العالم الزبالة الى خربت البلد احنا لو عندنا حكومة عدلة دي لازم تتسجن عشان السموم الى عايزة تروجها للناس"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806112608/http://masr.20at.com:80/newArticle.php?sid=17060"

[[comments]]
