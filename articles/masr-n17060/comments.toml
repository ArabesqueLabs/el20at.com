subject = "ممكن تكون عندها مرض نفسي"
author = "مش هو"
text = "بصو في الصورة كويس<br />اي والله العظيم<br />ممكن تكون مريضة لابد من عرضها على طبيب نفساني"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806112608/http://masr.20at.com:80/newArticle.php?sid=17060"

[[comments]]
order = 6
subject = "ايناس الدغيدى مخرجة مصرية محترمة"
author = "عبد الله المصرى"
text = "انا الحقيقة مش شايف اي داعى لكل الشتيمه الى في التعليقات على ايناس الدغيدى يمكن تكون الست متأثره شويه<br />بالثقافة الغربية مفيش مشكلة كتير جدا من المثقفين المصريين وضعهم زيها و بعدين تقدم الغرب و تطوره فى جميع المجالات<br />ممكن يخلي الواحد يغير شويه افكار و بعدين انا مش شايف ان افلام ايناس الدغيدي بتروج للحريه الجنسيه يعنى مثلا<br />فيلم مذكرات مراهقة \\\"هند صبرى \\\" اتدمرت حياتها و حياه اسرتها بسبب علاقتها الغير شرعية مع \\\"احمد عز\\\" بطل الفيلم<br />و بعدين في افلام مهمة لايناس الدغيدى بتحارب الفساد و الجهل ده غير ان فكرة الحكم على انسان ب 80 جلده<br />علشان عنده فكر معين و حطه فى فيلم ده حاجة في منتهى التخلف يعنى مش معقول ممدوح اسماعيل ياخد براءة<br />و ايناس الدغيدى يتحكم عليه ب 80 جلده و اخيرا ايناس الدغيدى يمكن يكون عندها شوية افكار غريبة لكنها مخرجه مصرية محترمه ممكن نختلف مع بعض الافكار الوارده في افلامها لكن مش نجلدها و ان السيده سعاد صالح تحسبل و تحوقل و تحمد ربنا انها ما شفتش البرنامج بدل ما ترد عليها بالحكمه و الموعظه الحسنه علشان يبقى في حوار محترم<br />و متحضر و ده غير الدكتور عبد الله السايح الي بيقول ايناس الدغيدى معروفة بمفاهيمها التي لا تقام سوى على الجنس، ولا أعرف إلى متى سنسمح لها بالتمادي السؤال هل شاهد الدكتور فيلم واحد من افلامها ثم هو عايز اننا لا نسمح<br />لها بالتمادى يعنى مش عارف نعملها ايه نحطها فالسجن ولا نمنعها من صناعة الافلام يعنى نكمم الافواه علشان<br />هي بتقول راى يخالف رايه بدل ما يرد عليها بشكل علمى و موضوعى و ده غير انه بيقول ان هى افسدت عقول الشباب<br />رغم ان في بدل السبب الف سبب اولى ان هو يتكلم عنهم انهم افسدوا عقول الشباب قبل ما يتكلم عن ايناس الدغيدى<br />الي هو فعلا غالبا ما شفش افلامها و انا نفسي اعرف ايه هي القضايا التانيه الي بيتبناه الاستاذ نبيه الوحش غير قضية<br />الست ايناس الدغيدى و لا هو ده اهتمامه الوحيد فالحياه<br />عيب ان احنا نهتم قوى باننا نحارب مخرجة سينما قبل ما نحارب الفاسد و الحرامى و المزور و السفاح و المغتصب<br />و لكم جزيل الشكررررررررررررررررر"
archived = "2008-08-06"
capture_url = "https://web.archive.org/web/20080806112608/http://masr.20at.com:80/newArticle.php?sid=17060"
