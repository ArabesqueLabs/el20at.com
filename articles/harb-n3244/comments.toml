subject = "روء وبعدين سوء يا زوء"
author = "ياااااااااااااااااسمين"
posted = "2008-08-14"
text = "هااااااااااااااااي......كيفكن...........شو اخباركن .......على فكرة هيدا الموضوع كتير هادي وحلو وطبعا ميرسي كتير لالك يا رانيا على هيدا الكلام الزوء انا كتير معجبة بهيدي النصائح الحلوة لاني انا ما بعرفها كلها بس بحاول دائما كون هادية في السواقة لانه الكل عم يئلي مجنونة سواقة.......وبدكن النهفة مرة كنت عم اسمع البوم تامر الجديد ومو مركزة بشي وكنت يومها سارقة سيارة البابا وطالعة فيها وطبعا ضربتها ضربة صغيرة وطبعا لانها جديدة راح نص حقها على الفاضي وكل هاد نتيجة شوية لا مبالاة وعدم ادراك ههههههههههههههههههه بس لازم الواحد يتعلم من اخطائه وهلا باي ومع تحياتي لكل مجانين السواقة ومهبيل التخميس ههههههههههههههههههههه بااااااااااااااااااااي"
archived = "2010-03-14"
