[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "1970-01-01"
text = "ياسيدتي دي نصائح تقوليها لواحد مسافر أوروبا ولا حاجة<br />بس هنا في مصر ممكن تحذي حذوا الأستاذ شعبان في نصائحه الغالية في أغنيته وفيها يقول<br />خد بالك من الكمين لا الظابط يمسكك<br />أوراقك لوسليمة ولا عمره يقلبك ...<br />بلاش شغل الأونطة خليك في الأمان<br />متجبش حزام شنطة .. تعمله حزام أمان وأييييييييييييييييييييييييه"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193447/http://www.harb.20at.com:80/newArticle.php?sid=3244"

[[comments]]
order = 2
subject = "فينك من زمان؟"
author = "واحد من الناس"
posted = "2007-10-05"
text = "والله من زمان وانا كنت بدور على كتاب الاشارات علشان امتحان القيادة اصلى كنت عايز اطلع رخة لو كنت اعرف انك عندك نسخه من الكتاب كنت اخدته منك على فكرة انا قبل ما اروح اطلع الرخصة اتصلت بصديق لتله انا رايح اعمل رخصة وشوفلى حد من معارفك يوصى عليا قالى والله اللى اعرفه فالمرور مش عايز يتوسط علشان رمضان وكل سنة وانت طيب هو صايم وخايف من ربنا قالى خليها بعد رمضان على طول قلت وعلى ايه انا رايح واللى يحصل يحصل ودخلت امتحنت ولاقيت بجد امتحان السواقة تافه لدرجة ان اللى مش يعمله مرتثين تلاتة من غير تدريب عليه مخصوص يبقى مش يستحق رخصة ومش عارف ليه البنت اللى امتحنت قبلى واللى امتحنت بعدى جاية تطلع رخصة يتلهو على عينهم دول مش بيعرفو يسوقو اصلا الامتحان اهبل جدا وفرحت اوى لما الظابط سقطهم فالكشف وعرفت انا احنا بلد فعلا عكس ما يقال عنها وتانى يوم رحت اتصور علشان استلم الرخصة وبعد ما اتصورت فوجئت فايدى باربع رخص ورقة واحدة قال ايه انزل غلفهم وقطعهم ووزعهم على زمايل وانكشحو من هنا عايزين ايه تانى وحانت منى التفاتة فضوليه على التلات رخص التانين لافاجاء برخصتين يخصو البنتين الساقطين اللى واحدة منهم معرفتش تطلع بالعربية برة التراك بعد ما شاطط كل العساكر قدامها والتالتة لواحدة ممتحنتش اصلا بس عندها مقومات تخلينى لو مسؤل اديها رخصة عربية مش رخصة سواقة ورخصتى الغلبانة وصورتى انكمشت فوسط 3صور ل3 عربيات قصدى بنات ومن يومها وانا بدور على اى خبر عنهم فالحوادث واكيد هلاقى"
archived = "2008-05-22"
capture_url = "https://web.archive.org/web/20080522193447/http://www.harb.20at.com:80/newArticle.php?sid=3244"

