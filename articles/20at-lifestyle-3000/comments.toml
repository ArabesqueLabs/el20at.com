subject = "كله صح الا الاصفر"
author = "ريما"
posted = "2007-01-21"
text = "بس بلاش بس تاشر بصف قدامك طابور تكاسي<br />انا اصلا دبست بشرا سيارة بالتقسيط من ورا مرمطت التكاسي... جرب يا اخي وقف تكسي بالشمساني بين الساعة 3 و الساعة 5... حتموت و انت واقف ... و لا يا سلام تكسي بعد الساعة 2 برمضان... انا مرة ضليت للساعة 5 بالشارع بستنى تكسي... و الامر اتلاقي تكسي الصبح... انا دوامي كان على 8 و بيني و بين شغلي 10 دقايق بالسيارة و مع هيككنت اطلع من السبعة عشان اضمن اوصل بالموعد... مهو هالتكاسي على كترتهم وقت الزنقة ما بتلاقيهم...وما تقليش خدي باص ولا سرفيس...مفيش باصات ولا سرفيس على خط شغلي وكمان اذا في لازم امشي تلت ساعة للشارع الرئيسي عشان اوصل للموقف...وهاد طبعا اذا لقيت فيهم كرسي وقت الازمة كان الصبح ولا الضهر<br />قلبت علي المواجع الله يسامحك..."
