subject = "هو الانفجار علشان زيادة القبضة الامنية والحد وتقلي"
author = "اكتب اسمك هنا"
posted = "2009-02-22"
text = "طبعا شىء لزوم الشىء<br />الامن لازم يحكم القبضة الحديدية ويقبض على الرؤس المشاغبة ويعمل شوية محاكم عسكرية علشان الاضرابات تخف شوية والواد ايمن نور يتلم شوية<br />يعنى كدة من شكل الحادث انة مدبر<br />مين اللى عندة استعداد يفجر والبلد متفجرة اصلا"
