subject = "حملة اترضاه لأمك"
author = "مش حؤلك"
text = "عمر خالد عمل حملة في رمضان اسمها سأحيا بالقرأن<br />نريد واحد صحفي كده كبير يعمل حمله اعلامية كبرى اسمها لأمك لما كل واحد نازل يعتدي على انثى ويتخيل امه في نفس الموقف<br />حيغير رأيه على طول وحيبتعد عن هذا الفعل يلا يا صحافيين مين حيعمل حملة لامك لمكافحة التحرش<br />مفيش غيرك يا استاذ عبدالله الطحاوي<br />عمر خالد من اجدع منك"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063800/http://masr.20at.com:80/newArticle.php?sid=17796"

[[comments]]
