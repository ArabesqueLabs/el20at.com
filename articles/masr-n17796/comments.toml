subject = "كل من يتحرش جنسيا باى انثى ايا كانت يجب ان(يخصى)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "يجب عقاب كل من يتحرش باى انثى اية كانت حتى و لو كانت(عاهرة داعرة)<br />بان يخصى<br />و توضع صورة و اسمة و عنوانة و عنوان عملة على صفحات الجرائد؟<br />و لسوف نتكلم عن كافة صور التحرش الجنسى على اختلاف اشكالها و مسمياتها<br />بخبر(كان ياما كان)<br />و التجربة خير برهان؟"
archived = "2008-10-11"
