[[comments]]
order = 13
subject = "انما الامم الاخلاق مابقيت فان هموا ذهبت اخلاقهم ذهبوا"
author = "امة الله"
text = "عمركم شوفتم بلد رجالها يجروا خلف بناتها في الطريق العام علشان يشدوا لهم هدومهم الا في مصر؟<br />عمركم شوفتم مخلوقات بيسموهم رجالة واقفين يتفرجوا علي المهزلة من غير ما يدخلوا و يدافعوا عن البنات في الشارع الا في مصر؟<br />عمركم شوفتم مخلوق اسمه راجل ........اسفة ذكر<br />يوم ما قالوا له ضع حل بدل ما يقول ربوا عيالكم كويس يا مدعين التدين قال البنات تبقي في بيتها من بعد العصر ؟<br />تخيلوا ان شوارع اوروبا اامن من شوارع مصر للنساء الان<br />و ان رجال اوروبا بهم نخوة و حمية اكتر من رجال مصر الان و انهم يساعدوا من تستغيث في الشوارع<br />يبدو ان هذه البلد يجب ان تخلوا علي ذكورها<br />اللهم نجني من القوم الظالمين<br />عايزين تعرفوا ايه السبب الحقيقي ان ماتت داخلكم الاخلاق و النخوة و الصلاح و قال عايزين حكومة طاهرة و صالحة طب منيين شوفوا نفسكم الاول بتعاملوا بعض ازاي لا و بتعاملوا الضعيف بينك ازاي<br />حسبي الله و نعم الوكيل"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063800/http://masr.20at.com:80/newArticle.php?sid=17796"

[[comments]]
order = 14
subject = "ضع عنوان التعليق"
text = "للاسف بنات كتير بتحب تتعاكس وتبين امام زميلاتها في انها مرغوبة اكثر منها<br />او لمجرد ان تشعر بانها مرغوبة وفي ذلك يتفنن في اظهار انوثتهن بكل الطرق المشروعة والغير مشروعة<br />وفي مجتمع مثل مجتمعنا الان وفي ظل الظروف الاقتصادية الضحلة وصعوبة الزواج وانتشار الفضائيات التي تظهر كل شيئ عار وخاصة المرأة , وفي ظل انتشار وصلات الانترنت والتي للاسف في مصر لم يتم فلترة المواقع الاباحية<br />وانتشار النت كافيه في كل شارع اصبح الجن هو اهم شيئ للشباب الان , فان لم يكن جنس كامل يكون تحرش"
archived = "2008-12-11"
capture_url = "https://web.archive.org/web/20081211075456/http://masr.20at.com:80/newArticle.php?sid=17796"

