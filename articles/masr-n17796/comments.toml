[[comments]]
order = 6
subject = "النبي محمد صلى الله عليه وسلم والنهوض بالجزيرة العربية بفضل المنهج الرباني"
author = "ابومحسن غربة 27 سنه"
text = "طبا احنا في دولة اسلامية اسمها مصر واذا كانت كعبة المسلمين في مكه فمصر وهبها الله كعبة العلم الا وهي الازهر واذا كان المسلمين يتجهون في الصلاة الى الكعبة فالمسلمون ايضا يتوجهون الى مصر لطلب العلم الشرعي والتاريخ خير شاهد على ذلك.<br />طبعا النبي محمد صلى الله عليه وسلم واله عندما بعثه الله الى سكان جزيرة العرب كانوا همج القوي يأكل الضعيف<br />فمكث معهم النبي محمد صلى الله عليه وسلم 23 سنه علمهم منهج الرباني وطلب منهم ان يسيروا على المنهج ليروا المعجزه<br />وبعد وفاة النبي ظهرت المعجزة بدايتها في القادسية واليرموك حتى وصلت الى الاندلس والهند<br />والقضية التي طرحها الاستاذ عبدالله الطحاوي مشمولة بمنهج النبي الرباني وعيب اوي اوي اوي لما يكون ناس في بلد الازهر مش عارفين لما الواحد ما يكنش قادر على الزواج ايه الحل<br />احنا عارفين الحل ولكن بنسطعبت على راي المثل<br />عيب اوي اوي في بلد الازهر ما نكنش عارفين ان فيه واحد شاب جاء الى النبي صلى الله عليه وسلم وقال له ابح لي الزنا يا رسول الله<br />فقال له الرسول صلى الله عليه وسلم اترضاه لامك فقال لا فقال اترضاه لاختك قال لا (لطفا يرجى مراجعة الحديث مع الشرح)<br />وهنا بداية حل المشكلة ان الاخ اللي نازل يتحرش يتخيل ان له ام واخت ممكن ان يفعل بهما نفس الفعل فيتحقق الردع في نفسه ويرفضه<br />وفي ناحية اخرى من منهج النبي امر الرسول صلى الله عليه وسلم الذي غير قادر على الزواج عليه بالصيام<br />وحلول كثيرة مشمولة بالمنهج الاسلامي الرباني الذي جاء به النبي محمد صلى الله عليه وسلم والذي اثبت جدارته في اقل من مائة عام بعد رحيل النبي محمد صلى الله عليه وسلم<br />وطبعا كل كلام دا وكلام كثير اتحفنا به فضيلة العلامة الشيخ محمد متولي الشعراوي رحمه الله في دروسه لتفسير القران الكريم<br />والحمد لله تطور العلم جعل كل دروس الشيخ محمد متولي الشعراوي في تفسير القران على اسطوانة واحدة<br />رحمك الله يا شيخ يا شعراوي"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063800/http://masr.20at.com:80/newArticle.php?sid=17796"

