[[comments]]
order = 0
subject = "إجابات"
author = "علي عبد المنعم"
text = "أشاع المصريون خرافة أننا شعب متدين وصدقنا الخرافة، فلا نحن متدينون ولا حتى \\\\\\\"بنعرف ربنا\\\\\\\" لا في تعاملاتنا ولا حياتنا، ولذلك تربى شبابنا على كل شيء عدا شريعتنا الإسلامية التي تعطي الأمن والأمان لكل عابر في الطريق..<br />أجدت يا أ.عبد الله في كل مقالك في وصف حالنا وفي اقتران مسألة الضعف الجنسي بمسألة التحرش الجنسي، وأنت محق تماماً في أننا نخاف من الحكومة ومن التظاهر ضدها، فأخرجنا كبتنا ضد البنات في الشوارع، ولكن أختلف معك يا أستاذنا في مسألة أن هناك بنات \\\\\\\"يتمنعن وهن الراغبات\\\\\\\"، فالتحرش يأتي على غير إرادة البنت حتى لو كانت تتمنى.. كما أن حالات التحرش في المهندسين ووسط البلد ومدينة تمت ضد بنات شريفات يرتدين ثياباً محترمة كما أكد عدد كبير من المدونين الذين تواجدوا في أماكن التحرش.. فالحوادث تلك لم تتم بسبب أن البنات قامت بإغراء الشبان.. ولكنه فعل فاضح تم بصورة حيوانية ضد بنات بريئات لا لهن أي ذنب في تلك الحوادث<br />أشكرك على مقالك القيم.. وزادك الله بسطة في العلم يا أستاذنا :))"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063800/http://masr.20at.com:80/newArticle.php?sid=17796"

[[comments]]
order = 1
subject = "كل ده"
author = "ابو يوسف"
text = "كل ده من الاسباب الداعية للتحرش فكثير من الشباب والشبات يعتقدوا ان العادة تفرغ الطاقة وعلي العكس هي تزيد من التوتر وتدفع لمزيد من حب التجربة الحقيقة<br />وفي ظل مجتمع فقر ومغلق ومتخلف جنسيا يكثر التطرف الجنسي كما يحدث ايضا في المجتمعات الغنية والمفتوحة و ذات التعلم الجنسي والسبب الوحيد انها كما قال المحرر في العنوان طاقة نووية<br />ويبقي ان نعرف طاقة ننوية سلمية للبناء ام انها كاقة نووية هدامة<br />:) ومحدش يقول لامريكا ان في طاقة هنا :)"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063800/http://masr.20at.com:80/newArticle.php?sid=17796"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
author = "منير أديب"
text = "حقيقي مقال جميل ورشيق كما أنت يا عبد الله؛ عودتنا دائما علي عبارات سهلة ومفهومة وذات أبعاد عميقة كما أنت أيضا،فكل ما تقولة يصل إلي القلب كما تصل أنت أيضا إلي القلب عندما تلقي الناس.<br />حقيقي أنا سعيد بالمقال وبروحك الحلوة اللي كتبت هذا المقال، وهذا إن دل فإنما يدل علي قوة نووية تحملها في أحشاءك، وهذا إن دل أيضا فإنما يدل عيل طبيعة مخزونة وتقليد أعمي للغرب والأمريكان الذين يملكون هذه القوة ويستأثرون بها، وعلي كل الأحوال أسعدك الله في كل حياتك العامة والخاصة وبارك الله فيما رزقك إياه، واللي أعطاك يعطينا يا سيدي"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063800/http://masr.20at.com:80/newArticle.php?sid=17796"

