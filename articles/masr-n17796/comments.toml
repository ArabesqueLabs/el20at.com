text = "من علامات يوم القيامه قبض العلم<br />وفعلا بعد وفاة الشيخ محمد متولي الشعراوي انطلق الرؤوس الجهالة<br />ولذذلك انصح كل المسلمين اللي عايز يسمع دروس في الدين فعليه باستطوانة الشيخ محمد متولي الشعراوي وهي موجودة على النت"
