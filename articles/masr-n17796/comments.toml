[[comments]]
order = 8
subject = "عزيزي المتحرش اترضاه لامك حلت المشكلة"
author = "مش ححبك"
text = "أترضاه لأمك؟!!<br />عن أبى أمامة (رضى الله عنه) قال: إن فتىً شاباً أتى النبى (صلى الله عليه وسلم) فقال: يا رسول الله ائذن لى فى الزنا ، فأقبل القوم فزجروه ، وقالوا: مه مه (*)!<br />فقال له: \\\\\\\"ادنه\\\\\\\" – أى اقترب منى – ، فدنا منه قريبا ،<br />قال: أتحبه لأمك؟ قال: لا والله ، جعلنى الله فداءك.<br />قال: \\\\\\\"ولا الناس يحبونه لأمهاتهم\\\\\\\".<br />قال: أفتحبه لابنتك؟ قال: \\\\\\\"لا والله يا رسول الله ، جعلنى الله فداءك\\\\\\\".<br />قال: \\\\\\\"ولا الناس يحبونه لبناتهم\\\\\\\".<br />قال: أفتحبه لأختك؟ قال: \\\\\\\"لا والله ، جعلنى الله فداءك\\\\\\\".<br />قال: \\\\\\\"ولا الناس يحبونه لأخواتهم\\\\\\\".<br />قال: أفتحبه لعمتك؟ قال: \\\\\\\"لا والله ، جعلنى الله فداءك\\\\\\\".<br />قال: \\\\\\\"ولا الناس يحبونه لعماتهم\\\\\\\".<br />قال: أفتحبه لخالتك؟ قال: \\\\\\\"لا والله ، جعلنى الله فداءك\\\\\\\".<br />قال: \\\\\\\"ولا الناس يحبونه لخالاتهم\\\\\\\".<br />قال – رواى الحديث – فوضع يده عليه ، وقال: \\\\\\\"اللهم اغفر ذنبه وطهر قلبه ، وحصن فرجه\\\\\\\" فلم يكن بعد ذلك الفتى يلتفت إلى شىء ([1]).<br />وهذا الموقف الحكيم العظيم مما يؤكد على الدعاة إلى الله – عز وجل – أن يعتنوا بالرفق والإحسان إلى الناس ، ولاسيما من يرغب فى استئلافهم – من الألفة – ليدخلوا فى الإسلام أو ليزيد إيمانهم ، ويثبتوا على إسلامهم.<br />*مه: كلمة زجر ، وهو اسم فعل أمر بمعنى: اسكت ، وقيل معناها: ما هذا؟ انظر شرح النووى على مسلم (3/193).<br />([1])رواه الإمام أحمد عن أبى أمامة ، وذكره الهيثمى فى مجمع الزوائد وعزاه إلى الطبرانى وقال: رجاله رجال الصحيح (1/129) – انظر الصحيحة للألبانى – عليه رحمة الله – (370)."
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011063800/http://masr.20at.com:80/newArticle.php?sid=17796"

