[[comments]]
order = 1
subject = "موضوعك رائع"
author = "شاب مصري جاهل"
posted = "2007-06-17"
text = "مش عارف اعلق ,اقول إيه لما يكون شعب ماسك فس قشة على أمل انه يلاقي حل مع حكومة لا يهمها الا رجالها .<br />منى تجربتك حلوة أوي وجميلة أوي انك تقفى على باب 15 علشان تعرفي ايه اللى ممكن يحصلك لو عندك مشكلة ورحتي تعلنيها يمكن حد يرحمك ويحلها .<br />أحييك يا منى على موضوعك وأحييك إنك لمستي مشاكل الناس وإحييك على إنسانيتك .<br />الموضوع عجبني ويمكن لما سمعته منك غير لما قرأته .<br />معلش يا شعب مصر الغلبان وجربوا وإعلنوا مشاكلكلم يمكن حد محترم يسمعها ولو اني أشك<br />فما في النار للظمئان ماء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "شعب له الجنة"
author = "الموكوس الأكبر"
posted = "2007-06-23"
text = "والله يا اخوانا و بدون اي مبالغة ومع عشم كبير فى ربنا , أنا حاسس أن شعب مصر كله و بالكامل هيدخل الجنة و لو بعد حين , لأن بصراحة اللي احنا شايلينه و ساكتين كتير أوى أوى و محدش يقدر يستحمله, مش عايز يبقى دمى تقيل و أشيل الناس هموم زيادة ولكن اقدر أقول أن طالما فيه حد فقير و له حاجة مثل هؤلاء الغلابة , فانه بالتأكيد هناك على الجانب الآخر أغنياء و عرابيد لا يؤدون حقوق الله في البسطاء. الناس برة في الأمارات مثلا بتاخد فلوس من الحكومة لمجرد كونهم ماطنين أماراتيين. و ربنا يولي فيهامن يصلح و يجعله عامر."
archived = "2010-03-14"
capture_url = ""

