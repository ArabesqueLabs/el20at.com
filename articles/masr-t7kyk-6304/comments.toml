subject = "فين اولاد البلد بتوع زمان"
author = "بسلة مسلمة مصرية"
posted = "2007-07-03"
text = "اولا ليا تعليق على ولاد البلد بصراحة النظام لاول كان احسن ؛ انا بشتى كل الجرايد مش محتاجه اقرئها هنا انا عايزة اقرء ارائكم .<br />الموضع جميل جدا ومكتوب بطريقة رائعة واكثر من رائعة تبين حالنا لحكومة مش بتشوف ولا بتسمع ولا بتحس ولا فى فوشهاشوية دم ."
