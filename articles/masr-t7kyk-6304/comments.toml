subject = "الى الاستاذ / محمود سعد"
author = "امال"
posted = "2008-05-02"
text = "تعليقى على هذا الموضوع اولا : اقول لك الله يعينك يا محترم جدا فعلا انت انسان محترم وتستحق كل تقدير لانك بتسعى وبتتعب من اجل مساعدة الغلابة المحتاجين اسأل الله ان يعينك ويوفقك ويجازيك كل الخير امين يارب العالمين وربنا معنا يعنا على الايام وعلى ظروفنا واحوالنا ويجعل فى بلدنا مساعدة الناس للناس واحساس القادر بالغير قادر لو حصل ده ياه وسبحان اللى بيسخر الانسان لاخوه الانسان سبحان الله .. انا يا استاذ محمود سيدة من الناس اللى محتاجة مساعدة ونفسى فى مبلغ اجهز بيه بناتى عشان افرح بيهم بنت مكتوب كتابها والثانية مخطوبه وابوهم عاجز على كرسى متحرك مريض وغيرهم ثلاث اولاد بيتعلموا اعداى وثانوية عامة وانا موظفة لا اقوى على مطالبهم والله المستعان .. وعلى فكرة مش اول مرة اكتب لك حالتنا يمكن ديه المرة 100 وللاسف لم احصل على اجابه ..لكن انا عذراك مشغولياتك كتير والله يقويك بس ارجوك تساعدنى اجهز بناتى ولو بمبلغ وانا اشترى لهم احتياجتهم اللازمة للزواج ولك الف الف الف شكر يا سيدى رقم المحمول لان ما عندى تليفون منزل رقمى 0129770526"
archived = "2010-03-14"
