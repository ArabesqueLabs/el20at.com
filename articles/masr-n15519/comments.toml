subject = "إعادة توزيع الثروة"
author = "أحمد"
posted = "2008-05-02"
text = "لما يوسف بطرس غالي حب يعيد توزيع الثروة بفرض ضرائب عقارية على العقارات الفاخرة والتي تزيد قيمتها عن 250000 جنيه، الناس صرخت وشتمته وشتمت الحكومة. المفروض يكون لدينا نظام تصاعدي للضرائب لتوفير موارد لرفع مرتبات الموظفين علشان نرجع تاني الطبقة المتوسطة."
