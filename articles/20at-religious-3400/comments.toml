[[comments]]
order = 18
subject = "في البؤس ارض الواقع"
author = "المتمرد"
posted = "2008-05-06"
text = "بسم الحقيقة ثانية اضيف على ما قاله الزميل قبلي كنعان<br />صفات ونعات مجردها لا يلمس ارض واقع ولا يعبر عن حقيقة ويكفي اننا نحج الى بيت الله (الكعبة) تحت نظر المدمرات الامريكية والحشودات من جنود هولاكو العصر ونقول نحن (الاصح) و (الحقيقة المطلقة)<br />الم يحن الوقت لنعترف بان هذه الغرفة جزء من الخرافة الي تعشعش في اذهاننا وان (الله) ينزل لهذه الصخرة التي لا اعرف هي مربعة ام مستطيلة ام مفلطحة ليرى اعمال عباده ويغفر لهم<br />اتذكر جيدا ان ابو ذر الغفاري (الصحابي الجليل) نفي من ارض الاسلام لانه قال (عجبا لمن لا يجد قوت يومه ولا يخرج على الناس شاهرا سيفه ) ولاجل الحق ينفيه المسلمون في زمن الرسول وزمن عمر وابو بكر اولم يكن صحابيا يا ابناء الاسلام الحنيف ؟؟؟<br />اليوم لا نجد سوى الذل والمهانة والكراهية والتكفير وفتاوى الجوع الجنسي وغيرها الكثير فقط ... لدى عرب اسلام دوت نص كم<br />اني كافر بهذا الواقع المقيت .. ملحد بكل تقليد ارعن اعمى لا يمثلني ولا ينقذني<br />اريد ان اسال سؤال : كل الثورين في العالم يقاتلون من اجل مبدا وقضية لا يهمهم المقابل والجزاء الا المسلمون يقاتلون من اجل نهر خمر و70 غانية او راقصة (الحور العين) و (الغلمان المخلدون) والبط المشوي وغيرها من المقبلات في جنة ولا مطاعم هولندا ؟؟؟؟<br />بماذا يختلف المسلم عن الفرعوني الذي كان يدفن اغراضة ومقتنياته الشخصية معه في القبر .. بلا تختلفون فالمسلم ياخذ فقط معه الكلام اما الفرعون بياخذ ذهبة معه في قبره لعله ينتفع به شخصا بعد 2000 عام !!<br />الم يحن وقت هذا الرب لكي ينهض من رماد الواقع وينظر الينا بعين العطف .. الا اني ملحد به ثم ملحد ثم ملحد حتى يرضى<br />حتى ينهض ويرفض ويحمل سيفة في الغبراء ويتظاهر معنا في السراء والضراء<br />عذرا ان قال احدكم بذيء الالفاض .. فالموقف اكثر بذاءة مما نحن فيه انه السخف المطلق بعينه"
