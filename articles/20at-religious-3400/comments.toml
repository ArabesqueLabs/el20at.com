text = "بسم الحقيقة وليس باسم اي شيء اخر باسم المنطق اخواني بغض النظر مسلمون او اي شيء اخر لا يهم التسمية ارايتم انكم لاتتقبلون الراي الاخر ولا تريدو حتى ان تفكرو لحظة تريدون ان تبقو عبيدا لافكار عفى عليها الزمن اي دين عزة هذا الذي تتحدثون عنه اي دين كرامة اي دين سماحة اي دين اين هذا الدين انا لا ارى هذه المصطلحات الا من افواهكم ولا اراها الا في الكتاب المقدس لا اراها على ارض الواقع .<br />في ما مضى كان هناك عزة وانتصارات وكرامة ستقولون لي الان كان هناك رجال اشداء ومؤمنين صادقين تمسكو بدينهم .<br />انتم شعب لا يقرا اقراوا جيدا ستعرفون انه في تلك الازمان كان الخطاب الجماهيري ديني ولكن داخل القصور واقصد القصور الخلافية على انواعها كان الحكم من الداخل علمانيا بحتا واقراوا جيدا سيرة الخلفاء ستعرفون الحقيقة الغائبة (الحقيقة الغائبة )هو كتاب من تاليف فرج فودة الذي قتله المسلمون فقط لانه قال الحقيقة الموثقة في كل صفحة وفي كل سطر لماذا ؟؟؟؟؟ اتركو الناس لكم دينكم ولي ديني امنو بما شئتم ودعونا نؤمن بما شئنا هذه هي قناعاتكم والعكس<br />انا اريد ان اسال كل شخص فيكم وليجاوب نفسه ماذا لو كنتم انتم المسلمون حاكمين للعالم وتمتلكون القوة كالغرب الان ماذا كنت فعلتم ؟؟؟؟؟؟<br />ارني السماحة يا سيد السماحة انت الذي تتكلم عن دين اليسر والسماحة جاوب نفسك<br />اين العزة والكرامة عند 2 مليار مسلم تنتهك الحرمات والاراضي وتحتل الارض ويقتل البشر قل لالهك ان يبعث لنا جنوده<br />يا اخواني اقول لكم شيئا واحدا عندما كان هناك قبيلة في سالف الازمان لا اريد ان ابالغ ولكن قبيلة محمد في الجزيرة العربية هل وصل عددهم الى ملين . انا لا اتوقع ذلك ,قام الاله بانزال المعجزات والانبياء ...... الخ انزل معجزته على بضع افراد السؤال<br />السنا بحاجة اليوم الى معجزة والى نبي السنا احوج اليوم الى هذه المعجزة ؟؟؟؟ بلى نحن احوج لها من الهل الجزيرة العربية في ذلك الزمن السحيق واحوج من قوم موسى وكل اقوام الانبياء<br />اصدقائي لستم اهل لاقناع الملحد صدقوني لانك لا تمتلكون الا بعض المصطلحات الفارغة(ما عاذ الله.استغفر الله .....الخ)ولا يوجد عندكم حجج الا قالو وسمعنا وحدثنا والامام الفلاني والحديث النبوي الفلاني كل هذه اقاويل واحاديث لا تغني ولا تسمن من جوع اذهبو اللى ربكم وقولو له الناس كفرت هكذا بكل بساطة لماذا كفرت طبعا الجواب معروف لانه لا يوجد عدالة اذا ابعث بمعجزاتك الجبارة وشق البحار والصخور كما كنت تفعل بالسابق لبضع افراد نحن اليوم مليارات الامم بحاجة الى معجزاتك لا نريدها بالكتب ولا بافلام الاكشن ولا القصص التراجيدية الموجودة بكتبك المقدسة .<br />وشكرا"
