text = "ان تفتت الأيمان وما يدور بين الأديان من صراع ذلك الصراع الذى لم يقف على حدود الأديان فقط بل امتدت يده الى داخل الدين الواحد ذاته اذ بدت الأنقسامات والصراعات بين المذاهب والطوائف المختلفه هو سبب قوة الشيطان وما نراه اليوم من عباد له بلا خجل او حياء بل اصبح اعترافهم بعبادته جهارا وفى وضح النهار لهو اكبر دليل على مدى ما سببه تفتت الأيمان من ثغرات يمر منها مثل هؤلاء ...فليتنا نجد اصحاب الرسالات وقد التفوا فى عناق وتآخى ليردوا مثل هؤلاء المبتدعين<br />أنه حلم....هل يتحقق ؟؟؟؟"
