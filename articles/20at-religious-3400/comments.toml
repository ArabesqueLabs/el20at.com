subject = "الاسلام ديني سابقا"
author = "فكره"
posted = "2007-03-18"
text = "صباح الخير منى<br />حسنا<br />أنا عضو بالمنتدى الذي يدور حوله مقالك . واسمحي لي أن أبدي بعض الملاحظات حول هشاشته ، واقصد بالطبع المقال<br />في البدء ليس صحيحا أن أعضاء المنتدى كانوا فقط مسلمين قبل الالحاد ، فهناك من كان مسيحي ، وهناك أيضا أعضاء دينيين ( مسلمين، مسيحيين )<br />بالتاكيد عندي الكثيير من الملاحظات على مقالك . ولكن خوفي أن يزهب وقتي أدراج الريح في حالة عدم السماخ بنشر مداخلتي ، وربما لو حدث العكس وتم نشر هذا الرد ، عندها سيكون لي مداخله للرد المفصل على المقال<br />تحياتي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "ضع عنوان التعليق"
author = "فكره"
posted = "2007-03-18"
text = "رائع حقا<br />فقد خاب ظني وتم النشر الذي يستوجب شكري لمساحة الحرية المتاحة بموقعكم<br />طيب<br />مقدمة مقالتك والتي تشبه الى حد كبير حلقات العلاج النفسي (الحكي ) غاية مشاركة المريض الاخرين للوصول للعقدة المرضية ( الخلل) واختزلك ايدولجية المنتدى في تلك الحلقة قد جانبه الصواب ، فهو ربما أحد الموضوعات من كثير الكثير الذي يطرح للنقاش بكل حرية واحترام تام للاخر اي كان حتى اني أجزم بانه المنتدى الوحيد الذي يعاقب اعضائه بالوقف او الشطب الكامل للعضوية حالة تجاوز قوانينه التي تنص على احترام الاخر ومعتقداته .<br />تفولين ( ويفرق أهل هذه الساحة بين كلمات نراها نحن واحدة، ويرون أن دورهم هو توعية الآخرين بها، حيث يفرقون بداية بين الإلحاد العقلاني الآتي نتيجة للتفكير، وبين الإلحاد البديهي أو الفطري الناتج عن عدم قدرة على استيعاب إحساس الإيمان ..<br />) بالطبع لم أفهم جيدا هذا الطرح فالملحد دينه عقله ، ام الملحد بالفطرة وبرغم غرابة المصطلح وتناقده في ذات الوقت يحتاج منك لكثير من تقسير<br />تقولين (لعل هذا الاختلاف يذكرنا بكلمة للأديب \"توفيق الحكيم\" ـ الذي عرف بتحرره الفكري واتهم بالإلحاد – عندما كان يحاور شخصا ملحدا حدثه كثيرا عن الدلائل التي تؤكد خدعة فكرة الإيمان وانعدام فكرة الخالق والمخلوق، وأن العالم خلق وفق نظرية الصدفة، وأن هناك طبيعة تتطور ولا يوجد الله يدبر ويتحكم، فرد عليه الحكيم سائلاً: هل تسمع أم كلثوم، قال :نعم .. سأله وحين تسمعها تقول الله الله أم الطبيعة الطبيعة! )<br />بالطبع تلك دعابة ان لم تكوني تقصيدين ، فعندما تطرب سمعنا ام كلثوم تفول الله الله بفعل العادة . لاننا لو اسلمنا بجدية توفيق الحكيم ، لكان على العجم عندما يطربهم صوت نانا سيمون ان يقولوا الله الله.<br />تقولين(وكما في كل دين إيمان قوى وآخر ضعيف، فهناك ملحد قوى وملحد ضعيف، مجرد الافتقار إلى الإيمان بالإله هو إشارة إلى \"الملحد الضعيف\"، بينما الإيمان بان الإله ليس موجودا أو لا يمكن لها أن يوجد فيعرف بالـ \"الإلحاد القوي\".)<br />هنا اقول لك الملحد ملحد لايجود هذا التصنيف المائع . الملحد هو من يؤمن بعدم وجود الأه . اما من يشك في وجود الأه فهو لاديني وليس كما شرحتي بعد انه الاادري<br />وناتي لنقطه غايه في الاهمية وهي العروية وقضية فلسطين<br />تقولي ( وبرغم هذا من المهم أن ننقل لكم وجهة نظرهم وتقول: \"هي قضية عادلة وضرورة أن يحصل الشعب الفلسطيني على دولته الفلسطينية على الأراضي المنصوص عليها في معاهدة (أوسلو)، ننادي بالمقاومة السلمية ولا تستعمل السلاح إلا بأمر من السلطة الفلسطينية المنتخبة، ونرفض العمليات الانتحارية ضد المواطنين المدنيين الإسرائيليين ومن حق إسرائيل أن توجد على الأراضي المنصوص عليها في معاهدة أوسلو ويجب عليها أن تنسحب من دون ذلك\". )<br />اقول لك وبما انك كتبتي مقالتك اة كما احسب نتجة تجولك بمواضيع المنتدى اقول<br />اول امس طرح اخد الاعضاء سؤال عن سبب كره المسيمين لليهود واواكد على كلمة المسلمين فما كان من الاعضاء الا وسارعوا بالمداخلات وكنت منهم واثبتنى نوايا العضو الصهيونبة ولم نغفل حتى تم طرد العضو نهائيا من المنتدى ، وتسطيعي ان ترجعي للمنتدى بالقسم المختص بالدبن الاسلامي لتتاكدي وفي نقس الوقت سارع احد الاعضاء بنشر موضوع مستقل بالوثائق<br />عن المجازر التي ارتكبها الكيان الصهيوني منذ الاحتلال وحتى الان<br />تحياتي"
archived = "2010-03-14"
