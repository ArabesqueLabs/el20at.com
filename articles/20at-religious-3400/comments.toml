subject = "فراغ عقلى"
author = "ابو اسامة"
posted = "2007-05-25"
text = "ان الملحد لو كان فعلا يعتمد على عقله لكان من الواصلين الى وجود الله فاءريد ان اساله سؤلا<br />يعمل فيه عقله الذى اشك فى وجوده ما الجسد بدون الروح هو تراب اذا فكيف لحقيقة مجسمة ان تحكمها شىء لا يرى<br />وانا عندما اؤمن باله لابد ان يجيب على اسئلة عقلى واولها اذا كان الله هو من خلقنى فمما خلقنى خلقنى من تراب<br />وهذه حقيقة مادية فالجسد بلا روح هو تراب رد ايها الملحد يا من تدعى العقل ثانيا لم يصل الكثير من امثالك الى حقيقة<br />الروح التى تتحكم فى كل المخلوقات ويرد القران ان الروح من امر الله فاذا كان من اخبرنى انه خلقنى من تراب وهى حقيقةكيف لا اصدقه فى امر الروح . وانظر الى قول اعرابية تعيش فى صحراء تسال عن كيف عرفت ربها فتقول البعرة تدل على البعير والصنعة تدل على الصانع عرفت ربها من خلال نظرها الى السماء فانظر الى السماء ايها الملحد وهناك الكثير<br />اذا كنت تريد ان تراسلنى لآنى اريد لك الخير اميل/os_mo_6"
