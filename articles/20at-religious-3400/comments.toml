[[comments]]
order = 2
subject = "رد الامام ابو حنيفة علي الملحدين"
author = "الجراح"
posted = "2007-03-12"
text = "السلام عليكم<br />قال الملحدون لأبي حنيفة : في أي سنة وجد ربك ؟<br />قال : (الله موجود قبل التاريخ والأزمنة لا أول لوجوده ...........<br />قال لهم : ماذا قبل الأربعة؟<br />قالوا : ثلاثة ..<br />قال لهم :ماذا قبل الثلاثة ؟<br />قالوا : إثنان ..<br />قال لهم : ماذا قبل الإثنين ؟<br />قالوا : واحد ..<br />قال لهم : وما قبل الواحد ؟<br />قالوا : لا شئ قبله ..<br />قال لهم : إذا كان الواحد الحسابي لا شئ قبله فكيف بالواحد الحقيقي وهو الله !إنه قديم لا أول لوجوده ........<br />قالوا : في أي جهة يتجه ربك ؟<br />قال : لو أحضرتم مصباحا في مكان مظلم إلى أي جهة يتجه النور ؟<br />قالوا : في كل مكان ..<br />قال : إذا كان هذا النور الصناعي فكيف بنور السماوات والأرض !؟<br />قالوا : عرّفنا شيئا عن ذات ربك ؟ أهي صلبة كالحديد أو سائلة كالماء ؟ أم غازية كالدخان والبخار؟<br />فقال : هل جلستم بجوار مريض مشرف على النزع الأخير ؟<br />قالوا : جلسنا ..<br />قال : هل كلمكم بعدما أسكته الموت ؟<br />قالوا : لا.<br />قال : هل كان قبل الموت يتكلم ويتحرك ؟<br />قالوا : نعم.<br />قال : ما الذي غيره ؟<br />قالوا : خروج روحه.<br />قال : أخرجت روحه ؟<br />قالوا : نعم.<br />قال : صفوا لي هذه الروح ، هل هي صلبة كالحديد أم سائلة كالماء ؟ أم غازية كالدخان والبخار ؟<br />قالوا : لا نعرف شيئا عنها !!<br />قال : إذا كانت الروح المخلوقة لا يمكنكم الوصول إلى كنهها فكيف تريدون مني أن اصف لكم الذات الإلهية ؟"
archived = "2010-03-14"
capture_url = ""

