author = "عبد الغني بوضرة"
posted = "2007-03-11"
text = "السلام عليكم، ولا إلاه إلا الله وحده لا شريك له، له الملك وله الحمد، وإلى الله عاقبة الأمو.<br />مثل هؤلاء لا يستحق أن يُكتب عنهم.<br />ويحملون فشلهم في أفكارهم وآراءهم.<br />يحكى أن أحد الأئمة كان له موعد مع مجموعة من القائلين بأن الكون خلق بالصدفة، فتعمد الحضور متأخرا.<br />وعندما وصل: قالوا له، أهكذا هو دينك، تخلف المواعيد؟!!!! فقال لهم اعذروني، فإنه في طريقي إليكم كان هناك وادي، ولم أستطع العبور، وطفقت أرمي أخشابا وألواحا في الماء، حتى استوت على شكل قارب صغير ثم قطعت الوادي وقطعت إليكم. قالوا له مستحيل، كيف تجمعت الأعواد والأخشاب على شكل قارب؟ قال لهم بالصدفة. قالوا له يستحيل. قال لهم: أنتم تنكرون شيئا صغيرا بالصدفة فكيف بالكون؟ وانتهت المناظرة معهم...."
