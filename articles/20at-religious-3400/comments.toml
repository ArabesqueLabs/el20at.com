text = "هناك أنواع من البشر يريدون ان يغيروا الكون ونظامه من أجل حضرته! فينكر ما يشاء ويؤمن بما يشاء! وهل المطلوب من حضرتنا يا حضرة الملحد أن نؤمن بما تؤمن به من أجل حضرتك؟ إن الإسلام ليس دينا اخترعه شخص لأنه دين غير متقلب ولو كان من صنع بشر لكان مائعا متقلبا كحضرات الملحدين فيوما مع دين ويوما بلا دين . وأقترح على الملحدين أن يصمتوا أو يعودوا لدينهم وإلا انقرضوا كما انقرض غيرهم. قال تعالى :\" وأما الزبد فيذهب جفاء\" اذهبوا إلى الجحيم يا زبد!"
