subject = "الحققققققققققققق"
author = "ماجد"
posted = "2008-07-23"
text = "-الفكر (الدارويني)، الذي أرجع الإنسان إلى أصول حيوانية مادية.<br />2-الاتجاه العقلاني، الذي ساد أوروبا حينذاك.<br />3-الفكر العلماني، الذي قام على الثورة ضد الكنيسة في البداية، ثمَّ أصبح ضدَّ كل المفاهيم الدينية.<br />4-اليهود الذين يحبون أن تشيع الفاحشة في المجتمعات؛ ليسهل لهم السيطرة عليها وقيادتها، وقد ساعدت (الفرويدية) كثيرًا في تمكينهم من ذلك.<br />Offline<br />-الفكر (الدارويني)، الذي أرجع الإنسان إلى أصول حيوانية مادية.<br />2-الاتجاه العقلاني، الذي ساد أوروبا حينذاك.<br />3-الفكر العلماني، الذي قام على الثورة ضد الكنيسة في البداية، ثمَّ أصبح ضدَّ كل المفاهيم الدينية.<br />4-اليهود الذين يحبون أن تشيع الفاحشة في المجتمعات؛ ليسهل لهم السيطرة عليها وقيادتها، وقد ساعدت (الفرويدية) كثيرًا في تمكينهم من ذلك."
