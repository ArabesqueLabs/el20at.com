[[comments]]
order = 8
subject = "تعليق على هآمش الذكرى"
author = "سلمان العنزي"
posted = "2008-09-27"
text = "السلام عليكم ورحمه الله وبركاته<br />انا قد أرى ان فرويد غير مصيب في كثير من الامور والقضايا التي طرقها<br />وخاصه الجنس حيث أعتبرها غايه البشر بل السعاده المطلقه لهم<br />طبعا انا لا اقصد شخصي بل من كوني مسلم ولدينا ثوابت ( عقيده ) مسلّمه عند كل مسلم<br />لكن هذا الرجل اعمل عقله وقلمه وفكره للوصول الى هدف واستطاع بل حقق من الاتجاز ماعجز غيره عن التفكير به<br />وخاصه اللاشعور وربط السلوك البشري بهذه المنطقه<br />اما كون هذا الرجل يهودي وانه عمل لاجل قوميته ودينه من باب انصاف الناس واحقاق الحق نحن قوم دائما ننظر للأخرين بعين الريبه وماضره انه يعمل لدينه او لقوميته ونحن ليلاً ونهارا نرفع شعارات القوميه على حساب الدين<br />او حتى من ينادي الى الامميه يفرض على الناس قوميتهم ونسبهم<br />على العموم ديننا أمرنا نأخذ الحكه من اي أحد كما في الحديث الحكمه ضاله المؤمن أنّ وجدها فهو أحق بها<br />وحتى التعاون مع الكفار على الخير والعلم وأعمار الارض كل ذالك امرنا به ديينا كما في حلف قريش معه بعض القبائل لنصرت المضلوم تمنى النبي صلى الله عليه وسلم ذالك ليت شعري لو أن بعض المتنطعين بعصره ماذا كان قالوا !! لا أدري لعلهم يقولون ضعوا جدار بينا وبينهم<br />هذا الرجل عالم وله تقديره ( لعلمه ) وانا والله ولا ازكي نفسي وغيري الكثير من المسلمين ولله الحمد ندرك الأخطاء العقديه التي تنافي ديننا لذا نأخذ مانريد ونترك الغث لمن يريده<br />أخيرا انصح كل أخواني ان يقرؤا كل شي على مبدء القائل<br />عرفت الشر لا للشر لكن لتوقيه ومن لا يعرف الشر من الناس يقع فيه"
archived = "2010-03-14"
capture_url = ""

