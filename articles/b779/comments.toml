subject = "فرويد لو كنت أنا في عهدك ....!!!"
author = "فارس"
posted = "2008-03-18"
text = "فرويد هذا العلم الذي طالما حلمت أن أدرس عنه الكثير حول طفولته كيف عاشها وما هي الأفكار التي كانت تدور في ذهنه وكذا ما هي منهجيته في الحياة كيف يرى وجوه الناس....؟؟ كل هذه الأسئلة التي تدور في ذهني هي من أجل الوصول إلى كيف وضع فرويد مراحل تكون الجهاز النفسي ..كيف ؟<br />أظن أن فرويد بحد ذاته يجب أن تحل نفسيته ولو عرفنا دوافع أطروحاته العلمية والعوامل التي كانت وراءها . فسنظمن الكثير من المفكرين النفسيين في هذا العصر"
