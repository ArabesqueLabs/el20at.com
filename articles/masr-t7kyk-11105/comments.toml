subject = "فكرتونا بايام زمان"
author = "مصرى مغترب خريج تجارة 98"
posted = "2009-01-28"
text = "الكلام صحيح وانا كنت واحد من الناس الى تشتغل فى بيع اوراق المحاضرات والدروس لطلبه تجارة مجموعه ج من سنه 94 حتى سنه 99 وكان شغلى مع نوبل يمكن كنت انا واصدقائى من اول الناس الى اشتغلت فى الموضوع ده وكسبنا منه كتير بس من الى قريته وفهمته ان القصه خربت وما صارت مثل زمان<br />هههههههههههههههه<br />فكرتونى بايام الكحرته<br />هههههههههه<br />شكرا ليكم على الموضوع وبعدين الداكاترة بترفع قضايا وتعمل مشاكل للمكتبات عشان بس بطلو يسكبو من بيع الكتب مش عشان انتظام التعليم انا كان عندى دكتور محاسبه اداريه وهو من الاسماء المعروفه جدا بالتجارة كان بيسال كام نسخه اتباعت من كتاب التطبيقات كانت ايام سكر شكرا تانى"
archived = "2010-03-14"
