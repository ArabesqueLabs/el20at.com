[[comments]]
order = 4
subject = "الفول والمؤرخ  هيرودوت"
author = "محروس"
posted = "2008-09-21"
text = "قال هيرودوت وقد زار مصر ايام الفراعنة<br />ولا يبذر المصريون الفول فى بلادهم اطلاقا ولا يذوقون ما قد ينبت منة فجا او مطبوخا اما الكهنة فلا يطيقون حتى رؤيتة ويعتقدون انة بقل نجس<br />اذن من اين جاء الفول وانتشر فى مصر<br />لا احد يدرى<br />لا احد يدرى<br />هل اليهود - فى القران الكريم قال تعالى<br />واذ قلتم يا موسى لن نصبر على طعام واحد فادع لنا ربك يخرج لنا مما تنبت الارض من بقلها وقثائها وفومها وعدسها وبصلها قال اتستبدلون الذى هو ادنى بالذى هو خير اهبطوا مصرا فان لكم ما سالتم<br />صدق اللة العظيم<br />ومعروف ان الفوم هو الفول فى الاية<br />ومعنى اهبطوا مصرا اى اهبطوا وادى من اودية سيناء او غزة اذ كان اليهود قد خرجوا من مصر مع موسى<br />ولا زال موضوع الفول محيرا"
archived = "2010-03-14"
