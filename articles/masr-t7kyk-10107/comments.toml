[[comments]]
order = 2
subject = "انواع الفول"
author = "رضة لا ولا"
posted = "2008-09-21"
text = "اشهرها الفول المدمس ويأكل بالزيت العادى - والزيت الحار ( زيت السمسم) - والزبدة - والسمن البلدى وقد يخلط بالطماطم والصلصة وبعضهم يطهى الفول مع البيض المفقش وبعضهم بيحط على الفول طحينة وشطة وليمون وتوم وخلطات ما انزل اللة بها من سلطان<br />النوع التانى الفول النابت وشوربة الفول النابت وفتة الفول النابت والفول النابت بالصلصة وطبيخ الفول النابت<br />النوع التالت - الفول بيدخل فى صناعة الطعمية<br />وقد طورت بعض الشركات الفول فطحنتة وجعلتة مثل البودرة ويطهى بطريقة سهلة جدا ولا يحتاج لغلى فترات طويلة<br />هذا قليل من كثير"
archived = "2010-03-14"
