[[comments]]
order = 6
subject = "علب فول شركة قها"
author = "شاكر"
posted = "2008-09-23"
text = "المصريون الذين ذهبوا الى دول الخليج فى السبعينات كان يستمتعون بعلب الفول بتاع شركة قها وكذلك عصائر شركة قها<br />وكان يقطعون مسافات طويلة جدا للحصول على علب الفول قها<br />وبعد بيع شركة قها مع حركة الاصلاح الاقتصادى وعدم لزوم شركة قها فى الانتاج المحلى المصرى - رفعت راية الفول شركة فى دبى تصنع الفول الملعب بحيث يصنعون علب فول بالنكهة المصرية وفول بالنكهة السورية وفول بالنكهة السودانية وعلب فول مقشور وعلب فول بالصلصة<br />اما مصر بلد الفول فقد اغلقت شركة قها وشركة ادفينا بالضبة والمفتاح - وسلم لى على بلاد الفول"
archived = "2010-03-14"
