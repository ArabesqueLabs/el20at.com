[[comments]]
order = 0
subject = "ذكرياتى مع الفول وانا صغير وذكرياتى معة وانا كبير"
author = "فلاح مصرى"
posted = "2008-09-20"
text = "زمان مش قوى كنا فى الريف نزرع الفول بمساحات صغيرة بهدف رئيسى هو علف الحمار وبالذات فى الصيف<br />وكانت معظم الحمير تموت بعدوى غير معروفة فى شهر مسرى ايام فيضان النيل وكان علف الحمير بالتبن مع الفول يقويها ويجعل صحتها زى البمب والحمار يقعد ينهق طوال النهار ومزاجة عال العال<br />وكنا كبشر نأكل الفول فقط يوم الخبيز وتشغيل الفرن يعنى مرة كل اسبوعين او تلاتة ولم نعرف اكلة بالزيت ابدا اذ كنا نهرس الفول بالقشطة او الذبدة ويكون لذيذا جدا<br />ثم اتى على الانسان حينا من الدهر اصبحنا شيئا غير مذكورا<br />نسيت ان اقول ان الفول لة تاريخ فرعونى قديم وحيث ان الفلاح المصرى القديم كان يعانى الامرين من تسوس الفول اذا ترك مخزونا فترة طويلة حتى اهتدى الى طريقة تمنع تسوس الفول واخترع حاجة اسمها الفول المكمور - او بالعربية الفصحى الفول المطمور - كان تجار الحبوب يحضرون محصول الفول من جميع انحاء وادى النيل الى مكان فى محافظة المنوفية فى شهور معينة ويحفرون حفرا عميقة ويضعون الفول فى اجولة او مخازن صغيرة ثم يطمرونة او يدفنونة تحت الارض ويهيلون علية التراب كانة ميت - ثم بعد مدة من الزمن يستخرجونة من باطن الارض ولو ظل 10 سنين لا يسوس ابدا ولا تخترقة حشرة السوس ويكون طهية اسرع وطعمة حلو جدا<br />لماذا يطمر فى ارض تلك المنطقة بالذات ولماذا لا يسوس بعد الطمر لا احد من الفراعنة اخبرنا ولا احد منا درس اسباب ذلك<br />على العموم الفول المطمور انتهى ولم يعد لة وجود ولا احد من الجيل الحالى يسمع عن ذلك<br />الان فى القرى وفى الاحياء الشعبية فى المدن اصبح الفول يؤكل يوميا وبالزيت ولم يعد الحمار يرى حباية فول واحدة<br />وهناك فى القرى دكاكين لبيع الفول والطعمية صباحا ومساءا ومن الغريب ان الفلاح توقف عن زراعة الفول واصبحنا نستورد الفول من كندا وتركيا وسورريا<br />لماذا لم نعد ننتج الفول والعدس والقمح ؟ اسألوا بتوع تحرير الزراعة وتحرير الاقتصاد"
archived = "2010-03-14"
