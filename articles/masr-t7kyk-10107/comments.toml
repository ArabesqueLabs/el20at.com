[[comments]]
order = 3
subject = "الفول ومراته الطعمية"
author = "مش واكل"
posted = "2008-09-21"
text = "الطعميه .<br />المقادير:<br />4 كوب حمص منقوع – حزمة بقدونس – 2 بصلة كبيرة الحجم – حزمة بصل أخضر – راس ثوم – 1 فلفل أخضر- 2/1 كوب كزبرة خضراء مفرومة – 3 ملاعق كبيرة من الكزبرة الجافة – 3 ملاعق كبيرة كمون – 2 ملعقة صغيرة ملح -2 ملعقة كبيرة سمسم – 2 ملعقة صغيرة بيكنج باودر أو بيكربونات الصودا- زيت نباتي للقلي.<br />الطريقة:<br />1- يفرم الحمص المنقوع بالخلاط أو ( مفرمة اللحم ) .<br />2- يفرم في نفس الوقت البقدونس والكزبرة الخضراء المفرومة والبصل الأخضر والبصل والثوم والفلفل بالتناوب.<br />3- تخلط جميع المكونات جيدا ويضاف إليها الملح والكمون والكزبرة الجافة .<br />4- تضاف البيكنج باودر أو البيكربونات الصودا والسمسم إلى خليط الفلافل عند بداية القلي .<br />5-يقلى الفلافل في الزيت الساخن باستخدام القالب الخاص أو تكور باليد حتى تحمر من الوجهين.<br />6- تؤكل سندويتشات الفلافل ساخنة مع سلطة الطحينة أو الخضراء والمخللات والفلفل الأحمر الحار.<br />وبالعافيه........"
