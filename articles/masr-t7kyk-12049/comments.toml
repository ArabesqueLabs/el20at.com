author = "ابو عمار"
posted = "2009-05-17"
text = ":sad: :cry: :-x :P :roll:<br />كان صديقى السودانى فى البلد الصغير النائى فى احد دول الخليج متضايق جدا<br />قال فى ضيق واضح ام العيال حامل والمستشفى القريب من السكن فية دكتورة ولادة هندية<br />قلت لة الدكتورة الهندية ممتازة جدا فى التوليد وعندهم خبرة رائعة فى ولادة الحريم تشهد بها المحافل الدولية لكثرة الولادات عندهم<br />رد عليا غاضبا -- لا بد من وجود دكتورة سودانية مهما كلف الموضوع<br />وعند الولادة حملها فى سيارة الى مستشفى فى مدينة تبعد 300 كيلومتر عن البلد التى نقيم فيها<br />وفهمت ان هناك طقوسا تجرى للمرأة السودانية بعد عملية الوضع تقوم بها الطبيبة اذ تقوم الطبيبة بخياطة الرحم وجعلة ضيق كانها بنت بنوت مما يسبب المتعة الشديدة لزوجها عند المعاشرة الزوجية<br />المهم فى الصينيات ضيق الرحم يكون مثيرا ويجعل شهوة الرجل قوية جدا والاستمتاع بها يكون ممتازا<br />اسألونى فانا بامور النساء عليم<br />لماذا لا نتوقف عن ختان الاناث وندعوا الى خياطة النساء بعد الوضع كما يفعل الاخوة السودانيون الاشاوس<br />لماذا لا نطالب بحقنا نحن الرجال ؟<br />مهندس انشاءات ---- عادل ابو عمار"
archived = "2009-05-24"
capture_url = "https://web.archive.org/web/20090524041929/http://www.20at.com:80/t7kyk/12049-2009-05-12-11-26-53.html"

