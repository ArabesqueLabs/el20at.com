text = "انا شايف ان بدل ما نروج للزواج من صينيات نحاول عن طريق علماء الين والمشايخ فى المسجد فى خطب الجمعه مثلا ارشاد الناس فى التيسير وعدم الانفاق فى عمليات الزواج حتى لايتم ارهاق الشباب والتفكير فى البعد عن الزواج او الزواج باخرى غير مصريه ولو ان كل اب لبنت فى عمر الزواج اتقدم لبنته شاب وشاف فيه الجديه والرجوله والاخلاق الكريمه يحاول يساعده وما يتعسفش معاه فى امور او متطلبات الزواج لان كل شاب بيكون لسه على باب الله واكيد فى يوم من الايام ربنا هايكرمه و بعدين ده هايعطيه بنته اللى هى اغلى عنده من الدنيا,,,,,, اظن السعاده مش فى العريس الغنى اكيد فى اللى ها يلاقى فيه الخلق الحسنه والاصل الطيب وبالتالى هايطمن على بنته وهى معاه"
