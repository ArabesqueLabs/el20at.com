order = 1
subject = "الله اعلم"
author = "نيفين نيفى نوفا"
posted = "2007-07-09"
text = "اتفق مع الاستاذ صلاح عيسى فى عدم الافتاء فى امر لا اعرفه<br />و كويس و الله ان لسه فيه حد ف البلد بيقول معرفش و مبيفتيش<br />بس انا شايفه فعلا ان من التسطيح اخذ الامر على انه تصفيه حسابات بمنطق واحده بواحده<br />و ف المجال ده بيبقى من الصعب الوصول لليقين المطلق و حتى بعد مرور الزمن و كشف الحقيقه مبتنتشرش الحقيقه دى على نطاق واسه او مبتكونش بشكل مؤكد و مسلم بيه<br />الله اعلم"
