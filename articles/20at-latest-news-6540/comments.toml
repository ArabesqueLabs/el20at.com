text = "سلام عليكم<br />تجربة فرفور دى تجربة مش اول مرة تتعمل<br />ما هى اتعملت فى امريكا قبل كده كتير ، بيعلموا الاطفال ان المسلمين دول ارهابيين و ان نبيهم علمهم القتل و الدمار<br />و اول ما يطلع حد من المسلمين يعلم الولاد قضيتهم و الواجب عليهم<br />تطلعوا فيه<br />لازم تعرفوا الصراع<br />لازم<br />www.ademelmahdy.blogspot.com"
