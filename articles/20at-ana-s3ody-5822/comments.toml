subject = "غريب جدا"
author = "علي بن حاجب"
posted = "2007-05-14"
text = "قد لا أستغر ب أن أجد مثل الريس شمعة دكتورا محاضرا في جامعة أمريكية أو بريطانية ، لكن أن يوجد مثل الريس شمعة وهو أمي يحاضر في جامعة سعودية .. هذا والله هو الأمر الغريب حقا<br />وشكرا لك استاذ أحمد على هذه المعلومة الجديدة بالنسبة .. يعني في أمل إننا نكون يوما ما دكاترة في السعودية ونحن من غير أهلها أتمنى ذلك"
archived = "2010-03-14"
