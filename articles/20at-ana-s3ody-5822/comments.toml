subject = "الصورة فين؟"
author = "صفية"
posted = "2007-05-14"
text = "لقطة صحفية ممتازة ، لكن الصورة فين ، وجنسية الأستاذ شمعة ماهي ، أشعر بالفضول لأتعرف على الرجل أكثر ، هل يمكن تصوير بالفيديو لإحدى محاضراته ؟ سطورك يا أستاذ أحمد أشعرتنا بالرغبة في أن نعرف أكثر عن الرجل"
