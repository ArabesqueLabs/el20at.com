[[comments]]
order = 0
subject = "انتم فاكرين بيانات احمد سعيد فى هزيمة 1967"
author = "احمد سعيد"
text = "هى نفس فكر الحكومة<br />كأن مفيش انترنت ولا تليفون بكاميرا واى عيل يقدر يصور الشارع وينقلة على الانترنت فى لحظة<br />هتقول اية<br />حكومة من القرون السابقة<br />من عصر المماليك<br />او بتخاطب شعب معتوة<br />قصدى رئيس تحرير معتوة ومتخلف عقليا<br />علشان كدة مصر هتتقدم بنا<br />يا اخى احة - احة"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132032/http://masr.20at.com:80/newArticle.php?sid=15060"

[[comments]]
order = 1
subject = "كفاية نفاق وكذب مش هتاغدوا حاجة معاكو"
author = "احمد"
text = "ده النفاق والكذب بعينه ولسه فيهم الكذب والخيانة لليهود<br />مش عارف الحكومة بتعمل ليه كدة<br />سرقة وسرقت ونهب ونهبت وشبع لسه مشبعتش والخونة لسه بيسعدوهم<br />حسبنا الله ونعم الوكيل"
archived = "2008-04-10"
capture_url = "https://web.archive.org/web/20080410132032/http://masr.20at.com:80/newArticle.php?sid=15060"
