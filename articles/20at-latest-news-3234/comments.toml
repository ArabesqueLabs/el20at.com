posted = "2007-04-11"
text = "ياريت تعلمونا كيف ؟؟!!! عباقرة في صناعة الخبث ... عباقرة في صناعة الدمار... عباقرة في صناعة الرذيلة ... عباقرة في تدمير الاخلاق... عباقرة في افساد العالم... وقال الله : الم اقل لكم يا بني ادم الا تتبعوا خطوات الشيطان انه لكم عدو مبين وان اعبدوني هذا صراط مستقيم ولقد اضل منهم جبلا كثيرا افلم تكونوا تعقلون هذه جهنم التي كنت توعدون اصلوها اليوم بما كنتم تكفرون ))) ........ ظهر الفساد في البر و البحر بما كسبت ايدي الناس ليذيقهم بعض الذي كسبوا ...!!<br />فاللهم سلم ... سلم ... و احمنا من فتن الدنيا والاخرة"
