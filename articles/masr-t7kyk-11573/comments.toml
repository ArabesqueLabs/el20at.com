subject = "شركة رينا صاحبة العبارة الاصلية باعتها لممدوح اسما"
author = "سحس"
posted = "2009-03-15"
text = "فية محامى ايطالى هيرفع قضية على شركة رينا لانها شاركت ممدوح اسماعيل فى تقديم اوراق مزيفة<br />والعملية كلها فساد واهمال<br />والمئولين فى ميناء سفاجة بتوع النجدة والانقاذ مطلوب محاكمتهم ايضا<br />1330 مصرى غرقوا فى البحر<br />بينما كل الشهداء سواء مدنيين او عسكريين فى العدوان الثلاثى على مصر سنة 1956 كان 950 شهيد بس"
