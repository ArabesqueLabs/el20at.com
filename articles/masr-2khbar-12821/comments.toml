author = "كنت فى ماليزيا"
posted = "2009-08-03"
text = "الحجاب اللى بنشوفة فى الشارع المصرى وبيلبسة كل الناس المحترمين موجود نفسة فى شوارع ماليزيا واندونيسيا والباكستان والخليج والمغرب العربى<br />انتشر كزى اسلامى حديث فى جميع الدول الاسلامية ولا علاقة لة بالسياسة ولا باى شىء اخر<br />وكاتب الجريدة اما نصرانى موتور او حاقد ولكنة الواقع الدينى وليس لة اى علاقة بالسياسة"
