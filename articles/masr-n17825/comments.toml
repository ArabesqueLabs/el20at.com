[[comments]]
order = 0
subject = "اغلاق باب المندب وعمل سد هناك - من كتاب احلام المهندسين"
author = "صلاح"
text = "تخيل اننا عملنا سد فى مدخل البحر الاحمر عند باب المندب<br />واصبح البحر الاحمر بحيرة داخلية بعد سد قناة السويس من الشمال<br />وتركت المياة فى البحيرة المغلقة لتتبخر بدرجة حرارة الطقس<br />الدراسات تقول انة بعد 6 شهور سيكون هناك فرق فى مناسيب المياة اكثر من 30 متر<br />ويمكن تشغيل توربينات مائية تولد كهرباء تكفى مصر والسعودية واليمن والسودان وبالمجان<br />هكذا قرات فى كتاب احلام المهندسين<br />مجرد احلام<br />ولكن كان من بين الاحلام فى الكتاب عمل نفق بين فرنسا وانجلترا تحت بحر المانش وتسير فى النفق قطارات وسيارات واظن ان هذا الحلم تحقق<br />ولكن فى منطقتنا الاحلام لا تتحقق ابدا"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042832/http://masr.20at.com:80/newArticle.php?sid=17825"

[[comments]]
order = 1
subject = "(عقول حمير و أحلام عصافير)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "منتهى التغابى؟!!!<br />لا تنسوا مصالح الدول الكبرى<br />انهم لا و لن يسكتوا<br />و منذ متى للاسف الشديد العرب اتفقوا على شيئ؟<br />لا تصدقوا اصحاب<br />(عقول الحمير و احلام العصافير)"
archived = "2008-10-12"
capture_url = "https://web.archive.org/web/20081012042832/http://masr.20at.com:80/newArticle.php?sid=17825"
