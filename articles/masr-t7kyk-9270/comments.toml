text = "الأستاذ خباب شكرا على هذا التقرير الموجز والشامل للمشكلة التى تؤرق كل أسرة مصرية ، وعلى الرغم من عودة التوزيع إلى 15 رغيف لكل أسرة إلا أنهم بدوأ يقومون بعمل مقدمات لعودة التوزيع إلى 10 أرغفة ربما يكون من الغد أو بعد غد نتيجة عدم زيادة حصة الدقيق نرجو المتابعة لتلك القضية الحساسة التى ربما تفجر الوضع مرة أخرى ولكم جزيل الشكر ."
