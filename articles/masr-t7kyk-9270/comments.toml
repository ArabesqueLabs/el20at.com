[[comments]]
order = 6
subject = "الله يرحم محلاها عيشة الفلاحة"
author = "فلاح فصيحاسمه محمد"
posted = "2008-06-08"
text = "الله يرحم (محلاها عيشة الفلاحة)<br />كان زمان بس .. مش زمان قوي .. كنا نسمع محلاها عيشة الفلاحة ننبسط أحنا الفلاحين لأن عيشة الفلاحة كانت فعلا عيشة هنية ’ لأن الفلاحة كانت تعتمد على نفسها , وكان كل أكلها من الغيظ والزريبة - أعزكم الله - بمعنى اللبن من الجاموسة والبيض من عشة الفراخ والخضار من شط الغيط والقمح من غيطنا<br />وعيب أكبر عيب لوحد اشترى عيش من البندر إلا يوم السوق يكون عيش وطعمية لترضية الصغار, وتكون فضيحة ( هو إحنا هنعمل زى علية فلان اللي بياكلوا من الطبونة ) ولم يكن الأمر عند هذا الحد بل : فائض اللبن والبض على شوية بامية وملوخية ناشفة ولا شوية باذنجان وفلفل وتروح تبيعهم في السوق و تتسوق مصروف الأسبوع ويشتروا الشاي والسكر والكاز وخلافة ..... من الحاجات اللي مش بينجها الغيط ولا الزريبة والعشة ...<br />وشوية شوية تسرب للقرية بعض أنواع الرفاهية وبدأنا بدل ما ندبح ظفر: بط ووز وفراخ وحمام ... أصبحت الفرخة البيض وعليها البضة هي الظفر كله .. وبدل البيض البلدي بيض مزارع ْ.. وبدل العيش المرحرح والملدن عيش طابونة , وشوية شوية تركنا الزراعة لأن نتاجها غير مجدي والحكومة بتبخسه وتاخذ الغالي من برة وتترك زراعة ولادنا وبدل ما نشجع زراعة القمح والرز والقطن والذرة شجعنا الكانتلوب والفراولة و....الخ .. حتى تحول الفلاح إلى عاطل وبيعت الأرض مباني ولا تجريف وكل واحد ضور له على وظيفه هايفه -وهي أضيق أبواب الرزق - حتى صار حالنا زي مانت شايف فمتي نعود إلى أصلنا ونعز أنفسنا وكرامتنا ونرفض المهانة نقدر نقول لأ..لأ وألف ألف لأ.. لكن طول ما أحنا مربوطين من بطننا وأختصرنا قضايانا كلها في لقمة عيش وشوية ميه ملوثة سنظل أبد الدهر بين الحفر وعجبي عليك ياشعب مصر ياللي مايقهرك حد لكنك قهرت نفسك بالرضى بالدون فمتى تعودون لمحلاها عيشة الفلاحة ونترك ذل الطوابير"
archived = "2010-03-14"
capture_url = ""
