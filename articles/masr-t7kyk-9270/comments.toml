subject = "جزاك الله خيرا  يا حاكم الامارات ونرجو ان يصل القم"
author = "مش ضروري"
posted = "2008-06-06"
text = "خليفة يقدّم مليون طن قمح هدية إلى الشعب المصري<br />الشيخ خليفة بن زايد<br />أبوظبي : أمر الرئيس الإماراتى الشيخ خليفة بن زايد آل نهيان أمس الجمعة ، بشراء مليون طن من القمح ، وتقديمه هدية منه للشعب المصري الشقيق.<br />ووفقا لما ورد بجريدة \" البيان \" الإماراتية ، تأتي هذه الهدية مساهمة منه ، في تخفيف الاعباء المعيشية عن الشعب المصري الشقيق ، الناتجة عن ارتفاع أسعار القمح في الاسواق العالمية."
