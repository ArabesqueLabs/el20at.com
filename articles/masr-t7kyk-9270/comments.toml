[[comments]]
order = 5
subject = "الطوابير مؤامرة"
author = "ياسين أبو محمد الشرقاوي"
posted = "2008-06-08"
text = "موضوع كويس جدا والاحساس بمعاناة الناس والبحث عن حقوقهم مهم جدا ويكمله دفع الناس لرفض الظلم والهوان فقضية تجويع الشعب ةتدويخه هي مؤامرة كبيرة ليست لتجويع الشعب وإنما لتركيع الشعب وطالما ظل الشعب يتوه فيتوه ولا يفيق لنفسه سيظل هكذا إلا أن يحدث تغير في ثقافة الشعب وتربيته للخروج من الخنوع والرضى بالقهر إلى ثقافة وتربية البحث عن الحق والتضحية من أجله ولا بد أن ننسى أنفسنا ونضحي بقوة من أجل الأجيال القادمة وحتى لا نورث الذل لأبنائنا بالرضى بتوريث البلاد لأبناء طغاتها<br />أفيقوا يا شعب ولا تخنعوا وثقوا بتأييد الله لكم إذا تحركتم (( إن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم )) فبداية الخيط في أيديكم وليس في يد غيركم فلا تسلموا بظلم وتتقاعسوا"
archived = "2010-03-14"
