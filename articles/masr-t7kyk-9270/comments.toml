order = 0
subject = "هل انحسرت احلام المصريين فى طابور العيش ؟  ام هل ت"
author = "متفائل جدا جدا"
posted = "2008-06-06"
text = "فى ظل موجة الغلاء العالمية - والتى ضربت شعوب العالم الفقير والغنى فى جميع قارات العالم<br />ومع ذلك لم نلاحظ<br />طوابير للخبز فى الهند<br />ولا طوابير للخبز فى غزة والضفة<br />ولا طوابير للخبز فى الصين صاحبة المليار نسمة<br />ولا طوابير الخبز فى جواتيمالا<br />ولا طوابير للخبز فى الصومال<br />ولا فى الحبشة ولا جنوب السودان<br />يبقى لية الخيبة الكبيرة دى عندنا بس<br />هل هى سياسة مقصودة ومرتبة ؟ ام الدولة فقدت السيطرة على طاقمها الادارى<br />طيب سيادة رئيس الدولة كلف الجيش والشرطة بحل المشكلة فى 6 اسابيع ومرت 6 شهور ولا حل<br />عباقرة الحزب قالوا فصل الانتاج عن التوزيع وعملوا اجتماعات للسادة اللواءات المحافظين - ولا حل<br />طيب اية الحل<br />الحل بسيط<br />نرهن الهرم لاسرائيل او نبيع اسهم قناة السويس لبريطانيا وفرنسا وياخدوها تانى ونشترى دقيق للمخابز العطلانة ونغرق الدولة دقيق<br />والا نؤجر حكومة من برة - زى مدربين الكرة - نعمل معاها عقد علشان تدير حياة الناس<br />الحقيقة انا متفائل جدا جدا<br />وبا احلم<br />ان بكرة<br />الدنيا تمطر ارغفة خبز على الشعب الفقير"
archived = "2010-03-14"
capture_url = ""

