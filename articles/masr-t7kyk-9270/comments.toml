subject = "President says food security serious economic cris"
author = "msh href wla braa"
posted = "2008-06-07"
text = "President Mubarak reaffirmed, in his address at the opening session of the Food and Agriculture Organization (FAO) conference on the world food security and challenges of the climate changes and bio-energy on 3/6/2008 that this conference is being held at a time the world undergoes difficult times and faces a serious economic crisis.<br />Mubarak said that the food security issue is the most serious crisis with its repercussions and impacts on the developing countries\\\\\\' efforts for achieving the millennium goals of development.<br />\\\\\\\"We have to remember that achieving food security was the top of the targets which we have planned since eight years ago,\\\\\\\" he said.<br />President Mubarak referred to the variety of visions on the causes of the current crisis and the means for surmounting them, and the conviction that we face world phenomena that requires a world move for encountering and containing its repercussions"
archived = "2010-03-14"
capture_url = ""

