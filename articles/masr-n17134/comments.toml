subject = "يجب و ضع صور المتوفين بالسرطان نتيجة التدخين على"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-22"
text = "شعب عجيب حقا يدعى انة محبط بسبب المشاكل الاقتصادية و قلة المال اللازم لة للمعيشة فى حين انة يشرب السجائر المستوردة و ----------------------------وخلافة ألخ؟<br />و حيث انة للاسف شعب لا يميز الصالح من الطالح فيجب على الدولة حفاظا على الصالح العام و الصحة العامة ان ترفع سعر السجائر الى اعلى ما تستطيع ؟<br />حفاظا على صحة النشئى و الذى هو عماد و امن الوطن<br />و لماذا لا تجرم السجائر و تعامل معاملة المخدرات لكل من يدخن السجائر و سنة القانونى اقل من 21 سنة؟"
archived = "2008-08-22"
capture_url = "https://web.archive.org/web/20080822112051/http://masr.20at.com:80/newArticle.php?sid=17134"

