[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-04-23"
text = "السلام عليكم<br />هدا الرجل يقول بملء فمه و أمام الجميع بأنه إنسان عادي و ليس من الأشراف و لا المشعودون ولا الدجالين و إنما أعطاه الله هده الكرامة ليمنحها لكل من يقصده أما المتشككين من الناس فهم ليسوا مجبرين على زيارته ثم إني أرى أن طريقته في الشفاء هده ليس فيها أي شرك فهو يقوم بالسلام على زواره و يدعو لهم بالشفاء من عند الله و يمرر يعد دلك يديه على قنينات الماء الصالح للشرب دون حتى فتحها وما ارى في هدا من ضرر / وأنا شخصيا زرته مرارا برفقة إحدى بنات عائلتي تعاني من مرض خطير في الرأس سبق لها ان اجرت حوله عملية جراحية مند 3 سنوات غير أن نفس الألم عاودها و كان من المقرر أن تجري عملية ثانية في الشهر الماضي إلا أن زيارتها للمكي الترابي لعدة مرات و اتباعها لتعليماته جنبها دلك حيث أجرت تحاليل مخبرية و قامت بإطلاع الطبيب المتابع لحالتها في المستشفى فتفاجأ بكون دلك الورم قد تلاشى تقريبا و أعطاها مهلة أخرى لثلاث أشهر لمعاودة التحاليل دون أن تخبره بزيارتها للمكي الترابي ،ثم إنني بحكم موافقتي لها لعدة مرات وقفت على حالات كثيرة شفيت من مرضها و دائما بإدن الله كما يقول المكي دائما فما عليكم إلا يزيارة هدا الرجل فقط لترو بأم اعينكم فليس من رأى كمن سمع"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-06-15"
text = "لا يجب أن نحكم على الشخص من خلال الرؤيئة فقط فما أدراكم بالسمع .<br />إن ما تقوله الصحافة ليس له أساس من الصحة و ليس له صحة من الواقع فمن خلال زيارتي لهذا الإنسان بغض النظر عن ما أشكوا به فهو لا يشفي الناس بيده التي يصافح بها آلاف الناس و إنما يتعهد بالله عز وجل أن يشفيك بقدرته سبحانه و تعالى و لهذا ليس علينا أن نقف ضد مصلحتنا أو مصلحة غيرنا من إخواننا بل و يحق لنا أن نعرف كيف يقوم هذا الإنسان الذي مثلنا كمثله أن يشفي الله عباده عن طريق هذا الإنسان . و أنا لا أعني بقولي هذا أنني أعطي هذا الشخص من القيمة أكثر من الملزوم و لكن أعطي لكل ذي حق حقه .<br />فقط أردت أن أشارككم آرائكم حول ما يتناوله الشارع المغربي خاصة و العالمي عامة . والصلاة و السلام على أشرف المرسلين و السلام عليكم و رحمة الله تعالى و بركاته."
archived = "2010-03-14"
