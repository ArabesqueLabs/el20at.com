subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-02-13"
text = "السلام عليكم ليس هدا الموضوع جديد او مدهش ففي المغرب ككل الدول المتخلفة العربية على الخصوص لا يخلو اي تجمع سكاني من مشعودين ودجالين وكدلك الاضرحة وعيون الماء...واليكم هده الحكاية المضحكة المبكية فقد استفاق الناس دات صباح ليجدو عين ماء تنبع بالقرب من مساكنهم فشاع الخبر بانها تشفي من عدة امراض وشرب منها من شرب وقصدها المرضى...لكن بعد التحقيق تبين ان مصدرها احد انابيب الصرف الصحي..ولكل يوم حكاياته .والسبب ليس الجهل والامية لكن ضعف الايمان والثقة بالنفس"
archived = "2010-03-14"
