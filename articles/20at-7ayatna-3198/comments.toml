subject = "تعليق ورد"
author = "ملاحظ"
posted = "2007-02-07"
text = "السلام عليكم، الموضوع جيد ومثير حقا، بارك الله في قلم الاستاذ عبد الله التفروتي، اما رأيي في الموضوع فأقول: الرجل المعني بالأمر هو مجرد مشعوذ ودجال، نحن سمعنا به كثيرا، انمه لا يستعمل القرآن في العلاج على المرضى بالصرع بل هو لا يحفظه أصلا، ويستعمل ربما تقنية الايحاء رغم انه غير متعلم كثيرا، وانما يستغل موهبته تلك في العلاج وللاسف الناس يصدقون ويعلقون امالهم على ذلك الرجل ويحجون اليه فرادى وجماعات وهذا امر خطير على عقيدة المسلم، فالشفاء بيد الله لا بيد المكي الدجال"
archived = "2010-03-14"
capture_url = ""

