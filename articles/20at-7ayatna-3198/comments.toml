[[comments]]
order = 3
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-03-29"
text = "اريد ان اقول شيءا قبل ان اكتب تعليقي اولا لا احد يستيطع ان يحس بمعاناة المريض الا الله و المريض نفسه و اي شيء طلب منه سيقوم به و يجرب كل شيء ربما ينزل الشفاء من عند لله سبحانه. فطبعا الله هو الشافي و الانسان يكون سبب الشفاء. بخصوص الشريف المكي فانا شخصيا لا اقول عنه مشعودا و لا دجالا و لا معجزة و انما كرامة و بركة انزلت من عند لله على هدا الشخص لشفاء المرضى. اكيد هذا شيء صعب تصديقه و لكن هذه هي الحقيقة لان رايت بام عيني اناس مرضى بسرطان و داء السكري و امراض اخرى مزمنة و تعافو باذن الله تعالى و لو يعودو يعانون من اي الم و اي مرض. حيث ان مريض السكري توقف عن استعمال الانسولين و مريض السرطان لم يعد ياخد اي دواء و لا يعاني من اي الم. لا نستطيع ان نقول هذه معجزة لان المعجزة للانبياء و الرسل فقط عليهم السلام و لكن هذه كرامة كما سبق ان ذكرت. احب من احب و كره من كره.و طبعا من لم يرى اناس مرضى و تعافو على يد على الشخص فاكيد لن يصدق. فليس فقط الناس الجاهلون او الاميون الذين يطرقون باب هذا الانسان و لكن كل شرائح المجتمع بل حتى من جميع انحاء العالم و لو لم يكن يعالج باذن الله لما راينا هذه الاعداد الهائلة من الناس التي تقصده كل يوم و هذا كله بفضل الله سبحانه و تعالى و الحمد لله رب العالمين على هذه الكرامة و النعمة."
archived = "2010-03-14"
capture_url = ""

