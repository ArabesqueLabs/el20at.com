subject = "الرجل المشعود"
author = "youssef"
posted = "2007-03-21"
text = "ربما الطريقة التي يستعملها يستطيع اي شخص ان يقوم بها وتعطي نفس النتيجة وهي شفاء المرضى والسبب ان المريض يهيء نفسه داخليا لتقوية مناعته ضد المرض .انا اجزم انه دجال لكن اجد ومن الضروري تشجيعه على هدا العمل مادام المرضى في حاجة ماسة لمن يحفزها على العلاج رغم سداجة الطريقة المتبعة لدلك"
