[[comments]]
order = 2
subject = "طيب ممكن لحظة للعقل؟؟"
author = "محمد السيد"
posted = "2007-06-19"
text = "مش قادر افهم المنطق ده إلي الآن ...<br />فكرة إن حماس بتتحرك دلوقتي لمصلحتها والكلام ده .... هل حد متصور إن حماس اللي صبرت كل السنين دي واتحملت اعتقالات فتح وتعذيبها والغدر بيها وخيانتها عملت اللي عملته ده إلا بعدما الأمور وصلت لحد لا مينفعش السكوت عليه ؟؟...<br />يعني فكرة إن حماس غلطانة .....<br />غزة في الأيام الأخيرة تحولت لمدينة أشباح .. الخروج للسيدات يعني اختطافهم ..<br />السرقة والنهب كان علي عينك يا تاجر علي يد الشرطة ورجال دحلان ...<br />منزل رئيس الحكومة ومقره يتعرضوا للقصف ؟؟؟ومن فلسطينيين مش من اليهود ....<br />لما نوصل إن كل قيادات الحكومة معرضة للاغتيال واضطروا للاختفاء ومفيش حد يدير شئون الدولة ..<br />لما المخابرات المصرية تطلب الالتقاء بيهم فيكون الرد ..مينفعش يطلعوا لأنهم لو ظهروا رجال دحلان حيقتلوهم ...<br />يعني إيه حكومة كل وزرائها معرضين للاغتيال والقاتل عملاء في الداخل مش يهود ... مجموعة من الناس كل مهمتها هي المقاومة وخنقها والقضاء علي البذرة الوحيدة المتبقية تقاوم ..<br />ومش حماس بس ... لأ حماس والجهاد واي حد متصل بالمقاومة ...<br />للحديث بقي تحت ...<br />يارب ... مش حاسكت<br />لا لتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\" بس مش أوي كده يعني\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />www.mesh7askot.blogspot.com"
archived = "2010-03-14"
