[[comments]]
order = 0
subject = "اين الشريعة"
author = "ابو اسامة"
posted = "2007-06-18"
text = "انه مقال اكثر من رائع واضيف عليه انه عندما يكون لدينا نص ثابت من القرآن والسنة فلا نستطيع ان نفتى<br />وان نظرية الاستحلال لدم الآخرين ليس لديه اى مبرر شرعى فلابد من الاحتكام الى الشريعة لكى نعرف ما لنا وما علينا<br />ولا اعرف هؤلآ ماذا سيقولون عندما يقفون امام الله ودالقتيل معلق برقبته ويقول لربه اساءله فيما قتلنى<br />فمن السهل ان نقتل ولكن من الصعب ان نبرر اى قتل لاخوة فى الطن والدين ."
archived = "2010-03-14"
