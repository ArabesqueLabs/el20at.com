subject = "من يدفع عنا؟"
author = "محمد السيد"
posted = "2007-06-19"
text = "ثالث حاجة ....<br />القضية هناك أساسا مؤسلمة جدا ...<br />وده الطبيعي في حالة تحرير في أرض مقدسة زي فلسطين ...<br />فمنتوقش يطلعوا يتكلموا بلهجة غير دي ... ولكل أسلوبه ..<br />نهاية ....<br />رجاء رجاء ....<br />لا تظلموهم ... فمن يتحمل عنا جميعا إثم السكوت هم ..<br />ومن يدفع عنا العار في ظل استسلامنا المهين هم ...<br />ومن يكنب لنا قصص للبطولة نحكيها لأبنائنا هم ....<br />ومن يرفع عنا الوزر أما الله هم ....<br />ادعوا لهم .... ادعوا لهم<br />يارب ... مش حاسكت<br />لا لتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\" بس مش أوي كده يعني\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />www.mesh7askot.blogspot.com"
