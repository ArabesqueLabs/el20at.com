[[comments]]
order = 3
subject = "وكمان يا سيدي"
author = "محمد السيد"
posted = "2007-06-19"
text = "اللي نصر حزب الله في لبنان .. هو عدم وجود بينهم أمثال دحلان واللي معاه ...<br />وبعدين ما الناس اللي كله افتكرها دلوقتي ... كانت متبهدلة اخر بهدلة في أيام دحلان ... ليه محدش اتكلم عنها ولا جاب سيرتها أيامها ؟؟<br />يعني إيه؟؟أي واحد ملتحي في الشارع أو منقبة يخطفوه ويعذبوه ويقتلوه ؟؟؟<br />يعني إيه اختطاف واحد زي عمر الرنتيسي ابن أخو الشهيد عبد العزيز الرنتيسي قبلها بأيام وتعذيبه وقتله ؟؟؟<br />بأي منطق وبأي صبر ممكن حد يتحمل وضع زي ده ؟<br />يعني كل المدنيين الي بنتكلم عنهم دول ... كانوا عايشين في رعب الأيام الفائتة وبسبب دحلان ورجالته .... حماس اللي عملته دلوقتي إنها وقفت حالة الرعب دي ....<br />وللحديث بقية تحت ...<br />يارب ... مش حاسكت<br />لا لتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\" بس مش أوي كده يعني\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />www.mesh7askot.blogspot.com"
archived = "2010-03-14"
