[[comments]]
order = 1
subject = "ديمة"
author = "عندك حق"
posted = "2007-06-19"
text = "مقال حلو اوى، انا قلبى محروق من اللى حصل فى فلسطين ولا طايقة حماس ولا فتح وزعلانة على القضية لكن لو لمت على ضياعها فأكيد دول آخر فريقين ممكن تلومهم فين باقى المسئولين واللى مش عايز يقتنع ان كل العرب مسئولين ان شاالله عنه مقتنع هى ضاعت وخلاص وزى ماقاال نزار لم تحضر فلسطين الفرح .. فابقوا فى مأتمكم"
