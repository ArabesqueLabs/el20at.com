[[comments]]
order = 4
subject = "وفكرة الصبر؟"
author = "محمد السيد"
posted = "2007-06-19"
text = "النقطة الأخري ...<br />بعض العنف اللي شفناه ... كله مرفوض ولكن ....<br />هل حماس دول بشر لا حاجة تانية ... يعني واحد شاف قدامه الشخص اللي عذبه وقتل أبوه وكان عامل رعب له ولأهله ...<br />إيه المتصور فعله ؟؟؟<br />يعني إحنا هنا في مصر ...بنقول أمن الدولة وعملوا وسووا والكلام ده كله ...هناك دحلان واللي معاه ألعن مية مرة من أمن الدولة اللي عندنا هنا ...<br />مين السب في قتل أحمد يس والرنتيسي وآلاف غيرهم ؟؟<br />قادة الجهاد وحماس والجبهة وكل المقاومة قضوا في سجون السلطة أكثر من اللي قضوه في سجون اليهود ....<br />ورغم كل ده .. كان الدم الفلسطيني خط أحمر ... والوحيد الللي التزم بالخط ده حماس والجهاد والمقاومة....<br />لكن الوضع دلوقتي وصل لمرحلة لا يمكن السكوت عليها ... باعتراف بعض قادة فتح ... والي شاف قناة الأقصي \"قناة خاصة بحماس\" حيشوف الفضايح اللي لقوها داخل المقرات دي ....<br />أحدث وسائل التعذيب العصرية ... بيانات فاضية عليها لوجو وامضاء حماس وناقص يكتبوا فيها أي حاجة ويوزعوها باسم حماس ... عدد القتلي اللي لقوهم داخل التلاجات داخل المقرات شيء فظيع .... شهادات تقدير مختومة بأختام إسرائيلية لقادة الشرطة الفلسطينية ... طلبات وأوراق مذيلة بتوقيعات اسرائيلية<br />بعد الصبر ده كله ... لازم يكون في نتيجة عكسية ... واللي يعرف التربية اللي بيترب عليهم الناس هناك .. ده كده منتهي الصبر ..<br />ولا تتوقعوا إنكم لو في مكانهم حتصبروا ربع الصبر ده ....<br />وللحديث بقية تحت ...<br />يارب ... مش حاسكت<br />لا لتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\" بس مش أوي كده يعني\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />www.mesh7askot.blogspot.com"
archived = "2010-03-14"
