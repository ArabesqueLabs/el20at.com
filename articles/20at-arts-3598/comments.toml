text = "اولا بالنسبة لموضوع الجيش انا شايف ان تامر وهيثم متظلموش بالعكس لو نفرض لو ان شاب عادي مش تامر ولا هيثم عمل كده ايه ايللي كان هيحصله فى الجيش بتهيالي كان هيتعامل اسوأ معامله وبعدين انا راي اي بنت من البنات ايلي عملو المظاهرات ايها علشان خاطر تامر بتهيالي لو ده اخوهم مكنش هيعملو كده. ده بالنسبة لموضوع الجيش وان هو اتظلم ولا لا.<br />بالنسبة لموضوع الالبوم انا شايف ان البوم تامر جميل جدا باستثناء اغاني معينة انما هو البوم منوع وجميل واحسن اغنية (الله يباركلي فيك - ارجعلي - حاسس بخوف - بنت الابه) وبرده مش لازم يا جامعه نعمل نقطة ونلف وندور عليها تامر مغني جميل وممثل برده جميل وبيعرف امتى ينزل البومه وكمان ينتقي الممثلين ايلي معاه بس برده لازم ندي كل موضوع حقه ومش لازم نكبر المواضيع."
