subject = "عبد الله مفتاح..عود احمد"
author = "نيفين نيفى نوفا"
posted = "2007-04-16"
text = "نسمى دا يا عبد الله(ما عدوك الا ابن كارك)<br />خد باللك<br />شفت اسمك كدا ف كام موضوع حبيت اقوللك حمد الله ع السلامه و مستنيين ابداعاتك انت بقى<br />و كالعاده للحديث بقيه بس سيبها للصدفه<br />بالنسبه لموضوع صحفى صوت الامه بصفتى هاويه ف مجال الكتابه و مش دارسه اساليب العمل الصحفى مش هفتى و لا اقول حاجه بعد كلام شيرين لانها اكيد ادرى بس اللى اقدر اتكلم فيه ان فعلا ابسط تقاليد العمل الصحفى عدم اللانتقاص من شان كتابات الغير و عدم التطاول و النقد اللاذع دا و بصفتى درست نقد احب اقول للصحفى اللى رفض كتابه اسمه دا غلط كمان النقد لا يبيح تجريح الغير و يقتضى ابعاد الذات و تبنى الموضوعيه اللى انت افتقرت ليها<br />كمان اعتقد ان الموضوع تقرير و موضوع لايت مش تحقيق و بعد مكانى و زمانى<br />و تانى اعتقد ان شيرين كفتنا مؤنه الرد على صحفى صوت الامه<br />بالمناسبه انا معرفش كاتب المقال و لا اعرف شيرين و هما حتى مش من الناس المقربين ليا ف عشرينات بس اللى اعرفه و هقوله تانى بلاش نجلد الناس نفس فكرتى ف تعليقى السابق<br />يللا يا عم تامر<br />دعايه ببلاش اهى<br />و الله لو الشركه المنتجه خدت خبر باللى مكتوب هنا و الله لكانت وفرت الدعايه و اكتفت انها تكتب على البوسترز بتاعه تامر انظر موقع عشرينات موضوع بنت الايه"
