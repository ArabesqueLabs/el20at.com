subject = "جميل"
author = "واحد في ال70 مليون"
posted = "2007-04-16"
text = "الموضوع جميل جدا وكذلك سؤالك في النهاية . وانا اعتقد ان تامر لا يستحق كل تلك الضجة لعدة اسباب<br />1- هناك العديد من الاصوات الشبابية الافضل والاحسن من الاخ تامر حسني ولم يأخذوا حقهم<br />2- لا ننكر ان تامر صوته جميل ولكن هل هو مثل عمرو دياب او محمد منير الذين لا نسمع عنهم كل تلك الاخبار<br />3- تامر مجرم في حق الوطن ومع ذلك يعتبر نفسه ضحية<br />4 تامر يتسول حب الناس ودائما يحاول ان يظهر نفسه الشاب النقي الذي لا يعرف في الدنيا شيئا والباحث دائما عن الحب ولكنه لا يجده<br />5 - انسان مريض نفسيا ويحتاج لطيبب نفسي<br />6- انا اعرف جيدا اسرة تامر حسني فهم جيراني وعائلته غلبانه جدا وهو دائما يشعر بعقدة النقص، وللعلم انا اعرف تامر قبل ان يصبح مطربا ودائما كان يحب ان نطلق عليه \" الشاب أبو جيتار\".<br />7- وراء كل تلك الضجة الاخ نصر محروس الذي يعمل من الفسيخ شربات<br />وفي النهاية اقول اللهم اهدي القوم الضالين<br />اللهم اكفى نار كيد الحاقدين<br />اللهم كفانا شر الحاسدين<br />اللهم اعنا لنواجه اعين ودسائس الماكرين<br />اللهم ياخدك يا هو .............."
