subject = "موضوع اضعف مما تتصور !"
author = "صحفى فن بجريده صوت الامة .. مش"
posted = "2007-04-15"
text = "بص يا عم محمود انا هانجز معاك .. انا اول مرة اعرف اصلا ان فى موقع اسمه 20 احد الزملاء قالى عليه ..و اول ما دخلت لاقيتك حاطط موضوعك رئيسى قولت اقراه .. مع انى عامل حوار مع تامر من اسبوعان تفريبا عن الشريط فقلت اشوف ايه الجديد عندك يمكن نستفاد منك<br />انا مش متصور ان موضوع طويل عريض عن شريط طوب الارض اتكلم عنه .. يجى دلوقتى حد يتكلم عن الاغانى اللى فيه و يوصفها .. وانتا من محلل يعنى ولا طارق الشناوى مثلا .. يعنى معايير ديه تقولها لاصحابه مش تكتب بيها موضوع صحافة يفترض انك تفيد بيه الناس .. ماشى ياحج !<br />الموضوع بقى عشان يبقى موضوع صحافة و كده يعنى \" لو كنت سمعت عن الصحافة اصلا \" لازم تعمل فيه شغل يعنى اقل حاجة تكلم تامر تعرف رأيه فى الشريط و تسأله اسأله جديده غير اللى قبلك سألها<br />- تشوف توزيع الشريط نفسه عامل ايه<br />- تاخد رأى ملحنين وموزعين فيه<br />يعنى عشان نحس انه موقع مش مدونه !<br />و اخيرا ممكن تقارن نجاح او فشل الشريط ده بالشرايط الموجوده حاليا \" بعد مكانى \" او تفارنه بالشريط اللى قبله<br />\" بعد زمانى \" ولو قولتلى معنديش مصادر لده كله .. هاقولك اتعلم الاول وبعدين اشتغل صحافة<br />و مبدئيا ده ميلى لو احتجت مصادر فنيه swallow_2in1@hotmail.com<br />مش عاوزك تزعل منى بس احنا فى اول الطريق سمعنا اكتر من كده ,,, وانتا لسه مبتدئ خالص .. حتى لو عندك 100 سنة الاسلوب واضح .. عذرا .. اعمل مجمود شويه فى الموضوع انتا لو جيت لنا تدريب فى صوت الامة هاتخس النص من المجهود اللى هانخليك تعمله !! هاتخليك تخس النص .. ولو ما بدأتش تضبط نفسك هاتفضل طول عمرك بنفس الاسلوب ده<br />وانسى حاجة اسمها الانفرادات و الشغل المميز ..<br />سلام يا قمر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
