[[comments]]
order = 10
subject = "تامر نجم ..هل انطفى؟"
author = "شرين منصور"
posted = "2007-04-16"
text = "اولا السلام عليكم ثانيا في كذا نقطة عايزة اتكلم فيها اولها واهمها ان الموضوع كتييير من الشباب نجمهم اللي بيوصل احساسسهم هو تامر بس السؤال هل بعد الشريط ده انطفى نجمه زي ما بيقولو؟انا في رأيي هي أزمة مرة بيها تامر وكل قلوبنا كانت معاه وللاسف ده اثر على أغلبية الاغاني الموجودة فيها يعني مثلا في اغنية كلماتها جميلة والحانها ممتازة زي الله يباركلي فيك واغنية ارجعلي الاغنيتين فيهم احساس عالي جدااا بالاضافة لأغنية أنا ولا عارف يعني لو جينا بصينا على التلات اغاني دول حنلقيهم منوعين والحان مختلفة واحاسيس مختلفة وواصلين وطبعا مننساش اغنية كل البشر واربع ائمة الاغنيتين اللي بيحكوا قصة البشرية وسر الحياة في بضع كلمات اما عن الشريط فيه اغاني نجحت واغاني لأ ولو تعمقتو في الحياة الفنية لأي مغني حتلاقوهازي مؤشر الذبذبات احيانا بيطلع واحيانا بينزل مش طول الوقت هابط ومش طول الوقت مرتفع أما عن الضجة الاعلامية لتامر يمكن هي ظروف سجنه اللي خلت الاعلام يعملو zoom in عليه بسبب على ما تتذكروا معايا ان اتعملت مظاهرات على دخوله السجن وكلنا شفناه على الشاشات الصغيرة بالاضافة للضجة اللي حصلت لما خرج وكل ده لوضع تامر المميز عند كل الشباب من ناحية الصوت انتقاؤه للاغاني والالحان والاحساس اللي بيغني بيه وبعدين كلنا عارفين ويمكن اللي يفهمني اكتر اللي دارسين اعلام ان الاعلام اصبح في الوقت ده مبني على اساس تجاري بحت وده للاسف طبعا بالمعنى البلدي الي بيجيب فلوس وتامرهوللي حيجيب الفلوس دي ليهم نهاية الكلام عن تامر ده وضع طبيعي ان الشريط يكون فشل لن في حياة اي بني ادم عادي هبوط وصعود،،اما عن الاستاذ المحترم اللي كتب وبيقول انو كاتب في صوت الامة متهيأل اننا أخدنا في سنة اولى اعلام ان الزميل الصحفي ميعلقش ولا يتطاول على زميلو الصحفي دي اساسيات وانا متابعة دايما لمقالات الاستاذ محمود ان بعد مقالات كتيرة جدا انا قراتها ليه قدرت اكون فكرة عنو وده تاني درس في سنة اولى اعلام ان منقولش تعليقنا الا لما نتعمق في الموضوع ومتهيالي على حسب كلام حضرتك انك مقرأتش مقالات الاستاذ محمود،اما عن تالت درس اخدنا في سنة اولى صحافة هو ان في حاجة اسمها مقال راي وتحقيق وخبر وتقرير مصور ومتهيالي ان محمود لو راح قابل المصادر اللي قلت عليهم حيبقى الموضوع تحقيق من الدرجة الاولى وكلنا عارفين ان الفرق بين التحقيق والتقرير ومقال الراي هو المصادر ومتهيأل اننا اخدنا برضو أن لو فكرت انك تعمل تحقيق يبقى المفروض انو بيتناول ظاهرة ومتهيالي جدااااا ان تامر حسني مش ظاهرة ده مغني واصل لكل الشباب وبيقدم كل سنة تقريبا البوم يعني مينفعش انو يبقى مسار تحقيق اما عن المدونة اللي ذكرتها حضرتك انا على ما اعتقد ان الاستاذ محمود بعيد كل البعد عن ما يسمى المدونة، وبعدين ان كاتب المقال قال انو مش بيقيم الاغاني نهائي زي ما حضرتك بتقول،وكمان في حاجة متهيالي ان حضرتك اتهمتو ان معندهوش مصادر حضرتك بتقول ان دي اول مرة بتدخل فيها الموقع يعني نتعرفش هو كتب ايه ومكتبش ايه ومتهيالي ان محدش بيشتغل في الصحافة الورقية او الالكترونية الا اذا كانت ليه مصادر ...على فكرة انا لابدافع عن كاتب المقال ولا بنتقد اسلوب حضرتك اللي انتقد بيه الاستاذ محمود لنو ميصحش بس انا بتكلم لني في اعلام ودارسة واللي درسولي عاتولة صحافة مهنيين في مختلف المؤسسات الصحفية المعروفة ،بس أحب انوه على حاجة اننا اخدنا اننا لا نعلق على شيء الا بعد دراسة عميقة للكاتب والمقالة ... ورسالة بقولها لتامر جو اهيد أغنية بنت الايه جامدة يا حسني مستنيين فيلمك"
