[[comments]]
order = 23
subject = "جتوا نيله مليتوا البلد"
author = "الاخت شيرين اللى بتقول انها مش"
posted = "2007-04-17"
text = "1- عم عبدالله مفتاح قال : مش ناقص الا صوت الامه والكام بشكاتب بتوعها هما اللي هيتكلموا .. عجايب ... طيب ما تقولنا مالها صوت الامه برضه لو منك نستفيد ياحج<br />و ايوه الكتاب البشكاتب \" انتا مش قادر تنسى اصلك ليه \" يتكلموا فى الفن لاننا افضل جرنال مصرى بيعمل فن بشهادة الجميع .<br />2- و الاخت شيرين منصور قالت \" الاستاذ المحترم اللي كتب وبيقول انو كاتب في صوت الامة متهيأل اننا أخدنا في سنة اولى اعلام ان الزميل الصحفي ميعلقش ولا يتطاول على زميلو الصحفي دي اساسيات .... بجد والله اساسيات مكنتش اعرف انها كده امال يعنى ايه نقد الاخرين وقبول نقد الاخرين لك لما كلنا نفضل نحسس على بعض و نصفق لبعض .. غريبه انك خريجه اعلام .. ممكن اداب اعلام !<br />- تاني درس في سنة اولى اعلام ان منقولش تعليقنا الا لما نتعمق في الموضوع ومتهيالي على حسب كلام حضرتك انك مقرأتش مقالات الاستاذ محمود، .. والله عذر اقبح من ذنب و يدل على عبقريه فذه للاستاذه هو انا بعامل الناس بالافه كلها على بعض انا قريت موضوع وعلقلت عليه .. على الموضوع بس مش محتاج اقرا كل كلام الكاتب فى مناطق اخرى .. انا بعلق على حاجة واحدة و كل كلامى كان عليها و يمكن كتب مقالات حلوه تانيه ايه بقى علاقتها بالموضوع ده .. انتى هاتبقى صحفيه رائعة على فكره .<br />- تالت درس اخدنا في سنة اولى صحافة هو ان في حاجة اسمها \" مقال راي وتحقيق وخبر وتقرير مصور ومتهيالي ان محمود لو راح قابل المصادر اللي قلت عليهم حيبقى الموضوع تحقيق من الدرجة الاولى وكلنا عارفين ان الفرق بين التحقيق والتقرير ومقال الراي هو المصادر ومتهيأل اننا اخدنا برضو أن لو فكرت انك تعمل تحقيق يبقى المفروض انو بيتناول ظاهرة ومتهيالي جدااااا ان تامر حسني مش ظاهرة ده مغني واصل لكل الشباب وبيقدم كل سنة تقريبا البوم يعني مينفعش انو يبقى مسار تحقيق \"<br />مش عارف متأثرت بالكليه ليه قوى كده بس ماشى \" اوك \" بتقولى فى حاجة اسمها راي وتحقيق وخبر وتقرير مصور باعتبار انه حرام يبقى فى تحقيق مصور يعنى ولا ايه \" مفيش حاجة اسمها تقرير مصور يا استاذه \" ماشى .<br />و بعدين بتقولى ان \" الفرق بين التحقيق والتقرير ومقال الراي هو المصادر \" بحد والله دانتى ماشاء الله فلته انتى فاكره الصحافة الكام كتاب بتوع فاروق ابوزيد ان الخبر لازم يجاوب على 6 اسئله والحركات ديه .. نصيحة اقرى شويه جرايد اجنيه \" ولو مترجمه \" هتلاقى انه فكرت التحقيق انه يكون بمصادر ديه انقرضت فيه حاجة اسمها تحقيق معلومات الاصل فيه المعلومة المركزه و التفسير وده اللى انا كنت عاوز من الكاتب مش قال تامر وعقب المخرج الفلانى او المحلن العلانى و كده !! و النقطه الاهم انه ده اخر حاجة ممكن نحطه تحتها انه يكون مقال رأى لان الكاتب سحطى جدا و لم يكشف جديد او يضيف معلومه كما فى مقال الكتاب .. مش الهواة<br />- المدونة اللي ذكرتها حضرتك انا على ما اعتقد ان الاستاذ محمود بعيد كل البعد عن ما يسمى المدونة، وبعدين ان كاتب المقال قال انو مش بيقيم الاغاني نهائي زي ما حضرتك بتقول \" طيب وشهد شاهد من اهلها لما هو بطيخ كده بيكتب ليه اصلا !<br />- وكمان في حاجة متهيالي ان حضرتك اتهمتو ان معندهوش مصادر حضرتك بتقول ان دي اول مرة بتدخل فيها الموقع يعني نتعرفش هو كتب ايه ومكتبش ايه ومتهيالي ان محدش بيشتغل في الصحافة الورقية او الالكترونية الا اذا كانت ليه مصادر ... طيب يا استاذه يعنى شايل المصادر لوقت عوزه ولا حد مزنوق فيها فقبضهاله الشهر ده وها ياخدها الشهر الجاى .!<br />- على فكرة انا لابدافع عن كاتب المقال ولا بنتقد اسلوب حضرتك اللي انتقد بيه الاستاذ محمود لنو ميصحش بس انا بتكلم لني في اعلام ودارسة واللي درسولي عاتولة صحافة مهنيين في مختلف المؤسسات الصحفية المعروفة ،بس أحب انوه على حاجة اننا اخدنا اننا لا نعلق على شيء الا بعد دراسة عميقة للكاتب والمقالة ...<br />بصى لا تدافعى ولا تقفى جون .. اولا .. وبالنسبه لانك فكرتك نفسك حاجة يعنى عشان دارسه اعلام .. طظ فى الكليه ما احنا اتخرجنا من بدرى واكتشفتا ان كل الى اخدنا ولا ليه اى لازمه مع العلم انها اعلام القاهره مش اداب اعلام .. يعنى انتى اخر حد ممكن يتكلم باعتبار من حد يعنى زيك زى الاف الطلبه اللى بيدرسوا اعلام ولو كل واحد خد كلمتين فى اعلام او اى معهد صحافة فكر نفسه حاجة تبقى خربت ! اما بقى انك اعلام ودارسة واللي درسولي عاتولة صحافة مهنيين في مختلف المؤسسات الصحفية المعروفة .. فمش عارف اقولك ايه معنى كلامك ان العتوله \" هكذا تكتب \" دول اكيد من الاهرام او الاخبار او الجمهوريه .. و بالمناسبه انا شغال فى الاهرام كمان .. و مش بتكلم من فراغ يعنى .. بس السؤال هو فى صحافة اصلا فى المؤسسات ديه ولا هما عندهم حاجة عشان يقولوها<br />ومن امتى الصحافة كانت بالكلام والمحاضرات ...الصحافة اصلها الممارسه يا استاذه !<br />- ورسالة بقولها لتامر جو اهيد أغنية بنت الايه جامدة يا حسني مستنيين فيلمك .. طيب ربنا ما يحرمك منه .. وبالمناسبه يحشر المرء مع من احب !<br />3- البنى ادم اللى قال إلى سي الأستاذ بتاع صوت الأمة ... انت مين ياد الأول عشان تتكلم بالشكل ده؟ ... مسمي نفسك صحفي فن...وبتعيب على كاتب المقال<br />اولا قبل ما تتكلم محمود حامد من احسن صحفيين الفن في مصر، وياريت توصل لربع مستواه... انت بقى اللي جاي تعلمنا الصحافة..وكمان شكل الموقع مش عجبك..لما تعرف نت أصلا ابقى اتكلم ..<br />طبعا لن اهبط لاسلوب المستنقعات للرد على الحشرة التى كتبت .. بس هاقوله انا صحفى \" نقابى \" غصب عنك يا استاذ .. و انا مش مسمى نفسى صحفى فن ولا حاجة لان ديه حقيقه .. و اديلك وقعت بلسانك اهوه \" قبل ما تتكلم محمود حامد من احسن صحفيين الفن في مصر\" يعنى هو احسن الوحشيين ولا ايه لو انتا اعترفت بكده خلاص . مش هاعلق .. وبتقول ياريت اوصل لربع مستواه طيب انتا قريتى حاجة عشان تقول كده ... واخيرا لما تعرف نت أصلا ابقى اتكلم .. هههههههه انتا فاكر كل الناس زيك جايه من ورا الجاموسه واتعلمت نت وكمبيوتر !<br />4- تحيه للاخ مصرى مصرى<br />كان فى زمان موقع اسمة عشرينات كان جامد بجد<br />الله يرحمه الفاتحه له ياجماعه<br />5- و اخيرا نوفا قالت \" بالنسبه لموضوع صحفى صوت الامه بصفتى هاويه ف مجال الكتابه و مش دارسه اساليب العمل الصحفى مش هفتى و لا اقول حاجه بعد كلام شيرين لانها اكيد ادرى بس اللى اقدر اتكلم فيه ان فعلا ابسط تقاليد العمل الصحفى عدم اللانتقاص من شان كتابات الغير و عدم التطاول و النقد اللاذع دا \" طول ما احنا بالعقليه ديه عمرنا ما هنتقدم ابدا<br />و بصفتى درست نقد احب اقول للصحفى اللى رفض كتابه اسمه دا غلط كمان<br />\" انا لم اقصد الشهره لذا لم يكن مهم الاسم \" و حتى نتعلم الموضوعيه و تعلقون على الرأى و ليس كاتبه .<br />النقد لا يبيح تجريح الغير و يقتضى ابعاد الذات و تبنى الموضوعيه اللى انت افتقرت ليها .. انا كل كلامى فى صميم الموضوع بس انتى ما قرتيش !<br />كمان اعتقد ان الموضوع تقرير و موضوع لايت مش تحقيق و بعد مكانى و زمانى<br />حلو يبقى يكتب فى بيتهم فى فى موقع اخبارى ..<br />و تانى اعتقد ان شيرين كفتنا مؤنه الرد على صحفى صوت الامه .. فهعلا وصحفى صوت الامة مسح بيها الارض برضه !<br />و اقول لكاتب تلك الموضوع هل عجز قلمك عن الدفاع عما تكتب فتركت امره للدفاع عن من قبل بعض البنانيت ولا ايه .. ايه الحكايه ..<br />سلام .."
