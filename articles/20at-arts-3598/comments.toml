[[comments]]
order = 37
subject = "لايستحق تامر تلك الضجة الإعلامية"
author = "حسن طه"
posted = "2007-04-28"
text = "لايستحق تامر تلك الضجة الإعلامية التي تثار حوله حاليا؟ في أعتقادي بأن تامر حسن ليس فنانا بمعنى الكلمة حتي تثار حوله تلك الضجة الإعلامية بقصد أن ينال شهرة ليست من حقه . هذا الإنسان هرب من تأدية واجبه تجاه الوطن بالإضافة إلى أنه لم يضف جديد إلى الفن لا هو ولا غيرة من فنانين العهد الحديث .. إذ انه لايوجد حالياً حاجة اسمها فن لا في التأليف ولا في التلحين ولا في الآداء ( الطرب ) لا يوجد سوى إزعاج وموسيقي موضوعة مسبقاً وعلى رتم واحد والصوت يكاد يكون واحد لا طرب ولا غنا ولا لحن كله يسرق من كله .. وضاع الفن في الرجلين ما بين من يدعي أنه فنان وما بين مؤلف كلمات هابطة ومحلن سارق لغيره بالإضافة إلى بعض الراقصات والجميلات وشوية خزعبلان وحاجة مقرفة يقال عليها الفيديو كليب .. وما هي إلا زغللت عنين وصداع وخلاص .. الله يرحم الفن والفنانين الأصليين .. حتى للأسف لقد أصبح الجمهور اليوم .. لا يتزوق الفن الأصيل وبات مقتنعا بعض الشيء بوجود ضجه أعلامية بدون داعي لهذا الفنان أو ذاك .. أي واحــدددد اليوم ممكن يصبح فنان ومشهور.. سواء كان ممثلاً أو مغنياً .. أو ... أو ... إلى آخره... المهم . من هو تامر هذا علشان نعمله هذه الزيطة والخزعبلات الكدابة بدون داع .. ياناس حرام عليكم بقــى أرحمونا .. من التلوث السمعي الحالي.. لقد تلوثت أذان الناس .. واصبحت بدون أحساس .. من شـده هذ1 الإفلاس في التأليف واللحن والآداء ... الخ .. ياريت تفضوها سيرة عن تامر وغيره .. شدوا السيفون عليهم وريحونا من الحبيبات بتوع اليومين دول .. أنا باموت في تامر .. وأناشرموطة علشان تامر.. مش عارف إيه .. الكلام ده .. فين اهل هذه الفتيات المغرمات بالفنانين وسايبن المذاكرة .. وقاعدين لهذا الكلام الفارغ.."
archived = "2010-03-14"
capture_url = ""

