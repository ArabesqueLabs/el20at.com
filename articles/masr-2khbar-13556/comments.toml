author = "الامم التحدة"
posted = "2009-09-29"
text = "على حسب ما جاء فى التقرير<br />لماذا لا تتدخل الولايات المتحدة ومجلس الامن وتحدد للدول المتخلفة مدة رئاسة محددة يغور بعدها الحاكم فى ستين كسحة فاذا لم يغادر اعتبر مارق ويتم تصفيتة جسديا زى صدام او يقاطع ويحاصر وتقذف قصورة من الجو بواسطة الامم المتحدة ويطلب القبض علية زى البشير وامثالة<br />اما الانظمة الملكية فتكون دستورية زى ملك بريطانيا يملك ولا يحكم"
