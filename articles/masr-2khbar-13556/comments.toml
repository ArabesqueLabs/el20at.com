author = "فى اليمن الواد وابوة"
posted = "2009-09-29"
text = "الواد وابوة فى اليمن ولعوا فى البلد - الحوثيين فى الشمال والجنوب اللى عايز ينفصل<br />ومفيش لا تنمية ولا خدمات<br />والشاويش على عبد اللة صالح لازق فى الكرسى وابنة عقيد ورئيس الحرس الجمهورى فى اليمن<br />وبعد شوية مش هيسيبوها الا لما يفككوها ويجيبوا عاليها سافلها"
archived = "2010-03-14"
