author = "الفترة القادمة"
posted = "2009-09-29"
text = "سواء كان الاب او الابن فى الحكم<br />فيما يتعافى الاقتصاد العالمى وتزداد الاسعار ويختنق الفقراء الاغلبية ويزداد وتيرة الاضرابات اليومية التى تشهدها البلاد وتتكدس البلاد والشوارع بالزبالة والمجارى وتقف عجلة الحياة<br />سنتهى الامور باضطرابات حادة واحتمالات انقلابات عسكرية وتدخلات خارجية"
