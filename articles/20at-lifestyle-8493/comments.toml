author = "لينا عبود"
posted = "2008-03-17"
text = "قد اخالفك الرأي .. لانني من مشاهدتي للفيلم وجدت ان اكثر ماكان واضحاً هو الاعتراف الامريكي بخلق الارهاب في تلك المنطقه حيث انها زودتهم بأسلحه ليحاربو بها السوفيت ومن ثم يقتتلوا مع بعضهم البعض فتضطر امريكا للتدخل بعد ذلك لفض نزاعات داخليه بهدف الحرص على الامن والسلام ، هذا يمثل النية الظاهرة ,, اما النية الباطنه هي اختلاق حجة وذريعه لأمريكا كي تتواجد في تلك المنطقه .. تماما كما فعلت في حرب العراق والكويت و مؤخرا في غزوها للعراق ..<br />للفيلم ابعاد اخرى غير تقبيل ايدي امريكا من قبل العرب.. ولكن اليس حقيقة وواقعاً ان مصر والسعوديه واسرائيل كان بينهم تعاون على ارسال الاسلحه لافغانستان .. هنا تظهر بعض من خيبتنا العربية..<br />لماذا دائما نأخذ كل مايتعلق بالشأن الامريكي على انه كلي وليس جزئي ؟ ان كانت السياسة الامريكيه هي احتلال العراق واضعافها فإن ليس كل الشعب الامريكي مع هذا القرار … وكذلك هذا الفليم الذي يمكن ان نفسره انا وغيري على انه نوع من كشف حقائق خلق الارهاب على يد امريكا في المنطقه الاسيويه."
