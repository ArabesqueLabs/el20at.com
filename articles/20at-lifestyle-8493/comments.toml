posted = "2008-03-25"
text = "هذا هو حال السينما الامريكيه فأغلب اعمالها تظهر العرب بمظهر الارهابين القتله البربريه وكل الصفات البشعه وتظهر اليوم باحلى مظهر وتبجلهم والدليل شاهدوا افلام الممثل اليهود بن ستيلر ومسلسل 24 ففي كل المواسم العرب هم الارهابين كذلك اغلب الافلام والمسلسلات الامريكيه لابد ان تظهر حلقات عن اليهود (لعنهم الله) او تتكلم عنهم بكل تبجيل كانهم شعب الله المختار. السبب أن شركات الانتاج والمنتجين يملكها اليهود واليهود هم من اخترعوا ديانه \"كما يدعون\" الساينتولوجي ومن اشهر متبعيها توم كروز والذي صرح ان امنيته ان تقضي \"اسرائيل\" على العرب وسلفستر ستالون ولائحه طوووويله.<br />http://dreamcity.maktoobblog.com"
archived = "2011-02-03"
