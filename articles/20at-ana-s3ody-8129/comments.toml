text = "انا من الفتيات التي اشعر بالحاجة الماسه إلى العاطه والدفئ والحنان والاستقرار واللقوة في فصل الشتاء فتراني اختبئ من كل من حولي بطريقه غريبه اشعر بالضعف وبالانكسار فانا بالخامسة والعشرين من عمري وما زلت وحيده ماذا افعل بالرغم من اني جميله المظهر الحمدلله وايضا اجد الكثر من يعجبوا بي ولكن كل ما اريده لا مال ولا جاه اريد الاستقرار والسند الحقيقي"
