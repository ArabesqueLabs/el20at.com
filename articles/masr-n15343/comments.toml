[[comments]]
order = 4
subject = "الى المعلق السابق (كاتبين المصدر يا حبيبي)"
author = "مش ضروري"
posted = "2008-04-21"
text = "كاتبين المصدر في الفقرة الثانية على النحو التالي<br />وأضاف لـ\"العربية.نت\" أنه اضطر إلى هذه المقارنة نظرا لأنه لا يوجد في الوقت الحالي تعداد رسمي لأعضاء الجماعة المحظورة قانونا، والتي يتعرض أعضاؤها للاعتقال والمحاكمة بتهمة الانتماء إليها."
archived = "2008-04-24"
capture_url = "https://web.archive.org/web/20080424011550/http://masr.20at.com:80/newArticle.php?sid=15343"

[[comments]]
order = 5
subject = "امريكا عارفة وزن الاخوان السياسى والاجتماعى فى مصر"
author = "كسرولة الغرام"
posted = "2008-04-22"
text = "دراسة غير واقعية بتاتا مع احترامى لمستر رشوان لان الخمس سنين الاخيرة كسب الاخوان مؤيدين ومناصرين اكترمن اى وقت فى تاريخ الاخوان المشرف والمتوج بالوطنية الصادقة وطبعا دة على حساب تقصير الحكومة فى اداء واجبها تجاة شعبها لغاية مبقى الفقر والمرض والجريمة عايش ومعشش فى قلوب الناس ودة اكبر واهم سبب لزيادة عدد المنتمين والمؤيدين لبرنامج الاخوان الناس زهقت وملت من الحكومات المتعاقبة والمتنافسة بينها وبين بعضيها لنهب وسلب ارادة الناس و المال العام"
archived = "2008-04-24"
capture_url = "https://web.archive.org/web/20080424011550/http://masr.20at.com:80/newArticle.php?sid=15343"
