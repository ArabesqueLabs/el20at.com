text = "تعليقات حول الموضوع<br />1 - الله معاكم<br />fcb4ever|21/04/2008 م، 09:06 صباحاً (السعودية) 06:06 صباحاً (جرينتش)<br />الله مع كل الاخوان المسلمين في مصر ومع كل من يجعل مخافته امامه ...يا شعب مصر اتحدو جميعا ضد طواغي الحكومه الغير شرعيه<br />2 - 75% من الشعب المصرى<br />محمد الغزالى|21/04/2008 م، 09:09 صباحاً (السعودية) 06:09 صباحاً (جرينتش)<br />ماضير ان نكون من الاخوان وانا شخصيا اعتبر ان 75% من الشعب المصرى من الاخوان المسلمين حيث انه شعب ملتزم ومتمسك بدينه وقائم بشرع الله على اكمل وجهه ولكن الساسه والامريكان والغربين تتخوف من اولئك الذين يتمسكون بدينهم ويطلبون بتطبيق شرع الله كما حدث فى الجزائر عندما فاز جبهة الانقاذ سنة 92 وعندما فاز حماس فى فلسطين وكما فاز الاخوان من قبل 3 سنوات ولذلك الحكومه المصريه تحاول تشويه صورة الاخوان على انهم مجموعه من (...........<br />3 - الاخوان نسمع بهم دائما عند محاكمتهم او أبراز عظلاتهم امام الشاشات التلفزه<br />علي الفيلي من اصل بلاد الرافدين|21/04/2008 م، 09:12 صباحاً (السعودية) 06:12 صباحاً (جرينتش)<br />الاخوان المسلمين في جميع الدول العربيه لهم أقوال بدون افعال ونراهم ليلا و نهارا رافعين القراءين بأيدهمنحن نريد افعال ولا نريد تمثيل في الجوامع او الشوارع ابراز العظلات والقوه وفي النهايه كلهم في سجن ابو زعبل المصري طيلة حياتي اسمع عنهم ولم اراهم يتكلمون في اليل ويمحونها في النهار كذالك العكس وهكذا<br />4 - الرقم ده قليل جدا<br />ياسر|21/04/2008 م، 09:16 صباحاً (السعودية) 06:16 صباحاً (جرينتش)<br />الرقم ده قليل جدا انا فقط اعرف 2مليون عضو - عموما اعضاء الاخوان المسلمون هم كل المسلمين فى العالم ومعهم بعض انصار الحق والعدل والحرية من اصحاب الديانات الآخرى<br />5 - زبد البحر<br />ابو عمر |21/04/2008 م، 09:17 صباحاً (السعودية) 06:17 صباحاً (جرينتش)<br />انهم كثر ولكنهم كزبد البحر لا قيمه ولا قوه اقترح عزل المرشد العام<br />6 - اذا كان الاعضاء 2.5 ..فالانصار حوالي 25 مليون!!<br />مسلم...لا يعبد صنما..ولا حجرا...ولا صورا...يعبد الله الواحد الاحد!!|21/04/2008 م، 09:20 صباحاً (السعودية) 06:20 صباحاً (جرينتش)<br />اظن ان مصر ستحكم من قبل الاخوان قريبا جدا! واتمنى ان يسود الامن والامان ربوع مصر وكل بلد عربي وخصوصا العراق فلسطين ولبنان لان شعوب هذه البلاد عانت الامرين من قبل اتباع النجمة السداسية ومن قبل اتباع بن صفوان المجوس..بائعي الموز والفستق والحل الامثل هو طرد كل من ينتمي الى اولئك ووضعهم في الربع الخالي وسنرى الامن والامان يعم وفي صورة قياسية!<br />7 - ............................................... كلوا نفسكوا يا اخوااان<br />القرمزى|21/04/2008 م، 09:22 صباحاً (السعودية) 06:22 صباحاً (جرينتش)<br />ببقى مبسوط قوى وهم جماعه محظوره ويقروا الكلام ده ويسمعوه وياكلوا فى نفسهم ... وعدد خرافى بدليل انهم ولا حاجه على ارض الواقع وكل دورهم يتجرجروا مع الحراميه والعربجيه على الاقسام والمحاكم والسجون اى زبالة المجتمع .<br />8 - بسم الله الرحمن الرحيم.....عدد مؤيدي الاخوان المسلمين نحو سبعين مليونا<br />محسن المصري...جزى الله خيراالعربيــــــة|21/04/2008 م، 09:22 صباحاً (السعودية) 06:22 صباحاً (جرينتش)<br />بسم الله الرحمن الرحيم..... 2.5 مليون ليس عددالمؤيدين الذين يؤيدون منهج الاخوان المسلمين الذي هو الاعتصام بالاسلام ...عدد مؤيدي الاخوان المسلمين نحو سبعين مليونا في مصر وحدها اذا اعتبرنا ان الاطفال تبع لابائهم<br />9 - لا بديل عن الحرية و الديموقراطية<br />مصرى ضد الاخوان|21/04/2008 م، 09:27 صباحاً (السعودية) 06:27 صباحاً (جرينتش)<br />أن نهج الاخوان المسلمين قائم على اقامة الامارة الاخوانية كامارة طالبان فى افغانستان وبواسطة الجهاز العسكرى السرى الذى يمارس الارهاب والذراع الاخر هو الارهاب الفكرى عبر السيطرة على التعليم والترويج لافكار ومشايخ الاخوان ولذلك فنحن امام فكر استئصالى يسعى الى الهيمنة على شئون المجتمع وطرد الاخرين وهو ليس غريب على من يعرف هذه الجماعة الارهابية<br />10 - اللهم انصر الاسلام واعز المسلمين<br />alavocatoooooo|21/04/2008 م، 09:29 صباحاً (السعودية) 06:29 صباحاً (جرينتش)<br />لا ادرى سبباً واحداً عما يعانيه اصحاب المبادئ والقيم في هذا الزمان الاخوان المسلمين يطالبون بتطبيق شرع الله وهم اكثر المجتمع المصري تضرراً فمنهم المعتقلين بالالوف ولازالوا متمسكين بمبادءهم<br />11 - تحية للأسلامين في كل مكان<br />عين الصقر - اليمن |21/04/2008 م، 09:32 صباحاً (السعودية) 06:32 صباحاً (جرينتش)<br />الاسلام قادم والحكم الاسلامي قادم انشاءالله ، الشعوب العربية متعطشة لحكم اسلامي ،،،ولن يغير نظرتنا بعض الافكار او بعض الاشخاص الذين لا يريدون الحكم الاسلامي ولا ينظرون اليه الا على انه مانع للرقص وفارض للحجاب ،،،ولاينظرون الى ان الحكم الاسلامي حكم اذا طبق سيجعل الشعب يعيش في مستوى راقا من الامن والرقي الاجتماعي وفيه صلاح للدنيا والاخرة ،،،،،<br />12 - انا مبحبش الاخوان المسلمين<br />أحمد عبد القادر |21/04/2008 م، 09:40 صباحاً (السعودية) 06:40 صباحاً (جرينتش)<br />كلنا مسلمين وكلنا اخوان فى الله وممكن فى ناس عادية اكثر تدينا من اعضاء الجماعة بل وقد يكون فيه فاسدين داخل الجماعة كاى جماعة اخرى ليه يرفعوا راية الدين ويمنعهوها عن الاخرين<br />13 - اخوان المسلمين<br />السيد|21/04/2008 م، 09:42 صباحاً (السعودية) 06:42 صباحاً (جرينتش)<br />الأخوان ذادو أو نقصوا فهذا شىء يخصهم ويخص من يحاربهم أما مايخص الشعب أن يكون هناك حاكم يعدل وينظر الي الشعب غير الموجود حالياً والنظام السىء هذا<br />14 - الأخوان المظلمين احد اسباب البلاء<br />مفكر حر|21/04/2008 م، 09:54 صباحاً (السعودية) 06:54 صباحاً (جرينتش)<br />سبق ان قتلوا بأسم الدين، وهم الأصل بكتاباتهم التي تريد ارجاعنا الي العصور الوسطى، ومن تحت عباءتهم خرجت كل الجماعات الأرهابية.<br />15 - ماقيمة العدد<br />المهندس الفيلسوف|21/04/2008 م، 09:55 صباحاً (السعودية) 06:55 صباحاً (جرينتش)<br />لو سلمنا جدلا ان هذا الرقم صحيح ودقيق ...فان السؤال الذى يطرح نفسه فى عالم السياسة اليوم ماقيمة هذا السواد الاعظم من الاعضاء(ناهيك عن الأنصار والمتعاطفين والمؤيدين والمحبين....الخ ..بحسب تصنيفات الاخوان ) ماقيمة كل هؤلاء مالم يتم تحريك ولو ربعهم مع كل آزفة يمر بها الوطن وما أكثرها اليوم أو مع كل أزمة يمر بها الصف الاخوانى وتمر بها الجماعة وماأكثرها اليوم ايضا فمع العلم ان هؤلاء قد تم صياغتهم وتشكيلهم عقليا وفكريا على الارتهان لأمر القائد والانصياع له وفقا لمنظومة السمع والطاعة السائدة بالجماعة الا انه يبدو ان هناك تفاهما ضمنيا غير مباشرا يرتاح اليه الطرفين فيما بين الجماعة والاخوان ينص على (تسقيع )و (تثليج ) هذا الكم الهائل الى أجل غير مسمى ليستمتع كل طرف بلعبتة (سيزيف حاملا صخرته الشهيرة يحاول صعود الجبل والآلهة تنتظر سقوطه عند الاقتراب من الوصول...وهكذا)...وليستعذب الاخوان (اخوان مصر بالتحديد ) حماقات الحكومات المتعاقبة مديرين لهم الخد اليسر دوما ودونما طلب وبغير ثمن غير آبهين لابعامل زمنى أو بظرف دولى ..او كثرة انصار ولنبق اذن فى تلك الحبسة بضعا فبضعا فعشرات السنين....والشكوى لله<br />16 - اتقوا الله فى مصر<br />حسام _ مصرى|21/04/2008 م، 09:59 صباحاً (السعودية) 06:59 صباحاً (جرينتش)<br />الصراع بين السلطة و الاخوان ( ثعبان سام و ثعبان عاصر ) ضحيته الشعب . بس خلاص<br />17 - الإخوان أمل الأمة<br />مهندس مصري|21/04/2008 م، 10:02 صباحاً (السعودية) 07:02 صباحاً (جرينتش)<br />أعتقد أن الإخوان ثلاثة أضعاف هذا الرقم في مصر والمتعاطفين معهم حوالي 75% منالشعب المصري وهذا هو سر رعب النظام المصري منهم لقوتهم وعقلانيتهم وحب الشعب لهم لنظافة أيديهم وقلوبهم وحسن أخلاقهم وتصرفهم ولكل ذلك وغيره فهم أمل الأمة في كل مكان 00والله ينصرهم ويحفظهم 00اللهم آمين<br />18 - مشروع الإخوان فاشل ,لأنه ضد الدولة المدنية<br />مصري قبطي حتى النخاع|21/04/2008 م، 10:20 صباحاً (السعودية) 07:20 صباحاً (جرينتش)<br />الإخوان لا يقولون بالخلافة الإسلامية , ولكن من غباءهم يريدون مصر إسلامية إذا كان الحجاب فرض على المسلمة , فهل سيطالبون الأقباط بالحجاب أيضا وغيرها من معتقدات التضييق على الحرية , التي لا تؤمن بنوعية الأغاني التي يجب أن تسمع , وكأننا في إيران جديدة أو إنتقاد وحرية كتابة وتعبير رأي ويريدون حاكما مسلما فقط ولا يرضون بحاكم قبطي.. هم ضد الدولة المدنية ( حرية عدالة مساواة ) , التي تضمن حريات الأفراد واعتقاداتهم المختلفة يسقط الإخوان المسلمون الإرهابيين , وجماعتهم المحظورة<br />19 - يا علي الفيلي خليك على ربعك من الشيعة وبلاش تتدخل في السنة<br />هيفاء|21/04/2008 م، 10:23 صباحاً (السعودية) 07:23 صباحاً (جرينتش)<br />هزلت والله , . يا سيد علي لا يوجد من هو أكثر إبرازاً للعضلات من الشيعة الصفويين بدءاً من حسن حزب الله الصفوي وانتهاءً بنجاد الصفوي , بينما نجدهم يتعاملون سراً وعلانية مع الشيطان الأكبر الذي يشتمونه ليل نهار !!! عرفت الفرق الآن ؟<br />20 - الله اكبر ولكن اهم شي الفائدة<br />محسن الزهرى عبد المجيد |21/04/2008 م، 10:27 صباحاً (السعودية) 07:27 صباحاً (جرينتش)<br />الحمد لله كم يسعدني كتابات الاخ ضياء المحترم جدا الخلوق الملتزم واعتبرة مع ا / فهمى هويدي من أفضل الكتاب مع محمد حسنين هيكل والحمد ايا كان عدد عدد الاخوان ولكن ماذا عملوا خلال السنوات الطوال نعم صابرون نتمنى ان يطوروا العمل الدعوى والالتزام بالسنة الصحيحة وعدم الخنوع والخوف من النظام ولكن لا بد ان يثقوا فى انفسهم اكثر . هم كثيرون ولكن الجماعات الجهادية سحبت البساط منهم بالتحرك السريع والانشط ولولا الملاحقات الامنية لهم لكانوا اكثر عدد من الاخوان بالرغم الفترة الوجيزة من نشأتها مقارنة بالاخوان المنغلقين علي انفسهم مما اعطي النظام الفرصة للانقضاض عليهم وهم يعرفون انهم لم يردوا حتي لو طال يد النظام جميع مسئولي مكتب الارشاد وخاصة المرشد محمد مهدي عاكف .<br />21 - ربنا يزيدهم<br />صميدة .. الفيوم|21/04/2008 م، 10:33 صباحاً (السعودية) 07:33 صباحاً (جرينتش)<br />اعلم تمام العلم صدق نوايا المنتمين لهذه الجماعه (( المحظوظة )) المحظورة سابقا .. ولكن ماذا استفاد الشعب المصري من هذا العدد سواءا كان مليونين ونص او اكثر او اقل .. يا جماعه العبرة ليست بالعدد ولكن بالتاثير على الحكومة.... هناك انقلابات وحكومات تنهار بسبب اقل من نص مليون فرد .. هوه ده المطلوب.. المهم يبقى للاخوان سلطة على الحكومة .. مش كل يومين نازلين تعذيب وسجون وقلة ادب معاهم .. استفادوا ايه بالتنين مليون ونص .. ولا حاجة.. محليات وتمنعوا منها .. سجون ومعتقلات .. منع من الاشتراك في اتحادات الطلاب .. منعهم من تكوين حزب.. كفاية الحكم على نائب المرشد سبع سنين والكل يعلم بطلان الحكم وظلمه.. ازاي تبقى جماعه موجودة من اكتر من سبعين سنة وعددهم يفوق المليونين ونصف وغير قادرين على تكوين حزب.. لنا ولهم الله.. للتواصل someeeeda@hotmail.com<br />22 - الاخوان في مصر أكثر من ذلك بكثيير<br />المنوفي|21/04/2008 م، 10:35 صباحاً (السعودية) 07:35 صباحاً (جرينتش)<br />انا اكاد اجزم ان عدد الاخوان في مصر اكثر من الاثنين مليون ونصف بكثيررررررررررررررر<br />23 - الأخوان هم أمل الأمه<br />مصرى و افتخر|21/04/2008 م، 10:42 صباحاً (السعودية) 07:42 صباحاً (جرينتش)<br />لن ازيد على ما قاله الأج رقم 16 مهندس مصرى و أقول كل الشعب المصرى اخوان مسلمين ما عادا السلطه والجلاد<br />24 - أخوان الخراب<br />مصرى صميم|21/04/2008 م، 10:48 صباحاً (السعودية) 07:48 صباحاً (جرينتش)<br />أخوان الشؤم والخراب<br />25 - لا أظن<br />رمزي|21/04/2008 م، 11:04 صباحاً (السعودية) 08:04 صباحاً (جرينتش)<br />المتأسلمين عددهم ليس بقليل في مصر لكنهم ليس كلهم إخوانيين. إما لأنهم ليس لهم خلفية سياسية أو لأنهم لا يحبون الإخوان لسبب أو لآخر، أو لأنهم أجبن من ينضموا لتنظيم غير مرخص.<br />26 - الإخوان أمل مصر الوحيد<br />مصرى وأبويا مصرى|21/04/2008 م، 11:04 صباحاً (السعودية) 08:04 صباحاً (جرينتش)<br />أنا كمصرى أرى أن الإخوان هم الأمل الوحيد للشعب المصرى بعد الله تعالى طبعا .<br />27 - اكثر من هذا الرقم<br />ابو يوسف المصرى|21/04/2008 م، 11:15 صباحاً (السعودية) 08:15 صباحاً (جرينتش)<br />سنتناول الاصل والارتداد والانضمام -لم تذكر الدراسة نسبة الانضمام الجديدة من الاعضاء مع اعتبار ان نسبة الارتداد والخروج تكون 1% ونسبة انضمام اعضاء جدد 10%فيكون عددهم مليون عضوْْْ× متوسط 5 فرد لاسرة العضو يكون اجمالى الاعضاء باسرهم 5 مليون مواطن من جماعة الاخوان المسلمون.<br />28 - هذه ألأرقام ليست صحيحه<br />مسلم من فلسطين|21/04/2008 م، 11:16 صباحاً (السعودية) 08:16 صباحاً (جرينتش)<br />نحن كمسلمين موقنين أن هذه ألدراسه غير صحيحه لأنه على ألأقل هنالك 25 مليون شخص هم من ألأخوان ألذين وبمشيئة ألمولى عز وجل سيكنسوا هذا النظام ألفاسد, ولكن ألأخوان لا يفصحون عن ألعدد الصحيح لأنه أكثر بكثير والحمد لله.<br />29 - المصري المطحون<br />انا مصري وابوي مصري|21/04/2008 م، 11:19 صباحاً (السعودية) 08:19 صباحاً (جرينتش)<br />ذالك فضل الله يؤتية من يشاء انا لست من الاخوان المسلمين ولكني لا اري ان هناك في الساحة السياسية حزب معارض يذكر علي الاطلاق الا الاخوان اين المعارضة لقد اماتة حكومة الحزن الوطني حاجة اسمها معارضة في الشعب المصري وانستنا ان نعلم انا في حاجة اسمها سياسة فالحزب الحاكم هو الموجود والمسيطر علي كافة امور البلد والاعلام المصر لا يعمل الالمصحة الحزب انا لله وانا اليه راجعون لك الله ياشعب مصر المطحون وكان الله في عون الخون اللهم ولي امورنا خيارنا ولا تولي امورنا شرارنا اللهم لا تأخذنا بما فعل السفهاء منا اللهم ارزقنا بحاكم عادل يخاف الله فينا اللهم اصلح الراعي والرعية ياااااااااارب العالمين اميييييييييييييييين"
