posted = "2008-04-21"
text = "ايه يا اخونا انت واخدين الخبر من العربيه بدون الاشارة للمصدر<br />وكمان اامعلق الذكى الاول سارق التعليقات زى ما هيه<br />طيب ما تغير لوجو الموقع من عشرينات الى سرقات<br />صحافه اخر زمن"
