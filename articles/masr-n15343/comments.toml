subject = "ضع عنوان التعليق"
author = "بدوى"
posted = "2008-04-21"
text = "تعرفوا ايه اكبر مشكلة ........................<br />اننا كلنا اشتغلنا قضاة وحكاما على الاخوان وغيرهم من القوى الاخرى...............<br />ونحن لا نفعل اى شىء سوى الفرجة.......<br />لماذا كل واحد من المعلقين لا يقول ماذا فعل هو للبلد<br />وساعتها ساحترم اى شىء يقوله وايا كانت اتجاهاته.........<br />بس الا الا الفرجة..........."
archived = "2008-04-24"
