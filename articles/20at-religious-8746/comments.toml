author = "نذير عزوز"
posted = "2008-08-04"
text = "دور الإشهار في التشغيل<br />لماذا يفتح صاحب مؤسسة مواطن شغل جديدة إذا لم يرى النمو في رقم معاملاته؟ يجب الإجابة على هذا السؤال قبل أن نعتزم حل قضية تشغيل أصحاب الشهائد العليا. ولعل الإجابة عليه تكمن في طرح فكرة العلاقة بين توفير ما يتطلبه السوق من يد عاملة ونمو الشركات الإقتصادية. أما الإستنتاج الذي يتقدم مبدئيا أمامنا هو أنه لا يمكن لصاحب المؤسسة أن يفتح مواطن شغل جديدة إلا بالوتيرة التي تفرضه له السوق الإقتصادية المحلية و/أو الخارجية حسب القاعدة التالية: \"انتعش الإستهلاك زاد الطلب على اليد العاملة\" مع العلم أنه لا يمكن لعدد فرص تشغيل أصحاب الشهائد العليا أن تفوق عدد خريجي الجامعات، ولا يمكن أيضا للشركات المنتصبة أن تمتص كل خريجي الجامعات إلا ما فيه كفاية تطلبات الإستهلاك وهو ما يثمن العلاقة المتينة بين الإستهلاك واليد العاملة وهما مرتبطان في توازن يجب إحترامه والإحتفاظ عليه. الاستهلاك هي اذن الركيزة الرئيسية للاستجواب على ملف تشغيل أصحاب الشهائد العليا.<br />البنى الأساسية للإقتصاد العصري لا تكفي وحدها لإستيعاب الوتيرة المتخرجة من الجامعات ولا بدا أن نتفطن بالدور الذي يلعبه الإشهار في دواليب الإقتصاد. ومقارنة بالبلدان الغربية منذ سنوات أنشأت في معظم أنحاء العالم مساحات خاصة وعمومية متخصصة في الإشهار والبيوعات المختلفة مستعينة بالدور الأساسي التي تلعبه الإذاعات والفضائيات والجرائد في نشر ثقافة الإستهلاك. ونرى في هذه البلدان جرائد ومجلات تخصص جل صفحاتها للمستشهرين تصل حتى الى أن تباع بلا مقابل... واليوم وبعد مضي سنوات على هذه التجربة إعتبر الإشهار عنصرا أساسيا في شرايين الإقتصاد.<br />لماذا كل هذه الطرقات العريضة للشاحنات ولماذا كل هذه الإجراءات الجديدة لغاية تيسير العمليات المالية والإدارية ولماذا كل هذه الكليات والمدارس العليا... لماذا كل هذه الإنجازات إذا لا تتمكن الشركات من ترويج سلعها أو تشهير بمنتوجاتها أو تجارتها؟ هل يكفي احداث بنية أساسية قوية للتغلب على أزمة التشغيل؟ لا، إنه غير كاف. لإن شوط الإنجازات الكبرى كسبناه ولا أحد يمكن أن يشكك فيه. وعلينا أن نحسب ما سينجر عنه وعن مخلفاته ومخاطره في احتكار سوق الإشهار مثلا. ولا يمكن الحديث عن التشغيل دون التعرض على واقعنا الإقتصادي ، والإشهار يحظى بالدور الأساسي في الدورة الإقتصادية.<br />والملاحظ يمكنه أن يعدد بسهولة المؤسسات المستشهرة في بلدنا وينحصر عددها في رقم ضئيل. إنها المدعمة الأساسية لوسائل الإعلام الوطنية سيما أنها تقدرعلى دفع معاليم الإشهار في الإبان وبأسعار خيالية. ولقد كانت تنشر الومضات بصفة عشوائية حسبما يراها أصحابها من زاوتهم متسمكين بإحصائية أفرزتها داخليا العملة أو حسب حساسيات خاصة بسياسة المؤسسة وخاصة دون التعمد على دراسة علمية. أما عندما حلت قناة \"حنبعل\" اكتشف الجميع أن المشاهد التونسي له دوره في الساحة الإشهارية وتأكدت دعمه لهذه الماركات بمجرد استخدام زر التيليكوماند. وما قامت به قناة \"حنبعل\" في حملتها الشهيرة ضد هؤلاء أصحاب الشركات وبعض وسائل الإعلام إلا لتسليط الأضواء على آلية لم تكن في حسبان المتصرفين في ثروات المستشهرين. وانتصرت إدارة قناة \"حنبعل\" وتحصلت على برمجة دورية للومضات في شبكتها. لكن من هم مستشهري قناة حنبعل؟ إنهم نفس الذين كانوا يشترون الومضات الإشهارية على القنوات الكلاسيكية. ولم تأت هذه الحملة بالجديد إلا لصاحب القناة وانتعشت من فوائد الحملة ولم نرى منها الجديد والسؤال الذي نطرحه في هذا السياق هو هل دخل ضمن الدائرة الضيقة لرجال الأعمال أصاحب مشاريع بنك التضامن مثلا؟ والجواب لا. هل يمكنهم الدخول في هذا العالم الضيق؟ لا. فأين إذن تستشهر المؤسسات الصغرى؟ وكيف يمكن لصاحب مؤسسة صغيرة أن يعرف بمنتوجه للتونسيين؟ الجواب: لو إنطلق شاب صاحب مشروع في هذه المغامرة لفشل قبل أن يبدأ. ويمكن ذكر أن القليل ممن تارة لبى هذا المفروض سرعان ما اضمحل من الساحة. السبب: ليس في مقدور المقروض تمويل حملة إشهارية لأن البنوك الممولة لا تحسب ولا تؤمن بتاتا بهذه الآلية الإقتصادية: الإشهار، حتى ولو وصلت في ملف دراسة الجدوى... والداء يبدأ من هنا. أما في المقابل فإننا نجد عديد من الامثلة لمستثمرين شبان أفلسوا لا لأن مشاريعهم فاشلة لكن من أجل سوء ترويج المنتوج وعدم تشهير بالماركة وبطبيعة الحال اللجوء إلى المنافسة الغير الشريفة... والأمثلة متعددة.<br />هذا سبب رئيسي والبحث في شأنه سيعالج السرعة للعجلة الإقتصادية حتى ينتعش إستهلاكنا ويتزايد الطلب على اليد العاملة.<br />نذير عزوز"
