subject = "لتحسين آستعاب خريجي الجامعات"
author = "حسن خليفي (مقيم بدبي)"
posted = "2008-07-06"
text = "أطرح هنا فكرة جديدة أعتقد أنها عملية تساعد أكثر في تشغيل الأعداد المتزايدة من خريجي الجامعات. فأعتقد أنه إلى جانب نظام cvp الخاص بإدماج الخريجين الجامعيين الجدد في المؤسسات و الحياة المهنية , و هي و لا شك مبادرة متميزة من لدن سيادة الرئيس , و أتوجه هنا بالشكر لسيادته و كل الإطارات الساهرة على تفعيل هذا المشروع بإعتباري مستفيد من هذا النظام . و بإعتبار تجربتي أريد هنا أن أطرح فكرة قصد تطوير هذا النظام المتميز ز فلمزيد من النجاعة و لإدماج فعال أكثر لكل أصحاب الشهادات الجامعية في الحياة المهنية و لتفادي \" إزدراء\" بعض المؤسسات لهؤلاء بتعلة أنهم لا يحملون خبرة و لا يمكن التعويل عليهم في أغلب الحالات فإني أرى لو أمكن إيجاد فضاء صناعي إقتصادي جديد أو بديل خاص فقط بإستعاب هؤلاء حيث يكونون تحت إشراف كوادر مهنية و جامعية متمرسة لتأطير و تدريب أكثر نجاعة . و يمكن أن تكون هذه الموسسات أو الشركات أو المصانع مرافق منتجة مدمجة في الدورة الإقتصادية للبلاد و ليست للتدريب فقط . و يمكن ربط هذه المنظومة الإقتصادية الجديدة في ما بينها حيث تكمل بعضها بعضا من مؤسسات إنتاج مترابطة إلى مؤسسات تسيير و تسويق إلى مؤسسات مالية بنكية بحيث تستوعب مختلف أصناف الخريجين بشتى الإختصاصات . و يمكن لهذا المشروع أن يزيل العديد من العراقيل منها ما سبق الإشارة إليه في كيفية إدماج أعداد أكثر بل يمكن أن يحل مشكل تشغيل هؤلاء بنسبة مئة بالمئة و هذا بالإضافة لتخريج جيل مهني ذو كفاءة وخبرة عالية جدا تظاهي أو تفوق البلدان المتقدمة . و رغم عدم علمي إن كانت مثل هذه الأفكار طرحت و طبقت في بلدان أخرى أم لا فإني أعتقد بأنه مشروع عملي ممكن التطبيق و ذو مردودية فائقة هذا بالإضافة لإزالة العبئ المادي الذي تدفعه الدولة شهريا لإدماج هؤلاء حيث يمكن بإنتاجهم الموجه لفائدة حاجيات الدولة يغطون هذه المصاريف و أرجو أن ينظر لهذا الطرح و يدرس بجدية و يبقى سديد النظر للسادة الإطارات المسؤولين أهل الإختصاص . و لمن يريد مناقشة هذا الطرح معي في منتدى الحوار الشبابي هذا فهذا بريدي الإلكتروني للجميع ( hassan-khelifi@hotmail.com )"
