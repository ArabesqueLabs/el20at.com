subject = "شعارات"
author = "سيرانة"
text = "هلأ عرب اسرائيل اشتكو انو ما في لافتات بالعربي؟؟؟<br />اي ما المدن العربية اللي ما بدخلها يهود هناك بيكونو حاطين فيها لافتات بالعربي<br />وفي منهم بيحكي عبري اكتر من العربي وهاد حال الغالبية والباقي نص كلامه عبري<br />عرب اسرائيل بيعانو من استعمار ثقافي مزمن"
archived = "2010-03-14"
