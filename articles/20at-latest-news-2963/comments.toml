posted = "2009-01-01"
text = "ياريت ياجماعه نتعلم من السيايه دي يعني دول بيحاولا يكسبوا تعاطف العالم كله وحتى تعاطف المسلمين انفسهم وده بيرجعنا للجزار اللي بيعرض المياه على العجل قبل ما يندبح وبيفكرنا بالعصا والجزرة دول صهاينه بيكسبوا تعاطف العالم مهاعهم لانهم من الاخر شحاتين .. شحاتين المشاعر وبرضو فاشلين"
