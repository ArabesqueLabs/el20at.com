subject = "ضع عنوان التعليق"
author = "مسلمة"
text = "السلام عليم بداية نحن لسنا عرب اسرائيل نحن فلسطينيون وموجودون قبل قيام هذه الدولة اما عن هذا المصلي نحن بدورنا كمسلمون نشكرهم ولكن هذا لن يحد او يقلل من العنصرية والتمييز التي نعامل بها كوننا عرب وخاصة كوننا مسلمين . بناء المصلى لن يسد مكان المساجد والجوامع التي هدمت ودنست ولا زالت تدنس حتى يومنا هذا"
archived = "2010-03-14"
