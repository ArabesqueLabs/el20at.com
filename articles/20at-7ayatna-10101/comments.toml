author = "للعلم والزمن حيطووووووووووول ("
posted = "2008-09-21"
text = "لعلمكو يا أخوان ده الملقب بعاشق فلسطين أخز تعليق الواد محمد نواف وقام شايلو وحاطو هينا بالموضوع ده !<br />شوفوا يا أخوان الحقارة والدنائة وصلت لفين ؟!!!!؟؟!<br />ايه ده ، ده والله زمن العجاااااااااايب ! يارب استر علينا !!<br />ياالله ما أوقحك وأغباك ياض انتا بتحسب نفسك مالك الدنيا ياااااض ــ متفوق على نفسك شوية كده يعني<br />عاملك ترشد وتوجه ايه يبني فاكر نفسك ايه ــيخرب بيت ميتيتن اهلك يمقرف !<br />ومعلش يا محمد انتا متعرفنيش ولكن انا اعرفك كويس أنتا واحد محترم ولكن كل واحد احياناً بخطأ وانت أخطأت واعتذرت للجميع والظاهر المحترم عاشق القذارة مش عاوز يفهم اهو هو ه حر كده<br />وسلام"
