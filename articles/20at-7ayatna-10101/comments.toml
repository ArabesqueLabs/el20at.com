subject = "إحنا وين ؟؟ والرواتب ويننننن ؟؟"
author = "محمد نواف"
posted = "2008-09-20"
text = "يعني الناس بطلت تفكر إلاّ بالأكل وتعبي بطونها .. ياناس .. ياعالم .. اصحوووووووووووووووا ؟<br />وبعدين إحنا مش مخالفين معاهم على قضيتة الرواتب بس الأولوية لازم يكون إلها مكان بحياتنا ..<br />والأشياء والأمور المهمة والضرورية بحياتنا لازم نخلص منها أول بأول .. مش نحط الأشياء والأمور التافه السخيفة اللي ملهاش معنى بحياتنا في سلم أولوياتنا ...<br />كلمة أخيرة ،،، الله يعين أصحاب العقول السليمة .. ويانيالهم !!! أصحاب العقول \\\" المأجرة الطابق الفوقاني \\\" يعني العراقية المجانين<br />ياعمي في عالم ثاني هذووووووووووووووله ... آآآآآآآآآآآآخ آآخ منهم .. آخ زمن أغــــــــــــــــــــبر !"
