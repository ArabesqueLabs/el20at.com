posted = "2007-04-10"
text = "ياريت يكون فيه وحده كده زى اللى فى الموضوع يعنى يتم تجميع الوطن العربى كله مش بس فى الموضوعات لكن فى كل شئ عشان ننصر العراق وانا عنى يومها مش حزنت بس انا بصراحه من الصدمه ضحكت على المنظر ازاى الامريكان يدخلوا ومفيش مقاومه هم يبكى وهم يضحك الناس يومها راحوا فين ولا منظر الناس وهى بتسرق بصراحه الموضوع فى شئ مش صح يعنى محدش هيسيب بلده من غير مقاومه لو واحد ولا الف خاينين الباقى لا"
