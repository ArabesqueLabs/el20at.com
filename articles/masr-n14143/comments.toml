[[comments]]
order = 0
subject = "مبروك لمصر"
posted = "2007-11-19"
text = "استدعاء ضابط و3 مخبرين عذبوا مواطنا بقسم أبو النمرس وأصابوه بشلل<br />19/11/2007<br />الوفد - كتب ـ عادل الملاح: أمرت نيابة مركز الجيزة باستدعاء ضابط قسم شرطة أبو النمرس و3 مخبرين بالقسم لسماع أقوالهم في البلاغ المقدم ضدهم في واقعة الاعتداء علي الطالب عمرو السيد علي سالم »27 سنة« والتسبب في إصابته بإعياء شديد وشلل كامل في النصف الأيمن من جسده. كان شقيق المجني عليه قد تقدم ببلاغ الي المستشار حمادة الصاوي المحامي العام الأول لنيابات شمال الجيزة اتهم فيه ضابط قسم شرطة أبو النمرس »النوبتجي« وثلاثة آخرين<br />من قوة القسم بالاعتداء بالضرب علي شقيقه داخل القسم بعد القبض عليه داخل احدي الكافيتريات بمنطقة شبرامنت أثناء جلوسه بصحبة خطيبته.<br />وأنه تم احتجازه داخل القسم لمدة يومين دون وجه حق والاعتداء عليه في مختلف أنحاء جسده.. مما أسفر عن إصابته بغيبوبة تامة ونقله الي مستشفي القصر العيني في حالة خطيرة.. ومن المنتظر أن تستمع النيابة خلال الساعات القادمة الي أقوال الضابط والقوة المرافقة له لحظة القبض علي المجني عليه في الاتهام الموجه إليهم بالتعذيب."
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

[[comments]]
order = 1
subject = "وطني ولو شغلت بالكوره عنه ........................... حيتسرق"
author = "مواطن اهبل وعبيط"
text = "وطني لو شُغلت بالكورة عنه... نازعتني إليه بالكورة نفسي<br />يلا كده يا شطار خليكوا كده العبوا كوره واحمد الهواري ينقلكم اخر اخبار الكورة لحد ما تلاقوا نفسهم زي ركاب العبارة بتنطوا في الميه<br />وطني لو شُغلت بالخُلدِ عنه... نازعتني إليه بالخُلدِ نفسي<br />شد حيلك معانا يا استاذ احمد الهواري في نقل اخبار الكورة للشعب المصري الاهبل العبيط"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

[[comments]]
order = 2
subject = "بصو في الصورة كويس"
author = "الشعب الاهبل العبيط"
text = "العيال فرحانين اوي اوي حيقطعوا نفسهم من الفرحة<br />اصلهم جابوا جون لمصر<br />مش عارفين كام الف جون جه في مصر ومن لعيبة مصريين كمان"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

[[comments]]
order = 3
subject = "مصر في النهائي... هانت يا رجاله"
author = "مواطن اهبل ومغفل"
text = "ايوه يا جماعة مصر في النهائي خلاص زي العراق ايام صدام كانت في النهائي برضه<br />هانت يا رجاله يعني فاضل حاجه بسيطة<br />ولا هانت عليكم مصر يا رجاله تسبوها تغرق زي العبارة"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

[[comments]]
order = 4
subject = "الى احمد الهواري"
text = "عايزين نعرف البطولة دي اتكلفت كام من اول معسكر التدريب لحد ما الرجاله جيرجعوا بالكاس لمصر<br />الكاس اللي يحنشرب منه كلنا نحن المصريين<br />زي العراقيين والفلسطينيين والافغان"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

