[[comments]]
order = 12
subject = "كاس المحبة"
author = "_ _"
text = "يا فرحة العيال بالكاس<br />لما الكاس هييجى - وكل لعيب هاياخد مليون جنية على حسب الوعد اللى من فوق<br />هنحط الكاس مكان تمثال الحاج رمسيس فى ميدان باب الحديد<br />وهنبطل نقف طوابير قدام الافران علشان الرغيف<br />تصدقوا باللة غزة احسن مننا ميت مرة<br />شوفوا شوارعها النظيفة وبنايتها البيضة الجميلة والخضرة اللى فى الشوارع وروحوا شوفوا العشوائيات بتاعتنا"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"
