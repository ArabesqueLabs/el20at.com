[[comments]]
order = 6
subject = "افرحوا بقى"
author = "محمد عامر"
text = "يعنى هو انو مبتعرفوش تفرحوا ابدا على طول فى غم وهق وشتيمه فى البلد .ولا احنا الشعب الوحيد اللى بيلعب ويتفرج على كوره دى هى الحاجه الوحيده اللى بتفرح الناس دالوقتى , هاتولى دوله مش بتلعب كوره , ياتكم غم وانتوا عالم معقده ,,,,<br />مبروك ياجماعه للمنتخب وان شاء الله هنرجع بالكاس ونفرح الشعب كله وكفايه علينا اننا نفرح الناس الغلابه اللى مش بيفرحوا الا بالكوره’.........سلام"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

[[comments]]
order = 7
subject = "نفرح ازاي يا محمد عامر"
author = "مواطن عرص"
text = "نفرح ازاي اذا كان فيه خبر في نفس الموقع ان فيه بيت اتهد على دماغ اصحابه وطبعا السكان راحوا في ستين داهية والدولة مش حتديهم ولا مليم<br />نفرح ازاي واهلها نايمين في المقابر وفي الشوارع"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

[[comments]]
order = 8
subject = "ليهم حق الاقباط يقرفوا مننا"
author = "مصري فاشل"
text = "ليهم حق الاقباط يقرفوا مننا ويستعدوا علينا الدول الاجنبية<br />لاننا فعلا امة في الحضيض<br />امة بتصرف فلوسها على الكورة واللعيبة وسايبه البيةت تتهد على دماغ اصحابها"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

[[comments]]
order = 9
subject = "مليون هدية يابو تريكة"
text = "وبنحبك يابو تريكة<br />يابو رجل تعزف مزيكا<br />أثبت للدنيا بحالها<br />إن الإيمان أحلى ما فيكا<br />آدي الشباب الرباني<br />ما تلاقي زيه في بنفيكا<br />أمل بسيط من وسطينا<br />تمسح تعبنا بأستيكة<br />ترسم على وشوشنا البسمة<br />رجليك تغني على السيك<br />قصة نجاح موش بالساهل<br />والله دانتا بتستاهل<br />مليون هدية يابو تريكة"
archived = "2008-02-11"
capture_url = "https://web.archive.org/web/20080211113424/http://masr.20at.com:80/newArticle.php?sid=14143"

