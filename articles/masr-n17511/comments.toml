[[comments]]
order = 0
subject = "جماعة المقسطين دى حزب وطنى والا من الجماعة المحظور"
author = "شايف"
posted = "2008-09-08"
text = "وبعدين بتوع امن الدولة هيروحوا لهم الفجر<br />انتم بتعملوا خير - يبقى نهار ابوكم اسود<br />يا عم انت بمقالك دة بتقفل وجوة الخير فى وش الناس الغلابة<br />صدقونى هيستجوبوهم وهيحجزوهم<br />لية الاذية دى"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911231818/http://masr.20at.com:80/newArticle.php?sid=17511"

[[comments]]
order = 1
subject = "الجماعة محظورة لان الحزب واطي وليس وطني"
author = "ممدوح ذكي زخاري جرجس يعقوب ـ ا"
posted = "2008-09-08"
text = "الى الاخ اللي فوق بتاع الجماعة المحضورة والحزب وطني<br />الجماعة محظورة لان الحزب واطي وليس وطني<br />وبعدين جماعة محضورة وتحتل خمس مقاعد البرلمان<br />يا خراشي يا جدعان"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911231818/http://masr.20at.com:80/newArticle.php?sid=17511"

[[comments]]
order = 2
subject = "اللهم زد وبارك فيما يقربنا إليك"
author = "متطوعة بس شنط رمضان"
posted = "2008-09-08"
text = "السلام عليكم ورحمه الله وبركاته<br />ربنا يبارك فى كل من يفكر فى تنويع الأنشطة الخيرية ربنا يبارك فيهم<br />آآآآآآآآآآآآآآآآآآآآآآآآآآمين"
archived = "2008-09-11"
capture_url = "https://web.archive.org/web/20080911231818/http://masr.20at.com:80/newArticle.php?sid=17511"

