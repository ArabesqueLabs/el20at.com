author = "محمد التهامي"
text = "بجد أنتى إنسانة جميلة و موهبة ... انا قرأت لك ثلاث حوارات في ثلاث اماكن ..عجبنى جدا أفكارك<br />و حاسس اننا في يوم هتخرجى فيلم انا كاتبه<br />ياريت تحطي صور تانية غير دي لانى شوفتها 3 مرات<br />http://nohamy.blogspot.com/"
