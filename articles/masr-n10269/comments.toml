order = 0
subject = "ربنا معاكواااااااااااااااااا"
author = "منار"
posted = "2007-05-17"
text = "ربنا يوفقك يا هوبا ياقمر انتى بجد انا اتنبألك بحياة فنية هادئه بس وحياة دينك ما تتنازلي عن حاجات احنا عارفنها فى الوسط كله بتحصل واوعي تقبلى اى تنازل حتى ولو كان هيوصلك للاوسكار لان سمعة الفنانات انتى عارفاها كويس وانشاء الله المره الجاية نشوفك في غلاف اخبار النجوم وانتى محظوظه على فكرة انك عملتى حوار فى الموقع اللذيذ ده لان جميع من يعملون به تقريبا في مثل سنك ورغم صغر سنهم الا انهم استطاعوا ان يعملوا من الموقع شيء هادف ربنا يوفقك ويوفقهم جميعا"
archived = "2007-05-24"
capture_url = "https://web.archive.org/web/20070524034024/http://masr.20at.com:80/newArticle.php?sid=10269"

