[[comments]]
order = 0
subject = "انت هبله ولا ايه؟"
author = "نفسي افهم"
posted = "2008-05-19"
text = "انت هبلة ياحاجة ولا شكلك كده؟<br />انا مفهمتش ولا كلمة ولا عارف انت كتبتي ايه من اصله على فكرة واضح انك غاوية عقد وبتكتبي عشان تشلي الناس وتخليهم يحلفوا 100 يمين ما يخشوا الموقع ده تاني وواضح انك واصلة جوة المكان عشان كلام هايف كده ياخد مساحة<br />ياريت ترحمونا ياعشرينات من امثال الاخت وتحترموا عقولنا"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090705/http://masr.20at.com:80/newArticle.php?sid=15867"

[[comments]]
order = 1
subject = "الى المعلقة السابقة"
author = "ابومحسن"
posted = "2008-05-20"
text = "تعليقك ذكرني باحد صفوف الدراسة الثانوية وتحديدا في حصة العربي في مادة الادب وكان الحديث عن طه حسين وعباس محمود العقاد طه حسين كان ناقد ادبي فمره انتقد عباس العقاد في انه يكتب بلغة صعبه وغير مفهومة فرد عليه عباس العقاد وقال له انا لا اكتب لاي احد انا اكتب للخاصة من الناس فضحك طه حسين وقال له يبدو انني لست من الخاصة من الناس الذين تكتب اليهم يا استاذ عباس.<br />كذلك يا اختي<br />منى سليم لا تكتب لاي احد<br />منى سليم تكتب للخاصة من الناس"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090705/http://masr.20at.com:80/newArticle.php?sid=15867"

[[comments]]
order = 2
subject = "امال فين صورتك يا منى سليم انتي وحشة ولا ايه"
author = "مش بحبك"
posted = "2008-05-20"
text = "ازيك يا منى<br />احنا اتعدونا في هذه الزاوية ان المحرر ينزل صورته<br />امال فين صورتك<br />انتي وحشه ولا ايه<br />ما هو مفيش غير كده"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090705/http://masr.20at.com:80/newArticle.php?sid=15867"

[[comments]]
order = 3
subject = "خاصة ابقى قابلين"
author = "سمير حسن"
posted = "2008-05-20"
text = "لصاحب تعليق الخاصة والكلام الكبير ده واضح انك تعرفها او صاحبها او زميلها ويمكن واحد من عشرينات بيدافع عنها وخلاص والله موضوع الخاصة ده حجة البليد اصلنا مش بنقرا اخبار الادب ولا وجهات نظر عشان تقول لي الخاصة والعامة والله اللي اعرفه ان فيه اسس للكتابة في المكان ولو هي مش فاهماها ترحمنا وترحم نفسها ولو ان رايي انها بتتفلسف وهي غبية جدا لان حتى الذي يكتب للخاصة يكتب بطريقة ممتعة وهو مالم اجده في كتاباتها ابدا انا احب زاوية الراي هذه جدا وهذا اسوا ما قرات فيها"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090705/http://masr.20at.com:80/newArticle.php?sid=15867"
