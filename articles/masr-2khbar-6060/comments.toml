order = 1
subject = "مبقولش كلام و خلاص .. الاهلى حديد و رصاص"
author = "محمد ممتاز - بيبو"
posted = "2007-05-29"
text = "وسط اجواء دافئة بزيورخ بسويسرا .اجريت قرعة دورى الابطال الافريقى و التى اسفرت عن وقوع الاهلى القاهرى المصرى فى مجموعة نارية تضم اسيك ميموزا العاجى و الترجى التونسى و الهلال السودانى و هى مجموعة الموت بكل المقاييس حيث لم يستطيع الاهلى القاهرى المصرى الفوز على هذه الفرق طوال ال6 سنوات الماضية على ارضها و وسط جمهورها ، فى عام 2001 تقابل الاهلى مع اسيك ميموزا الايفوارى و هزم بهدف من ضربة جزاء مشكوك فى صحتها بعد ان اعادهل الحكم المهزوز مرة اخرى لاصطادمها بالعارضة و فى العام الماضى و فى الدور قبل النهائى هزم الاهلى ايضا امام اسيك بهدفين لهدف بعد ان حول تاخره بهدف لانجولى الرهيب فلافيو الى فوز مستحق اما الترجى على ملعبه العظيم المنزه فقد تعادل الاهلى معه 1-1 عام 2001 قبل ان يصل الى المحطة الاخيرة امام صن داونز و ياتى باللقب الثالث فى تاريخه و لم يسبق فى مواجهات الاهلى امام الترجى التونسى خلال 4 مواجهات ان فاز احدى الفريقين فكلها انتهت بالتعادل السلبى. و نفس الحال امام الهلال السودانى الذى اخرج الاهلى من دورى ابطال افريقيا 2004 من الدور الاول عندمه هزمه فى القاهرة بهدف للاشى و ذهب الاهلى للخرطوم ليواجه فخ التعادل و يخرج مبكرا من البطولة و قد سبق ان واجه الاهلى فريق الهلال السودانى عام 2001 فى دور ال16 و صعد الاهلى بالهدف الاعتبارى عندما فاز فى القاهرة 2-0 و خسر لقاء العودة 1-3 ..اى ان الاهلى يواجه صعوبة بالغة فى الفوز على هذه الفرق على ملعبها بل ان هذه الفرق عنيدة جدا خارج ملعبها و الانتصار عليها يأتى بشق الانفس. و على الرغم من ان الترجى التونسى يمتلك خط هجوم قوى سجل 15 هدفا حتى الان الى ان رئيس نادى الترجى التوسنى خرج الى الجميع بتصريح يحذر من خطورة الاهلى القاهرى المصرى متمنيا الا ياتى مع الاهلى فى مجموعة واحده حيث سيكون التنافس فقط على البطاقة الثانية لان الاهلى سيحجز الاولى مبكرا و عقب القرعة قال انه كابوس ان ناتى مع حامل اللقب .. المجموعة هى الاصعب على الاهلى فى تاريخه فنتائج اسيك و الهلال و الترجى مشرفة للغاية و لم يهزم الا الهلال السودانى فقط 0-3 امام ناساروا يونايتد قبل ان يعيد الكفة لصالحه فى الخرطوم ليفوز 3-0 و يصعد لدور ال8 لاول مرة فى تاريخه و فريق الهلال لم يهزم على ارضه محليا او قاريا خلال عامان ماضييان و لن ينسى الجميع ان الاهلى مطالب بمحو الذكرى الشيئة للقاء الهلال مع الزمالك فى القهارة و الخرطوم ..و لن انتبه قط الى المجموعة الثانية التى تضم على رأسها النجم الساحلى و شبيبة القبائل الجزائرى و الجيش الملكى المغربى والاتحاد الليبى ( مجموعة عربية خالصة ) لان اجراء القرعة فى سويسرا للمرة الاولى و خروجها بهذا الشكل امر يستحق الدراسة لوجود شك كبير فى طريقة اجراء القرعة .. حسام البدرى المدرب العام لاهلى اعلن ان القرعة اصعب مما يتوقع البعض. افضل ما فى البطولة حتى الان ان بنسبة 95 سيكون النهائى عربى خالص للمرة الثالثة على التوالى و نتمنى التتويج للاهلى فى القاهرة و سيكون النهائى فى القاهرة فى حالة وصول الاهلى كأول مجموعة .."
