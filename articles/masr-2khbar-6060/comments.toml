subject = "الكومي"
author = "أحمد المصري"
posted = "2007-05-28"
text = "خلينا نشوف فريق السمبا هيعمل إية في أفريقيا و توالي المباريات و نفسي أشوف الكومي هيقول إيه لما لعيبته يجيبوا زيت.<br />الكومي أبو صباع كفتة هو المرشح الأول لدور الدوبلير بدل مرتضى منصور و هيخرب الإسماعيلي زي ما مرتضي خرب الزمالك.<br />المشكلة إن الإسمعلاوية بعد العثمانيين مفيهومش حد عاقل زي ممدوح عباس يلم الخيبة.<br />مبروك للأهلي الدوري<br />مبروك للزمالك الثاني و المشاركة في أفريقيا<br />و مبرول للبراطيش بطولة الأهلي (بإعتبار الفوز على الأهلي بطولة خاصة عند الفرق التعبانة زى براطيش الكرة المصرية)"
