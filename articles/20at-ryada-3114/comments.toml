[[comments]]
order = 16
subject = "غير لائق بكرامتها"
author = "الدحداح"
posted = "2007-02-01"
text = "أرى أن خروج المرأة السعودية ـ إن صح وثبت أنها سعودية ـ غير لائق بمكانتها.<br />فهي أكرم وأنبل أن تزجّ بحيائها وحشمتها وعفافها وتتصدر الملاعب الرياضية<br />بالاختلاط المكشوف.<br />المرأة لها هواياتها واهتماماتها اللائقة بخصوصيتها.<br />ليس صحيحاً أن ننطلق في قضايا المرأة من منطلقين خاطئين:<br />الأول: ليه إيش الفرق بين الذكر والأنثى… فمن لم يعرف الفرق بينهما فهو من أجهل الناس بالبدهيات.<br />والثاني: ليه المرأة السعودية ما تكون زي غيرها من نساء العالم … الصواب أن نقول: ليه من تكون المرأة العالمية مثل المرأة السعودية، فإنها معززة مكرمة مكفولة مخدومة أميرة في بيتها ومجتمعها. وهل الرجال يجدون مثل الامتيازات التي تحصلها المرأة السعودية.<br />فنرجوكم يا إخوة ويا أخوات يا كرام أن تعالجوا أمر فساد وانحراف المرأة في العالم، واتركوا المرأة السعودية في حالها، فما أسعدها في بلدها!!<br />ومن كان مُزايداً عليها، فليبدأ بتحرير أمه وأخته وزوجته وابنته مما يريد وإلى ما يريد وليترك بنات الناس في حالهم.<br />ومن كانت لا تحب العيش في مجتمع الحشمة والعفة والنظافة و… فلتختر بلداً آخر لتعيش فيه ، فلتعبر عن حريتها بالطريقة التي تحلو لها، ولتدفع ثمن هذه الحرية المزيفة.<br />شكراً"
archived = "2010-03-14"
capture_url = ""

