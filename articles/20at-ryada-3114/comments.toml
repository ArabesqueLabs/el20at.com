subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2009-01-21"
text = "بسم الله ارحمن الرحيم<br />السلام عليكم<br />أخواني المسلنين ........ المسلم عنده غيره على المسلمات<br />لاكن تبي تنفعك سوان كنت سعودي والا كويتي والا غيره من الدول العربيه والاجنبيه عند الله سبحانه وتعالى يوم القيامه<br />يقول الرسول صلى الله عليه وسلم:::<br />((((( لا فرق بين عربي او اعجمي الا بتقوا ))) حنا مسلمين لازم نكون يد وحده على عدون<br />ويقول الرسول صلى الله عليه وسلم ::<br />((((من راء منكم منكر فاليقيره بيده فان لم يستطع فبلسانه فان لم يستطع فبقلبه فهذ اضعف الايمان ))))<br />انت وانا وكل مسلم مايرض على اهله اتبرج وتميع في السواق والملاعب<br />حتا وناقال غير ذالك اذا اتيته وقلت عن اهله ماليس فيهم سوفا تراه يقضب<br />أخر كلامي اقول كما قال الرسول صالله عليه وسلم :<br />((((من راء منكم منكر فاليقيره بيده فان لم يستطع فبلسانه فان لم يستطع فبقلبه فهذ اضعف الايمان ))))"
