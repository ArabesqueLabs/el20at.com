text = "لم تعجبون من ظهور بنات \"سعوديات\" بهذة الصورة اليس هذا غرس بن سعود الفاجر العاهر الموالي للكفرة المعادي للمؤمنين.<br />والله لا ارى عجب في ذلك وهو بقنواته المسمومة MBC LBC ARTالمستقبل روتانا وغير ذلك كثير من قنوات العهر والفجر التي همها ومراد غايتها نشر الفاحشة في المجتمع المسلم .<br />العجب اللا تخرج هذه العينان لمثل هذه التربية السيئة -تربية بن سعود الفاجر- في المجتمع المسلم<br />الحل بيد المجمع ، فإن كان يزعم أنه يغير على حرمات الله أن تنتهك ، فليعمد على هؤلاء المجرمين الفاجرين - ال سعود ، ويقتلعهم من اساسهم فهم بؤرة الفساد ومنبع كل الشرور"
