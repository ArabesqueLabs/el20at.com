text = "السلام عليكم _ شباب بنات ليه نكذب على انفسنا ليه نقول ان المشجعات مو سعوديات كلام فارغ وخير لو طلعوا سعوديات؟ليه قامت القيامة؟<br />انا اشجع البنات اللي خارج المملكة ويشجعون منتخبهم الغالي وءايدهم على ذلك لانهم هم هناك كاشفات وش اللي يمنعهم انهم يشجعون؟<br />وتبون الصراحة؟؟؟؟؟؟؟ بعض الشباب السعوديين ساذجين وفيهم حقارة غير طبيعية الحين انت يالسعودي تقول لا بناتنا مايكشفون ولا يطلعون بالتلفزيون واحنا نخاف عليهم مادام ان من اهتماماتك البنت السعودية ليه تنزل المجمعات وتقعد تغازل وين راحت الغيرة لا وكمان بعض السفلة يروح يدعوها لفعل الفاحشة هاه وين راحت غيرتك يالبطل ياللي خايف عليهم؟؟<br />لكن انا اقول ان مثل هذي الطائفة من الناس لو بامكاني حرقهم لحرقتهم.. انا مااقول اني ماانزل المجمعات واغازل لا انا انسان اغازل واللي تبيني اديها رقمي مااقول لا لانها مو مجبرة واقول لكم شيء بصراحة الناس وصلوا لسطح القمر واحنا لسى خايفين على بناتنا ودوبنا دوبهم والله الطالحة طالحة لو تحطها بغرفة فيها 10 ابواب تعرف كيف تطلع والصالحة صالحة هذا من ناحية المشجعات<br />اما من ناحية المذيعة الرائعة المتالقة داليا شافعي اللي يتكلم عليها بشيء مو زين انا بصراحة اكن له كل عداوة اولا ليه ماتسيب بنات الناس بحالهم ايش لك دخل فيهم؟؟<br />ثانيا داليا تاج على رؤوس السعوديين شباب وبنات وانا منهم تاج على راسي وانا بصراحة من اشد المعجبين بها ومن امنياتي اقابلها وجها لوجه لانها غالية بالنسبة لي واخذت تفكيري<br />ولكم جزيل الشكر ..... وخالص تحياتي .....<br />اخوكم عبدالرحمن المالكي_20_جدة<br />first.love_a@hotmail.com"
