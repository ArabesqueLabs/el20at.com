text = "اذا كان مطار دبي ريش نعام .. فمطار القاهره هيكون ايه ؟؟ لما يكون ميزانية تطوير المطار 9 مليار دولار .. أكيد هيكون حلم .. مش مطار .. ولا تقولي مطار دبي ولا حاجه .. وعلى فكره هما شغالين في المطار بقالهم فترة كبيره .. عموما مستنينهم يخلصو اما نشوف ال9 مليار دي راحت فين .. وسمعني سلام خلي السلاح صاحي .. ويبقى انتا اكيد في مصر"
