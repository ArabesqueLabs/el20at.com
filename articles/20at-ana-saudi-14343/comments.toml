posted = "2010-01-17"
text = "لا بد من احترام رأي الشيخ الغامدي واحترام رأي أئمة المسلمين الآخرين من العلماء الصالحين المشهود لهم بالعلم والتقى ومنهم علماء السعودية الكرام ولا شك أن البيئة والمكان والزمان تسهم بالميل إلى تبني آراء معينة ، والاجتهاد المبني على أسس الشرع الحنيف مطلوب من القادرين عليه وأشير هنا إلى ضرورة الاستفادة من تجارب الدول الاسلاميةالأخرى مثل تركيا والباكستان ولنجتمع جميعا على حب الله الواحد الاحد على ان يكون هدفنا توحيد الامة والاستفادة من جميع مقدراتها وخصوصا البشرية منها وفي الاختلاف رحمة. اللهم ارحمنا وقونا وزدنا ولا تنقصنا."
archived = "2011-07-05"
capture_url = "https://web.archive.org/web/20110705175000/http://www.20at.com/20at/ana-saudi/14343-2009-12-10-11-51-27.html"

