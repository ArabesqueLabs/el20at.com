subject = "المحلقين رؤوسهم والمقصرين"
author = "ابومحسن غربة 27 سنه"
text = "ثلاثة دعوات للمحلقين<br />دعوة للمقصرين<br />لما رحنا نحج ونعمل عمره كنت اول مرة في حياتي احلق شعري اقرع<br />وشعرت بنشاط كبير ينتابني في جسمي كله<br />فعرفت لماذا دعا النبي محمد صلى الله عليه وسلم للمحلقين 3 مرات والمقصرين مرة واحدة"
archived = "2008-10-25"
