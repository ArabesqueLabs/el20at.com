[[comments]]
order = 0
subject = "ما بدنا الأردن , أرفض هذه الفكرة بشدة"
author = "عاشق فلسطين"
posted = "2008-04-14"
text = "شفتوا كيف إنو الحقير عبد الله الثاني كيف حايط عينو زي البومة على فلسطين لجمالها الساحر , والله لو شو ما بصير ولا يمكن إنا نتنازل عن فلسطين ونعطيها للأردن , والله يحلم عبد الله ليل نهار إنو يوخد فلسطين , إن شاء الله لما بتنبظ عينو الحقير , ما بدنا ياهم<br />ولا بدنا الأردن , وبتمنى من كل الفلسطينيين إنهم يرفضوا هده الفكرة نهائيا ما بدنا أردن أساسا , خلاص الأردن بتضلها تتدخل كتير<br />في القضايا الفلسطينية , وعلى فكرة كل اللي عم بحصل من مجازر ونكبات كلو تحت وصاية ورعاية أردنية حقيرة , فكيف بدك تقوم المملكة الهاشمية الفلسطينية على قولتهم , بدناش ياهم , كفاية اللي علمو الكلب الملك حسين الله يحرقو في قبرو بالضفة الغربية ودبح 40 ألف فلسطيني , ينحرقوا أولاد الحرام , ((((فلسطين أولاً)"
archived = "2010-03-14"
capture_url = ""

