[[comments]]
order = 4
subject = "طبعا رح أرفض الفكرة بشكل قاطع"
author = "أحمد الطروانة >;>;>;"
posted = "2008-05-27"
text = "السلام عليكم ورحمة الله وبركاته , أولا إخواني برفض هاي الفكرة بشدة , لكن أريد تذكير الإخوة اللي بالضفة اللي للأسف جالسين بطالبوا بعودة الحكم الأردني العاهر للضفة الفلسطينية الأصيلة , وأن أصل الأردن أساسا يا إخوة هي فلسطين , ولا يوجد أردن بالأساس , بدي أذكر الجميع كم عدد الفلسطينيين اللي قتلهم الملك القرد المخسوف حسين الله لا يرحمو البعيد في قبرو في أحداث أيلول الأسود ؟ قتل حوالي أكتر من 33 ألف فلسطيني , فكيف بالله عليكو بتطالبو بعودة حكم المجرمين والسفلة القتلة لفلسطين , خلي السلطة تبعت عباس تضل ولا بدنا الاردن تمسك الحكم , لا وألف لا ... راجعوا حالكو منيح يا ضفاوية قبل ما تتخذو القرار , أن بنفسي فلسطيني وضفاوي بنفس الوقت , وبرفض هذه الفكرة بشدة وبشكل قاطع , وأنا بتوقع إنو أغلب الفلسطينيه انهم رح يرفضو الفكرة , جاي هدا الكلب عبد الله حايط عينو على الضفة وبدو يحتلها , لا بدناش ياهم , جاي الكلب بدو يكمل مسيرة أبوه الخنزير المخزية ,أتمنى فعلا من كل الفلسطينيين رفض هذه الفكرة رفض قاطع لأنو عبد الله فعلا نفسو يمسح فلسطين ويقضي عليها , شوفو كيف معاملة الأردن للفلسطينين عند الحدود الاردنية الاسرائيلية كيف بعاملو الفلسطينهة , صارو اليهود والله أحسن منهم الكلاب , راجعو منيح في القرار , وللحديث بقية (فيض من غيض) , والله يرحمك يا جورج حبش لما صفعت حسين الكلب لما سب الفلسطينيه , أرجووووووووووووووو الرفض الفوري لهاد القرار , وشكراً وعاشت فلسطين حرة أبية صامدة شامخة رغم انوف الاردنيين والهاشميين >;>; عفوا الهامشيين, (فلسطين اولاً)"
archived = "2010-03-14"
capture_url = ""

