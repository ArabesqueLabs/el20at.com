[[comments]]
order = 7
subject = "يحلم جلالة الملك المعظم عبد الله انو يوخذ الضفة من"
author = "عامر الزيتاوي - نابلس فلسطين ا"
posted = "2008-08-28"
text = "حسبنا الله ونعم الوكيل على كل عميل , حسبنا الله ونعم الوكيل على كل خائن لله ولدينه ولوطنه ولشعبه , حسبنا الله ونعم الوكيل على كل من أفشل وأحبط جهود المقاومين المناضلين , حسبنا الله ونعم الوكيل على من قتلوا المجاهدين , والله يعمي عين كل واحد بحط عينو على فلسطين , يحلم عبد الله التاني وبخسى الحقير إنه يوخذد الضفة , والله إحنا بالضفة على أتم الإستعداد لو دخلت قوات أردنية على الضفة مستعدين لضربها ضرب فتاك ولن نسمح لهم بتكرار حادثة أيلول الأسود علينا تاني مرة , كتائب الأقصى مستعدة كل الإستعداد بكل مكان بالضفة لضرب أي قوة أردنية داخلة لفلسطين , وهدا وعيد رهيب وشديد , وحسبنا الله على محمود عباس , مع إنه هده كتائب الأقصى برجالها تتبرأ تبرئة تامة من حركة فتح الخائنة لأنها أكبر عميلة لليهود , ويا أختي العزيزة صاحبة التعليق الي فوء إن شاء الله ما بتروح فلسطين ورح تضل في عيونا , بإذن الله الواحد الأحد اللهم آمين .. عامر الزيتاوي - كتائب شهداء الاقصى - فلسطين الحبيبة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "الاردن عالي عالي وفلسطين عفوا (فلسطييييييييييز) عل"
author = "محمد نواف الحمدالله .."
posted = "2008-08-28"
text = "يعني فوق ما حنا مفظليين عليكو وعلى اللي خلفوكو وعلى كل فلسطيزي أجرب مقلعط مش لاقيله دفشة ولا دزه .. ويلا يلا تا شايف قدامو .. ولا انو ذنبنا اللي مقعدينكو عنا .. يا سيداة اللي مش عاجبيتو العيشة عنا يوجه عاقرب جسر ويروح يرمي ببلدو حجارة ويبوس كندرة البهائي الخسيس الواطي الشرموط ابو مازن وهنية القواد .. هيك أشرفلكو صح .. فعلاً !!! إنكو ناس حقرا وأنذال ووسخيين ومعفنيين وجرب ومفطسيين وهبايل وكلاب ولاد كلاب ولكو إنتو في دمكو الكذب والغش والحقد والنميمة والحقد والكره والضغينة واللئم .. الله مجمع فيكو كل وسخ وخره هالدنيا والعالم وحاطه فيكو .. سبحان الله !!! يعني الناس بتحاول إنها ( ه ) تحترمكو .. وتقدركو .. وتسويلكو مكانة ومستوى .. وإشي عليه القيمة والفايدة .. بس إنتو مامنكو فايدة بالمره .. يعني أنا الصراحة .. مش من طبعي أو حتى من صفاتي إني أسب سوى إنو شفت إنو فاظ الكيل .. والوعاء امتلا وصار لبرا .. فقلت فحالي وفنفسي صار لازم أتدخل وأسب وألعن وأفضحكو كلكو فرداً فرداً .. يعني أكبر دليل إنكو ناس شاطرة .. ومتفصحنه .. ورايقة .. وفاضية .. وماعندكو شغله ولامشغله . ولا حتى عمله .. إنكو نازليين سب فينا على ولا إشي .. يعني القافلة تسير والكلاااااااااااااااب ( اللي همه إنتو ) تنبح وتعوي ..!!!<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره فالتات ودايرات وداشرات بالشوارع ..<br />يعني والله أنا بشفق عليكو من شعب ماكل خرا من جميع الأصعدة والجوانب المختلفة . يعني شعب كس إمو من شعب شرموووووووووووووط .. قال رنتيسي وياسين وأبو عمار ( أبو حمااااااااااااااااااااااااااار ) .. وكس أخت أسماءكو كيف هيه !!!<br />روحو على بلدكو خلي اليهود ينيكوكوووووووووووووووووووو واحدة ورا التانية ويلا يلاااا يلاااااااااا على بلدكو ياشراميط ولاد الشراميط .. ولاتنسو تلمو عفنكو قرفكو ووسخكو وهبلكو وتسطيلكو معاكو .. ماشي .. ههههههههههههههههههههههههههههه<br />لي عودة بحول الله<br />محمد نواف الحمدالله وتحيا الامة الاردنية وسلامي لكل عشائر الاردن الاحرار"
archived = "2010-03-14"
