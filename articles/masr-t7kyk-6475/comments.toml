subject = "أقف على مين"
author = "شاب مصري جاهل"
posted = "2007-07-02"
text = "تخيلى يا مروة سؤال محير ، فعلاً الواحد محتاج يقف ايام بل شهور حداد على حاجات كتير ، انا شخصياً هقف على مصر حداد فلم تعد مصر هي مصر ، هأقف على مئات القتلى المسلمين الذين يغتالوا يوميا .<br />هقف على حاجات كتير اعتقد يا مروة السؤال لو وقفنا هنقدر نقعد تاني ولا هنكمل حياتنا واقفين حداد"
