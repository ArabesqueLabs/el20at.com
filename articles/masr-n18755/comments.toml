[[comments]]
order = 0
subject = "عنوان فى جريدة الدستور اليوم : الداخلية تبدأ فى صر"
author = "مواطن"
posted = "2008-12-06"
text = "كمواطن بيدفع ضرايب<br />الداخلية تعذب والشعب يدفع تعويضات للناس اللى اتعذبوا<br />ال 2 مليون بدل ما يبنوا مدرسة او يرصفوا شارع تدفعهم الداخلية تعويضات للاخوانجية<br />انا افهم ان اللى عذب يدفع من فلوس ابوة<br />او يقتطع من راتب اللى عذب او اللى عذبوا<br />انما الدولة تدفع لهم فيبقى دة موضوع تانى<br />انهم بيعذبوا بناءا على طلب الدولة وان الدولة هتدفع لهم<br />يبقى التحايل على دفع الضرائب مطلوب وبشدة"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207034019/http://masr.20at.com:80/newArticle.php?sid=18755"

[[comments]]
order = 1
subject = "ذكريات الفنانين مع الخروف - خروف اية - اذا كان اجر"
posted = "2008-12-07"
text = "يعنى اية خروف لواحد ساكن فى جناح فى فندق 5 نجوم او فيلا بالشىء الفلانى واجرة فى المسلسل او البوم الغناء يصل 5 مليون جنية<br />فية ناس عايشة فى الشهر ب 150 جنية<br />وبتشوف الخروف من بعيد<br />يا ست مروة رجاءا ابقى خللى اسئلتك ليهم يعنى انتم بتفتكروا الناس الغلابة ازاى 0 - انتم بتدفعوا زكاة للناس الغلابة<br />بتساهموا باية لاسعاد الفقير فى العيد<br />انما خروف اية اللى هيفتكروة"
archived = "2010-03-14"
