order = 0
subject = "عنوان فى جريدة الدستور اليوم : الداخلية تبدأ فى صرف 2 مليون جنية ل 300 من الحماعة المحظورة تعرضوا للتعذيب"
author = "مواطن"
text = "كمواطن بيدفع ضرايب<br />الداخلية تعذب والشعب يدفع تعويضات للناس اللى اتعذبوا<br />ال 2 مليون بدل ما يبنوا مدرسة او يرصفوا شارع تدفعهم الداخلية تعويضات للاخوانجية<br />انا افهم ان اللى عذب يدفع من فلوس ابوة<br />او يقتطع من راتب اللى عذب او اللى عذبوا<br />انما الدولة تدفع لهم فيبقى دة موضوع تانى<br />انهم بيعذبوا بناءا على طلب الدولة وان الدولة هتدفع لهم<br />يبقى التحايل على دفع الضرائب مطلوب وبشدة"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207034019/http://masr.20at.com:80/newArticle.php?sid=18755"
