subject = "هل المفتحين بيقروا مجلات لما العمى هيقروا مجلات"
author = "يب"
posted = "2008-12-22"
text = "مع احترامى لاى شخص اعمى - وان هذا هو قدر اللة ونصيبة فى الحياة ومع ان العلم تقدم واصبح فى مقدور العلم ان يجعل الاعمى يبصر<br />لكن السؤال هو<br />هل المبصرين يقرؤن مجلات<br />انت مش شايف ان الموضوع فية فذلكة"
