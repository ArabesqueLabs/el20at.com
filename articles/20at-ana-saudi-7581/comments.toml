subject = "ليش لا؟"
author = "ريما"
posted = "2007-11-14"
text = "انا زوجي حضر ولادة بنوتي... بس هي ما كانت اول مرة بيحضر فيها ولادة لانو بالاساس دكتور... عشان هيك ما كان كتير متعاطف معي... و فجاة تحول لدكتور و نسي انو زوجي... يعني امي كانت قلقانة اكتر منو ...هو كول على الاخر<br />بس بصراحة فعلا حضورو حسسو بتعبي و عرفت هالشي لما سما بنوتي بالاسم الي انا اخترتو مع انو كنا لسة منتجادل على الاسم واحنا بغرفة الولادة<br />بس فعلا انا سعيدة الي كان معي بهيك وقت.. لانو الولادة حسيتها تجربتنا احنا لتنين مش تجربتي لوحدي"
archived = "2010-03-14"
