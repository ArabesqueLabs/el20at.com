[[comments]]
order = 1
subject = "إحساس لايوصف ..."
author = "حموووووووووووووووووووووووووووو"
posted = "2007-11-13"
text = "والله عادي ياشباب .. شو يعني ؟؟ إنتا قاعد عم بتطلع ع مرتك هيه وعم بتولد ... ؟؟ وين المشلكة ؟؟ عادي .. وأكثر من عادي...<br />بعدين يعني إذا بدول الغريبة قاعدين عم بطلعو الرجال ع نسوانهم وهمه قاعدين عم بولدووووووووو .. شو يعن (( حلال عليهم وحرام علينا )) .. يعني .. وبالنهاية إنتا قاعد عم بتطلع ع مرتك مش ع اي وحده يعني ... يعني .. بلاش المكابره تبعتكو .. وخلينا نحكي بكل صراحه .. يعني الواحد لما يتزوج .. شو بصير بعيدن ؟؟ يعني مفهومه (( ليلة الدخلة )) ..<br />وطبعاً بشتغلو مع بعض الحلوي (( وع أخررر إنبساااااااط )) . أظن إنكو فهمتو قصدي يعني فش داعي لتفهيم أكثر من هيك .ز يعني إذا إنتا نايم مع مرتك وماست معها وهيه وعاريه .ز مستحي تشوفها وهيه بتولد (( يعني ياطخو ياإكسر راسو )) .. وشكراًً ،،،"
archived = "2010-03-14"
capture_url = ""

