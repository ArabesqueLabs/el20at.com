subject = "ما هي نوعية الحضارة القائمة علي شعر المرأة؟"
author = "شيماء"
posted = "2006-11-20"
text = "السلام عليكم و رحمة الله و بركاتة<br />الاخوة و الاخوات الافاضل<br />بمناسبة تصريحات السيد هباب المتهبب ماحي الثقافة في مصر جاعل اصغر عيل في اقل دولة في العالم مثقف اكثر من اساتذة التعليم في مصر و هذه اهم انجازات وزير الثقافة المصري التي لابد و ان تذكر لنرجع الفضل لاصحابة, اه بمناسبة تصريحاتة حول الحجاب و امة و زوجتة الي لسة متجوزهاش لانه لسة بيكوم نفسة اود ان اسأل سيادته و اسأل كل من يهاجم الحجاب و مرتدياته و يتهم بالرجعية و التخلف لي عنده و عندهم سؤال و هو سؤال حيوي جدا جدا جدا اما السؤال هو:-<br />اي حضارة عمو الوزير التي تقوم علي شعر و صدر و اقدام و خصر المرأة اي نوع من انواع الحضارات هذه ؟؟ طيب تفرق ايه مع سيادتك اني البس حجاب او ملبسش او استر جسدي او اعريه؟؟ هو لمؤاخذة انت و شوية الهبل الي بيهاجموا الحجاب من نوعية العالم الي قايمة قاعدة ماشية نايمة تبص في الستات الي حواليها و تبحلق علي اساس طبعا ان الله جميل يحب الجمال و احنا لازم نتمتع بالجمال ( كما يدعي الهبل امثالكم) او يمكن ان الحضارة كلها قائمة علي شعر و جسد المرأة و الي مش عاجبة افقعوا عينة؟؟<br />و يا تري الحضارة القائمة علي شعر المرأة تفرق معاها اذا كان الشعر اسود و لا اشقر و لا احمر؟؟ طيب بلاش السؤال دة يمكن صعب شوية نسأل سؤال تاني:<br />زمان في افضل عصور الدولة الاسلامية كانت كل النساء محجبات او يمكن منتقبات و مع ذلك قامت افضل الحضارات الاسلامية اذا كنت تسمع عنها اصلا و التي اقتبس الغرب حضارته منها لية بقي مأثرش الحجاب وقتها علي بناه الحضارة الاسلامية؟؟<br />طب بلاش سؤال تاني اسهل:<br />ممكن اعرف من حضرتك نوع الحضارة و التقدم الي احرزة الشعب المصري منذ خلعت الست الي ربنا خدها صفية زغلول حجابها اول مرة؟؟ الان في هذا العصر اكثر عصور الشع<br />اقرأ بقية التعليق .."
