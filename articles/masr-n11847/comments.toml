[[comments]]
order = 1
subject = "بيض الشريف"
author = "وعدي يا وعدي فل عليك"
text = "رغم أن صفوت الشريف قد صار رسميا تحت حماية اليونسكو باعتباره أحد أنواع \" الترسة البحرية\"\" المهددة بالانقراض .. إلا أنه يصر أنه في قلب الصورة ومحرك للأحداث.. لذا فإنه يضع بيضه دائما في الماء وليس في الرمال .. علشان كدة لم تفقس لصفوت الشريف يوما بيضة واحدة رغم تاريخه وجلوسه الطويل على حافة مصطبة الحكم !! فكل بيض الشريف ممشش وحائض.. رغم أن خصوبته في انتاج البيض الممشش لم تضعف يوما بل ربما تزداد غزارة!! ولم يفكر \"\" الشريف\"\"يوما منذ أن بدأ حياته النضالية بالوقوف وراء الكاميرا محطوطة في خرم حيطة غرفة ضلمة منفده على أوضة تانية لتصوير أحلى الأوضاع على السرير في سبيل الوطن أيام صلاح نصر إلى قيادة المظاهرة المليونية للتنديد بغزو العراق و\" لا للحرب\" ومن تحت الترابيزة تاييد عارم وتحريض على الغزو .. وأخيرا الجلوس على رأس حربة الحزب الحاكم وفي قبضته اليمنى لجنة الأحزاب وفي قبضته اليسرى مجلس الشورى لم يفكر ان يضع ولو مرة واحدة في حياته بيضة حلوة الناس تفتكره بيها ..وشغال الشريف يضع بيضه الفاسد في حلق الشعب الممرور اللي مش فايق للشريف وبيضه بينما الشريف فاكر إن الشعب بالع بيضه الممشش ومتمزج على الآخر .. لكن نقول إيه .. والنبي أحب أشوف برنامج البيض بيضك.. جاك وجع في بيضك."
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032246/http://masr.20at.com:80/newArticle.php?sid=11847"

[[comments]]
order = 2
subject = "آل شريف آل"
author = "ابو اسامة"
text = "انتوا مستنيين من صفوت آلشريف انه يقف مع الصحفيين وينسى ولى نعمته الى عينه فى المنصب<br />وعلى راى الاخ اللى فوق عنه زهايمر دا راجل بينتقد الصحفيين الى بيدفعوا عن زمايلهم الى اتحكم عليهم بالحبس<br />وفى نفس الوقت بيقول ان الرئيس بتاعه لغى الحبس فى قضايا النشر وهو ده الزهيمر بعينه.<br />نصيحة يا ريس ياريت تضربه بالنار زى خيل الحكومة وتجيب حد ميطلعكشى كداب .يا كداب"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032246/http://masr.20at.com:80/newArticle.php?sid=11847"

[[comments]]
order = 3
subject = "صفوت الخرييف يدلى بخرافاتة اللى زى وشة"
author = "شعبان"
text = "قمة المهزلة والدحك على نفسة اولا وعلى اللى بيسدق الخرافات دى الناس دول خدت على نفسها عهد انها تخرب بيت ابو حاجة اسمها مصر واللى مفيش اشرف منة دة نقطة سودا او صفحة قاتمة السواد فى تاريخ المحروسة لانة من اللاعبين الاساسيين فى وصول البلد الى ماوصلت الية ومن المستعدين ببذل الغالى والنفيس لاتمام مراسم فرح التوريث مهما كلف الموضوع من قرارات وتعديلات وانتخابات مسرحية مصورة محسومة النتائج وبعد كدة يقعد على تلتها لغاية مايشوف الحانوتى شغلة ونستريح من شخصة لكن حنقعد نعانى من سلبيات قرارت وتصرفاتة هو وبقية مايطلق عليهم قيادات الحزب الفلتة اللى ودانا فى ستين داهية واللى كان كان"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032246/http://masr.20at.com:80/newArticle.php?sid=11847"
