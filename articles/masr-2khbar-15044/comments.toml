posted = "2010-01-25"
text = "القصة ببساطة انة هناك ضغوط امريكية لالغاء قانون الطوارىء<br />والنظام لا يستطيع ان يعيش ساعة بدون قانون الطوارىء<br />طيب نرد على الامريكان والاربيون بأية اسباب<br />نبعت ولد مخبول يضرب كم مسيحى فى كنايس اسكندرية<br />والمرة دى بعتوا واحد بلطجى من بتوعهم فزودها قوى وضرب فى المليان جامد<br />فا انقلبت الدنيا<br />نقوم بقى نلزق فى كلام كلش كان اللى هو الخطاب الدينى والخطاب اللى مش عارف اية<br />زنبوخة بطل هبل"
