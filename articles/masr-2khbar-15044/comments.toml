author = "التحريات والمباحث"
posted = "2010-01-25"
text = "يا عم حسني مبارك ضباط التحريات والمباحث ما يعرفوش يعني ايه تحريات ومباحث<br />كل ما تحصل حاجه في مصر ما يعرفوش مين اللي عملها واخرهم ليلى غفران لما قالوا ان الفاعل نجار مسلح<br />يا عم حسني بتوع دبي كشفوا جريمة قتل سوزان تميم في 6 ساعات<br />عيب كده لما دبي اللي كانوا بيصيدوا سمك من 30 سنه يفهموا في التحريات اكتر من مصر اللي عمرها 7000 سنه<br />يا عم حسني انت غيرت اسم كلية الشرطة وسميتها اكاديمية مبارك للامن<br />ممكن تعلم الضباط ان فيه حاجه اسمها تحريات ومباحث<br />وممكن تستعين بخبراء من دبي اذا ما كنش عندك حد بيفهم في العملية دي<br />سلام يا عم حسني وحظ سعيد في الانتخابات الجاية ان شاء الله<br />انشاء الله ناجح وحتجيب 99% وحتخل كلية الطب باذن الله<br />سلام يا حسني"
archived = "2010-03-14"
