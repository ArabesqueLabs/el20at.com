author = "انت المسئول الاول"
posted = "2010-01-25"
text = "لا الازهر ولا الكنيسة مسئول<br />المسئول الاول هو انت والحزب بتاعك وحكومة الحزب<br />لانكم خلقتم طبقة البلطجية امثال الكمونى وحميتموهم بواسطة ضباط امنكم واستخدمتوهم فى الانتخابات وضرب الخصوم<br />الكمونى مسجل خطر وكان يفرض اتاوات على الدكاكين بعلم امنكم ولم يتخذ اى ضابط امن او شرطة موقف منة<br />كان الكمونى على علاقة بالقسيس كيرلوس وكان يدفع لة<br />والازهر انت افرغتة من رجالة وفرضت مشايخ نص كم ليس لها اى هيبة او وضع<br />وهناك قائل بان كل ذلك فرقعة لتغطية احداث الجدار الفولاذى وشغل الناس<br />نظامك الفاشل يريد ان يشعل فى البلد نار<br />وعلى الفاشلين ان يرحلوا<br />وكفاية"
archived = "2010-03-14"
