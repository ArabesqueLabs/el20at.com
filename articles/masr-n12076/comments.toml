[[comments]]
order = 0
subject = "عفريته هانم"
author = "عفريته"
text = "الله عليك ا استاذ احمد الموضوع بجد قوي والقضية المطروحه اقوى فعلا ما ذنب هؤلاء الغلابة في ما يحدث لهم؟<br />علامات استفهام ضلت طريقها في البحث عن اجابة لها"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023100/http://masr.20at.com:80/newArticle.php?sid=12076"

[[comments]]
order = 1
subject = "مين بياكل اللحمة"
author = "عابر سبيل"
text = "الراجل البخيل اللى رصيدة فى البنك الشىء الفلانى وقاعد بيصيف فى خيمة يعنى عامل camping وبيدعى انة مش لاقى اللحمة<br />اللحمة مغرقة البلد والناس محتارة تاكلها ازاى - دا احنا من كترها عندنا بنصدرها لاستراليا<br />ناس كدابة وبتروج اشاعات ولازم يتحاسبوا<br />كل مواطن عندنا عندة فيلا ويخت وسيارة دفع رباعى والكداب يروج اشاعات انة ما بيكلش لحمة<br />المصانع واقفة ومش لاقيين ولا واحد يشتغل عندنا عجز فى العمالة وبنفكر نجيب عمال من هنولولو يشتغلوا عندنا<br />اية الهنا اللى احنا فية<br />ربنا يزيد ويبارك<br />ومبارك عليكم الشهر الفضيل"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023100/http://masr.20at.com:80/newArticle.php?sid=12076"

[[comments]]
order = 2
subject = "موضوع اكتر من رائع"
author = "إيمان كمال"
text = "على أد ما الموضوع حلو ورائع ولكنه بيوجع جدا ازاى دول عايشين كده واحنا بيكون عندنا الاكل والشرب بزياده وبنكون حاسين كمان أنه مش كفايه ده غير الناس اللى بتعمل عزومات وتنوع فى الاكل زى مسرحيه عادل امام الواد سيد الشغال لما قال الناس اللى عندها لحمه وبتعزم ناس عندها لحمه برضه ده حقيقه لكن دول عشان غلابه منسيين اصلا وممكن نتعاطف معاهم ولكن التعاطف مش هيغير من الاوضاع ده<br />المهم ياريت يا احمد تكتر موضوعاتك جدا لانها من اكتر الموضوعات فى الموقع جديه وبتكون هامه وبتمس العقل والقلب"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023100/http://masr.20at.com:80/newArticle.php?sid=12076"

[[comments]]
order = 3
subject = "ربنا يرحمنا ويرحمهم"
author = "محمد عبد العاطي"
text = "واقع مؤسف واصعب حاجة فيه انه مش فيلم ولا مسلسل لا الناس اللي مش لاقية تاكل دي واقع .. الناس اللي بشر زيهم زينا<br />موضوع عالي أوي يا بلال ومؤلم أوي"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023100/http://masr.20at.com:80/newArticle.php?sid=12076"

[[comments]]
order = 4
subject = "مشفتش الكلام ده"
author = "sameh"
text = "انا من مدينة المحلة الكبرى وعارف المنطقة اللى انتو رحتوها وعاوز أعرف الكاتب وأفهمه ان الناس اللى عايشة فى المنطقة دى هيا اللى عملت فى نفسها كدا<br />كل واحد من الناس دى كان واخد شقة فى المساكن اللى ورا الخيم دى علطول وكلهم باعو شققهم وعملو الاكشاك والخيم دى<br />الخيم دى فى أجمد منطقة فى السوف يعنى لو كل واحد منهم أجر بس المكان اللى قدامة يوم السوق هيجب كيلو لحمة بعنى يجيب فى الاسبوع 2 كيلو لحمة<br />حضرتك رحت وسألت الناس والناس ردت عليك بكدب لأنهم مش كدا زى ما بيتكلمو هما اللى عاوزين يعيشو كدا"
archived = "2007-09-21"
capture_url = "https://web.archive.org/web/20070921023100/http://masr.20at.com:80/newArticle.php?sid=12076"

[[comments]]
