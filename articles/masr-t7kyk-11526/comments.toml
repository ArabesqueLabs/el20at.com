[[comments]]
order = 2
subject = "الى الخ المعلق الاول التوريث في مصر في كل شيء"
author = "مش ححبك"
posted = "2009-03-11"
text = "التوريث في مصر في كل شيء بداية من رئاسة الجمهورية<br />اساتذة الجامعات يورثون مناصبهم لابنائهم والدليل على ذلك الدكتور علي مؤمنس بتاع الامراض الباطنية ابنه استاذ مساعد وحيورثه مكانه<br />التوريث في السينما كل الممثلين اولادهم بيشتغلوا مكانهم زي الفيشاوي ورانيا فريش شوقي ووحيد سيف وكلهم<br />التوريث في القضاء القاضي بيشغل ابنه قاضي زيه اي قاضي دلوقتي تلاقيه مدخل اولاده سلك القضاء<br />ضباط البوليس برضه بيورثوا اولادهم المهنة والدليل على ذلك الضابط اسلام نبيه ابوه لواء شرطة ومحسن منير السكري ابوه لواء شرطة<br />المحامي بيطلع ابنه محامين زيه علشان يمسكه مكتبه اللي تعب فيه طوال السنين<br />المدرس بيطلع ابنه مدرس زيه علشان خاطر الدروس الخصوصية<br />حتى كمان موظفي البنوك بيجيبوا اولادهم يشتغلوا معاهم علشان خاطر ياخدوا مكانهم<br />خلاص مصر بلد موروثة"
archived = "2010-03-14"
capture_url = ""
