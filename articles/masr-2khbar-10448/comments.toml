[[comments]]
order = 1
subject = "الفرق بين (الحزب الوطنى)و جميع احزاب ما تسمى (المع"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-08"
text = "اسباب عديدة تظهر الفرق بين الحزب الوطنى و جميع احزاب المعارضة؟<br />الحزب الوطنى يعرف ما يقول<br />و يعرف كيف ينفذ ما يقول؟!<br />اما جميع ما يسمى باحزاب(المعارضة)فهى لا تعرف ما تقول !!!<br />و لا تعرف كيف تنفذ ما كانت تقولة؟<br />كلها احلام مريضة بانها يوما ما سوف تستحوز على الحكم؟<br />(حكم اية الا انت جاى تستحوز علية)؟؟؟!<br />مع الاعتذار لكوكبالشرق(أم كلثوم)<br />و غنوا و ارقصوا و تباكوا و صرخوا , و اعوا ياللى اسمكم قال(معارضة)؟<br />احزاب المعارضة ما هى الا(خيالات مأتة)؟!!!<br />لا اكثر و لا أقل<br />كلها نواح و نواح و نواح؟<br />ليس ألالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالالا"
archived = "2010-03-14"
capture_url = ""

