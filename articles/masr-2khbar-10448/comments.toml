subject = "الشيطان يتكلم"
author = "المصرى أفندى"
posted = "2008-11-09"
text = "لا أعرف من الذى أعطى زخارى الخارى على نفسه الحق فى أنتقاد المعارضة وهو موظف فى حزب الخراب الوطنى. وثانيا أنت خارى على نفسك وريحتك وسخة. حزب أيه يامتخلف اللى بتدافع عنه واللى لامم كل حرامية وبلطجية وقتلة البلد. حزب أيه يامتخلف اللى عارف اللى بيقوله وهو عبارة عن عصابة من الكذابين اللى بيضحكوا على الناس وفاكرين أن الناس هبل ومصدقينهم. نصيحتى ليك روح خدلك غطس فى أى ترعة علشان تنضف جتت نيلة عليك وعلى الحزب اللى خرب وباع البلد..."
archived = "2010-03-14"
