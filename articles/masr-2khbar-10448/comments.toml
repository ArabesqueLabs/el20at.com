subject = "انتم بتتكلموا عن اية ؟ لا فية حزب حاكم ولا فية معا"
author = "شفتشى"
posted = "2008-11-08"
text = "حزب حاكم اية ؟<br />ومعارضة مين ؟<br />دا نظام حكم بوليسى قمعى - يحكمة الامن - ابتداءا من تعيين العمدة فى القرية بواسطة امن الدولة لغاية اختيار عمداء الكليات ورؤساء الجامعات بواسطة الامن<br />حزب حاكم اية ومعارضة اية ؟<br />انتم بتتعاطوا حاجة بتطلع دخان ازرق<br />دا نظام بوليسى امنى جناحاة امن الدولة والامن المركزى"
