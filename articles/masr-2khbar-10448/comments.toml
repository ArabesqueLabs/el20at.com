subject = "مصرى افندى؟ خليك كدة مولع و حقود"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-09"
text = "الى من يدعى انه حقيقة (مصرى افندى)<br />اشكر لك الانحطاط و الحقد و الجهل اللى انت و غيرك من الحاقدين ما زلتم تعيشوا فية<br />و على كل حال دعنى اقول لك كلمة واحدة؟<br />خليك كدة محروق من الغيظ وولع من الحقدواشرب منن البحر<br />انت صحيح و سخ وغير افندى؟<br />الكلب طول عمرة كلب<br />و هوهو يابن الكلب<br />بالذمة انت (مصرى) و لا انت (مخرى أفندى)"
archived = "2010-03-14"
