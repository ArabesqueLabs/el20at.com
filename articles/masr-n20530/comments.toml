[[comments]]
order = 4
subject = "كلام فاضى"
author = "رءوف"
text = "ايه الكلام الفاضى ده<br />خارج من الجامع ايه ده صايع و برشامجى زي اللى قتلوه تمام و من فترة طويلة وهما عاملين مشاكل مع بعض و أكتر من مرة يعملوا محاضر لبعض ....... يعنى من الآخر القتيل و التلاتة اللى قتلوه صيع زى بعض<br />للعلم أنا ساكن فى نفس الشارع اللى هما ساكنين فيه و عارفهم وعارف أن كلهم ميفرقش معاهم الدين فى حاجة خالص لأنهم زى ما قلت صيع و رد سجون"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408072948/http://masr.20at.com:80/newArticle.php?sid=20530"
