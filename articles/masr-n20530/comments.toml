[[comments]]
order = 1
subject = "البطالة والعيال الصايعة كتير واى كلمتين هيحرقوا ويولعوا"
author = "سليم"
text = "ربنا يستر<br />شباب قاعد فاضى وصايع ولا شغلة ولا مشغلة واى واحد هيطلع يقول شايف يا ولد انت وهو النصارى بيعملوا اية هيطلعوا يكسروا ويولعوا ويخربوا ويحرقوا مركز الشرطة كمان وعلى ما تييجى القوات الكبيرة تكون الدنيا خربت<br />الموضوع مش تعصب دينى ولا اضطهاد ولكن شباب مضغوط من البطالة والفقر ومش لاقى حاجة"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408072948/http://masr.20at.com:80/newArticle.php?sid=20530"

[[comments]]
order = 2
subject = "الى كاتب التعليق الاول(طيب فرصة كويسة يخاصونا من زخارى)"
author = "ممدوح زكى زخارى جرجس _الاسكندرية _مصر"
text = "ممكن اقولك كلمة فى ودنك بس توعدنى انك ما تزعلش؟<br />(كس كس كس ام امين امك يا ابن المرة المنيوكة)<br />زخارى لا يخاف الكلاب امثالك يابم المنكوحة!!!<br />هااااا هااا هاااااااا هاااااا هااااااااااااااااااااااااااااااااااااااااااااااااااا<br />ياماما قال زخارى بيخاف قال؟هاهاهاهاهاهاهاهاها"
archived = "2009-04-08"
capture_url = "https://web.archive.org/web/20090408072948/http://masr.20at.com:80/newArticle.php?sid=20530"

