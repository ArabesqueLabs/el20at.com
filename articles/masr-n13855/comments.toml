author = "صاحبة تجربة"
posted = "2009-06-18"
text = "انا شايفة انى دى حاجة مهمه جدا للبنت لا نها لازم تتعلمها لان فى الزمن اللى احنا فيه مهما كان الموقف اللى البنت فية ومهما كان عدد الاشخاص اللى موجودين فى المكان ده مش هتلاقى اللى يتدخل يدافع عنها لان للاسف الرجالة ماتوا فى الحرب مابأش موجود غير ذكور مش رجالة"
archived = "2010-03-14"
