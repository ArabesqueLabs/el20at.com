order = 0
subject = "كده أحسن"
author = "اكتب اسمك هنا"
posted = "2008-01-17"
text = "اللياقة البدنية وتدريبات الدفاع عن النفس من التدريبات المهمة ولازم كل بنت تتعلم إزاى تدافع عن نفسها فى أى موقف تتعرض له فى الشارع بدل من الصراخ وإنتظار تدخل ولاد الحلال ."
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063028/http://masr.20at.com:80/newArticle.php?sid=13855"

[[comments]]
order = 1
subject = "دى حاجة تمام"
author = "اكتب اسمك هنا"
posted = "2008-01-17"
text = "والله مشكورررررة ساقية الصاوى على الأنشطة الأدبية وكمان دورات لتدريب الفتيات على الدفاع عن النفس فعلا أنشطة تخدم الناس مش كلام وخلاص"
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063028/http://masr.20at.com:80/newArticle.php?sid=13855"

[[comments]]
order = 2
subject = "برافووووووووووووووووووووووووو"
author = "اكتب اسمك هنا"
posted = "2008-01-17"
text = "برافو يا ساقية الصاوى وكمان برافو للبنات المشتركات فى التدريبات دى وياريت يا جماعة عشرينات تهتموا أكثر بأنشطة ساقية الصاوى وإزاى إحنا كشباب نوصلها لأن بجد المكان واضح انه مكان محترم ونشاطه مهم"
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063028/http://masr.20at.com:80/newArticle.php?sid=13855"

[[comments]]
order = 3
subject = "الله يرحمك يا شيخ كشك"
posted = "2008-01-17"
text = "مرة قال تعليقا على خبر تعلم البنات للكراتيه<br />لما الراجل يقول لمراته قومي جبيلي القلة تروح مدياله مقص طاير"
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063028/http://masr.20at.com:80/newArticle.php?sid=13855"

[[comments]]
order = 4
subject = "نشر اسماء البنات الحاصلات على تلك الدورات"
author = "خايف من الضرب"
posted = "2008-01-17"
text = "حتى لا نقع فى شر اعمالنا - ويخطأ احد الاولاد ويتزوج من احدى الحاصلات على تلك الدورات - التى سترية الوان الركلات والرفسات - والضرب فى الصباح او المساء ان حتى اهمل فى الغسيل او الكنس - برجاء نشر اسماء المشتركات حتى لا نتزوج منهم - وربنا على المفترى - وربنا الغنى<br />ويا دار ما دخلك شر"
archived = "2008-01-18"
capture_url = "https://web.archive.org/web/20080118063028/http://masr.20at.com:80/newArticle.php?sid=13855"

[[comments]]
order = 5
subject = "مش اى حد يتكلم بعد البرنس"
author = "البرنس وبس"
posted = "2008-01-18"
text = "كسمك يا كابتن ياسر<br />لو الشاب عاز يغتصبها هيغتصبها<br />وهيرفعها وهيظبتها<br />اوك يا كوتش<br />هيا البت فيها ايه<br />تثبيت وتسييح ورفع"
archived = "2008-01-20"
capture_url = "https://web.archive.org/web/20080120105817/http://masr.20at.com:80/newArticle.php?sid=13855"

[[comments]]
order = 6
subject = "عند أمه"
author = "محمد عبد المعطى"
posted = "2008-12-10"
text = "عند أمه<br />يستحيل إن أى أنثى على وجة الأرض تضرب رجل مثلى ... لا تتعجبوا من كلامى فأنا لست ضخما أو حتى رياضيا .. ولست مغرورا بل إن هذه حقيقة وأناأتحدى أن أى واحدة تضرب شاب مثلى ... بل إننى على إستعداد أن أوقعها أرضا فى أقل من ربع ساعة حتى ولو كانت بطلة العالم فى الشيبسى مش الكاراتيه بس ... للعلم أنا ما بعاكسش أى واحدة إطلاقا وبكره التحرش الجنسى للفتيات وأنا ضده تماما بس موضوع إن واحده تضرب واحد دى صعبه شوية وعمرى ما أتخيلها أبدا"
archived = "2010-03-14"
capture_url = ""

