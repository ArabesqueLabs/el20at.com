text = "( حكايتي مع القهوة)<br />اسمحوا لي ان اخاطب فنجان قهوتي ب ( أنت) وانت هنا ليست للتقليل من شأن وانما هي تعبير عن اتصال يفوق الوصف<br />فيا انت ,, انني اقدرك لانك ارتبطت بذكرى الوالدة الطيبة الحنونة المعطأة,, فعندما ارتشفك في صباحات الغربة ,, فانك ـاخذني الى تللك الصباحات المعبوقة بشذى الوالدة _ اطال الله عمرها_ التي عندما ارتشف فنجان قهوتي معها بعد الفجر وتفوح منه رائحة الهال ويقابلني ذلك الوجه الطيب وتلك اللمسة من كفيي والدتي اللتان تسعان الارض حبا وعطاء ويعبق الجو برائحة التبغ ,,فستريح هذه الروح التي ذاقت ذرعا من هذا الداء ( الغربة) فانت هنا ودائما مرتبطا بذكرى وحضور ليس كمثله شيء.<br />اما مكان اخر ,,, فانني عندما ارتشفك اوقات الصفاء الذهني فانت تعيد لي احسحاس بارتباطي باشخاص الى القلب والروح<br />قربيين ,, فانت مصدر فرح وقلق ( لا تسألني كيف) فبعد الرشفة الثالثة منك تحديدا تعيدني الى صباحات الجامعة الاردنية تارة ,, واخري الى صباحات بغداد الرشيد,,واخرى الى صباحات تونس الخضراء,, واخرى الى برد دمشق المحبب الى القلب,,واخرى الى ذلك الازدحام المفعم بالحب والبساطة في صباحات القاهرة,, واخرى الى اغتراب ووحشة صباحات مانيلا ,, وتعيديني الى الامال والحلم في ظهيرة كوالمبور,, وتعيدني ليلا الى مساءات مكة التي لاينقطع الشوق اليها.<br />فانني استحلفك بكل عظيم ,,, هل هناك من ارتبط به ويذكرني بكل ذلك اكتر منك؟<br />لذا فانت رفيق ,, وصديق ,, لاحظ ان هذه الصفات عز ايجادها في دنيا البشر,,,, ولكن ارجو الا يصيبك الغرور ,,انا محتاط لهذه الفرضية ,, فاشركت معك L&M الاحمر ,,, فكن معه طيبا ,,, و الا ساكون غير راض,,, فانت تعلم عند عدم الرضى اشترك جاهزا ,, وتضيع فرصتك ( ان احضرك بنفسي)<br />فلكم جميع احبتي فنجان قهوتي محلى بعسل جنوني"
