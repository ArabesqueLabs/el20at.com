[[comments]]
order = 0
subject = "يوم لا ينسى"
author = "ادم المهدى"
text = "سلام عيكم<br />ادم المهدى 21 سنة<br />يوم نتيجتى لا ينسى فى حياتى و خصوصا نتيجة تانيه ثانوى فقد سهرنا طوال الليل بنلف على السيبرات علشان النتيجو وواحد جبهالى من جوه السيبر و كان اهلى كلهم متوقعين اخرى 90 فى الميه و لكن لما جبتها و جمعت الدرجات لقيت ناقص تمن درجات و نص يعنى 96.5 فى المية لم يسعنى الفرحة و انتابنى حالة من الهيستريا و جريت فى الشارع و خلعت الشبشب و جريت فى الشارع حافى القدمين ، و اول ما وصلت الشارع بتاعنا صحت بأعلى صوتى يا ماما نجحت و جبت 96.5 ياماما و تسببت فى ايقاظ الشارع كله و عانقت امى نصف ساعة ، و يوميها مانمتش و رحنا المدرسة جبتها و لاقيتها زى النت و الحمد لله<br />اما فى تالته كان الموضوع مش بألق تانية ده لانى كنت عاوز هندسة و كان مجموعى يجيبلى هندسة مستريح و فى تالته كان مجموعى 95 فى المية و ادينى دلوأتى فى كلية هندسة<br />و على فكرة اختى نتيجتها كانت امبارح فى تالته و جابت 72 فى المية و كانت فرحة غامرة لاننا مكناش متوقعنها كنا كتوقعين اقل من كده<br />الحمد لله على كل شىء و على العموم معدتش بتفرق كله بقدراته بيشتغل مش بالكلية<br />يلا زورزنى على مدونتى<br />www.ademelmahdy.blogspot.com"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820101102/http://masr.20at.com:80/newArticle.php?sid=11093"

[[comments]]
order = 1
subject = "حاضر"
author = "مش فاكر"
text = "لية بتفكروني بنتيجة الثانوية بس ده كان يوم طويل اوي وكله قلق ومفيش نوم بالليل وكركبة في البطن وفي الاخر اجيب 80% ومعرفش ادخل كلية عدلة ياله يعني اللي دخلوا هندسة لاقين شغل ولا اللي دخلوا تجارة لاقين شغل"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820101102/http://masr.20at.com:80/newArticle.php?sid=11093"

[[comments]]
order = 2
subject = "زمن العجائب"
author = "راجل عجوز"
text = "العبد للة دخل الهندسة ب 65% وكان مهندس متميز<br />على ايامنا كان الاول على الثانوية بيجيب 85%<br />وكانت نسبة النجاح فى الثانوية العامة 40%<br />وكان اللى بيجيب 40% مجموع فى الثانوية بيخش الطيران وبيعتبر ناجح<br />وكانت الهندسة اعلى من الطب<br />وكان عددنا فى الثانوية العامة سنة 1966 سبعون الفا نجح نصفهم ودخلوا جميعا الجامعات<br />فى العربى لما تكتب موضوع التعبير الاستاذ لا يعطى اكثر من سبعة من عشرة دلوقتى بيدى عشرة وعلى ايامن كنا بنكتب شعر وادب وتقول لة سبعة من عشرة يقول لك يعنى الم تنسى فصلة او نقطة علشان تتحاسب عليها<br />يااما المدرسين مستواهم انحدر علشان بيدوا عشرة من عشرة<br />يا اما اولادنا انجبناهم عباقرة وبيجيبوا 100% يمكن الجينات بتاعتنا اتغيرت<br />حاجات مش عارف ليها تفسير<br />زمان صعب"
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820101102/http://masr.20at.com:80/newArticle.php?sid=11093"

[[comments]]
order = 3
subject = "زمان ..ودلوقتي.."
author = "شرين منصور ..معلقة دائما.."
text = "السلام عليكم .. للأسف لأول مرة الظروف هي اللي بتحدد نتيجتي مش مزاكرتي أنا لما جيت اعيش هنا في مصر اصدمت بالمستوى التعليمي الموجود في مصر غير اني كنت بتعامل مع وحوش مش مع ناس بشر يعني جيت اتصدمت بالواقع المصري من ناحية الناس ومن ناحية مستوى التعليم فده أثر عليا سلبا في النتيجة بس واضطريت اني ادخل جامعة خاصة ودخلت كلية تخليني أدخل الحاجة اللي كان نفسي فيها (اعلام) طبعا المجموع اللي جبتو كان يدخلني معهد لكن الحمد الله عدت الأربع سنين ولغاية دلوقتي حققت نص اللي انا عايزاه ..فأحيانا بنزعل زمان لكن تيجي دلوقتي وتبقى فرحان لأن زمان هو اللي خلاك تحقق حاجات كنت بتتمناها.نسيت اقولكم اني جبت في الثانوية العامة........ ولا اقولكم ما خلاص أنا دخلت وخلاص مستنيا شهادة التخرج بتاعتي .... بس لو الأيام ترجع بيا مش حزعل ولا اعيط زي زمااان .ده كان زمان احنا في دلوقتي..."
archived = "2007-08-20"
capture_url = "https://web.archive.org/web/20070820101102/http://masr.20at.com:80/newArticle.php?sid=11093"
