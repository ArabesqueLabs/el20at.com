text = "عففت فعفت رعيتك يا امير المؤمنين<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />القائل هذه العبارة سيدنا علي قالها لسيدنا عمر بن الخطاب رضي الله عنهما<br />وسبب هذه العبارة عندما فتح المسلمون ايران وهرب كسرى ارسلوا تاج كسرى لسيدنا عمر وطبعا التاج وصل من ايران الى المدينة من واحد لواحد لواحد الى ان وصل الى سيدنا عمر<br />فلما نظر سيدنا عمر الى التاج ووجده سليما تماما ووجد كل المجوهرات بالتاج كاملة لم ينقص منها اي شيء اندهش من امانة الذين اوصلوا له التاج<br />فقال له سيدنا علي عففت فعفت رعيتك يا امير المؤمنين<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />يعني باختصار علشان خاطر الشعب ينصلح حاله لازم الحكومة ينصلح حالها<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />طول ما الحكومة بايظه ومش نافعة الشعب حيفضل بايظ ومش نافع<br />ــــــــــــــــــــــــــــــــــــــــــــــــ<br />عايزين رئيس حكومة زي عمر خالد كده قلبه على البلد"
