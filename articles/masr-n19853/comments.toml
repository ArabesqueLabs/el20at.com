[[comments]]
order = 3
subject = "حفاظا على المصداقية وعلشان الناس تحترمكم - رجاءا ب"
author = "اى واحد زلنطحى"
posted = "2009-02-10"
text = "كانت لجنة الفتوى او دار الافتاء تتبع وزارة العدل سابقا<br />ثم فصلوها عن وزارة العدل وبقت مستقلة ووضعوا شخصية هزيلة على راسها ياتيها تليفون من مسئول كبير فى الامن - يا مولانا عايزين فتوى جامدة ضد حماس او ضد ايران او ضد قطر او ضد الاخوان وطبعا الشيخ جاهز وهب وتانى يوم يطلع فتوى بالمطلوب<br />طبعا رجل الشارع الزلنطحى اللى مثلى بيقعد يقلب على القهوة فى الفتوى دى - لية وعلشان اية - ولمصلحة مين - ومين المستفيد ومين اللى هيضار<br />وفى الاخر بيرمى فى الزبالة<br />ان الزلنطحية فى مصر يرفضون هذة الفتاوى الحكومية والقانون المفصل لصالح حزب او نظام ما"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213172206/http://masr.20at.com:80/newArticle.php?sid=19853"

[[comments]]
order = 4
subject = "جمع الزكاة والأضاحي وكفالة اليتامى وأمور الخير وال"
author = "مش كاتب"
posted = "2009-02-10"
text = "اخر سطرين في المقال<br />كون ان الفتوى تضمنت السطرين دول<br />يبقى اصلا ما فيش دولة لان الدولة هي المسئولة عن جمع الزكاه وتأكيدا لذلك حارب ابو بكر المرتدين من اجل الزكاه فجمع الزكاه هي وظيفة الدولة وليست وظيفة الجمعيات الخيرية يا فضيلة المفتي<br />وكفالة اليتامى دي مسئولية الدولة يا فضيلة المفتي مش شغلة الجمعيات الدولة هي المسئولة عن كل فرد في الدولة"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213172206/http://masr.20at.com:80/newArticle.php?sid=19853"

