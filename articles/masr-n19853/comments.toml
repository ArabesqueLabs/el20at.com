[[comments]]
order = 0
subject = "الجماعات الاسلامية هم امل مصر"
posted = "2009-02-09"
text = "وهم اللى غيروا المجتمع المصرى واصحاب النهضة الاسلامية فى كل ارجاء مصر<br />اما هؤلاء بتوع الفتاوى وبتوع المكاتب فليس لهم اى لزمة<br />وعلى فكرة لحظت منذا استيلاء الامن والاوقاف على خطب الجمعة المكتوبة والموجهة ان معظم الناس فى صلاة الجمعة بيدخلوا المسجد بعد انتهاء الخطبة ويقوم الصلاة فقط وينصرفون ولا يحبوا ان يستمعوا الى خطب هزلية مكتوبة تحت اشراف الامن والاوقاف<br />اما لجنة الفتاوى فليفتوا بمزاجهم على حسب ما يطلب منهم الامن"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213172206/http://masr.20at.com:80/newArticle.php?sid=19853"

[[comments]]
order = 1
subject = "واين الفتوى يا مولانا فى الحرامية اللى باعوا الدول"
author = "زعتوت"
posted = "2009-02-09"
text = "الفتوى بتقول ان حسنى مبارك امير المؤمنين - مين اللى قال كدة - وهل يا سعادة المفتى فية حاجة اسمها امير المؤمنين دلوقتى موجودة<br />وبعدين يعنى اية جماعات اسلامية ؟<br />هو اية اللى بيحصل<br />اية الدراما البايخة قوى اللى احنا عايشين فيها<br />سعادة المفتى بل فتواك فى كباية مية واشربها<br />والا اقول لك وخلينى قليل الادب - لفها قرقطاس وحطها زى اللبوس يمكن ترتاح<br />امير المؤمنين قال<br />يا اخى احة"
archived = "2009-02-13"
capture_url = "https://web.archive.org/web/20090213172206/http://masr.20at.com:80/newArticle.php?sid=19853"

