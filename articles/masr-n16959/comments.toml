[[comments]]
order = 0
subject = "القضاء العادل والنزية"
author = "مش لاعب"
text = "اللى خرجة من المطار من قاعة كبار الزوار وهربة برة البلد<br />هو نفسة اللى جاب لة البراءة<br />نفس القصة حصلت مع اكياس الدم الملوثة واجهزة غسيل الكلى بتاع الاخ اللى اخد براءة برضة<br />كلام رائع<br />دول بتوع لجنة السياسات وفريق لندن الشهير اللى كانوا حوالين الباشا وهو فى لندن<br />طبعا الناس اللى غرقوا فى نظر الحكومة شوية من الرعاع اللى ماتوا والبلد ارتاحت من ريحتهم المعفنة<br />وطبعا كل واحد من اهلهم ياخد تارة بايدة يشترى بندقية بروحين ويطخ اللى كان السبب<br />اللى ماتوا مش فراخ ولا كتاكيت"
archived = "2008-07-29"
capture_url = "https://web.archive.org/web/20080729033343/http://masr.20at.com:80/newArticle.php?sid=16959"

[[comments]]
order = 1
subject = "الظالمون"
author = "اى"
text = "ولا تحسبن اللة غافلا عما يفعل الظالمون"
archived = "2008-07-29"
capture_url = "https://web.archive.org/web/20080729033343/http://masr.20at.com:80/newArticle.php?sid=16959"

[[comments]]
order = 2
subject = "ضربنى وبكى وسبقنى واشتكى"
author = "بنت مصر"
text = "حسبنا اللة ونعم الوكيل - لا املك غير هذا الدعاء وانا اشعر بالمرارة والسخط على من ملكوا هذة البلد وماهم الا مجموعة من اللصوص وقطاع الطرق -لك اللة يامصر وياشعب مصر المستكين المسالم ول ماشى جنب الحيط<br />واهى الحيط كمان وقعت على دماغة"
archived = "2008-07-29"
capture_url = "https://web.archive.org/web/20080729033343/http://masr.20at.com:80/newArticle.php?sid=16959"

[[comments]]
order = 3
subject = "مبروك لممدوح اسماعيل و ليتنا كنا ممدوح اسماعيل"
author = "ممدوح زكى زخارى"
text = "حقا الف مليون مبروك لممدوح اسماعيل على البراءة والتى انصفة فيها القضاء العادل بمصر<br />ليتنا كنا ممدوح اسماعيل<br />القضاء يحكم بالمستندات و ليس بالعواطف و الدموع و هتافات الحناجر الغبية<br />دعونا نعمل و نعيش<br />و الف الف الف مليون مبروك لممدوح اسماعيلو ليتنى كمنت ممدوح اسماعيل حقا و ليس ممدوح زخارى"
archived = "2008-08-08"
capture_url = "https://web.archive.org/web/20080808013014/http://masr.20at.com:80/newArticle.php?sid=16959"
