order = 0
subject = "اشرف زكى والتصرفات الغبية"
author = "المعلم كرشة"
posted = "2008-04-28"
text = "شعوب العالم العربى بتفهم اللهجة المصرية والسبب السيتما والمغنى والفن والفنانين فى الدول العربية عاوزين يكسبوا خبرات ناس سبقوهم فى المجال لغاية مبقت صناعة السينما حاجة بتدرفلوس على اللى بيشتغلوابيها والمشاهد والمستمع مبسوط يجى واحد زى سى زكى بقرارات تاميم السينما والمسرح والتلفزيون بحجة انة عاوز وشوش جديدة تشارك فى مسلسلات رمضان قرار زى دة لو اتنفذ المنتجين حيهربوا يصورو فى دبى او اى مكان وياخدو الممثلين اللى هما عاوزينهم يشركوا فى العمل بعيد عن فرمانات سى زكى وبكدة سى زكى حيطفش الفنانين لغاية ميعملوا مدن انتاج ويصورو بيها ويصدروا لسى زكى علشان يتفرج على خيبتة"
archived = "2008-05-01"
capture_url = "https://web.archive.org/web/20080501153410/http://masr.20at.com:80/newArticle.php?sid=15471"

[[comments]]
order = 1
subject = "السينما فى مصر طول عمرها اسمها السينما  العربية ول"
author = "المعلمة شضل"
posted = "2008-04-28"
text = "لو كان الغبى صاحب القرار قرأ شوية عن السينما المصرية وكيف كانت تصنع الافلام<br />مثلا احد الافلام كان يضم الابطال المصريين ومعهم اللبنانى عبد السلام النابلسى بخفة دمة ليضمن توزيعة فى بر الشام<br />وكذلك المطربة صباح بدلعها وحلاوتها فى الغناء والافلام<br />ثم فايزة احمد السورية<br />ثم استيفان روستى المجرى المصرى<br />واسمهان وفريد الاطرش والبطل انور وجدى العراقى<br />لم تزدهر السينما المصرية الا بالدماء العربية من شتى اقطارها وكلهم تكلموا باللهجة المصرية البسيطة المحببة لدى الشعوب العربية<br />ثم الم تلمع وردة الجزائرية فى مصر<br />وعليا التونسية<br />وغيرهم من المغرب<br />لماذا الدعوة للانعزالية والقوقع<br />لماذا هذا الغباء ؟<br />هل ننحدر فى جميع المجالات"
archived = "2008-05-01"
capture_url = "https://web.archive.org/web/20080501153410/http://masr.20at.com:80/newArticle.php?sid=15471"

[[comments]]
order = 2
subject = "اشرف غبى اية دة فضحتنا بهوليوود وبليوود"
author = "ماسبيرو"
posted = "2008-04-29"
text = "شوية بيروقراطية على شوية هبل يعنى لو اللى اسمة اشرف مش عارف اية بيشتغل لمصلحة الفنانين فى مصر ويبقى عامل بناء لامعول هدم بنشر الثقافة الفنية والادب المصرى فى الوطن العربى والعالم عن طريق المسلسلات والافلام وغيرة وغيرة انا بنصح النقيب اشرف انة يشوف لة حاجة ينقب بيها غير النقابة دى لانة بالفعل اثبت وبما لايدع مجال للشك انة اشرف غبى"
archived = "2008-05-01"
capture_url = "https://web.archive.org/web/20080501153410/http://masr.20at.com:80/newArticle.php?sid=15471"

