subject = "قرار صحيح 100%"
author = "T.F"
posted = "2008-05-10"
text = "قرار صحيح 100% مش كل من هب ودب يمثل بصراحة انا ارى في السينما المصرية ممثلين من برة فاشلين جايبهم المخرج او المنتج عشان يخلي المشاهد يتفرج على اجسادهم او عشان يعملوا مشاهد بوس احنا عاوزين من برة ممثلين على مستوى عالي يستحقوا انهم يدخلوا السينما المصرية وهم فعلا لو كانوا ناجحين كانوا نجحوا في بلدهم الاول"
archived = "2010-03-14"
