text = "هى اية الحكاية انتوا معلقين على المنايفة اوىى كدة لية هو صاحب الموقع منوفى ومش بتخدو مرتباتكم ولا اية وعايزين تعرفوة وتفضحوة ولا اية الحكاية اشمعنا المنيفة يعنى المركزين عليهم اوى كدة."
archived = "2009-02-06"
