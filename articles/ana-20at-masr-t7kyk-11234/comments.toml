author = "مش منوفى"
posted = "2009-01-29"
text = "احد المنافية بيطلع اشاعة بيقول فيها ان العندليب الاسمر اوباما حسين اوباما اصلة منوفى ابن منوفى<br />واحد الكارهين للمنافية بيقول انة بحث فى الاطلس المحيط عن معنى كلمة منوفى فطلع معناها انة ابن _______"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221111/http://ana.20at.com:80/20at/masr/t7kyk/11234-19633.html"

[[comments]]
order = 2
subject = ""
posted = "2009-01-29"
text = "كانت النكت على المنايفة وكان تقريبا عندى كراسة كلها نكت عن المنايفة المجندين والشاويشية وكانت احلى نكت تقال عنهم فى ذلك الوقت ولم يكن موضوع الصعايدة ظهر<br />ولشدة تعلق المنايفة بالميرى وحياة الجندية ظهرت عليهم الاف النكت التى للاسف ضاعت من الذاكرة مثلا<br />شويش منوفى طلع من الجيش راح بلدهم زرع ارض ابوة الغام<br />ضرب البروجى فى تلا وقفت منوف تلاتات<br />شاويش منوفى خلف ولد سقاة الرضعة فى زمزمية<br />المنوفى بيفتخر ويقول شريطين على كمى ولا فدانين عند امى<br />المنوفى لما يتعور يخر دم كاكى"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221111/http://ana.20at.com:80/20at/masr/t7kyk/11234-19633.html"

