subject = "سمعة زى الزفت"
author = "محمد السيد"
posted = "2007-10-06"
text = "الاخبار العالمية وفى تلفزيونات العالم كلة الخبر بيتذاع وكلهم بيكلموا على حبس الصحفيين<br />والديكتاتورية وعدم وجود رأى معارض<br />خطوة غبية من الحكومة وغبية جدا<br />ومحدش بعد كدة فى العالم هيصدق الكلام الفارغ عن الديمقراطية والبدنجان فى مصر<br />واذكر عواجيز الحكومة اننا مش فى 1930<br />ايام الاحكام العرفية<br />احنا فى 2007"
