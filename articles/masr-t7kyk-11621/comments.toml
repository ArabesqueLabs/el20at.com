order = 1
subject = "تحليلك لظاهرة الحرامى زمان مش صح"
author = "سحس مساعد كرومبو"
posted = "2009-03-18"
text = "زمان يا عزيزى كانت فرص العمل كتير ومفتوحة امام الناس كلها واللى عايز ياكل لقمة شريفة وحلال كل الابواب مفتوحة قدامة - يبقى يسرق لية ؟<br />طيب اذا سرق ؟ الناس فى الحالة دى كانت بتضربة بالجزمة وفى قلب الشارع<br />انما دلوقتى<br />الناس مش لاقية اللضى وبتنام جوعانة بفضل سياسة الحزب الغير وطنى اللى جوع الشعب<br />دلوقتى يا عزيزى - مين اللى بيتوظف فى الحكومة ؟<br />اللى بيتوظف فى الحكومة دلوقتى فية اسعار لكل وظيفة<br />اللى عايز يبقى ضابط بيدفع من 80 الى 100 الف جنية رشوة لاحد الرتب او الواصلين<br />واللى عايز يشتغل فى البنوك - بيدفع من 50 الى 60 الف جنية برضة لاحد الواصلين<br />وحتى اللى عايز يشتغل فى الاوقاف بيدفع من 30 الى 40 الف جنية<br />كل وظيفة ولها سعر<br />طيب بقى والناس الغلابة اللى ابوهم موظف على قد حالة او اللى على باب اللة يشتغل اية او يروح لمين<br />قدامة طرق مختلفة - يشتغل مساعد مبلط او مساعد عامل محارة او يوزع انابيب بوتاجاز<br />او يشتغل حرامى<br />او يتفق مع امين شرطة يعطية فردة ويتاجر فى البانجو<br />واذا كان ولد صحتة كويسة وقلبة جامد يشتغل حرامى<br />والناس عارفة ظروفة اية<br />فهمت يا جميل الفرق بين الزمن القديم والزمن الحالى اية"
archived = "2010-03-14"
capture_url = ""
