[[comments]]
order = 2
subject = "لاشيء الإَ الفراغ في المملكة العربية السعودية ..."
author = "محمد نواف الحمدالله ..."
posted = "2007-11-20"
text = "أولاً المملكة العربية السعودية .. بكل ماتملك من مقومات سواء أكانت هذه المقومات طبيعية كالنفط على سبيل المثال لا الحصر .. أو مقومات بشرية كالأعمال التجارية الحرة (( البزنس كما هو متداول بيننا ))، هي مجرد سفينة أو يخت وقبطانها هو أمريكا ونائب القبطان هي إسرائيل .. فإذا كانت المملكة على حد قولكم قادرة على عمل المستحيل .. وتغيير العالم أجمع .. من المحيط للخليج .. فهذا بالتأكيد خيال ووهم لايوجد الإَ بالأحلام السعيدة .. حيث كما قلت السعودية لها أسياد ويجب أن تطيع أوامر الأسياد وتنفيذ أوامرهم .. قد يظن البعض للوهلة الأولى بأن هذا كلام حاقدين عدويين على السعودية ؟؟!! ولكن الحقيقة غير ذلك بتاتاً .. فالسعودية هي عبارة عن قلم يوقع على قرارات أمريكية _ إسرائيلية ، يعني وبالعامية (( عليهم عليهم .. معاهم معاهم )) .. هذا ناهيك عن تاريخ هؤلاء الحثالة .. حثالة المجتمع العربي بل المجتمع بأكلمه .. حيث أن تاريخهم يحمل كل معاني الخزي والعار .. وبنفس الوفت الشفقه والتحسر على مافات .. تاريخ أسود سواد الليل .. لاداعي لذكر الماضي .. فمن يريد أن يعرف تاريخهم .. فالتاريخ كفيل بكشفهم ، وأنهم كانوا وراء كل ماحدث من تقسيمات داخلية وخارجية في الوطن العربي (( ويا له من وطن عربي!!!! )) . فمن هو مسؤول عن كل مايدث في : فلسطين، العراق، أفغانستان، الشيشان، البوسنة والهرسك، الصومال، .. الخ<br />فهي أساس كل المشاكل .. يالسخرية القدر .. هذا وأنتم من شجرة النسب الشريف للرسول // عيله أفضل الصلاة والسلام // .. ف والله .. لو كان الرسول حياً ليومنا هذا ويرى كل ماحدث في هذا العالم من تدهور فظيع .. لأختار قبره بلا أدنى شك .. يالسخرية القدر !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! . وشكراً"
archived = "2010-03-14"
capture_url = ""

