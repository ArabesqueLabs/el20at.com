[[comments]]
order = 12
subject = "رجاء أقرأ أولاً قبل أن تهاجم"
author = "المهندس السلفي"
text = "أخواني الكرام ... قراء هذا الموضوع ..... لماذا الهجوم علي السلفية دون دليل .. ماذا تعرف عن المنهج السلفي حتي تهاجمه ؟ لا أظن الكثير يعلمون شيئاً ... أود من كل من يقرأ هذا الموضوع ويفكر في مهاجمة السلفية ورميها بتهم هم براء منها مثل التكفير والتشدد والسطحية وهذه التهم المُعلبة الجاهزة ... أود من كل هؤلاء أن يقرأوا شيئاً لمشايخ السلفية حتي يعرفوا قدر هذا المنهج ودلالته وأنه أفضل الطرق لتحقيق سعادة الأمة الإسلامية ومن هذه الكتب ( أي كتاب للشيخ محمد حسين يعقوب فهي كتب تربي وتؤدب وتهذب النفس بشدة ------ كتاب الدكتور علاء بكر عن النهمج السلفي ---- كتاب الدكتور أحمد فريد ويُسمي \" الأصول العليمة للدعوة السلفية \" وهو كتاب رائع جدا ويتميز بسهولة الأسلوب ---- ومن أراد كتب أكثر عمقاً وتحليلا ولكنها تحتاج إلي مستوي عالي من الفهم كتب الدكتور مصطفي حلمي \" أصول وقواعد المنهج السلفي \" وكتاب \" السلفية والحضارات الغربية \" والله الموفق والمُستعان"
archived = "2007-08-19"
capture_url = "https://web.archive.org/web/20070819191857/http://masr.20at.com:80/newArticle.php?sid=10710"
