[[comments]]
order = 9
subject = "السلفية والتاريخ"
author = "عربي"
text = "التاريخ عند المفكر السلفي متماثل الآنات واللحظات والمراحل غير متحرك أو متطور، بل قد يجمد على النص برؤية متوحدة ومتفردة مخرجة الاراء المخالفة خارج حضيرة الايمان متذرعة بآيات الكفار والمشركين ورميها ونسبها للمسلمين ممن يخالفوهم ولا يوجد عندهم نظره مستقبلية وتعايشية للآخر بل متجمدين حول التاريخ وبفلك الحكام والدكاتوترين عبر التاريخ العربي من الاموين وصولآ للعباسين وعلى فترات متقطعه من اشخاص منتقين انتقاء \"تحت مسمى السلف الصالح\" ولا ادري هل غيرهم غير صالح؟ ولماذا؟ فالخطاب السلفي الديني حائر بين ثلاث اتجاهات : الجمود الشديد والحرفية النصية والتطرف في محاولة تجديد الخطاب الديني ليتطور إلى طعن في ثوابت الدين (القرآن والسنة) من حيث هي ، ومحاولات \"شورعة\" الخطاب وجعله أكثر سلفيه.. والثلاثة أخطر من بعض! والحدير بالذكر ان اي دولة دخلتها السلفية لا تخرج منها الا وهي ممزقه ومتناحرة فلا ننسى افغانستات والجزائر وفلسطين وما يحدث بالعراق!"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

