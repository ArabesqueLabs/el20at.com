text = "المشكلة فى تلامذتهم واحبابهم<br />نموذ سئ للحوار والتعامل<br />يكفى انهم يريدون السيطرة على هذا المنتدى<br />بالخناق والتشاجر وقلة الادب<br />ربنا يرحم الاسلام منهم ومن مشايخهم<br />http://z3tr.loaloaa.com"
