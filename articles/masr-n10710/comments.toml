[[comments]]
order = 0
subject = "محمد سالم"
author = "السلفيه تعني باختصار نوايا طيبه وعمل فاسد"
text = "السلفيه تعني بانسبة لي ..منهج واناس يظنون انهم يمتلكون الحقيقه المطلقه والفهم الصحيح لشتي مناحي الحياة دون غيرهم<br />السلفيه تعني عندي التشدد وضيق لالافق والغلظه في التعامل وعدم القبول بالاخر<br />السلفيه تعني عندي ان العالم هما فسطاطين هما فسطاط السلفيين الناجيين وفسطاط اخر يجتمع فيه كل الذين يخالفونهم<br />السلفييه تعني عندي التمسك بالقشور والتنطع والاستعلاء علي الغير<br />السلفييه تعني عندي مداهنة الطغاه والقبول بالديكتاتوريه والسكوت عن الحاكم الظالم<br />السلفيه تعني عندي رفض الديمقراطيه وارفض المجتمع الحديث<br />السلفيه تعني عندي التكفير والمغالاه وبروز الفتن<br />السلفيه تعني عندي باختصار نوايا طيبه وعمل فاسد"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

[[comments]]
order = 1
subject = "السلف الصالح"
author = "فهد"
text = "بسم الله الرحمن الرحيم وصلاة وسلام على سيد المرسلين سيدنا محمد عليه واهلة وصحبة الصلاة والتسليم الاستاذ الفاضل الدسوقى احمد مقال جميل مع بعض التحفظات بدات المقال يعنى مش ولا بد ى تعريفك با لسلفية هو السلفى دة جماد دة انسان ولية فكر واكيد بياكل ويشرب يعنى مكنش لية لازمة المقدمة دة لو نظرت الى الغلبية العظمى من المصرين هتجد ان الغلبية سلفية يعنى احنا فى كل المسايل الفقهية دايما بناخد برى سيدنا رسول الله او اصحابة الطاهرين او التابعين الموثقين اما مصدر الخلاف بين الجماعة السلافية والاتجهات الاخرى فاسلفية ان كانت تتشدد فانها تتشدد لدين الله اما عن الشيخ الغزلى فانا اعرف عنه انة كان متشدد لانة كان من الا خوان المسلمين اما اذا جانا الى الى موقف السلفية من حزب الله وحرب لبنان الا خيرة التى قادة حزب الله الرافضى بقيادة هذا المسمى حسن نصر الله فانا اووكد للك ان الشيعة هم فرقة كافرة عن ملت الاسلام وكيف ان السلفيفة التى تاخذ بمنهج السلف الصالح تدفع عن فرقة مرقة تتمسح فى الاسلام ودليلى ادخل على موقع هولاء الشيعة وشوف رايهم فى القران فالقران عندهم محرف وسيدنا اب بكر وعمر وعثمان هم طوغيط اغتصبوا الخلافة من سيدنا على سيدنا على هو من سيدخل الناس الجنة والنار ام المومنين وسيدة نساء العالمين فاطمة الزهراء هى عندهم افضل من ابية سيدنا رسول الله ام المومنين عايشة حبية رسول الله هى فى نظرهم زانية وكافرة والعياذ بالله فعلا فان التقريب بين هولاء الشيعة ونحن السنة لن يثمر عن شيى لانهم لا يودون التقريب بل الترهيب وانت على علم بيما يحدث فى العراق مع هذة الفرقة المارقة اقراء كتبهم وسترا العجب من المجلسى للقمى لنقمة االله الجزايرى للخمينى الذى اباح معاشرة الرضيعة معاشرة جنسية الى زواج المتعة الى كتبهم التى توله سيدنا على وابناية واشياء كثرة لا استطع ان احصية فان اكتب هذا واعرف انى قد اكون قد خرجت عن الموضوع الريسى بس لازم الناس التى تدعو للتقريب تعرف هى هتتقرب من مين اما عن شيوخنا العظام وعلى راسهم فضلية الشيخ محمد حسان فلا استطع الا ان اقول لهم ان للله رجلا صدقوا ما عهدو الله عليه ويكغى فخر ان فى مصر ولا الوطن الاسلامى احد لايعرف هولاء النجوم الذين انروا سماء الاسلام بعد ان كانت قد اظلمت يمكن فية ناس تعرف مين هو محمد حسان ولا تعرف من هو شيخ الازهر مع احترامى للزهر الشريف منارة الاسلام بس لو يشليو القلمين عليه دعاة التقريب وفى النهاية مقال جميل واعزك الله بنور الاسلام يا دسوقى افندى"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

[[comments]]
order = 2
subject = "كفانا تشرذما"
author = "طال الليل"
text = "السلام عليكم<br />أرجو الا نخلط بين السلفية كمنهج يدعو لفهم الإسلام كفهم الأولون وبين أعمال من ينتسبون إلى السلفية<br />أنا أفخر بأنى سلفى العقيدة والنهج ولا أكفر أحدا إلا من أعلن الكفر وخرج من الملة بيقين مختارا وليس كل من خالفنى وكفى أمتنا تشرذما ولنتكاتف جميعا للخروج من نفق الجهل والتخلف المظلم الذى تاهت وتوهت فيه أجيال الأمة<br />كفانا أحكاما مسبقة على الفكرة ومحاكمة للنوايا لنتسامح فى ماوسعته النصوص المقدسة ولنترفع عن لغة الإقصاء والتجهيل<br />محبتى للجميع وأولهم أخى سالم وأعذره وأصدقه فلكم عانى الإسلام من نماذج المستسلفين ولكم عانى الناس ليفرقوا بين السلفى والتمسح بالسلف لجاجة وغرض فى نفسه المهتزة"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

[[comments]]
order = 3
subject = "السلفية سلفية القلب وليست سلفية الشكل"
author = "مش ضروري"
text = "الموضوع له صورتان صورة رجال ملتحين والصورة داخلية واحدة لابسه نقاب<br />وعمر ما كانت السلفية في الشكل ابدا في اللحية والجلباب القصير والنقاب والعباية مع انها صحيح حاجه مهمة<br />ولكن الاهم من ذلك سلفية القلب الخاشع لله وسلفية العمل واولويات العمل<br />يـــا ســائـراً نــحـو الـنـبـي iiمـشـمراً<br />اجهد فديتك في المسير وفي السرى<br />وتـــذرع الـصـبر الـجـميل ولا iiتـكـن<br />فــي مـطـلب الـمـجد الأثـيل iiمـقصرا<br />وتـــوخ آثـــار الـنـبـي فــضـع iiبـهـا<br />مـتـشرفاً خـديـك فــي عـقـر iiالـثـرى<br />واعــلـم بــأنـك مــا رأيــت iiشـبـيهها<br />مـذ كنت في ماضي الزمان ولا iiيرى"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

[[comments]]
order = 4
subject = "لازم نفهم"
author = "ابو اسامة"
text = "ايوة لازم نفهم انه ليس فى ديننا اى مسمى غير الأسلام او الأيمان يعنى ممكن نقول مسلمين او مؤمنين فانت عندما تقول سلفيين وتحدد مجموع بعينها اى ان باقى الناس ليسوا سلفيين وسلفيين تعنى اننا على نهج الرسول ومن تبعه من السلف الصالح اذا هذا التعريف لايختص بمجموعة من المسلمين فنحن جميعا على نهج الرسول والسلف الصالح من بعده<br />وكذلك اى مسمى غير هذين فانا اعترض على المسميات كما اعترض القرآن فى قوله تعالى(ان الذين فرقوا دينهم وكانوا شيعا لست منهم فى شىء)صدق الله العظيم و فى قوله(كل حزب بما لديهم فرحون)وقول الرسول (ص) تتفرق امتى على<br />ثلاث وسبعون فرقة كلها فى النار كلها فى النار الاواحدة فقال الصحابة فمن نتبع يا رسول الله قال اتبعوا كافة الناس وعامتهم فاءن امتى لاتجتمع على زور. وهذا فيما معنى الحديث حتى لااكذب على رسول اذا فان الرسول قد نهى عن الفرق ودعى الى اتباع كافة الناس اى انه لايأتى احد ويدعى انه يمتلك الحقيقة ويبعد الناس عنها فالناس جميعا مسلمين<br />على نهج محمد ومن تبعه من السلف الصالح حتى الشيعة فكل من قال لااله الا الله فقد وقع اجره وحسابه على الله<br />وارجوا من الأخوة الذين يكفرون ان يتقوا الله فاءن من يحاسب الناس على اعمالهم وقلوبهم هو الله ولم يخص احد من البشر بذلك وليذكروا قول رسول الله وفيما معناه ايضا(من قال لأخيه يا كافر فقد ردت عليه )اى هو الذى كفر .واتقوا الله"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

[[comments]]
order = 5
subject = "التفرقة بين الادعاء والعقيدة"
author = "البغدادي"
text = "علينا أولا أن نفرق بين السلفية كعقيدة وبين من يدعون انتمائهم للسلفية ، أما عن السلفية كعقيدة فهي عقيدة كل مسلم ، وهل المسلم إلا متبع لسنة رسول الله صلى الله عليه وسلم وسلفه الكرام ، وأعيب على الكاتب ما تناوله في بداية مقاله من إرجاع هذا الفكر إلى الأئمة الأربعة وكأنه يقول لنا (بعد ان ذكر لنا أنهم بشر مثلنا) حتى لا نخاف منهم !!<br />أن هذا الفكر المتشدد وهذه العقيدة (الجديدة ) نشأت منذ ذاك العهد . وأقول له بأن هذا الفكر هو الذي أخذناه من صحابة رسول الله وتابعيهم وتابعي تابعيهم ، وأما الذين يدعون الفكر السلفى فهؤلاء يقولون مالا يفعلون حيث تجد أكثرهم رغم اهتمامهم الشديد بالسنة والفروض ، إلا إنهم لا يطبقون الدين في واقعهم العملي ، فهم يهتمو ن بالمظهر ( اللحية والجلبية القصيرة ) أكثر من المضمون . والله تعالى أعلى وأعلم ."
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

[[comments]]
order = 6
subject = "رحمة"
author = "shima"
text = "طبعا الموضوع علق عليه كثيروووووووون<br />و لكن دعنا نتفق ع شىء مهم<br />التعميم خطأ بكل المقاييس<br />نعم السلفية تيار دينى و فكرى منتشر جدا ليس ف مصر فقط و انما غيرها من البلاد العربية<br />و لكن ليس كل سلفى ينطبق عليه ما قيل و يقال و ع فكرة لست سلفية و انما مسلمة عادية من امة محمد<br />السلفيون لهم ما لهم و عليهم ما عليهم<br />ليسوا ملائكة و لا شياطين<br />و الله وجود كل هذه التيارات رحمة من ربى<br />لانها ببساطة تحدث توازن مطلوب و بشدة فى المجتمع"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

[[comments]]
order = 7
subject = "رأيي الشخصي"
author = "مصري بيحب بلده قوي"
text = "أنا شايف اننا في أشد الحاجة للمنهج السلفي ومبادئ المنهج السلفي.. مش بس في الشكل (مع أهمية كل السنن بالطبع لأنه لا يوجد \"قشور\" في الإسلام,) ولكن في المضمون كمان.<br />وغلط جداً الحكم على منهج من خلال أتباعه .. المسلمين النهاردة في قمة الضعف والتشتت .. هل يعني ذلك أن الإسلام دين ضعف وتشتت؟ أترك الإجابة لكل من يختلف معي في هذه النقطة.<br />وفي الأخر: تحية لكل العلماء المسلمين حملة المنهج السلفي (في مصر وفي كل أنحاء العالم)"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625181315/http://masr.20at.com:80/newArticle.php?sid=10710"

