subject = "كلمة حق"
author = "هبــــة"
posted = "2009-02-12"
text = "الاستاذ أحمد الصحفى المعروف صاحب البرنامج الجرىء الطبعة الأولى يعتبر من الصحفيين القلائل الذين يقولون كلمة حق بدون مجاملة او محاباة .فعندما استمعت له لاول مرة شدنى القاءه وعرضه للقضايا وتحليلها<br />فهو من رجال هذه الامة الذين سيأتى النصر على ايديهم<br />فالله اسأل ان يرزقه الاخلاص فى القول والعمل"
archived = "2010-03-14"
