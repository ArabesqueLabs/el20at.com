text = "أحب أرحب بالجميل دائما أحمد المسلمانى .. وهو من الاعلاميين القلائل الى قدروا يعملوا مكانه كبيره فى عقل وقلب المشاهد من خلال التحليل الهادىء اكتر من الفرقعات الغوغائيه التى اصبحت مسيطره على اعلام هذه الفتره . تحياتى"
