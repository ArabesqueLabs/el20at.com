subject = "سؤال"
author = "محمد"
text = "مع احترامي الكامل لأحمد المسلماني أو غيره .. ارجو بلاش التضخيم واصباغ الاشخاص بالالقاب عمال على بطال<br />فليس كل من طلع في برنامج على التليفزيون يبقى اعلامي كبير والكاتب الكبير والكاتب الصحفي الكبير ... ارحمونا وياريت نبقى معتدلين في حياتنا وبلاش مبالغات."
archived = "2008-07-27"
