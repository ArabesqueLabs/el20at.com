[[comments]]
order = 0
subject = "اية اللى رماك على الغلب"
author = "على ابو مندور"
posted = "2007-11-08"
text = "اية اللى رمى الشباب دى فى مواجهة الموت غرقا ؟<br />المر<br />اية اللى رماك على المر قال لة اللى امر منة<br />حال البلد بقت مرار<br />والعيشة بقت نكد<br />وبتوع الوطنى يقول لك المحافظة على المكتسبات<br />اى مكتسبات<br />الموت انتحارا على شواطىء الاجانب"
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110195744/http://masr.20at.com:80/newArticle.php?sid=12345"

[[comments]]
order = 1
subject = "عشرينات الوطني الديموقراطي"
author = "alexomania"
posted = "2007-11-08"
text = "عشرينات إتعلموا نظام الكيف<br />التعليق اللي علي كيفهم و علي هوي اللي حاطط الموضوع يفضل ده كويس<br />أما اللي يكون له وجهة نظر تانية يولع بقي<br />يحطوا له تعليق ساعتين تلاتة يفرح بيه و بعد كده إحذف يا جدع"
archived = "2007-11-10"
capture_url = "https://web.archive.org/web/20071110195744/http://masr.20at.com:80/newArticle.php?sid=12345"
