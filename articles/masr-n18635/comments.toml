[[comments]]
order = 1
subject = "مشاريع اية وبدنجان اية"
author = "صباح الفل"
posted = "2008-11-30"
text = "مشاريع اية ووهم اية اللى هيعملها الناس الغلابة<br />الشباب يوزع انابيب بوتاجاز<br />يفتح كشك سجاير ويبيع كشاكيل وكراسات مدارس زى مشاريع الحزب الوطنى<br />دة اسمة هبل وخبل<br />التنمية هى مصانع زى ما عمل طلعت حرب والدكتور عزيز صدقى وتشغل عمالة كثيفة ومحتاجة لرأسمال كبير يمولة بنك وتخطط لة دولة<br />خليك فى الدعوة يا اخ عمرو<br />وبلاش هبل<br />وخللى التنمية لاصحابها فى الدول التانية"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201155926/http://masr.20at.com:80/newArticle.php?sid=18635"

[[comments]]
order = 2
subject = "حسبنا الله وكفى"
author = "اكتب اسمك هنا"
posted = "2008-12-01"
text = "ليه لأ ايوا عاوزين نصلح التعليم و نحمي الجهل و التطرف بالعلم و اعلطف على الفقراء و المساكين ,ايه الحرام في كده و ليه بتقولو كده على ا. عمرو خالد ؟ وشايبين المغنيين الهابطين و و دعاة العري في البلد و الفساد في كل مكان من ادمان و دعارة و فسق و رشاوي ."
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201155926/http://masr.20at.com:80/newArticle.php?sid=18635"

[[comments]]
order = 3
subject = "الحمله هتستمر بإذن الله"
author = "حبيبه الرحمن"
posted = "2008-12-05"
text = "بسم الله الرحمن الرحيم<br />بلاش يا جماعه نستهزأ بحد ده اولا<br />ثانيا الحمله هتستمر بإذن الله تعالى<br />و بعدين الموضوع مدروس كويس و اللى بيبوظ البلد عدم الامل فى اصلاحها<br />و المشاريع ديه مش هبل ده بجد و الموضوع مش معمول من سراب الموضوع مدروس<br />و معمول تجارب على عدد كبير من الناس و نجحت التجارب و الاطفال رجعوا المدرسه فعلاو السره بدأت تشتغل<br />و بعدين هى مش فوضى احنا بندرس و نرتب و بنعمل اجتماعات كتير و عملنا عمل جماعى و كلنا ايد واحده هننهض بالبلد<br />و هنساعد الناس و هنقضى على الفقر و البؤس و استاذنا و معلمنا هو دكتور عمرو خالد<br />عمرو خالد هو الاب الروحى لكل شباب صناع الحياه و هنمشى على خطاه و هنصلح بلدنا و هنعمل نهضه بإذن الله<br />ياريت اللى عنده تشجيع يقوله و اللى مش عنده يسكت و يتفرج من بعيد و مش يحبط حد و لا يتريق على مجهودات ناس تعبانه بجد<br />و عامتا اللى يهمنا ان ربنا راضى عننا و عن استاذنا عمرو ان شاء الله"
archived = "2010-03-14"
capture_url = ""
