author = "الجاموسة بكام"
posted = "2009-10-28"
text = "الجاموسة ب 10000 جنية اى عشرة الاف جنية بالتمام والكمال<br />والاسبوع دة وصل سعر كيلو اللحم فى القرية الى 40 جنية بزيادة اربعة جنيهات عن الشهر الماضى<br />وطبعا القطار يستطيع ان يفرم عشر جواميس اذا وقفوا فى طريقة ولا يتاثر ولا يحدث اى عطل اطلاقا<br />وفى بعض البلدان يسير القطار وسط الغابات والزراعات ويصدم حيوانات ولا يحدث لة اى شىء<br />انما ما حدث فى قطار العياط فشىء يدل على الاستهتار الفنى الشديد وكان المهندسين فى البلد ماتوا وان بتوع السكة الحديد اصبحوا بتوع مراجيح<br />فقد صدم الجرار الجديد الجاموسة فنتج عن الصدمة كسر ماسورة هواء الفرامل فتسرب الهواء من الخزان الى الخارج ونتيجة عدم وجود هواء ادى الى تشغيل الفرامل وايقاف الجرار والقطار<br />الخطا هو ان الجرار الجديد ليس مركب فى مقدمتة صدامة او اكصدام خارجى يدفع اى شىء من احجار او حيوانات على القضبان امام الجرار بعيدا عن الجرار<br />لماذا لم تركب الهيئة الصدامة امام الجرار<br />وحتى السيارة العادية فيها صدامة او اكصدام من الامام لحماية السيارة عند الاصطدام من الامام<br />هناك اهمال فى وسائل الاتصال<br />ميكانيكى"
archived = "2010-03-14"
