author = "سحر القطار"
posted = "2009-10-28"
text = "ونحن اطفال فى الابتدائى كان نقف امام مزلقان القطار مبهورين وهو يجر سبعين عربة بضاعة ورائة فى قوة<br />وطبعا كان الخيال يسرح فى مدى قوتة وجبروتة<br />واظن ان عدد كبير من المهندسين الميكانيكيين كان القطار هو مدخلهم الى دراسة الهندسة اذ دخل خيالهم مبكرا منذ الطفولة<br />وكان الفلاحون قديما فى حقولهم يعرفون الوقت من صفارة القطار فاذا صفر القطار قال فلاح لاخر دة الساعة اتناشر قطر اتناشر بيصفر<br />كان القطار بيشتغل بالساعة والثانية مفيش تاخير ومفيش اهمال ومفيش جواميس بتشغلة ولا توقفة<br />طيب الحوادث لية<br />سوء التحكم وسوء الاتصال<br />فى المطار مثلا<br />على نفس ممر الهبوط بتنزل طيارة كل خمس دقائق وما بيخبطوش فى بعض لان برج المراقبة شغال مع كل الطيارات وبيكلم كل الطيارات وبيعطى تعليمات انزل خفض ارتفاعك انزل الممر جاهز<br />المفروض فية مركز تحكم يكلم كل القطارات انت فين وسرعتك كام ومشاكلك وفى اى محطة والقطار اللى وراك كذا واتصرف ازاى<br />لو فية مركز تحكم زى مركز تحكم الشبكة الكهربائية الموحدة وزى برج تحكم المطار كل المشاكل هتنحل<br />انما قطار وسواق تاية فى البرية وبيعتمد على السيمافورات وعمال السيمافورات فدة مرفوض"
