text = "يا ست رضوة انا ما بطول عليك بس انو رغم جزء كبير من انتقاضك في محله بس انت امحوره جميع مشاهد الفلم لشيئ سلبي. يعني في مشاهد اجابية صحيح قليله بس موجوده.<br />وكمان بدون حيازيتك للجانب العربي فيه اشياء اعتبرها انتقاد لواقع موجود للاسف<br />يعني ليش زعلانه عالعرب ومهما مش زعلانين على انفسهم؟؟؟؟<br />كان باستطاعتهم يطورو اساليبهم وطريقتهم ومعرفتهم عشان يقدرو يثبتو نفسهم ولو كان هاذا حصل ما كان تجرأ هؤلاء الامريكان بتصوير الفلم بهالطريقه<br />يعني باختصار العرب جابوه لحالهم بالوبه بالحياة واعتمادهم على الامريكان واصبحنا دول مستهلكه رغم الغنى الموجود لدينا"
