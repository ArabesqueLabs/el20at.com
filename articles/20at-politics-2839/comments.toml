text = "صدقونى ما حد بيهتم بالقدس ولا راح يهتملها الا احنا الشعب اللى كل همه انو يشتغل ويعيش عشان يحيب لولاده لقمة ويعيشهم بسلام واعوا تفكروا بيوم من الايام انو حد من الرؤساء ولا الحكام بيهتموا بالعكس هما مهتمين بشغلة اهم من القدس مهتمين بالكراسي اللى راح توديهم في داهية بس مااظن انو فيه داهية اكتر من اللى احنا عايشين فيه<br />الله اكبر وحسبي الله ونعم الوكيل"
