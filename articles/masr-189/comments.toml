[[comments]]
order = 0
subject = "ياجدعان خلصوا بسرعة ...في ناس مزنوقة اليومين دول"
author = "محمد السيد"
posted = "2006-04-17"
text = "إيه الجمال ده يا جدعاااااااااااان ؟؟<br />أتاري ... ريسنا مكنتش دماغه مظبوطه في حوار العربية .... واضح أنه - إحم ولا مؤاخذة -كان مستني الاتنين دول يخلصوا ..<br />وبرضه .....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />خلاص مش مغيره<br />mohamedmat@hotmail.com"
archived = "2006-04-30"
capture_url = "https://web.archive.org/web/20060430141427/http://www.masr.20at.com:80/article.php?sid=189&PHPSESSID=da85589aae68ff51becfe9f260ad7162"

[[comments]]
order = 1
subject = "ايه ده"
author = "مسلمه"
posted = "2006-04-18"
text = "فى حاجات فى الصور دى مش مؤدبه<br />لو سمحتم مش عايزين الحاجات دى تانى كايكاتير اه تريقه اه لكن كده عيب<br />اللهم اهدنا الى ما تحبه وترضاه"
archived = "2006-04-30"
capture_url = "https://web.archive.org/web/20060430141427/http://www.masr.20at.com:80/article.php?sid=189&PHPSESSID=da85589aae68ff51becfe9f260ad7162"

[[comments]]
order = 2
subject = "بلاش كلاكيع"
author = "الهوبة يا ولاد"
posted = "2006-04-18"
text = "الموضوع تحفة ويا ريت يبقى عندكم كاريكاتير عشرينات على طول<br />وبلاش كلاكيع والنبي من الناس بتاعة مش مؤدبة..الرسام ده اكتشاف أساساً<br />إيه عمركوش عديتو على كباري<br />بالمناسبة يا عشرينات<br />هو ده محمد فتحي بتاع مليجي ونونو في الدستور"
archived = "2006-04-30"
capture_url = "https://web.archive.org/web/20060430141427/http://www.masr.20at.com:80/article.php?sid=189&PHPSESSID=da85589aae68ff51becfe9f260ad7162"

