text = "الهى وانت جاهى تبقى الاشاعة الجاية حقيقة ونخلص من قرف ونفاق امة<br />دى شخص وصولى ارزقى ما عندوش اى مبدا<br />مرة مع الحكومة ومرة بيايد جمال مبارك ومرة مع الارهاب وميت مرة ضد الدين والمتدينيين<br />ضرب او مسمار فى نعش التعليم لما عمل مدرسة المشاغبين وعلم الطلبة الفساد والتحلل وعدم الاحترام<br />دة رجل مهزىء وليس لة كرامة ويضحك الناس بطريقة الارجوزات والتنطيط ويقعد يبوس الممثلة اللى قبالة خمسين مرة<br />يلعن ابوة ابن كلب"
