text = "الفنان عادل امام فنان جميل وفنان فاهم شغلة جدا جدا وقد قدم الكثير من افلامة التى تهدف الى الفكر الهادف والصحيح مثل الارهاب والارهابى والكباب التى تهدف الى المعلومة الصحيحة للاسلام لانى الاسلام مش تعصبالاسلام فهم وفكر ويسر واحب ان اشكر الفنا القدير والنجم الساطع عال امام وربنا يديلوا الصحة والعمر المديد انشاء الله وبحبك يا فنانة القدير وشكرا"
