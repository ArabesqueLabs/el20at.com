[[comments]]
order = 0
subject = "يعني يا شريف الدواخلي انت اللي وقعت من قعر القفه"
text = "ايه يا شريف<br />ما كل واحد عامل موضوع عن نفسه<br />ليه ما عملتش لنفسك موضوع يا ابني انت راخر<br />يعني انت اللي وقعت من قعر القفه"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104082103/http://masr.20at.com:80/newArticle.php?sid=13638"

[[comments]]
order = 1
subject = "الى وائل عباس وعشرينات وعموم المدونين"
text = "باختصار عايزين نشوف اسلام نبيه دخل السجن حقيقة ولا لأ<br />واذا كان دخل السجن عايزين نشوف صوروا جوا السجن<br />هي دي الصحافة مش شوية الهبل اللي انتوا بتعملوه<br />وشكرا"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209042700/http://masr.20at.com:80/newArticle.php?sid=13638"
