[[comments]]
order = 2
subject = "أنا لا أقصد التجنى"
author = "محمد ميدو"
posted = "2007-05-15"
text = "أستاذ مدحت ..<br />أنا لا أقصد التجنى إطلاقا و لكنى أصف مشهد مما حدث لى مع الإخوان و الغريب أن المشهد حدث بعد صلاة الجمعة فى أحد المساجد بعدما إنتهيت من الصلاة و كان هذا الرجل بجانبى و فتح معى الفاش فى : لماذا لا أطلق لحيتى ؟<br />فحاولت أن أفهمه بأنها حرية شخصية و هذا لا ينقص من تدينى فى شئ و لكنى فوجئت به يرد رد غريب جدا إذ قال :<br />\" إن إطلاق اللحية سنة و نحن تقتدى بالرسول و من لا يقتدى به فمصيره جهنم و بئس المصير \" !!!<br />فجأة كده بقيت كافر و مصيرى جهنم و بئس المصير فقط لأننى لم أطلق لحيتى !!!<br />و كان رفضه لفكرة الحرية الشخصية عنيفا جدا لدرجة أننى ظننت بأنه سيضربنى خاصة بعد ما علا صوته و بدا و كأنه يتكلم مع أحد كفار قريش !!<br />مش عارف حكاية الإنفتاح دى مشفتهاش ليه فى الكلام ده ؟؟<br />و مش عارف حكاية إنهم لا يكفرون أحدا دى برضه مخدتش بالى منها فى كلام الراجل ده معايا (( عمره بالمناسبة كان يتعدى 45 سنة ))<br />اما حكاية أشرف من بتوع الحزب دى فأنا لم أشق صدورهم و أعرف ما فى قلوبهم ...<br />ولا إيه رأيك ؟؟"
archived = "2010-03-14"
capture_url = ""

