[[comments]]
order = 0
subject = "مش مهم الشعار"
author = "محمد ميدو"
posted = "2007-05-15"
text = "مش مهم الشعار بتاعهم يكون إيه ..<br />مهما غيروا الشعار بتاعهم .. هيفضلوا برضه هما هما ..<br />ناس بتكره نفسها و بتكره الدولة و بتكفر الغير حتى المسلمين المختلفين عنهم فى الرؤية بيكفروهم ( تعرضت شخصيا لهذا الموقف مع أحد أعضاء هذه الجماعة المحظورة برغم إنى لست شيعيا و لا ملحدا ) ...<br />مهدى عاكف ( المرشد بتاعهم ) بيقسم العالم لجزئين ..<br />جزء مؤمن و هم المؤمنين بمبادئ الإخوان المسلمين<br />و جزء كافر و هم كل من يعارض الإخوان المسلمين أو يختلف معهم فكريا ..<br />يبقى مهما تغيروا الشعار هتفضلوا زى ما إنتم ..<br />عاوزينا نمشى ورا مين ؟؟<br />مش مهدى عاكف ده اللى قال : طظ فى مصر و أبو مصر و اللى فى مصر ؟؟<br />عاوزينا نمشى وراه ؟؟<br />لا ... بعينكم"
archived = "2010-03-14"
capture_url = ""

