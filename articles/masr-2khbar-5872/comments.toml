author = "مدحت"
posted = "2007-05-16"
text = "الاخ محمد ميدو اعتقد انك وقعت فى واحد سلفى والسلفيين هما اللى بيتقيدوا باللحيه وظاهر النصوص<br />لكن انت لو نظرت ل اغلب قيادات الاخوان فهم بدون لحيه<br />عندك عصام العريان عبد المعم ابو الفتوح وغيرهم كثيرين قيادات اخوانيه بدون لحيه"
