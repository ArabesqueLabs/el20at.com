[[comments]]
order = 4
subject = "شكرا"
author = "محمد ميدو"
posted = "2007-05-16"
text = "شكرا على المعلومة يا أستاذ مدحت و لكن هذه الشخصيات منتشرة إنتشار النار فى الهشيم و هم يقولون أنهم من الإخوان المسلمين فأنا لا يهمنى - كمواطن مصرى لى حقوق المواطنة الكاملة و الحرية - إن كان سلفيا أو معتدلا ..<br />كل ما أقوله هو أن هؤلاء الأشخاص هم سبب كل المصائب التى نعيشها فى حياتنا من فتن طائفية و حرق و هدم لمنازل و تجارة شركاءنا فى الوطن ...<br />أما عن الشعار الجديد الذى ينادى به د. محمد حشمت فلا يمكن التعليق عليه إلا بأنه شئ غير مقبول ..<br />تخيل معى مرشحا شعاره \" اللى بالى بالك هو الحل \" !!<br />مش ناقص طبعا غير إنه يحط صورة اللمبى ( محمد سعد ) بجانب شعاره الإنتخابى !!<br />مهزلة ...."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "نسيت"
author = "محمد ميدو"
posted = "2007-05-16"
text = "آسف يا أستاذ مدحت بس نسيت أسألك :<br />تقبل إنك يحكمك واحد قاللك \" طظ فيك \" قبل كده ؟؟<br />مهدى عاكف قال : \" طظ فى مصر و أبو مصر و اللى فى مصر \"<br />لما هو بيعمل كده و هو مش فى السلطة .. أمال لما يمسك سلطة هيعمل إيه ؟؟<br />المسألة تعدت مجرد رفع الشعارات الدينية ... المسألة الآن مسألة هوية و طريقة تفكير ..<br />مهدى عاكف يستغل بساطة المصريين و تأثرهم بالشعارات الدينية و هذا واضح من عدم قبولهم لفكرة عدم رفع الشعارات الدينية فى الإنتخابات ..<br />قل لى : لو أن لديهم برنامجا سياسيا حقيقيا فما الذى يخيقهم من فكرة منع الشعارات الدينية ؟؟<br />أظن أن البرنامج السياسى الحقيقى لا يحتاج الى شعار دينى يسنده ..<br />إنه إفلاس سياسى يا سيدى الفاضل ..<br />و أتحدى أن يكون لدى الإخوان برنامج سياسى و إنتخابى واضح و محدد غير تلك الشعارات و البرامج الهلامية التى يتكلمون عنها ..<br />شكرا مرة أخرىيا أستاذ مدحت على تعليقك و على المعلومة التى كانت غائبة حقا عن ذهنى<br />لك تحياتى"
archived = "2010-03-14"
capture_url = ""
