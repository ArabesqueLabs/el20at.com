subject = "و يا ريت متمسحوش التعليق المرة دي"
author = "alexomania"
posted = "2007-05-19"
text = "ايه يا عشرينات اللي بيحصل ده؟؟؟؟؟<br />أولا كل الموضوعات بقت مكررة و منقولة بالنص من المواقع المشهورة .... أنا مش بقلل من شأن عشرينات بس لما اقرأ موضوع الصبح علي موقع و ألاقيه آخر النهار او تاني يوم هوة هوة بالنص علي عشرينات بتبقي حاجة مستفزة<br />و التعليق اللي انا قلت فيه كده من فترة و إتمسح خلاني مش عارف ليه أفتكر المعارضة المزيفة اللي موجودة في البلد<br />جددوا ... إعملوا موضوعات جديدة و اللي يبص عليس الموضوعات الأخيرة قمة في السخف<br />دمية جنسية ... العرب سكسي.... الحذاء أولا .... مطار دبي....رعب تحت النقاب.... الورد الخ الخ<br />و سلو لي علي موقع الشباب العربي الأول لأن لو دي الموضوعات اللي تهم الشباب يبقي ربنا يحفظنا بقي ماللي حيحصل بعد كده"
