subject = "انتوا ضعتوا"
author = "خيرى عاطف"
posted = "2007-05-20"
text = "بجد كنت زمان.. مش من زمان اوى كنت بحبكم..وكمان كنت بحترم الموقع يتاعكم.. طبعا عارفين ليه.. لان انتوا كنتوا بتقدموا صحافه حيه..يعنى صحافه من الشارع.. بتحسوا بنبض المواطن.. وبتنقلوا اللى انتوا شايفينه بعيونا وعيونكم..ولو كنتم مش محايدين اوى بس فى الاخر ممكن نقول ان انتوا قدرتوا ان انتوا تقدموا حاجه جديدة..لكن للاسف الوضع الان تغير تماما..وتحولتم الى\"............\"وظيفتكم هييا النقل من مواقع اخرى سواء بالاشاره اليها او بدون الاشاره.. كان المفروض تحافظوا على الاقل على النجاح اللى انتوا وصلتوا ليه...لكن للاسف انتوا ضعتوا.. وصعب اوى تقدموا صحافه كويسه.."
