subject = "نفس الصراع"
author = "M.Shawky"
posted = "2007-05-21"
text = "تعيش السعودية هذه السنوات نفس الصراع الذى عاشته مصر القرن الماضى ونهايات القرن قبل الماضى.<br />عندما بدأت البعثات العائدة من الخارج تنادى بحرية المرأة فى دعوى ظاهرها الحق وباطنها الضلال .<br />ولم يكن حرصهم على مصالح المرأة هو الباعث الأساسى لهذه الدعوى .. وإنما حرصهم على الحياة التى عاشوها فى بلاد الغرب ؛ ثم إفتقدوها عندما إضطروا الى العودة ..<br />ثم ماذا كانت النتيجة .. ها هى المرأة المصرية فاقدة لهويتها .. فلا هى غربية ، ولا هى شرقية .<br />ألا يتعظ دعاة اليوم من نتائج ما دعا إليه دعاة الأمس !!!<br />إن المرأة التى يسعى خلفها ويدعو الى إخراجها من حرمها الآمن ليلهو هو بها اليوم .<br />هى غداً ستكون إبنته التى يلهو بها غيره .. والله المستعان ."
archived = "2010-03-14"
