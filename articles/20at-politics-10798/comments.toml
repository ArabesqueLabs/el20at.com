subject = "ربنا معاهم"
author = "محمد جمال الدين"
posted = "2008-12-26"
text = "ربنا معاهم و ينصرهم أن شاء الله ويتفك الحصار عن قريب<br />بس أزاى وهما مختلفين فيما بينهم , وعن نفسى لا اتوقع أجتياح فعلى للقطاع<br />مصلحة أسرائيل هى ان تبقى على الخلافات الداخلية قائمة , بحيث انهم بيصفوا أنفسهم بأنفسهم ولا حاجة لتدخل إسرائيل وخسارة مقذوف نارى واحد . الناس دى بتحسبها صح اوى اوى<br />وبرده أزاى نتوقع رفع الحصار .. واكبر قافلة شعبية مصرية ماوصلتش حتى لسيناء كان عددها لا يتعدى الـ 450 فرد<br />الحار هيترفع لما الناس تفوق.. وهتفوق امتى .. لما ييجى عليها الدور.<br />وصباح الفل يا مصريين"
