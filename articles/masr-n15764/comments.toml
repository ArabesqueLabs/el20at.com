subject = "لو كنت مكان منى الشاذلى لسألت"
author = "سياسى"
text = "سيادة الرئيس<br />لماذا دائما امريكا بتضرب عملائها بعد تأدية مهمتهم معها بالجزمة زى شاة ايران وصدام حسين او تقتلهم زى السادات ؟<br />طبعا ينفى الرئيس الامريكى<br />سيادة الرئيس<br />قلتم انكم ستحتلون العراق ؟ وستغيرون الحكم فى سوريا والسعودية - اما مصر فهى الجائزة الكبرى ؟ هل حصلتم على الجائزة الكبرى بدون اى حرب<br />يضحك الرئيس الامريكى<br />سؤال<br />سيادة الرئيس ماهو اهداف افقار الشعب المصرى وتجويعة عن طريق ارغامة على اتباع سياسة البنك الدولى الذى يعمل بتوجيهاتكم ؟<br />ضحك ونفى<br />سؤال<br />سيادة الرئيس لماذا لا تطلب اجتماع الكونجرس وتوعز لاحد الاعضاء التابعين لك بطلب تغيير مواد الدستور بحيث يسمح لك بأن تعكون رئيسا لامريكا مدى الحياة \\\\ هما هيلاقوا احسن منك فين<br />ابتسامة عريضة للرئيس الامريكى<br />سيادة الرئيس بما ان امريكا فى حالة حرب مع القاعدة والارهاب العالمى لماذا لا تفرض قانون الطوارىء طوال فترة حكمك ؟<br />انتهت العشر دقائق<br />وتنصرف منى الشاذلى<br />ويتصل بوش بحرس بوابة البيت الابيض ويطلب منهم القبض على منى الشاذلى وايداعها سجن جواتيمالا"
archived = "2008-05-15"
capture_url = "https://web.archive.org/web/20080515003221/http://masr.20at.com:80/newArticle.php?sid=15764"
