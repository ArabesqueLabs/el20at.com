author = "وزيرة الاسرة والسكان"
posted = "2009-07-12"
text = "هو فية فرق بين الاسرة وبين السكان ما الاسر هم السكان ولا السكان دول حاجة تانية غير الاسر اعتقد ان اللى اختار الاسم دة واحد معتوة وانا عن نفسى اسميها وزارة مشيرة<br />فوزارة مشيرة هتوزع كبابيت لتحديد النسل وهتغلى المخدرات علشان الناس متشربهاش<br />وبعدين كل الكلام دة تبع وزارة الصحة والشئون الاجتماعية<br />وزارة الشئون الاجتماعية زمان كانت لها نفس الدور والامور الصحية للسكان تبع وزارة الصحة<br />صحيح وزارة ملهاش اى لزمة غير القاء التصريحات للصحف"
