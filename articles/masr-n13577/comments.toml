[[comments]]
order = 0
subject = "بناء علي البلاغ المقدم من إبراهيم ربيع عبد الرسول المحامي"
text = "الاخوة المحامين دول قاعدين للسقطة واللقطة<br />كل واحد فيهم عايزله حاجه تشهره<br />البلد حالها واقف<br />تلاقي المحامي من دول عمال يدور على اي حاجه يرفع بيها قضية"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229071543/http://masr.20at.com:80/newArticle.php?sid=13577"

[[comments]]
order = 1
subject = "المحامى بتوكيل من حسنى"
author = "محامى"
text = "اصل المحامين فيهم ناس واخدين توكيل من الفريق حسنى<br />وتحت بند نزاهة القضاء المزور -- هيحط كل اللى يتكلم فى السجن - وتلفيق التهم جاهزة - وترزية القوانين جاهزين وكلة بحسابة"
archived = "2007-12-29"
capture_url = "https://web.archive.org/web/20071229071543/http://masr.20at.com:80/newArticle.php?sid=13577"
