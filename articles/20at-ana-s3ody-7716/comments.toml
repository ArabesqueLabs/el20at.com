text = "يؤ يؤ يؤ يؤ كل هذي خساير 500 الف للمربي الواحد.<br />طيب ليش يعدمون الحمام مع ان الحمام عنتدهم مناعة ضد هذا المرض .<br />وانا واحد من مربين الحمام بأنواعه , والحمام سليم , لكن هذا المرض اشاعة .<br />واتمني ان سوق الحمام في الرياض انه يفتح بأسرع وقت .<br />تقبلو مروري"
