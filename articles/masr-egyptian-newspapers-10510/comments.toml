[[comments]]
order = 3
subject = "دعوة لنفى (بدو و اعراب سيناء الى توشكى و جنوب مصر)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-17"
text = "تكررت حوادث بدو و اعراب سيناء!!!<br />و اخذت منحنى خطر من تحدى للدولة<br />بل بدات الامور تتطور الى الاسواء<br />فلتكن سياسة مصر لتاديب هؤلاء الخونة الخارجين عن القانون من(سلطة و شرعية و نظام) هى نفيهم الى جنوب الوادى و ذلك لمنع التمادى الذى بدأ ياخذ شكل الحركات الاستقلالية و التى هى فى جوهر و صلب الموضوع (حركات صهيونية اسرائلية)<br />يجب الضرب بيد من فولاذ و ليس من حديد<br />لنتبع اساليب الزعيم الروسى(ستالين) فى علاج مثل هذة الانتفاضات الصهيونية الاسرائيلية و التى بدات تطفوا على السطح؟<br />سيناء الان اصبحت على فوهة بركان و يجب اخماد ذلك البركان بالحديد و النار؟!!!"
archived = "2010-03-14"
