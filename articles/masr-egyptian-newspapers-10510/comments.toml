subject = "الحمد للة ياللى انت(موش الانبا بيشوى)"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-17"
text = "انت عبيط و لالالا اية؟<br />بالذمة دة كلام<br />أكيد اكيد أكيد انت متخلف و عبيط و اهبل؟<br />انتم كل حاجة تخلطوا بين الدين و السياسة<br />انا باتكلم عن تجاوزات بدو و عرب سيناء؟<br />تيجى انت بغبائك تزج بالدين ؟<br />يابنى بطل تخاريف و روح العب فى( ك-- )أمك احسن لك و ليها<br />روح اللة يسامحك<br />على فكرة انا احب (قناة السويس) و لا أحب (قناة الحياة) يا قليل الحياء!!!<br />هاااااااااااااااااهاااااااااااااااهااااااااااااااااهااااااااها<br />ربنا يهديك و يشفى كل انواع الكلاب اللى على شاكلتك؟"
archived = "2010-03-14"
