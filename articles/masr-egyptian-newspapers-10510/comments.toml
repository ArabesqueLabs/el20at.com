subject = "احترام القانون هو الوحة الحقيقى لاحترام الدولة(الس"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-16"
text = "ما حدث فى سيناء شئ مخز لا يجب السكوت علية و لا اعطائة اية مبررات ايا كانت تحت اية مسميات<br />نؤيد الدولة فى كافة التصرفات التى تتخذها ضد البدو الذين لا يحترمون القانون<br />احترام القانون من احترام الدولة<br />و الويل لمن يحاول من تقليل سلطة الدولة حتى و لو كانوا من اعراب بدو سيناء؟"
