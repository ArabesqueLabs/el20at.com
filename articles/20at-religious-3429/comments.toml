[[comments]]
order = 15
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-03-18"
text = "على فكرة عشرينات بقت بتتلكك على الموضوعات اللي فيها خلافات كتير ..بدليل ان واحد من البهوات بتوع عشرينات كتب موضوع مروب اسمه عمرو خالدممنوع من الظهور ..وقال بقين فارغين في 20كلمة تقريبا ..و فضلت الخلافات والشتايم بينالطرفين اللي بيحب عمرو خالد واللي بيكرهه .<br />تاني يوم ...شوف تاني يوم !! ينزلوا نفس الفكرة قال ايه في موضوع جديد ..طيب و هو كان القديم عن ايه اصلا عمرو خالد والشيخ صالح والهطل ده ..و النهاردةعمرو خالد و سي تامر<br />انامع اللي قال احنا مش د الأغنية ..على الأقل كان ممكن يجيب مطرب من المطربين اللي بيحاولوا يلتزموا دلوقت ..والله يا جماعة أنا حاسس انو الموضوع بالنوايا ..كانوا ناويين خير في أغنية على خطىالحبيب و نجحت نجاح رهيب ..لما حبوا ياخدوها سبوبة وعملوا اغنية باسمك نحيا فضلت فشل ذريع ..و البرنامج طبعا فشل ولا مقارنة بينه و بين على خطى الحبيب..ومن ضمن سبوبة سي عمرو انه باع شوية هرتلة لقناة المحور عن مؤتمر هو أخد فيه ملايين ..وحب يزود اصلالبحر يحب الزيادة فباع مؤتمر الشباب ده ..أو المعسكر يعني و كله مكسب ...<br />ويطلع يبصلك في السما ويعمل لك فيها شيخ ..لا ياشيخ؟!<br />منكرش اني كنت بسمع عمرو خالد ..لكن دلوقت لما حسيت انه بقى يتاجر بالدين ..كرهت اني اشوفه اصلا ..يا اخواانا بلاش نصب ..يعني ملقاش غير تامر حسني ؟طيب ما هو تامر حسني كان موجود من قبل ما يتسجن ..مجبهوش ليه يغني على خطى الحبيب ...<br />فرقعة اعلامية زي كل مرة ...<br />عمرو خالد بقى يحب الفرقعات و بقى يحب الاشاعات ..<br />أقسم بالله أقسم بالله أقسم بالله ..عن مصدر قريب جدا جدا من عمرو خالد ..ويمكن بتقولو اسمائهم كتير كمصادر أو متحدثين باسم عمرو خالد ...المصدر ده قال ان عمرو بيحب الاشاعة تطلع وميكدبهاش علشان تعمل دعاية لبرامجه<br />وبيحب يبقى مثار للجدل برضه بروباجاندا ..بقولكم ايه انتو أحرار<br />بكرة تتعاملوا معاه مباشرة ..وتحبوووووووووووووووووووه أكتر لما تعرفوووووووووووووووووه على حقيقته"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 16
subject = "اليكم ما سيحدث..... و بكرة تشوفوا"
author = "التوربيني...صبح صبح"
posted = "2007-03-18"
text = "شوفو باْة يا حبايبنا... في نقطة مهمة جدا انتو مش واخدين بالكو منها خالص ..... كل اللي بيحصل دة شغل دعاية و اعلان بس علي مستوي عالي و جامد اوي اوي ... من ناحية الاستاذ الفاضل عمرو خالد عايز يلفت النظر للبرنامج و يجذب الانتباه ليه قبل اذاعته بفترة و دة طبعا عشان القناوات المستضيفة للبرنامج اصبحت اربع قنوات بدل من قناة واحدة ...اقرأ....و بالتالي لازم اصحاب القنوات دي يعملوا حملة دعائية جامدة عشان يلموا اكبر قدر من اموال الاعلانات<br />و من الناحية التانية...نيجي للاستاذ (اشمعنا هو يعني ) تامر حسني... دة النيو لوك بتاعوه.. هايبدأ باغنية دينية .. و كمان اغنيتين تلاتة من نفس النوعية لكام برنامج تاني ... و يربي دقن شوية ...و مش بعيد يعمل هو كمان برنامج يحكي فيه عن مشواره الفني و التحول الجميل و المثمر و الصحيح في حياته .... و علي رمضان كده ممكن تلاقيه بيأذن مثلا في جامع مشهور ولا حاجة او بيصلي ورا عمورة...و يبقي كدي يا معلم ضمن كل فئات الشباب... متدين و متسيب و ملتزم و منحرف...و بس يا رييس..يقوم راجع مرة واحد للطريق الاولاني بتاع الهششك بششك... و طبعا هيقوللك ساعتها..دة كله فن هادف..والمهم المضمون ....زي كدة الفنانات اللي تتحجب و بعدين تقلع الحجاب..ولا هنروح بعيد ليه..ما الاستاذ احمد الفيشاوي اقرب مثال موجود..او كان موجود...المشكلة او اللي يحزن في الموضوع... مش عمرو و لا تامر..دة هاياخد شهرة و دة هيكسب فلوس...انما اللي يحزن ان كله بأة بيستخف بالشعب المصرى و ابناءه...لا في حد بيحترمه و لا بيعمله حساب..كله بيتاجر علي قفاه عشان هو شعب عاطفي و طيب...اومال كان اسمه سيد العاطفي ليه....و بكرة تشوفو"
archived = "2010-03-14"
capture_url = ""

