text = "انا مش معترضه على فكره الاستعانه بمطرب ولكن على تامر حسنى بالذات لانه مش هيتغير فكلنا توقعنا بعد خروجه من السجن ان يتحول الى انسان اخر وان يراعى ربنا فى اختيار اغانيه وكليباته ولكنه للاسف رجع بشريط أسوأ بصراحه كان صدمه للكثيرين على العموم نتمنى ان ربنا يهديه وربنا يوفق الاستاذ عمرو خالد فى برنامجه الجديد"
