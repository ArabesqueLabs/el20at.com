subject = "ممتاز الاستاذ عمرو وتامر ربنا يهدية"
author = "ريهام ياقوت حسن"
posted = "2007-05-11"
text = "برنامج دعوة للتعايش ممتاز جدا والديكور كمان راااااائع اما عن عمرو خالد ف أنا مش حتكلم عليه طبعا وتامر حسنى أدعولوة بالهدايا يارب يهدية وأحنا سمعنا أنة مش حيعمل كليبات فيها بنات تانى وسمعنا انى مش حيغنى غير أغانى دينية طبعا كلها أشعات وربنا يهدى الجميع"
