[[comments]]
order = 12
subject = "الإختلاف بيّن"
author = "أحمد يس , 20 سنة"
posted = "2007-03-17"
text = "هناك إختلاف شديد بين الخلاف الذي كان قائما بين الأئمة الأربعة فى عصرهم و الخلاف بين السنة و الشيعة فى عصرنا هذا وذلك لأن و مهما كانت الإعتبارات أو محاولة تحسين صورة الشيعة يكفيهم أنهم يبنون القبور فى المساجد ليتطوف بها القبوريين و يقدمون لها النذور و يدعون بأسماء أصحابها كما كان يفعل الكفار مع الأصنام فمن هو فى القبر ميت لا حول له ولا قوة ولا طاقة له على إجابة الدعاء حتى ولو كان هذا هو الرسول صلى الله عليه وسلم<br />و ذلك هو الإختلاف بين المسلمين و الكفار<br />أي أن أئمة الشيعة و مثلهم الصوفيين و ...إلخ إن لم يكونوا مؤمنين بذلك فهم يساعدون علي الكفر و الشرك بالله ولا أدري ما المكاسب التي يحققونها سوى إضلال الناس و بعض المكاسب المادية الطفيفية<br />و بعد ذلك يطالب الجهلاء بجعل هناك ساحة حوار بينهم كما كان الأمر بين الأئمة الأربعة<br />أي يطالبون بأن يكون هناك بعض الأفكار الباطلة تحاور في ديننا الحنيف<br />و ما الذي سينشأ عن هذا سوى فقط إضلال أهل السنة؟؟؟<br />هذه حقيقة فهؤلاء كلامهم معسول و ظاهره الحق و باطنه الفساد و من الممكن لضعاف النفوس و قليلي العلم أن يُضَلوا بسبب تلك الحوارات<br />أنا من وجهة نظري لا أريد عداء بين الفئتين ولكن لهم دينهم و لي ديني و ذلك بالنسبة لجميع أهل السنة<br />أي لا يكون هناك حوارات فى الأديان بيننا و بينهم بشكل متسع إلا بشروط وبرقابة شديدة حفاظا على أهل السنة من الضلال<br />و أتمنى من عمرو خالد ألا تكون لقاءاته بمن يسموا بالفنانين إلا لهدايتهم ولا يجعل بتلك اللقاءات أن يضع أؤلائك فى درجة القدوة لشباب الإسلام"
archived = "2010-03-14"
capture_url = ""

