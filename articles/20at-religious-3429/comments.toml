subject = "فضيحة..الحزب الوطني الديمقراطي يسرق موضوعاتنا الصح"
author = "فضيحة..الحزب الوطني الديمقراطي"
posted = "2007-03-18"
text = "الحزب الوطني الديمقراطي..الفكر الجديد..الحزب الحاكم..الحزب الوطني في مصلحتك..مصر بتتغير..الكلام الجميل..الكبير..وانا وانت..والسرقة<br />سرقة؟ أيوة سرقة..الحزب الوطني بجلالة قدره بيسرقنا يا رجالة..وانا هنا اتحدث عن سرقة خاصة جداً..الكثير منكم يعلم انني رئيس تحرير مجلة كلام شباب التي تصدر عن حزب شباب مصر..وهي مجلة مطبوعة تصدر داخل جريدة شباب مصر كل ثلاثاء من كل اسبوع<br />ننشر في كلام شباب تحقيقات وموضوعات شبابية..الكارثة هي اننا اكتشفنا ان الموقع الرسمي للحزب الوطني الديمقراطي يسرق موضوعاتنا في كلام شباب وينسبها لنفسه دون اي اشارة للمصدر الحقيقي ودون كتابة اسمائنا على الموضوعات<br />الكارثة هي ان الحزب الوطني يسرق الموضوعات كما هي دون ادني تغيير يعني كوبي بيست..والموضوعات التي تم سرقتها موجودة هنا<br />واصول الموضوعات موجودة على الموقع الرسمي لكلام شباب على الانترنت<br />انا وفريق كلام شباب لن نسكت وسنتخذ الاجراءات القانونية اللازمة..واتمنى من كل قاريء لنا ان يتضامن معنا<br />www.shabmoslim.com"
