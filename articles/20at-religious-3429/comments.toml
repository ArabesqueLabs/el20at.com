subject = "تامر حسني مع عمرو خالد و هيفاء وهبي"
author = "كااااااااااااااااااابسة"
posted = "2007-03-20"
text = "في حوار طويل في العدد الجديد من مجلة \"بارتي\" اعترف تامر حسني إن الحكاية هي إنه سيشارك هيفاء وهبي بطولة الفيلم الذي سينتجه المنتج محمد السبكي.<br />وقد أكدت هيفاء سعادتها بمشاركة تامر البطولة و قالت إنه من أكثر المطربين الذين تحب سماعهم.<br />وعن أخباره الخاصة قال تامر إنه سينتهي من فيلم \"عمر وسلمى\" خلال شهر أبريل وسيعرض خلال موسم الصيف، وهو من إنتاج السبكي أيضا.<br />وبعد الانتهاء من هذا الفيلم سيبدأ تصوير فيلم آخر هو \"وقت الجد بجد\" كتب قصته وسيخرجه نصر محروس.<br />وعن ألبومه الجديد يقول إنه انتهى من تسجيل عشر أغنيات وقد قام بتلحين وكتابة 4 أغاني منها، والمفاجأة أن هناك أغنية في الألبوم من تلحين هيثم شاكر، وهو كما يقول تامر حسني،\" ملحن جامد جدا\".<br />وعن دور عمرو خالد في حياته، قال تامر إنه كان على اتصال به طوال أزمته وقام بمساندته وبعدها استمر الاتصال، ثم عرض عليه غناء تتر برنامج \"دعوة للتعايش\" فلم يتردد وقام بغناء المقدمة والنهاية للبرنامج وهو سعيد بهذا التعاون"
archived = "2010-03-14"
capture_url = ""

