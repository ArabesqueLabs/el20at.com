text = "السلام عليكم<br />ايه اللى يمنع ان تامر حسنى يغنى و ايه اللى يمنع اى حد مهما كان دينه انه يعمل عمل يفيد الاسلام ...ثم الناس اللى عماله تهاجم تامر حسنى فى نا س ربنا سبحانه خللى معاصيها ظاهره و فى ناس ربنا خللى معاصيها مستخبيه ...لكن احنا عايزين نهاجم و خلاص يا جماعه ارجعوا و اسمعوا عن واحد اسمه ابو محجن كان مدمن خمر و ايه اللى عمله فى القادسيه يا جماعه عايزين نخرج من الجو ده يا جماعه الاسلام مش حكر لحد ....مش لازم تبقى شيخ عشان تعمل حاجه....يعنى هو الرسول لو عايش كان ممكن يقولو امشى يا تامر انت عاصى و ما تنفعش طيب ما هو دليل الرسول فى الهجره كان كافررررررررررررررررررررررررررررررررررررررررررررررررررررررررو اللى انقذ الاسلام فى مواقف كثيره عم الرسول ابو طالب و كان كافررررررررررررررررررررررررررررررررررررررررررررررررررررررررر و سواء عمل العمل دهلاى نيه محدش زمان هاجم عبد الله ابن اريقط او ابوطالبوقال عليهم كل الكلام ده او ان عبد الله ابن اريقط خد فلوس أرحمونا يرحمكم الله"
