subject = "صدمة"
author = "soha"
posted = "2007-03-31"
text = "السلام عليكم ورحمة الله وبركاته<br />أولا دى أول مرة أشوف الموقع دا بس للاسف أنا صدمت من طريقة الكلام لا يمكن تكون دى غيره على الأسلام وتكونوا بتتكلموا بالطريقة دى أعتقد أن لازم تكون فى طريقة أسلامية أحسن من كدا نتكلم بيها عشان الأسلام دين أخلاق وبعدين لأمتى هنفضل بصين من خرم الأبرة متشوفوا الأول البرنامج هيقول آه وبعدين علقوا زى ما أنتم عيزين بس بأسلوب محترم من غير ما نغلط فى حد وبعدين هو خلاص كلنا بقينا أوليا وبنحكم على الناس من مظهرهم أتقوا الله وقولوا قولا طيبا وأحسنوا النية وطبعا الكلام دا مش موجه للجميع لأن فى ناس أتكلمت بأسلوب محترم"
