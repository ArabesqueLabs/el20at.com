[[comments]]
order = 2
subject = "البابا شنوده ضابط جيش سابق يصلح لقيادة الامن المركزي"
text = "البابا شنوده عسكري سابق وكان يعمل بالجيش المصري ووصل الى رتبة رائد ما اعرفش ايه اللي طلعها في دماغ امه ودخل الدير وعملنا شوية الحركات بتاعته دي<br />من يوم ما جه وجت معاه الفتن الطائفية<br />لغاية ما اتقلبت على دماغه وجه ما كسيموس وحرق دمه وانقسم الاقباط<br />شم يا خويا في الوردة شم"
archived = "2008-03-08"
capture_url = "https://web.archive.org/web/20080308051349/http://masr.20at.com:80/newArticle.php?sid=13699"
