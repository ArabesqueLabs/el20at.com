subject = "ضع عنوان التعليق"
author = "ريم بنت السعوديه --تعود لكم من"
posted = "2008-11-13"
text = "مشكووورين<br />انا ماحب الغاامق ابدن حتى لو كانت الموضه<br />احب الوردي الفااتح<br />او الترابي البيج<br />مشكووورين جدا<br />موضوع رايق عجبني"
