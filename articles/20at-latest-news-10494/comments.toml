[[comments]]
order = 1
subject = "تعليق على هذه الفقرة الشفاه الجريئة بحاجة إلى حواج"
author = "أبو الحسين السلفي"
posted = "2008-11-15"
text = "تعليق على هذه الفقرة الشفاه الجريئة بحاجة إلى حواجب متناسقة :<br />أقول قال رسول الله صلى الله عليه و سلم :لعن الله الربا و آكله و موكله و كاتبه و شاهده و هم يعلمون و الواصلة و المستوصلة و الواشمة و المستوشمة و النامصة و المتنمصة. حديث صحيح أخرجه السيوطي .<br />قلت : النامصة هي التي تنتف من شعر حاجبيها و المتنمصة التي تنتف لأخرى<br />و الواصلة التي تصل بشعرها شعر مستعار (يدخل فيها الباروكة )<br />فانتبهي أختي الفاضلة أن تلعني بسبب شعيرات و اللعنة طرد من رحمة الله و م أحوجني و أحوجك لرحمة"
archived = "2010-03-14"
capture_url = ""
