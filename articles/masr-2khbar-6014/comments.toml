order = 0
subject = "قطاع عام"
author = "3agab"
posted = "2007-05-24"
text = "اصول شركات القطاع العام لا تتمثل في مقار الشركات والمصانع ومنافذ البيع العاملة ( المستخدمة فعليا ) وفقط<br />, بل تشمل مئات الالاف من الافدنة في جميع انحاء مصر والتي تم تخصيصها لتلك الشركات من قبل تحسبا لامكانية توسعها وكذا تشمل مالا حصر له من العقارات الموضوع اليد عليها و التي صدر لها قرارات ازالة لم تنفذ وما الي ذلك وبحسبة بسيطة اذا امتلكت شركة عمر او النصر او الغزل فقط 50 فدان في في مدينة نصر بسعر الفدان 50 جنية سنة 1970 فاليوم تملك 50 * 4200 = 210000 متر سعر المتر 3000 يعني حوالي 630,000,000 جنية من قطعة ارض واحدة يتم تسجيلها في دفاتر تقييم الاصول بسعر المتر 13 جنية علشان الحبايب والله اعلم . زيها زي ارض مدينة الشروق<br />وكل طرق مصر شمال وجنوب وشرق وغرب مناطق مميزة وغير مميزة علي ترع مميزة وشواطئ مميزة تجد دائما .... يافطة عريضة مكتوب عليها من ثلاثون سنة او يزيد ((( شركة كذا كذا ))) ممنوع النظر اليها ,,,,, ولا هما استغلوها ولا تركوا الشباب يستغلها بحجة انها املاك عامة او املاك دولة .................. ومايمنعش في يوم وليلة تلاقي اتبني علي الارض فيلا او قصر بحمام سباحة وماباقتش الارض املاك عامة .............وعجبي<br />ملحوظة هناك شركات مقاولات قطاع عام صاحبة امتياز وحق استغلال مناطق كاملة مثل المعادي - المقطم ومدينة المعراج وكارفور - مدينة نصر - القاهرة الجديدة - والسؤال الان متي سيتم بيع هذه الشركات علشان ابداء احوش وعلي فكرة وصل ثمن المتر الواحد في صحراء هذه الشركات الي 1500 بدون مرافق ...... وبرده عجبي"
archived = "2010-03-14"
capture_url = ""

