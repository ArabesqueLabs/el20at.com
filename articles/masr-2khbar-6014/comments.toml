subject = "هريدى ابن مستكة"
author = "مصر -هاودرو رايح جاى"
posted = "2007-05-27"
text = "ممكن اكون غلطت فى اسم السوبر ماركت البريطانى اللى اشتراة محمد الفايد لكن يالتاكيد انا عارف انة بالرغم من ان محمد الفايد قعد فى بريطانيا قرابة 20 سنة وبالرغم من تقدمة مرتين للحصول على الجنسية البريطانية قامت الدنيا ولم تقعد لرغبة الفايد فى شراء مبنى يعتبرة البيطانيون زى عمر افندى عندنا ودارت مناقشات فى مجلس العموم البريطانى وانتهت فى الاخر على مااظن الى شراء المحلات عن طريق طرف اخر واحنا نازلين بيع فى كل اصول الشركات العامة عندنا<br />ملحوظة اخير : 34 % من مشترى الاملاك المصرية سعوديون و46 % خليجيون والباقى اجانب"
