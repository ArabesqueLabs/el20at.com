subject = "الى كل محامى شريف"
author = "ابو اسامة"
posted = "2007-05-27"
text = "خربتوها الله يخرب بيوتكم الناس دى بتبيع بامر مين بيع من لايملك لمن لا يستحق انه بيع باطل هو مفيش محاميين فى البلد دى اين انت يا نقيب المحامين لماذا لا ترفع دعوى على الحكومة ببطلان البيع هى املاك ابوهم ازاى ناس لم<br />يخترهم احد ولم يفوضهم احد ولم يوكلهم احد من الشعب بالبيع يبيعون بلدا باءكمله هل هذا البيع قانونى ام انها سرقة والسلام والناس نيام اين المحاميين الشرفاء لماذا لا يرفعون دعوة ببطلان البيع وكل ما ترتب عليه اذ ان من اشترى ليس له حق الملكية لعدم وجود اى سند قانونى مع البائع والله الراجل ده هيموت وهيسبها تغرق واحنا الى هندفع الثمن ثمن السكو ت وفوقوا بقى"
