[[comments]]
order = 0
subject = "وإعلان أيمن نور، مؤسس حزب الغد، والدكتور أسامة الغ"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-03-18"
text = "ايش لم الشامي على المغربي<br />ايمن نور عدو لحسني مبارك<br />الغزالي حرب دا عامل حزب ينافق به رئيس الدولة ويمسح جوخ للرئيس<br />ايه اللي لمهم على بعض<br />تماما زي اليهود والنصارى<br />اليهود بيقولوا ان المسيح ابن زنا والنصارى بيقولوا ان المسيح ابن الله<br />رغم الهوه بينهما الا انهم حبايب يجمعهما الكفر<br />كذلك الغزالي حرب وايمن نور كلامها دجال ونصاب وجمعتهما المصلحة<br />هذا رأيي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "ومن جانبهما، أكد الدكتور أيمن نور، مؤسس حزب الغد،"
author = "مش ححبك"
posted = "2009-03-18"
text = "حتاخدوا ايه من الحرامي بالنقض والدعارية العليا<br />واحد محامي اذا كان شريف اوي اوي اوي فهو كذاب بياكل عيش بكبيرة الكذب<br />وصدق من قال<br />لايكذب المرء الا من مهانته او من السوء او من قلة الادب / ليعض جيفة كلب خير رائحة من كذبة المرء في جد وفي لعب<br />فياخونا ما لكوش دعوة بالمحامين دول شوية خونه وانذال ناهيك عن شهادة الزور واكل اموال الناس بالباطل والغدر بموكليهم<br />ولذلك نقول<br />لا لا لا لا لا لا لا لا لا لا لا لا<br />لمزور توكيلات تأسيس الحزب والقضية ثابته وليها ملف"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "مليون عسكرى امن مركزى بالرصاص المطاطى والحى والمدر"
author = "اكتب اسمك هنا"
posted = "2009-03-18"
text = "اضراب اية<br />القوات جاهزة<br />كلة تمام يا افندم<br />العيال الافندية اللى وشهم اصفر من كل الحقد هندخلهم الجحور وهنلبسهم طرح زى النسوان قبل ما يخرجوا من بيوتهم<br />تمام يا افندم<br />السيد اللواء المحافظ والسيد اللواء رئيس الحى والسيد اللواء رئيس جهاز المرافق والسيد اللواء رئيس المترو والسيد اللواء وزير التضامن جاهزين وعندهم خبر<br />وجميع السادة اللواءات فى حالة طوارىء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "(نور) و(اسامة) شرابان فى (جزمة )واحدة"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-03-18"
text = "و لالالالالا تعليق<br />العنوان ابلغ برهان<br />ايمن نورة كانت سجينة بتهمة التزوير و الدعارة<br />و اسامة الغزالى حرب موش لاقية اى مهنة تمتهنها السياسة او الدعارة؟<br />دول ينفعوا ينزلوا شارع جامعة الدول العربية؟<br />العرب ناكحى الاولاد و الرجال فى انتظارهم"
archived = "2010-03-14"
capture_url = ""

