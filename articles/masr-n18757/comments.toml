[[comments]]
order = 0
subject = "والذى يشهد عرض &--1640; أفلام دفعة واحدة اقتربت مي"
author = "مش خساره"
posted = "2008-12-07"
text = "وطبعا الستين مليون جنيه دول حيدفعهم الشعب الاهبل اللي حيتفرج على الافلام مع الارباح كمان<br />يعني المبلغ الكبير دا شوفوا بقا كان ممكن كام شاب وشابة يتزوجوا بيه<br />او كان مريض مش لاقيين يشتروا الدوا كان ممكن يشفوا بهذا المبلغ<br />يا خسارة يا شعب مصر<br />ضيعت نفسك<br />الشعب المصري كان ممكن يشتري املاك الدولة اللي بتتباع<br />الشعب المصري بيصرف على الموبايلات بس 12 مليار جنيه سنويا<br />يا خسارة يا مصر"
archived = "2010-03-14"
