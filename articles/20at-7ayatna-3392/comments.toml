posted = "2007-03-25"
text = "بصراحة انا عندي عادات كتير مدايقاني في نفسي لكن اكتر حاجة ويمكن الكل هيستغربلها اني بحب كتيير بجد يعني بابقى متيم قوي وممكن لو اللي بحلها اتكلمت مع واحد غيري اعمل مشكلة كبيرة وممكن ماانامش الليل ودا ممكن يحصل مع اتنين تلاتة في نفس الفترة / مع العلم انه غالبا ما بيكونش في مخها حاجة من اللي انا بفكر فيها يعني لا هي حبيتني ولا فكرت في من اصله لكن ما باقدرش اتحكم في اعصابي وممكن اتهمها بالخيانة ( حتى لو كانت متجوزة اتهمها بخيانتي مع جوزها ) ههه غريب انا والله بس مش عارف اتخلص من العادة دي"
