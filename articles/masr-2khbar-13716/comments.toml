author = "الدستور مفصل"
posted = "2009-10-15"
text = "لا منصور ولا البرادعى ولا اى واحد ايا كان وضعة<br />الدستور عدل وفصل ليناسب شخص واحد بس جمال مبارك<br />ريحوا نفسكم وبلاش تفسيرات ووضع اسماء وترشيح اشخاص لا تنطبق عليهم الشروط<br />الرئيس القادم اسمة جمال مبارك ودستوريا<br />ووزير الدفاع صرح قبل كدة ان الجيش فى حماية الدستور<br />ريحوا نفسكم وشوفوا مصالحكم وبلاش تضييع وقت الناس"
