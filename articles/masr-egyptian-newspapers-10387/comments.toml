subject = "ديكور ونص كمان والدليل انة مبارك دلوقتى مريض ومقدر"
author = "حانوتى الامانة"
posted = "2008-11-02"
text = "انا مبشمتش لاسمح اللة بحد لكن الحقيقة انة مبارك مريض النهاردة والغى اجتماع مقرر مع السنيورة بتاع لبنان والصحفى الهمام القابض على الحق زى ماهو قابض على الفلوس والاعطيات والامتيازات نظير مايكتب ويلمع وينظر لحزب فقد احترامة وثقتة لغاية مبقت الناس بتدعى ليل نهار على الريس والحكومة وطبعا الريس فاتح ودانة على الاخر بيسمع ويستمتع باالانجازات الهلامية والنفاق المدروس"
