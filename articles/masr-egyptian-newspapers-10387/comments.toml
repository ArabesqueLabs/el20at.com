order = 0
subject = "منكم لله يا أنصار الحزن الواطي"
author = "مواطن كل حاجة بيشوفها رخيصة"
posted = "2008-11-01"
text = "حرااااااااااااااااااااااااااام عليكم اتقوا الله فينا ( تقتلو القتيل وتمشون في جنازتة )<br />مقدرش أقول إلا حسبنا الله ونعم الوكيل<br />والله كنت أحسبه مقال سخرية وليس كما قلت في النهاية ( إنجازات ..... )<br />ويكفيني من مقاللك ذلك التعظيم والمدح لمن التصق بكرسيه لقرابة ما يزيد عن ثلاثون عاما وتقول عنه ( الرئيس حسني مبارك زعيم الحزب وقائده وصاحب مسيرة الإنجازات الموفقة سياسي واقعي يدرك بحكم خبرته الطويله.. ) كفاية كلام فارغ والحق اتفرج علي الكارثة القادمة (لقد عجزت عن إحصاء كوارث ذلك الحزب المستهتر والغير مبالي بالشعب )<br />ولا أقول إلا حسبنا الله ونعم الوكيل."
