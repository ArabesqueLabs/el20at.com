[[comments]]
order = 3
subject = "الديمقراطية العرجاء في مصر"
author = "عادل الجوجري"
posted = "2008-11-03"
text = "الحزب الوطني هو حزب الرئيس أو حزب الحاكم، وليس الحزب الحاكم، ولديه برلمان يشرع للرئيس كل ما يريد من قوانين، ويشرع للحكومة الظلم.<br />ماذا لو أسس الرئيس مبارك حزبا جديدا؟<br />الإجابة هي أن جميع قيادات الحزب الوطني حاليا سوف تهرول في اتجاه حزب الرئيس الجديد، ولن يبقى في الحزب الوطنى الذي عقد مؤتمره العام مؤخرا أي عضو. وهذا عيب خطير في الحزب الذي يتأسس بقرار فوقي.<br />لقد حدث في نهاية السبعينات أن بدل السادات حزب مصر العربي الذي كان يترأسه بالحزب الوطني فاذا بكل القيادات تهرول إلى حزب السادات الجديد، الأمر الذي دفع الكاتب الصحفي مصطفى امين إلى انتقاد هذه الهرولة التي ليس لها ما يبررها سوى الجري وراء السلطة، والتعلق في ذيلها. فغضب السادات، وأقال أمين بعض الوقت إلى أن تدخل البعض فأعاده إلى رئاسة تحرير صحيفة \\\"أخبار اليوم\\\"، وظل الحزب الوطني هو حزب الرئيس أو حزب الحاكم وليس الحزب الحاكم، وظل البرلمان يشرع للرئيس كل ما يريد من قوانين، ويشرع للحكومة الظلم، واضيف اليه مجلس الشورى الذي تعرض لحريق مؤخرا ففرح المصريون، وتمنوا لو أن الحريق قد شمل الأعضاء جميعا وبدون استثناء لأنهم شاركوا في التشريع لحكم مستبد، ساهم في اضعاف دور مصر العربي والدولي وساهم في افقار ملايين الفلاحين والعمال الفقراء في حين ازداد الاثرياء وتجار الأراضي ثراء، وقد حصلوا على أراضي الدولة بأسعار زهيدة لا تزيد عن 20 جنيها للمتر ثم باعوها بثلاثة آلاف جنيه للمتر، حتى أن محافظة 6 أكتوبر نهبها تجار الاراضي من أباطرة الحزب الحاكم، وهؤلاء التجار انفقوا الأموال على الراقصات وبنات الليل في حفلات سفه، ومجون تليق بالنظام السياسي الذي وفر لهم المناخ الملائم للنهب والاثراء الحرام، وتدعمهم حكومة مرفوضة شعبيا، وكل ذلك ساهم في الترسيخ لديمقراطية عرجاء لا تقوى على الصمود امام التحديات والمتغيرات."
archived = "2010-03-14"
