subject = "وطلب نور خطوة حسن نوايا من الحكومة وفى ظرف ايام مع"
author = "كوسة افندى"
posted = "2009-02-26"
text = "هو اتسجن علشان حاول يرشح نفسة رئيس جمهورية وهو عارف اصلا انة مش حينجح بس حيعمل شوية دوشة وقلق ودة طبعا حيعكنن على الحكومة الوحيدة والفريدة والرئيس الفلتة اللى مفيش زية وسلملى على الفساد اللى بقى منتشر زى السرطان فى المجتمع والفضل يرجع اولا واخيرا للراعى الرسمى والاب الروحى للحزب"
