subject = "ايمن نور ابدا صفحة جديدة بعيد عن ميتين ابونا"
author = "مش كاتب"
posted = "2009-02-27"
text = "الاعتراف بالاخطاء في الكنيسة<br />وعايز تبدأ صفحة جديدة بعيد عن ميتين ابو الشعب المنكوب دا<br />كفاية علينا جمال عبدالناصر واللي عملوا في ميتين ابونا<br />خلينا زي ما احنا وخلاص<br />افضل من تجربة فاشلة جديدة تقضي على الاخضر واليابس"
archived = "2010-03-14"
capture_url = ""

