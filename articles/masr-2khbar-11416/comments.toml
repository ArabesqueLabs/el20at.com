[[comments]]
order = 2
subject = "ايمن نور --------- طريقك يا ولدى مسدود مسدود -----"
author = "اكتب اسمك هنا"
posted = "2009-02-26"
text = "الفساد ضرب جذورة فى حتة فى البلد<br />لا امل فى اى اصلاح ولا فى اى حاجة<br />انا مصرى فى رايى ان الاحتلال هو الحل ويا ريت الاحتلال الامريكى<br />وانا انتظرهم ان يجعلوا مناورة النجم الساطع الى حقيقة<br />مفيش فايدة يا ايمن<br />بعد شهر يا ابنى او اتنين هنقرأ خبر ان سيارة ايمن نور انقلبت على الطريق الصحراوى او لبست فى مقطورة عطلانة وصعدت الروح الى بارئها<br />مش هيسيبوك<br />دول طلعوك من السجن علشان يقتلوك او يمكن فية احد يرميك من البلكونة ويقولوا انتحر لان افكار سوداوية واكتئاب حاد كان ينتابة<br />انتظر امثال السكرى وزملائة فهم قادمون"
archived = "2010-03-14"
capture_url = ""

[[comments]]
