[[comments]]
order = 1
subject = "هل القضاء متورط عشان يتم الحكم بسرعة دة لجبهة ايمن"
author = "صحفى"
posted = "2009-02-26"
text = "يعنى اية الصفقة ان يتم رجوع الحزب لجبهة بحكم المحكمة يعنى معنى كدة القضاء متورط فى تلك اللعبة القذرة معقول هذا الكلام وبعدين دة حكم اول درجة بس لو جبهة ايمن نور كسبت بحكم نهائى بات هحس ساعاتها مقولة ان القضاء الحر النزيهة دة كلام فى الاوهام وكلة بيلعب على كلة للاسف الشديد"
archived = "2010-03-14"
