[[comments]]
order = 0
subject = "اشهر جزار فى مصر فى عصر المماليك - ابو الحسن الجزار"
author = "عجوز"
text = "كان ابو الحسن شاعرا واديبا يكتب القصائد والمقالات فى مدح الحكام وينافقهم وينال منهم العطايا والاموال<br />الا انة فجاة قرر ترك الاداب والشعر واشتغل جزارا<br />فراح القاضى شرف الدين يسالة لماذا ترك الادب - فقال لة<br />لا تلمنى يا سيدى شرف الدين ------------------------------------------ على ان رايتنى قصابا<br />كيف لا اعشق الجزارة ما عشت ------------------------------------------ حياتى وارفض الادابا<br />وبها صارت الكلاب ترجينى --------------------------------------------- وبالشعر كنت ارجو الكلابا<br />كل سنة وانتم طيبين"
archived = "2008-12-13"
capture_url = "https://web.archive.org/web/20081213163934/http://masr.20at.com:80/newArticle.php?sid=18769"

[[comments]]
order = 1
subject = "المعلم رضا الجزار فى فيلم السفيرة عزيزة ومدى جبروتة والرعب منة"
author = "مصطفى"
text = "كلنا نذكر فيلم السفيرة عزيزة للراحلة الرائعة سعاد حسنى<br />وشخصية اخوها المعلم محمد رضا الجزار القاسى القلب الذى يرفع السكين والمحد والبروة فى وجة خصومة مسببا لهم الرعب بحيث لا يتجرأ احدا من كان على معاكسة او حتى مطالعة وجة اختة سعاد حسنى حتى لقبت بالسفيرة عزيزة لشدة مناعتها بواسطة المعلم الجزار المفترى الذى يزور فى الميزان ويبيع اللحم المغشوش<br />واخطر ما عند المعلم الجزار هم صبيانة الذين يضربون خصوم المعلم بقسوة<br />اما الان فقد فقد المعلم الجزار صبيانة وهم قوتة الضاربة والمعلم نفسة يرسل ذبائحة الى السلخانة للذبح ويستلم الذبيحة جاهزة ولا يقوم بالذبح بنفسة وانما مجرد معلم يقطع ويوزع اللحم فى دكانة من الذبيحة<br />واخطر الذباحين هم ذباح الجمال<br />وقد سافرت مرة الى بلبيس لمشاهدة طريقة ذبح جمل وكيف يتم الذبح وكم كان قاسيا وجبارا جزار الجمال وصورت ذلك بكاميرا فيلم احتفظ بة ويسمية الاطفال فيلم الرعب<br />اما اهيف الجزارين فهو جزار المعيز<br />ولقد تصادف ان كان عندى ارنب كبير جدا فأخذت الارنب الى احد الجزارين الشباب الاقوياء لذبحة فرفض جميع الجزارين بلا اثتثناء ذبح الارنب وقال لى اخدهم انة على استعداد لذبح جمل اما ارنب فلا - لان الارنب عند الذبح يصرخ صرخة مرعبة توقع قلب اشد الجزارين قسوة<br />ولم يحل لى مشكلة ذبح الارنب غير امرأة عجوز كانت فى اول الشارع تبيع الفراخ ولم تهتز ابدا لصراخ الارنب الحاد رغم اختفائى داخل السيارة حتى سلختة"
archived = "2008-12-13"
capture_url = "https://web.archive.org/web/20081213163934/http://masr.20at.com:80/newArticle.php?sid=18769"

[[comments]]
order = 2
subject = "ومين مبيخافش من الجزار"
author = "عكاوى ممبار الفشاوى"
text = "الجزار حلاوة العنتبلى والجزار السبكى المنتج والجزار حسنى مبارك بس الاخرانى دة بيختلف عن الاتنين اللى قبلية لانة بسكين الرئاسة ومسن الحزب او الخرب الحاكم دبح تمانين مليون دفعة واحدة"
archived = "2008-12-13"
capture_url = "https://web.archive.org/web/20081213163934/http://masr.20at.com:80/newArticle.php?sid=18769"
