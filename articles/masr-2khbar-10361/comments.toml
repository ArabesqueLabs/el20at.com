[[comments]]
order = 4
subject = "مش عارف"
author = "مش عارف"
posted = "2008-10-31"
text = "صرح زياد العليمى محامي نهي رشدي اول فتاة تقاوم التحرش لشبكة الاعلام العربية \\\" محيط \\\" بأن ما إثارته نجلاء الإمام المحامية بالنقض ونشرته جريدة \\\" المصري اليوم \\\" والتي قالت إنها توصلت لمعلومات عن المدعية، جعلتها تقرر التخلي عنها بعد 3 أيام من صدور الحكم، هي أن نهي من عرب 48 ومولودة في يافا شمالي تل أبيب وتحمل جواز سفر إسرائيلي ، ان هذا الكلام غير صحيح بالمرة وقال :\\\" الأستاذة نجلاء ليست محامية نهي من الأساس وانني احمل توكيلا من نهي في القضية ، كما ان نهي ابنه لام مصرية واب مصري وأن جدها يحمل حق اللجوء الفلسطيني في مصر وان ابوها لم يدخل فلسطين قط \\\" .<br />ويتابع قائلا \\\" من المعروف أن الجامعات المصرية لا يدخلها الإسرائيليين ونهي خريجة جامعة القاهرة كلية الحقوق عام 2005 فكيف اذا انها إسرائيلية \\\" .<br />والحقيقة كما جاءت علي لسان زياد \\\"ان نهي تقابلت مع الأستاذة نجلاء عقب برنامج 90 دقيقة وتعرفت عليها وعرضت مساعدتها عليها تضامنا معها كما كان موقف ثلاثه محاميات اخريات وهم المحامية صفاء حلمي من المنظمة المصرية لحقوق الإنسان والمحامية أمل من المركز المصري لحقوق المرأة ، والأستاذة نجلاء كانت من منظمة بريق .<br />ويكمل \\\" لكن المشكلة حدثت عندما طلبت الأستاذة نجلاء من نهي أن تظهر معها بعد الحكم في برنامج 90 دقيقة أيضا وتعلن انها محاميتها كنوع من الدعاية لها ولكن نهي رفضت وكانت من هنا المشكلة بين نجلاء ونهي ويشهد علي ذلك معد برنامج 90 دقيقة أستاذ ممدوح ويمكنكم أن ترجعوا له فهو كان شاهد علي هذه المشكلة \\\" .<br />وعن ظهور نهي في برنامج علي قناة \\\" ام بي سي \\\" قال : \\\" نهي فعلا ظهرت في برنامج أذيع علي القناة ولكن شرائط البرنامج موجودة ويمكننا الرجوع إليها ولكن لم تقل أن \\\"إسرائيل دولة محترمة \\\" ولم يقل المذيع إن حوادث التحرش لا تحدث في إسرائيل \\\" ولا كل ما ذكر على لسان الأستاذة نجلاء \\\".<br />\\\" وقعت الأستاذة نجلاء في الفخ الذي نصبته لنهي هكذا علق زياد علي كلامها قائلا :\\\" يعتبر كلام أستاذة نجلاء للمصري اليوم جريمة سب وقذف علانية وهذه جريمة اقل حكم فيها سنة كما أن هناك بعض الثغرات في كلام استاذة نجلاء تلفت نظرا أي شخص دارس قانون وهي أنها قالت أنها سوف تستأنف الحكم ضد المتهم الرئيسي ومعروف انه في نوعيه قضايا الجنايات لا تستأنف وإنما يطعن بالنقض \\\" ، كما أن المادة 80 من القانون ينص انه يحق لنقابة المحامين ان تفصل محاميا تخلي عن موكله لصالح المتهم \\\" .<br />وأكد زياد ان نهي تحمل وثيقة لجوء سياسي ولذلك لا يسعها ان تحمل باسبورا اخر"
archived = "2010-03-14"
capture_url = ""

