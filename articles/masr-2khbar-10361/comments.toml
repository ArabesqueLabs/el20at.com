subject = "بلاوى وبتتحدف علينا    فين بتوع مباحث امن الدولة"
author = "مصرى"
posted = "2008-10-30"
text = "تحمل جواز سفر اسرائيلى<br />المفروض انها تحت المراقبة 24 ساعة<br />انما بتجرى وتتصرمح فى البلد وتلبس عريان وتصور اللى هى عايزاة تحت بند او غطاء انها مصورة افلام تسجيلية<br />فية احد سالها وسال ابوها - لما هى لاجئة فى مصر بتدبر مصادر رزقها منين وعايشة بالمستوى دة فى مصر الجديدة من اى دخل<br />من البداية ادركت ان الوش المكشوف دة والكلاحة وعدم الحياء مش وش مصرى عندة حياء<br />البنت المصرية عندها حياء<br />حتى لو واحد جاهل عايز يمد ايدة عليها بتجرى بترجع لورا - بتشتمة وبترفع علية الشبشب ان لزم الامر - انما البنت دى عندها صهينة وكلاحة وقلة ادب<br />نحن لا ندافع عن الغلط ولكن الحكم كان قاسى جدا - لية 3 سنوات سجن - يعنى قتلها مثلا<br />اقصى حاجة كان حجزة اسبوع او حتى شهر فى السجن<br />ولكن بما انها صهيونية وتحمل الجواز الاسرائيلى فيبقى الكل معاها"
archived = "2010-03-14"
