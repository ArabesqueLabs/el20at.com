subject = "واحدة محترفة تحرش وسبق لها اتهام ضابط فرنسى بالتحر"
author = "واحد من مصر"
posted = "2008-10-31"
text = "انتم بتدافعوا عن اية<br />عن بنت لابسة عريانة وبتقول لاى شخص تعالى عاكسنى واسرائلية الجنسية<br />انتم فقدتم الحس الوطنى وبقى الاسرائيليون حبايبكم وهم على الجانب الاخر بيستعدوا لضربكم فى اى وقت<br />انا مغتاظ من حكاية حكم ال 3 سنين على المتهم اللى البنت دى وقفت لة لما قعد يلعب فى صدرها وبعدين راحت اشتكت<br />الضابط فى القسم سالها انت مش شايفة نفسك لابسة اية<br />وبعدين بيقول لك خريجة حقوق وبتشتغل مخرجة او مصورة افلام تسجيلية<br />هم الاجانب فى مصر البلد بقت سداح مداح قدامهم يشتغلوا اللى هم عايزينة<br />الفليسطينى فى دول الخليج والسعودية قبل ما يشتغل لازم يبقى فية كفيل لة يشتغل معاة وبيبقى عارف بيشتغل اية ومسئول عنة وعند اجراء اى مخالفة صغيرة بيطردوة برة الحدود<br />انتم عندكم حنان زائد قوى<br />انا واثق ان الراجل المحكوم علية فى الاستئناف هياخد حكم او اقصى حاجة شهر سجن<br />بطلوا خبل"
