text = "محامية تافهه. غاية شهرة وهبلة. مش عارف أزاى بتدافع عن الباطل ال بعد ماعرفت أن نهى أسرائيلية (وهو كلام غير صحيح حسب رد نهى علسها اليوم فى جريدة المصرى اليوم) الموضوع والقدضية فى المقام الأول عن التحرش وليست عن أشخاص. وعلى فكرة هى ليست محامية لنهى ولكن فرضت نفسها لمجرد الظهور فى الأعلام زى العيال اللى بيقفوا فى خلفية الصورة فى التليفزيون علشان أصحابهم يشوفوهم. فهى بالفعل محامية هبلة."
