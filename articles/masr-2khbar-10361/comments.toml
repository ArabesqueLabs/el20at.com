text = "مدفوعة من اسرائيل لتشوية سمعة مصر وسمعة المصريين واختلقت تلك القصة التى تم نشرها عبر اخبار العالم وظهر للسياح ان مصر بلد تغتصب فية النساء على قارعة الطريق عيانا جهارا وليلا نهارا فالغت كثير من السياح رحلاتهم لمصر<br />وهناك بلاغ للنائب العام بوقف تنفيذ الحكم على المتهم البرىء وتقديم تلك الفتاة المشبوهة للمحاكمة كما نشرت ذلك جريدة المصريون<br />البلد سداح مداح ومرتع لجواسيس اسرائيل ليشوهوا سمعة مصر<br />اضربوا بيد من حديد على اصابع اسرائيل الخفية فى مصر"
