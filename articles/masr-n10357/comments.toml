text = "احب انى اعلن اعتذارى للفنان نور الشريف بعد ما قلت ف احد تعيقاتى السابقه لرمضان اللى فات ان يا ريت يريحنا شويه من مسلسلاته اللى كل سنه بس فعلا مسلسل حضره المتهم خلانى اعتذر لانه فعلا كان اكتر الاعمال تميزا<br />يا ريت الاعمال الجايه تبقى على نفس المستوى و ميكررش تجارب الحاج متولى و العطار"
