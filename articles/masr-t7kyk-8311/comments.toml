[[comments]]
order = 0
subject = "اين صديقى حسن ؟"
author = "الشاعر احمد مطر"
posted = "2008-02-24"
text = "زار الرئيس المؤتمن<br />بعض محافظات الوطن<br />وحين زار حينا<br />قال لنا<br />هاتوا شكاويكم فى العلن<br />ولا تخافوا احدا<br />فقد مضى ذلك الزمن<br />فقال صا حبى حسن<br />ياسيدى<br />اين الرغيف واللبن<br />واين تأمين السكن<br />واين توفير المهن<br />واين توفير الدواء للفقير بلا ثمن<br />يا سيدى<br />لم نرى من ذلك شيئا ابدا<br />قال الرئيس فى حزن<br />احرق ربى جسدى<br />اكل هذا فى بلدى<br />شكرا على صدقك فى تنبيهنا يا ولدى<br />سوف ترى الخير غدا<br />وبعد عام زارنا<br />ومرة ثانية قال لنا<br />هاتوا شكواكم بصدق فى العلن<br />ولا تخافوا احدا<br />فقد مضى ذلك الزمن<br />لم يشك الناس<br />فقمت معلنا<br />اين الرغيف واللبن<br />واين تأمين السكن<br />واين توفير المهن<br />واين توفير الدواء للفقير بلا ثمن<br />واين صاحبى حسن ؟"
