[[comments]]
order = 0
subject = "ومن جعلهم شيوخنا"
author = "ازهرى قديم"
posted = "2007-10-28"
text = "اختيار اى موظف فى بلدنا الحبيب يتم اختيارة بواسطة مباحث امن الدولة ابتداءا من شيخ الخفر والعمدة وطالب الحربية ووكيل الوزارة - ويقول لك الترقية بالاختيار يعنى الكبار بتوع الامن يختاروة<br />وينطبق الامر على عمداء الكليات ورؤساء الجامعات ويختارون عن طريق الامن<br />يعنى بعيد عنكم دولة بوليسية ديكتاتورية من الطراز الاول<br />وشيخنا جاء بهذة الطريقة لا بيحل ولا بيربط ولا لة اى لزمة غير انة بوق من ابواق النظام ويحلل للحكومة ماتريد ويحرم على الشعب ماتريدة الحكومة<br />الشيخ جاى من بلدهم فى قطار الدرجة الثالثة لقى نفسة قاعد فى فيلا وبيهبر الشىء الفلانى يبقى مش لازم يعض الايد اللى جابت لة النعمة<br />العملية فى البلد دى عايزة بانجو علشان ننسى الواقع المر<br />يا موزعى الداخلية البانجو فين"
archived = "2007-10-29"
capture_url = "https://web.archive.org/web/20071029194205/http://masr.20at.com:80/newArticle.php?sid=12135"

[[comments]]
order = 1
subject = "عيب كده"
author = "احمد رجب"
posted = "2007-11-06"
text = "عيب اقوي كل الهجوم ده علي عالم من كبار العلماء يعني مش كفاية اننا مش بنقبل ايده كمان نشتمه ونهرئه كده .<br />اولا هو ده اللي قال اللي قال عمل الرجل في كوافير النساء حرام وهو برده اللي قال اختيار ملكة جمال مصر حرام ومع ذلك محدش اخد بفتواه وبالنسبة بقي لموضوع الصحفيين هو لم يحدد الصحفيين من غيرهم يعني مثلا لما يقول الحرامية تقطع ايديهم يبق بتوع القروض يهاجموه برده بس كده ، يعني كل واحد حاسس انه بتاع اشاعات وكلام كذب وقال في حق شيخنا الجليل كلمة مش كويسة يبقي هو فعلا ......... ، يجماعة احنا مش في وقت فرقة كفاية قوي اللي بيحصل في العالم الاسلامي سنة وشيعة و صوفية وغيره وغيره واللي عاوز يعرف قيمة الشيخ طنطاوي يقرأ كتاب اسمه ( القصة في القران ) والله انا مقصدش اي حاجة من كلامي ده غيره وجه الله الكريم والله علي ما اقول شهيد."
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205193711/http://masr.20at.com:80/newArticle.php?sid=12135"

[[comments]]
order = 2
subject = "مع من شيخنا"
author = "مسلم"
posted = "2007-11-06"
text = "الشيخ هو مع الدين ومبادئة وخدمة المسلمين ومع الفقير قبل الغنى<br />والشيخ لن يخترع فى الدين ولكنة يشرح الغامض ويبين للناس طريق الصواب<br />انما شيخنا هذا بالذات<br />لا يسأل اين الفقير ليقف بجانبة ولكن يسأل اين القوة ليقف بجانبها واعنى السلطة<br />اين هو من الساكنين فى المقابر - والعاطلين عن العمل - والجوعى والمرضى<br />اين هو من بيع البنوك والمصانع والشركات<br />اين هو من الفساد والافساد<br />اين هو من شواطىء العراة فى مارينا والساحل الشمالى<br />فقط الصحفيين يجلدوا<br />ومن هم الذين تم جلدهم من قبل<br />الا ترى ان اختيارة لهذا المنصب كبير علية قوى"
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205193711/http://masr.20at.com:80/newArticle.php?sid=12135"

[[comments]]
order = 3
subject = "مجرد راي"
author = "اكتب اسمك هنا"
posted = "2007-11-28"
text = "الاخ الكاتب حمل الازهر والمفتي والمؤسسة الدينية مسؤولية ما يحدث<br />لماذا لم يحمل وزير الدفاع ووزير الداخلية هذه المسئولية<br />ولماذا الشيخ سيد طنطاوي وحده هو الذي يتحمل<br />وماذؤا تتوقع ان يكون سيد طنطاوي<br />اي كلمة بره الازهر<br />وكلمة تانية جوا المعتقل<br />وبناء على ذلك شيخ الازهر يتعامل مع الواقع"
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205193711/http://masr.20at.com:80/newArticle.php?sid=12135"
