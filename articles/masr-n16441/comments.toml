[[comments]]
order = 0
subject = "احمد عز وجمال مبارك وبداية التعاون من لندن"
author = "حنفى نوكيا"
text = "عز باشا اتعرف على جمال باشا لما كان التانى بيشتغل فى بنك امريكى فرع لندن واتفقوا انهم يشتروا مصنع بميتين مليون دولار ورجع عز باشا لمصر وخد المبلغ بضمان وتوصية وتسهيلات من الباشا جمال وابتدى يشتغل ويطور بجميع التسهيلات المتاحة لسيادتة اولا وثانيا وثالثا وبعد كدة يبتدى جمال باشا وعز باشا وبقية المحظوظين من اصحاب الباشا جمال بدخول المجال السياسى من اوسع ابوابة والوصول الى الصفوف الاولى فى القيادة فى زمن قصير جدا وفق خطة مبرمجة لادارةالبلد باسلوب اضرب واجرى امابالنسبة للباشا الكبير الريس مبارك فاتمنى لة سباحة وعوم فى شواطى ومنتجعات شرم الشيخ وميمنعش قعدة طاولة مع حد من صحابة فى الجنينة يتسلى قبل مينام وعلية العوض ومنة العوض"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151129/http://masr.20at.com:80/newArticle.php?sid=16441"

[[comments]]
order = 1
subject = "احمد عز رجع من لندن بعد معرفة جمال وهبر 200 مليون من البنك بتسهيل من جمال"
author = "شايف"
text = "العملية ابتدات بقرض من البنك ب 200 مليون جنية وبدون اى ضمانات بعد توصية تليفونية من جمال لمدير البنك<br />وابتدأ الشغل<br />اصبحوا فى هذا المصنع يستهلكون طاقة كهربائية تكفى 4 محافظات 80 ميجاوات فى تسييح حديد الخردة المستورد وعملة اسياخ حديد واحتكار السوق وياخدوا الطاقة الكهربائية مدعمة وبملاليم ويقطعوا الكهرباءس عن بيوت الناس<br />اذن احمد عز يتكلم باسم سيدة وتاج راسة جمال<br />اما توزيع عائد بيع الحديد بين عز وجمال فيعلمة اللة<br />والموضوع بأكملة يندرج تحت الفساد الحكومى واستغلال السلطة وضرب القانون بعرض الحائط<br />ومفيش دولة فى العالم تدار بهذة الكيفية<br />ابن الرئيس يكون ميليشيا اقتصادية تستغل الظروف<br />وانتم عارفين اولمرت فى اسرائيل بيحاكم علشان كم الف دولار مش مليارات"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151129/http://masr.20at.com:80/newArticle.php?sid=16441"

[[comments]]
order = 2
subject = "الى اخي وحبيب خباب"
author = "اسلام ماهر عقل"
text = "قدرتك التحليلية تتطور يوما عن يوم ومقال عن مقال وان كان الامر يحتاج لبعض التدقيق اللغوي والاملائي بما يتناسب مع طبيعة الجمل والفقرات،وهذا أمر يسهل تداركه والعلم به.<br />مع الاخذ في الاعتبار ان لديك من الهمة والحيوية والعزيمة ما يؤهلك لان تبلغ مصاف الكتاب المشاهير وهذا ما اتوقعه منك باذن الله فانت مجتهد ولكل مجتهد نصيب<br />ولم أرى من عيوب الناس عيبا.....................................كعجز القادرين عن التمام"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151129/http://masr.20at.com:80/newArticle.php?sid=16441"

[[comments]]
order = 3
subject = "وجووووووووووون"
author = "كركوبة"
text = "- أن أمنية \\\\\\\"المواطن المصري\\\\\\\" اليوم في \\\\\\\"العز\\\\\\\".. مجرد \\\\\\\"دريم\\\\\\\" ؟!<br />أم أن ظهوره تزامن في هذا التوقيت تحديدا – ليلة امتحان \\\\\\\"الاقتصاد\\\\\\\" للثانوية العامة- ليعرف الطلاب أن عز هو الاقتصادي الحقيقي؟! ..<br />اسئلتط ف الجووووووووووون هايل يا خباب ربنا يوفقك اكتر واكتر وتجيبلنا اجوان علطول"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151129/http://masr.20at.com:80/newArticle.php?sid=16441"

[[comments]]
order = 4
subject = "تسقط العاشرة مساء ومني الشاذلي"
author = "مصطفي الشرنوبي"
text = "الست مني الشاذلي لا تقولي لنا انه ضيف علي قناة دريم ولابد من احترامة نحن لا نقول اهينو احمد عز نحن كنا نريد منك اجابات محددة اين حديديك ليه مانعو ينزل السوق متي بنزل سعر الحديد فين باقي تجار الحديد ليه مجمعتيش كل الحديدية مع بعض ونشوف من الكذاب فيهم انتي زعلتي العالم كلة منك حتي الاعتزار لاينفع لابد ان يعلم مدير دريم ان قناة اهم من احمد عز لماذا ضحي بكي وببرنامج العاشرة مساء احمد عز يعيد المصريين لعهد الملك فاروق فقر نسكن تحت الجريد المسوس منك لله يامني الشاذلي كان عندنا امل تحرجية وينزل سعر الحديد ولكنك جالسة تضحكي معه حسبيا الله"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151129/http://masr.20at.com:80/newArticle.php?sid=16441"
