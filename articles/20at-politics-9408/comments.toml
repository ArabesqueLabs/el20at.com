subject = "كويس قوي يعنى احنا كده حلوين"
author = "ملوش لازمة"
posted = "2008-06-23"
text = "يا سلااااااااااااااااااااااااااااااااااااام<br />حلو قوى ابن الحاج ساركوزي ده<br />اكد ليا ان الفكر الجديد الجاي علينا نوع من أنواع الحضارة والتقدم<br />مبروك عليك يا جمال با ابن ام جمال<br />بس تعرف ان خايب برضه<br />جان افندي اللى عنده 21 سنة وصل لمكان احسن منك وانت اللى عندك معرفش كام و 40 سنة<br />خلي بالك بقى على عيال الحاجة خدوجة عشان يبقوا شطار زي عمو جان<br />الالهي تولعم بجاز وسخ انتو الكل ومعكم البت بتاعة اسرائيل دي"
