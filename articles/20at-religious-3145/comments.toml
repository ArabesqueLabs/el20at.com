text = "قال القرضاوى \" حسن نصر الله لا يختلف عن الشيعة المتعصبين , فهو متمسك بشيعته ومبادئه , ولا يمكن أن ننكر ذلك , ولكنه أفضل من غيره من القاعدين والمتخاذلين , واستدرك الشيخ يوسف القرضاوى \" أؤيد حزب الله فى مقاومته , وأدعو إلى التقريب بين المذاهب , لكن لا أقبل أن يخترقوا بلادنا , محذرا من وقوع مذابح مثلما يحدث فى العراق بين الشيعة والسنة إذا حدث اختراق شيعى لمصر , فيجب أن نكون على يقظة.<br />وذلك تحديداً ما قلناه .. لا تكونوا سذج وكونوا واعيين لما يقوله الشيعة<br />لدينا مصريين اتخذوا التصوف عباءة لتشيعهم .. ولو بحثتم علي شبكة النت لوجدتم منتديات شيعية كـ\"منتديات شيعة مصر\" تسبكم ليل نهار وأنتم هنا تساووا بينها وبين بعض المغالين وتقدسوا وتعظموا حثالة كمقتدي الصدر أو تعظموا عميل مأجور كحسن نصر الله .. في الخليج ولبنان يطلق أهل السنة علي \"حزب الله\" اسم \"حزب اللات\" كونهم أقرب معرفة بمخاطر حزبه<br />كذا لي صديق لبناني بعمل طبيباً في بيروت يحكي لي مآسي علي ما يراه علي أيدي الشيعة وعلي أيدي حزب الله .. علي الحالات التي تصله وأسبابها وعلي سباب الصحابة الأخيار الذي طالما سمعه<br />هل عرفتم من قبل شيئاً علي ما تقوله كتب الشيعة في مصر وأهلها؟<br />لا هم قادرين علي تكذيب أحاديثهم ولا هم قادرين علي الاعتراف بكونهم دياثة!<br />- الكافي - الشيخ الكليني ج 6 ص 386 :<br />علي بن إبراهيم ، عن أبيه ، والحسين بن محمد عن معلى بن محمد جميعا ، عن علي بن أسباط ، عن أبي الحسن الرضا قال : سمعته يقول : وذكر مصر فقال : قال النبي : لا تأكلوا في فخارها ولا تغسلوا رؤوسكم بطينها فإنه يذهب بالغيرة ويورث الدياثة .<br />- الكافي - الشيخ الكليني ج 6 ص 391 :<br />3 - محمد بن يحيى ، عن أحمد بن محمد ، عن يعقوب بن يزيد رفعه قال : قال أمير المؤمنين : ماء نيل مصر يميت القلوب .<br />- وسائل الشيعة (آل البيت ) - الحر العاملي ج 2 ص 58 :<br />باب كراهة غسل الرأس بطين مصر ، والتدلك بخزف الشام<br />[ 1473 ] 1 - محمد بن يعقوب عن علي بن إبراهيم ، عن أبيه ، عن علي بن أسباط ، عن أبي الحسن الرضا ( ) قال : قال رسول الله ( ) : لا تغسلوا رؤوسكم بطين مصر فإنه يذهب بالغيرة ،ويورث الدياثة .<br />- بحار الأنوار - العلامة المجلسي ج 63 ص 533 :<br />ومنه : عن علي بن إبراهيم عن أبيه وعن الحسين بن محمد عن المعلى جميعا عن علي بن أسباط عن أبي الحسن الرضا قال : سمعته يقول وذكر مصر فقال :<br />/ صفحة 534 /<br />قال رسول الله : لا تأكلوا في فخارها ولا تغسلوا رؤسكم بطينها فانه يذهب بالغيرة ، ويورث الدياثة .<br />ثم قال المجلسي شارحا للرواية في نفس الصفحة:<br />بيان : ذهاب الغيرة معلوم من سياق قصة العزيز وامرأته كما لا يخفى على المتأمل ، أقول : وقد أثبتنا بعض الاخبار في ذلك في باب آداب الشرب<br />(بحار الأنوار: 60/208 تفسير القمّي: ص596)<br />أبناء مصر لُعنوا على لسان داود عليه السّلام، فجعل الله منهم القردة والخنازير.<br />(بحار الأنوار: 60/211)<br />انتحوا مصر لا تطلبوا المكث فيها لأنه يورث الدياثة.<br />(بحار الأنوار:60/210 تفسير العياشي: 1/305 البرهان: 1/457)<br />بئس البلاد مصر<br />(بحار الأنوار: 60/ 208-209 قرب الإسناد: ص 220، تفسير العياشي: 1/304 )<br />ما غضب الله على بني إسرائيل إلا أدخلهم مصر، ولا رضي عنهم إلا أخرجهم منها إلى غيرها."
