[[comments]]
order = 8
subject = "الي أخي المصري ومن أيده"
author = "رامي"
posted = "2007-02-10"
text = "أتفق مع أغلب ما قاله المصري .. لكنه وأنتم تغفلون نقاط هامة وضرورية لابد من توضيحها وتبيينها جيداً خاصة ان كنتم مثلي مصريين .. في مصر معرفتنا بالشيعة بسيطة جداً وضعيفة جداً جداً وذلك لقلة الشيعة بيننا أو لعل السبب في كون الحكومة لا تعمد الي القاء الضوء عليهم .. بينما نحن معرفتنا أكبر بعقيدة النصاري علي عكس مسلمي الجزيرة مثلاً فالأمر له علاقة بالطبيعة والمكان الذي نعيش به<br />نحن لن نسير حول المتشددين والمكفرين لكن لابد وأن نكون واعيين بما يحدث من حولنا .. من منكم يعلم عن ميلشيات المهدي وفيالق بدر وفرق الموت ؟.. من منكم يعلم عن محمد الدريني زعيم الشيعة في مصر وسبابه ولعانه المسجل في حق الصحابة الأخيار؟ .. من منكم يعلم أنهم ومن سنوات وبمساعدة ايرانية يحاولوا انشاء حزب سياسي لهم في مصر؟ .. فقط تسمعوا عن الاخوان وبالكاد سمعتم مؤخراً عن أقباط المهجر لكن هل سمعتم عن محمد الدريني؟ .. من منكم سمع عن نشاط التشيع في مصر والذي حذر منه القرضاوي؟ .. من منكم ذهب الي معرض الكتاب فوجد دور نشر سنية وشيعية تنشر كتب دعوية للتشيع خاصة بعملاء ايرانيين كأحمد راسم النفيس وغيره؟ .. من منكم يعلم ولو النذر اليسير عن استباحة دماء السنة بيد شيعة لبنان؟ .. من منكم يعلم شيئاً عن اقليم الأهواز في ايران وقصته؟ .. من منكم سمع بمصحف فاطمة (أولئك الذين نسبوا لأنفسهم كتاب غير كتابكم) .. منمنكم يعلم أن لهم كتب حديث غيركم؟ .. من منكم يعلم أن الشيعة يومياً يستخدموا في أذكارهم لعنات علي الصحابة الكرام كـ\"اللهم العن صنمي قريش أبو بكر وعمر\"!! .. من منكم يعلم أنهم يصدقوا حادثة الافك ولا يكفوا في الطعن في شرف أمهات المسلمين؟ .. من منكم يعلم أنهم يحلوا زواج التمتع وشرب المخدرات ووو .. من منكم يعلم أن البهائية والبابية وكل الديانات القذرة لم تخرج الا من عباءات الغلو المتزايدة في عقائد الشيعة؟ .. من منكم يعلم أن حزب الله سبق وأن اعترف مراراً بأن ولائه لايران قبل كل شئ؟ .. من منكم يعلم عن سياسة تصدير الثورة الايرانية ؟.. من منكم يعلم عن حادثة الحجيج في مكة؟ من منكم ومن منكم .. سأتفق معكم في قول واحد هو الأتي \"كفي تكفير ونحتاج فعلاً للتجمع لكن بالعقل .. لا بسعي الجاهل الغير عالم بمن حوله .. بالنسبة للشيعة فهم طوائف متعددة بالفعل .. أكثرها غلواً ويندرج تحتها كل ما قلناه هم الاثني عشرية وهم شيعة ايران والعراق .. وأقربهم الينا هم الزيدية .. فاحذروا الكفر البين من الأوائل وكفوا أيدي القتلة في لبنان والعراق ثم كفوا محاولاتهم للتشييع في مصر وسوريا ومن بعدها تعالوا لنتحدث عن تجمع\"<br />انتهي"
