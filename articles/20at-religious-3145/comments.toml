[[comments]]
order = 18
subject = "لأبكين عليك بدل الدموع دماً"
author = "بحرانية"
posted = "2007-10-25"
text = "اولاً لا أرى اي مشكلة في ما يفعله الشيعة في عاشوراء فهم يبكون على سبطن الرسول صلى الله عليه و آله و سلم الذي بقي ضامياً ثلاثة أيام و قتل مقطوع الرأس و بقي جسمه من دون غسل و لا أكفان ولا دفن تدوسه خيل الأعداء ثلاثة أيام و الذي بكته السماء و الأرض دماً (حسب روايات ابن كثير السني المذهب ) و قتل أبنه الرضيع البالغ ستة أشهر في حضنه وكل ذنبه هو انه أبن حفيد المصطفى صلى الله عليه و آله وسلم و قطعت أوصال أبه على الأكبر و قتل أخوته و أصحابه و سبيت نساءه و عياله و رفع رأسه فوق عالية الرماح و طافوا به من بلد الى بلد و تلوموننا لمجرد أننا نبكيه حزناً و لكن أقول لسيدي لأندبنك صباحاً و مساءاً و لأبكين عليك بدل الدموع دماً.و أريد أن أذكر ان بكاءنا على سيد الشهداء لا يؤذي أحداً بعكس ما يفعله بعض السنة من تحليل دم الشيعة و قتلهم بكافة الطرق الوحشية و تكفيرهم .<br />و سيعلم الذين ظلموا أي منقلب ينقلبون و العاقبة للمتقين"
archived = "2010-03-14"
