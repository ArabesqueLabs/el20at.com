subject = "تثقف"
author = "أخي"
posted = "2007-04-04"
text = "رد الأخ رامي لا أوفى ولا اضاف بل حتى لم يرد على معظم ما جاء من أسئلة. وبالنسبة للثقافة فلابد أن نقرأ عن هذه الأمة تاريخًا وواقعًا لنعرفها حق المعرفة قبل أن ننصح الآخرين بالتتثقف. ولكني لا أنتوي أن أرد بأكثر من هذا لأن الحوار تحول إلى حوار بين أشخاص وليس حوارًا مفيدًا يقرؤه الناس.<br />رجاءً يا أخي أن تتثقف أنت أولاً."
