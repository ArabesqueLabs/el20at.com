subject = "اللهم وحد صفوف المسلمين"
author = "منى محمد"
posted = "2007-01-31"
text = "يا جماعة الى الشيعة بيعملوه ده لا يمس للاسلام اصلا لان الاسلام مالش اننا نضرب نفسينا ونعذب نفسا وكمان الشيعه ليهم خلطات كتير زى مثلا انهم بيسبوا الصحابة وبيقولو ان الوحى نزل غلط على سيدنا محمد صلى الله عليه وسلم وكمان بيموتو السنة فى العراق بالالف وكفايه انهم شمتوا فى صدام لما اتعدم حتى لو كان صدام منيل بستين نيله بس مكين الى قتله دول امريكا على كده بقى ان امريكا ليها الحق انها تحاسب كل الحكماء العر على كده كلهم ها يتعدموا وكمان لما كان حزب الله بيحارب اسرائيل مش عشان سواد عيون الشعب اللبنانى عشان الشيعة فى خططتهم المستقبليه انهم يعملوا بلد شيعية متكاملة يا جماعة ادعوا للمسلمين يتوحدوا وادعوا للشيعة ربنا يهديهم"
