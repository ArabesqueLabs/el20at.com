[[comments]]
order = 9
subject = "للتعقل مرة أخرى"
author = "مصري"
posted = "2007-02-11"
text = "اخي،<br />لا حاجة بي للإثناء على دعوتك بعدم التكفير والانتصار لصوت العقل والاحتكام إلى مصلحة الأمة في لحظتها الراهنة، لا حاجة بي لذلك فهو واجب على كل من ينسب نفسه لهذه الأمة بحكم القومية أو الدين.<br />ولكن دعنا ننظر إلى ما ينص عليه خطابك مليًا وهل ينصرف قولك فيه إلى نفع البلاد والعباد أم إلى غير ذلك. فأما عن ميليشيات الموت فهي صنعة المحتل، جمع فيها شراذم القوم وشعاث سفاكيهم. استحلفك بالله هل سمعت عن مثل هذه الفتنة في العراق قبل احتلاله؟ ولا تحدثني حديث المحتلين عن تضييق نظام صدام على الضيعة مكبحه لجماحهم، فشيعة العراق قد حاربوا مع صدام ضد إيران، تلك حرب أراها مجحفة وظالمة ولكنهم فيها مالوا إلى انتمائهم القومي والوطني دون الانتماء الطائفي، فهل يستوى هذا واتهام الشيعة بالعمالة والتشيع للفرس. بل وإن جيش المهدي نفسه والتيار الصدري في عمومه قبل شيوع الفتنة وتفجير مساجد السنة والشيعة ومراقد الأئمة كان هذا التيار وعلى رأسه مقتدى الصدر نفسه يحمى السنة في مدنه، لعلكم لم تنسوا حصار الفلوجة وماتم فيها من مجازر على يد المحتل الأمريكي استهدفت التيار الصدري وتحالفت فيها قوى السنة والشيعة على السواء في المقاومة. أنا لا أنفي وجود فرق للموت والقتل تشيع الخراب وتقتل على الهويةـ ولكن دعنا لا نندفع صمُا عميانًا، ولست أنت من أصفه بذلك، وراء قول العدو بأن ذلك مبعثه اقتتال طائفي، هم من صنعوا ذلك وأوعزوا بأن الأصل فيه انقسام العراق بين السنة والشيعة. يا أخي كان العراقيون سنة وشيعة تيزاوجون من بعضهم البعض دون اعتبار لذلك الخطاب التكفيري الدنئ، وطوال تاريخهم لم يقتتلوا، بل وإن العشائر العراقية نفسها تنقسم بين السنة والشيعة، فتجد العشيرة الواحدة طرفها في الشمال سني وطرفها الجنوبي شيعي.<br />أما بشأن استباحة الدماء، فتلك ممارسة الغلاة والمتطرفين من كل المذاهب, تذكر عبر التاريخ فرق الحشاشين والسفاكين من سنة وشيعة. وتذكر في وقتنا الحديث جماعات التكفير التي قتلت الآلاف في الجزائر، ومثلهم في أفغانستان. كان هؤلاء يسمون بالمجاهدين، فلما انتفت المصلحة بينه قادتهم تصارعوا وتقاتلوا وصاروا قراصنة يخطفون ويطلبون الفدية ويغتصبون النساء وضاع بينهم دم المجاهدين، هل ينسب هؤلاء إلى السنة أو الشيعة؟ إن عليًا كرم الله وجهه وعمر ابن الخطاب رضي الله عنه ليذوون طرف عباءاتهم خشية أن تتلوث بدم سفكه هؤلاء. يا أخى إن دمنا في الأصل واحد وسفكه يتم أيضًا عن أصل واحد، ولكن بأيد كثيرة فهلا تبعنا الفرع إلى الأصل، ولا ضاق أفق تفكيرنا عند قاتل مأجور أيما كان انتسابه ونسنا من استأجره.<br />شيعة لبنان رأيناهم، وهم ليسوا حزب الله وحده فمنهم من تحال مع الحكومة العميلة، كما أن من سنة لبنان من انضم للمقاومة وتمرد على الحكومة. حسن نصر الله نفسه قال بأنه نشأ في حي سني، وقد قرأت مقالأ لصحفية أجنبية ذارت الجنوب اللبناني ورأت قرى سنية يعيش أهلها هناك بين الأغلبية الشيعية دونما كراهية أو أحقاد. الفتنة التي تريدون إيقاعها بينهم إنما لغرض قصم ظهر المقاومة هناك بعد أن استعصى عليهم ذلك بالسلاح فلجآوا لسلاح الفتنة ومثل تلك الفتاوى التي تستشهد بها على غرار إباحة دم السنة إنما هي من قبيل تلك الفتنة. بربك، حزب الله وحلفاؤه يحشدون حولهم كل اللبنانيين ويخوضون حربًا داخلية واستهدافًا خارجيًا فهل من الممكن أن يصدر عنهم مثل هذا الهراء الذي لا يصدر عن عاقل، فضلاً عن كونه مسلم ومقاوم. وقد أعلنوا مرارًا أنهم شيعة عرب ولهم تحالف مع سورية كما لهم مع إيران وذلك ما تقتضيه ضرورة قتالهم ضد عدوهم، وليست إيران عدو للعرب فذلك أيضًا قول أهل الاحتلال. ولكن كما هو الحال في العراق يأتي الحال في لبنان، فتنة يريدونها بين السنة والشيعة ويدور رحاها بيد الغلاة والعملاء من الطرفين وينشرها المخابيل وينسحق بها عظم الجميع.<br />لقد أطلت ولم أرد على كل ما جاء في خطابك، لذا أردف سريعًا، مصحف فاطمة ليس مصحفًا يا أخي، فقرآن السنة والشيعة واحد وعموم الشيعة يكفرون من قال بتحريف القرآن، أما مصفح فاطمة فهو صحف قيل أن السيدة فاطمة رضي الله عنها قد جمعتها ومكتوب فيها أقوال وأفعال للنبي عليه الصلاة والسلام، أنا لم أقرأه فأنا لست شيعيًا ولم يتسنى لي أن أحصل على هذا الكتاب. وسباب الصحابة موجود بالفعل في الكثير من الكتب والآثار الشيعية، ولكن تلك قضية تحتاج إلى فهم. فهناك خلاف تاريخي حول دور الإمامين أبو بكر وعمر في انتقال الخلافة بعد وفاء النبي -ص- وفي نسخة من هذا التاريخ قام الإمامين بغصب حق الإمام على في الخلافة. أنا لا أتصور مثل هذا من الإمامين، ولكن حتى تجلو الحقائق لابد من نقاش هذا الأمر في واقعه التاريخي. وعمومًا فإن عقلاء الشيعة يحرمون سباب أي شخص، وقد صرح أحد كبار المرجعيات الشيعية أن الكتب المدرسية الدينية في إيران تذكر بعض مناقب الإمامين أبو بكر وعمر رضي الله عنهما كما أن المرجعيات الكبرى الساعية لوأد القتنة تمنع النقاش في مسائل الخلاف بين السنة والشيعة، أعتقد أن الخميني له فتوى في هذا الشأن يحرم فيها ذلك الخلاف ويحرم دم السنى والشيعي.<br />بالطبع ستجد عند البحث في الآثار القديمة كتب عامرة باللعنات والكراهية أطلقها بعض السفهاء والمتطرفون لديهم ولدينها في تراشق سعى إليه أهل الفتنة والوقيعة عبر مئات السنوات منذ زمن الفتنة الكبرى، ولكن لا تدعنا ننسى أن الخلاف بيننا في الأصل سياسي وليس دينيًا، ولا أحسبك تنسب من قتل الخليفة عمر أو عثمان إلى الشيعة أو قتل الخلفية على أو ولديه إلى السنة. القاتل تلوثت يداه بدم طاهر لقوم كلهم أخيار وحسابه عند ربه.<br />أخى فليحفظ الله للمسلم السني والشيعي حرمة دينه ودمه، ومن أراد إيقاع الفرقة بيننا بدعوى التشيع أو التكفير فجزاه الله ما يحفظنا من شره. هناك من يغلو لجانب السنة فيكفر الشيعة، وهناك من يغلو للشيعة فيبيح دم لسنة ولكن هؤلاء هم الهوامش وليس السواد الأعظم من اتباع المذهبين.<br />أخي، هلا تحدثنا عن أصول ثابتة تجمعنا بدلاً من الحديث عن شراذم تفرقنا، وتذكر بالمناسبة أن هناك فتوة قديمة من الأزهر بجواز التعبد وفقًا للشيعية الأثنى عشرية وبأنه أهلها مسلمون، فهلا كنا حقًا مسلمين ومنعنا دم المسلمين قبل أن يتفرق على أرضهم."
archived = "2010-03-14"
