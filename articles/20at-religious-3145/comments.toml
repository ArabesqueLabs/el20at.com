subject = "لا للشيعة"
author = "فهد الا سلام"
posted = "2007-04-17"
text = "بسم الله الر حمن الرحيم الواحد الا حد وصلة وسلام على محمد واهلة وصحبة وكل من اتبع هدى اشرف الخلق اجمعين اما بعد قرات معظم تعليقات الا خوة ولكن اسمحلولى ارد اولا انا سسسسسسسنى والحمد لله وعاوز ارد على الشيعة لعللا الله ان يهدهم اولا كرهكم لاب بكر الصديق الم يقال القرات الكريم فى اب بكر وثان اثنان اذا هم فى الغار اذا يقول لصحابة لا تحزن ان الله معنا اليس هذا دليل على كفركم اليس سب هذا تعتبر كفر الم يقل رسول الله لا تسبوا اصحابى هل لو كان رسول الله بيننا هل كان يوافق ان تتشيعوا وتتخذوان اله غير الله لماذا تعبسون فى تا ريخ مضى وتثرون المتا عب وتتخذون غير سنة رسول الله شرع لكم ان سيدنا ومولانا على ابن ابى طالب هو عظيم ونحن من اشد الناس حفظ لا قولة وهو من صحابة رسول الله ومن المخلصين وكيف ذلك هل كان سيدنا على جبان والعيز با لله حتى يسكت عن الحق فا كان سكت على اب بكلر لماذا سكت على عمر ثم عثمان لا تقولا لى لحقن دماء المسلمين ان كان فعلا رسول الله قد اوصو لهو باولية وسكت عنة فهو مخلف لكلام رسول الله وانا اشلك فى ان سيدنا على يخلف قول رسول الله ثم اليس معاوية هذا كاتب وحى رسول الله لماذا كل هذا التهكم على صحابة رسول الله لماذا تمجدون ابو للوة المجوسى قاتل سيدنا عمر هل قراء احدكم عن عمر ابن الخطاب الذى قال عنة رسول الله فاروق الا مة هل كان رسول الله يخاف من عمر والله هذا كفر وتظليل تسبون العرب مع ان النبى عربى وسيدنا على عرب اليس انتم من قتل الحسين وتركتموه ولم تدفعو عنة اليس من خرج مع الحسين من اهل مكة احب البلد الى رسول الله وبعد كل هذا تردون هدم الكعبة اليس هذا من اعمال المجسوس عندما يتحدث شخص مثل الخمينى قبح الله وجة ويقول ان رسول الله لم ياتى بارسلة كاملة فماذا بعد الكفر كفر هل كل الناس التى كانت حول النبى كذابين وكفرة ولم يخرخ منهما احد غير الذين اخترتموهم اليس قتلكم للسنة فى العراق كفر لكونهم سنة هل سنة رسول الله كفر والله استحافكم بالله ان كنتم تعرفوان الله كفاكم وابحثو عن الحق وكفاكم خزعبلات واتركو ما كان كان وهيا نبنى دولة اسلامية شعاره لا الة الا الله محمد رسول الله فقط لاغير وما الا ان نقتدى بكل الصالحين من صحبة رسول الله صلى الله علية وعلى اهلة على والحسن والحسين وفاطمة ام المومنين وعلى كل بيت الا رسول الله وعلى امهات المسلمسن اجمعين وصلى يا رب وسلم على اب بكر وعمر وعلى وعثمان وعلى كل من سلم وجلس مع رسول الله هدنا الله وهدكم الى الحق قولو امين"
