[[comments]]
order = 16
subject = "مسلم ام شيعي"
author = "مسلم"
posted = "2007-04-05"
text = "الديانة الشيعيه نعم هي كذلك وليس أخي في الاسلام الا من التزم قول الرسول صلى الله عليه وسلم في خطبة الوداع الا ان دماؤكم عليكم حرام فأخي من لايستبيح دمي انا اخي ايا كان مسماه هو:<br />شيعي لا يسب الصحابه<br />شيعي لا يستبيح حرمات الله ويزني بالتمتع<br />شيعي لا يعين اعداء المسلمين على المسلمين<br />شيعي لا يعتقد بتحريف القران<br />شيعي لا يستبيح دمي<br />شيعي لا ينسب لبشر مليس الا لله وحده فلا يعلم الغيب الا الله<br />شيعي لا يخطأ في ذات الله ويدعي ان جبريل عليه السلام اخطأ<br />شيعي لا يمجد ابو لؤلؤة المجوسي<br />شيعي يحج كما احج<br />شيعي يصلي في المسجد<br />شيعي لا يقول عن عبد الله ابن سبأ رضي الله عنه<br />شيعي يوقر زوجات النبي<br />شيعي لا يتطاول لسانه على القران<br />شيعي لا ينافق<br />شيعي يصلي في المساجد وليس الحسينيات<br />شيعي اذان صلاته مثل اذان صلاته<br />شيعي ليس من اعتقاده كفر من لم يسب الصحابه<br />شيعي لايضرب الصدور<br />شيعي ليس الدجال مهديه<br />شيعي لا يعبد الحسن وعلي<br />شيعي يحترم احاديث النبي في البخاري ومسلم<br />شيعي يجاهد معي اليهود وليس يجاهدني مع اليهود<br />شيعي له عيد مثلي<br />شيعي مسلم لله محده دون شرك<br />شيعي لا يشرك بالله ويقول بعصمة ايات الله مثل الخميني الذي يسب الصحابه<br />شيعي برئ من الشيعه الذين يسبون الصحابه<br />شيعي وضوؤه مثل وضوئي<br />شيعي ذكره مثل ذكري<br />شيعي له عقل<br />هذا الشيعي مسلم وهو اخي ولمن اعتقد انه غير موجود فهم لهم ديانه اخري"
archived = "2010-03-14"
capture_url = ""

[[comments]]
