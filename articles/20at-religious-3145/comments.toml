[[comments]]
order = 2
subject = "بعض التعقل"
author = "مصري"
posted = "2007-01-30"
text = "لا أظنه حقًا لأبو أسحاق أو غيره إخراج قوم من دينهم وفقًا لتأويل شخصي. فحتى مع القول المعتاد بالاستناد لآيات وأحاديث تدعم تكفير الشيعه، والكل يجد من الآيات والأحاديث ما يدعم هواه هذه الأيام، إلا أن القول الثابت والفتوة الراسخة في هذا الصدد أنهم مسلمون وما بيننا وبينهم هو اختلاف سياسي تم تحويره ليتخذ طابعًا دينيًا.<br />لا أدري لم الإصرار طيلة الوقت على أن ما نراهم في كل شاذ ومستهجن من الأوضاع هم الشيعة؟ لم الإصرار على إبراز أكثر طوائفهم، وهو كثير، تطرفًا وجنوحًا كما لو كانوا هؤلاء هم عموم أهل هذا المذهب. ألا نجد بين السنة من يقبل أحجار الأضرحة ويتمسح بأركان المساجد، ألا نجد احتفال بموالد الأولاياء وما تشهده من مظاهر يأباها الدين والعقل. هناك من يحتفل بمولد من يسمى أبو حصيرة كولي صالح وهو في الأصل رجل يهودي. هناك الشاذ والمستغرب في كل ركن تختلط فيه الثقافة المحلية بالموروث الديني في غيبة القدرة على النقد والمراجعة العقلانية.<br />أنتم تتحدثون عن صور مستهجنة وشاذة، فهل عبء أحد المعلقين أو طارحي الموضوع بالبحث عن حجم من يمارسون تلك الأفعال؟ أو هل بحث أيهم عن العادات الغريبة الشائعة في شتى البلدان الإسلامية طبقًا للخلفية الثقافية لهذه البلد؟ لقد رأيت مسلمين في إحدى البلدان الإفريقية يؤدون شعيرة دينية على النحو نفسه التي تصلي به جوقة الكنيسة، وقرأت عن مسلمين في أمريكا يركبون البغال ويقضون حاجتهم في الخلاء بدعوى أن ذلك اقتداءً بسنة الصالحين.<br />أسوء ما يطرححه ذلك الموضوع وتلك التعليقات هو الفرقة بين طوائف الأمة الواحدة. أيها السادة المتحلقين حول ابو إسحاق وغيره إن ما يتهددنا هو خطر واحد، خطر بالفرقة والاختلاف إلى حد نفاذ الفتنة بين صفوف الأمة الواحدة، خطر يزيد من حدته التعلق بمثل تلك الصور المقيتة كما لو كانت شاهد على حال المسلمين بدلاً من عقلنتها كدلالة على الحد الذي يمكن أن يصل إليه مسلم في احتمال الألم والتعرض للإيذاء إيمانًا بمعتقده. أنا لا أدافع عن أحد وذكرت كم أكره تلك الصور، ولكن على الطرف الآخر من كل مظهر سلبي هناك جانب إيجابي فهلا نظرنا إليه.<br />إن أوطاننا تختفي أيها السادة، كان هناك وطن اسمه فلسطين منذ نحو 70 عامًا ثم اختفى والآن لم يعد لدينا العراق بعد أن أخذته دوامة العنف المذهبي التي يحركها الاحتلال الأجنبي، فهلا كففنا عن النظر إلى الصور المحدودة ونظرنا إلى الصورة الأكبر لوطن يتمزق."
archived = "2010-03-14"
