subject = "التعقل في ديني ودينك والقول الفصل سأشاركك فيه"
author = "رامي"
posted = "2007-02-18"
text = "مبدئياً لن أنفع البلاد والعباد بدعوة الغير عالم والغير ملم بما حوله للسطحية التامة .. حتي لا نجد من يدخل الأزهر يوماً وهو يحمل صورة حسن نصر الله أو قادة حركة أمل أو رفسنجاني وغيرهم كأبطال مسلمين تحدوا الجبروت الأمريكي<br />أقول لنكن أمناء أولاً ونحذر الجاهل ومن ثم نأمل كل خير للأمة جمعاء .. أنت بالطبع لم تضع ردك علي كل ما وضعته في ردي الاول<br />سألخص الأمر سريعاً حتي لا أسرد مطولاً دون غاية أو دون اغفال أي مما خططته<br />أولاً<br />أنا كثيراً ما أقف ضد المغاليين من أهل الجزيرة العربية في حديثهم عن الشيعة وتكفير عمومهم فمنهم المغالي .. لكن في حديثي مع المصريين من أبناء بلدي تتغير طبيعة حديثي لأني أعلم جيداً أني أخاطب في الغالب جاهل جهلاً تاماً بخطورة وعصبية وأحياناً كفر من يعتبره أخاً أو بطلاً .. ذلك لتقدر الأمر وجلله أخي الكريم<br />ثانياً<br />فرق الموت ليست صنيعة المحتل بشكل مباشر أخي الفاضل .. والا فماذا لديك عن مجازر حركة أمل اللبنانية الشيعية في حق المسلمين السنة؟<br />أما عن كون الاحتلال في العراق هو المسئول بشكل غير مباشر وليس بالشكل المباشر فالسبب كالأتي .. صدام حسين كان يلقبه الخليجيين وقبل غزو الكويت وأثناء حربه مع ايران حامي البوابة الشرقية من الفرس والمجوس .. بانهيار نظام صدام حسين أصبح العراق والشام بما يشمله من سوريا ولبنان وحالياً علي الساحات الأدبية في مصر وعلي الساحات البرلمانية في البحرين وبعض دول الخليج كلها مرتعاً وملعباً للوجود الشيعي .. وأما بخصوص محاربة الشيعي العربي في جيش العراق للشيعي الفارسي في الجيش الايراني فذلك ليس بدليل مقنع بامكانك الاستناد اليه .. أنت غفلت عدة نقاط أولها طبيعة الحكم العربي فمن من العراقيين ورغم رفضه لمحاربة الكويت استطاع ايقاف الحرب أو عدم المشاركة فيها؟ ومن من مصر ورغم رفضه للحرب في اليمن استطاع ايقافها .. الأمثلة كثيرة والسبب هي طبيعة النظام العربي .. كذلك أنت غفلت الاعلام وأسباب الحرب المعروفة عند الجميع حينها .. لاشك أن ايران منذ انقلابها وهي لاعب مجنون يريد تصدير نيران ثورته الي الجميع<br />دعك من كل ذلك .. قطع رقبة صدام وتكسير عظامه بعد شنقه ومشاهد شنقه وما تخللها من عبارات تكفره ثم تهليل للصدر وغيره من الرموز الشيعية هل كانت هي الأخري صنيعة المحتل أم صنيعة كراهية شيعية؟<br />ما تبثه قناة الزوراء من جثث لأطفال ونسوة وشيوخ بأيدي الميلشيات الشيعية والفضائح التي نسمعها علي ألسنة برلمانيين سنة بخصوص شيعة ايران وما باتوا يفعلونه في العراق هل هي الأخري صنيعة محتل .. لا تجافي ضميرك أخي المحترم ولا تضحك علي من يقرأ في كلامنا أول مرة عن الشيعة والمتشيعين!<br />ثالثاً<br />تبرئ التيار الصدري من قذاراته فلا تجعلني أراك بمرأي الجاهل عن ما يحدث من حوله فلست بمن أصفه هكذا أخي المحترم .. التيار الصدري ألقي سلاحه قبل بداية المعركة أخي الطيب للانصهار في العملية السياسية والمسارعة مثل الكثيريين ممن قدموا علي ظهور الدبابات الأمريكية الي كرسي الحكم في وقت قاطع فيه السنة الانتخابات وشارك الكثيريين منهم في المقاومة وحرب ما بعد الاحتلال وارتفع اسم الشيخ الضاري محذراً لما يلاقيه السنة علي أيدي الشيعة من تنكيل .. ادخل منتديات \"يا حسين\" وغيرها من المنتديات الشيعية المشهورة وابحث عن عشرات المواضيع ومئات الردود الواردة حينها تعبيراً وتطبيلاً وسعادة ما بعدها سعادة لاستهدف الأمريكان الفلوجة السنية<br />أكثر المواقع السنية تشدداً لن تتشفي بقتلي في الجانب الشيعي أثناء حرب لبنان كونك تحب المساواة كثيراً في الغلو عند الجانبين!<br />رابعاً<br />تشبيهك لتحالف حزب الله مع ايران بتحالفه مع سوريا خطأ فادح<br />فتحالف حزب الله مع ايران معلن منذ أن قام والولاء لدولة غير الدولة الموجود فيها معلن منذ وقت طويل أيضاً .. أما ما بين حزب الله وسوريا فعن سوريا يتم نقل السلاح الايراني الي لبنان .. وسوريا ارتمت مؤخراً فقط في الحضن الايراني حينما لم تجد لها مساعد عربي واحد يقف بجانبها لما اشتد عليها الأمر<br />خامساً<br />هل ايران عدوة لنا؟<br />لو لم تكن عدوة لما اغتصبت أراضي اقليم الأهواز العربي ولما اغتصبت الجزر الاماراتية فيما بعد .. ولو لم تكن عدوة لما دفعت الخليج العربي الي سباق تسلح ولو لم تكن عدوة لما حذر مبارك مراراً وتكراراً حتي أعلن في نهاية المطاف أنه لن يكتفي بمشاهدة هرولة الجميع الي القنبلة النووية حتي نضرب بها في نهاية الأمر وفي اشارة الي امكانية اللجوء الي السلاح النووي ولو لم تكن عدوة لما دفعت حساسية الخليجيين وخوفهم منها الي الاعلان في مجلس التعاون الخليجي الي التفكير في الطاقة النووية السلمية<br />سادساً<br />من الشيعة من قال بأن مصحف فاطمة هو القرآن الصحيح وأنه يحتي سبع أضعاف ما في القرآن العادي .. وكما قلت ليسوا جميع الشيعة فعلاً من قال بذلك<br />سابعاً<br />فيما يخص سباب خيرة أصحاب رسول الله .. ممن كان يغضب رسول الله لأجلهم وممن سالت دموعه لأجلهم وممن وصفهم بالنجوم علي المسلم أن يهتدي بهديهم فأنا لم يخلق بعد من التاريخ ما يجعلني أتفهم سبابهم ولعانهم كطريقة للذكر .. حسبي الله ونعم الوكيل .. أسأل الله أن يرد كل كلمة دونية أو كل لعنة علي صحابة المصطفي مسمومة في نحر قائلها وأهله وولده<br />والسباب يقوم به عوام الشيعة ولا تصدق ما هو دون ذلك<br />ثامناً<br />يقول ابن حزم في كتاب الفصل\"والأصل في خروج أكثر هذه الطوائف عن ديانة الاسلام أن الفرس كانوا من سعة الملك وعلو اليد علي جميع الأمم وجلالة النظر في أنفسهم حتي انهم كانوا يسمون أنفسهم الأحرار والأبناء وكانوا يعدون جميع الناس عبيداً لهم فلما امتحنوا بزوال الدولة عنهم علي أيدي العرب وكانت العرب أقل الأمم عند الفرس خطراً تعاظمت الأمور وتضاعفت لديهم المصيبة وراموا كيد الاسلام بالمحاربة في أوقات كثيرة ففي كل ذلك كان يظهر الله الحق فأظهر قوم منهم الاسلام واستمالوا أهل التشيع باظهار محبة آل البيت واستشناع ظلم علي رضي الله عنه حتي أخرجوهم عن الاسلام\"<br />ذلك ما قاله الامام بن حزم عنهم .. وقد كفر علماء الأمة جميع من أتوا من أبوابهم كالنصيريين والقرامطة والاسماعيلية والدروز والبهائيين والبابيين وغيرهم كثيرين<br />خلاصة القول ليكن لدينا ما نتفق عليه<br />اسرائيل خطرها أكبر علي أمة الاسلام وربما أمريكا لكن ايران لم تكن يوماً دولة صديقة أو جارة وفقط .. ايران خاصة بعد ثورتها دولة دينية شيعية متطرفة وعدوة لكل ما هو سني .. طالما أكد التاريخ ذلك والوثائق المكتشفة عن سياستها التطلعية<br />لكن يبقي منهم المسلم وان ظهر منه العداوة والبغضاء<br />انتهي"
