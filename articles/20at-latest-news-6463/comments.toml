text = "يا جماعة نفسي المصريين يعرفو ان مش كل السعوديين أو المصريين المغتربين في السعودية متخلفين كدا<br />أرجووووكم حاولو تفهمو<br />أنا مصرية وعايشة هناك،والله العظيم دول متطورين عننا ف حجات كتير جدا جدا ،ولما بروح مصر ويعرفو اني جاية من هناك يبطلو يتكلمو معايا او ياخدوني تريقة ويقولو لنتي جاية من الصحرا بعد ما كانو بيتكلمو معايا عادي جدا،بس أول ما يعرفو اني عايشة هناك معرفش ايه اللي بيجرالهم؟؟؟؟؟؟؟؟؟؟؟؟؟ افف<br />ليه فكرتكو كدا<br />بليييز خلو عندكو حواااار وتقبل الأخر<br />يا ريت تنشروووهاااا"
