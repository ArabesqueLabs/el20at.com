[[comments]]
order = 0
subject = "اول تعليق"
author = "الهندي"
text = "اول تعليق<br />علي الموضوع الطحاوي والشامي نسبة الي محرري الموضوع<br />طبعا الدكتور عبد المنعم ابو الفتوح هو من اهم رجالات الاخوان<br />وبالتاكيد اصخاب الفكر المفتح والغير متحجر<br />وما يقولة يمثل لاي اسلامي قريب من الاخوان وجة نظر تحترم<br />الدكتور عبد المنعم حلمة زي حلمي الجماعة تبقي شعبية<br />مع الناس بجد<br />مش يومين الانتخابات وبس<br />الناس الناس الناس ايوها الاخوان<br />هستاذنكم اني اخد الموضوع في مدونتي<br />http://shwash.blogspot.com/"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608110416/http://masr.20at.com:80/newArticle.php?sid=10535"

[[comments]]
order = 1
subject = "تيار بديل ..تياربديل"
author = "محمد"
text = "بداية أشكر كل من ساهم بكلمة تفيد في مشروعنا ( تيار بديل ) واتمنى من أصحاب النقد اللازع ( الهادم ) بعد أن ينتهوا من ثروة الأنفعالات المفعومين بها - وحتما ً ستنتهي قريبا ً - أن يبدؤا في كتاب نقد موضوعي أو يستخرجون من قرائحهم ما يفيد في معالجة الأزمة المصرية .<br />كلامنا - لمن أراد أن يشارك بإيجابية - في غاية الوضوح ، فلقد تحدثنا عن أزمة النهوض - وهذه رؤيتنا - ونراه اليوم في حال يرثى لها ، فكان من واجبنا - شأن كل الشباب المصري - أن يساهم في دفع عجلة النهوض إلي الأمام - هذا بعد الكشف عن الأعطاب التي تخللته ومحاولة العلاج - .<br />ثم تحدثنا عن مشروعنا سياسي بالمقام الأول ولا نري حاجة لدعاية الخوف علي الدين من الضياع فهو كلام قبيح وسخيف<br />- ومازلنا نكرر - الإسلام والدين \" بنص قرآني \" محفوظين إلي يوم الدين ، والأزمة برمتها أزمة نهوض وصراعات سياسية ، وقراءة التاريخ منذ بداية الدولة الأمويه وإلي اليوم فيه متسع للجميع .<br />ثم انتهينا وقدمنا رؤية لدولة مدنية حديثة وسردنا القول في وظائفها وأمنها القومي وعلاقتها بالعالم علي قاعدة الإنسانية .<br />\" فنحن نرنوا لذلك اليوم الذي تقف فيه الإنسانية بحزم في وجه الجهلاء ودعاة الخراب ، وتسعى متحدة نحو الخير والسلام عبر حلف فضول عالمي ينصر الضعيف ويعين ذا الحاجة \"<br />وعليه فمن راى في كلامنا خيرا ً فهو مدعوا معنا للتأسيس للتيار البديل ، ومن راى غير ذلك فنحن ندعوه بأن لا دعايه سلبية فقط من أجل خير بلادنا<br />تيار بديل"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608110416/http://masr.20at.com:80/newArticle.php?sid=10535"

[[comments]]
order = 2
subject = "ممكن حد يرد عليا"
author = "ابومحسن"
text = "الاخوان المسلمون يستخدمون في نشر ثقافتهم قصة فرعون موسى<br />يعني الحاكم فرعون ووزير الداخلية هامان وجنودهما الجيش والامن المركزي وخلافه<br />والشيخ الشعراوي افتى بأنه لا يجوز استخدام ايات الكفر في القرأن على كل من نطق الشهادتين وسما المسلمين غير الملتزمين (المسرفين على انفسهم) فقط وقال الذي نطق الشهادتين لا يمكن ان يكون كالذي جحد بها.<br />فليه الاخوان المسلمين مصرين على نشر ثقافتهم بهذه القصة وكل مواقع الاخوان تروج لهذا وعلى راسهم اخوان اون لاين"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608110416/http://masr.20at.com:80/newArticle.php?sid=10535"

[[comments]]
order = 3
subject = "للأستاذ ابو محسن"
author = "أحمد مختار"
text = "يا ابو محسن<br />بيتهيألي انك محتاج تجدد افكارك حوالين الاخوان لإن الاخوان مش بالصورة دي...ورجاء راجع موقع الاخوان على النت بحياد وبعيد عن أي انطباع مسبق وانت تلاقي ما يغير صورتهم في دماغك..<br />وبالنسبة لقصة فرعون وموسى فهي مثال على صراع بين أي حق وأي باطل...ومعتقدش إن الاخوان شغلتهم الشاغلة البكاء على ما حدث لموسى من فرعون ..الاخوان عندهم مشاكل اكبر من كده..وفكر الاخوان تجاوز الامر ده..فياريت فكرك يتجاوز الامر ده كمان<br />وليه ملاحظة مهمة وهي إن أي موضوع بيدور حوالين الاخوان في موقع عشرينيات بلاقي نقس التعليقين السابقين حوالين التيار البديل والتعليق التاني حوالين استشهاد الاخوان الدائم بقصة فرعون وموسى...<br />فرجاء نشوف حاجة جديدة ننتقد بيها الاخوان لإن الموضوع بقى اشبه بحكاوي الحريم على مصاطب البيوت في الحارات الشعبيبة !!"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608110416/http://masr.20at.com:80/newArticle.php?sid=10535"

[[comments]]
order = 4
subject = "الى الاستاذ الفاضل احمد مختار"
author = "حاتم حامد"
text = "استاذ احمد مختار احب احلفلك الاول انى مش من تيار بديل لانى مش من التيار الاسلامى من بابه . بس انا شايف انه منطقى لما يببقى فيه فكرة جديدة وموجودة وسط اقلية انهم يحاولوا ينشروها ولو بالتلويش احيانا خصوصا ان الموقع ده مش زى بقية مواق الاخوان الشبه رسمية اللى متتشجعش عل التعليق والتفاعل اساسا .. وعايز اقولك ملاحظة تانية .. لما كنت بقابل شباب اخوان فى الجامعة زمان كنت بلاقى النقاء لدرجة التعصب وعدم احتمال الراى التانى من فرط اليقين فى الراى الشخصى عارف دلوقتى انا بلاقى ايه .. بلاقى .. قرننه او ارننه او قرننه"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608110416/http://masr.20at.com:80/newArticle.php?sid=10535"

[[comments]]
order = 5
subject = "الى الاستاذ احمد مختار"
author = "ابومحسن"
text = "يا استاذ احمد مختار الكلام اللي انا بقوله نافع عن خبرة عميقة في الموضوع نتجت عن الغربة خمسة وعشرين سنه<br />وانا بقول هذا الكلام ان الاخوان يستخدمون قصة فرعون موسى في نشر ثقافتهم واستندت في نقد هذا الكلام الى العلامة الشخ محمد متولي الشعراوي ثابت في دروسه انه لا يمكن تطبيق ايات القرأن ايات الكفر على اي احد نطق الشهادتين ابدا لطفا (يرجى مراجعة تفسير الشيخ الشعراوي)<br />وبعدين طبعا انا بكلمك من خارج مصر يحزنني كثيرا ان ارى بلدي تحولت الى سجون ومعتقلات وامن دولة وامن مركزي ويحزن كل المصريين في الخارج وما قلته ما هي الا محاولة للاصلاح<br />وانا مصر على اقوالي ان تشبيه الحاكم بفرعون والوزير بهامان والجيش جيش فرعون فكره خاطئة<br />لاننا كلنا اهل سنه وجماعة الحاكم سني وجيش مصر جيش سني ولا يمكن يكون جيش فرعون ابدا<br />ولازم الاخوان المسلمين يتراجعوا عن هذه القصة<br />والحاضر يبلغ الغايب"
archived = "2007-06-08"
capture_url = "https://web.archive.org/web/20070608110416/http://masr.20at.com:80/newArticle.php?sid=10535"

[[comments]]
order = 6
subject = "ضع عنوان التعليق"
text = "ألف تحية للصحفي الموهوب الأستاذ عبد الله الطحاوى، أعجب لقدرته الفائقة على صياغة الفكرة ونقيضها بمهارة واقتدار ، فمنذ بضعة شهور كان الزميل الطحاوى أحد أعمدة جريدة آفاق عربية لسان حال الإخوان المسلمين وقتئذ وكان يجري حوارات مع قيادات ومرشدي الإخوان وكثير من السياسيين والمفكرين بما يخدم الفكرة الإسلامية بصفة عامة و فكر الإخوان على وجه التحديد.. والآن نجده على النقيض تماما يسعى لمحاربة فكر الإخوان بشكل واضح وصريح ، رغم أن الموضوعية تقتضى أن يتحلى الصحفى بالمصداقية وقدر كبير من الحيادية .. الزميل الطحاوى صنع من على عبد الحفيظ قيادة إخوانية ونسب إليه توصيفات ودرجات علمية .. جاء أكثر من تعليق ليؤكد كذبها إلا أن الطحاوى راكب دماغه ومصر إن الرجل قيادة ويقدم بديلا للإخوان .. واللهم لا اعتراض .. لكن لماذا لا يتحلى الطحاوى بالقدر الكافي من الموضوعية والأمانة الصحفية؟!<br />بماذا تفسر العبارات التي ذكرها \"الصحفي\" في مقدمة حواره او خلال الأسئلة من عينة \"ما زال يصر أن يكون إخوانيا\"، \"لكن استمرارك مثار تساؤل.. فلماذا تصر أن تبقى اخوانيا\" ، \" وأنت مهمش داخل التنظيم\" ، \"وسيطرة التنظيم السرى على الجماعة\".. إلخ<br />لولا معرفتى بالزميل الطحاوى لقلت أن هذه الأسئلة تمت صياغتها في مباحث أمن الدولة .. فمن ذاق عرف ، وقد تذوقت مثل هذه الأسئلة من ضباط مباحث امن الدولة : \"إيه اللى مقعدك فى الجماعة دى لحد دلوقتى\" ، \" انت لو حاولت تخرج مش هيسيبوك بالساهل\" ، \" يا عم دانت ملكش أى دور وسطهم \" .. إلى آخره من الأسئلة التى اعتاد سماعها من كتب عليه زيارة أحد مقار مباحث أمن الدولة.<br />أجدد التحية للأستاذ الطحاوى على قدرته الفائقة في تغيير الجلد سريعا خلال بضعة أشهر قليلة."
archived = "2007-07-09"
capture_url = "https://web.archive.org/web/20070709134916/http://masr.20at.com:80/newArticle.php?sid=10535"
