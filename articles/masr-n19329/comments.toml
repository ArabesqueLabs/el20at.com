[[comments]]
order = 0
subject = "دى كلام خايب - انا اعمل فى جامعة اقليمية ولم اشاهد حالة زواج عرفى واحدة"
author = "سرحان"
text = "بطلوا اخبار الاثارة دى<br />وتشويش سمعة الشباب المصرى<br />يمكن الكلام دة فى الجامعات الاجنبية فى مصر<br />انما شباب جامعات مصر بخير<br />والبنات ملتزمة وولاد ناس وبيعرفوا الاصول واحترام العائلة وبيعرفوا دينهم كويس جدا<br />وبلاش اخبار خايبة"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203858/http://masr.20at.com:80/newArticle.php?sid=19329"

[[comments]]
order = 1
subject = "لأ فيه ومليون فيه كمان"
author = "نضال"
text = "ايه يا عم سرحان .. روق كدة وصلى على النبى<br />ما ننكرش طبعاً انه فيه بنات كتير محترمة جداً .. ولكن ما نقدرش نتجاهل ان فيه حالات كتيرة من الجواز العرفى<br />وفيه حالات اكتر من زواج المتعة .. و الى اكتر من ده وده .. العلاقة الغير شرعية .. يعنى التقضية ولزومها.. زى ما بيقولوا عليها<br />ثم انت بتقول انك موظف .. مهما كانت علاقتك بالطلبة عمرك ما هتكتشف حاجة زى دى<br />احنا بس الطلبة فى بعضينا والى قريبين اوى من بعض كمان الى بيقولوا لبعض .. لكن غير كدة ما حدش بيعرف<br />وده طبيعى جداً انك ما تعرفش ولا تكتشفش حالة واحدة"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203858/http://masr.20at.com:80/newArticle.php?sid=19329"

[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "ياجماعه ماحنا في جامعه يعني احنا ادري بالكلام ده بلاش الكلام ده لان لو فيه فعلا جواز عرفي نسبته ماتتعداش 1% انما 17 %<br />يعني علي كده بقي كل 100 بنت في الجامعه منهم 17 متجوزين عرفي و الشباب نفس الموضوع<br />لالا ده كلام مش تمام"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203858/http://masr.20at.com:80/newArticle.php?sid=19329"

[[comments]]
order = 3
subject = "ثورة 23 يوليو قضت على الاقطاع والزواج في مصر"
author = "مش لازم"
text = "من المكاسب التي تحققت للشعب المصري على يد ثورة 23 يوليو بقيادة الزعيم جمال عبدالناصر زعيم الامة العربية<br />القطاع على الاقطاع<br />القضاء على الزواج<br />فعلا من يوم ما استلموا ولاد الوسخه سنة 56 وما تعرفش ايه اللي حصل في البلد كانت الشقة في القاهرة غرفتين وصالة قبل ما يمسكوا ولاد الوسخة دول كان ايجارها 50 قرش وكان الواحد ممكن يلاقي وظيفة بت 4 جنيه في الشهر<br />دا ايام الملك فاروق ما تعرفش ولاد ميتين الكلب دول لم جم ايه اللي حصل في البلد من 56 لـ 66 عشر سنين بدأت البلاوي تطل برأسها وعشر سنين كمان 76 كانت البلد قفلت<br />منهم لله الملك فاروق كان كويس ومحترم جم ولاد الحرامية دول وهاتك يا سرقة في البلد لغاية ما وصلنا الى طريق مسدود<br />والنبي يا خويا انت وهو سيب الناس تتجوز عرفي المفروض الدولة تقنن الجواز العرفي وتطئن الشباب<br />وهو احسن من الزنا والاغتصاب واللواطه<br />لما شاب وشابة يتجوزوا عرفي لان ما فيش لا وظايف ولا شقق يتجوزوا عرفي ويدبروا حالهم في اللقائات الجنسية انضف مليون مرة من الاغتصاب والزنا والوساخه"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203858/http://masr.20at.com:80/newArticle.php?sid=19329"
