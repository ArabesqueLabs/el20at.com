author = "سلامة فى خير وخير فى"
posted = "2009-05-17"
text = "رجال دين اية والقمص متياس يطلع اية ؟<br />ولعوا فى الخنازير بجاز وسخ وفى رجال الدين الذين يعارضون ان امكن<br />رجال الدين مش شايفيين مستوى النظافة المنحط فى الشوارع وفى العشوائيات - يعنى اذا الفيروس انتشر مفيش حاجة هتوقفة - هيبقى رجال الدين ينفعونا فى اية<br />اذا الفيروس انتشر فى الشعب المصرى فلن يوقفة شىء ومن يصاب بة ربما تضعة الدولة فى معسكر عزل ليموت داخل كنتونات لان مستوى القذارة عالى جدا<br />واذا اخذكم الشفقة على الحيوان فلماذا لا تشفقون على البشر الذين سيموتون"
archived = "2010-03-14"
capture_url = ""
