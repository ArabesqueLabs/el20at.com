[[comments]]
order = 0
subject = "انذار على يد عزرائيل افضل"
text = "والله يا اخويا الراجل دا عايزله انذار على يد عزرائيل بعد اللي عمله في البنوك وبعد ما العاذد على المدخرات اللي الناس كانت عايشه عليه نزل 6% يبقى انذار على يد عزرائيل احسن"
archived = "2009-02-05"
capture_url = "https://web.archive.org/web/20090205132719/http://masr.20at.com:80/newArticle.php?sid=11556"

[[comments]]
order = 1
subject = "سؤال يطرح نفسه"
text = "ليه نبيل البوشي ما يمسكش رئيس وزراء افضل من اللي في الصورة دا<br />تعرفوا مين هوا نبيل البوشي<br />مصري في قائمة أفضل خبراء المال في العالم<br />&--1641;/&--1641;/&--1634;&--1632;&--1632;&--1639;<br />نبيل البوشي<br />إنجاز كبير حققه رجل الاقتصاد المصري «نبيل البوشي»، حيث اختارته هيئة الاحتياطي الفيدرالية الأمريكية من بين أفضل خبراء المال في العالم، واحتل المركز &--1634;&--1636; علي العالم، متقدما أربعة مراكز عن ترتيبه العام الماضي،<br />علما بأنه الخبير المصري والعربي الوحيد بين &--1637;&--1632; خبيرا تختارهم الهيئة سنويا، وكان الشيخ «حمدان بن راشد آل مكتوم» نائب حاكم دبي ووزير المالية والصناعة قد عين «البوشي» في منصب يقوم علي أساسه بوضع معايير تقييم أداء شركات إدارة المحافظ في دبي."
archived = "2009-02-05"
capture_url = "https://web.archive.org/web/20090205132719/http://masr.20at.com:80/newArticle.php?sid=11556"
