text = "السلام عليكم ,<br />بالفعل أنها فتاة عربية مبدعة ومنتجة ربنا يزيدها ونتمنى الأستزادة من إبداعها الثرى للأجيال القادمة ونرجو توضيح كيفية التواصل أو قراءة ماتم أنتاجه للكاتبة<br />وشكرا لمحررة الموضوع<br />حقا موضوع كله بهجة وتفاؤل وأمل لغد مبدع"
