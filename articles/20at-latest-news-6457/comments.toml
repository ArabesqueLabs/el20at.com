order = 1
subject = "واحد فلسطيني ضفاوي مناضل"
author = "يحلم جلالة الملك المعظم : عبد"
posted = "2008-02-06"
text = "حسبنا الله ونعم الوكيل على كل عميل , حسبنا الله ونعم الوكيل على كل خائن لله ولدينه ولوطنه ولشعبه , حسبنا الله ونعم الوكيل على كل من أفشل وأحبط جهود المقاومين المناضلين , حسبنا الله ونعم الوكيل على من قتلوا المجاهدين , والله يعمي عين<br />كل واحد بحط عينه على فلسطين , يحلم عبد الله التاني وبخسى إنه ياخد الضفة , والله إحنا بالضفة على أتم الإستعداد لو دخلت<br />قوات أردنية على الضفة مستعدين لضربها ضرب فتاك , ولن نسمح لهم بتكرار حادثة أيلول الأسود علينا تاني مرة , كتائب الأقصى<br />مستعدة كل الإستعداد بكل مكان بالضفة لضرب أي قوة أردنية داخلة لفلسطين , وهدا وعيد رهيب وشديد , وحسبنا الله على محمود عباس , مع إنه هده كتائب الأقصى برجالها تتبرأ تبرئة تامة من حركة فتح الخائنة لأنها أكبر عميلة لليهود , ويا أخي العزيز<br />صاحب التعليق الأول إن شاء الله ما بتروح فلسطين , ورح تضل في عيوننا , بإذن الله الواحد الأحد اللهم آمين"
archived = "2010-03-14"
