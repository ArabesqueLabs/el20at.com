subject = "جهاد بن لادن والملا عمر"
author = "طالب"
posted = "2007-04-05"
text = "الفرق شاسع بين من يحارب ليُضرب غيره ويُدمر غيره ويدفع غيره الثمن الفرق كبير بين من يجاهد بنفسه وماله من اجل الاخره وبين من يدعي الجهاد من اجل السيطره السياسيه علي بلد ما والتغلب على طائفه بعينها الفرق كبير بين من يدعي انه يود توحيد المسلمين وهو يشق صفوفهم الفرق كبير بين من يقول كن شيعيا اليوم وبين من يقول نحن اشترينا الاخره الفرق كبير من لا يجيد الا الجدال والتسفيه ومن هاجر وجاهد بماله ونفسه الفرق كبير بين المسلمين والشيعة الفرق كبير بين ان تقول لا اله الا الله محمد رسول الله ثم اجدك تسب صحابته وزوجته وربه بل وجبريل بل ودينه بل وكتابه بل تبيح دم المسلمين لست منا ولسنا منك<br />بارك الله للمجاهدين في افغان والشيشان والعراق وفلسطين والصومال وكل بلاد المسلمين ولا بارك الله للمنافقين شياطين التشيع"
archived = "2010-03-14"
