subject = "07/12/2005"
text = "هل أخطأ المسلمون في مصر عندما نادوا ومارسوا بشكل فعلي حرية العبادة والدين لله والطن للجميع ؟؟؟ هل كان من المفروض وهم أغلبية 96 % أن يضطهدوا المسيحيين بحق طالما هذا حالهم لا يعجبهم العجب؟؟؟ ولكن الله سبحانه أوصانا بحسن المعاملة .. ولا إكراه في الدين .. إذن أين الخطأ ؟؟؟ لماذا يكن لنا جيراننا في الوطن من المسيحيين كل هذا الحقد والغل ؟؟؟ أعتقد أنه آن الأوان فعلاً للمسلمين أن يواجهوا المسيحيين بالشدة اللازمة لكي يقفوا عند حدود الأدب ولا يتمادوا أكثر .. فهم 4 % ويتمتعون بكافة الحقوق بشهادة غير المسلمين ومع هذا يصرخون في كل مناسبة وفي غير مناسبة بأنهم مضطهدون !!! عن أي اضطهاد يتحدثون ؟؟؟ أو قل عن أي بلد يتحدثون ؟؟؟ ماذا يريدون أكثر من هذا ؟؟؟ أعتقد أن جيراننا في الوطن من المسيحيين قد تجاوزوا حدود الأدب ويريدون أن يفرضوا علينا أجندتهم الخاصة .. 4 % تملي رأيها وأجندتها على الـ 96 % (سأقربها لك أكثر للآخرين من أصحاب الأقلام الخنثى ربما لا يفهمون النسب المئوية .. هب أنك في غرفة بها مائة شخص .. ستة وتسعون منهم يرون رأياً ما في قضية ما .. وأربعة فقط يرون غير هذا .. أين الرأيين يجب أن يؤخذ به ؟؟؟) .. بأي منطق وفي أي شرع يكون هذا ؟؟؟ أليس من حق المسلمين الـ 96 % من المصريين أن يراجعوا أنفسهم في معاملتهم للمسيحيين الذين فهموها خطاً .. فعلاً إخواننا المسيحيون فهموا الموضوع خطأ وظنوا من حسن المعاملة أنهم يستحقون أكثر منها .. بل راح بعضهم من الموتورين يظن أنهم أقوى وأخذ يسب الإسلام دين البلد التي تؤيهم ودين أهلها .. ولما لا والحكومة المصرية لا تسجن ولا تعتقل ولا تسحل إلا كل من قال ربي الله من المسلمين ؟؟؟!!! وأما الأحباب المسيحيين فلا أحد يقترب منهم .. لقد آن الأوان لكي يطالب المسلمون بحقوقهم وليس المسيحيين .. لقد آن الأوان كي يطلب المسلمون المساواة .. المساواة في المعاملة بالمثل فنحن نحسن إليكم ونعاملكم بأحسن من المطلوب ومع هذا تتبجحون وتسيئون الأدب .. والأدهى اليوم أنكم تريدون فرض رأيكم على الأغلبية ؟؟؟!!! ليقل لي أي عاقل ماذا يجد في هذا ؟؟؟ أين يمكن أن نصنف هذا العته ؟؟؟ ماذا نسميه ؟؟؟ أليس من حق المسلمين أمام هذا أن يغيروا معاملتهم للمسيحيين كي يعودوا إلى رشدهم ويعرفوا قدرهم الذي يبالغون فيه ويكذبون ويصدقون أكاذيبكم ؟؟؟ ليقل لي أي عاقل ماذا ينتظر من المسلمين بعد كل تجاوزاتهم تلك ؟؟؟ بعد كل تطاولهم الغير مبرر والغير مفهوم ؟؟؟!!! لقد تجاوز الظالمون المدى .:. فحق الجهاد وحق الفدا .. هذا البيت سنسمعه قريباً .. تردده حناجر الشباب المسلم في كل ربوع مصر من وراء همجية المسيحيين الرعناء تلك التي لن تجلب لهم إلا المصائب .. سيقول البعض تطرفاً .. وآخرون سيقولون إرهاب .. وآخرون سيقولون ما يقولون .. ولكن ليتذكر الجميع أنهم من بدأ وأبدى العداوة واضحة جلية في كل مناسبة .. فو الله الواحد الأحد إنهم يبذرون الإرهاب ويرعونه تحت شعارات جوفاء من المحبة وقولهم أحبوا أعدائكم .. وأدر له خدك الأيمن وما إلى ذلك من تخريفاتهم .. فلا يلومن إلا أنفسهم بعدها .. إن الإرهاب يا كل ذي عقل يبدأ من هنا .. من مقابلة الحقائق بالأكاذيب .. من الرغبة المريضة لسيطرة الأقلية الصغيرة جداً على الأغلبية .. من التسلط .. من الغطرسة .. ألا تجدون كل هذا في كتابات الكتاب المسيحيين اليوم؟؟؟ فماذا ينتظرون من شباب مصر المسلم ؟؟؟ أن يصفقوا لهم ولغطرستهم ومقارعتهم الحق بالباطل ؟؟؟ سيأتي نفر من المخنثين من مدعي التحضر والتمدن والميوعة ويرمينا بالإرهاب وعدم قبول الآخر ووووو من تلك الأقاويل الخنثى التي اغتصب بها الإعلام الغبي عقول هؤلاء فحملت سفاحاً بأفكار ضالة مضللة .. أي قبول للآخر ؟؟؟ وأي حوار يكون مع من يغالط في كل كلمة ويكذب ويقابل الحق بباطل هو أعلم به يقيناً أنه باطل ؟؟؟ هل يستقيم حوار على هذا الأساس ؟؟؟ أنا أعلم أن الحوار يكون بين العقلاء .. رأي برأي وحجة بحجة .. وإعمال المنطق في كل كلمة؟؟؟ ثم نأتي بعد ذلك نلوم الشباب على التعصب والتطرف .. إن التطرف والتعصب الأعمى فيما يقوله المسيحيون .. إن الحق عندما يواجه الباطل المتغطرس لا يملك إلا أن يسكت ويصبر .. أو ينفجر .. وقد صمت الشعب المصري المسلم عن بكرة أبيه طويلاً جداً .. وصبر كثيراً .. كثيراً .. وما بقي إلا الثانية .. فهل يريدونها ؟؟؟<br />صلاح الدخيل .."
