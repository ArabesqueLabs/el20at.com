author = "علاء الغنام"
posted = "2008-11-28"
text = "بسم الله والحمد لله والصلاة والسلام على رسول الله وبعد<br />فان كنا لا نملك الة الزمن الخيالية فاننا نحن الموحدون نملك القرءان والسنة وهما الحق بين ايدينا واذا توحدنا عليهما لاكتسحنا العالم بالاسلام<br />عذرا فنحن لا نحتاج الى الة زمن او فكر اى جماعة حتى ولو كانت الاخوان المسلمين ولا نحتاج ان نتنادى بصلاح الدين ولكن نحتاج الى ما سلكه صلاح الدين الا وهو احياء الاسلام فى انفسنا والتواصى به والصبر عليه<br />فلا لاى فكر او تنظيم ونعم للقرءان والسنة وتمسكوا بحبل الله جميعا ولا تفرقوا"
