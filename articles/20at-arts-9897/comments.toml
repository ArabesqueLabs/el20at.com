subject = "مقال يعيد ذلك الزمن الى الذاكره.."
author = "هايدي"
posted = "2008-08-18"
text = "الى صاحب هذا المقال الرائع<br />اظن انني ممن تمنوا ان يمتلكو آلة الزمن لتعيدهم الى روائع ذلك العصر.... عصر بطل من أشد الأبطال الذين يشهد لهم التاريخ ...لا أظن بكلماتي استطيع وصف ذلك الزمن ولا وصف عظمائه ولربما اعادة تجسيد ذكرى كتلك الذكرى أمر من اعظم ما نستطيع القيام به....والوقوف بمقال يدل على اهتمامنا بهاكذا امر امر جميل اذا دل يدل على وقوف عقولنا لزمنِ لايمكن ان يمحى.. ولابد سيظل عالقا بذاكرتنا على مر الزمان...<br />مع تحياتي للمراسل تامر صمادي.."
archived = "2010-03-14"
