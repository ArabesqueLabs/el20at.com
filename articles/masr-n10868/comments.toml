author = "شرين منصور..معلقة دائما"
text = "السلام عليكم شرين صلعاء هههه بصراحة مش مقتنعة لأن شرين على حسب معلوماتي الأخيرة ان مفيش علاقة فنية بين شرين والمنتج والمخرج نصر محروس لأنها ابرمت عقد مع شركة روتانا وازاي اتصل بيها المنتج عشان تغني احد أغنياته ومن فين بيقول انها فنانة غير ملتزمة اما عن التمثيل في اخر لقاء تليفزيوني شفتها فيه ودايما في لقائتها قالت أنها لن تكرر تجربة التمثيل لأنها اقتنعت أنها فشلت في التمثيل...ياريت حد يعمل موضوع حول صحة هذا الخبر لأنو جدير بالتوضيح..."
