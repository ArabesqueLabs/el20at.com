text = "على فكرة الموضوع ده صح اللمبة الموفرة فعلا موفره فى كل حاجة سعرها موفر جدا اللمبة سعرها يتراوح من 10 : 15 جنية مصرى وموفرة فى استهلاك الكهرباء بس هل هما فعلا بيوفرو الكهرباء ولا لا طبعا لا<br />بدليل ان الواحد مننا بيجيب الفواتير وبيشوف الاستهلاك بيكون الايصالات كلها بنسبة وحدة حتى لو هو فى فصل الصيف ومش موجود فى الشقة لمدة اسبوع او اتنين بيكون استهلاكه فى الشهر ده المفروض لو الشهر الى قبله 100 يكون الشهر ده من 50 : 70 جنيه ولاكن كشاف النور من الممكن انه بيسجل قراءة العداد جوزافيا من دون القراءة الفعليه للعداد ونحن نخاطب وزارة الكهرباء والطاقة بذلك الموضوع للاهمية باسم الشعب"
