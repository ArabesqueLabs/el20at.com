subject = "سرقة عينى عينك وجباية غير مباشرة"
author = "عارف"
posted = "2009-01-21"
text = "الحكومة رفعت السعر لما البترول وصل سعر البرميل 150 دولار<br />وبعدين الغبى بوش لما عرف ان ايران وروسيا استفادت جدا من هذا السعر واقتصادها بقى قوى جدا - تدارك الامر قبل ان يرحل ونزل السعر للبرميل الى 35 دولار<br />وطبعا مصر بتعطى وقود الغاز لمحطات كهرباء اسرائيل ببلاش<br />يبقى المصريين لازم يدفعوا ثمنة<br />علشان كدة اسعار الكهرباء نار رغم انخفاض سعر برميل البترول<br />خلينا نفرح بحبايبنا اليهود<br />هو مش السادات قال احنا ولاد ابراهيم<br />يبقى هتزعلوا لية<br />احنا ولاد ابراهيم<br />هم يستهلكون ببلاش واحنا ندفع لهم<br />بسيطة - هى جت فى جمل"
