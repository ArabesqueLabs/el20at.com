order = 0
subject = "خطأ في العنوان (تكملة الاقامة وليس الاذان)"
author = "مش لازم"
posted = "2008-02-03"
text = "الاذان بداية دخول وقت الصلاة<br />واقامة الصلاة بعد الاذان بحوالي ربع ساعة<br />ويقول الامام<br />سووا صفوفكم يرحمكم الله<br />ان تسوية الصف من تمام الصلاه<br />حازوا بين المناكب والاقدام<br />وسدوا والفرج فيما بينكم<br />واغلقوا الموبايلات اثابكم الله<br />وياريت الناس بتسمع الكلام كان زمان رنات كانت اهون<br />لكن دلوقتي الرنات على شكل اخر<br />اثناء الصلاة تسمع اغاني وتسمع اذان وتسمع قراءة قران وتسمع دعاء"
archived = "2010-03-14"
