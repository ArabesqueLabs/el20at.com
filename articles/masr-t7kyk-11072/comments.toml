[[comments]]
order = 6
subject = "فيلم الإغاثة في خطر"
author = "إلي الذين تقاعسوا وولوا الأدبا"
posted = "2009-01-27"
text = "فهمي هويدي<br />شيء طيب أن يقبل نجوم المجتمع علي زيارة الجرحي الفلسطينيين الذين استقبلتهم بعض المستشفيات المصرية، وحتي إذا تأخرت هذه «المروءة» ثلاثة أو أربعة أسابيع، فإنها تعد من قبيل المشاعر التي يقال في حقها إنها إذا أتت متأخرة خير من ألاَّ تأتي أبداً.<br />ولأن المشاعر المصرية إزاء الشأن الفلسطيني جري تلويثها وتشويهها خلال الأشهر الماضية، فإن مظاهر التضامن والتعاطف التي تبدَّت في الآونة الأخيرة تستحق التشجيع، حتي إذا حرص نجوم المجتمع المصري علي أن يصطحبوا معهم أثناء زياراتهم مصوري الصحف وكاميرات التليفزيون، وتعمدوا أن يتلفعوا بالكوفية الفلسطينية.<br />لابد أن تُقدر أيضاً حالة التسامح التي أبدتها مصر مع المواد الإغاثية التي تبعث بها الجهات المختلفة، أو تلك التي تأتي مع بعض الوفود الطبية والإعلامية، وهو التسامح الذي تبرزه الصحف اليومية، بنشرها البيانات التي توزع عليها في هذا الصدد لكي تثبت للقاصي والداني أن حكومة مصر لم تقصر في حق فلسطينيّ القطاع.<br />لن أتحدث الآن عن ظنون الشك والاسترابة في تكثيف الأضواء علي الجوانب الإنسانية والعمرانية، بما قد يصرف الانتباه عن الاحتلال والتحرير وبقية عناوين الحلم المؤجل.<br />لأن لدي ثلاث نقاط متواضعة وثيقة الصلة بمشهد المروءة والشهامة الذي نحن بصدده هذه الأيام هي:-<br />-إن هناك تدقيقاً مبالغاً فيه في السماح بدخول الجرحي والمصابين ومن الواضح أن الهاجس الأمني كان ولايزال سبباً في حرمان كثيرين من تلقي العلاج، ولا أتوقع أن تقوم مصر بعلاج كل المصابين الذين يتجاوز عددهم خمسة آلاف شخص، لأن هناك دولاً عربية أخري مستعدة لاستقبالهم، لكن في حين أن وزارة الصحة المصرية أعلنت عن استعدادها لاستيعاب ألفي مصاب، كما أن اتحاد الأطباء العرب وفر أَسِرَّة لألف آخرين، فإن الذين دخلوا للعلاج في مصر في حدود 400 مصاب فقط، الأمر الذي يعني أن هناك قدرة علي استيعاب 2600 مريض آخرين، أَسِرَّتهم متوفرة وعلاجهم ممكن ولكن التعقيدات البيروقراطية والحسابات الأمنية تحول دون استقبالهم.<br />- النقطة الثانية أن بعض المصابين الذين يعالجون في مصر يشكون من البيروقراطية الأمنية؛ ذلك أنه جري تسكينهم في مستشفيات لا تتوفر لها الأقسام المختصة بحالاتهم، كالعيون والأعصاب مثلاً، وحين يطلب الأطباء تحويلهم إلي مستشفيات أخري تقدم لهم ما يحتاجونه من علاج، فإن الرد المعتاد الذي يسمعه المرضي أن ذلك أمر مرهون بموافقة الأجهزة الأمنية التي تحتفظ بجوازات سفرهم، ولأن تلك الأجهزة لا وجود لها في المستشفيات ولا سبيل إلي مراجعتها، تكون النتيجة أن يبقي المرضي في أماكنهم دون علاج بما يؤدي إلي تدهور حالاتهم.<br />النقطة الثالثة هي أنه من غير المفهوم أن تحرص وسائل إعلامنا، علي إبراز الدور المصري في مجال إغاثة الجرحي الفلسطينيين، في حين يلقي القبض علي مدير الإغاثة في اتحاد الأطباء العرب، الدكتور جمال عبدالسلام، ويجدد حبسه منذ خمسين يوماً تقريباً بعد أن لفقت له قضية اتهم فيها بمساعدة حركة حماس. وجريمته ومشكلته أنه كمسئول عن الإغاثة كان يقوم بمهام وظيفته في توفير احتياجات مستشفيات القطاع، قبل أن تتغير الأجواء ويحل موسم الإغاثة بعد المذبحة ووقف إطلاق النار.<br />لقد قلت أكثر من مرة إننا بحاجة إلي ترشيد إخراج أفلامنا السياسية، وقصة اعتقال الدكتور جمال عبدالسلام تقدم دليلاً جديداً يؤكد تلك الحاجة، لأن أحداً لن يصدق فيلم المروءة والإغاثة المعروض حالياً، في حين يلقي القبض علي مدير الإغاثة ويلقي في السجن."
archived = "2010-03-14"
