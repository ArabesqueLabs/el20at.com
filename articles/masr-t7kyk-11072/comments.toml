subject = "شعب جبار خرج حياً من تحت الرماد"
author = "Ashour"
posted = "2009-01-27"
text = "غزة لم تهزم، وما حدث في القطاع ليس مأساة ولكنه ملحمة. لكن الهزيمة الحقيقية والمأساة التي يندى لها جبين الشرفاء، هي من نصيب الواقفين على الضفة الأخرى من المنسوبين إلى الأمة العربية، الذين تقاعسوا وولوا الأدبار حين جد الجد. وهم الذين وصفهم القرآن بأنهم: يحلفون بالله إنهم لمنكم، وما هم منكم، ولكنهم قوم يفرقون"
archived = "2010-03-14"
