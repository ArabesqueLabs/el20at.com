[[comments]]
order = 4
subject = "الى المعلق السابق"
author = "مصر هي امي نيلها هو دمي شمسها"
posted = "2009-01-27"
text = "انت بتقول في تعليقك<br />الواقفين على الضفة الأخرى من المنسوبين إلى الأمة العربية، الذين تقاعسوا وولوا الأدبار<br />اذا كنت تقصد الضفة الاخرى مصر فاريد ان اقول ان فيه واحد اسمه جمال عبدالناصر كان عايز يحرر فلسطين وفوجئنا بأن اسرائيل تحتل سيناء بالكامل وحجم سيناء ثلاثة اضعاف حجم فلسطين<br />تتصور حجم سيناء وحدها ثلاثة اضعاف حجم فلسطين<br />وعلشان خاطر مصر تاخد سينائ مرة ثانية حصل عقد بين مصر واسرائيل تماما زي عقود الايجار اللي بتتكتب عند المحامين والمحامي اللي كتب العقد محامي امريكي<br />وعلشان خاطر سينا ترجع لمصر اتكتب في العقد (اللي هو اسمه معاهدة السلام) شروط اسرائيل كاملة<br />وفيه بنت في العقد بيقول ـ تماما كما هو يكتب في عقود الايجار ـ<br />اي اخلال بشروط هذا العقد يعتبر مفسوخا من تلقاء نفسه وينطرد المستأجر وتعود العين المؤجرة الى مالكها<br />فسينا اللي هي الضفة الثانية اللي انت بتقول عليها مصر تديرها مدنيا بشروط<br />وفي حالة اخلال مصر بهذه الشروط ........... انت عارف الباقي<br />فمعلش مصر خارج اللعبة اللي عايز يلعب مع اسرائيل يلعب بعيد عن مصر<br />عندكوا سوريا وعندكو الاردن وعندكو السعودية<br />حاربوا من هناك<br />ما لكوش دعوة بمصر"
archived = "2010-03-14"
