[[comments]]
order = 2
subject = "اسرائيل بتستهزأ بيكم لان الحقيقة ان العرب كلهم ناس"
author = "مش لازم ومش كاتب"
posted = "2009-01-27"
text = "اسرائيل بتستهزأ بالعرب كلهم لانهم ناس مهزئين<br />لماذا<br />لانهم اخوان ووطني وكفاية وفتح ....... الى اخره من الاحزاب القومية والدينية التي لا تنتهي<br />علشان كده اسرائيل بتستهزأ بينا<br />ربنا سبحانه وتعالى قال ايه في القران (تحسبهم جميعا وقلوبهم شتى) المفروض يكون دول اليهود<br />لكن للاسف اليهود تنبهوا الى الاية القرأنية واصبحوا على قلب واحد كلهم واصبحنا احنا للاسف (تحسبهم جميعا وقلوبهم شتى)<br />احزاب احزاب احواب وجمعيات دينية لا اول لها من اخر على مستوى العرب كلهم<br />شوية مسخره يا راجل<br />يا شماتة اسرائيل والاقباط فيها<br />اي والله شمتانين فينا وعارفين اننا عمرنا ما حنتقدم ابدا طول ما احنا احزاب وبنتهم بعض بالخيانة والعمالة<br />كل حزب بما لديهم فرحون<br />كل الاحزاب العربية القومية والدينية تتهم الاخرى بالعمالة والخيانة<br />يعني لما اسرائيل خرجت من غزه وبعد كده عاثت حماس في غزه فسادا وتقديلا في الفتحاوية اللي في غزه<br />دا اسمه كلام دا<br />وفي مصر في مجلس الشعب ضربوا بعض الوطني والاخوان كل منهم اتهم الاخر بالعمالة والخيانه ووصل الامر الى حد رفع الاحذية الثقيله<br />المفروض نوفر الـ 2 جنيه ونوفر الـ 50 جنيه ولما نبطل خيبة ثقيله ونلاقي قائد واحد نأتمر بأمره ونرتضيه قائدا لنا وزعيمها لنا يبقى دي هي نقطة البداية<br />لكن طول ما احنا احزاب زبالة كده بما فيهم حزب الاخوان عمرنا ما حننفع<br />واسرائيل حتفضل فوق فوق وبتضحك عليكم وبطلوا الهبل دا بتاع محاكمة المسئولين في اسرائيل<br />بطلوا بقا شوية الهبل دول والعبط<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""

[[comments]]
