[[comments]]
order = 0
subject = "إيه الهبل ده ؟"
author = "محمد ميدو"
posted = "2007-05-13"
text = "أنا مش فاهم هنفضل كده لحد إمتى ؟؟<br />إيه يعنى لما المسيحيين يبنوا كنيسة ولا إتنين ولا حتى مليون كنيسة ؟؟<br />إيه اللى هيحصل يعنى ؟؟<br />ما الجوامع مالية الدنيا و بتتبنى بدون تراخيص و مفيش حد بيتكلم .. و لما ييجى المسيحيين يبنوا كنيسة الدنيا تقوم و ماتقعدش ؟؟؟<br />نفسى أفهم هنتعدل إمتى و هنسيبنا من الإخوان إمتى ...<br />الإخوان عاوزين يولعوا الدنيا يا جدعاااااااااان ..<br />الناس دول متطرفين .. بلاش نمشى وراهم"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

