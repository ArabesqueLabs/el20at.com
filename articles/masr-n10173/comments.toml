[[comments]]
order = 13
subject = "الي الاستاذ ابن الاسلام"
author = "مصري صميم"
posted = "2007-05-15"
text = "اعزر لك عدم فهمك الدقيق للانجيل وكذللك الباسك للحق بالباطل لا اعلم عن قصد او دون قصد ولكن وجب التوضيح<br />اولا الانجيل يشتمل ايات واعداد ليس اعداد فقط<br />مثل(لانه هكذا احب الله العالم حتي بذل ابنه الوحيد لكي لا يهلك كل من يؤمن به بل تكون له الحياه الابديه)هذه الايه في يوحنا اصحاح 3 من العدد 16......<br />اذا الانجيل به ايات والعدد هو مكان وجود الايه كما تعلمنا منذ الصغر<br />لم ازعم او اجرؤ ان ادعي ان العهد الجديد ابطل العهد القديم حاشا بل ان العهد الجديد هو مكمل للعهد القديم وكل مسيحي علي وجه الارض يعلم ذللك جيدا<br />ما تغير يا سيدي ليس كلا م الله او احكامه لكن الذي تغير هي حاله علاقه الله بالناس فبعد مجيئ المسيح وموته وقيامته شيئ وقبل ذلك شيئ اخر.فلقد تسامح الله مع البشر في العهد الجديد بموت المسيح وقيامته.اي ان كل البشر صاروا<br />مثلهم مثل بني اسرائيل وعلي طريقة ((نبي الهدايه ) ) لا فرق بين عربي واعجمي الا بالتقوي.<br />اي انه صار لا حاجه لقتال الكفار والاثمه او القتال للحصول علي ارض الموعد اذ صار كل البشر في صلح مع الله من خلال عمل المسيح علي الصليب<br />اذا‘ احكام الله لم تتغير ولم ييبطل العهد الجديد العهد القديم بل علاقه الله بالناس هي تغيرت بالتالي كان لا حاجه للقتال وصار بني اسرائيل مثلهم مثل باقي شعوب الارض بعد ان رفضو وامروا بصلب المسيح..<br />تقول ان حد الرده موجود في الانجيل طبعا هذا هو الباس الحق بالباطل فلم نسمع ابدا ان المسيحين طبقوا حد الرده علي احد وتستشهد بايات من العهد القديم واكرر عندما كان بني اسرائيل هم شعب الله في العهد القديم كانت علاقه الله بالناس شيئ وبعد مجيئ المسيح شيئ اخر(علاقه الله بالناس وليس ايات واحكام الله )<br />هذا الرد موجود في اكثر من مرجع مسيحي علي الانتر نت وليس هو من بنات افكاري.<br />اما اهم نقطه فهي دعوتك لي الي الهدايه وانا اشكرك علي اهتمامك ولكن اكد لك اني عالم بما امنت وادعوك ان اردت<br />ان تطلع معي علي كمية مهوله من التناقضات في القران والناسخ والمنسوخ وتضارب اقوال الله (والعياذ بالله)واقوال الصحابه والرسول بل ووجود اكثر من مصحف تم حرقهم لاختلافهم الشديد فيما بينهم ومخالفه القران للكثير من الحقائق العلميه المعروفه ناهيك عن اوامر القتال والجهاد الديني ضد غير المسلمين والتعصب المليئ به القران نحو كل ما هو غير مسلم ...<br />ان كنت لا تعلم هذه الحقائق فانا علي استعداد ان ازودك بها اما ان كنت تعلم هذه الحقائق وتتجاهلها فحسابك سيكون امام الله وانا لا اتمني لك ابدا ان تكون في هذا الموقف..<br />اخيرا انا اعلم تماما بمن وبماذا امنت وشكرا لك وانا علي اتم استعداد ان ازودك بكل الحقائق التي انا ذكرتها..."
archived = "2007-11-19"
