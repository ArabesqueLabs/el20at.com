[[comments]]
order = 21
subject = "لكل نصراني ... محترم ... عاقل ... منصف ... تجربة ل"
author = "ابن الإسلام"
posted = "2007-05-21"
text = "- بسم الله الرحمن الرحيم ... الواحد الأحد ... الفرد الصمد ... الذي لم يلد ولم يولد ... ولم يكن له كفوا أحد<br />- إلى كل نصراني ... محترم ... عاقل ... منصف ... والله ما دفعني إلى كتابة هذا التعليق إلا خوفي عليك وحزني على مصيرك<br />- وإنما مثل الإسلام ومثلكم كرجل (الإسلام) في حديقة وعنده نار موقدة ... وحوله فراشات (أنتم) تتهافت للوقوع في هذه النار - وهذه طبيعة الفراشات فعلا - والرجل يصدها ويحاول أن يمنعها من الوقوع في النار التي تسعى إليها ... وبالرغم من ذلك ... تتفلت منه وتندفع بإصرار نحو هلاكها وهي تظن أنها تندفع إلى الدفء. (مقتبس من بعض حديث خير البشر صلى الله عليه وسلم)<br />- بالله عليك كن من الفراشات الناجيات ... وكفاك إنقياد وراء المظاهر الخادعات.<br />- قد تكلمت في هذه الصفحة عن بعض أعداد كتاب النصارى ولم يكن ذلك إلا ردا على (مصري صميم) وهو نصراني طالب بتعديل الإسلام ونسب إليه ما هو منه براء ... فلم أكن إلا مدافعا عن هذا الدين العظيم الذي أشرف أن جعلني الله عز وجل من أتباعه وأسأله تعالى ألا أموت إلا عليه.<br />- سأعرض عليك الآن تجربة بسيطة ... أنت تتلقى منذ الصغر كلمات مسمومات بحق الإسلام وبحق نبي الإسلام وبحق القرآن العظيم ... فسلمت بذلك ولم تفترض يوما أن هذه الكلمات ليست صحيحة ... وصدرت لك تعليمات مشددة ألا تحاول أن تستمع للقرآن لأنه كتاب فظيع وووووو ...هذه الكلمات قد جعلت بينك وبين الإسلام حاجزا منيعا.<br />- الآن أنت إنسان عاقل ... تستطيع أن تميز الغث من السمين ... فلم تخاف أن تكسر هذه القاعدة؟؟؟ ...فلتستمع إلى القرآن الكريم ... فإما أن يتأكد لك صحة تلك الكلمات ... وإما أن توقن أن هناك شيئا ما يداعب قلبك ويخاطب عقلك ... بالله عليك لماذا تخاف من هذه التجربة؟؟؟ ... ألست في عقيدتك من الواثقين؟؟؟ ... فلتعتبرها إحدى التجارب التي يقوم بها الشباب ولو بدافع التحدي.<br />- سأختار لك سورة ليست بالطويلة وليست بالقصيرة (سورة ق) ... وقاريء ذو صوت ممتع ورائع (مشاري راشد) ... هيا يا غالي ... هيا يا أخا الإنسانية ... لن تأخذ السورة من عمرك غير 8 دقائق و 41 ثانية ... حمل الملف في الرابط التالي ... وتعرف على القرآن الكريم<br />- http://live.islamweb.net/Quran/MeshariAl3affasy/50.rm<br />- سبحانك اللهم وبحمدك ... أشهد أن لا إلاه إلا أنت ... أستغفرك وأتوب إليك"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 22
subject = "محمد ميدو ايه الهبل دا وايش دخل الاخوان في الموضوع"
author = "فاضح الاقباط"
text = "الراجل دا ما اسموش محمد ميدو الرا\\جل دا قبطي مسيحي وزي ما قلت قبل كده المسيحيين عندهم هاجس اسمه الاخوان ومهدي عاكف وحاسين انه قرب يا اخد الحكم وهذا ليس صحيح لاننا بنؤيد الريس حسني مبارك وابنه جمال مبارك من بعده<br />ويا اهبل يا عبيط الفلاحين بتوع العياط اخوان طيب ازاي<br />وبعدين المسيح يا اخي ما بناس كنيسة انتوا عايزين تبنو كنايس ليه"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

