order = 12
subject = "ويا عجبا لقبر ضم رباً .... وأعجب منه بطن قد حواه"
author = "ابن الإسلام"
posted = "2007-05-15"
text = "أستاذ مصري صميم ... ليس الغرض من تعليقي إلباس الحق بالباطل كما حكمت ولا أن أقنعك سواء شئت أم أبيت ولكن ردي كان إعتراض أن حضرتك تريد من المسلمين تعديل دينهم ... وكان هذا الرد على طريقة البايبل (لماذا تنظر القذى الذي في عين اخيك و اما الخشبة التي في عينك فلا تفطن لها )<br />عموما يا عزيزي الموضوع ليس تحديا لكي تتكلم بهذه الصورة العصبية<br />والآن إليك ردي<br />1-بداية لا يوجد في البايبل ما يسمى بالآيات بل هي أعداد (فمن منا غير عارف بأمور النصرانية عزيزي؟؟؟)<br />2-ذكر في البايبل على لسان اليسوع أنه لم يأت لينقض الناموس (العهد القديم) وبالتالي تعاليم العهد القديم هي تعاليم العهد الجديد ... إن أنكرت ذلك فهو إعتراف منك بأحد شيئين ... أ- إلاه العهد القديم ليس هو إلاه العهد الجديد ب- هو نفس الإلاه ولكنه من النوع الذي يرجع في كلامه<br />3-آسف أني أقول لحضرتك إن تفسيرك للأعداد التي ذكرتها من العهد الجديد ما هو إلا كلام من بنات أفكارك ولا يوجد دليل عليه من مرجع معتمد وبالتالي هو ملزم ومقنع لسيادتك فقط<br />4-بالنسبة لحد الردة - من فضلك استخدم لغة أرقى في الحوار فإن كل إناء بما فيه ينضح - أنا لا أفهم لماذا حضرتك معترض عليه مع إنه مذكور في البايبل (منقول من الأخ علاء الدين العضو بمنتديات ابن مريم الإسلامية) وإليك النص<br />أولا : العهد القديم<br />التثنية الإصحاح 13<br />6. واذا اغواك سرا اخوك ابن امك او ابنك او ابنتك او امرأة حضنك او صاحبك الذي مثل نفسك قائلا نذهب ونعبد آلهة اخرى لم تعرفها انت ولا آباؤك 7 من آلهة الشعوب الذين حولك القريبين منك او البعيدين عنك من اقصاء الارض الى اقصائها 8 فلا ترض منه ولا تسمع له ولا تشفق عينك عليه ولا ترقّ له ولا تستره 9 بل قتلا تقتله.يدك تكون عليه اولا لقتله ثم ايدي جميع الشعب اخيرا. 10 ترجمه بالحجارة حتى يموت.لانه التمس ان يطوّحك عن الرب الهك الذي اخرجك من ارض مصر من بيت العبودية<br />ثانياً : العهد الجديد<br />إنجيل لوقا الأصحاح 19 :<br />27 اما اعدائي اولئك الذين لم يريدوا ان املك عليهم فأتوا بهم الى هنا واذبحوهم قدامي<br />ثالثا : الواقع الحالي<br />وفاء قسطنطين لماذا لا تظهر على الشاشات لتقول لنا أنها عادت للنصرانية؟؟ علماً أنها ظلت مسلمة سراً لمدة تزيد على العامين؟؟<br />5-هل لكي يغفر الرب للبشر يرسل لهم ابنه - حاشا لله - لكي يصلبوه؟؟ يا أستاذي الفاضل أي الذنبين أبشع في رأيك؟؟ أن يأكل آدم من الشجرة المحرمة؟ أم أن يقتل اليهود رجلا لا ذنب له بعد أن يجروه كالنعجة ويستهزؤا به ويبصقوا في وجهه ويصفعوه على قفاه طبقا لما ورد في البايبل (متى إصحاح 26 وإصحاح 27) ؟<br />6-بالنسبة لآيات القتال في القرآن الكريم فقد كفى ووفى الأخ طيف بدر في الرد وأقتبس رده مرة أخرى لعلك لم تقرأ هذه النقطة جيداً<br />أما الإسلام فقد وضع قاعدتين صريحيتين في التعامل مع غير المسلمين حيث يقول الله (عز و جل) في سورة الممتحنة : {لَا يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ لَمْ يُقَاتِلُوكُمْ فِي الدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيَارِكُمْ أَن تَبَرُّوهُمْ وَتُقْسِطُوا إِلَيْهِمْ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ (8) ِنَّمَا يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ قَاتَلُوكُمْ فِي الدِّينِ وَأَخْرَجُوكُم مِّن دِيَارِكُمْ وَظَاهَرُوا عَلَى إِخْرَاجِكُمْ أَن تَوَلَّوْهُمْ وَمَن يَتَوَلَّهُمْ فَأُوْلَئِكَ هُمُ الظَّالِمُونَ }<br />و في القتال يذكر الله سبحانه و تعالى في سورة البقرة : {وَقَاتِلُواْ فِي سَبِيلِ اللّهِ الَّذِينَ يُقَاتِلُونَكُمْ وَلاَ تَعْتَدُواْ إِنَّ اللّهَ لاَ يُحِبِّ الْمُعْتَدِينَ }البقرة190<br />7-هذه نصيحة من أخ لك في الإنسانية - بكل الحب والله - إذا أردت أن تعرف الدين الذي كان عليه المسيح عيسى بن مريم حقاً فاقرأ عن الإسلام من المصادر الإسلامية فإن أخذت بنصيحتي فإما أن يهديك الله للحق الواضح الذي لا يخفى وإما أن تقام عليك الحجة ولن يكون لك أمام الله عز وجل يوم القيامة من عذر<br />8-سبحانك اللهم وبحمدك ... أشهد أن لا إلاه إلا أنت ... أستغفرك وأتوب إليك"
