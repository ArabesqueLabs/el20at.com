author = "اللهم أعط هذا المسكين عقلا"
posted = "2007-05-20"
text = "- ياااااااااااه ... كل ده علشان عرفت إنك بتعبد خروف؟؟؟ ... أمال يا كتكوت لما تعرف الباقي هاتعمل إيه؟؟؟ ... إوعى تكون ناوي تنطح المسلمين بربك زي ما البايبل بيقول (مزمور44 عدد4: انت هو ملكي يا الله.فأمر بخلاص يعقوب. (5) بك ننطح مضايقينا.باسمك ندوس القائمين علينا)<br />- شوف يا ابني ... واضح إنك بغبغان بتسمع الكلام وتردده من غير ما تفكر فيه ...والمشكلة المعتادة - بصراحة قد أصبحت مملة - إنك مابتعرفش تكتب سطرين على بعض من غير أخطاء إملائية (13 غلطة في سطرين)<br />- بس عارف يا كتكوتي ... ضحكتني أوي بموضوع التبشير ده ... ممكن تقول لي عندك إيه في دينك ممكن تقنعني بيه؟؟؟ ... تعال نشوف<br />- ممكن تقول مثلا : ربي بيحبك ... واتصلب علشانك ... دا حتى اليهود جرجروه وقلعوه هدومه وبصقوا في وجهه وصفعوه على قفاه (والله يا جماعة متى ولوقا اللي بيقولوا الكلام ده مش أنا) كل ده علشان يسامحك وعلشان بيحبك ........ عارف ساعتها هاعمل إيه؟؟؟ هاعمل فيك زي ما اليهود عملوا فيه ... وهاضربك على خدك اليمين وأأمرك تديلي الشمال كمان ... وهاطلع فيك كبت 6 سنين ضرب في إبتدائي.<br />- ممكن مثلا تقول لي : تعالى أعبد رب الأرباب وملك الملوك (اللي هو الخروف حسب رؤيا يوحنا اللاهوتي 17 : 14) ... طبعا ساعتها هاقع على الأرض من كتر الضحك ... وردي هيكون إني مش باحب اللحمة الضاني ... يا عم دا الهنود اللي بيعبدوا البقرة أطعم.<br />- أو ممكن تقوللي : تعالى اتنصر وشاركنا في حل هذه المشكلة العويصة التي إكتشفها البايبل وسبق بيها القرآن ( نشيد الإنشاد 8: 8) (لنا اخت صغيرة ليس لها ثديان.فماذا نصنع لاختنا في يوم تخطب) ... أترك للقارئ التعليق.<br />- غالبا هتقول لي : تعالى أعبد رب المحبة وسيبك دينك اللى كله قتل ... أظن إنك لو قرأت كل الفظاعة اللي طلعتهالك من كتابك هترد على نفسك ... ولأن تكون جاهلا بكتابك فأنت بكتاب غيرك أجهل ... عمرك سمعت عن رب يأمر بشق بطون الحوامل [هوشع (13) 16 تجازى السامرة لانها قد تمردت على الهها.بالسيف يسقطون.تحطم اطفالهم والحوامل تشقّ] ... رحماك يا الله ... عرفت ليه الأمريكان واليهود يقتلون الأطفال ويبقرون بطون الحوامل؟؟؟ تعليمات ربهم المقدسة.<br />والذي نفسي بيده ... لم ولن يعرف التاريخ فرسانا ومقاتلين في نبل المسلمين ... وأنت وعشيرتك أدل دليل على ذلك.<br />- ممكن تقول لي : تعالى بس وأنا هابسطك ... إيه رأيك أشربك كاسين من دم ربي؟؟؟ (داهية لا تكون مش عارف الإفخارستيا \"التناول بالعربي\"-) ... ساعتها هيكون ردي أن المسلم طاهر الفم لا يشرب الخمر في الدنيا ولا يقربها ... وبعدين رب إيه ده اللى أشرب دمه؟؟؟ يا عالم إن ما كانش ده اسمه وثنية وتخلف يبقى اسمه إيه؟؟؟<br />- دينك يلخص في قول الله تعالى (مَثَلُ الَّذِينَ اتَّخَذُوا مِن دُونِ اللَّهِ أَوْلِيَاء كَمَثَلِ الْعَنكَبُوتِ اتَّخَذَتْ بَيْتًا وَإِنَّ أَوْهَنَ الْبُيُوتِ لَبَيْتُ الْعَنكَبُوتِ لَوْ كَانُوا يَعْلَمُونَ) فلما تكون صاحب دين هش بهذا الشكل يجب أن تنزوي في ركن بعيد وتسكت عن الدين الذي أرسل الله كل أنبيائه ورسله الكرام للدعوة إليه (لا إلاه إلا الله ... محمد رسول الله)<br />- بالمناسبة ... من الذي أخبر الرسول صلى الله عليه وسلم من 1400 سنة أن أنثى العنكبوت هي التي تبني البيت وليس الذكر؟؟؟ لماذا قال القرآن الكريم اتخذت بيتا ولم يقل اتخذ بيتا؟؟؟ لكل صاحب عقل ... جاوب<br />- وأبلغ رد على موضوع التبشير هو قول الله تعالى (قُلْ أَنَدْعُو مِن دُونِ اللّهِ مَا لاَ يَنفَعُنَا وَلاَ يَضُرُّنَا وَنُرَدُّ عَلَى أَعْقَابِنَا بَعْدَ إِذْ هَدَانَا اللّهُ كَالَّذِي اسْتَهْوَتْهُ الشَّيَاطِينُ فِي الأَرْضِ حَيْرَانَ لَهُ أَصْحَابٌ يَدْعُونَهُ إِلَى الْهُدَى ائْتِنَا قُلْ إِنَّ هُدَى اللّهِ هُوَ الْهُدَىَ وَأُمِرْنَا لِنُسْلِمَ لِرَبِّ الْعَالَمِينَ)<br />- سبحانك اللهم وبحمدك ... أشهد أن لا إلاه إلا أنت ... أستغفرك وأتوب إليك"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

