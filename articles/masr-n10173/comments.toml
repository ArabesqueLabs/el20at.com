[[comments]]
order = 2
subject = "حرام اللى بيحصل دة"
author = "مراكب مراكب"
posted = "2007-05-13"
text = "مع احترامى للاخ اللى كتب قبلى بس انا اول مرة اسمع عن العهدة العمرية ؟ دى بتاعت اية ياريس<br />عاوز اقول بس ان اللى ورا الاحداث المؤسفة دى شوية مجرمين كلنا طبعا عارفينهم متخفيين ورا مسلم ومسيحى<br />وطول عمرنا ماتفرقنا بالشكل دة<br />على راى اللى قال ماتبنى 5 ولا مليون كنيسة اية يعنى<br />الدين اصلة فى القلب مش بالعافية والناس اللى مش مصدقة ان الاخوان واللى زيهم من المسيحيين حيخربوا البلد<br />خدوا بالكم ياجماعة<br />مش الاخوان بس كمان فى مسيحيين اللى اسمهم المسيحيين الصهاينة ودول كبارهم فى امريكا وزعيمهم السيد مايكل منير كمان زى الاخوان مش حيسيبوا البلد دى الالما تبقى خراب"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 3
subject = "نقطه نظام"
author = "نيفين نيفى نوفا"
posted = "2007-05-13"
text = "اولا يعنى ايه خلاف على قطعه ارض اقصد السؤال هو الارض مللك لمين لافراد و لا للدوله و لا ايه بالظبط<br />لان لو مللك افراد او فرد فهو اللى هيفصل يبيع لمين اما لو مللك الدوله فمتهيالى فيه اجهزه معنيه بالفصل الحازم ف المساله دى<br />انا بجد مش فاهمه<br />و بعدين عايزه اوجه سؤال للناس اللى فوق (ايه دخل الاخوان ف الموضوع)و لا هو اسم مسلم بقى بقى مقترن باخوانى<br />يا جماعه انتو كده اللى بتنفخو ف النار و النار دى خطرها اكبر من نار مايكل منير و امثاله<br />يا ريت تكون الرساله وصلت<br />ملحوظه:للمره المليون بعد الخمسه مليون لست من الاخوان"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 4
subject = "الاسلام في حاجه الي تعديل"
author = "مصري صميم"
posted = "2007-05-13"
text = "ما الذي سيضر المسلمين اذا تم بناء كنيسه او كثر . فلا احد يمنع او يجرؤ ان يمنع بناء جامع.الحقيقه هي ان الحادثه هي انعكاس لروح التعصب العمياء,ولفكر رجعي متخلف مزروع في الدين الاسلامي يرفض كل ماهو غير مسلم ويدعو الي محاربته عن طريق(الجهاد والفتوحات وقتال المشركين) . هذا الاتجاه الاسلامي العنيف الذي يرفض اي وجود للآخر, في حاجه الي تعديل وتغيير,كذلك المبادئ الاسلامية العنصرية مثل (لا ولاية لغير المسلم علي المسلم ) ايضا في حاجه الي تغيير وتعديل .اعتقد ان المسلمون في هذا العصر المتطور مدعوون الي وقفه مع انفسهم تجاه مبادئ دينهم خصوصا تلك التي ترفض التسامح وقبول الأخرين...."
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 5
subject = "هههههههه"
author = "طيف بدر"
posted = "2007-05-13"
text = "المسلمون هم الذين احتلوا نصف العالم و ارتكبوا مذابح دنشواي و ذبحوا مليون نفس في الجزائر و أبادوا الهنود الحمر و الآسيوين و استعبدوا الأفارقة و أبادوا سكان أستراليا و قبائل الهينز في كينيا و احتلوا فلسطين بعد ارتكابهم مذابح دير ياسين و قانا و بحر البقر و كفر قاسم و قتلوا مئات الأطفال في ملجأ العامرية و هتكوا الأعراض في أبو غريب و دمروا هيروشيما و ناجاساكي و درسدن<br />http://alayasser.maktoobblog.com"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 6
subject = "محمد ميدو ايه الهبل دا وايش دخل الاخوان في الموضوع"
author = "فاضح الاقباط"
posted = "2007-05-13"
text = "الراجل دا ما اسموش محمد ميدو الراجل دا قبطي مسيحي وزي ما قلت قبل كده المسيحيين عندهم هاجس اسمه الاخوان ومهدي عاكف وحاسين انه قرب يا اخد الحكم وهذا ليس صحيح لاننا بنؤيد الريس حسني مبارك وابنه جمال مبارك من بعده<br />ويا اهبل يا عبيط الفلاحين بتوع العياط اخوان طيب ازاي<br />وبعدين المسيح يا اخي ما بناس كنيسة انتوا عايزين تبنو كنايس ليه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "ايه الإرهاب ده"
author = "ابن الإسلام"
posted = "2007-05-14"
text = "1- السلام على من اتبع الهدى<br />2- الأستاذ (مصري صميم) اسمحلي أقول لك إن كونك عايز تعديل في الإسلام إن ده يعتبر إرهاب فكري من حضرتك<br />3- حضرتك بتقول (اعتقد ان المسلمون في هذا العصر المتطور مدعوون الي وقفه مع انفسهم تجاه مبادئ دينهم خصوصا تلك التي ترفض التسامح وقبول الأخرين) طيب يا أستاذي الفاضل ده ممكن يحصل إذا حضرتك حذفت من كتاب النصارى الأعداد الفظيعة - في العهد القديم والعهد الجديد - التي تشجع على ذبح المخالفين وشق بطون الحوامل والتفريق بين الأهل والأقارب.<br />4- وبناء عليه أعيد صياغة كلامك<br />اعتقد ان النصارى في هذا العصر المتطور مدعوون الي وقفه مع انفسهم تجاه مبادئ دينهم خصوصا تلك التي ترفض التسامح وقبول الأخرين<br />وأضيف عليه<br />لماذا يحض كتاب النصارى أتباعه على الإرهاب<br />5- من حق حضرتك تطالبني بالدليل على أقوالي .... حسنا الأدلة في النقطة القادمة<br />6- لوقا 19: 27 أمَّا أعدائي الذينَ لا يُريدونَ أنْ أملِكَ علَيهِم، فَجيئوا بِهِم إلى هُنا واَدبحوهم قدامي<br />انجيل متى (10) 34 لا تظنوا اني جئت لألقي سلاما على الارض.ما جئت لألقي سلاما بل سيفا. 35 فاني جئت لأفرّق الانسان ضد ابيه والابنة ضد امها والكنة ضد حماتها<br />هوشع (13) 16 تجازى السامرة لانها قد تمردت على الهها.بالسيف يسقطون.تحطم اطفالهم والحوامل تشقّ<br />اشعيا (13) 16 وتحطم اطفالهم امام عيونهم وتنهب بيوتهم وتفضح نسائهم<br />مزمور (138) 9 طوبى لمن يمسك اطفالك ويضرب بهم الصخرة<br />صموائيل 1 (15) 3 فالآن اذهب واضرب عماليق وحرموا كل ما له ولا تعف عنهم بل اقتل رجلا وامرأة.طفلا ورضيعا.بقرا وغنما.جملا وحمارا.<br />سفر حزقيال(9) 6 الشيخ والشاب والعذراء والطفل والنساء اقتلوا للهلاك.ولا تقربوا من انسان عليه السمة وابتدئوا من مقدسي.فابتدأوا بالرجال الشيوخ الذين امام البيت.<br />كفاية كدة<br />7- بصدق والله موقفي من الخبر الأصلي أ- لا يحق لمسلم أن يعتدي على ذمي ب- الحاكم المسلم هو المنوط بتطبيق أحكام الإسلام فإن فعل فهو واجبه وإن لم يفعل فلا يجوز لعوام المسلمين هذا الفعل ما أقيمت الصلاة في البلد المسلم<br />ج- الفتنة الطائفية تتم في مصر عبر أيدي خفية وأعتقد أن كل المصريين مدركين ذلك<br />8- سبحانك اللهم وبحمدك ... أشهد أن لا إلاه إلا أنت ... أستغفرك وأتوب إليك"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 8
subject = "مغالطات مرفوضة من الاخ ابن الاسلام"
author = "مصري صميم"
posted = "2007-05-14"
text = "الاخ ابن الاسلام كعادتكم كمسلمين في الرد تلبسون الحق بالباطل لا اعلم عن قصد او عن غير قصد.وتريدون منا ان نقتنع شئنا ام ابينا .اولا الايات التي ذكرتها من الانجيل اغلبها من العهد القديم اي من التوراه اي قبل ان ياتي المسيح ومعه عهد النعمه والتسامح لذلك كان الله يطلب من شعبه اليهود الامه الوحيده التي كانت تعبد الله في ذللك الوقت بان يفعلو هكذا في اعدائهم الذين هم لا يعبدوا الله بل يفعلو كل اثم وفجور وهذا عقابهم علي زيغانهم وفسقهم.وبمجيئ المسيح بدا العهد الجديد بان دفع المسيح ثمن خطايا العالم كله بالصلب وبالتالي تسامح الله مع كل البشر اللذين يقبلون عمل المسيح<br />وانا اعذرك علي سوء فهمك لانك غير عارف بامور المسيحيه ومجيئ المسيح الخ.....اما الايتين من العهد الجديد اقصد ايات لوقا ومتي فهما نبؤات لما سيفعله الله بللذين لم يقبلو المسيح (في الاخره)ونبؤات حدثت فعلا عندما يتبع غير المسيحي المسيح دونا عن بقيه اهله فينشا الصدام (وذلك بفضل قانون الرده الاسلامي الهمجي).اذا المسيحيه ككل هي رساله تسامح ومحبه حققها المسيح باتمام العهد الجديد ومسامحه الله للناس ومسامحه الناس بعضهم لبعض(احبوا اعدائكم باركوا لاعنيكم واحسنو الي مبغضيكم).بعكس القران المليئ باوامر القتال وامتلاك العبيد والايماء وما امتلكت ايديكم ومقاتله اليهود والنصاري والمشركين وما اكثر هذه الايات وان اردت لاحضرت لك طنا من هذه الايات في القران الذي لا يشتمل لا علي عهد جديد ولا قديم ولا عهد نعمه ولاغيره. اي ان الكلام موجه للمسلمين في كل الاوقات والازمان ..وانا اعزرك لعدم معرفتك الجيده بثوابت المسيحيه...وشكرا"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 9
subject = "إلى المصري \"التايواني\""
author = "طيف بدر"
posted = "2007-05-14"
text = "تقول : \"الايات التي ذكرتها من الانجيل اغلبها من العهد القديم اي من التوراه اي قبل ان ياتي المسيح ومعه عهد النعمه والتسامح لذلك كان الله يطلب من شعبه اليهود الامه الوحيده التي كانت تعبد الله في ذللك الوقت بان يفعلو هكذا في اعدائهم الذين هم لا يعبدوا الله بل يفعلو كل اثم وفجور وهذا عقابهم علي زيغانهم وفسقهم\"<br />أي أن ربكم يأمر بني إسرائيل بقتال الكفار أيضا .<br />و تقول : \"اما الايتين من العهد الجديد اقصد ايات لوقا ومتي فهما نبؤات لما سيفعله الله بللذين لم يقبلو المسيح (في الاخره)ونبؤات حدثت فعلا عندما يتبع غير المسيحي المسيح دونا عن بقيه اهله فينشا الصدام\" مع أن هذا يتعارض مع قولك \"وبمجيئ المسيح بدا العهد الجديد بان دفع المسيح ثمن خطايا العالم كله بالصلب\" !!!!<br />أما الإسلام فقد وضع قاعدتين صريحيتين في التعامل مع غير المسلمين حيث يقول الله (عز و جل) في سورة الممتحنة : {لَا يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ لَمْ يُقَاتِلُوكُمْ فِي الدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيَارِكُمْ أَن تَبَرُّوهُمْ وَتُقْسِطُوا إِلَيْهِمْ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ (8) ِنَّمَا يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ قَاتَلُوكُمْ فِي الدِّينِ وَأَخْرَجُوكُم مِّن دِيَارِكُمْ وَظَاهَرُوا عَلَى إِخْرَاجِكُمْ أَن تَوَلَّوْهُمْ وَمَن يَتَوَلَّهُمْ فَأُوْلَئِكَ هُمُ الظَّالِمُونَ }<br />و في القتال يذكر الله سبحانه و تعالى في سورة البقرة : {وَقَاتِلُواْ فِي سَبِيلِ اللّهِ الَّذِينَ يُقَاتِلُونَكُمْ وَلاَ تَعْتَدُواْ إِنَّ اللّهَ لاَ يُحِبِّ الْمُعْتَدِينَ }البقرة190<br />و كل آيات القتال نزلت في ذروة الصراع بين المسلمين و الكافرين الذين بدأوا الصراع و الاضطهاد<br />أما بالنسبة لموضوع الكنيسة فالقضاء هو الذي يحكم فيها و أن أول من ينادي بإعطائكم الأرض إن كانت حقا قانونيا لكم و سأدعو لعدم الصلاة في أرض مغتصبة و أذكرك بواقعة حدثت في عهد رسول الله (صلى الله عليه و آله و سلم) نزل فيها قرآن من فوق سبع يماوات يحكم الله فيها ليهودي صاحب حق ضد مسلم معتدي وصفه الله بالخائن على الرابط التالي<br />http://alayasser.maktoobblog.com/?post=263414"
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 10
subject = "الي الاستاذ طيف بدر (الهندي)"
author = "مصري صميم"
posted = "2007-05-14"
text = "الاستاذ طيف بدر الهندي يبدو انك لم تفهم ما انا شرحته .1_فانا عنيت بما قلت انه باتمام العهد الجديد تصالح الله مع الناس وسامحهم بموت المسيح علي الصليب وهذا معناه انه لا يوجد شعب الله يقاتل الكفار بل صار كل من يقبل رساله المسيح المتسامحه هو من شعب الله وليسالم كل الناس بكل طوائفهم قدر المستطاع بحسب تعاليم المسيح والمسيحيه.اما القران فلا يوجد فيه عهد جديد يمنع المسلمون من القتال والجهاد في سبيل الله بل كل احكام القران قائمه لكل العصور اذ انه لا يوجد عهد جديد وعهد قديم مثل الانجيل.2_ثم انك تدعي بوجود تناقض وهمي موجود فقط في عقلك لاني عنيت ان الله سيحاسب في الاخره كل من رفض المسيح حساب عنيف جدا واكرر(في الاخره) اما في الحياة الدنيا فلقد منحنا عصر النعمه الذي رضي الله فيه عن عمل المسيح علي الصليب انه لا قتال للكفار ولا عقاب من الله للانسان بالقتل مثل العهد القديم في هذه الحياه واكرر (في الحياة الدنيا )بل العقاب في الاخره لمن يرفض المسيح ورسالته....<br />واخيرا وبعيدا عن كل هذا فلا استطيع ان اقول علي مايحدث للمسيحيين من قتل وضرب وحرق منازل وعربده لا لسبب الا لانهم يريدون بناء كنيسه الا انها الهمجيه بعينها والتي تنبع من دين همجي يحرض علي القتال واذا كان لك راي اخر عما يحدث فاعلمني به..يا سيدي هذا ارهاب ووحشيه مستوحاه من مبادي اسلاميه عنصرية ولا يمكن لعاقل ان يقبل ما يحدث للمسيحين الان."
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

[[comments]]
order = 11
subject = "اضافه بسيطه للاخ طيف بدر الهندي"
author = "مصري صميم"
posted = "2007-05-14"
text = "الله في العهد القديم لم يامر بني اسرائيل بقتال الكفار لسبب كفرهم بل لانهم كانو متواجدين في ارض بني اسرائيل التي اعطاها لهم الله اي ان سبب القتال ليس عقائدي او ديني كما في الاسلام بل ليملك بني اسرائيل علي الارض المعنيه.هذا لا يمنع ان هذه الشعوب مثل الكنعانيين وغيرهم كانو ا فعلا كفار عبدة اوثان يفعلون الشر في عيني الرب .ولذلك كانوا بني اسرائيل هم شعب الله لانهم الوحيدون الذين يعبدوا الله وسط هذه الشعوب."
archived = "2007-11-19"
capture_url = "https://web.archive.org/web/20071119102737/http://masr.20at.com:80/newArticle.php?sid=10173"

