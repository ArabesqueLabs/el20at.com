[[comments]]
order = 15
subject = "ربنا افتح بيننا وبين قومنا بالحق"
author = "ابن الإسلام"
posted = "2007-05-16"
text = "1- السلام على من اتبع الهدى<br />2- أستاذي الفاضل لا بد أن هناك من المسلمين والنصارى من يتابع هذا الحوار فمن حقهم عليك أن تحترم متابعتهم بالرد وبيني وبينك الدليل والبرهان والأخلاق<br />3- إن لم تقم بالرد على النقط التي أثرتها في تعليقي (الله المستعان) - وخصوصا النقاط 3و4و5و6و7 سأبدأ أنا في الرد عليها بداية من التعليق القادم<br />4- ألفت نظرك أني بدأت رسالتي السابقة بشكرك على معلومة الأعداد والآيات في البايبل -ولم يكن هذا بناء على ردك فقط- ولكني بحثت عن معنى كلمة (Verse) فوجدتها تعني (آية) وليس (عدد) لذلك كان لزاما علي أن أذكر أن معلومتي كانت خطأ بل وشكرتك على تصحيحها -برغم أنك لم تأت بدليل وإنما بحثت أنا عنه -<br />5- بالنسبة لتعليقك الأخير فأنا لي تعليق على نقطة معينة فيه<br />أنت تقول (((واتمني من الله القادر علي كل شيئ))) ... حسنا أنا معك أن الله عز وجل على كل شيئ قدير ولا يعجزه أي شيئ في الأرض ولا في السماء كما يقول الله عزوجل في القرآن الكريم<br />ولكن ............<br />معبودك أنت ليس قادر على كل شيئ ... بل بالعكس هو ضعيف ... وإليك الدليل من البايبل<br />أولا : العهد الجديد<br />مرقس6 عدد5: ولم يقدر ان يصنع هناك ولا قوة واحدة غير انه وضع يديه على مرضى قليلين فشفاهم<br />ثانيا : العهد القديم<br />قضاة1 عدد19: وكان الرب مع يهوذا فملك الجبل ولكن لم يطرد سكان الوادي لان لهم مركبات حديد<br />أكرر للسادة المتابعين:<br />أولا : العهد الجديد<br />مرقس6 عدد5: ولم يقدر ان يصنع هناك ولا قوة واحدة غير انه وضع يديه على مرضى قليلين فشفاهم<br />ثانيا : العهد القديم<br />قضاة1 عدد19: وكان الرب مع يهوذا فملك الجبل ولكن لم يطرد سكان الوادي لان لهم مركبات حديد<br />مرة ثالثة أكرر<br />أولا : العهد الجديد<br />مرقس6 عدد5: ولم يقدر ان يصنع هناك ولا قوة واحدة غير انه وضع يديه على مرضى قليلين فشفاهم<br />ثانيا : العهد القديم<br />قضاة1 عدد19: وكان الرب مع يهوذا فملك الجبل ولكن لم يطرد سكان الوادي لان لهم مركبات حديد<br />لم يقدر عليهم لأن مركباتهم حديد ؟؟؟؟ تعالى الله عما يقول الكافرون علوا كبيرا ... وحسبي الله ونعم الوكيل<br />6- لا تغضب من كلمة (الكافرون) وذلك لأن هذا ما وصفكم الله به في القرآن الكريم ولأني لا يضيرني في شيئ أن تنعتني أنت بالكافر ... وذلك لأني فعلا كافر بيسوع وكافر ببولس محرف دين المسيح وكافر بالإفخارستيا وكافر بملك الملوك المذكور في سفر الرؤيا17 عدد4:هؤلاء سيحاربون الخروف والخروف يغلبهم لأنه رب الأرباب وملك الملوك والذين معه مدعوون ومختارون ومؤمنون.<br />7- ولكني مؤمن بالله عز وجل الواحد الأحد الفرد الصمد الذي لم يلد ولم يولد ولم يكن له كفوا أحد ... مؤمن برسوله محمد بن عبد الله (سيد ولد آدم) ... والمسيح عيسى بن مريم عبد الله ورسوله وكلمته الذي لم يقتل ولم يصلب ولم يهان والذي لم يسجد إلا لله الواحد ولم يدعي أبدا أنه إلاه من دون الله ... وبكل الأنبياء والرسل المعصومون من الذنوب ... فلا إبراهيم عليه السلام زان كما يصفه البايبل ... ولا سليمان عليه السلام كافر كما ينعته البايبل ... ولا يعقوب عليه السلام صرع الإلاه وضربه كما يدعي البايبل ... ولا بنات لوط عليه السلام أسكرنه ثم ضاجعنه وأنجبن منه كما يفتري البايبل.<br />8- يعفيك من الرد أن تقدم إعتذارك عن تعليقيك (الاسلام في حاجه الي تعديل) و (إلي الاستاذ ابن الاسلام (التعليق الأول))<br />9- سبحانك اللهم وبحمدك ... أشهد أن لا إلاه إلا أنت ... أستغفرك وأتوب إليك"
