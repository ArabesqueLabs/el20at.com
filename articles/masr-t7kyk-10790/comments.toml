subject = "أخبط دى"
author = "محمد جمال الدين"
posted = "2008-12-24"
text = "واحد أتخنق من كتر ما بيذاكر ومش بيجيب مجموع .. وقرر أنه يألف كلمات على موسيقى أغنية \\\"أنا مهما كبرت صغير\\\"<br />وقال فيها ..<br />أنا مهما ذاكرت هدبلر .. أنا مهما ذاكرت حشيل .. مش ممكن يوم اتغير .. مش ممكن اجيب تقدير<br />هههههههههههههههههههههههههههههههههههه<br />فاقد الأمل خااااااالص<br />بس فعلاً مذاكرة الكافيهات و النوادى أحسن بكتير من البيت ولكن بشرط ..زى ما قال المهندس\\\"احمد حمدى\\\" انها تكون على سبيل التغيير مش على سبيل الدوام ."
