[[comments]]
order = 1
subject = "وماذا بعد النجاح ؟"
author = "بطة"
posted = "2008-12-25"
text = "ادى احنا سهرنا وذاكرنا واتنيلنا نجحنا وبتفوق كمان<br />واخرتها قاعدين فى البيت قدام التليفزيون بنقلب فى القنوات بطريقة مملة ونسهر فى البيت طول الليل وننام بالنهار علشان ما نشوفش احد<br />يعنى اية نجاح<br />يعنى اية سقوط<br />كلة زى بعضة فى البلد دى<br />الا اذا كان ابوك واصل - فالنجاح يعنى انك هتشتغل تانى يوم وظيفة محترمة"
archived = "2010-03-14"
