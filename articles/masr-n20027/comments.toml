[[comments]]
order = 1
subject = "بانجو"
text = "الصيادلة يولعوا بجاز وسخ ومطرح ما يحطوا رجليهم يحطوا راسهم<br />والسوقين بتوع المقطورات اللى عاملين اضراب فى ستين داهية مش مهم<br />كلة مش مهم<br />الا حاجة واحدة بس<br />العسكرى شاليط<br />ايوة العسكرى شاليط<br />انت فين يا شاليط"
archived = "2009-02-20"
capture_url = "https://web.archive.org/web/20090220151633/http://masr.20at.com:80/newArticle.php?sid=20027"

[[comments]]
order = 2
subject = "صباح الافيون"
author = "مش شرط"
text = "أيه يا عم يا بتاع البانجو ما تخليك محضر خير اومال<br />ناس وبتطالب بحقوقها .. أيه . نخرسهم يعنى ولا نعملهم ايه ؟<br />ولا انت علشان كدة كدة شكلك ضايع وبانجو وبتاع ... يبقى عايز الكل يضيع زيك<br />صباح الافيون المنعنش .. والقرش المموه .. والباكتة الجبلى<br />صباح الخييييييييييييييييييييييييييييييييير"
archived = "2009-02-20"
capture_url = "https://web.archive.org/web/20090220151633/http://masr.20at.com:80/newArticle.php?sid=20027"
