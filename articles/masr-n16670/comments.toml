[[comments]]
order = 3
subject = "رد على المعلق الثاني والثالث"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-07-23"
text = "مش الاهبل او العبيط ابقى مين<br />انت عارف نفسك انت مين<br />المعلق الثاني محمد صاحب مدونة لكم دماغكم ولي دماغي اللي فيها موضوع سلفية بدون معلم<br />ازاي جالك قلب تسيء للاسلام وانت اسمك محمد يا اخي وابوك اسمه حمدي<br />يا سلام<br />اكيد بتكسب فلوس من ورا الاساءة لدينك الاسلام<br />ما هو فيه جهات معادية للاسلام بتدفع كويس"
archived = "2008-07-31"
capture_url = "https://web.archive.org/web/20080731042922/http://masr.20at.com:80/newArticle.php?sid=16670"

