[[comments]]
order = 0
subject = "الفيس بوك وعرفناه ممكن نعرف يعني ايه سايت"
author = "مش البراء اشرف ولا شريف الدواخ"
posted = "2008-07-07"
text = "مين هما اصحابك فى السايت .. طب نفسك تتعرف على مين<br />السلام عليكم<br />يمكن الموضوع مش اول مره يتعمل و كان فيه موضوع او اكتر بنفس المعنى قبل كده<br />بس كل يوم بييجى اعضاء جديده على السايت و كل يوم بيبقى فيه صداقات جديده و كل يوم بيبقى نفسك تتعرف على حد يمكن مكنش يلفت انتباهك زمان<br />ولان المواضيع اللى بنفس المعنى ماتت لانها بقالها مده طويله و صعب يتعملها تنشيط لانها بتبقى مليانه ردود فاتت خلاص<br />انا حبيت اعمل تنشيط للموضوع ده تانى عشان تقرب الاعضاء اكتر من بعضها و اللى نفسه يعرف حد يقوله هنا من غير كسوف<br />مفيش كلام ارتباط الاعضاء بينها و بين بعض فى السايت هنا هو اكبر و اجمل حاجه موجوده فى المنتدى<br />و اللى يفرق السايت هنا عن اى منتدى تانى هو ترابط الاعضاء الغير عادى و الحب الكبير بين الاعضاء بنها و بين بعضها<br />و انا متأكد ان نسبه كبيره جدا من الناس فى السايت هنا اصدقاء جوه السايت و بره السايت<br />ده اللى مدى روح جميله و مخلى السايت هنا رقم واحد بين كل المنتديات<br />يلا قول مين هما اصحابك فى السايت القريبين منك و الناس اللى نفسك تتعرف عليهم سواء بنات او ولاد و مجتلكش فرصه تقولهم<br />الفرصه جتلك اهه براحتك بقه<br />شكر خاص لكريم Kean<br />لأنه صاحب فكره الموضوع ده و انا زى مقلت مجرد بعمل تنشيط للثريد بتاعه لانه مليان ردود و هيبقى صعب يدخل فيه الاعضاء الجديده"
archived = "2008-07-08"
capture_url = "https://web.archive.org/web/20080708112903/http://masr.20at.com:80/newArticle.php?sid=16670"

