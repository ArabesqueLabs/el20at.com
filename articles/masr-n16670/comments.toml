subject = "مش الأهبل ولا العبيط .. أبقى  مين؟"
author = "مش الأهبل ولا العبيط ... أبقى"
posted = "2008-07-08"
text = "مش الأهبل ولا العبيط<br />مش الأهطل ولا الأهوج<br />مش الأرعن ولا المسطول<br />.....أبقى مين؟<br />بعلق على الموضوعات ومش فاهم أي حاجة.. أبقى مين؟<br />مش عارف الفرق بين المنتدى والسايت.. أبقى مين؟"
archived = "2008-07-08"
capture_url = "https://web.archive.org/web/20080708112903/http://masr.20at.com:80/newArticle.php?sid=16670"

