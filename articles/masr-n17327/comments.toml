[[comments]]
order = 0
subject = "لنجمد نيران الحقد و الكراهية قبل ان تمتد لجميعنا و"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-24"
text = "هالنى ما احدثة الحريق المدمر الهاثل و الذى اطاح بمقر مجلس الشورى<br />الحمد للة الدمار لحق بالمقر و لم يلحق بالعقول المستنيرة التى تعمل من اجل مصر<br />و لنا عتاب على الاخوة المعارضين<br />الوطن ملك لنا جميعا معارضين و موئيدين معا<br />لا نجعل النيران تاكل قلوبنا و تعمى بصائرنا<br />مصر و طن واحد للجميع و ليست حكرا على احد؟"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060040/http://masr.20at.com:80/newArticle.php?sid=17327"

[[comments]]
order = 1
subject = "الشعب كلة هو المعارضة وفئة الوطنى المنقرض هى الحاك"
author = "شحرور الوادى"
posted = "2008-08-24"
text = "كل الشعب فرحان وعقبال ماتولع وتقع على رؤوس المفسدين<br />دمروا الزراعة والنتيجة طوابير العيش<br />دمروا الصناعة وباعوها والنتيجة البطالة فى كل بيت<br />دمروا التعليم واصبح خريج الجامعة امى<br />دمروا الصحة واصبحت المستشفيات خرابة<br />دمروزا الانسان المصرى فى اقسام الشرطة ومباحث امن الدولة والمحاكم العسكرية<br />26 سنة تدمير<br />لازم تخرب وتنهد على رؤوسهم جميعا<br />كل الشعب فرحان<br />ماعدا المنفعين من الوطنى"
archived = "2008-08-26"
capture_url = "https://web.archive.org/web/20080826060040/http://masr.20at.com:80/newArticle.php?sid=17327"
