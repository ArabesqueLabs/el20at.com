[[comments]]
order = 1
subject = "كشرى"
author = "رامى (أبو رؤية)"
posted = "2007-06-21"
text = "الموضوع إن الولادة كانت قيصرية، فذهبنا إلى المستشفى فى موعدنا و جلست مع زوجتى الحبيبة حتى دخلت إلى غرفة العمليات، وبعد دقائق وجدت إنى جالس بدون أن اجد شئ أعمله، فتذكرت إنى لم اتغدى بعد (وايضا بعد الولادة لن اجد الأكل اللذيذ الذى كان تحضره لى زوجتى) فقلت اخطف رجلى لأقرب بتاع كشرى ولم اقل لأحد من الموجودين بوجهتى ،، وكما عرفتم كان كشرى \"الباشا\" هو المكان المستهدف .... ضربت الطبق المتين (من غير تقلية) وعندما انهيته اتصلوا بي يسألون \"إنت فين، رباب خرجت\" ، قلت لهم \"جاى فى السكة\" ..على بال ما رحت لقيتها فاقت من البنج وكلهم بيدوروا عليا... بس كده... حبيت فى التعليق ده أوضح الموضوع علشان ماحدش يفتكر إنى الأب المفجوع ولا حاجة."
archived = "2010-03-14"
capture_url = ""

