[[comments]]
order = 1
subject = "حسنى باع مصر يا"
author = "ابو اسامة"
text = "انا عاوز اعرف اشمعنا لما عواد باع ارضه فضحوه مع انها تيجى كم فدان وباعها كمان لمصريين مش اجانب<br />وحسنى الاهبل عمال يبيع مصر بحالها ومحدش اتكلم ولا هو عواد الى وقع من قعر الأوفة .فوقوا يا بلد"
archived = "2007-06-25"
capture_url = "https://web.archive.org/web/20070625200142/http://masr.20at.com:80/newArticle.php?sid=10716"
