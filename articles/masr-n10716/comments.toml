text = "والله الريس شكله هنج فعلا ع راي الأخ :D<br />مش عيب ياريسنا تبيع ارضنا واحنا لسه فيها ,,<br />امال لما نطلع منها هتعمل فيها اييييييييييييييييه ؟؟؟<br />صدق اللي قال ,,<br />ربنا يرحم عبد الناصر عشان طلع الانجليز من مصر<br />ويرحم السادات عشان طلع اليهود من مصر<br />ويخلي حسني عشان طلع المصريين من مصر :D<br />سلام ,,<br />وفعلا الريس هنج :D"
