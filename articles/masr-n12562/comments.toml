order = 0
subject = "الى واحد من الناس"
text = "انا دخلت المدونة بتاعتك (واحد من الناس) ولقيت صور موبايلات مرسوم عليها صورة حسني مبارك وعليها علامة اكس ومكتوب لا لمبارك<br />وبتدعو الناس انهم يرفضوا مبارك بالموبايلات<br />وبحثت عن شخصيتك وجدتها شخصية مجهوله حتى حضرتك حاطط وش كده<br />تماما مثل واحد اسمه ابن بهية كان عامل نفس الشيء<br />ومجرد نصيحة طالما انت خايف تظهر شخصيتك يبقى ما لكش دعوة بالسكه دي<br />مش هو دا اللي احنا اتعلمناه كمصريين من احمد عرابي وسعد زغلول ومصطفى كامل<br />عايز تعارض مبارك اكشف عن شخصيتك واتبع القنوات الشرعية لمعارضة الحكم افضل<br />لان هذا الاسلوب فيه زعزعة لامن واستقرار البلد<br />وشكرا"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125205311/http://masr.20at.com:80/newArticle.php?sid=12562"
