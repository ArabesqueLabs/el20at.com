text = "ادخل اى شارع او اى حارة واقعد مع الناس<br />كم واحد فى الاسرة بيشتغل وكم واحد عطلان ومش لاقى ياكل<br />النسب بتاع الحكومة دى كلها كدب<br />الشعب كلة عاطل<br />واللى بيشتغل بيشتغل فى شغلة غير منتجة ولا تنفع الاقتصاد"
