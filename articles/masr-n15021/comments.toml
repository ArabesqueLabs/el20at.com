[[comments]]
order = 0
subject = "البرنامج الانتخابى لبلعوطيا"
author = "جمال عبد الغفار بدوى"
posted = "2008-04-04"
text = "مكتوب بالحجر الصلد<br />مخطوط فى ورق البردى<br />ان سياسة من يحكمنا<br />سمك لبن تمر هندى<br />اما الان فقد طورنا<br />من اسلوب الحكم الفردى<br />بفساد وصل للركب<br />وغلاء زاد عن الحد<br />سمك لبن تمر هندى<br />فسياستنا منذ الازل<br />لا تخضع ابدا للنقد<br />من عارضها فليتخير<br />ما بين السجن والوأد<br />سمك لبن تمر هندى<br />من ايد كل برامجنا<br />ينعم بالثروة والشهد<br />يسرق ما شاء ويحتكر<br />ليصعد فى رتب المجد<br />سمك لبن تمر هندى"
archived = "2008-04-06"
capture_url = "https://web.archive.org/web/20080406092722/http://masr.20at.com:80/newArticle.php?sid=15021"

