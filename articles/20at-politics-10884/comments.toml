text = "ممتاز وجزاكم الله خيرا وممكن توسع المعلومة شوية وتبين مراحل تحول السيطرة على الأرض في فلسطين المسلمة من قبل ثم بعد عام 17 وعد بلفور ثم عام 36 ثم 47 ثم مابعدها حتى عام النكسةعام 67 مع بيان السبب في ضياع الأرض في كل مرحلة من هذه المراحل حتى تنجلي الصورة ولو امكن الحصول على العهدة العمرية الخاصة بالأرض المقدسة في فلسطين يكون حاجة ممتازة جدا"
