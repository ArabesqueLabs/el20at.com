subject = "عنوان عجيب قوى"
author = "واحد صحفى وخلاص"
posted = "2007-06-03"
text = "مش ملاحظين التناقض \" الرخم \" بين العنوان والمحتوى ؟<br />العنوان بيوضح إن اللقاء مغلق - أقصد طبعا عنوان الخبر كما ورد فى المصرى اليوم - يعنى بين الإخوان وحماس ، ولكن اللى نفس الصحفى العبقرى كاتبه فى الخبر إنه حضره ( من نشطاء الأحزاب والمجتمع المدني كل من مجدي حسين، أمين عام حزب العمل المجمد، والفنان عبدالعزيز مخيون، وعبدالحليم قنديل، رئيس تحرير جريدة «الكرامة».) وعلى حد معلوماتى العبيطة لم يدخل هؤلاء الثلاثة الإخوان حتى الآن، ؟إلا لو كان الأخ اللى كاتب الخبر \" عزام أو محمد عبد الخالق \" أو الديسك بتاع المصرى اليوم عنده رأى تانى !!!!!!!!!"
