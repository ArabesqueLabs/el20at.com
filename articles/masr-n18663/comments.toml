[[comments]]
order = 0
subject = "مصطفى ماهر - هى الحركة اخترقت بمباحث امن الدولة"
author = "اناا"
text = "ولماذا لم تشاركوا ؟<br />الحكومة وبتوع الوطنى والسياسات كل يوم بيجتمعوا مع امريكا ومحدش بيقول حاجة<br />انتم هتخيبوا خيبة الاخوان<br />اجتمعوا مع امريكا ومع الجن الاحمر<br />وغيروا فى البلد"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195207/http://masr.20at.com:80/newArticle.php?sid=18663"

[[comments]]
order = 1
subject = "أية المشكلة"
author = "مصرى ألى الأبد"
text = "أيه ياشباب مشكلتنا مش مع الأمريكان دلوقتى لازم نركز على هدف التخلص من القذارة اللى بتحكم البلد واللى خليتنا من قائمة حثالة الدول. هم بيجتمعوا بالأمريكان أيه المانع أن نشرح أحنا للعالم كله حجم الفساد اللى سببوه للبلد.<br />حتى الحركات الشعبية لازم تشرح للعالم أهدافها وتنسق معاهم علشان يزيد الضغط عليهم. لازم نفضح حزب البلطجية وأسلحة الخراب الشامل. حزب السنج والبيروسول... أقبلوا الدعوة وأتكلوا على الله..."
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195207/http://masr.20at.com:80/newArticle.php?sid=18663"

[[comments]]
order = 2
subject = "موسوعة (الحركات) القرغة"
author = "مش كاتب"
text = "حركة شباب 6 ابريل<br />حركة كفاية<br />حركة شايفنكو<br />وكثير من (الحركات)<br />لذلك لازم المصريين يعملوا موسوعة اسمها موسوعة الحركات القرعة اللي هما شوية نصابين وحرامية اكتر من الحكومة واللي لو حكموا مصر حينهبوها اكتر ما هي منهوبة"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195207/http://masr.20at.com:80/newArticle.php?sid=18663"

[[comments]]
order = 3
subject = "الى المعلق اللى فوق"
author = "مش لاعب"
text = "هو فاضل حاجة يا حبيبى فى البلد تتنهب - بعد الوطنى ما شفط كل حاجة وطلعها برة البلد - وهى ضاعت فى الازمة العالمية وانهيار البورصات<br />ما كل اللى سرقوة راح وضاع<br />الجماعات دى هى الصوت الخافت لكرامة بلد - شبابها بيموت على شواطىء اوروبا وبينجلد فى السعودية وقاعد فى البيوت<br />ووزرائها بيتسولوا معونات دولية من القريب والبعيد"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195207/http://masr.20at.com:80/newArticle.php?sid=18663"

[[comments]]
order = 4
subject = "الى المعلق اللي فوق"
author = "مش كاتب"
text = "انت بتقول على الشباب انه بيتجلد في السعودية<br />والله اللي مش عجباه السعودية خليه قاعد في بلده<br />السعودية بتطبق العقوبات وفق احكام الشريعة الاسلامية يعني مثلا شارب الخمر يجلد الزاني غير المحصن يجلد وهكذا<br />الناس اللي انت بتقول عليهم بيتجلدوا في السعودية اكيد عملوا جرايم تستوجب الجلد<br />واللي مش عاجبه خليه قاعد في بلده ما لوش دعوة بالسعودية"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195207/http://masr.20at.com:80/newArticle.php?sid=18663"
