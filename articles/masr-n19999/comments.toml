subject = "و الله مافى حد عارف اى حاجة"
author = "ابو الشهيد الكردوز"
posted = "2009-02-27"
text = "الكلبيتكلم على الصيادلة ومحش عارف اللى فيها الا الى معاصرها كسبهم مجبور عليهم مش زى اى مشروع حر عادى بيسعروا على مزاجهم و اى اكسسوار لازم يكون غالى علشان مبيجيش جملة"
