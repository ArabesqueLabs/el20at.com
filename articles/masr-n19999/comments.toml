[[comments]]
order = 0
subject = "بعد ان باعت الدولة ممتلكاتها للاجانب والتى كانت تدر عائدا للخزانة لجأت لاسلوب الجباية لجمع فلوس من الناس وهو اسلوب فاشل سوف تصطدم الحكومة مع الشعب بسببة كثيرا"
text = "اسلوب جمع الجباية بتاع بطرس غالى اسلوب فاشل<br />الشعب عايش بالعافية ومصر مش امريكا يا بطرس علشان الناس تدفع ضرايب عن كل حاجة"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218023552/http://masr.20at.com:80/newArticle.php?sid=19999"

[[comments]]
order = 1
subject = "كس ام الاستغلال"
author = "مصراوى ابن البلد الحقيقى"
text = "لما الحكومة بقت منظمة وبدات تعمل شكل للبلد وقف الشعب اللى هوا برضة كان بيشتكى وبيقطع هدومة من الفقر ضد الحكومة بمساعدة الاخوان اعوان الشيطان اللى مولعينعها<br />فيها اية لو اتفرض ضرايب على اولاد الكلب الصيادلية دة نصهم بيبعوا مخدرات"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218023552/http://masr.20at.com:80/newArticle.php?sid=19999"

[[comments]]
order = 2
subject = "هى خربت يا همت يا بنتى - البلد خربت وغراب البين بطرس بينعق على تلها"
text = "غراب البين بطرس رمز الفقر وشكلة اللى يقطع الخميرة من البيت بينعق على تل خرابها<br />البلد خربت<br />خربت"
archived = "2009-02-18"
capture_url = "https://web.archive.org/web/20090218023552/http://masr.20at.com:80/newArticle.php?sid=19999"
