subject = "ينقصنا الاعتراف باهمية الانسان"
author = "لينا عبود"
posted = "2007-03-20"
text = "نحن بحاجة ماسة لإعادة برمجة اساسيات ثقافتنا وحضارتنا التي امتزجت حتى العفن بفضلات الغرب<br />لماذا لا يكون هدفنا الاساسي في ما نتبعه ان نخلق لانفسنا نوعا من الاحترام القوي للذات والوقار<br />ماذا نستفيد من التباهي والانخلاع عن اصولنا وجذورنا<br />ينقصنا الوعي بعمق مشاكل الشباب<br />وينقصنا البحث الدقيق والتقصي المهتم بايجاد الاسباب والاساليب المعالجه<br />بل ينقصنا الاعتراف باهمية الانسان كأنسان وليس كمخلوق ينتمي بشكل ما الى عالم الحيوان"
archived = "2010-03-14"
