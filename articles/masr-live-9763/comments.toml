[[comments]]
order = 2
subject = "اين كانت السنتكم و شجاعتكم عندما كان عبد الناصر او"
author = "ممدوح زكى زخارى/الاسكندرية_مصر"
posted = "2008-08-04"
text = "أضحك كثيرا شفقة على هئولاء من يتهاجمون على رئيس الدولة مبارك أو على أبن رئيس الدولة جمال؟<br />لماذا لم تضحكونى سابقا عندما كان عبد الناصر او السادات على رأس نظام الحكم رئيسأ للدولة؟<br />هل كان حقا يوجد منكم رجلا بمعنى الكلمة من الشجاعة كان يفكر او حتى يحلم بالتهجم بلا اى داع على راس الدولة فى ذلك الوقت؟<br />طبعا لا و مليون الف لا ؟لان النتيجة كانت معروفة و هى السجن الحربى و مقابر صحراء مدينة نصر كانت سوف تكون مثواكم الاخير انتم و اسركم بلا استثناء؟<br />ارجوكم لا تسيئو استخدام المناخ الديمقراطى و السياسى الذى تنعمون بة الان؟<br />ارجو منكم مقارنة بسيطة بين عبد الناصر و الساداتو مبارك؟<br />و ايضا تذكروا كيف كان صدام حسين يعامل اهل العراق؟<br />و الخيار لكم هل تريدو (صدام حسين أم مبارك)أيها الجبناء!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!؟<br />هيا أضحكونى كثيرا يا ذوى النفوس الضعيفة الحاقدة الجبانة!!!<br />أضحكونى أضحك اللة عليكم خلقة أيها الجبناء الخبثاء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "ردا على  ممدوح زكى"
author = "المهندس"
posted = "2008-08-09"
text = "يا عم دوحه انا مش عارف انتى بابا ذكى ولا غبى يا عم احنا ما شوفناش الا مبارك لا حضرنا السادات ولا سجن حربى ولا الكلام ده وبعدين انا بسمع من الناس الكبيرة ان فترة السادات كانت احسن من اللى احنا فيه وبغض النظر احنا فى النهارده مبارك ده ما شوفناش منه حاجة تسر وبعدين انته شكلك حزب وطنى . يا راجل ده الناس بطلع كارنيهات الحزب الوطنى علشان لو اتمسكوا فى لجنة او ظابط واقفهم يقولوله احنا حزب وطنى ولما مبارك بتاعك ده نظيف اوى كده كانوا بيزور فى الانتخابات ليه ادام الناس بتحبه وعوزاه وهى من الديموقراطية انه يفضل طول الفترة ديه فى الحكم ليه ما فيش حد بيفهم فى مصر الا هو ولا هى عزبة الحج وورثها . وانا كان احنا اللى خليناه كده بس احنا مش جبناء يا عم دوحه ونقدر نعمل حاجات كتير بس احنا خايفين على البلد ومش عيزينها تبقى العراق . ولازم نبدأ بنفسنا علشان نغير الوضع وهيكون. \"دولة الظلم ساعة ودولة الحق حتى قيام الساعة\""
archived = "2010-03-14"
