text = "السلام عليكم<br />اظن انها خطوة جيده بالنسبة لشباب و خطوة عملاقة للخليج فلا دوله عربيه فكرت في هذه المرحلة غيرهم و هاذا سبب من اباب تراجعنا و علينا ان نعمل على اختلاق الافكار الجديد التي تعمل على تحسين مظهرنا و منظرنا امام العالم العربي بل و العالم اجمع و شكرا و احي الخليج على هذه الخطوة الرائعه و ان شاء الله نكون افضل منهم"
