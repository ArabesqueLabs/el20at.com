[[comments]]
order = 9
subject = "عمرو بن العاص فاتح مصر"
author = "مش لازم"
text = "اعتنق عمرو بن العاص بن وائل بن هاشم بن سعد الإسلام في العام الثامن للهجرة، وأصبح واحدا من أجلاء الصحابة.<br />وقد أسند إليه النبي صلى الله عليه وسلم القيادة فى معركة ذات السلاسل التى اشترك فيها جمع من الصحابة منهم أبو بكر الصديق و عمر بن الخطاب. واحتفظ بمكانته خلال عصر الخلفاء الراشدين حيث قاد كثيرا من الفتوحات الإسلامية الكبرى.<br />وقد عينه الخليفة عمر بن الخطاب في قيادة الجيش الذي فتح مصر، وحكمها إلى أن عزله الخليفة عثمان، ثم ما لبث أن أعاده الخليفة معاوية، بعد أن قام بدور هام في النزاع بين معاوية وعلي. حيث ساعد عمرو بن العاص على تثبيت وتأمين الخلافة لمعاوية. وقد أسس أول عواصم مصر الإسلامية ( الفسطاط )، و بنى بها جامعه الشهير.<br />________________________________________________________________________________<br />لن يهدأ لنا بال حتى يعود عمر بن العاص حاكما لمصر من جديد ويعود النصارى اهل ذمه يدفعون الجزية عن يد وهم صاغرون"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093126/http://masr.20at.com:80/newArticle.php?sid=14087"

[[comments]]
order = 10
subject = "رداً على الشتامين واللعانين"
author = "مسلم"
text = "(لا ينهاكم الله عن الذين لم يقاتلوكم في الدين ولم يخرجوكم من دياركم أن تبروهم وتقسطوا اليهم إن الله يحب المقسطين)<br />ليس من قبيل البر والقسط أن نتهم الناس في أعراضهم بدون دليل أو وجه حق وليس من باب القسط أن نسب ونلعن. ومن يدعي حقا الولاء لهذا الدين فلينهج أوامرة فالله يكره الفحش والسوء."
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093126/http://masr.20at.com:80/newArticle.php?sid=14087"

