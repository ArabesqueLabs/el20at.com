[[comments]]
order = 12
subject = "توضيح"
author = "Sameh Shokry"
text = "أولا : وزارة الأوقاف لا تقوم لتمويل بناء أو ترميم الكنائس و لكنها فى المقايل تقوم بتمويل المساجد من نقود الضرائب التى يدفعها الجميع مسيحيين و مسلمين ..<br />ثانيا : الدولة قد سمحت بإنشاء هيئة لإدارة الأوقاف القبطية و هذه الهيئة غير ممولة من الدولة إطلاقا و لكنها تمول من أموال الكنيسة<br />ثالثا : رجال الأعمال المسيحيون يمولون مشروعات الكنيسة كما يمول رجال أعمال مسلمون مشروعات الجمعيات الشرعية و مشروعات المساجد و مبانيها<br />رابعا : أقباط المهجر - و حتى المتطرفون منهم - يمولون مشروعات الكنيسة كما يمول المتطرفون من بعض البلاد العربية مشروعات لبعض المساجد و بعض المشروعات الإسلامية الأخرى<br />خامسا : القساوسة غير محرومين من الجنس إطلاقا بل يحل لهم الزواج و معظمهم لديه أولاد إلا من إختار بإرادته هو و إمرأته معا أن يعيشا حياة البتولية بدون زواج<br />سادسا : البابا شنودة ترك العالم كله ليحيا مع الله فقط حياة عبادة و نسك كما هو الحال مع المتصوفين المسلمين<br />سابعا : الإختيار للبابوية لدينا نحن المسيحيون يعتبر تكليف إلهى لا يجوز الإعتذار عنه إطلاقا و إن كان يجوز عزل البابا إذا خالف تعاليم المسيحية صراحة سواء قولا أو فعلا فلا عصمة عندنا إلا لله وحده<br />ثامنا : مصادر تمويل الكنيسة من غير أقباط المهجر أو التبرعات أو العشور تكون من مشروعات الكنيسة التى تقوم بإنشائها لخدمة المجتمع إلى جانب تمويل الكنيسة و هى جميعهامشروعات رسمية تدفع الكنيسة ضرائب عنها للدولة<br />تاسعا : التبرع لوجه الله تعالى أمر محمود سواء فى المسيحية أو الإسلام أو اليهودية فلماذا نهاجمه هنا الآن ؟؟<br />عاشرا : جمال أسعد لا يمثل إلا نفسه و توصيفه كمفكر قبطى فيه الكثير من المغالطة و الكثير و الكثير من الشبهات خاصة أنه هو الوحيد الذى تستعين به أجهزة الإعلام عندما تريد مهاجمة المسيحية<br />حادى عشر : جمال أسعد تاريخه معروف و أسبابه التى تدفعه لهذه الأقوال معروفة جداااااا<br />ثانى عشر : لا أحد يستطيع أن ينكر أن هناك مخطئين مسيحيين من القساوسة كما أن هناك مخطئين مسلمين من الشيوخ الكبار فكلنا بشر<br />ثالث عشر : الخوض فى المسائل الشخصية يضعف المواقف ولا يقويها<br />أخيرا أشكر كل العقلاء الذين جاوبوا بتعقل و أشكر أيضا كل الذين قاموا بتجريحنا و شتيمتنا منفذا قول الإنجيل كما علمتنا الكنيسة : \" غير مجازين عن شر بشر أو عن شتيمة بشتيمة \" و متمسكا بقول الإنجيل : \"على قدر طاقتكم سالموا جميع البشر\"<br />شكرا لكم جميعا و آسف للإطالة"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093126/http://masr.20at.com:80/newArticle.php?sid=14087"
