[[comments]]
order = 4
subject = "وساوريس وغبريال وكبار رجال الاعمال النصارى"
author = "شاهد"
text = "ساوريس يتبرع لبناء الكنائس ويتشدد ايضا فى ان يجعل برج الكنيسة التى لا يزيد المصلين فيها عن عشرين نفر يجعل برج الكنيسة اعلى من اعلى اى مأذنة لاى جامع فى البلد<br />وفى قريتى ثلاث عائلات يعنى عددهم لا يزيد عن 25 نفر وكلهم من غير سكان القرية الاصليين والقرية تعدادها 20 الف نسمة ومع ذلك بنوا كنيسة البرج بتاعها اعلى من مأذنة الجوامع بتاع القرية كلها وبتكلفة اكتر من مليون جنية وكلها جاءت معونات من مصادر مشبوهة امثال سويرس وبتوع المهجر<br />وهناك خطة لنشر الكنائس بالهبل وفى جميع الامكنة حتى تلك التى ليس لها فيها نصارى بهدف تغيير معالم البلد"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093126/http://masr.20at.com:80/newArticle.php?sid=14087"

