order = 0
subject = "¡¡¡¡¡¡¡"
author = "omar"
text = "سؤال الي احمد المصري<br />الدوله لاتفرض اي ضريبه لمساعده الكنيسه<br />لايوجد مصري مسلم يتبرع للكنيسه بقرش<br />السؤال انت مالك ايه دخلك بالموضوع<br />عايز الناس تشتم في بعض<br />قلبك علي المسيحيين وفلوسهم<br />لو انت صحفي محترم اجبني بمنتهي الادب ماذا تريد من وراءموضوع لاناقه لك فيه ولاجمل"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093126/http://masr.20at.com:80/newArticle.php?sid=14087"

[[comments]]
order = 1
subject = "الشذوذ فى القساوسة عادى جدا"
author = "دكتور"
text = "اللة خلق الجهاز التناسلى فى الرجل لاستخدامة الاستخدام الطبيعى - يعنى علشان يمارس الجنس ودى سنة الحياة والجهاز مخلوق علشان كدة<br />يقوم القساوسة وبتوع الديانة الباطلة يوقفوا عمل الجهاز ويقول لك مفيش جواز لان يسوع متجوزش<br />واذا لم يستخدم الجهاز التناسلى عند الرجل لفترة طويلة - طبعا الغدة اللى هى غدة البروستاتا بتضخم وتضخم غدة البروستاتا اللى هى خلف فتحة الشرج بتاكل وعايزة تتحك علشان الانسان يهدى<br />يقوموا الشواذ يشتغلوا لان غدة البروستات متضخمة وبتاكلة وعايز يبردها<br />وطبعا لا نستعبد ان غدة ابوهم متورمة ما دام لا يعاشر النساء والحل الوحيد هو الشذوذ وبالمناسبة مش عيب عندهم<br />يبقى زعلان لية"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093126/http://masr.20at.com:80/newArticle.php?sid=14087"

[[comments]]
order = 2
subject = "البابا شنوده عنده هربس يا رجاله"
text = "القاهرة- قالت مصادر مقربة من البابا شنودة الثالث بابا الإسكندرية وبطريرك الكرازة المرقسية، إنه تقرر مد رحلة علاج البابا إلى ألمانيا للعلاج من آلام في العمود الفقري بالإضافة للعلاج من «الحزام الناري» الذي يعاني منه منذ عام 1998 والمعروف بـ «الهيربس» وهو فيروس يهاجم الأعصاب فيسبب ألماً مبرحاً وطفحاً جلدياً.<br />والجزء المصاب في جسد البابا هو منطقة البطن وتسمى الإصابة في هذه المنطقة «الحزام الناري» لأن الطفح الجلدي يصيب منطقة البطن في شكل يشبه الحزام"
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093126/http://masr.20at.com:80/newArticle.php?sid=14087"

