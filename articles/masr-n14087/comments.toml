[[comments]]
order = 6
subject = "اتقوا الله"
author = "محمد عامر"
text = "ياجماعه ياللى كاتبين تعليقات استهزائيه اتقوا الله, وملكمش دعوه بالنصارى,قال الله عز و جل لكم دينكم ولى دين, فياريت ياجماعه يبقى فيه تواد وتراحم بيننا وسيب النصارى يردوا على الموضوع لانه يخصهم هم وميخصناش فى اى شىء,<br />الباب شنوده هو قس كما يقال عليه محترم فملهاش لزوم التجريح فى الراجل خصوصااننا مش احنا اللى هنحاسبه .وبعدين هتفرحوا لما يطلع واحد مسيحى يشتم شيخ من مشايخنا.<br />ويامسحيين انا اسف جدا على اى حد كتب تعليق ساخر ........."
archived = "2008-02-08"
capture_url = "https://web.archive.org/web/20080208093126/http://masr.20at.com:80/newArticle.php?sid=14087"

