subject = "تصحيح الاسم"
author = "فتيحة سعيدي"
posted = "2009-01-31"
text = "السلام وعليكم ورحمة الله اشكركم جزيل الشكر عن هدا المجهود اقدم نفسي انا فتيحة سعيدي للاشارة ولست سعيدة سعيدي عضو نشيط في جمعية دم من اجل الحياة اشكركم لما قلته في حقي فهدا اقل واجب المناظر التي رايناها في القنوات العربية كانت جد مؤترة وليس في يدنا شيء نقدمه الا اغلى شيء وهو جزء منا الا وهو دمنا نفديهم بدمنا ولو كان الامكان بروحنا انا عايشت قصة صديق طبيب اسنان في فلسطين وهو يحكي ويبكي يقول لقد وصل دورنا لانه يعيش في رام الله انسان طموح ويريد ان يعيش يحب بلده ويفتخر بيها ويضحي بالغالي والنفيس من اجل بلده هدا نمودج من اهل فلسطين المحتلة الناس الشرفاء .شكرا جزيل وجزاكم الله كل خير"
