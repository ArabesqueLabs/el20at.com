subject = "تعليق سريع"
author = "فلسطينية وبكل فخر وعزة"
posted = "2008-05-16"
text = "شو هاد غريب كتير , والله يا المصرين ما بدكو هالعيشة بالاردن , إزا احنا الفلسطينية كرهنا العيشه بالاردن بدكو تيجو هون عنا<br />لا ضلوا ببلدكوا مصر أفضل الكو أشرفلك من العيشة بالاردن<br />كل الناس لهم وطن يعيشون فيه إلا نحن الفلسطينية لنا وطن حبيب غالي يعيش فينا<br />فلسطينية وبفتخر , اللي مش عاجبو ينتحر ويكتب على قبرو ميت من القهر حاولت اتحدى فلسطينية وما قدرتش"
