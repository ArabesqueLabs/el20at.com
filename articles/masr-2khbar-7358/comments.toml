subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2007-11-22"
text = "محصلش يا جماعة كلام الوزيرة ممكن يكون صح لكن مش دايما بيبقى الكلام كله صح انا بطلب من حضاراتكم النظر لكلامى بضقه واهمية انا ليا كفيل اردنى لكن لكى احصل على عقد العمل قال سجل اسمك بوزارة القوة العاملة والهجرة اللى برئاستها الوزيرة. قدمت طلبات للتسجيل. ولم احصل على تسجيل اسمى خالص وكل ما اتصل بالكفيل يرد على ما سجلتش اسمك ليييييييييييييييييييييييييييييييييييييييييييييييييييييه يا جماعه انا كرهت مصر مش كرهتها هيا لاء كرهت حكومتها اللى بتتكلم وبس مفيش صدق .انا مش لوحدى لاء اكيد فى كتيييييييييييير اوى زيي يا جماعه الاهتمام ارجوكم وفالاخر بيقولو الشباب بتسافر بطرق غير شرعية ما لازم يسافروا لان الشرعى بطئ جدااااااا جدا انا اسف دى حقيقه شكرا"
