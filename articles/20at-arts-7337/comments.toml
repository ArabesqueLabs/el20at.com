[[comments]]
order = 7
subject = "اصبتى يا دعاء"
author = "نيفين نيفى نوفا"
posted = "2007-10-19"
text = "المقال جميل جدا يا دعاء<br />فعلا يا جماعه كم من صنم مجدناه لم يكن يحمل طهر الصنم و العكس صحيح<br />كم من اناس ظلمهم التاريخ و براتهم الايام<br />وبغض النظر عن ان المسلسل حقق شهره واسعه و اخد جوايز تاليف و تمثيل و اخراج ففعلا اللى حصل للمللك فاروق حصل لناس كتير قاده و زعماء ظلمهم التاريخ<br />بالظبط زى كليوباترا اللى صورتها بعض كتب التاريخ على انها ليست الا غانيه و عشيقه لقيصر و من بعده انتونى مع العلم انها كانت من اعظم و اقوى الملكات على مر التاريخ و انها كانت رغم اصولها الرومانيه تعشق تراب مصر و ضحت ف سبيله بالكثير و كان موتها الاسطورى غايه ف السمو و الترفع بما يليق بملكه و ف النهايه هى انسانه لها اخطاءها برده<br />و كذللك فاروق اللى تم تشويهه فعلا بصوره ساذجه مبالغ فيها على مر الاعوام بفضل رجال ثوره يوليو العظماء اللى مجدناهم او مجدهم الاعلام و هم لا يستحقو ربع هذا المجد و على راسهم عبد الناصر صاحب نكبه هذا البلد لحد انهارده<br />و لو هنتكلم عن التدخل السورى تمثيلا و اخراجا ففعلا تيم الحسن بعد اداؤه الرائع ف نزار قبانى محدش ينكر ان الانسان ده فنان<br />كمان كان ليه دور بديع جدا ف مسلسل اسمه على طول الايام و الجميل ان المسلسل الرائع ده اخرجه رجل رائع اسمه حاتم على المخرج اللى فعلا تحس بصمته فى اى عمل بيخرجه<br />و بالمناسبه ان غير مقتنعه تماما بان ال mbc تنتج المسلسل ترويجا للملكيه<br />طيب ليه يعنى<br />مش محتاجين يعملو كده<br />فكره بعيده شويه"
archived = "2010-03-14"
