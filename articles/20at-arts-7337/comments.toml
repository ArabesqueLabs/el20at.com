text = "هذا هو التا ريخ الذي لم يقرائه احد وليس تاريخ ضباط يوليو الذين نسبوا كل شئ لهم وشوه الجميع فاروق والنحاس وفؤاد سراج والوفد وكل شئ حلو في مصر حتي وصلنا لم فيه نحن الان من جراء حك العسكر هذا هو النحاس والوفد وعلاقتهم بالملك فاروق والانجليز وليس كم كانو يدعون بان فاروق فاسد والنحاس عميل والوفد خائن فماذا نقول الان وماذا فعل عبد الناصر عندما فتح اتصلا مع امريكا والسادات عندم عقد السلام مع اسرائيل ولان التطبيع علي مصرعيه فحكم المكلكيه كان هناك ملك يملك ولا يحكم وكان صاحب الاغلبيع المنتخبه انتخا بحيقيقي هوالذي يحك كان هناك رئيس وزراء منتخب هو يحكم ام الان فلا رئيس الوزارء يحكم ولا نعملم من يملك ويحكم فاصبحنا دوله خلطبيته لا يوجد به سياسه ولا صحافه ولا احزاب ولا مواطنين بل مجرد عبيد زمااااااااااااااااان كان فيه سياسه حيقيقه ولا يهم ان كان الملك يفهم في السياسه ولا فاشل كان فيه حكومه بالمعني الحيقيقي هي التي تحكم وكان فيه دجيمقراطيه حيقيقيه وكان اللبلد ليه صحاب ودلوقتي احنا مش عارفين مين صحابه لان احنا مبقناش صحاب حاجه ولا نملك اي شئ وكل بيضحك عيل كله وليس صحيح ان المسلسل تمهيد لاي حد ولا تجميل لحد برافوووووووووووووووووو د/لميس ود/ يونان"
