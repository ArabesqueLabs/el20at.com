subject = "ليس حبا فى فاروق"
author = "adhm"
posted = "2007-10-15"
text = "مالذى يدفع قناة يمتلكها اخوة حرم الملك فهد الى انتاج مسلسل بتكلفة ضخمة الهدف منة غسيل وجة الملكية القبيح والترويج<br />لاساطير من نوع ان الملك فاروق كان حلو وكويس وما بيشربش الخمرة نهائى لانة مش بيحب طعمها وان<br />بولى<br />كان مجرد<br />طباخ غلبان كان فاروق بيعطف علية باعتبارة من المؤلفة قلوبهم واهو كلة بثوابة<br />وان مامة الملك فاروق كانت طاهرة وعفيفة وان أحمد باشا حسنين كان بيعلمها القران فى انصاص الليالى وفى عز البرد وبس<br />كان بيحضنها (بشهادة الملك فاروق نفسة ) علشان الدنيا برد وانة ابدا لم يكن بيسقى الورد<br />هل المقصود فعلا هو البحث عن حقيقة فاروق اخر ملوك مصر"
