subject = "كنت غبيةومشوشة وعمياء"
author = "عاشقة التاريخ"
posted = "2007-10-17"
text = "كل عام وانتم بخير لقد عاش فاروق ملكا ومات ملكا ولرحل عن مصر ملكا ايضا لقد شوه تاريخه تلك الثروة العشواء التى بنيت على الغش وةالكدب وتلفسق التهم بملكا ضباط رعاة جائعون تسلموا البلد وشوهوا تاريخا وادخلوا البلد في حقبة من الفساد وكبت الحريات بعد مرور اكثر من خمسين سنة على الثرورة ماذا قدمت لمصر ان المبادي التى قامت عليها هى مانعيشهوالان من القهر والفساد وتاكل الطبقة الوسطى كليا ان اخطأالملك فاروق لانه فقط كان دمقراطيا محبا لشعب لمصري لم يرضى ان يقتل واحد من شعب مصر من اجل العرش واكثر او ان تدخل الانجليز مصر من اجل العرش انى الان اقدم له التحية والاعتذار بعد مرورخمسين عام من الغفلة والغبااااااااااااااااء شكرا للدكتورة لميس على هدا المسلسل"
