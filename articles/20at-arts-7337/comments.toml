text = "اولا ازيك يا ريما ووحشانى و ازى البنوته<br />اسمحيلى احييكى على روحك المتحرره و موضوعيتك الجميله اللى افتقدنا ليها كلنا ف تعليقاتنا<br />انتى فعلا اكثرنا حياديه و موضوعيه<br />بس لو تفتكرى ف اتعليقى انا كنت معاكى ف حكايه ان المسلسل صوره بشر (الو)حسانت و سيئاته بس انا مقولتش الو علشان الو دى لهجه لبنانى تجنن<br />بس بالنسبه لموضوع عبد الناصر معلش يا ريما انا مش معاكى اصل انا محروقه منه جدا و لو تفتكرى حواراتى المطوله مع ابن بهيه الله يمسيه بالخير و الله وحشتنى تعليقاته<br />و يمكن الموقع كله شهد الحوارات دى و لاحظو انها مغيرتش فكرتنا احنا الاتنين كتير<br />و انا توجهى اللاناصرى معروف للموقع كله<br />عموما ناجل موضوع عبد الناصر ده لوقته نبقى نناقشه سوا<br />بوسيى البنوته"
