subject = "ضع عنوان التعليق"
author = "مصرية مغتربة"
posted = "2007-10-12"
text = "أنا ماقدرتش أشوف المسلسل كله لكن تابعت بعض حلقات منه وبجد حسيت ان أنا مش عايشة في سنة 2007 ولكن كأني عايشه في الحقبة الزمنية دي من كتر ما التصوير والاخراج رائع ، وأنا بصراحة من عشاق مسلسلات حاتم علي لان الراجل ده فعلا بيشتغل بجد ، يعني أنا متخيلية المسلسل ده لو كان انتاج واخراج مصري كان زمانه بقي مسخرة مش عشان المصري وحش لا لكن عشان المنتج بيركز علي النجم واجره وبينسي بقية المسلسل وعشان كده بيكون الانتاج ردئ والمسلسلات التاريخية المصرية مش بنتجح لنفس السبب فياريت ياخدوه المسلسل ده بداية ويغيروا كده والسنة الجاية نيجي نتكلم علي مسلسل مصري تاريخي علي مستوي راقي<br />ثانيا بالنسبة للملك فاروق فأنا شايفة إننا فينا عادة غريبة إننا بنحاول دايما نشوه صورة اللي قبلنا عشان نحسن من صورتنا لدرجة إنك لو روحت لدكتور اول جملة يقولهالك علي الدكتور الي قبله (اللي هو المفروض إنه زميله) مين الحمار اللي كتبلك علي الدوا ده !!!!!!<br />ياريت نقدر نصلح التاريخ عشان نشوف الواقع ونخطط للمستقبل صح<br />وعلي فكرة الملكية علي الاقل كانت واضحة وصريحة مش زي الجمهوملكية اللي احنا عايشيين فيها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "كل عام و أنتم بخير"
author = "alexomania"
posted = "2007-10-13"
text = "أولا كل عام و أنتم بخير بمناسبة العيد<br />ثانيا بالنسبة للدراما المصرية فأنا شايف إنها أحسن حالا من الأول بكتـــــــــــــــــــــــيــــــــــــــــر و إتغيرت للأفضل و نتمني إن ده يكون حالها بعد كده<br />أما بالنسبة للإخراج الأجنبي للمسلسلات المصرية أو إدخال أبطال أجانب في المسلسلات سواء كانوا سوريين أو غيرهم فده لا يقلل أبدا من شأن الدراما المصرية بل علي العكس يزيدها قوة و إمكانيات و خبرات طبعا<br />يعني السينيما الأمريكية مثلا لمن يتأمل حالها يجد إن أكتر من 1/2 من نجوم هوليوود أجانب بملامح لا تشبه الأمريكيين علي الإطلاق<br />و بالنسبة للممثل السوري أو المخرج السوري اللي بيشتغل في الدراما المصرية فده لأنه يري إن النجوم المصريين مثلا أعلي أجورا و شهرة و نجومية...... زي ما حصل لجمال سليمان بالضبط لما إشتغل في المسلسلات المصرية و عجبه الدور بعد كده :-)<br />ثالثا بقي بالنسبة للقصة ذات نفسها فأنا إنبهرت بالقصة لدرجة العشق<br />ببساطة الملك فاروق كان ملكا و لذلك كان التوريث شيء شرعي<br />في فترة الملك فاروق الصحافة المصرية وصلت لمستوي رهيب من التحرر و الديموقراطية بدليل إن الصحف كانت بتهاجمة و عادي يعني ماتعملتلهمش قضايا أمن دولة بتهمة بلبلة الرأي العام<br />في أيام الملك فاروق كانت الرأسمالية موجودة و متأصلة في المجتمع المصري و كان المجتمع perfect الفلاحين فلاحين و أصحاب المال معاهم ثرواتهم و الموظفين في الحكومة مرتباتهم محترمة و تشبع الإحتياجات و مصر لم تعاني وقتها من الغلاء ولا التضخم ولا الكلام الفاضي ده<br />الثروات كانت موزعة توزيعا عادلا و الأمن كان بحق مستتب في البلد(يا ريت محدش يعارض بعد كده علي أساس الأفلام القذرة اللي طلعت تمجد للثورة و تشوه المجتمع الملكي بأي طريقة و للأسف نجحت بطريقة أو بأخري)<br />و اللي مش مصدق يسأل أي حد من من عاصروا هذه الفترة و يعرف منه البلد كانت ماشية إزاي....<br />جت الثورة بقي بعد كده ...... لا ديموقراطية......سرقت الشعب بدعوي التأميم لمصلحته قال يعني الناس مش عارفة تدير رؤوس مالها بنفسها......سجون....تعذيب.....هزيمة....نكسة...... بس نجحت في حاجة إنها طلعت جيل بعد كده مش عارفين مصر قبل الثورة غير إن الفلاح كان بيتعذب من الباشا ..... و الفلوس كانت في إيد الباشا بس و الناس برة بيموتوا من الجوع و البرد<br />و عملت أيه الثورة؟؟؟؟؟ البلد دلوقتي رجعت رأسمالية تاني بس الفرق قبل الثورة الفلوس كانت ع أي حد لكن دلوقتي البلد كلها في أيد 8 بس (نبقي نعدهم مع بعض بعدين :-)"
archived = "2010-03-14"
