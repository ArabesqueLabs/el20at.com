subject = "مبلاش سطحية"
author = "ريما"
posted = "2007-10-19"
text = "انا مندهشة من الي بقراو...عشان مسلسل بقت الحقبلة الملكية روعة و بمبي وما شاء الله عليها؟ انا تابعت المسلسل و فعلا مسلسل رائع و موضوعي الى حد ما ... بس يا جماعة المسلسل ما برا فاروق من كل الاخطاء الي نسبت الو...ايوة كان طايش و بحب السهر و البصبصة على الستات و محدش يحكيلي هو كان براقص البنات بشكل مستفز لفريدة بحكم واجبات ملكية؟؟؟... بس هو حلاوة المسلسل انو بقدملنا فاروق كانسان طبيعي الو حسنات و سيئات..<br />بس المهم في الموضوع نعرف ليش قامت ثورة يوليو... لان فاروق كان بشرب و بسهر؟ لا... الدكتورة لميس جاوبت هالسؤال فاروق خسر عرشو لاسباب سياسية ... يعني الاخ سياسي فاشل ...اوكي حياتو الخاصة و فشلو في زواجو و مشاكلو مع والدتو هي الي تركتو ينجر راء اخطاء سياسية... فلنفرض ... هاد ما بخلي من المسؤولية و لا بنفي انو لازم يتحاسب...وما بخلي الثورة و عبد الناصر خونة و مجرمين بحق البلد... برضو هما كمان لهم حسناتهم و سياتهم... و بلاش سياسة يا ابيض يا اسود.. مفيش نظام بالمطلق يا اسود يا ابيض...و لا حتحكولي ان اقال اربع وزارات بزمن قياسي بحكمة سياسية فذة؟ولا حتنكرو انو على عهدو كان في معتقلات انجليزية ... يعني ما منعهاش ليش؟<br />انا بصراحة طلعت من المسلسل بقناعة انو الملك فاروق كان انسان طيب و محب لشعبو لاكن مذبذب و غير متحمل للمسؤولية و لولا حسنين باشا كان خسر عرشو من تاني سنة...<br />و بعدين هلا جمال عبد الناصر صار مجرم و معذب الشعب؟ يا سلاااااااااااااااااااااااااااااااااام<br />مش عارفة مين الي امم القناة و رفع السد العالي ...و خلا كل العرب تمشي ورا مصر و تعتبرها قلب الامة العربية.. انا ما بنزه فترة حكمو بس برضو دة كان عبد الناصر"
