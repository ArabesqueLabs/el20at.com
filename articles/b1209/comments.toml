text = "نصيحة لوجه الله الاحباش واقصد جماعة الشيخ العلامة الولي الصالح عبد الله الحبشي وأقول لكم لوكان في هذا الزمان علماء كالشافعي وابو حنيفة ومالك وأحمد لبينو للناس أن هذا الشيخ على حق ولكن وللأسف لم أجد في هذا الزمان أناس لايخافون في الله لومة لائم يأمرون بالمعروف وينهون عن المنكر الا من يتقي الله ومنهم جماعة الحبشي"
