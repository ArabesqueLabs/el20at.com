subject = "لطفا ارجو توجيهة الساتليت الخاص بك الى القمر الصنا"
author = "الانبا مكسيموس"
posted = "2008-09-09"
text = "يا زخاري انت انسان متناقض مع نفسك<br />انت انسان غير سوي<br />لانك بتسب في الجماعة المحظزرو اللي حظرتها الحكومة وبتدعو الى الالتزام بالدولة وقرارات الحكومة واولي الامر<br />طيب ما هو القسيس بتاع هذه القناة مشلوح من الكنيسة زي ما انت عارف يبقى هو كمان محظور وموبوء<br />يبقى اللي يدعي بالابتعاد عن الجماعة المحظورة<br />لا زم يبعد عن القسيس المشلوح المحظور<br />والقسيس دا كل اللي بيقولوا مردود عليه على النحو الثابت من التاريخ الاسلامي<br />الا وهو<br />1) نقرأ حال الجزيرة العربية قبل الاسلام ونشوف الناس دول كانوا عايشين ازاي واحوالهم المعيشية ايه<br />2) نقرأ السيرة النبوية ودتها 23 سنه ونعرف كيف غير سيدنا محمد النبي الرسول من هؤلاد الناس<br />3) نقرأ التاريخ الاسلامي وكيف انطلق سكان الجزيرة العربية اللي هما تلامذة النبي صلى الله عليه وسلم وفي اقل من 100 عام اصبحت الدولة من اسبانيا الى الهند<br />دا اول 100 سنه بس يا حضرت<br />واسيبك بقا تكمل قراءة التاريخ لتاني 100 سنه وتالت 100 سنه الى 1000 سنه<br />سلام يا حضرت وسلملي على زكريا بطرس"
archived = "2010-03-14"
capture_url = ""

