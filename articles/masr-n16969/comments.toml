author = "الانبا بيشوي"
posted = "2008-09-04"
text = "يا زخاري يا جرجس يا منافق يا كذاب يا محتال يا جبان يا حقير اقرأ اللي مكتوب على لسان الاقباط يا واطي<br />أرسل هذا التعليق بواسطة : الانبا بيشوي<br />لماذا بدأ اقباط مصر فى الهجرة فى عصر الرئيس جمال عبد الناصر ؟<br />بدأ الأقباط فى ترك وطنهم الغالى حينما أوصدت الدولة أمامهم سبل المعيشة الحرة فقد أخذلت القرارات الإشتراكية لعبد الناصر الأقباط فأمم شركاتهم وأستولى عليها كما أستولى على أراضيهم الزراعية وحتى كنيستهم أخذ أوقافها وأصبح الأقباط هم أو كنيستهم بلا سند للدعم ولما كان معظمهم من رجال الأعمال وكانوا يستوردون ويوردون ولهم علاقات بالشركات الأجنبية فكانت هذا الموجة الأولى للهجرة .. ويمكن تمييز ثلاث موجات للهجرة من مصر وموجه واحدة من السودان<br />الأولى : بعد القرارات الأشتراكية أثناء عبد الناصر .<br />الثانية : بعد مقتل السادات وإدخال النص القائل بأن الشريعة الإسلامية مصدر رئيسى للتشريع فى الماذة الثانية من دستور مصر .<br />الثالثة : بعد قيام أم الدولة والمؤسسات الحكومية فى مصر بمطاردة الأقباط والمسيحيين فى إجبارهم علىالإسلام وتعذيبهم فى السجون المصرية وتلفيق التهم لهم .<br />نظرة الدولة للمهاجرين في أيام جمال عبد الناصر<br />يقول القمص تادرس يعقوب ملطي فى كتاب بعنوان \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" البابا كيرلس السادس: العظيم فى البطاركة \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" كاد أن يغلق الرئيس عبد الناصر الباب على المصريين من جهة ذهابهم إلى أمريكا الشمالية وأستراليا، وكان الجهاز الحكومي المصري يتطلع إلى أي مهاجر ـ وكان معظمهم من المسيحيين ـ أنهم خونة. وكاد غالبية المهاجرين يقطعون الأمل حتى في زيارتهم إلى بلدهم المحبوب لديهم وهي مصر.<br />كان المهاجرون يخشون الذهاب إلى أية سفارة أو قنصلية مصرية أو أن يلتقوا بأحد المسئولين، ويبذلون كل الجهد نحو إخفاء عناوينهم لئلا يُساء إليهم أو إلى أقربائهم في مصر.<br />كانت الكنيسة في ذلك العصر بين حجري الرحى، فهي كنيسة وطنية تخضع بكل القلب للسلطة الزمنية، وتحمل كل حب وولاء لمصر، وفي نفس الوقت هي الأم التي لن تتجاهل أو تتخلى عن أولادها أينما وجدوا.<br />أما عن مدى اهتمام قداسة البابا بالمهاجرين فقد سبق لي نشر الجزء الأول من كتاب \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"الكنيسة في أرض المهجر\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"، وبمشيئة اللَّه سأقوم بنشر الجزء الثاني"
archived = "2010-03-14"
capture_url = ""

