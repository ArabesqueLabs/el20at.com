text = "الشخص اللى جبان و حتى خايف يكتب اسمة الحقيقى و عامل زى النسوان المومس الى بتستخبة ؟<br />بلاش كلام فارغ و خليك و اقعى اولا<br />طيب ممكن تعرفنى و تقولى ماذا فعلتم انتم يا عرب فقط خلال ال 100 سنة اللى فاتو؟<br />للاسف(اصبحتم أثر بعد عين!!!)<br />و بلاش تبقوا تهاجمون الديانات الاخرى و ذلك حتى لا تسمعوا ما انتم فى غنى عنة؟<br />و (اللى بيوتهم من زجاخ بلاش ترمى اسيادها بالطوب)؟<br />و انتهى الدرس يا غبى!!!<br />و متنساش تبوسلى الماما بتاعتك؟<br />و قول لها بابا زخارى انتى لسة و حشاه جدا جدا جدا؟<br />و يا ريت تطبقوا احاديث الرسول يا من تدعون الايمان ؟<br />(من ازى زميا فقد ازانى) حديث شريف و صحيح<br />اتعلموا الادب و بلاش تزموا الرسول يا مدعين الدين عن جهل و غباء<br />استغفروا و توبوا الى اللة فهو خير الراحمين!!!!(وكل سنة و انتم طيبين و بخير) رمضان كريم"
