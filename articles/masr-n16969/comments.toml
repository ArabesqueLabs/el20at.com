author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-05"
text = "لطفا ارجو توجيهة الساتليت الخاص بك الى القمر الصناعى(hotbired) و من ثم ابحث عن قناة تسمى (الحياه)؟ و حيث يوجد رجل دين مسيحى مصرى ارثوذوكسى يدعى القس(زكريا) اعتقد ان جميكم تعرفوة جيدا؟<br />رجل الدين المصرى المسيحى القبطى الارثوذوكسى يتكلم بايات القران الكريمو يستخدم كافة الاحاديث الصحيحة فى العقيدة الاسلامية للتوضيح لكم ما هى المسيحية؟بمعنى الكلمة الحقة؟؟<br />ارجوك المشاهدة و المتابعة و انا فى انتظار سماع كلمتكم النهائية؟؟؟؟؟؟؟؟؟!<br />باى عقيدة سوف تقتنع؟<br />و باى ديانة سوف تختار و تكون؟<br />ارجو ان تكون صادقا مع نفسك و زاتك فى مواجهة اللة فى الدنيا و فى الاخرة؟<br />(و اللى بيتة من زجاج لا يجب ان يرمى الناس بالطوب) مثل مصرى شعبى حقيقى! النار سوف تطول الجميع<br />و اللة المستعان"
