[[comments]]
order = 6
subject = "ملعونة الجماعة المحظورة اياها(الجماعة الموبوئة )"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-24"
text = "هل تقصد الجماعة اياها الموبوئة المحظورة و المسماة (الاخوان المسلمين)<br />الجماعة الى الدولة معلاها الادب و مقعداها زى الجزم جنب الحيط؟؟؟؟؟<br />ياخى مش الاول تتعلم جماعة الاخوان المسلمين لبس الجزم و بعدين يجوا يشرفونى و نشوف مين هيضرب مين بالجزمة<br />يا من تدغى نفسك و تنسب الى نفسك مكانة عالية بالمجتمع المتحضر و تعطى لنفسك اسم سامى الا هو(الانبا بيشوى)<br />بالمناسبة هل حقا تعلمتم لبس الجزم ام انكم حقا تعودتم على الضرب بالجزم يا جزم<br />و ربنا يحفظ لينا حبيب العادلى و زير الداخلية الرجل اللى عملكم نسوان تتخفوا جبناء تحت العبايات و النقاب<br />و اللة حبيب العادلى راجل و ابن راجل<br />اما انتو فانكم نسوان و لاد نسوان كلكم جبناء و معقدين و متخلفين<br />انتم و الشيطان وجهان قبيحان للتخلف و الدمار و الجهل و المعصية<br />وجهان لعملة و احدة اسمها (الجماعة المحظورة) عفوا اقصد(الجماعة الموبوئة)<br />جماعة التخلف و القتل و الدمار انها جماعة(الاخوان المسلمين)و العياذ باللة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "ياخى وا تيجوا تمسكوا حاجة تانى عندى و بعدين ابقوا"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-24"
text = "و اللةةةةةةةةةةةةةةةةةةةةةةةةةةةةةةةة انتم يا عبط و قتلة و جهلة و معقدين هتمسكوا الحكم؟ ها ها ها ها ها ها ها ها ها ها ها ها ها ها<br />و اللة العظيم دى تبقى احسن نكتة سمعتها<br />انا عندى اقتراح جميل جدا لجميعكم و انا و اثق من انكم سوف ترحبوا بية و هتحبوة كمان جدا جدا جدا<br />ما تيجوا تمسكوا حاجة عندى اولا و بعدين تعالوا امسكوا الحكم ازا قدرتم<br />(واتحدى) مع الاعتذار للسمنة اياها روابى<br />يا روابى الارهاب يا جماعة (الاخوان المسلمين)"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "يا ارتودكسي يا زبالة وروح اسأل الكاثوليك والبروتست"
posted = "2008-08-26"
text = "القسيس بتاعك اللي في الكنيسة لما تروحلوا وتاخد المدام معاك اللي اسمه برسوم المحرقي هو اللي حيمسكلك ويمسك للمدام بتاعت سيادتكم يا ارتودكسي يا زبالة<br />واذا ما كنتش مصدقني روح اسأل الكاثوليك قولهم ايه رأيكم في الارتودكس حيتفوا على طول با زبالة يا ابن الزبالة<br />يلا روح ودي المدام لبرسوم المحرقي علشان خاطر يغفرلهم ذنوبهم بالطريقة اللي انت عارفها<br />يلا يا ارتودكسي يا زبالة يا حسالة المسيحييين يا مخالف تعاليم المسيح يا اللي المسيح حيتبرأ منه"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 9
subject = "ايهما اضل برسوم المحرقى ام القتلة امثالكميا حثالة"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-28"
text = "حبيب عينى ننوس ماما الواد الملتحى المخنث الحاقد اياة<br />بزمتك مش برسوم العريان مسكاتة لك فيها من النعومة و الحلاوة و الانبساط اكثر لك بكثير من مسكات زعيمكم المخنث اياة زعيم جماعتكم اياها(الجماعة الموبؤئة)<br />ادعوك لقضاء و قت سعيد و اؤكد لك اننى سوف اكون معك ناعم و لطيف و تاكيدا لك على خوفك من ان تحما منى سفاحا ؟ فسوف استخدم معك اقراص الفياجرا الامريكية مضمونة الصنع و المفعول<br />و ايصا سوف استخدم معك العازل الطبى(العازل) كم تسمونة فى جماعتكم<br />و اقسم باللة لك انك سوف تكون فى مناى من احتمالات الحمل منى؟<br />و اتمنى ان لا تكون حامل و مصاب بالايدذ اى مرض (نقص المناعة)<br />اشتاق لك و اشتاق لماشرتكم ايها المخنثين دنيا و اخرة<br />لعنكم اللة ايها القتلة المفسدين فى الارض<br />ال(قال انكم سوف تمسكمون الحكم؟)<br />يا اهبل روح امسك حاجة جميلة تبسطك و تنفعك؟!"
archived = "2010-03-14"
capture_url = ""

