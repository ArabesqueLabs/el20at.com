text = "وكان الأنبا مكسيموس، الذي يرأس مجمعا مقدسا بحي المقطم شرق القاهرة، يوازي بطريريكية الأقباط الأرثوذكس في حي العباسية برئاسة البابا شنودة الثالث، قد فسر فى حديث لـ\"العربية.نت\" أسباب هذا القرار وتأثيراته المستقبلية على علاقات المسلمين والمسيحيين في مصر والعالم؛ لأنه حسب قوله بعدما تم ترسيمه أسقفا أصبحت له صلاحيات الإضافة لقداس الصلوات حسب استحساني، فهناك فقرة نصلي فيها من أجل فئات متعددة، تبدأ بالصلاة من أجل رئيس الأساقفة نفسه، ومن أجل القساوسة والطبيعة والوطن، استحسنت أن أضيف للفقرة التي نصلي فيها من أجل الوطن الذي نعيش فيه، صلاة من أجل المسلمين بالاسم، إلى جوار الصلاة من أجل طوائف المسيحيين"
