[[comments]]
order = 4
subject = "دعوك فقالو انة ثوجد قانون ينفذ فى مصر و اتحدى الجم"
author = "ممدوح زكى زخارى"
posted = "2008-08-02"
text = "الى متى سوف تظل مصر هكذا بلا قانون رادع؟<br />و قفت فى الشارع لارى بعينى كيف يطبق القانون و ياليتنى للاسف ما و قفت؟؟؟؟؟<br />لقد اكتشفت بعد طول انتظار و سنوات عديدة ان مصر قد انتهت و الى الابد حقا<br />كيف تريدون تطبيق القانون و ليس لديكم من مسئول يناط بة تنفيذ القانون<br />لا السادة الباشوات الحكام ضباط الشرطة اصحاب و اسياد هذا الوطن او البشوات الصغار امناء الشرطة او العبيد الغلابة مجندى و عساكر الشرطة؟متواجدين فى الشوارع لاداء عملهم الرسمى المناط بهم القيام بة<br />نرجو اسناد تنفيذ هذا القانون الى ضباط و جنود قواتنا المسلحة لبسط سطوة الدولة و القانون على المخالفين للقانون و مصادرة سيارات المخالفين طوال مدة ايقاف ترخيص السيارة المخالفة و تحميل هذة السارات طوال فترة العقوبة فى خدمة الوزارات المختلفة ؟<br />مصر حقا تحتاج البطش و العنف و الديكتاتورية فى تنفيذ القانون<br />و دعونا نجرب هذا الاقتراح و كلى ثقة من نجاح القانون اذا تم التنفيذ و التجربة حتى و لو لمدة سنة واحدة<br />للاسف نحن شعب(نخاف و لا نختش؟)"
archived = "2008-08-05"
capture_url = "https://web.archive.org/web/20080805200945/http://masr.20at.com:80/newArticle.php?sid=16969"

