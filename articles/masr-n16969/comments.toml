[[comments]]
order = 0
subject = "وصمة عار على جبين القضاء المصرى"
text = "عار على كل قاضى يجلس على منصة القضاء ويحكم بين الناس وهو يعلم ان القضاء اصبح وسيله قانونيه لاهل الحكم يبسطون سيطرتهم ونفوزهم بواسطة هذه المنصه التى كانت فىوم من الايام(مقدسه) ؟؟ لك الله يامصر"
archived = "2008-08-01"
capture_url = "https://web.archive.org/web/20080801111204/http://masr.20at.com:80/newArticle.php?sid=16969"

[[comments]]
order = 1
subject = "ضع عنوان التعليق"
author = "ماجده"
text = "ظللنا نتغنا بقوله قضاء مصر الشامخ لسنوات عديده و فوجئنا أننا نضحك على أنفسنا و خاصه بعد ه>ا الحكم المشين للقضاء و تالقضاه و لك الله يا مصر"
archived = "2008-08-01"
capture_url = "https://web.archive.org/web/20080801111204/http://masr.20at.com:80/newArticle.php?sid=16969"

[[comments]]
order = 2
subject = "قضاء منبطح لا امل فيه"
text = "حكم القضاء المصرى على ايمن نور بخمس سنوات فى قضية تزوير توكيلات ثم كانت الكارثه فى قضية اكياس الدم الفاسده وحكم البراءه للمجرم هانى سرور واعوانه والان جاءت الطامه الكبرى ببراءة السفاح ممدوح اسماعيل ورفاقه ؟؟؟؟ ايها القضاء المصرى عذراااا لم تعد عادلا ابدااااااااا ؟ ولك الله يامصر"
archived = "2008-08-01"
capture_url = "https://web.archive.org/web/20080801111204/http://masr.20at.com:80/newArticle.php?sid=16969"

