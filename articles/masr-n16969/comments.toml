text = "مثلما يقال انة يوجد المسيح الدجال<br />فانا اقول ايضا انة يوجد انبا بيشوى دجال ايضا؟<br />ازا ما كانتش مصر عجباك؟<br />اتفضل روح فى ستين داهية الباب يفوت جمل و حمار و خنزير زيك؟<br />انت يا حبيبى غير متدينو لا اقراء اية كتب دينية كمان<br />انا يا عمى صاحب سيجارة و كاس و بنت حلوة امورة موزةظ<br />ريح نفسك و احترم نفسك كمان؟<br />و كفاية مهاترات و نصائح بيزنطية يا غبى<br />و الف مليون طظ فيك و جاتك الف مليون ستين خيبةظ<br />بوسلى امك و حياة ابوك!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!؟"
