text = "اعلان الحرب علي الاديرة في مصر !!!!<br />بقلم: عصام نسيم<br />23 أبيب 1724 للشهداء - 30 يوليو 2008 ميلادية<br />لم تنتهي بعد ازمة الاعتداءت الوحشيه علي دير ابوفانا في المنيا حتي خرج علينا الجيش المصري الهمام بغزوة جديدة علي ممتلكات دير بطمس الواقع علي طريق مصر السويس والاعتداء ايضا علي اراضي يملكها الاقباط حول الدير وهدم ما بها والاستيلاء عليها ومنع الوصول اليها .<br />وفي حديث في منتهي الاهميه والخطوره نشره موقع نشرة الاخبار القبطيه لنيافة الانبا بطرس<br />http://coptic-news.net/index.html<br />اوضح فيه نيافته بان ما حدث حدث بامر مباشر من المشير طنطاوي للاستيلاء علي ممتلكات الدير والاقباط خاصة بعد ان ارتفع سعر الاراضي في هذه المنطقه الي اسعار فلكيه كذلك اوضح نيافته ان هذا الاعتداء امتداد لما حدث في دير ابو فانا وهو محاوله لتجريد الاديره من الاراضي التي تتملكها والاستيلاء عليها سواء من قبل الدوله او العربان او الاهالي .<br />وبالطبع هذا الاعتداء الرسمي علي الدير لم يكن الاول ولكن حدث من قبل اعتداء من قبل الجيش ايضا وذلك في عام 2004 بالهجوم علي الدير وتحطيم بوابته ومحاولة اغتيال نيافة الانبا بطرس كما صرح بنفسه في النشره وقد قتل شاب قبطي في هذه المحاوله وبالطبع انتهي الامر وذهب ولم يحاكم المجرمون علي هذه الجريمه وكيف يحاكم الجيش علي ما يفعله في بلد يحكمها الجيش !!!!<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />لما امك تروح تغفر يا زخاري انوعا تسبها لوحدها لحسن القساوسة دول بيعملوا حاجات وحشة في الستات<br />سلام يا زخاري"
