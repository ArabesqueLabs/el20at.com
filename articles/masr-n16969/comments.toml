[[comments]]
order = 11
subject = "حبيب ننوس عين ماما انا و اللة بروح كباريهات و ليس"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-28"
text = "يا خسارة نقبك جة على شونة<br />انا غير متزوج و لا اذهب الى اى كنائس<br />انا مبفرغ فقط للكباريهات و الاماكن اياها بتاعة الفرح و الهيصة و الانبساط<br />اما انتم يا بتوع الاجتماعات السرية اياها؟<br />نفسى اعرف مازا تفعلون فى الخفاء و الظلام<br />انا متاكد انكم بتعملون حاجات عيب تتقال ؟ حاجات قلها ابيحة يا ننوس عين ماما يا شوشو؟؟؟؟؟!<br />الحكومة المصرية اخطات عندما سمتكم (الجماعة المحظورة) المفروض يسموكم (الجماعة المخنثة) اة على الاقل تسميكم (الجماعة الابيحة)<br />و عيب يا حبيبى يابن ابى جهل<br />عغرب عن و خهى انى لا اريد ان انكحك؟!<br />افرنقعوا و اغربوا عن و جهى ايها السفحاء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 12
subject = "و عيب يا حبيبى يابن ابى جهل"
author = "الى زخاري"
posted = "2008-08-29"
text = "العنوان جزء من تعليقك يا زخاري<br />اولا ابو جهل كان كافر وقتلوه المسلمين في غززة بدر مش كده ولا ايه يا زخاري مش عارف<br />وبعدين لما هو ابو جهل وحش كده المسيح بتاعك غير الانجيل ليه وخلاه باللغة العربية<br />مش كده برضه يا زخاري مش انجيلك باللغة العربية<br />طالما العرب وحشين كده واحفاد ابو جهل المسيح بتاعك غيره ليه من اللغة الام فيه ثلاثة احتمالات<br />لغة سريالية او لغة ارامية او لغة عربية<br />هذه هي الثلاث احتمالات التي كتب بهاالانجيل الاول ما فيش روحية صحيحة عن اللغة الاولى للانجيل<br />لماذا احب المسيح اللغة العربية وكتب انجيله بها لتقرأه انت بلغة ابو جهل<br />ان ابم جهل انتصر عليك يا زخاري وافتح انجيلك حتى وشوف كده حتلاقي ابو جهل بيتكلم باللغة العربية يا زخاري<br />يلا روح يا زخاري افتح الانجيل واقرأه وقولنا ابو جهل قالكم ايه في الانجيل<br />يلا يا زخاري"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 13
subject = "انت ياهبل يا عبيط ياعبيط ياما عبط"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-30"
text = "انت مالك و مال المسيح<br />اللانجيل طكتب بجميع لغات العالم علشان الخهلة امثالك اللى موسخين العالم تقرائة و تتعلم منة و تستنير يا جاهل<br />و على فكرة النبى (محمد ابن عبد اللة )صلوات اللة علية<br />اوصاكم باهل الكتاب خيرا؟<br />تعرف لية يا ننوس عين ماما؟<br />علشان ان الانجيل كتاب مقدس و تعاليمة سامية سوف تنفعك دنيا و اخرة !!!!!!!!!!!!!!!!!!!!!!!!!!1<br />هذا ان عرفت كيف تقراء الانجيل بطريقة الناس المتعلمة و ليست الناس الخهلة امثالك اللى يعتقدون ان قرائة اية او مزمور خلاص اصبت و احد من اياهم اللى بتفتوا فى اللى متعرفوش لية؟<br />تعرف لية يا حبيبى؟<br />علشان انت و من على حاشيتكم عمى القاوب و عمى العيونو متخلفى العقول؟<br />(ليس كل ما قال يارب يا رب يدخل ملكوت السموات)؟ يا ريت تكون قد غهمت الدرس يا غبى؟؟؟؟؟"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 14
subject = "انت عبيط يا جاهل يا حفيد ابناء ابى جهل؟"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-30"
text = "حبيب ماما ننوس عبنهههههههههههههههههههههههههههههههههههههها<br />انت عبيط يا اجهل من دابة ظ<br />المسيح لم يكتب الانجيل؟<br />هذة الاناجيل الاربعة كتبت عن حياة السيد المسيح بعد صلبة و صعودة فعلا الى السماء؟<br />و كتبت بواسطة اربعة من تلاميذ السيد المسيح و هم على سبيل التذكرة يا اغبى خلق اللة يا دابة تسير على اربع قوائم؟<br />(مرقس الرسولى-يوحنا -بطرس-لوقا)<br />ارجو ان تكون قد اقتنعت بالحق<br />و ارجو قبل ان تفتكر نفسك علامة و خبير متمكن مطلع على شئون الاديان ان تقراء جيدا حيث انك من اللى يقولو عليهم(سكت دهرا و نطقت و كتبت كفرا)<br />(أسالوا اهل الذدر ان كنتم لا تعلمون؟) ياغبى و اجهل خلق اللة<br />و سلمى على ماما و جدك الخرف مهدى ابن عاكف! زعيم جماعتكم و العياز باللة المسماة(الجماعة المحظورة)<br />مع حبى و احترامى و تقديرى للحكومة المصرية ووزير داخليتها الراجل العادلى اللى خلاكم تتخفوا تحت العبائات و تتنقبوا يا جبناء و صنع منكم نسوان<br />اقراء جيدا قبل ما تكتب و ذلك خيرا لك من اظهار جهلكم المريع بالتاريخ و الدين يا مدعى الدين يا متاسلمين<br />الاسلام الحنيف منكم براء ايها الغباء<br />سلمى على الشيطان اللى و داكم فى مليون داهية و مصيبة يا و قود جهنم و بئس المصير"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 15
subject = "و لا الثورة ثورة رجال علمتكم ان تكونوا نساء ايها ا"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-30"
text = "يا حبيب عين ننوسة ماما<br />مساكين يا حبايبى المساكين<br />لم تستطيعوا طوال ال 56 سنة من عمر الثورة ما فعلتة بكم؟؟؟؟؟<br />انا بصراحة تربيت ان اكون مؤدب و متربى و استحى ان اقول (ماذا فعلا و حقيقى عملت فيكم عمايل غير مؤدبة و ابيحة خالص!خالص!!خالص!!!)<br />بس بصراحة الثورة ليها كل الحق ان تعمل الحاجات الكتيرة البيحة دى و ياكم؟<br />معلش الثورة ليها الحق و كل الحق لعمل اكثر من الحاجات قليلة الادب و الابيحة دى فيكم؟ هتعمل اية ما انتم ياما بوستم ايد و رجلين رجال الثورة علشان تعمل الاباحة معاكم؟ تعرف لية؟؟؟؟؟<br />انتم شواز و تحبوا الحاجات دى تتعمل معاكم لانكم اهل اللواط و الشواز جنسيا؟!!!!!!<br />(ازا لم تستحوا فاخلعوا ما شئتم)"
