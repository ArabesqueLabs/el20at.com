subject = "الله يكون في عون فلسطين ومجاهديها وحمساوييها وشرفا"
author = "محمد السيد"
posted = "2007-06-24"
text = "فعلا ... أشاوس الثقافة الوطنية في كل مكان يتباكون ويصرخون ويولون ....<br />فهم الآن يدعون خوفهم علي فلسطين ويهاجمون حماس و يتعاونون مع الخارج ....<br />في فلسطين ... في مصر .. في كل مكان ... الصوت بدأ يعلو تارة بالسب وتارة بالتخوين وتارة بالتخويف ...<br />فقيدك ... يوم جاء مع أوسلو وعرفات وفتح .. لم يأت .لكنه استبدل عمدا بدلا من حركة النضال والتحرير قبل أوسلو بحركة مسالمة هادئة متوائمة ... وبلغة أخري ... حركة ناسية متجاهلة مستسلمة ...<br />فقيدك وفقيدنا .... لم يعد بصدق مع من عاد يومها ...لكنهم أرادوا أن يصوروا لنا أنه عاد .. وأنهم يذكرونه ... وأن رمزيته تعني لهم شيء ..<br />من عادوا به في أوسلو ... هم من ضيعوه ونسوه وتجاهلوه ... من نراهم اليوم في فتح وفي الرئاسة وفي الإعلام الرسمي هم من نسوا الرمز وحقيقته ... هم من نسوا سنوت وسنوات من الجهاد والنضال ....<br />سيدي ....<br />عذرا ..فكل هؤلاء الأشاوس لا يتحركون إلا لمصلحة واحدة وهدف واحد .. وهم لم يهمهم الأمن المفقود في غزة من أيام ولن يهمهم كذلك الأمن المفقود الآن في الضفة ...<br />مايهمهم .. هم ... هم .... ولا أحد غيرهم .... ولن يسكتوا حتي يروا حماس والجهاد وكافة شعب فلسطين أسيرا محطما بائسا ... فتلك دعواهم ...<br />يارب ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \"بس مش كده يعني يا جدعان\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />www.mesh7askot.blogspot.com"
