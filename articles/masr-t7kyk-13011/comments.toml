text = "[quote name=\"انتم بتحلموا\"]ديك رومى اية وحمام محشى اية على الفطار<br />جوز الحمام ب 30 جنية<br />ودكر البط ب 100 جنية<br />اما الديك الرومى فلن يقل عن 300 جنية<br />انتم بتكتبوا لسكان مارينا<br />احنا ناس غلابة من الشعب العادى<br />بنفطر حتة لحمة وطبق شوربة لسان العصفور وطبق خضار وطبق ارز والحلو خشاف<br />انما الحمام المحشى والديوك الرومية فبيننا وبينها بعد المشرقين<br />خليكوا حلوين<br />اما السحور بتاعنا فدائما فووووووووووووووووووووووووول[/quote]<br />الفول أحسن سحور يا باشا<br />ورمضان مش شهر أكل ومحمر ومشمر وإنما شهر تقوى وزهد<br />أما الديوك دي فتبقى في العيد ان شاء الله (لو تمنها موجود)<br />ولو مش موجود، فالحمد لله ربنا رزقه لا يضل عن صاحبه أبدا ان شاء الله"
