author = "انتم بتحلموا"
posted = "2009-08-20"
text = "ديك رومى اية وحمام محشى اية على الفطار<br />جوز الحمام ب 30 جنية<br />ودكر البط ب 100 جنية<br />اما الديك الرومى فلن يقل عن 300 جنية<br />انتم بتكتبوا لسكان مارينا<br />احنا ناس غلابة من الشعب العادى<br />بنفطر حتة لحمة وطبق شوربة لسان العصفور وطبق خضار وطبق ارز والحلو خشاف<br />انما الحمام المحشى والديوك الرومية فبيننا وبينها بعد المشرقين<br />خليكوا حلوين<br />اما السحور بتاعنا فدائما فووووووووووووووووووووووووول"
archived = "2009-08-24"
capture_url = "https://web.archive.org/web/20090824203557/http://www.20at.com:80/masr/t7kyk/13011-2009-08-20-14-09-59.html"

