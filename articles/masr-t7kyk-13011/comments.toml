text = "السحور فعلا بيبقي فول وجبنه قريش ومفيش مانع نفطر ديك رومي او حمام ربنا بيرزق والحمد لله ربنا يرزق الجميع والسنه دي اللي مكلش ديك رومي يرزقة ربنا رمضان الجاي ان شاء الله ومحدش يبقي نفسه في حاجه يا رب<br />رمضان كريم عليكم"
