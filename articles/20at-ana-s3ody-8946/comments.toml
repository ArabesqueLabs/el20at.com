text = "السلام عليكم :<br />السعودية لها وضعها الخاص بين الدول , و اعتقد من منظوري الشخصي أن الفتوى لا تناسب حال المجتمع السعودي , بالرغم من رغبة الكثيرات في اصدار هذه الفتوى .<br />و اعجبني تعليق حسان التركي . فكل ما ذكره صحيح فنحن أمةُ ضحكت من جهلها الأمم .<br />مو شاطريين غيير على بعضينا ."
