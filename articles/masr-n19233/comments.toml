[[comments]]
order = 24
subject = ":(وَقُلْنَا مِنْ بَعْدِهِ لِبَنِي إِسْرائيلَ اسْكُنُوا الْأَرْضَ فَإِذَا جَاءَ وَعْدُ الْآخِرَةِ جِئْنَا بِكُمْ لَفِيفاً) (الإسراء:104)."
text = ":(وَقُلْنَا مِنْ بَعْدِهِ لِبَنِي إِسْرائيلَ اسْكُنُوا الْأَرْضَ فَإِذَا جَاءَ وَعْدُ الْآخِرَةِ جِئْنَا بِكُمْ لَفِيفاً) (الإسراء:104).<br />وكلمة لفيف تعني الشيء المجتمع والملتف من كل مكان و اللفيف؛ القوم يجتمعون من قبائل شتى ليس أصلهم واحدا، واللفيف ما اجتمع من الناس من قبائل شتى، واللفيف الجَمْع العظيم من أخلاط شتى فيهم الشريف والدنيء والمطيع والعاصي والقوي والضعيف[لسان العرب].<br />ولقد تحقق ما أخبر به الله سبحانه في القرآن الكريم"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

