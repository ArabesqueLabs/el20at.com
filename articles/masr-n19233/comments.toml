[[comments]]
order = 20
subject = "مهند يظهر في الفللوجه"
author = "مش كاتب"
posted = "2009-01-15"
text = "السيطرة على مدينة الفلوجة<br />سمح لسكان الفلوجة بالعودة إلى منازلهم في منتصف ديسمبر 2004 بعد اجراء تدقيقات تحليلية على العائدين حيث زود العائدون ببطاقات شخصية خاصة من قبل القوات الأمريكية. استنادا إلى تقارير القوات الأمريكية فان نصف البيوت في الفلوجة و يقدر عددها 39,000 منزل قد تعرضت إلى اضرار و استنادا على تقارير من شبكة ان بي سي (NBC) الأخبارية فان 9000 منزل قد دمر و قامت القوات الأمريكة قامت بتعويض 2,500 طلبات بالتعويض عن الأضرار من اصل 32,000 طلبا بالتعويض قدمه اهالي المدينة. منذ نوفمبر 2004 تشهد المدينة هدوءا نسبيا و انخفضت عدد الهجمات المسلحة على القوات الأمريكية علما ان هناك هجمات متفرقة بين الحين و الأخر يقوم بها بعض فصائل المقاومة العراقية وكانت ابرزها أحد العمليات لأستشهادية بواسطة سيارة مفخخة في 23 يونيو 2005 التي اودت بحياة 6 من المارينز واصابة 13 منهم."
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

