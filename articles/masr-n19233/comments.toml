subject = "يا جماعة الخير - اعطوا جيش الدفاع الاسرائيلى الفرص"
author = "عادل من الحزب الوطنى"
posted = "2009-01-15"
text = "مش حماس دى برضة اخوان<br />تبقوا زعلانين لية<br />اسرائيل بتساعدنا فى ضربهم<br />الاخوان عاملين مشاكل فى كل حتة وبيرفعوا الجزمة فى البرلمان وعاملين انفلات فى البلد<br />خليهم يتأدبوا شوية<br />ويبطلوا يلبسوا نسوانهم لثام اسمةالحجاب<br />خليهم يشربوا<br />قلوبنا معكم واللة يرعاكم"
archived = "2009-01-19"
