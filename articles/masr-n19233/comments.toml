text = "ازيك يا عادل وازي صحتك عامل ايه<br />بالله الاخ الفاضل امين لجنة السياسات بالحزب اخونا جمال مبارك هل علينا مرة وقال ان الدولة حتوزع اصولها على المواطنين بالاسهم<br />وبعدين انكفا على الخبر مجور<br />ممكن نعرف ايه اللي حصل<br />وليه موزعوش الاسهم على الناس<br />وسلملي على الضربة الجوية الاولى والتانية"
archived = "2009-01-19"
