[[comments]]
order = 11
subject = "الى المدعو مهند الذي يقول (تفسير القران تفسيرا غبي"
author = "اكتب اسمك هنا"
posted = "2009-01-13"
text = "يا ابني عيب عليك اللي انت بتقوله دا<br />الملك دا بتاع ربنا سبحانه وتعالى مش بتاعك انت<br />هو حر في ملكه يجيب اليهود يمشي اليهود ملكه وهو حر فيه<br />وبعدين التفسير الصحيح هو تفسير الشيخ الشعراوي والشيخ الشعراوي اخذ عن السلف عيب عليك لما تقول انه فلاح وبيجامل السادات<br />لان الشيخ الشعراوي منع من تفسير القران في ايام السادات لانه بيقول الحقيقة وذهب الى السعودية ليسجل الحلقات هناك<br />واليهود والنصارى اشتكوا واعترضوا على خواطر الشيخ الشعراوي في القران الكريم<br />وملخص الشيخ الشعراوي في تفسير هذه القضية<br />حتى اذا جاء وعد الاخرة جئنا بكم لفيفا ليسوئوا وجوهكم وليدخلوا المسجد كما دخلوه اول مرة<br />يعني هما جايين كلهم علشان خاطر المسلمين يسوئوا وجوههم<br />هذا ما قاله الشيخ الشعراوي<br />سلام يا مهند وسلملي على نور والف رحمة ونور على فضيلة الشيخ محمد متولي الشعراوي"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 12
subject = "الحكومة تنفذ سياسات اسرائيل فى سيناء لامر ما - ماه"
posted = "2009-01-13"
text = "قبل ان يموت السادات تم البدء فى مشروع ترعة السلام لتوصيل المياة الى سيناء لتعميرها ووضع اربعة ملايين انسان مصرى بداخلها كضرورة امنية لحمايتها وبناء قرى ومدن داخل سيناء<br />والحقيقة تبرعت حكومة الكويت وحكومة الامارات لبناء وفحت تلك الترعة<br />وطوال العشرين سنة الماضية لم يتم عمل شىء رغم وصول المياة الى سيناء<br />الناس بتركب على بعض فى الدلتا والصعيد ومدينة القاهرة امتدت الى قليوب واقتربت من السويس والاسماعيلية والتصقت القرى فى الدلتا بحيث انك تلاحظ تلامس البيوت بين القرى وكان الدلتا اصبحت قرية واحدة<br />لماذا تترك الحكومة كل سيناء خالية من البشر<br />فى الحقيقة موضوع مشبوة جدا<br />هل تتركها خالية لتسليمها الى اسرائيل وقت ان تريد اسرائيل ؟<br />لماذا فقدنا شبابنا فى تحرير سيناء سنة 73 وحاربنا من اجلها وتبهدلنا ؟<br />لماذا سيناء خالية من الناس ؟<br />على فكرة شريط غزة امتلىء بالبيوت ولم يعد هناك ارض داخل ارض غزة لبناء بيوت فهل اسرائيل ستعطيهم ارض من عندها ليبنوا بيوت عليها ام ماذا يصنعون ؟<br />هل تخطط اسرائيل لتهجير جزء من الغزاوية الى سيناء الفارغة من البشر بفعل حكومات الوطنى الرشيدة<br />اننى اشم رائحة قذرة ورائحة خيانة فى هذا الموضوع"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 13
subject = "الرئيس البطل صاحب الضربة الجوية يبذل اقصى مجهود من"
author = "عادل من الحزب الوطنى"
posted = "2009-01-13"
text = "الحزب الوطنى وقياداتة يقومون بعملهم خير قيام<br />والسيد الرئيس كل يوم بيقابل رؤساء ووزراء من خارج مصر لوقف اطلاق النار<br />والرئيس يبذل مجهودا خارقا ويواصل النهار بالليل لحل المشكلة<br />انما بتوع الكلام فكلامهم مفيش فية فايدة"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 14
subject = "قدرت المخابرات الاسرائيلية وايدتها المخابرات المصر"
author = "زعفران"
posted = "2009-01-13"
text = "صرح مصدر مسئول ان الطائرات الاسرائيلة تلقى بقنابل الكشرى على غزة وانة لا داعى لعقد اجتماع قمة عربية - هيناقشوا اية<br />وازاى هيعقدوا فى وش بعض ويشوفوا كل واحد الكرمشة فى وش التانى<br />وبعدين يظهر الرؤساء وهم متحنطون وبيسندوهم وبيطلعوا الكلمة بطلوع الروح<br />القنابل الاسرائيلية بتسقط على رؤوس اهل غزة الكشرى والملاعق فميش داعى للاستعجال لحين ورود تعليمات اخرى من امريكا<br />وخلوا الغزاوية يستمتعوا بأكل الكشرى لغاية امريكا ما تقول كفاية اكل انتم زورتم اشربوا كولا بقى"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 15
subject = "تأملات فى ايام سنين الحرب وسنين السلام"
author = "ابو النورس"
posted = "2009-01-13"
text = "هناك حديث شريف كانوا يدرسونة لنا زمان فى المدارس - تذكرتة مع حرب غزة<br />هذا الحديث يقول<br />ما ترك قوم الجهاد الا عمهم اللة تعالى بالعذاب<br />حينما كانت مصر تحارب<br />لم تكن هناك طوابير خبز<br />ولا طوابير بوتاجاز<br />ولا بطالة<br />ولا فقر<br />كانت مصر شامخة<br />لها كرامة<br />يحترمها الكبير والصغير<br />اما بعد استسلام كامب ديفيد والسلام<br />فالفقر<br />البطالة<br />انهيار التعليم والخدمات الصحية<br />انتشار الموت الوبائى بامراض فيروسات الكبد والفشل الكلوى والسرطانات<br />انتشار الفساد<br />ما ترك قوم الجهاد الا وعمهم اللة تعالى بالعذاب<br />فبشراكم يا اهل غزة<br />بعد النصر ستنزل عليكم الخيرات من رب العباد<br />انتم فى رباط"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

