[[comments]]
order = 1
subject = "قال لى التركى - كل العرب خونة"
author = "قابلت مهند"
posted = "2009-01-11"
text = "قابلت احد الاتراك فى احد المعارض<br />كان المعرض يبيع بعض الملابس الجاهزة التركية الفاخرة والتى لها سمعتها فى العالم العربى<br />بعد ان تعرفنا<br />قال لى<br />نحن فى تركيا نعتبر كل العرب خونة<br />سألتة لية<br />قال<br />عرض اليهود على السلطان عبد الحميد ان يسددوا ديونة ويدفعون لة مبالغ طائلة مقابل السماح لليهود بالهجرة الى فلسطين - ورفض الرجل باباء وشمم وعزة<br />ولجأ الانجليز عن طريق الجاسوس لورنس ان يجند العرب الخونة امثال الشريف حسين واولادة فكون جيشا من البدو ليحارب الاتراك بالتعاون مع الانجليز والجنرال اللمبى لطرد الاتراك من فلسطين والشام<br />وسقطت فلسطين تحت الاحتلال الانجليزى سنة 1914 وتم طرد الاتراك<br />وتحت حكم الانجليز جاء وعد بلفور وتكوين الدولة اليهودية<br />لو لم يخون العرب الاتراك لظل الاتراك فى فلسطين ولما قامت اسرائيل<br />ولكنهم الخونة<br />وحينما يعود الاتراك فمرحبا بهم<br />ومرحبا بهم فى مصر ايضا<br />فتحت حكم اسرة محمد على شافت مصر اسعد ايامها<br />وحينما حكم العسكر مصر جاعت واهينت ووقفت فى الطوابير تتسول<br />اين الامير احمد فؤاد الوريث الشرعى لحكم مصر ؟<br />متى يعود الاتراك لنرتاح من الخيانة"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

