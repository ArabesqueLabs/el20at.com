[[comments]]
order = 18
subject = "اصبروا شوية الحزب يتقدم بخطوات ثابتة وعدم انفعال ل"
author = "عادل من الحزب الوطنى"
posted = "2009-01-14"
text = "السيد الرئيس<br />والسيد رئيس لجنة السياسات الوطنى المخلص جمال مبارك<br />والسيدة الاولى التى تدعم الهلال الاحمر<br />لا ينامون الليل فى سبيل حل المشكلة وايقاف اطلاق النار<br />فقط هم يعطون المقاومة الفلسطينية فرصة لتسديد ضربات قاتلة لاسرائيل وينتقمون منها على حصارهم<br />دعوا المقاومة تعمل<br />والحزب ورائها وكل جماهير شعبنا<br />واتركوا اسرائيل تخبط دماغها فى الحائط الصلب اللى هو المقاومة<br />ولا تسمعوا لكلام المغرضين<br />الحزب الوطنى هو حزب الاغلبية وهو عارف مصلحة الجماهير فين<br />ومصلحة المواطن اولا<br />احنا حالنا زى الفل<br />والشعب فى حالة انتعاش وعندة موبيلات كتير ويمكن اكتر من السعودية والامارات"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

