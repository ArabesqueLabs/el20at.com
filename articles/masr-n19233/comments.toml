[[comments]]
order = 3
subject = "الى الحمار اللي فوق (المعلق السابق)"
author = "مش حمار ولا طور"
posted = "2009-01-12"
text = "خونه ايه واتراك ايه يا حمار يا جاهل<br />تدفق اليهود على فلسطين من علامات الفارقة ليوم القيامه<br />الم تقرأ قول الله تعالى<br />(حتى اذا جاء وعد الاخرة جئنا بكم لفيفا)<br />وحياة امك انت وهو اقرأوا كويس وبلاش شغل العيال الجهلة دا<br />لفيفا دي معناها كل اليهود اللي في الدنيا<br />يعني اليهود 15 مليون<br />وصل منهم 6 مليون يهودي وناقص 9 مليون<br />يا حمار<br />القرأن صادق<br />والحرب الحقيقية بين المسلمين واليهود ستبدأ بعد ان يكتمل عددهم كلهم في فلسطين<br />بلاش بقا شغل الحمير دا واقرأوا"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 4
subject = "نفسير القران تفسيرا  غبيا يخدم اسرائيل وقيامها واس"
author = "مهند"
posted = "2009-01-12"
text = "لفيفا اية يا ابن ال<br />كلام القران يتكلم عن الماضى وتجمع اليهود فى فلسطين وتدميرهم على يد بختنصر العراقى واخذ اليهود جميعا اسرى فيما يعرف بالسبى البابلى وقد تم فى هذة الحرب تدمير بيت المقدس تدميرا<br />القران لا ينجم ولا يقرا الغيب انة يقرر الواقع الذى حدث<br />والكلام الذى تقولة سبق ان قالة شيخ فلاح اسمة الشعراوى لمداهنة السادات وكسب شعبية لمعاهدة كامب دافيد وان اسرائيل واقع ويجب قبولة والنوم فى العسل ونترك الامر كلة للة ليدمر عنا دولة اسرائيل<br />ننام نحن واللة سيدمرهم لفيفا - لفيفا - لفيفا<br />لماذا لم ينام المسلمون ويتركون اللة يدمر المشركون فى بدر وفى احد وفى غزوة الاحزاب لفيفا لفيفا ؟<br />انت ابن (((((((((((((((( صهيونى وتفكيرك صهيونى"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 5
subject = "بعد خروج اليهود من مصر وشق البحر ودخولهم سيناء مع"
author = "واحد من الناس"
posted = "2009-01-12"
text = "من بعد موسى - جمع اللة اليهود فى فلسطين<br />ثم تم تدميرهم واسرهم جميعا ونقلهم الى بابل فيما يعرف بالسبى البابلى<br />ثم عودتهم مرة اخرى الى القدس<br />ثم معادتهم للمسيح<br />ثم التية الثانى وتشردهم فى الكرة الارضية<br />هناك تفاسير لاهوتية يؤيدها المسيحيين وتعطى اسرائيل قوة كبيرة فى الدول المسيحية وهى ان عودة المسيح ترتبط بقيام دولة اسرائيل - ولا بد لليهود من ان يتجمعوا مرة ثانية فى فلسطين وينزل عليهم السيد المسيح لهدايتهم وتحويلهم الى المسيحية - لا اعتقادهم ان المسيح صلب ولم يكمل رسالتة وعندما يعود سيكمل رسالتة بهداية خراف بنى اسرائيل الضالة التى هى رسالة المسيح الاصلية حيث كان المسيح يهودى وولد لاسرة يهودية<br />اسرائيل نبؤة توراتية فى الانجيل لعودة المسيح المصلوب لاستكمال رسالتة<br />اذن الغرب المسيحى يعتبر قيام اسرائيل والمحافظة عليها ضد الاوباش العرب والمسلمين هو تمهيد لنزول المسيح والحرب بين المسيح الدجال والمسيح وتحويل اشرار الشرق الاوسط كلة الى ديانة المسيح<br />تلك كلها تخاريف<br />المسيح سيعود للدعوة للاسلام هكذا يقول المسلمون<br />وكلها اراء وهمية فى نظرى<br />اذ لا ديانة ولا رسالة بعد رسالة محمد"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 6
subject = "الى المعلق السابق واحد من الناس"
author = "مش كاتب"
posted = "2009-01-12"
text = "يا اخي الانبياء الدين عند الله الاسلام<br />وكل الانبياء جاءم يدعون الى الاسلام<br />والانبياء كلهم دعواهم واحدة<br />والمسيح جاء يدعو الى الاسلام وقال ومبشرا برسول يأتي من بعدي اسمه احمد<br />وقال النبي محمد صلى الله عليه وسلم خير ما قلته انا والنبيين من قبلي لا اله الا اله<br />فما المانع ان يأتي المسيح مرة اخرى ليقول للمسيحيين ان لا الا اله الله وانه ليس باله"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 7
subject = "ذهب ابو الغيط الى استنبول للاستعانة بالباب العالى"
author = "شحبور"
posted = "2009-01-12"
text = "من الذى ادخل تركيا فى قضايا المنطقة<br />الوزير ابو الغيطان هو اللى راح يستعين بهم<br />وبعدين اتوا<br />وقبلهم جائتنا مسلسلاتهم فى اختراق ثقافى مطلوب<br />نحن من غير الباب العالى اطفال - ولما كنا مع الباب العالى كان لنا احترامنا<br />نفع باية قرار الامم المتحدة<br />اللى بينفع الشعوب هو القوة والقوات المسلحة - انما قرارات الامم المتحدة فليس لها اى قيمة<br />وبما ان الحرب على غزة زى بقية الحروب قبل كدة تعتمد على القوات الجوية زراع اسرائيل الطويلة<br />فمطلوب للشعوب العربية<br />مطلوب اليوم قبل بكرة<br />تقوية سلاح الدفاع الجوى وصواريخ الدفاع الجوى<br />لن يكون ولن تسمح امريكا لشعوب العرب الحصول على طيارات بنفس قوة اسرائيل ابدا والشعوب العربية تحت رحمة قاذفات الصواريخ الاسرائيلية<br />علينا ان نجوع ونشترى سلاح للدفاع الجوى<br />علينا ان نبحث عن لواء بطل زى اللواء محمد على فهمى بطل حائط الصواريخ فى حرب 73 ليصنع لنا حائط صواريخ جديد وقوى ويغطى كل شبر فى مصر<br />اظهرت حرب غزة لنا اشياء كثيرة<br />تعلموا يا عرب<br />اشتروا بجزء من المليارات اللى فى بنوك اوروبا سلاح دفاع جوى رادع ضد طيارات اسرائيل<br />الدفاع الجوى اهم من الاكل او من الشرب"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203841/http://masr.20at.com:80/newArticle.php?sid=19233"

[[comments]]
order = 8
subject = ":(وَقُلْنَا مِنْ بَعْدِهِ لِبَنِي إِسْرائيلَ اسْكُ"
posted = "2009-01-12"
text = ":sad:وَقُلْنَا مِنْ بَعْدِهِ لِبَنِي إِسْرائيلَ اسْكُنُوا الْأَرْضَ فَإِذَا جَاءَ وَعْدُ الْآخِرَةِ جِئْنَا بِكُمْ لَفِيفاً) (الإسراء:104).<br />وكلمة لفيف تعني الشيء المجتمع والملتف من كل مكان و اللفيف؛ القوم يجتمعون من قبائل شتى ليس أصلهم واحدا، واللفيف ما اجتمع من الناس من قبائل شتى، واللفيف الجَمْع العظيم من أخلاط شتى فيهم الشريف والدنيء والمطيع والعاصي والقوي والضعيف[لسان العرب].<br />ولقد تحقق ما أخبر به الله سبحانه في القرآن الكريم"
archived = "2010-03-14"
capture_url = ""

