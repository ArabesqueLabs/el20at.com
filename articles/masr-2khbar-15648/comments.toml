author = "البرنامج الانتخابى"
posted = "2010-03-08"
text = "ما هو الرئيس كارينجا بتاع جزر المفقوعين قال فى برنامج الانتخاب بتاعة انة لازم يوفر ازمة تكون موجودة فى طول ولايتة - فمرة ازمة خبز - ومرة ازمة بوتاجاز - ومرة ازمة بنزين - ومرة ازمة ديزل وهكذا دواليك بحيث يكون الشعب فى رخاء وانسجام وانبساط وبكرة فية ازمة اسمنت وبعد شهرين ازمة حديد<br />كلة حسب البرنامج الانتخابى للرئيس كارينجا وعلى المفقوع مرارتهم ان يسفوا التراب"
archived = "2010-03-14"
