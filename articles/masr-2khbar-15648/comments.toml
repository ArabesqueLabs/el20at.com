author = "البلد مشلولة"
posted = "2010-03-08"
text = "النهاردة لم اذهب الى الشغل<br />الميكروباصات اللى بتشتغل بالسولار واقفة لعدم وجود سولار<br />والاتوبيسات بتاع العاشر نصفها واقف<br />والناس واقفة فى المواقف والمحطات بتكلم نفسها<br />فين الادارة فى البلد دى<br />صدقونى النظام دة فاشل وعايز الاستئصال مش المرارة بس - دة كلة يستحق الاستئصال<br />يخرب بيت ام دى حكومة<br />فين بتوع الكلام فى التليفزيونات<br />فين الفقى<br />وفين جهاد عودة اغبى واحد فى مصر<br />وفين الواد الابرص السفيف ابو وش عامل زى العرسة اللى اسمة مجدى الدقاق<br />فين ممتاز القط بتاع حكمة سيادتة<br />فين اوباش النظام<br />ولاد الكلب"
archived = "2010-03-14"
