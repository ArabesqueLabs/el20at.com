text = "الله يحمي السيد هنية من كل شر وقادة حماس كلهم لانهم رافعين راسنا بدفاعهم عن الشعب الفلسطيني المستضعف<br />دواااااعتي لهم بالصبر والتجلد ونحن معاهم بدعواتنا لهم والدعم المعنوي والمادي والله يقدرنا نقوم بالواجب تجاه اخواننا المسلمين"
