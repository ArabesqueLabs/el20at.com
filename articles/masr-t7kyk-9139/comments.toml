subject = "الفقر سبب كل مشاكل المجتمع"
author = "ش هو"
posted = "2008-05-21"
text = "الخيانات الزوجية<br />وانحراف البنات<br />كل دى مشاكل مجتمع ناتجة عن الفقر<br />فى الشارع اللى انا فية سرقوا شقة كاملة فى عز النهار - شياب صايع جابوا عربية نص نقل وحملوا الاجهزة الكهربية التلفزيون والتلاجة ودوات المطبخ ومشيوا وما حدش قال لهم بتعملوا اية<br />البلد اخلاقيا راحت فى الكازوزة"
