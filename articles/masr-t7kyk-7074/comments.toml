[[comments]]
order = 0
subject = "ريسنا متقال"
author = "واحدة صعيدية"
text = "ريسنا متقال ريس بحق وحقيق انما انتم ريسكم مين<br />حلاوتك يا متقال فى باريس بالربابة والبنات بيرقصوا حواليك<br />بس يا متقال يا صعيدى لو صبغت شنبك كرنبى مش اسود زى بتاعهم تبان شيك وحاجة اورجان خالص<br />برضة لايقة عليك كلمة ريس يا متقال وتشرف المريسة واللة"
archived = "2007-10-20"
capture_url = "https://web.archive.org/web/20071020015644/http://masr.20at.com:80/newArticle.php?sid=11448"

[[comments]]
order = 1
subject = "الله يرحمه"
author = "احمد رجب"
text = "كل الصعايدة فخورين بيه ولما كنا بنشوف له لقطات في التلفزيون وهو في اوروبا كنا بنحس بقدر كبير جدا من الاعتزاز ببلدنا<br />اعتقد انه امتداد لطه حسين والعقاد وغيرهم رغم اختلاف رسالته عالعموم لا نملك له الا الدعاء و..... الله يرحمه."
archived = "2007-10-20"
capture_url = "https://web.archive.org/web/20071020015644/http://masr.20at.com:80/newArticle.php?sid=11448"

[[comments]]
order = 2
subject = "بتاع كله"
author = "مستغرب"
text = "الأستاذه مروه ساعات تكتب عن عمر الجيزاوي وساعات عن بدل الرقص وساعات موضوع في الفن والمره دي مع متقال طب انا احترت نصنفك إيه بالظبط يعني صحفية في قسم إيه ولا إنتي ماشية بمبدأ بتاع كله"
archived = "2007-10-20"
capture_url = "https://web.archive.org/web/20071020015644/http://masr.20at.com:80/newArticle.php?sid=11448"

[[comments]]
order = 3
subject = "مقهور اوي"
author = "مقهور"
text = "هي مفيش غير مروة في الموقع ولا إية انا بس عايز افهم ايه ايللى هي مميزه في اوى كده مش مخلينكوا تنشروا لحد غيرها ايه هي بتدفعلكوا رشاوي ولا إية بس بصراحه مش عارف الرشاوي دي نوعها ايه بالظبط اصل انا مستبعد تكون رشاوى معنوية ولا مادية ممكن تكون مادية محسوسه ملموسه بس بصراحة ده ميخلينيش اقلل من قدرها كصحفية قلمها نضيف بس اتمنى ان زي ماتكون قلمها نضيف تكون اخلاقها نضيفة انا معرفهاش بس اعرفها من خلال كتابتها وهي شاطرة ونشطه وربنا يوفقها بس برضو في غيرها كتير يا ريت تبصوا للمحررين التانين اللي برضوا ممكن يكون فيهم الموهبه زيها وممكن احسن"
archived = "2007-10-20"
capture_url = "https://web.archive.org/web/20071020015644/http://masr.20at.com:80/newArticle.php?sid=11448"
