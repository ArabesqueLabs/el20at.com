subject = "نسوان خرعة"
author = "برضة لا"
posted = "2008-09-29"
text = "الحريم بتوعنا بقى خرع يا رجالة<br />الستات لازم يبقى عندها لياقة - لازم يمشوا شوية كل يوم على الاقل 3 كيلو مشى علشان يقدروا على الحمل والولادة ومناكفة الزوج بالليل ويعرفوا يصلوا - مش بعد الركعتين الاولتين يسلموا الراية البيضاء ويقعدوا فى الارض<br />بطلوا ركوب مواصلات وامشوا على رجليكم شوية<br />انما سنهم صغير وعندهم الضغط والسكر ونصف دستة امراض<br />احنا مش بنقول العبوا رياضة ولكن بنقول امشوا شوية يا ناس<br />سلام يا ابلة توتو"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190631/http://masr.20at.com:80/newArticle.php?sid=17765"

