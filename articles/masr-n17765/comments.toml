[[comments]]
order = 8
subject = "موضوع وجمهور"
author = "محمد الديسطي"
posted = "2008-10-04"
text = "السلام عليكم ورحمة الله وبركاته<br />موضوع جميل فعلا يا هبه ربنا يجازيكي خيرا ويبعدعنك اصحاب التعليقات السخيفه<br />مش عارف لو كنتي ضفتي الاداب اللي بتؤدي للخشوع كان هيكون في اضافة او لاء زي مثلا التفكير في لقاء الله عزوجل قبل الصلاة وكمان قراءة سورة الناس للاستعاذة والدعاء ان يهبنا الله الخشوع ثم الدخول في الصلاة فدعاء استفتاح الصلاة والاستعاذة ثم تكملة الصلاة واداء كل ركن علي انه هو وحده المطلوب بأن لانفكر في الركن التالي ...فقط ركن واحد وحين ننتهي منه نفكر في الركن التالي وهكذا حتي نكمل صلاتنا ربنا يمن علينا جميعا بالخشوع احنا وكل المسلمين<br />شكرا علي الموضوع وربنا يوفقك وكل المسلمين لما يحبه ويرضاه سلام الله عليكم ورحمته وبركاته"
archived = "2010-03-14"
capture_url = ""

