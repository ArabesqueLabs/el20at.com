posted = "2008-09-30"
text = "والله ياهبه حاجه جميله انك فعلا عايزة تشعرى بلذة الخشوع فى الصلاة وسيبك من كل الحكايات اللى انت كتبتيها وركزى فى مضمون مقالك وربنا هيوفقك وفى حاجه كمان الانسان مننا مش لازم بس يشعر بلذة الصلاة فى رمضان احنا بنصلى كل يوم ممكن نشعر بيها فى اى يوم وفى اى وقت للصلاه ومش لازم تستنى لرمضان القادم<br />اللهم تقبل منا اعمالنا كلها فى رمضان وبلغنا رمضان القادم واياكم آآآآمين يارب العالمين"
