[[comments]]
order = 3
subject = "الصحفي الشاطر والصحفي الخايب"
author = "مش ححبك"
text = "بالنسبة للموضوع كله متفبرك ما فيش فيه ولا كلمة واقعية<br />الاعلامي الشاطر لازم لما يكتب يكتب اشياء واقعية تدخل عقل القارىء يعني مثلا الفقرة دي<br />وتنتهي الركعة الرابعة لتسمع بعدها تعليقات مثل: \\\"هو الشيخ نسينا ولا إيه\\\"، \\\"ربنا يديه الصحة!\\\"، \\\"نفسي أناااااااام\\\"، \\\"آآآآآه يا ظهري\\\".<br />دي فقرة غير صحيحة لان اللي بيتعب على طول بيمشي فيه ناس بتمشي بعد ركعتين على طول وفيه ناس بتمشي بعد اربعة اللي بيزهق بيمشي على طول وانا الحمد لله بصلي سنين وعمري ما سمعت هذه العبارات اللي بيتعب ويزهق بياخد بعضه ويمشي على طول<br />انا سمعت حجات زي في في صلاة الجمعة لما الشيخ بيطول في الخطبة الناس بتتذمر لانها ما تقدرش تسيب الخطبة وتمشي<br />والفقرة دي متفبركة برضه<br />حدث مرة أن خرج ماس قوي من إحدى أعمدة الإنارة في حديقة المسجد أثناء صلاة التهجد وكادت النار أن تمسك في أوراق الشجر فصرخت المصليات وطبعا خرج معظمنا من الصلاة ولا أنكر أنني كنت منهن،<br />دي برضه حكاية متفبركه وغير صحيحة<br />الا اذا قلتيلنا المسجد ابو جنينه دا اسمه ايه ومكانه فين اصل القاهرة كلها ما فيهاش مسجد بجنينة<br />فيه حكاية احسن من دي حصلت فعلا واقعية واحنا بنصلي العصر ايام الزلزال الشهير بتاع القاهرة كنا بنصلي العصر واول ما بدأ الزلزال وكان الزلزال مخيف وشديد وكل المصلين هرعت الى خارج المسجد بلا استثناء<br />دي قصة واقعية حصلت فعلا لكن قصة الماس الكهربي دي غير واقعية على الاطلاق<br />معلش الماس الكهربي دا بيحصل في حرائق الحكومة يعني المسرح القومي ومجلس الشورى الحكومة قالت ماس كهربي اه مع الحكومة بيحصل<br />وبعدين يا ميروووو با بنت الحاج عبدالفضيل مش كل حاجه عسل عسل كده اقرئي الموضوع وافهميه يا ست ميرووووو هانم"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190631/http://masr.20at.com:80/newArticle.php?sid=17765"
