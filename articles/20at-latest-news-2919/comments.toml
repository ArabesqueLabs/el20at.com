subject = "سوري   هانم السلاح دار ... !!"
author = "الفتي الطائر"
text = "والله أنا مكنتش هادر عليكي لأسباب كثيرة لكن سوف أوضح بعض النقاط حتى يتثني لكي سيدتي الفاضلة التعرف على بعض الأمور :-<br />أولاً : تم القضاء على مبادئ الثورة المصرية والدستور المصري المنبثق عنها أي الثورة للقضاء على الاستعمار وإنشاء دولة مستقلة سياسياً واقتصادياً واجتماعياً عن التدخل الغربي في الشئون المصرية ورفع المواطن المصري من القاع إلى القمة وجعله مواطن مصري صرف لا يتبع السياسات التركية ولا السياسات الانجليزية ولا يتبع السياسات الأمريكية الإسرائيلية .<br />ولذلك شنت الحروب المتتالية على مصر وعلى المواطن المصري الممثل في ذلك الوقت الوطن العربي والقومية العربية ككل .<br />وبعد موت جمال عبد الناصر تم القضاء على مبادئ الثورة المصرية بحركة بهلوانيه حلزونية قذرة من السيد المبجل السادات باشا أفندي فقام بشيء اسمه ثورة التصحيح التي أظن أن المواطن المصري وبالأخص الشباب المصري الذي لا يعرف شيء عنها ولا على معاهدة كمب ديفيد إلى ألان شيء على الإطلاق .<br />1- القضاء على مجلس قيادة الثورة الذي كان المرجعية العلي لمصالح الوطن العربي والشعب المصري ،،، كما في إيران ألان هو مجلس تشخيص النظام !!<br />2- تغيير أولويات الدولة المصرية إقليمياً ودولياً وجعلها متقوقعة حول نفسها وإسقاط ريادتها بين الدول العربية والشرق الأوسط .<br />3- جعل الجيش المصري جيش استعراضي للاحتفالات والمنظرة بدلا أن يكون جيش عصري حديث ودرع للأمة العربية !!<br />4- سذاجة وغباء السادات وسلفه حسني باشا الطيار في التعامل مع التحديات والمتغيرات المفروضة عليه وجعله يخضع لها كلياً ،، وتجعله يتخلي عن التحدي والمواجهة التي كانت من صفات الزعيم عبد الناصر !!<br />5- إسالت للعاب السادات وسلفه حسني بيه القائد المفدى أمام التلويح بالمعونات المادية وجعله يتخلي عن بناء دولته القوية اقتصاديا وعسكريا واجتماعياً !!<br />6- ترسيخ الفكر الاستهلاكي بدل من الفكر الصناعي الذي كانت تدعوا إليه الثورة ، والذي تمخض عن هذا الفكر الاستهلاكي ،،،، عصر الانفتاح ؟ ومقولة من لا يصبح ثري في عصري فلاً يغتني طول عمره !!<br />7- فتح أبواب الدولة المصرية التي كانت حصن منيع على الأمريكان والإسرائيليين بسم الاستثمار والتطبيع للعبث بمقدرات ومستقبل الأمة المصرية والعربية ،،،، واستعبادها ككل !!<br />8- استئصال الفكر القومي من الأمة المصرية والعربية عن طريق تشويه صورة الزعيم الراحل وتشويه هذا الفكر العربي والمصري الصرف ،، وجعل المواطن المصري يتبني الفكر الأمريكي الأوروبي الذي يساعد على هدم المجتمع من الداخل بدل من شن الحروب مرة أخري !!<br />9- إطلاق الحركات الإسلامية التي كانت معتقلة من الزعيم الراحل وإعطائها حرية شكلية مؤقتة حتى يقال أن عصر السادات عصر الحريات ،، ولكن انقلب السحر على الساحر بتدخل الاستخبارات الأمريكية والإسرائيلية في عملية الاغتيال !!<br />10- اعتقال المفكرين المصريين ومن أبرزهم محمد حسنين هيكل لرفضه لشروط كمب ديفيد وثورة التصحيح والقضاء على مبادئ الثورة المجيدة !!<br />وهذا ما حدث أختي الكريمة فان المواطن المصري أصبح معتقل في بلدة ومهان في جميع الدول العربية والأوروبية بعد ما كان يشار إليه بالبنان في عصر الزعيم الراحل ويقال هذا مصري هذا ابن مصر ألان أصبح إنسان تافه داخل مصر وخارجها ،، ونظري أختي الكريمة إلى أبناء مصر وإخواننا الذين يموتون على الحدود المصرية الإسرائيلية ،،، وأبنائنا وآبائنا وأمهاتنا وممتلكاتنا التي تباع بأرخص الأسعار التي لا تدخل إلى جيوب المواطن ،،، وحريق القطارات والفوضى والفساد الاداري ،، وإعطاء السفارات المصرية ظهرها للمواطن المصري خارج مصر !!<br />وأصبح عملية التغريب تدخل على المواطن المصري بكل بساطة والدليل أن حضرتكم تستخدمين اللفاظ ليست عربية ولا حتى اللفاظ عرقية مصرية .<br />تقولين ..... سورى ..... هذا دليل على نجاح الفكر الساداتي الساذج العميل بغبائه لقد انتشرت في الشباب المصري بشكل كبير ....... الأمركة ....... واستخدم اللغة الانجليزية داخل المجتمع المصري العربي المسلم وأفكار آخرة طويلة مثل الحجاب وغيرها .<br />أما على كلمة حثالت فقد قلتها من غضبي على أمه كانت أعظم الأمم وألان أضحت أمه تضحك من جهلها الأمم ؟<br />فلاًَ تجدي بنت بلد أصيلة من بنات مصر يا ست هانم تقول سوري وتقول اوكيه ؟<br />وانصح شخصكم الكريم أن تستمعي لبرنامج تجربة حياة الذي يذاع على قنا الجزيرة يوم الخميس الساعة العاشرة مساءً ،،،، ويعاد الساعة الثانية من ظهر يوم الجمعة .<br />لعلك تدركين ما كان يدور في العالم ضد مصر وضد أي قوة حرة تحاول النهوض ببلدها وأبنائها ويكون لها شان محترم بين الأمم .<br />وأخيراً :<br />وأنا باؤل لربنا ميرسي أوي عشان أني مسري .........<br />اههههه اهههه"
archived = "2010-03-14"
