subject = "عاشت الثورة الخمينية"
author = "الفتي الطائر"
text = "عاشت الثورة الخمينية والقضاء على نفوذ البريطانيين والامريكان<br />فشلت الحكومات المصرية فالمحافظة على مبادء الثورة المصرية وتم القضاء عليها واستئصالها من الفكر المصري والعربي<br />بمعاهدة كمب ديفيد وثورة التصحيح<br />والان نجد ايران تحافظ على مبادء ثورتها المجيدة مع انهم شيعي ولكن يحافظون على مبادئهم اما نحن المصريون السنيون<br />حثالت الامم وحثالت البشر على وجه الارض"
