text = "المثل البلدى بتاع بلدنا بيقول حلم الجوعان - سوق عيش ( خبز )<br />اذا كان الشعب العراقى كلة فى حالة بطالة ومش لاقى شغل وبيطفش من البلد<br />يبقى المصريون هيلاقوا شغل<br />دة خبر عبيط او ساذج<br />وبعدين المصريين هيشتغلوا فية والعراق بقى خرابة ومفيش فلوس عندهم<br />طيب العراقيين ياخدوا النصف مليون عراقى اللى هاربين فى مصر"
