text = "عايزين الأول حقوقنا الحوالات الصفراء اللى الحكومة بتاعتنا أخذتها و شغلتها فى البنوك من سنة 89م و كل فترة تطلع الحكومة شوية تصريحات لزوم الفيلم أن قريبا هيتم صرف فلوس العراق الحوالات الصفراء و طبعا احنا أصبحنا عواجيز و يمكن نموت قبل مانصرف الفلوس دى دا طبعا اذا صرفنا حاجة طوال الحكومة بتاعتنا دى هى الموجوده مش هنصرف حاجة"
