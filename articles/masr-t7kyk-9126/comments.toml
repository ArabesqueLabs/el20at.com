subject = "فعلا نار العراق ولا جنة مصر"
author = "للاسف مصري"
posted = "2008-06-29"
text = "احلي حاجة ان في تقرير الفيديو كل اللي جايبنهم غلابة وكل واحد طالع يقول بلدي بلدي وتشوفه الصبح نازل الشغل طالع عينه ومشعلق في الاتوبيس وعمال يشاكل في ده ويتهزق من ده ويجي بردو يقولك بلدي بلدي ،، يا بشر يا جراد وانتشر دي مش بلدكم انتم مشوفتوش المواطنين في اي بلد عربي تاني حالهم ازي؟؟؟ صحيح ما هو اللي ميعرفش يقول عدس<br />عموما انا اتمني اسافر العراق وتغور مصر باللي فيها"
