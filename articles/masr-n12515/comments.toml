[[comments]]
order = 14
subject = "اشهر الصحفين ليسوا خريجى اعلام واشهر الدعاة ليسوا خريجى ازهر ..وشكرا"
author = "ابوصالح(صحفى ومش خريج اعلام)"
text = "الناس البتخلط الاوراق ببعض وتقول ان الصحافة والدين اخطر الملفات ولازم يكون الصحفى خريج اعلام اولا معظم الصحفيين الجامدين الموجودين ىفى البلد ليسوا خريجى اعلام والامثلة كثيرة جدااا زى مصطفى بكرى ووائل الابراشى وابراهيم نافع وسمير رجب وكمان نقيب الصحفيين مش خريج اعلام اعتقد ان هذا يكفى ثم ناتى لرجال الدين الاخ البيقول كدة غلط غلط طيب انت بزمتك عجبك مايحدث من شيوخ الازهر وكمان شيخ الازهر الذى يطالب بجلد الصحفيين وحلال الربا البنكى واصبح تابع لموسسة الرئاسة مهو خريج ازهر بس الفرق بينة وبين الشيخ الجليل وجدى غنيم شاسع جداا انة شيخ يقول الحق ولاشىء غير الحق رغم انة مش خريج ازهر كمان الشسخ محمد حسان خريج اعلام يعنى مش ازهر ولا محمد حسين يعقوب واخيرا ولا عمرو خالد رغم اختلاف البعض معة الا انة اصبح لة سمعة طيبة والشباب بتسمع لة عن ما تسمع لو واحد زى المفتى او سيخ الازهر صح ولا اية وبلاش نخلط الحابل بالنابل فليست هذة الدراسة التى ندرسها هى مقياس عملنا لاننا ببساطة ندرس شىء والحياة العملية شىء تانى خالص"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 15
subject = "داعية مختلف"
author = "ياسر أبو العلا"
text = "أبكيتنا يا طحاوى .. أول مرة أقرأ لك موضوع من غير فزلكة .. الانسيابية يا صاحبى والبساطة والمعلومة أهم ما يجذب القارئ.. عموما تحياتى على هذا الموضوع الجميل ..<br />الشيخ وجدى يا جماعة نموذج للداعية الناجح الذى يثير الغيظ والارتباك والحقد .. بس أكيد مش ليا ولا لمعظم الناس .. ولكن للذين تأكل الأحقاد قلوبهم ويثيرهم نجاح الناس ..<br />هو داعية يعرف الإسلام ويعرف كيف يوصله إلى قلوب الناس .. عرفته وسمعته منذ الصغر فوجدته قارئا جيدًا للتاريخ والأحداث ... تسمع منه السيرة فتنساب إلى قلبك ولا تخرج منها مرة أخرى .. تسمع منه السلوكيات فتتحول حياتك إلى تطبيق تلك السلوكيات من دون أن تدرى ..<br />أعتقد أن إخواننا الذين طردوه خسروا مرتين .. الأولى بأن رفضوا استمرار هذا الرجل فى آداء رسالته السامية إلى الناس ..<br />أما المرة الثانية فقد خسروا حين استجابوا لضغط بعض الذين يحسبون أن الدين \" شخط ونطر وزعيق وتجهم \" ..<br />خسارتهم كبيرة وخسارتنا أكبر .. نحن الذين طردناه من بين ظهرانينا لأنه يدعو إلى الله على بصيرة وعلى هدى ..<br />منهم لله اللى كانوا السبب ...."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 16
subject = "ردور على تعليقات الاخوة"
author = "مش لازم"
text = "الاخ عادل السيد<br />عندما ذكرت الازهر قلت الشيخ الشعراوي والشيخ محمد الغزالي ولم اقل المفتي وخلافه<br />الاخ احمد ابو صالح<br />وعندما تكلمت على الصحفيين لم يكن في نيتي ان اسيء لاحد ويعلم الله ولكن قلت رايي في قطاعين هامين وهما الاعلام والدين واسف يا اخ احمد ابو صالح<br />والى الاخ ياسر ابو العلا<br />انا بقول رأيي في قضية عامه وليس بيني وبين الاستاذ المحاسب وجدي غنيم اي عداء ولكن انا بتكلم عن قضية عامه وهي ان الداعية لازم يكون متخصص في اصول الدين والدليل على ذلك<br />لماذا طرد الاستاذ وجدي غنيم من البحرين ولماذا لم يطرد القرضاوي من قطر<br />الجواب: لعدم فقه وجدي غنيم لعدم تخصصه ولتخصص يوسف القرضاوي في الفقه<br />قضي الامر الذي فيه تستفتيان"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 17
subject = "ايه يا طحاوي انت دا"
text = "يا يا طحاوي انت دا<br />ايه اللي انت عامله دا<br />عيب عليك في السن دا<br />يطلع منك كل دا<br />اخوان بطعم السلف<br />هي المذاهب والاتجاهات يا طحاوي اصبحت ملح وفلفل وبهارات ولا ايه يا طحاوي<br />اخوان بطعم السلف وسلف بريحة الصوفية<br />دا مش طبيخ يا طحاوي<br />,وفيه موضوع تاني لما تكتب موضوع في مساحة للراي بالله يا طحاوي بلاش الصورة دي ارجوك غيرها لحسن جابتلي العصبي وكسرت بسببها اثنين كمبيوتر<br />سلام يا طحطح"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 18
subject = "الرؤوس الجهال"
author = "منقول"
text = "أشعر بمزيد من الخوف والقلق، حين أتصور أننا نعيش ذلك الواقع الذي أخبر عنه الرسول صلى الله عليه وسلم في حديثه hلصحيح حين قال:<br />\"إن الله لا يقبض العلم انتزاعًا ينتزعه من العباد، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يبق عالمًا اتخذ الناس رءوسًا جهالاً، فسئلوا فأفتوا بغير علم فضلوا وأضلوا\"،<br />صدق رسول الله صلى الله عليه وسلم<br />ذلك أن كثيرًا ممن يتصدون للعلم والفتوى والوعظ والإرشاد الديني والدعوة في زماننا، يصرون على التحليق خارج سرب الحقيقة والواقع الذي تعيشه الأمة بأسرها، متسلحين بعلم ناقص، وفقه سقيم، يجعلهم أهلاً للوصف النبوي الوارد في الحديث الشريف سالف الذكر، ويضع الأمة بهم على شفا جرف هار من الضلالة، التي تقود ضرورة إلى الهزيمة الماحقة في كل الميادين."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 19
subject = "احبائى فى البحرين"
author = "احمد"
text = "الشيخ وجدى له باع طويل فى نشر الخير وهداية الشباب واشاعة روح الحب والود بين الاسرة<br />وجدى غنيم اكرمه الله من دعا الى السلوك الاسلامى فى كل الاعمال<br />لاتجعلوا هذا الخير يخرج مطرودا من عندكم يااهل البحرين<br />ربما لو خرج مطرودا حل عليكم عقاب ربانى وانتم تعلمون الحديث(من عادى لى وليا)<br />ارجو من جلالة ملك البحرين والكل يعرف انه يحب دينه ورعيته ان لا يطرد هذا الخير من مملكته"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 20
subject = "[2.4.1] سؤال : ما هي أصول الدين و ما هو تعريفها ؟"
text = "جواب : إن الأسس التحتية لفكر الإنسان و سلوكه العقائدي و الفكري تسمى بأصول الدين ، و يراد بها الأمور التي ترتبط بعقيدة الإنسان و سلوكه الفكري و التي تبتني عليها فروع الدين التي ترتبط بأفعال الإنسان أي سلوكه العملي .<br />فما يرتبط من تعاليم و إرشادات بتوجيه الجانب النظري للإنسان ـ أي المعرفة و العقيدة ـ تسمى بأصول الدين ، و ما شرعت لتوجيه سلوك الإنسان العملي سميت بفروع الدين ، فالدين معرفة و عمل ، معرفة بأصول الدين ، و عمل بفروع الدين .<br />ثم إن المشهور بين علماء الكلام من الشيعة الإمامية الاثنا عشرية ، هو أن أصول الدين خمسة ، يجب أن يكون الاعتقاد بها عن طريق الدليل و البرهان ، و هي كالتالي :<br />الأول : التوحيد :<br />و هو يشمل جميع أقسام التوحيد ، فالمقصود منه توحيد الله سبحانه و تعالى في ذاته بنفي المثل و الشريك له ، و انه سبحانه بسيط لا جزء له ، كما يجب توحيده في صفاته و ذلك بالاعتقاد بكون صفاته كالعلم و القدرة و الإرادة و الحياة كلها عين ذاته سبحانه و تعالى ، كما يجب توحيده في الخالقية و الطاعة و العبودية و الحاكمية و الربوبية .<br />الثاني : العدل :<br />و هو : \" عدم فعل القبيح و عدم الإخلال بالواجب ، و عدم التكليف بما لا مصلحة فيه \" أي الاعتقاد بأن الله تعالى عادل غير ظالم لا يجور في حكمه و قضائه ، فهو سبحانه و تعالى منزّه عن فعل القبيح و الإخلال بالواجب ، و التكليف بما لا مصلحة فيه .<br />و يعتبر هذا الأصل في علم الكلام من الفوارق بين المعتزلة و الإمامية القائلين بالتحسين و التقبيح العقليين ، و بين الأشاعرة القائلين بالتحسين و التقبيح الشرعيين ، و لأهمية هذا الأصل و كونه من الفوارق فقد أفردت له الشيعة الإمامية مجالاً خاصاً و جعلته أصلا مستقلا رغم كونه من موضوعات الألوهية و يندرج تحت عنوان الصفات الثبوتية ، و لذا فقد سمي القائلين به بالعدلية .<br />الثالث : النبوة :<br />و هي الإنباء و الإخبار من حيث اللغة ، إلا أنها قيّدت شرعا بالإخبار و الإنباء عن الله تعالى ، على أن يكون المخبر أو المنبئ إنسانا ، و يسمى الإنسان المخبر أو المبلغ عن الله تعالى بـ \" النبي \" ، و النبي هو الإنسان المخبر عن الله تعالى بغير واسطة بشر .<br />و النبوة سفارة إلهية و خلافة ربانية يجعلها الله تعالى لمن ينتخبه و يختاره من عباده الصالحين و أوليائه الكاملين في إنسانيتهم ، فيرسلهم إلى سائر الناس لغاية إرشادهم إلى ما فيه منافعهم في الدنيا و الآخرة .<br />هذا و إن الله تعالى رحمة بعباده و لطفا بهم فقد أرسل إليهم الأنبياء و الرسل ، كي يرشدوا الناس إلى ما فيه خيرهم و صلاحهم ، فلولا إرسال الرسل و بعث الأنبياء ( عليهم السَّلام ) لما اهتدى الناس إلى أوليات الحياة لقصورهم و عدم إطلاعهم على جميع الحقائق و الأسرار مما يحيط بهم و بخاصة بما يرتبط بالإنسان نفسه في جميع مجالات حياته .<br />كيف يُعرَف النبي ؟<br />ثم إن النبوة تعرف بثلاثة أمور :<br />1. أن لا يقرر النبي ما يخالف العقل ، كالقول بأن الباري سبحانه أكثر من واحد .<br />2. أن تكون دعوة النبي إلى طاعة الله و الاحتراز عن معصيته .<br />3. أن تكون للنبي معجزة يُظهرها عقيب دعواه ، و يقيمها دليلاً على نبوته و ارتباطه بالله ، و يتحدى بها الناس .<br />الرابع : الإمامة :<br />و هي خلافة عن النبوة ، قائمة مقامها في المهام و الصلاحيات إلا في تلقي الوحي الإلهي بلا واسطة .<br />و الامامة أمر كان بعد كل نبي و بالذات بعد النبي المصطفى محمد بن عبد الله ( صلَّى الله عليه و آله ) لكونها لطفاً من الله تعالى ، إذ لا بُدَّ و إن يكون في كل عصر إمام هادٍ يخلف النبي في وظائفه من هداية البشر و إرشادهم إلى ما فيه الصلاح و الفلاح و السعادة في الدنيا و الآخرة ، فالإمامة استمرار للنبوة .<br />ثم إن الإمامة لا تكون إلا بالنص من الله تعالى على لسان النبي أو لسان الإمام الذي قبله ، و ليست هي بالاختيار و الانتخاب من قبل الناس .<br />هذا و إن الأئمة بعد النبي محمد ( صلَّى الله عليه و آله ) هم إثنا عشر إماما نصَّ عليهم النبي ( صلَّى الله عليه و آله ) و ذكرهم جميعا بأسمائهم بصورة كاملة .<br />الخامس : المعاد :<br />هو البعث يوم القيامة ، و يعني حشر الناس روحاً و جسداً و إعادتهم بعد الموت و في يوم موعود ، و ذلك لمحاسبتهم على ما فعلوه ليثيب المطيعين و يعذب العاصيين ، و هذا مما اتفقت عليه الشرائع السماوية و أخبر به الرسول الأمين محمد ( صلَّى الله عليه و آله ) و لا محيص للمسلم من الإيمان به كأصل من أصول الدين ، و كعقيدة أخبر بها القرآن الكريم من بعث و ثواب و عقاب و جنة و نعيم و نار و جحيم ."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 21
subject = "المواد الدراسية بكلية الدعوة واصول الدين للاهمية"
text = "ا• القرآن الكريم<br />• التفسير<br />• الحديث<br />• مصطلح الحديث<br />• التوحيد<br />• الأديان<br />• الفرق<br />• السيرة النبوية<br />• التاريخ الإسلامي<br />• حاضر العالم الإسلامي<br />• تاريخ المملكة العربية السعودية<br />اصول الدعوة وطرقها<br />تاريخ الدعوة<br />• الغزو الفكري<br />التربية الاسلامية•<br />طرق التدريس والتربية العملية<br />• المناهج التعليمية<br />• الوسائل التعليمية<br />• مناهج البحث<br />• علم النفس<br />• التنظيم والإدارة<br />• الفقه<br />• الفرائض<br />• أصول الفقه<br />• النحو<br />• الصرف<br />صدق رسول الله صلى الله عليه وسلم في حديثه<br />\"إن الله لا يقبض العلم انتزاعًا ينتزعه من العباد، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يبق عالمًا اتخذ الناس رءوسًا جهالاً، فسئلوا فأفتوا بغير علم فضلوا وأضلوا\"،"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 22
subject = "لا للمحاسبين (عمر خالد ووجدي غنيم) نعم للعلماء الشيخ الشعراوي ومحمد الغزالي"
text = "\"إن الله لا يقبض العلم انتزاعًا ينتزعه من العباد، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يبق عالمًا اتخذ الناس رءوسًا جهالاً، فسئلوا فأفتوا بغير علم فضلوا وأضلوا\"،<br />والله يعلم المفسد من المصلح<br />ويعلم الله اني لا اقصد الاساءة الى اي احد<br />وجزا الله خيرا الاخوة غير المتخصصين في الدعوه خوفهم على المسلمين"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 23
subject = "هل هم سلفيين حقا"
author = "وليد الباز"
text = "بداية إلى الأخ الذي يتحدث عن الشيخ الشعراوي والشيخ الغزالي وعن المحاسبين ومثل هذا الكلام<br />يا أخي<br />نحن بفضل الله نستطيع أن نميز بين العالم والجاهل<br />وإن الداعية الذي يوضع له القبول في الأرض من المستحيل أن يأتي هذا فراغ<br />وأنت ان قصرت الدعوة الى الله على من يحمل شهادة أزهرية<br />أولا صرت مبتدعا فإن هذا لم يقل به أحد لأن العلم متاح لأي أحد وأهل العلم يشهدون لبعضهم<br />ثانيا لكأنك تقول ان شيخ مثل الشيخ محمد حسان مثلا وشهادته بكالوريوس اعلام يمنع من الدعوة<br />ومثله كثير من المشايخ الدين اهتدى خلق كثير على أيديهم ممن يُشهد لهم بالعلم الجم والخلق العالي"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 24
subject = "الى الاستاذ وليد الباز"
text = "الموضوع يطول شرحه ولكن حأقول لحضرتك على حاجه حصلت بعد ضرب البرجين بتوع امريكا<br />اتفرجت على برنامج الاتجاه المعاكس وكان موضوع المناقشة ان التعليم الديني هو اللي بيسبب التطرف<br />فرد عليهم احد علماء الازهر وقالهم هو مين اللي ضرب البرجين<br />قالوا له تنظيم القاعدة<br />قال لهم مين رئيس التنظيم ومساعده<br />قالوا له ابن لادن وايمن الظواهري<br />فقال لهم ماذا يشتغلون قالوا له اسامه ابن لادن مهندس والظواهري طبيب<br />فقال لهم حل حدث من قبل ورأيتهم احد خريجي الازهر او احد من العلماء فعل مثل هذا او قتل حد او ضرب احد<br />فقالوا له<br />ومن هنا نستنتج ضرورة التخصص في الدعوى او الداعية لازم ان يكون متخصص<br />وانا لا ارى الدعوى الاسلامية اقل من المحاماه او المحاسبة<br />والخوة المحاسبين الذين يعملون في الدعوه لو واحد خريج ازهر حب يشتغل محاسب حيرضوا يشغلوه<br />قضي الامر الذي فيه تستفتيان"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

