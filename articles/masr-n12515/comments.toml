text = "رءوسًا جهالاً، فسئلوا فأفتوا بغير علم فضلوا وأضلوا\"،<br />الحديث هنا يبين خطورة الموضوع يا جماعة الا وهي الفتوى<br />الداعية غير المتخصص حيسال<br />وعندما يسال سيفتي بغير علم"
