[[comments]]
order = 10
subject = "رجل دين؟؟؟"
author = "مطر"
text = "لا يوجد في ديننا الحنيف ما يدعى رجل الدين... كلنا رجال هذا الدين.<br />فنبينا صلوات الله و سلامه عليه كان معلما و رسولا و كان يعمل بالتجارة كذلك الصحابة و كل من اتى بعدهم من السلف الصالح.. فلا يوجد لدينا في القران و السنة ما يسمى شهادة لتكون رجل دين !!! طالما الرجل قد اجتهد و تعلم من اصول الدين ما يؤهله للدعوى و الفتوى بالبرهان و الحق و نحن لسنا آنية فارغة يتم ملئها حسبما شاء رجل الدين فبيننا كتاب الله و سنة رسوله تحكم و يرجع اليها ..."
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 11
subject = "الى الاخ مطر"
author = "مش لازم مثير القضية"
text = "طيب يا اخ مطر<br />لما مراتك تبقى حامل وحتولد فيه حاجة اسمها داية وفيه حاجة اسمها طبيب امراض نساء وولادة<br />حتوديها عند مين عند الداية ولا طبيب امراض النساء والولادة علما ايام الرسول ما كنش فيه حاجة اسمها امراض نساء وولاده"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 12
subject = "الدعوة الى اللة"
author = "عادل السيد"
text = "اية حكاية انة يبقى ازهرى كل من يريد ان يحمل لواء الدعوة والهداية الى اللة<br />الازهر اصبح مؤسسة رئاسية تتبع التوجية المعنوى لمباحث امن الدولة<br />ازهر اية يا حبيبى انت وهو<br />طيب ما سعادة المفتى طيب اللة ثراة خريج كلية التجارة وبيفتى لنا بالجلد والحبس والموت فى البحر غرقا كفرا وعصيانا<br />الازهر زمان<br />ايام الدكتور عبد الحليم محمود والسيخ الشعراوى وسيد سابق وغيرهم وغيرهم من العمالقة<br />انما الطنطاوى والصحفيين والدعاء للسلام وللحاخامات فدى بو لتيكا<br />الدكتور وجدى غنيم داعية الى اللة ويملك من العلم الدينى اكثر من المفتى وشيخ الازهر الذى كان شريفا<br />تحياتى للدكتور وجدى<br />انار بك اللة طريق الهداية"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

