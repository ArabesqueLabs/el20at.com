[[comments]]
order = 27
subject = "عن اى ازهر تتحدثون ؟"
author = "مش قايل"
text = "الازهر جامع وجامعة مثلها مثل الاف الجامعات الاسلامية فى كل البلاد الاسلامية<br />والدعاة الى اللة فى بنجلاديش والباكستان وجزر القمر واندونيسيا وتركيا ليسوا من خريجى الازهر<br />وليس هناك ختم نختم بة كل من يريد الدعوة من الازهر بل هذا تعصب لمؤسسة دينية فى بلد واحد من بلاد المسلمين<br />هل اقول ان العقاد قد كتب من الكتب الاسلامية والعبقريات ما لم يكتبة شيخ ازهرى<br />هل اقول لكم ان الداعية على الجندى رحمة اللة لم يكن ازهريا<br />ولا الشيخ حسن البنا مؤسس جماعة الاخوان المسلمين كان ازهريا بل كان خريجا لكلية دار العلوم<br />الدعوة الى اللة من حق كل مسلم متعلم او جاهل خريج الازهر او خريج السربون او السان جورج<br />تجد فلاحا لا يجيد القراءة والكتابة ولكنة يجد مجموعة من شباب الفلاحين يجلسون تحت شجرة والاذان يؤذن فيدعوهم الى الصلاة ويزجرهم احيانا الا يكون ذلك دعوة<br />الدعوة فرض على كل مسلم<br />ادعوا زوجتك وابنتك الى الصلاة وخذ جارك معك الى المسجد<br />ان كنت فى عمل فادعوا زملائك واخوانك الى الصلاة<br />الدعوة فرض على الجميع ايا كانوا<br />ولكن الفتيا او الافتاء فلاهل العلم والراسخين فية كالقاضى الشرعى وحامل شهادة العالمية من كلية دينية وليس خريج تجارة من الازهر مثلا كالمفتى الحالى بتاع الجلد والغرق اغرقة اللة فى نار جهنم"
archived = "2007-11-25"
capture_url = "https://web.archive.org/web/20071125053724/http://masr.20at.com:80/newArticle.php?sid=12515"

