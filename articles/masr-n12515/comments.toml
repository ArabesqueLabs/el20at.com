subject = "ضع عنوان التعليق"
text = "أزهر ايه اللي بيتكلموا عنه ؟ الازهر اللي عايز يلغي تدريس الأئممة الأربعة؟ ولا الشيخ الازهري اللي بيفتي برضاع الكبير و لا التبرك ببول الرسول و لا المفتي اللي كفر العيال الغلابة اللي ماتوا غرقانين علشان طلعت عين ابوهم في بلدهم ودخلوا الاقسام انتهكت اعراضهم فهربوا من البلد دي و يمكن خافوا ليدخلوا قسم في يوم من الايام فهربوا بجلدهم من بلدهم الحبيب علشان يموتوا طمااااعين !!"
archived = "2007-11-25"
