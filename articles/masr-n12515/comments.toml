[[comments]]
order = 3
subject = "وجدي غنيم فرج الله عنه وعنا"
author = "خالدالامير"
text = "ياااااااااااااااه يا طحاوي جميل التحيقيق ورغم ااني وفدي لكني من عشاق وجدي غنيم واسلوبه الدعوي انت فتحت جرح كبير وهو حريه الرأي في مصر والوطن العربي واحد زي الشيخ وجدي ده المفروض اننانحافظ عليه مش نبهدله ونكرمه مش نشرده هو غيره نحتويهم خصوصا انه لا يدعوا الي عنف ولا اي شئ وهوعالم ولقد رايته ذات مره داخل اسوار جامعه الاسكندريه ولا يعب انه اخواني ولكنه حقاني وانك كان يميلالي السف مثلم ذكرت ولكنه يدهو الي السنه بالفعل وان كان يتكلم بالسياسه فهذا ليس بعيب ولكنه رجل دين ينقض ما ينافي الدين والله خطبه له صدي عند الجميع في مصر واعتقد ان لهذا طرد ولم يسعه الوطن العربي والا ساعته امريكا اصبر ياشيخ فان غد لناظره قريب ولن ينساك ربك وربنا وعيل الباغي تدور الدوائر"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121041026/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 4
subject = "احسن موضوع قرءتة بعشرينات"
author = "ابوصالح"
text = "احسن موضوع قرءتة فى هذة المدونة جايز عشان بحب الشيخ وجدى غنيم وحاسس دائما انة مضطهد فى بلدة وبقية الدول العربية تعرف جيدا من هو الشيخ العلامة وجدى غنيم بارك اللة فى عمرة وفى صحتة واتمنى يمتعنا ببرامجة الناجحة دوما وشكرا للاخ عبداللة الطحاوى على المجهود العملة فى هذا الموضوع وشكرا لكل انسان بيدافع عن الحرية والتعبير ويقول راية بمنتهى الصراحة والوضوح كما يفعل الشيخ وجدى ولا يلمون فى الحق لومت لائم"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121041026/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 5
subject = "كنت اتمنى وجود حلقات للشيخ الجميل وجدى غنيم مع الموضوع"
author = "بحب الشيخ وجدى غنيم"
text = "كنت اتمنى وجود حلقات للشيخ العلامة وجدى غنيم مع الموضوع الرائع لكى يتفقه الجميع فى دينة ويعرف الكثير والكثير على يد الشيخ الجميل للاسف الشيخ وجدى مش واخد حقة الادبى فى مصر ولكنة موجود فى قلوبنا واتمنى اليوم الذى يعود فية الى مصر وتذاع برامجة الجميلة الهادفة من قلب مصر اذا كانت الجكومة المصرية والقائمين على البلد مش عارفين قيمتك فتاكد اننا جميعا نعرف قيمتك وقامتك الرفيعة وربنا يباركلنا فيك ويمتعك بالصحة والعافية"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121041026/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 6
subject = "ضع عنوان التعليق"
text = "Nههيا الفكرة رائعة .... التحقيق جميل<br />بس لو مكانش عبد الله الطحاوي هوة اللي كاتبه<br />يا سلام كان حيبقي أحلي تحقيق عنداعية طلع فيكي يا مصر<br />بس نعذر الراجل بقي إمكاناته محدودة و الإستظراف زايد حبتين"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121041026/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 7
subject = "الشيخ وجدي غنيم بيشتغل محاسب ايش علاقته بالدعوة"
text = "من الصحافة الى الدين يا قلبي لا تحزن<br />زي ما هي الصحافة مقلب لكل عاطل عن العمل ممكن يروح يشتغل صحفي بصرف النظر عن مؤهله او حتى من غير مؤهل<br />كذلك الدعوه الاسلامية<br />اي واحد ممكن يشتغل داعية اسلامي بصرف النظر عن موضوع المؤهل او حتى من غير مؤهل<br />وادي السيرة الذاتية لوجدي غنيم<br />- التخرج عام 1973 من كلية التجارة جامعة الإسكندرية شعبة إدارة الأعمال.<br />- تجنيد من سنة 1973 إلي 1976 ضابط احتياط ملازم أول بالجيش .<br />- العمل وكيل حسابات بوزارة المالية من سنة 1976- حتى 2002( استقالة)<br />- أمين عام نقابة التجاريين بالإسكندرية من سنة 1991-2001<br />- أمين عام شعبة المحاسبة و المراجعة بالنقابة العامة بالقاهرة من سنة 1990-2001.<br />يا جماعة دوروا على علماء الازهر<br />راح فين الازهر وعلماءه<br />راح فين خريجي كليات الدعوة واصول الدين<br />راح فين خلفاء الشيخ الشعراوي والغزالي"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121041026/http://masr.20at.com:80/newArticle.php?sid=12515"

[[comments]]
order = 8
subject = "الصحافة والدين (يا جماعة كده غلط)"
author = "تكملة اللي فوق"
text = "يا جماعة كده غلط<br />الصحافة والدين اخطر قطاعين في الدولة من جهة التأثير على الناس<br />المفروض ما حدش يشتغل صحفي الا خريج كليات الاعلام والصحافة<br />ما حدش يشتغل داعية الا اذا كان خريج كليات الدعوة واصول الدين<br />تماما زي المحامي والطبيب والمهندس لازم يكونوا خريجي كليات متخصصة<br />غلط كده يا جماعة<br />غلط غلط غلط غلط"
archived = "2007-11-21"
capture_url = "https://web.archive.org/web/20071121041026/http://masr.20at.com:80/newArticle.php?sid=12515"

