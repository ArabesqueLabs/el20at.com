subject = "مش وحش"
author = "البرج"
text = "الفيلم ده مش بطال بس كان ينقصة اخراج افضل من كده وكمان الموسيق التصويرية والممثلين اللي عالقهوة كلده كان عاوز يتراجع اما بقي الحاجات اللي عجباني فيه سامي مغاوري والتصوير اكثر من رائع ووالسناريو جيد عالعموم هو فكرة جامدةبتمني التوفيق للجميع"
archived = "2007-10-16"
