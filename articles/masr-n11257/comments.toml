[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "شكرا علي الفيلم ده في الحقيقه الفيلم كويس بس ايه الحل يا ناس؟؟؟؟؟ .... انا بحب بلدي زي اي حد من الاخوان المسلمين وكل المصرين الشرفاء .... لازم كلنا نتحرك ونعمل حاجه ونبدء بنفسنا اول وخصوصا احنا معنا احسن منهج ونظام للتغير والاصلاح \" الاسلام\" ..... يارب كل واحد يقرء التعليق ده يبدء يعمل حاجه لنفسه ولعائلته ولبلده ولامته وطبعا لدينه<br />عبد الرحمن - الصين"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032744/http://masr.20at.com:80/newArticle.php?sid=11257"

[[comments]]
order = 3
subject = "حلو اوى"
author = "بسمه"
text = "تحيه للكاتب يوسف ادريس و للفكره الاخراجيه اللى عملت من صفحتين هذا الفيلم المعبر عن حال البلد<br />وتحيه ايضا للفنان سامى مغاورى وكلامه (هذه القرارات ثمار مجهودات 12 لجنة أساسية و24 لجنة فرعية!.. والمواطن المصري مرتاح!.. أمال إحنا قاعدين ليه؟!\") على قد ماضحكنى على قد مادايقنى اكتر من اى واحد مسؤول قاعد على كرسى ومش بيراعى ضميره<br />بس فى حاجه غريبه وهى ان السيد رفعت الشربينى ( سامى مغاورى ) لسه فى منصبه ولم يقال من عمله ؟؟<br />بالمناسبه كنت عايزه اعرف تكلفة الفيلم من جيب الطلبه ولا الجامعه ؟<br />بهنىء طلبه كلية الاعلام على مشروع تخرجهم وان شاء الله يكون بدايه موفقه لعملهم<br />واتمنى من موقع عشرينات ان يقوم بتغطيه مشاريع تخرج كليه التربيه النوعيه قسم صحافه واذاعه وتليفزيون جامعه عين شمس لان مشاريع تخرج طلابها لايقل جمال عن مشاريع تخرج كليه الاعلام<br />شكرررررا عشرينات"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032744/http://masr.20at.com:80/newArticle.php?sid=11257"

[[comments]]
order = 4
subject = "للأستاذة بسمة"
author = "مصطفى هاشم"
text = "تكلفة مشاريع قسم إذاعة وتلفزيون كلها من جيب الطلبة بعكس قسم صحافة التي تمولهم الكلية<br />وحضرتك طلبتي أن نغطي تخرج كليه التربيه النوعيه قسم صحافه واذاعه وتليفزيون جامعه عين شمس فياريت توصلينا بحد منهم<br />وممكن يتواصلوا معنا عبر الإيميل hashom20@hotmail.com<br />وشكرا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032744/http://masr.20at.com:80/newArticle.php?sid=11257"

[[comments]]
order = 5
subject = "الى الاستاذ مصطفى"
author = "بسمه"
text = "شكرا على تجاوبك وأحييك على مجهودك المتميز<br />انتهت دراستى بالكليه منذ نحو السنتين واشك فى قدرتى على توصيل احد اساتذه القسم بك عبر الانترنت<br />ولكن يمكنك التواصل مع اعضاء هيئه التدريس عن طريق نادى خريجين كليه التربيه النوعيه<br />والموقع هو http://specificalumni.com او الاتصال بالكليه على رقم 26844594وتحويلك على تليفون مكتب رئيس القسم<br />وللفكره هناك عدة مشاريع لطلبه قسم الاعلام وهى انتاج افلام تسجيليه ومعرض تصوير فوتوغرافى واصدار جريده البدايه<br />وانتاج واخراج عروض مسرحيه هذا فضلا عن مشاريع تخرج باقى الاقسام بالكليه وشكررررررا"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032744/http://masr.20at.com:80/newArticle.php?sid=11257"

[[comments]]
order = 6
subject = "ايه الجديد"
author = "واحد من الناس"
text = "جميل فيلم تحفة مع انى صعبان عليا فلوسه لان الفيلم دا بيحصل كل يوم ببلاش بس لطلبة المعاهد وموظفين السكك الحديد مش لطلبة اعلام اللى صرفو علشان يعملوه عارف عملوه ليه لانهم بيسمعو وعمرهم ما شافو ولو شافو مكانوش صرفو وسبحان الله مشاكل الناس الغلابة بقت مشاريع تخرج لولاد ال........ واللى بياكل الفول كل يوم مش بيقول ياى لما يشوفه واللى ميعرفش يعنى ايه فول ممكن تجيبله طبق من على اى عربية فول وتبيعهوله ب100 جنيه لاكن نرجع ونقول الفيلم بيعرض مشكلة موجودة وبقت زى الفول موجودة فكل بيت لاكن اللحمة فين قصدى الحل فين وايه هو الحل اصلا يعنى ايه تعرض مشكلة وانت مش تعرف لها حل ولو تعرفلها حل تطبقه ازاى قولى عايزين حلول وكفاية مشاكل المشاكل موجودة ايه الجديد يعنى؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016032744/http://masr.20at.com:80/newArticle.php?sid=11257"
