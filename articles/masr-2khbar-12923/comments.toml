text = "[quote name=\"سبب سحب كرنيه زخاري\"]سبب سحب كرنيه زخاري انهم اكتشفوا انه ممنوع من السفر لانه سافر الى اسرائيل بدون اذن الحكومة المصرية<br />هو دا السبب<br />مفيش اي نعرة طائفية ولا حاجه<br />المسلمين والمسيحيين ممنوعين من السفر الى اسرائيل الا باذن من امن الدولة<br />مصر ما بتفرقش بين المسلم والمسيحي<br />الاثنين سواسية امام القانون والمسلم والمسيحي ممنوعين من السفر الى اسرائيل<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />نش شريف الدواخلي ولا البراء اشرف[/quote]<br />أشكرك على لطافة التعليق؟<br />لكنى احب اوضح ملحوظة؟هو امن الدولة دائما تاعب نفسة و بيحشر نفسة فى اللى يفهم فية و اللى ما بيفهمش فية؟<br />و ايةفهم امن الدولة فى اى شيىء من السياسة؟<br />يعنى ممكن نغير اسم (أمن الدولة)؟ الة (ادارة مباحث امن السياسة)؟<br />و اللى يسافر الى اسرائيل جريمة؟<br />امال فين احترام المواثيق و الاتفاقيات الدولية؟<br />ما السيد /رئيس الدولة سافر الى اسرائيل؟<br />هل حصل على موافقة الدولة؟<br />يعنى السيد /رئيس الدولة و رئيس الحزب الوطنى ممنوع من السفر !!!!؟ لكونة سافر الى (أسرائيل)؟"
