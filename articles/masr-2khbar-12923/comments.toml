author = "سبب سحب كرنيه زخاري"
posted = "2009-08-13"
text = "سبب سحب كرنيه زخاري انهم اكتشفوا انه ممنوع من السفر لانه سافر الى اسرائيل بدون اذن الحكومة المصرية<br />هو دا السبب<br />مفيش اي نعرة طائفية ولا حاجه<br />المسلمين والمسيحيين ممنوعين من السفر الى اسرائيل الا باذن من امن الدولة<br />مصر ما بتفرقش بين المسلم والمسيحي<br />الاثنين سواسية امام القانون والمسلم والمسيحي ممنوعين من السفر الى اسرائيل<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />نش شريف الدواخلي ولا البراء اشرف"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814235851/http://www.20at.com:80/masr/2khbar/12923-2009-08-13-07-25-53.html"

