author = "الاقباط متحدون زخاري"
posted = "2009-08-13"
text = "تعليق زخاري في موقع حبيبه عدلي ابادير<br />،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،،<br />التعليقات<br />الآراء الواردة في التعليقات تعبر عن آراء أصحابها<br />٦-لا فرق بين عربى و اعجمى الا بالتقوى! 2009-06-25 12:52:42<br />ممدوح زكى زخارى جرجس<br />هاهاهاهاهاهاهاهاهاهاهاهاهاهاهاها<br />و اللة ما انا بفاهم حاجة؟<br />نحن لا محصلين العرب و لا محصلين العجم؟<br />امال نبقى ايهة بالضبط!!!<br />الحقيقة هم حتى موش محصلين (الخنازير)اللى قتلوها<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />ريح نفسك يا زخاري مفيش سفر برا مصر<br />اسمك على القايمه السودا بالثلث<br />ــــــــــــــــــــــــــــــــ<br />مباحث اسكندرية ومديرية امن اسكندرية"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814235851/http://www.20at.com:80/masr/2khbar/12923-2009-08-13-07-25-53.html"

