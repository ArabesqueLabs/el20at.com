author = "زخاري 10 الاف جنيه"
posted = "2009-08-13"
text = "في موقع الكلب عدلي ابادير محاميه نصابة ادعت كذبا ان فيه قاضي غرمها 10 الاف جنيه<br />وعم زخاري ابو قلب طيب وحنين هو اللي تطلع انه يدفعلها العشر الاف جنيه بصو شوفوا بيقول ايه<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />-و لا يهمك ياستاذة/ميرفت 2009-06-29 01:14:58<br />ممدوح زكى زخارى جرجس-الاسكندرية-مصر<br />لا يهمك ياستاذة<br />انا مستعد لدفع الغرامة اللى سيادة القاضى حكم بها ضدك ظلما<br />ممدوح زكى زخارى جرجس<br />الاسكندرية-مصر<br />محمول(0121714842)<br />149 شارع طيبة-سبورتنج-الاسكندرية-مصر<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />يا حنين يا زخاري يا ابو قلب رهيف"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814235851/http://www.20at.com:80/masr/2khbar/12923-2009-08-13-07-25-53.html"

