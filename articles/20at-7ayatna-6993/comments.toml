subject = "ضع عنوان التعليق"
author = "منى وهيب"
posted = "2007-12-14"
text = "طبعا يا جماعة ماحدش قال ان لبس الزوجه بدلسه رقص لجوزها حرام واللى يقول كده مش فاهم حاجه لكن مش كل حاجه حلال تكون حلوة او مفيدة رقص ايه اللى البنت قبل ماتتجوز عمالة تفكر فيه عشان تحافظ على الراجل وبعدين ما كل اللانجريهات اللى ماليه المحلات اشنع من بدل الرقص التفكير بالشكل ده دليل ان البنات مش فاهمين اى حاجه عن الجواز وواجبات الزوجه واهتمامها بجوزها ورعايته الراجل عاوز طبعا ست جميلة مهتمة بنفسها وده شىء منطقى لكن قبل وبعد كده عاوز زوجه حنونة محبه عاقلة تكون زوجه وأم وحبيبة وصديقه عقلها كبير مخلصه صبورة مثقفه ومدينه عشان تفهمة وتقدر تربى اولادها بشكل كويس وانا طبعا بتكلم عن الراجل اللى بيفهم مش ولا مؤاخذة الرجالة.......مش بدله رقص"
archived = "2010-03-14"
capture_url = ""
