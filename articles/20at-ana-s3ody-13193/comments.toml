text = "مع الأسف هذا خطأ كبير يقوم به أئمة هذه المساجد<br />وليس لهم الحق بمنع أي شخص يريد أن يؤدي فريضته<br />ليكن شعره أو مظهره غريب<br />دعه يصلي وقم بنصحه بعد الصلاة<br />لكن لاتمنعه من أداء الفريضة!!!!!!!<br />هذا الشاب أتى للمسجد لكي يصلي فأنت تقوم بمنعه من الصلاة في المسجد!!!!<br />شيء غريب فعلا!!!!!!!!!!!!<br />قم بنصحه بعد الصلاة<br />وهذه الظاهرة لها حل آخر غير هذا<br />وليس في وقت الصلاة أيضا<br />وملاحظة هامة:تقصدون الكدش والحركات الغريبة لااا إطالة الشعر<br />لان إطالة الشعر أمر عادي وكان الرسول صلى الله عليه وسلم وصحابته يطيلون الشعر<br />ومن المعروف قديما وإلى قبل 70 عام أن الناس كانت تقوم بإطاله شعورها<br />وهو أمر عادي جدا لايوجد به أي تشبه<br />بل هو موجود وأمر طبيعي<br />وشكرا"
