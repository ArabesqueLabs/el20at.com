[[comments]]
order = 30
subject = "إلى كل المصرين الخولاااااااااااااااااااااااااااااا"
author = "محمد نواف"
posted = "2008-09-10"
text = "ولك يا مصرية يابنت القحب .. احكي اسمك مش ممكن أكون شامك وفاتحك سباااااااااعي وإنتي مش عارفه مين اللي ناكك وفتح كسك سباعي .. احكي اسمك ياشرموطه .. يابنت الداشرة العاهرة العاهرة .. بنت الفالته الدايرة بالشوراع .. ولك إنتي لوفيك ذرة أو جزء من الأنوثة كنتي مابتحكي كلامك هاذ اللي بسم البدن .. ولك إنتي وأشك فيكي إنك زلمه مش مره .. أي يلعن شرفك .. ولك نايك كل بنات مصر وحده وحده .. وأولهم إنتي ياحلوة ياقمر ياعسل ياحلو إنتا ..<br />ولك إنتي بتعرفي إنتي عبارة عن بنت مصرية جربة معفنه .. مش معروفلها أصل من فصل .. ملهاش هوية أو حتى جواز .. فايعة صايعة دايرة فالتة داشرة بالشوراع .. بتترجى الشباب عشان ينيكها مش بفلوس لأا ببلاش كمان !!!!!!!<br />ولك إنتي مكانك المراقص والملاهي والبارات والخمارات والديسكوهات والكازينوهات وكلوووووووووووووو .. الله يلعنك شو قحبة وشرموطة وعاهره . ولك منيوكة إنتي .. مافي عنك إشي اسمو أخلاق أو قيم أو مبادئ أو أحساس بتأنيب الظمير .. يعني بالعربي وبالمشرمحي وحده غبية وهبلة وتيسة وملطوشة وسطلة وريالتها شاطة لرجليها .. وكس أمك ع أم اللي خلفوكي بنت حراااااااااااااااام ..<br />اسمعي أنا بنصحك تروحي دوري عن أمك وأبوكي !!! ماشي .. هع هع هع هع خخخخخخخخخخخخخخ ههههههههه<br />كس أمك يامصر يابلاد الخولات والشرموطات العرصات المنيوكات ..<br />كس أم كل واحد بحكي أنا من مصر ..<br />كس أم كل واحد بحكي مصر ..<br />كس أم المصرييين براس زب الاردنية ..<br />كس أم مصر وأهلها وحاراتها ومدنها ومحافظاتها قراها والصعايده الأغبياء وعلى ام مبارك البقرة الضاحكة كس أمو لمبارك أخو منيوكه داعره قحبة مفتوحه ابن شرموطه ..<br />كس أم المصريين فرداً فرداً بلا استثنااااااااااااااااااء ...<br />كس ام الصعايده ..ههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه<br />ولكو كس أمكن وحده وحده براس زب كل الاردنيين .. ولكو أنتو اجيتو من زبابنا نحنا الأردنية !<br />الله .. الأردن .. عبد الله وبس .. تحية إجلال وإكبار لجلالة ملكنا الهاشمي المعظم / عبد الله بن حسين الثاني _ حفظه الله ورعاه _<br />والأردن أولا ً .. وسيبقى أولاً .. لأبد الأبديين .. واسمه محغور في قلوبنا .. وسنظل نردده .. أبد الدهر ماحيينا ..<br />والله .. والوطن .. والملك .. وبس .. وجيشنا جيش الوطن سمينا بإسم الله نحمي الوطن والعلم بعيون عبدالله ...<br />أردنيه مش بس بالجنسيه<br />أردنيه وفائنا للعائله الهاشميه<br />أردنيه قبل الميلاد والسنه الهجريه<br />أردنيه بتشميرنا عاليد والمناسف البلديه<br />أردنيه مش تاعين الكبسه والملوخيه<br />أردنيه وعلمنا معروف بالنجمه السباعيه<br />ورمزنا الشماغ الأحمر ومالنا فروع ثانيه ..\\\\\\\\\\\\\\\"مش مثل شماغكو .. هههههههههههه . شماغ حمير وحشية ( الشماغ الأبيض)<br />ويلا يلاااا يلاااااااااا على بلدكو ياشراميط ولاد الشراميط .. ولاتنسو تلمو عفنكو قرفكو ووسخكو وهبلكو وتسطيلكو معاكو .. ماشي .. ههههههههههههههههههههههههههههه<br />وكــل واحد عارف شو سوى واللهم لا شماتة واعذرونا على الاطالة يا ساده .."
