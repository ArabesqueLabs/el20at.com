subject = "انا كمان اتسرقت في الحرم"
author = "معتمر"
posted = "2007-10-01"
text = "اه والله حتى في الحرم انا شخصياً كان لي شرف زيارة المسجد الحرام عدة مرات وفي أحداها تمت سرقتي أثناء الطواف والله وذلك بحركه بارعه حيث وضع اللص سجادة صلاه على يده اليمنى وتظاهر بأنه منغمس في الدعاء وكانت يده تعبث في جيوب الطائفين من تحت المصليه<br />الحمد لله هو سرق بس مصحف كان عزيز علي من جيب الجلباب بس الحمد لله - المهم الاخوه المعتمرين والحجاج يجب عليهم اخذ اقصى درجات الحذر وربنا يسلم ان شاء الله"
archived = "2010-03-14"
