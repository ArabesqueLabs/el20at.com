text = ":lol:<br />الف مبروك<br />انا تابعت المباريات كلها واستمتعت بها وبنشكر الجزيرة على اذاعتها للمباريات<br />والفرق كلها لعبت بمستوى راقى وعالى جدا<br />وكان احسن فريق بيلعب الكاميرون وغانا<br />الجزائر كانت ضعيفة فى لعبها<br />ولكن ما غاظنى وفقع مرارتى ورفع ضغطى هو اننى لم اشاهد كتائب امن مركزى بالدروع والخيرازانة وكانت الملاعب خالية من اى عسكرى<br />ولم رتب ولا عمداء ولا كلاب شرطة واقفة<br />صحيح افريقيا بتتقدم بسرعة جدا واحنا بنرجع لوراء<br />الملاعب التى تم اللعب فيها كانت حديثة وجميلة واحسن من استاد ناصر بتاعنا"
