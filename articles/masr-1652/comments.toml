text = "مش تبقى مصر ..<br />لو حد كان فيها نجيب وماتبهدلش<br />مش تبقى مصر ..<br />لو حد كان باحث عظيم وماكملش<br />أصل إحنا دايما كده ..<br />نفوسنا ضعيفة ومريضة وبنت لذينة وكل ده<br />عشان يحافظوا على مناصبهم ..<br />ولا حد ياخد فى الشهرة نصيبهم<br />يبقى نعطلهم ونعرقلهم ..<br />وبنلعنهم ونلعن كل اللى يجيبهم<br />طب مثلا مثلا .. لو تفرض مثلا<br />إنك تعبت ومالقتش علاج يخفف وجعك<br />تعمل إيه يا سعادة البيه .. هتعض فى صبعك ؟<br />وساعتها هتندم على إيه ؟<br />ودموعك هتفدنا بإيه ؟<br />على موهبة ربك أنعم بيها<br />وأنت بجهلك دفنتها<br />وقتلتها .. وخربتها .. وقعدت ودلدلت رجليك على تلها<br />يا سعادة البيه ..<br />إحنا شعوب محتاجة علاج<br />عالم تالت طالع فيه مليون خراج<br />حتى الواد اللى هو حيلتنا<br />هتفطوسه<br />وبرجليكوا تدهسوه<br />وتقولوا عاملكو إزعاج<br />خيبة عليكوا وعاللى جايبكوا<br />وخيببة علينا وعاللى سايبكوا<br />تحكموا فينا وتحاكمونا<br />ومن مانخيركوا ترودوا علينا<br />وتقولوا إن كانش عاجبكوا<br />بس العيب مش فيكو .. ولا بيكو<br />العيب فينا عشان ساكتين<br />عشان راضيين<br />واحد جاهل يحكم فينا<br />يمشى كلامه قتاوة علينا<br />أمة ضعيفة .. ماليانة ضغينه<br />مافيهاش فارس يسحب سيفه<br />ويرجع الحق المسلوب لينا"
