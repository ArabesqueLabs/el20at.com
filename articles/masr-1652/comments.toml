subject = "بعض النقاط فوق الحروف"
author = "محمد عبد الحكيم"
posted = "2008-06-06"
text = "1- ما شاء الله كل من يضيف تعليق يضع قبل إسمه د/ !!! حتى و لو كان ما زال مدرس مساعد ... أى أنه لو كان قوى الملاحظه لوجد أن الجامعه لم تمنحه هذا اللقب بعد ... و فى كل المراسلات الرسميه لن يخاطبه أحد ب د/ إلا بعد الدكتوراه و عليكم خير .... و يضعون رأيهم فى موضوع ليسوا متخصصين فيه ... و يقولون انه على وشك حل المشكله إلى الأبد ... كام مره قرأنا فى الجرائد المصريه عن العباقره الذين توصلوا لعلاج الفيروس و بعدين و لا حس و لا خبر ... و إذا كان د.جاك ليانج نفسه لم يدعى قُرب التوصل للقاح ... أرجو من أساتذة الغد أن يحترموا أصول البحث العلمى ... من حيث ذكر الحقائق المؤكده بأدله ... و ليس رأيهم الشخصى.<br />2- أتمنى أن يتخلى المصريون قليلاً عن التحمس الزائد الذى قد يُفقدنا الموضوعيه أحياناً ... فمثلاً سعدت جداً عندما قرأت أن هناك بحث منشور فى Nature لمصرى ... و لكن عندما تفقدت الٍsite الخاص بالمجله لم أجد شىء فأرجو نشر رقم العدد و الصفحه لنستفيد جميعاً من هذا البحث (أم أن الناس تعودت أن تذكر أى مرجع إعتماداً على أنه مافيش حد فاضى يدور بجد !!!) ... و لم أجد بإسم الدكتور جمال سوى بحثين ... واحد فقط فى الدكتوراه عن فيروس يصيب الحيوانات ... و واحد عام 2007 عن فيروس سى فى مجلة PNAS ... و هذا الإنتاج العلمى بالنسبه لأمريكا الشماليه قليل جداً فأرجو نشر أسماء أى أبحاث أخرى قام بنشرها الدكتور المولد لأنه طبعاً مستحيل يكون بهذا التميز و لم ينشر سوى بحثين فى عشر سنوات.<br />3- أرجو ألا يدفعنا حب إنسان أن نغفر له أى إستثناءات ... و أعتقد إن هو ده اللى ودى البلد فى داهيه !!!! يعنى واحد يسافر على حساب الحكومه ... و يقعد خمس سنين .... سوف تصعقون عندما تعرفون الرقم الذى صرفته الحكومه .... حوالى 200 ألف دولار ... و يمكن أكتر ... يعنى مليون جنيه !!!!! و بدل ما يرجع بعد لما يخلص عشان يرد الجميل ... لأ ... يطمع فى تحقيق أشياء أكتر فى أمريكا و يعمل أجازة مرافقة زوجه ... و طبعاً ما يقدرش ما يرجعش و يقدم إستقاله و إلا يكون المفروض يرجع كل الفلوس اللى إتصرفت عليه .... و كمان بيقبض من مصر و من أمريكا !!!! ... أرجو التوضيح ... لأن إنسان زى ما بتقولوا بالأخلاق الدمثه دى مستحيل يكون عمل كل ده .... يا ريت تفهمونا إيه القصه بدقه و بلاش الكلام العام اللى ممكن يسبب سوء تفاهم عن شخصيه واضح إنها محترمه و على علم و خُلُق.<br />4- و أخيراً ... الصوره اللى انتم حاططينها للدكتور على الدين هلال و ليس الدكتور هانى هلال !!"
archived = "2010-03-14"
