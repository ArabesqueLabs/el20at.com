order = 0
subject = "بعد اية ؟ المولد انفض - كنتم فين"
text = "بعد الحرب ما خلصت ؟ كل واحد طالع يعمل لى مؤتمر ويخطب ويخبط بقين كلام فى الهجايص<br />مؤتمر فى الدوحة<br />مؤتمر فى الرياض<br />مؤتمر فى شرم الشيخ<br />مؤتمر فى الكويت<br />يا اخى احة<br />ثم قحة<br />ثم قحة<br />يا ولاد الكلب تقتلوا القتيل وتمشوا فى جنازتة<br />بعد حماس اللى انشتمت منكم كلكم بعد ما صمدت طالعين تتكلموا وتفتحوا الحناجر<br />يقدر واحد منكم يرسل سلاح للمقاومة<br />والا كلكم بتتسابقوا على محاصرتها<br />الراجل فيكم يبعت سلاح لغزة<br />اما ان كنتم نسوان<br />يبقى تتكلموا وتهاتوا زى الكلاب"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192644/http://masr.20at.com:80/newArticle.php?sid=19345"
