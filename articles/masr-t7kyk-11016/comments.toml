[[comments]]
order = 1
subject = "الى المعلق السابق"
author = "مش ححبك"
posted = "2009-01-22"
text = "الكلام اللي انت كاتبه دا يدل على انك مش فاهم حاجه خالص<br />اولا احب اقولك ان الايات الموجودة في القران مرتبطة بحوادث حصلت اثناء السيرة النبوية<br />الايات اللي انت ذكرتها دي مرتبطة باحداث حصلت وتخص هذه الاحداث فقط<br />ما تخصش احداث غزه في حاجه<br />وبعدين اسرائيل انسحبت من غزه بمحض ارادتها<br />وبعدين لازم تقرأ قصة اليهود من اول سيدنا ابراهيم مرورا بسيدنا موسى الى اخر حدث لليهود<br />ليسوؤوا وجوهكم وليدخلوا المسجد كما دخلوه اول مرة<br />مرورا اذا جاء وعد الاخرة جئنا بكم لفيفا<br />احنا الان في مرحلة حتى اذا جاء وعد الاخرة جئنا بكم لفيفا<br />فيه 6 مليون يهودي في فلسطين وهما 15 مليون يبقى لسه 9 مليون جايين<br />انا بقول الكلام دا علشان خاطر احنا الان المفروض نكون في مرحلة الاستعداد للحرب الكبرى مش في مرحلة النصر<br />وبعدين<br />ايات القران والاحاديث النبوية يستخدمها الفقهاء الكبار مش انت ولا انا<br />بلاش هبل يا ابني لان وقت النصر على اليهود لسه مجاش<br />وانصحك انك تشتري سي دي التفسير بتاع الشيخ الشعراوي وتسمعه كله حيفيدك كتير<br />سلام"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 2
subject = "الى المعلق السابق (تكمله)"
author = "مش ححبك"
posted = "2009-01-22"
text = "الايات اللي انت قلتها في تعليقك<br />الن يكفيكم ان يمدكم ربكم بثلاثة الاف من الملائكة منزلين --- ال عمران-24<br />فاستجاب لكم انى ممدكم بالف من الملائكة مردفين --- الانفال 9<br />يمددكم ربكم بخمسة الاف من الملائكة مسومين -- ال عمران -125<br />تأكيدا لكلامي<br />لو كان الامر هكذا<br />لكان سيدنا الحسين في كربلاء نزلوا كل ملائكة السماء<br />فهو اولى بالملائكة من اهل غزه<br />ولكن زي ما انا قلتلك الايات دي مرتبطة باحداث حصلت اثناء السيرة النبوية وهذه الايات تخص هذه الاحداث فقط<br />سلام يا صاحبي"
archived = "2010-03-14"
capture_url = ""

