subject = "كيف انتصرتم على اقوى جيوش العالم ؟"
author = "مصرى"
posted = "2009-01-21"
text = "الن يكفيكم ان يمدكم ربكم بثلاثة الاف من الملائكة منزلين --- ال عمران-24<br />فاستجاب لكم انى ممدكم بالف من الملائكة مردفين --- الانفال 9<br />يمددكم ربكم بخمسة الاف من الملائكة مسومين -- ال عمران -125<br />كل هذا المدد من ربكم لتنتصروا<br />لا تعليق بعد كلمات اللة ووعدة ان يمد عبادة المؤمنين بالنصر"
