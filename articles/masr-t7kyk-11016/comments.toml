[[comments]]
order = 4
subject = "صديقي"
author = "مش ضروري"
posted = "2009-01-22"
text = "صديقي من يقاسمني همومي** ويرمي بالعداوة من رماني<br />وينصرني إذا ماغبت عنه ** وأرجو وده طول الزمانِ<br />ويحفظ حُبه ويفيض وداً ** يحب الخير مفتاح الأماني<br />صديقي من يرى الإيمان بحراً ** عزيز النفس مشبوب الجنَانِ<br />فلا الأهواء تجرؤ تشتريه ** ولا الإعجاب يسبي ذا الجنان<br />ولا النزوات تنسج بردتيه ** ولا الأحقادتسكن في الكيانِ<br />حياً مخلصاً عفاً جريئاً ** سليل الهدي يعبق بالحنانِ<br />إذا وهب الحليم صديق خير ** أتاه السعد ميمون الجناحِ<br />ومن يرزق سواه فقد دهته ** مصائب في الصباح وفي المساء"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "لا تدخلوا الاسرائيليات فى تفسير القرأن"
author = "مصرى"
posted = "2009-01-22"
text = "اليهود كانوا جيوبا فى اليمن والجزيرة العربية - بعض النقاط او الحصون - كحصن خيبر ويهود خيبر<br />ولكن بعد غدرهم بالمسلمين تم محاربتهم<br />ثم كتب اللة عليهم الجلاء<br />وظنوا انهم مانعتهم حصونهم من اللة فاتهم اللة من حيث لم يحتسبوا - وقذف فى فلوبهم الرعب - يخربون بيوتهم بايديهم وايدى المؤمنون فا اعتبروا يا اولى الابصار<br />ولولا ان كتب اللة عليهم الجلاء لعذبهم فى الدنيا ولهم فى الاخرة عذاب النار<br />هذا ما كتب عن اليهود<br />وهذا هو مصيرهم القادم<br />فلا تقول لى تفسيرات يهودية بتجميع اليهود كلهم ثم هزيمتهم - هذا فكر اسرائيلى"
archived = "2010-03-14"
capture_url = ""
