text = "واللي مش مصدقني يراجع تفسير الشيخ الشعراوي في تفسير اية<br />حتى اذا جاء وعد الاخرة جئنا بكم لفيفا<br />وهذا الكلام من اجل الاستعداد للحرب الكبرى وليس للتثبيط"
