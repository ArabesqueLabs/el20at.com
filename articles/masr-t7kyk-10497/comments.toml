subject = "ألى (مشمش) المعلق السابق"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-11-16"
text = "مع اختلاف و جهة النظر<br />هى اى حاجة عندكم دائما ما تزجوا باسم(جمال مبارك)؟<br />هى اية بالضبط عندكم عقد النقص الكثيرة و الحقد و شهوة جلد النفس<br />يابنى نصيحة خالصة لك؟<br />روح دور على اكل عيشك بدل ما تاكل على قفاك و كمان مؤخرتك ؟!!!<br />انت صحيح طاعت (مش) (مش)<br />يا معفن يا مدود<br />يا عبيط ياهبل؟؟؟"
archived = "2010-03-14"
capture_url = ""

