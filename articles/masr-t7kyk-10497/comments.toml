[[comments]]
order = 1
subject = "لست حلما فى الخيال ( انت مطلب ياجمال )  يعنى اقعد"
author = "مشمش"
posted = "2008-11-14"
text = "لست حلما فى الخيال انت مطلوب منك ياجمال انك تقعد فى البيت وتبطل سياسة لانة يااخى مش متخيل انة انت تبقى رئيس عليا ! واديك شفت السعلوة لما نربيها ونكبرها ترجع تعض الايد اللى اتمدت ليها وكفاية حرام عليك انت وابوك"
archived = "2010-03-14"
capture_url = ""

