subject = "الترسة وامنا الغولة وام شعور وابو رجل مسلوخة والند"
author = "صياد سلعوات"
posted = "2008-11-13"
text = "الحكاية كلها انة كلب مسعور بيجرى فى الغيطان ويستخبى فى المقابر والغيطان ولما يقابلة انسان بيعضة ويجرى ويختفى<br />والناس تقول الحقوا السلعوة<br />يا جماعة دا كلب<br />هنعمل هيصة لية<br />الحل اطلاق النار علية<br />بس خلاص"
archived = "2010-03-14"
