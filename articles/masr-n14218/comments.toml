subject = "nokta"
author = "مونا دلع مني"
text = "مرة واحد ماشي في الشارع فقابل واحد تاني شكله مش على بعضه و مستعجل اوي و بيقول :<br />لو سمحت من فضلك قلعني الجاكتة<br />*فالاولاني قال له : نعم؟!!!<br />*فالتاني قال : قلعني الجاكتة بسرعة<br />*حاضر.. حاضر و راح مقلعه الجاكتة<br />*لو سمحت بقه قلعني الكرافتة<br />*إيه؟!!<br />*الكرافته ..الكرافته بسرعة<br />*حاضر.. حاضر و راح مقلعه الكرافته و هو مستغرب اوي من الراجل الغريب ده : ها يا سيدي اى<br />خدمة تانية!!<br />*اه .. معلش فكلي زراير القميص<br />*لااااا دانت زّودتها اوي .. كده تاخد برد يقلب بنزلة شعبية حادة تاخد أجلك<br />*من فضلك فكها .. بسرعة .. ارجوك<br />ُ*افففففف.. وادي زراير القميص خلاص فكتها.. دا كان يوم إيه المهبب ده, ها أي اوامر تانية؟<br />*أيوه قلعي بقه القميص<br />*يا سيدي عييب .. مايصحش كده , د إحنا فى الشارع خللي عندك دم .. .. يا حول الله يا رب !!<br />*أرجوك.. أرجوك بسرعة.. مافيش وقت<br />*دي وقعت إيه المهببه دي, أنا كان إيه إللي جابني من الشارع ده..وادي القميص ... هاااا.. إيه تاني!!<br />*إرسملي على ظهري خطوط بالطول و خطوط بالعرض<br />*حسبي الله و نعم الوكيل .. إنت مجنون ياراجل أنت؟؟!!<br />*من فضلك .. أرجوك<br />*رسمتلك زفت بالطول و زفت بالعرض<br />*رقملي بقه المربعات إللي إتكونت على ظهري بالأرقام من 1 إلي 40<br />*يا صبر أيوووب .. بقه إنت معطلني كل ده علشان تلعبني سيجه على قفاك؟!!!! *بسرعة لو سمحت .. أرجوك رقمهم .. من فضلك مش قادر<br />*أديني رقمتهم...<br />*لو سمحت بقى أهرشلي في المربع رقم 33"
archived = "2008-02-20"
capture_url = "https://web.archive.org/web/20080220001132/http://masr.20at.com:80/newArticle.php?sid=14218"

