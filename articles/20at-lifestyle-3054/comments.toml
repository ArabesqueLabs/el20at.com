subject = "هو الأحرار بيطيّحوا"
author = "اكتب اسمك هنا"
posted = "2007-01-29"
text = "هو الكلاسين تحت الثوب صح لكن مش شرط الثوب يكون فوق الركبه<br />والبوكسرات اللي بتؤول عليها صح تحت البناطيل لكن مش شرط فوئيها وتبين المستخبي<br />ما يصحش دا الكلام يا اسامه والحرية اللي بتؤول عليها مش زي كدا خالص<br />الا أولي يا اونكل هو الاحرار عن حأ وحئيأة بيرضيهم طيحني ؟<br />شكرا يا عم عادل عالتقرير الجدع"
