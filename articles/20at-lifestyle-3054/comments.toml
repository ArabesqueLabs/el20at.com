[[comments]]
order = 1
subject = "والله إنكم لن تتطوروا يالمساكين"
author = "أسامه ناصر"
posted = "2007-01-16"
text = "أخ عادل أنا لا أرى أي مشكله في لبس الجينز الطيحني على قولتكم<br />ولقد لا حظت أنك أتيت بآراء الشباب اللي تبغا ولم تأتي بمن يؤيد هذه الموضه الرائعه<br />يا من جعلتم الطيحني شيء منافي للأخلاق وأنت يامن قلت أن الذي يلبسونه حثالا<br />هلا صممتم لنا جينز إسلامي جينز يعجبكم جينز لا يلبسه إلا الشيووووخ<br />أتريدوننا أن نلبس الثياب فقط ولو لبسنا الثياب تقولون<br />مخصر وطويل ومسبل وووو.....<br />أتمنا أن تخففوا على أنفسكم وترحمونها شوي<br />دمتم للطيحني لابسين"
