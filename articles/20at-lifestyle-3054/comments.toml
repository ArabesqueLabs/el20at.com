author = "moltazem"
posted = "2007-01-31"
text = "عيب والله إن حالنا يوصل لهذا الحد من السفالة إزاي واحد المفروض إنه محسوب ع الرجالة نفر وفيه مكنسة تحت مناخيره<br />قصدي شنب تقف عليه الجاموسة يسمح لنفسه يلبس حاجة معفنة كدة تبين ولا مؤاخذة الunderwear بتاعه<br />لا خلق ولا دين ولا أي حاجة تسمح بالكلام دة واللي بيعمل كدة بيقلد ولامؤاخذة الرجالة اللى هما ولامؤاخذة بتوع برة<br />ياريت ناخد منهم الحاجة العدلة ونسيب الكلام الفاضى دة ياريت شبابنا يدور على نموذج فى النجاح من عندهم زي بل جيتس وغيره كتير خاصة إن بلدنا محتاجة لكل شاب وكل بنت تشتغل بجد عشان تنزاح الغمة اللى إحنا فيها<br />وراعي حياء البنات اللى بتركب معاك ف المواصلات ولا خلاص إحنا دخلنا سباق بورنو كبير بحجم المجتمع كله<br />خصوصا واحنا بنتهمهم دايما انهم _ أي البنات_ السبب الرئيسي لفساد الشباب ما نعملش احنا الغلط زيهم<br />علي فكرة كل واحد أو واحدة بيبص عليك كدة تشترك انت معاه في الذنب واحنا كلنا مش ناقصين"
