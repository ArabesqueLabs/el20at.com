[[comments]]
order = 14
subject = "طيحني يا باشا"
author = "حمودي"
posted = "2008-08-03"
text = "اول شي انا عمري 20 سنة وكنت البس طيحني في الفترة مابين 17 و19 من عمري ولكن باعتدال ومن غيلا تبيين اي شي من اللي بالي بالك لكن بعض المناظر العجيبة التي رايتها لهذه الموضة سواء في السعودية او في مصر ايضا حيث كنت ادرس جعلتني اتخلى عنها بصراحة في مرة من المرات كنت خارج من مصلى الكلية في مصر ولبست حذائي ووقفت انتظر صديقا لي واذا بشاب مصري يدرس معنا خارج من المسجد ايضا ويهم بلبس حذائه وكان من النوع اللي ينربط ادخل حذائه في قدمه وما ان هم بربطه حتى انكشف المستور وبان اكثر من نصف خط البتاع ظاهرا امامي على الطبيعة وكانت اول مرة تكتحل فيها عيني برؤية خلفية شاب مثلي بهذا الوضوح ونقاء الصورة حيث كانت تقنيات البث عالية جدا ويبدو كذلك ان صاحبنا كان يواجه مشاكل وعقبات في ربط الحذاء لذلك استمرعرض هذا الفيلم الجنسي امامي لمدة طويلة اكثر من دقيقة ونصف او ربما اه هو من رغب باطالة امد الفيلم ويبدو انه كان مستمتعا بالعرض الحصري والمباشر له بعد هذا الموقف اصبحت استحي من رؤية وجه هذا الشاب وكان وسيما بالمناسبة فكيف لي ان اضع عيني في عين شخص رايت وللتو (ولا مؤاخذة) خط البتاع تبعه وبعدها كرهت ان اكون انا من اقع في هذا الموقف فتركت لبس هذا البنطال بلا رجعة وهي بالمناسبة فترة عمرية معينة ويقلع بعدها الشباب من تلقاء انفسهم بعد ان يكبروا وينضجوا وايضا احب ان اذكر بما يحدث في المساجد عند الركوع والسجود من مناظر مؤسفة اخيرا احب ان اقول ان الاعتدال طيب دائما في كل شيء فحتى لو لبست هذا البنطال فليكن بحدود معينة ومعتدلة وليس بالضرورة ان تظهر ما لذ وطاب وكانك تعرضها مجانا للي رايح واللي جاي واللي مايشتري يتفرج ولا تبقي على اي شي ... البس بحدوووووووووووووود وشكرا"
archived = "2010-03-14"
capture_url = ""

