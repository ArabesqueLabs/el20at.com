subject = "ياحسافة والله إنهم مساكين"
author = "وليد عبدالله"
posted = "2007-01-16"
text = "نشكر الأخ عادل الكثيري على هذا التحقيق الجميل.<br />ولقد سمعت أن هذا النوع من اللباس لايلبسه الغرب بل الحثالة منهم فهل بعضنا وصل به الانحطاط بحيث إنه لايقلد الغرب بل يقلد حثالتهم.<br />وأعقِّب على ماذكره الأستاذ (قاسم سعيد) بأن على الدعاة والمربين أن يمدوا إلى أمثال هؤلاء اليد الحانية فهم ناس افتقدوا إلى القدوات في حياتهم."
