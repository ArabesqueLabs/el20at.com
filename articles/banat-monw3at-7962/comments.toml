text = "مشكله عنجد مشكله وهاي العاده ضاره مش للبنات بس للشباب وللبنات<br />وكمان انا بعترض يا ست نجلا انو البنات الفلسطينيات وبشكل خاص هما الي بدخنو وبارجلو انا بشووف كتير بنات وبالوظن العربي بدخنو وبارجلو ...صح انو مزاج وريلاكس اول شي بس عنجد ياريت الناس تلجئ لاشياء تانيه اضيع وئتها او اتفخلئها بشي تاني غير هالاشياء<br />ولو اجاني بهالموضوع بالناحيه الدينيه فهو حراااام و100% حرااام لانو لاضرر ولا ضرار في الاسلام ..واحنا ما بنادر ننكر انو بضر ع الصحه كتيير وبيسبب امراض كتيير ممكن ما تظهر هالامراض مباشره وانما بعد سنييين<br />وانشاءالله الله يهدي الجميع"
