subject = "التقليد والشعور بالنقص"
author = "محمد محمود"
posted = "2008-02-17"
text = "اولا البنات تلجاءالى التدخين لاسباب كثيرة منها(حب الاستطلاع والتقليدللشباب والبيئة المحيطة بها ويرجع ايضا الى عوامل نفسيةفلو كانت البيئة المحيطة بها فسوف يؤدى الى التدخين واكثر من زللك مثل المشاكل فى البيت بين الاب وزوجتةمما يؤدى الى حدوث الطلاق ففى هذة الحالة تلجا البنت الى ما يسمى الانحراف واللجؤ الى صديق السؤ وما اكثر من رفقا السؤ فى ايامنا هذا واخيرا اقول ان كل ما يحدث لنل فى هذة الايام اننابعدنا عن ديننا وابتعدنا عنالقراءن الكريم"
