text = "حظك يا عم عشماوى الخير جاى لك بالهبل وطبعا بتقبض مكافأة على الراس اللى بتتشنق<br />جاتنا نيلة فى حظنا الهباب<br />واحيانا السيد عشماوى بتيجى لة سفريات الى الدول العربية لتنفيذ احكام الاعدام<br />فا الكويت سابقا اذا حكمت على واحد بالشنق كانت بتستعير عشماوى بتاعنا<br />اما الامارات فبيعدموا بضرب النار<br />على العموم انا ضد احكام الاعدام فى عصرنا الحالى ويفضل الدية الشرعية والسجن - فالدية الشرعية للمسلم بما يعادل اربعة كيلو ونصف ذهب يستفيد بهم اهل المقتول وينفعوا اولادة هنا تبقى الفايدة انما الحكومة تاخدة تشنقة وخلاص يبقى استفدنا اية<br />وطبعا نتيجة الفقر المتفشى فى مصر حوادث القتل هتزيد الايام الجاية كتير وهتزيد حوادث الاغتصاب والسطو المسلح والتوقيف والتحرش الجنسى"
