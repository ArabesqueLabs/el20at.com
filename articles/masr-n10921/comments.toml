text = "انا عمرى ما شوفت هبل زى اللى مكتوب فى التعليق ده !!!!!!!!!!!!!!!!!!!!!!!!!<br />بقى حرب أكتوبر والناس اللى استشهدوا والتاريخ ده كله بقى تمثيلية بين السادات واسرائيل ( برغم تحفظى على شخصية السادات وأفعاله )<br />بقى إسرائيل اللى أعلنت الحرب على لبنان مؤخرا وعملت اللى عملته علشان 2 عساكر هاتعمل حرب كده وكده ( سيكو سيكو ) مع مصر يموت فيها 3000 كلب اسرائيلى علشان الكلام الفاضى اللى انت بتقوله ده<br />بجد بجد تعليق غريب جدااااااااااااااااااا وشاااااااااااااااااااااااااذ جدااا جداااا"
