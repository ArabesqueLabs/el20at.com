[[comments]]
order = 0
subject = "يا حبيبى - دى الخطة بتاع الوطنى لتدويخ الشعب المصرى - الفكر الجديد"
text = "الفكر الجديد بيقول لك<br />المواطن يدخل طابور العيش<br />يطلع من طابور العيش<br />يدخل طوابير الانابيب للبوتاجاز<br />يطلع من طوابير البوتاجاز<br />يقف فى طوابير البطالة والفقر<br />وهكذا<br />وهكذا<br />يقوم المواطن ينصلح حالة<br />ما يفكرش يشرب بانجو ولا حشيش ولا يقعد على القهوة ولا ينام مع مراتة ويخلف عيال ويزيد السكان<br />فكر راقى وجديد<br />يا بختنا<br />كل الناس بتحسدنا على حب حكومتنا لشعبها"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203748/http://masr.20at.com:80/newArticle.php?sid=19277"

