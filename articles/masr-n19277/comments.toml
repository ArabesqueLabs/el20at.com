[[comments]]
order = 2
subject = "يا اخى خلى عندك دم"
author = "واحد من الشعب"
text = "من جانبه، قال اللواء سعيد عرابى، وكيل وزارة التضامن لقطاع التموين إن المشاجرات التى تقع فى الطوابير سلوك شخصى للمواطنين لا يخص المديرية، وحياه امك؟؟ الشعب هو اللى مشاغب وبتاع خناقات؟؟؟؟؟؟؟؟؟؟؟ يا ابو جهل السبب هو قله المعروض والحاجه والزحام والانتظار لساعات طويله فى الشارع و سوءالمعامله والالاطه منك ومن امثالك اصحاب الكروش العريضة ...والتناحه المفرطه...... المفروض قبل ما تتكلم تنزل تقف فى الطابور زى ما هم واقفين علشان تحس باحساسهم بالغضب والذل والقهر والمهانه......... اشك انك بتحس اصلا"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119203748/http://masr.20at.com:80/newArticle.php?sid=19277"

