subject = "رائحة مباحث امن الدولة"
author = "واحد"
posted = "2007-10-08"
text = "مش الناس دى معتكفة وبتعبد ربنا وبتدعى ان ربنا يصلح الاحوال<br />ومش الناس دى مسلمين<br />يبقى فية شبهة انهم اخوان وعايزين يقلبوا نظام الحكم<br />يبقى نطفشهم من الجامع<br />ازاى يا بسطويسى<br />نحط لهم سم فى الاكل يافندم<br />عفارم ياولة<br />تم التنفيذ يا فندم وتم فض الاعتصام بطريقة سلمية"
archived = "2010-03-14"
