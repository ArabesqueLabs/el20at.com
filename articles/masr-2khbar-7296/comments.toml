author = "محمد عبد العزيز"
posted = "2009-08-25"
text = "السلام عليكم<br />الحمد لله انا كنت واحد من المصابين بأسهال فقط<br />وتم نقلنا في سيارة اسعاف<br />ولكن انا اقول ان الاكل ممكن وممكن يكون السبب ولكن هناك مشكلة اكبر هي عدد دورات المياة كثثيييييييييرة جدا وتحدث رائحة بشعة جدا<br />قد تسبب الموت مش الاسهال<br />وانا اناشيد المسؤلين ان يجهزوا دورات ابعد واكبر وبها تهوية جيدة"
archived = "2010-03-14"
