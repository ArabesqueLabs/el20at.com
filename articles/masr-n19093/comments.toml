[[comments]]
order = 4
subject = "امريكا فى العراق احضرت الاسلاميين للحكم وحكم الملالى وفى افغانستان الحزب الاسلامى تحت الامريكان يحكم افغانستان والاخوان سيحكمون مصر بتاييد الامريكان"
author = "مش اخوان"
text = "امريكا فى العراق وافغانستان جعلت الاسلاميون يحكمون<br />وفى مصر سيفعلون نفس الشىء<br />لا تداروا رؤسكم فى الرمال<br />لا زخارى ولا شنودة ولا الوطنى ولا غير الوطنى يقدر يقف قدام رغبة امريكا"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"

[[comments]]
order = 5
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
text = "الى اصحاب التعليقات السابقة والتى يتسألون عن سبب كرهنا للاخوان المتأسلمين !! السبب هو ان اخلاقهم مثل اخلاقكم !! انا اعلم انكم من الاخوان المتأسلمين ولذلك اقول لكم قارنوا بين الاخلاق الراقية للمنتمين الى الحزب الوطنى فى اى حوار او نقاش وبين اخلاقكم سوف تجدون الفرق الشاسع بين اصحاب الفكر وبين العامة والغوغاء وحثالة المجتمع ( انا لا اقصدكم بصفة خاصة بل اتحدث عن الاخوان المتأسلمين بصفة عامة ,, واخيرا انا لست متدين او متشدد وفى المقابل انتم اخوان متأسلمين اى من المفترض ان تكونوا متدينين وعلى اعلى قدر من الاخلاق !! ( فهل علمتم الان معنى كلمة متأسلمين ) اى ظاهرهم غير باطنهم !! هل فهمتم !! اتمنى ."
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"

[[comments]]
order = 6
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
text = "الى السيد / الذى بقول ان امريكا احضرت الاسلاميين الى العراق وافغانستان وغدا ستحضرهم الى مصر !! لا ياسيدى الفاضل من يقف خلف الاسلاميين والجماعات الارهابية هى ايران فى الخارج والاخوان المتأسلمين فى الداخل وللعلم الاخوان المتأسلمين باعوا انفسهم لايران ويبكون مصيرهم مثل مصير حزب الله فى ايران وحماس فى غزة ولو حدث وان الاخوان المتأسلمين وصلوا الى السلطة ( لاقدر الله ) فسيكون مصير مصر مثل مصير لبنان وغزة وسوف تجد مرشدهم العام المتأسلم مختبى فى الجحور مثلما يختبى الان حسن نصر واسماعيل هنية وباقى عصابة حماس المتأسلمة !! لكن هذا اليوم لن ياتى لان مصر يحكمها زعيم استطاع ان يحميها وقت السلم ووقت الحرب وثانيا لان مصر بها جيش من اشرف جيوش العالم لن يبيع نفسة ولن يبيع بلده لمن يدفع مثلما باع الاخوان المتأسلمين انفسهم ."
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"

[[comments]]
order = 7
subject = "ما يسمى بالحزب الوطنى بفشلة الذريع فى ادارة الدولة هو الذى خلق الاخوان المسلمين"
author = "من حزب الوفد"
text = "الحزب الوطنى الكرتونى بقايا الاتحاد الاشتراكى سابقا ليس لة اى وجود<br />المستقبل للاخوان<br />والان الاخوان فى كل مكان - فى فى كل ادارات الدولة من اصغر مستوى لاكبر مستوى<br />لا تضحكوا على انفسكم<br />الحزب الوطنى نجح فى انتخابات مجلس الشعب ب 20 %<br />وتحت ضغط الامن وبالقوة الجبرية تم تحويل الاعضاء المستقلين الى الحزب الوطنى"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"

[[comments]]
order = 8
subject = "حسين كامل وزخارى شخص واحد وهناك تعليمات من منظمات اقباط المهجر بشتم اى خبر يتعلق بالاخوان"
author = "مراقب"
text = "برضة امريكا هتجيب الاخوان زى العراق وافغانستان<br />ومصير النصارى فى مصر زى مصيرهم فى العراق تحت حكم امريكا"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"

[[comments]]
order = 9
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
text = "الى السيد / من حزب الوفد .. تحية طيبة .. جاء فى قولك (( والان الاخوان فى كل مكان - فى فى كل ادارات الدولة من اصغر مستوى لاكبر مستوى<br />لا تضحكوا على انفسكم )) لا ياسيدى نحن لا نضحك على انفسنا بل نعرف الحقيقة كاملة فلولا ديمقراطية حسنى مبارك لما وجدت اخوانى متأسلم واحد فى الشوارع !! لو جاء لمصر حاكم به بعض او قليل من شحصية جمال عبد الناصر لما وجدت اخوانى واحد فى الشارع ولحق الرجال ذقونهم وخلع النساء حجابهم ولما استطعت انت ان تتكلم بالحرية التى تتكلم بها الان على الانترنت !! نحن نعيش فى عصر مبارك عصر الحريات وخصوصا حرية الكلمة ولذلك خرج الاخوان المتأسلمين من الجحور التى وضعهم فيها عبد الناصر فرايت مهدى عاكف وعصام العريان وغيرهم وغيرهم فاين كان هولاء فى عهد عبد الناصر لم نسمع لهم صوت او حس وكبيرهم كان يخشى ان يتحدث مع زوجتة حتى فى الفراش خوفا ورعبا . هولاء اى الاخوان المتأسلمين جبناء لا يظهروا الا مع الديمقراطية !! سؤال وارجو الاجابة !! لماذا اختفوا فى عهد عبد الناصر !! لماذا اختفوا فى ليبيا وسوريا وتونس ومعطم دول الخليج !! هل تعلم لماذا ام ان الموضوع يحتاج الى شرح !! شكرا ولك منى اطيب تحية ."
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"

[[comments]]
order = 10
subject = "الى السيد / مراقب"
author = "حسين كامل"
text = "لاياسيدى حسين كامل ليس هو السيد / زخارى ,, حسين كامل هو حسين كامل واى موقع فى العالم يسطيع ان يثبت اننا شخص واحد او شخصين !! رجاء ياسيد مراقب ان نتعلم الحوار وكفانا ان اى راى معارض لنا يصبح عميل او جاسوس او من امن الدولة !! متى نتعلم الحوار حتى نبقى مثل ادول المتحضرة !! فى فتره الانتخابات الامريكية دخلت فى حوارات مع العديد من الشباب الامريكان من اصول عربية وكم كان الفارق كبير وممتع فى الحوار وشعرت اننى اتحدث مع شباب واعى مثقف وساعتها علمت لماذا اصبحوا اسياد العالم ."
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"
