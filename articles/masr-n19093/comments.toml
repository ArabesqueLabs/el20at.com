[[comments]]
order = 1
subject = "الاخوان المتأسلمين"
author = "حسين كامل"
text = "اقول للرئيس حسنى مبارك ( احذر من الاخوان المتأسلمين ) احذر من تلك الجماعة التى تستغل الفرص وتتاجر باى شى حتى بدماء الفلسطنيين من اجل تقليب الشارع المصرى عليك ومحاولة النيل من مواقفك وحكمتك التى اشاد بها الجميع !! حماك الله يامبارك من شر تلك الفئة الضالة المسماه بالاخوان المتأسلمين"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"

[[comments]]
order = 2
subject = "الى حسين كامل وممدوح زكي زخاري"
author = "مش من الاخوان المسلمين"
text = "ما انا قلتلكم قبل كده وحكتلكم الحكاية بتاعة الاخوان المسلمين<br />1) جماعة محظورة<br />2) نصف اعضائها في السجن<br />ومع ذلك<br />تحتل خمس مقاعد البرلمان<br />وبعدين انتو الاثنين بتكرهوا الاخوان ليه<br />اكيد حد من الاخوان خبطكوا زبر من ورا"
archived = "2009-01-03"
capture_url = "https://web.archive.org/web/20090103054035/http://masr.20at.com:80/newArticle.php?sid=19093"

