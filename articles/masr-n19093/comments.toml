subject = "حسين ناقص وزخارى الكلب"
author = "كس ام زخارى الخارى"
text = "انتوا اكبر خولات ومنايك الاول ظابط مباحث مطرود والتانى كان بيتناك من قس فى الزبالة بتاعت امة وهو صغير"
archived = "2009-01-03"
