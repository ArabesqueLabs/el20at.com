subject = "أمام مدرسة الأورمان بالدقي"
author = "مش كاتب"
posted = "2008-06-08"
text = "ايه يعني الاورمان بالدقي<br />لا الاورمان ولا حي الدقي يمثلوا مصر في شيء<br />يا شاطر لما تروح تعمل تحقيق تاني تروح المرجع وعين شمس حلوان دار السلام<br />ما تروحش الدقي اللي فيها الناس الهاي هاي هاي هاي اللي واكلين حق الناس<br />روح اعمل تحقيق مع ناس متاكل حقها<br />روح المرج المطرية عين شمس واحياء الناس المعدومة كتير اوي<br />بلاش حكاية الدقي والمهندسين دي والنبي لحسن انا بيجيلي حساسية منها"
