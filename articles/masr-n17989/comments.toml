[[comments]]
order = 0
subject = "مقولة عمرو بن العاص"
author = "امة الله (مصرية)"
text = "ارضهم ذهب و نسائهم لعب و رجالهم يجمعهم المزمار و تفرقهم العصا<br />مع الاسف رجال بلادي الان لا ينجدون فتاة في الطريق و يطالبون بمن ينجدهم اذا غرقوا في البحر<br />يظلمون الضعيف و يسبون حكومة ظالمة<br />مشكلة هذا البلد ليس الفساد او الحكومة و لكن الاخلاق<br />انما الامم الاخلاق ما بقيت فان هموا ذهبت اخلاقهم ذهبوا"
archived = "2008-10-30"
capture_url = "https://web.archive.org/web/20081030041452/http://masr.20at.com:80/newArticle.php?sid=17989"

[[comments]]
order = 1
subject = "ارضهم من ذهب , و نسائهم لعب , و رجالهم مع من غلب ,"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "الى الاخ المعلق السابق<br />ارضنا ذهب بس يا خسارة الذهب بياخدوه الناس الكبار بس<br />واحنا بنلم الصفيح من الشارع ونروح نبيعه خرده الكيلو بخمسين قرش"
archived = "2008-10-30"
capture_url = "https://web.archive.org/web/20081030041452/http://masr.20at.com:80/newArticle.php?sid=17989"

[[comments]]
order = 2
subject = "تحية لشجاعتك"
author = "المصرى أفندى"
text = "للأسف هى دى مصر يانهى .شعب فاقد الشرف كما وصفتيه تماما .كلمة الشرف أصبحت موضة قديمة.شعب من كثرة القهر والفقر والمرض فقد الأحساس بالشرف.تحول ألى قطيع يرعى يأكل ويتزاوج ويدعى التدين بالمظهر فقط لاغير.مفيش حيط حتى يمشى جنبه. ثقافته أنضرب باالقفى بس ماتخليش حد يشوفك.أصبحنا ظاهرة صوتية أحسن ناس تتكلم وليس لهم أى تأثير لأن بعد كل كارثة بينسوا حتى تأتى الكارثة اللى بعدها.الخطورة الكبرى أن التحرش أستفحل حتى أصبح تحرش بدنى وفى وسط الشارع ودى المصيبة.أصبحت مشكلة أمنية فى بلد أنعدم فيها الأمن والأمان وأبصبح البوليس هو بوليس سياسى.يافرحتى بأتصال رجالات الداخلية طبعا ده حصل لأنها أصبحت حادثة رأى عام وده كله بسبب شجاعتك.أنا أرفض تماما ربط أسباب التحرش بطبيعة الملابس لأن ده نوع من التبرير وتحيل الضحية الى متهمة والمجرم ألى ضحية .وسيصبح كل واحد قاضى بقى يحكم على اللبس ده لائق وده غير لائق ويعلمونا نلبس أيه ومانلبسش أيهز لازم يكون عندنا الشجاعة .ولا دى حتيجى منين؟! عليه العوض ومنه العوض فى بلدنا اللى مابقتش بلدنا..."
archived = "2008-10-30"
capture_url = "https://web.archive.org/web/20081030041452/http://masr.20at.com:80/newArticle.php?sid=17989"

[[comments]]
order = 3
subject = "تعليقات رجال مصريين علي حوادث التحرش الجماعي"
author = "امة الله(المصرية)"
text = "نهي انظري الي في هذه الصفحة عن اراء بعض الرجال عن حوادث التحرش الجماعي في مصر<br />لتعلموا ان المجتمع في مصر الان ربي ذكوره علي ان ينتهكوا ما يريدون من حرمات فلا ملام لان الملوم دائما هو الاضعف<br />(وعايزين حكومة طاهرة وعادلة تحكمكم طب ازاي و منين ؟؟؟؟؟؟؟؟؟؟؟!!!!!!!!!!) اعدلوا الاول مع ربنا و مع انفسكم و اهليكم<br />http://masr.20at.com/newArticle.php?sid=17796"
archived = "2008-10-30"
capture_url = "https://web.archive.org/web/20081030041452/http://masr.20at.com:80/newArticle.php?sid=17989"

[[comments]]
order = 4
subject = "(تموت نهى و لالالالالالالالالالالالالالالالالالالالا تمسك من صدرههههههههههههههههههههها)"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "تصرف من حرة شريفة بنت اسرة كريمة شريفة<br />نهى انت احسن من مليون راجل من رجال هذا الزمن القذر<br />و شبابة الخرع الورق المتأنس المخنث؟!!!<br />فى الماضى كانوا يقولون(تجوع الحرة و لا تاكل بصدرها)<br />و اليوم شرف لنا ان نقول<br />:_(تموت نهى و لالالالالالا تمسك من صدرها)<br />لك اللة يا مصر فى عيال المستقبل الاسود"
archived = "2008-10-30"
capture_url = "https://web.archive.org/web/20081030041452/http://masr.20at.com:80/newArticle.php?sid=17989"

