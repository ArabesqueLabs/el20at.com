subject = "مصر عنصريه متخلفه"
author = "علي عوض"
posted = "2008-11-05"
text = "اذا كانت فلسطينيه أويهوديه أو مصريه مسيحيه مسلمه بهائيه للأسف تعليقاتكم تشير لنوع من التخلف حتى أنكم عنصريون في الرد على زخارى لانه مسيحي .لا فائده في شعب مصر كما قال سعد زغلول والى الجحيم أيها الرجعيون والمحاكم هي الفصل في هكذا موضوع وليس حثالة وقاع المجتمع أمثالكم"
