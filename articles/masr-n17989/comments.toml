subject = "الى المار زخاري الغبي الاهبل"
posted = "2008-10-31"
text = "اولا عايز اعرف ليه يا حمار مكرر التعليق 3 مرات لانك مريض ومختل ومستحيل تكون انسان سوي زينا<br />ثانيا يا حمار البنت تحمل جواز سفر اسرائيلي يا طور يعني فلسطينية عربية وعايشه في اسرائيل<br />والقضايا اللي من هذا النوع بيتبعها تعويض مدني كبير يعني الفيلم اللي هي عمله دا كله علشان خاطر التعويض المادي وليس علشان خاطر هي شريفة وعفيفة<br />واخد بالك يا حمار"
