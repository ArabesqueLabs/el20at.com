subject = "كلنا في الهوى سوااااااااااااااااا"
author = "جابر العطواني رئيس دولة العطوا"
posted = "2007-05-27"
text = "كلنا في الهوى سوااااااااااااااااااااا دكاترة أو مرضى أو فلاحين أو مهندسين أو غفراء أو ...................................<br />طالما أنك مش من أهل الهبش والنبش . تبقى يحصلك إلي يجرالك . هذه ليست دعوه للهبش والنبش لأن مراكز الهاباشين تبدأ من وزير لحد الراس الكبيرة قوي . فمحدش منا أهل البلد يقدر يصبح هباش لكن على كل حال فرجه قريب<br />مع بداية الاطاحة بدولة مبارك المهلهله .وعاصمتها شرم الشيخ . التى ورثها عن السيد السيد إبراهيم مبارك كاتب المحكمه .<br />فا متزعلوش هو ده حكم مبارك والد الزعيم الملهم (زعزوعة المر بزيادة)"
