[[comments]]
order = 8
subject = "ضع عنوان التعليق"
text = "فلسفة الثعبان المقدس<br />كان الربيع الحي روحا حالما<br />غــض الشباب معطر الجلباب<br />يمشي على الدنيا بفكره شاعر<br />ويطــوفها في مـــوكب خلاب<br />والأفــق يمـــلأه الحنان كأنه<br />قلب الوجود المنتج الوهاب<br />والكون من طهر الحياة كأنما<br />هو معبد والغاب كالمحراب<br />والشاعر الشحرور يرقص منشدا<br />للشمس فوق الورد والأعشاب<br />شعر السعادة والسلام ونفسه<br />سكرى بسحر العالم الخلاب<br />ورآه ثعبان الجبال فغمه<br />ما فيه من مرح وفيض شباب<br />وانقض مضطغنا عليه كأنه<br />سوط القضاء ولعنة الأرباب<br />بغت الشقي فصاح في هول القضا<br />متلفتا للصائل المنتاب<br />وتدفق المسكين يصرخ ثائرا<br />ماذا جنيت أنا فحق عقابي<br />لا شيء إلا أنني متغزل<br />بالكــائنـــات مـــغرد في غابي<br />ألقى من الدنيا حنانا طاهر<br />وأبثها نجوى المحب الصابي<br />أيعد هذا في الوجود جريمة<br />أين العدالة يا رفاق شبابي<br />لا أين؟ فالشرع المقدس ها هنا<br />رأي الـــــقوي وفــــكرة الغــــــلاب<br />وسعادة الضعفاء جرم ماله<br />عند القوي سوى أشد عقاب<br />ولتشهد الدنيا التي غنيتها<br />حلم الشباب وروعة الإعجاب<br />إن السلام حقيقة مكذوبة<br />والعدل فلسفة اللهيب الخابي<br />لا عدل إلا إن تعادلت القوى<br />وتصادم الإرهاب بالإرهاب<br />فتبسم الثعبان بسمة هازىء<br />وأجاب في سمت وفرط كذاب<br />ياأيها الغر المثرثر إنني<br />أرثي لثورة جهلك الثلاب<br />والغر يعذره الحكيم إذا طغى<br />جهل الصبا في قلبه الوثاب<br />فاكبح عواطفك الجوامح إنها<br />شردت بلبك واستمع لخطابي<br />إني إله طالما عبد الورى ظلي<br />وخافوا لعنتي وعقابي<br />وتقدموا لي بالضحايا منهم<br />فرحين شأن العابد الأواب<br />وسعادة النفس التقية أنها<br />يوما تكون ضحية الأرباب<br />فتصير في روح الألوهية بضعة<br />قدسية خلصت من الأوشاب<br />أفلا يسرك أن تكون ضحيتي<br />فتحل في لحمي وفي أعصابي<br />وتكون عزما في دمي وتوهجا<br />في ناظري وحدة في نابي<br />وتذوب في روحي التي لا تنتهي<br />وتصير بعض ألوهتي وشبابي<br />إني أردت لك الخلود مؤلها<br />في روحي الباقي على الأحقاب<br />فكر لتدرك ما أريد وإنه<br />أسمى من العيش القصير النابي<br />فأجابه الشحرور في غصص الردى<br />والموت يخنقه إليك جوابي<br />لا رأي للحق الضعيف ولا صدى<br />الرأي رأي القاهر الغلاب<br />فافعل مشيئتك التي قد شئتها<br />وارحم جلالك من سماع خطابي<br />وكذاك تتخذ المظالم منطقا<br />عذبا لتخفي سوءة الآراب"
archived = "2008-02-12"
capture_url = "https://web.archive.org/web/20080212030954/http://masr.20at.com:80/newArticle.php?sid=13632"
