subject = "الزميلة رضوة"
author = "محمد فاروق"
posted = "2008-01-01"
text = "لما أتكلم عن رضوة فانا بتكلم عن \"الأنسة\" رضوة زميلتي في كلية الاعلام جامعة القاهرة ، ومش بس كدة احدى عضوات شلتنا المحترمة في قسم الصحافة.. تمر السنين وتشتغل \"مدام\"رضوة معايا في مكتب واحد..أكيد احساس مختلف.. خصوصا لأني أنا وهي بنشكل \"جبهة العناوين المتحدة\" المنعقدة يوميا من أجل عيون عشرينات."
