[[comments]]
order = 0
subject = "كله الا التايير والبدلة"
author = "دودو الشامي"
text = "اي خدمة يا ستنا روزا على فكرة الظاهر انك نسيتي تحكي عن روزا وواضح تماما ان حتى اسمك اتغير فاكيد الاستاذ حسن مكنش هيدخل عليكي الصبح ويقول لك بونجور ياروزا نمتي كويس؟ وطبعا انت عارفه مين بيعمل كده<br />يشرفنا رايك فينا ولو اني كنت خايفة مووووووووووووت من موضوعك انت بالذات قلت هنتهزأ للصبح وهنعيش حياة فضايح بقى بس ربنا ستر الحمد لله<br />سنة سعيدة عليكي وان شاء الله 2008 تبقى هنا وسعادة"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002302/http://masr.20at.com:80/newArticle.php?sid=13632"

[[comments]]
order = 1
subject = "يخرب بيتكم ؟"
author = "قارىء"
text = "دا احنا كنا فاكرينكم مدونة بتاع واحد او اتنين من الشباب - طلعتم منظمة او مؤسسة - فيها موظفين ومكاتب ومرتبات باين عليها هاى اوى - انتم تبع مين ؟ ومين اللى بيصرف عليكم ؟ وخصوصا ان مفيش اعلانات عندكم -<br />انتم تبع امن الدولة ؟<br />او تبع اية بالضبط<br />بتجيبوا الفلوس منين<br />لا - يا توضحوا موقفكم يا اما كل واحد ياخد بالة منكم<br />شوية عفاريت"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002302/http://masr.20at.com:80/newArticle.php?sid=13632"

[[comments]]
order = 2
subject = "الموقع تبع مين"
author = "واحد معدى"
text = "الموقع تبع اسلام أون لاين - مادا واداريا على الأقل وان لم يكن بالضرورة تحريريا - ، وأظن أن الأخت مروة تقصد بقسم الأخبار هنا قسم الأخبار باسلام أون لاين ، ولا ايه !؟"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002302/http://masr.20at.com:80/newArticle.php?sid=13632"

[[comments]]
order = 3
subject = "الزميلة رضوة"
author = "محمد فاروق"
text = "لما أتكلم عن رضوة فانا بتكلم عن \"الأنسة\" رضوة زميلتي في كلية الاعلام جامعة القاهرة ، ومش بس كدة احدى عضوات شلتنا المحترمة في قسم الصحافة.. تمر السنين وتشتغل \"مدام\"رضوة معايا في مكتب واحد..أكيد احساس مختلف.. خصوصا لأني أنا وهي بنشكل \"جبهة العناوين المتحدة\" المنعقدة يوميا من أجل عيون عشرينات."
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102002302/http://masr.20at.com:80/newArticle.php?sid=13632"

