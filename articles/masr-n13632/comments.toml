[[comments]]
order = 11
subject = "هية مبسوطة"
author = "M.H"
posted = "2008-02-20"
text = "اية اللي بتقولية دة ياحجة اية خلاص مولد يادنيا روحي شوفي شغل احسن هنقعد نسمع بقى بتحسي بقى وانتي في الاخبار واية وانتي في عشرنات وسايبة الدينا تضرب تقلب --- مش بتقولي انك مسئولة عن الملف السعودي طب ماتيجي تشوفي النصب اللي شغال على ودنة هنا على المصريين وانا واحد من الناس اللي شاف الذل من يوم ما دخلت البلد دي تعالي واكتبي عن معاناه ملايين المصريين وعلى ادوات نصب السعودي على المصري اكتبي على نظام الاستعباد اقصد نظام الكفالة اللي رجعنا لعصر العبودية دة فاضل يحطو في النظام دة انك علشان تبوس مراتك تستاذن من سيدك سووري اقصد كفيلك شوفو شغلكم بقى كفاية الناس متبهدلة انتم ولا هنا عندك حق ما انتي بتسمعي عمر خيرات وبتروحي حفلات على الحجار وخلينا احنا هنا مع السينما الصمتة اتمنى بجد ومن كل قلبي انك تشوفي شغلك وتشوفي الصريين اللي في الغربة وبالاخص ابلسعودية واللهي محتاجنلكم اوي محتاجين لكل انسان ممكن يحاول يغير من مستقبلنا التعيس ويرجعلنا حقوقنا اللي ضيعة ويساوينا باقل الشعوب على الارض ياريت ياريت تحاولي تشوفي الحل اية للمعاناه اللي احنا فيها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 12
subject = "اللي حيرش السعودية بالمية حرشه بالدم"
author = "الى المعلق السابق"
posted = "2008-03-16"
text = "مالك ومال السعودية اذا ما كنش عجبك العيشة هناك خليك قاعد باحترامك في بلدكم انت قاعد في السعودية وانت عارف انك محترم هناك الف مرة اكثر من بلدك على الاقل ليك شغلانه وليك مرتب وبتركب الطيارة كل سنه وبتنزل المطار وانت فارد نفسك السعودية دي بلد رسول الله واهل السعودية دول هما عرب الجزيرة اللي عاش بينهم الرسول صلى الله عليه وسلم فاهم يا ابني السعودية دي ارض مكه والمدينة وارض اهل البيت والصحابة ما لكش دعوة بالسعودية لحسن اقطعك هما حرين في بلدهم يعملوا فيها اللي هما عايزينه وارجع انت بلدك وورينا حتعمل ايه يا فالح"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 13
subject = "جميل يا رضوة"
author = "محمد زيادة"
posted = "2008-03-21"
text = "الاخت العزيزة رضوة.. سعدت كثيراً وأنا أقرأ موضوعك حيث أبعد عنك الاف الاميال، وقد قمتي برصد تجربتك في قسم الاخبار الذي كنا في وقت ما زملاء فيه، وأكثر ما أعجبني فيه طريقة التعبير عن مشاعرك كصحفية في قسم الأخبار سابقاً، ثم رسم صورة لعملك الحالي.<br />موضوع جميل لكنه قد يستفز بعض الناس مثل الأخ الذي يعيش في السعودية، كان يجب عليك مراعاة ذلك.<br />أرجو في الفترة القادمة أن أقرأ لك موضوعات متخصصة في ملفك الجديد بعشرينات والخاص بالسعودية، فربما تصبحين قريبا متخصصة في الشأن السعودي.<br />لكي ولزوجك الغالي تحياتي العطرة"
archived = "2010-03-14"
capture_url = ""
