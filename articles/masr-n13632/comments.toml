text = "الأستاذة رضوة<br />صاحبة القلم المبدع..<br />لا عليك بالريالات.. مكتبك الجديد في \"عشرينات\" السعودية قريباً إن شاء الله<br />الله يصبرك علينا.. وعلى الفريق ..<br />خالص تحياتي"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104082058/http://masr.20at.com:80/newArticle.php?sid=13632"

