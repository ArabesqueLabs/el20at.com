[[comments]]
order = 0
subject = "ارجعوا هذا الوزير الى بلدة فى زفتى يلم جلة فى بلده"
author = "مش فاهم"
posted = "2008-08-13"
text = "المفروض ان الطالب فى الجامعة يتدرب على الحياة السياسية الصح علشان لما يتخرج يبقى مواطن عارف يمارس حقوقة السياسية صح ويختار القيادات الصح - ثم انة مش بمزاج الوزير انة الطلبة اللى قادوا الحراك السياسى فى مصر من 70 سنة بالمظاهرات والاحتجاجات ان كلامة هيمشى - دة بيخرف ويظهر انة خبط صحن مش مع فحل بصل وتكرع الكلام الفارغ دة وسخر من كلام عضو المجلس المحلى<br />بخصوص تقليل عدد طلاب كليات الطب فى مصر اللى بيدخلها ولاد الشعب المصرى الفقير - السنة اللى فاتت اتخرج الفين طبيب من الجامعات خارج مصر وهم طبعا اولاد الطبقة الغنية اللى بيشحنوا عيالهم الى الخارج قبرص او بولندا او حتى الهند وان شاءاللة مجموعهم 60% ويرجعوا ببكالوريوس الطب ويدخلوا النقابة<br />انا مش فاهم اية اللى بيحصل فى البلد دى"
archived = "2008-08-14"
capture_url = "https://web.archive.org/web/20080814132813/http://masr.20at.com:80/newArticle.php?sid=17233"

[[comments]]
order = 1
subject = "دكتور هانى هلال و زير التعليم العالى_بارك اللة فيك"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-08-24"
text = "لقد حسم و زير التعليم العالى عندما طالب صراحة بان الحرم الجامعى للتحصيل و الدرس و العلم<br />و ليس ملعب للعب كرة السياسة بداخلة<br />الاحزاب و المنابر السياسية الان زى العدد فى الليمون و على الجميع ان يختار<br />العلم يجب ان يكون لطلاب العلم<br />اما السياسة فيجب ان تكون لطالبى السياسة و ليس طالبى العلم<br />دكتور هانى هلال الف شكر على صراحتك فى قول كلمة الحق"
archived = "2008-08-24"
capture_url = "https://web.archive.org/web/20080824210522/http://masr.20at.com:80/newArticle.php?sid=17233"
