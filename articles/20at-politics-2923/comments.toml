subject = "اين المشكلة؟"
author = "سيرانة"
text = "والله انا اول ما شقت الصورة اندفعت وصرت بدي احقد على نجاد<br />وبغض النظر عن كل انتقاداتي لنجاد لبحثه عن مصالحه الشيعية فقط<br />بس لا يمنع انو احنا حربنا مع الاسرائيليين مش مع اليهود<br />ومع معنى انو واحد بسلم عليك انو بحبك او انو مش راح ينقلب عليك في الوقت المناسب<br />في الاخر الحرب خدعه والدنيا ما بتيجي بالبلطجة ... أسمها سياسة"
