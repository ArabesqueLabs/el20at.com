text = "الصوة للرئيس الإيراني مع مجموعة من الحاخامات الإيرانيين وغير الإيرانيين في المؤتمر الذي عقده من أجل بحث قضية الهولوكوست، يعني لا أرى أي شيء غريب في الصورة سوى أن أناس يسلمون على بعض وخاصة أنهم من يحملون نفس الجنسية، يعني نفس الأمر عندما يقوم مثلا الرئيس المصري المسلم بمصافحة وتقبيل شخصيات مسيحية مصرية."
