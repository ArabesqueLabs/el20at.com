text = "اذا كان المسيحيين في مصر يعانون من التمييز بسبب عقيدتهم المسيحية فلماذا يدقون الصلبان علي ايديهم بالوشم وعلي صدورهم في السلسلة اليس في هذا تناقض؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
