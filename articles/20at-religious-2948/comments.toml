subject = "مش هيك"
author = "عمر بشارة فلسطين"
text = "الصراحة وبدون تحيز ما في عند الفلسطينيين أي نظرة عنصرية أو طائفية أو مذهبية،وبصراحة أكثر في عندنا نظرة تمييز سياسي \"فتحاوي ولا حمساوي\" بغض النظر عن الدين.أما بالنسبة للتشريع الفلسطيني فهو مناسب نوعاً ما وذلك للحفاظ على قيم ومبادىء الاغلبية المسلمة ،والافت للنظر إقتناع المسيحية الفلسطينية بذلك."
