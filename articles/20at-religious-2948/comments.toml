[[comments]]
order = 5
subject = "علاش ؟"
author = "مغربى"
text = "علاش تقول هذا يامصرى<br />نحنا عنا بلمغرب كل مسيحى يضع صليب على يدة او بصدرة<br />هدا حرية لة ومابنعارض فيها<br />لكن عنكم بمصر واضح انك عم بتعارض لكن اقول لك واللة اقباط مصر اللة معهن<br />بجوار مايحدث من ارهاب وكيما حدث بالازهر<br />تعو عنا يااقباط مصر المغرب بتعجبكم كتير وعم تحبوها وتحبونا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "تعليق على رد"
author = "هدير"
text = "والله يااخ مغربي الاقباط فى مصر هنا عايشين زيهم زى المسلمين وماعتقدش ان فى مسيحى فى مصر يقدر يقول غير كده لان دى الحقيقة وبعدين احداث ارهاب ايه دى الى بتحكى عنها؟؟؟؟؟؟؟؟؟<br />هوه حد عمل ارهاب للمسيحين؟؟؟؟؟؟؟؟<br />ياريت مش تخلط الامور ببعضها وتقرا كويس الاخبار<br />وبعدين ماتتكلمش اوى كده عنكم فى المغرب ده لسه صحيفة عندكو منزلة شتايم عن الرسول والصحابة والملايكة<br />يعنى المسلمين اصلا والاسلام مش محافظين عليهم هتحافظو على الاقباط؟؟؟<br />عامة الله يعينكو<br />وهو الى عايز يجيلكو يتفضل مش بنقول لحد لا"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "لا"
author = "تينا"
text = "احنا بنشكر ربنا اوى اننا عايشين فى مصر<br />لانها بلد الامن والامان<br />وليا صاحبتى مسلمة وبامانة بعيد معاها فى عيدها<br />وهى بتعيد معايا فى عيدى<br />وكل اهلها طيبين موت<br />واحنا والمسلمين اخواااااااات"
archived = "2010-03-14"
capture_url = ""

