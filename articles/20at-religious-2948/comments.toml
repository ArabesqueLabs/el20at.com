subject = "لا"
author = "مارك"
text = "لا احنا المسيحيين علامة الصليب تكن على ايدينا وصدورنا حماية لنا<br />مثل انكم تربون دقونكم او تلبسون قبعة بيضاء<br />فهذا ليس مشكلة ان نضع صليب على ايدينا او فى صدورنا"
