text = "والجدير بذكر انا الفنان احمد عبد الوارث عبد الحكيم لاشين من قرية العجايزة والدكتور حمدى لاشين من اوائل عمداء كلية الزراعة من اوائل الحاصلين على درجة الد كتوراة واللواء صلاح عبد العاطى اول من اسس جهاز محو الامية ورئيس سلاح حرس الحدود والسيد/ صلاح يس لاشين احد الصف الثانى من الطباط الاحرار وعضو مجلس الامة واللواء حمدى لاشين وكيل المخابرات العامة المصرية واللواء عصام الشيخ مساعد وزير الداخلية والحاج محمود العربى من اكبر رجال الاعمال فى مصر واحمد عز"
