order = 0
subject = "نظرة تأمل"
author = "علي"
posted = "2007-03-18"
text = "ادهشتني الجرأة التي يتحدث بها نجاد على الغرب وكأنه واثق تمامآ بعدم جدوى العقوبات ومتأكد بأنه عنده كرت قوي جدآ يولح به للغرب وال\"شرق\" وان الضربة العسكرية لها درع قوي هل هو نووي؟ او صاروخي تقليدي؟ العرب لم يتعدودوا ان يروا خطاب او جهة مقابلة للغرب تتحدث بهذه الجرأة والحماس وهذا ما اثار سخط البعض من نجاد فهم لم يدخل بمخليتهم ابدآ ان تنشأ قوة مقابلة لامريكا بالمنطقة فيعملون على تدميرها اعلاميآ وسياسيآ وعسكريآ كم فعلوا بمصر في السبيعينات و بالعراق بالامس القريب.<br />لا اريد ان اضع العرب بسياقي فهم لا وزن لهم اطلاقآ ابدآ لا بنفطهم ولا بقوتهم بعد احتواء وتدكير العراق وتهميش مصر ومحاصرة سوريا والتبعية المطلقة بالسر والعلن. ننتظر المفاجاة الموعودة من نجاد."
