subject = "الخيار بايديكم"
author = "مسلم"
posted = "2007-04-18"
text = "يا شباب الاسلام ، الخيار بايديكم أن تصنعوا مستقبلكم بانفسكم ، ولسنا نحن العرب باقل من الايرانيين او الاوكرانيين أو غيرهم من الشعوب .<br />ما عليكم يا شباب - الا أن تعلموا أن عدوكم الاول هم الطواغيت (الحكام) ، فاولويتكم هم الخلاص منهم ، ثم يبدأ عصر النهضة ، وماداموا موجودين فلا عزة ولا كرامة ، بل تبعية وتهميش."
