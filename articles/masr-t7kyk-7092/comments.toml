text = "أيكرمنى الله بأبن مثلك !!!! اللهم بحق وجهك الكريم وعزتك وكرمك ومجدك القديم الباقى ابد الآبدين اعزنى واكرمنى بذرية<br />صالحة مثل الشيخ محمد فرج . فلم ارزق بعد بالذرية فإنك على ماتشاء قدير وما ذلك عليك بعزيز . واحفظه القرآن ويكون<br />فى سبيلك وهل يعقل ان يكون هناك مؤمن موحد محب لله ورسوله يتقاضى اجر على قرآتة للقرآن . حفظك الله يا محمد<br />وحفظ اباك وجعلنا من اهله وخاصته الذين هم اهل القرآن و خاصتة"
