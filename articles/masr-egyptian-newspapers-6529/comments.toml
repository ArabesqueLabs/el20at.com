subject = "البلد دي بلد مين؟!!!!!"
author = "حسام الزمر"
posted = "2007-07-03"
text = "السلام عليكم<br />المشكلة ان ما فيش حد حاسس ان البلد بتا عتة . و الكل حاسس انها مصلحة بيقضيها و الامور تعدي و لو باظت ما هي مش بتاعتنا و يكش تولع بصحابها<br />و المأساة انها ولعت بجد بس ولعت بينا مش بحد تاني<br />والسبب اننا كلنا حاسين اننا خدامين فيها مش شركاء و لا أصحاب بلد<br />نادر لما حد ياخد على قد ما بيدي أو حتي الحد اللي يسترة و الكل مضغوط و مش حاسس باللأمان و فوق كدة حاسس بالظلم و ده اللي بيخليه يقول يكش تولع<br />السؤال هوه ازاي كل واحد مننا يحس ان البلد بلدة و انة لازم يحافظ عليها لنفسة و لأولادة؟<br />ازاي؟؟"
archived = "2010-03-14"
