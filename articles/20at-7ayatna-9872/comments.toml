text = "اعطني شعبا لم يضع العصا في طيازكوا يا اخس شعب واسفل شعب وانذل شعب بين شعوب الارض قاطبة.. يا معفنين يا اولاد القحبات.. يا اولاد فاطمة السلطية.. الانجليز ناكوكوا بعلبة علاوة.. نسوانكوا كانن ولا زالن بنتاكن من شان قلم حومرة والا قميص نوم احمر من شان الثور اللي عندها.. الامريكان مشغلانكوا قمرجية عندهم من شان شلطوكوا مصاريكوا اللي اجت من رواتبكم اللي بدفعها الموساد.. اليهود مشغلينكوا كلاب حراسة وفية على اطول خط مجابهة.. اجرتوا ارضكوا ل99 سنة في الباقورة في الغور الجنوبي والشمالي ولكوا فش شعب احط منكوا.. يا شعب ابو حنيك.. يا اشرف واحد فيكوا ما بيجي كعب كندرة في رجل فلسطيني اللي علم العالم كلو شو الانتفاضة وشو الثورة.. فيما انتوا يا خريات ارضكوا كانت محتلة ما حدى دري فيها لانكوا شعب واطي خسيس تافه بلحق اللي بطعمه يعني زي الكلاب الضالة.. اخص عليكوا ولكوا لو عندكوا ذرة شرف ما بتسبوا اسيادكوا الفلسطينية اللي نقلوكوا من شعب لا يعرف فن الخراءة الى شعب بقعد على الانترنت بس يبدو ان اصلكوا بردكوا يا جماعة القمل والبراغيث يا اللي امك كانت تغسل ثوبها بحجر وتقعد تستنا فيها لما ينشف من القمل والسيبان وتوخذ نصيبها وهي مشلحة من حمار مربوط جنبها تحط زبه بكسها.. يا اللي اختك بتنتاك من شان كلسون احمر.. اخص عليك يا واطي يا اخو الشرموطات.."
