[[comments]]
order = 3
subject = "إلى محمد نواف"
author = "فراس عبده البطاينة"
posted = "2008-09-20"
text = "محمد نواف<br />ولكـ قبل ما تيجي تحكي وتزاود على فلسطين . . روح دور وابحث عن اصلكـ منيح<br />أنا متأكد ما رح ترجع تحكي<br />لأنك ما رح تلاقي أصــل<br />فلسطين تاج على راسكـ وعلى راس كل العرب<br />وباعتراف من الجميع<br />روح شوف الصحتفة<br />شوف مسؤولينكوا كيف بيخجلوا يطلعوا على التلفزيونات<br />ليش ؟؟!!<br />مش لأنو العار على وجوهكوا<br />مش بيكفي غزة واقفة بوجه اليهود لحالها<br />وهاد شرف للعرب<br />بس يا خسارة<br />العرب ما بيحبوا شي اسمه شرف<br />انت واحــد حقيـــر. . . وكـل واحد بيقرى كلامك بيعرف هالشي<br />طبعا رح تكره فلسطين وتحكي انها انتهت<br />كيف ما تحكي هيكـ وانتو سلمتوها زمان لليهود<br />بس احنا لأنا شرفاء وما بنرضى الذل . . . وهيكـ تربينا ما رضينا نسلم متلكم<br />بيكفي عاد<br />ارجعوا لعقلكم وفكروا منيح رح تعرفوا مين الشريف ومين الخاين<br />كم واحد من الاردن أو من العرب كلهم طلع يقول أنا ضد يللي بيصير بغزة<br />لا ليش يحكي هيكـ . . . طبعا هو مـع ! مش زمان سلمتوها لليهود همي<br />بكفينا نطلع مسيرات وتظارهرات كاذبة بس<br />عيب يا عمو عيب ^_^"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "فلسطينية رافعين راسنا علطول"
author = "مها ابراهيم"
posted = "2008-09-20"
text = "سلام عليكم<br />أولا بحب أرد على الأردني محمد نواف اللي مع احترامي الشديد للحمير لأنو مش فاهم اشي في الدنيا اللي حواليه ،،، الفلسطينيه باعو أرضهم اه ،،لو انك مره وحده حاولت تقرأ في التاريخ كان ما حكيت هيك بس أنا بقلك اشي هوه صح لازم الفلسطينه يتبعوا معكم \\\" وأعرض عن الجاهلين وقل سلاما \\\" بس أنا حبيت أرد عليك عشان أفهمك شو الوضع بلكي فهمت شو بيصير حواليك ،، انا ما زعلت منك لا والله انا بس زعلت عليك ،، زعلت كيف انكم أتباع للملك تبعكم اللي باع فلسطين وكل دمارنا وبلانا من تحت راسه،،، زعلانه انك جاهل وعمرك ما قرأت مراسلات حسين مكماهون ولا عمرك ما سمعت شو عمل الملك فيصل ..<br />احنا عارفين حالنا ومش رح أناقشك أكتر بموضوع أرضنا اللي راحت تحت تهديد السلاح والعنف والدمار،، مش رح أناقشك بانو في ناس طلعت من بلادها وتركت مصاريها في بيوتها لانها كانت حاطه أمل على الجيوش العربيه اللي جايه بعد يومين<br />مش رح أقلك مين اللي وقف الجيش الاردني والعراقي والمصري من انه يكمل قتاله في فلسطين ،،، روح اقرأ وشوف ،، ما تضلوا عايشين حياة البدو اللي مش فاهمين وين الدنيا رايحه<br />انا بس بدي أقلك احنا طلعنا بس بشرف بس عيب على اللي ببيعوا أراضي الأردن لليهود ،، روح شوف قديش صارت نسبة الأراضي الأردنيه باسماء يهود في الوقت اللي ممنوع الفلسطيني االلي ما معه جواز اردني يشتري أرض ،،، اصحوا يا أردنيين يا نايميين وما تضلوا ماشيين تحت ملككم اللي مغميلكم عيونكم ومشيكم<br />روح شوف شو التسهيلات اللي بتنعطى لليهود في بلدكم وانتو نايمين ،،، بس شو بدي أقول<br />ما انتوا امه لا بتقرأ ولا بتكتب من وين بدكم تتعلموا هادا الحكي ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "تعليق على كلام المخنث محمد نواف"
author = "محمود عبد الحميد الكركي - الخل"
posted = "2008-09-21"
text = "قبل ما تحكي يا كلب انو الفلسطينية انهم هم يلي باعوا ارضهم<br />روح اسأل ملككم مين باع اللد والرملة واللي لهلا عم بساومو كانها ارض يلي خلفوا وخلف ابوه<br />وقبل ما تسير ترمي حكي على الفلسطينين روح شوف بيوت الدعارة يلي منتشرة عندكم<br />طبعا كل فلسطيني لازم يوصل للاردن لازم يتفتش كانه شايفينه ارهابي اما لما يوصل يهودي متل اشكالكم بتبوسوا رجليه<br />وبعدين تعال هون يا عسل بتقول احنا اتهجرنا عن ارضنا برغبتنا<br />وين كان جيشكم ايام ال48 وايام ال67<br />اعملتوا انكم نازلين على الحرب وقعدتوا كم يوم بالحرب بعدين اعلنتوا انهزامكم طبعا مهي كانت مدروسة الشغلة بنضحي بكم جندي عشان نرضي تاج راسكم اليهود وحبايبكم<br />وعفكرة معظم المجمعات عندكم اصلها لليهود روح شوف الصويفية وعبدون<br />ولك بكفي انهم الفلسطينية لهلا بحترموكم اما لما نوصل الاردن كل المخابرات بتشتغل علينا<br />عالاقل بندافع عن بلدنا بشرفنا بكرامتنا بدمنا<br />انا بعرف وانت بتعرف انه نص اراضي الاردن صارت للحريري بعد لعبة قماار وابصر مين ابصر لاعب قمار وخسران فيها<br />وبعدين ما بنعزم اشكالك عشان نطلب منهم مصالح لانها اصلها اشكالك من كلامك واضح كيف انك وطني وبتحب الاردن<br />فما تعمل زعرنجي زمانك وانك بتعرف كلشي وانك ازعر<br />ولك اصغر طفل عنا بضيعك بشربة مية<br />لا عامل حالك فهلوي<br />صحيح انك عليوة ههههههههههه<br />باين عليك بتضحر مسلسلات الاردن كتييير يا اموور<br />نام بحضن ماما وبابا واتغطى بالليل عشان تبرد وخليك بايا يحكيلك قصة اجدادك كيف باعوا فلسطين عشان النسوان<br />اموووت فيك يا أردني<br />ودشركم من شعار الاردن اولا<br />بتحب تعرف شو صفاتكم<br />1.<br />2.<br />3.<br />4.<br />يفضح عرضكم ولا صفة فيكم<br />بعدين قبل ما تحكي يا محمد عن رؤسائنا شوف كلابكم وين بتسهر كل ليلة<br />لا احلى ما فيكم هو كتب التاريخ يلي عندكم عم بتغنوا بالنصر انكم حققتم اشي وانو ملكم حرر فلسطين<br />اصلا اول من سلم فلسطين لليهود هو انتوا يا كلاب<br />ولما يسير تقدم بقولوا انه الاردن ساهمت بتقديم خدمة للشعب الفلسطيني<br />مش بدكم ما نحكي عنكم<br />حط كندرة بتمك وبتم كل واحد بيدخل في قضيتنا<br />ولك لولا ملككم الكلب القحبة كان من زمان اتحررنا بس انتوا المستفيدين يا كلاب<br />شوفوا كيف عماراتكم صارت<br />سنة الــ99 كانت الاردن صحرا وهلا صارت متل امريكا كل هاد عشان عم بتبيعوا بدم شعبنا<br />روح لماما يا روح ماما وقلها يا ماما بدي تفهميني من اول وجديد عشان افهم القضية صح<br />بس مش عارف ليش انه عم تحكي وانت نايم في بيت دعارة<br />ولك اول بلد عربي بينتشر في الزنا وبكل فخر هو بلدكم<br />ضبوا بناتكم في بيوتهم وبكفي ترموهم بالشارع عشان يزنوا ويجيبوا مصاري ولما تنكشفوا بتسير بتخافوا على شرفكم وبتقتلوها<br />ومتل ما قلتلك خلي ماما وبابا يحكولك قصة سيدو الملك يلي ربنا ريحنا منه كيف باع فلسطين هو واخوته واولادو<br />صحيح متل ما قالت ليلى .........."
archived = "2010-03-14"
