posted = "2008-11-03"
text = "كلمة ورد غطاها للخنزير ابن الخنزيرة محمد نواف .. اذا كنت رجلا فقط ضع رقم تلفونك.. واعدك انني ساتصل بك واتيك فردا.. فواجه ان كنت رجلا.. وانا على استعداد ان اتيك ولو كنت في جزر الواق واق.. تشبه ولو لمرة واحدة بالرجال وضع هاتفك.. وساعلمك من هو الفلسطيني الذي تتطاول عليه يا اخو القحبة.. يا اللي طياز الاردنية والاردنيات كلها سباعية مثل نجمتكوا السباعية واللي ازباب اسيادكوا الانجليز سباعية يعني بتيجي فيكوا لصم للايقز يا ابن الكندرة.. انا بنتظر وانا على الوعد واقسم بالله عندما اشاهدك لن اضربك ابدا.. بل ساضع خراك في فمك والعصا في طيزك لكي تشعر بوضعك الطبيعي والتاريخي والجغرافي"
