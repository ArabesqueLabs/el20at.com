[[comments]]
order = 1
subject = "غزة"
author = "زهرة المدائن"
posted = "2008-08-16"
text = "اريد الرد على الاخ العربي محمد نواف واقول له انت اكيد غير مسلم لتعرف ماهي فلسطين وما هي مكانتها هذا اولا اما بالنسبة لكلمة باعوا اراضيهم لايا اخي المثقف ولكن العصابات الصهيونية هاجمتهم بالقنابل و الرصاص فما كان لهم الا ان يفرو من ديارهم بامل العودة والان يحلفون انهم لو توقعوا بلحظة انهم لم يعودوا لما خرجوا منها الا جثثا ودليل ذلك انهم ما زالو محتفظين بمفاتيح بيوتهم وتركو الغالي والثمين بديارهم ظنا انها نزوة صهيونية مؤقتةفلم ييقنو معنى الاستيطان والافكار الصهيونية الاوروبية فكان الجهل العربي منتشر في تلك الاونة واخي العزيز والله لو انك تعيش الان في فلسطين وتعيش الماسة التي يعيشها اهلها لبكيت قهرا و ندما على ما تقول فلقد نجح الغرب و الخطط الصهيونية ان تؤثر فيك وانا اكلمك من غزة وقبل اعوام هدم بيتي فوق راس عمي واستشهد واعتقل ابي في سجون الاحتلال الغاصب ووعذبو جدي العاجز امام الاعين لانه طلب منهم رؤية اولاده والله يااخي نحن في فلسطين نعيش ماساة حقيقية وارهقتني الحسرة والدموع عندما قرات ماكتبت وشكرا لك على الدعم الروحي والاخواني الذي قدمته لاخوانك في فلسطين"
archived = "2010-03-14"
