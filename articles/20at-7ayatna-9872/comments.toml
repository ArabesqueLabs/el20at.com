text = "ولك يافلسطيزيه يابنت القحب .. احكي اسمك مش ممكن أكون شامك وفاتحك سباااااااااعي وإنتي مش عارفه مين اللي ناكك وفتح كسك سباعي .. احكي اسمك ياشرموطه .. يابنت الداشرة العارهرة العاهرة .. بنت الفالته الدايرة بالشوراع .. ولك إنتي لوفيك ذرة أو جزء من الأنوثة كنتي مابتحكي كلامك هاذ اللي بسم البدن .. ولك إنتي وأشك فيكي إنك زلمه مش مره .. أي يلعن شرفك .. ولك نايك كل بنات فلسطيز وحده وحده .. وأولهم إنتي ياحلوة ياقمر ياعسل ياحلو إنتا ..<br />ولك إنتي بتعرفي إنتي عبارة عن بنت فلسطيزية .. مش معروفلها أصل من فصل .. ملهاش هوية أو حتى جواز .. فايعة صايعة دايرة فالتة داشرة بالشوراع .. بتترجى الشباب عشان ينيكها مش بفلوس لأا ببلاش كمان !!!!!!!<br />ولك إنتي مكانك المراقص والملاهي والبارات والخمارات والديسكوهات والكازينوهات وكلوووووووووووووو .. الله يلعن شو قحبة وشرموطة وعاهره . ولك منيوكة إنتي .. مافي عنك إشي اسمو أخلاق أو قيم أو مبادئ أو أحساس بتأنيب الظمير .. يعني بالعربي وبالمشرمحي وحده غبية وهبلة وتيسة وملطوشة وسطلة وريالتها شاطة لرجليها .. وكس أمك ع أم اللي خلفوكي بنت حراااااااااااااااام ..<br />اسمعي أنا بنصحك تروحي دوري عن أمك وأبوكي !!! ماشي .. هع هع هع هع خخخخخخخخخخخخخخ ههههههههه<br />فلسطيزنا .. فلسطيزنا .. مدعوس تحت طيازنا .. مش مره ولا مرتين ولا ثلاث ولا حتى أربعة ..<br />فلسطيزنا .. فلسطيزنا .. والكل يحكي فلس وقع تحت الطين .. ولقيناه في طياز أسيادنا الأردنيين ..<br />فلسطيزنا .. فلسطيزنا .. وما أدراك ماطيزنا .. طيزنا .. هي لكم يا أردنيين .. وأكساسنا كذلك ..<br />فلسطيزنا .. فلسطيزنا .. فلسطيزنا .. فلسطيزنا ... النشيد الوطني الفلسطيزي .. ههههههههههههههه ردو تا أشووووووووووووووووووووووووووووووووووووووووووووووووووووووووف !!!"
