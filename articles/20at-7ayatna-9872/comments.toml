[[comments]]
order = 6
subject = "الله يلعن شرفك يا البعيد"
author = "حمد القطيش"
posted = "2008-09-29"
text = "ولك يعاشق فلسطين يا اخو الشرموطة شو عملولك بدو الاردن. . . هل ناكوا أو قودوا على اختك وبنتك . . . خليك شوي عقلاني يا منيك . . . شعب الاردن استضافكم وخلاكم مثل البشر . . . في حين الفلسطينيين في سوريا ولبنان حاطين عليهم شيط مثل \"البهايم\" او اضل سبيلاً . . . الله يفرجينا فيكم يوم . . . سبو على الانظمة . . . حرية رأي . . . اما تسبوا على الناس والعشائر ذات الاصول العريقة . . . مش مثل حضرتك . . . ما حدى عارف صلعت جدك منين . . . اتوقع ان اصله نوري أو منيك . .<br />وبعدين . . . متى كانت شرق الاردن لشكالكم؟؟؟ اذا بدك ترجع للتاريخ القديم . . . انتم نصابين ماهرين . . . بعتوا اراضيكم وبيوتكم وحتى سطوح بيوتكم لليهود قبل 48 وبعدين صرتوا اتطلبوهم فيها نصب على اصوله....<br />الله ينتقم منك ومن اشكالك الذين يزرعون الفتنه بين البشر. . .<br />يامنيك<br />alqutaish@yahoo.ca"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "أردنيين وما ننظام ومهرك يا الأردن غالي"
author = "محمد نواف"
posted = "2008-10-08"
text = "أولا أريد أن اتوجه بالشكر والتقدير لــ : (محمد القطيش) وبدي أقول هونه كلمة لهذوله المقلبين بالفلسطيزيين يعني أنا مش فاهم .. ليش الواحد بعمل مع كل الناس خير وبساعدهم وبعاونهم، وبردوه بالمثل ؟.. إلا الفلسطيزيين .. بتعمل معاهم خير وبتساعدهم .. بروحو بقلبو ظدك .. وبصيرو مش معك بالمره . وفوق كل هيك أشرمط وأنيك وأكلب وأنذل وأحقر وأوطى وأسفل وأرذل شعب في العالم بلا مناااااااااااااازع .. ماشالله عليكو محتليين الصداره أنتو .. وقال شو قال فلسطين أم الدول قال أي كس أختها من دولة نايكينها اليهوووووووووووووووود واحد واحد .. ولكو اللي مش عاجبيتو العيشة بلادنا بوجه ع أقرب جسر وينخلع من بلادنا والخلعة اللي تخلع رقبتو وتخلخل عظامو وإنشالله بتكسر وبتشقف ميت شقفة وشقفة أي كس أم شرفكو ولاد منيوكه عارهره داعره، يعني فوق ما حنا مفظليين عليكو وعلى اللي خلفوكو وعلى كل فلسطيزي أجرب مقلعط مش لاقيله دفشة ولا دزه .. ويلا يلا تا شايف قدامو .. فعلاً !!! إنكو ناس حقرا وأنذال ووسخيين ومعفنيين وجرب ومفطسيين وهبايل وكلاب ولاد كلاب ولكو إنتو في دمكو الكذب والغش والحقد والنميمة والحقد والكره والضغينة واللئم .. الله مجمع فيكو كل وسخ وخره هالدنيا والعالم وحاطه فيكو .. سبحان الله !!! يعني الناس بتحاول إنها ( ه ) تحترمكو .. وتقدركو .. وتسويلكو مكانة ومستوى .. وإشي عليه القيمة والفايدة .. بس إنتو مامنكو فايدة بالمره .. يعني أنا الصراحة .. مش من طبعي أو حتى من صفاتي إني أسب سوى إنو شفت إنو فاظ الكيل .. والوعاء امتلا وصار لبرا .. فقلت فحالي وفنفسي صار لازم أتدخل وأسب وألعن وأفضحكو كلكو فرداً فرداً .. يعني أكبر دليل إنكو ناس شاطرة .. ومتفصحنه .. ورايقة .. وفاضية .. وماعندكو شغله ولامشغله . ولا حتى عمله .. إنكو نازليين سب فينا على ولا إشي .. يعني القافلة تسير والكلاااااااااااااااب ( اللي همه إنتو ) تنبح وتعوي ..!!! والواحد عندكو لما يكبر شويه ويصير يفعفط ويسب ويلعن ويكفر ويصيع ويشرب ويحشش ويعيش متوحش !! يعني كبر بالنسبة إلكو !!! مساكين ويانيالكو على عقولكو يا فلسطيزيه !!! والله ناس فاضية ومرتاحه وولا اللي عندها .. ناس عايشه من القلّه !!!<br />يعني بعتو أرضكو .. وبعتو كل إشي بخصكو .. بعدين طلعتوا من أرضكو زي الشراميط ورحتوا بكل هالدنيا وصرتوا تلفلفوا فيها دولة دولة .. والدولة اللي بتعجبكم بتبسطوا فيها وتقعدوا فيها ومستحيل تتخلوا عنها .. ومنها أرظنا ( الأردن الغالي * ) يالله كيف سويتوها يا ولاد القحبة الشرموطه المنيوكة الممحونة المفتوحة الداعره ؟! بس آآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآخ خليها بالقلب ترجح ولاتطلع لبرا وتفظح ..<br />فليش يعني الغلط والسب .. هذوله الحثالة المرتزقة الخونه العملا الجواسيس اللي واحد منهم بشتريهوش بنقله وشلن .. لا بالعكس بتفو وببزق بنص وجهو وخلقتو وشكلو المعفن وبلعن تعريص كس أختو وأمو خوات شرموطه داعره عاهره ممحونة فالتات ودايرات وداشرات وصايعات بالشوارع .. صحيح منتو إنتو الفلسطينية ولاد حراااااااااااااااااام، لقطاء يعني أو بالأحرى ولاد زنا .. كس أمكو وخواتكو فش واحد فيكو ابن حلال وجاي عن طريق شرعي كلو بنيك بكلو عندكو ..<br />المشكلة إنو الكلام معاكو بنفعش .. بدكو الواحد يدق راسكو مزبوط وينيك أعراظكو وشرفكو ويحمل كل بناتكو الشرموطات القحبات المفتوحات الممحونات المنيوكات الداعرات العاهرات الفالتات الفايعات الصايعات الدايرات بالشوارع البايعات شرفهن لمين مانكان ؟؟ والله دنيا غريبه لما الواحد يحكي معاكو كزلمه .. بتحبوش هاذ الإشي . منتو شراميط .. بدكو الواحد يكون زيكو بالضبط .. بس والله والله والله حاااااااااااااااااااااااااامض على بووووووووزكوووووووووووووووووووووووووو يا فلسطيزية منيح هيك .. وفشرتو إنتو وأحسن فلسطيزي داعس ع رقابكوووووووووووووووووووووووووووو كلكو واحد ورا الثاني .. حلو الكلام ...<br />يعني والله أنا بشفق عليكو من شعب ماكل خرا من جميع الأصعدة والجوانب المختلفة . يعني شعب كس إمو من شعب شرررررررررررررررررررررررررررررررررررررررررررممممممممممممممممممممممووووووووووووووووووووووووووووووووط .. قال رنتيسي وياسين وأبو عمار ( أبو حمااااااااااااااااااااااااااااار ) .. وكس أخت أسماءكو كيف هيه !!!<br />إنتو اللي رح توكلو خراااااااااااااااا بالملعقة والشوكة والسكين ... وبالنهاية .. وكلمة أخيرة لكل أردني نشمي على وجه الكرة الأرضبة .. وووين ما كان .. بقلو وأنا هونه من موقعي ( الإمارات ) .. إرفع راسك لفوق لفوق لفوق وخليك عنيد وراسك يابس مش زي الحجر لأ أقوى من الحجر بكثييييييييييييييير .. وخلي عينك جاويه .. بتقدح شرارة .. قوية .. واللي بطلع فيك وخصوصاً إذا كان فلسطيزي .. مع إنو بسترجيش أو بالأحرى بقدرش أو إنو يحاول يرفع وجهو بوجهك .. وفي حال لو رفع شويه من وجهو الأجرب أخزقلو جوز عيونو .. وسوي براسووو خريطة العالم .. ونييييييييييييك خواته ال66مليون شرموطه وشرموطه .. ولاتنسى تنيك إمو ( لإنها هيه الأساس ) .. وبعد هيك إدعس بنص بطنو دعسة بنت كلب ( نصها موت ).. وشلحو أواعيه .. وافتح طيزو ونيييييييييييييييييييييييييكو لحد ما يغمى عليه ويطفي على الآخر . وبعدين كفين على الماشي ومرتبات يكونو على أكمن بوكس على شلوتين في زبو يخليه يبطل يخلف نهائي وبالمره .. وبعد هيك ( بدي أفرط من الظحك ) .. _ هذا إذا ظل عايش وعلى قيد الحياة وفيه روح وبتنفس _ .. على العموم شيك يعني .. هع هع هع ... وقلوووووووو بأعلى صوتك كالآتي :- ((( مظيع بوجهي شلن يا أخو العرصة ..... )))<br />ولكووووووووو .. نكناكـو كثير كثيييييييييييييييييييييييييييييييييييير كثيييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييير .. وزهقنا من طياز وكساس وبزاز وشفايف وخدود بناتكو ونسوانكو يالفلسطيزيه .. وملينا منكو نهائي .. ومسحنا بكرامتكو وشرفكو أرض الأردن كلها/ ولفينا فيها شبر شبر .. ولعنا ظمايركو حى صفيتو بلا ظمير .. أي كس أختكو من متى كان عندكو ظمير .. يعني بالمشرمحي هزئناااااااااااااااااااااااااااااااااااااااااكوووووووووووووووووووووووووووو .. وخليناكو فرجه للي بسوى واللي مابسوى .. وعلكة بثم الجميع .. وسيرتكو وقصتكو على كل لسان في العالم .. يعني خلصنا عليكو وقظينا عليكو .. يعني ياجهلة ( Game Over ) <<< يعني انتهت اللعبة ،،،<br />والأردن أولاً اسمو محفور في قلوبنا .. ورح نظل نردده ونحكية ونعيد ونزيد ونكرر فيه لحتى آخر نفس فينا .. والأردن أولااااااااااااً ..<br />ويحيا الأردن وكس أمك يافلسطين يابلد الشرموطات العاهرات الداعرات .. وكس أمكو ع أم الرئيس البهائي الواطي الخسيس الشرموط أبو مازن وهنية القحبة القواد اللي ماعندهمش أصل أو شرف .. اسمعو منيح هونه حنا ملكنا هاشمي .. مش مثل رئيسكو الشرموط اللي أصلو مش عارف من وين أكيد جاي عن طريق الحرام وعن طريق علاقة جنسية غير مشروعة .. يعني إذا رئيسكو مش معروفلو أصل فما بالكو بإنتو .. يعني الشعب !!!<br />وكل فلسطيزي منيك ابن داعره عاهره ابن مقطعه بلجيكي اخو بلجيكيه شرموطه قحبه مفتوحه مبعبصه .. كتب أي إشي عن الأردن _ بشكل عام _ بقلو ترى المراجل مش من تحت لتحت .. وتسب علي وعلى الاردنيين .. المراجل إنك تيجي بوجهي وتحكي كلامك وساعتها وشرفي لأكون مخلص عليك وماسحك عن الوجود .. ومخليك ملطشة الكل يصير يظرب فيك . وينيك بعرظ أختك وأمك .. وأنا محمد ابن نواف الشرارات وقدها وقدود ..<br />ع العموم هاذ اللي حكيتوا غيض من فيض . وماخفي كان أعظم وأدهى وأمر بكيثيييييييييييييييييييييييييييييييييييييييييييييير ..<br />والله على الظالم .. ورح يجيهم يوم ورح يوكلوا أصابيعهم لأ بل يدهم ندم وحسرة .. وساعتها رح ندعس على طيازهم وأكساس وبزاز وطياز بناتهم وخواتهم وأماتهم بدون أي رحمة ولا حتى شفقة<br />وإذا سألتوني شو أمنيتك ؟؟؟ لأقلكم نفسي ومناي .. وأمل وأمنيت حياتي كلها .. إني أنهي وأقظي وأخلص على إشي اسمو فلسطين وكلاب فلسطين من خريطة العالم وأمسحهم مسح .. وأقظي عليهم قظاء مبرم هاي هيه أمنيتي وبسسسسسسسسسسسسسسسسسسسسسسسسسسسس وكس أمكو أولاً وآخراً يا أولاد الحرااااااااااااااااااااام يلي إنولدتو من زبارنا حيث إنها ادخلت بأكساس وطياز خواتكم وأمهاتكم فولدناكم .. حلوه صح ....<br />فلسطيزنا .. فلسطيزنا .. مدعوسة تحت طيازنا .. مش مره ولا مرتين ولا ثلاث ولا حتى أربعة ..<br />فلسطيزنا .. فلسطيزنا .. والكل يحكي فلس وقع تحت الطين .. ولقيناه في طياز أسيادنا الأردنيين ..<br />فلسطيزنا .. فلسطيزنا .. وما أدراك ماطيزنا .. طيزنا .. هي لكم يا أردنيين .. وأكساسنا كذلك ..<br />فلسطيزنا .. فلسطيزنا .. فلسطيزنا .. فلسطيزنا ... النشيد الوطني الفلسطيزي ..<br />واسمعوا يا فلسطيزية وآخر كلمه إلكو بدي أقلكو شغله وحده بس قبل ما أروح ..<br />إنو المراجل وشغل الزلمنة . وشوفة الحال وشد الحيل .. ونفخ الصدور .. وكل واحد عاملي حالو أبو عنتر ومش عارف شو ..<br />بكونش من ورا شاشة الكمبيوتر .. أو التطقيق ع الكيبورد .. اللي بدو يحكي إشي يجي ويتفظل ويحكي وجه بوجه .. كس أمكو شغل لقلقة وتجعير .. بس لما تصير الشغلة جد وحقيقة بتتخبو مثل البسس والقطط ياوسخين ياجرب يامعفنين يا شراااااااااااميييييييييططططططط.. الله يلعنكو واحد واحد .. قال شعب منضال قال .. بس بلااااااااااااااااش !!!<br />أردنيه مش بس بالجنسيه<br />أردنيه وفائنا للعائله الهاشميه<br />أردنيه قبل الميلادية والسنه الهجريه<br />أردنيه بتشميرنا عاليد والمناسف البلديه<br />أردنيه مش تاعين الكبسه والملوخيه<br />أردنيه وعلمنا معروف بالنجمه السباعيه<br />ورمزنا الشماغ الأحمر ومالنا فروع ثانيه \\\\\\\\\\\\\\\"مش مثل شماغكو .. هههههههههههه . شماغ حمير وحشية ( الشماغ الأبيض)<br />ويلا يلاااا يلاااااااااا يا فلسطيزية على بلدكو ياشراميط ياولاد الشراميط .. ولاتنسو تلمو عفنكو وقرفكو ووسخكو وهبلكو وتسطيلكو معاكو .. ماشي .. ههههههههههههههههههههههههههههه<br />والأردن أولاً .. أولاًُ .. أولاً ..<br />وجيشنا جيش الوطن .. سمينا بإسم الله .. نحمي الوطن والعلم .. بعيون عبدالله ...<br />وبدي أشوف تعليقات الأردنيين النشامى ... اخزقوهم يانشامى الوطن .. ونيكو أعراظهم .. للي بلا شرف !!!"
