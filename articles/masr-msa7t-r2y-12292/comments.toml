text = "المشكلة مش مشكلة جنازير ولاطيور المشكلة أكبر من كده عدم وعى الناس،والإحاطة بتنفيذ القرارات عرض الحائط،وكأن مفيش راقيب،لازابط ولارابط،بقينا كالعشوائيات اللى يعرف يسلك نفسه يبقى برافو عليه وتصقيفه على رأى سيد مكاوى فى الليلة الكبيرة"
