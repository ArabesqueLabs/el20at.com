author = "الخنازير البشرية"
posted = "2009-06-07"
text = "فية فى وسطنا البشرى خنازير بشرية بتاخد قرارات زى الخنازير<br />يعنى قرارات مقرفة<br />انا زرت احد مزارع الخنازير اللى بيقولوا عليها نموذجية<br />فى زريبة الخنازير شفت المنظر المقرف دة<br />خنزير تبرز على الارض فجاءت ثلاثة خنازير اخرى واكلت فى الحال فضلات الخنزير الذى تبرز على الارض<br />اى قرف لحيوانات تأكل براز بعضها<br />انها قذرة الى ابشع الحدود<br />وطالما البابا شنودة قال المسيحيون لا يأكلون لحمة يبقى نخلية لية<br />اقتلوهم جميعا ونظفوا البلد<br />فية ناس كتير بطلت تاكل اللانشون والبلوبيف والبرجر لان فية شك ان داخلها لحم خنزير<br />يا جماعة المفروض مفيش مجاملة<br />اقتلوا كل تلك الحيوانات الكريهة والقذرة"
archived = "2010-03-14"
capture_url = ""

