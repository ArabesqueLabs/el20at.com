[[comments]]
order = 0
subject = "المحلة البطلة هى فلوجة مصر"
text = "فى 6 ابريل الماضى حاصر المحلة 100 الف عسكرى امن مركزى بمدرعاتهم واطلقوا الرصاص الحى على المدنيين<br />وسطرت المحلة - تاريخ رائع<br />فتحية لستات المحلة وشباب المحلة<br />كلهم جدعان<br />مش هم قلعة الصناعة الوطنية التى اسسها ابو الاقتصاد المصرى طلعت باشا حرب رحمة اللة<br />وهدمها بتوع البيزنس بتاع الوطنى<br />يا خسارة تعبك يا طلعت حرب"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003123/http://masr.20at.com:80/newArticle.php?sid=20213"

