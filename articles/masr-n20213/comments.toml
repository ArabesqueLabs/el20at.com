[[comments]]
order = 2
subject = "طوب الارض بيشتمكم حلوا عن سما ابونا"
author = "قسقوس المفس"
text = "اعتقد مفيش شعب فى العالم يتحمل اللى اتحملة الشعب المصرى من النظام الفاسد الغير مؤهل وغير مؤتمن على الناس ومصالحها وبذلك عندما ننادى برحيل السلطة الحالية واستبدالها مش توريثها بسلطة منتخبة بحق وحقيق مش مغتصبة بالقوة وحكم القوى على الضعيق"
archived = "2009-03-10"
capture_url = "https://web.archive.org/web/20090310003123/http://masr.20at.com:80/newArticle.php?sid=20213"
