[[comments]]
order = 1
subject = "الدول تنتهك حقوق الافراد داخلها وعلي رأسهم الدولة"
author = "رامز عباس"
posted = "2008-12-25"
text = "لو لا حظتم تستجدون ان الجبروت ليس جبروتا امريكا صرفا بل هو الاساس الذى طمع الانظمة المستبدة في عملية السيطرة بالحديد والنار سوف يحاولون تطبيق الاتفاقيات الدوليه بشـان معاقبة الاخ البطل منتظر الزيدى ولكن خوفا فقط من الشعوب العربيه القويه<br />اتمني ان تتذكروووووووووووا ابطال شباب مصريون يتعرضون للتعذيب والاعتقال التعسفي من الشقيقه مصر وهم شوقي رجب مدون ومحمد عادل مدون ومسعد ابو فجر مدون وبهاء فزاع ناشط ومحمد خيري مدون ورامى المنشاوى واحمد اشرف من نشطاء 6 ابريل"
archived = "2010-03-14"
capture_url = ""

