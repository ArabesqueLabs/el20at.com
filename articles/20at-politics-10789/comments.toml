subject = "الحصول على تنازل من بوش عن حقه الشخصي هو بداية الح"
author = "مش  ححبك"
posted = "2009-01-09"
text = "لا بد من محامين منتظر الزيدي ان يسيروا في القضية بشكل صح وهو الحصول من بوش على تنازل عن حقه الشخصي في القضية<br />واعتقد ان هذا امر سهل جدا<br />لان بوش الان حيسيب الرئاسة ومقابلته ممكن تكون اسهل كتير من الاول<br />تنازل بوش عن حقه في القضية هو اول خطوة لا بد للمحامين ان يبدأو به"
