subject = "ماكسيموس يناشد مسيحي العالم المساعدة لوقف تزايد دخول الأقباط في الإسلام"
text = "ماكسيموس يناشد مسيحي العالم المساعدة لوقف تزايد دخول الأقباط في الإسلام<br />الجمعة 15 من صفر1429هـ 22-2-2008م الساعة 12:05 ص مكة المكرمة 09:05 م جرينتش<br />الصفحة الرئيسة > الأخبار > العالم العربي والإسلامي<br />الأنبا مكسيموس<br />مفكرة الإسلام: وجّه ماكس ميشيل، الشهير بالأنبا ماكسيموس رئيس مجمع \"القديس أثناسيوس\"، رسالة إلى كل مسيحيي العالم، قادة وشعوبًا ومنظمات وجميع الهيئات المسيحية، ناشدهم فيها المساعدة لوقف الإقبال الكبير من أقباط مصر للدخول في الإسلام.<br />وحذّر ماكسيموس من انقراض المسيحية في الشرق الأوسط إذا استمرت أعداد تاركي المسيحية على هذا المعدل الفظيع.<br />وحسب صحيفة المصري اليوم، خاطب ماكسيموس البابا \"شنودةالثالث\" بابا الإسكندرية وبطريرك الكرازة المرقسية، قائلاً :\"كيف ستواجه المسيح بعد هذا الفقد الهائل من الرعية خلال فترة رعايتكم للكنيسة\"، بحسب قوله.<br />وأكد ماكسيموس أنه أرسل خطابًا لشنودة مزودًا بـ \"C. D\" لاجتماع بعض الأساقفة مع الكهنة في مؤتمر حمل عنوان \"مكافحة إسلام الأقباط \"، والذي أقامته ما تسمى بـ\"لجنة تثبيت الإيمان \" يتحدث فيها الأنبا دانيال أسقف المعادي والأنبا باخوميوس أسقف البحيرة والأنبا بيشوي مطران دمياط وسكرتير المجمع المقدس والأنبا موسى أسقف الشباب عن الزيادة الكبيرة في تحول الأقباط إلى الإسلام.<br />أوضح ماكسيموس أن ترك المسيحية يكون طواعية، ولا يوجد ما يدعيه البعض من وجود ما يسمى بحالات الخطف والإجبار على الإسلام، وأن المكتب البابوي يستقبل يوميًا إخطارات إسلام مسيحيين بأعداد كبيرة جدًا .<br />وكان ماكسيموس قد صرّح في وقت سابق بأن ما يقرب من 80 إلى 200 قبطي يعتنقون الإسلام يوميًا، محذرًا من تدهور أوضاع الكنيسة القبطية.<br />وانتقد ماكسيموس بشدة أوضاع الكنيسة الأرثوذكسية وبعض قوانين الكنيسة، مطالبًا بإصلاح شامل داخل الكنيسة لإدراك أقباط مصر، على حد قوله .<br />كما حذّر من تدهور الأوضاع داخل الكنيسة المصرية وأسلوب البابا \"شنودة الثالث\" في إدارته للكنيسة القبطية."
