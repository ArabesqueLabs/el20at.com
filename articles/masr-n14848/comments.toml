[[comments]]
order = 1
subject = "اخس على كدة حياة"
author = "طرطور امريكانى"
posted = "2008-03-25"
text = "بقينا شماعة لامريكا بسبب معونة بتتصرف على شركات امريكية وابو دولار تاخدة بمية وعلى حساب المعونة اللى هما يحددو حيبيعوك اية مش انت اللى بتختار عاوز اية يعنى المعونة دى لابتودى ولالكن بتجيب البلاوى والذل لمصر لانة كل مافكرت الحكومة ترجع لصوابها وتفوق من كابوس المعونة لان مصر ام الدنيا هية الخير كلة يس عاوزين حاكم رشيد ياخذ بيد الامة ويفيقها من سباتها الى ان وصلت الامور لقتل مواطن داخل بلدة وخلق حجج ومبررات وهمية لايهام الراى العام ان دول ارهابيين وكانوا حيفرقعواالسفينة - الهى وانت جاهى انصفنا وانصرنا ان الظالم طغى وتجبر وسعى فى الارض فسادا وقتلا ارنا فيهم عجائب قدرتك ياقوى ياعزيز انك سميع مجيب الدعاء"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174814/http://masr.20at.com:80/newArticle.php?sid=14848"

[[comments]]
order = 2
subject = "اسئله عايزه اجابه"
author = "الاسم مصريه"
posted = "2008-03-27"
text = "قال بوش اعرب عن اسفه فى تليفون مع مبارك و امر البنتاجون بفتح تحقيق<br />طيب واسره الراجل اللى قتلوه ده مش يستحق تعويض؟<br />اد مابنلوم امريكا .. نلوم مصر لانها ليه تسمح بمرور بارجات حربيه ونوويه فى قناة السويس<br />مش دى رايحه تضرب مواطنين عرب ابرياء وايش ضمنا انها مش هترمى لنا مخلفات نوويه تضرنا<br />وفين سلاح البحريه المصريه اللى كان مفروض يكون لها وجود مستمر هناك<br />على الاقل لما كانت تشوف كده من الاول كانت تحمى مراكب الصيادين او حتى تمنعهم يقربولهم"
archived = "2008-03-30"
capture_url = "https://web.archive.org/web/20080330174814/http://masr.20at.com:80/newArticle.php?sid=14848"
