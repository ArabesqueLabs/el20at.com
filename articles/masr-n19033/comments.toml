[[comments]]
order = 0
subject = "منهج النبي محمد صلى الله عليه وسلم مرة اخرى"
author = "ابومحسن"
text = "اريد هنا ان اقول ان الله سبحانه وتعالى وضع ضوابط للبس المرأة في القران الكريم وضوابط لخروجها من المنزل ومن هنا نبدأ<br />ان مخالفة المرأة القانون الذي وضعه له لها سبحانه وتعالى في اللبس وفي كيفية الخروج من المنزل هو بداية الكارثة<br />المرأة هي التي تتحرش بالرجل او تتحرش بعين الرجل<br />بلبسها وحركاتها وضحكاتها كل هذه تحرشات<br />علاوة على تحرش اجهزة الاعلام بالرجل عن طريق عرض الافلام التي تثير غرائز الرجل<br />الرجل مظلوم<br />سفور المرأة اصبح شبح يطارده في كل مكان حتى لو اغلق جميع الابواب على نفسه يأتيه هذا الشبح ويدعوه للتحرش به حتى اثناء نومه تأتيه المرأة وتدعوه للتحرش بها<br />وطبعا مستحيل ان تعود المرأة مرة اخرى الى قانون الحجاب (الزي) الذي امر به الله سبحانه وتعالى في القران<br />لان من علامات يوم القيامه خروج النساء كاسيات عاريات مميلات مائلات والعياذ بالله"
archived = "2008-12-30"
capture_url = "https://web.archive.org/web/20081230152805/http://masr.20at.com:80/newArticle.php?sid=19033"

[[comments]]
order = 1
subject = "نساء كاسيات عاريات مائلات مميلات على رؤوسهن كأسنمة البخت المائلة"
author = "منقول (ابومحسن)"
text = "نساء كاسيات عاريات مائلات مميلات على رؤوسهن كأسنمة البخت المائلة .<br />قال النووي في المراد من ذلك : \\\\\\\" أَمَّا ( الْكَاسِيَات العاريات) فمَعْنَاهُ تَكْشِف شَيْئًا مِنْ بَدَنهَا إِظْهَارًا لِجَمَالِهَا , فَهُنّ َكَاسِيَات عَارِيَات . وقيل : يَلْبَسْنَ ثِيَابًا رِقَاقًا تَصِف مَا تَحْتهَا , كَاسِيَات عَارِيَات فِي الْمَعْنَى . وَأَمَّا ( مَائِلات مُمِيلات ) : فَقِيلَ : زَائِغَات عَنْ طَاعَة اللَّه تَعَالَى , وَمَايَلْزَمهُنَّ مِنْ حِفْظ الْفُرُوج وَغَيْرهَا , وَمُمِيلَات يُعَلِّمْنَ غَيْرهنَّ مِثْل فِعْلهنَّ , وَقِيلَ : مَائِلَات مُتَبَخْتِرَات فِي مِشْيَتهنَّ , مُمِيلات أَكْتَافهنَّ , وَقِيلَ : مَائِلات إِلَى الرِّجَال مُمِيلات لَهُمْ بِمَا يُبْدِينَ مِنْ زِينَتهنّ َوَغَيْرهَا . وَأَمَّا ( رُءُوسهنَّ كَأَسْنِمَةِ الْبُخْت ) فَمَعْنَاهُ : يُعَظِّمْنَ رُءُوسهنَّ بِالْخُمُرِ وَالْعَمَائِم وَغَيْرهَا مِمَّا يُلَفّ عَلَى الرَّأْس , حَتَّى تُشْبِه أَسْنِمَة الإِبِل الْبُخْت , هَذَا هُوَ الْمَشْهُو رفِي تَفْسِيره , قَالَ الْمَازِرِيّ : وَيَجُوز أَنْ يَكُون مَعْنَاهُ يَطْمَحْنَ إِلَى الرِّجَال وَلا يَغْضُضْنَ عَنْهُمْ , وَلايُنَكِّسْنَ رُءُوسهنَّ .... \\\\\\\" شرح النووي على صحيح مسلم 17/191. باختصار<br />قال الشيخ بن عثيمين : \\\\\\\" قد فُسِّر قوله \\\\\\\" كاسيات عاريات \\\\\\\" : بأنهن يلبسن ألبسة قصيرة ، لا تستر ما يجب ستره من العورة ، وفسر : بأنهن يلبسن ألبسة خفيفة لا تمنع من رؤية ما وراءها من بشرة المرأة ، وفسر : بأن يلبسن ملابس ضيقة ،فهي ساترة عن الرؤية لكنها مبدية لمفاتن المرأة \\\\\\\"<br />فتاوى الشيخ محمد بن عثيمين 2/825 .<br />ــــــــــــــــــــــــــــــــــــــــــــــــــ<br />الرجال مظلومه والنساء هي التي تتحرش بالرجال<br />الرجال مظلومه والنساء هي التي تتحرش بالرجال<br />الرجال مظلومه والنساء هي التي تتحرش بالرجال<br />الرجال مظلومه والنساء هي التي تتحرش بالرجال"
archived = "2008-12-30"
capture_url = "https://web.archive.org/web/20081230152805/http://masr.20at.com:80/newArticle.php?sid=19033"

[[comments]]
order = 2
subject = "واو موضوع يجنن"
author = "ميرو"
text = "لالالالالا مش قادرة اصدق نفسي بجد الموضوع يجنن يجنن وفيه مجهود فعلا تحفه اكيد اخد شهور في جمع كل المعلومات دي والاتصال بالمصادر وتصفح الصحف اليومية، بجد يا فاروق موضوع هايل ويا رب بئا تفضل تكتب كده على طول وانا لو منك اسيب الديسك فورا واعد بس عشان امخمخ واكتب"
archived = "2008-12-30"
capture_url = "https://web.archive.org/web/20081230152805/http://masr.20at.com:80/newArticle.php?sid=19033"

