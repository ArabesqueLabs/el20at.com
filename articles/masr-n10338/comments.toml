[[comments]]
order = 1
subject = "زغروته للاهلى...و للعروسين"
author = "نيفين نيفى نوفا"
text = "الموضوع جميل يا هوارى و انا شايفه ان الماتش ده هيفضل على طول الايام مثار جدل<br />مع انى شايفه ان الكل فرح زملكاويه و اهلاويه<br />يتقال الزماللك غلب علشان الاهلى لعب بالاحتياطى<br />يتقال الاهلى واخد الورى و مش همه<br />المهم الناس كلها خرجت فرحانه<br />فيا ريت نهدى و كفايه بقى و كل واحد عند بيته يا جماعه<br />يللا شيل يا ابنى الكراسى عايزين نرش ميه<br />و النبى يا اخواننا مش عايزين لمه قصاد المحل ده مكان اكل عيش"
archived = "2007-05-25"
capture_url = "https://web.archive.org/web/20070525041644/http://masr.20at.com:80/newArticle.php?sid=10338"

