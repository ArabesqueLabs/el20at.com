[[comments]]
order = 3
subject = "كلهم كدة"
author = "ابو اسامة"
posted = "2008-05-05"
text = "اللى انا ملاحظه ان المنافقين دوول بيكتبوا من وحيى نفاقهم البحت يعنى ايه؟<br />مبيحولوش حتى يخبوا الاشياء اللى ممكن الناس تاخد بالها انها مش حقيقية وتظهرهم انهم منافقين<br />يعنى عاوزين ينفقوا لمجرد النفاق . بس عاوز اعرف مين غير بتوع الفول والطعمية اللى بيشترى الجرايد دى<br />وطبعا عارفين ليه بتوع الفول والطعمية وعلى فكرة هما بارده بيشتروا الطبعة من عند بتاع الجرايد تانى يوم<br />بعد ما تبور وياريت يقلولنا الجرايد دى مدعومة منين."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "فصيحنا"
author = "أحمد مطر"
posted = "2008-05-06"
text = "فصيحنا ببغاء ،<br />قوينا مومياء ،<br />ذكينا يشمت فيه الغباء ،<br />ووضعنا يضحك منه البكاء ،<br />تسممت أنفاسنا حتى نسينا الهواء ،<br />وامتزج الخزي بنا حتى كرهنا الحياء ،<br />يا أرضنا، يامهبط الأنبياء ،<br />قد كان يكفي واحد لو لم نكن أغبياء ؛<br />يا أرضنا ، ضاع رجاء الرجاء ،<br />فينا ومات الإباء ،<br />يا أرضنا ، لا تطلبي من ذلنا كبرياء ،<br />.قومي احبلي ثانية ، وكشفي عن رجل لهؤلاء النساء"
archived = "2010-03-14"
capture_url = ""

