[[comments]]
order = 1
subject = "مش معقول"
author = "مصرى"
posted = "2008-05-05"
text = "لا يساورنى الشك ان ان وصف النفاق لا يمكن وحده ان يصف هذه الحالة البشعة التى وصل اليها كاتب المقال لازم ينعقد مجمع اللغة العربية علشان يشوف لفظ تانى يمكن ان يطلق على رؤساء الصحف القومية و متسلقيها الآخرين و ذلك للخروج بلفظ جديد يصف حالتهم الشنيعة و التى لايمكن السكوت عليها كما أقترح أن يعرضوا جميعا بربطة المعلم على كونسولتو عالمى من أكبر دكاترة الأمراض النفسية و العصبية و العقلية يمكن يلاقوا لهم علاج و ربنا يشفى"
archived = "2010-03-14"
