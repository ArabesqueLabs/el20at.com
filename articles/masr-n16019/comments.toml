[[comments]]
order = 3
subject = "ما تيجي تتجوزني انت يا محمد السيد"
author = "في في المطلقه"
posted = "2008-06-07"
text = "يا محمد السيد انا عايزه اتجوزك انت ايه رايك<br />اكيد انت واد صايغ ومش لا قي تاكل وبتشتغل في عشرينات بالحته الموضوع بـ 50 جنيه يا دوب يكفوك السجاير<br />اما انا بقا فبت كسيبه اصرف عليك وعلى عيلتك كلها<br />اديني اميلك ياض علشان خاطر اكلمك على الماسنجر<br />سلام"
archived = "2010-03-14"
capture_url = ""
