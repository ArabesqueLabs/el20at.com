[[comments]]
order = 0
subject = "نصيحة واحدة عانس"
author = "مش عمر الحريري ولا اسماعيل ياسين"
text = "كان يا ما كان كان فيه واحدة حلوه خالص ومش عاجبها العجب<br />وكانت بترفض العرسان<br />كان طويل<br />دا تخين<br />دا رفيع<br />لغاية ما اتعودت على كده وسنه ورا سنه عدت التلاتين من غير ما تشعر 31 و32 و33<br />يا خبر ابيض القطر فات واتقدملها واحد حست انه اخر واحد فوافقت بيه على طول<br />وطلع (امير الانتقام) لكل اللي عملته وراها الويل<br />فنصيحتي لكل بنت اذا جاءكم من ترضون دينه وخلقه فزوجوه صدق رسول الله<br />سواق توك توك سواق ميروباص<br />تتجوز على طول<br />سلام"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090716/http://masr.20at.com:80/newArticle.php?sid=16019"

[[comments]]
order = 1
subject = "اتجوزوا ولاتجوز ابوه كمان بس هوا فينه"
author = "عانس دكر"
text = "طبعا اتجوزه بس هوا فينوا هاتوهولي كده<br />هو حد لاقي جواز دلوقتي يابا"
archived = "2008-06-06"
capture_url = "https://web.archive.org/web/20080606090716/http://masr.20at.com:80/newArticle.php?sid=16019"
