posted = "2009-09-01"
text = "فى تقرير نشر اليوم بجريدة المصريون<br />ان متوسط استهلاك الفرد المصرى من اللحوم حاليا هو 15 جرام<br />بينما فى الدول المتقدمة 250 جرام لحم<br />شفتم الفقر اللى احنا فية<br />15 جرام فى مصر مقابل 250 جرام فى الدول المتقدمة<br />يبقى الفول والعدس هو الحل<br />يبقى حكومة نظيف تغلق مزارع الدواجن ونبقى شعب نباتى<br />علشان كدة الانيميا وفقر الدم منتشر بين معظم الاطفال<br />نحن ناس نتلذذ بالفقر<br />ويطلع دكتور ماجور يقول لك الفول والعدس يجلب سعادة<br />اى سعادة وليس امامنا غيرة صباحا ومساءا<br />انا شايف الناس بتكركع من الضحك فى الشوارع والضحكات تمل ىء الشوارع<br />ذكرنى بالنكتة التى تقول ان شرطيا قبض على مواطن ووقف امام الضابط يقول لة لقيتة بيضحك فى الشارع يا افندم<br />ط<br />واحد مبسوط جدا من الفول"
archived = "2010-03-14"
