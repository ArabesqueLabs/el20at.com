text = "اية اللى حصل<br />مقال دعاء الشامى هيج الدبابير من العش لية<br />فية حاجات وضربات تحت الحزام مش فاهمينها وتلميحات وغمزات - هو اية اصل الحكاية<br />هى دعاء الشامى اكلت منابكم فى اللحمة<br />والا الحكاية حكاية الدستور وابراهي عيسى<br />والمعركة بين مؤيد لابراهيم عيسى ومن هو ضدة<br />عايزين نفهم<br />فهمونا"
