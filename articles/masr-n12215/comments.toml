[[comments]]
order = 16
subject = "دية اى صحفى متمرد"
author = "راعى غنم"
posted = "2007-11-02"
text = "اى صحفى متمرد وعامل فيها معارض ووطنى وبيدور على حقوق الغلابة ديتة اية ؟<br />الرئاسة تعزمة على سفرية من سفريات الريس لاى دولة ويركب طيارة الرياسة مع الصحفيين المقربين مرة واحدة ويلهط هدايا ومشتريات فى الرحلة على حساب المعلم وبدون جمارك طبعا<br />هيرجع من السفرية يهاجم مجلس محلى البدرشين وهيبعد عن مهاجمة النظام وهيتفرغ لحاجات هايفة<br />انما نحاكم الصحفيين وتطلع صحف العالم بالعناوين الرئيسية ان مصر تعتقل رؤساء التحرير فدة قرار خاطىء<br />ركبوا الصحفيين دول طيارة الرئاسة مرة واحدة<br />هيبقوا زى الاخ ممتاز وسعدة وابو حديد اكبر مطبلاتية فى مصر<br />نفسهم يركبوا الطيارة ويغطوا سفرية من سفريات الريس<br />يا عالم افهموا بقى"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064847/http://masr.20at.com:80/newArticle.php?sid=12215"

