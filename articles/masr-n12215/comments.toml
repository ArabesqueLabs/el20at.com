[[comments]]
order = 2
subject = "دستوووووووووووووووووووووووووووووور"
author = "محمد شحاتة              المحام"
posted = "2007-10-31"
text = "كانت كمثل القنبلة التي ألقيت في قلب سوق الصحافة فحولتها جميعا إلى أشلاء ..وبقيت هي السيدة وهي السائدة .. كانت كمثل حجر ضخم ألقي في الماء الراكد فصار يفيض \" بفضلها\" كالشلال الهادر..<br />كانت تلك طلعة الدستور التي جعلت يوم \"الأربعاء\" يغتصب لنفسه كل ما يميز ما عداه من باقي أيام الأسبوع..<br />كانت تنفجر في يديك بمجرد فتحها ..كانت الجريدة التي لاتستطيع أن تأتي عليها فتأتي هي عليك ..<br />كانت كمن يستمتع بشد \" الباروكة \" من على رأس الصحف الشائخة العاجزة .. فتكشف ضعفها وتسوسها وتتركها عارية أمام نفسها وقرائها.. كانت تقفز فوق المنطق وفوق المعقول وفوق الجرأة نفسها ... كانت متمردة على كل الثوابت ..كانت متمردة حتى على نفسها.. لذا فإن عيسى هو جزء لا يتجزأ من نجاحها ... بينما هي كل لا يتجزأ من نجاحه"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064847/http://masr.20at.com:80/newArticle.php?sid=12215"

[[comments]]
order = 3
subject = "صباح الخير يا شتيمة"
author = "ابو صالح (صحفى)"
posted = "2007-10-31"
text = "الدستور جريدة قوية مفيش كلام واعتقد مصدر قوتها فى ابراهيم عيسى ومقالاتة الجامدة ثم بلال فضل وفهمى هويدى وبقية الصحفيين الجامدين ولكن مايفعلة ابراهيم عيسى بصراحة كدة قلة ادب كل يوم يشتم فى الراجل وكائنها صباح الخير يا شتيمة ودة رمز البلد طب دة كلام ومش مرة ولا تنين لا دة تقريبا كل يوم وبعدين هو هيحارب فى مين الرئيس ولا الحكومة واعلامها وصحفيها ومنافقينها وكدابين الزفة مش هيقدر يقاوم كل هذا استحالة انا بصراحة كدة مشفق علية من الجىىىى<br />..........................وشكر"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064847/http://masr.20at.com:80/newArticle.php?sid=12215"

[[comments]]
order = 4
subject = "تْامرون الناس وتنسون انفسكم . رسالة الى رؤساء تحري"
author = "صحفى ناشىء"
posted = "2007-10-31"
text = "اكتر حاجة زعلتنى انة لا يهتم باجر الصحفيين العندة واعتقد انها فى معظم رؤساء التحرير وخصوصا الصحف الحزبية والمستقلة زمش عارف لية نفسى يكون عندهم دم واحساس بالصحفى الناشىء او حتى القديم لانهم عدم اهتمامهم بمثل هذة الجزئيات تضعهم فى موقف غاية فى السوء وكئن كل كتابتهم لا تاخذ منها كلمة واحدة والسبب التناقض البين بين ما يكتبة وبين ما يفعلة ازاى يهاجم المسئولين كل يوم وهو لا يهتم برعيتة ويهتم باجر هم الشهرى ويطالب اعلى المناصب فى البلد بالاهتمام الشعب وهو لا يقوى على الاهتمام بعدد محدود من الصحفيين تحت قيادتة ... وعجبى على هذا الزمان وللاسف هذا الموضوع مش فى ابراهيم عيسى فقط بل فى معظم رؤساء التحرير للاسف"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064847/http://masr.20at.com:80/newArticle.php?sid=12215"

[[comments]]
order = 5
subject = "أبو تريكة الصحافة المصرية"
author = "واحد معدي"
posted = "2007-10-31"
text = "حاسس إن الأخ المسمى شريف الدواخلى حامي حمى الصحافة المصرية والعربية.. ما من موضوع يكتب إلا ونجده يتقئ على صفحات عشرينات أحد دروس الصحافة التي تعلمها سواء فى قاعات المحاضرات أو في الجريدة، دعك من الأخطاء النحوية والغملائية التي تزخر بها كتاباته، إلا أن لديه قدر كبير من الإحساس بالذات حتى التورم.. عبارة \"أعطانى فرصة للظهور وربما التألق فى مجال الصحافة\" تحسسك إن السيد شريف \"أبو تريكة الصحافة المصرية\" .. تألق مين يا عم الحاج خلى الطابق مستور<br />وكله كوم وقوله \"وكان تعليق الاستاذ ابراهيم وقتها أنا عندى أمل أن هايطلع منهم هيكل جديد ... وربما كان يعنينى أو يعنى شخصاً آخر ..\" .. أيه التواضع ده يا أستاذ شريف هيكل مين يا راجل وبتاع مين؟! انت أكبر من كده بكتير، عيبك يا استاذ شريف إنك بتتواضع وبتشبه نفسك بناس محدش يعرفهم ولا عمره شاف لهم شغل .. الله ما تشوفش وحش<br />يا ريت الزملاء في عشرينات يعملوا لنا ملف مرضى الكساح.. لأنه استشرى هذه الأيام"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064847/http://masr.20at.com:80/newArticle.php?sid=12215"

[[comments]]
order = 6
subject = "موضوعك هايل يادعاء"
author = "حسن السيد القناوى"
posted = "2007-11-01"
text = "اية حكاية شريف الدواخلى دى - الاخ دة عامل نفسة ناقد صحفى او استاذ فى كلية الصحافة او الاعلام - بيلقى علينا برخامتة وتقل دمة محاضرة باردة محدش طلبها منة<br />يا دعاء يا بنتى مقالك رائع فية تلقائية محببة وكتاباتك عفوية فيها صدق ومفيش فيها صنعة ولا حبكة ولا الهم بتوع مدعوا الصحافة وعديمى الموهبة وبتوع القوالب الجامدة المنفرة زى شريق الدواخلى خيبة اللة<br />الصدق فى الكتابة<br />بس يا دعاء فية تشبيهات بتيجى من الخبرة ازاى بتعرفى ان الشنب دة شنب صول مخلة انت شفتى صول المخلة ويعنى اية مخلة<br />دى حاجات بيعرفها العسكريون القدامى<br />المهم موضوعك رائع جدا<br />اما الصحفى ابراهيم عيسى فهو بيقول اللى ناس كتير عايزة تقولة<br />ولما قال انة مريض لم تتوقف الكرة الارضية علشان بسلامتة مريض<br />طيب اولمرت رئيس اكبر دولة قوية فى الشرق الاوسط راح كشف فى المستشفى وطلع قال للناس انة عيان وان عندة سرطان وهيعمل عملية<br />البورصة فى اسرائيل خربت - لا<br />احنا عندنا مسئولين بقر فى زريبة<br />شكرا على مقالك يا اخت دعاء<br />وان شاء اللة هتبقى صحفية رائعة رغم انف الدواخلى والخوارجى"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064847/http://masr.20at.com:80/newArticle.php?sid=12215"

