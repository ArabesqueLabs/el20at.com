subject = "مش مهم الشكل"
author = "خالدالامير-سكرتير م الوفد/الاس"
posted = "2007-11-02"
text = "دعاء الشامي لقد خانتك هذه المره حرفيتك الصحفيه وقمتي بوصف شخصي وملامح لانسان خلقه الله وكرمه ولا يهم ان كان تخين او رفيع مكور اومربع او اي كان شكله فيكفي قلمه الجرئ رغم ناصريته فهو يقول الحيقيقه ويكتب بتهور وعنتريه في بعض الاحيان الا ان ذلك اكسبه حب الناس واصبح له مؤيدين وكذلك حاسدين وحاقدين فهو الصحفي المستقل الذي لاتنفع معه صفقه لمجلس الشعب او حديث مع الرئيس او سفره معه زكلنا نعلم من يهاجمونا بالنهار ويقدمون فروض الطاعه بالليل واصبحت جرائدهم تمشي بالتعاملات الامنيه وبتفجير قضايا تصب في مصلحه النظام وفي التوقيت الذي يرودونه ام عيسي فلا يخش اح ومعه رجل لليبرالي اعطه كافه السلطات والصلحيات ولا يتدخل في شئ انه عصام فهمي فكلاهم كمل الاخر رغم تعارض الاتجاهات ولكن اتفقوا علي مصلحه الشعي والبلد فتحيا لابراهيم عيسي وتحيات كثيره لعصام فهمي الذي يتحمل الكثير من اجل ان يكتب في صحفيه ملكه الحقيقه ومصلحه الوطن فقط ولا يزايدون علي ذلك"
archived = "2007-11-03"
capture_url = "https://web.archive.org/web/20071103044551/http://masr.20at.com:80/newArticle.php?sid=12215"

