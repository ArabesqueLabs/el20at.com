text = "موضوع اكثر من رائع انا باحييكي يا بنتي عليه انا مقريتش اي حاجة عن ابراهيم عيسى على النت ولا في الجرايد زي الموضوع بتاعك مليان كلام ناس مهمة وكمان فيه روح مختلفة حيادية وواضحة وكنتي قادرة على نقل حيرتك في شخصية ابراهيم عيسى الى القراء وعندك حق<br />ابراهيم شخص محير وغريب في نفس الوقت انا فعلا ساعات احبه قوي واستنى الدستور وايام اكتئب من كلامه لانه مكرر وكمان مش مفيد لكن يبقى من حقه التعبير عن رايه ومن حقنا الاختلاف معه"
