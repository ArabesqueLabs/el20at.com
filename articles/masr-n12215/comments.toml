[[comments]]
order = 0
subject = "تناقض محيِّر"
author = "Gh"
posted = "2007-10-31"
text = "\"جسم مكور ووجه مدور وحمالات بنطلون يصر على ارتدائها\" والتي تظهر لي لتذكرني بأشياء عدة من عبق \"زمان\" ، إبراهيم عيسى كاتب أقدره وأحترمه جدا،ولكني لم أقرأ شيئاً يتناول شخصيته وآراء الآخرين فيه قبل موضوعك الذي قد يرسم صورة متناقضة لشخصية تبعث على الحيرة ، إبراهيم عيسى ديكتاتور ؟؟؟ ومرتبه يصل إلى 50 ألف جنيه شهرياً بينما لا يهتم بمرتبات الشباب من الصحفيين؟؟؟؟ ماهذا التناقض بين ظاهره وما يكتبه وبين الواقع ؟؟؟ من الواضح أن متهميه بالديكتاتورية الفجة والغرور الفارغ لم يعايشوه ولم يفهموا طبيعة شخصيته التي قد توصف بالجرأة ، التمرد والاحساس بالذات ولكن ليس غرورا فارغاً فيما أعتقد ، والشاهد على ذلك صديقه الذي هو ( عشرة عمر ) ،وبالفعل تتميز ( الدستور ) التي يرأس تحريرها عن باقي الصحف ، و أعتقد أن هذا نابع من وجود جو من الحرية بها إلى حد كبير، ورغم أني تركت داء الإنبهار بالأشخاص ، ولكني لازلت أكن للأستاذ إبراهيم عيسى كل الإحترام والإعجاب ، قد أصدق بعض ماقيل عنه من سلبيات وقد لا أصدق ولكن في النهاية ما من إنسان كامل .\" أشكرك جدا ً على ماكتبتِ وعلى موضوعيتك \""
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064847/http://masr.20at.com:80/newArticle.php?sid=12215"

