text = "يا دودو انتي كنت متحاملة قوي على ابراهيم .. لأنه تخين بس مش منفوخ ع الفاضي .. ابدا .. وموهوب .. وقلق .. بس مش مغرور ... واستاذ ومدرسة ... تختلف معاه أو تتفق معاه ..لكن قامته أكيد ما يطولهاش سليم عزوز علشان يحلل هو شخصيته ويرميه بالطوب .. متهيأ لي فعلا خانك التوفيق .. وحتى مع كونك حيادية وموضوعية كان ممكن تعرضي جميع الآراء بدون تجريح لابراهيم .. وكفاية فعلا اللي هو فيه"
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205193455/http://masr.20at.com:80/newArticle.php?sid=12215"

[[comments]]
order = 19
subject = "يا دعاء انت مع مين"
author = "واحد"
posted = "2007-11-03"
text = "انت مع مين يا استاذة دعاء<br />مع الجماعة بتوع الوطنى اللى بيوهموا الناس بحاجات مش موجودة زى اصلاح الاقتصاد وتعديل الاقتصاد واحنا ما عندناش اقتصاد من اصلة<br />زى واحد بيقول لخطيبتة انا رايح اشترى عجل للعربية وهو اصلا معندوش عربية<br />انت بتهاجمى الراجل لية<br />وانا عارف انك بنت بلد جدعة متربية ومن ولاد الارض اللى بيقفوا مع المظلوم ضد الظالم<br />الوطنية يا دعاء انك تدافعى عن رجل - النظام عايز يعملة عبرة لكل صحفى يقول الحق ويحبسة ويذلة ليخاف الجميع<br />المقال جيد جدا<br />ولكن رأيك فى الرجل فى الوقت دة وهو فى نفس الموقف غلط<br />بعد ما تنتهى شدتة ابقى قولى لة اللى انت عايزاة<br />وبرضة بنحترم رايك"
archived = "2007-12-05"
capture_url = "https://web.archive.org/web/20071205193455/http://masr.20at.com:80/newArticle.php?sid=12215"

