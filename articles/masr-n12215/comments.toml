[[comments]]
order = 10
subject = "موضوع حلو وحيادي"
author = "بلال"
posted = "2007-11-01"
text = "يا جماعة الموضوع انا مش شايف ان فيه اي نقد للراجل بالعكس الموضوع حيادي جدا والكاتبة قالت انها متتعرفش الراجل وعشان كده سالت اصحابة وجابت الكلام المنشور عنه وانا شايف بصراحة انه موضوع هايل ومش حاجة عادية كده يعني ولا هاجمت ابراهيم عيسى ولا جت عليه<br />وبعدين ده كل الكلام اللي اتقال عنه قالت ان اصحابه قالوا انه كدب ومش صحيح المفروزض تعمل ايه بقى تطبل لابراهيم عيسى ولا غريه<br />اما شريف الدواخلي ده يا خرابي عليه ده شخص قميء ولا عارف اي حاجة وبيفتي في كل حاجة وهو كمان كلامه مش منطقي ولا موضوعي"
archived = "2007-11-02"
capture_url = "https://web.archive.org/web/20071102064847/http://masr.20at.com:80/newArticle.php?sid=12215"

