subject = "وحياتك وغلاوتك دى هدايا"
author = "ابو النمرس"
text = "صحيح فية جزء متهرب من الاثار انما المتاحف اللى برة مليانة من الاثار الهدايا من السيد الرئيس المؤمن والست حرمة واتفاقات وزارة الثقافة ان اللى يكتشف حاجة من البعثات الاجنبية ياخد جزء منها واهى تركة وبيوزعوها<br />وبعدين نعمل لجان تلف اوروبا وتحجز فى فنادق وضيافة واكل وشرب على حساب الدولة وبعدين يرجعوا ويقولوا احنا عملنا المستحيل وما رضيوش يرجعوها<br />يعنى العملية كلها سبوبة للارتزاق"
archived = "2008-01-01"
capture_url = "https://web.archive.org/web/20080101094950/http://masr.20at.com:80/newArticle.php?sid=13596"
