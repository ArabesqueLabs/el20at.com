subject = "هل فى بديل"
author = "محمد جلال"
posted = "2008-01-27"
text = "انا عايز اققول حاجة صغيرة شباب مصر دلوقتى بيعتمد على الاثار المصرية لانة هى المصدر الوحيد دلوقتى ليهم هيعمل اية الدولة كل يوم فى سرقة من الكبار والصغار ميتين هنعمل اية يعنى نبيع الاثار وانتم الحكومة عليكم تمسكو الاثار مع الاجنبى بعد البيع حتة يتمكن شاباب مصر من الخير بتاع الاجداد"
archived = "2010-03-14"
