subject = "متى تغضب؟"
author = "أوراق الورد"
posted = "2007-04-09"
text = "بوركتَ وبورك بمداد قلمك وأفكارك النيّرة أستاذنا الفاضل.<br />ذكرني هذا المشهد الذي عرضته علينا بمشهد آخر عشته مرارًا.<br />منعنا الصهاينة يومًا من الدخول للمسجد الأقصى، بكل بساطة وسذاجة قفلوا الأبواب قبل صلاة الجمعة بوقت قليل<br />دون أي مبرر. نظرت للأمام فرأيت أني على بعد ليس أكثر من خمسة أمتار عن باب حطة، نظرت خلفي فإذا طريق باب العمود في البلدة القديمة مكتظ لدرجة لا تسمح بالتحرك لأي جهة.<br />لا مجال للتقدم أو الرجوع...احترت ماذا أفعل وسط الزحام الشديد ولم أجد حلًا إلا الإنتظار.<br />سادت حالة صمت قليلة...ثم قطعها شباب ونساء وأطفال بالدعاء على المحتلين...أو التوعد بالإنتقام منهم..أو جمل ملل من الحياة وظروفها..أو كلمات ضجر من الزحمة الشديدة...وخناق سرعان ما يخمد.<br />فجأة..بدأت وتيرة الغضب تزيد لكن لم تسيرها إلا أمرأة حكيمة. صرخت بقوة حتى أصحت ضمير العشرات أو المئات حولها:<br />سمّوا باسم الله...وتقدموا...\"الله أكبر ولله الحمد\"..حيّوا على الشهادة..تخليتها مشاهد خيالية لكن ساعتها شعرت أني أعيشها فعلًا...<br />وامتد الزحف...وغضب الناس...وتحركوا بسرعة تفوق التيار...<br />كنت أشعر أن لحظات فقط تفصل بين المشهدين: خناق وصراخ بين المسلمين..أو خناق مع الجنود المحتلين \"واحنا متحدين\"<br />فيا أيها النابض بعروق عربية...إسلاميّة<br />جميل أن تتصرف كإنسان...تسعد وتغضب...لكن الأجمل أن يكون الهدف ساميًا...عاليًا بقدر سمو غايتك التي شرفك الله بها!<br />ألا إن سلعة الله غالية...ألا إن سلعة الله الجنة...والجنة لا يغضب لها إلا حر فك قيده من \"الأرضيات\" وإلا كانت عثرة سريعة ثم عاد لإنسانيّته.<br />تحياتي\\ أوراق الورد...www.awraq-alward.net"
archived = "2010-03-14"
