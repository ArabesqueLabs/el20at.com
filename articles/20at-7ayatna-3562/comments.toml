text = "انا عادتا لا اغضب لانى مش هسمح ل اعصابى تتحكم فيا انا مش ضعيفه للدرجادى انا اقوى من اعصابى انا اللى اتحكم فيها مش هيا اللى تتحكم فيا فهمت مش مساله متخصص يا دوك و انا نفسى الناس كلها تبص للمشاكل بانها صغيره و ممكن تتحل مش كده دا ايه ده كل ما مشكله تحصل تلاقى حريقه قامت معرفش على ايه و بيبقى الموضوع تافه اصلا مش محتاج"
