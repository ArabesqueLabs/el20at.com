subject = "الدرينى والنفيس والتقية"
author = "سنى سنى سلفى الى الا"
posted = "2008-10-09"
text = "بسم الله اولا محمد الدرينى هذا كاذب فهو لا يعرف لهو ملة هو او احمد النفيس فلا ثنان يحاربون بعض على زعامة الشيعة فى مصر جاتكم خايبة على كفركم المهم الشيخ القرضاوى يتكلم كلام صحيح فهولاء يعملون فى الخفاء او يعملون بمبدا زعمهم الهالك الخمينى عميل اليهود فهولاء يحاربون بشتى الطرق لنشر المذهب الشيعى فى مصر ولكن الحمد لله توجد فى مصر جبهة قوية لمحاربة هولاء الذين باعو الدين بالدنيا من تربوا على يد عبد الله بن سبا والخمينى واشزاى والقمى ان كنتم لا تعرفون هولاء فابحثوا عن هولاء المرتدين وماذا يقولون فى حق صحابة رسول الله ص اما على الكورانى هذا معروف عنه الكذب والنفاق من يرد ان يسال اى سوال عن الشيعة وفرق الشيعة فانا على الرحب والسعة ومن يرد ان يتناقش فنحن اهل لها حتى نكشف هولاء الخلاء على الا سلام والمسلمين فالدين لا ياخد الا عن سنة رسول الله والسلف الصالح"
