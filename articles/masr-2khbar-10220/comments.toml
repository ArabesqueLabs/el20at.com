[[comments]]
order = 1
subject = "الشيعة مذهب اسلامى مثل اى مذهب وهم يقولون لا الة ا"
author = "مصرى مسلم سنى على مذهب ابو حني"
posted = "2008-10-09"
text = "نحن المصريين سنة نحب ال البيت - الا نقرأ فى الصلاة اللهم صلى على محمد وعلى ال محمد ( من هم ال محمد )<br />ونقرأ فى القرأن ( لا اسالكم علية اجرا الا المودة فى القربى ) والقربى للرسول هم ال بيتة<br />اليست القاهرة عاصمة اهل السنة احيائها كلها مسماة باسماء ال البيت<br />القاهرة المحروسة باولياء اللة واهل البيت<br />حى الحسين<br />حى السيدة زينب<br />حى السيدة عائشة<br />حى عابدين وينسب الى سيدنا على زين العابدين وفية ميدان عابدين وقصر الحكومة قصر عابدين<br />وحى السيدة نفيسة<br />وحى الازهر - والازهر ينسب الى فاطمة الزهراء<br />يا ال بيت النبى حبكم فى اعماق القلوب<br />ويا سيدى الحسين لو كنت جئت الى مصر بدلا من العراق لحماك المصريون برموش عيونهم<br />لا تزرعوا خلاف استعمارى بين السنة والشيعة<br />كلنا نقول لا الة الا اللة محمد رسول اللة ونقيم الصلاة ونؤتى الزكاة ونصوم رمضان ونحج البيت<br />يا اهلنا الشيعة مرحبا بكم فانتم اهلنا وظهيرنا<br />ولا خلاف بيننا وبينكم كما يتبنى الغرب الصليبى وعملائة فى المنطقة"
archived = "2010-03-14"
