subject = "(أدبحوا الجمل) و ارموة للكلاب"
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2009-01-24"
text = "هذا هو القرار الذى سوف اتخذة لو كانت بيدى من السلطة و المقدرة<br />سوف ازبح الجمل و عائلتة من جميع انواع الحيوانات الغبية؟<br />و اللة على ما أقولة شهيد<br />و تحيا مصر بلا جمل او حيوانات غبية؟"
