subject = "كلهم غشاشون"
posted = "2009-01-22"
text = "اذا كان مسئولين عرب كبار بيغشوا<br />بيقابلوا المسئولين الاجانب يقولوا لهم كلام - ويقولوا للشعب كلام تانى - ويقولوا لبقية العرب كلام تالت - وللجرايد كلام رابع<br />يبقى جت على حتة مفتش<br />كلهم غشاشون"
