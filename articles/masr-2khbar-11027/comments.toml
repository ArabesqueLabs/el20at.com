[[comments]]
order = 1
subject = "الأمر كارثة لا هزل فيها"
author = "قرفان"
posted = "2009-01-23"
text = "إلى جميع مسئولي هذا البلد المنكوب<br />إلى جميع أولى الأمر في هذا البلد من المرضى بعقولهم والبلهاء والمعقدين نفسيا والمخرفين والقابعين في مزابل الفكر<br />‘رفعوا أيديكم عن أطفالنا وزهرات عمرنا وفلذات أكبادنا<br />ما تفعلونه باسم التعليم هو تخريب لعقول الأبرياء من تلاميذنا وتحطيم لقلوبهم الصغيرة<br />ما تفعلونه بأطفالنا هو نقل عمدي لأمراضكم المتوطنة والمزمنة لا تتحملها أجسادهم الطاهرة ولا عقولهم البسيطة<br />ما ترتكبونه في حق أولادنا هو جريمة حرب بمعنى الكلمة يجب أن تحاكموا عليها ويقضى عليكم فيها بالإعدام<br />ما تبثونه من سموم التعجيز وبلاهة الأسئلة وتعقيداتها التي تعجزون أنتم عن حلها هو عدوان علينا يفوق ما يرتكبه الصهاينة المجرمون<br />أيها المجرمون - أيها المرضى- أيها المسمومون- أيها المخربون - أيها الضائعون - أيها المساطيل - أيها المجانين<br />فسد التعليم بفسادكم ومات العلم بمرضكم وذهب الفكر بخرابكم وضاع أولادنا بسببكم<br />ما هذه المناهج القاتمة القاتلة المعقدة الفاسدة الخربة التي يتعاطاها أطفالنا وأبناؤنا على أيديكم ؟؟<br />من أنتم ؟ ما هي جبلتكم؟ ما هو ديدنكم ؟ ما هي ملتكم ؟ ما هو هدفكم ؟<br />أرفعوا أيديكم عن أطفالنا يا قتلة<br />إرفعوا أيديكم عن تلاميذنا يامجرمون<br />إرفعوا أيديكم عن أطفالنا يا مخربون<br />إرفعوا أيدكم عن أبنائنا يا معقدون<br />قرفت خلاص0000000000000<br />ة"
archived = "2010-03-14"
capture_url = ""

