subject = "غادة عبد العال، صاحبة مدونة (عايزة أتجوز)"
author = "مش متجوز"
text = "طيب يا استاذ محمد السويدي هي عايزه تتجوز وانا مش متجوز<br />ما تكسب فيها ثواب يا استاذ محمد السويدي وتساعدنا على لم الشمل واهو السهم بتاعي على السهم بتاعنا ونبني عشنا الصغير ونخلص صبيان ونبات وانتو يبقى ليكم الاجر والثواب<br />يلا انا مستني اهو يااستاذ محمد السويدي وعلى فكره السويدي دي قبيلة كبيرة في الامارات<br />سلام يا استاذ محمد السويدي وانا مش متجوز وعايز اتجوز ومستني الرد<br />سلام سلام سلام"
