[[comments]]
order = 6
subject = "يا شعبي ياحبيبي"
author = "حسني مبارك"
text = "يا شعبي حبيبي يا روحي يا بيبي يا حاطك في جيبي يا ابن الحلال<br />يا شعبي يا شاطر يا جابر خواطر يا ساكن مقابر وصابر وعال<br />يا واكل سمومك يا بايع هدومك يا حامل همومك و شايل جبال<br />يا شعبي اللي نايم وسارح وهايم وفي الفقر عايم وحاله دا حال<br />أحبك محشش مفرفش مطنش ودايخ مدروخ وآخر انسطال<br />أحبـك مكبـر دماغـك مخـدر ممشـّي امورك كدة باتكال<br />وأحب اللي ينصب وأحب اللي يكذب وأحب اللي ينهب ويسرق تلال<br />وأحب اللي شايف وعارف وخايف وبــالع لســانه وكاتم ما قال<br />وأحب اللي قافل عيونه المغفل وأحب البهايم وأحب البغال<br />وأحب اللي راضي وأحب اللي فاضي وأحب اللي عايز يربي العيال<br />وأحب اللي يائس واحب اللي بائس و احب اللي محبط وشايف محال<br />واحبك تســـافر وتبعد تهاجــر وتبعت فلوسك دولار أو ريال<br />واحبك تطبـّل تهـلل تهبـّـل عشان ماتش كورة وفيلم ومقال<br />واحبـك تأيــّد تعضّـد تمجّــد توافق تنافق وتلحس نعال<br />تحضّر نشـادر تجـمّع كوادر تلمـّع تقمـّع تظبـّط مجـال<br />لكن لـو تفكـّر تخـطط تقـرر تشغللي مخك وتفتح جدال<br />وتبدأ تشاكل وتعمل مشاكل وتنكش مسائل وتسأل سؤال<br />وعايز تنور وعايز تطور وتعمللي روحك مفرد رجال<br />ساعتها هاجيبك.. لايمكن أسيبك وراح تبقى عبرة وتصبح مثال<br />هابهدل جنابك وأذل اللي جابك وهيكون عذابك دا فوق الاحتمال<br />وامرمط سعادتك واهزأ سيادتك واخللي كرامتك في حالة هزال<br />وتلبس قضية وتصبح رزية وباقي حياتك تعيش في انعزال<br />هتقبل ها حبك.. هترفض هلبـّك هتطلع هتنزل هاجيبلك جمال"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120523/http://masr.20at.com:80/newArticle.php?sid=18453"

