[[comments]]
order = 4
subject = "هى ديون مصر اتسدت ولا لسه؟؟"
author = "مش رضوى حسن ولا مروى صلاح"
text = "هى ديون مصر اتسدت ولا لسه؟؟<br />بقالنا كام ميت سنه بنسد فى ديون مصر؟<br />هى لسه ما اتسدتش؟؟<br />كل التبرعات لسداد ديون مصر ما نفعتش؟<br />كل الإتاوات اللى بندفعها دى كلها ماخلصتش ديون مصر؟<br />*إتاوة على العقارات<br />إتاوة على السيارات<br />إتاوة على المواريث<br />إتاوة على الاراضى<br />إتاوة على المتغربين بره اللى طافحين الدم والذل فى الخليج وفى غيره بيدفعوا الإتاوة<br />وحتى اللى متغربين جوه .. الموظفين الغلابة بيدفعوا الإتاوة ورجلهم فوق رقبتهم<br />إتاوة على الشقق التمليك والايجار<br />دة ناقص يعملوا إتاوة على اللبس اللى كنا بنشتريه قبل ما نتفقر<br />وناقص يعملوا إتاوة على الاكل اللى كنا بناكله قبل ما نجوع<br />دة حتى الطلاق اللى هو خراب ديار عليه فلوس لازم تندفع تقريبا 200ج<br />طيب الجواز وعليه رسوم قلنا ماشى أهى فرحة ولازم الحكومة تاخد حلاوتها<br />لكن الطلاق كمان؟؟ صحيح موت وخراب ديار<br />إلا كل المليارات اللى بتطير على برة فى حسابات سويسرا ماعليهاش ضرايب ليه؟؟<br />ولا الإتاوات دى بتتفرض على الغلابة وبس؟؟<br />بالمناسبة هو عصر فتوات الحسينية انتهى ولا لسه؟؟ ولا دول الجيل التالت ؟؟ ولا ايه ؟؟<br />ــــــــــــــــــــــــــــ<br />*كلمات من المعجم المصرى المعاصر<br />إتاوة يعنى الضريبة والجمع إتاوات و ضرائب"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120523/http://masr.20at.com:80/newArticle.php?sid=18453"

