[[comments]]
order = 0
subject = "هو الظاهر ان كل اجتماع للحزب اياة يطلعوا لنا ببونتيكة او فرقعة كدابة وانا ادعوا العاقلين ان يفوتوا ويعتبروا ان العملية عيل وغلط"
author = "صعيدى فى الجامعة الامريكية"
text = "فى اجتماعهم قبل السابق طلع علينا العيال دول بموضوع الدعم وانة يجب ان يصل لمستحقية وانة بدل ما ندعم السلع نعطى الفقير دعم عينى او فلوس والعيال الصحفيين روجوا وطبلوا وزمروا والهتيفة اشتغلوا وبعدين طلع ان الموضوع غير قابل للتحقيق وظهرت طوابير الخبز وارتفاع الاسعار والبلاوى اللى احنا عايشين فيها<br />موضوع الاسهم دة غير قابل للتحقيق اطلاقا<br />والموضوع فرقعة وهتنتهى زى موضوع الدعم النقدى<br />انتم هتتكلموا فى احلام ناس عايشة فى الطراوة<br />ازاى 165 شركة كلهم شركات سكة وخردة هيعملوا اسهم ل 41 مليون مواطن<br />لية كل سهم بمليم<br />والا الشركات دى شركات عملاقة زى جنرال اليكتريك ووستنج هاوس ومرسيدس وجنرال موتورز وموتسوبيشى ومعاهم شركة تاتا الهندية<br />دا كلام بتخبط جردل بوظة بلدى وتروح تنام تحلم احلام وردية<br />بلاش لعب عيال"
archived = "2008-12-07"
capture_url = "https://web.archive.org/web/20081207120523/http://masr.20at.com:80/newArticle.php?sid=18453"

