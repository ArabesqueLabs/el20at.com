subject = "ولى الامر مومياء عندة 80 سنة وتخلف عقلى"
author = "مومياء عندة 80 سنة"
text = "ابق حط لبوس قبل ماتنام وتقول كلام تخاريف عن ولى الامر وولى النعم<br />ولى الامر اللى واخد اجازة مفتوحة فى الشرم بيلعب قمار فى المواخير هناك مع شارون والوليد ابن طلال والخواجة اولمرت<br />ولى امر اية يا متخلف<br />الناس واقفة فى طوابير ومش لاقية الرغيف"
