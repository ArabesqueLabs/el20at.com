[[comments]]
order = 3
subject = "إضراب يوم 4 مايو ، إنشاء الله يكون أخر عيد ميلاد"
author = "حزب الفيس بوك"
text = "ثورة ضد نظام مبارك الفاسد<br />إن من أهم تداعيات إضراب 6 أبريل هو إدراكنا بأن هذا الشعب لم يمت بعد وأن بجعبته الكثير لم يقدمه وأن بإستطاعته أن يعود مرة أخرة ليجتمع على هدف واحد وهو التخلص من النظام الفاسد المستبد الذى يحكمنا منذ ثلاثة عقود من الزمان<br />إضراب يوم 4 مايو ، إنشاء الله يكون أخر عيد ميلاد<br />أهم حاجة يا جماعة فى إضراب يوم 4 مايو أنه يحمل رسالة لرأس النظام نفسه و إن إحنا لم نختره مطلقا ً وأنه هو سبب الأزمات التى يمر بها الوطن - الغلاء ، الإحتكار ، الفساد ، عبارات غارقة ، عمارات منهارة ، غذاء فاسد ومسرطن ، التعليم فاشل راسب فى جميع المواد خلانا فى قاع الأمم ، الصحة مريضة مفرفرة والأرواح صعدت لبارئها ، الأمن لحماية النظام وبس ، محليات فاسدة كلها سرقة وتهليب ، وزارات تحمل أوزارها وأوزارنا إلى يوم الدين ، وزارة الداخلية باطشة ، وزارة الخارجية مطبعة عميلة منبطحة ، وزارة الزراعة فاسدة ومفسدة ، وزارة الصناعة أيام ما كان فيه صناعة وطنية بجد للأسف - وزارة خربة ، وزارة البترول والتعدين كلها سماسرة ومهلباتية وقومسيونجية سربت كل خير البلد مدعما ً للصهاينة ، وزارة العدل منقوصة العدالة ، وزارة المالية شفطت كل ما ليا فى البلد ، وزارة الإسكان سكنت الناس فى عشش ومقابر ، وزارة التخطيط خططت كويس لنهب وشفط ثروات البلد ، وزارة ( التضامن الإجتماعى ) التأمينات الإجتماعية أمنت مستقبل جمال مبارك فقط ، وزارة القوى العاملة والعمل عملت كل ما بوسعها لطرد شباب مصر بره مصر ، وزارة السياحة سايحة على حل شعرها ، وزارة الإستثمار قطفت كل ثمار البلد ورمته فى حجر علاء مبارك ، وزارة الإعلام ربنا عالم بحالها من سرقة و رشوة وتكميم الأفواه ونفاق وكوسة وواسطة وإسألوا عن العائلات فى ماسبيرو عائلة شلبى ( سهير شلبى ، أحلام شلبى ) وعائلة بسيونى ( أمين بسيونى ، علاء بسيونى ، تامر بسيونى ) وعائلة الزمر ( فريدة الزمر ، فايز الزمر ) وعائلة الأتربى ( سامية الأتربى ، سهير الأتربى ) كل دول عائلات فى ماسبيرو ، وزارة الثقافة تطبق الآيه \\\" وإقتلوهم حيث ثقفتموهم \\\" طبعا ده بالنسبة لأعضاء حركة كفاية ، وزارة الأوقاف ربنا يوقف حالها نهبت أراضينا كلها ده غير نهب حصيلة النذور فى مساجدها الصوفية ، وزارة النقل والمواصلات طبعا متخصصة فى نقل جثث شهداء الطرق وتوصيلهم إلى ذويهم ، وزارة الإتصالات تخصصت فى الدعم الفنى لشبكات الإنترنت وشبكات المحمول لمساعدة جهاز أمن الدولة لمعرفة فيما يتحدث المواطنون ثم الإتصال بهم جنسيا ً عند التقاءهم فى أقسام الشرطة ، وزارة التربية والتعليم تخصصت فى تربية الطفل المصرى على حب آل مبارك ، مجلس الشعب والشورى عشان التهليب والتصفيق ، والحزب الحاكم حزب فاشى فاشل حتى تأشيرة الحج بيتربحوا من وراها إيه الناس الكفرة دى ..... إلخ<br />وإن تعدوا مصائب النظام لن تحصوها<br />يا جماعة الإضراب ده مهم جدا للضغط على النظام من قوى خارجية زى ما تشوف واحد جارك مكفر أهله معاه بخيل مع مراته وأولاده لازم ولاده يحجروا عليه وياخدوا حقوقهم بالقوة طبعا الجيران مش هيساندوه أضعف الإيمان هينصحوه ويقولوا له لازم تراعى الناس اللى فى رقبتك دى ، أو واحدة كفرانة مع زوجها وأخر ما زهقت تروح تخلعه وتفضحه فى الشارع والجيران وأهله والمجتمع والمحاكم ، أهو إحنا كفرانين من زمان وعايزين نخلعه<br />وطبعا موقع الفيس بوك ده أكبر دليل على رأى الناس فى النظام الفاسد المستبد لأن لا هو القناة الأولى ولا التانية ولا جريدة الأهرام ولا الأخبار ولا الجمهورية ولا المساء ولا الصحيفة الغراء فى النفاق ولعق أحذية النظام ( روزاليوسف ) يعنى الموقع ده فيه ديمقراطية بجد مش ديمقراطية الفكر الجديد اللى هيقضى على ما تبقى من الوطن وهو فعلا بيعبر عننا إحنا يعنى إحنا لا حزب وثنى ولا غيره ولا جماعة محظورة ولا غيرها<br />إحنا كلنا ولاد البلد دى وعايزينها أحسن من كده عايزينها ترجع أحسن وأحسن مما كانت عليه قبل الحرامية والأونطاجية يمسكوا زمام أمورها ويخلوها فى ذيل قائمة الأمم<br />ملحوظة :<br />هناك تشابه بين مناخ البلد دلوقت ومناخ البلد ما قبل الثورة وأيضا ما قبل النكسة وأيضا ما قبل مقتل السادات يعنى النظام فى مصر لازم يتغير بكارثة .. للأسف<br />وطبعا لازم يكون هناك ضحايا أو من يدفع الثمن<br />بس الجديد فى الموضوع أن مناخ ما قبل الثورة كان فيه فقر وظلم طبعا ، بس كان فيه ديمقراطية<br />ومناخ ما قبل النكسة كان إستبداد ومعتقلات ، لكن كان فى تعليم وصحة وصناعة<br />ومناخ ما قبل مقتل السادات كان برضه ظلم وإستبداد ، لكن كان فيه إنتصار أكتوبر وكان فى ثروات قومية<br />أما المناخ السائد فحدث ولا حرج ، طبعا مفيش عدل ولا ثروات قومية ولا تعليم ولا صحة ولا صناعة وطنية ولا صناعة خالص أساسا ولا أية إنتصارات سوى إنتصارات منتخب حسن شحاته<br />للأسف الموجود دلوقت هو كل موبقات الزمن الفائت بالإضافة طبعا ًإلى التوريث<br />فلتكن الثورة ضد الظلم ، أو أضعف الإيمان كلمة حق فى وجه سلطان جائر"
archived = "2008-04-11"
capture_url = "https://web.archive.org/web/20080411220259/http://masr.20at.com:80/newArticle.php?sid=15079"

[[comments]]
order = 4
subject = "البخت الاسود بيقول ان مبارك مش هيحضر اى قمة تانى"
author = "ارب ودع وموشوش الدكر"
text = "مبارك لم يحضر قمة دمشق<br />فأل سىء<br />بعض العرافين والدجالين بيقولوا خلاص مش هيشوف قمم عربية تانى<br />لان ورقتة سقطت فى رجب اللى فات ومنتظر مقابلة رب رحيم<br />وبيقولوا خلاص<br />كل شىء وصل للنهاية<br />لا الامن المركزى نفعة ولا مباحث امن الدولة ولا البنك الدولى<br />بيقضى الايام الاخيرة فى تهيأت واوهام ماقبل الموت<br />ربنا يحفظنا من الزهايمر<br />وان يكون اخر كلامنا لا الة الا اللة ومحمد رسول اللة"
archived = "2008-04-11"
capture_url = "https://web.archive.org/web/20080411220259/http://masr.20at.com:80/newArticle.php?sid=15079"

