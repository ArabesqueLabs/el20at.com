order = 0
subject = "من خرج على ولاة الأمور ونابذهم، وألب عليهم خارج عن معتقد أهل السنة"
author = "http://www.ajurry.com/vb/showthread.php?p=10571"
text = "أحسن الله إليكم وهذا يقول: هل من خالف في مسألة من مسائل الاعتقاد كمسألة السمع والطاعة لولي الأمر هل يعتبر خارجا عن منهج أهل السنة والجماعة؟<br />نعم. خارج عن منهج أهل السنة والجماعة من خرج على ولاة الأمور ونابذهم، وألب عليهم خارج عن معتقد أهل السنة والجماعة؛ ولهذا في مؤلفات أهل السنة والجماعة في كل عقيدة كتب أهل السنة والجماعة يقول: ولا نرى الخروج على أئمتنا، ونري طاعتهم من طاعة الله، وندعو لهم بالصلاح والمعافاة؛ كما قاله الطحاوي و كما قال غيره. كل عقيدة من أهل السنة والجماعة هكذا يقولون: ونرى السمع والطاعة لولاة الأمور في طاعة الله ولا نخرج على أئمتنا ولا ننزع يدا من طاعتهم ونرى طاعتهم من طاعة الله وقال الطحاوي: وندعو لهم بالصلاح والمعافاة. هذه عقيدة أهل السنة والجماعة.<br />فمن خرج على ولاة الأمور أو ألب عليهم أو نابذهم أو قاتلهم؛ فإنه من أهل البدع. هذه طريقة الخوارج وطريقة المعتزلة. أهل البدع لا يرون السمع والطاعة لولاة الأمور، هذه طريقة الخوارج والمعتزلة والروافض؛ فالخوارج يرون أن ولي الأمر حتى ولو فعل ولي الأمر المعصية ولو فعل الكبيرة، ولو قتل بعض الناس أو أخذ بعض الناس؛ لا يجوز الخروج عليه كما في الحديث: (وإن ضرب ظهرك وأخذ مالك ) رواه مسلم في صحيحه، وذلك لأن الخروج على ولي الأمر يترتب عليه مفاسد أعظم فأنت تريد أن تنكر المنكر، لكن لا ينكر المنكر بمنكر أعظم.<br />إذا فعل ولي الأمر مثلا معصية في أي وقت، وفي أي زمان وفي أي مكان كأن فعل بعض المعاصي شرب الخمر، كذا مثلا ضرب بعض الناس، سجن بعض الناس هذه معصية، هذا منكر هل تنكر المنكر بمنكر أعظم؟ إذا خرجت عليه أنكرت منكر بمنكر أعظم.<br />لأن الخروج على ولاة الأمور يترتب عليه مفاسد وفتن لا أول لها ولا آخر، تقضي على الأخضر واليابس؛ يترتب على ذلك اختلال الأمن، وإراقة الدماء وتربص الأعداء بهم الدوائر، واختلال الأمن واختلال الاقتصاد والمعيشة والسياسة والتعليم والزراعة وغير ذلك من الفتن التي تقضي على الأخضر واليابس. كل هذه الفتن من المفاسد؛ لكن مفسدة الظلم لبعض الناس أو القتل هذه مفسدة صغرى؛ ولهذا قال النبي -صلى الله عليه وسلم-: (من رأى من أميره شيئا يكرهه فليصبر؛ فإنه من فارق الجماعة قيد شبر فمات فميتته جاهلية ) انظر، من فرق من أميره شيء فليصبر، الصبر -يعني- التحمل فإن من فارق الجماعة شبرا فمات فميتته جاهلية رواه الإمام مسلم في صحيحه، فميتته ميتة جاهلية؛ فدل على أن الخروج على ولاة الأمور من كبائر الذنوب كبيرة من كبائر الذنوب.<br />والخروج على ولاة الأمور من شعار أهل البدع، فالخوارج يرون أن ولي الأمر إذا فعل معصية أو كبيرة كفر ووجب قتله والخروج عليه، هذه طريقة الخوارج فالخوارجفرقة ضالة. وكذلك المعتزلة يرون أن ولي الأمر إذا فعل كبيرة خرج من الإيمان ودخل في الكفر فيسمى فاسقا لا مؤمن ولا كافر، وفي الآخرة يخلدونه في النار.<br />والخوارج يقولون: خرج من الإيمان ودخل في الكفر وهو مخلد في النار، وكذلك الروافض يرون عدم السمع والطاعة لولاة الأمور يقولون: ليس هناك ولاية إلا للإمام المعصوم عندهم، فجميع الأئمة غير المعصومين يجوز الخروج عليهم عند الروافض، وتبين بهذا أن الخروج على ولاة الأمور من شعار أهل البدع؛ من شعار الخوارج والمعتزلة والروافض.<br />أما أهل السنة الجماعة فإنهم لا يخرجون على ولاة الأمور ولو فعلوا المعاصي، ولو فعلوا الكبائر، ولو جاروا ولو ظلموا لكن النصيحة مبذولة، النصيحة مبذولة لولاة الأمور من قبل أهل الحل وأهل العلم تبذل لهم في الوقت المناسب، فإن قبلوها فالحمد لله وإن لم يقبلوا فقد أدى الناس ما عليهم.<br />كما قال النبي -صلى الله عليه وسلم- (أدوا الحق الذي عليكم واسألوا الله الذي لكم ) أنت أدي الحق الذي عليك وأما الذي لك فسأل الله، أما الخروج لا يجب الخروج، هذا من شعار أهل البدع ويترتب عليه الفوضى، ويترتب عليه الاضطراب، ويترتب عليه تدخل الأعداء والدول الكافرة إلى غير ذلك من المفاسد التي لا أول لها ولا آخر. نسأل الله السلامة والعافية. نعم."
archived = "2008-04-11"
capture_url = "https://web.archive.org/web/20080411220259/http://masr.20at.com:80/newArticle.php?sid=15079"

