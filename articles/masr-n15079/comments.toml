[[comments]]
order = 6
subject = "عاش حزب الفيس بوك"
author = "المصرى أفندى"
text = "الى حزب الفيس بوك: يسلم فمك ياجدع. أيه ده درر !! أنا اؤيدك بشدة لأن زى مابيقولوا أيش ياخد الريح من البلاط . هى الناس خايفة ليه ومن أيه دا الحرامية سرقوها وحلبوها لما جابت دم. أنا حاسس أننا فى كابوس ثقيل أسمه حسنى مبارك. أنا مش عارف فين البركه دا فقر وشؤم على مصر من يومه. الدول كلها بتتقدم حتى أوغندا وأحنا للخلف در. دول بيسرقونا ويجوعونا ويطلعولنا لسانهم. أنا أدعو كل مصرى للأستجابة لدعوة حزب الفيس بوك . والله ده حيبقى أقوى من كل الأحزاب الكرتونية المرتزقة مع الحزب الوثنى البلطجى الغير ديمقراطى."
archived = "2008-04-11"
capture_url = "https://web.archive.org/web/20080411220259/http://masr.20at.com:80/newArticle.php?sid=15079"
