text = "فيه واحد مصلوب مش فاهم الصورة دي معناها ايه<br />وشفتوا فضيلة المرشد وهو قاعد وحاطط رجل على رجل ومتعنطظ علىالاخر<br />يعجبني المرشد العام لما يتعنطظ"
