[[comments]]
order = 2
subject = "من صدق النبوة مجالسة الفقراء"
author = "مش ححبك"
posted = "2008-06-19"
text = "لما النبي محمد صلى الله عليه وسلم بعث رسالة الى المقوقس كبير الاقباط في مصر برسالة يدعوه فيها الى الاسلام<br />سال المقوقس حامل الرسالة مجموعة من الاسئلة حول النبي محمد صلى الله عليه وسلم من ضمن الاسئلة<br />من يجالس؟ صلوات الله وسلامه عليه<br />فلما علم المقوقس ان النبي محمد صلى الله عليه وسلم يجالس الفقراء صلوات الله وسلامه عليه تأكد من نبوته صلى الهل عليه وسلم<br />اظن فهمتوا انا عايز اقول ايه<br />معلش باه اصل انا معقد نفسيا وساكن في الاحياء التعبانة اللي زي المرج والمطريه والحجات الوحشة دي<br />وهما ساكنين في الزمالك والمعادي والدقي والمهندسين ومصر الجديدة والقاهرة الجديدة<br />ايش جاب لجاب"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الكبير كبير والنص نص نص نص والصغير ما نعرفوش"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-06-19"
text = "وانا بقرأ المقاله لا اعرف ايه اللي خلاني اتذكر مقولة احد الفنانين من الوسط الفني<br />الكبير كبير<br />والنص نص نص نص<br />والصغير ما نعرفوش<br />يعني الشيخ محمد الغزالي جوز بنته لابن احسان عبدالقدوس رغم اختلاف الشخصيتان تماما دا كانت حب وغرام ومحمد الغزالي داعية اسلامي كبير<br />فالكاتب الكبير مع الداعية الاسلامي الكبير يبقى الكبير كبير<br />تماما زي ما حصل مع واحد من الاخوان المسلمين كبير اوي من جماعة خيرت الشاطر جوز ابنه لبنت عادل امام الممثل الكبير<br />ويبقى برضه الكبير كبير<br />يبقى كبير كبير وعايز يناسب الكبير اللي زيه داعية اسلامي كبير صحفي كبير فنان كبير رقاصه كبيره مش مهم المهم ان الكبير كبير<br />يعني لو الشيخ محمد الغزالي كان اتقدم لبنته واحد اسلامي بس جروبع مثلي يا ترى كان حيوافق بيه<br />ولو كان ابن الراجل الاخوانجي حب بنت واحد اي كلام زيي كده كان حيوافق على هذه الجوازه<br />اساله بحاجه الى اجابات؟؟؟؟؟؟؟؟؟؟؟"
archived = "2010-03-14"
capture_url = ""

