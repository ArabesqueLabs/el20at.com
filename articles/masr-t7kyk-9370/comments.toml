[[comments]]
order = 0
subject = "من الرجال القلائل فى زمن الخصيان"
author = "شايف"
posted = "2008-06-18"
text = "الخصيان هم الذين استئصلوا خصيتهم وفقدوا رجولتهم ووضعوهم فى قصور الحريم ايام المماليك لخدمة النسوان<br />وكانت النسوان تضربهم على قفاهم فيسكتون لانهم فقدوا الرجولة<br />كم من الرجال يضرب على قفاة ويبتسم سواء فى اقسام الشرطة او فى العمل<br />كثير من الرجال الان من الخصيان او باخلاق الخصيان اى لا يثورون<br />بيخافوا<br />ومحمد عبد القدوس رجل من الرجال الحقيقيون<br />بيطلع فى المظاهرات<br />بيعتقل - بيحبس - بيوضع خلف القضبان<br />لكنة رجل ولا يخاف<br />تحية لمحمد عبد القدوس الرجل"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 1
subject = "ايوه يا عم الزمالك مش المرج وعزبة النخل"
author = "مش البراء اشرف ولا شريف الدواخ"
posted = "2008-06-19"
text = "ايوه يا عم يسهلك ربنا<br />طبعا الوالد الله يرحمه ويبشبش الطولة اللي تحت راسه المجاهد الكبير احسان عبدالقدوس ترك له ثورة طائلة من اعمال البر والتقوى والله يرحم الست والدته روزال يوسف هانم"
archived = "2010-03-14"
