subject = "ردود أفعال مختلفة في الشارع المصري على خبر البراءة"
author = "مش ححبك"
posted = "2008-07-28"
text = "الاخ اللي اخذ اراء الناس اللي ماشيين في الشارع<br />دا غلط من الناحية العلمية<br />لان الحكم الي صدر له اسباب وحيثيات<br />فيه حاجه اسمها اسباب وحيثيات الحكم<br />ما حكمش بالبراءة كده وهنو قاعد على البلاج<br />قبل ما يصدر حكم بالبراءة القاضي كتب على الاقل 50 صفحة (اسباب وحيثيات الحكم)<br />هي فين الاسباب والحيثيات علشان خاطر نقرأها"
