text = "من غير ما اسمع كلام منتصر الزيات<br />المفروض ان منتصر الزيات دا راجل محامي<br />فيه حاجه اسمها (اسباب وحيثيات الحكم)<br />وفيه حاجه اسمها طعن بالاستئناف<br />روح يا عم اطعن بالاستئناف وبلاش دعاية سياسية وبلاش الحركات بتاعة الاخوان دية<br />اذا كانت العبارة فيها الف ضحية<br />ففيه ملايين ضحية جوا البلد مش لاقيين حد يا خد حقهم"
