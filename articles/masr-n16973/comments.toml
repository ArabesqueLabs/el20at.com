[[comments]]
order = 12
subject = "اهو كلام القضاه يا جماعة اقرءوا (البراءة) بتيجي از"
author = "مش لازم (موظف محاكم)"
posted = "2008-07-29"
text = "وحيث إن أصل البراءة يعتبر قاعدة أساسية في النظام ألاتهامي لاترخص فيها ، تفرضها حقائق الأشياء وتقتضيها الشرعية الإجرائية وحماية الفرد في مواجهة صور التحكم والتسلط والتحامل بما يحول دون اعتبار واقعة تقوم بها الجريمة ثابته بغير دليل حاد قاطع يبلغ مبلغ الجزم واليقين ولايدع مجالا لشبهة انتفاء التهمة أو الشك فيها ، ودون ذلك لاينهدم أصل البراءة<br />وحيث إن أصل البراءة يعتبر قاعدة أساسية في النظام الإتهامي، لا ترخص فيها، تفرضها حقائق الأشياء وتقتضيها الشرعية الإجرائية وحماية الفرد في مواجهة صور التحكم والتحامل، بما يحول دون اعتبار واقعة تقوم بها الجريمة ثابتة بغير دليل حاد قاطع يبلغ مبلغ الجزم واليقين ولا يدع مجالاً لشبهة انتفاء التهمة أو الشك فيها ، ودون ذلك لا ينهدم أصل البراءة،<br />من المقرر أن البلاغ عن جريمة لا يكفي وحده للقبض على المتهم وتفتيشه وتفتيش مسكنه أو متجره بل يجب على الشرطة أن تقوم بعمل تحريات عما اشتمل عليه البلاغ فإذا أسفرت تلك التحريات عن توافر دلائل قوية على ما ورد بالبلاغ، فعندئذ يسوغ لرجال الضبط في الحالات المبينة في القانون أن يقبض عليه وتفتيشه<br />وحيث إنه ولما كان المقرر أنه أصل البراءة من الأسس الدستورية والقانونية التي أقرتها الدساتير والتي لاتنهدم وتزول إلا بالدليل القاطع وأنه حسب المحكمة أن تتشكك في اكتمال أركان الجريمة أو إسنادها إلى المتهم على وجه القطع لتقضي بالبراءة كون الأحكام الجزائية لاتبنى إلا على القطع واليقين<br />وحيث إن المحكمة غير ملزمة بتتبع المتهم في مناحي دفاعه الموضوعية والرد على كل شبهة تمت إثارتها استقلالاً ما دامت قد اطمأنت إلى قيام الاتهام وصحة نسبته من واقع ما سلف من أدلة الثبوت المار ذكرها ويضحي ما أثاره المتهم من دفاع موضوعي وإنكاره بجلسة المحاكمة مجرد ضرب من ضروب الدفاع قصد به الإفلات من العقاب<br />وحيث إن المقرر أنه بحسب المحكمة أن تتشكك في صحة اسناد التهمة إلى المتهم لكي تقضي بالبراءة إذ مرجع الأمر في ذلك إلى ما تطمئن إليه من تقدير الدليل ما دام الظاهر من الحكم أنه أحاط بالدعوى عن بصر وبصيرة وأنه ليس على المحكمه في حالة القضاء بالبراءة أن ترد على كل دليل من أدلة الاتهام بل يكفي أن يكون الرد مستفادا من حكمها بالبراءة استنادا إلى ما اطمأنت إليه من أدلة<br />وحيث انه من المقرر ان الاحكام الجنائية يجب ان تبنى على الجزم واليقين من الواقع الذي يثبته الدليل المعتبر ولا تؤسس على الظن والاحتمال من الفروض والاعتبارات المجردة وكان من المقرر ايضا في اصول الاستدلال ان يكون الدليل الذي يعول عليه في الحكم مؤديا الى ما رتبه عليه من نتائج من غير تعسف في الاستنتاج ولا تنافر في حكم العقل والمنطق.<br />من المقرر ان الاعتراف في المسائل الجنائية من العناصر التي تملك محكمة الموضوع كامل الحرية في تقدير صحتها وقيمتها في الإثبات فلها ان تأخذ باعتراف المتهم في أي دور من ادوار التحقيق ولو عدل عنه متى اطمأنت الى صحته ومطابقته للحقيقة والواقع وان عبء إثبات حصول الإكراه الذي يترتب عليه بطلان الاعتراف يقع على عاتق المتهم.<br />وكان من المستقر عليه قضاء ان الأحكام الجنائية يجب ان تبنى على حجج قطعية الثبوت وتفيد الجزم واليقين من الواقع الذي يثبته الدليل المعتبر، ولا تؤسس على الظن والاحتمال من الفروض والاعتبارات المجردة<br />وكان الشك يفسر دائما لصالح المتهم ذلك بان الشك لا ينفي أصل البراءة مهما كان احتمال الثبوت ودرجته<br />وحيث انه من المقرر ان أصل البراءة يعتبر قاعدة أساسية في النظام ألاتهامي لا ترخص فيها تفرضها حقائق الأشياء وتقتضيها الشرعية الإجرائية وحماية الفرد في مواجهة صور التحكم والتسلط والتحامل بما يحول دون اعتبار واقعة تقوم بها الجريمة ثابتة بغير دليل جاد قاطع يبلغ مبلغ الجزم واليقين ولا يدع مجالا لشبهة انتفاء التهمة او الشك فيها ودون ذلك لا ينهدم أصل البراءة.<br />كما وانه من المقرر كذلك انه يكفي في المحاكمات الجنائية ان تتشكك محكمة الموضوع في صحة إسناد التهمة الى المتهم كي تقضي له بالبراءة إذ مرجع الأمر في ذلك الى ما تطمئن إليه في تقدير الدليل ما دام حكمها يشتمل على ما يفيد إنها محصت واقعة الدعوى وأحاطت بظروفها وبأدلة الثبوت التي قام عليها الاتهام ووازنت بينها وبين أدلة النفي فرجحت دفاع المتهم او داخلتها الريبة والشك في عناصر الإثبات ـ كما وانه لا يصح النعي على المحكمة إنها قضت ببراءة المتهم بناء على احتمال ترجح لديها بدعوى قيام احتمالات أخرى قد تصلح لدى غيرها لان ملاك الأمر كله يرجع الى وجدان قاضيها وما يطمئن إليه ما دام انه قد أقام قضائه على أسباب تحمله."
archived = "2008-07-30"
capture_url = "https://web.archive.org/web/20080730015618/http://masr.20at.com:80/newArticle.php?sid=16973"

