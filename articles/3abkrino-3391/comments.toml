author = "مصرى بتاع الفول"
posted = "2007-05-06"
text = "انا عايش فى السعودية وكلام الاخت غير دقيق فالاسر هنا تعشق هذا الحيوان الضب وكثير منهم يتفنون فى اعداد وجباتة والحمد للة اننى مصرى اكل الفول بدلا من ان اكون متوحشا ااكل الضب والجراد مثل قبائل النمنم"
