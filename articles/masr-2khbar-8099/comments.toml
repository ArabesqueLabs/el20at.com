[[comments]]
order = 0
subject = "طاعة ولاة الأمر واجبة وإن ظلموا"
author = "مش ضروري"
posted = "2008-01-23"
text = "طاعة ولاة الأمر واجبة وإن ظلموا<br />بسم الله الرحمن الرحيم<br />نقل ابن حجر رحمه الله الإجماع على عدم جواز الخروج على السلطان الظالم : فقال قال ابن بطال :د((وفى الحديث حجة على ترك الخروج على السلطان ولو جار وقد اجمع الفقهاء على وجوب طاعة السلطان المتغلب والجهاد معه وأن طاعته خير من الخروج عليه لما فى ذلك من حقن الدماء وتسكين الدهماء)) فتح البارى 13/7 ونقل الامام النووى -رحمه الله - الإجماع على ذلك فقال في ((واما الخروج عليهم وقتالهم فحرام باجماع المسلمين وإن كانوافسقة ظالمين وقد تظاهرت الاحاديث على ماذكرته واجمع اهل السنه انه لاينعزل السلطان بالفسق....... )) شرح النووى 12/229<br />قال الرسول صلى الله عليه وسلم<br />((من أطاعني فقد أطاع الله ومن يعصني فقد عصا الله ومن يطع أميري فقد أطاعني ومن يعص أميري فقد عصاني )) رواه مسلم<br />وعن ابي هريرة -رضي الله عنه -(( قال قال رسول الله صلى الله عليه وسلم: (( عليك السمع والطاعة في عسرك ويسرك ومنشطك ومكرهك وأثرة عليك )) رواه مسلم ( 1836)<br />قال شيخ الإسلام ابن تيمية - رحمه الله -:<br />((فطاعة الله ورسوله واجبة على كل أحد , وطاعة ولاة الأمور واجبة لأمر الله بطاعتهم ,<br />فمن أطاع الله ورسوله بطاعة ولاة الأمور لله فأجره على الله ومن كان لايطيعهم إلا لما يأخذ ه من الولاية فإن أعطوه أطاعهم وإن منعوه عصاهم , فماله في الآخرة من خلاق ,<br />وقد روى البخاري ومسلم عن أبي هريرة -رضي الله عنه -عن النبي صلى الله عليه وسلم قال :<br />(( ثلاثة لايكلمهم الله يوم القيامة ولاينظر إليهم ولايزكيهم , ولهم عذاب أليم :<br />رجل على فضل ماء بالفلاة يمنعه من ابن السبيل ,<br />ورجل بايع رجلاً سلعة بعد العصر فحلف له بالله لأخذها بكذا وكذا فصدقه وهو غير ذلك<br />ورجل بايع إماماً لايبايعه إلا لدنيا , فإن أعطاه منها وفا وإن لم يعطه منها لم يف )) الفتاوى ( 35/16-17)<br />وقال الرسول صلى الله عليه وسلم (( لما سأله رجل :يانبي الله<br />أرأيت إن قامت علينا أمراء يسألوننا حقهم ويمنعوننا حقنا فما تأمرنا؟ فأعرض عنه ثم سأله فأعرض عنه<br />ثم سأله في الثالثة فجذبه الأشعث بن قيس فقال صلى الله عليه وسلم (( اسمعوا وأطيعوا<br />فإنما عليهم ماحملوا وعليكم ماحملتم )) رواه مسلم ( 1846)<br />( المفهم 4/55) قال القرطبي : ( يعني ان الله تعالى كلف الولاة العدل وحسن الرعاية<br />وكلف المُولَى عليهم الطاعة وحسن النصيحة فأراد :<br />انه إذاعصى الأمراء الله فيكم ولم يقوموا بحقوقكم , فلاتعصوا الله انتم فيهم وقوموا بحقوقهم<br />فإن الله مجاز كل واحد من الفريقين بما عمل .)) المفهم (4/55)<br />وقال النبي صلى الله عليه وسلم في الحديث الذي رواه مسلم<br />((يكون بعدي أئمة لايهتدون بهداي ولايستنون بسنتي وسيقوم فيهم رجال قلوبهم قلوب الشياطين<br />في جثمان إنس قال ( حذيفة): قلت : كيف أصنع يارسول الله ؟ إن أدركت ذلك ؟؟<br />قال : (( تسمع وتطيع وإن ضرب ظهرك وأخذ مالك , فاسمع وأطع ))<br />رواه البخاري ( 7084) ومسلم ( 1847) باب ( يصبر على أذاهم وتؤدى حقوقهم )<br />وقال النبي صلى الله عليه وسلم (( من كره من أميره شيئاً<br />فليصبر عليه ,فإنه ليس من أحد من الناس يخرج من السلطان شبراً فمات عليه , إلا مات ميتة جاهلية ))<br />رواه مسلم من حديث ابن عباس -رضي الله عنه - (1849) ورواه البخاري ( 7053)<br />وعن نافع قال : جاء عبد الله بن عمر الى عبد الله بن مطيع حين كان من أمر الحرة ماكان<br />من يزيد بن معاوية فقال : اطرحوا لأبي عبد الرحمن وسادة . فقال : إني لم آتك لأجلس , أتيتك لأحدثك حديثاً سمعت رسول الله صلى الله عليه وسلم يقوله , سمعته يقول :<br />(( من خلع يداً من طاعة , لقي الله يوم القيامة لاحجة له , ومن مات وليس في عنقه بيعة , مات ميتة جاهلية ))رواه مسلم<br />( 1851)<br />قال القرطبي في المفهم :<br />قوله ( ولاحجة له ) أي لايجد حجة يحتج بها عند السؤال فيستحق العذاب ,لأن الرسول صلى الله عليه وسلم قد أبلغه ماامره الله بإبلاغه من وجوب السمع والطاعة لأولي الأمر , في الكتاب والسنة ) انتهى كلامه"
