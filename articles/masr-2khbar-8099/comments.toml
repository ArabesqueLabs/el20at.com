subject = "امراء يكذبون ويظلمون"
author = "قرف الزمان"
posted = "2008-01-24"
text = "قال رسول اللة صلى اللة علية وسلم<br />اما انة سيكون بعدى امراء يكذبون ويظلمون - فمن صدقهم بكذبهم وما لاهم على ظلمهم فليس منى ولست منة - ومن لم يصدقهم بكذبهم ولم يمالئهم على ظلمهم فهو منى وانا منة - الا وان سبحان اللة والحمد للة ولا الة الا اللة من الباقيات الصالحات"
