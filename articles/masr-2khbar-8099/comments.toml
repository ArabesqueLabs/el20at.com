[[comments]]
order = 2
subject = "فينك ياشعبان ياعبدالرحيم"
author = "أيام وراحت"
posted = "2008-01-23"
text = "الله يرحم أيامك يا أمير الشعراء - الله يرحم أيامك يافارس الكلمة - الله يرحم أيامك يا أصيل - الله يرحمك يا أستاذ شعبان عبدالرحيم إيييييييييييه . تعالى شوف . من بعدك إيه اللي جرى لنا ..حتى الشعر بقوا بيحطوا عليه مبيدات من بتاعة يوسف والي وبقى بيستوي في تلات دقايق ولا الطماطم الاسرائيلي - قال إيه يا حاج شعبان طلع لنا واحد شغال \" أستوذ\" في الأدب والنقد - يا شعبان \" النقد\" مش \"سندوق النقد\" إصحى بقى .. ياعم \" النقد\" مش الفلوس .. النقد ده يعني كدة واحد بيوزن الكلام ويطلع الحلو اللي فيه وبرضه الوحش اللي فيه ..شوف بقى الراجل اللي زي ده يبقى المفروض عنده كلام حلو قد إيييييييييييه .. إطلع بقى فوق وإقرا .قصدي خللي حد يقرالك يا أستاذ شعبان .. وقول لي رأيك ..قصدي قول له رأيك .. بس سايق عليك النبي أوعى تشتمه ولا تحدفه بسن المكوة في نافوخه .. أصله لسه طري وما كملشي علام .. بس أقول لك يا عمنا شعبان ..ماهو انت السبب .. أديك سبت الساحة والمجمع اللغوي لشوية عيال وأساتيذ أدب ونقد يلعبوا في الشعر من وراك .. بتقول اسمه إيه ..اسمه المعبدي ..أيوه المعبدي إيييييييه<br />يا مصر اركعي واسجدي بشراك بفتاك المعبدي<br />منافق ومرائي ومهتدي بهدى الحاكم المعتدي<br />يقول قفاي يا سيدي لكفك يشتاق ويسعدِ<br />إيه رأيك ياعم شعبان يا أمير الشعراء ما أحنا بنقول برضه أهوه -إيييييييييييييييييييييييييييييييييه- دنيا"
archived = "2010-03-14"
capture_url = ""

