subject = "الى احمد المصري"
author = "اكتب اسمك هنا"
posted = "2008-01-26"
text = "انت مرة تكتب احمد المصري ومرة احمد القبطي ما ترسيلك على بر<br />وبعدين الكلام اللي مكتوب في اول تعليق والكلام اللي انت كاتبه لا بمزاجي ولا بمزاجك<br />علماء الدين هما اللي يقرروا لا انا ولا انت<br />وعلى حسب علمي ان الاسلام فيه عصور يعني الكلام بتاعك دا ينفع في عصر الخلفاء<br />لاكن ما ينفعص في مصر الامن المركزي وامن الدولة<br />فهمت يااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااا"
