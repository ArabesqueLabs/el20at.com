[[comments]]
order = 4
subject = "مناصحة االوالي الظالم واجب أيضا"
author = "أحمد المصري"
posted = "2008-01-24"
text = "ما قلته حق يراد به باطل. طاعة ولي الأمر واجبة في أوامره و لكن رده و مناصحته و محاسبته واجبة أيضا (السلطة المطلقة مفسدة مطلقة) و لم يأمرنا الإسلام بالإفساد.<br />من واجبنا دفع الضرائب و أحترام قانون الدولة (الحاكم) مهما كان و لكن من واجبنا أيضا السعي لرد المظالم و إقامة العدل و طلب حقوقنا من حاكم ظالم.<br />هذا حديث مصنف عل أنه (حسن غريب)<br />‏حدثنا ‏ ‏محمد بن عبادة الواسطي ‏ ‏حدثنا ‏ ‏يزيد يعني ابن هارون ‏ ‏أخبرنا ‏ ‏إسرائيل ‏ ‏حدثنا ‏ ‏محمد بن جحادة ‏ ‏عن ‏ ‏عطية العوفي ‏ ‏عن ‏ ‏أبي سعيد الخدري ‏ ‏قال ‏<br />‏قال رسول الله ‏ ‏صلى الله عليه وسلم ‏ ‏أفضل الجهاد كلمة عدل عند سلطان ‏ ‏جائر ‏ ‏أو أمير ‏ ‏جائر<br />الخلاصة:<br />الطاعة لا تعني الخنوع و النفاق<br />و رد الحاكم الظالم لا يعني قتاله"
archived = "2010-03-14"
capture_url = ""

