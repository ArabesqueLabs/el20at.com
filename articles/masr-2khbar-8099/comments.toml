[[comments]]
order = 9
subject = "الاخوة بتوع الاحاديث - قرفتونا"
author = "مش لازم"
posted = "2008-01-26"
text = "لما يبقى الحكم بكتاب اللة نبقى نسمع للاحاديث اللى انتم كاتبينها وعلى عينى وعلى راس ابويا من فوق<br />لما القرأن يبقى دستورنا نبقى نقول سمعا وطاعة للاحاديث<br />لكن يا نفر جاهل انت وهو نحن نحكم بالدستور والقوانين الفرنسية التى لا تتعارض مع الدين<br />فيبقى كل كلامنا عن الاحاديث باطل<br />الكل بينتقد حسب الدستور<br />والدستور بيقول ان الامير موظف فى وظيفة عامة فى الدولة وممكن شيلة وحطة ومحاكمتة وخلعة بالطرق الشرعية او الدستورية<br />فبرجاء عدم اقحام احاديث فى مكان غير مكانها او مجالها"
archived = "2010-03-14"
