text = "السلام عليكم قامت وزارة الشباب مشكورة برعاية هذا البرلمان ولاكن لحد هذة اللحضة لم يرى النور ولا يستطيع الاعضاء العمل بسبب عدم وجود برنامج مخصص لعمل الاعضاء من قبل الوزارة هذا من جانب ومن جانب اخر عدد كبير من الشباب يقوم بسوالنا اليس انتم الاعضاء الذين تمثلون المحافضة فاين هو عماكم اي مايعني انهم لم يقومو بانتخابنا مرة اخرى والسلام"
