text = "انا استغرب للاخ يقول عضو برلمان شباب البصرة يا اخي البرلمان ليس حكومي وبرلمان الوزارة غير دستوري اي لايجوز ظمن الدستور العراقي اي وزارة ان تأسس برلمان اومنظمة مجتمع مدني وما جرى مع وزارة الشباب عمل خطأ وسوف يلغى لانه يتعارض مع الدستور علينا ان نفهم هذا والبرلمان يأسس من قبل اما مجلس النواب ويخول لمنظمة اوشباب بأدارته اومن قبل المجتمع المدني وليس وزارة مثل الهيئات والنقابات وتخصص لها ميزانية وتعتبر من مفاصل الدولة وليس الحكومة وبرلمان الشباب غير الحكومي خطوة في الاتجاه الصحيح"
