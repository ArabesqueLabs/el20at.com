text = "أخ عراقي للأبد<br />من كان اسمك بالقائمة الأساسية كان البرلمان زين ،،،، بس من شالوا اسمك كمت تحجي عليه هههههههههههههههههههه<br />عراقيين ميصير النا حل<br />البرلمان للأسف صار بيه تدخل من الأحازاب ببعض المحافظات ، مثل محافظة النجف ، وبعضها لم تتدخل بيه الأحزاب نهائيا مثل محافظة ذي قار<br />ان شاء الله ينطلق البرلمان ويعمل رغم كل المغالطات الي جاي تصير حوله ،، وزارة الشباب رعت انطلاق البرلمان ولم تقم بعمله هي خلي اصحح المعلومة<br />وتحية للأخ محمد قاسم ولكل طلاب الجامعة المستنصرية<br />ولا صار لابن عمك وابن خالك ،، اقرا على روحك انت الفاتحة ،، اتحرك من مكانك او سوي الأخ اللي كال اقروا عليه الفاتحة<br />شكرا الكم"
