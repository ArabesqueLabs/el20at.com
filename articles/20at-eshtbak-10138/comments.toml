posted = "2009-10-03"
text = "السلام عليكم<br />اني احد اعضاء برلمان شباب محافظة البصرة وعمري 29 سنة وتخرجت من كلية التربية جامعة البصرة لسنة 2005 وحتى الان بدون توظيف وبرايي ان اهم نقطة او اهم هف يجب ان يكون للبرلمان هو القضاء على البطالة المتفشية بين الشباب الخريج وغير الخريج باعتبار الشباب اهم فئة في المجتمع ويجب الاعتماد عليهم في المستقبل ونلاحظ ان الواقع مرير في العراق وخاصة بالنسبة الى الشباب فيجب احتواء هذه الفئة بشتى الطرق وبكل الوسائل المتاحة لذا برايي ان البرلمان هو خطوة من خطوات الديمقراطية واهمها ويجب على الحكومة الاهتمام بهذا البرلمان واعطائة الاهمية القصوى لا لاني عضوفيه بل لانه امل ومستقبل العراق وخاصة وان جميع الاعضاء في البرلمان قد اختيروا بطريقة مناسبة وجيدة والجميع شباب مناضل وكفوء ومن الذي يعتمد عليه بكل شيء فيجب وأقول يجب لانه واجب على الحكومة الاهتمام بالبرلمان اهتمام كبير واتاحة كافة الوسائل الخدمية لاعضائة بحيث نستطيع بذلك ان نخدم العراق من منطلق وطني بعيد عن كل السلبيات من طائفية وعنصرية وحزبية ...الخ<br />ولكم مني ومن شباب البصرة خالص الامنيات"
archived = "2010-03-14"
