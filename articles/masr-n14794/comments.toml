[[comments]]
order = 0
subject = "الى عشرينات وعموم المدونين"
text = "كويس خالص<br />وجهنا نداء الى كل الاخوة المدونين اننا عايزين صور اسلام نبيه وهو في السجن ولم يستجيب احد لطلبنا<br />هي دي بقا الخبطة الصحفية<br />صور اسلام نبيه في السجن"
archived = "2008-03-27"
capture_url = "https://web.archive.org/web/20080327214723/http://masr.20at.com:80/newArticle.php?sid=14794"

[[comments]]
order = 1
subject = "ما هي الاسباب التي دفعت الى ذلك"
author = "مش رايح"
text = "شيء غريب جدا الذي حدث<br />ما هي الاسباب التي تجعل ضابط شرطة محترم يأتي بسائق من الموقف ويأمر بوضع عصا غليظة في مؤخرته<br />والاغرب من ذلك هو تنفيذ الأمر<br />كيف امين الشرطة وافراد الشرطة قاموا بتنفيذ هذا الأمر بخلع بنطال الرجل ووضع العصا في مؤخرته<br />الأمر غريب وتنفيذ الأمر اغرب منه<br />يعني ضابط الشرطة يأمر باي شيء ويطاع على الفور ولا يستطيع احد ان يناقشه<br />الأمر الذي يحتم على الشعب المصري كله اعادة النظر في وزارة الداخلية كلها ومعها كلية الشرطة<br />في رأيي لا بد من حل وزارة الداخلية وتسريح موظفيها واعادة بناء وزارة جديدة على اسس ومفاهيم جديدة الا وهي ان وزارة الداخلية وزارة تؤدي خدمات للشعب كوزارة التربية والتعليم او وزارة الاوقاف او وزارة الماء والكهرباء<br />وعلى هذا الاساس يجب تدريب طلبة كلية الشرطة وتأهيلهم نفسيا ومعنويا واخلاقيا على خدمة الشعب"
archived = "2008-03-27"
capture_url = "https://web.archive.org/web/20080327214723/http://masr.20at.com:80/newArticle.php?sid=14794"

[[comments]]
order = 2
subject = "اننى اتحدى"
author = "محترم"
text = "اتحدى ان يأتى احد من البشر ايا كان بصورة لهذا الولد وهو بملابس السجن او حتى داخل السجن<br />الولد الفافيفى قاعد فى فيلا ابوة سيادة اللواء السابق بالداخلية<br />الحكم كان مجرد زر للعيون علشان مص الغضب خارج الدولة وفى منظمات حقوق الانسان وفى داخل البلد<br />التعليمات الصادرة من حبيب لضباط الداخلية طلعوا دين ام الشعب المصرى ولبسوا اجدع واحد فيهم طرحة زى النسوان<br />اكسروا نفسية هذا الشعب وعلموة الذل واغرسوا القهر فى شبابة<br />هذا الضابط كان ينفذ تعليمات رؤسائة الكبار<br />ولما ياخد حكم هم يعرفون ازاى يحلوا المشكلة - ينقلوة الموانى شرطة المرافق<br />اى حل عندهم"
archived = "2008-03-27"
capture_url = "https://web.archive.org/web/20080327214723/http://masr.20at.com:80/newArticle.php?sid=14794"

[[comments]]
order = 3
subject = "سلملى على جوزك يا اسماعيل بية"
author = "عطوة أبو مطوة"
text = "ان بقول سلملى على جوزك سمعة وانتو عالم ولاد مش عارف اية يالا المهم اى حاجة فى اى حاجة وهى ماشية"
archived = "2008-03-27"
capture_url = "https://web.archive.org/web/20080327214723/http://masr.20at.com:80/newArticle.php?sid=14794"

[[comments]]
order = 4
subject = "اين يوجد اسلام نبيه وهل نفذ الحكم ام لا"
text = "يا جماعة الصحافيين والمدونين<br />اسلام نبيه نفذ الحكم ولا لأ"
archived = "2008-03-27"
