[[comments]]
order = 0
subject = "ثقافة المكدونالد نكران للجميل"
author = "mourad ouazzani chahdi"
posted = "2008-10-21"
text = "يردد المغاربة مثلا شعبيا شائعا \\\"شعب المرقة عمرو ما يْرقى\\\" والحال أنها ظلت لسنوات تهمش دور اللحم اللي دار الكرون و الخضرة اللي دارت السنان وحافظت على عناوين الوحدة الوطنية و اللُحمة المغربية في الوقت الذي تحاول فيه محلات المكدونالد النزوع بنا نزوع الفر دانية و الأنانية و تنطوي على قيم التمركز حول الذات و الأثرة في الوقت الذي تمتح المرقة و أخوها الكسكس من معين مبدأ التراحم، وخير الطعام عند الله ما اجتمعت عليه الأيدي كما جاء في الحديث النبوي الشريف.ولحظة اجتماع الأسرة على صحن واحد في جو ملؤه الدفء و الحميمية و فرصة لتبادل الرأي و المشورة فيما يستجد من أمور الحياة بما يقوي وشائج المحبة والقربى بينهم و لا ننسى ما يعمهم من بركة وللبركة أبعاد تطال العمر والصحة و المال أيضا فكما تجتمع الأيادي على الصحون تجتمع القلوب على الألفة في مقابل ما ترسخه الأكلات الجاهزة من وحشة و وحدة شعورية. فدمت يا مرقة للمغرب و المغاربة و عذرا لنكران الجميل."
archived = "2010-03-14"
