text = "اعتقد ان الفول المدمس المصري والكسكس المغربي وكل الاطباق المحلية العربية قادرة على الوقوف سدا منيعا ضد منطق الاكلة الخفيفة والوجبة الخفيفة وما تنطوي عليه من قيم سالبة تهلك الحرث والنسل لا اقلها من ان ينزوي الانسان عن الجماعة التي فيها نشا وشب ومعها يقتسم التاريخ والجغرافية"
