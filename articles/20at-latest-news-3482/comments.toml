subject = "هو فى اطفال فى فلسطين"
author = "مصرية"
posted = "2007-03-25"
text = "ايه دة رسوم متحركة مرة واحدة ومين بقى ان شاء الله اللى هيتفرج على الرسوم المتحركة هو فى اطفال فى فلسطين ماهى اسرائيل قاعدة تقتل فى الاطفال مين بقى اللى هيتفرج على الكرتون يمكن الكبار هما اللى هيتفرجوا على الكرتون دة حتى يتفرجوا من هنا تقوم اسرائيل ضاربة بيوتهم من هنا وهما بقى يموتوا بعد الكرتون يلا علشان اسرائيل متكونش حرمتهم من حاجة يعنى يكونوا ضحكوا بعد كدة يقوموا مقابيلن وجه كريم"
