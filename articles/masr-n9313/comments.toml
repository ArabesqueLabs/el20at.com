subject = "بقى هى قالت جمال!!"
author = "ديمة"
posted = "2007-01-04"
text = "يعنى هو انا المفروض كل مرة اقولك ، عموما مش هاقولك، لكن بالنسبة للموضوع عجبانى فلسفتك اوى لكن كأبتنى ده فى الآخر تفسير سيادتك البنيأدمينى للخروف لكن هو حاسس بإيه لو بايده هيعمل فينا ايه .. الله اعلم."
archived = "2007-01-10"
