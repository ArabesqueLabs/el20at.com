text = "حبيبى عبداللة من الاشياء الجميلة ان اقرأ لك من حظى السعيد اننى تقابلت معاك اليوم فى فرح احد الاقرباء بعد غياب طويل لم اشاهدك لك كل محبتى وكما توقعت لك سايقا انت مشروع صحفى كبير الى الامام"
