[[comments]]
order = 10
subject = "الى الكمخة الأبله تبع الخبر (فوكس طز)"
author = "EPS"
text = "الرد عليك يا عبد القرود هو انك تشوف قناة الاصلاح لتعرف انك انت و آل سلول من 60 سنة أكبر شوكة في خصر المسلمين و أكبر حلفاء لليهود (بشهادة صحف اسرائيل التي يمكن قؤاءتها مترجمة على الانترنت) ، حيث أنكم بعتم فلسطين و تآمرتم على الأمة و قام عبد الانجليز (ربك) بتوقيع و ثيقة خيانية تاريخية موجودة في مئات مواقع الانترنت تقول (انا السلطان عبد العزيز بن عبد الرحمن الفيصل آل سعود اقر واعترف ألف مرة للسير برسي كوكس مندوب بريطانيا العظمى ، لا مانع عندي من اعطاء فلسطين لليهود المساكين أو غيرهم كما ترى بريطانيا التي لا اخرج عن رأيها حتّى تصيح الساعة) مع ختم الجودة... ما قولك ؟ هذه من الوثائق التي افرجت عنها بريطانيا بعد مرور 60 سنة عليها فلم تعد تنطبق عليها السرية التامة. زور :<br />http://fasadalsaud.tripod.com/id13.html<br />و بالمناسبة سترون وثائق تثبت فساد و ارتشاء شيوخ السلطان مثل ابن سدلان و غيره ....<br />أنا لست مصرياً بالمناسبة ، و لو كنت مصرياً لصرحت بذلك و لم أخجل و مصر بلد يرفع الرأس خصوصاً إذا ما قورن ببلدك .<br />ثم خسئت ياضرطة أن يكون ابن سعود له أي فضل علي أو على بلدي . من الممكن أن يكون أن يكون له فضل عليك (ابوك الشرعي اذا فهمت) و لكن نعمة الله التي استودعها في أرض الحرمين لم تكن لابن سعود يوماً من الأيام إلا بأحد سببين:<br />1- إما أنك أبله و مغفل و أقنعك ابن سعود و شيوخ البلاستك و المطاط أن النفط خلقه ابن سعود و بالتالي من حقه استخراجه و بيعه و صرفه على نفسه و أولاد عمه في كريات شمونة<br />2- أو أنك عميل تافه (بلهجتك دبوس كمخة) ترتزق من النباح للذود عن الخونة الذين ضيعوا تريليونات الدولارات و أسهموا في بناء بلاد من يعادينا.<br />و في كلتا الحالتين أمثالك يجب ألا يسمعونا طقاعهم ... يلا انقلع يا كعلة ..."
archived = "2010-03-14"
