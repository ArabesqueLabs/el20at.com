[[comments]]
order = 9
subject = "خير الكلام ماقل ودل   ولا تكذب ياEPS"
author = "فوكس السعودية-الخبر"
text = "اولا ايها المصري الحقير لا تذكر العلامة ابن عثيمين على لسانك كي لا تنجسه ايها النجس ثم قبل انتقاد علماء شهد لهم العالم الاسلامي انتقد علماء من ديارك احلو المعازف واحلوا الاختلاط وغيرها من الامور المحرمة شرعا ولا يجادل فيها الاسفيه مثلك ثم ال سعود تاج على رأسك وراس من يسبهم لان لهم الفصل بعد الله في مأكلك ومشربك وملبسك ومسكنك فلا تسب اسيادك ووفر سبك للمجرمين امثال بوش وشارون والمجرمين امثالك واخيرا لاتكثر البربرة اختصر كلامك ياثرثار واذا اردت ان تنتقد الحكام فاول من تنتقد الحكومة المصرية العميلة الكبرى اعرف عيوب حكومتك ياتافه ثم تحدث عن حكومات الاخرين"
archived = "2010-03-14"
