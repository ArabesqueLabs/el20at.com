order = 2
subject = "في مزبلة التاريخ"
author = "اشماسي"
text = "نعزي قناة الجزيرة، وكان وأخواتها،،، ونعزي طوابير راضعي ومصاصي كابونات النفط،،، على المصير الأسود لزعيمهم وملهمهم صدام حسين «أبو الحروب - وأبو الهروب - وأبن الحفرة».<br />لقد شاءت الأقدار أن عانقته المشنقة الشقراء عناقاً حاراً وحميماً وهي تكفكف دموعه بمنتهى الرقة، إذ أنه لقاء تاريخي بينهما لكونها صديقة له طيلة «محرقته» أقصد طيلة عهد حكمه لثلث قرن زاهر بالمقابر الجماعية والمشانق،، وكانت تستقبل الرقاب البريئة بالآلاف سنوياً.<br />وكانت هذه المشنقة في عهده «الميمون» مطيعة أطاعة عمياء، أطاعة عسكرية،، ليس اقتناعاً وإنما قسراً، ولكن هذه المرة ذهب إليها مترنحاً ومتشحاً حلة قشيبة تسر الناظرين، فعانقت رقبته بحرارة وحنان لافت،،،<br />يعجز القلم عن وصفه وتعجز ريشة أكبر فنان رسم تصويره بدقه درامية، نظراً لشدة المفاجئة لها، وشدة السرور والابتهاج بلقاء صديقها المزدوج. حيث اطعم صديقته الشقراء بالحرام، طيلة ثلاثين عاماً. وكانت تتغنج وترقص لكل رأس يقدمه لها في كل دقيقة وساعة تملقاً وتصنعاً كي لا يؤذيها..!! ونهنئ الملايين من العراقيين من ذوي ضحايا محرقة صدام وأقاربهم من جميع شرائح وأطياف شعب العراق.<br />وكم أتمنى من العقلاء المتعاطفين مع الطاغية صدام أن يحترموا ويراعوا جراحات الشعب العراقي ومآسيه. حيث فتك بشعبة فتكاً لا مثيل له في التاريخ من سنة وشيعة وأكراد كما وفتك بالمئات من حزب البعث الذين عارضو طغيانه وحروبه.<br />أتمنى أن يراجعوا ضمائرهم الإنسانية الحية، وأن يدعوا للتآخي من أجل أمن وإسعاد كل إنسان في الوطن العربي."
archived = "2010-03-14"
