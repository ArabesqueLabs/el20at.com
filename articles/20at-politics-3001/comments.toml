[[comments]]
order = 3
subject = "الى جنة الخلد يا  زعيم العرب  والمسلمين"
author = "عميد  الراي العربي"
text = "بسم الله الرحم الرحيمان لله في ارضه جنودا ولشيطان كذالك جنودا ولانك يا كاتب المقال من جنود ابليس او من مشايخ جنود ابليس وهم الشطينان مقتده والحكيم الذين هم ليسو عار على العراق فحسب بل على امه محمد جميها وعلى الانسانيه هولا الخونه الذين وطئو ارض الرافدين على دبابه امريكيه بماركه ابوكم الروحي بوش وذنبه بلير وشيخكم شارون انكم تريون ان تعلمونا بجرايم صادم المجيد صدام اطهر من على الارض وشرف لكل عربي ومسلم المجيد لم يساوم في اخر لحظات حياته اما انتم يامن ظمائركم تباع وتشترى بدولا او دولارين وتبيعون اعراضم وربما تهدوها الامريكان مجانا تريدو ان تعلمونا الاخلاق وامثل اما ابو الابطال وسيدكم وقائد الامه جميعا البطل الشيد فانه ناصر العرب جميعا من فلسطين وحتى الاطلسي ويعطي 25 الف دولار لكل اسره شهيد فلسطيني ومنع من سقوط مورينانيا بيد السنقال ومدينه جبا السودانيه من السقوط بيد جنرج وناصر الوحده اليمنيه بكل قوه وجعل من العراق دوله كبرى في التصنيع وشعج العلماء وقضاء على الاميه في بلاد الرافدين وحارب احبئكم الصفويين في ايران ومنع المد الصفوي في العراق والشام والجزيره وضرب حبيب قلبك شارون في تل ابيب وحيفا ولكن كلمه اريد ان اقولها للتاريخ انكم يا احباب مقتدى وعبد العزيز الحكيم خنجر مسموم في خاصرة الامه وعار عليها رحم الله سيد الشهدء في عصرنا هذ صدام حسين المجيد والى جنه الخلد والعنة الله الصفويين"
