subject = "كلام جرائد"
author = "علي"
posted = "2007-02-21"
text = "والله لا نعلم مصدر الكلام ومن اين جاء التكريم واظن ان هيئة علماء المسلمين تعمل على وضع القلاقل وتفتعل الاحداث فقط لتغطية فضائحها بدعم الارهابين والقتلة بالعراق تحت مسمى المقاومة فمقابل جندي امريكي يقتل السفاحون 20 عراقي من طفل ورجل وامراة وعجزة بلا رحمة بمجرد اختلاف بالمذهب او العقيدة. نحن العرب عاطفيون ونحن ظاهرة صوتية لا نعي ما نقرأ ويستجلبنا الخبر الرنان بلا تعقل وروية وفهم."
