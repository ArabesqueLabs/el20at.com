order = 0
subject = "اسراء رمز لشرف بنات مصر وبنت من بنات ارض مصر الطيبة وهى فتاة مصر الاولى"
author = "مواطن"
text = "اسراء ليست بنت تمرجية بريطانية مترزقة ولكنها بنت الارض المصرية - تمثل النقاء والشرف المصرى<br />هى بنت كل بيوت مصر<br />هى اخت كل شاب<br />ولكن المجرمين عملاء اسرائيل وامريكا قبضوا على البراءة والشرف<br />اسراء اوجعت قلوبنا جميعا<br />تحية لك يا اسراء<br />وللظلمة المجرمون الذين يسجنون فتيات وبنات مصر ايام سوداء قادمة<br />افزعوك وروعوك يا بنت الناس الطيبين<br />للظالم يوم اسود قريب"
archived = "2008-04-26"
capture_url = "https://web.archive.org/web/20080426023930/http://masr.20at.com:80/newArticle.php?sid=15437"
