subject = "فمن عفى وأصلح فأجره على الله"
author = "ابو سالم"
posted = "2008-07-14"
text = "أذهبوا فأنتم الطلقاء..<br />نحن كالجسد الواحد..<br />كالبنيان المرصوص..<br />الخير كل الخير ان تعفو عند المقدرة ..<br />المحبة في الله الأخوة في الدين سبب بأن تكون بظل الله يوم لاظل إلا ظله..<br />اترضى ان يسجن أخيك وأن يجلد بسبب ماذا خلاف دنيوي . لا حول ولا قوة إلا بالله العظيم..<br />وإن تعفو هو اقرب للتقوى..<br />كم تضرر من ذلك من أم ،أب، أخ ، زوجة، أبناء فلذة أكباد، محب لصوت ندي ، مريض يحتاج إلى رقية،محب وصديق وأخ في الله..<br />ماذا استفدت من ذلك ؟؟؟؟؟؟؟؟؟؟؟؟؟<br />من أرضيت في ذلك؟؟؟؟؟؟؟؟؟؟؟<br />أن أردت إلا الإصلاح ماستطعت وما توفيقي إلا بالله...."
archived = "2010-03-14"
