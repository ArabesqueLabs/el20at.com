subject = "ببساطة"
author = "alexomania"
posted = "2007-05-22"
text = "أوروبا لا تملك وحدة الدين ولا الثقافة ولا الأصل ولا اللغة ومع ذلك حققت الوحدة الكاملة و بقت قوة ضاربة و ناجحة ليس لها مثيل في العالم إقتصاديا و سياسيا و عسكريا و إجتماعيا !!!!!!!!!!<br />العرب يملكون وحدة الأصل و اللغة و الدين و الثقافة و مع ذلك متحققتش وحدة ولا حتتحقق لأننا ببساطة (عنصريون) أيوة العرب عنصريون شوف العرب حاربو بعض قد أيه (أكتر ما حاربو إسرائيل) شوف إنهاردة الوضع عامل بينا و بعض: لبنان و سوريا و الإتهامات المتبادلة ..مصر و السعودية \"و دور الزعامة\" سلامات يا زعامة .ليبيا و السعودية خلافات أبدية .و غيره<br />ده اللي ظاهر بص بقي علي حال الشعوب العربية ذات نفسها : شاهد أي مباراة بين دولتين عربيتين و عاللي بيحصل أ, أدخل أي منتدي فيه سيرة منافسة بين دولتين عربيتين في أي مجال : المسلسلات . السينما . الزعامة . الكورة . الدين ...........<br />بلاش تتفرج علي الموضوع خليك بس مركز مع التعليقات اللي تحت الموضوع و الحقد اللي بيطلع و القرف من أول الكلام عن مين اللي علم مين الأكل بالملعقة لحد مين اللي عايش عالة علي مين و من فاضلة خير مين .<br />و يا سلام علي الشعارات الوحدوية البراقة اللي مش بتتقال غير في المناسبات اللي ملهاش لازمة (زي القمة العرية كدة)<br />أنا شايف إن كل دولة تنسي بقي الفكرة السخيفة دي و نشوف بقي أي حاجة تنفعنا أو تفيد مصلحتنا علي الأقل علشان ولادنا بعد كده ميتعقدوش زينا إتولدنا و إتعلمنا و عيشنا و مش بعيد حنموت من غير ما نشوف أي مظهر من مظاهر الوحدة العربية المزعومة"
archived = "2010-03-14"
