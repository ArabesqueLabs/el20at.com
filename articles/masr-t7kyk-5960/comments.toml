subject = "مصر التى فى خاطرى"
author = "نيفين نيفى نوفا"
posted = "2007-05-21"
text = "من زمان و مصر واخده على عاتقها مشروع القوميه العربيه اللى كل معلوماتنا عنه انه ماده درسناها ف الثانويه العامه مكناش بنهتم نحضر حصصها و بنذاكرها ليله الامتحان و اللى بيدرسها بيكون ربنا داعى عليه لاتها كانت بتبقى حصه على غرار حصص بعد 14 سنه خدمه ف ثانوى بتقوللى اقف<br />و مع ان كتير بيجد ان ولاده القوميه العربيه كانت ف الحقبه الناصريه المباركه و ان وفاتها كانت على يد السادات بعد ذهابه لاسرائيل و ما تلاه من معاهدات سلام ..tn رايى ان اكبر طعنه اتوجههت للقوميه كان يوم العدوان العراقى على الكويت<br />دى ممكن تكون نبذات عن القوميه العربيه ف تاريخنا الحديث لكن لو فكرنا نبقى نعاصريين اكتر اتحدى حد يقوللى نبذه عن القوميه العربيه انهارده<br />بلاش انهارده ..من سنه ..او ينتين ..او تلاته<br />متهيالى ممكن نقول اللى قاله شاعر عربى لا اتذكر اسمه من حوالى 3 او 4 سنين لما قال:<br />نزار ازف اليك الخبر<br />لقد اعلنوها وفاه العرب"
archived = "2010-03-14"
