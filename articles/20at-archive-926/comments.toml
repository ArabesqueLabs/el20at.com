subject = "علي جمعة عار على المسلمين"
author = "نور"
posted = "2007-06-07"
text = "علي جمعة المفتي الغير مفتي ، جاء بالكثير من الفتاوي ، الغير طبيعية والتي قد يتأثر بها عامة الناس ونسى او قد تناسى المسؤولية الكبيرة الملقاة على عاتقه والحساب الشديد الذي ينتظره من الله تعالى<br />ألم يعلم ان مثل هذا الكلام الغير مسؤول قد يثير الفتن والتفسيرات المعكوسة لكثير من الناس<br />يجب ان يراجع حساباته والافضل ان يبتعد نهائيا عن الافتاء ، وبذلك قد يكفر عن ما اقترفت يداه<br />قلة ذوق وقلة ادب وحياء يجب ان يوقف حدهاا"
