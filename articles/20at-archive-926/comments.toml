[[comments]]
order = 11
subject = "ما ذنب د. علي جمعة في فساد أحد موظفيه . اتقوا الله"
author = "أسامة سباعي ( طالب بكلية دار ا"
posted = "2008-03-06"
text = "بسم الله الرحمن الرحيم<br />اللهم صل على سيدنا محمد الفاتح لما أغلق، والخاتم لما سبق ، ناصر الحق بالحق ، والهادي إلى صراطك المستقيم وعلى آله حق قدره ومقداره العظيم.<br />أولاً : إلى كل جاهل أخطأ في حق سماحة المفتي د. علي جمعة ، إلى كل من خاض في هذا الإمام بجهل ، أقول له اتق الله واحذر فأنت الان مما قال الله فيهم في الحديث القدسي: من عاد لي ولياً فقد آذنته بالحرب...<br />وثانياً : أقول ليس لسماحة المفتي أي ذنب في فساد أحد موظفيه ، حتى وإن كان مدير مكتبة ويشهد الله أني لا أطيق هذا الرجل مدير مكتب المفتى المدعو/ أشرف. .... ولكن هذا شيء وسماحة المفتي شيء آخر ......<br />باختصار : د. على جمعة هذا لن يأتي مثله مرة أخرى فاستغلوا هذه الفرصة.....<br />اقرأوا كتبه واسمعوا دروسه قبل أن تحكموا عليه ، وتستطيعون الحصول على كتبه من مكتبة دار السلام بشارع الأزهر ومن دار الرسالة بمدينة نصر ومن الهيئة العامة المصرية للكتاب."
archived = "2010-03-14"
capture_url = ""

