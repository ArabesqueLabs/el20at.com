subject = "منه لله وحسبي الله ونعم الوكيل"
author = "فعلا كلام صحيح"
text = "أشرف فهمي المحامي اللي كان بيركب الدراجة البخارية وخلفه البنات ويشرب مخدرات مدير مكتب المفتي يا سلام حاجة كويسة وكوسه في نفس الوقت أشف فهمي اللي بيلعب بالبيضة والحجر طبعا لازم يكون مدير المكتب وزعيم دار الإفتاء المصرية وده شيء أساسي يا سلام يا يت تروحوا دار الإفتاء وتشوفوا الباشا أشرف فهمي واللي بيعمله وتسأله عنه في عين شمس وعجبي منه لله وحسبي الله ونعم الوكيل كم شرد أناس لا حول لهم ولا قوة كم تم رفد ناس من الدار بسببه يا الله كله بسبب المفتي"
archived = "2010-03-14"
capture_url = ""

