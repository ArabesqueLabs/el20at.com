[[comments]]
order = 16
subject = "رفقا بشيخنا الجليل على جمعه"
author = "ابراهيم حسنين سليمان"
text = "مازلت ارى فى الشيخ الجليل على جمعه الانسان المثقف . خبيرا ، متبصرا فى امور الحياة والدين ينير دائما الطريق لك ويهدىء من روعك ويريح صدرك ، اراه يماثل شيخنا الجليل الشعراوى رحمة الله عليه فى علمه وتواضعه .<br />رفقا به ودعوه ينهل من علمه لنا فما احوجنا الى هذا الرجل العالم."
archived = "2010-03-14"
