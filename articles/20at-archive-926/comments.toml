subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
text = "أشرف فهمي مدير مكتب المفتي طبعا خراب يا افتاء أشرف ده بتاع نسوان ورشاوى وواد حلنجي ينفع يشتغل في خمارة مش في دار الإفتاء طيب ولسه هنشوف يا فضيلة المفتي"
