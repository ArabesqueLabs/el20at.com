[[comments]]
order = 2
subject = "نصيحة اخ"
author = "اكتب اسمك هنا"
posted = "2007-05-13"
text = "السلام عليكم و رحمة الله و بركاته : احب ان اضيف شيء هام و هو ان المفتي يفتي باقوال الصوفية و يرد الاحاديث الصحيحة مثل احاديث النهي عن الصلاة بالمساجد التي بها قبور و هناك اجماع بعدم جوازها فضلا عن تتبعه لذلات العلماء و الافتاء بها و الصواب له و لامثاله ان نقول لهم قول ربنا جل و علا :sad: اتَّبِعُواْ مَا أُنزِلَ إِلَيْكُم مِّن رَّبِّكُمْ وَلاَ تَتَّبِعُواْ مِن دُونِهِ أَوْلِيَاء [الأعراف : 3]) و (إِنَّ الَّذِينَ يَكْتُمُونَ مَا أَنزَلْنَا مِنَ الْبَيِّنَاتِ وَالْهُدَى مِن بَعْدِ مَا بَيَّنَّاهُ لِلنَّاسِ فِي الْكِتَابِ أُولَـئِكَ يَلعَنُهُمُ اللّهُ وَيَلْعَنُهُمُ اللَّاعِنُونَ [البقرة : 159]) فيا فضيلة المفتي لا تخشي في الله لومة لائم فكل من افتيتهم بمذهبك سيتعلقون بك يوم القيامة و لن يغنوا عنك من الله شيئا و لا تبيع دينك بدنياك قال تعالي : (فَلاَ تَخْشَوُاْ النَّاسَ وَاخْشَوْنِ وَلاَ تَشْتَرُواْ بِآيَاتِي ثَمَناً قَلِيلاً وَمَن لَّمْ يَحْكُم بِمَا أَنزَلَ اللّهُ فَأُوْلَـئِكَ هُمُ الْكَافِرُونَ [المائدة : 44]) يا فضيلة الشيخ ان كنت تعلم الحق و تتلاعب بالادلة لتنصر مذهبك فانت محرف للكلم عن مواضعه و سلكت طريق اليهود قال تعالي : (َمِنَ الَّذِينَ هِادُواْ سَمَّاعُونَ لِلْكَذِبِ سَمَّاعُونَ لِقَوْمٍ آخَرِينَ لَمْ يَأْتُوكَ يُحَرِّفُونَ الْكَلِمَ مِن بَعْدِ مَوَاضِعِهِ يَقُولُونَ إِنْ أُوتِيتُمْ هَـذَا فَخُذُوهُ وَإِن لَّمْ تُؤْتَوْهُ فَاحْذَرُواْ [المائدة : 41]) فلا تحرف الكلم .. و عليك باتباع نهج الصحابة الاخيار الاطهار فهم افهم الناس لكلام الله و كلام نبيه صلي الله عليه و سلم فعليهم القران نزل و تكلم فيهم رسول الله صلي الله عليه و سلم فالزم غرزهم - الزم غرزهم - لا تفارقهم في فهمهم سواء اكان امر معتقد او امر تشريع فقد قرأت لك رسالة يندي لها جبين الموحدين و هي تصحيح المفاهيم و ما هي الا تخريب للمفاهيم ... اتقي الله و تأدب في دين الله و لا تتقدم بين يدي الله و رسوله قال تعالي : (يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُقَدِّمُوا بَيْنَ يَدَيِ اللَّهِ وَرَسُولِهِ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ [الحجرات : 1]) فوالله لن يغني عنك رئيس او عالم او زوجة او ولد او كرسي او رصيد في البنك او فيلا في سويسرا من الله شيئا (فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُ أَحَدٌ [25]وَلَا يُوثِقُ وَثَاقَهُ أَحَدٌ [الفجر : 26]) و علي الله قصد السبيل (فَسَتَذْكُرُونَ مَا أَقُولُ لَكُمْ وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ [غافر : 44])"
