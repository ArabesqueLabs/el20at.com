subject = "طالب ازهرى"
author = "عامرسلطان"
posted = "2008-01-25"
text = "السلام عليكم احب اعرفكم بنسى انا الطالب عامر سلطان طالب بكلية الدعوه الاسلاميه بالقاهره<br />اما بعد<br />احب اقول لكل الذين يهتكون فى شخصية د.على جمعه رفقا بانفسكم حتى لا تردوا موارد الهلكه وهذه والله العظيم نصيحه لاخوتى فى الله ليس الا فانتم لم تسمعوا الشيخ بقلب صافى نقى وانا لا اذكيه على الله ولكنى اقول كلمة حق فقد قدر الله لنا هذا العام ان ندرس على يد الدكتور على فى الكليه وكنت قبل ان يدرس لنا اعتبره مثل اى عالم اجتهد فى مساله من المسائل فان اصاب فله اجران وان اخطا فله اجر وهذا ليس كلامى بل انه قول الصادق المصدوق صلى الله عليه وسلم<br />ولكن بعدما درسنا على يديه تمنيت ان ياتى كل الذين يتهموه كل هذه الاتهامات ان ياتى ويستمع فانت ايها الجانى لا تعرف عن فقه الاختلاف شئ ولوكان الدين كله بالاتفاق لهلك الناس فان حال الشعوب ليس كمثل بعض والناس خلقهم الله مختلفين وانظروا فى القران لتجدوا ذلك بانفسكم فكان ولابد ان يختلف العلماء فيما بينهم رحمة بالناس ليس الا<br />اخى المسلم اختى المسلمه اتمنى من الله ان لا تخوض مع الخائضين يهتكون فى عرض العلماء فان العلماء كما يقول صلى الله عليه وسلم العلماء ورثة الانبياء وان الانبياء لم يورثوا درهم ولا دينار ولكن ورثوا العلم واذا كنت تريد ان تكلمنى فعنوانى البريدى amer_sulta74@yahoo.com"
