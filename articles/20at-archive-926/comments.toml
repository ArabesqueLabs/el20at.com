text = "الى كل من يتكلم عن الدكتور بهذا الشكل المنحط اقول انكم من نوعين لاثالث الاول هو انكم مجموعة من الجهلاء لاتفقهون شيئا واما انكم مجموعه من الاغبياء المأجورين من انصار التخلف الوهابى الذى بدأت غمته تنزاح حتى عن السعوديه فى هذه الحاله احذر امتنا الاسلاميه منكم داعيا الامه الى التمسك بقول الله (ياايها الذين امنوا اذا جتئكم فاسق بنبأ فتبينوا عسى ان تصيبوا قوما بجهالة ) وفق الله الامام العالم الدكتور على جمعه الى مافيه الخير للامة الاسلاميه"
