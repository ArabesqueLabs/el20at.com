[[comments]]
order = 4
subject = "يا مسلمين اتقوا الله في أعراضكم"
author = "مسلمة غيورة"
posted = "2007-06-19"
text = "السلام على من اتبع الهدى<br />يا مسلمين اتقوا الله في أعراض المسلمين وفي أعراض علماء المسلمين لقول الله تعالى في السورة التي فرضها، سورة النور:<br />\" لولا إذ سمعتموه ظن المؤمنون والمؤمنات بأنفسهم خيرا وقالوا هذا إفك مبين (12)\"<br />وقال \"إذ تلقونه بألسنتكم وتقولون بأفواهكم ما ليس لكم به علم وتحسبونه هينا وهو عند الله عظيم (15) ولولا إذ سمعتموه قلتم ما يكون لنا أن نتكلم بهذا سبحانك هذا بهتان عظيم(16) يعظكم الله أن تعودوا لمثله أبدا إن كنتم مؤمنين\"<br />تذكروا إخوتي، إن كنتم مؤمنين ! ولنحذر إخوتي أن نتحلى بصفات المنافقين الذين قال عنهم الله تعالى في نفس السورة :\" إن الذين يحبون أن تشيع الفاحشة في الذين آمنوا لهم عذاب أليم في الدنيا والآخرة والله يعلم وأنتم لا تعلمون (19)\"<br />مَن من الذين لاكوا عرض الشيخ علي جمعة يجرؤ على الله ويدعي أنه يعرف سريرة الشيخ، ويجرؤ أن يجزم أن الله أطلعه على الغيب وجعله يعرف النوايا الحقيقية خلف فتاوى الشيخ؟ من من الذين اجترؤوا على الله بوسعه أن يجزم أن الشيخ أفتى دون دليل لديه؟<br />لا أزكي على الله أحدا والله وحده أعلم بالسرائر، ولا أقول إلا ما قاله الرسول صلى الله عليه وسلم. الشيخ اجتهد عن علم لديه وأفتى، فإن أصاب فله أجران وإن أخطأ فله أجر الاجتهاد، وأما النوايا وراء الفتاوى فلا نتأله على الله فيها وهو وحده يعلمها لا إله إلا هو.<br />وأتساءل الآن، من أفتى عن جهل بعلوم الدين ببطلان فتاوى الشيخ وشيوخ كثيرين غيره إن أصاب هل سيؤجر على اجتهاده الجاهل؟ وإن أخطأ هل سينجو من عقاب الله؟ وأما من اتهم الرجل وغيره في ذمته، إن كان صادقا في ادعائه وقد أطلقه عن جهل، هل سيؤجر عليه؟ وإن كان الادعء بهتانا فهل سيغفر الله له؟<br />إن أعداء الله مزقوا أوصالنا وأعراضنا وانتهكوا حرماتنا واجترؤوا على أعراض جميع رموز دعوتنا، وللأسف نحن المسلمون ساعدناهم واتبعنا خطواتهم وخضنا كما خاضوا. تتبعنا زلات علمائنا ودعاتنا، وتغاضينا عن جرائم وعهر المغنين وصانعي الأفلام وسميناهم نجوما ! أهنا علماءنا الذين يبنون وعظمنا مطربينا وبائعي المجون والأفلام السافرة والجنسية التي تخرب مجتمعاتنا في الصميم. أذهبنا مهابة علمائنا من صدور المسلمين ورفعنا حثالة المجتمع وأحطناهم بهالة الطهر والعظمة كي تغطي فظائعهم. ولم يعد المسلم يثق برأي سوى رأيه ... وصار إلهه هواه... واستبدل كثير منا الصلاة بالرقص والقرآن بالغناء... والحلال بالحرام، وهو المطلوب !<br />إنما هي ذكرى لي ولكم إخوتي وشهادة أقمتها لله وحده، اللهم فاشهد أني قد بلغت."
archived = "2010-03-14"
