subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-02-07"
text = "لا يا اخي الكريم ...الموضوع بأختصار الرواتب فالسعودي راتبه اكبر من الاجنبي وهنا يكمن التفضيل وليس الخبر او الانتاجيه..فلو بدأو ينظرون لها من وجهة نظر اقتصاديه عليا لوجود ان الاجنبي يقوم بتحول مبالغ ماليه لبلده مما يتسبب بعجز وتضخم مالي واقتصادي للسعوديه لكن نظرتهم ليست سوى نظره قصيره للأسف"
