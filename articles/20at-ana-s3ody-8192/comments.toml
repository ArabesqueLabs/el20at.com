[[comments]]
order = 0
subject = "الإخوه السعوديين"
author = "محمد"
posted = "2008-02-07"
text = "انا كمصرى مابنكرش تطور الإخوه السعوديين و انهم أصبحوا قادرين فعلا على إثبات وجودهم فى مجلالت كتير و لو ان الموضوع ركز قوى على المرأه السعوديه (يمكن عشان الكاتبه أنثى -الله اعلم)<br />بس ما دام الإخوه السعوديين شايفين انهم قادرين على الإستغناء عن الأجانب المقيمين و العاملين عندهم (و أقصد هنا فئة العاملين الحاصلين على مءهلات عليا فى بلادهم)<br />أيه بقى الضرورة انهم من وقت للتانى يطلبوا تخصصات مختلفه من أطباء و مهندسين و مدرسين للعمل عندهم من دول تانيه؟ فى الوقت اللى هم شايفين ان شبابهم أولى بده<br />الجواب من وجهة نظرى و حديصححهالى لو كنت غلطان ان اصحاب العمل من السعوديين بيثقوا فى كفاءة و خبرة الأجنبى عن السعودى و ده إما لأن السعودى تمت تجربته قبل كده و ما أثبتش نفسه فى المطلوب منه أو انهم بيدوروا على خبرات جاهزه يثقو فيها و ماعندهمش إستعداد لتدريب كوادر تبقى عندها خبرة بعد كده"
archived = "2010-03-14"
