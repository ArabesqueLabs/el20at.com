subject = ""
author = "من يقرأ ؟"
posted = "2009-08-27"
text = "فى اسرائيل نسبة الامية صفر فى المية<br />وصدام مجرم العراق كانت النسبة فى الامية اقرب الى الصفر واعلى نسبة حاملى الدكتوراة بالنسبة للشعب<br />وفى غزة والضفة الغربية نسبة الامية قليلة جدا<br />فى الامارات نسبة الامية لا تزيد عن 5 %<br />فى الكويت صفر فى المية<br />اما عند حضارة السبع الاف سنة فنسبة الامية 60 فى المية<br />اعلى نسبة امية فى العالم العربى توجد فى مصر والسودان<br />زمان كان التوزيع لجريدة الاهرام مليون وربع نسخة يوميا الان لا يتعدى 200 الف نسخة<br />هل تقل نسبة الامية فى مصر او تزيد<br />للاسف مع الايام تزيد نسبة الامية فى مصر<br />وبالتالى تقل نسبة من يتعاملون مع الكتاب<br />الجهل ينتشر<br />واذا قرا الانسان كتاب فالاقبال على الكتب الدينية وعذاب القبر"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830033657/http://www.20at.com:80/masr/hewarat/13088-2009-08-27-14-13-23.html"

[[comments]]
order = 1
subject = ""
author = "الكتاب ثم الكتاب"
posted = "2009-08-27"
text = "الناس فى ضائقة مالية يا ست ولاء<br />والطبقة المتوسطة التى كانت تشترى الكتاب تاكلت وتلاشت ونزلت الى مستوى الفقراء<br />والكتاب فى بلدنا بيعتبر سلعة تباع وعلية ضريبة مبيعات 35 فى المية من سعرة<br />ولم يعد هناك وجود للكتاب ابو شلن ولا سلسلة اقرا ام قرشين صاغ لان دعم الكتاب انتهى<br />البلد المحترم الذى يطبع الكتب العالمية والمحلية برخص التراب هو الهند<br />الهند بلد محترم جدا<br />وكنا ونحن فى الخليج نشترى الكتب التخصصية من الهند ونحضرها االى مصر<br />فى بلدنا لا يوجد سوق للكتاب للاسف<br />فى بلدنا الفهلوة والكلام الكتير<br />وكلة بيهمبك على كلة"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830033657/http://www.20at.com:80/masr/hewarat/13088-2009-08-27-14-13-23.html"

[[comments]]
order = 2
subject = ""
author = "قبل صناعة الكتاب"
posted = "2009-08-28"
text = "انا اريد ان اكتب كتاب والناشر جاهز<br />ولكن اين القارىء<br />كل انجازات ابوزيد 11 كتابا من دار النشر<br />11 كتاب ممكن تعملهم دار نشر واحدة فى يوم واحد فى اسرائيل<br />لنفترض اننى اريد ان انشر كتابا عن ما هى الثلاجة المنزلية وكيف تعمل وطرق صيانتها واحسن استخدام لها<br />تفتكرى كم نسخة هتتوزع<br />انما لو عملت كتاب عن السيدة زينب او كتاب عن الشفاعة او كتاب عن عذاب القبر اكيد التوزيع هيبقى كبير<br />طيب ولو عملت كتاب فى الصحة النفسية وانحرافات الشباب - كم واحد هيشترية<br />رائع ولو واحد قعد تحت الشجر يا وهيبة وطلع لنا بكتاب كيف نبنى مصر<br />انا مرة كنت با اتفرج على التليفزيون وكان فية شخصية كبيرة بتتكلم عن الفكر الجديد<br />وكل شوية يرددوا كلمة الفكر الجديد<br />والفكر الجديد<br />رحت دار نشر مشهورة اسال عن كتاب الفكر الجديد علشان افهم اية هو الفكر الجديد<br />طلع الموضوع ان مفيش كتاب ولا فكر وانها جملة بس بتتردد على الالسنة<br />كل سنة وانتى طيبة<br />رمضان كريم"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830033657/http://www.20at.com:80/masr/hewarat/13088-2009-08-27-14-13-23.html"
