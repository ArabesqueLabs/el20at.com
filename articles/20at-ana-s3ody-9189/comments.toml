subject = "www.osamyat.com"
author = "أسامة"
posted = "2008-06-04"
text = "دائما عندما اسمع كلمة المعلم تتبادر الى ذهني الأبيات الشهيرة ...<br />قف للمعلم وفه التبجيلا ************كاد المعلم أن يكون رسولا<br />أرأيت أشرف أو أعز من الذي*********يبني وينشىء عالماً وعقولا<br />وأيضاً تتبادر الى أبيات المعلم الشاعر إبراهيم طوقان الذي جب التعليم<br />شوقي يقول ومادرى بمصيبتي*****قم للمعلم وفه التبجيلا<br />اقعد فديتك هل يكون مبجلاً******من كان للنشء الصغار خليلا<br />لو جرب التعليم شوقي ساعة *****لقضى الحياة شقاوة وخمولاً<br />الى ان يقول<br />وأكاد أبعث سيبويه من البلى ****وذويه من أهل القرون الأولى<br />فأرى حماراً بعد ذلك كله *****رفع المضاف إليه والمفعولا<br />يامن يريد الانتحار وجدته *****إن المعلم لايعيش طويلا<br />في دول مثل أمريكا وبريطانيا أهم مهنة ولا يعمل بها أي أحد هي التعليم وقارن بالعالم العربي.<br />عودا الى موضوعنا مدرسة المشاغبين والمعذرة على الاستطراد فأنا من مدرسة الطنطاوي هه<br />التعليم بالترفيه والحب هو الوسيلة الناجحة والفعالة في هذا المجال... وجهة نظر<br />ودمتم بود"
