subject = "بالتوفيق ومزيد من الكتابات الناجحة"
author = "عبدالرحمن أحمد خرد"
posted = "2008-05-28"
text = "أبعث لك تحياتي أولا.. ومن ثم قرأت المقال في صورة الحوار واقول أنك بدأت تتلمس كثير من قضايا الشباب في المجتمعات وهذا ظاهر من خلال المقالين واتمنى ان تحقق اهدافك وتصبح شعلة نجاح في الاعلام واتمنى أن تضيف رأي في الختام عن الوضع النموذجي لمثل هذه القضايا .. رعاك ربي وجعلك اعلاميا تحقق رسالة الاعلام الصادق"
