[[comments]]
order = 2
subject = "مزيداً من التألق"
author = "غازي كشميم"
posted = "2008-05-28"
text = "عنوان جذاب وموضوع هام وفي رأيي أن مثل هذه المقالات التي تناقش مشكلات شبابية تحتاج إلى مايلي:<br />1.إظهار الأسباب الحقيقية للمشكلة من مثل: \\\"أنعدام الثقة من قبل الطلاب في مخرجات التعليم وبالتالي كل مايبت لها بصلة:مدرس،مدرسة،مواد.... انعدام الطموح والانشغال بتوافه الأمور عند كثير من الطلاب...إلخ.<br />2. أظن أن المقال بحاجة إلى معالجة وتفكير من قبل الكاتب بتحليل المشكلة ووضع حلول لها وإبراز رأيه فيها وليس الاكتفاء باسعراض آراء الأطراف المختلفة وجعلها هي مادة الموضوع الرئيسة.كذلك إبراز آراء بعض الخبراء التربويين.<br />زادك الله تألقاً وارتقاء وبالتوفيق في المواضيع القادمة إن شاء الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "الجمهورية اليمنية ... صنعاء"
author = "محبك : سلطان فتيني حكمي"
posted = "2008-05-29"
text = "السلام عليكم ورحمة الله وبركاته ...<br />عندما قرأت مقالك تذكرت شوقي رحمة الله عليه عندما قال : قم للمعلم وفه التبجيلا<br />فشعرت أن هذا الجيل لم يفهم مايريد اميرالشعراء ان يوصله فقاموا جميعا للمعلم لكنهم اسأوا بعد ذلك التبجيل<br />أخي العزيز والاعلامي الألمعي :<br />اتمنى لك دوام التوفيق والنجاح وفقك الله لكل خير وسر بخطى واثقة \"كل من سار على الدرب وصل\"<br />والسلام ختام"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "الله يوفقك .."
author = "غلا .."
posted = "2008-05-30"
text = "موضوع يلمس واقعنا بشكل كبير وواضح جدا ..<br />فهل تقبل (ين) مثل هذا الفعل ؟ ومن المسؤول هنا عن هذه المهزلة ؟<br />اكيد لا .. تربيه الطالب زي ما يقولوا (الطالب يعكس تربيه اهلو )<br />بس بعض الاحيان يكونوا ولدين اخوان واحد زي الالف والثاني من جد لا يحترم لا كبير ولا صغير<br />هنا انا من راي انو الاصحاب ممكن يكون لهم تاثير ..<br />زي ما يقولوا ( الصاحب ساحب )..<br />وممكن المعلم نفسوا من اول خلهم يتمادوا ولا وضع بينو وبينهم اسلوب يمشوا مع بعض عليه<br />فتلاقي الطلبه متمادين ومستهزئين ..<br />وبس ..<br />هل المدرس يستحق أن يفعل به هكذا .. أم يقع اللوم على أولياء أمور الطالبه<br />الاجابه بشكل عام لا ..<br />بس بعض الاحيان ايوه صراحه لمن البنت تتمادى ع المعلمه وما ترد عليها او تقول الله يسامحك او تبدا تتمادى عليها ..<br />في جميع الحالتين تستاهل اللي يصرلها<br />لمن سكتت وما وقفتها عند حدها والمره التانيه لمن تتمدا وبذات لمن تتمادا وتدخل في سيره الاهل والله امسح البلاط فيها ..<br />بس والله ما اقدر اتكلم في هذاالموضوع بموجز لانه لو حالات كثيره :<br />ممكن تكون البنت غلطان ممكن تكون المعلمه ممكن تكون شخصيه البنت صوتها عالي<br />هنا فهم الابله تحسبها ترفع صوتها عليها او ممكن تكون شخصيه الابله هاديه البنات يفهوا غلط ويبدا يتمادوا وممكن وممكن وممكن ...<br />يعتمد ع اشياء كثير<br />المهم : احب اشكرا ع طرحك المميز ..واختيارك لوموضوع يمس الواقع ..<br />كلمه اخيره : كمـــــــا تدين تــدان .. الدنيــا دوارهـ ..<br />وتمنايتي لكـ بمزيد من التقدم ..<br />اختك : غلا"
archived = "2010-03-14"
capture_url = ""

