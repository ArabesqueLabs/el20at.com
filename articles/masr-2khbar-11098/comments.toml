[[comments]]
order = 2
subject = "ياعيني ع الولد"
author = "حزين"
posted = "2009-01-29"
text = "بنينا من ضحايا أمسنا جسرا ،<br />وقدمنا ضحايا يومنا نذرا ،<br />لنلقى في غد نصرا ،<br />و يـمــمـنا إلى المسرى ،<br />وكدنا نبلغ المسرى ،<br />ولكن قام عبد ا لذات يدعو قائلا: \"صبرا\" ،<br />فألقينا بباب الصبر قتلانا ،<br />وقلنا إنه أدرى ،<br />وبعد الصبر ألفينا العدى قد حطموا ا لجسرا ،<br />فقمنا نطلب ا لثأ را ،<br />ولكن قام عبد ا لذات يدعو قائلا: \" صبرا\" ،<br />فألقينا بباب الصبر آلافا من القتلى ،<br />وآلافا من الجرحى ،<br />وآلافا من الأسرى ،<br />وهد الحمل رحم الصبر حتى لم يطق صبرا ،<br />فأنجب صبرنا صبرا ،<br />وعبد ا لذات لم يرجع لنا من أرضنا شبرا ،<br />ولم يضمن لقتلانا بها قبرا ،<br />ولم يلق ا لعدا في البحر، بل ألقى دمانا وامتطى ا لبحر ا ،<br />فسبحان الذي أسرى بعبد ا لذات من صبرا إلى مصرا ،<br />وما أسرى به للضفة الأخرى"
archived = "2010-03-14"
capture_url = ""
