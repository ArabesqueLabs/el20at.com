subject = "يزوروة لية - انشاللة يموت - مش بيدفعوا دية المصرى"
author = "اكتب اسمك هنا"
posted = "2009-01-28"
text = "يا اما رخصت يا مصرى<br />تانى مرة يا عسكرى ابقى استخبى او اجرى<br />هتحارب لمين<br />يلعن ابوهم كلهم ولاد كلب"
