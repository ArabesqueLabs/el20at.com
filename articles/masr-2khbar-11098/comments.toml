[[comments]]
order = 1
subject = "سوف ازورك غدا لترى مكان الشظية فى ظهرى من حرب اكتو"
posted = "2009-01-28"
text = "ولم يعبرنى احد<br />وبمعاش ضئيل وبعكاز اتنقل بة بعد خدمة الحكومة 30 سنة احاول ان اعيش واشترى ادويتى<br />انت يا ابنى لست لاعب كرة ولا رقاصة ولا رجل اعمال حتى يهتموا بك<br />ولكن اجرك عند اللة والثواب يوم القيامة جزيل<br />احتسب اصابتك عند اللة<br />ولعل اللة يعوضك خيرا"
archived = "2010-03-14"
