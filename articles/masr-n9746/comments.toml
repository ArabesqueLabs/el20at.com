subject = "خربت مالطة"
author = "مصراوي"
posted = "2007-05-04"
text = "يا عم براء كبر دماغك خلاص زي ما بيقولوا خربت مالطة مش تتعب نفسك بالكلام عن البلد احلي تعليق هو اللي قاله اللمبي في فيلم بوحة ان الشعب والناس في خلاط وكل بمزاج اللي ايده علي زر تشغيل الخلاط ولا عزااااااااااااااء للمصريين"
archived = "2007-05-31"
