[[comments]]
order = 1
subject = "الى براء"
author = "المواطن مصرى"
posted = "2007-04-27"
text = "ياعم براء واللة العظيم انتا لو وقفت على عربية كشرى حيبقى احسن لينا وليك عارف لية<br />لانك رخم قوى ومواضيعك فيها كتير جدا من المبالغة انا حضرت حفلة شاكيرا ومبينتش حاجة من جسمها زى مانتا بتقول ياكذاب<br />يمكن تكون بتحلم واكيد انتا بتضحك على اللى مراحشى طيب اى فقرة فى الدستور اتعدلت علشان شاكيرا تيجى على طول مصر<br />ياكذاب<br />نفس اسلوبك على طول اى حاجة فى البلد تحصل تربطها بالفقراء وياعينى تبين لينا افرق بين الفقراء والاغنياء<br />ياخى ارحم نفسك شوية<br />واخيرا انتا بتقول ياانسة شاكيرا<br />اة ياكذاب"
archived = "2007-04-30"
capture_url = "https://web.archive.org/web/20070430014115/http://masr.20at.com:80/newArticle.php?sid=9746"

