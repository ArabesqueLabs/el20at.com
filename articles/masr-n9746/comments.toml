text = "مش عارفه ليه يا براء كل ما اقرئلك موضوع احس بالاكتئاب مع ان انت بجد فنان وكل موضيعك جامده يمكن بكتئب عشان الحقيقه مره وواقعنا اليم<br />اين انت يا عمر (عمر بن الخطاب)"
