subject = "الحجاب الحجاب يأمة محمد صلى الله عليه وسلم"
author = "الذئب الأمعط"
posted = "2008-09-02"
text = "في كثرة الفتن يزيد الناس تفسخاً وإلقاء الشبه حول أوامر الرسول الكريم صلى الله عليه وسلم الحجاب واجب على كل مسلمة لكن هناك من يتهكم هذا ونقول له رب كلمة لا تلقي لها بال تهوي بك في نار جهنم ابعد مابين المشرق والمغرب او كما قال الصادق المصدوق عبد الله ورسوله صلى الله عليه وسلم."
