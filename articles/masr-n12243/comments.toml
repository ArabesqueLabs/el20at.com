subject = "يا راجل - ارضى بالواقع"
author = "سعد كفتة"
posted = "2007-11-04"
text = "بقى فى زمتك فية انجاز<br />احنا فين فى الرياضة واحنا عندنا كساح عقلى وبدنى مين فى الشارع اللى انت فية بيلعب رياضة<br />هو علشان فية شوية ناس بتروح الاستاد تزعق هناك وتصرخ وتقول اهلى او زمالك يبقوا بيلعبوا رياضة<br />الشعب المصرى اللى عددة 70 مليون يمكن فية كام الف بيلعبوا رياضة والباقى بيعتبرها مضيعة وقت وقلة قيمة والبعض بيعتبرها مسخرة يجب تجنبها<br />عن اى انجاز تتكلم<br />دا احنا موزمبيق بتغلبنا"
