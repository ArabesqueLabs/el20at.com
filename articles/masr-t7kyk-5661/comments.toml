posted = "2007-05-01"
text = "انا فهمتك يا امورة انت اللى غايظك فى الموضوع ده مش نجيب ساويرس ولا احمد عز الموضوع له علاقة بدين كل واحد فيهم يعنى هو بيقول ان ساويرس المسيحى يتحول للاسلام ويتبرع بفلوسه لدار ايتام انت عايزاها ان أحمد عز يتحول للمسيحية ويصرف كل فلوسه على على جميعه الشباب القبطى على فكرة دا ضيق افق وطائفية على اسقاط تافه ومش مهم. انا بكره الاتنين سواء كان ساويرس ولا عز ولا ابو العنين لان كلهم بيسرقوا بس بشياكه بينضفوا جيب الزبون بمزاجه سواء فى موبينيل ولا عز للحديد .<br />مفيش حد فينا بيحقد عليهم انت بنتضايق من التوزيع الغير عادل للثروة فى مصر والاساليب غير المشروعة للكسب اللى تخلى شوية كلاب يركبونا بفلوسهم فخمتى ولا اعيد"
