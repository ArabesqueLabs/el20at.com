[[comments]]
order = 4
subject = "اللى البنى ادام اللى كاتب تعليقى فوقى"
author = "اكتب اسمك هنا"
posted = "2007-04-30"
text = "اشمعنى نجيب ساويرس يعنى<br />لية مايقولش احمد عز مثلا يبنى كنيسة<br />مايقولش ابو العينين يبقى قسيس<br />بص يا استاذ انا ادافع عن الصح وعن الناس اللى اعرفها عن قرب انا اعرف الناس دى عن قرب وناس محترمة وفى الاخر ممصرية ورافعة اسم بجد يعنى لما يقولو رجل الاعمال المصرى ساويرس او غير ساويرس اشترى كذا فى ايطاليا واليونان وكذا دى مش تبقى حاجة كويسة<br />لما الاستاذ يقول فى المدونة بتاعتة اللى انت مذاكر براء كويس نقول نقاطع ماقطعتش لية ART لما قال على المصرين حرامية ولية مقالش نقاطع مزيكا وميلودى علشان الافلام اللى من غير رقابة<br />يا استاذ انا كتب لبراء انى كنت بحب كتابتة جداااااااااااا هو ودعاء ومصاعيبو لانى كنت حاسة انهم الامل انما لم تبقى سينا زى سونيا يبقى باى بقى"
archived = "2010-03-14"
capture_url = ""

