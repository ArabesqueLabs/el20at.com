[[comments]]
order = 9
subject = "لا حول ولا قوة الا بالله"
author = "التوربيني...صبح  صبح"
posted = "2007-05-02"
text = "صباح الفل عا الكل<br />ايه يا جدعان...جري ايه يا كابتشن منك له له لها.... فيه ايه بس...موسي نبي ..عيسي نبي.. محمد نبي.. و كل من له نبي يصلي عليه<br />انا كنت بستقرا الموضوع و مستكيف منه اخر مزاج...الراجل اللي اسمه براء دة راجل مزاجنجي و دماغه متكلفه...نقل الصورة بتاع المواصلات بظبط ولا اجداعها مصوراتي نتع...زحمة و عرق و نصب عاخَلق و فهلوة...من مترو لاتوبيس للجمعية للتاكس...اهو كله اكل عيش...لا الراجل عينه وحشة و لا بيبص لحد في ركوبة ولا مزُة معاة ولا طقم شياكة لابسة كدة...فيها اية يعني لما جاب سيرة الراجل بتاع النوبايل دة...نصاري و مسلمين و الدنيا هتولع....مترواءوا كدة و صلوا علي نبيكو...دحنا ولاد حتة واحدة و اخر اخوة... بلاش كلام الناس الفاضية دة و انزلوا الشارع شوفوا الناس عايشة ازاي....اللي عنده كلمه حلوة يقولها و اللي معندوش يحط لاموأخذة في بؤه و يسكت...العملية مش ناقصة وجع دماغ و فلفسة عفَاضي.. وعلي رأي الشاعر اللي كله احاسيس و مشاعير :<br />الحلوة ماشية بتتشخلع و تهز و عندها من كل صنف اتنين<br />الكل طنِش الجمال و العز و جاب في سيرة ساويرس و ابو العنين<br />صبح صبح"
archived = "2010-03-14"
capture_url = ""

