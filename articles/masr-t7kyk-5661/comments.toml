text = "داخل الأتوبيس، ستجد ألف حكاية حكاية، كل واحدة منها، قادرة على جعل نجيب ساويريس يعتنق الإسلام، ويجلس على بوابات السيدة، شأنه شأن المجاذيب.. يهتف مدد يا أم العواجز .. هذا بعد أن تبرع بكل ما يملك لـ\"دار رسالة للأيتام\"..<br />برضة نجيب ساويرس اللى حارق دمك خليك فى حالك انت وفى الاتوبيسات وفى الحقد بتاعك بجد متخيلة منظرك وانت واقف تبص من شباك الاتوبيس والناس اللى منعاهم عربيات وواقف من الشباك تقول باكرهكم ياكرهكم<br />بلالالالالالالالالالالاش حقد<br />موضوع كان كويس والجزء دة اللى بةظة بقى زى وشك"
