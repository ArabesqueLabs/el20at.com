text = "ممكن بس اقول حاجة للبنت اللي قبلي،براء والله بني آدم مترم وابن ناس ومش فقير بالشكل اللي يخليه يحقد على الاغني او اصحاب العربيات تلاقيه بس افيه حكم معاه وانتي عارفةالقافية بتحكم مع اللي بيكتبوا كتابة كومدية زي براء وبعدين هوه براء كتتب عن ساويري قبل كدة امتى انا مذاكرة براء كوس وشفتش كلام عن ساويرسهستنى رد"
