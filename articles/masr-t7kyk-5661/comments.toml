posted = "2007-05-02"
text = "صباح الخير..<br />خلوني بس أوضح موقفي بسرعة.. الموضوع وما فيه إن نجيب ساويرس كان مجرد إفيه ليس له أي علاقة بدين الرجل أو باتجاهاته أو حتى بقناته أو تي في التي أعترض على مقاطعتها بشدة، وبما أن أحد الإخوة المعلقين يعرف طريق مدونتي فلعله يرى بانر كبير ناحية اليمين مكتوب عليه \"أنا أشاهد أو تي في\"..<br />على كل حل اعتذاراتي لأي قارئ تسببت في جرح مشاعره بعبارة نجيب ساويرس.. أكرر أنه مجرد \"إفيه\" يرصد حالتين في المجتمع المصري \"ساويرس\" و\"دار رسالة للأيتام\".. والغريب أن المعلق الكريم اعترض على ساويرس ولم يأتي على ذكر دار رسالة..<br />المهم.. سعدنا بكم ونرجو أن نكون قد أسعدناكم.. والسلام عليكم ورحمة الله وبركاته..<br />البراء أشرف"
