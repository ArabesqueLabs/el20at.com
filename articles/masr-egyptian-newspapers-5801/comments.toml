subject = "الحل من عندك يار ب"
author = "توت عنخ كمون"
posted = "2007-05-10"
text = "للأسف هذا حقيقي<br />فمصر من قديم الأزل كانت رمز للخصوبة والزراعة ولكن جشع من يجمعوتن الأموال من أي مكان ومن [أي طريقة حتى ولو على حساب البشر في غياب للضمير لا يعلم غير الله متى يعود .................... وليست المزروعات فقط لكن اللحوم بكافة أنواعها دخلت في نفس الدوامة والدواجن ..........<br />إن الله خلق النبات والحيوان والإنسان وجعل الله لكل طريقة في النمو والتطور وطبيعة مختلفة ولكن عندما يتدخل الإنسان فأنه يفسد بتدخله التناغم الطبيعي للأشياء ........<br />فالنبات يأخذ غذائه من الأرض والعناصر التى يحتاجها من الأرض ويمكن تسميد الأرض بسماد عضوى مع العلم عندما تزيد نسبة السماد يمكن أن تضر به .......... كذلك يغذون الدواجن بمخلفات المجازر والدواجن فى الأصل نباتية كذلك مزارع الأبقار التى تغذى الأبقار على مخلفات حيوانية فلا عجب إنتشار الأمراض ............"
archived = "2010-03-14"
