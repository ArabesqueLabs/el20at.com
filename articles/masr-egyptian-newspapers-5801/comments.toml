text = "كده أحسن تشتري كيلو خيار ، والطعم مش مشكلة<br />غمض عيونك وكل الخيارة لأولىاعتبرها موزة، وباسم الله الثانية تاكلها بنية التفاح<br />وكدة ضحكنا على الدنيا كلها وأكلنا كل حاجة وما اشتريناش إلا حاجة ...........<br />وهكذا وهكذا الدنيا غابة ومنتزه، كما قال عمي ـ سامي العدل ، وسمية هانم ، وعبلة الهبلة بنت الذينة"
