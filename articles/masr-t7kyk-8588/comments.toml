subject = "الإدمان والمخدرات كوارث تبحث عن متهم"
posted = "2008-03-25"
text = "الإدمان والمخدرات كوارث تبحث عن متهم ؟<br />تحقيق / سهام أحمد<br />الإدمان ظاهره أصبحت خطيره علي الكثير والكثير من ينجو من تدخين السيجاره يصبح عفيفا معافا طيله حياته ومن يكون أسيرا لها تقتله في يوم من الأيام كثرت في هذه الأيام تدخين السجائر بأنواعها المختلفه البانجو والحشيش والأفيون وأصبحنا نعيش في شيكاغو وليست مصر بلد الأمن والأمان أصبح الصغير يتناول السيجاره قبل الكبير بل أصبح الولد يعزم علي والده بسيجار هديه ضاع الشباب وفسدت التربيه فحدث ما حدث ولكن عزيزي القاريء نعرض إليك خطوره وأعراض هذا الغول الخطير الذي يجتاح البيوت فتابعنا عزيزي القاريء<br />يحدث الإدمان نتيجة للتفاعل بين ثلاثة عوامل رئيسية هى المخدر والإنسان والمجتمع، وذلك على النحو التالي<br />أولا: بالنسبة للمخدر وهو العامل الأول فى قضية الإدمان، واستخدامه يخضع لعدد من العوامل التي منها:<br />1- توفر المخدر وسهولة الحصول عليه.<br />2- طريقة التعاطي مثل تعاطي المخدرات بالفم أو الشم فهذا يسهل الإدمان عليها، بينما يقلل استخدامها بطريق الحقن من فرص الإدمان.<br />3- الخواص الكيمائية والبيولوجية للمخدر، فقد ثبت علميا أن لكل مخدر خواصه وتأثيراته المختلفة على الإنسان، كذلك ثبت أن أي شخص بعد أن يستخدم أنواعا مختلفة من المخدرات فإنه لا يلبث أن يفضل \"صنفا\" منها ويدمن عليه، وذلك لوجود نوع من التوافق بين هذا المخدر وتأثيراته من جهة وشخصية هذا الإنسان من جهة أخرى، لدرجة أنه قيل إن الشخص يبحث عن المخدر الذى يناسب شخصيته، وهو ما يقول عنه العوام \"المزاج<br />فالشخص المصاب بالاكتئاب يستخدم مخدرات تسبب له الإحساس بالرضا والسرور والتعالي. فى حين أن الشخص الذى يعاني من التفكك الداخلي في الذات واضطراب في العلاقات بالآخرين أو في الوجدان والمشاعر وهو ما يعرف بـ(الشخصية الفصامية) يفضل المخدرات التي تساعده على إعادة الانتظام والإحساس بالواقع.<br />ثانيا: الإنسان الذى يتكون من جسم ونفس يتفاعلان باستمرار لدرجة أنه يصعب الفصل بينهما ولذلك تتداخل العوامل التي تؤثر في النفس مع العوامل التي تؤثر في الجسم وهي التي سنتناولها في ما يلي باختصار:<br />2- العوامل الجسمية تنحصر في: الوراثة والعوامل المكتسبة والأخطاء الطبية العلاجية وأخيرا الأسباب البيولوجية للاعتماد وهي التي تسمى الناقلات العصبية.<br />2- العوامل النفسية التي تلعب دورا في التعاطي والإدمان هي:<br />أ- تخفيض التوتر والقلق.<br />ب- تحقيق الاستقلالية والإحساس بالذات.<br />ج- التغلب على الإحساس بالدونية.<br />د- التغلب على الأفكار التى تسبب له الضيق.<br />ه- الخروج على القوالب التقليدية للحياة (المغامرة).<br />و- حب الاستطلاع وملء الفراغ.<br />وهناك من يضيفون دوافع أخرى إلى ما تقدم منها على سبيل المثال:<br />الرغبة فى التجريب- الهروب من المشاكل- الرغبة في زيادة المرح- الصراع بين التطلعات الطموح والإمكانات المتاحة- الفشل فى حل الصراع بالطرق المشروعة- الاحساس بالاغتراب والقهر الاجتماعي- الرغبة في الاستقرار النفسي<br />مشكلة تعاطي المخدرات والإدمان عليها مثلها مثل غيرها من المشكلات الاجتماعية وراءها عوامل اجتماعية عديدة هامة ومؤثرة تتباين من مجتمع إلى آخر، بل ومن فرد إلى فرد آخر سيتم التطرق اليها بالتفصيل و مع أهل الاختصاص فيما بعد<br />أراء الخبراء العلم النفسيين في هذه القضيه<br />أشارت دراسة نيوزيلندية أجريت على 100ألف مراهق تتراوح أعمارهم بين سن 14و 15عاماً إلى أن تدخين سيجارة واحدة يمكن أن يحول المراهق إلى مدمن نيكوتين وأكد الباحث في مجال الصحة العامة الدكتور موراي لوجسن لصحيفة نيوزيلاند هيرالد أن المراهقات معرضات أكثر لخطر الإدمان لأن هرمون الاستروجين، وهو الهرمون المسؤول عن النضج الجنسي لدى النساء، يزيد من مستويات النيكوتين في الدم وقال لوجسن : \"إنه تأثير هرموني\"، مشيرا إلى أن أعراض إدمان التبغ تظهر مبكراً لدى الفتيات عن الأولاد ووجدت الدراسة أنه بعد تدخين أول سيجارة تحول 50% من المراهقين الذين شملتهم الدراسة، أصبحوا مدخنين دائمين ، وبعد عشر سجائر أصبح أكثر من 80% يدخنون بانتظام ووجد المسح أن كل سيجارة يتم تدخينها تعني الانزلاق أكثر نحو هاوية الإدمان، وبعد تدخين 100سيجارة أصبح أكثر من 95% ممن شملتهم الدراسة مدخنين دائمين وقال لوجسن: \"كنا نعلم أن السجائر تسبب الإدمان.. لكن الجديد بالنسبة لنا أننا ربطنا هذا الإدمان بعدد السجائر وهو ما لم يفعله أحد من قبل وأشار لوجسن إلى إنه رغم أن بيع السجائر لمن يقل عمره عن 18عاما غير قانوني، فإن المراهقين يمكنهم دائماً الحصول عليها طالما يتم بيعها. وقال: \"لا يمكن للآباء حماية أبنائهم من التدخين.. ولذا فإن هناك سبباً للنظر في منع كافة أشكال البيع (للسجائر) خلال السنوات العشر القادمة<br />تدخين الفنانين يشجع علي الممارسه<br />أكدت دراسة حديثة أن ظهور الممثلين في الأعمال الدرامية بالسينما والتليفزيون يشجع 40% من الأطفال والمراهقين علي التدخين وأوضح الدكتور مجدي بدران عضو جمعية الحساسية والمناعة أنه يجب منع مشاهد الفنانين وهم يدخنون لتأثيرهم النفسي علي تلك الفئة العمرية، لاسيما أنه من المتوقع وفاة بليون شخص علي مستوي العالم نتيجة المواد السامة من التدخين<br />التدخين يسبب أكثر من 25 مرضاً<br />كشفت طبيبة كويتية أن تدخين السجائر والشيشة يسبب أكثر من 25 مرضاً، وان الاحصاءات تظهر أن نحو 70 في المائة من المدخنين هم في العقد الثاني من اعمارهم وقالت الدكتورة ماجدة القطان عضو اللجنة الطبية لمكافحة السرطان لوكالة الانباء الكويتية إن الاحصاءات الصادرة عن منظمة الصحة العالمية تظهر أن التدخين يودي بحياة إنسان واحد كل ثماني ثوان معتبرة ذلك \"معدلا خطيرا وأضافت أن تدخين السجائر والشيشة يسبب أمراضاً عدة مثل ضعف المناعة والسرطان والأورام في مختلف أعضاء الجسم مثل الرئة والجهاز التنفسي والمعدة والمريء والكلى والمثانة والبنكرياس وعنق الرحم بالنسبة للنساء إلى جانب أمراض القلب وتصلب الشرايين والجلطات المختلفة وتغير لون الاصابع والصلع وظهور التجاعيد مبكرا وتاكل الاسنان والاجهاض وتشوه الحيوانات المنوية وأشارت إلى إحصاءات عالمية أظهرت أن عدد الوفيات التي تسبب بها التدخين بلغت خمسة ملايين شخص سنويا بينهم 500 الف امراة<br />هل يمكن معالجة الإدمان بالقرآن؟<br />يجيب عن هذا السؤال فضيلة الشيخ فرحات المنجي ـ وكيل الأزهر الشريف سابقا:<br />القرآن الكريم فيه شفاء لما فى الصدور والإنسان حينما يقرأ أو يُقرأ عليه القرآن ويتدبر معانيه فإن نفسه ستصفو وخاصة إذا علم أن الإدمان شر مستطير فوق أنه حرام والقرأن يورث في النفس طمأنينة وراحة تجعل الإنسان هادئاً غير محتاج إلى منشطات ولا يوجد سحر للإدمان أو غيره فوق أن السحر حرام ومن يفعله ومن يصدقه فهو كافر"
