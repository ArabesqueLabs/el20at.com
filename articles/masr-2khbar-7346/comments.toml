subject = "ومنين تيجى الكرامة"
author = "مليان قرف"
posted = "2007-10-16"
text = "اذا كنا اصلا بنشحت منهم المساعدات<br />واذا كان سكرتير تالت عندهم بيعطى اوامر<br />واذا كانت الست كوندا بتجتمع مباشرة مع بتوع مخابرات الدول المعتدلة وتعطيهم اوامر وكان قيادتهم طرا<br />يبقى عايزين اية<br />المخاوف الامنية المبالغ فيها جدا حول السفارة اياها وكان الجميع فى القاهرة يحملون صواريخ على اكتافهم وهيفجروها<br />دا اللى خلاهم يحسوا ان سفارتهم زى المنطقة الخضراء فى بغداد<br />انا اطالب الحكومة برفض اى معونات من امريكا تحت اى مسمى<br />وتفعيل الدور المصرى فيما حولنا وارسال قوات مصرية الى دارفور لمساعدة السودان على فرض سيطرتة على ارضة<br />وكذلك اعطائة السلاح لفرض سيطرتة على الجنوب<br />كما يجب تفعيل الدور المصرى بالتعاون مع حزب اللة وسوريا<br />اقامة علاقات فورية مع طهران<br />لتغضب امريكا او تنفجر فليس عندنا شيئا نخسرة<br />نحن نعيش بكرامتنا اولا<br />وبعد الكرامة لا يوجد شىء"
archived = "2010-03-14"
