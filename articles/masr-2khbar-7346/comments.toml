subject = "احي"
author = "انا زهقت"
posted = "2007-10-16"
text = "و الله انتو بقر لو حد فيكم بقرا جرايد غير الاهرام و الزباله اللي في مصر هيعرف ايه اللي حصل مع السفير البيه كان فاكر نفسو في مصر و قال للظابط انا هوريك عشان منعو يعدي من شارع مسدود لولا ان ااظابط اتنازل عن حقو كان زمان الزفت الحمار السفير بيدور علي محامي هناك يا بهايم اقروا و لا اقولك بلا قرايه بلا زفت الاسهل نقول انها اسرائيل هي السبب هي اللي خلت مصر زفت هي اللي خليتنا نكره بعض هس السبب في فساد الحكومه هي السبب اسرائيل هي السبب ان مصر بقت دوله فقيره مش عشان المسؤولين الحرميه و هي برضو السبب في انفلونزا الطيور في مصر و الالتهاب الكبدي الوبائي و هي برضو اللي ورا الفتاوي بتاعت رضاع الكبير و هي السبب انك انت و اللي زيك حمير و هتفضلو حمير علي طول"
