subject = "فتوي الشيخ عبدالحميد الكُلاب، خطيب مسجد عباد الرحم"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-01-19"
text = "أثارت فتوي الشيخ عبدالحميد الكُلاب، خطيب مسجد عباد الرحمن بخان يونس في قطاع غزة، بشأن إباحة قتل الجنود المصريين في حال تعرضهم للفلسطينيين، رفضاً من الكثيرين، خاصة أساتذة الشريعة والفتوي بالأزهر الشريف، حيث اعتبروها خارج الفقه والفتوي، وأكدوا أنها افتراء علي القواعد الأخلاقية قبل القواعد الدينية."
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

[[comments]]
order = 15
subject = "فتوى بجواز اكل الكلاب والقطط"
author = "مش رضوى حسن ولا مروى صلاح"
posted = "2009-01-19"
text = "فتوى بجواز اكل الكلاب والقطط<br />عرب تايمز - خاص ......<br />اصدر الشيخ الشيخ المصري عبد الحميد الأطرش، رئيس لجنة الفتوى بالأزهر فتوى جديدة اجاز فيها للمسلمين بأكل القطط والكلاب وذلك وفقا لما نشرته جريدة الشرق الاوسط اللندنية التي ذكرت انها اجرت حوارا مع الشيخ حول هذه الفتوى<br />، وكان الشيخ قد افتى ايضا بأكل الجراد ، لأن« لحم» هذه الحشرة التي هاجمت بعض دول المنطقة العربية بالملايين هو طعام حلال للمسلم طبقا للشريعة،وقالت الجريدة انها سالت الشيخ عن باقس الحشرات فاعتبرها جميعها من الطعام الحلال على المسلم أكله إذا أراد.<br />ويقول الشيخ عبد الحميد إن من الحلال على المسلم أكل القردة مثلا، بل والذباب والجرذان ولحم الفيلة والقطط والكلاب والفراشات والهوام الصغيرة التي تصعب رؤيتها إلا بعد التحديق بها وهي تعرش أو تطير، وكله لا يحرّمه الإسلام طالما اشتهته النفس، إلا ما نصت عليه آيات في التشريع والحدود واردة في القرآن الكريم واستهدفت حيوانات معينة، وأهمها توضيحا وحسما هي الآية 145 من سورة الأنعام «قل لا أجد في ما أوحي إليّ محرّما على طاعم يطعمه إلا أن يكون ميتة أو دما مسفوحا أو لحم خنزير، فإنه رجس أو فسقا أهل لغير الله به، فمن اضطر غير باغ ولا عاد فان ربك غفور رحيم» وهي ما يعتمد عليها الشيخ عبد الحميد لحسم السؤال حول أي حشرة أو حيوان يرغب الإنسان بأكله، إضافة لاعتماده على آيات أخريات ومن السنة النبوية الشريفة."
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

[[comments]]
