[[comments]]
order = 9
subject = "نشيد الجيش المصري وكلمات النشيد بتقول"
author = "مش كاتب"
posted = "2009-01-18"
text = "نشيد الجيش المصري وكلمات النشيد بتقول :<br />رسمنا علي القلب وجه الوطن<br />نخيلا ونيلا وشعبا اصيلا<br />وصناك يامصر طول الزمن<br />ليبقي شبابك جيلا فجيلا<br />علي كل ارض تركنا علامة<br />قلاعا من النور تحمي الكرامة<br />عروبتنا تفتديك القلوب<br />ويحميك بالدم جيش الكنانة<br />وتنساب يا نيل حرا طليقا<br />لتحكي ضفافك معني النضال<br />وتبقي مدي الدهر حصنا عريقا<br />بصدق القلوب وعزم الرجال<br />رسمنا علي القلب وجه الوطن<br />نخيلا ونيلا وشعبا اصيلا<br />وصناك يامصر طول الزمن<br />ليبقي شبابك جيلا فجيلا<br />يد الله يا مصر ترعي سماك<br />وفي ساحة الحق يعلو نداك<br />ومادام جيشك يحمي حماك<br />ستمضي الي النصر دوما خطاك<br />سلام عليك اذا ما دعانا<br />رسول الجهاد ليوم الفداء<br />وسالت مع النيل يوما دمانا<br />لنبني لمصر العلا والرخاء<br />رسمنا علي القلب وجه الوطن<br />نخيلا ونيلا وشعبا اصيلا<br />وصناك يامصر طول الزمن<br />ليبقي شبابك جيلا فجيلا"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

[[comments]]
order = 10
subject = "قوات اية --- رجعنا للمربع صفر بتاع حرب 1948  - وال"
author = "مش لاعب"
posted = "2009-01-18"
text = "منظمة حزب اللة تنجح فى جنوب لبنان وتحمى سوريا ولبنان<br />ومنظمة حماس فى قطاع غزة وحدود مصر تحارب 22 يوما صامدة وتحارب رغم قلة السلاح والحصا<br />رهل رجعنا الى 1948 وحرب الفدائيين ونجاحها والحرب الشعبية<br />ربما<br />وبعد تجربة فشل الجيوش العربية فى كل مكان<br />الجيش العراقى لم يصمد امام امريكا وبريطانيا فى معركة واحدة ساعات وسقطت بغداد بدون مقاومة بعد ان هرب الاشاوس بتوع الجيش<br />ثم تصدت المقاومة الشعبية لامريكا<br />وتم تدمير الاقتصاد الامريكى وضحضحة الجيش الامريكى واصاية اكثر من 35 الف امريكى جريح وقتل اكثر من اربعة الاف جندى<br />اذن هى المقاومة<br />انسوا عنتريات الجيوش الهزيلة وتمسكوا بالمقاومة<br />المقاومة هى حرب الشعب"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

[[comments]]
order = 11
subject = "اكتشاف علاج نهائي للسرطان بدون التدخل الجراحي او ا"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-01-19"
text = "اكتشاف علاج نهائي للسرطان بدون التدخل الجراحي او الكيميائي باذن الله<br />أخيرا عقار \\\\\\'الرحمة\\\\\\' لعلاج السرطان في مصر برعاية سعودية<br />يبدو ان \\\\\\'السرطان\\\\\\' سوف يتحول في الغد القريب بفضل الله الي مجرد مرض عادي يشبه نزلة البرد تتم معالجته بجرعات دواء متوافرة رخيصة الثمن كانت \\\\\\'الاسبوع\\\\\\' قد نشرت قصة الدكتور محمد النجار استاذ الطب الشرعي بجامعة الاسكندرية الذي توصل الي اختراع علاج لمرض السرطان بكل انواعه، وقام بتسجيل براءة اختراعه باكاديمية البحث العلمي في مصر وظل في محاولات مضنية لاقناع وزارة الصحة المصرية بتبني هذا الاختراع الذي يمكنه ان يمحو آلام البشر خاصة بعد أن استفحل المرض في العصر الحديث وبعد ان ثبتت الاثار الجانبية الحادة للعلاج الاشعاعي والكيماوي للمرضي وعدم فاعليته في الشفاء بنسبة 100 % .. حاول د. النجار اقناع المسئولين الذين تشبثوا بالروتين وطلبوا عرض الموضوع علي الازهر!!! وتساءل د. النجار عن علاقة الازهر بالدواء، وظلت المحاولات والمهاترات العلمية مما دفع المختر ع للتفكير في الهجرة لامريكا وبا ! لفعل انهالت عليه عروض شركات الدواء الامريكية لشراء العقار الذي كان يطلق عليه \\\\\\'رودكس\\\\\\' ووقف سعر العقار حائلا دون اتمام الصفقة حيث اشترط د. النجار الا يزيد ثمن حقنة الدواء علي (300 جنيه) الامر الذي بات مستحيلا من وجهة نظر الامريكان لان البيزنس لا مكان فيه \\\\\\'للعواطف المصرية ....<br />وانهالت العروض الاوربية لشراء العقار ومنها اليونان التي تحمس رئيس وزرائها بنفسه للتعاقد مع المخترع المصري حتي ظهر في الافق عرض سعودي تحمس له الدكتور النجار لأن صاحب العرض كان سمو الامير فهد بن عبد الله بن محمد آل سعود الذي قام بالاتفاق شخصيا مع الدكتور النجار الذي اكد ل\\\\\\'الاسبوع\\\\\\' انه في خلال ايام قليلة سوف يتم التعاقد مع الامير السعودي الذي تبني العقار وسوف يطلق عليه اسم \\\\\\'عقار الرحمة\\\\\\' بعد ان اثبت فعاليته في علاج حوالي \\\\\\'300 حالة مرضية\\\\\\' في معظم انواع السرطان \\\\\\'الغدد الليمفاوية والرئة والقولون والبنكرياس\\\\\\' وسوف يتم منح الجنسية السعودية للمخترع المصري ليتمكن بعدها من انشاء \\\\\\'5 مراكز\\\\\\' لعلاج السرطان في القاهرة والاسكندرية وطنطا ودمنهور والاشراف عليها مع فريق علي اعلي مستوي من اطباء واساتذة الاورام المصريين علي ان يطلق عليها \\\\\\'مراكز لعلاج السرطان الس ريع في خلال شهر\\\\\\' وذلك بواسطة عقار الرح! مة الذي لن يباع في الصيدليات وانما يتم العلاج به فقط داخل المراكز ولايتعدي ثمن الحقنة الواحدة (300 جنيه) وتكفي حقنتان من العقار لعلاج سرطان الدم \\\\\\'اللوكيميا\\\\\\' إلي جانب مستحضرات طبية أخري من العقار لعلاج أنواع السرطان المختلفة وسوف يجري تصنيع العقار في اكبر مصنع أدوية بمدينة الرياض بالسعودية مع وجود فرع آخر بالإمارات وتم بالفعل اختيار اول موقع بالإسكندرية بجوار الحديقة الدولية ويجري البحث عن المواقع الاخري ليتم العمل علي قدم وساق لنتمكن من محو آلام المرضي في مصر والوطن العربي<br />فقط لأمانة التبليغ والله أعلم<br />وهذا رقم التليفون المحمول الخاص بالطبيب مكتشف العلاج الدكتور محمد النجار 0020105080657<br />بالله عليكم لا تدعوا الرساله تقف عندكم فتأكدوا أن هناك من ينتظرها وفي حاجة ماسة لها<br />ملاحظة هذا الطبيب مصري ومقيم في مصر<br />ونسأل الله الشفاء للجميع<br />(خير الناس أنفعهم للناس)<br />سبحان الله وبحمده سبحان الله العظيم"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

[[comments]]
order = 12
subject = "الواد بهلول ومؤتمر القمة فى خرابة زينهم"
author = "سكر زيادة"
posted = "2009-01-19"
text = "الواد بهلول عايز يعمل مؤتمر قمة<br />دعى ابو عفريت بياع البطاطا وام حنتوت بياعة الطماطم وابو سحلول عربجى كارو -- دعاهم لمؤتمر قمة فى الخرابة ووعدهم ان يعطى كل واحد سيجارة وكباية شاى يبشرق بها نفسة<br />حضر الجميع وقعدوا فى الخرابة على البرش وشربوا الشاى والبانجو وانسطلوا<br />واصدروا بيانا قالوا فية<br />ان السماء زرقاء ولا يزال السمك يعيش فى الماء وانهم يؤيدون استمرار الخرابة<br />وقد شجبوا وشتموا كل اللى يعارضهم ووعدوة بضرب البراطيش"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

