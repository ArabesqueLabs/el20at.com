text = "أقباط أسيوط يتظاهرون تضامنا مع غزة<br />بتاريخ : الاتنين 5 يناير 2009 3:42:19 م<br />عدد القراء : 102<br />البشاير – محمودالجندى :<br />نظمت مطرانية الأقباط الأرثوذكس بالقوصية وقرية مير اليوم وقفة احتجاجية ضد الأعمال الوحشية التي أقيمت بغزة مؤخراً وأصابت مئات من المدنيين انطلقت من أمام الديوان العام لمحافظة أسيوط وشارك بها اللواء نبيل العزبي محافظ أسيوط وأسقف القوصية ومير وكهنة الإيبارشية والمجلس الملي الفرعي بالقوصية."
