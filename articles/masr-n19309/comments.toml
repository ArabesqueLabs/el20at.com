[[comments]]
order = 4
subject = "مصر تحرك قواتها يا احمد يا هواري"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-01-16"
text = "مصر تحرك قواتها المتمثلة في الامن المركزي<br />ضد اعداء الوطن الحقيقيين<br />ما ينفعش مصر تحارب في جبهتين<br />مصر ما عندهاش حرب الا حرب تفريق المظاهرات<br />ومش في القاهرة بس يا حمد الهواري<br />في كل مدن مصر حتلاقي قوات امن مصرية متأهبة في كل لحظة وفي كل دقيقة مستعدة للحرب<br />وسينتصر جيش الامن المركزي باذن الله<br />وما احداث المحلة ببعيد<br />فقوات الامن في المحلة لقت اعداء مصر درسا لن ينسوه ابدا وعادت الى قواعدها سالمة<br />واديك يا احمد الهواري انت في القاهرة وبتشوف قوات مصر وهي تتحرك بنجاح باهر ضد اعداء الله واعداء مصر<br />سلام يا احمد يا هواري وسلملي على انور هواري رئيس تحرير الوفد سابقا"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

[[comments]]
order = 5
subject = "الداخلية تضع 150 ألفا من جنود الأمن المركزي في حال"
posted = "2009-01-16"
text = "نقلا عن المصريون<br />الداخلية تضع 150 ألفا من جنود الأمن المركزي في حالة تأهب وإجراءات أمنية مشددة لتأمين أنبوب تصدير الغاز المصري لإسرائيل<br />كتب أحمد حسن بكر (المصريون): : بتاريخ 28 - 12 - 2008<br />أعلنت وزارة الداخلية حالة الطوارئ القصوى في قطاع الأمن المركزي، وأوقفت إجازات الضباط والجنود إلى أجل غير مسمى، كما صدرت أوامر باستدعاء كافة الجنود والضباط الموجودين حاليا في إجازة.<br />يأتي هذا في ظل اشتعال المواقف، واندلاع تظاهرات الغضب في العديد من محافظات ومدن مصر تنديدا بالمجزرة التي ارتكبتها إسرائيل بقطاع غزة وأسفرت عن استشهاد نحو 300 حتى الآن.<br />أكدت مصادر أمنية، أنه تم وضع أكثر من 150 ألف جندي من الأمن المركزي في حالة تأهب تام وأنه تم توزيعهم على الميادين وبالقرب من الجامعات المصرية، خشية اندلاع مزيد من التظاهرات في الشارع المصرية.<br />على صعيد آخر، اتخذت مصر إجراءات أمنية مشددة لتأمين أنبوب الغاز المصري المغذى لإسرائيل بالغاز المصري، بعد معلومات استخباراتية إسرائيلية تلقتها الأجهزة الأمنية المصرية أمس الأحد، زعمت أن هناك خططا لتفجير الأنبوب ردا على المجزرة الإسرائيلية ضد سكان قطاع غزة.<br />وعلمت \"المصريون\" أن الأجهزة الفنية بوزارة البترول قد تضطر لإغلاق مؤقت لأنبوب النفط خشية تفجيره في ضوء التهديدات المزعومة.<br />ويبدأ الأنبوب من مدينة بور فؤاد ثم يتجه إلى شمال سيناء، حتى مستوطنة \"كريم شالوم\" ثم يأخذ خطا فرعيا إلي مدينة بئر سبع لتغذية محطات الكهرباء وتشغيل المصانع في مستوطنة \"روش بينا\" و\"ناحال بيكا\" بصحراء النقب، وهما مستوطنتان تم تمويلهما من الصندوق القومي اليهودي والوكالة اليهودية، وتضم يهودا من الصومال وإثيوبيا واليمن، ثم يتجه خط الأنابيب إلي مدينة (أشدود) بطول قدره 70 كيلو متر لتموين محطة الكهرباء هناك، ثم يتجه إلي شمال غزة لتموين محطة كهرباء \"الزيتيم\".<br />وكانت محكمة القضاء الإداري في مصر قد أصدرت حكما بوقف تصدير الغاز المصري لإسرائيل إلا أن الحكومة رفضت تنفيذ الحكم.<br />وجاء ذلك بناء على دعوى أقامها عدد من الناشطين المصريين لوقف بيع مصر الغاز لإسرائيل بأسعار تقل أكثر من 75% عن السعر الذي تبيعه للشعب المصري، في الوقت الذي تمنع فيه إسرائيل إمدادات الكهرباء والطاقة عن شعب قطاع غزة."
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

[[comments]]
order = 6
subject = "الحمد للة على نعمة الستر والا يفضح لنا  __________"
author = "راضى"
posted = "2009-01-17"
text = "انت عارف اسرائيل بتضرب غزة لية ؟<br />وبكثافة نيرانية عالية جدا -- لية ؟<br />انا اقول لك<br />طبعا الجيش الاسرائيلى طبعا عندة مخازن زخيرة وطبعا الذخيرة دى لها عمر افتراضى ومطلوب تجديدها كل فترة والتانية بذخائر جديدة ومتطورة<br />تعمل اية فى الذخائر القديمة دى والقنابل المصفوفة على الارفف والصواريخ المخزنة<br />تفكر فى حرب تستهلكهم وتغيرهم بذخيرة جديدة<br />ودى اللى بيتم<br />انما فية جيوش عربية عندها زخائر من 50 سنة فى المخازن<br />ولو فكروا يطلقوها هتطلع شوية دخان ويمكن ما تنفجرش<br />وفى جيوش عربية عندها اسلحة من روسيا استخدمت فى الحرب العالمية الاولى زى الدبابة ت 34 اللى هى عماد الجيش السورى والجيوش ذات التسليح الروسى<br />وعندك السعودية من 15 سنة عملوا مشروع اليمامة او صفقة اليمامة واشتروا سلاح ب 200 مليار دولار<br />وطبعا حطوة فى المخازن علشان يبيض ويطلع كتاكيت<br />وصفقات الامارات وقطر والكويت كلها لملىء المخازن وتعمير الخزانات الغربية بالدولارات والاسترلينى<br />قوات اية اللى هتحركها<br />مش يمكن تكون مصدية من الركنة<br />والا العتة اكلتها<br />يا راجل روح اشرب كباية شاى تقيلة ودفى نفسك بسيجارة مغمسة بانجو"
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

