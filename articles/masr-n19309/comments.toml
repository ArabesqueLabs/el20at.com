[[comments]]
order = 17
subject = "وهو ما دفع النائب الإخوانى أشرف بدر الدين إلى رفع"
author = "مش حضرب"
posted = "2009-01-19"
text = "بدأت الأزمة بسبب اتهامات وجهها الدكتور فتحى سرور إلى نواب المعارضة بأنها تسىء للقيادة المصرية فى القنوات الفضائية، وهو الأمر الذى لم يقبله نواب الإخوان المسلمين. فى حين اشتعلت الأزمة أكثر، عندما تحدث النائب الوطنى نشأت القصاص، وقال إن المعارضة فى مصر أصحبت تعمل لصالح أعداء مصر فى إشارة لإيران وسوريا، وهو ما أثار نواب كتلة الإخوان.<br />واستمر القصاص فى التشكيك فى نوايا زملائه من كتلة الإخوان، وهو ما دفع النائب الإخوانى أشرف بدر الدين إلى رفع حذائه، وتدخل سرور وسط هياج نواب الوطنى واندلاع بعضهم للشجار مع زملائهم من الجبهة اليسرى، والتى يجلس بها نواب المعارضة."
archived = "2009-01-19"
capture_url = "https://web.archive.org/web/20090119192639/http://masr.20at.com:80/newArticle.php?sid=19309"

[[comments]]
order = 18
subject = "رد على إتفو عليكم يا إخوانجية يا كلاب"
author = "مش حسن البنا"
posted = "2009-01-20"
text = "الوصايا العشر للإمام الشهيد حسن البنا<br />*قم إلى الصلاة متى سمعت النداء مهما كانت الظروف<br />*اتل القرآن أو طالع أو استمع أو اذكر الله و لا تصرف جزءا من وقتك فى غير فائدة<br />*اجتهد أن تتكلم العربية الفصحى فإن ذلك من شعائر الإسلام<br />*لا تكثر الجدل فى أى شأن من الشئون فإن المراء لا يأتى بخير<br />*لا تكثر الضحك فإن القلب الموصول بالله ساكن وقور<br />*لا تمزح فإن الأمة المجاهدة لا تعرف إلا الجد<br />*لا ترفع صوتك أكثر مما يحتاج إليه السامع فإنه رعونة وإيذاء<br />*تجنب غيبة الأشخاص وتجريح الهيئات ولا تتكلم إلا بخير<br />*تعرف على من تلقاه من اخوانك وإن لم يطلب منك ذلك فإن أساس دعوتنا الحب و التعارف<br />*الواجبات أكثر من الأوقات فعاون غيرك على الإنتفاع بوقته وإن كان لك مهمة فأوجز فى قضائها<br />ــــــــــــــــــــــــــــــــــــــــــ<br />منهم لله لكل من دخل جماعة الاخوان واساء اليها<br />ونشاة الاخوان اصلا كانت للدعوة الى الله بالحكمة والموعظة الحسنة<br />وليست لأغراض سياسية<br />تماما مثل النبي محمد صلى الله عليه وسلم<br />أصلا كان داعية الى الله سبحانه وتعالى"
archived = "2010-03-14"
capture_url = ""

