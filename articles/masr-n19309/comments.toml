subject = "وظيفة شاغرة.. مطلوب مرشد للاخوان المسلمين"
author = "مش منهار"
posted = "2009-01-19"
text = "بصراحة المرشد الحالي لا يصلح<br />لان الامر وصل الى ان احد الاخوان قلع الجزمه ليضرب زميله<br />فهذه سابقة خطيره في جماعة الاخوان المسلمين<br />لان الاخوانجي داعية الى الله قبل ان يكون سياسي والاخوانجي لم يدخل مجلس الشعب الا للدعوة الى الله سبحانه وتعالى<br />فلما الاخوانجي يقلع الجزمه ليضرب بها دليل على ان العملية منهاره"
