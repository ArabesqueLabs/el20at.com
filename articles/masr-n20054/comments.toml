subject = "حكومة رجال اعمال معرصين"
author = "مش حخاف"
posted = "2009-02-19"
text = "الفايدة في البنوك كانت 10%<br />عم نظيف نزلها علشان خاطر رجال الاعمال<br />الله يخرب بيت امك يا نظيف الكلب<br />جوعتنا ربنا يجوعك"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083107/http://masr.20at.com:80/newArticle.php?sid=20054"

[[comments]]
order = 2
subject = "الى المعلق السابق - اموال المودعين فى البنوك غنيمة"
author = "اكتب اسمك هنا"
posted = "2009-02-19"
text = "يعنى اذا اعطينا فلوسنا لواحد زى البوشى يحاكموة واذا وضعناها فى البنك رجال الاعمال يخفضوا الفايدة ويعملوا بها مصانع ويهربوا الفلوس برة البلد<br />احسن حاجة نسحبها من البنوك ونشترى بها حتة ارض فاضية"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083107/http://masr.20at.com:80/newArticle.php?sid=20054"
