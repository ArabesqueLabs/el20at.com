order = 0
subject = "سندوتشات القطط والحمير لها تاثير فى تفكير رجال الح"
author = "اكتب اسمك هنا"
posted = "2009-02-19"
text = "بدلالة القرارات الغبية اللى طلعوها من مجلس الشعب وعملت اضرابات الصيادلة وسواقين المقطورات<br />فسندوتشات لحم الحمير بتخليهم يطلعوا قرارات غبية تثير الناس<br />وسندوتشات القطط بتخليهم يتراجعوا عن تلك القرارات عند تانى يوم اضراب<br />مخ حمار وجبن القطة"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083107/http://masr.20at.com:80/newArticle.php?sid=20054"

