text = "حسب معلوماتي في التاريخ إن المصريين القدماء كانوا ينزعون أحشاء الميت بما فيها القلب والأمعاء والمخ وباقي الأحشاء من جسد الميت ويضعونها محفوظة بطريقة معينة في آنية فخارية خاصة تغلق جيدا وتوضع بجوار الجسد المحنط ، فإذا كان ذلك كذلك كما قرأنا في الكتب ، فكيف نصدق أنهم وجودوا تلك الثقوب في القلب؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />مش عارف أصدق مين وللا مين في البلد دي."
