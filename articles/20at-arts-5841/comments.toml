subject = "والله إن القلب ليكتئب لموضوع مثل هذا"
author = "غاندي الإبن"
posted = "2007-05-14"
text = "يا أسيادنا في اشراف عشرينات ..هناك عشرات المواضيع الجميلة عن المغرب ،في ملايين المدونات على النت،ألم تجدو غير هذا الموضوع..<br />يا سيدي الكاتب را أنت اللي ما قلبتيش،الكورنيش على طول المسافة الفاصلة بين تطوان وسبتة مرورا بالرينكون وكاستيخو والرأس الأسود ومارتيل ،مناطق كتسطي بالزين،وأقسم أني لم أجد شبيهتها في الضفة الأخرى في اسبانيا أعني..<br />بالله يا إدارة كفو عنا مثل هذه المواضيع الغبية"
