text = "يا أستاذ حمدى .. الصراحة المقال ده كويس ومن المقالات المعدودة اللى بتشتم فيها فى حد غير الإخوان ، كويس .. ده تقدم جميل ، يللا شد حيلك انت وصلاح عيسى وعبد الله كمان - كمال- وعمرو عبد السميع وعساكر وشلة الأنس ، ربنا يكرمكم كده ونشوف لكم شغل عدِل ، والله يا جماعة فيه حاجات تانية فى مصر غير الإخوان ممكن تتكلموا عنها ، ولو مش عارفينها أنا ممكن لما أفضى أبقى أكتبهالكم - رغم إن بعضكم للأسف اشتغلت معاه وكان الريس بتاعى فى الشغل ، بس مش مشكلة ممكن الضلمة تعمى عيوننا عن بعض الأشياء ، مش عيب !!!!!!!!!!!"
