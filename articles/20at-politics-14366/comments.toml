text = "لا اله الا الله وانا لله وانا اليه راجعون.كفايه دم كفايه قتل كفايه ذل واهانه وعذاب كفايه كفايه .لقد اصبح القتل هوايه محببه لدي بعض الشعوب تجاه شعوب اخري والحكومات والملوك والامراء قد يتبعوا هذه الهوايه ولكن الحكمه في اتخاذ العقل هدف اساسي في اتخاذ القرار السليم والصائب في الوقت المناسب لكي تصبح الخسائر في الارواح اقل .لقد خلق الله سبحانه وتعالي الانسان ويعلم ما توسوس به نفسه وهو اقرب اليه من حبل الوريد .رسالتي الي الرؤساء والملوك والامراء والي كل دول العالم اتقوا الله في الناس واعدلوا هو اقرب للتقوي وتوكلوا علي الحي اللذي لا يموت.سلام"
