[[comments]]
order = 0
subject = "سعودية بتتزوج مصري... آخر زمان"
author = "كويتية وأفتخر"
posted = "2008-06-24"
text = "هل يصدق أحد بأن سعودية أو خليجية بتتزوج مصري!!!!!!!! حتما هذا لا ولن يحصل وحتى في الأحلام... المصري من وجهة نظر الخليجية نصاب وكذاب وطماع ولا يؤتمن على شئ... فهل تفكر كويتية أو سعودية بالزواج من مصري... آخر زمان يحلم قذر مصري يلمس إصبع خليجية"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

[[comments]]
order = 1
subject = "فاهمين غلط"
author = "سعوديه عانس"
posted = "2008-06-24"
text = "الضاهر يحسبو السعوديات مثل الانجليزيات السائحات في مصر كل وحده تاخذ لها صعيدي ابو 20 سنه وهي عجوز شمطاء ام 60 سنه. لا ياصعايده غلطانين تعنس السعودية ولا يمكن تتزوج لها واحد مهو قد المقام. تصوم تصوم وتفطر على بصله ؟هزلت والله"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

[[comments]]
order = 2
subject = "المصريون لا يقلون احتراما عن اي شعب في العالم، ومص"
author = "فلسطيني"
posted = "2008-06-24"
text = "الى الخليجيون ذوي النفوس المريضة بالعنصرية(ولا اعني الخليجيون اجمالا، فقط المعلقين العنصريين)، عنصريتكم لن تنال من الشقيقة الكبرى مصر وشعبها الكريم، عندما كانت دول الخليج لا تجد قوتها سوى من لبن الماعز والجمال كانت مصر تصدر القطن والملابس الى بريطانيا العظمى، الانسان المصري قادر على العطاء اكثر من كثير من الخليجيين، واذا كانت مصر تعاني من ازمة اقتصادية بسبب الطواغبت الذين تناوبوا على حكمها، فهذا لا يعني النتقاص من شعبها، فكل انسان معرض للمصائب والنكبات، فلا تتطاولوا على اخوانكم بل التزموا بقوله تعالى (انما المؤمنون اخوة)، هذا اذا كنتم مؤمنين حقا، ولو كنتم مؤمنين حقا لما تطاولتم على بعضكم البعض، بينما تطأطئون رؤوسكم امام اعدائكم الذين يسومونكم سوء العذاب، تحيا الشقيقة الكبرى مصر وشعبها العزيز رغما عن انف العنصريين البغيضين."
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

[[comments]]
order = 3
subject = "حلوووووووو"
author = "مصريه حتى اخر يوم في عمري"
posted = "2008-06-24"
text = "انا هخلي خطيبي يتجوز واحده سعوديه الاول ياخد منها فلوسها وبعدين يرجع لي بئا تاني ونعيش مع بعض انا وهو في حب ورمانسيه ونسافر تركيا نتفسح انا وهو ده طبعا كله بعد مايكون خد فلوس السعوديه .. وايه كمان امممم ونعيش انا وهو في قصر وبكده تبئى حياتنا سعيده ومخسرناش حاجه هههههههههه انا اؤيد فكرة زواج المصريين من سعوديات بشده عشان يجيبولنا منهم فلوس هههه عادي يجيبوها ويطلقوهم ماعندناش مشكله"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

[[comments]]
order = 4
subject = "شعب غبي"
author = "حمادة"
posted = "2008-06-24"
text = "شعب غبي وتقدر تضحك عليه بسهولة لا ويقولو احنا دهنا الهواء دوكو وبلطنا البحر وعبينا الشمس في ازايز ولو جلست في ميدان التحرير ومعاك ورق ابيض فاضي وتقول دي عقود عمل في السعودية او الخليج حيدفعو . شعب غبي"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

[[comments]]
order = 5
subject = "ناس مخها مسطح"
author = "مستغرب"
posted = "2008-06-24"
text = "سيدة اعمال او ثرية هتتزوج واحد فقير مقرف على اية<br />الغنى بيدور على الغنية اللى زية<br />والسعودية بتدور على السعودى اللى زيها<br />اية السذاجة قوى دى - الناس دى بتتعاطى حبوب الغباء<br />يبقى حكايىة اللى اشترى الترماى دى صحيحة<br />والا عادات الشعب اتغيرت - وكل واحد عايز يكسب فلوس بالسهل ومن غير ما يشتغل وبالنصب والاستهبال<br />دكاترة علم النفس فين<br />هل الشعب المصرى اصبح مريضا نفسيا حتى يصدق الوهم<br />حسبنا اللة ونعم الوكيل<br />اللة يرحمك يا شعب مصر"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

[[comments]]
order = 6
subject = "الى كويتية وافتخر"
author = "ابومحسن غربة 27 سنه في الامارا"
posted = "2008-06-24"
text = "يا كويتية وافتخر الخليجيات بيتجوزوا من هم اقل من المصريين بيتجوزوا هنود وباكستانيين<br />وبعدين عيب عليكي اللي بتقوليه دا لحسن صدام حسين حي ما ممتش وحيمسك الحكم في العراق تاني ويرجع ياخد الكويت مرة ثانية وتبقوا ناس لاجئين من غير بلد زي ما حصل وجيتوا الامارات<br />خليكي ست كويسه<br />وبعدين الخليجية ما ينفعش تتجوز واحد مصري لان المصري حيطلع عين ابوها وامها حيخليها تمسح وتكنس وتطبخ<br />وطبعا الخليجية ماينفعش معاها الاسلوب دا<br />وكلمة اخيرة الخليجيات ما بقوش زي زمان الخليجيات حالتهم ساءت جدا وللاسف فيه شبكات دعارة خليجيات الان وانا اسف ان انا بقول هذا الكلام ليس من اخلاقي ولكن برد عليكي<br />وايام غزو صدام حسين اول جيش ذهب للحرب هو الجيش المصري"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

[[comments]]
order = 7
subject = "إلى سعودية عانس"
author = "رجال محترم"
posted = "2008-06-24"
text = "أرسل هذا التعليق بواسطة : سعوديه عانس<br />الضاهر يحسبو السعوديات مثل الانجليزيات السائحات في مصر كل وحده تاخذ لها صعيدي ابو 20 سنه وهي عجوز شمطاء ام 60 سنه. لا ياصعايده غلطانين تعنس السعودية ولا يمكن تتزوج لها واحد مهو قد المقام. تصوم تصوم وتفطر على بصله ؟هزلت والله<br />أبلغ عن هذا التعليق<br />يا سعوديه عانس ( بتشوفين اسمكـ بيدل عنكـ ) لا تخلين الدنيا تلهيكي ،الحقين نفسكـ قبل تموتين --- وماتنسي التكيه المصريه الموجوده للحين عندكم ( إسألين جدكـ او جدتك ) لو كانو بيروحون هناكـ في حدا منهم سأل مصري ( كسرة خبز يا مصري ؟ او هلله هلله يا مصري ) ؟؟ اصلكم شحاذين و بعد 25 عام راح يخلص احطياتي نفطكم و بدروا لبن البعير تاني ....<br />انا حبيت ااكد كلامكـ حنا مو قد المقام .......<br />الله يعطيكي الف عافيه يا عنوس"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 8
subject = "السقوط"
author = "أحمد مطر"
posted = "2008-06-25"
text = "الشَّمسُ تُطأطِئُ هامتَها<br />إجلالاً لِسُمُوِّ الشَّمعَهْ!<br />والضِّحكةُ تَركعُ صامِتَهً<br />لِتفُوزَ بِغُفرانِ الدَّمعَهْ!<br />والابداعُ يُغيظُ المَعني<br />إرضاءً لِهُراءِ البِدعَهْ!<br />والطُّهْرُ يُكشِّفُ سَوْءَتَهُ<br />كي لا يُغضِبَ سُوءَ السُّمعَهْ!<br />نَحنُ بَني الزَّمَنِ المُحتالْ<br />أَبطأْنا في كُلِّ مَجالْ.<br />لكنّا حِينَ استدعَتْنا<br />صَيْحاتُ سِياطِ الإذلالْ<br />لَبَّيْنا الدَّعوةَ في الحالْ<br />فَأقَمنا الحَدَّ علي الرِّفعَهْ<br />وَزَفَفْنا الصَّفْحَ إلي الصَّفعَهْ.<br />وَشَرِبْنا مِن دَمِ عِزَّتِنا<br />وَسَكرنا مِن فَرّطِ المُتعَهْ.<br />مِن خَمرةِ كأسِ بطولتِنا<br />لم تبقَ لَنا إلاّ جُرعةْ:<br />بدوائِرِ كُفرٍ وَضَلالْ<br />سَنُقَوِّمُ مِنهاجَ الشِّرعَهْ<br />ليكونَ حَلالاً بِحَلالْ<br />وليستوعِبَ عَصْرَ السُّرعَهْ<br />وَيُباركَنا لو أدَّينا<br />يَومَ السَّبتِ.. صَلاةَ الجُمعَهْ!<br />لَمْ يَخدَعْنا أَحَدٌ.. لكِنْ<br />نحنُ الخادِعُ والمخدوعُ<br />وَنَحنُ الخُدعَهْ!<br />أحمد مطر"
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

