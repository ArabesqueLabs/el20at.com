[[comments]]
order = 17
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2008-07-16"
text = "اولا اخواتى الافاضل احب ان اقول كلنا عرب ولا داعى لهذة الاهانات السخيفة ولا فرق بين مصرى ولا سعودى ولا كويتى ولا عربى مسلم هذا من وجهة نظرى اما من وجهة نظر قلة قليلة من الحاقدين فهذا لا يهم بشيء. وانا اعتز بمصريتى مثل كل انسان يعتز بجنسيتة (وان لم اكن مصريا لوددت ان اكون مصريا).وفى النهاية كلنا وطن واحد وديانة واحدة ولغة واحدة والله المستعان على ما يصفون..."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 18
subject = "كلنا واحد"
author = "نـــــور قـــــطـــــر"
posted = "2008-07-20"
text = "السلام عليكم ورحمة الله وبركاته<br />اخوتي في الله<br />ماله داعي النقاشات الحادة والجدال<br />لان اللي انا اعرفه ان احنا عرب ومسلمين وكلنا واحد<br />وحتى لو تزوج عربي من خليجية او خليجي من عربية ما دام انه اخلاق وادب ما فيها اي مانع يتزوجون<br />لان الخلق والدين اهم من الجنسية<br />اقولها على اساس ان احنا عرب ويد وحدة<br />ما تعتقدون انه سبب كافي ؟<br />والله يوفق الجميع ان شاء الله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 19
subject = "رساله للاخت الخليجية التى تعيب على المصريين"
author = "ايهاب احمد مصري الجنسية وافتخر"
posted = "2008-07-30"
text = "اختى الفاضلة المصري اشرف انسان على وجه الارض ومش محتال ولا نصاب ولا كداب وكفايا انك تتعلمى من تاريخه اذاي تكونى انسانه وسط المجتمعات الراقية وعلى فكرة انا شاب مصري 23 سنة وعمرى ما افكر انى اغلط فى عربي مثلما فعلتى انت لان العرب اخوة ومسلمين"
