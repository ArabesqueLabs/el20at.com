text = "على فكره الغلط وارد فى مثل هذه الموضوعات والسبب ان ليس كل الناس سواء عرب أو غيرهم عاقل وبيننا من هو دون العمر وما هو دون العقل ولا الخبره ولا الإدراك يأخذ امور الدنيا كلها بعباطه لا مصر تستغنى عن السعودية ولا العكس ولا أحد له فضل على أحد ولا أعلى من أحد العبره بالاتقى وهنفضل شعوب متخلفة طالما سنستمر فى التفريق بيننا وأطمنكم دى مش دعوه للاتحاد ولا حاجة لأن سعد زغلول قال ما فى فايده وأوافق بشده على ان العرب جميعهم جرب وبكده يبقى ما فيش مشكلة"
