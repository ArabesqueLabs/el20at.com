subject = "إلى الاخت الاماراتية بنت الامارات الاصيلة"
author = "من ابو محمد المصرى"
posted = "2008-10-29"
text = "إلى الاخت الاماراتية التى شكرت فى المصريين انت اصلك طيب وشعب الامارات شعب مو عنصرى مثل السعودية شعب منفتح متحرر من الافكار الغبية والعنصرية ونحن نحس انكم مسلمين ونحس ان بعض السعوديين من انصار ابو جهل فكرهم هو فكر ابو جهل ودينهم دين ابو جهل ما هم بمسلمين فكر عنصرى بحت يا اخوانا ايه المانع ان يتزوج مسلم من مسلمة<br />انت نتيجة الافكار العنصرية حقكم ان زادت عندكم نسبة العنسوة بشكل كبير غير مسبوق ولكن نقول ايضا ان هناك سعوديين منفتحين مو كل السعوديين عنصريين الله يسامحكم على كل اساءة لمصر مصر العروبة مصر الكرامة مصر العروبة مصر الاسلام مصر التى وقفت بجانبكم فى كل مشاكلكم وستقف وستقف ابدا وابدا الى جانب السعودية لاجل الاسلام اتقوا الله فى بناتكم وفى اسلامكم<br />ابو محمد المصرى"
archived = "2010-03-14"
