[[comments]]
order = 12
subject = "صلب الموضوع"
author = "سعودي منصف"
posted = "2008-06-28"
text = "ياجماعه دخلتوا في دوامه المصريين و السعوديين و نسيتوا المتسبب ( النصاب ) في هذي العملية .<br />السعوديين و المصريين و الشعوب العربيه أخوه في الدين و الدم (\" لو خليت لخربت \"-) .<br />يجب علينا ان نفكر كيف تم النصب بهذه الطريقه العجيبه و الغريبه و انا استبعد كل البعد ان يكون المتسبب عربي دون ذكر الجنسيه ، قد يكون من جهة ترغب بجمع الاموال فقط او من جهة ترغب بإشعال النار بين الجنسيات العربيه ، و كل ما ورد محتمل ، ارجوكم كونوا عقلاء زمانكم و انصفوا بحق اللذين ظلموا .<br />سعودي من نجد ، يكره العنصريه و التفاخر بالجنسيات . و الله الموفق ."
archived = "2008-06-30"
capture_url = "https://web.archive.org/web/20080630045016/http://masr.20at.com:80/newArticle.php?sid=16419"

