text = "انا سعودى وارحب بزواج المصريين من سعوديات كحل لمشكلة العنوسة عندنا وما المانع طالما انه مسلم يعرف حق الزوجة والمسلم لا يظلم وياليت الحكومة السعودية ترحب بذلك وتخرج عن عنصريتها وعن نفسى لو تقدم لبنتى او اختى مصرى ومتدين وعلى خلق ارحب به ولا مانع عندى واحسن من تقعد البنت عانس فى بيت ابيها اتقوا الله فى المسلمين واقول للاخت الكويتية لا تنسى اخوانا المصريين هم اللى دافعوا عنا فى حرب الخليج.<br />ام متعب السعودى"
