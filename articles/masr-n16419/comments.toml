[[comments]]
order = 14
subject = "الى السعوديه العانس والكويتية"
author = "سامح المصرى"
text = "يا أخواتى اتقو االله العرب والمسلمون اخوة<br />وبعدين المصريين اللى بتتكلموا عنهم دول لو موجودين يبقوا قلة<br />لكن انتم نسيتم انكم كلكم ينطبق عليكم حديث النبى المصطفى عليه الصلاة والسلام<br />وسترى الحفاة العراة العالة رعاة الشاة يتطاولون فى البنيان والله صدقت يارسول الله قلت وقولك الحق<br />وبعدين الاخت الكويتية<br />يمكن نسيتى لما سيادة الرئيس صدام حسين صقر العرب عليه رحمة الله دخل الكويت ان الجيش المصرى هو من تصدى له<br />الله يرحمك يا أبو عدى ونسأله أن يسكنك الفردوس الأعلى<br />ياأختى هل جزاء الاحسان الا الاحسان<br />وبعدين دى مشكلة مصر والسعودية ليه تدخلتى يمكن غيرانة ان المصريين عايزين سعوديات وليس كويتيات<br />يااختى للأسف احنا اخوان صدام وكل عراقى ولسنا منكم طالما تعتبرون العراق أعداءكم"
archived = "2008-07-05"
capture_url = "https://web.archive.org/web/20080705212709/http://masr.20at.com:80/newArticle.php?sid=16419"
