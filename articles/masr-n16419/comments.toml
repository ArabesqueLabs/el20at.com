[[comments]]
order = 28
subject = "تظاهرة مصرية ضد مكتب للزواج من سعوديات"
author = "من عباد اله"
posted = "2008-11-25"
text = "بسم الله الرحمن الرحيم<br />((يا أيها الناس اتقوا ربكم الذي خلقكم من نفس واحدة و خلق منها زوجها و بث منهما رجالا كثيرا و نساء و اتقوا الله الذي تساءلون به و الأرحام إن الله كان عليكم رقيبا))<br />((يا أيها الذين آمنوا اتقوا الله و قولوا قولا سديدا, يصلح لكم أعمالكم و يغفر لكم ذنوبكم و من يطع الله و رسوله فقد فاز فوزا عظيما)) صدق الله العظيم<br />التباغض العرقي بين الشعوب الإسلاميه<br />كرم الله أمة محمد صلى الله عليه و سلم و أصطفاها على جميع الأمم السابقه بأنها أخر الأمم , وحدنا على كلمة التوحيد و وحد رسولنا و<br />لغتنا لنكون أفضل الأمم , أخرجنا من الظلمات إلى النور و طهر أنفسنا من الأحقاد و التباغض العرقي الذي كان منتشرا بين شعوب الأمم السابقه .<br />و بفضل الإسلام و تعاليمه و مبادئه الساميه و لمئات السنين حقق المسلمون إنجازات عظيمه في الفتوحات الإسلامية و إنجازات عظيمه في الطب<br />و كافة المجالات التي كان من شأنها أن أرتقت بهم إلى أفضل الدرجات . لقد تحقق لهم ذلك بفضل تكاتفهم على كلمة واحدة هي كلمة<br />التوحيد و وحدة اللغة و الجنس فلم يكن هناك تفرقة بين الأجناس فالكل يعمل تحت راية الإسلام .<br />و لكن بمرور الزمن أنبهرت الشعوب المسلمه بالحضارة و أنشغلت بملذات الحياة ضعف الإيمان بقلبها و فرطت باللغة العربية و تأثرت بلغة<br />مستعمريها , تشتت شملها و ضعفت كلمتها و أنقسمت لأجناس عدة . فبتقسيم الدول المسلمه جغرافيا أصبحت هناك دول و<br />شعوب مختلفة الأجناس مسلم أسيوى ومسلم أفريقى وأخر أُوروبى ....الخ<br />و ليت الأمر توقف عند التقسيم الجغرافي بل تعدى إلى التفرقة العنصرية العرقية بين الشعوب المسلمه .<br />للأسف الشديد و هذا ما دعاني لكتابة هذا الموضوع هو إستسلام الشعوب المسلمه لهذه التفرقة العرقية و التي نجح أعداء الإسلام بزرعها<br />بيننا كمسلمين موحدين بالله و برسوله الكريم عليه أفضل الصلاة و التسليم .<br />و مما يؤسف له حقا أن تجد هناك تباغض عرقي بين الشعوب المسلمه و يظهر ذلك جلياً عند زيارتك لأحد الدول المسلمه فما أسوأه من شعور<br />عندما تُقابل بحذر لأنك ......... و بالإزدراء لأنك ........أو بالسخريه لأنك ....... و بالبنفور لأنك ....... و بالإحتقار لأن جنسيتك كذا و كذا .<br />و مما يدمي له القلب أن تُعامل معاملة الغريب و تسمع من يلمزك بالقول السيء من ورائك , ترى بعينيك إشارات الحذر من التعامل معك لأنك<br />من دولة كذا و كذا , ناهيك عما يُعانيه بعض أفراد الشعوب المسلمه من سوء معاملة عند سفرهم للعمل بالدول المسلمه .<br />و لا يقتصر التباغض و التفرقة العرقية بين الشعوب بعضها البعض و لكنه يمتد ليصل فيما بين أفراد الدولة المسلمه الواحده , فأهل الشمال<br />يحقُرون من شأن أهل الجنوب و أهل الشرق ينبذون أهل الغرب و كلٌ منهم يعتز بقوميه أو بطوله خاصه و يحقِر من شأن الأخرين .<br />بالله عليكم أيها الأعضاء الأفاضل من أوصلنا إلى هذا الحال المزري من التفرقه العرقيه في كافة المجالات السياسية الإجتماعية و الإنسانية ؟<br />لماذا تتباغض الشعوب المسلمه فيما بينها ؟<br />برأيك من المسؤول عن هذه التفرقة العرقية العنصرية بين الشعوب المسلمه ؟<br />ما دورك أنت أيها العضو الكريم إزاء هذا التنافر العرقي ؟<br />ما أسباب التناحر العرقي بين الشعوب المسلمه ؟<br />هل للحكومات الإسلاميه دور بذلك ؟<br />لماذا تشعر بعض الشعوب الإسلاميه بالإعتزاز بالنفس و الكبرياء و تحقر من شأن الشعوب الأخرى ؟<br />لماذا تلجأ بعض الشعوب الإسلاميه إلى إلقاء اللوم على أفراد الشعوب الأخرى و تأخذها بذنب مواقف حكوماتها من القضايا السياسية ؟<br />هل الشعب مسؤول عن قرارات حكومته و عليه أن يدفع الثمن من سمعته و شعبيته بين الشعوب الأخرى ؟<br />لماذا تُعمم الشعوب الإسلاميه حكمها على كافة أفراد شعبٍ ما بسبب موقف مخزي معين من أحد أفراد ذلك الشعب؟<br />أخواني الأعضاء الكرام أتمنى أن تفيدونا بردودكم و بأرائكم بكل صراحة و موضوعية علَها<br />تساعد على حل هذه المشكلة فقد باتت مشكلتنا جميعا فلا يوجد منا من لا يعاني من التفرقة العرقية العنصرية .<br />وختامآ حديث الرسول عليه الصلاة والسلام<br />عن أبي هريرة رضي الله عنه ، قال : قال رسول الله صلي الله عليه وسلم : ( لا تحاسدوا ، ولا تناجشوا ، ولا تباغضوا ، ولا تدابروا ، ولا يبع بعضكم على بيع بعض ، وكونوا عباد الله إخوانا ، المسلم أخو المسلم ، لا يظلمه ولا يخذله ، ولا يكذبه ، ولا يحقره ، التقوى ها هنا ) ويشير صلى الله عليه وسلم إلى صدره ثلاث مرات – ( بحسب امرىء أن يحقر أخاه المسلم ، كل المسلم على المسلم حرام : دمه وماله وعرضه ).<br />رواه مسلم [ رقم : 2564 ].<br />والله أعلم"
archived = "2010-03-14"
