subject = "شرف لاى سعودية تتزوج من مصرى"
author = "خالد باشا"
posted = "2008-10-29"
text = "نقول لك عنصرى سعودى أو خليجى انه لشرف لاى سعودية او خليجية ان تتزوج مصرى انتم فاكرين نفسكم فوق الناس وانتم اجط واقذر ناس فى العالم انتم مثل الحيوانات تخيل فتاة سعودية على النت تقول لى ابى محارم فقلت لها يعنى ايه تبى محارم قالت لى ابى انام مع محرم لى فقلت لها وهل سويت هذا من قبل قالت سويت هذا مع ابنى اخى ابن اخى ينام معى تخيل مدى الحقارة اللى وصلتم لها وانشاء الله امريكا سلطها الله عليكم حتى تنهى اقتصادكم وترجوا رعاة غنم ولا تنسوا المصريين اللى كانوا يصرفون عليكم من بيت التكية المصرية مصر فضلها عليكم يا كلاب"
