[[comments]]
order = 10
subject = "أرحموا أنفسكم وشعوبكم"
author = "من السعودية"
posted = "2008-06-26"
text = "أنا أعرف سعوديات متزوجات من مصريين ، وجنسيات أخرى .. فلسطينيين وأمريكان وأستراليين وغيرهم ، نعم بعض العوائل ما عندهم مانع ، لكن عيب جدا التعليقات اللي ما تنفع أحد إطلاقا ، ولا تدل إلا على أخلاق صاحبها ، بالتأكيد من يفكر ويتكلم ويقبل يعرض ( أفكاره الخاصة ) بهذا الشكل ، يسمح لي ‘نسان لا يتمتع برقي ، بل وعنصري وضيق الأفق .. ودمتم .."
archived = "2008-06-26"
capture_url = "https://web.archive.org/web/20080626151106/http://masr.20at.com:80/newArticle.php?sid=16419"

