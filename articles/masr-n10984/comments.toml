[[comments]]
order = 0
subject = "الدنيالو جارحة..لونها لون فرحة .. ماهو إيه بيطول عمر الواحد غير الفرحة"
author = "محمد السيد"
text = "للقلب أحزانه الخاصة ... وأفراحه ...<br />ومايشعرنا بطعم الفرحة ... هي أحزاننا العديدة ....<br />أحيانا نحتاج إلي هذا الحزن .. إلي هذا الأسي ... نحتاج إلي بعض من قسوة الزمن ... وهجران الحبيب ...<br />وما بين الحبيب الغائب والفقيد الغالي .... يمتد الألم والحزن بداخلنا ....<br />ومن بين هذا كله تتولد الفرحة ....<br />قالوا .. للفرحة لذة لا يستشعرها إلا من اشتد عليه الحزن ...<br />وعلي قدر أحزان القلب .... تأتي الأفراح ....<br />تحياتي ودعواتي .....<br />ويارب مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري \"لا جدوي لهذه الكلمة .. فالمشكلة أكبر وأعظم\"<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي<br />مدونة مش حاسكت ...<br />http://mesh7askot.blogspot.com/"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120332/http://masr.20at.com:80/newArticle.php?sid=10984"

[[comments]]
order = 1
subject = "عيش وقتك عيش ايامك ..النيا براح قدامك و الضحكه تهون اى جراح"
author = "نيفين نيفى نوفا"
text = "الله يا هوارى الموضوع روعه<br />و الله يا محمد السيد تعليقك لا يقل روعه عن الموضوع<br />بالنسبه ليا لو عشت مليون سنه حزن عمرى ما هبدل قلبى ابدا و لا فضيه من الذكريات اللى فيه مهما كانت محزنه و قاسيه<br />ان انسانا بلا ماضى فهو انسان بلا حاضر او مستقبل<br />بالاضافه الى ان ما سبق من خبرات يشكل ما سياتى ف حيواتنا و من تجاربنا السابقه بنتعلم وعلى راى عمنا نزار ان الانسان بلاحزن ذكرى انسان<br />و ده معنى فلسفى كبير لان فعلا من قلب الحزن بتاتى لذه غريبه لا تقل ف جمالها عن اجمل لحظات الفرح و دى اللى بتعمل الشخص الرومانسى لان الشخص الرومانسى مش هو العاطفى ده اعتقاد خاطىء لان الرومانسيه هى المود المتقلب المائل الى الحزن و بنسميها ف الادب الانجليزى melancoly"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016120332/http://masr.20at.com:80/newArticle.php?sid=10984"
