subject = "صورة توت عنخ امون وصورة المومياء"
author = "مرشد سياحى"
posted = "2008-05-09"
text = "دى صورة مومياء شبة متحنطة بتبص ببلاهة<br />انت عارف الحاجات اللى بتتحرك بالريموت<br />وتعرف ان جدو الحاج عمر عندة 65 سنة وبيعملها على نفسة ومعندوش تحكم فى الاعصاب بتاع الاخراج مع انة كان رياضى سابق<br />عايز تقولى ان الموميا اللى فى الصورة دى بيعيش حياة طبيعية - مش معقول<br />دا عايش على الاجهزة الصناعية وادوية الاعصاب التى بتخلية يقدر يقف ويمشى خطوتين يروح ينام بعدها يومين<br />يا جماعة الخير<br />الرسول بيقول<br />اكرام الميت دفنة<br />محمد على حاكم مصر زمان عاش لغاية 70 سنة وبعد كدة مخة خرف وبقى يقول كلام مش موزون"
archived = "2010-03-14"
capture_url = ""

