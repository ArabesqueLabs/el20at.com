subject = "عاوزين جمال يبقى رئيس للشركة"
author = "نانسى"
posted = "2008-05-19"
text = "جمال حيخلف ابوة فى رئاسة مجلس ادارة شركة مصر القابضة جمهورية مصر سابقا وطبعا اعضاء مجلس الادارة والمديرين التنفيذيين والمتنفذين من رجال الاعمال المرتبطين والمشاركين مع رئيس مجلس الادارة فى الارباح وبقية الموظفين والعمال والفلاحين اللى هما الشعب بيشتغل لمصلحة الشركة بالخسارة مع ان الشركة كسبانة وبتقسم ارباح على الكبار بس واللى مش عاجبة يشوف لة شركة تانية لان شركة مصر عندها تمانين مليون موظف فى خدمة الاب الروحى للشركة بمناسبة بلوغة التمانين وعقبال المية بعدالتمانين لما نشوف اخرتها معاكم"
archived = "2010-03-14"
capture_url = ""
