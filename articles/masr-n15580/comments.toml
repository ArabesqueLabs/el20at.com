subject = "دة مش اسمة اسامة سرايا -- دة اسمة خدام السرايا"
author = "iu"
text = "دة كلام يجيب الغثيان<br />دة واحد جوفة عفش زى الحمار اللى عندة اسهال<br />هذة تدل على وضاعة نفسة البشرية<br />جاموس ابيض لا يملك ذزة واحدة من الكرامة"
archived = "2008-05-08"
capture_url = "https://web.archive.org/web/20080508145013/http://masr.20at.com:80/newArticle.php?sid=15580"

