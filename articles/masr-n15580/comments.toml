[[comments]]
order = 0
subject = "الصورة فعلا مبينه سنه"
author = "الصورة فعلا مبينه سنه"
text = "اجمل حاجة فى المقال ان الحمد لله اختار صورة حقيقة تعبر عن سن جدو مبارك لان كل الصور اللى منشورة فى كل الجرائد الحكومية و طبعا المكالتب الحكومية اخذت له و علقت بعدما انهى الطلعة الجوية و تم عبور القناة على فكرة انا بجد بحب سن الثمانين اوي اعتقد انه سن الحنيه و سن اللا رغبه في اي شيء الا الحصول على حب اللى حوليه مش عارفة ليه جدو مبارك فى اخر ايامك لسه بتفكر في الكرسي لابك و راحت فين حنيه الثمانينات بجد شعبك محتجلها اويييييييييييي"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 1
subject = "مصر شابت وعابت"
author = "emad hamdy"
text = "والله خسارة فيك الكلام روح ربنا يعطيك طول العمر ونشوفك مثل صديق عمرك شارون"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 2
subject = "يا رب يتنازل لابنه يا رب"
author = "مش شريف الدواخلي ولا مدير الموقع"
text = "والله العظيم تلاته لو يجي جمال مبارك احسن الف مرة من هذا الوضع<br />ياريس اتنازل لابنك يا ريس على الاقل لسه شاب وعنده 43 سنه واداءه حيكون افضل كتير من ادائك يا ريس<br />ما تخفش يا ريس احنا موافقين بالتلاته"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 3
subject = "واذا كان مولود غبى يا هوارى نعمل اية ؟"
author = "مصرى"
text = "هو كبر السن هو اللى خلاة معتوة<br />لا يا هوارى<br />دا فية حكمة طبية بتقول<br />يولد الانسان غبيا ويموت كذلك<br />هتقول اية بقى<br />من النوم على الفرن فى كفر مصيلحة وسط البراغيت للنوم فى قصر العروبة على سرير الملكة فريدة<br />نصيب"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 4
subject = "نفس كلام قتلة عثمان يا هواري"
author = "مش احمد عرابي"
text = "80 سنه<br />سيدنا عثمان عنده ثمانين سنه رضي الله عنه وقتلوه<br />تتصور سيدنا عثمان ذو النورين يتهم ويقتل يا هواري<br />اتق الله يا هواري"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 5
subject = "طيب ما هو المرشد العام عنده 80 سنه"
text = "طيب ما المرشد العام راجل عجوز وعنده 80 سنه ولسه قاعد مكانه وبيدير جماعة قوية ليها فروع في 70 دولة<br />ايه المشكلة"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 6
subject = "ولا حتى المرشد"
author = "احب الاخوان ولست منهم"
text = "ولا حتى المرشد ينفع بعد سن الثمانين والدليل رفضة المشاركة فى اضراب ابريل لانة كان فية ناس تانى غير الاخوان والباشا حب يعمل اضراب لوحدة ودى النتيجة خرج عن صف المعارضة علشان يكون فى الصورة لوحدة ولو تحقق مكسب يكون للاخوان بس... المرشد بعد هذا العمر بيعمل لمصلحة الجماعة وليس لمصلحة مصر ويا الف خسارة وطول ما انت لوحدك ابقى قابلنى لو مصلحة وطنية اتحققت"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 7
subject = "مصر وللاده"
author = "المصرى أفندى"
text = "والله أنا مش عارف الشعب ده متخدر وألا فى حالة غيبوبة. واحد ياجماعه بيحكم أو يمكن مش موجود أصلا محدش حاسس بيه. واحد مش مركز حتى لما بيتكلم مع الصحفيين عاوز أكون مؤدب ولا أقول غبى حتى لما بيخاطب شعبه اللى متحمله هو وأهله. اللى بيجننى هم هؤلاء اللى بيقنعونا أن أحنا أخترناه. أمتى ؟ فكرونا طيب؟ طب بأمارة أيه؟ ياجماعة حسنى مبارك بالنسبة لمصر هو السحابة السودا, لو راحت حنشوف مصر تانية خالص , حتى لو سيبنا كرسيه فاضى زى لبنان لأنه كارثة حقيقية. وسدقونى كل اللى بيمدحوا فيه اليوم وبيغنوله هم جمعية المنتفعين من سوء الأوضاع فى مصر ودخولهم بالملايين بطرق غير شرعية."
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
