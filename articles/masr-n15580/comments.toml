[[comments]]
order = 2
subject = "يا رب يتنازل لابنه يا رب"
author = "مش شريف الدواخلي ولا مدير المو"
posted = "2008-05-04"
text = "والله العظيم تلاته لو يجي جمال مبارك احسن الف مرة من هذا الوضع<br />ياريس اتنازل لابنك يا ريس على الاقل لسه شاب وعنده 43 سنه واداءه حيكون افضل كتير من ادائك يا ريس<br />ما تخفش يا ريس احنا موافقين بالتلاته"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 3
subject = "واذا كان مولود غبى يا هوارى نعمل اية ؟"
author = "مصرى"
posted = "2008-05-04"
text = "هو كبر السن هو اللى خلاة معتوة<br />لا يا هوارى<br />دا فية حكمة طبية بتقول<br />يولد الانسان غبيا ويموت كذلك<br />هتقول اية بقى<br />من النوم على الفرن فى كفر مصيلحة وسط البراغيت للنوم فى قصر العروبة على سرير الملكة فريدة<br />نصيب"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

