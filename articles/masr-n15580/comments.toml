[[comments]]
order = 0
subject = "الصورة فعلا مبينه سنه"
author = "الصورة فعلا مبينه سنه"
posted = "2008-05-04"
text = "اجمل حاجة فى المقال ان الحمد لله اختار صورة حقيقة تعبر عن سن جدو مبارك لان كل الصور اللى منشورة فى كل الجرائد الحكومية و طبعا المكالتب الحكومية اخذت له و علقت بعدما انهى الطلعة الجوية و تم عبور القناة على فكرة انا بجد بحب سن الثمانين اوي اعتقد انه سن الحنيه و سن اللا رغبه في اي شيء الا الحصول على حب اللى حوليه مش عارفة ليه جدو مبارك فى اخر ايامك لسه بتفكر في الكرسي لابك و راحت فين حنيه الثمانينات بجد شعبك محتجلها اويييييييييييي"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

