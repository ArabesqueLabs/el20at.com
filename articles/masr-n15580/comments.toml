[[comments]]
order = 6
subject = "ولا حتى المرشد"
author = "احب الاخوان ولست منهم"
posted = "2008-05-05"
text = "ولا حتى المرشد ينفع بعد سن الثمانين والدليل رفضة المشاركة فى اضراب ابريل لانة كان فية ناس تانى غير الاخوان والباشا حب يعمل اضراب لوحدة ودى النتيجة خرج عن صف المعارضة علشان يكون فى الصورة لوحدة ولو تحقق مكسب يكون للاخوان بس... المرشد بعد هذا العمر بيعمل لمصلحة الجماعة وليس لمصلحة مصر ويا الف خسارة وطول ما انت لوحدك ابقى قابلنى لو مصلحة وطنية اتحققت"
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

[[comments]]
order = 7
subject = "مصر وللاده"
author = "المصرى أفندى"
posted = "2008-05-05"
text = "والله أنا مش عارف الشعب ده متخدر وألا فى حالة غيبوبة. واحد ياجماعه بيحكم أو يمكن مش موجود أصلا محدش حاسس بيه. واحد مش مركز حتى لما بيتكلم مع الصحفيين عاوز أكون مؤدب ولا أقول غبى حتى لما بيخاطب شعبه اللى متحمله هو وأهله. اللى بيجننى هم هؤلاء اللى بيقنعونا أن أحنا أخترناه. أمتى ؟ فكرونا طيب؟ طب بأمارة أيه؟ ياجماعة حسنى مبارك بالنسبة لمصر هو السحابة السودا, لو راحت حنشوف مصر تانية خالص , حتى لو سيبنا كرسيه فاضى زى لبنان لأنه كارثة حقيقية. وسدقونى كل اللى بيمدحوا فيه اليوم وبيغنوله هم جمعية المنتفعين من سوء الأوضاع فى مصر ودخولهم بالملايين بطرق غير شرعية."
archived = "2008-05-06"
capture_url = "https://web.archive.org/web/20080506113857/http://masr.20at.com:80/newArticle.php?sid=15580"

