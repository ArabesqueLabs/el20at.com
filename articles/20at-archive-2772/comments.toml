subject = "التعدد ام الزنا"
author = "رجل يؤمن بالتعدد"
text = "التعدد مهما كانت اسبابه هو حق من الله اعطاه للرجل وكل رجل وله ظروفه التى تضطره للزواج بأكثر من زوجة ولكن العيب فى مجتمعنا ان المرأه انانية تريد الاستحواذ على الرجل بدون ان تراعى الفرق بين احتياجات الرجل والمراه هناك من النساء من تدعو الله على زوجها بان يجيها خبره ولا يجيها خبر زواجه او انه لا مانع لزوجها ان يلعب بذيله كما يريد بشرط ان لا يتزوج عليها . يا اختى يامن تنكرى حق الرجل فى الزواج من اربعه وليس اثنان فقط هذا حق شرعه الله ولعنة الله على من تنكره وتمنع زوجها من الزواج من اخرى لمجرد انانيتها ورغبتها فى تملك الرجل وما يملكه , وانا هنا اتحدث عن الرجل السوى الذى يراعى الله فى اهله وليس عن العقول المريضه للرجال والسيدات على حد سواء , المطلقة للضرر من زوجها لزواجه من اخرى هل ستبرر الضرر امام الله بأن الضرر من الله لأنه شرع التعدد وان الرجل مارس هذا الحق ؟ أم ان النساء الآن تريد ان تفعل مثل الامريكان فى مقولة عضو الكونجرس الشهيرة \" لقد اتينا لنصلح خطأ الرب بجعله البترول فى ارض العرب \" هل ستصلحون تشريع الله يا نساء المسلمين ام ستتبعون خطا المدافعين عن حرية المراه فى ان تتعرى ليستمتع بها كل من هو فى قلبه مرض ,<br />اللهم إجعل كل من تعارض شرعك ان تتذوقه لتعرف لما شرعته<br />حسبنا الله ونعم الوكيل<br />إتقوا الله قبل ان تعارضوا ما شرعه"
