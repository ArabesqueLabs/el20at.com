subject = "لماذا هذا الربط؟"
author = "هدى"
text = "الموضوع حلو وجميل وخاصة أنه طارح آراء البنات بس للآسف هو طارح النماذج الغير ناجحة فقط، فهناك نماذج من التعدد ناجحة..أكيد بيحصل مشاكل بسبب التعدد وزي ما في مشاكل بين الزوج والزوجة من غير تعدد من البديهي يكون في مشاكل في التعدد..انما ربط العنوسة مع الزواج الثاني وفشله ده تحيز غير مقبول.. ربنا سبحانه وتعالى شرع التعدد وانا مش عارفة لو جوزي أجوز عليا ممكن اعمل ايه وممكن أعيش أزاي؟وحاجة مؤرقة جدا جدا وببقى خايفة جدا ... بس في النهاية هو تشريع من ربنا وانا يمكن ببصله من ووجهة نظر واحدة وهو_أنا_ انما ربنا سبحانه وتعالى نظر لحال الأمه جميعا..<br />فعلا في عنوسة وفي فقر وفي مشاكل كثيرة تعوق الزواج..أحد هذه الحلول هو التعدد ولكن الثقافة التي تربينا بها ترفض ذلك.. حالات البنات اللي فاتت هو سوء اختيار..وليس بسبب كونهن الزوجة الثانية.."
