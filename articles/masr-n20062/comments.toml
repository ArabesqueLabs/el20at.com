[[comments]]
order = 16
subject = "الى الامام يا ايمن نور - كل الشعب المصرى من حدود السودان الى مطروح الى رفح ورائك"
text = "دوس يا ايمن على عملاء اسرائيل<br />عايزين مصر تنضف<br />مش عايزين بهايم<br />سير يا ايمن سير<br />وعلى الخفافيش ان تدخل الجحور<br />الاوامر جاتهم من اوباما - افرج عن يا ايمن ياولد - فتم الافراج عنك فورا<br />سيارة السجن تاخذك من السجن للبيت مباشرة<br />عملوا كدة مع مين قبل كدة<br />مين المسجون اللى اوصلتة عربة السجن الى البيت فى تاريخ السجون المصرية<br />الجبن سيد الاخلاق<br />بركاتك يا اوباما"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"

[[comments]]
order = 17
subject = "مفاجأة فى القبض على ايمن نور ومفاجأة فى الافراج عنة"
text = "هل هناك علاقة بين صدور قرور من المحكمة الدولية لمحاكمة البشير بتاع السودان والافراج عن ايمن نور<br />ربما<br />لية<br />ايمن نور اتهم زورا بتزوير توكيلات اعضاء لعمل الحزب واهم توكيل مزور هو توكيل منة لية اى توكيل ايمن نور لنفسة مزور وهكذا يزعمون وتم حبسة<br />بينما النظام الحاكم يزور الانتخابات والتزوير واضح على اشرطة الفيديو على مواقع اليو تيوب بالصوت والصورة وتسجيلات تعذيب وضرب المواطنين موجودة فى كل مكان على الانترنت<br />هل يمكن جر رؤوس النظام الى محكمة الجنايات الدولية مثل البشير<br />محكمة الحريرى ايضا جاهزة<br />ومحكمة البشير ايضا جاهزة<br />هل سيتم الافراج عن معتقلى الاخوان امثال عاطف الشاطر بتوع المحاكم العسكرية ام ماذا ؟<br />هناك مفاجات<br />كيف رفضت محكمة القضاء الادارى مرتين الافراج عن ايمن نور لاسباب صحية - ثم يتم الافراج عنة هكذا فجأة<br />هناك حاجة ما ستنكشف<br />سننتظر لنرى"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"
