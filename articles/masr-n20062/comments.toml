[[comments]]
order = 1
subject = "حمد الله على سلامتك ياأبن مصر"
author = "المصرى أفندى"
text = "طبعا جوقة الحزن الوطنى شغلت أسطوانة شكر الرئيس الأنسان اللى قلبه حن على أيمن نور. دا حتى فى عز مرض أيمن نور لم يرف جفن هذا النظام ولم يرحم أيمن نور وكانوا بينقلوه المستشفى فى عربية لحمة مش فى أسعاف. ياجماعة أحنا لسنا شعب من الأغبياء. والله بنفهم والبنى أدم اللى حتى عنده نسبة ذكاء بسيطة فاهم أن حسنى مبارك لن يهوب ناحية أمريكا بدون الأفراج عن أيمن نور والعفو عن سعد الدين أبراهيم . والكلام ده قيل لأبو الغيط لما راح هناك يتسول لأوباما. والكلام ده ذكرته صحيفة الواشنطن بوست. فالجاء رحمة بأعصابنا يا فرقة الجوع الكافر بتاعة حزب الخراب الوطنى. وأتوقع وهاتشوفوا ستركز هذه الفرقة على الهجوم على أيمن نور ببشاعة فى الفترة القادمة... وعلى فكرة كلمة الأفراج الصحى هى علشان يبينوا للناس أن ده راجل صحته تعبانة مش زى رئيسنا الشاب اللى صحته زى البمب واللى بيلعب أسكواش خمس مرات فى اليوم..!!! أخيرا أقول أن سألت عن التزوير أسأل عن اللى زور الأنتخابات على مر السنين واللى نهب خيرات البلد وخلاها على الحديدة (مش الغلبان أيمن نور) مش كده وألا أيه ...!!!"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"

