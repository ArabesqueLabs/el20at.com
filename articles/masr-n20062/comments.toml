[[comments]]
order = 3
subject = "انت فين يا نور -------- عشنا وشفنا تنمية اكثر القرى فقرا بعمل مراكز للمساج فى القرية وفتح مدرسة تمريض"
text = "السياسى اللى عندة 5 % عقل وبيفهم لا يستفز الناس<br />مش معقول يبقى واحد جاى يقول لك اننا نفتح مدرسة تمريض فى قرية فى الصعيد علشان نزيل الفقر<br />وكان القرية ناقصة مراكز مساج للصعايدة وناس تضرب لهم ابر - يا حلاوة<br />الناس عايزة فرص عمل حقيقية - عايزة تشتغل فى مزارع ومصانع وتنتج وتقبض مرتبات وتفتح بيوت<br />انت كنت فين يا ايمن<br />احنا كنا بنعانى من التخلف والزهايمر<br />عايزين 100 سياسى زى ايمن نور بيعرفوا يتكلموا ويفكروا"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"

