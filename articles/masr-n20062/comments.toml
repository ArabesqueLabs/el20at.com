[[comments]]
order = 8
subject = "رد على المسمي نفسه مفتاح البتانونى"
author = "مش ححبك"
text = "انت بتقول في تعليقك<br />أنا لا أتمنى لأيمن نور أن يرشح نفسه للرئاسة لأن هذا الشعب لا يستحق أن يعانى أى مناضل من أجله .شعب لا يهمه غير الأكل والخلفة والكلام الكتير.<br />يا حمار ايمن نور يناضل من اجل نفسه ومن اجل مصلحته الشخصية فاهم يا حمار لا احد يناضل من اجل احد كل واحد عايز مصلحته<br />ما هو ايمن نور دا ما تفهمش طلع منين ولا عايز ايه<br />عايز يخرج من حالة الفقر اللي هو فيها<br />عايش يعيش ويشوف الدنيا من فوق<br />بيحلم انه يبقى فوق والناس كلها تحت<br />اي سياسي لازم يتكلم عن الشعب ويبقى زعلان على الشعب وبعد كده بيدوس على الشعب وبينهب مال الشعب وبيهتك عرض الشعب<br />الشعب بيحب الخلفة بيحب الاكل الكتير دا مش شغل ميتين امك ولا شغل ميتين ام ايمن نور<br />قول لايمن نور الحرامي ولا المحامي<br />عيب لما المحامي يزور علشان خاطر يبقى رئيس حزب<br />واحنا مش عايزين الحكم يتغير<br />مش عايزين واحد يجي يجيب حرامية جداد يسرق من اول وجديد"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"

[[comments]]
order = 9
subject = "بصو في الصورة كويس"
author = "مش حخاف"
text = "ايمن نور الرئيس اللي حينهب مصر من اول وجديد<br />وجنبه السيدة جيهان السادات ولا سوزان مبارك ولا معرفش اسمهاحيكون ايه وطبعا العيلة بتاعتها كلها حتسرق<br />الولدين الحلوين دول هما دول جمال مبارك ولا جمال ايمن نور وعلاء مبارك ولا علاء ايمن نور<br />حيعيدوا كرة السرقة والنهب في البلد من اول وجديد<br />مش عايزين نغير الحكم بالله<br />وبعدين لما الحاكم الجديد يطلع حرامي نبدأ في مرحلة جهاد من جديد لازاحته<br />وبعدين يجي واحد حرامي تاني<br />وحياة والدتك انت وهو مش عايزين نغير الحكم<br />وانا حطلق حملة على النت اسمها حملة مش عايزن نغير الحكم مش عايزين حرامي جديد وححط صورة ايمن نور"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"

