[[comments]]
order = 5
subject = "الى المحاور (الاسوانى)مع تحياتى و احترامى"
author = "ممدوح زكى زخارى جرجس_الاسكندرية-مصر"
text = "عزيزى (الاسوانى)<br />الحمد للة انا ما زلت على قيد الحياة و الحمد للة كثيرا<br />طيب تقدر تقولى لية/ ايمن نور طلع من السجن هذة الايام؟<br />قبل زيارة السيد/ الرئيس الى الولايات المتحدة الاميريكية فى أبريل القادم؟<br />اللعبة القديمة مكشوفة و بلاش نضحك على انفسنا؟<br />و على فكرة لا و لن توجد اية قوة على و جهة الارض تستطيع ان تخرجنا من (مصرنا)رغم انفنا!!!<br />نحن على قلوبكم و رؤسكم الى يوم (الدين)(و حتى قيام(الساعة)<br />و رغم اختلافى مع السيد/أيمن نور الا اننى اهنئة و اقول لة (كفارة)يابن نور؟ نورت بيتك<br />و اللة معك و وفقك لما فية خدمة (مصرنا)جميعا دون تفرقة و دون حقد و دون كراهية و دون تزوير اية حقائق؟<br />و على فكرة انا كنمت عضو فى الحزب الوطنى الديمقراطى بالاسكندرية و انشققت علية؟<br />تعرف لية؟؟؟ علشان انا و جدت الحزب الوطنى ملئى بالنصابين و المنافقين؟<br />و لا يشرفنى ان أكون عضو بالحزب الوطنى؟<br />و ايضا لا و لن انضم لحزب ايمن نور أيضا؟تعرف لية؟؟؟<br />لان السياسة فى مصر أصبحت لعبة المنافقين و الافاقين و اللصوصض و المزورين<br />(موش كدة و لا اية!!!)<br />و على فكرة انا مبدئى هو (الولاء لمصر و للسلطة و الشرعية و النظام)<br />يعنى و لائى لرئيس الجمهورية و ليس لايمن نور؟<br />و حمدا للة على سلامة ايمن نور و تحياتى لة رغم اختلاف و جهات النظر بيننا!!!<br />(الاختلاف فى الراى لا يخلف للود قضية؟<br />موش كدة و لا أية يأسوانى يابن بلدى أسوان"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"

[[comments]]
order = 6
subject = "حمد على السلامة ياأيمن"
author = "مفتاح البتانونى"
text = "أعتقد أن الهدف الحقيقى للأفراج عن أيمن نور هو تجميل صورة مبارك تمهيدا لزيارته للولايات المتحدة الأمريكية فى يونيو القادم بهدف تخفيف الضغوط عليه من قبيل الرئيس الأمريكى الجديد. وكذلك الأحتقان الداخلى والأضرابات التى جعلت حسنى مبارك فى حالة من التوتر والتى جعلته يعقد أجتماعا طارئا بدون وجود نظيف لحل مشكلة الأضرابات بسرعة. أنا لا أتمنى لأيمن نور أن يرشح نفسه للرئاسة لأن هذا الشعب لا يستحق أن يعانى أى مناضل من أجله .شعب لا يهمه غير الأكل والخلفة والكلام الكتير."
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"

