[[comments]]
order = 11
subject = "الكلاب صحيت"
author = "المصرى أفندى"
text = "الظاهر أن كلاب الحزن الوطنى صحيت ياجماعة. زى ماتوقعنا الكلاب بدأت تنبح على أيمن نور علشان الناس فرحت بالأفراج عنه من سجن الأحتلال . حيهاجموه كما هاجموه قبل كده ولم يهزوه. الغريب أن اللى أفسدوا البلد ونهبوها بيتهموا أسيادهم الشرفاء أنهم حرامية( أن لم تستحى فأفعل ما شئت صحيح) الحرامية والبلطجية والمسجلين خطر وقتالين القتلة والمرتشين والقوادين كلهم مسجلين أعضاء فى حزب الخراب الوطنى. مش كده والا أيه ...!!!!!"
archived = "2009-02-23"
capture_url = "https://web.archive.org/web/20090223083129/http://masr.20at.com:80/newArticle.php?sid=20062"

