[[comments]]
order = 6
subject = "حكومة عسكرية خالصة 100% هى الحل من اجل مصر و استقر"
author = "ممدوح زكى زخارى"
posted = "2008-08-03"
text = "الحل بستط جدا جدا جدا؟<br />تشكيل حكومة عسكرية خالصة 100%<br />يراسها كلا من السادة<br />1-السيد المشير /حسين طنطاوى و زير الدفاع<br />2-السيد اللواء/حبيب العادلى و زير الداخلية<br />اقسم باللة العظيم انهم لديهم القدرة الحقة على اخراج مصر من مشاكلها<br />لديهم من الحسم و العزم على مواجهة المشاكل بالعقلانية و الخبرة و ؟؟؟؟؟<br />الديمقراطية مرض الشعوب الضعيفة اما الحسم و العزم فهما الطريق القويم و المختصر الى رفاهية الشعوب<br />و لتكن تجربة الصين خير مثال للتجربة الحقة بدلا من و زارات الشعارات الفارغة حتى من اى مضمون<br />و ليكن شعار الحكومة القادمة (الحسنة تخص و السيئة تعم)<br />و ليسامحك اللة يا دكتور /أحمد نظيف أنك نظيف جدا كالماء و الهواء (لا لون لك؟ و لا طعم لك ايضا؟؟ و لا حتى لك اية رائحة؟؟؟ أيضا أيضا أيضا؟)"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "عم نظيف وحركاته القرعة والمكشوفة"
author = "مش لازم"
posted = "2008-08-03"
text = "عم نظيف بأه اول ما جه عملنا حركات قرعة ودخل شمال في اصلاح البنوك وبدأ عملية دمج البنوك لان البنوك الكتيرة اوي دي مبوظة الاقتصاد<br />طيب يا عم نظيف حاضر دمجنا البنوك والناس فرحت وكانت الارباح 10% والناس انتظرت بعد الاصلاح ودمج البنوك تبقى 12 % ولا حاجه<br />ام فوجئنا بأن السيد نظيف نزل الارباح الى 6%<br />وطبعا انتو عارفين ان هناك قطاعات كبيرة من الناس حاطه مبالغ في البنوك وعايشة على الارباح الشهرية يعني الالف جنيه بتجيب 10 جنيه في الشهر<br />يعني واحد حاطط 10 الاف جنيه بياخد منهم 100 جنيه في الشهر واهي النواية بتسند الزير<br />فوجئنا بأن 100 جنيه اصبحوا 60 جنيه<br />منك لله يا نظيف اشوف فيك يوم<br />هو دا الاصلاح"
archived = "2010-03-14"
capture_url = ""
