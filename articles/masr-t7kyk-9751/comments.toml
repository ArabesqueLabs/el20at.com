[[comments]]
order = 2
subject = "موعد جديد بمحكمة المنصورة للدفاع عن الحريات حافظ ا"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-07-31"
text = "موعد جديد بمحكمة المنصورة للدفاع عن الحريات حافظ الشاعر ومحمد الحنفى الزملاء بجريدة الكرامه<br />زملائى الاعزاء حافظ الشاعر ومحمد الحنفى موعدنا غدا موعد جديد من اجل الدفاع عن الحريات من اجل الحفاظ على البقية الباقية من طبقة المصريين الحقيقيين دون المتمصريين الراغبين فى تدمير كل ما هو وطنى ..كل ما هو حر.. كل ما هو شريف ...<br />ايها الاصدقاء انتم تحاربون تاريخا مثقلا بهموم الشعب المصرى متمثلا فى \\\"الحزن الوثنى\\\" جميعنا معكم ضدهم لقد قمتم بدوركم على اكمل وجه ضد الفساد جائتكم الاوراق تحمل بين صفحاتها قلوب مصرية دامية تنزف بلا توقف تؤكد ان الفساد اصبح بلا خجل رجلا يشار له بالبنان من قبل \\\"الحزن الوثنى\\\" يفاجئنا رجالهم ان غير ذلك هو الفاسد ..لذا لا عليكم فان هناك العديد من الشرفاء يصدقون كل حرف كتبتوة فالمستندات خير شاهد على فسادهم وقضائنا عادل فلا تخيفكم العنجهية والتعالى الذى ورثوة فيما بينهم وانتم شرفاء نعم الشرف يطل من رائحة العرق وركاكة الحال والسعى الدءوب وراء الضعفاء لنصرتهم ...<br />اصدقائى حافظ ومحمد الزملاء بجريدة الكرامه ارفعوا رءوسكم ولا تنحنوا لاحد ربما تقاذفكم البعض لكسب ود \\\"الحزن الوثنى\\\" اى لتقرب شخصى لبعضهم ولكنكم فى النهاية شرفاء لم تستجيبوا الا لصوت الفقراء فانتم صوتهم وقلوبهم وعقولهم ...<br />موعدنا غدا صباح يوم السبت الموافق 31 من شهر مايو لمعركة جديدة ضد هؤلاء الراغبين فى كبيت الحريات ولن نمل من الوقوف جانبكم وجانب علاء القهوجى وشيماء جمعه الزملاء بالدستور والى بيان الشرف الذى وقع علية غالبية مراسلى الصحف بالدقهليه بالاضافة الى بعض رموز القوى السياسية ..."
archived = "2010-03-14"
capture_url = ""

