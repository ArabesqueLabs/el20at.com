subject = "الى الاستاذ قرفان اللي فوق"
posted = "2008-12-11"
text = "ما تخرجش عن الموضوع<br />احنا بنتكلم عن اعدام صدام يوم العيد<br />ليه<br />علشان خاطر تجامل كلام الشيعة اللي فرحوا فرحا شديدا بهذا الاعدام<br />زي مدينة الفللوحة امريكا سحلتها سحل وفضل كلاب الشيعة يتفرجوا يسقفوا<br />وبعدين مين قالك ان انا مع الحزب الوطني<br />انا ملتزم دينيا بتعاليم اهل السنة والجماعة ما ليش دعوة بالحزب الوطني ولا اي حزب"
