[[comments]]
order = 0
subject = "هابي خروف صدام حسين"
text = "نسينا صدام حسين اللي اندبح ليلة العيد اللي فات<br />الله يرحمه فكان اخر كلامه لا اله الا الله<br />وقال رسول الله صلى الله عليه وسلم من كان آخر كلامه لا اله اله الله دخل الجنة"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222124945/http://masr.20at.com:80/newArticle.php?sid=13465"

[[comments]]
order = 1
subject = "صدموة"
author = "هس بس"
text = "ولا يبقى فى الزرايب غير شر البقر<br />عقبال البقرة الضاحكة - مصيرها مصير شارون وعما قريب بفضل دعاء الغلابة والمعتقلين واللى فى السجون من سجن الواحات الى سجن طرة"
archived = "2007-12-22"
capture_url = "https://web.archive.org/web/20071222124945/http://masr.20at.com:80/newArticle.php?sid=13465"
