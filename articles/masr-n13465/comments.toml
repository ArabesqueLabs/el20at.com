[[comments]]
order = 6
subject = "اعدام صدام حسين السني في يوم النحر هدية من الكلاب"
author = "مش شيعي ولا صليبي"
posted = "2008-12-11"
text = "طبعا امريكا غزت العراق تحت ادعاء الخوف من اسلحة الدمار الشامل الموجودة في العراق<br />وهناك راي قال انا عزت العراق من اجل سرقة بترول العراق<br />ولكن الحقيقة امريكاغزت العراق من اجل الشيعة الاوغاد<br />من اجل اقامة دولة شيعية في العراق<br />من اجل ايجاد تحالف شيعي بين ايران والعراق من اجل تشييع المنطقة<br />وهذه امنية اعداء الاسلام هو ان يرو المسلمين يسبون ابو بكر وعمر يا سلام وزوجات النبي<br />فهيهات هيهات يا كلاب اهل السنة والجماعة سيقفون لكم بالمرصاد<br />صلاح الدين الايوبي قادم لا محالة"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 7
subject = "إعدام صدام حسين فى وقت النحر"
author = "ابومحسن السني"
posted = "2008-12-11"
text = "إعدام صدام حسين فى وقت النحر<br />اختيار امريكا لوقت تنفيذ الحكم فى صدام 00 أول أيام عيد الأضحى وبعد صلاة العيد<br />( وقت النحر ) 0<br />هل استوعب حكام الإسلام الرسالة التى يريد امريكا أن تصل إليهم ؟<br />لسان حال الكلب بوش يقول : فى هذا العيد بدأت بصدام ، ثم يأتى باقى القطيع تباعاً<br />واقسم بالله العلى العظيم أن ماحدث لشارون ( هل تذكرونه ) كان بفضل الله أن استجاب لدعاء ملايين<br />من المسلمين ، فهيا بنا جميعا نتوجه بالدعاء على بوش 000 مادام قطيع الأغنام إما فى غيبوبة<br />أو خائف على عرشه أو جبان رعديد 0<br />يارب 000 يارب 000 يارب<br />المسلمون ضعفاء ولاسند لهم إلا أنت 000 ياسند من لاسند له<br />اللهم سلط على بوش جندا من جندك<br />اللهم اشغله بنفسه<br />اللهم ارنا فيه يوما أسودا يتمنى فيه الموت ولايجده<br />اللهم احفظ اسلامنا من أعداءنا ومن حكامنا<br />__________________<br />لحظات سطرها التاريخ بدم صدَّام<br />العراق انتهى بانتهائه.<br />والله يستر على الامة الاسلاميه مما سيأتي<br />فلا املك الا ان اقول :-<br />حسبي الله ونعم الوكيل ... ولا اظن ان قائدا عسكريا سياتي بعد صدام حسين يمسك العراق ويحميها<br />والله المستعان ..<br />كل هذا بسبب الرافضة هم الذين قتلوا البطل صدام وقاموا بعد شنقه بضربه لعنهم الله<br />__________________<br />القذرين<br />استغلوا موسم الحج الاكبر<br />وفي يوم النحر<br />نحروا الرئيس صدام حسين<br />قدموه قرابان للشيطان<br />والادهى فرح الشيعة بهذا القربان<br />والصمت الشنيع<br />من العالم العربي<br />ومتى ؟<br />في شهر الله الحرام !!1<br />ويل لهم من ظلمات يوم عظيم .<br />واين المسلمين ؟<br />انهم غثاء كغثاء السيل<br />لا قيمة لهم ولا وزن .<br />ان سكتوا على اشياء اكثر من هذه<br />فهذه افضع واشنع<br />انها انتهاك لحرمات الشهر الحرام .<br />اللهم انا نبرأ اليك مما حدث في هذا اليوم الفضيل<br />اللهم انا نبرأ اليك مما فعل بوش واعوانه والظلمه<br />ونعوذ بك ان يحل غضبك على الامة للصمت المطبق<br />اللهم انا نبرأ اليك من صمت الحكام العرب وتخاذلهم<br />اللهم دمر الظالمين تدميرا ولا تجعل فيهم صغيرا ولا كبيرا<br />اللهم ولا ترفع لهم راية ولا تعطهم حماية ولا تبلغهم غاية<br />اللهم اهلكهم عن بكره ابيهم<br />اللهم اسلب بشديد محالك من اراد سلبنا<br />واغلب بعظيم سلطانك من يريد غلبنا<br />ودمدم على ركن من يحاول ذلنا<br />ومزق بقوي بطشك من يطلب فُلنا<br />ولا تكلنا على انفسنا في أقوالنا واحوالنا ياذا الجلال والاكرام ."
archived = "2010-03-14"
capture_url = ""

[[comments]]
