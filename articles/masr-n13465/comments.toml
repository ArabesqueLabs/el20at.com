[[comments]]
order = 12
subject = "ما الذى صنع الشيعة ؟ هم اهل السنة ؟ او ملوك بنى ام"
author = "برضة قرفان"
posted = "2008-12-11"
text = "اقرأوا التاريخ<br />ماذا فعل يزيد ابن معاوية بعد قتل الحسين ؟<br />امر خطباء المساجد فى جميع انحاء الدولة الاسلامية بسب على واولادة الحسن والحسين وكل ال البيت فى كل خطب الجمعة<br />فثار الناس ضد شتيمة ال البيت على المنابر<br />حتى ان احد الخطباء وصف على ابن طالب بالفاجر المارق - فوقف احد العميان الذين يصلون الجمعة وقاطع الخطيب قائلا<br />الا ان الفاجر هو انت وابوك والذى ولاك وابوة وخرج من المسجد<br />الخلاف بين المسلمين كان خلاف سياسى - من هو الاحق بالحكم هل هم ال البيت ام بنى امية<br />ولم يختلفوا فى تفسير اية فى القران او حديث او موضوع فقهى<br />وماتوا كلهم واصبحوا عند الكريم<br />فلماذا نصنع خلافا دينيا بين اصحاب مذاهب لدين واحد<br />بنى امية سبوا عليا واولادة الحسن والحسين وكل ال البيت بدون مبرر ورد الشيعة بسب الصحابة والخلفاء وبدون مبرر ايضا<br />وان الاوان لننهى هذا الخلاف الذى لم يعد موجودا<br />وصدام لم يكن سنيا ولا شيعيا بل قاتل خرب البلد ولة ملايين الضحايا وكانة كان ابليس"
archived = "2010-03-14"
