subject = "صدام كان كلب ديكتاتور تسلط على الشعب هو واولادة وع"
author = "ية"
posted = "2008-12-11"
text = "صدام كلب زى بقية الكلاب اللى الدور جاى عليها<br />كم روح ازهق بالباطل<br />كم نفس وضعت فى السجون<br />كم انسان اذل فى عصرة<br />بلاش بكائية خايبة<br />السعودية ودول الخليج هى اللى دبرت حرب العراق ومولت بوش بالفلوس ومصر ساعدت ايضا<br />كلكم تبكون صدام - ما العرب هم اللى قتلوا صدام<br />وهم اللى مولوة بالمليارات لحرب ايران<br />هتضحكوا على مين"
