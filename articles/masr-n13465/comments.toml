subject = "عيد سعيد اعادة اللة عليكم بالخير"
author = "فغ"
posted = "2008-12-08"
text = "عيد سعيد وعساكم جميعا من عوادة<br />والخير فيكم وفى امة محمد الى يوم الدين<br />صباح اليوم كنت ذاهب الى الجزار ليذبح لى الخروف - رفض الجزار ان ياتى معى فى الصباح رغم الاتفاق واجلة الى بعد الظهر<br />قال لى<br />انظر الى هذا العجل - ثمنة 10 الاف جنية - احضرة احد الناس الطيبيين الخييرين - وقال لى اذبحة وفرق كل لحمة على الناس الغلابة وساحضر الذبح والتوزيع ولن اخذ منة غير الكبد وعشرة كيلو لحمة - ولم يعطى الجزار اسمة حينما سالة<br />امة محمد بخير والطيبيين يزدادون<br />وكل عام وانتم جميعا بخير"
