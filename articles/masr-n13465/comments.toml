[[comments]]
order = 9
subject = "الى الاخ اللي فوق"
author = "مش ضروري"
posted = "2008-12-11"
text = "احنا بنتكلم في جزئية محدده<br />بنتكلم عن اعدام صدام يوم العيد لانه سني<br />علشان خاطر يفرح كلاب الشيعة<br />وبعدين فيه حاجه اسمها مذهب اهل السنة والجماعة والتعامل مع الحاكم في مذهب اهل السنة والجماعة السمع والطاعة لولي الامر ما اقام الصلاه<br />وكل اللي كانوا بيناهضوا صدام دول اسمهم الخوارج الذين<br />اول الخوارج الرجل الذي مسك الرسول صلى الله عليه وسلمخ من جلبابه وقال له اعدل<br />فحذرنا الرسول صلى الله عليه وسلمخ من الخوارج<br />وجم الخوارج قتلوا عثمان وخرجوا على سيدنا علي<br />فاللي كان بيحاربهمخ صدام دول اسمهم الخوارج<br />واحنا هنا بنتكلم عن كلاب الشيعة اللي تحالفوا مع امريكا ضد اهل السنه<br />فهمت ولا لسالك ميت سنه علشان خاطر تفهم<br />بس هي دي النقطة بتاعتها"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "الى الاخ الاخ بتاع اهل السنة والجماعة =-- قرفتنا"
author = "قرفان"
posted = "2008-12-11"
text = "شيعة اية وسنة اية وطاعة ولى امر اية<br />الخليفة عثمان اتقتل لانة يستحق القتل - كان من الصحابة والمبشرين بالجنة هذا على راسى وراس ابويا من فوق ولكنة كان ادارى فاشل - رجل بتاع ربنا حاجة والتدين حاجة تانية - لما تولى الادارة اثبت فشلة ولو كان محبوبا كان اهل السنة بتوعك حموة من الموت ولكنة مات تحت بصر اهل السنة والجماعة وعلى واولادة واولاد ابو بكر وعمر وكل بتوع المدينة لانة عين كل قرايبة من بنى امية فى الحكم فوجب الخروج علية وقتلة لانة ليس نبى ولا رسول<br />وكذلك مع سيدنا على<br />رجل متدين ولكنة ليس ادارى وعندما سالوا احد الصحابة عن على ومعاوية قال اصلى خلف على واتبع معاوية سياسيا<br />وحكاية الشبعة دى مذهب من مذاهب المسلمين<br />انما مفيش مذهب اسمة اهل السنة والجماعة - يعنى اية<br />اللى انت بتكلم عنة اسمة تنطع فى الدين<br />وقف عمر بن الخطاب يخطب بعد تولية الحكم<br />ان احسنت فاعينونى وان اسات فقومونى<br />فرد علية من فى المسجد<br />واللة لنقومك بسيوفنا<br />يعنى ان اخطأت هنقتلك<br />فضها سيرة<br />وخليك مع الحزب الدستورى او الحزب الوطنى وبلاش حكاية اهل السنة والجماعة اللى قرفتنا بيها<br />واللى انت مش عايز احد يخرج عن الحزب الحاكم - يعنى انت تبع الحزب الوطنى"
archived = "2010-03-14"
capture_url = ""

[[comments]]
