subject = "عيد سعيد صدام شهيد"
author = "مش حستسلم"
posted = "2008-12-09"
text = "لن ننسى ابدا اعدام صدام في العيد لاهانة المسلمين السنه وادخال الفرحى على الشيعة يوالصليبيين والاقباط وبقية ملل الكفر<br />الايام بيننا يا كلاب<br />خالد بن الوليد راجع وابو عبيدة ابن الجراح راجع<br />وعمر بن العاص وعقبة بن نافع راجع<br />وصلاح الدين الايوبي ومحمد الفاتح راجعين<br />راجعين والله راجعين<br />حنوريكوا اهل السنة والجماعة حيعملوا ايه"
