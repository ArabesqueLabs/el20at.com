subject = "ضع عنوان التعليق"
text = "دى قصة بتوريكو قد ايه الفيلم المصرى متميز عن غيره<br />اقروها كلها عشان جامده<br />أدهم صبرى ضابط مخابرات مصرى جامد<br />داخل ع الستين من عمره، يرمز له بالرمز ب-516 ، حرف الباء يعنى أنه من بولاق،<br />أما الرقم 516 فده رقم الأتوبيس اللى بيركبه عشان يوصل محطة البحوث ومنها يوصل لرمسيس يغير المترو عشان ينزل محطة القبة بتاعة المخابرات.<br />هذا لأن أدهم رجل من نوع خاص حيث أنه يجيد قيادة كل أنواع المواصلات من الطائرات والغواصات والسوبرجيت حتى التوك توك،<br />ويجيد استخدام جميع أنواع الأسلحة من المسدس وبمب العيد حتى القنابل النووية والهيدروجينية، ويجيد 66 لغة بالصلا ع النبى وفيه لغتين اتعلمهم وهوه نايم،<br />ويجيد جميع أنواع التنكر، وجميع أنواع القتال والألعاب من التايكوندو وحتى البلاى ستايشن<br />لقد أجمع الكل ومنهم أنا أنه من المستحيل وربنا أن يجيد رجل واحد فى عمرجدى كل هذه المهارات ولذلك استحق هذا اللقب .. رجل المستحيل<br />المغامرة رقم 65468<br />اختطاف محسن<br />1- ازاى الكلام ده؟؟<br />جلس مدير المخابرات الجديد على مكتبه وهو يتذكر ماحدث حتى الآن فى هذا الأمر الصعب الذى تمر به مصر وما حدث من أدهم (لمزيد من التفاصيل راجع العدد السابق65467 الجزء التاسع من المغامرة بعنوان<br />\"قال عايزين يخطفوا محسن\")<br />وبعد قليل طرق أدهم الباب فأذن له بالدخول واستنشق بعض الأكسجين من الهواء فالإنسان لابد أن يستنشق الأكسجين*<br />* حقيقة علمية<br />وقال لأدهم الأمر اتأزم جدا يا ب-516، نص محافظات مصر مش لاقية تشرب مية والناس خرجت بالجراكن وعاملين ثورة اسمها ثورة الخراطيم، كل واحد جاى بالخرطوم وهيقطعنا.. والقيادة العليا بتشك فى إن ده ملعوب من المخابرات المعادية الإسـ...(لا لا مش الإسرائيلية)<br />وكمان التقارير بتقول ان سونيا جراهام هنا<br />يغضب أدهم ويقول يبقى جه الوقت اللى هاقدر آخد ابنى الرضيع منها، يرد المديررضيع إيه يا أدهم؟؟ ابنك زمانه قدى دلوقتى ..<br />دانت سايبه فى العدد 100 ،!!<br />وبعدين هما عملوا حاجة عشان انت اللى تقوم بالعملية تحديدا..يرد أدهم عااااارف عاااارف .. أكيد خطفوا قدرى ..<br />يافندم : الراجل ده اتخطف أكتر ما زور جوازات<br />.. يرد المدير دى تذكرة الطيارة اللى هتسافر للمنصورة بعد 3 ثوانى عشان مفيش مية هناك فى نص المراكز..الحق غير هدومك وزور قرايبك ع السريع والحق الطيارة.. أخذ أدهم التذاكر وهو ينظر إليه جامد<br />جامد<br />جامد<br />جامد<br />2- !!ينفع كده؟<br />هبط أدهم من الطائرة فى المنصورة<br />متنكرا فى شكل طفل فى رابعة إبتدائى<br />وأشار إلى توك توك وهو يلاحظ السيارات التى تراقبه وفهم فورا بذكائه ازاى العصابة عرفته رغم التنكر<br />فقد أخطأ وقال لسواق التاكسى أحلى صباح فعرفوا علطول انه أدهم عشان قال حرفين الألف والصاد المشهور بيهم..<br />المهم رمى أدهم سواق التوك توك وتسلم مقعد القيادة وتذكر كيف أن أبوه فى الخمسينيات علمه كيف يقود التوك توك عشان يبقى أحسن ظابط مخابرات،<br />انحرف أدهم فى حتة ضلمة وانحرفت العصابة وظهر أدهم للعصابة<br />فخرج من السيارة 100 شخص مسلحين ولكن أدهم أخرج مسدسه أبو 6 طلقات وضرب رشاشاتهم كلهم من غير ما يجرح واحد فيهم وبعدين للأسف المسدس معدش فيه رصاص ولكن أدهم رجل المواقف الصعبة دور الضرب فى الرجالة ..<br />ففقد 65 واحد الوعى ولكن التانين فهموا الخدعة فعملوا دايرة حول أدهم ولكن أدهم طار فى الجو ونزل عليهم كلهم .. وفى لحظة وصلت إمدادات العدو كمان200 واحد .. ولكن أدهم ضربهم كلهم برضه ووصلت الإمدادات التانية حوالى 500 واحد كمان ولكن الكثرة تغلب الشجاعة ..<br />يعنى حوالى 800 واحد على واحد كتير بردو<br />وفقد أدهم الوعى أمام عدوه اللدود<br />الفظيع<br />الشنيع<br />المريع<br />3- والله ما يحصل<br />أفاق أدهم فوجد نفسه فى مخزن وبجانبه المحروس قدرى كالعادة مربوط..وأمامهما سونيا جراهام ست زى القمر<br />فقال لها أدهم : إيه الحلاوة دى يا سونيا؟؟ انت كل ما تكبرى تحلوى؟؟ ترد سونيا مش أحسن منك ياللى مش بتكبر أصلا!!<br />يتمتم أدهم ياللنسااااء<br />ويسألها: ليه انتوا قطعتوا المية عن نص البلد والناس مش لاقية تشرب وبتشرب مية المجارى والناس مش عارفه تغسل وبيغسلوا هدومهم فى الترعة؟؟<br />تقول سونيا عشان الشعب يفتكر ظلما ان الحكومة بتاعتكم هيه اللى عاملة كده؟<br />أدهم بفضول :يعنى بجد والله الحكومة مالهاش ذنب؟<br />ترد سونيا : لا طبعا .. حكومتكم أحسن حكومة دلوقتى ..الشباب كلهم بيشتغلوا..<br />الجنيه بقى أغلى م الدولار .. الأسعار نزلت ..الانترنت بقى ببلاش فى البيوت.. ما فيش حاجة بتتباع فى البلد.. بنك القاهرة ما اتباعش ولا عمر افندى..الفضيلة انتشرت فى البلد ولغوا كل القنوات اللى بتتحدى الملل.. المية واصلة للبلد كلها والمواسير بقالها 200 سنة عشان المحافظة ع التراث..<br />انتوا اللى شعب غلباوى<br />غلباوى<br />غلباوى<br />4- ما تلمى نفسك بقى<br />قطع أدهم قيوده فجأة وماتسألش ازاى<br />(آه نسينا نقول فى المقدمة انه يجيد التخلص من كل القيود فى الدنيا)<br />وصفع سونيا جامد يعنى ولكن الحارس جه من وراه وضربه ولكن منى<br />(اللى أصلا عندها كام وخمسين سنة)<br />جت فجأة مش عارفين منين وضربت الحارس من وراه وأنقذت الموقف ..<br />نظر أدهم فى عين منى وقال :<br />ما تجيبي أطة فا تبصله من فوق لتحت , فيقول لها تتجوزينى؟؟ ترد منى فى حياء: ماينفعش يا أدهم عشان أنا جسمى كله واوا<br />.. يغضب أدهم ويخرج من المكان بعد أن حرر قدرى وهوه يغنى :<br />ليك الواوا ..بوس الواوا..خللى الواوا يصح<br />وهو فى الطريق ينحرف الجميع إلى أقرب بيت ويطلب منه أدهم بعض الماء للشرب.. ولكن صاحب البيت الحاج بيومى يخرج بمقشة هوه وعياله ويحتجزون أدهم ورفاقه وهو يصرخ: زى ما العصابة خطفت محسن ابنى، أنا كمان هاخطفكم، وبعدين انتوا جايين تطلبوا مية ؟؟ هوه فيه مية فى البلد ياولاد الكلب<br />..الكلب<br />..الكلب<br />..الكلب<br />* تمت بحمد الله *<br />انتهى الجزء التاسع<br />العدد القادم<br />(لسة خاطفين محسن)<br />كيف يخرج أدهم ورفاقه من بيت الحاج بيومى؟<br />كيف يستطيع أدهم بعد كل هذه الصعاب أن يحصل على كوز مية عشان يشرب ؟<br />هل يستطيع أدهم أن يحرر محسن ابن الحاج بيومى وللا هيسيبه يتحرق؟<br />هل يستطيع أدهم أن يوضح الموقف للرأى العام وهو أن حكومتنا زى الفل ودايما الغلط على الأعداء؟<br />سيب اللى ف إيدك .. وقاتل بإيدك ورجلك وكبدك مع رجل المستحيل<br />THANKS FOR READING"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195740/http://masr.20at.com:80/newArticle.php?sid=14187"

