[[comments]]
order = 5
subject = "والمصحف هتخلوني اكفر"
author = "Ahmad Hima"
text = "مع انى عارف انى هتشتم وهيتسبلي ميت مله ودين إلا انى بكره الاخوان دول من جذور قلبي علشان دول شوية ....... بيعيشوا<br />ايش جاب المنتخب لأم الاخوان المتلحوسين انا نفسي اعرف<br />ولا هو كل حاجة بقت علشان الاخوان اللذيذين الطبيين الحلوين<br />والنبي بلاش حكاية الضحك ع الدقون دي ما بقناش ناكل م الكلام دا<br />والشخص اللى واخد القصة بتاعه ادهم صبري دي من البلوج بتاع اخف دم دي<br />واخدها مسطرة يا اخي طيب غير اى حاجة خبي شوية<br />دا ايه الشلل اللى هيجيلي بدري دا<br />حرام عليكوا هتيطروا مفعول امبارح"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195740/http://masr.20at.com:80/newArticle.php?sid=14187"

[[comments]]
order = 6
subject = "لاخ اللى هيجى لة شلل اللى فوق"
author = "op ui"
text = "سؤال بسيط جدا<br />من هو التيار الوطنى الشريف اللى شايل هموم وطنة فى الشارع المصرى ؟<br />طبعا - محدش يقدر ينكر - سواء رضيت او انشليت - او حتى كفرت - مش مهم - مفيش غيرهم شباب الاخوان او الجماعات الاسلامية<br />بزمتك يا شيخ الحزب الوطنى لية تواجد فى الشارع - ابدا<br />تواجد الحزب الوطنى فى الشارع ممثل بعساكر الامن المركزى ومباحث امن الدولة وفرق الكارتية<br />اسأل اى طفل فى حارة شعبية يقول لك الحزب الوطنى هم بتوع الامن المركزى وامن الدولة والكارتية اللى بيضرب المظاهرات<br />دى مش شطارة من الاخوان - ولكن غباء النظام - اللى عايز يحكم بالامن والقوة الجبرية<br />والنظام هو اللى بيعطى شعبية للاخوان بشوية الاعتقالات الخايبة بتاع الستينات والمحاكم العسكرية<br />لا تلوم الاخوان -- لكن وجة النقد لغباء النظام الحاكم"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195740/http://masr.20at.com:80/newArticle.php?sid=14187"

[[comments]]
order = 7
subject = "من منتدي"
author = "مونا"
text = "حوار بين قيس وليلى عام 2007 >><br />قيس أبن عمى عندنا...يا مرحبا يا مرحبا<br />قيس:- كم جئت ليلى بأسباب ملفقة...ما كان أكثر أسبابي وعلاتى<br />ليلى: ما تتكلم عربي يا مان<br />قيس:- حلاوتك بالعجوة...أبوكي فين يابت؟<br />ليلى:- ف السايبر -قيس:- يعنى أحنا هنا لوحدنا؟ ليلى:- والشيطان صايع -قيس:- أنا لا أفكر في هذه الأمور...<br />ليلى:- ليه يا روح أمك....ما اشبهش البنات اللى أنت ماشى معاهم- قيس:- مش العبارة بس.....ليلى:- (تقاطعه)وحياه أبويه يا قيس لو ما انعدلت معايا لأكون مولعة ف خيمتك بصفيحة بنزين<br />قيس:- إهدئى يا ليلى( ويخرج من جيبه سيجارة كبيرة الحجم ويعطيها لليلي) مسائه نابت...إعمليلك سحابه دخان<br />ليلى:- (في دهشة) أنت بتحشش يا قيس؟!!<br />قيس:- إضربى يا شيخه إضربى -ليلى:- ( تأخذ نفساً عميقاً من السيجارة) إيه البقسماط ده...دا مضروب يا حبة عيني- قيس:- بقسماط!!! إيش فهّمك إنتى في الكيف....إنتى أخرك تكركري بالجو زه من غير معسل<br />ليلى:- (في تحدى) طب إستنى ( وتتجه نحو الداخل)<br />قيس:- ( لليلى) رايحه فين؟ ليلى:- هجيبلك تربة حشيش (وتدخل)<br />الأب:- (يدخل الخيمة ويفاجأ بوجود قيس) قيس!!...هنا مع ليلى...ومصيبتاه...فلتمطري صابون سائل أيتها السماء....(لقيس) أنت بتعمل إيه هنا ياله؟ !!!!!!!!!!!<br />قيس:- أنا كنت جايلك يا عمى عشان تيجى تصلح لنا السيفون....دانت شغلك .......الواحد بعد كده يبقى يجيب سباك نضيف -الأب:- (في انفعال) أين ليلى...ليلى...ليلى<br />ليلى:- (تدخل وفى يدها تربة حشيش) أبى ...ما الذي أتى بك مبكراً...أنت مش قولت هتقد ساعتين؟<br />الأب؟- النت فصل...إيه اللى ف إيدك ده؟!!<br />ليلى:- دى تربة حشيش هديها لقيس تموين الشهر<br />الأب:- (في ذهول) ياللعار!!...من أين أتيتى بها أيتها الفاجرة؟<br />ليلى:- ما تخافشي يا بابا دا م التموين بتاعى....الحشيش بتاعك لسه بلفتٌه الأب:- ( في راحة نفسية) آه ..إذا كان كده معلش<br />ليلى:- ( تعطى الحشيش لقيس) خد يا قيس جرب الصنف دا واحكيلى<br />قيس:- (يأخذ الحشيش)<br />ليلى...بعدد الجوانات التي بضربها..وبعدد الأحجار التي قمت برصها وبعدد الأنفاس التي قمت بتسليكها...أشكرك بضمير<br />الأب:- (لقيس) بقولك أيه ياقيس .... أنت مش ناوي تتجوز ليلى قبل ما تخرج م الضمان<br />قيس:- وأنت ترضها لي برضه يا أونكل؟<br />الأب:- خسئت...هات ياد تربة الحشيش اللى خدتها<br />قيس:- ( يعطيه الحشيش) أمسك يا عم أنت هتذل إمى بحتة الحشيش بتاعتك..لعلمك بقه الصنف اللى أنت فرحان بيه دا بتباع في الجمعية مع اللحمة البرازيلي<br />الأب:- (لقيس) أمشى ياد أطلع بره<br />قيس:- تصبح على نقاله يا عمى<br />قيس وليلى عام 2007>><br />ماذا عن قيس وليلى 3007>>"
archived = "2008-02-15"
capture_url = "https://web.archive.org/web/20080215195740/http://masr.20at.com:80/newArticle.php?sid=14187"
