subject = "فرحان بفوز مصر"
author = "إخوانى"
text = "والله الإخوان دول زى العسل<br />ميفتهمش مناسبة إلا لما يبقى ليهم فيها رأى<br />مش الميتين اللى اتحنطوا فى الأحزاب بتاعتنا الخربانة ولا شباب المصالح فى الحزب الوطنى اللى قلدوا مظاهرة الإخوان وقعدوا يزغرتوا فى الوقفة اللى عملوها على سلم الجامعة ، ونفسى أسألهم ليه على السلم يعنى ؟؟؟<br />عموما تحياتى للإخوان شبابا وشيوخا وأطفالا<br />بجد لو الإخوان مش موجودين فى مصر مش عارف كان مين هيطلع لها صوت ؟؟؟"
archived = "2008-02-15"
