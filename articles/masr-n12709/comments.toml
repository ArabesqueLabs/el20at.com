subject = "\"ألوان السما السبعة\" ,والنجوم في عز الظه"
author = "مش لازم"
posted = "2007-12-03"
text = "يا بنت الحاج عبدالفضيل ان شاء الله حتاخد جايزه عن الفيلم<br />بس احنا المصريين شايفين الوان السما السبعة والنجوم في عز الظهر<br />هما ياخدوا جوايز واحنا نروح امن الدولة لاظوغلي<br />شاطره يا بنت الحاج عبدالفضيل كويس اوي التقدم بتاعك وان شاء الله في المرات القادمة تعملي تحقيقات احسن واحسن واحسن<br />ومزيدا من التقدم باذن الله وكل عام وانتم بخير"
archived = "2007-12-04"
capture_url = "https://web.archive.org/web/20071204131623/http://masr.20at.com:80/newArticle.php?sid=12709"
