text = "أقوال علماء السنة و الجماعة في جماعة الاخوان المسلمين<br />العلامة الشيخ عبد العزيز بن باز\"رحمه الله\"<br />العلامة الشيخ محمد ناصر الدين الألباني\"رحمه الله\"<br />العلامة الشيخ محمد بن عثيمين\" رحمه الله\"<br />العلامة الشيخ صالح بن فوزان الفوزان \"حفظه الله\"<br />العلامة لشيخ صالح الحيدان\"حفظه الله\"<br />العلامة الشيخ صالح بن عبد العزيز أل شيخ\"حفظه الله\"<br />فتوي سماحة الشيخ العلامة/السلفي عبد العزيز بن باز\"رحمه الله\"<br />سُئل رحمه الله:أحسن الله اليك حديث النبي صل الله عليه و سلم في افتراق المم و قوله\"ستفترق امتي علي ثلاث و بعين فرقة كلها في النار ألا واحدة \"فهل جماعة التبليغ علي ما عندهم من شركيات و بدع و جماعة الاخوان المسلمين علي ما عندهم من تحزب وشق للعصا علي ولاة الأمر ....هل هاتان الفرقتان تدخلان في الفرق الهالكة؟<br />الجواب:تدخل في الاثنين و السبعين,ومن خالف عقيدة اهل السنة والجماعة دخل في الاثنتين و السبعين,و المراد بقول النبي صلي الله عليه و سلم امتي اي امة الاجابة أي استجابوا لله و أظهروا اتباعهم له .<br />السائل : يعني هاتان الفرقتان من ضمن الاثنتين و السبعين<br />الجواب نعم من الاثنتين و السبعين(من شريط احد دروس المنتقي في مدينة الطائف قبل وفاته بسنتين رحمه الله)<br />سئل الشيخ جماعة الخوان المسلمين دخلوا المملكة منذ فترة و اصبح لهم نشاطا بين الطلبة ما رأيكم بهذه الحركة؟و ما مدي توافقها مع منهج اهل السنة و الجماعة؟<br />الجواب : حركة الاخوان المسلمون ينقصها خواص أهل العلم لانه ليس عندهم نشاط في الدعوة الي التوحيد و إنكار الشرك و إنكار البدع ,لهم اساليب خاصة ينقصها عدم النشاط الي الدعوة الي اللهو عدم التوجه الي العقيدة الصحيحة التي عليها اهل السنة و الجماعة ...........الي اخر كلام الشيخ الطويل الذي يبين فيه انحراف الجماعة عن منهج اهل السنة و الجماعة<br />(من مجلة المجلة العدد806)<br />فتوي محدث الشام العلامة السلفي الشيخ محمد ناصر الدين الالباني \"رحمه الله\"<br />قال \"ليس صوابا ان يقال إن الاخوان المسلمين هم من أهل السنة لانهم يحاربون السنة\"(من شريط فتوي حول جماعة التبليغ و الاخوان من تسجيلات منهاج السنة في الرياض)<br />فتوي العلامة السلفي الشيخ محمد بن العثيمين \"رحمه الله\"في حكم تعدد الجماعات<br />سئل رحمه الله :هل هناك نصوص في كتاب الله و سنة نبيه صلي الله عليه و سلم فيها أباحة تعدد الجماعات او الاخوان؟<br />لجواب:ليس في كتاب الله ولا في سنة نبيه عليه الصلاة و السلام ما يبيح تعدد الاحزاب و الجماعات بل إن في كتاب اللهو السنة ما يذم ذلك قال تعالي\"إِنَّ الَّذِينَ فَرَّقُواْ دِينَهُمْ وَكَانُواْ شِيَعاً لَّسْتَ مِنْهُمْ فِي شَيْءٍ إِنَّمَا أَمْرُهُمْ إِلَى اللّهِ ثُمَّ يُنَبِّئُهُم بِمَا كَانُواْ يَفْعَلُونَ [الأنعام : 159]\"و قال تعالي \"فَتَقَطَّعُوا أَمْرَهُم بَيْنَهُمْ زُبُراً كُلُّ حِزْبٍ بِمَا لَدَيْهِمْ فَرِحُونَ [المؤمنون : 53]\"ولا شك ان هذه الاخزاب تتنافي مع ما امر الله به بل ما حث الله عليه في قوله\"إِنَّ هَذِهِ أُمَّتُكُمْ أُمَّةً وَاحِدَةً وَأَنَا رَبُّكُمْ فَاعْبُدُونِ [الأنبياء : 92]\"و قول بعضهم إنه لا يمكن للدعوة ان تقوي الا تحت حزب؟<br />نقول هذا ليس بصحيح, بل إن الدعوة تقوي كل ما كان الانسان منطويا ةتحت كتاب الله و سنة رسوله صلي الله عليه و سلمو خلفاءه الراشدين.<br />فتوي فضيلة الشيخ العلامة صالح بن فوزان الفوزان\"حفظه الله\"<br />سئل\"حفظه الله\"هل هذه الجماعات تدخل في الاثنتين و سبعين فرقة الهالكة؟<br />فقال:نعم كل من خالف اهل السنة و الجماعة ممن ينتسب الي الاسلام في الدعوة أو في العقيدة أو اي شي من أصول الايمان فإنه يدخل في الاثنتين و السبعين فرقة الهالكة و يشمله الوعيد و يكون له من الذم و العقوبة بقدر ومخالفته.<br />و سئل :ما حكم وجود مثل هذه الفرق؟التبليغ الاخوان و حزب التحرير و غيرها في بلاد المسلمين عامة؟<br />فقال :هذه الجماعات الوافدة يجب ألا نتقبلها لأنها تريد أن تنحرف بنا و تفرقنا و تجعل هذا تبليغيا و هذا اخوانيا و هذا كذا....(و هذا ما صرنا اليه)......لم هذا التفرق هذا كفر بالنعمة و نحن جماعة واحدة و علي بينة من امرنا ,لماذا نستبدل الذي هو ادني بالذي هو خير؟ لم نتنازل عام اكرمنا الله سبحانه و تعالي به من الاجتماع و الألفة و الطريق الصحيح و ننتمي الي جماعات تفرقنا و تشتت شملنا و تزرع العداوة بيننا؟هذا لا يجوز ابدا(من كتاب الاجوبة المفيدة عن أيئلة المناهج الجديدة).<br />فتوي فضيلة الشيخ العلامة صالح الحيدان \"حفظه الله\"<br />قال \"حفظه الله\"(الاخوان و جماعة التبليغ ليسوا من أهل المناهج الصحيحة....فإن جميع الجماعات و التسميات ليس لها اصل في سلف الامة.<br />(فتاوي العلماء في الجماعات و أثرها علي بلاد الحرمين :تسجيلات منهاج السنة السمعية الرياض).<br />كلام فضيلة الشيخ صالح بن عبد العزيز أل شيخ وزير الشئون الاسلامية بالمملكة\"حفظه الله\"<br />قال \"حفظه الله\"اما جماعة الاخوان المسلمين فإن ابرز مظاهر الدعوة عندهم التكتم و الخفا و التلون و التقرب الي من يظنون أنه سينفعهم و عدم اظهار حقيقة امرهم , يعني أنهم باطنية بنوع من انواعها.<br />.................................................. و أيضا مما يميز الاخوان عن غيرهم انهم لا يحترمون السنة ولا يحبون اهلها و ان كانوا في الجملة لا يظهرون ذلك لكنهم في حقيقة الامر ما يحبون السنة ولا يدعون اهلهاو قد جربنا ذلك في بعض من كان منتميا لهم أو يخالط بعضهم فتجد أنه لما بدا يقرا كتب اهل السنة مثل لبخاري او حضور دروس لمشايخ اهل السنة حذروه و قالوا له هذا لا ينفعك , وش ينفعك صحيح البخاري؟ماذا تنفعك الاحاديث؟انظر الي العلماء هؤلاء ما حالهم؟هل نفعوا المسلمين؟المسلمون في كذا و كذا,يعني أنهم لا يقرَّون فيما بينهم تدريس السنة و لا محبة اهلها وهذا فضلا عن أصل الاصول ألا و هو الاعتقاد عامة.<br />من مظاهرهم ايضا انهم يرمون الوصول الي السلطة و ذلك بانهم يتخذون من رؤوسهم أدوات يجعلونها تصل , وو تارة تكون تلك الرؤوس ثقافية و تارة تنظيمية يعني نهم يبذلون أنفسهم و يعينون بعضهم حتي يصل بطريقة او باخري الي السلطة و قد يكون مغفولا عن ذلك يعني الي سلطة جزئية حتي ينفَذون من خلالها الي التاثير و هذا يتبع ان يكون هناك تحزب يعني يقرَّبون منهم من في الجماعة و يُبعدون من لم يكن في الجماعة فيقال:فلان ينبغي ابعاده لا يمكّن من هذا,لا يمكّن من التدريس , لا يمكّن من ان يكون في هذا (و ما فعل مع كبار كوادرهم منتصر الزيات ليس ببعيد عن الاذهان).......فلماذا كل هذا..<br />كانت هذه نبذات من اراء الشيوخ و العلماء و اعلموا ان هؤلاء هم من قال فيهم رسول الله إن الله يبعث لهذه الأمة على رأس كل مائة سنة من يجدد لها دينها<br />الراوي: أبو هريرة - خلاصة الدرجة: هذا الحديث في كتاب الرجال لابن وهب - المحدث: ابن عدي - المصدر: الكامل في الضعفاء - الصفحة أو الرقم: 1/205<br />فهؤلاء اعلام الامة في قرننا هذا اجتمعوا علي راي واحد فلا هناك شكوك ولا هناك جدال و ليس لك حجة ان كنت منهم ان تتوب الي الباري و ان تعود الي رحاب اهل السنة والجماعة.<br />اسأل الله ان ينفع المسلمين و المسلمات بهذه الكلمات<br />اخوكم في الله"
