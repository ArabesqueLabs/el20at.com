subject = "هؤلاء هم الأخوان .. على حقبقتهم"
author = "صحفي عبد الحق"
posted = "2008-06-09"
text = "هؤلاء هم الأخوان فتعلموا يا صحفي اليوم !!!!!!!!!!!<br />عبد المنعم سليم جُبَّارة.. مدرسة في التحليل السياسي<br />[09:31مكة المكرمة ] [28/02/2008]<br />بقلم: عبده مصطفى دسوقي<br />عبد المنعم سليم جُبَّارة<br />المحن سنة من سنن الله في الكون ليمحِّصَ الصفَّ المؤمن ولينقِّيَه من الخبيث، قال تعالى: &--64831;وَلا تَهِنُوا وَلا تَحْزَنُوا وَأَنْتُمْ الأَعْلَوْنَ إِنْ كُنْتُمْ مُؤْمِنِينَ (139) إِنْ يَمْسَسْكُمْ قَرْحٌ فَقَدْ مَسَّ الْقَوْمَ قَرْحٌ مِثْلُهُ وَتِلْكَ الأَيَّامُ نُدَاوِلُهَا بَيْنَ النَّاسِ وَلِيَعْلَمَ اللَّهُ الَّذِينَ آمَنُوا وَيَتَّخِذَ مِنْكُمْ شُهَدَاءَ وَاللَّهُ لا يُحِبُّ الظَّالِمِينَ (140) وَلِيُمَحِّصَ اللَّهُ الَّذِينَ آمَنُوا وَيَمْحَقَ الْكَافِرِينَ (141) أَمْ حَسِبْتُمْ أَنْ تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَعْلَمْ اللَّهُ الَّذِينَ جَاهَدُوا مِنْكُمْ وَيَعْلَمَ الصَّابِرِينَ (142)&--64830; (آل عمران).<br />ولقد تعرَّضت جماعةُ الإخوان المسلمين للمحن لانتهاجها الفهم الصحيح للإسلام والشامل، ومن ثَمَّ فقد وُجِّهت إليها سهام المخالفين للإسلام وأعدائه؛ يقول الشهيد سيد قطب: \"عندما نعيش لنزواتنا ولشهواتنا تبدو لنا الحياة قصيرةً، تافهةً، ضئيلةً، تبدأ من حيث بدأنا نعي، وتنتهي بانتهاء عمرنا المحدود\"!!.<br />النشأة<br />في بيئة ريفية وُلد فارس الصحافة الأستاذ عبد المنعم سليم جُبَّارة لعائلة ميسورة في مركز فاقوس بمحافظة الشرقية في 22 من أكتوبر 1930م؛ حيث نشأ فيها وتربَّى على أخلاقها.<br />كان ثراء عائلته عاملاً قويًّا في التحاقه بمراحل التعليم المختلفة، حتى تخرَّج في كلية الآداب بجامعة القاهرة (قسم الجغرافيا)، ثم اعتُقل عام 1955م، وبعد أن خرج من غياهب الظلمات، وهو في الرابعة والأربعين من العمر، لم يتزوج ولم يكن له وظيفة، فعمل في وزارة التربية والتعليم موجِّهًا بالتعليم الثانوي.<br />وفي عام 1976م انضمَّ إلى مجلة \"الدعوة\"، ثم أُعير إلى الإمارات العربية المتحدة؛ ليعمل في مجال التدريس، وأسَّس مع آخرين مجلة \"الإصلاح\"، ثم ترك الإمارات، وعاد إلى مصر بعد سنوات، ليعمل صحفيًّا في مجلة \"الدعوة\" ثم \"لواء الإسلام\" وكتب في كثير من الصحف المحلية والعالمية، ثم تزوَّج عام 1978م، ورزقه الله بطارق وزياد وتسنيم.<br />على طريق الإمام البنا<br />ما كادت قريحته تتفتَّح وينتقل إلى المرحلة الثانوية حتى تعرَّف على دعوة الإخوان المسلمين، فتشبَّعت نفسُه بها وملكت عليه وجدانه، ونتركه يصف حاله وقت التحاقه بالدعوة فيقول: \"كانت البداية في مدرسة الزقازيق الثانوية؛ حيث كان للإخوان وجود قوي في الشرقية، وفي أغلب القطر، وكان لهم الكثير من الشُعب بها، وقد رأيت الإمام \"البنا\" رحمه الله مرات في مؤتمرات حاشدة له بالمحافظة، وكان لي معرفة بطلاب كنا نرى فيهم حسن السلوك والخلق والمعاملة الطيبة والتفوق العلمي، صارت بداية صداقة وعلاقة تحوَّلت إلى اقتناع بالتوجُّهات والأفكار القائمة على القيم والأخلاق الحميدة، وإيفاء الله حقه\".<br />التحق الأستاذ عبد المنعم بركب الصالحين، وأخذ ينهل من فيوضات علم الإخوان، وقد اتصف بحضور الذهن والبديهة، حتى التحق بالجامعة فشارك في أنشطتها، وكان عضوًا في اتحاد الكلية والجامعة؛ حيث كانت الاتحادات الطلابية أغلب تشكيلها من الإخوان.<br />وما كادت الانتخابات التي أجراها حسين سري باشا تنتهي حتى أسفرت عن هزيمة حزب السعديين، الذي أذاق البلاد الويلات وأدى لضياع فلسطين، وجاء حزب الوفد الذي دعمه الإخوان في الفوز، وما كاد شهر أكتوبر عام 1951م يحلّ حتى وقف النحاس باشا وأعلن إلغاء معاهدة 1936م، من طرف واحد والتي وقَّعها الوفد أيضًا مع الإنجليز عام 1936م، والتي سُمِّيَت بمعاهدة \"الاستقلال والشرف\"، فسارعت الجامعات بإعداد معسكرات الفدائيين وتدريبهم، وسارع الإخوان بالمشاركة فيها، وفي جامعة القاهرة كان المسئول عن هذه المعسكرات الأخ المجاهد حسن دوح، كما كان المسئول عن جامعة الملك فاروق (عين شمس) الأستاذ محمد مهدي عاكف؛ حيث سَمَح له رئيس الجامعة بإقامة المعسكرات وتدريب الفدائيين، حتى إنه ساهم فيها بالمال.<br />انطلقت جموع الفدائيين تدكُّ حصون الإنجليز في القنال، وكان عبد المنعم سليم جُبَّارة أحد هؤلاء الشباب الذي شارك وحارب في دكِّ وزلزلة حصون الإنجليز ففجَّروا مخازن ومستودعات أبو سلطان للذخيرة، كما نسفوا القطار الحربي الإنجليزي، وسقط منهم شهداء؛ أمثال وائل شاهين وأحمد غانم وعادل المنيسي.<br />بعدها عاد المجاهد عبد المنعم ليحارب بالقلم داخل الجامعة؛ ثم أنهى فترة الجامعة، وبعدها انطلق وسط جموع الشعب ينشر فكرته ودعوته، كما انطلق ليساهم ويشارك في زلزلة أركان الملكية وإسقاطها في 23 يوليو 1952م، مع ربوع الإخوان الذين عاونوا الثورة على تحقيق نجاحها.<br />في طور المحنة<br />ما كادت الأمور تستقر حتى كشف عبد الناصر عن وجهه الحقيقي، فغدر بالإخوان ثم ألحق الأذى بأعزّ أصدقائه وزملائه؛ ففي ديسمبر 1953م قام بإصدار قرار بحلِّ جماعة الإخوان المسلمين واعتقال 200 من قادتها، غير أنه وُوجه بموجة عاتية من السخط الشعبي، الذي طالب بعودة محمد نجيب والإفراج عنه وعودة الإخوان المسلمين، ورَضَخَ لهذه المطالب الشعبية، غير أنه بيَّت الأمر، فما كاد شهر أكتوبر يأتي إلا وأعلن عن محاولة الإخوان المسلمين اغتياله في المنشية بالإسكندرية أثناء إلقاء خطابه فيها يوم 26 من أكتوبر، وأثناء الخطبة انطلقت عربات المباحث تجوب مشارق البلاد وغربها تحصد الشباب لتودعهم في السجون بدون تهمة، وزجَّ بهم في محكمة ظالمة حكمت عليهم بأحكام متفاوتة ما بين خمس سنوات حتى الأشغال الشاقة والإعدام!!.<br />المجاهد عبد المنعم سليم جُبَّارة<br />فنهض بعض شباب الإخوان برعاية أُسَر هؤلاء المعتقلين، وجمعوا المال ووزَّعوه عليهم، غير أن هذا التنظيم اكتشفته المباحث واعتقلت أفراده، والذي كان عبد المنعم جبارة أحد أفراده وقُدِّموا للمحاكمة، وحكمت على كثير منهم بالأشغال الشاقة المؤبدة، وكان واحدًا من الذين حُكِم عليهم بذلك!.<br />عُذِّب عذابًا شديدًا حتى إنه يقول: \"مكثت في السجن الحربي ثلاثة أشهر قبل المحاكمة، ذقْنا خلالها أنا وإخواني شتَّى أنواع التعذيب تحت إشراف مسئولي الداخلية، وقد مات بالفعل أناس بسبب ذلك، أذكر منهم \"محمد الديب\" رحمه الله؛ فقد كانت حصص التعذيب يومية، من المساء حتى الصباح الباكر؛ حيث كان يتم التحقيق تحت سياط التعذيب بعد المغرب، وعلى سماع أغاني \"أم كلثوم\" وغيرها، فقد كانت السياط والكرابيج تشرِّح الأجساد وتُلهب الجروح، وقد تعفَّن جسد أحد إخواننا بسبب كثرة الضرب بالسياط مع غياب أي رعاية صحية!!، فلم يكن موجودًا سوى زنزانات بشعة مخصَّصة للتعذيب، وغرف للصعق بالكهرباء، وأخرى مليئة بالماء، يوضع فيها السجين حتى أنفه وأجساد معلقة على (العروسة) تنهال عليها السياط في السجن الحربي، الذي كان سلخانة بالفعل للتعذيب يقوم به زبانية\"!!.<br />رحل إلى سجن طرة؛ حيث شهد مذبحة طرة التي ارتكبها عبد الناصر وزبانيته في أول يونيو 1957م في حق الإخوان الموجودين في السجن، وكان أحد الذين نجَوا من هذه المذبحة المروّعة، وفي هذا يقول الأستاذ جابر رزق: \"لقد أقيمت المذبحة في أول يونيو 1957م لمائة وثمانين من الإخوان المسلمين، هم الذين بقوا في سجن ليمان طرة بعد ترحيل إخوانهم إلى سجن المحاريق وبني سويف وأسيوط وغيرها من السجون، وقد استُشهد أكثر من عشرين من الإخوان، وفقد عقله أكثر من هذا العدد؛ حيث استُشهد كلٌّ من: أنور مصطفى أحمد، والسيد علي محمد، ومحمود شعبان، وأحمد حامد قرقر، ومحمود عبد الجواد العطار، وإبراهيم أبو الدهب، ورزق حسن إسماعيل، وغيرهم..، واستطاع عبد الناصر أن يحيط المذبحة بجدار من الصمت والتعتيم حتى لا يعرف الشعب المصري شيئًا عن المذبحة\"!!.<br />غير أنه ذاق العذاب الشديد؛ حيث رحل مع مجموعة من إخوانه إلى سجن الواحات؛ حيث الصحراء المقفرة والجو المتقلِّب، فما لان ولا أيَّد ولا هادن ظالمًا، وظل ثابتًا راسخًا على دعوته ومبادئ فكرته التي تربى عليها، وبعد الواحات رحل مع إخوانه إلى سجن قنا حيث قضى فيه حتى عام 1974م<br />عبد المنعم صحفيًّا<br />بعد أن قضى المجاهد ما يقرب من عشرين عامًا خلف الأسوار خرج منها ولا يملك من حطام الدنيا شيئًا، فطُبِّق عليه ما طُبِّق على باقي الإخوان؛ حيث عمل في وزارة التربية والتعليم موجِّهًا بالتعليم الثانوي، وفي عام 1976م انضمَّ إلى مجلة \"الدعوة\"، ثم أُعير إلى الإمارات العربية المتحدة ليعمل في مجال التدريس، غير أنه لم يتحمَّل البعد عن إخوانه فعاد لمصر ليستقر فيها ويشارك أستاذه التلمساني وإخوانه العمل على عودة الجماعة وتنظيم هيكلها.<br />كان يعطي الدعوةَ كل وقته، حتى إن زوجته تصف الحال وتقول إنه كان قليلاً ما يجلس معنا بسبب أسفاره الكثيرة إلى الشرقية وعمل الصحافة، وتصفه بقولها: \"كان زوجي نسمة لطيفة في حياته ومماته، كان معلِّمًا منذ أول لحظة ارتباطنا، منذ أن ارتضينا هذا الطريق نقطعه معًا إلى الجنَّة، فبدأنا بشقة صغيرة في شبرا الخيمة، ولم أشترِ فستان زفاف، بل استعرت فستان أختي، وعقدنا زواجنا بمسجد صلاح الدين بالمنيل في حفل عائلي صغير، ثم فَتَحت علينا الدنيا أبوابَها، فتدفَّق المال، ولكن كل هذا كان في يده لا في قلبه.. لم يغيره فيض العطاء بعد طول الحرمان؛ لأنَّ قلبه قد تعلق بأمل آخر؛ الجنة، رغم حياته الزاخرة لم يكن يذكر ما حدث له إطلاقًا، بل كنت أعرفه من الكتب ولا أحدثه فيه، كان يشعر بأن ما يقدمه لدعوته هو كنزه، فكان أحرص ما يكون عليه، وعلى ألا يطَّلعَ عليه أحدٌ، فلا أذكر أنه روى لنا ما حدث معه في السجن إلا مرةً واحدةً، كنا نشكو من شدة الحر، فشرد ببصره قليلاً ثم قال: سبحان الله!! لقد كانت تأتي على الإخوان أيام في سجن قنا نظن فيها أنَّ الموت يكاد ينالنا من شدة الحر، وإذا بالمولى عزَّ وجل يرسل ما يلطِّف به الجو فيخفِّف عنا والجنود حولنا في ذهول، وحينما كنت أرى إصابات جسده من أثر التعذيب وأسأله عنها كان ينكر بشدة ويتهرَّب من أسئلتي\".<br />لقد أعطى دعوته وعمله الصحفي وقضية فلسطين اهتمامًا كبيرًا وأفرد لها من كتاباته الكثير، وأخذ يخدم دعوته من منبره الصحفي، وظل كذلك حتى ترجَّل الفارس عن فرسه في صباح يوم الجمعة 27 رمضان 1423هـ= الموافق 21 نوفمبر 2003م."
