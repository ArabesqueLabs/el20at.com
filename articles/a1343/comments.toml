subject = "eygpt_cairo"
author = "لا كلام فاضي بتاع بنات ولاشاب م حاسين بالمسؤليه احنا هنا فين في امريكا ولاايه الله يرحم فعلا الحكاوي اللي كنت بسمعها عن ايام زمان السبب في كده الانتفاح والله بلا قلت حيا قال الشااااااااارع انهي بنت محترمه اصلا بنت ناس تعد في الشارع وتفضله عن بيتها بلا كلام فاضي اكسر للبنت ضلع يطلعلها 99"
text = "علي فكره انا سني مش كبير قوي ولا انا نغه صغيره عشان يمكن تقول ده كلام ام متحيزه لجيلها هههههههه انا سني 21 ومتعلمه تعليم عالي وبحب الضحك جداااا مش معقده يعني بس لازم تكون التقاليد والعادات حكمانا ولا بئي مش هيكون في ادب ولا تربيه<br />معلش طولت عليكم بااااااااااااااااي بئي"
