order = 1
subject = "سلام عليكم"
author = "الله ياجماعه هذه بنت ساقطه ومنحطه ومش متربيه الانه اهلها فاشلين وأسقط منها ..بالطبع حاينجبوا بذره سيئه مثلهم كيف نار الشارع وجنه البيت كيف هذا الكلام البايخ هذه مين رح يرتبط فيها ...لا وأيه تعترف انها تعرف على شباب كثير وشربت حاجات كثير فرحانه بنفسها تقول فى هذا الكلام..أخس ومليون اخس على هيك بنات"
text = "وحيد من ليبيا"
archived = "2006-11-02"
