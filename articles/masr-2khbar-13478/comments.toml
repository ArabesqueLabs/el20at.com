text = "الذى سيسأل عن هذا هو رئيس الدولة ورئيس الوزراء امام اللة<br />13سنة يعنى المفروض تكون فى مدرسة اعدادى فى صف اول اعدادى<br />انما الفقر دة دفع اسرتها لتشغلها خادمة لتعول اهلها"
