text = "الفقر الدكر<br />شهدت مصر فى تاريخها فترات فقر وجدب وانحطاط ولكن لم تصل ابدا الى اسوا امورها مثل ما نعيشة الان فى ظل هذا النظام الملصوق بكرسى الحكم بغباء متوافر<br />الفقر الدكر<br />يجعل امراة ساقطة تحصل على بنت صغيرة عمرها 13 سنة لتعمل كخادمة فقيرة من اسرة فقيرة جدا كا الكثير مما نراة حولنا<br />وهذة الساقطة يزورها طلاب المتعة الحرام من العرب وبتوع الخليج فتزوجهم تلك البنت ليناموا معها تحت بند الحلال<br />ويسافر الخليجى الحيوان الى بلدة لياتى اخر فتزوجة العاهرة البنت مرة اخرى وتقبض من ورائها<br />ميراث ثقيل من الالم والفقر"
archived = "2010-03-14"
