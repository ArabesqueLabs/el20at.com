subject = "هل للاقباط مشاكل ؟ ام هم من يصنعون المشاكل للاخرين"
author = "واحد مستغرب جدا"
text = "الاقباط يعيشون فى وهم مرضى كبير شرحة لى احد الاقباط فى قعدة مزاج فى معاقرة بنت الحان فى الغردقة<br />قال القبطى بعد ان افرط فى الشراب<br />انهم يقولون لنا فى الكنيسة ان الاندلس كانت مسلمة 100 % لمدة 400 سنة وكان الاسلام فيها فتيا وقويا ولكنهم النصارى هناك تمكنوا من تنصير جميع السكان وطرد البقية المسلمة التى رفضت التنصير الى الشواطىء الافريقية وهى المغرب والجزائر<br />ويريدون هؤلاء القسس تنصير مصر على طريقة الاندلس<br />ويصرون ان هذا اليوم سيأتى<br />ويرتدى القسس اللبس الاسود حتى يتنصر المسلمون فيغيرونة الى اللبس الابيض<br />وربما يحلمون ان يحقق الحلم احدهم<br />ويطلبون رجلا قويا قريبا بحكم الوراثة من ملتهم<br />ولكن ساء ما يحلمون<br />ويظهر ان اخرتهم تقترب ---- وبسرعة"
archived = "2008-07-01"
capture_url = "https://web.archive.org/web/20080701001133/http://masr.20at.com:80/newArticle.php?sid=16516"
