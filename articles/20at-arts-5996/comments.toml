subject = "أيها السادة ... العشريناتية"
author = "محمد السيد"
posted = "2007-05-24"
text = "أنا عندي سؤال لعشرينات ؟؟<br />من كل جمهور الموقع ... ولو عممنا شوية .... من شريحة الشباب بالخصوص ...<br />كام واحد من الموجه إليهم الصالون ده قرأوا روايات في حياتهم ؟<br />مش حاسأل كام واحد قرأ آخر رواية للأستاذ علاء الأسواني ....<br />سؤالي بطريقة تانية .... يوم ما أعمل صالون أشوف إيه أو مين أكثر ما يجذب أو يخاطب أو يهم الشريحة الموجه إليهم الموقع \" عشرينات شباب النت \" وأعمل الصالون في ضيافته و أجمع أسئلتهم له ؟؟؟<br />علي فكرة ده يسري علي أي كاتب روائي تاني برضه ...<br />أنا مش بأتكلم عني \"بس\" .... أنا باتكلم عن \"الشباب بصفة عامة\" ....<br />خاطبوا الناس في اللي يهمها بلغتها باللي يحبوه باللي ممكن يستنوه ويسمعوا له .... وأفيدوهم من ده كله ...<br />ممكن أسكت ؟؟؟<br />مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري\" بس مش كده أوي يعني .. \"34\" مرة واحدة؟؟\"<br />دلوقتي تقدروا تروحوا هناك ... وتشرفونا خلاص ...<br />www.mesh7askot.blogspot.com<br />mohamedmat@hotmail.com"
archived = "2010-03-14"
capture_url = ""

