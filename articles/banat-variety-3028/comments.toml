capture_url = "https://web.archive.org/web/20110706135441/http://www.20at.com/banat/variety/3028-2009-11-04-14-11-26.html"

[[comments]]
order = 13
subject = ""
author = "osaamaaa"
posted = "2008-04-12"
text = "على فكرة العنوسة بسبب الأهالى ..وتقاليد المجتمع السيئة ..لو الناس تمشى حسب تعاليم الدين وتيسر المهور وتدور على الدين والخلق ..زى ما ربنا أمر الحياة هتبقى أجمل..لكن الناس بتدور على المادة أولا ..أما ثانيا فالمادة برضه..!!!.الحاجة المرة قوى إن الأسر المتدينة زيها زى الأسر العادية لأن الدين للأسف بقى عند كثير من الناس منظر بس؟؟ معلش يا جماعة أعذرونى أصل أنا مكوى شوية من الموضوع ده!!<br />وخدوا عندكوا بقى: أحسن بنت خلقها ربنا مين؟؟؟؟<br />إيه مش عارفين ولا إيه..؟؟ أحسن بنت (فاطمة بنت النبى صلى الله عليه وسلم) إتجوزت فى بيت من طين على طرف المدينة على حصير ووسادة حشوها من الليف ومهرها كان درع من حديد؟؟ هاتولى أكتر واحدة متدينة النهاردة توافق تتجوز بالشكل ده؟؟ أو يوافقوا أهلها على عريس ظروفه زى ظروف سيدنا على كرم الله وجهه وياريت ما حدش يقولى هاتلنا واحد زى سيدنا على واحنا نوافق..علشان برضة ما فيش واحدة زى ستنا فاطمة رضى الله عنها..!!<br />ربنا يقول (( إن يكونوا فقراء يغنهم الله من فضله)).. والناس تقول : لا زم نأمن مستقبل البنت!! أعوذ بالله<br />كمان مع دور الأهالى دور الإعلام.. اللى بيعرض علينا ليل ونهار بلاوى مسيحة خلت الشباب بيدور على شريكة حياه دميه ..قصدى ستايل ..؟؟ والبنات بتدور على شاب كاو بوى ( بقره يعنى) المهم إنه يكون مريش قصدى مروش؟؟ وبيحطوا شرط الدين برضة على جنب كدة!!<br />المشكلة إن شباب كتير قدروا يبقوا كاو بوى ..وقدرو يتروشوا ..بس مش قادرين يتريشوا…ليه بقى ؟؟؟<br />علشان دور ستنا الدولة اللى مش موفرة للشباب أى فرصة عمل ..يا حبة عينى؟؟<br />إلا إذا حبيت تشتغل مدرس بالقطعة..أقصد بالحصة؟؟ زى حالاتى؟؟ بمرتب وقدره 105 جنية ..هتصرفه على الصاندوتشات فى الفسحة؟؟<br />والله مش عاجبك إضرب دماغك فى ال…لأ مش ف الحيط؟؟ علشان ممكن الحيط تحصلوا حاجة ويبقى إهدار للمال العام…إضرب دماغك فى القطاع الخاص..ومش هيشغلوك لأنهم عاوزين آنسة حسنة المظهر ملفوفة القوام خبرة 7 سنوات!!وانت لا مؤاخذة قاومك مش هتقدر تلفة أبدا؟؟!! وما عندكش خبره؟؟<br />…إيه ده !! أنا الظاهر سرحت أنا آسف ياجماعة؟؟ باى باى…"
archived = "2011-07-06"
capture_url = "https://web.archive.org/web/20110706135441/http://www.20at.com/banat/variety/3028-2009-11-04-14-11-26.html"

