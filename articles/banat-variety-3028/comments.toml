posted = "2008-03-29"
text = "ههههههههههههههه ههههههههههههههه ههههههههههههههه ههههههه<br />عانس<br />مساكين<br />الكل يقول عليهن عوانس<br />لو دفنوكم أحسن بدل هذي الكلمة الشاب يحترموه …احتراما بيسموه عازب<br />والبنت تحقيرا لها بيسموها عانس<br />للأسف مجتمع متخلف لايراعي المشاعر ولا الأحاسيس ولا حتى انتقاء الكلمات<br />بالله عليكم مامعنى أو أصل كلمة عانس<br />هي أصلا لاتنطق الا من متخلف يريد الاستهزاء<br />للأسف ياعرب أتمنى أن ترتقوا قليلا واتركوا هؤلاء الآنسات لوحدهن هن الأقدر على حل أمورهن لوحدهن<br />لأنهن أقوى من موقع سخيف تافه يهتم بكلمة لامعنى لها ولا يحترم مشاعر الغير"
