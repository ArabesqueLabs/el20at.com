subject = ""
author = "osaamaaa"
posted = "2008-04-12"
text = "والله زمان يا عشريناتية ..أنا النهاردة أول مرة أدخل الموقع يمكن من سنتين ..وإيه الحلاوة والحاجات الجديدة..ما شاء الله واحشينى موت والله يا خوفى لتكونو مش فاكرينى يا ولاد الذين؟<br />فاكرانى يا هبة ولا لأ؟؟ أنا علقت على موضوعات ليك ؟؟ إيه مش فاكرة ولا إيه…موضوع منهم كان إسمه إيه ..كان إسمه يه؟؟ إيوة افتكرت كان إسمه((حب الملتزمات دموع وآهات))<br />إيه لسة مش فاكرة برضة ..يا دى النيلة أقولك ..سلام يا هبة؟؟"
