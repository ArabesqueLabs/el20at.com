text = "مش عارفه ليه فى مجتمعاتنا العربيه لما البنت توصل لسن مابعد ال 24 ،25 سنه تبدأ كلمه عانس تطاردها ونظرات الناس وكلامها وتعليقاتها (البايخه)لامؤاخ ذه<br />اعتقد انها ثقافه مجتمع توارث عن اجيال عتيقه ايام تاتا وجدو علشان كان على ايامهم مفيش مشكله اصلا<br />ورغم ان مشاكل العصر كتير بطارد الشباب الا ان الكلمه هى هى العنوسه ماتغيرتش<br />مش عارفين ان كلمه عانس قد ايه بتجرح البنت ومش هيعرفوا الا لما يبقى عندهم بنت فى نفس الموقف فيبطلوا كلام<br />على كل حال الزواج مش اخر امال البنت لكن اللى بيدفعها للتفكير فى الزواج هو فى الغالب ثقافه المجتمع العتيقه<br />ياريت ثقافه المجتمع تتغير لان ظروف الحياه اتغيرت الى الاصعب"
