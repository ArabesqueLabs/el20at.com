author = "انا مش عانس انا انسانة"
posted = "1970-01-01"
text = "انا يمكن لسة مابقتش عانس اوى انا عندى 26 سنة بس بمنطق عليتنا اللى بيتجوزو فى سن ال18 20 بالكتير اوى فانا مش عانس بس فانا خلاص ادور على دار مسنين !!!!!!!!! لدرجة ان اهلى بداو يطالبونى بتنازلات لارضى ع اى عريس واحد يعنى 40 عادى وفعلا انا بستغل وقتى باسلوب كويس بشتغل فى مكان محترم بقيت نائب مدير فى سنى دة وعملت دبلومة محاسبة فى عين شمس وكنت فى نفس الوقت بعمل واحدة فى الجامعة ا لامريكية واجتازت الاتنين بنجاح وبعمل حاليا ماجستير فى ادارة الاعمال فى الجامعة الامريكية ودة احسن ماضيع وقتى وفلوسى على واحد من ال[ *** ]ان الللى مش اد كدة اللى بيجبهوم عليتى<br />فى ناس بتبقى فاكرة ان البنت ل ما بتكبر شوية بيتضطر تقدم تنازلات دة كان زمان دلوقتى البنت اللى سنها بيتاخر على الجواز بمزاجها مش بتتجوز اللا فى مزاجها<br />اما مشكلة الامومة فتغلبت عليها زى ماغيرى عمل اتكفلت باحد البنات الصغيرات فى احدى ملاجىء الكنيسة - انا مسيحية - وبقضى معاها يوم الجمعة والسبت ودخلت السنة دى الحضانة وبجد لو خلفت هاعرفها على ولادى على انها اختهم"
archived = "2011-07-06"
capture_url = "https://web.archive.org/web/20110706135441/http://www.20at.com/banat/variety/3028-2009-11-04-14-11-26.html"

