text = "سلام عليكم جميييييييييييعا ً…<br />الأخت المسيحية.. بصراحه برافوا عليكي…كده البنات ولا بلاش…شغل و عمل خيري و تبني لطفلة…<br />ربنا يباركلك فعلاً و يهدينا و يهديكي..<br />ربنا خلق البنت عشان تشتغل في الدنيا مش عشان تستنى الجواز و عريس ال____<br />وانا شايف ان العانس هي اللي قاعده في بيتهم مستنيه \"عريس\" و مش بتعمل أي حاجه لا لنفسها و لا لمجتمعها و لا لبلدها..>;>;>;>;>;>;>;>;>;>;>;>;هي دي العانس والباقي زي الفل ما شاء الله..<br />أخوكم محمد.."
