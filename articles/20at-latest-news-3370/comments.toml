subject = "ولما ..........؟"
author = "بسلة مسلمة مصرية"
posted = "2007-03-06"
text = "ولما التعذيب ؟<br />هل الارض ضاقت باهلها ؟<br />هل الرزق ضن على الناس ؟<br />لما التعذيب ؟ ولما الحروب ؟ ولما الخلاف ؟<br />فان الله يمنع ويمنح ويهب ويرزق ويقدم لنا الخير فلما نقدم لبعضنا الشر ظ<br />الاجابة سهلة ولكن مضمونة صعب ...............انها النفس البشرية الامارة بالسوء .<br />لنا الله بنى ادم .........لنا الله بنى ادم ..................لنا الله بنى ادم ."
