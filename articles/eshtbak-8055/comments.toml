posted = "2009-11-01"
text = "...................السلام عليكم ورحمت الله وبركاته..........................<br />انا والله اريد ان اشفي غليلي من كل كلب عربي ساقط ويسمي نفسه مسلم لا انه مسلم كل الذي عنده الى اليهود<br />انت يا جوزاء منتي عايشه في الواقع<br />لو انك عشت الواقع لقلتي هل من مزيد ؟<br />ان شاء الكريم ليفرجينا يوم بالعرب الخنازير التبع لعباد الصليب<br />والحمد لله رب العالمين على كل شيء وعلى نعمت الاسلام<br />.........والسلام عليكم ورحمت الله وبركاته<br />طبتم وطاب ممشاكم وتبؤتم من الجنة منزلا ان شاء الله"
