order = 7
subject = ""
author = "محمد سلامة"
posted = "2009-11-26"
text = "الى عاشق إسرائيل ...... نعم هي إسرائيل لأن من فيها ( اليهود) يستحقونها .... فهم لم يبيعوا نسائهم في الكويت والسعودية والخليج .... وهم إشتروا الأرض وأنتم بعتوها ... وهم بنوا وشيدوا وطوروا وعمروا لكن أنتم متفرغين لمعاداة العرب ومعاداة أنفسكم .... القضية الفلسطينية يتم حلها برميكم في البحر .... طال تخريبكم وحقدكم كل البلاد العربية بدأ بمملكة الأشراف القادة العظام وشعبهم الأبي الأردني .... حين تآمر زعران منظمات الدجل والعهر والماركسية الكافرة والمتدينة الكاذبة لقلب النظام وأصبح الطريق الى القدس من عمان بعد كل الشهداء الذي سقطوا لأجل الأرض المقدسة ... ثم عثتم فسادا\" في لبنان وتونس ولكن في سوريا بقيتم تحت الجزمة وهو الأسلوب الأمثل للتعامل معكم ... أنتم بكل بساطة مجموعة من النور والغوغاء ليس لكم كبير ولا تطيعوا كبير .... تعشقوا الفوضى وعربات الخضار وأكل الكرشات وشم الأغو والمخدرات والزعرنة والبلطجة .... حثالة الشعوب وتستحقوا ما أنتم فيه وأكثر .... اللهم سلط عليهم أعدائنا وأعدائك شارون ونتنياهو وموفاز وغيرهم ليكونوا عبرة لناكري الجميل القذرين"
archived = "2010-03-14"
capture_url = ""
