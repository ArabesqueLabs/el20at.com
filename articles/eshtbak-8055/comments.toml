posted = "2008-02-06"
text = "هذا هو واقع وحال العرب اليوم في تهاون وتخاذل وخضوع واستسلام وذل وهوان .. ورفع الرايات البيضاء عالية خفاقة لكي نرى تهاوننا وتخاذلنا _ ونحن في آخر انبساط وفرحيين جداً _ .. فأين هي مكانة الإسلام والمسلمين _ سابقاً _ وأين هي مكانتهم الآن ؟؟!! لا شــــــ على الإطلاق ـــــــــــــيء ...!!!<br />وماكل مايتمناهُ المرء يدركهُ ... تجري الرياح بمالاتشتهي السفنُ ..."
