[[comments]]
order = 1
subject = "شبابنا شباب الهمة والنشاط"
author = "أبو عمر"
posted = "2008-07-19"
text = "الشباب هم المستقبل الموعود المأمول إنشاء الله تعالى<br />ولن تصلح امه إلا بصلاح شبابها<br />اللهم ألهم أعطي شبابنا القوة والهمه لخدمة دينك يا أرحم الراحمين"
archived = "2010-03-14"
