[[comments]]
order = 2
subject = "التطوع"
author = "بن علي"
posted = "2008-07-19"
text = "اجمل ما اسعدني هو العمل التطوعي الذي نفتقده كثيرا ..<br />ومن رأيي ان مجال المرور فعلا بحاجة الى تطوع لكثرة الحوادث وعدم التقيد بانظمة السير وخاصة افضلية السير لمن بداخل الدوار ... المجال التطوعي مجال رائع يزرع الثقة في شبابنا ويحفزهم لبذل المزيد من العمل في خدمة المجتمع ..<br />اشكرك اخوي علي ونرتقب جديدك"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 3
subject = "اليمن(صنعاء)"
author = "احمد جحيدله"
posted = "2008-07-19"
text = "والله في الحقيقه شيء طيب انه الشباب يقوموا بعمل مثل هذا العمل لانه مدينه جده فيها اماكن كثيره زحمه فالما ينظموا المرور ويفكوا الزحمه هذا شيء طيب كذا تكون مدينه جده منظمه وحلوه .... والله الموفق"
