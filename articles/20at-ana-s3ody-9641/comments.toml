text = "أفضل المراكز الصيفية التربوية والرياضية عن هذا البرنامج ....<br />لأنه كما قال أحدهم في المقال رجال المرور أكثر من السيارات ...<br />لكن على الأقل إن كان ولا بد صديق المرور أفضل حالاً من التسكع في الشوارع ...<br />شكراً علي"
