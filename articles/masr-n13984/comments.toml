[[comments]]
order = 4
subject = "خيراً"
author = "نهي"
text = "و الله أنا مش عارفة الناس هنا في مصر بيتعاملوا مع موضوع الحمامات دم كأنة حاجة عيب أو حرام لا سمح الله ..... إزاي مواطن يفكر إنة يخش الحمام عادي كدة ؟؟؟؟؟؟؟؟؟؟؟<br />انا كنت عايشة في فرنسا زمان سنة 86 و و الله العظيم تلاتة الحمامات دي كانت موجودة من ساعتها في الشوارع و حاجة زي الفل و في منتهى التقدم !!!!!!!!"
archived = "2008-01-28"
capture_url = "https://web.archive.org/web/20080128113316/http://masr.20at.com:80/newArticle.php?sid=13984"
