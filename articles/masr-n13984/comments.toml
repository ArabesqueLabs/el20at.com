[[comments]]
order = 0
subject = "اخيرا بدأنا نفهم"
author = "تخلف عقلى"
text = "اخيرا بدأنا نفهم حاجة - موزمبيق وبوركانا فاسا وكينيا وعينيا وبلاد الواق واق -عاملة الانظمة دى وعندها دورات مياة فى الميادين والشوارع من زمان من قبل بتوع 7 الاف سنة حضارة<br />مبروك واللة فرحت وانشرح قلبى لاننى فى مرة اتزنقت فى العتبة وكنت هااعملها على نفسى ولكن ربنا ستر ودخلت قهوة فيها حمام ودفعت لصبى القهوة المعلوم واستخدمت دورة المياة بتاع القهوة<br />بس الانجاز العملاق د\\ة اللى هيدخل التاريخ جاى بتوجيهات من مين"
archived = "2008-01-28"
capture_url = "https://web.archive.org/web/20080128113316/http://masr.20at.com:80/newArticle.php?sid=13984"

[[comments]]
order = 1
subject = "سيادة اللواء"
author = "gh"
text = "المبكى فى الموضوع ان اللى هيشرف على التشغيل والصيانة حسب ماجاء فى التحقيق سيادة اللواء<br />هل بيدرسوا فى الكليات العسكرية مادة اسمها تشغيل وصيانة الحمامات العامة<br />مال اللواءات ومال الحمامات العامة والا كتر لواءات عندنا<br />والا عسكرة البلد وصلت للحمات والمطابخ والبوفيهات<br />ابشركم - الحمامات دى هتستمر لمدة 6 شهور وها تبلغ فرار من كتر صفا وانتباة وللخلف در وللامام مارش"
archived = "2008-01-28"
capture_url = "https://web.archive.org/web/20080128113316/http://masr.20at.com:80/newArticle.php?sid=13984"

