[[comments]]
order = 2
subject = "ذكرى النكبة"
author = "%^&^%$--@"
posted = "2008-05-16"
text = "اليوم 15 مايو<br />ذكرى نكبة فلسطين وقيام اسرائيل<br />ذكرى الاف الشهداء المصريين فى حرب 48 وحرب 56 وحرب 67 وحرب 73<br />البعض فى بلدنا يحتفل بقيام الشقيقة اسرائيل فى شرم الشيخ<br />ونحن الشعب المصرى<br />نحتفل بالوقوف حدادا على ارواح شهدائنا الذين سقطوا على التراب الوطنى والتراب الفلسطينى<br />احتل الصليبيون بلاد الشام ودخلوا المسجد الاقصى بخيولهم بل وجعلوة حظيرة للخيول<br />ولكن بعد 200 سنة من الاحتلال<br />خرج من مصر<br />الناصر ابن قلاوون<br />وابنة محمد بن قلاوون<br />وتبعهما<br />اشرف ابن قلاوون<br />حتى تمكنوا من طرد اخر جندى صليبى الى البحر<br />خرجوا جميعا من مصر<br />نحن لن ننسى شهدائنا<br />وجيل بعد جيل لن ينسى<br />حختى يأتى قلاوون من جديد"
archived = "2010-03-14"
capture_url = ""
