subject = "\"ألوان السما السبعة\" ,والنجوم في عز الظه"
author = "مش رضوى حسن ولا ياسر ابو العلا"
posted = "2008-05-15"
text = "\"ألوان السما السبعة\" ,والنجوم في عز الظهر<br />أرسل هذا التعليق بواسطة : مش لازم<br />يا بنت الحاج عبدالفضيل ان شاء الله حتاخد جايزه عن الفيلم<br />بس احنا المصريين شايفين الوان السما السبعة والنجوم في عز الظهر<br />هما ياخدوا جوايز واحنا نروح امن الدولة لاظوغلي<br />شاطره يا بنت الحاج عبدالفضيل كويس اوي التقدم بتاعك وان شاء الله في المرات القادمة تعملي تحقيقات احسن واحسن واحسن<br />ومزيدا من التقدم باذن الله وكل عام وانتم بخير"
