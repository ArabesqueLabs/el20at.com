subject = "أسطورة المجاهدين"
author = "أميمة الشاذلي"
posted = "2008-03-24"
text = "الشهيد لا يموت.. فالشهادة حياة..كما أن الأساطير لا تموت.. بل تبقى دائماً أبداً تتناقلها الأجيال جيلاً بعد جيل<br />والشيخ أحمد ياسين سيظل رمزاً وأسطورة لكل مجاهد.. وهو فخر لكل عربي.. وسام على صدر كل فلسطيني..وعربي<br />فيكفينا فخراً أن الصهاينة كانوا يرتجفون رعباً كلما ذكر اسمه..فاسمه يعني لهم الدمار والموت..والعمليات الارهابية الشنيعة.. على حد زعمهم<br />إن الشيخ أحمد لم يمت.. لقد متنا نحن وما زلنا<br />ما زلنا نذوق طعم الموت كل يوم..كل ساعة.. بل كل لحظة<br />مع كل طفل تمزقه الصواريخ..مع كل امرأة تصرخ ولا مغيث.. مع كل شاب يسجنه الغاصبون في معتقلاتهم العدوانية<br />أما الشيخ أحمد ياسين..فقد انتقل الى مكان أفضل مما كان فيه..فهنيئاً له جنات الخلد..بل هنيئاً لجنات الخلد به"
