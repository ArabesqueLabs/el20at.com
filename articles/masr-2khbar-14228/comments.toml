author = "جهل اخوانى"
posted = "2009-12-03"
text = "يتهم الاخوان الحكام فى مصر بلفظ الفرعون ويقولون الفرعون السادات الذين قتلوة والفرعون اللى بعدة<br />الفرعون ليست شتيمة يا جهلة<br />انتم عارفين القران بيتكلم عن الفراعنة ازاى وكيف كانت حياة المصريين ايام الفراعنة اسمعوا كلام القران عن الفراعنة الحكام<br />( كم تركوا من جنات وعيون وزروع ومقام كريم )<br />اذن تركوا البلاد اللى هى مصر جنات وعيون وزروع والمصريون يعيشون فى مقام كريم<br />كان الفراعنة عظام<br />وكانت الناس تعيش فى مقام كريم والبلاد كلها جنات وعيون وزروع<br />اما الفراعين بتوعكم بتوع هذة الايام<br />فقد تركوها بلاقع وخراب<br />فلا تشبهوا بجهلكم حكام هذة الايام بالفراعين<br />يا اخوان الجهل"
archived = "2010-03-14"
