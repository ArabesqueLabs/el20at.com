author = "من انتم ؟"
posted = "2009-12-03"
text = "من هم الاخوان المسلمين ؟<br />هل هم جماعة دعوة وارشاد وامر بالمعروف ونهى عن المنكر ؟<br />ام ظاهرة سياسية تجرى وراء الترشيحات والانتخابات فى النقابات والمحليات ومجلس الشعب والشورى - يعنى حزب سياسى غير معلن وبيشتغل من تحت الترابيزة لصالح الحزب الوطنى بحيث يظهرة الحزب الوطنى كانة فزاعة امام المسيحيين وامام امريكا ودول الغرب با ننا لو تركنا الحكم فسيحكم هؤلاء كما حكمت حماس فى غزة - اذن الجماعة تخدم الحزب الوطنى وموظفة فى خدمة التوريث والفساد السياسى<br />-- اما اذا كانت جماعة دعوة واصلاح وارشاد وامر بالمعروف ونهى عن المنكر فاين الكتب التى الفوها والمطبوعات التى ابدعوها<br />كم كتاب نشرتة جماعة الاخوان فى تعليم الناس اصول دينهم وترقية فكرهم<br />انا لااعرف<br />ولا اعرف ان فضيلة المرشد ولا الدكتور فلان او علان كتب كتابا واحدا حتى فى تخصصة<br />يا اهل الجماعة<br />التبس الامر علينا - انتم عايزين اية وبتعملوا اية - والاهم كمان لية"
archived = "2010-03-14"
