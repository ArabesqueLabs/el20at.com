[[comments]]
order = 2
subject = "أهلا يا براء يا حبيبي"
author = "مصطفى عاشور"
posted = "2007-05-27"
text = "في البداية عزيزي براء أعرف أنك تزن مني اثنين لكن انت صحفي جيد<br />اعترف أنني ربما قسوت في النقد على حسام، وانأ متأكد أن حسام قسى في النقد على عمرو خالد، وأعرف أن عمرو خالد قسى في إدراك موقعه والدور الذي لعبه<br />لكن أؤكد أننا لا نحتاج إلى النظرة الوردية التي اتهمني بها براء، فأنا أكثر من وردي في بعض الأمور لكن هذا لا يمنع من أننا جميعا في ححاجة إلى نعرف كيف نختلف ، وما أقلقني في النقد -وهذا حق للجميع أن يمارسه بلا وصاية- أننا لا يجب أن نعتبر أنفسنا من يملكون خزائن الرحمة والمغفرة وأن الجميع يجب أن يخضعوا لنقدنا دون أن نمتلك القدرة على سماع نقد الاخرين<br />وحتى يعرف القراء فإنني وحسام نجلس في غرفة واحدة ومكتبي بجوار مكتبه، لكن هذا لا يمنع أن أقول ما في نفسي لما أظن انه صحيح<br />وأنا لا أدافع عن الإخوان كما يحاول أن يصفني براء، ولكن أدافع أنه لا أحد يمتلك الحقيقة لا الاخوان ولا حسام ولا انا ولا براء السمين هذا، ولكن ما أدافع عنه وربما مالم يفهمه براء لصغره سنه وكبر جسمه هو أنني أدافع عن أدب الاختلاف وأن تكون الحقوق متساوية للجميع<br />وعموما لك يوم يا براء وسوف أجهز لك ردا يؤدي الى انقاص وزنك<br />الموعد قريب<br />سلام"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

