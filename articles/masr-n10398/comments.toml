[[comments]]
order = 17
subject = "ركزوا شوية"
author = "محمد قرنه"
posted = "2007-05-29"
text = "لا أرى فيما كتبه براء أى إهانة لشخص الشيخ محمد حسان .. هو كتب رأيه الخاص فيما يشاهد والذي أتفق معه وقد يختلف الآخرون .. لكن ما يجب أن نتفق عليه جميعا أنه لا أحد فوق النقد .. وإن إلباس عباءة القدسية والعصمة لأى من المشايخ هو بداية طريق النهاية<br />http://adabhome.com/vb/showthread.php?t=3356<br />في الرابط أعلى سقطة كبيرة للشيخ محمد حسان على الهواء مباشرة .. عندما برر رفض سيدنا محمد صلعم زواج عليّ بن أبي طالب من بنت أبي جهل على بنت الرسول السيدة فاطمة .. واصفا بنت أبي جهل ببنت عدو الله .. وأن الرسول لم يكن هنا يحرم ما أحله الله ولكن لا يجوز أن تجتمع بنت رسول الله وبنت عدو الله في بيت واحد !!!<br />مع العلم أنها امرأة مسلمة .. ولا تزر وازرة وزر أخرى<br />مازال ينقصنا الكثير من أدب الحوار حتى لا الاختلاف<br />أحييك كثيرا يا براء"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

[[comments]]
order = 18
subject = "والله ماهو تحدى"
author = "BATISTUTA"
posted = "2007-05-29"
text = "كان اولى بيك يا براء عند وضع الشيخ حسان فى تفاصيل الموضوع ان تنتقده بشكل موضوعى كأن تذكر انك تراه متعصبا متطرفا قاعديا وغيرهامن الصفات او انه اخطأ فى كذا وكذا لكن تسطيح الفكرة فى جلباب وسواك هذا ليس عيب لان اغلبنا يلبس الجلباب فى صلاة الجمعة.<br />كذلك حشرك للاخوان فى الموضوع بدون داعى رغم ان الموضوع فى الاساس تعقيب على كاتب على كتابة كاتب عن عمرو خالد شفت اد ايه انت بعيييييييييييد عن الموضوع .<br />الاهم من كل هذا هو تحيليك الفنى الجيد لموضوع عمرووتامر فحقيقة لم اكن اعرف عنه كثيرا لكنك اضافت لى معلومات ثبتتنى اكثر واكثر على موقفى من الداعية عمرو.<br />فى النهاية سنظل نكتب ونتحاور وسيظل كل منا على موقفه لان احباء عمرو واخدين الموضوع على انه تحدى ومين اللى هيفوز .<br />انا عن نفسى اتمنى الفوز للاسلام بمفهومه الصحيح"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

[[comments]]
order = 19
subject = "مش ناقصة بلبلة"
author = "مصرى مسلم"
posted = "2007-05-29"
text = "يا عم محمد قرنة الموضوع مش ناقص بلبة وشوشرة على الفاضى الرابط اللى انت حطه وفرحان بيه اوى رابط لمقال يعنى مش لقطة فيديو او صوت بصوت محمد حسان على اللى يقرا يبقى واثق من الكلام طب ما انا ممكن ابعتك على رابط واقول مقال لمحمد قرنة بيشتم الاسلام ويكون واحد غيرك كتبه<br />الخلاصة ان مفيش تقديس لبشر ومفيش حد معصوم من الخطأ الا الانبياء بس لما احب اثبت على حد الخطأ لازم يكون بصوته مش نقل عن شخص، ياعالم بقى على ما وصلنا الكلام اتحبش بإيه مع البهارات والذى منه."
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

[[comments]]
order = 20
subject = "على رأيك :)"
author = "محمد قرنه"
posted = "2007-05-29"
text = "يا عمنا مصري مسلم<br />مادام اتفقنا على إنه مفيش تقديس لبشر يبقى مفيش خلاف من الأساس<br />واعتبر الرابط مش موجود يا ريس<br />أتفق معك أنني تحمست للمقال في الرابط دون أن أكون شاهدت الحلقة<br />وقد يكون تمت إضافة بعض التحابيش له على حد قولك إلى أن يصل .. ولكن الواقعة في المقال هي صغيرة جدا ومحددة .. واقعة تبرير رفض الرسول صلعم زواج على بن أبي طالب من إبنة أبي جهل على زوجته السيدة فاطمة إبنة الرسول صلعم من قبل الشيخ محمد حسان<br />وأخيرا<br />دم بخير"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

[[comments]]
order = 21
subject = "انتكريا الاخوان"
author = "البراء أشرف"
posted = "2007-05-29"
text = "صباح الفل عليكم جميعا..<br />للاسف اصبحنا حين نقرأ كلمة \"اخوان\"، نتوقع أن ما يأتي بعدها ستكون شتيمة ونقد وقلة \"أدب اختلاف\".. لكن يا استاذ محمد اعتقد انك بحاجة لقراءة الجزء الخاص بالاخوان بشكل جيد.. لاني في المقال لم اذكر اي نقد لهم.. بالعكس اعلنت فرحتي باهتمامهم بنشر مقال نقد لهم..<br />لكن يبدو لي شيء.. كونك تتوقع دائما الشر، وتخاف دائما من نقد الاخوان، فهذا امر ان دل على شيء فانما يدل على أن الاخوان بالفعل يمرون الان بمرحلة صعبة تظهر فيها عيوبها للجميع، فيما ينشغلون هم بالدعاء ألا ينقدهم أحد، وليس باصلاح عيبهم الظاهر والواضح..<br />على كل حال.. في المرة القادمة حين اكتب كلمة \"اخوان\" في مقال لي، فسأرسل لك طلب مرفق به أسباب ذكر الكلمة وانتظر ردك واذنك للكتابة..<br />أما نقطة انني اثير القراء لاستجلاب تعليقاتهم.. فهي \"نعمة\" وليست نقمة، وإن كنت لا اعلم عن نفسي هذه المهارة، لكني تعلمت أن الكاتب الجيد والناجح هو القادر على اثارة جدل حميد بين قراءه، والجدل هنا حميد على ما أظن..<br />اه صحيح بخصوص ذكر الاخوان.. استاذ مصطفى هو البادئ بذكر الاخوان وليس أنا .. يلا.. أشوفك بخير ان شاء الله..<br />براء"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

[[comments]]
order = 22
subject = "مش هقدر اقول جميل كالعاده"
author = "نيفين نيفى نوفا"
posted = "2007-05-30"
text = "براء انا مش هقدر اقول جميل كالعاده المره دى و احب قبل ما ابدا كلامى اعلن تاييدى لكلا من batistutaو محمد السيد فيما ذكراه من انك فعلا خرجت بالموضوع الى احاديث و خلافات جانبيه و هو ما احاول ان احذر منه المعلقين دايما على الموقع لان مثل هذا الخروج هو مت يؤدى عاده للتراشق اللفظى و الشتيمه و اظن انك عانيت و عانى المعلقين و انا منهم من جراء هذه الاهانات و لنا معها باعا طويلا و ان كنت اخذ على محمد السيد ما ذكره بشان الاخوان و اقوله فعلا يا محمد البراء المره دى لم يتعمد اهانه الاخوان<br />ثانيا انا متوقعتش منك التعليق على هذا الموضوع المقتول بحثا و تعليقا و انت عودتنا دايما على التجديد ف الموضوعات و الاسلوب و ان لم يخلو الموضوع من روح الدعابه و الانتقال بسلاسه بين الفقرات و هو ما يجعلنا نقول هو ده البراء<br />و ثالثا فيما يتعلق بموضوع الشيخ محمد حسان و لو ان طرحك لموضوع امكانيه انه كان يبقى مكان عمر ف تكرمه التايم ده امر غريب فى حد ذاته و لكن الاغرب يا براء رغبتك الغريبه فى دخول عش البابير..بتنتقد محمد حسان علنا كده و الله انا مشفقه عليك من التعليقات الجايه..انت دخلت ايدك جوه خليه نحل و انت مش قصاصد و لا قاصد<br />الله اعلم بس لو هنتكلم جد انت زودتها فيما يتعلق بموضوع الشيخ حسان لان اختزال الدين فى جلباب و سواك و ما شابه ذللك مينفعش و ان كنت اقدر وجهه نظرك فى ضروره حدوث بعض التغييرات من اجل ايصال الاسلام الى الاخر و تصحيح نظره الاخر الينا بس برده متتقالش بالطريقه اللى قلتها<br />عموما حصل خير و ربنا معاك ف التعليقات الجايه"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

