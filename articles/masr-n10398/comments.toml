[[comments]]
order = 4
subject = "تاهت ولقيناها.."
author = "البراء أشرف"
posted = "2007-05-27"
text = "إذن يا أستاذ مصطفى فقد \"تاهت ولقيناها\".. يعني إذا كنت حرتك تدافع فعلا عن أدب الاختلاف.. فتلك أرضية مشتركة أعتقد أنه من الممكن أن اقف علبها معك.. وهو ما يشرفني..<br />لكن يقلقني أحيانا الحديث عن \"الأدب\" عند الاختلاف.. خاصة وأن جماعة مثل الاخوان (التي لم اتهمك بالانتماء إليها) تعتبر أي نقد هو تطاول وخروج عن حدود الأدب.. وهو ما يجعلنا في حاجة إلى تعريف الأدب.. ومن قبله تعريف الاختلاف، ولعل هذا الدور هو ما يحاول الأستاذ عمرو خالد فعله في برنامجه الأخير \"دعوة للتعايش\"..<br />الأمر الآخر الذي أزعجني.. هو الحديث عن صغر السن.. وكبر الجسم..<br />ورغم أن حجم جسمي عيب لا أخفيه، إلا أنني أرفض اعتبار صغر سني عيب ينقص مني، وكنت أحب أن أجد من حضرتك يا أستاذ مصطفى رد على ما كتبت، وليس اتهام بأني لن أحسن فهم الأمور لصغر سني وكبر حجمي.. وكلاهما يشرفني..<br />عامة يا أستاذ مصطفى أنا أنتظر \"يومي\" هذا، وردك الذي سيفقدني وزني، وهي أمنية غالية أن ينجح ردك في فعل ماعجز عنه الدايت..<br />شرفت بردك أستاذ مصطفى وشكراً على اهتمامك.<br />براء"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

[[comments]]
order = 5
subject = "ادب الاختلاف"
author = "حسام الزمر"
posted = "2007-05-28"
text = "السلام عليكم<br />براء....<br />أرى أنك تجاوزت في التندر بالشيخ محمد حسان<br />انا فعلا أرى أنك ينقصك فهم أدب الاختلاف.<br />فاختلافك مع شخص لا يعطيك الحق في التندر به و لكن لك كل الحق في نقضه نقض موضوعي<br />{ وقل لعبادي يقولوا التي هي أحسن إن الشيطان ينزغ بينهم إن الشيطان كان للإنسان عدوا مبينا } [الإسراء:53].<br />سلام<br />حسام"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

[[comments]]
order = 6
subject = "أختلف معكم و لكنى أحترمكم"
author = "صاحبة مدونة الحلم العربي"
posted = "2007-05-28"
text = "إلى الأساتذة الثلاثة :أ/ حسام و أ/مصطفى و أ/ البراء<br />أختلف مع ثلاثتكم و لكني أحترمكم<br />أحترم أ/حسام لغيرته على شكل الاسلام و لكنى أختلف معه كلا و جزءا في أسلوب الهجوم على عمرو خالد<br />أحترم أ/ مصطفى لأنه كان ايجابيا و تكلف عناء الرد على النقد الموجه لأستاذ عمرو خالد و أختلف معه في بعض النقاط التى كان رده فيها عبارة عن هجوم مضاد بالرغم من أن الرد موجود بلا هجوم (أتكلم عن مسألة الأنا في حوار عمرو خالد و التى كان لها مبررها لأنه لم يتكلم مفاخرا بنفسه بل كان سعيد بشئ ما تحقق بإرادة الله على يده هو و معاونيه و شباب صناع الحياه).<br />أحترم أ/ البراء لأسلوبه المحترم في الرد على الاأستاذين و أختلف معه في وضعه لأستاذ عمرو خالد في إطار النجم الذي يروج لنفسه ...فلو كنت سمعت حوار مع ا/ عمرو أديب و جميع حواراته ستعرف كيف يفكر هذا الرجل ...هو لا يرد أن يكون منفصلا عن المجتمع و هذا هو اختياره ...لا تتعجب إن رأيته يوما على غلاف مجلة ليست دينية بالأصل بجوار صورة لهيفاء أو غيرها ,,,فهل يرى الطبيب إلا عند المريض ؟؟!!! هكذا يفكر الرجل و له الحرية في اختيار الطريقة التى يصل بها إلى الناس و أظنه نجح فيها ..نجح أن يصل إلى الشباب الضائع ..و نجح في أن يصل إلى الشباب المعتدل و نجح في أن يصل إلى الشباب المتدين بالرغم من أنهم عندما يصلون إلى حد معين ينسون أن كثيرا منهم لم يهده الله إلا عن طريق عمرو خالد ....<br />أظن اننا جميعا و إن اختلفنا مع عمرو خالد لابد و أن نحترمه لأنه فعل شيئا و يريد أن يبنى جسورا ...<br />و رجاء منى إلى كل من يغير على الدين بحق لا تجعلوا غيرتكم دافعا في زيادة الفرقة بين المسلمين ...فمن يريد نقد الرجل فليبعث له بما يريد على موقعه و أظن ذلك لن يعيب أحدهم<br />شكرا لكم جميعا على سعة الصدور"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

