[[comments]]
order = 15
subject = "قبل التعليق .... لي رأي"
author = "محمد السيد"
posted = "2007-05-29"
text = "بداية ... مافعله البراء كالعادة هو استجلاب الردود في مواضيع حانبية أفقدت موضوعه شيئا من اتزانه وموضوعيته الشديدة هذه المرة ...<br />كالعادة ... كثير من الردود خرجت لترد علي الأسلوب في الحديث عن الشيخ محمد حسان ... ومعهم حق ...<br />كالعادة أيضات ... تناول البراء الإخوان في تعليقه ... بلا أي داعي سوي ذكرهم بضيق الأفق وعدم تقبل الآراء الأخري ... وهي عادة لا أعرف لم لا يستبعدها البراء في مواضيعه ....<br />تناول الموضوع الظاهرة الإسلامية الحديثة \"عمرو خالد أنموذجا\" ..... ولو أردنا الحديث عن الإخوان هنا لكان للمقام منحي آخر تماما ... يصبح فيه تناول الإخوان مبررا ...<br />أما هنا ... فلا مبرر ....<br />أعترف .... بإعجابي الشديد برد البراء هذه المرة في حالة نادرة ... وبرغم بعض الخروج فيه إلا أن ذلك هو أسلوبه والذي ربما لا ينوي تغييره في الأمد القريب ....<br />هذا في البداية ....<br />بس برضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com<br />تقدروا تنورونا دلوقتي .... مش حاسكت<br />mesh7askot.blogspot.com"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

