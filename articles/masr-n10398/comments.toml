text = "لا أرى تحامل عللى الشيخ محمد حسان ،ولا أعرفلماذا كل هذا الهجوم لمجرد مناقشة أسلوب شيخ يعرض أمور قد نتفق أو لا نتفق عليها... شخصيا لا أحب الصوت العالى و لا يقنعنى الشيخ محمد حسان بأى شكل... أنتظر الان اتهامات مثل من حتى ... كيف تجرؤ... إلخ... لكنى مقتنع بإن لا محمد حسان و لا أى شيخ أخر مقدس... و فى النهاية هو مجرد رأى ...<br />براء ... هى الصحافة ... فتحمل :]..."
