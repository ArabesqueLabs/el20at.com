[[comments]]
order = 0
subject = "الشيخ الشعراوي هو الحل وكفاية شغل عيال"
author = "مش حكتب اسمي هنا"
posted = "2007-05-27"
text = "اخي القارىء حاجه من الاثنين<br />اما انك عايز تعرف دينك<br />او انك عايز تهرج<br />طول عمرنا بناخد دين في المدرسة<br />وطول عمرنا بنصلي الجمعة وطول عمرنا بنجح<br />لكن القدر وحده قادني الى انني استمع بتركيز الى دروس الشيخ الشعراوي في تفسير القران على مدار اربع سنين ونصف وحسيت انتي اتخرجت من اكاديمية اسمها اكاديمية الشيخ الشعراوي<br />اخي القارىء سيبك من الهجس اللي اسمه عمر خالد ده واعمل زي ما انا بقولك<br />واذا كان اربع سنين ونصف كتير عليكم<br />انا عايزكم تسمعوا سورة البقره فقط 55 شريط<br />وبعد كده نشوف ايه رأيكم<br />عمر خالد دا محاسب ايش اللي دخله في الدين<br />اسمعوا نصيحتي وعليكم بدروس فضيلة الشيخ محمد متولي الشعراوي في تفسير القرأن<br />استمعوا ليها بتركيز<br />بلا الاستاذ عمر خالد بلا بتاع<br />صحيح المسلم اخو المسلم لا يظلمه ولا يخذله ولا يحقره ولكن الموضوع زاد عن حده والسفينة قربت تغرق"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

