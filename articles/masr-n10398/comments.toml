[[comments]]
order = 9
subject = "الحكاية أكبر من كده"
author = "صاحبة مدونة لو كنت أعلم"
posted = "2007-05-28"
text = "أنا ببساطة شايفة غن مشكلتنا هو تبجيلنا لشيوخنا _زيادة عن اللازم_<br />يعني إحنا بنرفض أي نقض لإي من المشايخ ، ودي كارثة، لإننا بكده بقينا أقرب لمشكلة أوربا مع الكنائس حينما كانوا يبيعون صكوك المغفرة ويرفعون من علماء دينهم غلى مصاف الآلهة<br />ياجماعة بصراحة نقد البراء منسق ، بس لي عتاب صغير<br />عمرو خالد النجم لا يعيب المسلمين<br />، هو بكل بساطة مظهر راق للمسلمين في الخارج بعدما اصبحنا أمة من القتلة والسفاحين<br />أما بالنسبة لدعوته فلنأخذ محاسنها ونترفع عن ما دونه<br />نحن في زمن لا يصلح معه الجدال في مثل هذا الترف العقائدي<br />وللأستاذ عاشور<br />موضوع مش بالسن وإلا كانت بلدنا بكلكبار السن والمقام المسئولين عنها في مصاف الدول<br />ونصيحة للي عايز يتفرج على برنامج ديني كويس<br />عليه بقناة الشارقة برنامج صفوة الصفوة للشيخ عمر عبد الكافي<br />بجد مذهل"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602115932/http://masr.20at.com:80/newArticle.php?sid=10398"

