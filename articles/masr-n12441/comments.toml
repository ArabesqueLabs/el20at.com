subject = "معنى الاصالة"
author = "عادل"
posted = "2007-11-15"
text = "من الموضوع نتعلم كيف ان الشعوب المحترمة تحافظ على اصالتها<br />شوف اليابان بتعلم اطفالها لبسهم الوطنى القومى ومتمسكين بة<br />يا ترى احنا لنا زى قومى خاص بنا احنا المصريين<br />لية اليابان لما تقدمت ما لبسوش زى الغرب واصبحوا افرنكة زينا<br />احنا مفهومنا ان التقدم نلبس بدل وفساتين زى الغرب نقوم نبقى زيهم<br />اليابانى بيلبس الافرول فى العمل والبدلة فى المكتب لكن لما بيرجع البيت بيلبس اللبس اليابانى التقليدى<br />نفسى نحافظ على الجلابية البلدى والعباية والحريم على الطرحة والمنتديل ابو قوية<br />اتعلموا من الشعوب<br />شكرا على المقال وموضوع جيد ورائع يا اخت مروة"
archived = "2007-11-16"
capture_url = "https://web.archive.org/web/20071116014244/http://masr.20at.com:80/newArticle.php?sid=12441"
