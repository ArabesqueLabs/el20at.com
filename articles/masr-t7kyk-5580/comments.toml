order = 1
subject = "طبعا رامى سعيد"
author = "Heba"
posted = "2007-05-06"
text = "لم اكره لا عبا ارتدى فانلة الأهلى أكثر من رامى سعيد وأشعر بالضيق لمجرد أنه كان لاعبا بالأهلى بل وأعتبر أحد انجازات عدلى القيعى أنه استطاع ايجاد عقد بيع لهذا اللاعب..هذا بالطبع الى جانب المشاغب الشهير إبراهيم سعيد وكنت فى منتهى السعادة عندما انتفل للزمالك فهذا بالفعل مكانه الحقيقى ولم أعد أحب حسام حسن ولا توأمه بسبب غرورهما الشديد وظنهما أنهما صنعا للأهلى مالم يصنعه غيرهما"
archived = "2010-03-14"
