[[comments]]
order = 1
subject = "مش كده أوى"
author = "مشجع مصرى طالب"
posted = "2008-02-12"
text = "خطأ بسيط بس يا جماعة.. طلاب الاخوان لما عملوا الاحتفالية فى جامعة القاهرة خرجت صبيان بس منعا للاختلاط ولتكريس مبدأ ان احتفالاتنا لا نخرج منها عن سمتنا وادابنا يعنى لم يكن فيها بنات ..<br />ومكنتش مسيرة منظمة ومكدرة الناس ومشينهم صفوف اتنينات<br />بالاضافة الى انهم رفعوا فيها اعلام ممصر وبغزاره وصور ابو تريكة وشحاته وباقى المنتخب<br />وبالعكس احتفالية طلاب الاخوان فى جامعة القاهرة كان ليها المردود الأكبر عن الطلاب والعدد الأكبر كمان<br />واختتم طلاب الاخوان المسلمين احتفاليتهم بمؤتمر عملوا فيه استكشات وعروض فنية للفرحة بالمنتخب ورجال حسن شحاته<br />اما الصور.. فأول 4 صور بس بتوع اتحاد الطلاب<br />وباقى 24 صورة .. هما بتوع طلاب الاخوان المسلمين"
archived = "2008-02-14"
capture_url = "https://web.archive.org/web/20080214060742/http://masr.20at.com:80/newArticle.php?sid=14169"

