subject = "انتم الفلسطنيون العالقون  انت من اهلنا"
author = "مصرى"
posted = "2008-01-08"
text = "النساء العجائز الضعيفات التى كن ينمن على الارض فى عز زمهرير البرد وثلاثة منهم ماتوا كانوا يقطعون قلبى<br />لماذا يا امهاتى تنامون على الارض وتحت العواصف وهم ينامون فى القصور لا ترمش لهم شعرة جفن<br />يا عمر يا ابن الخطاب<br />واللة لو عثرت شاة فى العراق لسؤل عنها عمر يوم القيامة<br />شاة عثرت رجلها ربما فى حجر<br />فما بالك فى الطائفين والطائفات والقادمون من البيت الحرام وهم من العجائز الضعيفات<br />ملعون ابو الكرسى الذى يخاف صاحبة من جعجعة الفضائيات<br />سوف تسأل عن الثلاثة الذين ماتوا من البرد<br />وسوف يستجيب ربك دعواتهم المظلومة فيك وستكون نهايتك زى قرن الخروب<br />استجب لهم يارب"
archived = "2010-03-14"
