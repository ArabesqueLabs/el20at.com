text = "تشاهدون برنامج \"زمان العزة\" ود. \"صفوت حجازي\" الساعة الخامسة وخمسة أربعون دقيقة مساءًا بتوقيت القاهرة على قناة الناس الفضائية.. وسيعود بنا إلى زمن عزة الإسلام وزمن الانتصارات والفتوحات والغزوات والبطولات والسؤال كيف نعيد زمان عزة المسلمين ؟.. ما المطلوب منا كواجبات في هذا الصدد؟"
