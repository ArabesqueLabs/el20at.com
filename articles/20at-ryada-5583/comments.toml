subject = "Barcelona played a match with Al-Ahly on the 7th 1"
author = "شرين منصور"
posted = "2007-04-25"
text = "السلام عليكم كل سنة قصدي كل مية سنة وانت طيب يا اهلي ودايما رافع راسنا ،المباراة كلنا استنناها بفارغ الصبر بالرغم من انها مباراة ودية بمناسبة الاحتفالية بعد اخر مرة لعب فيها برشلونة مع الاهلي في سنة 1961 واللي انتهت بهزيمة الفانلة الحمرا 6 -1 وجه اليوم اللي استنناه واتفرجنا بارغم ان خسر للاسف المرة التانية 4-0 وبقولهم كفيتوا ووفيتوا اما عن الحضري فانا ارفع قبعتي اعجابا باسلوبه وانو دخل 4 أجوان بس بالرغم ان كان فيه اجوان كانت حتدخل حتدخل الا ان الي دخل 4 بس وبرغم من وجود وجود مربع الوحوش البرشلوني اللي على رأسهم رونالدينيو بمعنى ان كان حيدخل اكتر من 4 ..المباراة الودية دي كانت مباراة مرتقبة من مشجعي وعاشقي الفانلة الحمرا وحنفضل أهلوية ودايما يا اهلي في العالي ورافع راسنا ..الحضري..متعب..ابو تريكة.. مثلث ذهبي مميز والعمود الفقري للنادي كفيتوا ووفيتوا"
archived = "2010-03-14"
capture_url = ""

