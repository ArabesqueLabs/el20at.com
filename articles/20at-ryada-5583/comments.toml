posted = "2007-04-25"
text = "انا عارفه طبعا اننا كاهلاويه لازم نزعل و نزعل جدا كمان بس الاهلى هو الاهلى مهما حصل<br />و علشان كدا يا محمد بعد تحياتى ليك طبعا عايزه اقوللك و اقول لكل الاهلاويه ادفنو احزانكو و ارفعو راسكو على الاقل ادام الاعداء و انتو فاهمين قصدى<br />و يمكن شيرين منصور كان ليها بعد نظر و فهمت و دا باين من تعليقها<br />بالحق يا محمد ابقى اكتب نعم لتعديل الدستور بس مش زى ما حصل<br />انت كنت كتبتها قبل كدا و عجبتنى<br />علشان انت كمان متتفهمش غلط"
