order = 0
subject = "اذا فيها واحد زى غالى يبقى مفيش فايدة والعملية كله"
author = "مفيش فايدة"
posted = "2008-12-01"
text = "بطرس غالى على راس لجنة حقوق الانسان --- يا حلاوة<br />حتة ضابط امن دولة هيقول لة اسكت يا بطرس - ركب بطرس هتسيب من بعضها<br />العملية كلها تعيين من الحكومة فى هذا المنصب<br />يعنى قدام الراى العام العالمى ان فية لجنة حقوق انسان وكل كم شهر بتخبط كلمتين مكتوبين فى مجلة بطريقة علمية ودمتم<br />لا رجاء اذا كان على راسها بطرس"
archived = "2008-12-01"
capture_url = "https://web.archive.org/web/20081201195218/http://masr.20at.com:80/newArticle.php?sid=18667"
