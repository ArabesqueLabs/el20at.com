text = "ابو الغيط طلع مرة وقال ان الفلسطينى اللى هيخطى الحدود هنكسر رجلة<br />المرة دى ساكت لية<br />علشان يهود هم اللى كسروا رجل المصرى الغلبان يبقى ابو الغيط يحط بلغة قديمة فى بقة ويسكت<br />اة يا شوية جبناء"
