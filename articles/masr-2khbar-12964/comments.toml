author = "الدروز الكلاب"
posted = "2009-08-18"
text = "عساكر الدروز الكلاب الذين يخدمون على حدود اسرائيل ضمن جيش اسرائيل هم الذين يسخرون ويشتمون العساكر المصرية ويطلقون عليهم النيران<br />وطبعا ونظير حماية العساكر المصريين لحدود اسرائيل يطلق عليهم الرصاص وينتهى الامر بتحقيق لا يصل الى شىء ولا يلام احد<br />ولنفترض ان المصرى هو من اطلق الرصاص كما حدث مع المجند سليمان خاطر الذى قتلتة الحكومة المصرية وهو فى السجن<br />واضح ايها السادة اننا اصبحنا لا نعرف حاجة اسمها الكرامة<br />وان اليهود بين الحين والاخر بيضربونا على قفانا<br />وسلم لى على كامب ديفيد وسلم لى اكتر على شرف العسكرية المصرية"
