[[comments]]
order = 0
subject = "افكار اقتصادية لحل المشاكل"
author = "مش كاتب"
posted = "2008-04-10"
text = "واحد او ناس عندهم مشاكل بالطبع لازم يفكروا في حل هذه المشكلة او المشاكل<br />التفكير فريضة<br />بس يا خسارة فكروا ونجحوا في الطريق الخط<br />لو فكروا صح كانوا حيمشوا صح<br />الشعب المصري زكي ونبيه بس يا خسارة الحكم مش مساعده<br />الحكم خلا كل الناس تتجه للسياسة<br />كله شغال سياسة<br />مفيش مجال للمواهب الاقتصادية دي علشان تنفس عن نفسها<br />وانا بقترح على الاخوة في عشرينات انشاء موقع مدونات مخصصة للافكار الاقتصادية<br />كل اللي عنده فكرة اقتصادية بتجيب فلوس يسجلها في هذه المدونة"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073403/http://masr.20at.com:80/newArticle.php?sid=15127"

[[comments]]
order = 1
subject = "الواد فرفور بتاع الفكر الجديد"
author = "ابو الاقتصاد"
posted = "2008-04-10"
text = "اسمعونى<br />يعنى اية عولمة واقتصاد حر<br />يعنى عندك مثلا مصنع بينتج ثلاجات وبيشغل عمالة مواطنة وفاتح بيوت ناس<br />ييجى بتوع الفكر الجديد بتاع لجنة الوكوسات يقول لك<br />نبيع مصنع التلاجات - ونسرح العمال - ونعمل مكانة كفتيريا سياحية تبيع قزازة البيبسى بعشرة جنية ونكسب<br />طيب والتلاجات بتاع الناس - يردوا عليك مش مهم<br />واحد مستورد يستفيد ويجيب تلاجات من اسرائيل او امريكا او الصين علشان نشغل عيالهم ونخللى عيالنا قاعدين على القهاوى<br />يعنى قتل وسائل الانتاج<br />ويبقى اقتصاد البلد مبنى على شوية سياح وتسولات واعانات من دول الخليج وامريكا<br />كان منتظر من حسنى مبارك<br />عندنا مصنع تلاجات - نخليهم تلاتة او اربعة ونشغل العيال ونصدر منتجات لها سعر واقتصاد حقيقى<br />نعمل مصانع اسمنت وحديد فى اسوان والصعيد<br />انما يقعد 27 سنة مستنى المثتثمرين لما ييجوا<br />ويبيع اصول الدولة علشان يأكل الناس<br />طيب لما يسيب الدولة لابنة - طيب ابنة هيبيع اية"
archived = "2008-04-12"
capture_url = "https://web.archive.org/web/20080412073403/http://masr.20at.com:80/newArticle.php?sid=15127"
