[[comments]]
order = 0
subject = "الحمله المصريه لاسترداد الكرامه"
author = "bassem"
posted = "2008-06-30"
text = "اللهم مالك الحمد والشكر يارب العالمين<br />جاء اليوم الذى أجد فيه من يهتم بنا نحن المصرين فى الخارج عيشيان فى ذل ولا لينا قيمه ولاحد بيعبرن رجاله والله يالى رفعين القضيه وانشاء الله منتصرين وانا كل اهلى معاكم يوم الكرامه 3\\7\\2008 يوم الخميس"
archived = "2008-07-03"
capture_url = "https://web.archive.org/web/20080703080104/http://masr.20at.com:80/newArticle.php?sid=16489"

[[comments]]
order = 1
subject = "رجالة"
author = "هيثم محمد"
posted = "2008-06-30"
text = "والله رجالة انا معاكم وبنضم إليكم قلبا وقالبا لاسترداد كرامتنا المصرية وهحضر الجلسة بإذن الله"
archived = "2008-07-03"
capture_url = "https://web.archive.org/web/20080703080104/http://masr.20at.com:80/newArticle.php?sid=16489"

[[comments]]
order = 2
subject = "معاكم من اجل الكرامة المصرية"
author = "yasser imam"
posted = "2008-06-30"
text = "بجد مووضع رائع وانا معاكم من اجل كرامتنا المصرية المهدرة انا معكم ويجب على كل مصرى شريف غيور يحب وطنه انا يكون معكم هاجى معاكم المحكمة وهاصرخ باعلى صوتى عشان يرج حقنا على نقدر نجيب كرمتنا التى اهدرت ونحافظ علىما تبقى منها"
archived = "2008-07-03"
capture_url = "https://web.archive.org/web/20080703080104/http://masr.20at.com:80/newArticle.php?sid=16489"

[[comments]]
order = 3
subject = "كرامة مصر ام دعوة للشهره"
posted = "2008-06-30"
text = "كرامة ايه يا تافه انت وهو وهي<br />يا حمار انت وهو بالنسبة للمصريين اللي شغالين في الخليج<br />بسيطة ممكن يمشوا ويحل محلهم غيرهم من الجنسيات العربية الاخرى<br />دي ناس بتبتغي الشهرة زي اسراء عبد الفتااح كده<br />وبعدين الموضوع عن الكوبري ايش دخل الكوبري في شوية محامين عايزين يشتهروا علشان خاطر مكاتبهم تمشي"
archived = "2008-07-03"
capture_url = "https://web.archive.org/web/20080703080104/http://masr.20at.com:80/newArticle.php?sid=16489"
