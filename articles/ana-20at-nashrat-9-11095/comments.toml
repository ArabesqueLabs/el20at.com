text = "أى نصر يا رجل هذا الذى تتحدث عنه ؟؟؟<br />بيوتنا هدمت و نساءنا رملوا و أطفالنا يتموا و فلذت أكبادنا إستشهدوا بأيدى الصهاينة و بأيدى أتباعك من حماس و عائلاتنا فقدت من يعولها و بنيتنا التحتية دمرت تماما و تقول إنتصار ؟؟!!!!!!!!!!!<br />حسبنا الله و نعم الوكيل فيك و فى من ساندك<br />حسبنا الله و نعم الوكيل فيك و فى من ساندك<br />حسبنا الله و نعم الوكيل فيك و فى من ساندك"
