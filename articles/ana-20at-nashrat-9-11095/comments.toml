order = 6
subject = ""
author = "فلسطينية"
posted = "2009-01-21"
text = "اول شي بقول للي اسمو \"ابو عمر\" انت بتقول المشكلة برأيي انو هنية برة فلسطين<br />ممكن انت والي متلك ماتحكو احسن اول شي اعرفو مين في فلسطين ومين برة يا فالحين<br />بعدين الشعب الفلسطيني اختار حماس بالانتخابات الشرعية ونحنا اخترنا الحق والي حيرجعلنا ارضنا ونعيش بكرامة<br />انت مو عايش عنا لحتى تنزل من اليهود والحواجز وماعندكم احتلال فممكن تنقطونا بسكوتو<br />هاد الي كان نقصنا ناس متلكم<br />والله نحنا بفلسطين مابنعترف باسرائيل واخترنا واحد ماحيعترف فيها<br />نحنا مجروحين صح نحنا بنتعذب صح<br />لما لقينا حالنا هيك قررنا نختار الكرامة<br />والنصر<br />لما لقينا ظلم من ادول العربية والجامعة العربية والامم قررن ناخد حقنا بأشائنا بالدم والمقاومة<br />وماحنوصل للتحرير الا بالشهداء روحو وشمو ريحة المسك والحنا الي ملت شوارع وبيوت فلسطين<br />بعدين تعالو واحكو شي<br />ولا عمركم رح تحسو بالانتصار الي نحنا هلء عم نحس في<br />هلء حسيت بالكرامة هلء حسيت بأنو رح يجي يوم واصلي بالاقصى<br />طالما بتفكرو هالتفكير الغبي ولسة بتفكرو هنية برة فلسطين…!<br />والله طفل عمرو 5 سنين عايش بفلسطين بفهم اكتر من هالعرب<br />وعاملين حالكم زعلانين ع الشهداء انا بفتخر انو اقرابي شهداء انهم حيشفعولي يوم القيامة<br />يوم ماربنا رح يحاسبكم ع كل كلمة عم تقولوها<br />ماحد يحكي عن حماس وهنية ابل مايعرف ابسط شي<br />انو هنية بغزة وعمرو مارح يتركها<br />وانو غزة انتصرت بدم الشهداء غزة انتصرت بأنها فرقت بين الحق والباطل عرفنا مين معنا ومين علينا<br />هاي هي معركة الفرقان<br />اسرائيل كانت بدها تاخد حد من القيادات اسير ..دخلك أسرت حد؟<br />كانت بدها جنديها الاسير… ومااخدتو<br />كانت بدها توقف الصواريخ يا ترى وقفتها؟؟؟<br />هاد الانتصار الحقيقي الي رفع راسو في كل فلسطيني كل مسلم حق"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221117/http://ana.20at.com:80/20at/nashrat-9/11095-19353.html"

