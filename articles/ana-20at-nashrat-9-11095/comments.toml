author = "أبو عمر"
posted = "2009-01-19"
text = "المشكلة فى رأيى إن الناس دى بجد ( إسماعيل هنية و من شابهه )عايشين بره فلسطين!! يعنى كل واحد عايش برة فلسطين بيتكلم و بيقول اللى هو عاوزه علشان مش حاسس بحاجة !!<br />زى ملا حسن نصر الله اللى أول ما الصواريخ طلعت من لبنان و إسرائيل قالت إن الصواريخ من لبنان بسرعة جرى و نفى إنه يكون له أى يد فى المسألة دى !! الناس دول يا جماعة مش حاسسين بجد بأهل فلسطين المجروحين المتعذبين بسببهم .<br />و اللى يغيظ أكتر إن حماس هى اللى بدأت و رفضت تجديد الهدنة و ضربت صواريخ على إسرائيل و هى عارفة إن الإسرائيليين دول بيتلككوا أساسا للعرب كلهم و رغم كده برضه بيضربوا صواريخ على الصهاينة و طبعا الصاروخ يموت واحد ولا إتنين و تقوم تيجى إسرائيل ضاربة صاروخ يموت و يجرح 100 فلسطينى و كلنا عارفين إن الصهاينة بيستخدموا أسلحة محرمة دوليا.<br />يعنى الواحد بجد بجد بجد صعبان عليه الناس اللى بيستشهدوا و الأطفال اللى بيشوهوا و الأطفال اللى بيفقدوا أهاليهم بس هنقول إيه بقى .."
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221117/http://ana.20at.com:80/20at/nashrat-9/11095-19353.html"

