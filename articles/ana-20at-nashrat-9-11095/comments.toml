author = "اكتب اسمك هنا"
posted = "2009-01-21"
text = "فلسطين تبكي<br />فَلَسطَيِن تَبكِيِ مَاَ مِن جِـُهُود<br />وَأَطفَالُنَا تُقـُتل واَنـُتم الشُهُوُد<br />فَجَـفت َأقلاَمُكم كِتَابَاتٌ وَعٌـهُود<br />لقَد سَاحُو بِدِمَاِئَنا سَيّل اّلخُدُوُد<br />فأَيـَن هُمَا رِجَاَلاُ مِن الَجُدُوُد<br />يَطلُب شَهاَدَة وَجَـّنةُ الَوًعًوًد<br />فـَلاَ تَخَـاَفُوُن قَـّبراً وَلَهُ تَعُـوُد<br />ويَرفَعُ رَأسُه بِـيَومٍ مِن يِجُوُد<br />فَمَـتى تِستَأنِفُ دِمَائِــَنا حُدُوُد<br />فَكَم مِن دَعـوَةٍ بَـاءَت صُـــدُوُد<br />فَهَذَا عَـدُوُاٌ لِلإِسـلَامِ وَحُـقُوُد<br />وَبَاحَ صَـوتٍ يَستَغِيِثَ ثُمَ يَعُوًد<br />فَمتَى رِجـَالُ للإِسلاَمِ يَعُوُد<br />فَلـــاَ يَرضَــىَ رَبـُكَ بِالصُدُوُد<br />بِرغَـدَ العَيـشَ وَنَحـنُ جُمُوُد<br />وَهَـذًا يَومِــنَا وَغَـدَا لِك يَعُوُد<br />بفلم ابوعجره"
archived = "2009-02-06"
capture_url = "https://web.archive.org/web/20090206221117/http://ana.20at.com:80/20at/nashrat-9/11095-19353.html"
