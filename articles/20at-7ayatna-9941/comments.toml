text = "ليه المبالغات وش دخل الاحتلال في الموبايل عنوان سخيييييف<br />وبعدين تحطون المشاكل في التقنيه والتطور لا بد يكون فيه مشاكل لابد<br />يعني اكيد الابو مايقدر يدفع لخمسة اولاد لازم يقدرون ضروف ابوهم مو تحطون البلا على الجوال<br />ابوي يعرف ضابط معه جوال العنيد قديييييييييييم وهو ضابط يعني اهم من البزوووووووووره هذول كلهم ومعاه العنيد مانزل من مكانته ابدا هو الجوال للاتصلات هذا اهم هدف"
