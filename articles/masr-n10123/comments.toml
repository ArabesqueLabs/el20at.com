[[comments]]
order = 0
subject = "الشيخ الشعراوي"
author = "ابومحسن غربة ?? سنه"
text = "باختصار اتمنى من الاخوان المسلمين ان يتعلموا الدعوة من الشيخ محمد متولي الشعراوي ويتركوا قصة فرعون موسى<br />فلا الحاكم المصري فرعون ولا المرشد العام سيدنا موسى ولا وزير الداخلية هامان<br />كلنا مسلمين سنه<br />كلنا مسلمين سنه<br />كلنا مسلمين سنه<br />ومصيرنا واحد"
archived = "2007-05-10"
capture_url = "https://web.archive.org/web/20070510014832/http://masr.20at.com:80/newArticle.php?sid=10123"

[[comments]]
order = 1
subject = "قول يا قاضى لراس الدوله"
author = "نيفين نيفى نوفا"
text = "بصراحه يا جماعه و انا بشوف قرار مجلس الدوله برفض احاله الاخوان للمحاكمه العسكريه و احالتهم للقضاء الادارى على شاشه التليفزيون حسيت انىا بقالى كتير مفرحتش ف الحكومه كده<br />حيثيات الحكم جاءت كتحدى صريييييح وو اااااااااااااضح للزعيم<br />و قعدو اهالى القيادات الاخوانيه يرددو الله اكبر و هتافات كتيره منها قول يا قاضى لراس الدوله<br />بس مين عارف بكره هيحصل ايه"
archived = "2007-06-13"
capture_url = "https://web.archive.org/web/20070613180448/http://masr.20at.com:80/newArticle.php?sid=10123"
