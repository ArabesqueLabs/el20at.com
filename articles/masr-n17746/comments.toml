[[comments]]
order = 0
subject = "مرجحا أن يكون السبب في اندلاعه ماس كهربائي."
author = "مش ماس كهربي"
text = "كل بلاوي الامة العربية والاسلامية بسبب ماس كهربي<br />يعني المغول والتتار دمروا الدولة العباسية بسبب ماس كهربي<br />والصليبيين دمروا الدولة العثمانية بسبب ماس كهربائي<br />واليهود احتلوا فلسطين بسبب ماس كهربي<br />وهزيمة 1967 بسبب ماس كهربي<br />واحتلال امريكا للعراق وافغانستان بسبب ماس كهربي<br />والعالم الاسلامي اصبح درجة تالته بسبب ماس كهربي<br />وبيع ممتلكات الدولة باسم الخصخصة بسبب ماس كهربي<br />والمظاهرات بتحصل بسبب ماس كهربي<br />وان شاء الله الهرم حيتهد بسبب ماس كهربي"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190600/http://masr.20at.com:80/newArticle.php?sid=17746"

[[comments]]
order = 1
subject = "ربنا يزيد كمان وكمان .."
author = "واحد حزين على مصر"
text = "لو عايزين يولعو فى البلد .. يقولو !!<br />أنما مايسيبوناش كدة على عمانا يعني .. ولو عايزين الشباب تساعدهم كمان<br />أكيد ممكن .. ليه لأ .. حسبي الله ونعم الوكيل !!!!"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190600/http://masr.20at.com:80/newArticle.php?sid=17746"

