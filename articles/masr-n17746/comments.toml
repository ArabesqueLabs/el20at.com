[[comments]]
order = 3
subject = "عايزين نفتح ملفات حريق اوبرا القاهرة وقصر محمد علي اللي كان في القلعة"
author = "مش شريف الدواخلي ولا البراء اشرف"
text = "زمان يمكن من 40 سنه فوجئنا بحريق كبير يدمر اوبرا القاهرة<br />وبعدين بشوية حريق كبير يدمر قصر محمد علي اللي كان في القلعة<br />وطبعا الاثنين بسبب ماس كهربي<br />خلاصة الكلام في الحريقين ان الاثار القديمة اتسرقت قبل الحريق وقصر محمد علي برضه الاثار اللي فيه اتسرقت قبل الحريق<br />وبالنسبة لحريق مبنى مجلس الشعب والمسرح القومي حتلاقي نفس الشيء<br />واي حريقة بتحصل في مخازن ومستودعات الشركات بتبقى مسروقة قبل ما تتحرق"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190600/http://masr.20at.com:80/newArticle.php?sid=17746"

[[comments]]
order = 4
subject = "الحريق القادم هيكون فين ؟"
author = "على"
text = "واللة مسلسل الكوارث دة مثير جدا<br />حريق وغرق العبارة<br />حريق قطار قليوب<br />حريق قطار الصعيد<br />حريق مركز الثقافة بنى سويف<br />حريق مجلس الشورى<br />انهيار جبل الدويقة<br />سقوط طيارة امريكا<br />اية التقدم الرائع دة<br />واية التنمية العظيمة دى<br />بس قولوا لنا يا جماعة الحريقة الجاية هتبقى فين<br />والا البلد كلها هتولع<br />شكلها كدة هتخرب قريب قوى والقصر الجمهورى مش فاضى الا لتلقى برقيات المواساة والعذاء من الدول الشقيقة"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190600/http://masr.20at.com:80/newArticle.php?sid=17746"

[[comments]]
order = 5
subject = "نفس توقيت حريق مجلس الشورى - لية"
author = "خبير حرائق"
text = "اولا مكيفات الهواء لا يمكن ان تنفجر لانها مصممة لتعمل على ضغط عالى حوالى 40 بار وهى دائرة مكونة من جزء ضغط عالى وضغط منخفض ويسرى غاز الفريون من الكمبورسور الى بقية الدائرة واقصى ما يمكن ان يحدث فى المكيف هو ان يحدث ثقب فى الدائرة ويهرب غاز الفريون وهو غاز غير قابل للاشعال وغير سام وليس لة رائحة - اما ان ينفجر فهذا كلام واحد جزماتى<br />ثانيا توقيت الحريق فى مجلس الشورى هو نفس توقيت حريق المسرح القومى<br />ان حكاية الماس الكهربائى دة بقت حجة لقفل الموضوع وعدم التحقيق فية ومعرفة الجانى او الفاعل الحقيقى<br />واحتمال ان نفترض ان المقاولين والكهربائية فى مصر بيحطوا فى شبكة الانارة اسلاك تليفونات بدل اسلاك الكهرباء علشان تولع وتعمل حريقة او ماس كهربائى دى فكرة ساذجة جدا"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190600/http://masr.20at.com:80/newArticle.php?sid=17746"

[[comments]]
order = 6
subject = "الى الاخ اللي فوق خبير حرائق"
author = "مش كاتب"
text = "يا استاذ خبير حرائق انت عارف وزارة الداخلية بتاعتنا حيعرفوا الجاني لما يكون فيه ناس بتفهم في البحث الجنائي يعني مثلا لما الحريقة تحصل ينتقل المختبر الجنائي وينتقل ضباط الشرطة وينتقل وكيل النيابة الى مصرح الجريمة ويبدأ البحث الجنائي لمعرفة حقيقة الحريق<br />لكن عندنا الضباط بتوعنا ولا مؤاخدة كلهم بتوع نسوان دخلوا كلية الشرطة علشان خاطر يعاكسوا النسوان والبنات ويتنفخوا ويتمنظروا بالبدلة اللي هما لابسينها والنوعية دي مرضى نفسانيين لقوا بيجيبوا الناس الشرفاء ويعذبوهم في مراكز واقساط البوليس<br />زي الضابط اسلام نبيه اللي جاب واحد سواق غلبان من الموقف وعذبه وصوره كمان وهو بيتعذب ووزع الفيلم على اصحابه<br />ادي يا عم دا ضابط شرطة خريج اكاديمية مبارك للامن<br />خلاص يا اخ خبير حرائق يظهر ان ما فيش فايدة لان ربنا قال في القران<br />لكل امة اجل وسوف تعلمون<br />يظهر ان اجل الامة المصرية جه على ايد حسني مبارك<br />سلام"
archived = "2008-09-30"
capture_url = "https://web.archive.org/web/20080930190600/http://masr.20at.com:80/newArticle.php?sid=17746"

