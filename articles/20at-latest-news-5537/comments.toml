text = "ارجو من موقع عشرينات الاكثار من التقارير والمقالات عن الاقلية الفلسطينية في اسرائيل اي عرب ال 48 وذلك بسبب الافكار الخاطئة والمسبقة لدى اخواننا العرب عنا....وخصوصا المصريين..وشخصيا مرّ عليّ الكثير من الاساءات من المصريين خاصة لعرب ال 48 فهم يحملون الكثير والكثير من الافكار المسبقة والمغلوطة عنا...ولكنني لا انكر المام البعض منهم حول وضعنا وقضيتنا وشخصياتنا الوطنية والاسلامية...بالانتظار"
