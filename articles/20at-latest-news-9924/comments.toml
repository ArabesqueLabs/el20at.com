text = "كل الفلسطينيين مسؤولون عما يحدث لهم من قبل والآن ؟؟؟!!!!<br />السبب واضح كوضوح عين الشمس .. هم الذين باعوا أرضهم .. هم الذين باعوا ديارهم .. هم الذين تركوا كل مايملكون وذهبوا إلى كل بقاع العالم \\\\\\\" مشرديين مشتتين \\\\\\\" .. وراحو بهالدنيا وصاروا يلفلفوا فيها دولة دولة والدولة اللي بتجبهم ببسطوا وبقعدوا فيها ومستحيل يتخلوا عنها ومنها أرضنا الأردن الغالي رغم اننا استقبلناهم وأكرمنانهم لكنهم ناكرين جميل ... هم الذين جلبوا لأنفسهم الخزي والعار .. هم الذين هدموا بيوتهم بأيدهم .. هم الالذين باعوا شرفهم وكرامتهم للكيان الصهيوني الغاصب .. هم الذين قبلوا بواقعهم المخزي الذي يجلب لهم<br />الرحمه والعطف والشفقه المذلولة ؟!<br />فلسطين .. ليست الدولة التي وحدها التي اصطفاها الله ..<br />إن فلسطين ليست ملاك .. أو حتى جوهرة ياهظة الثمن .. أنها دولة كباقي دول العالم لها شعبها .. عملتها .. شعارها .. رئيسها .. وكل ماتتمتع به مميزات الدولة العادية (( أمر بديهي ))<br />فأين الإختلاف بينها وبين باقي الدول العالم ؟! أنا لا أدري لماذا الناس عندما يسمعون بأن هذا الشخص من فلسطين .. يقومون بتوجيبه ونكريمه واحترامه لدرجة لاتصدق، وليست طبيعية أيضاً ؟؟! . هل أن الشخص الفلسطيني مقدس أو أنه ملاك أو شيء يسحيل العثور مثله أو معصوم عن الخطأ وأنمه كامل ؟؟!!<br />لا إله الا الله .. أنا أقول بأن كل الناس سواسية وكلهم خير وبركة .. ويوجد الكثير من العرب أفضل منهم بمليوووووووون مره ومره .. أرجو أن تراجعوا هذا النقطة لأنها مهمة جداً لكي يعرف كل فرد ماله وماعليه من حقوق وواجبات .. وشكراً<br />لكل إنسان يفهم !!!! وبسسسسسسسسسسسسسسسسسسسسسسسسسسسسسسس"
