posted = "2007-05-30"
text = "بجد الراجل دة لو أتكلمنا عنه مش هيكفى الموقع بحالة أنا الراجل دة بقرالة من سنة 96 الى الأن وكان معايا دكتور من حوالى شهرين شاف بالصدفة فى الدرج عندى قصة من سلسلة سافارى قلى أنت عارف ان الراجل دة حببنى وخلانى أفهم فى طب المناطق الحارة قلتلة أزاى قالى كان فى قصة عن الملاريا وأزاى بتدخل الجسم هو الدكتور كان مش فاهم فى كتب الجامعة قراها فى القصة فهمة وعجبتو جداً يادكتور أحمد يا دكتور رفعت يادكتور علاء يامدام عبير بحبوكو مووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووووتتتتتتتتتتتتتتتتتتتتت"
