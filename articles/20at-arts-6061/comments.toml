subject = "اه منك ايها العجوز"
author = "sarah20"
posted = "2007-06-21"
text = "اه منك ايها العجوز رفعت اسماعيل أذبتنى عشقاً فيك دون ان اراك و أغار من ماجى عندما تتحدث عنها بكل هذه الشاعرية أتمنى و لو انها تصبح فى يوم من الايام شبحا كأشباح قصرها و قصر والدها , أغار عليك منها و من سجائرك و من عزت و من الدكتور رمزى و من كل من حولك و يحبك و يهتم لامرك غيرى .<br />فعلا دكتور احمد مش قادرة اقول حاجة عنه لانى مهما قلت عمر ما هاوفيه حقه لانه فعلا كاتب خلاق و انسان رائع لانه قدر يوصلنا لان احنا نحس بشخصياته كأنها حقيقة و واقع عايش معانا ."
