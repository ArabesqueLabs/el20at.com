[[comments]]
order = 3
subject = "ارفعوا ايديكم عن التعليم  - التعليم مش موضوع سياسى"
author = "احمد جلال"
posted = "2008-10-08"
text = "التعليم فى بر مصر مع هوجة الفساد اللى غرقت مصر فى العشرين سنة الماضية اضمحل وانتهى اجلة وراح مع الاموات<br />ادخل اى مدرسة تعجبك بعيدا عن المدارس النموذجية او الاحياء الراقية<br />ستجد خريج كلية اداب لغة عربية بيدرس تربية رياضية - وخريج كلية التربية الرياضية بيدرس لغة عربية وادابها بينما خريج كلية التربية تخصص رياضيات مش لاقى شغل وعاطل<br />الموضوع ان واحد موجود وبيشيل جدول حصص ايا كان تخصصة وبيدخل الفصل ويقف قدام الاطفال بيعلم اية وبيقول اية مش مهم<br />المدارس تدب فيها الفوضى والمدرس بيدخل الفصل لا يشرح اى شىء واولياء الامور يعتمدون على الدروس الخصوصية<br />وزير تعليم سابق بايحاء من السفارة الامريكية طرد جميع المعلمين القدوة والاباء الحقيقيون فى المدارس لانهم متدينون او لهم لحية بحجة انهم يعلمون الاطفال التطرف والنتيجة انة بقى المدرسون عديمى الضمير والمرتزقة وانهيار القدوة فى المدارس ونتيجة جانبية انتشر البانجو بين الشباب ونشاهد عمليات التحرش بالسيدات فى الشوارع من شباب صغير عديم التربية لم يعلمة احد فى مدرسة الاخلاق الطيبة والقدوة الحسنة<br />طوال عمرنا فى المدارس كان المعلمون ملتحون ومتدينون وكنا نقتدى بهم بالخلق الطيب والوطنية حتى فى ايام الاشتراكية والشيوعية<br />التعليم عندنا ضاع - مرة تتخل السيدة زوجة الرئيس ومرة ثانية ابن السيد الرئيس ومرة ثالثة السفارة الامريكية<br />وعلى كل لون يا باتستا"
archived = "2010-03-14"
