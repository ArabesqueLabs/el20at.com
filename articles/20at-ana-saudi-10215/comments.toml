text = "انتم عاوزين اية اذا كانت الوزارة اياها اللى اسمها(التربية و التعليم)<br />اصبحت بلا تربية و بلا تعليم<br />تفتكروا النتيجة اية؟<br />صياعة و جهل؟<br />يعنى (ارهاب و اجرام و جهل و فساد و ---------------------------------- ألخ)<br />بلاش حرت فى البحر و بلاش تغابى؟<br />لنواجه الكارثة!!!"
