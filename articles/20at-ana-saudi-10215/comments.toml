text = "اهداء الى كل من يريد ان يهتم!<br />الاول نعلم التربية الصحة الحقيقية فى المدارس و ذلك حتى يكون لدينا نشىء مستعد لتقبل العلم بكل محبة و ادب و تحصيل<br />و بلاش خترفة و فتاوى<br />(ازاى يكون فية تعليم بلا تربية)<br />و أصبر يا جمل على ما ابتليت بتراس و زارتة الماسوف على شبابها المرحومة الغير مأسوف عليها المدعوقة المسماة<br />(وزارة الا تربية و الا لا تعليم)"
