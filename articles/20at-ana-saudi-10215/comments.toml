author = "البورتفوتيو فاشل"
posted = "2009-08-14"
text = "هذا النظام فاشل فاشل فى مصر لاسباب عديدة<br />1- لعدم وجود ضمير عند اغلب المدرسين بل اكثرهم<br />المدرس يمتلك نصف الدرجات والنصف الاخر على مجهود الطالب فى اخر العام<br />مثال ابنى مستواه متوسط بمعنى لم يستطيع فى اخر العام ان يحصل على نصف الدرجاتالت من جانبة اذا يجب الجوء للمدرس بأى وسيله لانه يتحكم فى النصف الاخر وهى الدروس الخصوصية لكى يضع الدرجات الت من جانبةالنصف الثانى<br />مثال طالب متفوق لم يأخذ درس ماذا تكون درجاتة<br />وطالب متوسط او تحت المتوسط يأخذ درس ماذا تكون درجاتة<br />يتـــــــــــــــساوى الاثنانوهذة هى الكارثة<br />رقــــــــــــــــــــاب اوليــــــــاء الامور فى يد المدرس<br />ماذا يفعل الفقير المتفوقنحن ندهسهة نقتلة لانة فقير<br />من سنة اولى ابتدائى الى ستة ست سنوات معانه مع الدروس حتى سنوات الشهدات تانية و رابعة وستة فى يد المدرس<br />التى كانت تعتمد على مجهود الطالب لتظهر مستواة الحقيقى<br />هذا الفشل بعينة طالب فى المرحلة الثانوية يجهل الكتابة<br />كيف ننهض ونتقدم الفاشل مثل المتفوق كل شيئ بالفلوس حتى التعليم<br />لم ولن نتقدم<br />اب من الكادحين عامل يومية وربنا يأدرنا على ما بلانا"
archived = "2010-03-14"
