order = 0
subject = "واين هو التعليم لنعمل لة تقييم شامل"
author = "شايف"
posted = "2008-10-07"
text = "حال التعليم فى بلدنا اشبة بماساة او ملهاة يقوم بعض الهواة بالتجريب وعمل التجارب الفاشلة على اطفالنا<br />ذات مرة احد الخبراء او الخوابير او خابور اقترح الغاء الصف السادس وطبق نظام الابتدائية خمس سنوات<br />وجاء بعدة خابور اخر من كفر البلاص وقال لك نرجع الصف السادس تانى<br />لية الغوا الصف السادس ولية رجعوة - ذلك علمة عند علام الغيوب - ولما سالت احدهم قال لى<br />- يا ايها الذين امنوا لا تسألوا عن اشياء ان تبدى لكم تسؤكم<br />خابور اخر قال لنا تعليم اللغة الانجليزية بدلا من الاول اعدادى هيبقى من الصف الرابع الابتدائى<br />تبعة خابور تانى بجعل اللغة الانجليزية من الصف الاول ابتدائى<br />ثم جاء خابور هذا العام وقال ان على طالب الصف الاول ابتدائى ان يدرس بجانب العربى والانجليزى لغة ثالثة هى الفرنساوى والكمبيوتر<br />ازاى طفل لا يعرف ان يكتب حروف لغتة العربية ان يكتب حروف الانجليزى او الفرنساوى<br />والنتيجة وصول بعض الاولاد الى الاعدادية وهو لا يعرف لا العربية ولا الانجليزية ولا اى حاجة خالص غير العامية<br />ارحموا اطفالنا<br />هل الطفل اليابانى او الانجليزى بيدرس ثلاث لغات فى الصف الاول ابتدائى<br />ارحموا اطفالنا وارحموا التعليم<br />شوفوا مقررات بريطانيا وطبقوها حرفيا<br />العملية مش فتاوى<br />مقررات بريطانيا ترجموها ودرسوها حرفيا واضيفوا عليها اللغة العربية والدين"
archived = "2010-03-14"
