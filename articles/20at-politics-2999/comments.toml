text = "عنوان التعليق هو المعبر عن راى<br />ايوة كان راجل ظالم و ديكتاتور مع شعبة . بس بالمواصفات دى فى كام رئيس عربى لازم يتعدم<br />مش عارف لية فى ناس بتفرح لما يجى واحد غريب نصرانى ولا صفوى ياخد بحقك انتا يا عربى يامسلم<br />لية نفرح لما امريكا تضرب يوجسلافيا........... نقول احسن دى دول دبحوا المسلمين فى كوسوفوا<br />لية نفرح لما امريكا تهدد بضرب ايران........... و نقول دول شيعه مجانين متعصبين<br />طب واحنا فين ..... فين ايدينا اللى ناخد بيها حقنا ولا كل مرة نستنى غيرنا ياخد حقنا<br />و دى اللى حصل مع صدام حارب ايران و دافع عن العرب كلهم<br />ولما دماغوا خانته و حول على الكويت كل العرب قعدوا يهوهوا زى الكلاب و مفيش دكر فيهم اتحرك الا لما امريكا شرفت<br />دى غلطه حصلت زمان و بتتكرر كتير حتى الان<br />و ماتنسوش تشيلوا صور حسن نصر الله من على العربيات يا مسلمين<br />HTTP://ARABESQ.BLOGSPOT.COM"
