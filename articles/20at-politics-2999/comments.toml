[[comments]]
order = 9
subject = "شعوب غبيه وتستحق حكامها"
author = "محمد سالم"
text = "والله انكم شعوب غبيه تستحق حكامها ............... وتستحق ان يهانوا في المعتقلات والسجون علي ايدي زبانية الطغاه......ويبدو انكم استمرئتم العبوديه والذل والمهانه......تتباكون علي سفاح اهلك الحرث والنسل وقتل الالاف من المسلمين....والله انكم قتله مثله تشتركون معه في تحمل وزر جرائمه ومصائبه وسيحاسبكم الله علي تاييدكم للظلم والطغيان<br />العبد صدام رحل الي جوار ربه ... وحسابه في محكمة العدل الالهيه..... حيث لا محامين ولا اعلام منافق ...ولا امريكان<br />ايها الاغبياء والحمقي ..... يامن تمجدون في سفاح بغداد .... كل رجل وشيخ قتل علي يد صدام ذنبه في رقبتكم<br />كل طفل تيتم علي ايدي صدام ............كل امراه ترملت............كل انسان عذب او انتهك عرضه......كل حرمة انتهكت علي ايدي صدام وزبانيته .... تشاركون في تحمل وزرها ......يا عبدة الفراعنه ...فلتعرفوا وتعلموا ان العدل اصل كل خير .... والظلم اصل كل شر"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 10
subject = "مات رااااااااااااااااااااااجل"
author = "محمد السيد"
text = "الله يرحمه .... مات راااااااجل ....<br />سمعت الخبر وأنا واقف عند منصة صلاة العيد ... قبل الصلاة ....<br />استهزاء بمليار مسلم ..... ممكن .<br />تخويف لكل الجالسين علي كراسي وأنفاس الشعوب .... احتمال .<br />تقديمه قربان للشيعة ... يجوز .<br />لكن اللي أنا شايفه زائد ده كله ...<br />خوف .. خوف .... من صدام ومن المسلمين من وراه ...<br />في عيد ... والناس كلها مشغولة ..أحسن وقت تضمن ميكنش فيه أي رد إسلامي أو عربي من الناس ...<br />في عيد ... والناس كلها مشغولة ..أحسن وقت الناس مشغولة بنفسها وعيالها ومش فاضية للكلام ده ...<br />في عيد ... والناس كلها مشغولة ..أحسن وقت تقريبا محدش بيكون فيه مستعد يسمع أساسا أي حاجة غير العيد وسيرته ...<br />من البداية ...اللي حصل ..إنهم في محاكمته العلنية أرادوا يظهروه بصورة الضعيف المتخاذل الأسير الذليل ..كانوا عايزين يكسروا صورته وهو مسجون ... وتكون دي صورة أي حد ممكن يفكر إنه ممكن يقاوم ماما أمريكا ...<br />وكانت مفاجأة ليهم إسلوبه وطريقة إدارته \" هو \" للمحاكمة ... حولته في عين للناس لبطل ...<br />وهنا انقلب السحر علي الساحر ... واللي كان المفروض يظهر من المحاكمة ظهر عكسه تماما ...<br />وبالتالي كان لازم يتخلصوا من المصيبة دي وفي أسرع وقت ...<br />هنا كان قرار الإعدام ....<br />ولأنهم كمان لازم يختاروا وقت كويس يضمنوا فيه رد الفعل ... ويضربوا بيه أكتر من عصفور بحجر واحد ... كان يوم العيد<br />واللي نقر نقوله عليه ..... \"الله يرجمه ... مات رااااااااااجل\"<br />بس برضه .... أنا وغيري ..... مش حنسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2010-03-14"
capture_url = ""

