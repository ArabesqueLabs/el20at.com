text = "غير حائز على أي شهادة جامعية .لم يكن عسكريا ولم يخدم يوم واحد في الجيش العراقي ألبس نفسه بزة عسكرية برتبة -مهيب ركن. .تزوج بالسر من إمرأتين (ذوات أزواج) .لم يكن مؤمنا بالأسلام لأنه ساند ميلوزوفتج ضد مسلمي البوسنه. وأمر بكتابة القران الكريم بدمه (والدم نجاسه). ناهيك عن قتل ألاف العلماء السنه والشيعه. .قتل رفاقه البعثيين الأصليين و أستولى على الحكم . كان رجل الأمريكان في حربه ضد إيران .قتل أخو زوجته ;عدنان خير الله في اول يوم عيد .أستباح أهل الكويت في شهر محرم -ضرب إسرائيل بصواريخ فارغه بحيث لم يجرح أحد وباتفاق .دفن شيوخ و نساء صيام و أطفالهن في رمضان 1985 .قتل صهريه في رمضان .وكل العراقيين ومنهم البعثيين يعلمون بمجن و فساد أولاده أخيرا أقول أن الأبطال لا يختبئون في الجحور بل يموتون وقوفا عار عليكم بطل كهذا."
archived = "2010-03-14"
