[[comments]]
order = 17
subject = "فبرحمة منه"
author = "جمال الدين"
text = "من نعم الله علي البشرية ان جعل من يقومون علي امر الفصل يوم الفصل ملائكة لا دخل للعاطفة فيما يفعلون، ولا يفعلون الا مايؤمرون، والا لفسدت عملية المحاسبة، فالبشر الذين وضع المولي ىعز وجل كل الاسباب المنطقية في الاديان لكيلا يكون للناس حجة علي الله،، فمن يحاج الله كفيل بعمل كل مايبرر له هواه،، فهوانا النفسي ان صدام وامثاله لا يتذوقون نعمة التوبة والغفران والرحمة،،،ولكن مقاييس الله تختلف عن ذلك فموسي عليه السلام خالف ما كان سائدا من الشرائع حين قتل المصري،، وابراهيم خالف كل الاعراف والتقاليد حين رمي بزوجته وابنه في الصحراء دون ماء او طعام،، واخوت يوسوف القوه في الجب،، ويونس خرج مغاضبا ربه،، والعبد الصالح مع موسي قتل طفلا دون ذنب ارتكبه،، ورقم ذلك انتهي بهم الحال انهم اختيروا انبياء واختيروا صالحين،،، ذلك فعل الله في خلقه،، ولكننا كبشر لو قيض لنا ان نحضر ذلك الزمن لكنا من ضمن جوقة المنشدين بتطبيق جميع الشرائع السمواية وغير السماوية عليهم ولصلبناهم في مكان عام....فلله ما اعطي ولله ما اخذ وله اليد الطولي وله الحق كل الحق في ان يفعل مايريد بالعبيد..."
