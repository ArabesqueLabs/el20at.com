text = "يا جماعة يا جماعة بالله عليكم النقاش لا يطرح للود قضية<br />وهل ما فعله مقتدى الصدار يا اخ ياللي بتذكر العار في رد هو من الرجولة ؟؟<br />كان الاولى على مقتدى الغدر ان يقوم بخلع القناع الذي ارتداه واعدم صدام ولكنه جبببااااااان ولكن الله فضح امره<br />الله اكبر على الظالم ...... مقتدى الغدر تحالف مع المالكي واخترق السجن وهو من نفذ حكم الاعدام في الشهيد صدام حسين ........... الي جهنم يا مقتدى ........ الي الجنة يا صدام يا شهيد الامه<br />ساسعد ان رأيت اقلامكم في هذا المنتدى المتواضع<br />www.asamena.com/vb"
