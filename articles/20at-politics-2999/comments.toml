subject = "ضع عنوان التعليق"
author = "رحم الله صدام"
text = "الاخ محمد سالم اللي بيتهمنا بأننا عبدة الفراعنة ..وانتم المؤيدون لاعدام الرجل بهذا الشكل و هذه الصورة ...انتم عبدة الامريكان اذا؟!!!<br />انت يا اخي لم تحاكم صدام لا كعربي و لا كمسلم ...بل حاكمه اعدمه الامريكان ..ولو كان عدمه شعبه حقا لكان ذلك عدل أما ما حدث فهو مجرد محاكمة هزلية..وبالفعل من تابع محاكمة صدام سيجد ان تهمة صدام بالفعل كانت على رده على من حاولوا اغتياله ..ومجموعة منالتخاريف من المأجورين ...<br />لننتظر فيما ستقوله عن حكام شعوبنا اللذين التصقت الكراسي بهم ...هل حاكمتهم انت ؟؟وهل عدمتهم؟؟؟ أم ستطلب من امريكا ان تقوم بذلك عنك لأنك تريد ان تنام مئة عام اخرى؟؟؟<br />انا لست مع قول ان صدام كافر ..ولا شهيد ..فهو بين يدي الله و رحمته الآن ..وسوف يحاكمه الله عز وجل كيف يشاء ..فلن اوزع الاقدار و لا البشر على الجنة و النار ..ولكن على الاقل قلت رأيي في موقف الذل و الاهانة الذي اعتدناه كعرب<br />رحم الله صدام حسين ..وليستحق شعب العراق المهلل لاعدام صدام ..يستحق ما سيراه في الايام القادم ..غدا لناظره قريب"
