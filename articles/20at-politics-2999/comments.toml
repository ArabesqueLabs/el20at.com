[[comments]]
order = 22
subject = "الاغبياء انواع"
author = "مسعد"
text = "نعم منذ ان بدأت المحاكمة وانا اتابع واليوم وبعد عدة ايام من استشهاد الرئيس المؤمن صدام حسين وخدت انه لابد ان ارد على امثال هذا المقال السخيف الذى يستوجب من كاتبه ان يتوب الى الله مرة اخرى ليس لما قاله عن الرئيس صدام رحمه الله ولكن لان الحقيقه ليست ما يسوقها الينا هؤلاء المضللين والكفرة وعملائهم لقد كان صدام ابنا بارا بشعبة وإن لم يكن هكذا ما كان العراق وان كنا نبحث له عن اخطاء فلماذا لم نبحث له عن حسنات قدمها لشعبه وبلده واهله<br />إن القادة العرب اعلنت علية الحرب بعد احتلال بغداد وبدأوا يرددون انههو الذى دمر العراق عندما اعلن الحرب على ايران واليوم اتسأل من الذى سينوب عنه للهجمة التى تتقدم يوما بعد يوم من ايران شؤال يتردد فى ذهنى كل لحظه<br />اذا كان يحاكم على بضعة اشخاص ربما يستحقون الموت من الذى يجب علية دفع مقابل ما يحدث اليوم للعراقيين<br />واعداد الموتى والمخطوفين ونتائج الفنتة التى تحدث اليوم؟ ان حديثى هذا ردا على الاخ محمد سالم ؟<br />انك مثل كل العراقيين الذين قابلتهم واعرفهم جيدا الا وهم ابناء كربلاء وانجف وبابل كلهم ليس لديهم شرف ولا غيرة فكيف اسمع لاحد منهم واصدقة واعترف بما يقولة<br />ان الشيعة قتلوا الامام على ثم عبدوه وقتلوا الامام الحسن والهوه ان كل فئة على الارض تعلم من هو نبيها من هو ربهم حتى عبدة الشياطين ولكن الشيعة فصلوا لهم اشلام على هواهم وصدقوا ما صنعوه<br />ان كل ديانة تعرف غايتها اما اهل الشيعة لايعرفون ماهى غايتهم انهم قتلة الائمه واهل البيت واليوم يعبدونهم<br />ان صدام حسين افضل من حكم العراق ولن يحكمها الا صدام اخر ولكن اكثر قوة من صدام ولسوف تترحمون ايامه عندما تدور الدوائر على اهل الشيعة من العراقيين كذلك سوف تبكون عليه دما عندما تجدون ان صدام افضل رئيس عربى على الاطلاق وانا اكتب اليوم ليس من واقع الخيال ولكن لاننى عشت وكلت فى العراق واعرفهم جيدا واذ جاءك العيب من اهله فلا تحزن لانهم هم اهله"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 23
subject = "بطلو بقى كلام فارغ وفوقو"
author = "اكتب اسمك هنا"
text = "انا قريت كلام كده كتييير مالوش لزمة<br />مين يقدر يقول ان صدام خاين وسفاح وارهابى وديكتاتورى؟؟؟؟؟؟؟؟<br />صدام عاش بطل ومات بطل<br />صدام رمز العروبة والكرامة<br />صدام رمز للحفاظ على الاسلام<br />صدام هو الى عمل العراق هو الى خلا نسبة الاميه صفر هو الى خلا لجامعة بغداد اسم هو الى عمل العراق واسالو المصريين الى فتحو بيوتهم من عهد صدام<br />صدام اعدامه بصمة عار فى وجه كل مسلم ومسلمة بغض النظر عن كونه يستحق ده او لا<br />صدام هيفضل فى قلب كل عربي شريف<br />الى مايعرفش تاريخ صدام بليييز مايتكلمش عنه<br />رحمة الله عليك ياصدام يارئيس وقائد العراق"
