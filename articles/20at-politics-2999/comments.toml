subject = "ونحط صور مين ان شاء الله يارابيسك ....صور صدام"
author = "محمد سالم"
text = "ياسي ارابيسك ....بلاش وعيب اللغه المغرقه في الطائفيه ....لانها اخطر علينا من الامريكان واليهود....والحقيقه ان كل الكلام الطائفي الذي قيل يساهم في انجاح المخطط الامريكي ومايسمي بالفوضي الخلاقه كما يجري في فلسطين والعراق ولبنان<br />... انت راجل عامل مدونه فالمفروض تتحري الدقه في كلامك... يعني العراق هو الذي بدا الحرب علي ايران وهذه حقيقه يعرفها الجميع وبدعم كبير من السعوديه ودول الخليج مخافة من مبدا تصدير الثوره الذي تبناه الخوميني في بداية حكمه ومخافةانتقال مايسمي بالمد الشيعي الي منطقة الخليج الحيويه للاقتصاد الامريكي .... وكانت امريكا ودول الخليج وجشع وعنجهية صدام السبب في هذه الحرب....حيث كان يتوهم صدام انه سيخرج منتصرا في خلال اسبوع واحد....ولكن الحقيقه انه لولا الدعم الامريكي والخليجي لخرج صدام مهزوما هزيمه نكراء ...<br />*** اما حكاية ان الحكام العرب كلهم ظلمه فدي حقيقه لكن ظلم عن ظلم يفرق ياباشا....يعني لو واحد ضربك علي قفاك فهو ظلمك ولو قتلك برده ظلمك لكن ظلم عن ظلم يفرق...يعني الضرب بالاسلحه الكمياويه وقتل الناس وتعليقهم علي ابواب منازلهم ومنع اهلهم من دفنهم ...وقطع الايدي والارجل والالسن ...وقتل عائلات بالكامل ....لا يمكن ان تساوي هذا بما يحدث في اقسام الشرطه المصريه من تعذيب ... رغم ان هذا ظلم وهذا ظلم<br />اما حكايه اننا نشيل صور حسن نصر الله ... فعايز اقولك ربنا يكملك بعقلك....طيب نحط صور مين السنيوره وسعد الحريري<br />شيل انت الصور اللي عندك ...لكن مليكش دعوه بغيرك"
