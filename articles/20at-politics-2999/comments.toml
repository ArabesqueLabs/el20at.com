[[comments]]
order = 3
subject = "نهاية رجل شجاع .. صدام حسين المجيد  ..."
author = "محمد نواف الحمدالله ..."
posted = "2008-02-14"
text = "صدام حسين المجيد .. نعم الرئيس العراقي الأسبق أو فيما يسميه بعض الناس \" المخلوع \" أو \" المقال من منصبه \" .. سموه ماشئتم !! فلا يوجد فرق في المسميات فكلها تصب في معنى واحد، وواضح، ومحدد، ومعين .. أو بمعنى ثان ...<br />تعددت الأسماء .. والمعنى واحد .. فلايهم .. وهذا ليس كلامنا وشئننا ..<br />إننا لاننكر بأن لسيدي الرئيس العراقي \" أبو عدي \".. محاسن ومساوئ .. إيجابيات وسلبيات .. مكامل وعيوب ..<br />فكل ابن آدم خطاّء .. ومن سمات وصفات البشر بأنهم خطاؤون .. ولا يوجد هناك من لايخطئ في حياته أبداً .. ولكن !!!<br />هلاّ تريثنا قليلاً قبل إصدار حكمنا وقرارنا عليه .. يقول الله تعالى : (( إن بعض الظن إثم )) .. لايجوز . بل هو حرام بالمطلق بأن نصدر حكماً على شخصاً ما دون الإستناد إلى حجج وبراهين وأدلة ووثائق وصور .. ونحو ذلك .. والقاضي لايحكم من دون هؤلاء الأشياء والأمور المهمة .. بل هي الأساس والأصل لمحاكمة كل شخص بغض القطع والنظر إلى جرمه الذي فعله وارتكبهُ بحق الغير .. إن سيدي المرحوم .. كان ظالماً بعض الشيء .. وكان قاسياً في بعض الأوقات .. وكان لئيماً في بعض الأحيان .. وكان عصبياً كثيراً ولأبعد الحدود .. لدرجة أن العقل لايمكنه تصورها لا بأي شكلٍ من الأشكال .. أضيفوا إلى ذلك بإنه كان يضّق الخناق في بعض الشيء .. وكان يفض القانون والنظام بشكل _ ديكتاتوري وديموقراطي في أنٍ واحد _ ..<br />وكان أيضاً يقيد من حريات وإرادات الأشخاص _ إن استلزم الأمر _ .. وكان يريد للعراقيين .. للشعب العراقي الكبير .. العظيم .. الأبيّ .. الصامد .. المنضال .. المكافح .. المغوار .. الشجاع .. المقدام .. البطل .. الذي لايزّ له شعره .. الذي لاتغفل له عين .. حتى يحيا بعزة .. بشرف .. بكرامة بنخوة ..بضمير يقظ دائماً .. وقلب مرتاح .. ونفسٌ هادئة .. ويشعر بالسعاة والهنائة .. شعب لطالما.. ولد حراً .. ولطالما أراد العيش الركيم الشريف .. ولطالما أراد السلام بأن يعم ربوع وطنه ..<br />شعب تعجز الألسن عن مدحه !!! ربما إنني لم أوفي حق العراق العظيم .. وربما أن الكلمات خانتي قليلاً .. وربما إنني لا أملك الأسلوب المناسب والتعبير الرائع والجميل والوصف الدقيق لهذا البلد الكبير بناسه وأهله وشعبه .. الكبير بعطاءه وكرمه وجوده وسخاءه .. يده الممدودة والمبسوطة للخير دائماً .. فكم هي كثيرة إنجازات العراق الكبير .. وكم هي عظيمة تلك الإنجازات .. بحق العراق لم يزدهر وينمو ويتقدم وينجح ويواكب العصر ومتطلباته .. الخ .. \" وهذا من فضل الله تعالى \" .. ومن ثم أفضال سيدي .. وقائدي .. ومعلمي .. وأستاذي .. وأبي .. ورئيسي أبو عدي .. فماذا كان العراق قبله وبعده ؟؟؟<br />آهٍ .. على آهٍ .. على آهٍ .. على آه .. لماذا ؟؟؟<br />.......................................................................... انتهى ،،، أتصور بإنة تعليقي قد فهم على أكمل وجه .. فهو ليس بكلامٍ لايفهم .. هو مفهوم وواضح وصريح .. والكل يدري إلى ماذا أرمي .... !! وإلى جنات الخلد .. لكي تنعم بها ياوالدي .. لكي تنعم بالفردوس الأعلى .. لكي ترى الرسول ( عليه أفضل الصلاة والسلام ) .. واًصحابه الكرام الأخيار .. والأنبياء الكرام الأعزاء ..................................................................................... فأنعم بنعيم الجنه .. وكما قلت لا قرّت أعين الجبــــــــــــــــــــــــــــــــــــناء !!!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 4
subject = "بالنسبة لتعليق الأخ :- محمد سالم .. ولكن !!!"
author = "محمد نواف الحمدالله ..."
posted = "2008-02-14"
text = "يا أخي العزيز هذا مبدئك وتلك وجهة نظرك الخاصة بك فلا تعممها على الجميع .. ولاتنسبها بأفواههم .. فالناس مختلفون بوجهات نظرهم وآرائهم واتجاهاتهم ومبادئهم وتفكيرهم _ نوعاً ما _ .. وهذا أمر طبيعي .. بل هو مسلّم بديهي من المسلّمات البديهية المعروفة ..<br />أتحسبن يا أخي الكريم .. بأن الناس أغبياء وحمقى .. وأنهم لايملكون العقل .. وليست لهم أفكارهم وحرّيتهم وإرادتهم وتحكيمهم وتمييزهم بين الحق والباطل .. بين الصواب والخطأ .. بين الخير والشر .. أم ماذا بالضبط .. ؟!<br />كلامك يدل على إنك _ والعلم عندالله _ بإنك شيعي بغض القطع والنظر عن هذا الأمر التافه الذي لايقدم ولا يأخر ..<br />أخي الكريم .. صدام حسين .. _ كما ذكرت في تعليقي السابق _ لم يكن كاملاً . وقلت بأن كل إنسان على وجه الكرة الأرضية خطّااااااااااااااااااااااء .. يا أخي أنا شخصياً أخطئ .. وأنت تخطئ .. وهذا يخطئ .. وذاك يخطئ .. وهي تخطئ .. وتلك تخطئ .. وهم يخطؤون وجميعنا مخطؤون .. فأين هي صفة الكمال في هذا الشيء !!!<br />افهم يا أخي .. ولا تجّر عقلك كثيراً .. فالإنسا المتحجّر والمتعصب لرأيه .. يكون منبوذاً من الجميع بلا استثناء أو تمييز ..<br />والتعصب للرأي ولوجهات النظر _ قد تكون أغلب الأوقات خاطئة وليس لها أساس من الصحة _ وهو أيضاً سلوك ليس بحضاري ومتقدم .. بل هو تخلق وجهل مدّقعين !!<br />أنا متفق معك بأن صدام حسين ذبح وقتل وشرّد و و و و الخ .. ولكن كان لابد من الدفاع عن نفسه يا أخي .. أنت تخيّل نفسك بدلاً منه .. وأرادواشعبك الإنقلاب عليك وعلى الشرعية .. بلا أي حجة كافية ودليل مقنع ! . فماذا ستفعل حينها ؟؟<br />هل سوف تنّظر إليهم وكلك فخر وعّزة ؟؟ أم هل ستضع يديك على خدك .. وتنتظر القادم ؟؟ أم هل ستسكت عن هذا الأمر الخطير جداً ؟؟ أم ماذا ؟؟ قل لي .. يا أخي افقهني أوضح لي وجة نظرك ؟؟؟<br />إن صدام حسين قتلهم وذبحهم لإنهم استحقوا ذلك الجزاء والعقاب .. على أي أساس يريدون افتعال انقلاب ؟؟ ماسندهم في ذلك ؟؟ لاشيء على الإطلاق !!!<br />أخي .. إن مذبحة الدّجيل _ 1982 م _ جزاء لمن كان يحاول أو أن يفكر بالإنقلاب .. لا لسببً يذكر على الإطلاق ..<br />أخي تثّقف جيداً قبل أن تتفوه بأي حرف .. فسوف تحاسب عليها أمام الباري - عزّ وجل _ . وأنا هنا بصفتي لا أدافع عن الرئيس العراقي .. وإنما أدافع عن حق .. أداقع عن حق .. أدافع عن حق .. أدافع عن حق .. أدافع عن حق .. أدافع عن حق .. قأين هو وجه الحق في قتل صقر العرب وأسد العرب ؟؟؟ !!! ؟؟؟ !!! ؟؟؟ !!! واللهِ إنه ظلم سوف يحاسب عيله الجميع على فعلتهم لهذه الجريمة النكراء .. ولا قرّت أعين الجبنــــــــــــــــــــــــــــــــاء !!!!"
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 5
subject = "رحمك الله يا صقر العرب ((صدام حسين))"
author = "عاشق فلسطين"
posted = "2008-06-09"
text = "سأل الله العظيم رب العرش الكريم أن يرحم الفقيد الحبيب صدام حسين وأن يسكنه فسيح جناته .....<br />إلى كل من يعترض ما فعله صدام حسين , صحيح أن صدام حسين كانت له بعض الأفعال السيئة في حياته وبعض الجرائم ....<br />لكن والله له مواقف مشرفة جدا للإسلام والمسلمين عندما قتل أكثر من مليون شيعي خلال الحرب العراقية الإيرانية وقتل أيضا أكثر من نصف مليون شيعي عراقي , هذا الرجل الذي فعل ما لم يفعله أهل الإسلام للأسف اليوم , أنا أعتقد بأن الله تعالى قد سلط هذا الرجل العظيم المغوار لكي يوقف المد الصفوي الشيعي الرافضي بالعراق الذين يعيثون فسادا في العراق الآن ومنهم مقتدى القذر عليه من الله ما يستحق , هذا الرجل الذي شارون المخسوف بنفسه قال بعد إعدامه : الآن أنا أستطيع أنا أنام على فراشي بكل راحة واطمئنان .... وأنتم تعلمون بأن الشيعة الروافض لعنهم الله جميعا أغلبهم ينكرون بأن رسول الله محمد<br />صلى الله عليه وسلم هو النبي وإنما يقولون علي بن طالب رضي الله عنه هو النبي , وهذا كفر أكبر إذ أن شهادة أن محمداً<br />رسول الله من أركان الإسلام , فما بالكم بهؤلاء المرتزقة السفلة الذين يسبون أبو بكر وعمر رضي الله عنهما ويعتبرون سبهما<br />من أكبر العبادات التي يؤجرونه عليها , تعتبرون صدام حسين مجرما لأنه قتل 2 مليون شيعي يسبون الله والرسول والصحابة !!!<br />فلا حول ولا قوة إلا بالله العلي العظيم , وسيبقى حبيبي صدام حسين غالياً علينا نحن الفلسطينيون والأردنيون , فهذا الرجل<br />لطالما دافع عن الفلسطينيين وضرب إسرائيل بثمان صواريخ باتريون واسكود من أجل ردعهم , ولطالما ساعد الفلسطينيون<br />في سرائهم وضرائهم , سيبقى علينا غاليا إلى الأبد ولتسكت ولتخرس الألسنة التي تطاوله , ولا ننسى موقفه المشرف الذي<br />لم يهزه وكان رافع الرأس ولم يهن ولم يذل عندما وضع بحبل المشنقة عندما قال عاش العراق وعاشت خنساوات فلسطين !!<br />فو الله إني بكيت عليه وأنا أراه يعدم , ويحق له فخرا بأنه قال كلمة الحق والشهادة (لا إله إلا الله) التي من قالها دخل الجنة !!<br />فإلى جنات الخلد يا أشرف الناس ويا أعز الناس يا صقر العروبة , ولا ننسى عندما قال : وليسقط العملاء .......<br />نعم فهو شهيد بإذن الله وإلى الفردوس الأعلى ...<br />واعذروني على الإطالة ولكن ما كان بقلبي أعجز من أن يكتبه القلم ......<br />رحمك الله يا سيد العرب صدام حسين ...."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "اسماعيل و يسوع و الحسين"
author = "أحمد بلال"
text = "إعدام الرئيس صدام حسين في ذلك الوقت من وجهة نظري ليس من قبيل الفداء و لا من قبيل التطهير و إنما من قبيل الاستهزاء.<br />استهزاء بمليار و 200 ألف مسلم, و أكثر من 300 مليون عربي بأن يناسب الإعدام أعيادا دينية إسلامية و مسيحية<br />و استهزاء أيضا بالقانون الذي يمنع إعدام أي شخص في أيام عيده<br />و استهزاء أيضا بكل القابعين على كراسي الحكم في الوطن العربي, بطريقة \"دي آخرة اللي ميسمعش كلام ماما أمريكا\"<br />ذكرتم المسيح و إسماعيل<br />أذكروا أيضا الحسين الذي قتلوه و قتلوا أولاده و شردوا بناته و قارنوه بالرجل<br />لم يفتدوا الشعب العربي بصدام فالدماء العربية لم تجف بعد<br />و لم يطهروا الشعب العربي من خطاياه بصدام بل كان إعدام صدام أكبر خطيئة ارتكبها الشعب العربي بصمته على حكامه و أعدائه<br />و إنما أهانوا الشعب العربي باعدام صدام .. و أزعم أن الشعب العربي لن يقبل الإهانة"
archived = "2010-03-14"
