[[comments]]
order = 38
subject = "مزبلة التاريخ"
author = "الشماسي"
text = "باقر علي الشماسي * - 4 / 1 / 2007م - 10:33 م<br />نعزي قناة الجزيرة، وكان وأخواتها،،، ونعزي طوابير راضعي ومصاصي كابونات النفط،،، على المصير الأسود لزعيمهم وملهمهم صدام حسين «أبو الحروب - وأبو الهروب - وأبن الحفرة».<br />لقد شاءت الأقدار أن عانقته المشنقة الشقراء عناقاً حاراً وحميماً وهي تكفكف دموعه بمنتهى الرقة، إذ أنه لقاء تاريخي بينهما لكونها صديقة له طيلة «محرقته» أقصد طيلة عهد حكمه لثلث قرن زاهر بالمقابر الجماعية والمشانق،، وكانت تستقبل الرقاب البريئة بالآلاف سنوياً.<br />وكانت هذه المشنقة في عهده «الميمون» مطيعة أطاعة عمياء، أطاعة عسكرية،، ليس اقتناعاً وإنما قسراً، ولكن هذه المرة ذهب إليها مترنحاً ومتشحاً حلة قشيبة تسر الناظرين، فعانقت رقبته بحرارة وحنان لافت،،،<br />يعجز القلم عن وصفه وتعجز ريشة أكبر فنان رسم تصويره بدقه درامية، نظراً لشدة المفاجئة لها، وشدة السرور والابتهاج بلقاء صديقها المزدوج. حيث اطعم صديقته الشقراء بالحرام، طيلة ثلاثين عاماً. وكانت تتغنج وترقص لكل رأس يقدمه لها في كل دقيقة وساعة تملقاً وتصنعاً كي لا يؤذيها..!! ونهنئ الملايين من العراقيين من ذوي ضحايا محرقة صدام وأقاربهم من جميع شرائح وأطياف شعب العراق.<br />وكم أتمنى من العقلاء المتعاطفين مع الطاغية صدام أن يحترموا ويراعوا جراحات الشعب العراقي ومآسيه. حيث فتك بشعبة فتكاً لا مثيل له في التاريخ من سنة وشيعة وأكراد كما وفتك بالمئات من حزب البعث الذين عارضو طغيانه وحروبه.<br />أتمنى أن يراجعوا ضمائرهم الإنسانية الحية، وأن يدعوا للتآخي من أجل أمن وإسعاد كل إنسان في الوطن العربي."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 39
subject = "أقسمت أن لا أنتصر لجلاد"
author = "الحبيب أبو وليد المكني"
text = "ذكرتني عديد البيانات التونسية التي صدرت بمناسبة تنفيذ حكم الإعدام في صدام حسين بحالي و أنا أجوب شوارع المدينة أحث المواطنين على الانخراط في المسيرات التي كنا ننظمها انتصارا للعراق وتنديدا بالتحالف الدولي ... أعادتني تلك المقالات الباكية إلى حالي و أنا أقتحم الصفوف رافعا لشعار: \"يا صدام يا حبيب ..أضرب، أضرب تل أبيب \" ...\" يا صدام يا بطل ...\" وقد شاركني في تلك الأحاسيس طبعا أهل بلدي صغيرهم وكبيرهم ،نسائهم ورجالهم ، مثقفهم وجاهلهم ، يمينهم و يسارهم ، كانت هناك معلومات كثيفة تختزن في ذاكرتي عن صدام الدكتاتور الذي قتل آية الله باقر الصدر مؤلف اقتصادنا وفلسفتنا و التفسير الموضوعي للقرآن ... وهي المراجع التي تشكل آنذاك جزء ا مهما من زادي الثقافي الذي أنافس به المنافسين لكن الهم الوطني كان أكبر و الانخراط في معركة الوجود الحضاري كان الأولى ومواجهة العدوان الأطلسي كان الأشرف و الأنبل ...<br />لم أكن في ذلك الوقت قد جربت بنفسي كيف يكون التعذيب ، و كيف يمتهن السجين ، و كيف يذل الشريف ، و كيف ينتهك العرض ، و كيف يكون التشفي و الامتهان و التعدي و الإيقاع و الشماتة والإذلال ...<br />وكنت أظن التعذيب في تونس قد وصل إلى منتهاه و أن الغطرسة والظلم قد بلغا مبلغهما و أن أجهزة القمع التونسية التي تدربت في بغداد و القاهرة ودمشق قد حازت على درجة الاحتراف في الهمجية والتنكيل و النذالة حتى جعلني الله ألتقي في هذه البلاد بجموع من الذين فروا من العراق ومنهم من كان ذلك لأسباب سياسية , و أغلبهم لما أصبحوا عليه من ضائقة اقتصادية بسبب الحصار الظالم . كان حديثنا لا يتوقف عن المظالم التي عاشها العراقيون بكل طوائفهم ، كان حوارنا عن جور صدام وأعوانه . وكان نقاشنا عن الأساليب التي يبندعها أعوان صدام للتنكيل بأهل العراق ، كنت أهم برواية قصتي مع التعذيب و المحاصرة و أحفر ذاكرتي لأستحضر كل ما عرفته من قصص تعذيب إخواني و لا أكاد أثير انتباه أحد منهم ... مدني أحدهم بكتيب ألفه أحد أشباه صدام الذي فر إلى الولايات المتحدة كان يروي زيارة له بدلا من صدام الجقيقي في الكويت زمن \" تحريرها من أسرة الصباح \" في أحد أيام سبتمبر من عام 1990 م فيذكر بعض الجثث التي تعلق على أبواب أصحابها لأنهم قاوموا الاحتلال العراقي وتمنع العائلات من دفنها أياما حتى تكون عبرة لمن يعتبر؟؟؟... شعرت عندها بالمهانة وكرهت نفسي التي أجازت لي تلك الأيام أن أتحمس لنصرة ديكتاتور لأنه رفع بعض الشعارات التي وجدت لها صدى في نفسي التواقة لإعادة أمجاد الأمة ومواجهة الاستعمار و الإمبريالية .. و أقسمت على ألا أقع في هذا الخطأ مطلقا مهما كانت الأسباب وجيهة و مهما كانت الشعارات براقة ...<br />وعندما اندحر الجيش العراقي في أقل من شهر و سقطت بغداد وحصلت النكسة الثانية كان التفسير المنطقي الذي يتفق عليه أصحاب العقول هو أن الدكتاتورية لا يمكنها أن تحمي الأوطان و إنها قد تحقق بعض الإنجازات وتبني الطرقات و الجامعات و تصنع الصواريخ و الدبابات ولكنها غير قادرة على الاستثمار في الإنسان و بالتالي فلا معنى لما تبنيه لأنه إلى زوال قريب . حصل ذلك مع هتلر في الأربعينات ورأيناه بأم أعيننا في العراق زمن صدام أ و لن أقنع أبدا أن الحالة الكارثية التي يعيشها العراق اليوم هي فقط بسبب الاحتلال كما يحب الإعلام العربي أن يردد دون كلل أو ملل فقد رأيت الآلاف من أهل ذلك البلد يهاجرون في كل الاتجاهات قبل الاحتلال وليس بسبب الحصار فقط كما بدعي المدعون و لم تكن هناك تدخل إيراني يصلح لتفسير كل الكوارث و النوائب وكان قبل الغزو العراقي للكويت مليونا عراقي خارج بلادهم يفرون من جور صدام وظلمه وهؤلاء اليوم يتوزعون على كل الجبهات وبعضهم يساير الناس فيتحدث ليرضي كل الجهات ...<br />إن تدفق المقالات التي تنعى الرئيس العراقي صدام حسين وتصفه بأجمل النعوت و أحسن الأوصاف وتضيف إلى عهده أكبر الإنجازات، و إن الأطراف التي تنظم مواكب العزاء و المسيرات و ترفع صور الزعيم نكاية كما تزعم في أعوان الاحتلال و انتصارا للمقاومة و تنديدا بصناع الفتنة الطائفية، تقوم بخلط الأوراق على المواطنين العرب بحيث لن يكون من السهل بعد ذلك التفريق بين مشروع قوى الحرية و الديمقراطية و إشراقة الإسلام وبين مشروع قوى الاستبداد و الفاشية و الدمار وهي لعمري خدمة كبيرة يحق أن يفرح بها حكام العرب المستبدين ليواصلوا تلاعبهم كما هي عادتهم بالعقول الساذجة ويعلنون بحق أن الغوغاء لا تصلح للحكم أو المشاركة فيه و أن كل حديث عن التداول على السلطة هو مؤجل حتى يقع التزايل و الفرز بين القوى العاملة لتحقيق الاستقلال الثاني حيث تستعيد الجماهير الواعية والمؤطرة حقوقها المسلوبة وتصبح إرادتها المصدر الوحيد للشرعية وبين قوى الفساد و الاستبداد و من يعاضدها من حملة الشعارات الخادعة و من الشعراء الذين استشكلت عليهم السبل و ظللتهم الأوهام التي لن تحقق ... إن خطاب الحرية والديمقراطية لا يمكن أبدا أن يلتقي مع خطاب الاستبداد و الديكتاتورية والفساد .<br />لعن بورقيبة والترحم على صدام<br />د خالد شوكات<br />بكت حركة النهضة الإسلامية، وعدد من الأحزاب والجماعات القومية واليسارية التونسية، بحرقة الديكتاتور العراقي صدام حسين، وقامت في بيانات متواترة بالاحتجاج على الولايات المتحدة الأمريكية و \"الحكومة العميلة\" في العراق، مستندة في احتجاجها هذا على مبادئ القانون الدولي ومواثيق حقوق الإنسان، وعلى ما أصاب مشاعر المسلمين والعرب من أذى بتنفيذ حكم الإعدام في أول أيام عيد الأضحى المبارك وأعياد ميلاد السيد المسيح المجيدة.<br />وعلى الرغم من كوني قد وجدت في تنفيذ حكم الإعدام ضد الطاغية صدام في تاريخه المذكور، وبالصورة التي نقلتها سائر وسائل الإعلام العربية والدولية، خطأ فادحا ينم عن غباء سياسي وعقل طائفي مريض وتلاعب خطير بالمصلحة الوطنية العراقية، فإنني في الوقت نفسه انتبهت إلى أن موت هذا الديكتاتور، قد شكل مناسبة أخرى لإثبات مدى ضعف القناعة الديمقراطية لدى جل التيارات السياسية العربية، وميل العقل السياسي العربي الإسلامي العميق للمشاريع الشمولية التي تعتمد الشعارات الشعبوية في عملها على تحصيل الشرعية، ولا تتورع في آن على تبرير كافة الجرائم والممارسات السلطوية الشاذة مادام الحكم ملتزما ظاهريا بهذه الشعارات.<br />لقد بدا لي أن مشكلة قيادة الحركة الإسلامية في تونس ، من خلال بيان التعاطف الصدامي، ليس كما زعمت طيلة العقود الماضية، مع ديكتاتورية الحكم، إنما لأن الحكم لا يرفع شعارات شعبوية \"عروبية و دينية\"، فلو كانت السلطة التونسية قد رفعت مثل هذه الشعارات، لكان مبررا لها مثلا، ارتكاب كافة الجرائم التي نفذها صدام في حق شعبه، وحق شعوب مجاورة شقيقة لشعبه، أي لكان من حق السلطة التونسية أن تخوض حروبا ظالمة ضد الدولتين الجارتين، وأن تضيع ثلث التونسيين في المغامرات العسكرية والسجون والمعتقلات وحملات الإبادة الجماعية وجدع الأنوف والآذان والترحيل القسري والطرد التعسفي إلى المنافي، ثم التسبب في وضع الثلثين الباقيين تحت مقصلة حصار دولي مدمر يأكل ما ستبقيه الابتلاءات السابقة.<br />وحتى لا يكون المرء مفتئتا على هذه القيادة، لا بد من التذكير بأن هذه ليست المرة الأولى التي تبدي فيها قيادة الحركة الإسلامية التونسية، ممثلة بالأساس في زعيمها الأبدي الشيخ راشد الغنوشي، تعاطفا مع الديكتاتور العراقي، بل لقد سبقتها مرات أعربت فيها هذه القيادة على انحيازها لصدام حسين، كما كان شأنها مع عملية غزوه للكويت، متذرعة باستمرار بالحجة ذاتها، أن معارضة التدخل الأمريكي مقدمة على أي تقدير آخر.<br />إن سعة صدر الشيخ الغنوشي التي شملت بالعطف والرحمة كل جرائم الطاغية العراقي، الذي قتل وعذب وسحل وبذر وطغى وتجبر أكثر من أي حاكم عرفه التاريخ العربي الإسلامي، لم تقدر على أن تستوعب سيرة الزعيم الرئيس الحبيب بورقيبة، حيث بلغ الغل والحقد بزعيم الحركة الإسلامية التونسية أن رفض الترحم على قائد مسيرة الاستقلال والتنمية في بلاده، ووصفه فيما معناه بأنه \"ملعون سيدخله ربه جهنم\"، وهو على فضائله التي لا تعد لن يدخله ربه الجنة، أما صدام فعلى مخازيه وجرائمه التي لا تعد أيضا، ففي في الفردوس الأعلى بشفاعة ظل الله في الأرض من الأولياء والصالحين.<br />إن معيار التقييم الأساسي عند رئيس الحركة الإسلامية التونسية وكثير من زملائه، ليس ما يحققه الحاكم من رفاهية واستقرار وتنمية اقتصادية واجتماعية وإنفاق على التربية والتعليم وسائر المرافق الضرورية لارتقاء بمستوى عيش المواطنين، إنما ما يرفعه من شعارات براقة كاذبة، وما يقدمه من مخدرات قومية ودينية فتاكة، وما يجره على شعبه وأنصاره من كوارث وويلات وأزمات متلاحقة، وما يبديه من عنتريات وخطب طنانة رنانة لا تسندها وقائع عملية ثابتة.<br />إدانة الآخرين على كيلهم بمكيالين في السياسة، لا تلزم قيادة الحركة الإسلامية التونسية ومن قاسمها المواقف نفسها حيال القضايا المحلية والعربية والدولية المطروحة، بعدم ممارسة هذه السياسة في النظر إلى مسيرة الطاغية العراقي، فدماء ثلاثين عراقيا قتلوا غدرا على أيدي عصابات البعث والقاعدة يوم أعدم الديكتاتور، وقبلها أرواح آلاف العراقيين الذين حصدتهم آلة الحقد الزرقاوية، لا تساوي دماء صدام ولا تستحق نفس التعاطف والبكاء، وثلاثة أو أربعة ملايين مواطن عراقي انتهكت أرواحهم وحقوقهم طيلة العهد الصدامي المجيد، لا ترجح أو حتى تساوي كفة آلاف سجناء الحركة الإسلامية التونسية، من الذين انتهكت حقوقهم خلال الفترة الماضية، و لا أذكر – ولا أظن أحدا يذكر- أن بيانا واحدا صدر عن حركة النهضة أدان جرائم حكم البعث العراقي طيلة انتصابه غصبا فوق صدر العراقيين، لكن آلة البيانات المتعاطفة تتحرك عندما يحشر الديكتاتور جراء غيه ورعونته في الزاوية.<br />و أخيرا، لا مناص من الإشارة إلى خاصية مشتركة بين السيرة السياسة لصدام ورئيس الحركة الإسلامية التونسية، أن كلاهما قد قاد شعبه أو أتباعه باستمرار من أزمة خانقة إلى أخرى، وأن كلاهما يزعم أنه لا يخطئ إنما الجرم كله يقع على العدو الداخلي أو الخارجي المتآمر عليهما دائما، وما على الشعب أو الأتباع إلا الصبر على الابتلاء، أما الحساب فمؤجل إلى يوم اللقاء، وأما هذا المقال فقد كتب تنفيذا لأمر مخابراتي أمريكي وصهيوني يرى في الرجلين العدو الأكبر.<br />* كاتب تونسي"
