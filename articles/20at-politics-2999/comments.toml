subject = "اللهم أن كان محسناً فزد فى حسناته وأن كان خاطاً فت"
author = "yalahwy"
text = "أعدام صدام أسقط ورقه التوت الباقيه على الأمه العربيه فنحن الأن عريا ليس بموت صدام لكن بموت ضمأرنا ورجولتنا العربيه وأنا أعتقد أن أعدام صدام كشف النقاب عما يجول فى رأس الشيعه (عليهم من الله ما يستحقونه) والضغينه الكبيره والكراهيه الدفينه فى صدرهم لنا أهل السنه فأنا ارى انهم أشد خطراً على المسلمين من اليهود والنصارى وللننظر الى عدد ضحايا اليهود يوميه فى فلسطين وعدد ضحايا فرق الموت الشيعيه فى العراق<br />اللهم عليك بكل من أرد هذا الدين وأنصر دينك الذى أنزلت يا رب العالمين"
