subject = "اسماعيل وبسوع والحسين"
author = "عبد المنعم المصرى  مقيم بالمهج"
text = "يجب ان يكون تعليقنا وتحليلنا موضوعيا ايضا فصدام حسين بشر ككل البشر يصيب ويخطئ وما حدث هو قمة الاستهزاء بالاسلام والمسلمين من جهة وامعانا فى الغطرسة الامريكية الصهيونية ايضا وكما قال جرو بوش من ليس معنا فهو ضدنا وكما اعلنها صريحة انها حرب صليبية فلامر ليس بمثل هذه السهولة والاجابة بالطريقة الامريكية وهى نعم او لا<br />المفروض ان نرى الحدث من جميع جوانبه ولا مجال للتشبيهات ونحن فى القرن الحادى والعشرين وانتم ابناء العشرين ادعوكم لتحللوا الامر بتان , اعدام صدام حسين لانه لم يقبل ان ينحنى لامريكا ولم يساوم على المبادئ وحوكم بايد عميلة واعدم بايد حاقدة لا تعرف الانسانية ويكفيه انه وجد الالهام من الله ان ينطق الشهادتين فى لحظة الموت التى يفزع منها كل انسان فهو لم يكن كاى من اسماعيل ولا المسيح ولا الحسين ولكنه كان صدام الانسان العادى الذى عرف ربه حق المعرفة ولو متاخرا فالعبرة بالخواتيم<br />لقد وضع امام الاعداء نموذج ام الابى لا يمكن ان يقبل الهوان وهذا فخر له وستثبت الايام انه كان مثل اى قديس فى موقفه<br />رحمه الله واسكنه فسيح جناته"
archived = "2010-03-14"
capture_url = ""

