subject = "رحمك الله يا صدام"
author = "إحسان حميدة"
text = "رحمك الله يا صدام كنت رجلا في زمن عز به الرجال، لم تضى الدنية لنفسك او لأمتك مت شجاعا ذهبت رافع الرأس قوي القلب لم تخف ولم توجل والله لو كان غيرك من \"زعمائنا\" لمات قبل ان يصل المشنقة ولرأينا العجب العجاب من حاله ،و وفقك الله للنطق بالشهادتين فشهد لك القاصي والداني بهذا رغم أنف الحاقدين، لك اخطاء ولك حسنات ونسأل الله ان يتجاوز عن سيئاتك ويرحمك برحمته، مهما قال الحاقدون تبقى أسد العرب وتيبقى أشجع الشجعان ومهما قالوا فسيشهد الملايين ان اخر كلامك كان \"اشهد ان لا اله الا الله واشهد ان محمد رسول الله والحساب في النهاية لله وليس للبشر"
