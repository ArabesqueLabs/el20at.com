[[comments]]
order = 15
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
text = "السلام عليكم<br />مافيه خيار ثالث ؟؟<br />باللهي إعدام صدام في أول يوم من أيام عيد الأضحى مبارك وعلى يد نجسه يعتبر<br />فداء أم تطهير ؟؟ هذي تعتبر إهانة للأمة الإسلامية كلها .. صدام قتل ودمر وأسفك<br />نعم هذا كله قد فعله .. ولكن لماذا ؟؟ صدام كان رجل جبار ماعنده شئ إسمه ثلث الثلاثة كم<br />وأي أحد يخونه أو يلعب بذيله مصيره الموووووووت ..<br />صدام طالب بـ 10 مليارات كتعويض من الكويت .. بعد عدة مفاوضات بين الكويت والعراق والسعودية<br />كانت هي الواسطة وافقت الكويت على دفع 9 مليار والسعودية 1 مليار لمنع الخصومات بين الشعبين<br />في عهد ملكنا فهد الله يرحمه .. ولكن الكويت ظلت تتباطئ عن الدفع .. فأخبر صدام أمريكا .. وأمريكا<br />قالت حنا وش علينا منكم هذي مشكلة عربية - عربية حلوها بنفسكم .. وصدام أختار الحل الخاطئ<br />إللي هو الحل العسكري ؟؟ وبس هذي إختصار لسالفة الغزو .<br />أما سالفة قتله لشعبه .. فوالله شعبه كل ابوه متشتت وذو عوروق مختلفه وكان لابد من وضع نظام<br />وقرارات توقف كل واحد عند حده .. ولكن شعب العراق زي محنا شايفين يحب يعاند وصدام إللي<br />مايسمع كلامه يعتبره خائن ويقتله .. ماعنده يمه أرحميني .. وهذا كان عيبه.<br />الله يرحم أموات المسلمين جميعاً .. ولم يكن ينبغي أن نستعين بالكلاب الصهاينة وحنا<br />لازلنا بقوتنا وبعقولنا ..<br />أنا راح آخذ الأمور بشكل إيجابي .. وراح أقول إعدام صدام قد يكون تكفير لذنوبه<br />رحمه الله .. ولا ننسى أن صدام أوى الفلسطينين وقدم لهم المأكل والمشرب<br />جعل الله ذلك في ميزان حسناته .. وقد وقف في وجه الأعداء لللآخر لحظة في حياته<br />ولن أقول مات شهيداً .. ولن أقول مات وهو كافر<br />هو بين يدي الله عزوجل .."
archived = "2010-03-14"
capture_url = ""

