subject = "محمد سالم"
author = "الجنه وجبت للتوربيني السفاح قا"
text = "من اسخف التعليقات التي قراتها كثيرا علي الانترنت في اليومين الماضيين... ان صدام وجبت له الجنه لان اخر كلامه كان لا اله الا الله محمد رسول الله وبالتالي وجبت له الجنه<br />وبالقياس علي الاخ صدام فنحن نهنيء التوربيني السفاح علي الجنه التي وجبت له.... لان التوربيني عندما يصدر عليه حكم الاعدام المتوقع سيكون عنده الوقت الكافي لينطق الشهادتين قبل ان يعدم في وجود رجل دين يلقنه الشهاده.... يا فرحتك يا توربيني<br />وعندها لابد من نخرج المظاهرات تاييدا للتوربيني الراحل .... الشهيد الذي وجبت له الجنه ....بل مرحي لكل القتله الذين يعلقون علي المشانق<br />***** يا ايتام صدام تقراون كلام الله ورسوله ويقف في حلوقكم ولا يصل الي قلوبكم او عقولكم<br />اللهم ارنا الحق حقا وارزقنا اتباعه..... وارنا الباطل باطلا وارزقنا اجتنابه"
