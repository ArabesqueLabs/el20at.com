subject = "محمد سالم"
author = "كل ماذكرتموه لا يغير من حقائق"
text = "نعم ....المحاكمه كانت هزليه...ولكن الم تكن محاكمات صدام لخصومه اكثر هزلا ..<br />نعم.....الرجل اعدم في توقيت مستفز لمشاعر المسلمين ولكن اكان يعبا بهذه الاشياء....الم يغزو الكويت في الاشهر الحرم<br />نعم الرجل كان متماسكا لحظة اعدامه....وربما كان ضحاياه يرتجفون وهم يساقون الي حبل المشنقه وخصوصا بعد حفلات التعذيب التي كانوا يتعرضون لها .... واظنكم تعرفون ان رغد صدام حسين ومحامو صدام رفضوا الي اخر لحظه ان يسلم صدام الي العراقيين وطلبوا ان يبقي تحت حراسة الامريكان... لانهم يعرفون ان صدام اذا سلم الي العراقيين كان سينال قسطا من حفلات التعذيب التي كان ينعم بها علي ضحاياه.... ولا اعرف ان كان سيبقي متماسكا وهو يساق الي حبل المشنقه ام ان المعذبون المهانون يرتجفون وهم يساقون الي الموت..... الله وحده اعلم<br />نعم ...المسئول عن قتله في النهايه هم الامريكان لانهم المحتلين بحكم القانون الدولي وكان يجب ان يعامل كاسير حرب..... لكن الم يكن صدام رجلهم الاول وعميلهم في المنطقه وكانوا الداعم الرئيسي له في حربه علي ايران ...ولكن عندما تتبدلت المصالح واصبح صدام كارت محروقا تم التضحيه به .... النهاية الطبيعيه لكل العملاء علي مر التاريخ<br />وفي النهايه بعيدا عن التحليلات السياسيه والتاريخيه يبقي سؤال ينبغي ان يساله كل واحد منا لنفسه وضميره<br />هل لو قتل صدام اخوك او ابوك او شخص عزيز عليك او ربما قتل عائلتك كلها ..... هاذا ستكون مشاعرك عندما تسمع عن خبر اعدام صدام....هل ستهتم ان قتله الامريكان او العراقيين او حتي ان مات في حادث سياره<br />اللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه"
archived = "2010-03-14"
capture_url = ""

