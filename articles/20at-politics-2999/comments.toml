author = "محمد السيد"
text = "اتبقت حاجة ..لو ممكن أضيفها ....؟؟<br />ليه ميكنش لينا دور في الرد علي محاولة الاستهزاء الفاشلة دي ؟<br />عشرينات ...<br />مطلوب منكم إيميلات البيت الأبيض ... البنتاجون ... المؤسسات الأمريكية الكبري .... وغير الأمريكية ...<br />محتاجين نوصلهم ..... إن اللي حاولوا يوصلوه لنا من إحساس بالذل والإنكسار والخوف ....<br />للأسف موصلش .. وللأسف كمان ... لأسفهم هم ... مش إحنا .... إعدام أي شخص .. علي يد محتل الأرض .... ولما تكون موتة عزة وفخار زي موتة صدام ..... بيتحوله لبطل ... ورمز .... وشهيد ...<br />وبيكون ساعتها دعانا ليه .....<br />واللي نقدر نقوله عليه ..... \"الله يرحمه ... مات رااااااااااجل\"<br />بس برضه .... أنا وغيري ..... مش حنسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
