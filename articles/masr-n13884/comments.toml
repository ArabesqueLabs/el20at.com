[[comments]]
order = 0
subject = "ولية كدة"
author = "راجل من البلد دى"
posted = "2008-01-19"
text = "رئيس الحى - لو راجل متحضر - وعايز ينهض بالناس بتوعة لية ما يشغلش مخة<br />واحدة زى دى - لية ما يبقاش لها كفتيريا صغيرة متر فى متر - الومنيوم وقزاز - وتقف فيها نظيفة محترمة ولها كرسى تقعد علية وتقدم الشاى للزبائن بطريقة حضارية - بدل ما نشوفها تغلى المياة فى كوز وعلى وابور جاز<br />الدنيا حوالينا بتتطور واحنا الغباء او الاغبياء هم من يشغلون الوظائف التنفيذية<br />امرأة على الرصيف تحت البرد والمطر والحر والتراب وبتغسل الكوبيات فى جردل مية<br />منكم للة"
archived = "2008-01-21"
capture_url = "https://web.archive.org/web/20080121071056/http://masr.20at.com:80/newArticle.php?sid=13884"

[[comments]]
order = 1
subject = "الأمة إلى أين؟.. \"قناة الناس\" تجيب"
posted = "2008-01-19"
text = "الأمة إلى أين؟.. \"قناة الناس\" تجيب<br />يواصل الشيخ \"محمد حسين يعقوب\" حلقات برنامج \"الأمة إلى أين\" عبر قناة الناس الفضائية يوميا الساعة التاسعة مساء بتوقيت القاهرة (السابعة بتوقيت جريتنش) ليستكمل رحلته لمعرفة طريق الأمة الإسلامية ويتحسس ذلك من خلال ضيوفه في برنامجه..<br />برنامج لا يفوتك .. شاهده ولنكتب معا ما ينقص هذا البرنامج وصولا إلى الإجابة على هذا السؤال المصيري .. الأمة إلى أين؟"
archived = "2008-01-21"
capture_url = "https://web.archive.org/web/20080121071056/http://masr.20at.com:80/newArticle.php?sid=13884"

