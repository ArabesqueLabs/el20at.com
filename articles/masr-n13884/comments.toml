[[comments]]
order = 4
subject = "ومازال فبكرة الموضوعات مستمرة"
posted = "2008-01-20"
text = "يا بنت الحاج عبدالفضيل حضرتك قلتي الاتي<br />1) 18 عاما شغالة في هذه المهنة<br />2) عندها خمس ابناء<br />3) عمرها يناهز الستين عاما نقول 58<br />4) 3 ابناء اخدوا الدبلوم<br />5) تفطر العيال قبل ما يروخوا المدرسة<br />المهم الان هي بتشتغل بقالها 18 سنه بعد ممات زوجها وعلى حسب المعلومات زوجها مات وعندها 40 سنه على حسب المعلومات الواردة بالمقال<br />ازاي بقى بعد 18 سنه بتفطر العيال علشان خاطر يروحوا المدارس لان الخمس عيال تلاته منهم اتخرجوا يبقى فاضل عيلين<br />اللي بيفطروا ويروحوا المدرسة 2 بس<br />طيب وجوزها مات من 18 سنه<br />ازاي عندها عيال بتفطر وتروح المدرسة وجوزها ميتن من 18 سنه"
archived = "2008-01-21"
capture_url = "https://web.archive.org/web/20080121071056/http://masr.20at.com:80/newArticle.php?sid=13884"

