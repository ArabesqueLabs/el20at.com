author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-01-26"
text = "الف مليون تحية لضباط مصر الكبار لضباط مصر الاحرار خريجي اكاديمية مبارك للامن على المجهود الرائع الذين يبذلوه لخدمه الامن والمواطن والمواطنين<br />والحقيقة احنا نشكر السيد الرئيس على اختياره اسم مبارك بدلا من كلية الشرطة وجعلها اكاديمية مبارك للامن علشان خاطر تبقى اسم على مسمى<br />الضابط اسلام نبيه خريج اكاديمية مبارك للامن صاحب النظرية العلمية العصا في المؤخرة الذي اذهل العالم كله بهذه النظرية مع سائق الميكروباص الشهير عماد الكبير<br />والضابط محسن منير السكري صاحب نظرية السكينة في الرقبه الذي ادهش العالم كله بسفرياته المهمة والتي كان اخرها الى دبي لقتل سوزان تميم ورجال الشرطة في دبي استفادوا كثيرا من خبرة الضابط محسن منير السكري<br />وغيره وغيره من الضباط الكبار الاكفاء الذين بذلوا الغالي والنفيس في سبيل تحقيق الامن في مصر وكان فيه امين شرطة ولا ايه رمى مواطن مصري من الدور الرابع مش فاكر الحكاية بالضبط<br />مبروك يا حبايبي يا سهرانين الليل علشان خاطرنا"
archived = "2009-03-09"
capture_url = "https://web.archive.org/web/20090309094916/http://ana.20at.com:80/20at_training/masr/t7kyk/11163-19491.html"

