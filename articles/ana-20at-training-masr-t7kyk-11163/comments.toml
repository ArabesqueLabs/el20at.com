author = "مش رضوى حسن ولا مروى صلاح"
posted = "2009-01-27"
text = "وننتهز الفرصة لنبعث باقة ورد لرجال مصر الابطال في امن الدولة ونشكرهم على زياراتهم المفاجئة للامنين في الفجرية لخطب المواطنين الابرياء وبث الرعب في قلوب النساء والاطفال وجرجرة الضحية على السلالم بالبيجاما<br />وايضا رجال الامن المركزي البواسل وعلى مواقفهم المشرفة في تفريق المتظاهرين من الجياع من هذا الشعب وعلى علقهم السجنة بالخيرزانات والركل بالارجل للضحايا<br />مبروك يا شرطة مصر الف مبروك علينا"
archived = "2009-03-09"
capture_url = "https://web.archive.org/web/20090309094916/http://ana.20at.com:80/20at_training/masr/t7kyk/11163-19491.html"
