subject = "عادي جدا"
author = "واحد مخنوق"
posted = "2007-02-24"
text = "شوفوا يا جماعة انا عارف ان اللى بيحصل ده مستفز و عادي جدا لكن احنا مافكرناش مرة واحده بعقل و سألنا روحنا و اكتشفنا ان الناس عندنا بيعملوا كده (أو لو عرفوا يعملوا كده هيعملوا) ليه .. لأنهم ببساطه بسطاء و غير متلمين و انا بصراحه بحاول اختار اللفظ الأكثر لياقه على أد ماقدر... ما احنا نازلين شتيمه و ترقه و بهدله فيهم برضه, و محدش يقوللي رد فعل, لا مش رد فعل .. إحنا و هما (أو بمعني أصح الجهله هنا و هناك) شغالين شتيمه و بهدله ف بعض.. و للأسف الصوت الأعلى هو صوت الشتيمه و قلة الأدب و بس إنما الناس المثقفين و المتعلمين هنا أو هناك صوتهم واطي جدا.. هنا لأن الأمن ما شاء الله و كلنا عارفين إن دور المثقفين في انحدار.. و هناك لأن إحنا سمعنا تقيل و نظرنا ضعيف..انا مش بدافع عنهم أبدا..انما انا برصد وضع حقيقي وواقع..و ربنا معانا كلنا"
archived = "2010-03-14"
