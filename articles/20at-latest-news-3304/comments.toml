text = "السخرية من الاسلام لم تكن حكرا على الامم الغربية ... فكم من بني جلدتنا من المسلمين ممن هانوا على الله فكانوا تبعا للمشركين والكفار و عونا لهم علينا ... اذلهم الله في الدنيا والاخرة ... و ان كثيرا من الناس عن اياتنا لغافلون..<br />اللهم انا نسالك باسمك الاعظم ان تعلي شان الاسلام في مشارق الارض و مغاربها و تجعلنا من حملة الامانة تكليفا وتشريفا .. اللهم والعن كل من خذل الدين و كان عونا للشيطان على اخوانه ... اللهم امين"
