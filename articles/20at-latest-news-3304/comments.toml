[[comments]]
order = 12
subject = "عادي جدا و مش عادي فاهم"
author = "saai khier"
posted = "2007-03-27"
text = "الأستاذ مخنوق تحياتي فك الله خنقتك و خنقتنا جميعا آمين تحياتي الشديدة لفهمك الرائع للأمور و حسن وصفك ليها و حقيقي هو شئ عادي جدا أنهم يعملوا كده و عادي جدا جدا بس اللي مش عادي أنهم يحرقوا مساجد لندن في فترة من الفترات القريبة و اللي مش عادي هو أنك ما تحاولش تنشر وجهة نظرك الرائعة دي و تنشأ موقع باللغة الأنجليزية لمحاورة المثقفين منهم بدل ما نسيب الجهلة في الطرفين ياخدونا في رجليهم وكمان نوضح أن مش عادي أن الحكومات بتاعتهم اللي بتدعي العقل و العلم مش عادي أنها تكتم علي نفس المسلمين هنا و هناك و تقتل ولادها بحروب تخدم اسرائيل بس و تستعديهم علينا باستخدام الطريقة دي بجد فكرك يستاهل ينشأ حوار بكل اللغات للتواصل و التفاهم و العتاب و كمان تكون فرصة لكل الأصحاب اللي عايزين يتعرفوا و يتقاربوا و يتمرسوا علي استخدام اللغات و في النهاية كلنا بشر و كلنا أخوات كلنا ولاد آدم و لازم نتفاهم و ربنا خلقنا علشان نتقارب و نتعلم و نتعرف و نتفاهم فهم قصدي و لا مش فاهم تحياتي و ربنا يفك خنقتنا"
archived = "2010-03-14"
capture_url = ""

