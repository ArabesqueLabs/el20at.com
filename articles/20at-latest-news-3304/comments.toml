subject = "كيف يعنى عادى جدا يا مخنوق"
author = "ayat alla"
posted = "2007-04-06"
text = "إذا أخذنا الامور من وجهة نظر كما نفعل هم أيضا يفعلون لخربت الدار ومن فيها،هذا ليس منطقا ولا اسلوب حياة سياسية حتى،فلو كنا فعلنا كما فعل(بابا الفتيكان مثلا) او كما يفعل الساسة المشهورين فى فرنسا عند بدء انتخاباتهم بسب الاسلام لكانت اقيمت الحروب على بلاد الاسلام وقيل عنا ارهابيين وجهلاء لا يقدرون قيمة الحوار ولا يحترمون الاديان الاخرى أليس كذلك. بل لأننا تعودنا السكوت والاهانة فى حالات كثيرة ولم نحارب من اجل الدين كما حاربنا من اجل الارض لذلك هم يتعمدون الاهانة الى الاسلام والمسلمين ، فعيب عليك(واحد مخنوق) ان تتخذ قضايا دينك وعزتك بهذه السخرية الساذجة لا لشيىء الا انك تنتمى للاسلام"
