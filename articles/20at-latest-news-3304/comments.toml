[[comments]]
order = 17
subject = "اتفق مع مسلم و كيرلس و شاهد مشافش حاجه"
author = "نيفين نيفى نوفا"
posted = "2007-04-13"
text = "فعلا زى ما قال مسلم المشكله الاساسيه ان مفيش حوار مع الاخر<br />ليه كلبرامجنا الدينيه متترجمش للانجليزى كمان ليه منمتلكش لغه الحوار مع الاخر<br />يا جماعه فيه ناس لسه فاكرانا بنركب جمال و بنعيش ف خيام<br />و ف نفس الوقت انا بتفق مع كيرلس و شاهد مشافش حاجه ف حكايه السيف و انا قاتها زمان على ولاد البلد ف التعليقات فعلا برده شاهد مشافش حاجه عنده حق ف موضوع السينما اللى صورت المسلم ف صوره لا تجادل و لا تناقش يا اخ على و البركه ف عادل امام ووحيد حامد و اللى زيهم<br />بس تعالو بقى نعترف بحاجه<br />لو ترجمنا برامجنا و لو عدلنا صورتنا ف السينما و شرحنا ان السيف رمز قوه مش رمز دم و دمارو شرحنا ان فكره ان الاسلام انتشر بالسيف دى فكره غلط و عملنا كل ده<br />نعمل ايه ف كوادرنا الدينيه و الاثقافيه و الاعلاميه اللى بيطلعو ع الفضائيات بشتمو بعض ويهاجمو بعض<br />نعمل ايه ف اللى بيطلعو مش عايزين يسمعو لعض<br />نعمل ايه ف اسلوب الحوار اللى انعدم و العنف الظاهر الل بيننا حتى ف مناقشاتنا العاديه<br />نعمل ايه ف شيوخنا اللى لسه بيختلفو على اشياء بديهيه<br />نعمل اتيه ف الفتاوى التيك اواى اللى بيروجها بعض مدعين الدين ع النت و المواقع الماجوره<br />احنا يا جماعه بنحارب قوى كتير خفيه و قوى اكتر عارفينها و لا نفعل شىء حيالها<br />اللهم اعلى بفضللك كلمتى الحق و الدين"
archived = "2010-03-14"
capture_url = ""
