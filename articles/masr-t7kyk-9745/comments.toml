[[comments]]
order = 5
subject = "يا ختي عليها"
author = "مش لازم"
posted = "2008-07-30"
text = "لمدة قاربت الساعتين؛ استضاف \"صالون عشرينات\" الكاتب الصحفي أحمد المسلماني، حول تجربته الإعلامية والصحفية التي يطل بها على جمهوره من خلال برنامجه \"الطبعة الأولي\" والذي يذاع على قناة دريم الفضائية، وعمله الصحفي بجريدة المصري اليوم، بالإضافة إلى تحريره للعديد من الكتب، ككتاب \"العلم والعصر\" للعالم المصري أحمد زويل، حيث أنه المتحدث الصحفي باسم صاحب نوبل.<br />تحدث المسلماني بداية عن تركيبته الريفية التي اختلطت بالحضر حيث نشأ في بسيون في محافظة الغربية، وكيف أن الجلسات الريفية التي تلتف حول \"الشيشة\" وتتيح الكلام لكل من يريد قد أفاده على المستوى الشخصي."
archived = "2010-03-14"
capture_url = ""

[[comments]]
order = 6
subject = "منعم رويتر الاخوان اتجوز يا رجاله"
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-07-30"
text = "منعم وإيمان إتخطبوا<br />Posted by العميد ميت under سياسه<br />[5] Comments<br />في السكرته عملوها وقروا الفاتحة<br />وفي السكرته برضه كانت الخطوبه<br />بس المره دي ماكنشي بنفس درجه السكرته بتاعت قرايه الفاتحة<br />بس ضحكوا علينا مافيش حلويات ولا أي حاجة<br />كان حفل الخطوبه علي الضيق<br />لبسوا الدبل<br />وقرطسونا في الحلو<br />تقولوا عليهم مدونين<br />تقولوا عليهم صحفيين<br />تقولوا عليهم ناشطين<br />تقولوا إلي إتقوله<br />مبروك ياعبد المنعم .. مبروك يا إيمان<br />ربنا يهني سعيد بسعيده<br />وعقبال ماتجيبوا لنا منعم وإيمان صوغنتتين كده<br />* ويبقي العُذاب عُذابا … ويفرح المخطوبون والمتزجون بحياتهم ويستمر العُذاب في تقشير اللب .. في إنتظار يومهم"
archived = "2010-03-14"
capture_url = ""
