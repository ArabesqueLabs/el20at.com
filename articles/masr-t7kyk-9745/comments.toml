[[comments]]
order = 2
subject = "مفيش اسوأ من كده"
author = "مش شريف الدواخلي ولا  البراء ا"
posted = "2008-07-30"
text = "فعلا مفيش اسوأ من كده<br />وبعدين عيب لما واحد عاملي بروفيسور في الاعلام يتكلم بلهجة عامية<br />فيه حاجه اسمها لغة عربية<br />والى المعلق السابق محمد حمدي<br />عيب لما اسمك يبقى على اسم النبي صلى الله عليه وسلم وتعمل مدونة تستهزا فيها بالمسلمين<br />بصو يا اخوانا محمد حمدي (حيث لا محمد ولا حمدي) كاتب ايه في المدونة بتاعته للتريقة على نار جهنم<br />\" إتقوا الله .. والله العظيم يوم القيامه ولا حاجه من دى هتنفعكم وهتتحمروا فى نار جهنم ولا السمك المقلى \"<br />المدونة اسمها لكم دماغنم ولي دماغي<br />خلي بالك المسيحيين والاقباط بيفرحوا اوي بامثالكم<br />روحوا منكم لله"
archived = "2010-03-14"
capture_url = ""

