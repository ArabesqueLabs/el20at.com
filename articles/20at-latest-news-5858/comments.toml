subject = "انا اؤيد الحكم القضائي"
author = "احمد"
posted = "2007-05-15"
text = "بسم الله الرحمن الرحيم<br />منذ فترة من الزمن كنا نعيش عصر الجمود الإعلامي، فكل القنوات الإعلامية كانت للتطبيل والتزمير للحكّام والحكومات، وبعدها ظهرت قناة الجزيرة وبدأ هذه الصورة تتغير، ولكن للأسف تغيّرت إلى الجهة المقابلة بشكل مبالغ فيه.<br />فبدلا من ان تكون قنوات تهتم بالأمة، اصبحت تروّج وتنشر اكاذيب الدول المعادية التي هدفها إضعاف الأمة ومنعها من التقدم، وإذا سُألت اي قناة من هذه لماذا تفعلون هذا؟ لأجابوا: \"الرأي والرأي الآخر\"!<br />وتجد ان القنوات الغربية لا تفعل هذا ابدا، فهي تخلتقها الأكاذيب وتنشرها من اجل دعم موقف حكوماتها، مع انها حكومات مجرمة، بينما للأسف يتراكش الصحفيون العرب لفعل العكس، بدون ادنى شعور بالكرامة.<br />سبحان الله، يا جماعة ارجوا تصحيح المفاهيم التالية:<br />1 - نعرض الرأي الآخر عندما يكون ذاك الرأي منطقيا، اما ان تكون القنابل تتساقط فوق رؤوس إخواننا في العراق وفلسطين وغيره وغيره، ثم بمجرد ان يصرّح البيت الأبيض بأن الهدف \"تحرير\" لا \"إحتلال\"، فعندها لا يجوز ان نقوم بتسويق هذه الآراء تحت شعار الرأي الآخر، لأن هذا ببساطة ما يسمى \"الحرب النفسية\" ولا يؤدي إلى إلا تخدير الرأي العام.<br />2 - اما الكلام عن حرية التعبير، فإذا ما قال الإنسان رأيه بين اصدقاءه واهله فهذا شخص يريد التعبير عن رأيه ولا يجوز محاكمته، اما ان يقول هذا الكلام على وسائل الإعلام، فهذا شخص هدفه ان يقوم بتعبئة الرأي العام، ولذلك فمن حق الدولة عندها ان تحاكمه إن كان في كلامه ما يثير الإحباط او الوهن او الضعف في الأمة.<br />وبإختصار فنحن للأسف تحولنا من عصر \"إعلام سيادة الرئيس\" إلى زمن \"الدياثة الإعلامية\" (من ديوث).<br />والسلام ختام<br />وتصبحوا على خير"
