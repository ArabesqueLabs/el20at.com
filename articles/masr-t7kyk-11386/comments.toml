[[comments]]
order = 2
subject = "بتوع الداخلية اصحاب العقلية البلطجية كانوا مركبين"
author = "هاهاها ----------- هاهاها"
posted = "2009-02-24"
text = "شوف الجهل<br />الاشاوس بتوع تعذيب المواطنين ورميهم فى المعتقلات واقتحام البيوت فى نص الليل لتحصيل غرامة<br />هؤلاء الجهلة كانوا مركبين 20 كاميرا تسجيل فى ميدان الحسين<br />ونتيجة لادارتهم الجيدة - تخيل ولا كاميرا واحدة اشتغلت<br />احدى الصحف بتقول ولا كاميرا واحدة سجلت حاجة<br />يظهر ان العسكرى مخيمر بتاع كفر الهنادوة كان هو المكلف بصيانتهم وتشغيلهم<br />اة يا امة ضحكت من جهلها الامم"
archived = "2010-03-14"
capture_url = ""

[[comments]]
