subject = "الجرايد - بتقول ان القنبلة عبارة عن بلاص من الفخار"
author = "لية"
posted = "2009-02-24"
text = "الاختراع الجديد ان البلاص بتاع المش او العسل الاسود بقى قنبلة - العيال وضعوا شوية بارود من بتاع البمب وشوية زلط ومسامير وولعوا فية<br />انتم عارفين مدرسة المشاغبين - لما يونس شلبى ولع فى المدرسة وقعد يصرخ ويقول حريقة حريقة ابويا مات<br />يظهر ان الحكاية كدة لعب عيال"
archived = "2010-03-14"
