[[comments]]
order = 0
subject = "ضع عنوان التعليق"
author = "اكتب اسمك هنا"
posted = "2009-02-23"
text = "لم يتصل الرئيس الامريكى اوباما لشجب العملية الارهابية واعلان دعمة للنظام<br />لم يتصل الملك السعودى ويعلن شجبة للارهاب ودعمة للنظام مع شوية فكة لتمشية الحال<br />لم يتصل رئيس الامارات ولا امير الكويت ليشجبوا ويدعموا بشوية فكة برضة<br />لم يتصل حتى الرئيس التركى<br />ولا المانيا ولا بريطانيا<br />يعنى اية<br />العملية فشلت بكل المقاييس<br />سلام يا صاحبى"
archived = "2010-03-14"
