subject = "الحل في ايد رئيس الدولة"
author = "اكتب اسمك هنا"
posted = "2009-02-24"
text = "الحل كله في ايد رئيس الدولة<br />هو الوحيد اللي يقدر ينهي المهازل دي<br />بلاش نعمل ثورة عليه<br />هو اللي المفروض يخطب خطاب ويعلن الثورة على الفساد وكل المهازل اللي بتحصل في البلد دي"
archived = "2010-03-14"
