text = "انا شخصيا لا اتابع هذه المسلسلات لاسباب عديدة منها انها جد طويلة و اخرى انها لا تصب فيما تعيشه مجتمعات من صراعات و شبابنا بالاخص بل هي تصبح صراعا اخر اذ اصبح جل شبابنا العربي متابع لهذه المسلسلات المدبلجة التي في اغلب ما تكون مهتمة بمواضع الحب و الغرام اذ انها تجعر مراهقينا في عالم الاحلام الرومانسية و الخيالات الدرامية ."
