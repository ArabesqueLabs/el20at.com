[[comments]]
order = 4
subject = "مسلسل للأسف ساقط"
author = "محمد نواف"
posted = "2008-09-02"
text = "بدايةً ,,<br />أنا شخصياً مابتابع هيك مسلسلات ما إلها أي معنى أو هدف أو غاية أو جدوى أو منفعة لا لألي ولا لغيري !<br />الله يرحم أيام مسلسلات زمان . وين المسلسلات اللي كانت بتتحدث عن النضال والكفاح ,,<br />اللي كانت تتحدث عن الأمل والتفاؤل ,,<br />اللي كانت تتحدث عن الفساد ,,<br />اللي كانت تتحدث عن الأوضاع والاحوال السياسية ,,<br />اللي كانت تتحدث عن هم المواطن العربي ,,<br />اللي كانت تتحدث عنجدودنا وآبائنا ( الله يرحمهم أجمعين ) ,,<br />اللي كانت تتحدث عن البطولة والشجاعة والتضحية والفداء ,,<br />كلها تبخرت بالهوا وطارت لبعيد ( من غير رجعة ) أو بعمنى ثاني ( ذهبت أدراج الرياح ) !!<br />لا يوجد بعد المسلسلات السورية الهادفة<br />فعلاً قمة في الدراما والتصوير والأخراج والإشراف وكتابة القصص والسيناريوهات وغيرها الكثير ,,<br />كم هو رائع تمثيل الفنانيين السوريين ؟!<br />قمة الدراما العربية أجمع تتمثل بمسلسلات ومسرحيات وأفلام السوريين فقط<br />والباقي صفر على الشمااااااااااال<br />إلى كل أهبل بتابع هذا المسلسل <<< استحي على حالك وأعقل ,, عيب عليك !"
archived = "2010-03-14"
capture_url = ""

