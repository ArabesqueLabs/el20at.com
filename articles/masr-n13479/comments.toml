[[comments]]
order = 11
subject = "نظيف دوت كوم"
author = "علياء"
posted = "2007-12-24"
text = "يا حكومة إلكترونية يا<br />www.nazef.com<br />منذ أن طل علينا الدكتور أحمد نظيف كرئيس لمجلس الوزراء تفائل الجميع خيرًا بعد أن أعلن عقب أداء حكومته اليمين الدستورية أمام الرئيس حسني مبارك في يوليو 2004 استخدام حلولاً غير تقليدية لمعالجة القضايا التي طالما أرقت الشعب المصري، واستعصت على الحكومات السابقة ومن بينها وأهمها ارتفاع الأسعار، والبطالة، وإنخفاض دخل المواطن المصري، والسكن، والتعليم، وغيرها....<br />وانتظرنا جميعًا الحلول الغير تقليدية التي ستبتدعها لنا الحكومة الذكية الإلكترونية برئاسة الدكتور نظيف والذي عُرف بنزاهته، وانتظرنا منه القضاء على مليشيات الفساد التي تكاتفت من أجل نهب وتجويع المواطن المصري الذي يزداد فقرًا يومًا بعد يوم.<br />ونحن هنا لا ننكر أن الرجل يسعى دائمًا لتحقيق برامج حكومته التي أعلن عنها منذ بداية توليه مهام رئاسة مجلس الوزراء، ولكننا نطمع ونطمح في القضاء على جميع مشاكلنا والتي تمس المواطن المصري البسيط الذي يستيقظ من نومه باكرًا مع آذان الفجر ليخطف فطوره من على أحد عربات الفول ليجري ويلحق بالأتوبيس ليصل إلى عمله ليتقاضى في آخر الشهر بضع جنيهات من المفترض أن تكفيه هو وأسرته التي قد تتكون من خمسة أفراد على أقل تقدير !! – تكفي مصاريف المدارس والجامعات والدروس الخصوصية والطعام والشراب والعلاج والمواصلات والإيجار وفواتير الكهرباء ورسوم النظافة وفواتير التليفون والغاز- ولم نحسب هنا حسابًا للترفيه أو السفر أو غيرها فالمواطن المصري قانع وأحلامه بسيطة في أن يعيش مستورًا بشكل لائق يحقق آدميته!!!<br />كلها كانت أحلام وأمنيات علقها المواطن المصري على كتف أحمد نظيف، ولكننا استيقظنا على كوابيس فالوضع لم يتغير بل ازداد سوءًا !!! فارتفعت الأسعار وخيم الغلاء على جميع السلع، وزادت البطالة، وزاد الفقر، وسيطر الفساد على كل شيء، وأصبحت الواسطة والمحسوبية هي الوصفة السحرية للحصول على وظيفة أو خدمة من الحكومة المبجلة وضاعت أحلام المتميزين والمتفوقين في الحصول على فرصهم بعد أن ألغى دكتور نظيف تعيينات الأوائل في الجامعات المصرية لتسيطر حالة من اليأس والإحباط على المصريين.<br />أضف إلى ذلك الإنتهاكات المستمرة، والتعذيب الذي أصبح منهجيًا في أقسام الشرطة، وعلى الرغم من فضح هذه الإنتهاكات بشكل يومي على صدر صفحات الصحف والمجلات إلا أن الحكومة تعلن دائمًا أن هذه استثناءات ولا يمكن تعميم الإستثناءات وأن هؤلاء الذي ينتهكون حقوق الإنسان ما هم إلا قلة قليلة!!!!<br />فبعد كل هذا... نتسائل ماذا حققت الحكومة الإلكترونية للمواطن المصري؟ ماذا حققت لنا تكنولوجيًا واقتصاديا واجتماعيًا ودوليا وحقوقيًا ... كلها أسئلة نحاول أن نجيب عنها من خلال موقعنا \" نظيف دوت كوم \" فنحن هنا نحاول أن نُقيّم أداء الحكومة ليس باعتبارنا متخصصين أو سياسيين أو اقتصاديين ولكن باعتبارنا مواطنين لنا احتياجات وحقوق من هذه الحكومة.<br />لا ننكر وجود إيجابيات ولكن مازلنا نعاني من سلبيات شديدة نرفعها إلى رئيس مجلس الوزراء الدكتور أحمد نظيف – عبر \"نظيف دوت كوم\" - لكي يحاول معنا معالجتها ... نعترف أن حمله ثقيل، ولكن همومنا أثقل !! فعلينا أن نتكاتف سويًا –مواطنين وحكومة- من أجل تحقيق أقصى استفادة ممكنة من جهود حكومة نظيف الإلكترونية، وجهود المواطن المصري لرفعة بلده وقيامه بواجباته على أكمل وجه ليحصل على حقوقه التي يرجوها على أكمل وجه أيضًا، فكما لحكومة نظيف واجبات لابد أن تؤديها، على المواطن المصري أيضًا واجبات لا تقل أهمية يجب عليه أن يؤديها بإخلاص.<br />نأمل أن يكون \"نظيف دوت كوم\" حلقة وصل بين المواطن والحكومة فلسنا مع أحد ضد أحد ولكننا مع وطننا مصر... ومع مصلحة مصر ... ومع كل ما يحقق لها رفعة وكيان وكرامة بين دول العالم في زمن العولمة وعصر السموات المفتوحة."
