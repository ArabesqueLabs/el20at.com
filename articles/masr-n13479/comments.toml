[[comments]]
order = 1
subject = "الخواجة لما يفلس"
author = "من العمال"
text = "ايوة يا ست مروة - كلامك كلة جميل - وموضوعك زى الفل - بس فية حاجة غايبة عن المجلس اللى بيسأل الراجل عن المشاكل<br />جواب تكليف حكومة نظيف من الرياسة فية اية ؟<br />الراجل نفذ كل ما جاء فى جواب التكليف<br />وبعدين الدولة ماشية بتوجيهات وبناءا على توجيهات فلان والراجل لم يخالف التوجيهات ولم يخرج عن الخط اطلاقا ونفذ التعليمات بحذافيرها<br />ولكن المشكلة هيجيب منين ؟<br />الشركات اللى كانت بتجيب دخل للخزانة انباعت<br />والمشاكل عايزة فلوس والفلوس عايزة مصدر والمصدر انباع والشعب فقير<br />الاسوأ لسة جاى<br />وقعر القدرة فيها البهاريز<br />والحل مش عند نظيف - لا - الحل عند الشعب"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224090424/http://masr.20at.com:80/newArticle.php?sid=13479"

[[comments]]
order = 2
subject = "ارباح البنوك من 10% الى 6%"
author = "مفروم"
text = "طبعا انتو عارفين ان عم الشيخ نظيف دا اصلاحي كبير جدا وجه مخصوص علشان خاطر الاصلاح الاقتصادي<br />واول ما جه اشتغلنا في دمج البنوك وبيع البنوك قلنا حلو اكيد الاصلاح دا حيرفع الارباح من 10% نقول الى 125 لان انتو عارفين ان فيه ناس عايشين على ارباح البنوك يعني مثلا فيه ناس حطه مبالغ معينة في البنوك وعايشة على ارباحها وكلهم ارامل وايتام<br />المهم ان عم نظيف بعد الحملة الشرسة لضبط والبنوك واصلاحها من الفاسدين فاجئنا بتخفيض الفايدة من 10% الى 6%<br />طيب والناس اللي عايشه على الارباح تعمل ايه يا عم نظيف<br />يعني اللي كان حاطط 10000 جنيه كان بياخد عليهم 100 جنيه في الشهر فوجىء بانهم اصبحوا 60 فقط<br />شكرا يا عموا نظيف"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224090424/http://masr.20at.com:80/newArticle.php?sid=13479"

[[comments]]
order = 3
subject = "وزارة الاخلاق الحميدة"
text = "مرة نظيف دخل مجلس الوزراء لرئاسة اجتماع<br />فلقى كل الوزراء بيتكلموا في البزنس<br />فقالهم دي ما بقتش وزارة الاخلاق الحميدة دي بقت وزارة شارع الشواربي الحميدة"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224090424/http://masr.20at.com:80/newArticle.php?sid=13479"

[[comments]]
order = 4
subject = "وزارة مزدوجى الجنسية"
author = "sd"
text = "كم وزير فى الوزارة دى من مزدوجى الجنسية ؟<br />هل مزدوجى الجنسية عندهم ولاء لبلدهم والا لمصالحهم وغيروا جنسيتهم لسعودى وكندى وانجليزى وغيرة لية<br />منفعة شخصية<br />يمكن<br />ربنا يصلح الاحوال"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224090424/http://masr.20at.com:80/newArticle.php?sid=13479"

[[comments]]
order = 5
subject = "الراجل الوحيد"
author = "سعيد"
text = "نظيف هو الرجل الوحيد فى الوزارة اللى ما بيسبغشى شعرة اسود"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224090424/http://masr.20at.com:80/newArticle.php?sid=13479"

[[comments]]
order = 6
subject = "بصو في الصورة كويس"
text = "كانوا بيسموه في الوزارة العقل الالكتروني<br />دلوقتي باه اسمه العقل الحلزوني"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224090424/http://masr.20at.com:80/newArticle.php?sid=13479"

[[comments]]
order = 7
subject = "الحمار"
text = "قال بصراحة انا أحسن منكو<br />أحسن من ملايين فـ زمانكوا<br />مش شرَّاني ولَّا لئيم<br />ولا بتملَّق عند زعيم<br />واحسن ماكُل حق الناس<br />بقعد آكل في البرسيم"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224090424/http://masr.20at.com:80/newArticle.php?sid=13479"

