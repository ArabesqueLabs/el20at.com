[[comments]]
order = 15
subject = "مهزلة لنهب مال الدولة نطرحها علي ضمير الرئيس مبارك"
author = "احمدعلي"
posted = "2008-11-08"
text = "من يحاسبهم ياسادة علي هذا الفساد المستشري ؟<br />ياعم يابتاع الشفافية ؟<br />1- نشرت جريدة الوفد بتاريخ 7/7/2007 بالصفحة 3 النص التالي :<br />\\\" إهدار 95 مليون جنيه في محطة كهرباء اللآهون وهيئة المحطات المائية لتوليد الكهرباء أنهت تنفيذها عام 2003 والقابضة للكهرباء رفضت أستلامها وضغوط من وزير الكهرباء لإنهاء الأزمة والتعتيم علي تقارير جهاز المحاسبات \\\" .<br />2- نشرت جريدة الوفد بالعدد رقم 1221 المؤرخ 26/7/2007 بالصفحة 3 مايلي بالنص \\\" جهازالمحاسبات يطالب الكهرباء برد 52 مليون جنيه أهدرتها علي مشروع منخفض القطارة \\\".<br />3- نشرت جريدة الوفد بعددها رقم 6396 بتاريخ 29 أغسطس 2007 مايلي \\\" أختفاء 32.5 مليون جنيه في هيئة المحطات المائية للكهرباء والقيادات أنشأوا إدارة حسابات خاصة بهم لصرف المكافآت بعيداً عن الرقابة \\\".<br />4- نشرت جريدة صوت الأمة بعددها رقم 371 بتاريخ 21/1/2008 مقالة علي نصف صفحة نصها مايلي\\\" مفاجأة بالمستندات.. خطابات موقعة باسم الوزير بطرس غالي تكشف إهدار المال العام بمئات الملايين في وزارته ومخالفات مالية جسيمة تورط فيها قيادات كبيرة بوزارة المالية مع قيادات في الهيئة العامة لتنفيذ مشروعات المحطات المائية لتوليد الكهرباء وقد وصلت قيمة تلك المخالفات نصف مليار جنيه من ميزانية الدولة أهدرت علي مشروعات وهمية لم تنفذ بقطاع الكهرباء وحوافز للجان لا تجتمع \\\" والقضية منظورة بالنيابة الأدارية تحت رقم 22لسنة2007 ونص مقالة الجريدة منقول علي لسان المستشار الدكتور ابراهيم عبد الله بالنيابة الأدارية.<br />5- في أحدث تقرير للجهاز المركزي للمحاسبات 2008 جاء فيه 98 مليون جنيه مشروعات وهمية وقرض توشيبا طار في الماء في هيئة مشروعات المحطات المائية لتوليد الكهرباء .<br />6- في أحدث تقرير للجهاز المركزي للمحاسبات جاء به في هيئة تنمية واستخدام الطاقة الجديدة والمتجددة هناك 590 مليون جنيه غير مستغلة و90 قرش خسارة عن كل جنيه وورد به بلاوي وكوارث أخري لا يتسع المقام هنا لذكرها.<br />7- في أحدث تقرير للجهاز المركزي عن هيئة المحطات النووية لتوليد الكهرباء تحدث التقرير عن مبلغ 60 مليون جنيه لمشروعات متوقفة و17 مليون جنيه عجز جاري و705 مليون جنيه فوائد لقروض محلية ومصروفات إدارية وعمومية وبلاوي أخري كثيرة .<br />8- في هيئة كهرباء الريف 1.2 مليار جنيه رصيد دائنين والهيئة تستعمل الأيرادات للصرف علي المكافآت وهناك 119 مليون جنيه سحب علي المكشوف ورصيد القروض 8.5 مليار جنيه وبلاوي كثيرة ويمكن لسيادتك ياريس مبارك أن تقرأ تفاصيلها مع السيد رئيس مجلس الوزراء وأجهزتكم الرقابية علي موقع ( عالم المال ) تحت عنوان \\\" طاقة \\\" .<br />9- بجريدة الأهرام التابعة للحكومة؟بصفحة الحوادث الصادرة 17/9/2008 جاء فيها\\\" محاكمة 52 مسئولاً بوزارات الكهرباء والمالية والتنمية الأقتصادية لتسببهم في أهدار 102 مليون جنيه ؟ تم إنفاقها عن طريق هيئة المحطات المائية لتوليد الكهرباء في أجراء دراسات علي مشروعات لا طائل منها وأهدار 52 مليون جنيه علي مشروع منخفض القطارة بنفس الهيئة مع علم المسئولين بوزارة الكهرباء إستحالة أقامة المشروع لوجود أنشطة بترولية بموقعه حتي عام 2019 ؟ وأهدار 50 مليون جنيه أخري علي مشروع وهمي تحت مسمي \\\" الضخ والتخزين \\\" مع وجود دراسات سابقة تؤكد فشله ؟ وبنفس الجريدة جاء فيها حصول واحد من العاملين علي مكافأة سنوية بلغت في عام واحد 261 ألف جنيه ؟ وعدم سداد الهيئة 125 مليون جنيه ديون لبنك الأستثمار .<br />10 - وبتاريخ 17/9/2008 وبجريدة المصري اليوم نشر فيها\\\" إحالة 52 متهماً من الكهرباء والمالية للتأديبية تلاعبوا في صرف الموازنة والتحقيقات أكدت حصول المسئولين بهيئة المحطات المائية للكهرباء علي 12 مكافآة غير شرعية بلغت قيمتها 125 مليون جنيه ؟ وصرف 25000 جنيه أخري لخمسة أشخاص بالهيئة ( بأسماء وهمية ؟!) وأن مدير عام الحسابات حصل علي 11 مكافأة غير شرعية بينما حصل كبير الجيولوجيين علي 12 مكافأة وذلك خلال عام واحد فقط ؟<br />11- بتاريخ 17/9/2008 نشرت جريدة الأحرار بعددها الصادر بالصفحة رقم 5 وعن نفس هيئة المحطات المائية لتوليد الكهرباء \\\" عصابة الـ52 موظفاً تستولي علي أموال الدولة والنيابة تطالبهم برد المبلغ وتطالب بالتحقيق مع موظفي الجهاز المركزي للمحاسبات المتواطئين مع قيادات الهيئة المنكوبة .<br />12- طالعتنا جريدة المساء الأسبوعية الصادرة 25/10/2008 في عددها رقم 18806وعلي صفحتها الأولي وبالبنط العريض بخبر كارثي ومهزلة كبري للفساد المالي لم ولن تحدث في أي دولة من دول العالم المتحضر أو المتخلف حيث جاء فيها \\\" 52 وكيل وزارة ورئيس هيئة بالمحطات المائية لتوليد الكهرباء أمام المحكمة التأديبية العليا حصلوا ونهبوا وسرقوا أموال الدولة بملايين الجنيهات ونصبوا حتي علي وزارة المالية والسؤال الذي يطرح نفسه علي هذا الخبر أو المسخرة والمهزلة الكارثية هو كيف يتم تحويل 52 وكيل وزارة ورئيس هيئة من وزارة واحدة وهي وزارة الكهرباء ومن هيئة واحدة ؟ ثم هل وصل حجم الفساد المالي إلي هذا الحد الهزلي والكارثي في مصر ؟ وإذا ماتم تحويل 52 وكيل وزارة دفعة واحدة من وزارة واحدة؟ فكيف هو حجم وكم الفساد المستخبي في بقية وزارات وهيئات ومؤسسات الحكم في الدولة ؟ ثم أين السيد رئيس الجمهورية ورئيس الوزراء من هذه المسخرة والمهزلة الكارثية للفساد ؟ ثم ماذا ينتظر وزير الكهرباء من بعد لكي يقدم أستقالته أو يقال ؟ وأليست تلك الهيئة تابعة له ؟ أم تابعة لوزير كهرباء جزر القمر ؟ للأسف الشديد أن الوزراء عندنا وبقية دول العالم المتخلف يبدو أنهم من ذوات الدم البارد بعكس أقرانهم من وزراء العالم المتحضر من ذوات الدم الحار الوطني الذين يسارعون بتقديم أستقالتهم من فرط وطنيتهم وإحساسهم بالمسئولية حالة حدوث أخطاء في أي جهة تابعة لهم وربما لا تقاس بمثل هذه المسخرة والمهزلة الكارثية لنهب وسرقة المال العام كما حدث في هيئة وزارة الكهرباء أو هيئة علي بابا والـ 52 حرامي ولقد ورد ضمن أسماء المتهمين أسم / محمد الحارث الجزار الرئيس التنفيذي لهيئة المحطات المائية لتوليد الكهرباء وهو علي بابا ومعه بقية عصابة 52 حرامي ؟<br />13- أما الأنكد من ذلك كله هو قيام السيد وزير الكهرباء والطاقة الدكتور حسن يونس بتعيين المهندس / محمد الجزار الرئيس السابق لهيئة المحطات المائية وبعد خروجه للمعاش وعلي الرغم من أنه محال للمحاكمة التأديبية في القضية أو الفضيحة رقم 22 لسنة 2007 إلا أن السيد وزير الكهرباء بذلك بدي أنه \\\" يكافئه \\\" ؟! بتعيينه عضواً في مجلس إدارة شركة الأسكندرية لتوزيع الكهرباء وذلك تقديراً علي مايبدو من السيد الوزير له علي عبقريته الفذة في خراب الهيئة ونهب أموال الدولة وتبديدها والتربح والنهب فيها ؟ ولا عزاء هنا للشرفاء."
