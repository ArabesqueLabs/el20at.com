subject = "من  سرق  بلادي ؟"
author = "khalid suliman"
posted = "2008-11-08"
text = "من سرق بلادي ؟<br />في بلادي …<br />ناس كتيرة ماتت متسرطنة<br />وناس غيرها ماتت متحسرة<br />وناس ماتت في البحار غريقة<br />وغيرهم أكلتهم نار الحريقة<br />وناس مؤدة تحت صخور الجبال<br />وناس ساكنة أحواش المقابر<br />أو في خيمة مشدودة بالحبا ل<br />في بلادي …<br />سرقوا الحب من قلوب البنات والعذاري .. سرقوا حتي الحلم ..<br />والفرحة والطرحة …. وفستان الزفا ف<br />سرقوا حتي الأمل من عيون الشباب اللي شاب ؟<br />سرقوا البكارة والشرف وحتي العفا ف<br />سرقوا حتي اللقمة من بق اليتيم ؟<br />سرقوا حتي من الغلابة حد الكفا ف ؟<br />في بلادي …<br />مات الشاطر حسن وساب فينا أبونا وأمنا الغول ؟<br />وشعب أخرس حزين ممنوع من الكلام والقول ؟<br />وناس بتموت من الكافيار والكل مات بالفول<br />وناس تقول العيب فينا …والكل يقول في راس الغول ؟<br />في بلادي …<br />ساكنة فيها كل ملوك الشر…. من ملوك الجن وملوك البشر<br />ساكنة فيها الشياطين والسلاطين والقوادين واللواطين<br />ساكنة فيها السياط والعياط والنواح وأبشع الجلادين<br />ساكنة فيها السجون والخراب والبوم والشؤم والزنازين<br />في بلادي …<br />ناس عايشة في قصور دفيانين ومحفلطين وملمعين<br />وناس ماشية بتبكي وبتكلم نفسها وعلي الخد دمعتين<br />وناس ياعيني بتدور في الزبالة علي لقمتين<br />وناس تانية بتلعب جولف ومش داريين ولا سامعين الأنين؟<br />في بلادي …<br />التعالب والحيتان والضباع والنسور والديابة<br />والكلاب اللي بتنهش في عرض الغلابة<br />وفيران بتطارد أسود من جوه غابة ؟<br />وناس علي البورش نايمة وقايمة<br />وناس راكبة بورش وعلي وش الفتة عايمة<br />في بلادي …<br />باعوا القطاع العام وباعوا المصانع واللي صانع والمزارع واللي زارع ؟<br />والموظف في الشوارع ياعيني علي وجهه هام<br />والعامل بقي زيه علي القهاوي صايع ؟<br />والكل بيجري ورا سراب أو حلم ضايع ؟<br />في بلادي …<br />سرقوا البنوك والمتاجر والمواطن والمهاجر وقطعوا حتي الحناجر<br />سرقوا الأثار سرقوا الحديد والأراضي والمبا ني والمحاجر<br />سرقوا حتي بصيص الأمل من العيون في المحاجر<br />اعتمدوا لغة الرصاص والبصاص والمخبرين والخناجر<br />في بلادي …<br />سرقوا الزمان ونهبوا المكان وحتي حقي في الأمان<br />من البيوت ومن الجيران ومن الشوارع والأزقة والحواري<br />وباعوا الضمير الحر في سوق النخاسة والجواري<br />باعوا الشرف وباعوا الرايات وباعوا البيارق مع السواري<br />وحرقوا الكتب وقصفوا القلم وبقي الألم مع الشجن دليلي ومساري؟<br />في بلادي …"
