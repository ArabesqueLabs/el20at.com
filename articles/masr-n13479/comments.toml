subject = "مهزلة لنهب المال العام نطرحها علي السيد الرئيس مبا"
author = "محمد غيث الدستاوي"
posted = "2008-11-11"
text = "وزارة الكهرباء والطاقة<br />هيئة تنفيذمشروعات المحطات المائية<br />لتوليد الكهرباء<br />ش. حسن أفلاطون- أرض الجولف<br />مدينة نصر – القاهرة<br />بلاغ رسمي وتظلم عاجل<br />ـــــــــــــــــــــــــــ<br />لماذا تقاعست النيابةالإدارية في عدم تحويل الجناة إلي النيابة العامة بعد أن أهدروا وبددوا وتربحوا في كوارث وصل حجم المال العام فيها إلي مئات الملايين من الجنيهات ؟؟!!<br />- إلي فخامة السيد رئيس الجمهورية والرئيس الأعلي للسلطة التشريعية والتنفيذية .<br />- إلي معالي السيد الوزير المستشار / وزير العدل الموقر .<br />- إلي معالي السيد الوزير المستشار / النائب العام للدولة .<br />مقدم البلاغ :<br />محاسب / محمد غيث محمود – ومحاسب / محمد شريف فاروق/ مديري عموم بهيئة تنفيذ مشروعات المحطات المائية لتوليد الكهرباء – إحدي هيئات وزارة الكهرباء والطاقة المصرية.<br />الموضوع:<br />- بتاريخ 1/6/2006 تقدمنا ببلاغ إلي السيد الدكتور مهندس الرئيس التنفيذي للهيئة المذكورة محل عملنا يحوي العديد من المخالفات الجسيمة للمال العام بين هدر وتربح بمئات الملايين من الجنيهات تمت بمعرفة وأيادي قيادات محددة ومعرفة بالأسم والوظيفة وتم ذلك فور تمكننا من الحصول علي ( بعض ) المستندات المدعمة لاتهاماتنا .<br />- بتاريخ 3/6/2006 قمنا بأبلاغ معالي السيد الدكتور / وزير الكهرباء والطاقة بما توصلت إليه أيادينا من مستندات عن بعض تلك المخالفات وخاصة وأن القيادات والجناة المشكو في حقهم كانوا يخصصون وحدة محاسبية خاصة وسرية بهم ويحتقظون بكافة القيود المحاسبية ومستندات ومواضيع الصرف لديهم في غرفة خاصة محكمة الغلق وأداروا الهيئة العامة وكأنها شركة تضامن خاصة بهم وصرفوا بأنفسهم ولأنفسهم ما أرادوا بعيداً عن أعين الرقابة بل وصل بهم ( السفه والاستهتار ) لحد فتح حسابات خاصة ببنوك خاصة وتبليغ توقيعاتهم لتلك البنوك والتوقيع بأنفسهم وبأيديهم علي ما أرادوا وكيفما أرادوا دون أدني رقيب أوحسيب عليهم سواء من مندوبي وزارة المالية أو مندوبي الجهاز المركزي للمحاسبات والمقيمين بالهيئة لهذا الغرض والذين تمت إدانتهم بالتواطؤ معهم في تلك المخالفات الجسيمة التي طالت المال العام للهيئة وبمئات الملايين من الجنيهات – وبالتالي كان من المستحيل الحصول علي أي مستندات تخص تلك المخالفات في ظل تلك السرية والإحكام الذي كانوا يحفظون به جميع مستندات وقيود الصرف المخالفة في غرفة خاصة ومحصنة وحتي وقع تحت أيادينا ( بعض ) عن تلك المستندات التي تقدمنا بها لشكواهم .<br />- بتاريخ 7/6/2006 تقدمنا ببلاغ إلي السيد الدكتور المستشار رئيس الجهاز المركزي للمحاسبات والذي استجاب لشكوانا وأرسل مفتشيه للتحقق والتحري لمدة ناهزت 6 شهور بمقر الهيئة .<br />- بتاريخ 6/7/2006 قمنا بأبلاغ السيد الدكتور وزير المالية رسمياً بأمر تلك المهازل .<br />- بتاريخ 7/7/2006 قمنا بأبلاغ السيد الدكتور / رئيس مجلس الوزراء .<br />- بتاريخ8/7/2006 قمنا بأبلاغ فخامة السيد رئيس الجمهورية – وكذا سيدة مصر الأولي الفاضلة – وكذا معالي الأستاذ /جمال مبارك رئيس لجنة السياسات للحزب الوطنى الديمقراطي .<br />- بتاريخ10/7/2006 قمنا بأبلاغ السيد المستشار رئيس هيئة النيابة الإدارية رسمياً وقدمنا مابحوزتنا من قليل المستندات المؤيدة لبلاغنا – ثم – أعقبنا ذلك ببلاغ آخر لسيادته تقدمنا به بتاريخ 16/9/2006<br />&--9658; استجاب السيد الدكتور وزير المالية وأرسل مفتشيه الي مقر الهيئة والذين نقبوا وتحروا وحققوا وفتحوا أسرارعش الفساد وحصلوا علي بعض مستنداته ( بعد تدمير وإخفاء معظمها؟!) وتأكدوا وقاموا بكتابة تقريرهم أو مذكرتهم النهائية ( والموقعة من السيد الدكتور وزير المالية ) وبيده بتاريخ 4/7/2007 والذي أرسلها معاليه إلي معالي السيد الدكتور وزير الكهرباء برقم وارد 104386 والذي عرض علينا قراءتها بسراي النيابة الإدارية والذي ورد بها وحرفياً \\\" اتضاح صحة جميع ماجاء بأقوال الشاكيين \\\" وجاء التقرير مفصلاً ليعرض مصائب وكوارث أذهلتنا ولم نكن ندركها ووصل حجم الهدر والسلب والتربح في مبالغها مئات الملايين من الجنيهات من المال العام الذي استباحوا وأهدروا حرمته ومن ثم قام معالي السيد الدكتور وزير الكهرباء بدوره خلال شهر 7/2007 بأبلاغ النيابة الإدارية ( مع ملاحظة أن بلاغنا نحن لنفس الجهة جاء سابقاً علي بلاغ معاليه بعام كامل) وكما يلاحظ هنا أيضاً أننا لم نري حتي تاريخه أي تقرير نهائي صدر عن التحقيقات التي تمت بمعرفة الجهاز المركزي للمحاسبات أسوة بما تم من قبل وزارة المالية وربما يرجع ذلك في تقديرنا الشخصي لتورط مندوبي الجهاز المركزي ذاته والمقيمين بالهيئة في التعمية والتغطية عن ماتم في مواضيع ومبالغ تلك المخالفات .<br />&--9658; بعد بلاغ السيد الدكتور وزير الكهرباء التالي لبلاغنا للنيابة الإدارية تم تحويل البلاغ إلي قضية برقم 22 لسنة 2007 وتم استدعاء المشكو في حقهم والجناة الأصليين و أيضاً نحن الشاكيين والمبلغين الأصليين للمثول أمام المستشار الدكتور / إبراهيم عبد الله - وعلي مدي جلسات متعددة تمت خلالها ومن قبل سيادته عرض تقرير السيد وزير المالية علينا كاملاً لقراءته وتبع ذلك أخذ أقوالنا وشهاداتنا حتي حدث المحظور فجأة ؟<br />&--9658; حيث قامت جريدة \\\"صوت الأمة \\\" بنشر مقالة في عددها رقم 371 الصادر بتاريخ 21/1/2008 \\\" ومفاده تقدم كلا من محمدغيث ومحمد شريف وهما من كبار المحاسبين بهيئة المحطات المائية للكهرباء ببلاغات للنيابة الإدارية ووزيري الكهرباء والمالية عن مخالفات مالية جسيمة وهدر وتربح وظيفي وصلت قيمته 449 مليون جنيه أي مايقارب النصف مليار جنيه وجاء مقال الجريدة ليسرد تفصيلاً وحرفياً ماجاء بمذكرة السيد وزير المالية ويفضح ملابسات تلك المخالفات وقيمتها وأعتمدت الجريدة وأوضحت في مقالها المشار إليه إلي أن مصدرها هو المستشار الدكتور /إبراهيم عبد الله من النيابة الإدارية بل أنها ( نشرت بذات الصفحة ) صورة ضوئية عن الخطاب الموجه من السيد وزير المالية إلي السيد وزير الكهرباء بذات المصيبة ؟! فماذا حدث بعدها ؟<br />&--9658; فوجئنا بأنه تم أستبعاد المستشار الدكتور/ إبراهيم عبد الله بل ونقله نهائياً من سراي النيابة الإدارية بمقرها الرئيسي برمسيس إلي الجيزة ؟؟؟!! وتم إحالة التحقيق إلي مستشار آخر يدعي المستشار / محمود قناوي والذي وجدناه يبدأ التحقيق معنا ( متحاملاً علينا نحن الشاكيين؟؟!!) ومن نقطة الصفر وحين سألناه عن محاضر التحقيق السابقة مع المستشار السابق قال هذا لا يخصكم؟ بل أنه كان ( يملي علينا ؟!) أن لا يزيد ردنا علي أسئلته الموجهه لنا ( عن سطرين فقط ؟!) وبطريقة مستفزة وعصبية وأصبحنا نشعر بل نتيقن أن هناك شيء ( غير طبيعي ؟!) بات يحدث أو مخطط له لسير وإنها هذه التحقيقات وخاصة أننا مثلنا أمام سيادته وأكمل معنا تحقيقاته في جلستين فقط ؟؟!! بل أنه أنهي تحقيقاته مع 120 شخص حسب تصريحات سيادته ( متفاخراً ؟!) في 17 جلسة فقط ولمدة لم نراها تكمل 3 شهور ليصدر قرار بإحالة 52 متهم إلي المحكمة التأديبية ( وزج بأسماؤنا ضمنهم بتهمة التقاعس عن الإبلاغ؟؟!!) ونشر في (تفاخر؟) وروج بالصحف القومية الأهرام والجمهورية وأيضاً بصحيفة الأحرار وجريدة المصري اليوم وجميعها صادرة بتاريخ 17/9/2008 أن سيادته وحسبما نشر علي لسانه قد ( تصدي؟؟!!) للتحقيق في هذه القضية وأنه استدعي للتحقيق حسب قوله ونص جريدة الأهرام 120 شخصاً علي مدي 17 جلسة ؟؟!! وأن التحقيق الذي أجراه سيادته أثبت حصول المسئولين علي 12 مكافآة غير مشروعة قيمتها 125 مليون جنيه فقط؟؟!! وأن بعض العاملين حصل علي مكافآت سنوية غير مشروعة ولشخص واحد بلغت 261 ألف جنيه ؟! وأن 10 موظفين آخرين حصلوا علي مكافأة أخري بقيمة25000 جنيه وصرفوها لأنفسهم بأسماء أشخاص وهميين ؟؟!! وأن قيادات الهيئة أنشأوا وحدة محاسبية خاصة بهم لصرف المكافآت الغير مشروعة بعيداً عن أعين أجهزة الرقابة ؟! وأنهم أستأثروا بها أنفسهم دون البقية من صغار الموظفين ولينهي تقريره وهو الأعجب والأغرب من نوعه في عدالة كل الأمم بعبارة أكثر غرابة وتعجباً وحسرة وألماً وهي :ً<br />\\\" ومع ذلك فأن النيابة قد قررت صرف النظر عن إبلاغ النيابة العامة؟؟!! مع حفظ مانسب إلي مجهول؟؟!<br />وهنا ياحضرات السادة الأفاضل وولاة أمورنا المحترمين مجتمعون نحن الذين آمنا بالله ورسوله وأن الله وحده عز و جل قد أختص ذاته المقدسة بوصف وأسم ( العادل) ونحن المصدقين الشرفاء الذين آمنوا واقتدوا بنهج القائد والزعيم مبارك في الطهارة والشفافية ومحاربة الفساد ولو كره الفاسدون ومعهم الظالمون نحن هنا وبموجبه ( نتصدي ) بدورنا ونتظلم ونبلغ ضمائركم الحية والمسئولة في جميع ماجاء بتقرير النيابة الإدارية الصادر عن السيد المستشار المذكور ونتصدي بدورنا لسيادته بالتالي:<br />1- لماذا تم تنحية ونقل المستشار الدكتور / إبراهيم عبد الله - بعد نشر مقالة صحيفة \\\" صوت الأمة \\\" ومن حقنا أن نتساءل ؟ أو علي الأقل نشك ؟ لأن التوقيت غريب وغير طبيعي؟<br />2- لماذا ( فجأة ؟!) تم تحويل التحقيق إلي مستشار آخر (مارس علينا كافة العصبية والآستفزاز؟؟!) في تحقيق لم يطول لأكثر من جلستين فقط لكل منا ؟ وفي قضية مال عام وصل حجم الفساد والتربح فيها ما يقارب نصف مليار جنيه ؟ وأنهاها وبكل تعقيداتها سيادته وبقدرة قادر في أقل من3 شهور فقط ؟<br />3- كيف يمكن لأي محقق قضائي في العالم أجمع أو حتي لشخصية السوبرمان الخرافية أن يجري تحقيقاته مع 120 شخص في 17 جلسة تحقيق فقط ؟! حسب تصريحات سيادته لجريدة الأهرام ومهما بلغت خبرته المهنية وطاقته الشخصية وفي قضية ضخمة بهذا الكم من الفساد سواء في مبالغها أو تعدد مواضيع التبديد فيها أو تعدد الجهات والأشخاص المتهمين فيها سواء بالمحطات المائية أو وزارة المالية أو وزارة الكهرباء أو وزاة التخطيط أو بنك الأستثمار القومي أو موظفين متورطين بالجهاز المركزي – فليشرح لمعاليكم مجتمعون ولنا كيف أن سيادته استطاع التحقيق مع كل هؤلاء وتلكم المواضيع في 17 جلسة فقط ولم تدم حتي لتكمل الثلاثة شهور ؟ وأليس معني ذلك وبكل بساطة ووضوح أن سيادته لم يبذل حتي الجهد العادي والمهني والعدلي المطلوب للتحقيق والتحقق في هذه القضية ؟<br />4- من أعطي سيادة المستشار المحقق / محمود قناوي أو للسيد المستشار / رئيس هيئة النيابة الإدارية الحق في أن يقررا صرف النظر عن إبلاغ النيابة العامة لأستيفاء حق الدولة في مالها المهدر والمستباح من قبل من نهب وتربح ؟ وهل لايكفي سيادتهما ماجاء بمذكرة السيد الدكتور وزير المالية المودعة لديهم أو ماجـــــــــاء ونشر علي لسان المستشار الدكتور / إبراهيم عبد الله بأن حجــــم المخالفات والهدر بلــــغ في ماتم حصره فقط مبلغ 449 مليون جنيه ؟ بل أن مانشر وبجميع الجرائد القومية والحزبية التي أسلفناها بتاريخ 17/9/2008 الجاري وعلي لسان السيد المستشار / محمود قناوي نفسه بأن المسئولين بالمحطات المائية حصلوا علي 12 مكافأة قيمتها 125 مليون جنيه وأن واحداً من العاملين حصل علي 261000جنيه بطرق غير مشروعة بل أنهم صرفوا لأنفسهم مبالغ ومن فجورهم صرفوها ( بأسماء وهمية ؟! ) فهل بعد هذه الكوارث مجتمعة تصرف النيابة النظر عن عدم إبلاغ النيابة العامة ؟؟ وعدم تحويل هؤلاء اللصوص إليها ؟ أي عدالة تلكم ياسادة.. ياولاة أمورنا .. ياحراس عدل وأمن مصر؟؟ وهل ياتري قراركم هذا قد يعجب أو يرضي عدالة الزعيم القائد الصارم الوالد حسني مبارك ؟ بل هل يرضي عدالة السيد المستشار العادل والمحترم وأبن مصر البار المستشار النائب العام والذي كان له الشرف منفرداً في التصدي والأستئناف بصفته الكريمة \\\" في قضية العبارة المشهورة \\\" بكل صراحة ياحضرات السادة بالنيابة الإدارية أننا نري في قراركم المتراخي هذا إضاعة لحق دولة ورئيس وشعب ومال عام وتبرير ووسيلة لنفاذ الجناة ونجاتهم بما حملوا وأثقلوا من يد العدالة وإلا فلتشرحوا لنا مافائدة مجازتهم ( تأديبياً؟؟!!) ومعظمهم أحيل حديثاً ومؤخراً للتقاعد والمعاش ؟ ولماذا لم يتم تحويلهم للنيابة العامة المختصة للأقتصاص منهم وحفظ واستيفاء حق الدولة ومالها العام لديهم ومعهم ؟ وبعد كل تلك الكوارث والمهازل ؟<br />5- في الوقت الذي فضح وكشف فيه المشتشار / أبراهيم عبد الله ( قبل نقله المفاجيء؟) وبصحيفة صوت الأمة ماحدث من مخالفات وكوارث في شأن إنشاء محطة كهرباء اللآهون الفاشلة والعقيمة والتي أهدر عليها مايقارب 110 مليون جنيه من مال الأحياء والتي مازالت تقف شاهدة بالخيبة والمخالفات بأرض مدينة الفيوم باللآهون فأن السيد المستشار / محمود قناوي والذي ( تصدي) للتحقيق لم يشر من قريب أو بعيد عن أمر تلك المهزلة ولو بكلمة واحدة والتي أهدر عليها 110 مليون جنيه دون أي جدوي أومنفعة عادت علي الوطن أو المواطن أوحتي علي من أنشأوها اللهم سوي الهدر والتبديد فمن المسئول عنها ياسيادة المستشار ؟ولماذا لم تشيرون إليها ؟ أم أن مبلغ 110 مليون جنيه طارت في الهواء ربما غير كافية لتحريك الصخر والحجر ؟ وتجعله ينطق ؟<br />6- لماذا لم يتم تحويل السادة المخالفين والمحاسبين من موظفي الجهاز المركزي للمحاسبات والقائمين علي أمور ورقابة هيئة المحطات المائية للمحكمة التأديبية أسوة بما حولتم سيادتكم من بقية محاسبي هيئة المحطات المائية أو وزارة المالية والتخطيط وبنك الأستثمار ؟ وهل ياتري أن محاسبي الجهاز المركزي للمحاسبات علي رأسهم ريشة من ذهب أو حصانة ما؟ تمنع أو منعت سيادة المستشار من توخي العدالة والمساواة في تحويلهم للمحكمة التأديبية هم أيضاً – بل أننا مازلنا نسأل عدالتكم أين هو تقرير الجهاز المركزي للمحاسبات في شأن تلكم المخالفات حتي تاريخه ولماذا لم يعرض علينا أسوة بما تم في تقرير السيد الدكتور وزير المالية ؟ أم أن النيابة الإدارية تعرض علينا بعضاً من حقوقنا كشا كيين ومبلغين وتمنع عنا الآخر ؟!<br />7- ألا يعلم السيد المستشار الموقر محمود قناوي أنه حتي في حالة الجناية تلك والتي أبي السيد المستشار قناوي إلا أن يجعل منها ولأسباب غامضة نجهلها مجرد مخالفة تأديبية أو إدارية فأن من تقدم وتطوع بالأبلاغ إلي النيابة يعد كما يطلق عيه تعريفاً ( شاهد ملك ) وحتي ولو شارك بتلك الجناية فأنه يبرأ من العقوبة ؟ فما بال السيد المستشار الموقر ونحن أشرف من الشرف ذاته ونحن أبناء مبارك الزعيم نتحدي أن نكون أكلنا أو شربنا من مال محرم أوتقاضينا حراماً بل كان لنا الشرف في الأبلاغ بالواقعة فور أن توصلت المستندات لأيادينا وعلي الرغم من السيد المستشار الموقر يعلم ذلك من خلال التحقيق والمستند إلا أنه أبي إلآ أن يزج بأسماؤنا نحن الشرفاء الشاكيين والمبلغين الأصليين وفعلاً زج زجـــــــــاً واضحاً باسماؤنا ضمـــــــــــــن المحالين للمحكمة التأديبية بتهمة التقاعس عن الأبلاغ وهو يعلم يقيناً أننا من أشرف خلق الله ولكننا نشكوك الآن لله أولاً ثم لولاة أمورنا والقائمون علينا وعليكم ونقول حسبنا الله ونعم الوكيل لأن مفترض أن نكرم ونثاب لا أن نحاكم ونهان بأسباب جوفاء ونحمد الله أنها لم تصيب منا أو فينا الشرف والرجولة والوطنية والعفة والطهارة وكان الأجدر أن يتوجه السيد المستشار بتهمه تلك إلي الأجهزة الرقابية للدولة والتي تقوم بالرقابة الدورية علي أعمال الهيئة وحساباتها سواء من مالية أوجهاز مركزي لأن هذا هو صميم عملهم إن لم يكن عملهم كله وهم هنا الذي يحق لسيادتك أن توجه لهم أتهاماتكم لا أن توجهها سيادتكم لشرفاء قاموا فعلاً بأبلاغ كل ولاة أمورهم فكيف توجه لهم من بعد تهمة \\\" التقاعس في الأبلاغ \\\" فنحن ياسيادة المستشار أبلغنا فما بالكم بأقراننا من الزملاء والذين آثروا السكوت وأخفاء الرؤس كالنعام فلماذا لم توجه لهم سيادتك مثل هذه التهمة لتصبح حينها علي حق وإذا كنت سيادتك غير ملم وبالدرجة الكافية والمقنعة بأننا لم نتقاعس في الإبلاغ فلتقرأ سيادتكم ما أسلفنا من تواريخ وجهات الأبلاغ التي تشرفنا بأبلاغها جميعاً وفي حينه .<br />8- ماجاء بقرار النيابة ( بحفظ مانسب إلي مجهول ؟!) فأي حفظ هذا الذي تتحدثون عنه سيادتكم ؟ وأي كارثة تلكم التي تحفظوها ولم توضحوها ؟ وأي مجهول هذا الذي تقصدونه ؟ وهل موظفي أي جهة حكومية كانت بالدولة هم شخصيات مجهولة ؟ أي غير معروفة بأسماؤها ووظائفها وأشخاصها ؟ أم أنهم من كوكب أم من عالم آخر ؟<br />9- نحن أبلغنا النيابة الإدارية رسمياً في 10 /7/2006 ليأتي هذا التقرير النهائي لها في 9/2008 وهم بذلك أي النيابة الإدارية قد أعطوا الفرصة الكافية للعديد من القيادات المتهمة للخروج للتقاعد بسبب هذا ( المط والتطويل الغير مفسر والمشكك فيه ) وعلي الرغم من تنبيهاتنا المتكررة لهم بذلك وهو الأمر الذي نضع عليه علامات استفهام وحيرة كبيرة عن تصرف هيئة النيابة الإدارية ولكي يأتي في النهاية تقريرها أقل مايوصف به أنه جانب الكثير من الصواب ولم يحرص بحزم وجزم علي ردع الجناة بل أنه لم يحرص حتي علي استيفاء حق الدولة والمال العام منهم والأكتفاء بمحاكمتهم تأديبياً ؟! ومعظمهم خرج مؤخراً للتقاعد فهل ياسيادة المستشار العادل هل ينفع أو يجدي مع هؤلاء المحالون للتقاعد تأديبهم باللوم أو الأنذار أو حتيي الخصم وهم بالتقاعد ؟ أم أن أدني درجات العدل هي استيفاء جميع مانهبوه وتربحوه من حرام ومن المال العام وأخراجه كرهاً من كروشهم وهنا والله ياسيدي نراكم قد أضعتموه بعدم تحويلهم للنيابة العامة المختصة .<br />نحن نلتمس منكم ياحضرات السادة الأفاضل وولاة أمورنا مجتمعون ضرورة رفع هذا الضيم عنا وأهم من ذلك كله نرجو ونري حفاظاً علي تضحياتنا ربما بما تبقي لنا من مستقبلنا الوظيفي فأنه لابد من من تحويل أمر هذه القضية وبملابساتها وكوارثها للنيابة العامة والتي نراها جهة أختصاص واختصام أصيل تم تنحيتها عن قصد بين وواضح لكل ذي لب رشيد .<br />وتفضلوا حضراتكم ولاة أمورنا الأكرمين بقبول وافر الاحترام .<br />مدير عام / محاسب / محمد غيث محمود . ت : 23162833/0101989788/0121069534<br />مدير عام / محاسب /محمد شريف فاروق. ت:23698963 / 0103854743<br />هيئة المحطات المائية لتوليد الكهرباء<br />6/10/2008"
