[[comments]]
order = 9
subject = "حَدّ يجاوِب يا كتاكيت :)"
text = "هُوَّ فساد حكامنا طوِّل ؟<br />ولَّا سكوتنا بَدَأ الأوِّل ؟<br />نَارهُم سَبَقِت في التوقيت ؟<br />ولَّا احنا كُنَّا الكبريت ؟<br />إحنا الفَرْخة ولَّا البيضة ؟<br />حَدّ يجاوِب يا كتاكيت :)"
archived = "2007-12-24"
capture_url = "https://web.archive.org/web/20071224090424/http://masr.20at.com:80/newArticle.php?sid=13479"
