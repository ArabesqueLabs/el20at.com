text = "اخبار مغرضة تسىء سمعة البلد وتشوة مسيرتة الحضارية ويقولها اتباع ايران وحزب اللة<br />فالبضاعة فى مصر فل الفل وعال العال وليست مغشوشة ولا حاجة وانها تنطبق عليها معايير الجودة البريطانية والامريكية والروسية واللى بيفهم غير كدة يبقى كداب<br />كل شىء فى البلد زى الساعة ومفيش غش ولا واسطة ولا خداع ولا اى حاجة خالص<br />وبطلوا اشاعات كدابة"
