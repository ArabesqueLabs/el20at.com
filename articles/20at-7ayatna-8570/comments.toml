order = 0
subject = "شباب عاطل"
author = "الدميرى"
posted = "2008-03-25"
text = "انا مره شفت سيارة شركه من شركات التامين وللاسف كلها نساء يعنى الست اللى شغاله (وسط الرجاله) شغاله هى وجوزها ليوسعوا دخلهم يبنما نجد ةفى الجانب الاخر شباب نفسهم يجدوا فرصة عمل مثل هذه عشان يفتحوا بيت فتامل حال تلك الاسرتين اسره دخلهم مضروب فى 2 بينما اسرة الشاب العاطل دخلها 0 لانه راجل مش عاوز اخته او امه تنزل وسط الرجاله فى(الاوتوبيسات)<br />وبعدين المراه فى الشارع مصيبه ولو احنا فى مجتمع مسلم يبا شغل المراه لعدم وجود رجال!!!!!!!!!<br />وبعدين عمرك شفت ست اخترعت شئ جديد نفع البشريه<br />قال رسول الله صلى الله عليه وسلم عندما سمع ان الفرس ولوا امرهم امراه قال المعصوم(لن يفلح قوم ولوا امرهم امره) وقد كان فقد سقط الفرس فى اول معركة بينهم وبين الروم<br />صحيح فى شغل لا ينفع الا للمراه مثل التدريس (للبنات) او طبيبة نسا وولاده او خياطه وغيرها بس دى حاجات محدوده<br />اللى اقصده ان نحاول لو الاسره ممكن تكتفى نسيب فرصه لمحتاجين اكثر"
archived = "2010-03-14"
