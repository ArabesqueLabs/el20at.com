subject = "جمعيت اصلاح وانكشاف اجتماعى افغانستان"
author = "جمعيت اصلاح وانكشاف اجتماعى اف"
posted = "2008-03-26"
text = "برادر محترم فضل القاهر السلام وعليكم ورحمت الله وبركاته<br />جمعيت اصلاح وانكشاف اجتماعى افغانستان در نظر دارد كه سير علمي يكه روزه را براي دانشجويان دانشكاه اسلامى اسلام آباد ترتيب دهد, بناء از جناب شما خواهش مي شود كه با حضور كرم تان اين برنامه را رنكينتر سازيد.<br />تاريخ &--1635;&--1632; مارج, روز يكشنبه<br />حركت:&--1638; صبح مقابل ليليه ايستكاه موتر ها<br />نوت: بخاطر تنظيم بهتر برنامه الى تاريخ &--1634;&--1640; مارج به شماره هاي ذيل در تماس شويد<br />شماره ها تماس<br />قاري حميد الله (نجيب) &--1632;&--1635;&--1635;&--1635;&--1641;&--1635;&--1636;&--1635;&--1632;&--1640;&--1633;<br />زاهد الله ( مصلح) &--1632;&--1635;&--1636;&--1638;&--1641;&--1632;&--1633;&--1633;&--1634;&--1637;&--1634;<br />محمد اكبر مدثر &--1632;&--1635;&--1635;&--1635;&--1641;&--1635;&--1635;&--1640;&--1632;&--1638;&--1634;"
