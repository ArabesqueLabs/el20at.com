[[comments]]
order = 0
subject = "كل سنه وانت طيب با ريس"
author = "مش شريف الدواخلي ولا عبدالله ا"
posted = "2008-05-26"
text = "كل سنه وانت راكب واحنا مش راكبين<br />كل سنه وانت واقف واحنا نايمين<br />كل سنه وانت متجوز واحنا مش متجوزين<br />فاكرنا يا حبيب الملايين<br />فاكر المكسحين<br />فاكر الغرقانين<br />فاكر الطفشانين<br />فاكر المضروبين<br />فاكر المعتقلين<br />فاكر المسجونين<br />فاكر المسروقين<br />فاكر المنسيين<br />فاكر يا حبيب الملايين<br />مسكين حتفتكر مين ولا مين ولا مين"
archived = "2010-03-14"
