[[comments]]
order = 2
subject = "عن الاسعار والضرايب والجباية غنوا لى شوى شوى"
author = "ابو الوطاويط"
posted = "2008-05-26"
text = "يحتمى المومياء توت عنخ ابو حصيرة فى 850 الف جندى مركزى و300 الف مخبر ومرشد مباحث امن دولة يأكلون الاخضر واليابس فى ميزانية الدولة<br />امريكا تتمنى ان يصل جيشها وكل احلامها ان يصل الى مليون جندى<br />ونحن عندنا مليون عسكرة وربع لحماية امن سيادتة<br />يبقى تدفعوا ضرايب<br />الضرايب علشان الوفود اللى بتيجى من غير لزمة للشرم نتصور معاها وتاكل جمبرى على الشاطىء الفيروزى<br />يبقى البركة تيجى منين<br />الشعب خايف لية<br />هيقدروا يعتقلوا قد اية<br />نصف مليون مش ممكن<br />ياناس العملية وصلت لنقطة الجوع الكافر"
archived = "2010-03-14"
capture_url = ""
