[[comments]]
order = 1
subject = "الحشيش ظاهرة مستمرة فى حفلات منير"
author = "حفلات"
posted = "2008-01-02"
text = "الاستاذ تركى ذكر ان البنات فى الحفلة كانت بتشرب الحشيش وتثير الدخان الازرق جهارا عيانا فى مكان عام<br />هة مش احنا عندنا شرطة ومباحث<br />ومليون ونص عسكرى امن مركزى - راحوا فين ؟<br />والا طلع ترخيص بالغاء حرمانية الحشيش - صحيح الحشيش بقى مباح والا اية<br />ولا الكل بقى مباحث امن دولة هدفة حماية الكرسى<br />هى الدولة دى مالهاش اصحاب"
archived = "2008-01-04"
capture_url = "https://web.archive.org/web/20080104034741/http://masr.20at.com:80/newArticle.php?sid=13660"
