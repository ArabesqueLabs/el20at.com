[[comments]]
order = 13
subject = "(حنفيه).. أو حونفا، وهي كلمة صعيدية تعني صنبور"
author = "ميمو"
text = "معظم الكلمات فعلا مصرية صميمة .. لكن موضوع حنفية غلط تماما لان قصتها معروفة .. لان لما محمد على حب يدخل الحنفيات المناطق والبيوت اعترض عدد من رجال الدين لانها بدعة وكل بدعة ضلاله المهم ده وسط اشاعات ان شهبندرات السقا كانوا ورا الفتوى دى واللى حصل انه تم اجازة الموضوع من اتباع المذهب الحنفى عشان كده بقى اسمها حنفيه"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125507/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 14
subject = "اخطاء وردت في المقال الغريب"
author = "احمد"
text = "بالنسبة لكمة (دا) فهي كلمة محرفة من كلمة (هذا) حيث حذفت الهاء وابدلت الدال بالذال<br />واهل الحجاز في السعودية ينطقون نفس الكلمة فيقولون ( دا الشئ) يقصدون هذا الشيئ<br />فهل الاقباط عدوا على الحجاز بالمرة ؟!!!!!!!!<br />بالنسبة للفظ ( أوباش) فهي لفظ عربي ولو كره الكارهون والاوباش ايضا !!!<br />اما اغرب شيء فهو لفظ ( مشط) اما علم قول الرسول الكريم ( الناس سواسية كأسنان المشط )<br />ولا الاقباط كانوا في ضيافة قريش زمن البعثة !!!!!!!!"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125507/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 15
subject = "نفسي اعرف بس هو المسلمين دول مش مصريين ؟!!!"
author = "برعي"
text = "يعني نقول اقباط يعني مصريين تستعروا منها !!! , لأ وعايز تقنعني ان مصر كانت عربية ايام الفراعنة , وبالمرة تغلط في المسيحية والمسيحيين يا اخي دا انتوا امة ضحكت من جهلها الامم بصحيح , وهل دا - انك تشتم الاخر - هو اللي هيرفع راية الاسلام ؟!!!!"
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125507/http://masr.20at.com:80/newArticle.php?sid=10193"
