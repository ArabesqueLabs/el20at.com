subject = "ضع عنوان التعليق"
text = "مهما حاولت انسى سنتكلم عربى وفصيح (كمان) يعنى ايضا وخير انك جعلتنى اخذ بالذال بالى من المفرادات العربية عشان (لكى) أنطقهاااااااااااااااااااااااا"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 3
subject = "فرعون مصر"
author = "مش لازم"
text = "اللي اقوى من كده بآه واللي يثبت ان مصر طول عمرها عربية وعمرها ما كانت قبطية اننا نعرف مين هو فرعون مصر فرعون موسى اسمه قنبله<br />فرعون مصر اسمه يا جماعه<br />الوليد ابن مصعب<br />الوليد ابن مصعب<br />فرعون مصر كان عربي يا جماعة واسمه الوليد ابن مصعب<br />روحوا شوفلكم لعبه العبوها"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 4
subject = "عليّ هيم"
author = "مش مهم"
text = "اللي احسن من كده بآه لما نقرأ سورة الفتحه مع بعض ونقول صراط الذين انعمت عليهم<br />علي هم غير المغضوب عليهم علي هم<br />هم بالانجليزي نفس المعنى العربي ضمير<br />him<br />يا ترى القرآن اللي قلد الانجليز ولا الانجليز اللي قلدوا القرآن"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 5
subject = "ضع عنوان التعليق"
author = "ربنا يشفيكم"
text = "أقولك يا بن الظريفة<br />him ضمير مفعول به<br />هم دى ضمير بس للجمع المذكر<br />فهمت يا ظريف الاقباط<br />نروح للظريف التانى الحقبة القبطية جزء فتوته صغتتة جدا من تاريخ مصر بلغة ماتت وانتهت الا فى الكنائس بس<br />يعنى التاريخ القبطى جزء من تاريخ مصر مش مصر كلها او مصر جزء منه يا ريت تفهموا !!!!<br />شوفوا انت بقى التاريخ العربى الاسلامى فى مصر من كام سنه وهيستمر غصب عنكم كم مش him<br />لحد النهاية"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 6
subject = "لالا ماكانش اسمه كدة"
author = "لوسي ابن طنط فكيهة"
text = "لا يا جماعة فرعون مصر ماكانش اسمه الوليد ابن مصعب خالص، ده كان اسمه عبد الفتاح السيد وكان من عيلة تجار كبيرة في شبرا"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 7
subject = "مش مهم"
author = "أحمد"
text = "الكلام ده فيه منه حاجات غلط و أهمها كلمة برج واللى الكاتب بيقول دخلت العربية الفصحى من كلمة يونانية ...ومعروف ان كلمة برج ورد جمعها بروج فى القران ....اينما كنتم يأتيكم الموت ولو كنتم فى بروج مشيدة.....وطبعا القران عربى مبين وهو مصدر اللغة العربية حتى الان ويستحيل كلمة أعجمية غير عربية تيجي فى القران -بلسان عربي مبين-<br />النقطة التانية<br />كلمة ترابيزة دي مشتقة من الفرنسية مش من القبطية يا شباب<br />وعموما ربنا يهدي وبلاش كل حاجة نشتم وخلاص....اللى عنده حجة كويسة يقولها واللى معندوش يقول انا اشكك فى الكلام المنشور واية الهدف منه ويدي الكاتب كلمتين حلوين -بالادب برضة- بدل مانا حاسس انى على غرفة شات فى الياهو او ال بال توك ومفيش اى احترام لاى حد لا كاتب ولا قارىء ولا اى مخلوق<br />والكاتب برضة يحترم عقول قراءه ويدرك اننا فى رحلة خطرة من تاريخ الأمة والكل عنده فى دماغه نظرية المؤامرة....يبقى هات موضوعات محترمة تستاهل النقد اساسا<br />وطبعا مش محتاج اقول ان عنصر واحد بالمقال خطأ لا يعني ان المقال فاشل...هو كويس وثقافة عامة ونتطلع للمزيد<br />وشكرا"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 8
subject = "تاريخنا حمل كبير علينا .. لازم نفهمه بدل ما ننكره"
author = "محمد القناوى"
text = "مستحيل ننكر كل التراث المصرى قبل العربى . حرام فعلا .. والمفروض نكون سعداء ان التراث ده عايش معانا .. ,,وعلى فكرة حتى معظم التعليقات مكتوبة برضه بالعامية وبتستخدم كلمات ملهاش اصل عربى زى بس وكويس الخ الخ .. انا مش عارف القشعريرة دى جيه منين .. قريت فى تعليقات الموضوع اللى فات واحد بيقول ان فرعون موسى اسمه الوليد ابن مش عارف ايه .. هو التلاتين اسرة اللى قبل الاسكندر كانوا محورهم فرعون موسى وقارون وهامان .. يا جماعة فعلا ده شيئ محزن ان الواحد يتنكر لحاجات المفروض يبقى فخور بيها .. اخيرا اا عايز بس اقول ان احنا محملين بتاريخنا الكبير اللى امتزجت فيه ثقافات كتير منها غير بعضها واذا كان فيه حاجه تدعو للفخر ان كل الثقافات دى اتمصرت .. وعلى فكرة فى صفحات فى التاريخ مجهولة بالنسبة لينا ومنعرفش تاثيرها ايه علينا زى تاثير الاحتلال الفارسى والاسر الليبية اللى حكمت مصر .. كلمة بقى مهمة للمسيحيين .. وبقول المسيحيين مش الاقباط .. تراث المصريين ملك لكل المصريين .. وبقول للمسلمين وبسميهم مسلمين ماداموا قرفانين قوى من مصريتهم بقولهم عليكم باليمن السعيد فلسانهم عربى مبين بدون اى تلوث فرعونى او قبطى او يونانى"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 9
subject = "الى لوسي ابن طنط فكيهه"
author = "مش مهم ابن عم مش لازم"
text = "والله يا لوسي با بنت طنط فكيهه الوليد ابن مصعب هو فرعون موسى وانا متاكد من المعلومة دي يا اختي زي ما انا متأكد ان الموضوع ما عجبكيش لانك مسيحية<br />يا جمالة الوليد ابن مصعب هو فرعون موسى اللي اتكلم عنه القرأن وكان عربي ومصر طول عمرها عربية رغم انف الجميع"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 10
subject = "فرعون مصر الوليد ابن مصعب (من الجوجل)"
author = "مش مهم ابن خالة مش لازم"
text = "وفي كتاب هروشيش‏:‏ أن سلطان المصريين في زمن إبراهيم الخليل عليه السلام كان بأيدي قوم يدعون ببني فاليق بن دارش ودام ملكهم بمصر مائة وعشرين سنة وقال ابن إسحاق عن بعضهم‏:‏ إن فراعنة مصر من ولد دان بن فهلوج بن امراز بن أشود بن سام بن نوح قال‏:‏ والمشهور أنهم من العماليق منهم الريان بن الوليد ويقال‏:‏ الوليد بن الريان فرعون يوسف والوليد بن مصعب فرعون موسى ومنهم سنان بن علوان‏.‏"
archived = "2007-05-19"
capture_url = "https://web.archive.org/web/20070519060728/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
order = 11
subject = "سلطان المصريين في زمن إبراهيم الخليل عليه السلام كان بأيدي قوم يدعون ببني فاليق بن دارش ابن اسحق ابن شامير .. يابنى ده تاريخ تالته ابتدائى حرام عليك"
author = "عمر جمال"
text = "انت يابنى ياللى فوقى والله حرام عليك .. طب منت ممكن تلاقى فى جوجل برضه ان اليهود هما اللى بنوا الاهرامات .. مصر بتتكلم عربى وغالبيتها مسلمين بس مكنتش عربية زمان .. هدى نفسك .. او يمكن انت اصلا بتهزر .. الله اعلم .."
archived = "2007-06-23"
capture_url = "https://web.archive.org/web/20070623125507/http://masr.20at.com:80/newArticle.php?sid=10193"

[[comments]]
