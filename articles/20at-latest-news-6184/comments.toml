[[comments]]
order = 0
subject = "عالم فاضية"
author = "alexomania"
posted = "2007-06-06"
text = "و الله أنا مش قصدي حاجة و أنا مسلم زي كل المسلمين بخاف علي الحرم المكي و نفسي يفضل مريح للزوار دايما علشان متحصلش مشاكل لا قدر الله ................بس مش ملاحظين إن الناس دول فاضيين قوي؟<br />يعني لجنة من 4 وزارات و دكاترة جامعة علشان يفكروا في طريقة للنوي .... طب ما تقعدوا مع بعض كده قعدة عرب و تتسلو علي البلح و آهو اللي يجوع ساعة الشغل ياخد له تمرتين تلاتة يتصبر بيهم علي ما تيجي الفتة<br />إرحموناااااااااااااا بقي بصوا يا عالم يا بتوع طاعة ولي الأمر يا بتوع السعودية علي منظركم بقي عامل إزاي ..... إهتموا شوية بحال الدول الإسلامية المعدمة اللي مش لاقيين حتي رزاية ناشفة ياكلوها بصوا علي الصومال و موريتانيا و غيرها و لما تخلصوا إبقوا إعملو تمر مخلي و إعملوا منه بألوان كمان"
archived = "2010-03-14"
