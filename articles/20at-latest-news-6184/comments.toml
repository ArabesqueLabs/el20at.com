text = "يا شعب ما بيطول العالم منه إلا الفضايح و صفقات السلاح الفاسدة<br />أمرا بيهربوا مخدرات و سفرا بيرشوا العالم ......بدكون تشترو سلاح؟؟؟؟؟؟؟ حتحاربو مين بهاي السلاح؟؟؟؟؟<br />إتقوا الله في المسلمين و بلا سعوديين بلا حكي فاضي"
