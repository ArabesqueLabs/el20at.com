[[comments]]
order = 1
subject = "حسبي الله و نعم الوكيل"
author = "مسلمalexomania"
posted = "2007-06-09"
text = "الأخ إبن المدينة المنورة ....<br />جزاك الله خيلاا علي كل الأحوال بس أحب أوضح لك بس حاجة إنك بعمرك ما تتخيل مقدار حبنا أو تقديرنا أو إجلالنا للحرمين فيا ريت تحتفظ بالألفاظ الغريبة دي لنفسك يا بابا<br />ببساطة الغرض من تعليقي إني أوضح إن دي مكانتش ولا حتكون مشكلة المسلمين ..... طول عمرنا بنزور الحرم و الحمد لله و (النوي) عمره ما سبب أي مشاكل ولا مضايقات و آخر حاجة حابب أفكرك يا أستاذ إن الحرم ده مش بتاع حد معين علشان تتكلم بالطريقة دي ده بيت ربنا يعني للمسلمين كلهم و إنت لو راضي عن حال المسلمين علي ما هم عليه الأيام دي و شايف إن مفيش مشاكل خاااااااااالص غير مشكلة (نوي البلح)..... فديه حاجة ترجع لك يا أمن تلبس نضارة و تشوف الصورة الحقيقية أو تروح تدفن نفسك في العالم المثالي اللي انت عايش فيه إنت و أمثالك"
archived = "2010-03-14"
