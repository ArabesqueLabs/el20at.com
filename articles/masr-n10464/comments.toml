[[comments]]
order = 5
subject = "دعوة للتعايش مع الاستاذ تمام"
author = "احمد البهنساوي"
text = "الاستاذ حسام تمام اعرفه واعرف ماضيه الذي لمح به في مقاله الذي لا انكر اعجابي به اجمالا على المستوي المهني وفي بعض اجزاءه على مستوي فكرته التي طرحها ومعالجته لما قاله الاستاذ عمرو خالد حول زيارته لامريكا لكن لم البث الا ان عدت مره اخري عندما استشعرت مدي (حرقة) الاستاذ تمام في الحديث بهذه الحدة ليس لانها حدة على عمرو خالد او غيره مع الاحتفاظ به كقيمة اثرت في المجتمع المسلم اردنا او لم نرد لانها بشهادة الغرب ( والحق ما شهدت به الاعداء ) لكن عودتي عن الاقتناع بما يدعو اليه تمام هي سطحية المشكلة التي يتحدث عنها وتحميله لموضع اكثر مما يحتمل يعني بالبلدي ( عمل من الحبة قبه ) فبدلا من الالتفاف حول النماذج التي تأخذ لابدينا وبأيدي الشباب خاصة في هذه المرحلة العصيبة التي يسب فيها الصحابة ومن قبلهم الرسول نقوم بجلد الذات ونلتفت لبعضنا بعضا وفي النهاية لماذا كل هذا ؛ لا اصادر حقك يا استاذ حسام في النقد بالطبع فانا صحفي واعني ما اقول لكن كلنا يعلم النقد البناء والنقد البناء ثم مايضيرك يا اخي اذا كان لك ملاحظات على انسان بشر يخطيء ويصيب وهو عمرو خالد ( ولي سعمرو بن الخطاب ) ان ترسل له نقدك اذا كنت حقا تريد النقد البناء ؛ انا لا اشكك في نيتك ولكن احسبك اجتهدت واخطأت ."
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602113807/http://masr.20at.com:80/newArticle.php?sid=10464"

[[comments]]
order = 6
subject = "اللهم اهدى الجميع"
author = "BATISTUTA"
text = "انا متفق تماما مع حسام تمام فى ما كتب عن عمرو خالد ولم اشعر ان نقده جارح فيه اساءة لعمرو خالد على المستوى الشخصى او نقد هدام الغرض منه تصفية حسابات ام ان ينصح عمرو خالد سرا تجنبا للحرج وغيره فكيف هذا فهو ليس صديق اخطئ فى وان انصحه بل شخصية عامه تنقل افكارا تؤثر فى المجتمع لذا عندما يجد الباحث او الصحفى او الشيخ او حتى عوام الناس افكارا وكلاما لانتفق معه _بسبب كذا وكذا لا داعى للخوض فيها الان حتى لا يتسع النقاش _ وجب عليهم تقديم النصح ثم النقد ان لم يفلح النصح .<br />اخيرا ان لم تلتفتوا لنقاد عمرو ظنا منكم انهم حاقدون ناقمون جاهلون وانتم الاعلمون فحكموا عقولهم وضمائركم بعيد عن التقديس والتعصب واسئلوا انفسكم -لماذا نجد عمروخالد يغرد خالد السرب فيذهب للدنمارك رغما عن علماء الامة بل ويعود زاعما النصر فى ما اراد . -لماذا نجد بعض الاشياء الغريبة والشاذة حول برامج عمرو خالد مثلا اعلان سمعته على قناة المحور استمع لاغنية برنامج عمرو خالد بصوت تامر حسنى ونغمة برنامج دعوة للتعايش وقبلها على خطى الحبيب .<br />كذلك التعامل مع برامج عمرو بطريقة تسويقية صرفه بكم الاعلانات الهائل الذى يتخلله .ما دخل الداعية الى الله بكل هذا ؟"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602113807/http://masr.20at.com:80/newArticle.php?sid=10464"
