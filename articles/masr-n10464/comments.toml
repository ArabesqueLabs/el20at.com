[[comments]]
order = 0
subject = "استرزاق"
author = "ميدو"
text = "بصراحة حسام تمام استاذ في الاسترزاق بكل حاجة وكل قضية<br />بالرغم من ملاحظاتي على عمرو خالد<br />بس خف شوية يا عم حسام يا تمام ومتعش في دور الباحث ..لأن البحث ليه اصوله وقواعده..وميغركش تهليل صلاح عيسى واحتفاءه بيك<br />احدى مشاكل اسلام اون لاين الاساسية هي عملية التلميع للعاملين في الموقع على غير حق بالفهلوة والتهليل"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602113807/http://masr.20at.com:80/newArticle.php?sid=10464"

