[[comments]]
order = 2
subject = "ضع عنوان التعليق"
text = "لو سمحت يا استاذ ارجوك<br />لا تبتزنا بادعاء بطولة زائفة لمحاولة ان تجد ضالتك ايا كانت فلا احد انتقص من اعتبارك من الحركة الاسلامية واتمنى ان تقدم دليلا واحدا على ذلك وما تقوله على الاسلاميين وزوجات الرسول خلط للاوراق لان اقوى ردود الافعال كانت منهم وانا لا ادافع عنهم حتى اعطيك درسا فى ماذا فعلوا لكنى اطلب منك ان تلتزم باسلوب البحث العلمى الذى وجدت انك خرقته فى ما قراته لك ودائما تعمم القضايا الجزئية غير المترابطة وتجعلها حالة او ظاهرة وهذا يرجع الى خلفية انتمائك للاخوان المسلمين ومراجعتك لنفسك بعد ذلك وهى مشكلة عامة حيث يكتفى بعض من الاخوان بالعقل الجمعى ولا يميلون الى التفكير الفردى الابداعى وهى مشكلة لازلت تعانى منها حتى الان وفى سبيل اثبات تخلصك منها تلجا الى تكفير غيرك لادعاء ان كل الاسلاميين ضدك او انك تشفق ان تكتب عنهم لان قلوبهم اصفى من الحليب ولو انك تجد ثقب ابرة لكتبته حتى تحقق اشباعك المهنى لكنك لم تعد تقدم شيئا لان اطروحاتك انتهت لانها قصيرة ومفككة وبعيدة عن المنهج العلمى"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602113807/http://masr.20at.com:80/newArticle.php?sid=10464"

[[comments]]
order = 3
subject = "الكاتب الذي لم يقرأ كتاب المطالعة"
author = "معرفش"
text = "يا عم حسام من الواضح انك جاهل اخر حاجة فقد استهللت هذا المقال الشيق الضيق بام الاسلاميون يدافعون عن عمرو خالد و لو كنت سعادتك فكرت لحظة و بطلت تقرا ميكو و تانتان و سمير كنت عرفت ان الاسلاميين اللي انت بتقول عليهم بيكرهوا حاجة اسمها عمرو خالد الا اذا كنت تقصد بالاسلاميين التباع عمرو خالد من شباب الدقي و المهندسين و نادي الصيد"
archived = "2007-06-02"
capture_url = "https://web.archive.org/web/20070602113807/http://masr.20at.com:80/newArticle.php?sid=10464"

