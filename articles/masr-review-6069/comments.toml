text = "اتضحت الصورة الحقيقية للكنيسة فى عهد شنودة ، هى الصورة التى حاولت اخفائها تحت شعارات الوطنية والمحبة .. الخ<br />الكنيسة المسيسة ترى فى مد اليد للغرب الصليبى واعانته على تدمير المسلمين ابناء الوطن حتى يخلو لهم ولا يصبح هناك مساجد ولا أذان ولا توحيد ، فتصير مصر ارض التثليث والصلبان ، لقد اضر المسلمين سماحتهم لقد اضر المسلمين سماحتهم ، واخشى ان يتحولوا فى يوم الى ضحايا محاكم تفتيش كنسية .<br />ان الكنيسة الغربية تقود حربا لا هوادة فيها على الاسلام والمسلمين ، والكنيسة المحلية تحلم بيوم تصل فيها جيوش الصلبان الغربية والامريكية ، انهم يفتعلون الازمات ويصرخون ويبكون ويستعطفون امريكا ان تهدم مصر على المسلمين ( الغرباء المحتلين ) بلا رحمة ولا هوادة ، فكيف يفكر المسلمون فى اتباع شريعتهم ، كيف يظهر المسلمون اسلامهم ، كيف يشرح المسلمون دينهم ويقومون بعرضه جهارا نهارا ."
