text = "توضيح مهم .. ايام الحملة الفرنسية الاوضاع والوعى مكنش زى دلوقتى .. نابليون نفسه سمى نفسه محمد بونابرته ومشيت الجكاية دى ييجى سنة ولا حاجة .. القصد ان كان وجهاء واعيان مصر منهم اللى كان شغال مع الفرنسيين ومنهم اللى كان شغال مع المماليك .. وبالنسبة للصعيد فالصعيد مكنش اصلا خاضع لاى سلطة مركزية من اى نوع ساعتها وكان الجميع بالنسبة للصعايدة اغراب .. ودايما كنا بندرس ان ابراهيم بيك هرب للشام ومراد بيك هرب للصعيد .. مراد بيك اتنفخ فى الصعيد من الصعايدة على فكرة .. الدولة الحيثة نفسها مكنتش موجودة بالتلى مثلا مكنش فيه حاجه اسمها جيش يعنى مثلا الطريقة الرفاعية كان ليها شبه تشكيلات .. وجيش الممالك كان معظمة مستورد من اسيا الوسطى وابخازيا وكان علاقتهم بالاسلام زى علاقة اى واحد بيقرانى دلوقتى بعقيدة الشنتو اليابانية .."
