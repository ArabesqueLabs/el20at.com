author = "مش مهم"
posted = "2007-05-31"
text = "اما غير البديهي في هذا الموضوع، فيطلع عليك لو قارنتَ ردة فعل «الاخوان المسلمين» تجاه الحدث الطائفي هذا بأية واقعة من وقائع «حجاب» المرأة. واقعة عدم إستلطاف وزير الثقافة فاروق حسني للحجاب مثلا: جنّ جنون «الاخوان المسلمين» وخاضوا حملة شرسة ضد الوزير، أرغم اثرها على الاعتذار... صخب مجنون على تعليق الوزير السلبي ضد الحجاب، وصمت مطبق حول حدث طائفي يحمل النذير... هذا ما يَشي بعدم جدية «الاخوان المسلمين». فبين الصراع الطائفي العنيف الذي يهدد نسيج المجتمع بأكمله وبين هندام المرأة، بالتأكيد الاولوية ليست للأخير. ولكن ماذا تفعل بإيديولوجيا معطوفة على صراع على السلطة؟<br />الاقباط اكبر جماعة مسيحية في الشرق، واقدمها. انهم شهادة على مصر، على مصرية مصر. ويتآمر المسلمون المصريون على انفسهم، لو تركوهم عرضة لإستنزاف روحي يفضي بهم الى احد المنفَيَين... في الداخل كما في الخارج.<br />‏الأقباط المصريون والاستنزاف الروحي الذي يؤذي الجميع<br />دلال البزري الحياة - 27/05/07//<br />الحدث اشبه بالعادي. اقباط مؤمنون لا يملكون مكانا للصلاة. يقدمون طلبا لبناء كنسية. يوضع طلبهم على الرف. يعزمون على إقامة الصلاة في شقة احدهم المتواضعة. يعلم المسلمون بما عزم عليه اقرانهم في القرية. يوم الجمعة يذهب هؤلاء الى الصلاة. خطيب الجامع يحرضهم:<br />«الى اهالي القرية المسلمين (...) اليوم بعد الصلاة يقوم النصارى ببناء كنسية غرب القرية... لا بد من تواجد جميع المسلمين الذين يغارون على دينهم من اليهود والكفرة بعد الصلاة مباشرة. فمن اليوم لا تراخي ولا كسل!».<br />وهكذا يكون: يهجم الشباب المؤمن على مسيحيي قريتهم المؤمنين بدورهم، ينهبون محلاتهم، يحرقون منازلهم، يروّعونهم، يجرحون بعضهم من المسنّين. وعمدتهم يصرخ بوجوههم: «كلاب! كلاب!»... فيما الامن والشرطة عاطلون، لا يتدخلون، لا يتحركون، يكتفون بالمشاهدة. الحدث ينتهي بجلسة مصالحة يرأسها الوجهاء والشيوخ والقساوسة. النتيجة تثير غضب شباب اقباط يطالبون بالمحاسبة بدل تبويس اللِحى. لكن البابا شنودة يهدّىء غضبهم بقوله ان الحساب في الآخرة، عند الله.<br />الحدث عادي ومكرر. منذ احداث الخانكة عام 1972، والطقوس نفسها... محاولة بناء كنيسة، عنف ضد الاقباط، ثم صلح صُوَري. لا حماية خلاله ولا حساب من بعده. والتشبث بقانون عشوائي ظالم بحق الاقباط في بناء اماكن عباداتهم، وفوق كل هذا خاضع للإعتباطية في التأويل وللمزاج البيروقراطي ولمناخ الكراهية العام... الى ان يأتي حدث اضافي. منذ العام 1972 سبعون حدثا مشابهاً. الى حد انك تقرأ الآن نفس ما كُتب منذ اكثر من عشر سنوات (من احداث الخانكة وحتى الاحداث الاخيرة)... مما يمكن ان يكون قد حصل عام 1985 او عام 1995 لا فرق! والحدث الذي نحن بصدده حصل منذ اسبوعين في قرية بمها في العياط بمحافظة الجيزة. ولا يُتوقع ان يكون الأخير. انه تراكم من الافعال، ليس محسوباً مآلها. أور بما كان محسوبا لو ان هناك عقلا يديرها.<br />المسؤوليات؟ الدولة اولا طبعاً. قد تجد الدولة لنفسها مبررا لعدم خوض مؤسساتها في مسألة تغيير القانون العشوائي الظالم بحق الحاجات الروحية للأقباط. وتنهي بذلك الاجحاف الذي ورثته عن قوانين عثمانية معطوفة على ضعفها امام مناخ اصولي تفضل مداراته بعدما اطلقت له العنان في بداية السبعينات... مدشّنة بذلك عهد الفتن المتنقلة والمكررة.<br />اما الذي لن تجد فيه الدولة حجة للدفاع عن نفسها حياله، فهو امتناعها عن القيام بوظيفتها كحامية لأرواح وممتلكات «مواطنيها» (خاصة بعدما اهدتهم بند «المواطنة» في تعديلاتها الدستورية الأخيرة)؛ وايضا كساهرة على تطبيق القانون بحق الذين يهدرون الارواح والممتلكات، مهما كانت ديانتهم. دولة يسمع جهاز أمنها «دبيب النمل»... لا يسعها الدفاع عن تلكؤها في اخذ حق ضحايا التعصب والعنف الطائفييَن. دولة لا تقوم بوظائفها... اللهم تلك التي تؤمن لها بقاءها، ليست بدولة. انها بالأحرى سلطة. سلطة سافرة.<br />وهذه السلطة، ذات الشبكات والحبكات والعلاقات والتشريفات... هي ايضا امام حالة معقدة. من جهة، «صورتها» امام الغرب المانح تفرض عليها مظاهر مدنية. لكنها لا تستطيع الذهاب بعيداً في هذه المظاهر، قبل التكلم عن «الجوهر» اصلا... وإلا وقعت في الفخ الذي نصبته لغيرها عندما قررت وأصرت في دستورها على أن «الاسلام دين الدولة والشريعة الاسلامية مصدر التشريع». سلطة مضطرة لتغذية مجالات الكراهية الدينية في الاعلام والتعليم والامن. والا نافسها الاسلاميون على الشرعية.<br />السلطة مثل الاحداث الطائفية المكررة. تدور حول نفسها اعتقادا منها ان الدوَران انما يحميها من السقوط. وقد تكون محقة من زاوية نظرها هذا... فتتغيب عن الحماية والسهر. فاذا تدخلت وانصفت وقعت في شرك المزايدة الدينية الاسلامية، الخطرة على «شرعيتها» الضعيفة اصلا. دولة ضعيفة وسلطة قوية. وهذا ملمح من ملامح الدولة العربية المعاصرة، باستثناء دول لبنان وفلسطين والعراق الآن، حيث الدولة غائبة وجموع السلطات الفئوية والطائفية هي صاحبة الدور والقرار.<br />المسؤولية تقع ايضا على «الاخوان المسلمين»، بصفتهم المرشحين الدائمين لتولّي السلطة هذه. والمسؤولية ليس بمعنى اشتراكهم او قيادتهم لحدث كهذا. فهذه مهمة «قذرة» يتكفّل بها غوغاء المجتمع الذي اصبح اكثر تعصبا من «الاخوان». الشباب الذين هاجموا مسيحيي قرية بمها عاطلون عن العمل، خريجو المدرسة الدينية في القرية، وجلّهم تفوّق على «الاخوان» في عصبيتهم الدينية. فالطلب على العصبية هذه يتجاوز العرض. لذلك فهم معفون من المهام المسوّدة لصورتهم. خاصة وهم في موقع القيادة الأقدر تنظيما وإقناعا من بين المجموعات المعارضة الاخرى.<br />انما مسؤولية «الاخوان المسلمين» تقع في مكان آخر. في تلك اللامبالاة المريبة، تجاه الحدث الطائفي في بمها. فأثناء حصوله، كان «الاخوان المسلمين» يخوضون معركة انتخابات مجلس الشورى (او بالأحرى إختبار انتخابات الشورى). وذلك ببرنامج يقولون فيه عن الاقباط آيات من التآخي والوحدة والشراكة والمصير. من بينها «عدم السماح لأي نشاط يؤدي الى اثارة مشاعر التفرقة الدينية...» أو «عدم السماح لأي محاولات تؤدي لإثارة مشاعر التفرقة والتعصب الطائفي بين المصريين»... الفيض من الود هذا لم يجد لنفسه ترجمة عملية عند اول حدث حصل اثناء خوض الانتخابات الشورية بناء على هذا البرنامج نفسه. كأنه حدث عادي، وليس الحدث الطائفي السبعين، والفرصة متاحة للتعبير عن صدق برنامجهم. سلوك اكثر من «عادي»: ان يكون القول على بُعد سنوات ضوئية من الفعل.<br />اما غير البديهي في هذا الموضوع، فيطلع عليك لو قارنتَ ردة فعل «الاخوان المسلمين» تجاه الحدث الطائفي هذا بأية واقعة من وقائع «حجاب» المرأة. واقعة عدم إستلطاف وزير الثقافة فاروق حسني للحجاب مثلا: جنّ جنون «الاخوان المسلمين» وخاضوا حملة شرسة ضد الوزير، أرغم اثرها على الاعتذار... صخب مجنون على تعليق الوزير السلبي ضد الحجاب، وصمت مطبق حول حدث طائفي يحمل النذير... هذا ما يَشي بعدم جدية «الاخوان المسلمين». فبين الصراع الطائفي العنيف الذي يهدد نسيج المجتمع بأكمله وبين هندام المرأة، بالتأكيد الاولوية ليست للأخير. ولكن ماذا تفعل بإيديولوجيا معطوفة على صراع على السلطة؟<br />الاقباط اكبر جماعة مسيحية في الشرق، واقدمها. انهم شهادة على مصر، على مصرية مصر. ويتآمر المسلمون المصريون على انفسهم، لو تركوهم عرضة لإستنزاف روحي يفضي بهم الى احد المنفَيَين... في الداخل كما في الخارج."
