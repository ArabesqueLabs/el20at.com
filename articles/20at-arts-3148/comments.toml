text = "فكرة القصه الاساسيه خياليه جدا راجل ايه ده اللى يفضل يحي نفس الست اكتر من خمسين سنه؟؟؟؟؟؟؟؟؟؟؟؟ ده الراجل بيتجوز من هنا وسنه ويبقى عاوز يطلق مراته ويطلع فيع الققط الفاطسه ويعرف عليها 100 واحدة( احتمال فضل يحبها لانه ما اتجوزهاش)"
