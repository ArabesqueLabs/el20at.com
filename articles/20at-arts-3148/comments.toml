subject = "من اجمل ما يكون"
author = "خلود صلاح"
posted = "2007-02-27"
text = "السلام عليكم<br />ازيك يا احمد<br />الموضوع عجبنى جدا جدا واكتر حاجة حلوة فيها عجبنى الحب لذلت الحب<br />بس عارف من اجمل مايكون ان الواحد يكون حر من غير حب رابطة بس الاحلى فعلا ان يكون فى حب بجد مش كدة وكدة<br />لحب الى للاسف مش بنشوفه غير فى الروايات والقصص وافلام السينما وبس"
